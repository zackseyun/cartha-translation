  text: וַ/יַּגֵּ֨ד לָ/כֶ֜ם אֶת בְּרִית֗/וֹ אֲשֶׁ֨ר צִוָּ֤ה אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת עֲשֶׂ֖רֶת הַ/דְּבָרִ֑ים וַֽ/יִּכְתְּבֵ֔/ם עַל שְׁנֵ֖י לֻח֥וֹת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/013.yaml
  text: And he declared to you his covenant[a], which he commanded you to do, the Ten Words; and he wrote them on two tablets of stone.
translation:
  language: tl
  text: At ipinahayag niya sa inyo ang kanyang tipan na iniutos niyang inyong gawin—ang Sampung Salita[a]—at isinulat niya ang mga iyon sa dalawang tapyas na bato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang Sampung Salita”; ayon sa tradisyon, “ang Sampung Utos.”
    reason: Ipinapakita ang literal na katawagan sa Hebreo at ang pamilyar na tradisyonal na salin.
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: ipinahayag
  rationale: Ang Hifil ng נגד ay nangangahulugang ipaalam o ipahayag. Ang “ipinahayag” ay natural sa makabagong Filipino at nagpapanatili ng pormal na himig ng konteksto ng tipan.
- source_word: בְּרִיתוֹ
  choice: ang kanyang tipan
  rationale: Ang “tipan” ang malinaw at kinikilalang katumbas ng בְּרִית, at pinananatili nito ang diwa ng isang nagbubuklod na ugnayan at pananagutan.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם לַעֲשׂוֹת
  choice: na iniutos niyang inyong gawin
  rationale: Tuwirang sinasalamin ng “gawin” ang לַעֲשׂוֹת at hindi ito pinapakinis bilang “sundin” o “tuparin,” bagaman maaaring ipahiwatig ng konteksto ang mga iyon.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: ang Sampung Salita
  rationale: Literal na tinutukoy ng pariralang Hebreo ang “sampung salita.” Pinananatili ito sa pangunahing teksto, samantalang inilalagay sa talababa ang nakaugaliang “Sampung Utos.”
- source_word: וַיִּכְתְּבֵם
  choice: at isinulat niya ang mga iyon
  rationale: Ang כתב ay karaniwang pandiwang “sumulat.” Ang “isinulat” ay tuwiran at hindi nagdaragdag ng mas tiyak na ideya ng pag-ukit na hindi tahasang hinihingi ng pandiwa.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: sa dalawang tapyas na bato
  rationale: Ang “dalawang tapyas na bato” ay malinaw at likas na Filipino para sa dalawang tabletang yari sa bato, nang hindi gumagamit ng di-gaanong karaniwang hiram na salita.
theological_decisions:
- issue: Pagkakasalin sa עֲשֶׂרֶת הַדְּבָרִים
  choice: ang Sampung Salita
  alternative: ang Sampung Utos
  rationale: Ang tekstong Hebreo mismo ay gumagamit ng “sampung salita,” hindi ng karaniwang salitang Hebreo para sa “mga utos.” Kaya pinananatili sa teksto ang sariling tawag ng pinagmulan, habang kinikilala sa talababa ang tradisyonal at pamilyar na katawagang “Sampung Utos.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga gitling na em dash upang malinaw na ipakitang ang “Sampung Salita” ay paliwanag sa nilalaman ng tipan, habang pinananatili ang ugnayang appositional ng Hebreo.
