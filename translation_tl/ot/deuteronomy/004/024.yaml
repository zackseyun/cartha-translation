translation:
  language: tl
  text: Sapagkat si Yahweh, ang iyong Diyos, ay isang apoy na tumutupok; siya ay isang mapanibughuing Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang masigasig na Diyos.” Idinidiin ng Hebreo ang eksklusibong pag-aangkin ni Yahweh sa katapatan ng kaniyang bayan sa tipan, lalo na sa konteksto ng pagsamba sa mga diyus-diyosan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng naunang babala at likas na dumadaloy sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang pinananatili ang anyong paari at ang isahang pakikipag-usap sa Israel.
- source_word: אֵשׁ אֹכְלָה
  choice: apoy na tumutupok
  rationale: Natural at malinaw sa Tagalog habang pinananatili ang matingkad na metapora ng apoy na lumalamon o umuubos.
- source_word: הוּא
  choice: ay
  rationale: Naipahahayag ng panandang panaguri ang pagkakakilanlan sa natural na Tagalog; hindi kailangang ulitin ang panghalip.
- source_word: אֵל
  choice: Diyos
  rationale: Ang אֵל ay titulong tumutukoy sa Diyos at nasa aposisyon sa naunang paglalarawan.
- source_word: קַנָּא
  choice: mapanibughuin
  rationale: Pinananatili ang diwa ng eksklusibong pag-angkin ni Yahweh sa tipan at ang hindi niya pagtanggap sa karibal na pagsamba.
theological_decisions:
- issue: Paglalarawan sa banal na paninibugho
  choice: isang mapanibughuing Diyos
  alternative: isang masigasig na Diyos
  rationale: Sa konteksto ng babala laban sa idolatriya, higit na pinananatili ng “mapanibughuin” ang relasyonal at eksklusibong puwersa ng Hebreo kaysa sa “masigasig,” nang hindi pinapawi ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mapanibughuin” upang mapanatili ang tradisyonal ngunit malinaw na wikang panrelihiyon; ipinaliliwanag ng talababa ang kahulugang kaugnay ng tipan.
