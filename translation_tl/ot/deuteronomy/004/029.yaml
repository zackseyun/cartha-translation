  text: וּ/בִקַּשְׁתֶּ֥ם מִ/שָּׁ֛ם אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/מָצָ֑אתָ כִּ֣י תִדְרְשֶׁ֔/נּוּ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/029.yaml
  text: But from there you will seek Yahweh your God[a], and you will find him[b], if you seek him with all your heart and with all your soul.
translation:
  language: tl
  text: Ngunit mula roon ay hahanapin ninyo si Yahweh na inyong Diyos, at matatagpuan mo siya[a], kung hahanapin mo siya nang buong puso at nang buong pagkatao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nagpapalit dito ang Hebreo mula sa “hahanapin ninyo” na maramihan tungo sa “matatagpuan mo” at “hahanapin mo” na isahan; kapuwa tumutukoy sa Israel.
    reason: textual_grammar
  - marker: b
    text: Ang “pagkatao” ay maaari ding isaling “kaluluwa” o “buhay”; ang Hebreong nefesh ay madalas tumukoy sa buong nabubuhay na sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם מִשָּׁם
  choice: Ngunit mula roon ay hahanapin ninyo
  rationale: 'Ang pang-ugnay at pandiwa ay nagpapatuloy sa babala sa naunang konteksto na may hinaharap na diwa. Pinananatili ng “mula roon” ang lokatibong kahulugan: mula sa pagkakawatak-watak sa mga bansa.'
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: si Yahweh na inyong Diyos
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang pangalang tipan na יְהוָה. Ginamit ang “inyong” upang natural na umayon sa pambungad na pandiwang maramihan, bagaman isahan ang hulaping Hebreo rito bilang kolektibong pagtukoy sa Israel.
- source_word: וּמָצָאתָ
  choice: at matatagpuan mo siya
  rationale: Ang מָצָא sa kontekstong ito ay nangangahulugang matagumpay na pagkakatagpo sa Diyos. Ipinahihiwatig ang layong “siya” mula sa naunang parirala; pinananatili ng “mo” ang aktuwal na paglipat ng tekstong Hebreo mula maramihan tungo sa isahan.
- source_word: כִּי
  choice: kung
  rationale: Ipinakikilala rito ng כִּי ang kondisyon ng pagkakatagpo. Hindi nito pinatitiyak nang lampas sa Hebreo ang katuparan gaya ng maaaring gawin ng “kapag.”
- source_word: תִדְרְשֶׁנּוּ
  choice: hahanapin mo siya
  rationale: Sa kontekstong pangtipan, ang דרש ay masigasig at buong-loob na paghahanap sa Diyos, hindi lamang pagtatanong tungkol sa kanya.
- source_word: בְּכָל לְבָבְךָ
  choice: nang buong puso
  rationale: Ang לֵבָב ay tumutukoy sa panloob na pagkatao—isip, kalooban, at damdamin. Ang “buong puso” ay natural at tumpak na idyomang Filipino.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: at buong pagkatao
  rationale: Ang נֶפֶשׁ ay maaaring tumukoy sa buhay, sarili, o buong nabubuhay na persona. Ang “buong pagkatao” ay malinaw sa modernong Filipino at naiiwasang paliitin ang salita sa isang hiwalay na espirituwal na bahagi lamang.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ng Diyos ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang katangian nito bilang pangalang tipan nang hindi pinapalitan ng titulo.
- issue: Kahulugan ng נֶפֶשׁ sa pormula ng ganap na debosyon
  choice: buong pagkatao
  alternative: buong kaluluwa; buong buhay
  rationale: Saklaw ng נֶפֶשׁ ang buhay o buong sarili. Sa tambalang “buong puso at buong pagkatao,” malinaw ang panawagan sa lubos na debosyon habang ang tradisyonal na “kaluluwa” ay inilalagay sa talababa bilang tunay na alternatibo.
- issue: Paglipat mula pangmaramihan tungo sa pang-isahan
  choice: “hahanapin ninyo” pagkatapos ay “matatagpuan mo … hahanapin mo”
  alternative: Gawing pawang pangmaramihan para sa estilistikong pagkakapare-pareho
  rationale: Talagang nagpapalit ang Masoretic Text mula ikalawang panauhang maramihan sa unang pandiwa tungo sa isahan sa kasunod na mga anyo. Pinananatili ang pagbabagong ito bilang kolektibo at indibidwal na pagtukoy sa Israel sa halip na pakinisin nang tahimik.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pangalang “Yahweh,” ang lokatibong “mula roon,” ang kondisyunal na “kung,” at ang kapansin-pansing paglipat ng bilang sa Hebreo. Iniwasan ang labis na teknikal o sektaryong pananalita.
