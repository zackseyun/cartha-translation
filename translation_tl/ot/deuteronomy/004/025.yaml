  source_fidelity: Tumpak sa kabuuan ang pagsunod sa Hebreo, kabilang ang paglipat mula sa isahang kausap sa unang pandiwa tungo sa maramihang kausap sa mga kasunod na pandiwa. Gayunman, ang “nagkaanak ka ng mga anak at mga apo” ay inuulit ang kahulugan ng nagkaanak at mga anak at hindi likas na katumbas ng parirala sa pinagmulan.
  naturalness: Kailangan ang maliit ngunit mahalagang pag-aayos para maging natural ang modernong Tagalog. Ang “nagkaroon ka ng mga anak at mga apo” ang malinaw at idiomatikong pahayag. Inihanay rin ang mga pandiwa sa kondisyunal na panghinaharap na daloy ng babala.
  terminology: Ang “larawang inukit,” “sa paningin ni Yahweh na inyong Diyos,” at “mga anak at mga apo” ay angkop. Pinanatili ang Yahweh at ang pangwakas na gitling, dahil nagpapatuloy ang pangungusap sa susunod na talata.
  issues:
