language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי תוֹלִ֤יד בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים וְ/נוֹשַׁנְתֶּ֖ם בָּ/אָ֑רֶץ וְ/הִשְׁחַתֶּ֗ם וַ/עֲשִׂ֤יתֶם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל וַ/עֲשִׂיתֶ֥ם הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/025.yaml
  text: When you father children and grandchildren[a], and you have grown old in the land, and you act corruptly and make a carved image in the form of anything, and do what is evil in the eyes of Yahweh your God[c][b], provoking him to anger—
translation:
  language: tl
  text: Kapag nagkaroon ka ng mga anak at mga apo[a], at tumanda na kayo sa lupain[b], at nagpakatiwali kayo at gumawa ng larawang inukit sa anyo ng anumang bagay[c], at gumawa kayo ng masama sa paningin ni Yahweh na inyong Diyos, at sa gayon ay galitin ninyo siya—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga anak na lalaki at mga apong lalaki.” Panlalaki ang mga katawagang Hebreo, ngunit malamang na pangkalahatang tumutukoy rito ang mga ito sa mga supling sa magkakasunod na salinlahi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “matagal na kayong naninirahan sa lupain.” Maaaring idiin ng pandiwang Hebreo ang pagtanda o ang matagal nang pagkakapanirahan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “na kawangis ng anumang bagay” o “anumang anyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Sa kontekstong ito, nagpapakilala ito ng pangyayari sa hinaharap na hahantong sa kapahayagan sa kasunod na talata, hindi ng payak na dahilan.
- source_word: תוֹלִיד
  choice: nagkaanak ka
  rationale: Natural na modernong Tagalog ito para sa Hiphil ng ילד sa isahang kausap; naihahatid nito ang pagkakaroon ng mga anak nang hindi gumagamit ng masyadong teknikal o luma nang pananalita.
- source_word: בָּנִים וּבְנֵי בָנִים
  choice: mga anak at mga apo
  rationale: Bagaman panlalaki ang anyo ng mga salitang Hebreo, tumutukoy rito ang mga ito sa mga supling sa magkasunod na salinlahi.
- source_word: וְנוֹשַׁנְתֶּם בָּאָרֶץ
  choice: tumanda na kayo sa lupain
  rationale: Pinananatili nito ang larawan ng pagtanda habang ipinahihiwatig ang matagal na paninirahan at pagkakapanatag sa lupain.
- source_word: וְהִשְׁחַתֶּם
  choice: nagpakatiwali kayo
  rationale: Ipinapahayag nito ang kusang pagkilos nang tiwali, lalo na ang katiwaliang kaugnay ng pagsamba sa diyus-diyosan, nang hindi nagdaragdag ng tahasang layon na wala sa Hebreo.
- source_word: פֶּסֶל
  choice: larawang inukit
  rationale: Kongkreto at malapit ito sa kahulugan ng isang imaheng hinubog sa pag-ukit; hindi nito agad ipinapalit ang mas interpretatibong salitang 'diyus-diyosan.'
- source_word: תְּמוּנַת כֹּל
  choice: sa anyo ng anumang bagay
  rationale: Pinananatili nito kapuwa ang ideya ng representasyon o anyo at ang saklaw na walang ibinubukod.
- source_word: הָרַע בְּעֵינֵי
  choice: ang masama sa paningin ni
  rationale: Natural sa Tagalog at pinananatili ang Hebreong metapora ng pagsusuri 'sa mga mata' ng isang tao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לְהַכְעִיסוֹ
  choice: anupat ginalit ninyo siya
  rationale: Ipinakikita ng 'anupat' ang posibleng ugnayang bunga ng masasamang gawa, habang malinaw na naihahatid ang causative na pagpapagalit sa Diyos.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tahasang nasa Hebreo; ang transliterasyong 'Yahweh' ay hindi nagpapalit dito ng titulo.
- issue: Panlalaking katawagan sa mga inapo
  choice: mga anak at mga apo
  alternative: mga anak na lalaki at mga apong lalaki
  rationale: Sa babalang ito sa buong bayang tipan, ginagamit ang panlalaking mga katawagan bilang pangkalahatang pagtukoy sa mga supling sa mga salinlahi; hindi hinihingi ng konteksto na mga lalaki lamang ang tinutukoy.
- issue: Layunin o bunga sa לְהַכְעִיסוֹ
  choice: anupat ginalit ninyo siya
  alternative: upang galitin ninyo siya
  rationale: Maaaring ipahayag ng infinitive ang layunin o ang bunga. Pinipili ng salin ang natural na pagbasa bilang bunga ngunit hindi ipinagpapalagay na tahasang layunin nilang galitin ang Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang paglipat mula sa isahang “ka” tungo sa maramihang “kayo/ninyo” na nasa Hebreo at ang pangwakas na gitling, sapagkat nagpapatuloy ang pangungusap sa susunod na talata.
