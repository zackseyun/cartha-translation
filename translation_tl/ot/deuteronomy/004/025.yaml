    rationale: Ang “nagkaanak” ay nangangahulugan nang magkaroon ng anak, kaya ang kasunod na “ng mga anak” ay hindi kailangang pag-uulit. Hindi rin ito ang pinakamalinaw na Tagalog na paghahayag ng בָּנִים וּבְנֵי בָנִים.
  - severity: low
    issue: Hindi magkakatugma ang aspekto ng “gumawa” at “ginawa ninyo” sa loob ng kondisyunal na babala.
    rationale: Ang “gumawa kayo” ay higit na maayos na kaugnay ng “Kapag” at ng mga sumusunod na panghinaharap na pangyayari.
