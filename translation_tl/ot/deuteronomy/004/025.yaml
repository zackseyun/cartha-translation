revisions:
- from: Kapag nagkaanak ka ng mga anak at mga apo[a], at tumanda na kayo sa lupain[b], at nagpakatiwali kayo at gumawa ng larawang inukit sa anyo ng anumang bagay[c], at ginawa ninyo ang masama sa paningin ni Yahweh na inyong Diyos, anupat ginalit ninyo siya—
  to: Kapag nagkaroon ka ng mga anak at mga apo[a], at tumanda na kayo sa lupain[b], at nagpakatiwali kayo at gumawa ng larawang inukit sa anyo ng anumang bagay[c], at gumawa kayo ng masama sa paningin ni Yahweh na inyong Diyos, at sa gayon ay galitin ninyo siya—
