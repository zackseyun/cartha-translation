source:
  edition: WLC
  text: בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בַּ/גַּ֗יְא מ֚וּל בֵּ֣ית פְּע֔וֹר בְּ/אֶ֗רֶץ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן אֲשֶׁ֨ר הִכָּ֤ה מֹשֶׁה֙ וּ/בְנֵֽי יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/046.yaml
  text: beyond the Jordan[a], in the valley opposite Beth-peor, in the land of Sihon king of the Amorites, who lived in Heshbon, whom Moses and the sons of Israel struck down when they came out from Egypt.
translation:
  language: tl
  text: sa ibayo ng Jordan, sa lambak na nasa tapat ng Bet-peor, sa lupain ni Sihon, hari ng mga Amoreo na naninirahan sa Hesbon, na siyang pinabagsak ni Moises at ng mga anak ni Israel[a] nang lumabas sila mula sa Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “mga Israelita.” Literal na anyo sa Hebreo: “mga anak na lalaki ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: sa ibayo ng Jordan
  rationale: Ipinahahayag ng parirala ang pook sa kabilang panig ng Jordan mula sa pananaw ng nagsasalita; likas at maikli sa Filipino ang “sa ibayo ng Jordan.”
- source_word: בַּגַּיְא
  choice: sa lambak
  rationale: Ang גַּיְא ay lambak o bangin; ang “lambak” ang mas pangkalahatan at angkop sa heograpikong paglalarawan.
- source_word: מוּל
  choice: sa tapat ng
  rationale: Tumutukoy ang מוּל sa posisyong kaharap o katapat ng isang lugar.
- source_word: בֵּית פְּעוֹר
  choice: Bet-peor
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa karaniwang transliterasyong Filipino sa halip na isalin ang mga bahagi ng pangalan.
- source_word: בְּאֶרֶץ סִיחֹן
  choice: sa lupain ni Sihon
  rationale: Maaaring tumukoy ang אֶרֶץ sa lupain o nasasakupan; malinaw at likas dito ang “lupain.”
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: hari ng mga Amoreo
  rationale: Pinananatili nito ang pagkakakilanlan kay Sihon bilang hari ng bayang Amoreo.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: Nanirahan siya sa Hesbon
  rationale: Ang participle יוֹשֵׁב ay nagpapahayag ng paninirahan. Hinati sa bagong pangungusap upang maging malinaw at likas sa Filipino nang hindi binabago ang ugnayan nito kay Sihon.
- source_word: אֲשֶׁר הִכָּה
  choice: siya ang pinabagsak
  rationale: Sa konteksto ng digmaan, ang נכה ay nangangahulugang hampasin o pabagsakin. Ipinakikita ng “pinabagsak” ang pagkatalo ni Sihon nang hindi basta pinapahina sa “tinalo.”
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: at ng mga anak ni Israel
  rationale: Karaniwang kolektibong katawagan ang parirala sa mga inapo o sambayanan ni Israel. Pinananatili ng “mga anak ni Israel” ang anyo at tradisyonal na diwa, habang inilalagay sa talababa ang literal na kasariang panlalaki at ang idiomatikong alternatibo.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: nang lumabas sila mula sa Ehipto
  rationale: Ipinahahayag ng infinitive construct na may בְּ ang panahong kasabay ng pagkilos; natural itong isalin sa “nang lumabas sila.”
theological_decisions:
- issue: Ang may kasariang kolektibong katawagan na וּבְנֵי יִשְׂרָאֵל
  choice: at ng mga anak ni Israel
  alternative: at ng mga Israelita; literal, at ng mga anak na lalaki ni Israel
  rationale: Ang בְּנֵי ay morpolohikal na panlalaking maramihan ngunit ginagamit dito bilang nakaugaliang kolektibong katawagan sa sambayanan. Ang “mga anak ni Israel” ay nagpapanatili sa larawan ng pinagmulang angkan at hindi naglilimita sa tinutukoy sa mga lalaking Israelita lamang; nililinaw ng talababa ang literal na anyo at idiomatikong kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Bet-peor,” “Hesbon,” “Sihon,” at “Amoreo” bilang mga transliterasyong angkop sa Filipino. Hinati ang mahabang sugnay na Hebreo sa dalawang pangungusap para sa linaw, ngunit pinanatili ang lahat ng ugnayang pangheograpiya at pangkasaysayan. Inilipat ang talababa sa pariralang aktuwal nitong nililinaw, yamang ang ibinigay na marker pagkatapos ng “Jordan” sa English consultation layer ay hindi tumutugma sa nilalaman ng talababa.
