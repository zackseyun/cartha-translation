base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/040.yaml
  text: So you shall keep his statutes and his commandments that I am commanding you today[a], so that it may go well with you and with your children after you[c][b], and so that you may prolong your days on the land that Yahweh your God is giving you for all your days.
translation:
  language: tl
  text: Kaya sundin mo ang kanyang mga tuntunin at mga utos na iniuutos ko sa iyo ngayon, upang mapabuti ang kalagayan mo at ng iyong mga anak na susunod sa iyo,[a] at upang mabuhay ka nang matagal sa lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos habang ikaw ay nabubuhay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak” ay maaari ring unawain bilang “mga anak na lalaki” o, sa mas malawak na diwa, “mga salinlahi.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa lahat ng iyong mga araw.” Maaari itong isalin bilang “sa buong buhay mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Kaya sundin mo
  rationale: Sa kontekstong tipan, ang שׁמר ay nangangahulugang sundin o tuparin. Ipinahihiwatig ng “Kaya” ang kaugnayan sa naunang pangangatwiran, at malinaw na naihahatid ng anyong pautos ang puwersa ng pandiwa rito.
- source_word: חֻקָּיו וְאֶת־מִצְוֺתָיו
  choice: ang kanyang mga tuntunin at mga utos
  rationale: Pinananatili ng “mga tuntunin” at “mga utos” ang pagkakaiba ng חֻקִּים at מִצְוֹת habang gumagamit ng likas at madaling maunawaang modernong Tagalog.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: na iniuutos ko sa iyo ngayon
  rationale: Ang kasalukuyang anyong “iniuutos” ay tumutugma sa participle at sa agarang sitwasyon ng pagsasalita.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: upang mapabuti ang kalagayan mo
  rationale: Ang idyomang ייטב לְ ay tumutukoy sa pagiging mabuti ng kalagayan o sa maayos na kahihinatnan, hindi lamang sa moral na kabutihan.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: at ng iyong mga anak na susunod sa iyo
  rationale: Maaaring tumukoy ang בָּנִים sa mga anak o mas malawak na mga salinlahi. Ang “mga anak” ay natural at hindi nililimitahan ang tinutukoy sa mga lalaki.
- source_word: וּלְמַעַן תַּאֲרִיךְ יָמִים
  choice: at upang mabuhay ka nang matagal
  rationale: Likas na ipinapahayag sa Tagalog ng “mabuhay nang matagal” ang Hebreong larawang literal na “pahabain ang mga araw.”
- source_word: עַל הָאֲדָמָה
  choice: sa lupain
  rationale: Sa konteksto, ang אֲדָמָה ay ang lupaing ipinagkakaloob ng Diyos. Mas likas sa Tagalog ang “sa lupain” kaysa literal na “sa ibabaw ng lupain.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: נֹתֵן לְךָ
  choice: ibinibigay sa iyo
  rationale: Pinananatili ng aspektong kasalukuyan ang participial na anyo at ang pagiging agaran ng ipinangakong kaloob.
- source_word: כָּל הַיָּמִים
  choice: sa habang panahon
  rationale: Ipinahahayag nito ang patuloy at hindi tinakdaang tagal, habang kinikilala sa talababa ang posibleng pag-unawang nakaugnay sa buong buhay ng kausap.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa Hebreong teksto; pinananatili itong pangalan sa halip na palitan ng titulong “PANGINOON.”
- issue: Saklaw ng pangakong כָּל הַיָּמִים
  choice: sa habang panahon
  alternative: sa buong buhay mo
  rationale: Maaaring tumukoy ang parirala sa patuloy na pag-aari ng lupain o sa buong haba ng buhay ng kausap. Hindi nilulutas nang palihim ang saklaw; inilalahad ang pangunahing pagbasa at itinatala ang alternatibo.
translation_notes:
  register: Makabago, marangal, at malinaw na Filipino. Ginamit ang pang-isahang “mo/iyo” sapagkat pang-isahan ang kausap sa Hebreo. Iniwasan ang sobrang literal na mga pariralang hindi likas sa Tagalog, ngunit pinanatili sa mga talababa ang mahahalagang leksikal at temporal na posibilidad.
