revisions:
- from: Kaya sundin mo ang kanyang mga tuntunin at mga utos na iniuutos ko sa iyo ngayon, upang mapabuti ang kalagayan mo at ng iyong mga anak na susunod sa iyo,[a] at upang mabuhay ka nang matagal sa lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos sa habang panahon.[b]
  to: Kaya sundin mo ang kanyang mga tuntunin at mga utos na iniuutos ko sa iyo ngayon, upang mapabuti ang kalagayan mo at ng iyong mga anak na susunod sa iyo,[a] at upang mabuhay ka nang matagal sa lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos habang ikaw ay nabubuhay.[b]
