lexical_decisions:
- source_word: תַּבְנִית
  choice: anyo
  rationale: Sa konteksto ng ipinagbabawal na mga larawang sinasamba, tumutukoy ito sa nakikitang anyo o representasyon. Pinananatili ng “anyo” ang pag-uulit at hindi nito nililimitahan ang kahulugan sa isang tiyak na uri ng imahen.
- source_word: כָּל
  choice: alinmang
  rationale: Kasama ng pangngalang isahan, likas na ipinahahayag ng “alinmang” ang sinumang miyembro ng isang uri sa konteksto ng pagbabawal.
- source_word: בְּהֵמָה
  choice: hayop
  rationale: Malawak ang gamit ng salita rito para sa hayop sa lupa, hindi lamang para sa alagang hayop o ganado.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: na nasa lupa
  rationale: Pinananatili nito ang paghahati ng mga nilalang ayon sa kanilang kinaroroonan at ang kaibahan sa kalangitan at tubig sa mga kalapit na talata.
- source_word: צִפּוֹר כָּנָף
  choice: ibong may pakpak
  rationale: Tuwirang pinananatili ang paglalarawan ng Hebreo habang nananatiling natural at malinaw sa modernong Tagalog.
- source_word: תָּעוּף
  choice: na lumilipad
  rationale: Ang pangkasalukuyang anyo ay natural para sa pangkalahatang paglalarawan ng isang uri ng nilalang.
- source_word: בַּשָּׁמָיִם
  choice: sa kalangitan
  rationale: Sa kontekstong ito, ang Hebreong maramihang anyo ay tumutukoy sa nakikitang himpapawid kung saan lumilipad ang mga ibon; ang “kalangitan” ay natural at may marangal na himig.
