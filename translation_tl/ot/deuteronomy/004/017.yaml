translation:
  language: tl
  text: ang anyo ng alinmang hayop na nasa lupa[a], ang anyo ng alinmang ibong may pakpak na lumilipad sa kalangitan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “wangis” o “larawan” sa halip na “anyo” (תַּבְנִית); tumutukoy ito sa isang representasyong ginawa upang sambahin.
    reason: lexical_alternative
  - marker: b
