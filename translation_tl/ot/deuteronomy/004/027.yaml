  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הֵפִ֧יץ יְהוָ֛ה אֶתְ/כֶ֖ם בָּ/עַמִּ֑ים וְ/נִשְׁאַרְתֶּם֙ מְתֵ֣י מִסְפָּ֔ר בַּ/גּוֹיִ֕ם אֲשֶׁ֨ר יְנַהֵ֧ג יְהוָ֛ה אֶתְ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/027.yaml
  text: And Yahweh will scatter you among the peoples[a], and you will be left few in number among the nations where Yahweh will drive you.
translation:
  language: tl
  text: Ikakalat kayo ni Yahweh sa gitna ng mga bayan, at iilan na lamang kayo sa gitna ng mga bansa kung saan kayo itataboy[a] ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aakayin.” Ang pandiwang Hebreo ay maaaring mangahulugang “akayin” o “itaboy”; pinili rito ang “itaboy” dahil paghatol at pagkakatapon ang konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵפִיץ
  choice: Ikakalat
  rationale: Ang Hiphil ng פוץ ay nagsasaad ng pagpapangalat. Likas at malinaw sa modernong Tagalog ang “ikakalat” sa konteksto ng paghatol at pagkakatapon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: בָּעַמִּים
  choice: sa gitna ng mga bayan
  rationale: Ang עַמִּים ay tumutukoy sa mga pangkat ng tao o mga bayan. Pinananatili ng “mga bayan” ang bahagyang pagkakaiba nito sa גּוֹיִם na kasunod.
- source_word: וְנִשְׁאַרְתֶּם מְתֵי מִסְפָּר
  choice: at iilan na lamang kayo
  rationale: Natural na ipinahahayag nito sa Tagalog ang resultang napakakaunti na lamang ang matitira, nang hindi isinasalin nang mekanikal ang Hebreong idyoma.
- source_word: בַּגּוֹיִם
  choice: sa gitna ng mga bansa
  rationale: Sa kontekstong ito, ang גּוֹיִם ay mga banyagang bansa; hindi kailangan ang mas teolohikal o makitid na katawagang “mga Hentil.”
- source_word: אֲשֶׁר יְנַהֵג
  choice: kung saan kayo itataboy
  rationale: Maaaring mangahulugan ang נהג na “akayin” o “itaboy.” Ang “itataboy” ay angkop sa konteksto ng sapilitang pagkakatapon bilang paghatol.
- source_word: שָׁמָּה
  choice: kung saan
  rationale: Ang lokatibong diwa ng “doon” ay likas na naipapahayag sa sugnay na “kung saan”; magiging paulit-ulit ang pagdaragdag pa ng “doon.”
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng נהג sa konteksto ng paghatol
  choice: itataboy
  alternative: aakayin
  rationale: Hindi ganap na inaalis ang leksikal na posibilidad na “akayin,” ngunit ipinahihiwatig ng konteksto ng pagkalat at pagkakatapon ang sapilitang pagdadala; kaya “itataboy” ang nasa teksto at itinatala sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mga bayan” at “mga bansa” upang mapanatili hangga't maaari ang pagkakaiba ng עַמִּים at גּוֹיִם. Inilagay ang talababa sa “itataboy,” ang mismong salitang may leksikal na alternatibo.
