  text: וְ/טַפְּ/כֶם֩ אֲשֶׁ֨ר אֲמַרְתֶּ֜ם לָ/בַ֣ז יִהְיֶ֗ה וּ֠/בְנֵי/כֶם אֲשֶׁ֨ר לֹא יָדְע֤וּ הַ/יּוֹם֙ ט֣וֹב וָ/רָ֔ע הֵ֖מָּה יָבֹ֣אוּ שָׁ֑מָּ/ה וְ/לָ/הֶ֣ם אֶתְּנֶ֔/נָּה וְ/הֵ֖ם יִירָשֽׁוּ/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/039.yaml
  text: And your little ones[a], whom you said would become plunder, and your children, who today do not know good or evil—they shall go in there, and I will give it to them[c][b], and they shall possess it.
translation:
  language: tl
  text: At ang maliliit ninyong anak, na sinabi ninyong magiging samsam, at ang inyong mga anak na sa araw na ito ay hindi pa nakaaalam ng mabuti at masama[a]—sila ang papasok doon. Ibibigay ko sa kanila ang lupa, at aariin nila ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “hindi pa nakaaalam ng mabuti at masama” ay isang Hebreong paraan ng paglalarawan sa mga wala pang ganap na kakayahang kumilatis.
    reason: cultural_note
  - marker: b
    text: O “mamanahin nila ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: maliliit ninyong anak
  rationale: Tumutukoy ang טַף sa maliliit na anak o batang umaasa sa matatanda; pinananatili ng salin ang kanilang murang edad at kahinaan sa konteksto.
- source_word: לָבַז יִהְיֶה
  choice: magiging samsam
  rationale: Ang בַּז ay samsam na kinukuha ng kaaway. Likas at tuwiran sa Filipino ang “magiging samsam.”
- source_word: בְנֵיכֶם
  choice: inyong mga anak
  rationale: Bagaman maaaring literal na “mga anak na lalaki,” sa konteksto ay tumutukoy ito sa susunod na salinlahi; natural na saklaw iyon ng “mga anak” sa Filipino nang hindi nililimitahan sa kasarian.
- source_word: לֹא יָדְעוּ הַיּוֹם טוֹב וָרָע
  choice: sa araw na ito ay hindi pa nakaaalam ng mabuti at masama
  rationale: Pinananatili ang Hebreong tambalang “mabuti at masama” at ang pahiwatig ng hindi pa ganap na pagkilatis, nang hindi ito ginagawang tahasang doktrina tungkol sa kawalang-sala.
- source_word: שָׁמָּה
  choice: makapapasok doon
  rationale: Ang שָׁמָּה ay nagsasaad ng patungong kilos. Inihahayag ng “makapapasok doon” ang pagpasok sa lupa at ang kontekstuwal na pahintulot/pangako.
- source_word: אֶתְּנֶנָּה
  choice: Ibibigay ko sa kanila ang lupa
  rationale: Ang hulaping pambabae ay tumutukoy sa lupang pinag-uusapan; tahasang binanggit ang “lupa” upang maging malinaw at natural sa Filipino.
- source_word: יִירָשׁוּהָ
  choice: aangkinin nila iyon
  rationale: Maaaring mangahulugan ang ירשׁ ng pagmamana o pag-aari/pag-angkin. Ang “aangkinin” ay nagpapanatili sa malawak na diwa ng pagtanggap at paghawak sa lupa.
theological_decisions:
- issue: Ang kalagayan ng mga anak na “hindi pa nakaaalam ng mabuti at masama”
  choice: Panatilihin ang Hebreong pahayag bilang paglalarawan ng hindi pa ganap na pagkilatis.
  alternative: Isalin bilang tahasang kawalang-sala, kawalan ng pananagutan, o hindi pagkilala sa tama at mali.
  rationale: Hindi nilulutas ng mismong parirala ang mga usaping doktrinal tungkol sa kawalang-sala o edad ng pananagutan; kaya pinananatili ang teolohikal na pag-igting at hindi dinaragdagan ang teksto.
- issue: Saklaw ng בְנֵיכֶם
  choice: mga anak
  alternative: mga anak na lalaki
  rationale: Sa kontekstong kaagapay ng טַף at ng susunod na salinlahi, maaaring gamitin ang pangkalahatang “mga anak.” Hindi nito ginagawang doktrinal ang kasarian ng mga tatanggap ng lupa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “samsam” bilang karaniwang biblikal at malinaw na salita, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
