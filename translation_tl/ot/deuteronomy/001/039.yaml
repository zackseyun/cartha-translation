  naturalness: Marangal at malinaw ang Filipino. Ang “sila ang papasok doon” ay mas tuwiran at likas kaysa “sila ang makapapasok doon.”
  terminology: Ang “maliliit ninyong anak,” “samsam,” at “hindi pa nakaaalam ng mabuti at masama” ay angkop. Pinananatili ng talababa ang idyomang Hebreo nang hindi nagpapataw ng doktrina. Inayos ang talababa para hindi nito ilista bilang alternatibo ang salitang ginamit na sa pangunahing teksto.
