- from: At ang maliliit ninyong anak, na sinabi ninyong magiging samsam, at ang inyong mga anak na sa araw na ito ay hindi pa nakaaalam ng mabuti at masama[a]—sila ang makapapasok doon. Ibibigay ko sa kanila ang lupa, at aangkinin nila iyon.[b]
  to: At ang maliliit ninyong anak, na sinabi ninyong magiging samsam, at ang inyong mga anak na sa araw na ito ay hindi pa nakaaalam ng mabuti at masama[a]—sila ang papasok doon. Ibibigay ko sa kanila ang lupa, at aariin nila ito.[b]
  rationale: Pinalitan ang “makapapasok” ng “papasok” upang masaklaw nang walang dagdag na pahiwatig ang panghinaharap na pandiwa sa Hebreo. Pinalitan ang “aangkinin” ng “aariin” upang mas natural na ilarawan ang pagtanggap at pagmamay-ari ng lupang ibibigay ng Diyos. Inayos ang talababa b upang hindi maulit bilang alternatibo ang pangunahing salin.
