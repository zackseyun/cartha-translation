source:
  edition: WLC
  text: לֹֽא תַכִּ֨ירוּ פָנִ֜ים בַּ/מִּשְׁפָּ֗ט כַּ/קָּטֹ֤ן כַּ/גָּדֹל֙ תִּשְׁמָע֔וּ/ן לֹ֤א תָג֨וּרוּ֙ מִ/פְּנֵי אִ֔ישׁ כִּ֥י הַ/מִּשְׁפָּ֖ט לֵ/אלֹהִ֣ים ה֑וּא וְ/הַ/דָּבָר֙ אֲשֶׁ֣ר יִקְשֶׁ֣ה מִ/כֶּ֔ם תַּקְרִב֥וּ/ן אֵלַ֖/י וּ/שְׁמַעְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/017.yaml
  text: You shall not show partiality in judgment[a]; you shall hear the small and the great alike. You shall not be intimidated by any man, for the judgment belongs to God. And the matter that is too difficult for you, you shall bring to me[b], and I will hear it.
translation:
  language: tl
  text: Huwag kayong magpakita ng pagtatangi sa paghatol[a]. Pakinggan ninyo kapuwa ang hamak at ang dakila. Huwag kayong matakot sa harap ng sinumang tao[b], sapagkat sa Diyos ang paghatol. Ang usaping napakahirap para sa inyo ay dalhin ninyo sa akin, at diringgin ko iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “kilalanin ang mga mukha sa paghatol,” isang idyomang nangangahulugang magpakita ng pagkiling o paboritismo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “Huwag kayong magpasindak sa sinumang tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכִּירוּ פָנִים
  choice: magtatangi
  rationale: Ang literal na idyomang 'kilalanin ang mga mukha' ay tumutukoy sa pagkiling o pagtatangi sa paghatol. Natural at malinaw sa modernong Tagalog ang 'magtatangi.'
- source_word: בַּמִּשְׁפָּט
  choice: sa paghatol
  rationale: Tumutukoy ito sa gawaing hudisyal na pagdinig at pagpapasiya, hindi lamang sa abstraktong katarungan.
- source_word: כַּקָּטֹן כַּגָּדֹל
  choice: ang hamak at ang dakila
  rationale: Ipinapakita ng pares ang pagkakaiba ng mababa at mataas na katayuan sa lipunan. Pinananatili ng salin ang maikli at marangal na pagtutumbas.
- source_word: תִּשְׁמָעוּן
  choice: Pakinggan ninyo
  rationale: Sa kontekstong hudisyal, nangangahulugan itong bigyan ng pagdinig ang magkabilang uri ng tao o ang kanilang kaso.
- source_word: תָגוּרוּ מִפְּנֵי אִישׁ
  choice: Huwag kayong matakot sa harap ng sinumang tao
  rationale: Pinananatili nito ang posibleng tuwirang kahulugang 'matakot' at ang larawan ng pag-urong sa harap ng isang tao; ang diwa ng pananakot ay hindi isinasara bilang tanging pagbasa.
- source_word: כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא
  choice: sapagkat sa Diyos ang paghatol
  rationale: Direktang pinananatili ang pahayag na ang paghatol ay ukol o nabibilang sa Diyos, nang hindi dinaragdagan ang eksaktong paraan ng kanyang awtoridad.
- source_word: הַדָּבָר אֲשֶׁר יִקְשֶׁה מִכֶּם
  choice: Ang usaping napakahirap para sa inyo
  rationale: Sa legal na konteksto, ang דָּבָר ay isang usapin o kaso; ipinahihiwatig ng parirala ang bagay na hindi nila kayang lutasin.
- source_word: תַּקְרִבוּן אֵלַי
  choice: dalhin ninyo sa akin
  rationale: Natural na ipinapahayag nito ang Hiphil na 'ilapit' o 'iharap' ang usapin kay Moises.
- source_word: וּשְׁמַעְתִּיו
  choice: at diringgin ko iyon
  rationale: Ang hulapi ay pinakamalamang na tumutukoy sa usapin. Pinananatili ng 'diringgin' ang hudisyal na wika at hindi ito pinalalawak tungo sa 'pagpapasiyahan.'
theological_decisions:
- issue: Batayan ng awtoridad sa paghatol
  choice: Isinaling 'sapagkat sa Diyos ang paghatol.'
  alternative: Maaaring unawain na hahatulan ng Diyos ang mga hukom, o na ang batas na ginagamit nila ay mula sa Diyos.
  rationale: Ang Hebreo ay tuwirang nagsasaad lamang na ang paghatol ay sa Diyos. Pinananatili ang teolohikal na bigat at hindi nilulutas ang tiyak na saklaw nito.
- issue: Generic na אִישׁ
  choice: sinumang tao
  alternative: isang lalaki
  rationale: Bagaman panlalaki ang anyong gramatikal, generic ang gamit sa kontekstong ito. Ang 'sinumang tao' ay tumpak at natural sa Tagalog nang hindi nililimitahan ang utos sa isang kasarian.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang 'paghatol,' 'diringgin,' at balanseng pariralang 'hamak at dakila' upang mapanatili ang legal at solemneng himig nang hindi nagiging lipas o labis na teknikal.
