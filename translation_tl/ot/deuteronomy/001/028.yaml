base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/028.yaml
  text: Where are we going up? Our brothers have melted our hearts[a], saying, ‘The people are greater and taller than we are; the cities are great and fortified up to the heavens; and besides[c][b], we saw the sons of the Anakim there.’
translation:
  language: tl
  text: Saan ba tayo aahon? Pinanghinaan tayo ng loob ng ating mga kapatid[a] nang sabihin nila, ‘Ang mga tao roon ay mas malalaki at mas matatangkad kaysa sa atin. Malalaki ang kanilang mga lungsod, at ang mga tanggulan nito ay wari’y abot-langit[b]. Bukod pa rito, nakita namin doon ang mga Anakim[c].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tinunaw ng ating mga kapatid ang ating puso”; ibig sabihin, pinanghinaan nila tayo ng loob.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga lungsod na pinatibay hanggang sa langit,” isang eksaheradong paglalarawan sa napakataas at matitibay na mga tanggulan.
    reason: cultural_note
  - marker: c
    text: Maaari ring “mga anak ni Anak” o “mga inapo ni Anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה אֲנַחְנוּ עֹלִים
  choice: Saan ba tayo aahon?
  rationale: Ang interrogative na אָנָה ay nagtatanong ng patutunguhan, at ang עֹלִים ay ‘umaahon/pumapanhik.’ Natural sa Filipino ang ‘Saan ba tayo aahon?’ at pinananatili nito ang pagkilos na paakyat at ang pangamba ng tanong.
- source_word: אַחֵינוּ
  choice: ating mga kapatid
  rationale: Pinananatili ang literal at retorikal na ‘mga kapatid,’ na tumutukoy rito sa mga kapuwa Israelita.
- source_word: הֵמַסּוּ אֶת־לְבָבֵנוּ
  choice: Pinanghina ng loob ... ang ating loob
  rationale: Ang Hebreong larawan ay literal na ‘tinunaw ang ating puso,’ isang idyoma para sa pagkawala ng tapang. Ang ‘pinanghina ng loob’ ang malinaw at natural na katumbas sa modernong Filipino; inilalagay sa talababa ang literal na larawan.
- source_word: עַם גָּדוֹל וָרָם מִמֶּנּוּ
  choice: Ang mga tao roon ay mas malalaki at mas matatangkad kaysa sa atin
  rationale: Ipinahahayag ng גָּדוֹל ang laki at ng רָם ang taas. Ang pangmaramihang ‘mga tao roon’ ay natural sa Filipino para sa paghahambing ng pisikal na anyo ng isang pangkat.
- source_word: עָרִים גְּדֹלֹת וּבְצוּרֹת בַּשָּׁמָיִם
  choice: Malalaki ang kanilang mga lungsod at ang mga kuta nito ay abot-langit
  rationale: Ang ‘abot-langit’ ay likas na Filipino at pinananatili ang eksaheradong larawan ng napakataas o napakatibay na mga tanggulan, sa halip na patagin ito bilang ‘napakataas.’
- source_word: וְגַם
  choice: Bukod pa rito
  rationale: Ipinakikita ang pandagdag at papatinding puwersa ng וְגַם sa ulat.
- source_word: בְּנֵי עֲנָקִים
  choice: mga Anakim
  rationale: Ginagamit ang kinikilalang pangalang-etniko habang inilalagay sa talababa ang mas literal na ‘mga anak/angkan ni Anak.’
- source_word: רָאִינוּ שָׁם
  choice: nakita namin doon
  rationale: Natural na payak na naganap sa Filipino para sa ulat ng nakita ng mga espiya.
