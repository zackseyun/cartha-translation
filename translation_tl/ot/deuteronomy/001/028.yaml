revisions:
- from: Saan ba tayo aahon? Pinanghina ng loob ng ating mga kapatid ang ating loob[a] nang sabihin nila, ‘Ang mga tao roon ay mas malalaki at mas matatangkad kaysa sa atin. Malalaki ang kanilang mga lungsod at ang mga kuta nito ay abot-langit[b]. Bukod pa rito, nakita namin doon ang mga Anakim[c].’
  to: Saan ba tayo aahon? Pinanghinaan tayo ng loob ng ating mga kapatid[a] nang sabihin nila, ‘Ang mga tao roon ay mas malalaki at mas matatangkad kaysa sa atin. Malalaki ang kanilang mga lungsod, at ang mga tanggulan nito ay wari’y abot-langit[b]. Bukod pa rito, nakita namin doon ang mga Anakim[c].’
  rationale: Kinailangan ang ligtas na pagwawasto dahil may di-natural na sintaks sa idyomang “pinanghinaan ng loob” at dahil ang dating pagbanggit sa “mga kuta” ay maaaring maghiwalay sa mga ito mula sa mga lungsod na inilalarawan ng Hebreo. Pinanatili ang retorikal na lakas, ang direksiyong paakyat, ang hyperbole na “abot-langit,” at ang etnikong pangalang Anakim.
