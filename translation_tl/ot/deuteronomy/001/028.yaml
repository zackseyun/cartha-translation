translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘aahon’ upang mapanatili ang direksiyong paakyat ng Hebreo; ang idyomang ‘pinanghina ng loob’ ay inuuna para sa kalinawan, habang pinananatili sa talababa ang matingkad na larawang ‘tinunaw ang puso.’
