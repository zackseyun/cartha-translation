id: DEU.1.10
reference: Deuteronomy 1:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יְהוָ֥ה אֱלֹהֵי/כֶ֖ם הִרְבָּ֣ה אֶתְ/כֶ֑ם וְ/הִנְּ/כֶ֣ם הַ/יּ֔וֹם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/010.yaml
  text: Yahweh your God has multiplied you[a], and behold, today you are as numerous as the stars of the heavens.
translation:
  language: tl
  text: Pinarami kayo ni Yahweh na inyong Diyos, at narito, ngayon ay kasindami na kayo ng mga bituin sa langit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Sa konteksto, ang אֱלֹהִים ay tumutukoy sa iisang Diyos, at ang hulaping pangmaramihan ay tumutukoy sa buong bayang kinakausap.
- source_word: הִרְבָּה אֶתְכֶם
  choice: Pinarami kayo
  rationale: 'Ang Hiphil ng רבה ay may diwang sanhi: ginawa ni Yahweh na dumami ang bayang Israel.'
- source_word: וְהִנְכֶם
  choice: at narito
  rationale: Pinananatili nito ang pantawag-pansing lakas ng הִנֵּה at itinuturo ang kasalukuyang kalagayan ng mga kinakausap.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Natural na katumbas sa modernong Tagalog na nagpapanatili sa agarang panahong tinutukoy.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: kasindami ... ng mga bituin sa langit
  rationale: Ipinapahayag ng לָרֹב ang napakaraming bilang; ang hulmaing “kasindami ... ng” ay likas sa Tagalog at malinaw na pinananatili ang paghahambing.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “inyong Diyos” upang maging tahasan ang pangmaramihang kausap, samantalang likas na “kayo” ang ginamit sa iba pang bahagi. Walang talababa dahil ang ugnayan ng לָרֹב sa paghahambing ay malinaw at natural na naipahayag sa pangunahing teksto.
