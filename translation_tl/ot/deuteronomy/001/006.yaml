base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/006.yaml
  text: Yahweh our God spoke to us at Horeb[a], saying[b], “You have stayed at this mountain long enough.”
translation:
  language: tl
  text: 'Sinabi sa atin ni Yahweh, ang ating Diyos, sa Horeb[a]: “Sapat na ang pananatili ninyo sa bundok na ito.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, Horeb ang pangalang ginamit dito para sa bundok na iniuugnay rin sa Sinai.
    reason: cross_reference
  - marker: b
    text: O “Matagal na kayong nananatili sa bundok na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos bilang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Bagaman anyong maramihan ang batayang pangngalan, tumutukoy ito rito sa iisang Diyos ng Israel; natural sa Filipino ang “ating Diyos.”
- source_word: דִּבֶּר אֵלֵינוּ
  choice: Sinabi sa atin
  rationale: Ang literal na diwang “nagsalita sa atin” ay likas na naipahahayag sa Filipino bilang “sinabi sa atin” kapag sinusundan ng tuwirang sipi.
- source_word: בְּחֹרֵב
  choice: sa Horeb
  rationale: Lokasyon ang gamit ng pang-ukol; pinanatili ang pangalang Horeb at hindi ito itinugma sa Sinai.
- source_word: לֵאמֹר
  choice: ipinahihiwatig ng panipi
  rationale: Ang pormulang Hebreo na nagpapakilala ng sinabi ay natural na naihahatid sa Filipino sa pamamagitan ng pandiwang “sinabi” at tuwirang panipi, nang hindi inuulit ang “na sinasabi.”
- source_word: רַב לָכֶם שֶׁבֶת
  choice: Matagal na kayong nananatili
  rationale: Ipinahahayag ng idyoma ang sapat o labis nang tagal ng pananatili. Likas ito sa modernong Filipino at pinananatili ang kontekstuwal na diwa.
- source_word: בָּהָר הַזֶּה
  choice: sa bundok na ito
  rationale: Ang הַר ay “bundok,” at ang “sa” ang natural na pang-ukol para sa lokasyon ng kanilang pananatili.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Lakas ng idyomang רַב לָכֶם שֶׁבֶת
  choice: Matagal na kayong nananatili
  alternative: Sapat na ang pananatili ninyo; huwag na kayong manatili sa bundok na ito
  rationale: Ipinapakita ng pangunahing salin ang kahulugang ang tagal ay sapat na, ngunit hindi idinaragdag sa katawan ng talata ang tahasang utos na “huwag na,” na ipinahihiwatig lamang ng idyoma at konteksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “nananatili” upang ipahayag ang matagal na pamamalagi, at iniwasan ang hindi likas na pag-uulit na “sinabi ... na sinasabi.”
