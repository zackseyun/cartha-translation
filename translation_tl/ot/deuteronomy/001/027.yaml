  text: וַ/תֵּרָגְנ֤וּ בְ/אָהֳלֵי/כֶם֙ וַ/תֹּ֣אמְר֔וּ בְּ/שִׂנְאַ֤ת יְהוָה֙ אֹתָ֔/נוּ הוֹצִיאָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַשְׁמִידֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/027.yaml
  text: And you grumbled in your tents and said[a], ‘Because Yahweh hates us, he brought us out of the land of Egypt to give us into the hand of the Amorites[b], to destroy us.’
translation:
  language: tl
  text: At nagbulung-bulungan kayo sa inyong mga tolda at sinabi, “Dahil napopoot sa atin si Yahweh,[a] inilabas niya tayo mula sa lupain ng Ehipto upang ibigay tayo sa kamay ng mga Amoreo[b] upang lipulin nila tayo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa pagkapoot ni Yahweh sa atin”; idiomatikong isinalin bilang “Dahil napopoot sa atin si Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: O “upang ibigay tayo sa kapangyarihan ng mga Amoreo”; literal sa Hebreo, “upang ibigay tayo sa kamay ng mga Amoreo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרָגְנוּ
  choice: nagbulung-bulungan kayo
  rationale: Ipinahihiwatig ng pandiwang רגן ang pabulong at may hinanakit na pagrereklamo. Ang “nagbulung-bulungan” ay natural sa Filipino at pinananatili ang diwang hindi hayagang pagdaing.
- source_word: בְאָהֳלֵיכֶם
  choice: sa loob ng inyong mga tolda
  rationale: Tuwirang locative na salin na nagpapanatili sa kongkretong tagpuan ng mga tolda sa ilang.
- source_word: בְּשִׂנְאַת יְהוָה אֹתָנוּ
  choice: Dahil napopoot sa atin si Yahweh
  rationale: Ang בְּ kasama ng abstraktong pangngalang “pagkapoot” ay may diwang sanhi rito. Ginawang natural na sugnay sa Filipino nang hindi binabago ang paratang ng mga Israelita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: הוֹצִיאָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: inilabas niya tayo mula sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang “lupain ng Ehipto” at ang mahalagang pananalita tungkol sa Exodo.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: upang ibigay tayo sa kamay ng mga Amoreo
  rationale: Pinananatili ang malinaw na idyomang Hebreo na nangangahulugang isailalim sa kapangyarihan ng iba; ang kolektibong singular na אֱמֹרִי ay natural na isinaling maramihan.
- source_word: לְהַשְׁמִידֵנוּ
  choice: at lipulin tayo
  rationale: Ang Hiphil ng שׁמד ay tumutukoy sa ganap na pagwasak o pagpuksa. Ang “lipulin” ay malakas, dignificado, at likas sa konteksto.
theological_decisions:
- issue: Paglalarawan sa saloobin ni Yahweh sa Israel
  choice: 'Iniharap bilang mismong paratang ng bayan: “Dahil napopoot sa atin si Yahweh”'
  alternative: Ipaliwanag o pahinain ang pahayag na para bang tunay na ipinahahayag ng tagapagsalaysay na napopoot si Yahweh
  rationale: Bahagi ito ng siniping reklamo ng bayan, hindi pagpapatibay ng tagapagsalaysay. Pinananatili ng salin ang matinding paratang at ang tensiyong teolohikal nang walang idinagdag na pagpapaliwanag sa pangunahing teksto.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “tolda,” “nagbulung-bulungan,” at “lipulin” upang mapanatili ang kongkretong tagpuan, ang pabulong na pagrereklamo, at ang lakas ng banta. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
