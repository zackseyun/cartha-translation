revisions:
- from: At nagbulung-bulungan kayo sa loob ng inyong mga tolda at sinabi, “Dahil napopoot sa atin si Yahweh,[a] inilabas niya tayo mula sa lupain ng Ehipto upang ibigay tayo sa kamay ng mga Amoreo[b] at lipulin tayo.”
  to: At nagbulung-bulungan kayo sa inyong mga tolda at sinabi, “Dahil napopoot sa atin si Yahweh,[a] inilabas niya tayo mula sa lupain ng Ehipto upang ibigay tayo sa kamay ng mga Amoreo[b] upang lipulin nila tayo.”
  rationale: Pinalitan ang “at lipulin tayo” ng “upang lipulin nila tayo” upang maipakita sa natural na Filipino ang layuning nakakabit sa pagbibigay sa Israel sa kamay ng mga Amoreo, nang hindi binabago ang paratang na sinasabi ng bayan. Pinasimple rin ang “sa loob ng inyong mga tolda” bilang “sa inyong mga tolda,” na mas tuwirang tumutugma sa locative na Hebreo at nananatiling natural.
