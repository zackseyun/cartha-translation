  text: אֵ֣לֶּה הַ/דְּבָרִ֗ים אֲשֶׁ֨ר דִּבֶּ֤ר מֹשֶׁה֙ אֶל כָּל יִשְׂרָאֵ֔ל בְּ/עֵ֖בֶר הַ/יַּרְדֵּ֑ן בַּ/מִּדְבָּ֡ר בָּֽ/עֲרָבָה֩ מ֨וֹל ס֜וּף בֵּֽין פָּארָ֧ן וּ/בֵֽין תֹּ֛פֶל וְ/לָבָ֥ן וַ/חֲצֵרֹ֖ת וְ/דִ֥י זָהָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/001.yaml
  text: These are the words that Moses spoke to all Israel beyond the Jordan[a], in the wilderness, in the Arabah opposite Suph, between Paran, Tophel, Laban, Hazeroth[d][c][b], and Dizahab.
translation:
  language: tl
  text: Ito ang mga salitang sinabi ni Moises sa buong Israel sa ibayo ng Jordan[a], sa ilang, sa Araba[b] sa tapat ng Suf[c], sa pagitan ng Paran, Tofel, Laban, Hazerot, at Dizahab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kabila ng Jordan” o “sa kabilang panig ng Jordan.” Maaaring unawain ang pariralang Hebreo mula sa magkaibang pananaw na heograpiko.
    reason: lexical_alternative
  - marker: b
    text: Ang “Araba” ay katawagang heograpiko para sa rehiyon ng malawak na lambak o kapatagan; maaari rin itong isaling “kapatagan.”
    reason: cultural_note
  - marker: c
    text: Sa Hebreo, “Suf.” Itinuturing ito ng ilan na pangalan ng isang lugar; iniuugnay naman ito ng iba sa “Dagat ng mga Tambo,” ngunit wala rito ang salitang “dagat.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Ito ang mga salita
  rationale: Ipinapanatili nito ang panimulang, pantukoy na diwa ng אֵלֶּה at ang kahulugan ng דְּבָרִים bilang mga salitang binigkas sa kasunod na konteksto.
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: na sinabi ni Moises
  rationale: Likas sa modernong Tagalog ang “sinabi” para sa pormal na pahayag, at malinaw nitong inilalahad si Moises bilang tagapagsalita.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: sa buong Israel
  rationale: Ang “buong Israel” ay natural na tumutukoy sa kabuuan ng bayang Israel.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: sa ibayo ng Jordan
  rationale: Pinananatili ng “sa ibayo” ang heograpikong pormula at ang likas na kalabuan nito hinggil sa pananaw ng nagsasalita o mambabasa.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay tumutukoy sa lupaing kakaunti ang naninirahan at hindi kinakailangang mabuhanging disyerto.
- source_word: בָּעֲרָבָה
  choice: sa Araba
  rationale: Ginamit bilang pangalang heograpiko sa halip na gawing pangkalahatang “kapatagan,” upang mapanatili ang tiyak na rehiyong tinutukoy.
- source_word: מוֹל סוּף
  choice: sa tapat ng Suf
  rationale: Ang “sa tapat” ay tumutugma sa מוֹל, at ang Suf ay pinanatiling pangalan ng lugar sapagkat walang salitang “dagat” sa Hebreo rito.
- source_word: בֵּין פָּארָן וּבֵין תֹּפֶל וְלָבָן וַחֲצֵרֹת וְדִי זָהָב
  choice: sa pagitan ng Paran, Tofel, Laban, Hazerot, at Dizahab
  rationale: Ang listahang may kuwit at pangwakas na “at” ay malinaw at natural sa Tagalog habang pinananatili ang lahat ng pangalan ng lugar.
