  text: וַֽ/תַּעֲנ֣וּ וַ/תֹּאמְר֣וּ אֵלַ֗/י חָטָאנוּ֮ לַֽ/יהוָה֒ אֲנַ֤חְנוּ נַעֲלֶה֙ וְ/נִלְחַ֔מְנוּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/נוּ יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַֽ/תַּחְגְּר֗וּ אִ֚ישׁ אֶת כְּלֵ֣י מִלְחַמְתּ֔/וֹ וַ/תָּהִ֖ינוּ לַ/עֲלֹ֥ת הָ/הָֽרָ/ה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/041.yaml
  text: Then you answered and said to me[a], ‘We have sinned against Yahweh. We ourselves will go up and fight, according to all that Yahweh our God commanded us.’ Then each man strapped on his weapons of war[b], and you presumptuously set out to go up into the hill country.
translation:
  language: tl
  text: Pagkatapos ay sumagot kayo sa akin, ‘Nagkasala kami kay Yahweh. Aakyat kami at makikipaglaban, ayon sa lahat ng iniutos sa amin ni Yahweh na aming Diyos.’ Pagkatapos, isinuot ng bawat isa sa inyo ang kaniyang mga sandata, at mapangahas kayong umakyat sa kaburulan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang bihirang pandiwang Hebreo ay maaari ring isaling “padalos-dalos kayong umakyat” o “nagpakalakas-loob kayong umakyat.” Maaari ring isalin ang “kaburulan” na “bundok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנוּ וַתֹּאמְרוּ אֵלַי
  choice: sumagot kayo sa akin
  rationale: Ang ענה sa kontekstong ito ay nagpapakilala ng tugon kay Moises. Hindi na kailangang ulitin sa Tagalog ang literal na ‘sumagot at nagsabi’ dahil likas nang saklaw ng ‘sumagot’ ang pagsasalita.
- source_word: חָטָאנוּ לַיהוָה
  choice: Nagkasala kami kay Yahweh
  rationale: Ang ל ay tumutukoy sa Diyos bilang pinatunguhan o nasaktang panig; natural sa Tagalog ang ‘nagkasala kay Yahweh.’
- source_word: נַעֲלֶה וְנִלְחַמְנוּ
  choice: Aahon kami at makikipaglaban
  rationale: Pinananatili ng ‘aahon’ ang paitaas na kilos ng עלה, at malinaw na ipinahahayag ng ‘makikipaglaban’ ang pakikidigma ng Niphal na לחם.
- source_word: כְּכֹל אֲשֶׁר צִוָּנוּ
  choice: ayon sa lahat ng iniutos sa amin
  rationale: Pinananatili nito ang kabuuang saklaw ng כְּכֹל at ang diwa ng pagsunod ayon sa iniutos.
- source_word: וַתַּחְגְּרוּ אִישׁ אֶת כְּלֵי מִלְחַמְתּוֹ
  choice: isinuot ng bawat isa sa inyo ang kaniyang mga sandata
  rationale: Ang חגר ay pagbigkis o pagsuot ng kagamitang pandigma. Ang ‘bawat isa sa inyo’ ay malinaw na kumakatawan sa distributibong אִישׁ, habang ang ‘mga sandata’ ay natural na salin ng כְּלֵי מִלְחָמָה nang hindi labis na tinutukoy ang uri ng kagamitan.
- source_word: וַתָּהִינוּ
  choice: pangahas kayong nagtangkang
  rationale: Bihira at hindi ganap na tiyak ang pandiwa. Sa konteksto ng kasunod na pagsuway, ipinahihiwatig nito ang padalos-dalos o mapangahas na pagkilos; pinananatili ng salin ang negatibong himig nang hindi ipinapalagay na tagumpay ang pag-akyat.
- source_word: לַעֲלֹת הָהָרָה
  choice: umakyat sa kaburulan
  rationale: May panandang patungo ang הָהָרָה. Sa heograpikong konteksto, maaaring tumukoy ang הָהָר sa rehiyong mabundok o maburol, hindi lamang sa iisang bundok.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal na YHWH sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalapat ng pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalan ng Diyos.
- issue: Moral na himig ng וַתָּהִינוּ
  choice: pangahas kayong nagtangkang
  alternative: buo ang loob ninyong umakyat / padalos-dalos kayong umakyat
  rationale: Ang agarang konteksto ay nagpapakitang sinuway nila ang kasunod na utos ni Yahweh at kumilos nang may labis na tiwala sa sarili. Gayunman, dahil bihira at pinagtatalunan ang pandiwa, nilalagyan ng talababa ang ibang posibleng pagbasa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘kaburulan’ para sa heograpikong diwa ng הָהָר at ‘pangahas’ upang ihatid ang negatibong konteksto, habang tahasang pinananatili sa talababa ang leksikal na kawalang-katiyakan.
