revisions:
- from: Pagkatapos ay sumagot kayo sa akin, ‘Nagkasala kami kay Yahweh. Aahon kami at makikipaglaban, ayon sa lahat ng iniutos sa amin ni Yahweh na aming Diyos.’ Kaya isinuot ng bawat isa sa inyo ang kaniyang mga sandata, at pangahas kayong nagtangkang umakyat sa kaburulan.[a]
  to: Pagkatapos ay sumagot kayo sa akin, ‘Nagkasala kami kay Yahweh. Aakyat kami at makikipaglaban, ayon sa lahat ng iniutos sa amin ni Yahweh na aming Diyos.’ Pagkatapos, isinuot ng bawat isa sa inyo ang kaniyang mga sandata, at mapangahas kayong umakyat sa kaburulan.[a]
  rationale: Pinalitan ang “aahon” ng “aakyat” upang tuwirang maipahayag ang pag-akyat na nasa Hebreo. Pinalitan ang “pangahas kayong nagtangkang umakyat” ng “mapangahas kayong umakyat” upang hindi magdagdag ng diwa ng hindi natapos na pagsubok at upang mapanatili ang negatibong, ngunit leksikal na pinagtatalunang, nuwansa ng bihirang pandiwa. Inayos din ang pang-ugnay na “Kaya” bilang “Pagkatapos” upang mas malapit sa sunod-sunod na pagsasalaysay ng Hebreo nang hindi magpahiwatig ng sobrang sanhi-bunga.
