    issue: “Aahon kami” para sa נַעֲלֶה
    rationale: Bagaman maaaring mangahulugan ang “aahon” ng pag-akyat, ang “Aakyat kami” ang mas tuwiran at likas na pagsasalin ng planong umakyat patungo sa kaburulan.
  - severity: medium
    issue: “pangahas kayong nagtangkang umakyat” para sa וַתָּהִינוּ לַעֲלֹת
    rationale: Ang “nagtangkang” ay maaaring magpahiwatig na sinubukan lamang nila, samantalang ang pandiwa ay tumutukoy sa mapangahas o padalus-dalos na pagsasagawa ng pag-akyat. Mas tapat at natural ang “mapangahas kayong umakyat,” na may talababa para sa pinagtatalunang leksikal na nuwansa.
