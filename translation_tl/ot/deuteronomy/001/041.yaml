  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang tugon kay Moises, pagkakasala kay Yahweh, layuning umakyat at lumaban ayon sa iniutos, pagsusuot ng kagamitang pandigma, at ang negatibong himig ng huling kilos. Gayunman, ang “aahon” ay hindi gaanong tuwirang tumutugma sa planong umakyat sa kaburulan, at ang “pangahas kayong nagtangkang” ay nagdaragdag ng diwa ng simpleng pagtatangka sa halip na ng mapangahas na pagsisimula/pag-akyat.'
  naturalness: Marangal at malinaw ang rehistro, ngunit mas natural at tiyak sa modernong Filipino ang “Aakyat kami” at “mapangahas kayong umakyat.” Iniiwasan din nito ang medyo mabigat na sunod-sunod na “pangahas ... nagtangkang.”
  terminology: Wasto at pare-pareho ang “Yahweh,” “nagkasala,” “makikipaglaban,” at “kaburulan.” Ang “mga sandata” ay katanggap-tanggap para sa kagamitang pandigma sa kontekstong ito.
