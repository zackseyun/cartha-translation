base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/013.yaml
  text: Choose for yourselves wise[a], discerning, and well-known men from your tribes[b], and I will appoint them as your heads.
translation:
  language: tl
  text: Pumili kayo para sa inyong sarili ng mga lalaking marurunong, may unawa, at kilala[a] sa inyong mga lipi, at itatalaga ko sila bilang mga pinuno ninyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kinikilala.” Maaaring idiin ng Hebreo na ang mga lalaking ito ay may matatag nang reputasyon sa kani-kanilang mga lipi.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga ulo ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Pumili kayo
  rationale: Bagaman maaari itong literal na mangahulugang “magbigay” o “magdala,” sa konteksto ay hinihiling sa bayan na pumili ng mga kuwalipikadong lalaki bago sila italaga ni Moises.
- source_word: לָכֶם
  choice: para sa inyong sarili
  rationale: Pinananatili nito ang diing ang bayan mismo ang pipili para sa sarili nitong kapakanan.
- source_word: אֲנָשִׁים
  choice: mga lalaki
  rationale: Tahasang panlalaki ang pangngalang Hebreo at tumutukoy rito sa mga lalaking itatalaga sa pamumuno ng mga lipi.
- source_word: חֲכָמִים
  choice: marunong
  rationale: Sa konteksto ng pagpili ng mga pinuno at hukom, tumutukoy ito sa karunungan at mahusay na pagpapasiya, hindi lamang sa teknikal na kasanayan.
- source_word: וּנְבֹנִים
  choice: may unawa
  rationale: Ipinahahayag nito ang kakayahang umunawa nang malalim at magpasiyang may wastong pagkilala sa mga bagay.
- source_word: וִידֻעִים
  choice: kilala
  rationale: Ang anyong balintiyak mula sa ידע ay likas na tumutukoy sa mga lalaking kilala o kinikilala sa komunidad; hindi tahasang sinasabing “may karanasan.”
- source_word: לְשִׁבְטֵיכֶם
  choice: sa inyong mga lipi
  rationale: 'Pinakamalapit itong iniugnay sa “kilala”: ang mga kandidato ay kilala sa loob ng kani-kanilang mga lipi. Pinananatili rin nito ang posibilidad na ang mga lipi ang saklaw ng pagpili.'
- source_word: וַאֲשִׂימֵם
  choice: itatalaga ko sila
  rationale: Sa tuwirang pananalita, inilalarawan nito ang kasunod na opisyal na pagkilos ni Moises matapos pumili ang bayan.
- source_word: בְּרָאשֵׁיכֶם
  choice: bilang mga pinuno ninyo
  rationale: Ang “ulo” ay metapora sa Hebreo para sa isang pinuno; “mga pinuno” ang natural at malinaw na katumbas sa modernong Tagalog.
theological_decisions:
- issue: Panlalaking katawagan sa אֲנָשִׁים
  choice: mga lalaki
  alternative: mga tao
  rationale: Tahasang panlalaking maramihan ang Hebreo at tumutukoy sa mga itatalagang pinuno sa kaayusang panlipi ng Israel; hindi ito ginawang neutral sa kasarian.
- issue: Ugnayan ng לְשִׁבְטֵיכֶם sa pangungusap
  choice: kilala sa inyong mga lipi
  alternative: mula sa inyong mga lipi
  rationale: Sa Hebreo, likas na mababasa ang parirala bilang paglalarawan sa mga lalaking “kilala sa inyong mga lipi.” Hindi nito itinatanggi na mula rin sa mga lipi ang mga pipiliin, ngunit iniiwasang burahin ang tuwirang ugnayan sa “kilala.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “marunong” at “may unawa” bilang natural na magkatambal para sa praktikal na karunungan at pagkilatis. Pinanatili sa talababa ang literal na larawang “mga ulo” upang maging malinaw ang metaporang Hebreo nang hindi nagiging alanganin ang pangunahing teksto.
