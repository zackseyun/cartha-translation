base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/024.yaml
  text: So they turned and went up into the hill country[a], and came as far as the Valley of Eshcol, and spied it out.
translation:
  language: tl
  text: Kaya bumaling sila at umahon sa kabundukan. Nakarating sila hanggang sa Lambak ng Escol[a] at minanmanan nila iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Wadi ng Escol” o “Batis ng Escol.” Ang salitang Hebreo ay maaaring tumukoy sa isang lambak na may pana-panahong daluyan ng tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: bumaling sila
  rationale: Tuwirang ipinapahayag ng “bumaling” ang pagkilos na lumiko o nagbago ng direksiyon, ayon sa karaniwang diwa ng פנה sa salaysay.
- source_word: וַיַּעֲלוּ
  choice: umahon
  rationale: Pinananatili ng “umahon” ang literal na pataas na pagkilos sa lupain at natural itong pakinggan sa makabagong Filipino.
- source_word: הָהָרָה
  choice: sa kabundukan
  rationale: Ipinahihiwatig ng hulaping patungo ang pagkilos tungo sa bulubunduking rehiyon; ang “kabundukan” ay natural at hindi nililimitahan ang tinutukoy sa iisang bundok.
- source_word: וַיָּבֹאוּ עַד
  choice: Nakarating sila hanggang sa
  rationale: Napananatili ng “hanggang sa” ang hangganan o dulong-pook na ipinahihiwatig ng עַד.
- source_word: נַחַל אֶשְׁכֹּל
  choice: Lambak ng Escol
  rationale: Maaaring tumukoy ang נַחַל sa isang lambak o wadi na may pana-panahong daluyan ng tubig. Malinaw at natural sa Filipino ang “Lambak,” habang inilalahad sa talababa ang mas tiyak na alternatibo.
- source_word: וַיְרַגְּלוּ
  choice: minanmanan
  rationale: Ipinahahayag ng “minanmanan” ang lihim at mapanuring pagmamasid na kaugnay ng pag-eespiya, hindi lamang pangkalahatang paggalugad.
- source_word: אֹתָהּ
  choice: iyon
  rationale: Pinananatili ang pambabaeng isahang panghalip ng Hebreo bilang likas na Filipino na “iyon”; mauunawaan sa konteksto na tumutukoy ito sa lupaing pinaroonan nila.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kabundukan” para sa heograpikong rehiyon at “minanmanan” upang mapanatili ang diwa ng pag-eespiya. Inilagay ang [a] pagkatapos ng “Lambak ng Escol,” ang salitang talagang tinutukoy ng talababa.
