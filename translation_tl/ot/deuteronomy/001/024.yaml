  source_fidelity: 'Tumpak na naipapahayag ang sunod-sunod na pagkilos sa Hebreo: pagbaling, pag-ahon tungo sa bulubunduking pook, pagdating hanggang sa Nahal/Lambak ng Escol, at pagmamanman o pagsisiyasat dito. Ang “minanmanan” ay sapat na naghahatid ng rekonesans/espiyang diwa ng וַיְרַגְּלוּ.'
