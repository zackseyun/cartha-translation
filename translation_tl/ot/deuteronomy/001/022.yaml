  source_fidelity: 'Tumpak sa kabuuan ang pagsasalin ng paglapit ng buong bayan, ang cohortative na mungkahi na magpadala ng mga lalaki, ang pagsisiyasat sa lupain, ang pagbabalik ng ulat, at ang mga lunsod na papasukan. Gayunman, ang talababa b ay hindi wastong kumakatawan sa sintaks ng Hebreo: ang ‘pag-akyat’ ay ginagawa sa/sa pamamagitan ng daan patungo sa lupain, hindi ang daan mismo ang tuwirang ‘inaakyatan.’'
  naturalness: Malinaw ang draft, ngunit mas likas ang ‘magbalik sa atin ng ulat’ kaysa ‘ibalik sa atin ang balita.’ Ang ‘daang tatahakin natin sa pag-akyat doon’ ay mas maayos ding ipinapahayag ang ugnayan ng daan at pag-akyat.
  terminology: Ang ‘mga lalaki,’ ‘lupain,’ ‘siyasatin,’ at ‘lunsod’ ay angkop sa modernong Filipino Tagalog at tumutugon sa kahulugan ng mga salitang Hebreo. Napananatili ang ‘pag-akyat’ bilang biblikal na idyoma nang hindi ipinipilit ang isang partikular na topograpikong pagpapakahulugan.
