  - severity: low
    issue: Medyo hindi likas ang ‘ibalik sa atin ang balita.’
    rationale: Nauunawaan ito, ngunit ang ‘magbalik sa atin ng ulat’ ay mas karaniwang modernong Filipino para sa pagbabalik na may dalang ulat at mas mahusay na sumasalamin sa idiomang Hebreo.
