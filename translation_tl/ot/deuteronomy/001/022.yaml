base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/022.yaml
  text: Then all of you came near to me and said[a], ‘Let us send men ahead of us, so that they may explore the land for us and bring us back word of the way by which we should go up into it[b], and of the cities into which we shall come.’
translation:
  language: tl
  text: Pagkatapos, lumapit kayong lahat sa akin at sinabi ninyo, “Magpadala tayo ng mga lalaki sa unahan natin upang siyasatin nila para sa atin ang lupain at magbalik sa atin ng ulat tungkol sa daang tatahakin natin sa pag-akyat doon[a] at tungkol sa mga lunsod na papasukan natin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang daan na aakyatin natin doon.” Mas literal, “ang daan na aakyatin natin dito/roon,” ibig sabihin, ang daang tatahakin sa pag-akyat patungo sa lupain. Ang “umakyat” ay karaniwang biblikal na pananalita para sa pagpunta sa lupain o sa mataas na bahagi nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם
  choice: lumapit kayong lahat sa akin
  rationale: Ang קָרַב ay ‘lumapit,’ at malinaw na napananatili ng ‘kayong lahat’ ang diin ng כֻּלְּכֶם.
- source_word: נִשְׁלְחָה אֲנָשִׁים
  choice: Magpadala tayo ng mga lalaki
  rationale: Ipinapahayag ng cohortative ang mungkahing ‘Magpadala tayo.’ Sa kontekstong ito, ang אֲנָשִׁים ay tumutukoy sa mga lalaking pipiliin para sa gawaing ito.
- source_word: לְפָנֵינוּ
  choice: sa unahan natin
  rationale: Ito ang natural na salin ng idyomang literal na ‘sa harap natin’ sa konteksto ng pagpapauna sa isang pangkat.
- source_word: וְיַחְפְּרוּ לָנוּ אֶת הָאָרֶץ
  choice: upang siyasatin nila para sa atin ang lupain
  rationale: Ang חָפַר ay maaaring mangahulugang maghanap o magsiyasat. Ang ‘siyasatin’ ay malinaw at hindi nagdaragdag ng di-tiyak na ideya ng lihim na paniniktik.
- source_word: וְיָשִׁבוּ אֹתָנוּ דָּבָר
  choice: at ibalik sa atin ang balita
  rationale: Pinananatili nito ang konkretong larawan ng pagbabalik na may dalang ulat, habang natural sa modernong Tagalog.
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר נַעֲלֶה בָּהּ
  choice: tungkol sa daang daraanan natin sa pag-akyat doon
  rationale: Ang דֶּרֶךְ ay daan o ruta, at pinananatili ng ‘pag-akyat’ ang karaniwang biblikal na gamit ng עָלָה. Ang ‘daraanan’ ay likas na Tagalog para sa ruta na gagamitin.
- source_word: וְאֵת הֶעָרִים אֲשֶׁר נָבֹא אֲלֵיהֶן
  choice: at tungkol sa mga lunsod na papasukan natin
  rationale: Malinaw na ipinapakita ng ‘papasukan’ na ang tinutukoy ay ang mga lunsod na kanilang mararating at papasok sa mga ito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘lunsod’ at ‘siyasatin’ bilang karaniwang salitang madaling maunawaan, habang pinanatili ang konkretong idyoma ng ‘pag-akyat.’
