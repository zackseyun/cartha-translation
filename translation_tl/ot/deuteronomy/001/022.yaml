revisions:
- from: Pagkatapos, lumapit kayong lahat sa akin at sinabi ninyo, “Magpadala tayo ng mga lalaki sa unahan natin upang siyasatin[a] nila para sa atin ang lupain at ibalik sa atin ang balita tungkol sa daang daraanan natin sa pag-akyat doon[b] at tungkol sa mga lunsod na papasukan natin.”
  to: Pagkatapos, lumapit kayong lahat sa akin at sinabi ninyo, “Magpadala tayo ng mga lalaki sa unahan natin upang siyasatin nila para sa atin ang lupain at magbalik sa atin ng ulat tungkol sa daang tatahakin natin sa pag-akyat doon[a] at tungkol sa mga lunsod na papasukan natin.”
  rationale: Binago ang pananalita tungkol sa ulat upang maging mas natural sa Filipino, at inayos ang parirala tungkol sa daan upang malinaw na ang daan ang tatahakin habang umaakyat. Pinalitan at itinama ang talababa upang hindi nito ilarawan ang daan bilang tuwirang bagay ng pandiwang ‘umakyat.’
