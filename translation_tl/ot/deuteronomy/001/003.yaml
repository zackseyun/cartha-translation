  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִי֙ בְּ/אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/עַשְׁתֵּֽי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ דִּבֶּ֤ר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ אֲלֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/003.yaml
  text: And it happened in the fortieth year[a], in the eleventh month, on the first day of the month[b], that Moses spoke to the sons of Israel according to all that Yahweh had commanded him to them.
translation:
  language: tl
  text: Noong ikaapatnapung taon, sa ikalabing-isang buwan, sa unang araw ng buwan, nagsalita si Moises sa mga anak ng Israel[a] ayon sa lahat ng iniutos sa kanya ni Yahweh para sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, “mga anak ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “iniutos sa kanya sa kanila,” o maaaring “iniutos sa kanya tungkol sa kanila.” Ang diwa ay sinabi ni Moises ang iniutos ni Yahweh na ipahayag niya sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Ang wayyiqtol ng היה ay nagpapakilala rito ng tagpuang pangpanahon. Sa natural na Tagalog, sapat ang “Nang” upang ilipat ang salaysay sa itinakdang petsa nang hindi gumagamit ng mabigat na “At nangyari na.”
- source_word: בְּאַרְבָּעִים שָׁנָה
  choice: nang ikaapatnapung taon
  rationale: Ang bilang na may “taon” ay ginagamit bilang pantukoy sa bilang ng taon; ang ordinal na “ikaapatnapung taon” ang natural na katumbas.
- source_word: בְּעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: sa ikalabing-isang buwan
  rationale: Bagaman cardinal ang anyong Hebreo, ordinal na petsa ang gamit nito rito.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: sa unang araw ng buwan
  rationale: Karaniwang pormula ito ng petsa sa Hebreo; idinagdag ang “araw” para sa malinaw at likas na Tagalog.
- source_word: דִּבֶּר
  choice: nagsalita
  rationale: Tuwirang salin na hindi labis na tumutukoy kung ito ay pagpapahayag, pangangaral, o pormal na pagharap.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: sa mga anak ng Israel
  rationale: Pinananatili ang pampamilyang larawang nasa Hebreo, habang inilalagay sa talababa ang mas karaniwang “mga Israelita.”
- source_word: כְּכֹל אֲשֶׁר
  choice: ayon sa lahat ng
  rationale: Pinananatili ng “ayon sa” ang diwa ng pagsunod o pag-ayon sa kabuuan ng iniutos.
- source_word: צִוָּה
  choice: iniutos
  rationale: Ang aspekto at ayos ng pangungusap sa Tagalog ay malinaw nang nagpapakitang nauna ang utos ni Yahweh sa pagsasalita ni Moises.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng titulong “Panginoon.”
- source_word: אֹתוֹ אֲלֵהֶם
  choice: sa kanya ni Yahweh para sa kanila
  rationale: Likas itong Tagalog at ipinahahayag na si Moises ang tumanggap ng utos na nakatuon sa Israel, habang kinikilala sa talababa ang siksik at maaaring basahing “sa kanila” o “tungkol sa kanila” na konstruksiyong Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pangngalang pantangi ang יְהוָה sa talata. Pinananatili ng “Yahweh” ang ipinahayag na pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Ugnayan ng utos ni Yahweh kay Moises at sa Israel
  choice: iniutos sa kanya ni Yahweh para sa kanila
  alternative: iniutos sa kanya ni Yahweh sa kanila / tungkol sa kanila
  rationale: Siksik ang Hebreong אֹתוֹ אֲלֵהֶם. Pinili ang natural na pahayag na tumutukoy sa mensaheng ipinagkatiwala kay Moises para sa Israel, ngunit hindi itinatago ang mga mas literal na posibilidad; inilalahad ang mga iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang payak na ayos ng petsa at pangungusap; iniwasan ang arkaikong “At nangyari na.” Pinanatili ang “mga anak ng Israel” at “Yahweh” para sa pormal na pagkakaugnay sa Hebreo, na may mga paliwanag sa talababa.
