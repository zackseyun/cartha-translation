  source_fidelity: Tumpak ang kolektibong maramihang pagtukoy sa הָאֱמֹרִי, ang panrehiyong diwa ng הָהָר, ang paghabol na inihahambing sa mga bubuyog, at ang mga pook na Seir at Horma. Ang “nilupig” ay maaaring magpahiwatig ng pagsakop o pagpapasailalim, samantalang ang וַיַּכְּתוּ ay mas tuwirang tumutukoy sa marahas na pagpabagsak/pagdurog sa konteksto ng pagtugis.
