  terminology: Napanatili ang mga pangalang Amoreo, Seir, at Horma. Ang “kabundukan” ay angkop na makabagong Filipino at ang mga talababa ay wastong nagpapaliwanag ng kolektibong isahan at alternatibong kahulugang “bundok.”
