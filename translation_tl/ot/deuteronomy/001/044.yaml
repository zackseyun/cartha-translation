  text: וַ/יֵּצֵ֨א הָ/אֱמֹרִ֜י הַ/יֹּשֵׁ֨ב בָּ/הָ֤ר הַ/הוּא֙ לִ/קְרַאתְ/כֶ֔ם וַ/יִּרְדְּפ֣וּ אֶתְ/כֶ֔ם כַּ/אֲשֶׁ֥ר תַּעֲשֶׂ֖ינָה הַ/דְּבֹרִ֑ים וַֽ/יַּכְּת֥וּ אֶתְ/כֶ֛ם בְּ/שֵׂעִ֖יר עַד חָרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/044.yaml
  text: Then the Amorites who lived in that hill country came out to meet you and pursued you as bees do[b][a], and they struck you down in Seir as far as Hormah.
translation:
  language: tl
  text: Lumabas ang mga Amoreo[a] na naninirahan sa kabundukang iyon[b] upang salubungin kayo. Hinabol nila kayo gaya ng ginagawa ng mga bubuyog at pinabagsak nila kayo sa Seir hanggang sa Horma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Amoreo”—isahan sa Hebreo ngunit kolektibong tumutukoy sa mga Amoreo; maramihan ang kasunod na mga pandiwa.
    reason: lexical_alternative
  - marker: b
    text: O “bundok na iyon”; dito, ang “kabundukan” ay nagpapahayag ng panrehiyong kahulugan ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Karaniwang salaysay na gamit ng יצא ang paglabas; natural sa Filipino at angkop sa paglabas ng kaaway mula sa kanilang kinaroroonan.
- source_word: הָאֱמֹרִי
  choice: mga Amoreo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo ang gamit nito, gaya ng ipinakikita ng kasunod na mga pandiwang maramihan.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: na naninirahan sa lupaing maburol na iyon
  rationale: Ang participle ay tumutukoy sa palagiang paninirahan, at ang הַר dito ay natural na maunawaan bilang rehiyong maburol, hindi lamang isang bundok.
- source_word: לִקְרַאתְכֶם
  choice: upang salubungin kayo
  rationale: Pinananatili ng 'salubungin' ang pangunahing diwa ng pagharap o pagsalubong, habang ipinahihiwatig ng konteksto ang masamang layunin.
- source_word: וַיִּרְדְּפוּ אֶתְכֶם
  choice: Hinabol nila kayo
  rationale: Tuwiran at natural na katumbas ng militar na paghabol na ipinahahayag ng רדף.
- source_word: כַּאֲשֶׁר תַּעֲשֶׂינָה הַדְּבֹרִים
  choice: gaya ng ginagawa ng mga bubuyog
  rationale: Pinananatili ang matingkad at bahagyang di-tiyak na paghahambing ng Hebreo nang hindi idinaragdag kung paano mismo humahabol ang mga bubuyog.
- source_word: וַיַּכְּתוּ אֶתְכֶם
  choice: nilupig nila kayo
  rationale: Ipinahahayag ng Hiphil ng כתת ang marahas na pagdaig o pagdurog; ang 'nilupig' ay dignificado at malinaw sa kontekstong militar nang hindi labis na inilalarawan ang paraan.
- source_word: בְּשֵׂעִיר
  choice: sa Seir
  rationale: Pinananatili ang payak na lokatibong kahulugan ng pang-ukol ב.
- source_word: עַד חָרְמָה
  choice: hanggang sa Horma
  rationale: Natural na Filipino para sa hangganang heograpiko na ipinahahayag ng עַד.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang larawan ng mga bubuyog at ang mga alternatibong kahulugan ng kolektibong isahan at ng הַר sa mga talababa. Ang mga panandang [a] at [b] ay inilagay kaagad pagkatapos ng kaugnay na mga parirala.
