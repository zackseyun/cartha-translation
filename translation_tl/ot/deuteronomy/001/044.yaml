  to: Lumabas ang mga Amoreo[a] na naninirahan sa kabundukang iyon[b] upang salubungin kayo. Hinabol nila kayo gaya ng ginagawa ng mga bubuyog at pinabagsak nila kayo sa Seir hanggang sa Horma.
  rationale: Inayos ang dalawang salita upang maging mas malapit sa lakas ng pandiwang Hebreo at mas likas sa modernong Filipino, habang pinananatili ang saklaw, pagkakasunod, at sinadyang di-pagtukoy ng paghahambing sa mga bubuyog.
