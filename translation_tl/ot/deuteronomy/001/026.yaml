  yaml_path: translation/ot/deuteronomy/001/026.yaml
  text: But you were not willing to go up[a], and you rebelled against the command of Yahweh your God.
translation:
  language: tl
  text: Ngunit ayaw ninyong umakyat, at sinuway ninyo ang utos ni Yahweh na inyong Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “naghimagsik kayo laban sa bibig ni Yahweh na inyong Diyos,” isang idyomang nangangahulugang nilabanan o sinuway ang kanyang utos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אֲבִיתֶם
  choice: Ngunit ayaw ninyo
  rationale: Ipinahahayag ng וְלֹא ang pagsalungat sa naunang paghimok, at ang אֲבִיתֶם sa negatibong anyo ay tumutukoy sa hindi pagpayag. Natural at tuwiran sa modernong Tagalog ang “Ngunit ayaw ninyo.”
- source_word: לַעֲלֹת
  choice: umahon
  rationale: Karaniwang kahulugan ng עלה ang pag-akyat o pagpunta sa mas mataas na lugar. Pinananatili ng “umahon” ang direksiyonal na diwa at ang konteksto ng pagpasok sa lupaing nasa kabundukan.
- source_word: וַתַּמְרוּ
  choice: sinuway ninyo
  rationale: Ang מרה ay tumutukoy sa paghihimagsik o pagsuway sa may awtoridad. Ang “sinuway” ay malinaw at natural, at ang diwang masidhing paglaban ay pinananatili ng idyomang kasunod nito.
- source_word: אֶת־פִּי
  choice: ang utos
  rationale: Literal itong “ang bibig,” ngunit sa pariralang מרה את־פי ay idyoma ito para sa pagsalungat sa ipinahayag na utos ng isang may awtoridad. Ang “utos” ang natural na katumbas sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Ang hulaping pangmaramihang ikalawang panauhan ay “inyong,” samantalang ang pagtukoy kay Yahweh ay nangangailangan ng isahang “Diyos.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit sa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Idyomang “maghimagsik laban sa bibig”
  choice: sinuway ... ang utos
  alternative: naghimagsik laban sa bibig; nilabanan ang salita
  rationale: Ang literal na “bibig” ay maaaring malabo sa Tagalog. Ipinahahayag ng “utos” ang idyomatikong kahulugan nang hindi binabago ang awtoridad ng salitang binigkas ni Yahweh.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, dignificado, at madaling maunawaan. Ginamit ang “umahon” upang mapanatili ang direksiyonal na diwa, at “sinuway ... ang utos” upang natural na maipahayag ang Hebreong idyoma. Ang panandang talababa [a] ay inilagay kaagad pagkatapos ng pangungusap na tinutukoy nito.
