source:
  edition: WLC
  text: וָ/אֲצַוֶּה֙ אֶת שֹׁ֣פְטֵי/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר שָׁמֹ֤עַ בֵּין אֲחֵי/כֶם֙ וּ/שְׁפַטְתֶּ֣ם צֶ֔דֶק בֵּֽין אִ֥ישׁ וּ/בֵין אָחִ֖י/ו וּ/בֵ֥ין גֵּרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/016.yaml
  text: And at that time I commanded your judges[a], saying, ‘Hear the cases between your brothers[c][b], and judge righteously between a man and his brother or the resident foreigner with him.’
translation:
  language: tl
  text: 'Noong panahong iyon, inutusan ko ang inyong mga hukom: “Pakinggan ninyo ang mga usapin sa pagitan ng inyong mga kapatid[a], at humatol kayo nang makatarungan[b] sa pagitan ng isang tao at ng kanyang kapatid, at ng dayuhang naninirahan sa piling niya[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dinggin ninyo ang mga alitan sa gitna ng inyong mga kapatid.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “humatol kayo ayon sa katuwiran.” Saklaw ng Hebreong צֶדֶק (tsedeq) ang mga diwa ng katuwiran at katarungan, lalo na sa kontekstong panghukuman.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “dayuhang nakikipamayan sa piling niya.” Ang Hebreong גֵּר (ger) ay tumutukoy sa isang di-katutubong naninirahan sa gitna ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: iniutos ko
  rationale: Tuwirang ipinahahayag ng צוה ang pagbibigay ni Moises ng may-awtoridad na utos.
- source_word: שֹׁפְטֵיכֶם
  choice: inyong mga hukom
  rationale: Tumutukoy ito sa mga itinalagang dumirinig at nagpapasiya ng mga usaping legal; “mga hukom” ang malinaw at karaniwang katumbas sa Filipino.
- source_word: בָּעֵת הַהִוא
  choice: nang panahong iyon
  rationale: Likas na pariralang Filipino para sa panahong tinutukoy sa salaysay.
- source_word: שָׁמֹעַ בֵּין אֲחֵיכֶם
  choice: Pakinggan ninyo ang mga usapin sa pagitan ng inyong mga kapatid
  rationale: Sa kontekstong panghukuman, ang שׁמע ay nangangahulugang maingat na dinggin ang mga usapin. Pinananatili ng “mga kapatid” ang wikang pangkamag-anakan na gamit para sa sambayanan ng Israel.
- source_word: וּשְׁפַטְתֶּם צֶדֶק
  choice: humatol kayo nang makatarungan
  rationale: Gumaganap dito ang צֶדֶק bilang paglalarawan sa uri o paraan ng paghatol. Ang “nang makatarungan” ay likas sa Filipino at pinananatili ang sabayang moral at legal na diwa.
- source_word: בֵּין אִישׁ וּבֵין אָחִיו
  choice: sa pagitan ng isang tao at ng kapatid niya
  rationale: Pinananatili ang kongkreto at pang-isahang anyo ng Hebreo pati ang talinghaga ng pagkakapatid.
- source_word: גֵּרוֹ
  choice: dayuhang naninirahang kasama niya
  rationale: Ang גֵּר ay hindi basta panandaliang bisita kundi isang di-katutubong naninirahan sa gitna ng Israel. Isinasama ng “kasama niya” ang hulaping panghalip ng Hebreo.
theological_decisions:
- issue: Ang pangkomunidad na wikang pangkamag-anakan sa אֲחֵיכֶם at אָחִיו
  choice: mga kapatid / kapatid niya
  alternative: mga kapwa Israelita / kapwa niya
  rationale: Pinananatili nito ang larawan ng Israel bilang magkakapatid nang hindi nililimitahan sa mga lalaking magkakadugo lamang.
- issue: Ang kahulugan ng צֶדֶק sa kontekstong panghukuman
  choice: nang makatarungan
  alternative: ayon sa katuwiran
  rationale: Magkaugnay rito ang katarungan at katuwiran. Ang pangunahing salin ay natural sa legal na konteksto, habang kinikilala ng talababa ang moral na himig ng salita.
- issue: Ang katayuan ng גֵּר
  choice: dayuhang naninirahan
  alternative: dayuhang nakikipamayan
  rationale: Ipinakikita nito kapwa ang pagiging di-katutubo at ang matatag na paninirahan sa loob ng pamayanan, nang hindi nagdaragdag ng makabagong teknikal na katayuang legal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pakinggan ang mga usapin” bilang madaling maunawaang pananalitang panghukuman; pinanatili ang “mga kapatid” upang hindi mawala ang pangkomunidad na larawang nasa Hebreo. Ang bantas na tutuldok ay natural na nagpapakilala sa mismong nilalaman ng utos nang hindi kailangang isalin nang hiwalay ang לֵאמֹר.
