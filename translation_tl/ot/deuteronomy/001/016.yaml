- from: 'Nang panahong iyon, iniutos ko sa inyong mga hukom: “Pakinggan ninyo ang mga usapin sa pagitan ng inyong mga kapatid[a], at humatol kayo nang makatarungan[b] sa pagitan ng isang tao at ng kapatid niya, o ng dayuhang naninirahang kasama niya[c].”'
  to: 'Noong panahong iyon, inutusan ko ang inyong mga hukom: “Pakinggan ninyo ang mga usapin sa pagitan ng inyong mga kapatid[a], at humatol kayo nang makatarungan[b] sa pagitan ng isang tao at ng kanyang kapatid, at ng dayuhang naninirahan sa piling niya[c].”'
