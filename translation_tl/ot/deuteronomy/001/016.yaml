    issue: Medyo di-natural ang “iniutos ko sa inyong mga hukom.”
    rationale: Mas tuwiran at karaniwang Filipino ang “Inutusan ko ang inyong mga hukom,” habang pinananatili ang awtoritatibong diwa ng צוה.
