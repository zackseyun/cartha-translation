  naturalness: Natural at marangal ang pangunahing salin. Mas natural ang “Inutusan ko” kaysa “iniutos ko sa” kapag ang tuwirang layon ay mga hukom. Ang “dayuhang naninirahan sa piling niya” ay malinaw at hindi teknikal na modernong termino.
  terminology: Ang “mga hukom,” “mga kapatid,” “makatarungan,” at “dayuhang naninirahan” ay angkop. Pinananatili ng talababa ang saklaw ng צֶדֶק at ang katayuang paninirahan ng גֵּר.
