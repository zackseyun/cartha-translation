  text: Yet in this matter you did not believe in Yahweh your God[a].
translation:
  language: tl
  text: Ngunit sa bagay na ito, hindi kayo nagtiwala sa PANGINOON na inyong Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi kayo naniwala sa PANGINOON na inyong Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/דָּבָר הַ/זֶּה
  choice: Ngunit sa bagay na ito
  rationale: Ang דָּבָר ay tumutukoy rito sa pangyayari o usaping katatapos ilahad, hindi lamang sa isang binigkas na salita. Ang וּבַ־ ay likas na isinaling “Ngunit sa” upang maipakita ang banayad na pagsalungat sa konteksto ng pagsaway ni Moises.
- source_word: אֵינְ/כֶם מַאֲמִינִם
  choice: hindi kayo nagtiwala
  rationale: Ang negatibong kataga kasama ng Hiphil participle ng אמן ay naglalarawan sa patuloy na saloobin ng Israel sa isinasalaysay na kalagayan. Sa modernong Tagalog, malinaw at natural ang “hindi kayo nagtiwala,” habang saklaw pa rin nito ang diwa ng hindi paniniwala.
- source_word: בַּ/יהוָה
  choice: sa PANGINOON
  rationale: Ang pang-ukol ב pagkatapos ng אמן ay nagmamarka sa Diyos bilang pinag-uukulan ng paniniwala o pagtitiwala. Ang יְהוָה ay isinaling “PANGINOON” ayon sa tradisyonal na representasyon ng banal na pangalan.
- source_word: אֱלֹהֵי/כֶם
  choice: na inyong Diyos
  rationale: Tuwirang pinananatili ng “inyong Diyos” ang pangmaramihang ikalawang panauhan at ang ugnayang tipan. Ginamit ang pang-angkop na “na” upang maging natural ang pariralang “sa PANGINOON na inyong Diyos.”
theological_decisions:
- issue: Kahulugan ng אמן + ב kapag ang PANGINOON ang layon
  choice: nagtiwala sa PANGINOON na inyong Diyos
  alternative: naniwala sa PANGINOON na inyong Diyos; naniwala sa sinabi ng PANGINOON na inyong Diyos
  rationale: Maaaring tumukoy ang konstruksyon sa paniniwala o pagtitiwala sa isang persona. Pinili ang “nagtiwala sa” dahil natural ito sa Tagalog at hindi nito nililimitahan ang paratang sa pagtanggap lamang ng isang pahayag. Pinananatili sa talababa ang “naniwala” upang kilalanin ang tunay na lawak ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kayo” at “inyong” upang mapanatili ang pangmaramihang kausap; iniwasan ang labis na teknikal o makalumang pananalita.
