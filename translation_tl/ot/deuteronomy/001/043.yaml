  text: וָ/אֲדַבֵּ֥ר אֲלֵי/כֶ֖ם וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּמְרוּ֙ אֶת פִּ֣י יְהוָ֔ה וַ/תָּזִ֖דוּ וַ/תַּעֲל֥וּ הָ/הָֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/043.yaml
  text: So I spoke to you[a], but you did not listen; you rebelled against the mouth of Yahweh, acted presumptuously, and went up into the hill country.
translation:
  language: tl
  text: Kaya nagsalita ako sa inyo, ngunit hindi kayo nakinig; naghimagsik kayo laban sa utos ni Yahweh,[a] nagpakapangahas kayo, at umahon kayo sa kabundukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “bibig ni Yahweh”; ibig sabihin, ang iniutos ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: Kaya nagsalita ako sa inyo
  rationale: Ang piel na דּבר ay nangangahulugang “magsalita.” Ipinahihiwatig ng “Kaya” ang kaugnayan nito sa naunang pangyayari, samantalang pinananatili ng “sa inyo” ang pangmaramihang kausap.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: ngunit hindi kayo nakinig
  rationale: Maaaring mangahulugan ang שׁמע na makarinig, makinig, o sumunod. Pinananatili ng “nakinig” ang leksikal na lawak at iniiwasang ulitin nang maaga ang diwa ng paghihimagsik sa kasunod na sugnay.
- source_word: וַתַּמְרוּ אֶת־פִּי יְהוָה
  choice: naghimagsik kayo laban sa utos ni Yahweh
  rationale: Ang מרה ay tahasang tumutukoy sa paghihimagsik o pagsuway sa awtoridad. Ang “bibig ni Yahweh” ay idyomang Hebreo para sa sinabi o iniutos niya, kaya “utos” ang malinaw at likas na salin sa pangunahing teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulong pamalit.
- source_word: וַתָּזִדוּ
  choice: naging pangahas kayo
  rationale: Ipinahihiwatig ng זיד ang mapagmataas, walang-pakundangan, o pangahas na pagkilos. Ang “naging pangahas” ay likas sa modernong Tagalog at pinananatili ang moral na bigat nang hindi ito isinasanib sa kasunod na pag-ahon.
- source_word: וַתַּעֲלוּ הָהָרָה
  choice: umahon sa kabundukan
  rationale: Ang עלה ay karaniwang “umahon,” at ang lokatibong anyo ng הָהָרָה ay nagpapahayag ng pagpunta sa bulubunduking lupain, hindi lamang sa iisang bundok.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng “bibig ni Yahweh”
  choice: utos ni Yahweh sa pangunahing teksto, na may literal na anyo sa talababa
  alternative: bibig ni Yahweh
  rationale: Idyoma ito para sa ipinahayag na utos ni Yahweh. Nililinaw ng pangunahing salin ang kahulugan habang pinananatili sa talababa ang kongkretong Hebreong pananalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “kayo,” ang natural na “kabundukan” para sa bulubunduking rehiyon, at isang maikling talababa upang mapanatili ang literal na idyomang Hebreo nang hindi ginagawang malabo ang pangunahing teksto.
