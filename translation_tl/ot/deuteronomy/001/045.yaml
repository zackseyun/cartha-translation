base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/045.yaml
  text: Then you returned and wept before Yahweh[a], but Yahweh did not listen to your voice or pay attention to you.
translation:
  language: tl
  text: Pagkatapos ay bumalik kayo at umiyak sa harap ni Yahweh. Ngunit hindi pinakinggan ni Yahweh ang tinig ninyo ni binigyang-pansin man kayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Hindi niya dininig ang tinig ninyo ni pinakinggan kayo nang mabuti.” Gumagamit ang Hebreo ng dalawang halos magkapantay na pandiwa para sa pagdinig o pakikinig, na nagdiriing hindi tumugon si Yahweh sa kanilang pag-iyak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: Pagkatapos ay bumalik kayo
  rationale: Ang שׁוּב ay nangangahulugang “bumalik” o “tumalikod/pumihit pabalik.” Ang “Pagkatapos ay” ay natural na naghahayag ng kasunod na pangyayari sa salaysay.
- source_word: וַתִּבְכּוּ
  choice: at umiyak
  rationale: Ang בכה ay “umiyak” o “tumangis.” Pinili ang karaniwan at marangal na “umiyak” nang hindi nagdaragdag ng tinding wala sa Hebreo.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ang לִפְנֵי ay literal na “sa harap ng” o “sa presensiya ng.” Ang “sa harap ni Yahweh” ay natural sa Tagalog at pinananatili ang personal na pangalan.
- source_word: וְלֹא שָׁמַע יְהוָה בְּקֹלְכֶם
  choice: Ngunit hindi pinakinggan ni Yahweh ang tinig ninyo
  rationale: Ang שׁמע na may בְּקוֹל ay maaaring tumukoy sa pakikinig na may diwang pagdinig o pagtugon. Pinananatili ng “ang tinig ninyo” ang konkretong larawan ng Hebreo, samantalang malinaw sa konteksto na hindi ito simpleng kawalan ng pandinig.
- source_word: וְלֹא הֶאֱזִין אֲלֵיכֶם
  choice: ni binigyang-pansin man kayo
  rationale: Ang האזין ay “makinig nang mabuti” o “magbigay-pansin.” Ipinahahayag ng salin ang ikalawang, halos kapantay na pandiwa nang hindi inuulit nang matigas ang “pinakinggan.”
theological_decisions:
- issue: Paglalarawan sa hindi pakikinig ni Yahweh
  choice: hindi pinakinggan ... ni binigyang-pansin man
  alternative: hindi narinig ... ni ikiniling ang tainga
  rationale: Hindi ipinahihiwatig ng talata na walang kakayahang makarinig si Yahweh; sa idyomang Hebreo, ang dalawang magkatulad na pandiwa ay nagdiriin na hindi niya pinakinggan o tinugon ang kanilang pag-iyak. Gayunman, pinananatili sa talababa ang mas literal na anyo.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalang tipan ang יְהוָה sa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tinig ninyo” upang mapanatili ang larawan ng Hebreo, at ang “binigyang-pansin” upang natural na maipahayag ang magkatulad na ikalawang pandiwa.
