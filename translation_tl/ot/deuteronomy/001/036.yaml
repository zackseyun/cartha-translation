source:
  edition: WLC
  text: זֽוּלָתִ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ ה֣וּא יִרְאֶ֔/נָּה וְ/לֽ/וֹ אֶתֵּ֧ן אֶת הָ/אָ֛רֶץ אֲשֶׁ֥ר דָּֽרַךְ בָּ֖/הּ וּ/לְ/בָנָ֑י/ו יַ֕עַן אֲשֶׁ֥ר מִלֵּ֖א אַחֲרֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/036.yaml
  text: except Caleb son of Jephunneh; he shall see it[a], and to him I will give the land on which he has walked, and to his sons, because he has fully followed Yahweh.
translation:
  language: tl
  text: maliban kay Caleb na anak ni Jefune. Makikita niya iyon, at ibibigay ko sa kanya at sa kanyang mga anak na lalaki[a] ang lupaing kanyang nilakaran, sapagkat lubos siyang sumunod kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga anak” o “mga inapo”; sa Hebreo, “mga anak na lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֽוּלָתִ֞י
  choice: maliban kay
  rationale: Nagpapakilala ito ng tanging eksepsiyon sa naunang hatol; natural sa Filipino ang “maliban kay” bago ang pangalan ng tao.
- source_word: כָּלֵ֤ב בֶּן יְפֻנֶּה֙
  choice: Caleb na anak ni Jefune
  rationale: Ginamit ang karaniwang anyong Filipino para sa ugnayang ama at anak, habang pinananatili ang nakikilalang transliterasyon ng mga pangalan.
- source_word: ה֣וּא יִרְאֶ֔נָּה
  choice: Makikita niya iyon
  rationale: Ang pambabaeng hulapi ay tumutukoy pabalik sa “lupain.” Ang “iyon” ay natural na anapora sa Filipino at hindi inuulit nang di-kailangan ang pangngalan.
- source_word: וְלֽוֹ אֶתֵּ֧ן
  choice: at ibibigay ko sa kanya
  rationale: Pinananatili ang pangako sa hinaharap at malinaw na ipinahahayag si Caleb bilang tatanggap.
- source_word: הָאָ֛רֶץ אֲשֶׁ֥ר דָּֽרַךְ בָּ֖הּ
  choice: ang lupaing kanyang nilakaran
  rationale: Pinananatili ang kongkretong larawan ng paglakad o pagtapak sa lupain sa isang natural at marangal na pariralang Filipino.
- source_word: וּלְבָנָ֑יו
  choice: at sa kanyang mga anak na lalaki
  rationale: Tiyak na panlalaking maramihan ang Hebrew בנים; pinananatili ito sa pangunahing teksto, samantalang itinatala sa talababa ang posibleng mas malawak na diwa sa konteksto ng mana.
- source_word: יַ֕עַן אֲשֶׁ֥ר
  choice: sapagkat
  rationale: Malinaw at marangal na pangatnig na nagsasaad ng dahilan ng pangako.
- source_word: מִלֵּ֖א אַחֲרֵ֥י
  choice: lubos siyang sumunod
  rationale: Ang literal na idyomang “pinuno ang pagsunod sa likod” ay nangangahulugang ganap o buong pusong pagsunod; ang salin ay natural ngunit pinananatili ang tindi nito.
- source_word: יְהוָֽה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang tipan na nasa tekstong Hebrew, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang hayagang nasa pinagmulan. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon” nang hindi nagdaragdag ng interpretasyong denominasyonal.
- issue: Saklaw ng בָנָיו sa pangakong mana
  choice: mga anak na lalaki, na may talababa
  alternative: mga anak; mga inapo
  rationale: Panlalaking maramihan ang pormang Hebrew, kaya iyon ang nasa pangunahing teksto. Gayunman, maaaring sumaklaw ang gamit nito sa mga anak o salinlahi sa konteksto ng mana; pinananatili ang tensiyong leksikal sa talababa sa halip na tahimik na palawakin ang teksto.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinanatili ang kongkretong larawan ng paglakad sa lupain, ang diin ng lubos na pagsunod, at ang personal na pangalang Yahweh. Ang [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
