id: DEU.1.37
reference: Deuteronomy 1:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: גַּם בִּ/י֙ הִתְאַנַּ֣ף יְהוָ֔ה בִּ/גְלַלְ/כֶ֖ם לֵ/אמֹ֑ר גַּם אַתָּ֖ה לֹא תָבֹ֥א שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/037.yaml
  text: Yahweh was angry with me also because of you[a], saying[b], 'You also shall not enter there.'
translation:
  language: tl
  text: Nagalit din sa akin si Yahweh dahil sa inyo[a] at sinabi[b], “Ikaw man ay hindi makakapasok doon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Nagalit sa akin si Yahweh dahil sa inyo.”
    reason: lexical_alternative
  - marker: b
    text: Ihambing sa Bilang 20:12, kung saan ang hindi pagpasok ni Moises sa lupain ay iniuugnay sa sarili niyang pagkukulang sa Meriba; dito sa Deuteronomio, binibigyang-diin ang papel ng bayan sa pangyayari.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: din / man
  rationale: Dalawang ulit ang particle na ito. Ang “din” sa unang sugnay at “man” sa ikalawa ay natural sa Filipino at kapuwa nagpapanatili ng diwang pandagdag at pagbibigay-diin.
- source_word: בִּי
  choice: sa akin
  rationale: Kasama ng הִתְאַנַּף, tinutukoy ng ב ang pinag-ukulan ng galit. Ang “nagalit sa akin” ang natural at tuwirang pahayag sa Filipino.
- source_word: הִתְאַנַּף
  choice: nagalit
  rationale: Ipinahahayag ng anyo ng pandiwa ang pagkagalit o pagiging galit. Malinaw at sapat ang bigat ng “nagalit” nang hindi pinalalabis ang tindi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בִּגְלַלְכֶם
  choice: dahil sa inyo
  rationale: Tuwirang ipinahahayag ng parirala ang sanhi o dahilan. Hindi nito nilulutas sa salin ang ugnayan nito sa sariling pagkukulang ni Moises na binabanggit sa ibang talata.
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Ipinakikilala nito ang nilalaman ng sinabi ni Yahweh. Sa Filipino, mas natural sa kontekstong pasalaysay ang “at sinabi” kaysa sa literal na “na sinasabi.”
- source_word: אַתָּה
  choice: ikaw
  rationale: Panghalip na ikalawang panauhang panlalaking isahan ito at partikular na tumutukoy kay Moises.
- source_word: לֹא תָבֹא
  choice: hindi makakapasok
  rationale: Sa konteksto, ang בוא ay tumutukoy sa pagpasok sa lupaing tinatalakay. Ang “hindi makakapasok” ay natural na Filipino at nagpapahayag ng ipinagkait na pagpasok.
- source_word: שָׁם
  choice: doon
  rationale: Pinananatili ng “doon” ang pantukoy na pook ng Hebreong pang-abay at tumutukoy sa lupaing nabanggit sa konteksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang tahasang nasa Hebreo; kaya pinananatili itong “Yahweh” at hindi pinapalitan ng titulo.
- issue: Dahilan ng pagkakait kay Moises na makapasok sa lupain
  choice: Pinananatili sa pangunahing teksto ang pahayag na nagalit si Yahweh kay Moises “dahil sa inyo.”
  alternative: Ipaliwanag sa pangunahing teksto na sariling pagkukulang ni Moises sa Meriba ang dahilan, o ibunton nang lubos sa bayan ang pananagutan.
  rationale: Binibigyang-diin ng Deuteronomio 1:37 ang papel ng bayan, samantalang iniuugnay ng Bilang 20:12 ang pagkakait sa pagkukulang ni Moises. Hindi nilulutas o pinapawi ng salin ang tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na ayos na pandiwa muna; ang “Ikaw man” ay nagpapanatili sa ikalawang גַּם at sa tuon kay Moises. Lahat ng marker ng talababa ay nasa pangunahing teksto.
