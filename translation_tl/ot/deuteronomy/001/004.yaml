base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/004.yaml
  text: after he had struck down Sihon king of the Amorites[a], who lived in Heshbon, and Og king of Bashan, who lived in Ashtaroth at Edrei.
translation:
  language: tl
  text: matapos niyang talunin si Sihon, ang hari ng mga Amoreo na naninirahan sa Hesbon, at si Og, ang hari ng Basan na naninirahan sa Astarot, sa Edrei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “na naninirahan sa Astarot at sa Edrei.” Kapuwa pangalan ng lugar ay may sariling pang-ukol na “sa” sa Hebreo, at hindi ganap na malinaw ang eksaktong ugnayan ng dalawang lugar.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי
  choice: pagkatapos
  rationale: Ipinakikilala nito ang panahong kasunod ng naunang pagkilos at natural na nagdurugtong sa pangunahing pangungusap ng talata 3.
- source_word: הַכֹּתוֹ
  choice: niyang pabagsakin
  rationale: Ang infinitibong נכה na may hulaping panghalip ay tumutukoy sa naunang pagkilos ng lalaki. Pinananatili ng “pabagsakin” ang lakas ng pandiwa sa konteksto ng pakikidigma, sa halip na pahinain ito bilang simpleng “talunin.”
- source_word: אֵת
  choice: '[pananda ng tiyak na layon, hindi isinalin]'
  rationale: Minamarkahan nito sina Sihon at Og bilang mga tiyak na layon ng pandiwa ngunit wala itong kailangang tuwirang katumbas sa Tagalog.
- source_word: סִיחֹן
  choice: Sihon
  rationale: Karaniwang transliterasyon ng pangalang pantangi sa Tagalog.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: hari ng mga Amoreo
  rationale: Malinaw at natural nitong ipinahahayag ang konstruktong tumutukoy kay Sihon bilang hari ng grupong etniko.
- source_word: אֲשֶׁר יוֹשֵׁב
  choice: na naninirahan
  rationale: Sa kontekstong ito, ang יָשַׁב ay tumutukoy sa paninirahan o pagkakaroon ng luklukan sa isang lugar, hindi sa literal na pag-upo.
- source_word: בְּחֶשְׁבּוֹן
  choice: sa Hesbon
  rationale: Natural na katumbas ng pang-ukol na בְּ bago ang pangalan ng lungsod.
- source_word: וְאֵת
  choice: at si
  rationale: Ang “at” ang kumakatawan sa pangatnig, samantalang ang “si” ang likas na pananda sa Tagalog para sa pangalang pantanging layon na Og.
- source_word: עוֹג
  choice: Og
  rationale: Karaniwang transliterasyon ng pangalang pantangi.
- source_word: מֶלֶךְ הַבָּשָׁן
  choice: hari ng Basan
  rationale: Direkta at natural na salin ng konstruktong nagsasaad ng rehiyong pinaghaharian ni Og.
- source_word: אֲשֶׁר יוֹשֵׁב בְּעַשְׁתָּרֹת בְּאֶדְרֶעִי
  choice: na naninirahan sa Astarot, sa Edrei
  rationale: Pinananatili ang dalawang pangalan ng lugar at ang pag-uulit ng pang-ukol nang hindi tiyakang ipinapakahulugan ang hindi ganap na malinaw na ugnayan ng Astarot at Edrei.
