  verdict: revise
  source_fidelity: Tumpak na naipapasa ng draft ang panahong ipinahihiwatig ng אַחֲרֵי, ang dalawang layon ng pandiwang נכה, mga titulo, at mga lugar. Gayunman, ang “pabagsakin” ay anyong makapangyarihan/causative at maaaring magmungkahi ng pagpapabagsak sa pamamagitan ng iba, samantalang ang Hebreo ay tuwirang nagsasaad na siya ang nanakit o tumalo. Ang “talunin” ang mas tuwirang modernong Filipino sa kontekstong militar, bagaman bahagyang mas malawak ang saklaw nito kaysa “strike down.”
  naturalness: Natural sa pangkalahatan ang rehistro at mga pangalan. Mas malinaw at mas maayos ang daloy kung ang sugnay na “na naninirahan” ay tuwirang ikakabit sa bawat hari sa halip na iugnay sa “at” bilang kapantay ng titulo.
  terminology: Ang Sihon, Amoreo, Hesbon, Og, Basan, Astarot, at Edrei ay magkakatugma at angkop na anyong Filipino. Ang “hari ng mga Amoreo” at “hari ng Basan” ay wasto. Napananatili ng “sa Astarot, sa Edrei” ang inuulit na pang-ukol at hindi lubusang nilulutas ang pinagtatalunang ugnayan ng mga lugar.
