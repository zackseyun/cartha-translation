  - severity: low
    issue: Medyo maluwag ang pagkakaugnay ng “at naninirahan” sa mga titulo.
    rationale: Bagaman naiintindihan, ang Hebreo ay may magkahiwalay na relative clause para sa bawat hari. Ang pag-uulit ng “na naninirahan” pagkatapos ng bawat titulo ay mas malinaw at mas malapit sa ayos ng pinagmulan.
