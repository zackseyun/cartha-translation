translation_notes:
  register: Makabago at marangal na Filipino, na gumagamit ng karaniwang anyo ng mga pangalang biblikal. Ang parirala ay sadyang nagsisimula sa “pagkatapos” sapagkat ipinagpapatuloy nito ang pangungusap mula sa talata 3. Hindi pinakinis nang labis ang pagkakasunod ng Astarot at Edrei upang mapanatili ang tunay na sintaktikong kalabuan ng Hebreo.
