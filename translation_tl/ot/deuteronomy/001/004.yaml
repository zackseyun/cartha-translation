  to: matapos niyang talunin si Sihon, ang hari ng mga Amoreo na naninirahan sa Hesbon, at si Og, ang hari ng Basan na naninirahan sa Astarot, sa Edrei.[a]
  rationale: Pinalitan ang “pabagsakin” ng “talunin” upang maiwasan ang di-sinasadyang causative na kahulugan habang pinananatili ang kontekstong militar. Inayos ang mga sugnay na panuring upang malinaw na bawat isa ay tumutukoy sa kani-kaniyang hari. Pinanatili ang “sa Astarot, sa Edrei” at ang talababa upang huwag ipilit ang relasyon ng dalawang lugar na hindi ganap na nililinaw ng Hebreo.
