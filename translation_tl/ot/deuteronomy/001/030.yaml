base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/030.yaml
  text: Yahweh your God[a], who goes before you, will himself fight for you, just as he did for you in Egypt before your eyes.
translation:
  language: tl
  text: Si Yahweh na inyong Diyos, na nangunguna sa inyo, siya mismo ang makikipaglaban para sa inyo, gaya ng lahat ng ginawa niya para sa inyo sa Ehipto sa harap ng inyong mga mata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, mas literal na “ginawa niya kasama ninyo.” Sa konteksto, tumutukoy ito sa ginawa ni Yahweh alang-alang sa Israel sa Ehipto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman anyong maramihan ang pangngalan sa Hebreo, malinaw na isahan ang kahulugan nito sa pagkakaugnay kay Yahweh at sa hulaping pangalawang panauhang maramihan.
- source_word: הַהֹלֵךְ לִפְנֵיכֶם
  choice: na nangunguna sa inyo
  rationale: Ipinahahayag ng participle ang patuloy na pagkilos ni Yahweh bilang tagapanguna; natural at malinaw ito sa modernong Tagalog.
- source_word: הוּא
  choice: siya mismo
  rationale: 'Pinananatili ang diin ng hiwalay na panghalip sa Hebreo: si Yahweh mismo ang kikilos.'
- source_word: יִלָּחֵם לָכֶם
  choice: ang makikipaglaban para sa inyo
  rationale: Ang Niphal ng לחם dito ay tumutukoy sa pakikipaglaban alang-alang sa Israel; ang “para sa inyo” ang likas na katumbas sa Tagalog.
- source_word: כְּכֹל אֲשֶׁר
  choice: gaya ng lahat ng
  rationale: Pinananatili ang saklaw ng כֹל (“lahat”) sa paghahambing sa mga ginawa ng Diyos sa Ehipto.
- source_word: עָשָׂה אִתְּכֶם
  choice: ginawa niya para sa inyo
  rationale: Literal na “ginawa niya kasama/kasama ninyo,” ngunit sa konteksto ay tumutukoy sa pagkilos ni Yahweh alang-alang sa Israel; mas natural at malinaw ang “para sa inyo.”
- source_word: בְּמִצְרַיִם
  choice: sa Ehipto
  rationale: Karaniwang lokatibong salin ng parirala.
- source_word: לְעֵינֵיכֶם
  choice: na nasaksihan ng sarili ninyong mga mata
  rationale: Natural na Tagalog na nagpapanatili sa idyomatikong diin na hayagang nakita mismo ng Israel ang mga ginawa ng Diyos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Tagaganap ng pakikipaglaban
  choice: siya mismo ang makikipaglaban
  alternative: makikipaglaban siya
  rationale: Ang tahasang הוּא ay may diin; hindi lamang ipinapangako ang tulong ng Diyos kundi binibigyang-diin na siya mismo ang lalaban para sa Israel.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang maramihang “inyo” ayon sa kausap sa Hebreo. Pinanatili ang personal na pangalang “Yahweh,” ang diin ng “siya mismo,” at ang saklaw ng “lahat” sa paghahambing.
