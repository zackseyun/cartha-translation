  text: וַ/יִּיטַ֥ב בְּ/עֵינַ֖/י הַ/דָּבָ֑ר וָ/אֶקַּ֤ח מִ/כֶּם֙ שְׁנֵ֣ים עָשָׂ֣ר אֲנָשִׁ֔ים אִ֥ישׁ אֶחָ֖ד לַ/שָּֽׁבֶט׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/023.yaml
  text: And the matter seemed good in my eyes[a], so I took from among you twelve men, one man for each tribe.
translation:
  language: tl
  text: Nagustuhan ko ang panukalang iyon[a], kaya kumuha ako mula sa inyo ng labindalawang lalaki, tig-iisa mula sa bawat lipi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Naging mabuti sa aking paningin ang bagay.” Maaari ring isalin na “Nasiyahan ako sa panukalang iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב בְּעֵינַי
  choice: Nagustuhan ko
  rationale: Likas na ipinapahayag sa modernong Tagalog ang idyomang Hebreo na literal na nagsasabing naging mabuti ang bagay sa paningin ni Moises; ipinapakita nito ang personal niyang pagsang-ayon.
- source_word: הַדָּבָר
  choice: ang panukalang iyon
  rationale: Sa konteksto, tumutukoy ang דָּבָר sa mungkahing kababanggit lamang, kaya mas malinaw ang “panukala” kaysa sa pangkalahatang “bagay.”
- source_word: וָאֶקַּח
  choice: kumuha ako
  rationale: Pinananatili ang karaniwang kahulugan ng לקח; sa konteksto, malinaw na ang pagkuha ay pagpili mula sa bayan.
- source_word: מִכֶּם
  choice: mula sa inyo
  rationale: Ipinapahayag ang pinagmulan ng mga lalaking kinuha mula sa kapulungan ng Israel.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: labindalawang lalaki
  rationale: Tiyak na labindalawang lalaking nasa hustong gulang ang tinutukoy, kaya hindi ito ginawang neutral sa kasarian.
- source_word: אִישׁ אֶחָד לַשָּׁבֶט
  choice: tig-iisa mula sa bawat lipi
  rationale: 'Natural na Tagalog ang “tig-iisa” para sa distributibong diwa: isang lalaki mula sa bawat lipi.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Isinalin sa karaniwang idyoma ang Hebreong “mabuti sa aking paningin,” habang inilagay sa talababa ang literal na anyo. Ginamit ang “lipi” para sa tribong panlipi ng Israel at ang “tig-iisa” upang malinaw na maipakita ang distribusyon.
