  text: אִם יִרְאֶ֥ה אִישׁ֙ בָּ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה הַ/דּ֥וֹר הָ/רָ֖ע הַ/זֶּ֑ה אֵ֚ת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֣ר נִשְׁבַּ֔עְתִּי לָ/תֵ֖ת לַ/אֲבֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/035.yaml
  text: Not one man among these men of this evil generation shall see the good land that I swore to give to your fathers—[a]
translation:
  language: tl
  text: Wala ni isang lalaki sa mga lalaking ito—sa masamang salinlahing ito—ang makakakita sa mabuting lupain na ipinanumpa kong ibibigay sa inyong mga ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga ninuno.” Sa Hebreo: “mga ama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wala ni isang ... ang
  rationale: Ang אִם ay bahagi rito ng pormulang panunumpa na nagpapahayag ng mariing pagtanggi, hindi ng karaniwang kondisyong “kung.” Likas sa Tagalog ang “Wala ni isang ... ang” upang mapanatili ang diin.
- source_word: יִרְאֶה
  choice: makakakita
  rationale: Tuwirang kahulugan ng ראה ang “makakita.” Sa konteksto, ipinahihiwatig nito ang pagkakait sa pagpasok at pagdanas sa lupain nang hindi iyon idinaragdag sa mismong salin.
- source_word: אִישׁ בָּאֲנָשִׁים הָאֵלֶּה
  choice: isang lalaki sa mga lalaking ito
  rationale: Pinananatili ang isahang אִישׁ at ang panlalaking maramihang אֲנָשִׁים, pati ang partitive na diwa ng בְּ bilang “sa mga.”
- source_word: הַדּוֹר הָרָע הַזֶּה
  choice: sa masamang salinlahing ito
  rationale: Ang דּוֹר ay “salinlahi,” at ang רַע ay may moral na bigat dito, kaya “masama” ang angkop kaysa isang salitang tumutukoy lamang sa di-kanais-nais na kalagayan.
- source_word: אֶת הָאָרֶץ הַטּוֹבָה
  choice: sa mabuting lupain
  rationale: Ang “mabuting lupain” ay tuwiran at natural na katumbas na nagpapahiwatig ng kanais-nais na lupain at pagpapala nang walang pagpapalawak.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי
  choice: isinumpa kong
  rationale: Ang Niphal ng שׁבע ay nangangahulugang manumpa. Ang “isinumpa kong” ay malinaw na tumutukoy sa taimtim na pangako ng Diyos.
- source_word: לָתֵת
  choice: ibibigay
  rationale: Karaniwang kahulugan ng נתן ang “ibigay”; ginamit ang anyong panghinaharap na natural sa sugnay na ito.
- source_word: לַאֲבֹתֵיכֶם
  choice: sa inyong mga ama
  rationale: Pinananatili sa pangunahing teksto ang tahasang panlalaking maramihan ng Hebreo. Ang mas malawak at mas natural sa ilang konteksto na “mga ninuno” ay inilagay bilang alternatibo sa talababa.
theological_decisions:
- issue: Saklaw ng לַאֲבֹתֵיכֶם
  choice: sa inyong mga ama
  alternative: sa inyong mga ninuno
  rationale: Tahasan ang Hebreo na “mga ama,” na sa konteksto ay tumutukoy sa mga patriyarkang ninuno ng Israel. Pinananatili ng pangunahing teksto ang anyo ng pinagmulan, habang kinikilala sa talababa ang mas malawak na kahulugan.
- issue: Diwa ng “makakakita” sa lupain
  choice: makakakita
  alternative: makapapasok sa / mararanasan
  rationale: Bagaman ang paghatol ay praktikal na nangangahulugang hindi sila makapapasok at makikinabang sa lupain, ang Hebreo ay gumagamit ng pandiwang “makakita.” Pinananatili ito upang huwag gawing tahasang pahayag ang ipinahihiwatig lamang ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sadyang pag-uulit ng “lalaki/mga lalaki” at ginamit ang mga gitling upang malinaw na ipaliwanag na ang mga lalaking tinutukoy ay kabilang sa masamang salinlahing iyon.
