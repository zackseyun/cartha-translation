revisions:
- from: Tingnan mo, inilagay na ni Yahweh na iyong Diyos sa harap mo ang lupain. Umakyat ka at angkinin mo iyon, ayon sa sinabi sa iyo ni Yahweh, ang Diyos ng iyong mga ama.[a] Huwag kang matakot at huwag kang panghinaan ng loob.
  to: Tingnan mo, inilagay na ni Yahweh, iyong Diyos, sa harap mo ang lupain. Umakyat ka at angkinin mo ito, gaya ng sinabi sa iyo ni Yahweh, ang Diyos ng iyong mga ama.[a] Huwag kang matakot o panghinaan ng loob.
  rationale: Inayos ang bantas at ayos ng mga appositive upang maging malinaw at natural sa modernong Tagalog, at pinalitan ang “iyon” ng “ito.” Walang binagong kahulugan o idinagdag na interpretasyong doktrinal.
