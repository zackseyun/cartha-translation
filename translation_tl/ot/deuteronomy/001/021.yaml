base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/021.yaml
  text: See[a], Yahweh your God has set the land before you. Go up, take possession, just as Yahweh, the God of your fathers, has spoken to you. Do not fear or be dismayed.
translation:
  language: tl
  text: Tingnan mo, inilagay na ni Yahweh, iyong Diyos, sa harap mo ang lupain. Umakyat ka at angkinin mo ito, gaya ng sinabi sa iyo ni Yahweh, ang Diyos ng iyong mga ama.[a] Huwag kang matakot o panghinaan ng loob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “ang Diyos ng iyong mga ninuno.” Literal sa Hebreo: “ang Diyos ng iyong mga ama,” isang pormulang ginagamit kaugnay ng tipan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Tingnan mo
  rationale: Isang pautos na ginagamit upang ituon ang pansin. Pinananatili ng “Tingnan mo” ang tuwirang lakas ng Hebreo sa natural na makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang tipanang pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tumpak na inilalarawan ang construct form na may panlaping pang-isahang panauhan; ang isahang kausap ay kumakatawan sa Israel bilang isang bayan.
- source_word: נָתַן ... לְפָנֶיךָ
  choice: inilagay na ... sa harap mo
  rationale: Pinananatili ang larawang ang lupain ay inilagay o iniharap na sa Israel upang pasukin at ariin.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Karaniwang tumutukoy sa lupaing ipinangako; mas angkop ang “lupain” kaysa “bansa” sa kontekstong ito.
- source_word: עֲלֵה
  choice: Umakyat ka
  rationale: Pinananatili ang karaniwang heograpiko at militar na pananalita para sa pagsulong papasok sa maburol na lupain.
- source_word: רֵשׁ
  choice: angkinin mo iyon
  rationale: Ipinahahayag ang aktibong pagkuha at paghawak sa lupaing ipinagkaloob, nang hindi nililimitahan ang salita sa simpleng pagtira lamang.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: ayon sa sinabi
  rationale: Ang pandiwa ay “nagsalita/nagsabi”; hindi ito pinalitan ng “ipinangako,” bagaman may pahiwatig ng pangako sa konteksto.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: ang Diyos ng iyong mga ama
  rationale: Pinananatili ang tahasang panlalaking pangmaramihang anyo at ang mahalagang pormulang tipanan; nililinaw sa talababa ang mas natural na alternatibo.
- source_word: אַל תִּירָא
  choice: Huwag kang matakot
  rationale: Tuwiran, malinaw, at natural na katumbas ng pagbabawal.
- source_word: וְאַל תֵּחָת
  choice: at huwag kang panghinaan ng loob
  rationale: Ipinahahayag ang diwang huwag magapi, manghina, o mawalan ng tapang, habang pinananatiling naiiba sa simpleng pagkatakot.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Ang pormulang אֱלֹהֵי אֲבֹתֶיךָ
  choice: ang Diyos ng iyong mga ama
  alternative: ang Diyos ng iyong mga ninuno
  rationale: Pinananatili sa pangunahing teksto ang literal na panlalaking “mga ama” at ang pormulang tipanan, habang ibinibigay sa talababa ang natural na mas malawak na katumbas sa Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang isahang “mo/ka” upang mapanatili ang gramatikal na isahang kausap sa Hebreo, na tumutukoy sa Israel bilang isang kolektibong bayan. Iniwasan ang sobrang arkaykong pananalita at pinanatili ang magkahiwalay na diwa ng pagkatakot at panghihina ng loob.
