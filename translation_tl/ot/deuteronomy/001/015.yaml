  naturalness: Makabago at marangal ang Filipino ng draft. Ang ‘itinalaga,’ ‘lipi,’ at ‘mga opisyal’ ay angkop. Mas natural at mas malinaw ang pag-uulit ng ‘mga pinuno ng’ sa bawat antas kaysa sa paghahalo ng ‘ng’ at ‘tig-’ sa isang pinaikling talaan.
  terminology: Ang ‘mga pinuno’ ay angkop para sa רָאשִׁים at שָׂרֵי nang hindi ipinipilit na puro militar ang tungkulin. Ang ‘mga lalaking marurunong at may kaalaman’ ay tapat sa Hebreo. Ang talababa ay dapat manatiling panlalaki sa alternatibong pagbasa upang umayon sa אֲנָשִׁים.
