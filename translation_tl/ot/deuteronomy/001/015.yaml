  to: 'Kaya kinuha ko ang mga pinuno ng inyong mga lipi—mga lalaking marurunong at may kaalaman[a]—at itinalaga ko silang mga pinuno sa inyo: mga pinuno ng libu-libo, mga pinuno ng daan-daan, mga pinuno ng tiglilimampu, at mga pinuno ng tig-sasampu, at mga opisyal para sa inyong mga lipi.'
