base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/015.yaml
  text: 'So I took the heads of your tribes[a], wise and knowledgeable men, and appointed them as heads over you: commanders of thousands, commanders of hundreds, commanders of fifties, commanders of tens, and officers for your tribes.'
translation:
  language: tl
  text: 'Kaya kinuha ko ang mga pinuno ng inyong mga lipi—mga lalaking marurunong at may kaalaman[a]—at itinalaga ko silang mga pinuno sa inyo: mga pinuno ng libu-libo, mga pinuno ng daan-daan, mga pinuno ng tiglilimampu, at mga pinuno ng tig-sasampu, at mga opisyal para sa inyong mga lipi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lalaking kilala.” Ang salitang Hebreo ay maaari ring tumukoy sa mga lalaking kilala o kinikilala ng iba, bagaman sa kontekstong ito ay malamang na tumutukoy ito sa mga lalaking may kaalaman o pag-unawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Kaya kinuha ko
  rationale: Ipinahihiwatig ng waw-consecutive ang kasunod na hakbang sa salaysay; natural na ipinapakita ng “Kaya” ang bunga ng naunang tagubilin habang pinananatili ang kilos sa unang panauhan.
- source_word: רָאשֵׁי שִׁבְטֵיכֶם
  choice: ang mga pinuno ng inyong mga lipi
  rationale: Sa kontekstong ito, ang רֹאשׁ ay tumutukoy sa mga taong nangunguna sa isang pangkat. Ang “mga pinuno” ay mas likas sa modernong Tagalog kaysa sa literal na “mga ulo,” ngunit pinananatili ang kaugnayan sa kasunod na רָאשִׁים.
- source_word: אֲנָשִׁים חֲכָמִים וִידֻעִים
  choice: mga lalaking marurunong at may kaalaman
  rationale: Tiyak na panlalaki ang אֲנָשִׁים, kaya isinalin itong “mga lalaki.” Ang חֲכָמִים ay praktikal na karunungang angkop sa pamumuno, at ang וִידֻעִים ay malamang na tumutukoy sa kaalaman o kinikilalang kakayahan; pinanatili sa talababa ang tunay na alternatibong “kilala.”
- source_word: וָאֶתֵּן אֹתָם רָאשִׁים עֲלֵיכֶם
  choice: at itinalaga ko silang mga pinuno ninyo
  rationale: Ang נתן na may layon at katungkulang ipinagkakaloob ay nagpapahayag ng pagtatalaga. Malinaw at natural ang “itinalaga,” at inuulit ng “mga pinuno” ang terminolohiya ng talata.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת וְשָׂרֵי חֲמִשִּׁים וְשָׂרֵי עֲשָׂרֹת
  choice: mga pinuno ng libu-libo, daan-daan, tiglilimampu, at tig-sasampu
  rationale: Ang שַׂר ay opisyal na may awtoridad. Ang “mga pinuno” ay hindi labis na nagtatakda kung militar o sibil ang tungkulin, samantalang inilalarawan ng mga bilang ang sunud-sunod na antas ng organisasyon.
- source_word: וְשֹׁטְרִים לְשִׁבְטֵיכֶם
  choice: at mga opisyal para sa inyong mga lipi
  rationale: Ang שֹׁטֵר ay isang nakabababang opisyal na maaaring may gawaing administratibo o pagpapatupad. Sapat na malawak ang “mga opisyal,” at ipinapakita ng “para sa inyong mga lipi” ang kanilang kaugnayan o pagkakatalaga sa mga lipi.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Pinili ang “lipi,” “itinalaga,” at “opisyal” bilang malinaw na mga terminong angkop sa kaayusang panlipunan at administratibo. Hindi ginawang “kumandante” ang שָׂר upang hindi ipilit na militar lamang ang diwa ng tungkulin.
