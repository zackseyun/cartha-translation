  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/נִּסַּ֣ע מֵ/חֹרֵ֗ב וַ/נֵּ֡לֶךְ אֵ֣ת כָּל הַ/מִּדְבָּ֣ר הַ/גָּדוֹל֩ וְ/הַ/נּוֹרָ֨א הַ/ה֜וּא אֲשֶׁ֣ר רְאִיתֶ֗ם דֶּ֚רֶךְ הַ֣ר הָֽ/אֱמֹרִ֔י כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֹתָ֑/נוּ וַ/נָּבֹ֕א עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/019.yaml
  text: Then we set out from Horeb and went through all that great and fearsome wilderness that you saw on the way to the hill country of the Amorites[a], just as Yahweh our God commanded us, and we came as far as Kadesh-barnea.
translation:
  language: tl
  text: Pagkatapos, umalis tayo mula sa Horeb at tinahak natin ang buong malawak at nakatatakot na ilang na iyon[a] na nakita ninyo sa daan patungo sa bulubunduking lupain ng mga Amorita, ayon sa iniutos sa atin ni Yahweh na ating Diyos. At nakarating tayo sa Kades-barnea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malawak at kakila-kilabot na ilang.” Ang salitang Hebreo ay maaaring tumukoy sa bagay o lugar na pumupukaw ng takot, sindak, o matinding pagpipitagan.
    reason: Pinananatili ang saklaw ng kahulugan ng נוֹרָא, na maaaring magpahiwatig ng takot, panghihilakbot, o pagpipitagan.
lexical_decisions:
- source_word: וַנִּסַּע
  choice: umalis tayo
  rationale: Ang נסע sa kontekstong ito ay tumutukoy sa pagliligpit ng kampo at pagsisimula ng paglalakbay. Likas sa makabagong Tagalog ang “umalis tayo” at malinaw nitong ipinahahayag ang pag-alis mula sa Horeb.
- source_word: וַנֵּלֶךְ אֵת כָּל הַמִּדְבָּר
  choice: tinahak natin ang buong … ilang
  rationale: Kasama ng אֵת at ng buong ilang bilang layon, ang הלך ay may diwang pagdaan o pagtahak sa isang rehiyon. Ang “tinahak” ay natural at pinananatili ang saklaw ng כָּל, “buo.”
- source_word: הַמִּדְבָּר
  choice: ilang
  rationale: Ang “ilang” ay angkop na salin ng מִדְבָּר bilang malawak at di-tinitirhang lupain; hindi nito nililimitahan ang lugar sa mabuhanging disyerto lamang.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: malawak at nakatatakot
  rationale: Sa paglalarawan ng isang ilang, likas na ipinahahayag ng “malawak” ang sukat na tinutukoy ng גָּדוֹל. Ang נוֹרָא ay yaong pumupukaw ng takot, sindak, o panghihilakbot; pinananatili ng “nakatatakot” ang pangunahing diwa nang hindi ito binibigyan ng moral na kahulugang “masama.”
- source_word: אֲשֶׁר רְאִיתֶם
  choice: na nakita ninyo
  rationale: Tuwirang pinananatili nito ang pag-apela ni Moises sa mismong nasaksihan ng kanyang mga tagapakinig.
- source_word: דֶּרֶךְ הַר הָאֱמֹרִי
  choice: patungo sa bulubunduking lupain ng mga Amorita
  rationale: Ang דֶּרֶךְ ay maaaring tumukoy sa daan o direksiyon, at ang הַר dito ay kolektibong tumutukoy sa mataas o bulubunduking rehiyon, hindi lamang sa isang bundok.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ayon sa iniutos
  rationale: Ipinahahayag nito ang pagtutugma ng kanilang paglalakbay sa utos ng Diyos nang natural sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Tuwirang pinananatili ang unang panauhang maramihang hulapi at ang kaugnayan ng Diyos sa nagsasalita at sa bayan.
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: Kades-barnea
  rationale: Isinasatitik ang pangalang-pook sa anyong malinaw at karaniwan sa Filipino.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon na hindi pinapalitan ang pangalan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tayo/natin/ating” sapagkat kabilang sa kausap ang nagsasalita, at pinanatili ang mga pangalang Yahweh, Horeb, Amorita, at Kades-barnea sa anyong transliterado.
