  text: But as for you[a], turn yourselves around and set out for the wilderness by the way of the Red Sea.
translation:
  language: tl
  text: Ngunit kayo, bumaling kayo at maglakbay patungo sa ilang sa daan patungong Dagat na Pula.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Dagat ng mga Tambo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Ngunit kayo
  rationale: Ang pangatnig at tahasang panghalip ay nagbibigay-diin at nagpapakita ng pagsalungat sa naunang hatol; natural itong naipahahayag sa Tagalog bilang “Ngunit kayo.”
- source_word: פְּנוּ לָכֶם
  choice: bumaling kayo
  rationale: Ipinag-uutos ng פנה ang pagbabago ng direksiyon, samantalang ang לָכֶם ay idyomatikong nagbibigay-diin sa mga kausap. Ang “bumaling kayo” ay malinaw at natural nang hindi dinaragdagan ng tahasang salitang “pabalik,” na wala naman sa Hebreo.
- source_word: וּסְעוּ
  choice: at maglakbay
  rationale: Karaniwang tumutukoy ang נסע sa pag-alis o pagpapatuloy ng paglalakbay. Ang “maglakbay” ay likas na utos sa Filipino at akma sa konteksto ng pagkilos patungo sa ilang.
- source_word: הַמִּדְבָּרָה
  choice: patungo sa ilang
  rationale: Ipinahihiwatig ng directional he ang pagkilos patungo sa ilang, nang hindi kinakailangang tukuyin na nakapasok na sila roon.
- source_word: דֶּרֶךְ
  choice: sa daang papunta sa
  rationale: Ipinakikilala ng דֶּרֶךְ ang rutang daraanan. Malinaw at natural sa modernong Filipino ang “sa daang papunta sa.”
- source_word: יַם סוּף
  choice: Dagat na Pula
  rationale: Ito ang nakaugaliang heograpikong pangalan sa Filipino at madaling makilala ng mga mambabasa. Inilalahad sa talababa ang mas literal na anyo ng Hebreo.
