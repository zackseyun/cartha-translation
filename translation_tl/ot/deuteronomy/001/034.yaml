base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/034.yaml
  text: And Yahweh heard the sound of your words[a], and he was angry and swore, saying,
translation:
  language: tl
  text: 'At narinig ni Yahweh ang sinabi ninyo,[a] at nagalit siya at nanumpa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “ang tinig ng inyong mga salita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וַיִּשְׁמַע
  choice: narinig
  rationale: Tuwirang katumbas ng pandiwang שׁמע sa salaysay at hindi nagpapahiwatig ng pagtanggap o pagsunod.
- source_word: אֶת קוֹל דִּבְרֵיכֶם
  choice: ang sinabi ninyo
  rationale: Natural at malinaw sa modernong Tagalog; ang mas literal na Hebreong idyoma ay inilagay sa talababa.
- source_word: וַיִּקְצֹף
  choice: nagalit siya
  rationale: Malinaw at likas na pagpapahayag ng matinding galit na tinutukoy ng קצף nang hindi dinaragdagan ang kahulugan.
- source_word: וַיִּשָּׁבַע
  choice: sumumpa
  rationale: Maikli at natural na katumbas ng Niphal ng שׁבע; ang nilalaman ng sumpa ay sumusunod sa kasunod na talata.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili ang pormal na tungkulin ng Hebreong infinitive na nagpapakilala sa tuwirang pananalita sa kasunod na talata.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang natural na “ang sinabi ninyo” sa pangunahing teksto, habang pinanatili sa talababa ang literal na Hebreong idyoma. Ang “na sinasabi” ay bahagyang pormal upang maipakita na ang pangungusap ay nagpapatuloy sa kasunod na talata.
