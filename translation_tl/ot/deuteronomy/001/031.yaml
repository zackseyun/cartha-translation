source:
  edition: WLC
  text: וּ/בַ/מִּדְבָּר֙ אֲשֶׁ֣ר רָאִ֔יתָ אֲשֶׁ֤ר נְשָׂאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֥ר יִשָּׂא אִ֖ישׁ אֶת בְּנ֑/וֹ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הֲלַכְתֶּ֔ם עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/031.yaml
  text: and in the wilderness[a], where you saw that Yahweh your God carried you, just as a man carries his son[b], all along the way that you traveled until you came to this place.
translation:
  language: tl
  text: at sa ilang[a], kung saan nakita mong dinala ka ni Yahweh na iyong Diyos, kung paanong dinadala ng isang lalaki ang kanyang anak na lalaki[b], sa buong daang nilakbay ninyo hanggang sa makarating kayo sa lugar na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “disyerto.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “kung paanong dinadala ng isang lalaki ang kanyang anak na lalaki”; maaari itong isalin nang mas pangkalahatan bilang “kung paanong dinadala ng isang tao ang isang bata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמִּדְבָּר
  choice: at sa ilang
  rationale: Ang מִדְבָּר ay tumutukoy sa ilang o disyertong rehiyon. Ang “ilang” ay likas at marangal na salitang Filipino na angkop sa salaysay ng paglalakbay ng Israel.
- source_word: אֲשֶׁר רָאִיתָ
  choice: kung saan nakita mong
  rationale: Pinananatili nito ang tuwirang karanasan ng kausap at likas na iniuugnay ang sugnay sa “sa ilang.”
- source_word: נְשָׂאֲךָ
  choice: binuhat ka
  rationale: Ang נשׂא ay nangangahulugang magdala o bumuhat. Ang “binuhat” ay malinaw at tumutugma sa kasunod na larawan ng lalaking bumubuhat sa kanyang anak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: Tuwirang inilalarawan si Yahweh bilang Diyos ng kausap, ayon sa anyong isahan ng Hebreo.
- source_word: כַּאֲשֶׁר יִשָּׂא אִישׁ אֶת־בְּנוֹ
  choice: gaya ng pagbuhat ng isang lalaki sa kanyang anak na lalaki
  rationale: Pinananatili ang tahasang panlalaking mga salita ng Hebreo, אִישׁ at בְּנוֹ, nang hindi pinatitindi ang “lalaki” upang maging “ama.”
- source_word: בְּכָל־הַדֶּרֶךְ
  choice: sa buong daan
  rationale: Ipinahahayag nito na nagpatuloy ang pagkalinga ng Diyos sa kabuuan ng kanilang paglalakbay.
- source_word: אֲשֶׁר הֲלַכְתֶּם
  choice: inyong nilakbay
  rationale: Ang “nilakbay” ay natural na katumbas sa konteksto ng paglalakbay ng buong bayan at pinananatili ang anyong maramihan ng Hebreo.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: hanggang sa makarating kayo sa lugar na ito
  rationale: Natural na temporal na sugnay ito sa Filipino at malinaw na tumutukoy sa kasalukuyang lugar ng mga nakikinig.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Panlalaking larawang pampamilya sa pagtutulad
  choice: isang lalaki … kanyang anak na lalaki
  alternative: isang tao … kanyang anak; isang ama … kanyang anak
  rationale: Tahasang panlalaki ang אִישׁ at בְּנוֹ. Hindi ito ginawang pangkalahatan, at hindi rin pinalakas ang “lalaki” tungo sa mas tiyak na “ama.”
- issue: Pagbabago mula isahan tungo sa maramihan
  choice: nakita mong … ka … iyong Diyos; inyong … kayo
  alternative: gawing pare-parehong maramihan para sa mas makinis na Filipino
  rationale: Pinananatili ang makabuluhang pagbabago ng Hebreo mula sa ikalawang panauhang isahan tungo sa maramihan, sa halip na tahimik itong pakinisin.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “ilang” bilang pangunahing salin at inilagay ang “disyerto” sa talababa. Sadyang pinanatili ang paglipat ng Hebreo mula sa isahang “mo/ka/iyong” tungo sa maramihang “inyong/kayo.”
