  source_fidelity: Tumpak ang pangunahing kahulugan at napapanatili ang mahalagang paglipat mula sa isahang kausap (“nakita mong,” “ka,” “iyong”) tungo sa maramihan (“ninyo,” “kayo”). Pinananatili rin ang Yahweh at ang tahasang lalaking/anak-na-lalaking pagtutulad. Gayunman, ang nominal na “gaya ng pagbuhat” ay hindi gaanong tuwirang naghahayag ng pandiwang pagtutulad sa Hebreo; ang anyong pandiwa ay mas malinaw at natural.
  naturalness: Ang “kung paanong dinadala ng isang lalaki ang kanyang anak na lalaki” ay mas likas na modernong Filipino kaysa “gaya ng pagbuhat ng isang lalaki sa kanyang anak na lalaki,” at malinaw ang ugnayan ng kilos ng Diyos sa pagtutulad.
  terminology: Ang “ilang,” “Yahweh,” at “Diyos” ay angkop sa marangal ngunit makabagong rehistro. Ang “anak na lalaki” ay wastong katumbas ng בְּנוֹ at hindi pinatitindi ang אִישׁ bilang “ama.”
