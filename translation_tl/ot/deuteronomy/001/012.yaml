translation:
  language: tl
  text: Paano ko mag-isang papasanin ang inyong mga paghihirap, mga pasanin, at mga alitan[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pagtatalo” o “mga usaping legal.”
    reason: Ang salitang Hebreo na רִיב ay maaaring tumukoy sa pangkalahatang hidwaan, pagtatalo, o kasong dinidinig sa hukuman.
lexical_decisions:
- source_word: אֵיכָה
  choice: Paano ko kakayanin
  rationale: Ipinahahayag ng אֵיכָה ang isang retorikal na tanong tungkol sa hirap o kawalang-kakayahang gawin ang bagay; natural itong naipapakita sa Filipino sa “Paano ko kakayanin.”
- source_word: אֶשָּׂא
  choice: kakayanin
  rationale: Ang נשׂא ay literal na “buhatin/dalhin” ngunit dito ay tumutukoy sa pag-ako at pagharap sa mga pananagutan. Ang “kakayanin” ay likas sa Filipino at pinananatili ang puwersa ng retorikal na tanong.
- source_word: לְבַדִּי
  choice: mag-isa
  rationale: Tuwirang ipinahahayag na hindi kayang gampanan ni Moises nang walang katulong ang lahat ng pananagutan.
- source_word: טָרְחֲכֶם
  choice: mga pasanin
  rationale: Ang טֹרַח ay hirap, pagpapagal, o mabigat na pasaning idinudulot ng bayan; “mga pasanin” ang natural na pangunahing salin.
- source_word: מַשַּׂאֲכֶם
  choice: mga suliranin
  rationale: Ang מַשָּׂא ay literal na karga o pasanin. Isinalin itong “mga suliranin” upang maipakita ang bigat na kailangang harapin at maiwasan ang malabong pag-uulit ng “pasanin,” habang kinikilala ang malapit na magkakaugnay na mga termino.
- source_word: רִיבְכֶם
  choice: mga alitan
  rationale: Maaaring tumukoy ang רִיב sa pagtatalo, hidwaan, o usaping dinidinig sa hukuman. Malawak at madaling maunawaan ang “mga alitan” sa konteksto.
