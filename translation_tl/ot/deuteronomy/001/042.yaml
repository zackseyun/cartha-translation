revisions:
- from: Sinabi sa akin ni Yahweh, “Sabihin mo sa kanila, ‘Huwag kayong umahon at huwag makipaglaban, sapagkat wala ako sa gitna ninyo, upang hindi kayo matalo sa harap ng inyong mga kaaway.’”
  to: 'Sinabi sa akin ni Yahweh, “Sabihin mo sa kanila: ‘Huwag kayong umakyat o makipaglaban, sapagkat wala ako sa gitna ninyo; kung hindi ay matatalo kayo sa harapan ng inyong mga kaaway.’”'
  rationale: Inayos ang pangwakas na sugnay upang malinaw na maging babala ng pagkatalo, hindi isang sugnay ng layunin. Pinalitan ang “umahon” ng mas likas na “umakyat” at bahagyang inayos ang bantas para sa malinaw na pagsipi sa loob ng direktang pananalita. Walang footnote na kailangan, sapagkat sapat na malinaw ang salin at walang kailangang ipreserbang pinagtatalunang pagbasa.
