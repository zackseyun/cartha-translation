  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֱמֹ֤ר לָ/הֶם֙ לֹ֤א תַֽעֲלוּ֙ וְ/לֹא תִלָּ֣חֲמ֔וּ כִּ֥י אֵינֶ֖/נִּי בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּֽגְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/042.yaml
  text: 'And Yahweh said to me[a], ‘Tell them: Do not go up or fight, for I am not among you[b], lest you be struck down before your enemies.’'
translation:
  language: tl
  text: 'Sinabi sa akin ni Yahweh, “Sabihin mo sa kanila: ‘Huwag kayong umakyat o makipaglaban, sapagkat wala ako sa gitna ninyo; kung hindi ay matatalo kayo sa harapan ng inyong mga kaaway.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: Sinabi sa akin
  rationale: Likas at tuwirang salin ng karaniwang pandiwang pasalaysay at ng pariralang tumutukoy kay Moises bilang tumanggap ng sinabi.
- source_word: אֱמֹר לָהֶם
  choice: Sabihin mo sa kanila
  rationale: Malinaw na isinasalin ang pautos at ang di-tuwirang layon nang hindi dinaragdagan ang nilalaman.
- source_word: לֹא תַעֲלוּ
  choice: Huwag kayong umahon
  rationale: Ang עלה ay nangangahulugang umakyat o umahon; ang “umahon” ay angkop sa heograpiko at pangmilitar na konteksto.
- source_word: וְלֹא תִלָּחֲמוּ
  choice: at huwag makipaglaban
  rationale: Ang Niphal ng לחם ay tumutukoy sa pakikipaglaban; natural at malinaw ang “makipaglaban” sa modernong Filipino.
- source_word: כִּי אֵינֶנִּי בְּקִרְבְּכֶם
  choice: sapagkat wala ako sa gitna ninyo
  rationale: Malapit itong sumusunod sa literal na “hindi ako nasa gitna ninyo” at pinananatili ang diwa ng presensiya ni Yahweh sa bayan.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: upang hindi kayo matalo
  rationale: Sa konteksto, ipinahahayag nito ang masamang kahihinatnang maiiwasan sa pagsunod sa pagbabawal. Iniiwasan ng saling ito ang maling pagbasa na nangangako ng proteksiyon kung lalaban sila.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: sa harap ng inyong mga kaaway
  rationale: Pinananatili ang karaniwang idyomang Hebreo para sa pagkatalo sa pakikipagdigma.
theological_decisions:
- issue: Pagpapahayag sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang tahasang nasa pinagmulan; pinananatili ito nang hindi pinapalitan ng titulo.
- issue: Lakas ng pangwakas na sugnay וְלֹא תִּנָּגְפוּ
  choice: upang hindi kayo matalo
  alternative: kung hindi ay matatalo kayo; baka kayo malupig
  rationale: Ipinakikita ng konteksto na babala ito tungkol sa pagkatalo dahil wala si Yahweh sa gitna nila. Ang pormang may “upang hindi” ay nagpapanatili sa negatibong anyo at sa ugnayan nito sa pagbabawal nang hindi ito ginagawang pangako ng kaligtasan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang pangmaramihang “kayo” ayon sa mga anyong Hebreo. Pinanatili ang bahagyang pormal na “sa gitna ninyo” upang maipakita ang konsepto ng presensiya ni Yahweh sa bayan.
