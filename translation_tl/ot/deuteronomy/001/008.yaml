language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: רְאֵ֛ה נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם אֶת הָ/אָ֑רֶץ בֹּ֚אוּ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֣ר נִשְׁבַּ֣ע יְ֠הוָה לַ/אֲבֹ֨תֵי/כֶ֜ם לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לָ/תֵ֣ת לָ/הֶ֔ם וּ/לְ/זַרְעָ֖/ם אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/008.yaml
  text: See[a], I have set the land before you. Go in and take possession of the land that Yahweh swore to your fathers—to Abraham, to Isaac[d][c][b], and to Jacob—to give to them and to their offspring after them.
translation:
  language: tl
  text: Tingnan ninyo,[a] inilagay ko sa harap ninyo ang lupain. Pumasok kayo at angkinin ninyo[b] ang lupain na ipinangako ni Yahweh sa pamamagitan ng panunumpa sa inyong mga ama[c]—kina Abraham, Isaac, at Jacob—na ibibigay niya sa kanila at sa kanilang lahi na susunod sa kanila.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Masdan ninyo” o “Tumingin kayo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ariin ninyo” o “manahin ninyo”; maaaring tumukoy ang pandiwang Hebreo sa pag-angkin, pagmamana, o pagkuha ng pag-aari.
    reason: lexical_alternative
  - marker: c
    text: Literal na “mga ama”; partikular na tinutukoy rito sina Abraham, Isaac, at Jacob.
    reason: alternative_reading
  - marker: d
    text: Literal na “sa kanilang binhi pagkatapos nila,” isang kolektibong katawagan sa kanilang mga supling o salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Tingnan ninyo
  rationale: Isahang pautos ang anyong Hebreo, ngunit kinakausap ni Moises ang buong Israel at agad itong sinusundan ng mga anyong maramihan. Ang magalang at kolektibong “Tingnan ninyo” ay natural sa modernong Filipino at nagpapanatili ng mariing pagtawag-pansin.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: inilagay ko sa harapan ninyo
  rationale: Sa konstruksiyong נתן + לפני, ang diwa ay paglalagay o paghaharap ng isang bagay sa kausap. Ipinahihiwatig ng ganap na aspekto na nakahanda at abot-kamay na sa kanila ang lupain.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa lupaing ipinangako sa tipan. Ang “lupain” ay natural at mas tiyak kaysa “bansa” sa kontekstong ito.
- source_word: בֹּאוּ
  choice: Pumasok kayo
  rationale: Maramihang pautos na tumutukoy sa pagpasok sa lupain. Mas tuwiran itong tumutugma sa Hebreo kaysa sa simpleng “Humayo kayo.”
- source_word: וּרְשׁוּ
  choice: angkinin ninyo
  rationale: Ang ירשׁ ay maaaring mangahulugang ariin, manahin, o sakupin at ariin. Ang “angkinin” ay nagpapanatili sa aktibong pagkuha ng pag-aari nang hindi ipinapakahulugan nang labis kung mana ba o pananakop ang pangunahing diin.
- source_word: נִשְׁבַּע יְהוָה
  choice: isinumpa ni Yahweh
  rationale: Ipinahahayag nito ang taimtim na panunumpa ng Diyos. Pinanatili ang personal na pangalang יהוה bilang “Yahweh.”
- source_word: לַאֲבֹתֵיכֶם
  choice: sa inyong mga ninuno
  rationale: Bagaman literal na “mga ama,” malinaw na tinutukoy rito ang mga patriyarkang agad na pinangalanan. Ang “mga ninuno” ay likas sa Filipino at hindi nagkukubli sa tiyak na panlalaking reperensiya dahil sumusunod ang Abraham, Isaac, at Jacob.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: kina Abraham, Isaac, at Jacob
  rationale: Ang “kina” ang natural na panandang Filipino para sa maramihang pangalang pantangi at mahusay na naghahayag kung sino ang tinutukoy na mga ninuno.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם אַחֲרֵיהֶם
  choice: na ibibigay sa kanila at sa kanilang lahi pagkatapos nila
  rationale: Ang זרע ay kolektibong pangngalan na literal na “binhi” ngunit tumutukoy sa mga supling o salinlahi. Ang “lahi” ay maikli, natural, at nakapagpapanatili ng kolektibong diwa.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Ang “Yahweh” ay transliterasyong nagpapanatili sa natatanging pangalan ng Diyos nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng אֲבֹתֵיכֶם
  choice: inyong mga ninuno, na tinukoy bilang Abraham, Isaac, at Jacob
  alternative: inyong mga ama
  rationale: Ang literal na “mga ama” ay maaaring hindi natural o maaaring mapagkamalang agarang mga magulang sa Filipino. Tahasang tinutukoy ng kasunod na parirala ang tatlong lalaking patriyarka, kaya nananatiling malinaw ang tiyak na reperensiya.
- issue: Diwa ng ירשׁ sa pagtupad ng pangako
  choice: angkinin
  alternative: manahin / ariin / sakupin
  rationale: Pinananatili ng “angkinin” ang tensiyon sa pagitan ng ipinagkaloob na mana at ng aktibong pagpasok at pagkuha ng pag-aari, sa halip na pumili lamang ng isang teolohikal na diin.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “ninyo/kayo” para sa kolektibong kausap at ang “Yahweh” para sa banal na pangalan. Iniwasan ang sobrang arkaikong “masdan” sa pangunahing teksto, ngunit inilagay ito bilang leksikal na alternatibo sa talababa.
