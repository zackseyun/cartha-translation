    issue: Ang “isinumpa ni Yahweh” ay maling-malinaw na salin ng נִשְׁבַּע יְהוָה.
    rationale: Sa modernong Filipino, ang “isinumpa” ay karaniwang nangangahulugang nilait o isinailalim sa sumpa, samantalang ang Hebreo ay “nanumpa” o gumawa ng taimtim na pangako.
  - severity: medium
    issue: Ang dating ayos ng sugnay na “lupaing isinumpa ... na ibibigay” ay nagpapalabo sa saklaw ng panunumpa at sa panghalip na tagaganap.
    rationale: 'Ang לָתֵת ay layunin/nilalaman ng panunumpa: ipinangako ni Yahweh na ibibigay niya ang lupain sa mga ama at sa kanilang binhi.'
  - severity: low
