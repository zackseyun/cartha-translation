revisions:
- from: Tingnan ninyo,[a] inilagay ko sa harapan ninyo ang lupain. Pumasok kayo at angkinin ninyo[b] ang lupaing isinumpa ni Yahweh sa inyong mga ninuno[c]—kina Abraham, Isaac, at Jacob—na ibibigay sa kanila at sa kanilang lahi pagkatapos nila.[d]
  to: Tingnan ninyo,[a] inilagay ko sa harap ninyo ang lupain. Pumasok kayo at angkinin ninyo[b] ang lupain na ipinangako ni Yahweh sa pamamagitan ng panunumpa sa inyong mga ama[c]—kina Abraham, Isaac, at Jacob—na ibibigay niya sa kanila at sa kanilang lahi na susunod sa kanila.[d]
  rationale: 'Inayos ang salin ng panunumpa upang maiwasan ang maling kahulugang “isinumpa,” at nilinaw ang estruktura ng pangako: si Yahweh ang nangakong magbibigay ng lupain sa mga patriyarka at sa kanilang lahi. Ibinalik ang “mga ama” sa pangunahing teksto para sa mas malapit na pagtutugma sa Hebreo, habang pinanatili ang paliwanag sa talababa.'
