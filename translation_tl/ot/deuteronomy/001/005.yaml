base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/005.yaml
  text: 'Beyond the Jordan[a], in the land of Moab, Moses began to explain this law[b], saying:'
translation:
  language: tl
  text: 'Sa kabila ng Jordan[a], sa lupain ng Moab, sinimulan ni Moises na ipaliwanag ang kautusang ito[b]. Sinabi niya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa kabilang panig ng Jordan.” Ang Hebreong parirala ay nakasalalay sa heograpikong pananaw ng nagsasalita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang tagubiling ito.” Ang Hebreong torah ay maaaring mangahulugang “kautusan” o, sa mas malawak na diwa, “tagubilin.” Pinili rito ang “kautusan” dahil sa legal at pangtipang konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: Sa kabila ng Jordan
  rationale: Ipinapahayag ng parirala ang pook na nasa kabilang panig ng Jordan ayon sa heograpikong pananaw ng nagsasalita. Likas at maikli sa Filipino ang “sa kabila ng Jordan,” ngunit nananatiling relatibo ang pananaw kaya inilakip ang alternatibo sa talababa.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: sa lupain ng Moab
  rationale: Ang אֶרֶץ ay tumutukoy rito sa isang heograpiko at pampolitikang lupain; malinaw at karaniwan sa Filipino ang “lupain ng Moab.”
- source_word: הוֹאִיל
  choice: sinimulan
  rationale: Sa kayariang ito, ipinahihiwatig ng הוֹאִיל ang pagsisimula o kusang pagtakda sa isang gawain. Ang “sinimulan” ay natural sa Filipino at akma sa pagpapakilala sa pagpapaliwanag ni Moises.
- source_word: בֵּאֵר
  choice: na ipaliwanag
  rationale: Ang pandiwa ay nangangahulugang gawing malinaw o ipaliwanag nang masinsinan. Ang “ipaliwanag” ay pangkaraniwan, malinaw, at hindi labis na teknikal.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ang kautusang ito
  rationale: Maaaring mangahulugan ang תּוֹרָה ng “kautusan” o mas malawak na “tagubilin.” Sa kontekstong legal at tipan ng Deuteronomio, pinananatili ng “kautusan” ang legal na diin habang itinatala sa talababa ang mas malawak na posibilidad.
- source_word: לֵאמֹר
  choice: 'Sinabi niya:'
  rationale: Karaniwang panandang pandiskurso ito na nagpapakilala sa susunod na pananalita. Hinati sa bagong pangungusap ang Filipino upang maging natural at malinaw ang pagdaloy.
theological_decisions:
- issue: Pagsasalin ng תּוֹרָה sa konteksto ng tipan
  choice: ang kautusang ito
  alternative: ang tagubiling ito
  rationale: Ipinakikilala ng talata ang pagpapaliwanag ni Moises sa mga tuntunin ng tipan. Pinananatili ng “kautusan” ang legal at pangtipang dimensiyon, ngunit hindi itinatanggi ang mas malawak na kahulugang “tagubilin”; kaya inilakip ang alternatibo sa talababa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “lupain,” “kautusan,” at “ipaliwanag” upang mapanatili ang bigat ng teksto nang hindi nagiging makaluma. Ang לֵאמֹר ay ginawang hiwalay na “Sinabi niya:” para sa mas natural na sintaks sa Filipino.
