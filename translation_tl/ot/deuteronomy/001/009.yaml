  yaml_path: translation/ot/deuteronomy/001/009.yaml
  text: And I said to you at that time, saying, ‘I am not able to bear you by myself.’
translation:
  language: tl
  text: At sinabi ko sa inyo nang panahong iyon, “Hindi ko kayang pasanin kayong mag-isa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר אֲלֵכֶם
  choice: At sinabi ko sa inyo
  rationale: Tuwirang inililipat ang unang panauhang pagsasalaysay at ang kausap na maramihan.
- source_word: בָּעֵת הַהִוא
  choice: nang panahong iyon
  rationale: Likas na makabagong Tagalog para sa panandang panahong tumutukoy sa naunang salaysay.
- source_word: לֵאמֹר
  choice: '[ipinahiwatig ng panipi]'
  rationale: Ang Hebreong panandang nagpapakilala ng tuwirang pahayag ay natural na naihahayag sa Tagalog sa pamamagitan ng panipi; ang tahasang “na sinasabi” ay magiging mabigat at di-likas.
- source_word: לֹא אוּכַל
  choice: Hindi ko kayang
  rationale: Pinananatili ang diwa ng kawalan ng kakayahan sa una at isahang panauhan.
- source_word: לְבַדִּי
  choice: mag-isa
  rationale: Malinaw na iniuugnay sa nagsasalita at natural kasunod ng pandiwang “pasanin.”
- source_word: שְׂאֵת אֶתְכֶם
  choice: pasanin kayo
  rationale: Pinananatili ang konkretong metapora ng Hebreong נשׂא at ang maaaring saklaw nitong pamamahala at pananagutan, sa halip na paliitin ito sa “pamahalaan” lamang.
theological_decisions:
- issue: Saklaw ng metaporang שׂאת (“pasanin”)
  choice: pasanin kayo
  alternative: pangasiwaan kayo / akuin ang pananagutan para sa inyo
  rationale: Ang literal na metapora ay nauunawaan sa Tagalog at pinananatili ang lawak at tensiyon ng orihinal nang hindi nagpapasok ng tiyak na interpretasyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hindi isinalin nang hiwalay ang לֵאמֹר sapagkat sapat at mas likas sa Tagalog ang panipi bilang tagapagpakilala ng tuwirang pahayag.
