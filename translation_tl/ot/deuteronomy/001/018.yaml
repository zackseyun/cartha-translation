translation:
  language: tl
  text: At noong panahong iyon, iniutos ko sa inyo ang lahat ng bagay na dapat ninyong gawin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng salita” o “lahat ng usapin.” Ang salitang Hebreo na דְּבָרִים ay maaaring tumukoy sa mga sinabing tagubilin o sa mga bagay na kailangang isagawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: iniutos ko
  rationale: Ang pandiwang צוה ay nagpapahayag ng makapangyarihang pag-uutos o pagbibigay ng tagubilin; pinananatili ng “iniutos ko” ang lakas nito sa natural na Tagalog.
- source_word: אֶתְכֶם
  choice: sa inyo
  rationale: Ang hulaping 2mp ay tumutukoy sa maramihan; malinaw itong ipinahihiwatig ng “inyo” sa Tagalog.
- source_word: בָּעֵת הַהִוא
  choice: nang panahong iyon
  rationale: Natural at tuwirang katumbas ng karaniwang pariralang temporal sa Hebreo.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: ang lahat
  rationale: Sa kontekstong ito, ang דְּבָרִים ay tumutukoy sa kabuuan ng mga tagubilin o bagay na isasagawa. Natural ang “ang lahat” kasunod ng sugnay na “dapat ninyong gawin,” habang nililinaw sa talababa ang lawak ng salitang Hebreo.
- source_word: אֲשֶׁר תַּעֲשׂוּן
  choice: ng dapat ninyong gawin
  rationale: Ipinapahayag ng imperfect sa sugnay pagkatapos ng “iniutos” ang inaasahan at obligadong isagawa; ang “dapat” ay nagpapanatili ng puwersang direktibo nang hindi labis na pinatitindi.
