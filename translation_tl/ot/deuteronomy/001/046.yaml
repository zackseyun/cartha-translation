  text: So you remained at Kadesh many days[a], according to the days that you remained there.
translation:
  language: tl
  text: Kaya nanatili kayo sa Kades nang maraming araw[a], gaya ng mga araw na nanatili kayo roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “maraming araw, gaya ng mga araw na nanatili kayo.” Eliptikal ang huling parirala at maaaring mangahulugang “nang matagal—singtagal ng panahong nanatili kayo roon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּשְׁבוּ
  choice: Kaya nanatili kayo
  rationale: Ang ישׁב dito ay tumutukoy sa patuloy na pananatili sa isang lugar. Likas sa makabagong Tagalog ang “nanatili,” at ipinahihiwatig ng “kaya” ang pagpapatuloy at bunga ng naunang salaysay.
- source_word: בְקָדֵשׁ
  choice: sa Kades
  rationale: Pangalan ito ng lugar; ang “sa” ang karaniwang panandang Tagalog para sa kinaroroonan.
- source_word: יָמִים רַבִּים
  choice: nang maraming araw
  rationale: Pinananatili nito ang tahasang Hebreong idyomang “maraming araw,” sa halip na agad itong gawing mas interpretatibong “nang matagal.”
- source_word: כַּיָּמִים אֲשֶׁר יְשַׁבְתֶּם
  choice: singtagal ng panahong nanatili kayo roon
  rationale: Ang כ ay naghahayag ng paghahambing, ngunit eliptikal ang parirala. Isinasalin ito sa likas na Tagalog bilang paghahambing ng haba ng panahon, habang ang “roon” ay nilinaw mula sa Kades na binanggit na.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili sa pangunahing teksto ang “maraming araw,” ngunit ginawang likas ang eliptikal na paghahambing sa pamamagitan ng “singtagal ng panahong.”
