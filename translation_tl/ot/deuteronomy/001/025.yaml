base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/025.yaml
  text: And they took in their hands some of the fruit of the land and brought it down to us[a], and they brought us back word and said, “The land that Yahweh our God is giving to us is good.”
translation:
  language: tl
  text: Kumuha sila ng ilan sa mga bunga ng lupain at ibinaba iyon sa amin. Nag-ulat sila sa amin at sinabi, “Mabuti ang lupaing ibinibigay sa atin ni Yahweh na ating Diyos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ בְיָדָם
  choice: Kumuha sila
  rationale: Ang לקח ay karaniwang nangangahulugang ‘kumuha.’ Hindi na tahasang isinalin ang ‘sa kanilang mga kamay’ sapagkat likas nang ipinahihiwatig iyon sa Filipino at magiging mabigat ang parirala.
- source_word: מִפְּרִי הָאָרֶץ
  choice: ng ilan sa mga bunga ng lupain
  rationale: Ipinakikita ng partitive na מִן na isang bahagi o halimbawa lamang ng ani ang kinuha.
- source_word: וַיּוֹרִדוּ אֵלֵינוּ
  choice: iniuwi iyon sa amin
  rationale: Ang Hiphil ng ירד ay literal na ‘ibinaba.’ Sa konteksto, natural sa Filipino ang ‘iniuwi sa amin’; pinananatili sa talababa ang literal na direksiyon.
- source_word: וַיָּשִׁבוּ אֹתָנוּ דָבָר
  choice: Nagbalik sila ng ulat
  rationale: Ipinahahayag nito ang idyomang Hebreo na ‘nagbalik ng salita/ulat’ nang malinaw at natural, habang pinananatili ang diwa ng pagbabalik.
- source_word: טוֹבָה הָאָרֶץ
  choice: Mabuti ang lupain
  rationale: Ang טוֹבָה ay isang malawak na positibong pagtataya; ‘mabuti’ ang tuwiran at natural na katumbas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na nasa tekstong Hebreo.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Natural na Filipino para sa unang panauhang maramihang anyong nagmamay-ari.
- source_word: נֹתֵן לָנוּ
  choice: ibinibigay sa atin
  rationale: Pinananatili ng aspektong pangkasalukuyan ng participle ang nagpapatuloy o nalalapit na pagkakaloob ng Diyos at ang tahasang tumatanggap na ‘sa atin.’
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Nasa Hebreo ang Tetragrammaton bilang tiyak na pangalan; pinananatili itong ‘Yahweh’ sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘lupain’ sa unang sugnay dahil tumutukoy ito sa ani ng buong lupain, at ang mas likas na ‘lupaing’ sa tuwirang pahayag. Iniwasan ang sobrang literal na ‘sa kanilang mga kamay’ upang hindi maging alanganin ang daloy.
