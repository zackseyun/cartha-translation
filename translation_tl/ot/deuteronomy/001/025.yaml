revisions:
- from: Kumuha sila ng ilan sa mga bunga ng lupain at iniuwi iyon sa amin[a]. Nagbalik sila ng ulat at sinabi, “Mabuti ang lupaing ibinibigay sa atin ni Yahweh na ating Diyos.”
  to: Kumuha sila ng ilan sa mga bunga ng lupain at ibinaba iyon sa amin. Nag-ulat sila sa amin at sinabi, “Mabuti ang lupaing ibinibigay sa atin ni Yahweh na ating Diyos.”
  rationale: Pinalitan ang “iniuwi” ng “ibinaba” upang maipahayag sa teksto ang direksiyonal na diwa ng Hebreo. Pinalitan din ang di-likas na “Nagbalik sila ng ulat” ng “Nag-ulat sila sa amin.” Hindi kailangan ang dating talababa sapagkat nasa pangunahing salin na ang “ibinaba.”
