base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/033.yaml
  text: who went before you on the way to search out a place for you to camp[a], in fire by night to show you the way in which you should go[b], and in the cloud by day.
translation:
  language: tl
  text: na nanguna sa inyo sa daan upang humanap para sa inyo ng lugar na pagkakampuhan ninyo[a], sa apoy sa gabi upang ipakita sa inyo ang daang inyong tatahakin[b], at sa ulap sa araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang magsiyasat para sa inyo ng lugar na pagkakampuhan ninyo.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “upang ipakita sa inyo ang daan na inyong tatahakin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹלֵךְ
  choice: na nanguna
  rationale: Ang Qal participle ay naglalarawan sa PANGINOON na nasa unahan ng bayan bilang kanilang gabay. Likas sa salaysay na Filipino ang “nanguna,” habang nananatiling kaugnay ang sugnay sa naunang talata.
- source_word: לִפְנֵיכֶם
  choice: sa inyo
  rationale: Kasama ng “nanguna,” malinaw nitong ipinahahayag ang lokasyong nasa harapan nila nang hindi inuulit ang kahulugan sa paraang mabigat sa Filipino.
- source_word: בַּדֶּרֶךְ
  choice: sa daan
  rationale: Tumutukoy ang דֶּרֶךְ sa landas o ruta ng kanilang paglalakbay sa ilang.
- source_word: לָתוּר
  choice: upang humanap
  rationale: Ipinahahayag ng תור ang masusing paghahanap ng angkop na lugar. Natural at malinaw ang “humanap”; inilalagay sa talababa ang mas tahasang diwang pagsisiyasat.
- source_word: מָקוֹם לַחֲנֹתְכֶם
  choice: lugar na mapagkakampuhan ninyo
  rationale: Tumpak nitong ipinapahayag ang layunin ng lugar—ang pagkakampuhan ng bayan—sa likas na modernong Filipino.
- source_word: בָּאֵשׁ לַיְלָה
  choice: nasa apoy kapag gabi
  rationale: Pinananatili nito ang konkretong paglalarawan na ang Diyos ay “nasa apoy” sa gabi, nang hindi idinaragdag ang “haligi,” na wala sa mismong talata.
- source_word: לַרְאֹתְכֶם
  choice: upang ipakita sa inyo
  rationale: Ang Hiphil infinitive ng ראה ay causative; “ipakita” ang natural na katumbas sa konteksto ng paggabay.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: ang daang inyong tatahakin
  rationale: Ipinahahayag nito ang rutang itinuro para sa kanilang paglalakbay, nang hindi ginagawang pangunahing moral na obligasyon ang imperfect verb.
- source_word: וּבֶעָנָן יוֹמָם
  choice: at nasa ulap kapag araw
  rationale: Pinananatili ang parallel sa apoy sa gabi at ang tiyak na ulap na kilala mula sa konteksto ng paglalakbay sa ilang.
theological_decisions:
- issue: Ang paksa ng sugnay ay ang PANGINOON mula sa naunang talata
  choice: Sinimulan sa “na nanguna” at hindi inulit ang “PANGINOON.”
  alternative: “ang PANGINOON, na nanguna...”
  rationale: Nakadepende sa Deuteronomio 1:32 ang Hebreong sintaks. Pinananatili ng salin ang ugnayang iyon at hindi nagdaragdag ng pangngalang wala sa talatang ito.
- issue: Paraan ng presensya sa apoy at ulap
  choice: “nasa apoy” at “nasa ulap”
  alternative: “sa pamamagitan ng apoy” at “sa pamamagitan ng ulap”
  rationale: Mas malapit ang pinili sa Hebreong בְּ at iniiwasang tahasang ituring lamang na mga kasangkapan ang apoy at ulap. Hindi rin idinagdag ang “haligi,” bagaman pamilyar iyon mula sa mas malawak na konteksto.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “mapagkakampuhan” at “tatahakin” bilang malinaw ngunit hindi kolokyal na pananalita. Pinanatili ang anyong umaasa sa naunang talata at ang parallel na apoy-sa-gabi/ulap-sa-araw.
