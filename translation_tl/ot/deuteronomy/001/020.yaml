id: DEU.1.20
reference: Deuteronomy 1:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וָ/אֹמַ֖ר אֲלֵ/כֶ֑ם בָּאתֶם֙ עַד הַ֣ר הָ/אֱמֹרִ֔י אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/020.yaml
  text: And I said to you[a], “You have come to the hill country of the Amorites, which Yahweh our God is giving us.”
translation:
  language: tl
  text: At sinabi ko sa inyo, “Nakarating na kayo sa kaburulan ng mga Amoreo,[a] na ibinibigay sa atin ni Yahweh na ating Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bundok ng mga Amoreo.” Maaaring tumukoy ang salitang Hebreo sa isang bundok o, sa mas malawak na diwa, sa isang maburol na rehiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר אֲלֵכֶם
  choice: At sinabi ko sa inyo
  rationale: Pinananatili ng “At” ang sunod-sunod na daloy ng salaysay, at malinaw na inililipat ng “sa inyo” ang pangmaramihang kausap.
- source_word: בָּאתֶם עַד
  choice: Nakarating na kayo sa
  rationale: Likas sa modernong Tagalog ang “nakarating na” para sa natapos na pagdating na may kasalukuyang kabuluhan at para sa hangganang talagang naabot.
- source_word: הַר הָאֱמֹרִי
  choice: kaburulan ng mga Amoreo
  rationale: Maaaring tumukoy ang הַר sa isang bundok o sa mas malawak na bulubundukin o maburol na rehiyon. Ang “kaburulan” ang natural na heograpikong paglalarawan dito; kolektibo ang katawagang Amoreo, kaya “mga Amoreo.”
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh na ating Diyos
  rationale: Inililipat nang tuwiran ang personal na pangalang יְהוָה bilang “Yahweh,” at ang hulaping pangmaramihang first person sa אֱלֹהֵינוּ bilang “ating Diyos.”
- source_word: נֹתֵן לָנוּ
  choice: ibinibigay sa atin
  rationale: Ang participle ay nagpapahiwatig ng kasalukuyan o nalalapit na pagkakaloob. Pinananatili ng “ibinibigay sa atin” ang patuloy na aspekto at ang tahasang tatanggap.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya tinumbasan ito sa transliterasyong “Yahweh” sa halip na palitan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at likas pakinggan. Ginamit ang “kaburulan” bilang pangunahing heograpikong salin habang pinanatili sa talababa ang tunay na alternatibong “bundok.”
