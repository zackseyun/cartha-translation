  source_fidelity: 'Tumpak ang salin sa Hebreo: naipapahayag ang sunod-sunod na kilos sa “At sinabi ko,” ang pangmaramihang kausap, ang pagdating sa itinakdang pook, at ang kasalukuyan o nalalapit na aspekto ng “ibinibigay.” Ang “kaburulan ng mga Amoreo” ay wastong pangunahing salin ng heograpikong הַר הָאֱמֹרִי.'
  naturalness: Likas, malinaw, at marangal ang modernong Filipino Tagalog. Ang “Nakarating na kayo” ay angkop sa naganap na pagdating na mahalaga sa kasalukuyang tagpo. Maayos ding daloy ang sugnay na “na ibinibigay sa atin ni Yahweh na ating Diyos.”
  terminology: Wasto at pare-pareho ang “Yahweh” para sa יהוה, “ating Diyos” para sa אֱלֹהֵינוּ, at “mga Amoreo” para sa kolektibong gentilic. Ang talababa ay nagbibigay ng lehitimong alternatibong “bundok” nang hindi inaalis ang pangunahing kahulugang heograpikal.
