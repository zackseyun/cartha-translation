  text: פְּנ֣וּ וּ/סְע֣וּ לָ/כֶ֗ם וּ/בֹ֨אוּ הַ֥ר הָֽ/אֱמֹרִי֮ וְ/אֶל כָּל שְׁכֵנָי/ו֒ בָּ/עֲרָבָ֥ה בָ/הָ֛ר וּ/בַ/שְּׁפֵלָ֥ה וּ/בַ/נֶּ֖גֶב וּ/בְ/ח֣וֹף הַ/יָּ֑ם אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ/לְּבָנ֔וֹן עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/007.yaml
  text: Turn and set out for yourselves[a], and go to the hill country of the Amorites and to all their neighbors in the Arabah, in the hill country, in the lowland, in the Negev, and on the coast of the sea—the land of the Canaanites—and Lebanon, as far as the great river, the Euphrates River.
translation:
  language: tl
  text: 'Bumaling kayo at maglakbay, at pumunta sa bulubundukin ng mga Amoreo at sa lahat ng karatig na lupain nito: sa Araba, sa bulubundukin, sa mababang lupain[a], sa Negev, sa baybayin ng dagat, sa lupain ng mga Cananeo, at sa Lebanon, hanggang sa malaking ilog, ang Ilog Eufrates.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Shefela,” ang tawag sa mababang lupain at paanan ng mga burol sa kanluran.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ וּסְעוּ לָכֶם
  choice: Humayo kayo at maglakbay
  rationale: Pinagsasama nito sa natural na Tagalog ang utos na magbago ng direksiyon at umalis upang maglakbay. Ang לָכֶם ay idyomatiko at hindi kailangang gawing mariing reflexive na “para sa inyong sarili.”
- source_word: וּבֹאוּ
  choice: at pumunta
  rationale: Bagaman maaaring mangahulugang “dumating” o “pumasok” ang בוא, ang “pumunta” ang natural na direksiyonal na utos sa kontekstong ito.
- source_word: הַר הָאֱמֹרִי
  choice: bulubundukin ng mga Amoreo
  rationale: Ang הַר dito ay isang mataas o mabundok na rehiyon, hindi lamang isang bundok; kolektibo ang katawagang Amoreo.
- source_word: שְׁכֵנָיו
  choice: lahat ng karatig na lupain nito
  rationale: Literal itong “mga karatig nito.” Ang pagbanggit sa mga sumunod na sonang heograpiko ay nagpapahiwatig ng mga karatig na lupain; pinananatili ng “nito” ang gramatikal na kaugnayan sa bulubundukin nang hindi ginagawang mga tao ang tinutukoy.
- source_word: בָּעֲרָבָה
  choice: sa Araba
  rationale: Pangalan ito ng natatanging rehiyong lambak o rift valley, kaya pinanatili ang heograpikong pangalan sa halip na gawing pangkalahatang “kapatagan.”
- source_word: בָהָר
  choice: sa bulubundukin
  rationale: Tumutukoy sa mataas at mabundok na sonang heograpiko.
- source_word: וּבַשְּׁפֵלָה
  choice: sa mababang lupain
  rationale: Malinaw ito sa karaniwang mambabasa at tumutukoy sa mababang rehiyon o paanan ng mga burol; inilagay sa talababa ang teknikal na pangalang Shefela.
- source_word: וּבַנֶּגֶב
  choice: sa Negev
  rationale: Bahagi ito ng talaan ng mga tiyak na rehiyon, kaya mas angkop ang pangalang Negev kaysa sa pangkalahatang “timog.”
- source_word: וּבְחוֹף הַיָּם
  choice: at sa baybayin ng dagat
  rationale: Tuwirang inilalarawan ang baybayin o pampang ng dagat sa natural na Tagalog.
- source_word: אֶרֶץ הַכְּנַעֲנִי
  choice: sa lupain ng mga Cananeo
  rationale: Kolektibo ang gentiliko at natural sa Tagalog ang maramihang “mga Cananeo.”
- source_word: וְהַלְּבָנוֹן
  choice: at sa Lebanon
  rationale: Pinanatili ang karaniwang modernong pangalan ng lugar.
- source_word: עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: hanggang sa malaking ilog, ang Ilog Eufrates
  rationale: Pinananatili ang appositional na pagkakakilanlan ng “malaking ilog” bilang Eufrates.
