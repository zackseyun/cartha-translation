translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga kinikilalang pangalang heograpiko na Araba at Negev upang mapanatili ang espesipikong mga rehiyon, habang isinalin sa payak na Filipino ang mga karaniwang anyong-lupa.
