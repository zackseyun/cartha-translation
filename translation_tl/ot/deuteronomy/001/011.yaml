base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/011.yaml
  text: May Yahweh[a], the God of your fathers, make you a thousand times as many as you are, and bless you[b], just as he has promised you.
translation:
  language: tl
  text: Nawa’y paramihin ni Yahweh[a], ang Diyos ng inyong mga ninuno[b], ang inyong bilang nang isang libong ulit, at pagpalain niya kayo, gaya ng sinabi niya sa inyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ang personal na pangalan ng Diyos na kinakatawan ng apat na titik na YHWH sa Hebreo.
    reason: divine_name
  - marker: b
    text: Sa literal na Hebreo, “mga ama,” isang katawagang maaaring tumukoy sa mga ninuno ng Israel.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “gaya ng ipinangako niya sa inyo.” Sa literal, “gaya ng sinabi niya sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: ang Diyos ng inyong mga ninuno
  rationale: Likas at malinaw ito sa makabagong Tagalog at pinananatili ang ugnayang pangkasaysayan at pangtipan sa mga naunang salinlahi; inilagay sa talababa ang literal na 'mga ama.'
- source_word: יֹסֵף עֲלֵיכֶם כָּכֶם
  choice: paramihin kayo ... kaysa sa dami ninyo ngayon
  rationale: Ipinahahayag ng anyong pandiwa ang isang hiling o pagpapala na madagdagan ang kasalukuyang bilang ng bayan.
- source_word: אֶלֶף פְּעָמִים
  choice: nang sanlibong ulit
  rationale: Tuwirang pinananatili ang matinding pananalitang numerikal ng Hebreo.
- source_word: וִיבָרֵךְ אֶתְכֶם
  choice: at pagpalain niya kayo
  rationale: Ipinagpapatuloy nito ang naunang hiling na ipinakilala ng 'Nawa’y.'
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: gaya ng sinabi niya sa inyo
  rationale: Pinananatili ang malawak na kahulugan ng דִּבֶּר, 'nagsalita/nagsabi,' sa halip na tahasang ipakahulugang 'nangako.'
theological_decisions:
- issue: Paglilipat ng pangalang tipan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang pangalan at hindi pinalitan ng titulo.
- issue: Paglalarawan sa אֲבֹתֵיכֶם
  choice: mga ninuno
  alternative: mga ama
  rationale: Sa kontekstong ito, ang parirala ay tumutukoy sa mga ninunong pinangakuan ng Diyos. Ang 'mga ninuno' ay natural sa Tagalog, habang ang literal na anyo ay pinanatili sa talababa.
- issue: Kahulugan ng דִּבֶּר sa konteksto ng pagpapala
  choice: sinabi niya sa inyo
  alternative: ipinangako niya sa inyo
  rationale: Maaaring tumukoy ang sinabi sa isang pangako, ngunit hindi mismong pandiwang 'mangako' ang ginamit; pinanatili ng salin ang tunay na lawak ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Nawa’y” upang ihayag ang hiling o pagpapala, at ang “dami ninyo ngayon” upang gawing malinaw ang paghahambing nang hindi inaalis ang sanlibong-ulit na larawan ng orihinal.
