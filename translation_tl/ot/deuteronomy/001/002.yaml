  text: It is eleven days from Horeb by the way of Mount Seir to Kadesh-barnea[a][b].
translation:
  language: tl
  text: Labing-isang araw ang paglalakbay mula sa Horeb hanggang Kades-barnea, sa rutang dumaraan sa Bundok Seir[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “labing-isang araw na paglalakbay.” Ipinahihiwatig ng idyomang Hebreo ang tagal ng paglalakbay sa rutang ito mula Horeb hanggang Kades-barnea.
    reason: lexical_alternative
  - marker: b
    text: Horeb ang pangalang ginamit dito sa tekstong Hebreo; madalas itong iniuugnay sa Sinai.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַד עָשָׂר יוֹם
  choice: Labing-isang araw ang paglalakbay
  rationale: Ang pariralang Hebreo ay literal na tumutukoy sa labing-isang araw at idiomatikong nagsasaad ng tagal ng paglalakbay. Likas sa modernong Tagalog ang pagbibigay-linaw sa ipinahihiwatig na paglalakbay.
- source_word: מֵחֹרֵב
  choice: mula sa Horeb
  rationale: Ang חֹרֵב ay pangalang-pook na Horeb; pinanatili ito sa halip na palitan ng Sinai.
- source_word: דֶּרֶךְ הַר שֵׂעִיר
  choice: sa daang patungo sa Bundok Seir
  rationale: Ang דֶּרֶךְ ay daan o ruta. Sa pariralang ito, natural na ipinapahayag sa Tagalog ang rutang dumaraan patungo sa Bundok Seir, habang iniiwasang sabihing tiyak na sa ibabaw mismo ng bundok dumaan.
- source_word: עַד
  choice: hanggang
  rationale: Sa kontekstong heograpiko, minamarkahan ng עַד ang dulong hantungan ng ruta.
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: Kades-barnea
  rationale: Isinalin sa karaniwang anyong Tagalog ang pangalang-pook at pinanatili ang gitling ng tambalang pangalan.
