base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/038.yaml
  text: Joshua son of Nun[a], who stands before you—he will go in there. Strengthen him, for he will cause Israel to inherit it.
translation:
  language: tl
  text: Si Josue na anak ni Nun, na nakatayo sa harap mo—siya ang papasok doon. Palakasin mo siya, sapagkat siya ang magpapamana ng lupain sa Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ibibigay niya ang lupain sa Israel bilang mana” o “hahatiin niya ang lupain para sa Israel bilang mana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josue na anak ni Nun
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino, at tuwirang isinalin ang patronimiko.
- source_word: הָעֹמֵד לְפָנֶיךָ
  choice: na nakatayo sa harap mo
  rationale: Pinananatili nito ang konkretong larawan at posibleng pahiwatig ng paglilingkod sa idyomang Hebreo nang hindi agad pinipili ang mas interpretatibong ‘naglilingkod sa iyo.’
- source_word: הוּא יָבֹא שָׁמָּה
  choice: siya ang papasok doon
  rationale: Ipinapakita ng ‘siya ang’ ang diin ng hayag na panghalip, habang ang ‘papasok’ ay nagpapanatili sa direksiyong papaloob sa lupaing tinutukoy.
- source_word: אֹתוֹ חַזֵּק
  choice: Palakasin mo siya
  rationale: Saklaw ng tuwirang saling ito ang pagpapatatag, pagbibigay-lakas, at pagpapalakas ng loob nang hindi nililimitahan sa damdamin lamang.
- source_word: כִּי
  choice: sapagkat
  rationale: Likas at marangal itong panandang nagbibigay ng dahilan para sa naunang utos.
- source_word: הוּא יַנְחִלֶנָּה אֶת יִשְׂרָאֵל
  choice: siya ang magpapamana nito sa Israel
  rationale: Pinananatili ng ‘magpapamana’ ang causative na diwa ng Hiphil ng נחל. Ang ‘nito’ ay tumutukoy sa lupaing nasa konteksto, at pinananatili ng ‘siya ang’ ang diin kay Josue.
theological_decisions:
- issue: Tinutukoy ng pambabaeng hulapi sa יַנְחִלֶנָּה
  choice: Ang ‘nito’ ay tumutukoy sa lupaing ipinangako sa Israel.
  alternative: 'Maaaring hindi tahasang banggitin ang layon: ‘sa pamamagitan niya ay magmamana ang Israel.’'
  rationale: Ang agarang konteksto ay ang pagpasok at pag-angkin sa lupain. Nililinaw lamang ng ‘nito’ ang pronominal na layon sa Hebreo at hindi nagdaragdag ng bagong teolohikal na pahayag.
- issue: Saklaw ng causative na יַנְחִלֶנָּה
  choice: ‘magpapamana nito sa Israel’
  alternative: ‘ibibigay niya ito sa Israel bilang mana’ o ‘hahatiin niya ito para sa Israel bilang mana’
  rationale: May saklaw ang pandiwa mula sa pagpapamana hanggang sa pagbibigay o paghahati bilang mana. Pinananatili sa pangunahing teksto ang mas malawak na causative na diwa, at inilalagay sa talababa ang leksikal na mga alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong idyomang ‘nakatayo sa harap mo’ at ang diin ng panghalip sa ‘siya ang.’ Inilipat ang panandang [a] sa sugnay na tinutukoy ng talababa upang malinaw na kaugnay ito ng יַנְחִלֶנָּה.
