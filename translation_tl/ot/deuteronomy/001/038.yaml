  source_fidelity: 'Tumpak ang mga pangunahing bahagi ng talata: ang pangalan, ang participial na parirala, ang pagpasok doon, at ang utos na palakasin si Josue. Gayunman, ang “magpapamana nito” ay hindi angkop na anyo para sa layong tinutukoy; ang Hebreong hulapi ay tumutukoy sa lupain. Ang “magpapamana ng lupain sa Israel” ay mas malinaw at tapat sa causative na diwa ng יַנְחִלֶנָּה.'
  naturalness: Likas at marangal ang kabuuang rehistro. Ang “nakatayo sa harap mo,” “papasok doon,” at “Palakasin mo siya” ay malinaw na modernong Filipino. Kailangan lamang ayusin ang huling pandiwa at layon upang maging idiomatiko.
  terminology: Ang “Josue” ay isang katanggap-tanggap at nakaugaliang anyo sa Filipino. Ang “mana” at “magpapamana” ay angkop sa terminolohiya ng mana/pagmamana, habang ang tahasang “lupain” ay nagpapalinaw sa pronominal na layon nang hindi nagdadagdag ng kahulugang wala sa konteksto.
