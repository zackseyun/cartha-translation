  rationale: Pinalitan ang hindi idiomatikong “magpapamana nito” ng “magpapamana ng lupain.” Nililinaw nito ang layon ng Hebreong hulapi ayon sa agarang konteksto at pinananatili ang causative na saklaw ng pandiwa, kabilang ang pagbibigay o paghahati bilang mana na nasa talababa.
