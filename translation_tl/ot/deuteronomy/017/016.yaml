source:
  edition: WLC
  text: רַק֮ לֹא יַרְבֶּה לּ֣/וֹ סוּסִים֒ וְ/לֹֽא יָשִׁ֤יב אֶת הָ/עָם֙ מִצְרַ֔יְמָ/ה לְמַ֖עַן הַרְבּ֣וֹת ס֑וּס וַֽ/יהוָה֙ אָמַ֣ר לָ/כֶ֔ם לֹ֣א תֹסִפ֗וּ/ן לָ/שׁ֛וּב בַּ/דֶּ֥רֶךְ הַ/זֶּ֖ה עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/016.yaml
  text: Only[a], he must not multiply horses for himself, nor cause the people to return to Egypt in order to multiply horses, since Yahweh has said to you[c][b], ‘You must never return again by this way.’
translation:
  language: tl
  text: Ngunit hindi siya dapat magparami ng mga kabayo para sa kanyang sarili[a], ni pabalikin ang bayan sa Ehipto[b] upang magparami ng mga kabayo, sapagkat sinabi ni Yahweh sa inyo, “Huwag na kayong bumalik kailanman sa daang ito.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “magkaroon ng napakaraming kabayo para sa kanyang sarili.” Ang pandiwang Hebreo ay nangangahulugang paramihin o dagdagan.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin na “dalhin pabalik ang bayan sa Ehipto.” Ang pandiwa ay causative: ipinagbabawal sa hari na maging sanhi ng pagbabalik ng bayan.'
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “Huwag na kayong magpatuloy sa pagbabalik sa daang ito.” Isa itong idyoma na nangangahulugang hindi na sila dapat muling bumalik sa daang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Sa konteksto, nagpapakilala ito ng mahigpit na pagtatakda sa maaaring gawin ng hari; natural sa modernong Filipino ang “Ngunit” habang pinananatili ang kontrast at limitasyon.
- source_word: יַרְבֶּה לּוֹ סוּסִים
  choice: hindi siya dapat magparami ng mga kabayo para sa sarili
  rationale: Pinananatili ng “magparami” ang kahulugan ng Hiphil ng רבה na ‘paramihin’ o ‘dagdagan,’ at ng “para sa sarili” ang לּוֹ.
- source_word: וְלֹא יָשִׁיב אֶת הָעָם מִצְרַיְמָה
  choice: ni pabalikin ang bayan sa Ehipto
  rationale: Ang “pabalikin” ay natural na causative sa Filipino at tumpak na kumakatawan sa Hiphil ng שוב; pinananatili rin ang kolektibong “bayan.”
- source_word: לְמַעַן הַרְבּוֹת סוּס
  choice: upang magparami ng mga kabayo
  rationale: Malinaw na ipinahahayag ng “upang” ang layunin at inuulit ng “magparami” ang leksikal na ugnayan sa naunang pagbabawal.
- source_word: וַיהוָה
  choice: sapagkat sinabi sa inyo ni Yahweh
  rationale: Ang “sapagkat” ay malinaw na nag-uugnay sa pagbabawal at sa naunang sinabi ni Yahweh; transliterated ang tipang pangalan bilang “Yahweh.”
- source_word: לֹא תֹסִפוּן לָשׁוּב
  choice: Huwag na kayong babalik kailanman
  rationale: Natural na ipinahahayag nito ang idyomang literal na ‘huwag nang magdagdag na bumalik,’ ibig sabihin ay lubos na pagbabawal sa muling pagbabalik.
- source_word: בַּדֶּרֶךְ הַזֶּה עוֹד
  choice: sa daang ito
  rationale: Ang “sa daang ito” ay natural na katumbas ng ruta o landas; ang diwa ng עוֹד ay isinama na sa “na” at “kailanman” upang maiwasan ang mabigat na pag-uulit.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipang pangalan nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Kung ang hari mismo ang babalik o siya ang magpapabalik sa bayan
  choice: pabalikin ang bayan
  alternative: bumalik ang bayan
  rationale: Causative ang anyo ng pandiwa, kaya ang hari ang ipinagbabawal na maging sanhi ng pagbabalik ng bayan; hindi dapat alisin ang tensiyong ito sa gramatika.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “bayan” para sa kolektibong הָעָם, “pabalikin” upang malinaw ang causative, at “Yahweh” para sa banal na pangalan. Iniwasan ang sobrang literal na anyong hindi natural sa Filipino, ngunit pinanatili sa mga talababa ang mahahalagang alternatibo at ang Hebreong idyoma.
