base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/003.yaml
  text: and goes and serves other gods and bows down to them[a], or to the sun or to the moon or to all the host of heaven, which I have not commanded[b],
translation:
  language: tl
  text: at humayo siya at naglingkod sa ibang mga diyos at yumukod sa mga iyon, o sa araw, o sa buwan, o sa buong hukbo ng langit[a], na hindi ko iniutos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “hukbo ng langit” ay maaaring tumukoy sa kalipunan ng mga bagay sa langit at, sa ilang gamit, ay maaari ring magpahiwatig ng mga nilalang na makalangit.
    reason: lexical_alternative
  - marker: b
    text: Ang “na hindi ko iniutos” ay maaaring tumukoy lamang sa “buong hukbo ng langit,” o mas malawak sa buong gawa ng paglilingkod at pagyukod sa ibang mga diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: humayo siya
  rationale: Sa legal na kondisyong sinimulan sa naunang talata, ipinagpapatuloy ng anyong Hebreo ang ipinapalagay na kilos. Ang “humayo siya” ay dignified at likas sa daloy, nang hindi ito ginagawang hiwalay na salaysay.
- source_word: וַיַּעֲבֹד
  choice: naglingkod
  rationale: Ang עבד kapag mga diyos ang layon ay tumutukoy sa kultikong paglilingkod o pagsamba. Pinananatili ng “naglingkod” ang kaibhan nito sa kasunod na pisikal na kilos ng pagyukod.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang ipinapahayag nito ang “other gods” nang hindi nagdaragdag ng di-tiyak na etniko o banyagang diwa.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: yumukod sa mga iyon
  rationale: Inilalarawan ng pandiwa ang pagyukod o pagpapatirapa bilang kilos ng pagsamba. Ang “yumukod” ay malinaw at natural; ang “mga iyon” ay umiiwas sa pantukoy na karaniwang para sa tao.
- source_word: וְלַשֶּׁמֶשׁ א֣וֹ לַיָּרֵחַ א֛וֹ לְכָל צְבָא הַשָּׁמַיִם
  choice: sa araw, sa buwan, o sa buong hukbo ng langit
  rationale: Ipinakikita ng mga gatlang na ang mga ito ang partikular na maaaring pag-ukulan ng pagyukod. Ang “hukbo ng langit” ay nagpapanatili sa kolektibo at bahagyang malawak na diwa ng צבא, bagaman mas malamang ang mga bagay sa kalangitan sa kontekstong ito.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: na hindi ko iniutos
  rationale: Tapat ito sa kawalan ng banal na utos at hindi pinapalitan ng mas interpretatibong “na ipinagbawal ko.” Hinahayaan din ng “na” na manatiling bukas kung ang sugnay ay pinakamalapit na tumutukoy sa hukbo ng langit o mas malawak sa inilarawang pagsamba.
theological_decisions:
- issue: Saklaw ng huling sugnay na אֲשֶׁר לֹא צִוִּיתִי
  choice: Isinalin bilang “na hindi ko iniutos,” na nakapuwesto pagkatapos ng buong talaan.
  alternative: Maaaring tumukoy lamang ito sa “buong hukbo ng langit,” o maaaring bumuo ng pangkalahatang pagtuligsa sa buong gawa ng paglilingkod at pagyukod sa ibang mga diyos.
  rationale: Gramatikal na pinakamalapit ang sugnay sa “hukbo ng langit,” ngunit maaaring mas malawak ang bisa nito sa konteksto. Hindi nilutas ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na may dignified na legal-biblikal na himig. Ginamit ang “humayo” para sa maayos na pagdurugtong sa kondisyong nasa naunang talata, ngunit iniwasan ang labis na makalumang pananalita. Ang “hukbo ng langit” ay sadyang pinanatiling malawak upang hindi agad limitahan sa mga bituin lamang o ipakahulugang mga nilalang sa langit.
