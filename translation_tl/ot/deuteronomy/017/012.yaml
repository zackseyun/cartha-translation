  source_fidelity: Tapat ang salin sa Hebreo. Naipapahayag ng “kumilos nang may kapangahasan” ang בזדון bilang sinasadya at mapanghamong pagsuway; ang “sa pagtangging makinig” ay wastong legal na diwa ng לבלתי שמע. Napananatili ang pari, hukom, paglilingkod kay Yahweh, legal na parusang “dapat mamatay,” at ang pormulang pag-aalis ng kasamaan mula sa Israel.
  naturalness: Natural at marangal ang modernong Filipino na gamit. Ang “lalaking kumilos nang may kapangahasan” at “ang lalaking iyon ay dapat mamatay” ay angkop sa pormal na rehistrong legal ng talata. Malinaw ang pagkakaugnay ng pagtangging makinig sa pari o sa hukom.
  terminology: Wasto at pare-pareho ang “Yahweh,” “pari,” “hukom,” at “Diyos.” Ang mga talababa ay angkop, may wastong mga pananda, at nakapagbibigay-linaw nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
