  text: וְ/הָ/אִ֞ישׁ אֲשֶׁר יַעֲשֶׂ֣ה בְ/זָד֗וֹן לְ/בִלְתִּ֨י שְׁמֹ֤עַ אֶל הַ/כֹּהֵן֙ הָ/עֹמֵ֞ד לְ/שָׁ֤רֶת שָׁם֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ א֖וֹ אֶל הַ/שֹּׁפֵ֑ט וּ/מֵת֙ הָ/אִ֣ישׁ הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/012.yaml
  text: But the man who acts presumptuously by not listening to the priest who stands there to minister before Yahweh your God[a], or to the judge—that man shall die[c][b]. So you shall purge the evil from Israel.
translation:
  language: tl
  text: Ngunit ang lalaking kumilos nang may kapangahasan[a] sa pagtangging makinig[b] sa paring nakatayo roon upang maglingkod kay Yahweh na iyong Diyos[c], o sa hukom—ang lalaking iyon ay dapat mamatay. Sa gayon ay aalisin mo ang kasamaan mula sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kumilos nang may kapangahasan”; maaari ring isalin na “kumilos nang may kayabangan” o “kumilos nang sadya.” Tumutukoy ito sa sinasadya at mapanghamong pagtanggi, hindi sa di-sinasadyang pagkukulang.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa pagtangging sumunod.” Sa mga legal na konteksto, ang Hebreong “makinig” ay madalas na may diwang pagtalima o pagsunod.
    reason: lexical_alternative
  - marker: c
    text: Ang “Yahweh” ay pagsasatitik ng banal na pangalang Hebreo na YHWH; ayon sa kaugalian, isinasalin din itong “ang PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָאִישׁ
  choice: Ngunit ang lalaki
  rationale: Ipinagpapatuloy ng וְ ang naunang legal na tagubilin at ipinakikilala ang salungat na kilos ng nagkasala. Pinananatili ng “lalaki” ang panlalaking isahan ng אִישׁ.
- source_word: יַעֲשֶׂה בְזָדוֹן
  choice: kumilos nang may kapangahasan
  rationale: Ang parirala ay tumutukoy sa sinasadya at mapanghamong pagkilos, hindi sa di-sinasadyang pagkukulang. Ang “kapangahasan” ay natural at may angkop na legal-moral na bigat.
- source_word: לְבִלְתִּי שְׁמֹעַ
  choice: sa pagtangging makinig
  rationale: Pinananatili nito ang pangunahing diwa ng שׁמע na “makinig,” habang malinaw na ipinahahayag na sinasadya ang hindi pagtalima sa pasiya.
- source_word: אֶל הַכֹּהֵן
  choice: sa pari
  rationale: Tuwirang katumbas ng כֹּהֵן ang “pari”; hindi kailangan ang pagpapalawak sa tungkuling opisyal.
- source_word: הָעֹמֵד לְשָׁרֶת שָׁם
  choice: nak atayo roon upang maglingkod
  rationale: Inilalarawan ng participle at infinitive ang opisyal na paglilingkod ng pari sa santuwaryo; pinananatili rin ang “roon” para sa שָׁם.
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: kay Yahweh na iyong Diyos
  rationale: Ang “maglingkod kay” ay natural sa Filipino at tapat sa tuwirang kaugnayan ng paglilingkod kay YHWH. Pinananatili ng “iyong Diyos” ang isahang pakikipag-usap sa Israelita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יהוה bilang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אוֹ אֶל הַשֹּׁפֵט
  choice: o sa hukom
  rationale: Ang שֹׁפֵט ay ang awtoridad na humahatol sa legal na usapin; malinaw at karaniwan ang “hukom.”
- source_word: וּמֵת הָאִישׁ הַהוּא
  choice: ang lalaking iyon ay dapat mamatay
  rationale: Ipinahahayag nito ang itinakdang parusang legal nang hindi nagdaragdag ng paraang hindi tahasang sinasabi sa Hebreo.
- source_word: וּבִעַרְתָּ הָרָע
  choice: Sa gayon ay aalisin mo ang kasamaan
  rationale: Sa pormulang legal ng Deuteronomio, ang בער ay nangangahulugang alisin o lipulin ang kasamaan sa gitna ng bayan. Natural sa Filipino ang “aalisin” at hindi nito ipinapalagay ang literal na pagsunog.
- source_word: מִיִּשְׂרָאֵל
  choice: mula sa Israel
  rationale: Ipinapakita ng מִן ang pag-aalis ng kasamaan mula sa sambayanang Israel.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang יְהוָה sa teksto. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Panlalaking isahan para sa nagkasala
  choice: ang lalaki / ang lalaking iyon
  alternative: ang tao; sinuman
  rationale: Gumagamit ang Hebreo ng panlalaking isahang אִישׁ. Pinananatili ito nang hindi pinalalawak o ginagawang tahasang pangkalahatan ang tinutukoy.
- issue: Lakas ng parusang וּמֵת
  choice: ay dapat mamatay
  alternative: ay mamamatay; ay papatayin
  rationale: Ipinakikita ng kontekstong legal na ito ay itinakdang parusa. Hindi ginamit ang “papatayin” sapagkat hindi tahasang binabanggit sa anyong Hebreo ang gumaganap ng pagpatay.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang anyong legal, ang panlalaking isahan ng nagkasala, at ang bahagyang literal na “makinig,” habang nilinaw sa talababa ang ipinahihiwatig na pagsunod. Iniwasan ang sobrang teknikal o makalumang pananalita.
