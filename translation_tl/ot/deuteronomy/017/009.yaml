base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/009.yaml
  text: And you shall come to the Levitical priests and to the judge who is in office in those days[a], and you shall inquire, and they shall declare to you the decision in the case.
translation:
  language: tl
  text: Pumunta ka sa mga paring Levita at sa hukom na nanunungkulan sa panahong iyon. Sumangguni ka sa kanila, at ipahahayag nila sa iyo ang pasya sa usapin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “ang salita ng paghatol.” Tumutukoy ang ekspresyong Hebreo sa awtorisadong pasyang panghukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: Pumunta ka
  rationale: Ang anyong pandiwa na may pang-ugnay ay nagsisilbing legal na tagubilin. Likas sa modernong Tagalog ang “Pumunta ka” para sa paglapit sa awtorisadong lupon.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: mga paring Levita
  rationale: Ipinakikilala ng pariralang Hebreo ang mga pari bilang mga Levita; hindi nito sinasabing pari ang lahat ng Levita. Maikli at malinaw ang “mga paring Levita.”
- source_word: הַשֹּׁפֵט אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: hukom na nanunungkulan sa panahong iyon
  rationale: Tinutukoy nito ang hukom na humahawak ng tungkulin sa panahong kinakaharap ang kaso, hindi ang isang partikular na pinangalanang tao. Ginagawang malinaw ng “nanunungkulan” ang institusyonal na diwa.
- source_word: וְדָרַשְׁתָּ
  choice: Sumangguni ka sa kanila
  rationale: Sa kontekstong panghukuman, ang pandiwa ay tumutukoy sa paghingi ng awtorisadong patnubay o pasya. Mas natural at tiyak dito ang “sumangguni” kaysa sa karaniwang “magtanong.”
- source_word: וְהִגִּידוּ לְךָ
  choice: ipahahayag nila sa iyo
  rationale: Ang Hiphil ng נגד ay nagpapahiwatig ng pormal na pagpapabatid. Pinananatili ng “ipahahayag” ang marangal at legal na himig.
- source_word: דְּבַר הַמִּשְׁפָּט
  choice: ang pasya sa usapin
  rationale: Literal itong “salita ng paghatol,” ngunit sa kontekstong ito ay tumutukoy sa awtorisadong pasyang panghukuman. Inihahatid ng “pasya sa usapin” ang legal na kahulugan nang hindi nililimitahan ito sa hatol na guilty o not guilty.
