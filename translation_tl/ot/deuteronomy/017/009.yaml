translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong legal. Ginamit ang isahang “ka” ayon sa gramatika ng Hebreo at ang “nila” para sa pinagsamang awtoridad ng mga pari at ng hukom.
