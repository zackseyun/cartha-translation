  source_fidelity: Tumpak na naihahatid ang utos na lumapit sa mga paring Levita at sa hukom na kasalukuyang nanunungkulan, humingi ng pasya, at tanggapin ang kanilang pasyang panghukuman. Ang plural na “nila” ay wastong tumutukoy sa magkasanib na mga awtoridad na binanggit sa Hebreo.
  naturalness: Likas at malinaw ang modernong Filipino Tagalog. Ang “Pumunta ka,” “Sumangguni ka,” at “ipahahayag nila” ay may angkop na pormal na himig para sa tagubiling legal nang hindi nagiging makaluma.
  terminology: Wasto ang “mga paring Levita,” na hindi nagpapahiwatig na lahat ng Levita ay pari. Ang “hukom na nanunungkulan” ay maayos na naghahatid ng kontemporanyong mayhawak ng tungkulin. Ang “pasya sa usapin” ay tumpak para sa דבר המשפט at hindi labis na nililimitahan sa isang hatol na pagkakasala o kawalang-sala. Tama rin at kapaki-pakinabang ang talababa.
