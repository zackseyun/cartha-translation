  text: וְ/הָיָ֣ה כְ/שִׁבְתּ֔/וֹ עַ֖ל כִּסֵּ֣א מַמְלַכְתּ֑/וֹ וְ/כָ֨תַב ל֜/וֹ אֶת מִשְׁנֵ֨ה הַ/תּוֹרָ֤ה הַ/זֹּאת֙ עַל סֵ֔פֶר מִ/לִּ/פְנֵ֥י הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/018.yaml
  text: And when he sits on the throne of his kingdom[a], he shall write for himself in a book a copy of this law[b], from before the Levitical priests.
translation:
  language: tl
  text: At kapag umupo siya sa trono ng kanyang kaharian, dapat siyang sumulat para sa sarili niya ng isang sipi ng kautusang ito sa isang balumbon, mula sa harap ng mga paring Levita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “mula sa siping iniingatan ng mga paring Levita.” Malamang na tumutukoy ito sa isang awtorisadong huwarang nasa pangangalaga nila. Sa Hebreo, literal na “mula sa harap ng mga pari, ang mga Levita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְשִׁבְתּוֹ
  choice: At kapag nakaupo na siya
  rationale: Likas na ipinahahayag sa Filipino ang temporal na kalagayang ipinakikilala ng וְהָיָה at כְּשִׁבְתּוֹ, habang pinananatili ang diwang pag-upo o pagluklok ng hari.
- source_word: עַל כִּסֵּא מַמְלַכְתּוֹ
  choice: sa trono ng kanyang kaharian
  rationale: Pinananatili ang kongkretong larawan ng trono at ang tuwirang ugnayan nito sa kaharian ng hari.
- source_word: וְכָתַב לוֹ
  choice: dapat siyang sumulat para sa sarili niya
  rationale: Ipinahahayag ng “dapat” ang legal na obligasyon, at ipinakikita ng “para sa sarili niya” ang diwang reflexive o para sa sariling pakinabang ng לּוֹ.
- source_word: מִשְׁנֵה
  choice: isang sipi
  rationale: Sa konteksto, tumutukoy ito sa kopya o duplikado, hindi lamang sa pag-uulit o sa abstraktong “ikalawa.”
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ng kautusang ito
  rationale: Ang “kautusan” ay malinaw at marangal na salin ng תּוֹרָה sa kontekstong legal at tipanan, nang hindi pinalalawak ang saklaw nito lampas sa ipinahihiwatig ng talata.
- source_word: עַל סֵפֶר
  choice: sa isang balumbon
  rationale: Ang סֵפֶר ay isang nakasulat na dokumento at malamang na balumbon sa sinaunang konteksto; mas tumpak dito ang “balumbon” kaysa sa makabagong larawan ng nakabigkis na aklat.
- source_word: מִלִּפְנֵי
  choice: mula sa nasa harap ng
  rationale: Pinananatili ang literal at bahagyang malabong “mula sa harap/presensya ng,” samantalang nililinaw sa talababa ang malamang na pagtukoy sa huwarang iniingatan ng mga pari.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: mga paring Levita
  rationale: Natural na Filipino para sa konstruksiyong maaaring unawaing “mga pari, ang mga Levita” o “mga paring Levitico,” nang hindi nagdaragdag ng denominasyonal na pakahulugan.
theological_decisions:
- issue: Saklaw ng תּוֹרָה sa batas para sa hari
  choice: kautusang ito
  alternative: tagubiling ito; Torah na ito
  rationale: Ang konteksto ay isang itinakdang legal na kalipunan para sa hari. Pinananatili ng “kautusan” ang legal at tipanang diwa nang hindi gumagawa ng mas malawak na pahayag tungkol sa kanon.
- issue: Ugnayan ng sipi sa pangangalaga ng mga pari
  choice: Pinanatili sa pangunahing teksto ang “mula sa nasa harap ng mga paring Levita,” na may paliwanag sa talababa.
  alternative: mula sa siping iniingatan ng mga paring Levita; sa harap ng mga paring Levita
  rationale: Maaaring ipinahihiwatig ng Hebreo ang isang awtorisadong huwarang nasa presensya o pangangalaga ng mga pari. Hindi tahasang nilulutas ng pangunahing teksto ang ambiguity; inilalahad sa talababa ang malamang na kahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “balumbon” para sa sinaunang anyo ng nakasulat na dokumento, “dapat” para sa legal na obligasyon, at “mga paring Levita” bilang natural na salin ng appositional na parirala. Pinanatili ang tunay na kalabuan ng מִלִּפְנֵי sa pangunahing teksto at nilinaw lamang ang malamang na diwa sa talababa.
