revisions:
- from: At kapag nakaupo na siya sa trono ng kanyang kaharian, dapat siyang sumulat para sa sarili niya, sa isang balumbon, ng isang sipi ng kautusang ito mula sa nasa harap ng mga paring Levita.[a]
  to: At kapag umupo siya sa trono ng kanyang kaharian, dapat siyang sumulat para sa sarili niya ng isang sipi ng kautusang ito sa isang balumbon, mula sa harap ng mga paring Levita.[a]
