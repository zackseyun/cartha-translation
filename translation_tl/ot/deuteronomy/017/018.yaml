  source_fidelity: 'Tumpak ang mahahalagang elemento: ang pag-upo ng hari sa trono, ang obligasyong sumulat para sa sarili, ang sipi ng kautusan, ang balumbon, at ang pariralang may kaugnayan sa mga paring Levita. Gayunman, ang “nakaupo na” ay bahagyang naglilipat ng diin sa kalagayang naganap na kaysa sa temporal na “kapag umupo siya,” at ang ayos ng mga pariralang may kuwit ay hindi natural.'
  naturalness: Kailangang ayusin ang pagkakasunod-sunod ng “para sa sarili niya, sa isang balumbon, ng isang sipi” upang maging malinaw at likas sa modernong Filipino. Ang “mula sa harap ng mga paring Levita” ay sadyang literal at medyo malabo, gaya ng Hebreo; ang talababa ang angkop na lugar para sa paglilinaw.
  terminology: Ang “trono,” “kaharian,” “sipi,” “kautusan,” “balumbon,” at “mga paring Levita” ay angkop sa marangal ngunit modernong rehistro. Pinananatili ng “mga paring Levita” ang natural na pagbasa ng הַכֹּהֲנִים הַלְוִיִּם nang walang dagdag na interpretasyong doktrinal.
