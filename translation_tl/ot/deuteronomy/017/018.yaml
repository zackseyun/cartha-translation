    rationale: Bagaman nauunawaan, napuputol ang ugnayan ng pandiwa at layon. Ang “sumulat para sa sarili niya ng isang sipi ... sa isang balumbon” ay mas malinaw at mas natural, habang pinananatili ang saklaw ng Hebreo.
