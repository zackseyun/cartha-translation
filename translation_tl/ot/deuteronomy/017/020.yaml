  text: לְ/בִלְתִּ֤י רוּם לְבָב/וֹ֙ מֵֽ/אֶחָ֔י/ו וּ/לְ/בִלְתִּ֛י ס֥וּר מִן הַ/מִּצְוָ֖ה יָמִ֣ין וּ/שְׂמֹ֑אול לְמַעַן֩ יַאֲרִ֨יךְ יָמִ֧ים עַל מַמְלַכְתּ֛/וֹ ה֥וּא וּ/בָנָ֖י/ו בְּ/קֶ֥רֶב יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/020.yaml
  text: so that his heart may not be lifted up above his brothers[a], and so that he may not turn aside from the commandment to the right or to the left, in order that he may prolong his days in his kingdom, he and his sons, in the midst of Israel.
translation:
  language: tl
  text: upang hindi magmataas ang kanyang puso nang higit sa kanyang mga kapatid[a], at upang hindi siya lumihis sa utos, sa kanan man o sa kaliwa, upang humaba ang kanyang mga araw sa kanyang paghahari, siya at ang kanyang mga anak na lalaki, sa gitna ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang higit sa kanyang mga kapwa Israelita.” Sa Hebreo, “nang higit sa kanyang mga kapatid,” na gumagamit ng wikang pangkamag-anakan ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי
  choice: upang hindi
  rationale: Likas na ipinapahayag sa Tagalog ang layuning makaiwas sa isang bagay, habang pinananatili ang ugnayang panglayon ng Hebreo.
- source_word: רוּם לְבָבוֹ
  choice: magmataas ang kanyang puso
  rationale: Pinananatili ang idyomang Hebreo tungkol sa puso bilang kaloob-looban at malinaw na ipinahihiwatig ang pagmamataas nang hindi ito labis na ipinapaliwanag.
- source_word: מֵאֶחָיו
  choice: sa kanyang mga kapatid
  rationale: Pinananatili ang literal na wikang pangkamag-anakan ng tipan; nililinaw sa talababa na tumutukoy ito sa kapwa mga Israelita.
- source_word: סוּר
  choice: lumihis
  rationale: Natural at malinaw na salitang Tagalog para sa pagtalikod o paglihis mula sa iniutos na landas.
- source_word: הַמִּצְוָה
  choice: sa utos
  rationale: Ang tiyak na pangngalang isahan ay pinanatiling isahan at maaaring tumukoy nang kolektibo sa iniutos na kautusan sa konteksto.
- source_word: יָמִין וּשְׂמֹאול
  choice: sa kanan man o sa kaliwa
  rationale: Pinananatili ang Hebreong metapora ng paglihis sa alinmang panig at natural ang anyong “man o” sa Tagalog.
- source_word: יַאֲרִיךְ יָמִים
  choice: humaba ang kanyang mga araw
  rationale: Pinananatili ang konkretong idyoma ng Hebreo sa halip na lubusang gawing “magtagal,” ngunit nananatiling nauunawaan sa konteksto.
- source_word: עַל מַמְלַכְתּוֹ
  choice: sa paghahari
  rationale: Sa konteksto, tumutukoy ito sa tagal ng panunungkulan bilang hari, hindi lamang sa teritoryong nasasakupan.
- source_word: הוּא וּבָנָיו
  choice: siya at ang kanyang mga anak na lalaki
  rationale: Pinananatili ang tahasang panlalaking anyo at ang dinastikong pokus ng Hebreong “mga anak na lalaki.”
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: sa gitna ng Israel
  rationale: Pinananatili ang Hebreong pananalitang pangkomunidad at pangkalawakan sa isang dignified at pamilyar na anyong Tagalog.
theological_decisions:
- issue: Panlalaking wikang pangkamag-anakan sa batas para sa hari
  choice: mga kapatid
  alternative: mga kapwa Israelita
  rationale: Ang Hebreo ay literal na “mga kapatid” at gumagamit ng wikang pangkamag-anakan ng tipan. Pinanatili ito sa teksto at nilinaw ang mas malawak na tinutukoy sa talababa.
- issue: Pananalita tungkol sa dinastikong pagpapatuloy
  choice: siya at ang kanyang mga anak na lalaki
  alternative: siya at ang kanyang mga inapo
  rationale: Tahasang “mga anak na lalaki” ang nasa Hebreo. Ang “mga inapo” ay posibleng pagpapakahulugan ngunit mas malawak kaysa sa leksikal na anyo ng teksto.
- issue: Kahulugan ng עַל מַמְלַכְתּוֹ
  choice: sa paghahari
  alternative: sa kanyang kaharian
  rationale: Ang konteksto ay ang pagtagal ng hari at ng kanyang mga anak sa pamamahala. Ang “paghahari” ay nagpapahayag nito nang natural nang hindi ginagawang simpleng pagtukoy sa lupain o nasasakupan.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang mga biblikal na idyomang “puso,” “kanan…kaliwa,” at “humaba ang kanyang mga araw,” ngunit inayos ang pangungusap upang maging malinaw sa karaniwang mambabasa.
