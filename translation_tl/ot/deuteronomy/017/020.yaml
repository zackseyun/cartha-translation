  terminology: Ang “utos,” “lumihis,” “mga anak na lalaki,” at “sa gitna ng Israel” ay angkop at malapit sa pinagmulang teksto. Nananatiling wasto ang talababa tungkol sa “mga kapatid” bilang wikang pangtipan.
