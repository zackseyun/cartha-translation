  source_fidelity: Kailangan ng pagbabago dahil ang pangunahing teksto ay nagpasok ng “kung,” na ginagawang kondisyon ang pahayag na sa Hebreo ay resulta ng pagsisiyasat at isang pormula ng pagpapatunay. Dapat ding malinaw na ang “totoo at tiyak” ay naglalarawan sa usapin, hindi isang bagong kondisyon.
  naturalness: Ang “magsiyasat kang mabuti” at “kasuklam-suklam” ay angkop sa marangal ngunit modernong Tagalog. Mas malinaw at mas natural ang paghihiwalay ng pormulang legal bilang “totoo at tiyak ang bagay” bago tukuyin ang nagawang kasuklam-suklam na bagay.
  terminology: Ang “kasuklam-suklam” ay sapat na matindi para sa תּוֹעֵבָה at hindi labis na nagpapakahulugan. Pinanatili ang “Israel” at ang legal na tono ng masusing pagsisiyasat.
