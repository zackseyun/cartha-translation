base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/004.yaml
  text: and it is reported to you[a], and you hear of it, and you investigate thoroughly, and behold, it is true and certain that this abomination has been done in Israel,
translation:
  language: tl
  text: 'at ibinalita ito sa iyo at narinig mo ito, at magsiyasat kang mabuti. At masdan, totoo at tiyak ang bagay: ginawa sa Israel ang kasuklam-suklam na ito,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֻגַּד לְךָ
  choice: at ibinalita ito sa iyo
  rationale: 'Pinananatili ng “ibinalita” ang pasibong diwa ng Hophal ng נגד: ang pangyayari ay ipinaabot bilang ulat sa kausap. Ang “ito” ay likas na tumutukoy sa usaping binanggit sa naunang talata.'
- source_word: וְשָׁמָעְתָּ
  choice: at narinig mo
  rationale: 'Tuwirang katumbas ng karaniwang kahulugan ng שׁמע at umaayon sa legal na pagkakasunod: pagkatanggap ng ulat, saka ito sinusuri.'
- source_word: וְדָרַשְׁתָּ הֵיטֵב
  choice: magsiyasat kang mabuti
  rationale: Sa kontekstong panghukuman, ang דרש ay mas angkop na “magsiyasat” kaysa simpleng “magtanong”; inililipat ng “mabuti” ang nagpapatinding הֵיטֵב.
- source_word: וְהִנֵּה
  choice: at masdan
  rationale: Ang “masdan” ay isang marangal at malinaw na panandang pantukoy na humihingi ng pansin sa resulta ng pagsisiyasat, nang hindi pinapantay lamang sa “at talagang.”
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: kung totoo at tiyak na nagawa
  rationale: 'Ipinahahayag ng “totoo at tiyak” ang dalawang sangkap ng pormulang panghukuman: katotohanan at matatag na pagkakumpirma. Ginawang sugnay na “na nagawa” ang הַדָּבָר ayon sa likas na daloy ng modernong Tagalog, habang inilalagay sa talababa ang mas pormal na alternatibo.'
- source_word: נֶעֶשְׂתָה
  choice: nagawa
  rationale: Pinananatili ng anyong “nagawa” ang pasibong diwa at ang katunayang naisakatuparan na ang gawa.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: ang kasuklam-suklam na ito
  rationale: Ang “kasuklam-suklam” ay nagpapanatili sa matinding moral at tipanang pagtuligsa ng תּוֹעֵבָה, at likas ding magagamit bilang pangngalan sa Tagalog.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Malinaw nitong inilalagay ang pagkakasala sa loob ng pamayanang Israel ayon sa gamit ng בְּ.
theological_decisions:
- issue: Ang pormulang panghukuman na אֱמֶת נָכוֹן הַדָּבָר
  choice: kung totoo at tiyak na nagawa
  alternative: kung totoo at napatunayan ang bagay
  rationale: Pinananatili sa pangunahing teksto ang dalawang magkaugnay ngunit hindi lubusang magkaparehong ideya ng katotohanan at katiyakan. Hindi nito ipinapasok ang anumang dagdag na teolohikal na pagpapakahulugan sa pormulang legal.
- issue: Ang bigat ng תּוֹעֵבָה
  choice: kasuklam-suklam
  alternative: karumal-dumal na gawa
  rationale: Ang pinili ay matindi ngunit nauunawaan sa kasalukuyang Tagalog at hindi pinalalambot ang hatol ng teksto. Hindi rin nito nililimitahan ang salita sa isang uri lamang ng pagkakasala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang legal na himig at ang magkakasunod na hakbang ng pag-uulat, pagdinig, at masusing pagsisiyasat. Ang kuwit sa hulihan ay nagpapakitang nagpapatuloy ang kondisyong pangungusap sa kasunod na talata.
