- from: at ibinalita ito sa iyo at narinig mo, magsiyasat kang mabuti. At masdan, kung totoo at tiyak na nagawa[a] sa Israel ang kasuklam-suklam na ito,
  to: 'at ibinalita ito sa iyo at narinig mo ito, at magsiyasat kang mabuti. At masdan, totoo at tiyak ang bagay: ginawa sa Israel ang kasuklam-suklam na ito,'
  rationale: Inalis ang walang batayang “kung” upang maipakita ang pahayag ng napatunayang katotohanan sa Hebreo. Ibinalik ang hayag na “ang bagay” para sa הַדָּבָר, habang ang “ginawa sa Israel ang kasuklam-suklam na ito” ay pinananatili ang pasibong diwa ng נֶעֶשְׂתָה at ang lakas ng תּוֹעֵבָה. Iningatan ang hulihang kuwit dahil nagpapatuloy ang pangungusap sa kasunod na talata.
