  text: כִּֽי תָבֹ֣א אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֣בְתָּה בָּ֑/הּ וְ/אָמַרְתָּ֗ אָשִׂ֤ימָה עָלַ/י֙ מֶ֔לֶךְ כְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר סְבִיבֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/014.yaml
  text: When you come into the land that Yahweh your God is giving you[a], and you take possession of it and live in it, and you say, “I will set a king over myself, like all the nations that are around me,”
translation:
  language: tl
  text: Kapag pumasok ka sa lupain na ibinibigay sa iyo ni Yahweh, na iyong Diyos, at inari mo ito at nanirahan ka roon, at sinabi mo, “Magtatalaga ako ng haring mamumuno sa akin,[a] gaya ng lahat ng bansang nakapaligid sa akin,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Magtatalaga ako ng hari sa ibabaw ko.” Literal na “magtatakda/maglalagay ako ng hari sa akin/sa ibabaw ko.”'
    reason: Ipinakikita ang mas malapit na anyo ng Hebreong אָשִׂימָה עָלַי מֶלֶךְ, habang ang pangunahing teksto ay gumagamit ng likas na Filipino para sa hari na inilalagay na may kapamahalaan sa nagsasalita.
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Kapag pumasok ka
  rationale: Ipinahahayag ng כִּי rito ang isang inaasahang pangyayari sa hinaharap, at ang בוא kasama ng אֶל ay likas na isinasaling ‘pumasok sa.’ Pinananatili ng ‘ka’ ang pang-isahang kausap sa Hebreo.
- source_word: הָאָרֶץ
  choice: lupain
  rationale: Tumutukoy ito sa lupaing ibinibigay sa Israel. Mas angkop dito ang ‘lupain’ kaysa sa pangkalahatang ‘lupa’ o makabagong pampolitikang ‘bansa.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang ipinapahayag ang pang-isahang ikalawang panauhang hulapi at ang ugnayang tipan ng Diyos sa kausap.
- source_word: נֹתֵן לָךְ
  choice: ibinibigay sa iyo
  rationale: Ang participle ay naglalarawan sa kasalukuyan o tiyak na pagkilos ni Yahweh sa inaasahang hinaharap; natural itong maipahahayag sa Filipino bilang ‘ibinibigay.’
- source_word: וִירִשְׁתָּהּ
  choice: at angkinin mo iyon
  rationale: Sa konteksto ng lupain, ang ירשׁ ay nangangahulugang kunin at ariin bilang pag-aari. Naihahatid ng ‘angkinin’ ang aktibong pagkuha ng pagmamay-ari.
- source_word: וְיָשַׁבְתָּה בָּהּ
  choice: at manirahan doon
  rationale: Ang ישׁב ay tumutukoy sa paninirahan o permanenteng pagtira. Mas natural sa Filipino ang ‘doon’ kaysa sa paulit-ulit na ‘sa iyon.’
- source_word: וְאָמַרְתָּ
  choice: at sabihin mo
  rationale: Pinananatili ang sunod-sunod na ayos ng kondisyong legal sa Hebreo.
- source_word: אָשִׂימָה עָלַי מֶלֶךְ
  choice: Magtatalaga ako ng hari na mamumuno sa akin
  rationale: Ang שׂים ay maaaring ‘maglagay’ o ‘magtalaga,’ at ang עָלַי ay literal na ‘sa ibabaw ko.’ Ang salin ay natural sa modernong Filipino habang pinananatili ang diwang ang hari ay ilalagay na may kapamahalaan sa nagsasalita.
- source_word: כְּכָל הַגּוֹיִם אֲשֶׁר סְבִיבֹתָי
  choice: gaya ng lahat ng bansang nakapaligid sa akin
  rationale: Ang גּוֹיִם dito ay mga kalapit na bansa, hindi ang kalaunang teolohikal na kategoryang ‘mga Hentil.’ Pinananatili rin ang unang panauhan ng tuwirang sipi.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya tinutumbasan ito bilang ‘Yahweh’ sa halip na palitan ng titulong ‘PANGINOON.’
- issue: Pananaw ng teksto tungkol sa paghiling ng hari
  choice: Hindi nilagyan ng tahasang papuri o pagsaway ang pahayag
  alternative: Isaling para ipahiwatig na makasalanan o ipinag-uutos ang paghiling ng hari
  rationale: Inilalahad ng talata ang inaasahang sasabihin ng Israel, ngunit sa talatang ito lamang ay hindi pa tahasang hinahatulan o pinupuri ang hangaring iyon. Pinananatili ang tensiyong ito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang pang-isahang ‘ka/iyo’ upang mapanatili ang gramatikal na bilang ng Hebreo. Pinanatili ang kuwit sa hulihan sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
