base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/010.yaml
  text: You shall act according to the word that they declare to you from that place which Yahweh will choose[a], and you shall be careful to do according to all that they instruct you.
translation:
  language: tl
  text: Kikilos ka ayon sa pasiyang ipahahayag nila sa iyo mula sa lugar na iyon na pipiliin ni Yahweh,[a] at maingat mong susundin ang lahat ng ituturo nila sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa salitang ipahahayag nila sa iyo.” Ang salitang Hebreo na דָּבָר ay maaaring mangahulugang “salita,” “usapin,” o, sa kontekstong hudisyal, “pasiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Kikilos ka
  rationale: Ang עשה ay malawak ang kahulugang “gawin/kumilos.” Sa kontekstong legal at kasunod ng עַל־פִּי, natural sa Filipino ang “kikilos ka” at nananatili ang lakas ng utos.
- source_word: עַל פִּי הַדָּבָר
  choice: ayon sa pasiya
  rationale: Ang עַל־פִּי ay “ayon sa” o “sa awtoridad ng,” at ang דָּבָר ay maaaring “salita, usapin, pasiya.” Sa kontekstong hudisyal, malinaw at natural ang “pasiya,” habang inilalahad sa talababa ang mas literal na “salita.”
- source_word: יַגִּידוּ לְךָ
  choice: ipahahayag nila sa iyo
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipabatid o ipahayag; ang “ipahahayag” ay angkop sa pormal at may-awtoridad na kapahayagan ng mga tagapaghukom.
- source_word: מִן הַמָּקוֹם הַהוּא אֲשֶׁר יִבְחַר יְהוָה
  choice: mula sa lugar na iyon na pipiliin ni Yahweh
  rationale: Pinananatili ang pinagmumulan ng pasiya at ang panghinaharap na diwa ng יִבְחַר sa inaasahang lugar na pipiliin ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: iingatan mong gawin
  rationale: Ang שׁמר na may infinitive ay nagpapahayag ng maingat na pagtupad. Ang “iingatan mong gawin” ay dignified at nauunawaan, at malapit sa Hebreong larawan ng masusing pagsunod.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּךָ
  choice: ang lahat ng ituturo nila sa iyo
  rationale: Ang Hiphil ng ירה ay maaaring “ituro, tagubilinan, patnubayan,” lalo na sa legal na konteksto. Pinananatili ng “ituturo” ang kaugnayan nito sa torah nang hindi labis na nililimitahan ang kahulugan.
theological_decisions:
- issue: Paglalapat ng awtoridad ng pasiya
  choice: ayon sa pasiyang ipahahayag nila
  alternative: ayon sa salitang ipahahayag nila
  rationale: Ang konteksto ay isang usaping hudisyal, kaya ang “pasiya” ang natural na pangunahing salin. Gayunman, hindi itinatago ang lawak ng דָּבָר; ibinibigay sa talababa ang literal at leksikal na alternatibo.
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa tekstong Hebreo ang personal na pangalang YHWH. Ang “Yahweh” ay nagpapanatili sa pangalan sa halip na palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino na pormal at marangal ngunit madaling maunawaan. Ginamit ang “pasiya” para sa natural na wikang hudisyal, at pinanatili ang “ituturo” upang huwag paliitin ang saklaw ng legal na tagubilin.
