  source_fidelity: 'Tumpak ang pangunahing diwa: ang utos ay kumilos ayon sa awtoritatibong pasiyang ipahahayag mula sa piniling lugar ni Yahweh. Ang “pasiya” ay isang makatuwirang kontekstuwal na salin ng דָּבָר, at maayos na pinananatili ng talababa ang mas malawak na alternatibong “salita.” Gayunman, ang huling sugnay na “gawin ang lahat ng ituturo nila” ay bahagyang inililipat ang saklaw: ang כְּכֹל ay “ayon sa/alinsunod sa lahat ng,” kaya dapat malinaw na ang kilos ay lubos na umaayon sa kanilang itinuturo.'
  naturalness: Pormal, malinaw, at natural ang “Kikilos ka ayon sa pasiyang ipahahayag nila sa iyo.” Ang “maingat mong sundin ang lahat ng ituturo nila sa iyo” ay mas likas sa modernong Filipino kaysa “iingatan mong gawin,” habang naihahayag ang maingat na pagsunod ng וְשָׁמַרְתָּ לַעֲשׂוֹת.
  terminology: Ang “Yahweh” ay wastong salin ng יהוה ayon sa ibinigay na patakaran. Ang “pasiya” ay angkop sa hudisyal na konteksto nang hindi inaalis ang leksikal na lawak ng דָּבָר, na naitala sa talababa. Ang “ituturo” ay katanggap-tanggap para sa יוֹרוּךָ sa legal na konteksto.
