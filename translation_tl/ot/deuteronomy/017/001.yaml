  text: לֹא תִזְבַּח֩ לַ/יהוָ֨ה אֱלֹהֶ֜י/ךָ שׁ֣וֹר וָ/שֶׂ֗ה אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם כֹּ֖ל דָּבָ֣ר רָ֑ע כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/001.yaml
  text: You shall not sacrifice to Yahweh your God an ox or a sheep that has in it a blemish[a], any bad thing, for that is an abomination to Yahweh your God.
translation:
  language: tl
  text: Huwag kang maghandog kay Yahweh na iyong Diyos ng baka o tupa[a] na may kapintasan, anumang masamang bagay, sapagkat iyon ay kasuklam-suklam kay Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong שֶׂה ay mas malawak kaysa “tupa” at maaaring tumukoy sa tupa o kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  choice: maghandog
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa paghahandog ng hayop bilang sakripisyo, hindi lamang sa pagkatay nito.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tahasang pinananatili ang pangalang tipan na יהוה sa anyong Yahweh.
- source_word: שׁוֹר
  choice: baka
  rationale: Natural at hindi labis na tiyak na katawagan sa modernong Filipino para sa malaking hayop na inihahandog; hindi ipinapalagay ang kasarian gaya ng 'toro'.
- source_word: שֶׂה
  choice: tupa
  rationale: Ang 'tupa' ay malinaw at karaniwang salin, habang inilalahad sa talababa na maaaring saklawin ng Hebreo ang kambing.
- source_word: מוּם
  choice: kapintasan
  rationale: Ipinahahayag nito ang pisikal na depektong nag-aalis sa pagiging karapat-dapat ng hayop bilang handog.
- source_word: כֹּל דָּבָר רָע
  choice: anumang masamang depekto
  rationale: Pinananatili ang malawak na diwa ng 'anumang masamang bagay' ngunit ginagawang malinaw sa konteksto na tumutukoy ito sa kapintasan ng hayop.
- source_word: תוֹעֲבַת
  choice: karumal-dumal
  rationale: Natural at mabigat na salitang Filipino para sa isang bagay na kasuklam-suklam sa harap ng Diyos.
theological_decisions:
- issue: Pagpapangalan sa יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit mismo ng tekstong Hebreo ang banal na pangalan; pinananatili ito bilang Yahweh nang hindi pinapalitan ng titulo.
- issue: Saklaw ng שֶׂה
  choice: tupa sa pangunahing teksto, na may paliwanag sa talababa
  alternative: hayop mula sa kawan; tupa o kambing
  rationale: Nagbibigay ang pangunahing teksto ng natural na katawagan ngunit hindi itinatago ang mas malawak na saklaw ng salitang Hebreo.
- issue: Ugnayan ng כֹּל דָּבָר רָע sa מוּם
  choice: pagpapalawak o paglilinaw sa kapintasan
  alternative: literal na hiwalay na pariralang 'anumang masamang bagay'
  rationale: Sa konteksto ng kwalipikasyon ng hayop na ihahandog, ang parirala ay malamang na nagpapalawak sa uri ng diskwalipikadong kapintasan; pinananatili ng 'anumang' ang lawak nito.
translation_notes:
  register: Makabagong Filipino na tuwiran at marangal. Ginamit ang pang-isahang 'kang/iyong' upang katawanin ang pang-isahang pananalita ng Hebreo. Ang gitling-pahaba ay nagpapakita na ang kasunod na parirala ay nagpapaliwanag o nagpapalawak sa 'kapintasan.'
