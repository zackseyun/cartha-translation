  source_fidelity: Tumpak na naipapahayag ng draft ang kondisyunal na pormulang legal, ang saklaw na “sa piling mo,” ang metonimikong “mga pintuang-bayan,” ang tahasang “lalaki o babae,” ang pagsusuring “sa paningin ni Yahweh,” at ang pangkalahatang paglabag sa tipan. Gayunman, ang ayos na “Kung may matagpuan ... isang lalaki o babae” ay hindi gaanong likas sa modernong Filipino; mas malinaw na ilapit ang “lalaki o babae” sa pandiwang “matagpuan.”
  naturalness: Mas natural at malinaw ang “Kung may matagpuang lalaki o babae sa piling mo” kaysa sa paghihiwalay ng layon ng “matagpuan” sa pamamagitan ng dalawang pariralang panlunan. Ang natitirang pahayag ay marangal at angkop sa rehistrong legal-kasulatan.
  terminology: Ang “Yahweh na iyong Diyos,” “tipan,” at “sa paningin” ay angkop at pare-pareho. Ang “bayan” bilang pangunahing salin ng שְׁעָרֶיךָ ay katanggap-tanggap kung may talababa na nagsasaad ng literal na “mga pintuan” at ng metonimikong gamit nito.
