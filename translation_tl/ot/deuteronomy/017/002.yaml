base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/002.yaml
  text: If there is found among you[a], within one of your gates that Yahweh your God is giving you, a man or a woman who does what is evil in the eyes of Yahweh your God by transgressing his covenant[b],
translation:
  language: tl
  text: Kung may matagpuang lalaki o babae sa piling mo, sa isa sa mga bayan mo[a] na ibinibigay sa iyo ni Yahweh na iyong Diyos, na gumagawa ng masama sa paningin ni Yahweh na iyong Diyos sa pamamagitan ng paglabag sa kanyang tipan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “sa isa sa mga pintuan mo.” Sa kontekstong ito, ang “mga pintuan” ay maaaring tumukoy sa mga bayan o lunsod na nasasakupan mo.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa pagsuway sa kanyang tipan” o “sa paglabag sa kanyang tipan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִמָּצֵא
  choice: Kung may matagpuan
  rationale: Ipinakikilala nito ang kondisyon sa isang kasong legal, at pinananatili ng “may matagpuan” ang di-tahasang pasibong anyo ng Hebreo.
- source_word: בְקִרְבְּךָ
  choice: sa piling mo
  rationale: Natural na Filipino para sa presensiya sa loob ng pamayanan, habang pinananatili ang isahang pagtukoy sa Israel bilang kausap.
- source_word: בְאַחַד שְׁעָרֶיךָ
  choice: sa isa sa mga bayan mo
  rationale: Bagaman literal na “sa isa sa mga pintuang-bayan mo,” ang “mga pintuang-bayan” ay metonimiya para sa mga bayang nasasakupan; inilalagay sa talababa ang literal na anyo.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: na ibinibigay sa iyo ni Yahweh na iyong Diyos
  rationale: Ang aspektong participial ay inihahayag bilang nagpapatuloy na pagbibigay, at ang banal na pangalan ay isinaling “Yahweh.”
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: isang lalaki o babae
  rationale: Pinananatili ang tahasang pares na lalaki at babae sa Hebreo.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת הָרַע
  choice: na gumagawa ng masama
  rationale: Natural na salin ng idyomang Hebreo na “gumawa ng kasamaan,” nang hindi pinahihina ang moral na bigat nito.
- source_word: בְּעֵינֵי יְהוָה אֱלֹהֶיךָ
  choice: sa paningin ni Yahweh na iyong Diyos
  rationale: Pinananatili ang malinaw at karaniwang metaporang Hebreo ng pagtataya “sa paningin” ng Diyos.
- source_word: לַעֲבֹר בְּרִיתוֹ
  choice: sa pamamagitan ng paglabag sa kanyang tipan
  rationale: Iniuugnay ang paglabag sa tipan sa masamang gawa bilang paraan o paglalarawan, nang hindi tinutukoy nang mas makitid ang kasalanan na lilinawin sa kasunod na talata.
theological_decisions:
- issue: Saklaw at ugnayan ng paglabag sa tipan
  choice: “sa pamamagitan ng paglabag sa kanyang tipan”
  alternative: “upang sirain ang kanyang tipan” o “sa pagsuway sa kanyang tipan”
  rationale: Nananatiling pangkalahatan sa talata ang paglabag sa tipan, at maaari ring maunawaan ang infinitive bilang paraan, resulta, o layon. Hindi ipinapasok sa salin ang partikular na paglabag na saka pa lamang ilalahad sa kasunod na talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” sa pangunahing teksto para sa likas na kahulugan ng metonimiyang “pintuang-bayan,” habang pinanatili sa talababa ang literal na larawan. Napanatili rin ang isahang kausap na “mo/iyo,” ang pangalang Yahweh, at ang di-tiyak na ugnayan ng infinitive sa paglabag sa tipan.
