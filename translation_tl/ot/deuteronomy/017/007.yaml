base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/007.yaml
  text: The hand of the witnesses shall be first against him to put him to death[a], and afterward the hand of all the people[b]. So you shall purge the evil from your midst.
translation:
  language: tl
  text: Ang mga saksi ang unang kikilos laban sa kanya upang patayin siya, at pagkatapos ay kikilos ang buong bayan.[a] Sa gayon, aalisin mo ang kasamaan mula sa gitna mo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang kamay ng mga saksi … at ang kamay ng buong bayan”—isang idyomang legal na nagsasaad na ang mga saksi ang unang may pananagutang magsagawa ng hatol, saka makikibahagi ang buong bayan.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “mula sa inyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד הָעֵדִים
  choice: ang mga saksi ang unang kikilos
  rationale: Ang literal na “kamay ng mga saksi” ay isang idyomang legal na tumutukoy sa pagkilos o pananagutan. Ang “ang mga saksi ang unang kikilos” ay natural sa modernong Tagalog at pinananatili ang kanilang unang papel sa pagpapatupad ng hatol.
- source_word: הָעֵדִים
  choice: mga saksi
  rationale: Tumutukoy ito sa mga legal na saksi, hindi lamang sa mga nag-aakusa.
- source_word: בּוֹ
  choice: laban sa kanya
  rationale: Sa konteksto ng pagpaparusa, ipinahihiwatig ng parirala ang pagkilos laban sa hinatulan.
- source_word: בָרִאשֹׁנָה
  choice: unang
  rationale: 'Ipinapahayag nito ang pagkakasunod-sunod: ang mga saksi ang magsisimula sa pagpapatupad ng hatol.'
- source_word: לַהֲמִיתוֹ
  choice: upang patayin siya
  rationale: Tuwirang isinasalin ang Hiphil ng מות bilang pagsanhi ng kamatayan; malinaw at natural ito sa Tagalog sa kontekstong legal.
- source_word: וְיַד כָּל הָעָם בָּאַחֲרֹנָה
  choice: at pagkatapos ay ang buong bayan
  rationale: Pinananatili ang pagkakasunod-sunod at pakikibahagi ng buong pamayanan, habang iniiwasan ang hindi natural na literal na “kamay ng buong bayan.”
- source_word: וּבִעַרְתָּ
  choice: aalisin mo
  rationale: Sa pormulang legal ng Deuteronomio, ang pandiwa ay tumutukoy sa pag-aalis o pagpawi, hindi sa literal na pagsunog.
- source_word: הָרָע
  choice: ang kasamaan
  rationale: Pinananatili ang malawak at pormulang kahulugan ng Hebreo sa halip na limitahan ito sa “masamang tao” o sa isang partikular na pagkakasala.
- source_word: מִקִּרְבֶּךָ
  choice: sa gitna mo
  rationale: Malapit ito sa larawan ng Hebreo at likas na pahayag sa marangal na modernong Tagalog para sa nasa loob ng pamayanan.
theological_decisions:
- issue: Pagpapakahulugan sa pormulang וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: aalisin mo ang kasamaan sa gitna mo
  alternative: aalisin mo ang masamang tao mula sa inyo
  rationale: Ang Hebreo ay nagsasabing “ang kasamaan,” kaya hindi ito nilimitahan sa mismong nagkasala. Pinananatili ng salin ang legal at pangkomunidad na diin ng pormula.
- issue: Pananagutan ng mga saksi sa pagpapatupad ng hatol
  choice: ang mga saksi ang unang kikilos laban sa kanya
  alternative: ang kamay ng mga saksi ang unang mapapasakanya
  rationale: Ipinahahayag ng natural na Tagalog ang legal na ahensiya ng mga saksi nang hindi ginagawang literal at malabo ang idyomang “kamay.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong legal. Isinalin ayon sa diwa ang idyomang “kamay” upang hindi maging malabo, ngunit ipinaliwanag ang literal na anyo sa talababa. Ginamit ang “bayan” para sa pangkomunidad na kahulugan ng הָעָם at “kasamaan” upang mapanatili ang sadyang lawak ng pormulang Hebreo.
