  text: כִּ֣י יִפָּלֵא֩ מִמְּ/ךָ֨ דָבָ֜ר לַ/מִּשְׁפָּ֗ט בֵּֽין דָּ֨ם לְ/דָ֜ם בֵּֽין דִּ֣ין לְ/דִ֗ין וּ/בֵ֥ין נֶ֨גַע֙ לָ/נֶ֔גַע דִּבְרֵ֥י רִיבֹ֖ת בִּ/שְׁעָרֶ֑י/ךָ וְ/קַמְתָּ֣ וְ/עָלִ֔יתָ אֶל הַ/מָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/008.yaml
  text: If a matter for judgment is too difficult for you—between bloodshed and bloodshed[a], between one legal claim and another, and between one injury and another[d][c][b], matters of dispute within your gates—then you shall arise and go up to the place that Yahweh your God will choose.
translation:
  language: tl
  text: Kung may kasong napakahirap para sa iyo na hatulan—tungkol man ito sa pagkakaiba ng mga kasong may kinalaman sa pagdanak ng dugo[a], sa mga usaping legal[b], o sa mga pinsala[c]—mga usaping pinagtatalunan sa iyong mga pintuang-bayan[d], tumindig ka at umahon patungo sa lugar na pipiliin ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa pagitan ng dugo at dugo.” Tumutukoy ito sa pagkilala sa pagkakaiba ng mga kasong may kinalaman sa pagdanak ng dugo, malamang kabilang ang pagpatay o pananagutan sa dugo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa pagitan ng isang kaso o paghahabol na legal at iba pa.”
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Hebreo ay maaari ring tumukoy sa isang karamdaman, salot, o iba pang kapinsalaan.
    reason: lexical_alternative
  - marker: d
    text: Ang mga pintuang-bayan ay karaniwang pinagdarausan ng paghatol at iba pang gawaing pampamayanan sa sinaunang Israel; kaya tumutukoy ito sa mga lokal na hukuman.
    reason: cultural_note
lexical_decisions:
- source_word: יִפָּלֵא
  choice: napakahirap mong hatulan
  rationale: Sa kontekstong panghukuman, ipinahihiwatig ng Niphal na ang kaso ay lampas sa kakayahan ng lokal na hukom na pagpasyahan. Likas sa Filipino ang pariralang ito at inuugnay nito ang hirap sa paghatol.
- source_word: דָבָר לַמִּשְׁפָּט
  choice: usaping ... hatulan
  rationale: Ang דָבָר ay isang malawak na salitang tumutukoy sa usapin o kaso, at ang לַמִּשְׁפָּט ay nagbibigay rito ng malinaw na kontekstong panghukuman.
- source_word: בֵּין דָּם לְדָם
  choice: tungkol sa isang pagdanak ng dugo at sa iba pa
  rationale: Pinananatili ng 'pagdanak ng dugo' ang kongkretong larawan ng Hebreong 'dugo sa dugo' habang ipinauunawa na inihahambing ang magkakaibang kasong may kinalaman sa pagpatay o pananagutan sa dugo.
- source_word: בֵּין דִּין לְדִין
  choice: sa isang usaping legal at sa iba pa
  rationale: Maaaring tumukoy ang דִּין sa usapin, paghahabol, o kaso. Ang 'usaping legal' ay natural at hindi labis na nililimitahan ang kahulugan.
- source_word: וּבֵין נֶגַע לָנֶגַע
  choice: sa isang pinsala at sa iba pa
  rationale: Malawak ang נֶגַע at maaaring mangahulugang pinsala, salot, o karamdaman. Ang 'pinsala' ang pinakamalinaw sa kontekstong panghukuman, samantalang itinatala sa talababa ang ibang posibilidad.
- source_word: דִּבְרֵי רִיבֹת
  choice: mga usaping pinagtatalunan
  rationale: Natural nitong ipinahahayag ang mga kasong may pagtatalo nang hindi dinaragdagan ang antas ng legal na espesipikasyon.
- source_word: בִּשְׁעָרֶיךָ
  choice: sa mga pintuang-bayan ninyo
  rationale: Pinananatili nito ang salitang 'mga pintuan' at nililinaw sa tambalang 'pintuang-bayan' ang sinaunang kontekstong panlungsod at panghukuman.
- source_word: וְקַמְתָּ וְעָלִיתָ
  choice: bumangon ka at pumunta
  rationale: Ang 'bumangon ka' ay nagpapanatili sa unang pandiwa. Ginamit ang natural na 'pumunta' para sa paglalakbay patungo sa sentrong lugar; ang aspektong pag-akyat ay hindi kailangang idiin sa Filipino rito.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: lugar na pipiliin
  rationale: Pinananatili ng panghinaharap na 'pipiliin' ang inaabangang pagtatalaga ni Yahweh sa lugar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong 'Yahweh' ang personal na banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalapat ng mga kategoryang panghukuman
  choice: Pinanatiling magkakahiwalay at bahagyang malawak ang 'pagdanak ng dugo,' 'usaping legal,' at 'pinsala.'
  alternative: Tukuyin ang mga ito bilang pagpatay, hatol, at sakit o salot.
  rationale: May leksikal na lawak at tunay na kalabuan ang tatlong Hebreong parirala. Hindi dapat ipako ang mga ito sa iisang uri ng kaso kung hindi iyon tiyak sa teksto.
- issue: Pagbibigay ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh nang hindi pinapalitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang 'ka' para sa hukom o kinatawang tuwirang kinakausap, ngunit ang maramihang 'ninyo' sa 'mga pintuang-bayan ninyo' upang maipakita ang kolektibong hulapi sa Hebreo. Iniwasan ang masyadong teknikal na wikang legal, habang pinanatili ang pormal na himig at ang kalabuan ng mga kategorya ng kaso.
