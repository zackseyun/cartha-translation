  to: Kung may kasong napakahirap para sa iyo na hatulan—tungkol man ito sa pagkakaiba ng mga kasong may kinalaman sa pagdanak ng dugo[a], sa mga usaping legal[b], o sa mga pinsala[c]—mga usaping pinagtatalunan sa iyong mga pintuang-bayan[d], tumindig ka at umahon patungo sa lugar na pipiliin ni Yahweh na iyong Diyos.
