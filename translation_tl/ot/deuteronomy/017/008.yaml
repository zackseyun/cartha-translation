    issue: Hindi naisasalin sa katawan ng teksto ang “go up” (וְעָלִיתָ).
    rationale: Ang “pumunta” ay nagsasalin ng paglalakbay ngunit iniiwan ang direksiyong pag-ahon na tahasang nasa Hebreo.
  - severity: low
    issue: Hindi magkatugma ang isahang “ka/iyong” at maramihang “ninyo.”
    rationale: Isahan ang anyo ng kausap sa Hebreo at sa mga pandiwang Filipino sa talata; mas malinaw na panatilihin ang “iyong.”},{
  - severity: low
    issue: Medyo pilit ang “isang ... at sa iba pa” sa tatlong magkakatulad na parirala.
    rationale: Ang pagbanggit sa “pagkakaiba ng mga kaso” ay mas idiomatiko at naihahatid pa rin ang tungkuling magtangi sa mga uri ng kaso.
