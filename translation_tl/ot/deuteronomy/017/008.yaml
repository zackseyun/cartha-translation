  source_fidelity: Tumpak sa kabuuan ang mga pangunahing kategoryang panghukuman at ang panghinaharap na pagpili ni Yahweh. Gayunman, mas mabuting ipakita ang tahasang direksiyong “umahon/go up” ng וְעָלִיתָ at panatilihing magkakatugma ang isahang kausap sa buong talata.
  naturalness: May bahagyang kabigatan at hindi natural na paralelismo ang “sa isang ... at sa iba pa.” Ang binagong pananalita ay mas likas sa makabagong Filipino habang pinananatili ang magkakaibang uri ng pinagtatalunang kaso.
  terminology: Ang “Yahweh,” “usaping legal,” “pinsala,” at “pintuang-bayan” ay angkop. Ang “pagdanak ng dugo” ay maingat na salin para sa idyomang Hebreo; nililinaw ng talababa ang saklaw na maaaring kabilang ang pagpatay o pananagutan sa dugo.
  issues:
