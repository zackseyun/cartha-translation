  naturalness: Natural ang rehistro ng draft, ngunit mas malinaw at idiomatiko ang "araw-araw sa buong buhay niya" para sa patuloy na pagbasa. Ang "Mananatili itong kasama niya" ay payak at tapat sa patuloy na pagkakaroon ng kopya ng kautusan.
  terminology: Wasto ang "Yahweh," "Diyos," "kautusan," at "mga tuntunin." Ang "matakot" ay angkop para sa ירא; dapat idikit ang talababa sa salitang ito, hindi sa "Diyos."
