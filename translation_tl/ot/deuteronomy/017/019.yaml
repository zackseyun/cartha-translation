revisions:
- from: Mananatili iyon sa piling niya, at babasahin niya iyon sa buong buhay niya, upang matuto siyang matakot kay Yahweh na kanyang Diyos[a] at maingat na sundin at isagawa ang lahat ng salita ng kautusang ito at ang mga tuntuning ito.
  to: Mananatili itong kasama niya, at babasahin niya ito araw-araw sa buong buhay niya, upang matuto siyang matakot[a] kay Yahweh na kanyang Diyos at sundin ang lahat ng salita ng kautusang ito at ang mga tuntuning ito, at isagawa ang mga ito.
  rationale: Inalis ang hindi kinakailangang dagdag na "maingat," ibinalik ang diin sa araw-araw na pagbasa sa buong buhay, at inayos ang pananda ng talababa. Pinanatili ang dalawang magkaugnay na kilos ng Hebreo—pagsunod/pagtupad at pagsasagawa—nang hindi nagpapataw ng paliwanag na doktrinal.
