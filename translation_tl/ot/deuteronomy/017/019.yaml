base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/019.yaml
  text: And it shall be with him[a], and he shall read in it all the days of his life, so that he may learn to fear Yahweh his God, to keep all the words of this law and these statutes[c][b], to do them.
translation:
  language: tl
  text: Mananatili itong kasama niya, at babasahin niya ito araw-araw sa buong buhay niya, upang matuto siyang matakot[a] kay Yahweh na kanyang Diyos at sundin ang lahat ng salita ng kautusang ito at ang mga tuntuning ito, at isagawa ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “matakot” dito ay maaari ring ipakahulugang “magpitagan.” Saklaw ng salitang Hebreo ang takot, pagpipitagan, at masunuring pagkilala sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה עִמּוֹ
  choice: Mananatili iyon sa piling niya
  rationale: Tumutukoy ang pambabaeng anyo sa kopya ng kautusan sa naunang talata. Ipinahahayag ng “mananatili ... sa piling niya” ang patuloy na pag-iingat at pagkakaroon nito nang hindi tunog-salin.
- source_word: וְקָרָא בוֹ
  choice: at babasahin niya iyon
  rationale: Ang בּוֹ ay literal na “sa loob nito,” ngunit sa natural na Tagalog, ang pagbasa sa nakasulat na kopya ay malinaw na naipahahayag ng “babasahin niya iyon.”
- source_word: כָּל יְמֵי חַיָּיו
  choice: sa buong buhay niya
  rationale: Natural at ganap na katumbas sa Tagalog ng Hebreong idyoma para sa habambuhay na tagal.
- source_word: לְמַעַן יִלְמַד
  choice: upang matuto siya
  rationale: Pinananatili ang malinaw na layuning ipinahahayag ng לְמַעַן.
- source_word: לְיִרְאָה אֶת יְהוָה אֱלֹהָיו
  choice: matakot kay Yahweh na kanyang Diyos
  rationale: Pinananatili ng “matakot” ang saklaw ng ירא—takot, pagpipitagan, at masunuring pagkilala—nang hindi ito pinaliliit sa paggalang lamang. Isinalin ang banal na pangalan bilang Yahweh.
- source_word: לִשְׁמֹר
  choice: maingat na sundin
  rationale: Sa kontekstong tipan at legal, ang שׁמר ay hindi lamang pag-iingat kundi masusing pagtupad; natural itong naipahahayag sa modernong Tagalog bilang “maingat na sundin.”
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: lahat ng salita ng kautusang ito
  rationale: Ang “kautusan” ay malinaw sa pangkalahatang mambabasa at ang “lahat ng salita” ay nagpapanatili sa pormal na anyo at kabuuang diin ng Hebreo.
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: ang mga tuntuning ito
  rationale: Ang “mga tuntunin” ay kasalukuyan, dignidad, at madaling maunawaang katumbas ng legal na חֻקִּים.
- source_word: לַעֲשֹׂתָם
  choice: at isagawa
  rationale: Ipinakikita ng “isagawa” ang kongkretong paggawa o pagtupad sa mga utos at pinananatiling hiwalay ang diwa nito sa naunang שׁמר.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalang pantangi ang Tetragrammaton sa teksto; pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon.”
- issue: Saklaw ng ירא sa konteksto ng tipan
  choice: matakot
  alternative: magpitagan
  rationale: Pinananatili ng “matakot” ang tunay na tensiyon ng takot, pagpipitagan, at masunuring pagpapasakop; hindi ito tahimik na nilulutas bilang paggalang lamang.
translation_notes:
  register: Modernong Filipino Tagalog na dignidad ngunit madaling maunawaan. Ginamit ang “sa piling niya” sa halip na mas literal ngunit alanganing “kasama niya,” at “maingat na sundin at isagawa” upang natural na maipakita ang dalawang magkaugnay ngunit magkahiwalay na pandiwang Hebreo.
