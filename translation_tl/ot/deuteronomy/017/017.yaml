  text: And he shall not multiply wives for himself[a], lest his heart turn away; and he shall not greatly multiply silver and gold for himself.
translation:
  language: tl
  text: Huwag siyang magparami ng mga asawa para sa sarili niya, upang hindi lumihis ang puso niya;[a] at huwag siyang magparami nang labis ng pilak at ginto para sa sarili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at huwag lumihis ang puso niya.” Maaaring basahin ang Hebreo bilang isa pang kaagapay na pagbabawal, sa halip na bilang tahasang sugnay na nagsasaad ng layunin o bunga.
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְבֶּה
  choice: magparami
  rationale: Pinananatili ng “magparami” ang sanhi at paulit-ulit na anyo ng Hiphil ng רבה sa dalawang pagbabawal, habang ipinahihiwatig ang labis na pag-iipon.
- source_word: נָשִׁים
  choice: mga asawa
  rationale: Sa konteksto ng mga tuntunin para sa hari, tumutukoy ito sa mga asawang babae, hindi sa kababaihan sa pangkalahatan.
- source_word: יָסוּר
  choice: malihis
  rationale: Natural sa modernong Tagalog ang “malihis ang puso” at pinananatili nito ang larawan ng pagtalikod o paglihis nang hindi nagdaragdag ng hindi tahasang layon.
- source_word: לְבָבוֹ
  choice: puso niya
  rationale: Pinananatili ang biblikal na katawagan para sa kalooban, pag-iisip, at damdamin ng tao.
- source_word: כֶּסֶף וְזָהָב
  choice: pilak at ginto
  rationale: Tuwirang isinasalin ang kongkretong magkaparis na katawagan at pinananatili ang estilong Hebreo.
- source_word: מְאֹד
  choice: nang labis
  rationale: Malinaw na ipinapahayag ang matinding antas at ang diwa ng sobrang pag-iipon.
- source_word: וְלֹא ... וְלֹא ... לֹא
  choice: Huwag ... upang hindi ... at huwag
  rationale: Ang “huwag” ay natural at marangal na anyo ng legal na pagbabawal sa Tagalog; ang gitnang sugnay ay inilalahad bilang layunin o ibinababalaang bunga.
theological_decisions:
- issue: Ugnayan ng pagpaparami ng mga asawa at paglihis ng puso
  choice: 'Isinalin ang gitnang sugnay bilang layunin o ibinababalaang bunga: “upang hindi malihis ang puso niya.”'
  alternative: “at huwag malihis ang puso niya” bilang hiwalay ngunit kaugnay na pagbabawal
  rationale: Maaaring unawain ang sintaks sa alinmang paraan. Ang pangunahing salin ay sumusunod sa natural na daloy bilang babala sa bunga ng pagpaparami ng mga asawa, habang inilalagay sa talababa ang tunay na alternatibong pagbasa at hindi nagdaragdag ng layon gaya ng “mula sa PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “siya/niya” kaysa mas arkaikong “kaniya,” at pinanatili ang pag-uulit ng “magparami” upang makita ang paralelismo ng talata.
