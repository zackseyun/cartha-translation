base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/006.yaml
  text: On the testimony of two witnesses or three witnesses[a], the one to die shall be put to death[b]; he shall not be put to death on the testimony of one witness.
translation:
  language: tl
  text: Sa patotoo ng dalawang saksi o tatlong saksi[a], papatayin ang taong dapat mamatay[b]. Hindi siya papatayin sa patotoo ng iisang saksi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa bibig ng dalawang saksi o ng tatlong saksi.” Ang idyomang Hebreo ay tumutukoy sa legal na patotoo o ebidensiya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “ang taong nakatakdang mamatay”; ibig sabihin, ang taong mananagot sa parusang kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: sa patotoo ng
  rationale: Ang literal na “sa bibig ng” ay idyomang Hebreo para sa legal na patotoo o ebidensiya. Likas at malinaw sa makabagong Filipino ang “sa patotoo ng” habang pinananatili ang diwang panghukuman.
- source_word: שְׁנַיִם עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: dalawang saksi o ng tatlong saksi
  rationale: Inuulit ng Hebreo ang “mga saksi” sa bawat bilang. Pinanatili ang pag-uulit upang maipakita ang pormal at legal na estilo ng talata.
- source_word: יוּמַת
  choice: papatayin
  rationale: Ang Hoph‘al ng מות ay pasibo/kausatibo at tumutukoy sa pagpapataw ng kamatayan, hindi lamang sa pagkamatay. Sa konteksto, ang “papatayin” ay tuwiran at natural na pahayag ng pagbitay ayon sa hatol.
- source_word: הַמֵּת
  choice: ang taong dapat mamatay
  rationale: Ang anyong participle na may pantukoy ay maigsi at eliptikal. Ang salin ay tumutukoy sa taong mananagot sa parusang kamatayan nang hindi siya tinatawag na patay na o labis na inuunahan ang pinal na hatol.
- source_word: לֹא יוּמַת
  choice: Hindi siya papatayin
  rationale: Inuulit nito ang parehong pandiwa bilang legal na pagbabawal. Malinaw sa Filipino ang “hindi ... papatayin” at pinananatili nito ang paralelismo sa naunang sugnay.
- source_word: עֵד אֶחָד
  choice: iisang saksi
  rationale: Ang “iisang saksi” ay natural na Filipino at binibigyang-diin na hindi sapat ang patotoo ng isang tao lamang.
theological_decisions:
- issue: Ang tinutukoy at puwersa ng הַמֵּת sa batas tungkol sa parusang kamatayan
  choice: Tumutukoy ito sa taong dapat mamatay, ibig sabihin, sa taong mananagot sa parusang kamatayan.
  alternative: “ang hinatulang tao” o “ang taong patay”
  rationale: Itinatakda ng talata ang kailangang patotoo bago ipataw ang parusang kamatayan. Hindi akma sa konteksto ang “taong patay,” samantalang ang “hinatulang tao” ay mas tahasang nag-aakalang naibigay na ang hatol kaysa sa eliptikal na pananalita ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may pormal na tonong pambatas. Pinanatili ang pag-uulit ng “saksi” at ang bahagyang eliptikal na diwa ng הַמֵּת, habang iniwasan ang salitang “eksekusyon” na mas teknikal at hindi gaanong likas sa karaniwang pagbasa.
