  text: And all the people shall hear and fear[a], and shall not act presumptuously again.
translation:
  language: tl
  text: At maririnig ng buong bayan, at matatakot sila, at hindi na sila kikilos nang may kapangahasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi na sila mangangahas pa” o “hindi na sila kikilos nang may pagmamataas.” Ang pandiwang Hebreo ay nagpapahiwatig ng kusang-loob, palalo, at mapanghamong pagsuway.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָעָם
  choice: At ... ng buong bayan
  rationale: Tuwirang pinananatili ang pang-ugnay at ang diwa ng ‘buong bayan,’ nang hindi idinaragdag ang ‘Israel,’ na wala rito sa Hebreo.
- source_word: יִשְׁמְעוּ
  choice: maririnig ito
  rationale: Ang pandiwang שמע ay pangunahing nangangahulugang ‘marinig.’ Idinagdag ang likas na Tagalog na layong ‘ito’ upang tukuyin ang naunang hatol o pangyayari, nang hindi nililimitahan ang kahulugan.
- source_word: וְיִרָאוּ
  choice: at matatakot sila
  rationale: Pinananatili ang payak na diwa ng ירא at hindi tinutukoy kung ang kinatatakutan ay ang Diyos, ang parusa, o kapuwa.
- source_word: וְלֹא יְזִידוּן
  choice: at hindi ... kikilos nang may kapangahasan
  rationale: Ipinahahayag ng Hiphil ng זיד ang kusang-loob, palalo, at mapanghamong pagkilos; mas angkop ang ‘kikilos nang may kapangahasan’ kaysa sa paglalarawan lamang ng panloob na pagmamataas.
- source_word: עוֹד
  choice: na ... muling
  rationale: Ipinakikita ang pagtigil sa ganitong kilos sa hinaharap; natural sa modernong Tagalog ang ‘hindi na ... muling.’
theological_decisions:
- issue: Uri o pinagmumulan ng takot na bunga ng hatol
  choice: matatakot sila, nang walang tahasang layon
  alternative: matatakot sila sa PANGINOON; matatakot sila sa parusa
  rationale: Walang tahasang layon ang pandiwang Hebreo. Pinananatili ng salin ang posibilidad na tumukoy ito sa Diyos, sa kaparusahan, o sa kapuwa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘bayan’ para sa kolektibong הָעָם at ang natural na ayos na ‘maririnig ito ng buong bayan.’
