  source_fidelity: Ang salin ay wastong naghahatid ng saklaw na “buong bayan,” ng walang-tahasang layon na takot, at ng kusang-loob at mapagmataas na pagsuway sa huling sugnay. Gayunman, ang “ito” pagkatapos ng “maririnig” ay isang idinagdag na layon na wala sa Hebreo; bagaman mahihinuha ito sa konteksto, hindi ito kailangan sa Tagalog at mas mabuting huwag idagdag.
  naturalness: Marangal at malinaw ang rehistro. Mas matipid at mas natural ang “hindi na sila kikilos” kaysa “hindi na sila muling kikilos,” sapagkat ang “hindi na” ay sapat nang nagsasaad ng עוֹד sa kontekstong ito.
  terminology: Ang “bayan,” “matatakot,” at “kikilos nang may kapangahasan” ay katanggap-tanggap na modernong Filipino para sa הָעָם, ירא, at הזיד. Pinananatili ng “matatakot sila” ang hindi pagtukoy sa layon ng takot.
