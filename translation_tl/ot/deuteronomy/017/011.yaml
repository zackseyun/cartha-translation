base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/011.yaml
  text: According to the instruction that they give you[a], and according to the judgment that they tell you, you shall do; you shall not turn aside from the word that they declare to you[b], to the right or to the left.
translation:
  language: tl
  text: Sundin mo ang tagubiling ibibigay nila sa iyo[a] at ang hatol na sasabihin nila sa iyo. Huwag kang lilihis sa salitang ipahahayag nila sa iyo[b], sa kanan man o sa kaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “kautusan” o “turo” para sa “tagubilin” (Hebreo: torah).'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “usapin” o “pasiya” para sa “salita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: Sundin
  rationale: Sa legal na kontekstong ito, ang idyoma ay nagpapahayag ng pagkilos ayon sa sinabi; natural na naihahatid ng “Sundin” ang ipinag-uutos na pagtalima.
- source_word: הַתּוֹרָה אֲשֶׁר יוֹרוּךָ
  choice: ang tagubiling ibibigay nila sa iyo
  rationale: Ang torah ay maaaring tumukoy sa kautusan, turo, o tagubilin. Ang “tagubilin” ay angkop sa pasiyang ibinibigay ng mga saserdote at hukom sa kasong tinatalakay, nang hindi ito nililimitahan sa nakasulat na batas.
- source_word: הַמִּשְׁפָּט
  choice: ang hatol
  rationale: Tumutukoy ito sa pasiya o legal na hatol sa usaping iniharap; malinaw at pormal ang “hatol” sa modernong Filipino.
- source_word: תַּעֲשֶׂה
  choice: Sundin mo
  rationale: Ang anyong pandiwa ay may puwersa ng obligasyon. Isinama ito sa unang sugnay upang maging natural sa Filipino at mapanatili ang utos.
- source_word: לֹא תָסוּר
  choice: Huwag kang lilihis
  rationale: Pinananatili nito ang larawang hindi paglihis at maayos na kaugnay ng kasunod na “kanan” at “kaliwa.”
- source_word: הַדָּבָר אֲשֶׁר יַגִּידוּ לְךָ
  choice: sa salitang ipahahayag nila sa iyo
  rationale: Pinananatili ng “salita” ang malawak na kahulugan ng dabar, habang ang “ipahahayag” ay umaangkop sa pormal na pagpapabatid ng isang pasiya.
- source_word: יָמִין וּשְׂמֹאל
  choice: maging sa kanan o sa kaliwa
  rationale: Pinananatili ang Hebreong metapora ng paglihis sa alinmang direksiyon; ang “maging” ay likas na nagdudugtong nito sa Filipino.
theological_decisions:
- issue: Saklaw ng pagtalima sa awtoridad ng mga saserdote at hukom
  choice: Inilahad bilang utos na sundin ang tagubilin at hatol na ibinigay sa kasong tinatalakay.
  alternative: Basahin bilang pahayag ng walang-hangganan o likas na di-nagkakamaling awtoridad ng mga institusyon sa ibang panahon.
  rationale: Ang konteksto ay ang prosesong panghukuman ng Israel sa tipan. Pinananatili ng salin ang bigat ng utos nang hindi nagdaragdag ng mas malawak na doktrinang hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Ginamit ang isahang “mo/iyo” ayon sa Hebreo. Ang legal na himig ay pinanatili sa “hatol” at “ipahahayag,” ngunit iniwasan ang labis na teknikal o makalumang pananalita.
