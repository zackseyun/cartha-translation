base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/005.yaml
  text: then you shall bring out to your gates that man or that woman who did this evil thing[a], that man or that woman, and you shall stone them with stones[b], and they shall die.
translation:
  language: tl
  text: Pagkatapos ay ilabas mo sa iyong mga pintuang-bayan[a] ang lalaking iyon o ang babaeng iyon na gumawa ng masamang bagay na ito[b]—ang lalaki o ang babae—at batuhin mo sila ng mga bato, at mamamatay sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga pintuang-bayan” ay tumutukoy sa mga pasukan ng bayan, na karaniwang pampublikong lugar ng paghatol at mga paglilitis sa sinaunang Israel.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “masamang usaping ito.” Ang salitang Hebreo ay maaaring mangahulugang “bagay” o, sa kontekstong legal, “usapin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: pagkatapos ay ilabas mo
  rationale: Ang waw na kasunod ng naunang legal na tagubilin ay nagpapakita ng sunod na hakbang. Likas sa Filipino ang “pagkatapos ay,” habang pinananatili ng pautos na “ilabas mo” ang puwersa ng batas.
- source_word: הָאִישׁ הַהוּא אוֹ אֶת־הָאִשָּׁה הַהִוא
  choice: ang lalaking iyon o ang babaeng iyon
  rationale: Tumpak nitong pinananatili ang tiyak at tahasang pagtukoy ng Hebreo sa lalaki at babae.
- source_word: אֲשֶׁר עָשׂוּ
  choice: na gumawa
  rationale: Payak at natural itong salin ng sugnay na naglalarawan sa nagkasala; hindi nito dinaragdagan ang teksto ng mas espesipikong legal na pandiwa.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: masamang bagay na ito
  rationale: Pinananatili nito ang karaniwang kahulugan ng דָּבָר at ang demonstratibong diin, habang inilalagay sa talababa ang posibleng legal na kahulugang “usapin.”
- source_word: אֶל־שְׁעָרֶיךָ
  choice: sa mga pintuang-bayan mo
  rationale: Pinananatili ang pangmaramihang anyo at ang konkretong larawan ng mga pintuang-bayan, na siyang pampublikong lugar ng paghatol sa sinaunang Israel.
- source_word: וּסְקַלְתָּם בָּאֲבָנִים
  choice: at batuhin mo sila ng mga bato
  rationale: Pinananatili ang tahasang pagbanggit sa mga bato at ang legal na pautos ng Hebreo.
- source_word: וָמֵתוּ
  choice: at mamamatay sila
  rationale: Malapit itong salin ng resultang sugnay at pinananatili ang maringal at mabigat na tono nang hindi nagdaragdag ng layuning “hanggang sa.”
theological_decisions:
- issue: Tahasan at may-kasariang pormulasyon ng batas
  choice: ang lalaking iyon o ang babaeng iyon
  alternative: ang taong iyon
  rationale: Kapuwa lalaki at babae ang tahasang binabanggit ng Hebreo; hindi ito dapat gawing pangkalahatang katawagan lamang.
- issue: Lugar ng paghatol sa mga pintuang-bayan
  choice: sa mga pintuang-bayan mo
  alternative: sa pampublikong hukuman
  rationale: Pinananatili ng salin ang konkretong pananalita ng teksto. Ang makasaysayang tungkulin ng pintuang-bayan bilang lugar ng paghatol ay ipinaliliwanag sa talababa sa halip na ipalit sa mismong teksto.
- issue: Resulta ng pagbato
  choice: at mamamatay sila
  alternative: hanggang sa mamatay sila
  rationale: Ang Hebreo ay nagsasaad ng kasunod na resulta sa pamamagitan ng isang hiwalay na sugnay; hindi nito tahasang ginagamit ang pormulang nagsasaad ng hangganan o layunin.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang pag-uulit na “ang lalaki o ang babae” dahil naroon ito sa Hebreo at nagbibigay ng legal na diin. Ginamit ang “pintuang-bayan” upang maging malinaw na hindi karaniwang pinto lamang ang tinutukoy.
