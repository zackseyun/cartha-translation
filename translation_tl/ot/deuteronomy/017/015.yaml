base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/015.yaml
  text: You shall surely set over yourself a king whom Yahweh your God chooses[a]. From among your brothers you shall set a king over yourself; you may not put over yourself a foreigner[b], one who is not your brother.
translation:
  language: tl
  text: Dapat nga kayong magtalaga ng isang hari na pipiliin ni Yahweh na inyong Diyos upang mamuno sa inyo. Mula sa inyong mga kapatid[a] ay magtatalaga kayo ng hari upang mamuno sa inyo. Hindi kayo maaaring magtalaga ng isang dayuhan[b] upang mamuno sa inyo, isang taong hindi ninyo kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay wikang pampamilya para sa mga kapwa kabilang sa Israel—ibig sabihin, mga mula sa sarili ninyong bayan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na Hebreo, “isang lalaking dayuhan, isang taong hindi mo kapatid.”
    reason: alternative_reading
lexical_decisions:
- source_word: שׂוֹם תָּשִׂים
  choice: Tiyak na maglalagay kayo
  rationale: Ang infinitive absolute na kasunod ng imperfect ay nagbibigay-diin sa utos. Pinananatili ng “tiyak” ang emphatic force nang hindi nagiging di-likas sa modernong Tagalog.
- source_word: עָלֶיךָ
  choice: upang mamuno sa inyo
  rationale: Ang literal na “sa ibabaw ninyo” ay hindi likas sa Tagalog para sa pagluklok ng hari. Ipinahahayag ng pariralang ito ang relasyong pampamahalaan, habang ang “inyo” ay tumutukoy sa Israel bilang sambayanan.
- source_word: מֶלֶךְ
  choice: hari
  rationale: Tuwiran at karaniwang katumbas ng salitang Hebreo.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: haring pipiliin ni Yahweh na inyong Diyos
  rationale: Likas sa Tagalog ang aspektong prospektibo sa isang legal na tagubilin at malinaw na si Yahweh ang pipili sa hari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- source_word: מִקֶּרֶב אַחֶיךָ
  choice: Mula sa inyong mga kapatid
  rationale: Pinananatili ang tahasang wikang pampamilya ng Hebreo; nililinaw sa talababa na ang tinutukoy ay isang kababayan mula sa Israel.
- source_word: לֹא תוּכַל לָתֵת
  choice: Hindi kayo maaaring maglagay
  rationale: Bagaman literal na “hindi ninyo kayang ilagay,” ipinahahayag ng parirala sa kontekstong legal ang pagbabawal.
- source_word: אִישׁ נָכְרִי
  choice: isang dayuhan
  rationale: Natural sa modernong Tagalog at malinaw ang kaibahan nito sa isang kabilang sa bayang Israel; ipinapaliwanag sa talababa ang literal na anyong panlalaki.
- source_word: אֲשֶׁר לֹא אָחִיךָ הוּא
  choice: na hindi ninyo kapatid
  rationale: Pinananatili ang paliwanag ng teksto sa wikang pampamilya at ang kaibahan sa dayuhan.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya tinutumbasan ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Wikang pampamilya na אַחֶיךָ / אָחִיךָ
  choice: mga kapatid / kapatid
  alternative: mga kapwa Israelita / kababayan
  rationale: Pinananatili sa pangunahing teksto ang talinghagang pampamilya at nililinaw sa talababa ang pambansang saklaw nito, nang hindi binubura ang tunay na anyo ng Hebreo.
- issue: Isahang kolektibong kausap
  choice: kayo / inyong / ninyo
  alternative: ikaw / iyong / mo
  rationale: Isahan ang anyong Hebreo ngunit ang Israel bilang sambayanan ang kausap. Ginagamit ang maramihang anyo sa Tagalog upang maging malinaw at natural ang kolektibong pagtukoy, nang hindi ipinahihiwatig na isang pribadong indibidwal lamang ang inuutusan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iningatan ang pag-uulit ng utos, ang diin ng שׂוֹם תָּשִׂים, ang pangalang Yahweh, at ang wikang pampamilya. Ginawang idiomatiko ang עָלֶיךָ bilang “upang mamuno sa inyo” sa halip na literal na “sa ibabaw ninyo.”
