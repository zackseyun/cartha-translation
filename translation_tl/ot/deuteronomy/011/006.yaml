  to: at ang ginawa niya kina Datan at Abiram, mga anak ni Eliab, na anak ni Ruben—kung paanong ibinuka ng lupa ang bibig nito at nilamon sila, ang kanilang mga sambahayan[a], ang kanilang mga tolda, at ang lahat ng naroon sa kanilang paanan[b], sa gitna ng buong Israel.
