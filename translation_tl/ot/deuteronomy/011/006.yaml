base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/006.yaml
  text: and what he did to Dathan and Abiram[a], sons of Eliab son of Reuben—how the earth opened its mouth and swallowed them, their households, their tents, and every living thing at their feet[b], in the midst of all Israel.
translation:
  language: tl
  text: at ang ginawa niya kina Datan at Abiram, mga anak ni Eliab, na anak ni Ruben—kung paanong ibinuka ng lupa ang bibig nito at nilamon sila, ang kanilang mga sambahayan[a], ang kanilang mga tolda, at ang lahat ng naroon sa kanilang paanan[b], sa gitna ng buong Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “kanilang mga bahay.” Maaaring tumukoy ang Hebreo sa mismong mga tirahan nila o, sa mas malawak na diwa, sa kanilang mga sambahayan.
    reason: lexical_alternative
  - marker: b
    text: Literal na “lahat ng yĕqûm na nasa paanan nila.” Maaaring tumukoy ang pambihirang salitang Hebreo sa lahat ng kasama nila o kaakibat nila, kabilang ang mga tao, hayop, o ari-arian.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: ginawa
  rationale: Karaniwang kahulugan ng pandiwa ang “gawin”; ang anyong “ginawa” ay natural sa pagbabalik-tanaw sa pangyayari.
- source_word: בְּנֵי אֱלִיאָב בֶּן רְאוּבֵן
  choice: mga anak ni Eliab na anak ni Ruben
  rationale: Pinananatili ang tahasang pagkakasunod-sunod ng talaangkanan sa Hebreo sa halip na gawing katawagang panlipi ang “anak ni Ruben.”
- source_word: פָּצְתָה הָאָרֶץ אֶת־פִּיהָ
  choice: ibinuka ng lupa ang bibig nito
  rationale: Pinananatili ang matingkad na pagsasatao at larawan ng lupa na nagbubuka ng bibig.
- source_word: וַתִּבְלָעֵם
  choice: nilamon sila
  rationale: Tuwiran at kongkretong katumbas ng pandiwang nangangahulugang “lumamon.”
- source_word: בָּתֵּיהֶם
  choice: kanilang mga sambahayan
  rationale: Bagaman literal na “kanilang mga bahay,” maaari itong tumukoy sa mga taong bumubuo sa kanilang sambahayan; iniiwasan din nito ang pag-uulit sa kasunod na “mga tolda.”
- source_word: אָהֳלֵיהֶם
  choice: kanilang mga tolda
  rationale: Literal, malinaw, at angkop sa tagpuang nasa ilang.
- source_word: כָּל־הַיְקוּם
  choice: lahat ng nabubuhay
  rationale: Ipinahahayag ang malamang na kongkretong saklaw ng pambihirang pangngalan nang hindi ito ginagawang abstraktong “lahat ng umiiral”; ipinapaliwanag sa talababa ang mas malawak na posibilidad.
- source_word: אֲשֶׁר בְּרַגְלֵיהֶם
  choice: na nasa paanan nila
  rationale: Pinananatili ang literal at posibleng idyomatikong larawan ng Hebreo sa halip na tahasang ipakahulugang “sumunod” o “pag-aari.”
- source_word: בְּקֶרֶב כָּל־יִשְׂרָאֵל
  choice: sa gitna ng buong Israel
  rationale: Pinananatili ang pampook at pampublikong diwa ng pangyayaring naganap sa gitna ng buong bayan.
