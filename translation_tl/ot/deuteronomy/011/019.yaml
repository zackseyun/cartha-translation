base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/019.yaml
  text: You shall teach them to your children[a], speaking of them when you sit in your house, and when you walk on the road, and when you lie down, and when you rise up.
translation:
  language: tl
  text: Ituro ninyo ang mga iyon sa inyong mga anak[a] sa pamamagitan ng pag-uusap tungkol sa mga iyon kapag nakaupo kayo sa inyong bahay, kapag naglalakad kayo sa daan, kapag nahihiga kayo, at kapag bumabangon kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak na lalaki.” Gumagamit ang Hebreo ng panlalaking anyong pangmaramihan na maaari ring kumatawan sa lahat ng anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמַּדְתֶּם
  choice: Ituro ninyo
  rationale: Ang Piel ng למד ay karaniwang nangangahulugang “magturo.” Ang pangmaramihang anyo ay malinaw na ipinahahayag ng “ninyo,” at hindi idinagdag ang diwa ng “masikap,” na kaugnay ng ibang pandiwa sa Deuteronomio 6:7.
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Pinananatili ang pangmaramihang panghalip na tumutukoy sa naunang mga salita o utos, nang hindi inuulit o labis na nililinaw ang antecedent.
- source_word: אֶת־בְּנֵיכֶם
  choice: sa inyong mga anak
  rationale: Maaaring mangahulugan ang בנים ng “mga anak na lalaki” o, bilang pangkalahatang katawagan, “mga anak.” Sa konteksto ng pagtuturo sa salinlahi, natural at tumpak ang inklusibong “mga anak.”
- source_word: לְדַבֵּר בָּם
  choice: at banggitin ang mga iyon
  rationale: Ipinahahayag nito ang pagsasalita tungkol sa mga salita o utos bilang kasabay na paraan ng pagtuturo. Ang “banggitin” ay natural sa Filipino at hindi nakalilitong kasinliteral ng “magsalita sa mga iyon.”
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: kapag nakaupo kayo sa inyong bahay
  rationale: 'Ang ב na kasama ng infinitive construct ay nagsasaad ng panahong kalagayan: “kapag nakaupo.” Pinananatili rin ang tahasang lokasyon na “sa inyong bahay.”'
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: kapag naglalakad kayo sa daan
  rationale: Karaniwang kahulugan ng הלך ang paglakad o pagpunta. Ang “sa daan” ay tuwiran at likas na salin ng בַדֶּרֶךְ.
- source_word: וּבְשָׁכְבְּךָ
  choice: kapag nahihiga kayo
  rationale: Pinananatili ang literal at natural na larawan ng paghiga, sa halip na limitahan ito sa parapraseng “matutulog.”
- source_word: וּבְקוּמֶךָ
  choice: kapag bumabangon kayo
  rationale: Ang קום ay “bumangon” o “tumayo.” Dito, katambal ng paghiga, natural ang “bumabangon” at napapanatili ang ritmo ng pares.
theological_decisions:
- issue: Saklaw ng kasarian sa בְּנֵיכֶם
  choice: inyong mga anak
  alternative: inyong mga anak na lalaki
  rationale: Bagaman panlalaking pangmaramihan ang anyong Hebreo, maaari itong kumatawan sa mga supling sa pangkalahatan. Sa konteksto ng tipanang pagtuturo sa susunod na salinlahi, naihahayag ng “mga anak” ang saklaw nang hindi ipinapalagay na hindi kabilang ang mga anak na babae.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “ninyo/kayo” upang katawanin ang pangmaramihang kausap sa Hebreo. Pinanatili ang paulit-ulit na temporal na ayos ng talata, ngunit bahagyang pinagaan ang mga pang-ugnay para sa likas na daloy sa Tagalog.
