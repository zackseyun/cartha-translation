  yaml_path: translation/ot/deuteronomy/011/003.yaml
  text: and his signs and his deeds that he did in the midst of Egypt[c][b][a], to Pharaoh king of Egypt and to all his land—
translation:
  language: tl
  text: at ang kanyang mga tanda at mga gawang ginawa niya sa gitna ng Ehipto[b], sa Paraon[a], na hari ng Ehipto, at sa buong lupain niya—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “laban sa Paraon … at laban sa buong lupain niya”; literal na “sa Paraon … at sa buong lupain niya.” Ang konteksto ay tungkol sa mga gawang nakatuon sa paghatol.
    reason: lexical_alternative
  - marker: b
    text: O “sa Ehipto”; mas literal, “sa gitna ng Ehipto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתָיו
  choice: kanyang mga tanda
  rationale: Ang אוֹת ay karaniwang tumutukoy sa tanda, palatandaan, o pambihirang tanda. Pinananatili ng “mga tanda” ang lawak ng kahulugan nang hindi idinaragdag ang salitang “makahimala,” na hindi tahasang nasa Hebreo.
- source_word: מַעֲשָׂיו
  choice: mga ginawa
  rationale: Ang מַעֲשֶׂה ay isang gawa o kilos. Mas natural sa makabagong Filipino ang “mga ginawa” kaysa “mga gawa” sa pariralang ito at kaayon ito ng kasunod na pandiwang עָשָׂה.
- source_word: אֲשֶׁר עָשָׂה
  choice: '[nakapaloob sa] mga ginawa'
  rationale: Sa Filipino, ang literal na “mga ginawa na kanyang ginawa” ay mabigat at paulit-ulit. Ang diwa ng sugnay na Hebreo ay likas na naipapahayag sa “kanyang ... mga ginawa” nang walang pagkawala ng referensiya sa Diyos.
- source_word: בְּתוֹךְ מִצְרַיִם
  choice: sa gitna ng Ehipto
  rationale: Pinananatili nito ang mas tiyak na larawan ng בְּתוֹךְ, hindi lamang ang pangkalahatang “sa Ehipto.”
- source_word: לְפַרְעֹה
  choice: laban sa Paraon
  rationale: Bagaman literal na malawak ang לְ (“sa/para kay”), dito ay tumutukoy ito sa pinatutungkulan ng mga hatol ng Diyos. Ang “laban sa” ang natural at malinaw na Filipino sa konteksto.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: hari ng Ehipto
  rationale: Tuwirang salin ng construct phrase at karaniwang katawagan sa Filipino.
- source_word: וּלְכָל אַרְצוֹ
  choice: at sa buo niyang lupain
  rationale: Ang אֶרֶץ ay “lupain” o “bansa.” Pinananatili ng “buo niyang lupain” ang kabuuang saklaw ng כָּל at ang panlaping paari.
- source_word: וְאֶת ... וְאֶת
  choice: at ... at
  rationale: Hindi isinasalin nang hiwalay ang object marker na אֵת, ngunit pinananatili ang koordinasyon sa naunang pangungusap sa pamamagitan ng “at.”
theological_decisions:
- issue: Direksiyon ng mga ginawa ng Diyos kaugnay ng Paraon at ng kanyang lupain
  choice: laban sa Paraon ... at sa buo niyang lupain
  alternative: sa Paraon ... at sa buo niyang lupain
  rationale: Ang pang-ukol na לְ ay mas malawak kaysa “laban sa,” ngunit ang konteksto ng mga tanda at hatol sa Ehipto ay nagpapakitang ang mga ito ay nakatuon laban sa Paraon at sa kanyang lupain. Hindi ito pagdaragdag ng denominasyonal na pagbasa kundi paglilinaw ng relasyong hinihingi ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang dugtong na “at” at ang em dash dahil bahagi ang talata ng mas mahabang pangungusap mula sa naunang mga talata. Iniwasan ang di-natural na pag-uulit na “mga ginawa na kanyang ginawa.”
