base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/026.yaml
  text: See[a], today I am setting before you a blessing and a curse.
translation:
  language: tl
  text: Tingnan mo[a], inilalagay ko sa harap ninyo ngayon ang isang pagpapala at isang sumpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nasa isahan ang pautos sa Hebreo, ngunit maramihan ang “ninyo” sa kasunod na parirala. Kinakausap ang Israel kapwa bilang isang kabuuan at bilang maraming tagapakinig.
    reason: source_number_shift
lexical_decisions:
- source_word: רְאֵה
  choice: Tingnan mo
  rationale: Isang pautos na nasa isahan at ginagamit upang ituon ang pansin ng Israel bilang isang kabuuan. Natural ito sa makabagong Filipino at hindi kasing-arkaismo ng “Masdan mo.”
- source_word: אָנֹכִי
  choice: ko
  rationale: Malinaw na ipinahahayag ng panghalip na nakalakip sa pandiwa ang unang panauhan. Hindi idinagdag ang “ako mismo,” sapagkat maaari nitong palabisin ang diin.
- source_word: נֹתֵן
  choice: inilalagay
  rationale: Maaaring mangahulugang “nagbibigay” o “naglalagay” ang נתן. Kasama ng “sa harap ninyo,” pinakamalinaw at pinakanatural ang “inilalagay,” na nagpapakitang inihaharap ang dalawang pagpipilian.
- source_word: לִפְנֵיכֶם
  choice: sa harap ninyo
  rationale: Natural na katumbas ng idyomang tumutukoy sa paglalantad o paghaharap ng isang bagay sa mga tagapakinig; pinananatili rin nito ang maramihang bilang.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Karaniwang makabagong salin ng temporal na “sa araw na ito/today” sa ganitong pahayag.
- source_word: בְּרָכָה
  choice: isang pagpapala
  rationale: Ipinakikita ng “isang” ang unang bahagi ng magkatambal na alternatibo nang natural sa Filipino.
- source_word: וּקְלָלָה
  choice: at isang sumpa
  rationale: Pinananatili ang tuwirang pagsalungat sa “isang pagpapala” at ang magkatulad na kayarian ng dalawang alternatibo.
theological_decisions:
- issue: Kalikasan ng pagpapala at sumpa
  choice: Iniharap ang mga ito bilang dalawang alternatibo sa konteksto ng tipan, nang walang dagdag na paliwanag na doktrinal.
  alternative: Ipaliwanag ang mga ito bilang pangkalahatang simulain ng gantimpala at kaparusahan.
  rationale: Ipinapakilala ng talata ang pagpapala at sumpa sa konteksto ng tipan sa Deuteronomio. Dapat panatilihin ng salin ang payak na paghaharap ng mga ito nang hindi nagpapasok ng interpretasyong wala sa mismong talata.
- issue: Paglipat mula isahan tungo sa maramihan
  choice: Pinanatili ang “mo” sa pautos at “ninyo” sa kasunod na parirala.
  alternative: Gawing maramihan ang dalawang panghalip para maging mas makinis sa Filipino.
  rationale: Sadyang nasa isahan ang רְאֵה, samantalang maramihan ang hulapi sa לִפְנֵיכֶם. Ang pagpapanatili sa paglipat ng bilang ay kumakatawan sa Israel bilang isang kabuuan at bilang maraming tagapakinig, nang hindi pinapantay ang tunay na anyo ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Tingnan mo” sa halip na arkaikong “Masdan mo,” at pinanatili ang kapansin-pansing paglipat ng Hebreo mula isahan tungo sa maramihan.
