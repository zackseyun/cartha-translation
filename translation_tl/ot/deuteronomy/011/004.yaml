  text: וַ/אֲשֶׁ֣ר עָשָׂה֩ לְ/חֵ֨יל מִצְרַ֜יִם לְ/סוּסָ֣י/ו וּ/לְ/רִכְבּ֗/וֹ אֲשֶׁ֨ר הֵצִ֜יף אֶת מֵ֤י יַם סוּף֙ עַל פְּנֵי/הֶ֔ם בְּ/רָדְפָ֖/ם אַחֲרֵי/כֶ֑ם וַ/יְאַבְּדֵ֣/ם יְהוָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/004.yaml
  text: and what he did to the army of Egypt[a], to its horses and its chariots, when he made the waters of the Red Sea overflow over them as they pursued you, and Yahweh destroyed them to this day,
translation:
  language: tl
  text: at ang ginawa niya sa hukbo ng Ehipto—sa mga kabayo nito at mga karwahe nito—nang pinaapaw niya sa ibabaw nila ang tubig ng Dagat na Pula[a] habang hinahabol nila kayo, at nilipol sila ni Yahweh hanggang sa araw na ito,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Dagat ng mga Tambo.” Nakaugaliang isalin na “Dagat na Pula.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל
  choice: hukbo
  rationale: Sa kontekstong militar, kasama ang mga kabayo at karwahe ng Ehipto, ang salita ay tumutukoy sa hukbo o puwersang militar.
- source_word: לְסוּסָיו וּלְרִכְבּוֹ
  choice: sa mga kabayo at mga karwahe nito
  rationale: Ang mga hulapi ay tumutukoy sa Ehipto bilang isang bansa; natural sa modernong Tagalog ang panghalip na “nito.” Ang “mga karwahe” ay malinaw na tumutukoy sa mga sasakyang pandigma.
- source_word: הֵצִיף
  choice: pinaapaw niya sa kanila
  rationale: 'Pinananatili ng “pinaapaw” ang sanhiang anyo ng pandiwa: pinangyari ng Diyos na umapaw at lumukob sa kanila ang tubig.'
- source_word: מֵי יַם סוּף
  choice: tubig ng Dagat na Pula
  rationale: Ang “Dagat na Pula” ang nakaugaliang pangalang heograpiko sa Tagalog, habang inilalahad sa talababa ang mas literal na “Dagat ng mga Tambo.”
- source_word: עַל־פְּנֵיהֶם
  choice: sa kanila
  rationale: Sa konteksto, ipinahihiwatig ng parirala na umapaw ang tubig sa ibabaw ng mga Ehipsiyo; ang “sa kanila” ay natural kasunod ng “pinaapaw” at hindi pinipilit ang literal na idyomang “sa kanilang mga mukha.”
- source_word: בְּרָדְפָם אַחֲרֵיכֶם
  choice: habang hinahabol nila kayo
  rationale: Ipinapakita ng “habang” na kasabay ng paghabol ang pag-apaw ng tubig, ayon sa panahunang diwa ng pariralang Hebreo.
- source_word: וַיְאַבְּדֵם
  choice: nilipol sila
  rationale: Malinaw na ipinahahayag ng “nilipol” ang sanhiang diwa ng pagdadala sa pagkawasak o pagkapahamak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Pinananatili nito ang karaniwang idyomang Hebreo at ang diin sa namamalaging bunga ng paglipol hanggang sa panahon ng nagsasalita.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Pagsasalin sa יַם סוּף
  choice: Dagat na Pula sa pangunahing teksto
  alternative: Dagat ng mga Tambo
  rationale: Pinananatili sa teksto ang nakaugaliang pangalang heograpiko, ngunit inilalagay sa talababa ang literal na kaugnayan ng סוּף sa mga tambo upang maging lantad ang tunay na leksikal na usapin.
- issue: Saklaw ng pariralang “hanggang sa araw na ito”
  choice: Iniugnay sa paglipol nang hindi nililinaw pa ang eksaktong lohikal na ugnayan
  alternative: Ipaliwanag bilang namamalaging bunga ng paglipol
  rationale: Tuwirang inuugnay ng Hebreo ang parirala sa pandiwang “nilipol.” Pinananatili ng salin ang bahagyang tensiyon ng pananalita sa halip na magdagdag ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang anyong bahagi ng mas mahabang pangungusap sa konteksto sa pamamagitan ng panimulang “at” at pangwakas na kuwit. Ginamit ang gitling na em dash upang malinaw na ilahad ang mga kabayo at karwahe bilang kaugnay ng hukbo ng Ehipto.
