id: DEU.11.31
reference: Deuteronomy 11:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֤י אַתֶּם֙ עֹבְרִ֣ים אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם נֹתֵ֣ן לָ/כֶ֑ם וִֽ/ירִשְׁתֶּ֥ם אֹתָ֖/הּ וִֽ/ישַׁבְתֶּם בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/031.yaml
  text: For you are crossing the Jordan to go in to take possession of the land that Yahweh your God is giving you[a], and you will take possession of it and live in it.
translation:
  language: tl
  text: Sapagkat tatawid kayo sa Jordan upang pumasok at angkinin ang lupaing ibinibigay sa inyo ni Yahweh[a] na inyong Diyos. Aangkinin ninyo iyon at maninirahan kayo roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; tradisyonal na isinasalin na “ang PANGINOON.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan o batayan ng naunang tagubilin at pinananatili ang ugnayang lohikal.
- source_word: עֹבְרִים
  choice: tatawid kayo
  rationale: Ang participle ay tumutukoy sa nalalapit na pagtawid; mas natural sa Tagalog ang panghinaharap sa kontekstong ito.
- source_word: הַיַּרְדֵּן
  choice: Jordan
  rationale: Karaniwang anyo ng pangalang pantangi; malinaw sa konteksto na ilog ito kaya hindi kailangang idagdag ang salitang “Ilog.”
- source_word: לָבֹא לָרֶשֶׁת
  choice: upang pumasok at angkinin
  rationale: Pinananatili ang pagkakasunod ng pagpasok at pagkuha ng pagmamay-ari, sa natural na modernong Tagalog.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy sa lupaing ipinangako at angkop ang “lupain” kaysa sa mas pangkalahatang “lupa.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Tumpak na inilalarawan ang ikalawang panauhang maramihan at ang tipanang pananalita.
- source_word: נֹתֵן לָכֶם
  choice: ibinibigay sa inyo
  rationale: Pinananatili ang kasalukuyan o nalalapit na kilos ng participle at ang katiyakan ng kaloob ng Diyos.
- source_word: וִירִשְׁתֶּם אֹתָהּ
  choice: Aangkinin ninyo iyon
  rationale: Ipinagpapatuloy ang hinaharap na pagkakasunod ng mga pangyayari at inuulit ang parehong diwa ng ירשׁ.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: maninirahan kayo roon
  rationale: Natural at dignified na modernong Tagalog para sa paninirahan sa lupain; hindi labis na binibigyang-diin ang proseso ng pagtatalaga ng pamayanan.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Ugnayan ng kaloob ng Diyos at pag-angkin ng Israel sa lupain
  choice: “ibinibigay” at “aangkinin” kapwa pinanatili
  alternative: Pag-isahin ang mga ito bilang simpleng pagtanggap lamang
  rationale: Pinananatili ng teksto ang tensiyon sa pagitan ng lupain bilang kaloob ni Yahweh at ng aktuwal na pag-angkin dito ng Israel; hindi ito tahimik na nilulutas.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tatawid” upang likas na ipahayag ang nalalapit na kilos, “angkinin” para sa pagkuha ng pagmamay-ari, at “maninirahan” bilang kasalukuyang madaling maunawaang katumbas ng ישׁב.
