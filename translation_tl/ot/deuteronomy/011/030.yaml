base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/030.yaml
  text: Are they not beyond the Jordan[a], behind the way of the setting sun, in the land of the Canaanites who dwell in the Arabah, opposite Gilgal[c][b], beside the oaks of Moreh?
translation:
  language: tl
  text: Hindi ba nasa kabilang panig ng Jordan[a] ang mga iyon, sa likod ng daang patungo sa paglubog ng araw[b], sa lupain ng mga Cananeo na naninirahan sa Araba, sa tapat ng Gilgal, malapit sa mga puno ng ensina ng More?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kabilang panig ng Jordan.” Isang heograpikong idyoma ang Hebreong pananalita, at nakasalalay sa punto de bista ang tiyak na kahulugan nito.
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “sa likod ng daan ng pagpasok ng araw”; tumutukoy ito sa dakong kanluran.'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga puno ng terebinto ng More.” Maaaring tumukoy ang salitang Hebreo sa alinman sa dalawang uri ng malaking puno.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֵמָּה
  choice: Hindi ba ang mga iyon
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap, at malinaw na tumutukoy ang maramihang anyo sa dalawang bundok sa naunang talata.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: nasa kabila ng Jordan
  rationale: Likas na heograpikong pananalita sa Filipino na hindi labis na nagtatakda ng punto de bista.
- source_word: אַחֲרֵי דֶּרֶךְ מְבוֹא הַשֶּׁמֶשׁ
  choice: sa kabila ng daang patungo sa paglubog ng araw
  rationale: Pinananatili ang daan at ang larawan ng paglubog ng araw, pati ang bahagyang kalabuan ng אַחֲרֵי, sa halip na gawing payak na direksiyong ‘kanluran.’
- source_word: בְּאֶרֶץ הַכְּנַעֲנִי
  choice: sa lupain ng mga Cananeo
  rationale: Ang pang-isahang katawagang etniko sa Hebreo ay kolektibo; natural itong ilahad bilang maramihan sa Filipino.
- source_word: הַיֹּשֵׁב בָּעֲרָבָה
  choice: na naninirahan sa Araba
  rationale: Pinananatili ang Araba bilang pangalang heograpiko at inilalahad nang natural ang kolektibong pandiwari.
- source_word: מוּל הַגִּלְגָּל
  choice: sa tapat ng Gilgal
  rationale: Malinaw at karaniwang pananalitang Filipino para sa tuwirang ugnayang panlunan.
- source_word: אֵצֶל אֵלוֹנֵי מֹרֶה
  choice: malapit sa mga punong ensina ng More
  rationale: Ipinahahayag ng ‘malapit sa’ ang pagkalapit, samantalang ang ‘ensina’ ay isang pamilyar na salin ng אֵלוֹן; pinananatili sa talababa ang maaaring alternatibong uri ng puno.
