  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga iyon” upang malinaw na tumukoy sa dalawang bundok, at pinanatili ang matalinghagang pananalita tungkol sa paglubog ng araw sa halip na ganap itong gawing direksiyong kardinal.
