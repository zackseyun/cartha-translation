base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/025.yaml
  text: No man will stand before you[a]. Yahweh your God will put the fear and dread of you on the face of all the land on which you tread[b], just as he spoke to you.
translation:
  language: tl
  text: Walang taong makatatayo sa harap ninyo[a]. Ilalagay ni Yahweh na inyong Diyos sa buong lupaing tatapakan ninyo[b] ang takot at sindak sa inyo, gaya ng sinabi niya sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Walang sinumang makapaninindigan laban sa inyo.” Ang Hebreong idyomang “tumayo sa harap” ay maaari ring mangahulugang makalaban o matagumpay na makasalungat.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa mukha ng buong lupaing tatapakan ninyo.” Maaari ring isalin ang הָאָרֶץ na “daigdig,” ngunit mas angkop dito ang “lupain” dahil ang tinutukoy ay ang teritoryong tatapakan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב אִישׁ בִּפְנֵיכֶם
  choice: Walang taong makatatayo sa harap ninyo
  rationale: Pinananatili ang larawan ng Hebreong idyomang “tumayo sa harap,” na sa konteksto ay maaari ring mangahulugang makapanindigan laban o matagumpay na makasalungat. Ang “tao” ay kumakatawan sa isahang אִישׁ nang hindi ginagawang tiyak na isang partikular na lalaki.
- source_word: פַּחְדְּכֶם וּמוֹרַאֲכֶם
  choice: ang takot at sindak sa inyo
  rationale: Ang “takot” at “sindak” ay nagpapanatili sa magkaugnay ngunit hindi lubos na magkaparehong mga salita. Ipinahihiwatig ng “sa inyo” na ang Israel ang kinatatakutan, hindi na ang Israel mismo ang natatakot.
- source_word: יִתֵּן
  choice: Ilalagay
  rationale: Bagaman pangunahing nangangahulugang “magbigay” ang נתן, natural na “ilalagay” sa Filipino kapag takot at sindak ang ipaiiral sa isang lugar o sa mga naroon.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh na inyong Diyos
  rationale: Tuwirang pinananatili ang pangalang tipan na יְהוָה at ang kaugnay na pariralang “inyong Diyos.”
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: sa buong lupain
  rationale: Ang literal na “sa ibabaw/mukha ng buong lupain” ay likas na ipinahahayag sa Filipino bilang “sa buong lupain.” Mas angkop ang “lupain” kaysa “daigdig” dahil nililimitahan ng kasunod na sugnay ang saklaw sa teritoryong tatapakan ng Israel.
- source_word: אֲשֶׁר תִּדְרְכוּ בָהּ
  choice: saanman kayo tumapak
  rationale: Pinananatili ang konkretong larawan ng pagtapak, habang natural na inuugnay ang sugnay sa saklaw ng buong lupaing papasukan nila.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: gaya ng sinabi niya sa inyo
  rationale: Isinasalin ang דִּבֶּר ayon sa payak na kahulugang “nagsalita/nagsabi” sa halip na gawing mas tiyak na “nangako,” bagaman may bisa ng pangako ang konteksto.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Nasa tekstong Hebreo ang personal na pangalang tipan. Ang “Yahweh” ay tuwirang paglilipat nito at hindi pinapalitan ng isang titulo.
- issue: Saklaw ng אִישׁ bilang kinatawang isahan
  choice: tao
  alternative: sinuman; lalaki
  rationale: Isahang panlalaki ang anyong Hebreo, ngunit kinatawan nito ang sinumang posibleng lumaban sa Israel. Ang “tao” ay nagpapanatili sa katauhang tinutukoy nang hindi maling nililimitahan ang pahayag sa isang partikular na lalaki.
- issue: Lakas ng pahayag na “makatatayo sa harap”
  choice: panatilihin ang idyoma sa pangunahing teksto
  alternative: walang makalalaban sa inyo
  rationale: Pinananatili ng pangunahing teksto ang larawan at bahagyang kaluwagan ng Hebreo; ipinapaliwanag sa talababa ang kahulugang matagumpay na pagsalungat nang hindi ito ginagawang tanging pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na ayos at bokabularyong madaling maunawaan. Pinanatili ang konkretong larawang “makatatayo sa harap” at “tumapak,” habang ginawang natural ang Hebreong pariralang “sa mukha ng buong lupain.”
