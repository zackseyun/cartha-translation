  source_fidelity: Tumpak na naisasalin ang kondisyong kaugnay ng sumpa, ang pakikinig sa mga utos ni Yahweh, ang paglihis mula sa daan, at ang pagsunod sa ibang mga diyos. Napananatili rin ang plural na kausap at ang sinadyang hindi pagpapaliwanag sa saklaw ng “nakilala.”
