  text: וְ/הַ/קְּלָלָ֗ה אִם לֹ֤א תִשְׁמְעוּ֙ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹֽא יְדַעְתֶּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/028.yaml
  text: and the curse[a], if you do not listen to the commandments of Yahweh your God, and turn aside from the way that I am commanding you today, to go after other gods that you have not known.
translation:
  language: tl
  text: at ang sumpa, kung hindi ninyo pakikinggan[a] ang mga utos ni Yahweh na inyong Diyos at lilihis kayo sa daang iniuutos ko sa inyo ngayon, upang sumunod sa ibang mga diyos na hindi ninyo nakilala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “susundin.” Sa mga konteksto ng tipan, ang Hebreong pandiwang isinaling “pakikinggan” ay madalas tumutukoy sa pakikinig na humahantong sa pagsunod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקְּלָלָה
  choice: at ang sumpa
  rationale: Pinananatili ang pang-ugnay at ang tiyak na pangngalan, na siyang tuwirang katapat ng pagpapala sa naunang talata.
- source_word: אִם לֹא
  choice: kung hindi
  rationale: Likas na Filipino para sa kondisyong nagsasaad kung kailan sasapit ang sumpa.
- source_word: תִשְׁמְעוּ אֶל
  choice: pakikinggan
  rationale: Pinananatili ang pangunahing diwang 'makinig,' habang ipinahihiwatig ng kontekstong tipan ang pagsunod; ipinaliliwanag ang alternatibo sa talababa.
- source_word: מִצְוֺת
  choice: mga utos
  rationale: Natural at marangal na salin ng maramihang מִצְוָה sa modernong Filipino.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh na inyong Diyos
  rationale: Tuwirang inililipat ang pangalang tipan na יהוה bilang Yahweh at likas na isinasalin ang kasunod na parirala.
- source_word: וְסַרְתֶּם מִן הַדֶּרֶךְ
  choice: at lilihis kayo sa daan
  rationale: Ang 'lilihis' ay nagpapanatili sa larawan ng pagtalikod o pag-alis mula sa itinakdang landas.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: na iniuutos ko sa inyo ngayon
  rationale: Natural na Filipino na nagpapanatili sa kasalukuyan at agarang bisa ng utos ni Moises.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: upang sumunod sa
  rationale: Sa Filipino, ang 'sumunod sa' ay likas na naghahatid ng idyomang paglakad kasunod ng isang piniling pinuno o diyos, bagaman hindi nito tahasang inuulit ang kilos na 'lumakad.'
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwiran at karaniwang salin ng pariralang pangtipan.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: na hindi ninyo nakilala
  rationale: Pinananatili ang aspektong ganap ng pandiwa at ang malawak na diwa ng personal o karanasang pagkakilala.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ang Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng 'Yahweh' ang natatanging pangalang tipan nang hindi ito ginagawang titulo.
- issue: Kung gagawing tahasang 'susundin' ang שׁמע
  choice: pakikinggan
  alternative: susundin
  rationale: Ang pandiwa ay literal na tumutukoy sa pakikinig ngunit madalas may diwa ng pagsunod sa kontekstong pangtipan. Pinananatili sa pangunahing teksto ang leksikal na larawan at inilalagay sa talababa ang ipinahihiwatig na kahulugan.
- issue: Kahulugan ng 'hindi ninyo nakilala' kaugnay ng ibang mga diyos
  choice: hindi ninyo nakilala
  alternative: hindi ninyo sinamba / hindi ninyo naranasan
  rationale: Hindi nililinaw ng teksto kung ang diin ay pagkakilala, karanasan, o ugnayan; pinananatili ang tunay na lawak ng ידע.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang maramihang 'ninyo/kayo' para sa kolektibong kausap. Pinanatili ang metapora ng daan at ang pangalang Yahweh; iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
