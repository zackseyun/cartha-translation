  text: אֶ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ דֹּרֵ֣שׁ אֹתָ֑/הּ תָּמִ֗יד עֵינֵ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/הּ מֵֽ/רֵשִׁית֙ הַ/שָּׁנָ֔ה וְ/עַ֖ד אַחֲרִ֥ית שָׁנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/012.yaml
  text: a land that Yahweh your God cares for; the eyes of Yahweh your God are continually on it[a], from the beginning of the year to the end of the year.
translation:
  language: tl
  text: isang lupaing pinangangalagaan[a] ni Yahweh na inyong Diyos; ang mga mata ni Yahweh na inyong Diyos ay patuloy na nakatuon dito, mula sa pasimula ng taon hanggang sa katapusan ng taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinahanap” o “sinisiyasat.” Ang pandiwang Hebreo ay maaaring tumukoy sa paghahanap, pagsisiyasat, o pangangalaga; dito, ipinahihiwatig nito ang aktibong malasakit ni Yahweh sa lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: lupain
  rationale: Tumutukoy ito sa ipinangakong teritoryo, hindi sa buong daigdig; ang “lupain” ang likas at tiyak na katumbas sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: inyong Diyos
  rationale: Bagaman isahan ang anyong Hebreo, ang “inyong” ay malinaw at likas na modernong Tagalog para sa marangal na tuwirang pakikipag-usap sa sambayanan, nang hindi ginagamit ang posibleng malabong “iyong.”
- source_word: דֹּרֵשׁ אֹתָהּ
  choice: pinangangalagaan
  rationale: Ang דרש ay maaaring mangahulugang humanap, siyasatin, o pag-ukulan ng malasakit. Sa lupa bilang layon, ipinahihiwatig nito ang aktibong pagkalinga at pagbabantay ng Diyos.
- source_word: תָּמִיד
  choice: patuloy
  rationale: Ipinahahayag ang walang-tigil at nagpapatuloy na pagtutuon; natural ito sa kasalukuyang Tagalog at angkop sa marangal na rehistro.
- source_word: עֵינֵי יְהוָה אֱלֹהֶיךָ בָּהּ
  choice: ang mga mata ni Yahweh na inyong Diyos ay patuloy na nakatuon dito
  rationale: Pinananatili ang antropomorpikong larawan ng mga mata ng Diyos, habang ginagamit ang likas na idyomang Tagalog na “nakatuon dito” para sa mapagmasid na malasakit.
- source_word: מֵרֵשִׁית הַשָּׁנָה וְעַד אַחֲרִית שָׁנָה
  choice: mula sa pasimula ng taon hanggang sa katapusan ng taon
  rationale: Malinaw na inilalarawan ang buong taunang saklaw at pinananatili ang bahagyang marangal na himig ng Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng pangangalaga ng Diyos sa lupain
  choice: pinangangalagaan
  alternative: hinahanap; sinisiyasat
  rationale: Hindi inaalis ang saklaw ng דרש; inilalagay sa talababa ang mga mas literal na posibilidad habang inihahayag sa pangunahing teksto ang aktibong malasakit na hinihingi ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lupain,” “pinangangalagaan,” at “nakatuon” bilang natural na mga katumbas, habang pinanatili ang Hebreong larawan ng mga mata ng Diyos at ang leksikal na kalabuan ng דרש sa talababa.
