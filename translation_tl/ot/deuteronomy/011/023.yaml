  source_fidelity: 'Tumpak ang pangunahing diwa: si Yahweh ang magpapaalis sa mga bansang ito, at ang Israel ay mag-aalis sa pagmamay-ari ng mga bansang mas malaki at mas makapangyarihan kaysa sa kanila. Gayunman, ang “aagawan ninyo ng lupain” ay nagdaragdag ng hayag na “lupain,” na wala sa Hebreo, at ang pandiwang “aagawan” ay maaaring magpahiwatig ng pakikipag-agawan kaysa sa tuwirang pag-aalis sa pagmamay-ari na nasa וִירִשְׁתֶּם.'
