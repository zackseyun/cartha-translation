base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/023.yaml
  text: then Yahweh will drive out all these nations before you, and you will dispossess nations greater and mightier than you.
translation:
  language: tl
  text: Itataboy ni Yahweh ang lahat ng bansang ito mula sa inyong harapan, at aalisan ninyo ng pag-aari ang mga bansang mas malaki at mas makapangyarihan kaysa sa inyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹרִישׁ
  choice: itataboy
  rationale: Ang Hiphil ng ירשׁ ay causative at dito ay tumutukoy sa pagpapaalis o pag-aalis sa mga bansa mula sa kanilang kinaroroonan; natural sa Filipino ang “itataboy” sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: lahat ng bansang ito
  rationale: Ang גּוֹיִם ay mga bansa o bayan; “mga bansa” ang angkop sa heopolitikal na konteksto ng talata.
- source_word: מִלִּפְנֵיכֶם
  choice: mula sa inyong harapan
  rationale: Malapit ito sa literal na “mula sa harap/presensiya ninyo” at malinaw na tumutukoy sa pagpapaalis sa kanilang daraanan.
- source_word: וִירִשְׁתֶּם
  choice: aagawan ninyo ng lupain
  rationale: Ang Qal ng ירשׁ ay maaaring mangahulugang angkinin o alisan ng pag-aari. Dahil mga bansa ang tuwirang layon, inilalahad ng parirala ang pag-aalis sa kanila sa lupaing hawak nila, nang hindi ginagawang tuwirang layon ang “lupain.”
- source_word: גְּדֹלִים
  choice: mas malaki
  rationale: Ang kasunod na מִכֶּם ay nagbibigay ng paghahambing; “mas malaki” ay malinaw at natural.
- source_word: וַעֲצֻמִים
  choice: mas makapangyarihan
  rationale: Ang עָצוּם ay nagpapahiwatig ng lakas o kapangyarihan; “makapangyarihan” ay marangal at likas sa modernong Filipino.
- source_word: מִכֶּם
  choice: kaysa sa inyo
  rationale: Karaniwang paghahambing ang gamit ng מִן na may hulaping pangalawang panauhang maramihan.
theological_decisions:
- issue: Pagbigkas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng וִירִשְׁתֶּם kapag mga bansa ang layon
  choice: aagawan ninyo ng lupain
  alternative: sasakupin ninyo
  rationale: Pinananatili nito ang diwa ng pag-aalis sa mga bansa mula sa kanilang pag-aari. Iniiwasan ng “sasakupin” ang posibleng pahiwatig na ang mga bansa mismo ang magiging pag-aari, ngunit ang salin ay hindi rin nagtatago sa marahas na tensiyon ng konteksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang pangmaramihang “inyo/ninyo” upang panatilihin ang bilang ng Hebreo. Hindi dinagdagan ng paliwanag ang mismong talata.
