base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/022.yaml
  text: For if you carefully keep all this commandment that I am commanding you to do—to love Yahweh your God[a], to walk in all his ways[c][b], and to cling to him—
translation:
  language: tl
  text: Sapagkat kung buong ingat ninyong susundin ang buong utos na ito na iniuutos ko sa inyo na sundin—ang ibigin si Yahweh na inyong Diyos, lumakad sa lahat ng kanyang mga daan, at kumapit sa kanya—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Sapagkat kung
  rationale: Pinananatili ang ugnay na paliwanag sa naunang talata at ang kondisyonal na diwa.
- source_word: שָׁמֹר תִּשְׁמְרוּן
  choice: buong ingat ninyong susundin
  rationale: Ipinahahayag ang pagpapatindi ng infinitive absolute at finite verb, habang natural sa makabagong Tagalog ang pagsunod sa isang utos.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: ang buong utos na ito
  rationale: Pinananatili ang isahang anyo ng Hebrew at ang kolektibong diwa ng kabuuang tagubilin ng tipan.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם לַעֲשֹׂתָהּ
  choice: na iniuutos kong gawin ninyo
  rationale: Ang progresibong 'iniuutos' ay tumutugma sa kasalukuyang kilos ng pagsasalita; likas na naipapahiwatig ng 'gawin' ang pambabaeng panghalip na tumutukoy sa utos nang walang alanganing pag-uulit.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֵיכֶם
  choice: ang ibigin si Yahweh na inyong Diyos
  rationale: Inilalahad ang nilalaman ng pagsunod at pinananatili ang personal na pangalang יהוה.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: lumakad sa lahat ng kanyang mga daan
  rationale: Pinananatili ang mahalagang metapora ng paglakad bilang asal o pamumuhay at ang saklaw na 'lahat.'
- source_word: וּלְדָבְקָה בוֹ
  choice: at kumapit sa kanya
  rationale: Ang 'kumapit' ay malinaw at masiglang katumbas ng דבק, na nagsasaad ng mahigpit na pagkalakip at katapatan.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalan mismo ang nasa Hebrew; pinananatili ng transliterasyong 'Yahweh' ang pagkakakilanlan nito bilang personal na pangalan sa halip na palitan ng titulo.
- issue: Mga metapora ng tipan na 'lumakad' at 'kumapit'
  choice: Panatilihin ang mga metapora sa pangunahing teksto
  alternative: Mamuhay ayon sa lahat ng kanyang kalooban at manatiling tapat sa kanya
  rationale: May sariling lawak at bigat ang mga larawang Hebrew; ang tuwirang pagpapanatili sa mga ito ay umiiwas sa labis na pagpapaliwanag o pagpapakitid ng diwa.
- issue: Ugnayan ng tatlong infinitive sa utos
  choice: Ipakita ang mga ito bilang nilalaman o pagpapaliwanag ng pagsunod gamit ang em dash
  alternative: Ituring lamang ang mga ito bilang hiwalay na layunin o paraan
  rationale: Maaaring magpahiwatig ang mga infinitive ng layunin, paraan, o nilalaman. Ang bantas at magkakatulad na anyo ay nagpapanatili ng ugnayan nang hindi ito nilulutas nang labis.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'buong ingat' upang maipakita ang Hebrew na pagpapatindi, at pinanatili ang mga biblikal na metaporang 'lumakad' at 'kumapit.' Ang pangungusap ay sadyang nagtatapos sa em dash sapagkat nagpapatuloy ang kondisyon sa kasunod na talata.
