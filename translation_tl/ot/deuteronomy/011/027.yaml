  text: the blessing[a], if you listen to the commandments of Yahweh your God[b], which I am commanding you today.
translation:
  language: tl
  text: ang pagpapala[a], kung makikinig[b] kayo sa mga utos ni Yahweh, na inyong Diyos, na iniuutos ko sa inyo ngayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang pagpapalang dumarating kapag sinusunod ninyo ang mga utos ni Yahweh na inyong Diyos.” Ang salitang Hebreo na karaniwang pang-ugnay ay may kondisyonal na diwa rito.'
    reason: lexical_alternative
  - marker: b
    text: Ang “makinig sa” ay maaari ring isaling “sumunod sa,” sapagkat sa Hebreo madalas itong tumutukoy sa pakikinig na may kasamang masunuring pagtugon.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַבְּרָכָה
  choice: ang pagpapala
  rationale: Ipinagpapatuloy nito ang eliptikong ayos mula sa naunang talata, kung saan inilalagay sa harap ng Israel ang pagpapala at ang sumpa.
- source_word: אֲשֶׁר
  choice: kung
  rationale: 'Bagaman pang-ugnay na panumbas ng “na” ang karaniwang gamit nito, kondisyonal ang diwa rito: matatamo ang pagpapala kung tutugon sila sa mga utos.'
- source_word: תִּשְׁמְעוּ אֶל
  choice: makikinig kayo sa
  rationale: Pinananatili nito ang pangunahing diwa ng pandiwang שׁמע na “makinig,” habang ipinahihiwatig ng konteksto ng tipan ang pagsunod bilang tugon.
- source_word: מִצְוֺת
  choice: mga utos
  rationale: Natural at malinaw itong salin ng maramihang מִצְוֺת sa makabagong Filipino, at pinananatili ang bigat ng mga tagubilin ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Filipino ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Ipinapahayag nang tuwiran ang pangmaramihang ikalawang panauhang paari.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: na iniuutos ko sa inyo ngayon
  rationale: Ang “iniuutos” ay sumasalamin sa kasalukuyan at nagpapatuloy na kilos ng participle habang nagsasalita si Moises; pinananatili ng “ngayon” ang agarang bisa ng pahayag.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon.”
- issue: Ugnayan ng pakikinig at pagsunod
  choice: makikinig kayo sa
  alternative: susundin ninyo
  rationale: Pinananatili ang leksikal na larawan ng pagdinig/pakikinig at hindi inaalis ang ipinahihiwatig na masunuring tugon; nililinaw ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga utos” sa halip na mas mabigat na “mga kautusan,” at pinanatili ang “makikinig” upang maingatan ang leksikal na diwa at ang teolohikal na tensiyon sa pagitan ng pagdinig at pagsunod.
