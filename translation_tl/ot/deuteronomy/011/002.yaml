language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֮ הַ/יּוֹם֒ כִּ֣י לֹ֣א אֶת בְּנֵי/כֶ֗ם אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ וַ/אֲשֶׁ֣ר לֹא רָא֔וּ אֶת מוּסַ֖ר יְהוָ֣ה אֱלֹהֵי/כֶ֑ם אֶת גָּדְל֕/וֹ אֶת יָד/וֹ֙ הַ/חֲזָקָ֔ה וּ/זְרֹע֖/וֹ הַ/נְּטוּיָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/002.yaml
  text: And know today that that I am not speaking to your children, who have not known and who have not seen the discipline of Yahweh your God[a], his greatness, his strong hand[b], and his outstretched arm—
translation:
  language: tl
  text: 'Alamin ninyo ngayon: hindi ang inyong mga anak ang kinakausap ko—ang mga hindi nakaalam ni nakakita sa pagdidisiplina ni Yahweh na inyong Diyos[a], sa kanyang kadakilaan, sa kanyang malakas na kamay[b], at sa kanyang nakaunat na bisig—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Pahapyaw ang Hebreo; literal: “sapagkat hindi ang inyong mga anak na hindi nakaalam at hindi nakakita...” Ang diwa ay ang mga taong personal na nakasaksi sa mga ginawa ni Yahweh ang kinakausap ni Moises, hindi ang sumunod na salinlahi.'
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “makapangyarihang kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: At unawain ninyo
  rationale: Ang Qal perfect na may pang-ugnay ay gumaganap dito bilang tuwirang panawagan na bigyang-pansin at kilalanin ang susunod na katotohanan; natural sa modernong Tagalog ang “unawain ninyo.”
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Tuwirang ipinahahayag ang agarang panahon ng pananalita ni Moises.
- source_word: כִּי לֹא אֶת־בְּנֵיכֶם
  choice: hindi ang inyong mga anak ang kinakausap ko
  rationale: Pahapyaw at kulang sa hayag na pandiwa ang Hebreo. Ipinapakita ng konteksto na ang kasalukuyang mga tagapakinig, hindi ang kanilang mga anak, ang tuwirang tinutukoy ni Moises.
- source_word: אֲשֶׁר לֹא יָדְעוּ וַאֲשֶׁר לֹא רָאוּ
  choice: sila na hindi nakaalam ni nakakita
  rationale: Pinananatili ang magkatimbang na mga sugnay at ang diwa ng kakulangan ng personal na karanasan.
- source_word: מוּסַר
  choice: pagdidisiplina
  rationale: Saklaw nito ang paghubog, pagtutuwid, at pagpaparusa, nang hindi nililimitahan ang salita sa parusa lamang.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh na inyong Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang tipanang pahayag na siya ang Diyos ng Israel.
- source_word: גָּדְלוֹ
  choice: kanyang kadakilaan
  rationale: Tuwirang katumbas ng kadakilaang nahahayag sa mga makapangyarihang gawa ng Diyos.
- source_word: יָדוֹ הַחֲזָקָה
  choice: kanyang malakas na kamay
  rationale: Malapit sa literal na “malakas na kamay” at pinananatili ang larawang Hebreo ng kapangyarihan.
- source_word: וּזְרֹעוֹ הַנְּטוּיָה
  choice: kanyang nakaunat na bisig
  rationale: Pinananatili ang karaniwang larawang Hebreo para sa aktibong kapangyarihan ng Diyos.
theological_decisions:
- issue: Pahapyaw na paghahambing sa “inyong mga anak”
  choice: Ipinahiwatig nang hayagan ang nawawalang pandiwa bilang “ang kinakausap ko.”
  alternative: “Sapagkat hindi ang inyong mga anak na hindi nakaalam at hindi nakakita...”
  rationale: Walang hayag na pandiwang namamahala sa parirala sa Hebreo. Nililinaw ng salin ang kaibahan sa diskurso nang hindi dinaragdagan ang doktrinal na nilalaman.
- issue: Saklaw ng מוּסַר
  choice: pagdidisiplina
  alternative: pagtuturo; pagtutuwid; pagpaparusa
  rationale: Pinananatili ng “pagdidisiplina” ang sabay na diwa ng paghubog at pagtutuwid, sa halip na ipakahulugan ito bilang parusa lamang.
translation_notes:
  register: Makabago at marangal na Filipino, na may tuwirang pakikipag-usap sa maramihang tagapakinig. Ginamit ang “Yahweh” para sa tetragrammaton at pinanatili ang pangwakas na gitling sapagkat nagpapatuloy ang pangungusap sa susunod na talata.
