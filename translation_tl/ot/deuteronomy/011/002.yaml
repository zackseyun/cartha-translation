    issue: Ang “unawain ninyo” para sa וִידַעְתֶּם
    rationale: Ang pandiwa ay pangunahing “malaman/kilalanin,” hindi lamang “unawain.” Ang “Alamin ninyo” ay mas malapit sa puwersang panawagan ng Hebreo.
  - severity: medium
    issue: Hindi maayos ang ugnayan ng “sila na hindi nakaalam ni nakakita” sa “inyong mga anak.”
    rationale: Kailangang malinaw na ang dalawang negatibong pandiwa ay naglalarawan sa mga anak, nang hindi lumilikha ng alanganing panghalip na “sila.”
