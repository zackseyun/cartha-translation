  text: וְ/שַׂמְתֶּם֙ אֶת דְּבָרַ֣/י אֵ֔לֶּה עַל לְבַבְ/כֶ֖ם וְ/עַֽל נַפְשְׁ/כֶ֑ם וּ/קְשַׁרְתֶּ֨ם אֹתָ֤/ם לְ/אוֹת֙ עַל יֶדְ/כֶ֔ם וְ/הָי֥וּ לְ/טוֹטָפֹ֖ת בֵּ֥ין עֵינֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/018.yaml
  text: So you shall place these words of mine on your heart and on your soul[a], and you shall bind them as a sign on your hand, and they shall be as frontlets between your eyes.
translation:
  language: tl
  text: Kaya, ilagay ninyo sa inyong puso at kaluluwa ang mga salita kong ito. Itali ninyo ang mga ito bilang tanda sa inyong kamay, at magiging mga pananda[a] ang mga ito sa pagitan ng inyong mga mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bihira ang salitang Hebreo at hindi tiyak ang eksaktong kahulugan nito. Maaari rin itong isaling “mga pilakterya,” na tumutukoy sa maliliit na sisidlang naglalaman ng mga sipi ng Kasulatan at isinusuot sa kaugaliang Judio noong mga sumunod na panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתֶּם
  choice: Kaya ilagay ninyo
  rationale: Ang שׂים ay karaniwang nangangahulugang “ilagay” o “itakda.” Pinananatili ng “ilagay” ang kongkretong larawan, samantalang ipinapakita ng “Kaya” ang pagpapatuloy ng tagubilin mula sa naunang konteksto.
- source_word: דְּבָרַי אֵלֶּה
  choice: ang mga salita kong ito
  rationale: Likas sa modernong Tagalog ang ayos na ito at malinaw nitong pinananatili ang unang panauhang pagmamay-ari sa hulaping Hebreo.
- source_word: עַל לְבַבְכֶם וְעַל נַפְשְׁכֶם
  choice: sa inyong puso at kaluluwa
  rationale: Pinananatili nito ang magkatambal na larawang “puso” at נֶפֶשׁ. Ang “kaluluwa” ay dignified at pamilyar na katumbas, bagaman mas malawak ang saklaw ng salitang Hebreo at maaari ring tumukoy sa sarili o buhay.
- source_word: וּקְשַׁרְתֶּם אֹתָם
  choice: Itali ninyo ang mga ito
  rationale: Ang “itali” ay tuwirang katumbas ng קשׁר at hindi nagpapasiya kung ang kilos ay literal, simboliko, o kapwa.
- source_word: לְאוֹת עַל יֶדְכֶם
  choice: sa inyong kamay bilang tanda
  rationale: Pinananatili ang payak na kahulugan ng יָד na “kamay” at ng אוֹת na “tanda,” pati ang konkretong larawan ng teksto.
- source_word: וְהָיוּ לְטוֹטָפֹת
  choice: at gawin silang mga pananda[a]
  rationale: Ang טוֹטָפֹת ay isang bihira at hindi ganap na tiyak na katawagan. Ang “mga pananda” ay natural sa Tagalog, pinananatili ang maramihang anyo, at umiiwas sa pagpasok sa pangunahing teksto ng mas huling teknikal na katawagang “pilakterya.”
- source_word: בֵּין עֵינֵיכֶם
  choice: sa pagitan ng inyong mga mata
  rationale: Ito ang tuwirang larawan ng Hebreo. Hindi ito pinalitan ng mas interpretatibong “sa noo.”
theological_decisions:
- issue: Kung literal o matalinghaga ang pagtatali ng mga salita sa kamay at paglalagay ng mga ito sa pagitan ng mga mata
  choice: Pinanatili ang kongkretong pananalita nang hindi nagpapasiya kung literal, matalinghaga, o kapwa ang utos.
  alternative: Maaaring unawain itong matalinghagang panawagan na laging isaisip at isagawa ang mga utos, o bilang batayan ng literal na kaugaliang gumamit ng mga pilakterya.
  rationale: Kongkreto ang pananalita ng Hebreo, ngunit hindi nilulutas ng talata mismo ang ugnayan ng simbolikong diwa at literal na pagsasagawa. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “ninyo/inyong” upang malinaw na tumukoy sa maramihang kausap. Iniwasan ang labis na teknikal na salita sa pangunahing teksto, habang inilagay sa talababa ang mahalagang alternatibong leksikal.
