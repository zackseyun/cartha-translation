translation:
  language: tl
  text: At maingat ninyong tuparin ang lahat ng tuntunin at mga kautusang inilalatag ko sa harap ninyo ngayon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “na ibinibigay ko sa harap ninyo ngayon”; ang Hebreong idyoma ay nangangahulugang “inilalatag ko sa harap ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם לַ/עֲשׂוֹת
  choice: At ingatan ninyong gawin
  rationale: Sa pagkakaugnay ng שׁמר at ng pawatas na עשה, ang diwa ay maging maingat na isagawa, hindi lamang basta 'ingatan.' Likas sa Tagalog ang 'ingatan ninyong gawin' at napapanatili nito ang lakas ng tagubilin.
- source_word: כָּל
  choice: lahat ng
  rationale: Ipinahahayag nito ang kabuuan ng hinihinging pagsunod.
- source_word: הַֽ/חֻקִּים
  choice: mga tuntunin
  rationale: Ang חֻקִּים ay mga itinakdang kautusan o batas. Ang 'mga tuntunin' ay malinaw at marangal sa modernong Tagalog, habang nananatiling naiiba sa מִשְׁפָּטִים.
- source_word: וְ/אֶת הַ/מִּשְׁפָּטִים
  choice: at mga kahatulan
  rationale: Pinananatili ng 'mga kahatulan' ang legal na diwa at ang leksikal na pagkakaiba nito sa חֻקִּים, bagaman mas pormal ito kaysa 'mga alituntunin.'
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לִ/פְנֵי/כֶם
  choice: na inilalagay ko sa harap ninyo
  rationale: Literal na 'ibinibigay ko sa harap ninyo,' ngunit ang kabuuang Hebreong idyoma ay tumutukoy sa paghaharap o paglalatag ng mga kautusan. Natural sa Tagalog ang 'inilalagay ko sa harap ninyo' at napapanatili ang kasalukuyang kilos.
- source_word: הַ/יּוֹם
  choice: ngayon
  rationale: Direkta at likas na katumbas ito ng temporal na diin ng הַיּוֹם sa kasalukuyang pahayag ng tipan.
