revisions:
- from: At ingatan ninyong gawin ang lahat ng tuntunin at mga kahatulang inilalagay ko sa harap ninyo ngayon.[a]
  to: At maingat ninyong tuparin ang lahat ng tuntunin at mga kautusang inilalatag ko sa harap ninyo ngayon.[a]
  rationale: Pinalitan ang di-likas na “ingatan ninyong gawin” ng “maingat ninyong tuparin” upang maipahayag ang utos na mag-ingat sa pagsasagawa. Pinalitan ang “mga kahatulan” ng “mga kautusan” upang maiwasan ang diwa ng mga sentensiyang hatol at mas malinaw na maipahayag ang legal na tagubilin. Iningatan ang presenteng aspekto at ang idiomatikong “sa harap ninyo.”
