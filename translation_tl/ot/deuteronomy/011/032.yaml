  source_fidelity: Ang pangmaramihang kausap, ang utos na may diin sa maingat na pagsasagawa, ang kabuuan ng mga legal na tagubilin, at ang kasalukuyang paghaharap ng mga ito “ngayon” ay lahat naipapahayag sa rebisyon. Ang “inilalatag ko sa harap ninyo” ay natural na katumbas ng Hebreong idiom na literal na “ibinibigay ko sa harap ninyo.”
  naturalness: Hindi likas sa modernong Filipino ang “ingatan ninyong gawin,” sapagkat karaniwang nangangahulugan ang “ingatan” na protektahan o alagaan. Ang “maingat ninyong tuparin” ay malinaw, marangal, at angkop sa legal-tipang rehistro. Ang “mga kahatulan” ay maaari ring mangahulugang mga sentensiya ng hatol o pagkondena, kaya hindi ito ang pinakamalinaw na tawag sa מִשְׁפָּטִים sa kontekstong ito.
  terminology: Pinanatili ang pagkakaiba sa pagitan ng חֻקִּים bilang “mga tuntunin” at מִשְׁפָּטִים bilang “mga kautusan.” Bagaman may bahagyang pagsasapawan sa karaniwang gamit, ang pares na ito ay mas malinaw at mas natural kaysa “mga tuntunin at mga kahatulan,” nang hindi ipinipilit ang isang espesipikong interpretasyong legal.
