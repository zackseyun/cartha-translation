id: DEU.11.11
reference: Deuteronomy 11:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֥ים שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ אֶ֥רֶץ הָרִ֖ים וּ/בְקָעֹ֑ת לִ/מְטַ֥ר הַ/שָּׁמַ֖יִם תִּשְׁתֶּה מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/011.yaml
  text: But the land that you are crossing over to possess is a land of mountains and valleys[b][a]; it drinks water from the rain of heaven.
translation:
  language: tl
  text: Ngunit ang lupaing tatawirin ninyo upang angkinin[a] ay lupaing may mga bundok at mga lambak; umiinom ito ng tubig mula sa ulan ng langit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “manahin.” Sa mga kontekstong may kaugnayan sa tipan, ang pandiwang Hebreo ay maaaring magpahiwatig kapuwa ng pag-angkin at ng pagtanggap bilang mana.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga langit,” isang karaniwang biblikal na pananalita para sa kalangitan o makalangit na dako.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: Ngunit ang lupain
  rationale: Ginamit ang “Ngunit” upang ihayag ang paghahambing sa lupain ng Ehipto sa naunang talata; natural at malinaw ang “lupain” para sa הָאָרֶץ.
- source_word: עֹבְרִים שָׁמָּה
  choice: tatawirin ninyo
  rationale: Ang participle at panandang patungo ay tumutukoy sa nalalapit na pagtawid papasok sa lupain. Ang aspektong kontemplatibo ng “tatawirin” ay likas sa modernong Tagalog.
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin
  rationale: Saklaw ng ירשׁ ang pagkuha at pagtataglay ng lupain, na maaari ring magkaroon ng diwang mana sa kontekstong tipan. Pinananatili ng “angkinin” ang aktibong pagpasok at pagtataglay, habang inilalagay sa talababa ang posibleng “manahin.”
- source_word: אֶרֶץ הָרִים וּבְקָעֹת
  choice: lupaing may mga bundok at mga lambak
  rationale: Malinaw at likas nitong inilalarawan ang salit-salitang anyo ng lupain. Ang בְקָעוֹת ay maaaring tumukoy sa mga lambak, lunas, o mabababang bahagi; “mga lambak” ang pinakamadaling maunawaan dito.
- source_word: לִמְטַר הַשָּׁמַיִם
  choice: mula sa ulan ng langit
  rationale: Ipinahahayag nito na ulan ang pinagmumulan ng tubig ng lupain. Ang “langit” ay natural na kolektibong anyo sa Tagalog, samantalang ang literal na maramihang anyo ng Hebreo ay binanggit sa talababa.
- source_word: תִּשְׁתֶּה מָּיִם
  choice: umiinom ito ng tubig
  rationale: Pinananatili ang matingkad na personipikasyon ng Hebreo, sa halip na gawing payak na “dinidiligan” o “tumatanggap ng tubig.”
theological_decisions:
- issue: Diwa ng ירשׁ bilang pag-angkin o pagmamana
  choice: angkinin
  alternative: manahin
  rationale: 'Hindi nilulutas nang tahimik ang saklaw ng salita: inilalagay sa pangunahing teksto ang aktibong pag-angkin na angkop sa pagtawid ng Israel, at pinananatili sa talababa ang diwang pagmamana na maaaring taglay nito sa kontekstong tipan.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang personipikasyon ng lupain bilang umiinom at iniwasan ang sobrang teknikal o makalumang pananalita.
