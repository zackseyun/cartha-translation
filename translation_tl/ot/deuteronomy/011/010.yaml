revisions:
- from: Sapagkat ang lupaing papasukan ninyo upang angkinin ay hindi tulad ng lupain ng Ehipto, na inyong nilabasan. Doon ay naghahasik kayo ng inyong binhi at dinidiligan iyon sa pamamagitan ng inyong paa[a], gaya ng isang halamanan ng mga gulay.
  to: Sapagkat ang lupain na papasukan ninyo upang angkinin ay hindi tulad ng lupain ng Ehipto, na inyong nilabasan, kung saan kayo ay naghahasik ng inyong binhi at dinidiligan ito gamit ang inyong paa[a], gaya ng isang halamanan ng mga gulay.
  rationale: Inayos ang daloy upang malinaw na ang mga sugnay tungkol sa paglabas, paghahasik, at pagdidilig ay nakaugnay sa Ehipto. Ginawang mas likas ang pananalita para sa paraan ng pagdidilig, nang hindi nilulutas ang sinasadyang hindi tiyak na kahulugan ng בְּרַגְלְךָ.
