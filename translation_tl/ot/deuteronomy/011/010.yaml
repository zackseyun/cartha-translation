  text: כִּ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתָּ֤ה בָא שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ לֹ֣א כְ/אֶ֤רֶץ מִצְרַ֨יִם֙ הִ֔וא אֲשֶׁ֥ר יְצָאתֶ֖ם מִ/שָּׁ֑ם אֲשֶׁ֤ר תִּזְרַע֙ אֶֽת זַרְעֲ/ךָ֔ וְ/הִשְׁקִ֥יתָ בְ/רַגְלְ/ךָ֖ כְּ/גַ֥ן הַ/יָּרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/010.yaml
  text: For the land that you are entering to possess is not like the land of Egypt[a], from which you came out, where you sowed your seed and watered it with your foot[b], like a vegetable garden.
translation:
  language: tl
  text: Sapagkat ang lupain na papasukan ninyo upang angkinin ay hindi tulad ng lupain ng Ehipto, na inyong nilabasan, kung saan kayo ay naghahasik ng inyong binhi at dinidiligan ito gamit ang inyong paa[a], gaya ng isang halamanan ng mga gulay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “gamit ang inyong paa” ay maaaring tumukoy sa pagpapatakbo ng kasangkapang patubig gamit ang paa o sa paggabay sa tubig sa maliliit na kanal sa pamamagitan ng paa.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na kaugnay ng naunang pangaral at likas ang daloy sa Filipino.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Pinananatili ang mahalagang heograpiko at tipanang diwa ng אֶרֶץ sa Deuteronomio.
- source_word: בָא שָׁמָּה
  choice: papasukan ninyo
  rationale: Likas na Filipino para sa nalalapit na pagpasok; ang Hebreo ay pang-isahan ngunit kolektibong Israel ang kinakausap, kaya ginamit ang magalang at kolektibong “ninyo.”
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin
  rationale: Ipinahahayag ang pagkuha at pananatiling pag-aari nang hindi ipinipilit ang diwang pampamilya ng “manahin.”
- source_word: לֹא כְאֶרֶץ מִצְרַיִם
  choice: ay hindi tulad ng lupain ng Ehipto
  rationale: Tuwirang pinananatili ang paghahambing ng Canaan at Ehipto.
- source_word: אֲשֶׁר יְצָאתֶם מִשָּׁם
  choice: na inyong nilabasan
  rationale: Pinananatili ang idyomang “lumabas” at ang alusyon sa Exodo, sa halip na patagin bilang “iniwan.”
- source_word: אֲשֶׁר תִּזְרַע אֶת זַרְעֲךָ
  choice: Doon ay naghahasik kayo ng inyong binhi
  rationale: Ang aspektong di-ganap ay nauunawaan bilang nakagawiang gawain sa Ehipto; pinananatili ng “binhi” ang kongkretong larawan.
- source_word: וְהִשְׁקִיתָ
  choice: at dinidiligan iyon
  rationale: Natural at malinaw; ang “iyon” ay ipinuno mula sa kontekstong pansakahan nang hindi tinutukoy nang labis kung binhi, tanim, o lupa ang layon.
- source_word: בְרַגְלְךָ
  choice: sa pamamagitan ng inyong paa
  rationale: Pinananatili ang kakaiba at kongkretong larawang Hebreo; ipinaliliwanag sa talababa ang posibleng paraan ng patubig.
- source_word: כְּגַן הַיָּרָק
  choice: gaya ng isang halamanan ng mga gulay
  rationale: Naglalarawan ng maliit at masinsing dinidiligang taniman sa malinaw na makabagong Filipino.
theological_decisions:
- issue: Idyoma ng Exodo sa kontekstong tipanan
  choice: na inyong nilabasan
  alternative: na inyong iniwan
  rationale: Ang “nilabasan” ay nagpapanatili sa wikang ginamit tungkol sa paglabas ng Israel mula sa Ehipto nang hindi nagdaragdag ng interpretasyong wala sa talata.
- issue: Aspekto ng paghahasik at pagdidilig sa Ehipto
  choice: naghahasik kayo ... at dinidiligan
  alternative: naghasik kayo ... at diniligan
  rationale: Maaaring ilarawan ng mga anyong Hebreo ang nakagawiang paraan ng pagsasaka; pinananatili ng aspektong di-ganap sa Filipino ang ganitong posibilidad.
translation_notes:
  register: Makabago, dignipikado, at madaling maunawaang Filipino. Ginamit ang kolektibo at magalang na “ninyo/kayo” upang natural na maipahayag ang paghahalili ng pang-isahan at pangmaramihan sa Hebreo kapag ang Israel bilang isang bayan ang kinakausap.
