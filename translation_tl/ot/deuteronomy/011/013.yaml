  rationale: Pinalitan ang nakabukod na em-dash na parirala ng “upang” upang maging natural na Tagalog at malinaw na maiugnay ang pag-ibig at paglilingkod kay Yahweh sa pakikinig sa kanyang mga utos. Hindi nito nilulutas nang lampas sa teksto ang eksaktong sintaktikong saklaw ng mga infinitive. Pinanatili ang hulihang em dash dahil ang protasis at ang bunga nito ay nagpapatuloy sa talata 14.
