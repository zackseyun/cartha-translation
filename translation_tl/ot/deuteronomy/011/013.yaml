  source_fidelity: Tumpak na naihahatid ng draft ang kondisyunal na pagbubukas, ang pagbibigay-diin ng שָׁמֹעַ תִּשְׁמְעוּ, ang pangalan na Yahweh, at ang saklaw ng paglilingkod nang buong puso at pagkatao. Gayunman, ang naka-em dash na pariralang “na ibigin ...” ay nagiging tila pahabol na pagpapaliwanag sa halip na malinaw na infinitival na layunin/kaugnay na hinihingi ng Hebreo.
  naturalness: Karaniwan at angkop ang “talagang makikinig,” “mga utos,” at “paglingkuran.” Mas natural ang paggamit ng kuwit at “upang” kaysa sa magkabilang em dash sa gitna ng di-pa-tapos na kondisyunal na pangungusap. Ang hulihang em dash ay maaaring panatilihin upang ipakitang ang resulta ng kondisyon ay nasa kasunod na talata.
  terminology: Ang “Yahweh,” “Diyos,” “buong puso,” at “buong pagkatao” ay angkop. Ang talababa para sa נֶפֶשׁ ay wastong nagpapanatili ng mga alternatibong “buong buhay” at “buong kaluluwa.”
  issues:
  - severity: medium
    issue: Hindi likas at hindi sapat na malinaw ang naka-em dash na “—na ibigin si Yahweh ...—”.
    rationale: Ang לְאַהֲבָה at וּלְעָבְדוֹ ay mga infinitive na malapit na kaugnay ng pakikinig/pagsunod sa mga utos. Sa Tagalog, ang “upang” ay mas malinaw na naghahayag ng ugnayang ito nang hindi ipinipilit kung ito ay layunin o pagpapaliwanag.
  - severity: low
    issue: Nawawala ang ikalawang “nang” sa huling magkapares na parirala.
    rationale: Bagaman nauunawaan ang “nang buong puso at buong pagkatao,” mas malinaw at mas maindayog ang “nang buong puso at nang buong pagkatao,” na mas malapit din sa pag-uulit ng בְּכָל sa Hebreo.
