id: DEU.11.13
reference: Deuteronomy 11:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁמֹ֤עַ תִּשְׁמְעוּ֙ אֶל מִצְוֺתַ֔/י אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ וּ/לְ/עָבְד֔/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/013.yaml
  text: And if you indeed listen to my commandments that I am commanding you today[a], to love Yahweh your God and to serve him with all your heart and with all your soul[c][b],
translation:
  language: tl
  text: At kung talagang makikinig kayo sa aking mga utos na iniuutos ko sa inyo ngayon[a], upang ibigin si Yahweh[b], na inyong Diyos, at paglingkuran siya nang buong puso at nang buong pagkatao[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na idyoma sa Hebreo: “kung makinig na makikinig kayo”; maaari rin itong mangahulugang “kung maingat ninyong susundin.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: YHWH, ang personal na pangalan ng Diyos; tradisyonal din itong isinasalin na “ang PANGINOON.”'
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Hebreo ay maaari ring isaling “buong buhay” o “buong kaluluwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: At kung
  rationale: Ipinakikilala nito ang kondisyon na nagpapatuloy sa susunod na talata; natural sa Tagalog ang “At kung” kaysa sa literal na “At mangyayari, kung.”
- source_word: שָׁמֹעַ תִּשְׁמְעוּ
  choice: talagang makikinig kayo
  rationale: Ang infinitive absolute na kasunod ng imperfect ay nagbibigay-diin. Pinananatili ng “makikinig” ang larawang pandinig, habang ipinahihiwatig ng konteksto ang masunuring pagtugon.
- source_word: אֶל מִצְוֺתַי
  choice: sa aking mga utos
  rationale: Ang “mga utos” ay malinaw at likas na katumbas ng mga obligasyong iniutos sa tipan.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: na iniuutos ko sa inyo ngayon
  rationale: Ipinapakita ng aspektong participial ang kasalukuyang pagkilos ni Moises sa pagsasalita, at pinananatili ang mahalagang “ngayon.”
- source_word: לְאַהֲבָה
  choice: na ibigin
  rationale: Ang “ibigin” ay marangal ngunit nauunawaang modernong anyo; ipinakikita ng gatlang ang ugnayan nito sa nilalaman o layunin ng pakikinig sa mga utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: na inyong Diyos
  rationale: Natural na pariralang Tagalog para sa tipanang pagtukoy na “Yahweh your God.”
- source_word: וּלְעָבְדוֹ
  choice: at paglingkuran siya
  rationale: Saklaw ng “paglingkuran” ang tapat na paglilingkod at pagsamba nang hindi nililimitahan ang pandiwa sa gawaing kultiko lamang.
- source_word: בְּכָל לְבַבְכֶם
  choice: nang buong puso
  rationale: Likas sa Tagalog ang parirala at naihahatid ang kabuuang panloob na pagpapasiya, pag-iisip, at damdamin.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: at buong pagkatao
  rationale: Ang נֶפֶשׁ ay maaaring tumukoy sa buhay, sarili, o buong nilalang. Mas malinaw sa karaniwang mambabasa ang “buong pagkatao” kaysa sa “buong kaluluwa,” na maaaring mapaliit sa di-materyal na bahagi lamang.
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng שָׁמֹעַ תִּשְׁמְעוּ
  choice: talagang makikinig kayo
  alternative: masikap ninyong susundin; buong ingat kayong tatalima
  rationale: Pinananatili sa pangunahing teksto ang pandiwang “makinig” at ang diin ng Hebreong idyoma, samantalang nililinaw sa talababa na kasama rito ang pagsunod.
- issue: Saklaw ng נֶפֶשׁ
  choice: buong pagkatao
  alternative: buong kaluluwa; buong buhay
  rationale: Hindi ipinapalagay ng Hebreong salita ang makitid na paghahati ng katawan at kaluluwa; ang “pagkatao” ay nagpapanatili sa mas malawak na diwa, at inilalahad sa talababa ang mga alternatibo.
- issue: Sintaktikong ugnayan ng לְאַהֲבָה at וּלְעָבְדוֹ
  choice: inilalahad bilang nilalaman o layunin ng pakikinig sa mga utos
  alternative: ituring lamang na magkahiwalay na karagdagang kondisyon
  rationale: Maaaring basahin ang mga infinitive bilang layunin o pagpapaliwanag sa masunuring pakikinig. Ang gatlang ay nagpapanatili sa malapit na ugnayan nang hindi lubusang nilulutas ang sintaktikong ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “ibigin” at “paglingkuran” bilang pormal ngunit karaniwang mga anyo. Pinanatili ang talata bilang protasis na hindi pa kumpletong pangungusap sapagkat nagpapatuloy ang kondisyon at resulta sa Deuteronomio 11:14.
