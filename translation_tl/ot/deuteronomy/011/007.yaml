  text: For your own eyes have seen all the great work of Yahweh that he did[a].
translation:
  language: tl
  text: Sapagkat nakita mismo ng inyong mga mata ang lahat ng dakilang gawa na ginawa ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang inyong mga mata—ang mga nakakita”—isang mariing paraan ng pagsasabing kayo mismo ang mga nakasaksi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan o paliwanag para sa naunang pahayag; natural sa Filipino ang “Sapagkat” habang pinananatili ang ugnayang sanhi o paliwanag.
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: nakita mismo ng inyong mga mata
  rationale: Pinagsasama nito ang tahasang pagbanggit sa “inyong mga mata” at ang participle na “nakakakita,” na idiomatikong nagpapatingkad sa kanila bilang mga nakasaksi.
- source_word: אֶת כָּל מַעֲשֵׂה
  choice: ang lahat ng ... ginawa
  rationale: Ang kolektibong diwa ng “lahat ng gawain” ay natural na naihahayag sa Filipino bilang “lahat ng ginawa.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: הַגָּדֹל
  choice: dakilang
  rationale: Tuwirang inilalarawan nito ang laki o kadakilaan ng ginawa ni Yahweh nang hindi dinaragdagan ng mas tiyak na ideya ng kapangyarihan.
- source_word: אֲשֶׁר עָשָׂה
  choice: ginawa
  rationale: Ang payak na sugnay na “na ginawa niya” ay naisama nang natural sa pariralang “lahat ng dakilang ginawa ni Yahweh,” na iniiwasan ang mabigat at paulit-ulit na anyo sa Filipino.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakita mismo ng inyong mga mata” upang maging natural sa Tagalog at mapanatili ang diin ng tekstong Hebreo sa tuwirang pagsaksi.
