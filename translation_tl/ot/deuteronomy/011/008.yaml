base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/008.yaml
  text: So keep every commandment that I am commanding you today[c][b][a], so that you may be strong and go in and possess the land that you are crossing over to possess.
translation:
  language: tl
  text: Kaya sundin ninyo ang lahat ng utos na iniuutos ko sa inyo ngayon[a], upang lumakas kayo[b], makapasok, at ariin[c] ang lupaing tatawirin ninyo upang ariin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang buong utos.” Isahan ang “utos” ngunit kolektibo ang gamit nito, na tumutukoy sa kabuuan ng mga utos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mapalakas kayo.” Maaaring tumukoy ang pandiwang Hebreo sa pagiging malakas o sa pagkakaroon ng lakas.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “manahin” o “angkinin.” Iisang pandiwang Hebreo ang ginamit sa dalawang paglitaw ng “ariin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Kaya sundin ninyo
  rationale: Sa kontekstong tipan at kautusan, ang שׁמר ay nangangahulugang sundin o tuparin. Ipinahihiwatig ng “Kaya” ang kaugnayan nito sa naunang pangangatwiran.
- source_word: כָּל הַמִּצְוָה
  choice: ang lahat ng utos
  rationale: Bagaman isahan sa Hebreo ang מִצְוָה, kolektibo ang gamit nito kasama ng כָּל. Likas sa Filipino ang “lahat ng utos” at malinaw nitong ipinahahayag ang kabuuan ng mga ipinag-uutos.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: na ibinibigay ko sa inyo ngayon
  rationale: Ang “ibinibigay ko” ay natural na Filipino para sa kasalukuyang pag-uutos. Ginamit ang “sa inyo” upang tumugma sa kolektibong Israel na kausap, bagaman isahan ang hulapi sa Hebreo.
- source_word: לְמַעַן
  choice: upang
  rationale: Malinaw at marangal na pananda ng layunin o kinalabasan sa Filipino.
- source_word: תֶּחֶזְקוּ
  choice: lumakas kayo
  rationale: Pinananatili nito ang aspektong maging o maging lalong malakas, nang hindi nililimitahan ang kahulugan sa tapang na militar lamang.
- source_word: וּבָאתֶם
  choice: makapasok
  rationale: Sa konteksto ng pagpasok sa lupain, natural na katumbas ito ng בוא at maayos na kaugnay ng layuning ipinakilala ng “upang.”
- source_word: וִירִשְׁתֶּם / לְרִשְׁתָּהּ
  choice: ariin / upang ariin
  rationale: Maaaring mangahulugan ang ירשׁ ng magmana, magmay-ari, o angkinin. Ang “ariin” ay maikli, natural, at pinananatili ang pag-uulit ng parehong salitang Hebreo.
- source_word: הָאָרֶץ אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: ang lupaing tatawirin ninyo
  rationale: Ang “lupain” ay angkop sa heograpiko at tipang diwa ng הָאָרֶץ. Naipapahiwatig na sa pandiwang “tatawirin” ang direksiyong patungo roon, kaya hindi na kailangan ang tahasang “doon.”
theological_decisions:
- issue: Pagpapalit ng isahan at maramihang pagtukoy sa Israel
  choice: Gamitin ang likas na maramihang “ninyo/inyo/kayo” sa Filipino
  alternative: Markahan nang tahasan ang isahang kolektibong anyo sa pariralang “ibinibigay ko sa iyo”
  rationale: Kolektibong Israel ang kinakausap, at maramihan ang pangunahing mga pandiwa. Ang likas na maramihan sa Filipino ay malinaw nang hindi ginagawang indibidwal ang isang bahaging may isahang hulapi sa Hebreo.
- issue: Saklaw ng תֶּחֶזְקוּ
  choice: lumakas kayo
  alternative: palakasin kayo / magkaroon kayo ng tapang
  rationale: Pinananatili ng “lumakas” ang posibilidad ng pagiging malakas o pagkakaroon ng lakas, nang hindi tiyak na ipinapalagay kung panloob, ipinagkaloob, o partikular na militar ang lakas.
- issue: Kahulugan ng ירשׁ kaugnay ng lupain
  choice: ariin
  alternative: manahin / angkinin
  rationale: Hindi nilulutas nang labis ang tensiyon sa pagitan ng pagtanggap ng lupain bilang mana at aktuwal na pagkuha nito. Ang tala ay naglalantad ng mga leksikal na posibilidad.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “sundin” para sa wikang tipan at kautusan, “lupain” para sa heograpiko at teolohikal na konteksto, at pinanatili ang pag-uulit ng “ariin” upang katawanin ang pag-uulit sa Hebreo.
