base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/014.yaml
  text: then I will give the rain for your land in its season[a], the early rain and the late rain, and you will gather in your grain, your new wine[c][b], and your oil.
translation:
  language: tl
  text: Kung magkagayon, ibibigay ko ang ulan sa inyong lupain sa takdang panahon nito[a]—ang unang ulan at ang huling ulan—at titipunin mo ang iyong butil, alak na bagong gawa[b], at langis[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang naunang ulan at ang nahuling ulan.”'
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, alak na bagong gawa; maaari ring isaling “alak.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, langis ng olibo.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: kung magkagayon, ibibigay ko
  rationale: Ang unang panauhang pangako ng Diyos ay pinanatili. Ipinahihiwatig ng “kung magkagayon” ang bunga ng kondisyong nasa naunang talata, gaya ng gamit ng waw sa daloy ng pangungusap.
- source_word: מְטַר אַרְצְכֶם
  choice: ang ulan sa lupain ninyo
  rationale: Tumutukoy ito sa kinakailangang ulan para sa lupain ng Israel. Ang “lupain” ay mas angkop kaysa “bansa” sa kontekstong tipan at pagsasaka.
- source_word: בְּעִתּוֹ
  choice: sa takdang panahon nito
  rationale: Ipinahahayag nito ang angkop o itinakdang panahon ng pag-ulan, habang pinananatili ang panghalip na isahan ng Hebreo.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: ang unang ulan at ang huling ulan
  rationale: Pinananatili ang temporal na pagtutunggali ng mga pana-panahong ulan nang hindi nililimitahan ang salin sa mga katawagang pangklima na maaaring hindi agad maunawaan ng karaniwang mambabasa.
- source_word: וְאָסַפְתָּ
  choice: at titipunin mo
  rationale: Ang pandiwa ay literal na mangalap o magtipon ng ani. Pinananatili rin nito ang biglang paglipat ng Hebreo mula sa maramihang “ninyo” tungo sa isahang “mo,” na maaaring tumukoy sa Israel bilang kabuuang bayan.
- source_word: דְגָנֶךָ
  choice: ang iyong butil
  rationale: Ang “butil” ay malawak at likas na katumbas para sa ani ng mga halamang butil, nang hindi ito nililimitahan sa isang partikular na pananim.
- source_word: וְתִירֹשְׁךָ
  choice: bagong alak
  rationale: Karaniwang tumutukoy ang תִּירוֹשׁ sa bagong gawang alak o sariwang produkto ng ubas; pinananatili ng “bagong alak” ang kaibahan nito sa pangkalahatang katawagang alak.
- source_word: וְיִצְהָרֶךָ
  choice: langis
  rationale: Sa nakaugaliang tatluhang “butil, bagong alak, at langis,” tumutukoy ito sa langis ng olibo. Ang payak na “langis” ay malapit sa anyo ng Hebreo, at nililinaw sa talababa ang uri nito.
theological_decisions:
- issue: Pagpapalang pang-agrikultura sa konteksto ng tipan
  choice: Isinalin bilang kongkretong pangako ng napapanahong ulan at ani para sa Israel sa lupain.
  alternative: Basahin ang ulan at ani bilang pangunahing sagisag ng espirituwal, eskatolohikal, o materyal na kasaganaan para sa lahat ng mananampalataya.
  rationale: Tuwirang pang-agrikultura at pangtipan ang Hebreo. Hindi dapat ipasok sa salin ang mga susunod na simbolikong pagbasa o teolohiya ng kasaganaan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang agrikultural na larawan at ang paglipat ng Hebreo mula sa maramihang “ninyo” tungo sa isahang “mo,” sa halip na tahimik itong gawing pare-pareho.
