language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָתַתָּ֤ה אֶת הַ/בְּרָכָה֙ עַל הַ֣ר גְּרִזִ֔ים וְ/אֶת הַ/קְּלָלָ֖ה עַל הַ֥ר עֵיבָֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/029.yaml
  text: And when Yahweh your God brings you into the land that you are entering to possess[a], you shall set the blessing on Mount Gerizim and the curse on Mount Ebal.
translation:
  language: tl
  text: At kapag dinala ka ni Yahweh na iyong Diyos sa lupaing papasukan mo upang ariin, ilalagay mo ang pagpapala sa Bundok Gerizim at ang sumpa sa Bundok Ebal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ipahahayag mo ang pagpapala sa Bundok Gerizim at ang sumpa sa Bundok Ebal.” Literal na sinasabi ng Hebreo na “ilagay/ibigay”; ipinaliliwanag sa kalapit na talata ang eksaktong seremonyal na kilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At kapag
  rationale: Likas na panandang temporal sa makabagong Tagalog para sa Hebreong pormulang nagpapakilala ng isang pangyayari sa hinaharap.
- source_word: יְבִיאֲךָ
  choice: dinala ka ... sa
  rationale: Ang Hiphil ng בוא ay causative, ‘dalhin/papasukin.’ Sa sugnay na nagsisimula sa ‘kapag,’ natural sa Tagalog ang aspektong kontemplatibo na ‘dinala’ upang tumukoy sa katuparan ng pangyayari sa hinaharap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang ipinapahayag ng anyong construct na may hulaping ikalawang panauhang isahan ang kaugnayang ‘iyong Diyos.’
- source_word: הָאָרֶץ
  choice: lupain
  rationale: Sa konteksto ng Deuteronomio, tumutukoy ito sa lupaing aangkinin ng Israel; mas tiyak at natural dito ang ‘lupain’ kaysa pangkalahatang ‘lupa.’
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: papasukan mo
  rationale: Ipinahihiwatig ng participle na בָא at ng directional na שָׁמָּה ang nalalapit na pagpasok. Ang ‘papasukan mo’ ay natural at pinananatili ang direksiyonal na diwa.
- source_word: לְרִשְׁתָּהּ
  choice: upang ariin
  rationale: Ang ירשׁ ay tumutukoy sa pag-angkin o pagkuha ng lupain bilang pag-aari; maikli at malinaw ang ‘ariin’ nang hindi inaalis ang tema ng lupang tipan.
- source_word: וְנָתַתָּה
  choice: ilalagay mo
  rationale: Ang נתן ay literal na ‘ibigay/ilagay.’ Pinananatili ng ‘ilalagay’ ang kongkretong pananalita at hindi agad tinutukoy kung pagbigkas o ibang seremonyal na kilos ang eksaktong ibig sabihin.
- source_word: הַבְּרָכָה
  choice: ang pagpapala
  rationale: Karaniwang katumbas ng tiyak na pangngalang tumutukoy sa pagpapala ng tipan.
- source_word: עַל הַר גְּרִזִים
  choice: sa Bundok Gerizim
  rationale: Natural na Tagalog para sa lokasyong ipinahahayag ng עַל kaugnay ng bundok.
- source_word: הַקְּלָלָה
  choice: ang sumpa
  rationale: Natural at malinaw na kasalungat ng ‘pagpapala’ sa konteksto ng tipan.
- source_word: עַל הַר עֵיבָל
  choice: sa Bundok Ebal
  rationale: Pinananatili ang parallel na heograpikong parirala na katapat ng Bundok Gerizim.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Ang ‘Yahweh’ ay nagpapanatili sa personal na pangalan sa halip na palitan ito ng titulo.
- issue: Eksaktong kilos na kaugnay ng pagpapala at sumpa
  choice: ilalagay mo ang pagpapala ... at ang sumpa
  alternative: ipahahayag mo ang pagpapala ... at ang sumpa
  rationale: Ang Hebreo ay gumagamit ng נתן, ‘ibigay/ilagay.’ Pinananatili sa pangunahing teksto ang kongkretong salita at inilalagay sa talababa ang posibleng seremonyal na kahulugang ‘ipahayag,’ sapagkat nililinaw ng kalapit na konteksto ang pagsasagawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang ikalawang panauhang isahan sa ‘ka/mo,’ ang personal na pangalang ‘Yahweh,’ at ang konkretong kalabuan ng pandiwang נתן. Inilagay ang marker na [a] sa pangungusap na tinutukoy ng talababa.
