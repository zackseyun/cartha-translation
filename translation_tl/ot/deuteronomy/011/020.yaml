  text: And you shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: tl
  text: At isulat ninyo ang mga iyon sa mga hamba ng pintuan ng inyong bahay at sa inyong mga tarangkahan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: At isulat ninyo ang mga iyon
  rationale: Ang Qal perfect na may pang-ugnay ay nagpapatuloy sa serye ng mga utos; natural sa Filipino ang pautos na “isulat ninyo.” Ang hulaping 3mp ay tumutukoy sa naunang binanggit na mga salita, kaya isinalin itong “ang mga iyon.”
- source_word: עַל
  choice: sa
  rationale: Sa Filipino, ang “sa” ang likas na panandang ginagamit para sa pagsulat sa ibabaw o bahagi ng isang bagay; malinaw ang aktuwal na ugnayan mula sa konteksto.
- source_word: מְזוּזוֹת
  choice: mga hamba ng pintuan
  rationale: Tumutukoy ang pangngalan sa mga patayong poste sa magkabilang gilid ng pasukan. Ang “mga hamba ng pintuan” ay tiyak, natural, at hindi nag-aangkat ng kahulugan ng mas huling tradisyong mezuzah.
- source_word: בֵּיתֶךָ
  choice: ng inyong bahay
  rationale: Pinananatili ng “bahay” ang kongkretong kahulugan ng בַּיִת at ang kontekstong sambahayan.
- source_word: וּבִשְׁעָרֶיךָ
  choice: at sa inyong mga pintuang-bayan
  rationale: Ang שַׁעַר ay maaaring tumukoy sa tarangkahan o pook ng pasukan, lalo na ng isang pamayanan. Sa kontekstong kasunod ng bahay at dahil maramihan ang anyo, ipinahihiwatig ng “mga pintuang-bayan” ang pampamayanang mga pasukan habang pinananatili sa talababa ang mas pangkalahatang alternatibo.
