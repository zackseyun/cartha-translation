  yaml_path: translation/ot/deuteronomy/011/015.yaml
  text: And I will give grass in your field for your livestock[b][a], and you will eat and be satisfied.
translation:
  language: tl
  text: At magbibigay ako ng damo sa iyong bukid para sa iyong mga alagang hayop[a], at kakain ka at mabubusog[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga halaman” o “pananim.” Malawak ang maaaring saklaw ng salitang Hebreo, ngunit malamang na tumutukoy ito rito sa pagkaing tumutubo para sa mga alagang hayop.
    reason: lexical_alternative
  - marker: b
    text: O “mapupuno ang iyong tiyan.” Ang pandiwang Hebreo ay tumutukoy sa pagiging puno o nasiyahan matapos kumain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: At magbibigay ako
  rationale: Ang Qal perfect na unang panauhang isahan, na may pang-ugnay, ay tumutukoy rito sa ipinangakong gagawin sa hinaharap. Pinananatili ng “At” ang pagkakasunod nito sa naunang konteksto.
- source_word: עֵשֶׂב
  choice: damo
  rationale: Maaaring tumukoy ang salita sa sari-saring halamang tumutubo, ngunit sa pariralang para sa mga alagang hayop, ang natural at tiyak na diwa ay damong nagsisilbing pagkain ng mga ito.
- source_word: בְּשָׂדְךָ
  choice: sa iyong bukid
  rationale: Pinananatili ng “bukid” ang kongkreto at agrikultural na kahulugan ng שָׂדֶה, pati ang anyong isahan ng parirala.
- source_word: לִבְהֶמְתֶּךָ
  choice: para sa iyong mga alagang hayop
  rationale: Ang בְּהֵמָה ay kolektibong tumutukoy sa mga domestikadong hayop. Natural sa modernong Filipino ang “mga alagang hayop” at hindi ito nililimitahan sa baka lamang.
- source_word: וְאָכַלְתָּ
  choice: at kakain ka
  rationale: Ang pandiwa ay ikalawang panauhang panlalaking isahan at bahagi ng sunod-sunod na pangako, kaya ang aspektong panghinaharap na “kakain ka” angkop sa konteksto.
- source_word: וְשָׂבָעְתָּ
  choice: at mabubusog
  rationale: Ipinahihiwatig ng pandiwa ang pagiging puno o nasiyahan matapos kumain. Ang “mabubusog” ay tuwiran, natural, at akma sa pisikal na pagkain sa konteksto.
theological_decisions:
- issue: Isahang pakikipag-usap sa Israel bilang kinatawan ng buong bayan
  choice: 'Panatilihin ang ikalawang panauhang isahan: “iyong bukid,” “iyong mga alagang hayop,” at “kakain ka”'
  alternative: 'Gawing maramihan ang kausap: “inyong mga bukid ... kakain kayo”'
  rationale: Pawang ikalawang panauhang panlalaking isahan ang mga anyong Hebreo. Napapanatili ng isahan sa Filipino ang anyo at retorikal na lakas ng tipanang pakikipag-usap sa Israel.
- issue: Kalikasan ng ipinangakong pagpapala
  choice: Isalin bilang karaniwang paglalaang agrikultural sa loob ng tipan nang walang pagpapalawak ng kahulugan
  alternative: Ipaliwanag nang tahasan bilang pangkalahatang kasaganaan o materyal na pag-unlad
  rationale: Ang talata ay partikular na nangangako ng pananim para sa mga hayop at pagkain na magdudulot ng kabusugan. Hindi dapat idagdag ang mas malawak na teolohiya ng kasaganaan na hindi tahasang sinasabi rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iyong” sa halip na “mong” upang mapanatili ang bahagyang pormal na himig ng Kasulatan, ngunit nananatiling madaling maunawaan. Ang “mga alagang hayop” ay natural na katumbas ng kolektibong terminong agrikultural.
