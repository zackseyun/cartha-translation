  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/שָׁמַרְתָּ֣ מִשְׁמַרְתּ֗/וֹ וְ/חֻקֹּתָ֧י/ו וּ/מִשְׁפָּטָ֛י/ו וּ/מִצְוֺתָ֖י/ו כָּל הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/001.yaml
  text: Therefore you shall love Yahweh your God and keep his charge[a], his statutes, his judgments[b], and his commandments all your days.
translation:
  language: tl
  text: Kaya[a] mahalin mo si Yahweh na iyong Diyos at sundin mo ang kanyang mga tagubilin, mga tuntunin, mga pasiya[b], at mga utos sa buong buhay mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “At mahalin mo si Yahweh na iyong Diyos.” Maaaring isalin ang pang-ugnay sa Hebreo bilang simpleng “at”; dito, isinalin itong “kaya” dahil ipinahihiwatig ng konteksto na bunga ito ng naunang sinabi.
    reason: alternative_reading
  - marker: b
    text: O “mga ordinansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָהַבְתָּ
  choice: Kaya ibigin mo
  rationale: Ang אָהַב ay nangangahulugang “umibig.” Maaaring simpleng “at” ang ו, ngunit sa konteksto ay inilalahad ng talata ang bunga ng naunang pangangatwiran; natural na naipapahayag ito ng “kaya.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang ipinapahayag ng anyong may hulaping ikalawang panauhang panlalaki ang “iyong Diyos,” na nagpapanatili sa ugnayang tipan sa Hebreo.
- source_word: וְ/שָׁמַרְתָּ
  choice: at tuparin mo
  rationale: Ang שׁמר ay maaaring mangahulugang ingatan, sundin, o tuparin. Sa kontekstong tumutukoy sa mga kahilingan at batas ng Diyos, malinaw at natural ang “tuparin.”
- source_word: מִשְׁמַרְתּוֹ
  choice: ang kanyang ipinagagawa
  rationale: Ang מִשְׁמֶרֶת ay tumutukoy sa iniatas na pananagutan o bagay na dapat sundin. Ipinahahayag ng “kanyang ipinagagawa” ang diwa nito sa natural na modernong Tagalog nang hindi ito ipinapantay sa kasunod na “mga utos.”
- source_word: חֻקֹּתָיו
  choice: ang kanyang mga tuntunin
  rationale: Ang חֻקָּה ay isang itinakdang tuntunin o batas. Ang “mga tuntunin” ay malinaw sa karaniwang mambabasa at nananatiling iba sa “mga hatol” at “mga utos.”
- source_word: וּמִשְׁפָּטָיו
  choice: mga hatol
  rationale: Maaaring tumukoy ang מִשְׁפָּט sa hatol, pasiya, o ordinansa. Pinananatili ng “mga hatol” ang natatanging legal na kategorya ng salita, bagaman ibinibigay sa talababa ang “mga ordinansa” bilang alternatibo.
- source_word: וּמִצְוֺתָיו
  choice: mga utos
  rationale: Ang מִצְוָה ang karaniwang salita para sa utos o kautusan. Ang “mga utos” ay tuwiran, natural, at angkop sa legal na konteksto.
- source_word: כָּל הַיָּמִים
  choice: sa buong buhay mo
  rationale: Literal itong “lahat ng mga araw.” Dahil nasa ikalawang panauhan ang buong pahayag, natural na ipinahahayag ng “sa buong buhay mo” ang patuloy at panghabambuhay na saklaw nito.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang mismong nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “ang PANGINOON.”
- issue: Saklaw ng legal na katawagang מִשְׁפָּטָיו
  choice: mga hatol
  alternative: mga ordinansa; mga pasiya
  rationale: Hindi nilulutas ng salin ang malawak na semantikong saklaw ng salita sa isang pangkalahatang “mga tuntunin.” Pinananatili ng “mga hatol” ang pagkakaiba nito sa חֻקֹּתָיו at מִצְוֺתָיו, habang kinikilala sa talababa ang isa pang posibleng salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “iyong” sa pariralang “iyong Diyos” upang mapanatili ang pormal at tipanang himig, samantalang pinili ang natural na “sa buong buhay mo” para sa literal na “lahat ng mga araw.”
