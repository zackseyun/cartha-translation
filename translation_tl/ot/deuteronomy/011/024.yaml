base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/024.yaml
  text: Every place where the sole of your foot treads will be yours; from the wilderness and Lebanon[a], from the River, the Euphrates River, as far as the western sea, will be your border.
translation:
  language: tl
  text: Ang bawat lugar na tatapakan ng talampakan ng inyong paa ay mapapasainyo; mula sa ilang at Lebanon, mula sa Ilog—ang Ilog Eufrates—hanggang sa dagat sa kanluran[a] ay magiging hangganan ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “dagat sa hulihan” o “dagat sa huli”; karaniwang nauunawaan na tumutukoy sa Dagat Mediteraneo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַמָּקוֹם
  choice: Bawat dako
  rationale: Ipinahahayag nito ang distributibong diwa ng bawat lugar, sa natural at marangal na Tagalog.
- source_word: אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ
  choice: tapakan ng talampakan ng inyong paa
  rationale: Pinananatili ang konkretong larawan ng כַּף רֶגֶל bilang talampakan at ang דרך bilang pagtapak.
- source_word: לָכֶם יִהְיֶה
  choice: ay mapapasainyo
  rationale: Maikli at likas na pahayag ng ipinangakong pag-aari o pagkakaloob.
- source_word: מִן הַמִּדְבָּר
  choice: mula sa ilang
  rationale: Ang “ilang” ay malawak na katumbas ng מִדְבָּר at hindi labis na nagtatakda na tuyong disyerto lamang ang tinutukoy.
- source_word: וְהַלְּבָנוֹן
  choice: at Lebanon
  rationale: Pinananatili ang payak na pagkakaugnay ng mga heograpikong palatandaan sa tekstong Hebreo, sa halip na gawing tahasang “hanggang Lebanon.”
- source_word: מִן הַנָּהָר נְהַר פְּרָת
  choice: mula sa Ilog—ang Ilog Eufrates
  rationale: Pinananatili ang pangkalahatang titulong “ang Ilog” at ang kasunod na pagkakakilanlan dito bilang Eufrates.
- source_word: וְעַד הַיָּם הָאַחֲרוֹן
  choice: hanggang sa dagat sa kanluran
  rationale: Sa heograpikong oryentasyong Hebreo, ang “dagat sa hulihan” ay ang dagat sa kanluran; malinaw ito sa makabagong Tagalog habang inilalagay sa talababa ang literal na anyo.
- source_word: יִהְיֶה גְּבֻלְכֶם
  choice: ang magiging hangganan ninyo
  rationale: Ang “hangganan” ay natural na katumbas ng גְּבוּל sa pormulang naglalarawan ng lawak ng lupain.
theological_decisions:
- issue: Pangako tungkol sa heograpikong lupain
  choice: Isinalin bilang pangako ng teritoryo at paglalarawan ng mga hangganan.
  alternative: Ipaliwanag ito bilang huwarang hangganan o bilang walang-kondisyong pag-aari magpakailanman.
  rationale: Tahasan lamang na inilalahad ng talata ang ipinangakong lawak ng lupain; hindi nito nilulutas ang mga susunod na usaping teolohiko tungkol sa katuparan, tagal, o tipolohiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong larawan ng pagtapak at ang bahagyang di-karaniwang pagkakasunod-sunod ng mga hangganan sa Hebreo, ngunit gumamit ng bantas upang maging madaling basahin.
