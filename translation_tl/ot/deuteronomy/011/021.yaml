base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/021.yaml
  text: so that your days and the days of your sons may be multiplied on the land that Yahweh swore to your fathers to give them[b][a], as the days of the heavens above the earth.
translation:
  language: tl
  text: upang humaba ang inyong mga araw at ang mga araw ng inyong mga anak na lalaki sa lupain na taimtim na ipinangako ni Yahweh sa inyong mga ninuno na ibibigay niya sa kanila—gaya ng mga araw ng langit sa ibabaw ng lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hangga't nasa ibabaw ng lupa ang langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: upang
  rationale: Likas at malinaw na nagpapahayag ng layunin o bunga ng mga naunang utos.
- source_word: יִרְבּוּ יְמֵיכֶם
  choice: humaba ang inyong mga araw
  rationale: Ang literal na diwang 'dumami ang mga araw' ay isang Hebreong idyoma para sa mahabang buhay; pinananatili ng 'humaba ang inyong mga araw' ang larawan habang natural sa Tagalog.
- source_word: וִימֵי בְנֵיכֶם
  choice: at ang mga araw ng inyong mga anak na lalaki
  rationale: Tumpak na sinasalamin ang tahasang panlalaking maramihan na בְנֵיכֶם; hindi ito tahimik na ginawang neutral.
- source_word: עַל הָאֲדָמָה
  choice: sa lupain
  rationale: Sa konteksto ng Deuteronomio, tumutukoy ito sa ipinangakong lupain; mas natural ang 'sa' kaysa literal na 'sa ibabaw ng' dito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na nakasulat sa tekstong Hebreo.
- source_word: לַאֲבֹתֵיכֶם
  choice: sa inyong mga ninuno
  rationale: Natural sa modernong Tagalog at saklaw ang mga naunang salinlahing tinutukoy ng Hebreong אָבוֹת.
- source_word: לָתֵת לָהֶם
  choice: na ibibigay sa kanila
  rationale: Pinananatili ang panghalip na 'sa kanila' nang hindi nagdaragdag ng tahasang bagay na wala sa Hebreo.
- source_word: כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ
  choice: gaya ng mga araw ng langit sa ibabaw ng lupa
  rationale: Pinananatili ang kakaiba at makatang paghahambing sa Hebreo sa halip na agad itong gawing paliwanag tungkol sa haba ng panahon.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Nasa orihinal ang Tetragrammaton bilang tiyak na pangalan; ang 'Yahweh' ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulo.
- issue: Kasarian at saklaw ng בְנֵיכֶם
  choice: inyong mga anak na lalaki
  alternative: inyong mga anak
  rationale: Tahasan ang anyong panlalaking maramihan sa Hebreo. Pinananatili ito sa pangunahing teksto nang hindi ipinapalagay kung kinakatawan din nito ang lahat ng anak.
- issue: Kahulugan ng pangwakas na paghahambing
  choice: gaya ng mga araw ng langit sa ibabaw ng lupa
  alternative: hangga't nasa ibabaw ng lupa ang langit
  rationale: Ang Hebreo ay maaaring basahin bilang makatang paghahambing o idyoma ng napakahabang pananatili. Hindi tahimik na nilulutas ng pangunahing teksto ang tensiyong ito; ibinibigay ang idiomatikong pagbasa sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'humaba ang inyong mga araw' upang maging natural nang hindi tuluyang inaalis ang larawan ng Hebreo. Ang mas literal na 'mga anak na lalaki' at ang makatang hulíng parirala ay sadyang pinanatili upang hindi patagin ang tunay na detalye at ambiguwidad ng teksto.
