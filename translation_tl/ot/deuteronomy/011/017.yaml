source:
  edition: WLC
  text: וְ/חָרָ֨ה אַף יְהוָ֜ה בָּ/כֶ֗ם וְ/עָצַ֤ר אֶת הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הָ֣/אֲדָמָ֔ה לֹ֥א תִתֵּ֖ן אֶת יְבוּלָ֑/הּ וַ/אֲבַדְתֶּ֣ם מְהֵרָ֗ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁ֥ר יְהוָ֖ה נֹתֵ֥ן לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/017.yaml
  text: Then Yahweh’s anger will burn against you[a], and he will shut up the heavens so that there will be no rain, and the ground will not yield its produce; and you will perish quickly from the good land that Yahweh is giving you.
translation:
  language: tl
  text: Kung magkagayon, mag-aalab laban sa inyo ang galit ni Yahweh[a]. Isasara niya ang langit upang hindi umulan, at hindi magbibigay ng ani ang lupa. At agad kayong mawawala sa mabuting lupain na ibinibigay sa inyo ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mag-aalab laban sa inyo ang ilong/galit ni Yahweh,” isang idyoma para sa matinding galit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַף יְהוָה בָכֶם
  choice: Kung magkagayon, mag-aalab laban sa inyo ang galit ni Yahweh
  rationale: Ang חָרָה אַף ay idyomang Hebreo para sa matinding galit na nag-aalab. Pinananatili ng salin ang metapora sa natural na Tagalog; ang “Kung magkagayon” ay nagpapakita ng bunga ng naunang babala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh, hindi pinapalitan ng isang titulo.
- source_word: וְעָצַר אֶת הַשָּׁמַיִם
  choice: Isasara niya ang langit
  rationale: Inilalarawan ng pandiwa ang pagpigil sa ulan na para bang isinasara ang langit; pinananatili ang larawang ito nang malinaw at natural.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: upang hindi umulan
  rationale: Ipinahahayag ang bunga ng pagsasara sa langit sa karaniwang modernong Tagalog.
- source_word: וְהָאֲדָמָה לֹא תִתֵּן אֶת יְבוּלָהּ
  choice: at hindi magbibigay ng ani ang lupa
  rationale: Ang אֲדָמָה ay lupang tinataniman, at ang יְבוּל ay ani o bunga nito. Ang parirala ay tuwiran at likas sa Tagalog.
- source_word: וַאֲבַדְתֶּם מְהֵרָה
  choice: Mabilis kayong mapapawi
  rationale: Ang אבד ay maaaring tumukoy sa pagkapahamak o pagkawala ng bayan sa lupain. Ang “mapapawi” ay nagpapanatili sa tindi at lawak ng kahulugan nang hindi tinutukoy ang eksaktong paraan.
- source_word: מֵעַל הָאָרֶץ הַטֹּבָה
  choice: mula sa mabuting lupain
  rationale: Ipinahihiwatig ng מֵעַל ang pag-aalis mula sa lupain. Sapat at natural sa Tagalog ang “mula sa mabuting lupain.”
- source_word: אֲשֶׁר יְהוָה נֹתֵן לָכֶם
  choice: na ibinibigay sa inyo ni Yahweh
  rationale: Ang participle נֹתֵן ay angkop na isalin sa aspektong nagaganap, na binibigyang-diin ang kasalukuyang pagkakaloob ng lupain.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Antropomorpikong idyoma ng galit
  choice: mag-aalab laban sa inyo ang galit ni Yahweh
  alternative: magagalit sa inyo si Yahweh
  rationale: Pinananatili ang metapora ng nag-aalab na galit nang hindi dinaragdagan o nilulutas ang teolohikal na tensiyon ng teksto.
- issue: Saklaw ng וַאֲבַדְתֶּם
  choice: mapapawi mula sa mabuting lupain
  alternative: mamamatay; lilipulin; mawawala
  rationale: Hindi tiyak sa talata kung kamatayan, pagkalipol, o pag-aalis sa lupain ang buong mekanismo. Ang “mapapawi mula” ay nagpapanatili sa malawak at matinding pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang metapora ng nag-aalab na galit at ang larawan ng pagsasara sa langit; iniwasan ang sobrang teknikal o lumang pananalita.
