  text: וּ/לְמַ֨עַן תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֧ה לַ/אֲבֹתֵי/כֶ֛ם לָ/תֵ֥ת לָ/הֶ֖ם וּ/לְ/זַרְעָ֑/ם אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/009.yaml
  text: so that you may live long on the land that Yahweh swore to your fathers to give to them and to their offspring[b][a], a land flowing with milk and honey.
translation:
  language: tl
  text: upang mabuhay kayo nang matagal sa lupaing ipinangako ni Yahweh sa inyong mga ninuno[a] sa pamamagitan ng panunumpa na ibibigay niya sa kanila at sa kanilang lahi[b]—isang lupaing umaapaw sa gatas at pulot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga ama ninyo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kanilang binhi” o “kanilang mga inapo.” Ang salitang Hebreo ay kolektibong tumutukoy sa mga nagmula sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמַעַן
  choice: upang
  rationale: Likas na nagpapahayag ng layunin o bunga sa modernong Tagalog.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: mabuhay kayo nang matagal
  rationale: Natural na salin ng idyomang Hebreo na literal na tumutukoy sa pagpapahaba ng mga araw.
- source_word: עַל הָאֲדָמָה
  choice: sa lupain
  rationale: Sa konteksto ng Deuteronomio, tumutukoy ito sa ipinangakong teritoryo, hindi lamang sa lupa o soil.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: na isinumpa ni Yahweh
  rationale: Pinananatiling tahasan ang panunumpa at ang tipanang pangalan ng Diyos.
- source_word: לַאֲבֹתֵיכֶם
  choice: sa inyong mga ninuno
  rationale: Mas natural sa Tagalog sa kontekstong tumutukoy sa mga naunang salinlahi; itinatala sa talababa ang literal na 'mga ama.'
- source_word: לָתֵת לָהֶם וּלְזַרְעָם
  choice: na ibibigay niya sa kanila at sa kanilang lahi
  rationale: Ang 'lahi' ay likas na kolektibong katawagan at pinananatili ang saklaw ng זֶרַע nang hindi nililimitahan sa iisang inapo.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: isang lupaing dinadaluyan ng gatas at pulot
  rationale: Pinananatili ang larawang Hebreo ng kasaganaan; ang 'pulot' ay hindi labis na nagtatakda kung pulot-pukyutan o ibang matamis na katas ang tinutukoy.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Direktang ginagamit sa talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang natatanging pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Ang mga tumanggap ng lupain sa pormulang pangako
  choice: sa kanila at sa kanilang lahi
  alternative: sa kanilang lahi lamang
  rationale: Pinananatili ang dalawang tahasang layon ng Hebreo—ang mga ninuno at ang kanilang lahi—nang hindi nilulutas ang tensiyon kung paano natupad sa mga ninuno mismo ang pangako.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang 'ninuno' at 'lahi' para sa natural na daloy, habang inilagay sa mga talababa ang mas literal na anyo. Pinanatili ang taimtim na wikang panunumpa at ang matalinghagang paglalarawan sa lupain.
