  naturalness: Likas at marangal ang kabuuang rehistro. Ang «ipinangako ni Yahweh ... sa pamamagitan ng panunumpa» ay malinaw at natural na Filipino, habang tahasang pinananatili ang semantikong puwersa ng Hebreong pandiwang ‘sumumpa.’ Ang «umaapaw sa gatas at pulot» ay isang likas na Tagalog na pagpapanatili ng matalinghagang larawan ng masaganang lupain.
  terminology: Ang «Yahweh» ay wastong pinananatili para sa יהוה. Ang «mga ninuno» at «lahi» ay angkop na natural na kolektibong salin ng mga ama at binhi/supling, na may talababa para sa mas literal na mga posibilidad.
