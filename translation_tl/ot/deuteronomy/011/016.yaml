  text: Be careful lest your heart be deceived and you turn aside and serve other gods and bow down to them[a].
translation:
  language: tl
  text: Mag-ingat kayo, baka malinlang ang inyong puso at lumihis kayo at maglingkod kayo sa ibang mga diyos at yumukod sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “baka maakit ang inyong puso.” Ang pandiwang Hebreo ay maaaring mangahulugang mahikayat, maakit, o malinlang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Mag-ingat kayo
  rationale: Ang Nifal na pautos kasama ng לָכֶם ay isang pansariling pormula ng babala. Likas at tuwiran sa modernong Tagalog ang “Mag-ingat kayo,” at hindi kailangan ang artipisyal na “para sa inyong sarili.”
- source_word: פֶּן
  choice: baka
  rationale: Nagpapakilala ito ng negatibong posibilidad na siyang layon ng babala. Ang “baka” ang natural na katumbas sa Tagalog at pinananatili ang bigat ng pag-iingat.
- source_word: יִפְתֶּה
  choice: malinlang
  rationale: Maaaring tumukoy ang פתה sa paghikayat, pang-aakit, o panlilinlang. Ang “malinlang” ay maayos na tumutugma sa pusong simuno at pinananatili ang panganib ng panloob na pagkadaya; nasa talababa ang lehitimong alternatibong diwa.
- source_word: לְבַבְכֶם
  choice: ang inyong puso
  rationale: Saklaw ng לֵבָב ang kalooban, pag-iisip, at pagpapasya ng panloob na pagkatao. Pinananatili ng “puso” ang konkretong larawan at wikang tipan.
- source_word: וְסַרְתֶּם
  choice: at lumihis kayo
  rationale: Sa kontekstong ito, ang סור ay paglihis mula sa wastong landas o katapatan. Natural sa Tagalog ang “lumihis” at hindi nito ipinapaliwanag nang labis ang larawan.
- source_word: וַעֲבַדְתֶּם
  choice: maglingkod
  rationale: Ang עבד kapag inuugnay sa mga diyos ay paglilingkod bilang debosyon. Pinananatili ng “maglingkod” ang kaibahan nito sa kasunod na kongkretong kilos ng pagyukod.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: sa ibang mga diyos
  rationale: Tuwirang katumbas ito ng parirala at hindi idinaragdag ang mas interpretatibong ideya ng “mga diyos ng ibang bayan.”
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: at yumukod sa kanila
  rationale: Ang השתחוה ay literal na pagyukod o pagpapatirapa, karaniwan bilang pagsamba. Inilalarawan ng “yumukod sa kanila” ang kongkretong kilos habang malinaw sa konteksto ang kahulugang panrelihiyon.
theological_decisions:
- issue: Kalikasan ng babala laban sa pagtalikod
  choice: Pinananatili ang pagkakasunod mula sa pagkalinlang ng puso, tungo sa paglihis, paglilingkod sa ibang mga diyos, at pagyukod sa kanila.
  alternative: Maaaring ibuod nang mas interpretatibo bilang pagkaakit tungo sa pagsamba sa mga diyus-diyosan.
  rationale: Ang tekstong Hebreo ay naglalahad ng malinaw na pag-unlad mula sa panloob na panganib tungo sa hayag na pagtataksil sa tipan. Hindi ito dapat gawing isang abstraktong terminong teolohikal lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pangmaramihang “kayo/inyong” upang ipakita na buong Israel ang kinakausap. Iniwasan ang sobrang pormal o lipas na pananalita at pinanatili ang magkakahiwalay na kilos sa Hebreo.
