  text: וַ/אֲשֶׁ֥ר עָשָׂ֛ה לָ/כֶ֖ם בַּ/מִּדְבָּ֑ר עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/005.yaml
  text: and what he did for you in the wilderness until you came to this place—
translation:
  language: tl
  text: at ang ginawa niya para sa inyo sa ilang hanggang sa makarating kayo sa lugar na ito—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: at ang ginawa
  rationale: Ipinagpapatuloy nito ang naunang talaan ng mga gawa ng Diyos. Likas sa Tagalog ang nominalized na pariralang “ang ginawa” at napapanatili nito ang diwa ng relative construction.
- source_word: עָשָׂה
  choice: ginawa niya
  rationale: Ang עשה ay karaniwang nangangahulugang “gumawa.” Sa konteksto, tumutukoy ito sa mga ginawa ng PANGINOON para sa Israel.
- source_word: לָכֶם
  choice: para sa inyo
  rationale: Ipinahihiwatig ng ל dito na ang pagkilos ay para sa kapakanan ng Israel; mas natural ito kaysa “sa inyo” sa pangungusap na ito.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay isang dignido at kilalang salitang Tagalog para sa lupaing masukal o tigang na malayo sa mga pamayanan, at angkop sa panahon ng paglalakbay ng Israel.
- source_word: עַד
  choice: hanggang sa
  rationale: 'Ang unang עַד ay nagsasaad ng hangganang temporal: nagpatuloy ang tinutukoy na panahon hanggang sa kanilang pagdating.'
- source_word: בֹּאֲכֶם
  choice: makarating kayo
  rationale: Ang infinitive construct ng בוא na may hulaping pangmaramihan ay natural na isinasalin bilang sugnay na “makarating kayo.” Binibigyang-diin nito ang pagdating, hindi kinakailangang pagpasok sa isang nasasakupang lupain.
- source_word: עַד הַמָּקוֹם הַזֶּה
  choice: sa lugar na ito
  rationale: Ang ikalawang עַד ay spatial at nakapaloob nang natural sa Tagalog na “hanggang sa makarating kayo sa lugar na ito,” nang hindi inuulit nang alanganin ang “hanggang.”
theological_decisions:
- issue: Hindi hayag na simuno ng עָשָׂה
  choice: “niya,” na tumutukoy sa PANGINOON ayon sa nakapaligid na konteksto
  alternative: Ulitin ang “PANGINOON”
  rationale: Malinaw sa mas malawak na pangungusap na ang PANGINOON ang simuno. Pinananatili ng panghalip ang ugnayan sa konteksto nang hindi nagdaragdag ng hindi nasa talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “ilang” bilang maikli at nakaugaliang katawagan sa biblikal na wilderness. Pinanatili ang em dash dahil nagpapatuloy ang sintaktikong talaan sa kasunod na talata.
