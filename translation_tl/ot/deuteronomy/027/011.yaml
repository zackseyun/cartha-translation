  text: And on that day Moses commanded the people, saying,
translation:
  language: tl
  text: 'Noong araw na iyon, inutusan ni Moises ang bayan:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: iniutos
  rationale: Ang pandiwang צוה ay nagpapahayag ng makapangyarihang pag-uutos. Likas at malinaw sa modernong Tagalog ang “iniutos” at hindi nito pinahihina ang puwersa ng salita.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakaugaliang anyo ng pangalang משה sa Tagalog.
- source_word: אֶת הָעָם
  choice: sa bayan
  rationale: Tumutukoy ang עָם sa buong sambayanan ng Israel. Sa pariralang “iniutos ... sa,” natural sa Tagalog ang “sa bayan” at naaangkop sa marangal na rehistro.
- source_word: בַּיּוֹם הַהוּא
  choice: Nang araw na iyon
  rationale: Pinananatili nito ang tiyak na panandang temporal ng Hebreo sa natural na ayos ng salaysay sa Tagalog.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ipinakikilala ng לֵאמֹר ang nilalaman ng utos na sumusunod. Sa modernong Tagalog, higit na natural ang tutuldok kaysa literal na “na sinasabi,” habang napapanatili ang tungkulin nito sa diskurso.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “bayan” bilang kolektibong tawag sa Israel; walang idinagdag na denominasyonal na pagpapakahulugan.
