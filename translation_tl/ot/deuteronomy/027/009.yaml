- from: Pagkatapos, nagsalita si Moises at ang mga Levitang pari sa buong Israel. Sinabi nila, “Tumahimik kayo at makinig, Israel![a] Sa araw na ito, kayo ay naging isang bayang para kay Yahweh na inyong Diyos.[b]”
  to: Pagkatapos, nagsalita si Moises at ang mga Levitang pari sa buong Israel, na nagsasabi, “Tumahimik kayo at makinig[a], Israel! Sa araw na ito, kayo ay naging isang bayan ni Yahweh, na inyong Diyos.[b]”
