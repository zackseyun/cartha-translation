  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ וְ/הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֔ם אֶ֥ל כָּל יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַסְכֵּ֤ת וּ/שְׁמַע֙ יִשְׂרָאֵ֔ל הַ/יּ֤וֹם הַ/זֶּה֙ נִהְיֵ֣יתָֽ לְ/עָ֔ם לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/009.yaml
  text: 'Then Moses and the Levitical priests spoke to all Israel[a], saying, “Be silent and listen[b], Israel: today you have become a people for Yahweh your God.”'
translation:
  language: tl
  text: Pagkatapos, nagsalita si Moises at ang mga Levitang pari sa buong Israel, na nagsasabi, “Tumahimik kayo at makinig[a], Israel! Sa araw na ito, kayo ay naging isang bayan ni Yahweh, na inyong Diyos.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Magbigay-pansin kayo at makinig.” Maaaring idiin ng utos sa Hebreo ang pananahimik o ang matamang pakikinig.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kayo ay naging isang bayang pag-aari ni Yahweh na inyong Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Tagalog ang “Pagkatapos, nagsalita” at pinananatili nito ang kilos ng pagsasalita.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: ang mga Levitang pari
  rationale: Tinutukoy ng magkaugnay na katawagan ang mga paring kinikilalang mga Levita. Maikli at natural ang “mga Levitang pari.”
- source_word: כָּל יִשְׂרָאֵל
  choice: sa buong Israel
  rationale: Pinananatili nito ang kolektibong pagtukoy sa lahat ng Israel.
- source_word: הַסְכֵּת וּשְׁמַע
  choice: Tumahimik kayo at makinig
  rationale: Maaaring tumukoy ang bihirang pandiwang סכת sa pananahimik o matamang pagbibigay-pansin. Pinananatili ng salin ang konkretong diwa ng pananahimik, samantalang ang “makinig” ay malinaw na naghahayag ng masusing pagtanggap sa sasabihin.
- source_word: הַיּוֹם הַזֶּה
  choice: Sa araw na ito
  rationale: Natural at marangal itong katumbas ng deiktikong parirala, at nabibigyang-diin ang kasalukuyang araw.
- source_word: נִהְיֵיתָ לְעָם
  choice: kayo ay naging isang bayan
  rationale: Isahan ang anyong Hebreo dahil kolektibong kinakausap ang Israel. Ginagamit sa Tagalog ang maramihang “kayo” bilang likas na tuwirang pagtukoy sa sambayanan, habang pinananatili ng “isang bayan” ang tipanang identidad nang hindi ito ginagawang pangunahing politikal na “bansa.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Sa konstruksyong היה + ל, ipinahihiwatig ang tipanang kaugnayan at pag-aari. Pinananatili ng “para kay Yahweh” ang maikli at bahagyang maluwag na pahayag; inilalahad sa talababa ang mas tahasang diwa ng pag-aari.
- source_word: אֱלֹהֶיךָ
  choice: na inyong Diyos
  rationale: Likas na Tagalog ito para sa Diyos ng Israel na siyang kinakausap bilang isang kolektibong bayan.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Kolektibong isahang pagtukoy sa Israel
  choice: kayo ay naging isang bayan
  alternative: ikaw ay naging isang bayan; ang Israel ay naging isang bayan
  rationale: Bagaman isahan ang pandiwa at hulapi sa Hebreo, kolektibong Israel ang kinakausap. Sa modernong Tagalog, mas likas at malinaw ang “kayo/inyong” para sa buong kapulungan; hindi nito binabago ang Israel tungo sa ikatlong panauhan.
- issue: Diwa ng לְ sa לַיהוָה
  choice: isang bayang para kay Yahweh
  alternative: isang bayang pag-aari ni Yahweh
  rationale: Maaaring ipahayag ng konstruksyon ang pagiging bayan para sa Diyos o ang pagiging pag-aari niya. Pinananatili sa pangunahing teksto ang maikling pormang hindi labis na nagpapaliwanag, at inilalagay sa talababa ang mas tahasang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Levitang pari” bilang maikli at likas na katawagan. Ang “kayo/inyong” ay ang natural na kolektibong pagtawag sa Israel sa Tagalog, at ang mga tandang talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
