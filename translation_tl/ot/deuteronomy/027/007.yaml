  terminology: Pinanatili ang “mga handog pangkapayapaan” bilang kilalang katawagang pansakripisyo. Pinanatili ang “Yahweh” at “iyong Diyos.” Sa talababa, ang “mga handog para sa kagalingan” ay mas malapit sa lexical na “offerings of well-being” kaysa “mga handog para sa kaginhawahan.”
