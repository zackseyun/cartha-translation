base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/007.yaml
  text: And you shall sacrifice peace offerings[a], and you shall eat there, and you shall rejoice before Yahweh your God.
translation:
  language: tl
  text: Maghahain ka ng mga handog pangkapayapaan[a], at kakain ka roon, at magagalak ka sa harapan ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog ng pakikisama” o “mga handog para sa kagalingan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: Maghahandog ka
  rationale: Sa kontekstong pansakripisyo, ang זבח ay tumutukoy sa paghahandog ng hain. Likas at marangal sa modernong Tagalog ang “maghahandog,” at pinananatili ng “ka” ang tahasang ikalawang panauhang panlalaking isahan ng Hebreo.
- source_word: שְׁלָמִים
  choice: mga handog pangkapayapaan
  rationale: Pangalan ito ng isang uri ng hain na kaugnay ng kaginhawahan o kapayapaan at ng salu-salong pansakripisyo. Ang “mga handog pangkapayapaan” ay maikli, madaling makilala bilang terminong pansamba, at hindi nito ipinapakahulugang pansariling damdamin lamang ang tinutukoy.
- source_word: וְאָכַלְתָּ שָּׁם
  choice: at kakain [ka] roon
  rationale: Tuwirang ipinapahayag ang pagkain sa lugar na iyon. Sa salin, inilapit ang “roon” sa unang sugnay upang luminaw na kapuwa roon ginagawa ang paghahandog at pagkain, gaya ng hinihingi ng konteksto; nauunawaan pa rin ang simuno ng “kakain” mula sa naunang “ka.”
- source_word: וְשָׂמַחְתָּ
  choice: magagalak ka
  rationale: Pinananatili ng “magagalak” ang masaya at mapagdiwang na lakas ng שׂמח sa konteksto ng pagsamba.
- source_word: לִפְנֵי
  choice: sa harapan ni
  rationale: Karaniwang katumbas ito ng לִפְנֵי sa kontekstong kultiko at malinaw na nagpapahiwatig ng presensiya sa harap ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ng “iyong” ang tahasang hulaping ikalawang panauhang isahan at ang ugnayang tipan sa pahayag.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Kahulugan ng שְׁלָמִים
  choice: mga handog pangkapayapaan
  alternative: mga handog ng pakikisama; mga handog para sa kaginhawahan
  rationale: Tumutukoy ang salita sa isang uri ng hain, hindi lamang sa pansariling kapayapaan. Pinili ang nakikilalang katawagang “handog pangkapayapaan,” habang inilalagay sa talababa ang iba pang lehitimong diin ng salita.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang isahang “ka/iyong” upang tumbasan ang 2ms ng Hebreo. Pinili ang semicolon upang malinaw na iugnay ngunit hindi pagsamahin nang labis ang pagkain at pagdiriwang sa harap ni Yahweh.
