  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָר֗וּר מַטֶּ֛ה מִשְׁפַּ֥ט גֵּר יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/019.yaml
  text: Cursed is the one who perverts the justice due to the sojourner[a], the fatherless, and the widow. And all the people shall say[c][b], “Amen.”
translation:
  language: tl
  text: “Sumpain ang nagbabaluktot ng katarungang dapat matanggap ng dayuhang naninirahan[a], ng ulila[b], at ng biyuda.” At sasabihin ng buong bayan, “Amen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “dayuhang naninirahan” ay salin ng Hebreong ger, isang hindi katutubong taong naninirahan sa gitna ng Israel.
    reason: cultural_note
  - marker: b
    text: Ang “ulila” ay literal na “walang ama”; maaari rin itong isaling “batang walang ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Sumpain
  rationale: Likas at marangal na katumbas ng pormulang sumpa sa tipan; pinananatili ang bigat ng pasiyang ipinahahayag.
- source_word: מַטֶּה
  choice: nagkakait
  rationale: Ang Hifil participle ng נטה ay tumutukoy sa paglihis o pagbaluktot ng katarungan. Sa Filipino, malinaw na ipinahahayag ng “nagkakait ng katarungan” ang pagkakait ng nararapat na karapatang legal sa mahihina.
- source_word: מִשְׁפַּט
  choice: katarungan
  rationale: Sa kontekstong legal, saklaw nito ang makatarungang hatol at karapatang nararapat sa mga taong binanggit.
- source_word: גֵּר
  choice: dayuhang naninirahan
  rationale: Tumutukoy sa isang hindi katutubong taong naninirahan sa Israel at nasa mahinang kalagayang panlipunan; mas tiyak ito kaysa “dayuhan” lamang at mas natural kaysa teknikal na katawagan.
- source_word: יָתוֹם
  choice: ulila
  rationale: Karaniwang modernong salitang Filipino para sa batang nawalan ng magulang o ama; hindi nito sapilitang nilulutas ang lawak ng terminong Hebreo.
- source_word: אַלְמָנָה
  choice: biyuda
  rationale: Natural at madaling maunawaang modernong Filipino para sa babaeng namatayan ng asawa.
- source_word: וְאָמַר כָּל הָעָם
  choice: At sasabihin ng buong bayan
  rationale: Ang anyong pandiwa sa sunod-sunod na seremonyal na tagubilin ay angkop na isalin bilang nakatakdang tugon ng buong bayan.
- source_word: אָמֵן
  choice: Amen
  rationale: Pinananatili ang nakaugaliang liturhikal na tugon at ang taimtim na pagpapatibay sa sumpa ng tipan.
theological_decisions:
- issue: Paglalarawan sa tatlong mahihinang pangkat nang hindi nag-aangkat ng makabagong kategoryang pampolitika
  choice: dayuhang naninirahan, ulila, at biyuda
  alternative: dayuhan, batang walang ama, at balo
  rationale: Pinananatili ng salin ang makasaysayan at legal na mga kategorya sa tipan, habang malinaw na ipinakikita ang kanilang bulnerableng katayuan nang hindi iniuugnay sa isang partikular na kasalukuyang patakaran.
- issue: Kahulugan ng מַטֶּה מִשְׁפַּט
  choice: nagkakait ng katarungan
  alternative: nagbabaluktot ng katarungan / inililihis ang hatol
  rationale: Ipinahihiwatig ng parirala ang paglihis sa legal na karapatang nararapat sa mga mahihina. Ang “nagkakait” ay natural sa Filipino at pinananatili ang legal at moral na bigat, bagaman maaaring idiin ng alternatibo ang larawan ng paglihis.
translation_notes:
  register: Modernong Filipino na dignipikado at madaling maunawaan. Ginamit ang “biyuda” bilang mas karaniwang kasalukuyang salita, at ang “dayuhang naninirahan” upang maipaliwanag sa mismong teksto ang ger nang hindi nagiging sobrang teknikal. Ang tuwirang pormulang “Sumpain ang…” ay nagpapanatili sa liturhikal at pangtipang tono.
