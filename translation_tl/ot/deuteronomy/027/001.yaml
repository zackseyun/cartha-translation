base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/001.yaml
  text: Then Moses and the elders of Israel commanded the people[a], saying, “Keep all the commandment that I am commanding you today.”
translation:
  language: tl
  text: 'Inutusan ni Moises at ng mga nakatatanda ng Israel ang bayan: “Sundin ninyo ang buong utos[a] na iniuutos ko sa inyo ngayon.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isahan ang “utos,” ngunit maaari itong tumukoy nang sama-sama sa kabuuan ng mga iniutos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: iniutos
  rationale: Tuwirang ipinahahayag nito ang makapangyarihang pag-uutos ng צוה at natural sa modernong Filipino.
- source_word: וְזִקְנֵי יִשְׂרָאֵל
  choice: at ng matatandang pinuno ng Israel
  rationale: Pinananatili ang koordinasyon ni Moises at ng mga זקנים bilang kapwa simuno; nililinaw ng “pinuno” ang tungkulin ng matatanda sa bayan.
- source_word: הָעָם
  choice: sa bayan
  rationale: Ang “bayan” ay natural na katumbas ng עָם sa pambansa at tipanang konteksto.
- source_word: לֵאמֹר
  choice: (ipinakilala sa pamamagitan ng tuwirang sipi)
  rationale: Sa Filipino, natural nang ipakilala ang nilalaman ng utos sa pamamagitan ng tuwirang sipi; hindi kailangang isalin nang hiwalay ang pormulang “na sinasabi.”
- source_word: שָׁמֹר
  choice: Sundin ninyo
  rationale: Sa konteksto ng kautusan, ipinahahayag nito ang maingat at tapat na pagtupad, at higit na natural kaysa literal na “ingatan” sa kasalukuyang Filipino.
- source_word: כָּל הַמִּצְוָה
  choice: ang buong utos
  rationale: Pinananatili ang gramatikal na isahan at ang kolektibong saklaw ng parirala; natural sa Filipino ang “buong utos.”
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: na iniuutos ko sa inyo
  rationale: Ang aspektong di-ganap ng “iniuutos” ay angkop sa Hebreong participle at nagpapahiwatig ng kasalukuyang paghahayag ng utos.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Karaniwan at malinaw na modernong salin ng temporal na diin ng הַיּוֹם.
theological_decisions:
- issue: Bilang ng מִצְוָה sa tagubiling may kaugnayan sa tipan
  choice: 'isahang kolektibo: “ang buong utos”'
  alternative: 'maramihan: “ang lahat ng utos”'
  rationale: Isahan ang pangngalang Hebreo. Pinananatili ng “buong utos” ang kolektibong pagkakaisa ng tagubilin nang hindi ito tahimik na ginagawang maramihan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “matatandang pinuno” upang maiwasan ang impresyong edad lamang ang tinutukoy ng זקנים, at “Sundin” upang natural na maipahayag ang pagsunod at maingat na pagtupad.
