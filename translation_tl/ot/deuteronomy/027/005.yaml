  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בָנִ֤יתָ שָּׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ מִזְבַּ֣ח אֲבָנִ֔ים לֹא תָנִ֥יף עֲלֵי/הֶ֖ם בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/005.yaml
  text: And there you shall build an altar to Yahweh your God[a], an altar of stones[b]; you shall not wield iron upon them.
translation:
  language: tl
  text: At magtatayo ka roon ng isang altar para kay Yahweh na iyong Diyos—isang altar na yari sa mga bato. Huwag kang gagamit ng bakal sa mga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag kang gagamit ng kasangkapang bakal sa mga iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: At magtatayo ka
  rationale: Ang Qal perfect na may pang-ugnay ay may puwersang pautos sa kontekstong ito; pinananatili ng anyong panghinaharap ang marangal na himig ng tagubilin.
- source_word: שָׁם
  choice: roon
  rationale: Tuwirang tumutukoy sa lugar na nabanggit sa naunang konteksto.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Ito ang karaniwan at malinaw na salitang Filipino para sa dambanang pinaghahandugan.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: para kay Yahweh na iyong Diyos
  rationale: Ipinahihiwatig ng ל ang paglalaan ng altar kay Yahweh; pinananatili ang personal na banal na pangalang יהוה at ang tipanang ugnayang nasa 'iyong Diyos.'
- source_word: מִזְבַּח אֲבָנִים
  choice: isang altar na yari sa mga bato
  rationale: Likas sa modernong Tagalog at malinaw na ipinapahayag ang materyal na tinutukoy ng pariralang construct.
- source_word: לֹא תָנִיף עֲלֵיהֶם בַּרְזֶל
  choice: Huwag kang gagamit ng bakal sa mga iyon
  rationale: Sa konteksto, ang Hiphil ng נוף kasama ng בַּרְזֶל ay tumutukoy sa paggamit ng bakal o kasangkapang bakal sa mga bato. Ang saling ito ay natural ngunit hindi nagdaragdag ng tiyak na uri ng kasangkapan sa pangunahing teksto.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Direktang ginagamit ng tekstong Hebreo ang Tetragrammaton; ang 'Yahweh' ay nagpapanatili rito bilang personal na pangalang tipan sa halip na palitan ng isang titulo.
- issue: Kung ang בַּרְזֶל ay simpleng 'bakal' o ipinahihiwatig na 'kasangkapang bakal'
  choice: bakal sa pangunahing teksto
  alternative: kasangkapang bakal
  rationale: Literal na 'bakal' ang pangngalan, ngunit instrumento ang diwa sa konteksto. Pinananatili ng pangunahing teksto ang leksikal na anyo, habang nililinaw sa talababa ang ipinahihiwatig na kasangkapan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'altar,' na karaniwang nauunawaan sa kasalukuyang wikang panrelihiyon; iniwasan ang lipas o labis na teknikal na pananalita. Ang panawagang isahan ay pinanatili sa 'ka/mo' ayon sa mga anyong 2ms sa Hebreo.
