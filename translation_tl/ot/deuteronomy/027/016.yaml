  text: אָר֕וּר מַקְלֶ֥ה אָבִ֖י/ו וְ/אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/016.yaml
  text: Cursed is the one who dishonors his father or his mother. And all the people shall say[a], “Amen.”
translation:
  language: tl
  text: Sumpain ang sinumang humahamak[a] sa kanyang ama o ina. At sasabihin ng buong bayan, “Amen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “minamaliit,” “itinuturing na walang halaga,” o “nilalapastangan.” Ipinahihiwatig ng pandiwang Hebreo ang pagtrato sa isang tao bilang hindi mahalaga o karapat-dapat hamakin.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Sumpain
  rationale: Naghahayag ito ng pormulang sumpa sa konteksto ng tipan. Ang “Sumpain” ay malinaw, natural, at angkop sa ritwal at legal na pananalita.
- source_word: מַקְלֶה
  choice: humahamak
  rationale: Mula ito sa pandiwang קלה, na dito ay tumutukoy sa pagtrato sa isang tao bilang magaan, walang halaga, o kasuklam-suklam. Ipinahahayag ng “humahamak” ang aktibong kawalan ng paggalang nang hindi nililimitahan ang kasalanan sa damdamin o pananalita lamang.
- source_word: אָבִיו
  choice: sa kanyang ama
  rationale: Tuwirang isinasalin ang pangngalan na may panlaping panghalip na panlalaking isahan; natural sa makabagong Filipino ang “kanyang ama.”
- source_word: וְאִמּוֹ
  choice: o ina
  rationale: 'Bagaman literal na “at” ang pang-ugnay, distributibo ang diwa ng legal na pahayag: saklaw ang paghamak sa alinman sa ama o ina. Natural at malinaw sa Filipino ang “ama o ina.”'
- source_word: וְאָמַר
  choice: At sasabihin
  rationale: Pinananatili ang pagkakasunod ng ritwal na tugon at ang koordinasyon ng Hebreo.
- source_word: כָּל הָעָם
  choice: ang buong bayan
  rationale: Katumbas ito ng lahat ng taong nagkakatipon bilang bayan; hindi idinaragdag ang “Israel” sapagkat hindi iyon tahasang nasa parirala.
- source_word: אָמֵן
  choice: Amen
  rationale: Pinananatili ang kinikilalang liturhikal na pagpapatibay at ang taimtim na diwa ng pagtugon sa tipan.
theological_decisions:
- issue: Uri ng pagkakasala laban sa mga magulang
  choice: Isinalin bilang “humahamak,” na tumutukoy sa pagtrato sa magulang bilang mababa o walang halaga.
  alternative: “hindi gumagalang,” “minamaliit,” o “lumalapastangan”
  rationale: Ang pandiwang Hebreo ay may larawan ng pagtrato sa isang tao bilang “magaan” o walang halaga. Pinananatili ng “humahamak” ang panlipunan at etikal na bigat nito nang hindi ito nililimitahan sa panloob na saloobin, pasalitang paglapastangan, o isang partikular na kilos lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong bayan” bilang natural na kolektibong katumbas ng כָּל הָעָם, at pinanatili ang “Amen” bilang pamilyar na tugong liturhikal.
