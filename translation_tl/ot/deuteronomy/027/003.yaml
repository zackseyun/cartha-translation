  source_fidelity: Tumpak na naihahatid ng salin ang utos na magsulat sa mga bato, ang temporal na sugnay tungkol sa pagtawid, layuning makapasok sa lupain, ang patuloy/tiyak na pagkakaloob ng lupain, at ang pormulang tungkol sa Diyos ng mga ninuno. Wasto ring ginagamit ang “Yahweh” para sa יהוה at pinananatili ang “sinabi” sa halip na ipasok ang “ipinangako.”
  naturalness: Karaniwang malinaw at marangal ang Tagalog. Gayunman, ang “lupaing dinadaluyan ng gatas at pulot” ay hindi likas at maaaring magpahiwatig na ang lupain ay dinaraanan lamang ng gatas at pulot. Mas malinaw at mas natural ang “lupaing umaagos ang gatas at pulot,” na pinananatili ang larawan ng Hebreo.
  terminology: Ang “kautusan,” “tipan,” “Yahweh,” at “mga ninuno” ay angkop sa rehistro at konteksto. Ang talababa sa “kautusan” ay wastong nagbibigay ng leksikal na alternatibong “tagubilin”; ang talababa sa “mga ninuno” ay malinaw na itinatala ang mas literal na “mga ama.”
