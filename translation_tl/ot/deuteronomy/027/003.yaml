- from: At isusulat mo sa mga iyon ang lahat ng salita ng kautusang ito[a] kapag tumawid ka, upang makapasok ka sa lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos—isang lupaing dinadaluyan ng gatas at pulot—gaya ng sinabi sa iyo ni Yahweh, ang Diyos ng iyong mga ninuno[b].
  to: At isusulat mo sa mga iyon ang lahat ng salita ng kautusang ito[a] kapag tumawid ka, upang makapasok ka sa lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos—isang lupaing umaagos ang gatas at pulot—gaya ng sinabi sa iyo ni Yahweh, ang Diyos ng iyong mga ninuno[b].
