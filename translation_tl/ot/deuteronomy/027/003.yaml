  text: וְ/כָתַבְתָּ֣ עֲלֵי/הֶ֗ן אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בְּ/עָבְרֶ֑/ךָ לְמַ֡עַן אֲשֶׁר֩ תָּבֹ֨א אֶל הָ/אָ֜רֶץ אֲֽשֶׁר יְהוָ֥ה אֱלֹהֶ֣י/ךָ נֹתֵ֣ן לְ/ךָ֗ אֶ֣רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֶ֖י/ךָ לָֽ/ךְ־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/003.yaml
  text: And you shall write on them all the words of this law when you cross over[a], so that you may enter the land that Yahweh your God is giving you, a land flowing with milk and honey, just as Yahweh, the God of your fathers[b], spoke to you.
translation:
  language: tl
  text: At isusulat mo sa mga iyon ang lahat ng salita ng kautusang ito[a] kapag tumawid ka, upang makapasok ka sa lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos—isang lupaing umaagos ang gatas at pulot—gaya ng sinabi sa iyo ni Yahweh, ang Diyos ng iyong mga ninuno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng salita ng tagubiling ito.” Ang salitang Hebreo na torah ay maaaring mangahulugang “tagubilin” o “kautusan”; ang “kautusan” ay angkop sa konteksto ng tipan dito.
    reason: lexical_alternative
  - marker: b
    text: Sa mas literal na pananalita, “ang Diyos ng iyong mga ama.” Bahagi ito ng pormulang tumutukoy sa mga ama o ninuno ng Israel sa tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: At isusulat mo
  rationale: Ang anyong pandiwa sa kontekstong tagubilin ay naghahayag ng utos. Pinananatili ng “isusulat mo” ang marangal at legal na himig nang hindi nagiging lipas ang pananalita.
- source_word: עֲלֵיהֶן
  choice: sa mga iyon
  rationale: Tumutukoy ito sa mga batong binanggit sa naunang talata. Likas sa makabagong Tagalog ang “sa mga iyon” para sa pagsusulat sa ibabaw ng mga bato.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: ang lahat ng salita ng kautusang ito
  rationale: Isinasalin nang tuwiran ang דִּבְרֵי bilang “mga salita.” Maaaring mangahulugan ang תּוֹרָה ng “tagubilin,” ngunit ang “kautusan” ay angkop sa kontekstong tipan at batas; inilalahad ang alternatibo sa talababa.
- source_word: בְּעָבְרֶךָ
  choice: kapag tumawid ka
  rationale: Ang pang-ukol na may infinitive construct ay temporal. Ipinahihiwatig ng “tumawid” ang pagtawid sa Jordan ayon sa konteksto.
- source_word: לְמַעַן אֲשֶׁר תָּבֹא
  choice: upang makapasok ka
  rationale: Pinananatili ng “upang” ang layunin o inaasahang bunga, at likas ang “makapasok” para sa pagpasok sa lupain.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Ginagamit ang pangalang tipan na “Yahweh” para sa Tetragrammaton, at malinaw na iniuugnay rito ang “iyong Diyos.”
- source_word: נֹתֵן לְךָ
  choice: ibinibigay sa iyo
  rationale: Pinananatili ng aspektong nagaganap ng “ibinibigay” ang participle, na naglalarawan sa kaloob bilang tiyak at kasalukuyang isinasakatuparan.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: isang lupaing dinadaluyan ng gatas at pulot
  rationale: Pinananatili nito ang konkretong larawan ng kasaganaan at natural itong basahin sa Tagalog.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: gaya ng sinabi
  rationale: Ang pandiwa ay literal na “nagsalita/nagsabi,” hindi tahasang “nangako.” Hindi ipinapasok sa salin ang implikasyon ng pangako bilang mismong kahulugan ng pandiwa.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: ang Diyos ng iyong mga ninuno
  rationale: Ang “mga ninuno” ang pinakanatural at malinaw na makabagong Tagalog para sa mga naunang ama ng Israel. Itinatala sa talababa ang mas literal na “mga ama” upang mapanatili ang anyong panlalaki at pormulang tipan ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Pagsasalin sa אֲבֹתֶיךָ sa pormulang tipan
  choice: iyong mga ninuno
  alternative: iyong mga ama
  rationale: Mas malinaw at natural sa karaniwang mambabasang Tagalog ang “mga ninuno,” samantalang maaaring mapagkamalang agarang mga magulang lamang ang “mga ama.” Gayunman, tunay na panlalaking pangmaramihan ang salitang Hebreo, kaya inilalahad ang “mga ama” sa talababa sa halip na itago ang anyo ng pinagmulan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino ang ginamit. Nananatiling isahan ang kausap, gaya ng Hebreo, at ang mga gitling ay naghihiwalay sa paglalarawan sa lupain nang hindi pinaghihiwa-hiwalay ang daloy ng pangungusap. Ang bawat pananda ng talababa ay inilagay kaagad sa terminong tinatalakay nito.
