  text: אָר֗וּר שֹׁכֵב֙ עִם אֵ֣שֶׁת אָבִ֔י/ו כִּ֥י גִלָּ֖ה כְּנַ֣ף אָבִ֑י/ו וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/020.yaml
  text: Cursed is the one who lies with his father's wife[a], because he has uncovered his father's skirt. And all the people shall say[b], ‘Amen.’
translation:
  language: tl
  text: “Sumpain ang sinumang sumiping sa asawa ng kanyang ama,[a] sapagkat inilantad niya ang laylayan ng kanyang ama.” At sasabihin ng buong bayan, “Amen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy sa kanyang madrasta, ngunit literal na sinasabi ng Hebreo, “asawa ng kanyang ama.” Ang “inilantad ang laylayan ng kanyang ama” ay isang seksuwal na eupemismo; maaari rin itong unawain kaugnay ng “paglalantad sa kahubaran ng kanyang ama” (tingnan ang Levitico 18:8; 20:11).
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Sumpain
  rationale: Karaniwang pormula ito ng sumpa sa tipan. Ang “Sumpain” ay malinaw, marangal, at angkop sa legal-liturgical na konteksto.
- source_word: שֹׁכֵב עִם
  choice: sumiping sa
  rationale: Idyomang tumutukoy sa pakikipagtalik. Pinananatili ng “sumiping sa” ang eupemistiko at legal na himig nang hindi nagiging sobrang klinikal o kolokyal.
- source_word: אֵשֶׁת אָבִיו
  choice: asawa ng kanyang ama
  rationale: Ito ang tuwirang kahulugan ng Hebreo at hindi nito labis na tinutukoy ang babae bilang madrasta, bagaman maaaring iyon ang tinutukoy sa konteksto.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng sumpa; ang “sapagkat” ay natural at angkop sa marangal na rehistro.
- source_word: גִלָּה כְּנַף אָבִיו
  choice: inilantad niya ang laylayan ng kanyang ama
  rationale: Ang כָּנָף ay maaaring mangahulugang pakpak, dulo, o laylayan ng kasuutan. Pinananatili ng salin ang konkretong larawan at eupemismo sa halip na tahasang palitan ito ng interpretasyon.
- source_word: וְאָמַר כָּל הָעָם
  choice: At sasabihin ng buong bayan
  rationale: Pinananatili ang pormulang tugon ng sambayanan sa konteksto ng tipan.
- source_word: אָמֵן
  choice: Amen
  rationale: Karaniwang transliterasyon ito ng liturgical na tugon at natural na sa modernong Filipino.
theological_decisions:
- issue: Eupemistikong pananalita tungkol sa seksuwal na kasalanan at karangalan ng ama
  choice: Panatilihin sa pangunahing teksto ang larawang “inilantad ... ang laylayan ng kanyang ama.”
  alternative: “inilantad ang kahubaran ng kanyang ama” o “nilapastangan ang karapatan ng kanyang ama sa pag-aasawa”
  rationale: Ang Hebreo ay gumagamit ng כָּנָף, hindi ng karaniwang salita para sa “kahubaran.” Ang pagpapanatili sa larawan ay nag-iingat sa ugnayan nito sa mga pagbabawal sa Levitico at sa tunay na kalabuan kung ang diin ay nasa damit, seksuwal na paglalantad, o karapatan at dangal ng ama.
translation_notes:
  register: Modernong Filipino na may marangal na legal-liturgical na himig. Ginamit ang “sumiping” upang mapanatili ang eupemismo, at “laylayan” upang mailarawan ang literal na כָּנָף nang hindi agad nilulutas ang pahiwatig nito. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang nangangailangan ng paliwanag.
