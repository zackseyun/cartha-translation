  text: So you shall listen to the voice of Yahweh your God and do his commandments and his statutes that I am commanding you today[a].
translation:
  language: tl
  text: Kaya makinig ka sa tinig ni Yahweh na iyong Diyos at sundin mo ang kanyang mga utos at mga tuntunin na iniuutos ko sa iyo ngayon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sundin ang sinasabi ni Yahweh na iyong Diyos.” Ang Hebreong idyomang “makinig sa tinig” ay madalas na may kasamang diwa ng pagsunod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ בְּקוֹל
  choice: Kaya makinig ka sa tinig
  rationale: Pinananatili ang Hebreong idyomang “makinig sa tinig,” na nagpapahiwatig ng masunuring pakikinig ngunit hindi lubusang pinapantay sa “sumunod,” yamang tahasang binabanggit sa kasunod na sugnay ang pagsasagawa ng mga utos.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: ni Yahweh na iyong Diyos
  rationale: Inililipat nang tuwiran ang personal na pangalang יהוה bilang “Yahweh” at pinananatili ang tipang kaugnayan sa pariralang “iyong Diyos.”
- source_word: וְעָשִׂיתָ
  choice: at sundin mo
  rationale: Sa kontekstong legal, ang paggawa o pagsasakatuparan ng mga utos ay natural na ipinahahayag sa Filipino bilang “sundin”; hindi nito inuulit ang eksaktong anyo ng unang pandiwa ngunit malinaw na ipinapakita ang aktuwal na pagtupad.
- source_word: מִצְוֺתָיו
  choice: ang kanyang mga utos
  rationale: Ang “mga utos” ay likas at malinaw na katumbas sa modernong Filipino ng mga kautusang ibinigay ng Diyos.
- source_word: חֻקָּיו
  choice: mga tuntunin
  rationale: Ang “mga tuntunin” ay dignificado at madaling maunawaan, at sapat na naihihiwalay sa “mga utos” bilang isa pang katawagang legal.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: na iniuutos ko sa iyo ngayon
  rationale: Ang aspektong nagaganap ng “iniuutos” ay nagpapanatili sa kasalukuyang bisa at agarang kalagayan ng pahayag ni Moises; natural na katumbas ng היום ang “ngayon.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Saklaw ng שׁמע בקול
  choice: makinig sa tinig
  alternative: sundin
  rationale: Pinananatili ng pangunahing teksto ang leksikal na larawan ng pakikinig habang kinikilala sa talababa na ang Hebreong idyoma ay karaniwang may diwang pagsunod; sa gayon ay hindi agad nilulutas ang saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang Hebreong larawang “makinig sa tinig,” samantalang ginamit ang natural na “sundin” para sa aktuwal na pagsasagawa ng mga utos at tuntunin.
