  text: וְ/אֵ֛לֶּה יַֽעַמְד֥וּ עַל הַ/קְּלָלָ֖ה בְּ/הַ֣ר עֵיבָ֑ל רְאוּבֵן֙ גָּ֣ד וְ/אָשֵׁ֔ר וּ/זְבוּלֻ֖ן דָּ֥ן וְ/נַפְתָּלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/013.yaml
  text: 'And these shall stand for the curse on Mount Ebal: Reuben[a], Gad, Asher, Zebulun, Dan, and Naphtali.'
translation:
  language: tl
  text: 'At ang mga ito ay tatayo sa Bundok Ebal para sa sumpa[a]: sina Ruben, Gad, Aser, Zebulun, Dan, at Neftali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa pagbigkas ng sumpa” o “para sa pagsumpa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ang mga ito
  rationale: Pinananatili ng “At” ang malinaw na ugnayan at pagtutulad-pagsalungat sa pangkat na binanggit sa naunang talata.
- source_word: יַעַמְדוּ
  choice: ay tatayo
  rationale: Ang imperpektibo ay naghahayag dito ng tagubilin para sa hinaharap; natural at malinaw sa modernong Filipino ang “tatayo.”
- source_word: עַל הַקְּלָלָה
  choice: para sa sumpa
  rationale: Ipinahihiwatig ng עַל ang pagkakatalaga o kaugnayan ng mga lipi sa seremonyal na sumpa. Pinananatili ng maikling parirala ang hindi tahasang pagsasabi ng Hebreo kung sila mismo ang bibigkas nito.
- source_word: בְּהַר עֵיבָל
  choice: sa Bundok Ebal
  rationale: Karaniwang Filipino ang “sa Bundok Ebal” para sa lokasyon; ang pangalang pantangi ay tinumbasan ayon sa karaniwang baybay.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Karaniwang baybay sa Filipino ng pangalan ng lipi.
- source_word: גָּד
  choice: Gad
  rationale: Karaniwang transliterasyon sa Filipino ng pangalan ng lipi.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Karaniwang anyong Filipino ng pangalan ng lipi.
- source_word: זְבוּלֻן
  choice: Zebulun
  rationale: Malinaw na transliterasyon ng pangalan at malapit sa anyo ng Hebreo.
- source_word: דָּן
  choice: Dan
  rationale: Karaniwang transliterasyon sa Filipino ng pangalan ng lipi.
- source_word: נַפְתָּלִי
  choice: Neftali
  rationale: Karaniwang anyong Filipino ng pangalan ng lipi.
theological_decisions:
- issue: Gampaning panseremonya ng mga lipi kaugnay ng sumpa
  choice: para sa sumpa
  alternative: para sa pagbigkas ng sumpa; upang sumumpa
  rationale: Hindi tahasang inuulit sa Hebreo ang pandiwang “bigkasin.” Bagaman ipinahihiwatig ng konteksto ang seremonyal na pagpapahayag, hindi ito dinaragdagan sa pangunahing teksto upang mapanatili ang tunay na kaiklian at kalabuan ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” bago ang talaan ng mga pangalan upang maging natural sa Tagalog, samantalang pinanatili ang maikli at seremonyal na ayos ng Hebreo.
