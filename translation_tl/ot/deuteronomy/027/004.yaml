source:
  edition: WLC
  text: וְ/הָיָה֮ בְּ/עָבְרְ/כֶ֣ם אֶת הַ/יַּרְדֵּן֒ תָּקִ֜ימוּ אֶת הָ/אֲבָנִ֣ים הָ/אֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם בְּ/הַ֣ר עֵיבָ֑ל וְ/שַׂדְתָּ֥ אוֹתָ֖/ם בַּ/שִּֽׂיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/004.yaml
  text: And when you cross the Jordan[a], you shall set up these stones, which I am commanding you today, on Mount Ebal, and you shall plaster them with lime.
translation:
  language: tl
  text: At kapag tumawid kayo sa Jordan,[a] itatayo ninyo ang mga batong ito na iniuutos ko sa inyo ngayon sa Bundok Ebal, at papahiran ninyo ang mga iyon ng apog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang tradisyon ng teksto, lalo na sa Samaritanong Pentateuch, “Bundok Gerizim” ang mababasa sa halip na “Bundok Ebal.”
    reason: textual_variant
lexical_decisions:
- source_word: וְהָיָה בְּעָבְרְכֶם
  choice: At kapag tumawid kayo
  rationale: Ang וְהָיָה na sinusundan ng infinitive construct ay nagpapakilala ng pangyayaring magaganap sa hinaharap. Likas sa modernong Tagalog ang “kapag tumawid kayo” at pinananatili nito ang temporal na diwa.
- source_word: הַיַּרְדֵּן
  choice: Jordan
  rationale: Ang pangalang pantangi ay karaniwang tumutukoy sa Ilog Jordan. Hindi kailangang idagdag ang “Ilog” upang maging malinaw sa konteksto.
- source_word: תָּקִימוּ
  choice: itatayo ninyo
  rationale: Ang Hiphil ng קום dito ay nangangahulugang magtayo o maglagay nang nakatindig. Ang “itatayo” ay malinaw at natural para sa mga bato.
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: ang mga batong ito
  rationale: Tuwirang salin ito ng pariralang demonstratibo at hindi nito dinaragdagan ang teksto ng ideyang “mga monumento.”
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: na iniuutos ko sa inyo ngayon
  rationale: Ang participle na מְצַוֶּה ay may kasalukuyan o nagpapatuloy na diwa. Ipinahahayag iyon nang natural ng “iniuutos ko ... ngayon.”
- source_word: בְּהַר עֵיבָל
  choice: sa Bundok Ebal
  rationale: Ang “sa Bundok Ebal” ang natural na Tagalog para sa lokasyong tinutukoy ng בְּ sa pangalan ng bundok.
- source_word: וְשַׂדְתָּ אוֹתָם
  choice: at papahiran ninyo ang mga iyon
  rationale: Ang שׂוד ay tumutukoy sa pagpapahid o pagpapalitada. Dahil tahasang binabanggit ang apog bilang materyal, ang “papahiran” ay natural at umiiwas sa hindi likas na pag-uulit.
- source_word: בַּשִּׂיד
  choice: ng apog
  rationale: Ang שׂיד ay apog o materyal na panapalitada. Pinananatili ng “apog” ang espesipikong sangkap na binanggit sa Hebreo.
theological_decisions:
- issue: Pangalan ng lugar sa Deuteronomio 27:4 ayon sa magkakaibang tradisyon ng teksto
  choice: Bundok Ebal
  alternative: Bundok Gerizim
  rationale: “Bundok Ebal” ang mababasa sa ibinigay na WLC/Masoretikong Teksto. Gayunman, itinatala sa talababa ang mahalagang alternatibong “Bundok Gerizim” sa Samaritanong Pentateuch upang hindi maitago ang tunay na pagkakaiba ng mga tradisyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “papahiran ... ng apog” bilang likas na pahayag para sa gawaing pagpapalitada, habang pinananatili ang espesipikong materyal ng tekstong Hebreo.
