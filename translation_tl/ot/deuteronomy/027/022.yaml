base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/022.yaml
  text: Cursed is the one who lies with his sister[a], the daughter of his father or the daughter of his mother. And all the people shall say, “Amen.”
translation:
  language: tl
  text: “Sumpain ang sinumang sumiping sa kanyang kapatid na babae[a], anak na babae ng kanyang ama o anak na babae ng kanyang ina.” At sasabihin ng buong bayan, “Amen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang kasunod na parirala ay naglilinaw sa “kapatid na babae”: anak na babae ng kanyang ama o ng kanyang ina.'
    reason: clarification
lexical_decisions:
- source_word: אָרוּר
  choice: Sumpain
  rationale: Karaniwang pormula ito ng sumpa sa tipan. Ang “Sumpain” ay tuwiran, marangal, at natural sa makabagong Filipino.
- source_word: שֹׁכֵב עִם
  choice: sumiping sa
  rationale: Ang idyoma ay tumutukoy sa pakikipagtalik. Pinananatili ng “sumiping sa” ang di-tahasang anyo at solemneng rehistro ng Hebreo nang hindi nagiging klinikal o kolokyal.
- source_word: אֲחֹתוֹ
  choice: kanyang kapatid na babae
  rationale: Tuwirang salin ng katawagang pangkamag-anak na may panlalaking panghalip na paari.
- source_word: בַּת אָבִיו
  choice: anak na babae ng kanyang ama
  rationale: Pinananatili ang appositional at legal na paglalarawan ng Hebreo, na sumasaklaw sa kapatid sa panig ng ama.
- source_word: אוֹ
  choice: o
  rationale: Tuwirang pangatnig na naghihiwalay sa dalawang posibleng ugnayang magulang.
- source_word: בַת אִמּוֹ
  choice: anak na babae ng kanyang ina
  rationale: Pinananatili ang parallel na legal na pormulasyon at ang malinaw na pagtukoy sa kapatid sa panig ng ina.
- source_word: וְאָמַר
  choice: At sasabihin
  rationale: Ipinagpapatuloy nito ang itinakdang tugon ng bayan sa liturhikong pagkakasunod-sunod ng mga sumpa.
- source_word: כָּל הָעָם
  choice: ang buong bayan
  rationale: Natural na Filipino para sa kolektibong “lahat ng bayan,” nang hindi nagdaragdag ng “Israel” o “kapulungan” na wala sa mismong parirala.
- source_word: אָמֵן
  choice: Amen
  rationale: Nakaugaliang transliterasyon ng liturhikong pagpapatibay; pinananatili nito ang konteksto ng tipan at sama-samang pagsang-ayon.
theological_decisions:
- issue: Saklaw at anyo ng pagbabawal sa insesto
  choice: Isinalin bilang sumpa sa sinumang sumiping sa kanyang kapatid na babae, na inilalarawan bilang anak ng kanyang ama o anak ng kanyang ina.
  alternative: Limitahan ito sa kapatid lamang sa ama o lamang sa ina, o palawakin bilang anumang malapit na babaeng kamag-anak.
  rationale: Ang talata mismo ang naglalarawan sa “kapatid na babae” ayon sa kaugnayan sa ama o ina. Pinananatili ng salin ang saklaw at legal na pormulasyon nang hindi ito pinakikitid o pinalalawak.
- issue: Panlalaking kalahok sa pormulang legal
  choice: “sinumang ... kanyang kapatid na babae”
  alternative: “lalaking ... kanyang kapatid na babae”
  rationale: Panlalaking isahan ang Hebreong participle, ngunit sa pormulang legal ay natural na maipahayag ang paksa bilang “sinumang,” habang nananatili ang panlalaking relasyong ipinahihiwatig ng “kanyang kapatid na babae.”
translation_notes:
  register: Makabago ngunit marangal at angkop sa pampublikong pagbasa. Ginamit ang “sumiping sa” upang mapanatili ang eupemistiko at solemneng idyoma ng Hebreo. Ang panandang [a] ay inilagay sa pangunahing teksto at tumutukoy sa mas literal na anyo ng kasunod na paglalarawan.
