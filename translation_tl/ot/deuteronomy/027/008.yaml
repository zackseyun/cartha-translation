base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/008.yaml
  text: And you shall write on the stones all the words of this law very clearly[a].
translation:
  language: tl
  text: At isusulat mo sa mga bato ang lahat ng salita ng kautusang ito nang napakalinaw[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang malinaw” o “upang maging malinaw ang mga ito.” Pinagsasama ng pananalitang Hebreo ang pandiwang nangangahulugang “gawing malinaw/ipaliwanag” at isang salitang nagpapatingkad dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: At isusulat mo
  rationale: Ang Qal perfect na ikalawang panauhang panlalaking isahan, na may pang-ugnay, ay gumaganap bilang utos sa sunod-sunod na tagubilin. Pinananatili ng “isusulat mo” ang tuwirang pakikipag-usap sa iisang kausap at ang mariing puwersa ng utos.
- source_word: עַל הָאֲבָנִים
  choice: sa mga bato
  rationale: Karaniwang ipinahihiwatig ng עַל ang pagsulat “sa” ibabaw ng isang bagay. Ang tiyak na anyo ng “mga bato” ay tumutukoy sa mga batong nabanggit na sa konteksto; likas sa Tagalog na sabihin lamang na “sa mga bato.”
- source_word: אֵת כָּל דִּבְרֵי
  choice: ang lahat ng salita
  rationale: Tuwirang sinasalamin nito ang כָּל דִּבְרֵי at pinananatili ang kongkretong larawan ng mga salitang isusulat, sa halip na gawing mas malawak na “mga bagay” o “mga tuntunin.”
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ng kautusang ito
  rationale: Bagaman maaaring mangahulugan ang תּוֹרָה ng “aral” o “tagubilin,” ang “kautusan” ay natural at angkop sa kontekstong tipan at pambatas ng Deuteronomio. Ang “ito” ay tahasang kumakatawan sa demonstratibo.
- source_word: בַּאֵר
  choice: nang ... linaw
  rationale: Ang anyong mula sa באר ay may diwang gawing malinaw, ipaliwanag, o ilahad nang maliwanag. Sa konteksto ng pagsusulat sa mga bato, natural itong ipinahayag sa Tagalog bilang paglalarawan sa paraan ng pagsulat.
- source_word: הֵיטֵב
  choice: napakalinaw
  rationale: Pinatitindi ng הֵיטֵב ang naunang diwa. Ang unlaping “napaka-” ay malinaw na naghahatid ng pagpapatindi, hindi lamang ng payak na “mabuti” o “malinaw.”
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kautusan” bilang pamilyar ngunit hindi sektaryong katumbas ng תּוֹרָה sa kontekstong ito. Nasa pangunahing teksto ang panandang talababa [a].
