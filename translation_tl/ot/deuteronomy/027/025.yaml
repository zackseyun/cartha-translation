base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/025.yaml
  text: Cursed is the one who takes a bribe to strike down an innocent person[a], and all the people shall say, ‘Amen.’
translation:
  language: tl
  text: “Sumpain ang sinumang tumatanggap ng suhol upang patayin ang isang taong walang sala[a], at sasabihin ng buong bayan, ‘Amen.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “upang hampasin ang dugong walang sala.” Ang Hebreong idyoma ay tumutukoy sa pagpatay sa isang taong walang sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Sumpain
  rationale: Nasa unahan ito bilang panaguring pang-uri sa pormula ng sumpa sa tipan. Ang “Sumpain” ay malinaw, marangal, at karaniwang gamit sa makabagong salin ng ganitong pahayag.
- source_word: לֹקֵחַ
  choice: ang sinumang tumatanggap
  rationale: Ang Qal participle ay substantibo at tumutukoy sa isang pangkalahatang tao. Likas sa Filipino ang “ang sinumang tumatanggap” at napapanatili nito ang generic na diwa.
- source_word: שֹׁחַד
  choice: ng suhol
  rationale: Ito ang tuwirang terminong legal para sa bayad na ibinibigay upang baluktutin ang katarungan o hikayatin ang masamang gawa.
- source_word: לְהַכּוֹת
  choice: upang patayin
  rationale: Ang Hiphil infinitive ng נכה ay maaaring mangahulugang hampasin, pabagsakin, o patayin. Sa konteksto ng “dugong walang sala,” malinaw na nakamamatay ang gawa, kaya natural at tumpak ang “patayin.”
- source_word: נֶפֶשׁ דָּם נָקִי
  choice: ang isang taong walang sala
  rationale: Bagaman hindi pangkaraniwan ang pagkakabuo ng parirala at literal itong may “dugong walang sala,” ang legal na idyoma ay tumutukoy sa buhay o taong walang sala. Inilalagay sa talababa ang mas literal na anyo upang mapanatili ang larawan ng dugo at pananagutan sa pagpatay.
- source_word: וְאָמַר כָּל הָעָם
  choice: At sasabihin ng buong bayan
  rationale: Sa kontekstong liturhikal at legal, ang pandiwa ay nagtatakda ng tugon ng buong kapulungan. Ang “sasabihin” ay natural sa Filipino at sapat na nagpapahayag ng itinakdang tugon.
- source_word: אָמֵן
  choice: Amen
  rationale: Pinanatili ang kinikilalang liturhikal na pagpapahayag ng pagsang-ayon at pagpapatibay sa sumpa ng tipan.
theological_decisions:
- issue: Pormula ng sumpa sa konteksto ng tipan
  choice: Sumpain ang sinumang tumatanggap ng suhol upang patayin ang isang taong walang sala
  alternative: Sumpain ang tumatanggap ng suhol upang pabagsakin ang dugong walang sala
  rationale: Pinananatili ng napiling salin ang legal at tipanang bigat ng pahayag habang malinaw na ipinapahayag na ang suhol ay kaugnay ng pagpatay sa inosente. Hindi ginawang mas makitid ang dahilan o mekanismo ng suhol kaysa sa sinasabi ng Hebreo.
- issue: Pagpapakahulugan sa נֶפֶשׁ דָּם נָקִי
  choice: isang taong walang sala, na may literal na larawan sa talababa
  alternative: dugong walang sala
  rationale: Ang pangunahing teksto ay naghahatid ng idyomatikong kahulugan sa natural na Filipino, samantalang ang talababa ay nagpapanatili sa larawan ng “dugong walang sala” at sa kaugnay nitong diwa ng bloodguilt.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sumpain” at “Amen” upang mapanatili ang pormal at liturhikal na himig ng pahayag sa tipan; iniwasan ang lipas o sobrang teknikal na pananalita.
