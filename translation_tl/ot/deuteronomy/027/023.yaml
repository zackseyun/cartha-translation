  text: אָר֕וּר שֹׁכֵ֖ב עִם חֹֽתַנְתּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/023.yaml
  text: Cursed is he who lies with his mother-in-law. And all the people shall say[a], “Amen.”
translation:
  language: tl
  text: “Sumpain ang lalaking sumisiping sa kanyang biyenang babae.”[a] At sasabihin ng buong bayan, “Amen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas tahasan, “nakikipagtalik sa kanyang biyenang babae.” Ginagamit sa Hebreo ang idyomang “sumisiping sa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Sumpain
  rationale: Karaniwang pormula ito ng sumpa sa tipan. Ang “Sumpain” ay malinaw, marangal, at likas sa modernong Filipino.
- source_word: שֹׁכֵב עִם
  choice: sumisiping sa
  rationale: Ang pariralang Hebreo ay isang eupemismo para sa pakikipagtalik. Pinananatili ng “sumisiping sa” ang eupemistikong anyo habang malinaw pa rin ang seksuwal na diwa sa kontekstong legal.
- source_word: חֹתַנְתּוֹ
  choice: kanyang biyenang babae
  rationale: Tumutukoy ang pangngalan sa mother-in-law. Ginamit ang “biyenang babae” upang maging tiyak ang kasarian, yamang maaaring tumukoy ang “biyenan” lamang sa ama o ina ng asawa.
- source_word: וְאָמַר
  choice: At sasabihin
  rationale: Ipinagpapatuloy nito ang liturhikong pormula ng tugon; ang anyong panghinaharap ay nagpapahayag ng itinakdang tugon ng bayan.
- source_word: כָּל הָעָם
  choice: ang buong bayan
  rationale: Tuwirang inililipat ang kabuuang diwa ng “lahat ng bayan” sa mas likas na Filipino nang hindi idinaragdag ang “Israel,” na wala sa mismong talata.
- source_word: אָמֵן
  choice: Amen
  rationale: Pinananatili ang kinikilalang liturhikong salitang hiniram mula sa Hebreo, na karaniwan at nauunawaan sa Filipino.
theological_decisions:
- issue: Seksuwal na eupemismo sa pormulang legal
  choice: sumisiping sa
  alternative: nakikipagtalik sa
  rationale: Pinananatili ang eupemismo ng Hebreo nang hindi ikinukubli ang ipinagbabawal na seksuwal na ugnayan.
- issue: Panlalaking isahang simuno
  choice: ang lalaking
  alternative: ang sinumang
  rationale: Ang participle sa Hebreo ay panlalaki at isahan. Ipinahahayag ito nang tahasan sa Filipino sa halip na gawing walang tinukoy na kasarian.
- issue: Pagkakakilanlan ng חֹתֶנֶת
  choice: biyenang babae
  alternative: ina ng kanyang asawa
  rationale: Ang “biyenang babae” ang tuwirang modernong katumbas at iniiwasan ang posibleng kalabuan ng salitang “biyenan” lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang maikli at liturhikong anyo ng pormula ng sumpa at tugon. Ang “biyenang babae” ay pinili para sa tiyak na kasarian, at ang “sumisiping” para mapanatili ang eupemismo ng orihinal.
