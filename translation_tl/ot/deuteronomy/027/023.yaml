  source_fidelity: Tumpak na naipapahayag ng salin ang pormula ng sumpa (אָרוּר), ang panlalaking isahang kalahok na שֹׁכֵב, ang eupemismong seksuwal na “sumisiping sa,” ang tiyak na “mother-in-law” (חֹתֶנֶת), at ang nakatakdang tugon ng buong bayan. Walang idinagdag na hindi nasa Hebreo, gaya ng “Israel.”
