  text: And the Levites shall answer and say to every man of Israel with a loud voice:[a]
translation:
  language: tl
  text: At ang mga Levita ay sasagot at magsasabi sa bawat lalaki ng Israel sa malakas na tinig:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bawat Israelita.” Sa Hebreo, “sa bawat lalaki ng Israel,” na gumagamit ng panlalaking isahan sa paraang kumakatawan sa kabuuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ
  choice: At sasagot
  rationale: Ang ענה sa pormal na kontekstong ito ay nagpapakilala ng tugon o pagpapahayag; pinananatili ng “sasagot” ang idyoma at ang panutong nakatuon sa gagawin.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Tuwirang tumutukoy ang Hebreo sa mga Levita, hindi sa mga paring Levita.
- source_word: וְאָמְרוּ
  choice: at magsasabi
  rationale: Karaniwang pandiwa sa pagsasalita ang אמר; pinananatili ng “magsasabi” ang pagkakasunod ng dalawang pandiwa sa Hebreo.
- source_word: אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: sa bawat lalaki ng Israel
  rationale: Pinananatili nito ang tahasang panlalaking isahan na אִישׁ at ang kinatawang gamit nito, sa halip na gawing walang kasarian ang parirala.
- source_word: קוֹל רָם
  choice: nang malakas
  rationale: Natural na salin ito ng Hebreong idyoma para sa malakas at hayagang pagpapahayag sa madla.
theological_decisions:
- issue: Kinatawang panlalaking wika sa אִישׁ
  choice: sa bawat lalaki ng Israel
  alternative: sa bawat Israelita
  rationale: Panlalaking isahan ang anyo ng אִישׁ ngunit may kolektibo o kinatawang puwersa. Pinananatili sa pangunahing teksto ang anyo ng pinagmulan, habang inilalahad sa talababa ang mas natural na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na tono ng pampublikong pagpapahayag at ang pagkakasunod ng mga pandiwa sa Hebreo.
