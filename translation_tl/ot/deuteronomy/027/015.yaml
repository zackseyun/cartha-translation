revisions:
- from: “Sumpain ang lalaking[a] gumagawa ng inukit na imahen o imaheng hinulma sa pagbubuhos[b]—isang kasuklam-suklam na bagay kay Yahweh, gawa ng mga kamay ng isang bihasang manggagawa—at inilalagay iyon nang lihim.” At sasagot ang buong bayan at magsasabi, “Amen.”
  to: “Sumpain ang lalaking[a] gumagawa ng inukit na imahen o hinulmang imahen[b]—isang kasuklam-suklam kay Yahweh, gawa ng mga kamay ng isang manggagawa—at inilalagay iyon nang lihim.” At sasagot ang buong bayan at magsasabi, “Amen.”
  rationale: Inalis ang hindi tahasang dagdag na “bihasang” at pinalitan ang di-likas na parirala para sa cast image ng natural na “hinulmang imahen.” Pinanatili sa talababa ang mas tiyak na paglalarawan ng paraan ng paggawa. Hindi binago ang saklaw, pormal na rehistro, legal na panlalaking isahan, o ang banal na pangalang Yahweh.
