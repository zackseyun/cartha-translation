  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָר֣וּר הָ/אִ֡ישׁ אֲשֶׁ֣ר יַעֲשֶׂה֩ פֶ֨סֶל וּ/מַסֵּכָ֜ה תּוֹעֲבַ֣ת יְהוָ֗ה מַעֲשֵׂ֛ה יְדֵ֥י חָרָ֖שׁ וְ/שָׂ֣ם בַּ/סָּ֑תֶר וְ/עָנ֧וּ כָל הָ/עָ֛ם וְ/אָמְר֖וּ אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/015.yaml
  text: Cursed is the man who makes a carved image or a cast image—an abomination to Yahweh[a], the work of the hands of a craftsman—and sets it up in secret. And all the people shall answer and say[b], “Amen.”
translation:
  language: tl
  text: “Sumpain ang lalaking[a] gumagawa ng inukit na imahen o hinulmang imahen[b]—isang kasuklam-suklam kay Yahweh, gawa ng mga kamay ng isang manggagawa—at inilalagay iyon nang lihim.” At sasagot ang buong bayan at magsasabi, “Amen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang lalaki.” Ang panlalaking isahan dito ay ginagamit bilang kinatawang pormulang legal.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay tumutukoy sa imaheng ginawa sa paghuhulma, karaniwan sa pamamagitan ng pagbubuhos ng tunaw na materyal sa isang hulmahan, madalas na metal.
    reason: lexical_clarification
lexical_decisions:
- source_word: אָרוּר
  choice: Sumpain
  rationale: Likas at mariing pormula ito ng sumpang tipan sa Tagalog at pinananatili ang juridikal na puwersa ng Hebreo.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Pinananatili ang panlalaking isahan ng tekstong Hebreo, habang nililinaw sa talababa na kinatawan ito sa pormulang legal.
- source_word: פֶסֶל
  choice: inukit na imahen
  rationale: Tiyak nitong ipinahihiwatig ang imaheng hinubog sa pamamagitan ng pag-ukit, hindi lamang ang mas malawak na konsepto ng diyus-diyosan.
- source_word: מַסֵּכָה
  choice: imaheng hinulma sa pagbubuhos
  rationale: Inilalarawan nito ang paraan ng paggawa sa pamamagitan ng pagbubuhos sa hulmahan nang hindi idinaragdag sa pangunahing teksto ang materyal na metal, na hindi tahasang binanggit.
- source_word: תּוֹעֲבַת יְהוָה
  choice: isang kasuklam-suklam na bagay kay Yahweh
  rationale: Pinananatili ang matinding paghatol ng תּוֹעֵבָה at ang kaugnayang nagsasaad na ito ay karima-rimarim sa paningin ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: gawa ng mga kamay ng isang bihasang manggagawa
  rationale: Pinananatili ang kongkretong idyoma at ang diin na ang imahen ay produktong gawa lamang ng tao.
- source_word: וְשָׂם בַּסָּתֶר
  choice: at inilalagay iyon nang lihim
  rationale: Ang 'inilalagay' ay malapit sa payak na kahulugan ng שׂים at hindi ipinapalagay nang higit sa teksto na itinayo ang imahen; malinaw namang naipapahayag ng 'nang lihim' ang pagtatago.
- source_word: וְעָנוּ כָל הָעָם וְאָמְרוּ
  choice: At sasagot ang buong bayan at magsasabi
  rationale: Pinananatili ang dalawang pandiwang Hebreo at ang pormal na tugunang gamit sa seremonyang pangtipan.
- source_word: אָמֵן
  choice: Amen
  rationale: Pinananatili ang kinikilalang liturhikal na tugon at ang diwa ng pagpapatibay sa ipinahayag na sumpa.
theological_decisions:
- issue: Paglalarawan sa bigat ng תּוֹעֲבָה
  choice: isang kasuklam-suklam na bagay kay Yahweh
  alternative: isang bagay na kinamumuhian ni Yahweh
  rationale: Pinananatili ng pinili ang nominal at matinding pananalita ng Hebreo nang hindi ipinapaliwanag o pinahihina ang paghatol.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Dahil personal na pangalang tetragramaton ang nasa teksto, pinananatili itong pangalan sa salin sa halip na gawing titulo.
- issue: Panlalaking isahan sa pormula ng sumpa
  choice: ang lalaki, na may talababa tungkol sa kinatawang legal na gamit
  alternative: sinumang tao
  rationale: Pinananatili ang anyong panlalaking isahan ng Hebreo at kasabay na iniiwasang ipakahulugan na lalaki lamang ang saklaw ng pormulang legal.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang pormal at tugunang himig ng seremonyang pangtipan, habang iniwasan ang mga salitang lipas gaya ng “larawang inanyuan” at ang labis na pagpapaliwanag sa pangunahing teksto.
