    rationale: Nauunawaan ang kahulugan, ngunit mas karaniwan at maayos sa modernong Filipino ang “hinulmang imahen”; maaaring ilagay sa talababa ang paglilinaw tungkol sa pagbubuhos ng tunaw na materyal sa hulmahan.
