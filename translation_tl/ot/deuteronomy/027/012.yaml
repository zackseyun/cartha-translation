  text: אֵ֠לֶּה יַֽעַמְד֞וּ לְ/בָרֵ֤ךְ אֶת הָ/עָם֙ עַל הַ֣ר גְּרִזִ֔ים בְּ/עָבְרְ/כֶ֖ם אֶת הַ/יַּרְדֵּ֑ן שִׁמְעוֹן֙ וְ/לֵוִ֣י וִֽ/יהוּדָ֔ה וְ/יִשָּׂשכָ֖ר וְ/יוֹסֵ֥ף וּ/בִנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/012.yaml
  text: 'These shall stand on Mount Gerizim to bless the people when you cross the Jordan: Simeon[a], Levi, Judah, Issachar, Joseph, and Benjamin.'
translation:
  language: tl
  text: 'Kapag tumawid kayo sa Jordan, ang mga ito ay tatayo sa Bundok Gerizim upang pagpalain ang bayan: sina Simeon, Levi, Juda, Isacar, Jose[a], at Benjamin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa talaang ito ng mga lipi, kinakatawan ni Jose ang mga lipi nina Efraim at Manases.
    reason: cross_reference
lexical_decisions:
- source_word: אֵלֶּה יַעַמְדוּ
  choice: Ang mga ito ang tatayo
  rationale: Pinananatili ang pangmaramihang pantukoy at ang lakas ng tagubilin sa konteksto, habang natural ang ayos sa makabagong Tagalog.
- source_word: לְבָרֵךְ אֶת הָעָם
  choice: upang basbasan ang bayan
  rationale: Ang לְ na kasunod ng pawatas ay nagsasaad ng layunin. Ang “basbasan” ay malinaw at marangal na katumbas ng pagkakaloob o pagpapahayag ng pagpapala, at ang “bayan” ay tumutukoy sa Israel bilang kabuuang sambayanan.
- source_word: עַל הַר גְּרִזִים
  choice: sa Bundok Gerizim
  rationale: Natural sa Tagalog ang “sa Bundok” para sa lokasyon; pinananatili ang pangalang Gerizim sa transliterasyon.
- source_word: בְּעָבְרְכֶם אֶת הַיַּרְדֵּן
  choice: pagkatawid ninyo sa Jordan
  rationale: Ang בְּ kasama ng infinitive construct at hulaping pangmaramihan ay temporal. Ipinahihiwatig ng “pagkatawid ninyo” na magaganap ang seremonya matapos nilang tumawid, nang hindi dinaragdagan ng salitang wala sa Hebreo.
- source_word: שִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וְיוֹסֵף וּבִנְיָמִן
  choice: sina Simeon, Levi, Juda, Isacar, Jose, at Benjamin
  rationale: Ginamit ang karaniwang anyong Filipino ng mga pangalan at ang “sina” bilang natural na pananda sa talaan ng mga pangalang pantangi.
theological_decisions:
- issue: Lakas ng utos tungkol sa pagtayo ng mga lipi
  choice: “ang tatayo” bilang inaasahang pagkilos sa ilalim ng tagubilin
  alternative: “ang dapat tumayo” o isang purong prediksiyong “ang tatayo” na walang kontekstuwal na puwersang nag-uutos
  rationale: Ang imperfect na יַעַמְדוּ ay nasa loob ng mga tagubilin ni Moises para sa seremonya. Ang salin ay likas sa Tagalog at hindi ginagawang mas tahasang obligasyon kaysa sa anyong Hebreo.
- issue: Kahulugan ng “Jose” sa talaan ng mga lipi
  choice: Pinanatili ang “Jose” sa pangunahing teksto
  alternative: “mga lipi ni Jose” o “Efraim at Manases”
  rationale: Jose mismo ang tahasang nakasulat sa Hebreo. Ang pagpapalit nito sa mga pangalan ng kaniyang mga anak ay magiging paliwanag na lampas sa pangunahing teksto; inilagay sa talababa ang impormasyong pangkonteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang sobrang lumang pananalita at pinanatili ang maikli at pormal na himig ng tagubilin. Inilagay ang panandang [a] pagkatapos ng “Jose,” sapagkat iyon ang salitang ipinaliliwanag ng talababa.
