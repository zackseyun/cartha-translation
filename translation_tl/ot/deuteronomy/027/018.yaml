  yaml_path: translation/ot/deuteronomy/027/018.yaml
  text: Cursed is the one who misleads a blind man on the road. And all the people shall say[a], ‘Amen.’
translation:
  language: tl
  text: “Sumpain ang nagliligaw sa isang bulag na lalaki sa daan.” At sasabihin ng buong bayan, “Amen.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Sumpain ang
  rationale: Naghahayag ito ng pormulang sumpa sa tipan. Likas at marangal sa Filipino ang “Sumpain ang,” at pinananatili nito ang lakas ng pormal na kapahayagan.
- source_word: מַשְׁגֶּה
  choice: nagliligaw
  rationale: Ang Hiphil participle ay tumutukoy sa taong sanhi upang maligaw ang iba. Ang “nagliligaw” ay malinaw at pinananatili ang diwa ng sadyang pag-akay sa maling direksiyon nang hindi ipinipilit ang motibo.
- source_word: עִוֵּר
  choice: isang lalaking bulag
  rationale: Ang pang-uri ay ginagamit bilang pangngalan at nasa panlalaking isahan. Ipinapakita ng salin ang isang indibidwal na lalaki sa legal na halimbawang ito.
- source_word: בַּדָּרֶךְ
  choice: sa daan
  rationale: Konkreto at panlunan ang parirala rito. Ang “sa daan” ay natural sa Filipino at hindi ito ginagawang metaporikal.
- source_word: וְאָמַר
  choice: At sasabihin
  rationale: Sa sunud-sunod na tagubiling liturhikal, ang waw + qatal ay may itinakdang hinaharap o injunctive na diwa. Ang “sas sabihin” ay kumakatawan sa iniuutos na tugon ng bayan.
- source_word: כָּל הָעָם
  choice: ang buong bayan
  rationale: Ang “buong bayan” ay natural na katumbas ng kolektibong “all the people” at hindi nagdaragdag ng “Israel,” na wala sa mismong talata.
- source_word: אָמֵן
  choice: Amen
  rationale: Ang “Amen” ay kinikilalang tugong liturhikal sa Filipino at pinananatili ang tungkulin nito bilang pagpapatibay sa sumpa.
theological_decisions:
- issue: Kasarian sa substantibong pang-uring עִוֵּר
  choice: isang lalaking bulag
  alternative: isang taong bulag; isang bulag
  rationale: Panlalaking isahan ang anyong Hebreo at isang indibidwal na kaso ang inilalarawan. Pinananatili ito nang hindi pinalalawak bilang pangkalahatang uri lamang.
- issue: Anyo ng pormulang sumpa
  choice: Sumpain ang nagliligaw...
  alternative: Isinumpa ang nagliligaw...; Nawa’y sumpain ang nagliligaw...
  rationale: Pormal na kapahayagan ng sumpa sa tipan ang Hebreo, hindi simpleng paglalarawan ng nakaraang kalagayan ni isang tahasang pansariling kahilingan. Ang “Sumpain ang” ang pinakanatural na pormulang legal-liturhikal sa Filipino.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “buong bayan” para sa kolektibong sambayanan at “sa daan” para sa kongkretong lokasyon. Walang talababa sapagkat sapat na nailalahad sa teksto ang leksikal na diwa; ang ibinigay na Ingles na talababa ay inuulit lamang ang alternatibong anyo ng parehong parirala.
