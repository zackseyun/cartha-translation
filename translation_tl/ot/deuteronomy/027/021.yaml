base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/021.yaml
  text: Cursed is he who lies with any animal. And all the people shall say[a], ‘Amen.’
translation:
  language: tl
  text: “Sumpain ang lalaking[a] sumisiping sa anumang hayop.” At sasabihin ng buong bayan, “Amen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang sinumang sumisiping sa anumang hayop.” Panlalaking isahan ang anyong Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: אָרוּר
  choice: Sumpain
  rationale: Karaniwang pormula ito ng sumpa sa tipan. Likas at maringal sa Filipino ang “Sumpain” at napapanatili nito ang mariing pahayag ng Hebreo.
- source_word: שֹׁכֵב
  choice: sumisiping
  rationale: Seksuwal na eupemismo ang pandiwa sa kontekstong legal. Ang “sumisiping sa” ay natural na eupemismo sa Filipino at hindi ginagawang higit na tahasan ang orihinal.
- source_word: עִם
  choice: sa
  rationale: Ang “sa” ang natural na pang-ukol sa idyomang Filipino na “sumiping sa,” bagaman literal na katumbas ng Hebreo ang “kasama/kasiping.”
- source_word: כָּל בְּהֵמָה
  choice: anumang hayop
  rationale: Ipinapahayag ng “anumang” ang distributibong diwa ng כָּל, at mas malawak at mas natural ang “hayop” kaysa “alagang hayop” o “mabangis na hayop.”
- source_word: שֹׁכֵב
  choice: ang lalaking sumisiping
  rationale: Ang participle ay panlalaking isahan at ginagamit bilang pangngalan. Pinananatili ng “lalaking” ang tunay na gramatikal at malamang na legal na pagtukoy sa lalaki.
- source_word: וְאָמַר
  choice: At sasabihin
  rationale: Ipinagpapatuloy nito ang takdang tugon sa seremonya; ang panghinaharap na “sasabihin” ay natural sa Filipino at nananatili ang pormal na indayog.
- source_word: כָּל הָעָם
  choice: buong bayan
  rationale: Natural na kolektibong salin ito ng “lahat ng bayan/mga tao” sa konteksto ng kapulungan, nang hindi idinaragdag ang “Israel.”
- source_word: אָמֵן
  choice: Amen
  rationale: Kinikilalang liturhikal na pagpapatibay ito sa Filipino at pinananatili ang anyo at tungkulin ng salitang Hebreo.
theological_decisions:
- issue: Panlalaking isahang substantive participle sa pormula ng legal na sumpa
  choice: ang lalaking sumisiping
  alternative: ang sinumang sumisiping
  rationale: Panlalaking isahan ang anyong Hebreo at malamang na lalaki ang tuwirang inilalarawan sa batas. Hindi ito ginawang neutral sa pangunahing teksto; itinatala sa talababa ang posibleng pangkalahatang legal na pagbasa.
translation_notes:
  register: Modernong Filipino na pormal at maringal, angkop sa pampublikong pagbasa. Ginamit ang “sumisiping” upang mapanatili ang eupemistikong rehistro ng Hebreo; iniwasan ang mas tahasang parirala. Ang marker na [a] ay inilagay sa mismong teksto.
