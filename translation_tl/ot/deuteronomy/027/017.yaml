  text: אָר֕וּר מַסִּ֖יג גְּב֣וּל רֵעֵ֑/הוּ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/017.yaml
  text: Cursed is the one who moves his neighbor’s boundary marker. And all the people shall say[a], “Amen.”
translation:
  language: tl
  text: “Sumpain ang sinumang naglilipat ng palatandaan ng hangganan ng lupa ng kanyang kapwa.” At sasabihin ng buong bayan, “Amen.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Sumpain
  rationale: Karaniwan at mariing pormula ito ng sumpa sa tipan; pinananatili ng “Sumpain” ang legal at panrelihiyong bigat nito sa likas na modernong Filipino.
- source_word: מַסִּיג
  choice: ang sinumang naglilipat
  rationale: Ang participle ay tumutukoy sa taong gumagawa ng ganitong pagkakasala. Ang “naglilipat” ay saklaw ang pandarayang pag-usog sa tanda ng hangganan, hindi lamang ang lubusang pag-aalis nito.
- source_word: גְּבוּל
  choice: palatandaan ng hangganan ng lupa
  rationale: Sa kontekstong legal tungkol sa ari-arian, maaaring tukuyin ng salita ang hangganan at, sa kongkreto, ang tandang nagtatakda rito. Nililinaw ng salin ang sinaunang gawain nang hindi gumagamit ng maaaring malabong “muhon” lamang.
- source_word: רֵעֵהוּ
  choice: ng kanyang kapwa
  rationale: Tumutukoy ito sa kapwa miyembro ng pamayanan sa kontekstong panlipunan at legal. Likas sa Filipino ang “kapwa” at pinananatili ng “kanyang” ang pang-isahang hulaping Hebreo.
- source_word: וְאָמַר
  choice: At sasabihin
  rationale: Ipinagpapatuloy nito ang pormulang liturhikal at legal ng sama-samang pagpapatibay. Ang aspektong Filipino ay natural na nagpapahayag ng itinakdang tugon.
- source_word: כָּל הָעָם
  choice: ng buong bayan
  rationale: Tapat itong nagsasaad sa lahat ng taong tinutukoy nang hindi idinaragdag sa talata ang “Israel,” bagaman malinaw iyon sa konteksto.
- source_word: אָמֵן
  choice: Amen
  rationale: Kinikilalang tugong liturhikal sa Filipino ang “Amen” at pinananatili nito ang sama-samang pagsang-ayon at pagpapatibay sa ipinahayag na sumpa.
theological_decisions:
- issue: Ang pormula ng sumpa sa kontekstong legal ng tipan
  choice: Sumpain ang sinumang naglilipat ng palatandaan ng hangganan ng lupa ng kanyang kapwa
  alternative: Isinumpa ang nag-aalis ng muhon ng kanyang kapwa
  rationale: Pormal na sumpa ng tipan ito laban sa mapanlinlang na pangangamkam ng lupa sa pamamagitan ng pag-usog ng hangganan. Pinananatili ng salin ang bigat nito at nililinaw ang pisikal na palatandaan nang hindi nililimitahan ang kilos sa lubusang pag-aalis.
- issue: Kasarian at pang-isahang participle
  choice: ang sinumang ... ng kanyang kapwa
  alternative: ang lalaking ... ng kanyang kapwa
  rationale: Masculine singular ang anyong Hebreo ngunit kumakatawan ito sa indibiduwal na lumalabag. Pinananatili ng “sinumang” ang pang-isahang legal na kaso nang hindi nagdaragdag ng tahasang “lalaki,” samantalang ang “kanyang” ay umaayon sa pang-isahang hulapi.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “palatandaan ng hangganan ng lupa” upang maging malinaw sa karaniwang mambabasa ang legal na konteksto ng ari-arian; iniwasan ang sobrang teknikal o posibleng di-pamilyar na katawagan. Walang talababa dahil naipaliwanag nang sapat sa pangunahing teksto ang konkretong kahulugan.
