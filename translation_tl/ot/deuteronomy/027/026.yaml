base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/026.yaml
  text: Cursed is the one who does not uphold the words of this law by doing them. And all the people shall say[a], “Amen.”
translation:
  language: tl
  text: “Sumpain ang sinumang hindi nagtataguyod ng mga salita ng kautusang ito sa pamamagitan ng pagtupad sa mga ito.” At sasabihin ng buong bayan, “Amen.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Sumpain
  rationale: Karaniwang pormula ito ng sumpa sa tipan. Ang “Sumpain” ay malinaw, marangal, at natural sa makabagong Filipino.
- source_word: אֲשֶׁר
  choice: ang sinumang
  rationale: Ipinahahayag nito ang pangkalahatang pagtukoy sa bawat taong saklaw ng sumpa nang hindi nililimitahan sa kasarian.
- source_word: לֹא יָקִים
  choice: hindi nagpapatibay
  rationale: Ang Hiphil ng קום ay maaaring mangahulugang magpatibay, magpanatili, o magtatag bilang may bisa. Pinananatili ng “nagpapatibay” ang aspektong ito at hindi ito ipinapantay lamang sa “pagtupad,” na tahasang sumusunod sa talata.
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: sa mga salita ng kautusang ito
  rationale: Ang דִּבְרֵי ay “mga salita” o “mga bagay,” at sa konteksto ng Deuteronomio, ang תּוֹרָה ay ang tipanang kautusan. Ang “kautusan” ay mas angkop dito kaysa sa mas malawak na “turo.”
- source_word: לַעֲשׂוֹת אֹתָם
  choice: sa pamamagitan ng pagsasagawa ng mga iyon
  rationale: Ipinakikita ng pariralang pawatas kung paano pinagtitibay ang kautusan—sa aktuwal na pagsasagawa nito. Pinananatili rin nito ang pagkakaiba ng “pagpapatibay” at “pagsasagawa.”
- source_word: וְאָמַר כָּל הָעָם
  choice: At sasabihin ng buong bayan
  rationale: Sa liturhikal at legal na pagkakasunod-sunod, ang anyo ng pandiwa ay may itinakda o tagubiling diwa, kaya ang panghinaharap na “sasabihin” ay angkop.
- source_word: אָמֵן
  choice: Amen
  rationale: Kinikilala at ginagamit na ito sa Filipino bilang pormal na tugon ng pagsang-ayon at pagpapatunay.
theological_decisions:
- issue: Diwa ng obligasyon sa tipan sa יָקִים ... לַעֲשׂוֹת אֹתָם
  choice: Ang sumpa ay ukol sa taong hindi nagpapatibay sa kautusan sa pamamagitan ng aktuwal na pagsasagawa nito.
  alternative: Maaaring unawain ito bilang hindi pagkumpirma o hindi pagpapanatiling may bisa sa kautusan, o sa mas payak na paraan bilang hindi pagtupad dito.
  rationale: Pinagsasama ng Hebreo ang pagpapatibay o pagpapanatili ng bisa ng kautusan at ang pagsasagawa nito. Pinananatili ng salin ang dalawang sangkap nang hindi ito nilulutas sa isang mas makitid na pormulang teolohikal.
- issue: Pangkalahatang pagtukoy ng אֲשֶׁר
  choice: ang sinumang
  alternative: ang taong; siya na
  rationale: Bagaman isahan ang kayarian sa Hebreo, pangkalahatan ang saklaw nito. Ang “sinumang” ay natural at hindi nagdaragdag ng limitasyong pangkasarian.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang pormal na pormula ng sumpa at ang liturhikal na tugong “Amen.” Ang “nagpapatibay” ay bahagyang pormal ngunit kailangan upang mapanatili ang lawak at tunay na kalabuan ng pandiwang Hebreo.
