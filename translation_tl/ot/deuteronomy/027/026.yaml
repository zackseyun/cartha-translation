  naturalness: Kailangan ng bahagyang pagpapakinis. Mas natural ang “nagtataguyod ng mga salita ng kautusang ito” kaysa “nagpapatibay sa mga salita,” at mas malinaw ang “sa pamamagitan ng pagtupad sa mga ito” kaysa “sa pamamagitan ng pagsasagawa ng mga iyon.”
