revisions:
- from: “Sumpain ang sinumang hindi nagpapatibay[a] sa mga salita ng kautusang ito sa pamamagitan ng pagsasagawa ng mga iyon.” At sasabihin ng buong bayan, “Amen.”
  to: “Sumpain ang sinumang hindi nagtataguyod ng mga salita ng kautusang ito sa pamamagitan ng pagtupad sa mga ito.” At sasabihin ng buong bayan, “Amen.”
  rationale: Pinalitan ang “nagpapatibay sa” ng “nagtataguyod ng” upang maging natural sa Filipino at maipahayag ang pag-uphold o pagpapanatili ng bisa ng kautusan. Pinalitan ang “pagsasagawa ng mga iyon” ng “pagtupad sa mga ito” para sa mas malinaw at likas na pagpapahayag ng pagsunod. Iningatan ang kalabuan ng pandiwang Hebreo sa talababa at ang pormal na pormula ng sumpa sa pangunahing teksto.
