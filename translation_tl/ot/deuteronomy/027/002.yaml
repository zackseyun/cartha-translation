  text: וְ/הָיָ֗ה בַּ/יּוֹם֮ אֲשֶׁ֣ר תַּעַבְר֣וּ אֶת הַ/יַּרְדֵּן֒ אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ וַ/הֲקֵמֹתָ֤ לְ/ךָ֙ אֲבָנִ֣ים גְּדֹל֔וֹת וְ/שַׂדְתָּ֥ אֹתָ֖/ם בַּ/שִּֽׂיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/002.yaml
  text: And on the day when you cross over the Jordan into the land that Yahweh your God is giving you[a], you shall set up for yourself large stones and plaster them with lime.
translation:
  language: tl
  text: At sa araw na tatawid kayo sa Jordan patungo sa lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos, magtayo ka para sa iyong sarili ng malalaking bato at pahiran mo ang mga iyon ng apog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palitada”; ang salitang Hebreo ay tumutukoy sa apog o palitadang ginagamit na pantakip.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם
  choice: At sa araw na
  rationale: Likas na ipinahahayag sa modernong Tagalog ang idyomang Hebreo na nagpapakilala ng isang tiyak na pangyayari sa hinaharap, nang hindi gumagamit ng matigas na literal na anyo.
- source_word: תַּעַבְרוּ
  choice: tumawid kayo
  rationale: Ang pandiwa ay nasa ikalawang panauhang maramihan at tumutukoy sa pagtawid mula sa isang pampang ng Jordan patungo sa kabila.
- source_word: הַיַּרְדֵּן
  choice: Jordan
  rationale: Sapat at karaniwan sa saling biblikal ang pangalang Jordan; malinaw sa konteksto na ilog ang tinutukoy.
- source_word: הָאָרֶץ
  choice: lupain
  rationale: Pinananatili ng “lupain” ang heograpiko at tipanang diwa ng אֶרֶץ sa Deuteronomio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: נֹתֵן
  choice: ibinibigay
  rationale: Ipinahahayag ng kasalukuyang aspekto ang pagkilos bilang nagaganap o tiyak mula sa pananaw ng nagsasalita.
- source_word: וַהֲקֵמֹתָ לְךָ
  choice: magtayo ka para sa iyong sarili
  rationale: Ang Hiphil ng קום ay nangangahulugang magtayo o maglagay nang nakatayo. Pinananatili ng isahang “ka/iyong” ang biglang paglipat ng Hebreo mula sa maramihang kausap tungo sa isahang kolektibong kausap.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: malalaking bato
  rationale: Ito ang malinaw at likas na modernong Tagalog para sa laki ng mga batong iuutos na itayo.
- source_word: וְשַׂדְתָּ אֹתָם
  choice: at pahiran mo ang mga iyon
  rationale: Ang pandiwa ay tumutukoy sa paglalagay ng pantakip sa mga bato; malinaw ang “pahiran” kasama ng materyal na apog.
- source_word: בַּשִּׂיד
  choice: ng apog
  rationale: Ang שִׂיד ay apog o palitadang pantakip. Pinipili ang “apog” upang tukuyin ang materyal at maiwasan ang paulit-ulit na “palitadahan ng palitada.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo, nang hindi nagdaragdag ng sektaryang pagpapakahulugan.
- issue: Pagpapalit mula maramihan tungo sa isahang kausap
  choice: “tumawid kayo” ngunit “sa iyo… magtayo ka”
  alternative: Gawing pare-parehong maramihan o pare-parehong isahan ang lahat ng panghalip at pandiwa
  rationale: Tunay na nagpapalit ang Hebreo mula sa maramihang תעברו tungo sa mga anyong isahan אלהיך, לך, והקמת, at שדת. Pinananatili ang tensiyong gramatikal sa halip na tahimik itong pakinisin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang “kayo/ka” sa halip na mga arkaykong anyo. Sadyang pinanatili ang paglipat ng bilang ng kausap sa Hebreo, kahit bahagya itong kapansin-pansin sa Tagalog. Inilagay ang talababa sa “apog,” ang salitang talagang nililinaw nito.
