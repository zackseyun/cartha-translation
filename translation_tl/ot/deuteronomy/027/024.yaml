base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/024.yaml
  text: Cursed is the one who strikes down his neighbor in secret. And all the people shall say[a], “Amen.”
translation:
  language: tl
  text: “Sumpain ang sinumang manakit[a] sa kapwa niya nang palihim.” At sasabihin ng buong bayan, “Amen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hampasin” o “patayin”; ang pandiwang Hebreo ay maaaring tumukoy sa iba’t ibang antas ng karahasan, mula sa paghampas hanggang sa nakamamatay na pananakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Sumpain
  rationale: Ang pormulang ito ay nagpapahayag ng sumpa sa konteksto ng tipan. Ang “Sumpain” ay malinaw, marangal, at natural sa Filipino.
- source_word: מַכֵּה
  choice: nananakit
  rationale: Malawak ang saklaw ng pandiwang נכה—mula sa paghampas hanggang sa nakamamatay na karahasan. Ipinahihiwatig ng “nananakit” ang marahas na paggawa nang hindi nililimitahan ang kahulugan sa tahasang pagpatay.
- source_word: רֵעֵהוּ
  choice: sa kapwa niya
  rationale: Ang רֵעַ ay tumutukoy sa kapuwa o kasamahan sa pamayanan. Mas likas at mas malawak sa modernong Filipino ang “kapwa” kaysa “kapitbahay” sa kontekstong ito.
- source_word: בַּסָּתֶר
  choice: nang palihim
  rationale: Tumutukoy ito sa kilos na ikinukubli sa paningin ng iba. Ang “nang palihim” ay tuwiran at natural na katumbas.
- source_word: וְאָמַר
  choice: At sasabihin
  rationale: Sa seremonyal na pagkakasunod-sunod, ipinakikita ng anyo ang itinakdang tugon ng bayan. Pinananatili ng “At sasabihin” ang pormal na daloy.
- source_word: כָּל הָעָם
  choice: ang buong bayan
  rationale: Likas sa Filipino ang “buong bayan” para sa lahat ng taong nagkakatipon bilang isang sambayanan, nang hindi idinaragdag ang “Israel” na hindi tahasang nasa talata.
- source_word: אָמֵן
  choice: Amen
  rationale: Ang “Amen” ay matatag nang salitang panliturhiya sa Filipino at pinananatili ang diwa ng pagsang-ayon sa pahayag ng sumpa.
theological_decisions:
- issue: Tindi ng karahasang ipinahihiwatig ng מַכֵּה
  choice: nananakit
  alternative: humahampas; pumapatay
  rationale: Maaaring tumukoy ang נכה sa pananakit o sa nakamamatay na karahasan. Hindi nilulutas ng salin ang tunay na lawak ng pandiwa; inilalagay sa talababa ang mahahalagang alternatibo upang hindi paliitin ang teksto sa simpleng paghampas o sa tiyak na pagpatay lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at pormal na himig ng seremonyal na sumpa at tugon ng bayan.
