  source_fidelity: 'Tumpak ang pangunahing diwa: pormula ng sumpa laban sa lihim na pananakit sa kapwa, na sinusundan ng tugon ng buong bayan. Gayunman, ang “taong nananakit” ay mas madaling basahing nakagawiang pananakit kaysa isang partikular na gawaing isinumpa sa pormula. Ang “sinumang manakit” ay mas tuwiran at likas, habang pinananatili ang lawak ng מַכֵּה.'
  naturalness: Marangal at madaling unawain ang register. Mas natural at mas maigsi sa modernong Filipino ang “Sumpain ang sinumang manakit sa kapwa niya nang palihim” kaysa “Sumpain ang taong nananakit …”.
  terminology: Ang “Sumpain,” “kapwa,” “nang palihim,” “buong bayan,” at “Amen” ay angkop. Iniaayos ang talababa upang ang mga alternatibo ay tumugma sa anyo at sintaksis ng salin.
  issues:
