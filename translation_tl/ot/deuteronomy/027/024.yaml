    issue: Ang “taong nananakit” ay aspektuwal na maaaring magpahiwatig ng nakagawiang pagkilos.
    rationale: Ang Hebreong participle ay tumutukoy sa gumagawa ng ipinagbabawal na kilos sa pormula ng sumpa; sa Filipino, ang “sinumang manakit” ay mas malinaw na tumutukoy sa sinumang gumawa ng naturang kilos nang hindi ipinapasok ang diwa ng habitual na asal.
  - severity: low
    issue: Hindi tugma ang aspekto ng mga alternatibo sa talababa sa pangunahing salin.
    rationale: Ang “humahampas” at “pumapatay” ay presenteng anyo, samantalang ang rebisyong pangunahing teksto ay gumagamit ng “manakit.” Ang “hampasin” at “patayin” ay mas malinaw na leksikal na mga alternatibo sa kontekstong ito.
