  text: אֲבָנִ֤ים שְׁלֵמוֹת֙ תִּבְנֶ֔ה אֶת מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הַעֲלִ֤יתָ עָלָי/ו֙ עוֹלֹ֔ת לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/006.yaml
  text: You shall build the altar of Yahweh your God with whole stones[a], and you shall offer burnt offerings on it to Yahweh your God.
translation:
  language: tl
  text: Itayo mo ang altar ni Yahweh na iyong Diyos gamit ang mga batong buo[a], at maghandog ka roon ng mga handog na sinusunog para kay Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga batong hindi tinabas.” Ang literal na sinasabi ng Hebreo ay “mga batong buo/ganap”; ang “hindi tinabas” ay batay sa kaugnay na tagubilin na huwag gamitan ng kasangkapang bakal ang mga ito (tal. 5).
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שְׁלֵמוֹת
  choice: mga batong buo
  rationale: Tuwirang ipinahahayag ng שְׁלֵמוֹת na ang mga bato ay buo o ganap. Pinananatili ng saling ito ang payak na diwa ng Hebreo; ang “mga batong hindi tinabas” ay kontekstuwal na pagpapakahulugan batay sa pagbabawal sa paggamit ng kasangkapang bakal sa talata 5.
- source_word: תִּבְנֶה
  choice: Itayo mo
  rationale: Ang imperfect sa kontekstong nagbibigay ng tagubilin ay may puwersa ng utos. Natural at marangal sa modernong Tagalog ang “Itayo mo” para sa pagtatayo ng altar.
- source_word: מִזְבַּח
  choice: altar
  rationale: Karaniwan, malinaw, at tiyak na katawagan sa Tagalog para sa estrukturang pinaghahandugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang inilalarawan ng hulaping pangalawang panauhang panlalaki at isahan ang ugnayang “iyong Diyos.”
- source_word: וְהַעֲלִיתָ עָלָיו
  choice: at maghandog ka roon
  rationale: Sa konteksto ng paghahain, ang Hiphil ng עלה ay nangangahulugang mag-alay o maghandog. Ang “roon” ay natural na tumutukoy sa altar at hindi nagpapahiwatig na nasa ibabaw lamang inilalagay ang handog.
- source_word: עוֹלֹת
  choice: mga handog na sinusunog
  rationale: Ito ang kinikilalang uri ng hain na sinusunog nang buo. Malinaw ito sa ordinaryong mambabasa habang pinananatili ang sakripisyal na kahulugan.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang ל ay nagpapahayag dito ng paglalaan o patutunguhan ng handog. Natural sa Tagalog ang “para kay Yahweh” sa konteksto ng paghahandog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tuwirang nasa Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kung bibigyang-kahulugan ang שְׁלֵמוֹת bilang “hindi tinabas”
  choice: mga batong buo
  alternative: mga batong hindi tinabas
  rationale: Ang mismong pang-uri ay nangangahulugang buo o ganap. Bagaman ipinagbabawal ng naunang talata ang paggamit ng bakal sa mga bato, hindi tahasang nangangahulugang “hindi tinabas” ang pang-uri; kaya nasa talababa ang kontekstuwal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang tuwirang pautos na “Itayo mo” at “maghandog ka,” pinanatili ang pangalang Yahweh, at iniwasan ang labis na teknikal o makalumang pananalita.
