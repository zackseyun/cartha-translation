    rationale: Maaaring tumukoy ang “pino” sa pagiging disente o elegante, samantalang ipinahihiwatig ng pinagmulan ang labis na delicacy/luxury.
  - severity: low
    issue: Hindi ganap na likas ang “asawang kapiling niya sa kaniyang dibdib.”
    rationale: Mas malinaw ang idyomatikong diwa sa “asawang pinakamalapit sa kaniya”; ang literal na “asawa ng kaniyang dibdib” ay maipapaliwanag sa talababa.
