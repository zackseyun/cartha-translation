- from: Ang lalaking maamo sa inyo at napakapino—magiging masama ang tingin niya sa kaniyang kapatid[a], sa asawang kapiling niya sa kaniyang dibdib[b], at sa iba pa niyang mga anak na natitira.
  to: Ang lalaking malambot at napakaselan sa inyo ay magiging masama ang pakikitungo niya sa kaniyang kapatid[a], sa asawang pinakamalapit sa kaniya[b], at sa iba pa niyang mga anak na natitira.
  rationale: Inayos ang mga salitang naglalarawan sa lalaki upang maipahayag ang pagiging malambot at napakaselan sa pinagmulan, hindi lamang pagiging maamo o pino. Ginawang mas likas ang parirala tungkol sa asawa, at ipinaliwanag sa talababa ang literal na larawan. Ang pagsasalin sa idyomang “masamang mata” bilang masamang pakikitungo ay sinusuportahan ng talababa upang mapanatili ang malawak na saklaw ng kahulugan nito.
