base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/054.yaml
  text: The man who is tender among you and very delicate—his eye will be hostile toward his brother[a], toward the wife of his bosom[b], and toward the rest of his children whom he has left.
translation:
  language: tl
  text: Ang lalaking malambot at napakaselan sa inyo ay magiging masama ang pakikitungo niya sa kaniyang kapatid[a], sa asawang pinakamalapit sa kaniya[b], at sa iba pa niyang mga anak na natitira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Idyoma sa Hebreo: “magiging masama ang kaniyang mata sa,” na maaaring magpahayag ng poot, pagkamaramot, o pag-aatubiling magbahagi.'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “asawa ng kaniyang dibdib,” isang larawan ng asawang malapit at minamahal.
    reason: idiom_explanation
lexical_decisions:
- source_word: הָאִישׁ
  choice: Ang lalaking
  rationale: Tiyak na lalaking indibidwal ang tinutukoy, kaagapay ng paglalarawan sa babae sa kasunod na talata.
- source_word: הָרַךְ
  choice: maamo
  rationale: Ipinahihiwatig ng salita ang pagiging malambot o banayad; natural na inilalarawan ng “maamo” ang dating asal ng lalaki bago ang malupit na kilos sa panahon ng pagkubkob.
- source_word: וְהֶעָנֹג מְאֹד
  choice: at napakapino
  rationale: Ipinapakita ng parirala ang labis na karangyaan at maselang pamumuhay nang hindi labis na ipinapakahulugang siya ay pinalayaw.
- source_word: תֵּרַע עֵינוֹ
  choice: magiging masama ang tingin niya
  rationale: Pinananatili nito sa natural na Tagalog ang Hebreong idyomang literal na tumutukoy sa pagiging masama ng mata; sa konteksto, nagpapahayag ito ng pagkamaramot, pagkamuhi, o pagtangging magbahagi.
- source_word: בְאָחִיו
  choice: sa kaniyang kapatid
  rationale: Ang karaniwang kahulugan ay tunay na kapatid, bagaman maaari ring lumawak sa malapit na kamag-anak.
- source_word: אֵשֶׁת חֵיקוֹ
  choice: sa asawang kapiling niya sa kaniyang dibdib
  rationale: Pinananatili ang larawan ng dibdib bilang tanda ng pinakamalapit at matalik na ugnayan, ngunit isinaayos upang maging malinaw sa modernong Tagalog.
- source_word: יֶתֶר בָּנָיו
  choice: sa iba pa niyang mga anak
  rationale: Maaaring gamitin ang בנים nang inklusibo para sa mga anak; ang “iba pa” ay natural na katumbas ng natitirang bahagi.
- source_word: אֲשֶׁר יוֹתִיר
  choice: na natitira
  rationale: Ang pandiwa ay nangangahulugang mag-iwan o magkaroon ng natitira; dito ay tumutukoy sa mga anak na nananatili pa sa kaniya.
