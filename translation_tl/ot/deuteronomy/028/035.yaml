  - severity: medium
    issue: Hindi malinaw ang saklaw ng “na hindi mapagagaling.”
    rationale: Dahil kasunod ito ng “mga tuhod at mga binti,” maaari itong mabasa na tumutukoy sa mga bahaging iyon ng katawan. Dapat ipakitang ang mga pigsa ang hindi magagamot.
