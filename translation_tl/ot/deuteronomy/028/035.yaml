  source_fidelity: Ang “Pahihirapan ka” ay nagpapahayag ng pagdurusa ngunit hindi sapat na naipapakita ang tuwirang pandiwang יַכְּךָ (“hahampasin/sasalutin ka”). Ang “sasalutin” ay likas sa Tagalog kapag sakit o salot ang ipinadadala at pinananatili ang direktang pagkilos ni Yahweh. Nililinaw rin ng rebisyon na ang mga pigsa ang hindi magagamot, hindi ang mga binti.
  naturalness: Natural at marangal ang “Sasalutin ka ni Yahweh ng malulubhang pigsa” sa modernong Filipino Tagalog. Ang paghihiwalay sa pariralang “mga pigsa na hindi mo magagamot” ay umiiwas sa hindi malinaw na pagkakabit ng “na hindi mapagagaling” sa “mga binti.”
  terminology: Pinanatili ang “Yahweh,” “malulubhang pigsa,” “tuhod,” “binti,” “talampakan,” at “tuktok ng ulo.” Ang talababa sa “mga lulod” ay wastong naghahatid ng mas tiyak na saklaw ng שׁוֹק.
