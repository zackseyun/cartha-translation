base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/035.yaml
  text: Yahweh will strike you with severe boils on the knees and on the legs[a], from which you cannot be healed, from the sole of your foot to the crown of your head.
translation:
  language: tl
  text: Sasalutin ka ni Yahweh ng malulubhang pigsa sa iyong mga tuhod at binti[a]—mga pigsang hindi mo magagamot—mula sa talampakan ng iyong paa hanggang sa tuktok ng iyong ulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lulod”; mas tiyak na tumutukoy ang salitang Hebreo sa ibabang bahagi ng binti.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: Pahihirapan ka
  rationale: Ang Hiphil ng נכה ay literal na tumutukoy sa paghampas o pananakit. Sa konteksto ng sakit bilang sumpa, natural sa modernong Tagalog ang “pahihirapan ka” at malinaw na nananatiling si Yahweh ang tuwirang gumagawa nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: בִּשְׁחִין רָע
  choice: ng malulubhang pigsa
  rationale: Ang שְׁחִין ay pigsa o namamagang sakit sa balat, at ang רָע ay nagpapahayag ng tindi o bigat. Ang maramihang “mga pigsa” ay natural sa Tagalog para sa kolektibong diwa ng pangngalang Hebreo.
- source_word: עַל הַבִּרְכַּיִם
  choice: sa iyong mga tuhod
  rationale: Tuwirang katumbas na anatomikal at natural sa Tagalog.
- source_word: וְעַל הַשֹּׁקַיִם
  choice: at mga binti
  rationale: Ang שׁוֹק ay tumutukoy nang mas tiyak sa ibabang bahagi ng binti. Ginamit ang karaniwang “binti” sa teksto at pinanatili sa talababa ang mas tiyak na kahulugan.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: na hindi mapagagaling
  rationale: Pinananatili ng anyong balintiyak ang diwang walang lunas ang kondisyon, nang hindi tinutukoy kung sino ang posibleng manggagamot.
- source_word: מִכַּף רַגְלְךָ
  choice: mula sa talampakan ng iyong paa
  rationale: Ang כַּף kapag kaugnay ng paa ay idyomatikong tumutukoy sa talampakan.
- source_word: וְעַד קָדְקֳדֶךָ
  choice: hanggang sa tuktok ng iyong ulo
  rationale: Ang קָדְקֹד ay tuktok o korona ng ulo. Ang parirala ay natural at pinananatili ang saklaw sa buong katawan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang personal na pangalan sa pamamagitan ng karaniwang akademikong transliterasyong “Yahweh,” sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “malulubhang pigsa” at “hindi mapagagaling” bilang likas na pananalita habang pinananatili ang tindi, tuwirang pagkilos ng Diyos, at saklaw sa buong katawan sa tekstong Hebreo.
