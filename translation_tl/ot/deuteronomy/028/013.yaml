  text: וּ/נְתָֽנְ/ךָ֨ יְהוָ֤ה לְ/רֹאשׁ֙ וְ/לֹ֣א לְ/זָנָ֔ב וְ/הָיִ֨יתָ֙ רַ֣ק לְ/מַ֔עְלָ/ה וְ/לֹ֥א תִהְיֶ֖ה לְ/מָ֑טָּה כִּֽי תִשְׁמַ֞ע אֶל מִצְוֺ֣ת יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם לִ/שְׁמֹ֥ר וְ/לַ/עֲשֽׂוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/013.yaml
  text: And Yahweh will make you the head and not the tail[a], and you will be only above, and you will not be beneath, if you listen to the commandments of Yahweh your God that I am commanding you today, to keep and to do them.
translation:
  language: tl
  text: At gagawin kang ulo ni Yahweh, at hindi buntot. Magiging nasa itaas ka lamang, at hindi sa ibaba, kung makikinig ka[a] sa mga utos ni Yahweh na iyong Diyos, na iniuutos ko sa iyo ngayon, upang tuparin at gawin ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung susundin mo ang mga utos ni Yahweh na iyong Diyos.” Sa Hebreo, “makikinig,” ngunit sa konteksto ng tipan ay kasama rito ang masunuring pakikinig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנְךָ יְהוָה
  choice: At gagawin ka ni Yahweh
  rationale: Sa idyomang may kasunod na panaguring “ulo at hindi buntot,” ang נתן ay may diwang maglagay o gumawa sa isang kalagayan. Likas sa modernong Tagalog ang “gagawin ka” at napapanatili nito ang sanhiang diwa.
- source_word: לְרֹאשׁ וְלֹא לְזָנָב
  choice: na ulo at hindi buntot
  rationale: Pinananatili ang matingkad na Hebreong metapora ng pangunguna at mababang katayuan sa halip na palitan ito ng pagpapaliwanag.
- source_word: וְהָיִיתָ רַק לְמַעְלָה וְלֹא תִהְיֶה לְמָטָּה
  choice: ikaw ay mapapasa itaas lamang at hindi mapapasa ibaba
  rationale: Pinananatili ang magkatapat na larawang pangkalawakan at ang pagbubukod na ipinahihiwatig ng רַק. Ang “mapapasa” ay dignidad ngunit malinaw sa ordinaryong mambabasa.
- source_word: כִּי תִשְׁמַע אֶל
  choice: kung makikinig ka sa
  rationale: Ang כִּי ay kondisyonal sa konteksto ng mga pagpapala. Literal na “makinig” ang שׁמע, ngunit taglay rito ang diwa ng masunuring pakikinig; pinananatili ang salitang pandinig dahil nililinaw ng hulíng mga pandiwa ang pagsunod.
- source_word: מִצְוֺת
  choice: mga utos
  rationale: Natural at malinaw na salin ng maramihang מצוה sa modernong Tagalog, na tumutukoy sa mga tuntunin ng tipan.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang ugnayang tipan na ipinahahayag ng “iyong Diyos.”
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: na iniuutos ko sa iyo ngayon
  rationale: Ipinakikita ng “iniuutos” ang kasalukuyan at nagpapatuloy na puwersa ng participle sa agarang pananalita ni Moises; pinananatili rin ang mahalagang “ngayon.”
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: upang tuparin at gawin ang mga iyon
  rationale: 'Pinananatiling magkahiwalay ang dalawang pandiwa: ang maingat na pagtupad/pangingilin at ang aktuwal na paggawa. Inilalagay ang “mga iyon” bilang likas na tahasang layon sa Tagalog.'
theological_decisions:
- issue: Ang gamit ng כִּי bilang ugnayan ng pangako at pakikinig
  choice: kung makikinig ka
  alternative: sapagkat makikinig ka
  rationale: Sa pagkakasunod ng mga kondisyong tipan sa Deuteronomio 28, ipinakikilala rito ng כִּי ang kondisyon ng pagpapala. Hindi dinaragdagan ng salin ang teksto ng paliwanag tungkol sa merito o mekanismo ng pagpapala.
- issue: Ang diwa ng שׁמע sa konteksto ng tipan
  choice: makikinig ka
  alternative: susunod ka
  rationale: Pinananatili ang pangunahing metapora ng pandinig at ang posibleng lawak nito, habang ipinahihiwatig ng “tuparin at gawin” na ang pakikinig ay inaasahang humantong sa pagsunod.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang mga metaporang “ulo/buntot” at “itaas/ibaba,” gayundin ang personal na pangalang Yahweh. Ginamit ang bahagyang pormal na “mapapasa” upang maipahayag nang maikli at magkatimbang ang magkasalungat na larawan.
