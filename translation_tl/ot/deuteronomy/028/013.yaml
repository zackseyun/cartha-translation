  naturalness: 'Kailangang ayusin ang ilang parirala para sa mas likas na modernong Tagalog: “gagawin kang ulo” ay mas maayos kaysa “gagawin ka ... na ulo,” at “magiging nasa itaas lamang, at hindi sa ibaba” ay malinaw at idiomatiko. Inililipat din ang talababa sa mismong “makikinig ka,” na siyang pariralang nililinaw nito.'
  terminology: Ang “Yahweh,” “Diyos,” at “mga utos” ay angkop at pare-pareho. Ang “tuparin at gawin” ay pinananatili upang maipakita ang magkaibang pandiwang לִשְׁמֹר at לַעֲשׂוֹת nang hindi nagpapataw ng dagdag na interpretasyon.
