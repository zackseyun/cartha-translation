base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/047.yaml
  text: because you did not serve Yahweh your God with joy and with gladness of heart[a], because of the abundance of all things[b],
translation:
  language: tl
  text: sapagkat hindi mo pinaglingkuran si Yahweh na iyong Diyos nang may kagalakan at masayang kalooban[a], dahil sa kasaganaan ng lahat ng bagay[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at may mabuting kalooban.” Literal na tumutukoy ang Hebreo sa “kabutihan ng puso,” isang pariralang maaaring magpahiwatig ng panloob na galak o mabuting kalagayan ng loob.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “mula sa kasaganaan ng lahat.” Ipinahihiwatig ng parirala na nabigo ang Israel na maglingkod kay Yahweh sa kabila ng saganang paglalaan para sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: sapagkat
  rationale: Sa konteksto ng mga sumpa ng tipan, ipinakikilala ng parirala ang dahilan ng darating na kaparusahan; likas at malinaw itong naipapahayag ng “sapagkat.”
- source_word: עָבַדְתָּ
  choice: pinaglingkuran
  rationale: Saklaw ng pandiwa ang paglilingkod sa Diyos bilang pagsamba, katapatan, at pagsunod sa tipan. Hindi ito nililimitahan sa gawaing pagsamba lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nakasulat sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang isinasalin ang pangngalan at ang hulaping panghalip na ikalawang panauhang panlalaking isahan, na tumutukoy sa Israel bilang isang kabuuan.
- source_word: בְּשִׂמְחָה
  choice: nang may kagalakan
  rationale: Ipinapahayag nito ang paraan ng paglilingkod at pinananatili ang tahasang diwa ng galak.
- source_word: וּבְטוּב לֵבָב
  choice: at masayang puso
  rationale: Ang literal na “kabutihan ng puso” ay maaaring tumukoy sa panloob na galak o mabuting kalagayan ng loob. Ang “masayang puso” ay natural sa Tagalog at angkop sa konteksto, habang inilalagay sa talababa ang tunay na leksikal na posibilidad.
- source_word: מֵרֹב כֹּל
  choice: gayong sagana ka sa lahat ng bagay
  rationale: Ipinakikita ng parirala na hindi naglingkod nang nararapat ang Israel sa kabila ng masaganang kaloob. Iniiwasan ng “gayong” ang maling pahiwatig na ang kasaganaan mismo ang tuwirang sanhi ng pagkukulang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng paglilingkod na ipinahihiwatig ng עבד
  choice: pinaglingkuran
  alternative: sinamba
  rationale: Mas malawak ang “pinaglingkuran” kaysa “sinamba” at napapanatili nito ang pagsamba, katapatan, at praktikal na pagsunod na kasama sa paglilingkod sa Diyos sa ilalim ng tipan.
- issue: Ugnayan ng kasaganaan at pagkukulang ng Israel
  choice: gayong sagana ka sa lahat ng bagay
  alternative: dahil sa kasaganaan ng lahat ng bagay
  rationale: Maaaring pormal na tumbasan ng “dahil sa” ang pang-ukol, ngunit sa konteksto ang kasaganaan ay kalagayang nagpapabigat sa pananagutan ng Israel, hindi kinakailangang mekanikal na sanhi ng hindi paglilingkod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinaglingkuran” upang mapanatili ang malawak na diwa ng tapat na paglilingkod sa tipan. Ang kuwit sa hulihan ay nagpapanatili sa sintaktikong pagpapatuloy ng pangungusap patungo sa susunod na talata.
