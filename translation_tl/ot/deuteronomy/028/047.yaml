  terminology: Ang “Yahweh,” “Diyos,” at “pinaglingkuran” ay angkop. Ang “masayang kalooban” ay idiomatiko para sa טוּב לֵבָב sa kontekstong ito, habang pinananatili ng talababa ang mas literal na saklaw na “kabutihan ng puso.”
