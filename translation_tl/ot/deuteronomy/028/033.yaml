base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/033.yaml
  text: A people whom you have not known will eat the fruit of your land and all your labor[b][a], and you will be only oppressed and crushed all your days.
translation:
  language: tl
  text: Kakainin ng isang bayang hindi mo kilala ang bunga ng iyong lupain[a] at ang lahat ng pinaghirapan mo[b], at lagi ka na lamang aapihin at dudurugin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ani ng iyong lupain.”
    reason: lexical_alternative
  - marker: b
    text: O “lahat ng iyong pagpapagal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי אַדְמָתְךָ
  choice: bunga ng iyong lupain
  rationale: Pinananatili nito ang konkretong larawang pansakahan ng Hebreo; maaari ring tumukoy ang parirala sa ani o produkto ng lupain.
- source_word: יְגִיעֲךָ
  choice: ang lahat ng pinaghirapan mo
  rationale: Ang pangngalan ay maaaring tumukoy sa pagpapagal o sa bunga ng pagpapagal. Dahil layon ito ng pandiwang 'kakainin,' mas natural sa Tagalog ang 'pinaghirapan mo,' na nagpapahiwatig ng napagpagalan o naipundar.
- source_word: יֹאכַל
  choice: kakainin
  rationale: Tuwirang pinananatili ang karaniwang kahulugang 'kumain,' na sa konteksto ay nangangahulugang uubusin o pakikinabangan ng ibang bayan ang ani at pinaghirapan.
- source_word: עַם אֲשֶׁר לֹא יָדָעְתָּ
  choice: isang bayang hindi mo kilala
  rationale: Ang 'bayan' ay natural na kolektibong katawagan sa isang dayuhang pangkat; ang 'hindi mo kilala' ay nagpapanatili sa payak at relasyonal na diwa ng ידע nang hindi idinaragdag ang 'kailanman.'
- source_word: רַק
  choice: na lamang
  rationale: Ipinahahayag nito ang eksklusibo at walang-lubay na kalagayan ng pagkapighati sa natural na Tagalog.
- source_word: עָשׁוּק
  choice: aapihin
  rationale: Malinaw nitong ipinapahayag ang pasibong kalagayan ng pagiging inaapi, pinagsasamantalahan, o ginagawan ng kawalang-katarungan.
- source_word: רָצוּץ
  choice: dudurugin
  rationale: Pinananatili ang matinding larawan ng pagkadurog o pagkawasak, at mahusay itong kaagapay ng 'aapihin.'
- source_word: כָּל הַיָּמִים
  choice: lagi
  rationale: Natural na katumbas sa modernong Tagalog ng tuloy-tuloy na tagal na ipinahahayag ng idyomang Hebreo na 'lahat ng mga araw.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pang-isahang 'mo' ayon sa Hebreong tuwirang pakikipag-usap. Ang ayos ng pangungusap ay ginawang natural sa Tagalog habang pinananatili ang pagkakasunod ng pagkawala ng ani at pinaghirapan, saka ang patuloy na pang-aapi at pagdurog.
