  text: You will father sons and daughters[a], but they will not remain yours[b], because they will go into captivity.
translation:
  language: tl
  text: Magkakaroon ka ng mga anak na lalaki at babae, ngunit hindi sila mananatiling iyo[a], sapagkat mapupunta sila sa pagkabihag[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “hindi sila magiging iyo.”
    reason: lexical_alternative
  - marker: b
    text: O, “mapupunta sila sa pagkatapon.” Partikular na tumutukoy ang Hebreo sa pagkabihag.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים וּבָנוֹת
  choice: mga anak na lalaki at babae
  rationale: Tahasang binabanggit ng Hebreo ang kapwa lalaki at babaeng supling. Pinananatili ng salin ang pares sa halip na paikliin ito bilang pangkalahatang “mga anak.”
- source_word: תּוֹלִיד
  choice: magkakaanak ka
  rationale: Ang Hiphil na anyo ng ילד ay tumutukoy sa pagkakaroon o pag-aanak ng mga supling. Ang “magkakaanak ka” ay natural sa modernong Tagalog at hindi gumagamit ng “magsisilang,” na karaniwang tumutukoy sa ina kahit panlalaking isahan ang kausap sa Hebreo.
- source_word: וְלֹא יִהְיוּ לָךְ
  choice: ngunit hindi sila mananatiling iyo
  rationale: Literal itong “at hindi sila magiging para/sa iyo.” Sa konteksto ng pagkabihag, ipinahihiwatig ang pagkawala ng mga anak. Ang “mananatiling iyo” ay malinaw at natural, habang itinatala sa talababa ang mas literal na posibilidad.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala rito ng כִּי ang dahilan kung bakit hindi mananatili sa magulang ang mga anak.
- source_word: יֵלְכוּ
  choice: mapupunta sila
  rationale: Ang pandiwa ay aktibong Qal ng הלך, “pumunta.” Ang “mapupunta” ay natural sa Tagalog sa kontekstong hindi kusang pagkabihag at hindi tahasang nagdaragdag ng pasibong “dadalhin.”
- source_word: בַּשֶּׁבִי
  choice: sa pagkabihag
  rationale: Ang שֶׁבִי ay tumutukoy sa pagkabihag, lalo na bunga ng digmaan o sapilitang pagpapatapon. Mas tuwiran ito kaysa sa mas malawak na “pagkatapon.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang arkaikong “magkakaanak ka ng mga anak” alternatives such as “magliluwal” at ang “magsisilang,” na maaaring magpahiwatig ng babaeng kausap; pinanatili rin ang tahasang “mga anak na lalaki at babae” at ang larawan ng pagkabihag.
