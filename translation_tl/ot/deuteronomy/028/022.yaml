source:
  edition: WLC
  text: יַכְּ/כָ֣ה יְ֠הוָה בַּ/שַּׁחֶ֨פֶת וּ/בַ/קַּדַּ֜חַת וּ/בַ/דַּלֶּ֗קֶת וּ/בַֽ/חַרְחֻר֙ וּ/בַ/חֶ֔רֶב וּ/בַ/שִּׁדָּפ֖וֹן וּ/בַ/יֵּרָק֑וֹן וּ/רְדָפ֖וּ/ךָ עַ֥ד אָבְדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/022.yaml
  text: Yahweh will strike you with wasting disease[a], with fever, with inflammation, with burning heat, with the sword, with blight, and with mildew[b]; and they will pursue you until you perish.
translation:
  language: tl
  text: Hahampasin ka ni Yahweh ng nakapanghihinang sakit[a], lagnat, pamamaga, matinding init[c], tabak, pagkalanta ng pananim, at amag; hahabulin ka ng mga ito[b] hanggang sa mapahamak ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sakit na umuubos sa katawan”; ang salitang Hebreo ay tumutukoy sa isang malubhang sakit na nagpapahina at nagpapangayayat.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at ang mga ito ay hahabol sa iyo”; maramihan ang pandiwang Hebreo at tumutukoy ito sa mga naunang sakit at kapahamakan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nakapapasong init” o “nag-aapoy na lagnat”; bihira ang salitang Hebreo at hindi tiyak ang eksaktong uri ng kapahamakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: Hahampasin ka
  rationale: Ang Hiphil ng נכה ay tuwirang nangangahulugang ‘hampasin’ o ‘saktan.’ Pinananatili ng ‘Hahampasin ka’ ang tuwirang puwersa ng hatol at ang ikalawang panauhang isahan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang ‘Yahweh,’ hindi pinalitan ng isang titulo.
- source_word: שַׁחֶפֶת
  choice: nakapanghihinang sakit
  rationale: Tumutukoy ang salita sa isang sakit na unti-unting umuubos ng katawan at lakas. Likas sa modernong Tagalog ang parirala at iniiwasan ang labis na tiyak na diagnosis gaya ng tuberkulosis.
- source_word: קַּדַּחַת
  choice: lagnat
  rationale: Ito ang malinaw at karaniwang katumbas para sa karamdamang may mataas na temperatura.
- source_word: דַּלֶּקֶת
  choice: pamamaga
  rationale: Kaugnay ang salita sa pag-aapoy o inflammation; malinaw itong naihihiwalay sa lagnat at matinding init.
- source_word: חַרְחֻר
  choice: matinding init
  rationale: Bihira ang salitang Hebreo at malamang na tumutukoy sa nakapapasong init o nag-aapoy na lagnat. Hindi nililimitahan ng salin ang kahulugan sa isang tiyak na sakit.
- source_word: חֶרֶב
  choice: tabak
  rationale: Ito ang tuwirang katumbas ng karaniwang kahulugan ng חֶרֶב at maaari ring magpahiwatig ng karahasan o digmaan nang hindi iyon ipinapasok sa pangunahing teksto.
- source_word: שִׁדָּפוֹן
  choice: pagkalanta ng pananim
  rationale: Tumutukoy ito sa mapaminsalang pagkatuyo o pagkalanta ng mga pananim, kaya nilinaw ang agrikultural na konteksto sa natural na Tagalog.
- source_word: יֵרָקוֹן
  choice: amag
  rationale: Sa kontekstong agrikultural, tumutukoy ito sa mildew o sakit na nagpapadilaw sa halaman. Ang ‘amag’ ay maikli at madaling maunawaang katumbas.
- source_word: וּרְדָפוּךָ
  choice: hahabulin ka ng mga ito
  rationale: Maramihan ang pandiwang Hebreo. Tahasang itinuturo ng ‘mga ito’ ang naunang mga sakit at kapahamakan bilang humahabol sa kinakausap.
- source_word: עַד אָבְדֶךָ
  choice: hanggang sa mapahamak ka
  rationale: Saklaw ng אבד ang pagkapahamak, pagkawasak, o pagkalipol. Ang ‘mapahamak’ ay natural at nananatiling malawak ang saklaw.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyong ‘Yahweh’ sa halip na palitan ng titulong ‘PANGINOON.’
- issue: Simuno ng maramihang pandiwang וּרְדָפוּךָ
  choice: ang mga naunang sakit at kapahamakan
  alternative: isang di-tiyak na salot o kapahamakan
  rationale: Maramihan ang anyo ng pandiwa, kaya natural itong tumutukoy pabalik sa buong talaan. Hindi ginagawang iisang abstraktong salot ang mga ito.
translation_notes:
  register: Modernong Filipino na tuwiran at marangal ang ginamit. Pinanatili ang sunod-sunod na listahan at ang matinding larawan ng paghampas at paghabol. Nilinaw lamang ang agrikultural na gamit ng ‘pagkalanta’ sa pamamagitan ng ‘ng pananim,’ habang inilagay sa talababa ang tunay na leksikal na kalabuan ng dalawang katawagang pangkaramdaman.
