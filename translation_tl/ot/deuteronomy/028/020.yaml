source:
  edition: WLC
  text: יְשַׁלַּ֣ח יְהוָ֣ה בְּ֠/ךָ אֶת הַ/מְּאֵרָ֤ה אֶת הַ/מְּהוּמָה֙ וְ/אֶת הַ/מִּגְעֶ֔רֶת בְּ/כָל מִשְׁלַ֥ח יָדְ/ךָ֖ אֲשֶׁ֣ר תַּעֲשֶׂ֑ה עַ֣ד הִשָּֽׁמֶדְ/ךָ֤ וְ/עַד אֲבָדְ/ךָ֙ מַהֵ֔ר מִ/פְּנֵ֛י רֹ֥עַ מַֽעֲלָלֶ֖י/ךָ אֲשֶׁ֥ר עֲזַבְתָּֽ/נִי׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/020.yaml
  text: Yahweh will send on you the curse[a], the confusion, and the rebuke in every undertaking of your hand that you do, until you are destroyed and until you perish quickly, because of the evil of your deeds by which you have forsaken me.
translation:
  language: tl
  text: Ipapadala ni Yahweh sa iyo ang sumpa, ang kaguluhan, at ang pagsaway sa bawat gawaing gagawin mo[a], hanggang sa malipol ka at mabilis kang mapahamak, dahil sa kasamaan ng iyong mga gawa, na ipinakita sa pagtalikod mo sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “sa bawat pag-uunat ng iyong kamay,” ibig sabihin, sa lahat ng gawaing sinisikap mong gawin.'
    reason: Ipinaliliwanag ang idyomang Hebreo habang pinananatiling natural ang pangunahing teksto.
lexical_decisions:
- source_word: יְשַׁלַּח יְהוָה בְּךָ
  choice: Ipapadala ni Yahweh sa iyo
  rationale: Pinananatili ng aktibong pandiwa ang tahasang pagkilos ni Yahweh bilang nagpapasapit ng mga parusa ng tipan. Likas sa modernong Tagalog ang ayos na “Ipapadala ni Yahweh sa iyo.”
- source_word: הַמְּאֵרָה
  choice: ang sumpa
  rationale: Tumutukoy ito sa tiyak na sumpa o parusang kaugnay ng tipan; malinaw at tuwiran ang “sumpa.”
- source_word: הַמְּהוּמָה
  choice: ang kaguluhan
  rationale: Maaaring saklawin ng salita ang pagkalito, pagkataranta, at kaguluhan. Pinananatili ng “kaguluhan” ang malawak na diwa nang hindi nililimitahan ito sa kalagayang mental lamang.
- source_word: הַמִּגְעֶרֶת
  choice: ang pagsaway
  rationale: Ang salitang mula sa גער ay nagsasaad ng mariin at mapanghatol na pagsaway. Ang “pagsaway” ay natural at hindi labis na nagpapakahulugan.
- source_word: בְּכָל מִשְׁלַח יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: sa bawat gawaing pag-uukulan mo ng iyong kamay
  rationale: Isinasalin ang idyomang Hebreo bilang lahat ng gawaing sinisikap o isinasagawa ng tao, habang pinananatili ang larawan ng kamay. Ipinaliliwanag sa talababa ang mas literal na anyo.
- source_word: עַד הִשָּׁמֶדְךָ וְעַד אֲבָדְךָ מַהֵר
  choice: hanggang sa malipol ka at mabilis na mapahamak
  rationale: 'Pinananatili ang magkatulad ngunit hindi ganap na magkaparehong mga pandiwa: pagkalipol at kapahamakan. Iniuugnay ang מַהֵר sa ikalawang sugnay ayon sa pinakamalapit na pagkakalagay nito.'
- source_word: מִפְּנֵי רֹעַ מַעֲלָלֶיךָ אֲשֶׁר עֲזַבְתָּנִי
  choice: dahil sa kasamaan ng mga ginawa mo, sapagkat tinalikuran mo ako
  rationale: Malinaw na ipinahahayag ang sanhi ng hatol, ngunit hindi ginagawang teknikal o denominasyonal ang ugnayan sa pagitan ng masasamang gawa at ng pagtalikod kay Yahweh.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang יהוה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Tagaganap ng hatol ng tipan
  choice: Tahasan si Yahweh ang nagpapadala ng sumpa, kaguluhan, at pagsaway
  alternative: Ilarawan ang mga ito bilang di-personal na kapahamakang basta dumarating
  rationale: Si יהוה ang lantad na simuno ng pandiwang יְשַׁלַּח, kaya hindi pinalalabo o pinalalambot ang kanyang tuwirang pagkilos sa teksto.
- issue: Ugnayan ng masasamang gawa at pagtalikod kay Yahweh
  choice: “dahil sa kasamaan ng mga ginawa mo, sapagkat tinalikuran mo ako”
  alternative: “dahil sa kasamaan ng iyong mga gawa na sa pamamagitan ng mga iyon ay tinalikuran mo ako”
  rationale: Ang Hebreo ay maikli at maaaring unawain ang hulíng sugnay bilang pagpapaliwanag sa sanhi. Pinili ang natural na Tagalog na pinananatili ang malapit na ugnayan nang hindi iginigiit ang mas makitid na sintaktikong paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “malipol” at “mapahamak” upang mapanatili ang matinding parallelismo ng Hebreo, at ang talababa ay inilagay mismo pagkatapos ng idyomang tinutukoy nito.
