base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/055.yaml
  text: so that he will not give to any of them any of the flesh of his sons that he is eating[a], because he has nothing left[b], in the siege and in the distress with which your enemy will oppress you within all your gates.
translation:
  language: tl
  text: kaya hindi niya bibigyan ang sinuman sa kanila ng kahit kaunti sa laman ng mga anak niyang lalaki[a] na kinakain niya, sapagkat wala nang anumang natitira para sa kanya, sa panahon ng pagkubkob at kagipitang ipararanas sa iyo ng iyong kaaway sa lahat ng iyong mga bayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga anak niyang lalaki”; partikular na panlalaki ang salitang Hebreo rito, hindi ang mas pangkalahatang “mga anak.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa lahat ng iyong mga pintuan.” Sa Hebreo, ang “mga pintuan” ay maaari ring tumukoy sa mga bayan o lunsod.
    reason: cultural_note
lexical_decisions:
- source_word: מִתֵּת לְאַחַד מֵהֶם
  choice: hindi niya bibigyan ang sinuman sa kanila
  rationale: Ang מִן kasama ng pawatas na נתן ay nagpapahayag ng pagkakait o pagtangging magbigay. Likas sa modernong Tagalog ang negatibong sugnay na ito, at ang “sinuman sa kanila” ay naghahatid ng distributibong diwa ng literal na “isa mula sa kanila.”
- source_word: מִבְּשַׂר בָּנָיו
  choice: ng kahit kaunti sa laman ng mga anak niyang lalaki
  rationale: Pinananatili ng “laman” ang kongkreto at nakapanghihilakbot na בָּשָׂר. Ang partitive na מִן ay likas na naipahahayag ng “kahit kaunti sa,” at ang בָּנָיו ay partikular na tumutukoy sa mga anak na lalaki.
- source_word: אֲשֶׁר יֹאכֵל
  choice: na kinakain niya
  rationale: Ang di-ganap na pandiwa ay naglalarawan sa nagaganap na kilos sa tagpo ng pagkubkob; malinaw at masidhi itong naihahatid ng kasalukuyang aspektong “kinakain niya.”
- source_word: מִבְּלִי הִשְׁאִיר לוֹ כֹּל
  choice: sapagkat wala nang anumang natitira para sa kanya
  rationale: Ipinahihiwatig ng parirala ang ganap na kawalan na dahilan ng pagkakait. Iniiwasan ng “natitira para sa kanya” ang di-kailangang pagtukoy kung sino ang tahasang nag-iwan o hindi nag-iwan.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: sa gitna ng pagkubkob at matinding kagipitan
  rationale: Ang מָצוֹר ay literal na pagkubkob, samantalang ang מָצוֹק ay matinding kasalatan o kagipitan. Ang “sa gitna ng” ay natural na naglalarawan ng kalagayang kinaroroonan nila.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: ipararanas sa iyo ng iyong kaaway
  rationale: Ang Hiphil ng צוּק ay nagpapahayag ng pagpapasapit ng kagipitan o matinding pagdiin. Ang “ipararanas” ay natural sa Tagalog at malinaw na pinananatili ang kaaway bilang gumagawa.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: sa lahat ng iyong pintuang-bayan
  rationale: Pinananatili ang literal na larawan ng “mga pintuan,” ngunit ang tambalang “pintuang-bayan” ay tumutulong na ipahiwatig ang mga pamayanang napapaloob sa mga pintuang iyon.
theological_decisions: []
translation_notes:
  register: Makabago at dignified na Filipino, na may tuwirang bokabularyo upang mapanatili ang bigat ng tagpo. Ginamit ang “kanya” alinsunod sa karaniwang modernong baybay, habang pinanatili ang konkretong “laman,” ang tiyak na “mga anak na lalaki,” at ang larawang “pintuang-bayan.”
