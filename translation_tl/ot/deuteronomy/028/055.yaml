  naturalness: Maayos ang kabuuang rehistro at ang pagtalakay sa mabigat na tagpo ay tuwiran ngunit hindi sensational. Ang pagpapalit ng 'pintuang-bayan' sa 'mga bayan' ay mas malinaw at natural sa Filipino; ang literal na larawan ay pananatilihin sa talababa.
  terminology: Ang 'laman,' 'mga anak niyang lalaki,' 'pagkubkob,' at 'kagipitan' ay angkop. Ang 'ipararanas' ay sapat upang ihatid ang pagpapasapit ng kaaway ng kagipitan, bagaman ang 'idaragdag' na 'matinding' ay hindi kailangan sapagkat ang 'kagipitan' ay sapat na para sa מָצוֹק.
