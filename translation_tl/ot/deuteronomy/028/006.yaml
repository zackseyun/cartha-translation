  text: Blessed shall you be when you come in[b][a], and blessed shall you be when you go out.
translation:
  language: tl
  text: Pagpapalain ka sa pagpasok mo[a][b], at pagpapalain ka sa paglabas mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isahan ang “ka” sa Hebreo; kinakausap ang Israel bilang isang buong bayan sa anyong isahan.
    reason: cultural_note
  - marker: b
    text: O “kapag pumapasok ka … kapag lumalabas ka.” Ang magkatambal na “pagpasok” at “paglabas” ay malamang na tumutukoy sa buong takbo ng buhay at gawain.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Pagpapalain ka
  rationale: Ang pasibong pandiwaring ginamit bilang panaguri ay naghahayag ng pagpapala sa konteksto ng mga kahihinatnan ng tipan. Likas sa modernong Tagalog ang anyong panghinaharap na pasibo.
- source_word: אַתָּה
  choice: ka
  rationale: Pangalawang panauhang panlalaking isahan ito. Pinananatili ng “ka” ang isahang pagtukoy sa Israel bilang kabuuang bayang kinakausap.
- source_word: בְּבֹאֶךָ
  choice: sa pagpasok mo
  rationale: Ang ב na sinusundan ng infinitive construct ng בוא at hulaping 2ms ay tumutukoy sa kalagayan o panahon ng pagpasok. Malapit sa porma ng Hebreo at natural sa Tagalog ang “sa pagpasok mo.”
- source_word: וּבָרוּךְ
  choice: at pagpapalain ka
  rationale: Inuulit ang buong pormula ng pagpapala upang mapanatili ang paralelismo at balanseng retorika ng Hebreo.
- source_word: בְּצֵאתֶךָ
  choice: sa paglabas mo
  rationale: Ang ב na sinusundan ng infinitive construct ng יצא at hulaping 2ms ay literal na tumutukoy sa paglabas. Kasama ng “pagpasok,” maaari nitong saklawin ang buong takbo ng buhay at gawain.
theological_decisions:
- issue: Isahang kinatawang pagtukoy sa Israel
  choice: Panatilihin ang isahang “ka/mo” nang hindi ginagawang maramihan.
  alternative: “Pagpapalain kayong lahat…” o “Pagpapalain ang Israel…”
  rationale: Isahang panlalaki ang gamit ng Hebreo, karaniwang paraan ng pakikipag-usap sa Israel bilang isang bayang kabilang sa tipan. Pinananatili ito ng isahang “ka/mo” nang hindi nagdaragdag ng interpretatibong pagpapalawak.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ang paulit-ulit na “pagpapalain ka” ay nagpapanatili sa pormal na himig at paralelismo ng pagpapala sa Hebreo.
