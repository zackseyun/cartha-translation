- from: Uubusin nito ang mga anak ng iyong mga alagang hayop at ang ani ng iyong lupain hanggang sa malipol ka. Wala itong ititirang butil, bagong alak, o langis para sa iyo, ni mga guya ng iyong kawan ng baka o mga anak ng iyong kawan ng tupa at kambing[a], hanggang sa tuluyan ka nitong mapuksa.
  to: Uubusin nito ang mga anak ng iyong mga alagang hayop at ang ani ng iyong lupain hanggang sa malipol ka. Hindi ito mag-iiwan para sa iyo ng butil, bagong alak, o langis, ni mga guya ng iyong kawan ng baka o mga anak ng iyong kawan ng tupa at kambing[a], hanggang sa mapuksa ka nito.
