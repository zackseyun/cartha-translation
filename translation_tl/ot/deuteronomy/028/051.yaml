reference: Deuteronomy 28:51
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ֠/אָכַל פְּרִ֨י בְהֶמְתְּ/ךָ֥ וּ/פְרִֽי אַדְמָתְ/ךָ֮ עַ֣ד הִשָּֽׁמְדָ/ךְ֒ אֲשֶׁ֨ר לֹֽא יַשְׁאִ֜יר לְ/ךָ֗ דָּגָן֙ תִּיר֣וֹשׁ וְ/יִצְהָ֔ר שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּרֹ֣ת צֹאנֶ֑/ךָ עַ֥ד הַאֲבִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/051.yaml
  text: It will consume the offspring of your livestock and the produce of your land until you are destroyed; it will leave you no grain[a], new wine, or oil, no calves of your herd or lambs of your flock, until it has destroyed you.
translation:
  language: tl
  text: Uubusin nito ang mga anak ng iyong mga alagang hayop at ang ani ng iyong lupain hanggang sa malipol ka. Hindi ito mag-iiwan para sa iyo ng butil, bagong alak, o langis, ni mga guya ng iyong kawan ng baka o mga anak ng iyong kawan ng tupa at kambing[a], hanggang sa mapuksa ka nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pagdami ng iyong kawan.” Hindi ganap na tiyak ang kahulugan ng salitang Hebreo; tumutukoy ito sa mga anak o produktibong pagdami ng kawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: Uubusin nito
  rationale: Literal na “kakainin,” ngunit sa konteksto ng pananakop at pagkaubos ng kabuhayan, natural at tumpak sa Tagalog ang “uubusin.” Ang “nito” ay tumutukoy sa bansang mananalakay sa naunang talata.
- source_word: פְּרִי בְהֶמְתְּךָ
  choice: ang mga anak ng iyong mga alagang hayop
  rationale: Ang פְּרִי ay literal na “bunga,” ngunit kapag hayop ang tinutukoy, nangangahulugan itong supling. Sinasaklaw ng בְהֵמָה ang mga alagang hayop sa pangkalahatan.
- source_word: וּפְרִי אַדְמָתְךָ
  choice: ang ani ng iyong lupain
  rationale: Ang idyomang Hebreo ay tumutukoy sa bungang agrikultural o ani ng lupa; malinaw at likas sa modernong Tagalog ang “ani ng iyong lupain.”
- source_word: עַד הִשָּׁמְדָךְ
  choice: hanggang sa malipol ka
  rationale: Ipinapahayag ng parirala ang hantungan ng patuloy na pagkaubos. Ang “malipol” ay nagpapanatili sa bigat ng sumpa nang hindi kinakailangang ipakahulugang ganap na pagkawala ng bawat indibidwal.
- source_word: אֲשֶׁר לֹא יַשְׁאִיר לְךָ
  choice: Wala itong ititirang ... para sa iyo
  rationale: Natural na Tagalog ito para sa negatibong sugnay na nagsasaad ng lubos na pagkakait ng mga pinagkukunan ng ikabubuhay.
- source_word: דָּגָן
  choice: butil
  rationale: Tumutukoy ang salita sa mga pananim na butil sa pangkalahatan, hindi sa isang partikular na uri gaya ng mais.
- source_word: תִּירוֹשׁ
  choice: bagong alak
  rationale: Karaniwan itong tumutukoy sa sariwa o bagong gawang alak; pinananatili ng “bagong alak” ang pagkakaiba nito sa pangkalahatang salita para sa alak.
- source_word: יִצְהָר
  choice: langis
  rationale: Sa karaniwang tatluhang “butil, bagong alak, at langis,” tumutukoy ito sa langis, karaniwang langis ng olibo. Hindi kailangang idagdag ang “olibo” sa pangunahing teksto.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: mga guya ng iyong kawan ng baka
  rationale: Ang שְׁגַר ay tumutukoy sa iniluwal o supling ng mga bakang kabilang sa kawan; ang “mga guya” ay natural at tiyak sa konteksto.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: mga anak ng iyong kawan ng tupa at kambing[a]
  rationale: Hindi ganap na tiyak ang diwa ng עַשְׁתְּרֹת, ngunit sa tambalan nito sa supling ng bakahan, malamang na tumutukoy ito sa mga anak o pagdami ng maliliit na hayop. Ang צֹאן ay maaaring sumaklaw sa tupa at kambing, kaya hindi ito nilimitahan sa mga kordero lamang.
- source_word: עַד הַאֲבִידוֹ אֹתָךְ
  choice: hanggang sa tuluyan ka nitong mapuksa
  rationale: Ang Hiphil ng אבד ay sanhiang anyo, “magpahamak/magpuksa.” Ipinahahayag ng “tuluyan” ang pangwakas na hantungan ng kilos na ipinakikita ng pariralang may “hanggang sa.”
theological_decisions:
- issue: Saklaw ng wikang “malipol/mapuksa” sa sumpang tipan
  choice: Pinanatili ang matinding wika ng pagkawasak nang hindi dinaragdagan ng paliwanag tungkol sa ganap na pagkalipol ng bawat tao.
  alternative: Isalin bilang “mawala ang inyong bansa” o “malipol kayong lahat.”
  rationale: Ang tekstong Hebreo ay matindi ngunit hindi nito sa talatang ito nililinaw ang lahat ng implikasyon ng pagkawasak; hindi dapat tahimik na paliitin o palawakin ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kawan ng baka” at “kawan ng tupa at kambing” upang linawin ang pagkakaiba ng Hebreong אֲלָפִים at צֹאן. Ang panghalip na “nito” ay nagpapatuloy sa bansang mananalakay na binanggit sa naunang konteksto.
