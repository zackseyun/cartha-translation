base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/044.yaml
  text: He will lend to you[a], but you will not lend to him; he will be the head[b], and you will be the tail.
translation:
  language: tl
  text: Magpapautang siya sa iyo[a], ngunit hindi ka magpapautang sa kanya; siya ang magiging ulo, at ikaw ang magiging buntot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “siya” ay ang dayuhang naninirahang kasama ninyo na binanggit sa naunang talata.
    reason: cross_reference
lexical_decisions:
- source_word: יַלְוְךָ / תַלְוֶנּוּ (לוה, Hiphil)
  choice: magpapautang sa iyo / magpapautang sa kanya
  rationale: Sa kontekstong ito, ang Hiphil ng לוה ay tumutukoy sa pagpapautang. Pinananatili ng salin ang malinaw na pagkakaiba ng nagpapautang at nangungutang, pati ang pagbabaligtad ng kalagayang pangkabuhayan.
- source_word: הוּא
  choice: siya
  rationale: Tumutukoy ang panghalip sa isahang lalaking dayuhan na binanggit sa naunang talata. Likas sa Tagalog ang “siya” at pinananatili nito ang isahang pagtukoy nang hindi nagdaragdag ng pangngalan sa pangunahing teksto.
- source_word: לְרֹאשׁ
  choice: ang magiging ulo
  rationale: Pinananatili ang matitingkad na metapora ng Hebreo para sa kataasan, pangingibabaw, o mataas na katayuan, at ang ugnay nito sa naunang pananalita sa kabanata.
- source_word: לְזָנָב
  choice: ang magiging buntot
  rationale: Ito ang tuwirang katapat ng “ulo” at inilalarawan ang mababang katayuan o pagpapailalim. Malinaw at natural sa modernong Tagalog ang tambalang metapora na “ulo” at “buntot.”
- source_word: יִהְיֶה / תִּהְיֶה
  choice: magiging
  rationale: Ipinahahayag dito ng היה ang kalagayang sasapitin bilang bahagi ng sumpa ng tipan. Natural sa Tagalog ang “magiging” at naipakikita nito ang hinaharap na resulta.
- source_word: וְאַתָּה
  choice: ngunit hindi ka / at ikaw
  rationale: Ang “ngunit” sa unang paghahambing ay malinaw na naghahayag ng pagsalungat, samantalang ang “at” sa ikalawa ay nagpapanatili sa payak at balanseng paralelismo ng Hebreo.
theological_decisions:
- issue: Isahang pagtukoy sa dayuhan
  choice: Panatilihin ang isahang panghalip na “siya” at “ikaw”
  alternative: Ulitin sa pangunahing teksto ang “dayuhan,” o gumamit ng pangmaramihang pagtukoy
  rationale: Isahang panlalaki ang anyo ng Hebreo at kumakatawan sa dayuhang binanggit sa naunang talata. Hindi kailangang tukuyin ang kasarian sa panghalip na Tagalog, ngunit naipapanatili ang bilang at ang pronominal na estilo ng orihinal; nililinaw sa talababa ang tinutukoy.
- issue: Metapora ng ulo at buntot
  choice: Panatilihin nang tuwiran ang “ulo” at “buntot”
  alternative: Ipaliwanag bilang “nangingibabaw” at “napapasailalim”
  rationale: Ang metapora mismo ang mahalagang bahagi ng pagbabaligtad ng katayuan sa sumpa ng tipan. Ang pagpapaliwanag nito sa pangunahing teksto ay mag-aalis sa sadyang larawang ginamit ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang karaniwang “magpapautang” para sa pang-ekonomiyang diwa at pinanatili ang payak na paralelismo at ang metaporang “ulo/buntot.”
