base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/032.yaml
  text: Your sons and your daughters will be given to another people[a], while your eyes look on and fail with longing for them all day long, but your hand will be powerless.
translation:
  language: tl
  text: Ang iyong mga anak na lalaki at babae ay ibibigay sa ibang bayan. Makikita sila ng iyong mga mata, at ang iyong mga mata ay manghihina sa pananabik sa kanila buong araw, ngunit wala kang magagawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “walang kapangyarihan sa iyong kamay.”
    reason: Ipinakikita ang konkretong idyoma ng Hebreo na nasa likod ng malinaw na saling “wala kang magagawa.”
lexical_decisions:
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: iyong mga anak na lalaki at babae
  rationale: Tahasang binabanggit ng Hebreo ang kapwa mga anak na lalaki at mga anak na babae; pinananatili ito sa halip na gawing pangkalahatang “mga anak” lamang.
- source_word: נְתֻנִים
  choice: ay ibibigay
  rationale: Ang pasibong participle ay tumutukoy sa mangyayari sa konteksto ng mga sumpa; ang payak na pasibong hinaharap ay malapit sa Hebreo nang hindi dinaragdagan ang diwang “ipagkakanulo” o “ibibihag.”
- source_word: לְעַם אַחֵר
  choice: sa ibang bayan
  rationale: Ang עַם ay “bayan” o “mga tao,” at ang אַחֵר ay “iba.” Ang “ibang bayan” ay natural sa Filipino at hindi labis na nagpapasok ng politikal na diwa ng “bansa.”
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: Makikita iyon ng sarili mong mga mata
  rationale: Pinananatili ang matingkad na larawan ng magulang na personal na nakasaksi; ang “sarili mong mga mata” ay natural na katumbas ng idyomatikong diin ng Hebreo.
- source_word: וְכָלוֹת אֲלֵיהֶם
  choice: manghihina ang mga ito sa pananabik sa kanila
  rationale: Ang כלה ay maaaring mangahulugang maubos, manghina, o manlupaypay. Sa konteksto, ang mga mata ay nauubos sa walang-sawang pananabik sa mga anak; pinananatili ng salin ang pisikal na larawan at emosyonal na bigat.
- source_word: כָּל הַיּוֹם
  choice: buong araw
  rationale: Karaniwan at natural na Filipino na nagpapanatili sa tuloy-tuloy na tagal.
- source_word: וְאֵין לְאֵל יָדֶךָ
  choice: ngunit wala kang magagawa
  rationale: Ito ay idyoma ng kawalan ng lakas o kakayahan, hindi pagtukoy sa Diyos. Ang salin ay malinaw na naghahatid ng ganap na kawalang-kakayahang kumilos.
theological_decisions:
- issue: Pagpapakahulugan sa idyomang וְאֵין לְאֵל יָדֶךָ
  choice: ngunit wala kang magagawa
  alternative: ngunit walang kapangyarihan sa iyong kamay
  rationale: Ang אֵל sa pariralang ito ay tumutukoy sa lakas o kakayahan, hindi sa isang diyos. Ang idyomatikong salin ay umiiwas sa maling teolohikal na pahiwatig habang ang literal na larawang “kamay” ay inilalahad sa talababa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “bayan” para sa עַם at pinanatili ang tahasang pagbanggit sa mga anak na lalaki at babae. Ang mahabang pangungusap ng Hebreo ay hinati sa dalawa para sa likas na daloy, habang pinanatili ang sunod-sunod na larawan ng pagkawala, pagkakita, pananabik, at kawalang-kakayahan.
