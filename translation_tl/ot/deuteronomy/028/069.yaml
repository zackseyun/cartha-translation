base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/069.yaml
  text: These are the words of the covenant that Yahweh commanded Moses to make with the sons of Israel in the land of Moab[a], besides the covenant that he made with them at Horeb.
translation:
  language: tl
  text: Ito ang mga salita ng tipan na iniutos ni Yahweh kay Moises na makipagtipan[a] sa mga anak ni Israel sa lupain ng Moab, bukod pa sa tipang ginawa niya sa kanila sa Horeb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “putulin ang tipan”; gayundin, “ang tipang pinutol niya sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה דִבְרֵי הַבְּרִית
  choice: Ito ang mga salita ng tipan
  rationale: Pinananatili ang anyong panimula o pamagat ng Hebreo. Ang “mga salita ng tipan” ay tuwirang naghahatid ng verbal na nilalaman o mga itinakda ng tipan nang hindi nililimitahan iyon sa mas interpretatibong “mga tuntunin.”
- source_word: צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: iniutos ni Yahweh kay Moises
  rationale: Ang צוה ay may lakas na “mag-utos,” at ang personal na pangalang יהוה ay tinumbasan bilang “Yahweh,” hindi pinalitan ng isang titulo.
- source_word: לִכְרֹת אֶת בְּנֵי יִשְׂרָאֵל
  choice: na gawin sa mga anak ni Israel
  rationale: Ang כרת ay literal na “putulin” ngunit bahagi rito ng karaniwang idyomang Hebreo para sa paggawa ng tipan. Natural sa Tagalog ang “gawin.” Pinanatili ng “mga anak ni Israel” ang anyo ng בני ישראל at ang kolektibong pagtukoy nito.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: sa lupain ng Moab
  rationale: Pinananatili ang buong heograpikong parirala ng Hebreo sa isang natural at marangal na anyong Tagalog.
- source_word: מִלְּבַד
  choice: bukod pa sa
  rationale: Ipinahihiwatig nito na ang tipan sa Moab ay hiwalay o karagdagan sa naunang tipan sa Horeb, nang hindi ipinapasyang wala silang kaugnayan sa isa’t isa.
- source_word: כָּרַת אִתָּם בְּחֹרֵב
  choice: tipang ginawa niya sa kanila sa Horeb
  rationale: Muling isinalin nang natural ang idyomang כרת ברית bilang paggawa ng tipan. Pinanatili ang pangalang “Horeb” sa halip na iharmonisa ito sa “Sinai.”
theological_decisions:
- issue: Paglalarawan sa בני ישראל bilang kolektibong bayan
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanan ng Israel
  rationale: Literal na “mga anak ni Israel” ang Hebreo at kolektibo ang gamit. Pinananatili ng salin ang anyong pinagmulan nang hindi idinaragdag na mga lalaki lamang ang saklaw.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang transliterasyong “Yahweh” ang pinakamalinaw na nagpapanatili nito sa halip na palitan ng titulo.
- issue: Ugnayan ng tipan sa Moab at tipan sa Horeb
  choice: bukod pa sa tipang ginawa niya sa kanila sa Horeb
  alternative: bilang karagdagan sa tipan; hiwalay sa tipan
  rationale: Pinananatili ng “bukod pa sa” ang saklaw ng מִלְּבַד at ang tensiyon kung ang tipan sa Moab ay bagong tipan, pagpapanibago, o karagdagan, nang hindi nilulutas ang tanong sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tipan,” “iniutos,” at “lupain” upang mapanatili ang legal-teolohikal na tono, habang ginawang natural sa Tagalog ang idyomang Hebreo tungkol sa ‘pagputol’ ng tipan.
