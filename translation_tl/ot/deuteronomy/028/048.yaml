source:
  edition: WLC
  text: וְ/עָבַדְתָּ֣ אֶת אֹיְבֶ֗י/ךָ אֲשֶׁ֨ר יְשַׁלְּחֶ֤/נּוּ יְהוָה֙ בָּ֔/ךְ בְּ/רָעָ֧ב וּ/בְ/צָמָ֛א וּ/בְ/עֵירֹ֖ם וּ/בְ/חֹ֣סֶר כֹּ֑ל וְ/נָתַ֞ן עֹ֤ל בַּרְזֶל֙ עַל צַוָּארֶ֔/ךָ עַ֥ד הִשְׁמִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/048.yaml
  text: And you shall serve your enemies[a], whom Yahweh will send against you, in hunger and in thirst and in nakedness and in lack of everything[b]; and he will put an iron yoke on your neck until he has destroyed you.
translation:
  language: tl
  text: Maglilingkod ka sa iyong mga kaaway na ipadadala ni Yahweh laban sa iyo, habang nagugutom, nauuhaw, hubad, at salat sa lahat ng bagay. At maglalagay si Yahweh ng pamatok na bakal sa iyong leeg hanggang sa lipulin ka niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain ang Hebreo na ang kaaway ang maglalagay ng pamatok at lilipol sa iyo, sa halip na si Yahweh ang patuloy na paksa.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַדְתָּ
  choice: Maglilingkod ka
  rationale: Ang עבד dito ay tumutukoy sa sapilitang paglilingkod sa mga kaaway, hindi sa pagsamba. Likas sa modernong Tagalog ang anyong panghinaharap at napananatili nito ang diwa ng sumpa ng tipan.
- source_word: אֹיְבֶיךָ
  choice: sa iyong mga kaaway
  rationale: Tuwirang katumbas ito ng pangmaramihang pangngalang nangangahulugang mga kaaway o kalaban.
- source_word: אֲשֶׁר יְשַׁלְּחֶנּוּ יְהוָה בָּךְ
  choice: na ipadadala ni Yahweh laban sa iyo
  rationale: Ipinahihiwatig ng parirala ang pagpapadala ng Diyos sa mga kaaway upang salakayin ang Israel; malinaw at natural sa Tagalog ang “laban sa iyo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin nang tahasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: בְּרָעָב וּבְצָמָא וּבְעֵירֹם וּבְחֹסֶר כֹּל
  choice: habang nagugutom, nauuhaw, hubad, at salat sa lahat ng bagay
  rationale: Inilalarawan ng magkakasunod na parirala ang kalagayan ng matinding pagkakait habang naglilingkod. Natural sa Tagalog ang pandiwang “nagugutom” at “nauuhaw,” samantalang pinananatili ng “hubad” at “salat sa lahat ng bagay” ang tindi at lawak ng orihinal.
- source_word: וְנָתַן עֹל בַּרְזֶל עַל צַוָּארֶךָ
  choice: At maglalagay si Yahweh ng pamatok na bakal sa iyong leeg
  rationale: Ang “pamatok na bakal” ay tuwirang nagpapanatili sa larawan ng mabigat at malupit na pagpapasakop. Tahasang inuulit ang “Yahweh” upang maging malinaw ang piniling paksa ng pandiwa.
- source_word: עַד הִשְׁמִידוֹ אֹתָךְ
  choice: hanggang sa lipulin ka niya
  rationale: Ipinapahayag ng Hiphil ng שׁמד ang ganap na pagwasak. Ang “lipulin” ay mariin ngunit hindi lumalabis sa saklaw ng salitang Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Nasa tekstong Hebreo ang mismong tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan ng Diyos sa tipan.
- issue: Paksa ng וְנָתַן at הִשְׁמִידוֹ
  choice: 'Si Yahweh ang patuloy na paksa: siya ang maglalagay ng pamatok at lilipol.'
  alternative: Ang kaaway ang maglalagay ng pamatok at lilipol.
  rationale: Ang pinakamalapit na tahasang pang-isahang paksa ay si Yahweh, at maaaring natural na magpatuloy sa kaniya ang serye ng mga pandiwa. Gayunman, pinahihintulutan ng balarila at konteksto na unawain ang kaaway bilang gumaganap, kaya inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matinding larawan ng sumpa ng tipan at ang tunay na kalabuan tungkol sa gumaganap sa huling dalawang pandiwa, nang hindi nagdaragdag ng denominasyonal na paliwanag.
