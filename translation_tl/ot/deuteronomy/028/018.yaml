  text: Cursed shall be the fruit of your womb[a], and the fruit of your ground[b], the offspring of your herds and the young of your flocks.
translation:
  language: tl
  text: Sumpain ang bunga ng iyong sinapupunan at ang bunga ng iyong lupa,[a] ang mga inakay ng iyong mga baka at ang mga inakay ng iyong mga tupa at kambing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ani ng iyong lupain.” Literal sa Hebreo, “bunga ng iyong lupa,” na nagpapanatili sa pagkakatulad nito sa “bunga ng iyong sinapupunan.”
    reason: lexical_alternative
  - marker: b
    text: 'Ang mga pananalitang Hebreo rito ay tumutukoy sa mga inakay o pagdami ng mga alagang hayop: mga baka, at mga tupa o kambing.'
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: Susumpain
  rationale: Ang pandiwang anyo sa Filipino ay natural na naghahatid ng mariing pahayag ng sumpa sa konteksto ng mga sumpa ng tipan.
- source_word: פְּרִי בִטְנְךָ
  choice: ang bunga ng iyong sinapupunan
  rationale: Pinananatili nito ang metapora ng Hebreo para sa mga anak at ang pag-uugnay nito sa kasunod na “bunga ng iyong lupa.”
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: ang bunga ng iyong lupa
  rationale: Ang אֲדָמָה ay lupa o lupang sinasaka; pinananatili ng “bunga” ang sinadyang paralelismo sa bunga ng sinapupunan.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: ang mga anak ng iyong bakahan
  rationale: Ang parirala ay tumutukoy sa mga inakay o nadagdag na baka; malinaw at natural sa Filipino ang “mga anak ng iyong bakahan.”
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: at ang mga anak ng iyong kawan
  rationale: Tumutukoy ito sa mga inakay o pagdami ng maliliit na alagang hayop, hindi sa diyosang Astarte; ang “kawan” ay maaaring sumaklaw sa mga tupa at kambing.
