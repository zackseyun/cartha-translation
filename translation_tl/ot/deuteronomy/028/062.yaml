id: DEU.28.62
reference: Deuteronomy 28:62
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נִשְׁאַרְתֶּם֙ בִּ/מְתֵ֣י מְעָ֔ט תַּ֚חַת אֲשֶׁ֣ר הֱיִיתֶ֔ם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹ֑ב כִּי לֹ֣א שָׁמַ֔עְתָּ בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/062.yaml
  text: And you will be left few in number[a], though you had become as numerous as the stars of the heavens[c][b], because you did not listen to the voice of Yahweh your God.
translation:
  language: tl
  text: At matitira kayong kakaunti lamang[a], gayong naging kasindami kayo ng mga bituin sa langit[b], sapagkat hindi ka nakinig sa tinig ni Yahweh na iyong Diyos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga taong kakaunti,” isang idyoma na nangangahulugang kakaunti sa bilang.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “samantalang naging kasindami kayo ng mga bituin sa langit.”'
    reason: alternative_reading
  - marker: c
    text: Ang “makinig sa tinig” ay maaari ring magpahiwatig ng “sumunod.” Dito ay lumilipat ang Hebreo mula sa maramihang “kayo” tungo sa isahang “ikaw,” sapagkat kinakausap ang Israel bilang isang sambayanan.
    reason: lexical_and_grammatical_note
lexical_decisions:
- source_word: וְנִשְׁאַרְתֶּם
  choice: matitira kayo
  rationale: 'Pinananatili nito ang diwang resulta ng Nifal: pagkatapos ng kapahamakan, kakaunti lamang ang maiiwan.'
- source_word: בִּמְתֵי מְעָט
  choice: kakaunti lamang
  rationale: Idyoma ito para sa napakaliit na bilang, hindi partikular na tumutukoy lamang sa mga lalaki.
- source_word: תַּחַת אֲשֶׁר
  choice: gayong
  rationale: Ipinahahayag dito ang matinding pagsalungat sa dating napakaraming bilang at sa magiging kakaunting nalabi.
- source_word: הֱיִיתֶם
  choice: naging
  rationale: Ipinakikita nito ang kalagayang naabot ng Israel nang dumami sila.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: kasindami ng mga bituin sa langit
  rationale: Natural sa modernong Tagalog at malinaw na naihahatid ang paghahambing tungkol sa napakaraming bilang.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: sapagkat hindi ka nakinig sa tinig
  rationale: Pinananatili ang larawang leksikal ng pakikinig sa tinig, habang ipinahihiwatig sa kontekstong tipan ang hindi pagtalima.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Natural at tumpak na katumbas ng pormulang pangtipan; ang isahan ay umaayon sa biglang paglipat ng Hebreo sa kolektibong isahang pagtawag sa Israel.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Paglipat mula maramihan tungo sa isahan sa pakikipag-usap sa Israel
  choice: “kayo” sa unang sugnay at “ka/iyong” sa huling sugnay
  alternative: 'Gawing maramihan ang buong talata: “kayo/inyong”'
  rationale: Ang tekstong Hebreo ay sadyang lumilipat mula sa mga pandiwang maramihan tungo sa isahang שָׁמַעְתָּ at hulaping isahan, na tumutukoy sa Israel bilang isang sambayanan. Pinananatili ng salin ang tunay na pagbabagong ito at ipinaliliwanag sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “gayong” para sa malinaw na pagsalungat, at pinanatili ang kapansin-pansing paglipat ng Hebreo mula maramihan tungo sa kolektibong isahan.
