revisions:
- from: At pasasaganain ka ni Yahweh sa kabutihan[a]—sa bunga ng iyong sinapupunan[b], sa supling ng iyong mga alagang hayop, at sa ani ng iyong lupa[c]—sa lupaing isinumpa ni Yahweh sa iyong mga ninuno na ibibigay sa iyo.
  to: At pasasaganain ka ni Yahweh sa kabutihan[a]—sa bunga ng iyong sinapupunan[b], sa supling ng iyong mga alagang hayop, at sa ani ng iyong lupa[c]—sa lupaing ipinangako ni Yahweh sa iyong mga ninuno sa pamamagitan ng panunumpa na ibibigay niya sa iyo.
  rationale: Pinalitan ang “isinumpa” ng “ipinangako ... sa pamamagitan ng panunumpa” upang maipahayag ang pandiwang Hebreo na ‘nanumpa’ nang walang kalabuan. Idinagdag ang “niya” sa “ibibigay niya” upang maging malinaw sa Filipino ang paksa ng pagbibigay. Walang binagong kahulugan sa iba pang bahagi ng talata o sa mga talababa.
