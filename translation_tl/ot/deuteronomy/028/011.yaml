  text: וְ/הוֹתִֽרְ/ךָ֤ יְהוָה֙ לְ/טוֹבָ֔ה בִּ/פְרִ֧י בִטְנְ/ךָ֛ וּ/בִ/פְרִ֥י בְהַמְתְּ/ךָ֖ וּ/בִ/פְרִ֣י אַדְמָתֶ֑/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/011.yaml
  text: And Yahweh will make you abound in prosperity[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground[c][b], on the land that Yahweh swore to your fathers to give you.
translation:
  language: tl
  text: At pasasaganain ka ni Yahweh sa kabutihan[a]—sa bunga ng iyong sinapupunan[b], sa supling ng iyong mga alagang hayop, at sa ani ng iyong lupa[c]—sa lupaing ipinangako ni Yahweh sa iyong mga ninuno sa pamamagitan ng panunumpa na ibibigay niya sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ikabubuti” o “sa kasaganaan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bunga ng iyong sinapupunan” ay idyomang Hebreo para sa mga anak o supling.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa bunga ng iyong lupang sinasaka” o “sa ani ng iyong sakahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִרְךָ
  choice: pasasaganain ka
  rationale: Ang Hiphil ng יתר ay nagsasaad na pangyayarihin ni Yahweh na magkaroon ang kausap ng kasaganaan o labis; natural sa Filipino ang causative na “pasasaganain ka.”
- source_word: לְטוֹבָה
  choice: sa kabutihan
  rationale: Pinananatili nito ang malawak at bahagyang di-tiyak na diwa ng literal na “para/sa ikabubuti,” sa halip na limitahan ito sa materyal na kasaganaan lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na YHWH sa halip na palitan ito ng isang titulo.
- source_word: בִּפְרִי בִטְנְךָ
  choice: sa bunga ng iyong sinapupunan
  rationale: Pinananatili ang Hebreong larawang tumutukoy sa mga anak at ang pag-uulit ng “bunga,” habang nauunawaan pa rin sa modernong Filipino.
- source_word: וּבִפְרִי בְהַמְתְּךָ
  choice: sa supling ng iyong mga alagang hayop
  rationale: Ang “supling” ang likas na Filipino para sa bunga o anak ng mga hayop; mas malinaw ito kaysa sa literal na “bunga ng mga alagang hayop.”
- source_word: וּבִפְרִי אַדְמָתֶךָ
  choice: sa ani ng iyong lupa
  rationale: Sa kontekstong agrikultural, natural na ipinahahayag ng “ani ng iyong lupa” ang bunga o pakinabang mula sa nilinang na lupa.
- source_word: עַל הָאֲדָמָה
  choice: sa lupain
  rationale: Dito ang אֲדָמָה ay tumutukoy sa ipinangakong lupain bilang lugar kung saan mararanasan ang pagpapala.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: na isinumpa ni Yahweh sa iyong mga ninuno na ibibigay sa iyo
  rationale: Pinananatili ang ugnayan ng lupain, ng sumpa kay Yahweh sa mga ninuno, at ng pagbibigay nito sa kasalukuyang kausap.
theological_decisions:
- issue: Pagbibigay-kahulugan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo; ang “Yahweh” ay nagpapanatili sa personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kung gagawing “mga anak” ang בִּפְרִי בִטְנְךָ
  choice: bunga ng iyong sinapupunan
  alternative: mga anak o mga supling
  rationale: Ang pagpapanatili sa idyoma ay nag-iingat sa larawang Hebreo at sa pagkakaugnay ng pagkamabunga ng tao, hayop, at lupa.
- issue: Saklaw ng לְטוֹבָה
  choice: sa kabutihan
  alternative: sa kasaganaan o sa ikabubuti
  rationale: Hindi nililimitahan ng Hebreo ang “mabuti” sa yaman lamang, bagaman ang kasunod na mga halimbawa ay kongkretong anyo ng kasaganaan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pasasaganain,” “sinapupunan,” at “lupain” bilang pormal ngunit karaniwang bokabularyo. Pinanatili ang singular na “ikaw/iyo” ng Hebreo at ang pangalang Yahweh.
