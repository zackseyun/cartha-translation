  naturalness: Marangal at malinaw sa modernong Filipino ang kabuuang daloy. Ang “pasasaganain ka” at ang tatlong magkakatulad na parirala ay angkop sa register ng pagpapala. Ang binagong huling sugnay ay natural at iniiwasan ang maling kahulugan ng “sumpa.”
  terminology: Ang “Yahweh” ay wastong pagpapanatili ng Tetragrammaton. Ang “bunga ng iyong sinapupunan” ay angkop na pagpapanatili ng idyomang Hebreo, na nililinaw ng talababa. Ang “supling” at “ani” ay natural na katumbas sa kontekstong hayupan at pagsasaka.
