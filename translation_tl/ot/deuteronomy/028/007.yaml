  text: יִתֵּ֨ן יְהוָ֤ה אֶת אֹיְבֶ֨י/ךָ֙ הַ/קָּמִ֣ים עָלֶ֔י/ךָ נִגָּפִ֖ים לְ/פָנֶ֑י/ךָ בְּ/דֶ֤רֶךְ אֶחָד֙ יֵצְא֣וּ אֵלֶ֔י/ךָ וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים יָנ֥וּסוּ לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/007.yaml
  text: Yahweh will give your enemies who rise up against you defeated before you[a]. By one way they will come out against you[b], and by seven ways they will flee before you.
translation:
  language: tl
  text: Ipapatalo ni Yahweh sa harap mo ang iyong mga kaaway na bumabangon laban sa iyo.[a] Sa iisang daan sila lalabas laban sa iyo,[b] ngunit sa pitong daan sila tatakas mula sa harap mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin nang mas malapit sa ayos ng Hebreo: “Ibibigay ni Yahweh sa iyo ang iyong mga kaaway na bumabangon laban sa iyo bilang mga talunan sa harap mo.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa iisang daan ... sa pitong daan”—larawan ng mga kaaway na sama-samang dumarating ngunit watak-watak na tumatakas.
    reason: cultural_note
lexical_decisions:
- source_word: יִתֵּן ... נִגָּפִים
  choice: ipapatalo
  rationale: Pinagsasama nito sa likas na modernong Tagalog ang idyomang Hebreo na literal na ‘ibibigay ... na talunan.’ Nananatili ang diwang si Yahweh ang magpapasapit ng pagkatalo, nang hindi gumagamit ng alanganing kayarian sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan iyon ng isang titulo.
- source_word: אֹיְבֶיךָ
  choice: iyong mga kaaway
  rationale: Tuwirang katumbas ng pangngalang maramihan na may hulaping tumutukoy sa ikalawang panauhang isahan.
- source_word: הַקָּמִים עָלֶיךָ
  choice: na bumabangon laban sa iyo
  rationale: Pinananatili ang idyomang mapanlaban ng קום kasama ng על nang hindi ito nililimitahan sa isang tiyak na uri ng pagsalakay.
- source_word: לְפָנֶיךָ
  choice: sa harap mo / mula sa harap mo
  rationale: Pinananatili ang paulit-ulit na larawang spatial at militar ng tekstong Hebreo; sa huling sugnay, ang ‘mula sa harap mo’ ay angkop sa kilos ng pagtakas.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: sa iisang daan
  rationale: Pinananatili ang literal na larawan at ang mariing kaibahan sa ‘pitong daan.’
- source_word: יֵצְאוּ אֵלֶיךָ
  choice: lalabas laban sa iyo
  rationale: Sa kontekstong pandigma, ang paglabas patungo sa isang tao ay paglabas upang labanan siya; malinaw na ipinahahayag ng ‘laban sa iyo’ ang puwersang ito.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: ngunit sa pitong daan
  rationale: Ang ‘ngunit’ ay likas na nagpapahayag sa Tagalog ng matinding pagsalungat ng iisang daan at pitong daan, habang pinananatili ang bilang at larawan ng Hebreo.
- source_word: יָנוּסוּ
  choice: tatakas
  rationale: Tuwirang ipinahahayag ang mabilis na paglayo dahil sa pagkatalo, higit kaysa sa mas mahinang ‘uurong.’
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang tahasang nasa Hebreo. Pinananatili ng ‘Yahweh’ ang pangalan sa halip na palitan ito ng titulo, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Paraan ng pagkilos ni Yahweh sa pagkatalo ng mga kaaway
  choice: ipapatalo
  alternative: ibibigay ... na talunan
  rationale: Ipinahihiwatig ng יִתֵּן na sinusundan ng נִגָּפִים ang pagpapasapit ni Yahweh ng kanilang kalagayang talunan. Hindi tinutukoy ng salin ang eksaktong pangalawang ahente o paraan ng pagkatalo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang paralelismong ‘iisang daan/pitong daan’ at ang pag-uulit ng ‘sa harap mo,’ habang ginawang likas sa Tagalog ang mahirap na idyomang ‘ibibigay ... na talunan.’
