  to: Ipapatalo ni Yahweh sa harap mo ang iyong mga kaaway na bumabangon laban sa iyo.[a] Sa iisang daan sila lalabas laban sa iyo,[b] ngunit sa pitong daan sila tatakas mula sa harap mo.
