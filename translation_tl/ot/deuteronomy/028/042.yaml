lexical_decisions:
- source_word: כָּל
  choice: lahat
  rationale: Ipinahahayag ng panukat ang kabuuang saklaw ng kapahamakan sa mga punongkahoy at bunga ng lupa.
- source_word: עֵצְךָ
  choice: iyong mga punongkahoy
  rationale: Sa kontekstong pansakahan, ang עֵץ ay tumutukoy sa puno; ang kolektibong diwa nito rito ay likas na ipinahahayag sa Filipino sa anyong maramihan.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: at ang bunga ng iyong lupa
  rationale: Pinananatili ng “bunga” at “lupa” ang kongkretong larawang pansakahan ng פְּרִי at אֲדָמָה nang hindi nililimitahan ang tinutukoy sa isang uri ng ani.
- source_word: יְיָרֵשׁ
  choice: sasakupin
  rationale: Ipinapanatili ng “sasakupin” ang diwa ng ירשׁ na pag-angkin o pagkuha ng pag-aari, habang ang konteksto ay nagpapahiwatig ng pagkawasak ng pananim.
- source_word: הַצְּלָצַל
  choice: kuliglig
  rationale: Ang “kuliglig” ay isang tiyak at nauunawaang katawagan sa insektong maaaring tinutukoy, ngunit hindi tiyak ang eksaktong pagkakakilanlan ng salitang Hebreo kaya nilagyan ito ng talababa.
