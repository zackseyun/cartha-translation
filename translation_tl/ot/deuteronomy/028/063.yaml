    text: 'Maaari ring isalin: “marahas kayong aalisin mula sa lupain.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, isahan ang “ikaw” sa pariralang “lupaing papasukan mo roon upang ariin,” sapagkat kinakausap ang Israel bilang isang buong bayan.
    reason: cultural_note
  revision_rationale: Inayos ang maling posibleng ugnayang sanhi ng “dahil sa inyo” sa pamamagitan ng konstruksyong “ikinagalak ... ang,” na tumpak na naghahayag ng pagkagalak ni Yahweh hinggil sa kanyang gagawin sa Israel. Inayos din ang pandiwang “papasukan” at ibinalik ang “roon” upang maipahayag ang Hebreong direksiyonal na pang-abay. Walang doctrinal na paglambot na ipinataw sa tahasang pagkagalak sa paghatol.
