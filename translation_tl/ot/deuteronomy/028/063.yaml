  text: וְ֠/הָיָה כַּ/אֲשֶׁר שָׂ֨שׂ יְהוָ֜ה עֲלֵי/כֶ֗ם לְ/הֵיטִ֣יב אֶתְ/כֶם֮ וּ/לְ/הַרְבּ֣וֹת אֶתְ/כֶם֒ כֵּ֣ן יָשִׂ֤ישׂ יְהוָה֙ עֲלֵי/כֶ֔ם לְ/הַאֲבִ֥יד אֶתְ/כֶ֖ם וּ/לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וְ/נִסַּחְתֶּם֙ מֵ/עַ֣ל הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/063.yaml
  text: And it shall be that[a], just as Yahweh rejoiced over you to do you good and to multiply you, so Yahweh will rejoice over you to destroy you and to wipe you out[b]; and you will be torn away from upon the land that you are entering there to possess it.
translation:
  language: tl
  text: At mangyayari na, kung paanong ikinagalak ni Yahweh ang paggawa ng mabuti sa inyo at ang pagpaparami sa inyo, gayon ikagagalak ni Yahweh ang paglipol at pagpuksa sa inyo; at bubunutin kayo mula sa lupaing papasukan ninyo roon upang ariin.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “marahas kayong aalisin mula sa lupain.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, isahan ang “ikaw” sa pariralang “lupaing papasukan mo roon upang ariin,” sapagkat kinakausap ang Israel bilang isang buong bayan.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: At mangyayari na
  rationale: Likas na pormulang Filipino para sa panghinaharap na bunga o kahihinatnan, nang hindi gumagamit ng lipas na pananalita.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: kung paanong ... gayon
  rationale: Pinananatili ang tahasang paghahambing at balanseng retorika ng Hebreo.
- source_word: שָׂשׂ / יָשִׂישׂ
  choice: nagalak / magagalak
  rationale: Iisang salitang-ugat ang ginamit upang mapanatili ang sadyang paralelismo sa pagpapala at paghatol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang inililipat ang pangalang tipan ng Diyos ayon sa patakaran ng proyekto.
- source_word: לְהֵיטִיב אֶתְכֶם
  choice: upang gawan kayo ng mabuti
  rationale: Malawak at tuwirang katumbas na hindi nililimitahan ang diwa sa materyal na kasaganaan.
- source_word: וּלְהַרְבּוֹת אֶתְכֶם
  choice: at paramihin
  rationale: Pinananatili ang karaniwang wikang pangtipan tungkol sa pagdami ng bayan.
- source_word: לְהַאֲבִיד אֶתְכֶם
  choice: upang lipulin kayo
  rationale: Malakas at natural na salin ng causative na אבד sa konteksto ng sumpa ng tipan.
- source_word: וּלְהַשְׁמִיד אֶתְכֶם
  choice: at puksain kayo
  rationale: Ibinubukod sa naunang pandiwa at pinananatili ang sukdulang tindi ng paghatol.
- source_word: וְנִסַּחְתֶּם מֵעַל הָאֲדָמָה
  choice: at bubunutin kayo mula sa lupain
  rationale: Ang 'bubunutin' ay natural sa Filipino at malinaw na naghahatid ng larawan ng marahas na pag-aalis mula sa lupain.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: na papasok ninyo upang angkinin
  rationale: Natural na Filipino na pinananatili ang direksiyon at layunin ng pagpasok, bagaman hindi minamarkahan ng Filipino ang singular na kausap gaya ng Hebreo.
theological_decisions:
- issue: Pagkagalak ng Diyos sa paghatol
  choice: Pinanatili ang tahasang pahayag na magagalak si Yahweh habang nililipol at pinupuksa ang Israel.
  alternative: Palambutin bilang 'ipahihintulot ni Yahweh' o alisin ang pagkagalak.
  rationale: Sadyang magkatapat sa Hebreo ang pagkagalak sa pagpapala at ang pagkagalak sa paghatol; hindi dapat alisin ang mahirap na teolohikal na tensiyon.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Ginamit ang transliterasyong itinakda ng proyekto para sa personal na pangalang tipan.
translation_notes:
  register: Makabagong Filipino na marangal at malinaw. Pinanatili ang pormal na paralelismo ngunit iniwasan ang hindi likas na literalismo. Ang mga panghalip na maramihan ay kailangan sa natural na Filipino; ipinaliwanag sa talababa ang singular na kolektibong pagtukoy sa Israel sa hulí ng talata.
