  to: Darating sa iyo ang lahat ng sumpang ito; hahabulin at aabutan ka ng mga ito[a] hanggang sa malipol ka, sapagkat hindi ka nakinig sa tinig ni Yahweh na iyong Diyos upang tuparin ang kanyang mga utos at mga tuntuning iniutos niya sa iyo.
