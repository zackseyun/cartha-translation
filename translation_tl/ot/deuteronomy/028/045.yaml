base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/045.yaml
  text: And all these curses will come upon you and pursue you and overtake you[a], until you are destroyed, because you did not listen to the voice of Yahweh your God, to keep his commandments and his statutes that he commanded you.
translation:
  language: tl
  text: Darating sa iyo ang lahat ng sumpang ito; hahabulin at aabutan ka ng mga ito[a] hanggang sa malipol ka, sapagkat hindi ka nakinig sa tinig ni Yahweh na iyong Diyos upang tuparin ang kanyang mga utos at mga tuntuning iniutos niya sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang bahaging ito: “sapagkat hindi ka sumunod kay Yahweh na iyong Diyos sa pamamagitan ng pagtupad sa kanyang mga utos at mga tuntunin.” Literal na sinasabi ng Hebreo, “hindi ka nakinig sa tinig ni Yahweh na iyong Diyos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: Darating sa iyo ang lahat ng sumpang ito
  rationale: Ipinahahayag ng perfect verb sa kontekstong ito ang nakaambang kahihinatnan. Ang “darating sa iyo” ay natural sa Filipino at pinananatili ang direksiyon ng עַל.
- source_word: וּרְדָפוּךָ וְהִשִּׂיגוּךָ
  choice: hahabulin ka ng mga ito at aabutan
  rationale: Pinananatili ng “hahabulin” at “aabutan” ang sunod-sunod na larawan ng pagtugis at pag-abot; nilinaw ng “mga ito” na ang mga sumpa ang gumagawa ng mga kilos.
- source_word: עַד הִשָּׁמְדָךְ
  choice: hanggang sa malipol ka
  rationale: Ipinapakita nito ang hangganan o resulta ng pangyayari at pinananatili ang resultative/passive na diwa nang hindi tahasang nagdaragdag ng gumagawa.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: sapagkat hindi ka nakinig sa tinig
  rationale: Pinananatili ang konkretong larawang pandinig ng Hebreo sa halip na lubusang gawing abstraktong “sumunod,” bagaman ipinapaliwanag sa talababa ang idiomatikong kahulugan nito.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Isinasatitik ang pangalang tipan na יְהוָה bilang “Yahweh” at ginagawang natural sa Filipino ang pariralang “iyong Diyos.”
- source_word: לִשְׁמֹר מִצְוֺתָיו וְחֻקֹּתָיו
  choice: upang tuparin ang kanyang mga utos at mga tuntunin
  rationale: Ang “upang tuparin” ay angkop sa infinitive na לִשְׁמֹר at malinaw na naghahatid ng aktuwal na pagsunod. Pinananatili ng “mga utos” at “mga tuntunin” ang pagkakaiba ng dalawang legal na katawagan sa malinaw na modernong Filipino.
- source_word: אֲשֶׁר צִוָּךְ
  choice: na iniutos niya sa iyo
  rationale: Direkta at natural na salin ng relative clause, habang malinaw na ang Diyos ang pinagmulan ng mga utos at tuntunin.
theological_decisions:
- issue: Paglalarawan sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kung isasalin ang שׁמע בקול bilang “sumunod” o pananatilihin ang larawang “makinig sa tinig”
  choice: hindi ka nakinig sa tinig ... upang tuparin
  alternative: hindi ka sumunod ... sa pamamagitan ng pagtupad
  rationale: Pinananatili sa pangunahing teksto ang retorikal at teolohikal na larawang pandinig, habang ipinakikita ng kasunod na infinitive na ang pakikinig ay nahahayag sa pagtupad. Inilalagay sa talababa ang mas dinamikong alternatibo.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “malipol” upang mapanatili ang bigat ng babala, at ang semicolon upang malinaw na iugnay ang pagdating ng mga sumpa sa personipikadong paghabol at pag-abot ng mga ito.
