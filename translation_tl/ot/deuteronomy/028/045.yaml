  source_fidelity: Tumpak na naihahatid ng draft ang futurong babala, ang personipikadong paghabol at pag-abot ng mga sumpa, ang resultang pagkalipol, at ang literal na larawang “makinig sa tinig.” Gayunman, ang ikalawang pandiwang “aabutan” ay walang malinaw na layon matapos ang “hahabulin ka ng mga ito,” kaya kailangan itong ayusin upang malinaw na ang mga sumpa rin ang umaabot sa kausap.
  naturalness: Marangal at natural sa pangkalahatan ang rehistro. Mas maayos at likas ang magkatuwang na predikat na “Hahabulin at aabutan ka ng mga ito.”
  terminology: Ang “Yahweh,” “Diyos,” “mga utos,” at “mga tuntunin” ay angkop at pare-pareho. Ang “malipol” ay nararapat sa mabigat na tono ng babala. Inayos ang talababa upang hindi magtapos sa putol na pariralang “tinig ni.”
  issues:
