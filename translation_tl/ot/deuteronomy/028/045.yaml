    issue: Hindi malinaw ang sintaks ng “hahabulin ka ng mga ito at aabutan.”
    rationale: Pagkatapos ng ipinuwestong pariralang paksa na “ng mga ito,” ang “aabutan” ay lumilitaw na kulang sa layong “ka.” Ang “Hahabulin at aabutan ka ng mga ito” ay malinaw, natural, at pinananatili ang magkakasunod na mga pandiwa sa Hebreo.
  - severity: low
    issue: 'Putol ang literal na sipi sa talababa: “hindi ka nakinig sa tinig ni.”'
    rationale: 'Maaaring ipakita sa Filipino ang buong pariralang Hebreo nang hindi binabago ang punto ng talababa: “hindi ka nakinig sa tinig ni Yahweh na iyong Diyos.”'
