  to: Dadalhin ka ni Yahweh, kasama ang haring itatalaga mong mamahala sa iyo[a], sa isang bansang hindi mo nakilala, ni nakilala ng iyong mga ama. Doon ay maglilingkod ka sa ibang mga diyos[b]—kahoy at bato.
