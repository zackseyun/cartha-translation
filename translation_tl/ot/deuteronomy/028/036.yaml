  naturalness: Ang pambungad na “Dadalhin ni Yahweh ikaw” ay hindi likas na ayos sa modernong Filipino. Mas natural ang “Dadalhin ka ni Yahweh,” habang nananatiling malinaw ang layon at ang paralelong pagsasama ng hari.
  terminology: Ang “Yahweh,” “bansa,” “maglilingkod,” at “ibang mga diyos” ay angkop at pare-pareho sa pinagmulang Hebreo. Ang “itatala/itatalaga mong mamahala sa iyo” ay natural na katumbas ng hari na inilalagay ng kausap sa ibabaw ng sarili niya.
