  text: יוֹלֵ֨ךְ יְהוָ֜ה אֹֽתְ/ךָ֗ וְ/אֶֽת מַלְכְּ/ךָ֙ אֲשֶׁ֣ר תָּקִ֣ים עָלֶ֔י/ךָ אֶל גּ֕וֹי אֲשֶׁ֥ר לֹא יָדַ֖עְתָּ אַתָּ֣ה וַ/אֲבֹתֶ֑י/ךָ וְ/עָבַ֥דְתָּ שָּׁ֛ם אֱלֹהִ֥ים אֲחֵרִ֖ים עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/036.yaml
  text: Yahweh will bring you and the king whom you set over yourself to a nation that neither you nor your fathers have known[a], and there you will serve other gods[b], wood and stone.
translation:
  language: tl
  text: Dadalhin ka ni Yahweh, kasama ang haring itatalaga mong mamahala sa iyo[a], sa isang bansang hindi mo nakilala, ni nakilala ng iyong mga ama. Doon ay maglilingkod ka sa ibang mga diyos[b]—kahoy at bato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang haring iluluklok mo upang mamahala sa iyo.”
    reason: lexical_alternative
  - marker: b
    text: O “sasambahin mo ang ibang mga diyos”; literal na nangangahulugang “maglingkod” ang pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹלֵךְ
  choice: Dadalhin
  rationale: Ang Hiphil ng הלך ay causative, ‘papupuntahin/dadalhin.’ Ang “dadalhin” ay natural sa Filipino at hindi nagdaragdag ng tahasang terminong “ipatatapon,” bagaman iyon ang konteksto ng sumpa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מַלְכְּךָ אֲשֶׁר תָּקִים עָלֶיךָ
  choice: ang haring iluluklok mo upang mamahala sa iyo
  rationale: Ang Hiphil ng קום ay tumutukoy sa paglalagay o paghirang sa isang pinuno. Ipinahahayag ng “iluluklok” ang pagkakatalaga bilang hari, habang inililinaw ng “upang mamahala sa iyo” ang עָלֶיךָ.
- source_word: גּוֹי
  choice: isang bansa
  rationale: Karaniwang tumutukoy ang גוי sa isang bansa o pangkat ng mga tao; ang “bansa” ang tuwirang angkop sa konteksto ng pagdadala sa ibang lupain.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: na hindi mo nakilala at hindi rin nakilala ng iyong mga ninuno
  rationale: Pinananatili nito ang diin na ang bansang iyon ay hindi kilala kapuwa ng kausap at ng naunang mga salinlahi. Ang “mga ninuno” ay mas natural kaysa literal na “mga ama” sa makasaysayang ekspresyong ito sa Filipino.
- source_word: וְעָבַדְתָּ שָׁם
  choice: Doon ay maglilingkod ka
  rationale: Ang עבד ay literal na “maglingkod,” ngunit kapag mga diyos ang layon maaari rin itong mangahulugang sumamba. Pinananatili sa teksto ang mas malawak na leksikal na diwa at inilalagay sa talababa ang alternatibo.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang sinasalamin nito ang karaniwang pariralang pangtipan at hindi ito nililimitahan sa interpretasyong “mga diyos ng ibang bayan.”
- source_word: עֵץ וָאָבֶן
  choice: kahoy at bato
  rationale: Pinananatili ang maikli at mapanghamak na apposition sa Hebreo, sa halip na tahasang idagdag ang “yari sa,” na ipinahihiwatig lamang ng teksto.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang tahasang nasa Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng עבד kaugnay ng ibang mga diyos
  choice: maglilingkod
  alternative: sasamba
  rationale: Ang “maglilingkod” ang literal at mas malawak na katumbas, samantalang tunay ding posible sa konteksto ang “sasamba”; kaya hindi tahimik na nilulutas ang saklaw ng salita at itinatala ang alternatibo sa talababa.
- issue: Paglalarawan sa “ibang mga diyos” bilang עֵץ וָאָבֶן
  choice: ibang mga diyos—kahoy at bato
  alternative: ibang mga diyos na yari sa kahoy at bato
  rationale: Ang anyong appositional ay malapit sa Hebreo at hindi nagdaragdag ng pandiwang “yari,” bagaman malinaw na materyal ng mga diyus-diyosan ang kahoy at bato sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iluluklok” para sa paglalagay sa hari, “mga ninuno” bilang natural na makasaysayang katumbas ng אבות, at isang em dash upang mapanatili ang maigsi at mariing apposition na “kahoy at bato.”
