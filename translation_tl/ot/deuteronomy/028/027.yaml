- from: Pahihirapan ka ni Yahweh sa pamamagitan ng mga pigsa ng Ehipto, mga bukol[a], mga langib, at matinding pangangati na hindi gagaling.
  to: Tatamaan ka ni Yahweh ng mga pigsa ng Ehipto, mga bukol[a], mga langib, at pangangati. Hindi ka mapapagaling mula sa mga ito.
  rationale: Pinalitan ang mas maluwag na “Pahihirapan ka” ng “Tatamaan ka” upang maipakita ang tuwirang pagkilos ni Yahweh na nasa pandiwang Hebreo. Inalis ang di-sinusuportahang “matinding,” at ginawang hiwalay ang pahayag tungkol sa kawalan ng paggaling upang malinaw na tumutukoy ito sa buong talaan ng karamdaman. Ang talababa ay pinanatili, na may mas maingat at neutral na pananalita.
