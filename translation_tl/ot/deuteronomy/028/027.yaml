base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/027.yaml
  text: Yahweh will strike you with the boils of Egypt[a], and with tumors, and with scabs, and with itch, from which you cannot be healed.
translation:
  language: tl
  text: Tatamaan ka ni Yahweh ng mga pigsa ng Ehipto, mga bukol[a], mga langib, at pangangati. Hindi ka mapapagaling mula sa mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga almoranas.” Hindi tiyak ang salitang Hebreo at maaaring mas partikular na tumukoy sa mga pamamaga sa paligid ng puwit.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: Pahihirapan ka
  rationale: Ang Hiphil ng נכה ay may diwang tuwirang pananakit o pagpapahirap. Sa konteksto ng mga sakit, mas natural sa modernong Tagalog ang “pahihirapan ka” kaysa literal na “hahampasin ka,” habang nananatili ang lakas ng banal na pagpaparusa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: בִּשְׁחִין מִצְרַיִם
  choice: sa pamamagitan ng mga pigsa ng Ehipto
  rationale: Ang שְׁחִין ay pamamaga o pigsa sa balat. Ginamit ang maramihang “mga pigsa” bilang natural na pagtukoy sa uri ng karamdaman, at pinanatili ang ugnayang “ng Ehipto,” na maaaring umalingawngaw sa salot sa Ehipto.
- source_word: וּבְעפלים
  choice: mga bukol
  rationale: Hindi tiyak ang eksaktong tinutukoy ng terminong Hebreo. Ang “mga bukol” ay sapat na malawak at hindi nagpapanggap ng katiyakang medikal; inilagay sa talababa ang mas tiyak na posibleng kahulugan.
- source_word: וּבַגָּרָב
  choice: mga langib
  rationale: Tumutukoy ang גָּרָב sa sakit sa balat na may makaliskis o malalangib na pamamantal. Ang “mga langib” ay kongkreto at madaling maunawaan.
- source_word: וּבֶחָרֶס
  choice: matinding pangangati
  rationale: Tumutukoy ang חֶרֶס dito sa isang makating kondisyon ng balat. Ang “matinding pangangati” ay natural at hindi labis na nagtatakda ng modernong diagnosis.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: na hindi gagaling
  rationale: Ipinahahayag ng sugnay ang kawalan ng kakayahang gumaling. Ang “hindi gagaling” ay maikli at natural, bagaman hindi lantad ang pasibong anyo ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang YHWH
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ng “Yahweh” ang pangalang tipan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Gumamit ng karaniwang katawagang pangkatawan at pangkaramdaman, ngunit iniwasan ang labis na tiyak na modernong diagnosis kung hindi tiyak ang Hebreo.
