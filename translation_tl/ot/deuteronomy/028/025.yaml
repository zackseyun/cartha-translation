base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/025.yaml
  text: Yahweh will give you over as defeated before your enemies. You will go out against them by one way[a], and by seven ways you will flee before them, and you will become a horror to all the kingdoms of the earth.
translation:
  language: tl
  text: Pahihintulutan ni Yahweh na matalo ka sa harap ng iyong mga kaaway. Sa iisang daan ay lalabas ka laban sa kanila, ngunit sa pitong daan ay tatakas ka palayo sa kanila. Ikaw ay magiging katatakutan[a] sa lahat ng kaharian sa buong daigdig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang sanhi ng pagkasindak” o “isang bagay na kasindak-sindak.” Ang salitang Hebreo ay maaaring tumukoy sa isang bagay o kalagayang nagdudulot ng matinding takot at pagkagimbal.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּנְךָ נִגָּף
  choice: Ibibigay ka ... upang matalo
  rationale: Pinananatili ang puwersa ng נתן na “ibigay” at ang kalagayan o bunga ng נִגָּף bilang pagkatalo sa labanan, sa halip na patagin ito bilang “papatatalunin ka.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalan ng Diyos sa transliterasyong karaniwang ginagamit sa modernong Filipino.
- source_word: לִפְנֵי אֹיְבֶיךָ
  choice: sa harap ng iyong mga kaaway
  rationale: Pinananatili ang konkretong idyoma ng Hebreo at ang larawang militar ng pagkatalo sa harap ng kaaway.
- source_word: בְּדֶרֶךְ אֶחָד ... וּבְשִׁבְעָה דְרָכִים
  choice: sa iisang daan ... sa pitong daan
  rationale: Iniingatan ang antitetikong larawan ng nagkakaisang pagsalakay at ganap na pagkakawatak-watak sa pagtakas.
- source_word: תֵּצֵא אֵלָיו
  choice: lalabas ka laban sa kanila
  rationale: Ang יצא + אל ay may diwang militar na paglabas upang makipaglaban. Ginawang maramihan ang panghalip sa Filipino ayon sa kolektibong antecedent na “mga kaaway.”
- source_word: תָּנוּס לְפָנָיו
  choice: tatakas ka mula sa harap nila
  rationale: Malinaw na ipinapahayag ang pagtakbo palayo habang pinananatili ang pariralang “mula sa harap” ng Hebreo.
- source_word: לְזַעֲוָה
  choice: isang kakila-kilabot na tanawin
  rationale: Ipinahahayag ang isang bagay o kalagayang nagdudulot ng pagkasindak, hindi lamang ang abstraktong damdaming “takot.”
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: sa lahat ng kaharian sa buong daigdig
  rationale: Ipinapakita ang malawak at pandaigdig na saklaw ng sumpa; ang “buong daigdig” ay likas sa modernong Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Nasa tekstong Hebreo ang Tetragrammaton bilang personal na pangalan; pinananatili ito nang hindi pinapalitan ng isang titulo.
- issue: Diwa ng sumpa sa לְזַעֲוָה
  choice: isang kakila-kilabot na tanawin
  alternative: isang sanhi ng pagkasindak / isang bagay na kasindak-sindak / isang katatakutan
  rationale: Pinananatili ang posibilidad na ang Israel ay magiging isang nakapanghihilakbot na halimbawa o tanawin sa mga kaharian, nang hindi nagdaragdag ng mas huling teolohikong kategorya.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “iisang daan ... pitong daan” upang mapanatili ang paralelismo at matingkad na larawan ng Hebreo. Ang panghalip na maramihan ay natural na tumutukoy sa kolektibong “mga kaaway.”
