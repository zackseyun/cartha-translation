base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/002.yaml
  text: And all these blessings will come upon you and overtake you[a], if you obey the voice of Yahweh your God.
translation:
  language: tl
  text: At darating sa iyo at aabutan ka ng lahat ng pagpapalang ito, kung susundin mo ang tinig ni Yahweh na iyong Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung pakikinggan mo ang tinig ni Yahweh na iyong Diyos.” Ang idyomang Hebreo na “makinig sa tinig” ay madalas tumutukoy sa pakikinig na may kasamang pagsunod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: darating sa iyo
  rationale: Likas na ipinahahayag sa Filipino ang magiging bunga sa kontekstong kondisyonal; ang עַל ay isinama sa pariralang “sa iyo.”
- source_word: כָּל הַבְּרָכוֹת הָאֵלֶּה
  choice: lahat ng pagpapalang ito
  rationale: Tuwirang salin ng buong pariralang pangngalan at pinananatili ang kontekstong tipan.
- source_word: וְהִשִּׂיגֻךָ
  choice: at aabutan ka
  rationale: Pinananatili ng “aabutan” ang matingkad na larawan ng mga pagpapalang humahabol at nakararating sa tao, nang mas natural kaysa “oobertakan” o katulad na anyo.
- source_word: כִּי
  choice: kung
  rationale: Sa konteksto ng mga pagpapala ng tipan, ipinakikilala nito ang kondisyon.
- source_word: תִשְׁמַע בְּקוֹל
  choice: susundin mo ang tinig
  rationale: Ang idyomang Hebreo ay tumutukoy sa pakikinig na may kasamang pagsunod; pinananatili ng “tinig” ang konkretong larawan habang ipinahahayag ng “susundin” ang hinihinging tugon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang ikalawang panauhang isahan at ang ugnayang tipan na ipinahahayag ng hulaping paari.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyon sa halip na palitan ng titulong “PANGINOON.”
- issue: Diwa ng שׁמע בְּקוֹל sa konteksto ng tipan
  choice: kung susundin mo ang tinig
  alternative: kung pakikinggan mo ang tinig
  rationale: Ang parirala ay may diwa ng masunuring pakikinig. Ipinahahayag ng pangunahing salin ang pagsunod, habang inilalahad sa talababa ang mas literal na “pakikinggan.”
translation_notes:
  register: Modernong Filipino na may marangal na himig. Ginamit ang “iyong” upang maging malinaw at bahagyang pormal ang ugnayang paari, at ang “aabutan” upang mapanatili ang larawan ng orihinal nang hindi nagiging di-likas sa karaniwang mambabasa.
