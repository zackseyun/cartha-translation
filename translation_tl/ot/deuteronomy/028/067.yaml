base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/067.yaml
  text: In the morning you will say[a], “If only it were evening!” and in the evening you will say, “If only it were morning!” because of the dread of your heart that you will dread[b], and because of the sight your eyes will see.
translation:
  language: tl
  text: Sa umaga ay sasabihin mo[a], “Sana’y gabi na!” at sa gabi ay sasabihin mo, “Sana’y umaga na!” dahil sa pangambang nasa puso mo, na iyong pangangambahan[b], at dahil sa tanawing makikita ng iyong mga mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Sino ang magbibigay ng gabi/umaga?”—isang idyomang nagpapahayag ng pananabik o paghahangad; kaya, “Sana’y gabi/umaga na!”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari rin: “dahil sa takot sa iyong puso ... at dahil sa makikita ng iyong mga mata.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Sa umaga
  rationale: Likas na salin ng tiyak na pariralang temporal sa makabagong Tagalog.
- source_word: תֹּאמַר
  choice: sasabihin mo
  rationale: Ang Qal imperfect na 2ms sa konteksto ng sumpa ay pahayag tungkol sa mangyayari, hindi utos.
- source_word: מִי יִתֵּן
  choice: Sana'y ... na!
  rationale: Idyoma ito ng matinding paghahangad, hindi literal na tanong na ‘Sino ang magbibigay?’
- source_word: עֶרֶב / בֹּקֶר
  choice: gabi / umaga
  rationale: Pinananatili ang magkatunggaling panahon sa dalawang magkatimbang na sugnay.
- source_word: מִפַּחַד לְבָבְךָ
  choice: dahil sa pangamba ng puso mo
  rationale: Causal ang מִן dito; ang ‘pangamba’ ay naghahatid ng matinding takot habang pinananatili ang larawang Hebreo ng puso.
- source_word: אֲשֶׁר תִּפְחָד
  choice: na iyong pangangambahan
  rationale: Pinananatili ang kamag-anak na sugnay at ang pag-uulit ng ugat ng pangamba sa Hebreo.
- source_word: וּמִמַּרְאֵה עֵינֶיךָ אֲשֶׁר תִּרְאֶה
  choice: at dahil sa tanawing makikita ng iyong mga mata
  rationale: Ang ‘tanawin’ ay tumutukoy sa nakapanghihilakbot na makikita, at ang ‘makikita ng iyong mga mata’ ay nagpapanatili sa matingkad na pagtukoy sa mga mata.
