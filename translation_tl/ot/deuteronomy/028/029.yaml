  text: וְ/הָיִ֜יתָ מְמַשֵּׁ֣שׁ בַּֽ/צָּהֳרַ֗יִם כַּ/אֲשֶׁ֨ר יְמַשֵּׁ֤שׁ הָ/עִוֵּר֙ בָּ/אֲפֵלָ֔ה וְ/לֹ֥א תַצְלִ֖יחַ אֶת דְּרָכֶ֑י/ךָ וְ/הָיִ֜יתָ אַ֣ךְ עָשׁ֧וּק וְ/גָז֛וּל כָּל הַ/יָּמִ֖ים וְ/אֵ֥ין מוֹשִֽׁיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/029.yaml
  text: And you will grope at noon as the blind gropes in the darkness[a], and you will not prosper in your ways; and you will be only oppressed and robbed all the days[c][b], with no one to save you.
translation:
  language: tl
  text: At mangangapa ka sa katanghaliang-tapat gaya ng isang bulag na nangangapa sa dilim[a]. Hindi ka magtatagumpay sa iyong mga lakad[b]. Lagi ka na lamang aapihin at pagnanakawan, at walang magliligtas sa iyo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumasalat”; ang pandiwang Hebreo ay tumutukoy sa paghahanap sa pamamagitan ng paghipo dahil hindi makakita.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi ka magtatagumpay sa iyong mga lakad”; maaari ring ipahayag na “hindi ka magtatagumpay sa iyong mga gawain.”
    reason: lexical_alternative
  - marker: c
    text: O “walang sasagip sa iyo” o “walang tagapagligtas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמַשֵּׁשׁ / יְמַשֵּׁשׁ
  choice: mangangapa / nangangapa
  rationale: Tumutukoy ang pandiwa sa paghahanap o pag-alam sa pamamagitan ng paghipo dahil hindi makakita. Likas sa Tagalog ang “mangapa” at naipahahayag nito kapuwa ang pisikal na kilos at ang kawalan ng direksiyon.
- source_word: בַּצָּהֳרַיִם
  choice: sa katanghaliang-tapat
  rationale: Ito ang pinakamaliwanag na bahagi ng araw. Pinatitindi ng “katanghaliang-tapat” ang kabalintunaan ng pangangapa kahit maliwanag.
- source_word: הָעִוֵּר
  choice: isang bulag
  rationale: Ang salitang Hebreo ay pang-uring panlalaking isahan na ginamit bilang pangngalan. Ang “isang bulag” ay natural sa Tagalog at hindi nagdaragdag ng kasariang hindi kailangang tahasang banggitin sa target na wika.
- source_word: בָּאֲפֵלָה
  choice: sa dilim
  rationale: Direkta at natural itong katumbas ng kadiliman at malinaw ang pagsalungat nito sa “katanghaliang-tapat.”
- source_word: תַצְלִיחַ אֶת דְּרָכֶיךָ
  choice: Hindi ka magtatagumpay sa iyong mga ginagawa
  rationale: Ang Hiphil ng צלח ay nagpapahayag ng pagtatagumpay o pag-unlad. Sa konteksto, ang “mga lakad” ay tumutukoy sa mga gawain at pagsisikap sa buhay; mas malinaw at natural sa modernong Tagalog ang “mga ginagawa,” habang itinatala sa talababa ang mas literal na larawan.
- source_word: אַךְ
  choice: na lamang
  rationale: 'Ipinahahayag ng kataga ang paghihigpit: ito lamang ang patuloy na sasapitin ng kausap.'
- source_word: עָשׁוּק
  choice: aapihin
  rationale: Ipinahahayag ng passive participle ang patuloy na pagdanas ng pang-aapi o pagsasamantala.
- source_word: גָזוּל
  choice: pagnanakawan
  rationale: Ipinahahayag nito ang pagkakait o pag-agaw ng pag-aari. Ang “pagnanakawan” ay malinaw at kasalukuyang Tagalog.
- source_word: כָּל הַיָּמִים
  choice: lagi
  rationale: Ang literal na “lahat ng mga araw” ay isang idyomang nagsasaad ng patuloy na kalagayan. Natural na naihahatid ito ng “lagi” sa Tagalog.
- source_word: וְאֵין מוֹשִׁיעַ
  choice: at walang magliligtas sa iyo
  rationale: Isinasaad ng sugnay na walang taong sasaklolo o maghahatid sa kaligtasan. Pinananatili ng “magliligtas” ang malawak na diwa ng ugat na יָשַׁע nang hindi ito ginagawang tiyak na titulong teolohikal.
theological_decisions:
- issue: Kahulugan ng מוֹשִׁיעַ sa konteksto ng mga sumpa ng tipan
  choice: magliligtas
  alternative: sasagip / tagapagligtas
  rationale: Maaaring tumukoy ang ugat na יָשַׁע sa karaniwang pagsagip o pagliligtas. Ang “magliligtas” ay nagpapanatili sa saklaw ng salita ngunit hindi nag-aangkat ng isang espesipikong mesiyanikong pakahulugan na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “katanghaliang-tapat” upang mapanatili ang matinding pagsalungat sa “dilim,” at “lagi” bilang natural na katumbas ng idyomang Hebreo na כָּל הַיָּמִים. Iniwasan ang sobrang literal ngunit di-likas na mga parirala, habang inilagay sa talababa ang mahalagang literal at leksikal na mga alternatibo.
