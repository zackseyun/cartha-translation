translation_notes:
  register: Makabago at dignipikadong Tagalog na madaling maunawaan. Pinanatili sa pangunahing teksto ang konkretong pananalita ng Hebreo tungkol sa pagdadala ng binhi at pagtitipon ng kaunti; inilagay sa talababa ang mas tahasang pagpapakahulugang pang-agrikultura na “maghahasik” at “aanihin.”
