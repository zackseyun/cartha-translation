  yaml_path: translation/ot/deuteronomy/028/038.yaml
  text: You will carry much seed out to the field[a], but you will gather in little, because the locust will consume it.
translation:
  language: tl
  text: Magdadala ka ng maraming binhi sa bukid[a], ngunit kaunti lamang ang titipunin mo, sapagkat uubusin iyon ng mga balang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Maghahasik ka ng maraming binhi sa bukid, ngunit kaunti lamang ang aanihin mo.” Mas literal na sinasabi ng Hebreo na “magdadala ka ng maraming binhi sa bukid” at “kaunti lamang ang titipunin mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע רַב
  choice: maraming binhi
  rationale: Ang זֶרַע ay binhing inihahasik, at ipinapahayag ng רַב ang malaking dami. Pinananatili ng “maraming binhi” ang konkretong larawang pang-agrikultura.
- source_word: תּוֹצִיא
  choice: magdadala ... sa
  rationale: Ang Hiphil ng יצא ay literal na “magpalabas” o “magdala palabas.” Sa konteksto, tumutukoy ito sa pagdadala ng binhi sa bukid upang ihasik; natural sa Tagalog ang “magdadala ... sa bukid” habang pinananatili ang larawan ng Hebreo.
- source_word: הַשָּׂדֶה
  choice: sa bukid
  rationale: Ang שָׂדֶה ay karaniwang tumutukoy sa bukid o lupang sinasaka. Ang “bukid” ang malinaw at likas na katumbas sa kontekstong ito.
- source_word: וּמְעַט תֶּאֱסֹף
  choice: ngunit kaunti lamang ang matitipon mo
  rationale: Ang אָסַף ay “tipunin” o “ipunin.” Pinananatili ng “matitipon” ang pandiwang larawan ng orihinal, samantalang malinaw sa konteksto na pag-aani ang tinutukoy. Itinatampok ng “kaunti lamang” ang kaibahan sa maraming binhi.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ang כִּי ng dahilan ng kakaunting matitipon. Ang “sapagkat” ay malinaw, dignificado, at angkop na pang-ugnay.
- source_word: יַחְסְלֶנּוּ
  choice: uubusin iyon
  rationale: Ang חסל ay nagpapahiwatig ng lubusang pag-ubos o pagsira. Ang “uubusin” ay natural at sapat ang tindi; pinananatili ng “iyon” ang hindi ganap na tiyak na tinutukoy ng panghalip sa Hebreo.
- source_word: הָאַרְבֶּה
  choice: mga balang
  rationale: Ang אַרְבֶּה ay karaniwang salita para sa balang. Bagaman anyong isahan ang Hebreo, maaari itong gamiting kolektibo; mas natural sa Tagalog ang “mga balang” para sa salot na sumisira sa pananim.
