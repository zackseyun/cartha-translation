  yaml_path: translation/ot/deuteronomy/028/046.yaml
  text: And they will be on you and on your offspring as a sign and a wonder forever[a][b].
translation:
  language: tl
  text: At ang mga iyon[b] ay magiging tanda at kababalaghan sa iyo at sa iyong mga supling[a] magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo.” Ang salitang Hebreo na literal na “binhi” ay maaaring kolektibong tumukoy sa mga anak at mga susunod na salinlahi ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga iyon” ay tumutukoy sa mga sumpang inilarawan sa konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיוּ
  choice: At ang mga iyon ay magiging
  rationale: Ipinagpapatuloy ng pandiwang Hebreo ang magiging bunga ng mga sumpang nauna nang inilarawan. Pinananatili ng “At” ang payak na pang-ugnay, at ng “magiging” ang hinaharap na diwa sa konteksto.
- source_word: בְךָ
  choice: sa iyo
  rationale: Ipinahihiwatig ng pang-ukol na ang mga sumpa ay mananatiling kaugnay ng taong kausap. Likas sa Filipino ang “sa iyo” at hindi nito labis na tinutukoy kung ang diwa ay “nasa,” “sumasaiyo,” o “laban sa iyo.”
- source_word: לְאוֹת
  choice: bilang tanda
  rationale: Karaniwang tumutukoy ang אוֹת sa tanda o palatandaan. Sa pangungusap, natural na naipahahayag ang tungkulin nito sa pamamagitan ng “magiging tanda.”
- source_word: וּלְמוֹפֵת
  choice: at kababalaghan
  rationale: Maaaring tumukoy ang מוֹפֵת sa kababalaghan o pambihirang pangyayaring nagsisilbing tanda. Ang “kababalaghan” ay malinaw at pinananatili ang nakagawiang tambalang “tanda at kababalaghan” nang hindi ipinipilit ang mas tiyak na diwang “masamang pangitain.”
- source_word: וּבְזַרְעֲךָ
  choice: at sa iyong mga supling
  rationale: Ang זֶרַע ay literal na “binhi” ngunit kolektibong tumutukoy rito sa mga anak o inapo ng kausap. Ang “mga supling” ay natural na Filipino at pinananatili ang diwa ng lahing nagmumula sa isang tao.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Ipinahahayag ng parirala ang patuloy at namamalaging tagal. Ang “magpakailanman” ang karaniwang katumbas sa Filipino, nang hindi dinaragdagan ang teksto ng pilosopikal na paliwanag tungkol sa eksaktong saklaw ng tagal.
theological_decisions:
- issue: Tinutukoy ng panghalip na “ang mga iyon”
  choice: Pinanatili ang panghalip; ayon sa konteksto, tumutukoy ito sa mga sumpa o hatol na inilarawan sa mga naunang talata.
  alternative: Tahasang isalin bilang “ang mga sumpang iyon.”
  rationale: Walang hayag na simuno ang pandiwang maramihan sa talatang ito. Malinaw sa malapit na konteksto na mga sumpa ang tinutukoy, ngunit ang pagpapanatili sa panghalip ay umiiwas sa pagdaragdag ng salitang wala sa mismong talata.
- issue: Saklaw ng עַד עוֹלָם
  choice: magpakailanman
  alternative: sa lahat ng salinlahi; palagi
  rationale: Pinananatili ang karaniwang katumbas ng Hebreo at ang bigat ng pahayag, ngunit hindi ito pinalalawak sa isang doktrinal na pagpapasiya kung ang tinutukoy ay metapisikal na walang katapusan o namamalaging tagal sa loob ng konteksto ng tipan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga iyon” upang panatilihin ang panghalip ng Hebreo, “mga supling” para sa kolektibong posteridad, at ang pamilyar na tambalang “tanda at kababalaghan.”
