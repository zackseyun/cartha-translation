review_pass:
  verdict: revise
  source_fidelity: May mahalagang pagkakaiba sa ayos at saklaw ng mga pariralang pang-ukol. Sa Hebreo, ang mga sumpa ay magiging tanda at kababalaghan «sa iyo» at «sa iyong supling»; hindi sila basta magiging tanda at kababalaghan, saka lamang idinadagdag ang mga tatanggap. Dapat ilagay ang «sa iyo» kasunod ng «tanda at kababalaghan» at panatilihin ang paralelong «sa iyong mga supling.»
  naturalness: Likas at angkop ang «tanda at kababalaghan,» «mga supling,» at «magpakailanman.» Mas malinaw at mas malapit sa Hebreo ang paglalagay ng dalawang «sa» pagkatapos ng pariralang «tanda at kababalaghan.»
  terminology: Wasto ang «mga supling» para sa kolektibong זַרְעֲךָ at ang talababa nitong alternatibo. Wasto rin ang «mga iyon» bilang pagpapanatili sa di-hayag ngunit maramihang simuno, na ayon sa konteksto ay mga sumpa. Ang «tanda at kababalaghan» ay angkop para sa לְאוֹת וּלְמוֹפֵת.
  issues:
  - severity: medium
    issue: Hindi eksaktong naipapakita ng kasalukuyang ayos ang saklaw ng «sa iyo at sa iyong mga supling.»
    rationale: Ang בְּךָ ay sumusunod sa «bilang tanda at kababalaghan» sa Hebreo, at ang inuulit na בְּ sa «sa iyong mga supling» ay paralelo rito. Ang rebisyon ay nagpapakitang ang mga sumpa mismo ang magiging tanda at kababalaghan sa/para sa kausap at sa kanyang supling.
  revised_text: At ang mga iyon[b] ay magiging tanda at kababalaghan sa iyo at sa iyong mga supling[a] magpakailanman.
  revised_footnotes:
  - marker: a
    text: O “mga inapo.” Ang salitang Hebreo na literal na “binhi” ay maaaring kolektibong tumukoy sa mga anak at mga susunod na salinlahi ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga iyon” ay tumutukoy sa mga sumpang inilarawan sa konteksto.
    reason: cross_reference
  revision_rationale: Ang rebisyon ay nagdaragdag ng «at» sa pagitan ng «tanda» at «kababalaghan» at pinananatili ang mga pariralang «sa iyo at sa iyong mga supling» bilang magkatuwang na saklaw ng pagiging tanda at kababalaghan. Ito ay tapat sa sintaks ng Hebreo at nananatiling natural sa makabagong Filipino.
