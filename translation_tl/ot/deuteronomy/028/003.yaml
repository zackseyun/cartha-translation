  yaml_path: translation/ot/deuteronomy/028/003.yaml
  text: Blessed shall you be in the city[a], and blessed shall you be in the field.
translation:
  language: tl
  text: Pagpapalain ka sa lungsod[a], at pagpapalain ka sa bukid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Pinagpala ka sa lungsod, at pinagpala ka sa bukid.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: pagpapalain
  rationale: Ang passive participle na בָּרוּךְ ay nasa konteksto ng mga pagpapala ng tipan. Ginamit ang pandiwang nasa anyong hinaharap upang likas na maipahayag sa Filipino ang pangakong puwersa ng talata, nang hindi ito gawing simpleng mabuting kapalaran.
- source_word: אַתָּה
  choice: ka
  rationale: Ang panghalip ay ikalawang panauhang panlalaking isahan at tumutukoy sa Israel bilang isang kolektibong kausap. Likas na pinananatili ng Filipino na “ka” ang tuwirang isahang pagtukoy.
- source_word: בָּעִיר
  choice: sa lungsod
  rationale: Ang ב prefixed sa עִיר ay nagpapahayag ng kinaroroonan. Ang “sa lungsod” ay tuwiran at malinaw, at pinananatili ang kaibahan ng buhay sa lungsod at sa bukid.
- source_word: וּבָרוּךְ
  choice: at pagpapalain
  rationale: Pinanatili ang pang-ugnay at ang pag-uulit ng panaguri upang maingatan ang balanseng paralelismo ng Hebreo.
- source_word: בַּשָּׂדֶה
  choice: sa bukid
  rationale: Ang שָׂדֶה ay maaaring tumukoy sa bukid, kaparangan, o lupaing agrikultural. Ang “sa bukid” ang pinakanatural at kongkretong katapat sa modernong Filipino at malinaw na kaibahan ng “sa lungsod.”
theological_decisions:
- issue: Pagpapakahulugan sa pormulang pagpapala na walang tahasang pandiwa
  choice: Pagpapalain ka ... at pagpapalain ka ...
  alternative: Pinagpala ka ... at pinagpala ka ...
  rationale: Walang tahasang pandiwa sa Hebreo, kaya maaari itong basahing deklarasyon sa kasalukuyan o pangako. Sa konteksto ng Deuteronomio 28, ang “pagpapalain ka” ay natural na nagpapahayag ng pangakong puwersa, habang inilalagay sa talababa ang lehitimong deklaratibong pagbasa.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang maikli at balanseng paralelismo ng Hebreo at iniwasan ang mas teknikal o makalumang bokabularyo.
