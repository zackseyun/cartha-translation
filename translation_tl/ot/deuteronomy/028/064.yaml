revisions:
- from: Ikakalat ka ni Yahweh sa lahat ng mga bayan, mula sa isang dulo ng daigdig hanggang sa kabilang dulo nito.[a] Doon ay maglilingkod ka sa ibang mga diyos na hindi mo nakilala, ni ng iyong mga ninuno—mga diyos na kahoy at bato.[b]
  to: Ikakalat ka ni Yahweh sa gitna ng lahat ng mga bayan, mula sa isang dulo ng daigdig hanggang sa kabilang dulo nito.[a] Doon ay maglilingkod ka sa ibang mga diyos na hindi mo nakilala ni nakilala man ng iyong mga ninuno—kahoy at bato.[b]
  rationale: Inayos ang sugnay tungkol sa kaalaman ng kausap at ng kaniyang mga ninuno upang malinaw na kapwa sila ang hindi nakakilala sa mga diyos. Ibinalik din ang pangwakas na “kahoy at bato” sa anyong aposisyonal, alinsunod sa Hebreo, habang pinananatili ang paliwanag sa talababa. Walang binagong kahulugan o idinagdag na doktrinal na pagpapakahulugan.
