base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/064.yaml
  text: And Yahweh will scatter you among all the peoples[a], from one end of the earth to the other end of the earth[b], and there you will serve other gods that neither you nor your fathers have known—wood and stone.
translation:
  language: tl
  text: Ikakalat ka ni Yahweh sa gitna ng lahat ng mga bayan, mula sa isang dulo ng daigdig hanggang sa kabilang dulo nito.[a] Doon ay maglilingkod ka sa ibang mga diyos na hindi mo nakilala ni nakilala man ng iyong mga ninuno—kahoy at bato.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “mula sa isang dulo ng lupain hanggang sa kabilang dulo nito.” Ang Hebreong אֶרֶץ ay maaaring mangahulugang “lupain” o “daigdig.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kahoy at bato,” na tumutukoy sa mga diyus-diyosang gawa sa mga materyal na ito.
    reason: cultural_note
lexical_decisions:
- source_word: וֶהֱפִיצְךָ
  choice: Ikakalat ka
  rationale: Ang Hiphil ng פוץ ay nagsasaad ng pagpapangalat; tuwiran at natural ang “ikakalat ka” sa konteksto ng sumpa ng tipan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בְּכָל הָעַמִּים
  choice: sa lahat ng mga bayan
  rationale: Ang עַמִּים ay tumutukoy sa mga pangkat ng tao o mga bayan; mas malapit dito ang “mga bayan” kaysa sa mas pampolitikang “mga bansa.”
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: mula sa isang dulo ng daigdig hanggang sa kabilang dulo nito
  rationale: Ipinahahayag ang ganap na lawak ng pagpapangalat. Ang “daigdig” ay angkop dahil sa pagkalat sa lahat ng mga bayan, habang kinikilala sa talababa ang posibleng kahulugang “lupain.”
- source_word: וְעָבַדְתָּ
  choice: maglilingkod ka
  rationale: Pinananatili ng “maglilingkod” ang pangunahing diwa ng עבד at ang kahulugan nitong pagsamba o katapatan sa isang diyos ay malinaw mula sa layon ng pandiwa.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang salin ng karaniwang pahayag para sa mga diyos na iba kay Yahweh.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: na hindi mo nakilala, ni ng iyong mga ninuno
  rationale: Pinananatili ang ידע bilang “nakilala” nang hindi nililimitahan kung ito ay kaalamang personal, panrelihiyon, o pangkaranasan.
- source_word: עֵץ וָאָבֶן
  choice: mga diyos na kahoy at bato
  rationale: 'Nililinaw sa natural na Tagalog ang aposisyong Hebreo: ang tinutukoy na ibang mga diyos ay mga diyus-diyosang yari o kinakatawan ng kahoy at bato.'
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng personal na pangalan; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng הָאָרֶץ sa pormula ng pagpapangalat
  choice: daigdig
  alternative: lupain
  rationale: Pinapaboran ng kontekstong “sa lahat ng mga bayan” ang malawak na kahulugang “daigdig,” ngunit tunay na posible rin sa salita ang “lupain,” kaya inilalahad iyon sa talababa.
- issue: Kahulugan ng paglilingkod sa ibang mga diyos
  choice: maglilingkod
  alternative: sasamba
  rationale: Ang “maglilingkod” ay mas pormal na katumbas ng עבד at hindi nito ipinipirmi nang higit sa teksto ang saklaw ng sapilitang pakikibagay, pagsamba, o katapatan sa mga diyos sa pagkatapon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang “ka/mo” dahil isahang panlalaki ang kausap sa Hebreo, na kumakatawan sa Israel bilang kabuuan. Inayos nang bahagya ang huling aposisyon upang maging likas sa Tagalog, habang pinananatili ang diin sa “kahoy at bato.”
