  yaml_path: translation/ot/deuteronomy/028/005.yaml
  text: Blessed shall be your basket and your kneading bowl[a].
translation:
  language: tl
  text: Pagpapalain ang iyong bakol at ang iyong mangkok na pamasa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sisidlang pamasa” o “labangan ng masa.” Ang salitang Hebreo ay tumutukoy sa sisidlang ginagamit sa paghahanda ng masa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Pagpapalain
  rationale: Ang pasibong participle ay ginagamit bilang pahayag ng pagpapala. Sa serye ng mga tipan na pagpapala, natural na ipinahahayag sa Filipino ang tiyak na hinaharap na kalagayan sa pamamagitan ng “Pagpapalain,” hindi bilang isang kahilingan lamang.
- source_word: טַנְאֲךָ
  choice: ang iyong basket
  rationale: Ang טֶנֶא ay sisidlang basket, karaniwang ginagamit sa pagdadala ng ani. Sapat at likas ang “basket” nang hindi nagdaragdag ng espesipikong materyal o laman na hindi tahasang binanggit sa Hebreo.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: at ang iyong mangkok na pangmasa
  rationale: Ang מִשְׁאֶרֶת ay sisidlang ginagamit sa paghahanda at pagmamasa ng masa. Malinaw sa karaniwang mambabasa ang “mangkok na pangmasa,” habang pinananatili ang gamit ng sisidlan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “iyong” upang mapanatili ang isahang ikalawang panauhan ng mga hulaping Hebreo; pinanatili rin ang magkatambal na larawan ng sisidlan ng ani at sisidlan ng paghahanda ng pagkain.
