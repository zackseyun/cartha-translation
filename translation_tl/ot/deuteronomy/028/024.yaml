base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/024.yaml
  text: Yahweh will make the rain of your land dust and powder[a]; from the heavens it will come down on you until you are destroyed.
translation:
  language: tl
  text: Gagawin ni Yahweh na alabok at lupa[a] ang ulan para sa iyong lupain. Mula sa langit ay babagsak ito sa iyo hanggang sa malipol ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinong alabok at maluwag na lupa.” Dalawang magkaugnay na salitang Hebreo para sa tuyong materyal ang pinagtambal dito (אָבָק, עָפָר), kaya pinatitindi ang larawan ng ulan na napalitan ng alabok at lupa, tungo sa tagtuyot at pagkawasak.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “Panginoon.”
- source_word: יִתֵּן
  choice: Gagawin
  rationale: Bagaman literal na “magbibigay,” ipinahihiwatig ng konteksto na gagawin ni Yahweh na tuyong materyal ang ulan; natural itong naipapahayag sa Filipino sa pamamagitan ng “gagawin ... na.”
- source_word: מְטַר אַרְצְךָ
  choice: ang ulan para sa iyong lupain
  rationale: Ang “para sa iyong lupain” ay natural sa Filipino at malinaw na tumutukoy sa ulang nakalaan sana sa lupain.
- source_word: אָבָק וְעָפָר
  choice: pinong alabok at tuyong lupa
  rationale: Pinananatili ang dalawang magkaugnay ngunit hindi lubos na magkaparehong katawagan. Nililinaw ng “pinong” at “tuyong” ang larawan ng alikabok at lupang ibinubuhos sa halip na ulan.
- source_word: מִן הַשָּׁמַיִם יֵרֵד עָלֶיךָ
  choice: Mula sa langit, babagsak ang mga ito sa iyo
  rationale: Natural na inilalarawan ng “babagsak” ang tila pag-ulan ng naunang dalawang tuyong sangkap. Ginamit ang maramihang “mga ito” ayon sa dalawang pangngalang tinutukoy sa Filipino, kahit isahan ang pandiwang Hebreo.
- source_word: עַד הִשָּׁמְדָךְ
  choice: hanggang sa malipol ka
  rationale: Ang “malipol” ay angkop sa matinding bunga ng sumpa at hindi nagdaragdag ng tahasang tagaganap na hindi binanggit sa sugnay.
theological_decisions:
- issue: Paglalahad sa pangalang tipan na יְהוָה
  choice: Yahweh
  alternative: Panginoon o Jehovah
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo at iniiwasang palitan ito ng isang titulo.
- issue: Hindi tahasang tagaganap sa עַד הִשָּׁמְדָךְ
  choice: hanggang sa malipol ka
  alternative: hanggang sa lipulin ka niya
  rationale: Hindi pinipilit ng salin ang isang tahasang paksa sa huling sugnay, kaya napapanatili ang siksik at bahagyang di-tahasang anyo ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lupain” para sa covenantal na konteksto, “malipol” para sa matinding hatol, at isang maikling talababa upang mapanatili ang leksikal na saklaw ng magkatambal na salitang Hebreo.
