revisions:
- from: Kung hindi ninyo iingatang tuparin ang lahat ng salita ng kautusang ito na nakasulat sa aklat na ito[a], upang matakot kayo sa maluwalhati at kakila-kilabot na pangalang ito[b]—si Yahweh na inyong Diyos[c]—
  to: Kung hindi mo maingat na tutuparin ang lahat ng salita ng kautusang ito na nakasulat sa aklat na ito[a], upang matakot ka sa maluwalhati at kakila-kilabot na pangalang ito[b]—si Yahweh na iyong Diyos[c]—
  rationale: Inayos ang lahat ng panghalip sa isahan upang tumugma sa 2ms na mga anyong Hebreo. Pinalitan ang mas mabigat na “iingatang tuparin” ng likas ngunit katumbas na “maingat na tutuparin.” Inayos din ang alternatibong pahayag sa talababa upang maging idiomatiko sa modernong Filipino, nang hindi binabago ang kahulugan o mga footnote anchor.
