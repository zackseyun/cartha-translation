base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/058.yaml
  text: If you are not careful to do all the words of this law that are written in this book[c][b][a], to fear this glorious and awesome name—Yahweh your God—
translation:
  language: tl
  text: Kung hindi mo maingat na tutuparin ang lahat ng salita ng kautusang ito na nakasulat sa aklat na ito[a], upang matakot ka sa maluwalhati at kakila-kilabot na pangalang ito[b]—si Yahweh na iyong Diyos[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “balumbon” sa halip na “aklat.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “upang magpitagan ka sa maluwalhati at kakila-kilabot na pangalang ito.” Saklaw ng pandiwang Hebreo kapwa ang pagpipitagan at takot.
    reason: lexical_alternative
  - marker: c
    text: 'Hebreo: “YHWH”; tradisyonal na isinasalin na “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמֹר לַעֲשׂוֹת
  choice: iingatang tuparin
  rationale: Pinananatili ng “ingatang tuparin” ang diwa ng maingat na pagbabantay o pagsunod na humahantong sa aktuwal na paggawa.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: lahat ng salita ng kautusang ito
  rationale: Tuwirang sinasalamin ng “mga salita” ang דִּבְרֵי, at ang “kautusan” ay angkop sa tipanang-legal na konteksto ng Deuteronomio.
- source_word: הַכְּתוּבִים בַּסֵּפֶר הַזֶּה
  choice: na nakasulat sa aklat na ito
  rationale: Likas sa modernong Tagalog at pinananatili ang hayagang pagtukoy sa nakasulat na tipanang teksto.
- source_word: לְיִרְאָה
  choice: upang matakot kayo
  rationale: Ipinakikita ang layunin o bunga at pinananatili ang saklaw ng ירא na may kasamang tunay na takot at pagpipitagan.
- source_word: הַשֵּׁם
  choice: pangalan
  rationale: Pinananatili ang reverensiyal na pagtukoy sa nahayag na pagkakakilanlan at reputasyon ng Diyos.
- source_word: הַנִּכְבָּד וְהַנּוֹרָא
  choice: maluwalhati at kakila-kilabot
  rationale: Ang “maluwalhati” ay naghahatid ng bigat, dangal, at kaluwalhatian; ang “kakila-kilabot” ay nagpapanatili sa nakapanghihilakbot at kamangha-manghang lakas ng נורא.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang tetragrammaton bilang personal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: inyong Diyos
  rationale: Ang panghalip sa Hebreo ay pangalawang panauhang panlalaking isahan, ngunit natural na ginagamit sa Filipino ang magalang at kolektibong “inyong” para sa Israel na kinakausap bilang tipanang bayan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Hayagang ginagamit ng teksto ang personal na pangalan. Pinananatili ito upang hindi mapalitan ng titulo ang tipanang pangalan.
- issue: Kung palalambutin ang ירא bilang pagpipitagan lamang
  choice: matakot
  alternative: magpitagan
  rationale: Pinananatili ng “matakot” ang tensiyon ng pagpipitagan at pangamba sa tipanang pananalita; nililinaw ng talababa na hindi nawawala ang diwa ng paggalang.
- issue: Ugnayan ng pagsunod at pagkatakot sa pangalan
  choice: upang matakot kayo
  alternative: at magpitagan kayo
  rationale: Ang לְ infinitive ay maaaring magpahayag ng layunin o bunga. Ang “upang” ay nagpapanatili sa sintaktikong ugnayang iyon nang hindi ginagawa itong hiwalay na utos.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “iingatang tuparin” upang maging malinaw sa karaniwang mambabasa ang Hebreong idyoma nang hindi inaalis ang diin sa maingat na pagsunod. Pinanatili ang nakabiting hulihan ng pangungusap sa pamamagitan ng em dash dahil nagpapatuloy ang kondisyon sa kasunod na talata.
