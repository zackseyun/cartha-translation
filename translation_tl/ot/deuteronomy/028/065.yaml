id: DEU.28.65
reference: Deuteronomy 28:65
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בַ/גּוֹיִ֤ם הָ/הֵם֙ לֹ֣א תַרְגִּ֔יעַ וְ/לֹא יִהְיֶ֥ה מָנ֖וֹחַ לְ/כַף רַגְלֶ֑/ךָ וְ/נָתַן֩ יְהוָ֨ה לְ/ךָ֥ שָׁם֙ לֵ֣ב רַגָּ֔ז וְ/כִלְי֥וֹן עֵינַ֖יִם וְ/דַֽאֲב֥וֹן נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/065.yaml
  text: And among those nations you will find no rest[a], and there will be no resting place for the sole of your foot; and there Yahweh will give you a trembling heart, failing eyes[c][b], and anguish of soul.
translation:
  language: tl
  text: Sa mga bansang iyon, hindi ka mapapanatag[a], at walang mapagpapahingahan ang talampakan mo. Doon, bibigyan ka ni Yahweh ng pusong nanginginig, mga matang nanghihina[b], at dalamhati ng kaluluwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi ka magkakaroon ng kapahingahan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pagkaubos” o “pagkasayang ng mga mata.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “pighati ng kaluluwa” o “sakit ng kaluluwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַרְגִּיעַ
  choice: mapapanatag
  rationale: Ang Hiphil ng רגע sa kontekstong ito ay tumutukoy sa pagkakaroon ng kapanatagan o pahinga. Likas sa modernong Tagalog ang “mapapanatag,” habang pinananatili ang diwa ng kawalan ng katiwasayan sa pagkakatapon.
- source_word: מָנוֹחַ
  choice: pahingahan
  rationale: Maaaring tumukoy ang pangngalan sa pahinga o sa lugar na mapagpapahingahan. Dahil kaugnay ito ng talampakan, ang konkretong “pahingahan” ang pinakaangkop.
- source_word: לְכַף רַגְלֶךָ
  choice: ang talampakan mo
  rationale: 'Ang כַּף kasama ng רֶגֶל ay tumutukoy sa ilalim o talampakan ng paa. Isinaayos ang parirala ayon sa natural na balangkas ng Tagalog: “hindi magkakaroon ng pahingahan ang talampakan mo.”'
- source_word: וְנָתַן יְהוָה לְךָ שָׁם
  choice: Doon, bibigyan ka ni Yahweh
  rationale: Inilagay sa unahan ang “Doon” upang mapanatili ang diin ng Hebreo sa lugar, at ginamit ang personal na pangalang Yahweh para sa יְהוָה.
- source_word: לֵב רַגָּז
  choice: pusong nanginginig
  rationale: Ang רַגָּז ay nagpapahiwatig ng panginginig, pagkabalisa, at matinding ligalig. Pinananatili ng “pusong nanginginig” ang matingkad na larawang pisikal at emosyonal.
- source_word: כִּלְיוֹן עֵינַיִם
  choice: mga matang nanghihina
  rationale: Ang כִּלְיוֹן ay maaaring mangahulugang pagkaubos, panghihina, o unti-unting pagkasayang. Ang “mga matang nanghihina” ay malinaw at likas sa Tagalog nang hindi labis na tinutukoy ang sanhi.
- source_word: דַּאֲבוֹן נָפֶשׁ
  choice: dalamhati ng kaluluwa
  rationale: Ang דַּאֲבוֹן ay sakit, pighati, o dalamhati, samantalang ang נֶפֶשׁ ay maaaring tumukoy sa kaluluwa, sarili, o buong buhay ng tao. Pinananatili ng salin ang tindi at lawak ng parirala.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang YHWH ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Saklaw ng נֶפֶשׁ sa pariralang דַּאֲבוֹן נָפֶשׁ
  choice: kaluluwa
  alternative: kalooban; buong pagkatao
  rationale: Pinananatili ng “kaluluwa” ang tradisyonal at malawak na katawagan, ngunit hindi ipinapalagay na nakahiwalay lamang itong espirituwal na bahagi; maaaring saklaw ng Hebreo ang kalooban o buong buhay ng tao.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mapapanatag” at “pahingahan” upang maiwasan ang mabigat o lipas na pananalita, habang pinanatili ang paralelismo at matitinding larawang Hebreo.
