revisions:
- from: Sa gitna ng mga bansang iyon, hindi ka mapapanatag[a], at hindi magkakaroon ng pahingahan ang talampakan mo. Doon, bibigyan ka ni Yahweh ng pusong nanginginig, mga matang nanghihina[b], at dalamhati ng kaluluwa[c].
  to: Sa mga bansang iyon, hindi ka mapapanatag[a], at walang mapagpapahingahan ang talampakan mo. Doon, bibigyan ka ni Yahweh ng pusong nanginginig, mga matang nanghihina[b], at dalamhati ng kaluluwa[c].
  rationale: Pinalitan ang di-natural na konstruksiyong may “pahingahan ang talampakan” ng idiomatikong Tagalog na malinaw na nagsasaad na ang talampakan ay walang mapagpapahingahan. Pinanatili ang lahat ng pangunahing larawan, paralelismo, pangalan ni Yahweh, at saklaw ng Hebreong pahayag. Nilinaw rin ang footnote para sa “kaluluwa” upang manatili itong leksikal na alternatibo at hindi maging labis na pagpapaliwanag.
  reviewer_model: gpt-5.6-terra
