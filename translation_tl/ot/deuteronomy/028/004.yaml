  language: en
  yaml_path: translation/ot/deuteronomy/028/004.yaml
  text: Blessed shall be the fruit of your womb[a], and the fruit of your ground, and the fruit of your livestock—the offspring of your herds and the young of your flocks.
translation:
  language: tl
  text: Pagpapalain ang bunga ng iyong sinapupunan, ang bunga ng iyong lupa, at ang bunga ng iyong mga alagang hayop—ang mga supling ng iyong mga baka at ang mga inakay ng iyong mga kawan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang huling bahagi na “ang pagdami ng iyong mga baka at ang mga supling ng iyong kawan.” Ang mga pariralang Hebreo na שְׁגַר אֲלָפֶיךָ at עַשְׁתְּרֹת צֹאנֶךָ ay mga tradisyonal na katawagan para sa reproduktibong pagdami ng mga alagang hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Pagpapalain
  rationale: Ang pang-uri ay bahagi ng pormula ng pagpapala sa tipan. Ang anyong panghinaharap ay natural sa Filipino at nagpapatuloy sa daloy ng mga ipinangakong pagpapala sa konteksto.
- source_word: פְּרִי
  choice: bunga
  rationale: Tatlong ulit itong ginamit sa Hebreo. Pinanatili ang iisang salin upang maipakita ang paralelismo ng bunga ng sinapupunan, lupa, at mga alagang hayop.
- source_word: בִטְנְךָ
  choice: iyong sinapupunan
  rationale: Sa kontekstong ito, tumutukoy ito sa sinapupunan bilang pinagmumulan ng mga anak. Dignified at karaniwang pahayag sa Filipino ang “bunga ng sinapupunan.”
- source_word: אַדְמָתְךָ
  choice: iyong lupa
  rationale: Tumutukoy sa lupang nagbibigay ng ani. Mas natural sa Filipino ang “lupa” kaysa “sakahan,” na magiging mas tiyak kaysa sa salitang Hebreo.
- source_word: בְהֶמְתֶּךָ
  choice: iyong mga alagang hayop
  rationale: Malawak na katawagan ito para sa domestikadong hayop. Nililinaw ng kasunod na mga parirala ang mga bakahan at kawan.
- source_word: שְׁגַר
  choice: mga supling
  rationale: Sa pariralang ito, tumutukoy ito sa iniluluwal o reproduktibong pagdami ng mga baka. Ang “supling” ay malinaw at hindi nililimitahan sa isang uri ng batang hayop.
- source_word: אֲלָפֶיךָ
  choice: iyong mga bakahan
  rationale: Bagaman maaaring tumukoy sa mga baka o mga barakong baka, kolektibo ang gamit dito at kaparis ng “mga kawan.”
- source_word: עַשְׁתְּרֹת
  choice: mga inakay
  rationale: Sa nakaugaliang pariralang kasama ng צֹאן, ipinapahiwatig nito ang mga anak o pagdami ng kawan. Ang “mga inakay” ay natural na tumutukoy sa mga batang hayop.
- source_word: צֹאנֶךָ
  choice: iyong mga kawan
  rationale: Kolektibong katawagan ito para sa maliliit na alagang hayop, karaniwang mga tupa at kambing. Pinananatili ng “mga kawan” ang lawak ng salita.
