  naturalness: Marangal at likas sa makabagong Filipino ang kabuuang pangungusap. Mas natural at mas tumpak ang “mga baka” kaysa “mga bakahan.” Ang “mga inakay ng iyong mga kawan” ay katanggap-tanggap para sa mga batang hayop ng kawan.
