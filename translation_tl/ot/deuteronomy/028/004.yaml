translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang tatluhang pag-uulit ng “bunga” upang maihatid ang paralelismo at retorikal na pagkakaisa ng Hebreo; gumamit ng mas likas na mga katawagang “bakahan” at “kawan” sa paglalarawan ng mga hayop.
