  text: יְצַ֨ו יְהוָ֤ה אִתְּ/ךָ֙ אֶת הַ/בְּרָכָ֔ה בַּ/אֲסָמֶ֕י/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֣ח יָדֶ֑/ךָ וּ/בֵ֣רַכְ/ךָ֔ בָּ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/008.yaml
  text: Yahweh will command the blessing on you in your storehouses and in all the work of your hand[c][b][a], and he will bless you in the land that Yahweh your God is giving you.
translation:
  language: tl
  text: Iuutos ni Yahweh na suma iyo ang pagpapala sa iyong mga kamalig[a] at sa lahat ng gawain ng iyong kamay[b], at pagpapalain ka niya sa lupaing ibinibigay[c] sa iyo ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga imbakan” o “mga imbakan ng butil.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa lahat ng pagpapadala ng iyong kamay,” isang idyoma para sa lahat ng iyong gawain o mga pinagsisikapan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nagbibigay” o “ibibigay.” Maaaring isalin sa higit sa isang paraan ang Hebreong participle rito.
    reason: alternative_reading
lexical_decisions:
- source_word: יְצַו
  choice: Iuutos
  rationale: 'Pinananatili nito ang matingkad na diwa ng Piel ng צוה: si Yahweh mismo ang nag-uutos o nagtatakda na dumating ang pagpapala, sa halip na palabuin ito bilang simpleng ‘magbibigay.’'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan iyon ng isang titulo.
- source_word: אִתְּךָ אֶת־הַבְּרָכָה
  choice: na mapasa iyo ang pagpapala
  rationale: Likas sa Filipino ang ‘mapasa iyo’ at ipinapahayag nitong ang tiyak na pagpapala ang iuutos na dumating at manatili sa kausap.
- source_word: בַּאֲסָמֶיךָ
  choice: sa iyong mga kamalig
  rationale: Ang אָסָם ay imbakan, lalo na ng ani o butil. Ang ‘kamalig’ ay maikli, malinaw, at angkop sa agrikultural na konteksto.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: at sa lahat ng gawain ng iyong kamay
  rationale: Pinananatili ang kongkretong larawang Hebreo tungkol sa kamay habang malinaw na tumutukoy sa lahat ng ginagawa o pinagkakaabalahan ng tao.
- source_word: וּבֵרַכְךָ
  choice: at pagpapalain ka niya
  rationale: Ang tahasang ‘niya’ ay natural sa Filipino at nililinaw na si Yahweh pa rin ang gumagawa, habang ipinagpapatuloy ang panghinaharap na diwa ng naunang pandiwa.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Ang ‘lupain’ ay natural na katawagan sa lupaing ipinagkakaloob sa Israel at napapanatili ang mahalagang tipanang himig ng Deuteronomio.
- source_word: נֹתֵן לָךְ
  choice: ibinibigay sa iyo
  rationale: Ang Hebreong participle ay maaaring magpahiwatig ng kasalukuyan, nagpapatuloy, o nalalapit na pagkilos. Pinananatili ng ‘ibinibigay’ ang aspektong ito nang hindi ito tahasang ginagawang panghinaharap.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pinananatili ang personal na pangalang nasa Hebreo at iniiwasang palitan iyon ng titulong maaaring magkubli sa pagkakakilanlan ng Diyos ng tipan.
- issue: Tipanang pahiwatig ng בָּאָרֶץ
  choice: sa lupain
  alternative: sa lupa; sa bansa
  rationale: Ang ‘lupain’ ay nagpapanatili sa pahiwatig ng lupaing ipinagkakaloob ni Yahweh nang hindi nagdaragdag ng salitang ‘ipinangako,’ na wala sa talata.
- issue: Panahunan o aspekto ng נֹתֵן
  choice: ibinibigay
  alternative: ibinibigay na palagian; ibibigay
  rationale: Hindi nilulutas nang labis ang saklaw ng Hebreong participle; inilalahad sa talababa ang lehitimong kasalukuyan o panghinaharap na pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang ‘mapasa iyo’ ay bahagyang mataas ang register ngunit madaling maunawaan at angkop sa pormal na himig ng tipanang pagpapala. Pinanatili ang larawang ‘gawain ng iyong kamay’ sa halip na lubusang gawing paraphrase.
