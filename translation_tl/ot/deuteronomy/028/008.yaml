revisions:
- from: Iuutos ni Yahweh na mapasa iyo ang pagpapala sa iyong mga kamalig[a] at sa lahat ng gawain ng iyong kamay[b], at pagpapalain ka niya sa lupaing ibinibigay[c] sa iyo ni Yahweh na iyong Diyos.
  to: Iuutos ni Yahweh na suma iyo ang pagpapala sa iyong mga kamalig[a] at sa lahat ng gawain ng iyong kamay[b], at pagpapalain ka niya sa lupaing ibinibigay[c] sa iyo ni Yahweh na iyong Diyos.
