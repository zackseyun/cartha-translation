  verdict: revise
  source_fidelity: Tumpak na naipapasa ng draft ang panghinaharap na kilos ni Yahweh, ang pagpapala sa mga kamalig at sa lahat ng gawain, at ang lupain na ibinibigay ni Yahweh. Gayunman, ang “mapasa iyo” ay higit na nagpapahiwatig ng paglipat o pagmamay-ari kaysa ng matalinghagang Hebreong larawan na inuutos ang pagpapala na suma sa kausap.
  naturalness: Marangal at pangkalahatang malinaw ang register. Mas natural at mas malinaw sa makabagong Filipino ang “na suma iyo ang pagpapala” kaysa “na mapasa iyo ang pagpapala.”
  terminology: Ang “Yahweh,” “kamalig,” “gawain ng iyong kamay,” at “lupain” ay angkop at napapanatili ang mahahalagang larawan at bokabularyo ng Deuteronomio. Kailangang itama ang talababa c dahil inuulit nito bilang alternatibo ang anyong “ibinibigay” na siya nang nasa pangunahing teksto.
  issues:
  - severity: medium
    issue: Ang “mapasa iyo ang pagpapala” ay hindi ang pinakatumpak na katumbas ng idiomang Hebreo.
    rationale: Ang pariralang ito ay karaniwang tumutukoy sa isang bagay na napupunta o naipapasa sa isang tao. Ang “na suma iyo ang pagpapala” ay mas natural na nagpapahayag na iniutos ni Yahweh ang pagpapala na dumating o manatili sa kausap, nang pinananatili ang matingkad na larawan ng מקור.
