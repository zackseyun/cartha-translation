id: DEU.28.61
reference: Deuteronomy 28:61
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: גַּ֤ם כָּל חֳלִי֙ וְ/כָל מַכָּ֔ה אֲשֶׁר֙ לֹ֣א כָת֔וּב בְּ/סֵ֖פֶר הַ/תּוֹרָ֣ה הַ/זֹּ֑את יַעְלֵ֤/ם יְהוָה֙ עָלֶ֔י/ךָ עַ֖ד הִשָּׁמְדָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/061.yaml
  text: Also every sickness and every affliction that is not written in the book of this law[a], Yahweh will bring upon you until you are destroyed.
translation:
  language: tl
  text: Bukod dito, pasasapitin sa iyo ni Yahweh ang bawat sakit at bawat kapahamakan[a] na hindi nakasulat sa aklat ng kautusang ito, hanggang sa malipol ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “salot” o “dagok”; ang salitang Hebreo ay maaaring tumukoy sa isang hampas, salot, pinsala, o mapaminsalang pangyayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Bukod dito
  rationale: Ipinahihiwatig ang pagdaragdag ng isa pang bahagi sa talaan ng mga sumpa; natural ito sa modernong Filipino.
- source_word: כָּל חֳלִי
  choice: ang bawat sakit
  rationale: Malawak ang saklaw ng חֳלִי bilang sakit o karamdaman; simple at madaling maunawaan ang “sakit.”
- source_word: וְכָל מַכָּה
  choice: at bawat kapahamakan
  rationale: Maaaring tumukoy ang מַכָּה sa hampas, pinsala, salot, o mapaminsalang dagok. Pinananatili ng “kapahamakan” ang malawak na diwa nang hindi ito nililimitahan sa epidemya.
- source_word: אֲשֶׁר לֹא כָתוּב
  choice: na hindi nakasulat
  rationale: Tuwiran at natural na katumbas ng Hebreong sugnay na pasibo.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֹּאת
  choice: sa aklat ng kautusang ito
  rationale: Pinananatili ang ayos at diwa ng pariralang Hebreo bilang isang nasusulat na dokumento ng tipan.
- source_word: יַעְלֵם ... עָלֶיךָ
  choice: pasasapitin sa iyo
  rationale: Ipinapahayag nang natural sa Filipino ang causative na diwang ‘dadalhin o pangyayaring dumating sa iyo,’ habang malinaw na si Yahweh ang nagpapasapit ng hatol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: עַד הִשָּׁמְדָךְ
  choice: hanggang sa malipol ka
  rationale: Malinaw na ipinapakita ang sukdulang hantungan ng hatol at ang matinding diwa ng pandiwang Hebreo nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit ng Hebreong teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na ipalit ang isang titulo.
- issue: Ahensiya ni Yahweh sa pagdating ng mga kapahamakan
  choice: pasasapitin sa iyo ni Yahweh
  alternative: darating sa iyo
  rationale: Causative ang anyong יַעְלֵם at tahasang si Yahweh ang simuno, kaya hindi dapat palabuin ang kaniyang ahensiya sa hatol.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pasasapitin” upang maipahayag nang natural ang causative na pandiwa, at “kapahamakan” upang mapanatili ang lawak ng kahulugan ng מַכָּה. Ang panghalip na “ka/iyo” ay isahan, gaya ng nasa Hebreo.
