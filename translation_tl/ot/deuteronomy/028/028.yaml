  text: Yahweh will strike you with madness and blindness and confusion of heart[a].
translation:
  language: tl
  text: Hahampasin ka ni Yahweh ng pagkabaliw, pagkabulag, at pagkalito ng puso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagkataranta ng puso” o “pagkabalisa ng puso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: Pahihirapan ka
  rationale: Ang Hifil ng נכה ay tumutukoy sa paghampas o pagpaparanas ng salot. Sa kontekstong ito ng mga sumpa ng tipan, natural sa modernong Tagalog ang “pahihirapan ka” at naipapahayag nito ang pagdadala ng kapahamakan nang hindi gumagamit ng di-likas na literalismong “hahampasin ka ng pagkabaliw.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּשִׁגָּעוֹן
  choice: ng pagkabaliw
  rationale: Tuwirang ipinahahayag ng שִׁגָּעוֹן ang pagkabaliw o pagkasira ng matinong pag-iisip; malinaw at karaniwan ang “pagkabaliw” sa modernong Tagalog.
- source_word: וּבְעִוָּרוֹן
  choice: pagkabulag
  rationale: Literal na tumutukoy ang עִוָּרוֹן sa pagkabulag. Hindi ito pinalawak bilang espirituwal o mental na pagkabulag dahil hindi iyon tahasang sinasabi ng parirala.
- source_word: וּבְתִמְהוֹן לֵבָב
  choice: pagkalito ng puso
  rationale: Maaaring ipakahulugan ang תִמְהוֹן bilang pagkalito, pagkaligalig, o matinding pagkagulat. Pinananatili ng “pagkalito ng puso” ang larawang Hebreo at ang saklaw ng לֵבָב bilang panloob na pag-iisip at kalooban.
- source_word: לֵבָב
  choice: puso
  rationale: Bagaman maaari itong tumukoy sa isip o panloob na pagkatao, pinananatili ng “puso” ang karaniwang metaporang Hebreo nang hindi tahasang nililimitahan ang kahulugan sa isip lamang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang ginamit sa Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng pagkabulag
  choice: Literal na “pagkabulag” nang walang dagdag na paliwanag sa pangunahing teksto
  alternative: Pagkabulag ng isip
  rationale: Ang “ng puso” ay nakakabit lamang sa huling pangngalan sa Hebreo. Ang pagdaragdag ng “ng isip” sa pagkabulag ay magpapasok ng interpretasyong hindi tahasang nasa gramatika.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang magkakatulad na anyong pangngalan—pagkabaliw, pagkabulag, at pagkalito—upang maipakita ang tatluhang ayos ng Hebreo. Ang “Pahihirapan ka … ng” ay piniling natural na katumbas ng idyomang paghampas sa isang tao sa pamamagitan ng mga salot na ito.
