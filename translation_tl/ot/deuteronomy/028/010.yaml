base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/010.yaml
  text: Then all the peoples of the earth will see that the name of Yahweh is called upon you[a], and they will fear you.
translation:
  language: tl
  text: At makikita ng lahat ng mga bayan sa daigdig na ang pangalan ni Yahweh ay itinatawag sa iyo[a], at matatakot sila sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “na tinatawag ka sa pangalan ni Yahweh.” Literal na sinasabi ng idyomang Hebreo na ang pangalan ni Yahweh ay “itinatawag sa ibabaw mo/sa iyo,” na nagpapahayag ng tipanang pagkakakilanlan at pagiging pag-aari niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: At makikita
  rationale: Ang waw na kasunod ng anyong perpekto sa serye ng mga pagpapala ay natural na tumutukoy sa magiging bunga; pinananatili ng “At” ang ugnayan nito sa naunang talata.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: lahat ng mga bayan sa buong mundo
  rationale: Ang עַמֵּי ay tumutukoy sa maraming bayan o pangkat ng mga tao, at ang הָאָרֶץ ay may pandaigdigang saklaw dito dahil ang pagkilala ay mula sa ibang mga bayan.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng makikita ng mga bayan.
- source_word: שֵׁם יְהוָה
  choice: ang pangalan ni Yahweh
  rationale: Pinananatili ang konstruksiyong Hebreo at isinasalin ang tipanang pangalan na יהוה bilang “Yahweh.”
- source_word: נִקְרָא עָלֶיךָ
  choice: ay itinawag sa iyo
  rationale: Pinananatili nito ang pasibong pandiwa at larawan ng pangalang itinatawag sa isang tao, na nagpapahiwatig ng hayagang pagkakakilanlan at pagiging pag-aari ni Yahweh nang hindi lubusang ipinapaliwanag ang idyoma sa pangunahing teksto.
- source_word: וְיָרְאוּ מִמֶּךָּ
  choice: at matatakot sila sa iyo
  rationale: Ang ירא na may מן ay tumutukoy sa takot sa harap ng taong kinikilala bilang kinalulugdan at pinoprotektahan ni Yahweh; hindi nililimitahan ng “matatakot” ang diwa sa pagsamba o paghanga lamang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Diwa ng idyomang נִקְרָא עָלֶיךָ
  choice: ang pangalan ni Yahweh ay itinawag sa iyo
  alternative: tinatawag ka sa pangalan ni Yahweh
  rationale: Pinananatili ng napiling anyo ang larawan at tunay na kalabuan ng Hebreo, habang ipinapaliwanag sa talababa na ipinahihiwatig nito ang pagkakakilanlan at pagiging pag-aari ni Yahweh.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga bayan” sa halip na “mga bansa” upang mas malapit sa עַמִּים, at “sa buong mundo” upang likas na maipahayag ang pandaigdigang saklaw ng הָאָרֶץ.
