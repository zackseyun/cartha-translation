id: DEU.28.31
reference: Deuteronomy 28:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שׁוֹרְ/ךָ֞ טָב֣וּחַ לְ/עֵינֶ֗י/ךָ וְ/לֹ֣א תֹאכַל֮ מִמֶּ/נּוּ֒ חֲמֹֽרְ/ךָ֙ גָּז֣וּל מִ/לְּ/פָנֶ֔י/ךָ וְ/לֹ֥א יָשׁ֖וּב לָ֑/ךְ צֹֽאנְ/ךָ֙ נְתֻנ֣וֹת לְ/אֹיְבֶ֔י/ךָ וְ/אֵ֥ין לְ/ךָ֖ מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/031.yaml
  text: Your ox will be slaughtered before your eyes[a], but you will not eat any of it; your donkey will be seized from before you and will not be returned to you; your flock will be given to your enemies[b], and there will be no one to save you.
translation:
  language: tl
  text: Kakatayin ang iyong baka sa harap ng iyong mga mata, ngunit hindi ka makakain ng kahit kaunti mula rito. Aagawin ang iyong asno sa mismong harap mo[a] at hindi na ito babalik sa iyo. Ibibigay ang iyong kawan sa iyong mga kaaway, at walang sinumang magliligtas sa iyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nanakawin” o “sasamsamin.” Ipinahihiwatig ng salitang Hebreo ang sapilitan o marahas na pagkuha.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “wala kang magiging tagapagligtas” o “walang sinumang sasagip sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרְךָ
  choice: iyong baka
  rationale: Ang שׁוֹר ay isang bovine, madalas na hayop na ginagamit sa paggawa. Ang “baka” ang pinakanatural na pangkalahatang katumbas sa modernong Tagalog; iniiwasan ng “toro” ang maling pagtukoy sa kasarian at ng “kapong baka” ang labis na espesipikasyon.
- source_word: טָבוּחַ
  choice: kakatayin
  rationale: Ang passive participle mula sa טבח ay tumutukoy sa pagkatay ng hayop, hindi lamang sa karaniwang pagpatay. Ang anyong panghinaharap ay angkop sa sunod-sunod na sumpang ipinahahayag sa talata.
- source_word: לְעֵינֶיךָ
  choice: sa harap ng iyong mga mata
  rationale: Pinananatili nito ang malinaw at mapanghamak na diwa na magaganap ang pagkatay habang nasasaksihan mismo ng may-ari.
- source_word: מִמֶּנּוּ
  choice: kahit kaunti mula rito
  rationale: Literal itong “mula rito.” Sa konteksto ng pagkain, malinaw na ipinahihiwatig na walang anumang bahagi ng kinatay na hayop ang mapapakinabangan ng may-ari.
- source_word: חֲמֹרְךָ
  choice: iyong asno
  rationale: Ang “asno” ay malinaw, kasalukuyang salitang Filipino para sa donkey at angkop sa marangal na rehistro ng teksto.
- source_word: גָּזוּל
  choice: aagawin
  rationale: Ang passive participle mula sa גזל ay nagpapahiwatig ng sapilitan o marahas na pagkuha. Natural sa Tagalog ang “aagawin” at mas malinaw ang puwersahang pagkamkam kaysa sa payak na “nanakawin.”
- source_word: מִלְּפָנֶיךָ
  choice: sa mismong harap mo
  rationale: Pinananatili nito ang vivid na larawan ng pag-agaw sa presensiya mismo ng may-ari.
- source_word: יָשׁוּב לָךְ
  choice: hindi na ito babalik sa iyo
  rationale: Pinananatili ng aktibong “babalik” ang gramatikal na anyo at likas na posibilidad ng Hebreo, sa halip na gawing tahasang passive na “maibabalik.”
- source_word: צֹאנְךָ
  choice: iyong kawan
  rationale: Maaaring saklawin ng צֹאן ang mga tupa at kambing bilang pangkat. Hindi ito nililimitahan ng “kawan” sa tupa lamang.
- source_word: נְתֻנוֹת
  choice: ibibigay
  rationale: Tuwirang ipinapahayag nito ang passive na diwa ng נתן sa kontekstong panghinaharap; ang pagtukoy sa mga kaaway ang nagbibigay ng masamang puwersa sa pahayag.
- source_word: לְאֹיְבֶיךָ
  choice: sa iyong mga kaaway
  rationale: Ito ang natural at karaniwang katumbas ng אֹיֵב sa konteksto ng mga sumpa ng tipan.
- source_word: וְאֵין לְךָ מוֹשִׁיעַ
  choice: walang sinumang magliligtas sa iyo
  rationale: Ang מוֹשִׁיעַ ay isang taong nagliligtas o sumasagip. Natural sa modernong Tagalog ang sugnay at pinananatili nito ang kawalan ng anumang personal na tagapagligtas sa kapahamakang inilalarawan.
theological_decisions:
- issue: Paglilipat sa wikang Filipino ng salitang may diwang pagliligtas sa huling sugnay
  choice: walang sinumang magliligtas sa iyo
  alternative: wala kang magiging tagapagligtas; walang sinumang sasagip sa iyo
  rationale: Nagmula ang מוֹשִׁיעַ sa ugat na ישׁע, na nangangahulugang magligtas o magpalaya. Sa kontekstong ito, agarang pagsagip mula sa pagkawala at pang-aapi ang tinutukoy, hindi kinakailangang walang-hanggang kaligtasan; gayunman, hindi dapat pahinain ang tuwirang leksikal na diwa ng “magligtas.”
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang maiikling magkakasunod na pangungusap ay nagpapanatili sa bigat at pag-igting ng serye ng mga sumpa. Ginamit ang “baka” sa halip na labis na espesipikong “toro” o “kapong baka,” at “kawan” upang hindi limitahan ang צֹאן sa mga tupa lamang.
