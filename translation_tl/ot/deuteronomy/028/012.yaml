base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/012.yaml
  text: Yahweh will open to you his good storehouse[a], the heavens, to give the rain of your land in its season and to bless all the work of your hand. You will lend to many nations, but you will not borrow.
translation:
  language: tl
  text: Bubuksan ni Yahweh para sa iyo ang kanyang mabuting kamalig[a]—ang langit—upang bigyan ng ulan ang iyong lupain sa takdang panahon nito at pagpalain ang lahat ng gawa ng iyong kamay. Magpapautang ka sa maraming bansa, ngunit hindi ka mangungutang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “kanyang mabuting imbakan ng yaman.” Ang salitang Hebreo ay maaaring tumukoy sa isang kamalig o imbakan ng yaman; mas angkop ang “kamalig” sa konteksto ng ulan at ani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalan ng Diyos sa tekstong Hebreo at pinananatili ang diwang tipan nito.
- source_word: יִפְתַּח
  choice: Bubuksan
  rationale: Ang Qal imperfect ay may puwersang panghinaharap sa konteksto ng ipinangakong pagpapala, at pinananatili nito ang konkretong talinghaga.
- source_word: אוֹצָרוֹ הַטּוֹב
  choice: kanyang mabuting kamalig
  rationale: Ang אוֹצָר ay maaaring kamalig o ingatang-yaman; mas angkop ang 'kamalig' sa konteksto ng ulan at ani, habang pinananatili ang pang-uring 'mabuti.'
- source_word: הַשָּׁמַיִם
  choice: ang langit
  rationale: Nasa apposisyon ito sa 'kamalig' at tumutukoy sa kalangitan bilang pinagmumulan ng ulan; natural at marangal sa modernong Tagalog ang 'ang langit.'
- source_word: לָתֵת מְטַר אַרְצְךָ
  choice: upang bigyan ng ulan ang iyong lupain
  rationale: Natural na Tagalog ito na nagpapanatili sa layuning ipinahahayag ng infinitive at sa ugnayan ng ulan at lupain.
- source_word: בְּעִתּוֹ
  choice: sa takdang panahon nito
  rationale: Malamang na ang hulapi ay tumutukoy sa ulan; pinananatili ng salin ang diin sa wastong panahon ng pag-ulan.
- source_word: כָּל מַעֲשֵׂה יָדֶךָ
  choice: lahat ng gawa ng iyong kamay
  rationale: Pinananatili ang Hebreong idyoma at ang isahang 'kamay,' na nauunawaan bilang kabuuan ng paggawa ng isang tao.
- source_word: וְהִלְוִיתָ גּוֹיִם רַבִּים
  choice: Magpapautang ka sa maraming bansa
  rationale: Ang Hiphil ng לוה rito ay nangangahulugang magpautang; ang 'mga bansa' ay angkop sa pambansa at tipanang konteksto.
- source_word: וְאַתָּה לֹא תִלְוֶה
  choice: ngunit hindi ka mangungutang
  rationale: Ang Qal ng לוה ay 'mangutang'; ipinakikita ng 'ngunit' ang malinaw na pagsalungat ng dalawang sugnay.
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit mismo ng Hebreong teksto ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal at tipanang pangalan nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang agrikultural na talinghaga, ang apposisyon ng 'ang langit,' at ang Hebreong idyomang 'gawa ng iyong kamay' nang hindi nagdaragdag ng denominasyonal na paliwanag.
