  text: וְ/הָיָ֗ה אִם לֹ֤א תִשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/בָ֧אוּ עָלֶ֛י/ךָ כָּל הַ/קְּלָל֥וֹת הָ/אֵ֖לֶּה וְ/הִשִּׂיגֽוּ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/015.yaml
  text: But if you do not listen to the voice of Yahweh your God[a], to keep and to do all his commandments and his statutes that I am commanding you today[b], then all these curses will come upon you and overtake you.
translation:
  language: tl
  text: Ngunit kung hindi mo pakikinggan ang tinig ni Yahweh na iyong Diyos[a], upang tuparin at isagawa ang lahat ng kanyang mga utos at mga tuntunin na iniuutos ko sa iyo ngayon[b], darating sa iyo ang lahat ng sumpang ito at aabutan ka ng mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pakikinggan ang tinig ni.” Kasama sa idyomang ito ang diwa ng masunuring pakikinig; maaari ring isalin na “susundin.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “upang ingatan at isagawa ang lahat ng kanyang mga utos at mga tuntunin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם לֹא
  choice: Ngunit kung hindi
  rationale: Ipinahahayag nito sa natural na Tagalog ang panalungat na paglipat mula sa mga pagpapala tungo sa kundisyon ng mga sumpa.
- source_word: תִשְׁמַע בְּקוֹל
  choice: pakikinggan ang tinig ni
  rationale: Pinananatili ang Hebreong idyoma ng pakikinig sa tinig, na nagpapahiwatig din ng pagsunod, sa halip na paikliin lamang bilang “susunod.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang tipan na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Natural at marangal na salin ng pang-isahang pormulang pangtipan na “your God.”
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: upang tuparin at gawin
  rationale: 'Pinananatili ang dalawang magkaugnay na pawatas: ang maingat na pag-iingat o pagtupad at ang aktuwal na paggawa, nang hindi nagdaragdag ng pang-abay na wala sa teksto.'
- source_word: כָּל מִצְוֺתָיו וְחֻקֹּתָיו
  choice: lahat ng kanyang mga utos at mga tuntunin
  rationale: Pinananatili ang pagkakaiba ng מִצְוֹת bilang mga utos at חֻקּוֹת bilang mga tuntunin sa legal at pangtipang konteksto.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: na iniuutos ko sa iyo ngayon
  rationale: Ipinapakita ng aspektong nagpapatuloy ang agarang kilos ni Moises sa kasalukuyang pahayag.
- source_word: וּבָאוּ עָלֶיךָ
  choice: darating sa iyo
  rationale: Natural na Tagalog para sa pagdating o pagsapit ng mga sumpa sa isang tao.
- source_word: כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: ang lahat ng sumpang ito
  rationale: Tuwirang pinananatili ang pangtipang kategorya ng mga sumpa.
- source_word: וְהִשִּׂיגוּךָ
  choice: at aabutan ka ng mga ito
  rationale: Pinananatili ang matingkad na larawan ng mga sumpang humahabol at umaabot sa tao.
theological_decisions:
- issue: Paglilipat ng pangalang pangtipan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ang orihinal ay tuwirang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Lakas ng kahulugan ng idyoma ng pakikinig at pagsunod
  choice: pakikinggan ang tinig ni Yahweh ... upang tuparin at gawin
  alternative: susundin si Yahweh ... sa pamamagitan ng pagtupad
  rationale: Pinananatili ng salin ang pandinig na larawan at ang hiwalay na mga ideya ng pag-iingat at paggawa, kaya hindi nito pinapawi ang tekstuwal na anyo sa isang abstraktong pandiwa lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalang “Yahweh,” ang idyoma ng pakikinig sa tinig, at ang legal-pangtipang pagkakaiba ng “mga utos” at “mga tuntunin.”
