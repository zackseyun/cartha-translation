  naturalness: Marangal at malinaw ang kabuuang rehistro. Ang pagpapalit ng “gawin” sa “isagawa” ay nagpapabuti sa kolokasyon nang hindi dinaragdagan o binabawasan ang kahulugan.
  terminology: Ang “Yahweh,” “Diyos,” “mga utos,” “mga tuntunin,” at “mga sumpa” ay angkop at pare-pareho sa legal-pangtipang rehistro. Nananatiling kapaki-pakinabang ang tala sa idyomang “pakikinggan ang tinig.”
