base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/057.yaml
  text: and toward her afterbirth that comes out from between her legs[a], and toward her children whom she bears, because she will eat them secretly, in the lack of everything[c][b], during the siege and distress with which your enemy will oppress you within your gates.
translation:
  language: tl
  text: at maging sa kanyang inunan na lumalabas sa pagitan ng kanyang mga hita[a], at sa mga anak na isisilang niya. Sapagkat palihim niyang kakainin ang mga ito dahil wala siyang anumang bagay[b], sa panahon ng pagkubkob at kagipitang ipapataw sa iyo ng iyong kaaway sa loob ng iyong mga lunsod[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inunan na inilalabas matapos manganak.” Ang salitang Hebreo ay tumutukoy sa inunan o afterbirth.
    reason: lexical_alternative
  - marker: b
    text: O “dahil sa kawalan ng lahat ng bagay.” Ipinapahayag ng parirala ang sukdulang kakulangan habang kinukubkob ang lunsod.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sa loob ng iyong mga pintuang-bayan.” Tumutukoy ito sa mga lunsod o bayang kinukubkob, hindi lamang sa mismong mga tarangkahan.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְיָתָהּ
  choice: ang inunan
  rationale: Ang שִׁלְיָה ay tumutukoy sa inunan o afterbirth. Ang “inunan” ang natural, tiyak, at karaniwang nauunawaang salitang Filipino.
- source_word: הַיּוֹצֵת מִבֵּין רַגְלֶיהָ
  choice: na lumalabas sa pagitan ng kanyang mga hita
  rationale: Tuwirang inilalarawan ng parirala ang panganganak. Mas natural at anatomikong angkop sa kontekstong ito ang “mga hita” kaysa literal na “mga paa.”
- source_word: וּבְבָנֶיהָ אֲשֶׁר תֵּלֵד
  choice: at ang mga anak na isisilang niya
  rationale: Maaaring tumukoy ang בָּנִים sa mga anak sa pangkalahatan; pinananatili ng “isisilang niya” ang malinaw na ugnayan sa panganganak.
- source_word: כִּי תֹאכְלֵם
  choice: Kakainin niya ang mga ito dahil
  rationale: Ang אכל ay karaniwang pandiwang “kumain,” at kailangang panatilihin ang tahasan at nakapanghihilakbot na larawan. Ginamit ang “dahil” para ihayag ang ugnayang sanhi na dala ng כִּי.
- source_word: בַּסָּתֶר
  choice: Palihim
  rationale: Natural na pang-abay sa Filipino na nagpapanatili sa diwa ng pagkilos nang lingid sa iba.
- source_word: בְּחֹסֶר כֹּל
  choice: dahil sa lubos na kawalan
  rationale: Ipinahihiwatig ng parirala ang sukdulang pagkakait ng lahat ng pangangailangan. Ang “lubos na kawalan” ay malinaw at hindi mabigat sa modernong Filipino.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: sa panahon ng pagkubkob at paghihirap
  rationale: Ang מָצוֹר ay pagkubkob, at ang מָצוֹק ay matinding kagipitan o paghihirap; pinananatili ang magkatambal na mga termino.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: na ipapataw sa iyo ng iyong kaaway
  rationale: Ipinahihiwatig ng Hiphil ng צוּק ang pagpaparanas ng matinding presyon o kagipitan; ang “ipapataw” ay natural sa Filipino at angkop sa kapahamakang dulot ng kaaway.
- source_word: בִּשְׁעָרֶיךָ
  choice: sa loob ng iyong mga lunsod
  rationale: Literal itong “sa iyong mga pintuang-bayan,” ngunit isa itong karaniwang metonimiya para sa mga bayang napapaderan. Ang “mga lunsod” ang malinaw na kahulugan sa modernong Filipino.
