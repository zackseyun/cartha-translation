translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang tahasan at mabigat na larawan ng tekstong Hebreo nang hindi ito pinapalambot. Ang talata ay nagpapatuloy mula sa naunang sugnay, kaya nagsisimula ito sa “pati.”
