base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/068.yaml
  text: And Yahweh will bring you back to Egypt in ships[a], by the way of which I said to you, ‘You shall never see it again.’ And there you will offer yourselves for sale to your enemies as male servants and female servants, but there will be no buyer.
translation:
  language: tl
  text: Ibabalik kayo ni Yahweh sa Ehipto sakay ng mga barko, sa daang sinabi ko sa inyo na hindi na ninyo muling makikita ang Ehipto. Doon ay iaalok ninyo ang inyong sarili[a] sa inyong mga kaaway bilang mga aliping lalaki at babae, ngunit walang bibili sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ipagbibili kayo roon sa inyong mga kaaway bilang mga aliping lalaki at babae.” Ang pandiwang Hebreo ay maaaring unawaing reflexive (“iaalok ninyo ang inyong sarili”) o sa mas pangkalahatang diwa ng pagpasok sa pagkaalipin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱשִׁיבְךָ
  choice: Ibabalik kayo
  rationale: 'Ang Hiphil ng שׁוב ay sanhiang anyo: si Yahweh ang magdadala sa bayan pabalik. Likas sa modernong Tagalog ang “ibabalik kayo” at napapanatili nito ang sanhiang diwa.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: מִצְרַיִם
  choice: Ehipto
  rationale: Karaniwang makabagong Tagalog na pangalan ng lugar.
- source_word: בָּאֳנִיּוֹת
  choice: sakay ng mga barko
  rationale: Malinaw at likas na ipinahahayag sa Tagalog ang paglalakbay sa pamamagitan ng mga sasakyang-dagat.
- source_word: בַּדֶּרֶךְ
  choice: sa daan
  rationale: Ang דֶּרֶךְ ay tumutukoy rito sa ruta ng pagbabalik; pinananatili ng “daan” ang konkretong larawan ng Hebreo.
- source_word: לֹא תֹסִיף עוֹד לִרְאֹתָהּ
  choice: Hindi na ninyo iyon muling makikita
  rationale: Likas na Tagalog ito para sa idyomang may יסף at עוד, na nagsasaad na hindi na mauulit ang pagkakita.
- source_word: וְהִתְמַכַּרְתֶּם
  choice: iaalok ninyo ang inyong sarili upang ipagbili
  rationale: Ipinahahayag nito ang reflexive o middle na diwa nang hindi ipinapalagay na natuloy ang bentahan, yamang kasunod na sinasabing walang bibili.
- source_word: לְאֹיְבֶיךָ
  choice: sa inyong mga kaaway
  rationale: Malinaw na tinutukoy ang mga taong nilalapitan bilang posibleng bumili.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: bilang mga aliping lalaki at babae
  rationale: Pinananatili ang tahasang pares ng mga lalaking alipin at babaeng alipin sa Hebreo sa isang natural na pariralang Tagalog.
- source_word: וְאֵין קֹנֶה
  choice: ngunit walang bibili sa inyo
  rationale: Pinananatili ang larawan ng bentahan at malinaw na ipinahahayag na walang sinumang bibili sa kanila kahit bilang mga alipin.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kalagayan ng pagbebenta sa pagkaalipin
  choice: iaalok ninyo ang inyong sarili upang ipagbili
  alternative: ipagbibili kayo
  rationale: Ang Hitpael ay maaaring unawaing reflexive o middle. Pinili ang reflexive na pagpapahayag ngunit hindi sinasabing nakumpleto ang bentahan, kaya nananatili ang tensiyon sa kasunod na “walang bibili.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kayo/ninyo” para sa bayang Israel bilang kolektibong kausap; hindi likas na maipakikita sa Tagalog ang paglipat ng Hebreo mula isahan tungo sa maramihan nang hindi nagiging mabigat ang pangungusap. Inilagay ang talababa sa mismong pandiwang pinagtatalunan.
