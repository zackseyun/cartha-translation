  text: וְ/לֹ֣א תָס֗וּר מִ/כָּל הַ/דְּבָרִים֙ אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם יָמִ֣ין וּ/שְׂמֹ֑אול לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/014.yaml
  text: And do not turn aside from any of the words that I am commanding you today[a], to the right or to the left[b], to go after other gods to serve them.
translation:
  language: tl
  text: At huwag kayong lumihis sa alinman sa mga salitang iniuutos ko sa inyo ngayon, sa kanan man o sa kaliwa, upang sumunod sa[a] ibang mga diyos at paglingkuran sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lumakad kasunod ng.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sambahin sila.” Ang pandiwa ay tumutukoy sa paglilingkod sa isang diyos at kaya'y may diwa ng pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָסוּר
  choice: lumihis
  rationale: Karaniwang ipinapahayag ng סור ang paglihis o pagtalikod sa itinakdang landas. Ang “lumihis” ay natural sa Filipino at pinananatili ang larawan ng pag-alis sa iniutos.
- source_word: מִכָּל הַדְּבָרִים
  choice: sa alinman sa mga salita
  rationale: Sa ilalim ng pagtanggi, ang מִכָּל ay may diwang “sa alinman,” kaya binibigyang-diin na walang bahagi ng mga iniutos ang dapat talikuran. Pinanatili ang “mga salita” para sa דְּבָרִים.
- source_word: מְצַוֶּה
  choice: iniuutos ko
  rationale: Ang participle ay tumutukoy sa kasalukuyang pag-uutos ni Moises sa mga nakikinig. Likas sa modernong Filipino ang “iniuutos ko” sa ganitong tuwirang pahayag.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Ang “ngayon” ang natural na katumbas na nagpapanatili sa agarang diwa ng panibagong pagpapatibay ng tipan.
- source_word: יָמִין וּשְׂמֹאול
  choice: sa kanan man o sa kaliwa
  rationale: Pinananatili nito ang Hebreong larawang tumutukoy sa paglihis sa alinmang direksiyon.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: upang sumunod sa
  rationale: Ang idyomang הלך אחרי ay literal na may larawang paglakad kasunod ng isang tao ngunit karaniwang nangangahulugang pagsunod. Ang “sumunod sa” ay malinaw at natural habang ang literal na larawan ay inilagay sa talababa.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Ito ang tuwirang kahulugan ng parirala at hindi nagpapasok ng paliwanag tungkol sa kalikasan o katayuan ng mga diyos na tinutukoy.
- source_word: לְעָבְדָם
  choice: paglingkuran sila
  rationale: Ang עבד kapag tumutukoy sa diyos ay maaaring mangahulugang maglingkod o sumamba. Pinananatili ng “paglingkuran” ang mas malawak na diwa ng katapatan at paglilingkod na panrelihiyon.
theological_decisions:
- issue: Pagtukoy sa ibang mga diyos sa babala ng tipan
  choice: ibang mga diyos
  alternative: mga diyos ng ibang mga bansa
  rationale: Tuwirang sinasabi ng Hebreo na “ibang mga diyos.” Pinananatili ng salin ang retorika ng teksto nang hindi nilulutas ang usaping hindi tahasang tinatalakay ng talata tungkol sa ontolohikal na katayuan ng mga ito.
- issue: Diwa ng paglilingkod sa mga diyos
  choice: paglingkuran sila
  alternative: sambahin sila
  rationale: Maaaring taglayin ng עבד ang diwa ng pagsamba kapag diyos ang layon nito, ngunit ang “paglingkuran” ay mas tuwirang katumbas at pinananatili ang saklaw ng panrelihiyong paglilingkod at katapatan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “kayo” ayon sa Hebreo. Pinanatili ang larawang “sa kanan man o sa kaliwa,” habang isinalin nang natural ang idyomang “lumakad kasunod ng” bilang “sumunod sa.”
