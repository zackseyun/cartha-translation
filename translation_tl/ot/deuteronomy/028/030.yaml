  text: אִשָּׁ֣ה תְאָרֵ֗שׂ וְ/אִ֤ישׁ אַחֵר֙ ישגל/נה בַּ֥יִת תִּבְנֶ֖ה וְ/לֹא תֵשֵׁ֣ב בּ֑/וֹ כֶּ֥רֶם תִּטַּ֖ע וְ/לֹ֥א תְחַלְּלֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/030.yaml
  text: You will become engaged to a wife[a], but another man will lie with her; you will build a house, but you will not live in it; you will plant a vineyard[c][b], but you will not begin to use its fruit.
translation:
  language: tl
  text: Makikipagkasundo kang pakasalan ang isang babae[a], ngunit sasipingan siya ng ibang lalaki[b]. Magtatayo ka ng bahay, ngunit hindi ka titira roon. Magtatanim ka ng ubasan, ngunit hindi mo masisimulang pakinabangan ang bunga nito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na pananalita: “Ipagkakasundo mong pakasalan ang isang babae.” Ang tinutukoy ay pormal na pakikipagtipan bago ang kasal; ang babae ay ang nakatakdang maging asawa.'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay isang magaspang at tahasang katawagan sa pakikipagtalik. Ang “sasipingan siya” ay hindi tahasang nagsasaad kung sapilitan ang ginawa. Maaaring ipahiwatig ng konteksto ang pang-aabuso, ngunit hindi ito tahasang minamarkahan ng pandiwa rito.
    reason: textual_and_lexical_alternative
  - marker: c
    text: Sa literal, “hindi mo ito gagawing pangkaraniwan.” Isa itong idyoma para sa pagsisimulang gamitin o kainin ang bunga ng ubasan para sa karaniwang pakinabang.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאָרֵשׂ אִשָּׁה
  choice: Makikipagtipan ka sa isang babae upang mapangasawa siya
  rationale: Ang אֵרַשׂ ay tumutukoy sa pormal na pakikipagtipan bago ang ganap na pagsasama bilang mag-asawa. Nililinaw ng pariralang “upang mapangasawa siya” na ang babae ay ang nakatakdang maging asawa, nang hindi ipinagpapalit ang pakikipagtipan sa kasal mismo.
- source_word: אִישׁ אַחֵר
  choice: ibang lalaki
  rationale: Tuwirang ipinapakita nito ang kaibahan sa lalaking kinakausap.
- source_word: ישגלנה
  choice: makikipagtalik sa kanya
  rationale: Ang anyong nakasulat ay isang tahasan at magaspang na salitang seksuwal. Ang “makikipagtalik” ay malinaw sa modernong Filipino at hindi kusang nagdaragdag na sapilitan ang ginawa, bagaman hindi rin nito inaalis ang kakila-kilabot na konteksto.
- source_word: תֵשֵׁב בּוֹ
  choice: titira roon
  rationale: Kapag bahay ang tinutukoy, ang יָשַׁב ay natural na nangangahulugang manirahan. Mas likas sa Filipino ang “titira roon” kaysa literal na “uupo roon.”
- source_word: כֶּרֶם
  choice: ubasan
  rationale: Ito ang karaniwan at tiyak na salin sa Filipino para sa taniman ng ubas.
- source_word: תְחַלְּלֶנּוּ
  choice: masisimulang pakinabangan ang bunga nito
  rationale: Sa konteksto ng ubasan, ang piel ng חלל ay isang idyoma para sa pagsisimula ng karaniwang paggamit o pagkain ng bunga. Inilalahad ng salin ang diwa nang hindi ginagamit ang nakalilitong literal na “lalapastanganin/gagawing pangkaraniwan.”
theological_decisions:
- issue: Kung ang pakikipagtalik ng ibang lalaki ay tahasang inilalarawang sapilitan
  choice: Hindi tahasang tinukoy sa pangunahing teksto na sapilitan ito
  alternative: “gagahasain siya” o “sapilitang sisipingan siya”
  rationale: Magaspang at mapangwasak ang salitang Hebreo at ang konteksto, ngunit ang mismong anyo rito ay hindi tahasang nagmamarka ng puwersa. Pinananatili ng salin ang bigat ng seksuwal na pagkilos nang hindi nilulutas ang ambiguwidad sa paraang lampas sa tekstong pinagmulan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “makikipagtipan” upang mapanatili ang legal at panlipunang yugto bago ang kasal; “makikipagtalik” upang maipakita ang tahasang seksuwal na diwa nang hindi kusang nagdaragdag ng puwersa; at “masisimulang pakinabangan” upang gawing malinaw ang teknikal na idyoma tungkol sa unang karaniwang paggamit ng bunga.
