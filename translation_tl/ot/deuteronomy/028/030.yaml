  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: pakikipagtipan para sa pag-aasawa, seksuwal na paglapastangan ng ibang lalaki nang hindi tahasang idinaragdag ang pamimilit, pagtatayo ng bahay na hindi matitirhan, at pagtatanim ng ubasan na hindi mapakikinabangan sa karaniwang paraan. Gayunman, ang «makikipagtipan ka sa isang babae» ay maaaring mabasa bilang pangkalahatang kasunduan sa halip na tiyak na pakikipagkatipan para sa kasal.'
  naturalness: Mas natural at tiyak sa modernong Filipino ang «Makikipagkasundo kang pakasalan ang isang babae» para sa pormal na pag-aayos ng kasal. Ang «sasipingan siya» ay mas tuwirang pandiwang may isang malinaw na gumaganap kaysa sa reciprocal na «makikipagtalik sa kanya», na maaaring bahagyang magpahiwatig ng kapwa-kusang kilos.
  terminology: Pinananatili ang «ubasan» at ang pagpapaliwanag sa teknikal na kahulugan ng חלל. Hindi ginagamit ang «gagahasain» sa pangunahing teksto, sapagkat hindi tahasang minamarkahan ng anyong Hebreo ang puwersa, bagaman mabigat at mapangwasak ang konteksto.
