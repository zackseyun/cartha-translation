translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang matinding paglalarawan at ang posibleng saklaw ng idyomang “masama ang tingin,” nang hindi nililimitahan ito sa poot lamang o sa pagdadamot lamang.
