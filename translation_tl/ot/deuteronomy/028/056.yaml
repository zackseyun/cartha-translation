base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/056.yaml
  text: The tender and delicate woman among you[a], who has not ventured to set the sole of her foot on the ground because of delicacy and tenderness, her eye will be evil toward the husband of her embrace[b], and toward her son and her daughter—
translation:
  language: tl
  text: Ang babaeng malambot at maselan sa inyo, na dahil sa kanyang pagiging maselan at malambot ay hindi man lamang nangahas na ilapat sa lupa ang talampakan ng kanyang paa, ay magiging masama ang tingin niya[a] sa asawang kayakap niya[b], at sa kanyang anak na lalaki at anak na babae—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “magiging masama ang tingin niya” ay idyomang Hebreo na maaaring mangahulugang titingnan niya sila nang may poot o may maramot at makasariling saloobin.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang lalaki ng kanyang kandungan,” isang matalik na tawag sa kanyang asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַכָּה
  choice: malambot
  rationale: Pinananatili nito ang pangunahing diwa ng רך na pagiging malambot o banayad, lalo na sa konteksto ng isang babaeng sanay sa maginhawa at maselang pamumuhay.
- source_word: וְהָעֲנֻגָּה
  choice: maselan
  rationale: Ang anyong ito ng ענג ay tumutukoy sa pagiging pino, maselan, o labis na inalagaan. Natural sa Filipino ang “maselan” at hindi nito labis na ipinapaliwanag ang pinagmulan ng kalagayang iyon.
- source_word: אֲשֶׁר לֹא נִסְּתָה כַף רַגְלָהּ הַצֵּג עַל הָאָרֶץ
  choice: na ... hindi man lamang nangahas na ilapat sa lupa ang talampakan ng kanyang paa
  rationale: Ipinapakita ng parirala ang sukdulang pagkamaselan. Ang “nangahas” ay kumakatawan sa ideya ng pagsubok o paglalakas-loob, habang pinananatili ng “talampakan” ang tiyak na larawan ng Hebreo.
- source_word: מֵהִתְעַנֵּג וּמֵרֹךְ
  choice: dahil sa kanyang pagiging maselan at malambot
  rationale: Ginagawang malinaw ang sanhi na ipinahihiwatig ng מִן at inuulit ang magkaparis na konsepto sa unang bahagi ng talata.
- source_word: תֵּרַע עֵינָהּ
  choice: magiging masama ang tingin
  rationale: Pinananatili ang matingkad na idyomang Hebreo tungkol sa “masamang mata,” ngunit gumagamit ng natural na ekspresyong Filipino na maaari pa ring magpahiwatig ng poot, pagdadamot, o pagmamaramot.
- source_word: בְּאִישׁ חֵיקָהּ
  choice: sa asawang kayakap niya
  rationale: Ang אִישׁ ay tumutukoy rito sa asawa, at ang חֵיק ay nagpapahayag ng matalik na pagiging malapit. Ang “asawang kayakap niya” ay mas natural kaysa sa literal na “lalaki ng kanyang kandungan” habang iniingatan ang matalik na larawan.
- source_word: וּבִבְנָהּ וּבְבִתָּהּ
  choice: at sa kanyang anak na lalaki at anak na babae
  rationale: Tahasang binabanggit ng Hebreo ang anak na lalaki at anak na babae; pinananatili ang pagkakahiwalay na iyon sa halip na gawing pangkalahatang “mga anak.”
