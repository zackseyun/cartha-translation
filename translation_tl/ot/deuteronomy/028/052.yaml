  to: Kukubkubin ka niya sa lahat ng iyong mga pintuang-bayan hanggang sa bumagsak ang matataas at pinatibay na mga pader mo na pinagkakatiwalaan mo, sa buong lupain mo. Kukubkubin ka niya sa lahat ng iyong mga pintuang-bayan sa buong lupaing ibinigay sa iyo ni Yahweh na iyong Diyos.
