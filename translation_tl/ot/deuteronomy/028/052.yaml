base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/052.yaml
  text: And he will besiege you in all your gates until your high and fortified walls, in which you trust, come down throughout all your land; and he will besiege you in all your gates throughout all your land that Yahweh your God has given you.
translation:
  language: tl
  text: Kukubkubin ka niya sa lahat ng iyong mga pintuang-bayan hanggang sa bumagsak ang matataas at pinatibay na mga pader mo na pinagkakatiwalaan mo, sa buong lupain mo. Kukubkubin ka niya sa lahat ng iyong mga pintuang-bayan sa buong lupaing ibinigay sa iyo ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵצַר
  choice: Kukubkubin ka niya
  rationale: Ang Hiphil ng צור, kasama ng mga pintuang-bayan at mga pader, ay tumutukoy sa pagkubkob sa kontekstong militar. Pareho ang salin sa dalawang paglitaw nito.
- source_word: שְׁעָרֶיךָ
  choice: lahat ng iyong mga pintuang-bayan
  rationale: Literal itong “iyong mga pintuan,” ngunit ang “pintuang-bayan” ay natural sa Filipino at nagpapanatili sa kongkretong larawan ng mga lungsod na kinukubkob.
- source_word: עַד רֶדֶת
  choice: hanggang sa bumagsak
  rationale: Bagaman literal na “hanggang sa bumaba,” sa mga pader na kinukubkob, malinaw at likas sa Filipino ang “bumagsak,” na naghahatid ng diwang gumuho o maibagsak.
- source_word: חֹמֹתֶיךָ הַגְּבֹהוֹת וְהַבְּצֻרוֹת
  choice: ang matataas at matitibay mong mga pader
  rationale: Pinananatili ang dalawang katangian. Ang בְּצוּרוֹת ay tumutukoy sa mga pader na pinatibay o mahirap mapasok; “matitibay” ang mas natural na paglalarawan sa Filipino sa kontekstong ito.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בָּהֵן
  choice: na iyong pinagtitiwalaan
  rationale: Ipinapahayag ng בטח + ב ang paglalagak ng tiwala o pag-asa sa mga depensa.
- source_word: בְּכָל אַרְצֶךָ
  choice: sa buong lupain mo
  rationale: Ipinahahayag nito ang kabuuang saklaw sa lahat ng teritoryo, nang hindi nagdaragdag ng hindi tahasang detalye.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang pamagat.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: ibinigay sa iyo ni Yahweh na iyong Diyos
  rationale: Direktang ipinapahayag ang natapos na pagkakaloob ng lupain at pinananatili ang ugnayang “iyong Diyos.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang pamagat.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pintuang-bayan” upang mapanatili ang literal na imahen ng שׁער habang malinaw na tumutukoy sa pasukan at depensa ng bayan. Inulit ang “Kukubkubin ka niya” ayon sa retorikal na pag-uulit ng Hebreo.
