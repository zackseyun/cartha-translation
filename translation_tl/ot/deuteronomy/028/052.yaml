  naturalness: Marangal at malinaw ang daloy. Ang “pinagkakatiwalaan mo” ay mas likas at mas tuwirang nagpapahayag ng pagtitiwala sa mga pader kaysa “iyong pinagtitiwalaan.”
  terminology: Ang “pintuang-bayan” ay katanggap-tanggap na kongkretong salin ng שְׁעָרֶיךָ sa kontekstong pagkubkob. Pinanatili ang “Yahweh” bilang personal na banal na pangalan.
