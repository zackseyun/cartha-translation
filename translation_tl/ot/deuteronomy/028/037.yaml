  yaml_path: translation/ot/deuteronomy/028/037.yaml
  text: And you shall become an object of horror[a], a proverb[c][b], and a taunt among all the peoples where Yahweh will drive you.
translation:
  language: tl
  text: At magiging isang kasindak-sindak na bagay ka[a], isang kasabihan[b], at isang tudyo sa gitna ng lahat ng mga bayan kung saan ka itataboy ni Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakagugulat.” Ang salitang Hebreo ay maaaring tumukoy sa isang bagay na lubhang napinsala o kakila-kilabot kaya nagdudulot ito ng sindak o matinding pagkagulat.
    reason: lexical_alternative
  - marker: b
    text: 'O “bansag.” Gumagamit ang Hebreo ng dalawang magkaugnay ngunit magkaibang salita: isa para sa kasabihang palaging binabanggit, at isa para sa mapanlibak na tudyo.'
    reason: lexical_alternative
  - marker: c
    text: O “kung saan ka aakayin ni Yahweh.” Ang pandiwang Hebreo ay maaaring mangahulugang “akayin” o “itaboy”; ipinahihiwatig ng konteksto ng sumpa at pagpapatapon ang sapilitang pagtataboy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: At magiging
  rationale: Ang anyong pandiwa sa sunod-sunod na mga sumpa ay may hinaharap at resultang diwa; likas itong ipinahahayag sa Filipino sa pamamagitan ng “magiging.”
- source_word: לְשַׁמָּה
  choice: isang bagay kang kasindak-sindak
  rationale: Tumutukoy ang שַׁמָּה sa isang kalagayang lubhang nakapangingilabot o nakagugulat. Nililinaw ng parirala na ang Israel mismo ang magiging bagay na titingnan nang may sindak.
- source_word: לְמָשָׁל
  choice: isang kasabihan
  rationale: Ang מָשָׁל ay maaaring mangahulugang kawikaan, kasabihan, o bansag na palaging binabanggit. Ang “kasabihan” ay natural at sapat na malawak sa modernong Filipino.
- source_word: וְלִשְׁנִינָה
  choice: isang tudyo
  rationale: Ang שְׁנִינָה ay isang matalim at mapanlibak na pananalita. Pinananatili ng “tudyo” ang diwa ng paghamak at ang pagkakaiba nito sa מָשָׁל.
- source_word: בְּכֹל הָעַמִּים
  choice: sa lahat ng mga bayan
  rationale: Ang עַמִּים ay maramihan ng “bayan” o “mga tao bilang pangkat.” Ang “mga bayan” ay natural sa Filipino at hindi kinakailangang magpahiwatig ng modernong estadong pambansa.
- source_word: אֲשֶׁר יְנַהֶגְךָ
  choice: pagtatabuyan sa iyo
  rationale: Maaaring mangahulugang “akayin” o “itaboy” ang נהג. Sa konteksto ng sumpa, sapilitang pagpapatapon, at pagkakalat, mas angkop ang “pagtatabuyan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: שָׁמָּה
  choice: ipinahihiwatig sa pariralang “sa lahat ng mga bayang”
  rationale: Ang literal na “doon” ay likas nang kasama sa patunguhang diwa ng sugnay; ang tahasang pag-uulit nito ay magiging mabigat sa Filipino.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na halinhan ito ng titulong “PANGINOON.”
- issue: Diwa ng נהג sa konteksto ng sumpa
  choice: pagtatabuyan
  alternative: pag-aakay
  rationale: Hindi nilulutas ng salitang Hebreo lamang kung “aakayin” o “itataboy,” ngunit ang konteksto ng sapilitang pagpapatapon sa Deuteronomio 28 ay sumusuporta sa mas mapuwersang “pagtatabuyan”; itinatala sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinili ang “kasabihan” at “tudyo” upang mapanatili ang dalawang magkaibang termino sa Hebreo, at “mga bayan” upang tumukoy sa mga pangkat ng tao nang hindi nagpapasok ng makabagong pampolitikang kahulugan.
