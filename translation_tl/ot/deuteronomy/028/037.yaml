  naturalness: May hindi likas at di-gramatikal na ayos ang “magiging isang bagay kang kasindak-sindak” at lalo na ang “mga bayang pagtatabuyan sa iyo ni Yahweh.” Ang rebisyon ay gumagamit ng malinaw, marangal, at modernong Filipino.
