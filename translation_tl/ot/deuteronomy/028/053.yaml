base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/053.yaml
  text: And you will eat the fruit of your womb[a], the flesh of your sons and daughters whom Yahweh your God has given you[b], in the siege and in the distress with which your enemy will oppress you.
translation:
  language: tl
  text: At kakainin mo ang bunga ng iyong sinapupunan[a], ang laman ng iyong mga anak na lalaki at babae na ibinigay sa iyo ni Yahweh na iyong Diyos, sa pagkubkob at sa matinding kagipitang ipaparanas sa iyo ng iyong kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “bunga ng iyong tiyan”; ibig sabihin, ang sarili mong mga supling.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: At kakainin mo
  rationale: Ang Qal perfect na may pang-ugnay ay may hinaharap na diwa sa konteksto ng sumpa; malinaw itong ipinahahayag ng “kakainin mo.”
- source_word: פְרִי בִטְנְךָ
  choice: ang bunga ng iyong sinapupunan
  rationale: Pinananatili ang tahasang larawang Hebreo para sa sariling supling at ang maringal ngunit nakapanghihilakbot na tono ng talata.
- source_word: בְּשַׂר
  choice: ang laman ng
  rationale: Sa konteksto ng pagkain ng tao, ang “laman” ang tuwiran at likas na katumbas sa Filipino nang hindi gumagamit ng mas kolokyal na “karne.”
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: iyong mga anak na lalaki at babae
  rationale: Tahasan ding binabanggit sa salin ang dalawang kasarian gaya ng tekstong Hebreo, sa halip na paikliin lamang sa “mga anak.”
- source_word: אֲשֶׁר נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: na ibinigay sa iyo ni Yahweh na iyong Diyos
  rationale: Pinananatili ang kaugnay na sugnay at ang matinding kabalintunaan na ang mga anak na kaloob ng Diyos ang kakainin sa gitna ng hatol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang pangalang tipan na YHWH bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: sa panahon ng pagkubkob at matinding kagipitan
  rationale: Ang “pagkubkob” ay tumutukoy sa kalagayang militar, samantalang ang “matinding kagipitan” ay naghahatid ng diwa ng matinding pagkakasadlak o paghihirap.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיְבֶךָ
  choice: na idudulot sa iyo ng iyong kaaway
  rationale: Ipinahahayag nang natural sa Filipino ang matinding pamimilit at kagipitang ipapataw ng kaaway, nang hindi nililimitahan ang pandiwa sa isang uri lamang ng pang-aapi.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon.”
- issue: Paglalarawan sa mga anak bilang kaloob ng Diyos sa loob ng sumpa
  choice: Pinanatili ang “na ibinigay sa iyo ni Yahweh na iyong Diyos”
  alternative: Maaaring gawing mas maikli bilang “na ibinigay sa iyo ng Diyos”
  rationale: 'Mahalaga sa tindi at teolohikal na tensiyon ng talata ang buong pahayag: ang mga anak ay kaloob ni Yahweh, ngunit sa hatol ng tipan ay darating ang sukdulang kakila-kilabot na kalagayan.'
translation_notes:
  register: Makabago, malinaw, at maringal na Filipino. Pinanatili ang tahasang karahasan at larawang Hebreo nang hindi pinapalabnaw ang sumpa. Ginamit ang “sinapupunan” bilang likas na biblikal na idyoma at ang “sa panahon ng” upang maging maayos ang daloy sa Filipino.
