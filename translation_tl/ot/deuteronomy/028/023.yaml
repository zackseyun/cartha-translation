  text: And the heavens above your head shall be bronze[a], and the earth beneath you iron.
translation:
  language: tl
  text: At ang langit sa ibabaw ng iyong ulo ay magiging bronse[a], at ang lupa sa ilalim mo ay bakal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tanso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: ay magiging
  rationale: Ang Qal perfect na may prefixed conjunction ay may panghinaharap na diwa sa konteksto ng sumpa; natural itong ipinahahayag sa Tagalog bilang “ay magiging.”
- source_word: שָׁמֶיךָ אֲשֶׁר עַל רֹאשְׁךָ
  choice: ang langit sa ibabaw ng iyong ulo
  rationale: Ang שָׁמַיִם ay maaaring tumukoy sa langit o kalangitan; dito ay ang himpapawid na nasa itaas ang larawan. Pinananatili ng “langit” ang biblikal na himig, at natural na naihahayag ng buong parirala ang lokasyon at kaugnayan sa kausap.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Ang salita ay maaaring mangahulugang copper o bronze. Ang “tanso” ang karaniwang malawak na katawagang Filipino para sa metal na ito at nagpapanatili sa tunay na leksikal na kalabuan; inilalahad sa talababa ang posibleng “bronse.”
- source_word: וְהָאָרֶץ אֲשֶׁר תַּחְתֶּיךָ
  choice: at ang lupa sa ilalim mo
  rationale: Bagaman maaaring mangahulugan ang אֶרֶץ ng lupa, lupain, o daigdig, ang “lupa” ay natural sa Tagalog at angkop sa pagsalungat sa langit at sa larawang matigas at di-mabungang lupa.
- source_word: בַּרְזֶל
  choice: bakal
  rationale: Ito ang tuwiran at karaniwang katumbas ng terminong Hebreo at bumubuo sa kaparis na larawang metal kasama ng נְחֹשֶׁת.
theological_decisions:
- issue: Metaporikal na bisa ng larawan ng sumpa
  choice: Panatilihin ang literal na larawang metal—“tanso” at “bakal”—nang hindi tahasang ipinapaliwanag ang tagtuyot at katigasan sa pangunahing teksto.
  alternative: Isalin nang paliwanag bilang langit na walang ulan at lupang tumigas sa tagtuyot.
  rationale: Matingkad na metapora ng sumpa ng tipan ang nasa Hebreo. Ang pagpapanatili sa mismong larawan ay umiiwas sa pagdaragdag ng paliwanag na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at balanseng paralelismo ng langit sa itaas at lupa sa ilalim, gayundin ang solemneng panghinaharap na diwa ng babala.
