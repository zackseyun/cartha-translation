translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “magpapahid ng langis sa iyong katawan” upang maipakita ang karaniwang sinaunang paggamit ng langis nang hindi ito nililimitahan sa seremonyal na pagpapahid. Ang panandang [a] ay inilagay pagkatapos ng sugnay na may tunay na leksikal na kalabuan.
