  text: You will have olive trees throughout all your territory[a], but you will not anoint yourself with oil, because your olives will fall off.
translation:
  language: tl
  text: Magkakaroon ka ng mga punong olibo sa buong nasasakupan mo, ngunit hindi ka magpapahid ng langis sa iyong katawan, sapagkat malalaglag ang iyong mga olibo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malalaglag ang ani mong olibo,” o “malalaglag ang bunga ng mga punong olibo mo.” Kolektibo ang gamit ng salitang Hebreo para sa “olibo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵיתִים
  choice: mga punong olibo
  rationale: Maaaring tumukoy ang pangngalan sa bunga o sa mga puno, ngunit sa pariralang nagsasabing matatagpuan ang mga ito sa buong nasasakupan, mga punong olibo ang pinakamalinaw na diwa.
- source_word: יִהְיוּ לְךָ
  choice: magkakaroon ka
  rationale: Likas na salin sa Filipino ng Hebreong idyomang nagpapahayag ng pag-aari o pagkakaroon.
- source_word: בְּכָל גְּבוּלֶךָ
  choice: sa buong nasasakupan mo
  rationale: Ang גְּבוּל ay maaaring mangahulugang hangganan o teritoryo; dito, ang buong lupain o sakop ang tinutukoy.
- source_word: וְשֶׁמֶן
  choice: langis
  rationale: Langis lamang ang tahasang sinasabi sa Hebreo; malinaw na mula ito sa olibo dahil sa konteksto.
- source_word: לֹא תָסוּךְ
  choice: hindi ka makapagpapahid ng langis sa iyong katawan
  rationale: Ang סוך ay tumutukoy sa pagpapahid ng langis sa katawan. Iniiwasan ng saling ito ang posibleng eksklusibong seremonyal na dating ng 'magpahid ng langis bilang pagtatalaga.'
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng kawalan ng langis at angkop sa marangal na rehistro.
- source_word: יִשַּׁל
  choice: malalaglag
  rationale: Inilalarawan ng pandiwa ang pagkahulog o pagkalaglag ng bunga mula sa puno, malamang bago ito mapakinabangan.
- source_word: זֵיתֶךָ
  choice: mga olibo mo
  rationale: Bagaman nasa anyong isahan, kolektibo ang gamit at maaaring tumukoy sa bunga, ani, o punong naglalaglag ng bunga; sa pangunahing teksto, natural na ipinahahayag ito bilang mga bunga.
