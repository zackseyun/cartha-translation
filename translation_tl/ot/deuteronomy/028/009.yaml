source:
  edition: WLC
  text: יְקִֽימְ/ךָ֨ יְהוָ֥ה ל/וֹ֙ לְ/עַ֣ם קָד֔וֹשׁ כַּ/אֲשֶׁ֖ר נִֽשְׁבַּֽע לָ֑/ךְ כִּ֣י תִשְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָלַכְתָּ֖ בִּ/דְרָכָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/009.yaml
  text: Yahweh will establish you for himself as a holy people[a], just as he swore to you, if you keep the commandments of Yahweh your God and walk in his ways.
translation:
  language: tl
  text: Itatatag ka ni Yahweh para sa kanyang sarili bilang isang banal na bayan, gaya ng isinumpa niya sa iyo, kung[a] tutuparin mo ang mga utos ni Yahweh na iyong Diyos at lalakad ka sa kanyang mga daan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “sapagkat tinutupad mo ang mga utos ni Yahweh na iyong Diyos.” Kung minsan, maaaring magpahiwatig ng sanhi ang Hebreong pangatnig, bagaman sa kontekstong ito ay mas malamang ang “kung.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְקִימְךָ
  choice: Itatatag ka
  rationale: Ang Hiphil ng קום dito ay tumutukoy sa matibay na pagtatatag sa katayuang tipan, hindi sa pisikal na pagbabangon. Likas at marangal sa Filipino ang “itatatag ka.”
- source_word: לּוֹ
  choice: para sa kanyang sarili
  rationale: 'Pinananatili nito ang diwang pag-aari at kaugnayan: itinatangi ni Yahweh ang Israel bilang bayang sa kanya.'
- source_word: לְעַם קָדוֹשׁ
  choice: bilang isang banal na bayan
  rationale: Ipinapahayag ng parirala ang magiging katayuan ng Israel; malinaw at likas ang “bilang isang banal na bayan.”
- source_word: כַּאֲשֶׁר נִשְׁבַּע לָךְ
  choice: gaya ng isinumpa niya sa iyo
  rationale: Ipinakikita ng sugnay ang pagtutugma ng pangako sa naunang sinumpaang pangako nang hindi dinaragdagan ang teksto.
- source_word: כִּי
  choice: kung
  rationale: Sa balangkas ng mga pagpapala at sumpa sa Deuteronomio, pinakamalamang na nagpapakilala ito ng kondisyon. Nananatili sa talababa ang posibleng pagbasa na sanhi.
- source_word: תִשְׁמֹר אֶת מִצְוֺת
  choice: tutuparin mo ang mga utos
  rationale: Sa ugnayan nito sa mga utos, ang שׁמר ay nangangahulugang ingatan o sundin. Mas natural sa modernong Filipino ang “tuparin ang mga utos” kaysa literal na “ingatan.”
- source_word: וְהָלַכְתָּ בִּדְרָכָיו
  choice: at lalakad ka sa kanyang mga daan
  rationale: Pinananatili ang Hebreong talinghaga para sa pamumuhay na naaayon sa kalooban ng Diyos, at nauunawaan pa rin ito sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang pormulang pangtipan at ang tuwirang ikalawang panauhang isahan ng Hebreo.
theological_decisions:
- issue: Kondisyonal na bisa ng sugnay ng pagpapala
  choice: “kung tutuparin mo ... at lalakad ka”
  alternative: “sapagkat tinutupad mo ... at lumalakad ka”
  rationale: Ang sintaks at ang mas malawak na balangkas ng pagpapala at sumpa sa Deuteronomio ay pumapabor sa tunay na kondisyong kaugnay ng pagsunod. Gayunman, hindi inaalis ang lehitimong posibilidad na sanhi, kaya inilalahad ito sa talababa.
- issue: Pagkakatatag bilang banal na bayan
  choice: Itinatatag ni Yahweh ang Israel para sa kanyang sarili bilang isang banal na bayan.
  alternative: Gagawin lamang banal ang Israel sa puntong ito dahil sa pagsunod nito.
  rationale: Ang teksto ay gumagamit ng wikang pangtipan at tumutukoy sa sinumpaang pangako. Hindi nililinaw ng salin ang lahat ng ugnayan ng pagkahirang, kabanalan, at pagsunod nang higit sa sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pangalang Yahweh, ang pangtipang katawagang “banal na bayan,” at ang talinghagang “lalakad ... sa kanyang mga daan.” Ginamit ang isahang “ka/mo/iyong” upang tumbasan ang ikalawang panauhang isahan ng Hebreo na kumakatawan sa Israel bilang isang bayan.
