  text: And he will bring back upon you all the diseases of Egypt that you dreaded[c][b][a], and they will cling to you.
translation:
  language: tl
  text: Ibabalik niya sa iyo ang lahat ng sakit ng Ehipto na kinatatakutan mo,[a] at kakapit sa iyo ang mga iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na labis mong pinangangambahan.”
    reason: lexical_alternative
  - marker: b
    text: O “at mananatiling nakakapit sa iyo ang mga iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב בְּךָ
  choice: Ibabalik niya sa iyo
  rationale: Ang Hiphil ng שׁוב ay causative, “ipabalik” o “dalhing muli.” Natural sa Filipino ang “ibabalik niya sa iyo” para sa muling pagpaparanas ng mga sakit, habang pinananatili ang diwa ng pagbabalik.
- source_word: כָּל מַדְוֵה מִצְרַיִם
  choice: ang lahat ng sakit ng Ehipto
  rationale: Ang מַדְוֶה ay tumutukoy sa sakit o karamdaman. Direkta, malinaw, at hindi labis na espesipiko ang “lahat ng sakit ng Ehipto.”
- source_word: אֲשֶׁר יָגֹרְתָּ מִפְּנֵיהֶם
  choice: na kinatatakutan mo
  rationale: Ang יגר ay nagpapahayag ng matinding takot o pangamba. Ang “kinatatakutan” ay natural sa modernong Filipino at tumutukoy pabalik sa mga sakit.
- source_word: וְדָבְקוּ בָּךְ
  choice: at kakapit sa iyo ang mga iyon
  rationale: Ang דבק ay “kumapit,” “dumikit,” o “manatiling nakakapit.” Pinananatili ng “kakapit” ang matingkad na larawan ng sakit na hindi humihiwalay.
