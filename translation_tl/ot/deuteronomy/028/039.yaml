  text: You will plant vineyards and cultivate them[a], but you will not drink the wine or gather it, because the worm will eat it.
translation:
  language: tl
  text: Magtatanim ka ng mga ubasan at lilinangin mo ang mga ito, ngunit hindi ka iinom ng alak ni magtitipon nito[a], sapagkat kakainin ito ng uod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mag-iimbak nito.” Ang pandiwang Hebreo ay maaaring mangahulugang tipunin, kolektahin, o imbakin.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָמִים
  choice: mga ubasan
  rationale: Tuwirang katumbas ng pangmaramihang pangngalang tumutukoy sa mga taniman ng ubas.
- source_word: תִּטַּע
  choice: magtatanim ka
  rationale: Ang Qal imperfect na ikalawang panauhang panlalaki ay may hinaharap na diwa sa magkakasunod na sumpa; natural itong ipinahahayag sa modernong Tagalog bilang “magtatanim ka.”
- source_word: וְעָבָדְתָּ
  choice: at aalagaan mo ang mga iyon
  rationale: Sa kontekstong pansakahan, ang עבד ay nangangahulugang bungkalin, linangin, o alagaan ang taniman. Ang “aalagaan” ay natural at malinaw sa karaniwang mambabasa.
- source_word: יַיִן
  choice: alak
  rationale: Tumutukoy sa alak na bunga ng ubasan; sapat at natural ang “alak” sa Tagalog nang hindi na inuulit na mula ito sa ubas.
- source_word: לֹא תִשְׁתֶּה
  choice: hindi ka iinom
  rationale: Pinananatili ang payak na negatibong pahayag na may hinaharap na diwa sa konteksto ng sumpa.
- source_word: וְלֹא תֶאֱגֹר
  choice: ni makapagtipon ng ani
  rationale: Maaaring mangahulugan ang אגר na tipunin, kolektahin, o imbakin. Ipinahahayag ng “ani” ang ipinahihiwatig na bunga ng ubasan at ginagawang natural ang pangungusap sa Tagalog, samantalang inilalagay sa talababa ang alternatibong “makapag-imbak.”
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng pagkawala ng ani sa isang dignificado ngunit madaling maunawaang rehistro.
- source_word: תֹאכְלֶנּוּ
  choice: kakainin iyon
  rationale: Pinananatili ang kongkretong diwa ng pandiwang “kumain” sa halip na gawing mas abstrakto itong “sirain” o “ubusin.”
- source_word: הַתֹּלָעַת
  choice: ang uod
  rationale: Ang salitang Hebreo ay tumutukoy sa isang uod o larba. Hindi tinutukoy ng salin ang espesye nang higit sa malinaw na sinasabi ng teksto.
