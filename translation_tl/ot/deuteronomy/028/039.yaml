translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at dignificado. Ginamit ang “mga iyon” upang maging malinaw ang tinutukoy na mga ubasan, at “ani” upang maipahayag nang natural ang ipinahihiwatig na bagay na tinitipon nang hindi nilulutas nang labis ang lawak ng pandiwang Hebreo.
