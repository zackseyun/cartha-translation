base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/026.yaml
  text: Your carcass will become food for every bird of the sky and for the beasts of the earth[c][b][a], and there will be no one to frighten them away.
translation:
  language: tl
  text: Ang bangkay mo[a] ay magiging pagkain ng lahat ng ibon sa himpapawid at ng mga hayop sa lupa[b], at walang magtataboy sa mga iyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patay mong katawan.” Sa kontekstong ito ng paghatol, may mapanghamak na dating ang salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ibon sa himpapawid” at “mga hayop sa lupa”—isang magkatambal na larawang sumasaklaw sa himpapawid at lupa at nagpapakita ng lubos na pagkakalantad at kahihiyan.
    reason: cultural_note
  - marker: c
    text: Ibig sabihin, walang mananakot at magpapaalis sa mga ibon at hayop habang kinakain ng mga iyon ang bangkay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: ay magiging
  rationale: Sa konteksto ng mga sumpa, ipinahahayag ng anyong pandiwa ang kahihinatnan sa hinaharap. Likas sa Filipino ang konstruksiyong “magiging pagkain.”
- source_word: נִבְלָתְךָ
  choice: ang bangkay mo
  rationale: Ang נְבֵלָה ay bangkay o patay na katawan at may mapanghamak na dating sa kontekstong ito ng paghatol. Pinananatili ng “bangkay” ang tindi ng larawan.
- source_word: לְמַאֲכָל
  choice: pagkain
  rationale: Tumutukoy ito sa pagkain o sa bagay na kinakain; malinaw na naihahayag ng “magiging pagkain” ang resultang diwa ng לְ.
- source_word: לְכָל עוֹף הַשָּׁמַיִם
  choice: ng lahat ng ibon sa himpapawid
  rationale: Kolektibo ang עוֹף. Ang “mga ibon sa himpapawid” ay natural at malinaw sa modernong Filipino, at iniiwasang mapagkamalang tirahan ng Diyos ang tinutukoy na שָׁמַיִם.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: at ng mga hayop sa lupa
  rationale: Kolektibong tumutukoy ang בְּהֵמָה sa mga hayop sa kalupaan. Mas eksakto ang “mga hayop” kaysa “mababangis na hayop,” sapagkat hindi tahasang sinasabi ng Hebreo na mailap o mabangis ang mga ito.
- source_word: וְאֵין מַחֲרִיד
  choice: at walang magtataboy sa mga iyon
  rationale: Ang Hiphil na anyo ng חרד ay may diwang manakot o magpanginig. Sa konteksto, walang taong mananakot upang maitaboy ang mga ibon at hayop; natural na ipinahahayag sa Filipino ang praktikal na resulta bilang “magtataboy.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at tuwiran. Pinanatili ang mabigat at mapanghamak na tono ng sumpa sa pamamagitan ng “bangkay,” ngunit hindi dinagdagan ang Hebreo ng ideyang “mababangis” na wala naman sa mismong salita. Ginamit ang “himpapawid” upang mapanatili ang pares na himpapawid-lupa nang hindi malito sa teolohikal na kahulugan ng “langit.”
