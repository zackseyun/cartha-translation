base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/059.yaml
  text: then Yahweh will make your plagues and the plagues of your offspring extraordinary—great and lasting plagues[b][a], and severe and lasting sicknesses.
translation:
  language: tl
  text: Gagawing pambihira[a] ni Yahweh ang iyong mga salot at ang mga salot ng iyong mga supling—matitindi at nagtatagal[b] na mga salot, at malulubha at nagtatagal na mga karamdaman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kataka-taka.” Ang pandiwang Hebreo ay maaaring mangahulugang gawing di-pangkaraniwan o kapansin-pansin ang isang bagay; dito, inilalarawan nito ang pambihirang tindi ng hatol.
    reason: lexical_alternative
  - marker: b
    text: Ang “nagtatagal” ay salin ng salitang Hebreo na nangangahulugang matatag, namamalagi, o nagpapatuloy. Iisang salita ang ginamit para sa mga salot at sa mga karamdaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָא
  choice: Gagawing pambihira
  rationale: Ang Hiphil ng פלא ay nagpapahiwatig dito na gagawing di-pangkaraniwan o kapansin-pansin ang tindi ng mga salot. Ang “pambihira” ay nagpapanatili sa puwersang ito nang hindi nagbibigay ng positibong himig.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: מַכֹּתְךָ / מַכּוֹת
  choice: mga salot sa iyo / mga salot
  rationale: Maaaring mangahulugan ang מַכָּה ng hampas, dagok, o salot. Sa konteksto ng mga sumpa sa tipan at sa pagkakatambal nito sa mga karamdaman, malinaw at natural ang “mga salot.” Isinalin ang hulaping second-person bilang “sa iyo” upang maiwasan ang di-likas na “mga salot mo.”
- source_word: זַרְעֶךָ
  choice: iyong mga supling
  rationale: Pinananatili ng “mga supling” ang kolektibong diwa ng זֶרַע at nauunawaan ito bilang mga anak o inapo ng kinakausap.
- source_word: גְּדֹלוֹת
  choice: malalaki
  rationale: Pormal nitong pinananatili ang pangunahing diwa ng “dakila/malaki,” na sa kontekstong ito ay tumutukoy sa laki o bigat ng mga salot.
- source_word: נֶאֱמָנוֹת / נֶאֱמָנִים
  choice: nagtatagal
  rationale: Sa kontekstong ito, ang mga anyo mula sa אמן ay nangangahulugang matatag, namamalagi, o nagpapatuloy. Ang “nagtatagal” ay natural at pare-parehong ginamit sa mga salot at mga karamdaman.
- source_word: חֳלָיִם
  choice: mga karamdaman
  rationale: Karaniwang salitang Filipino ito para sa mga sakit at angkop sa marangal ngunit malinaw na rehistro ng talata.
- source_word: רָעִים
  choice: malulubha
  rationale: Bagaman literal na “masasama” o “masama,” inilalarawan dito ng salita ang mapaminsala at matinding uri ng mga karamdaman; natural na ipinahahayag iyon ng “malulubha.”
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang personal na pangalan sa pamamagitan ng malapit na transliterasyon at hindi ito pinapalitan ng titulong “Panginoon.”
- issue: Puwersa ng פלא sa konteksto ng paghatol
  choice: Gagawing pambihira
  alternative: Gagawing kahanga-hanga / kataka-taka
  rationale: Tumutukoy ang pandiwa sa pagiging di-pangkaraniwan o kapansin-pansin ng hatol, hindi sa isang bagay na positibong kahanga-hanga. Hindi nilulutas nang higit sa kailangan ang saklaw ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “nagtatagal” at ang pagtutulad ng mga salot at mga karamdaman. Ginamit ang “sa iyo” upang maging natural ang ugnayan ng salot at ng taong tatamaan nito.
