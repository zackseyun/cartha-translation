base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/049.yaml
  text: Yahweh will raise up against you a nation from far away[a], from the end of the earth[b], as the eagle swoops down—a nation whose language you will not understand.
translation:
  language: tl
  text: Magdadala si Yahweh laban sa iyo ng isang bansang mula sa malayo, mula sa dulo ng daigdig, gaya ng agilang bumubulusok[a]—isang bansang ang wika ay hindi mo mauunawaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gaya ng mabilis na paglipad ng agila.” Ang pandiwang Hebreo ay naglalarawan ng mabilis na paglipad o pagbulusok; ang salitang isinaling “agila” ay maaari ring tumukoy sa malaking buwitre.
    reason: lexical_alternative
  - marker: b
    text: Literal, “hindi mo maririnig ang dila nito”; ang ibig sabihin ay hindi mo mauunawaan ang wikang sinasalita nito.
    reason: idiom
lexical_decisions:
- source_word: יִשָּׂא ... עָלֶיךָ
  choice: Magdadala ... laban sa iyo
  rationale: Ang נָשָׂא ay literal na “magbuhat” o “magdala,” ngunit kasama ng עַל sa kontekstong ito, ipinahihiwatig nito ang pagpaparating ng isang bansang sasalakay. Likas sa modernong Tagalog ang “magdadala laban sa iyo” at pinananatili nito ang tuwirang pagkilos ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang pangalang Yahweh, hindi pinalitan ng titulong “Panginoon,” upang mapanatili ang personal na pangalang nasa tekstong Hebreo.
- source_word: גּוֹי
  choice: bansa
  rationale: Tumutukoy rito sa isang dayuhang bansang darating bilang mananalakay, kaya mas angkop ang “bansa” kaysa sa pangkalahatang “mga tao.”
- source_word: מֵרָחוֹק מִקְצֵה הָאָרֶץ
  choice: mula sa malayo, mula sa dulo ng daigdig
  rationale: Pinananatili ang magkatulad na paglalarawan ng napakalayong pinagmulan. Ang “daigdig” ay angkop sa malawak na heograpikong saklaw ng idyoma.
- source_word: כַּאֲשֶׁר יִדְאֶה הַנֶּשֶׁר
  choice: gaya ng agilang bumubulusok
  rationale: Ipinahihiwatig ng pandiwa ang mabilis na paglipad o pagbulusok. Ang “bumubulusok” ay malinaw at naglalarawan ng bilis at bantang taglay ng paghahambing, habang inilalahad sa talababa ang ibang posibleng pagbasa.
- source_word: לֹא תִשְׁמַע לְשֹׁנוֹ
  choice: hindi mo mauunawaan ang wika
  rationale: Literal itong “hindi mo maririnig ang dila nito,” ngunit ang pandiwang שׁמע ay maaari ring mangahulugang umunawa, at ang “dila” ay metonimiya para sa wika. Ang salin ay naghahatid ng malinaw na diwa sa natural na Tagalog.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon o Jehovah
  rationale: Pangalang pantangi ang יְהוָה sa mismong teksto. Pinananatili ng “Yahweh” ang pangalang tipan nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang “iyo/mo” ayon sa isahang anyo ng Hebreo. Pinanatili ang masidhing larawan ng bansang nagmumula sa napakalayo at mabilis na dumarating.
