base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/043.yaml
  text: The foreigner who is among you will rise higher and higher above you[a], and you will go down lower and lower.
translation:
  language: tl
  text: Ang dayuhang naninirahan sa piling mo[a] ay tataas nang tataas kaysa sa iyo, ngunit ikaw ay bababa nang bababa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “dayuhang residente.” Ang Hebreong גֵּר ay tumutukoy sa isang di-katutubong naninirahan sa loob ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֵּר
  choice: dayuhang naninirahan
  rationale: Ang גֵּר ay hindi lamang sinumang estranghero kundi isang di-katutubong naninirahan sa loob ng pamayanan. Likas at malinaw sa modernong Filipino ang pariralang ito.
- source_word: אֲשֶׁר בְּקִרְבְּךָ
  choice: sa piling mo
  rationale: Ipinahihiwatig ng parirala na ang dayuhan ay naninirahan sa loob ng pamayanan ng Israel; maikli at likas sa Filipino ang 'sa piling mo.'
- source_word: יַעֲלֶה עָלֶיךָ
  choice: tataas ... kaysa sa iyo
  rationale: Metaporikal ang pag-akyat at nagpapakita ng paghigit sa kalagayan o katayuan, nang hindi nililimitahan iyon sa ekonomiya o politika lamang.
- source_word: מַעְלָה מָּעְלָה
  choice: nang tataas
  rationale: Kasama ng pandiwang 'tataas,' ang pag-uulit na 'tataas nang tataas' ay likas na paraang Filipino upang ipahayag ang tuloy-tuloy at tumitinding pag-angat.
- source_word: וְאַתָּה
  choice: ngunit ikaw
  rationale: Bagaman payak na waw ang pang-ugnay, malinaw na pasalungat ang ugnayan ng dalawang sugnay; natural na ipinapahayag ito ng 'ngunit' sa Filipino.
- source_word: תֵרֵד
  choice: bababa
  rationale: Pinananatili nito ang tuwirang metaporikal na kasalungat ng 'tataas.'
- source_word: מַטָּה מָּטָּה
  choice: nang bababa
  rationale: Ang buong pariralang 'bababa nang bababa' ay likas na katumbas ng paulit-ulit na Hebreong pang-abay at mahusay na kaagapay ng 'tataas nang tataas.'
theological_decisions:
- issue: Pagbaligtad ng katayuan sa konteksto ng mga sumpa ng tipan
  choice: Ilarawan ang malawak na pag-angat ng dayuhang naninirahan kaysa sa Israel at ang patuloy na pagbaba ng Israel.
  alternative: Limitahan ang larawan sa pag-unlad sa ekonomiya lamang o sa pangingibabaw sa politika lamang.
  rationale: Sadyang malawak ang metapora ng pagtaas at pagbaba sa Hebreo. Hindi tinutukoy ng talata ang iisang larangan, kaya hindi ito pinakitid ng salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang 'mo/iyo/ikaw' dahil isahan ang anyong Hebreo na tumutukoy sa Israel bilang isang bayan. Pinanatili ang magkatugmang pag-uulit na 'tataas nang tataas' at 'bababa nang bababa.'
