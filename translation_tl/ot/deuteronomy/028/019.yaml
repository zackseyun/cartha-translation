  text: אָר֥וּר אַתָּ֖ה בְּ/בֹאֶ֑/ךָ וְ/אָר֥וּר אַתָּ֖ה בְּ/צֵאתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/019.yaml
  text: Cursed shall you be when you come in[a], and cursed shall you be when you go out.
translation:
  language: tl
  text: Isinumpa ka sa iyong pagpasok[a], at isinumpa ka sa iyong paglabas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “sa iyong pagpasok … sa iyong paglabas,” isang Hebreong idyoma na sumasaklaw sa buong takbo ng pang-araw-araw na buhay.
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: isinumpa
  rationale: Ang anyong Hebreo ay nangangahulugang nasa ilalim ng sumpa. Ang “isinumpa” ay natural at taimtim sa Filipino at angkop sa pormula ng mga sumpa sa tipan.
- source_word: אַתָּה
  choice: ka
  rationale: Ikalawang panauhang panlalaking isahan ang Hebreo. Ang “ka” ang natural na tuwirang pagtukoy sa Filipino; nauunawaan sa konteksto na ang Israel ay kinakausap bilang isang kabuuan.
- source_word: בְּבֹאֶךָ
  choice: sa iyong pagpasok
  rationale: Literal na tumutukoy sa ‘sa iyong pagpasok.’ Pinananatili ng nominal na anyo ang balanseng parirala at ang idyomatikong tambalan nito sa ‘paglabas.’
- source_word: וְ
  choice: at
  rationale: Payak na pangatnig na nag-uugnay sa magkatimbang na mga sugnay.
- source_word: בְּצֵאתֶךָ
  choice: sa iyong paglabas
  rationale: Literal na tumutukoy sa ‘sa iyong paglabas.’ Pinananatili nito ang magkatambal na Hebreong pahayag na sumasaklaw sa buong takbo ng pang-araw-araw na buhay.
theological_decisions:
- issue: Pagpapanatili sa diin at kataimtiman ng pormula ng sumpa sa tipan
  choice: Isinumpa ka sa iyong pagpasok, at isinumpa ka sa iyong paglabas.
  alternative: Susumpain ka kapag pumapasok ka, at susumpain ka kapag lumalabas ka.
  rationale: Nauuna sa bawat sugnay ang אָרוּר (‘isinumpa’) at inilalarawan nito ang kalagayan ng taong nasa ilalim ng sumpa, hindi lamang isang di-tiyak na pagkilos sa hinaharap. Pinananatili ng napiling salin ang pag-uulit, diin, at pormal na ritmo nang hindi nagdaragdag ng partikular na paliwanag tungkol sa tagaganap ng sumpa.
translation_notes:
  register: Makabagong Filipino na malinaw ngunit taimtim. Pinanatili ang maikli, magkatimbang, at paulit-ulit na balangkas ng Hebreo; iniwasan ang mas kolokyal na ‘pag-uwi at pag-alis’ dahil mas makitid iyon kaysa sa orihinal na idyoma.
