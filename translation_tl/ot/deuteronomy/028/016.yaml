  yaml_path: translation/ot/deuteronomy/028/016.yaml
  text: Cursed are you in the city[a], and cursed are you in the field.
translation:
  language: tl
  text: Isinumpa ka sa lungsod, at isinumpa ka sa bukid.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: sumpain
  rationale: Ang passive participle ay predikatibong pahayag ng kalagayan sa ilalim ng sumpa sa pormula ng mga parusang tipan. Ang “sumpain ka” ay tuwiran, maigsi, at likas na katumbas sa Filipino.
- source_word: אַתָּה
  choice: ka
  rationale: Pinananatili ng panghalip na ikalawang panauhang panlalaki isahan ang tuwirang pagtukoy sa kausap; likas itong ikabit sa panaguring “sumpain.”
- source_word: בָּעִיר
  choice: sa lungsod
  rationale: Ang בְּ ay tumutukoy sa kinaroroonan, at ang “sa lungsod” ay tuwirang kaibahan ng “sa bukid.”
- source_word: וְ
  choice: at
  rationale: Payak na pangatnig ito na nag-uugnay sa magkatimbang at pinagsama-samang mga sugnay.
- source_word: בַּשָּׂדֶה
  choice: sa bukid
  rationale: Ang שָׂדֶה ay bukid o lupang sakahan. Pinananatili ng “sa bukid” ang kongkretong kaibahan sa lungsod at ang saklaw sa karaniwang buhay sa lunsod at kanayunan.
theological_decisions:
- issue: Pormula ng sumpa sa tipan at ang puwersa nito
  choice: Panatilihin ang tuwirang deklarasyong “Sumpain ka...” sa dalawang sugnay.
  alternative: “Susumpain ka...” o “Nawa'y sumpain ka...”
  rationale: Walang tahasang pandiwang panghinaharap o anyong nagpapahayag ng kahilingan sa Hebreo. Ang inuulit na passive participle at panghalip ay isang tuwirang predikatibong deklarasyon, kaya hindi ito ginawang hula lamang o hangarin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang simetrikong pag-uulit upang mapanatili ang diin at pormal na balanse ng Hebreo. Walang talababa dahil ang “sumpain ka” ay malinaw na naghahatid ng kalagayang nasa ilalim ng sumpa, at hindi kailangan ang hindi likas na alternatibong “nasa ilalim ka ng sumpa.”
