base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/021.yaml
  text: Yahweh will make the plague cling to you until he has wiped you out from the land that you are entering to possess[a][b].
translation:
  language: tl
  text: Gagawin ni Yahweh na kumapit sa iyo ang salot hanggang sa tuluyan ka niyang lipulin mula sa lupaing papasukin mo upang angkinin ito[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakamamatay na epidemya.” Ang salitang Hebreo ay maaaring tumukoy sa isang nakamamatay na sakit na lumalaganap bilang hatol.
    reason: lexical_alternative
  - marker: b
    text: O “hanggang sa tuluyan ka nitong lipulin,” kung ang “salot” ang ipinahihiwatig na simuno ng sugnay.
    reason: alternative_reading
lexical_decisions:
- source_word: יַדְבֵּק
  choice: Gagawin ... na kumapit
  rationale: Pinananatili nito ang causative na diwa ng Hiphil—‘gagawing kumapit’—at ang malinaw na larawan ng salot na ayaw humiwalay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos ayon sa Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בְּךָ
  choice: sa iyo
  rationale: Likas itong katambal ng ‘kumapit’ sa makabagong Tagalog at nagpapahayag ng mahigpit na pagkakadikit.
- source_word: הַדָּבֶר
  choice: ang salot
  rationale: Sa konteksto ng mga sumpa ng tipan, tumutukoy ang salita sa nakamamatay na sakit o epidemya. Ang ‘salot’ ay maikli, matindi, at madaling maunawaan.
- source_word: עַד כַּלֹּתוֹ אֹתְךָ
  choice: hanggang sa tuluyan ka niyang lipulin
  rationale: Ipinahahayag ng ‘tuluyan’ ang ganap na pag-ubos na taglay ng כלה, samantalang ang ‘niyang’ ay kumukuha kay Yahweh bilang likas na ipinahihiwatig na simuno; inilalahad sa talababa ang posibleng pag-unawa na ang salot ang simuno.
- source_word: מֵעַל הָאֲדָמָה
  choice: mula sa lupain
  rationale: Bagaman maaaring mangahulugang lupa o sukal ang אֲדָמָה, ang konteksto ay ang teritoryong papasukin at aangkinin ng Israel.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: na papasukin mo
  rationale: Natural na isinasalin nito ang Hebreong idyoma ng pagpunta roon o pagpasok sa lupain.
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin
  rationale: Ipinapahayag nito ang pagkuha at pagtataglay sa lupain sa konteksto ng tipan, nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Kahulugan ng דֶּבֶר bilang sakit sa sumpa ng tipan
  choice: ang salot
  alternative: ang nakamamatay na epidemya
  rationale: Sapat na ipinahahayag ng ‘salot’ ang isang malubha at nakamamatay na paglaganap ng sakit bilang hatol, habang iniiwasang gawing higit na tiyak ang termino kaysa sa Hebreo.
- issue: Simuno ng כַּלֹּתוֹ sa kasunod na sugnay
  choice: hanggang sa tuluyan ka niyang lipulin
  alternative: hanggang sa tuluyan ka nitong lipulin
  rationale: Pinakanatural na kunin si Yahweh, ang simuno ng pangunahing sugnay, bilang ipinahihiwatig na simuno. Gayunman, tunay na posible sa balarila at daloy na ang salot ang simuno, kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matingkad na larawang ‘kumapit’ at ang ganap na diwa ng paglipol, habang inilalahad sa talababa ang tunay na leksikal at sintaktikong mga alternatibo.
