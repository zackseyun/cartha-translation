  source_fidelity: 'Ang pangunahing diwa ay wasto: ang buhay ay nasa kalagayang walang katiyakan, may takot nang gabi at araw, at walang tiwala o kasiguruhan sa pagpapatuloy ng buhay. Gayunman, ang "mabibitin" ay mas madaling unawain bilang isang pangyayaring mangyayari o isang bagay na hindi matatapos, samantalang ang passive participle na תְּלֻאִים ay naglalarawan ng buhay na nakabitin o suspendido. Ang "nakabitin" ay mas tuwirang tumutugma at pinananatili ang larawan.'
  naturalness: Natural at marangal ang karamihan ng salin. Mas idiomatiko at malinaw sa modernong Tagalog ang "nakabitin" sa "mabibitin" sa metaporang ito. Ang "gabi’t araw" ay natural at wastong pinananatili ang ayos ng Hebreo.
  terminology: Wasto ang "buhay," "matatakot," at "makatitiyak." Walang isyung teolohikal. Ang talababa b ay inayos upang ang alternatibong "magtiwala" ay tumukoy sa patuloy na buhay, sa halip na magmungkahi ng pag-iingat o pagtitiwala ng buhay sa ibang tao.
