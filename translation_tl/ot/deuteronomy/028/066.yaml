translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matinding larawang “mabibitin” at ang Hebreong ayos na “gabi’t araw,” habang ginawang idiomatiko ang pangwakas na pahayag tungkol sa kawalan ng katiyakan sa patuloy na buhay.
