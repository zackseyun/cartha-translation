  text: Your life will hang in doubt before you[a]; you will fear night and day[b], and you will have no assurance of your life.
translation:
  language: tl
  text: Ang buhay mo ay nakabitin sa harap mo[a]; matatakot ka gabi’t araw, at hindi ka makatitiyak sa iyong buhay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ang buhay mo ay nakasabit sa harap mo.” Ang larawang Hebreo ay tungkol sa buhay na nakabitin sa panganib, kaya walang katiyakan kung mabubuhay pa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi ka magkakaroon ng katiyakan tungkol sa iyong buhay” o “hindi ka magtitiwala sa patuloy mong buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֶּיךָ
  choice: ang buhay mo / iyong buhay
  rationale: Bagaman anyong maramihan ang salitang Hebreo, idiomatiko itong tumutukoy sa buhay o patuloy na pag-iral ng isang tao; kaya natural ang isahan sa Tagalog.
- source_word: תְּלֻאִים
  choice: mabibitin
  rationale: Pinananatili nito ang larawan mula sa pandiwang תלה, “magbitin,” kung saan ang buhay ay tila nakabitin at nanganganib, sa halip na tahasang palitan ang larawan ng abstraktong “magiging αlanganin.”
- source_word: לְךָ מִנֶּגֶד
  choice: sa harap mo
  rationale: 'Tuwirang pinananatili ang spatial na larawan ng Hebreo: ang nanganganib na buhay ay waring laging nasa harap ng tao.'
- source_word: וּפָחַדְתָּ
  choice: matatakot ka
  rationale: Payak at tuwirang katumbas ng פחד; ang kasunod na “gabi’t araw” ang nagpapahayag ng walang-tigil na takot.
- source_word: לַיְלָה וְיוֹמָם
  choice: gabi’t araw
  rationale: Pinananatili ang pagkakasunod na “gabi at araw” sa Hebreo at natural itong pakinggan sa modernong Tagalog.
- source_word: לֹא תַאֲמִין בְּחַיֶּיךָ
  choice: hindi ka makatitiyak sa iyong buhay
  rationale: Sa kontekstong ito, ang Hiphil ng אמן ay tumutukoy sa kawalan ng katiyakan o tiwala na magpapatuloy ang sariling buhay, hindi sa paniniwalang teolohikal.
