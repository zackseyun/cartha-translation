lexical_decisions:
- source_word: גּוֹי
  choice: bansa
  rationale: Tumutukoy ito sa isang bayan o pangkat ng mga tao; sa konteksto ng sumpa ng tipan, ang “bansa” ay malinaw na tumutukoy sa dayuhang kapangyarihang mananalakay.
- source_word: עַז פָּנִים
  choice: mabagsik ang mukha
  rationale: Pinananatili nito ang tahasang larawan ng Hebreong pariralang “malakas/mabagsik ang mukha” habang nananatiling likas at mauunawaan sa modernong Filipino.
- source_word: אֲשֶׁר
  choice: na
  rationale: Likas na panandang nag-uugnay sa mga sugnay na naglalarawan sa bansa.
- source_word: לֹא יִשָּׂא פָנִים לְזָקֵן
  choice: hindi gumagalang sa matanda
  rationale: Ang idyomang נָשָׂא פָּנִים, literal na “iangat ang mukha,” ay maaaring mangahulugang magpakita ng pabor o pagpapahalaga. Sa kaugnayan nito sa matanda, malinaw na naipahahayag ng “gumagalang” ang diwa.
- source_word: זָקֵן
  choice: matanda
  rationale: Ang pang-isahang anyo ay ginagamit bilang pangkalahatang katawagan; hindi nito kailangang tukuyin ang kasarian.
- source_word: וְנַעַר
  choice: bata
  rationale: Maaaring tumukoy ang נַעַר sa bata, kabataan, o binata. Bilang katapat ng “matanda,” natural ang “bata,” bagaman nananatiling posible ang “kabataan.”
- source_word: לֹא יָחֹן
  choice: hindi nagpapakita ng awa
  rationale: Ang חנן ay nangangahulugang magpakita ng biyaya, pabor, o habag. Sa marahas na konteksto ng isang mananalakay at kaugnay ng bata, natural na naihahatid ng “awa” ang diwa nang hindi inaalis ang alternatibong “pabor.”
