  naturalness: Likas at marangal ang “isang bansang mabagsik ang mukha” at ang magkatapat na “matanda” at “bata.” Mas malinaw at mas malapit sa Hebreo ang magkatulad na estrukturang “hindi gumagalang ... at hindi nagpapakita ng pabor.”
