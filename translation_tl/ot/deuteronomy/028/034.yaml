  text: And you will be driven mad by the sight your eyes see[a].
translation:
  language: tl
  text: At masisiraan ka ng bait dahil sa makikita ng iyong mga mata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “At magiging baliw ka dahil sa tanawing makikita ng iyong mga mata.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: At masisiraan ka
  rationale: Sa sunod-sunod na sumpa, ang anyong pandiwa ay may hinaharap at resultang diwa. Likas sa Filipino ang “masisiraan ka ng bait” bilang paglalarawan ng kalagayang sasapitin.
- source_word: מְשֻׁגָּע
  choice: masisiraan ka ng bait
  rationale: Ipinahihiwatig ng anyo ang pagkalugmok sa pagkabaliw bilang bunga ng nakikita. Natural at dignified ang pariralang ito, at hindi kasing-klinikal ng “magiging baliw.”
- source_word: מִמַּרְאֵה
  choice: dahil sa makikita
  rationale: 'Ang מִן ay sanhi rito: ang nakikitang tanawin ang dahilan ng pagkawala ng katinuan. Malinaw na ipinahahayag ng “dahil sa” ang ugnayang ito.'
- source_word: עֵינֶיךָ
  choice: ng iyong mga mata
  rationale: Pinananatili ang kongkretong pagtukoy sa mga mata at ang mariing wikang pandama ng Hebreo.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: makikita ng iyong mga mata
  rationale: Pinagsasama sa natural na ayos-Filipino ang relatibong sugnay at ang panghinaharap na diwa, habang pinananatili ang pag-uulit ng konsepto ng pagtingin.
