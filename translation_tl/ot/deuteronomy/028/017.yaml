  text: Cursed shall be your basket and your kneading bowl[a].
translation:
  language: tl
  text: Susumpain ang iyong basket at ang iyong masahan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sisidlang pinagmamasahan ng masa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Susumpain
  rationale: Ang pasibong participle ay isang pormula ng sumpa. Natural sa makabagong Tagalog ang panghinaharap na pasibong anyo, at umaayon ito sa sunod-sunod na pahayag ng mga sumpa sa tipan.
- source_word: טַנְאֲךָ
  choice: ang iyong basket
  rationale: Tumutukoy ang טַנֶּא sa isang basket, madalas na sisidlan ng inaning bunga. Pinananatili ng “basket” ang malawak na kahulugan nang hindi tinutukoy nang higit sa sinasabi ng Hebreo ang laman nito.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: at ang iyong masahan
  rationale: Tumutukoy ang מִשְׁאֶרֶת sa sisidlang ginagamit sa pagmamasa ng masa. Ang “masahan” ay maikli at likas na katawagang Tagalog para sa sisidlan o lugar na pinagmamasahan, habang nililinaw ng talababa ang gamit nito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iyong” upang mapanatili ang isahang ikalawang panauhan ng Hebreo at ang pormal na himig ng pahayag ng sumpa.
