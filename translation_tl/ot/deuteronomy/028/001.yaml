  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/נְתָ֨נְ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עֶלְי֔וֹן עַ֖ל כָּל גּוֹיֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/001.yaml
  text: And it shall be[a], if you diligently obey the voice of Yahweh your God, being careful to do all his commandments that I am commanding you today, then Yahweh your God will set you high above all the nations of the earth.
translation:
  language: tl
  text: 'At mangyayari ito: kung talagang susundin mo[a] ang tinig ni Yahweh na iyong Diyos, at maingat mong tutuparin ang lahat ng kanyang mga utos na iniuutos ko sa iyo ngayon, itataas ka ni Yahweh na iyong Diyos nang higit sa lahat ng bansa sa lupa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “kung sa pakikinig ay pakikinggan mo ang tinig ni Yahweh na iyong Diyos”; ang pag-uulit ng pandiwang “makinig” ay isang idyomang nagbibigay-diin sa masigasig at masunuring pakikinig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: At mangyayari
  rationale: Pinananatili ang pormulang nagpapakilala sa magiging bunga ng kondisyon, sa natural ngunit marangal na Tagalog.
- source_word: אִם שָׁמוֹעַ תִּשְׁמַע
  choice: kung talagang susundin mo
  rationale: Ang infinitive absolute na kasama ng finite verb ay nagbibigay-diin sa kilos; ipinahahayag ng “talagang” ang diin, at ng “susundin” ang diwa ng pakikinig na humahantong sa pagsunod.
- source_word: בְּקוֹל
  choice: ang tinig
  rationale: Pinananatili ang literal na larawang “tinig” at ang Hebreong idyoma ng pagsunod sa tinig ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na nasa Hebreong teksto.
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: Pinananatili ang tuwirang personal at pangtipang kaugnayan ng Diyos sa kausap.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: iingatan mong gawin
  rationale: Sinasalamin ang dalawang ideya ng maingat na pagtupad at aktuwal na paggawa, nang hindi nagiging mabigat sa Tagalog.
- source_word: כָּל מִצְוֺתָיו
  choice: ang lahat ng utos niya
  rationale: Natural sa modernong Tagalog habang pinananatili ang kabuuan at legal-pangtipang diwa ng mga utos.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: na iniuutos ko sa iyo ngayon
  rationale: Ang aspektong nagaganap ng “iniuutos” ay angkop sa kasalukuyang pahayag ni Moises.
- source_word: וּנְתָנְךָ ... עֶלְיוֹן
  choice: itataas ka ... nang higit
  rationale: Sa konteksto, ang נתן kasama ng עֶלְיוֹן ay tumutukoy sa paglalagay sa mataas na katayuan, hindi lamang sa pagbibigay.
- source_word: עַל כָּל גּוֹיֵי הָאָרֶץ
  choice: nang higit sa lahat ng bansa sa lupa
  rationale: Ipinahahayag ang paghahambing sa lahat ng mga bansa; ang “lupa” ay mas malawak kaysa sa isang lokal na lupain.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo ang nasa Hebreo; pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalang pangtipan nang hindi ito pinapalitan ng isang titulo.
- issue: 'Idyoma ng pangtipang pakikinig at pagsunod: שָׁמוֹעַ תִּשְׁמַע בְּקוֹל'
  choice: talagang susundin mo ang tinig
  alternative: makikinig kang mabuti sa tinig / tiyak na susunod ka
  rationale: 'Pinagsasama ng salin ang pandinig at pagsunod: ang “susundin” ay naghahayag ng hinihinging pagsunod, samantalang ang “tinig” ay nagpapanatili sa larawan ng orihinal. Ang “talagang” ay kumakatawan sa diin ng Hebreong konstruksyon.'
- issue: Kondisyon at bunga sa tipan
  choice: kung ... itataas ka
  alternative: kapag ... itataas ka
  rationale: Ang אִם ay tahasang kondisyonal na “kung.” Hindi ito ginawang awtomatikong pangako; nananatiling nakaugnay ang ipinahayag na pagtaas sa masikap na pagsunod.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pangtipang katawagang “tinig” at ang banal na pangalang “Yahweh,” habang iniwasan ang sobrang literal na ayos na magiging asiwa sa Tagalog.
