base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/005.yaml
  text: So know in your heart that[a], just as a man disciplines his son, Yahweh your God disciplines you.
translation:
  language: tl
  text: 'Kaya isapuso mo ito: kung paanong dinidisiplina[a] ng isang lalaki ang anak niyang lalaki, gayon ka rin dinidisiplina ni Yahweh na iyong Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinarurusahan upang ituwid” o “itinutuwid”; maaaring saklawin ng pandiwang Hebreo ang kaparusahang nagtutuwid at ang pagtuturong humuhubog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ עִם לְבָבֶךָ
  choice: Kaya isapuso mo ito
  rationale: Ipinahahayag ng parirala ang panloob at taimtim na pagkilala. Likas sa makabagong Tagalog ang “isapuso” at naipananatili nito ang puwersang parang panghihikayat ng anyong Hebreo.
- source_word: כַּאֲשֶׁר
  choice: kung paanong ... gayon
  rationale: Malinaw na ipinakikita ng magkatugmang parirala ang paghahambing sa pagdidisiplina ng tao at ng Diyos.
- source_word: יְיַסֵּר / מְיַסְּרֶךָּ
  choice: dinidisiplina
  rationale: Saklaw nito ang pagtutuwid, pagpaparusa, at paghubog. Inulit ang iisang salita sa dalawang sugnay upang mapanatili ang pag-uulit sa Hebreo.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tiyak na panlalaki ang pangngalan sa Hebreo; hindi ito pinalitan ng “ama,” bagaman ipinahihiwatig ng kasunod na “anak niyang lalaki” ang ugnayang pang-ama.
- source_word: בְּנוֹ
  choice: anak niyang lalaki
  rationale: Ang Hebreo ay tumutukoy nang tiyak sa anak na lalaki, hindi lamang sa anak sa pangkalahatan.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang tipanang katawagang “iyong Diyos.”
theological_decisions:
- issue: Kalikasan ng pagdidisiplina ng Diyos
  choice: dinidisiplina
  alternative: pinarurusahan upang ituwid; itinutuwid
  rationale: Hindi nililimitahan ng salin ang kilos sa pagpaparusa lamang o sa simpleng pagtuturo lamang; pinananatili nito ang kapuwa nagtutuwid at humuhubog na mga diwa ng ugat na יסר.
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Direktang ginagamit ng talata ang Tetragrammaton, kaya pinananatili ang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “isapuso mo ito” bilang likas na katumbas ng idyomang tumutukoy sa panloob na pagkilala, at pinanatili ang paghahambing at pag-uulit ng pangunahing pandiwa.
