  text: at sasabihin mo sa iyong puso, “Ang kapangyarihan ko at ang lakas ng aking kamay ang nagdulot sa akin ng kayamanang ito[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasaganaang ito.” Ang salitang Hebreo na חַיִל ay maaaring tumukoy sa kayamanan, mga ari-arian, lakas, o kakayahan ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: at sabihin mo
  rationale: Sa konteksto ng babala, ang anyong ito ay tumutukoy sa maaaring sabihin ng kausap. Ang “at sabihin mo” ay tuwiran at umaayon sa daloy ng naunang mga babala.
- source_word: בִּלְבָבֶךָ
  choice: sa iyong puso
  rationale: Pinananatili nito ang Hebreong talinghaga para sa panloob na pag-iisip o pagsasabi sa sarili, at likas pa rin itong nauunawaan sa Filipino.
- source_word: כֹּחִי
  choice: ang kapangyarihan ko
  rationale: Ipinahahayag ng כֹּחַ ang lakas, kakayahan, o kapangyarihan. Naiiba ito nang sapat sa kasunod na “lakas ng aking kamay” habang pinananatili ang diin sa sariling kakayahan.
- source_word: וְעֹצֶם יָדִי
  choice: at ang lakas ng aking kamay
  rationale: Pinananatili ang konkretong larawan ng kamay bilang sagisag ng sariling puwersa at kakayahang kumilos.
- source_word: עָשָׂה לִי
  choice: ang nagkamit para sa akin
  rationale: Bagaman literal na “gumawa para sa akin,” sa kontekstong ito ay tumutukoy ito sa pagtatamo o pagkakaroon ng yaman. Ang pang-isahang “ang nagkamit” ay natural dahil maaaring ituring na pinagsamang sanhi ang kapangyarihan at lakas ng kamay.
- source_word: הַחַיִל הַזֶּה
  choice: ng kayamanang ito
  rationale: Sa konteksto ng Deuteronomio 8, ang חַיִל ay tumutukoy lalo na sa materyal na yaman o kasaganaan, bagaman mas malawak ang saklaw ng salita; kaya nilagyan ito ng talababa.
theological_decisions:
- issue: Kahulugan ng חַיִל sa babala ng tipan
  choice: kayamanan
  alternative: kasaganaan; lakas o kakayahan
  rationale: Ang agarang konteksto ay pagkain, mabubuting bahay, dumaming kawan, pilak, at ginto. Kaya “kayamanan” ang pinakamalinaw na pangunahing salin, habang kinikilala sa talababa ang mas malawak na saklaw ng Hebreo.
translation_notes:
  register: Makabago at marangal na Filipino; pinanatili ang idyomang “sa iyong puso” at ang konkretong larawang “lakas ng aking kamay.”
