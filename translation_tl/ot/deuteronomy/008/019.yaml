  text: וְ/הָיָ֗ה אִם שָׁכֹ֤חַ תִּשְׁכַּח֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָֽלַכְתָּ֗ אַחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/עֲבַדְתָּ֖/ם וְ/הִשְׁתַּחֲוִ֣יתָ לָ/הֶ֑ם הַעִדֹ֤תִי בָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵדֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/019.yaml
  text: And if you indeed forget Yahweh your God and go after other gods and serve them and bow down to them[a], I testify against you today that you will surely perish.
translation:
  language: tl
  text: At kung talagang lilimutin mo si Yahweh na iyong Diyos, at susunod ka sa ibang mga diyos, maglilingkod sa kanila, at yuyukod sa kanila, sumasaksi ako laban sa inyo ngayon na tiyak na malilipol kayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang “lilimutin” at “malilipol” ay kapuwa may kasamang anyong pawatas na nagpapadiin sa kilos; ipinahihiwatig nito ang “talagang lilimutin” at “tiyak na malilipol.”
    reason: Ipinaliliwanag ang dalawang emphatic infinitive-absolute construction at ang paglipat mula isahang kausap tungo sa maramihang hatol sa pangunahing teksto.
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: At kung
  rationale: Likas na panimula ng pasubaling babala sa Filipino at pinananatili ang daloy mula sa naunang talata.
- source_word: שָׁכֹחַ תִּשְׁכַּח
  choice: talagang lilimutin mo
  rationale: Ipinahahayag ng pawatas na absolutong kasunod ng pandiwa ang diin; ang “talagang” ay malinaw ngunit hindi nagdaragdag ng ideyang “lubusan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na יהוה.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang ikalawang panauhang isahan at ang ugnayang tipan sa kausap.
- source_word: וְהָלַכְתָּ אַחֲרֵי
  choice: at susunod ka sa
  rationale: Likas na Filipino para sa idyomang tumutukoy sa pagsunod at pagbibigay-katapatan.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Direktang salin ng pangngalan at pang-uring “iba,” nang hindi ipinapalagay na “dayuhan.”
- source_word: וַעֲבַדְתָּם
  choice: maglilingkod sa kanila
  rationale: Pinananatili ang kahulugan ng עבד na “maglingkod” at ang pagkakaiba nito sa kasunod na kilos ng pagyukod.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: at yuyukod sa kanila
  rationale: Ipinananatili ang pisikal at panrelihiyong diwa ng pagpapatirapa o pagyukod bilang pagpupugay.
- source_word: הַעִדֹתִי בָכֶם הַיּוֹם
  choice: pinatotohanan ko laban sa inyo ngayon
  rationale: Pinananatili ang legal at mapanghatol na lakas ng Hiphil ng עוד at ng בכם; hindi ito pinahihinang maging payak na “binabalaan.”
- source_word: כִּי אָבֹד תֹּאבֵדוּן
  choice: na tiyak na malilipol kayo
  rationale: Ang pawatas na absolutong kasama ng di-ganap na pandiwa ay nagbibigay ng matinding katiyakan; ang “malilipol” ay natural na Filipino para sa tiyak na pagkahamak o pagkawala.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Pagpapanatili ng paglipat mula isahan tungo sa maramihan
  choice: “mo/ka” sa mga gawa, ngunit “inyo/kayo” sa patotoo at hatol
  alternative: Gawing pare-parehong isahan o maramihan ang buong talata
  rationale: Ang Hebreo ay tunay na lumilipat mula sa ikalawang panauhang panlalaking isahan tungo sa maramihan. Pinananatili ito upang huwag burahin ang kolektibo at indibidwal na tensiyon sa pakikipag-usap sa Israel.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang “Yahweh,” ang pagkakaiba ng paglilingkod at pagyukod, ang legal na himig ng patotoo laban sa bayan, at ang paglipat ng Hebreo mula isahang “mo/ka” tungo sa maramihang “inyo/kayo.”
