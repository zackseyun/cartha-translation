  text: a land in which you will not eat bread in poverty[a], in which you will lack nothing; a land whose stones are iron[b], and from whose hills you will quarry copper.
translation:
  language: tl
  text: Isang lupain kung saan hindi ka kakain ng tinapay sa paghihikahos[a] at hindi ka magkukulang ng anuman; isang lupain na ang mga bato nito ay bakal, at mula sa mga burol nito ay magmimina ka ng tanso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa karalitaan” o “sa kakapusan.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaaring mangahulugang “tanso” o “bronse.” Mas pinili rito ang “tanso” dahil materyal na kinukuha mula sa mga burol ang tinutukoy, samantalang ang bronse ay haluang metal.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְמִסְכֵּנֻת
  choice: sa paghihikahos
  rationale: Tumutukoy ang pangngalan sa karalitaan, kakapusan, o kalagayang salat. Likas sa modernong Tagalog ang “sa paghihikahos” at pinananatili nito ang larawan ng pagkain sa ilalim ng matinding kakulangan nang hindi inuulit lamang ang kasunod na sugnay.
- source_word: לֶחֶם
  choice: tinapay
  rationale: Pinanatili ang pangunahing kongkretong kahulugan na “tinapay,” sa halip na palawakin agad bilang “pagkain.”
- source_word: תֶחְסַר כֹּל
  choice: hindi ka magkukulang ng anuman
  rationale: Likas na idyomang Tagalog ito na naghahatid ng ganap na kasapatan at ng sumasaklaw na diwa ng כֹּל.
- source_word: אֲבָנֶיהָ בַרְזֶל
  choice: ang mga bato ay bakal
  rationale: Pinananatili ang maikli at matingkad na pagkakabuo ng Hebreo, “ang mga bato nito [ay] bakal,” sa halip na tahasang ipaliwanag na ang mga bato ay may lamang mineral na bakal.
- source_word: תַּחְצֹב
  choice: magmimina
  rationale: Ang pandiwa ay nangangahulugang tumibag o kumuha sa pamamagitan ng paghuhukay. Sa konteksto ng tansong kinukuha mula sa mga burol, “magmimina” ang pinakamalinaw at likas na katumbas sa kasalukuyang Tagalog.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Maaaring tumukoy ang salita sa copper o bronze. Dito, likas na yamang kinukuha mula sa mga burol ang tinutukoy, kaya mas wasto ang “tanso” bilang likas na metal kaysa bronze na isang haluang metal.
