  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong “tinapay” at ang matalinghagang pahayag na “ang mga bato ay bakal,” habang ginamit ang karaniwang “magmimina” upang madaling maunawaan ang pagkuha ng tanso mula sa mga burol.
