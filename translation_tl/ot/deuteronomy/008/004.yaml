translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang isahang “damit” at “paa” upang manatiling malapit sa Hebreo, at pinanatili sa talababa ang leksikal na posibilidad ng “kasuotan” at “nagkapaltos.”
