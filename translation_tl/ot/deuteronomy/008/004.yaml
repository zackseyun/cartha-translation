  source_fidelity: 'Tumpak na naihahatid ng salin ang dalawang pangunahing pahayag sa Hebreo: hindi naluma ang damit habang suot ito, at hindi namaga ang paa sa loob ng tinukoy na apatnapung taon. Napananatili rin ang isahang “paa” at ang demonstratibong “itong” panahon nang hindi nagiging di-natural sa Tagalog.'
