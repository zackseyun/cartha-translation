base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/004.yaml
  text: Your clothing did not wear out on you[a], and your foot did not swell[b], these forty years.
translation:
  language: tl
  text: Hindi naluma ang damit mo habang suot mo[a], at hindi namaga ang paa mo[b] sa loob ng apatnapung taong ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi naluma ang kasuotan mo habang suot mo.”
    reason: lexical_alternative
  - marker: b
    text: O “hindi naging maga ang paa mo”; inuunawa naman ng ilan na mas tiyak itong tumutukoy sa pagkakaroon ng paltos.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְלָתְךָ
  choice: ang damit mo
  rationale: Ang שִׂמְלָה ay tumutukoy sa isang kasuotan o panlabas na damit. Natural sa modernong Tagalog ang kolektibong “damit mo,” habang pinananatili ng “ang” ang anyong isahan ng Hebreo.
- source_word: בָלְתָה
  choice: hindi naluma
  rationale: Ang pandiwang בלה ay nangangahulugang maluma o masira dahil sa paggamit. Ang “hindi naluma” ay maikli, natural, at angkop sa damit.
- source_word: מֵעָלֶיךָ
  choice: habang suot mo
  rationale: Literal itong “mula sa ibabaw mo,” ngunit sa konteksto ay nagsasaad na hindi naluma ang damit samantalang nasa katawan niya. Inihahayag ito nang malinaw at natural ng “habang suot mo.”
- source_word: וְרַגְלְךָ
  choice: at hindi ... ang paa mo
  rationale: Pinanatili ang isahang רֶגֶל bilang “paa mo,” na natural din sa Tagalog bilang pangkalahatang pagtukoy.
- source_word: בָצֵקָה
  choice: namaga
  rationale: Karaniwang nauunawaan ang pandiwa bilang pamamaga o paglobo. Ang “namaga” ang pinakasimple at matatag na salin; ang mas tiyak na “nagkapaltos” ay nananatiling posibleng alternatibo.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: sa loob ng apatnapung taong ito
  rationale: Pinananatili nito kapwa ang tagal na apatnapung taon at ang pantukoy na זֶה sa natural na modernong Tagalog.
