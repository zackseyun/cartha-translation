  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְ/בִלְתִּ֨י שְׁמֹ֤ר מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/011.yaml
  text: Be careful lest you forget Yahweh your God by failing to keep his commandments and his judgments and his statutes[b][a], which I am commanding you today.
translation:
  language: tl
  text: Mag-ingat ka, baka malimutan mo si Yahweh na iyong Diyos sa hindi mo pagtupad[a] sa kanyang mga utos, mga tuntunin, at mga batas na iniuutos ko sa iyo ngayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa pamamagitan ng hindi mo pagtupad” o “anupat hindi mo tinutupad.”'
    reason: Pinahihintulutan ng לְבִלְתִּי שְׁמֹר ang bahagyang magkakaibang pag-unawa sa ugnayan ng paglimot at hindi pagtupad.
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Mag-ingat ka
  rationale: Ang Niphal imperative ay isang tuwirang pormula ng babala. Likas sa makabagong Tagalog ang “Mag-ingat ka” at napapanatili nito ang isahang kausap.
- source_word: פֶּן תִּשְׁכַּח
  choice: baka malimutan mo
  rationale: Ipinahahayag ng פֶּן ang panganib na dapat iwasan; malinaw at natural itong naihahatid ng “baka” kasunod ng pandiwa.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: si Yahweh na iyong Diyos
  rationale: Pinananatili ang personal na pangalang banal na יְהוָה bilang “Yahweh,” at ang pariralang “iyong Diyos” ay naghahatid ng kaugnayang tipan at ng ikalawang panauhang isahan.
- source_word: לְבִלְתִּי שְׁמֹר
  choice: sa hindi mo pagtupad
  rationale: Pinananatili nito ang pagkakaugnay ng paglimot kay Yahweh at ng hindi pagtupad sa kanyang mga hinihingi, nang hindi ginagawang hiwalay na utos ang infinitive construction.
- source_word: מִצְוֺתָיו וּמִשְׁפָּטָיו וְחֻקֹּתָיו
  choice: kanyang mga utos, mga tuntunin, at mga batas
  rationale: Ang tatlong magkakaugnay na terminong legal at pangtipan ay pinananatiling tatlo. Ang “utos,” “tuntunin,” at “batas” ay malinaw sa karaniwang mambabasa at sapat na naiiba nang hindi labis na teknikal.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: na iniuutos ko sa iyo ngayon
  rationale: Ang aspektong nagpapatuloy ng participle ay natural na ipinahahayag ng “iniuutos,” habang pinananatili ng “ngayon” ang agarang diin ng pananalita ni Moises.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya ginamit ang transliterasyong “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Ugnayan ng paglimot at hindi pagtupad
  choice: sa hindi mo pagtupad
  alternative: sa pamamagitan ng hindi mo pagtupad / anupat hindi mo tinutupad
  rationale: Maaaring unawain ang infinitive construction bilang paraan o kongkretong pagpapakita ng paglimot. Pinili ang maikli at medyo pormal na anyo upang hindi ito gawing tahasang sanhi lamang o bunga lamang.
translation_notes:
  register: Makabago, marangal, at tuwirang Tagalog. Ginamit ang isahang “ka/mo/iyo” ayon sa Hebreo. Iniwasan ang lubhang teknikal o makalumang mga katawagang legal, ngunit pinanatili ang tatluhang ayos ng mga terminong pangtipan.
