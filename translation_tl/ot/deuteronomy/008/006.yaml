  yaml_path: translation/ot/deuteronomy/008/006.yaml
  text: So you shall keep the commandments of Yahweh your God[b][a], by walking in his ways and by fearing him.
translation:
  language: tl
  text: Kaya[a], sundin mo ang mga utos ni Yahweh na iyong Diyos sa pamamagitan ng paglakad sa kanyang mga daan at ng pagkatakot sa kanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “At sundin mo.” Ang pangatnig sa Hebreo ay maaaring simpleng magdugtong ng pangungusap, ngunit malamang na nagpapahiwatig ito rito ng bunga o kongklusyon mula sa naunang konteksto.
    reason: lexical_alternative
  - marker: b
    text: Ang “pagkatakot sa kanya” ay tumutukoy sa mapitagang takot sa harap ng Diyos; maaari ring isaling “pagpipitagan sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Kaya, sundin mo
  rationale: Ang שׁמר sa konteksto ng tipan ay nangangahulugang sundin o tuparin ang mga utos. Ipinahihiwatig ng “Kaya” ang lohikal na bunga ng naunang konteksto, habang pinananatili ng pautos na anyo ang obligasyong nakatuon sa kausap.
- source_word: מִצְוֺת
  choice: ang mga utos
  rationale: Tumutukoy ang maramihang anyong construct sa mga iniutos na pananagutan ng Israel sa Diyos. Likas at malinaw sa makabagong Tagalog ang “mga utos.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: 'Tahasang ipinapakita ang ikalawang panauhang isahan ng hulaping Hebreo: “iyong Diyos.”'
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: sa pamamagitan ng paglakad sa kanyang mga daan
  rationale: Pinananatili ang metapora ng paglakad sa mga daan ng Diyos at nililinaw na ito ang paraan ng pagsunod sa kanyang mga utos.
- source_word: וּלְיִרְאָה אֹתוֹ
  choice: at ng pagkatakot sa kanya
  rationale: Pinananatili ang lakas ng ירא bilang pagkatakot, hindi lamang paggalang, habang ipinapaliwanag sa talababa ang mapitagang diwa nito sa konteksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng pagkatakot sa Diyos
  choice: pagkatakot sa kanya
  alternative: pagpipitagan sa kanya
  rationale: Hindi pinalalambot ang leksikal at teolohikal na bigat ng ירא. Sa kontekstong ito, ang takot ay may kasamang malalim na pagpipitagan, ngunit nararapat manatili sa pangunahing teksto ang tunay na tensiyon ng salitang “takot.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang biblikal na metapora ng “paglakad sa kanyang mga daan” at ang masidhing salitang “pagkatakot,” habang ginamit ang “sa pamamagitan ng” upang ipakita ang ugnayan ng mga infinitive sa pangunahing utos.
