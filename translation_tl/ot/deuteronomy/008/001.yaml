source:
  edition: WLC
  text: כָּל הַ/מִּצְוָ֗ה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם תִּשְׁמְר֣וּ/ן לַ/עֲשׂ֑וֹת לְמַ֨עַן תִּֽחְי֜וּ/ן וּ/רְבִיתֶ֗ם וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/001.yaml
  text: You shall carefully keep every commandment that I am commanding you today[c][b][a], so that you may live and multiply and enter and possess the land that Yahweh swore to your fathers.
translation:
  language: tl
  text: Maingat ninyong sundin ang buong kautusang[a] iniuutos ko sa inyo ngayon[d], upang mabuhay at dumami kayo, at makapasok at maangkin[b] ninyo ang lupaing ipinangako ni Yahweh nang may panunumpa sa inyong mga ama[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “lahat ng utos.” Isahang kolektibong pananalita ang ginamit sa Hebreo: “ang buong kautusan.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “manahin.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagmamana o sa pag-angkin at pag-aari, ayon sa konteksto.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “inyong mga ama,” na tumutukoy sa mga ninunong patriyarka ng Israel.
    reason: lexical_alternative
  - marker: d
    text: Isahan ang “iyo” sa bahaging ito ng Hebreo, ngunit maramihan ang kasunod na mga pandiwa. Kinakausap ang Israel kapwa bilang isang bayan at bilang maraming tao.
    reason: source_form
lexical_decisions:
- source_word: כָּל הַמִּצְוָה
  choice: ang buong kautusan
  rationale: Pinananatili nito ang isahang kolektibong anyo ng Hebreo habang malinaw na tumutukoy sa kabuuan ng iniuutos. Inilalahad sa talababa ang mas likas ngunit mas distributibong alternatibong “lahat ng utos.”
- source_word: מְצַוְּךָ
  choice: iniuutos ko sa inyo
  rationale: Ang kasalukuyang anyong pandiwari ay angkop na ipinahahayag ng “iniuutos ko.” Ginamit sa pangunahing teksto ang maramihang “sa inyo” para sa likas na Filipino, habang itinatala sa talababa ang paglipat ng Hebreo mula isahan tungo sa maramihan.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: maingat ninyong sundin
  rationale: Pinagsasama ng parirala ang maingat na pag-iingat at aktuwal na pagsasagawa. Ang “maingat ninyong sundin” ay malinaw at likas sa modernong Filipino nang hindi inaalis ang diin sa masusing pagsunod.
- source_word: לְמַעַן
  choice: upang
  rationale: Malinaw na ipinakikita ng “upang” ang layunin o inaasahang bunga ng pagsunod.
- source_word: תִּחְיוּן
  choice: mabuhay kayo
  rationale: Tuwirang ipinahahayag nito ang buhay o patuloy na pananatiling buhay sa konteksto ng tipan.
- source_word: וּרְבִיתֶם
  choice: dumami kayo
  rationale: Tumutukoy ang pandiwa sa pagdami ng bilang ng bayan at pinananatili ang alingawngaw ng mga pangako ng tipan.
- source_word: וּבָאתֶם
  choice: makapasok
  rationale: Ang “makapasok” ay likas sa konteksto ng pagpasok ng Israel sa lupang ipinangako.
- source_word: וִירִשְׁתֶּם
  choice: maangkin
  rationale: Maaaring mangahulugan ang Hebreong pandiwa ng magmana o magkaroon ng pag-aari. Ang “maangkin” ay akma sa pagkuha at pagtataglay sa lupa, habang pinananatili sa talababa ang alternatibong “manahin.”
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Pinananatili ng “lupain” ang heograpiko at pangtipang diwa ng salitang Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalang Yahweh ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: נִשְׁבַּע
  choice: ipinangako ... nang may panunumpa
  rationale: Iniiwasan nito ang salitang Filipino na “isinumpa,” na karaniwang nangangahulugang nilait o kinutya sa pamamagitan ng sumpa. Malinaw na ipinahahayag ng parirala ang taimtim at may-sumpang pangako.
- source_word: אֲבֹתֵיכֶם
  choice: inyong mga ninuno
  rationale: Sa konteksto, tumutukoy ito sa mga ama o patriyarka ng Israel. Ang “mga ninuno” ay natural at malinaw sa Filipino; ipinaliliwanag ng talababa ang literal na pananalita.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Kolektibong isahan sa כָּל הַמִּצְוָה
  choice: ang buong kautusan
  alternative: lahat ng utos o bawat utos
  rationale: Pinananatili ang kolektibong isahan at ang posibilidad na makita ang mga hinihingi ng tipan bilang isang kabuuan, nang hindi itinatanggi ang distributibong pagkaunawa.
- issue: Kahulugan ng וִירִשְׁתֶּם
  choice: maangkin
  alternative: manahin
  rationale: Hindi nililimitahan ang pandiwa sa isang teknikal na konsepto ng mana; ipinakikita ng talababa na kapwa posible ang pagmamana at pag-aari ayon sa konteksto.
- issue: Paglipat mula isahang ikalawang panauhan tungo sa maramihan
  choice: maramihang anyo sa pangunahing teksto, na may talababa tungkol sa Hebreo
  alternative: sa iyo ... ninyo
  rationale: Korporatibong kinakausap ang Israel. Ang maramihan ay natural sa Filipino, ngunit mahalagang huwag ikubli ang kapansin-pansing pagbabago ng bilang sa pinagmulang teksto.
- issue: אֲבֹתֵיכֶם bilang panlalaking katawagang pangkamag-anakan
  choice: mga ninuno, na may literal na paliwanag sa talababa
  alternative: mga ama
  rationale: Ang tinutukoy ay mga ninunong patriyarka ng Israel. Mas malinaw sa karaniwang Filipino ang “mga ninuno,” habang pinananatili sa talababa ang literal na panlalaking anyo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “maingat ninyong sundin” upang likas na pagsamahin ang pag-iingat at pagsasagawa; iniwasan ang “isinumpa” dahil nangangahulugan iyon ng pagkastigo o paglalagay ng sumpa sa karaniwang Filipino. Iningatan sa mga talababa ang kolektibong isahan, ang saklaw ng “maangkin,” at ang pagbabago ng bilang ng ikalawang panauhan.
