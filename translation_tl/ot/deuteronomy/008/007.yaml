base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/007.yaml
  text: For Yahweh your God is bringing you into a good land[a], a land of streams of water, springs[c][b], and depths flowing out in the valley and in the hill country.
translation:
  language: tl
  text: Sapagkat dinadala ka ni Yahweh na iyong Diyos sa isang mabuting lupain—isang lupaing may mga batis[a], mga bukal, at malalalim na tubig[b] na umaagos sa mga lambak at kabundukan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga daluyan ng tubig” o “mga ilog na pana-panahon”; ang salitang Hebreo ay maaaring tumukoy sa batis, rumaragasang agos, o wadi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga kailaliman”; maaaring tumukoy ang Hebreo sa tubig sa ilalim ng lupa o sa malalalim na katubigan.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sa lambak at sa kabundukan”; maaari ring “sa kapatagan at sa mga bundok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang ugnayang nagbibigay-dahilan o paliwanag sa naunang pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa baybay-Filipino ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang ikalawang panauhang isahan at ang karaniwang pananalitang pangtipan.
- source_word: מְבִיאֲךָ
  choice: dinadala ka
  rationale: Ang participle ay naglalarawan ng kasalukuyan o nalalapit na pagkilos; natural itong ipinahahayag sa Filipino bilang nagpapatuloy na kilos.
- source_word: אֶל־אֶרֶץ טוֹבָה
  choice: sa isang mabuting lupain
  rationale: Tuwiran at likas na salin ng patutunguhan at paglalarawan sa lupain.
- source_word: אֶרֶץ נַחֲלֵי מָיִם
  choice: isang lupaing may mga batis
  rationale: Ang נַחֲלֵי ay maaaring tumukoy sa mga batis, agos, o daluyang pana-panahon; malinaw at natural ang “mga batis” sa pangunahing teksto.
- source_word: עֲיָנֹת
  choice: mga bukal
  rationale: Karaniwang modernong Filipino para sa mga likas na pinagmumulan ng tubig.
- source_word: וּתְהֹמֹת
  choice: malalalim na tubig
  rationale: Ipinahahayag ang larawan ng malalim o nasa-ilalim na tubig nang hindi tiyakang nilulutas ang eksaktong heolohikal na tinutukoy.
- source_word: יֹצְאִים
  choice: umaagos
  rationale: Likas na paglalarawan sa paglabas o pagdaloy ng tubig mula sa pinagmumulan.
- source_word: בַּבִּקְעָה וּבָהָר
  choice: sa mga lambak at kabundukan
  rationale: Ginagamit ang kolektibong kahulugan ng dalawang anyong-lupa at pinananatili ang topograpikong paghahambing.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong pangalan sa halip na palitan ng titulo.
- issue: Bilang ng ikalawang panauhan
  choice: ka / iyong
  alternative: kayo / inyong
  rationale: Isahan ang mga hulaping Hebreo, bagaman kolektibong Israel ang kinakausap; pinananatili ng salin ang gramatikal na isahan nang hindi itinatanggi ang kolektibong konteksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “ka/iyong” upang panatilihin ang ikalawang panauhang isahan ng Hebreo. Ang gitling na em dash ay naghihiwalay sa pangkalahatang paglalarawan ng mabuting lupain at sa kasunod na pagpapaliwanag nito.
