base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/016.yaml
  text: who fed you manna in the wilderness[a], which your fathers had not known, in order to humble you and in order to test you[b], to do you good in the end.
translation:
  language: tl
  text: siya na nagpakain sa iyo ng manna sa ilang—pagkaing hindi nakilala ng iyong mga ninuno—upang mapagpakumbaba ka at upang subukin ka, upang sa bandang huli ay gumawa siya ng mabuti para sa iyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּאֲכִלְךָ
  choice: siya na nagpakain sa iyo
  rationale: Ang Hiphil participle na may hulaping 2ms ay nagpapatuloy sa paglalarawan sa Diyos mula sa naunang talata. Pinananatili ng “nagpakain sa iyo” ang causative na diwa sa natural na Tagalog.
- source_word: מָן
  choice: manna
  rationale: Ito ang nakaugaliang transliterasyon sa Tagalog para sa pagkaing ibinigay sa ilang.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay likas at marangal na katumbas ng wilderness o disyertong lupain sa kontekstong biblikal.
- source_word: אֲשֶׁר לֹא יָדְעוּן אֲבֹתֶיךָ
  choice: pagkaing hindi nakilala ng iyong mga ninuno
  rationale: Nililinaw na ang sugnay ay tumutukoy sa manna at ipinahahayag ang pagiging di-pamilyar nito sa mga naunang salinlahi.
- source_word: אֲבֹתֶיךָ
  choice: iyong mga ninuno
  rationale: Bagaman literal na “iyong mga ama,” tumutukoy dito ang salita sa mga naunang salinlahi ng Israel; ang “mga ninuno” ang natural at tumpak na modernong Tagalog.
- source_word: לְמַעַן עַנֹּתְךָ
  choice: upang magpakumbaba ka
  rationale: Sa konteksto ng Deuteronomio 8, ang Piel ng ענה ay pedagogical na pagpapakumbaba sa pamamagitan ng hirap. Ang anyong ito ay natural sa Tagalog at hindi nagmumungkahing Diyos ang pinakumbaba.
- source_word: וּלְמַעַן נַסֹּתֶךָ
  choice: at upang subukin ka
  rationale: Ang נסה ay pagsubok o pagsusuri; malinaw na pinananatili ng “subukin” ang layuning ipinahahayag ng ikalawang לְמַעַן.
- source_word: לְהֵיטִבְךָ
  choice: gawan ka ng mabuti
  rationale: Pinananatili nito ang personal na layon ng Hiphil ng יטב at natural na ipinahahayag ang mapagbuting hangarin.
- source_word: בְּאַחֲרִיתֶךָ
  choice: sa bandang huli
  rationale: Maaaring tumukoy ang אַחֲרִית sa huling kinalabasan o sa panahong darating. Ang “sa bandang huli” ay natural at sadyang hindi nililimitahan kung ito ay temporal lamang o tumutukoy sa pangwakas na kalagayan.
theological_decisions:
- issue: Layunin ng paghihirap sa ilang
  choice: Inilalahad ang pagpapakumbaba at pagsubok bilang mga layunin ng Diyos na humahantong sa kabutihan ng Israel.
  alternative: Basahin ang pagpapakumbaba at pagsubok bilang parusa lamang.
  rationale: Ang dalawang sugnay ng layunin ay humahantong sa לְהֵיטִבְךָ בְּאַחֲרִיתֶךָ. Kaya pinananatili ng salin kapwa ang bigat ng pagpapakumbaba at pagsubok at ang mabuting layunin sa bandang huli.
- issue: Saklaw ng בְּאַחֲרִיתֶךָ
  choice: sa bandang huli
  alternative: sa iyong wakas / sa kinahinatnan mo
  rationale: Hindi tiyak kung ang parirala ay pangunahing temporal o tumutukoy sa pangwakas na kinalabasan. Iniiwasan ng salin ang pagtakda sa isang makitid na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Gumamit ng “sa ilang,” “mga ninuno,” at “sa bandang huli” bilang likas na mga parirala, habang pinananatili ang paulit-ulit na estruktura ng layunin at ang tensiyon sa pagitan ng hirap at kabutihan.
