revisions:
- from: Pinagpakumbaba ka niya, hinayaan kang magutom, at pinakain ka ng manna, na hindi mo pa nakilala at hindi rin nakilala ng iyong mga ninuno, upang ipaalam sa iyo na ang tao[a] ay hindi nabubuhay sa tinapay lamang, kundi ang tao ay nabubuhay sa bawat lumalabas sa bibig ni Yahweh.[b]
  to: Pinagpakumbaba ka niya, ginutom ka niya, at pinakain ka niya ng manna, na hindi mo pa nakilala at hindi rin nakilala ng iyong mga ninuno, upang ipaalam sa iyo na ang tao[a] ay hindi nabubuhay sa tinapay lamang, kundi ang tao ay nabubuhay sa bawat bagay na nagmumula sa bibig ni Yahweh.[b]
