  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יְעַנְּ/ךָ֮ וַ/יַּרְעִבֶ/ךָ֒ וַ/יַּֽאֲכִֽלְ/ךָ֤ אֶת הַ/מָּן֙ אֲשֶׁ֣ר לֹא יָדַ֔עְתָּ וְ/לֹ֥א יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן הוֹדִֽעֲ/ךָ֗ כִּ֠י לֹ֣א עַל הַ/לֶּ֤חֶם לְ/בַדּ/וֹ֙ יִחְיֶ֣ה הָֽ/אָדָ֔ם כִּ֛י עַל כָּל מוֹצָ֥א פִֽי יְהוָ֖ה יִחְיֶ֥ה הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/003.yaml
  text: And he humbled you and let you hunger and fed you the manna[a], which you had not known, nor had your fathers known, so that he might make you know that man does not live by bread alone[b], but man lives by every word that comes from the mouth of Yahweh.
translation:
  language: tl
  text: Pinagpakumbaba ka niya, ginutom ka niya, at pinakain ka niya ng manna, na hindi mo pa nakilala at hindi rin nakilala ng iyong mga ninuno, upang ipaalam sa iyo na ang tao[a] ay hindi nabubuhay sa tinapay lamang, kundi ang tao ay nabubuhay sa bawat bagay na nagmumula sa bibig ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tao” rito ay tumutukoy sa sangkatauhan sa pangkalahatan, hindi lamang sa mga lalaki.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin, “sa bawat salitang nagmumula sa bibig ni Yahweh.” Mas malawak kaysa “salita” lamang ang literal na pananalitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַנְּךָ
  choice: Pinagpakumbaba ka niya
  rationale: Ang piel ng ענה ay maaaring mangahulugang magpakumbaba o magpahirap. Sa konteksto ng pagsubok at pagtuturo sa ilang, malinaw na naihahatid ng “pinagpakumbaba” ang layuning disiplinahin nang hindi pinalalabis ang pisikal na pagdurusa.
- source_word: וַיַּרְעִבֶךָ
  choice: hinayaan kang magutom
  rationale: Causative ang anyo ng pandiwa. Likas sa Filipino ang pariralang ito at pinananatili nito ang pagkilos ng Diyos habang hindi ipinahihiwatig na gutom lamang ang kanyang layunin.
- source_word: וַיַּאֲכִלְךָ אֶת־הַמָּן
  choice: pinakain ka ng manna
  rationale: Ang causative na anyo ng אכל ay natural na naisasalin bilang “pinakain,” at pinananatili ang nakaugaliang katawagang “manna” para sa pagkaing ibinigay sa ilang.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ וְלֹא יָדְעוּן אֲבֹתֶיךָ
  choice: na hindi mo pa nakilala at hindi rin nakilala ng iyong mga ninuno
  rationale: Ang ידע rito ay tumutukoy sa pagkakilala o pagiging pamilyar batay sa karanasan, hindi lamang sa kaalamang intelektuwal. Ang “mga ninuno” ay mas natural at mas malawak kaysa “mga ama” sa Filipino.
- source_word: לְמַעַן הוֹדִעֲךָ
  choice: upang ipaalam sa iyo
  rationale: Pinananatili nito ang causative na diwa ng ידע—ang Diyos ang nagpapabatid—at ang layuning magturo na ipinakikita ng לְמַעַן.
- source_word: הָאָדָם
  choice: ang tao
  rationale: Generic at kumakatawan sa buong sangkatauhan ang singular na אדם. Sa Filipino, likas na ginagamit ang “ang tao” sa ganitong pangkalahatang pahayag at hindi ito tumutukoy sa lalaki lamang.
- source_word: הַלֶּחֶם לְבַדּוֹ
  choice: sa tinapay lamang
  rationale: Direkta at natural itong katumbas ng parirala at malinaw na pinananatili ang paghahambing sa kasunod na sugnay.
- source_word: כָּל־מוֹצָא פִי יְהוָה
  choice: sa bawat lumalabas sa bibig ni Yahweh
  rationale: Ang מוֹצָא ay literal na tumutukoy sa anumang lumalabas o nagmumula. Pinananatili ng saling ito ang lawak at bahagyang kalabuan ng Hebreo sa halip na limitahan agad ito sa “salita,” bagaman maaaring iyon ang ipinahihiwatig sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: יִחְיֶה הָאָדָם ... יִחְיֶה הָאָדָם
  choice: ang tao ay hindi nabubuhay ... kundi ang tao ay nabubuhay
  rationale: Pinananatili ang pag-uulit at balanseng retorikal ng tekstong Hebreo sa halip na paikliin ang ikalawang sugnay.
theological_decisions:
- issue: Ang generic na kahulugan ng הָאָדָם sa pahayag tungkol sa buhay ng tao
  choice: ang tao
  alternative: ang sangkatauhan; ang isang tao
  rationale: Ang “ang tao” ay natural na generic sa Filipino, pinananatili ang singular at kumakatawang anyo ng Hebreo, at hindi nililimitahan ang pahayag sa mga lalaki.
- issue: Ang saklaw ng מוֹצָא פִי יְהוָה
  choice: bawat lumalabas sa bibig ni Yahweh
  alternative: bawat salitang lumalabas sa bibig ni Yahweh; lahat ng nagmumula sa bibig ni Yahweh
  rationale: Mas malawak sa tahasang “salita” ang מוֹצָא. Pinananatili ng pangunahing salin ang tunay na leksikal na lawak, habang inilalagay sa talababa ang malinaw at kontekstuwal na alternatibong “salita.”
- issue: Pagpapakumbaba at paghihirap sa וַיְעַנְּךָ
  choice: pinagpakumbaba ka niya
  alternative: pinahirapan ka niya; pinagtiis ka niya
  rationale: Kapuwa pagpapakumbaba at pagdadalamhati ang maaaring saklawin ng ugat. Sa konteksto ng disiplina, pagsubok, at pagtuturo, “pinagpakumbaba” ang pinakamainam nang hindi itinatanggi na may kasamang paghihirap.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang retorikal na pag-uulit ng “ang tao ay nabubuhay” at ang personal na pangalang “Yahweh.” Iniwasan ang sobrang teknikal o makalumang pananalita, habang ang “mga ninuno” ay ginamit upang natural na ihatid ang kolektibong אֲבֹתֶיךָ.
