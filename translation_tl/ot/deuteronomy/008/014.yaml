  text: then your heart is lifted up[a], and you forget Yahweh your God, who brought you from the land of Egypt, from the house of servants.
translation:
  language: tl
  text: Kaya magmataas ang puso mo, at makalimutan mo si Yahweh na iyong Diyos, na naglabas sa iyo mula sa lupain ng Ehipto, mula sa bahay ng mga alipin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa bahay ng pagkaalipin.” Literal sa Hebreo, “mula sa bahay ng mga alipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָם לְבָבֶךָ
  choice: maaaring magmataas ang puso mo
  rationale: Pinananatili ang Hebreong larawan ng pusong tumataas, na sa konteksto ay tumutukoy sa pagmamataas. Ipinahihiwatig ng “maaaring” ang babalang bunga sa nagpapatuloy na pangungusap nang hindi ito ginagawang tiyak na pangyayari.
- source_word: וְשָׁכַחְתָּ
  choice: malimutan mo
  rationale: Ang anyo ay nagpapatuloy sa kondisyunal na babala ng nakapaligid na konteksto; natural sa Tagalog ang “malimutan mo” kasunod ng “maaaring.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa baybay ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: 'Tapat na ipinapahayag ang ikalawang panauhang panlalaking isahan at ang tipanang ugnayan: “iyong Diyos.”'
- source_word: הַמּוֹצִיאֲךָ
  choice: na naglabas sa iyo
  rationale: Ang may-artikulong participle ay kumikilala kay Yahweh sa pamamagitan ng ginawa niyang pagliligtas; natural itong isinasalin bilang sugnay na panlarawan.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinananatili ang buong pariralang Hebreo at ang pormal na himig ng pormulang tumutukoy sa Exodo.
- source_word: מִבֵּית עֲבָדִים
  choice: mula sa bahay ng mga alipin
  rationale: Pinananatili ang konkretong maramihang pangngalang עֲבָדִים, “mga alipin,” sa halip na gawing abstraktong “pagkaalipin.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong Yahweh sa halip na palitan ng titulo.
- issue: Pagpapakahulugan sa מִבֵּית עֲבָדִים
  choice: mula sa bahay ng mga alipin
  alternative: mula sa bahay ng pagkaalipin
  rationale: Ang Hebreo ay literal na tumutukoy sa “bahay ng mga alipin.” Pinananatili ng pangunahing teksto ang konkretong katayuan ng mga tao, habang inilalagay sa talababa ang mas idyomatikong alternatibo.
- issue: Ugnayang lohikal at panahunan ng וְרָם ... וְשָׁכַחְתָּ
  choice: Kaya maaaring ... at malimutan mo
  alternative: At nagmataas ... at nalimutan mo; Kaya magmamataas ... at malilimutan mo
  rationale: Nakaugnay ang talata sa kondisyunal na babala ng naunang mga talata. Iniiwasan ng salin ang maling pagbasa bilang naganap nang nakaraan o bilang walang-pasubaling tiyak na hinaharap.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ang “magmataas ang puso” ay sadyang nagpapanatili sa metaporang Hebreo; ang “bahay ng mga alipin” ay bahagyang pormal ngunit malinaw at konkretong tumutugma sa pinagmulan.
