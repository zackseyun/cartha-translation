  source_fidelity: 'Tumpak ang pangunahing paglalapat ng mga parirala: pinananatili ang Yahweh, ang ‘iyong Diyos,’ ang paglabas mula sa Ehipto, at ang kongkretong ‘bahay ng mga alipin.’ Gayunman, ang ‘maaaring’ ay nagdaragdag ng modal na posibilidad na wala sa Hebreo at nagpapahina sa bunga ng babala sa nakapaligid na kondisyunal na pangungusap.'
  naturalness: Natural at marangal ang karamihan ng salin. Mas tuwiran at mas natural sa ganitong babalang konteksto ang ‘magmataas ang puso mo, at makalimutan mo,’ kaysa ‘maaaring magmataas ... at malimutan mo.’
  terminology: Ang ‘Yahweh,’ ‘iyong Diyos,’ ‘lupain ng Ehipto,’ at ‘bahay ng mga alipin’ ay angkop. Ang talababa ay wastong nag-aalok ng mas idyomatikong alternatibo nang hindi inaalis ang konkretong pangngalang maramihan sa pangunahing teksto.
