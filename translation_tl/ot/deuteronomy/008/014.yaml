revisions:
- from: Kaya maaaring magmataas ang puso mo, at malimutan mo si Yahweh na iyong Diyos, na naglabas sa iyo mula sa lupain ng Ehipto, mula sa bahay ng mga alipin.[a]
  to: Kaya magmataas ang puso mo, at makalimutan mo si Yahweh na iyong Diyos, na naglabas sa iyo mula sa lupain ng Ehipto, mula sa bahay ng mga alipin.[a]
  rationale: Inalis ang ‘maaaring’ upang hindi magdagdag ng modal na posibilidad sa Hebreong resulta ng babala. Pinalitan ang ‘malimutan mo’ ng mas natural na ‘makalimutan mo.’ Pinanatili ang iba pang mga termino at ang talababa, sapagkat tapat ang mga ito sa pinagmulan at malinaw sa modernong Filipino.
