- from: At alalahanin mo ang buong daang pinatnubayan sa iyo ni Yahweh na iyong Diyos sa loob ng apatnapung taong ito sa ilang—upang pakumbabain ka, subukin ka, at malaman[a] kung ano ang nasa puso mo, kung susundin mo ang kanyang mga utos o hindi.
