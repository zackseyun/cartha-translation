  text: וְ/זָכַרְתָּ֣ אֶת כָּל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר הֹלִֽיכֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ זֶ֛ה אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לְמַ֨עַן עַנֹּֽתְ/ךָ֜ לְ/נַסֹּֽתְ/ךָ֗ לָ/דַ֜עַת אֶת אֲשֶׁ֧ר בִּֽ/לְבָבְ/ךָ֛ הֲ/תִשְׁמֹ֥ר מצות/ו אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/002.yaml
  text: And you shall remember all the way that Yahweh your God has led you these forty years in the wilderness[a], in order to humble you, to test you, to know what was in your heart, whether you would keep his commandments or not.
translation:
  language: tl
  text: At alalahanin mo ang buong landas na tinahak mo sa patnubay ni Yahweh na iyong Diyos sa loob ng apatnapung taong ito sa ilang—upang pakumbabain ka, subukin ka, at malaman[a] kung ano ang nasa puso mo, kung susundin mo ang kanyang mga utos o hindi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maihayag kung ano ang nasa puso mo.” Literal na sinasabi ng Hebreo, “malaman kung ano ang nasa puso mo,” na pinanatili sa pangunahing teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: At alalahanin mo
  rationale: Ang anyong pandiwa sa kontekstong mapagtagubilin ay may puwersang pautos. Natural sa modernong Tagalog ang “alalahanin mo” at pinananatili ng “At” ang ugnayan sa naunang talata.
- source_word: כָּל הַדֶּרֶךְ
  choice: ang buong daan
  rationale: Tumutukoy ito sa kabuuang landas o karanasan ng paglalakbay ng Israel, hindi lamang sa isang pisikal na kalsada.
- source_word: הֹלִיכֲךָ
  choice: pinatnubayan sa iyo
  rationale: Ang Hiphil ng הלך ay causative at dito ay nagpapahayag ng paggabay sa paglalakbay. Ang “pinatnubayan” ay natural at marangal, bagaman ang karaniwang anyo sa Tagalog ay “pinatnubayan ka”; ginamit ang “sa iyo” upang malinaw ang layon kasunod ng pangalan ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang ikalawang panauhang pag-aari at ang wikang tipan.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: sa loob ng apatnapung taong ito
  rationale: Natural na Tagalog para sa panahong tumagal nang apatnapung taon at pinananatili ang demonstratibong “ito.”
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ang maikli at tradisyonal ngunit nauunawaang katumbas ng wilderness, na mas malawak kaysa “disyerto.”
- source_word: לְמַעַן
  choice: upang
  rationale: Malinaw at natural na naghuhudyat ng layunin.
- source_word: עַנֹּתְךָ
  choice: pakumbabain ka
  rationale: Sa kontekstong ito, ang ענה ay pagdadala sa mababang kalagayan sa pamamagitan ng hirap; kaayon din ito ng kasunod na talata.
- source_word: לְנַסֹּתְךָ
  choice: subukin ka
  rationale: Pinananatili ang diwang pagsusuri o pagpapatunay nang hindi nagpapahiwatig ng pang-aakit sa kasalanan.
- source_word: לָדַעַת
  choice: malaman
  rationale: Tuwirang katumbas ng Hebreong infinitive at pinananatili ang tunay na antropomorpikong tensiyon ng pahayag.
- source_word: אֶת אֲשֶׁר בִּלְבָבְךָ
  choice: kung ano ang nasa puso mo
  rationale: Ang “puso” ay natural na biblikal na katumbas para sa kalooban, pag-iisip, at panloob na pagkatao.
- source_word: הֲתִשְׁמֹר מצותו אִם לֹא
  choice: kung susundin mo ang kanyang mga utos o hindi
  rationale: Ang שמר kaugnay ng mga utos ay idiomatikong “sundin” sa Tagalog; malinaw na pinananatili ang alternatibong tanong.
theological_decisions:
- issue: Antropomorpikong pananalitang “upang malaman kung ano ang nasa puso mo”
  choice: Panatilihin ang tuwirang “malaman” sa pangunahing teksto.
  alternative: “upang ihayag kung ano ang nasa puso mo” o “upang maipakita kung ano ang nasa puso mo”
  rationale: Ang Hebreo ay literal na nagsasabing “malaman.” Hindi dapat tahimik na lutasin ng salin ang tensiyon kaugnay ng kaalaman ng Diyos; ang posibleng pagpapakahulugang paghahayag ay inilalagay lamang sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Yahweh” para sa banal na pangalan, “sa ilang” para sa wilderness, at tuwirang ikalawang panauhan dahil indibidwal na anyo ang mga panghalip sa Hebreo.
