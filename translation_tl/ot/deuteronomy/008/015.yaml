base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/015.yaml
  text: who led you through the great and fearsome wilderness[a], with fiery serpents and scorpions and thirsty ground where there was no water; who brought out water for you from the flinty rock[b],
translation:
  language: tl
  text: na umakay sa iyo sa malawak at nakatatakot na ilang, na may nagniningas na mga ahas[a] at mga alakdan, at tigang na lupain na walang tubig; na nagpalabas para sa iyo ng tubig mula sa batong pingkian[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ang Hebreong pananalita sa mga ahas na ang kagat ay nagdudulot ng matinding, parang nag-aapoy na hapdi.
    reason: lexical_alternative
  - marker: b
    text: Ang “pingkian” ay flint, isang napakatigas na uri ng bato na maaaring magbigay ng kislap kapag pinukpok.
    reason: clarification
lexical_decisions:
- source_word: הַמּוֹלִיכֲךָ
  choice: na umakay sa iyo
  rationale: Ang Hiphil participle na may hulaping ikalawang panauhang panlalaki ay tumutukoy sa ginawa ng PANGINOON sa nakaraan at likas na ipinapahayag sa Filipino bilang sugnay na pasunod.
- source_word: בַּמִּדְבָּר הַגָּדֹל וְהַנּוֹרָא
  choice: sa malawak at nakatatakot na ilang
  rationale: Ang מִדְבָּר ay ilang o ilang na lupain, at ang גָּדֹל sa paglalarawan ng lugar ay natural na 'malawak.' Pinananatili ng 'nakatatakot' ang diwa ng נוֹרָא bilang pumupukaw ng takot.
- source_word: נָחָשׁ שָׂרָף
  choice: makamandag na mga ahas
  rationale: Ang parirala ay maaaring literal na ilarawan bilang 'nagniningas na ahas,' ngunit malamang na tumutukoy sa mga ahas na ang kagat ay nagdudulot ng nag-aapoy na hapdi. Inilalagay sa talababa ang mas literal na anyo upang mapanatili ang leksikal na tensiyon.
- source_word: וְעַקְרָב
  choice: at mga alakdan
  rationale: Ang 'alakdan' ang malinaw at dignified na katumbas sa modernong Filipino; ang maramihan ay angkop sa kolektibong talaan ng mga panganib.
- source_word: וְצִמָּאוֹן אֲשֶׁר אֵין מָיִם
  choice: at tigang na lupain na walang tubig
  rationale: Ang צִמָּאוֹן ay maaaring mangahulugang uhaw o matinding pagkatigang. Sa konteksto ng mga panganib sa ilang, likas ang konkretong 'tigang na lupain,' habang pinananatili sa talababa ang ibang posibilidad.
- source_word: הַמּוֹצִיא לְךָ מַיִם
  choice: na nagpalabas para sa iyo ng tubig
  rationale: Pinananatili ng 'nagpalabas' ang causative na lakas ng Hiphil participle at ang larawan ng tubig na lumalabas mula sa bato.
- source_word: מִצּוּר הַחַלָּמִישׁ
  choice: mula sa batong sintigas ng pingkian
  rationale: Ang צוּר ay bato o malaking batuhan, at ang חַלָּמִישׁ ay pingkian/flint. Ang paghahambing ay natural sa Filipino at malinaw na naghahatid ng pambihirang tigas ng bato.
theological_decisions:
- issue: Kalikasan ng mga panganib sa ilang
  choice: Ipinahayag bilang kongkretong mga panganib sa makasaysayang paglalakbay ng Israel.
  alternative: Unawain ang mga ahas, alakdan, at pagkatigang bilang mga sagisag o pangkalahatang panganib lamang.
  rationale: Inilalahad ng Hebreo ang mga ito bilang aktuwal na kalagayan at panganib sa ilang; walang hinihinging alegorikong pagbasa ang talata.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang 'ilang,' 'alakdan,' at 'pingkian' bilang tumpak na bokabularyong biblikal, na may paglilinaw para sa hindi gaanong karaniwang 'pingkian.'
