base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/010.yaml
  text: And you shall eat and be satisfied[a], and you shall bless Yahweh your God for the good land that he has given you.
translation:
  language: tl
  text: Kakain kayo at mabubusog, at pagpapalain[a] ninyo si Yahweh na inyong Diyos dahil sa mabuting lupaing ibinigay niya sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pasasalamatan” o “pupurihin.” Literal na “pagpapalain” ang nasa Hebreo—isang biblikal na idyoma para sa pagsasalita nang mabuti tungkol sa Diyos bilang pasasalamat at pagpuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: Kakain kayo
  rationale: Ang Qal perfect na may pang-ugnay ay bahagi ng sunod-sunod na bunga o tagubilin sa kontekstong tipan. Likas sa modernong Tagalog ang panghinaharap na “kakain.” Ginamit ang maramihang “kayo” sapagkat ang isahang panauhan sa Hebreo ay kolektibong tumutukoy sa Israel.
- source_word: וְשָׂבָעְתָּ
  choice: at mabubusog
  rationale: Tuwirang ipinahahayag ng pandiwa ang pagkabusog o pagkakaroon ng sapat na pagkain; natural at malinaw sa Tagalog ang “mabubusog.”
- source_word: וּבֵרַכְתָּ
  choice: at pagpapalain[a] ninyo
  rationale: Pinananatili ng “pagpapalain” ang biblikal na idyoma ng ברך kapag Diyos ang layon. Ipinaliliwanag sa talababa na saklaw nito ang pasasalamat at pagpuri upang maiwasang ipakahulugang may idinaragdag ang tao sa pagpapala ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang Tetragrammaton bilang personal na pangalan, hindi pinapalitan ng titulong “Panginoon.”
- source_word: אֱלֹהֶיךָ
  choice: na inyong Diyos
  rationale: Ipinapahayag ang 2ms possessive suffix bilang “inyong,” kaayon ng kolektibong pagtukoy sa Israel.
- source_word: עַל
  choice: dahil sa
  rationale: Dito, ipinakikilala ng עַל ang dahilan o batayan ng pagpapala sa Diyos; malinaw itong naihahayag ng “dahil sa.”
- source_word: הָאָרֶץ הַטֹּבָה
  choice: mabuting lupain
  rationale: Pinananatili ang malawak na kahulugan ng “mabuti” at ang mahalagang tema ng lupaing tipan nang hindi nililimitahan ito sa pagiging mataba o kaaya-aya lamang.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: ibinigay niya sa inyo
  rationale: Inihahayag ang natapos na pagkakaloob ng Diyos at ang patuloy na kabuluhan nito; ang “niya” ay likas na tumutukoy kay Yahweh.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng ברך kapag ang Diyos ang layon
  choice: pagpapalain
  alternative: pasasalamatan; pupurihin
  rationale: Pinananatili ng pangunahing teksto ang sadyang biblikal na idyoma at ang mas malawak na saklaw nito. Inilalahad sa talababa ang natural na mga kahulugang “pasasalamatan” at “pupurihin” nang hindi tahimik na nililimitahan ang salita sa isa lamang sa mga ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kayo/inyo” para sa kolektibong isahang pakikipag-usap sa Israel. Pinanatili ang bahagyang di-pangkaraniwang idyomang “pagpapalain ninyo si Yahweh,” na nililinaw ng talababa.
