  yaml_path: translation/ot/deuteronomy/008/008.yaml
  text: a land of wheat and barley[a], of vines and fig trees and pomegranates, a land of olive oil and honey,
translation:
  language: tl
  text: isang lupaing may trigo at sebada, mga punong ubas, mga puno ng igos, at mga granada; isang lupaing may langis ng olibo at pulot[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “arnibal ng datiles,” sapagkat ang salitang Hebreo ay maaari ring tumukoy sa matamis na arnibal sa mga paglalarawan ng ani ng lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: isang lupaing may
  rationale: Likas sa modernong Filipino ang pariralang ito para ipakilala ang mga ani at yamang taglay ng lupain; pinanatili rin ang pag-uulit ng אֶרֶץ bilang retorikal na paghahati ng talaan.
- source_word: חִטָּה
  choice: trigo
  rationale: Karaniwang tiyak na katawagan sa butil na ito.
- source_word: שְׂעֹרָה
  choice: sebada
  rationale: Karaniwang katawagang Filipino sa barley at likas na kapares ng trigo.
- source_word: גֶּפֶן
  choice: mga punong ubas
  rationale: Ang pangngalan ay kolektibong tumutukoy sa mga halamang namumunga ng ubas; malinaw at natural ito sa karaniwang Filipino.
- source_word: תְּאֵנָה
  choice: mga puno ng igos
  rationale: Puno ng igos, hindi lamang bunga, ang karaniwang tinutukoy ng salitang Hebreo.
- source_word: רִמּוֹן
  choice: mga granada
  rationale: Maaaring tumukoy ang Hebreo sa bunga o puno; ang bunga ang pinakanatural sa talaan ng ani nang hindi labis na nililinaw ang tunay na ambiguwidad.
- source_word: זֵית שֶׁמֶן
  choice: langis ng olibo
  rationale: Idyomatikong Filipino para sa produktong langis mula sa olibo; inihahatid nito ang diwa ng pariralang konstruktong Hebreo.
- source_word: דְּבָשׁ
  choice: pulot
  rationale: Ito ang pangkalahatan at tradisyonal na kahulugan, ngunit maaaring tumukoy sa matamis na arnibal, lalo na mula sa datiles, sa konteksto ng ani ng lupain.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “lupaing may” sa halip na mas literal ngunit matigas na “lupain ng,” at pinanatili ang dalawang ulit na paglalarawan sa lupain. Ang tandang [a] ay inilagay sa “pulot,” na siyang salitang tinutukoy ng talababa.
