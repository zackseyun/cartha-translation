lexical_decisions:
- source_word: פֶּן
  choice: baka
  rationale: Nagsisimula ito ng babalang sugnay na nakaugnay sa naunang talata. Likas sa makabagong Tagalog ang “baka” para sa kinatatakutang maaaring mangyari, at napapanatili nito ang puwersa ng babala.
- source_word: תֹּאכַל
  choice: kapag nakakain na kayo
  rationale: Bagaman pangalawang panauhang panlalaking isahan ang anyong Hebreo, ang kausap ay ang Israel bilang isang bayan; natural sa Tagalog ang maramihang “kayo.” Ipinahihiwatig ng “kapag” at “na” ang inaasahang kalagayang natapos na sa loob ng babala.
- source_word: וְשָׂבָעְתָּ
  choice: at nabusog
  rationale: Ang pandiwa ay tumutukoy sa pagiging busog o ganap na nasiyahan matapos kumain. Ang “nabusog” ang pinakanatural at tuwirang salita sa konteksto, habang inilalagay sa talababa ang mas malawak na diwang “nasiyahan.”
- source_word: וּבָתִּים טוֹבִים
  choice: magagandang bahay
  rationale: Sa konteksto ng kasaganaan, inilalarawan ng טוֹבִים ang mga bahay bilang mabuti, maayos, o kanais-nais. Mas likas sa Tagalog ang “magagandang bahay” kaysa literal na “mabubuting bahay,” nang hindi ipinapalagay na marangya ang mga ito.
- source_word: תִּבְנֶה
  choice: nakapagtayo na kayo
  rationale: Ipinapakita ng “nakapag-” ang matagumpay na pagtatayo, at ng “na” ang kalagayang natapos na sa inaasahang tagpo ng babala.
- source_word: וְיָשָׁבְתָּ
  choice: at naninirahan na sa mga iyon
  rationale: Ang יָשַׁב ay maaaring mangahulugang manirahan o tumahan. Ang “naninirahan” ay natural at marangal sa modernong Tagalog; ang “sa mga iyon” ay malinaw na tumutukoy sa mga bahay, gaya ng hinihingi ng konteksto.
