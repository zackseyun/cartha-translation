translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “kayo” sapagkat ang isahang anyong Hebreo ay tumutukoy sa Israel bilang kolektibong kausap. Pinanatili ang pangungusap na bukas sa dulo dahil nagpapatuloy ang babala sa susunod na mga talata.
