  text: and your herds and your flocks multiply[a], and silver and gold increase for you[b], and all that is yours increases—
translation:
  language: tl
  text: at dumami ang iyong mga alagang baka at mga kawan, at dumami ang iyong pilak at ginto, at dumami ang lahat ng iyong pag-aari—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְקָרְךָ
  choice: ang iyong mga bakahan
  rationale: Ang בָּקָר ay kolektibong tawag sa mga bovine na alagang hayop. Ang “mga bakahan” ay likas na katambal ng “mga kawan” at pinananatili ang kaibhan ng malalaki at maliliit na alagang hayop.
- source_word: וְצֹאנְךָ
  choice: at mga kawan
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Hindi nito labis na tinutukoy ang mga uring hindi isa-isang binanggit sa Hebreo.
- source_word: יִרְבְּיוּן
  choice: dumami
  rationale: Ang pandiwa mula sa רבה ay nagsasaad ng pagdami sa bilang at natural gamitin para sa mga alagang hayop.
- source_word: וְכֶסֶף וְזָהָב
  choice: ang pilak at ginto
  rationale: Walang tahasang pang-angking pananda sa mga pangngalan; ang pag-uugnay sa kinauukulan ay ipinahahayag ng kasunod na לָךְ.
- source_word: יִרְבֶּה לָּךְ
  choice: dumami para sa iyo
  rationale: Pinananatili ng “para sa iyo” ang datibong לָךְ, kahit bahagyang marked ang ayos sa Filipino, at hindi nagdaragdag ng tahasang pang-angkin sa “pilak at ginto.”
- source_word: וְכֹל אֲשֶׁר לְךָ
  choice: at ang lahat ng sa iyo
  rationale: Maikli at malapit ito sa Hebreong konstruksiyong nangangahulugang lahat ng pag-aari o nauukol sa tao.
- source_word: יִרְבֶּה
  choice: dumami
  rationale: Ang pag-uulit ng “dumami” ay tumutugma sa paulit-ulit na רבה sa Hebreo at nagpapanatili sa retorikal na ritmo ng talata.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino, na may sinadyang pag-uulit ng “dumami” upang mapanatili ang Hebreong ritmo. Ang “mga bakahan” ay ginagamit sa kolektibong diwa para sa bovine livestock, samantalang ang “mga kawan” ay para sa maliliit na alagang hayop.
