  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/זָֽכַרְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ כִּ֣י ה֗וּא הַ/נֹּתֵ֥ן לְ/ךָ֛ כֹּ֖חַ לַ/עֲשׂ֣וֹת חָ֑יִל לְמַ֨עַן הָקִ֧ים אֶת בְּרִית֛/וֹ אֲשֶׁר נִשְׁבַּ֥ע לַ/אֲבֹתֶ֖י/ךָ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/018.yaml
  text: But you shall remember Yahweh your God[a], for it is he who gives you power to gain wealth, so that he may establish his covenant that he swore to your fathers[c][b], as it is this day.
translation:
  language: tl
  text: Ngunit alalahanin mo si Yahweh na iyong Diyos, sapagkat siya ang nagbibigay sa iyo ng kakayahang magkamit ng kayamanan,[a] upang isakatuparan niya ang kanyang tipan na ipinangako niya sa iyong mga ninuno sa pamamagitan ng panunumpa,[b] gaya ng nangyayari ngayon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gumawa ng kayamanan” o, sa mas malawak na diwa, “magtagumpay.”
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ang Hebreong “iyong mga ama” sa mga ninunong pinagbigyan ng tipan, lalo na sa mga patriyarka.
    reason: cultural_note
  - marker: c
    text: 'Idyomang Hebreo: “gaya sa araw na ito,” na nangangahulugang “gaya ng malinaw na nakikita ngayon” o “gaya ng nangyayari ngayon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Ngunit alalahanin mo
  rationale: Ang anyo ay gumaganap bilang matibay na utos o pangaral. Ipinahihiwatig ng “Ngunit” ang pagsalungat sa pag-aakalang sariling lakas ang pinagmulan ng kayamanan sa naunang talata.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: si Yahweh na iyong Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang wikang pangtipan ng “iyong Diyos.”
- source_word: כִּי הוּא הַנֹּתֵן לְךָ
  choice: sapagkat siya ang nagbibigay sa iyo
  rationale: Ang “siya ang” ay nagpapanatili sa diin ng panghalip na הוּא, at ang “nagbibigay” ay angkop sa patuloy o likas na pagkilos ng participle.
- source_word: כֹּחַ
  choice: kakayahan
  rationale: Saklaw ng salita ang lakas, kapangyarihan, at kapasidad. Mas natural sa Filipino ang “kakayahang” kasama ng pagkakamit ng kayamanan, nang hindi nililimitahan ito sa pisikal na lakas.
- source_word: לַעֲשׂוֹת חָיִל
  choice: magkamal ng kayamanan
  rationale: Sa konteksto ng talata 17, tumutukoy ang idyoma sa pagtatamo o paglikha ng yaman. Ang “magkamal” ay malinaw na nagpapahayag ng pagkakamit, habang inilalahad sa talababa ang mas malawak na posibilidad na magtagumpay.
- source_word: לְמַעַן הָקִים אֶת־בְּרִיתוֹ
  choice: upang tuparin niya ang kanyang tipan
  rationale: Ang Hiphil ng קום ay maaaring mangahulugang pagtitibay, pagpapatatag, o pagsasakatuparan. Sa natural na Filipino, ipinapahayag ng “tuparin” ang paglalagay ng ipinangakong tipan sa bisa sa kasaysayan nang hindi ipinapalagay na noon lamang ito umiral.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: na isinumpa niya sa iyong mga ninuno
  rationale: Ang tinutukoy ay ang mga amang pinagmulan ng Israel, lalo na ang mga patriyarka. Sa Filipino, “mga ninuno” ang natural at hindi nag-aalis sa tiyak na kontekstong pangtipan, na nililinaw sa talababa.
- source_word: כַּיּוֹם הַזֶּה
  choice: gaya ng nakikita sa araw na ito
  rationale: Ginagawang malinaw ang karaniwang idyomang Hebreo na tumutukoy sa kasalukuyang nakikitang katibayan, sa halip na magbigay ng malabo at di-natural na literal na parirala.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong Yahweh sa halip na palitan ng isang titulo.
- issue: Saklaw ng חָיִל sa kontekstong pangkabuhayan
  choice: kayamanan
  alternative: tagumpay / kasaganaan
  rationale: Ang naunang talata ay tahasang tumutukoy sa kayamanang maaaring ipagmalaki ng Israel bilang bunga ng sariling lakas. Gayunman, pinananatili sa talababa ang mas malawak na saklaw ng salita.
- issue: Diwa ng הָקִים kaugnay ng tipan
  choice: tuparin
  alternative: patatagin / pagtibayin / isakatuparan
  rationale: Hindi dapat ipakahulugang noon lamang nilikha ang tipan. Ipinahihiwatig ng pandiwa ang pagsasakatuparan o pagpapatibay nito sa karanasan ng Israel; natural na naihahatid ito ng “tuparin” nang hindi ganap na isinasara ang semantikong saklaw.
- issue: Tinutukoy ng אֲבֹתֶיךָ
  choice: iyong mga ninuno
  alternative: iyong mga ama
  rationale: Ang reperensiya ay sa mga patriyarkang pinagbigyan ng sumpang pangako. Ang “mga ninuno” ay natural sa modernong Filipino, at nililinaw ng talababa ang tiyak na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tuwirang pang-isahang “mo/iyo” ayon sa 2ms ng Hebreo. Pinanatili ang Yahweh bilang personal na pangalan. Inilagay ang lahat ng panandang talababa sa mismong teksto at inayos ang mga ito ayon sa pagkakasunod ng paglitaw.
