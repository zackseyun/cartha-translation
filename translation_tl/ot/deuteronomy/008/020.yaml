id: DEU.8.20
reference: Deuteronomy 8:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כַּ/גּוֹיִ֗ם אֲשֶׁ֤ר יְהוָה֙ מַאֲבִ֣יד מִ/פְּנֵי/כֶ֔ם כֵּ֖ן תֹאבֵד֑וּ/ן עֵ֚קֶב לֹ֣א תִשְׁמְע֔וּ/ן בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/020.yaml
  text: Like the nations that Yahweh is destroying before you[a], so you will perish, because you did not listen to the voice of Yahweh your God.
translation:
  language: tl
  text: Tulad ng mga bansang nililipol ni Yahweh sa harapan ninyo, malilipol din kayo, dahil hindi ninyo pakikinggan ang tinig ni Yahweh na inyong Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dahil hindi ninyo susundin si Yahweh na inyong Diyos.” Ang idyomang Hebreo ay literal na “makinig sa tinig ni Yahweh na inyong Diyos” at madalas na nangangahulugang sumunod.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּגּוֹיִם
  choice: Tulad ng mga bansa
  rationale: Ipinahahayag ng כְּ ang paghahambing, at ang גּוֹיִם ay tumutukoy sa mga bansang nasa lupain. Likas at malinaw sa modernong Tagalog ang “tulad ng mga bansa.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מַאֲבִיד
  choice: nililipol
  rationale: 'Ang Hiphil participle ng אבד ay may sanhi at nagpapatuloy na diwa: si Yahweh ang nagpapahamak o lumilipol sa mga bansa. Ang “nililipol” ay natural at matindi nang hindi labis na nagpapaliwanag.'
- source_word: מִפְּנֵיכֶם
  choice: sa harapan ninyo
  rationale: Pinananatili nito ang larawang Hebreo ng pag-aalis sa mga bansa mula sa harapan ng Israel habang sumusulong sila.
- source_word: כֵּן תֹאבֵדוּן
  choice: malilipol din kayo
  rationale: Ipinapakita ng “din” ang katumbas ng Hebreong ugnayang “tulad… gayon,” at inuugnay ng “malilipol” ang sasapitin ng Israel sa pagkalipol ng mga bansa.
- source_word: עֵקֶב
  choice: dahil
  rationale: Malinaw nitong ipinakikilala ang dahilan o bunga ng hindi pakikinig.
- source_word: לֹא תִשְׁמְעוּן בְּקוֹל
  choice: hindi ninyo pakikinggan ang tinig
  rationale: Pinananatili ang tahasang idyomang Hebreo na “makinig sa tinig,” na saklaw din ang pagsunod. Ang anyong panghinaharap ay umaayon sa babalang nakatuon sa magiging asal at kapahamakan ng Israel.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Kasama ng Yahweh at ng hulaping pangmaramihan, malinaw na tumutukoy ito sa nag-iisang Diyos ng Israel.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Direktang ginagamit ng tekstong Hebreo ang personal na pangalan ng Diyos; pinananatili ito bilang “Yahweh” upang hindi mapalitan ng isang titulo.
- issue: Kung isasalin ang שׁמע בקול bilang “sumunod” o bilang “makinig sa tinig”
  choice: pakikinggan ang tinig
  alternative: susundin
  rationale: Ang idyoma ay nagpapahiwatig kapuwa ng pakikinig at pagsunod. Pinananatili sa pangunahing teksto ang kongkretong larawan at tonong pangtipan, habang ipinapaliwanag sa talababa ang diwa ng pagsunod.
- issue: Panahunan ng לֹא תִשְׁמְעוּן
  choice: hindi ninyo pakikinggan
  alternative: hindi ninyo pinakinggan / hindi ninyo pinakikinggan
  rationale: Ang Hebreong imperfect ay maaaring magkaroon ng panghinaharap o di-tiyak na diwa. Sa konteksto ng babala, ang panghinaharap na Tagalog ay maayos na kaugnay ng “malilipol,” ngunit hindi nito inaalis ang pangkalahatang diwa ng patuloy na pagtangging sumunod.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang paghahambing at ang idyomang “makinig sa tinig” nang hindi nagpapasok ng natatanging interpretasyong denominasyonal.
