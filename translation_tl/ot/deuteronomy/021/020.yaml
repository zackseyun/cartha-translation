revisions:
- from: At sasabihin nila sa matatandang pinuno ng kanyang lungsod, “Ang anak naming ito ay matigas ang ulo at mapaghimagsik. Hindi niya kami sinusunod.[a] Matakaw siya at lasenggo.”
  to: At sasabihin nila sa mga nakatatanda ng kanyang lungsod, “Ang anak naming ito ay matigas ang ulo at rebelde. Hindi niya kami sinusunod.[a] Matakaw siya at lasenggo.”
