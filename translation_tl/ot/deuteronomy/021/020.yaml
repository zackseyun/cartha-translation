  text: Then they shall say to the elders of his city[a], ‘This son of ours is stubborn and rebellious; he does not listen to our voice; he is a glutton and a drunkard.’
translation:
  language: tl
  text: At sasabihin nila sa mga nakatatanda ng kanyang lungsod, “Ang anak naming ito ay matigas ang ulo at rebelde. Hindi niya kami sinusunod.[a] Matakaw siya at lasenggo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Hindi siya nakikinig sa aming tinig.” Sa idyomang Hebreo, ang pakikinig ay may diwang pagtalima o pagsunod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: At sasabihin nila
  rationale: Ipinagpapatuloy ng anyong pandiwa ang sunod-sunod na hakbang sa legal na pamamaraan; natural sa Filipino ang “At sasabihin nila.”
- source_word: זִקְנֵי עִירוֹ
  choice: matatandang pinuno ng kanyang lungsod
  rationale: Ang זִקְנֵי ay tumutukoy sa kinikilalang lupon ng mga nakatatandang pinuno, hindi lamang sa matatanda sa edad; nililinaw ito ng “matatandang pinuno.”
- source_word: בְּנֵנוּ זֶה
  choice: Ang anak naming ito
  rationale: Natural at mariing ipinakikilala sa Filipino ang tinutukoy na anak, gaya ng demonstratibong Hebreo.
- source_word: סוֹרֵר וּמֹרֶה
  choice: matigas ang ulo at mapaghimagsik
  rationale: Pinananatili ng pares ang patuloy na pagmamatigas at hayagang pagrerebelde na nilalaman ng dalawang participle.
- source_word: אֵינֶנּוּ שֹׁמֵעַ בְּקֹלֵנוּ
  choice: Hindi niya kami sinusunod
  rationale: Ang literal na “hindi nakikinig sa aming tinig” ay isang idyomang Hebreo na nangangahulugang hindi pagtalima; “hindi niya kami sinusunod” ang natural at malinaw na katumbas sa modernong Filipino.
- source_word: זוֹלֵל
  choice: Matakaw
  rationale: Sa pagkakapares nito sa taong lulong sa alak, tumutukoy ito sa labis at nakaugaliang pagkain.
- source_word: וְסֹבֵא
  choice: lasenggo
  rationale: Ipinahihiwatig ng participle ang taong nakaugalian ang labis na pag-inom; karaniwan at malinaw sa modernong Filipino ang “lasenggo.”
