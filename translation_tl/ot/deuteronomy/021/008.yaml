base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/008.yaml
  text: Make atonement for your people Israel[a], whom you redeemed, O Yahweh, and do not let innocent blood remain among your people Israel. Then the bloodguilt will be atoned for them.
translation:
  language: tl
  text: “Pawiin mo ang sala ng iyong bayang Israel, na iyong tinubos, Yahweh. Huwag mong hayaang manatili sa gitna ng iyong bayang Israel ang dugong walang-sala. Sa gayon, mapapawi sa kanila ang pananagutang dulot ng dugo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at mapapawi para sa kanila ang dugo.” Ginagamit dito ang “dugo” bilang legal na pananalita para sa pananagutang dulot ng pagdanak ng dugo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֵּר
  choice: Pawiin mo ang sala
  rationale: Ipinahahayag nito sa likas at malinaw na modernong Tagalog ang kultiko at legal na diwa ng כפר—ang pag-aalis ng sala o pananagutan—nang hindi gumagamit ng malabo at di-likas na literalismong gaya ng “takpan.”
- source_word: לְעַמְּךָ יִשְׂרָאֵל
  choice: ng iyong bayang Israel
  rationale: Ang לְ ay tumutukoy sa mga makikinabang sa pagpawi ng sala; likas sa Tagalog ang “sala ng iyong bayan” sa ganitong pakiusap.
- source_word: אֲשֶׁר פָּדִיתָ
  choice: na iyong tinubos
  rationale: Pinananatili ng “tinubos” ang diwa ng פדה bilang paglaya sa pamamagitan ng pagtubos at ang ugnay nito sa pagliligtas ng Diyos sa Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְאַל תִּתֵּן דָּם נָקִי בְּקֶרֶב
  choice: Huwag mong hayaang manatili ... ang dugong walang-sala
  rationale: Sa kontekstong legal, ang literal na “huwag mong ilagay ang dugong walang-sala sa gitna” ay tumutukoy sa hindi pagpapaiwan ng pananagutan dahil sa pagdanak ng inosenteng dugo. Ang saling ito ay natural sa Tagalog ngunit pinananatili ang mismong larawan ng “dugong walang-sala.”
- source_word: וְנִכַּפֵּר לָהֶם הַדָּם
  choice: Sa gayon, mapapawi ang pananagutan nila sa dugo
  rationale: Ang Niphal ng כפר ay pasibo o resultative. Bagaman literal na “ang dugo” ang simuno sa Hebreo, ang parirala ay legal na tumutukoy sa pananagutang bunga ng pagdanak ng dugo; nililinaw iyon sa pangunahing teksto habang itinatala sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Paglalahad sa pangalan na YHWH
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo at iniiwasang palitan ito ng titulo.
- issue: Kahulugan ng panghuling הַדָּם
  choice: pananagutan nila sa dugo
  alternative: ang dugo
  rationale: Ang konteksto ay pagpawi sa pananagutan ng pamayanan dahil sa hindi nalutas na pagpatay. Nililinaw ng pangunahing salin ang legal na diwa, habang pinananatili sa talababa ang tunay na literal na anyo at ang kaakibat nitong pag-igting.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Iniwasan ang sobrang teknikal na “atonement” at ang di-likas na literal na “ilagay ang dugo sa gitna,” ngunit pinanatili ang kultiko-legal na diwa at ang literal na alternatibo sa talababa.
