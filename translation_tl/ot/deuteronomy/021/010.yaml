  naturalness: Makabago at malinaw ang karamihan ng draft. Mas natural ang “ibinigay ni Yahweh na iyong Diyos ang mga ito sa iyong kamay” kaysa sa passive na ayos. Ang “mga bihag mula sa kanila” ay tuwiran at malinaw.
  terminology: Ang “Yahweh,” “Diyos,” “mga kaaway,” at “mga bihag” ay angkop at pare-pareho sa rehistro. Pinananatili ang “sa iyong kamay,” ang larawang Hebreo para sa pagpapasailalim sa kapangyarihan ng isang tao.
