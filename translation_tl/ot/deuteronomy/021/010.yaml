base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/010.yaml
  text: When you go out to war against your enemies[a], and Yahweh your God gives them into your hand, and you take them captive[b],
translation:
  language: tl
  text: Kapag humayo ka upang makipagdigma laban sa iyong mga kaaway, at ibinigay ni Yahweh na iyong Diyos ang mga ito[a] sa iyong kamay, at kumuha ka ng mga bihag mula sa kanila[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ibigay siya/iyon sa iyong kamay.” Malamang na kolektibong tumutukoy ang singular na hulapi sa hukbo o pangkat ng mga kaaway.
    reason: lexical_alternative
  - marker: b
    text: O “at bumihag ka ng mga bihag mula sa kanila.” Gumagamit ang Hebreo ng magkaugnay na pandiwa at pangngalan para sa pagkuha ng mga bihag.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Nagsisimula ito ng isang sitwasyong pangkautusan; natural na ipinahihiwatig ng “Kapag” ang kasong maaaring mangyari nang hindi ginagawang tahasang katiyakan.
- source_word: תֵצֵא לַמִּלְחָמָה
  choice: humayo ka upang makipagdigma
  rationale: Pinananatili ng “humayo” ang konkretong diwa ng paglabas, samantalang malinaw at natural sa Filipino ang “upang makipagdigma.”
- source_word: עַל אֹיְבֶיךָ
  choice: laban sa iyong mga kaaway
  rationale: Ang עַל sa konteksto ng pakikidigma ay natural na “laban sa,” at plural ang אֹיְבֶיךָ.
- source_word: וּנְתָנוֹ
  choice: ibigay sila
  rationale: Bagaman singular ang hulaping Hebreo, kolektibo nitong tinutukoy ang hukbo ng mga kaaway; kaya plural ang natural na salin sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tumpak at natural na salin ng pangngalang may hulaping ikalawang panauhang panlalaki na singular.
- source_word: בְּיָדֶךָ
  choice: sa iyong kamay
  rationale: Pinananatili ang idyomatikong larawan ng Hebreo para sa pagpapasailalim sa kapangyarihan o kontrol ng isang tao.
- source_word: וְשָׁבִיתָ שִׁבְיוֹ
  choice: at kumuha ka sa kanila ng mga bihag
  rationale: Ipinahahayag nito ang diwa ng magkaugnay na pandiwa at pangngalan sa Hebreo at nililinaw na ang mga bihag ay kinuha mula sa natalong kaaway.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa pinagmulang teksto; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Singular na hulapi sa וּנְתָנוֹ at שִׁבְיוֹ
  choice: Kolektibong pagtukoy sa mga kaaway
  alternative: Literal na singular na “siya/iyon” o “kaniyang mga bihag”
  rationale: Plural ang tahasang antecedent na “mga kaaway,” ngunit singular ang hulapi sa Hebreo. Ginawang natural na plural ang pangunahing teksto habang itinabi sa talababa ang anyong literal upang mapanatili ang tunay na anyo at posibleng kolektibong gamit.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “humayo” upang mapanatili ang larawan ng Hebreo nang hindi nagiging labis na makaluma; ang “makipagdigma,” “mga kaaway,” at “mga bihag” ay malinaw sa karaniwang mambabasa. Lahat ng talababa ay may katugmang marker sa pangunahing teksto.
