base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/003.yaml
  text: And it shall be that the city nearest to the slain man[c][b][a], the elders of that city shall take a heifer from the herd that has not been worked with and has not pulled in a yoke.
translation:
  language: tl
  text: At ang mga nakatatanda ng lunsod na pinakamalapit sa taong pinaslang[a] ay kukuha ng isang dumalagang baka mula sa kawan[b], na hindi pa ginagamit sa paggawa at hindi pa nakahila nang may pamatok.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “taong napatay,” “ang pinaslang,” o “bangkay.” Ang salitang Hebreo ay tumutukoy sa isang taong pinatay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang dumalaga.” Mas ganap na tinutukoy ng pariralang Hebreo ang isang batang babaeng baka mula sa kawan.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “na hindi pa humila nang may pamatok”; ibig sabihin, hindi pa ito nagamit sa gawaing paghila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: At
  rationale: Sa kontekstong legal at pasalaysay, ipinagpapatuloy nito ang itinakdang hakbang mula sa naunang talata; mas natural sa modernong Tagalog ang payak na pang-ugnay kaysa sa literal na “at mangyayari na.”
- source_word: הָעִיר הַקְּרֹבָה אֶל הֶחָלָל
  choice: ang lunsod na pinakamalapit sa taong pinaslang
  rationale: Ipinahahayag ng “pinakamalapit” ang paghahambing na ipinahihiwatig ng konteksto. Ang חָלָל ay isang taong napatay, hindi lamang isang walang-personang bangkay.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: ang mga matatandang pinuno ng lunsod
  rationale: Ang זְקֵנִים dito ay mga kinikilalang nakatatandang namumuno sa pamayanan, kaya nilinaw bilang “matatandang pinuno” sa halip na edad lamang ang ipahiwatig.
- source_word: עֶגְלַת בָּקָר
  choice: isang dumalagang baka mula sa kawan
  rationale: Ang עֶגְלָה ay batang babaeng baka; ang “mula sa kawan” ay kumakatawan sa partitive na kaugnayan sa בָּקָר at natural sa Tagalog.
- source_word: אֲשֶׁר לֹא עֻבַּד בָּהּ
  choice: na hindi pa nagagamit sa trabaho
  rationale: Ang pasibong anyo ay tumutukoy sa trabahong ginawa sa pamamagitan ng hayop. Nililinaw ng “nagagamit sa trabaho” ang instrumental na diwa nang hindi nililimitahan ang uri ng paggawa.
- source_word: אֲשֶׁר לֹא מָשְׁכָה בְּעֹל
  choice: at hindi pa nakakahila nang may pamatok
  rationale: Ang מָשַׁךְ ay “humila,” at ang עֹל ay pamatok. Pinananatili ng salin ang konkretong larawan ng hayop na ginagamit sa gawaing paghila.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “lunsod,” “matatandang pinuno,” at “pamatok” bilang pormal ngunit karaniwang bokabularyo para sa isang tekstong legal at sinauna. Inayos nang bahagya ang Hebreong sugnay upang maging malinaw at natural sa Tagalog habang pinananatili ang lahat ng pangunahing detalye.
