  - severity: low
    issue: Ang “matatandang pinuno” ay bahagyang interpretibong pagpapalawak.
    rationale: Ang זקנים ay mga nakatatanda na may kinikilalang pampamayanang tungkulin, ngunit hindi tahasang ginagamit ng Hebreo ang salitang “pinuno.” Ang “mga nakatatanda ng lunsod” ay mas tuwiran at nananatiling natural.
