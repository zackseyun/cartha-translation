  to: At ang mga nakatatanda ng lunsod na pinakamalapit sa taong pinaslang[a] ay kukuha ng isang dumalagang baka mula sa kawan[b], na hindi pa ginagamit sa paggawa at hindi pa nakahila nang may pamatok.[c]
