  text: then you shall bring her into your house[a], and she shall shave her head and trim her nails.
translation:
  language: tl
  text: Pagkatapos, iuuwi mo siya sa iyong bahay, at aahitin niya ang kanyang ulo at gugupitin ang kanyang mga kuko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hahayaan niyang humaba ang kanyang mga kuko.” Literal sa Hebreo, “gagawin niya ang kanyang mga kuko”; idyomatiko at pinagtatalunan ang kahulugan nito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲבֵאתָהּ
  choice: Pagkatapos, iuuwi mo siya
  rationale: Ang Hiphil na anyo na may waw ay nagpapatuloy sa pagkakasunod-sunod ng mga utos. Likas sa Filipino ang “iuuwi mo siya” sa kontekstong pagdadala sa babae sa sariling bahay.
- source_word: אֶל תּוֹךְ בֵּיתֶךָ
  choice: sa iyong bahay
  rationale: Tumutukoy ang תּוֹךְ sa loob o interior, ngunit sapat at higit na natural sa Filipino ang “sa iyong bahay”; ipinahihiwatig na ng pandiwang “iuuwi” ang pagpasok sa bahay.
- source_word: וְגִלְּחָה אֶת רֹאשָׁהּ
  choice: at aahitin niya ang kanyang ulo
  rationale: Karaniwang kahulugan ng גלח ang pag-ahit. Pinananatili ng salin ang tahasang bagay na “ulo” nang hindi idinaragdag na lubos itong kakalbuhin.
- source_word: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: at gugupitin ang kanyang mga kuko
  rationale: Literal na “gagawin/aayusin niya ang kanyang mga kuko” ang Hebreo at pinagtatalunan ang idyoma. Ang “gugupitin” ang malinaw at natural na pangunahing pagbasa, habang inilalagay sa talababa ang mahalagang alternatibo.
theological_decisions:
- issue: Kalabuan ng וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: Gugupitin o aayusin ng babae ang kanyang mga kuko.
  alternative: Hahayaan ng babae na humaba ang kanyang mga kuko.
  rationale: Hindi tiyak ang idyomatikong pariralang Hebreo, na literal na nagsasabing “gagawin niya ang kanyang mga kuko.” Pinili sa pangunahing teksto ang natural na pagbasa ngunit pinanatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iuuwi” bilang likas na katumbas ng pagdadala sa loob ng sariling bahay; iniwasan ang mabigat na literalismong “sa gitna ng iyong bahay.”
