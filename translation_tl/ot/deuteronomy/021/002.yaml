translation:
  language: tl
  text: Pagkatapos, lalabas ang inyong matatanda at mga hukom at susukatin nila ang layo mula sa napatay[a] hanggang sa mga kalapit na lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “ang taong napatay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: Pagkatapos, lalabas
  rationale: Ang waw + qatal ay nagpapatuloy sa sunod-sunod na hakbang ng legal na pamamaraan. Likas sa Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod, habang pinananatili ng “lalabas” ang kilos.
- source_word: זְקֵנֶיךָ
  choice: ang matatanda ... ninyo
  rationale: Tumutukoy ito sa kinikilalang matatandang pinuno ng sambayanan. Ang “ninyo” ay natural na kolektibong pagtukoy sa Israel sa Filipino, bagaman isahan ang hulapi sa Hebreo.
- source_word: וְשֹׁפְטֶיךָ
  choice: at mga hukom ninyo
  rationale: Ang anyo mula sa שׁפט ay tumutukoy sa mga may kapangyarihang humatol; “mga hukom” ang tuwiran at angkop na katawagan sa legal na konteksto.
- source_word: וּמָדְדוּ אֶל הֶעָרִים
  choice: at susukatin nila ang layo ... hanggang sa mga lungsod
  rationale: Literal na “susukat patungo sa mga lungsod.” Ginagawang malinaw ng “ang layo ... hanggang sa” ang sinusukat at ang mga lungsod bilang mga hangganan ng pagsukat, nang hindi binabago ang diwa.
- source_word: אֲשֶׁר סְבִיבֹת
  choice: sa paligid
  rationale: Maikli at natural itong paglalarawan sa mga lungsod na nakapalibot sa lugar ng bangkay.
- source_word: הֶחָלָל
  choice: napatay
  rationale: Ang חָלָל ay isang taong pinaslang o napatay, hindi lamang isang bangkay. Hindi tinutukoy ng pangngalang Hebreo ang kasarian sa anyo nito, kaya pinananatiling bukas ng “napatay” ang sanggunian.
