translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “matatanda” sa institusyonal na kahulugan at “mga hukom” para sa mga opisyal na may tungkuling panghukuman. Inayos ang parirala ng pagsukat ayon sa likas na sintaks ng Filipino.
