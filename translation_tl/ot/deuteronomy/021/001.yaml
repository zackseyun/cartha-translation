base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/001.yaml
  text: If a slain man is found in the land that Yahweh your God is giving you to possess[a], lying in the open field, and it is not known who struck him,
translation:
  language: tl
  text: Kung may matagpuang lalaking pinaslang[a] sa lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos upang ariin mo, at nakahandusay siya sa parang, ngunit hindi alam kung sino ang pumatay sa kanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kapag may matagpuang taong pinaslang...” Panlalaking isahan ang gramatikal na anyo sa Hebreo (“lalaking pinaslang”), bagaman ang simulain ng batas ay tumutukoy sa isang di-nalutas na pagpaslang sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Nagpapakilala ito ng kondisyon sa isang kasong legal. Ang “Kung” ang likas at malinaw na katumbas sa modernong Filipino, bagaman posible rin ang “Kapag.”
- source_word: יִמָּצֵא
  choice: may matagpuan
  rationale: Tumpak na ipinahahayag ang Niphal na pasibong diwa ng מצא sa natural na Filipino.
- source_word: חָלָל
  choice: lalaking pinaslang
  rationale: Tumutukoy ito sa isang taong marahas na pinatay, hindi lamang sa isang bangkay. Pinananatili ng “lalaking” ang panlalaking isahan ng Hebreo, at ng “pinaslang” ang diwa ng karahasan.
- source_word: בָּאֲדָמָה
  choice: sa lupain
  rationale: Ang tinutukoy ay ang teritoryong tatanggapin at aariin ng Israel, hindi lamang lupa o suelo.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ לְרִשְׁתָּהּ
  choice: ibinibigay sa inyo ni Yahweh na inyong Diyos upang ariin
  rationale: Pinananatili ang banal na pangalang Yahweh at ang tipang wika tungkol sa lupaing ibinibigay upang angkinin. Ginawang maramihan ang panghalip sa Filipino upang maging likas na pagtukoy sa sambayanan.
- source_word: נֹפֵל
  choice: nakahandusay
  rationale: Bagaman literal na “nakabuwal,” malinaw at natural na inilalarawan ng “nakahandusay” ang kalagayan ng taong pinaslang.
- source_word: בַּשָּׂדֶה
  choice: sa parang
  rationale: Ang “parang” ay likas na tumutukoy sa bukas na lugar sa labas ng pamayanan at mahusay na katumbas ng שָׂדֶה sa kontekstong ito.
- source_word: לֹא נוֹדַע
  choice: hindi nalalaman
  rationale: Pinananatili nito ang impersonal at pasibong anyo ng Hebreo.
- source_word: מִי הִכָּהוּ
  choice: kung sino ang pumatay sa kanya
  rationale: Sa konteksto ng isang taong natagpuang pinaslang, ipinahahayag ng נכה ang nakamamatay na pananakit. Mas malinaw sa Filipino ang “pumatay” kaysa sa literal na “humampas,” na maaaring magpahiwatig lamang ng di-nakamamatay na pananakit.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kasarian ng tinutukoy ng חָלָל
  choice: lalaking pinaslang
  alternative: taong pinaslang
  rationale: Panlalaking isahan ang anyong Hebreo. Pinananatili iyon sa pangunahing teksto, habang itinatala sa talababa ang posibleng pangkalahatang saklaw ng tuntunin.
translation_notes:
  register: Modernong Filipino na malinaw at marangal, na may legal na himig. Ginamit ang “lupain,” “ariin,” at “pinaslang” upang mapanatili ang tipan at hudisyal na konteksto nang hindi nagiging lipas o labis na teknikal.
