base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/009.yaml
  text: So you shall purge the innocent blood from your midst[a], because you shall do what is right in the eyes of Yahweh.
translation:
  language: tl
  text: Kaya aalisin mo mula sa iyong kalagitnaan ang dugo ng walang-sala[a], sapagkat gagawin mo ang matuwid sa paningin ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “alisin mo mula sa iyong kalagitnaan ang dugong walang sala.” Ang idyomang Hebreo na “dugo ng walang-sala” ay maaaring tumukoy sa pananagutan ng pamayanan dahil sa pagpatay na hindi pa natutubos. Maaari ring unawain ang “sapagkat” bilang “kapag.”
    reason: Pinananatili ang literal na imahen ng Hebreo sa pangunahing teksto at inilalahad sa talababa ang legal na implikasyon ng idyoma at ang posibleng temporal na pagbasa ng כִּי.
lexical_decisions:
- source_word: וְאַתָּה
  choice: Kaya dapat mong
  rationale: Ang pang-ugnay at tahasang panghalip ay nagbibigay-diin sa pangwakas na pananagutan ng Israel. Likas sa makabagong Tagalog ang “Kaya,” at ipinahahayag ng “dapat mong” ang nag-uutos na puwersa ng kasunod na di-ganap na pandiwa.
- source_word: תְּבַעֵר
  choice: alisin
  rationale: Sa Piel at sa legal na gamit ng Deuteronomio, tumutukoy ito sa lubusang pag-aalis ng kasamaan o pananagutan mula sa sambayanan. Mas malinaw sa karaniwang mambabasa ang “alisin” kaysa “dalisayin,” na maaaring magpahiwatig ng ritwal na hindi tahasang sinasabi rito.
- source_word: הַדָּם הַנָּקִי
  choice: ang pananagutan sa pagdanak ng dugong walang sala
  rationale: Literal itong “ang dugong walang sala,” ngunit sa konteksto ng hindi nalutas na pagpatay at ng ritwal ng pagtubos, ang dugong nananatili sa gitna ng bayan ay nagpapahiwatig ng pananagutan sa bloodshed. Isinama ang “pananagutan sa pagdanak” para maging malinaw ang legal-moral na diwa, habang pinanatili sa talababa ang literal na anyo.
- source_word: מִקִּרְבֶּךָ
  choice: sa gitna ninyo
  rationale: Isahan ang gramatikal na kausap ngunit kolektibo itong tumutukoy sa Israel. Ang “sa gitna ninyo” ay natural na Tagalog at nagpapanatili sa panlahatang diwa.
- source_word: כִּי
  choice: sapagkat
  rationale: Pinanatili ang posibleng sanhi o batayan ng naunang pahayag. Ang “sapagkat” ay dignified ngunit malinaw na panandang sanhi.
- source_word: תַעֲשֶׂה
  choice: gagawin mo
  rationale: Pinanatili ang anyong hinaharap ng Hebreo. Sa kontekstong legal, maaari rin itong magkaroon ng preskriptibong puwersa, ngunit hindi iyon labis na nilinaw upang mapanatili ang tensiyon ng pahayag.
- source_word: הַיָּשָׁר
  choice: ang matuwid
  rationale: 'Substantibong gamit ng pang-uri: yaong tama o matuwid. Ang “ang matuwid” ay maikli, natural, at akma sa moral na pagsusuri.'
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ng “sa paningin” ang Hebreong talinghaga ng banal na pagsusuri, at tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh.”
theological_decisions:
- issue: Kahulugan ng “dugong walang sala” bilang dugo o pananagutan sa dugo
  choice: ang pananagutan sa pagdanak ng dugong walang sala
  alternative: ang dugong walang sala
  rationale: Sa konteksto, hindi literal na dugo lamang ang inaalis sa gitna ng Israel; ang ritwal ay may kinalaman sa pananagutang dulot ng hindi natubos na pagdanak ng dugo. Gayunman, tunay na nananatili ang konkretong imahen sa Hebreo, kaya inilagay ang literal na pagbasa sa talababa.
- issue: Ugnayan ng כִּי sa dalawang sugnay
  choice: sapagkat
  alternative: kapag
  rationale: 'Maaaring basahin ang כִּי bilang nagbibigay ng dahilan: maaalis ang pananagutan sapagkat ginagawa ng Israel ang matuwid. Posible rin ang temporal o kondisyunal na “kapag.” Pinili ang sanhi bilang mas malapit sa karaniwang pagbasa ng anyo, at itinabi ang alternatibo sa talababa.'
- issue: Pagbibigay ng banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang taglay ng teksto ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalang tipan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago at dignified na Filipino, na may kolektibong “ninyo” para sa Israel ngunit pinananatili ang isahang “mong/mo” ng Hebreong pakikipag-usap sa bayan bilang isang kabuuan. Iniwasan ang sobrang teknikal na “paglilinis sa sala sa dugo” sa pangunahing teksto; ipinaliwanag ang legal na diwa sa malinaw na pananalita at ang literal na anyo sa talababa.
