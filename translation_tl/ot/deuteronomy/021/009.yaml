  naturalness: Malinaw at may angkop na marangal na rehistro ang draft, ngunit hindi pare-pareho ang isahang kausap na “mong/mo” at maramihang “ninyo.” Mas natural at mas tapat na panatilihin ang isahang kolektibong pagtawag sa Israel sa buong talata.
