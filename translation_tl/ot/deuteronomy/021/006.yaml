    issue: Ang "batisan" ay hindi tumpak na katumbas ng נַחַל.
    rationale: Sa karaniwang gamit ng Filipino, ang batisan ay pinagmumulan ng batis. Ang Hebreo rito ay tumutukoy sa wadi o lambak/daluyan ng tubig; kaya maaaring maling mailarawan ng "batisan" ang lokasyon ng ritwal.
  - severity: low
    issue: Hindi ganap na likas ang alternatibong talababa na “sa bangkay ng pinaslang.”
    rationale: Mas malinaw ang “sa bangkay” o “sa bangkay ng taong pinaslang.”
