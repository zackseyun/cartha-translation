base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/006.yaml
  text: And all the elders of that city nearest to the slain man shall wash their hands over the heifer whose neck was broken in the wadi[a][b].
translation:
  language: tl
  text: At ang lahat ng nakatatandang pinuno ng lunsod na iyon na pinakamalapit sa pinaslang[a] ay maghuhugas ng kanilang mga kamay sa ibabaw ng dumalagang baka na binali ang leeg sa tuyong ilog.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa bangkay.” Ang salitang Hebreo ay maaaring tumukoy sa taong pinaslang o sa bangkay nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa lambak” o “sa daluyan ng tubig.” Ang salitang Hebreo ay tumutukoy sa isang wadi—isang bangin o lambak na kaugnay ng daluyan ng tubig, na maaaring pana-panahon lamang ang agos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: At ang lahat
  rationale: Ipinagpapatuloy ng pang-ugnay ang itinakdang pamamaraan, at malinaw na ipinahihiwatig ng כֹּל na kabilang ang buong pangkat.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: matatandang pinuno ng lunsod na iyon
  rationale: Ang זִקְנֵי ay tumutukoy sa mga nakatatandang namumuno sa pamayanan, hindi lamang sa matatanda ayon sa edad; pinananatili ng “iyon” ang tiyak na pantukoy.
- source_word: הַקְּרֹבִים אֶל הֶחָלָל
  choice: na pinakamalapit sa napatay
  rationale: Ipinahahayag ng parirala ang heograpikong lapit sa taong pinaslang o sa bangkay nito. Likas sa Tagalog ang “napatay” at nananatiling lantad ang konteksto ng pagpatay.
- source_word: יִרְחֲצוּ אֶת יְדֵיהֶם
  choice: ay maghuhugas ng kanilang mga kamay
  rationale: Ang imperfect ay may preskriptibong gamit sa legal na tagubilin. Sa Tagalog, sapat na naihahayag ng anyong panghinaharap sa kontekstong ito ang itinakdang kilos.
- source_word: עַל
  choice: sa ibabaw ng
  rationale: Pinananatili nito ang posisyon ng paghuhugas ng mga kamay kaugnay ng hayop at hindi ito pinapalabo bilang simpleng paghuhugas sa tabi nito.
- source_word: הָעֶגְלָה
  choice: dum alagang baka
  rationale: Ang עֶגְלָה ay batang babaeng baka. Ang “dumalagang baka” ang maikli at tiyak na katumbas sa makabagong Tagalog.
- source_word: הָעֲרוּפָה
  choice: na binali ang leeg
  rationale: Sa ritwal na ito, ipinahihiwatig ng ערף ang pagbalì sa leeg sa halip na karaniwang pagkatay; iniiwasan din ng salin ang di-tiyak na ideya ng pagpugot gamit ang patalim.
- source_word: בַנָּחַל
  choice: sa batisan
  rationale: Maaaring tumukoy ang נַחַל sa bangin, lambak, o higaan ng pana-panahong daluyan ng tubig. Ang “batisan” ay maikli at madaling maunawaan, habang inilalahad sa talababa ang saklaw ng salitang Hebreo.
