  source_fidelity: Kailangan ng maliit ngunit mahalagang pagwawasto sa "batisan." Ang נַחַל ay tumutukoy sa isang wadi, lambak, o daluyan ng tubig, samantalang ang "batisan" ay karaniwang pinagmumulan ng batis at hindi ang tinutukoy na lugar sa Hebreo.
  naturalness: Natural ang pangungusap sa kabuuan. Mas malinaw at mas tumpak sa makabagong Filipino ang "tuyong ilog" para sa wadi kaysa "batisan." Ang "mga nakatatandang pinuno" ay natural at ipinapakita ang tungkuling sibiko ng mga elder.
  terminology: Ang "pinaslang" ay mas tuwirang tumutugma sa חָלָל kaysa sa mas malawak na "napatay." Pinananatili ng "dumalagang baka" ang kasarian at kabataang ipinahihiwatig ng עֶגְלָה, at ng "na binali ang leeg" ang ritwal na paraan ng pagpatay.
