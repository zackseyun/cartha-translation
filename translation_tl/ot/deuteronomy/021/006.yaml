translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog ang ginamit. Ang “matatandang pinuno” ay nagpapalinaw sa tungkuling sibiko ng mga elder, at ang ayos ng pangungusap ay nagpapanatili sa legal at ritwal na tono nang hindi nagiging lipas o labis na teknikal.
