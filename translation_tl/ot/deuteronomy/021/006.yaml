revisions:
- from: At ang lahat ng matatandang pinuno ng lunsod na iyon na pinakamalapit sa napatay[a] ay maghuhugas ng kanilang mga kamay sa ibabaw ng dumalagang baka na binali ang leeg sa batisan.[b]
  to: At ang lahat ng nakatatandang pinuno ng lunsod na iyon na pinakamalapit sa pinaslang[a] ay maghuhugas ng kanilang mga kamay sa ibabaw ng dumalagang baka na binali ang leeg sa tuyong ilog.[b]
  rationale: Pinalitan ang "batisan" ng "tuyong ilog" upang katawanin ang topograpikong diwa ng wadi nang hindi ito napagkakamalang bukal o pinagmumulan ng batis. Ginawang "pinaslang" ang pangunahing salin ng חָלָל upang maging mas tiyak ang ugnayan sa konteksto ng pagpatay. Inayos din ang talababa a para sa likas at eksaktong alternatibo.
