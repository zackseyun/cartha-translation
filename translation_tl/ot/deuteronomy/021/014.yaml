  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֞ה אִם לֹ֧א חָפַ֣צְתָּ בָּ֗/הּ וְ/שִׁלַּחְתָּ/הּ֙ לְ/נַפְשָׁ֔/הּ וּ/מָכֹ֥ר לֹא תִמְכְּרֶ֖/נָּה בַּ/כָּ֑סֶף לֹא תִתְעַמֵּ֣ר בָּ֔/הּ תַּ֖חַת אֲשֶׁ֥ר עִנִּיתָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/014.yaml
  text: But if it happens that you do not delight in her[a], then you shall let her go where she wishes; you must certainly not sell her for money. You must not treat her as merchandise[c][b], because you have humiliated her.
translation:
  language: tl
  text: Ngunit kung hindi ka nalulugod sa kanya, palayain mo siya[a]. Huwag na huwag mo siyang ipagbili kapalit ng salapi. Huwag mo siyang ituring na paninda[b], sapagkat ipinahiya mo siya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “paalisin mo siya para sa sarili niya,” na nangangahulugang malaya siyang umalis at mamuhay ayon sa sarili niyang pasiya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “Huwag mo siyang pagsamantalahan para pagkakitaan.” Bihira ang pandiwang Hebreo at malamang na tumutukoy sa pagtrato sa kanya bilang isang bagay na magagamit sa pakinabang na pangkabuhayan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “sapagkat nilabag mo siya.” Ang salitang Hebreo ay maaaring mangahulugang pinahirapan, ipinahiya, o nilabag sa paraang seksuwal, depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Ngunit kung
  rationale: Likas na panimula ng kondisyong kasalungat ng naunang itinakda; hindi kailangang tahasang isalin ang idyomatikong וְהָיָה bilang “mangyayari.”
- source_word: לֹא חָפַצְתָּ בָּהּ
  choice: hindi ka nalulugod sa kanya
  rationale: Pinananatili ng “nalulugod” ang personal at damdaming diwa ng חפץ nang hindi idinaragdag ang “hindi na,” na wala sa Hebreo.
- source_word: וְשִׁלַּחְתָּהּ לְנַפְשָׁהּ
  choice: palayain mo siya
  rationale: Ang literal na “paalisin siya para sa sarili niya” ay idyoma ng pagpapalaya upang makapamuhay siya ayon sa sarili niyang pasiya.
- source_word: וּמָכֹר לֹא תִמְכְּרֶנָּה בַּכָּסֶף
  choice: Huwag na huwag mo siyang ipagbili kapalit ng salapi
  rationale: Ipinahahayag ng “huwag na huwag” ang diin ng infinitive absolute na kasama ng pandiwa; malinaw na modernong katumbas ng כסף ang “salapi.”
- source_word: לֹא תִתְעַמֵּר בָּהּ
  choice: Huwag mo siyang ituring na paninda
  rationale: Bihira ang pandiwa, ngunit sa pagkakapantay nito sa pagbabawal na ipagbili siya, malamang na tumutukoy ito sa mapagsamantalang pagtrato sa kanya bilang bagay na mapagkakakitaan.
- source_word: תַּחַת אֲשֶׁר
  choice: sapagkat
  rationale: Natural at marangal na panandang sanhi sa Tagalog.
- source_word: עִנִּיתָהּ
  choice: ipinahiya mo siya
  rationale: Sinasalamin nito ang paghamak at pinsalang ipinahihiwatig ng piel ng ענה, habang hindi nililimitahan sa isang mas tiyak na legal na kahulugan ang malawak na salitang Hebreo.
theological_decisions:
- issue: Etikal na puwersa ng batas tungkol sa babaeng bihag
  choice: 'Ipinapakita ang paglilimita sa kapangyarihan ng lalaki: dapat niyang palayain ang babae at hindi siya maaaring ipagbili o gawing paninda.'
  alternative: Ipahiwatig na isa lamang itong diborsiyong may pagsang-ayon, o tahasang tawaging panggagahasa sa pangunahing teksto ang naunang ginawa.
  rationale: Kinokontrol mismo ng talata ang pagpapalaya at ipinagbabawal ang komodipikasyon dahil siya ay ipinahiya o nilabag. Pinananatili ng salin ang bigat at puwersahang konteksto nang hindi pinapahina iyon o ginagawang mas tiyak kaysa sa salitang Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “salapi” at “sapagkat” para sa dignidad ng legal na pahayag, ngunit iniwasan ang lipas o labis na teknikal na pananalita. Nakapuwesto ang bawat talababa kaagad sa pariralang nililinaw nito.
