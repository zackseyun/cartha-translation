revisions:
- from: Aalisin niya ang damit na suot niya nang siya'y mabihag[a] at mananatili siya sa iyong bahay. Iiyakan niya ang kanyang ama at ina sa loob ng isang buong buwan. Pagkatapos, maaari mo na siyang sipingan at maging asawa niya, at siya ay magiging asawa mo.
  to: Aalisin niya ang damit ng kanyang pagkabihag na suot niya[a], at mananatili siya sa iyong bahay. Iiyakan niya ang kanyang ama at ina sa loob ng isang buong buwan. Pagkatapos, maaari mo nang makipagsiping sa kanya at maging asawa niya, at siya ay magiging asawa mo.
