  text: וְ/הֵסִ֩ירָה֩ אֶת שִׂמְלַ֨ת שִׁבְיָ֜/הּ מֵ/עָלֶ֗י/הָ וְ/יָֽשְׁבָה֙ בְּ/בֵיתֶ֔/ךָ וּ/בָֽכְתָ֛ה אֶת אָבִ֥י/הָ וְ/אֶת אִמָּ֖/הּ יֶ֣רַח יָמִ֑ים וְ/אַ֨חַר כֵּ֜ן תָּב֤וֹא אֵלֶ֨י/הָ֙ וּ/בְעַלְתָּ֔/הּ וְ/הָיְתָ֥ה לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/013.yaml
  text: She shall remove the clothing of her captivity from herself and remain in your house[a], and mourn her father and her mother for a month of days. After that you may go in to her and be her husband, and she shall be your wife.
translation:
  language: tl
  text: Aalisin niya ang damit ng kanyang pagkabihag na suot niya[a], at mananatili siya sa iyong bahay. Iiyakan niya ang kanyang ama at ina sa loob ng isang buong buwan. Pagkatapos, maaari mo nang makipagsiping sa kanya at maging asawa niya, at siya ay magiging asawa mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang damit na suot niya nang siya’y mabihag.” Literal na “ang damit ng kanyang pagkabihag”; maaari itong tumukoy sa damit na kaugnay ng kanyang kalagayan bilang bihag.
    reason: Pinananatili ng pangunahing teksto ang hindi tiyak na Hebreong genitibo, habang ibinibigay ang posibleng mas pagpapaliwanag na pagbasa.
lexical_decisions:
- source_word: וְהֵסִירָה
  choice: Aalisin niya
  rationale: Ang Hiphil ng סור ay nagsasaad ng pag-aalis; malinaw at likas sa modernong Tagalog ang “aalisin niya.”
- source_word: שִׂמְלַת שִׁבְיָהּ
  choice: ang damit na suot niya nang siya'y mabihag
  rationale: Literal itong “damit ng kanyang pagkabihag.” Inilalahad ng salin ang malamang na kahulugan nang hindi tiyakang ipinapalagay na iyon ay natatanging uniporme o tanda ng pagiging bihag; pinananatili sa talababa ang mas literal na mga alternatibo.
- source_word: מֵעָלֶיהָ
  choice: '[nakapaloob sa] aalisin niya ang damit na suot niya'
  rationale: Literal na “mula sa ibabaw niya.” Hindi na kailangang ulitin bilang “mula sa kanyang katawan” dahil likas na ipinahihiwatig iyon ng pag-aalis ng suot na damit.
- source_word: וְיָשְׁבָה בְּבֵיתֶךָ
  choice: at mananatili siya sa iyong bahay
  rationale: Saklaw ng ישב ang pag-upo, paninirahan, o pananatili. Ang “mananatili” ay angkop sa legal na konteksto at natural sa Tagalog.
- source_word: וּבָכְתָה אֶת אָבִיהָ וְאֶת אִמָּהּ
  choice: Iiyakan niya ang kanyang ama at ina
  rationale: Ang בכה ay pangunahing “umiyak.” Sa Tagalog, ang “iiyakan” ay likas na nagpapahayag ng pagdadalamhati para sa mga taong binanggit at hindi lumalayo sa mismong pandiwa.
- source_word: יֶרַח יָמִים
  choice: sa loob ng isang buong buwan
  rationale: Ang literal na “isang buwan ng mga araw” ay idyomang tumutukoy sa buong takdang isang buwan. Pinananatili ng “isang buong buwan” ang diin at natural na Tagalog.
- source_word: תָּבֹא אֵלֶיהָ
  choice: maaari mo na siyang sipingan
  rationale: Ang Hebreong idyomang “pumasok sa kanya” ay tumutukoy sa pakikipagtalik. Ang “sipigan” ay malinaw ngunit marangal na katumbas sa Tagalog; ang “maaari” ay nagpapakita ng pahintulot sa legal na konteksto.
- source_word: וּבְעַלְתָּהּ
  choice: at maging asawa niya
  rationale: Sa kontekstong ito, ang בעל ay tumutukoy sa pagpasok sa papel o katayuan ng isang asawang lalaki. Iniiwasan ng salin ang mapanlinlang na diwa ng pag-aari.
- source_word: וְהָיְתָה לְךָ לְאִשָּׁה
  choice: at siya ay magiging asawa mo
  rationale: Tuwirang pinananatili ang pormulang pangmag-asawa at ang kalagayang ibinubunga nito.
theological_decisions:
- issue: Seksuwal at pangmag-asawang pananalita sa mahirap na batas tungkol sa babaeng bihag
  choice: Panatilihing magkahiwalay ang pagsiping at ang tahasang katayuang pangmag-asawa.
  alternative: Pagsamahin ang dalawa bilang “pakasalan mo siya,” o gawing mas tahasan bilang “makipagtalik ka sa kanya.”
  rationale: Magkahiwalay sa Hebreo ang paglapit na seksuwal (תָּבֹא אֵלֶיהָ), ang pagiging asawa niya (וּבְעַלְתָּהּ), at ang pagiging asawa ng babae sa lalaki. Ang salin ay hindi nagpapalambot sa teksto bilang romansa at hindi rin nagdaragdag ng paghatol o paliwanag na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sipingan” upang maipahayag nang malinaw ngunit hindi magaspang ang Hebreong seksuwal na idyoma. Ang “asawa” ay sadyang inuulit upang mapanatili ang dalawang magkaugnay ngunit magkahiwalay na sugnay ng Hebreo.
