  text: וְ/הָיָ֗ה בְּ/יוֹם֙ הַנְחִיל֣/וֹ אֶת בָּנָ֔י/ו אֵ֥ת אֲשֶׁר יִהְיֶ֖ה ל֑/וֹ לֹ֣א יוּכַ֗ל לְ/בַכֵּר֙ אֶת בֶּן הָ֣/אֲהוּבָ֔ה עַל פְּנֵ֥י בֶן הַ/שְּׂנוּאָ֖ה הַ/בְּכֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/016.yaml
  text: And on the day he gives his sons as an inheritance what belongs to him[a], he may not treat the son of the loved wife as firstborn over the son of the hated wife, who is the firstborn.
translation:
  language: tl
  text: At sa araw na ipamamana niya sa kanyang mga anak ang kanyang ari-arian, hindi niya maaaring italaga bilang panganay ang anak ng asawang minamahal sa halip na ang anak ng asawang kinapopootan[a], na siyang panganay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anak ng asawang hindi minamahal” o “anak ng asawang di-gaanong minamahal.” Literal na pinagtatapat sa Hebreo ang “minamahal” at “kinapopootan,” ngunit sa kontekstong pambatas tungkol sa pamilya, ang huli ay maaaring tumukoy sa asawang hindi gaanong pinapaboran sa halip na aktibong kinamumuhian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: At sa araw na
  rationale: Pinananatili ang legal at pansamantalang balangkas ng Hebreo sa isang natural ngunit marangal na pariralang Tagalog.
- source_word: הַנְחִילוֹ אֶת בָּנָיו אֵת אֲשֶׁר יִהְיֶה לוֹ
  choice: ipamamana niya sa kanyang mga anak ang lahat ng pag-aari niya
  rationale: Ipinahahayag ang causative na diwa ng נחל at ang hiwalay na layon na 'kung ano ang pag-aari niya' nang malinaw at natural sa Tagalog.
- source_word: לֹא יוּכַל
  choice: hindi niya maaaring
  rationale: Sa kontekstong pambatas, nagpapahayag ito ng pagbabawal o kawalan ng karapatang legal, hindi lamang kawalan ng kakayahan.
- source_word: לְבַכֵּר
  choice: ituring na panganay
  rationale: Ipinahahayag ang pagkakaloob ng katayuan o karapatan ng panganay nang hindi labis na pinapalawak ang Hebreo.
- source_word: בֶּן הָאֲהוּבָה
  choice: ang anak ng minamahal na asawa
  rationale: Tuwirang pinananatili ang 'minamahal'; ang 'asawa' ay makatuwirang nilinaw mula sa konteksto ng naunang talata.
- source_word: עַל פְּנֵי
  choice: kaysa sa
  rationale: Natural na ipinapakita sa Tagalog ang paghahambing at pagtatangi o pagbibigay-priyoridad na ipinahihiwatig ng parirala.
- source_word: בֶן הַשְּׂנוּאָה
  choice: ang anak ng kinapopootang asawa
  rationale: Pinananatili sa pangunahing teksto ang matinding literal na salungatan ng 'minamahal' at 'kinapopootan,' habang inilalahad sa talababa ang posibleng pahambing na diwa.
- source_word: הַבְּכֹר
  choice: na siyang panganay
  rationale: Nililinaw na ang anak ng kinapopootang asawa ang tunay na panganay.
theological_decisions:
- issue: Ang salungatan ng ugnayan sa batas para sa sambahayang may dalawang asawa
  choice: Panatilihin sa pangunahing teksto ang 'minamahal na asawa' at 'kinapopootang asawa.'
  alternative: '''minamahal'' at ''di-gaanong minamahal'' o ''hindi paboritong asawa'''
  rationale: Gumagamit ang Hebreo ng matinding magkasalungat na mga salita. Hindi ito dapat tahimik na palambutin, ngunit dapat ding kilalanin sa talababa na sa ganitong kontekstong pampamilya at pambatas maaari itong tumukoy sa paghahambing ng antas ng pagmamahal o pagtatangi.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'ipamamana' para sa legal na pamamahagi ng ari-arian at pinanatili ang matinding leksikal na salungatan ng Hebreo, kalakip ang paliwanag sa talababa.
