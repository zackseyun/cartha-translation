  - severity: medium
    issue: May idinagdag na “lahat” sa saklaw ng ari-arian.
    rationale: Ang Hebreo ay tumutukoy sa “kung ano ang mayroon sa kanya / ang kanyang pag-aari” at hindi tahasang gumagamit ng salitang nangangahulugang “lahat.”
  - severity: low
    issue: Maaaring linawin ang legal na pagpapalit ng karapatan ng panganay.
    rationale: Ang “italaga bilang panganay ... sa halip na ...” ay mas eksaktong naghahayag ng legal na pagkiling na ipinagbabawal ng לְבַכֵּר ... עַל־פְּנֵי kaysa “ituring na panganay ... kaysa sa.”
