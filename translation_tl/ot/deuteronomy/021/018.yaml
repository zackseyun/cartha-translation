base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/018.yaml
  text: If a man has a stubborn and rebellious son who does not listen to the voice of his father or to the voice of his mother[a], and though they discipline him, he does not listen to them[d][c][b],
translation:
  language: tl
  text: Kung ang isang lalaki ay may anak na lalaking matigas ang ulo at mapaghimagsik, na hindi sumusunod sa sinasabi ng kanyang ama o ng kanyang ina,[a] at kahit dinidisiplina nila siya, hindi pa rin siya sumusunod sa kanila,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kapag ang isang lalaki ay may anak na lalaki…” Maaaring isalin ang pormulang legal sa Hebreo bilang “kung” o “kapag.”
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, ang “makinig sa tinig” ay maaaring magpahiwatig ng pakikinig na may pagtalima sa tagubilin. Tuwirang “at dinidisiplina nila siya” ang pang-ugnay sa Hebreo; ngunit sinusuportahan ng konteksto ang concessive na “kahit dinidisiplina nila siya.”
    reason: lexical_and_syntactical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Nagsisimula ito ng isang kasong legal; natural sa modernong Filipino ang “kung,” bagaman maaari ring unawaing “kapag.”
- source_word: יִהְיֶה לְאִישׁ
  choice: ang isang lalaki ay may
  rationale: Ang literal na konstruksiyong Hebreo na “mayroon sa isang lalaki” ay isang karaniwang paraan ng pagpapahayag ng pagmamay-ari.
- source_word: בֵּן
  choice: anak na lalaki
  rationale: Tiyak na anak na lalaki ang tinutukoy ng pangngalang Hebreo, hindi anak sa pangkalahatan.
- source_word: סוֹרֵר וּמוֹרֶה
  choice: matigas ang ulo at mapaghimagsik
  rationale: Pinananatili ang tambalang paglalarawan ng paulit-ulit na pagmamatigas at hayagang pagsalungat.
- source_word: אֵינֶנּוּ שֹׁמֵעַ
  choice: hindi sumusunod
  rationale: Sa kontekstong ito, ang “pakikinig” ay may diwang pagtalima; mas natural at malinaw sa Filipino ang “sumusunod.”
- source_word: בְּקוֹל אָבִיו וּבְקוֹל אִמּוֹ
  choice: sa sinasabi ng kanyang ama o ng kanyang ina
  rationale: Ang literal na “sa tinig” ay idyoma para sa makapangyarihang tagubilin. Sa ilalim ng pagtanggi, natural sa Filipino ang “o,” kahit “at” ang pang-ugnay sa Hebreo.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: at kahit dinidisiplina nila siya
  rationale: Ang pandiwa ay tumutukoy sa pagtutuwid o pagdidisiplina. Ipinahihiwatig ng konteksto ang pagpap concessive na diwa, ngunit pinanatili rin ang pang-ugnay sa natural na pariralang “at kahit.”
- source_word: וְלֹא יִשְׁמַע אֲלֵיהֶם
  choice: ay hindi pa rin siya sumusunod sa kanila
  rationale: Inuulit ng Hebreo ang pandiwang “makinig”; ang “hindi pa rin” ay natural na naghahayag ng patuloy na hindi pagtalima matapos disiplinahin.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anak na lalaki” para sa katumpakan, “mapaghimagsik” para sa aktibong pagsalungat, at “sumusunod” upang natural na maipahayag ang idyomang Hebreo tungkol sa pakikinig na may pagtalima.
