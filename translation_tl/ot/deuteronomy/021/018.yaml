  rationale: Inayos ang bantas at ayos ng ikalawang sugnay para sa mas natural na Filipino, nang pinananatili ang concessive na pagbasa na katanggap-tanggap sa konteksto. Nilinaw rin ang talababa upang maipakita na ang “kahit” ay kontekstuwal na pagbasa ng Hebreong pang-ugnay, hindi ang tanging literal na kahulugan nito.
