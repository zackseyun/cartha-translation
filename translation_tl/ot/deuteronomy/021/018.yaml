- from: Kung ang isang lalaki ay may anak na lalaking matigas ang ulo at mapaghimagsik, na hindi sumusunod sa sinasabi ng kanyang ama o ng kanyang ina,[a] at kahit dinidisiplina nila siya ay hindi pa rin siya sumusunod sa kanila,[b]
