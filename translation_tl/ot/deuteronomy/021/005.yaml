base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/005.yaml
  text: And the priests[a], the sons of Levi, shall come forward, for Yahweh your God has chosen them to minister to him and to bless in the name of Yahweh, and by their word every dispute and every injury shall be settled.
translation:
  language: tl
  text: At lalapit ang mga pari, ang mga anak ni Levi, sapagkat pinili sila ni Yahweh na iyong Diyos upang maglingkod sa kanya at magbasbas sa pangalan ni Yahweh. Ayon sa kanilang pasya ay lulutasin ang bawat alitan at bawat pinsala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bawat hampas,” “bawat sugat,” o “bawat salot.” Malawak ang kahulugan ng salitang Hebreo; sa kontekstong legal, malamang na tumutukoy ito sa mga usaping may kinalaman sa pinsalang pisikal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְּשׁוּ
  choice: At lalapit
  rationale: Ang Niphal ng נגשׁ ay tumutukoy sa pormal na paglapit ng mga pari upang gampanan ang kanilang tungkulin sa ritwal at usaping legal.
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: ang mga pari, ang mga anak ni Levi
  rationale: Pinananatili nito ang appositional na ayos ng Hebreo at malinaw na inuugnay ang mga pari kay Levi.
- source_word: כִּי בָם בָּחַר
  choice: sapagkat sila ang pinili
  rationale: Ipinahahayag ng כִּי ang dahilan ng kanilang awtoridad, at ng perpektong pandiwa ang naunang pagpiling may patuloy na bisa.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Direktang pinananatili ang tipanang pangalan na יְהוָה at ang personal na pormulang 'iyong Diyos.'
- source_word: לְשָׁרְתוֹ
  choice: upang maglingkod sa kanya
  rationale: Natural sa modernong Tagalog ang 'maglingkod' at saklaw nito ang sagradong paglilingkod ng mga pari.
- source_word: וּלְבָרֵךְ בְּשֵׁם יְהוָה
  choice: at magbasbas sa pangalan ni Yahweh
  rationale: Ipinakikita ng 'sa pangalan' na isinasagawa ang pagbabasbas sa kapahintulutan at awtoridad ni Yahweh.
- source_word: וְעַל פִּיהֶם
  choice: Sa kanilang pasya
  rationale: Ang literal na 'ayon sa kanilang bibig' ay idyoma para sa makapangyarihang kapahayagan o pasyang binibigkas; malinaw ang legal na diwa ng 'pasya.'
- source_word: יִהְיֶה כָּל רִיב וְכָל נָגַע
  choice: lulutasin ang bawat alitan at bawat pinsala
  rationale: Sa kontekstong legal, ipinahihiwatig ng יִהְיֶה na ang mga usapin ay pagpapasyahan o lulutasin; natural na ipinapahayag ito sa Tagalog sa anyong pasibo.
- source_word: כָּל רִיב
  choice: bawat alitan
  rationale: Saklaw ng 'alitan' ang legal na pagtatalo o kontrobersiya nang hindi ito nililimitahan sa pormal na kaso.
- source_word: וְכָל נָגַע
  choice: at bawat pinsala
  rationale: Mas malawak ang נֶגַע kaysa 'pananakit' at maaari itong tumukoy sa hampas, sugat, pinsala, o salot; ang 'pinsala' ay angkop sa legal na konteksto nang hindi labis na nagpapakahulugan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Nasa tekstong Hebreo ang Tetragrammaton bilang personal na tipanang pangalan; pinananatili ng 'Yahweh' ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng awtoridad ng mga pari sa huling sugnay
  choice: Sa kanilang pasya lulutasin ang bawat alitan at bawat pinsala
  alternative: Sa kanilang salita pagpapasyahan ang bawat alitan at bawat pinsala
  rationale: Ipinapakita ang legal na bisa ng kanilang kapahayagan nang hindi ipinapalagay na sila lamang ang nagsasagawa ng buong paglilitis o na walang ibang kalahok sa proseso.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal na legal at panrelihiyong tono, iniwasan ang arkaikong balangkas, at inilagay ang kinakailangang panandang [a] sa pangunahing teksto.
