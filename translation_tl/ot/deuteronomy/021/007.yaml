  text: Pagkatapos, sasagot sila at sasabihin, “Hindi ibinuhos ng aming mga kamay ang dugong ito[a], at hindi ito nakita ng aming mga mata.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “dugong ito.” Isa itong legal na idyoma na nagkakaila ng pananagutan sa pagpatay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi namin ito nasaksihan.” Ginagamit ng Hebreo ang kongkretong pananalitang “hindi nakita ng aming mga mata” upang ikaila ang kaalamang bunga ng pagiging saksi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ וְאָמְרוּ
  choice: Pagkatapos, sasagot sila at sasabihin
  rationale: Ang magkatambal na pandiwa ay pormulang ginagamit sa isang hayag at pormal na tugon. Ipinahihiwatig ng “Pagkatapos” ang pagkakasunod-sunod ng itinakdang seremonya, samantalang pinananatili ng “sasagot … at sasabihin” ang dalawang pandiwa ng Hebreo.
- source_word: יָדֵינוּ
  choice: ang aming mga kamay
  rationale: Pinananatili ang kongkretong pananalita tungkol sa bahagi ng katawan; ang “mga kamay” ay tumutukoy sa tuwirang pagkilos at pananagutan.
- source_word: לֹא שָׁפְכָה אֶת־הַדָּם הַזֶּה
  choice: Hindi nagbubo ng dugong ito
  rationale: Ang שפך na may דם ay karaniwang idyoma para sa pagbububo ng dugo o pagpatay. Pinananatili ng “dugong ito” ang tiyak at kongkretong bagay ng pahayag sa Hebreo sa halip na tahasang palitan ito ng “pagpatay na ito.”
- source_word: וְעֵינֵינוּ לֹא רָאוּ
  choice: at hindi ito nakita ng aming mga mata
  rationale: Pinananatili ang “aming mga mata” bilang kongkretong pagtanggi sa pagkakita o kaalamang mula sa pagiging saksi. Idinagdag ang “ito” ayon sa likas na balarila ng Tagalog, na tumutukoy sa pangyayaring pinag-uusapan.
