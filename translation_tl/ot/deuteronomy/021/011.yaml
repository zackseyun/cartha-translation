base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/011.yaml
  text: and you see among the captives a woman beautiful in form[a], and you desire her and take her for yourself as a wife[b],
translation:
  language: tl
  text: at makita mo sa mga bihag ang isang babaeng may magandang anyo[a], at magnasa ka sa kanya at kunin mo siya bilang asawa mo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang babaeng maganda ang hitsura.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kunin mo siya para sa iyong sarili bilang asawa,” isang idyoma para sa pag-aasawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רָאִיתָ
  choice: at makita mo
  rationale: Sa kasunod na sugnay ng kasong legal, ang Qal perfect na 2ms ay may kondisyunal o pangyayaring diwa. Natural sa Filipino ang pang-ugnay na “at makita mo,” na umaayon sa naunang konteksto ng “kapag.”
- source_word: בַּ/שִּׁבְיָה
  choice: sa mga bihag
  rationale: Ang pangngalan ay tumutukoy sa pangkat ng mga nabihag sa digmaan. Ang “sa mga bihag” ay natural at hindi nagdaragdag ng mas tiyak na katawagang wala sa Hebreo.
- source_word: אֵשֶׁת יְפַת תֹּאַר
  choice: isang babaeng maganda ang anyo
  rationale: Pinananatili nito ang tahasang pagtukoy ng Hebreo sa panlabas na anyo, habang natural at marangal ang tunog sa modernong Filipino.
- source_word: תֹּאַר
  choice: anyo
  rationale: Ang תֹּאַר ay tumutukoy sa panlabas na hubog o hitsura. Ang “anyo” ay malapit sa pormal na kahulugan at mas natural dito kaysa “hugis” o “porma.”
- source_word: וְ/חָשַׁקְתָּ בָהּ
  choice: at pagnasaan mo siya
  rationale: Ipinahahayag ng חָשַׁק ang matinding pagnanasa o pagkahumaling. Hindi pinahihina ng “pagnasaan” ang puwersa nito tungo sa simpleng pagkagusto lamang.
- source_word: וְ/לָקַחְתָּ לְ/ךָ לְ/אִשָּׁה
  choice: at kunin mo siya upang maging asawa mo
  rationale: Pinananatili ng “kunin” ang anyo ng idyomang Hebreo, samantalang nililinaw ng “upang maging asawa mo” ang kahulugang pag-aasawa at ang personal na diwa ng לְךָ.
theological_decisions:
- issue: Paglalahad ng isang mahirap na batas tungkol sa digmaan nang hindi pinapaganda o dinaragdagan ng hatol ang teksto
  choice: Panatilihin ang tuwirang paglalarawan sa pagnanasa at pagkuha sa babae bilang asawa
  alternative: Palambutin bilang “piliin mo siyang maging asawa,” o dagdagan ng tahasang paghatol o pagtukoy sa pamimilit
  rationale: Tuwirang inilalarawan ng talata ang sitwasyong legal sa panahon ng digmaan. Hindi dapat pagtakpan ng salin ang pagnanasa at pagkuha, ngunit hindi rin ito dapat dagdagan ng moral na pagpapasiyang hindi tahasang nasa talata. Sa ganitong paraan, nananatili ang etikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “bihag,” “anyo,” at “pagnasaan” upang mapanatili ang tuwiran at seryosong tono ng batas. Ang mga tandang [a] at [b] ay kapwa lumilitaw sa pangunahing teksto.
