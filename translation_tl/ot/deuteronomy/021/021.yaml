base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/021.yaml
  text: Then all the men of his city shall stone him with stones[a], and he shall die. So you shall purge the evil from your midst, and all Israel shall hear and fear.
translation:
  language: tl
  text: Pagkatapos, babatuhin siya ng lahat ng lalaki sa kanyang lungsod gamit ang mga bato, at mamamatay siya.[a] Sa gayon, aalisin ninyo ang kasamaan sa inyong kalagitnaan. Maririnig ito ng buong Israel at matatakot sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lahat ng tao sa kanyang lungsod.” Sa Hebreo, “lahat ng lalaki sa kanyang lungsod.”
    reason: Ipinapakita ang posibleng pangkalahatang salin ng אַנְשֵׁי habang pinananatili ng pangunahing teksto ang tahasang panlalaking anyo ng Hebreo.
lexical_decisions:
- source_word: וּרְגָמֻהוּ ... בָאֲבָנִים
  choice: babatuhin siya ... hanggang sa siya ay mamatay
  rationale: Ang רגם sa kontekstong panghukuman ay pagpatay sa pamamagitan ng pagbato. Likas sa modernong Filipino ang 'babatuhin ... hanggang sa mamatay' at malinaw nitong ipinapahayag ang paraan at kinalabasan nang hindi ginagawang layunin ang sugnay.
- source_word: כָּל אַנְשֵׁי עִירוֹ
  choice: lahat ng lalaki sa kanyang lungsod
  rationale: Tahasang panlalaki ang אַנְשֵׁי, kaya pinanatili ang 'mga lalaki' sa halip na gawing pangkalahatang 'mga tao.' Ang 'lungsod' ay angkop na salin ng עִיר sa dignified na modernong Filipino.
- source_word: וָמֵת
  choice: hanggang sa siya ay mamatay
  rationale: Ipinapahayag nito ang kinalabasan ng pagbato. Sa Filipino, mas natural itong ikabit sa pandiwang 'babatuhin' kaysa sa literal ngunit asiwa na 'at mamamatay siya,' habang hindi ipinapalagay na layunin ang anyong Hebreo.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: aalisin ninyo ang kasamaan sa inyong kalagitnaan
  rationale: Ang בער sa pormulang legal ng Deuteronomio ay nangangahulugang alisin o pawiin, hindi literal na sunugin. Pinananatili ng 'kasamaan' at 'sa inyong kalagitnaan' ang moral at pangkomunidad na bigat ng pormula.
- source_word: וְכָל יִשְׂרָאֵל יִשְׁמְעוּ וְיִרָאוּ
  choice: Maririnig ito ng buong Israel at matatakot sila
  rationale: Ang idinagdag na 'ito' ay kinakailangan sa likas na Filipino upang ipahiwatig ang balitang maririnig, samantalang ang 'matatakot' ay nagpapanatili sa mapigil at mapagbababalang diwa ng ירא.
theological_decisions:
- issue: Panlalaking katawagang sibiko sa kontekstong legal
  choice: lahat ng lalaki sa kanyang lungsod
  alternative: lahat ng tao sa kanyang lungsod
  rationale: Tahasang panlalaki ang Hebreo. Pinananatili ito bilang katumpakang pangkasarian nang hindi nagpapahiwatig ng doktrina tungkol sa mga tungkulin ng kasarian na lampas sa teksto.
- issue: Pormula ng pag-aalis ng kasamaan sa Deuteronomio
  choice: aalisin ninyo ang kasamaan sa inyong kalagitnaan
  alternative: lilinisin ninyo ang kasamaan mula sa gitna ninyo
  rationale: Ang 'aalisin' ay malinaw at natural na nagsasaad ng idyomatikong kahulugan ng בער sa legal na pormula. Iniiwasan nito ang maling pahiwatig ng literal na pagsunog, habang pinananatili ng 'kasamaan' ang moral na kategorya ng teksto.
translation_notes:
  register: Modernong Filipino na marangal at malinaw, na may solemneng himig na angkop sa batas. Ginamit ang pangmaramihang 'ninyo/inyong' upang maipahayag sa Filipino ang kolektibong Israel na kinakausap sa anyong ikalawang panauhang isahan sa Hebreo. Nasa pangunahing teksto ang marker na [a].
