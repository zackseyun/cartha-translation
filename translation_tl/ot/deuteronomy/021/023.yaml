  to: Huwag mong hayaang manatili magdamag sa puno ang kanyang bangkay[a]. Sa halip, tiyakin mong mailibing siya sa araw ding iyon, sapagkat ang taong ibinitin ay nasa ilalim ng sumpa ng Diyos; at huwag mong dungisan ang iyong lupain na ibinibigay sa iyo ni Yahweh na iyong Diyos bilang mana.
