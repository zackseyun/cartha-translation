  text: לֹא תָלִ֨ין נִבְלָת֜/וֹ עַל הָ/עֵ֗ץ כִּֽי קָב֤וֹר תִּקְבְּרֶ֨/נּוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי קִלְלַ֥ת אֱלֹהִ֖ים תָּל֑וּי וְ/לֹ֤א תְטַמֵּא֙ אֶת אַדְמָ֣תְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/023.yaml
  text: His corpse shall not remain all night on the tree[a], but you shall surely bury him that same day, for a hanged man is under God's curse; and you shall not defile your land that Yahweh your God is giving you as an inheritance.
translation:
  language: tl
  text: Huwag mong hayaang manatili magdamag sa puno ang kanyang bangkay[a]. Sa halip, tiyakin mong mailibing siya sa araw ding iyon, sapagkat ang taong ibinitin ay nasa ilalim ng sumpa ng Diyos; at huwag mong dungisan ang iyong lupain na ibinibigay sa iyo ni Yahweh na iyong Diyos bilang mana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang kasunod na dahilan: “sapagkat ang ibinitin ay isinumpa ng Diyos”; o, “sapagkat ang pagbitin ay paglapastangan sa Diyos.” Maikli at maaaring unawain sa higit sa isang paraan ang pariralang Hebreo.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָלִין
  choice: hayaang magdamag
  rationale: Ipinahahayag nito ang pananatili nang buong gabi, na siyang temporal na diwa ng pandiwang לון sa kontekstong ito.
- source_word: נִבְלָתוֹ
  choice: ang kanyang bangkay
  rationale: Tumpak na tumutukoy ang 'bangkay' sa patay na katawan at pinananatili ang bigat ng נְבֵלָה.
- source_word: עַל הָעֵץ
  choice: sa puno
  rationale: Ang עֵץ ay karaniwang 'puno' o kahoy; pinananatili ng 'sa puno' ang payak na larawan at ang pananalitang umuugnay sa mga sumunod na tekstong biblikal.
- source_word: קָבוֹר תִּקְבְּרֶנּוּ
  choice: tiyakin mong mailibing siya
  rationale: Isinasalin nito sa natural na makabagong Tagalog ang mariing utos na ipinahahayag ng infinitive absolute at imperfect.
- source_word: בַּיּוֹם הַהוּא
  choice: sa araw ding iyon
  rationale: Natural itong Tagalog para sa kahilingang mailibing siya bago matapos ang mismong araw na iyon.
- source_word: קִלְלַת אֱלֹהִים
  choice: sumpa ng Diyos
  rationale: Pinananatili nito ang maikli at genitibong anyo ng Hebreo nang hindi lubusang nilulutas kung ito ay sumpang mula sa Diyos, kalagayang isinumpa ng Diyos, o paglapastangan sa Diyos.
- source_word: תָלוּי
  choice: ang taong ibinitin
  rationale: Ang passive participle ay tumutukoy sa isang taong nakabitin o ibinitin; malinaw at natural ito sa Tagalog.
- source_word: תְטַמֵּא
  choice: durungisan
  rationale: Pinananatili nito ang ritwal at moral na pahiwatig ng pagpaparumi sa lupa.
- source_word: אַדְמָתְךָ
  choice: ang lupain
  rationale: Sa konteksto ng lupaing ipinagkakaloob bilang mana, mas angkop ang 'lupain' kaysa 'lupa' o 'lupang-taniman.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: נַחֲלָה
  choice: bilang mana
  rationale: Natural at tumpak nitong ipinahahayag ang lupa bilang minanang pag-aari na ipinagkaloob sa Israel.
theological_decisions:
- issue: Kahulugan ng כִּי קִלְלַת אֱלֹהִים תָּלוּי
  choice: ang taong ibinitin ay nasa ilalim ng sumpa ng Diyos
  alternative: ang ibinitin ay isinumpa ng Diyos; o ang pagbitin ay paglapastangan sa Diyos
  rationale: Siksik at maaaring unawain sa higit sa isang paraan ang pariralang Hebreo. Ang pangunahing salin ay malinaw sa Tagalog at umaangkop sa dahilan ng agarang paglilibing, samantalang pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang tuwirang utos ngunit iniwasan ang labis na arkaikong pananalita. Inilagay ang talababa sa 'puno' upang maipaliwanag ang magkakaibang pagbasa sa kasunod na sugnay, alinsunod sa ibinigay na marker.
