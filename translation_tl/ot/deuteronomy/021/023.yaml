  source_fidelity: Tumpak ang pangunahing kahulugan at napananatili ang kalabuan ng קִלְלַת אֱלֹהִים sa talababa. Gayunman, ang pangwakas na sugnay na “Sa gayon, hindi mo durungisan” ay hindi tuwirang naihahatid ang anyong pautos ng Hebreo; dapat itong maging tahasang pagbabawal.
  naturalness: May bahagyang di-natural na ayos ang “Huwag hayaang magdamag sa puno ang kanyang bangkay.” Mas malinaw at natural ang “Huwag mong hayaang manatili magdamag sa puno ang kanyang bangkay.” Ang binagong pangwakas na utos ay mas natural din sa modernong Tagalog.
  terminology: Ang “bangkay,” “puno,” “sumpa ng Diyos,” “durungisan,” “lupain,” “Yahweh,” at “mana” ay angkop. Nananatiling maingat ang “nasa ilalim ng sumpa ng Diyos,” samantalang idinodokumento ng talababa ang iba pang maaaring pagbasa.
