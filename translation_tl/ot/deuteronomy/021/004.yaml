  text: וְ/הוֹרִ֡דוּ זִקְנֵי֩ הָ/עִ֨יר הַ/הִ֤וא אֶת הָֽ/עֶגְלָה֙ אֶל נַ֣חַל אֵיתָ֔ן אֲשֶׁ֛ר לֹא יֵעָבֵ֥ד בּ֖/וֹ וְ/לֹ֣א יִזָּרֵ֑עַ וְ/עָֽרְפוּ שָׁ֥ם אֶת הָ/עֶגְלָ֖ה בַּ/נָּֽחַל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/004.yaml
  text: Then the elders of that city shall bring the heifer down to a perennial wadi[a], which is neither worked nor sown, and there in the wadi they shall break the heifer’s neck.
translation:
  language: tl
  text: Pagkatapos, dadalhin ng mga nakatatanda ng lunsod na iyon ang dumalagang baka pababa sa isang lambak na may batis na hindi natutuyo[a], na hindi binubungkal ni hinahasikan. At doon sa lambak, babaliin nila ang leeg ng dumalagang baka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang pariralang Hebreo bilang “sa isang bangin na may palagiang agos.” Posible rin ang tradisyonal na unawang “sa isang matibay o masungit na lambak.”
    reason: Pinananatili ang leksikal na kalabuan ng נַחַל אֵיתָן, na maaaring tumukoy sa namamalaging agos o sa katangian ng lambak.
lexical_decisions:
- source_word: וְהוֹרִדוּ
  choice: dadalhin ... pababa
  rationale: Pinananatili nito ang causative na diwa ng Hiphil ng ירד at ang pagdadala sa mas mababang lambak o daluyan ng tubig.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: ang matatanda ng lunsod na iyon
  rationale: Likas at marangal na salin ng legal na katawagan para sa mga nakatatandang pinuno ng nasabing lunsod.
- source_word: הָעֶגְלָה
  choice: ang dumalagang baka
  rationale: Tumpak na tumutukoy sa batang babaeng baka at mas madaling maunawaan kaysa sa teknikal o hiram na katawagan.
- source_word: אֶל נַחַל אֵיתָן
  choice: sa isang lambak na may batis na hindi natutuyo
  rationale: Ipinahihiwatig ng נחל ang lambak, bangin, o daluyan ng batis, samantalang ang אֵיתָן ay maaaring maglarawan ng namamalagi o tuloy-tuloy na agos. Nililinaw ng salin ang heograpiya nang hindi ginagamit ang hindi pamilyar na salitang ‘wadi’; itinatala sa talababa ang tunay na alternatibong pagbasa.
- source_word: אֲשֶׁר לֹא יֵעָבֵד בּוֹ וְלֹא יִזָּרֵעַ
  choice: na hindi binubungkal ni hinahasikan
  rationale: Pinananatili ang dalawang pasibong terminong pang-agrikultura at ang magkatambal na pagtanggi.
- source_word: וְעָרְפוּ
  choice: babaliin nila ang leeg
  rationale: Tahasang inilalarawan ang natatanging ritwal na pagkilos sa leeg sa halip na gawing pangkalahatang ‘papatayin’ o ‘kakatayin.’
- source_word: שָׁם ... בַּנָּחַל
  choice: doon sa lambak
  rationale: Pinananatili ang lokasyon at inuulit ang parehong heograpikong katawagan sa natural na Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lunsod,” “dumalagang baka,” at mga karaniwang pandiwang pang-agrikultura; iniwasan ang teknikal na “wadi” sa pangunahing teksto. Ang anyong panghinaharap ay angkop sa tagubiling legal ng konteksto.
