  text: כִּי֩ אֶת הַ/בְּכֹ֨ר בֶּן הַ/שְּׂנוּאָ֜ה יַכִּ֗יר לָ֤/תֶת ל/וֹ֙ פִּ֣י שְׁנַ֔יִם בְּ/כֹ֥ל אֲשֶׁר יִמָּצֵ֖א ל֑/וֹ כִּי הוּא֙ רֵאשִׁ֣ית אֹנ֔/וֹ ל֖/וֹ מִשְׁפַּ֥ט הַ/בְּכֹרָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/017.yaml
  text: But he shall acknowledge the firstborn[a], the son of the unloved wife, by giving him a double portion of all that is found to belong to him, for he is the firstfruits of his vigor[c][b]; the right of the firstborn belongs to him.
translation:
  language: tl
  text: Sa halip, kikilalanin niya bilang panganay ang anak ng asawang hindi minamahal[a], at bibigyan niya ang anak na ito ng dobleng bahagi[b] ng lahat ng ari-ariang mayroon siya, sapagkat siya ang unang bunga ng lakas ng kanyang ama[c]; sa kanya ang karapatan ng panganay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anak ng asawang kinapopootan” o “anak ng asawang hindi gaanong minamahal.” Maaaring literal na isaling “kinapopootan” ang salitang Hebreo, ngunit sa paghahambing dito ay malamang na tumutukoy ito sa asawang hindi minamahal o hindi gaanong pinapaboran.
    reason: lexical_alternative
  - marker: b
    text: Literal na “bibig ng dalawa,” isang idyomang nangangahulugang dobleng bahagi sa mana.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “una sa lakas ng kanyang ama.” Tumutukoy ang pananalitang Hebreo sa panganay bilang unang bunga ng lakas ng ama na makapagkaanak.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכִּיר
  choice: kikilalanin niya bilang panganay
  rationale: Ang Hiphil ng נכר ay tumutukoy rito sa legal na pagkilala sa tunay na panganay, hindi lamang sa pagkilala sa pagkakakilanlan nito.
- source_word: הַבְּכֹר
  choice: panganay
  rationale: Karaniwang terminong pampamilya at legal na nagpapanatili sa diwa ng katayuan at karapatan sa mana.
- source_word: בֶּן הַשְּׂנוּאָה
  choice: ang anak ng asawang hindi minamahal
  rationale: Maaaring literal na mangahulugang ‘kinapopootang asawa,’ ngunit sa paghahambing sa minamahal na asawa ay malamang na tumutukoy sa asawang hindi minamahal o hindi gaanong minamahal.
- source_word: לָתֶת לוֹ פִּי שְׁנַיִם
  choice: bibigyan ito ng dalawang bahagi
  rationale: Ang literal na idyomang ‘bibig ng dalawa’ ay nangangahulugang dalawang bahagi o dobleng bahagi sa pamana; malinaw sa Filipino ang ‘dalawang bahagi’ bilang dalawang mana-share.
- source_word: בְּכֹל אֲשֶׁר יִמָּצֵא לוֹ
  choice: mula sa lahat ng kanyang ari-arian
  rationale: Ipinahihiwatig ng Niphal ng מצא na ang tinutukoy ay lahat ng matatagpuang pag-aari ng ama, samakatuwid ay ang kanyang ari-ariang mamanahin.
- source_word: רֵאשִׁית אֹנוֹ
  choice: ang una sa kanyang lakas
  rationale: Pinananatili nito ang metaporikal at bahagyang malabong pahayag ng Hebreo tungkol sa unang bunga o pagpapahayag ng lakas na makapagkaanak ng ama.
- source_word: מִשְׁפַּט הַבְּכֹרָה
  choice: karapatan ng panganay
  rationale: Tumutukoy ito sa legal na karapatang kaakibat ng katayuan bilang panganay.
- source_word: כִּי ... כִּי
  choice: Sa halip ... sapagkat
  rationale: Ang unang כִּי ay pasalungat sa ipinagbabawal na pagtatangi sa naunang talata, samantalang ang ikalawa ay nagbibigay ng dahilan.
theological_decisions:
- issue: Kahulugan ng שְׂנוּאָה sa legal na konteksto ng pag-aasawa
  choice: asawang hindi minamahal
  alternative: kinapopootang asawa; asawang hindi gaanong minamahal
  rationale: Pinananatili ng salin ang malinaw na kaibahan sa minamahal na asawa nang hindi ipinapalagay na tiyak na matinding pagkapoot ang tinutukoy ng Hebreo.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang ‘Sa halip’ upang idiin ang legal na pagsalungat sa pagtatangi sa naunang talata. Ang ‘ito’ ay tumutukoy sa anak at natural sa pormal na Filipino. Pinanatili sa pangunahing teksto ang metaporang ‘una sa kanyang lakas,’ at ipinaliwanag sa talababa ang generatibong diwa nito.
