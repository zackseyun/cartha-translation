  terminology: Ang “kikilalanin ... bilang panganay,” “asawang hindi minamahal,” at “karapatan ng panganay” ay angkop at nagpapanatili ng legal na kahulugan. Ang “unang bunga ng lakas ng kanyang ama” ay pinananatili ang metapora nang hindi iniuugnay nang malabo ang lakas sa anak.
