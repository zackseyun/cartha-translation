revisions:
- from: Sa halip, kikilalanin niya bilang panganay ang anak ng asawang hindi minamahal[a] at bibigyan ito ng dalawang bahagi[b] mula sa lahat ng kanyang ari-arian, sapagkat ito ang una sa kanyang lakas[c]; dito nauukol ang karapatan ng panganay.
  to: Sa halip, kikilalanin niya bilang panganay ang anak ng asawang hindi minamahal[a], at bibigyan niya ang anak na ito ng dobleng bahagi[b] ng lahat ng ari-ariang mayroon siya, sapagkat siya ang unang bunga ng lakas ng kanyang ama[c]; sa kanya ang karapatan ng panganay.
  rationale: Nilinaw ang mga sanggunian ng panghalip upang ang “lakas” ay malinaw na maiugnay sa ama, gaya ng Hebreo. Pinalitan ang “dalawang bahagi” ng “dobleng bahagi” upang maipahayag nang mas tiyak ang idyoma ng mana, at inayos ang hulíng sugnay upang malinaw na ang karapatan ay pag-aari ng anak na panganay.
