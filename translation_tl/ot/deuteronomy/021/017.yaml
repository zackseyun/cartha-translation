  source_fidelity: 'Tumpak ang pangunahing diwa at legal na puwersa ng Hebreo: dapat kilalanin ang tunay na panganay, bigyan ng dobleng bahagi ng ari-arian ng ama, at igalang ang kanyang karapatan bilang panganay. Gayunman, ang mga panghalip na “kanyang” at “ito” sa kasalukuyang anyo ay maaaring magpalabo kung sino ang tinutukoy ng “lakas” at ng ari-arian. Ginawang hayag ang ama sa pariralang tungkol sa lakas, alinsunod sa אֹנוֹ.'
