  text: וְ/כִֽי יִהְיֶ֣ה בְ/אִ֗ישׁ חֵ֛טְא מִשְׁפַּט מָ֖וֶת וְ/הוּמָ֑ת וְ/תָלִ֥יתָ אֹת֖/וֹ עַל עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/022.yaml
  text: And if in a man there is a sin deserving death[a], and he is put to death, and you hang him on a tree[b],
translation:
  language: tl
  text: At kung ang isang lalaki ay gumawa ng kasalanang karapat-dapat sa kamatayan[a], at siya ay pinatay, at ibinitin mo siya sa isang puno[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nararapat hatulan ng kamatayan” o “may hatol na kamatayan.” Sa literal, ang pariralang Hebreo ay “kasalanan/hatol ng kamatayan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa isang tulos.” Sa literal, “sa isang puno” ang sinasabi sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: At kung
  rationale: Pinananatili ang payak na pang-ugnay at ang kondisyonal na anyo ng kasong legal sa Hebreo.
- source_word: יִהְיֶה בְ/אִישׁ חֵטְא
  choice: ang isang lalaki ay nagkasala ng kasalanan
  rationale: Natural itong pahayag sa modernong Tagalog para sa Hebreong idyomang literal na ‘may kasalanan sa isang lalaki,’ habang pinananatili ang panlalaking legal na paksa at ang moral-legal na diwa ng חֵטְא.
- source_word: מִשְׁפַּט מָוֶת
  choice: karapat-dapat sa kamatayan
  rationale: Ipinahahayag ang kapital na bigat ng kasalanan nang hindi tiyak na ipinapalagay na ang parirala ay tumutukoy lamang sa pormal na hatol ng hukuman.
- source_word: וְ/הוּמָת
  choice: at siya ay pinatay
  rationale: Malinaw at tuwirang isinasalin ang pasibo ng causative form ng מות sa kontekstong legal.
- source_word: וְ/תָלִיתָ אֹת/וֹ
  choice: at ibinitin mo siya
  rationale: Ang aspektong pangyayari sa kondisyonal na kasong legal ay natural na naipapahayag sa Tagalog sa anyong ‘ibinitin mo,’ at malinaw na pinananatili ang tuwirang layon.
- source_word: עַל עֵץ
  choice: sa isang puno
  rationale: Pinananatili ang pangunahing kahulugan ng עֵץ at ang mahalagang pagkakaugnay nito sa ibang teksto ng Kasulatan, nang hindi nililimitahan sa ‘tulos.’
theological_decisions:
- issue: Panlalaking paksa ng batas
  choice: isang lalaki
  alternative: isang tao
  rationale: Tiyak na panlalaki ang אִישׁ; pinananatili ito sa halip na gawing walang kasarian ang legal na paksa.
- issue: Kahulugan ng מִשְׁפַּט מָוֶת
  choice: karapat-dapat sa kamatayan
  alternative: hinatulan ng kamatayan
  rationale: Pinananatili ang posibilidad na inilalarawan ng parirala ang kasalanang may bigat na kamatayan, hindi lamang ang isang naipataw nang pormal na sentensiya.
- issue: Anyo ng bagay na pinagbinitinan
  choice: sa isang puno
  alternative: sa isang tulos
  rationale: Hindi tinutukoy ng עֵץ ang eksaktong anyo ng kagamitan; ang literal na ‘puno’ ay nagpapanatili sa ambiguwidad at intertekstuwal na kabuluhan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw, na may pormal na himig na angkop sa kasong legal. Pinanatili ang pag-uugnay sa naunang konteksto sa pamamagitan ng “At kung,” pati ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa susunod na talata.
