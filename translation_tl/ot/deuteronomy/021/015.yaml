  text: כִּֽי תִהְיֶ֨יןָ לְ/אִ֜ישׁ שְׁתֵּ֣י נָשִׁ֗ים הָ/אַחַ֤ת אֲהוּבָה֙ וְ/הָ/אַחַ֣ת שְׂנוּאָ֔ה וְ/יָֽלְדוּ ל֣/וֹ בָנִ֔ים הָ/אֲהוּבָ֖ה וְ/הַ/שְּׂנוּאָ֑ה וְ/הָיָ֛ה הַ/בֵּ֥ן הַ/בְּכ֖וֹר לַ/שְּׂנִיאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/015.yaml
  text: If a man has two wives[a], one loved and the other unloved, and both the loved and the unloved have borne him sons, and the firstborn son belongs to the unloved wife,
translation:
  language: tl
  text: Kung ang isang lalaki ay may dalawang asawa, ang isa ay minamahal at ang isa naman ay hindi minamahal[a], at kapwa sila nagsilang sa kanya ng mga anak na lalaki, at ang panganay na anak na lalaki ay anak ng asawang hindi minamahal,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kinamumuhian.” Maaaring taglayin ng salitang Hebreo ang mas matinding kahulugang ito, ngunit dito ay malamang na tumutukoy ito sa asawang hindi pinapaboran, bilang kabaligtaran ng asawang minamahal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Nagsisimula ito ng isang kondisyong legal; natural sa makabagong Tagalog ang “Kung.”
- source_word: תִהְיֶיןָ לְאִישׁ שְׁתֵּי נָשִׁים
  choice: ang isang lalaki ay may dalawang asawa
  rationale: Idyomatikong ipinahahayag sa Tagalog ang Hebreong konstruksiyong eksistensiyal bilang pag-aari o ugnayan; sa kontekstong ito, ang נָשִׁים ay mga asawa.
- source_word: הָאַחַת אֲהוּבָה וְהָאַחַת שְׂנוּאָה
  choice: ang isa ay minamahal at ang isa naman ay hindi minamahal
  rationale: Pinananatili ang tuwirang pagsalungat ng dalawang kalagayang pangrelasyon, habang ang mas matinding literal na posibilidad na “kinamumuhian” ay inilalagay sa talababa.
- source_word: וְיָלְדוּ לוֹ בָנִים
  choice: kapwa sila nagkaanak sa kanya ng mga lalaki
  rationale: Ipinahihiwatig ng pag-uulit sa Hebreo na kapwa asawa ang nagsilang; pinananatili ring tiyak na mga anak na lalaki ang בָנִים.
- source_word: וְהָיָה הַבֵּן הַבְּכוֹר לַשְּׂנִיאָה
  choice: at ang panganay na anak na lalaki ay anak ng asawang hindi minamahal
  rationale: Malinaw na ipinahahayag ang ugnayang maternal na tinutukoy ng לְ, nang hindi ginagamit ang “pag-aari,” na maaaring maging di-natural o malabo sa Tagalog.
theological_decisions:
- issue: Kahulugan ng שְׂנוּאָה sa konteksto ng batas pampamilya
  choice: hindi minamahal
  alternative: kinamumuhian; hindi gaanong minamahal
  rationale: Maaaring mangahulugan ang salita ng matinding pagkamuhi, ngunit sa paghahambing ng dalawang asawa maaari rin nitong tukuyin ang asawang hindi pinapaboran. Pinananatili ng “hindi minamahal” ang salungat sa “minamahal” nang hindi tiyak na ipinapalagay ang aktibong pagkamuhi; ang mas matinding kahulugan ay tahasang binabanggit sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anak na lalaki” at “mga lalaki” upang mapanatili ang espesipikong kasarian sa batas tungkol sa panganay. Ang pangungusap ay sadyang nagtatapos sa kuwit dahil nagpapatuloy ang kondisyong legal sa kasunod na talata.
