  - severity: medium
    issue: “kanyang tirahan” bilang salin ng מְקֹמוֹ
    rationale: Ang ‘tirahan’ ay karaniwang tahanan o residensiya, samantalang ang מָקוֹם ay ‘lugar’ at tumutukoy rito sa lokalidad/komunidad.
  - severity: low
