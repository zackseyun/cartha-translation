  text: then his father and his mother shall seize him and bring him out to the elders of his city and to the gate of his place[a][b].
translation:
  language: tl
  text: At hahawakan siya ng kanyang ama at ng kanyang ina at ilalabas siya sa mga nakatatanda ng kanyang lungsod at sa pintuang-bayan ng kanyang lugar[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pintuang-bayan ay pampublikong lugar kung saan dinidinig ng mga lokal na nakatatanda ang mga usaping legal.
    reason: cultural_note
  - marker: b
    text: O “sa pintuang-bayan ng kanyang bayan.” Sa Hebreo, “sa pintuan ng kanyang lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפְשׂוּ בוֹ
  choice: hahawakan siya
  rationale: Ang pandiwang תפשׂ na may ב ay tumutukoy sa mahigpit na paghawak o pagpigil sa anak. Likas sa modernong Filipino ang “hahawakan siya” at hindi nito ipinahihiwatig ang karahasang maaaring ikabit sa “dadakpin.”
- source_word: אָבִיו וְאִמּוֹ
  choice: ng kanyang ama at ina
  rationale: Malinaw na parehong magulang ang kumikilos. Ang anyong ito ay natural sa Filipino habang pinananatili ang magkasamang papel ng ama at ina.
- source_word: וְהוֹצִיאוּ אֹתוֹ
  choice: at dadalhin
  rationale: Ang Hiphil ng יצא ay nangangahulugang ilabas o dalhin palabas. Sa konteksto ng pagdadala mula sa tahanan patungo sa pampublikong hukuman, malinaw at natural ang “dadalhin.”
- source_word: אֶל זִקְנֵי עִירוֹ
  choice: sa matatandang pinuno ng kanyang lungsod
  rationale: Ang זקנים dito ay mga kinikilalang lokal na pinuno at tagapaghukom, hindi lamang matatanda sa edad. Nililinaw ito ng “matatandang pinuno” nang hindi nagdaragdag ng natatanging denominasyonal na kahulugan.
- source_word: וְאֶל שַׁעַר מְקֹמוֹ
  choice: sa pintuang-bayan ng kanyang tirahan
  rationale: Ang שׁער ay ang pintuang-bayan na nagsilbing pampublikong lugar ng pagdinig ng mga usaping legal. Ang מקום ay literal na “lugar”; ipinananatili ng “kanyang tirahan” ang kaugnayan sa lugar na kinabibilangan niya, habang ang talababa ay nagbibigay ng mas literal na alternatibo.
