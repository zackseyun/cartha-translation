  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “matatandang pinuno” upang maipahayag ang pampamahalaan at panghukumang tungkulin ng זקנים; iniwasan ang katawagang maaaring magmukhang natatanging titulo ng isang denominasyon.
