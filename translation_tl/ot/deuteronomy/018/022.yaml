  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲשֶׁר֩ יְדַבֵּ֨ר הַ/נָּבִ֜יא בְּ/שֵׁ֣ם יְהוָ֗ה וְ/לֹֽא יִהְיֶ֤ה הַ/דָּבָר֙ וְ/לֹ֣א יָב֔וֹא ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָ֑ה בְּ/זָדוֹן֙ דִּבְּר֣/וֹ הַ/נָּבִ֔יא לֹ֥א תָג֖וּר מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/022.yaml
  text: When the prophet speaks in the name of Yahweh[a], and the matter does not happen or come about, that is the matter that Yahweh has not spoken. The prophet has spoken it presumptuously[c][b]; you shall not fear him.
translation:
  language: tl
  text: Kapag nagsalita ang propeta sa pangalan ni Yahweh at hindi nangyari o natupad ang bagay na sinabi niya,[a] iyon ang bagay na hindi sinabi ni Yahweh. Nagsalita ang propeta nang may kapangahasan;[b] huwag mo siyang katakutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na דָּבָר ay maaaring mangahulugang “salita,” “pahayag,” “bagay,” o ang pangyayaring ipinahayag.
    reason: lexical_alternative
  - marker: b
    text: Ang “may kapangahasan” ay tumutukoy sa mapangahas at sinasadyang pagsasalita na walang pahintulot ni Yahweh.
    reason: lexical_cultural_note
lexical_decisions:
- source_word: יְדַבֵּר הַנָּבִיא
  choice: nagsalita ang propeta
  rationale: Ginamit ang pangkalahatang kondisyon na “Kapag nagsalita” upang ihayag ang gamit ng imperfect sa isang kasong legal. Pinanatili ang tahasang “ang propeta,” na likas ding maaaring tumukoy sa sinumang propetang nasa ganitong kalagayan.
- source_word: בְּשֵׁם יְהוָה
  choice: sa pangalan ni Yahweh
  rationale: Likas na pormula sa Tagalog para sa pagsasalitang nag-aangking may awtoridad mula sa Diyos; pinanatili ang personal na pangalang Yahweh.
- source_word: הַדָּבָר
  choice: ang bagay na sinabi niya / ang bagay
  rationale: 'Malawak ang saklaw ng דָּבָר: maaari itong tumukoy sa salita, nilalaman ng pahayag, o bagay/pangyayaring ipinahayag. Ang “bagay na sinabi niya” ay malinaw sa Tagalog habang pinananatili ang ugnayan ng pahayag at katuparan.'
- source_word: וְלֹא יִהְיֶה ... וְלֹא יָבֹא
  choice: hindi nangyari o natupad
  rationale: Pinanatili ang dalawang magkatabing pandiwa. Ang “nangyari” ay tumutukoy sa pag-iral ng ipinahayag na pangyayari, at ang “natupad” sa katuparan ng pahayag.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ יְהוָה
  choice: na hindi sinabi ni Yahweh
  rationale: Tuwirang pinanatili ang pagkilos ng pagsasalita at ang Diyos bilang simuno, nang hindi nagdaragdag ng mas malawak na paliwanag tungkol sa propesiya.
- source_word: בְּזָדוֹן
  choice: nang may kapalaluan
  rationale: Ipinahahayag nito ang kusang-loob at mapangahas na pagsasalita nang walang pahintulot, hindi lamang simpleng pagkakamali.
- source_word: לֹא תָגוּר מִמֶּנּוּ
  choice: huwag mo siyang katakutan
  rationale: Natural at tuwirang pagbabawal sa modernong Tagalog; saklaw nito ang takot o pagpapaalipin sa pananakot ng nag-aangking propeta.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya tinumbasan ito bilang Yahweh sa halip na palitan ng isang titulo.
- issue: Saklaw ng pagsubok sa propeta
  choice: Inilahad bilang tiyak na pagsubok sa pahayag na hindi nangyari o natupad
  alternative: Palawakin bilang pangkalahatang doktrina tungkol sa lahat ng anyo ng propesiya
  rationale: Nanatili ang salin sa legal na kasong inilalarawan ng talata at hindi nagdagdag ng mga doktrinal na konklusyong wala sa mismong teksto.
- issue: Bigat ng בְּזָדוֹן
  choice: nang may kapalaluan
  alternative: nang may lakas ng loob / nang nagkamali
  rationale: Ang salita ay nagpapahiwatig ng mapangahas at kusang pag-angkin ng awtoridad, kaya hindi ito pinalambot na tila inosenteng pagkakamali lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “Kapag” para sa pangkalahatang kasong legal, “ni Yahweh” bilang likas na pagmamarka sa personal na pangalan, at tuwirang panghalip na isahan sa “huwag mo siyang katakutan.”
