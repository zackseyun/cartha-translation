review_pass:
  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang pangakong magbabangon ang Diyos ng isang propeta, ang pinagmulan niya mula sa mga kapatid ng Israel, ang pagiging tulad niya ni Moises, at ang ganap na pagpapahayag niya ng mga utos ng Diyos. Walang idinagdag na pagkakakilanlang mesiyaniko.
  naturalness: Karaniwan at marangal ang wika. Gayunman, sa kasalukuyang ayos, ang pariralang “mula sa kanilang mga kapatid” ay kasunod agad ng “tulad mo” at maaari, kahit bahagya, na magmukhang ikinakabit sa paghahambing. Ang paglipat nito upang tuwirang magpanuring sa “isang propeta” ay higit na malinaw sa makabagong Filipino.
  terminology: Ang “propeta,” “mga salita,” at “mga kapatid” ay angkop. Pinananatili ng talababa ang literal na pangkamag-anak na termino habang maingat na ibinibigay ang mga kontekstuwal na alternatibo.
  issues:
  - severity: low
    issue: Bahagyang malabong pagkakaugnay ng “mula sa kanilang mga kapatid.”
    rationale: Sa “isang propetang tulad mo mula sa kanilang mga kapatid,” maaaring pansamantalang mabasa na ang huling parirala ay kaugnay ng “tulad mo.” Inilalagay ng rebisyon ang parirala kaagad pagkatapos ng “propeta” upang malinaw na tumutugma ito sa מִקֶּרֶב אֲחֵיהֶם.
  revised_text: Magbabangon ako para sa kanila ng isang propeta mula sa kanilang mga kapatid, na tulad mo. Ilalagay ko sa bibig niya ang aking mga salita, at sasabihin niya sa kanila ang lahat ng iuutos ko sa kanya.
