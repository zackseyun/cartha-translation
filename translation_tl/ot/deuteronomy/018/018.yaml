  to: Magbabangon ako para sa kanila ng isang propeta mula sa kanilang mga kapatid, na tulad mo. Ilalagay ko sa bibig niya ang aking mga salita, at sasabihin niya sa kanila ang lahat ng iuutos ko sa kanya.
