source:
  edition: WLC
  text: נָבִ֨יא אָקִ֥ים לָ/הֶ֛ם מִ/קֶּ֥רֶב אֲחֵי/הֶ֖ם כָּמ֑וֹ/ךָ וְ/נָתַתִּ֤י דְבָרַ/י֙ בְּ/פִ֔י/ו וְ/דִבֶּ֣ר אֲלֵי/הֶ֔ם אֵ֖ת כָּל אֲשֶׁ֥ר אֲצַוֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/018.yaml
  text: I will raise up for them a prophet like you from among their brothers[a], and I will put my words in his mouth, and he will speak to them all that I command him.
translation:
  language: tl
  text: Magbabangon ako para sa kanila ng isang propeta mula sa kanilang mga kapatid, na tulad mo. Ilalagay ko sa bibig niya ang aking mga salita, at sasabihin niya sa kanila ang lahat ng iuutos ko sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָבִיא
  choice: isang propeta
  rationale: Karaniwang salin ng terminong Hebreo para sa taong nagsasalita sa ngalan ng Diyos; natural sa Filipino ang pantukoy na “isang” sa kontekstong ito.
- source_word: אָקִים
  choice: Magbabangon ako
  rationale: Pinananatili ang larawan ng Hiphil ng קום, na tumutukoy sa pagpapalitaw at pagtatalaga ng Diyos sa isang propeta.
- source_word: לָהֶם
  choice: para sa kanila
  rationale: Ipinahahayag ang diwa ng paglalaan ng Diyos alang-alang sa bayan.
- source_word: מִקֶּרֶב אֲחֵיהֶם
  choice: mula sa kanilang mga kapatid
  rationale: Ang מִקֶּרֶב ay “mula sa gitna/mula sa hanay,” at literal na “kanilang mga kapatid” ang אֲחֵיהֶם. Sa konteksto ng Deuteronomio, maaari itong tumukoy sa kanilang mga kalahi o kapwa Israelita.
- source_word: כָּמוֹךָ
  choice: tulad mo
  rationale: Direkta at maikling pinananatili ang paghahambing kay Moises.
- source_word: וְנָתַתִּי דְבָרַי בְּפִיו
  choice: Ilalagay ko sa bibig niya ang aking mga salita
  rationale: Pinananatili ang matingkad na metapora ng banal na pagbibigay ng mensahe, habang gumagamit ng likas na ayos sa Filipino.
- source_word: וְדִבֶּר אֲלֵיהֶם
  choice: at sasabihin niya sa kanila
  rationale: Sa Filipino, natural na naipahahayag ng “sasabihin” ang pagsasalita ng itinakdang mensahe sa mga tao.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּנּוּ
  choice: ang lahat ng iuutos ko sa kanya
  rationale: Pinananatili ang saklaw na “lahat” at ang hinaharap na konteksto ng utos ng Diyos sa propeta.
theological_decisions:
- issue: Posibleng mesiyanikong pagkakakilanlan ng ipinangakong propeta
  choice: Hindi tahasang tinutukoy sa salin kung sino ang propeta; nananatili ang “isang propetang tulad mo.”
  alternative: Unawain bilang sunod-sunod na mga propeta o bilang isang pangwakas na propetang natupad sa Mesiyas.
  rationale: Hindi tahasang kinikilala ng talata ang tinutukoy. Pinananatili ng salin ang tunay na luwag at tensiyong teolohikal ng Hebreo.
- issue: Saklaw ng אֲחֵיהֶם
  choice: kanilang mga kapatid
  alternative: kanilang mga kalahi; kanilang mga kapwa Israelita
  rationale: Pinananatili sa pangunahing teksto ang literal na pananalitang pangkamag-anakan, at nililinaw sa talababa ang posibleng kolektibo at tipanang diwa nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metaporang “ilalagay ko sa bibig” at ang literal na “mga kapatid,” na may talababa upang maiwasan ang makitid na pagbasa.
