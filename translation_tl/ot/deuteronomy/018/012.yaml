base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/012.yaml
  text: For everyone who does these things is an abomination to Yahweh[a], and because of these abominations Yahweh your God is driving them out before you.
translation:
  language: tl
  text: Sapagkat kasuklam-suklam kay Yahweh ang sinumang gumagawa ng mga bagay na ito. At dahil sa mga kasuklam-suklam na gawaing ito, pinalalayas[a] sila ni Yahweh na iyong Diyos sa harap mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “pinagkakaitan sila ng pagmamay-ari sa lupain”; maaaring idiin ng pandiwang Hebreo kapuwa ang pagpapaalis sa mga bansa at ang pagkawala ng kanilang pag-aari sa lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pagbabawal at likas itong pakinggan sa makabagong Tagalog.
- source_word: תוֹעֲבַת יְהוָה
  choice: kasuklam-suklam kay Yahweh
  rationale: Pinananatili nito ang matindi at moral na diwa ng תוֹעֵבָה bilang isang bagay na lubos na kinamumuhian sa paningin ni Yahweh, sa natural na ayos ng pangungusap sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: ang bawat gumagawa ng mga bagay na ito
  rationale: Ipinahahayag ng כָּל kasama ng participle ang lahat ng taong nagsasagawa ng mga nabanggit na gawain.
- source_word: וּבִגְלַל
  choice: At dahil sa
  rationale: Malinaw na ipinahahayag ang sanhi o batayan ng kasunod na paghatol.
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: mga kasuklam-suklam na ito
  rationale: Tumutukoy ito sa mga ipinagbabawal na gawaing binanggit sa naunang mga talata at pinananatili ang leksikal na kaugnayan sa תוֹעֲבַת sa unang sugnay.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang pangalawang panauhang isahan na tuwirang tumutukoy sa Israel.
- source_word: מוֹרִישׁ אֹתָם
  choice: itinataboy sila
  rationale: Sa konteksto, ang Hiphil ng ירש ay tumutukoy sa pagpapaalis sa mga bansa mula sa lupain; natural ang “itinataboy” habang nananatili ang posibilidad na diin nito ang pag-aalis sa kanilang pagmamay-ari.
- source_word: מִפָּנֶיךָ
  choice: mula sa harapan mo
  rationale: Mas malapit ito sa literal na “mula sa iyong harapan/presensiya” at angkop sa konteksto ng pagpapaalis sa mga bansa habang sumusulong ang Israel.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng Hebreo ang Tetragrammaton bilang sariling pangalan ng Diyos; pinananatili ng “Yahweh” ang pangalang iyon sa halip na palitan ng titulo.
- issue: Lakas ng hatol na תוֹעֲבָה
  choice: kasuklam-suklam kay Yahweh
  alternative: hindi katanggap-tanggap kay Yahweh
  rationale: Pinananatili ng “kasuklam-suklam” ang matinding moral at tipanang bigat ng salita nang hindi ito pinahihina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kasuklam-suklam” upang mapanatili ang matinding diwa ng Hebreo, at inilagay ang talababa sa “itinataboy,” na siyang salitang may leksikal na alternatibo.
