revisions:
- from: Sapagkat kasuklam-suklam kay Yahweh ang bawat gumagawa ng mga bagay na ito. At dahil sa mga kasuklam-suklam na ito, itinataboy[a] sila ni Yahweh na iyong Diyos mula sa harapan mo.
  to: Sapagkat kasuklam-suklam kay Yahweh ang sinumang gumagawa ng mga bagay na ito. At dahil sa mga kasuklam-suklam na gawaing ito, pinalalayas[a] sila ni Yahweh na iyong Diyos sa harap mo.
  rationale: Pinanatili ng rebisyon ang sanhi, ang pangkalahatang saklaw ng "sinumang gumagawa," ang banal na pangalang Yahweh, at ang matinding hatol na "kasuklam-suklam." Pinahusay lamang nito ang idiomatikong Filipino, nilinaw ang tinutukoy ng plural na "mga kasuklam-suklam," at pinakinis ang talababa nang hindi binabago ang saklaw ng pandiwang Hebreo.
