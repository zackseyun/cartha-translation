  naturalness: Nauunawaan ang draft, ngunit medyo di-natural ang pangngalang "mga kasuklam-suklam na ito" at ang "mula sa harapan mo." Ang "mga kasuklam-suklam na gawaing ito" at "sa harap mo" ay mas idiomatiko sa modernong Filipino habang pinananatili ang diwa ng Hebreo.
  terminology: Wastong pinananatili ang "Yahweh" at ang matinding pagpapahalaga ng תועבה sa "kasuklam-suklam." Ang "Diyos" ay angkop para sa אֱלֹהֶיךָ.
