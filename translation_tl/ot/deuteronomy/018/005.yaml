  text: כִּ֣י ב֗/וֹ בָּחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/כָּל שְׁבָטֶ֑י/ךָ לַ/עֲמֹ֨ד לְ/שָׁרֵ֧ת בְּ/שֵׁם יְהוָ֛ה ה֥וּא וּ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/005.yaml
  text: For Yahweh your God has chosen him from all your tribes to stand and minister in the name of Yahweh[a], he and his sons all the days.
translation:
  language: tl
  text: Sapagkat siya ang pinili ni Yahweh na iyong Diyos mula sa lahat ng iyong mga lipi upang tumayo at maglingkod sa pangalan ni Yahweh—siya at ang kanyang mga anak na lalaki—sa lahat ng panahon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa lahat ng araw,” na tumutukoy rito sa nagpapatuloy na paglilingkod.
    reason: Ipinapakita ang literal na anyo ng idyomang Hebreo at nililinaw ang diwa nito sa konteksto.
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan para sa naunang tuntunin at pinananatili ang paliwanag na ugnayan ng talata.
- source_word: בּוֹ בָּחַר
  choice: siya ang pinili
  rationale: Sa pariralang ito, minamarkahan ng ב ang taong pinili; natural sa Tagalog ang pokus na ‘siya ang pinili.’
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Pinananatili ang pangalang tipan na Yahweh at ang ikalawang panauhang isahan na ginagamit para sa Israel bilang kausap.
- source_word: מִכָּל שְׁבָטֶיךָ
  choice: mula sa lahat ng iyong mga lipi
  rationale: Malinaw nitong ipinahahayag ang pagpili mula sa mga lipi ng Israel.
- source_word: לַעֲמֹד
  choice: upang tumayo
  rationale: Pinananatili ang kongkretong larawan ng pagtayo sa tungkuling pangsaserdote sa halip na gawing purong tungkulin lamang.
- source_word: לְשָׁרֵת
  choice: at maglingkod
  rationale: Ang ‘maglingkod’ ay natural at sapat na marangal sa Tagalog, habang ang konteksto ang naglilinaw na ito ay banal o pangsaserdoteng paglilingkod.
- source_word: בְּשֵׁם יְהוָה
  choice: sa pangalan ni Yahweh
  rationale: Pinananatili ang anyo at diwang may awtoridad at kaugnayan sa tipan ng paglilingkod sa pangalan ni Yahweh.
- source_word: הוּא וּבָנָיו
  choice: siya at ang kanyang mga anak na lalaki
  rationale: Tahasang panlalaki ang בָּנָיו at tumutukoy sa namamanang paglilingkod ng mga lalaking inapo.
- source_word: כָּל הַיָּמִים
  choice: habang panahon
  rationale: Natural na Tagalog ito para sa nagpapatuloy at namamanang paglilingkod, samantalang inilalagay sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; ang ‘Yahweh’ ay nagpapanatili sa personal na pangalan ng Diyos nang hindi ito pinapalitan ng titulo.
- issue: Panlalaking wika ng pagmamana sa paglilingkod
  choice: siya at ang kanyang mga anak na lalaki
  alternative: siya at ang kanyang mga anak
  rationale: Partikular na ‘mga anak na lalaki’ ang Hebreo, at ang konteksto ay tungkol sa pagpapatuloy ng tungkuling pangsaserdote; hindi ito ginawang neutral sa kasarian.
- issue: Saklaw ng כָּל הַיָּמִים
  choice: habang panahon
  alternative: sa lahat ng araw
  rationale: Ipinahihiwatig ng parirala ang nagpapatuloy na paglilingkod sa sunod-sunod na salinlahi, ngunit hindi ito pinalawak tungo sa tahasang metapisikal na ‘magpakailanman.’
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang isahang ‘iyong’ upang mapanatili ang anyo ng Hebreo, na nakikipag-usap sa Israel bilang isang kabuuan. Ang mga gitling na em dash ay naghihiwalay sa ‘siya at ang kanyang mga anak na lalaki’ bilang paglilinaw sa saklaw ng namamanang paglilingkod.
