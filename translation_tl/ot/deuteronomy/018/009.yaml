  verdict: revise
  source_fidelity: Napananatili ang temporal na «Kapag,» ang pagbibigay ng lupain ni Yahweh, at ang mariing pagbabawal. Gayunman, hindi hayagang naipapakita sa pangunahing teksto ang כְּ sa כְּתוֹעֲבֹת, na nagpapahiwatig ng paggawa ayon sa o gaya ng mga kasuklam-suklam na gawain. Hindi sapat na talababa lamang ang magdala ng bahaging ito ng kahulugan.
  naturalness: Malinaw at angkop sa makabagong Filipino ang rehistro. Ang «huwag mong pag-aralang gumawa ayon sa» ay likas at mas tumpak kaysa «pag-aralang gawin ang» sa kontekstong ito.
  terminology: Ang «Yahweh,» «iyong Diyos,» «lupain,» at «kasuklam-suklam na mga gawain» ay angkop. Pinananatili ng huling parirala ang lakas ng תּוֹעֵבָה nang hindi inuunahan ang mga tiyak na gawaing ililista sa susunod na mga talata.
  issues:
