base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/009.yaml
  text: When you come into the land that Yahweh your God is giving you[a], you shall not learn to do according to the abominations of those nations.
translation:
  language: tl
  text: Kapag pumasok ka sa lupaing ibinibigay sa iyo ni Yahweh na iyong Diyos, huwag mong pag-aralang gumawa ayon sa kasuklam-suklam na mga gawain ng mga bansang iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “gaya ng kasuklam-suklam na mga gawain ng mga bansang iyon.” Ang pang-ukol sa Hebreo ay maaaring magpahiwatig ng paghahambing o pagsunod sa isang paraan o huwaran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Nagsasaad dito ng pangyayaring temporal na magiging kalagayan ng kasunod na pagbabawal; natural sa Filipino ang “Kapag.”
- source_word: בָּא אֶל הָאָרֶץ
  choice: pumasok ka sa lupain
  rationale: Ipinapahayag ng anyong participle ang nalalapit na pagpasok ng Israel; malinaw at likas ang “pumasok ... sa lupain.”
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Pinananatili ang personal na pangalang יְהוָה at ang tuwirang ugnayang ipinahahayag ng hulaping panghalip sa אֱלֹהֶיךָ.
- source_word: נֹתֵן לָךְ
  choice: ibinibigay sa iyo
  rationale: Pinananatili ng pangkasalukuyang anyo ang nagpapatuloy o nalalapit na pagkilos ng Diyos sa konteksto.
- source_word: לֹא תִלְמַד לַעֲשׂוֹת
  choice: huwag mong pag-aralang gawin
  rationale: Ang negatibong imperfect ay pagbabawal, at ang infinitive ay tuwirang layon ng “matuto/pag-aralan.” Ang “pag-aralang gawin” ay natural ngunit malapit sa anyo ng Hebreo.
- source_word: כְּתוֹעֲבֹת
  choice: ang mga kasuklam-suklam na gawain
  rationale: Ipinahihiwatig ng תּוֹעֵבָה ang matinding moral at panrelihiyong pagkasuklam. Nilinaw ng “mga gawain” ang ipinagbabawal na pagsasagawa nang hindi nililimitahan ang mga gawaing ililista sa kasunod na mga talata.
- source_word: הַגּוֹיִם הָהֵם
  choice: ng mga bansang iyon
  rationale: Ang גּוֹיִם ay tumutukoy sa mga bansa o bayang naroon, at pinananatili ng “iyon” ang malayong demonstratibo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah / PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ang tuwirang transliterasyon at hindi ito pinapalitan ng isang titulo.
- issue: Tindi at saklaw ng תּוֹעֵבָה
  choice: mga kasuklam-suklam na gawain
  alternative: mga karumal-dumal na bagay
  rationale: Pinananatili ng “kasuklam-suklam” ang matinding hatol ng salitang Hebreo, samantalang nililinaw ng “gawain” na mga gawaing isinasagawa ng mga bansa ang tinutukoy.
- issue: Gamit ng pang-ukol כְּ sa כְּתוֹעֲבֹת
  choice: gawin ang mga kasuklam-suklam na gawain
  alternative: gumawa ayon sa / gaya ng mga kasuklam-suklam na gawain
  rationale: Sa ugnayan ng “matutong gawin,” natural sa Filipino ang tuwirang layon; gayunman, maaaring idiin ng כְּ ang paghahambing o pagsunod sa huwaran, kaya itinatala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang “ka/iyo/mo” ayon sa ikalawang panauhang panlalaking isahan ng Hebreo, na kumakatawan sa Israel bilang kausap. Iniwasan ang sobrang arkaikong legal na pananalita habang pinananatili ang mariing pagbabawal.
