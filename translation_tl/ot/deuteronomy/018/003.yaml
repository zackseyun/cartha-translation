  text: וְ/זֶ֡ה יִהְיֶה֩ מִשְׁפַּ֨ט הַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת הָ/עָ֗ם מֵ/אֵ֛ת זֹבְחֵ֥י הַ/זֶּ֖בַח אִם שׁ֣וֹר אִם שֶׂ֑ה וְ/נָתַן֙ לַ/כֹּהֵ֔ן הַ/זְּרֹ֥עַ וְ/הַ/לְּחָיַ֖יִם וְ/הַ/קֵּבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/003.yaml
  text: 'And this shall be the priests’ due from the people[a], from those who sacrifice a sacrifice, whether an ox or a sheep: he shall give to the priest the shoulder, the two cheeks[d][c][b], and the stomach.'
translation:
  language: tl
  text: 'At ito ang nakatalagang bahagi ng mga pari mula sa bayan—mula sa mga naghahandog ng handog, maging baka o tupa: ibibigay ng naghahandog sa pari ang unang biyas[a], ang dalawang pisngi[b], at ang sikmura[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “braso.” Kapag hayop ang tinutukoy, ito ay ang unahang biyas o bahaging balikat.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga pisngi” o “mga buto ng panga.” Dual ang anyo ng salitang Hebreo.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “tiyan.” Ang tradisyonal na “maw” ay tumutukoy rin sa sikmura ng hayop ngunit lipas na termino.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: bahaging nauukol
  rationale: Sa kontekstong legal at panghandog, tumutukoy ito sa itinakda o nararapat tanggapin ng mga pari, hindi sa abstraktong 'hatol.'
- source_word: מֵאֵת הָעָם מֵאֵת זֹבְחֵי הַזֶּבַח
  choice: mula sa bayan—mula sa mga naghahandog ng handog
  rationale: Pinananatili ang ugnayan ng pangkalahatang 'bayan' at ng mas tiyak na pangkat na naghahandog, pati ang pag-uulit ng ugat na may kinalaman sa paghahandog.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: maging baka man o tupa
  rationale: Natural na Filipino para sa dalawang alternatibong hayop; hindi pinakikitid ang שׁוֹר sa lalaking hayop dahil maaari itong tumukoy sa isang hayop mula sa bakahan.
- source_word: וְנָתַן
  choice: ibibigay ng naghahandog
  rationale: Ang pandiwa ay isahan at distributibo. Nilinaw ang di-tahasang simuno bilang bawat naghahandog nang hindi gumagamit ng panlalaking panghalip na hindi kailangan sa Filipino.
- source_word: הַזְּרֹעַ
  choice: paunang hita
  rationale: Literal itong 'braso,' ngunit sa anatomiya ng hayop ay tumutukoy sa unahang biyas o bahaging balikat. Ang 'paunang hita' ay madaling maunawaan, bagaman may alternatibong 'balikat/unahang biyas.'
- source_word: הַלְּחָיַיִם
  choice: dalawang panga
  rationale: Ipinakikita ang dual na anyo ng Hebreo at pinananatili ang anatomikal na kahulugan; maaari rin itong unawain bilang dalawang pisngi o buto ng panga.
- source_word: הַקֵּבָה
  choice: sikmura
  rationale: Makabago at malinaw na katumbas ng bahagi ng tiyan ng hayop; iniiwasan ang teknikal na pagtukoy sa isang tiyak na kompartimento na hindi tiyak sa salita lamang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal na himig pambatas. Ginamit ang 'bahaging nauukol' upang maging malinaw ang itinakdang karapatan ng mga pari. Pinanatili ang Hebreong pag-uulit sa 'naghahandog ng handog' at nilinaw ang distributibong simuno ng isahang pandiwa.
