revisions:
- from: Gaya ng lahat ng hiniling ninyo sa PANGINOON na inyong Diyos sa Horeb noong araw ng pagtitipon. Sinabi ninyo, “Huwag ko nang marinig ang tinig ng PANGINOON na aking Diyos, ni makita pang muli ang napakalaking apoy na ito, upang hindi ako mamatay.”
  to: Ito ay ayon sa lahat ng hiniling ninyo sa PANGINOON na inyong Diyos sa Horeb noong araw ng pagtitipon, nang sabihin ninyo, “Huwag ko nang patuloy na marinig ang tinig ng PANGINOON na aking Diyos, ni makita pang muli ang malaking apoy na ito, baka ako mamatay.”
  rationale: Inayos ang daloy ng pangungusap upang maipakita na ang talata ay pagpapatuloy ng naunang pahayag. Ginawang “malaking apoy” ang mas eksaktong katumbas ng Hebreo at ginawang “baka ako mamatay” ang pangambang ipinahahayag ng huling sugnay. Walang kailangang talababa.
