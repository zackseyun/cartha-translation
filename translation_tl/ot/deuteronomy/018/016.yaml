  text: כְּ/כֹ֨ל אֲשֶׁר שָׁאַ֜לְתָּ מֵ/עִ֨ם יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/חֹרֵ֔ב בְּ/י֥וֹם הַ/קָּהָ֖ל לֵ/אמֹ֑ר לֹ֣א אֹסֵ֗ף לִ/שְׁמֹ֨עַ֙ אֶת קוֹל֙ יְהוָ֣ה אֱלֹהָ֔/י וְ/אֶת הָ/אֵ֨שׁ הַ/גְּדֹלָ֥ה הַ/זֹּ֛את לֹֽא אֶרְאֶ֥ה ע֖וֹד וְ/לֹ֥א אָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/016.yaml
  text: just as you asked from the LORD your God at Horeb on the day of the assembly, saying, ‘Let me not continue to hear the voice of the LORD my God, and let me not see this great fire anymore, lest I die.’
translation:
  language: tl
  text: Ito ay ayon sa lahat ng hiniling ninyo sa PANGINOON na inyong Diyos sa Horeb noong araw ng pagtitipon, nang sabihin ninyo, “Huwag ko nang patuloy na marinig ang tinig ng PANGINOON na aking Diyos, ni makita pang muli ang malaking apoy na ito, baka ako mamatay.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר שָׁאַלְתָּ
  choice: Gaya ng lahat ng hiniling ninyo
  rationale: Pinananatili ang saklaw ng כֹל (“lahat”) at likas na ipinahahayag sa Filipino ang paghahambing na כְּ (“gaya ng”). Ang isahang anyo sa Hebreo ay tumutukoy sa Israel bilang bayan; ginamit ang magalang at kolektibong “ninyo.”
- source_word: מֵעִם יְהוָה אֱלֹהֶיךָ
  choice: sa PANGINOON na inyong Diyos
  rationale: Ang מֵעִם pagkatapos ng שׁאל ay nagpapakilala sa hinihingan; natural itong “sa” sa Filipino. Isinalin ang banal na pangalang יהוה ayon sa karaniwang tradisyong “PANGINOON.”
- source_word: בְּחֹרֵב
  choice: sa Horeb
  rationale: Pinanatili ang pangalang Horeb sa halip na ipalit ang Sinai.
- source_word: בְּיוֹם הַקָּהָל
  choice: noong araw ng pagtitipon
  rationale: Ang קָהָל ay ang kapulungang nagtipon sa Horeb; ang “pagtitipon” ay malinaw at hindi nagpapasok ng mas tiyak na institusyonal na kahulugan.
- source_word: לֹא אֹסֵף לִשְׁמֹעַ
  choice: Huwag ko nang marinig
  rationale: Idyomatiko itong kahilingang huwag nang magpatuloy o maulit ang pagkarinig; ipinahahayag ng “nang” ang diwa ng אֹסֵף (“magpatuloy/muling gawin”).
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: ang napakalaking apoy na ito
  rationale: Inihahatid ang diin ng גָּדוֹל bilang matindi at kahanga-hangang laki, habang pinananatili ang demonstratibong “ito.”
theological_decisions:
- issue: Ugnayan ng huling parirala וְלֹא אָמוּת
  choice: upang hindi ako mamatay
  alternative: at hindi ako mamamatay
  rationale: Bagaman koordinado sa anyo sa Hebreo, sa konteksto ang kamatayan ang kinatatakutang bunga ng patuloy na pagkarinig at pagkakita. Ang “upang hindi” ay natural sa Filipino at pinananatili ang layunin/pag-iwas nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Bilang ng kausap
  choice: ninyo / inyong
  alternative: mo / iyong
  rationale: Isahan ang mga hulapi sa Hebreo dahil kinakausap ang Israel bilang isang kolektibong bayan. Ang maramihang Filipino ay mas natural para sa kongregasyong tinutukoy at umaayon sa nilalamang kolektibo ng kahilingan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang “Horeb” at “araw ng pagtitipon,” at iniwasan ang pagpapaliwanag na maaaring magtakda ng denominasyonal na pagbasa.
