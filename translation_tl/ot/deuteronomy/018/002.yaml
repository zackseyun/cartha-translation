  text: וְ/נַחֲלָ֥ה לֹא יִֽהְיֶה לּ֖/וֹ בְּ/קֶ֣רֶב אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּר לֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/002.yaml
  text: He shall have no inheritance among his brothers[a]; Yahweh is his inheritance[b], as he spoke to him.
translation:
  language: tl
  text: Hindi siya magkakaroon ng mana sa gitna ng kanyang mga kapatid[a]; si Yahweh mismo ang kanyang mana, gaya ng sinabi niya sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kalipi niya.” Literal na “mga kapatid” ang nasa Hebreo; tumutukoy ito sa mga kapuwa Israelita niya, lalo na sa ibang mga lipi.
    reason: lexical_alternative
  - marker: b
    text: O “gaya ng ipinahayag niya sa kanya.” Karaniwang salita para sa “magsalita” o “magsabi” ang pandiwang Hebreo. Posible ayon sa diwa ang “gaya ng ipinangako niya sa kanya,” ngunit mas interpretibo iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה / נַחֲלָתוֹ
  choice: mana
  rationale: Sa konteksto ng paghahati ng lupain sa Deuteronomio, tumutukoy ito sa minanang bahagi o bahaging inilaan. Inulit ang “mana” sa dalawang sugnay upang mapanatili ang pag-uulit sa Hebreo at ang paglipat mula sa literal na lupang minamana tungo sa mas malalim na pahayag na si Yahweh mismo ang kanyang mana.
- source_word: בְּקֶרֶב
  choice: sa gitna ng
  rationale: Likas sa Filipino ang pariralang “sa gitna ng kanyang mga kapatid” at pinananatili nito ang larawan at ugnayang ipinahihiwatig ng Hebreo.
- source_word: אֶחָיו
  choice: kanyang mga kapatid
  rationale: Tuwirang pinananatili nito ang panlalaking pangmaramihang anyo ng Hebreo. Sa konteksto, ang tinutukoy ay ang mga kapuwa Israelita, lalo na ang ibang mga lipi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: הוּא
  choice: mismo
  rationale: Ang hiwalay na panghalip sa Hebreo ay nagbibigay-diin. Likas na naipahahayag ito sa Filipino sa “si Yahweh mismo ang kanyang mana.”
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: gaya ng sinabi niya sa kanya
  rationale: Pinananatili ng “sinabi” ang karaniwang kahulugan ng pandiwang דִּבֶּר nang hindi idinaragdag ang mas interpretibong ideya ng tahasang pangako. Pinananatili rin ang mga panghalip ng pinagmulang teksto.
theological_decisions:
- issue: Tinutukoy ng mga pang-isahang panghalip na “siya,” “kanyang,” at “kanya”
  choice: Pinanatili ang pang-isahang anyo bilang kolektibo o kinatawang pagtukoy sa Levita o Levitikong pari.
  alternative: Maaaring tumukoy ito kay Levi bilang ninuno ng lipi, o sa bawat pari nang paisa-isa.
  rationale: Karaniwang gumagamit ang biblikal na Hebreo ng pang-isahang anyo para sa isang pangkat na kinakatawan bilang iisa. Hindi nililimitahan ng salin ang pagtukoy sa isa lamang sa mga posibleng pagkaunawa.
- issue: Kalikasan ng pahayag na “si Yahweh mismo ang kanyang mana”
  choice: Pinanatili ang maikli at metaporikal na pahayag nang walang paliwanag na idinagdag sa pangunahing teksto.
  alternative: Palawakin bilang “si Yahweh ang bahaging inilaan sa kanya sa halip na lupa.”
  rationale: Ang pinagmulang teksto ay tahasang nagsasabing si Yahweh ang mana. Pinananatili nito ang mayamang teolohikal na pahayag at hindi ito pinapaliit sa isang paliwanag lamang.
- issue: Diwa ng כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: gaya ng sinabi niya sa kanya
  alternative: gaya ng ipinangako niya sa kanya
  rationale: Maaaring ipinahihiwatig ng konteksto ang isang pangako, ngunit ang pandiwa mismo ay karaniwang nangangahulugang magsalita o magsabi. Iniwasang gawing tahasan ang ipinahihiwatig lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “mana,” ang diin ng “mismo,” at ang hindi tiyak na reperensiya ng mga panghalip. Ginamit ang “kapatid” sa malawak na biblikal na diwa ng kapuwa kabilang sa Israel, na nilinaw sa talababa.
