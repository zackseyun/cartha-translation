base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/020.yaml
  text: But the prophet who presumptuously speaks a word in my name that I have not commanded him to speak[b][a], or who speaks in the name of other gods—that prophet shall die.
translation:
  language: tl
  text: Ngunit ang propetang mangahas magsalita sa pangalan ko ng salitang hindi ko iniutos sa kanya na sabihin[a], o magsalita sa pangalan ng ibang mga diyos—ang propetang iyon ay dapat mamatay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kumilos nang may kapangahasan” o “magsalita nang may pagmamataas.” Ang pandiwang Hebreo ay tumutukoy sa kusang-loob at mapagmataas na paglampas sa itinakdang awtoridad.
    reason: lexical_alternative
  - marker: b
    text: O “kailangang mamatay” o “ay papatayin.” Maikli at tuwirang ipinahahayag ng Hebreo ang legal na hatol na kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Nagpapakita ng matinding pagsalungat sa naunang paglalarawan sa lehitimong propeta; natural at marangal sa modernong Tagalog.
- source_word: הַנָּבִיא
  choice: ang propeta
  rationale: Karaniwang katumbas ng נָבִיא at pinananatili ang tiyak na pantukoy.
- source_word: יָזִיד
  choice: mangahas
  rationale: Ipinahihiwatig ng Hiphil ng זיד ang kusang-loob at mapagmataas na paglampas sa awtoridad. Ang “mangahas” ay natural sa Tagalog at malinaw na naghahayag ng sadyang kapangahasan.
- source_word: לְדַבֵּר דָּבָר
  choice: magsalita ... ng salitang
  rationale: Pinananatili ang kaugnayan ng pandiwa at pangngalan sa Hebreo nang hindi nagiging di-natural sa Tagalog.
- source_word: בִּשְׁמִי
  choice: sa pangalan ko
  rationale: Karaniwang idyoma para sa pag-angkin na nagsasalita taglay ang awtoridad ng Diyos; pinananatili ang unang panauhan.
- source_word: אֵת אֲשֶׁר לֹא צִוִּיתִיו לְדַבֵּר
  choice: ng salitang hindi ko iniutos sa kanyang sabihin
  rationale: Pinananatili ang tahasang wika ng banal na utos at ang bagay na hindi iniutos na sabihin.
- source_word: וַאֲשֶׁר יְדַבֵּר
  choice: o magsalita
  rationale: Ang waw ay nag-uugnay ng ikalawang hiwalay na paglabag; malinaw na ipinapakita ng “o” na alinman sa dalawang gawain ay saklaw.
- source_word: בְּשֵׁם אֱלֹהִים אֲחֵרִים
  choice: sa pangalan ng ibang mga diyos
  rationale: Tuwiran at natural na salin ng pag-angkin ng awtoridad mula sa mga karibal na diyos.
- source_word: וּמֵת
  choice: ay dapat mamatay
  rationale: Ipinahahayag ang legal na hatol ng kamatayan sa malinaw na modernong Tagalog, nang hindi tahasang idinaragdag ang paraang ipatutupad ito.
- source_word: הַנָּבִיא הַהוּא
  choice: ang propetang iyon
  rationale: Pinananatili ang mariing pagtukoy ng pangngalan at demonstratibo sa natural na ayos ng Tagalog.
theological_decisions:
- issue: Pagtukoy sa banal na pangalan sa tuwirang pagsasalita
  choice: Pinanatili ang unang panauhan bilang “sa pangalan ko.”
  alternative: “sa pangalan ng PANGINOON”
  rationale: Tuwirang nagsasalita ang Diyos sa Hebreo. Iniiwasan nitong magdagdag ng titulong wala sa mismong pangungusap.
- issue: Pormula ng parusang kamatayan
  choice: “ay dapat mamatay”
  alternative: “ay papatayin” / “tiyak na mamamatay”
  rationale: Tersong legal na hatol ang וּמֵת. Pinananatili ng salin ang normatibong bigat nito ngunit hindi nililinaw nang higit sa Hebreo kung kusang kamatayan ba o tahasang pagpatay ang anyo ng pagpapatupad.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mangahas” upang maipahayag ang sadyang kapangahasan nang hindi mabigat o lipas ang pananalita. Ang mga pananda ng talababa ay parehong nasa pangunahing teksto at nakaayos ayon sa kaugnay na parirala.
