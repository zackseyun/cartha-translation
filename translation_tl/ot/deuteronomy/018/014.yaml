revisions:
- from: Sapagkat ang mga bansang ito na iyong paaalisin[a] ay nakikinig sa mga manghuhula ayon sa mga palatandaan[b] at sa mga manghuhula; ngunit para sa iyo, hindi ganito ang ipinagkaloob sa iyo ni Yahweh na iyong Diyos.[c]
  to: Sapagkat ang mga bansang ito na iyong paaalisin[a] ay nakikinig sa mga naghuhula batay sa mga palatandaan[b] at sa mga manghuhula; ngunit para sa iyo, hindi ipinagkaloob ni Yahweh na iyong Diyos ang ganito.[c]
  rationale: Inayos ang huling sugnay upang maging malinaw at natural sa Filipino, samantalang pinanatili ang pandiwang “ipinagkaloob” at ang implicit na bagay ng Hebreo. Pinagaan ang unang katawagan para sa omen-reader at itinuwid ang paliwanag sa talababa.
