  text: כִּ֣י הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה אֲשֶׁ֤ר אַתָּה֙ יוֹרֵ֣שׁ אוֹתָ֔/ם אֶל מְעֹנְנִ֥ים וְ/אֶל קֹסְמִ֖ים יִשְׁמָ֑עוּ וְ/אַתָּ֕ה לֹ֣א כֵ֔ן נָ֛תַן לְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/014.yaml
  text: For these nations[a], which you are dispossessing, listen to soothsayers and diviners; but as for you[c][b], Yahweh your God has not allowed you to do this.
translation:
  language: tl
  text: Sapagkat ang mga bansang ito na iyong paaalisin[a] ay nakikinig sa mga naghuhula batay sa mga palatandaan[b] at sa mga manghuhula; ngunit para sa iyo, hindi ipinagkaloob ni Yahweh na iyong Diyos ang ganito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na iyong itinataboy” o “na ang lupain ay iyong inaangkin.” Maaaring saklawin ng pandiwang Hebreo ang pag-angkin sa lupain at ang pagpapaalis sa mga dating naninirahan dito.
    reason: lexical_alternative
  - marker: b
    text: Ang katawagang Hebreo ay tumutukoy sa mga taong bumabasa ng mga palatandaan upang hulaan ang mangyayari.
    reason: cultural_note
  - marker: c
    text: 'Sa literal na Hebreo: “ngunit ikaw, hindi ganito ang ipinagkaloob sa iyo ni Yahweh na iyong Diyos.” Hindi tahasang binabanggit ang bagay na ipinagkaloob; ipinahihiwatig ng konteksto ang gayong mga gawain o paraan ng paghingi ng patnubay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan kaugnay ng naunang pagbabawal.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ang mga bansang ito
  rationale: Tumutukoy sa mga di-Israelitang bayan sa lupaing aangkinin; natural at pamantayang salin ang “mga bansa.”
- source_word: אֲשֶׁר אַתָּה יוֹרֵשׁ אֹתָם
  choice: na iyong paaalisin
  rationale: Sa konteksto ng Deuteronomio, ang ירשׁ ay nagsasangkot ng pag-angkin sa lupain sa pamamagitan ng pagpapaalis sa dating mga naninirahan; inilalagay sa talababa ang mas malawak na saklaw.
- source_word: אֶל מְעֹנְנִים
  choice: sa mga manghuhula ayon sa mga palatandaan
  rationale: Tumutukoy sa mga nagsasagawa ng omen-reading o augury; nililinaw ng parirala ang kaibhan nito sa kasunod na pangkalahatang katawagan.
- source_word: וְאֶל קֹסְמִים
  choice: at sa mga manghuhula
  rationale: Ang קֹסְמִים ay mga nagsasagawa ng divination; “mga manghuhula” ang natural at madaling maunawaang katumbas sa modernong Filipino.
- source_word: יִשְׁמָעוּ
  choice: ay nakikinig
  rationale: Pinananatili ang pangunahing diwa ng שׁמע na pakikinig, na sa konteksto ay may kahulugang pagbibigay-pansin o pagsunod sa payo.
- source_word: וְאַתָּה לֹא כֵן
  choice: ngunit para sa iyo, hindi ganito
  rationale: Pinananatili ang mariing paghahambing at ang eliptikong anyo ng Hebreo sa halip na gawing tahasang utos.
- source_word: נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: ang ipinagkaloob sa iyo ni Yahweh na iyong Diyos
  rationale: Pinananatili ang literal na diwa ng נתן na “ipagkaloob” at ang pahiwatig na ang gayong paraan ng patnubay ay hindi ibinigay sa Israel.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ANG PANGINOON / Jehova
  rationale: Ginagamit ang personal na pangalang tipan na nasa tekstong Hebreo, nang hindi ito pinapalitan ng titulo.
- issue: Eliptikong pahayag na לֹא כֵן נָתַן לְךָ
  choice: hindi ganito ang ipinagkaloob sa iyo
  alternative: hindi ka pinahintulutan na gawin ito
  rationale: Pinananatili ang kakaiba at bahagyang di-tiyak na pagkakabuo ng Hebreo, pati ang pandiwang “ipinagkaloob,” sa halip na tahasang ipakahulugan bilang pahintulot o pagbabawal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang elipsis at tensiyon ng Hebreo sa huling sugnay; iniwasan ang sobrang kolokyal na “manghuhula ng kapalaran” at ang teknikal na “augur.”
