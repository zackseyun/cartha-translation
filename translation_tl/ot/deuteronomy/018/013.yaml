  text: You shall be blameless with Yahweh your God[a].
translation:
  language: tl
  text: Maging buong-buo ka kay Yahweh na iyong Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maging ganap” o “maging walang kapintasan” kay Yahweh na iyong Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמִים
  choice: ganap
  rationale: Sinasaklaw ng “ganap” ang diwa ng kabuuan, integridad, at kawalan ng kapintasan, nang hindi agad nililimitahan ang salita sa ganap na kawalan ng kasalanan. Ang mga posibleng diwang “buo” at “walang kapintasan” ay pinanatili sa talababa.
- source_word: תִּהְיֶה
  choice: maging ... ka
  rationale: Ang anyong di-ganap ng היה ay gumaganap dito bilang utos o paghihikayat. Ang “maging ... ka” ay likas at tuwirang pahayag sa modernong Tagalog.
- source_word: עִם
  choice: kay
  rationale: Bagaman karaniwang nangangahulugang “kasama” ang עִם, ang literal na “kasama ni Yahweh” ay maaaring maghatid ng ibang diwa sa Tagalog. Ipinahahayag ng “kay” ang kaugnayan at katapatan sa Diyos nang hindi tahasang ginagawang “sa harap ni.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Ang anyong may hulaping ikalawang panauhang panlalaki na isahan ay tumutukoy sa Diyos ng Israel; ang “iyong Diyos” ay malinaw at marangal sa Tagalog.
theological_decisions:
- issue: Kahulugan ng תָּמִים sa panawagang tipan
  choice: Ganap sa diwa ng buo at tapat na integridad kay Yahweh
  alternative: Walang kapintasan sa harap ni Yahweh; buong-buo kay Yahweh
  rationale: Sa konteksto ng Deuteronomio 18:9–14, ang panawagan ay salungat sa panghuhula at iba pang ipinagbabawal na gawain. Pinananatili ng “ganap” ang saklaw at tensiyon ng Hebreo—kabuuan, integridad, at kawalan ng kapintasan—nang hindi ipinapakahulugang tahasang lubos na walang kasalanan.
translation_notes:
  register: Maikli, marangal, at madaling maunawaan sa modernong Filipino. Ginamit ang “ganap” upang mapanatili ang malawak na kahulugan ng תָּמִים; nilinaw sa talababa ang mahahalagang alternatibo.
