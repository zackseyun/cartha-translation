translation:
  language: tl
  text: Kakain sila ng magkakapantay na bahagi,[a] bukod pa sa nakukuha niya mula sa pagbebenta ng mana ng kanyang angkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bukod pa sa tinatanggap niya mula sa pagbebenta ng mga ari-arian ng pamilya.” Mahirap unawain ang Hebreo sa huling sugnay at maaari itong tumukoy nang mas pangkalahatan sa kita o mga karapatang kaugnay ng sambahayan ng kanyang mga ninuno.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק כְּחֵלֶק
  choice: magkakapantay na bahagi
  rationale: Ang idyomang “bahagi gaya ng bahagi” ay nagpapahayag ng pantay na paghahati; natural at malinaw sa modernong Filipino ang “magkakapantay na bahagi.”
- source_word: יֹאכֵלוּ
  choice: kakain sila
  rationale: Pinananatili nito ang kongkretong pandiwang Hebreo na “kumain,” na tumutukoy sa pagtanggap at pagkain ng itinakdang panustos.
- source_word: לְבַד
  choice: bukod pa sa
  rationale: Ipinakikita nitong hiwalay at karagdagan ang sumusunod na bagay sa pantay na bahaging kinakain nila.
- source_word: מִמְכָּרָיו
  choice: anumang mula sa ipinagbili niya
  rationale: Maaaring tumukoy ang salita sa mga ipinagbili o sa napagbentahan; sadyang maluwag ang “anumang mula sa” upang hindi lubusang isara ang tunay na kalabuan.
- source_word: עַל הָאָבוֹת
  choice: minana sa kanyang angkan
  rationale: Ang literal na pariralang “sa ibabaw/ayon sa mga ama” ay eliptikal at malamang na tumutukoy sa ari-arian o karapatang kaugnay ng mga ninuno at sambahayan.
theological_decisions:
- issue: Kahulugan ng huling sugnay na מִמְכָּרָיו עַל הָאָבוֹת
  choice: Hiwalay na pakinabang mula sa ipinagbiling minana o ari-ariang kaugnay ng angkan
  alternative: Maaaring tumukoy nang mas pangkalahatan sa anumang kita o karapatang nagmumula sa sambahayan ng kanyang mga ninuno.
  rationale: Siksik at mahirap ang sintaks ng Hebreo. Inilalahad ng pangunahing salin ang malamang na diwa ngunit nilalagyan ng talababa upang mapanatili ang lehitimong kalabuan at hindi gawing tiyak ang isang pinagtatalunang detalye.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang konkretong “kakain” at ang diwa ng pantay na bahagi, habang ang talababa ay hayagang nagtatala ng kalabuan sa huling sugnay.
