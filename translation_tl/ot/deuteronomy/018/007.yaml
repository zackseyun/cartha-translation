base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/007.yaml
  text: then he may minister in the name of Yahweh his God[c][b][a], like all his brothers the Levites who stand there before Yahweh.
translation:
  language: tl
  text: At maaari siyang maglingkod[b] sa pangalan ni Yahweh[a] na kanyang Diyos, gaya ng lahat ng kapatid[c] niyang Levita na nakatayo roon sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebreo YHWH; ayon sa tradisyon, isinasaling “ang PANGINOON.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “at maglilingkod siya.” Maaaring ipahayag ng Hebreong imperfect ang pahintulot o ang mas tuwirang panghinaharap na kilos sa kontekstong ito.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “kanyang mga kapatid,” ibig sabihin, ang mga kapwa niya Levita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: At maaari siyang maglingkod
  rationale: Ang Piel ng שׁרת ay tumutukoy sa paglilingkod na panrelihiyon, lalo na sa santuwaryo. Pinananatili ng “maglingkod” ang diwa nito sa natural na Tagalog; ipinahahayag ng “maaari” ang pinahihintulutang kilos sa kontekstong legal, habang ang “At” ay nag-uugnay sa naunang talata.
- source_word: בְּשֵׁם
  choice: sa pangalan ni
  rationale: Likas na katumbas ito ng idyomang Hebreo na nagsasaad ng pagkilos sa ilalim ng awtoridad o sa pagtawag sa pangalan ng isang tao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָיו
  choice: kanyang Diyos
  rationale: Tuwirang pinananatili ang panghalip na paari sa Hebreo at ang pagtukoy sa Diyos ng Levita.
- source_word: כְּכָל
  choice: gaya ng lahat
  rationale: Malinaw at natural na ipinahahayag ang paghahambing na dala ng כְּ at ang kabuuang saklaw ng כָּל.
- source_word: אֶחָיו הַלְוִיִּם
  choice: lahat ng kapatid niyang mga Levita
  rationale: Pinananatili ang panlalaking katawagang pangkamag-anak na “mga kapatid,” habang nililinaw ng kasunod na “mga Levita” kung sino ang tinutukoy.
- source_word: הָעֹמְדִים
  choice: na nakatayo
  rationale: Pinananatili ang literal na larawan ng עמד, nang hindi ito tahimik na ipinapakahulugang “naglilingkod.”
- source_word: שָׁם
  choice: roon
  rationale: Tuwirang tumutukoy sa lugar ng santuwaryo na binabanggit sa konteksto.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang karaniwang Hebreong pahayag para sa pagiging nasa presensiya ng Diyos, at natural pa rin ito sa Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalang pantangi ang YHWH sa Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulong “PANGINOON.”
- issue: Lakas ng Hebreong imperfect sa וְשֵׁרֵת
  choice: maaari siyang maglingkod
  alternative: maglilingkod siya
  rationale: Sa legal na konteksto ng mga talata 6–7, maaaring ipahayag ng anyo ang pahintulot o ang tuwirang kinahinatnan. Pinili ang pahintulot ngunit itinala ang alternatibo upang mapanatili ang tunay na gramatikal na posibilidad.
- issue: Panlalaking katawagang אֶחָיו
  choice: mga kapatid
  alternative: mga kapwa Levita
  rationale: Tahasang panlalaking maramihan ang salitang Hebreo. Pinananatili ang “mga kapatid,” at nililinaw ng appositive na “mga Levita” ang tinutukoy nang hindi pinapapantay ang katawagang pangkamag-anak.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “Yahweh,” ang literal na larawang “nakatayo,” at ang katawagang “mga kapatid,” habang ginawang natural sa Tagalog ang ayos ng appositive na “mga Levita.”
