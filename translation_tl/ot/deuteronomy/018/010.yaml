base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/010.yaml
  text: There must not be found among you anyone who makes his son or his daughter pass through the fire[a], one who practices divination, tells fortunes, interprets omens[d][c][b], or practices sorcery.
translation:
  language: tl
  text: Huwag matagpuan sa inyo ang sinumang nagpaparaan sa kaniyang anak na lalaki o babae sa apoy[a], nagsasagawa ng panghuhula, nagsasabi ng kapalaran[b], nagpapakahulugan sa mga tanda[c], o nagsasagawa ng salamangka[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “sinusunog sa apoy ang kaniyang anak na lalaki o babae” o “inihahandog sa apoy ang kaniyang anak na lalaki o babae.” Literal sa Hebreo: “nagpaparaan sa kaniyang anak na lalaki o babae sa apoy.”'
    reason: alternative_reading
  - marker: b
    text: Ang salitang Hebreo ay mahirap tiyakin; maaari rin itong tumukoy sa isang manghuhula o sa nagmamasid ng mga takdang panahon.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nanghuhula sa pamamagitan ng mga tanda.”
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “nagsasagawa ng pangkukulam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא בְךָ
  choice: Huwag matagpuan sa inyo
  rationale: Ang Niphal imperfect na may pagtanggi ay gumaganap bilang pagbabawal. Likas sa kontekstong pangkomunidad ang “sa inyo,” at pinananatili ng “matagpuan” ang larawan ng Hebreo.
- source_word: מַעֲבִיר בְּנוֹ וּבִתּוֹ בָּאֵשׁ
  choice: nagpapadaan sa apoy sa kaniyang anak na lalaki o babae
  rationale: Pinananatili nito ang causative na diwa ng עבר at ang mismong idyomang Hebreo nang hindi tiyakang ipinapakahulugan kung ang ritwal ay pagsunog o paghahandog.
- source_word: קֹסֵם קְסָמִים
  choice: nagsasagawa ng panghuhula
  rationale: Natural itong katumbas ng participle na may cognate accusative at malinaw na tumutukoy sa gawaing dibinasyon.
- source_word: מְעוֹנֵן
  choice: nagsasabi ng kapalaran
  rationale: Mahirap at pinagtatalunang termino ito. Ang parirala ay madaling maunawaan sa makabagong Filipino at hindi ito isinasanib sa kasunod na pagbasa ng mga tanda.
- source_word: מְנַחֵשׁ
  choice: nagpapakahulugan sa mga tanda
  rationale: Ipinahihiwatig ng pandiwa ang pagbasa o paggamit ng mga tanda bilang omen; malinaw ito at naiiba sa mas pangkalahatang panghuhula.
- source_word: מְכַשֵּׁף
  choice: nagsasagawa ng salamangka
  rationale: Isinasaad ng Piel participle ang aktibong paggawa ng mahika. Ang “salamangka” ay kasalukuyan at malinaw, samantalang inilalagay sa talababa ang posibleng “pangkukulam.”
theological_decisions:
- issue: Kalikasan ng ipinagbabawal na ritwal na may bata at apoy
  choice: Panatilihin ang idyomang “nagpapadaan sa apoy” sa pangunahing teksto.
  alternative: “Sinusunog sa apoy” o “inihahandog sa apoy.”
  rationale: Malinaw na hinahatulan ang ritwal na may kinalaman sa mga anak at apoy, ngunit hindi tahasang tinutukoy ng pariralang Hebreo sa talatang ito lamang ang eksaktong paraan nito. Iniiwasan ng salin ang labis na pagtitiyak.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Gumamit ng magkakahanay na pandiwang parirala para sa talaan ng mga ipinagbabawal na gawain, habang pinananatili ang tunay na kalabuan ng mga teknikal na terminong Hebreo sa pamamagitan ng mga talababa.
