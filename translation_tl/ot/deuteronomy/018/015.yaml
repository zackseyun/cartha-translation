base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/015.yaml
  text: Yahweh your God will raise up for you a prophet like me from among you[a], from your brothers[b]; you must listen to him.
translation:
  language: tl
  text: Si Yahweh na iyong Diyos ay magbabangon para sa iyo ng isang propetang tulad ko mula sa iyong gitna, mula sa iyong mga kapatid[a]. Dapat ninyo siyang pakinggan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa iyong gitna, mula sa iyong mga kapwa Israelita.” Ang salitang Hebreo para sa “mga kapatid” ay isang panlalaking terminong pangkamag-anak na dito ay tumutukoy sa mga kabilang sa Israel sa pangkalahatan.
    reason: lexical_alternative
  - marker: b
    text: Sa Bagong Tipan, ikinakapit ang talatang ito sa Mesiyas; gayunman, ang mismong Hebreo rito ay nagsasabing “isang propetang tulad ko.”
    reason: cross_reference
lexical_decisions:
- source_word: נָבִיא
  choice: isang propeta
  rationale: Pinananatili ang pang-isahang di-tiyak na anyo ng Hebreo at hindi paunang itinatakda kung tumutukoy ito sa isang partikular na pagkakakilanlan.
- source_word: מִקִּרְבְּךָ
  choice: mula sa gitna ninyo
  rationale: Malapit ito sa literal na diwa at malinaw na nagsasabing magmumula ang propeta sa loob ng bayang Israel.
- source_word: מֵאַחֶיךָ
  choice: mula sa inyong mga kapatid
  rationale: Pinananatili ang larawang pampamilya ng Hebreo. Sa kontekstong ito, ang tinutukoy ay mga kapwa kabilang sa Israel; nililinaw ito sa talababa.
- source_word: כָּמֹנִי
  choice: tulad ko
  rationale: Tuwirang pinananatili ang paghahambing ng propeta kay Moises.
- source_word: יָקִים לְךָ
  choice: magbabangon ... para sa inyo
  rationale: Ang Hiphil ng קום ay may diwang magbangon o magtalaga. Pinananatili ng salin ang larawan ng pandiwa at ang kapakinabangang ipinahihiwatig ng לְךָ.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na inyong Diyos
  rationale: Ginagamit ang personal na pangalang Yahweh para sa יהוה at pinananatili ang tipanang pariralang 'inyong Diyos.'
- source_word: אֵלָיו
  choice: siya
  rationale: Ang panghalip ay tumutukoy sa propetang ibabangon; sa natural na Filipino, isinasama ito bilang layon sa 'siyang pakinggan.'
- source_word: תִּשְׁמָעוּן
  choice: Dapat ninyo siyang pakinggan
  rationale: Ipinapahayag ang mariing pananagutang makinig at tumalima nang hindi nililimitahan ang malawak na saklaw ng Hebreong שׁמע sa salitang 'sumunod' lamang.
theological_decisions:
- issue: Posibleng mesiyanikong pagtukoy ng 'isang propetang tulad ko'
  choice: Pinananatili sa pangunahing teksto ang di-tiyak na pang-isahang 'isang propetang tulad ko.'
  alternative: Gawing tahasang 'ang Propeta' o 'ang Mesiyas.'
  rationale: Hindi tahasang sinasabi ng Hebreong talata ang titulong 'Mesiyas.' Pinananatili ng salin ang agarang pananalita habang binabanggit sa talababa ang pagkakapit dito sa Bagong Tipan.
- issue: Saklaw ng מֵאַחֶיךָ
  choice: mga kapatid, na may paliwanag na tumutukoy sa mga kapwa Israelita
  alternative: mga kapwa Israelita
  rationale: Pinananatili sa teksto ang terminong pangkamag-anak ng Hebreo, ngunit iniiwasang ipahiwatig na literal na magkakapatid lamang ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong “propeta” at ang tuwirang “Dapat ninyo siyang pakinggan” upang maipahayag ang puwersa ng utos. Bagaman pang-isahan ang kausap sa unang bahagi ng Hebreo at maramihan sa huling pandiwa, natural na “ninyo” ang ginamit sa Filipino dahil kolektibong bayan ang kinakausap at hindi karaniwang minamarkahan ng Filipino ang gayong pagpapalit.
