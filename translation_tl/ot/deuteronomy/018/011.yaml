  text: or one who binds a spell[a], or one who consults a medium or a spiritist[d][c][b], or one who seeks the dead.
translation:
  language: tl
  text: o ang bumibigkas ng inkantasyon[a], o ang sumasangguni sa isang midyum[b] o espiritista[c], o ang sumasangguni sa mga patay.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nagbibigkis ng isang bigkis”; isang idyomang Hebreo para sa paggawa o pagbigkas ng mahiwagang inkantasyon. Maaari ring isalin na “mang-eenkanto.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sumasangguni sa espiritu ng patay.” Ang salitang Hebreo ay maaaring tumukoy sa espiritu o sa midyum na ginagamit sa pagsangguni rito.
    reason: lexical_ambiguity
  - marker: c
    text: Maaari ring “taong may kaalamang okulto.” Tradisyonal din itong isinasaling “manggagaway,” ngunit mas malawak ang kahulugan ng salitang iyon sa Filipino.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “humihingi ng sagot sa mga patay” o “hinahanap ang mga patay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹבֵר חָבֶר
  choice: ang bumibigkas ng enkantasyon
  rationale: Ang idyomang Hebreo ay literal na may diwang “nagbibigkis ng isang bigkis,” ngunit sa talaan ng mga ipinagbabawal na gawaing okulto ay tumutukoy ito sa paggawa o pagbigkas ng mahiwagang inkantasyon. Ang “bumibigkas ng enkantasyon” ay malinaw at likas sa makabagong Filipino nang hindi nililimitahan ang salita sa gayuma o sumpa lamang.
- source_word: שֹׁאֵל אוֹב
  choice: ang sumasangguni sa isang midyum
  rationale: Maaaring tumukoy ang אוֹב sa espiritu ng patay o sa taong nagsisilbing midyum upang makipag-ugnayan dito. Sa pangunahing teksto, malinaw na inilalarawan ng “sumasangguni sa isang midyum” ang ipinagbabawal na gawain; pinananatili sa talababa ang tunay na leksikal na kalabuan.
- source_word: יִדְּעֹנִי
  choice: espiritista
  rationale: Tumutukoy ito sa isang taong nag-aangking may natatanging kaalamang okulto, karaniwang kaagapay ng אוֹב. Ang “espiritista” ay mas malinaw sa kasalukuyang Filipino kaysa “manggagaway,” na mas malawak ang saklaw, o “wizard,” na may makabagong pantasyang dating.
- source_word: דֹרֵשׁ אֶל הַמֵּתִים
  choice: ang sumasangguni sa mga patay
  rationale: Ang parirala ay tumutukoy sa paghahanap ng patnubay o kasagutan mula sa mga patay. Ang “sumasangguni” ay likas sa Filipino at nagpapahayag ng nekromantikong pagsangguni nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: וְ
  choice: o
  rationale: Bagaman karaniwang “at” ang pangatnig, dito ay ipinagpapatuloy nito ang talaan ng magkakahiwalay na ipinagbabawal na gawain at tao; natural sa Filipino ang “o” sa ganitong legal na listahan.
theological_decisions:
- issue: Paglalarawan sa mga gawaing okulto nang hindi nag-aangkat ng mas huling alamat o sistemang panrelihiyon
  choice: Gumamit ng malinaw na makabagong katawagang “enkantasyon,” “midyum,” at “espiritista.”
  alternative: Gumamit ng mga katawagang “manggagayuma,” “manggagaway,” o “mangkukulam.”
  rationale: Mas tiyak na inilalarawan ng mga piniling salita ang mga gawaing nasa tekstong Hebreo. Iniiwasan din ng mga ito ang pagsasama-sama ng magkakaibang gawain o ang pag-aangkat ng mga natatanging konsepto mula sa katutubong alamat, modernong pantasya, o isang partikular na tradisyong teolohikal.
- issue: Kalabuan ng אוֹב bilang espiritu ng patay o midyum
  choice: Ilagay sa pangunahing teksto ang “midyum” at itala sa talababa ang “espiritu ng patay.”
  alternative: Isalin sa pangunahing teksto bilang “espiritu ng patay.”
  rationale: Kapuwa pinatutunayan ng gamit ng salitang Hebreo ang espiritung sinasangguni at ang taong nagsisilbing tagapamagitan. Mas natural sa konteksto ng talaan ng mga practitioner ang “midyum,” ngunit hindi dapat burahin ang alternatibong pagbasa.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Pinanatili ang paulit-ulit na “o ang” upang malinaw ang bawat bahagi ng legal na talaan. Ginamit ang “midyum,” isang pamilyar na hiram na salita, upang maiwasan ang malabong o labis na may-kulturang katumbas.
