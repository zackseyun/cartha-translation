  text: And Yahweh said to me[a], ‘They have spoken well.’
translation:
  language: tl
  text: At sinabi sa akin ni Yahweh, “Mabuti ang sinabi nila.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Mabuti ang ginawa nila sa kanilang sinabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Ang wayyiqtol ng אמר ay nag-uugnay sa susunod na pangyayari sa salaysay; natural sa Filipino ang “At sinabi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֵלָי
  choice: sa akin
  rationale: Ang אֶל na may hulaping unang panauhang isahan ay tuwirang nangangahulugang “sa akin.”
- source_word: הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ
  choice: Mabuti ang sinabi nila
  rationale: Literal na pinupuri ng parirala ang ginawa nila kaugnay ng kanilang sinabi. Ang “Mabuti ang sinabi nila” ay natural na Filipino at pinananatili ang positibong pagtataya sa kanilang sinabi.
- source_word: דִּבֵּרוּ
  choice: sinabi
  rationale: Ang Piel perfect ng דבר ay tumutukoy sa natapos nilang pagsasalita; “sinabi” ang pinakanatural sa kontekstong ito.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang ayos na “sinabi sa akin ni Yahweh” at isang natural na pangunahing salin, habang inilagay sa talababa ang mas literal na kayarian ng Hebreo.
