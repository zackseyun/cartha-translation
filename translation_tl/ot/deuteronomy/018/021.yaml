base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/021.yaml
  text: And if you say in your heart[a], ‘How shall we know the word that Yahweh has not spoken?’
translation:
  language: tl
  text: At kung sasabihin mo sa iyong puso, “Paano natin malalaman ang salita[a] na hindi sinabi ni Yahweh?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mensahe” o “usapin.” Malawak ang saklaw ng Hebreong davar; sa kontekstong ito ng propesiya, pinakamainam ang “salita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: At kung
  rationale: Pinananatili nito ang ugnayan sa naunang konteksto at ang kondisyonal na diwa ng parirala.
- source_word: תֹאמַר
  choice: sasabihin mo
  rationale: Ang Qal imperfect na nasa ikalawang panauhang panlalaki at isahan ay likas na maisasalin sa kondisyong pangungusap bilang “kung sasabihin mo,” habang pinananatili ang tuwirang pakikipag-usap sa Israel.
- source_word: בִּלְבָבֶךָ
  choice: sa iyong puso
  rationale: Pinananatili ang Hebreong larawan ng puso bilang kaloob-looban at luklukan ng pag-iisip, sa halip na gawing tuwirang paraprasis na “sa iyong sarili.”
- source_word: אֵיכָה נֵדַע
  choice: Paano natin malalaman
  rationale: Likas at malinaw itong nagpapahayag ng tanong tungkol sa paraan ng pagkilala o pagtiyak.
- source_word: הַדָּבָר
  choice: ang salita
  rationale: Sa konteksto ng propesiya, ang דָּבָר ay tumutukoy sa isang ipinahayag na salita o mensahe. Ang “salita” ang pinakamalapit sa anyo at konteksto, habang inilalagay sa talababa ang tunay na lawak ng kahulugan.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ
  choice: na hindi sinabi
  rationale: Malinaw nitong ipinapakitang ang tinutukoy ay isang salitang hindi nagmula kay Yahweh, nang hindi dinaragdagan ang kahulugan ng pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang personal na pangalan ng Diyos ng Israel at sinusunod ang pamantayan ng proyekto, nang hindi ito pinapalitan ng titulong “Panginoon.”
- issue: Pagkilala sa salitang tunay na mula sa Diyos
  choice: Hindi nililinaw sa talatang ito ang pamantayan; pinananatili lamang ang tanong
  alternative: Isama o ipahiwatig agad ang pamantayang ibibigay sa kasunod na talata
  rationale: Ang talata 21 ay tanong, at nasa kasunod na konteksto ang sagot. Ang pagsasalin ay hindi dapat maagang magpasok ng paliwanag na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal na idyomang “sa iyong puso,” na nauunawaan pa rin bilang panloob na pag-iisip. Inilipat ang marker [a] sa “salita,” sapagkat ang talababa ay nagpapaliwanag sa Hebreong הַדָּבָר, hindi sa pariralang “sa iyong puso.”
