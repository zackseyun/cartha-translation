  naturalness: Likas at marangal ang “mga paring Levita,” “buong lipi,” at “bahagi o mana.” Mas malinaw at mas maayos ang pangungusap kapag ang dalawang bagay na kinakain ay magkapantay na iniuugnay sa “Kakainin nila.”
  terminology: Pinanatili ang “Yahweh,” “Levita,” “lipi,” at “mana.” Ang “mga handog na inihahandog sa apoy para kay Yahweh” ay mas tumpak na katumbas ng terminong panghandog kaysa “pinaraan sa apoy.”
