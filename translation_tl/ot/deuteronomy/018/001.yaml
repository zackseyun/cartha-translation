  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֹֽא יִ֠הְיֶה לַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם כָּל שֵׁ֧בֶט לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם יִשְׂרָאֵ֑ל אִשֵּׁ֧י יְהוָ֛ה וְ/נַחֲלָת֖/וֹ יֹאכֵלֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/001.yaml
  text: The Levitical priests—all the tribe of Levi—shall have no portion or inheritance with Israel[a]; they shall eat the food offerings of Yahweh, that is[b], his inheritance.
translation:
  language: tl
  text: Ang mga paring Levita—ang buong lipi ni Levi—ay hindi magkakaroon ng bahagi o mana kasama ng Israel. Kakainin nila ang mga handog na inihahandog sa apoy para kay Yahweh[a] at ang mana niya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “mga handog sa apoy ni Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang tinutukoy sa Hebreo kung kanino tumutukoy ang “niya.” Maaari itong tumukoy kay Yahweh o sa Levi bilang isang kabuuan. Ihambing ang Deuteronomio 18:2, kung saan sinasabing si Yahweh ang mana ng mga Levita.
    reason: ambiguity_and_cross_reference
lexical_decisions:
- source_word: לַכֹּהֲנִים הַלְוִיִּם
  choice: mga paring Levita
  rationale: Ipinakikita ng magkatabing katawagan na ang tinutukoy ay mga paring mula sa lipi ni Levi. Maikli at likas sa modernong Tagalog ang “mga paring Levita.”
- source_word: כָּל שֵׁבֶט לֵוִי
  choice: ang buong lipi ni Levi
  rationale: Pinananatili ng “buong” ang diin ng כָּל at nililinaw na saklaw ng pahayag ang kabuuan ng lipi ni Levi.
- source_word: חֵלֶק וְנַחֲלָה
  choice: bahagi o mana
  rationale: Ang magkalapit na mga terminong legal ay tumutukoy sa bahagi sa lupain o ari-ariang minana. Likas sa Tagalog ang “bahagi o mana” at hindi nito ipinahihiwatig na dalawang ganap na magkahiwalay na bagay ang tinutukoy.
- source_word: עִם יִשְׂרָאֵל
  choice: kasama ng Israel
  rationale: Ipinahahayag nito na hindi sila tatanggap ng kaparte sa pamana ng lupain kasama ng ibang Israelita.
- source_word: אִשֵּׁי יְהוָה
  choice: mga handog kay Yahweh na pinaraan sa apoy
  rationale: Pinananatili nito ang kaugnayan ng אִשֵּׁי sa apoy habang iniiwasang ipahiwatig na kinakain ng mga pari ang bahaging lubusang sinunog.
- source_word: וְנַחֲלָתוֹ
  choice: pati ang mana niya
  rationale: Pinananatili ng “niya” ang panlalaking pang-isahang hulapi at ang hindi tiyak na tinutukoy nito, sa halip na tahasang ipakahulugang kay Yahweh o sa Levi ang mana.
- source_word: יֹאכֵלוּן
  choice: ang kanilang kakainin
  rationale: Ang anyong panghinaharap ay angkop sa probisyong legal at malinaw na iniuugnay sa mga Levita ang dalawang bagay na kakainin.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kaugnayan ng אִשֵּׁי יְהוָה at וְנַחֲלָתוֹ
  choice: Pinag-ugnay bilang dalawang pariralang may “pati,” nang hindi ginagawang tiyak na pagpapaliwanag ang ikalawa sa una
  alternative: “mga handog kay Yahweh na pinaraan sa apoy—samakatuwid, ang mana niya”
  rationale: Ang Hebreong וְ ay maaaring simpleng pang-ugnay at hindi tahasang nagsasabing appositional ang ikalawang parirala. Pinananatili ng salin ang tunay na kalabuan sa halip na sapilitang gawing “samakatuwid” ang ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lipi,” “bahagi,” at “mana” bilang karaniwang bokabularyong angkop sa kontekstong legal at panrelihiyon. Pinanatili ang mga pangalang Yahweh at Levi at iniwasan ang denominasyonal na pagpapakahulugan.
