source:
  edition: WLC
  text: וְ/כִֽי יָבֹ֨א הַ/לֵּוִ֜י מֵ/אַחַ֤ד שְׁעָרֶ֨י/ךָ֙ מִ/כָּל יִשְׂרָאֵ֔ל אֲשֶׁר ה֖וּא גָּ֣ר שָׁ֑ם וּ/בָא֙ בְּ/כָל אַוַּ֣ת נַפְשׁ֔/וֹ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/006.yaml
  text: And if the Levite comes from one of your gates out of all Israel[a], where he is residing, and comes with all the desire of his soul to the place that Yahweh will choose[b],
translation:
  language: tl
  text: At kung ang Levita ay dumating mula sa isa sa iyong mga bayan, saanman sa Israel[a] siya naninirahan, at pumunta nang buong pananabik sa lugar na pipiliin ni Yahweh[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “mula sa isa sa iyong mga pintuang-bayan.” Ang “mga pintuang-bayan” ay ginagamit dito bilang pantukoy sa isang bayan o pamayanan.
    reason: cultural_note
  - marker: b
    text: O, “taglay ang buong pananabik ng kanyang kaluluwa” o “nang buong nais ng kanyang kalooban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: At kung
  rationale: Pinananatili ang pang-ugnay at kondisyunal na diwa ng kasong legal na kaugnay ng naunang tuntunin.
- source_word: הַלֵּוִי
  choice: ang Levita
  rationale: Sinasalamin ang tiyak na pantukoy sa Hebreo, na ginagamit dito bilang pangkalahatang kinatawan ng isang uri.
- source_word: מֵאַחַד שְׁעָרֶיךָ
  choice: sa alinman sa iyong mga bayan
  rationale: Literal itong tumutukoy sa isa sa 'mga pintuang-bayan,' ngunit metonimiko itong nangangahulugang bayan o pamayanang pinamamahalaan sa pintuang-bayan; ang 'mga bayan' ay likas at malinaw sa modernong Tagalog.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: sa buong Israel
  rationale: Ipinahihiwatig na maaari siyang manggaling sa alinmang bahagi ng teritoryo ng Israel.
- source_word: אֲשֶׁר הוּא גָּר שָׁם
  choice: kung saan siya naninirahan
  rationale: Ang גור ay may diwa ng paninirahan bilang nakikitira o dayong residente; pinananatili ng 'naninirahan' ang pangunahing diwa nang hindi labis na nililinaw ang katayuang panlipunan.
- source_word: וּבָא
  choice: at pumunta
  rationale: Pinananatili ang pag-uulit ng pandiwang 'dumating/pumunta' at ang pagkakasunod ng kilos sa Hebreo.
- source_word: בְּכָל אַוַּת נַפְשׁוֹ
  choice: ayon sa buong pagnanais ng kanyang kaluluwa
  rationale: Malapit sa anyo ng Hebreo at ipinahahayag ang buo at kusang pananabik ng tao, habang iniiwasang gawing 'puso' ang נֶפֶשׁ sa pangunahing teksto.
- source_word: אֶל הַמָּקוֹם
  choice: sa lugar
  rationale: Hindi idinagdag sa pangunahing teksto ang 'santuwaryo' o 'lugar ng pagsamba,' sapagkat 'ang lugar' lamang ang tahasang sinasabi ng Hebreo.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: na pipiliin ni Yahweh
  rationale: Ang aspektong di-ganap ng pandiwa ay angkop na isinalin sa hinaharap, ayon sa paulit-ulit na pormula sa Deuteronomio.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehovah
  rationale: Tahasan ang Tetragrammaton sa tekstong Hebreo; pinananatili ng 'Yahweh' ang natatanging pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Pagkilala sa 'lugar'
  choice: panatilihing 'lugar'
  alternative: santuwaryo / lugar ng pagsamba
  rationale: Bagaman tumutukoy ang konteksto sa sentrong lugar ng pagsamba, hindi ito tahasang pinangalanan sa talata; pinananatili ng salin ang pagiging di-tiyak ng pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'Levita,' 'mga bayan,' at 'naninirahan' bilang karaniwang biblikal at likas na mga salita. Pinanatili ang mahabang kondisyunal na pangungusap at kuwit sa hulihan sapagkat nagpapatuloy ang diwa sa kasunod na talata.
