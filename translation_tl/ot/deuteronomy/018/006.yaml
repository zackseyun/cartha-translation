revisions:
- from: At kung ang Levita ay manggaling sa alinman sa iyong mga bayan sa buong Israel[a], kung saan siya naninirahan, at pumunta ayon sa buong pagnanais ng kanyang kaluluwa sa lugar na pipiliin ni Yahweh[b],
  to: At kung ang Levita ay dumating mula sa isa sa iyong mga bayan, saanman sa Israel[a] siya naninirahan, at pumunta nang buong pananabik sa lugar na pipiliin ni Yahweh[b],
  rationale: Inayos ang dalawang pariralang hindi gaanong likas sa modernong Tagalog nang hindi binabago ang kahulugan. Pinananatili ang kondisyunal na anyo, ang hindi tiyak na “lugar,” ang hinaharap na “pipiliin,” ang pangalang Yahweh, at ang hulihang kuwit dahil nagpapatuloy ang pangungusap sa kasunod na talata.
