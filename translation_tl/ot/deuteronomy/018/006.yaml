  naturalness: Ang “manggaling” at “ayon sa buong pagnanais ng kanyang kaluluwa” ay mabigat sa daloy ng pangungusap. Ang “dumating mula sa” at “nang buong pananabik” ay mas likas at marangal na modernong Tagalog. Ang ayos na “saanman sa Israel siya naninirahan” ay malinaw na ikinakabit ang sugnay sa Levita.
  terminology: Ang “Levita,” “Israel,” at “Yahweh” ay angkop at pare-pareho. Ang “mga bayan” ay wastong pagpapahayag ng metonimikong “mga pintuang-bayan”; pinananatili ng talababa ang literal na anyo. Hindi dapat gawing “santuwaryo” ang “lugar,” sapagkat hindi iyon tahasang sinasabi ng Hebreo.
