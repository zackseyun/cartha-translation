  text: And the man who does not listen to my words that he speaks in my name—I myself will require it from him[a].
translation:
  language: tl
  text: At ang taong hindi makikinig sa aking mga salitang sasabihin ng propeta sa aking pangalan—ako mismo ang magpapapanagot sa kanya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hihingin ko ito mula sa kanya.” Sa literal, “hihingin ko ito mula sa kanya”; ipinahahayag nito na pananagutin ng Diyos ang taong tumatangging makinig sa mga salita ng propeta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: At
  rationale: Ipinag-uugnay nito ang babala sa naunang pangako tungkol sa propeta; natural sa Tagalog ang “At” nang hindi dinaragdagan ang teksto ng isang tahasang pormula tungkol sa hinaharap.
- source_word: הָאִישׁ
  choice: ang taong
  rationale: Bagaman panlalaking isahan ang anyong Hebreo, ginagamit ito bilang kinatawan ng sinumang tao; ang “ang taong” ay natural at tumpak sa Tagalog.
- source_word: לֹא יִשְׁמַע אֶל
  choice: hindi makikinig sa
  rationale: Pinananatili ng “makikinig sa” kapuwa ang literal na pakikinig at ang pahiwatig ng pagtugon o pagtalima, nang hindi agad nililimitahan sa “susunod.”
- source_word: דְּבָרַי
  choice: aking mga salita
  rationale: Tuwirang tinutumbasan nito ang pangmaramihang anyo at pinananatili ang Diyos bilang nagsasalita.
- source_word: אֲשֶׁר יְדַבֵּר
  choice: na sasabihin ng propeta
  rationale: Ang paksa ng pandiwa ay ang propetang binanggit sa naunang talata. Ang pagbanggit sa “propeta” ay nililinaw ang reperensiya na magiging malabo sa Tagalog kung “niya” lamang, at ang aspektong kontemplatibo ay angkop sa yiktôl na nakatuon sa hinaharap.
- source_word: בִּשְׁמִי
  choice: sa aking pangalan
  rationale: Pinananatili ang Hebreong idyoma at ang diwa ng pagsasalita bilang awtorisadong kinatawan ng Diyos.
- source_word: אָנֹכִי
  choice: ako mismo
  rationale: Ipinahahayag nito ang diin ng nakahiwalay na panghalip sa Hebreo.
- source_word: אֶדְרֹשׁ מֵעִמּוֹ
  choice: ang maniningil sa kanya
  rationale: Ang “maniningil” ay naghahatid ng solemne at hudisyal na pananagutan, habang ang footnote ay nagpapanatili sa mas literal na anyo at sa alternatibong “pananagutin.”
theological_decisions:
- issue: Uri ng tugon ng Diyos sa hindi pakikinig sa mga salita ng propeta
  choice: ako mismo ang maniningil sa kanya
  alternative: ako mismo ang mananagot sa kanya / pananagutin ko siya
  rationale: Ipinahahayag ng Hebreo ang banal na pagsingil ng pananagutan ngunit hindi tinutukoy ang eksaktong paraan o parusa. Hindi ito pinalalawak tungo sa isang partikular na kaparusahan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “propeta” sa relative clause upang maging malinaw ang paksa sa Tagalog, batay sa agarang konteksto, nang hindi binabago ang kahulugan.
