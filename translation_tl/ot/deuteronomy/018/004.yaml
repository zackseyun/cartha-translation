  text: You shall give him the firstfruits of your grain[a], your new wine, and your oil[c][b], and the first of the fleece of your flock.
translation:
  language: tl
  text: Ibigay mo sa kanya ang mga unang bahagi ng iyong butil, bagong alak, at langis[a], pati ang unang bahagi ng balahibong ginupit mula sa iyong kawan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga unang bunga ng iyong butil, bagong alak, at langis.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang unang bahagi mula sa paggugupit sa iyong kawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: unang bahagi
  rationale: Tumutukoy ito sa una o panimulang bahagi ng ani o produkto. Ang “unang bahagi” ay likas sa modernong Tagalog at hindi nililimitahan ang kahulugan sa literal na bunga lamang.
- source_word: דָּגָן
  choice: butil
  rationale: Malawak na tawag ito sa mga produktong butil; malinaw at karaniwan ang “butil” sa Tagalog.
- source_word: תִּירוֹשׁ
  choice: bagong alak
  rationale: Karaniwang tumutukoy ang salita sa bagong gawang alak o sariwang produktong alak, kaya pinananatili ng “bagong alak” ang kaibhan nito sa pangkalahatang salitang alak.
- source_word: יִצְהָר
  choice: langis
  rationale: Tumutukoy ito sa sariwang langis, karaniwang langis ng olibo sa kontekstong Israelita. Ang “langis” ang tuwirang salin nang hindi nagdaragdag ng uri na hindi tahasang binanggit.
- source_word: גֵּז
  choice: ginupit na balahibo
  rationale: Maaaring tumukoy sa ginupit na lana o sa bunga ng paggugupit. Ang “ginupit na balahibo” ay konkretong bagay na maibibigay at malinaw sa karaniwang mambabasa.
- source_word: צֹאן
  choice: kawan
  rationale: Kolektibong tawag ito sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Napananatili ng “kawan” ang kolektibong diwa nang hindi ito nililimitahan sa tupa lamang.
- source_word: תִּתֶּן לוֹ
  choice: Ibigay mo sa kanya
  rationale: Ang anyong pandiwa ay utos na pambatas sa konteksto. Likas sa Tagalog ang “Ibigay mo,” at pinananatili ng “sa kanya” ang isahang panghalip ng Hebreo.
theological_decisions:
- issue: Tinutukoy ng isahang panghalip na לוֹ (“sa kanya”)
  choice: Pinanatili ang “sa kanya,” na tumutukoy sa saserdoteng tatanggap sa agarang konteksto.
  alternative: Tahasang sabihing “sa saserdote” o unawain itong kumakatawan sa buong pangkat ng mga saserdote.
  rationale: Isahan ang panghalip sa Hebreo. Ang pagpapanatili nito ay hindi nagpapasiya kung isang kinatawang saserdote o ang uring saserdotal sa kolektibong diwa ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa estilong pambatas. Ginamit ang tuwirang isahang utos na “Ibigay mo” at iniwasan ang labis na teknikal o denominasyonal na pananalita.
