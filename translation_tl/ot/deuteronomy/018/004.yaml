  naturalness: Marangal at madaling maunawaan ang register ng draft. Ang “mga unang bahagi” at “balahibong ginupit mula sa iyong kawan” ay mas malinaw at mas likas na Tagalog sa kontekstong ito.
  terminology: Pinananatili ang “butil,” “bagong alak,” “langis,” at “kawan.” Ang “balahibong ginupit” ay hindi nililimitahan ang צֹאן sa tupa lamang, samantalang naihahatid nito ang kongkretong produkto ng גֵּז.
