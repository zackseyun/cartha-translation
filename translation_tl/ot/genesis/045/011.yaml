  text: וְ/כִלְכַּלְתִּ֤י אֹֽתְ/ךָ֙ שָׁ֔ם כִּי ע֛וֹד חָמֵ֥שׁ שָׁנִ֖ים רָעָ֑ב פֶּן תִּוָּרֵ֛שׁ אַתָּ֥ה וּ/בֵֽיתְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/011.yaml
  text: There I will provide for you, because there are still five years of famine, lest you and your household and all that belongs to you become destitute.
translation:
  language: tl
  text: Doon ay tutustusan kita, sapagkat may limang taon pa ng taggutom, upang hindi ka maghirap—ikaw, ang iyong sambahayan, at ang lahat ng pag-aari mo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: tutustusan kita
  rationale: Ang pandiwang כלכל sa kontekstong ito ay nangangahulugang maglaan ng ikabubuhay o tumustos; natural at malinaw sa modernong Tagalog ang “tutustusan.”
- source_word: כִּי
  choice: sapagkat
  rationale: 'Ipinapahayag nito ang dahilan ng pangako ni Jose: may limang taon pa ng taggutom.'
- source_word: פֶּן תִּוָּרֵשׁ
  choice: upang hindi ka maghirap
  rationale: Ang פן ay nagpapahayag ng pag-iwas sa kinatatakutang bunga, at ang ירשׁ sa anyong ito ay tumutukoy sa pagdarahop o pagkasalat. Pinananatili ng salin ang layunin nang hindi labis na pinatitindi ang antas ng kahirapan.
- source_word: בֵיתְךָ
  choice: iyong sambahayan
  rationale: Mas malawak ito kaysa sa gusaling “bahay” at tumutukoy sa mga taong kabilang sa tahanan ni Jacob.
- source_word: כָל־אֲשֶׁר־לָךְ
  choice: lahat ng pag-aari mo
  rationale: Natural na Tagalog para sa lahat ng nasa pag-aari o pagmamay-ari niya sa konteksto.
theological_decisions:
- issue: Lakas ng kahulugang פן תורשׁ
  choice: upang hindi ka maghirap
  alternative: baka lubusan kang maghirap / baka maging dukha ka
  rationale: Hindi tinutukoy ng teksto ang isang natatanging doktrinal na kalagayan; ang katamtamang salin ay nagpapanatili sa diwa ng pagdarahop nang hindi nagdaragdag ng “lubusan,” na hindi tahasang nasa Hebreo.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Ginamit ang “sambahayan” upang saklawin ang buong household, at em dash upang malinaw na ang sumusunod na mga parirala ay nagpapalawak sa “ka.”
