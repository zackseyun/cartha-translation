base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/023.yaml
  text: 'And to his father he sent this: ten donkeys carrying some of the best things of Egypt[a], and ten female donkeys carrying grain and bread and provisions for his father for the journey.'
translation:
  language: tl
  text: 'Ito ang ipinadala niya sa kanyang ama: sampung asno na may dalang ilan sa pinakamainam na bagay mula sa Ehipto[a], at sampung babaeng asno na may dalang butil, tinapay, at baon para sa paglalakbay ng kanyang ama.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa pinakamaiinam na bagay ng Ehipto” o “mula sa kasaganaan ng Ehipto.”
    reason: 'Pinananatili ang mga posibleng pagsasalin ng מִטּוּב מִצְרָיִם: mga bagay na pinakamainam mula sa Ehipto o ang kasaganaan/bounty nito.'
lexical_decisions:
- source_word: כְּזֹאת
  choice: ang mga ito
  rationale: Ipinakikilala ng parirala ang kasunod na talaan ng mga ipinadala; natural sa Filipino ang “ipinadala niya ang mga ito.”
- source_word: חֲמֹרִים
  choice: mga asno
  rationale: Karaniwan at malinaw na modernong katawagan para sa mga donkey.
- source_word: נֹשְׂאִים
  choice: may dalang
  rationale: Likas na Filipino para sa participleng naglalarawan sa mga hayop na nagdadala ng kargamento, nang hindi ipinapalagay na eksaktong “ikinarga” ang paraan.
- source_word: מִטּוּב מִצְרָיִם
  choice: ilan sa pinakamainam na bagay mula sa Ehipto
  rationale: Pinananatili ang partitive na diwa ng מִן sa “ilan sa” at ang malawak na kahulugan ng טוּב nang hindi nililimitahan sa ani o isang tiyak na produkto.
- source_word: אֲתֹנֹת
  choice: mga babaeng asno
  rationale: Pinananatili ang tahasang pagtukoy ng Hebreo sa kasarian ng ikalawang pangkat ng mga asno.
- source_word: בָּר
  choice: butil
  rationale: Pangkalahatang tumutukoy sa grain at hindi nagpapalagay na trigo lamang ito.
- source_word: לֶחֶם
  choice: tinapay
  rationale: Pinananatili ang karaniwang tiyak na kahulugan sa halip na gawing pangkalahatang “pagkain.”
- source_word: מָזוֹן
  choice: baon
  rationale: Sa konteksto ng paglalakbay, natural na tumutukoy sa pagkaing nakalaan para sa biyahe at naihihiwalay sa binanggit nang butil at tinapay.
- source_word: לַדָּרֶךְ
  choice: para sa paglalakbay
  rationale: Natural at malinaw na Filipino para sa mga panustos na gagamitin habang naglalakbay.
