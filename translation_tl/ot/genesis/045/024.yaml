base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/024.yaml
  text: Then he sent his brothers away[a], and they departed; and he said to them, “Do not quarrel on the way.”
translation:
  language: tl
  text: Pagkatapos, pinayaon niya ang kanyang mga kapatid, at umalis sila. Sinabi niya sa kanila, “Huwag kayong mag-away[a] habang naglalakbay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Huwag kayong mabalisa,” “Huwag kayong magalit,” o “Huwag kayong matakot habang naglalakbay.” Maaaring tumukoy ang pandiwang Hebreo sa iba’t ibang uri ng matinding pagkagambala ng damdamin. Ang “mag-away” ay angkop sa agarang konteksto ng magkakapatid na magkakasamang naglalakbay matapos magpakilala si Jose.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: pinayaon niya
  rationale: Ang piel ng שׁלח ay tumutukoy sa pagpapalakad o pagpapaalis sa kanila mula sa kanyang harapan. Likas sa salaysay ang “pinayaon” at hindi nito ipinahihiwatig na itinaboy sila.
- source_word: אֶת־אֶחָיו
  choice: ang kanyang mga kapatid
  rationale: Tuwirang pinananatili ang katawagang pampamilya at ang pangmaramihang anyo sa konteksto ng mga lalaking kapatid ni Jose.
- source_word: וַיֵּלֵכוּ
  choice: at umalis sila
  rationale: Bagaman malawak ang kahulugan ng הלך bilang “pumunta” o “lumakad,” ang “umalis” ang natural na kasunod ng pagpapayaon sa kanila.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Sinabi niya sa kanila
  rationale: Natural at malinaw na salin ng karaniwang pormula sa pagpapakilala ng tuwirang pananalita.
- source_word: אַל
  choice: Huwag
  rationale: Karaniwang katumbas sa Filipino ng Hebreong pantanggi na ginagamit sa isang pagbabawal.
- source_word: תִּרְגְּזוּ
  choice: mag-away
  rationale: Maaaring tumukoy ang רגז sa pagkabalisa, pagkagalit, pagkatakot, o iba pang matinding pagkagambala ng damdamin. Sa konteksto ng magkakasamang paglalakbay ng magkakapatid matapos magpakilala si Jose, natural ang babala laban sa pag-aaway o sisihan; pinananatili sa talababa ang mas malawak na saklaw ng salita.
- source_word: בַּדָּרֶךְ
  choice: habang naglalakbay
  rationale: Tumutukoy ang דרך sa kanilang paglalakbay pabalik. Mas natural sa modernong Filipino ang “habang naglalakbay” kaysa sa literal na “sa daan,” habang pinananatili ang diwa ng panahon at kalagayan ng paglalakbay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “pinayaon” upang maipahayag ang pagpapalakad sa mga kapatid nang hindi nagmumukhang marahas na pagpapaalis, at ang “habang naglalakbay” bilang likas na katumbas ng idyomang tumutukoy sa kanilang paglalakbay.
