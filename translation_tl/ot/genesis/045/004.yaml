translation:
  language: tl
  text: Pagkatapos ay sinabi ni Jose sa kanyang mga kapatid, “Lumapit kayo sa akin, pakiusap.” Lumapit sila. Sinabi niya, “Ako si Jose, ang kapatid ninyo na ipinagbili ninyo sa Ehipto.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Tagalog ang “Pagkatapos, sinabi” habang pinananatili ang pagkakasunod-sunod.
- source_word: אֶל־אֶחָיו
  choice: sa kanyang mga kapatid
  rationale: Tuwirang ipinahahayag ng pangmaramihang אָח na may hulaping 3ms ang “kanyang mga kapatid.”
- source_word: גְּשׁוּ נָא אֵלַי
  choice: Lumapit nga kayo sa akin
  rationale: Ang גְּשׁוּ ay utos na lumapit, at ang נָא ay nagpapalumanay sa pakiusap. Ang “nga” ay magalang at natural sa kontekstong ito nang hindi nagdaragdag ng paghahambing gaya ng “mas lumapit.”
- source_word: וַיִּגָּשׁוּ
  choice: At lumapit sila
  rationale: Inuulit ang pandiwang “lumapit” upang mapanatili ang leksikal na pag-uulit sa Hebreo at ang agarang pagtugon ng mga kapatid.
- source_word: אֲנִי יוֹסֵף
  choice: Ako si Jose
  rationale: Natural na anyo ito ng nominal na pangungusap sa Tagalog; “Jose” ang nakaugaliang pangalang biblikal sa Filipino.
- source_word: אֲחִיכֶם
  choice: ang kapatid ninyo
  rationale: Pinananatili ang isahang “kapatid” at ang pangmaramihang kinakausap na nasa hulaping 2mp.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתִי
  choice: na ipinagbili ninyo
  rationale: Tuwiran nitong pinananatili ang paratang sa kamag-anak na sugnay at malinaw na ang nagsasalita ang bagay ng kanilang pagbebenta.
- source_word: מִצְרָיְמָה
  choice: papuntang Ehipto
  rationale: Ipinahahayag ng “papuntang” ang direksiyonal na hulaping -ה, na tumutukoy sa pagkilos tungo sa Ehipto.
