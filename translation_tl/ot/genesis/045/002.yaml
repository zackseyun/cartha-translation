  text: And he wept aloud[a], and the Egyptians heard[c][b], and Pharaoh’s household heard.
translation:
  language: tl
  text: At humagulgol siya nang malakas[a]. Narinig ito ng mga Ehipsiyo[b], at narinig din ito ng sambahayan ng Faraon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “ibinigay niya ang kanyang tinig sa pag-iyak,” isang idyomang Hebreo na nangangahulugang umiyak siya nang malakas.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “Ehipto,” bilang kolektibong pagtukoy sa lupain o mga mamamayan nito; ang pandiwang maramihan ay sumusuporta sa “mga Ehipsiyo.”
    reason: lexical_alternative
  - marker: c
    text: 'Literal: “sambahayan ng Faraon.” Maaari rin itong isalin na “bahay ng Faraon” at maaaring tumukoy sa maharlikang korte ng Faraon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי
  choice: humagulgol siya nang malakas
  rationale: Ang literal na idyomang “ibinigay niya ang kanyang tinig sa pag-iyak” ay tumutukoy sa malakas at dinig na pag-iyak. Likas sa modernong Tagalog ang “humagulgol nang malakas” at malinaw nitong naihahatid ang tindi at tunog ng pag-iyak.
- source_word: וַיִּשְׁמְעוּ
  choice: narinig iyon
  rationale: Ang שׁמע rito ay simpleng pagkarinig sa tunog, hindi pakikinig o pagsunod. Ang “iyon” ay likas na tumutukoy sa malakas na paghagulgol.
- source_word: מִצְרַיִם
  choice: mga Ehipsiyo
  rationale: Bagaman maaari itong mangahulugang “Ehipto,” ang kasamang pandiwang maramihan ay sumusuporta sa kolektibong personal na kahulugang mga Ehipsiyo.
- source_word: וַיִּשְׁמַע
  choice: nabalitaan
  rationale: Literal itong “narinig,” ngunit sa sambahayan ng Faraon ay maaaring tumukoy sa pagdating doon ng balita tungkol sa nangyari. Pinipigilan din ng “nabalitaan” ang di-likas na impresyong personal na narinig ng buong sambahayan ang mismong tunog, habang pinananatili sa talababa ang literal na anyo.
- source_word: בֵּית פַּרְעֹה
  choice: sambahayan ng Faraon
  rationale: Ang בֵּית ay maaaring tumukoy sa mga tao ng sambahayan o maharlikang korte, hindi lamang sa gusali. Ang “sambahayan ng Faraon” ay malapit sa Hebreo at natural sa Tagalog.
