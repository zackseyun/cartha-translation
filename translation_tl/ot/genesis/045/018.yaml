  to: Isama ninyo ang inyong ama at ang inyong mga sambahayan, at pumunta kayo sa akin. Ibibigay ko sa inyo ang pinakamainam sa lupain ng Ehipto, at kakain kayo ng pinakamasaganang bunga ng lupain.[a]
