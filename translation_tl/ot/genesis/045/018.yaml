  - severity: low
    issue: Konstruksiyon ng pandiwang kumain
    rationale: Mas idiomatiko sa Filipino ang “kakain kayo ng pinakamasaganang bunga” kaysa “kakainin ninyo ang pinakamasaganang bunga.” Hindi nagbabago ang kahulugan.
