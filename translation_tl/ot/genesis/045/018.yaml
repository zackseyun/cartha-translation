base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/018.yaml
  text: Take your father and your households[a], and come to me, and I will give you the best of the land of Egypt, and you shall eat the fat of the land.
translation:
  language: tl
  text: Isama ninyo ang inyong ama at ang inyong mga sambahayan, at pumunta kayo sa akin. Ibibigay ko sa inyo ang pinakamainam sa lupain ng Ehipto, at kakain kayo ng pinakamasaganang bunga ng lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang taba ng lupain,” isang idyomang tumutukoy sa pinakamainam at pinakamasaganang ani o yaman ng lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ
  choice: Isama ninyo
  rationale: Bagaman ang pangunahing diwa ng לקח ay “kunin,” ipinag-uutos dito na isama ng mga kapatid ni Jose ang kanilang ama sa pagpunta sa Ehipto. Mas likas at malinaw sa Filipino ang “isama” kaysa “kunin” sa kontekstong ito.
- source_word: אֲבִיכֶם
  choice: ang inyong ama
  rationale: Tuwirang katumbas ng pangngalang nasa isahan na may hulaping pangmaramihang “inyong”; tumutukoy ito kay Jacob.
- source_word: בָּתֵּיכֶם
  choice: ang inyong mga sambahayan
  rationale: Ang בַּיִת ay literal na “bahay,” ngunit dito ay tumutukoy sa mga kasambahay at umaasa sa bawat pamilya. Pinananatili ng “mga sambahayan” ang panlipunang yunit nang hindi nililimitahan sa gusali.
- source_word: וּבֹאוּ אֵלָי
  choice: at pumarito kayo sa akin
  rationale: Pinananatili ang direksiyong nakatuon sa nagsasalita na ipinahihiwatig ng בוא at אֵלַי. Hindi idinagdag ang diwang “bumalik,” na hindi tahasang nasa Hebreo.
- source_word: וְאֶתְּנָה לָכֶם
  choice: Ibibigay ko sa inyo
  rationale: Ang anyong cohortative kasunod ng mga utos ay nagpapahayag dito ng pangako o katiyakan; natural itong isinasalin bilang panghinaharap sa Filipino.
- source_word: טוּב אֶרֶץ מִצְרַיִם
  choice: ang pinakamainam sa lupain ng Ehipto
  rationale: Ang טוּב ay maaaring tumukoy sa kabutihan, kasaganaan, o pinakamainam na bahagi. Ang “pinakamainam” ay malinaw na naghahayag ng pribilehiyong ipinapangako sa kanila.
- source_word: וְאִכְלוּ
  choice: at kakainin ninyo
  rationale: Bagaman anyong pautos ang pandiwa, kaugnay ng naunang pangako ay likas itong gumaganap bilang resulta o katiyakang panghinaharap.
- source_word: חֵלֶב הָאָרֶץ
  choice: ang pinakamasaganang bunga ng lupain
  rationale: Literal na “taba ng lupain,” ngunit idyomatiko itong tumutukoy sa pinakamainam at pinakamasaganang ani o yaman nito. Pinananatili ng salin ang kaugnayan sa pandiwang “kakainin” habang ipinapaliwanag sa talababa ang larawang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” upang tukuyin ang buong yunit ng pamilya at mga umaasa rito. Iniwasan sa pangunahing teksto ang di-likas na literal na “taba ng lupain,” ngunit pinanatili ang larawang Hebreo sa talababa.
