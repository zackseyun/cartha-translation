  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִגַּדְתֶּ֣ם לְ/אָבִ֗/י אֶת כָּל כְּבוֹדִ/י֙ בְּ/מִצְרַ֔יִם וְ/אֵ֖ת כָּל אֲשֶׁ֣ר רְאִיתֶ֑ם וּ/מִֽהַרְתֶּ֛ם וְ/הוֹרַדְתֶּ֥ם אֶת אָבִ֖/י הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/013.yaml
  text: And tell my father about all my honor in Egypt and everything you have seen[b][a]. Hurry and bring my father down here.
translation:
  language: tl
  text: Sabihin ninyo sa aking ama ang lahat ng karangalan ko[a] sa Egipto at ang lahat ng nakita ninyo. Magmadali kayo at dalhin ninyo rito[b] ang aking ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng kaluwalhatian ko.” Ang salitang Hebreo ay maaaring mangahulugang karangalan, kaluwalhatian, o kadakilaan; dito, tumutukoy ito sa mataas na katayuan ni Jose sa Egipto.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na Hebreo, “ibaba ninyo rito.” Karaniwang inilalarawan sa Genesis ang pagpunta sa Egipto bilang pagbaba.
    reason: directional_nuance
lexical_decisions:
- source_word: וְהִגַּדְתֶּם
  choice: Sabihin ninyo
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam o sabihin. Likas at malinaw ang “sabihin ninyo” sa tuwirang utos ni Jose sa kanyang mga kapatid.
- source_word: כָּל כְּבוֹדִי
  choice: ang lahat ng karangalan ko
  rationale: Maaaring tumukoy ang כָּבוֹד sa karangalan, kaluwalhatian, o kadakilaan. Sa konteksto, tinutukoy nito ang mataas at marangal na katayuan ni Jose sa Egipto; pinananatili ng “karangalan” ang pangunahing diwa nang hindi nagdaragdag ng di-kinakailangang relihiyosong pahiwatig.
- source_word: בְּמִצְרַיִם
  choice: sa Egipto
  rationale: Tuwirang lokatibong parirala na tumutukoy sa lugar ng karangalan at katayuan ni Jose.
- source_word: כָּל אֲשֶׁר רְאִיתֶם
  choice: ang lahat ng nakita ninyo
  rationale: Tumutukoy ito sa kabuuan ng nasaksihan ng mga kapatid at pinananatili ang pag-uulit ng כָּל sa Hebreo.
- source_word: וּמִהַרְתֶּם
  choice: Magmadali kayo
  rationale: Ipinahahayag ng pandiwa ang agarang pagkilos at may puwersang pautos sa konteksto.
- source_word: וְהוֹרַדְתֶּם
  choice: dalhin ninyo rito
  rationale: Literal na ‘pababaing dalhin’ ang Hiphil ng ירד. Mas natural sa modernong Tagalog ang “dalhin ninyo rito,” habang inilalahad sa talababa ang direksiyong ‘pababa’ na nasa Hebreo.
- source_word: הֵנָּה
  choice: rito
  rationale: Tumutukoy ito sa patutunguhan na kinaroroonan ng nagsasalita; ang “rito” ay likas na anyo sa Tagalog.
theological_decisions:
- issue: Posibleng relihiyosong himig ng כָּבוֹד
  choice: karangalan
  alternative: kaluwalhatian
  rationale: Sa talatang ito, ang salita ay tumutukoy sa mataas na katayuan ni Jose sa pamahalaan ng Egipto, hindi sa banal na kaluwalhatian. Gayunman, lehitimong leksikal na kahulugan ang “kaluwalhatian,” kaya binabanggit ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang magalang na maramihang pautos na “ninyo/kayo.” Iniwasan ang lubhang literal ngunit alanganing “ibaba ninyo rito” sa pangunahing teksto, at pinanatili ang direksiyong Hebreo sa talababa.
