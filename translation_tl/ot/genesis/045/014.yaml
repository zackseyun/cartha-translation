  register: Modernong Filipino Tagalog na natural at marangal. Tahasang binanggit si Jose upang maiwasan ang kalituhan ng sunod-sunod na panghalip sa isang hiwalay na talata. Isinalin nang idyomatiko ang kilos ng pagyakap, habang inilagay sa talababa ang literal na anyong Hebreo.
