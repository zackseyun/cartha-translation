  text: Then he fell on the neck of Benjamin his brother and wept[a], and Benjamin wept on his neck.
translation:
  language: tl
  text: Pagkatapos, niyakap ni Jose sa leeg ang kapatid niyang si Benjamin at umiyak[a]; at umiyak si Benjamin sa leeg niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “bumagsak sa mga leeg ng kapatid niyang si Benjamin … at umiyak si Benjamin sa leeg niya.” Ang anyong maramihan na “mga leeg” ay isang idyomang Hebreo para sa pagyakap sa leeg.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל עַל
  choice: niyakap ... sa leeg
  rationale: Literal na ‘bumagsak sa’ ang pandiwa at pang-ukol, ngunit sa kontekstong ito ay idyoma ito ng mahigpit na pagyakap sa leeg. Ang ‘niyakap ... sa leeg’ ay natural sa modernong Tagalog at malinaw na naghahatid ng kilos.
- source_word: צַוְּארֵי / צַוָּארָיו
  choice: sa leeg / habang magkayakap sila
  rationale: Ang unang anyo ay morpolohikal na maramihan ngunit idyomatikong tumutukoy sa leeg sa isang yakap. Sa ikalawang sugnay, ang natural na Tagalog na ‘habang magkayakap sila’ ay naghahatid na umiyak si Benjamin sa leeg ni Jose nang hindi lumilikha ng alanganing literalismo.
- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa mga saling Tagalog.
- source_word: אָחִיו
  choice: ang kapatid niyang
  rationale: Pinanatili ang tahasang ugnayang pampamilya at ang appositional na pagkakakilanlan ni Benjamin bilang kapatid ni Jose.
- source_word: וַיֵּבְךְּ / בָּכָה
  choice: umiyak
  rationale: Ang בכה ay nangangahulugang umiyak o tumangis. Ang ‘umiyak’ ay likas, marangal, at angkop sa emosyonal na tagpo; pareho ang salin sa dalawang paglitaw.
- source_word: וּבִנְיָמִן
  choice: umiyak din si Benjamin
  rationale: Ipinapahayag ng ‘din’ sa natural na Tagalog na si Benjamin ay kapwa umiyak, gaya ng ipinahihiwatig ng pinag-ugnay na ikalawang sugnay.
