  yaml_path: translation/ot/genesis/045/012.yaml
  text: And look[a], your eyes see—and the eyes of my brother Benjamin—that it is my mouth that is speaking to you.
translation:
  language: tl
  text: 'At tingnan ninyo: nakikita ng inyong mga mata—at ng mga mata ng kapatid kong si Benjamin—na ang bibig ko mismo ang nagsasalita sa inyo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At tingnan ninyo
  rationale: Tinatawag nito nang mariin ang pansin ng mga kausap. Likas at malinaw sa makabagong Tagalog ang “tingnan ninyo,” samantalang nasa talababa ang mas pormal na “narito.”
- source_word: עֵינֵיכֶם רֹאוֹת
  choice: nakikita ng inyong mga mata
  rationale: Pinananatili ang tahasang pagbanggit sa “mga mata” upang maipahayag ang diin ng Hebreo sa personal at tuwirang pagkakita.
- source_word: וְעֵינֵי אָחִי בִנְיָמִין
  choice: pati ng mga mata ng kapatid kong si Benjamin
  rationale: Pinananatili ang pagkakapantay ng parirala sa “inyong mga mata,” habang natural na ipinakikilala si Benjamin bilang kapatid ni Jose.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng pinatutunayan ng kanilang nakikita.
- source_word: פִי
  choice: ang bibig ko mismo
  rationale: Pinananatili ang kongkretong “bibig” at ang diin na si Jose mismo, hindi isang tagapagsalin o tagapamagitan, ang nagsasalita sa kanila.
- source_word: הַמְדַבֵּר אֲלֵיכֶם
  choice: ang nagsasalita sa inyo
  rationale: Natural nitong ipinahahayag sa Tagalog ang substantibong participle at ang kasalukuyang, tuwirang pagkilos.
