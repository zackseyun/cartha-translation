base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
translation:
  language: tl
  text: At ngayon, huwag kayong malungkot at huwag magalit sa inyong mga sarili dahil ipinagbili ninyo ako rito, sapagkat isinugo ako ng Diyos na mauna sa inyo upang mapanatili ang buhay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang magligtas ng buhay” o “para sa pagpapanatili ng buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na ו at ang panandang pamanahon na עַתָּה bilang paglipat sa kasalukuyang pakiusap ni Jose.
- source_word: אַל תֵּעָצְבוּ
  choice: huwag kayong malungkot
  rationale: Ang עצב ay tumutukoy sa sakit ng damdamin o dalamhati; natural at malinaw sa makabagong Tagalog ang “malungkot.”
- source_word: וְאַל יִחַר בְּעֵינֵיכֶם
  choice: o magalit sa inyong sarili
  rationale: Idyoma itong literal na may diwang “magningas sa inyong mga mata.” Sa konteksto, tinutukoy nito ang galit o matinding sama ng loob ng magkakapatid laban sa kanilang sarili.
- source_word: כִּי מְכַרְתֶּם אֹתִי הֵנָּה
  choice: dahil ipinagbili ninyo ako rito
  rationale: Causal ang כִּי, at ang הֵנָּה ay deiktikong “rito.” Tahasang pinananatili ang ginawa ng mga kapatid.
- source_word: לְמִחְיָה
  choice: upang magpanatili ng buhay
  rationale: Ang מִחְיָה ay pag-iingat o pagpapanatili ng buhay; ipinahahayag ng parirala ang layunin nang hindi nililimitahan kung kaninong buhay ang tinutukoy.
- source_word: שְׁלָחַנִי אֱלֹהִים
  choice: isinugo ako ng Diyos
  rationale: Tuwirang pinananatili ang aktibong pagkilos ng Diyos na ipinahahayag ng Hebreo.
- source_word: לִפְנֵיכֶם
  choice: na mauna sa inyo
  rationale: Natural na ipinahahayag sa Tagalog ang temporal at posisyonal na diwa ng “ahead of you.”
theological_decisions:
- issue: Pagkalinga ng Diyos at pananagutan ng tao
  choice: Pinanatili kapwa ang “ipinagbili ninyo ako” at “isinugo ako ng Diyos.”
  alternative: Palambutin ang ginawa ng magkakapatid o ilarawan ang pagkilos ng Diyos bilang pahintulot lamang.
  rationale: Magkatabing ipinahahayag ng Hebreo ang tunay na pagkilos ng magkakapatid at ang layunin at pagkilos ng Diyos; hindi nilulutas o pinapawi ng salin ang tensiyong ito.
translation_notes:
  register: Makabago, dignidadong Tagalog para sa karaniwang mambabasa. Ginamit ang “ipinagbili,” “isinugo,” at “magpanatili” upang manatiling angkop sa salaysay ng Kasulatan nang hindi nagiging lipas o labis na pormal.
