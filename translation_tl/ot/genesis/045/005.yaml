revisions:
- from: At ngayon, huwag kayong malungkot o magalit sa inyong sarili dahil ipinagbili ninyo ako rito, sapagkat isinugo ako ng Diyos na mauna sa inyo upang magpanatili ng buhay.[a]
  to: At ngayon, huwag kayong malungkot at huwag magalit sa inyong mga sarili dahil ipinagbili ninyo ako rito, sapagkat isinugo ako ng Diyos na mauna sa inyo upang mapanatili ang buhay.[a]
  rationale: Inayos ang dalawang bahaging hindi likas sa Tagalog habang pinananatili ang sanhi (“dahil ipinagbili ninyo ako rito”), ang hindi pag-aalis sa pananagutan ng mga kapatid, at ang aktibong pagkilos ng Diyos. Ang binagong pariralang panglayunin ay nananatiling malawak, gaya ng Hebreong לְמִחְיָה, at hindi tinutukoy kung aling mga buhay ang pinananatili.
  reviewer_model: gpt-5.6-terra
