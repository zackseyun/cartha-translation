base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/025.yaml
  text: So they went up from Egypt and came to the land of Canaan, to Jacob their father.
translation:
  language: tl
  text: Kaya umahon sila mula sa Egipto at dumating sa lupain ng Canaan, sa kanilang amang si Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: umahon
  rationale: Ang עלה ay literal na ‘umakyat/umahon.’ Sa paglalakbay mula sa Egipto patungong Canaan, pinananatili ng ‘umahon’ ang heograpikong direksiyon ng Hebreong pananalita.
- source_word: מִמִּצְרָיִם
  choice: mula sa Egipto
  rationale: Ang מִן ay nagsasaad ng pinagmulan; ‘Egipto’ ang karaniwang anyo ng pangalan sa Filipino.
- source_word: וַיָּבֹאוּ
  choice: patungo
  rationale: Ang בוא ay karaniwang ‘dumating/pumasok.’ Dito, ang likas na pariralang ‘umahon patungo sa’ ay naghahatid ng sunod-sunod na pagkilos at destinasyon nang hindi ipinapalagay kung pumasok sila sa isang tiyak na hangganan.
- source_word: אֶרֶץ כְּנַעַן
  choice: lupain ng Canaan
  rationale: Pinananatili ang tahasang אֶרֶץ, ‘lupain,’ at ang pangalang Canaan.
- source_word: אֶל יַעֲקֹב
  choice: kay Jacob
  rationale: Ang אֶל ay nagpapahayag ng direksiyon tungo sa isang tao; ‘kay’ ang natural na katumbas sa Filipino.
- source_word: אֲבִיהֶם
  choice: kanilang ama
  rationale: Tuwirang tumutukoy ito sa ama nila; si Jacob ang agarang ama ng magkakapatid sa konteksto.
