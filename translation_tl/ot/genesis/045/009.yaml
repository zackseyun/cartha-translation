base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/009.yaml
  text: 'Hurry and go up to my father[a], and say to him, ‘Thus says your son Joseph: God has made me lord over all Egypt. Come down to me; do not delay.’'
translation:
  language: tl
  text: 'Magmadali kayo at umakyat kayo sa aking ama, at sabihin ninyo sa kanya, ‘Ganito ang sabi ng anak mong si Jose: Ginawa ako ng Diyos na panginoon ng buong Ehipto. Bumaba ka rito sa akin; huwag kang magtagal.[a]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huwag kang magpaliban”; mas literal, “huwag kang tumigil” o “huwag kang manatili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֲרוּ
  choice: Magmadali kayo
  rationale: Maramihang pautos na malinaw na naghahatid ng dagliang pagkilos sa natural na modernong Tagalog.
- source_word: וַעֲלוּ
  choice: pumunta
  rationale: Bagaman literal na ‘umakyat,’ ang likas na direksiyon sa Tagalog ay ‘pumunta.’ Hindi kailangang ipilit ang heograpikong idyoma kung magiging asiwa; nananatili ang utos na maglakbay patungo sa ama.
- source_word: אֶל אָבִי
  choice: sa aking ama
  rationale: Tuwirang katumbas ng pariralang nagsasaad ng patutunguhan.
- source_word: וַאֲמַרְתֶּם אֵלָיו
  choice: at sabihin ninyo sa kanya
  rationale: Pinananatili ang maramihang tagubilin at ang sunod na pagkilos.
- source_word: כֹּה אָמַר
  choice: Ganito ang sabi
  rationale: Natural at marangal na katumbas ng pormula ng mensahero, nang hindi nagiging makaluma.
- source_word: בִּנְךָ יוֹסֵף
  choice: ng anak mong si Jose
  rationale: Likas sa Tagalog at pinananatili ang diin sa kaugnayang ama-anak.
- source_word: שָׂמַנִי אֱלֹהִים
  choice: Ginawa ako ng Diyos
  rationale: Ang שׂים ay tumutukoy sa paglalagay o pagtatalaga sa isang katungkulan; malinaw itong ipinahahayag ng ‘ginawa ako’ kasunod ng titulong panginoon.
- source_word: לְאָדוֹן לְכָל מִצְרָיִם
  choice: na panginoon sa buong Ehipto
  rationale: Ang ‘panginoon’ ay nagpapanatili sa katayuang may awtoridad nang hindi labis na tinutukoy ang eksaktong pampolitikang tungkulin; ang ‘sa buong Ehipto’ ay natural na saklaw ng pamamahala.
- source_word: רְדָה אֵלַי
  choice: Bumaba ka rito sa akin
  rationale: Pinananatili ang literal at heograpikong pagbaba patungong Ehipto, habang ang ‘rito sa akin’ ay angkop dahil si Jose ang nagsasalita at siyang patutunguhan.
- source_word: אַל תַּעֲמֹד
  choice: huwag kang magtagal
  rationale: Sa konteksto, ang literal na ‘huwag tumayo/manatili’ ay idyomatikong pagbabawal sa pag-aatubili o pagpapaliban; natural itong ipinahahayag ng ‘huwag kang magtagal.’
theological_decisions:
- issue: Pagpapakahulugan sa אֱלֹהִים sa pahayag ni Jose
  choice: Diyos
  alternative: isang diyos
  rationale: Isahan ang diwa ng sintaks at malinaw sa konteksto na iniuukol ni Jose ang kanyang katungkulan sa Diyos; hindi ito dagdag na doktrina kundi ang tuwirang kahulugan ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang ‘Jose’ at ‘Ehipto’ bilang karaniwang anyong Filipino. Pinanatili ang maramihang utos sa mga kapatid at ang isahang utos kay Jacob.
