  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתֵּ֨ן לָ/הֶ֥ם יוֹסֵ֛ף עֲגָל֖וֹת עַל פִּ֣י פַרְעֹ֑ה וַ/יִּתֵּ֥ן לָ/הֶ֛ם צֵדָ֖ה לַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/021.yaml
  text: And the sons of Israel did so[a], and Joseph gave them wagons according to Pharaoh’s command, and he gave them provisions for the journey.
translation:
  language: tl
  text: Gayon nga ang ginawa ng mga anak ni Israel. Binigyan sila ni Jose ng mga karwahe ayon sa utos ng Faraon[a], at binigyan din niya sila ng mga panustos para sa paglalakbay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ayon sa bibig ng Faraon,” isang idyomang nangangahulugang “ayon sa utos ng Faraon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Gayon nga ang ginawa
  rationale: Likas na salin ng idyomatikong pahayag na nagsasaad na ginawa nila ang iniutos o inilarawan sa naunang konteksto.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Tumutukoy rito sa mga lalaking anak ni Jacob/Israel; natural sa Tagalog ang “mga anak ni Israel” nang hindi kailangang idagdag ang kasarian na malinaw na sa konteksto.
- source_word: עֲגָלוֹת
  choice: mga karwahe
  rationale: Mga sasakyang may gulong para sa pagdadala ng mga tao at kagamitan; ang “karwahe” ay malinaw at angkop sa salaysay.
- source_word: עַל פִּי פַרְעֹה
  choice: ayon sa utos ng Faraon
  rationale: Ang literal na “ayon sa bibig ng Faraon” ay isang Hebreong idyoma para sa pagsunod sa kaniyang utos.
- source_word: צֵדָה
  choice: mga panustos
  rationale: Saklaw nito ang mga kailangang baunin sa paglalakbay, hindi lamang pagkain.
- source_word: לַדָּרֶךְ
  choice: para sa paglalakbay
  rationale: Malinaw na ipinapahayag ang layunin ng mga panustos at natural sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang pangalang Israel para kay Jacob at ginamit ang “Faraon” bilang karaniwang anyong biblikal sa Tagalog.
