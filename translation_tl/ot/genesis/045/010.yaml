base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/010.yaml
  text: You shall live in the land of Goshen, and you shall be near me—you and your sons and your grandsons, and your flocks and your herds and all that you have.
translation:
  language: tl
  text: Maninirahan ka sa lupain ng Goshen, at magiging malapit ka sa akin—ikaw, ang mga anak mong lalaki, ang mga apo mong lalaki, ang iyong mga kawan at mga baka, at ang lahat ng pag-aari mo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: Maninirahan ka
  rationale: Ang ישׁב ay tumutukoy rito sa paninirahan o permanenteng pagtira sa isang lugar. Natural sa modernong Tagalog ang “maninirahan” at napananatili nito ang diwa ng settled residence.
- source_word: בְאֶרֶץ גֹּשֶׁן
  choice: sa lupain ng Goshen
  rationale: Ang אֶרֶץ ay maaaring mangahulugang lupain, bansa, o rehiyon. Pinananatili ng “lupain ng Goshen” ang heograpikong pagtukoy at anyo ng pariralang Hebreo.
- source_word: וְהָיִיתָ קָרוֹב אֵלַי
  choice: at mapapalapit ka sa akin
  rationale: Ang היה kasama ng קָרוֹב ay nagpapahayag ng kalagayang magiging malapit. Ang “mapapalapit ka sa akin” ay natural at pinananatili ang ipinangakong pisikal na kalapitan kay Jose.
- source_word: אַתָּה
  choice: ikaw
  rationale: Ang hiwalay na panghalip ay nagbibigay-diin kay Jacob. Pinananatili ang diin sa pamamagitan ng gitling bago ang kasunod na listahan.
- source_word: וּבָנֶיךָ
  choice: ang mga anak mong lalaki
  rationale: Ang בָּנִים ay tahasang panlalaking maramihan sa kontekstong ito. Nililinaw ng “mga anak mong lalaki” ang kasariang nasa Hebreo at iniiwasang gawing pangkalahatan ang sanggunian.
- source_word: וּבְנֵי בָנֶיךָ
  choice: ang mga apo mong lalaki
  rationale: Literal itong “mga anak na lalaki ng iyong mga anak na lalaki.” Ang “mga apo mong lalaki” ang natural na katumbas sa Tagalog at pinananatili ang panlalaking sanggunian.
- source_word: וְצֹאנְךָ
  choice: ang iyong mga kawan
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Ang “mga kawan” ay maikli at karaniwang katumbas.
- source_word: וּבְקָרְךָ
  choice: bakahan
  rationale: Ang בָּקָר ay tumutukoy sa mga baka o malalaking alagang hayop. Ang “bakahan” ay natural na kolektibong katawagan at naihihiwalay sa “mga kawan.”
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: at ang lahat ng pag-aari mo
  rationale: Malawak ang saklaw ng parirala at tumutukoy sa lahat ng pag-aari ni Jacob. Malinaw at likas sa Tagalog ang napiling salin.
