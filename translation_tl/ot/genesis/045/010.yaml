revisions:
- from: Maninirahan ka sa lupain ng Goshen at mapapalapit ka sa akin—ikaw, ang mga anak mong lalaki, ang mga apo mong lalaki, ang iyong mga kawan at bakahan, at ang lahat ng pag-aari mo.
  to: Maninirahan ka sa lupain ng Goshen, at magiging malapit ka sa akin—ikaw, ang mga anak mong lalaki, ang mga apo mong lalaki, ang iyong mga kawan at mga baka, at ang lahat ng pag-aari mo.
  rationale: Pinalitan ang pandiwang may diwang proseso (“mapapalapit”) ng panghinaharap na kalagayan (“magiging malapit”) upang tumpak na maipahayag ang היה + קָרוֹב. Pinalitan ang “bakahan” ng “mga baka” upang malinaw na maisalin ang בָּקָר bilang mga hayop at hindi bilang lugar o pasilidad. Hindi binago ang saklaw, pagkakasunod ng listahan, o panlalaking pagtukoy ng Hebreo.
