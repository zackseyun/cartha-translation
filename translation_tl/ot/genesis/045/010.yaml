  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maninirahan” sa halip na mas arkaikong “mananahan,” at pinanatili ang panlalaking pagtukoy sa mga anak at apo ayon sa tekstong Hebreo.
