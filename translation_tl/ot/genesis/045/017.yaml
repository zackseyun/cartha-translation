base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/017.yaml
  text: 'Then Pharaoh said to Joseph[a], “Tell your brothers, ‘Do this: load your beasts and go[b]; return to the land of Canaan.’”'
translation:
  language: tl
  text: 'Pagkatapos, sinabi ng Faraon kay Jose, “Sabihin mo sa mga kapatid mo, ‘Gawin ninyo ito: kargahan ninyo ang inyong mga hayop at umalis kayo; pumunta kayo sa lupain ng Canaan.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos, sinabi” at malinaw ang pagkakasunod-sunod.
- source_word: פַּרְעֹה
  choice: Faraon
  rationale: Karaniwang anyong Tagalog ng titulong Ehipsiyo.
- source_word: אֱמֹר אֶל אַחֶיךָ
  choice: Sabihin mo sa mga kapatid mo
  rationale: Tuwirang inililipat ang utos na magsalita ni Jose sa kaniyang mga kapatid at natural ang pagkakabuo sa Tagalog.
- source_word: זֹאת עֲשׂוּ
  choice: Gawin ninyo ito
  rationale: Maikli, malinaw, at tapat na katumbas ng demonstratibo at pangmaramihang pautos.
- source_word: טַעֲנוּ
  choice: kargahan ninyo
  rationale: Ipinahihiwatig ng pandiwa ang pagkakarga sa mga hayop na gagamitin sa paglalakbay.
- source_word: בְּעִירְכֶם
  choice: ang inyong mga hayop
  rationale: Tumutukoy sa mga alagang hayop, at sa konteksto ay mga hayop na tagapagdala; ang “mga hayop” ay natural at hindi labis na nagpapakitid sa kahulugan.
- source_word: וּלְכוּ בֹאוּ
  choice: at umalis kayo; pumunta kayo
  rationale: Pinananatili ang dalawang magkasunod na pautos—pag-alis at pagpunta/pagdating—nang hindi ginagawang alanganin ang Tagalog.
- source_word: אַרְצָה כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili ang tahasang “lupain” at ang direksiyonal na diwa ng Hebreo.
