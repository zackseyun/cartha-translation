base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/016.yaml
  text: The report was heard in Pharaoh’s house[a], saying[b], “Joseph’s brothers have come,” and it was pleasing in the eyes of Pharaoh and in the eyes of his servants.
translation:
  language: tl
  text: 'Nakarating sa sambahayan ng Faraon ang balita: “Dumating na ang mga kapatid ni Jose.” Ikinatuwa ito ng Faraon at ng kanyang mga lingkod.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga opisyal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקֹּל נִשְׁמַע
  choice: Nakarating ... ang balita
  rationale: Ang literal na ‘narinig ang tinig/tunog’ ay idyomatikong tumutukoy rito sa pagkalat o pagkarating ng balita. Natural sa makabagong Tagalog ang ‘nakarating ang balita’ habang pinananatili ang diwa ng pasibong נִשְׁמַע.
- source_word: בֵּית פַּרְעֹה
  choice: sa sambahayan ng Faraon
  rationale: Ang בַּיִת ay maaaring tumukoy hindi lamang sa gusali kundi sa sambahayan o korte ng hari. Ang ‘sambahayan’ ay malapit sa anyo ng Hebreo at hindi labis na nagtatakda na ‘palasyo’ o ‘korte’ lamang ang ibig sabihin.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ipinakikilala ng לֵאמֹר ang nilalaman ng balita. Sa natural na Tagalog, sapat at malinaw ang tutuldok bago ang tuwirang sipi kaysa sa alanganing literal na ‘na nagsasabi.’
- source_word: בָּאוּ אֲחֵי יוֹסֵף
  choice: Dumating na ang mga kapatid ni Jose
  rationale: 'Ang ‘dumating na’ ay nagpapahayag ng natapos na pagdating na may kasalukuyang kabuluhan: naroroon na sila.'
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: Ikinatuwa ito ng
  rationale: Ang Hebreong idyoma na literal na ‘naging mabuti sa mga mata ng’ ay natural na ipinahahayag sa Tagalog bilang ‘ikinatuwa ng,’ nang hindi binabago ang positibong tugon.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Pinananatili ng ‘mga lingkod’ ang malawak na saklaw ng עֲבָדִים; sa kontekstong maharlika maaari silang mga opisyal o tauhan, ngunit hindi kailangang tukuyin nang mas makitid sa pangunahing teksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginawang natural ang mga Hebreong idyoma nang hindi dinaragdagan ang salaysay; pinanatili sa ‘sambahayan’ at ‘mga lingkod’ ang lawak ng kahulugan ng mga terminong pangmaharlika.
