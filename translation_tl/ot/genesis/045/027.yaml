  source_fidelity: 'Ang diwa ng Hebreo ay naipapahayag nang tapat: iniulat ng mga anak kay Yaakov ang lahat ng sinabi ni Yosef, nakita niya ang mga sasakyang ipinadala upang dalhin siya, at nanumbalik ang sigla ng kanyang רוחַ. Gayunman, ang “mga karwahe” ay mas madaling unawain bilang mga sasakyang pampasahero; ang עֲגָלוֹת sa kontekstong ito ay mga sasakyang panghakot/kariton. Mainam ding panatilihin ang kongkretong “mga salita” ng Hebreo.'
  naturalness: Natural at marangal ang pangkalahatang Tagalog. Ang magkakaugnay na sugnay na may “at” ay mas malapit sa daloy ng salaysay kaysa sa “Nang makita niya,” na maaaring magbigay ng temporal na ugnayang mas malinaw kaysa sa simpleng sunod-sunod na waw ng Hebreo.
  terminology: Ang “Yaakov” at “espiritu” ay angkop at alinsunod sa transliterasyon ng pangalan at sa pagpapanatili ng ambiguwidad ng רוחַ. Pinalitan ang “karwahe” ng “karitong panghakot” upang maipakita ang tungkulin ng עֲגָלוֹת nang hindi ito ginagawang modernong tiyak na uri ng sasakyan.
