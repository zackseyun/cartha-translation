  to: At sinabi nila sa kanya ang lahat ng mga salitang sinabi ni Yosef sa kanila, at nakita niya ang mga karitong panghakot[a] na ipinadala ni Yosef upang dalhin siya; at muling nabuhayan ang espiritu ni Yaakov na kanilang ama.[b]
  rationale: Ang rebisyon ay nagpapalinaw sa uri at gamit ng עֲגָלוֹת bilang mga sasakyang panghakot, ibinabalik ang “mga salita” bilang katapat ng דִּבְרֵי, at pinananatili ang payak na sunod-sunod na naratibong daloy. Hindi binibigyang-kahulugan nang doktrinal ang רוחַ; nananatili ang “espiritu,” habang ang idyomatikong pagbasa ay nasa talababa.
