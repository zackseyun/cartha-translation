base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/027.yaml
  text: And they told him all the words of Yosef that he had spoken to them[a], and he saw the wagons that Yosef had sent to carry him[b], and the spirit of their father Yaakov revived.
translation:
  language: tl
  text: At sinabi nila sa kanya ang lahat ng mga salitang sinabi ni Yosef sa kanila, at nakita niya ang mga karitong panghakot[a] na ipinadala ni Yosef upang dalhin siya; at muling nabuhayan ang espiritu ni Yaakov na kanilang ama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga karwahe.” Ang salitang Hebreo ay tumutukoy sa mga sasakyang ginagamit sa paghakot o paglalakbay.
    reason: lexical_alternative
  - marker: b
    text: O “muling sumigla ang kalooban ni Yaakov na kanilang ama.” Ang pananalita ay isang idyoma para sa panunumbalik ng sigla, lakas ng loob, o pag-asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו אֵת כָּל דִּבְרֵי יוֹסֵף
  choice: At sinabi nila sa kanya ang lahat ng sinabi ni Yosef
  rationale: Ang “sinabi” ay likas sa modernong Tagalog para sa pag-uulat ng mga kapatid, samantalang ang “lahat ng sinabi” ay tumpak na naghahatid sa diwa ng “lahat ng mga salita” nang hindi nagiging matigas ang pananalita.
- source_word: אֲשֶׁר דִּבֶּר אֲלֵהֶם
  choice: sa kanila
  rationale: Sa Tagalog, sapat na ang “sinabi ni Yosef sa kanila”; hindi kailangang ulitin ang pandiwang “nagsalita” upang mapanatili ang malinaw at natural na ugnayan.
- source_word: וַיַּרְא
  choice: Nang makita niya
  rationale: Ginagawang malinaw ang pagkakasunod ng mga pangyayari sa natural na salaysay sa Tagalog, nang hindi nagdaragdag ng sanhi na wala sa Hebreo.
- source_word: הָעֲגָלוֹת
  choice: mga karwahe
  rationale: Tumutukoy ang salita sa mga sasakyang ginagamit sa paghakot o paglalakbay. Ang “karwahe” ay malinaw at marangal na katumbas sa Tagalog; ang “mga kariton” ay lehitimong alternatibo.
- source_word: אֲשֶׁר שָׁלַח יוֹסֵף לָשֵׂאת אֹתוֹ
  choice: na ipinadala ni Yosef upang dalhin siya
  rationale: Pinananatili ng “dalhin” ang malawak at tuwirang kahulugan ng נשׂא sa konteksto, sa halip na gawing mas tiyak na “sunduin” o “isakay.”
- source_word: וַתְּחִי רוּחַ
  choice: muling nabuhayan ang espiritu
  rationale: Pinananatili nito kapwa ang salitang-buhay ng חיה at ang רוּחַ bilang “espiritu,” habang natural na ipinahihiwatig ang panunumbalik ng sigla o pag-asa.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: Yaakov na kanilang ama
  rationale: Isinasalin ang ugnayang pampamilya ngunit tinutumbasan sa baybay ang personal na pangalang Hebreo ayon sa patakaran ng proyekto.
theological_decisions:
- issue: Kahulugan ng רוּחַ sa idyomang וַתְּחִי רוּחַ
  choice: muling nabuhayan ang espiritu
  alternative: muling sumigla ang kalooban / nabuhayan siya ng loob
  rationale: Hindi tahasang nilulutas kung ang “espiritu” ay tumutukoy sa panloob na disposisyon, sigla, o espiritu ng tao. Pinananatili ng salin ang larawan at ambiguwidad ng Hebreo, at inilalagay sa talababa ang idyomatikong diwa.
- issue: Pagbaybay sa pangalang יַעֲקֹב
  choice: Yaakov
  alternative: Jacob / Hakob
  rationale: Ang personal na pangalan ay tinutumbasan sa baybay mula sa Hebreo sa halip na palitan ng tradisyonal na anyong nagmula sa ibang wika.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “karwahe” sa halip na mas kolokyal na “kariton,” at pinanatili ang “espiritu” upang huwag paliitin ang saklaw ng Hebreong רוּחַ. Inilipat ang mga pananda ng talababa sa mga salitang aktuwal na tinatalakay ng bawat tala.
