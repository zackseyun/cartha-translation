  text: To each of them he gave a change of clothes[b][a], but to Benjamin he gave three hundred pieces of silver and five changes of clothes.
translation:
  language: tl
  text: Binigyan niya ang bawat isa sa kanila ng isang set ng damit na pamalit, ngunit binigyan niya si Benjamin ng tatlong daang pirasong pilak[a] at limang set ng damit na pamalit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tatlong daang pilak”; hindi tinukoy ang yunit ng salapi, kaya “pirasong pilak” ang ginamit sa halip na mas tiyak na katawagang gaya ng “siklong pilak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכֻלָּם ... לָאִישׁ
  choice: ang bawat isa sa kanila
  rationale: Pinagsasama nito sa natural na Tagalog ang dalawang distributibong parirala, “sa kanilang lahat” at “sa bawat lalaki,” nang hindi nawawala ang diin na bawat isa ay tumanggap.
- source_word: נָתַן
  choice: binigyan niya / nagbigay siya
  rationale: Karaniwang salin ito sa konteksto ng pagbibigay ng mga kaloob; iniangkop ang anyo ng pandiwa sa natural na ayos ng bawat sugnay.
- source_word: חֲלִפוֹת שְׂמָלֹת
  choice: pamalit na damit
  rationale: Tumutukoy ang parirala sa mga damit na maipapalit o panibagong kasuotan. Ang “pamalit na damit” ay malinaw at likas sa modernong Tagalog; ginawang isahan sa unang sugnay dahil distributibo ang “bawat isa.”
- source_word: וּלְבִנְיָמִן
  choice: ngunit kay Benjamin
  rationale: Bagaman maaaring literal na “at kay Benjamin,” malinaw na ipinakikita ng konteksto ang paghahambing sa natatanging mas malaking kaloob kay Benjamin.
- source_word: שְׁלֹשׁ מֵאוֹת כֶּסֶף
  choice: tatlong daang pirasong pilak
  rationale: Literal na “tatlong daang pilak” ang Hebreo at walang tinukoy na yunit. Ang “pirasong pilak” ay nagpapahayag ng halagang salapi nang hindi ipinapalagay na siklo ang yunit.
- source_word: וְחָמֵשׁ חֲלִפֹת שְׂמָלֹת
  choice: at limang pamalit na damit
  rationale: Pinananatili ang parehong salin ng parirala tungkol sa kasuotan at tuwirang ipinahahayag ang bilang na lima.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “pamalit na damit” bilang natural na katumbas ng mga kasuotang panibago o maipapalit, at pinanatili sa talababa ang kawalan ng tiyak na yunit para sa pilak.
