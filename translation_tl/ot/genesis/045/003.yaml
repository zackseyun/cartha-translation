base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/003.yaml
  text: Then Joseph said to his brothers[a], “I am Joseph. Is my father still alive?” But his brothers could not answer him[b], because they were dismayed at his presence.
translation:
  language: tl
  text: Sinabi ni Jose sa kanyang mga kapatid, “Ako si Jose. Buhay pa ba ang aking ama?” Ngunit hindi makasagot sa kanya ang kanyang mga kapatid, sapagkat nasindak sila sa kanyang harapan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nabigla sila sa harap niya” o “naligalig sila nang makita siya.” Literal na “mula sa harap ng kanyang mukha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang payak na “Sinabi” nang hindi na kailangang isalin nang hiwalay ang pang-ugnay.
- source_word: אֶל אֶחָיו
  choice: sa kanyang mga kapatid
  rationale: Tumutukoy ito sa mga lalaking kapatid ni Jose; malinaw at natural ang “mga kapatid” sa konteksto.
- source_word: אֲנִי יוֹסֵף
  choice: Ako si Jose
  rationale: Tuwirang pagpapakilala ito sa sarili. Ginamit ang nakaugaliang anyong Tagalog ng pangalang Joseph.
- source_word: הַעוֹד אָבִי חָי
  choice: Buhay pa ba ang aking ama?
  rationale: Ang הַעוֹד ay nagtatanong kung nagpapatuloy pa ang kalagayan; natural na ipinahahayag ito ng “pa ba” sa Tagalog.
- source_word: וְלֹא יָכְלוּ ... לַעֲנוֹת אֹתוֹ
  choice: Ngunit hindi siya masagot
  rationale: Pinananatili ng “hindi ... masagot” ang kawalan nila ng kakayahang tumugon sa sandaling iyon, at ipinahahayag ng “Ngunit” ang malinaw na pagliko mula sa tanong ni Jose.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit hindi sila makasagot; ang “sapagkat” ay malinaw at marangal ang rehistro.
- source_word: נִבְהֲלוּ
  choice: nasindak
  rationale: Ang Niphal ng בהל ay nagpapahiwatig ng bigla at matinding pagkagulat o pagkasindak. Ang “nasindak” ay akma sa tindi ng tagpo nang makilala nila si Jose, ngunit hindi nito inaalis ang saklaw na “nabigla” o “naligalig.”
- source_word: מִפָּנָיו
  choice: sa kanyang harapan
  rationale: Malapit ito sa Hebreong idyomang literal na “mula sa harap/mukha niya” at natural na tumutukoy sa epekto ng pagharap nila kay Jose.
