base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/001.yaml
  text: Then Joseph could no longer restrain himself before all those standing by him[a], and he cried out[c][b], “Have everyone go out from me!” And no one remained with him when Joseph made himself known to his brothers.
translation:
  language: tl
  text: Hindi na mapigilan ni Jose ang sarili niya sa harap ng lahat ng naroon sa tabi niya,[a] kaya sumigaw siya, “Paaliisin ninyo ang lahat mula sa harap ko!” Walang sinumang nanatili sa piling niya nang magpakilala si Jose sa kanyang mga kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa harap ng lahat ng nakatayo sa tabi niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכֹל ... לְהִתְאַפֵּק
  choice: napigilan ... ang kanyang sarili
  rationale: Ipinahahayag ng לֹא kasama ng יָכֹל ang kawalan ng kakayahan, at ang hitpael na לְהִתְאַפֵּק ay tumutukoy sa pagpipigil sa sarili. Likas sa modernong Tagalog ang kabuuang pariralang “Hindi na napigilan ... ang kanyang sarili.”
- source_word: לְכֹל הַנִּצָּבִים עָלָיו
  choice: sa harap ng lahat ng naroon sa tabi niya
  rationale: Pinananatili ng “sa harap ng” ang diwa ng pagkakaroon nila sa kanyang presensiya, samantalang ang “naroon sa tabi niya” ay natural na katumbas ng participle na tumutukoy sa mga nakatayo o nakahimpil malapit sa kanya.
- source_word: וַיִּקְרָא
  choice: sumigaw siya
  rationale: Ang pandiwa ay maaaring mangahulugang tumawag nang malakas. Ang “sumigaw” ay angkop sa bigat ng tagpo nang hindi dinaragdagan ang nilalaman ng sinabi.
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלָי
  choice: Palabasin ninyo ang lahat!
  rationale: Ang causative plural imperative ay natural na naihahayag sa “Palabasin ninyo.” Ang כָל אִישׁ ay distributibong tumutukoy sa bawat taong naroon; sa Tagalog, malinaw at hindi mabigat ang “ang lahat.” Hindi na kailangang isalin nang hiwalay ang מֵעָלָי dahil ipinahihiwatig na ng “palabasin” na paalisin sila mula sa kinaroroonan ni Jose.
- source_word: וְלֹא עָמַד אִישׁ אִתּוֹ
  choice: Walang sinumang nanatili sa piling niya
  rationale: Bagaman literal na “walang taong tumayo kasama niya,” ang עמד ay tumutukoy rito sa pananatiling naroon. Ang “nanatili sa piling niya” ay malinaw at likas sa Tagalog.
- source_word: בְּהִתְוַדַּע יוֹסֵף אֶל אֶחָיו
  choice: nang ipakilala ni Jose ang kanyang sarili sa kanyang mga kapatid
  rationale: Ang hitpael ng ידע ay nangangahulugang ipaalam o ipakilala ang sarili. Pinananatili ng salin ang reflexive na diwa at ang tahasang tinutukoy na mga kapatid ni Jose.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pasalaysay na teksto. Iniwasan ang sobrang literal na mga pariralang magiging asiwa sa karaniwang mambabasa, ngunit pinanatili sa talababa ang mas pormal na anyo kung may mahalagang pagkakaiba.
