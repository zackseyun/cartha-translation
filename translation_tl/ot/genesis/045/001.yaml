  to: Hindi na mapigilan ni Jose ang sarili niya sa harap ng lahat ng naroon sa tabi niya,[a] kaya sumigaw siya, “Paaliisin ninyo ang lahat mula sa harap ko!” Walang sinumang nanatili sa piling niya nang magpakilala si Jose sa kanyang mga kapatid.
  rationale: Inayos ang utos upang maisama ang direksiyong “mula sa harap ko,” na nasa Hebreong מֵעָלָי. Pinahusay din ang dalawang parirala para sa mas likas na modernong Tagalog nang hindi binabago ang kahulugan o antas ng pananalita.
