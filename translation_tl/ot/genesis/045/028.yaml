  text: And Israel said[a], “Enough! Joseph my son is still alive. I will go and see him before I die.”
translation:
  language: tl
  text: At sinabi ni Israel[a], “Sapat na! Buhay pa ang anak kong si Jose. Pupunta ako at makikita ko siya bago ako mamatay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sapat na ito!” Ang Hebreong רַב ay isang padamdam na nagpapahayag ng kasapatan dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi dinaragdagan ang ugnayang temporal o sanhi.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Israel ang tahasang pangalang ginamit sa tekstong Hebreo, kaya hindi ito pinalitan ng Jacob.
- source_word: רַב
  choice: Sapat na!
  rationale: Sa padamdam na kontekstong ito, nagpapahayag ang רַב ng kasapatan at matatag na tugon sa balitang buhay si Jose; likas at mariin sa makabagong Filipino ang “Sapat na!”
- source_word: עוֹד ... חָי
  choice: Buhay pa
  rationale: Ang עוֹד kasama ng חָי ay nagsasaad na nananatiling buhay si Jose; “buhay pa” ang pinakanatural na ayos sa Filipino.
- source_word: בְּנִי
  choice: ang anak kong si Jose
  rationale: Pinananatili ang personal at pampamilyang diin ng “aking anak,” habang natural sa Filipino ang pang-angkop at pantukoy sa pangalan.
- source_word: אֵלְכָה
  choice: Pupunta ako
  rationale: Ang cohortative ay nagpapahayag ng matibay na pasiya; malinaw itong naihahatid ng aspektong kontemplatibo sa Filipino nang hindi nagdaragdag ng obligasyon.
- source_word: וְאֶרְאֶנּוּ
  choice: at makikita ko siya
  rationale: Direktang isinasalin ang pandiwa ng pagkakita at ang panlalaking isahang hulapi sa natural na Filipino.
- source_word: בְּטֶרֶם אָמוּת
  choice: bago ako mamatay
  rationale: Payak at natural na salin ng sugnay na temporal, nang walang dagdag na kahulugan.
