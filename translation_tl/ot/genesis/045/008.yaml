base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/008.yaml
  text: So now[a], it was not you who sent me here, but God; and he has made me a father to Pharaoh, and lord over all his house, and ruler over all the land of Egypt.
translation:
  language: tl
  text: Kaya ngayon, hindi kayo ang nagsugo sa akin dito, kundi ang Diyos. Ginawa niya akong ama para kay Paraon[a], at panginoon ng buong sambahayan ni Paraon, at tagapamahala sa buong lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ama para kay Paraon” ay isang talinghaga para sa tungkulin ng pangunahing tagapayo, tagapagkaloob, o tagapagtaguyod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinahahayag nito kapwa ang ugnayan sa naunang sinabi ni Jose at ang pangwakas na konklusyon niya.
- source_word: לֹא אַתֶּם שְׁלַחְתֶּם אֹתִי הֵנָּה כִּי הָאֱלֹהִים
  choice: hindi kayo ang nagsugo sa akin dito, kundi ang Diyos
  rationale: Pinananatili ng hulma na “hindi kayo ang … kundi” ang mariing paghaharap sa Hebreo, pati ang deiktikong “dito” para sa Ehipto.
- source_word: וַיְשִׂימֵנִי
  choice: Ginawa niya akong
  rationale: Likas ito sa Filipino at ipinahahayag ang pagkakalagay kay Jose sa katungkulang taglay pa rin niya sa kasalukuyang tagpo.
- source_word: לְאָב לְפַרְעֹה
  choice: ama para kay Paraon
  rationale: Pinananatili ang talinghagang “ama” sa halip na paliitin ito sa “tagapayo” lamang; nililinaw ng “para kay” na isang tungkulin o ugnayan ang tinutukoy, hindi literal na pagkaama.
- source_word: וּלְאָדוֹן לְכָל בֵּיתוֹ
  choice: panginoon ng kanyang buong sambahayan
  rationale: Ang “panginoon” ay nagpapahayag ng kapamahalaan, at ang “sambahayan” ay mas malinaw na sumasaklaw sa mga tao at ari-arian kaysa sa literal na “bahay.”
- source_word: וּמֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: at tagapamahala sa buong lupain ng Ehipto
  rationale: Ang “tagapamahala” ay natural at sapat na malawak para sa isang taong namumuno, habang pinananatili ng “lupain” ang hayagang אֶרֶץ.
theological_decisions:
- issue: Ang paghahari ng Diyos at ang pananagutan ng mga kapatid ni Jose
  choice: Pinanatili ang mariing pahayag na “hindi kayo … kundi ang Diyos.”
  alternative: Palambutin ang paghaharap o ipaliwanag sa salin ang isang tiyak na doktrina ng providensiya.
  rationale: Binibigyang-diin ni Jose ang mapagpasiyang layunin ng Diyos nang hindi itinatanggi ang tunay na ginawa ng kanyang mga kapatid. Hindi nilulutas ng salin ang tensiyong ito sa pamamagitan ng dagdag na paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang talinghagang “ama” at ang tatlong magkakaugnay na katungkulan ni Jose, habang iniwasan ang labis na teknikal o denominasyonal na pananalita.
