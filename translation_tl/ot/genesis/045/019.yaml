base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/019.yaml
  text: 'And you are commanded[a], ‘Do this: take for yourselves wagons from the land of Egypt for your little ones and for your wives[c][b], and carry your father and come.’'
translation:
  language: tl
  text: 'Inutusan ka na: “Gawin ninyo ito: kumuha kayo para sa inyo ng mga karwahe[a] mula sa lupain ng Ehipto para sa mga maliliit ninyong anak[b] at sa inyong mga asawa. Dalhin ninyo ang inyong ama at pumarito kayo.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kariton,” ibig sabihin, mga sasakyang pandala mula sa Ehipto.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga maliliit na anak” ay partikular na tumutukoy sa mga batang paslit.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “bumalik kayo rito.” Ipinahihiwatig ng konteksto ang pagbabalik sa Ehipto, bagaman “pumarito” lamang ang tahasang sinasabi sa Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: צֻוֵּיתָה
  choice: ikaw ay inuutusan
  rationale: Pinananatili ang anyong balintiyak at ang tuwirang pagharap kay Jose; ang kasunod na maramihang pautos ay para sa mga kapatid niya.
- source_word: זֹאת עֲשׂוּ
  choice: Gawin ninyo ito
  rationale: Likas at tuwirang katumbas ng karaniwang pormula ng pag-uutos sa Hebreo.
- source_word: קְחוּ לָכֶם
  choice: kumuha kayo para sa inyong sarili
  rationale: Ipinahahayag ang benepaktibo o panariling diin ng לָכֶם, hindi lamang ang payak na ‘kumuha.’
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang אֶרֶץ habang nananatiling natural sa Filipino.
- source_word: עֲגָלוֹת
  choice: mga karwahe
  rationale: Tumutukoy sa mga sasakyang may gulong na gagamitin sa paglilipat ng pamilya; mas angkop sa pagdadala ng mga tao kaysa sa mas makitid na larawan ng kariton sa kasalukuyang Filipino.
- source_word: לְטַפְּכֶם
  choice: para sa inyong maliliit na anak
  rationale: Ipinakikita ang tiyak na diwa ng טַף bilang maliliit na bata, hindi lamang mga anak sa pangkalahatan.
- source_word: וְלִנְשֵׁיכֶם
  choice: at sa inyong mga asawa
  rationale: Sa konteksto ng sambahayang maglalakbay, ‘mga asawa’ ang malinaw na relasyonal na kahulugan.
- source_word: וּנְשָׂאתֶם אֶת אֲבִיכֶם
  choice: Dalhin ninyo ang inyong ama
  rationale: Bagaman maaaring literal na ‘buhatin’ o ‘isakay,’ ang pandiwa rito ay tumutukoy sa pagdadala sa ama bilang bahagi ng paglalakbay; iniiwasan ng ‘dalhin’ ang di-kinakailangang pagpapalagay kung paano siya ihahatid.
- source_word: וּבָאתֶם
  choice: at pumarito kayo
  rationale: Pinananatili ang payak na ‘pumarito’ ng Hebreo; hindi idinaragdag sa pangunahing teksto ang kontekstuwal ngunit hindi tahasang ‘bumalik.’
