translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na paglipat mula sa isahang kausap na si Jose tungo sa maramihang utos para sa kanyang mga kapatid. Pinanatili ang payak na sintaks at ang ambiguwidad ng huling pandiwa.
