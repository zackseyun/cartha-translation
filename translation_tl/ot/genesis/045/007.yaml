  yaml_path: translation/ot/genesis/045/007.yaml
  text: And God sent me ahead of you to preserve for you a remnant in the land[b][a], and to keep you alive by a great deliverance.
translation:
  language: tl
  text: At isinugo ako ng Diyos na mauna sa inyo upang mag-iwan para sa inyo ng isang nalabi sa lupain[a], at upang mapanatili kayong buhay sa pamamagitan ng isang dakilang pagliligtas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang mag-iwan para sa inyo ng mga nakaligtas sa lupain,” o “upang mapanatili ang inyong lahi sa lupain.” Ang Hebreong שְׁאֵרִית ay maaaring tumukoy sa nalabi, mga nakaligtas, o lahing mananatili.
    reason: lexical_alternative
  - marker: b
    text: O “para sa isang malaking pagtakas,” o “upang manatili ang marami sa inyo.” Ang Hebreong לִפְלֵיטָה גְּדֹלָה ay maaaring magbigay-diin sa pagliligtas o pagtakas, o sa malaking pangkat ng mga taong nakaligtas bilang bunga nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵנִי
  choice: isinugo ako
  rationale: Ang wayyiqtol ng שׁלח ay nagsasaad ng naganap na kilos sa salaysay; likas at marangal sa Filipino ang “isinugo ako.”
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tumutukoy ito rito sa iisang Diyos sa pagpapakahulugan ni Jose sa mga pangyayari.
- source_word: לִפְנֵיכֶם
  choice: na mauna sa inyo
  rationale: Ipinahihiwatig ng idyoma ang temporal na pag-una ni Jose sa pagpunta sa Ehipto, hindi lamang pisikal na pagiging nasa harapan.
- source_word: לָשׂוּם לָכֶם שְׁאֵרִית
  choice: upang magpanatili para sa inyo ng mga nalabi
  rationale: Bagaman literal na “maglagay/magtakda,” ipinahihiwatig ng שׂוּם kasama ng שְׁאֵרִית ang pagtiyak na may matitirang mga buhay. Pinananatili ng “mga nalabi” ang mahalagang bokabularyo ng tekstong Hebreo habang malinaw na tumutukoy sa mga tao.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Ang lokal na kahulugang “lupain” ang akma sa konteksto kaysa sa mas malawak na “daigdig.”
- source_word: וּלְהַחֲיוֹת לָכֶם
  choice: at upang panatilihin kayong buhay
  rationale: Ang Hiphil ng חיה ay nangangahulugang magpanatiling buhay o magligtas ng buhay.
- source_word: לִפְלֵיטָה גְּדֹלָה
  choice: sa pamamagitan ng isang dakilang pagliligtas
  rationale: Ipinapahayag nito ang malakihang bunga ng pagliligtas ng Diyos. Inilalagay sa talababa ang posibilidad na ang פְּלֵיטָה ay tumukoy sa pagtakas o sa maraming nakaligtas.
theological_decisions:
- issue: Kung ang שְׁאֵרִית ay isasaling may biblikal na taginting na “mga nalabi” o mas tahasang “mga nakaligtas/lahi”
  choice: mga nalabi
  alternative: mga nakaligtas; lahing mananatili
  rationale: Tapat ang “mga nalabi” sa pangunahing kahulugan ng salitang Hebreo at pinananatili nito ang mahalagang ugnayang leksikal sa iba pang bahagi ng Kasulatan, nang hindi ipinapasok ang isang kalaunang sistemang teolohikal.
- issue: Kung ang לִפְלֵיטָה גְּדֹלָה ay tumutukoy sa pagliligtas bilang pangyayari o sa malaking bilang ng mga nakaligtas
  choice: isang dakilang pagliligtas
  alternative: isang malaking pagtakas; maraming nakaligtas
  rationale: Sa pagkakahanay nito sa “panatilihin kayong buhay,” natural itong unawain bilang malakihang kinalabasan ng gawa ng Diyos, ngunit tunay na nananatili sa pangngalang Hebreo ang posibilidad na tumukoy sa mga nakaligtas.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “isinugo” at “dakilang pagliligtas” para sa marangal na rehistro, habang nananatiling tuwiran ang balangkas. Inilagay ang bawat talababa kaagad sa pariralang nililinaw nito.
