  naturalness: Ang “mag-iwan para sa inyo ng isang nalabi” ay natural at marangal na modernong Filipino. Inayos rin ang pangalawang sugnay sa “upang mapanatili kayong buhay” upang maging mas tuwiran at hindi paulit-ulit ang pandiwang “panatilihin.”
