base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/026.yaml
  text: They told him[a], saying, “Joseph is still alive, and he is ruler over all the land of Egypt.” But his heart went numb, for he did not believe them.
translation:
  language: tl
  text: Sinabi nila sa kanya, “Buhay pa si Jose, at siya ang namamahala sa buong lupain ng Ehipto.” Ngunit nanlupaypay ang puso niya[a] dahil hindi siya naniwala sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nanghina ang puso niya” o “parang namanhid ang puso niya.” Inilalarawan ng idyomang Hebreo ang pagkabigla at panghihina ng kalooban ni Jacob nang marinig niya ang balita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: Sinabi nila sa kanya
  rationale: Likas na panimulang pahayag sa makabagong Tagalog; hindi na kailangang isalin nang hiwalay ang pormulang לֵאמֹר dahil tuwirang sumusunod ang sipi.
- source_word: עוֹד יוֹסֵף חַי
  choice: Buhay pa si Jose
  rationale: Ang עוֹד ay nagsasaad na nagpapatuloy ang kalagayan; malinaw at natural itong ipinahahayag ng “pa.”
- source_word: מֹשֵׁל
  choice: namamahala
  rationale: Ipinahahayag ng participle ang aktuwal na paggamit ng kapangyarihang mamuno nang hindi ito nililimitahan sa isang tiyak na titulong Ehipsiyo.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: sa buong lupain ng Ehipto
  rationale: Kasama ng מֹשֵׁל, tinutukoy ng parirala ang saklaw ng pamamahala; natural sa Tagalog ang “namamahala sa.”
- source_word: וַיָּפָג לִבּוֹ
  choice: nanlupaypay ang puso niya
  rationale: Pinananatili ang metapora ng puso at ipinahahayag ang biglaang panghihina at pagkabigla ni Jacob; inilalahad sa talababa ang tunay na lawak ng posibleng kahulugan.
- source_word: כִּי לֹא הֶאֱמִין לָהֶם
  choice: dahil hindi siya naniwala sa kanila
  rationale: Ipinakikita ng “dahil” ang sanhi ng reaksiyon ni Jacob at tuwirang tinutumbasan ang causal na כִּי.
