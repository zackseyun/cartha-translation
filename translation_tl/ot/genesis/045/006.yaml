id: GEN.45.6
reference: Genesis 45:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּי זֶ֛ה שְׁנָתַ֥יִם הָ/רָעָ֖ב בְּ/קֶ֣רֶב הָ/אָ֑רֶץ וְ/עוֹד֙ חָמֵ֣שׁ שָׁנִ֔ים אֲשֶׁ֥ר אֵין חָרִ֖ישׁ וְ/קָצִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/006.yaml
  text: For these two years the famine has been in the midst of the land[b][a], and there are still five years in which there will be neither plowing nor harvest.
translation:
  language: tl
  text: Sapagkat dalawang taon nang may taggutom sa lupain[a], at may lima pang taon na walang pag-aararo ni pag-aani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa gitna ng lupain.”
    reason: lexical_alternative
  - marker: b
    text: O “walang pag-aararo ni paggapas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag ni Jose kung bakit siya naunang ipinadala ng Diyos; malinaw na ipinapakita ng “Sapagkat” ang ugnayang sanhi sa naunang pahayag.
- source_word: זֶה שְׁנָתַיִם
  choice: dalawang taon na
  rationale: Ang anyong dual ay tiyak na tumutukoy sa dalawang taon na lumipas na hanggang sa kasalukuyang sandali; ipinahahayag ito nang likas sa Tagalog sa hulma na “dalawang taon na,” na naging “dalawang taon nang” sa pangungusap.
- source_word: הָרָעָב
  choice: taggutom
  rationale: Tumutukoy ito sa tiyak na taggutom na pinag-uusapan na sa salaysay; likas sa Tagalog na hindi na lagyan ng hiwalay na pantukoy kapag kasunod ng “may.”
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: sa lupain
  rationale: Ang בְּקֶרֶב ay literal na “sa gitna ng,” ngunit sa kontekstong ito ay idyomatikong nagsasaad na umiiral ang taggutom sa loob ng nasabing lupain. Pinananatili sa talababa ang mas literal na anyo.
- source_word: וְעוֹד חָמֵשׁ שָׁנִים
  choice: at may lima pang taon
  rationale: Malinaw nitong ipinapahayag na limang taon pa ang nalalabi mula sa pananaw ng nagsasalita.
- source_word: אֲשֶׁר אֵין
  choice: na walang
  rationale: Ang sugnay ay naglalarawan sa nalalabing limang taon. Hindi kailangang tahasang lagyan ng panandang panghinaharap sa Tagalog dahil ipinahihiwatig na iyon ng “lima pang taon.”
- source_word: חָרִישׁ
  choice: pag-aararo
  rationale: Tumutukoy sa pag-aararo o paglilinang ng lupa bilang gawaing pansakahan, hindi sa pangkalahatang paggawa.
- source_word: קָצִיר
  choice: pag-aani
  rationale: Karaniwan at malinaw na katumbas ng pagkuha ng ani; akma itong itambal sa “pag-aararo.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “lupain” upang panatilihin ang lokal na saklaw ng הָאָרֶץ, at ang “ni” upang likas na ipahayag na kapuwa walang pag-aararo at walang pag-aani.
