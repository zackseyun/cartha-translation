  yaml_path: translation/ot/genesis/045/020.yaml
  text: And do not let your eye spare your belongings[b][a], for all the best of the land of Egypt is yours.
translation:
  language: tl
  text: At huwag ninyong panghinayangan ang inyong mga pag-aari[a], sapagkat para sa inyo ang pinakamainam sa buong lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “huwag maawa ang inyong mata sa inyong mga pag-aari”; ibig sabihin, huwag kayong manghinayang o mag-alala tungkol sa mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵינְכֶם אַל־תָּחֹס עַל
  choice: At huwag ninyong panghinayangan
  rationale: Ang literal na idyomang Hebreo ay may ‘mata’ bilang simuno ng pandiwang ‘maawa/magmalasakit.’ Sa kontekstong ito, ang diwa ay huwag manghinayang sa mga maiiwang dala. Ang ‘panghinayangan’ ay natural sa modernong Tagalog habang pinananatili ang ideya ng pag-aatubiling iwan ang mga ito.
- source_word: כְּלֵיכֶם
  choice: ang inyong mga pag-aari
  rationale: Maaaring tumukoy ang כְּלִי sa mga kagamitan, bagay, o ari-arian. Ang ‘mga pag-aari’ ay sapat na malawak para sa mga gamit ng sambahayan na hindi na nila kailangang dalhin.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ito ng dahilan para sa naunang utos. Ang ‘sapagkat’ ay malinaw at marangal ngunit karaniwan pa ring nauunawaan.
- source_word: טוּב כָּל אֶרֶץ מִצְרַיִם
  choice: ang pinakamainam sa buong lupain ng Ehipto
  rationale: Dito, ang טוּב ay tumutukoy sa pinakamabubuting bagay o yaman na maibibigay ng lupain, hindi lamang sa abstraktong ‘kabutihan.’ Pinananatili ng salin ang saklaw ng כָּל at ang larawan ng lupain.
- source_word: לָכֶם הוּא
  choice: para sa inyo
  rationale: Ang pariralang may לְ ay maaaring magpahayag na ang pinakamainam ng lupain ay nakalaan o magiging kanila. Ang ‘para sa inyo’ ay natural at hindi labis na nagpapasiya sa pagitan ng pagkakaloob at pag-aari.
