translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Isinalin sa malinaw na Tagalog ang idyomang Hebreo sa pangunahing teksto, habang inilagay sa talababa ang literal na larawan ng ‘mata’ upang mapanatili ang anyo at posibleng lawak ng orihinal.
