  yaml_path: translation/ot/genesis/045/015.yaml
  text: And he kissed all his brothers and wept over them. After that[a], his brothers spoke with him.
translation:
  language: tl
  text: At hinalikan niya ang lahat ng kanyang mga kapatid at iniyakan sila. Pagkatapos noon, nakipag-usap sa kanya[a] ang kanyang mga kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kinausap siya.” Maaaring tumukoy ang pariralang Hebreo sa pagsasalita sa kanya o sa pakikipag-usap sa kanya; ipinahihiwatig ng “nakipag-usap” ang pag-uusap sa tagpong ito ng pagkakasundo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַשֵּׁק
  choice: hinalikan
  rationale: Ang Piel ng נשׁק ay tumutukoy sa paghalik bilang pagpapakita ng pagmamahal at pakikipagkasundo. Likas at sapat sa modernong Tagalog ang “hinalikan” nang hindi labis na binibigyang-diin ang posibleng pag-uulit ng kilos.
- source_word: לְכָל אֶחָיו
  choice: ang lahat ng kanyang mga kapatid
  rationale: Ipinahahayag ng כָּל kasama ng pangmaramihang אֶחָיו ang kabuuan ng mga kapatid ni Jose. Malinaw at natural sa Tagalog ang napiling parirala.
- source_word: וַיֵּבְךְּ
  choice: at iniyakan
  rationale: Karaniwang nangangahulugang “umiyak” ang בכה. Sa pagkakaugnay nito sa עֲלֵיהֶם, natural na naipahahayag ng “iniyakan sila” ang matinding pagluha ni Jose dahil sa kanila at sa naganap na pagkakasundo.
- source_word: עֲלֵיהֶם
  choice: sila
  rationale: Sa kontekstong ito, ang עַל ay maaaring maglarawan ng pag-iyak sa ibabaw o nakasandig sa mga kapatid. Iniiwasan ng natural na Tagalog na “iniyakan sila” ang alanganing literal na “umiyak sa ibabaw nila,” bagaman hindi nito tahasang tinutukoy ang pisikal na posisyon.
- source_word: וְאַחֲרֵי כֵן
  choice: Pagkatapos noon
  rationale: Malinaw na panandang temporal ito na nagpapatuloy sa pagkakasunod-sunod ng salaysay.
- source_word: דִּבְּרוּ אֶחָיו אִתּוֹ
  choice: nakipag-usap sa kanya ang kanyang mga kapatid
  rationale: Ang דבר kasama ng אֵת ay maaaring magpahiwatig ng pakikipag-usap, hindi lamang ng isang panig na pagsasalita. Ipinahahayag ng “nakipag-usap” ang usapang naganap matapos ang pagkakasundo.
