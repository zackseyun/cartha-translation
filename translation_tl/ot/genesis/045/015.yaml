  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Pinanatili ang payak na daloy ng salaysay at ang emosyon ng pagkakasundo, habang inilagay sa talababa ang lehitimong pagkakaiba sa pagbasa ng אִתּוֹ.
