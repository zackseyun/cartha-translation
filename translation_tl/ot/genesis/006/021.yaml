  yaml_path: translation/ot/genesis/006/021.yaml
  text: And you[a], take for yourself some of every kind of food that is edible, and gather it to yourself[b]; and it shall be food for you and for them.
translation:
  language: tl
  text: Kumuha ka para sa iyong sarili mula sa bawat uri ng pagkaing maaaring kainin[a], at tipunin mo iyon para sa iyong sarili. Magiging pagkain iyon para sa iyo at para sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na kinakain” o “na maaaring makain.” Maaaring ilarawan ng pariralang Hebreo ang pagkaing karaniwang kinakain o angkop kainin.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: kumuha ka para sa iyong sarili
  rationale: Pinananatili ng “kumuha” ang tuwirang utos ng Qal imperative, habang ipinahahayag ng “para sa iyong sarili” ang benefaktibo o reflexibong diwa ng לְךָ.
- source_word: מִכָּל מַאֲכָל
  choice: ng bawat uri ng pagkain
  rationale: Ipinahahayag nito ang pagpili mula sa buong saklaw ng mga pagkain nang hindi ipinahihiwatig na kukunin ni Noe ang lahat ng pagkaing umiiral.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: na maaaring kainin
  rationale: Ang Niphal ay likas na nagpapahiwatig dito ng pagkaing angkop o maaaring kainin; natural ito sa modernong Tagalog at iniiwasan ang mas alanganing “na kinakain.”
- source_word: וְאָסַפְתָּ אֵלֶיךָ
  choice: at tipunin mo iyon sa iyong tabi
  rationale: Ang “tipunin” ay malapit sa kahulugan ng אָסַף, at ang “sa iyong tabi” ay nagpapanatili sa direksiyonal na diwa ng אֵלֶיךָ nang natural sa Tagalog.
- source_word: וְהָיָה לְךָ וְלָהֶם לְאָכְלָה
  choice: Magiging pagkain iyon para sa iyo at para sa kanila
  rationale: Ipinapakita ng “magiging” ang bunga sa hinaharap ng utos, at pinananatili ang malinaw na pagkakaiba sa pagitan ni Noe at ng mga hayop.
