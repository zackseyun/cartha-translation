revisions:
- from: At kumuha ka para sa iyong sarili ng bawat uri ng pagkaing maaaring kainin[a], at tipunin mo iyon sa iyong tabi. Magiging pagkain iyon para sa iyo at para sa kanila.
  to: Kumuha ka para sa iyong sarili mula sa bawat uri ng pagkaing maaaring kainin[a], at tipunin mo iyon para sa iyong sarili. Magiging pagkain iyon para sa iyo at para sa kanila.
  rationale: Pinalitan ang “sa iyong tabi” ng “para sa iyong sarili” upang maiwasan ang di-suportadong pisikal na lokasyon at maipahayag ang direksiyonal/benefaktibong diwa ng אֵלֶיךָ. Idinagdag ang “mula sa” upang katawanin ang מִכָּל. Pinanatili ang footnote sa ankla ng “maaaring kainin,” na nagbibigay ng literal na alternatibo nang hindi ginagawang pangunahing teksto ang alanganing Tagalog.
