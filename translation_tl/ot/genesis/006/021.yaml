    rationale: Ang parirala ay nangangahulugang pisikal na “beside you,” samantalang ang Hebreo ay nagsasaad ng pag-iipon patungo/para kay Noe. Hindi hinihingi ng teksto ang lokasyong “tabi.”
  - severity: low
    issue: Hindi malinaw ang selektibong diwa ng מִכָּל sa “ng bawat uri.”
    rationale: Maaaring mabasa ang “kumuha ... ng bawat uri” bilang simpleng “take every kind.” Ang “mula sa bawat uri” ay mas tuwirang nagpapakita ng pagkuha mula sa saklaw ng bawat uri, nang hindi nagsasabing kukunin ang lahat ng pagkain.
