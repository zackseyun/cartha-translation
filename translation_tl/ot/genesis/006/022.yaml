  text: Thus Noah did[a]; according to all that God commanded him[b], so he did.
translation:
  language: tl
  text: At ginawa ni Noe[a] ang lahat ayon sa iniutos sa kanya ng Diyos; gayon nga ang ginawa niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit ang pandiwang “ginawa” para sa diin: “ginawa ni Noe ... gayon nga ang ginawa niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ginawa
  rationale: Ang עשה ay malawak na pandiwang nangangahulugang “gumawa” o “isagawa.” Dito, binubuod nito ang pagsunod ni Noe sa naunang mga tagubilin.
- source_word: נֹחַ
  choice: Noe
  rationale: Ito ang nakaugaliang anyo ng pangalang נֹחַ sa Tagalog.
- source_word: כְּכֹל אֲשֶׁר
  choice: ang lahat ayon sa
  rationale: Ipinahahayag ng parirala ang ganap na pagtutugma ng ginawa ni Noe sa kabuuan ng iniutos sa kanya.
- source_word: צִוָּה
  choice: iniutos
  rationale: Ang צוה ay tumutukoy sa makapangyarihang pag-uutos; pinananatili ng “iniutos” ang awtoridad ng Diyos sa konteksto.
- source_word: אֹתוֹ
  choice: sa kanya
  rationale: Ang tuwirang layon na may panlalaking pang-isahang hulapi ay tumutukoy kay Noe bilang tumanggap ng utos.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman maramihan ang anyo nito, isahan ang pandiwa at malinaw na tumutukoy ito sa iisang Diyos.
- source_word: כֵּן
  choice: gayon nga
  rationale: Muling pinagtitibay ng כֵּן ang naunang pahayag at idinidiin ang eksaktong pagsunod; natural itong maipahahayag sa Tagalog bilang “gayon nga.”
- source_word: עָשָׂה
  choice: ang ginawa niya
  rationale: Pinananatili ang pag-uulit ng עשה upang maipakita ang diin ng Hebreo sa ganap na pagsunod ni Noe.
theological_decisions:
- issue: Paglalahad sa inuulit na pormula ng pagsunod nang hindi inaalis ang pag-uulit
  choice: 'Panatilihin ang dalawang paggamit ng “ginawa”: “Kaya ginawa ni Noe ...; gayon nga ang ginawa niya.”'
  alternative: Ginawa ni Noe ang lahat ng iniutos sa kanya ng Diyos.
  rationale: Sinasadyang ulitin ng Hebreo ang עשה upang idiin ang pagsunod ni Noe. Pinananatili ng salin ang pag-uulit nang hindi nagdaragdag ng interpretasyong teolohikal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “Kaya” bilang natural na pambungad na nagbubuod sa tugon ni Noe, at pinanatili ang estilistikong pag-uulit ng orihinal.
