  text: the sons of God saw that the daughters of man were beautiful[b][a], and they took wives for themselves from any they chose.
translation:
  language: tl
  text: Nakita ng mga anak ng Diyos[a] na magaganda[b] ang mga anak na babae ng tao, at kumuha sila ng mga asawa para sa kanilang sarili mula sa sinumang pinili nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga nilalang sa langit.” Pinagtatalunan kung sino ang “mga anak ng Diyos”; kabilang sa mga pangunahing pagpapakahulugan ang mga nilalang sa langit, mga pinunong tao, o ang angkan ni Set.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “mabubuti”; sa kontekstong ito, tumutukoy ito sa kaakit-akit na anyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הָאֱלֹהִים
  choice: mga anak ng Diyos
  rationale: Pormal na malapit sa Hebreo at hindi nagpapasiya sa pinagtatalunang pagkakakilanlan ng mga tinutukoy.
- source_word: בְנוֹת הָאָדָם
  choice: mga anak na babae ng tao
  rationale: Pinananatili ang panliteraturang pagtutumbas at kaibahan sa “mga anak ng Diyos”; ang אָדָם ay isinaling kolektibong “tao.”
- source_word: כִּי טֹבֹת הֵנָּה
  choice: na magaganda
  rationale: Sa konteksto, ang טֹבֹת ay tumutukoy sa kaakit-akit na anyo; natural at malinaw ang “magaganda” sa modernong Tagalog.
- source_word: וַיִּקְחוּ לָהֶם נָשִׁים
  choice: kumuha sila ng mga asawa para sa kanilang sarili
  rationale: Pinananatili ang karaniwang kahulugan ng נָשִׁים bilang “mga asawa” sa pariralang ito at ang diwa ng לָהֶם.
- source_word: מִכֹּל אֲשֶׁר בָּחָרוּ
  choice: mula sa sinumang pinili nila
  rationale: Likas na Tagalog na naghahatid sa malayang pagpili na ipinahihiwatig ng Hebreo nang walang idinaragdag na interpretasyon.
theological_decisions:
- issue: Pagkakakilanlan ng “mga anak ng Diyos”
  choice: Panatilihin ang literal na pariralang “mga anak ng Diyos” nang hindi tinutukoy kung sino sila.
  alternative: “mga nilalang sa langit,” mga pinunong tao, o ang angkan ni Set
  rationale: Hindi nilulutas ng talata ang pinagtatalunang pagkakakilanlan; pinananatili ng salin ang tunay na kalabuan at inilalahad sa talababa ang mga pangunahing pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “anak na babae ng tao” upang mapanatili ang estruktura at kaibahan ng Hebreo, at iniwasang lutasin sa mismong teksto ang pinagtatalunang pagkakakilanlan ng “mga anak ng Diyos.”
