  source_fidelity: 'Ang salin ay tapat sa pangunahing diwa ng Hebreo: ang pormulang תולדות, ang paglalarawan kay Noe bilang matuwid at תמים, at ang metaporang ‘lumakad kasama ng Diyos.’ Gayunman, ang ‘sa kanyang mga salinlahi’ sa makabagong Tagalog ay mas madaling unawain bilang tumutukoy sa mga inapo ni Noe, samantalang ang בְּדֹרֹתָיו ay tumutukoy sa kaniyang salinlahi/panahon o mga kapanahon.'
