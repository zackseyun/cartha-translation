  text: These are the generations of Noah. Noah was a righteous man[a], blameless in his generation. Noah walked with God.
translation:
  language: tl
  text: Ito ang mga salinlahi ni Noe. Si Noe ay isang taong matuwid at walang kapintasan sa kanyang salinlahi.[a] Lumakad si Noe kasama ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa gitna ng kanyang mga kapanahon” o “noong kanyang panahon.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: Ito ang mga salinlahi
  rationale: Pinananatili ang mahalagang pormulang panstruktura ng Genesis at ang pangmaramihang anyo ng תּוֹלְדֹת, kahit maaari rin itong tumukoy sa salaysay o kasaysayan ng isang angkan.
- source_word: נֹחַ
  choice: Noe
  rationale: Karaniwang anyo ng pangalang biblikal sa makabagong Tagalog.
- source_word: אִישׁ צַדִּיק
  choice: isang taong matuwid
  rationale: Likas na Tagalog na nagpapanatili sa tiyak na pagtukoy kay Noe bilang lalaki at sa moral at teolohikal na bigat ng צַדִּיק.
- source_word: תָּמִים
  choice: walang kapintasan
  rationale: Ipinahihiwatig ang integridad at matuwid na pagkatao, hindi ang ganap na kawalan ng kasalanan.
- source_word: בְּדֹרֹתָיו
  choice: sa kanyang mga salinlahi
  rationale: Pinananatili ang pangmaramihang anyo at ang tunay na kalabuan ng Hebreo; inilalagay sa talababa ang mas idiomatikong mga posibilidad.
- source_word: אֶת־הָאֱלֹהִים הִתְהַלֶּךְ
  choice: Lumakad ... kasama ng Diyos
  rationale: Pinananatili ang metapora ng paglakad at ang ugnayang ipinahihiwatig ng idyomang Hebreo.
theological_decisions:
- issue: Kahulugan ng תָּמִים bilang paglalarawan kay Noe
  choice: walang kapintasan bilang paglalarawan ng integridad
  alternative: sakdal; walang dungis
  rationale: Hindi hinihingi ng Hebreo ang doktrina ng ganap na kawalan ng kasalanan; pinananatili ng salin ang matibay na papuri nang hindi lumalampas sa sinasabi ng teksto.
- issue: Saklaw ng בְּדֹרֹתָיו
  choice: sa kanyang mga salinlahi
  alternative: sa gitna ng kanyang mga kapanahon; noong kanyang panahon
  rationale: Maaaring tumukoy ang parirala sa mga salinlahing inabutan ni Noe o sa mga taong kapanahon niya. Pinananatili sa pangunahing teksto ang anyo at kalabuan ng Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang mga susing metaporang biblikal at ang pormulang panstruktura ng Genesis, pati ang kalabuan ng בְּדֹרֹתָיו.
