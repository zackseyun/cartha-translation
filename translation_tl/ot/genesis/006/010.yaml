  text: 'Si Noe ay naging ama ng tatlong anak na lalaki: sina Sem, Ham, at Jafet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: Nagkaanak
  rationale: Ang Hiphil na anyo ng ילד sa salaysay ay tumutukoy sa pagkakaroon ni Noe ng mga anak bilang ama. Natural ito sa makabagong Filipino; malinaw naman ang ugnayang paternal dahil si Noe ang paksa at 'mga anak na lalaki' ang kasunod.
- source_word: שְׁלֹשָׁה בָנִים
  choice: tatlong anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang בָנִים, hindi lamang mga anak sa pangkalahatan.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: sina Sem, Ham, at Jafet
  rationale: Ang אֶת ay mga pananda ng tiyak na tuwirang layon. Ang Filipino na 'sina' ang likas na pananda para sa talaan ng mga pangalang pantangi; ginamit ang nakaugaliang anyong Filipino ng mga pangalan.
- source_word: נֹחַ
  choice: Noe
  rationale: Ito ang nakaugaliang anyong Filipino ng pangalang Hebreo na נֹחַ.
