base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/017.yaml
  text: And I—behold[a], I am bringing the flood of waters upon the earth to destroy all flesh in which is the breath of life from under heaven. Everything that is on the earth will perish.
translation:
  language: tl
  text: At ako—narito, ako'y magpaparating ng baha ng tubig sa ibabaw ng lupa upang lipulin ang lahat ng laman sa silong ng langit na may hininga ng buhay[a]. Mamamatay ang lahat ng nasa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “espiritu ng buhay.” Ang salitang Hebreo na רוּחַ ay maaaring mangahulugang “hininga,” “hangin,” o “espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנְנִי
  choice: At ako—narito
  rationale: Pinananatili ng malayang panghalip at ng הִנְנִי ang mariin at taimtim na pagpapakilala sa gagawin ng nagsasalita. Likas at marangal sa Tagalog ang “narito” bilang panandang pantawag-pansin.
- source_word: מֵבִיא
  choice: magpaparating ako
  rationale: Ang participle ay nagpapahiwatig ng tiyak at nalalapit na pagkilos. Ipinahahayag ito ng “magpaparating” nang hindi dinaragdagan ng tahasang “malapit nang.”
- source_word: הַמַּבּוּל מַיִם
  choice: baha ng tubig
  rationale: Pinananatili ang dalawang elementong Hebreo—ang baha at ang tubig—sa isang malinaw at natural na pariralang Tagalog.
- source_word: עַל הָאָרֶץ
  choice: sa ibabaw ng lupa
  rationale: Ang “lupa” ay maaaring tumukoy sa daigdig o lupain, gaya ng saklaw ng אֶרֶץ; sa kontekstong ito, ipinahihiwatig ng talata ang malawak na saklaw nang hindi kinakailangang alisin ang leksikal na lawak nito.
- source_word: לְשַׁחֵת
  choice: upang lipulin
  rationale: Malinaw na ipinapakita ng “upang” ang layunin ng infinitive, at ang “lipulin” ay angkop sa lubusang mapanirang hatol sa konteksto.
- source_word: כָּל בָּשָׂר
  choice: ang lahat ng laman
  rationale: Pinananatili ang mahalagang biblikal na idyomang “lahat ng laman” sa halip na paliitin ito sa tao lamang o ipaliwanag bilang “lahat ng nilalang na buhay.”
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: na may hininga ng buhay
  rationale: Sa konteksto ng mga nilalang na mamamatay sa baha, ang רוּחַ ay pinakamalinaw na tumutukoy sa hiningang nagbibigay-buhay. Ang alternatibong “espiritu” ay pinananatili sa talababa.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: sa silong ng langit
  rationale: Ang “sa silong ng langit” ay isang likas ngunit marangal na katumbas ng idyomang tumutukoy sa buong nasasakupan sa ilalim ng kalangitan.
- source_word: כֹּל אֲשֶׁר בָּאָרֶץ
  choice: ang lahat ng nasa lupa
  rationale: Maikli at malinaw nitong pinananatili ang panlahatan at nagbubuod na diin ng Hebreo.
- source_word: יִגְוָע
  choice: mamamatay
  rationale: Ang pandiwa ay tumutukoy sa pagkamatay o pagkalagot ng hininga. “Mamamatay” ang pinakadirekta at natural na salin sa modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng רוּחַ sa רוּחַ חַיִּים
  choice: hininga ng buhay
  alternative: espiritu ng buhay
  rationale: Mas natural sa konteksto ng baha ang hiningang nagpapakilalang buhay ang mga nilalang, at umaalingawngaw ito sa wika ng paglikha sa Genesis. Gayunman, tunay na leksikal na posibilidad ang “espiritu,” kaya inilalahad ito sa talababa sa halip na tuluyang alisin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang taimtim na diin ng pahayag at ang mga pangunahing biblikal na idyoma, ngunit iniwasan ang sobrang makaluma o teknikal na pananalita.
