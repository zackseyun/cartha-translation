  yaml_path: translation/ot/genesis/006/011.yaml
  text: The earth was corrupt before God[a], and the earth was filled with violence.
translation:
  language: tl
  text: Naging tiwali ang daigdig sa harap ng Diyos[a], at napuno ng karahasan ang daigdig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Naging tiwali ang lupain sa paningin ng Diyos.”
    reason: Pinananatili ang mga leksikal na alternatibo ng הָאָרֶץ (“lupain”) at לִפְנֵי (“sa paningin ng”).
lexical_decisions:
- source_word: וַתִּשָּׁחֵת
  choice: naging tiwali
  rationale: Ang Niphal ng שׁחת ay naglalarawan sa daigdig na sumapit sa kalagayang nasira o naging tiwali. Likas sa modernong Tagalog ang “naging tiwali,” at sa konteksto ay ipinahihiwatig nito ang moral na kabulukan nang hindi inaalis ang mas malawak na diwa ng pagkasira.
- source_word: הָאָרֶץ
  choice: ang daigdig
  rationale: Maaaring tumukoy ang אֶרֶץ sa “daigdig” o “lupain.” Sa salaysay ng baha, ang “daigdig” ang mas angkop na pangunahing salin; pinanatili rin ang pag-uulit nito para sa diin ng Hebreo.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: sa harap ng Diyos
  rationale: Malapit ito sa literal na diwa ng לִפְנֵי na “sa harap” o “sa presensya ng,” habang nananatiling natural at marangal sa Tagalog. Ang “sa paningin ng Diyos” ay posibleng alternatibong nagpapahayag ng banal na pagtatasa.
- source_word: וַתִּמָּלֵא
  choice: napuno
  rationale: Ipinahahayag ng Niphal ng מלא na ang daigdig ay napuspos o napuno. Ang “napuno” ay maikli, natural, at nagpapanatili sa resultang kalagayan at pagsulong ng salaysay.
- source_word: חָמָס
  choice: karahasan
  rationale: Ang חָמָס ay tumutukoy sa karahasan, kalupitan, at marahas na paggawa ng masama. “Karahasan” ang pinakadirekta at hindi labis na pinalawak na salin.
- source_word: וַ
  choice: at
  rationale: Ang waw ay nag-uugnay at nagpapatuloy sa salaysay. Isinalin ang ikalawang waw na “at”; hindi nagdagdag ng panimulang pantukoy sa panahon na walang tuwirang katumbas sa Hebreo.
theological_decisions:
- issue: Likas ng katiwaliang inilalarawan
  choice: Moral na katiwalian ng daigdig o lipunan ng tao sa harap ng Diyos
  alternative: Pisikal na pagkasira ng daigdig
  rationale: Binibigyang-diin ng kalapit na konteksto ang kasamaan at karahasan ng tao, kaya ang “naging tiwali” ang pangunahing pagbasa. Gayunman, hindi nito lubusang inaalis ang mas malawak na kahulugan ng ugat na שׁחת na pagkasira.
- issue: Saklaw ng הָאָרֶץ
  choice: daigdig
  alternative: lupain
  rationale: Mas malawak ang saklaw ng salaysay ng baha, ngunit tunay na leksikal na posibilidad ang “lupain”; kaya inilagay ito sa talababa sa halip na tahimik na alisin ang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang pag-uulit ng “ang daigdig” bilang retorikal na diin ng Hebreo; iniwasan ang labis na pormal na “sa harapan ng” at ang pagpapalawak sa חָמָס bilang isang buong parirala.
