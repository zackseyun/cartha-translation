  verdict: approve
  source_fidelity: 'Tapat ang salin sa mga pangunahing bahagi ng Hebreo: ang di-tiyak na צֹהַר ay isinaling “bubong” at maayos na tinatala ang “bintana” at bukasang papasukan ng liwanag bilang mga posibilidad; ang mahirap na pariralang tungkol sa isang siko sa itaas ay hindi labis na binibigyang-kahulugan; ang pintuan ay nasa tagiliran ng daong; at ang tatlong antas ay naipahayag nang buo.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang mga pautos na “Gumawa ka,” “Maglagay ka,” at “Gawin mo” ay angkop sa register ng tagubilin. Ang “sa isang siko sa dakong itaas” ay sadyang bahagyang mahirap, ngunit ito ay katapat ng tunay na kahirapan at kawalang-katiyakan ng Hebreo at nililinaw ng talababa nang hindi isinasara ang kahulugan.
  terminology: Ang “daong,” “bubong,” “pintuan,” “tagiliran,” at “palapag” ay angkop at magkakatugma. Ang “siko” ay wastong tradisyonal na katawagan para sa cubit. Wasto ring hindi ginawang mas tiyak ng “palapag” ang uri ng mga antas; ang alternatibong “mga antas” at “mga kubyerta” ay nasa talababa.
