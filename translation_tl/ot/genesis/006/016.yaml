base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/016.yaml
  text: You shall make a roof for the ark[a], and finish it to within a cubit from above. And you shall set the ark’s door in its side. You shall make it with lower, second[d][c][b], and third levels.
translation:
  language: tl
  text: Gumawa ka ng bubong para sa daong[a], at tapusin mo ito sa isang siko sa dakong itaas.[b] Maglagay ka ng pintuan ng daong sa tagiliran nito. Gawin mo itong may tatlong palapag—ang ibaba, ikalawa, at ikatlo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bintana” o “siwang na papasukan ng liwanag.” Bihira ang salitang Hebreo, kaya hindi tiyak kung tumutukoy ito sa buong bubong o sa isang bukasan sa itaas.
    reason: lexical_alternative
  - marker: b
    text: Mahirap unawain ang Hebreo. Maaaring inilalarawan nito ang pagkumpleto o pagpapakitid ng itaas ng daong hanggang sa sukat na isang siko.
    reason: textual_clarity
  - marker: c
    text: Maaari ring “mga antas” o “mga kubyerta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹהַר
  choice: bubong
  rationale: Bihira ang salitang Hebreo at hindi tiyak ang tinutukoy nito. Ang “bubong” ay angkop sa kontekstong pangkayarian at sa kasunod na tagubilin tungkol sa dakong itaas, habang pinananatili sa talababa ang mga posibilidad na “bintana” o “siwang na papasukan ng liwanag.”
- source_word: תֵּבָה
  choice: daong
  rationale: Ang “daong” ay natural at kinikilalang katawagan sa malaking sasakyang-dagat ni Noe, nang hindi ipinapalagay na karaniwang hugis-barko ito.
- source_word: וְאֶל־אַמָּה תְּכַלֶנָּה מִלְמַעְלָה
  choice: at tapusin mo ito sa isang siko sa dakong itaas
  rationale: 'Malapit itong sumusunod sa mahirap at hindi ganap na tiyak na pariralang Hebreo: ang Piel ng כלה ay “tapusin/kumpletuhin,” אֶל־אַמָּה ay “sa isang siko,” at מִלְמַעְלָה ay “sa dakong itaas.” Hindi nililinaw ng salin kung ang isang siko ay sukat ng siwang, taas, o huling lapad.'
- source_word: פֶּתַח
  choice: pintuan
  rationale: Sa tagubilin sa pagtatayo, ang “pintuan” ang pinakanatural na tawag sa bukasang pasukan, bagaman maaari rin itong literal na unawaing “bukasan.”
- source_word: בְּצִדָּהּ
  choice: sa tagiliran nito
  rationale: Tumutukoy ang parirala sa lokasyon ng pintuan sa isang gilid ng daong; malinaw at natural sa Filipino ang “sa tagiliran nito.”
- source_word: תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים
  choice: may tatlong palapag—ang ibaba, ikalawa, at ikatlo
  rationale: Inilalarawan ng mga anyong Hebreo ang mababa o ibabang palapag, ang ikalawa, at ang ikatlo. Ang “palapag” ay neutral at madaling maunawaan; ang bilang na tatlo ay malinaw na ipinahihiwatig ng talaan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang pautos na “Gumawa ka” bilang natural na katumbas ng direktang tagubilin. Pinanatili sa pangunahing teksto ang di-tiyak na sukat sa itaas at ipinaliwanag lamang ang posibleng kahulugan sa talababa.
