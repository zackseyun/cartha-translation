base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/003.yaml
  text: Then Yahweh said[a], “My Spirit will not contend with man forever, for he is flesh[c][b]; therefore his days will be one hundred and twenty years.”
translation:
  language: tl
  text: Sinabi ni Yahweh, “Ang aking Espiritu ay hindi makikipagtunggali sa tao[a][b] magpakailanman, sapagkat siya ay laman[c]; kaya ang kanyang mga araw ay magiging sandaan at dalawampung taon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ang aking Espiritu ay hindi mananatili sa tao magpakailanman” o “hindi mananahan sa tao magpakailanman.” Mahirap at pinagtatalunan ang kahulugan ng pandiwang Hebreo.
    reason: alternative_reading
  - marker: b
    text: Ang “tao” ay salin ng Hebreong adam, isang isahang salitang ginagamit dito para sa sangkatauhan sa kabuuan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin, “sapagkat siya rin ay laman.”
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: יָדוֹן
  choice: makikipagtunggali
  rationale: Mahirap at pinagtatalunan ang pandiwa. Ipinahahayag ng “makikipagtunggali” ang patuloy na pagsalungat o pagpigil ng Diyos, habang inilalahad sa talababa ang makabuluhang alternatibong “mananatili/mananahan.”
- source_word: רוּחִי
  choice: aking Espiritu
  rationale: Dahil ang nagsasalita ay ang Diyos at nasa unang panauhang paari ang salita, malamang na tumutukoy ito sa Espiritu ng Diyos, bagaman maaari ring mangahulugang hininga ang רוּחַ sa ibang konteksto.
- source_word: בָאָדָם
  choice: sa tao
  rationale: Ang אָדָם ay isahang pangngalang ginagamit dito para sa sangkatauhan sa kabuuan. Ang “sa tao” ay likas sa Filipino at naipapanatili ang isahang kolektibong anyo.
- source_word: לְעֹלָם
  choice: magpakailanman
  rationale: Karaniwan, malinaw, at marangal na katumbas ng temporal na parirala.
- source_word: בְּשַׁגַּם הוּא בָשָׂר
  choice: sapagkat siya ay laman
  rationale: Isinalin ang bihirang anyo bilang sanhi. Pinanatili ang “laman” upang huwag paliitin ang kahulugan sa “mortal” lamang; ang posibleng puwersa ng גַּם bilang “rin” ay nasa talababa.
- source_word: וְהָיוּ יָמָיו
  choice: kaya ang kanyang mga araw ay magiging
  rationale: Pinananatili ang larawan ng “mga araw” at ipinahahayag ang malamang na ugnayang bunga sa naunang pahayag, nang hindi tahasang pinipili kung ito ay haba ng buhay o palugit bago ang paghuhukom.
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: sandaan at dalawampung taon
  rationale: Buong baybay ang bilang upang umangkop sa marangal na estilong pampanitikan.
theological_decisions:
- issue: Kahulugan ng Espiritu ng Diyos kaugnay ng tao
  choice: “aking Espiritu,” sa pangkalahatang diwa ng Espiritu ng Diyos sa Lumang Tipan
  alternative: “aking hininga” o “aking hininga ng buhay”
  rationale: Pinapaboran ng banal na tagapagsalita at ng anyong paari ang “aking Espiritu,” ngunit hindi ipinapasok sa talata ang mas huling ganap na pormulasyong Trinitaryo.
- issue: Kahulugan ng יָדוֹן
  choice: “makikipagtunggali sa”
  alternative: “mananatili/mananahan sa”
  rationale: Tunay na hindi tiyak ang pandiwang Hebreo. Pinili sa pangunahing teksto ang diwa ng pakikipagtunggali, ngunit malinaw na pinanatili sa talababa ang alternatibong pagbasa.
- issue: Saklaw ng אָדָם
  choice: isahang kolektibong “tao” na kumakatawan sa sangkatauhan
  alternative: “sangkatauhan”
  rationale: Pinananatili ng “tao” ang isahang anyo ng Hebreo at natural itong maaaring tumukoy sa lahat ng tao sa Filipino.
- issue: Kahulugan ng sandaan at dalawampung taon
  choice: pinanatili ang literal na “mga araw” nang hindi nililinaw kung haba ng buhay o palugit
  alternative: “ang taning ng kanyang buhay” o “may 120 taon na lamang bago ang paghuhukom”
  rationale: Maaaring tumukoy ang pahayag sa haba ng buhay ng tao o sa nalalabing panahon bago ang baha. Hindi tahasang nilulutas ng salin ang tensiyong ito.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang pangalang “Yahweh,” ang konkretong salitang “laman,” at ang Hebreong larawang “mga araw.” Iniwasan ang mas interpretatibong “taning ng buhay” upang hindi lutasin ang ambiguwidad ng 120 taon.
