source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה אֶמְחֶ֨ה אֶת הָ/אָדָ֤ם אֲשֶׁר בָּרָ֨אתִי֙ מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה מֵֽ/אָדָם֙ עַד בְּהֵמָ֔ה עַד רֶ֖מֶשׂ וְ/עַד ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/007.yaml
  text: So Yahweh said[a], “I will blot out man, whom I have created[c], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I regret that I have made them[b].”
translation:
  language: tl
  text: Kaya sinabi ni Yahweh, “Papawiin ko mula sa ibabaw ng lupa ang sangkatauhang nilikha ko—mula sa tao hanggang sa mga alagang hayop, sa mga gumagapang na nilalang, at sa mga ibon sa langit—sapagkat pinagsisisihan kong ginawa ko sila.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang huling parirala na “sapagkat ikinalulungkot kong ginawa ko sila.” Ang Hebreong pandiwang נחם (Niphal) ay nagpapahayag ng pagsisisi, panghihinayang, o dalamhati tungkol sa isang naunang ginawa; hindi nito sa sarili nito sinasabing nagulat ang Diyos, wala siyang paunang kaalaman, o nagkamali siya sa moral.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, ayon sa karaniwang anyong ginagamit sa proyekto.
- source_word: אֶמְחֶה
  choice: Papawiin ko
  rationale: Ipinahahayag ng מחה ang pagpunas o lubos na pag-aalis; ang “papawiin” ay natural sa Filipino at nagpapanatili sa konkretong larawan ng pag-aalis mula sa ibabaw ng lupa.
- source_word: הָאָדָם
  choice: ang sangkatauhan
  rationale: Kolektibo rito ang אָדָם at tumutukoy sa lahi ng tao sa kabuuan. Mas malinaw ito sa modernong Filipino kaysa sa “ang tao” sa unang paglitaw.
- source_word: אֲשֶׁר בָּרָאתִי
  choice: na nilikha ko
  rationale: Direkta at natural na katumbas ng relative clause, habang malinaw na tumutukoy sa natapos na gawa ng paglikha.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: sa ibabaw ng lupa
  rationale: Natural na Filipino para sa Hebreong idyomang “mula sa ibabaw/mukha ng lupa”; ang pandiwang “papawiin” ay sapat nang nagpapahiwatig ng pag-aalis mula roon.
- source_word: מֵאָדָם עַד בְּהֵמָה עַד רֶמֶשׂ וְעַד עוֹף הַשָּׁמָיִם
  choice: mula sa tao hanggang sa mga hayop, sa mga gumagapang na nilalang, at sa mga ibon sa langit
  rationale: Pinananatili ang sunod-sunod na saklaw ng Hebreo. Ang “mga hayop” ay mas likas kaysa “mga alagang hayop” dito, at ang “mga gumagapang na nilalang” ay malinaw na katumbas ng רֶמֶשׂ.
- source_word: נִחַמְתִּי
  choice: pinagsisisihan ko
  rationale: Pinakamalapit na natural na Filipino sa retrospektibong pagsisisi o panghihinayang na ipinahahayag ng Niphal ng נחם. Hindi nito kusang ipinahihiwatig na nagulat ang Diyos, nagkulang sa kaalaman, o nagkamali sa moral.
- source_word: כִּי עֲשִׂיתִם
  choice: na ginawa ko sila
  rationale: Pinananatili ang tahasang pagtukoy sa naunang ginawang mga nilalang at ang pangmaramihang hulapi.
theological_decisions:
- issue: Ang pagsisisi ng Diyos sa נִחַמְתִּי
  choice: sapagkat pinagsisisihan kong ginawa ko sila
  alternative: sapagkat nalulungkot ako na ginawa ko sila / sapagkat ikinalulungkot kong ginawa ko sila
  rationale: Pinananatili ng “pinagsisisihan” ang retrospektibong lakas at teolohikal na tensiyon ng Hebreo sa halip na gawin lamang itong pangkalahatang kalungkutan. Hindi rin dinaragdagan ng salin ang teksto ng pahayag tungkol sa pagkagulat, kawalan ng paunang kaalaman, o moral na pagkakamali ng Diyos.
- issue: Kolektibong kahulugan ng הָאָדָם
  choice: ang sangkatauhan
  alternative: ang tao
  rationale: Malinaw na kolektibo ang unang paglitaw. Sa kasunod na talaan, “tao” ang likas na katapat at bahagyang pinananatili ang pag-uulit ng parehong salitang Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sangkatauhan” para linawin ang kolektibong unang אָדָם, ngunit “tao” sa kasunod na enumerasyon. Iniwasan ang mas lumang “mga hayop na gumagapang” kung saan maaaring lumabo ang kategorya, at pinili ang “mga gumagapang na nilalang.”
