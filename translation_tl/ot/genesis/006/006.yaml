  text: וַ/יִּנָּ֣חֶם יְהוָ֔ה כִּֽי עָשָׂ֥ה אֶת הָֽ/אָדָ֖ם בָּ/אָ֑רֶץ וַ/יִּתְעַצֵּ֖ב אֶל לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/006.yaml
  text: And Yahweh regretted having made man on the earth[c][b][a], and he was pained in his heart.
translation:
  language: tl
  text: At pinagsisihan ni Yahweh na ginawa niya ang sangkatauhan sa lupa[a][b], at nasaktan siya sa kanyang kalooban.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang tao.” Kolektibo rito ang Hebreong ’adam at tumutukoy sa buong sangkatauhan.
    reason: lexical_alternative
  - marker: b
    text: O “nalungkot dahil ginawa niya” o “naghinagpis dahil ginawa niya.” Ang Hebreong pandiwa ay nagpapahayag ng pagsisisi o dalamhati tungkol sa isang naunang ginawa; hindi nito mismo sinasabing nagulat ang Diyos, wala siyang paunang kaalaman, o nagkamali siya sa moral na paraan.
    reason: lexical_alternative
  - marker: c
    text: 'Mas literal: “sa kanyang puso.”'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: pinagsisihan
  rationale: Sa Niphal na sinusundan ng כִּי at ng naunang ginawa, ipinapahayag ng נחם ang paglingon na may pagsisisi o matinding dalamhati. Pinananatili ng “pinagsisihan” ang bigat at tensiyong nasa Hebreo, samantalang ang kasunod na pandiwa ang tahasang nagsasaad ng sakit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH bilang “Yahweh.”
- source_word: כִּי עָשָׂה
  choice: na ginawa niya
  rationale: Ipinakikilala ng כִּי ang nilalaman o dahilan ng pagsisisi, at malinaw sa Filipino na ang paggawa ay nauna sa reaksiyong inilalarawan.
- source_word: הָאָדָם
  choice: sangkatauhan
  rationale: Kolektibo rito ang אָדָם at tumutukoy sa buong lahi ng tao, hindi lamang sa indibidwal na si Adan.
- source_word: בָּאָרֶץ
  choice: sa lupa
  rationale: Sa konteksto, tumutukoy ito sa daigdig o lupa, hindi sa isang partikular na lupain.
- source_word: וַיִּתְעַצֵּב
  choice: nasaktan
  rationale: Ipinahihiwatig ng Hitpael ng עצב ang malalim at panloob na sakit; naiiba ito sa naunang retrospective regret.
- source_word: אֶל־לִבּוֹ
  choice: ang kanyang puso
  rationale: Sa natural na Filipino, ang konstruksyong “nasaktan ang kanyang puso” ay malinaw na nagpapahayag ng panloob na pagdurusa, bagaman literal na may pang-ukol na “sa/patungo sa” ang Hebreo.
theological_decisions:
- issue: Antropopatikong paglalarawan kay Yahweh bilang nagsisisi at nasasaktan
  choice: Panatilihin ang tuwirang pahayag na pinagsisihan ni Yahweh ang paglikha sa sangkatauhan at nasaktan ang kanyang puso.
  alternative: Nalungkot si Yahweh; nagbago ang pasiya ni Yahweh
  rationale: Hindi nilulutas ng salin ang tensiyon sa pagitan ng pahayag at ng mga tanong tungkol sa paunang kaalaman ng Diyos. Hindi rin sinasabi ng talata na nagulat siya o nagkamali sa moral.
- issue: Kolektibong kahulugan ng הָאָדָם
  choice: sangkatauhan
  alternative: tao; sangkatauhan bilang lahi ng tao
  rationale: Ang konteksto ay tumutukoy sa buong lahi ng tao; iniiwasan ng “sangkatauhan” ang maling pagbasa na ang tinutukoy ay si Adan lamang o isang lalaki.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “sangkatauhan” para sa kolektibong אָדָם at pinanatili ang dalawang magkaibang kilos sa Hebreo: pagsisisi/dalamhati, saka panloob na sakit.'
