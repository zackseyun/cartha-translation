  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הַ/נְּפִלִ֞ים הָי֣וּ בָ/אָרֶץ֮ בַּ/יָּמִ֣ים הָ/הֵם֒ וְ/גַ֣ם אַֽחֲרֵי כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽ/אֱלֹהִים֙ אֶל בְּנ֣וֹת הָֽ/אָדָ֔ם וְ/יָלְד֖וּ לָ/הֶ֑ם הֵ֧מָּה הַ/גִּבֹּרִ֛ים אֲשֶׁ֥ר מֵ/עוֹלָ֖ם אַנְשֵׁ֥י הַ/שֵּֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/004.yaml
  text: The Nephilim were on the earth in those days—and also afterward—when the sons of God came in to the daughters of man[a], and they bore children to them. Those were the mighty men who were of old[c][b], men of renown.
translation:
  language: tl
  text: Nasa lupa ang mga Nephilim[a] noong mga panahong iyon—at maging pagkatapos nito—nang sumiping ang mga anak ng Diyos[b] sa mga anak na babae ng tao[c], at nagkaanak ang mga babae sa kanila. Sila ang mga makapangyarihang lalaki noong unang panahon, mga lalaking bantog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayon sa tradisyon, “mga higante.” Bihira ang salitang Hebreo na “Nephilim,” at hindi tiyak ang eksaktong kahulugan nito.
    reason: alternative_reading
  - marker: b
    text: Ang “mga anak ng Diyos” ay maaari ring unawain bilang “mga nilalang na makalangit”; sa ibang mga pagpapakahulugan, sila ay mga pinunong tao o ang makadiyos na angkan ni Set.
    reason: alternative_reading
  - marker: c
    text: Ginamit dito ang “tao” sa kolektibong diwa, kaya ang tinutukoy ay mga babaeng kabilang sa sangkatauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִלִים
  choice: mga Nephilim
  rationale: Pinanatili ang transliterasyon sapagkat bihira ang salitang Hebreo at hindi tiyak ang eksaktong kahulugan nito. Ang pagsasaling “mga higante” o “mga bumagsak” ay magpapasya sa isang pinagtatalunang interpretasyon.
- source_word: בָאָרֶץ
  choice: sa lupa
  rationale: Sa konteksto ng sinaunang kasaysayan sa Genesis, mas likas ang malawak na kahulugang “lupa” kaysa “lupain.”
- source_word: בַּיָּמִים הָהֵם
  choice: noong mga panahong iyon
  rationale: Natural at malinaw na salin ng karaniwang pariralang tumutukoy sa panahong nagdaan.
- source_word: וְגַם אַחֲרֵי כֵן
  choice: at maging pagkatapos nito
  rationale: Pinananatili ang kapuwa pandagdag na diin ng וְגַם at ang temporal na diwa ng אַחֲרֵי כֵן.
- source_word: אֲשֶׁר יָבֹאוּ ... אֶל
  choice: nang sumiping ... sa
  rationale: Ginamit ang “nang” upang ipakita ang ugnayang temporal o pangyayari; ang “sumiping sa” ay isang likas at marangal na idyomang Filipino para sa seksuwal na diwa ng parirala nang hindi nagdaragdag ng paliwanag.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: mga anak ng Diyos
  rationale: Pormal na malapit sa Hebreo at pinananatiling bukás ang pagkakakilanlan ng tinutukoy sa halip na ipakahulugan agad bilang mga anghel, pinuno, o isang makadiyos na angkan.
- source_word: בְּנוֹת הָאָדָם
  choice: mga anak na babae ng tao
  rationale: Pinananatili ang isahang kolektibong gamit ng אָדָם; nililinaw sa talababa na tumutukoy ito sa sangkatauhan.
- source_word: וְיָלְדוּ לָהֶם
  choice: nagkaanak ang mga babae sa kanila
  rationale: Natural na Filipino na nagpapahayag ng ipinahihiwatig na panganganak ng mga anak at malinaw na iniuugnay ang mga babae sa naunang parirala.
- source_word: הֵמָּה הַגִּבֹּרִים
  choice: Sila ang mga makapangyarihang lalaki
  rationale: Pinananatili ang resumptibong panghalip at ang malawak na diwa ng גִּבּוֹר nang hindi ito nililimitahan sa “mandirigma” o pinapaganda bilang “bayani.”
- source_word: אֲשֶׁר מֵעוֹלָם
  choice: noong unang panahon
  rationale: Likas na Filipino para sa pahayag na tumutukoy sa sinaunang panahon.
- source_word: אַנְשֵׁי הַשֵּׁם
  choice: mga lalaking bantog
  rationale: Idyomatikong ipinapahayag ang reputasyon o katanyagan na taglay ng literal na pariralang “mga lalaki ng pangalan.”
theological_decisions:
- issue: Pagkakakilanlan ng “mga anak ng Diyos”
  choice: Pinanatili ang literal na pariralang “mga anak ng Diyos” nang walang interpretatibong pagpapalawak.
  alternative: “mga nilalang na makalangit,” mga pinunong tao, o makadiyos na angkan ni Set
  rationale: Hindi tiyak sa kontekstong ito ang tinutukoy ng pariralang Hebreo. Dapat panatilihin ng salin ang tunay na teolohikal na tensiyon sa halip na lutasin ang pinagtatalunang pakahulugan.
- issue: Kahulugan ng הַנְּפִלִים
  choice: Isinalin sa pamamagitan ng transliterasyong “Nephilim.”
  alternative: “mga higante” o “mga bumagsak”
  rationale: Hindi tiyak at pinagtatalunan ang kahulugan ng salita. Iniiwasan ng transliterasyon ang pagpasok ng isang partikular na tradisyon sa pangunahing teksto.
- issue: Kahulugan ng אָדָם sa “mga anak na babae ng tao”
  choice: Ginamit ang “tao” sa kolektibong diwa.
  alternative: “sangkatauhan” o “mga lalaki”
  rationale: Pinananatili nito ang isahang kolektibong anyo ng Hebreo habang nililinaw sa talababa ang saklaw nito.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang mga susing pariralang may tunay na kalabuan, samantalang ginawang natural sa Filipino ang sintaks at ang idyomang seksuwal.
