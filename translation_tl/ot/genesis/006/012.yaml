  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/אָ֖רֶץ וְ/הִנֵּ֣ה נִשְׁחָ֑תָה כִּֽי הִשְׁחִ֧ית כָּל בָּשָׂ֛ר אֶת דַּרְכּ֖/וֹ עַל הָ/אָֽרֶץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/012.yaml
  text: And God saw the earth[a], and behold, it was corrupted[b], because all flesh had corrupted its way on the earth.
translation:
  language: tl
  text: At nakita ng Diyos ang lupa; narito, nasira na ito[a], sapagkat sinira ng lahat ng laman[b] ang kani-kanilang landas sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo ay maaaring tumukoy kapuwa sa katiwaliang moral at sa pagkasira o pagkawasak.
    reason: lexical_alternative
  - marker: b
    text: Literal na “lahat ng laman.” Ito ay idyomang Hebreo na maaaring tumukoy sa sangkatauhan o, ayon sa konteksto, sa mga nilalang na may buhay.
    reason: idiom_and_scope
lexical_decisions:
- source_word: וַיַּרְא
  choice: nakita
  rationale: Tuwirang katumbas ng ראה at angkop sa payak na daloy ng salaysay.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tumutukoy rito sa iisang Diyos at ito ang likas na salin sa Tagalog.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Ang mas malawak na konteksto ng baha ang pumapabor sa buong lupa kaysa sa isang tiyak na lupain.
- source_word: וְהִנֵּה
  choice: at narito
  rationale: Pinananatili nito ang biglang pagtawag-pansin at maringal na himig ng הִנֵּה.
- source_word: נִשְׁחָתָה
  choice: nasira na
  rationale: Sinasaklaw ng “nasira” ang pagkabulok sa moral at ang bunga nitong pagkawasak, nang hindi nililimitahan ang Hebreo sa isa lamang sa mga diwang ito.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng naunang kalagayan.
- source_word: הִשְׁחִית
  choice: sinira
  rationale: 'Pinananatili ang pag-uulit ng ugat na שׁחת at ang sanhiang diwa ng Hiphil: ang lahat ng may buhay ang nagdala ng pagkasira sa kanilang landas.'
- source_word: כָּל בָּשָׂר
  choice: lahat ng may buhay
  rationale: Likas at nauunawaang Tagalog para sa Hebreong idyomang “lahat ng laman,” habang hindi ito tahasang nililimitahan sa sangkatauhan lamang.
- source_word: דַּרְכּוֹ
  choice: ang kani-kanilang landas
  rationale: Pinananatili ng “landas” ang talinghaga ng דֶּרֶךְ, at ipinahahayag ng “kani-kanilang” ang distributibong diwa ng pang-isahang hulapi kasunod ng kolektibong parirala.
- source_word: עַל הָאָרֶץ
  choice: sa lupa
  rationale: Natural na Tagalog at angkop sa malawak na konteksto ng salaysay tungkol sa baha.
theological_decisions:
- issue: Diwang semantiko ng שׁחת sa dalawang sugnay
  choice: “nasira” at “sinira”
  alternative: “nabulok” at “pinasama,” o “nawasak” at “winasak”
  rationale: Ang “sira” ay maaaring tumukoy kapuwa sa moral na katiwalian at sa nagbunga nitong pagkawasak. Pinananatili rin nito ang mahalagang pag-uulit ng iisang ugat sa Hebreo nang hindi tahasang nilulutas ang tensiyon.
- issue: Saklaw ng כָּל בָּשָׂר
  choice: “lahat ng may buhay” sa teksto, na may literal na anyo sa talababa
  alternative: “buong sangkatauhan” o “bawat nilalang”
  rationale: Hindi nililimitahan ng salin ang parirala sa mga tao lamang ni tahasang ipinapasiya na kabilang ang bawat uri ng hayop; nananatiling bukas ang lawak ayon sa konteksto.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ang “at narito” ay sadyang pinanatili upang ihatid ang mariing pagtawag-pansin ng Hebreo; ang “landas” ay isang malinaw at pamilyar na talinghaga para sa asal o paraan ng pamumuhay.
