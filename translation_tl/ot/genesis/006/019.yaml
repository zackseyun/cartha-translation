  text: And from every living thing of all flesh[a], you shall bring two of each into the ark to keep them alive with you[b]; they shall be male and female.
translation:
  language: tl
  text: At mula sa bawat nilalang na may buhay[a]—mula sa lahat ng may laman[b]—magdala ka ng tigdalawa sa loob ng arka upang mapanatili silang buhay na kasama mo; lalaki at babae ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “bawat nilalang na buháy.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “lahat ng laman,” isang idyoma para sa mga nilalang na may buhay at katawang laman.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִכָּל הַחַי
  choice: At mula sa bawat nabubuhay na nilalang
  rationale: Pinananatili nito ang pang-ugnay, ang diwang pamamahagi ng מִכָּל, at ang malawak na kahulugan ng הַחַי sa likas na makabagong Tagalog.
- source_word: מִכָּל בָּשָׂר
  choice: mula sa lahat ng may laman
  rationale: Ipinahahayag nito ang idyomang Hebreo tungkol sa mga nilalang na may katawang laman nang hindi ito napagkakamalang tumutukoy sa karneng pagkain.
- source_word: שְׁנַיִם מִכֹּל
  choice: tigdalawa
  rationale: Likas na ipinahahayag ng “tigdalawa” ang distributibong diwa ng pagkuha ng dalawa mula sa bawat kabilang sa tinutukoy, nang hindi nagdaragdag ng salitang “uri,” na wala sa talata.
- source_word: תָּבִיא אֶל הַתֵּבָה
  choice: magpasok ka sa arka
  rationale: Ang Hiphil na pandiwa sa konteksto ng utos ay malinaw na naipapahayag ng “magpasok ka,” at ang “sa arka” ay nagpapakita ng pagpasok sa sasakyang-dagat.
- source_word: לְהַחֲיֹת אִתָּךְ
  choice: upang mapanatili silang buhay kasama mo
  rationale: Ang “mapanatili silang buhay” ay kumakatawan sa causative na diwa ng Hiphil infinitive, samantalang tuwirang pinananatili ng “kasama mo” ang accompaniment ng אִתָּךְ.
- source_word: זָכָר וּנְקֵבָה יִהְיוּ
  choice: lalaki at babae ang mga iyon
  rationale: Direkta nitong ipinahahayag ang biyolohikal na pares at ang kinakailangang komposisyon ng bawat dalawa sa natural na Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tigdalawa” upang mapanatili ang distributibong diwa nang hindi ipinapasok ang salitang “uri,” at pinanatili sa pangunahing teksto at talababa ang malawak na idyomang “lahat ng laman.”
