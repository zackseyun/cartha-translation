revisions:
- from: At mula sa bawat nabubuhay na nilalang[a]—mula sa lahat ng may laman[b]—magpasok ka sa arka ng tigdalawa upang mapanatili silang buhay kasama mo; lalaki at babae ang mga iyon.
  to: At mula sa bawat nilalang na may buhay[a]—mula sa lahat ng may laman[b]—magdala ka ng tigdalawa sa loob ng arka upang mapanatili silang buhay na kasama mo; lalaki at babae ang mga iyon.
  rationale: Inayos ang pananalita upang maging mas malinaw at likas sa modernong Tagalog ang utos na dalhin ang tigdalawang nilalang papasok sa arka. Pinanatili ang pag-uulit na “mula sa” at ang “lahat ng may laman” upang igalang ang estruktura at idyomatikong lawak ng Hebreo, kasama ang angkop na talababa.
