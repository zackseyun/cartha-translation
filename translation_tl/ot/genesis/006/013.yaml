  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים לְ/נֹ֗חַ קֵ֤ץ כָּל בָּשָׂר֙ בָּ֣א לְ/פָנַ֔/י כִּֽי מָלְאָ֥ה הָ/אָ֛רֶץ חָמָ֖ס מִ/פְּנֵי/הֶ֑ם וְ/הִנְ/נִ֥י מַשְׁחִיתָ֖/ם אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/013.yaml
  text: Then God said to Noah[a], “The end of all flesh has come before me, for the earth is filled with violence because of them. And behold[d][c][b], I am about to destroy them with the earth.”
translation:
  language: tl
  text: At sinabi ng Diyos kay Noe, “Dumating na sa harap ko ang wakas ng lahat ng nilalang na may buhay, sapagkat napuno ng karahasan ang lupa[a] dahil sa kanila. At narito, lilipulin ko na sila kasama ng lupa.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lupain.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, mahirap ang pagkakabuo: karaniwang pananda ng tuwirang layon ang salita bago ang “lupa,” kahit na may “sila” nang layon ang pandiwa. Maaari itong unawain na “lilipulin ko sila at ang lupa,” o “lilipulin ko sila kasama ng lupa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: קֵץ
  choice: wakas
  rationale: Tuwirang ipinahahayag ang pagtatapos o pagkalipol na itinakda sa paghuhukom, nang hindi dinaragdagan ang di-tiyak na artikulong wala namang katumbas na likas sa Tagalog.
- source_word: כָּל בָּשָׂר
  choice: lahat ng may laman
  rationale: Pinananatili ang malawak at kongkretong idyomang Hebreo, na sa salaysay ng baha ay hindi lamang tumutukoy sa sangkatauhan kundi sumasaklaw sa mga nilalang na may buhay.
- source_word: בָּא לְפָנַי
  choice: dumating na sa harap ko
  rationale: Pinananatili ang larawang Hebreo at ang pahiwatig na ang usapin ay iniharap na sa Diyos para sa paghatol.
- source_word: חָמָס
  choice: karahasan
  rationale: Ito ang pinakadirekta at angkop na kahulugan sa konteksto ng malupit at tiwaling kalagayan bago ang baha.
- source_word: מִפְּנֵיהֶם
  choice: dahil sa kanila
  rationale: 'Likas na Tagalog para sa sanhi o pananagutan: napuno ang lupa ng karahasan dahil sa kanila.'
- source_word: וְהִנְנִי מַשְׁחִיתָם
  choice: At narito, lilipulin ko na sila
  rationale: Ang “narito” ay nagpapanatili sa mariing pagpapakilala ng gagawin ng Diyos, at ang “na” kasama ng aspektong panghinaharap ay nagpapahiwatig ng nalalapit na pagkilos.
- source_word: אֶת הָאָרֶץ
  choice: kasama ng lupa
  rationale: Ipinahahayag nito na kasama ang lupa sa paglipol, habang iniiwasan ang maling pahiwatig na ginamit ang lupa bilang instrumento. Inilalahad sa talababa ang mahirap at posibleng ibang pagbasa ng sintaks.
theological_decisions:
- issue: Saklaw ng “lahat ng may laman”
  choice: Malawak na katawagang sumasaklaw sa mga nilalang na may buhay, hindi lamang sa mga tao.
  alternative: Lahat ng sangkatauhan lamang.
  rationale: Sa kabuuan ng salaysay ng baha, ang pariralang Hebreo ay ginagamit nang mas malawak kaysa sa sangkatauhan lamang; hindi ito artipisyal na pinakikitid ng salin.
- issue: Kahulugan ng הָאָרֶץ
  choice: lupa
  alternative: lupain
  rationale: Ang “lupa” ay likas sa Tagalog at umaangkop sa malawak na saklaw ng salaysay, ngunit pinananatili sa talababa ang posibleng kahulugang “lupain.”
- issue: Ugnayan ng “sila” at “ang lupa” sa paglipol
  choice: Lilipulin sila kasama ng lupa.
  alternative: Lilipulin sila at ang lupa; o lilipulin sila sa pamamagitan ng lupa.
  rationale: Mahirap ang konstruksyong Hebreo sapagkat may pananda ng tuwirang layon bago ang “lupa” matapos ang panghalip na layon. Ang pangunahing salin ay nagpapakita ng magkasamang saklaw ng paghuhukom ngunit hindi ikinukubli ang sintaktikong tensiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang biblikal na idyomang “lahat ng may laman” at “dumating sa harap ko,” habang ginawang malinaw at natural ang sanhi at ang nalalapit na paghatol.
