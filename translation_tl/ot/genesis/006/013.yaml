  source_fidelity: 'Tumpak ang pangunahing diwa ng Hebreo: ipinahayag ng Diyos kay Noe ang nalalapit na wakas, ang karahasang pumuno sa lupa dahil sa kanila, at ang paglipol na sasaklaw sa kanila at sa lupa. Ang “kasama ng lupa” ay isang maingat na pagbasa ng mahirap na pangwakas na sintaks at hindi nagpapahiwatig na instrumento ang lupa.'
  naturalness: Ang “lahat ng may laman” ay masyadong literal at hindi likas sa makabagong Filipino; maaari pa itong maunawaang mga bagay na may nilalaman. Ang “lahat ng nilalang na may buhay” ay malinaw, natural, at pinananatili ang malawak na saklaw ng כָּל־בָּשָׂר sa konteksto ng baha.
  terminology: 'Ang “Diyos,” “Noe,” “wakas,” “karahasan,” at “lilipulin” ay angkop sa marangal ngunit modernong rehistro. Ang talababa b ay kailangang itama: ang אֶת ay hindi literal na nangangahulugang “at/kasama ng” kundi karaniwang pananda ng tuwirang layon; ang kahirapan ay nasa gamit nito pagkatapos ng panghalip na layon.'
