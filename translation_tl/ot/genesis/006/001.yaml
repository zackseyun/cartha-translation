base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/001.yaml
  text: And it happened[a], when man began to multiply on the face of the ground, and daughters were born to them,
translation:
  language: tl
  text: At nang magsimulang dumami ang mga tao[a] sa ibabaw ng lupa at isinilang sa kanila ang mga anak na babae,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang sangkatauhan.” Pang-isahan sa Hebreo ang הָאָדָם ngunit kolektibo ang kahulugan nito rito, na tumutukoy sa lahat ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: At nang
  rationale: Ang tambalang pambungad na ito ay naghahayag ng sumunod na pangyayari sa salaysay at nagpapakilala ng sugnay na panahunan. Ang “At nang” ang natural na katumbas sa modernong Tagalog nang hindi gumagamit ng mabigat o makalumang “at nangyari na nang.”
- source_word: הֵחֵל
  choice: magsimulang
  rationale: Ipinapahayag ng anyong ito ang pagsisimula ng kilos at natural itong ikinakabit sa “dumami.”
- source_word: הָאָדָם
  choice: ang mga tao
  rationale: Bagaman pang-isahan ang anyong Hebreo, kolektibo ang gamit nito rito at tumutukoy sa sangkatauhan sa pangkalahatan, hindi lamang sa mga lalaki o sa indibidwal na si Adan.
- source_word: לָרֹב
  choice: dumami
  rationale: Tumutukoy ito sa pagdami ng bilang ng populasyon; maikli at likas sa Tagalog ang “dumami.”
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sa ibabaw ng lupa
  rationale: Pinananatili nito ang larawang “ibabaw” at ang mas tiyak na kahulugan ng אֲדָמָה bilang lupa o ground.
- source_word: וּבָנוֹת
  choice: at ... ang mga anak na babae
  rationale: Tuwirang katumbas ang “mga anak na babae” at inihahanda nito ang paksa ng kasunod na talata.
- source_word: יֻלְּדוּ לָהֶם
  choice: maisilang sa kanila
  rationale: Pinananatili ng “maisilang” ang pasibong anyo at ng “sa kanila” ang ugnayang ipinapahayag ng Hebreong לָהֶם.
theological_decisions:
- issue: Kolektibong kahulugan ng הָאָדָם
  choice: ang mga tao
  alternative: ang sangkatauhan
  rationale: Ang הָאָדָם ay pang-isahan sa gramatika ngunit kolektibo sa kontekstong ito. Ang “ang mga tao” ay malinaw, likas, at hindi nagbibigay ng maling pahiwatig na mga lalaki lamang ang tinutukoy; inilalagay sa talababa ang mas pormal na “sangkatauhan.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “At nang” upang natural na maipahayag ang Hebreong pambungad sa salaysay, at pinanatili ang di-natapos na daloy ng pangungusap dahil nagpapatuloy ang diwa sa susunod na talata.
