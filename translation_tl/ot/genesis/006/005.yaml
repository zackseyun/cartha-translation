  rationale: Pinalitan lamang ang “mga iniisip” ng “mga kaisipan” upang maging mas natural na Tagalog ang nominal na parirala at mapanatili ang kahulugan ng Hebreong מַחְשְׁבֹת. Walang binago sa saklaw, diin, o teolohikal na kahulugan ng talata.
