  text: וַ/יַּ֣רְא יְהוָ֔ה כִּ֥י רַבָּ֛ה רָעַ֥ת הָ/אָדָ֖ם בָּ/אָ֑רֶץ וְ/כָל יֵ֨צֶר֙ מַחְשְׁבֹ֣ת לִבּ֔/וֹ רַ֥ק רַ֖ע כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/005.yaml
  text: And Yahweh saw that the wickedness of man was great on the earth[b][a], and that every inclination of the thoughts of his heart was only evil all the day.
translation:
  language: tl
  text: At nakita ni Yahweh na napakalubha ang kasamaan ng sangkatauhan sa lupa, at ang bawat hilig ng mga kaisipan ng kanilang puso ay pawang masama sa buong maghapon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “patuloy na masama.” Literal sa Hebreo: “pawang masama sa buong araw.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: At nakita
  rationale: Pinananatili nito ang pagsulong ng salaysay na ipinahihiwatig ng wayyiqtol, sa natural na paraan sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: רַבָּה רָעַת הָאָדָם
  choice: napakalubha ng kasamaan ng sangkatauhan
  rationale: Ang רַבָּה ay nagsasaad ng matinding lawak o antas, at ang רָעָה rito ay moral na kasamaan. Ang הָאָדָם ay kolektibong tumutukoy sa buong sangkatauhan.
- source_word: בָּאָרֶץ
  choice: sa lupa
  rationale: Sa konteksto ng sinaunang kasaysayan, malawak ang saklaw nito at hindi isang tiyak na lupain lamang.
- source_word: יֵצֶר
  choice: hilig
  rationale: Ipinahihiwatig ng salita ang nabubuong udyok, disposisyon, o pagkiling ng kalooban; natural at maikli ang “hilig” sa Tagalog.
- source_word: מַחְשְׁבֹת לִבּוֹ
  choice: mga iniisip ng kanilang puso
  rationale: Pinananatili ang Hebreong paglalarawan sa puso bilang sentro ng pag-iisip, pagnanais, at pagpapasya, habang inaangkop ang kolektibong reperensiya sa natural na Tagalog.
- source_word: רַק רַע כָּל הַיּוֹם
  choice: pawang masama sa buong maghapon
  rationale: Pinananatili ang matinding limitasyon ng רַק at ang literal na pangpanahong pahayag na “buong araw,” nang hindi ito tahimik na ginagawang abstraktong “palagi.”
theological_decisions:
- issue: Pagtutumbas sa יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ang tekstong pinagmulan ay may personal na pangalang YHWH; pinananatili ito upang hindi mapalitan ng titulong wala sa anyong Hebreo.
- issue: Kolektibong kahulugan ng הָאָדָם
  choice: sangkatauhan
  alternative: tao
  rationale: Dito ang אָדָם ay tumutukoy sa lahi ng tao sa kabuuan. Ang “sangkatauhan” ay malinaw, natural, at hindi nagpapahiwatig na isang indibidwal o mga lalaki lamang ang tinutukoy.
- issue: Bilang ng panghalip sa לִבּוֹ
  choice: kanilang puso
  alternative: kanyang puso
  rationale: Isahan ang anyong Hebreo dahil kolektibong isahan ang הָאָדָם. Ginamit ang maramihang panghalip sa Tagalog upang luminaw na lahat ng sangkatauhan ang tinutukoy, habang pinananatili ang kolektibong “puso.”
- issue: Saklaw ng כָּל הַיּוֹם
  choice: sa buong maghapon
  alternative: palagi
  rationale: Ang literal na temporal na larawan ay pinanatili sa pangunahing teksto; ang posibleng idiomatikong diwang “patuloy” ay inilagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “napakalubha” upang natural na maipahayag ang tindi ng רַבָּה, at pinanatili ang biblikal na larawan ng “puso.”
