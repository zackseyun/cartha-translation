base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/014.yaml
  text: Make yourself an ark of gopher wood[a]; make rooms in the ark[c][b], and cover it inside and outside with pitch.
translation:
  language: tl
  text: Gumawa ka para sa iyong sarili ng isang daong mula sa kahoy na gofer[a]. Lagyan mo ng mga silid[b] ang daong, at balutan mo ito sa loob at labas ng alkitran[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kahoy na sipres.” Minsan lamang lumilitaw sa Hebreo ang salitang “gofer,” kaya hindi tiyak ang eksaktong uri ng kahoy.
    reason: lexical_alternative
  - marker: b
    text: O “mga kompartimento”; literal na “mga pugad.”
    reason: lexical_alternative
  - marker: c
    text: O “pahiran” o “selyuhan” ito “ng bitumen o alkitran.” Magkaugnay ang mga salitang Hebreo para sa pagbabalot at sa materyal na ipinambabalot.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּבַת
  choice: daong
  rationale: Sa salaysay ng baha, ang תֵּבָה ay isang malaking sasakyang pantubig ngunit naiiba sa karaniwang salitang Hebreo para sa barko. Ang “daong” ay likas at marangal na katawagan sa Filipino at nagpapanatili ng kinikilalang reperente sa Genesis 6–9.
- source_word: עֲצֵי גֹפֶר
  choice: kahoy na gofer
  rationale: Minsan lamang lumilitaw sa Hebreong Biblia ang גֹפֶר, kaya hindi tiyak ang uri ng kahoy. Pinanatili ang transliterasyong “gofer” sa halip na pumili ng isang di-tiyak na espesye gaya ng sipres.
- source_word: קִנִּים
  choice: mga silid
  rationale: Ang literal na kaugnay na kahulugan ay “mga pugad,” ngunit sa konteksto ay tumutukoy ito sa mga hinating espasyo sa loob ng daong. Ang “mga silid” ay malinaw at natural; inilalahad sa talababa ang mas teknikal na “mga kompartimento” at ang literal na larawan.
- source_word: וְכָפַרְתָּ
  choice: balutan mo
  rationale: Sa di-kultikong kontekstong ito, ang pandiwa ay nangangahulugang pahiran o balutan. Ang “balutan” ay malapit sa diwa ng pagtatakip at hindi tahasang nagpapasok ng layuning “hindi pasukin ng tubig,” bagaman ipinahihiwatig iyon ng materyal.
- source_word: בַּכֹּפֶר
  choice: ng alkitran
  rationale: Dito ang כֹּפֶר ay pantapal o pambalot na materyal. Ang “alkitran” ay karaniwang nauunawaang Filipino na katumbas ng pitch/tar; dahil hindi lubos na tiyak ang eksaktong sangkap, binanggit sa talababa ang bitumen bilang alternatibo.
- source_word: מִבַּיִת וּמִחוּץ
  choice: sa loob at labas
  rationale: Natural na Filipino itong naghahayag na kapuwa ang panloob at panlabas na bahagi ng daong ay babalutan.
- source_word: עֲשֵׂה לְךָ
  choice: Gumawa ka para sa iyong sarili
  rationale: Malinaw na ipinahahayag nito ang imperatibo at ang לְךָ (“para sa iyong sarili”) nang hindi pinakikitid ang pangkalahatang pandiwang עשה tungo sa “magtayo.”
- source_word: תַּעֲשֶׂה אֶת־הַתֵּבָה
  choice: Lagyan mo ng mga silid ang daong
  rationale: Ang di-karaniwang ayos na literal na “mga pugad ay gagawin mo ang daong” ay likas na ipinapahayag sa Filipino bilang paglalagay ng mga silid sa daong.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “daong,” isang pamilyar na katawagang biblikal ngunit nauunawaan pa rin ngayon. Pinanatili ang di-tiyak na “gofer” at ipinaliwanag sa talababa; iniwasang gawing mas tiyak kaysa sa Hebreo ang uri ng kahoy at sangkap ng pantapal.
