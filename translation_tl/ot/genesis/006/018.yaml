  text: But I will establish my covenant with you[a], and you shall enter the ark—you, your sons, your wife, and your sons’ wives with you.
translation:
  language: tl
  text: Ngunit pagtitibayin ko ang aking tipan sa iyo[a]. Papasok ka sa arka—ikaw, ang iyong mga anak na lalaki, ang iyong asawa, at ang mga asawa ng iyong mga anak na lalaki, kasama mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itatatag ko ang aking tipan sa iyo.” Maaaring taglayin ng pandiwang Hebreo ang alinmang diwa sa mga konteksto ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Ngunit pagtitibayin ko
  rationale: Ang Hiphil ng קום kasama ng בְּרִית ay maaaring mangahulugang magtatag o magpatibay ng tipan. Ang “pagtitibayin” ay natural sa Filipino at hindi kinakailangang magpasya kung ito ay unang pagtatatag o pagkumpirma; ang “ngunit” ay naghahayag ng kaibahan sa naunang hatol ng paglipol.
- source_word: בְּרִיתִי
  choice: ang aking tipan
  rationale: Ang “tipan” ang karaniwan at angkop na salin ng בְּרִית at pinananatili ang kabuluhang teolohikal nito.
- source_word: אִתָּךְ
  choice: sa iyo / kasama mo
  rationale: Sa unang paglitaw, ang parirala ay tumutukoy sa kaugnayan sa tipan at likas isaling “sa iyo”; sa hulihan, tumutukoy ito sa pagsama at isinasangkot sa talaan ng mga papasok.
- source_word: וּבָאתָ
  choice: Papasok ka
  rationale: Ang בוא ay maaaring ‘pumarito,’ ‘pumunta,’ o ‘pumasok’; dahil ang הַתֵּבָה ang patutunguhan, “papasok” ang pinakamalinaw at pinakanatural.
- source_word: הַתֵּבָה
  choice: malaking sasakyang-dagat
  rationale: Sa salaysay ni Noe, ang תֵּבָה ay isang malaki at nakalutang na sisidlan. Ang pariralang ito ay madaling maunawaan ng karaniwang modernong mambabasa at umiiwas sa di-likas o malabong hiram na katawagan.
- source_word: אַתָּה
  choice: ikaw
  rationale: Pinananatili sa kasunod na talaan ang diin ng hiwalay na panghalip sa Hebreo.
- source_word: וּבָנֶיךָ
  choice: ang iyong mga anak na lalaki
  rationale: Tiyak na ‘mga anak na lalaki’ ang בָּנִים dito, hindi pangkalahatang ‘mga anak.’
- source_word: וְאִשְׁתְּךָ
  choice: ang iyong asawa
  rationale: Likas at tuwirang salin sa kontekstong pampamilya.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: ang mga asawa ng iyong mga anak na lalaki
  rationale: Malapit ito sa literal na anyo ng construct phrase at hindi gumagamit ng mas interpretibong “mga manugang na babae.”
theological_decisions:
- issue: Kung ang tipan ay itinatatag sa unang pagkakataon o pinagtitibay
  choice: pagtitibayin ko ang aking tipan sa iyo
  alternative: itatatag ko ang aking tipan sa iyo
  rationale: Maaaring taglayin ng pandiwang Hebreo ang alinmang diwa sa konteksto ng tipan. Hindi tahasang nilulutas ng talata kung bagong tipan ito o pagpapatibay ng isang naunang banal na pangako, kaya pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang malinaw na mga katawagang pampamilya at ang em dash upang likas na maipakita ang idinidiing talaan sa Hebreo.
