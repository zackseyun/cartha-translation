  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נֹ֕חַ מָ֥צָא חֵ֖ן בְּ/עֵינֵ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/008.yaml
  text: But Noah found favor in the eyes of Yahweh[a].
translation:
  language: tl
  text: Ngunit nakasumpong si Noe ng lingap sa paningin ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At nakasumpong si Noe ng biyaya sa paningin ni Yahweh.”
    reason: Ipinapakita ang lehitimong alternatibo para sa וְ bilang “At” at para sa חֵן bilang “biyaya.”
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: Ngunit … si Noe
  rationale: Maaaring mangahulugan ang וְ na “at,” ngunit ipinahihiwatig dito ng konteksto ang pagsalungat sa naunang pahayag tungkol sa kasamaan at paghatol. Likas sa modernong Tagalog ang “Ngunit” para ihayag ang kontrast na iyon.
- source_word: מָצָא
  choice: nakasumpong
  rationale: Karaniwang kahulugan ng מָצָא ang “makasumpong” o “makatagpo.” Pinananatili ng “nakasumpong” ang Hebreong idyomang “nakasumpong ng lingap.”
- source_word: חֵן
  choice: lingap
  rationale: Maaaring tumukoy ang חֵן sa lingap, pabor, o biyaya. Ang “lingap” ay malinaw na nagpapahayag ng mabuting pagtanggap ni Yahweh kay Noe nang hindi agad ikinukulong ang salita sa isang mas huling teknikal na gamit ng “biyaya.”
- source_word: בְּ/עֵינֵי
  choice: sa paningin ni
  rationale: Pinananatili nito ang talinghaga ng Hebreong idyoma at likas din itong nauunawaan sa Tagalog bilang “ayon sa pagtingin o paghatol ni.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na banal na pangalang יהוה bilang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Kahulugan ng חֵן kaugnay ng pakikitungo ng Diyos kay Noe
  choice: lingap
  alternative: biyaya
  rationale: Pinananatili ng “lingap” ang malawak na diwa ng mabuting pagtanggap o pabor ni Yahweh at hindi sapilitang naglalapat ng mas teknikal na teolohikal na kahulugan. Inilalagay sa talababa ang “biyaya” bilang tunay na alternatibo.
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tuwirang ginagamit sa tekstong Hebreo, kaya pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Ugnayan ng וְ sa naunang konteksto
  choice: Ngunit
  alternative: At
  rationale: Bagaman karaniwang “at” ang וְ, malinaw na itinatangi ng talata si Noe mula sa sangkatauhang nasa ilalim ng paghatol. Ipinahahayag ng “Ngunit” ang kontekstuwal na kontrast nang hindi dinaragdagan ang nilalaman.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong idyomang “nakasumpong … ng lingap sa paningin” dahil malinaw ito sa Tagalog at inilalapit ang mambabasa sa anyo ng orihinal.
