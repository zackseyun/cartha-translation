translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kani-kanilang” upang natural na ipakita ang distributibong diwa ng maramihang mga pangkat, habang iniwasang ipakahulugan ang מִין bilang teknikal na modernong species.
