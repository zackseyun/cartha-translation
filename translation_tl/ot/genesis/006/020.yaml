base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/020.yaml
  text: From the birds according to their kinds[a], and from the livestock according to their kinds, from every creeping thing of the ground according to its kind, two of each will come to you to keep them alive.
translation:
  language: tl
  text: Mula sa mga ibon ayon sa kani-kanilang uri[a], mula sa mga alagang hayop ayon sa kani-kanilang uri, at mula sa bawat gumagapang na hayop sa lupa ayon sa uri nito, dalawa mula sa bawat uri ang darating sa iyo upang panatilihin silang buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “batay sa kani-kanilang uri.” Pareho nitong ipinapahayag ang pangunahing diwa ng לְמִין.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעוֹף
  choice: mga ibon
  rationale: Ang עוֹף ay tumutukoy sa mga nilalang na lumilipad, at sa kontekstong ito ang “mga ibon” ang pinakanatural at malinaw na kategorya sa modernong Tagalog.
- source_word: לְמִינֵהוּ / לְמִינָהּ
  choice: ayon sa kani-kanilang uri / ayon sa uri nito
  rationale: Ipinahahayag ng מִין ang pag-uuri nang hindi ipinapasok ang makabagong biyolohikal na konsepto ng species. Ang “ayon sa” ay natural at malapit sa klasipikasyong diwa ng Hebreo.
- source_word: הַבְּהֵמָה
  choice: mga alagang hayop
  rationale: Sa talaang ito, ang בְּהֵמָה ay kategorya ng mga hayop sa lupa na karaniwang inaalagaan, kaiba sa mga ibon at gumagapang na hayop. Mas malinaw ito kaysa sa makitid na “mga baka” at sa napakalawak na “mga hayop.”
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: bawat gumagapang na hayop sa lupa
  rationale: Ang רֶמֶשׂ ay tumutukoy sa maliliit na nilalang na gumagalaw o gumagapang, at ang הָאֲדָמָה ay wastong ipinapahayag bilang “lupa.”
- source_word: שְׁנַיִם מִכֹּל
  choice: dalawa sa bawat uri
  rationale: Ipinahahayag nito na tigdalawa ang kukunin mula sa bawat nabanggit na kategorya. Inuulit ang “uri” sa Tagalog upang maging malinaw at natural ang distributibong diwa.
- source_word: יָבֹאוּ אֵלֶיךָ
  choice: ang lalapit sa iyo
  rationale: Ang בוא na may אֶל ay nagpapahayag ng paglapit o pagdating kay Noe. Hindi nito tahasang sinasabing papasok sila sa arka, kaya hindi iyon idinagdag.
- source_word: לְהַחֲיוֹת
  choice: upang panatilihin silang buhay
  rationale: Ang Hiphil ng חיה ay nangangahulugang magpanatili o mag-ingat na buhay; malinaw ding naipapakita ng “upang” ang layuning ipinahahayag ng pawatas.
