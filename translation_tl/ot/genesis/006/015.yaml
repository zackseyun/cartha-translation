  text: וְ/זֶ֕ה אֲשֶׁ֥ר תַּֽעֲשֶׂ֖ה אֹתָ֑/הּ שְׁלֹ֧שׁ מֵא֣וֹת אַמָּ֗ה אֹ֚רֶךְ הַ/תֵּבָ֔ה חֲמִשִּׁ֤ים אַמָּה֙ רָחְבָּ֔/הּ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/015.yaml
  text: 'And this is how you shall make it: the length of the ark shall be three hundred cubits[a], its width fifty cubits, and its height thirty cubits.'
translation:
  language: tl
  text: 'At ganito mo ito gagawin: ang haba ng daong ay tatlong daang siko[a], ang lapad nito ay limampung siko, at ang taas nito ay tatlumpung siko.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang siko ay sinaunang yunit ng haba, na humigit-kumulang sa distansiya mula sa siko ng braso hanggang sa dulo ng mga daliri.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה אֲשֶׁר תַּעֲשֶׂה אֹתָהּ
  choice: At ganito mo ito gagawin
  rationale: Ipinahahayag ng parirala ang paraan ng paggawa sa daong. Likas sa modernong Tagalog ang ayos na ito at napapanatili ang puwersa ng tagubilin.
- source_word: הַתֵּבָה
  choice: daong
  rationale: Sa konteksto ng salaysay tungkol kay Noe, ang תֵּבָה ay malaking sasakyang pantubig na ipinagagawa sa kaniya. Ang “daong” ay malinaw, marangal, at kinikilalang katawagang Tagalog.
- source_word: שְׁלֹשׁ מֵאוֹת אַמָּה
  choice: tatlong daang siko
  rationale: Pinananatili ang sinaunang yunit na אַמָּה bilang “siko” sa halip na tahimik na palitan ng modernong sukat.
- source_word: אֹרֶךְ
  choice: haba
  rationale: Tuwirang katumbas para sa dimensiyong pahaba ng daong.
- source_word: חֲמִשִּׁים אַמָּה רָחְבָּהּ
  choice: ang lapad nito ay limampung siko
  rationale: Ang “lapad” ang natural na modernong Tagalog para sa dimensiyong רָחְבָּהּ; nililinaw ng “nito” na tumutukoy ito sa daong.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתָהּ
  choice: at ang taas nito ay tatlumpung siko
  rationale: Sa kontekstong panggusali, ang קוֹמָה ay tumutukoy sa taas; pinananatili rin ang koordinasyon ng tatlong sukat.
