id: GEN.1.23
reference: Genesis 1:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם חֲמִישִֽׁי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/023.yaml
  text: And there was evening[a], and there was morning—the fifth day.
translation:
  language: tl
  text: At nagkaroon ng gabi[a], at nagkaroon ng umaga—ang ikalimang araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “At naging gabi, at naging umaga—ang ikalimang araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: at nagkaroon ng
  rationale: Karaniwang pormula ito sa salaysay. Likas sa modernong Tagalog ang “nagkaroon ng” at napapanatili nito ang paulit-ulit na indayog ng salaysay ng paglikha; inilalagay sa talababa ang mas literal na “naging.”
- source_word: עֶרֶב
  choice: gabi
  rationale: Tumutukoy ang pangngalan sa gabi o pagsapit ng gabi. Ang “gabi” ang tuwiran at karaniwang katumbas sa Tagalog at angkop sa paulit-ulit na pormula sa Genesis 1.
- source_word: בֹקֶר
  choice: umaga
  rationale: Ang “umaga” ang tuwirang katumbas at pinananatili ang pagkakatapat nito sa “gabi.”
- source_word: יוֹם
  choice: araw
  rationale: Tinutukoy rito ng יוֹם ang nilagyan ng bilang na araw ng paglikha. Pinananatili ang tuwirang katumbas na “araw” nang hindi nilalagyan ng mas tiyak na pagpapakahulugan.
- source_word: חֲמִישִׁי
  choice: ikalimang
  rationale: Ito ang eksaktong panunurong Tagalog para sa ordinal na naglalarawan sa “araw.”
theological_decisions:
- issue: Kalikasan ng pormula tungkol sa araw ng paglikha
  choice: Panatilihin ang temporal na pormulang “nagkaroon ng gabi, at nagkaroon ng umaga—ang ikalimang araw” nang hindi binibigyang-kahulugan ang haba o likas na katangian ng araw.
  alternative: Isalin nang mas mapagpaliwanag upang magpahiwatig ng literal na 24 na oras, o kaya ng mahabang kapanahunan.
  rationale: Nasa Hebreo ang paulit-ulit na pormula ng gabi at umaga at ang ordinal na pagtukoy sa araw, ngunit hindi dapat lutasin ng salin ang mga sumunod na debateng doktrinal tungkol sa tagal o pampanitikang katangian ng mga araw ng paglikha.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinananatili ang maikli at paulit-ulit na indayog ng Hebreong pormula; ang gitling em ay naghihiwalay sa pangwakas na pagtukoy sa ikalimang araw.
