  text: וַ/יִּבְרָ֣א אֱלֹהִ֔ים אֶת הַ/תַּנִּינִ֖ם הַ/גְּדֹלִ֑ים וְ/אֵ֣ת כָּל נֶ֣פֶשׁ הַֽ/חַיָּ֣ה הָֽ/רֹמֶ֡שֶׂת אֲשֶׁר֩ שָׁרְצ֨וּ הַ/מַּ֜יִם לְ/מִֽינֵ/הֶ֗ם וְ/אֵ֨ת כָּל ע֤וֹף כָּנָף֙ לְ/מִינֵ֔/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/021.yaml
  text: So God created the great sea creatures[a], and every living creature that moves, with which the waters swarmed, according to their kinds, and every winged bird according to its kind. And God saw that it was good.
translation:
  language: tl
  text: At nilikhâ ng Diyos ang malalaking nilalang sa dagat[a], at ang bawat buhay na nilalang na gumagalaw—na pinamugaran ng tubig—ayon sa kani-kanilang uri, at ang bawat ibong may pakpak ayon sa uri nito. At nakita ng Diyos na ito ay mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malalaking halimaw sa dagat” o “malalaking dragon.” Ang Hebreong tanninim ay maaaring tumukoy sa malalaki, mala-ahas, o mala-halimaw na nilalang; dahil pantubig ang konteksto rito, isinaling “mga nilalang sa dagat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרָא
  choice: nilikhâ
  rationale: Pinananatili ng “nilikhâ” ang natatanging pandiwa ng paglikha at ang marangal na himig ng salaysay.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang pangngalan, isahan ang pandiwa at tumutukoy ito rito sa iisang Diyos.
- source_word: הַתַּנִּינִם הַגְּדֹלִים
  choice: ang malalaking nilalang sa dagat
  rationale: Malinaw at likas ito sa kontekstong pantubig, habang hindi ipinagpapalagay na karaniwang hayop lamang ang tinutukoy ng malawak na salitang Hebreo.
- source_word: כָּל נֶפֶשׁ הַחַיָּה
  choice: ang bawat buhay na nilalang
  rationale: Ang נֶפֶשׁ חַיָּה ay tumutukoy rito sa buhay na nilalang, hindi sa “kaluluwa” sa makitid na teolohikal na diwa.
- source_word: הָרֹמֶשֶׂת
  choice: na gumagalaw
  rationale: Saklaw nito ang malawak na kahulugan ng paggalaw o paggapang nang hindi nililimitahan sa mga hayop na gumagapang lamang.
- source_word: אֲשֶׁר שָׁרְצוּ הַמַּיִם
  choice: na siyang ipinandagsa sa tubig
  rationale: Ipinahahayag ng “ipinandagsa” ang kasaganaan ng mga nilalang na pinakilos o pinarami sa tubig, at pinananatili ang tubig bilang gramatikal na pinagmumulan ng pagdagsa.
- source_word: לְמִינֵהֶם
  choice: ayon sa kani-kanilang uri
  rationale: Likas na Filipino ito para sa maramihang tinutukoy at pinananatili ang pagkakategorya sa salaysay.
- source_word: כָּל עוֹף כָּנָף
  choice: ang bawat ibong may pakpak
  rationale: Tuwirang inilalarawan ang kolektibong kategorya ng mga lumilipad na nilalang na may pakpak.
- source_word: לְמִינֵהוּ
  choice: ayon sa uri nito
  rationale: Pinananatili ang isahang hulapi na tumutugma sa kolektibong “bawat ibon.”
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: At nakita ng Diyos na ito ay mabuti
  rationale: Pinananatili ang paulit-ulit na pormula ng pagtataya sa Genesis 1 sa malinaw at marangal na Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa תַּנִּינִם sa konteksto ng paglikha at sa posibleng kahulugang dambuhala o mala-dragon
  choice: malalaking nilalang sa dagat
  alternative: malalaking halimaw sa dagat; malalaking dragon
  rationale: Itinatanghal ng talata ang mga ito bilang mga nilikha ng Diyos sa tubig. Hindi labis na iginigiit ng pangunahing salin ang mitolohikong pahiwatig, ngunit inilalantad sa talababa ang tunay na lawak ng salitang Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinili ang “nilalang sa dagat” sa pangunahing teksto at inilagay sa talababa ang mas matitingkad na alternatibo upang mapanatili ang leksikal na lawak at teolohikal na tensiyon.
