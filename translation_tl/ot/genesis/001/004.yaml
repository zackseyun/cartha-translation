base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/004.yaml
  text: And God saw that the light was good[a], and God separated the light from the darkness.
translation:
  language: tl
  text: At nakita ng Diyos na mabuti ang liwanag, at inihiwalay ng Diyos ang liwanag mula sa dilim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “ibinukod ng Diyos ang liwanag mula sa dilim”; maaari ring ipahiwatig ng pandiwang Hebreo ang paggawa ng pagtatangi sa dalawang bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: nakita
  rationale: Karaniwang salin ng ראה sa anyong pasalaysay; sa konteksto, likas din nitong naipahihiwatig ang pagsusuri nang hindi iyon tahasang idinaragdag.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman maramihan ang anyo ng pangngalan, isahan ang kaakibat na pandiwa at tumutukoy ito sa nag-iisang Maylalang sa Genesis 1.
- source_word: אֶת
  choice: '[hindi isinalin]'
  rationale: Pananda ito ng tuwirang layon sa Hebreo at walang hiwalay na katumbas na kailangang ilagay sa Tagalog.
- source_word: הָאוֹר
  choice: ang liwanag
  rationale: Pinananatili ng “ang” ang tiyak na liwanag na nilikha sa naunang talata.
- source_word: כִּי
  choice: na
  rationale: 'Ipinakikilala nito ang nilalaman ng nakita o kinilala ng Diyos: na mabuti ang liwanag.'
- source_word: טוֹב
  choice: mabuti
  rationale: Malawak at tuwirang katumbas ito ng טוֹב, nang hindi nililimitahan sa “kaaya-aya” o “kapaki-pakinabang.”
- source_word: וַיַּבְדֵּל
  choice: pinaghiwalay
  rationale: Ipinahahayag ng בדל ang paghihiwalay o pagtatangi. Ang “pinaghiwalay” ay natural sa Tagalog at akma sa dalawang bagay na binabanggit.
- source_word: בֵּין ... וּבֵין
  choice: ang liwanag at ang dilim
  rationale: Pagkatapos ng “pinaghiwalay,” likas sa Tagalog ang pagbanggit sa dalawang pinaghihiwalay gamit ang “at,” samantalang nananatili ang diwa ng Hebreong “sa pagitan ng ... at ...”
- source_word: הַחֹשֶׁךְ
  choice: ang dilim
  rationale: Ang “ang” ay tumutukoy sa dilim na nabanggit na sa salaysay; “dilim” ang natural at dignified na katumbas sa modernong Tagalog.
theological_decisions:
- issue: Pag-uulit ng paksang אֱלֹהִים sa dalawang sugnay
  choice: 'Inulit ang “Diyos”: “nakita ng Diyos ... pinaghiwalay ng Diyos ...”'
  alternative: 'Gumamit ng panghalip sa ikalawang sugnay: “pinaghiwalay niya ...”'
  rationale: Tahasang inuulit ng Hebreo ang banal na paksa. Pinananatili ng salin ang ritmo at diin nito nang walang idinaragdag na doktrinal na pagpapakahulugan.
- issue: Kalikasan ng paghihiwalay ng liwanag at dilim
  choice: Isinalin bilang “pinaghiwalay” nang hindi tinutukoy kung pisikal, temporal, o konseptuwal ang paghihiwalay
  alternative: “ibinukod” o “ginawang magkaiba”
  rationale: Hindi ipinaliliwanag ng teksto ang paraan o mekanismo ng paghihiwalay, kaya pinananatili ang tunay na pagiging bukás ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang pag-uulit ng “Diyos” mula sa Hebreo at iniwasang tukuyin ang mekanismo ng paghihiwalay. Inilagay ang talababa sa sugnay na “pinaghiwalay” upang malinaw na iyon ang tinutukoy nito.
