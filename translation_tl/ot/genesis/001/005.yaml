base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/005.yaml
  text: And God called the light Day[a], and the darkness he called Night. And there was evening, and there was morning—the first day.
translation:
  language: tl
  text: Tinawag ng Diyos na Araw ang liwanag, at ang dilim ay tinawag niyang Gabi. Nagkaroon ng takipsilim at nagkaroon ng umaga—ang unang araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “isang araw” o “araw na isa,” sa halip na “unang araw.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Tinawag
  rationale: Ang קרא sa pormula ng pagbibigay-ng-pangalan ay nangangahulugang “tinawag” o “pinangalanan.” Pinananatili ng “tinawag” ang payak na anyo at himig ng Hebreo.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang pangngalan, isahan ang pandiwang kaakibat nito at tumutukoy ito sa nag-iisang Manlilikha sa konteksto.
- source_word: לָאוֹר
  choice: ang liwanag
  rationale: Sa konstruksiyon ng pagbibigay-ng-pangalan, ang prefiks na ל ay likas na ipinahahayag sa Tagalog sa hulma na “tinawag na Araw ang liwanag.”
- source_word: יוֹם
  choice: Araw
  rationale: Ito ang pangalang ibinigay sa liwanag; ang malaking titik ay nagpapakitang ginagamit ito bilang itinakdang pangalan.
- source_word: וְלַחֹשֶׁךְ
  choice: ang dilim
  rationale: Tulad ng “ang liwanag,” ito ang bagay na pinangalanan at likas na inilalagay bilang paksa sa ikalawang sugnay sa Tagalog.
- source_word: קָרָא
  choice: tinawag niyang
  rationale: Inuulit ang pandiwa upang mapanatili ang paralelismo ng Hebreo, habang ang hulma ay ginawang natural sa Tagalog.
- source_word: לָיְלָה
  choice: Gabi
  rationale: Ito ang pangalang ibinigay sa dilim; ipinahihiwatig ng malaking titik ang gawain ng pagpapangalan.
- source_word: וַיְהִי
  choice: Nagkaroon ng
  rationale: Likas nitong ipinapahayag sa Tagalog ang pagdating o pag-iral ng gabi at umaga, at napapanatili ang inuulit na estruktura.
- source_word: עֶרֶב
  choice: gabi
  rationale: Ang pangunahing diwa rito ay ang yugto ng gabi; masyadong tiyak ang “paglubog ng araw.”
- source_word: בֹקֶר
  choice: umaga
  rationale: Ito ang karaniwang kahulugan; mas makitid ang “bukang-liwayway” kaysa sa hinihingi ng Hebreo.
- source_word: יוֹם אֶחָד
  choice: ang unang araw
  rationale: Literal na gumagamit ang Hebreo ng kardinal na “isa,” ngunit sa sunod-sunod na salaysay, malinaw at likas sa Tagalog ang “ang unang araw.” Inilagay sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Pagpapakahulugan sa יוֹם אֶחָד sa hulihan ng pormula ng araw ng paglikha
  choice: ang unang araw
  alternative: isang araw / araw na isa
  rationale: Kardinal na אֶחָד (“isa”) ang nasa Hebreo, hindi ang ordinal na “una.” Gayunman, gumaganap itong unang bilang sa sunod-sunod na mga araw, kaya natural ang “ang unang araw” sa pangunahing teksto. Pinananatili sa talababa ang literal na anyo upang hindi ikubli ang pagkakaiba.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang paralelismo ng dalawang pagpapangalan at ang pag-uulit sa gabi at umaga nang hindi nagiging alanganin ang ayos ng pangungusap.
