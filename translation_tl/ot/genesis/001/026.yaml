  to: Pagkatapos ay sinabi ng Diyos, “Likhain natin ang tao[a] sa ating larawan, ayon sa ating wangis.[b] At mamahala sila[c] sa mga isda sa dagat, sa mga ibon sa langit,[d] sa mga hayop na inaalagaan, sa buong lupa, at sa bawat gumagapang na nilalang na gumagapang sa lupa.”
