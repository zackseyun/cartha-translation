  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים נַֽעֲשֶׂ֥ה אָדָ֛ם בְּ/צַלְמֵ֖/נוּ כִּ/דְמוּתֵ֑/נוּ וְ/יִרְדּוּ֩ בִ/דְגַ֨ת הַ/יָּ֜ם וּ/בְ/ע֣וֹף הַ/שָּׁמַ֗יִם וּ/בַ/בְּהֵמָה֙ וּ/בְ/כָל הָ/אָ֔רֶץ וּ/בְ/כָל הָ/רֶ֖מֶשׂ הָֽ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/026.yaml
  text: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ng Diyos, “Likhain natin ang tao[a] sa ating larawan, ayon sa ating wangis.[b] At mamahala sila[c] sa mga isda sa dagat, sa mga ibon sa langit,[d] sa mga hayop na inaalagaan, sa buong lupa, at sa bawat gumagapang na nilalang na gumagapang sa lupa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sangkatauhan.” Ang Hebreong adam dito ay kolektibong pang-isahan: ang tao bilang isang uri. Kaya pangmaramihan ang kasunod na “mamahala sila.”'
    reason: lexical_alternative
  - marker: b
    text: 'Pinanatili rito ang maramihang “Likhain natin,” “ating larawan,” at “ating wangis.” Iba-iba ang pagkaunawa rito: banal na pagsangguni, pakikipag-usap sa makalangit na kapulungan, o—sa Kristiyanong pagbasa sa kabuuan ng Kasulatan—isang pahiwatig na kaayon ng mas huling kapahayagan tungkol sa Trinidad.'
    reason: alternative_reading
  - marker: c
    text: O “magkaroon sila ng kapamahalaan sa.”
    reason: lexical_alternative
  - marker: d
    text: O “mga ibon sa kalangitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Filipino ang “Pagkatapos ay” at malinaw nitong ipinakikita ang pagkakasunod-sunod.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: May pandiwang pang-isahan ang אֱלֹהִים sa kontekstong ito at tumutukoy sa iisang Diyos.
- source_word: נַעֲשֶׂה
  choice: Lalangin natin
  rationale: Pinananatili ng anyong hortatory na pangmaramihan ang diwang “gawin natin” at ang tunay na pagkamaramihan ng Hebreo nang hindi ipinapaliwanag kung sino ang kinakausap.
- source_word: אָדָם
  choice: tao
  rationale: Ang אָדָם dito ay pang-isahang kolektibo na tumutukoy sa sangkatauhan bilang isang uri. Sa Filipino, natural na naipahahayag ng “tao” kapuwa ang pang-isahang anyo at ang kolektibong diwa, na nililinaw ng kasunod na “sila.”
- source_word: בְּצַלְמֵנוּ
  choice: ayon sa ating larawan
  rationale: Ang צֶלֶם ay larawan, anyo, o representasyon. Ang “ayon sa ating larawan” ay malinaw at pinananatili ang kaugnayan ng בְּ sa pamantayan o huwaran sa kontekstong ito.
- source_word: כִּדְמוּתֵנוּ
  choice: na kawangis natin
  rationale: Ang דְּמוּת ay pagkakahawig o wangis. Pinananatili ng “kawangis natin” ang kaibhan nito sa “larawan” nang hindi nagpapataw ng teknikal na paliwanag sa ugnayan ng dalawang salita.
- source_word: וְיִרְדּוּ
  choice: At mamahala sila
  rationale: Ang pandiwa ay pangatlong panauhang maramihan na may jussive na puwersa. Ang “mamahala sila” ay likas at marangal na Filipino at ipinahahayag ang itinakdang tungkulin ng sangkatauhan.
- source_word: בִדְגַת הַיָּם
  choice: sa mga isda sa dagat
  rationale: Direkta at natural na katumbas ng pariralang Hebreo.
- source_word: וּבְעוֹף הַשָּׁמַיִם
  choice: sa mga ibon sa langit
  rationale: Ang עוֹף ay mga ibon o lumilipad na nilalang, at ang שָׁמַיִם dito ay natural na “langit” sa Filipino.
- source_word: וּבַבְּהֵמָה
  choice: sa mga hayop na inaalagaan
  rationale: Ang בְּהֵמָה rito ay tumutukoy sa klase ng malalaki o domestikadong hayop. Mas tiyak ito kaysa pangkalahatang “mga hayop” at hindi kasingkipot ng “mga baka.”
- source_word: וּבְכָל הָאָרֶץ
  choice: sa buong lupa
  rationale: Ang אֶרֶץ sa Genesis 1 ay tumutukoy sa lupa o daigdig sa malawak na saklaw. Likas at sapat ang “buong lupa” sa konteksto.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ
  choice: sa bawat gumagapang na nilalang na gumagalaw
  rationale: Ang רֶמֶשׂ ay mga nilalang na gumagalaw nang malapit sa lupa. Iniiwasan ng “gumagapang ... na gumagalaw” ang labis na alanganing pag-uulit sa Filipino habang pinananatili ang pangngalan at kasunod na participle ng Hebreo.
theological_decisions:
- issue: Maramihang pananalita sa “Lalangin natin ... ating larawan ... kawangis natin”
  choice: Panatilihin ang mga panghalip at pandiwang pangmaramihan nang hindi tinutukoy sa pangunahing teksto kung sino ang kausap.
  alternative: Unawain bilang banal na pagsangguni, pakikipag-usap sa makalangit na kapulungan, o—sa Kristiyanong kanonikal na pagbasa—pahiwatig na kaayon ng mas huling kapahayagan tungkol sa Trinidad.
  rationale: Malinaw na gumagamit ang Hebreo ng unang panauhang maramihan, ngunit hindi tahasang kinikilala sa talata ang kausap. Dapat panatilihin ng salin ang tensiyong ito sa halip na lutasin ito sa pamamagitan ng pagpapakahulugan.
- issue: Kolektibong kahulugan ng אָדָם at paglipat mula pang-isahan tungong pangmaramihan
  choice: Gamitin ang “tao” bilang kolektibong pang-isahan, pagkatapos ay “sila” sa utos na mamahala.
  alternative: “sangkatauhan” o “mga tao”
  rationale: Pinananatili nito ang anyong pang-isahan ng אָדָם at ang sadyang paglipat ng Hebreo sa pandiwang pangmaramihan. Sa Filipino, ang “tao” ay natural na maaaring tumukoy sa uri ng tao sa kabuuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang mga karaniwang salitang “tao,” “larawan,” “kawangis,” at “mamahala,” habang pinananatili ang kolektibong pang-isahan, ang kasunod na pangmaramihan, at ang hindi nalutas na kahulugan ng banal na pananalitang pangmaramihan.
