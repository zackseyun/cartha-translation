  naturalness: Likas at marangal ang pangunahing daloy. Ang inuulit na “ng kalawakan” ay mas malinaw sa Filipino sa pangungusap na may dalawang “tubig,” at hindi nagiging mabigat. Ang “At nagkagayon nga” ay katanggap-tanggap na pampanitikang pormula para sa paulit-ulit na pahayag sa Genesis 1.
