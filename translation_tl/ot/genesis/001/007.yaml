base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/007.yaml
  text: So God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse[a]. And it was so.
translation:
  language: tl
  text: Ginawa ng Diyos ang kalawakan[a] at pinaghiwalay niya ang tubig na nasa ilalim ng kalawakan mula sa tubig na nasa ibabaw ng kalawakan. At nagkagayon nga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “firmamento” (tradisyonal); maaari ring “simboryo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ginawa
  rationale: Ang עשה ay karaniwang nangangahulugang “gumawa.” Tuwiran at natural ang “ginawa” sa salaysay ng paglikha, nang hindi idinaragdag ang mas tiyak na diwa ng “hinubog.”
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang אֱלֹהִים ay may pandiwang pang-isahan sa kontekstong ito at tumutukoy sa iisang Diyos na Manlilikha.
- source_word: הָרָקִיעַ
  choice: ang kalawakan
  rationale: Ang רָקִיעַ ay tumutukoy sa isang bagay na nakalatag o nakaunat. Ang “kalawakan” ay malinaw at likas sa modernong Filipino, habang iniiwasang itakda kung ito ay isang matigas na estruktura o isang tiyak na hugis-kosmiko.
- source_word: וַיַּבְדֵּל
  choice: pinaghiwalay niya
  rationale: Ang בדל ay nangangahulugang maghiwalay o magbukod. Ang “pinaghiwalay niya” ay natural sa Filipino at malinaw na pinananatiling Diyos ang gumagawa.
- source_word: בֵּין ... וּבֵין
  choice: '... sa ...'
  rationale: Sa konstruksiyong Filipino na “pinaghiwalay ang X sa Y,” likas na naipahahayag ang Hebreong pagtatangi sa pagitan ng dalawang bagay.
- source_word: הַמַּיִם
  choice: ang tubig
  rationale: Bagaman anyong maramihan ang מַיִם sa Hebreo, pangngalang di-mabilang ang “tubig” sa Filipino; hindi natural dito ang “mga tubig.”
- source_word: אֲשֶׁר מִתַּחַת לָרָקִיעַ
  choice: na nasa ilalim nito
  rationale: Tuwirang pinananatili ng “nasa ilalim” ang patayong ugnayang ipinahahayag ng מִתַּחַת; malinaw na tumutukoy ang “nito” sa kalawakan.
- source_word: אֲשֶׁר מֵעַל לָרָקִיעַ
  choice: na nasa ibabaw nito
  rationale: Ang “nasa ibabaw” ay malinaw na katapat ng “nasa ilalim” at tumpak na nagpapahayag sa מֵעַל.
- source_word: וַיְהִי כֵן
  choice: At nagkagayon nga
  rationale: Pinananatili nito ang paulit-ulit na pormula ng katuparan sa Genesis 1. Ipinahahayag ng “nga” ang pagkakatotoo ng iniutos nang hindi nagdaragdag ng paliwanag.
theological_decisions:
- issue: Ang paglalarawan sa רָקִיעַ at ang mga implikasyon nito sa sinaunang kosmolohiya
  choice: kalawakan
  alternative: firmamento; balantok
  rationale: Hindi ipinapalagay ng “kalawakan” na ang tinutukoy ay isang matigas na simboryo, ngunit pinananatili nito ang larawan ng isang bagay na nakaunat. Inilalahad sa talababa ang tradisyonal at mas tiyak na alternatibo upang hindi ikubli ang tunay na leksikal at kosmolohikal na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang payak na ayos ng pangungusap at ang likas na pangngalang di-mabilang na “tubig.” Iniwasan ang arkaikong “firmamento” sa pangunahing teksto at inilagay ito sa talababa kasama ng mas hugis-tiyak na “balantok.”
