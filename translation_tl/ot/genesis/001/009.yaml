id: GEN.1.9
reference: Genesis 1:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יִקָּו֨וּ הַ/מַּ֜יִם מִ/תַּ֤חַת הַ/שָּׁמַ֨יִם֙ אֶל מָק֣וֹם אֶחָ֔ד וְ/תֵרָאֶ֖ה הַ/יַּבָּשָׁ֑ה וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/009.yaml
  text: And God said[a], “Let the waters under the heavens be gathered into one place, and let the dry land appear.” And it was so.
translation:
  language: tl
  text: At sinabi ng Diyos, “Magtipon sa iisang lugar ang mga tubig na nasa ilalim ng kalangitan[a], at lumitaw ang tuyong lupa.” At nagkagayon nga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “langit.” Ang Hebreong שָׁמַיִם ay maaaring tumukoy sa kalangitan o sa langit, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; pinananatili ng “At sinabi” ang daloy nang hindi labis na nililinaw ang pagkakasunod sa panahon.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: May pang-isahang pandiwa ang pangngalan sa kontekstong ito at tumutukoy sa iisang Diyos na Manlilikha.
- source_word: יִקָּווּ הַמַּיִם
  choice: Magtipon ... ang mga tubig
  rationale: Ipinahahayag ng jussive ang utos o kalooban ng Diyos. Likas sa Tagalog ang aktibong anyong “magtipon” at naihahatid nito ang diwang magsama-sama ang mga tubig sa isang pook.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: na nasa ilalim ng kalangitan
  rationale: Ipinakikita ng parirala ang kinaroroonan ng mga tubig. Ang “kalangitan” ay marangal at angkop sa konteksto, habang pinananatili sa talababa ang posibleng kahulugang “langit.”
- source_word: אֶל מָקוֹם אֶחָד
  choice: sa iisang lugar
  rationale: Malinaw na naihahatid ng “sa iisang lugar” ang paggalaw tungo sa pagkakatipon at tahasang pinananatili ang אֶחָד.
- source_word: וְתֵרָאֶה הַיַּבָּשָׁה
  choice: at lumitaw ang tuyong lupa
  rationale: Ang “lumitaw” ay likas na katumbas ng Niphal jussive sa konteksto ng lupang nalalantad mula sa tubig; ang “tuyong lupa” ang karaniwang tawag sa kaibahan ng mga tubig.
- source_word: וַיְהִי כֵן
  choice: At nagkagayon nga
  rationale: Naihahatid nito ang pormulang nagsasaad na natupad ang utos ng Diyos; binibigyang-diin ng “nga” ang aktuwal na katuparan nang natural sa Tagalog.
theological_decisions:
- issue: Kahulugan ng שָׁמַיִם sa salaysay ng paglikha
  choice: kalangitan
  alternative: langit
  rationale: Maaaring tumukoy ang salitang Hebreo sa nakikitang kalawakan sa itaas o sa mga langit. Ang “kalangitan” ay angkop sa kosmolohikal na konteksto ngunit hindi nagtatakda ng mas detalyadong kosmolohiya kaysa sa teksto; pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na estilong pasalaysay ng Genesis 1 at ang dalawang utos, nang hindi ginagawang teknikal o denominasyonal ang pananalita.
