  text: And let them be for lights in the expanse of the heavens to give light on the earth[b][a]. And it was so.
translation:
  language: tl
  text: At maging mga tanglaw ang mga iyon sa kalawakan ng langit[a], upang magbigay ng liwanag sa lupa. At nagkagayon nga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kalangitan.” Ang salitang Hebreo ay tumutukoy sa nakaunat na lawak sa itaas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: At maging ... ang mga iyon
  rationale: Ipinagpapatuloy ng anyong ito ang diwang pautos ng naunang pahayag ng paglikha; natural sa Filipino ang “maging” bilang utos o pagpapasiya.
- source_word: לִמְאוֹרֹת
  choice: mga tanglaw
  rationale: Ang מָאוֹר ay tumutukoy sa mga bagay na nagbibigay ng liwanag, hindi sa abstraktong liwanag lamang. Malinaw at marangal sa Filipino ang “mga tanglaw.”
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: sa kalawakan ng langit
  rationale: Pinananatili ng “kalawakan” ang diwa ng רָקִיעַ bilang nakalatag o nakaunat na lawak, habang ang “ng langit” ay natural na katumbas sa modernong Filipino ng Hebreong הַשָּׁמַיִם sa kontekstong ito.
- source_word: לְהָאִיר
  choice: upang magbigay-liwanag
  rationale: 'Ipinahahayag nito ang causative na diwa ng hiphil: ang mga tanglaw ang sanhi ng pagliwanag sa lupa.'
- source_word: עַל הָאָרֶץ
  choice: sa lupa
  rationale: Natural sa Filipino ang “sa lupa” para sa saklaw o tunguhin ng liwanag; hindi kailangan ang mas literal ngunit mabigat na “sa ibabaw ng lupa.”
- source_word: וַיְהִי כֵן
  choice: At nagkagayon nga
  rationale: Ang pormulang ito ay nagpapahayag na natupad ang iniutos. Ang “nga” ay natural na nagbibigay-diin sa katuparan nang walang idinadagdag na doktrina.
theological_decisions:
- issue: Diwang volitive ng וְהָיוּ sa loob ng pahayag ng paglikha
  choice: 'Isinalin bilang pagpapatuloy ng utos: “At maging …”'
  alternative: “At ang mga iyon ay magiging …” bilang payak na hinaharap
  rationale: Nasa loob pa ito ng sinabi ng Diyos at ipinagpapatuloy ang pagpapasiya o utos mula sa naunang talata. Pinananatili nito ang hulma ng banal na utos na sinusundan ng katuparan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “mga tanglaw” upang ipakitang mga bagay na nagbibigay-liwanag ang tinutukoy, at “kalawakan ng langit” upang mapanatili ang larawang Hebreo nang hindi gumagamit ng lipas na katawagan.
