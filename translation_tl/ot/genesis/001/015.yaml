  naturalness: Marangal at malinaw ang pangunahing pangungusap. Gayunman, mas karaniwan at mas natural sa modernong Filipino ang “magbigay ng liwanag” kaysa sa tambalang “magbigay-liwanag.” Ang kasalukuyang alternatibo sa talababa na “malawak na bubong ng langit” ay hindi natural at nagdaragdag ng mas tiyak na larawang arkitektural kaysa kinakailangan ng teksto.
