base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/022.yaml
  text: And God blessed them[a], saying, “Be fruitful and multiply, and fill the waters in the seas, and let the birds multiply on the earth.”
translation:
  language: tl
  text: At pinagpala sila ng Diyos at sinabi, “Magpakarami kayo at dumami; punuin ninyo ang tubig sa mga dagat, at dumami ang mga ibon[a] sa lupa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lumilipad na nilalang”; maaaring mas malawak kaysa “mga ibon” ang saklaw ng Hebreong עוֹף.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: pinagpala
  rationale: Tuwirang ipinapahayag ang pagkakaloob ng Diyos ng pagpapala at pinananatili ang dignidad ng salaysay.
- source_word: אֹתָם
  choice: sila
  rationale: Tumutukoy sa mga nilalang sa dagat at mga lumilipad na nilalang na nilikha sa naunang talata.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang pangngalan ay may isahang tugma sa pandiwa at tumutukoy sa iisang Manlilikha sa Genesis 1.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Likas na panimulang pormula sa tuwirang pananalita at malinaw na iniuugnay ang kasunod na mga salita sa pagpapala.
- source_word: פְּרוּ
  choice: Magpakarami kayo
  rationale: Sa kontekstong ito, ang utos ay tumutukoy sa pagiging mabunga sa pagpaparami; mas likas ito sa modernong Filipino kaysa sa literal ngunit malabong “magbunga.”
- source_word: וּרְבוּ
  choice: at dumami
  rationale: Ipinapahayag ang paglaki ng bilang at pinananatili ang dalawang magkaugnay ngunit magkahiwalay na pandiwa ng Hebreo.
- source_word: וּמִלְאוּ
  choice: punuin ninyo
  rationale: Tuwirang katumbas ng pautos na מלא at malinaw ang maramihang kausap.
- source_word: אֶת הַמַּיִם
  choice: ang tubig
  rationale: Bagaman anyong maramihan ang מַיִם sa Hebreo, karaniwang pang-isahan na pangngalang di-mabilang ang “tubig” sa natural na Filipino.
- source_word: בַּיַּמִּים
  choice: sa mga dagat
  rationale: Pinananatili ang maramihang bilang ng יַמִּים at ang saklaw ng mga dagat sa salaysay ng paglikha.
- source_word: וְהָעוֹף
  choice: ang mga ibon
  rationale: Natural at angkop sa agarang konteksto, habang inilalahad sa talababa ang mas malawak na posibleng kahulugan ng עוֹף.
- source_word: יִרֶב
  choice: dumami
  rationale: Binabasa bilang may pahiwatig na paghahangad o pagpapahintulot sa loob ng pagpapala, hindi bilang payak na hula sa hinaharap.
- source_word: בָּאָרֶץ
  choice: sa lupa
  rationale: Natural na Filipino para sa panlupang dako kung saan dumarami ang mga ibon; hindi nito labis na nililimitahan ang אָרֶץ sa isang partikular na lupain.
theological_decisions:
- issue: Kalikasan ng pananalita sa loob ng pagpapala
  choice: Pinanatili ang mga anyong pautos at ang pahiwatig na paghahangad sa huling sugnay bilang pagpapalang ipinahayag sa paraang tulad ng utos.
  alternative: 'Isalin ang lahat bilang tuwirang utos, o gawing payak na hula ang huling sugnay: “darami ang mga ibon.”'
  rationale: Ang Hebreo ay naglalahad ng pagpapala sa pamamagitan ng mga imperative at jussive/imperfect. Ang salin ay hindi nagpapasya na ito ay utos lamang o hula lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “magpakarami” sa halip na literal na “magbunga” upang malinaw ang reproductive sense, at pinanatili ang maikli at ritmikong anyo ng pagpapala.
