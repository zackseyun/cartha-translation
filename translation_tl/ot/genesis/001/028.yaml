id: GEN.1.28
reference: Genesis 1:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֹתָ/ם֮ אֱלֹהִים֒ וַ/יֹּ֨אמֶר לָ/הֶ֜ם אֱלֹהִ֗ים פְּר֥וּ וּ/רְב֛וּ וּ/מִלְא֥וּ אֶת הָ/אָ֖רֶץ וְ/כִבְשֻׁ֑/הָ וּ/רְד֞וּ בִּ/דְגַ֤ת הַ/יָּם֙ וּ/בְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/בְ/כָל חַיָּ֖ה הָֽ/רֹמֶ֥שֶׂת עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/028.yaml
  text: And God blessed them[a], and God said to them, “Be fruitful, and multiply, and fill the earth, and subdue it, and rule over the fish of the sea, and over the birds of the heavens[b], and over every living thing that moves on the earth.”
translation:
  language: tl
  text: Pinagpala sila ng Diyos at sinabi sa kanila, “Magkaanak kayo at magpakarami; punuin ninyo ang lupa at supilin ito. Pamahalaan ninyo ang mga isda sa dagat, ang mga ibon sa himpapawid, at ang bawat buhay na nilalang na gumagalaw[b] sa ibabaw ng lupa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Magkaroon kayo ng kapamahalaan sa mga ito.”
    reason: lexical_alternative
  - marker: b
    text: O, “gumagapang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: Pinagpala
  rationale: Ipinahahayag ng piel ng ברך ang aktuwal na pagkakaloob ng pagpapala, hindi lamang ang pagsasalita nang mabuti tungkol sa kanila.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang salita, isahan ang kaugnay na pandiwa at tumutukoy ito sa iisang Diyos sa salaysay.
- source_word: פְּרוּ
  choice: Magkaanak kayo
  rationale: Ang pautos ay tumutukoy sa pagkamayabong at pagkakaroon ng supling. Mas natural at malinaw ito sa modernong Tagalog kaysa sa literal ngunit alanganing “maging mabunga kayo.”
- source_word: וּרְבוּ
  choice: magpakarami
  rationale: Tumutukoy ang רבה sa pagdami ng bilang; tuwiran at likas na katambal ito ng “magkaanak kayo.”
- source_word: וּמִלְאוּ
  choice: punuin ninyo
  rationale: Pinananatili nito ang payak at tuwirang diwa ng מלא.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Sa pandaigdigang konteksto ng Genesis 1, tumutukoy ito sa buong lupa, hindi sa isang takdang lupain.
- source_word: וְכִבְשֻׁהָ
  choice: supilin ito
  rationale: Pinananatili ng “supilin” ang malakas na diwa ng כבש na pagpapasailalim o pagkontrol, nang hindi nagdaragdag ng ideya ng mapang-abusong pagsasamantala.
- source_word: וּרְדוּ
  choice: Pamahalaan ninyo
  rationale: Malinaw na ipinahahayag nito ang paggamit ng awtoridad na nasa רדה at natural itong maunawaan sa kasalukuyang Tagalog.
- source_word: בִּדְגַת הַיָּם
  choice: ang mga isda sa dagat
  rationale: Tiyak na isda ang tinutukoy ng parirala, hindi lahat ng uri ng nilalang sa dagat.
- source_word: בְעוֹף הַשָּׁמַיִם
  choice: ang mga ibon sa himpapawid
  rationale: Natural na salin ang “mga ibon,” at ang “himpapawid” ay marangal at karaniwang katumbas ng kalangitan bilang tirahan ng mga lumilipad na nilalang.
- source_word: בְכָל חַיָּה
  choice: ang bawat buhay na nilalang
  rationale: Malawak ang saklaw ng חיה; hindi ito nililimitahan sa mababangis na hayop lamang.
- source_word: הָרֹמֶשֶׂת
  choice: na gumagalaw
  rationale: Malawak ang רמש at maaaring tumukoy sa pagkilos sa ibabaw ng lupa; iniiwasan ng “gumagalaw” ang di-kinakailangang paglilimita sa mga gumagapang lamang.
theological_decisions:
- issue: Lakas ng utos sa sangkatauhan kaugnay ng nilikha sa כבש at רדה
  choice: Panatilihin ang matibay na pananalitang “supilin” at “pamahalaan.”
  alternative: “alagaan” o “maging katiwala ng”
  rationale: Mas malakas ang mga pandiwang Hebreo kaysa sa pangangalaga lamang. Hindi pinalalambot ang utos, ngunit hindi rin dinaragdagan ng pahintulot sa mapang-abusong paghahari.
- issue: Saklaw ng הָאָרֶץ
  choice: “ang lupa,” na tumutukoy sa buong daigdig sa kontekstong ito
  alternative: “ang lupain,” na maaaring magpahiwatig ng isang takdang teritoryo
  rationale: Ang Genesis 1 ay salaysay ng pangkalahatang paglikha, kaya pandaigdigan ang saklaw ng utos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “magkaanak” sa halip na ang mas literal ngunit hindi likas na “maging mabunga,” habang pinanatili ang lakas ng mga utos na “supilin” at “pamahalaan.”
