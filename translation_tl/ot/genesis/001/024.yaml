base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/024.yaml
  text: 'And God said[a], “Let the earth bring forth living creatures according to their kinds: livestock, creeping things, and wild animals of the earth according to their kinds.” And it was so.'
translation:
  language: tl
  text: 'At sinabi ng Diyos, “Maglabas ang lupa ng mga nilalang na may buhay[a] ayon sa kani-kanilang uri: mga alagang hayop, mga hayop na gumagapang, at mga mailap na hayop sa lupa ayon sa kani-kanilang uri.” At nagkagayon nga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga buhay na nilalang”; literal na “buhay na nefesh” (na maaari ring isaling “buhay na kaluluwa”).
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצֵא
  choice: Magluwal
  rationale: Ang Hiphil jussive na may ‘lupa’ bilang simuno ay utos na magpalitaw o maglabas ito ng mga nilalang. Pinananatili ng ‘magluwal’ ang sanhi at ang larawan ng lupa na pinagmumulan ng mga hayop.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Sa konteksto ng paglikha, tumutukoy ito sa lupang bahagi ng daigdig, salungat sa dagat at himpapawid. Likas at malinaw sa Filipino ang ‘lupa.’
- source_word: נֶפֶשׁ חַיָּה
  choice: mga nilalang na may buhay
  rationale: Tumutukoy ang parirala sa mga nilalang na may buhay, at ang maramihang diwa ay nililinaw ng kasunod na mga pangkat. Iniiwasan ng saling ito ang pagpasok ng isang tiyak na doktrina tungkol sa ‘kaluluwa.’
- source_word: לְמִינָהּ
  choice: ayon sa kani-kanilang uri
  rationale: Bagaman anyong pambalana at isahan sa Hebreo, distributibo ang diwa nito sa mga pangkat ng hayop. Malinaw at natural sa Filipino ang ‘kani-kanilang uri.’
- source_word: בְּהֵמָה
  choice: mga alagang hayop
  rationale: Dito ay tumutukoy sa malalaking hayop, lalo na sa mga domestikado o maamong hayop bilang isang pangkat. Mas malawak at mas natural ito kaysa ‘mga baka.’
- source_word: רֶמֶשׂ
  choice: mga hayop na gumagapang
  rationale: Saklaw ng salita ang maliliit na hayop na kumikilos sa ibabaw ng lupa. Pinananatili ng saling ito ang pangkalahatang kategorya nang hindi tumutukoy sa espesipikong uri.
- source_word: חַיְתוֹ אֶרֶץ
  choice: maiilap na hayop sa lupa
  rationale: Ipinakikita nito ang kaibahan ng mga di-domestikadong hayop sa mga alagang hayop, habang pinananatili ang kaugnayan nila sa lupang tirahan.
- source_word: וַיְהִי כֵן
  choice: At nagkagayon nga
  rationale: Maikli at marangal itong katumbas ng pormula ng katuparan sa Genesis 1; ipinahihiwatig ng ‘nga’ na natupad ang iniutos.
theological_decisions:
- issue: Kung gagamit ng teolohikong mabigat na salita para sa נֶפֶשׁ
  choice: mga nilalang na may buhay
  alternative: mga buhay na kaluluwa
  rationale: Sa talatang ito, ang parirala ay tumutukoy sa mga hayop bilang mga nilalang na may buhay, hindi tahasang nagtuturo tungkol sa metapisikal na kalikasan ng kaluluwa. Inilalagay sa talababa ang literal na posibilidad upang mapanatili ang leksikal na lawak nang hindi nagpapataw ng doktrina.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang payak na bokabularyong mauunawaan ng karaniwang mambabasa, habang pinananatili ang maindayog at pormal na himig ng salaysay ng paglikha.
