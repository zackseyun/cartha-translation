id: GEN.1.3
reference: Genesis 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֱלֹהִ֖ים יְהִ֣י א֑וֹר וַֽ/יְהִי אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/003.yaml
  text: And God said[a], “Let there be light,” and there was light.
translation:
  language: tl
  text: At sinabi ng Diyos[a], “Magkaroon ng liwanag,” at nagkaroon ng liwanag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Magkaroon nawa ng liwanag.” Gumagamit ang Hebreo ng anyong jussive na nagpapahayag ng kalooban o utos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Ang wayyiqtol ng אמר ay nagpapatuloy sa salaysay. Pinananatili ng “At sinabi” ang pagkakasunod-sunod sa Hebreo nang hindi dinaragdagan ang ugnayang ipinahihiwatig nito.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang pangngalan, isahan ang kaugnay na pandiwa at tumutukoy ito rito sa iisang Maylikha; “Diyos” ang likas at pamantayang salin.
- source_word: יְהִי
  choice: Magkaroon
  rationale: Ang jussive ng היה ay nagpapahayag ng kalooban o utos. Sa pariralang “Magkaroon ng liwanag,” likas itong malikhaing utos sa modernong Tagalog at hindi nangangailangan ng tahasang tagaganap.
- source_word: אוֹר
  choice: liwanag
  rationale: Ito ang tuwirang kahulugan ng salita sa konteksto; walang batayan upang tukuyin ang isang partikular na pinagmumulan o metaporikal na diwa.
- source_word: וַיְהִי
  choice: at nagkaroon
  rationale: Iniulat ng wayyiqtol ng היה ang agarang kinalabasan ng sinabi ng Diyos. Ang “at nagkaroon” ay maikli at inuulit ang pandiwang ginamit sa utos upang idiin ang katuparan.
- source_word: אוֹר
  choice: liwanag
  rationale: Iningatan ang pag-uulit ng pangngalan sa Hebreo upang malinaw na tumugma ang resulta sa iniutos.
theological_decisions:
- issue: Paglalarawan sa malikhaing utos ng Diyos
  choice: Magkaroon ng liwanag
  alternative: Magkaroon nawa ng liwanag
  rationale: Pinananatili ng pangunahing salin ang puwersa ng jussive bilang makapangyarihang utos o pagpapahayag ng kalooban, samantalang inilalahad sa talababa ang posibleng himig na paghahangad nang hindi nilulutas nang labis ang saklaw ng anyong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at angkop sa salaysay. Pinanatili ang “At” upang katawanin ang pagpapatuloy ng Hebreong salaysay at ang eksaktong pag-uulit ng “liwanag” upang idiin ang agarang katuparan.
