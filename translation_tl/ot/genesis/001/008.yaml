base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/008.yaml
  text: And God called the expanse Heaven[a]. And there was evening[b], and there was morning—the second day.
translation:
  language: tl
  text: Tinawag ng Diyos na Langit[a] ang kalawakan[b]. Nagkaroon ng takipsilim at nagkaroon ng umaga—ang ikalawang araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “himpapawid” o “mga langit.” Ang Hebreong שָׁמַיִם ay maaaring tumukoy sa himpapawid o mga langit; dito, ito ang pangalang ibinigay ng Diyos sa kalawakan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “firmamento” (tradisyonal) o “simboryo.” Ang Hebreong רָקִיעַ ay tumutukoy sa isang bagay na inilatag o iniunat; ginamit dito ang “kalawakan” bilang saling hindi labis na nagpapakahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Tinawag
  rationale: Sa kayariang קרא na may ל, tumutukoy ang pandiwa sa pagbibigay o pagtatalaga ng pangalan. Likas sa Tagalog ang “tinawag na” at malinaw nitong naipapakita ang kilos ng pagpapangalan.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang salitang Hebreo, isahan ang pandiwang kasama nito at tumutukoy ito sa iisang Maylalang sa Genesis 1.
- source_word: לָרָקִיעַ
  choice: ang kalawakan
  rationale: Ang רָקִיעַ ay tumutukoy sa isang bagay na inilatag o iniunat. Ang “kalawakan” ay malinaw at marangal sa makabagong Tagalog, at hindi nito ipinipilit ang larawang dala ng “balantok” o ang tradisyonal ngunit di-pamilyar na “firmamento.”
- source_word: שָׁמָיִם
  choice: Langit
  rationale: Ito ang pangalang ibinigay ng Diyos sa kalawakan. Pinananatili ng “Langit” ang pormal na pagpapangalan at ang marangal na himig, habang ang maaaring diwa na nakikitang himpapawid ay inilalahad sa talababa.
- source_word: וַיְהִי
  choice: Nagkaroon
  rationale: Ang “nagkaroon” ay likas na paraan upang ihayag sa Tagalog ang pag-iral o pagdating ng gabi at umaga nang hindi nagdaragdag ng kilos na wala sa Hebreo.
- source_word: עֶרֶב
  choice: gabi
  rationale: Karaniwan at malinaw itong katumbas sa paulit-ulit na pormula ng mga araw ng paglikha.
- source_word: בֹקֶר
  choice: umaga
  rationale: Karaniwan at malinaw itong katumbas sa paulit-ulit na pormula ng mga araw ng paglikha.
- source_word: יוֹם שֵׁנִי
  choice: ang ikalawang araw
  rationale: Bagaman walang pantukoy ang pang-uring Hebreo, gumaganap ang parirala bilang ordinal na katawagan sa pagkakasunod-sunod ng mga araw; natural sa Tagalog ang “ang ikalawang araw.”
theological_decisions:
- issue: Ang שָׁמָיִם bilang pangalang ibinigay sa רָקִיעַ
  choice: Langit
  alternative: himpapawid; mga langit
  rationale: Pinananatili ng “Langit” ang kilos ng pagpapangalan at ang mataas na himig ng salaysay, ngunit hindi nito itinatakda kung ang tinutukoy ay tirahan ng Diyos o ang nakikitang kalangitan; kaya binabanggit sa talababa ang iba pang posibleng salin.
- issue: Ang kosmolohikal na larawan ng רָקִיעַ
  choice: kalawakan
  alternative: firmamento; balantok
  rationale: Ipinahihiwatig ng ugat ang isang bagay na inilatag o iniunat, ngunit hindi sapat ang talata upang ipilit ang isang tiyak na modernong o sinaunang modelong kosmolohikal. Ang “kalawakan” ay nagpapanatili ng sapat na kaluwagan sa kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang payak na ayos na “Tinawag ng Diyos na…” upang maging natural ang pagpapangalan. Inilagay ang mga pananda ng talababa kaagad sa “Langit” at “kalawakan,” ang mismong mga salitang may leksikal na alternatibo.
