  yaml_path: translation/ot/genesis/001/013.yaml
  text: And there was evening[a], and there was morning—the third day.
translation:
  language: tl
  text: At nagkaroon ng gabi, at nagkaroon ng umaga—ang ikatlong araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “At nagkaroon ng gabi at nagkaroon ng umaga, ikatlong araw.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: at nagkaroon
  rationale: Sa paulit-ulit na salaysay na ito, ipinahahayag ng anyo ng היה ang pagdating o pag-iral ng bawat bahagi ng takdang panahon. Ang “at nagkaroon” ay likas sa Filipino at napapanatili ang dalawang magkatimbang na sugnay.
- source_word: עֶרֶב
  choice: gabi
  rationale: Tumutukoy ito sa gabi o pagsapit ng dilim. Ang “gabi” ang payak at karaniwang katumbas sa pormulang ito.
- source_word: בֹּקֶר
  choice: umaga
  rationale: Tumutukoy ito sa umaga. Pinananatili ng “umaga” ang tuwirang pagtutumbas at ang pagkakaparis nito sa “gabi.”
- source_word: יוֹם
  choice: araw
  rationale: Tinutukoy ng יוֹם rito ang binilang na araw sa pagkakasunod-sunod ng salaysay ng paglikha.
- source_word: שְׁלִישִׁי
  choice: ikatlong
  rationale: Ang pang-uring pamilang ay tuwirang nangangahulugang “ikatlo” at tumutukoy sa “araw.”
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: At nagkaroon ng gabi, at nagkaroon ng umaga
  rationale: Inuulit ang pandiwang Hebreo sa dalawang sugnay. Pinananatili ng salin ang pag-uulit at maindayog na pormula ng orihinal, habang gumagamit ng natural na bantas sa Filipino.
theological_decisions:
- issue: Pagsasalin sa pormula ng araw ng paglikha nang hindi ipinapasok ang isang tiyak na paliwanag tungkol sa kronolohiya
  choice: At nagkaroon ng gabi, at nagkaroon ng umaga—ang ikatlong araw.
  alternative: At nagkaroon ng gabi at nagkaroon ng umaga, ikatlong araw.
  rationale: Payak na inilalahad ng Hebreo ang pagkakasunod-sunod sa salaysay. Ang “ang ikatlong araw” ay natural sa Filipino at hindi nagpapasiya sa mga pagtatalo tungkol sa haba o pampanitikang tungkulin ng mga araw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na ritmo ng Hebreo; inilagay ang talababa upang maipakita ang mas literal na ayos ng parirala.
