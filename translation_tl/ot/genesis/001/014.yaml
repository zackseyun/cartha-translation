  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יְהִ֤י מְאֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הַבְדִּ֕יל בֵּ֥ין הַ/יּ֖וֹם וּ/בֵ֣ין הַ/לָּ֑יְלָה וְ/הָי֤וּ לְ/אֹתֹת֙ וּ/לְ/מ֣וֹעֲדִ֔ים וּ/לְ/יָמִ֖ים וְ/שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/014.yaml
  text: And God said[a], “Let there be lights in the expanse of the heavens to separate the day from the night, and let them be for signs and for appointed times[d][c][b], and for days and years.”
translation:
  language: tl
  text: At sinabi ng Diyos, “Magkaroon ng mga tanglaw sa kalawakan ng langit upang paghiwalayin ang araw at ang gabi. Magsilbi ang mga ito bilang mga tanda at para sa mga takdang panahon,[a] mga araw, at mga taon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kapanahunan.” Ang Hebreong מוֹעֲדִים ay karaniwang tumutukoy sa mga takdang panahon at, sa ibang konteksto, maaaring kabilang dito ang mga itinakdang kapistahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֹרֹת
  choice: mga tanglaw
  rationale: Tumutukoy ang pangngalan sa mga tagapagbigay o pinagmumulan ng liwanag. Ang “mga tanglaw” ay likas at marangal sa Filipino at higit na tiyak kaysa sa simpleng “mga ilaw” nang hindi pinapangalanan ang araw, buwan, o mga bituin.
- source_word: רָקִיעַ
  choice: kalawakan
  rationale: Ipinahahayag nito ang nakalatag na espasyo sa itaas sa paraang madaling maunawaan sa modernong Filipino, nang hindi ipinapalagay ang isang mas tiyak na hugis gaya ng isang matigas na simboryo.
- source_word: הַשָּׁמַיִם
  choice: langit
  rationale: Ang “langit” ang natural na Filipino para sa makalangit o pangkalangitang saklaw dito; sa pariralang “kalawakan ng langit,” napapanatili ang pampanitikang himig ng salaysay.
- source_word: לְהַבְדִּיל
  choice: upang paghiwalayin
  rationale: Malinaw nitong ipinahahayag ang layunin at pinananatili ang paulit-ulit na motibo ng paghihiwalay sa Genesis 1.
- source_word: בֵּין הַיּוֹם וּבֵין הַלַּיְלָה
  choice: ang araw at ang gabi
  rationale: Kasama ng pandiwang “paghiwalayin,” ito ang natural na ayos sa Filipino at pinananatili ang parehong panahong tinutukoy.
- source_word: לְאֹתֹת
  choice: bilang mga tanda
  rationale: Pinananatiling malawak ng “mga tanda” ang kahulugan bilang mga palatandaan o pananda, nang hindi nililimitahan kung anong uri ng tanda ang tinutukoy.
- source_word: לְמוֹעֲדִים
  choice: para sa mga takdang panahon
  rationale: Sinasaklaw ng “mga takdang panahon” ang ideya ng mga panahong itinakda, kabilang ang posibleng mga kapistahan sa ibang konteksto, nang hindi ito nililimitahan sa mga kapanahunan ng klima.
- source_word: לְיָמִים וְשָׁנִים
  choice: para sa mga araw at mga taon
  rationale: Tuwirang isinasalin ang dalawang yunit ng panahon at pinananatili ang pag-uulit ng pang-ukol sa listahan.
- source_word: יְהִי ... וְהָיוּ
  choice: Magkaroon ... Magsilbi
  rationale: Ang “Magkaroon” ay natural na pormula ng banal na utos sa Filipino. Sa kasunod na sugnay, malinaw na ipinahahayag ng “Magsilbi” ang tungkuling itinatalaga sa mga tanglaw, sa halip na magmistulang payak na prediksiyon.
theological_decisions:
- issue: Kahulugan ng מוֹעֲדִים sa konteksto ng paglikha
  choice: malawak na kahulugang “mga takdang panahon”
  alternative: “mga kapanahunan” o “mga kapistahan”
  rationale: Ang konteksto ay ang kosmikong pagsasaayos at pagsukat ng panahon. Pinananatili ng “mga takdang panahon” ang posibleng kaugnayan sa mga itinakdang kapistahan sa ibang teksto nang hindi ipinapasok dito ang isang eksklusibong liturhikal o klimatikong kahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga tanglaw” sa halip na teknikal na “mga luminaria,” at “kalawakan ng langit” upang mapanatili ang larawan ng tekstong Hebreo nang hindi labis na tinutukoy ang pisikal na anyo nito. Ang bantas at paghahati sa dalawang pangungusap ay para sa malinaw at natural na daloy.
