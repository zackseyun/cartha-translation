  yaml_path: translation/ot/genesis/001/006.yaml
  text: And God said[a], “Let there be an expanse in the midst of the waters[b], and let it separate water from water.”
translation:
  language: tl
  text: At sinabi ng Diyos, “Magkaroon ng kalawakan[a] sa gitna ng mga tubig, at maging tagapaghiwalay ito sa pagitan ng tubig at tubig[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “balantok,” “lukob,” o “simboryo.” Ang Hebreong רָקִיעַ ay tumutukoy sa isang bagay na inilatag o iniunat; nagkakaiba ang mga salin ayon sa kung gaano nila tahasang inilalarawan ang sinaunang larawan ng sansinukob.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “na naghihiwalay sa pagitan ng tubig at tubig.” Ipinahihiwatig nito ang pagbubukod ng isang kalipunan ng tubig mula sa isa pa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Pinananatili ng “At sinabi” ang payak na daloy ng Hebreo nang hindi nagdaragdag ng mas tiyak na pagkakasunod-sunod sa panahon.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang pangngalan, isahan ang pandiwang kaugnay nito rito at tumutukoy ito sa iisang Maylikha.
- source_word: יְהִי
  choice: Magkaroon ng
  rationale: Ang jussive ng היה ay nagpapahayag ng makapangyarihang utos ng Diyos. Likas sa modernong Tagalog ang “Magkaroon ng” at napananatili nito ang puwersa ng banal na pagpapairal.
- source_word: רָקִיעַ
  choice: kalawakan
  rationale: Tumutukoy ang salita sa isang bagay na inilatag o iniunat. Ang “kalawakan” ay malinaw at dignidadong salin na hindi nagpapasiya sa pangunahing teksto kung ito ay isang matigas na balantok o simboryo.
- source_word: בְּתוֹךְ
  choice: sa gitna ng
  rationale: Tuwirang ipinahahayag nito ang kinalalagyan sa loob o kalagitnaan ng mga tubig.
- source_word: הַמָּיִם
  choice: mga tubig
  rationale: Pinananatili nito ang maramihang anyo at ang larawan ng sinaunang mga tubig, sa halip na gawing karaniwang di-mabilang na “tubig” lamang.
- source_word: וִיהִי מַבְדִּיל
  choice: at paghiwalayin nito
  rationale: Ipinagpapatuloy nito ang diwang jussive at nililinaw na ang kalawakan ang gaganap bilang tagapaghiwalay.
- source_word: בֵּין מַיִם לָמָיִם
  choice: ang isang bahagi ng tubig sa isa pa
  rationale: Natural nitong ipinahahayag sa Tagalog ang literal na “sa pagitan ng tubig at tubig,” habang malinaw na dalawang bahagi o kalipunan ng tubig ang pinagbubukod.
theological_decisions:
- issue: Paglalarawan sa רָקִיעַ kaugnay ng sinaunang kosmolohiya
  choice: kalawakan
  alternative: balantok, simboryo, o isang bagay na inilatag
  rationale: Inilalarawan ng talata ang nilikhang tagapaghiwalay sa gitna ng mga tubig. Pinananatili ng “kalawakan” ang ideya ng isang malawak o inilatag na bahagi nang hindi tahimik na nagpapasya kung anong tiyak na pisikal na modelo ng sansinukob ang ipinapalagay ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “kalawakan” bilang pamilyar na salitang biblikal na nauunawaan pa rin sa kasalukuyan; inilagay sa talababa ang mas kongkretong mga alternatibo upang mapanatili ang tunay na leksikal at kosmolohikal na kalabuan.
