id: GEN.1.25
reference: Genesis 1:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֩ אֶת חַיַּ֨ת הָ/אָ֜רֶץ לְ/מִינָ֗/הּ וְ/אֶת הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/אֵ֛ת כָּל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/025.yaml
  text: And God made the beasts of the earth according to their kinds[a], and the livestock according to their kinds, and every creeping thing of the ground according to its kind[c][b]. And God saw that it was good.
translation:
  language: tl
  text: Ginawa ng Diyos ang maiilap na hayop sa lupain[a] ayon sa kani-kanilang uri[b], ang mga alagang hayop ayon sa kani-kanilang uri, at ang bawat hayop na gumagapang sa lupa[c] ayon sa uri nito. At nakita ng Diyos na mabuti iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga ligaw na hayop sa lupa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “uri” rito ay tumutukoy sa mga kategorya ng mga nilalang at hindi dapat ipilit na maging katumbas ng makabagong siyentipikong taksonomiya.
    reason: cultural_note
  - marker: c
    text: Sa Hebreo, “lupa” (אֲדָמָה) ang ginamit dito, na iba sa salitang isinaling “lupain” (אֶרֶץ) sa unang bahagi ng talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa
  rationale: Ang עשה ay karaniwang nangangahulugang “gumawa.” Ang “ginawa” ay tuwiran at natural sa salaysay ng paglikha, nang walang idinaragdag na diwa.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang pangngalan, isahan ang pandiwang kaugnay nito at tumutukoy ito sa iisang Manlilikha sa Genesis 1.
- source_word: חַיַּת הָאָרֶץ
  choice: maiilap na hayop sa lupain
  rationale: Tumutukoy ang parirala sa mga hayop na hindi inaalagaan, bilang bukod na pangkat sa בהמה. Mas malinaw at mas likas sa makabagong Tagalog ang “maiilap na hayop” kaysa “mga halimaw” o “mababangis na hayop,” na maaaring magpahiwatig ng pagiging mapanganib.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: ayon sa kani-kanilang uri / ayon sa uri nito
  rationale: Ang מין ay tumutukoy sa uri o kategorya. Iniiwasan ng “uri” ang di-makatwirang pagpasok ng makabagong teknikal na konsepto ng biological species.
- source_word: הַבְּהֵמָה
  choice: mga alagang hayop
  rationale: Sa paghahambing nito sa maiilap na hayop, malinaw na ipinahihiwatig rito ang malalaki o domestikadong hayop. Mas malawak at mas angkop ang “mga alagang hayop” kaysa “mga baka.”
- source_word: כָּל רֶמֶשׂ הָאֲדָמָה
  choice: bawat hayop na gumagapang sa lupa
  rationale: Ang רמש ay tumutukoy sa maliliit na nilalang na kumikilos nang malapit sa lupa. Pinananatili ng “gumagapang” ang larawang nasa Hebreo, habang ang “lupa” ay angkop sa אֲדָמָה.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: At nakita ng Diyos na mabuti iyon
  rationale: Natural itong Tagalog para sa paulit-ulit na pahayag ng pagsusuri sa Genesis 1 at hindi nito dinaragdagan ang kahulugan ng Hebreo.
theological_decisions:
- issue: Paglalarawan sa mga kategorya ng nilikha nang hindi ipinapasok ang makabagong siyentipikong taksonomiya
  choice: uri
  alternative: species
  rationale: Ang Hebreong מין ay nagsasaad ng uri o kategorya, hindi kinakailangang katumbas ng teknikal na biological species sa makabagong agham.
- issue: Pagpapanatili sa pagkakaiba ng הָאָרֶץ at הָאֲדָמָה sa iisang talata
  choice: lupain … lupa
  alternative: lupa … lupa
  rationale: Ang “lupain” para sa הָאָרֶץ at “lupa” para sa הָאֲדָמָה ay nagpapanatili ng banayad na leksikal na pagkakaiba nang hindi nagiging di-natural sa Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “maiilap” sa halip na “mababangis” upang hindi ipahiwatig na likas na marahas ang lahat ng hayop sa pangkat. Pinanatili ang paulit-ulit na hulma ng “ayon sa … uri,” gaya ng Hebreo.
