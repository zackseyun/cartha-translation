  source_fidelity: 'Tumpak na naihahatid ng salin ang tatlong pangkat sa Hebreo: mga hayop sa lupain na naiiba sa mga alagang hayop, at bawat gumagapang na nilalang sa lupa. Napanatili rin ang pag-uulit ng “ayon sa ... uri” at ang pangwakas na pormulang pagsusuri ng Diyos. Ang “lupain” para sa הָאָרֶץ at “lupa” para sa הָאֲדָמָה ay wastong nagpapakita ng leksikal na pagkakaiba.'
  naturalness: Natural at malinaw ang modernong Tagalog. Ang “maiilap na hayop,” “mga alagang hayop,” at “hayop na gumagapang” ay nauunawaan nang walang di-kailangang teknikal na pananalita. Ang daloy at register ay angkop sa marangal ngunit makabagong salaysay.
  terminology: Ang “Diyos,” “uri,” at “mga alagang hayop” ay pare-pareho at angkop. Ang “uri” ay hindi nag-aangkat ng makabagong konsepto ng siyentipikong species. Ang “maiilap na hayop” ay isang ligtas at natural na paraan upang katawanin ang pangkat na naiiba sa domestikadong hayop.
