  text: And God set them in the expanse of the heavens to give light on the earth[a].
translation:
  language: tl
  text: At inilagay ng Diyos ang mga ito sa kalawakan ng langit upang magbigay ng liwanag sa lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa firmamento ng langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: inilagay
  rationale: Sa kontekstong ito, ang נתן ay tumutukoy sa sinadyang paglalagay o pagtatalaga ng mga tanglaw sa kanilang kinalalagyan; natural at malinaw sa modernong Tagalog ang “inilagay.”
- source_word: אֹתָם
  choice: sila
  rationale: Tumutukoy ang panghalip na tuwirang layon sa mga tanglaw at mga bituing binanggit sa naunang talata. Ginamit ang “sila” sapagkat karaniwang ganito ang panghalip para sa mga bagay na maramihan sa natural na Tagalog.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman maramihan ang anyo ng pangngalang Hebreo, isahan ang gamit nito rito at tumutukoy sa Maylalang; “Diyos” ang pamantayang salin.
- source_word: בִּרְקִיעַ
  choice: sa kalawakan
  rationale: Ang רָקִיעַ ay tumutukoy sa malawak na nakaunat na dako. Ang “kalawakan” ay madaling maunawaan at hindi nagpapasok ng tiyak na sinauna o makabagong modelong kosmolohikal.
- source_word: הַשָּׁמַיִם
  choice: ng langit
  rationale: Ang “ng langit” ay natural na Tagalog para sa genitibong pariralang Hebreo at pinananatili ang maringal na himig ng salaysay, kahit walang karaniwang morpolohikal na pangmaramihan ang “langit” sa Tagalog.
- source_word: לְהָאִיר
  choice: upang magbigay-liwanag
  rationale: 'Ang Hiphil infinitive ng אור ay may sanhi o transitive na diwa: hindi lamang “luminaw” o “sumikat,” kundi magbigay ng liwanag. Malinaw ding ipinapakita ng “upang” ang layunin.'
- source_word: עַל הָאָרֶץ
  choice: sa lupa
  rationale: Ipinahihiwatig ng עַל dito ang lugar o patutunguhan ng liwanag. Ang “sa lupa” ang pinakanatural na modernong Tagalog, habang maaari ring unawain ang “ibabaw ng lupa.”
theological_decisions:
- issue: Ang terminong kosmolohikal na רָקִיעַ sa salaysay ng paglikha
  choice: kalawakan ng langit
  alternative: kalangitan; firmamento ng langit; malawak na bubong ng langit
  rationale: Pinananatili ng “kalawakan” ang malawak na spatial na diwa ng salitang Hebreo nang hindi ito tahasang ginagawang solidong bubong o iniuugnay sa isang makabagong siyentipikong konsepto. Hindi rin nito inaalis ang likas na kalabuan ng sinaunang termino.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang payak na ayos ng pangungusap at “inilagay” sa halip na mas matalinghagang pandiwa. Ang “kalawakan ng langit” ay nagpapanatili sa sinaunang larawan nang hindi nagiging teknikal o arkaiko.
