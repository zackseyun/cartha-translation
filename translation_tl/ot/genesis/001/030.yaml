  text: וּֽ/לְ/כָל חַיַּ֣ת הָ֠/אָרֶץ וּ/לְ/כָל ע֨וֹף הַ/שָּׁמַ֜יִם וּ/לְ/כֹ֣ל רוֹמֵ֣שׂ עַל הָ/אָ֗רֶץ אֲשֶׁר בּ/וֹ֙ נֶ֣פֶשׁ חַיָּ֔ה אֶת כָּל יֶ֥רֶק עֵ֖שֶׂב לְ/אָכְלָ֑ה וַֽ/יְהִי כֵֽן־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/030.yaml
  text: And to every beast of the earth[a], and to every bird of the heavens, and to everything that creeps on the earth in which there is a living creature, every green plant is for food[c][b]. And it was so.
translation:
  language: tl
  text: At para sa bawat hayop sa lupa, sa bawat ibon sa langit, at sa bawat nilalang na gumagapang sa lupa na may buhay[a], ang lahat ng luntiang halaman ay pagkain. At nagkagayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “na kinaroroonan ng isang buháy na nilalang.” Ang Hebreong נֶפֶשׁ חַיָּה ay maaari ring isalin na “buháy na nilalang”; hindi ito ang pariralang Hebreo para sa “hininga ng buhay” sa Genesis 2:7.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיַּת הָאָרֶץ
  choice: hayop sa lupa
  rationale: Ang parirala ay tumutukoy sa mga hayop na naninirahan sa lupa. Ang “hayop sa lupa” ay malinaw at hindi nagdaragdag ng ideyang “mabangis,” na hindi kinakailangan dito.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ibon sa langit
  rationale: Bagaman maaaring masaklaw ng עוֹף ang mga lumilipad na nilalang, “ibon” ang likas at malinaw na katawagan sa konteksto ng Genesis 1; ang “langit” ay karaniwang salin ng שָׁמַיִם.
- source_word: כֹל רוֹמֵשׂ עַל הָאָרֶץ
  choice: bawat nilalang na gumagapang sa lupa
  rationale: Pinananatili ng “gumagapang” ang kongkretong larawan ng רמשׂ, habang nililinaw ng “nilalang” na mga buháy na hayop ang tinutukoy.
- source_word: אֲשֶׁר בּוֹ נֶפֶשׁ חַיָּה
  choice: na may buhay
  rationale: Sa kontekstong ito, inilalarawan ng נֶפֶשׁ חַיָּה ang isang buháy o may-buhay na nilalang. Ang “na may buhay” ay natural sa Filipino at hindi ito ipinagkakamali sa ibang Hebreong pariralang nangangahulugang “hininga ng buhay.” Inilalagay sa talababa ang mas literal na anyo.
- source_word: אֵת כָּל יֶרֶק עֵשֶׂב
  choice: ang lahat ng luntiang halaman
  rationale: Magkasamang tumutukoy ang יֶרֶק at עֵשֶׂב sa luntiang pananim o halaman. Ang “luntiang halaman” ay malinaw, kasalukuyan, at angkop bilang pagkaing inilaan sa mga hayop.
- source_word: לְאָכְלָה
  choice: ay pagkain
  rationale: Ang לְאָכְלָה ay nagpapahayag ng layunin—para kainin o bilang pagkain. Sa balangkas na “para sa … ay pagkain,” natural na naipahahayag sa Filipino ang iniukol na gamit.
- source_word: וַיְהִי כֵן
  choice: At nagkagayon nga
  rationale: Ito ang paulit-ulit na pormula ng katuparan sa Genesis 1. Ang “nagkagayon nga” ay natural, marangal, at nagpapahiwatig na natupad ang sinabi.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ חַיָּה para sa mga hayop
  choice: Isinalin sa pangunahing teksto bilang “may buhay,” na tumutukoy sa pagiging buháy na nilalang.
  alternative: “na may isang buháy na nilalang” o “na may buháy na kaluluwa”
  rationale: Hindi ito ang pariralang נִשְׁמַת חַיִּים, “hininga ng buhay,” sa Genesis 2:7. Iniiwasan ng salin ang paghahalo sa dalawang magkaibang parirala at hindi rin ipinapasok ang isang partikular na doktrina tungkol sa “kaluluwa.”
- issue: Nawawalang pandiwa sa talata 30
  choice: Ginamit ang pangungusap na “para sa … ang lahat ng luntiang halaman ay pagkain,” nang hindi tahasang nagdaragdag ng “ibinigay ko.”
  alternative: “Ibinibigay ko sa kanila ang lahat ng luntiang halaman bilang pagkain,” na inuulit ang pandiwa mula sa talata 29.
  rationale: Umaasa ang Hebreong pangungusap sa pandiwa ng naunang talata, ngunit wala itong tahasang pandiwa rito. Ang napiling balangkas ay kumpleto at natural sa Filipino habang hindi tahasang nagdaragdag ng pandiwang wala sa tekstong Hebreo ng talatang ito.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “langit” sa halip na “himpapawid” para sa mas karaniwang pananalita, at iniwasan ang mas lumang “halimaw,” “pananim na sariwa,” o “kaluluwang buháy.”
