  text: וְ/לִ/מְשֹׁל֙ בַּ/יּ֣וֹם וּ/בַ/לַּ֔יְלָה וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/018.yaml
  text: and to rule over the day and over the night[a], and to separate the light from the darkness. And God saw that it was good.
translation:
  language: tl
  text: upang mamahala sa araw at sa gabi, at upang ihiwalay ang liwanag sa dilim.[a] At nakita ng Diyos na ito ay mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang ipagkaiba ang liwanag sa dilim.”
    reason: Leksikal na alternatibo para sa וּלֲהַבְדִּיל, na maaaring tumukoy sa paghihiwalay o sa pagtatakda ng pagkakaiba.
lexical_decisions:
- source_word: וְ/לִ/מְשֹׁל
  choice: upang mamahala
  rationale: Ang anyong pawatas na may לְ ay nagpapahayag ng layunin o tungkulin ng mga tanglaw na binanggit sa naunang talata. Ang “mamahala” ay likas sa modernong Tagalog at pinananatili ang diwa ng משל nang hindi ipinahihiwatig na may kasarinlang banal ang mga tanglaw.
- source_word: בַּ/יּוֹם וּ/בַ/לַּיְלָה
  choice: sa araw at sa gabi
  rationale: Pinananatili nito ang magkatimbang na pares ng araw at gabi. Sa Tagalog, sapat na ang “sa” pagkatapos ng pandiwang “mamahala,” at natural ang pag-uulit nito sa ikalawang bahagi.
- source_word: וּֽ/לֲ/הַבְדִּיל
  choice: at upang ihiwalay
  rationale: Ang causative na anyo ng בדל ay tumutukoy sa pagtatakda ng pagkakahiwalay o pagkakaiba. Ang “ihiwalay” ay umaayon sa paulit-ulit na wika ng salaysay ng paglikha, habang ang posibleng diwang “ipagkaiba” ay inilagay sa talababa.
- source_word: בֵּין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ
  choice: ang liwanag sa dilim
  rationale: Kasunod ng “ihiwalay,” natural sa Tagalog ang hulma na “ihiwalay ang X sa Y.” Hindi na kailangang ulitin nang literal ang dalawang בֵּין upang maipahayag ang ugnayan.
- source_word: וַ/יַּ֥רְא אֱלֹהִ֖ים
  choice: At nakita ng Diyos
  rationale: Pinananatili ng “At” ang sunod-sunod at paulit-ulit na ritmo ng salaysay sa Genesis 1.
- source_word: כִּי טֽוֹב
  choice: na ito ay mabuti
  rationale: Ang “mabuti” ay nagpapanatili sa malawak na diwa ng טוֹב bilang maayos, angkop, at mabuti sa kaayusan ng nilikha, nang hindi ito pinakikitid sa isang pakahulugan lamang.
theological_decisions:
- issue: Ang pamamahala ng mga tanglaw sa araw at gabi
  choice: Inilalarawan ang mga tanglaw bilang binigyan ng tungkuling mamahala sa araw at gabi sa loob ng kaayusang nilikha ng Diyos.
  alternative: Maaaring gumamit ng mas personipikadong pananalita na tila nagsasabing may sarili at banal na kapangyarihan ang mga tanglaw.
  rationale: Pinananatili ng “mamahala” ang lakas ng משל, ngunit hindi nagdaragdag ng pahiwatig na ang mga tanglaw ay mga diyos o kumikilos nang hiwalay sa Diyos. Ang Diyos pa rin ang nakikitang kataas-taasang tagapag-ayos at humahatol na mabuti ang nilikha.
- issue: Saklaw ng pandiwang בדל
  choice: “ihiwalay” bilang pangunahing salin, na may “ipagkaiba” bilang leksikal na alternatibo
  alternative: Isalin lamang bilang “ipagkaiba,” na maaaring idiin ang pagkilala sa kaibahan sa halip na ang pagtatakda ng hangganan.
  rationale: Kayang taglayin ng pandiwa ang konsepto ng paghihiwalay at pagkilala sa pagkakaiba. Pinananatili sa pangunahing teksto ang konkretong galaw ng salaysay, at sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “mamahala” sa halip na mas teknikal o makalumang “magkaroon ng kapangyarihan,” at pinanatili ang maindayog na pag-uugnay ng mga sugnay sa salaysay ng Genesis.
