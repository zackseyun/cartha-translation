  edition: WLC
  text: וַ/תּוֹצֵ֨א הָ/אָ֜רֶץ דֶּ֠שֶׁא עֵ֣שֶׂב מַזְרִ֤יעַ זֶ֨רַע֙ לְ/מִינֵ֔/הוּ וְ/עֵ֧ץ עֹֽשֶׂה פְּרִ֛י אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/012.yaml
  text: And the earth brought forth vegetation[a], plants yielding seed according to their kinds, and trees bearing fruit in which is their seed, according to their kinds[b]. And God saw that it was good.
translation:
  language: tl
  text: At nagpatubo ang lupa ng luntiang halaman, mga halamang nagbubunga ng binhi ayon sa kani-kanilang uri,[a] at mga punong namumunga ng bungang may binhi sa loob nito, ayon sa kani-kanilang uri. At nakita ng Diyos na mabuti iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “uri” ay salin ng salitang Hebreo para sa isang kategorya ng mga nilikha; hindi ito ang teknikal na katawagang “species” sa modernong biyolohiya.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַתּוֹצֵא
  choice: nagpatubo
  rationale: Ang Hiphil ng יצא ay nagsasaad na pinangyari ng lupa na sumibol o lumitaw ang mga halaman. Likas sa modernong Tagalog ang “nagpatubo” at pinananatili nito ang aktibong papel ng lupa nang hindi ipinahihiwatig na ito ang tunay na manlilikha.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Sa Tagalog, “lupa” ang natural na tawag sa earth bilang pinagmumulan ng mga halaman sa talatang ito; nananatili rin itong kaayon ng malawak na konteksto ng nilikhang daigdig.
- source_word: דֶּשֶׁא
  choice: luntiang halaman
  rationale: Malawak ang saklaw ng דֶּשֶׁא at tumutukoy sa sariwa o umuusbong na pananim, hindi lamang sa damo. Ipinahahayag ng “luntiang halaman” ang pangkalahatang kategoryang ito sa paraang malinaw at marangal.
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: mga halamang nagkakabinhi
  rationale: Ipinahahayag ng parirala ang mga halamang nagkakaroon o naglalabas ng binhi. Maikli at natural ang “nagkakabinhi” at hindi nito nililimitahan ang עֵשֶׂב sa mga yerba lamang.
- source_word: לְמִינֵהוּ
  choice: ayon sa kani-kanilang uri
  rationale: Ang מִין ay tumutukoy sa uri o kategorya. Ang “kani-kanilang” ay natural na umaayon sa maramihang kolektibong pangngalan sa Tagalog habang pinananatili ang distributibong diwa ng isahang anyo sa Hebreo.
- source_word: וְעֵץ עֹשֶׂה פְּרִי אֲשֶׁר זַרְעוֹ בוֹ
  choice: at mga punong namumunga ng bungang may binhi sa loob nito
  rationale: Kolektibo ang isahang עֵץ, kaya natural ang “mga puno.” Nililinaw ng “bungang may binhi sa loob nito” ang kaugnayan ng binhi sa bunga, alinsunod sa pinakamalapit na panlalaking isahang tinutukoy ng mga panghalip sa Hebreo.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: At nakita ng Diyos na mabuti iyon
  rationale: Pinananatili nito ang paulit-ulit na pormulang pagsusuri sa Genesis 1. Natural sa Tagalog ang “iyon” bilang pagtukoy sa kalalabas lamang na nilikha.
theological_decisions:
- issue: Paglalarawan sa mga kategorya ng nilikha nang hindi ipinapasok ang makabagong taksonomiyang biyolohikal
  choice: ayon sa kani-kanilang uri
  alternative: ayon sa kani-kanilang species
  rationale: Ang Hebreong מִין ay karaniwang kategorya o uri at hindi isang teknikal na termino ng modernong agham. Iniiwasan ng “uri” ang pagpasok sa teksto ng mas huling mga pagtatalong pang-agham o pangdoktrina.
- issue: Ang kinaroroonan ng binhi sa pariralang אֲשֶׁר זַרְעוֹ בוֹ
  choice: bungang may binhi sa loob nito
  alternative: punong may binhi sa loob nito
  rationale: Ang “bunga” (פְּרִי) ang pinakamalapit na panlalaking isahang tinutukoy at natural na sisidlan ng binhi. Gayunman, hindi pinalalawak ng salin ang pahayag tungo sa isang doktrinang wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Pinanatili ang bahagyang pag-uulit ng mga katawagang tumutukoy sa halaman upang maipakita ang estruktura at mga kategorya ng tekstong Hebreo.
