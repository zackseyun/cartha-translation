base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/029.yaml
  text: And God said[a], “Behold, I have given you every seed-bearing plant that is on the face of all the earth, and every tree in which is the fruit of a tree bearing seed[c][b]. It will be for you as food.”
translation:
  language: tl
  text: At sinabi ng Diyos, “Narito,[a] ibinigay ko sa inyo ang bawat halamang nagbubunga ng binhi na nasa buong ibabaw ng lupa, at ang bawat punong may bungang may binhi.[b] Ang mga ito ay magiging pagkain ninyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tingnan ninyo.” Ang “Narito” ay nagsisilbing pantawag-pansin sa kasunod na pahayag.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “bawat puno na kinaroroonan ng bungang-puno na nagbubunga ng binhi.” Masalimuot ang ayos ng pariralang Hebreo; tumutukoy ito sa punong may bungang nagtataglay ng binhi.'
    reason: source_structure
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Isang natural at marangal na panandang pantawag-pansin sa makabagong Filipino; pinananatili nito ang demonstratibong diin ng Hebreo nang hindi gumagamit ng lipas na pananalita.
- source_word: נָתַתִּי
  choice: ibinigay ko
  rationale: Inihahayag ng Hebreong perfect ang isang natapos na pagkakaloob na may bisa sa kasalukuyan; malinaw itong naipapahayag ng aspektong perpektibo sa Filipino.
- source_word: כָּל עֵשֶׂב זֹרֵעַ זֶרַע
  choice: ang bawat halamang nagkakabinhi
  rationale: Malawak ang saklaw ng עֵשֶׂב at hindi lamang tumutukoy sa halamang-gamot. Ipinapahayag ng “nagkakabinhi” ang halamang lumilikha o nagtataglay ng binhi nang maikli at natural.
- source_word: אֲשֶׁר עַל־פְּנֵי כָל־הָאָרֶץ
  choice: na nasa ibabaw ng buong lupa
  rationale: Pinananatili ang larawang pangkalawakan ng Hebreong “sa ibabaw/mukha ng buong lupa” habang iniiwasan ang masyadong literal at di-likas na “sa mukha ng lupa.”
- source_word: כָּל הָעֵץ
  choice: ang bawat puno
  rationale: Ang כָּל na sinusundan ng pangngalang isahan ay may distributibong diwa; katumbas nito sa Filipino ang “bawat puno.”
- source_word: אֲשֶׁר בּוֹ פְרִי עֵץ זֹרֵעַ זָרַע
  choice: ang bunga ay may binhi
  rationale: Natural nitong ipinapahayag na ang bunga ng bawat punong tinutukoy ay nagtataglay ng binhi, nang hindi pinipilit ang Hebreong ayos ng mga salita.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: Ang mga ito ay magiging pagkain ninyo
  rationale: Malinaw na ibinabalik ng “mga ito” ang tumutukoy sa mga halaman at puno; natural sa Filipino ang maramihang anyo kahit kolektibong isahan ang pandiwa sa Hebreo.
theological_decisions:
- issue: Saklaw ng ipinagkaloob na pagkain
  choice: Pinanatiling tahasang tumutukoy ang talata sa mga halamang nagkakabinhi at mga punong may bungang may binhi.
  alternative: Palawakin ang pahayag bilang pangkalahatang utos tungkol sa lahat ng maaaring kainin.
  rationale: Ang Hebreo ay naglilista ng mga ipinagkaloob sa tao ngunit hindi nito tahasang nilulutas rito ang lahat ng susunod na tanong tungkol sa pagkain; hindi dapat dagdagan ng salin ang teolohikal na implikasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Narito” bilang pormal ngunit buhay pang panandang pantawag-pansin, at pinagaan ang masalimuot na ayos ng pariralang Hebreo tungkol sa bunga at binhi nang hindi binabago ang diwa.
