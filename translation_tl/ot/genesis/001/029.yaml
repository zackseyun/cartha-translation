    rationale: Ang Hebreo ay isang masalimuot na parirala tungkol sa punong kinaroroonan ng bungang-puno na nagdadala ng binhi. Dapat ipaliwanag ang estruktura nang hindi ipinipilit ang hindi likas na literal na Filipino.
