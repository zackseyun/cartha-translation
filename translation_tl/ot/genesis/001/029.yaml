revisions:
- from: At sinabi ng Diyos, “Narito,[a] ibinigay ko sa inyo ang bawat halamang nagkakabinhi na nasa ibabaw ng buong lupa, at ang bawat punong ang bunga ay may binhi.[b] Ang mga ito ay magiging pagkain ninyo.”
  to: At sinabi ng Diyos, “Narito,[a] ibinigay ko sa inyo ang bawat halamang nagbubunga ng binhi na nasa buong ibabaw ng lupa, at ang bawat punong may bungang may binhi.[b] Ang mga ito ay magiging pagkain ninyo.”
  rationale: 'Inayos ang ikalawang sugnay upang maging gramatikal at natural sa modernong Filipino habang pinananatili ang saklaw ng Hebreo: bawat puno na may bungang may binhi. Pinalitan ang “nagkakabinhi” ng “nagbubunga ng binhi” para sa mas malinaw na paglalarawan ng halamang seed-bearing. Hindi binago ang kolektibong “Ang mga ito” bilang pagkain, na likas sa Filipino at tapat sa tinutukoy na dalawang pangkat ng ipinagkaloob.'
