  text: And there was evening[a], and there was morning—the fourth day.
translation:
  language: tl
  text: At nagkaroon ng gabi, at nagkaroon ng umaga—ang ikaapat na araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na salin, “At nagkaroon ng gabi at nagkaroon ng umaga—ikaapat na araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: at nagkaroon
  rationale: Ipinananatili nito ang eksistensiyal na diwa ng היה at ang paulit-ulit na pormula ng salaysay, nang hindi ipinapalagay na ang kahulugan ay tiyak na ‘naging.’
- source_word: עֶרֶב
  choice: gabi
  rationale: Sa pormulang ito, ang ‘gabi’ ay natural at malinaw na katumbas sa modernong Tagalog ng panahong tinutukoy ng עֶרֶב.
- source_word: וַיְהִי
  choice: at nagkaroon
  rationale: Pareho ang salin sa unang paglitaw upang mapanatili ang ritmo at paralelismong Hebreo.
- source_word: בֹקֶר
  choice: umaga
  rationale: Direkta, karaniwan, at natural na katumbas ito ng בֹקֶר sa paulit-ulit na pormula ng paglikha.
- source_word: יוֹם רְבִיעִי
  choice: ang ikaapat na araw
  rationale: Natural na paraan ito sa Tagalog upang tukuyin ang araw ayon sa ordinal na bilang; idinaragdag ang pantukoy para sa malinaw at karaniwang pagpapahayag.
theological_decisions:
- issue: Paglalahad sa pormula ng araw ng paglikha nang hindi nagpapasok ng tiyak na pananaw tungkol sa kronolohiya o haba ng mga araw
  choice: At nagkaroon ng gabi, at nagkaroon ng umaga—ang ikaapat na araw.
  alternative: At nagkaroon ng gabi at nagkaroon ng umaga, isang ikaapat na araw.
  rationale: Tuwirang pinananatili ng salin ang mga salitang gabi, umaga, at ikaapat na araw, ngunit hindi nito nilulutas ang mas malawak na usapin tungkol sa kalikasan o haba ng mga araw ng paglikha.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang maindayog at paulit-ulit na hulma ng Hebreo; ginamit ang em dash upang natural na ipakilala ang ordinal na pagtukoy sa araw.
