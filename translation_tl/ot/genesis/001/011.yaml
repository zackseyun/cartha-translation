- from: 'At sinabi ng Diyos, “Patubuin ng lupa[a] ang mga halaman: mga halamang naglalabas ng binhi at mga punong namumunga ayon sa kani-kanilang uri[b], na may binhi sa loob nito[c], sa ibabaw ng lupa.” At nagkagayon nga.'
