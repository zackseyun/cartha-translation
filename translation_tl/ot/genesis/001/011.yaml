  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָ/אָ֨רֶץ֙ דֶּ֔שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְ/מִינ֔/וֹ אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/011.yaml
  text: 'And God said[a], “Let the earth sprout vegetation: plants yielding seed, and fruit trees bearing fruit according to their kinds, with their seed in them[c][b], on the earth.” And it was so.'
translation:
  language: tl
  text: 'At sinabi ng Diyos, “Magpasibol ang lupa[a] ng mga halaman: mga halamang nagbubunga ng binhi at mga punong namumunga ayon sa kani-kanilang uri[b], na ang binhi ay nasa mga ito[c], sa ibabaw ng lupa.” At nagkagayon nga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Patubuin ng lupa ang mga halaman.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ayon sa uri nito”; ginamit ang isahan nang distributibo para sa iba’t ibang pangkat.
    reason: lexical_alternative
  - marker: c
    text: O “na ang binhi nito ay nasa loob nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּדְשֵׁא
  choice: Patubuin ng lupa
  rationale: Ipinahahayag nito ang pautos-pahintulot na diwa ng Hiphil jussive at ang larawan ng pagsibol mula sa lupa, sa natural na makabagong Tagalog.
- source_word: דֶּשֶׁא
  choice: mga halaman
  rationale: Malawak at kolektibong katawagan ito sa sariwang pananim; hindi ito pinakikitid sa damo lamang.
- source_word: עֵשֶׂב
  choice: mga halaman
  rationale: Tumutukoy ito sa mga halamang hindi punongkahoy. Ang konteksto at kasunod na pariralang “naglalabas ng binhi” ang nagpapanatili sa pagkakaiba nito sa mga punong namumunga.
- source_word: מַזְרִיעַ זֶרַע
  choice: naglalabas ng binhi
  rationale: Natural itong pahayag sa Tagalog para sa patuloy na katangian ng halaman na magluwal o magprodyus ng binhi, nang hindi ginagamit ang teknikal o di-likas na pananalita.
- source_word: עֵץ פְּרִי עֹשֶׂה פְּרִי
  choice: mga punong namumunga
  rationale: Pinagsasama nito nang malinaw at natural ang “punong namumunga” at ang kilos na pagbunga, habang pinananatili ang kolektibong uri.
- source_word: לְמִינוֹ
  choice: ayon sa kani-kanilang uri
  rationale: Bagaman isahan ang anyong Hebreo, distributibo ang gamit nito. Ang “kani-kanilang” ay likas sa Tagalog at tumutukoy sa bawat uring binanggit.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: na may binhi sa loob nito
  rationale: Pinananatili ng isahang panghalip ang porma at bahagyang kalabuan ng Hebreo hinggil sa tinutukoy ng “nito,” sa halip na tahasang ipasya na bunga o puno lamang ang tinutukoy.
- source_word: עַל הָאָרֶץ
  choice: sa ibabaw ng lupa
  rationale: Tuwirang lokatibong pahayag ito na angkop sa tagpo ng paglikha.
- source_word: וַיְהִי כֵן
  choice: At nagkagayon nga
  rationale: Natural at marangal na pormula ito ng katuparan sa Tagalog; ipinahihiwatig ng “nga” na natupad ang sinabi.
theological_decisions:
- issue: Saklaw at diwa ng mga kategorya ng halamang nilikha
  choice: Isinalin ang mga ito bilang malalawak na pangkat ng mga halaman at mga punong namumunga, habang pinananatili ang pagkakaiba ng mga kategorya sa teksto.
  alternative: Gawing mas tiyak na “damo, halamang nagbubunga ng binhi, at punong namumunga,” o pag-isahin ang lahat bilang “lahat ng uri ng halaman at puno.”
  rationale: Inilalarawan ng talata ang maayos na mga pangkat ng buhay-halaman sa karaniwang wika ng pagmamasid. Hindi dapat ipasok ang makabagong taksonomiyang botanikal, ngunit hindi rin dapat burahin ang mga pagkakaibang nasa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang arkaikong bokabularyo at sobrang teknikal na terminolohiya, habang pinananatili ang solemneng indayog ng salaysay at ang kalabuan ng isahang panghalip sa pariralang tungkol sa binhi.
