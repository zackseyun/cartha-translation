  text: וְ/הָ/אָ֗רֶץ הָיְתָ֥ה תֹ֨הוּ֙ וָ/בֹ֔הוּ וְ/חֹ֖שֶׁךְ עַל פְּנֵ֣י תְה֑וֹם וְ/ר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/002.yaml
  text: And the earth was formless and empty[a], and darkness was over the surface of the deep, and the Spirit of God was hovering over the surface of the waters.
translation:
  language: tl
  text: At ang lupa ay walang anyo at walang laman, at ang dilim ay nasa ibabaw ng kalaliman, at ang Espiritu ng Diyos[a] ay pumapailanlang sa ibabaw ng mga tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang hangin mula sa Diyos” o “ang hangin ng Diyos” ang pumapailanlang sa ibabaw ng mga tubig.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: At ang lupa
  rationale: Ang וְ ay nag-uugnay sa naunang pahayag, kaya pinanatili bilang “At”; ang הָאָרֶץ ay likas na “ang lupa.”
- source_word: הָיְתָה
  choice: ay
  rationale: Gumaganap itong stative copula, “was,” hindi kinakailangang “naging”; sa Tagalog, natural itong ipinahahayag ng panandang “ay.”
- source_word: תֹהוּ וָבֹהוּ
  choice: walang anyo at walang laman
  rationale: Malinaw at kasalukuyang pananalita ito para sa di-pa-nabubuong kalagayan at kawalan, habang pinananatili ang magkatambal na mga termino.
- source_word: וְחֹשֶׁךְ
  choice: at ang dilim
  rationale: Tuwirang katumbas na nagpapatuloy sa magkakaugnay na paglalarawan.
- source_word: עַל־פְּנֵי
  choice: sa ibabaw ng
  rationale: Natural na Tagalog na nagpapanatili sa larawang panlunan ng literal na “sa ibabaw/mukha ng.”
- source_word: תְהוֹם
  choice: kalaliman
  rationale: Tumutukoy sa malalim na katubigan o kailaliman; iniiwasan nitong magdagdag ng mitolohikal na kahulugang wala sa teksto.
- source_word: וְרוּחַ אֱלֹהִים
  choice: at ang Espiritu ng Diyos
  rationale: Ang רוּחַ ay maaaring “espiritu,” “hangin,” o “hininga.” Pinili sa pangunahing teksto ang matibay at tradisyonal na pagbasa na “Espiritu ng Diyos,” habang pinananatili sa talababa ang tunay na posibilidad na “hangin mula sa Diyos” o “hangin ng Diyos.”
- source_word: מְרַחֶפֶת
  choice: ay lumilipad-lipad
  rationale: Ang participle ay nagpapahiwatig ng patuloy na pagkilos; ang “lumilipad-lipad” ay naglalarawan ng pagkilos na nananatili o pumapagaspas sa ibabaw, nang hindi ipinapalagay na simpleng paggalaw lamang.
- source_word: הַמָּיִם
  choice: mga tubig
  rationale: Pinananatili ang anyong maramihan at ang larawan ng malawak na sinaunang katubigan.
theological_decisions:
- issue: Kung ang הָיְתָה ay stative na “was” o nagpapahiwatig ng pagbabago na “became”
  choice: ay / nasa gayong kalagayan
  alternative: naging
  rationale: Inilalarawan ng talata ang kalagayan ng lupa sa yugtong ito. Hindi hinihingi ng Hebreo ang pagbasa na nagkaroon ng pagbabago, kaya hindi nagpasok ng teolohikal na rekonstruksiyon ang salin.
- issue: Kung ang וְרוּחַ אֱלֹהִים ay tumutukoy sa Espiritu ng Diyos o sa hanging mula sa Diyos
  choice: ang Espiritu ng Diyos
  alternative: isang hanging mula sa Diyos / ang hangin ng Diyos
  rationale: Tunay na malabo ang pariralang Hebreo sa puntong ito. Ginamit sa pangunahing teksto ang personal at tradisyonal na pagbasa, ngunit tahasang pinanatili sa talababa ang meteorolohikal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang panimulang “At” bilang katumbas ng pang-ugnay na וְ. Ginamit ang “walang anyo at walang laman” dahil malinaw ito sa karaniwang mambabasa, at inilagay ang [a] kaagad pagkatapos ng “Espiritu ng Diyos” sapagkat doon nakatuon ang leksikal na kalabuan.
