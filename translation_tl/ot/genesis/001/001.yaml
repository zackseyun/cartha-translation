  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: tl
  text: Sa pasimula, nang likhain ng Diyos ang kalangitan at ang lupa[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Ayon sa tradisyon, isinasalin ito bilang ganap na pangungusap: “Sa pasimula, nilikha ng Diyos ang kalangitan at ang lupa.” Maaari ring basahin ang Hebreo—בְּרֵאשִׁית na walang pantukoy, kasunod ang pandiwang בָּרָא—bilang sugnay na panahunan na nakasalalay sa kasunod, katulad ng Genesis 2:4b. Sa pagbabasang ito, ang pangunahing sugnay ay nasa talata 3: “Sinabi ng Diyos, ‘Magkaroon ng liwanag.’”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: Sa pasimula, nang … likhain
  rationale: Pinananatili ng “Sa pasimula” ang leksikal na diwa ng רֵאשִׁית, habang ipinahihiwatig ng “nang” ang malamang na gamit nito bilang sugnay na panahunan na umaakay sa pangunahing sugnay sa talata 3.
- source_word: בָּרָא
  choice: likhain
  rationale: Ang “likhain” ang tuwiran at kinikilalang katumbas ng pandiwang ginagamit para sa paglikha ng Diyos, nang hindi ipinapalagay ang paraan ng paglikha.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang pangngalang Hebreo, isahan ang pandiwang kaugnay nito rito, kaya iisang Diyos ang tinutukoy.
- source_word: אֵת
  choice: '[hindi isinalin; pananda ng tiyak na tuwirang layon]'
  rationale: Walang tuwirang katumbas sa Tagalog ang panandang Hebreong ito; naipakikita ang tungkulin nito sa ayos at balarila ng pangungusap.
- source_word: הַשָּׁמַיִם
  choice: ang kalangitan
  rationale: Ang “kalangitan” ay natural na kolektibong katumbas sa modernong Tagalog at, kasama ng “lupa,” ay tumutukoy sa kabuuan ng nilikhang kaayusan.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Sa tambalang kosmiko na “kalangitan at lupa,” ang kahulugan ay ang lupa o daigdig, hindi lamang isang lupain.
theological_decisions:
- issue: Sintaks ng pambungad na sugnay
  choice: 'Sugnay na panahunan na nakasalalay: “Sa pasimula, nang likhain ng Diyos ang kalangitan at ang lupa—”'
  alternative: 'Ganap at nagsasariling pangungusap: “Sa pasimula, nilikha ng Diyos ang kalangitan at ang lupa.”'
  rationale: Ang בְּרֵאשִׁית na walang pantukoy, kasunod ang tahasang pandiwang בָּרָא, ay natural na mababasa bilang pambungad na sugnay na panahunan, gaya ng mga kahawig na balangkas sa Genesis 2:4b at Hosea 1:2. Pinananatili sa talababa ang tradisyonal na pagbasa upang hindi ikubli ang tunay na ambiguwidad at kasaysayan ng pagtanggap sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Sa pasimula” sa halip na mas kolokyal na “Noong una” upang mapanatili ang pormal at panitikang himig; ginamit ang “kalangitan” bilang likas na kolektibong anyo. Ang gitling sa dulo ay sadyang nagpapakitang nagpapatuloy ang pangungusap sa mga susunod na talata.
