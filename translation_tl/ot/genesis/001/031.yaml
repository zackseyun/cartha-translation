    rationale: Ang Hebreong pormula ay gumagamit ng 'to be/happen,' hindi ng pandiwang 'to come.' Maaaring magmungkahi ang 'dumating' ng paglapit o pagdating na wala sa pinagmulan. Ang 'Nagkaroon' ay modernong Tagalog, malinaw, at mas malapit sa pormula.
