  yaml_path: translation/ot/genesis/001/031.yaml
  text: And God saw all that he had made, and behold, it was very good. And there was evening and there was morning, the sixth day.
translation:
  language: tl
  text: At nakita ng Diyos ang lahat ng kanyang ginawa, at tunay ngang napakabuti nito. Nagkaroon ng gabi at nagkaroon ng umaga—ang ikaanim na araw.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: At nakita
  rationale: Tuwirang inilalarawan ng ראה sa anyong pasalaysay ang pagkakita ng Diyos; ipinahihiwatig ng konteksto ang pagtatasa nang hindi ito idinaragdag sa salin.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman anyong maramihan ang pangngalan, isahan ang pandiwang kaakibat nito at tumutukoy ito sa iisang Maylalang sa Genesis 1.
- source_word: כָּל אֲשֶׁר עָשָׂה
  choice: ang lahat ng kanyang ginawa
  rationale: Saklaw nito ang kabuuan ng nilikha. Natural sa modernong Tagalog ang parirala at hindi kailangang tahasang idagdag ang aspektong 'natapos na' sapagkat malinaw iyon sa konteksto.
- source_word: וְהִנֵּה
  choice: at tunay ngang
  rationale: Ang הִנֵּה ay pantawag-pansin at nagbibigay-diin. Sa kasalukuyang Tagalog, pinananatili ng 'tunay ngang' ang diin at maringal na himig nang hindi gumagamit ng lipas o di-natural na 'masdan.'
- source_word: טוֹב מְאֹד
  choice: napakabuti
  rationale: Pinagsasama ng 'napakabuti' ang kahulugang 'mabuti' at ang matinding pagpapalakas ng מְאֹד, habang iniiwasang limitahan ang kabutihan sa moral, estetiko, o praktikal na kategorya lamang.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: Dumating ang gabi at dumating ang umaga
  rationale: Natural na Tagalog ito para sa paulit-ulit na pormulang pasalaysay at pinananatili ang pagkakasunod ng gabi at umaga.
- source_word: יוֹם הַשִּׁשִּׁי
  choice: ang ikaanim na araw
  rationale: Tuwirang tinutumbasan nito ang pangngalan at tiyak na bilang-panunuran sa Hebreo.
theological_decisions:
- issue: Saklaw ng kabutihan ng nilikha sa טוֹב מְאֹד
  choice: napakabuti
  alternative: lubhang mabuti
  rationale: Pinananatili ng salin ang malawak na pagpapatibay sa kabutihan ng nilikha nang hindi ipinapakahulugang ito ay moral, estetiko, o kapaki-pakinabang lamang.
- issue: Pormula ng araw at mga pagtatalo tungkol sa mga araw ng paglikha
  choice: Dumating ang gabi at dumating ang umaga—ang ikaanim na araw
  alternative: Nagkaroon ng gabi at nagkaroon ng umaga—ikaanim na araw
  rationale: Malapit ito sa pagkakasunod at pormula ng Hebreo, ngunit hindi nagdaragdag ng paliwanag tungkol sa haba o pampanitikang tungkulin ng araw.
- issue: Referente ng panghalip matapos ang טוֹב מְאֹד
  choice: napakabuti nito
  alternative: napakabuti ang lahat ng iyon
  rationale: Ang 'nito' ay natural na bumabalik sa kabuuan ng lahat ng ginawa ng Diyos at hindi nagpapasok ng karagdagang teolohikal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang maindayog na pormula ng talata; ginamit ang em dash upang ihiwalay ang pangwakas na pagtukoy sa ikaanim na araw. Walang kailangang talababa.
