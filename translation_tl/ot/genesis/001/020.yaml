base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/020.yaml
  text: And God said[a], “Let the waters swarm with swarms of living creatures[c][b], and let birds fly above the earth across the face of the expanse of the heavens.”
translation:
  language: tl
  text: At sinabi ng Diyos, “Maglipana sa tubig ang mga nilalang na may buhay[a], at lumipad ang mga ibon[b] sa ibabaw ng lupa, sa kahabaan ng kalawakan[c] ng langit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, magkaugnay ang pandiwa at pangngalan—parang “maglipana ng mga naglilipanang nilalang”—upang idiin ang saganang buhay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga nilalang na lumilipad.” Mas malawak kaysa “mga ibon” ang maaaring saklaw ng Hebreong עוֹף.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “balantok” o “firmamento.” Pinagtatalunan ang tiyak na larawang ipinahihiwatig ng Hebreong רְקִיעַ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili ang sunod-sunod na daloy ng salaysay na ipinahihiwatig ng waw-consecutive nang hindi dinaragdagan ang ugnayan.
- source_word: יִשְׁרְצוּ ... שֶׁרֶץ
  choice: Maglipana ... ang napakaraming
  rationale: Ang pandiwa at kauri nitong pangngalan ay nagbibigay-diin sa masagana at masiglang pagdami. Natural sa modernong Tagalog ang “maglipana” at “napakaraming,” bagaman hindi nito matutumbasan nang tuwiran ang Hebreong pag-uulit.
- source_word: הַמַּיִם
  choice: sa tubig
  rationale: Sa Tagalog, karaniwang pangmaramihang kahulugan na rin ang “tubig” sa ganitong konteksto; ang “mga tubig” ay hindi natural.
- source_word: נֶפֶשׁ חַיָּה
  choice: mga nilalang na may buhay
  rationale: Tumutukoy rito sa mga buháy na nilalang at hindi sa isang teknikal na doktrina tungkol sa kaluluwa.
- source_word: וְעוֹף
  choice: ang mga ibon
  rationale: Malinaw at natural sa konteksto, habang kinikilala sa talababa na maaaring mas malawak ang saklaw ng Hebreo.
- source_word: יְעוֹפֵף
  choice: lumipad
  rationale: Tuwirang ipinapahayag ang jussive na utos o pahintulot sa modernong Tagalog.
- source_word: עַל הָאָרֶץ
  choice: sa ibabaw ng lupa
  rationale: Ipinakikita ang paglipad sa itaas ng lupa, hindi ang pagdikit sa ibabaw nito.
- source_word: עַל פְּנֵי
  choice: sa harap ng
  rationale: Pinananatili ang konkretong larawang “sa mukha/harap ng” at ang kaugnayang pangkalawakan nang hindi lubusang pinapantay sa simpleng “sa.”
- source_word: רְקִיעַ הַשָּׁמָיִם
  choice: kalawakan ng langit
  rationale: Ang “kalawakan” ay malinaw at hindi lipas na salin ng רְקִיעַ; iniiwasan nitong ipilit ang isang tiyak at pinagtatalunang modelong kosmolohikal.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa salaysay ng paglikha
  choice: mga nilalang na may buhay
  alternative: mga buháy na kaluluwa
  rationale: Sa kontekstong ito, ang parirala ay tumutukoy sa mga nilalang na may buhay; ang “kaluluwa” ay maaaring magpasok ng teknikal na kahulugang antropolohikal na hindi hinihingi ng talata.
- issue: Paglalarawan sa רְקִיעַ
  choice: kalawakan
  alternative: matibay na balantok
  rationale: Pinananatili ng “kalawakan” ang pagiging bukás ng salitang Hebreo at hindi nagpapasya para sa isang partikular na pisikal na modelo ng kalangitan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “maglipana” upang maipahiwatig ang kasaganaan at masiglang pagkilos; iniwasan ang di-natural na literal na pag-uulit ng Hebreo. Ang “sa harap ng kalawakan ng langit” ay bahagyang pormal upang mapanatili ang konkretong larawan ng עַל פְּנֵי.
