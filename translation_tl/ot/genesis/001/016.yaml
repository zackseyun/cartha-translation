  text: וַ/יַּ֣עַשׂ אֱלֹהִ֔ים אֶת שְׁנֵ֥י הַ/מְּאֹרֹ֖ת הַ/גְּדֹלִ֑ים אֶת הַ/מָּא֤וֹר הַ/גָּדֹל֙ לְ/מֶמְשֶׁ֣לֶת הַ/יּ֔וֹם וְ/אֶת הַ/מָּא֤וֹר הַ/קָּטֹן֙ לְ/מֶמְשֶׁ֣לֶת הַ/לַּ֔יְלָה וְ/אֵ֖ת הַ/כּוֹכָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/016.yaml
  text: 'And God made the two great lights: the greater light to rule the day[a], and the lesser light to rule the night, and the stars.'
translation:
  language: tl
  text: 'At ginawa ng Diyos ang dalawang malalaking tanglaw: ang mas malaking tanglaw upang mamahala sa araw, ang mas maliit na tanglaw upang mamahala sa gabi, at ang mga bituin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, nang mas tahasan: “at pati ang mga bituin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: At ginawa
  rationale: Karaniwang nangangahulugang “gumawa” ang עשה. Tapat at likas sa Filipino ang “ginawa,” samantalang ang “itinalaga” ay magdaragdag ng kahulugang mula sa konteksto ng tungkulin.
- source_word: אֱלֹהִים
  choice: ng Diyos
  rationale: May pang-isahang pandiwa rito ang אֱלֹהִים at tumutukoy sa Diyos; ang “Diyos” ang karaniwan at tumpak na salin.
- source_word: שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים
  choice: ang dalawang dakilang tanglaw
  rationale: Ang מָאוֹר ay bagay na nagbibigay-liwanag o luminary. Pinananatili ng “tanglaw” ang kongkretong larawan at ang “dakila” ay tuwirang kumakatawan sa גָּדֹל nang hindi pinapangalanan ang araw at buwan.
- source_word: הַמָּאוֹר הַגָּדֹל
  choice: ang mas malaking tanglaw
  rationale: Bagaman literal na “ang malaking tanglaw,” malinaw at natural sa paghahambing na pares ang “mas malaking tanglaw.”
- source_word: לְמֶמְשֶׁלֶת הַיּוֹם
  choice: upang mamahala sa araw
  rationale: Ang מֶמְשֶׁלֶת ay tumutukoy sa pamamahala o paghahari. Natural sa modernong Filipino ang “upang mamahala sa araw” at hindi nito pinatitindi ang larawan tungo sa mas mabigat na “maghari.”
- source_word: הַמָּאוֹר הַקָּטֹן
  choice: ang mas maliit na tanglaw
  rationale: Ang קָטֹן ay “maliit” o “mas maliit.” Pinananatili ng salin ang balanseng paghahambing sa mas malaking tanglaw.
- source_word: לְמֶמְשֶׁלֶת הַלַּיְלָה
  choice: upang mamahala sa gabi
  rationale: Kapareho ito ng naunang kayarian at kahulugan; pinananatili ang paralelismo.
- source_word: וְאֵת הַכּוֹכָבִים
  choice: at ang mga bituin
  rationale: Ipinakikilala ng pangatnig at pananda sa tuwirang layon ang isa pang bagay na ginawa. Pinananatili ng payak na “at ang mga bituin” ang maikli at pahabol na dating ng Hebreo.
theological_decisions:
- issue: Paglalarawan sa mga bagay sa langit nang hindi pinapangalanan ang araw at buwan
  choice: “mas malaking tanglaw” at “mas maliit na tanglaw”
  alternative: “araw” at “buwan”
  rationale: מָאוֹר (“tanglaw” o “bagay na nagbibigay-liwanag”) ang ginamit ng Hebreo sa halip na karaniwang mga pangalan para sa araw at buwan. Pinananatili ng salin ang sadyang pananalita ng pinagmulan at hindi nagdaragdag ng mga pangalang wala sa talata.
- issue: Diwa ng מֶמְשֶׁלֶת
  choice: “mamamahala”
  alternative: “maghahari”
  rationale: Saklaw ng salita ang pamamahala o kapangyarihan. Ang “mamamahala” ay nagpapanatili sa diwa nang hindi nagdaragdag ng posibleng mas maharlika o personipikadong himig ng “maghahari.”
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tanglaw” upang mapanatili ang katawagan ng Hebreo at maiwasang tahasang ipalit ang “araw” at “buwan.” Nasa pangunahing teksto ang panandang [a], gaya ng hinihingi.
