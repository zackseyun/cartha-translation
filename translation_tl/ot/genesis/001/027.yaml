id: GEN.1.27
reference: Genesis 1:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּבְרָ֨א אֱלֹהִ֤ים אֶת הָֽ/אָדָם֙ בְּ/צַלְמ֔/וֹ בְּ/צֶ֥לֶם אֱלֹהִ֖ים בָּרָ֣א אֹת֑/וֹ זָכָ֥ר וּ/נְקֵבָ֖ה בָּרָ֥א אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/027.yaml
  text: So God created man in his image[a]; in the image of God he created him; male and female he created them.
translation:
  language: tl
  text: Kaya nilikha ng Diyos ang tao[a] ayon sa kanyang larawan; ayon sa larawan ng Diyos ay nilikha niya siya; lalaki at babae ay nilikha niya sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang sangkatauhan.” Ang salitang Hebreo na ’adam ay nasa anyong isahan dito ngunit kumakatawan sa sangkatauhan bilang kabuuan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרָא / בָּרָא
  choice: nilikha
  rationale: Ang “nilikha” ang likas at marangal na salin para sa pandiwang ברא sa konteksto ng paglikha ng Diyos. Inulit ito nang tatlong beses upang mapanatili ang diin at pagkakatulad ng mga linya sa Hebreo.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman maramihan ang anyong morpolohikal, ang kaakibat na pandiwa ay isahan at tumutukoy rito sa iisang Diyos.
- source_word: הָאָדָם
  choice: ang tao
  rationale: Ang “tao” ay likas sa modernong Tagalog at maaaring tumukoy sa sangkatauhan bilang kabuuan. Pinananatili ng panghalip na isahan at ng talababa ang paglipat ng Hebreo mula sa kinatawang isahan tungo sa maramihang “sila.”
- source_word: בְּצַלְמוֹ
  choice: ayon sa kanyang larawan
  rationale: Ang “ayon sa kanyang larawan” ay natural na Tagalog para sa pagkalikhang tumutugma sa larawan ng Diyos, at pinananatili ang panghalip na tumutukoy sa Diyos.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: ayon sa larawan ng Diyos
  rationale: Inuulit ang “larawan” upang mapanatili ang paralelismo at diin ng tekstong Hebreo.
- source_word: אֹתוֹ
  choice: siya
  rationale: Pinananatili ng isahang “siya” ang gramatikal na isahan ng הָאָדָם bago ang sadyang paglipat sa maramihan sa hulihan ng talata.
- source_word: זָכָר וּנְקֵבָה
  choice: lalaki at babae
  rationale: Ito ang malinaw at karaniwang salin sa Tagalog para sa magkatambal na katawagang tumutukoy sa kasariang lalaki at babae.
- source_word: אֹתָם
  choice: sila
  rationale: Pinananatili ng maramihang “sila” ang paglipat ng Hebreo mula sa sangkatauhang inilalarawan sa isahan tungo sa mga taong lalaki at babae.
theological_decisions:
- issue: Ang kinatawang-isahang gamit ng אָדָם
  choice: ang tao
  alternative: ang sangkatauhan
  rationale: Ang “ang tao” ay nagpapanatili sa anyong isahan at sa kasunod na “siya,” habang maaari pa ring kumatawan sa buong sangkatauhan. Nililinaw ng talababa ang saklaw nang hindi inaalis ang sadyang tensiyon sa pagitan ng isahan at maramihan.
- issue: Ang kahulugan ng ב sa mga pariralang tungkol sa larawan
  choice: ayon sa kanyang larawan / ayon sa larawan ng Diyos
  alternative: bilang kanyang larawan / bilang larawan ng Diyos
  rationale: Ang “ayon sa” ang pinakanatural na pagbasa sa konteksto, ngunit hindi ginagawang tahasang pahayag na ang tao mismo ang larawan; iniiwasan nitong lutasin nang lampas sa sinasabi ng talata ang mas malawak na usaping teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tatlong ulit na “nilikha,” ang dalawang ulit na “larawan,” at ang sadyang paglipat mula sa isahang “siya” tungo sa maramihang “sila.”
