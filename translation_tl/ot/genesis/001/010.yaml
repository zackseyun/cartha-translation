base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/010.yaml
  text: And God called the dry land Earth[a], and the gathering of the waters he called Seas. And God saw that it was good.
translation:
  language: tl
  text: Tinawag ng Diyos na Lupa ang tuyong lupa, at ang natipong tubig ay tinawag niyang mga Dagat. At nakita ng Diyos na mabuti ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  choice: tinawag
  rationale: Ipinahahayag ng pandiwa rito ang pagbibigay ng pangalan; pinananatili ng “tinawag” ang inuulit na kayarian ng Hebreo at natural ito sa Filipino.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang pangngalang Hebreo, isahan ang pandiwang kaugnay nito at tumutukoy ito sa iisang Maylalang.
- source_word: לַיַּבָּשָׁה
  choice: ang tuyong bahagi
  rationale: Tumutukoy ito sa tuyong bahagi na ipinagkaiba sa natipong tubig. Malinaw at natural ang pariralang ito sa modernong Filipino.
- source_word: אֶרֶץ
  choice: Lupa
  rationale: Sa pormula ng pagpapangalan, ang “Lupa” ang pangalang ibinigay sa tuyong bahagi. Ang malaking titik ay naghahayag ng gamit nito bilang pangalan, hindi ng makabagong siyentipikong pakahulugan sa planeta.
- source_word: מִקְוֵה הַמַּיִם
  choice: ang natipong tubig
  rationale: Ang מִקְוֵה ay tumutukoy sa natipon o pinagsama-samang kalipunan. Mas natural sa Filipino ang “natipong tubig” kaysa literal na “pagtitipon ng mga tubig,” habang napapanatili ang diwa ng pinagmulan.
- source_word: יַמִּים
  choice: mga Dagat
  rationale: Maramihan ang pangngalan at tumutukoy sa mga kalipunan ng tubig. Ipinakikita ng malaking titik ang tungkulin nito bilang pangalang ibinigay sa talata.
- source_word: וַיַּרְא
  choice: nakita
  rationale: Ito ang tuwirang katumbas at angkop sa paulit-ulit na pormula ng pagsusuri sa Genesis 1.
- source_word: כִּי טוֹב
  choice: na iyon ay mabuti
  rationale: Pinananatili ng “mabuti” ang malawak at payak na kahulugan ng טוֹב nang hindi nililimitahan sa kagandahan, kapakinabangan, o kaluguran lamang.
theological_decisions:
- issue: Kung ituturing na karaniwang pangngalan o pangalang ibinigay ang אֶרֶץ
  choice: Isinalin bilang pangalang “Lupa”
  alternative: Isalin bilang karaniwang pangngalang “lupa” nang walang malaking titik
  rationale: Nasa tahasang pormula ng pagpapangalan ang salita. Ipinahihiwatig ng malaking titik ang pampanitikang tungkulin nito bilang pangalan, ngunit hindi nito ipinapalagay na ang tinutukoy ay ang planeta ayon sa makabagong gamit.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tuyong bahagi” at “natipong tubig” para sa likas na daloy, habang pinanatili ang paralelismo ng dalawang pagpapangalan at ang payak na pormula ng pagsusuri.
