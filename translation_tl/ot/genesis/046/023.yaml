  text: 'At ang mga anak ni Dan: Husim.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maikli ang Hebreo; literal: “At ang mga anak ni Dan: Husim.” Bagaman maramihan ang “mga anak,” pangngalang pantangi ang “Husim,” at siya lamang ang inilahad na inapo ni Dan sa talaangkanang ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang pandugtong na daloy ng talaangkanan. Ang “mga anak ni” ang natural na modernong Tagalog para sa construct plural na בְנֵי, habang hindi inaalis ang kapansin-pansing plural sa Hebreo.
- source_word: דָן
  choice: Dan
  rationale: Pangngalang pantangi; ginamit ang karaniwang anyo ng pangalan sa Tagalog na tradisyong biblikal.
- source_word: חֻשִׁים
  choice: Husim
  rationale: Pangngalang pantangi na isinalin sa baybay na angkop sa Tagalog. Bagaman waring plural ang anyo nito, pangalan ito ng isang tao sa kontekstong ito. Pinanatili rin ang maikli at walang-pandiwang kayarian ng Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang terse at nominal na estilo ng Hebreo, pati ang tensiyon sa pagitan ng plural na “mga anak” at ng iisang pangalang Husim.
