translation:
  language: tl
  text: At kapag ipinatawag kayo ng Faraon at sabihin niya, “Ano ang inyong hanapbuhay?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At kapag
  rationale: Ang idyomang Hebreo ay nagpapakilala ng isang inaasahang pangyayari sa hinaharap. Likas sa modernong Tagalog ang “At kapag” at napapanatili nito ang temporal na diwa.
- source_word: יִקְרָא לָכֶם
  choice: ipinatawag kayo
  rationale: Ang קרא na may ל ay maaaring mangahulugang tumawag o magpatawag. Sa konteksto ng korte ng Faraon, malinaw at natural ang “ipinatawag kayo” nang hindi labis na pinapormal ang pananalita.
- source_word: פַּרְעֹה
  choice: Faraon
  rationale: Karaniwang anyong Tagalog ng titulong Hebreo para sa hari ng Ehipto.
- source_word: וְאָמַר
  choice: at sinabi niya
  rationale: Pinananatili ang literal na pandiwang “sinabi” sa halip na ang mas interpretatibong “tinanong,” bagaman isang tanong ang kasunod.
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Ano ang inyong hanapbuhay?
  rationale: Sa konteksto, ang מַעֲשֶׂה ay tumutukoy sa gawain o uri ng trabaho. Ang “hanapbuhay” ay malinaw, natural, at angkop sa tanong tungkol sa kanilang trabaho.
