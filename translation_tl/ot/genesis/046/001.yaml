base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/001.yaml
  text: So Israel set out with all that belonged to him and came to Beersheba[a], and he offered sacrifices to the God of his father Isaac.
translation:
  language: tl
  text: Umalis si Israel kasama ang lahat ng mayroon siya[a] at dumating sa Beer-seba. Naghain siya sa Diyos ng kanyang amang si Isaac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at ang lahat ng kanya.” Malawak ang saklaw ng pariralang Hebreo at maaaring kabilang ang kanyang sambahayan at mga ari-arian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: Umalis
  rationale: Sa salaysay ng paglalakbay, ipinahihiwatig ng נסע ang pag-alis o pagsisimula ng paglalakbay. Likas sa modernong Tagalog ang “umalis” at malinaw nitong naihahatid ang diwa.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Israel ang pangalang ginamit sa tekstong Hebreo, kaya hindi ito pinalitan ng Jacob.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: kasama ang lahat ng sa kanya
  rationale: Malawak ang saklaw ng parirala at maaaring tumukoy kapwa sa sambahayan at mga ari-arian ni Israel. Iniiwasan ng saling ito na limitahan iyon sa materyal na pag-aari lamang.
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Tuwirang ipinahahayag ng בוא ang pagdating sa itinakdang lugar.
- source_word: בְּאֵרָה שָּׁבַע
  choice: sa Beer-seba
  rationale: Ang hulaping patungo sa isang lugar ay likas na naihahayag ng “sa,” at Beer-seba ang malinaw na anyong transliterado sa Tagalog.
- source_word: וַיִּזְבַּח זְבָחִים
  choice: Naghandog siya roon ng mga hain
  rationale: Likas na Tagalog ito para sa magkaugnay na pandiwa at layon sa Hebreo. Ang “roon” ay nagpapalinaw sa lokasyon ng kilos nang hindi nagdaragdag ng bagong pangyayari.
- source_word: לֵאלֹהֵי
  choice: sa Diyos ng
  rationale: Ang pang-ukol na ל ay tumutukoy sa Diyos bilang tumatanggap ng mga hain.
- source_word: אָבִיו יִצְחָק
  choice: kanyang amang si Isaac
  rationale: Malinaw at likas na kinikilala ng parirala si Isaac bilang ama ni Israel.
theological_decisions:
- issue: Ang Diyos ay partikular na tinawag na “Diyos ng kanyang amang si Isaac.”
  choice: Pinanatili ang tiyak na pagtukoy kay Isaac.
  alternative: Diyos ng kanyang mga ninuno
  rationale: Isaac lamang ang tahasang binanggit sa Hebreo. Pinananatili nito ang ugnayan ng salaysay kay Isaac at hindi pinalalawak ang patriyarkal na pormula.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang pangalang Israel at ang tiyak na pagtukoy kay Isaac. Inilagay ang talababa sa pariralang talagang tinutukoy nito.
