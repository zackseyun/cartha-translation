translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “sina” upang natural na ipakilala ang sunod-sunod na mga pangalan ng tao, habang pinananatili ng tutuldok ang maigsi at talaang anyo ng Hebreo. Ang mga pangalan ay transliterado mula sa Hebreo at hindi isinalin ang posibleng kahulugan ng mga ito.
