  text: 'And the sons of Benjamin: Bela[a], Beker, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim[d][c][b], and Ard.'
translation:
  language: tl
  text: 'At ang mga anak ni Benjamin: sina Bela, Beker[a], Ashbel, Gera, Naaman, Ehi[b], Rosh, Muppim[c], Huppim, at Ard[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga tradisyonal na saling Ingles, ang pangalang בֶּכֶר ay madalas na binabaybay na “Becher.”
    reason: lexical_alternative
  - marker: b
    text: Sa Bilang 26:38, ang kaugnay na talaangkanan ng mga Benjaminita ay may “Ahiram” kung saan “Ehi” ang mababasa sa talatang ito.
    reason: cross_reference
  - marker: c
    text: Sa ilang kaugnay na tradisyon ng talaangkanan, may ibang anyo, gaya ng “Shuppim,” sa halip na “Muppim”; sinusunod dito ang Masoretic Text.
    reason: textual_variant
  - marker: d
    text: Sa 1 Cronica 8:3, lumilitaw ang kaugnay na anyo ng pangalan na “Addar” sa isang talaangkanan ng mga Benjaminita; “Ard” ang mababasa sa talatang ito.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: At ang mga anak ni Benjamin
  rationale: Pinananatili ng “At” ang pang-ugnay na waw at ang pagpapatuloy ng talaan. Ang “mga anak ni Benjamin” ang likas na modernong Tagalog para sa construct phrase.
- source_word: בֶּלַע
  choice: Bela
  rationale: Tuwirang transliterasyon ng pangalang Hebreo na angkop sa baybay at bigkas sa Tagalog.
- source_word: בֶּכֶר
  choice: Beker
  rationale: Malapit sa mga katinig at patinig ng anyong Hebreo sa talatang ito; hindi ginamit ang tradisyonal na anyong Ingles na “Becher.”
- source_word: אַשְׁבֵּל
  choice: Ashbel
  rationale: Transliterasyon ng pangalang pantangi; pinananatili ang tunog na shin sa anyong “sh.”
- source_word: גֵּרָא
  choice: Gera
  rationale: Tuwirang transliterasyon ng pangalang pantangi.
- source_word: נַעֲמָן
  choice: Naaman
  rationale: Pinananatili ang magkahiwalay na mga patinig ng pangalang Hebreo sa malinaw na anyong Latin.
- source_word: אֵחִי
  choice: Ehi
  rationale: Sinusunod ang mismong anyo ng Masoretic Text sa talatang ito sa halip na ipalit ang pangalan mula sa kaagapay na talaangkanan.
- source_word: רֹאשׁ
  choice: Rosh
  rationale: Pangalan ito sa konteksto ng talaan, kaya isinalin sa pamamagitan ng transliterasyon at hindi bilang karaniwang pangngalang “ulo” o “pinuno.”
- source_word: מֻפִּים
  choice: Mupim
  rationale: Ang dobleng katinig sa masusing transliterasyon ay hindi kailangang katawanin sa natural na baybay-Tagalog; pinananatili ang M ng Masoretic Text, hindi ang variant na Shuppim.
- source_word: חֻפִּים
  choice: Hupim
  rationale: Natural na transliterasyong Tagalog ng pangalang Hebreo; ang unang ח ay kinakatawan ng H.
- source_word: אָרְדְּ
  choice: Ard
  rationale: Sinusunod ang pangalang nasa Masoretic Text ng talatang ito, sa halip na ang kaugnay na anyong “Addar” sa ibang talaan.
