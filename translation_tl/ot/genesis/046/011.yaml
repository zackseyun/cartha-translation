lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang pagkakaugnay ng talaan, at ang “mga anak ni” ang likas at tiyak na katumbas ng panlalaking pangmaramihang anyong construct na בְנֵי.
- source_word: לֵוִי
  choice: Levi
  rationale: Pangngalang pantangi na ginamit sa nakasanayang anyo sa modernong saling Tagalog.
- source_word: גֵּרְשׁוֹן
  choice: Gershon
  rationale: Tinutumbasan nito ang anyong Hebreo na גֵּרְשׁוֹן at iniiwasang ipagkamali sa hiwalay na pangalang Gershom.
- source_word: קְהָת
  choice: Kohat
  rationale: Ginamit ang nakasanayan at madaling basahing anyo ng pangalan sa Tagalog, na tumutugma sa Hebreong קְהָת.
- source_word: וּ/מְרָרִי
  choice: at Merari
  rationale: Isinalin ang prefixed conjunction bilang “at” bago ang huling pangalan, habang pinananatili ang pangalan bilang Merari.
