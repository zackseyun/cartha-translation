translation_notes:
  register: Makabago, payak, at marangal na Filipino. Ginamit ang “sina” dahil listahan ito ng mga pangalan ng tao; pinanatili ang mga pangalan bilang transliterasyon sa halip na isalin ang posibleng kahulugan ng mga ito.
