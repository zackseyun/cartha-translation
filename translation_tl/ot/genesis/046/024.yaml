  yaml_path: translation/ot/genesis/046/024.yaml
  text: 'And the sons of Naphtali: Jahzeel[a], Guni, Jezer, and Shillem.'
translation:
  language: tl
  text: 'At ang mga anak ni Neftali: sina Jahzeel,[a] Guni, Jezer, at Shillem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Hebreo na “Jahzeel” ay maaari ring baybayin na “Jahziel” o “Jachzeel” sa ibang tradisyon ng transliterasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Ang בְנֵי ay anyong construct plural ng “anak na lalaki.” Sa konteksto ng talaangkanan, sapat at natural sa Filipino ang “mga anak,” habang pinananatili ng “At” ang dugtungan ng listahan.
- source_word: נַפְתָּלִי
  choice: Neftali
  rationale: Pangngalang pantangi; ginamit ang anyong nakasanayan sa makabagong tradisyong biblikal sa Filipino.
- source_word: יַחְצְאֵל
  choice: Jahzeel
  rationale: Transliterasyon ng pangngalang Hebreo na nagpapanatili sa pagkakakilanlan nito at umaayon sa karaniwang anyong biblikal.
- source_word: וְגוּנִי
  choice: Guni
  rationale: Pangngalang pantangi; ang prefixed na וְ ay ipinahayag sa bantas at sa “at” bago ang huling pangalan sa likas na listahang Filipino.
- source_word: וְיֵצֶר
  choice: Jezer
  rationale: Transliterasyon ng pangngalang pantangi; pinanatili ang karaniwang anyong biblikal.
- source_word: וְשִׁלֵּם
  choice: Shillem
  rationale: Transliterasyon na malinaw na kumakatawan sa dobleng katinig na ipinahihiwatig ng Hebreo.
