  text: וַ/יִּקְח֣וּ אֶת מִקְנֵי/הֶ֗ם וְ/אֶת רְכוּשָׁ/ם֙ אֲשֶׁ֤ר רָֽכְשׁוּ֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יָּבֹ֖אוּ מִצְרָ֑יְמָ/ה יַעֲקֹ֖ב וְ/כָל זַרְע֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/006.yaml
  text: They took their livestock and their possessions that they had acquired in the land of Canaan[a], and they came to Egypt—Jacob and all his offspring with him.
translation:
  language: tl
  text: Dinala nila ang kanilang mga alagang hayop at ang mga ari-ariang nakuha nila sa lupain ng Canaan, at dumating sila sa Ehipto—si Jacob at ang lahat ng kanyang mga inapo[a] na kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘supling’ o ‘lahi.’ Ang salitang Hebreo ay maaaring tumukoy sa binhi, supling, o mga inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Dinala nila
  rationale: Ang Qal wayyiqtol ng לקח ay literal na ‘kinuha,’ ngunit sa konteksto ng paglalakbay, mas natural sa Tagalog ang ‘dinala’ at malinaw nitong ipinahihiwatig na isinama nila ang mga iyon.
- source_word: מִקְנֵיהֶם
  choice: kanilang mga alagang hayop
  rationale: Ang מִקְנֶה ay malawak na tumutukoy sa livestock o mga hayop na pag-aari; malinaw at pangkaraniwan sa modernong Tagalog ang ‘mga alagang hayop.’
- source_word: רְכוּשָׁם
  choice: mga ari-arian
  rationale: Ang רְכוּשׁ ay tumutukoy sa mga pag-aari o yaman, lalo na sa maililipat na mga gamit; pinananatili ng ‘mga ari-arian’ ang pagkakaiba nito sa naunang mga alagang hayop.
- source_word: אֲשֶׁר רָכְשׁוּ
  choice: na nakuha nila
  rationale: Ipinapakita ng pariralang ito na ang mga ari-arian ay kanilang natamo sa Canaan bago ang paglalakbay. Natural at hindi labis na tiyak ang ‘nakuha nila.’
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili ng ‘lupain ng Canaan’ ang tahasang heograpikong anyo ng Hebreo.
- source_word: וַיָּבֹאוּ מִצְרָיְמָה
  choice: at dumating sila sa Ehipto
  rationale: Ang בוא kasama ng panlaping patungo sa מִצְרַיִם ay nagsasaad ng pagdating sa Ehipto; natural sa pananaw ng salaysay ang ‘dumating.’
- source_word: יַעֲקֹב וְכָל זַרְעוֹ אִתּוֹ
  choice: si Jacob at ang lahat ng kanyang mga inapo na kasama niya
  rationale: Sa kontekstong ito, ang זֶרַע ay tumutukoy sa buong angkan o mga nagmula kay Jacob. Malinaw ang ‘mga inapo,’ habang iniiwasan ang masyadong literal at hindi natural na ‘binhi.’
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘Dinala’ sa halip na literal na ‘Kinuha’ upang maging natural sa konteksto ng paglipat, at pinanatili ang em dash upang ipakilala ang paglilinaw na si Jacob at ang kanyang mga inapo ang dumating.
