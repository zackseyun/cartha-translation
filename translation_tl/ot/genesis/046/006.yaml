  source_fidelity: 'Tumpak na naihahatid ng salin ang pagkakasunod ng kilos at ang pangunahing mga elemento ng Hebreo: pagdadala ng mga alagang hayop at ari-arian, ang pagkakamit ng mga ari-ariang iyon sa lupain ng Canaan, at ang pagdating ni Jacob kasama ang lahat ng kanyang binhi/angkan sa Ehipto. Ang “Dinala nila” ay isang angkop na kontekstuwal na pagsasalin ng וַיִּקְחוּ sa salaysay ng paglipat.'
