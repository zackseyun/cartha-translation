  text: His sons and his grandsons with him[a], his daughters and his granddaughters[b], and all his offspring he brought with him to Egypt.
translation:
  language: tl
  text: Isinama niya sa Ehipto ang kanyang mga anak na lalaki at mga apong lalaki[a], ang kanyang mga anak na babae at mga apong babae[a], at ang lahat ng kanyang mga supling[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “mga anak na lalaki ng kanyang mga anak na lalaki” at “mga anak na babae ng kanyang mga anak na lalaki.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lahat ng kanyang mga inapo”; literal, “lahat ng kanyang binhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na mga lalaking anak ang tinutukoy, yamang ibinubukod sa talata ang mga anak na babae.
- source_word: וּבְנֵי בָנָיו
  choice: mga apong lalaki
  rationale: Literal itong “mga anak na lalaki ng kanyang mga anak na lalaki”; ang “mga apong lalaki” ang natural na katumbas sa Tagalog.
- source_word: אִתּוֹ
  choice: kasama niya / niya ... sa Ehipto
  rationale: Nagpapahayag ito ng pagsama kay Jacob. Sa pangungusap, likas na naipahihiwatig ng “Dinala niya” na kasama niya ang mga tinutukoy; hindi na kailangang ulitin upang maiwasan ang mabigat na Tagalog.
- source_word: בְּנֹתָיו
  choice: kanyang mga anak na babae
  rationale: Tuwirang tumutukoy sa mga babaeng anak at kaagapay ng “mga anak na lalaki.”
- source_word: וּבְנוֹת בָּנָיו
  choice: mga apong babae
  rationale: Literal itong “mga anak na babae ng kanyang mga anak na lalaki”; natural sa Tagalog ang “mga apong babae.”
- source_word: וְכָל זַרְעוֹ
  choice: pati ang lahat ng kanyang lahi
  rationale: Sa kontekstong pampamilya, ang זֶרַע ay kolektibong tumutukoy sa mga supling o inapo. Ang “lahi” ay maikli, dignificado, at natural, habang pinananatili ang lawak ng termino.
- source_word: הֵבִיא
  choice: Dinala niya
  rationale: Ang Hiphil ng בוא ay karaniwang nangangahulugang “magdala”; malinaw na si Jacob ang nagdala sa kanyang sambahayan.
- source_word: מִצְרָיְמָה
  choice: sa Ehipto
  rationale: Ang hulaping direksiyonal ay nagsasaad ng pagkilos patungong Ehipto; “sa Ehipto” ang natural na Tagalog kasunod ng “dinala.”
