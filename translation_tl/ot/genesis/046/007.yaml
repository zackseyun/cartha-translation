  verdict: revise
  source_fidelity: Kailangang katawanin nang hayag ang אִתּוֹ (“kasama niya”). Ang orihinal ay tumutukoy rin sa mga taong dinala—ang “lahat ng kanyang lahi” ay maaaring mangahulugan ng angkan o linya ng lahi, sa halip na mga supling na isinama sa paglalakbay.
  naturalness: Natural at marangal ang inayos na pangungusap sa makabagong Filipino. Ang “Isinama niya ... sa Ehipto” ay maikli ngunit malinaw na naghahatid kapwa ng pagdadala at ng pagsamang ipinahahayag ng Hebreo.
  terminology: Napananatili ang tiyak na pagkakaiba ng anak na lalaki/babae at apong lalaki/babae. Ang “mga supling” ay mas angkop na kolektibong katumbas ng זַרְעוֹ sa kontekstong ito kaysa “lahi.”
