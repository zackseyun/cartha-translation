translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Iniwasan ang sobrang literal na “kaluluwa” sa pangunahing teksto dahil maaari itong magpahiwatig ng kahulugang hindi siyang diin ng konteksto.
