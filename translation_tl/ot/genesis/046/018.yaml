base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/018.yaml
  text: 'These are the sons of Zilpah[a], whom Laban gave to Leah his daughter, and she bore these to Jacob: sixteen persons.'
translation:
  language: tl
  text: Ito ang mga anak ni Zilpa, na ibinigay ni Laban sa anak niyang si Lea, at nagsilang siya ng mga ito kay Jacob—labing-anim na katao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “labing-anim na kaluluwa.” Dito, ang salitang Hebreo na nefesh ay idyomatikong tumutukoy sa mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי זִלְפָּה
  choice: Ito ang mga anak ni Zilpa
  rationale: Ang demonstratibong אֵלֶּה ay nagpapakilala sa kabuuan ng naunang talaan. Ang “mga anak” ay tuwirang katumbas ng בְּנֵי at likas sa modernong Tagalog.
- source_word: אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  choice: na ibinigay ni Laban sa anak niyang si Lea
  rationale: Ang sugnay na ito ay tumutukoy kay Zilpa. Pinananatili ng salin ang payak na pahayag ng tekstong Hebreo at gumagamit ng natural na ayos sa Tagalog.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: Sila ang ipinanganak ni Zilpa para kay Jacob
  rationale: Ginawang tahasan ang babaeng simuno na nakapaloob sa pandiwang Hebreo upang maiwasan ang malabong reperensiya sa Tagalog. Ang “para kay Jacob” ay natural na naghahatid ng papel ng לְ sa pormulang pangangkanakan.
- source_word: שֵׁשׁ עֶשְׂרֵה נָפֶשׁ
  choice: labing-anim na katao
  rationale: Sa kontekstong genealogical, ang נֶפֶשׁ ay idyomatikong ginagamit sa pagbilang ng mga tao; hindi nito pangunahing tinutukoy rito ang di-materyal na kaluluwa.
