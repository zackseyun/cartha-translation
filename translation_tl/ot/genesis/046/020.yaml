base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/020.yaml
  text: To Joseph were born in the land of Egypt Manasseh and Ephraim[a], whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: tl
  text: Kay Jose ay isinilang sa lupain ng Ehipto sina Manases at Efraim, na isinilang sa kanya ni Asenat, anak ni Potifera, na pari ng On.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang On ay isang lungsod sa Ehipto na nang maglaon ay tinawag na Heliopolis sa Griego.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּוָּלֵד לְיוֹסֵף
  choice: Kay Jose ay isinilang
  rationale: Pinananatili ang pasibong diwa ng Niphal na וַיִּוָּלֵד at ang ugnayang ipinahahayag ng לְיוֹסֵף. Ginamit ang maramihang diwa sa Filipino dahil sina Manases at Efraim ang magkasamang tinutukoy.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Hayagang isinasalin ang אֶרֶץ bilang “lupain” at ginagamit ang karaniwang anyong Filipino na “Ehipto.”
- source_word: אֲשֶׁר יָלְדָה לּוֹ אָסְנַת
  choice: na kapwa ipinanganak sa kanya ni Asenat
  rationale: Pinananatili ang kaugnay na sugnay at ang tahasang papel ni Asenat bilang ina. Nililinaw ng “kapwa” na ang dalawang anak ang saklaw ng sugnay nang hindi inaalis ang pag-uulit ng ideya ng panganganak sa Hebreo.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: anak ni Potifera
  rationale: Likas sa Filipino ang “anak ni” sa pagtukoy sa ama; hindi kailangang idagdag ang “babae” dahil malinaw na babae si Asenat sa konteksto.
- source_word: כֹּהֵן אֹן
  choice: pari ng On
  rationale: Isinasalin ang כֹּהֵן bilang “pari” at pinananatili bilang transliterasyon ang sinaunang pangalang-lugar na On.
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: sina Manases at Efraim
  rationale: Ang “sina” ang likas na pananda sa Filipino para sa dalawang pangalang pantangi; ginamit ang kinagawiang anyong Filipino ng mga pangalan.
