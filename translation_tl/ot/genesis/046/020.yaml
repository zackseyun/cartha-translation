translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang bahagyang pormal na ayos at ang pag-uulit ng ideya ng pagsilang na nasa Hebreo, ngunit ginamit ang “kapwa” upang maging malinaw at likas ang pagtukoy sa dalawang anak.
