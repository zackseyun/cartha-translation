base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/017.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah; and Serah their sister[b]. And the sons of Beriah: Heber and Malchiel.'
translation:
  language: tl
  text: Ang mga anak na lalaki ni Aser ay sina Imna[a], Isva, Isvi, at Beria; at ang kapatid nilang babae ay si Sera[b]. Ang mga anak na lalaki naman ni Beria ay sina Heber at Malkiel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Imna ay maaari ring isulat na Yimna bilang mas malapit na transliterasyon ng unang katinig sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang Sera ay maaari ring isulat na Serah o Serakh sa mas teknikal na transliterasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אָשֵׁר
  choice: Ang mga anak na lalaki ni Aser
  rationale: Ang בְּנֵי ay tahasang nangangahulugang “mga anak na lalaki.” Ginamit ang natural na anyong Filipino na “ni Aser,” at hindi na isinalin nang hiwalay ang panimulang pang-ugnay dahil nagsisimula rito ang talaan.
- source_word: יִמְנָה
  choice: Imna
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa paraang natural basahin sa Filipino; hindi kailangan ang huling h upang katawanin ang patinig na qamats-he.
- source_word: וְיִשְׁוָה
  choice: Isva
  rationale: Isina-Filipinong transliterasyon ng pangalang Hebreo, na gumagamit ng “v” para sa tunog ng waw sa makabagong pagbasa.
- source_word: וְיִשְׁוִי
  choice: Isvi
  rationale: Isina-Filipinong transliterasyon ng pangalang Hebreo; ang pang-ugnay ay likas na ipinahayag sa bantas at “at” ng talaan.
- source_word: וּבְרִיעָה
  choice: at Beria
  rationale: Transliterasyon ng pangalang pantangi, na may “at” bago ang huling pangalan sa serye ayon sa likas na ayos ng Filipino.
- source_word: וְשֶׂרַח אֲחֹתָם
  choice: at ang kapatid nilang babae ay si Sera
  rationale: Nililinaw ng “kapatid na babae” ang אֲחוֹת at pinananatili ang kaugnayan niya sa mga naunang binanggit. Ang pandiwang “ay” ay idinagdag para sa natural na pangungusap sa Filipino, bagaman walang tahasang copula sa Hebreo.
- source_word: וּבְנֵי בְרִיעָה
  choice: Ang mga anak na lalaki naman ni Beria
  rationale: Ang “naman” ay natural na nag-uugnay sa kasunod na sangay ng talaangkanan habang malinaw na ipinahihiwatig ang paglipat sa mga anak ni Beria.
- source_word: חֶבֶר
  choice: Heber
  rationale: Karaniwang anyo ng transliterasyon ng pangalang Hebreo sa tradisyong biblikal sa Filipino.
- source_word: וּמַלְכִּיאֵל
  choice: at Malkiel
  rationale: Malapit na transliterasyon sa Hebreong מַלְכִּיאֵל; pinanatili ang pang-ugnay bago ang huling pangalan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo ng talaangkanan, ngunit gumamit ng tahasang copula para maging likas ang pahayag tungkol kay Sera. Isina-Filipino ang baybay ng karamihan sa mga pangalan habang iniingatan ang pagkakakilanlan ng mga anyong Hebreo.
