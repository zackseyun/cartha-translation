base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/031.yaml
  text: Then Joseph said to his brothers and to his father’s household[a], “I will go up and report to Pharaoh, and I will say to him, ‘My brothers and my father’s household, who were in the land of Canaan, have come to me.’”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Jose sa kanyang mga kapatid at sa sambahayan ng kanyang ama[a], “Aakyat ako at magbibigay-ulat sa Faraon. Sasabihin ko sa kanya, ‘Ang mga kapatid ko at ang sambahayan ng aking ama, na nasa lupain ng Canaan, ay dumating na sa akin.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bahay ng kanyang ama”; literal na “bahay ng kanyang ama.” Dito, ang “bahay” ay tumutukoy sa buong pamilya o sambahayan, hindi lamang sa tirahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive ay nagsusulong ng pagkakasunod-sunod ng salaysay; natural itong ipinahahayag sa modernong Tagalog sa pamamagitan ng “Pagkatapos.”
- source_word: אֶל אֶחָיו
  choice: sa kanyang mga kapatid
  rationale: Sa konteksto, tumutukoy ito sa mga lalaking kapatid ni Jose; ang karaniwang “mga kapatid” ay tumpak at natural sa Tagalog.
- source_word: וְאֶל בֵּית אָבִיו
  choice: at sa sambahayan ng kanyang ama
  rationale: Ang בַּיִת dito ay tumutukoy sa yunit ng pamilya o sambahayan, hindi lamang sa gusaling tinitirhan.
- source_word: אֶעֱלֶה
  choice: Aakyat ako
  rationale: Pinananatili nito ang tahasang direksiyonal na kahulugan ng עלה, “umakyat,” na ginamit sa Hebreo tungkol sa paglapit kay Faraon.
- source_word: וְאַגִּידָה לְפַרְעֹה
  choice: at magbibigay-ulat sa Faraon
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam o iulat; ang “magbibigay-ulat” ay angkop sa pormal na konteksto ng korte.
- source_word: וְאֹמְרָה אֵלָיו
  choice: Sasabihin ko sa kanya
  rationale: Malinaw nitong ipinapahayag ang nilalayong susunod na gagawin ni Jose habang natural ang daloy sa Tagalog.
- source_word: אַחַי
  choice: Ang mga kapatid ko
  rationale: Tumutukoy ito sa aktuwal na mga kapatid na lalaki ni Jose; sapat at likas sa Tagalog ang “mga kapatid ko.”
- source_word: וּבֵית אָבִי
  choice: at ang sambahayan ng aking ama
  rationale: Pinananatili ang kahulugan ng pamilya o sambahayan at ang pagkakatulad sa naunang parirala.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: na nasa lupain ng Canaan
  rationale: Walang tahasang pandiwang may panahunan sa Hebreo. Ang payak na “nasa” ay natural sa Tagalog at hindi nagpapasok ng di-kailangang pagtukoy sa panahunan.
- source_word: בָּאוּ אֵלַי
  choice: ay dumating na sa akin
  rationale: Ang ganap na kilos at kasalukuyang kaugnayan nito ay natural na ipinahahayag ng “dumating na” sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” upang ipahayag ang panlipunan at pampamilyang diwa ng בֵּית אָבִיו, at pinanatili ang “Aakyat ako” bilang tunay na direksiyonal na larawan ng Hebreo.
