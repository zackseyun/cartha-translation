  source_fidelity: 'Tapat ang salin sa Hebreo: pinananatili ang Diyos na nagsasalita kay Israel, ang maramihang “mga pangitain,” ang tagpong panggabi, ang pagpapalit ng pangalang Israel tungo sa Jacob sa direktang pagtawag, ang pag-uulit na “Jacob, Jacob,” at ang tugon na הִנֵּנִי sa “Narito ako.” Ang “Sumagot siya” ay likas na paraan upang ihatid ang kasunod na וַיֹּאמֶר bilang tugon ni Jacob at hindi nagdaragdag ng kahulugang salungat sa teksto.'
