  text: וַ/יֹּ֨אמֶר אֱלֹהִ֤ים לְ/יִשְׂרָאֵל֙ בְּ/מַרְאֹ֣ת הַ/לַּ֔יְלָה וַ/יֹּ֖אמֶר יַעֲקֹ֣ב יַעֲקֹ֑ב וַ/יֹּ֖אמֶר הִנֵּֽ/נִי׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/002.yaml
  text: And God spoke to Israel in visions of the night and said[a], “Jacob, Jacob.” And he said[b], “Here I am.”
translation:
  language: tl
  text: At nagsalita ang Diyos kay Israel sa mga pangitain sa gabi[a] at sinabi, “Jacob, Jacob.” Sumagot siya, “Narito ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “sa mga pangitain ng gabi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nagsalita / sinabi / sumagot
  rationale: Ang אָמַר ay karaniwang nangangahulugang “magsabi.” Ginamit ang “nagsalita” at “sinabi” sa unang dalawang paglitaw upang maging natural sa Filipino nang hindi inaalis ang dalawang pandiwa sa Hebreo; ang “sumagot” sa huling paglitaw ay malinaw na naghahayag ng tugon ni Jacob.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Tumutukoy ito rito sa iisang Diyos at may pang-isahang diwa sa konteksto.
- source_word: לְיִשְׂרָאֵל
  choice: kay Israel
  rationale: Pinananatili ang pangalang “Israel” sa salaysay at hindi ito itinutugma sa “Jacob” na ginamit sa tuwirang pagtawag.
- source_word: בְּמַרְאֹת הַלַּיְלָה
  choice: sa mga pangitain sa gabi
  rationale: Pinananatili nito ang maramihang “mga pangitain” at ang kaugnayan ng mga iyon sa gabi, habang gumagamit ng likas na parirala sa modernong Filipino.
- source_word: יַעֲקֹב יַעֲקֹב
  choice: Jacob, Jacob
  rationale: Pinananatili ang pag-uulit ng pangalan, na nagpapahayag ng tuwiran at mariing pagtawag.
- source_word: הִנֵּנִי
  choice: Narito ako
  rationale: Ito ang natural na katumbas sa Filipino ng nakaugaliang tugon na nagpapahayag ng pagharap at kahandaang makinig.
theological_decisions:
- issue: Pagpapalit sa mga pangalang Israel at Jacob
  choice: Panatilihin ang “Israel” sa salaysay at “Jacob” sa tawag ng Diyos
  alternative: Gamitin ang “Jacob” o “Israel” sa buong talata para maging pare-pareho
  rationale: Sadyang magkaiba ang mga pangalang ginamit sa tekstong Hebreo. Ang pagpapanatili sa pagpapalit ay nag-iingat sa pampanitikan at teolohikal na himig nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang pambungad na “At,” ang pag-uulit na “Jacob, Jacob,” at ang pagkakaiba ng mga pangalang Israel at Jacob.
