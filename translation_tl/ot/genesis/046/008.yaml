  rationale: Inayos ang sintaks upang maging likas sa modernong Filipino at upang maiwasan ang maling impresyong si Jacob ay kabilang sa “mga anak na lalaki ni Israel” sa parehong literal na diwa. Pinanatili ang siksik na paglilinaw ng Hebreo sa pamamagitan ng tutuldok, at inalis ang hindi kailangang footnote. Walang idinagdag na pagpapakahulugang doktrinal o historikal.
