base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/008.yaml
  text: 'These are the names of the sons of Israel who came to Egypt: Jacob and his sons[b][a]. Jacob’s firstborn was Reuben.'
translation:
  language: tl
  text: 'Ito ang mga pangalan ng mga anak ni Israel na pumunta sa Ehipto: si Jacob at ang kanyang mga anak. Ang panganay ni Jacob ay si Ruben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Likas na panimula ito sa isang talaan sa modernong Tagalog. Hindi na isinama ang panimulang “At” sapagkat ang וְ ay nagsisilbing pang-ugnay ng daloy at hindi kailangang tahasang tumbasan dito.
- source_word: שְׁמוֹת
  choice: mga pangalan
  rationale: Karaniwang kahulugan ng pangmaramihang anyo at malinaw na nagpapakilala sa sumusunod na talaan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak na lalaki ni Israel
  rationale: Tiyak na mga lalaking anak ang inililista sa konteksto, kaya mas eksakto ito kaysa sa malawak na “mga anak.” Pinanatili ang Israel bilang pangalan ni Jacob.
- source_word: הַבָּאִים מִצְרַיְמָה
  choice: na pumunta sa Ehipto
  rationale: Ang participle ay naglalarawan sa mga taong nagtungo roon, at ipinahihiwatig ng hulaping paturol ang paggalaw patungo sa Ehipto. Natural sa Tagalog ang “pumunta sa Ehipto.”
- source_word: יַעֲקֹב וּבָנָיו
  choice: si Jacob at ang kanyang mga anak
  rationale: Malapit itong sumusunod sa appositional na parirala ng Hebreo at pinananatili ang bahagyang masikip na ugnayang sintaktiko nito sa naunang sugnay.
- source_word: בְּכֹר יַעֲקֹב
  choice: Ang panganay ni Jacob
  rationale: Natural na Tagalog para sa construct phrase na tumutukoy sa pagkakasunod ng kapanganakan.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa Filipino.
theological_decisions:
- issue: Ugnayan ng “si Jacob at ang kanyang mga anak” sa “mga anak na lalaki ni Israel”
  choice: Pinanatili bilang appositional na parirala na hinihiwalay ng gitling.
  alternative: “na pumunta sa Ehipto kasama ni Jacob” o tahasang gawing simuno ang “si Jacob at ang kanyang mga anak.”
  rationale: Mas malapit ang piniling anyo sa pagkakasunod at siksik na sintaks ng Hebreo at hindi nito tahasang nilulutas ang posibleng ugnayan ng apposition at ng implicit na sugnay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga anak na lalaki” para sa eksaktong kasarian sa talaang ito, at ang gitling at tutuldok upang maipakita ang paglilinaw at pagsisimula ng listahan nang hindi pinapakinis nang labis ang sintaks ng Hebreo.
