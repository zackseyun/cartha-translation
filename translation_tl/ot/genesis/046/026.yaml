revisions:
- from: Ang lahat ng taong kabilang kay Jacob na pumunta sa Ehipto—ang mga nagmula sa kanyang balakang[a], hindi kasama ang mga asawa ng mga anak ni Jacob—ay animnapu’t anim na katao sa kabuuan.[b]
  to: Ang lahat ng taong kabilang sa sambahayan ni Jacob na pumunta sa Ehipto—ang mga nagmula sa kanyang balakang[a], hindi kasama ang mga asawa ng mga anak ni Jacob—ay animnapu’t anim na katao sa kabuuan.[b]
  rationale: Pinalitan ang hindi idiomatikong “kabilang kay Jacob” ng “kabilang sa sambahayan ni Jacob” upang maging natural sa Filipino at maipahayag ang relasyong pang-pamilya/pang-sambahayan ng Hebreong parirala. Pinanatili ang bilang, ang eksepsiyon para sa mga asawa, ang idyoma ng “balakang,” at ang mga angkla at nilalaman ng talababa.
