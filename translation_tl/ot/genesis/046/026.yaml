base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/026.yaml
  text: All the persons belonging to Jacob who came to Egypt[a], who came from his loins, besides the wives of Jacob’s sons[b], were sixty-six persons in all.
translation:
  language: tl
  text: Ang lahat ng taong kabilang sa sambahayan ni Jacob na pumunta sa Ehipto—ang mga nagmula sa kanyang balakang[a], hindi kasama ang mga asawa ng mga anak ni Jacob—ay animnapu’t anim na katao sa kabuuan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga lumabas mula sa kanyang balakang,” isang idyoma para sa kanyang mga likas na inapo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “lahat ng kaluluwa ... animnapu’t anim.” Dito, ang “kaluluwa” ay paraan ng Hebreo sa pagbilang ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנֶּפֶשׁ
  choice: Ang lahat ng taong
  rationale: Sa talaan ng mga tao, ang נֶפֶשׁ ay tumutukoy sa bawat tao, hindi lamang sa di-materyal na “kaluluwa.”
- source_word: הַבָּאָה לְיַעֲקֹב מִצְרַיְמָה
  choice: kabilang kay Jacob na pumunta sa Ehipto
  rationale: Pinananatili nito ang ugnayang ipinahihiwatig ng לְיַעֲקֹב nang hindi nililimitahan ang parirala sa pisikal na pagsabay lamang kay Jacob.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: ang mga nagmula sa kanyang balakang
  rationale: Pinananatili ang kongkretong idyomang Hebreo tungkol sa mga likas na inapo; ipinapaliwanag sa talababa ang literal at idyomatikong diwa.
- source_word: מִלְּבַד
  choice: hindi kasama
  rationale: Malinaw na ipinakikitang hindi kabilang sa bilang ang kasunod na pangkat.
- source_word: נְשֵׁי בְנֵי יַעֲקֹב
  choice: ang mga asawa ng mga anak ni Jacob
  rationale: Tuwiran at malinaw na pinananatili ang ugnayang genitibo ng pariralang Hebreo.
- source_word: כָּל נֶפֶשׁ שִׁשִּׁים וָשֵׁשׁ
  choice: ay animnapu’t anim na katao sa kabuuan
  rationale: Natural na Filipino ito para sa kabuuang bilang at naipahahayag ang inuulit na נֶפֶשׁ bilang “katao.”
