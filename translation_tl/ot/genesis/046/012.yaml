  text: וּ/בְנֵ֣י יְהוּדָ֗ה עֵ֧ר וְ/אוֹנָ֛ן וְ/שֵׁלָ֖ה וָ/פֶ֣רֶץ וָ/זָ֑רַח וַ/יָּ֨מָת עֵ֤ר וְ/אוֹנָן֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יִּהְי֥וּ בְנֵי פֶ֖רֶץ חֶצְר֥וֹן וְ/חָמֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/012.yaml
  text: And the sons of Judah were Er[a], Onan, Shelah, Perez, and Zerah. But Er and Onan died in the land of Canaan. And the sons of Perez were Hezron and Hamul.
translation:
  language: tl
  text: At ang mga anak ni Juda ay sina Er[a], Onan, Sela, Perez, at Zera. Ngunit namatay sina Er at Onan sa lupain ng Canaan. At ang mga anak ni Perez ay sina Hezron at Hamul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, isahan ang pandiwang ginamit bago ang tambalang simunong “Er at Onan,” isang karaniwang ayos sa wikang Hebreo; maramihan ang diwa: “namatay sina Er at Onan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה
  choice: At ang mga anak ni Juda
  rationale: Pinananatili ng “At” ang ugnayang pangtalaan sa naunang talata, at tuwirang isinasalin ang construct phrase bilang “mga anak ni Juda.”
- source_word: עֵר וְאוֹנָן וְשֵׁלָה וָפֶרֶץ וָזָרַח
  choice: sina Er, Onan, Sela, Perez, at Zera
  rationale: Ginamit ang “sina” bilang likas na panandang Filipino para sa talaan ng mga pangalan; ang mga pangalan ay tinumbasan ayon sa karaniwang anyong biblikal sa Filipino habang malapit sa Hebreo.
- source_word: וַיָּמָת
  choice: namatay
  rationale: Bagaman isahan ang anyo ng pandiwang Hebreo, nauuna ito sa tambalang simunong “Er at Onan,” isang karaniwang konstruksiyon sa Hebreo. Ang “namatay sina Er at Onan” ang likas na diwang maramihan sa Filipino.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili ang tahasang אֶרֶץ, “lupain,” sa halip na paikliin lamang sa “sa Canaan.”
- source_word: וַיִּהְיוּ בְנֵי פֶרֶץ
  choice: At ang mga anak ni Perez ay sina
  rationale: Sa kontekstong talaangkanan, ang היה ay nagpapakilala kung sino ang mga anak; natural itong ipinahahayag sa Filipino sa pamamagitan ng “ay sina.”
- source_word: חֶצְרוֹן וְחָמוּל
  choice: Hezron at Hamul
  rationale: Mga pangalang pantangi na isinalin sa transliterasyong karaniwang mababasa sa Bibliyang Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para maging natural ang mga talaan ng pangalan, habang pinanatili ang paulit-ulit na “At” upang maipakita ang daloy ng tekstong Hebreo.
