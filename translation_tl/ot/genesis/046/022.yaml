  text: 'Ito ang mga anak na lalaki ni Raquel na isinilang kay Jacob: labing-apat silang lahat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lahat ng tao, labing-apat”—isang idyomang nagsasaad na labing-apat ang kabuuang bilang ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Natural na panimulang pormula sa modernong Filipino para sa isang buod ng talaangkanan; hindi kailangang markahan ang panahunan dahil walang gramatikal na past/present tense ang demonstrative sa Hebreo.
- source_word: בְּנֵי רָחֵל
  choice: mga anak ni Raquel
  rationale: Bagaman literal na “mga anak na lalaki ni Raquel,” ang “mga anak” ay mas natural sa Filipino at ang kasunod na mga pangalan sa konteksto ang nagpapakitang mga lalaki ang tinutukoy.
- source_word: יֻלַּד לְיַעֲקֹב
  choice: na isinilang para kay Jacob
  rationale: Pinananatili ang pasibong diwa ng ילד at ang ugnayang ipinahihiwatig ng לְ; ang “para kay Jacob” ay malinaw na genealogical na paglalarawan nang hindi ipinapasok si Raquel bilang tahasang simuno na wala sa sugnay.
- source_word: כָּל נֶפֶשׁ
  choice: katao silang lahat
  rationale: Sa kontekstong genealogical at pambilang, ang נֶפֶשׁ ay tumutukoy sa mga tao, hindi sa “kaluluwa” bilang teknikal na teolohikal na konsepto.
- source_word: אַרְבָּעָה עָשָׂר
  choice: labing-apat
  rationale: Tuwirang katumbas ng bilang sa Hebreo.
