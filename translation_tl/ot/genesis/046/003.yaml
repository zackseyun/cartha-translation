base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/003.yaml
  text: And he said[a], “I am God, the God of your father. Do not be afraid to go down to Egypt, for there I will make you into a great nation.”
translation:
  language: tl
  text: At sinabi niya, “Ako ang Diyos, ang Diyos ng iyong ama. Huwag kang matakot na bumaba[a] sa Egipto, sapagkat doon ay gagawin kitang isang malaking bansa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Huwag kang matakot sa pagbaba sa Egipto.” Gumagamit ang Hebreo ng pandiwa para sa “matakot” na sinusundan ng pawatas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: ang Diyos
  rationale: Ang may-tiyak na anyong הָאֵל ay mariing nagpapakilala sa nagsasalita bilang Diyos. Likas at malinaw sa Tagalog ang “Ako ang Diyos.”
- source_word: אֱלֹהֵי אָבִיךָ
  choice: ang Diyos ng iyong ama
  rationale: Tuwirang pinananatili nito ang isahang “ama” at ang pagkakaugnay ng Diyos sa ama ni Jacob, nang hindi ito pinalalawak sa “mga ninuno.”
- source_word: אַל תִּירָא
  choice: Huwag kang matakot
  rationale: Likas na ipinahahayag nito sa modernong Tagalog ang pagbabawal o pagpapalakas-loob na huwag matakot.
- source_word: מֵרְדָה
  choice: na bumaba
  rationale: Kasunod ng pandiwa ng pagkatakot, ang infinitive na may מִן ay tumutukoy sa gawaing kinatatakutan. Pinananatili ng “bumaba” ang heograpikal na idyoma ng Hebreo tungkol sa pagpunta sa Egipto.
- source_word: מִצְרַיְמָה
  choice: sa Egipto
  rationale: Ipinahihiwatig ng hulaping paturol ang pagkilos tungo sa Egipto; sa Tagalog, malinaw at natural ang “sa Egipto” pagkatapos ng “bumaba.”
- source_word: לְגוֹי גָּדוֹל
  choice: isang dakilang bansa
  rationale: Ang pariralang may לְ kasunod ng שׂים ay nagsasaad ng magiging resulta. Ang “dakilang bansa” ay dignificado at sumasaklaw sa diwa ng pagiging malaki, makabuluhan, o makapangyarihan nang hindi ito nililimitahan sa pisikal na laki.
- source_word: אֲשִׂימְךָ
  choice: gagawin kita
  rationale: Bagaman karaniwang nangangahulugang “ilagay” ang שׂים, sa kayariang ito ay nangangahulugan itong gawing o buuin ang isang tao bilang isang bansa.
- source_word: שָׁם
  choice: doon
  rationale: Tinutukoy nito ang Egipto bilang lugar kung saan tutuparin ang pangako.
theological_decisions:
- issue: Pagtukoy sa ninuno sa pagpapakilala ng Diyos sa sarili
  choice: ang Diyos ng iyong ama
  alternative: ang Diyos ng iyong mga ninuno
  rationale: Pinananatili ang isahang “ama” sa Hebreo at ang tiyak na ugnayang pampamilya at pangtipan, sa halip na palawakin ito sa maramihang “mga ninuno.”
- issue: Lugar ng pagbuo kay Jacob bilang dakilang bansa
  choice: doon ay gagawin kitang isang dakilang bansa
  alternative: gagawin kitang isang dakilang bansa
  rationale: Pinananatili ang שָׁם upang malinaw na ang Egipto ang lugar na tinutukoy ng pangako, nang hindi ipinapaliwanag pa kung paano ito matutupad.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang pag-uulit na “ang Diyos, ang Diyos ng iyong ama,” ang heograpikal na larawang “bumaba,” at ang isahang “ama.”
