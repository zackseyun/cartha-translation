base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/032.yaml
  text: The men are shepherds[a], for they have been keepers of livestock, and they have brought their flocks and their herds and all that they have.
translation:
  language: tl
  text: Ang mga lalaki ay mga pastol[a], sapagkat ang hanapbuhay nila ay pag-aalaga ng hayop; dinala nila ang kanilang mga kawan, mga baka, at lahat ng kanilang pag-aari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang mga lalaki ay mga pastol, sapagkat nag-aalaga sila noon ng hayop; at dinala nila…” Maaaring ipahayag ng mga pandiwang Hebreo rito ang payak na nakaraan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Ang mga lalaki
  rationale: Tumutukoy ito sa tiyak na pangkat ng mga lalaki. Hindi na isinama ang panimulang pangatnig upang maging natural sa Filipino bilang pagpapatuloy ng sinasabi ni Jose.
- source_word: רֹעֵי צֹאן
  choice: mga pastol
  rationale: Likas at malinaw na katumbas ng pariralang tumutukoy sa mga nag-aalaga at nagpapastol ng maliliit na hayop, lalo na ng mga tupa at kambing.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ito ng paliwanag kung bakit sila tinatawag na mga pastol.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: mga tagapag-alaga ... ng mga alagang hayop
  rationale: Ipinahahayag ang kanilang hanapbuhay sa pag-aalaga ng iba't ibang uri ng hayop nang hindi nililimitahan ang מִקְנֶה sa baka lamang.
- source_word: הָיוּ
  choice: sila
  rationale: Sa sugnay na 'mga tagapag-alaga sila,' ang kopulang Filipino ay natural na naghahayag ng kanilang matatag nang gawain; ang posibleng tahasang aspektong nakaraan ay inilagay sa talababa.
- source_word: וְצֹאנָם
  choice: ang kanilang mga kawan
  rationale: Ang צֹאן ay kolektibong katawagan sa maliliit na alagang hayop, karaniwang mga tupa at kambing; pinananatili ng 'mga kawan' ang lawak nito.
- source_word: וּבְקָרָם
  choice: mga bakahan
  rationale: Ang בָּקָר ay tumutukoy sa mga baka bilang kolektibong pangkat; malinaw itong naihihiwalay sa mga kawan ng tupa at kambing.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: lahat ng kanilang ari-arian
  rationale: Natural na Filipino para sa komprehensibong pariralang 'lahat ng nasa kanila' o lahat ng pag-aari nila.
- source_word: הֵבִיאוּ
  choice: dinala nila
  rationale: Ang Hebreong perfect ay maaaring ipahayag nang natural sa Filipino bilang ganap na kilos na nakaraan; ang resulta nito ay may kaugnayan pa rin sa kasalukuyang tagpo.
