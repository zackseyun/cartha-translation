  source_fidelity: 'Tumpak ang pangunahing daloy at mga kategorya sa Hebreo: ang mga lalaki ay mga pastol, ang kanilang gawain ay may kinalaman sa pag-aalaga ng hayop, at dinala nila ang mga kawan, baka, at lahat ng pag-aari nila. Gayunman, ang “mga bakahan” ay karaniwang tumutukoy sa mga lugar o pasilidad para sa pag-aalaga ng baka, hindi sa mga baka mismo na siyang tinutukoy ng בְּקָרָם.'
  naturalness: Ang “mga tagapag-alaga sila ng mga alagang hayop” ay may di-likas na pag-uulit at mabigat ang ayos. Ang “ang hanapbuhay nila ay pag-aalaga ng hayop” ay mas likas na modernong Filipino at naihahayag ang aspektong panghanapbuhay ng אַנְשֵׁי מִקְנֶה.
  terminology: Napananatili ang “mga pastol” para sa רֹעֵי צֹאן at “mga kawan” para sa צֹאן. Pinalitan ang “mga bakahan” ng “mga baka” para sa בָּקָר. Ang “lahat ng kanilang pag-aari” ay angkop para sa וְכָל אֲשֶׁר לָהֶם.
