revisions:
- from: Ang mga lalaki ay mga pastol[a], sapagkat mga tagapag-alaga sila ng mga alagang hayop; dinala nila ang kanilang mga kawan, mga bakahan, at lahat ng kanilang ari-arian.
  to: Ang mga lalaki ay mga pastol[a], sapagkat ang hanapbuhay nila ay pag-aalaga ng hayop; dinala nila ang kanilang mga kawan, mga baka, at lahat ng kanilang pag-aari.
  rationale: Pinalitan ang “mga bakahan” ng “mga baka” upang tumukoy sa mga hayop, hindi sa lugar o pasilidad. Inayos ang sugnay tungkol sa kanilang gawain upang maging natural sa Filipino habang pinananatili ang kahulugang sila ay mga taong ang hanapbuhay ay pag-aalaga ng hayop. Pinanatili ng talababa ang lehitimong posibilidad na isalin sa payak na nakaraan ang mga perfect na pandiwang Hebreo.
