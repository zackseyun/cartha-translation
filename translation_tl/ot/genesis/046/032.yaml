translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang 'pastol,' 'mga kawan,' at 'mga bakahan' upang mapanatili ang pagkakaiba ng mga kategorya ng hayop sa Hebreo. Inilagay ang [a] kaagad pagkatapos ng 'mga pastol' gaya ng hinihingi ng sangguniang teksto.
