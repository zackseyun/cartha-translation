base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/004.yaml
  text: I myself will go down with you to Egypt[a], and I myself will also surely bring you up; and Joseph will place his hand on your eyes.
translation:
  language: tl
  text: Ako mismo ang bababa kasama mo patungong Ehipto, at ako rin mismo ang tiyak na iaahon kita; at ipapatong ni Jose ang kaniyang kamay sa iyong mga mata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, sa mas idyomatikong salin, “ipipikit ni Jose ang iyong mga mata,” na nagpapahiwatig na naroroon si Jose sa pagkamatay ni Jacob.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Ako mismo
  rationale: Ang tahasang panghalip ay inuulit sa Hebreo upang idiin na ang Diyos mismo ang sasama at mag-aahon kay Jacob.
- source_word: אֵרֵד עִמְּךָ
  choice: bababang kasama mo
  rationale: Pinananatili nito ang direksiyonal na larawang “bumaba” patungong Ehipto at ang pangakong personal na pagsama.
- source_word: מִצְרַיְמָה
  choice: sa Ehipto
  rationale: Ang hulaping paturol sa Hebreo ay nagpapahayag ng pagpunta sa Ehipto; natural sa Tagalog ang “sa Ehipto” kasunod ng pandiwang may direksiyon.
- source_word: אַעַלְךָ גַם עָלֹה
  choice: tiyak na mag-aahon sa iyo
  rationale: Ang causative na anyo ay nangangahulugang “magpaakyat/mag-ahon,” at ang infinitive absolute ay nagbibigay-diin sa katiyakan. Ang “rin” sa sugnay ay kumakatawan sa additive na גַם.
- source_word: וְיוֹסֵף
  choice: at ... ni Jose
  rationale: Ginamit ang karaniwang modernong anyo ng pangalang Joseph sa Filipino at pinanatili ang pang-ugnay.
- source_word: יָשִׁית יָדוֹ עַל עֵינֶיךָ
  choice: ilalagay ni Jose ang kamay niya sa iyong mga mata
  rationale: Pinananatili sa pangunahing teksto ang kongkretong larawang Hebreo nang hindi agad pinapalitan ng idyomatikong kahulugang pagpikit sa mga mata ng namatay.
theological_decisions:
- issue: Saklaw ng pangakong “mag-aahon sa iyo” mula sa Ehipto
  choice: Pinanatili ang malawak na pananalitang “mag-aahon sa iyo.”
  alternative: Tukuying eksklusibo ang pagbabalik ng bangkay ni Jacob sa Canaan o ang pag-ahon ng kanyang mga inapo sa Exodo.
  rationale: Hindi nililinaw ng maikling pahayag sa Hebreo kung ang tinutukoy ay si Jacob mismo, ang pagdadala sa kanyang katawan upang ilibing, ang kanyang mga inapo, o magkakaugnay na katuparan. Hindi ito dapat tahimik na paliitin ng salin.
- issue: Kahulugan ng paglalagay ni Jose ng kamay sa mga mata ni Jacob
  choice: Pinanatili ang literal na larawan sa teksto at ipinaliwanag ang idyoma sa talababa.
  alternative: Isalin direkta bilang “ipipikit ni Jose ang iyong mga mata.”
  rationale: Ang literal na larawan ay malinaw na nasa Hebreo, samantalang ang kaugnayan nito sa pagkamatay ni Jacob ay wastong maibibigay bilang paliwanag nang hindi inaalis ang anyo ng orihinal.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Ako mismo” upang madama ang diin ng inuulit na אָנֹכִי, at “mag-aahon” upang mapanatili ang direksiyonal at causative na larawan nang hindi nilulutas ang sadyang malawak na saklaw ng pangako. Inilagay ang talababa pagkatapos ng pariralang tungkol sa mga mata, na siyang tunay na tinutukoy nito.
