  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang magalang na “inyong mga lingkod,” ang pagpapatuloy mula kabataan hanggang sa kasalukuyan, ang layuning manirahan sa Gosen, at ang matinding pagtingin ng mga Ehipsiyo sa mga pastol ay naipapahayag. Gayunman, ang karagdagang malayang pangungusap na “Sabihin ninyo ito” ay wala sa pinagmulan at inuulit ang utos na naibigay na sa “at sasabihin ninyo.”'
  naturalness: Natural at marangal ang karamihan ng salin. Mas dumadaloy sa Filipino ang pag-uugnay ng sugnay ng layunin nang direkta sa naunang “sasabihin ninyo,” sa halip na magsingit ng isa pang utos. Ang “mga tagapag-alaga ng mga alagang hayop” ay mas malinaw na tumutukoy sa livestock kaysa sa payak na “mga hayop,” na maaari ring tumukoy sa mababangis na hayop.
  terminology: Ang “inyong mga lingkod,” “lupain ng Gosen,” at “kasuklam-suklam sa mga Ehipsiyo” ay angkop sa register at kahulugan. Pinananatili ang “pastol” sa teksto at ang mas tahasang “pastol ng kawan” sa talababa, nang hindi nagpapataw ng interpretasyong doktrinal.
