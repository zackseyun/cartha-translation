  text: וַ/אֲמַרְתֶּ֗ם אַנְשֵׁ֨י מִקְנֶ֜ה הָי֤וּ עֲבָדֶ֨י/ךָ֙ מִ/נְּעוּרֵ֣י/נוּ וְ/עַד עַ֔תָּה גַּם אֲנַ֖חְנוּ גַּם אֲבֹתֵ֑י/נוּ בַּ/עֲב֗וּר תֵּשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן כִּֽי תוֹעֲבַ֥ת מִצְרַ֖יִם כָּל רֹ֥עֵה צֹֽאן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/034.yaml
  text: then you shall say[a], ‘Your servants have been men of livestock from our youth until now, both we and our fathers,’ so that you may live in the land of Goshen[b], for every shepherd is detestable to the Egyptians.
translation:
  language: tl
  text: at sasabihin ninyo, “Ang inyong mga lingkod ay mga tagapag-alaga ng mga alagang hayop mula pa sa aming kabataan hanggang ngayon—kami at ang aming mga ama,” upang makapanirahan kayo sa lupain ng Gosen, sapagkat kasuklam-suklam sa mga Ehipsiyo ang bawat pastol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “ang bawat pastol ng kawan.”
    reason: Pinananatili nito ang tahasang צֹאן (“kawan,” karaniwang tupa at kambing) na likas nang ipinahihiwatig ng salitang “pastol” sa pangunahing teksto.
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: at sasabihin ninyo
  rationale: Ang waw na sinusundan ng perfect sa konteksto ng naunang tagubilin ay nagpapahayag ng kasunod na gagawin; natural sa Filipino ang “at sasabihin ninyo” at napapanatili nito ang puwersa ng tagubilin.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: nag-aalaga ng mga hayop
  rationale: Ipinahihiwatig ng parirala ang mga taong ang hanapbuhay ay pag-aalaga ng livestock. Mas natural at malinaw sa modernong Filipino ang pandiwang paglalarawan kaysa sa literal ngunit asiwa na “mga tao ng hayupan,” at hindi ito nililimitahan sa tupa lamang.
- source_word: עֲבָדֶיךָ
  choice: ang inyong mga lingkod
  rationale: Magalang na pagtukoy ito sa sarili sa harap ng Faraon, hindi pagbibigay-diin sa kalagayan ng pagkaalipin.
- source_word: מִנְּעוּרֵינוּ וְעַד עַתָּה
  choice: mula pa sa aming kabataan hanggang ngayon
  rationale: Tuwirang ipinapahayag ang tuloy-tuloy na gawain mula sa kabataan hanggang sa kasalukuyan.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבֹתֵינוּ
  choice: kami at ang aming mga ama
  rationale: Pinananatili ang pag-uulit na sumasaklaw sa dalawang salinlahi at ang tahasang panlalaking katawagang אבות, sa halip na palawakin agad sa “mga ninuno.”
- source_word: בַּעֲבוּר תֵּשְׁבוּ
  choice: Sabihin ninyo ito upang makapanirahan kayo
  rationale: Ang בַּעֲבוּר ay nagpapakilala ng layunin o inaasahang bunga. Idinagdag ang “Sabihin ninyo ito” bilang malinaw na reperensiya sa Filipino upang maiwasan ang malabong pagkakabit ng sugnay, nang walang idinadagdag na bagong diwa.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: sa lupain ng Gosen
  rationale: Pinananatili ang tahasang אֶרֶץ, “lupain,” at ginagamit ang karaniwang anyong Filipino ng pangalang Gosen.
- source_word: תוֹעֲבַת מִצְרַיִם
  choice: kasuklam-suklam sa mga Ehipsiyo
  rationale: Malakas na negatibo ang תוֹעֵבָה. Ang “kasuklam-suklam” ay natural, marangal, at hindi pinahihina ang diwa; ang construct na “ng Ehipto” ay malinaw na tumutukoy rito sa pagtingin ng mga Ehipsiyo.
- source_word: כָּל רֹעֵה צֹאן
  choice: ang bawat pastol
  rationale: Bagaman tahasang may צֹאן, likas nang nagpapahiwatig ang “pastol” ng tagapag-alaga ng tupa o kawan. Inilalagay sa talababa ang mas literal na anyo upang mapanatili ang detalye ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “inyong mga lingkod” bilang magalang na pananalita sa harap ng pinuno, “makapanirahan” para sa konteksto ng paninirahan sa Gosen, at “kasuklam-suklam” upang mapanatili ang tindi ng תוֹעֵבָה. Ang em dash ay nagpapalinaw sa idinugtong na “kami at ang aming mga ama.”
