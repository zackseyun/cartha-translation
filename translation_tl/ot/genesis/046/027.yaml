base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/027.yaml
  text: And the sons of Joseph who were born to him in Egypt were two persons[b][a]. All the persons of the house of Jacob who came to Egypt were seventy.
translation:
  language: tl
  text: At ang mga anak na lalaki ni Jose na ipinanganak sa kanya sa Ehipto ay dalawang katao.[a] Ang lahat ng kabilang sa sambahayan ni Jacob na dumating sa Ehipto ay pitumpung katao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang salitang nefesh ay ginagamit dito para sa isang indibiduwal na binibilang sa talaan ng pamilya; kaya, “katao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יוֹסֵף
  choice: At ang mga anak ni Jose
  rationale: Sa konteksto, tumutukoy ang בְּנֵי sa mga lalaking anak ni Jose, ngunit natural sa modernong Tagalog ang “mga anak” at malinaw na ang tinutukoy ay sina Manases at Efraim.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: na ipinanganak sa kaniya
  rationale: Pinananatili nito ang pasibong anyo ng Hebreo at likas na ipinahahayag ang ugnayan kay Jose.
- source_word: בְמִצְרַיִם
  choice: sa Ehipto
  rationale: Tuwirang lokatibong salin ng pang-ukol at pangalan ng lugar.
- source_word: נֶפֶשׁ שְׁנָיִם
  choice: dalawang katao
  rationale: Sa talaan ng angkan, ang נֶפֶשׁ ay tumutukoy sa binibilang na indibiduwal, hindi partikular sa di-materyal na kaluluwa.
- source_word: כָּל הַנֶּפֶשׁ לְבֵית יַעֲקֹב
  choice: Ang lahat ng kabilang sa sambahayan ni Jacob
  rationale: Ang לְבֵית יַעֲקֹב ay nagpapahayag ng pagiging kabilang sa pamilya o sambahayan ni Jacob. Mas natural ito sa Tagalog kaysa sa literal na “lahat ng katao ng bahay ni Jacob.”
- source_word: הַבָּאָה מִצְרַיְמָה
  choice: na dumating sa Ehipto
  rationale: Ginagawang likas na sugnay na panuring ang Hebreong participle, habang ipinapahayag ng “sa Ehipto” ang direksiyong taglay ng hulaping locative.
- source_word: שִׁבְעִים
  choice: ay pitumpung katao
  rationale: Ipinahahayag ang kabuuang bilang sa natural na Tagalog; inuulit ang “katao” upang maging malinaw ang binibilang.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa konteksto ng talaan ng angkan
  choice: katao / kabilang sa sambahayan
  alternative: kaluluwa
  rationale: Ang talata ay nagbibilang ng mga miyembro ng sambahayan ni Jacob at hindi nagtuturo rito tungkol sa likas na katangian ng kaluluwa. Iniiwasan ng saling ito ang hindi kinakailangang teolohikal na pahiwatig.
- issue: Saklaw ng pitumpung katao
  choice: Pinanatili ang kabuuang bilang ng tekstong Masoretiko nang walang paliwanag na pagsasaayos
  alternative: Iayon o ipaliwanag sa pangunahing teksto ang bilang batay sa ibang sinaunang tradisyon o sa paraan ng pagbilang sa kalapit na mga talata
  rationale: Malinaw na “pitumpu” ang WLC; hindi dapat tahimik na pagtugmain ng salin ang mga posibleng pagkakaiba sa sinaunang tradisyon o paraan ng pagbilang.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “sambahayan” para sa kolektibong diwa ng בֵּית at “katao” para sa idyomang pambilang ng נֶפֶשׁ. Inilagay ang panandang [a] kaagad pagkatapos ng unang paglitaw ng salitang nangangailangan ng paliwanag.
