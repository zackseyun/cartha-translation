base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/005.yaml
  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
translation:
  language: tl
  text: Umalis si Jacob sa Beer-seba.[a] Dinala ng mga anak na lalaki ni Israel ang kanilang amang si Jacob, ang maliliit nilang anak, at ang kanilang mga asawa sakay ng mga karwaheng ipinadala ng Paraon upang dalhin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring “Tumindig si Jacob mula sa Beer-seba.” Literal na nangangahulugang “tumindig” ang pandiwang Hebreo, ngunit sa konteksto ng paglalakbay ay idyoma ito para sa pag-alis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Umalis
  rationale: Bagaman literal na “tumindig” o “bumangon,” ang pandiwa kasama ng מִן at isang lugar ay idyoma ng paglalakbay na nagpapahiwatig ng pag-alis.
- source_word: מִבְּאֵר שָׁבַע
  choice: sa Beer-seba
  rationale: Ang “sa” kasunod ng “umalis” ay likas na katumbas sa Filipino ng Hebreong pang-ukol na nangangahulugang “mula sa”; pinanatili ang karaniwang anyo ng pangalan ng lugar.
- source_word: וַיִּשְׂאוּ
  choice: Dinala
  rationale: Ang נשׂא ay nangangahulugang magbuhat o magdala. Sa konteksto ng pagsakay sa mga karwahe, natural at tapat ang “dinala.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak na lalaki ni Israel
  rationale: Sa agarang konteksto, tumutukoy ito sa mga lalaking anak ni Jacob, hindi sa Israel bilang buong bansa; pinananatili ng salin ang tiyak na kasarian ng parirala.
- source_word: אֲבִיהֶם
  choice: kanilang amang si Jacob
  rationale: Malinaw na ipinakikita ang ugnayang pampamilya habang pinananatili si Jacob bilang tahasang layon ng pandiwa.
- source_word: טַפָּם
  choice: maliliit nilang anak
  rationale: Ang טַף ay karaniwang tumutukoy sa maliliit na anak o mga batang umaasa sa magulang; ipinananatili ng parirala ang ganitong diwa.
- source_word: נְשֵׁיהֶם
  choice: kanilang mga asawa
  rationale: Sa kontekstong pampamilya, malinaw na mga asawa ang tinutukoy ng Hebreong salita.
- source_word: בָּעֲגָלוֹת
  choice: sakay ng mga karwahe
  rationale: Ang עֲגָלוֹת ay mga sasakyang may gulong na ginagamit sa pagdadala. Ang “sakay ng mga karwahe” ay likas na Filipino para sa paraan ng paglalakbay ng mga tao.
- source_word: אֲשֶׁר שָׁלַח פַּרְעֹה
  choice: ipinadala ng Paraon
  rationale: Tuwirang ipinapahayag na ang Paraon ang nagpadala ng mga karwahe bago gamitin ang mga iyon sa paglalakbay.
- source_word: לָשֵׂאת אֹתוֹ
  choice: upang dalhin siya
  rationale: Pinananatili ang pawatas na nagsasaad ng layunin at ang panghalip na isahan, na pinakamalapit na tumutukoy kay Jacob.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Ang “mga anak na lalaki ni Israel” ay sadyang tiyak upang hindi mapagkamalang tawag sa buong bansang Israel, at ang “maliliit nilang anak” ay nagpapanatili sa diwa ng טַף.
