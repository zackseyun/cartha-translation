base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/025.yaml
  text: 'These are the sons of Bilhah[a], whom Laban gave to Rachel his daughter, and she bore these to Jacob: seven persons in all.'
translation:
  language: tl
  text: Ito ang mga anak na lalaki ni Bilha, na ibinigay ni Laban kay Raquel na kaniyang anak. Si Bilha ang nagsilang ng mga ito para kay Jacob—pitong katao lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “lahat ng nefesh, pito”—isang idyoma na nangangahulugang pitong katao sa kabuuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי בִלְהָה
  choice: Ito ang mga anak ni Bilha
  rationale: Ang “mga anak” ay natural na katumbas ng construct na בְּנֵי at tumutukoy rito sa mga lalaking anak sa talaangkanan; ginamit ang karaniwang anyong Filipino ng pangalang Bilhah.
- source_word: אֲשֶׁר נָתַן לָבָן לְרָחֵל בִּתּוֹ
  choice: Ibinigay ni Laban si Bilha sa anak niyang si Raquel
  rationale: Nilinaw ang tahasang tinutukoy ng sugnay—si Bilha ang ibinigay ni Laban kay Raquel—upang maiwasan ang maling pagkapit ng panuring sa “mga anak.” Natural sa Filipino ang “anak niyang si Raquel” para sa Hebrew na “kay Raquel na anak niya.”
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: at isinilang niya ang mga ito kay Jacob
  rationale: Pinananatili ang maternal na simuno at ang relasyong ipinahihiwatig ng לְיַעֲקֹב. Ang “isinilang” ay dignified at karaniwan sa kontekstong talaangkanan.
- source_word: כָּל נֶפֶשׁ שִׁבְעָה
  choice: pitong katao lahat
  rationale: Ang נֶפֶשׁ ay tumutukoy rito sa binibilang na mga tao, hindi sa hiwalay na espirituwal na bahagi ng tao. Ang ayos na “pitong katao lahat” ay natural sa modernong Filipino at nagpapanatili sa kabuuang bilang.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa talaan ng mga tao
  choice: katao
  alternative: kaluluwa
  rationale: Sa census at genealogical na kontekstong ito, idiomatikong tumutukoy ang נֶפֶשׁ sa isang tao. Ang “kaluluwa” ay maaaring magpasok ng teolohikal na paghahati ng tao na hindi ipinahahayag ng talata.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Hinati sa dalawang pangungusap upang maging tiyak na si Bilha, hindi ang mga anak, ang ibinigay ni Laban kay Raquel. Ginamit ang nakasanayang mga anyong Filipino na Bilha, Raquel, at Jacob.
