base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/028.yaml
  text: He sent Judah ahead of him to Joseph[a], to show the way before him to Goshen[c][b]; and they came into the land of Goshen.
translation:
  language: tl
  text: Isinugo niya si Juda na mauna sa kanya patungo kay Jose, upang maituro kay Jacob ang daan patungong Gosen.[a] At dumating sila sa lupain ng Gosen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Siksik at maaaring unawain sa iba’t ibang paraan ang Hebreo. Ang pandiwang isinaling “maituro” ay maaari ring mangahulugang “ituro ang daan,” “gabayan,” o “magbigay ng tagubilin.” Hindi tahasang tinutukoy ng parirala kung si Juda, si Jose, o iba pa ang gagawa ng paggabay o pagtuturo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: isinugo
  rationale: Karaniwang salin ng pandiwang nangangahulugang “magpadala.” Ang “isinugo” ay angkop sa sadyang pagpapadala ni Jacob kay Juda.
- source_word: לְפָנָיו
  choice: na mauna sa kanya
  rationale: Ipinahihiwatig ng idyoma na ipinadala si Juda bago dumating si Jacob; natural itong ipinapahayag sa Filipino bilang “mauna sa kanya.”
- source_word: לְהוֹרֹת
  choice: upang maituro ang daan
  rationale: Ang Hiphil ng ירה ay maaaring mangahulugang magturo, magbigay ng direksiyon, o magturo ng daan. Pinananatili ng pasibong “maituro” ang praktikal na diwa at hindi tahasang nagpapasya kung sino ang gagabay.
- source_word: גֹּשְׁנָה
  choice: patungong Gosen
  rationale: Ang directional he ay nagpapahayag ng kilos tungo sa isang lugar; natural itong isalin na “patungong Gosen.”
- source_word: וַיָּבֹאוּ
  choice: at dumating sila
  rationale: Payak at natural na salin ng karaniwang pandiwang pasalaysay na בוא, na tumutukoy sa pagdating ng pangkat.
- source_word: אַרְצָה גֹּשֶׁן
  choice: sa lupain ng Gosen
  rationale: Pinananatili ang teritoryal na diwa ng אֶרֶץ at ang pagpasok o pagdating sa rehiyon ng Gosen.
- source_word: יְהוּדָה / יוֹסֵף / גֹּשֶׁן
  choice: Juda / Jose / Gosen
  rationale: Ginamit ang mga pangalang nakaugat at madaling makilala sa tradisyong Filipino sa Bibliya.
theological_decisions:
- issue: Hindi tiyak na tagaganap at layon ng לְהוֹרֹת sa pinaikling sugnay
  choice: Ginamit ang “upang maituro ang daan” at ipinaliwanag ang mga posibilidad sa talababa.
  alternative: “upang ituro ni Juda ang daan” o “upang kumuha si Juda kay Jose ng mga direksiyon”
  rationale: Walang tahasang paksa ang infinitive at siksik ang Hebreong parirala. Iniiwasan ng pasibong anyo ang paglutas sa tunay na kalabuan at hindi nagdaragdag ng tiyak na gawaing hindi tahasang sinabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mauna sa kanya” sa halip na literal na “sa harap niya,” at pinanatili sa talababa ang kalabuan ng Hebreong sugnay.
