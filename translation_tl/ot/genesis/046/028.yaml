  to: Isinugo niya si Juda na mauna sa kanya patungo kay Jose, upang maituro kay Jacob ang daan patungong Gosen.[a] At dumating sila sa lupain ng Gosen.
  rationale: Inalis ang malabong “bago siya dumating” at inayos ang ayos ng parirala upang maging natural sa Filipino. Pinanatili ng “upang maituro kay Jacob” ang hindi pagtukoy sa tagaganap ng infinitive, habang nililinaw ang reperente ng pronominal na parirala bilang si Jacob. Iningatan ng talababa ang leksikal at sintaktikong kalabuan ng Hebreo nang hindi nagpapataw ng isang interpretasyong logistikal gaya ng “maghanda ng daraanan.”
