translation:
  language: tl
  text: 'At ang mga anak ni Ruben: sina Hanoc[a], Pallu, Hezron, at Carmi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Hanoc; isinasalin din ayon sa tradisyon bilang Enoc sa ilang salin.'
