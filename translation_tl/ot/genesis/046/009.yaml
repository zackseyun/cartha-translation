lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang pang-ugnay na ו at ang pagpapatuloy ng talaan; natural sa modernong Tagalog ang “mga anak ni” para sa construct plural na בְנֵי.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa Tagalog.
- source_word: חֲנוֹךְ
  choice: Hanoc
  rationale: Malapit itong transliterasyon sa Hebreong pangalan at iniiwasang ipagkamali agad sa tradisyonal na anyong Enoc; ipinaliliwanag sa talababa ang alternatibo.
- source_word: וּ/פַלּוּא
  choice: Pallu
  rationale: Tuwirang transliterasyon ng pangalan; ang pang-ugnay ay likas na naisasama sa ayos at bantas ng talaan.
- source_word: וְ/חֶצְרוֹן
  choice: Hezron
  rationale: Ginamit ang malinaw at nakikilalang transliterasyon ng Hebreong pangalan.
- source_word: וְ/כַרְמִי
  choice: Carmi
  rationale: Tuwirang transliterasyon; ang prefixed conjunction ay kinakatawan ng “at” bago ang huling pangalan.
