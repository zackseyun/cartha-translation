lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: At ang mga anak ni Simeon ay sina
  rationale: Pinananatili ng “At” ang pagkakaugnay ng talaan, samantalang natural sa Filipino ang “ay sina” bago ang listahan ng mga pangalan ng tao.
- source_word: יְמוּאֵל וְיָמִין וְאֹהַד וְיָכִין וְצֹחַר
  choice: Jemuel, Jamin, Ohad, Jakin, Zohar
  rationale: Isinalin sa baybay na malinaw at karaniwan sa Filipino ang mga pangalang Hebreo; ang J sa “Jakin” ay kumakatawan sa Hebreong yod ayon sa nakaugaliang anyong biblikal.
- source_word: וְשָׁאוּל
  choice: at Shaul[a]
  rationale: Malapit na inililipat ng “Shaul” ang tunog at baybay ng Hebreong שָׁאוּל; inilakip sa talababa ang pamilyar na alternatibong “Saul.”
- source_word: בֶּן הַכְּנַעֲנִית
  choice: na anak ng babaeng Cananeo
  rationale: Malinaw na ipinahahayag ng pambabaeng anyo ng הַכְּנַעֲנִית na ang tinutukoy ay isang babaeng Cananeo. Ang “na anak” ay natural na nag-uugnay kay Shaul sa parirala.
