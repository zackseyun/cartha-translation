  text: 'And the sons of Simeon: Jemuel[a], Jamin, Ohad, Jachin, Zohar, and Shaul, the son of the Canaanite woman.'
translation:
  language: tl
  text: At ang mga anak ni Simeon ay sina Jemuel, Jamin, Ohad, Yakin, Zohar, at Shaul[a], na anak ng babaeng Canaanita.
  philosophy: optimal-equivalence
  footnotes:
