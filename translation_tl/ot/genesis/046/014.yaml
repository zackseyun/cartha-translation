  text: 'And the sons of Zebulun: Sered[a], Elon, and Jahleel.'
translation:
  language: tl
  text: 'At ang mga anak na lalaki ni Zebulun: sina Sered, Elon, at Jahleel[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isulat ang pangalang Jahleel na “Yahleel” o “Jachleel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Ang בְנֵי ay construct plural ng “anak na lalaki”; sa talaangkanan, natural sa Filipino ang “mga anak ni.” Pinanatili ang וּ bilang “At” upang maipakita ang pagpapatuloy ng listahan.
- source_word: זְבוּלֻן
  choice: Zebulun
  rationale: Pangalang pantangi; tinumbasan sa karaniwang anyong transliterado at hindi isinalin ang kahulugan.
- source_word: סֶרֶד
  choice: Sered
  rationale: Pangalang pantangi; tuwirang transliterasyon ng pangalang Hebreo.
- source_word: וְ/אֵלוֹן
  choice: Elon
  rationale: Pangalang pantangi ito sa konteksto, kaya transliterado at hindi isinalin bilang karaniwang pangngalang maaaring tumukoy sa isang punongkahoy. Ang prefixed conjunction ay naipahayag sa huling “at” ng serye.
- source_word: וְ/יַחְלְאֵל
  choice: Jahleel
  rationale: Pangalang pantangi; ginamit ang nakaugaliang biblikal na anyong “Jahleel,” habang inilagay sa talababa ang iba pang posibleng transliterasyon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” bago ang magkakasunod na pangalan upang maging natural ang talaan sa Tagalog. Inilagay ang panandang [a] pagkatapos ng “Jahleel,” sapagkat ang talababa ay tumutukoy sa transliterasyon ng pangalang iyon.
