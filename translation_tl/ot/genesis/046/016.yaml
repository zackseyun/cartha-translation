lexical_decisions:
- source_word: וּבְנֵי גָד
  choice: At ang mga anak ni Gad
  rationale: Tuwirang ipinapahayag ang ugnayang genealogical; pinananatili ng “At” ang daloy ng talaan.
- source_word: צִפְיוֹן
  choice: Zifion
  rationale: Transliterasyon sa baybay na madaling basahin sa Filipino mula sa anyong Hebreo sa talatang ito.
- source_word: וְחַגִּי
  choice: Hagi
  rationale: Ang dobleng katinig sa transliterasyong Ingles ay hindi kailangan sa karaniwang ortograpiyang Filipino.
- source_word: שׁוּנִי
  choice: Shuni
  rationale: Malapit na transliterasyon ng pangalang Hebreo habang pinananatili ang nakikilalang anyo nito.
- source_word: וְאֶצְבֹּן
  choice: Ezbon
  rationale: Tuwirang transliterasyon ng pangalang pantangi.
- source_word: עֵרִי
  choice: Eri
  rationale: Tuwirang transliterasyon ng pangalang pantangi.
- source_word: וַאֲרוֹדִי
  choice: Arodi
  rationale: Tuwirang transliterasyon ng pangalang pantangi.
- source_word: וְאַרְאֵלִי
  choice: Areli
  rationale: Tuwirang transliterasyon ng pangalang pantangi.
