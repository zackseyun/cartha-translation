base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/029.yaml
  text: Then Joseph harnessed his chariot and went up to meet Israel his father in Goshen[a]. He appeared before him, fell on his neck[b], and wept on his neck for a long time.
translation:
  language: tl
  text: Pagkatapos, inihanda ni Jose ang kanyang karwahe at pumunta sa Gosen upang salubungin ang kanyang amang si Israel. Humarap siya sa kanyang ama,[a] yumakap sa leeg ng kanyang ama, at matagal na umiyak habang nakayakap sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Nagpakita siya sa kanya.” Maaaring isalin ang pandiwang Hebreo bilang “nagpakita” o “humarap”; dito, si Jose ang humarap sa kanyang ama.'
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “bumagsak siya sa leeg ng kanyang ama at umiyak sa leeg nito pa.” Ang huling salitang Hebreo ay maaaring mangahulugang “pa,” “patuloy,” o “muli”; sa kontekstong ito, malamang na ipinahihiwatig nito ang matagal na pag-iyak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר ... מֶרְכַּבְתּוֹ
  choice: ipinahanda ... ang kanyang karwahe
  rationale: Ang אָסַר ay literal na “itali,” ngunit kapag karwahe ang layon, tumutukoy ito sa pagkakabit ng panghila o paghahanda ng karwahe para bumiyahe. Likas sa modernong Tagalog ang “ipinahanda” at hindi nito idinaragdag sa pangunahing teksto ang mga kabayong ipinahihiwatig lamang.
- source_word: וַיַּעַל
  choice: pumunta
  rationale: Karaniwang nangangahulugang “umakyat” ang עלה, ngunit dito ay kilos patungong Gosen ang tinutukoy. Ang “pumunta” ay malinaw at natural, habang iniiwasang magpahiwatig ng tiyak na pag-akyat sa mataas na lugar.
- source_word: לִקְרַאת
  choice: upang salubungin
  rationale: Ipinapahayag ng לִקְרַאת ang layuning makipagtagpo sa isang dumarating. Mas angkop sa eksena ng muling pagkikita ang “salubungin” kaysa sa pangkalahatang “katagpuin.”
- source_word: יִשְׂרָאֵל אָבִיו
  choice: kanyang amang si Israel
  rationale: Pinananatili ang pangalang “Israel” na ginamit ng Hebreo at inilalahad ang kaugnayan sa paraang natural sa Tagalog.
- source_word: גֹּשְׁנָה
  choice: sa Gosen
  rationale: Ang hulaping direksiyonal na ־ה ay nagpapahiwatig ng patungong Gosen. Sapat na naihahayag ng “pumunta sa Gosen” ang direksiyong ito.
- source_word: וַיֵּרָא אֵלָיו
  choice: Humarap siya sa kanyang ama
  rationale: Ang Niphal ng ראה ay “nagpakita/nakita” o “humarap.” Sa tagpong ito, natural na ipinahahayag ng “humarap” ang personal na pagpapakita ni Jose sa kanyang ama nang hindi ito ginagawang tila mahiwagang pagpapakita.
- source_word: וַיִּפֹּל עַל צַוָּארָיו
  choice: yumakap sa leeg nito
  rationale: Ang literal na “bumagsak sa leeg” ay idyomang Hebreo para sa marubdob na pagyakap. Ipinapahayag ng “yumakap sa leeg” ang tunay na kilos sa malinaw at dignified na modernong Tagalog.
- source_word: וַיֵּבְךְּ עַל צַוָּארָיו עוֹד
  choice: matagal na umiyak habang nakayakap dito
  rationale: Pinagsasama nito ang pisikal na larawan ng pag-iyak sa leeg ng ama at ang pangmatagalang diwa ng עוֹד. Mas natural ito kaysa sa literal na “umiyak sa leeg nito pa.”
