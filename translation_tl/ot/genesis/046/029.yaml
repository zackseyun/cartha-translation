  source_fidelity: 'Kailangang alisin ang causative na “ipinahanda,” na maaaring magpahiwatig na ipinagawa ni Jose sa iba ang paghahanda ng karwahe. Aktibo ang pandiwang Hebreo: si Jose mismo ang naghanda/nagkabit ng kanyang karwahe. Ang iba pang mahahalagang elemento—pagpunta sa Gosen, pagsalubong kay Israel na kanyang ama, pagpapakita sa ama, pagyakap sa leeg, at matagal na pag-iyak—ay naipapahayag nang tapat.'
  naturalness: Natural at marangal ang daloy sa modernong Filipino Tagalog. Ang pagpapalit ng “nito/dito” ng “ng kanyang ama/sa kanya” ay mas malinaw at mas angkop para sa taong tinutukoy.
  terminology: Ang “Jose,” “Israel,” “Gosen,” at “karwahe” ay angkop at pare-pareho. Ang “humarap” ay isang katanggap-tanggap na kontekstuwal na salin ng Niphal na “nagpakita,” at ang talababa ay maayos na nagbibigay ng mas literal na alternatibo.
