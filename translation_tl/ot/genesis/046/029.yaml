translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “karwahe” bilang pamilyar na terminong biblikal, at nilinaw ang mga panghalip kung kinakailangan upang hindi mapagkamalan kung sino ang kumilos. Ang mga idyomang Hebreo ay isinalin ayon sa kahulugan, habang inilagay sa talababa ang mas literal na anyo at tunay na leksikal na kalabuan.
