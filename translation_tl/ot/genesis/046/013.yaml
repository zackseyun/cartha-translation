  yaml_path: translation/ot/genesis/046/013.yaml
  text: 'And the sons of Issachar: Tola[a], Puvah, Job[b], and Shimron.'
translation:
  language: tl
  text: 'At ang mga anak ni Isacar: sina Tola, Puva[a], Job[b], at Simron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Puva ay binabaybay ding Pua sa ilang tradisyon ng pagsasalin.
    reason: lexical_alternative
  - marker: b
    text: Jasub ang mababasa sa 1 Cronica 7:1 sa halip na Job.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Tuwirang ipinapakita ng “mga anak ni” ang construct plural na בְנֵי, habang pinananatili ng “At” ang pang-ugnay na וּ at ang daloy ng talaan.
- source_word: יִשָׂשכָר
  choice: Isacar
  rationale: Ginamit ang nakaugaliang modernong anyong Filipino ng pangalang Hebreo.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Pangalan ito sa talaangkanan kaya isinalin sa pamamagitan ng transliterasyon, hindi ayon sa posibleng kahulugang leksikal nito.
- source_word: וּ/פֻוָּה
  choice: Puva
  rationale: Inililipat nito sa natural na baybay-Filipino ang pangalang Hebreo, kasama ang katinig na waw; inilagay sa talababa ang nakaugaliang alternatibong “Pua.”
- source_word: וְ/י֥וֹב
  choice: Job
  rationale: Ito ang pangalang mababasa sa tekstong Masoretiko ng talatang ito; pinanatili sa talababa ang ibang anyo sa 1 Cronica 7:1.
- source_word: וְ/שִׁמְרֽוֹן
  choice: at Simron
  rationale: Ang “Simron” ay malinaw na transliterasyong Filipino ng pangalan, at ang “at” ay kumakatawan sa prefixed conjunction.
theological_decisions: []
translation_notes:
  register: Makabago, payak, at marangal na Filipino. Ginamit ang “sina” bago ang sunod-sunod na pangalan upang maging likas ang talaan sa Tagalog, nang hindi binabago ang kahulugan ng tekstong Hebreo. Inilagay ang marker [a] pagkatapos ng Puva, sapagkat iyon ang pangalang tinutukoy ng talababa.
