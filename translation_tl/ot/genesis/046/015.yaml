base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/015.yaml
  text: These are the sons of Leah[a], whom she bore to Jacob in Paddan-aram, along with Dinah his daughter[b]. The total number of his sons and his daughters was thirty-three.
translation:
  language: tl
  text: Ito ang mga anak na lalaki ni Lea na ipinanganak niya kay Jacob sa Padan-Aram, kasama si Dina, ang anak na babae ni Jacob. Ang kabuuang bilang ng kanyang mga anak na lalaki at babae ay tatlumpu't tatlo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lahat ng mga tao ng kanyang mga anak na lalaki at babae”—isang idyomang tumutukoy sa kabuuang bilang ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: mga anak na lalaki ni Lea
  rationale: Tahasang panlalaking maramihan ang בְּנֵי at nagsisilbing karaniwang pamagat ng talaangkanan; pinanatili ang ‘mga anak na lalaki’ sa halip na palawakin bilang ‘mga anak.’
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: na isinilang niya kay Jacob
  rationale: Sa Qal na may babaeng simuno, ang יָלַד ay tumutukoy sa panganganak. Natural sa makabagong Tagalog ang ‘isinilang niya kay Jacob’ at pinananatili ang ugnayan kay Jacob.
- source_word: בְּפַדַּן אֲרָם
  choice: sa Padan-Aram
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng transliterasyon, hindi pagsasalin ng posibleng kahulugang etimolohikal.
- source_word: וְאֵת דִּינָה בִתּוֹ
  choice: kasama si Dina na anak na babae ni Jacob
  rationale: Ipinakikita ng ‘kasama’ ang pagdaragdag kay Dina pagkatapos ng pamagat na ‘mga anak na lalaki ni Lea.’ Ginawang tahas si Jacob bilang tinutukoy ng hulaping ‘kanyang’ upang maiwasan ang kalituhan sa Tagalog.
- source_word: כָּל נֶפֶשׁ
  choice: silang lahat
  rationale: Sa kontekstong genealogical at pambilang, ang נֶפֶשׁ ay tumutukoy sa kabuuang bilang ng mga tao, hindi sa teolohikal na konsepto ng ‘kaluluwa.’ Natural na ipinahahayag ito sa Tagalog bilang ‘silang lahat.’
- source_word: בָּנָיו וּבְנוֹתָיו
  choice: ang kanyang mga anak na lalaki at mga anak na babae
  rationale: Pinanatili ang tahasang pagkakaiba ng Hebreo sa mga anak na lalaki at mga anak na babae.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ
  choice: tatlumpu't tatlo
  rationale: Tuwirang katumbas ng bilang na tatlumpu't tatlo.
theological_decisions:
- issue: Saklaw ng bilang na tatlumpu't tatlo
  choice: Iniuugnay ang bilang sa lahat ng anak na lalaki at anak na babae ni Jacob na tinutukoy sa tala, kasama si Dina.
  alternative: Unawaing ang tatlumpu't tatlo ay mga anak lamang ni Lea o bilang na hindi kasama si Dina.
  rationale: Ang Hebreong בָּנָיו וּבְנוֹתָיו ay literal na ‘kanyang mga anak na lalaki at kanyang mga anak na babae,’ na ang hulapi ay pinakanatural na tumutukoy kay Jacob. Hindi nilulutas ng salin ang lahat ng problemang aritmetiko sa listahan, kundi pinananatili ang pahayag ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘mga anak na lalaki/babae’ upang mapanatili ang mga pagkakaibang nasa Hebreo, at iniwasan ang literal na ‘kaluluwa,’ na madaling magbigay rito ng di-nilalayong teolohikal na kahulugan.
