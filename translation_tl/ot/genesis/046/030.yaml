  yaml_path: translation/ot/genesis/046/030.yaml
  text: Then Israel said to Joseph[a], “Now I can die, since I have seen your face and know that you are still alive.”
translation:
  language: tl
  text: Sinabi ni Israel kay Jose[a], “Ngayon ay maaari na akong mamatay, yamang nakita ko na ang mukha mo at buhay ka pa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas pormal: “Ngayon ay mamamatay na ako, matapos kong makita ang mukha mo, sapagkat buhay ka pa.” Maikli at idyomatiko ang pagkakasabi sa Hebreo; ipinahahayag ng pangunahing teksto ang diwa nito sa natural na Filipino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na pagsulong ng salaysay sa Filipino; hindi kailangang isalin nang hiwalay ang waw-consecutive bilang “at” o “pagkatapos.”
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinananatili ang pangalang tahasang ginamit sa tekstong Hebreo sa halip na gawing “Jacob.”
- source_word: אֶל יוֹסֵף
  choice: kay Jose
  rationale: Karaniwang modernong Filipino para sa taong pinatutungkulan ng pagsasalita.
- source_word: אָמ֣וּתָה
  choice: maaari na akong mamatay
  rationale: Ipinahahayag ng cohortative ang personal na kahandaan o panatag na pagtanggap sa kamatayan sa kontekstong ito, hindi paghingi ng pahintulot na mamatay.
- source_word: הַפָּעַם
  choice: Ngayon
  rationale: Sa idyomang ito, tumutukoy ito sa kasalukuyang sandali matapos ang mahabang dalamhati; natural at hindi labis na interpretibo ang “ngayon.”
- source_word: אַחֲרֵי רְאוֹתִי
  choice: yamang nakita ko na
  rationale: Pinagsasama ang temporal at kontekstuwal na dahilan ng compact na pariralang Hebreo sa natural na Filipino.
- source_word: אֶת פָּנֶיךָ
  choice: ang mukha mo
  rationale: Pinananatili ang matingkad at personal na literal na larawan sa Hebreo sa halip na payaking “ikaw.”
- source_word: כִּי עוֹדְךָ חָי
  choice: at buhay ka pa
  rationale: Pinananatili ang kaugnayan ng pagkakita sa mukha ni Jose at ang katunayang nananatili siyang buhay, nang hindi idinaragdag ang tahasang pandiwang “alam.”
- source_word: עוֹדְךָ חָי
  choice: buhay ka pa
  rationale: Natural na modernong Filipino para sa patuloy na kalagayang ipinahahayag ng עוֹד at חָי.
theological_decisions:
- issue: Lakas ng cohortative na אָמוּתָה
  choice: maaari na akong mamatay
  alternative: hayaan mo na akong mamatay / mamamatay na ako
  rationale: Ang konteksto ay nagpapahayag ng pagiging handa at kapanatagan ni Israel, hindi paghingi ng pahintulot o tiyak na pahayag na agad siyang mamamatay.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang “Israel,” “mukha mo,” at ang bahagyang tensiyon ng cohortative, habang iniwasan ang di-tahasang dagdag na “alam ko.”
