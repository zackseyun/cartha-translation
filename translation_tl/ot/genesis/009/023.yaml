  verdict: revise
  source_fidelity: Tumpak na naihahatid ng salin ang pagkakasunod ng mga kilos, ang damit na inilagay sa mga balikat ng dalawang magkapatid, ang paglakad nang paatras, at ang paulit-ulit na pahayag na hindi nila nakita ang kahubaran ng kanilang ama. Ang “balabal” ay katanggap-tanggap para sa שִׂמְלָה, bagaman sapat na malawak ang kaukulang talababa.
  naturalness: May bahagyang di-natural na pahayag sa “Nakatalikod ang kanilang mga mukha,” sapagkat ang mukha ay hindi karaniwang inilalarawang “nakatalikod” sa Tagalog. Mas likas ang “Nakapaling sa likuran ang kanilang mga mukha.” Ang “mga balikat nilang dalawa” ay mas malinaw ding tumutugma sa anyong pangmaramihan ng Hebreo.
  terminology: Ang mga pangalang Sem at Jafet, “balabal,” at “kahubaran ng kanilang ama” ay angkop sa makabagong Tagalog na may marangal na rehistro. Napananatili ng “kahubaran” ang literal na pananalita nang hindi nag-uutos ng isang seksuwal na pagpapakahulugan.
  issues:
