base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/023.yaml
  text: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
translation:
  language: tl
  text: Pagkatapos, kinuha nina Sem at Jafet ang balabal[a] at ipinatong iyon sa mga balikat nilang dalawa. Naglakad sila nang patalikod at tinakpan ang kahubaran ng kanilang ama. Nakapaling sa likuran ang kanilang mga mukha kaya hindi nila nakita ang kahubaran ng kanilang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panlabas na kasuotan.” Ang salitang Hebreo ay tumutukoy sa isang kasuotang ginamit dito upang takpan si Noe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Payak na salaysay ng pagkuha; natural sa makabagong Tagalog at hindi nagdaragdag ng diwang wala sa Hebreo.
- source_word: שֵׁם וָיֶפֶת
  choice: Sem at Jafet
  rationale: Ginamit ang karaniwang anyo ng mga pangalang biblikal sa Tagalog.
- source_word: הַשִּׂמְלָה
  choice: ang balabal
  rationale: Ang שׂמלה ay panlabas na kasuotan; mas kongkreto at natural ang “balabal” sa kontekstong ginagamit itong pantakip.
- source_word: וַיָּשִׂימוּ עַל שְׁכֶם שְׁנֵיהֶם
  choice: ipinatong iyon sa balikat nilang dalawa
  rationale: Malapit sa literal na “inilagay sa balikat nilang dalawa,” habang malinaw na magkasama nilang dinala ang balabal.
- source_word: אֲחֹרַנִּית
  choice: nang patalikod / nakatalikod
  rationale: Pinananatili ang pag-uulit at inilalarawan kapwa ang kanilang paglakad at ang pagkakatuon ng kanilang mga mukha palayo.
- source_word: וַיְכַסּוּ
  choice: tinakpan
  rationale: Tuwirang katumbas ng kilos na pagtatakip sa kontekstong ito.
- source_word: עֶרְוַת אֲבִיהֶם
  choice: ang kahubaran ng kanilang ama
  rationale: Pinananatili ang literal at marangal na pananalita ng Hebreo at ang pahiwatig ng hiya, nang hindi nagpapasok ng mas tiyak na interpretasyong seksuwal.
- source_word: וּפְנֵיהֶם אֲחֹרַנִּית
  choice: Nakatalikod ang kanilang mga mukha
  rationale: Natural na Tagalog para sa sugnay na walang hayag na pandiwa at pinananatili ang tahasang pagbanggit sa kanilang mga mukha.
- source_word: לֹא רָאוּ
  choice: hindi nila nakita
  rationale: Payak na pagsasalin ng negatibong anyo ng “makakita,” nang hindi dinaragdagan ng diwang sadyang pagtingin.
theological_decisions:
- issue: Kahulugan ng “kahubaran ng kanilang ama” sa talatang ito
  choice: Literal na pagkakalantad ng katawan ni Noe, na magalang na tinakpan nina Sem at Jafet
  alternative: Eupemistikong kahulugang seksuwal batay sa gamit ng kaugnay na pananalita sa Levitico
  rationale: 'Kongkreto ang agarang salaysay: kumuha sila ng kasuotan, naglakad nang patalikod, tinakpan ang kanilang ama, at hindi nakita ang kanyang kahubaran. Pinananatili ng salin ang mismong parirala nang hindi nilulutas nang lampas sa sinasabi ng talata ang posibleng mas malawak na pahiwatig nito.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pag-uulit ng “kahubaran ng kanilang ama” at ang larawan ng paglakad at pagharap nang patalikod, alinsunod sa Hebreo.
