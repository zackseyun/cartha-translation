  text: וַ/יִּֽהְי֣וּ בְנֵי נֹ֗חַ הַ/יֹּֽצְאִים֙ מִן הַ/תֵּבָ֔ה שֵׁ֖ם וְ/חָ֣ם וָ/יָ֑פֶת וְ/חָ֕ם ה֖וּא אֲבִ֥י כְנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/018.yaml
  text: The sons of Noah who came out of the ark were Shem, Ham, and Japheth; and Ham was the father of Canaan.
translation:
  language: tl
  text: Ang mga anak ni Noe na lumabas mula sa arka ay sina Sem, Ham, at Jafet; at si Ham ang ama ni Canaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay
  rationale: Ang anyong ito ng היה ay payak na pang-ugnay na nagpapakilala sa mga anak ni Noe; sa natural na Tagalog, sapat ang panandang panaguri na “ay” at hindi kailangang idagdag ang diwang “naging.”
- source_word: בְנֵי נֹחַ
  choice: ang mga anak ni Noe
  rationale: Tuwirang ipinahahayag ang ugnayang pampamilya ng construct chain at natural ito sa makabagong Tagalog.
- source_word: הַיֹּצְאִים מִן הַתֵּבָה
  choice: na lumabas sa malaking sasakyang-dagat
  rationale: Ang participle ay ginawang sugnay na naglalarawan sa mga anak ni Noe. Ang “lumabas sa” ay likas na Tagalog para sa paglabas mula sa loob; ang “malaking sasakyang-dagat” ay malinaw na tumutukoy sa תֵּבָה sa salaysay ng baha nang hindi ipinapalagay na karaniwang barko ang anyo nito.
- source_word: שֵׁם וְחָם וָיָפֶת
  choice: sina Sem, Ham, at Jafet
  rationale: Ginamit ang karaniwang anyo ng mga pangalan sa Tagalog at ang “sina” bilang angkop na pantukoy sa talaan ng mga pangalan ng tao.
- source_word: וְחָם הוּא אֲבִי כְנָעַן
  choice: at si Ham ang ama ni Canaan
  rationale: Pinananatili ang tahasang pagkakakilanlan kay Ham bilang ama ni Canaan. Ang nominal na sugnay ay likas na isinasalin sa pangkasalukuyan-ng-salaysay na “ang ama,” yamang walang nakasaad na pandiwang pangnagdaan sa Hebreo.
theological_decisions:
- issue: Panimulang tala tungkol kina Ham at Canaan
  choice: Panatilihin sa pangunahing teksto ang “at si Ham ang ama ni Canaan” bilang mahalagang pagkakakilanlan sa salaysay.
  alternative: Pahinain o ilipat sa talababa bilang di-mahalagang impormasyon.
  rationale: Tahasan at kapansin-pansing iniuugnay ng tekstong Hebreo si Ham kay Canaan bilang paghahanda sa kasunod na pangyayari. Hindi dinaragdagan ng salin ang pahayag ng anumang kalaunang teolohikal o etnikong pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “malaking sasakyang-dagat” para sa תֵּבָה upang maging nauunawaan ng karaniwang mambabasa at maiwasang ipakahulugan ito bilang isang barkong may tiyak na karaniwang disenyo. Walang talababa sapagkat walang mahalagang tekstuwal o leksikal na kalabuan na kailangang ilahad sa talatang ito.
