base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/010.yaml
  text: 'and with every living creature that is with you: the birds[a], the livestock, and every beast of the earth with you, from all that came out of the ark[d][c][b], every beast of the earth.'
translation:
  language: tl
  text: at sa bawat buháy na nilalang na kasama ninyo—sa mga ibon, sa mga alagang hayop, at sa lahat ng mailap na hayop sa lupa na kasama ninyo—mula sa lahat ng lumabas sa arka, sa bawat mailap na hayop sa lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mahirap ang ayos ng pangwakas na parirala sa Hebreo. Maaari rin itong isalin nang mas pormal: “mula sa lahat ng lumabas sa arka, para sa bawat mailap na hayop sa lupa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ הַחַיָּה
  choice: bawat buháy na nilalang
  rationale: Tumutukoy ang parirala sa mga nilalang na may buhay, lalo na sa mga hayop sa kontekstong ito. Likas at malawak ang “buháy na nilalang” sa makabagong Filipino nang hindi ipinapasok ang diwa ng “kaluluwa” na maaaring makalito rito.
- source_word: בָּעוֹף
  choice: sa mga ibon
  rationale: Bagaman maaaring sumaklaw ang עוֹף sa mga nilalang na lumilipad, “mga ibon” ang malinaw at karaniwang kahulugan sa talaang ito.
- source_word: בַּבְּהֵמָה
  choice: sa mga alagang hayop
  rationale: Inihihiwalay ng salita ang domestikadong mga hayop sa kasunod na kategorya ng mailap na mga hayop; mas malawak at mas angkop ito kaysa “mga baka.”
- source_word: חַיַּת הָאָרֶץ
  choice: mailap na hayop sa lupa
  rationale: Pinananatili ng “mailap na hayop” ang pagkakaiba nito sa בְּהֵמָה, ang mga alagang hayop, at nililinaw ng “sa lupa” ang saklaw ng parirala.
- source_word: מִכֹּל יֹצְאֵי הַתֵּבָה
  choice: mula sa lahat ng lumabas sa arka
  rationale: Malapit itong sumusunod sa Hebreo at pinananatili ang pagtukoy sa mga hayop na lumabas sa arka.
- source_word: לְכֹל חַיַּת הָאָרֶץ
  choice: sa bawat mailap na hayop sa lupa
  rationale: Pinananatili ang inuulit at siksik na pangwakas na parirala nang hindi tiyakang ginagawang layon, diin, o simpleng paliwanag lamang ang לְ.
theological_decisions:
- issue: Saklaw at sintaks ng mga hayop na kabilang sa tipan
  choice: Kasama ang lahat ng buháy na nilalang na kaugnay ni Noe—mga ibon, alagang hayop, at mailap na hayop—habang pinananatiling siksik at bahagyang malabo ang pangwakas na pag-uulit.
  alternative: Maaaring gawing mas malinaw na panumbas ang hulihan bilang “ibig sabihin, bawat mailap na hayop sa lupa,” o mas pormal bilang “para sa bawat mailap na hayop sa lupa.”
  rationale: Mahirap at paulit-ulit ang sintaks ng Hebreo. Hindi dapat tahimik na ipasiya kung ang huling parirala ay apposisyon, pagbibigay-diin, o may karaniwang puwersa ng לְ na “para sa.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang mga gitling upang malinaw na maipakita ang magkakaugnay na talaan, ngunit pinanatili ang pag-uulit at tunay na sintaktikong hirap ng Hebreo. Ang tuldik sa “buháy” ay tumutulong na iwasan ang maling pagbasa.
