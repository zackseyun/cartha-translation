  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל נֹ֔חַ וְ/אֶל בָּנָ֥י/ו אִתּ֖/וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/008.yaml
  text: Then God said to Noah and to his sons with him, saying,
translation:
  language: tl
  text: Pagkatapos, sinabi ng Diyos kay Noe at sa mga anak niyang kasama niya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive na may pandiwang preterite ay nagpapatuloy sa salaysay. Likas sa makabagong Tagalog ang “Pagkatapos, sinabi” at malinaw nitong ipinapakita ang pagkakasunod-sunod.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Sa kontekstong ito, tumutukoy ang אֱלֹהִים sa iisang Diyos na nakikipag-usap kay Noe; “Diyos” ang karaniwan at malinaw na katumbas.
- source_word: אֶל נֹחַ
  choice: kay Noe
  rationale: Minamarkahan ng אֶל ang kinakausap. Ang “kay” ang likas na panandang Tagalog bago ang pangalan ng tao, at “Noe” ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: וְאֶל בָּנָיו
  choice: at sa mga anak niya
  rationale: Pinag-uugnay ng וְ ang ikalawang pangkat ng mga kinakausap. Bagaman maaaring mga anak na lalaki ang tukoy ng בָּנִים, likas sa Tagalog ang “mga anak” at hindi nito binabago ang sanggunian sa mga anak ni Noe na nasa konteksto.
- source_word: אִתּוֹ
  choice: kasama niya
  rationale: Tinutukoy ng parirala na ang mga anak ni Noe ay kasama niya; malinaw at natural ang “kasama niya” sa Tagalog.
- source_word: לֵאמֹר
  choice: '[ipinahihiwatig ng kuwit at ng kasunod na tuwirang pahayag]'
  rationale: Ang לֵאמֹר ay pormulang nagpapakilala sa susunod na sinabi. Sa natural na Tagalog, sapat na ang pandiwang “sinabi” at kuwit bago ang kasunod na tuwirang pahayag; ang literal na “na sinasabi” ay mabigat at hindi idiomatiko rito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang ayos ng mga kinakausap at ang pasulong na galaw ng salaysay, habang hindi literal na inulit ang Hebreong pormulang לֵאמֹר dahil naipahahayag na iyon nang natural ng bantas at ng kasunod na talumpati.
