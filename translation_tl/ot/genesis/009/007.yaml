base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/007.yaml
  text: And as for you[a], be fruitful and multiply; swarm in the earth and multiply in it.
translation:
  language: tl
  text: Kayo naman, maging mabunga at magpakarami; dumami kayo nang sagana[a] sa lupa at magpakarami rito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lumaganap kayo sa lupa.” Ang pandiwang Hebreo ay naglalarawan ng napakasagana at tila dagsa-dagsang pagdami.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Kayo naman
  rationale: Ipinahahayag ng hiwalay na panghalip at pang-ugnay ang pagbibigay-diin at pagbabalik sa kausap; likas sa modernong Tagalog ang “Kayo naman” para sa ganitong paghahambing o pagpapatuloy.
- source_word: פְּרוּ
  choice: maging mabunga
  rationale: Pinananatili nito ang larawan ng pagiging mabunga sa pandiwang פרה at naihihiwalay ang diwa nito sa kasunod na utos na magpakarami.
- source_word: וּרְבוּ
  choice: at magpakarami
  rationale: Tuwirang ipinahahayag ang pagdami sa bilang at pinananatili ang pamilyar na pananalita ng pagpapala at utos sa salaysay ng paglikha.
- source_word: שִׁרְצוּ
  choice: dumami kayo nang sagana
  rationale: Ang שׁרץ ay tumutukoy sa napakarami at mabilis na pagdami, gaya ng pagdagsa o paglipana. Mas natural at marangal sa Tagalog ang “dumami nang sagana” kaysa sa literal na larawang “magkuyog” para sa mga tao.
- source_word: בָאָרֶץ
  choice: sa lupa
  rationale: Ang אֶרֶץ dito ay ang lupa o daigdig na pinamumuhayan ng tao matapos ang baha. Sapat na malawak at natural ang “sa lupa” nang hindi ipinipilit kung lokal na lupain o buong daigdig ang diin.
- source_word: וּרְבוּ בָהּ
  choice: at magpakarami rito
  rationale: Pinananatili ang pag-uulit ng רבה para sa diin, at ang “rito” ay likas na tumutukoy pabalik sa lupa bilang pook ng pagdami.
theological_decisions:
- issue: Kaugnayan ng talata sa utos sa paglikha at sa pagpapala matapos ang baha
  choice: Isinalin bilang panibagong utos at pagpapala sa mga kausap, habang pinananatili ang pag-alingawngaw ng Genesis 1:28 nang walang idinagdag na paliwanag sa mismong teksto.
  alternative: Ituring lamang itong pag-uulit ng Genesis 1:28, o palawakin bilang tahasang pormulang pangtipan.
  rationale: Nasa Hebreo ang pananalitang pautos na kahawig ng naunang pagpapala, ngunit hindi nito tahasang nilulutas sa talatang ito lamang ang buong teolohikal na kaugnayan ng dalawang pahayag.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang tatlong magkakaugnay ngunit hindi ganap na magkaparehong utos: maging mabunga, magpakarami, at dumami nang sagana. Inilagay ang talababa sa pariralang tumutumbas sa שִׁרְצוּ upang malinaw ang tinutukoy nitong alternatibong salin.'
