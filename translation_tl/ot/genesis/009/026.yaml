  text: וַ/יֹּ֕אמֶר בָּר֥וּךְ יְהֹוָ֖ה אֱלֹ֣הֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/026.yaml
  text: And he said, “Blessed be the LORD, the God of Shem, and let Canaan be their servant.”
translation:
  language: tl
  text: At sinabi niya, “Purihin si Yahweh, ang Diyos ni Sem; at maging alipin nila si Canaan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Purihin
  rationale: Sa pormulang pagpapala na nakatuon sa Diyos, natural at tumpak sa modernong Tagalog ang “Purihin,” na nagpapahayag na si Yahweh ay karapat-dapat sa papuri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalang Hebreo sa transliterasyong malinaw na naiiba sa titulong “Panginoon.”
- source_word: עֶבֶד
  choice: alipin
  rationale: Ang Hebreong salita ay tumutukoy rito sa isang taong nasa kalagayan ng sapilitang pagpapasakop o pagkaalipin; mas tuwiran ang “alipin” kaysa “lingkod.”
- source_word: לָמוֹ
  choice: nila
  rationale: Ang hulaping panghalip ay anyong maramihan, kaya pinananatili ang tunay na gramatikal na tensiyon sa “nila” sa halip na gawing isahan.
theological_decisions:
- issue: Ang tinutukoy ng maramihang panghalip sa לָמוֹ
  choice: nila
  alternative: niya / sa kanya
  rationale: Bagaman si Sem ang pinakamalapit na pangngalang isahan, maramihan ang anyong Hebreo. Hindi tahimik na nilulutas ang di-tiyak na reperensiya; pinananatili ang maramihan gaya ng source evidence.
- issue: Kung sino ang tuwirang pinagpapala
  choice: “Purihin si Yahweh, ang Diyos ni Sem”
  alternative: “Pagpalain si Sem ng Diyos”
  rationale: Si Yahweh, hindi si Sem, ang gramatikal na paksa ng בָּרוּךְ; pinananatili nito ang teolohikal na diin ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pangalang “Yahweh,” ang matinding kahulugan ng “alipin,” at ang di-karaniwang maramihang “nila” ng tekstong Hebreo.
