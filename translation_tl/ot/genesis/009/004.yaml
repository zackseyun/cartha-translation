translation:
  language: tl
  text: Ngunit[a] huwag ninyong kainin ang laman kasama ang buhay nito—ang dugo nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “Lamang” at nagpapahiwatig ng paghihigpit sa pahintulot na ibinigay sa talata 3.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, literal: “kasama ang buhay nito, ang dugo nito.”'
    reason: source_syntax
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Nagpapakilala ito ng paghihigpit sa naunang pahintulot na kumain ng mga hayop. Likas sa makabagong Tagalog ang “Ngunit” bilang panandang pagsalungat, habang binabanggit sa talababa ang literal na diwang “lamang.”
- source_word: בָּשָׂר
  choice: laman
  rationale: Tuwirang katumbas ito ng Hebreong tumutukoy sa laman ng nilalang at angkop sa pagbabawal tungkol sa pagkain.
- source_word: בְּנַפְשׁוֹ
  choice: na taglay ang buhay nito
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa buhay na nagbibigay-sigla, hindi sa “kaluluwa” bilang di-materyal na bahagi. Ang “taglay” ay natural na nagpapahayag na hindi dapat kainin ang laman kasama ang buhay nito.
- source_word: דָמוֹ
  choice: ang dugo nito
  rationale: Pinananatili ang payak na kahulugang “dugo” at ang apposisyon nito sa “buhay,” nang hindi pinaiikli ang dalawa bilang “dugong-buhay.”
- source_word: לֹא תֹאכֵלוּ
  choice: huwag ninyong kainin
  rationale: Malinaw at marangal na paraan ito ng pagpapahayag ng pagbabawal sa makabagong Tagalog; ipinakikita ng “ninyong” na maramihan ang kausap.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ kaugnay ng dugo
  choice: Isinalin bilang “buhay,” hindi “kaluluwa.”
  alternative: Maaaring isalin nang higit na literal ayon sa tradisyon bilang “kaluluwa.”
  rationale: Sa kontekstong ito, ang tinutukoy ay ang buhay ng nilalang na iniuugnay sa dugo. Iniiwasan ng “buhay” ang pagpasok ng doktrinang antropolohikal na hindi hinihingi ng teksto.
- issue: Ugnayan ng “buhay” at “dugo”
  choice: 'Pinanatili bilang tuwirang apposisyon sa pamamagitan ng gatlang: “ang buhay nito—ang dugo nito.”'
  alternative: “ang buhay nito, samakatuwid, ang dugo nito” o “ang dugong-buhay nito.”
  rationale: Mas malapit ang gatlang sa maikli at eliptikong pagkakahanay sa Hebreo. Hindi nito lubusang nilulutas kung ang “dugo” ay paliwanag, pagtutumbas, o mas tiyak na paglalarawan ng “buhay.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “laman” sa halip na mas kolokyal na “karne,” at ang gatlang upang mapanatili ang maigsi at bahagyang eliptikong apposisyon ng Hebreo.
