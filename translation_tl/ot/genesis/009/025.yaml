revisions:
- from: At sinabi niya, “Sumpain si Canaan[a]! Magiging alipin siya ng mga alipin[b] ng kanyang mga kapatid.”
  to: At sinabi niya, “Isinumpa si Canaan[a]; magiging alipin siya—alipin ng mga alipin[b]—sa kanyang mga kapatid.”
  rationale: Pinalitan ang optatibong “Sumpain” ng deklaratibong “Isinumpa” upang maipakita ang predikatibong אָרוּר. Inayos ang ayos at bantas ng ikalawang sugnay upang manatiling literal ang “alipin ng mga alipin” at maging malinaw na ang “sa kanyang mga kapatid” ang katumbas ng לְאֶחָיו. Hindi binabago ng rebisyon ang matinding retorika ng sumpa o ang tahasang pagtukoy kay Canaan.
