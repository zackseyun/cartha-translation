base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/025.yaml
  text: And he said[a], “Canaan is cursed[c][b]; he shall be a servant of servants to his brothers.”
translation:
  language: tl
  text: At sinabi niya, “Isinumpa si Canaan[a]; magiging alipin siya—alipin ng mga alipin[b]—sa kanyang mga kapatid.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Si Canaan, hindi si Ham, ang tahasang pinangalanan sa tekstong Hebreo.
    reason: textual_clarification
  - marker: b
    text: Sa literal, “alipin ng mga alipin.” Pinatitindi ng pananalitang Hebreo ang diwa ng sukdulang pagkaalipin; maaari rin itong maunawaan bilang “pinakamababang alipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili ang karaniwang pagkakasunod-sunod ng salaysay na ipinahihiwatig ng wayyiqtol at likas itong pambungad sa tuwirang pananalita sa Filipino.
- source_word: אָרוּר
  choice: Sumpain
  rationale: Isang maringal at maikling pormula ng sumpa na tumutugma sa predikatibong אָרוּר. Hindi nito dinaragdagan ang teksto ng tahasang tagaganap ng sumpa.
- source_word: כְּנָעַן
  choice: Canaan
  rationale: Karaniwang transliterasyon ng pangalang pantangi; si Canaan, hindi si Ham, ang tahasang pinangalanan sa Hebreo.
- source_word: עֶבֶד עֲבָדִים
  choice: alipin ng mga alipin
  rationale: Pinananatili ang pag-uulit at matinding puwersa ng idyomang Hebreo sa halip na agad itong ipakahulugang “pinakamababang alipin.” Ang “alipin” ay angkop sa matinding kalagayan ng pagkabusabos sa kontekstong ito.
- source_word: יִהְיֶה
  choice: Magiging
  rationale: Ipinahahayag ang kalagayang mangyayari bilang bunga ng pahayag ng sumpa, sa natural na modernong Filipino.
- source_word: לְאֶחָיו
  choice: ng kanyang mga kapatid
  rationale: Likas na ipinakikita ng pariralang “alipin ... ng” ang paglilingkod o pagpapasakop sa kanyang mga kapatid, habang pinananatili ang literal na ugnayang pampamilya ng Hebreo.
theological_decisions:
- issue: Ang pinatutungkulan ng sumpa ni Noe
  choice: Si Canaan ang tahasang pinangalanang sinusumpa.
  alternative: Ipakahulugang si Ham mismo ang direktang sinusumpa.
  rationale: Malinaw na כְּנָעַן, “Canaan,” ang nasa tekstong Hebreo. Hindi dapat ilipat ng salin kay Ham ang tahasang pahayag ng talata.
- issue: Lakas ng katawagang tumutukoy sa pagkaalipin
  choice: Gamitin ang “alipin ng mga alipin.”
  alternative: “lingkod ng mga lingkod” o “pinakamababang alipin”
  rationale: Masasalamin ng “alipin” ang matinding pagkabusabos, at pinananatili ng literal na pag-uulit ang retorika at bahagyang kalabuan ng idyomang Hebreo; ipinaliliwanag sa talababa ang posibleng superlatibong diwa.
- issue: Puwersa ng אָרוּר
  choice: Isalin bilang pormulang “Sumpain si Canaan.”
  alternative: “Kasumpa-sumpa si Canaan” o “Nasa ilalim ng sumpa si Canaan”
  rationale: Maaaring unawain ang anyong Hebreo bilang pormal na pagpapahayag o pagbigkas ng sumpa. Ang “Sumpain” ay maikli, maringal, at hindi nagdaragdag ng hindi pinangalanang tagaganap.
translation_notes:
  register: Modernong Filipino na maringal ngunit madaling maunawaan. Pinanatili ang maikling pormula ng sumpa at ang matinding pag-uulit ng Hebreo. Ginamit ang “kanyang” sa halip na “kaniyang” bilang karaniwang modernong baybay.
