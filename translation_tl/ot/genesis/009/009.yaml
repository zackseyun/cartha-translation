  text: And as for me[a], behold, I am establishing my covenant with you and with your offspring after you.
translation:
  language: tl
  text: At ako naman, narito, itinatatag ko ang aking tipan sa inyo at sa inyong mga supling[a] na darating pagkaraan ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binhi.” Ang salitang Hebreo ay pangngalang kolektibo na maaaring tumukoy sa supling o mga inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: At ako naman
  rationale: Pinananatili nito ang bahagyang pagdiriin sa nagsasalita at ang paglipat ng diskurso na ipinahihiwatig ng pangatnig at malayang panghalip.
- source_word: הִנְנִי
  choice: narito
  rationale: Nagbibigay ito ng taimtim na pansin at pagdiriin nang hindi inililihis ang diwa tungo sa simpleng pagpapakilala sa sarili.
- source_word: מֵקִים
  choice: itinatatag ko
  rationale: Ang Hiphil participle ng קום ay tumutukoy rito sa aktuwal na pagtatatag ng tipan; ang aspektong nagaganap ay likas na naipapahayag sa Filipino sa anyong ito.
- source_word: בְּרִיתִי
  choice: ang aking tipan
  rationale: Ang “tipan” ang malinaw at kinikilalang salin ng בְּרִית sa konteksto ng pormal na ugnayan ng Diyos at mga tao.
- source_word: אִתְּכֶם
  choice: sa inyo
  rationale: Likas nitong ipinapahayag sa Filipino ang mga taong kasama sa tipan.
- source_word: וְאֶת זַרְעֲכֶם
  choice: at sa inyong mga supling[a]
  rationale: Ang זֶרַע ay pangngalang kolektibo na maaaring tumukoy sa supling o mga inapo. Ang “mga supling” ay natural sa modernong Filipino at hindi labis na nagpapalawak ng kahulugan.
- source_word: אַחֲרֵיכֶם
  choice: na susunod sa inyo
  rationale: Malinaw at natural nitong ipinapahayag ang mga susunod na salinlahi na tinutukoy ng parirala.
theological_decisions:
- issue: Terminong pangtipan sa konteksto ng ugnayan ng Diyos at tao
  choice: ang aking tipan
  alternative: ang aking kasunduan
  rationale: Pinananatili ng “tipan” ang natatanging kategoryang biblikal ng בְּרִית nang hindi nagdaragdag ng denominasyonal o sistematikong paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “At ako naman, narito” ay sadyang nagpapanatili sa pagdiriin at taimtim na tono ng Hebreo; ang “mga supling” ay madaling maunawaan habang iniiwan sa talababa ang literal na larawang “binhi.”
