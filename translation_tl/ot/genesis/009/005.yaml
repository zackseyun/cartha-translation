  text: וְ/אַ֨ךְ אֶת דִּמְ/כֶ֤ם לְ/נַפְשֹֽׁתֵי/כֶם֙ אֶדְרֹ֔שׁ מִ/יַּ֥ד כָּל חַיָּ֖ה אֶדְרְשֶׁ֑/נּוּ וּ/מִ/יַּ֣ד הָֽ/אָדָ֗ם מִ/יַּד֙ אִ֣ישׁ אָחִ֔י/ו אֶדְרֹ֖שׁ אֶת נֶ֥פֶשׁ הָֽ/אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/005.yaml
  text: And surely I will require your blood for your lives[a]. From the hand of every beast I will require it[e][d][c][b], and from the hand of man—from the hand of each man's brother—I will require the life of the man.
translation:
  language: tl
  text: At tunay ngang hihingin ko ang inyong dugo para sa inyong mga buhay.[a] Mula sa kamay ng bawat hayop ay hihingin ko ito,[b] at mula sa kamay ng tao—mula sa bawat tao, dahil sa buhay ng kanyang kapwa—hihingin ko ang buhay ng tao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang inyong dugong-buhay.” Sa Hebreo, literal na “inyong dugo para sa inyong mga buhay.” Magkaugnay ang dugo at buhay sa pahayag na ito.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mula sa kamay ng bawat hayop.” Ang “mula sa kamay” ay idyomang tumutukoy sa ahensiya at pananagutan.
    reason: hebrew_idiom
  - marker: c
    text: Literal na “at mula sa kamay ng tao, mula sa kamay ng isang tao—kanyang kapatid—hihingin ko ang buhay ng tao.” Ang huling parirala ay maaaring tumukoy sa kapwa tao, hindi lamang sa kadugong kapatid.
    reason: syntax_and_lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  choice: At tunay nga
  rationale: Pinananatili ang pang-ugnay na וְ at ang mariing puwersa ng אַךְ sa likas at marangal na Tagalog.
- source_word: דִּמְכֶם לְנַפְשֹׁתֵיכֶם
  choice: magbubo ng inyong dugo at kumitil ng inyong buhay
  rationale: Pinananatiling magkaugnay ngunit magkahiwalay ang 'dugo' at 'buhay.' Ginawang tahasan ang pananagutang ipinahihiwatig ng idyomang Hebreo upang maging malinaw sa Tagalog.
- source_word: אֶדְרֹשׁ
  choice: pananagutin ko
  rationale: Sa kontekstong ito, ang דרשׁ ay paghingi ng pagsusulit o pananagutan dahil sa pagdanak ng dugo; natural na naihahatid ito ng 'pananagutin ko.'
- source_word: מִיַּד
  choice: pananagutin ... ang
  rationale: Ang literal na 'mula sa kamay ng' ay idyoma ng ahensiya at pananagutan. Sa modernong Tagalog, mas malinaw at likas na ihayag ang diwang legal kaysa kopyahin ang salitang 'kamay.'
- source_word: כָּל חַיָּה
  choice: bawat hayop
  rationale: Tumutukoy ito sa hayop bilang kaibahan sa tao; ang 'hayop' ang karaniwan at wastong modernong katumbas.
- source_word: אִישׁ אָחִיו
  choice: ang bawat isa dahil sa buhay ng kanyang kapwa
  rationale: Ang literal na 'isang tao, ang kanyang kapatid' ay nagpapasidhi sa pananagutan ng tao sa buhay ng kapwa niya. Pinananatili ng 'bawat isa' ang distributibong diwa at ng 'kapwa' ang ugnayang pantao nang hindi nililimitahan sa kadugong kapatid.
- source_word: נֶפֶשׁ הָאָדָם
  choice: buhay ng tao
  rationale: Sa konteksto ng dugo at pagpatay, ang נֶפֶשׁ ay kongkretong 'buhay,' hindi isang pahayag tungkol sa hiwalay na kaluluwa.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa konteksto ng pagdanak ng dugo
  choice: buhay
  alternative: kaluluwa
  rationale: Iniuugnay ng talata ang dugo sa pagkakitil ng buhay. Ang 'kaluluwa' ay maaaring magpasok ng metapisikal na kahulugang hindi siyang tuon ng Hebreo.
- issue: Saklaw ng אִישׁ אָחִיו
  choice: bawat isa ... kanyang kapwa
  alternative: bawat lalaki ... kanyang kapatid
  rationale: Ang parirala ay maaaring literal na tumbasan bilang 'isang tao, ang kanyang kapatid,' ngunit dito ay nagpapahayag ito ng pangkalahatang pananagutan ng isang tao sa kapwa tao. Hindi ito dapat limitahan sa mga lalaki o magkakadugo lamang.
- issue: Pagpapahayag ng banal na paghingi ng pananagutan
  choice: pananagutin ko
  alternative: hihingin ko
  rationale: Pinananatili ang hudisyal na bigat ng דרשׁ nang hindi tinutukoy rito ang tiyak na paraan o institusyong gagamitin sa pagpapatupad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang 'pananagutin' upang natural na ihatid ang paulit-ulit na hudisyal na pandiwang Hebreo. Iniwasan ang salitang 'kaluluwa' dahil 'buhay' ang hinihingi ng konteksto. Ang mga ekspansiyong 'magbubo' at 'kumitil' ay nagpapalinaw sa implicit na sanhi ng pananagutan; inilakip sa talababa ang higit na literal na anyo.
