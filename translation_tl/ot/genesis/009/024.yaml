  text: When Noah awoke from his wine[a], he knew what his youngest son had done to him.
translation:
  language: tl
  text: Nang magising si Noe mula sa pagkalango niya sa alak, nalaman niya kung ano ang ginawa sa kanya ng bunso niyang anak na lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakababatang anak na lalaki.” Ang salitang Hebreo ay maaaring mangahulugang “maliit,” “bata,” “mas bata,” o “pinakabata,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקֶץ
  choice: Nang magising
  rationale: Ang יקץ ay tumutukoy sa paggising mula sa pagkakatulog. Hindi ito isinaling “nang mahimasmasan” sapagkat iyon ay higit na interpretatibo.
- source_word: מִיֵּינוֹ
  choice: mula sa pagkakalasing niya sa alak
  rationale: Literal itong “mula sa kanyang alak,” isang Hebreong pahayag para sa paggising mula sa kalagayang dulot ng alak. Ang natural na salin sa Tagalog ay nililinaw ang idyoma nang hindi inaalis ang pagbanggit sa alak.
- source_word: וַיֵּדַע
  choice: nalaman niya
  rationale: Bagaman karaniwang nangangahulugang “alam,” sa daloy ng salaysay ipinahihiwatig nito na napag-alaman ni Noe matapos siyang magising ang naunang nangyari.
- source_word: אֵת אֲשֶׁר עָשָׂה לוֹ
  choice: ang ginawa sa kanya
  rationale: Pinananatili nitong pangkalahatan ang bagay na ginawa kay Noe at hindi tinutukoy ang eksaktong uri ng ginawa, gaya ng Hebreo.
- source_word: בְּנוֹ הַקָּטָן
  choice: kanyang bunsong anak
  rationale: Ang קָטָן ay maaaring mangahulugang maliit, bata, mas bata, o pinakabata. Sa ugnayang pampamilya, natural sa Tagalog ang “bunsong anak,” ngunit nararapat ilahad sa talababa ang posibleng “nakababatang anak.”
theological_decisions:
- issue: Uri ng ginawa kay Noe
  choice: Isinaling pangkalahatan bilang “ang ginawa sa kanya” nang hindi tinutukoy ang ginawa.
  alternative: Ipaliwanag ito bilang pagkakita at pagbabalita ng kahubaran ni Noe, o bilang isang mas mabigat na seksuwal na paglabag.
  rationale: Hindi tinutukoy ng talata mismo ang ginawa. Pinananatili ng salin ang tunay na kalabuan ng Hebreo at hindi nagdaragdag ng isang partikular na interpretasyon.
- issue: Tinutukoy ng “kanyang bunsong anak”
  choice: Pinanatili ang literal na ugnayang “kanyang bunsong anak” nang hindi pinapangalanan kung sino iyon.
  alternative: Linawin sa salin na si Ham o si Canaan ang tinutukoy, o isalin lamang na “nakababatang anak.”
  rationale: May mga tanong sa mas malawak na salaysay tungkol sa tinutukoy, ngunit hindi nagbibigay ng pangalan ang pariralang Hebreo sa talatang ito. Hindi dapat lutasin ng salin ang hindi nilulutas ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Noe” bilang karaniwang anyong Tagalog ng pangalan. Ang “pagkakalasing niya sa alak” ay natural na paglalahad ng Hebreong idyomang literal na “mula sa kanyang alak,” samantalang ang kilos na ginawa kay Noe ay sadyang hindi ipinaliwanag.
