  naturalness: Natural at marangal ang daloy ng salin matapos ang maliliit na pagbabago. Ang “bunso niyang anak na lalaki” ay malinaw at idiomatiko sa makabagong Filipino.
  terminology: Ang “Noe” ay angkop na anyong Tagalog. Pinananatili ng “kung ano ang ginawa sa kanya” ang hindi-tinutukoy na uri ng ginawa, gaya ng Hebreo. Ang “bunso” ay ang pinakamalamang na kahulugan sa kontekstong pampamilya, habang ang talababa ay maayos na nagtatala ng alternatibo.
