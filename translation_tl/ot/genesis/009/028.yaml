  register: Modernong Filipino Tagalog na malinaw, marangal, at likas sa karaniwang mambabasa. Ginamit ang “nabuhay pa” upang idiomatikong maipakita na ang 350 taon ay ang tagal ng buhay ni Noe pagkatapos ng baha.
