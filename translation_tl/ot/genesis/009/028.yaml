lexical_decisions:
- source_word: וַיְחִי
  choice: nabuhay pa
  rationale: Ang wayyiqtol ng חיה ay nagsasaad ng tagal ng patuloy na buhay ni Noe. Likas sa modernong Tagalog ang “nabuhay pa” kapag tinutukoy ang mga taong idinagdag sa buhay matapos ang isang pangyayari; hindi ito nagpapahiwatig lamang ng pagkaligtas.
- source_word: נֹחַ
  choice: Noe
  rationale: Karaniwang anyo ng pangalang biblikal na Noah sa Tagalog.
- source_word: אַחַר
  choice: pagkatapos ng
  rationale: Malinaw at likas na panandang temporal sa Tagalog para sa panahong sumunod sa baha.
- source_word: הַמַּבּוּל
  choice: baha
  rationale: Tumutukoy sa tiyak at kilalang baha sa salaysay; sapat na itong matukoy sa pariralang “pagkatapos ng baha,” at mas natural kaysa sa mas matayog na “delubyo.”
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: tatlong daan at limampung taon
  rationale: Tuwirang ipinapahayag ang pinagsamang bilang na 350 sa natural na ayos ng modernong Tagalog.
