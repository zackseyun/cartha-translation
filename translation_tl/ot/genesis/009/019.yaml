  text: שְׁלֹשָׁ֥ה אֵ֖לֶּה בְּנֵי נֹ֑חַ וּ/מֵ/אֵ֖לֶּה נָֽפְצָ֥ה כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/019.yaml
  text: These three were the sons of Noah[a], and from these the whole earth was populated.
translation:
  language: tl
  text: Ang tatlong ito ang mga anak ni Noe, at mula sa kanila ay kumalat ang mga tao sa buong daigdig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at mula sa kanila ay kumalat ang buong daigdig.” Maaari ring isalin ang “daigdig” bilang “lupain.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשָׁה אֵלֶּה
  choice: Ang tatlong ito
  rationale: Pinananatili ang diin ng inuunang bilang at pantukoy sa Hebreo, habang natural ang ayos sa modernong Tagalog.
- source_word: בְּנֵי נֹחַ
  choice: ang mga anak ni Noe
  rationale: Tuwirang isinasalin ang construct phrase; hindi kailangang magdagdag ng tahasang pandiwang pantulong sa Tagalog.
- source_word: וּמֵאֵלֶּה
  choice: at mula sa kanila
  rationale: Malinaw na ibinabalik ng panghalip ang tinutukoy sa tatlong anak ni Noe; mas natural ito kaysa ulitin ang “mga ito.”
- source_word: נָפְצָה
  choice: kumalat ang mga tao
  rationale: Ang ugat ay tumutukoy sa pagkalat o pagkakalat. Sa kontekstong talaangkanan, ang likas na Tagalog ay nagpapahayag na ang mga tao ay kumalat, nang hindi pinapalitan ang larawang nasa pandiwa ng mas interpretatibong “napuno ng tao.”
- source_word: כָל הָאָרֶץ
  choice: sa buong daigdig
  rationale: Ang “buong daigdig” ay natural at marangal na Tagalog para sa pangkalahatang saklaw ng post-baha na konteksto; maaari ring mangahulugan ang אֶרֶץ ng lupain, kaya itinatala ang alternatibo.
theological_decisions:
- issue: Saklaw ng הָאָרֶץ sa konteksto pagkatapos ng baha
  choice: buong daigdig
  alternative: buong lupain
  rationale: Ibinubuod ng talata ang pagkalat ng sangkatauhan mula sa mga anak ni Noe, kaya mas malamang ang pandaigdig na saklaw, bagaman tunay na leksikal na posibilidad ang “lupain.”
- issue: Paksa ng נָפְצָה
  choice: kumalat ang mga tao
  alternative: kumalat ang buong daigdig
  rationale: Gramatikal na paksa sa Hebreo ang “buong daigdig,” ngunit metonimiko itong tumutukoy sa mga naninirahan dito. Ginagawang tahasan ng salin ang likas na kahulugan sa Tagalog, habang pinananatili sa talababa ang mas literal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Iniwasan ang mabigat na “pinamayanan” upang mapanatili ang pangunahing larawan ng Hebreong pandiwa na pagkalat.
