  text: וַ/יְבָ֣רֶךְ אֱלֹהִ֔ים אֶת נֹ֖חַ וְ/אֶת בָּנָ֑י/ו וַ/יֹּ֧אמֶר לָ/הֶ֛ם פְּר֥וּ וּ/רְב֖וּ וּ/מִלְא֥וּ אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/001.yaml
  text: And God blessed Noah and his sons[a], and said to them, “Be fruitful and multiply and fill the earth.”
translation:
  language: tl
  text: Pinagpala ng Diyos si Noe at ang mga anak niyang lalaki. Sinabi ng Diyos sa kanila, “Magpakarami kayo, dumami, at punuin ninyo ang daigdig.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lupain”; ngunit mas angkop dito ang “ang daigdig” dahil sa konteksto pagkatapos ng baha at sa pag-uulit ng Genesis 1:28.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: pinagpala
  rationale: Ipinahihiwatig ng piel ng ברך ang aktuwal na pagkakaloob ng pagpapala, hindi lamang ang pagsasalita nang mabuti tungkol sa isang tao.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Sa salaysay na ito, tumutukoy ang אֱלֹהִים sa iisang Diyos.
- source_word: נֹחַ
  choice: Noe
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa makabagong saling Tagalog ng Bibliya.
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng Hebreo, kaya hindi ito ginawang mas malawak na “mga anak.”
- source_word: וַיֹּאמֶר לָהֶם
  choice: at sinabi niya sa kanila
  rationale: Likas na pormula ito sa pagsasalaysay at hindi nagdaragdag ng puwersang wala sa Hebreo.
- source_word: פְּרוּ
  choice: Magpakarami kayo
  rationale: Sa kontekstong pantao, natural nitong ipinahahayag ang pagkakaroon ng mga supling habang pinananatili ang pag-uugnay sa Genesis 1:28.
- source_word: וּרְבוּ
  choice: dumami
  rationale: Ipinahahayag nito ang pagdami sa bilang at pinananatili ang pagkakaiba nito sa naunang utos.
- source_word: וּמִלְאוּ
  choice: punuin ninyo
  rationale: Tuwirang kahulugan nito ang “punuin”; hindi nito kailangang ipahiwatig ang muling pagpuno.
- source_word: הָאָרֶץ
  choice: ang buong daigdig
  rationale: Pinakamainam sa konteksto pagkatapos ng baha ang pandaigdig na saklaw. Ang “buong” ay natural na paglilinaw sa Tagalog ng kahulugang ito, bagaman maaari ring mangahulugang “lupain” ang salita.
theological_decisions:
- issue: Kaugnayan sa utos-pagpapala sa paglikha sa Genesis 1:28
  choice: Pinanatili ang magkakasunod na “Magpakarami kayo, dumami, at punuin ninyo ang buong daigdig” upang marinig ang sinadyang pag-uulit ng pananalita sa paglikha.
  alternative: “Magkaroon kayo ng maraming anak at panahanan ninyo ang buong daigdig.”
  rationale: Inuulit ng Hebreo ang wika ng pagpapala sa paglikha. Ang mas malayang pagpapahayag ay mas madulas ngunit pinapahina ang leksikal at teolohikal na ugnayan sa Genesis 1:28.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “anak na lalaki” para sa tiyak na kasarian ng בנים, at ang bahagyang pormal na magkakasunod na mga utos upang mapanatili ang alingawngaw ng Genesis 1:28.
