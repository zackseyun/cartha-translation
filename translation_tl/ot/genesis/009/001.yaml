revisions:
- from: At pinagpala ng Diyos si Noe at ang kanyang mga anak na lalaki, at sinabi niya sa kanila, “Magpakarami kayo, dumami, at punuin ninyo ang buong daigdig.[a]”
  to: Pinagpala ng Diyos si Noe at ang mga anak niyang lalaki. Sinabi ng Diyos sa kanila, “Magpakarami kayo, dumami, at punuin ninyo ang daigdig.[a]”
  rationale: Inalis ang hindi tahasang “buong” upang manatiling malapit sa saklaw na ipinahahayag ng Hebreo habang pinananatili ang “daigdig” bilang pinakamainam na pagpili sa konteksto. Ginawang tahasan ang Diyos bilang nagsalita upang maiwasan ang posibleng kalabuan sa Tagalog, at inayos ang ayos ng parirala para sa higit na likas na daloy.
