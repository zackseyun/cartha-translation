id: GEN.9.27
reference: Genesis 9:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יַ֤פְתְּ אֱלֹהִים֙ לְ/יֶ֔פֶת וְ/יִשְׁכֹּ֖ן בְּ/אָֽהֳלֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/027.yaml
  text: May God enlarge Japheth[a], and may he dwell in the tents of Shem, and let Canaan be a servant to them.
translation:
  language: tl
  text: Bigyan nawa ng Diyos ng malawak na lugar si Jafet, at manahan nawa siya[a] sa mga tolda ni Sem; at maging alipin nila si Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring ang ibig sabihin ay, “at manahan nawa ang Diyos sa mga tolda ni Sem”; maaari rin namang, “at manahan nawa si Jafet sa mga tolda ni Sem.” Hindi tahasang binabanggit sa Hebreo ang paksa ng “manahan.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַפְתְּ
  choice: bigyan ... ng malawak na lugar
  rationale: Ipinahahayag nito ang diwang ‘gawing maluwang’ o ‘palawakin ang lugar para sa’ nang natural sa modernong Tagalog. May paglalaro sa tunog ng pandiwa at ng pangalang Jafet sa Hebreo, ngunit hindi ito ganap na maililipat sa Tagalog.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang salita, isahan ang pandiwa at ang tinutukoy ay ang iisang Diyos.
- source_word: לְיֶפֶת
  choice: si Jafet
  rationale: 'Ang unlaping לְ ay ipinahayag bilang tumatanggap ng pagpapalawak: binibigyan si Jafet ng malawak na lugar.'
- source_word: וְיִשְׁכֹּן
  choice: at manahan nawa siya
  rationale: Pinananatili ng ‘nawa’ ang anyong paghiling. Hindi tinutukoy ng panghalip na ‘siya’ kung Diyos o si Jafet ang paksa, gaya ng tunay na kalabuan sa Hebreo.
- source_word: בְּאָהֳלֵי שֵׁם
  choice: sa mga tolda ni Sem
  rationale: Tuwirang pinananatili ang larawang ‘mga tolda’ sa halip na gawing pangkalahatang ‘mga tahanan.’
- source_word: וִיהִי
  choice: at maging
  rationale: Likas na Tagalog na anyong paghiling o pagpapahayag ng itinakdang kalagayan sa konteksto ng basbas at sumpa.
- source_word: כְנַעַן
  choice: Canaan
  rationale: Pinananatili ang karaniwang anyo ng pangalang pantangi sa Filipino.
- source_word: עֶבֶד
  choice: alipin
  rationale: Sentral sa pahayag ang kalagayan ng pagpapasakop; mas tumpak dito ang ‘alipin’ kaysa sa mas banayad na ‘lingkod.’
- source_word: לָמוֹ
  choice: nila
  rationale: Ang anyo ay ginagamit bilang maramihang panghalip dito at pinakamalinaw na tumutukoy kina Sem at Jafet sa daloy ng pahayag.
theological_decisions:
- issue: Ang paksa ng ‘manahan nawa ... sa mga tolda ni Sem’
  choice: Pinanatili sa pangunahing teksto ang hindi tiyak na paksa sa pamamagitan ng ‘siya.’
  alternative: Maaaring ang Diyos ang manahan sa mga tolda ni Sem; maaari ring si Jafet ang manahan doon.
  rationale: Walang tahasang paksa ang pandiwang Hebreo, at kapuwa posible sa konteksto ang Diyos at si Jafet. Hindi dapat tahimik na piliin ang isa at alisin ang tunay na kalabuan ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘tolda’ upang mapanatili ang konkretong larawan, ‘alipin’ upang hindi palambutin ang katayuang ipinahahayag, at ‘siya’ upang mapanatili ang kalabuan ng orihinal.
