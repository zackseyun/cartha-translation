  naturalness: Ang “sa pagitan ko, ninyo, at ng bawat nilalang na buháy” ay malinaw at natural na modernong Tagalog. Inayos din ang nawawalang panandang pansara ng sipi.
  terminology: Ang “Diyos,” “tanda,” “tipan,” “nilalang na buháy,” at “salinlahi” ay angkop, pare-pareho, at marangal na mga katawagan. Pinananatili ang “tipan” para sa בְּרִית at “tanda” para sa אוֹת.
