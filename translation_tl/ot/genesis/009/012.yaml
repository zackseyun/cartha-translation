base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/012.yaml
  text: And God said[a], “This is the sign of the covenant that I am giving between me and you and every living creature that is with you[b], for perpetual generations:”
translation:
  language: tl
  text: At sinabi ng Diyos, “Ito ang tanda ng tipan na ibinibigay ko sa pagitan ko, ninyo, at ng bawat nilalang na buháy na kasama ninyo, para sa lahat ng salinlahi magpakailanman:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa Tagalog ang “At sinabi” bilang pagpapatuloy.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang salin para sa iisang Diyos na nagsasalita kay Noe sa kontekstong ito.
- source_word: זֹאת אוֹת הַבְּרִית
  choice: Ito ang tanda ng tipan
  rationale: Ang אוֹת ay tanda o nakikitang palatandaan, at ang בְּרִית ay teknikal na katawagang “tipan.”
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: na ibinibigay ko
  rationale: Pinananatili ang literal at aspektuwal na diwa ng participle נֹתֵן, “ibinibigay,” sa halip na palitan ito ng “ginagawa.”
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין
  choice: sa inyo at sa
  rationale: Ang relasyong ipinahahayag ng inuulit na בֵּין ay likas na naihahatid sa Tagalog sa pamamagitan ng “sa ... at sa ...”; nauunawaan na ang Diyos ang kabilang panig dahil siya ang nagsasalita at nagbibigay.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: bawat nilalang na buháy
  rationale: Saklaw nito ang mga hayop na kasama ni Noe; iniiwasan ng “nilalang na buháy” ang maling antropolohikal na pahiwatig ng “kaluluwa.”
- source_word: אֲשֶׁר אִתְּכֶם
  choice: na kasama ninyo
  rationale: Tuwirang kinikilala ang mga buháy na nilalang na kapiling ni Noe at ng kanyang sambahayan.
- source_word: לְדֹרֹת עוֹלָם
  choice: para sa lahat ng salinlahi magpakailanman
  rationale: Pinananatili ang parehong diwa ng sunod-sunod na mga salinlahi at ang walang takdang pagpapatuloy ng עוֹלָם sa natural na Tagalog.
theological_decisions:
- issue: Pandiwa ng tipan sa נֹתֵן
  choice: na ibinibigay ko
  alternative: na itinatatag ko / na ginagawa ko
  rationale: Ang Hebreo ay literal na “ibinibigay.” Natural din ito sa Tagalog kapag ang ibinibigay ay ang tanda ng tipan, kaya hindi kailangang palitan ng mas interpretatibong pandiwa.
- issue: Saklaw ng נֶפֶשׁ חַיָּה
  choice: bawat nilalang na buháy
  alternative: bawat buháy na kaluluwa / bawat buháy na nilalang
  rationale: Kasama sa saklaw ang mga hayop. Hindi ginagamit ang “kaluluwa” upang hindi magpasok ng antropolohikal na kahulugang hindi hinihingi ng konteksto.
- issue: Ugnayan ng tanda at tipan
  choice: tanda ng tipang ibinibigay ko
  alternative: tanda na ibinibigay ko ng tipan
  rationale: Ang pagkakabuo ay sumusunod sa Hebreong “tanda ng tipan” habang hinahayaang ang relative clause ay tumukoy sa tipan; hindi nito nilulutas nang higit sa kailangan ang posibleng semantikong lapit ng pagbibigay sa tanda.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “tipan,” “tanda,” at “salinlahi” bilang pamilyar ngunit dignified na bokabularyong biblikal. Nilagyan ng tuldik ang “buháy” upang malinaw ang bigkas at maiwasang mabasa bilang “búhay.”
