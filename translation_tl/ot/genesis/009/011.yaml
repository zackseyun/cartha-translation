id: GEN.9.11
reference: Genesis 9:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֤י אֶת בְּרִיתִ/י֙ אִתְּ/כֶ֔ם וְ/לֹֽא יִכָּרֵ֧ת כָּל בָּשָׂ֛ר ע֖וֹד מִ/מֵּ֣י הַ/מַּבּ֑וּל וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְ/שַׁחֵ֥ת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/011.yaml
  text: 'And I will establish my covenant with you: never again will all flesh be cut off by the waters of the flood[b][a], and never again will there be a flood to destroy the earth.'
translation:
  language: tl
  text: 'At itatatag ko ang aking tipan sa inyo: hindi na muling malilipol[b] sa tubig ng baha ang lahat ng may buhay[a], at hindi na muling magkakaroon ng baha upang wasakin ang lupa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “lahat ng laman”; sa kontekstong ito, malawak ang tinutukoy at kabilang ang mga tao at mga hayop.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mapupuksa.” Literal na “mapuputol” ang pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: itatatag ko
  rationale: Ang Hifil ng קום sa pormulang pangtipan ay nangangahulugang itatag o pagtibayin. Ang anyong panghinaharap ay angkop sa pangakong nasa tuwirang pananalita ng Diyos, at pinananatili ng “itatatag” ang marangal na himig nang hindi ipinapasyang bagong sinisimulan lamang o pinagtitibay ang tipan.
- source_word: בְּרִיתִי
  choice: ang aking tipan
  rationale: Ang “tipan” ang likas at kinikilalang salin ng בְּרִית sa kasalukuyang Filipino at pinananatili nito ang mahalagang katawagang pampanitikan at teolohikal sa Genesis.
- source_word: אִתְּכֶם
  choice: sa inyo
  rationale: Malinaw at natural nitong ipinahihiwatig na maramihan ang kinakausap, nang hindi nangangailangan ng dagdag na “sa inyong lahat.”
- source_word: יִכָּרֵת
  choice: malilipol
  rationale: Literal na “mapuputol” ang Niphal ng כרת, ngunit sa konteksto ng paghatol sa baha ay tumutukoy ito sa pagkalipol. Ang “malilipol” ay natural sa Filipino at pinananatili ang diwa ng lubusang pagkawasak; inilalahad sa talababa ang literal na larawan.
- source_word: כָּל־בָּשָׂר
  choice: ang lahat ng may buhay
  rationale: Literal itong “lahat ng laman,” ngunit sa salaysay ng baha ay malawak ang saklaw at kabilang ang mga tao at hayop. Mas malinaw sa ordinaryong mambabasa ang “lahat ng may buhay” kaysa “lahat ng laman,” na sa modernong Filipino ay madaling maunawaang karne lamang; pinananatili sa talababa ang literal na anyo at saklaw.
- source_word: עוֹד
  choice: hindi na muling
  rationale: Sa inuulit na negatibong pangako, ang עוֹד ay may idiomatikong diwang “never again,” na likas na ipinahahayag sa Filipino bilang “hindi na muling.”
- source_word: מִמֵּי הַמַּבּוּל
  choice: sa tubig ng baha
  rationale: Ipinahihiwatig ng מן dito ang pinagmulan o paraang mapanira. Ang “sa tubig ng baha” ay maikli, natural, at malapit sa Hebreo.
- source_word: מַבּוּל
  choice: baha
  rationale: Ang “baha” ang karaniwan at malinaw na katumbas ng מַבּוּל sa salaysay ni Noe.
- source_word: לְשַׁחֵת
  choice: upang wasakin
  rationale: Sa kontekstong ito, ang שׁחת ay tumutukoy sa mapanirang paghatol. Direkta at natural ang “wasakin.”
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Maaaring mangahulugan ang אֶרֶץ ng lupa, lupain, o daigdig. Pinananatili ng “lupa” ang lawak at bahagyang kalabuan ng Hebreo nang hindi tahasang ipinapasiya sa salin ang heograpikong saklaw.
theological_decisions:
- issue: Saklaw ng כָּל־בָּשָׂר sa pangako ng tipan
  choice: Isinaling “lahat ng may buhay,” na sumasaklaw sa mga tao at iba pang nilalang na may buhay.
  alternative: “lahat ng tao” o literal na “lahat ng laman”
  rationale: Kasama sa agarang konteksto ng tipan pagkatapos ng baha ang mga tao at mga hayop. Iniiwasan ng salin ang di-makatwirang paglilimita sa sangkatauhan lamang, habang ipinaliliwanag sa talababa ang literal na idyoma.
- issue: Diwa ng קום sa pormulang pangtipan
  choice: “itatatag ko ang aking tipan”
  alternative: “pagtitibayin ko ang aking tipan” o “paninindigan ko ang aking tipan”
  rationale: Ang “itatatag” ay nagpapanatili sa pormal na wikang pangtipan at hindi tahasang lumulutas sa tanong kung bagong pinasisimulan ang tipan o pormal na pinagtitibay ito.
- issue: Saklaw ng הָאָרֶץ
  choice: “ang lupa”
  alternative: “ang daigdig” o “ang lupain”
  rationale: May likas na saklaw ang salitang Hebreo na maaaring tumukoy sa lupa, lupain, o daigdig. Ang “lupa” ay nagpapanatili ng tunay na kalabuan sa halip na magtakda ng isang heograpikong interpretasyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tipan” upang panatilihin ang pormal na himig ng talata; iniwasan ang masyadong literal ngunit madaling mapagkamalang “lahat ng laman,” at inilagay ang impormasyong iyon sa talababa.
