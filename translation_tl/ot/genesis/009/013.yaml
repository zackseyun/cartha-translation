base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/013.yaml
  text: I have set my bow in the cloud[a], and it will be a sign of the covenant between me and the earth.
translation:
  language: tl
  text: Inilagay ko ang aking busog sa ulap[a], at ito ay magiging tanda ng tipan sa pagitan ko at ng daigdig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “aking bahaghari.” Literal na “aking busog” ang sinasabi ng Hebreo, gamit ang karaniwang salita para sa busog; sa kontekstong ito, tumutukoy ito sa bahaghari sa ulap.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַשְׁתִּי
  choice: aking busog
  rationale: Ang קֶשֶׁת ay karaniwang salitang Hebreo para sa busog bilang sandata. Sa konteksto ng ulap, tumutukoy ito sa bahaghari, ngunit pinananatili sa pangunahing teksto ang literal na larawan ng busog at inilalagay sa talababa ang kontekstuwal na kahulugan.
- source_word: נָתַתִּי
  choice: Inilagay ko
  rationale: Maaaring mangahulugan ang נתן na ibigay, ilagay, o itakda. Ang “inilagay ko” ang natural na Tagalog para sa paglalagay ng busog sa ulap at ang aspektong naganap ay may patuloy na kabuluhan sa kasalukuyan.
- source_word: בֶּעָנָן
  choice: sa ulap
  rationale: Isahan at tiyak ang anyong Hebreo. Natural sa Tagalog ang “sa ulap,” na maaari ring tumukoy sa ulap bilang pangkalahatang tagpuan ng bahaghari.
- source_word: וְהָיְתָה
  choice: at ito ang magiging
  rationale: 'Sa konteksto, ang anyo ay nagpapahayag ng magiging tungkulin o resulta: ang busog ay magsisilbing tanda.'
- source_word: לְאוֹת
  choice: tanda
  rationale: Ang אוֹת ay tanda o palatandaan. Ang “tanda” ay malinaw, maikli, at angkop sa konteksto ng tipan.
- source_word: בְּרִית
  choice: tipan
  rationale: Ang “tipan” ang kinikilalang natural at marangal na katumbas ng covenant sa biblikal na Tagalog. Bagaman walang pantukoy sa Hebreo, tiyak ito ayon sa naunang konteksto.
- source_word: בֵּינִי וּבֵין הָאָרֶץ
  choice: sa pagitan ko at ng lupa
  rationale: Maaaring mangahulugan ang אֶרֶץ na lupain o lupa/daigdig. Sa pandaigdig na saklaw ng salaysay tungkol sa baha, ang “lupa” ay natural at malawak ang saklaw nang hindi labis na nagpapaliwanag.
theological_decisions:
- issue: Ang tinutukoy ng קַשְׁתִּי sa konteksto ng tipan
  choice: Pinanatili sa pangunahing teksto ang literal na “busog,” na sa konteksto ay nauunawaang bahaghari.
  alternative: aking bahaghari
  rationale: Karaniwang salita para sa busog ang ginamit sa Hebreo, kaya pinananatili ang orihinal na larawang maaaring magpahiwatig ng sandata. Upang maging malinaw sa makabagong mambabasa, inilalahad sa talababa ang kontekstuwal na kahulugang “bahaghari” nang hindi pinapalitan ang larawan sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang literal na imahen ng “busog” at ginamit ang karaniwang biblikal na salitang “tipan.”
