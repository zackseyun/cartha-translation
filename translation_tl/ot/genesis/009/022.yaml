  yaml_path: translation/ot/genesis/009/022.yaml
  text: And Ham[a], the father of Canaan, saw his father's nakedness and told his two brothers outside.
translation:
  language: tl
  text: Nakita ni Ham, na ama ni Canaan, ang kahubaran ng kanyang ama[a] at ibinalita niya iyon sa dalawa niyang kapatid na nasa labas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang bahagi ng Lumang Tipan, maaaring gamitin bilang seksuwal na eupemismo ang pananalitang “kahubaran ng kanyang ama.” Dito, pinananatili ng salin ang literal na pananalita at iniiwang bukas ang usaping iyon sa pagpapakahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nakita
  rationale: Ang ראה sa sunod-sunod na pagsasalaysay ay tuwirang nangangahulugang “nakita”; hindi dinagdagan ng pahiwatig na matagal o mapagnasang tumingin.
- source_word: חָם
  choice: Ham
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa makabagong saling Tagalog.
- source_word: אֲבִי כְנַעַן
  choice: na ama ni Canaan
  rationale: Likas na appositional na parirala sa Tagalog na pinananatili ang tahasang pagkakakilanlan kay Ham bilang ama ni Canaan.
- source_word: עֶרְוַת אָבִיו
  choice: ang kahubaran ng kanyang ama
  rationale: Malapit ito sa literal na Hebreo at hindi nito ipinapasok sa teksto ang isang tiyak na seksuwal na gawa na hindi tahasang binanggit sa talata.
- source_word: וַיַּגֵּד
  choice: sinabi niya ito
  rationale: Ang Hiphil ng נגד ay karaniwang “magsabi” o “magbalita.” Idinagdag ang likas na panghalip na “ito” sa Tagalog upang maipahayag ang ipinahiwatig na nilalaman ng sinabi.
- source_word: לִשְׁנֵי אֶחָיו
  choice: sa dalawa niyang kapatid
  rationale: Pinananatili ang tahasang bilang na dalawa sa isang natural na ayos ng mga salita sa Tagalog.
- source_word: בַּחוּץ
  choice: sa labas
  rationale: Tuwirang katumbas ito ng lokasyong binanggit sa Hebreo at malamang na kaibahan sa kinaroroonan ni Noe sa loob.
theological_decisions:
- issue: Kahulugan ng “kahubaran ng kanyang ama” sa salaysay
  choice: Pinanatili ang literal na “kahubaran ng kanyang ama,” nang hindi tinutukoy ang anumang seksuwal na gawa bukod sa pagkakita kay Noe na hubad.
  alternative: Unawain ito bilang idyomang tumutukoy sa mas mabigat na seksuwal na paglabag, kabilang ang mungkahing kaugnay ito ng pakikipagtalik sa ina batay sa gamit ng katulad na pananalita sa mga utos sa Levitico.
  rationale: Bagaman maaaring magkaroon ng mas malawak na seksuwal na pahiwatig ang parirala sa ibang konteksto, “nakita” at pagkatapos ay “sinabi” ang tahasang isinasaad rito. Kaya pinananatili ng salin ang literal na pananalita at iniiwang bukas ang usaping interpretatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kahubaran” sa halip na mas kolokyal na “pagkahubad” upang mapanatili ang anyong pangngalan at ang posibleng interpretatibong lawak ng Hebreo. Inilagay ang talababa sa mismong pariralang tinatalakay nito.
