  yaml_path: translation/ot/genesis/009/021.yaml
  text: He drank some of the wine[a], became drunk[b], and uncovered himself inside his tent.
translation:
  language: tl
  text: Uminom siya ng alak[a], nalasing, at naghubad[b] sa loob ng kaniyang tolda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa alak.” Literal na “mula sa alak” ang Hebreo at malamang na nagpapahiwatig na uminom siya ng bahagi nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nakahubad” o “nalantad.” Maaaring stative ang pagkakasalin sa pandiwang Hebreo, ngunit ang reflexive na diwa, “naghubad,” ang higit na angkop sa anyo nito rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁתְּ
  choice: Uminom siya
  rationale: Ang Qal wayyiqtol ng שׁתה ay tuwirang nagsasaad ng kasunod na pangyayaring naganap; natural sa Tagalog ang pandiwa bago ang panghalip.
- source_word: מִן הַיַּיִן
  choice: ng kaunti sa alak
  rationale: 'Ang מִן kasama ng tiyak na pangngalan ay malamang na partitive: uminom siya ng isang bahagi ng alak. Nililinaw ito ng natural na pariralang Tagalog nang hindi ipinahihiwatig na kaunti lamang ang dami.'
- source_word: וַיִּשְׁכָּר
  choice: nalasing
  rationale: Ang Qal ng שׁכר ay nagpapahiwatig ng pagpasok sa kalagayan ng pagkalasing; maikli at likas sa modernong Tagalog ang “nalasing.”
- source_word: וַיִּתְגַּל
  choice: naghubad
  rationale: Ang Hitpael ng גלה ay maaaring unawaing reflexive rito, na si Noe ang naglantad ng sarili niyang katawan. Natural sa Tagalog ang “naghubad,” bagaman pinananatili sa talababa ang posibleng stative o passive na pagbasa.
- source_word: בְּתוֹךְ אָהֳלֹה
  choice: sa loob ng kaniyang tolda
  rationale: Malinaw at natural na inilalarawan nito ang lokasyong nasa interior ng tolda.
theological_decisions:
- issue: Moral o teolohikal na interpretasyon sa pagkalasing at pagkakalantad ni Noe
  choice: Ilarawan lamang ang kaniyang pag-inom, pagkalasing, at paghuhubad nang walang idinagdag na hatol o seksuwalisadong paliwanag.
  alternative: “nakahubad” o “nalantad ang katawan” sa loob ng kaniyang tolda
  rationale: Iniuulat ng Hebreo ang mga pangyayari ngunit hindi nagbibigay ng tahasang komentaryong moral sa talatang ito. Pinananatili rin ng salin ang puwang para sa kasunod na konteksto na magpaliwanag sa kabuluhan ng nakita ni Ham.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “kaniyang” para sa bahagyang pormal na biblikal na himig, at “tolda” bilang karaniwang salin ng אָהֶל. Ang mga talababa ay nagpapanatili sa tunay na leksikal na kalabuan.
