  yaml_path: translation/ot/genesis/009/020.yaml
  text: Noah[a], a man of the soil[b], began to plant a vineyard.
translation:
  language: tl
  text: Si Noe, isang taong nagsasaka ng lupa, ay nagsimulang magtanim ng ubasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Si Noe, isang taong nagsasaka ng lupa, ang unang nagtanim ng ubasan.” Pinaikli ang pagkakabuo sa Hebreo, at nauunawaan ng ilan ang “nagsimula” sa diwang “ang unang gumawa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: nagsimulang
  rationale: Sa Hiphil, ang pinakanatural na diwa rito ay “nagsimula.” Dahil pinaikli ang Hebreong pagkakabuo, iniugnay ito sa kasunod na pandiwang “magtanim.”
- source_word: נֹחַ
  choice: Noe
  rationale: Karaniwang anyo ng pangalang biblikal na Noah sa Tagalog.
- source_word: אִישׁ הָאֲדָמָה
  choice: isang taong nagbubungkal ng lupa
  rationale: Ipinahahayag ang agrikultural na diwa ng literal na “tao ng lupa” sa natural at malinaw na modernong Tagalog, nang hindi ito ginagawang tiyak na titulong wala sa Hebreo.
- source_word: וַיִּטַּע
  choice: magtanim
  rationale: Karaniwang salin ng נטע; ginawang pawatas dahil sa natural na Tagalog na konstruksiyong “nagsimulang magtanim.”
- source_word: כָּרֶם
  choice: ubasan
  rationale: Tumpak at natural na tawag sa lupang tinatamnan ng mga ubas.
theological_decisions:
- issue: Pag-unawa sa pinaikling pagkakasunod na וַיָּחֶל ... וַיִּטַּע
  choice: nagsimulang magtanim ng ubasan
  alternative: siya ang unang nagtanim ng ubasan; nagsimula siya at nagtanim ng ubasan
  rationale: Pinananatili nitong pangunahing kahulugan ng וַיָּחֶל na “nagsimula” at natural na inuugnay iyon sa kasunod na pandiwa. Ang “siya ang unang” ay maaaring pagpapakahulugan ngunit hindi tahasang sinasabi ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “taong nagbubungkal ng lupa” sa halip na ang napakaliteral ngunit alanganing “tao ng lupa.”
