lexical_decisions:
- source_word: וְהָיָה
  choice: Kapag
  rationale: Ipinakikilala ng konstruksyon ang isang pangyayari sa hinaharap na nagsisilbing kalagayang panahunan; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “Kapag.”
- source_word: בְּעַנְנִי עָנָן
  choice: naglagay ako ng mga ulap
  rationale: Ang anyong pandiwa mula sa ענן ay nangangahulugang balutin o lagyan ng ulap. Ang “naglagay ako ng mga ulap” ay malinaw at natural, at pinananatili ang Diyos bilang gumagawa ng kilos.
- source_word: עַל הָאָרֶץ
  choice: sa ibabaw ng lupa
  rationale: Ipinahahayag nito ang lokasyong nasa itaas o nakalukob sa lupa; ang “lupa” ay angkop sa malawak na saklaw ng tipan pagkatapos ng baha.
- source_word: וְנִרְאֲתָה
  choice: makikita
  rationale: Pinananatili ng “makikita” ang diwang pasibo ng Niphal ng ראה at natural ang tunog nito sa modernong Tagalog.
- source_word: הַקֶּשֶׁת
  choice: ang pana
  rationale: Ang קשת ay karaniwang salita para sa panang pandigma, ngunit dito ay tumutukoy sa bahaghari bilang tanda ng tipan. Pinananatili ng “pana” ang tahasang talinghaga ng Hebreo.
- source_word: בֶּעָנָן
  choice: sa ulap
  rationale: Tuwirang sinasalamin ng isahan na “ulap” ang anyong Hebreo at naiiba sa kolektibong “mga ulap” sa unang sugnay.
theological_decisions:
- issue: Pagpapakahulugan sa קשת bilang tanda ng tipan kay Noe
  choice: ang pana
  alternative: ang bahaghari
  rationale: Ginagamit ng Hebreo ang karaniwang salita para sa “pana.” Pinananatili ito sa pangunahing teksto upang hindi mawala ang tunay na leksikal na larawan, habang nililinaw sa talababa na bahaghari ang tinutukoy sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang ayos na pandiwa sa unang sugnay at ang natural na pasibong “makikita” sa ikalawa. Inilagay ang pananda ng talababa kaagad pagkatapos ng salitang “pana,” na siyang ipinaliliwanag nito.
