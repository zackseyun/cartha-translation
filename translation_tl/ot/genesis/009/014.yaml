  text: Kapag nagdala ako ng mga ulap sa ibabaw ng lupa, makikita ang pana[a] sa ulap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bahaghari.” Ang salitang Hebreo ay ang karaniwang salita para sa “pana”; dito, tumutukoy ito sa bahaghari bilang tanda ng tipan.
