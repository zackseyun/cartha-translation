  yaml_path: translation/ot/genesis/009/006.yaml
  text: Whoever sheds the blood of man[a], by man shall his blood be shed[b], for God made man in his image.
translation:
  language: tl
  text: 'Ang sinumang magpadanak ng dugo ng tao,

    sa pamamagitan ng tao ay padadanakin ang kanyang dugo;

    sapagkat ginawa ng Diyos ang tao ayon sa larawan ng Diyos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sapagkat sa larawan ng Diyos ay ginawa niya ang tao.”'
    reason: literal_rendering
lexical_decisions:
- source_word: שֹׁפֵךְ דַּם
  choice: magpadanak ng dugo
  rationale: Ang Qal participle ay isang pangkalahatan at kasabihang pahayag. Ang “magpadanak ng dugo” ang likas na idyomang Filipino para sa marahas na pagkitil ng buhay, sa halip na ang literal ngunit di-likas na “magbuhos ng dugo.”
- source_word: הָאָדָם
  choice: tao
  rationale: Ang אָדָם ay ginagamit dito sa pangkalahatang diwa—isang taong nilalang, hindi lalaki lamang. Pinananatili ng “tao” ang pag-uugnay ng tatlong paglitaw ng salitang-ugat sa talata.
- source_word: בָּאָדָם
  choice: sa kamay ng tao
  rationale: 'Ipinahahayag nito ang malamang na instrumental o agentibong gamit ng בְּ: tao ang ahenteng magpapatupad ng hatol. Mas natural at marangal ito sa Filipino kaysa “sa pamamagitan ng tao,” habang ang posibleng alternatibong pagbasa ay itinatala sa talababa.'
- source_word: דָּמוֹ יִשָּׁפֵךְ
  choice: padadanakin ang kanyang dugo
  rationale: Pinananatili ang pasibong diwa at ang magkatugmang larawan ng pagdanak ng dugo. Hindi ginawang “dapat padanakin” upang hindi labis na tukuyin kung utos o tiyak na kaparusahan ang imperfect.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan ng naunang pahayag at angkop sa marangal na rehistro.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: ayon sa kanyang larawan
  rationale: Likas itong paraan sa Filipino upang ipahayag na ang tao ay ginawang kawangis ng Diyos; malinaw na ang panghalip ay tumutukoy sa Diyos. Isinama sa talababa ang mas pormal na ayos ng Hebreo.
- source_word: עָשָׂה
  choice: ginawa
  rationale: Tuwirang katumbas ito ng עשה. Hindi ginamit ang “nilalang,” na maaaring magpasok ng tiyak na bokabularyo ng ברא na wala sa sugnay.
theological_decisions:
- issue: Pangkalahatang kahulugan ng אָדָם
  choice: tao
  alternative: sangkatauhan; isang taong nilalang
  rationale: Tumutukoy ang salita sa tao bilang kinatawan ng sangkatauhan at hindi sa mga lalaki lamang. Ang “tao” ay natural sa modernong Filipino at napapanatili ang pag-uulit sa Hebreo.
- issue: Kung ang בָּאָדָם ay tumutukoy sa taong ahente ng paghatol o sa ibang ugnayan
  choice: sa kamay ng tao
  alternative: sa gitna ng sangkatauhan; sa pamamagitan ng tao
  rationale: Pinakamalamang sa balarila at paralelismo ang instrumental o agentibong pagbasa. Hindi pinalalawak ng salin ang talata tungo sa isang ganap na doktrina tungkol sa parusang kamatayan.
- issue: Anyo ng sugnay tungkol sa larawan ng Diyos
  choice: ginawa ng Diyos ang tao ayon sa kanyang larawan
  alternative: ayon sa larawan ng Diyos ay ginawa niya ang tao
  rationale: Pinananatili ang teolohikal na pahayag na may natatanging dangal ang tao bilang larawan ng Diyos, habang natural ang ayos sa Filipino. Nasa talababa ang mas malapit na ayos sa Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang idyomang “magpadanak ng dugo” at ang maindayog na paralelismo upang mapanatili ang maigsi at solemneng anyo ng batas o kasabihan sa Hebreo. Ang “tao” ay pangkalahatan at hindi limitado sa kasariang lalaki.
