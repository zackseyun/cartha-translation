base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/016.yaml
  text: The bow will be in the cloud[b][a], and I will see it and remember the everlasting covenant between God and every living creature among all flesh that is on the earth.
translation:
  language: tl
  text: Ang bahaghari[a] ay mapapasa ulap, at makikita ko iyon upang alalahanin ang walang-hanggang tipan sa pagitan ng Diyos at ng bawat buháy na nilalang—lahat ng may laman na nasa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “busog.” Ang salitang Hebreo ay tumutukoy rito sa bahaghari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Mananatili
  rationale: Ang anyong pandiwa sa nagpapatuloy na pahayag ng Diyos ay may hinaharap na diwa. Ang “mananatili” ay natural sa Filipino at hindi nagdaragdag ng ideya ng biglang paglitaw.
- source_word: הַקֶּשֶׁת
  choice: ang bahaghari[a]
  rationale: Literal na “busog” ang salitang Hebreo, ngunit sa konteksto ay tumutukoy ito sa bahaghari. Ginamit ang karaniwang salitang Filipino sa teksto, habang pinanatili sa talababa ang literal na larawan.
- source_word: בֶּעָנָן
  choice: sa ulap
  rationale: Pinananatili ang isahang anyo at ang tiyak na pagtukoy ng Hebreo.
- source_word: וּרְאִיתִיהָ
  choice: at makikita ko iyon
  rationale: Tuwirang inililipat ang unang panauhang pandiwa at ang panghalip na tumutukoy sa bahaghari, nang hindi ginagawang tahasang sugnay na pamanahon.
- source_word: לִזְכֹּר
  choice: upang alalahanin
  rationale: Ipinahahayag ng infinitibong may ל ang layunin o bunga. Malinaw na naipapakita ng “upang” ang ugnayang ito sa natural na Filipino.
- source_word: בְּרִית עוֹלָם
  choice: ang walang-hanggang tipan
  rationale: Ipinahahayag nito ang tipang nagpapatuloy sa mga panahon. Ang “walang-hanggang tipan” ay malinaw at marangal na Filipino.
- source_word: בֵּין אֱלֹהִים וּבֵין
  choice: sa pagitan ng Diyos at ng
  rationale: Natural na pinaiikli sa Filipino ang inuulit na Hebreong pormulang “sa pagitan ... at sa pagitan ...” nang hindi binabago ang ugnayan.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: bawat buháy na nilalang
  rationale: Tumutukoy ito sa lahat ng nilalang na may buhay, hindi sa “kaluluwa” bilang hiwalay na teolohikal na konsepto.
- source_word: בְּכָל בָּשָׂר
  choice: sa lahat ng may laman
  rationale: Pinananatili ang kongkretong idyomang Hebreo at ang appositional na paglilinaw sa mga buháy na nilalang, bagaman bahagyang banyaga ang tunog nito sa Filipino.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: na nasa lupa
  rationale: Tuwirang isinasalin ang pang-ugnay na sugnay; ang “lupa” rito ay tumutukoy sa daigdig sa pangkalahatang konteksto ng tipan.
theological_decisions:
- issue: Antropomorpikong pag-alaala ng Diyos
  choice: “makikita ko iyon upang alalahanin”
  alternative: “makikita ko iyon at kikilos ako ayon sa aking tipan”
  rationale: Pinananatili ang mismong pananalita ng teksto tungkol sa pagtingin at pag-alaala ng Diyos, sa halip na ipaliwanag o lutasin ang teolohikal na tensiyon sa pamamagitan ng paraphrase.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahaghari” sa pangunahing teksto para sa agarang pagkaunawa, ngunit pinanatili sa talababa ang literal na larawang “busog.” Ang “buháy” ay nilagyan ng tuldik upang maiwasang mabasa bilang “búhay.”
