revisions:
- from: At aalalahanin ko ang aking tipan na nasa pagitan ko at ninyo at ng bawat buhay na nilalang sa lahat ng may laman[a]. Hindi na muling magiging baha ang tubig upang lipulin ang lahat ng may laman.
  to: At aalalahanin ko ang aking tipan na nasa pagitan ko at ninyo at ng bawat buhay na nilalang na kabilang sa lahat ng may laman[a], at hindi na muling magiging baha ang tubig upang wasakin ang lahat ng may laman.
  rationale: Nilinaw ang ugnayan ng “bawat buhay na nilalang” at “lahat ng may laman” nang hindi isinasalin ang huling parirala bilang mga tao lamang o inaalis ang inuulit na imaheng “laman.” Pinalitan din ang “lipulin” ng mas tuwirang “wasakin” para sa לְשַׁחֵת. Pinanatili ang tahasang antropomorpikong “aalalahanin ko,” ang “tipan,” at ang ganap na pangakong “hindi na muling.”
