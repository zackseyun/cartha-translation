  text: and I will remember my covenant that is between me and you and every living creature among all flesh[b][a], and the waters will never again become a flood to destroy all flesh.
translation:
  language: tl
  text: At aalalahanin ko ang aking tipan na nasa pagitan ko at ninyo at ng bawat buhay na nilalang na kabilang sa lahat ng may laman[a], at hindi na muling magiging baha ang tubig upang wasakin ang lahat ng may laman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bawat buhay na nilalang sa gitna ng lahat ng may laman.”
    reason: Pinananatili ang alternatibong paraan ng pag-unawa sa ugnayan ng נֶפֶשׁ חַיָּה at בְּכָל בָּשָׂר.
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: At aalalahanin ko
  rationale: Pinananatili ang tahasang wika ng pag-alaala at ang panghinaharap na diwa nito sa pahayag ng Diyos, sa halip na ipaliwanag ito bilang pagkilos o simpleng pagtatago sa isip.
- source_word: בְּרִיתִי
  choice: aking tipan
  rationale: Ang “tipan” ang likas at kinikilalang salin sa Filipino para sa pormal at mapangakong ugnayang tinutukoy ng בְּרִית.
- source_word: כָּל נֶפֶשׁ חַיָּה בְּכָל בָּשָׂר
  choice: bawat buhay na nilalang sa lahat ng may laman
  rationale: Ipinahahayag ng “buhay na nilalang” ang animate life, samantalang pinananatili ng “lahat ng may laman” ang malawak na saklaw na kinabibilangan ng tao at mga hayop. Ang “sa” ay nagpapanatili sa ugnayang may posibleng diwang pang-uri, pangkat, o saklaw.
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: Hindi na muling magiging
  rationale: Likas na ipinahahayag sa Filipino ang ganap na hindi na pag-uulit.
- source_word: הַמַּיִם לְמַבּוּל
  choice: magiging baha ang tubig
  rationale: Natural na inilalarawan ang tubig na nagiging baha, habang pinananatili ang resulta o tungkuling ipinahihiwatig ng לְ.
- source_word: לְשַׁחֵת
  choice: upang lipulin
  rationale: Ang “lipulin” ay mabigat ngunit natural na pandiwa para sa ganap na kapahamakang dulot ng baha, at malinaw na ipinahahayag ng “upang” ang layunin o resulta.
- source_word: כָּל בָּשָׂר
  choice: lahat ng may laman
  rationale: Pinananatili ang Hebreong larawang “all flesh” at ang saklaw nitong hindi lamang mga tao kundi lahat ng may katawang buhay.
theological_decisions:
- issue: Antropomorpikong wika tungkol sa pag-alaala ng Diyos
  choice: Panatilihin ang “aalalahanin ko”
  alternative: “tutuparin ko” o “kikilos ako ayon sa aking tipan”
  rationale: Tahasang gumagamit ang Hebreo ng wika ng pag-alaala. Hindi ito pinalitan ng paliwanag upang mapanatili ang teolohikal na bigat at tensiyon ng pananalita.
- issue: Saklaw ng “lahat ng may laman”
  choice: Isama kapuwa ang mga tao at mga hayop
  alternative: “lahat ng tao”
  rationale: Ipinakikita ng konteksto at ng “bawat buhay na nilalang” na hindi limitado sa sangkatauhan ang tipan at ang pangakong hindi na muling paglipol.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tipan,” “aalalahanin,” at “lipulin” bilang pamilyar ngunit may bigat na mga salitang angkop sa tekstong biblikal. Ang “lahat ng may laman” ay bahagyang pormal ngunit nagpapanatili sa mahalagang Hebreong larawan at malawak na saklaw.
