lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay
  rationale: Sa pormulang nagbubuod ng haba ng buhay, ang pandiwa ay gumaganap bilang kopula; natural itong ipahayag sa Tagalog sa pamamagitan ng “ay.”
- source_word: כָּל יְמֵי נֹחַ
  choice: ang lahat ng araw ni Noe
  rationale: Pinananatili nito ang Hebreong idyoma at ang paulit-ulit na pormula sa Genesis, habang malinaw pa ring tumutukoy sa buong haba ng buhay ni Noe.
- source_word: תְּשַׁע מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: siyam na raan at limampung taon
  rationale: Likas na paraan ito sa modernong Tagalog upang pagsamahin ang dalawang bahaging bilang ng Hebreo.
- source_word: וַיָּמֹת
  choice: pagkatapos ay namatay siya
  rationale: Ipinahahayag ng “pagkatapos” ang kasunod na pangyayaring dala ng wayyiqtol, at nililinaw ng “siya” na si Noe ang tinutukoy.
