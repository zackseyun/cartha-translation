  yaml_path: translation/ot/genesis/009/003.yaml
  text: Every moving thing that is alive shall be food for you. As I gave you the green plants[a], I have given you everything.
translation:
  language: tl
  text: Ang bawat gumagalaw na nilalang na buhay ay magiging pagkain ninyo. Kung paanong ibinigay ko sa inyo ang mga luntiang halaman, ibinigay ko na rin sa inyo ang lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Bawat gumagapang na nilalang na buhay ay magiging pagkain ninyo.” Ang salitang Hebreo na רֶמֶשׂ ay madalas tumukoy sa mga nilalang na gumagapang o nagsisiksikan, ngunit malamang na mas malawak ang gamit nito sa kontekstong ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רֶמֶשׂ
  choice: Bawat nilalang na gumagalaw
  rationale: Ang כָּל ay distributibo sa pangngalang isahan, at ang רֶמֶשׂ ay maaaring tumukoy sa gumagapang o nagkukumpon na mga nilalang. Sa kontekstong ito, ang mas malawak na “nilalang na gumagalaw” ay natural sa Filipino at hindi nagpapakitid sa saklaw ng pahintulot.
- source_word: אֲשֶׁר הוּא חַי
  choice: at nabubuhay
  rationale: Pinananatili nito ang tahasang katangiang buhay ang tinutukoy na nilalang at maayos na ikinakabit sa naunang parirala.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: ay magiging pagkain ninyo
  rationale: Natural na Filipino ito para sa predikatibong konstruksyon at ipinahahayag ang ipinagkaloob na pahintulot o paglalaan.
- source_word: כְּיֶרֶק עֵשֶׂב
  choice: Kung paanong ... ang mga luntiang halaman
  rationale: Ang כְּ ay nagpapahayag ng paghahambing, samantalang ang יֶרֶק עֵשֶׂב ay kolektibong tumutukoy sa luntiang pananim o halaman.
- source_word: נָתַתִּי
  choice: ibinigay ko ... ibinibigay ko rin
  rationale: Iisa lamang ang pandiwang Hebreo, ngunit saklaw nito ang paghahambing sa naunang pagkakaloob ng mga halaman at ang kasalukuyang ipinahahayag na pagkakaloob ng lahat. Ginagawang malinaw at natural ng Filipino ang ipinahihiwatig na dalawang bahagi nang hindi binabago ang ugnayan.
- source_word: אֶת כֹּל
  choice: ang lahat
  rationale: Pinananatili ang komprehensibo at kolektibong diin ng כֹּל nang hindi dinaragdagan ang tinutukoy nito.
theological_decisions:
- issue: Saklaw ng pahintulot na gawing pagkain ang mga hayop pagkatapos ng baha
  choice: 'Malawak ang pahayag: bawat buhay na nilalang na gumagalaw ay ipinagkakaloob bilang pagkain.'
  alternative: Limitahan ang tinutukoy sa maliliit, gumagapang, o nagkukumpon na mga nilalang dahil sa רֶמֶשׂ.
  rationale: Bagaman maaaring magkaroon ng mas makitid na kahulugan ang רֶמֶשׂ sa ibang konteksto, ang כָּל at ang pangwakas na אֶת כֹּל ay nagbibigay rito ng komprehensibong saklaw. Hindi rin nilulutas ng talata mismo ang mga susunod na pagtatakdang kaugnay ng pagkain.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” para sa maramihang kausap at ang “luntiang halaman” bilang natural na kolektibong tawag sa berdeng pananim.
