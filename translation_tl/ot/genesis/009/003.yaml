revisions:
- from: Bawat nilalang na gumagalaw at nabubuhay ay magiging pagkain ninyo. Kung paanong ibinigay ko sa inyo ang mga luntiang halaman, ibinibigay ko rin sa inyo ang lahat.[a]
  to: Ang bawat gumagalaw na nilalang na buhay ay magiging pagkain ninyo. Kung paanong ibinigay ko sa inyo ang mga luntiang halaman, ibinigay ko na rin sa inyo ang lahat.[a]
  rationale: Inayos ang aspekto ng pangunahing pandiwang Hebreo sa “ibinigay ko na rin,” habang pinanatili ang paghahambing sa naunang pagkakaloob ng mga halaman at ang komprehensibong “ang lahat.” Pinakinis din ang paglalarawan sa mga buhay na nilalang at ang naturalness ng talababa, nang hindi pinapakitid ang saklaw ng רֶמֶשׂ.
