  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מוֹרַאֲ/כֶ֤ם וְ/חִתְּ/כֶם֙ יִֽהְיֶ֔ה עַ֚ל כָּל חַיַּ֣ת הָ/אָ֔רֶץ וְ/עַ֖ל כָּל ע֣וֹף הַ/שָּׁמָ֑יִם בְּ/כֹל֩ אֲשֶׁ֨ר תִּרְמֹ֧שׂ הָֽ/אֲדָמָ֛ה וּֽ/בְ/כָל דְּגֵ֥י הַ/יָּ֖ם בְּ/יֶדְ/כֶ֥ם נִתָּֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/002.yaml
  text: And the fear of you and the dread of you shall be upon every beast of the earth and upon every bird of the heavens[a], on everything that creeps on the ground, and on all the fish of the sea[c][b]; into your hand they are given.
translation:
  language: tl
  text: Matatakot at masisindak sa inyo[a] ang bawat hayop sa lupa, ang bawat ibon sa himpapawid[b], ang lahat ng gumagapang sa ibabaw ng lupa, at ang lahat ng isda sa dagat. Ibinigay sila sa inyong kamay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang takot sa inyo at ang sindak sa inyo”; maaari ring unawain sa anyong “ang inyong takot at sindak.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga langit”; sa kontekstong ito, ang tinutukoy ay ang himpapawid o kalangitan.
    reason: lexical_alternative
  - marker: c
    text: Ang “ibinigay sa inyong kamay” ay idyomang Hebreo na nangangahulugang inilagay sa ilalim ng inyong kapangyarihan o pamamahala.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹרַאֲכֶם וְחִתְּכֶם
  choice: Matatakot at masisindak sa inyo
  rationale: Ginawang likas na pandiwang Filipino ang magkatambal na mga pangngalang Hebreo. Pinananatili ng “matatakot” at “masisindak” ang dalawang antas ng matinding pangamba nang hindi pinagsasama ang mga ito sa iisang salita.
- source_word: יִהְיֶה עַל
  choice: matatakot at masisindak ... ang
  rationale: Ang literal na hulma na “ang takot ... ay mapapasa” ay hindi likas sa modernong Filipino. Ang ayos na pandiwa ang malinaw na naghahayag ng kalagayang idinudulot ng pahayag ng Diyos.
- source_word: כָּל חַיַּת הָאָרֶץ
  choice: ang bawat hayop sa lupa
  rationale: Ang חַיָּה rito ay tumutukoy sa mga hayop sa kalupaan. Hindi ito nilimitahan sa “mababangis na hayop,” na maaaring maging mas makitid kaysa sa saklaw ng teksto.
- source_word: כָּל עוֹף הַשָּׁמָיִם
  choice: ang bawat ibon sa himpapawid
  rationale: Ang עוֹף ay angkop na isinaling “ibon” sa kontekstong ito, at ang “himpapawid” ay likas na Filipino para sa kalangitang nililiparan ng mga ibon.
- source_word: בְּכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: ang lahat ng gumagapang sa ibabaw ng lupa
  rationale: Pinananatili ng “gumagapang” ang kongkretong larawan ng רמשׂ, habang ang “lupa” ay ang karaniwang modernong katumbas ng אֲדָמָה sa pariralang ito.
- source_word: וּבְכָל דְּגֵי הַיָּם
  choice: at ang lahat ng isda sa dagat
  rationale: Tuwirang ipinapahayag nito ang pangkalahatang saklaw ng pariralang Hebreo.
- source_word: בְּיֶדְכֶם נִתָּנוּ
  choice: Ibinigay sila sa inyong kamay
  rationale: Pinananatili ang metapora at balintiyak na tinig ng Hebreo. Ang idyoma ay nagpapahiwatig na inilagay ang mga nilalang sa kapangyarihan o pamamahala ng mga tao.
theological_decisions:
- issue: Pamamahala ng tao sa mga hayop pagkatapos ng baha
  choice: Pinanatili ang larawang “ibinigay ... sa inyong kamay,” na nagpapahiwatig ng tunay na kapangyarihan o pamamahala ng tao.
  alternative: Tahasang gawing “ipinasailalim sila sa inyong kapangyarihan” o pahinain ang diwa ng pamamahala.
  rationale: Ipinahahayag ng idyomang Hebreo ang pagkakalagay ng mga hayop sa kapangyarihan ng tao, ngunit hindi na pinalawak ang pahayag tungo sa isang sistemang teolohikal o etikal na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinili ang natural na pandiwang “matatakot at masisindak” sa halip na ang hindi likas na literal na konstruksyon ng mga pangngalan, habang pinanatili sa talababa ang anyo at posibleng kalabuan ng Hebreo. Ang “himpapawid” at “ibinigay sa inyong kamay” ay nagpapanatili ng dignidad at kongkretong larawan ng talata.
