  source_fidelity: Tumpak na naihahatid ng salin ang pahayag na sinabi ito ng Diyos kay Noe, ang pagkakakilanlan sa tanda ng tipan, ang pagkakatatag ng Diyos rito, at ang lawak na “sa pagitan ko at ng lahat ng laman.” Ang “lahat ng laman” ay maingat na pinananatili ang malawak at tradisyonal na pananalita ng כָּל־בָּשָׂר, nang hindi ito nililimitahan sa sangkatauhan.
