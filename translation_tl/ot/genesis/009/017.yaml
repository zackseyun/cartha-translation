  terminology: Ang “Diyos,” “Noe,” “tanda,” at “tipan” ay pare-pareho, malinaw, at angkop sa modernong Filipino Tagalog na may marangal na biblikal na rehistro. Wasto ang talababa at ang angkla nito sa “lahat ng laman.”
