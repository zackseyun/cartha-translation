  text: וַ/יֹּ֥אמֶר אֱלֹהִ֖ים אֶל נֹ֑חַ זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁ֣ר הֲקִמֹ֔תִי בֵּינִ֕/י וּ/בֵ֥ין כָּל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/017.yaml
  text: And God said to Noah[a], “This is the sign of the covenant that I have established between me and all flesh that is on the earth.”
translation:
  language: tl
  text: At sinabi ng Diyos kay Noe, “Ito ang tanda ng tipang itinatag ko sa pagitan ko at ng lahat ng laman[a] na nasa ibabaw ng lupa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng nilalang na may buhay.” Sa Hebreo, “lahat ng laman,” isang malawak na katawagan sa kontekstong ito para sa mga nilalang na may buhay sa lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili ng “At” ang pagsulong ng salaysay na ipinahihiwatig ng waw-consecutive, habang natural pa rin sa marangal na salaysay sa Filipino.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ito ang karaniwan at malinaw na katawagan sa nag-iisang Diyos na nakikipag-usap kay Noe sa kontekstong ito.
- source_word: אֶל נֹחַ
  choice: kay Noe
  rationale: Tinutukoy ng pariralang Hebreo ang kinakausap; “Noe” ang nakagawiang anyo ng pangalan sa Filipino.
- source_word: זֹאת אוֹת הַבְּרִית
  choice: Ito ang tanda ng tipan
  rationale: Ang אוֹת ay isang nakikitang tanda o palatandaan, at ang בְּרִית ay wastong isinasaling “tipan” upang mapanatili ang mahalagang terminong biblikal.
- source_word: הֲקִמֹתִי
  choice: itinatag ko
  rationale: Ang Hiphil ng קום kasama ng בְּרִית ay tumutukoy sa pagtatatag o pagpapatibay ng tipan. Ang “itinatag ko” ay malinaw at hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: בֵּינִי וּבֵין
  choice: sa pagitan ko at ng
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapakilala sa magkabilang panig ng tipan.
- source_word: כָּל בָּשָׂר
  choice: lahat ng laman
  rationale: Literal itong “lahat ng laman” at sa Genesis 9 ay malawak na tumutukoy sa mga nilalang na may buhay, hindi lamang sa sangkatauhan. Pinananatili ng salin ang lawak at sagimsim ng orihinal.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: na nasa ibabaw ng lupa
  rationale: Ang sugnay ay tumutukoy sa “lahat ng laman.” Ang “lupa” rito ay ang daigdig na tinitirhan ng mga nilalang, hindi lamang isang takdang lupain.
theological_decisions:
- issue: Saklaw ng כָּל בָּשָׂר sa tipan kay Noe
  choice: lahat ng laman
  alternative: lahat ng nilalang na may buhay; buong sangkatauhan
  rationale: Sadyang malawak ang parirala sa konteksto at sumasaklaw nang higit sa mga tao. Pinananatili ng “lahat ng laman” ang tunay na lawak at biblikal na pahayag, samantalang nililinaw sa talababa ang kahulugan nito sa konteksto.
translation_notes:
  register: Gumagamit ang salin ng moderno ngunit marangal na Filipino. Pinanatili ang “tipan,” “tanda,” at “lahat ng laman” bilang mahahalagang katawagang biblikal; inilagay ang pananda ng talababa kaagad pagkatapos ng pariralang tinutukoy nito.
