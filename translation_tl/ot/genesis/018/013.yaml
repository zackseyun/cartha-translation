  yaml_path: translation/ot/genesis/018/013.yaml
  text: And the LORD said to Abraham, “Why did Sarah laugh, saying, ‘Will I really bear a child, now that I am old?’”
translation:
  language: tl
  text: At sinabi ng PANGINOON kay Abraham, “Bakit tumawa si Sara at sinabing, ‘Talaga bang manganganak ako, gayong matanda na ako?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang salin sa Tagalog para sa banal na pangalang YHWH, na nakasulat sa malalaking titik upang maipakitang pangalan ito at hindi lamang karaniwang titulong ‘Panginoon.’
- source_word: הַאַף אֻמְנָם
  choice: Talaga bang
  rationale: Ang kombinasyong ito ay nagpapahayag ng nag-aalinlangan o nagugulat na tanong; natural at tumpak itong naihahatid ng ‘Talaga bang’ sa modernong Tagalog.
- source_word: אֵלֵד
  choice: manganganak pa ako
  rationale: Ang pandiwa ay nasa unang panauhan at nangangahulugang ‘manganak.’ Idinagdag ang ‘pa’ upang likas na maipahayag sa Tagalog ang di-inaasahang panganganak sa katandaan, na malinaw sa konteksto.
- source_word: וַאֲנִי זָקַנְתִּי
  choice: ngayong matanda na ako
  rationale: 'Natural na Tagalog para sa kalagayang binibigyang-diin ng nagsasalita: siya ay matanda na ngayon.'
theological_decisions:
- issue: Paglalarawan sa nagsasalita bilang YHWH
  choice: PANGINOON
  alternative: Yahweh
  rationale: Pinananatili ang malinaw na pagkakakilanlan sa banal na pangalan sa pamamagitan ng tipograpikong anyong PANGINOON, habang gumagamit ng pamilyar at marangal na anyo para sa karaniwang mambabasang Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang tuwirang tanong at ang bahagyang pag-aalinlangan/pagtataka sa sinabi ni Sara nang hindi dinaragdagan ang teolohikal na kahulugan.
