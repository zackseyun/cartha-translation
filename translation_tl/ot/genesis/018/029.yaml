  text: He spoke to him again and said[a], “Perhaps forty will be found there.” And he said[b], “I will not do it for the sake of the forty.”
translation:
  language: tl
  text: Nagsalita pa siyang muli sa kanya at sinabi, “Marahil ay may matagpuang apatnapu roon.” At sinabi niya, “Hindi ko iyon gagawin[a] alang-alang sa apatnapu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi ko iyon lilipulin.” Sa Hebreo, literal na “Hindi ko gagawin”; ipinauunawa mula sa konteksto ang kilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר
  choice: Muli pa siyang nagsalita
  rationale: Ipinahahayag ng pariralang Hebreo ang pagpapatuloy o pag-uulit ng pagsasalita. Ang “muli pa” ay natural sa makabagong Tagalog at pinananatili ang diwang paulit-ulit.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Tuwirang ipinahahayag nito ang taong kinausap, alinsunod sa karaniwang gamit ng אֶל.
- source_word: אוּלַי
  choice: Marahil
  rationale: Ipinakikilala nito ang isang maingat at di-tiyak na posibilidad sa pakikipamagitan ni Abraham.
- source_word: יִמָּצְאוּן שָׁם אַרְבָּעִים
  choice: may matagpuang apatnapu roon
  rationale: Pinananatili ng “matagpuan” ang diwang pasibo ng Niphal, habang likas sa Tagalog ang konstruksiyong “may matagpuang” para sa isang ipinapalagay na bilang.
- source_word: לֹא אֶעֱשֶׂה
  choice: Hindi ko iyon gagawin
  rationale: Elliptical ang pandiwang Hebreo at hindi tahasang pinapangalanan ang gagawing kilos. Ang “iyon” ay ginagawang malinaw ang pangungusap sa Tagalog nang hindi tinutukoy nang higit sa sinabi ng teksto.
- source_word: בַּעֲבוּר הָאַרְבָּעִים
  choice: alang-alang sa apatnapu
  rationale: Ang “alang-alang sa” ay likas at marangal na katumbas na nagpapahayag ng pagkilos para sa kapakanan o dahil sa apatnapu.
theological_decisions:
- issue: Hindi tahasang tinukoy na layon ng kilos sa לֹא אֶעֱשֶׂה
  choice: Panatilihing di-tiyak ang kilos sa “Hindi ko iyon gagawin.”
  alternative: “Hindi ko ito lilipulin” o “Hindi ko wawasakin ang lungsod.”
  rationale: Hindi pinapangalanan ng Hebreo ang kilos kundi ipinauunawa ito mula sa naunang usapan. Pinananatili ng salin ang sinadyang ellipsis at iniiwasang magdagdag ng mas tiyak na bagay kaysa sa nasa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang mga panghalip at ang di-tahasang kilos ng Hebreo sa halip na idagdag sa pangunahing teksto ang pangalan ni Abraham o tahasang sabihing lilipulin ang lungsod.
