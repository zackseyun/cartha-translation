base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/031.yaml
  text: Then he said[a], “See now, I have undertaken to speak to my Lord. Perhaps twenty will be found there.” And he said[b], “I will not destroy it for the sake of the twenty.”
translation:
  language: tl
  text: At sinabi niya, “Ngayon, naglakas-loob akong magsalita sa aking Panginoon. Baka may dalawampu roong matagpuan.” At sinabi niya, “Hindi ko iyon lilipulin alang-alang sa dalawampu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Nakikiusap ako
  rationale: Ang dalawang kataga ay magalang na panawag-pansin. Sa makabagong Tagalog, likas na naipahahayag ng “Nakikiusap ako” ang mapagpakumbabang tono nang hindi gumagamit ng lipas o artipisyal na pananalita.
- source_word: הוֹאַלְתִּי
  choice: naglakas-loob ako
  rationale: Ipinahihiwatig ng pandiwa ang pangangahas o pagkuha ng kalayaang magsalita. Ang “naglakas-loob” ay natural sa Tagalog at pinananatili ang paggalang at pag-aatubili ni Abraham.
- source_word: לְדַבֵּר אֶל אֲדֹנָי
  choice: magsalita sa aking Panginoon
  rationale: Tuwirang salin ito ng parirala. Ginamit ang malaking titik sa “Panginoon” sapagkat ang kausap ay ang Diyos, ngunit hindi ito isinalin bilang pangalang YHWH na wala sa talata.
- source_word: אוּלַי
  choice: Baka
  rationale: Ang “baka” ang pinakanatural na makabagong Tagalog para sa tentatibong posibilidad at angkop sa maingat na pakiusap ni Abraham.
- source_word: יִמָּצְאוּן שָׁם עֶשְׂרִים
  choice: may matagpuang dalawampu roon
  rationale: Pinananatili ng “matagpuan” ang diwang pasibo ng Niphal, habang ang ayos na ito ay natural sa Tagalog.
- source_word: לֹא אַשְׁחִית
  choice: Hindi ko iyon lilipulin
  rationale: Ang Hiphil ng שׁחת ay tumutukoy sa ganap na pagwasak. Ang “iyon” ay likas na tumutukoy sa lugar o lunsod na pinag-uusapan, bagaman hindi tahasang nakasaad ang layon sa Hebreo.
- source_word: בַּעֲבוּר
  choice: alang-alang sa
  rationale: Malinaw nitong ipinahahayag na ang dalawampu ang batayan ng hindi paglipol sa lugar, at angkop ito sa konteksto ng pamamagitan.
- source_word: הָעֶשְׂרִים
  choice: sa dalawampu
  rationale: Sa Tagalog, hindi kailangang tumbasan nang hiwalay ang tiyak na pantukoy; ang naunang pagbanggit sa bilang ay sapat upang tukuyin ang partikular na dalawampung pinag-uusapan.
theological_decisions:
- issue: Pag-render sa אֲדֹנָי sa pakikipag-usap ni Abraham
  choice: aking Panginoon
  alternative: aking panginoon
  rationale: Sa mas malawak na konteksto ng Genesis 18, ang kausap ay ang banal na panauhing kinikilalang ang PANGINOON. Ang malaking titik ay nagpapakitang titulo ito para sa Diyos, nang hindi ipinapalit ang pangalang YHWH na hindi ginamit sa mismong talata.
translation_notes:
  register: Makabago, magalang, at marangal na Filipino. Pinili ang “naglakas-loob” upang maipakita ang mapagpakumbabang pangangahas ni Abraham, at iniwasan ang arkong “narito” o “masdan” bilang panawag-pansin.
