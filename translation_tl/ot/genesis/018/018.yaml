  text: וְ/אַ֨בְרָהָ֔ם הָי֧וֹ יִֽהְיֶ֛ה לְ/ג֥וֹי גָּד֖וֹל וְ/עָצ֑וּם וְ/נִ֨בְרְכוּ ב֔/וֹ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/018.yaml
  text: Abraham will surely become a great and mighty nation[a], and all the nations of the earth will be blessed in him.
translation:
  language: tl
  text: Tiyak na magiging isang dakila at makapangyarihang bansa si Abraham, at lahat ng bansa sa lupa ay pagpapalain dahil kay Abraham.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “magpapala sila sa kanilang sarili dahil kay Abraham.” Maaaring unawain sa ganitong reflexive na diwa ang anyong Hebreo, bagaman pasibo ang pagbasa sa pangunahing teksto: “pagpapalain dahil kay Abraham.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיוֹ יִהְיֶה
  choice: Tiyak na magiging
  rationale: Ang infinitive absolute na sinusundan ng imperfect ng היה ay nagbibigay-diin sa katiyakan ng mangyayari. Likas sa modernong Tagalog ang “tiyak na magiging” at naipapakita nito kapwa ang hinaharap at ang diin.
- source_word: לְגוֹי
  choice: isang ... bansa
  rationale: Ang גוי ay tumutukoy sa isang bansa o pangkat ng mga tao. Ang “bansa” ay angkop sa pangako kay Abraham at nagpapanatili ng ugnayang leksikal sa “lahat ng bansa” sa hulihan ng talata.
- source_word: גָּדוֹל
  choice: dakila
  rationale: Pinananatili ng “dakila” ang mataas na himig ng pangako at maaari itong magpahiwatig kapwa ng laki at kahalagahan.
- source_word: וְעָצוּם
  choice: makapangyarihan
  rationale: Ang עצום ay maaaring magpahiwatig ng lakas, kapangyarihan, o pagiging marami. Ang “makapangyarihan” ay likas na kapareha ng “dakila” at hindi ito nililimitahan sa dami lamang.
- source_word: וְנִבְרְכוּ
  choice: pagpapalain
  rationale: 'Ang Niphal ng ברך ay makatuwirang unawain bilang pasibo: tatanggap ng pagpapala ang mga bansa kaugnay ni Abraham. Pinananatili sa talababa ang posibleng reflexive na pagbasa.'
- source_word: בוֹ
  choice: sa kanya
  rationale: 'Ang ב na may panghalip ay nagpapahayag dito ng kaugnayan o saklaw: darating ang pagpapala “sa” o kaugnay ni Abraham. Hindi idinaragdag ng salin ang mas tahasang interpretasyong “sa pamamagitan niya.”'
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: ang lahat ng bansa sa mundo
  rationale: Isa itong panlahatang pormula sa Genesis. Ang “mundo” ay malinaw na nagpapahayag ng pandaigdig na saklaw, at ang “bansa” ay nagpapanatili ng pagkakatugma sa naunang גוי.
theological_decisions:
- issue: Pag-unawa sa pormula ng pagpapala kay Abraham
  choice: 'Ang mga bansa ay tatanggap ng pagpapala kaugnay ni Abraham: “pagpapalain sa kanya.”'
  alternative: Pagpapalain ng mga bansa ang kanilang sarili sa pamamagitan ng pagbanggit kay Abraham bilang huwaran ng pagpapala.
  rationale: Maaaring unawain ang anyong Niphal ng ברך bilang pasibo o reflexive. Ang pasibong pagbasa ay angkop sa mas malawak na konteksto ng pangako, ngunit inilalahad sa talababa ang tunay na posibleng reflexive na pagbasa upang hindi alisin ang ambiguwidad ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tiyak na magiging” para sa idiomatikong diin ng Hebreo, at pinanatili ang alternatibong pagbasa ng pormula ng pagpapala sa talababa.
