  terminology: Ang “Yahweh,” “itinakdang panahon,” at “anak na lalaki” ay angkop at pare-pareho sa pinagmulan. Pinananatili ang maingat na “napakahirap,” nang hindi ginagawang mas malakas na “imposible” ang פלא.
