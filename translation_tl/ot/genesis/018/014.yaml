- from: May anumang napakahirap para kay Yahweh?[a] Sa itinakdang panahon, babalik ako sa iyo—sa ganito ring panahon sa susunod na taon[b]—at magkakaanak na lalaki si Sara.
  to: Mayroon bang anumang bagay na napakahirap para kay Yahweh?[a] Sa itinakdang panahon ay babalik ako sa iyo—sa ganito ring panahon sa susunod na taon[b]—at magkakaroon si Sara ng isang anak na lalaki.
  rationale: Inayos ang unang tanong upang maging ganap at likas na Filipino habang pinananatili ang malawak na “bagay” ng דָּבָר at ang maingat na lakas ng פלא. Pinalitan ang pangwakas na sugnay ng mas natural na pangakong pagkakaroon ng anak na lalaki. Hindi binago ang interpretasyong pangkonteksto ng mahirap na idyomang כָּעֵת חַיָּה; nananatili itong may talababa.
