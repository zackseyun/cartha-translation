base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/014.yaml
  text: Is anything too difficult for Yahweh? At the appointed time I will return to you[a], about this time next year[b], and Sarah will have a son.
translation:
  language: tl
  text: Mayroon bang anumang bagay na napakahirap para kay Yahweh?[a] Sa itinakdang panahon ay babalik ako sa iyo—sa ganito ring panahon sa susunod na taon[b]—at magkakaroon si Sara ng isang anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Mayroon bang anumang bagay na lubhang kamangha-mangha para kay Yahweh?” Ang pandiwang Hebreo ay maaaring tumukoy sa isang bagay na pambihira o lampas sa kakayahan ng tao.'
    reason: lexical_alternative
  - marker: b
    text: 'Idyoma sa Hebreo: “sa panahon ng buhay.” Malamang na tumutukoy ito sa ganito ring kapanahunan sa susunod na taon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִפָּלֵא
  choice: May anumang napakahirap
  rationale: Ang Niphal ng פלא ay maaaring tumukoy sa pagiging pambihira, kamangha-mangha, o lampas sa kakayahan. Sa retorikal na tanong, malinaw at natural sa Filipino ang “napakahirap,” habang hindi ito pinalalakas tungo sa tahasang “imposible.”
- source_word: מֵיְהוָה
  choice: para kay Yahweh
  rationale: Sa konstruksyong kasama ng פלא, ang מן ay nagpapahiwatig ng limitasyon o kung kaninong kakayahan ang tinutukoy. Ang “para kay Yahweh” ang likas na katumbas sa Filipino.
- source_word: דָּבָר
  choice: anumang
  rationale: Bagaman maaari itong mangahulugang “bagay,” “usapin,” o “salita,” ang malawak na diwa nito sa tanong ay natural na naipapahayag ng “anumang.”
- source_word: לַמּוֹעֵד
  choice: Sa itinakdang panahon
  rationale: Ang מוֹעֵד ay isang takda o hinirang na panahon. Pinananatili ng “itinakdang panahon” ang katiyakan ng ipinangakong oras.
- source_word: אָשׁוּב אֵלֶיךָ
  choice: babalik ako sa iyo
  rationale: Ang שׁוב ay nangangahulugang bumalik, at ang panghalip na panlalaking isahan ay tumutukoy kay Abraham. Hindi na kailangang idagdag ang pangalan sa teksto.
- source_word: כָּעֵת חַיָּה
  choice: sa ganito ring panahon sa susunod na taon
  rationale: Mahirap at idyomatiko ang pariralang Hebreo, literal na may diwang “sa panahon ng buhay.” Ipinahihiwatig ng konteksto ang kaparehong kapanahunan sa susunod na taon.
- source_word: וּלְשָׂרָה בֵן
  choice: at magkakaanak na lalaki si Sara
  rationale: Walang tahasang pandiwa ang sugnay sa Hebreo, ngunit malinaw na hinaharap na kalagayan ang ipinapangako. Natural sa Filipino ang “magkakaanak na lalaki si Sara.”
theological_decisions:
- issue: Pagpapahayag sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ang personal na pangalang tipan bilang “Yahweh,” sa halip na palitan ito ng titulo.
- issue: Lakas ng retorikal na tanong
  choice: May anumang napakahirap para kay Yahweh?
  alternative: May anumang lubhang kamangha-mangha para kay Yahweh?; May imposible ba para kay Yahweh?
  rationale: Binibigyang-diin ng tanong ang kakayahan ni Yahweh na tuparin ang pangako. Ang “napakahirap” ay malinaw ngunit hindi lumalampas sa saklaw ng פלא gaya ng maaaring mangyari sa “imposible”; inilalagay sa talababa ang tunay na alternatibong “lubhang kamangha-mangha.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magkakaanak na lalaki” sa halip na mas pormal ngunit di-gaanong natural na “magkakaroon ng isang anak na lalaki.” Ang mga gitling na em dash ay nagbubukod sa paglilinaw ng itinakdang panahon nang hindi binabago ang ugnayan ng mga sugnay.
