  source_fidelity: 'Tumpak ang pangunahing diwa ng Hebreo: retorikal na tanong tungkol sa walang bagay na lampas sa kakayahan ni Yahweh, ang pagbabalik sa itinakdang panahon, at ang pangakong magkakaroon si Sara ng anak na lalaki. Gayunman, ang kasalukuyang anyo ng unang tanong ay kulang sa karaniwang pangmarka ng tanong sa Filipino, at ang pangwakas na pandiwa ay maaaring gawing mas tuwirang katumbas ng predikasyong Hebreo.'
