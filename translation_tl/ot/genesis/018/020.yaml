id: GEN.18.20
reference: Genesis 18:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה זַעֲקַ֛ת סְדֹ֥ם וַ/עֲמֹרָ֖ה כִּי רָ֑בָּה וְ/חַ֨טָּאתָ֔/ם כִּ֥י כָבְדָ֖ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/020.yaml
  text: Then Yahweh said[a], “The outcry against Sodom and Gomorrah is great[b], and their sin is very severe.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Yahweh, “Napakatindi ng daing laban sa Sodoma at Gomorra[a], at napakabigat ng kanilang kasalanan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “daing ng Sodoma at Gomorra.” Mas literal na maisasalin nang ganito ang Hebreo; nililinaw ng pangunahing teksto na ang daing ay laban sa kanila.
    reason: lexical_alternative
  - marker: b
    text: O “napakalubha ng kanilang kasalanan.” Literal na sinasabi ng Hebreo na ito ay “napakabigat,” isang paglalarawan sa matinding kaseryosohan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang “Pagkatapos ay sinabi” at malinaw nitong ipinapakita ang pagkakasunod-sunod ng pangyayari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang banal na יהוה sa halip na palitan ito ng isang titulo.
- source_word: זַעֲקַת סְדֹם וַעֲמֹרָה
  choice: ang daing laban sa Sodoma at Gomorra
  rationale: Ang זַעֲקָה ay isang malakas na daing o sigaw na dulot ng matinding kasamaan o pang-aapi. Nililinaw ng “laban sa” na ang daing ay hinggil sa mga lunsod, habang pinananatili sa talababa ang mas literal na kayariang maaaring unawaing “daing ng.”
- source_word: כִּי רָבָּה
  choice: napakatindi
  rationale: Ipinahahayag ng רָבָּה ang laki o tindi ng daing. Ang “napakatindi” ay natural at angkop sa isang daing sa Tagalog.
- source_word: וְחַטָּאתָם
  choice: at ang kanilang kasalanan
  rationale: Ang חַטָּאת ay nangangahulugang “kasalanan” dito at ginagamit sa pang-isahang anyo bilang kolektibong paglalarawan sa kasamaan ng mga mamamayan.
- source_word: כִּי כָבְדָה מְאֹד
  choice: napakabigat
  rationale: Literal na tumutukoy ang כבד sa pagiging mabigat, ngunit idyomatiko itong nagpapahayag ng sukdulang bigat o kaseryosohan ng kasalanan. Napananatili ng “napakabigat” ang larawan at malinaw pa rin ang diwa sa Tagalog.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kung kanino o laban kanino ang daing
  choice: daing laban sa Sodoma at Gomorra
  alternative: daing ng Sodoma at Gomorra
  rationale: Maaaring pormal na isalin ang construct phrase bilang “daing ng,” ngunit ipinahihiwatig ng konteksto na may daing na umabot sa Diyos dahil sa kasamaan ng mga lunsod. Nililinaw ito ng pangunahing teksto nang hindi itinatago ang gramatikal na posibilidad, na inilalahad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang anyong Filipino ng mga pangalang “Sodoma” at “Gomorra.” Pinanatili ang konkretong larawang “mabigat” dahil natural din itong tumutukoy sa malubhang kasalanan sa Tagalog.
