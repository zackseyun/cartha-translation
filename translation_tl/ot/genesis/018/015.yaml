base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/015.yaml
  text: But Sarah denied it[a], saying, “I did not laugh,” because she was afraid. But he said, “No[b], but you did laugh.”
translation:
  language: tl
  text: Ngunit itinanggi ito ni Sara, na nagsabi, “Hindi ako tumawa,” dahil natakot siya. Ngunit tumugon siya, “Hindi, tumawa ka nga.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּכַחֵשׁ
  choice: itinanggi ito
  rationale: Ang piel ng כחשׁ ay maaaring mangahulugang magkaila, tumanggi, o magsabi ng hindi totoo. Sa konteksto, ikinakaila ni Sara na tumawa siya; natural sa makabagong Tagalog ang “itinanggi ito” nang hindi agad dinaragdagan ang moral na bigat ng “nagsinungaling.”
- source_word: לֵאמֹר
  choice: Sinabi niya
  rationale: Karaniwang pormulang pambanggit ito na nagpapakilala sa tuwirang sinabi ni Sara. Hinati sa bagong pangungusap upang maging malinaw at natural sa Tagalog.
- source_word: לֹא צָחַקְתִּי
  choice: Hindi ako tumawa
  rationale: Tuwirang salin ng pandiwang nasa unang panauhang isahan na may pagtanggi.
- source_word: כִּי יָרֵאָה
  choice: dahil natakot siya
  rationale: Ang כִּי ay nagsasaad dito ng dahilan ng pagkakaila ni Sara. Ang aspektong ganap ng Tagalog na “natakot” ay angkop sa salaysay.
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi niya
  rationale: Ipinagpapatuloy ng waw-consecutive ang salaysay, habang ipinahihiwatig ng “Ngunit” ang malinaw na pagsalungat sa pagkakaila ni Sara.
- source_word: לֹא כִּי צָחָקְתְּ
  choice: Hindi! Tumawa ka nga.
  rationale: Tinatanggihan ng unang לֹא ang sinabi ni Sara. Ipinapahayag ng “nga” ang mariing pagsalungat na dala ng כִּי sa kontekstong ito, nang natural sa Tagalog.
theological_decisions:
- issue: Pagkakakilanlan ng nagsasalita sa וַיֹּאמֶר
  choice: Panatilihin ang panghalip na “niya” at huwag tahasang pangalanan ang PANGINOON sa talata.
  alternative: “Ngunit sinabi ng PANGINOON” o “Ngunit sinabi ng isa sa mga lalaki”
  rationale: Hindi muling binabanggit sa sugnay ang simuno; pandiwang panlalaking isahan lamang ang nasa Hebreo. Inuugnay ng mas malawak na konteksto ang nagsasalita sa PANGINOON, ngunit pinananatili ng salin ang kawalan ng tahasang pangalan sa mismong sugnay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ngunit” sa halip na mas kolokyal na “Pero,” at pinanatiling maikli at mariin ang huling pagtutuwid.
