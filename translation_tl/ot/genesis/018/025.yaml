base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/025.yaml
  text: Far be it from you to do such a thing—to put the righteous to death with the wicked[a], so that the righteous would be like the wicked. Far be it from you! Shall not the Judge of all the earth do justice?
translation:
  language: tl
  text: Hindi dapat na gawin mo ang gayong bagay—na patayin ang matuwid kasama ng masama, anupat matutulad sa masama ang matuwid. Hinding-hindi dapat! Hindi ba magpapairal ng katarungan ang Hukom ng buong lupa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi ba gagawin ng Hukom ng buong lupa ang makatarungan?”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה
  choice: Hindi marapat sa iyo / Hinding-hindi iyon marapat sa iyo
  rationale: Isang mariing pananalitang tumatanggi sa isang gawa bilang lubhang di-angkop at kasuklam-suklam. Pinananatili ng salin ang lakas at pag-uulit ng Hebreo nang hindi ipinahihiwatig na simpleng imposibilidad lamang ito.
- source_word: מֵעֲשֹׂת כַּדָּבָר הַזֶּה
  choice: na gumawa ng gayong bagay
  rationale: Likas na Filipino para sa ‘mula sa paggawa ng bagay na ito’ sa konstruksiyong kasunod ng חָלִילָה.
- source_word: לְהָמִית
  choice: na patayin
  rationale: Ipinahahayag ng Hiphil ng מות ang pagsanhi ng kamatayan; malinaw at natural itong naihahatid ng ‘patayin’ sa Filipino.
- source_word: צַדִּיק
  choice: ang matuwid
  rationale: Pinananatili ang moral at panghukom na diwa ng salita at ang tuwirang pagsalungat nito sa ‘masama.’
- source_word: עִם רָשָׁע
  choice: kasama ng masama
  rationale: Pinananatili ang anyong isahan at pangkalahatang pagtukoy ng Hebreo, habang malinaw na tumutukoy sa sabayang pagpatay sa matuwid at masama.
- source_word: וְהָיָה כַצַּדִּיק כָּרָשָׁע
  choice: anupat matutulad sa masama ang matuwid
  rationale: Inihahatid ang ibubungang paghahambing nang hindi nililinaw nang higit sa teksto kung ang pagkakatulad ay sa kapalaran, pagtrato, o katayuan.
- source_word: הֲשֹׁפֵט כָּל־הָאָרֶץ
  choice: ang Hukom ng buong lupa
  rationale: Ginagamit ang ‘Hukom’ bilang pantawag o titulo sa Diyos at pinananatili ang pandaigdig na saklaw ng parirala.
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Sa tanong na retorikal, tumutukoy ito sa makatarungang pagkilos, hindi lamang sa paghatol bilang isang gawaing legal.
theological_decisions:
- issue: Ang matapang na tanong ni Abraham hinggil sa makatarungang pagkilos ng Diyos
  choice: Hindi ba gagawa ng katarungan ang Hukom ng buong lupa?
  alternative: Hindi ba gagawin ng Hukom ng buong lupa ang matuwid?
  rationale: Pinananatili ng tanong ang inaasahang sagot na oo at ang lakas ng pag-apela ni Abraham sa katangian ng Diyos bilang Hukom, nang hindi pinapalambot o ginagawang tahasang pahayag ang retorikal na tanong.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang ‘Hindi marapat sa iyo’ ay mas likas kaysa sa literal na ‘Malayo nawa sa iyo’ at hindi rin nagdaragdag ng ideya ng ganap na imposibilidad. Pinanatili ang pag-uulit at ang matinding diin ng orihinal sa pamamagitan ng ‘Hinding-hindi.’
