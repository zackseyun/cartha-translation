  to: Kung sakaling kulang ng lima ang limampung matuwid, lilipulin mo ba ang buong lungsod dahil sa kakulangan ng lima? Sinabi niya, “Hindi ko ito lilipulin kung may matagpuan ako roon na apatnapu't lima.”
  rationale: Pinalitan ang di-likas na “dahil sa limang kulang” ng “dahil sa kakulangan ng lima” upang malinaw na ang tanong ay tungkol sa kakulangan mula sa limampu. Inalis ang hindi kinakailangan at hindi eksaktong footnote. Pinakinis din ang huling sugnay upang maging mas natural sa Tagalog, habang pinananatili ang kondisyon, ang “roon,” at ang bilang na apatnapu't lima.
