base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/028.yaml
  text: Suppose five of the fifty righteous are lacking—will you destroy the whole city for five? And he said[c][b][a], “I will not destroy it if I find forty-five there.”
translation:
  language: tl
  text: Kung sakaling kulang ng lima ang limampung matuwid, lilipulin mo ba ang buong lungsod dahil sa kakulangan ng lima? Sinabi niya, “Hindi ko ito lilipulin kung may matagpuan ako roon na apatnapu't lima.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלַי
  choice: Kung sakaling
  rationale: Likas na nagpapakilala ng ipinapalagay na kalagayan sa pakiusap ni Abraham at pinananatili ang pagiging di-tiyak ng Hebreo.
- source_word: יַחְסְרוּן חֲמִשִּׁים הַצַּדִּיקִם חֲמִשָּׁה
  choice: kulang ng lima ang limampung matuwid
  rationale: Pinananatiling paksa ang ‘limampung matuwid’ at malinaw na ang bilang na limampu ay kapos ng lima, sa halip na magpahiwatig na may limang tiyak na taong nawawala.
- source_word: הַצַּדִּיקִם
  choice: matuwid
  rationale: Karaniwan at dignified na katumbas na nagpapanatili sa moral at panghukom na diwa ng salita.
- source_word: הֲתַשְׁחִית / לֹא אַשְׁחִית
  choice: lilipulin / Hindi ko ito lilipulin
  rationale: Ang ‘lipulin’ ay natural na pandiwa para sa lubusang pagwasak at pinananatili ang pag-uulit ng parehong pandiwang Hebreo sa tanong at sagot.
- source_word: בַּחֲמִשָּׁה
  choice: dahil sa limang kulang
  rationale: Ipinahahayag ang sanhi o batayan ng tanong at nililinaw na ang tinutukoy ay ang kakulangan ng lima, hindi ang limang matuwid mismo bilang dahilan ng paglipol.
- source_word: אֶת כָּל הָעִיר
  choice: ang buong lungsod
  rationale: Natural na katumbas na nagpapanatili sa kabuuang saklaw ng Hebreo.
- source_word: אִם אֶמְצָא שָׁם אַרְבָּעִים וַחֲמִשָּׁה
  choice: kung makakita ako roon ng apatnapu't lima
  rationale: Pinananatili ang kondisyon at ang lokatibong ‘roon’ sa natural na ayos ng modernong Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa צַדִּיקִים
  choice: matuwid
  alternative: makatarungan
  rationale: Ang ‘matuwid’ ay mas malawak at nakaugaliang katawagan para sa moral at panghukom na katangian sa kontekstong ito; ang ‘makatarungan’ ay maaaring magtunog na tumutukoy lamang sa patas na paghatol.
- issue: Kung ano ang dahilan na ipinahihiwatig ng בַּחֲמִשָּׁה
  choice: dahil sa limang kulang
  alternative: dahil sa lima
  rationale: Iniiwasan nitong ipahiwatig na ang limang matuwid ang sanhi ng paglipol; ang argumento ni Abraham ay tungkol sa kakulangan ng lima mula sa limampu.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘lungsod’ at ‘matuwid’ bilang karaniwang biblikal ngunit nauunawaang mga salita. Ang ‘kulang ng lima ang limampung matuwid’ ay sadyang sumusunod sa ugnayang sintaktiko ng Hebreo habang nananatiling natural sa Tagalog.
