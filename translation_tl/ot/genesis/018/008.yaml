  naturalness: 'May maliit ngunit mahalagang suliranin sa pariralang “pati ng guyang inihanda niya”: hindi ito likas o ganap na gramatikal sa makabagong Filipino sa ganitong pagkakaugnay. Mas natural ang “at ang guyang inihanda niya.” Ang “inilapag” ay mas angkop din kaysa “inilagay” para sa paghahain ng pagkain.'
