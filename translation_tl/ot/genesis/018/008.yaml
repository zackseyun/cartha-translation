base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/008.yaml
  text: Then he took curds and milk and the calf that he had prepared[a], and set it before them[b]. He stood by them under the tree while they ate.
translation:
  language: tl
  text: Pagkatapos, kumuha siya ng namuong gatas[a] at gatas, at ang guyang inihanda niya, at inilapag niya ang mga ito sa harap nila. Nakatayo siya sa tabi nila[b] sa ilalim ng puno habang kumakain sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mantikilya” o “krema.” Ang salitang Hebreo ay tumutukoy sa isang malapot na produktong mula sa gatas at maaaring mangahulugang namuong gatas, krema, o mantikilya depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Literal na, “nakatayo sa ibabaw nila.” Dito, malamang na nangangahulugan itong nakatayo siya sa malapit at naglilingkod sa kanila bilang punong-abala.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: namuong gatas
  rationale: Tumutukoy ito sa isang malapot o namuong produktong mula sa gatas. Ang “namuong gatas” ay angkop sa kontekstong pastoral at hindi labis na nagtatakda kung ito ay keso, krema, o mantikilya.
- source_word: חָלָב
  choice: gatas
  rationale: Tuwirang katumbas ng karaniwang salitang Hebreo para sa gatas.
- source_word: וּבֶן הַבָּקָר
  choice: pati ng guya
  rationale: Literal itong “anak ng bakahan,” isang idyoma para sa batang baka. Ang “guya” ay natural at tumutukoy sa hayop na inihanda sa naunang talata.
- source_word: אֲשֶׁר עָשָׂה
  choice: na inihanda niya
  rationale: Bagaman malawak ang kahulugan ng pandiwang עשה na “gumawa,” sa konteksto ng pagkain ay malinaw at likas ang “inihanda.”
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: at inilagay ang mga iyon sa harap nila
  rationale: Ang literal na “ibinigay sa harap nila” ay nangangahulugang inilapag o inihain ang pagkain sa mga panauhin. Pinananatili ng “inilagay ... sa harap nila” ang anyo at diwa ng Hebreo.
- source_word: וְהוּא עֹמֵד עֲלֵיהֶם
  choice: Nakatayo siya sa tabi nila
  rationale: Sa konteksto ng pagtanggap sa mga panauhin, ipinahihiwatig ng parirala na nanatiling malapit si Abraham upang maglingkod sa kanila. Iniiwasan ng “sa tabi nila” ang maling pahiwatig ng pisikal na pagtayo sa ibabaw nila.
- source_word: תַּחַת הָעֵץ
  choice: sa ilalim ng puno
  rationale: Tuwiran, malinaw, at natural na salin ng pariralang Hebreo.
- source_word: וַיֹּאכֵלוּ
  choice: habang kumakain sila
  rationale: 'Ipinakikita nito ang sabayang pangyayari: nakatayo at naglilingkod si Abraham samantalang kumakain ang mga panauhin. Maaari rin itong isalin nang mas pormal na “at kumain sila.”'
theological_decisions:
- issue: Kung dapat bang ipahiwatig sa salin ang isang mas huling teolohikal na pagkakakilanlan ng mga panauhin
  choice: Isinalin ang talata bilang karaniwang salaysay ng pagtanggap at paglilingkod ni Abraham sa mga panauhin.
  alternative: Gumamit ng mas maringal na pananalita upang ipahiwatig ang banal na katayuan ng mga panauhin.
  rationale: Inilalarawan mismo ng talata ang magiliw na pagtanggap ni Abraham. Hindi dapat ipasok sa salin ang mga teolohikal na konklusyong hindi tahasang sinasabi ng talatang Hebreo.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “namuong gatas” sa halip na ang mas tiyak na “mantikilya” o “krema” upang mapanatili ang lawak ng kahulugang Hebreo; ipinaliwanag ang mga alternatibo sa talababa.
