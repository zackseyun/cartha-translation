  text: Then they said to him[a], “Where is Sarah your wife?” And he said, “There, in the tent.”
translation:
  language: tl
  text: Pagkatapos, sinabi nila sa kanya, “Nasaan ang asawa mong si Sara?” Sinabi niya, “Naroon siya sa tolda.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Pagkatapos, tinanong nila
  rationale: Ang wayyiqtol ng אמר ay nagsusulong ng salaysay. Dahil tanong ang mismong sinabi, natural sa modernong Tagalog ang “tinanong nila,” habang pinananatili ng “Pagkatapos” ang pagkakasunod-sunod.
- source_word: אֵלָיו
  choice: siya
  rationale: Ang אֶל na may hulaping 3ms ay tumutukoy kay Abraham bilang kinausap; sa pandiwang “tinanong,” natural itong katawanin ng panghalip na “siya.”
- source_word: אַיֵּה
  choice: Nasaan
  rationale: Ito ang karaniwang modernong Tagalog na tanong tungkol sa kinaroroonan.
- source_word: שָׂרָה אִשְׁתֶּךָ
  choice: ang asawa mong si Sara
  rationale: Natural sa Tagalog ang ayos na relasyonal na parirala bago ang pangalang pantangi. Pinananatili nito ang malinaw na kahulugang “your wife, Sarah.”
- source_word: וַיֹּאמֶר
  choice: Sumagot siya
  rationale: Bagaman literal na “at sinabi niya,” ang pahayag ay tuwirang tugon sa tanong; “Sumagot siya” ang malinaw at likas na katumbas sa daloy ng Tagalog.
- source_word: הִנֵּה
  choice: Naroon
  rationale: Sa tugon sa tanong na “Nasaan,” ang deiktikong הִנֵּה ay likas na naihahayag ng “Naroon,” nang hindi gumagamit ng makalumang “Narito” o nagdaragdag ng tahasang simuno.
- source_word: בָאֹהֶל
  choice: sa loob ng tolda
  rationale: Ang בְּ na may אֹהֶל ay nagsasaad ng lokasyon sa tolda. Ang “sa loob ng tolda” ay malinaw at natural sa Tagalog at hindi lumalampas sa ipinahihiwatig na panloob na lokasyon.
