translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tolda” bilang karaniwang salin ng אֹהֶל at pinanatiling maikli ang tugon ni Abraham upang tumugma sa maigsi at deiktikong Hebreo.
