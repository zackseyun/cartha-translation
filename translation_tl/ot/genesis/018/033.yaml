  text: וַ/יֵּ֣לֶךְ יְהוָ֔ה כַּ/אֲשֶׁ֣ר כִּלָּ֔ה לְ/דַבֵּ֖ר אֶל אַבְרָהָ֑ם וְ/אַבְרָהָ֖ם שָׁ֥ב לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/033.yaml
  text: Then Yahweh went his way when he had finished speaking to Abraham[a], and Abraham returned to his place.
translation:
  language: tl
  text: Nang matapos magsalita si Yahweh[a] kay Abraham, umalis siya, at bumalik si Abraham sa kanyang lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “יהוה” (YHWH). Maaari rin itong i-transliterate bilang “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Umalis
  rationale: Sa salaysay, ipinahihiwatig ng הלך dito ang pag-alis matapos ang pag-uusap. Ang “umalis” ay likas at tuwirang Filipino nang hindi nagdaragdag ng patutunguhan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: כַּאֲשֶׁר כִּלָּה לְדַבֵּר
  choice: nang matapos siyang magsalita
  rationale: Ipinahahayag ng כַּאֲשֶׁר ang ugnayang temporal, at ng כִּלָּה kasama ang pawatas ang pagkumpleto sa pagsasalita. Likas sa Filipino ang “nang matapos siyang magsalita.”
- source_word: אֶל אַבְרָהָם
  choice: kay Abraham
  rationale: Ang אֶל ay nakatuon sa kausap; sa Filipino, sapat at natural ang “magsalita kay Abraham.”
- source_word: שָׁב
  choice: bumalik
  rationale: Tuwirang ipinahihiwatig ng שוב ang pagbabalik.
- source_word: לִמְקֹמוֹ
  choice: sa kanyang lugar
  rationale: Pinananatili ang payak na kahulugan ng מָקוֹם na “lugar” at hindi ito ginagawang mas tiyak na “tahanan,” na hindi tahasang sinasabi ng Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tahasang ginagamit sa talata ang Tetragrammaton. Ang “Yahweh” ay transliterasyon ng personal na pangalan at hindi pagpapalit nito ng titulong “ang PANGINOON.” Nililinaw sa talababa ang anyong Hebreo at ang alternatibong transliterasyon.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinananatili ang ayos at temporal na ugnayan ng Hebreo hangga’t hindi nagiging mabigat ang pangungusap; ang “naman” ay ginamit upang natural na itapat ang pagbabalik ni Abraham sa pag-alis ni Yahweh.
