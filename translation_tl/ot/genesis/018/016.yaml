base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/016.yaml
  text: Then the men rose up from there and looked down toward Sodom[b][a], and Abraham was walking with them to send them on their way.
translation:
  language: tl
  text: Pagkatapos, tumayo mula roon ang mga lalaki at tumingin pababa patungo sa Sodoma[a]. Naglakad si Abraham na kasama nila upang ihatid sila[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumingin patungo sa Sodoma.” Ipinahihiwatig ng pandiwang Hebreo ang pagtingin mula sa isang mataas na kinalalagyan.
    reason: lexical_alternative
  - marker: b
    text: O “upang samahan sila sa kanilang pag-alis.” Tumutukoy ang pananalitang Hebreo sa pagsama at pagpapayaon sa mga papaalis na panauhin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ מִשָּׁם
  choice: Pagkatapos, tumayo ... ang mga lalaki
  rationale: Ang קום ay literal na tumayo o bumangon. Ang “tumayo” ay likas sa konteksto ng pagbangon mula sa naunang salu-salo, samantalang ipinahihiwatig ng “Pagkatapos” ang pagsulong ng salaysay at ng kasunod na kilos ang pag-alis nila roon.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaki
  rationale: Karaniwang salitang Hebreo ito para sa “mga lalaki.” Pinananatili nito ang katawagan at tensiyon ng salaysay nang hindi sila agad ipinakikilalang mga anghel o basta mga panauhin.
- source_word: וַיַּשְׁקִפוּ עַל־פְּנֵי סְדֹם
  choice: tumingin mula sa mataas na lugar patungo sa Sodoma
  rationale: Madalas ipahiwatig ng שׁקף ang pagtingin mula sa mataas na kinalalagyan. Nililinaw ng salin ang topograpikong pahiwatig, habang ang “patungo sa Sodoma” ay natural na katumbas ng idyomang עַל־פְּנֵי.
- source_word: וְאַבְרָהָם הֹלֵךְ עִמָּם
  choice: Sinamahan sila ni Abraham
  rationale: Ipinapakita ng participle הֹלֵךְ ang nagpapatuloy na pagsama o paglakad ni Abraham sa kanila. Mas natural sa modernong Tagalog ang “sinamahan sila” kaysa sa literal na “naglalakad na kasama nila.”
- source_word: לְשַׁלְּחָם
  choice: upang ihatid sila
  rationale: Sa kontekstong ito ng pagtanggap sa mga panauhin, ang שׁלח ay tumutukoy sa pagsama sa mga papaalis at maayos na pagpapayaon sa kanila. Ang “ihatid” ay natural at maikli, at pinananatili sa talababa ang mas buong diwa.
theological_decisions:
- issue: Pagkakakilanlan ng הָאֲנָשִׁים sa konteksto
  choice: “ang mga lalaki” sa pangunahing teksto
  alternative: “ang mga panauhin” o “ang mga anghel”
  rationale: Karaniwang pangngalang “mga lalaki” ang ginamit sa mismong talata. Hindi sila tuwirang tinatawag ditong mga anghel, kaya hindi dapat unahan ng salin ang unti-unting paglalahad ng salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “Sodoma,” ang karaniwang anyong Filipino ng pangalan. Ang ayos ng ikalawang pangungusap ay ginawang likas sa Tagalog nang hindi nawawala ang diwa ng nagpapatuloy na pagsama ni Abraham.
