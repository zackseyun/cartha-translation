base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/005.yaml
  text: And let me bring a morsel of bread[a], so that you may refresh your hearts; after that you may pass on, since this is why you have passed by your servant. And they said, “Yes[b], do as you have said.”
translation:
  language: tl
  text: “Hayaan ninyong magdala ako ng kaunting tinapay upang magkalakas kayo.[a] Pagkatapos, maaari na kayong magpatuloy, sapagkat ito ang dahilan kung bakit kayo napadaan sa inyong lingkod.” Sinabi nila, “Gawin mo ayon sa sinabi mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at suportahan o palakasin ninyo ang inyong puso.” Isang idyomang Hebreo ito para sa pagpapanumbalik ng lakas sa pamamagitan ng pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶקְחָה
  choice: Hayaan ninyong magdala ako
  rationale: Ang Qal cohortative ay nagpapahayag ng magalang na kusang alok ni Abraham. Ang “magdala” ay angkop sa konteksto ng pagpapatuloy at malinaw sa modernong Tagalog.
- source_word: פַת לֶחֶם
  choice: kaunting tinapay
  rationale: Tumutukoy ang parirala sa maliit na dami o bahagi ng tinapay. Pinananatili ng “kaunting tinapay” ang mapagkumbabang pananalita ni Abraham bilang punong-abala nang hindi gumagamit ng di-likas na ekspresyon.
- source_word: וְסַעֲדוּ לִבְּכֶם
  choice: upang manumbalik ang inyong lakas
  rationale: Ang literal na larawan ay pagsuporta o pagpapalakas sa puso, ngunit ang idyoma ay tumutukoy sa pagpapanumbalik ng lakas sa pamamagitan ng pagkain. Natural ito sa Tagalog, habang inilalahad sa talababa ang larawang Hebreo.
- source_word: אַחַר תַּעֲבֹרוּ
  choice: Pagkatapos ay maaari na kayong magpatuloy
  rationale: Ang עבר dito ay tumutukoy sa pagpapatuloy ng paglalakbay pagkatapos kumain. Ipinahihiwatig ng “maaari na” ang pahintulot o magalang na mungkahi, hindi isang utos.
- source_word: כִּי עַל כֵּן
  choice: sapagkat ito ang dahilan kung bakit
  rationale: Pinananatili nito ang tahasang paliwanag ni Abraham at ang bahagyang tensiyon ng pahayag na para bang ang pagdaan nila ay naglaan ng pagkakataon sa kaniyang pagtanggap.
- source_word: עֲבַרְתֶּם עַל עַבְדְּכֶם
  choice: kayo napadaan sa inyong lingkod
  rationale: Ang “napadaan” ay natural sa konteksto ng mga manlalakbay at malapit sa pandiwang Hebreo. Ang “inyong lingkod” ay nagpapanatili sa mapagpakumbabang pagtukoy ni Abraham sa sarili.
- source_word: כֵּן תַּעֲשֶׂה
  choice: Sige, gawin mo
  rationale: Ang כֵּן ay maikling pagsang-ayon. Ang “Sige” ay malinaw at natural na tugon sa alok sa modernong Tagalog.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: ang sinabi mo
  rationale: Direkta nitong pinagtitibay ang panukalang kababanggit pa lamang ni Abraham.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ngunit madaling maunawaan. Ginamit ang “inyong lingkod” upang mapanatili ang pormal at mapagpakumbabang pananalita ni Abraham; iniwasan ang labis na literal na pariralang magiging asiwa sa karaniwang mambabasa.
