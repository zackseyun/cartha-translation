  terminology: Ang ‘inyong lingkod’ ay wastong mapagpakumbabang pagtukoy ni Abraham sa sarili. Ang talababa ay wastong nagpapaliwanag sa Hebreong idyoma nang hindi ipinipilit ang literal na ‘puso’ sa pangunahing teksto.
