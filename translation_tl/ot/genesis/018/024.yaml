  naturalness: Nauunawaan ang draft, ngunit ang “hindi patatawarin ang lugar” ay medyo di-likas at maaaring magmukhang tuwirang pagpapatawad sa isang heograpikong lugar. Ang “palalampasin ang lugar” ay mas natural sa retorikal na tanong at mas malapit sa kontekstuwal na kahulugan.
  terminology: Ang “taong matuwid,” “lungsod,” “lilipulin,” at “alang-alang sa” ay angkop sa modernong Filipino Tagalog at pinananatili ang marangal na rehistro. Ang “Kung sakaling” ay malinaw na naghahatid ng tentatibo/hipotetikal na puwersa ng אוּלַי.
