base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/024.yaml
  text: Suppose there are fifty righteous people within the city[c][b][a]. Will you indeed sweep it away and not spare the place for the sake of the fifty righteous who are within it?
translation:
  language: tl
  text: Kung sakaling may limampung taong matuwid sa loob ng lungsod,[a] lilipulin mo ba talaga ito at hindi mo palalampasin ang lugar alang-alang sa limampung matuwid na naroon?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Marahil ay may limampung taong matuwid sa loob ng lungsod.”'
    reason: Pinananatili ang mas lantad na tentatibong diwa ng אוּלַי bilang alternatibo sa hipotetikal na “Kung sakaling may.”
  - marker: b
    text: 'Maaari ring: “at hindi mo patatawarin ang lugar.”'
    reason: Ang Hebreong pandiwa ay maaari ring tumukoy sa pagpapatawad; gayunman, sa kontekstong ito ay tumutukoy ito sa hindi paglipol o pagpapalampas sa lungsod.
lexical_decisions:
- source_word: אוּלַי
  choice: Kung may
  rationale: Sa pakiusap ni Abraham, natural na inilalahad nito ang isang maaaring kalagayan. Pinananatili nito ang tentatibo at hipotetikal na diwa nang hindi ginagawang tiyak ang pag-iral ng limampu.
- source_word: יֵשׁ
  choice: may
  rationale: Karaniwang eksistensiyal na anyo sa modernong Tagalog.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: limampung taong matuwid
  rationale: Tumutukoy sa mga taong matuwid at hindi kinakailangang sa mga lalaki lamang; malinaw at likas ang 'taong matuwid' sa Tagalog.
- source_word: בְּתוֹךְ הָעִיר
  choice: sa loob ng lungsod
  rationale: Tuwirang ipinapahayag ang lokasyon sa loob ng mga hangganan ng lungsod.
- source_word: הַאַף
  choice: pa rin ba
  rationale: Ipinahihiwatig ang mariing retorikal na tanong at ang nakakagulat na posibilidad na lilipulin pa rin ang lungsod kahit may mga matuwid doon.
- source_word: תִּסְפֶּה
  choice: lilipulin mo
  rationale: Ipinapahayag ang lubusang pag-aalis o pagwasak sa hatol. Mas natural sa Tagalog kaysa sa literal na larawang 'wawalisin,' habang pinananatili ang tindi ng pandiwa.
- source_word: וְלֹא תִשָּׂא לַמָּקוֹם
  choice: at hindi patatawarin ang lugar
  rationale: Ang נשא rito ay maaaring mangahulugang patawarin o hindi ipataw ang kaparusahan. Sa Tagalog, ang 'patatawarin ang lugar' ay nagpapanatili sa metonimiya ng Hebreo at sa posibleng kahulugang pagpapatawad, samantalang ipinapaliwanag ng talababa ang kahulugang hindi paglipol.
- source_word: לְמַעַן
  choice: alang-alang sa
  rationale: Malinaw na ipinapahayag na ang mga matuwid ang batayan ng hinihiling na awa sa lugar.
- source_word: אֲשֶׁר בְּקִרְבָּהּ
  choice: na naroon
  rationale: Likas at maikli sa Tagalog, at malinaw na tumutukoy sa limampung matuwid na nasa lungsod.
theological_decisions:
- issue: Kahulugan ng נשא sa pariralang וְלֹא תִשָּׂא לַמָּקוֹם
  choice: patatawarin ang lugar
  alternative: hindi ililigtas o hindi palalampasin ang lugar
  rationale: Pinananatili ng 'patatawarin' ang malawak na semantikong saklaw ng נשא at ang metonimikong pagtukoy sa lungsod. Dahil ang agarang usapin ay pag-iwas sa paglipol, inilalagay sa talababa ang mas kontekstuwal na alternatibong 'hindi ililigtas sa paglipol' upang hindi tahimik na lutasin ang leksikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lungsod” at “lilipulin” para sa malinaw na pampublikong pagbasa. Iniwasan ang eksklusibong “lalaking matuwid” at pinanatili ang retorikal na diin ng tanong sa “pa rin ba.”
