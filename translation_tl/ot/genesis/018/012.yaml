base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/012.yaml
  text: So Sarah laughed to herself[a], saying, “After I am worn out, shall I have pleasure, while my lord is old?”
translation:
  language: tl
  text: Kaya natawa si Sara sa kanyang kalooban at sinabi, “Pagkatapos kong manghina, magkakaroon pa ba ako ng kasiyahan[a], habang matanda na ang aking panginoon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaluguran,” na maaaring tumukoy sa panibagong kasiyahang pangmag-asawa o sigla ng kabataan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְחַק
  choice: natawa
  rationale: Tuwirang ipinahahayag ang pagtawa ni Sara bilang tugon sa pangako, nang hindi ipinapalagay na ito ay panunuya.
- source_word: בְּקִרְבָּהּ
  choice: sa kanyang kalooban
  rationale: Pinananatili ang literal na diwang ‘sa loob niya’ at malinaw na ipinahihiwatig na hindi panlabas ang kanyang pagtawa.
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Ipinakikilala nito ang tuwirang sipi; sapat nang ipinahahayag ng naunang parirala na panloob ang pagsasalita.
- source_word: אַחֲרֵי בְלֹתִי
  choice: Ngayong lipas na ako
  rationale: Ang ‘lipas na’ ay likas at marangal na Filipino para sa kalagayang naluma o nanghina na dahil sa katandaan, habang iniiwasang ulitin lamang ang ‘matanda’ na ginamit para kay Abraham.
- source_word: הָיְתָה לִּי עֶדְנָה
  choice: magkakaroon pa ba ako ng ligaya
  rationale: Ang tanong na may ‘pa ba’ ay natural na naghahatid ng pag-aalinlangan ni Sara kung darating pa sa kanya ang ligaya sa kanyang kalagayan.
- source_word: עֶדְנָה
  choice: ligaya
  rationale: Malawak ang ‘ligaya’ at naiiwan nitong bukas ang maaaring pahiwatig na kasiyahang pangmag-asawa o panibagong sigla, nang hindi iyon labis na tinutukoy.
- source_word: וַאדֹנִי
  choice: ang aking panginoon
  rationale: Pinananatili ang magalang na tawag ni Sara kay Abraham; ang maliit na titik at ang panghalip na ‘aking’ ay tumutulong upang hindi ito mapagkamalang banal na titulo.
- source_word: זָקֵן
  choice: matanda na
  rationale: Payak, tuwiran, at likas na katumbas ng Hebreong panaguring tumutukoy sa katandaan ni Abraham.
theological_decisions:
- issue: Lawak ng kahulugan ng עֶדְנָה
  choice: ligaya
  alternative: kasiyahang seksuwal; panibagong sigla ng kabataan
  rationale: Maaaring may pahiwatig ang salita sa katawan, pagkamayabong, at pagsasama ng mag-asawa, ngunit hindi makitid ang pagpapakahulugan ng Hebreo. Pinananatili ng ‘ligaya’ ang tunay na kalabuan, at inilalahad sa talababa ang mas tiyak na mga posibilidad.
translation_notes:
  register: Makabago, likas, at marangal na Filipino. Ginamit ang ‘sa kanyang kalooban’ upang malinaw ang panloob na pagtawa, at ‘gayong’ upang likas na ihayag ang ugnayang pasalungat ng huling sugnay.
