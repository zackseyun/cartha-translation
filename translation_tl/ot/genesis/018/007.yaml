  yaml_path: translation/ot/genesis/018/007.yaml
  text: And Abraham ran to the herd and took a tender and good calf and gave it to the young man[a], and he hurried to prepare it.
translation:
  language: tl
  text: Tumakbo si Abraham papunta sa mga baka at kumuha ng isang guya na malambot at mainam. Ibinigay niya ito sa binata[a], at nagmadali ang binata na ihanda iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kabataang lalaki,” “lingkod,” o “batang lalaki.” Maaaring tumukoy ang salitang Hebreo na הַנַּעַר sa isang kabataan o sa isang lingkod, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּקָר
  choice: kawan
  rationale: Tumutukoy ito sa kalipunan ng mga bakang alaga; natural sa Tagalog ang “kawan” at malinaw na doon pumili si Abraham ng isang hayop.
- source_word: רָץ
  choice: tumakbo
  rationale: Tuwirang pinananatili ang masiglang kilos at pagmamadali sa salaysay.
- source_word: בֶּן־בָּקָר
  choice: isang batang baka
  rationale: Idyoma ito para sa batang hayop mula sa mga baka. Ang “batang baka” ay malinaw at hindi nagpapasya kung lalaki o babae ang hayop, na hindi tahasang tinutukoy ng parirala.
- source_word: רַךְ וָטוֹב
  choice: malambot at mainam
  rationale: 'Pinananatili ang dalawang katangian: ang lambot at ang mabuting kalidad o pagiging angkop ng hayop.'
- source_word: הַנַּעַר
  choice: binata
  rationale: Maaaring tumukoy ang נַעַר sa isang kabataang lalaki o lingkod. Pinananatili ng “binata” ang pangunahing diwa ng edad nang hindi ipinapalagay sa teksto na lingkod siya.
- source_word: וַיְמַהֵר
  choice: dali-dali
  rationale: Ipinahahayag ang mabilis at agarang pagkilos sa natural na modernong Tagalog.
- source_word: לַעֲשׂוֹת אֹתוֹ
  choice: inihanda
  rationale: Bagaman malawak ang kahulugan ng עשה na “gawin,” sa konteksto ng pagkain ay natural itong tumutukoy sa paghahanda ng hayop.
