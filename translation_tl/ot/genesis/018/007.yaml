revisions:
- from: Tumakbo si Abraham papunta sa kawan at kumuha ng isang batang baka na malambot at mainam. Ibinigay niya iyon sa binata[a], at dali-dali itong inihanda ng binata.
  to: Tumakbo si Abraham papunta sa mga baka at kumuha ng isang guya na malambot at mainam. Ibinigay niya ito sa binata[a], at nagmadali ang binata na ihanda iyon.
  rationale: Pinalitan ang pangkalahatang “kawan” ng “mga baka” upang mapanatili ang tiyak na saklaw ng הַבָּקָר, at ang “batang baka” ng mas idiomatikong “guya” para sa בֶּן־בָּקָר. Inayos ang huling sugnay para sa mas natural na Tagalog habang pinananatili na ang binata ang simuno ng וַיְמַהֵר at na ang paghahanda ang kahulugan ng לַעֲשׂוֹת אֹתוֹ.
