translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Nilinaw sa huling sugnay na ang binata ang nagmadaling maghanda, ayon sa pinakamalapit na simuno ng pandiwang Hebreo, habang hindi inaangkat sa pangunahing teksto ang mas interpretibong “lingkod.”
