lexical_decisions:
- source_word: זְקֵנִים
  choice: matanda na
  rationale: Likas at malinaw na salin ng pang-uring tumutukoy sa katandaan; ipinahihiwatig ng “na” ang kalagayang narating na nila.
- source_word: בָּאִים בַּיָּמִים
  choice: marami na ang kanilang mga araw
  rationale: Pinananatili nito ang larawan ng Hebreong idyoma tungkol sa “mga araw,” habang malinaw sa konteksto na tumutukoy ito sa mahabang edad.
- source_word: חָדַל לִהְיוֹת
  choice: tumigil na
  rationale: Tuwirang ipinapahayag ang paghinto ng kalagayang inilalarawan sa kasunod na idyoma.
- source_word: אֹרַח כַּנָּשִׁים
  choice: ang karaniwang nangyayari sa mga babae
  rationale: Pinananatili ang mahinhin at di-tahasang paraan ng Hebreo, ngunit ginagawang likas at mauunawaan sa modernong Tagalog; nililinaw sa talababa ang tiyak na tinutukoy.
- source_word: לְשָׂרָה
  choice: kay Sara
  rationale: Likas na Tagalog na pananda ng taong hindi na nakararanas ng tinutukoy na kalagayan.
