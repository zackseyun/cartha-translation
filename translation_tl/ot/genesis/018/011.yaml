  text: Abraham and Sarah were old[a], advanced in days; the way of women had ceased to be with Sarah.
translation:
  language: tl
  text: Matanda na sina Abraham at Sara, at lubha na silang may edad. Hindi na dinaratnan si Sara ng karaniwang dalaw ng mga babae.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang daan ng mga babae,” isang mahinhin na idyomang nangangahulugang hindi na nireregla si Sara.
