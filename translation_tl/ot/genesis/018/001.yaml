  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה בְּ/אֵלֹנֵ֖י מַמְרֵ֑א וְ/ה֛וּא יֹשֵׁ֥ב פֶּֽתַח הָ/אֹ֖הֶל כְּ/חֹ֥ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/001.yaml
  text: And Yahweh appeared to him by the oaks of Mamre[a], while he was sitting at the entrance of the tent in the heat of the day.
translation:
  language: tl
  text: Nagpakita si Yahweh sa kanya sa may mga punong ensina ng Mamre[a], habang nakaupo siya sa bukana ng tolda sa kainitan ng araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga punong terebinto ng Mamre.” Maaaring tumukoy ang salitang Hebreo sa malalaking punong gaya ng ensina o terebinto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: Nagpakita
  rationale: Likas na salin ng Niphal ng ראה sa kontekstong nagsasalaysay ng isang nakikitang pagpapakita; hindi nito dinaragdagan ang teksto ng paliwanag kung paano nagpakilala si Yahweh.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Tuwirang pinananatili ang panghalip na panlalaking isahan, na tumutukoy kay Abraham ayon sa naunang konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: בְּאֵלֹנֵי
  choice: sa may mga punong ensina
  rationale: Ang אֵלוֹן ay maaaring tumukoy sa malalaking punong gaya ng ensina o terebinto. Ang “mga punong ensina” ay malinaw sa pangunahing teksto, habang inilalahad sa talababa ang kawalang-katiyakan sa uri ng puno.
- source_word: מַמְרֵא
  choice: Mamre
  rationale: Isinatitik ang pangalang pantangi sa anyong madaling basahin sa Filipino.
- source_word: וְהוּא יֹשֵׁב
  choice: habang nakaupo siya
  rationale: Natural na ipinahahayag ang kasabay at panlikurang kalagayang ibinibigay ng Hebreong participle.
- source_word: פֶּתַח הָאֹהֶל
  choice: sa bukana ng tolda
  rationale: Ang “bukana” ay kongkreto at natural na katumbas ng פֶּתַח bilang pasukan o siwang ng tolda.
- source_word: כְּחֹם הַיּוֹם
  choice: sa kainitan ng araw
  rationale: Pinananatili ang idyomang tumutukoy sa mainit na bahagi ng maghapon nang hindi nagtatakda ng eksaktong oras.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa Hebreong teksto. Pinananatili ng “Yahweh” ang pagkakaiba nito sa mga titulong gaya ng “Panginoon” at hindi pinapalitan ang pangalan ng tradisyonal na pamalit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tolda” at “bukana” bilang karaniwang salitang madaling maunawaan, at pinanatili ang payak na ayos ng salaysay at ang tunay na kawalang-katiyakan tungkol sa uri ng mga puno.
