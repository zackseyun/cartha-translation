revisions:
- from: Magpakuha po kayo ng kaunting tubig upang mahugasan ninyo ang inyong mga paa, at magpahinga kayo sa ilalim ng punongkahoy.[a]
  to: Pahintulutan ninyong madala ang kaunting tubig, at hugasan ninyo ang inyong mga paa, at magpahinga[a] kayo sa ilalim ng punongkahoy.
  rationale: Pinalitan ang causative na maaaring magpahiwatig na ang mga panauhin ang magpapakuha ng tubig ng isang magalang at di-tiyak-sa-ahenteng pahintulot, upang mas maipakita ang pasibong jussive ng Hebreo. Ibinalik ang magkakaugnay na mga kahilingan bilang koordinadong mga sugnay at inilipat ang talababa sa salitang tinutukoy nito.
