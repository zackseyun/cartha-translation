  text: Please let a little water be brought[a], and wash your feet[b], and rest yourselves under the tree.
translation:
  language: tl
  text: Pahintulutan ninyong madala ang kaunting tubig, at hugasan ninyo ang inyong mga paa, at magpahinga[a] kayo sa ilalim ng punongkahoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumandal kayo sa ilalim ng punongkahoy.” Ang pandiwang Hebreo ay mas literal na nangangahulugang “sumandal” o “humilig”; dito, tumutukoy ito sa pagpapahinga sa lilim bilang bahagi ng pagtanggap sa mga panauhin.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻקַּח נָא
  choice: Magpakuha po kayo
  rationale: Ang pasibong jussive na יֻקַּח kasama ng pakiusap na נָא ay isang magalang na kahilingan. Natural sa Tagalog ang causative na “magpakuha,” at ang “po” ay nagpapahayag ng paggalang nang hindi ginagawang utos ang tono.
- source_word: מְעַט מַיִם
  choice: kaunting tubig
  rationale: Tuwirang ipinapahayag ang maliit na dami at pinananatili ang mapagpakumbabang anyo ng alok ni Abraham.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: upang mahugasan ninyo ang inyong mga paa
  rationale: Ang pandiwa ay tumutukoy sa paghuhugas ng mga paa ng mga panauhin. Ginagawang malinaw ng “upang” ang layunin ng pagpapakuha ng tubig, habang ang “mahugasan ninyo” ay natural at magalang sa konteksto.
- source_word: וְהִשָּׁעֲנוּ
  choice: at magpahinga kayo
  rationale: Ang Niphal ng שען ay literal na ‘sumandal’ o ‘humilig,’ ngunit sa konteksto ng pagpapatuloy ng panauhin ay tumutukoy sa pagpapahinga. Ang “magpahinga” ang natural na salin sa modernong Tagalog.
- source_word: תַּחַת הָעֵץ
  choice: sa ilalim ng punongkahoy
  rationale: Pinananatili ang tiyak na puno sa lugar ni Abraham; ang “punongkahoy” ay dignified at malinaw sa biblikal na salaysay.
theological_decisions: []
translation_notes:
  register: Makabago, magalang, at marangal na Tagalog. Ginamit ang “po” at “kayo” dahil magalang na nakikiusap si Abraham sa maramihang kausap. Iniwasan ang labis na literal ngunit di-natural na reflexive na anyo sa huling pandiwa.
