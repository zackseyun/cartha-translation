translation_notes:
  register: Gumamit ng natural at marangal na modernong Tagalog. Pinanatili ang mabilis na takbo ng salaysay at ang maigsi, apurahang utos. Iniwasan ang “keyk” dahil iba ang karaniwang kahulugan nito sa kasalukuyang Filipino; ang “mga tinapay” ang mas madaling maunawaang katumbas sa konteksto.
