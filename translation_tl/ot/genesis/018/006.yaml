  to: Kaya nagmadaling pumasok si Abraham sa tolda at lumapit kay Sara. Sinabi niya, “Dali! Masahin mo ang tatlong seah[a][b] ng pinong harina at gumawa ka ng mga bilog na tinapay.”
  rationale: Inilipat ang alternatibong pagsasalin sa wastong salitang tinutukoy nito at ginawang “mga bilog na tinapay” ang עֻגוֹת upang mapanatili ang leksikal na detalye nang hindi ginagamit ang “keyk,” na maaaring magpahiwatig ng modernong matamis na cake. Pinagaan din ang parirala tungkol kay Sara upang manatiling tuwiran sa salaysay.
