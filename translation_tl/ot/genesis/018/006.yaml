    issue: Hindi tugma ang angkla ng talababa b sa nilalaman nito.
    rationale: Ang talababa b ay nag-aalok ng “tatlong takal,” na alternatibo para sa “tatlong seah,” ngunit nakalagay ito pagkatapos ng “pinong harina.”
  - severity: low
    issue: Masyadong pangkalahatan ang “mga tinapay” para sa עֻגוֹת.
    rationale: Ang salita ay tumutukoy sa mga cake o bilog na tinapay. Ang “mga bilog na tinapay” ay likas sa Tagalog at pinananatili ang pagkakaibang ito nang hindi ipinahihiwatig na matamis ang mga ito.
