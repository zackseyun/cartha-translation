  yaml_path: translation/ot/genesis/018/006.yaml
  text: So Abraham hurried into the tent to Sarah and said[a], “Quickly[b], knead three seahs of fine flour and make cakes.”
translation:
  language: tl
  text: Kaya nagmadaling pumasok si Abraham sa tolda at lumapit kay Sara. Sinabi niya, “Dali! Masahin mo ang tatlong seah[a][b] ng pinong harina at gumawa ka ng mga bilog na tinapay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang seah ay isang sinaunang panukat ng tuyong sangkap. Ang tatlong seah ay humigit-kumulang 20–22 litro.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “tatlong takal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: nagmadaling pumasok
  rationale: Ipinahahayag ng pandiwa ang mabilis at apurahang pagkilos; natural sa modernong Tagalog ang “nagmadali.” Isinama ang “pumasok” upang maipakita ang direksiyong ipinahihiwatig ng kasunod na הָאֹהֱלָה.
- source_word: הָאֹהֱלָה אֶל שָׂרָה
  choice: sa tolda, kung saan naroon si Sara
  rationale: Ang hulaping direksiyonal ay nagpapahiwatig ng pagpunta papasok o patungo sa tolda. Nililinaw ng natural na pariralang Tagalog na si Sara ang nilapitan niya sa loob, nang hindi ipinapalagay na pag-aari ni Sara ang tolda.
- source_word: מַהֲרִי
  choice: Dali!
  rationale: Ito ay pautos na anyong pambabae na tuwirang sinabi kay Sara. Maikli, natural, at apurahan ang “Dali!” sa kasalukuyang Tagalog.
- source_word: שְׁלֹשׁ סְאִים
  choice: tatlong seah
  rationale: Pinanatili ang tiyak na sinaunang yunit sa halip na palitan ito ng pangkalahatang “takal”; ipinaliliwanag ito sa talababa.
- source_word: קֶמַח סֹלֶת
  choice: pinong harina
  rationale: Tumutukoy ang parirala sa mahusay na uri ng harinang pino ang pagkakagiling. Malinaw at natural ang “pinong harina.”
- source_word: לוּשִׁי
  choice: Masahin mo
  rationale: Partikular na tumutukoy ang pandiwa sa pagmamasa, hindi lamang sa paghahalo. Bagaman harina ang tuwirang binabanggit sa Hebreo, likas na nauunawaan na gagawin itong masa.
- source_word: וַעֲשִׂי עֻגוֹת
  choice: at gumawa ka ng mga tinapay
  rationale: Ang עֻגוֹת ay mga tinapay na karaniwang bilog at mabilis ihanda. Mas malinaw sa modernong Tagalog ang “mga tinapay” kaysa “mga keyk,” na karaniwang nagpapahiwatig ngayon ng matamis na cake.
