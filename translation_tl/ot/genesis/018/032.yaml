  text: Then he said[a], “Please, let not my lord be angry, and I will speak only this once more. Perhaps ten will be found there.” And he said[c][b], “I will not destroy it for the sake of the ten.”
translation:
  language: tl
  text: Pagkatapos ay sinabi niya, “Huwag sanang magalit ang aking panginoon, at magsasalita pa ako sa pagkakataong ito lamang. Baka sampu ang matagpuan roon.” At sinabi niya, “Hindi ko iyon lilipulin alang-alang sa sampu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל נָא יִחַר לַאדֹנָי
  choice: Huwag po sanang magalit ang aking panginoon
  rationale: Likas na pakiusap ito sa modernong Tagalog. Ipinahahayag ng “po sana” ang magalang at mapagpakumbabang נָא, habang ang “magalit” ay natural na katumbas ng idyomang חרה. Pinananatili ng maliit na titik sa “panginoon” ang paggalang nang hindi ipinapantay ang katawagan sa pangalang YHWH.
- source_word: וַאֲדַבְּרָה אַךְ הַפַּעַם
  choice: at magsasalita pa ako sa huling pagkakataong ito
  rationale: Ipinahahayag ng cohortative ang hangarin o pakiusap ni Abraham na magsalita pa, at nililinaw ng אַךְ הַפַּעַם na ito na ang kaniyang panghuling pakiusap.
- source_word: אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה
  choice: Baka may matagpuang sampu roon
  rationale: Ang “baka” ay karaniwang pagpapahayag ng posibilidad, at ang “matagpuan” ay nagpapanatili sa pasibong diwa ng Niphal ng מצא.
- source_word: לֹא אַשְׁחִית
  choice: Hindi ko iyon lilipulin
  rationale: Ang Hiphil ng שׁחת ay nangangahulugang wasakin o lipulin. Idinagdag ang “iyon” bilang likas na Tagalog na layon na malinaw mula sa konteksto, bagaman walang tahasang layon sa Hebreo.
- source_word: בַּעֲבוּר הָעֲשָׂרָה
  choice: alang-alang sa sampu
  rationale: Ang “alang-alang sa” ay malinaw at natural na naghahayag na hindi isasagawa ang paglipol dahil sa sampung nabanggit.
theological_decisions:
- issue: Tinutukoy at anyo ng אֲדֹנָי sa pakikipag-usap ni Abraham
  choice: aking panginoon
  alternative: Panginoon
  rationale: Bagaman banal ang kausap ayon sa mas malawak na salaysay, ang salitang ginamit rito ay hindi ang pangalang YHWH. Pinananatili ng “aking panginoon” ang magalang na tuwirang pakikipag-usap at ang likas na kalabuan ng katawagan nang hindi labis na nagpapasya sa salin.
- issue: Hindi tahasang layon ng לֹא אַשְׁחִית
  choice: Hindi ko iyon lilipulin
  alternative: Hindi ako lilipol
  rationale: Ang tinutukoy na lugar o lungsod ay nauunawaan mula sa konteksto. Ang “iyon” ay idinagdag para sa malinaw at natural na Tagalog, nang hindi pinapangalanan ang isang layong hindi tahasang binanggit sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ngunit madaling maunawaan. Ginamit ang “po sana” upang maipakita ang mapagpakumbabang pakiusap ni Abraham, at “aking panginoon” sa maliit na titik upang mapanatili ang paggalang at interpretatibong pag-iingat.
