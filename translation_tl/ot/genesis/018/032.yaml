  to: Pagkatapos ay sinabi niya, “Huwag sanang magalit ang aking panginoon, at magsasalita pa ako sa pagkakataong ito lamang. Baka sampu ang matagpuan roon.” At sinabi niya, “Hindi ko iyon lilipulin alang-alang sa sampu.”
