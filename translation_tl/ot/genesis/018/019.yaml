revisions:
- from: Sapagkat kilala ko siya[a] upang utusan niya ang kanyang mga anak[b] at ang kanyang sambahayan na susunod sa kanya, at upang sundin nila ang daan ni Yahweh[c] sa paggawa ng katuwiran at katarungan. Sa gayon, isasakatuparan ni Yahweh kay Abraham ang sinabi niya tungkol sa kanya.[d]
  to: Sapagkat kilala ko siya[a], upang utusan niya ang kanyang mga anak[b] at ang kanyang sambahayan na darating pagkatapos niya, at upang sundin nila ang daan ni Yahweh[c] sa paggawa ng katuwiran at katarungan, upang maisagawa ni Yahweh para kay Abraham ang sinabi niya tungkol sa kanya.[d]
  rationale: Nilinaw ang saklaw ng 'pagkatapos niya' nang hindi ito ginagawang utos na sundin si Abraham. Ibinalik din ang dalawang purposibong sugnay na ipinahihiwatig ng לְמַעַן at ginawang mas natural ang pagsasabi na isasagawa ni Yahweh para kay Abraham ang kanyang sinabi tungkol sa kanya.
