  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: pinananatili ang ''kilala ko siya,'' ang lakas ng ''utusan,'' ang etikal na pares na ''katuwiran at katarungan,'' at ang pangalang Yahweh. Gayunman, ang ''na susunod sa kanya'' ay maaaring mangahulugang ang mga anak at sambahayan ay susunod o tatalima kay Abraham, samantalang ang אַחֲרָיו ay naglalarawan sa mga kasunod niya. Ang huling pangungusap na nagsisimula sa ''Sa gayon'' ay nagpapahina rin sa purposibong לְמַעַן.'
  naturalness: Marangal at madaling maunawaan ang rehistro. Ang pagbabagong 'na darating pagkatapos niya' ay nag-aalis ng sintaktikong kalabuan, at ang 'upang maisagawa ni Yahweh para kay Abraham' ay mas natural at mas malapit sa ugnayang layunin ng Hebreo kaysa 'Sa gayon, isasakatuparan ... kay Abraham.'
  terminology: Ang 'Yahweh,' 'sambahayan,' 'daan,' 'katuwiran,' at 'katarungan' ay angkop at magkakatugma. Ang talababa sa panlalaking anyo ng בָּנָיו ay pinasimple upang hindi lumampas sa sinasabi ng anyong Hebreo.
