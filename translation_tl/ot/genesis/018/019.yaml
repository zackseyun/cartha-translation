language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י יְדַעְתִּ֗י/ו לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת בָּנָ֤י/ו וְ/אֶת בֵּית/וֹ֙ אַחֲרָ֔י/ו וְ/שָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַ/עֲשׂ֥וֹת צְדָקָ֖ה וּ/מִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר דִּבֶּ֖ר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/019.yaml
  text: For I have known him[a], so that he may command his children and his household after him, and they may keep the way of Yahweh by doing righteousness and justice[d][c][b], so that Yahweh may bring upon Abraham what he has spoken concerning him.
translation:
  language: tl
  text: Sapagkat kilala ko siya[a], upang utusan niya ang kanyang mga anak[b] at ang kanyang sambahayan na darating pagkatapos niya, at upang sundin nila ang daan ni Yahweh[c] sa paggawa ng katuwiran at katarungan, upang maisagawa ni Yahweh para kay Abraham ang sinabi niya tungkol sa kanya.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “pinili ko siya.” Karaniwang nangangahulugang “kilalanin” ang pandiwang Hebreo, ngunit sa kontekstong ito maaari itong magpahiwatig ng natatanging pagkilala o pagpili.'
    reason: alternative_reading
  - marker: b
    text: Ang anyong Hebreo ay panlalaking maramihan at maaari ring isaling “mga anak na lalaki.” Ipinakikitang ng “sambahayan” na ang saklaw ay hindi lamang ang kanyang mga anak.
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, ang paraan ng pamumuhay na hinihingi ni Yahweh.
    reason: cultural_note
  - marker: d
    text: 'Maaari ring: “ang ipinangako niya sa kanya.” Mas literal sa Hebreo ang “ang sinabi niya tungkol sa kanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pahayag at pinananatili ang paliwanag na ugnayan.
- source_word: יְדַעְתִּיו
  choice: kilala ko siya
  rationale: Ang ידע ay karaniwang nangangahulugang ‘kilalanin/alamin.’ Likas sa Filipino ang pangkasalukuyang anyong ‘kilala ko siya’ para sa umiiral na kaugnayang ipinahihiwatig ng Hebreo, habang inilalagay sa talababa ang posibleng diwang ‘pinili.’
- source_word: לְמַעַן אֲשֶׁר
  choice: upang
  rationale: Malinaw at likas na ipinahahayag ang layunin o nilalayong bunga.
- source_word: יְצַוֶּה
  choice: utusan
  rationale: Pinananatili nito ang lakas ng piel ng צוה, sa halip na pahinain bilang simpleng pagtuturo.
- source_word: בָּנָיו
  choice: ang kanyang mga anak
  rationale: Bagaman panlalaki ang anyong Hebreo, maaaring tumukoy ang בנים sa mga anak o supling ayon sa konteksto. Ang ‘mga anak’ ang natural na salin sa modernong Filipino; nililinaw sa talababa ang anyong panlalaki.
- source_word: בֵּיתוֹ
  choice: ang kanyang sambahayan
  rationale: Tumutukoy rito ang בית sa buong pangkat na nasa ilalim ng tahanan ni Abraham, hindi lamang sa gusali.
- source_word: אַחֲרָיו
  choice: na susunod sa kanya
  rationale: Inihahayag nito ang pagpapatuloy ng sambahayan at mga inapo pagkatapos ni Abraham nang hindi kinakailangang idagdag na tahasang tumutukoy ito sa kanyang kamatayan.
- source_word: וְשָׁמְרוּ
  choice: sundin nila
  rationale: Kapag ang שׁמר ay may layong ‘daan,’ ang diwa nito ay tapat na pagsunod o pag-iingat sa itinakdang pamumuhay.
- source_word: דֶּרֶךְ יְהוָה
  choice: ang daan ni Yahweh
  rationale: Pinananatili ang metapora ng ‘daan’ bilang paraan ng pamumuhay na hinihingi ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa baybay na ‘Yahweh’ ang personal na pangalang tetragramaton sa halip na palitan ito ng isang titulo.
- source_word: לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט
  choice: sa paggawa ng katuwiran at katarungan
  rationale: Pinananatiling magkahiwalay ang magkaugnay na mga konsepto ng matuwid na asal at makatarungang paghatol o pagkilos.
- source_word: הָבִיא ... עַל
  choice: isasakatuparan ... kay
  rationale: Sa kontekstong tumutukoy sa sinabi ng Diyos, natural na ipinahahayag ng Filipino na papangyarihin o isasakatuparan ni Yahweh ang kanyang sinabi para kay Abraham, nang hindi tahasang ginagawa itong teknikal na ‘pangako.’
- source_word: אֲשֶׁר דִּבֶּר עָלָיו
  choice: ang sinabi niya tungkol sa kanya
  rationale: Malapit nitong pinananatili ang literal na ‘ang kanyang sinabi tungkol sa kanya’ at hindi awtomatikong pinapalitan ng ‘ang kanyang ipinangako.’
theological_decisions:
- issue: Kung ang ידע ay isasaling may tahasang diwang pagpili
  choice: kilala ko siya
  alternative: pinili ko siya
  rationale: May pahiwatig ng natatanging pagkilala at pagtatangi ang konteksto, ngunit ang karaniwang leksikal na kahulugan ay ‘kilalanin.’ Pinananatili sa pangunahing teksto ang tunay na kalabuan at inilalagay ang ‘pinili’ bilang posibleng pagbasa sa talababa.
- issue: Pagpapahayag sa sinabi ni Yahweh tungkol kay Abraham
  choice: isasakatuparan ... ang sinabi niya tungkol sa kanya
  alternative: tutuparin ... ang ipinangako niya sa kanya
  rationale: Ang Hebreo ay literal na nagsasabing ‘ang sinabi niya tungkol sa kanya.’ Iniiwasan ng pangunahing teksto na gawing tahasang ‘pangako’ ang pangungusap, bagaman malamang iyon ang diwa sa konteksto.
- issue: Pagsasalin sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘sambahayan,’ ‘katuwiran,’ at ‘katarungan’ upang mapanatili ang biblikal at etikal na bigat nang hindi maging lipas ang pangungusap. Inayos ang pangungusap sa dalawang sugnay upang maging malinaw ang dalawang layuning ipinahahayag ng לְמַעַן.
