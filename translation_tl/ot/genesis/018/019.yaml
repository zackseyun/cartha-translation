    issue: Malabo ang 'na susunod sa kanya.'
    rationale: Maaari itong basahing utos na sundin si Abraham. Sa Hebreo, אַחֲרָיו ay tumutukoy sa mga anak at sambahayang darating o mananatili pagkatapos niya.
  - severity: medium
    issue: Nawala ang malinaw na layuning ipinahahayag ng ikalawang לְמַעַן.
    rationale: Ang 'Sa gayon, isasakatuparan' ay tunog bunga o simpleng pahayag sa hinaharap. Ang 'upang' ay nagpapanatili sa purposibong ugnayan ng Hebreo.
  - severity: low
