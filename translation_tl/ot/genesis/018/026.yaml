  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אִם אֶמְצָ֥א בִ/סְדֹ֛ם חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר וְ/נָשָׂ֥אתִי לְ/כָל הַ/מָּק֖וֹם בַּ/עֲבוּרָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/026.yaml
  text: And Yahweh said[a], “If I find fifty righteous people within the city of Sodom, then I will spare the whole place for their sake.”
translation:
  language: tl
  text: Sinabi ni Yahweh, “Kung makasumpong ako sa Sodoma ng limampung taong matuwid sa loob ng lungsod, patatawarin ko[a] ang buong lugar alang-alang sa kanila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “palalampasin ko ang buong lugar.” Ang pandiwang Hebreo ay maaaring mangahulugang magpatawad o magpigil ng hatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na salaysay sa modernong Tagalog; ang pagkakasunod-sunod ng pangyayari ay malinaw na sa konteksto nang hindi kailangang idagdag ang “at.”
- source_word: אִם אֶמְצָא
  choice: Kung makakita ako
  rationale: Pinananatili ang tunay na kondisyong ipinahahayag ng Hebreo sa natural na Tagalog.
- source_word: בִסְדֹם ... בְּתוֹךְ הָעִיר
  choice: sa Sodoma ... sa loob ng lungsod
  rationale: Pinananatili ang pangalan ng lugar at ang hiwalay na pagbibigay-diin na ang limampu ay nasa loob mismo ng lungsod.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: limampung taong matuwid
  rationale: Tumutukoy ito sa mga taong matuwid nang hindi nililimitahan sa mga lalaki lamang.
- source_word: וְנָשָׂאתִי
  choice: patatawarin ko
  rationale: Sa konteksto, ang literal na “bubuhatin/dadalhin” ay tumutukoy sa pagpapatawad o pagpigil sa hatol; pinananatili ng salin ang aspektong may kinalaman sa sala habang inilalagay sa talababa ang alternatibong “hindi ko pupuksain.”
- source_word: לְכָל הַמָּקוֹם
  choice: ang buong lugar
  rationale: Saklaw ang buong pook na nahaharap sa hatol, hindi lamang isang tanging bahagi nito.
- source_word: בַּעֲבוּרָם
  choice: alang-alang sa kanila
  rationale: Natural at eksaktong ipinahahayag ang pagsasaalang-alang sa mga matuwid bilang dahilan ng hindi paghatol sa buong lugar.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Kahulugan ng וְנָשָׂאתִי sa konteksto ng hatol
  choice: patatawarin ko
  alternative: hindi ko pupuksain; paliligtasin ko
  rationale: Maaaring magpahiwatig ang pandiwa ng pagpapatawad o pag-aalis/pagpigil ng kaparusahan. Ang “patatawarin” ay malapit sa leksikal na gamit, habang kinikilala sa talababa ang kontekstuwal na bunga na hindi pagpuksa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “Sodoma,” ang karaniwang anyong Filipino ng pangalan. Iniwasan ang sobrang literal na “sa gitna ng lungsod,” sapagkat ang “sa loob ng lungsod” ay mas natural at tumpak sa konteksto.
