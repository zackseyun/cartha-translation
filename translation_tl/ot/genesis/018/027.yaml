base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/027.yaml
  text: Then Abraham answered and said[a], “Behold, please, I have dared to speak to my Lord, though I am dust and ashes.”
translation:
  language: tl
  text: Sumagot si Abraham at sinabi, “Narito po, nangahas akong magsalita sa aking Panginoon[a], gayong ako'y alabok at abo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking panginoon.” Maaari ring gamitin ang anyong Hebreo bilang magalang na tawag; ginamitan dito ng malaking titik dahil ipinakikilala ng kalapit na konteksto ang kausap ni Abraham bilang ang PANGINOON.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: Sumagot ... at sinabi
  rationale: Pinananatili ang dalawang pandiwang Hebreo at ang pormal na daloy ng pag-uusap, kahit bahagyang paulit-ulit ito sa natural na Tagalog.
- source_word: הִנֵּה נָא
  choice: Narito po
  rationale: Ang “narito” ay tumatawag ng pansin, samantalang ang “po” ay likas na naghahatid sa Tagalog ng magalang at mapagpakumbabang pakiusap na ipinahihiwatig ng נָא.
- source_word: הוֹאַלְתִּי
  choice: nangahas akong
  rationale: Ipinahihiwatig ng pandiwa na pinangahasan o ipinasya ni Abraham na gawin ang isang bagay sa kabila ng kanyang mababang kalagayan; pinananatili ng “nangahas” ang magkasabay na katapangan at pagpapakumbaba.
- source_word: לְדַבֵּר
  choice: magsalita
  rationale: Tuwirang katumbas ito ng infinitibong “magsalita” at natural sa konteksto.
- source_word: אֶל אֲדֹנָי
  choice: sa aking Panginoon[a]
  rationale: Pinananatili ang hulaping nangangahulugang “aking.” Ginamit ang malaking titik dahil sa konteksto ay ang kausap ni Abraham ay ang banal na panauhing iniuugnay sa PANGINOON, habang inilalahad sa talababa ang tunay na posibleng alternatibo.
- source_word: וְאָנֹכִי
  choice: gayong ako'y
  rationale: 'Bagaman literal na “at ako,” malinaw na pasalungat o concessive ang ugnayan: inihahambing ni Abraham ang kanyang pangahas na pagsasalita sa kanyang kababaan.'
- source_word: עָפָר וָאֵפֶר
  choice: alabok at abo
  rationale: Pinananatili ang matalinghagang pahayag ng pagiging mortal at hamak nang hindi dinaragdagan o ipinapaliwanag sa mismong talata.
theological_decisions:
- issue: Pagpapakahulugan sa אֲדֹנָי sa pakikipag-usap ni Abraham
  choice: aking Panginoon
  alternative: aking panginoon
  rationale: Maaaring maging magalang na tawag sa isang taong nakatataas ang anyong Hebreo, ngunit ipinakikilala ng kalapit na konteksto ang kausap bilang banal na panauhing kaugnay ng PANGINOON. Ipinakikita ng malaking titik ang kontekstuwal na pagkakakilanlang iyon nang hindi pinapalitan ang salitang nasa Hebreo ng pangalan ng Diyos; pinananatili ng talababa ang lehitimong ambiguwidad.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “po” upang likas na maipahayag ang magalang na pakiusap, at pinanatili ang Hebreong pag-uulit na “sumagot ... at sinabi” pati ang matalinghagang “alabok at abo.”
