  to: Sinabi pa niya, “Huwag po sanang magalit ang aking Panginoon[a]; magsasalita pa ako. Baka may matagpuang tatlumpu roon.” At sinabi niya, “Hindi ko iyon gagawin kung makasumpong ako roon ng tatlumpu.”
