base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/030.yaml
  text: Then he said[a], “Please, let not my Lord be angry, and I will speak. Perhaps thirty will be found there.” And he said, “I will not do it if I find thirty there.”
translation:
  language: tl
  text: Sinabi pa niya, “Huwag po sanang magalit ang aking Panginoon[a]; magsasalita pa ako. Baka may matagpuang tatlumpu roon.” At sinabi niya, “Hindi ko iyon gagawin kung makasumpong ako roon ng tatlumpu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking panginoon.” Ang titulong Hebreo ay maaari ring unawain bilang magalang na tawag sa isang nakatataas; dito ay ginamitan ng malaking titik dahil sa konteksto, inuunawang ang Panginoon ang kausap.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: Huwag po sanang magalit
  rationale: Pinagsasama nito ang magalang na pakiusap ng נָא, ang pagbabawal ng אַל, at ang idyomatikong diwa ng חרה bilang pagkagalit. Likas sa modernong Tagalog ang “huwag po sanang” para sa mapagpakumbabang pakiusap.
- source_word: לַאדֹנָי
  choice: ang aking Panginoon
  rationale: Pinananatili ang titulong may panlaping unang panauhan (“aking”) at ang mapitagang pagtukoy sa kausap. Ginamit ang malaking titik dahil sa konteksto ay ang Diyos ang kinakausap, ngunit hindi ito pinalitan ng pangalang tipan na wala sa Hebreo.
- source_word: וַאֲדַבֵּרָה
  choice: magsasalita pa ako
  rationale: Ang cohortative ay nagpapahayag ng magalang na hangaring magpatuloy sa pagsasalita. Ipinahihiwatig ng “pa” ang pagpapatuloy na malinaw sa daloy ng pakikipag-usap.
- source_word: אוּלַי
  choice: Baka
  rationale: Karaniwan at magalang na Tagalog ito para sa tentatibong posibilidad na ipinahahayag ng אוּלַי.
- source_word: יִמָּצְאוּן
  choice: may matagpuan
  rationale: Pinananatili ng “matagpuan” ang pasibong diwa ng Niphal, samantalang natural sa Tagalog ang konstruksiyong “may matagpuang tatlumpu.”
- source_word: שָׁם
  choice: roon
  rationale: Tuwirang lokatibong katumbas na angkop sa lugar na hindi kinaroroonan ng nagsasalita.
- source_word: שְׁלֹשִׁים
  choice: tatlumpu
  rationale: Tuwirang salin ng kardinal na bilang; nananatiling hindi binabanggit ang pangngalang tumutukoy sa mga tao gaya ng sa Hebreo.
- source_word: לֹא אֶעֱשֶׂה
  choice: Hindi ko iyon gagawin
  rationale: Ang layon ay ipinahihiwatig lamang sa Hebreo at tumutukoy sa nakatakdang pagwasak. Ang “iyon” ay likas sa Tagalog nang hindi tahasang dinaragdagan ang salin ng “wawasakin.”
- source_word: אִם אֶמְצָא
  choice: kung makakita ako
  rationale: Malinaw at natural na kondisyonal na pahayag sa Tagalog, habang pinananatili ang aktibong unang panauhan ng pandiwa.
theological_decisions:
- issue: Pagpapakahulugan sa אֲדֹנָי sa pakikipag-usap ni Abraham
  choice: aking Panginoon
  alternative: aking panginoon
  rationale: Sa konteksto ng pagpapakita ng Diyos, ang kausap ay inuunawang ang Diyos kaya ginamit ang malaking titik. Gayunman, tunay na maaaring basahin ang anyo bilang pangkalahatang mapitagang titulong “aking panginoon,” kaya inilagay ang alternatibo sa talababa at hindi ipinalit ang pangalang YHWH.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ngunit madaling maunawaan. Ginamit ang “po sana” upang maipakita ang mapagpakumbabang pakiusap ni Abraham, at pinanatili ang maiikling tugon at ang hindi tahasang pagbanggit sa layon ng “gagawin.”
