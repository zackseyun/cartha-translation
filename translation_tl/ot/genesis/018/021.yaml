base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/021.yaml
  text: I will go down now and see whether they have done altogether according to its outcry that has come to me[a]; and if not[b], I will know.
translation:
  language: tl
  text: Bababa ako ngayon at titingnan ko kung ang ginawa nila ay lubos na naaayon sa sigaw na umabot sa akin[a]; at kung hindi, malalaman ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “kung ganap nilang ginawa ayon sa sigaw na umabot sa akin.” Mahirap ang idyomang Hebreo na “ginawa ... ganap”; ipinahihiwatig nito ang pagtatanong kung ang kanilang mga ginawa ay ganap na tumutugma sa sigaw na umabot sa akin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵרֲדָה נָּא
  choice: Bababa ako ngayon
  rationale: Pinananatili ng hinaharap na anyo ang pagpapasya o layunin ng cohortative, at ipinahahayag ng “ngayon” ang puwersa ng נָא sa kontekstong ito.
- source_word: וְאֶרְאֶה
  choice: at titingnan ko
  rationale: Likas sa Filipino at pinananatili ang larawang Hebreo ng pagtingin upang tiyakin ang tunay na kalagayan.
- source_word: הַכְּצַעֲקָתָהּ
  choice: ang ayon sa sigaw
  rationale: Ang צעקה ay sigaw na dulot ng matinding kasamaan o kawalang-katarungan. Iniiwasang gawing tahasang “sigaw laban dito” sapagkat hindi iyon hayag sa hulapi.
- source_word: הַבָּאָה אֵלַי
  choice: na umabot sa akin
  rationale: Natural na Filipino para sa participial na pariralang nagsasabing ang sigaw ay dumating sa Diyos.
- source_word: עָשׂוּ כָּלָה
  choice: lubos nga nilang ginawa
  rationale: Ipinahahayag ang mahirap na idyomang Hebreo bilang lubos na pagtutugma ng kanilang ginawa sa iniulat ng sigaw, habang pinananatili sa talababa ang posibleng pagbasa.
- source_word: וְאִם לֹא אֵדָעָה
  choice: at kung hindi, malalaman ko
  rationale: Malapit sa payak na kondisyon at cohortative ng Hebreo, nang hindi ginagawang paliwanag ang “aalamin ko.”
theological_decisions:
- issue: Antropomorpikong pagsisiyasat ng Diyos
  choice: Panatilihin ang “bababa,” “titingnan,” at “malalaman.”
  alternative: Isalin bilang “susuriin ko” o ipaliwanag bilang kaalamang taglay na ng Diyos.
  rationale: Inilalarawan ng Hebreo ang Diyos sa paraang pantao sa loob ng salaysay. Hindi dapat alisin ng salin ang tunay na tensiyong teolohikal sa pamamagitan ng pagpapaliwanag dito.
- issue: Hindi tiyak na pagkakabuo ng kondisyong עָשׂוּ כָּלָה
  choice: Unawain bilang pagtatanong kung lubos na tumutugma ang kanilang ginawa sa sigaw.
  alternative: 'Iugnay ang כָּלָה sa kasunod na sugnay: “kung ginawa nila—ganap na paglipol; at kung hindi…”'
  rationale: Ang napiling pagbasa ang mas karaniwang pag-unawa sa sintaks at konteksto, ngunit tunay na mahirap ang Hebreo kaya itinatala ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang antropomorpikong wika at ang bahagyang tensiyon ng mahirap na kondisyong Hebreo; gumamit ng “sigaw” sa halip na mas interpretatibong “reklamo” o “daing laban sa kanila.”
