  source_fidelity: Ang pangunahing diwa—pagbaba, pagtingin upang tiyakin, ang sigaw na umabot sa Diyos, at ang kondisyong “kung hindi”—ay napanatili. Gayunman, ang “kung lubos nga nilang ginawa ang ayon sa sigaw” ay hindi maayos na Filipino at hindi malinaw na naipapakita ang ugnayan ng ginawa nila sa sigaw. Ang “kung ang ginawa nila ay lubos na naaayon sa sigaw” ay mas tumpak at malinaw, habang pinananatili ang mahirap na Hebreong idyoma.
  naturalness: Ang binagong pangungusap ay natural na modernong Filipino at nananatiling marangal ang rehistro. Mas malinaw ang pangungusap nang hindi isinasalin ang “sigaw” bilang mas interpretatibong “reklamo” o “daing laban sa lungsod.”
