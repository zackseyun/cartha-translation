base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/023.yaml
  text: Then Abraham came near and said[a], “Will you indeed sweep away the righteous with the wicked?”
translation:
  language: tl
  text: Pagkatapos ay lumapit si Abraham at sinabi, “Tatangayin[a] mo ba talaga ang matuwid kasama ng masama?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lilipulin” o “uubusin”; ipinahihiwatig ng pandiwang Hebreo ang pag-aalis bilang paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: lumapit
  rationale: Karaniwang kahulugan ng נגשׁ ang paglapit. Pinananatili ng “lumapit” ang pisikal at retorikal na pagkilos ni Abraham habang naghahain siya ng pakiusap.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Karaniwang anyo ng pangalang ito sa makabagong saling Filipino.
- source_word: וַיֹּאמַר
  choice: sinabi
  rationale: Likas na salin ng karaniwang pandiwang pasalaysay na אמר sa kontekstong ito.
- source_word: הַאַף
  choice: ba talaga
  rationale: Ang pinagsamang panandang pananong at אַף ay nagbibigay-diin sa tanong. Likas na naipahahayag sa Filipino ng “ba talaga” ang matinding pagtataka at pakiusap ni Abraham.
- source_word: תִּסְפֶּה
  choice: tatangayin
  rationale: Ang ספה ay tumutukoy sa pag-aalis o paglipol sa paghatol. Pinananatili ng “tatangayin” ang matingkad na larawan ng sabay na pag-aalis nang hindi nililimitahan ang kahulugan sa isang tiyak na paraan ng pagwasak.
- source_word: צַדִּיק
  choice: ang matuwid
  rationale: Bagaman isahan ang anyo sa Hebreo, ginagamit ito bilang pangkalahatang katawagan sa isang uri ng tao. Ang “ang matuwid” ay natural at pinananatili ang moral na kategorya.
- source_word: עִם
  choice: kasama ng
  rationale: Tuwirang ipinahahayag nito ang magkasamang sasapiting kapalaran sa paghatol.
- source_word: רָשָׁע
  choice: ang masama
  rationale: Tulad ng צַדִּיק, isahan ang anyo ngunit pangkalahatan ang gamit. Ang “ang masama” ay malinaw na katapat ng “ang matuwid.”
theological_decisions:
- issue: Pangkalahatang gamit ng mga isahang katawagang moral
  choice: Isinalin ang צַדִּיק at רָשָׁע bilang “ang matuwid” at “ang masama,” na kapuwa maaaring tumukoy sa isang pangkalahatang uri ng tao.
  alternative: “ang taong matuwid” at “ang taong masama,” o tahasang maramihang “mga matuwid” at “mga masama”
  rationale: Isahan ang mga anyong Hebreo ngunit kumakatawan ang mga ito sa pangkalahatang mga kategorya sa usapin ng banal na katarungan. Pinananatili ng salin ang kinatawang puwersa at hindi ito tahasang ginagawang maramihan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pagkatapos ay” para sa daloy ng salaysay at ang likas na ayos na “ba talaga” upang maipahayag ang mariing tanong. Ang “tatangayin” ay nagpapanatili ng matingkad na larawan ng Hebreo, habang nililinaw ng talababa ang iba pang posibleng salin.
