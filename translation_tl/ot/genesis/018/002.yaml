base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/002.yaml
  text: He lifted up his eyes and looked[a], and behold, three men were standing near him. When he saw them[b], he ran from the entrance of the tent to meet them and bowed down to the ground.
translation:
  language: tl
  text: Tumingala siya at nakita niyang naroon ang tatlong lalaking nakatayo malapit sa kanya.[a] Nang makita niya sila, tumakbo siya mula sa pasukan ng tolda upang salubungin sila, at yumukod hanggang sa lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakatayo sa tabi niya.” Ang pang-ukol sa Hebreo ay maaaring tumukoy sa napakalapit na kinaroroonan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagpatirapa sa lupa.” Ang pandiwa ay naglalarawan ng malalim na paggalang, ngunit hindi nito sa ganang sarili ipinapakahulugang “sumamba.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: Tumingala siya at nakita
  rationale: Natural sa makabagong Tagalog ang “tumingala” bilang katumbas ng idyomang Hebreo na literal na “itinaas niya ang kanyang mga mata.” Pinananatili ng “nakita” ang kasunod na pandiwa ng pagtingin nang hindi nagiging pilit ang pangungusap.
- source_word: וְהִנֵּה
  choice: naroon
  rationale: Ipinahihiwatig nito ang bigla at matingkad na pagpapakita sa salaysay, habang mas natural sa karaniwang Tagalog kaysa sa literal na “masdan.”
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: tatlong lalaki
  rationale: Tuwirang inilalarawan ng Hebreo ang tatlong tauhan bilang mga lalaki; hindi ito ginawang mas neutral o mas tahasang sobrenatural.
- source_word: נִצָּבִים עָלָיו
  choice: nakatayo malapit sa kanya
  rationale: Maaaring magpahiwatig ang pang-ukol ng malapit na kinaroroonan. Iniiwasan ng saling ito ang posibleng maling larawan na nakatayo sila sa ibabaw niya.
- source_word: וַיָּרָץ לִקְרָאתָם
  choice: tumakbo siya ... upang salubungin sila
  rationale: Pinananatili ng “tumakbo” ang tiyak at masiglang kilos ng pandiwang Hebreo; natural namang ipinapahayag ng “salubungin” ang pagpunta upang harapin ang mga dumarating.
- source_word: מִפֶּתַח הָאֹהֶל
  choice: mula sa pasukan ng tolda
  rationale: Ang “pasukan” ay malinaw at likas na katumbas ng bukana o pintuan ng tolda.
- source_word: וַיִּשְׁתַּחוּ אָרְצָה
  choice: yumukod hanggang sa lupa
  rationale: Inilalarawan nito ang malalim na pisikal na pagyukod nang hindi agad nagpapakahulugang pagsamba ang kilos.
theological_decisions:
- issue: Kung ang pagyukod ni Abraham ay dapat tahasang tawaging pagsamba
  choice: yumukod hanggang sa lupa
  alternative: sumamba; nagpatirapa sa lupa
  rationale: Ang pandiwang Hebreo ay maaaring tumukoy sa pagyukod o pagpapatirapa bilang paggalang sa tao o sa Diyos. Dahil “tatlong lalaki” pa ang tahasang paglalarawan sa talatang ito, hindi dapat paunang lutasin ng salin kung ang kilos ay pagsamba.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Isinalin nang natural ang idyomang Hebreo sa “Tumingala,” pinanatili ang masiglang takbo ng salaysay, at iniwasang magpasok ng tiyak na teolohikal na pagpapakahulugan sa pagyukod.
