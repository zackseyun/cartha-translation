  source_fidelity: 'Tapat ang salin sa pangunahing mga kilos at detalye ng Hebreo: pagtingala/pagkakita, ang biglaang pagpapakita ng tatlong lalaki, ang kanilang malapit na kinaroroonan, pagtakbo mula sa pasukan ng tolda upang salubungin sila, at malalim na pagyukod hanggang sa lupa. Ang “naroon” ay isang likas na Tagalog na paraan upang ipahiwatig ang waw-hinneh nang hindi nagiging artipisyal.'
  naturalness: Malinaw, makabago, at marangal ang daloy. Natural ang “Tumingala siya,” “Nang makita niya sila,” at “tumakbo siya ... upang salubungin sila.” Ang “yumukod hanggang sa lupa” ay nauunawaan bilang malalim na pagyukod at angkop sa salaysay.
  terminology: Tama at pare-pareho ang “tatlong lalaki,” “tolda,” at “yumukod.” Hindi ipinapasok ng salin ang interpretasyong “sumamba,” kaya napananatili ang hindi pa nilulutas na saklaw ng pandiwang Hebreo. Ang mga talababa ay wasto ang pagkakaangkla at nagbibigay ng kapaki-pakinabang na mga alternatibo.
