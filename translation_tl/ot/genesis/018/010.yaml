revisions:
- from: At sinabi niya, “Tiyak na babalik ako sa iyo sa ganito ring panahon sa susunod na taon,[a] at narito, magkakaroon ng anak na lalaki si Sara na iyong asawa.” Nakikinig noon si Sara sa pasukan ng tolda na nasa likuran niya.[b]
  to: At sinabi niya, “Tiyak na babalik ako sa iyo sa ganito ring panahon sa susunod na taon,[a] at narito, magkakaroon ng isang anak na lalaki si Sara, na iyong asawa.” Nakikinig noon si Sara sa pasukan ng tolda, na nasa likuran ng nagsasalita.[b]
  rationale: Inayos ang pangwakas na sugnay upang hindi awtomatikong maiugnay ang “niya” kay Sara sa Tagalog. Ang talababa ay nananatiling nagsasaad na ang Hebreong panghalip ay maigsi at may kalabuan, kaya hindi ipinipilit ang isang ganap na tiyak na pagbasa. Nagdagdag din ng kuwit upang luminaw ang paglalarawan kay Sara bilang asawa ng kausap.
