base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/010.yaml
  text: And he said[a], “I will surely return to you about this time next year, and behold[c][b], Sarah your wife will have a son.” And Sarah was listening at the entrance of the tent behind him.
translation:
  language: tl
  text: At sinabi niya, “Tiyak na babalik ako sa iyo sa ganito ring panahon sa susunod na taon,[a] at narito, magkakaroon ng isang anak na lalaki si Sara, na iyong asawa.” Nakikinig noon si Sara sa pasukan ng tolda, na nasa likuran ng nagsasalita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa panahon ng buhay”; isang idyomang tumutukoy sa ganito ring panahon sa susunod na taon.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “at iyon/siya ay nasa likuran niya.” Maigsi at hindi ganap na tiyak ang pagtukoy ng mga panghalip sa Hebreo. Malamang na ang pasukan ng tolda ang tinutukoy na nasa likuran ng nagsasalita.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili ang karaniwang daloy ng salaysay sa Hebreo at ang di-tiyak na pagkakakilanlan ng nagsasalita sa mismong talata.
- source_word: שׁוֹב אָשׁוּב
  choice: Tiyak na babalik ako
  rationale: Ang infinitive absolute na kasunod ng pandiwa mula sa parehong ugat ay nagbibigay-diin at katiyakan sa pagbabalik.
- source_word: כָּעֵת חַיָּה
  choice: sa ganito ring panahon sa susunod na taon
  rationale: Idyomatikong tumutukoy sa pagbalik ng gayunding kapanahunan sa susunod na taon; natural ito sa modernong Tagalog nang hindi literal na ginagawang 'panahon ng buhay.'
- source_word: וְהִנֵּה
  choice: at narito
  rationale: Pinananatili ang pantawag-pansing bisa ng Hebreong kataga at ang maringal na tono ng pangako.
- source_word: בֵן לְשָׂרָה אִשְׁתֶּךָ
  choice: magkakaroon ng anak na lalaki si Sara na iyong asawa
  rationale: Likas na ipinapahayag sa Tagalog ang pag-iral o pagkakaroon na tinutukoy ng pariralang may לְ, habang malinaw na anak na lalaki ang ipinangako.
- source_word: שָׂרָה שֹׁמַעַת
  choice: Nakikinig noon si Sara
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na kilos sa tagpo; nililinaw ng 'noon' ang kasabay na pangyayari.
- source_word: פֶּתַח הָאֹהֶל
  choice: sa pasukan ng tolda
  rationale: Tuwiran, natural, at malinaw na katumbas ng construct phrase na tumutukoy sa kinaroroonan ni Sara.
- source_word: וְהוּא אַחֲרָיו
  choice: na nasa likuran niya
  rationale: Isinasama sa naunang parirala upang maging natural sa Tagalog, habang ang talababa ay nagpapanatili sa kaiklian at kalabuan ng mga panghalip sa Hebreo.
theological_decisions:
- issue: Pagkakakilanlan ng nagsasalita
  choice: Gumamit lamang ng “niya” at hindi pinangalanan ang nagsasalita.
  alternative: “Sinabi ng PANGINOON” o “sinabi ng isa sa mga lalaki”
  rationale: Pandiwang nasa ikatlong panauhang panlalaki lamang ang nasa talatang Hebreo; ang pagdaragdag ng tiyak na pangalan ay magpapasya sa isang usaping ipinauubaya rito sa konteksto.
- issue: Tinutukoy ng panghalip sa huling sugnay
  choice: Inugnay ang “nasa likuran niya” sa pasukan ng tolda.
  alternative: Unawaing isang lalaki o si Sara ang nasa likuran ng nagsasalita.
  rationale: Ang panlalaking panghalip na הוּא ay maayos na makauugnay sa panlalaking pangngalang פֶּתַח (“pasukan”), ngunit maigsi ang Hebreo at may posibleng kalabuan kaya ipinaliwanag ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tolda” at “pasukan” bilang karaniwang salitang madaling maunawaan; pinanatili ang “narito” upang maipahayag ang pantawag-pansing diin ng וְהִנֵּה nang hindi nagiging labis na kolokyal.
