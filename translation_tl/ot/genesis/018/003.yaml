  yaml_path: translation/ot/genesis/018/003.yaml
  text: And he said[a], “My lord, if I have found favor in your eyes, please do not pass by your servant.”
translation:
  language: tl
  text: At sinabi niya[a], “panginoon ko, kung nakasumpong ako ng lingap sa iyong paningin, huwag mo sanang lampasan ang iyong lingkod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Panginoon,” kung ang sinabi ni Abraham ay tuwirang para sa Diyos at hindi lamang isang magalang na pagtawag sa panauhin.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: At sinabi niya
  rationale: Pinananatili nito ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi labis na binibigyang-diin ang pagkakasunod-sunod.
- source_word: אֲדֹנָי
  choice: Panginoon ko
  rationale: Magalang na tuwirang tawag ito sa isang nakatataas. Hindi matitiyak sa mismong talata kung karaniwang pamimitagan sa panauhin o tahasang pagtawag sa Diyos ang ibig sabihin, kaya pinananatili sa talababa ang alternatibo.
- source_word: אִם נָא
  choice: kung
  rationale: Ipinakikilala nito ang magalang na pormula ng pakiusap; ang diwa ng נָא ay likas na naipahahayag sa kasunod na “nakikiusap ako” upang maiwasan ang alanganing pag-uulit.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: nakasumpong ako ng lingap sa iyong paningin
  rationale: Pinananatili ang Hebreong larawang tumutukoy sa pagtanggap ng mabuting pagtingin, habang nananatiling malinaw at marangal sa makabagong Tagalog.
- source_word: אַל נָא
  choice: nakikiusap akong huwag mong
  rationale: Likas na Tagalog para sa magalang ngunit mariing pagbabawal o pakiusap.
- source_word: תַעֲבֹר מֵעַל
  choice: lampasan
  rationale: Maikli at likas na katumbas ng pagpapatuloy ng paglalakbay nang dumaraan sa kinaroroonan ng isang tao.
- source_word: עַבְדֶּךָ
  choice: iyong lingkod
  rationale: Ang salita ay maaaring tumukoy sa alipin o lingkod, ngunit dito ay isang magalang na pagtukoy ni Abraham sa sarili sa harap ng marangal na panauhin; “lingkod” ang mas angkop sa konteksto.
theological_decisions:
- issue: Kung ang אֲדֹנָי ay banal na titulong “Panginoon” o magalang na tawag na “panginoon ko”
  choice: Panginoon ko
  alternative: Panginoon
  rationale: Ipinakikita ng mas malawak na konteksto na nagpakita ang PANGINOON kay Abraham, ngunit sa agarang tagpo ay may isang panauhing kinakausap sa isahan. Pinananatili ng pangunahing salin at talababa ang tunay na pag-aalinlangan sa pagtukoy sa kausap sa halip na agad itong lutasin.
translation_notes:
  register: Makabago ngunit marangal na Filipino Tagalog. Ginamit ang “lingap,” “sa iyong paningin,” at “iyong lingkod” upang mapanatili ang magalang at mataas na himig ng pakiusap nang hindi nagiging lipas o labis na pormal.
