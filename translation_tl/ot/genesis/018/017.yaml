  yaml_path: translation/ot/genesis/018/017.yaml
  text: And Yahweh said[a], “Shall I hide from Abraham what I am doing?”
translation:
  language: tl
  text: At sinabi ni Yahweh[a], “Ililihim ko ba kay Abraham ang gagawin ko?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “Inililihim ko ba kay Abraham ang ginagawa ko?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַֽ/יהֹוָה
  choice: At sinabi ni Yahweh
  rationale: Ang wayyiqtol na אָמַר ay nagpapatuloy sa salaysay, kaya natural ang “At sinabi”; pinanatili bilang “Yahweh” ang pangalang tipan na יְהוָה.
- source_word: הַֽ/מְכַסֶּה אֲנִי
  choice: Ililihim ko ba
  rationale: Ang tanong na may participle ay isang retorikal na pag-uusisa o deliberasyon. Likas sa Tagalog ang anyong panghinaharap na “Ililihim ko ba” upang ipahayag ang diwang “Shall I hide,” samantalang ang mas literal na aspektong nagpapatuloy ay inilagay sa talababa.
- source_word: מֵֽ/אַבְרָהָם
  choice: kay Abraham
  rationale: Sa Tagalog, ang bagay na hindi ipinaaalam sa isang tao ay natural na “inililihim kay” sa halip na literal na “mula kay.”
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה
  choice: ang gagawin ko
  rationale: Bagaman participle ang עֹשֶׂה at maaaring literal na “ginagawa ko,” tumutukoy sa konteksto ang kilos sa napipintong gagawin ni Yahweh. Ang “gagawin ko” ay natural at hindi nagdaragdag ng tahasang “malapit na,” habang pinananatili sa talababa ang pormal na alternatibo.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang Tetragrammaton sa Hebreo. Ang “Yahweh” ay direktang transliterasyon na nagpapanatili sa pagkakakilanlan nito bilang pangalan sa halip na palitan ito ng titulo.
- issue: Aspekto at panahon ng אֲנִי עֹשֶׂה
  choice: ang gagawin ko
  alternative: ang ginagawa ko
  rationale: May tunay na tensiyon sa pagitan ng anyong participle at ng kontekstuwal na pagtukoy sa nalalapit na kilos. Pinili sa teksto ang natural na prospektibong Tagalog, ngunit hindi itinago ang mas literal na pagbasa at inilagay ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ilihim kay” bilang likas na pariralang Tagalog at iniwasan ang mas mabigat na “itatago ko ba mula kay Abraham.”
