  terminology: Wasto ang “mga lalaki,” “Sodoma,” at “Yahweh.” Ang “Masoretikong Tekstong Hebreo” ay mas natural na katawagan sa Tagalog kaysa sa pinaghalong anyong “Masoretic Text na Hebreo.”
