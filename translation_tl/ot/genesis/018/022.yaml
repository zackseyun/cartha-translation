  yaml_path: translation/ot/genesis/018/022.yaml
  text: Then the men turned from there and went toward Sodom[a], but Abraham still stood before Yahweh.
translation:
  language: tl
  text: Pagkatapos, umalis mula roon ang mga lalaki at nagtungo patungong Sodoma, ngunit nanatiling nakatayo si Abraham sa harap ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ganito ang mababasa sa ilang sinaunang saksi: “At nanatiling nakatayo si Yahweh sa harap ni Abraham.” Sa Masoretikong Tekstong Hebreo ay mababasa: “At nanatiling nakatayo si Abraham sa harap ni Yahweh.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: tumalikod
  rationale: Ipinahihiwatig ng pandiwa ang pagbaling at pag-alis mula sa kinaroroonan; natural sa salaysay ang “tumalikod.”
- source_word: מִשָּׁם
  choice: mula roon
  rationale: Tuwirang katumbas ng pariralang panlunan at likas sa modernong Tagalog.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaki
  rationale: Pinananatili ang payak na katawagan ng tekstong Hebreo nang hindi ipinapasok sa pangunahing teksto ang pagkakakilanlan nila mula sa mas malawak na konteksto.
- source_word: וַיֵּלְכוּ
  choice: nagpunta
  rationale: Karaniwang pandiwa ito para sa pagpunta; malinaw at natural sa salaysay.
- source_word: סְדֹמָה
  choice: patungong Sodoma
  rationale: Inilalarawan ng directional he ang kilos sa direksiyon ng Sodoma; naipapakita ito ng “patungong.”
- source_word: עוֹדֶנּוּ עֹמֵד
  choice: nakatayo pa rin
  rationale: Pinagsasama nito ang nagpapatuloy na kalagayan ng participle at ang diwa ng pagpapatuloy sa עוֹדֶנּוּ.
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Pinananatili ang espasyal at relasyonal na diwa ng pagiging nasa harapan o presensiya ng isang persona.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalan sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang banal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Anyo ng huling sugnay
  choice: si Abraham ay nakatayo pa rin sa harap ni Yahweh
  alternative: si Yahweh ay nakatayo pa rin sa harap ni Abraham
  rationale: Sinusunod ng pangunahing teksto ang ibinigay na Masoretic Text, habang inilalahad sa talababa ang sinaunang tekstuwal at eskribal na alternatibo nang hindi nilulutas nang palihim ang pagkakaiba.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Sodoma,” ang nakaugaliang anyong Filipino ng pangalan. Inilagay ang pananda ng talababa pagkatapos ng unang pangungusap upang sundan ang ibinigay na lokasyon, bagaman ang variant ay tumutukoy sa kasunod na sugnay.
