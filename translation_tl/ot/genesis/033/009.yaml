  text: But Esau said[a], “I have plenty, my brother; let what is yours be yours.”
translation:
  language: tl
  text: Ngunit sinabi ni Esau[a], “Marami akong taglay, kapatid ko; sa iyo na ang sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At sinabi ni Esau, ‘Sapat ang taglay ko, kapatid ko; sa iyo ang pag-aari mo.’”
    reason: Ipinapakita ang maaaring salin ng pang-ugnay bilang “At,” ng רָב ayon sa kontekstuwal na diwang “sapat,” at ng huling parirala sa mas tahasang pananalita.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit sa konteksto ay marahang tinatanggihan ni Esau ang handog ni Jacob; kaya likas sa Filipino ang “Ngunit sinabi” upang ipakita ang banayad na pagsalungat.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Ginamit ang karaniwang anyo ng pangalan sa modernong saling Filipino.
- source_word: יֶשׁ לִי רָב
  choice: Marami na ang nasa akin
  rationale: Ang idyomang Hebreo ay nagpapahayag ng pag-aari at kasaganaan. Inihahatid ng “Marami na ang nasa akin” ang diwang sagana ang taglay ni Esau, hindi lamang na sapat ito.
- source_word: אָחִי
  choice: kapatid ko
  rationale: Pinananatili nito ang tuwirang pagtawag at ang init ng ugnayang ipinahihiwatig ng hulaping unang panauhan.
- source_word: יְהִי לְךָ אֲשֶׁר לָךְ
  choice: Manatili na sa iyo ang sa iyo
  rationale: 'Ang jussive ay isang magalang na pagpapahintulot o pagtanggi: sinasabi ni Esau kay Jacob na ingatan ang sarili nitong mga pag-aari. Ang “manatili na sa iyo” ay natural sa konteksto ng isang handog na tinatanggihan.'
