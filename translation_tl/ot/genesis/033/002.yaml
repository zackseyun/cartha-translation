lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Inilagay niya
  rationale: Ang שׂוּם ay karaniwang nangangahulugang maglagay o magpuwesto; natural at tuwiran dito ang “inilagay niya.”
- source_word: הַשְּׁפָחוֹת
  choice: ang mga alilang babae
  rationale: Ang שִׁפְחָה ay tumutukoy sa babaeng katulong o alipin sa sambahayan. Pinananatili ng “alilang babae” ang mababang katayuang ipinahihiwatig ng salitang Hebreo nang hindi ito binibigyang-kahulugang “kalaguyo.”
- source_word: יַלְדֵיהֶן
  choice: ang kanilang mga anak
  rationale: Malawak ang saklaw ng יֶלֶד at hindi lamang mga anak na lalaki ang tinutukoy.
- source_word: רִאשֹׁנָה
  choice: sa unahan
  rationale: Bagaman maaaring isaling “una,” inilalarawan dito ang puwesto ng unang pangkat; malinaw at natural ang “sa unahan.”
- source_word: לֵאָה
  choice: Lea
  rationale: Ginamit ang karaniwang anyo ng pangalan sa modernong saling Tagalog.
- source_word: וִילָדֶיהָ
  choice: at ang kanyang mga anak
  rationale: Pinananatili ang malawak na kahulugan ng יֶלֶד at ang pang-ugnay ng Hebreo.
- source_word: אַחֲרֹנִים (unang gamit)
  choice: sa likuran nila
  rationale: Sa ikalawa sa tatlong pangkat, ipinahihiwatig nito ang puwestong kasunod ng unang pangkat, hindi ang pinakahuli.
- source_word: רָחֵל
  choice: Raquel
  rationale: Ginamit ang karaniwang anyo ng pangalan sa Tagalog.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginamit ang nakaugaliang biblikal na anyo ng pangalan sa Tagalog.
- source_word: אַחֲרֹנִים (ikalawang gamit)
  choice: sa pinakahuli
  rationale: Para sa huling pangkat, malinaw nitong ipinapahayag ang dulo ng pagkakaayos.
