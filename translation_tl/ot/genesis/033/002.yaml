    text: O “mga babaeng tagapaglingkod”; ang salitang Hebreo ay maaaring tumukoy sa mga babaeng tagapaglingkod na mababa ang katayuan sa sambahayan, at sa ilang konteksto ay maaari ring mangahulugang “mga babaeng alipin.”
