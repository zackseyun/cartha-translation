  source_fidelity: Ang draft ay wastong kumakatawan sa deferential na "aking panginoon," sa kahinaan ng mga bata, sa mga hayop na may pasusuhing anak na nasa pananagutan ni Jacob, at sa bunga ng labis na pagpapabilis sa mga hayop. Gayunman, ang "rin" ay walang katapat na karagdagang ideya sa Hebreo, at ang kasalukuyang paghahati sa dalawang pangungusap ay bahagyang nagpapalabo sa iisang masalimuot na pariralang עָלוֹת עָלָי.
  naturalness: Nauunawaan ang draft, ngunit mas tuwiran at likas ang "Ang mga bata ay maselan, at nasa pangangalaga ko ang mga kawan at baka na may pasusuhing anak." Ang "pagmamadaliin" ay mas idiomatiko sa modernong Tagalog kaysa "itinaboy nang puspusan" para sa labis na pagpapatakbo o pagpapabilis sa mga hayop.
  terminology: Ang "aking panginoon" ay angkop na magalang na pantawag kay Esau at hindi banal na titulo. Ang "mga kawan at baka" ay pinananatili ang pagkakaiba ng maliliit na hayop at baka. Ang "pasusuhing anak" ay angkop para sa mga supling na sumususo pa.
