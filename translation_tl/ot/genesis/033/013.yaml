revisions:
- from: Ngunit sinabi niya sa kanya, “Alam ng panginoon ko na mahihina pa ang mga bata. Inaalagaan ko rin ang mga kawan at bakang nagpapasuso pa sa kanilang mga anak.[a] Kapag itinaboy sila nang puspusan kahit isang araw lamang, mamamatay ang buong kawan.”
  to: Ngunit sinabi niya sa kanya, “Alam ng aking panginoon na maselan ang mga bata, at nasa pangangalaga ko ang mga kawan at baka na may pasusuhing anak.[a] Kung pagmamadaliin sila nang labis kahit isang araw, mamamatay ang buong kawan.”
  rationale: Inalis ang di-sinusuportahang "rin," pinagsama ang dalawang aspekto ng idyomang Hebreo sa isang malinaw na Tagalog na pangungusap, at ginawang mas natural ang paglalarawan sa labis na pagpapabilis sa mga hayop. Pinananatili ng talababa ang leksikal na kalabuan at ang alternatibong paglalapat nang hindi nagdaragdag ng pagpapakahulugang doktrinal.
