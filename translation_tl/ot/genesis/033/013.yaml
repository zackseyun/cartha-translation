base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/013.yaml
  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanya, “Alam ng aking panginoon na maselan ang mga bata, at nasa pangangalaga ko ang mga kawan at baka na may pasusuhing anak.[a] Kung pagmamadaliin sila nang labis kahit isang araw, mamamatay ang buong kawan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang mga kawan at baka na nagpapasuso ay nasa pananagutan ko.” Idyomatiko at masalimuot ang pariralang Hebreo; ipinahihiwatig nito kapwa na ang mga hayop ay may mga supling na sumususo pa at na nakaatang kay Jacob ang pangangalaga sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: panginoon ko
  rationale: Isang magalang na pantawag ni Jacob kay Esau bilang nakatataas sa ugnayang panlipunan; hindi ito tumutukoy sa Diyos.
- source_word: הַיְלָדִים רַכִּים
  choice: mahihina pa ang mga bata
  rationale: Ipinahahayag ng רַכִּים ang pagiging maselan at madaling mapagod o mapinsala ng mga bata sa paglalakbay; likas sa modernong Tagalog ang “mahihina pa.”
- source_word: הַצֹּאן וְהַבָּקָר
  choice: mga kawan at baka
  rationale: Ang הַצֹּאן ay kolektibong tawag sa maliliit na alagang hayop, samantalang ang הַבָּקָר ay tumutukoy sa mga baka; pinananatili ng salin ang dalawang kategorya.
- source_word: עָלוֹת עָלָי
  choice: Inaalagaan ko rin ang mga kawan at bakang nagpapasuso pa sa kanilang mga anak
  rationale: Pinagsasama ng masalimuot na parirala ang kalagayan ng mga inahing hayop na may pasusuhing anak at ang pananagutan ni Jacob sa pag-aalaga sa kanila.
- source_word: וּדְפָקוּם
  choice: Kapag itinaboy sila nang puspusan
  rationale: Sa kontekstong ito, nangangahulugan ang pandiwa ng labis o marahas na pagpapatakbo sa mga hayop; pinananatili ng balintiyak na anyo ang di-tiyak na gumagawa.
- source_word: יוֹם אֶחָד
  choice: kahit isang araw lamang
  rationale: Ipinakikita nito na sapat na ang isang buong araw ng labis na pagpapatakbo upang mangyari ang masamang bunga.
- source_word: וָמֵתוּ כָּל־הַצֹּאן
  choice: mamamatay ang buong kawan
  rationale: Pinananatili ang kolektibong pang-isahang larawan ng Hebreo at ang tindi ng babala.
theological_decisions: []
