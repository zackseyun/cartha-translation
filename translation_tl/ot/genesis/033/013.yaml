  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Ang “panginoon ko” ay sadyang nasa maliit na titik upang malinaw na pantawag ito kay Esau at hindi banal na titulo. Inilagay ang talababa sa mismong pariralang may leksikal na kalabuan.
