  - severity: low
    issue: Ang pangunahing salin at talababa ay maaaring mas malinaw na magpanatili sa magkasamang diwa ng pagkapasuso at pananagutan.
    rationale: Ang עָלוֹת עָלָי ay isang siksik at pinagtatalunang idyoma. Mas mabuting ilagay sa pangunahing teksto ang parehong praktikal na diwa at ipaliwanag sa talababa na idyomatiko ang Hebreo, nang hindi inaangking tiyak ang isang mas literal na pagsusuri.
