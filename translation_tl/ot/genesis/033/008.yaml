  text: And he said[a], “What do you mean by all this camp that I met?” And he said[c][b], “To find favor in the eyes of my lord.”
translation:
  language: tl
  text: At sinabi ni Esau, “Para saan ang buong pangkat na ito na nasalubong ko?” Sumagot si Jacob, “Upang kalugdan ako ng panginoon ko.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “upang makasumpong ng lingap sa paningin ng panginoon ko,” isang idyoma na nangangahulugang matamo ang mabuting pagtingin ng isang tao.
    reason: cultural_note
lexical_decisions:
- source_word: מִי לְךָ
  choice: Para saan
  rationale: Sa konteksto, ang idyoma ay nagtatanong sa layunin ng pangkat na ipinadala ni Jacob, hindi sa pagkakakilanlan nito.
- source_word: כָּל הַמַּחֲנֶה הַזֶּה
  choice: ang buong pangkat na ito
  rationale: Bagaman karaniwang nangangahulugang “kampo” ang מַחֲנֶה, dito ay tumutukoy ito sa pangkat o hanay ng mga hayop at tagapaglingkod na pinauna ni Jacob.
- source_word: אֲשֶׁר פָּגָשְׁתִּי
  choice: na nasalubong ko
  rationale: Natural na Tagalog ito para sa pangkat na nakatagpo ni Esau habang naglalakbay.
- source_word: לִמְצֹא חֵן בְּעֵינֵי
  choice: Upang kalugdan ako
  rationale: Ipinahahayag ng parirala ang layuning matamo ang mabuting pagtingin ng kausap; natural nitong naihahatid sa Tagalog ang Hebreong idyoma.
- source_word: אֲדֹנִי
  choice: ng panginoon ko
  rationale: Magalang at mapagpakumbabang tawag ito ni Jacob kay Esau, hindi isang banal na titulo.
