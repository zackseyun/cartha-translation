  source_fidelity: Tumpak na naihahatid ang tanong ni Esau tungkol sa layunin ng buong pangkat na kanyang nasalubong. Ang sagot ni Jacob ay wastong nagpapahayag ng layuning magkamit ng kanais-nais na pagtingin mula kay Esau; ang “panginoon ko” ay naaayon sa mapagpakumbabang anyo ng pagtawag na אֲדֹנִי at hindi ipinapakahulugang banal na titulo.
  naturalness: Malinaw, makabago, at marangal ang Tagalog. Ang “Para saan ang buong pangkat na ito na nasalubong ko?” ay likas na paraan upang ilahad ang layuning tinatanong ng Hebreong idyoma. Ang pagtukoy sa mga nagsasalita bilang Esau at Jacob ay nakatutulong sa kalinawan.
  terminology: Ang “buong pangkat” ay angkop sa מַחֲנֶה sa kontekstong ito, kung saan tumutukoy ito sa pangkat/prosesyong ipinadala ni Jacob, hindi kinakailangang sa isang literal na kampo. Ang “Upang kalugdan ako” ay isang natural na katumbas ng layuning “makasumpong ng lingap,” at wastong nililinaw ng talababa ang literal na Hebreong idyoma.
