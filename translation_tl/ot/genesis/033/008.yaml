translation_notes:
  register: Makabago at dignified na Filipino. Tinukoy ang mga nagsasalita bilang Esau at Jacob upang maging malinaw ang pagpapalitan ng pananalita; ginamit ang “pangkat” sa halip na literal na “kampo” dahil ang tinutukoy ay ang hanay na pinauna ni Jacob.
