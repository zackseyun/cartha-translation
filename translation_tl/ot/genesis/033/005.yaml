revisions:
- from: Tumingala siya at nakita niya ang mga babae at ang mga bata. Sinabi niya, “Sino ang mga kasama mo na ito?[a]” Sumagot siya, “Sila ang mga anak na buong-biyaya ng Diyos na ibinigay sa iyong lingkod.[b]”
  to: Tumingala siya at nakita niya ang mga babae at ang mga bata. Sinabi niya, “Sino ang mga ito na kasama mo?[a]” Sumagot siya, “Ang mga anak na buong kagandahang-loob na ibinigay ng Diyos sa iyong lingkod.[b]”
  rationale: Inayos ang tanong upang maging mas natural sa modernong Tagalog at itinama ang literal na alternatibo sa talababa upang tumugma sa “sino” ng Hebreo. Pinalitan ang di-likas at hindi malinaw ang saklaw na “buong-biyaya” ng “buong kagandahang-loob na ibinigay,” na malinaw na inilalarawan ang mapagbiyayang pagkakaloob ng Diyos.
