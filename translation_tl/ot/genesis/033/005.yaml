base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/005.yaml
  text: He lifted up his eyes and saw the women and the children[a], and he said, “Who are these with you?” And he said[b], “The children whom God has graciously given to your servant.”
translation:
  language: tl
  text: Tumingala siya at nakita niya ang mga babae at ang mga bata. Sinabi niya, “Sino ang mga ito na kasama mo?[a]” Sumagot siya, “Ang mga anak na buong kagandahang-loob na ibinigay ng Diyos sa iyong lingkod.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na pananalita, “Sino ang mga ito para sa iyo?” Ang idyomang Hebreo ay nagtatanong tungkol sa pagkakakilanlan at kaugnayan kay Jacob ng mga taong kasama niya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Ang mga anak na ibinigay ng Diyos sa iyong lingkod.” Taglay ng pandiwang Hebreo ang diwa ng pagpapakita ng pabor o kagandahang-loob.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  choice: Tumingala siya
  rationale: Likas na modernong Tagalog para sa idyomang Hebreo na literal na ‘itinaas niya ang kanyang mga mata,’ na nangangahulugang itinaas niya ang tingin.
- source_word: הַנָּשִׁים
  choice: ang mga babae
  rationale: Pinananatili ang pangkalahatang salitang Hebreo para sa ‘mga babae’ sa halip na gawing mas tiyak na ‘mga asawa.’
- source_word: הַיְלָדִים
  choice: ang mga bata / mga anak
  rationale: Ang unang paglitaw ay tumutukoy sa mga batang nakita ni Esau, samantalang ang ikalawa ay likas na ‘mga anak’ sa sagot ni Jacob; iisa ang reperente ngunit iniangkop ang Tagalog sa sintaks at pananaw ng bawat pangungusap.
- source_word: מִי אֵלֶּה לָּךְ
  choice: Sino ang mga kasama mo na ito?
  rationale: Ipinahahayag ang idyomatikong diwa ng tanong tungkol sa pagkakakilanlan ng mga taong kasama ni Jacob, habang inilalagay sa talababa ang mas literal na ugnayang ‘ano mo sila.’
- source_word: חָנַן
  choice: buong-biyaya ... na ibinigay
  rationale: Pinananatili kapwa ang diwa ng mapagbiyayang pagkakaloob at ang natural na anyo ng sagot sa Tagalog.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang salin para sa nag-iisang banal na reperente rito.
- source_word: עַבְדֶּךָ
  choice: iyong lingkod
  rationale: Ang salita ay magalang na pagtukoy ni Jacob sa sarili sa harap ni Esau; ang ‘lingkod’ ay angkop nang hindi labis na nagpapahiwatig ng katayuang alipin.
theological_decisions:
- issue: Diwa ng banal na kagandahang-loob sa חָנַן
  choice: Inilarawan ang mga anak bilang buong-biyayang kaloob ng Diyos.
  alternative: ‘mga anak na ibinigay ng Diyos sa iyong lingkod’
  rationale: Taglay ng pandiwa ang diwa ng pagpapakita ng pabor o biyaya, kaya pinananatili iyon nang hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang ‘tumingala’ sa halip na ang di-likas na literal na ‘itinaas ang mga mata,’ at pinanatili ang magalang na ‘iyong lingkod’ sa pananalita ni Jacob.
