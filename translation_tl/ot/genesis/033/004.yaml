base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/004.yaml
  text: Esau ran to meet him[a], embraced him, fell on his neck, kissed him, and they wept.
translation:
  language: tl
  text: Tumakbo si Esau upang salubungin siya, niyakap siya, at sumubsob sa kanyang leeg, hinalikan siya[a], at kapwa sila umiyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo na isinaling “hinalikan siya” ay may di-pangkaraniwang mga tuldok sa ibabaw nito sa Tekstong Masoretiko. Itinuturing ito ng ilang tagapagpaliwanag na tanda ng pag-aalinlangan o pagdiriin, ngunit ang payak na kahulugan ng Hebreo rito ay “hinalikan siya.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרָץ
  choice: Tumakbo
  rationale: Tuwirang ipinapahayag ng רוץ ang pagtakbo at pinananatili ang mabilis at sabik na kilos sa salaysay.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Ginamit ang karaniwang anyo ng pangalan sa makabagong saling Tagalog ng Bibliya.
- source_word: לִקְרָאתוֹ
  choice: upang salubungin siya
  rationale: Ang idyomang לקראת ay tumutukoy sa paglapit upang makipagtagpo; natural sa Tagalog ang “salubungin.”
- source_word: וַיְחַבְּקֵהוּ
  choice: niyakap siya
  rationale: Ang חבק ay nangangahulugang yumakap; malinaw, natural, at marangal ang “niyakap.”
- source_word: וַיִּפֹּל עַל צַוָּארוֹ
  choice: yumakap sa kanyang leeg
  rationale: Ang literal na “bumagsak sa kanyang leeg” ay hindi natural sa Tagalog at maaaring magpahiwatig ng aksidente. Pinananatili ng parirala ang larawan ng marubdob na pagyakap nang hindi nagdaragdag ng interpretasyon.
- source_word: וַיִּשָּׁקֵהוּ
  choice: hinalikan siya
  rationale: Ang נשק sa anyong ito ay nangangahulugang humalik. Inilagay sa talababa ang di-pangkaraniwang Masoretikong pagmamarka sa halip na baguhin ang payak na kahulugan.
- source_word: וַיִּבְכּוּ
  choice: umiyak silang dalawa
  rationale: Malinaw na ipinahihiwatig ng pandiwang maramihan na kapwa umiyak ang dalawang lalaki; iniiwasan nito ang maaaring di-malinaw na simpleng “umiyak sila.”
theological_decisions:
- issue: Pagpapakahulugan sa mga kilos ni Esau kay Jacob
  choice: Inilahad ang sunod-sunod na kilos bilang tuwirang pagpapakita ng magiliw na pakikipagkasundo.
  alternative: Ipakitang kahina-hinala o pakunwari ang halik batay sa mga tradisyon ng pagpapakahulugan.
  rationale: Sa payak na daloy ng tekstong Hebreo, magkakasunod ang mga kilos ng pagsalubong, pagyakap, paghalik, at pag-iyak. Hindi dapat idagdag sa pangunahing teksto ang pagdududang hindi tahasang sinasabi nito.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “salubungin” bilang likas na katumbas ng idyomang Hebreo at ang “yumakap sa kanyang leeg” upang mapanatili ang emosyonal na larawan nang maiwasan ang di-natural na literalismo.
