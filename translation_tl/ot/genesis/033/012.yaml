  text: Then he said[a], “Let us set out and go, and I will go before you.”
translation:
  language: tl
  text: Pagkatapos ay sinabi niya, “Umalis na tayo at magpatuloy sa paglalakbay, at mauuna ako sa iyo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sasabay ako sa iyo.”
    reason: Maaaring tumukoy ang לְנֶגְדֶּךָ sa pagiging nasa unahan ng isang tao o sa paglakad na kaharap, katapat, o kasama niya; hindi ganap na nilulutas ng konteksto ang saklaw ng kahulugan.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi niya
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay; natural na ipinahahayag ng “Pagkatapos ay” ang pagkakasunod-sunod ng pangyayari.
- source_word: נִסְעָה
  choice: Umalis na tayo
  rationale: Ang cohortative na anyo ng נסע ay isang mungkahi o paanyayang magsimulang maglakbay. Malinaw at likas sa modernong Tagalog ang “Umalis na tayo.”
- source_word: וְנֵלֵכָה
  choice: at magpatuloy sa paglalakbay
  rationale: Sa kontekstong ito, ang הלך ay tumutukoy sa pagpapatuloy ng paglalakbay. Pinananatili ng salin ang koordinasyon ng dalawang cohortative habang iniiwasan ang hindi likas na pag-uulit na “umalis at umalis.”
- source_word: וְאֵלְכָה
  choice: at mauuna ako
  rationale: Ang unang panauhang anyo ay nagpapahayag ng gagawing pagkilos ni Esau kaugnay ng iminungkahing paglalakbay.
- source_word: לְנֶגְדֶּךָ
  choice: sa iyo
  rationale: Kasama ng “mauuna,” ipinahahayag nito ang posibleng diwang nasa harapan o nauuna. Dahil maaari rin itong magpahiwatig ng paglalakbay na kasama o katapat ng kausap, inilagay sa talababa ang lehitimong alternatibo.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, marangal, at madaling maunawaang Tagalog. Ang “magpatuloy sa paglalakbay” ay naglilinaw sa kontekstuwal na diwa ng paglakad nang hindi gumagamit ng makaluma o matigas na pananalita.
