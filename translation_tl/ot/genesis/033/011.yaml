  yaml_path: translation/ot/genesis/033/011.yaml
  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: tl
  text: Pakisuyo, tanggapin mo ang aking kaloob na dinala sa iyo, sapagkat pinagkalooban ako ng Diyos, at nasa akin ang lahat.” Mariin siyang pinakiusapan ni Jacob, kaya tinanggap iyon ni Esau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְכָתִי
  choice: ang kaloob ko
  rationale: Literal na “aking pagpapala,” ngunit sa kontekstong ito ay tumutukoy sa handog na iniharap kay Esau; ang “kaloob” ang likas na kahulugan sa modernong Tagalog nang hindi nagpapahiwatig na si Jacob ay nagbibigay ng pormal na basbas.
- source_word: חַנַּנִי אֱלֹהִים
  choice: naging mapagbigay sa akin ang Diyos
  rationale: Ipinapahayag ng pandiwa na pinagkalooban o pinakitaan si Jacob ng biyaya ng Diyos; pinananatili ng salin ang Diyos bilang pinagmulan ng saganang tinanggap niya.
- source_word: יֶשׁ לִי כֹל
  choice: nasa akin ang lahat ng kailangan ko
  rationale: Ang literal na “mayroon akong lahat” ay idiomatikong nagsasaad ng kasapatan, hindi kinakailangang absolutong pag-aari ng lahat ng bagay.
- source_word: וַיִּפְצַר בּוֹ
  choice: Patuloy siyang pinakiusapan ni Jacob
  rationale: Ang pandiwa ay nangangahulugang mariing o paulit-ulit na paghimok; pinangalanan si Jacob upang luminaw ang tinutukoy ng mga panghalip sa natural na Tagalog.
- source_word: וַיִּקָּח
  choice: tinanggap iyon ni Esau
  rationale: Sa konteksto, ang “kinuha niya” ay likas na nangangahulugang tinanggap ni Esau ang kaloob; pinangalanan si Esau upang maiwasan ang kalituhan.
theological_decisions:
- issue: Kahulugan ng בִּרְכָתִי bilang “pagpapala” o “kaloob”
  choice: kaloob
  alternative: pagpapala
  rationale: Bagaman karaniwang “pagpapala” ang salita, dito ay malinaw na tumutukoy ito sa materyal na handog na ipinadala kay Esau. Ang “kaloob” ay naghahatid ng kontekstuwal na diwa nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Saklaw ng pahayag na יֶשׁ לִי כֹל
  choice: lahat ng kailangan ko
  alternative: lahat
  rationale: Pinananatili nito ang pahayag ng kasapatan at kasaganaan ni Jacob, habang iniiwasan ang di-likas at posibleng maling absolutong pagbasa sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal. Ginamit ang “Pakisuyo” at “tanggapin mo” upang maipakita ang mapilit ngunit mapagpakumbabang pakiusap. Nilinaw ang mga panghalip sa huling sugnay sa pamamagitan ng mga pangalang Jacob at Esau.
