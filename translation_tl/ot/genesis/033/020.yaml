  text: There he set up an altar and called it El-Elohe-Israel[a][b].
translation:
  language: tl
  text: Doon ay nagtayo siya ng isang altar at tinawag niya itong El-Elohe-Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Doon ay nagtayo siya ng isang altar at tumawag siya sa Diyos, ‘Diyos, ang Diyos ng Israel,’” o “ipinahayag niya hinggil dito, ‘Diyos, ang Diyos ng Israel.’” Maaaring unawain ang Hebreo bilang pagpapangalan sa altar o bilang pagtawag o pagpapahayag tungkol sa Diyos.
    reason: alternative_reading
  - marker: b
    text: Ang El-Elohe-Israel ay nangangahulugang “Diyos, ang Diyos ng Israel” o “El, Diyos ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֶּב
  choice: nagtayo
  rationale: Ang Hiphil ng נצב ay nangangahulugang magtayo o maglagay nang nakatindig. Likas sa modernong Tagalog ang “nagtayo” para sa pagtatatag ng altar.
- source_word: שָׁם
  choice: doon
  rationale: Tuwirang ipinahahayag ng pang-abay ang lugar; “doon” ang natural at maikling katumbas.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Ito ang karaniwan at madaling maunawaang katawagan sa estrukturang pinaghahandugan.
- source_word: וַיִּקְרָא לוֹ
  choice: tinawag niya itong
  rationale: Maaaring mangahulugan ang קרא + ל ng pagbibigay ng pangalan, at natural sa konteksto na ang altar ang pinangalanan. Pinananatili sa talababa ang posibleng pagbasa bilang pagtawag sa Diyos o pagpapahayag tungkol sa altar.
- source_word: אֵל אֱלֹהֵי יִשְׂרָאֵל
  choice: El-Elohe-Israel
  rationale: Dahil gumaganap ang buong parirala bilang pangalan ng altar sa pangunahing pagbasa, pinanatili itong transliterado. Ipinaliliwanag sa talababa ang kahulugan nitong “Diyos, ang Diyos ng Israel” o “El, Diyos ng Israel.”
theological_decisions:
- issue: Kung ang huling parirala ay pangalan ng altar o isang pahayag/pagtawag sa Diyos
  choice: Ituring itong pangalang ibinigay sa altar
  alternative: Tumawag siya sa Diyos bilang “Diyos, ang Diyos ng Israel,” o ipinahayag niya sa ibabaw nito, “Diyos, ang Diyos ng Israel.”
  rationale: Likas na sinusuportahan ng pagkakasunod-sunod ng pagtatayo ng altar at וַיִּקְרָא לוֹ ang pagbibigay rito ng pangalan, gaya ng ibang pormula ng pagpapangalan sa Genesis. Gayunman, sapat ang ikli at lawak ng konstruksiyong Hebreo upang manatiling posible ang pagbasa bilang pagtawag o pagpapahayag, kaya inilagay iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “altar,” na karaniwan at mas natural sa kasalukuyang gamit kaysa sa mas mahabang paliwanag. Pinanatili ang Hebreong pangalan upang tumugma sa pangunahing pagbasa bilang pagpapangalan, habang malinaw na inilahad sa mga talababa ang kahulugan at tunay na sintaktikong kalabuan.
