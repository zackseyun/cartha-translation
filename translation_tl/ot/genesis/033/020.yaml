  naturalness: Natural at marangal ang pangunahing teksto sa modernong Filipino Tagalog. Gayunman, sa talababa a, malabo ang panghalip na “kanya,” sapagkat ang malapit na tinutukoy sa pangungusap ay altar, samantalang ang alternatibong pagbasa ay pagtawag sa Diyos. Ang “sa ibabaw nito” ay masyadong literal at hindi likas sa Filipino para sa alternatibong pagbasa ng pagpapahayag.
  terminology: Ang “altar” ay karaniwan at angkop. Wasto ang “El-Elohe-Israel” bilang transliteradong pangalan at ang pagpapaliwanag ng kahulugan nito. Pinanatili ang “Diyos” para sa אֵל/אֱלֹהֵי nang walang idinagdag na interpretasyong doktrinal.
