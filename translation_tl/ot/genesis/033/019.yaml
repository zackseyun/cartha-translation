    issue: Hindi ganap na malinaw ang relatibong sugnay tungkol sa tolda.
    rationale: Ang “na pinagtayuan niya ng tolda” ay maaari pa ring unawain, ngunit ang Hebreo ay tuwirang tumutukoy sa lugar “kung saan niya itinayo ang kanyang tolda.” Ang rebisyon ay mas idiomatiko at mas malinaw.
  - severity: low
    issue: Maaaring luminaw ang apposition na naglalarawan kay Hamor.
    rationale: Sa “mga anak ni Hamor, na ama ni Shekem,” ang “na” ay maaaring pansamantalang magmukhang tumutukoy sa “mga anak.” Ang “Hamor, ama ni Shekem” ay mas malinaw na apposition.
  revised_text: At binili niya mula sa mga anak ni Hamor, ama ni Shekem, ang bahagi ng bukid kung saan niya itinayo ang kanyang tolda, sa halagang isandaang kesita.[a]
