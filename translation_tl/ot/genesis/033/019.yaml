revisions:
- from: At binili niya sa mga anak ni Hamor, na ama ni Shekem, ang bahagi ng bukid na pinagtayuan niya ng tolda, sa halagang isandaang kesita.[a]
  to: At binili niya mula sa mga anak ni Hamor, ama ni Shekem, ang bahagi ng bukid kung saan niya itinayo ang kanyang tolda, sa halagang isandaang kesita.[a]
  rationale: Pinalitan ang hindi gaanong tuwirang “na pinagtayuan niya ng tolda” ng “kung saan niya itinayo ang kanyang tolda” upang malinaw na maipahayag ang relatibong sugnay ng Hebreo. Inayos din ang apposition upang si Hamor, hindi ang kanyang mga anak, ang malinaw na matukoy bilang ama ni Shekem. Napanatili ang kahulugang pangbilihan, ang halaga, at ang kawalang-katiyakan ng kesita.
