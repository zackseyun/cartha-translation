base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/019.yaml
  text: And he bought the portion of the field where he had pitched his tent[a], from the hand of the sons of Hamor, the father of Shechem, for a hundred qesitahs.
translation:
  language: tl
  text: At binili niya mula sa mga anak ni Hamor, ama ni Shekem, ang bahagi ng bukid kung saan niya itinayo ang kanyang tolda, sa halagang isandaang kesita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: kesita; isang sinaunang yunit o bagay na pambayad na hindi tiyak ang eksaktong halaga. Isinasalin din ito kung minsan bilang “piraso ng salapi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: At binili niya
  rationale: Ang קנה sa konteksto ng transaksiyon sa lupa ay nangangahulugang ‘bumili.’ Pinananatili ng ‘At’ ang pang-ugnay na וַ habang natural pa rin sa salaysay.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: ang bahagi ng bukid
  rationale: Ang חֶלְקָה ay isang tiyak na bahagi o parsela; malinaw at likas sa modernong Tagalog ang ‘bahagi ng bukid.’
- source_word: אֲשֶׁר נָטָה שָׁם אָהֳלוֹ
  choice: na pinagtayuan niya ng tolda
  rationale: Ang נטה na kasama ng אֹהֶל ay idyomang tumutukoy sa pagtatayo o paglalatag ng tolda. Ipinahihiwatig ng anyong ‘pinagtayuan’ na nauna ang pagkakampo sa pagbili.
- source_word: מִיַּד בְּנֵי חֲמוֹר
  choice: sa mga anak ni Hamor
  rationale: Literal na ‘mula sa kamay ng mga anak ni Hamor,’ ngunit sa transaksiyong ito ang ‘binili ... sa mga anak’ ang natural na Tagalog at sapat na naghahayag na sa kanila nagmula ang lupa.
- source_word: אֲבִי שְׁכֶם
  choice: na ama ni Shekem
  rationale: Tinutukoy ng parirala si Hamor bilang ama ng taong si Shekem; pinananatili ang appositional na paglalarawan nang hindi nilulutas sa ibang paraan ang pangalan.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: sa halagang isandaang kesita
  rationale: Ipinapahayag ng ‘sa halagang’ ang presyo ng pagbili. Isinalin-transliterado ang קְשִׂיטָה bilang ‘kesita’ sapagkat hindi tiyak ang eksaktong uri o halaga nito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na ayos ng pangungusap sa Tagalog habang pinananatili ang mga ugnayang makikita sa Hebreo. Inilagay ang talababa sa ‘kesita,’ ang salitang talagang nililinaw nito.
