base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/007.yaml
  text: Leah also came near[a], and her children, and they bowed down. Afterward Joseph and Rachel came near[b], and they bowed down.
translation:
  language: tl
  text: Lumapit din si Lea at ang kanyang mga anak, at yumukod sila. Pagkatapos, lumapit sina Jose at Raquel, at yumukod sila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּגַּשׁ / נִגַּשׁ
  choice: lumapit
  rationale: Ang נגשׁ ay tumutukoy sa paglapit. Natural sa makabagong Tagalog ang “lumapit” at hindi nito dinaragdagan ang paraan o layunin ng kilos.
- source_word: גַּם
  choice: din
  rationale: Ipinahihiwatig ng גַּם ang pagdaragdag sa sunod-sunod na pagharap kay Esau; likas dito ang “din.”
- source_word: וִילָדֶיהָ
  choice: at ang kanyang mga anak
  rationale: Ang יְלָדִים ay malawak na tumutukoy sa mga anak at hindi likas na limitado sa mga lalaki.
- source_word: וַיִּשְׁתַּחֲוּ
  choice: yumukod sila
  rationale: Sa konteksto, ang pandiwa ay nagsasaad ng malalim na pagyukod bilang paggalang. Ang “yumukod” ay malinaw at natural nang hindi ipinipilit na lubos silang nagpatirapa.
- source_word: וְאַחַר
  choice: Pagkatapos
  rationale: Malinaw nitong pinananatili ang pagkakasunod-sunod ng mga lumalapit.
- source_word: יוֹסֵף וְרָחֵל
  choice: sina Jose at Raquel
  rationale: Pinananatili ang ayos ng mga pangalan sa Hebreo, na inuuna si Jose kay Raquel.
