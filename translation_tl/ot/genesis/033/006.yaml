  text: Pagkatapos, lumapit ang mga babaeng alipin at ang kanilang mga anak. Yumukod sila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּגַּשְׁןָ
  choice: lumapit
  rationale: Ang anyong wayyiqtol na 3fp ng נגשׁ ay nagsasaad ng kasunod na kilos sa salaysay. Likas at malinaw sa makabagong Tagalog ang “lumapit.”
- source_word: הַשְּׁפָחוֹת
  choice: ang mga alilang babae
  rationale: Ang שִׁפְחָה ay tumutukoy sa babaeng alipin o tagapaglingkod. Pinananatili ng “mga alilang babae” ang kasarian at mababang katayuang panlipunan nang hindi gumagamit ng lipas na salita.
- source_word: הֵנָּה
  choice: kasama
  rationale: Ang hiwalay na panghalip ay nagbibigay-diin sa mga babae bilang kasama ng kanilang mga anak. Sa natural na Tagalog, naipahahayag ang ugnayang ito sa “kasama,” sa halip na piliting ulitin ang panghalip.
- source_word: וְיַלְדֵיהֶן
  choice: ang kanilang mga anak
  rationale: 'Tuwirang ipinahahayag nito ang pangngalang maramihan na may hulaping 3fp: “kanilang mga anak.”'
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: yumukod
  rationale: Ang pandiwa ay tumutukoy sa pagyukod nang mababa bilang paggalang o pagpupugay. Ang “yumukod” ay natural at sapat sa konteksto, samantalang ang “nagpatirapa” ay mas tahasang paglalarawan ng buong galaw.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “alilang babae” upang ipakita ang kasarian at katayuang nakapaloob sa Hebreo; iniwasan ang mas lipas na “aliping babae” bilang titulong maaaring tumunog na matigas, bagaman nananatiling malinaw ang mababang katayuan. Ang ayos na “kasama ang kanilang mga anak” ay natural na Tagalog para sa appositional na Hebreong “sila at ang kanilang mga anak.”
