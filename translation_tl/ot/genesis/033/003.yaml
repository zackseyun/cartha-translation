  terminology: Ang “yumukod hanggang sa lupa” ay angkop at hindi ipinipilit ang kahulugang pagsamba. Ang talababa ay wastong nagbibigay ng alternatibong “nagpatirapa” at pinananatili ang di-tiyak na saklaw ng pandiwang Hebreo.
