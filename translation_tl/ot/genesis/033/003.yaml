  yaml_path: translation/ot/genesis/033/003.yaml
  text: And he himself went on ahead of them and bowed down to the ground seven times[a], until he came near to his brother.
translation:
  language: tl
  text: At siya mismo ay nagpatuloy sa unahan nila at yumukod hanggang sa lupa nang pitong ulit[a], hanggang sa makalapit siya sa kanyang kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpatirapa”; maaaring tumukoy ang pandiwang Hebreo sa ganap na pagpapatirapa bilang pagpapakita ng paggalang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: At siya mismo
  rationale: Ang hiwalay na panghalip ay nagbibigay-diin kay Jacob bilang siyang personal na humarap muna.
- source_word: עָבַר לִפְנֵיהֶם
  choice: naunang lumakad sa kanila
  rationale: Sa konteksto, si Jacob ay pumuwesto at nagpatuloy sa unahan ng kanyang sambahayan upang salubungin si Esau; natural itong ipinahahayag sa modernong Tagalog bilang paglakad sa unahan.
- source_word: וַיִּשְׁתַּחוּ אַרְצָה
  choice: yumukod hanggang sa lupa
  rationale: Pinananatili nito ang kongkretong kilos ng matinding pagyukod nang hindi ito awtomatikong binibigyang-kahulugang pagsamba.
- source_word: שֶׁבַע פְּעָמִים
  choice: nang pitong ulit
  rationale: Tuwirang pinananatili ang bilang at ang paulit-ulit na kilos.
- source_word: עַד גִּשְׁתּוֹ עַד אָחִיו
  choice: hanggang sa makalapit siya sa kanyang kapatid
  rationale: Ipinahahayag ang hangganan ng paulit-ulit na pagyukod habang papalapit si Jacob sa kanyang kapatid.
theological_decisions:
- issue: Kung ang וַיִּשְׁתַּחוּ ay tumutukoy sa pagsamba o paggalang
  choice: yumukod hanggang sa lupa
  alternative: nagpatirapa / sumamba
  rationale: Sa konteksto ng pakikipagtagpo sa kapatid, inilalarawan ng pandiwa ang pisikal na pagpapatirapa o pagpapakumbaba. Hindi dapat ipasok sa pangunahing teksto ang mas tiyak na teolohikal na kahulugang 'sumamba.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “siya mismo” upang mapanatili ang diin ng Hebreo, at ang “yumukod hanggang sa lupa” upang ilarawan ang kilos nang hindi labis na nilulutas ang saklaw ng pandiwa.
