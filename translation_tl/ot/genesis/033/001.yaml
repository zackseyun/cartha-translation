    issue: Hindi nakaayon ang puwesto ng “narito” sa saklaw nito sa Hebreo.
    rationale: Ang וְהִנֵּה ay nauuna sa paglalarawang “si Esau ay papalapit,” hindi isang hiwalay na pahayag matapos nang masabing nakita na siya ni Jacob.
  - severity: low
    issue: “Kasama nito” ay di-likas at maaaring maging malamig o malabo para kay Esau.
    rationale: Para sa isang taong tinutukoy sa ganitong estruktura, natural na Tagalog ang “kasama niya.”
  revised_text: Tumingala si Jacob at tumingin; at narito,[a] papalapit si Esau, kasama niya ang apatnaraang lalaki. Kaya hinati niya ang mga anak at inilagay sa pangkat nina Lea, Raquel, at ng dalawang aliping babae.[b]
