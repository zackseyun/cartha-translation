revisions:
- from: Tumingala si Jacob at nakita niyang papalapit si Esau. At narito,[a] kasama nito ang apatnaraang lalaki. Kaya hinati niya ang mga anak sa mga pangkat kasama si Lea, si Raquel, at ang dalawang alilang babae.[b]
  to: Tumingala si Jacob at tumingin; at narito,[a] papalapit si Esau, kasama niya ang apatnaraang lalaki. Kaya hinati niya ang mga anak at inilagay sa pangkat nina Lea, Raquel, at ng dalawang aliping babae.[b]
  rationale: Inayos ang ayos upang ang “narito” ay tuwirang magpakilala sa paglapit ni Esau, gaya ng sa Hebreo. Pinalitan ang di-likas na “kasama nito” ng “kasama niya.” Ang huling sugnay ay inayos upang malinaw na ang mga anak ay ipinamahagi sa tatlong pangkat na kaugnay nina Lea, Raquel, at ng dalawang aliping babae.
