base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/001.yaml
  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
translation:
  language: tl
  text: Tumingala si Jacob at tumingin; at narito,[a] papalapit si Esau, kasama niya ang apatnaraang lalaki. Kaya hinati niya ang mga anak at inilagay sa pangkat nina Lea, Raquel, at ng dalawang aliping babae.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “narito” ay masiglang panandang Hebreo na nagtutuon ng pansin sa paglapit ni Esau.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “mga aliping babae” bilang “mga babaeng lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב עֵינָיו וַיַּרְא
  choice: Tumingala si Jacob at nakita niya
  rationale: Ang literal na larawan ay ‘itinaas ni Jacob ang kanyang mga mata at tumingin/nakita.’ Ang “tumingala … at nakita” ay likas sa modernong Tagalog at pinananatili ang dalawang magkasunod na kilos.
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili nito ang masiglang panandang Hebreo na nagtutuon ng pansin sa biglang inihaharap na tanawin, nang hindi dinaragdagan ang teksto ng tahasang damdamin ni Jacob.
- source_word: בָּא
  choice: papalapit
  rationale: Ang participle ay naglalarawan kay Esau habang dumarating; malinaw na ipinapahayag ng “papalapit” ang nagpapatuloy na kilos.
- source_word: וְעִמּוֹ אַרְבַּע מֵאוֹת אִישׁ
  choice: kasama nito ang apatnaraang lalaki
  rationale: Direkta at natural na inilalarawan ang malaking pangkat na kasama ni Esau. Ginamit ang “nito” upang malinaw na si Esau ang tinutukoy.
- source_word: וַיַּחַץ אֶת הַיְלָדִים
  choice: hinati niya ang mga anak sa mga pangkat
  rationale: Ang pandiwa ay nangangahulugang paghahati o pamamahagi. Idinagdag ang “sa mga pangkat” upang maging malinaw sa Tagalog ang uri ng paghahati na hinihingi ng kasunod na mga parirala.
- source_word: עַל לֵאָה וְעַל רָחֵל וְעַל שְׁתֵּי הַשְּׁפָחוֹת
  choice: kasama si Lea, si Raquel, at ang dalawang alilang babae
  rationale: Sa konteksto, ipinapangkat ang mga anak kasama ng kani-kanilang mga babae. Ang “alilang babae” ay malinaw at pinananatili ang mababang katayuang ipinahihiwatig ng שִׁפְחָה nang hindi tumutukoy nang higit sa tiyak na legal na kalagayang sinasabi ng talata.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig. Pinanatili ang “narito” dahil mahalaga ang masiglang puwersa ng Hebreong וְהִנֵּה, kahit bahagya itong mas mataas sa karaniwang pananalita. Ang natitirang pangungusap ay tuwiran at madaling maunawaan.
