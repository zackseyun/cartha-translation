  terminology: Ang "lingap" ay angkop para sa חֵן sa interpersonal na idyoma at hindi nagpapataw ng teknikal na teolohikong kahulugan. Ang "regalo," "Diyos," at "malugod mo akong tinanggap" ay angkop. Nananatiling wastong alternatibo sa talababa ang "isang diyos."
