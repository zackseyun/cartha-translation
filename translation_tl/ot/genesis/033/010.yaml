  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב אַל נָא֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וְ/לָקַחְתָּ֥ מִנְחָתִ֖/י מִ/יָּדִ֑/י כִּ֣י עַל כֵּ֞ן רָאִ֣יתִי פָנֶ֗י/ךָ כִּ/רְאֹ֛ת פְּנֵ֥י אֱלֹהִ֖ים וַ/תִּרְצֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/010.yaml
  text: Jacob said[a], “No, please. If I have found favor in your eyes, then take my gift from my hand, because seeing your face is like seeing the face of God[c][b], and you have received me favorably.”
translation:
  language: tl
  text: Sinabi ni Jacob, “Hindi, pakiusap. Kung nakasumpong ako ng lingap sa iyong paningin, tanggapin mo ang regalo ko mula sa aking kamay, sapagkat ang makita ang iyong mukha ay parang makita ang mukha ng Diyos,[a] at malugod mo akong tinanggap.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “parang makita ang mukha ng isang diyos,” ngunit sa konteksto, malamang na “Diyos” ang tinutukoy dahil sa kamakailang karanasan ni Jacob sa Peniel (Genesis 32:30).
    reason: alternative_reading
  - marker: b
    text: Maaari ring “nalugod ka sa akin.” Ipinahihiwatig ng pandiwang Hebreo ang malugod o kanais-nais na pagtanggap.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵן בְּעֵינֶיךָ
  choice: kinalulugdan mo ako
  rationale: Natural na salin sa modernong Tagalog ng idyomang literal na ‘nakasumpong ako ng lingap sa iyong mga mata’; ipinahahayag nito ang personal na pagsang-ayon nang hindi nagdaragdag ng teknikal na teolohikong diwa.
- source_word: מִנְחָתִי
  choice: regalo ko
  rationale: Tumutukoy ito sa handog na pampalubag-loob ni Jacob kay Esau; mas malinaw ang ‘regalo’ kaysa ‘handog,’ na maaaring magpahiwatig ng ritwal na paghahandog.
- source_word: מִיָּדִי
  choice: mula sa aking kamay
  rationale: Pinananatili ang kongkretong larawan ng personal na pag-aabot na nasa Hebreo at nauunawaan pa rin sa Tagalog.
- source_word: כִּי עַל־כֵּן
  choice: sapagkat
  rationale: Ipinakikilala ng parirala ang dahilan ng pakiusap ni Jacob; natural at marangal ang ‘sapagkat’ sa konteksto.
- source_word: כִּרְאֹת פְּנֵי אֱלֹהִים
  choice: parang makita ang mukha ng Diyos
  rationale: Pinananatili ang matinding paghahambing at ang larawan ng ‘mukha’; ang ‘Diyos’ ang pinakamalamang na kahulugan dahil sa Peniel na konteksto.
- source_word: וַתִּרְצֵנִי
  choice: malugod mo akong tinanggap
  rationale: Sinasaklaw nito ang diwa ng kanais-nais at mapagpalugod na pagtanggap ni Esau kay Jacob.
theological_decisions:
- issue: Tinutukoy ng אֱלֹהִים sa paghahambing
  choice: Diyos
  alternative: isang diyos
  rationale: Bagaman maaaring magkaroon ng mas malawak na kahulugan ang אֱלֹהִים, mariing itinuturo ng salaysay—lalo na ang pagkakita ni Jacob sa Diyos sa Peniel sa Genesis 32:30—ang Diyos bilang singular na tinutukoy. Iniiwan ng salin ang kapansin-pansing paghahambing ni Jacob nang hindi ito pinahihina.
- issue: Diwa ng וַתִּרְצֵנִי
  choice: malugod mo akong tinanggap
  alternative: nalugod ka sa akin
  rationale: Pinananatili ng napiling salin ang maaaring diwa ng pagtanggap at pagkalugod sa halip na paliitin ito sa isa lamang sa dalawa; nakatala ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, magalang, at marangal. Iniwasan ang sobrang literal na ‘nakasumpong ng lingap sa iyong mga mata’ dahil hindi ito likas sa kasalukuyang Tagalog, ngunit pinanatili ang kongkretong ‘mula sa aking kamay’ at ang teolohikong matinding ‘mukha ng Diyos.’ Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto at tumutugma sa mga talababa.
