base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/018.yaml
  text: Jacob came safely to the city of Shechem[a], which is in the land of Canaan, when he came from Paddan-aram[b], and he camped before the city.
translation:
  language: tl
  text: Dumating nang ligtas si Jacob sa lungsod ng Shekem[a], na nasa lupain ng Canaan, nang manggaling siya sa Padan-Aram, at nagkampo siya sa tapat ng lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Dumating si Jacob sa Salem, isang lungsod ng Shekem.” Ang Hebreong שָׁלֵם (shalem) ay maaaring unawain bilang “ligtas” o “buo,” o basahin bilang pangalang “Salem.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dumating
  rationale: Ang wayyiqtol ng בוא ay nagsasaad ng pagdating ni Jacob; natural at tuwiran ang “dumating” sa makabagong Tagalog.
- source_word: שָׁלֵם
  choice: nang ligtas
  rationale: Pinakanatural itong unawain bilang paglalarawan sa kalagayan ni Jacob sa pagdating—ligtas o buo ang kalagayan. Nananatili sa talababa ang posibleng pagbasa rito bilang pangalang Salem.
- source_word: עִיר שְׁכֶם
  choice: sa lungsod ng Shekem
  rationale: Ang construct chain ay likas na naisasalin bilang “lungsod ng Shekem.” Ginamit ang “Shekem” upang kumatawan sa Hebreong שְׁכֶם sa paraang madaling bigkasin sa Filipino.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: na nasa lupain ng Canaan
  rationale: Tuwirang ipinakikilala ng relative clause ang kinaroroonan ng Shekem; natural sa Filipino ang “na nasa.”
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  choice: nang manggaling siya sa Padan-Aram
  rationale: Temporal ang ב na may infinitive construct at hulaping panghalip. Iniiwasan ng “nang manggaling” ang alanganing pag-uulit ng “dumating” habang pinananatili ang diwang temporal at ang pinanggalingan.
- source_word: פַּדַּן אֲרָם
  choice: Padan-Aram
  rationale: Transliterasyon ito ng pangalang pantangi, na may gitling upang malinaw na isang tambalang pangalan ng lugar.
- source_word: וַיִּחַן
  choice: nagkampo siya
  rationale: Ang Qal ng חנה rito ay nangangahulugang humimpil o magkampo; kasalukuyan at madaling maunawaan ang “nagkampo.”
- source_word: אֶת־פְּנֵי הָעִיר
  choice: sa tapat ng lungsod
  rationale: Ang idyoma ay tumutukoy sa lugar sa harap o kaharap ng lungsod; malinaw at natural sa Filipino ang “sa tapat ng lungsod.”
