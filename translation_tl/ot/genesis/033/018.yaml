translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang ambiguwidad ng שָׁלֵם sa talababa. Hindi isinama ang talababa ng English consultation layer para sa “when he came from Paddan-aram” sapagkat hindi ito tunay na alternatibong pagbasa ng Hebreo at walang kapaki-pakinabang na pagkakaiba sa Filipino.
