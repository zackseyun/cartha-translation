base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/017.yaml
  text: And Jacob traveled to Succoth[a], and he built a house for himself and made shelters for his livestock. Therefore he called the name of the place Succoth.
translation:
  language: tl
  text: At naglakbay si Jacob patungong Sucot[a]. Nagtayo siya ng bahay para sa kanyang sarili at gumawa ng mga silungan para sa kanyang mga alagang hayop. Kaya pinangalanan niya ang lugar na Sucot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Sucot ay kaugnay ng salitang Hebreo na nangangahulugang “mga silungan” o “mga kubol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסַע
  choice: naglakbay
  rationale: Ipinapahayag ng pandiwa ang pag-alis at paglalakbay mula sa isang lugar; natural ito sa makabagong salaysay.
- source_word: סֻכֹּתָה
  choice: patungong Sucot
  rationale: Ang directional he ay nagsasaad ng pagkilos patungo sa lugar; pinanatiling transliterado ang pangalang pantangi.
- source_word: וַיִּבֶן לוֹ בָּיִת
  choice: nagtayo siya roon ng bahay para sa sarili niya
  rationale: Malinaw nitong ipinapahayag ang pagtatayo ng tirahan para sa sariling gamit ni Jacob; ang “roon” ay likas na ipinahihiwatig ng konteksto ng pagdating sa lugar.
- source_word: מִקְנֵהוּ
  choice: kanyang mga alagang hayop
  rationale: Tumutukoy ito sa mga hayop na pag-aari o kawan; mas malawak at mas madaling maunawaan kaysa sa “mga baka.”
- source_word: עָשָׂה סֻכֹּת
  choice: gumawa ng mga silungan
  rationale: Ang סֻכּוֹת ay mga pansamantalang kubol o silungan; ang “mga silungan” ay malinaw sa konteksto ng mga hayop at nagpapanatili sa batayan ng pangalan.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Natural at maikli itong nagpapakita ng sanhi ng pagpapangalan.
- source_word: קָרָא שֵׁם הַמָּקוֹם
  choice: tinawag niyang … ang lugar na iyon
  rationale: Isinasalin ang Hebreong pormula sa natural na Filipino nang hindi binabago ang diwa ng pagbibigay ng pangalan.
- source_word: סֻכּוֹת
  choice: Sucot
  rationale: Isinulat bilang pangalang pantangi at ipinaliwanag sa talababa ang paglalaro sa salitang Hebreo.
