  text: So Esau returned that day on his way to Seir[a].
translation:
  language: tl
  text: Kaya, noong araw ding iyon, bumalik si Esau sa kanyang paglalakbay patungong Seir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: nagbalik
  rationale: Ang pandiwang שׁוּב sa anyong nagsasalaysay ay tumutukoy sa natapos na pagbabalik; natural itong ipahayag sa Filipino bilang “nagbalik.”
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw ding iyon
  rationale: Tuwirang tumutukoy ang parirala sa araw na iyon. Ipinahihiwatig ng “ding” ang kaugnayan nito sa naunang pangyayari nang hindi kinakailangang sabihing ibang araw iyon.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino.
- source_word: לְדַרְכּוֹ
  choice: patungong
  rationale: Bagaman literal na “sa kaniyang daan,” ipinahihiwatig sa konteksto na ipinagpatuloy ni Esau ang paglalakbay niya; sapat at natural itong naihahatid ng “patungong” kasama ng destinasyon.
- source_word: שֵׂעִירָה
  choice: Seir
  rationale: Ang hulaping direksiyonal na ה ay nagpapahiwatig ng pagkilos tungo sa Seir, na ipinahayag sa “patungong Seir.”
