base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/014.yaml
  text: Please let my lord pass on ahead of his servant[a], and I will proceed slowly, at the pace of the livestock that is before me and at the pace of the children[c][b], until I come to my lord at Seir.
translation:
  language: tl
  text: Mauna na po ang aking panginoon sa kanyang lingkod, at ako nama'y dahan-dahang maglalakbay ayon sa bilis ng mga alagang hayop na nasa unahan ko[a] at ayon sa bilis ng mga bata, hanggang sa makarating ako sa aking panginoon sa Seir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pag-aari.” Ang salitang Hebreo ay madalas mangahulugang “gawain” o “ari-arian,” ngunit sa kontekstong ito ay malamang na tumutukoy sa mga hayop na kasama sa paglalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲבָר נָא
  choice: Mauna na po
  rationale: Ang Qal jussive na may נָא ay isang magalang na pakiusap. Likas sa modernong Tagalog ang “Mauna na po” at malinaw nitong ipinahihiwatig ang pag-una sa paglalakbay.
- source_word: אֲדֹנִי
  choice: aking panginoon
  rationale: Magalang na tawag ito ni Jacob kay Esau. Pinananatili ng “aking panginoon” ang mapagpakumbabang tindig at ang pag-uulit ng katawagan nang hindi ito ginagawang banal na titulo.
- source_word: לִפְנֵי עַבְדּוֹ
  choice: sa kanyang lingkod
  rationale: Sa konteksto ng “Mauna,” sapat at natural ang “sa kanyang lingkod” upang ipahayag na mauuna si Esau kay Jacob, habang pinananatili ang ikatlong-panauhang mapagpakumbabang pagtukoy ni Jacob sa sarili.
- source_word: אֶתְנָהֲלָה לְאִטִּי
  choice: ako nama'y dahan-dahang maglalakbay
  rationale: Ang hitpael ng נהל ay maaaring tumukoy sa maingat o kontroladong pagpapatuloy ng paglalakbay. Hindi tahasang nilulutas ng salin kung si Jacob ay “mangunguna” sa pangkat; ipinahahayag nito ang maingat at mabagal na pagkilos.
- source_word: לְרֶגֶל
  choice: ayon sa bilis ng
  rationale: Ang literal na idyomang “ayon sa paa ng” ay tumutukoy sa pag-aangkop sa bilis o kakayahang sumabay ng iba. Ang “ayon sa bilis ng” ay malinaw at likas sa Tagalog.
- source_word: הַמְּלָאכָה
  choice: mga alagang hayop
  rationale: Bagaman karaniwang nangangahulugang “gawain,” “ari-arian,” o “pag-aari” ang מְלָאכָה, ang kontekstong pastoral ay tumutukoy sa mga hayop na kasama at inaalagaan ni Jacob.
- source_word: אֲשֶׁר לְפָנַי
  choice: na nasa unahan ko
  rationale: Pinananatili nito ang tuwirang spatial na larawan ng mga hayop na nasa harapan ni Jacob nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: הַיְלָדִים
  choice: mga bata
  rationale: Tumutukoy ito sa mga anak na kasama sa paglalakbay. Ang “mga bata” ay natural at hindi nagpapalabis sa ipinahihiwatig na edad.
- source_word: עַד אֲשֶׁר אָבֹא אֶל אֲדֹנִי שֵׂעִירָה
  choice: hanggang sa makarating ako sa aking panginoon sa Seir
  rationale: Direktang pinananatili ang temporal na hangganan, ang pagdating kay Esau, at ang destinasyong Seir. Ang “sa Seir” ay sadyang nagpapanatili ng bahagyang ugnayang maaaring basahing lokatibo o patungong destinasyon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal. Ginamit ang “po” upang likas na maipakita ang pakiusap at paggalang ni Jacob kay Esau, samantalang pinanatili ang ikatlong-panauhang “kanyang lingkod” bilang tanda ng mapagpakumbabang pananalita. Iniwasan ang sobrang literal na “ayon sa paa” dahil hindi ito malinaw sa ordinaryong mambabasa.
