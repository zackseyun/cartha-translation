  text: Then Esau said, “Please let me leave with you some of the people who are with me.” But he said, “Why is this? Let me find favor in the eyes of my lord.”
translation:
  language: tl
  text: Sinabi ni Esau, “Hayaan mong iwan ko sa iyo ang ilan sa mga taong kasama ko.” Ngunit sinabi ni Jacob, “Bakit pa? Makasumpong sana ako ng kagandahang-loob sa paningin ng panginoon ko.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַצִּיגָה נָּא עִמְּךָ
  choice: Hayaan mong iwan ko sa iyo
  rationale: Ipinapahayag ang magalang na alok ni Esau na mag-iwan kay Jacob ng mga tauhang makakasama o makatutulong sa kaniya.
- source_word: מִן־הָעָם אֲשֶׁר אִתִּי
  choice: ang ilan sa mga taong kasama ko
  rationale: 'Ang מִן ay partitive dito: bahagi lamang ng pangkat ni Esau ang iniaalok niyang iwan.'
- source_word: לָמָּה זֶּה
  choice: Bakit pa?
  rationale: Natural na maikling pagtanggi sa Filipino na pinananatili ang idiomatikong tanong at hindi nagdaragdag ng tiyak na dahilan.
- source_word: אֶמְצָא חֵן בְּעֵינֵי אֲדֹנִי
  choice: Maging kalugod-lugod na lamang sana ako sa paningin ng panginoon ko
  rationale: Pinananatili ang idyomang 'makasumpong ng kagandahang-loob sa paningin' sa mas natural na Filipino, kasama ang magalang na pagtukoy ni Jacob kay Esau bilang panginoon.
theological_decisions:
- issue: Kung ang huling pahayag ay kahilingan para sa patuloy na kagandahang-loob o pahiwatig na sapat na iyon
  choice: Maging kalugod-lugod na lamang sana ako sa paningin ng panginoon ko
  alternative: Hayaan mo lamang na makasumpong ako ng kagandahang-loob sa paningin ng panginoon ko
  rationale: Pinananatili ang pakiusap at bahagyang di-tiyak na ugnayan nito sa magalang na pagtanggi ni Jacob, nang hindi ipinapaliwanag nang higit sa Hebreo.
translation_notes:
  register: Modernong Filipino na magalang at marangal. Tahasang pinangalanan si Jacob sa ikalawang sugnay upang maiwasan ang kalituhan sa salit-salit na nagsasalita, habang hindi binabago ang kahulugan.
