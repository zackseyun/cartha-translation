- from: Sinabi ni Esau, “Hayaan mong iwan ko sa iyo ang ilan sa mga taong kasama ko.” Ngunit sinabi ni Jacob, “Bakit pa? Maging kalugod-lugod na lamang sana ako sa paningin ng panginoon ko.”
  to: Sinabi ni Esau, “Hayaan mong iwan ko sa iyo ang ilan sa mga taong kasama ko.” Ngunit sinabi ni Jacob, “Bakit pa? Makasumpong sana ako ng kagandahang-loob sa paningin ng panginoon ko.”
  rationale: Pinalitan lamang ang huling pahayag upang mapanatili ang Hebreong idyoma na ‘makasumpong ng kagandahang-loob sa paningin ng aking panginoon.’ Hindi dinagdagan ng paliwanag ang dahilan ng pagtanggi ni Jacob, at pinanatili ang magalang na rehistro at ang kalabuan ng maikling tanong.
