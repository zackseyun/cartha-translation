  text: וַ/יָּ֣מָת יוֹסֵ֔ף בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִ֑ים וַ/יַּחַנְט֣וּ אֹת֔/וֹ וַ/יִּ֥ישֶׂם בָּ/אָר֖וֹן בְּ/מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/026.yaml
  text: So Joseph died at the age of a hundred and ten years[c][b][a], and they embalmed him and placed him in a coffin in Egypt.
translation:
  language: tl
  text: Kaya[a] namatay si Jose sa edad na isandaan at sampung taon. Inembalsamo[b] nila siya at inilagay sa isang kabaong[c] sa Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At namatay si Jose sa edad na isandaan at sampung taon.” Maaari ring isalin ang panimulang pang-ugnay bilang “At”; ipinakikita ng “Kaya” ang pangwakas na daloy ng salaysay.
    reason: lexical_alternative
  - marker: b
    text: O, “ginawa nila siyang momya.” Tumutukoy ang pandiwang Hebreo sa pag-eembalsamo, lalo na sa kontekstong Ehipsiyo.
    reason: cultural_note
  - marker: c
    text: Ang salitang Hebreo rito ay ang pangngalan ding ginagamit sa ibang lugar para sa isang kahon o kaban; sa kontekstong ito ng kamatayan, nangangahulugan itong “kabaong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: namatay
  rationale: Tuwiran at likas na katumbas ng pandiwang מוּת, nang walang eupemismo.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: sa edad na isandaan at sampung taon
  rationale: Ang literal na Hebreong idyomang “anak ng isandaan at sampung taon” ay likas na ipinapahayag sa Filipino bilang edad.
- source_word: וַיַּחַנְטוּ
  choice: inembalsamo nila
  rationale: Ang חנט ay tumutukoy sa pag-eembalsamo, lalo na sa kontekstong Ehipsiyo; mas tuwiran ito kaysa sa mas interpretatibong “ginawang momya.”
- source_word: וַיִּישֶׂם
  choice: inilagay
  rationale: Likas at marangal na katumbas ng karaniwang pandiwang שׂים na nangangahulugang ilagay o ipuwesto.
- source_word: בָּאָרוֹן
  choice: sa isang kabaong
  rationale: Maaaring mangahulugan ang אָרוֹן ng kahon, kaban, o kabaong; malinaw na “kabaong” ang hinihingi ng konteksto ng pag-eembalsamo at kamatayan. Ginamit ang “isang” sapagkat ngayon pa lamang ipinakikilala ang sisidlan sa salaysay.
- source_word: בְּמִצְרָיִם
  choice: sa Ehipto
  rationale: Karaniwang modernong Filipino na anyo ng pangalan ng lugar.
- source_word: וַ
  choice: Kaya
  rationale: Ipinagpapatuloy ng panimulang waw ang salaysay at dito ay may pangwakas na daloy; natural itong naihahayag ng “Kaya,” habang itinatala sa talababa ang mas payak na “At.”
