translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang maikling pangwakas na himig ng Genesis, at inilagay ang mga talababa sa mismong salitang tinutukoy ng bawat isa.
