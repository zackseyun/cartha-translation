  text: But Joseph said to them[a], “Do not fear, for am I in the place of God?”
translation:
  language: tl
  text: Ngunit sinabi ni Jose sa kanila, “Huwag kayong matakot, sapagkat ako ba'y nasa lugar ng Diyos?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ako ba ay nasa ilalim ng Diyos?” Idyomatiko ang pariralang Hebreo; sa kontekstong ito, malamang na ang ibig sabihin ay “Ako ba'y nasa lugar ng Diyos?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  choice: Ngunit sinabi sa kanila ni Jose
  rationale: Ang וַיֹּאמֶר ay karaniwang pandiwang pasalaysay na ‘sinabi’; ang ‘Ngunit’ ay likas na naghahayag ng pagsalungat sa pangamba ng mga kapatid sa naunang konteksto. Inilipat ang pangalan sa karaniwang ayos ng modernong Tagalog.
- source_word: אַל תִּירָאוּ
  choice: Huwag kayong matakot
  rationale: Natural at tuwirang salin ng negatibong pakiusap o utos sa maramihang kausap.
- source_word: כִּי
  choice: hindi isinalin bilang hiwalay na salita
  rationale: Ipinakikilala nito ang batayan ng pagpapalakas-loob. Sa modernong Tagalog, malinaw at natural ang ugnayan sa magkasunod na pangungusap kahit walang tahasang ‘sapagkat’; ang paggamit nito bago ang retorikal na tanong ay magiging mas mabigat.
- source_word: הֲתַחַת אֱלֹהִים אָֽנִי
  choice: Ako ba ang nasa lugar ng Diyos?
  rationale: Pinananatili ang retorikal na tanong at ang idiomatikong diwang pagtayo sa lugar o tungkulin ng Diyos, nang hindi dinaragdagan ang ‘hukom’ o ‘tagapaghiganti’ na wala sa mismong teksto.
theological_decisions:
- issue: Puwersa ng retorikal na tanong tungkol sa banal na karapatan
  choice: Itinatanggi ni Jose na siya ang nasa lugar ng Diyos.
  alternative: ‘Nasa ilalim ba ako ng Diyos?’
  rationale: Sa konteksto ng pangamba sa paghihiganti, pinakamalamang na ang תַּחַת אֱלֹהִים ay tumutukoy sa pag-angkin sa lugar o karapatan ng Diyos. Gayunman, itinatala sa talababa ang mas literal na alternatibo upang mapanatili ang tunay na leksikal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Jose’ ayon sa karaniwang anyo ng pangalang biblikal sa Tagalog, at ‘Huwag kayong matakot’ bilang natural na pananalita sa maramihang kausap.
