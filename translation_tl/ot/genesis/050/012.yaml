translation:
  language: tl
  text: Kaya ginawa ng mga anak niyang lalaki para sa kanya ang iniutos niya sa kanila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ginawa
  rationale: Ang עשה ay malawak ang kahulugang “gawin.” Sa konteksto, tinupad ng mga anak ang mga tagubilin tungkol sa paglilibing; ang “ginawa” ang pinakanatural at tuwirang salin.
- source_word: בָנָיו
  choice: mga anak niya
  rationale: Bagaman maaaring tukuyin ng “anak” sa Filipino ang anak na lalaki o babae, malinaw sa konteksto na ang tinutukoy ay ang mga anak na lalaki ni Jacob. Mas natural sa modernong Filipino ang “mga anak niya” kaysa “mga anak na lalaki niya.”
- source_word: לוֹ
  choice: para sa kanya
  rationale: Ipinahihiwatig ng ל dito na ang ginawa ay alang-alang o sa kapakanan ni Jacob, kaya ang “para sa kanya” ang natural at tumpak sa konteksto.
- source_word: כֵּן
  choice: Kaya … ang
  rationale: Ang כֵּן ay tumutukoy sa paraang naaayon sa kasunod na sugnay. Sa Filipino, natural itong maipahayag sa hulma na “Kaya ginawa … ang iniutos,” na naghahatid ng resulta at pagsunod sa utos.
- source_word: כַּאֲשֶׁר
  choice: ang
  rationale: Ang ideya ng pagsunod “ayon sa” utos ay natural na naipapahayag sa Filipino sa pamamagitan ng “ginawa … ang iniutos,” nang hindi kailangang piliting isalin nang hiwalay ang panghambing na kataga.
- source_word: צִוָּם
  choice: iniutos niya sa kanila
  rationale: Ang צוה ay “mag-utos.” Ang aspektong nauna ang utos bago ang pagkilos ay sapat nang malinaw sa anyong “iniutos” at sa daloy ng salaysay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, maikli, at marangal. Pinanatili ang tahasang ugnayan ng ginawa ng mga anak sa naunang utos ni Jacob; walang idinagdag na paliwanag o denominasyonal na pagbasa.
