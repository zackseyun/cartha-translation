revisions:
- from: Nang dumating sila sa giikan ng Atad[a], na nasa ibayo ng Jordan[b], nagdaos sila roon ng napakatindi at napakabigat na panaghoy[c]. At nagdaos siya[d] ng pitong araw na pagluluksa para sa kanyang ama.
  to: Nang makarating sila sa giikan ng Atad[a], na nasa ibayo ng Jordan[b], nagdalamhati sila roon nang may matindi at napakabigat na panaghoy[c]. At nagdaos siya[d] ng pagluluksa para sa kanyang ama sa loob ng pitong araw.
  rationale: Pinalitan ang konstruksiyong ‘nagdaos sila ... ng panaghoy’ upang tuwirang katawanin ang plural na pandiwang Hebreo para sa pormal na pagdadalamhati. Pinanatili ang hiwalay na ‘nagdaos siya ng pagluluksa’ sa huling sugnay, sapagkat ito ang natural na katumbas ng idiomang עשה אֵבֶל at pinangangalagaan ang isahang anyo ng tekstong Masoretiko. Inayos din ang tagal bilang ‘sa loob ng pitong araw’ nang walang pagbabago sa kahulugan.
