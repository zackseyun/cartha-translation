  naturalness: Ang ‘nagdaos ... ng panaghoy’ ay hindi ang pinakanatural na modernong Filipino para sa hayag na pagdadalamhati. Ang ‘nagdalamhati sila roon nang may ... panaghoy’ ay mas malinaw at pinananatili ang pormal na funeraryong diwa. Ang ‘sa loob ng pitong araw’ ay natural na paglalahad ng tagal.
  terminology: Ang ‘giikan,’ ‘Atad,’ ‘ibayo ng Jordan,’ ‘pagluluksa,’ at ang isahang ‘siya’ ay angkop. Pinanatili ang ‘mabigat’ sa paglalarawan ng panaghoy upang katawanin ang Hebreong כָבֵד, kahit idiomatiko itong pagpapahiwatig ng tinding pagdadalamhati.
