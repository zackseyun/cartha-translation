id: GEN.50.10
reference: Genesis 50:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַד גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּ֨סְפְּדוּ שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְ/כָבֵ֖ד מְאֹ֑ד וַ/יַּ֧עַשׂ לְ/אָבִ֛י/ו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/010.yaml
  text: When they came to the threshing floor of Atad[a], which is beyond the Jordan, they lamented there with a very great and grievous lamentation[e][d][c][b], and he observed seven days of mourning for his father.
translation:
  language: tl
  text: Nang makarating sila sa giikan ng Atad[a], na nasa ibayo ng Jordan[b], nagdalamhati sila roon nang may matindi at napakabigat na panaghoy[c]. At nagdaos siya[d] ng pagluluksa para sa kanyang ama sa loob ng pitong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Atad ay maaaring kaugnay ng salitang nangangahulugang “tinikang palumpong,” ngunit dito ay bahagi ito ng pangalan ng isang lugar.
    reason: lexical_alternative
  - marker: b
    text: O “sa kabilang panig ng Jordan.” Hindi tinutukoy ng pariralang Hebreo rito kung aling panig ang tinutukoy.
    reason: alternative_reading
  - marker: c
    text: Sa Hebreo, “isang dakila at napakabigat na panaghoy”—isang matinding paglalarawan ng pagdadalamhati.
    reason: cultural_note
  - marker: d
    text: Isahan ang pandiwang Hebreo (“nagdaos siya”), at malamang na tumutukoy kay Jose. Maaaring gawing “nagdaos sila” ayon sa buong pangkat, ngunit hindi nito mapananatili ang paglipat sa isahan sa tekstong Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּרֶן
  choice: giikan
  rationale: Ito ang likas at maikling salitang Tagalog para sa lugar kung saan ginigiik ang ani.
- source_word: הָאָטָד
  choice: Atad
  rationale: Gumaganap itong pangalang pantangi sa pariralang pangalan ng lugar; pinanatili ang transliterasyon at ipinaliwanag sa talababa ang posibleng kahulugang leksikal.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: nasa ibayo ng Jordan
  rationale: Pinananatili nito ang perspektibong hindi tiyak ng Hebreong ‘sa kabilang panig/ibayo’ nang hindi nagpapasya kung silangan o kanluran.
- source_word: וַיִּסְפְּדוּ
  choice: nagdaos sila ... ng ... panaghoy
  rationale: Ipinahihiwatig ng ספד ang hayag o pormal na panaghoy para sa namatay; natural sa Tagalog ang ‘nagdaos ... ng panaghoy’ sa kontekstong ito.
- source_word: מִסְפֵּד גָּדוֹל וְכָבֵד מְאֹד
  choice: napakatindi at napakabigat na panaghoy
  rationale: Ang ‘matindi’ ay naghahatid ng lakas ng גָּדוֹל sa konteksto, samantalang pinananatili ng ‘mabigat’ ang larawang Hebreo ng כָבֵד at ang tindi ng pagdadalamhati.
- source_word: וַיַּעַשׂ ... אֵבֶל
  choice: nagdaos siya ... ng pagluluksa
  rationale: Idyomatikong tumutukoy ang עשה kasama ng אֵבֶל sa pagdaraos ng takdang panahon ng pagluluksa, hindi lamang sa literal na ‘paggawa.’
- source_word: לְאָבִיו
  choice: para sa kanyang ama
  rationale: Pinananatili ang panlalaking isahang hulapi at ang natural na ugnayan nito sa isahang simuno ng pandiwa.
- source_word: שִׁבְעַת יָמִים
  choice: pitong araw
  rationale: Tuwirang ipinapahayag ang tagal ng pagdaraos ng pagluluksa.
theological_decisions:
- issue: Simuno ng isahang וַיַּעַשׂ matapos ang mga pandiwang maramihan
  choice: 'Pinanatili ang isahan: “nagdaos siya,” na malamang ay tumutukoy kay Jose.'
  alternative: “Nagdaos sila” bilang pagtukoy sa buong pangkat.
  rationale: Malinaw na lumilipat ang tekstong Masoretiko mula sa maramihang ‘dumating sila’ at ‘nagpanaghoy sila’ tungo sa isahang pandiwa. Ang pagpapanatili sa isahan ay nag-iingat sa anyo at posibleng diin ng pinagmulan nang hindi ginagawang tahasan ang pangalang Jose sa pangunahing teksto.
translation_notes:
  register: Makabago at dignified na Filipino; ginamit ang karaniwang ‘giikan,’ ‘panaghoy,’ at ‘pagluluksa.’ Pinanatili ang Hebreong imahen ng bigat sa ‘napakabigat’ at ang tunay na kalabuan ng heograpikong pariralang ‘ibayo ng Jordan.’
