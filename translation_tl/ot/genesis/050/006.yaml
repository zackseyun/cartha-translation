- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na pagsulong ng salaysay sa Filipino; hindi kailangang laging isalin nang tahasan ang waw-consecutive bilang “at.”
- source_word: פַּרְעֹה
  choice: ng Paraon
  rationale: Karaniwang katawagan sa Filipino para sa pinuno ng Ehipto.
- source_word: עֲלֵה
  choice: Umakyat ka
  rationale: Pinananatili ang direksiyonal na diwa ng עלה sa paglalakbay mula Ehipto patungong Canaan.
- source_word: וּקְבֹר
  choice: at ilibing mo
  rationale: Tuwirang katumbas ng קבר at natural sa makabagong Filipino.
- source_word: אֶת אָבִיךָ
  choice: ang iyong ama
  rationale: Tuwirang paglilipat ng pangngalan na may panlaping ikalawang panauhang panlalaki na isahan.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Natural na naghahayag ng paraan o pagtutulad sa Filipino.
- source_word: הִשְׁבִּיעֶךָ
  choice: ipinangako mo sa kanya sa ilalim ng panunumpa
  rationale: Ipinahahayag nang natural sa Filipino na ang ama ang nagpasumpa kay Jose, habang iniiwasan ang posibleng diwang sapilitan ng literal na “pinilit kang manumpa.”
