base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/005.yaml
  text: My father made me swear, saying, ‘Look, I am dying. In my grave that I dug for myself in the land of Canaan, there you shall bury me.’ So now, please let me go up and bury my father; then I will return.
translation:
  language: tl
  text: Pinasumpa ako ng aking ama. Sinabi niya, ‘Narito, mamamatay na ako. Ilibing mo ako roon, sa aking libingang hinukay[a] ko para sa sarili ko sa lupain ng Canaan.’ Kaya ngayon, nakikiusap akong pahintulutan ninyo akong pumunta sa Canaan upang ilibing ang aking ama; pagkatapos ay babalik ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, binili ko.
    reason: Ang pandiwang Hebreo ay karaniwang inuunawang ‘hinukay,’ ngunit may alternatibong pag-unawa na ‘binili.’
lexical_decisions:
- source_word: הִשְׁבִּיעַנִי
  choice: Pinanumpa ako
  rationale: 'Tuwirang ipinapahayag ang causative na diwa: pinagawa ng ama kay Jose ang isang panunumpa.'
- source_word: הִנֵּה אָנֹכִי מֵת
  choice: Malapit na akong mamatay
  rationale: Sa kontekstong ito, ang participle na מֵת ay tumutukoy sa nalalapit na kamatayan; natural itong ipinahahayag sa modernong Tagalog nang hindi isinasalin nang literal ang discourse marker na הִנֵּה.
- source_word: כָּרִיתִי
  choice: hinukay ko
  rationale: Pinananatili ang karaniwang leksikal na diwa ng paghukay/paghanda ng libingan, bagaman maaari ring unawain ang anyo bilang ‘binili ko.’
- source_word: אֶעֱלֶה נָּא
  choice: nakikiusap akong pahintulutan ninyo akong pumunta roon
  rationale: Ipinahahayag ang magalang na pakiusap ng נָּא at ang pragmatikong kahulugan ng paghingi ni Jose ng pahintulot; ang ‘pumunta roon’ ay mas natural kaysa literal na ‘umahon’ sa Tagalog.
- source_word: וְאָשׁוּבָה
  choice: pagkatapos ay babalik ako
  rationale: Malinaw at tuwirang pinananatili ang pangako ni Jose na bumalik sa Ehipto.
