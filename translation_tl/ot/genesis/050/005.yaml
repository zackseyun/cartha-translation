  source_fidelity: 'Kailangang ituwid ang pandiwang sanhi: הִשְׁבִּיעַנִי ay ‘pinasumpa ako,’ hindi ang mas malabong ‘pinanumpa ako.’ Pinananatili ng rebisyon ang pakiusap ni Jose, ang pagpunta sa Canaan, at ang pangako niyang bumalik. Nilagyan din ng talababa ang pinagtatalunang diwa ng כָּרִיתִי.'
  naturalness: Mas natural sa modernong Filipino ang ‘Pinasumpa ako ng aking ama’ at ‘mamamatay na ako.’ Inayos din ang hindi magkatugmang panipi. Ang ‘pahintulutan ninyo’ ay angkop dahil nagsasalita si Jose sa sambahayan o mga kinatawan ng paraon sa konteksto.
  terminology: Pinanatili ang ‘Canaan’ at ang payak ngunit marangal na ‘ilibing.’ Ang ‘hinukay’ ang pangunahing salin para sa libingan, habang ang posibleng alternatibong pagbasa na ‘binili’ ay hindi itinuring na tiyak at inilagay sa talababa.
