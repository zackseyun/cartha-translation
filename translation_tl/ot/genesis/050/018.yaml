  source_fidelity: 'Tumpak ang pagsasalin sa Hebreo: ang גַּם ay naipahayag ng “din,” ang paglapit ng mga kapatid ay natural na “Dumating,” at ang וַיִּפְּלוּ לְפָנָיו ay wastong naipakita bilang “nagpatirapa sa harap niya,” na pinananatili ang kilos at pagpapasakop. Ang “Narito kami, mga alipin mo” ay malinaw na tumutugma sa הִנֶּנּוּ לְךָ לַעֲבָדִים.'
