base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/018.yaml
  text: Then his brothers also came and fell down before him and said[a], “Here we are, your servants.”
translation:
  language: tl
  text: Dumating din ang kanyang mga kapatid at nagpatirapa sa harap niya. Sinabi nila, “Narito kami, mga alipin mo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lingkod mo.” Ang salitang Hebreo na עֲבָדִים ay maaaring tumukoy sa mga alipin o sa mga lingkod; dito, ipinapakita ng “mga alipin” ang matindi nilang pagpapasakop kay Jose.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ גַּם אֶחָיו
  choice: Dumating din ang kanyang mga kapatid
  rationale: Bagaman literal na ‘pumunta’ ang הלך, ang kilos ay patungo kay Jose; natural sa salaysay na Filipino ang ‘dumating.’ Ipinananatili ng ‘din’ ang pandagdag na diin ng גַּם.
- source_word: וַיִּפְּלוּ לְפָנָיו
  choice: nagpatirapa sa harap niya
  rationale: Ipinahahayag ng נפל + לפני ang aktuwal na pagyukod o pagpapatirapa bilang tanda ng matinding pagpapasakop, hindi lamang isang di-sinasadyang pagkabuwal.
- source_word: הִנֶּנּוּ
  choice: Narito kami
  rationale: Natural na Filipino para sa pormulang nagpapakilala o naghahandog ng sarili, nang hindi gumagamit ng makalumang pananalita.
- source_word: לְךָ לַעֲבָדִים
  choice: mga alipin mo
  rationale: Ang pangungusap ay naghahayag na ipinauubaya nila ang kanilang sarili sa kapangyarihan ni Jose. Mas malinaw na naipapakita ng ‘mga alipin mo’ ang tindi ng pagpapasakop, habang itinatala sa talababa ang posibleng ‘mga lingkod mo.’
theological_decisions:
- issue: Saklaw ng kahulugan ng עֲבָדִים sa paghahayag ng pagpapasakop
  choice: mga alipin mo
  alternative: mga lingkod mo
  rationale: Maaaring tumukoy ang עֲבָדִים sa mga alipin o mga lingkod. Sa tagpong ito, ang pagpapatirapa at paghahandog nila ng sarili sa kapangyarihan ni Jose ay pumapabor sa mas matinding ‘alipin,’ ngunit hindi inaalis ang lehitimong mas malawak na kahulugan kaya inilagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘nagpatirapa’ upang mailarawan nang maikli at natural ang pisikal na kilos ng pagpapasakop; iniwasan ang makalumang ‘narito, masdan’ at ang sobrang pormal na ayos ng pangungusap.
