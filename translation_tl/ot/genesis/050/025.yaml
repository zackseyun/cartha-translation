base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/025.yaml
  text: Then Joseph made the sons of Israel swear, saying, “God will surely attend to you, and you must bring up my bones from here.”
translation:
  language: tl
  text: At pinasumpa ni Jose ang mga anak ni Israel. Sinabi niya, “Tiyak na lilingapin kayo ng Diyos, at iaahon ninyo mula rito ang aking mga buto.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: pinanumpa
  rationale: Ipinapahayag nito na si Jose ang nagpasumpa sa kanila, hindi na siya mismo ang nanumpa.
- source_word: פָּקֹד יִפְקֹד
  choice: Tiyak na aalalahanin
  rationale: Ang inuulit na anyo ng pandiwa ay nagbibigay-diin sa katiyakan. Sa konteksto, ang pag-alala ng Diyos ay may kasamang pagkilos at paglingap, hindi lamang paggunita.
- source_word: וְהַעֲלִתֶם
  choice: iaahon ninyo
  rationale: Pinananatili ang direksiyong ‘paakyat’ at ang obligasyong kalakip ng panunumpa, habang natural sa modernong Tagalog.
- source_word: עַצְמֹתַי
  choice: aking mga buto
  rationale: Tuwirang katumbas ng pangmaramihang anyo sa Hebreo at karaniwang pananalita tungkol sa mga labi ni Jose.
theological_decisions:
- issue: Kahulugan ng pagdalaw o pag-alala ng Diyos
  choice: aalalahanin kayo ng Diyos
  alternative: dadalawin kayo ng Diyos / tiyak na kikilos ang Diyos para sa inyo
  rationale: 'Pinananatili ang malawak na saklaw ng Hebreong פקד: mapagkalingang pagpansin na humahantong sa pagkilos. Hindi nito nililimitahan ang kahulugan sa isang literal na pagdalaw lamang.'
- issue: Lakas ng utos sa pagdadala ng mga buto
  choice: iaahon ninyo
  alternative: dapat ninyong iahon
  rationale: Ang obligasyon ay malinaw na nagmumula sa panunumpang ipinagawa ni Jose; hindi kailangang dagdagan ng hiwalay na ‘dapat,’ na wala bilang modal na salita sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mga anak ni Israel” upang mapanatili ang anyo ng pinagmulang teksto at ang ugnayan nito sa sambayanang Israel; iniwasan ang mas interpretatibong “mga Israelita.”
