  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: si Jose ang nagpasumpa sa mga anak ni Israel, at ang pahayag ay may diin sa tiyak na pagkilos ng Diyos at sa pag-aahon ng mga buto ni Jose. Gayunman, ang “aalalahanin” ay maaaring unawaing paggunita lamang at hindi sapat na naihahayag ang pagkilos/paglingap na saklaw ng פָּקֹד יִפְקֹד sa kontekstong ito.'
