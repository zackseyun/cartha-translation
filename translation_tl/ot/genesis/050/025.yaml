  terminology: Ang “Diyos,” “mga anak ni Israel,” at “aking mga buto” ay angkop. Ang “lilingapin” ay mas mahusay na katumbas ng mapagkalingang pagkilos ng Diyos kaysa “aalalahanin,” nang hindi ipinapataw ang isang makitid na teolohikal na pakahulugan.
