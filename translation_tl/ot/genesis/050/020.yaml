    text: O, sa mas pormal na anyo, “gaya ng nangyayari sa araw na ito.” Tumutukoy ang idyomang Hebreo sa kasalukuyang kinalabasang hayag na ngayon.
    reason: lexical_alternative
  revision_rationale: Inayos ang parirala para sa עֲשֹׂה כַּיּוֹם הַזֶּה upang maipahayag ang layuning pagkilos ng Diyos at ang kasalukuyang hayag na resulta, nang hindi ginagawang di-natural ang Tagalog. Inalis din ang hindi kailangang “natin,” ginawang mas natural ang panghuling layuning parirala, at pinahina ang labis na diin ng “napakaraming.”
