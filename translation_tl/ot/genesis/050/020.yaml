revisions:
- from: Kayo ay nagbalak ng masama laban sa akin, ngunit binalak iyon ng Diyos para sa ikabubuti, upang mangyari ang nakikita natin sa araw na ito[a]—ang mapanatiling buhay ang napakaraming tao.
  to: Kayo ay nagbalak ng masama laban sa akin, ngunit binalak ito ng Diyos para sa ikabubuti, upang maisakatuparan ang nakikita ngayon[a]—upang mapanatiling buhay ang maraming tao.
  rationale: Inayos ang parirala para sa עֲשֹׂה כַּיּוֹם הַזֶּה upang maipahayag ang layuning pagkilos ng Diyos at ang kasalukuyang hayag na resulta, nang hindi ginagawang di-natural ang Tagalog. Inalis din ang hindi kailangang “natin,” ginawang mas natural ang panghuling layuning parirala, at pinahina ang labis na diin ng “napakaraming.”
