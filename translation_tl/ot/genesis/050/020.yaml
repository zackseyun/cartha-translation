  text: וְ/אַתֶּ֕ם חֲשַׁבְתֶּ֥ם עָלַ֖/י רָעָ֑ה אֱלֹהִים֙ חֲשָׁבָ֣/הּ לְ/טֹבָ֔ה לְמַ֗עַן עֲשֹׂ֛ה כַּ/יּ֥וֹם הַ/זֶּ֖ה לְ/הַחֲיֹ֥ת עַם רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/020.yaml
  text: As for you[a], you intended evil against me, but God intended it for good, in order to bring about what is happening this day—to keep many people alive.
translation:
  language: tl
  text: Kayo ay nagbalak ng masama laban sa akin, ngunit binalak ito ng Diyos para sa ikabubuti, upang maisakatuparan ang nakikita ngayon[a]—upang mapanatiling buhay ang maraming tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na anyo, “gaya ng nangyayari sa araw na ito.” Tumutukoy ang idyomang Hebreo sa kasalukuyang kinalabasang hayag na ngayon.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲשַׁבְתֶּם / חֲשָׁבָהּ
  choice: nagbalak / binalak
  rationale: Iisang salitang-ugat ang ginamit sa dalawang bahagi upang mapanatili ang sinadyang pagkakatulad ng masamang balak ng mga kapatid at mabuting layunin ng Diyos.
- source_word: עָלַי רָעָה
  choice: ng masama laban sa akin
  rationale: Ipinahahayag ng עָלַי ang pagkapoot o pagsalungat sa kontekstong ito, at pinananatili ng “masama” ang moral na bigat ng רָעָה.
- source_word: לְטֹבָה
  choice: para sa ikabubuti
  rationale: Natural ito sa makabagong Tagalog at malinaw na kasalungat ng “masama,” habang tumutukoy sa mabuting kinahinatnan o layunin.
- source_word: לְמַעַן עֲשֹׂה כַּיּוֹם הַזֶּה
  choice: upang mangyari ang nakikita natin sa araw na ito
  rationale: Ipinakikita ng “upang” ang layunin; ipinahahayag naman ng natitirang parirala ang kasalukuyang kinalabasang hayag at nakikita, sa halip na ang di-natural na literal na “gawin gaya ng araw na ito.”
- source_word: לְהַחֲיֹת עַם רָב
  choice: ang mapanatiling buhay ang napakaraming tao
  rationale: Ang Hiphil ng חיה ay nangangahulugang magpanatili ng buhay. Ipinahahayag ng “napakaraming tao” ang malaking bilang na tinutukoy ng עַם רָב nang hindi kinakailangang ipahiwatig ang isang partikular na pangkat-etniko.
theological_decisions:
- issue: Ang kalooban ng Diyos at ang masamang balak ng tao sa magkatulad na gamit ng חשב
  choice: 'Panatilihin ang iisang pangunahing pandiwa: “nagbalak/binalak.”'
  alternative: Gumamit ng magkaibang pandiwa, gaya ng “nagbalak” para sa mga tao at “ginawang” o “ibinaling” para sa Diyos.
  rationale: Sadyang magkatugma ang dalawang gamit ng pandiwa sa Hebreo. Pinananatili nito ang tensiyon na tunay na nagbalak ng masama ang mga kapatid, samantalang tunay na binalak ng Diyos ang pangyayari para sa ikabubuti, nang hindi ipinapaliwanag nang higit sa sinasabi ng teksto.
- issue: Moral na kahulugan ng רָעָה
  choice: “masama”
  alternative: “kapahamakan” o “pinsala”
  rationale: May pananagutang moral ang ginawa ng mga kapatid; hindi lamang ito isang di-kanais-nais na pangyayari. Kaya pinananatili ang malinaw na pagsalungat ng masama at mabuti.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Kayo ay” bilang tahasang pambungad na may diin, at ang gitling-pahaba upang ilahad ang tiyak na layunin: ang pagpapanatiling buhay sa napakaraming tao.'
