  text: Pagkatapos, dumapa si Jose sa mukha ng kanyang ama[a], tinangisan niya ito, at hinalikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Bumagsak si Jose sa mukha ng kanyang ama.” Mas literal nitong pinananatili ang matingkad na pisikal na larawan ng Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: yumukod
  rationale: Ang wayyiqtol ng נפל ay nagsasaad ng natapos na kilos. Sa kontekstong nakahilig si Jose sa bangkay ng ama, mas natural sa modernong Tagalog ang “yumukod” kaysa literal na “bumagsak,” nang hindi ipinahihiwatig na aksidente siyang natumba.
- source_word: עַל פְּנֵי אָבִיו
  choice: sa mukha ng kanyang ama
  rationale: Pinananatili ang kongkretong larawan ng Hebreong “sa ibabaw/harap ng mukha ng kanyang ama,” sa halip na gawing malabong kilos ng pagdadalamhati.
- source_word: וַיֵּבְךְּ עָלָיו
  choice: umiyak sa ibabaw niya
  rationale: Ang בכה ay “umiyak/tumangis,” at ang עַל ay maaaring maglarawan sa pisikal na posisyon ni Jose sa ibabaw ng ama habang nagdadalamhati. Pinananatili rito ang pisikal na larawan at ang kaugnayan nito sa pagluluksa.
- source_word: וַיִּשַּׁק לוֹ
  choice: hinalikan siya
  rationale: Ang Qal ng נשק ay karaniwang nangangahulugang “humalik”; natural itong ipinahahayag sa Tagalog bilang “hinalikan siya.”
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa modernong Tagalog.
