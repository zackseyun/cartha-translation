  text: So now[a], do not be afraid. I myself will provide for you and your little ones.” Thus he comforted them and spoke to their hearts.
translation:
  language: tl
  text: Kaya ngayon, huwag kayong matakot. Ako mismo ang maglalaan para sa inyo at sa inyong maliliit na anak.” At inaliw niya sila at nagsalita siya nang buong lambing sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nagsalita sa kanilang puso”; maaari ring “kinausap sila nang may kabaitan” o “kinausap sila upang palakasin ang kanilang loob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Pinananatili ang pang-ugnay at temporal na diwa bilang natural na panandang naghahatid sa pangwakas na katiyakan ni Jose.
- source_word: אַל תִּירָאוּ
  choice: huwag kayong matakot
  rationale: Karaniwan at malinaw na makabagong Tagalog para sa pagbabawal na may himig ng pagpapalakas ng loob.
- source_word: אָנֹכִי
  choice: Ako mismo
  rationale: Inihahayag ang diin ng hiwalay na panghalip at ang personal na pananagutan ni Jose.
- source_word: אֲכַלְכֵּל
  choice: maglalaan para sa
  rationale: Ipinahihiwatig ang patuloy na pagtustos, lalo na ng pagkain at iba pang pangangailangan, nang natural sa Tagalog.
- source_word: טַפְּכֶם
  choice: inyong maliliit na anak
  rationale: Pinananatili ang tiyak na pahiwatig sa mga batang paslit, sa halip na ang mas malawak na “mga anak” o “mga umaasa sa inyo.”
- source_word: וַיְנַחֵם אֹתָם
  choice: Sa gayon, inaliw niya sila
  rationale: Ang “inaliw” ay natural na paglalarawan sa pagbibigay ni Jose ng ginhawa at katiyakan; ipinapakita ng “Sa gayon” na bunga ito ng kaniyang sinabi.
- source_word: וַיְדַבֵּר עַל לִבָּם
  choice: kinausap nang buong lambing
  rationale: Natural na Tagalog para sa Hebreong idyomang literal na “nagsalita sa kanilang puso,” na tumutukoy sa magiliw at nakapagpapalakas-loob na pananalita.
