  yaml_path: translation/ot/genesis/050/014.yaml
  text: Then Joseph returned to Egypt[a], he and his brothers and all who had gone up with him to bury his father[b], after he had buried his father.
translation:
  language: tl
  text: Pagkatapos, bumalik si Jose sa Ehipto, kasama ang kanyang mga kapatid at ang lahat ng sumama sa kanya sa pag-akyat[a] upang ilibing ang kanyang ama, matapos niyang ilibing ang kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pag-akyat” ay karaniwang pananalita sa Bibliya para sa paglalakbay mula sa Ehipto patungong Canaan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Ang pandiwa mula sa שׁוב ay nagsasaad na nagbalik si Jose sa lugar na dati niyang pinanggalingan; likas at tuwiran itong ipinapahayag ng “bumalik.”
- source_word: מִצְרַיְמָה
  choice: sa Ehipto
  rationale: Ang hulaping direksiyonal na ה ay nagpapahiwatig ng patungong Ehipto. Kasunod ng “bumalik,” natural sa Tagalog ang “sa Ehipto.”
- source_word: הוּא וְאֶחָיו
  choice: kasama ang kanyang mga kapatid
  rationale: Bagaman literal na “siya at ang kanyang mga kapatid,” mas natural sa Tagalog ang pariralang “kasama ang kanyang mga kapatid,” habang nananatiling si Jose ang pangunahing simuno.
- source_word: וְכָל הָעֹלִים אִתּוֹ
  choice: at ang lahat ng umakyat na kasama niya
  rationale: Pinananatili ng “umakyat” ang karaniwang idyomang Hebreo para sa paglalakbay mula Ehipto patungong Canaan. Ipinaliliwanag ito sa talababa upang hindi mapagkamalang tumutukoy lamang sa pisikal na pag-ahon.
- source_word: לִקְבֹּר אֶת אָבִיו
  choice: upang ilibing ang kanyang ama
  rationale: Ang infinitive na may ל ay nagpapahayag ng layunin; malinaw itong naihahatid ng “upang ilibing.”
- source_word: אַחֲרֵי קָבְרוֹ אֶת אָבִיו
  choice: matapos niyang ilibing ang kanyang ama
  rationale: Ipinahihiwatig ng אַחֲרֵי ang kasunod na panahon. Pinananatili rin ang tahasang pag-uulit ng “ang kanyang ama” sa Hebreo sa halip na palitan ito ng panghalip.
