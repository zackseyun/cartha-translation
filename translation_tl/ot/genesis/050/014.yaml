revisions:
- from: Pagkatapos nito, bumalik si Jose sa Ehipto, kasama ang kanyang mga kapatid at ang lahat ng umakyat na kasama niya[a] upang ilibing ang kanyang ama, matapos niyang ilibing ang kanyang ama.
  to: Pagkatapos, bumalik si Jose sa Ehipto, kasama ang kanyang mga kapatid at ang lahat ng sumama sa kanya sa pag-akyat[a] upang ilibing ang kanyang ama, matapos niyang ilibing ang kanyang ama.
  rationale: Inalis ang demonstratibong dagdag na “nito” at inayos ang parirala para sa mga kasamang naglakbay upang maging natural at malinaw sa modernong Tagalog. Pinanatili ang layunin ng paglalakbay, ang tahasang pag-uulit ng “kanyang ama,” at ang Hebreong idyoma ng pag-akyat na may talababa.
