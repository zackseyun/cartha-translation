translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Pinanatili ang Hebreong idyoma ng “umakyat” at ang pag-uulit ng “ang kanyang ama,” habang ginawang natural ang appositional na pariralang tumutukoy sa mga kasamang nagbalik ni Jose.
