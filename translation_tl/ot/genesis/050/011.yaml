revisions:
- from: Nang makita ng mga naninirahan sa lupain, ang mga Cananeo, ang pagluluksa sa giikan ng Atad, sinabi nila, “Napakatindi ng pagluluksang ito ng mga Egipcio.” Kaya tinawag na Abel Mizraim[a] ang lugar na iyon, na nasa kabila ng Jordan.[b]
  to: Nang makita ng mga Cananeong naninirahan sa lupain ang pagluluksa sa giikan ng Atad, sinabi nila, “Napakatindi ng pagluluksang ito ng mga Egipcio.” Kaya tinawag na Abel-Mizraim[a] ang lugar na iyon, na nasa kabila ng Jordan.[b]
  rationale: Inayos lamang ang pagpapakilala sa mga Cananeo upang maging higit na natural sa modernong Tagalog, at nilagyan ng gitling ang tambalang pangalang Abel-Mizraim. Walang binago sa kahulugan, sa di-tiyak na ahensiya ng pagpapangalan, o sa heograpikong pananaw ng “kabila ng Jordan.”
