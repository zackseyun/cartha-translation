translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Cananeo” at “Egipcio” bilang pamilyar na mga katawagang biblikal, at “giikan” para sa tiyak na sinaunang lugar ng paggiik.
