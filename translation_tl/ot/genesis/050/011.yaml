base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/011.yaml
  text: When the inhabitants of the land[a], the Canaanites, saw the mourning at the threshing floor of Atad, they said, “This is a grievous mourning for the Egyptians.” Therefore its name was called Abel-mizraim[c][b], which is beyond the Jordan.
translation:
  language: tl
  text: Nang makita ng mga Cananeong naninirahan sa lupain ang pagluluksa sa giikan ng Atad, sinabi nila, “Napakatindi ng pagluluksang ito ng mga Egipcio.” Kaya tinawag na Abel-Mizraim[a] ang lugar na iyon, na nasa kabila ng Jordan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Abel-Mizraim ay katunog ng pariralang Hebreo na nangangahulugang “pagluluksa ng Egipto,” ayon sa paglalarawan ng mga Cananeo sa pangyayari.
    reason: lexical_alternative
  - marker: b
    text: O “nasa kabilang ibayo ng Jordan”; nakasalalay sa kinaroroonan ng nagsasalita ang ekspresyong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַכְּנַעֲנִי
  choice: mga naninirahan sa lupain, ang mga Cananeo
  rationale: Ang pang-isahang participle ay kolektibo, at ang “mga Cananeo” ay appositional na pagkakakilanlan; pinananatili ng salin ang dalawang elementong ito sa natural na Tagalog.
- source_word: הָאֵבֶל
  choice: pagluluksa
  rationale: Tumutukoy ito sa pagdadalamhati at mga kaugalian ng pagluluksa para sa namatay, na angkop sa konteksto.
- source_word: בְּגֹרֶן הָאָטָד
  choice: sa giikan ng Atad
  rationale: Ang גֹּרֶן ay giikan o lugar ng paggiik; natural na lokatibong salin ang “sa.”
- source_word: אֵבֶל כָּבֵד
  choice: napakatinding pagluluksa
  rationale: Ang כָּבֵד ay literal na “mabigat” ngunit dito ay nagpapahayag ng sukdulang tindi; “napakatindi” ang natural at marangal na katumbas sa Tagalog.
- source_word: לְמִצְרָיִם
  choice: ng mga Egipcio
  rationale: Bagaman anyong pangalan ng bansang Egipto ang nasa Hebreo, iniuugnay ng konteksto ang pagluluksa sa pangkat na Egipcio; malinaw at likas ang genitibong Tagalog.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Likas at tuwirang panandang inferensiyal para sa paliwanag ng pagpapangalan.
- source_word: קָרָא שְׁמָהּ
  choice: tinawag na ... ang lugar na iyon
  rationale: Pinananatili ang pasibong di-tiyak na tagapagpangalan habang iniiwasan ang alanganing literal na “tinawag ang pangalan nito.” Ang “lugar” ay nililinaw mula sa lokatibong konteksto.
- source_word: אָבֵל מִצְרַיִם
  choice: Abel Mizraim
  rationale: Isinatinig ang pangalang pantangi at inilagay sa talababa ang larong-salita at kahulugan nito.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: nasa kabila ng Jordan
  rationale: Ipinahahayag ang heograpikong “other side,” habang kinikilala sa talababa na nakasalalay sa pananaw ang pagtukoy.
