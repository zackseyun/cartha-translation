base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/004.yaml
  text: When the days of his mourning had passed[a], Joseph spoke to Pharaoh’s household, saying, “If I have now found favor in your eyes, please speak in Pharaoh’s hearing[b], saying,”
translation:
  language: tl
  text: 'Nang matapos ang mga araw ng pagdadalamhati niya[a], sinabi ni Jose sa mga tauhan sa sambahayan ng Faraon, “Kung ako’y nakasumpong ng lingap sa inyo, pakisabi ninyo sa Faraon[b] ang ganito:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang mga araw ng pag-iyak niya.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa mga tainga ng Faraon,” isang idyomang nangangahulugang magsalita upang marinig niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: Nang matapos
  rationale: Ang pandiwang עבר ay tumutukoy sa paglipas o pagtatapos ng isang takdang panahon; natural itong nagsasaad ng pangyayaring nauna sa pagsasalita ni Jose.
- source_word: יְמֵי בְכִיתוֹ
  choice: ang mga araw ng pagdadalamhati niya
  rationale: Literal na tumutukoy ang בכי sa pag-iyak, ngunit sa konteksto ng libing, ang “pagdadalamhati” ang natural na katumbas habang pinananatili ang anyong “mga araw.”
- source_word: וַיְדַבֵּר יוֹסֵף
  choice: sinabi ni Jose
  rationale: Bagaman pangunahing nangangahulugang “nagsalita” ang דבר, mas natural sa Filipino ang “sinabi” bago ang pahayag na tuwirang sinipi.
- source_word: אֶל בֵּית פַּרְעֹה
  choice: sa mga tauhan sa sambahayan ng Faraon
  rationale: Ang בית ay tumutukoy rito sa maharlikang sambahayan o mga taong naglilingkod sa korte, hindi lamang sa gusali o sa nuklear na pamilya.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֵיכֶם
  choice: Kung kinalulugdan ninyo ako
  rationale: Natural na Filipino ito para sa Hebreong idyomang “kung nakasumpong ako ng lingap sa inyong mga mata,” at naipahahayag ang magalang na pagsusumamo ng נָא nang hindi nagiging pilit.
- source_word: דַּבְּרוּ נָא
  choice: pakisabi ninyo
  rationale: Ipinahahayag ng “paki-” ang magalang na pakiusap ng imperatibong maramihan at ng katagang נָא.
- source_word: בְּאָזְנֵי פַרְעֹה
  choice: sa Faraon
  rationale: Ang idyomang Hebreo ay nangangahulugang iparating ang mga salita upang marinig ng Faraon; “pakisabi … sa Faraon” ang malinaw at likas na anyo sa modernong Filipino.
- source_word: לֵאמֹר
  choice: 'ang ganito:'
  rationale: Ipinakikita ng tutuldok na ang mismong mensaheng ipasasabi ay sumusunod sa susunod na talata, gaya ng tungkulin ng quotative infinitive sa Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na magalang at marangal ang ginamit. Pinanatili ang “mga araw” at “sambahayan” upang manatiling malapit sa larawan ng Hebreo, ngunit nilinaw na mga tauhan ang kausap ni Jose. Ang pangungusap ay sadyang nagtatapos sa tutuldok dahil nagpapatuloy ang ipasasabi sa Genesis 50:5.
