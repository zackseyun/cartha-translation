  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang terminong “pag-eembalsamo,” pinanatili ang kolektibong “Ehipto,” at iniwasang gawing teknikal o denominasyonal ang paglalarawan.
