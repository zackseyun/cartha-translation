base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/003.yaml
  text: Forty days were completed for him[a], for that is how the days of embalming are completed[b]; and Egypt wept for him seventy days.
translation:
  language: tl
  text: Lumipas ang apatnapung araw para sa kanya, sapagkat ganoon katagal ang pag-eembalsamo[b]. Iniyakan siya ng Ehipto[a] sa loob ng pitumpung araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Ehipto” ay ginagamit dito bilang kolektibong tawag sa mga taga-Ehipto.
    reason: lexical_alternative
  - marker: b
    text: O “sapagkat gayon nakukumpleto ang mga araw ng pag-eembalsamo.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְלְאוּ לוֹ אַרְבָּעִים יוֹם
  choice: Lumipas ang apatnapung araw para sa kanya
  rationale: Ang מלא, kapag panahon ang paksa, ay tumutukoy sa pagkalubos o pagkumpleto ng takdang panahon. Ang “lumipas” ay likas sa modernong Tagalog at pinananatili ng “para sa kanya” ang לֹו.
- source_word: כִּי כֵן
  choice: sapagkat ganoon
  rationale: Pinananatili nito ang paliwanag na ugnayan sa naunang apatnapung araw sa natural at malinaw na Tagalog.
- source_word: יִמְלְאוּ יְמֵי הַחֲנֻטִים
  choice: ganoon katagal ang pag-eembalsamo
  rationale: Sa konteksto ng talata 2, ang parirala ay tumutukoy sa itinakdang panahon ng pag-eembalsamo. Iniiwasan ng salin ang di-likas na literal na “mga araw ng mga inembalsamo,” habang itinatala sa talababa ang mas pormal na alternatibo.
- source_word: וַיִּבְכּוּ אֹתוֹ
  choice: Iniyakan siya
  rationale: Tuwirang ipinahahayag nito ang בכה na “umiyak,” nang hindi ito pinalalawak tungo sa mas pormal na mga ritwal ng pagluluksa.
- source_word: מִצְרַיִם
  choice: Ehipto
  rationale: Pinananatili ang pangalang-pook ng Hebreo, na ginagamit dito bilang kolektibong tawag sa mga taga-Ehipto.
- source_word: שִׁבְעִים יוֹם
  choice: sa loob ng pitumpung araw
  rationale: Likas na Tagalog para sa tagal ng pag-iyak, habang tuwirang pinananatili ang bilang.
