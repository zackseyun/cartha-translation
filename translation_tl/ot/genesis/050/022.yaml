  yaml_path: translation/ot/genesis/050/022.yaml
  text: Joseph remained in Egypt[a], he and his father's household, and Joseph lived 110 years.
translation:
  language: tl
  text: Nanatili si Jose sa Ehipto[a], kasama ang sambahayan ng kanyang ama. Nabuhay si Jose nang 110 taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nanirahan sa Ehipto, siya at ang sambahayan ng kanyang ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Nanatili
  rationale: Maaaring mangahulugan ang ישב na “umupo,” “manirahan,” o “manatili.” Sa buod na ito ng salaysay, malinaw na ipinahihiwatig ng “nanatili” ang patuloy na paninirahan ni Jose sa Ehipto pagkamatay ni Jacob, at iniiwasan din nitong ulitin ang “nabuhay” para sa kasunod na וַיְחִי.
- source_word: בְּמִצְרַיִם
  choice: sa Ehipto
  rationale: Tuwirang pariralang panlunan na tumutukoy sa kinaroroonan at tirahan ni Jose.
- source_word: הוּא וּבֵית אָבִיו
  choice: kasama ang sambahayan ng kanyang ama
  rationale: Ang בֵּית ay tumutukoy rito sa sambahayan o yunit ng pamilya, hindi lamang sa gusali. Ginamit ang “kasama” upang likas na maipahayag sa Filipino ang Hebreong “siya at,” nang hindi binabago ang saklaw ng pangkat.
- source_word: וַיְחִי
  choice: Nabuhay
  rationale: Ipinakikilala rito ng חיה ang kabuuang haba ng buhay ni Jose; natural sa modernong Filipino ang “nabuhay nang … taon.”
- source_word: מֵאָה וָעֶשֶׂר שָׁנִים
  choice: 110 taon
  rationale: Eksaktong pinananatili ang bilang at ginagamit ang mga digit para sa madaling pagbasa.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginamit ang nakaugaliang modernong Filipino na anyo ng pangalang biblikal.
