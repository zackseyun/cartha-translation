base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/017.yaml
  text: 'This is what you shall say to Yosef: ‘Please forgive the transgression of your brothers and their sin, because they repaid you with evil. And now, please forgive the transgression of the servants of the God of your father.’ And Yosef wept when they spoke to him.'
translation:
  language: tl
  text: 'Ganito ang sasabihin ninyo kay Jose: ‘Nakikiusap kami, patawarin mo ang paglabag ng iyong mga kapatid at ang kanilang kasalanan, sapagkat ginawan ka nila ng masama. At ngayon, nakikiusap kami, patawarin mo ang paglabag ng mga lingkod ng Diyos ng iyong ama.’ Umiyak si Jose nang sabihin nila ito sa kanya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא נָא
  choice: nakikiusap kami, patawarin mo
  rationale: Ang idyomang literal na ‘buhatin/dalhin, pakiusap’ ay humihingi ng kapatawaran; pinananatili ng ‘nakikiusap kami’ ang mariing pakiusap ng נָא.
- source_word: פֶּשַׁע
  choice: pagsuway
  rationale: Ipinahihiwatig nito ang seryosong paglabag o paghihimagsik, kaya mas tiyak kaysa sa pangkalahatang ‘kasalanan’ habang natural pa rin sa Filipino.
- source_word: חַטָּאתָם
  choice: kanilang kasalanan
  rationale: Pinananatili ang hiwalay ngunit magkakaugnay na katawagan ng Hebreo para sa pagkakasala.
- source_word: רָעָה גְמָלוּךָ
  choice: ginawan ka nila ng masama
  rationale: Natural na Filipino para sa ideyang sila ay gumawa o gumanti ng masama kay Jose, nang hindi nagpapasok ng dagdag na paliwanag.
- source_word: עַבְדֵי אֱלֹהֵי אָבִיךָ
  choice: mga lingkod ng Diyos ng iyong ama
  rationale: Malapit sa anyo ng Hebreo at pinananatili ang apela sa kanilang iisang kaugnayan sa Diyos ng ama ni Jose.
- source_word: בְּדַבְּרָם אֵלָיו
  choice: nang sabihin nila ito sa kanya
  rationale: Ang pangmaramihang pandiwa ay isinalin nang tuwiran; ang ‘ito’ ay natural na tumutukoy sa mensaheng kababanggit.
theological_decisions:
- issue: Ugnayan ng kasamaan at pakiusap na magpatawad
  choice: sapagkat ginawan ka nila ng masama
  alternative: bagaman ginawan ka nila ng masama
  rationale: Ang כִּי ay karaniwang nagbibigay rito ng dahilan o batayan ng pagkilala sa kasalanan; hindi ito ginawang konsesibong ‘bagaman,’ upang hindi tahimik na baguhin ang lohika ng teksto.
- issue: Pagkakakilanlan ng ‘mga lingkod ng Diyos ng iyong ama’
  choice: pinanatili bilang paglalarawan sa mismong nagsusumamo
  alternative: ipaliwanag bilang ‘kami na mga lingkod’
  rationale: Hindi tahasang nasa sugnay ang panghalip na ‘kami’; pinananatili ang bahagyang di-tuwirang pahayag at hindi dinaragdagan ang teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘Jose’ bilang karaniwang anyong Filipino ng pangalan. Iningatan ang pag-uulit ng pakiusap at ang dalawang katawagang ‘pagsuway’ at ‘kasalanan’ mula sa Hebreo.
