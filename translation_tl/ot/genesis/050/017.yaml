  source_fidelity: 'Tumpak ang kabuuang diwa at ayos ng Hebreo: ang dobleng pakiusap na magpatawad, ang pagkilala sa masamang ginawa ng mga kapatid, ang pagtukoy sa mga lingkod ng Diyos ng ama ni Jose, at ang pag-iyak ni Jose ay naipahayag nang wasto. Gayunman, ang פשע ay mas malapit sa ‘paglabag’ kaysa ‘pagsuway,’ sapagkat tumutukoy ito sa paglabag/pagkakasalang ginawa laban kay Jose at hindi lamang sa pagsuway sa isang utos.'
  naturalness: Natural at marangal ang Filipino. Ang ‘Nakikiusap kami’ ay isang katanggap-tanggap na paraan upang maipahayag ang pakiusap na נָא, at malinaw ang daloy ng pangungusap.
