base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/002.yaml
  text: Then Joseph commanded his servants[a], the physicians, to embalm his father[b], and the physicians embalmed Israel.
translation:
  language: tl
  text: Pagkatapos, inutusan ni Jose ang kanyang mga lingkod[a], ang mga manggagamot, na embalsamuhin ang kanyang ama[b]. At inembalsamo ng mga manggagamot si Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga alipin”; maaaring mangahulugan ang salitang Hebreo ng mga lingkod o mga alipin, depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Israel,” samakatuwid ay si Jacob.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו
  choice: inutusan
  rationale: Ipinahahayag nito ang isang tagubiling ibinigay nang may awtoridad, habang natural ang dating sa makabagong Tagalog.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Maaaring tumukoy ang עבד sa mga lingkod o mga alipin. Sa kontekstong ito, ang tungkulin nila bilang mga tauhan ni Jose ang binibigyang-diin, kaya ang “mga lingkod” ang pinakaangkop, habang inilalahad sa talababa ang ibang posibilidad.
- source_word: הָרֹפְאִים
  choice: mga manggagamot
  rationale: Ang participle mula sa רפא ay tumutukoy sa mga taong nagsasagawa ng panggagamot. Ang “mga manggagamot” ay malinaw, marangal, at angkop sa sinaunang konteksto ng korte.
- source_word: לַחֲנֹט
  choice: na embalsamuhin
  rationale: Sa kontekstong Ehipsiyo, tumutukoy ang חנט sa pag-eembalsamo ng bangkay; ito ang pinakatiyak at pinakanatural na katumbas sa Tagalog.
- source_word: אָבִיו
  choice: kanyang ama
  rationale: Tuwirang isinasalin ang pangngalang may panghalip na paari.
- source_word: וַיַּחַנְטוּ
  choice: inembalsamo
  rationale: Pinananatili ang pag-uulit ng pandiwa at malinaw na ipinapakita ang kasunod na kilos sa salaysay.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Tahasan itong “Israel” sa tekstong Hebreo, kaya hindi ito pinalitan ng “Jacob.”
theological_decisions:
- issue: Pagpapakahulugan sa עבד sa konteksto ng sambahayan ni Jose
  choice: mga lingkod
  alternative: mga alipin
  rationale: Hindi pangunahing paksa ng talata ang legal o panlipunang katayuan ng mga tauhan kundi ang tungkuling ginampanan nila bilang mga manggagamot ni Jose. Pinananatili ng “mga lingkod” ang diin ng konteksto nang hindi ikinakaila ang mas malawak na saklaw ng salitang Hebreo.
- issue: Pagpapanatili sa pangalang יִשְׂרָאֵל
  choice: Israel
  alternative: Jacob
  rationale: Sadyang ginagamit ng tekstong Hebreo ang “Israel” sa hulihan ng talata. Ang pagpapanatili rito ay umiiwas sa di-kinakailangang paghaharmonisa ng mga pangalan.
translation_notes:
  register: Makabago at dignified na Filipino ang ginamit. Ang “manggagamot” ay mas angkop sa sinaunang konteksto kaysa sa mas kolokyal na “doktor,” at ang “embalsamuhin” ay malinaw sa karaniwang mambabasa. Pinanatili ang pangalang “Israel” sa mismong salin.
