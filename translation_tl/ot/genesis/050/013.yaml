  - severity: low
    issue: Ang “pag-aaring libingan” ay maaaring basahing isang libingan na pag-aari, sa halip na ariang nakalaan para sa libingan.
    rationale: Ang לַאֲחֻזַּת קֶבֶר ay tumutukoy sa pagkuha ng ari-arian para sa layuning paglilibing. Mas malinaw ang “pag-aaring para sa libingan.”
