revisions:
- from: Dinala siya ng kanyang mga anak sa lupain ng Canaan at inilibing sa yungib na nasa bukid ng Macpela—ang bukid na binili ni Abraham kay Efron na Heteo bilang pag-aaring libingan[a]—sa tapat ng Mamre.[b]
  to: Dinala siya ng mga anak niyang lalaki sa lupain ng Canaan at inilibing nila siya sa yungib sa bukid ng Macpela—ang bukid na binili ni Abraham mula kay Efron na Heteo bilang pag-aaring para sa libingan[a]—sa tapat ng Mamre.[b]
  rationale: Itinuwid ang kasariang ipinahihiwatig ng “mga anak niyang lalaki” ayon sa בָנָיו. Pinanatili ang malinaw na appositive na nagsasabing ang bukid ang binili ni Abraham, hindi ang yungib bilang hiwalay na bagay. Bahagyang nilinaw ang terminong para sa ariang libingan at pinanatili ang mga angkla ng talababa sa mga katumbas na pahayag.
  reviewer_model: gpt-5.6-terra
