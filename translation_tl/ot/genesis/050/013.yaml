base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/013.yaml
  text: His sons carried him to the land of Canaan and buried him in the cave of the field of Machpelah[a], which Abraham had bought with the field as a burial property from Ephron the Hittite[c][b], opposite Mamre.
translation:
  language: tl
  text: Dinala siya ng mga anak niyang lalaki sa lupain ng Canaan at inilibing nila siya sa yungib sa bukid ng Macpela—ang bukid na binili ni Abraham mula kay Efron na Heteo bilang pag-aaring para sa libingan[a]—sa tapat ng Mamre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang permanenteng pag-aari para sa paglilibing.” Idiniriin ng Hebreo na ang bukid ay naging pag-aaring nakalaan sa libingan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nakaharap sa Mamre.” Tinutukoy ng pariralang Hebreo ang kinalalagyan nito kaugnay ng Mamre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ בָנָיו
  choice: Dinala siya ng kanyang mga anak
  rationale: Sa kontekstong ito, ang נשׂא ay tumutukoy sa pagdadala sa katawan ni Jacob. Likas sa makabagong Tagalog ang “dinala,” at ang בָנָיו ay tahasang “kanyang mga anak” na lalaki ayon sa konteksto.
- source_word: אַרְצָה כְּנַעַן
  choice: sa lupain ng Canaan
  rationale: Ipinahahayag ng hulaping paturol ang pagpunta sa Canaan; pinananatili ng “lupain ng Canaan” ang tahasang אֶרֶץ sa Hebreo.
- source_word: בִּמְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: sa yungib na nasa bukid ng Macpela
  rationale: Nililinaw ng natural na Tagalog ang ugnayan ng yungib at bukid nang hindi ipinapalagay na ang Macpela ang pangalan lamang ng yungib.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: ang bukid na binili ni Abraham
  rationale: May resumptive object na “ang bukid” sa Hebreo. Ang appositive na parirala sa Tagalog ay malinaw na nagpapakitang ang bukid ang binili, at nasa bukid ang yungib.
- source_word: לַאֲחֻזַּת קֶבֶר
  choice: bilang pag-aaring libingan
  rationale: Sinasaklaw ng “pag-aari” ang diwa ng permanenteng paghawak sa lupa, habang malinaw na ipinakikita ng “libingan” ang layunin nito.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: kay Efron na Heteo
  rationale: Natural ang “binili ... kay” para sa pinagmulan ng transaksiyon. Ginamit ang “Heteo” bilang malinaw na katawagang Filipino para sa Hittite.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: sa tapat ng Mamre
  rationale: Pinananatili nito ang ugnayang panlunan na “nasa harap” o “nakaharap” sa Mamre, sa halip na pahinain ito bilang “malapit sa.”
