  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל אֶחָ֔י/ו אָנֹכִ֖י מֵ֑ת וֵֽ/אלֹהִ֞ים פָּקֹ֧ד יִפְקֹ֣ד אֶתְ/כֶ֗ם וְ/הֶעֱלָ֤ה אֶתְ/כֶם֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את אֶל הָ/אָ֕רֶץ אֲשֶׁ֥ר נִשְׁבַּ֛ע לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/024.yaml
  text: And Joseph said to his brothers[a], “I am dying, but God will surely visit you and bring you up from this land to the land that he swore to Abraham, to Isaac, and to Jacob.”
translation:
  language: tl
  text: At sinabi ni Jose sa kanyang mga kapatid, “Mamamatay na ako, ngunit tiyak na dadalawin kayo ng Diyos[a] at iaahon niya kayo mula sa lupaing ito patungo sa lupaing ipinangako niya nang may panunumpa kay Abraham, kay Isaac, at kay Jacob.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tiyak na aalalahanin kayo ng Diyos.” Ang idyomang Hebreo ay maaaring tumukoy sa mapagpasiyang pagbibigay-pansin at pagkilos ng Diyos para sa kanyang bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: kanyang mga kapatid
  rationale: Ang panlalaking pangmaramihang anyo at konteksto ng Genesis ay tumutukoy sa mga lalaking kapatid ni Jose; natural sa Tagalog ang “mga kapatid” nang hindi kailangang idagdag ang kasarian.
- source_word: אָנֹכִי מֵת
  choice: Mamamatay na ako
  rationale: Ipinahahayag ng participial na pananalita ang nalalapit na kamatayan ni Jose. Ang “mamamatay na ako” ay malinaw at likas sa modernong Tagalog.
- source_word: פָּקֹד יִפְקֹד
  choice: tiyak na aalalahanin kayo
  rationale: Ang infinitive absolute na sinusundan ng imperfect ay nagpapalakas sa katiyakan ng kilos. Sa konteksto, ang פקד ay hindi lamang paggunita kundi mapagpasiyang pagbibigay-pansin at pagkilos ng Diyos para sa kanyang bayan; pinananatili ng talababa ang lawak na ito.
- source_word: וֵאלֹהִים
  choice: ngunit ... ang Diyos
  rationale: Bagaman pang-ugnay na waw ang nasa Hebreo, malinaw ang pagsalungat ng nalalapit na kamatayan ni Jose sa tiyak na pagkilos ng Diyos, kaya likas ang “ngunit” sa Tagalog.
- source_word: וְהֶעֱלָה אֶתְכֶם
  choice: at iaahon niya kayo
  rationale: Ang Hiphil ng עלה ay “paakyatin” o “iahon.” Pinananatili ng “iaahon” ang direksiyonal na larawan ng pag-alis mula sa Ehipto patungo sa lupang pangako.
- source_word: מִן הָאָרֶץ הַזֹּאת
  choice: mula sa lupaing ito
  rationale: Tuwirang salin ng pariralang tumutukoy sa Ehipto mula sa kinalalagyan ni Jose.
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּע
  choice: patungo sa lupaing ipinangako niya nang may panunumpa
  rationale: Literal na “lupaing kanyang isinumpa,” ngunit sa Tagalog maaaring ipakahulugang isinumpa bilang sinumpa o cursed. Nililinaw ng pariralang ito ang kahulugan ng שׁבע bilang taimtim na pangakong pinagtibay ng panunumpa, nang hindi idinaragdag na tahasang “ibibigay.”
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: kay Abraham, kay Isaac, at kay Jacob
  rationale: Ang pag-uulit ng “kay” ay tumutugma sa paulit-ulit na pang-ukol sa Hebreo at nagpapanatili ng marangal na ritmo.
theological_decisions:
- issue: Saklaw ng ipinangakong pagkilos ng Diyos sa פָּקֹד יִפְקֹד
  choice: Tiyak na aalalahanin sila ng Diyos, na may diwang mapagpasiyang pagbibigay-pansin at pagkilos para sa kanila.
  alternative: Tiyak na dadalawin kayo ng Diyos.
  rationale: Ang “dadalawin” ay mas pormal na katumbas ng Hebreong idyoma ngunit madaling maunawaan bilang pisikal na pagdalaw lamang. Ang “aalalahanin” kasama ng talababa ay natural sa Tagalog at pinananatili ang covenantal na diwa nang hindi labis na tinutukoy ang paraan ng pagkilos ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Mamamatay na ako” sa halip na mas literal ngunit di-likas na anyo, at “ipinangako niya nang may panunumpa” upang maiwasan ang maling pagkaunawa sa “isinumpa.”
