- from: At sinabi ni Jose sa kanyang mga kapatid, “Mamamatay na ako, ngunit tiyak na aalalahanin kayo ng Diyos[a] at iaahon niya kayo mula sa lupaing ito patungo sa lupaing ipinangako niya nang may panunumpa kay Abraham, kay Isaac, at kay Jacob.”
  to: At sinabi ni Jose sa kanyang mga kapatid, “Mamamatay na ako, ngunit tiyak na dadalawin kayo ng Diyos[a] at iaahon niya kayo mula sa lupaing ito patungo sa lupaing ipinangako niya nang may panunumpa kay Abraham, kay Isaac, at kay Jacob.”
  rationale: Pinalitan ang “aalalahanin” ng “dadalawin” upang mas tuwirang maipakita ang Hebreong פקד sa emphatic na konstruksyon nito. Ang talababa ay pinanatili, ngunit ngayo’y inihaharap ang “aalalahanin” bilang alternatibo at nililinaw na ang “dadalawin” ay idyomatikong tumutukoy sa mapagpasiyang pagkilos, hindi lamang sa pisikal na pagbisita. Walang ibang pagbabagong kailangan.
