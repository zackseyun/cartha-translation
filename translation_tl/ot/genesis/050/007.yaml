  text: So Joseph went up to bury his father[a], and with him went up all Pharaoh’s servants, the elders of his household, and all the elders of the land of Egypt.
translation:
  language: tl
  text: Kaya umakyat si Jose upang ilibing ang kanyang ama.[a] Kasama niyang umakyat ang lahat ng lingkod ng Paraon, ang mga nakatatanda sa sambahayan ng Paraon, at ang lahat ng nakatatanda sa lupain ng Egipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “umakyat” ay karaniwang paraan sa Hebreo ng paglalarawan sa paglalakbay mula Egipto patungong Canaan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: umahon
  rationale: Pinananatili ang literal na diwa ng עָלָה at ang karaniwang Hebreong paglalarawan sa paglalakbay mula Egipto patungong Canaan.
- source_word: לִקְבֹּר
  choice: upang ilibing
  rationale: Tuwirang salin ng layuning ipinahahayag ng infinitibong קָבַר, sa natural na modernong Tagalog.
- source_word: אָבִיו
  choice: ang kanyang ama
  rationale: Tapat sa payak na panghalip na paari sa Hebreo nang hindi nagdaragdag ng diin.
- source_word: וַיַּעֲלוּ אִתּוֹ
  choice: Kasama niyang umahon
  rationale: Pinananatili ang pag-uulit ng pandiwang 'umahon' at malinaw na ipinahahayag ang pagsama kay Jose.
- source_word: כָּל עַבְדֵי פַרְעֹה
  choice: ang lahat ng lingkod ng Paraon
  rationale: Ang 'lingkod' ay sapat na malawak para sa עֶבֶד sa konteksto ng maharlikang sambahayan at hindi labis na nagtatakda ng kanilang ranggo o kalagayan.
- source_word: זִקְנֵי בֵיתוֹ
  choice: ang matatandang pinuno ng sambahayan nito
  rationale: Isinasalin ang זִקְנֵי bilang mga nakatatandang may awtoridad at ang בֵיתוֹ bilang maharlikang sambahayan; ang 'nito' ay tumutukoy sa Paraon.
- source_word: וְכֹל זִקְנֵי אֶרֶץ מִצְרָיִם
  choice: at ang lahat ng matatandang pinuno sa lupain ng Egipto
  rationale: Pinananatili kapwa ang konsepto ng mga elder na namumuno at ang tahasang pagbanggit sa 'lupain' ng Egipto.
