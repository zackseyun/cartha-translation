    issue: Ang “matatandang pinuno” para sa זִקְנֵי ay nagdaragdag ng ‘pinuno.’
    rationale: Ang Hebreo ay literal na ‘mga elder/nakatatanda’; bagaman maaari silang maging mga taong may katayuan, hindi tahasang sinasabi ng talata ang ‘pinuno.’
  - severity: low
    issue: Hindi ganap na malinaw ang “sambahayan nito.”
    rationale: Ang hulaping paari sa בֵיתוֹ ay tumutukoy sa Paraon; mas malinaw na sabihin ang “sambahayan ng Paraon.”
  - severity: low
    issue: Medyo di-karaniwan ang “umahon” sa modernong Tagalog para sa rutang ito.
    rationale: Ang “umakyat” ay mas natural samantalang napapanatili ang literal at heograpikong idiom ng עָלָה.
