  to: Kaya umakyat si Jose upang ilibing ang kanyang ama.[a] Kasama niyang umakyat ang lahat ng lingkod ng Paraon, ang mga nakatatanda sa sambahayan ng Paraon, at ang lahat ng nakatatanda sa lupain ng Egipto.
  rationale: Pinanatili ng rebisyon ang dalawang ulit na ‘umakyat,’ gaya ng pag-uulit ng עָלָה sa Hebreo, ngunit gumamit ng mas natural na modernong Tagalog. Inalis ang dagdag na kahulugang ‘pinuno’ at nilinaw na ang sambahayan ay kay Paraon.
