base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/015.yaml
  text: When Joseph’s brothers saw that their father was dead, they said, “What if Joseph hates us and fully repays us for all the evil that we did to him?”
translation:
  language: tl
  text: Nang makita ng mga kapatid ni Jose na patay na ang kanilang ama, sinabi nila, “Paano kung magkimkim ng galit sa atin si Jose at lubusang gantihan tayo dahil sa lahat ng kasamaang ginawa natin sa kanya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂטְמֵנוּ
  choice: magkimkim ng galit sa atin
  rationale: Ang pandiwa ay nagpapahiwatig ng matinding poot o pagkapoot na maaaring kinikimkim; natural sa modernong Tagalog ang pariralang ito at angkop sa pangamba ng mga kapatid.
- source_word: לוּ
  choice: Paano kung
  rationale: Sa kontekstong ito, ipinapahayag ng kataga ang nangangambang posibilidad, hindi isang tiyak na pahayag.
- source_word: הָשֵׁב יָשִׁיב לָנוּ
  choice: lubusang gantihan tayo
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagpapadiin sa kilos; ipinapahayag ng “lubusang” ang diin nang natural sa Tagalog.
- source_word: כָּל־הָרָעָה אֲשֶׁר גָּמַלְנוּ אֹתוֹ
  choice: dahil sa lahat ng kasamaang ginawa natin sa kanya
  rationale: Ang גמל sa konstruksiyong ito ay tumutukoy sa masamang pakikitungo o ginawang masama; malinaw at likas ang “ginawa natin sa kanya.”
theological_decisions:
- issue: Kung ang sinabi ng mga kapatid ay tanong, pangamba, o tiyak na hula
  choice: 'Inilahad bilang nangangambang tanong: “Paano kung…”'
  alternative: “Baka magkimkim…” o “Tiyak na kapopootan…”
  rationale: Pinananatili nito ang modal na puwersa ng לוּ sa konteksto at hindi ginagawang tiyak ang ipinangangamba lamang nila.
- issue: Lakas ng paghihiganti ni Jose na kanilang kinatatakutan
  choice: “lubusang gantihan”
  alternative: “gantihan” lamang o “tiyak na gantihan”
  rationale: Pinananatili ang emphatic na anyo הָשֵׁב יָשִׁיב nang hindi nagdaragdag ng teolohikal na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “magkimkim ng galit” sa halip na mas matigas na “kapootan,” at pinanatili ang tensiyon bilang pangamba ng mga kapatid, hindi bilang paglalarawan sa tunay na hangarin ni Jose.
