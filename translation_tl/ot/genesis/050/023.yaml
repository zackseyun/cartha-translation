base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/023.yaml
  text: Joseph saw Ephraim’s children to the third generation[a]. Also[b], the children of Machir son of Manasseh were born on Joseph’s knees.
translation:
  language: tl
  text: Nakita ni Jose ang mga inapo ni Efraim hanggang sa ikatlong salinlahi.[a] Gayundin, ang mga anak ni Makir na anak ni Manases ay isinilang sa mga tuhod ni Jose.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nabuhay si Jose upang makita ang mga inapo ni Efraim hanggang sa ikatlong salinlahi.” Literal sa Hebreo, “Nakita ni Jose.”
    reason: lexical_alternative
  - marker: b
    text: Ang “isinilang sa mga tuhod ni Jose” ay isang idyomang Hebreo na maaaring magpahiwatig ng pagkilala sa kanila bilang kabilang sa pamilya, pagtanggap sa kanila, o natatanging pagturing sa kanila.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nakita
  rationale: Pinananatili ang literal na diwa ng pandiwang Hebreo na 'nakita,' habang natural pa ring ipinahihiwatig sa konteksto na nabuhay si Jose nang sapat na tagal upang makita ang mga inapo.
- source_word: לְאֶפְרַיִם
  choice: ni Efraim
  rationale: 'Ang לְ sa pormulang pangangkan ay likas na isinasalin bilang pagmamay-ari o kaugnayang angkan: ''mga anak ni Efraim.'''
- source_word: בְּנֵי שִׁלֵּשִׁים
  choice: mga anak ... hanggang sa ikatlong salinlahi
  rationale: Ipinahahayag nito ang mga inapo na umabot sa ikatlong henerasyon nang hindi labis na tinutukoy ang eksaktong antas ng bawat ugnayang pampamilya.
- source_word: גַּם
  choice: Gayundin
  rationale: Natural na nagdurugtong sa karagdagang pahayag na kahilera ng unang sugnay.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: ang mga anak ni Makir na anak ni Manases
  rationale: Pinananatili ang pormulang pangangkan at malinaw na ipinakikilalang si Makir ang anak ni Manases.
- source_word: יֻלְּדוּ
  choice: ay isinilang
  rationale: Tuwirang katumbas ng balintiyak na anyo ng ילד, 'isinilang.'
- source_word: עַל בִּרְכֵּי יוֹסֵף
  choice: sa mga tuhod ni Jose
  rationale: Pinananatili ang kongkretong idyomang Hebreo sa halip na ipalit sa pangunahing teksto ang isang tiyak na interpretasyon nito.
theological_decisions:
- issue: Kahulugan ng pagkapanganak 'sa mga tuhod' ni Jose
  choice: Panatilihin sa pangunahing teksto ang literal na larawang 'sa mga tuhod ni Jose.'
  alternative: Isalin bilang kinilala, tinanggap, o itinuring ni Jose na kabilang sa pamilya.
  rationale: Maaaring magpahiwatig ang idyoma ng pagkilala sa angkan, pagtanggap, o natatanging pagturing, ngunit hindi nililinaw ng teksto kung alin dito ang eksaktong ibig sabihin; kaya pinananatili ang tunay na kalabuan at ipinaliliwanag sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “salinlahi” para sa genealogical na saklaw at pinanatili ang konkretong idyoma tungkol sa mga tuhod, kalakip ang paliwanag sa talababa.
