base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/008.yaml
  text: and all the household of Joseph[a], and his brothers, and his father's household; only their little ones, their flocks[c][b], and their herds they left in the land of Goshen.
translation:
  language: tl
  text: Kasama niya ang buong sambahayan ni Jose[a], ang kanyang mga kapatid, at ang sambahayan ng kanyang ama; tanging ang maliliit nilang anak[b], ang kanilang mga kawan ng tupa at kambing, at ang kanilang mga baka ang iniwan nila sa lupain ng Gosen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sambahayan” dito ay tumutukoy sa pamilya at sa mga taong kabilang dito, hindi lamang sa isang bahay na gusali.
    reason: lexical_alternative
  - marker: b
    text: Ang tinutukoy ay maliliit o batang anak.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְכֹל
  choice: at ang buong
  rationale: Ipinagpapatuloy ng וְ ang talaan mula sa naunang talata, at ipinahahayag ng כֹל ang kabuuan ng sambahayan.
- source_word: בֵּית יוֹסֵף / וּבֵית אָבִיו
  choice: sambahayan ni Jose / sambahayan ng kanyang ama
  rationale: Sa kontekstong ito, ang בַּיִת ay tumutukoy sa pamilya o mga taong kabilang sa isang sambahayan, hindi sa gusali.
- source_word: וְאֶחָיו
  choice: ang kanyang mga kapatid
  rationale: Tumutukoy ito sa mga lalaking kapatid ni Jose; sa kasalukuyang Filipino, natural at sapat ang “mga kapatid” ayon sa konteksto.
- source_word: רַק
  choice: Tanging
  rationale: 'Minamarkahan nito ang eksepsiyon: ang mga bata at mga alagang hayop lamang ang hindi sumama.'
- source_word: טַפָּם
  choice: ang maliliit nilang anak
  rationale: Ang טַף ay karaniwang tumutukoy sa maliliit o batang anak, hindi sa lahat ng anak anuman ang edad.
- source_word: וְצֹאנָם
  choice: ang mga kawan nilang tupa at kambing
  rationale: Ang צֹאן ay sama-samang tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing; nilinaw ito upang maging madaling maunawaan sa modernong Filipino.
- source_word: וּבְקָרָם
  choice: ang kanilang mga bakahan
  rationale: Ang בָּקָר ay tumutukoy sa mga baka bilang malaking alagang hayop; pinananatili ng “mga bakahan” ang kolektibong diwa.
- source_word: עָזְבוּ
  choice: ang iniwan nila
  rationale: Ipinahihiwatig ng pandiwa ang sadyang pag-iwan sa Gosen, hindi pagpapabaya o pagtalikod.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: sa lupain ng Gosen
  rationale: Tahasang pinananatili ang אֶרֶץ (“lupain”) at ang pangalang heograpiko.
