translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang panimulang “at” sapagkat karugtong ang talata ng talaan sa naunang pangungusap. Ginamit ang ayos na “Tanging … ang iniwan nila” upang mapanatili ang diin ng Hebreo sa mga naiwan habang nananatiling natural sa Tagalog.
