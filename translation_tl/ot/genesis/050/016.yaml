base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/016.yaml
  text: So they sent word to Joseph[a], saying, “Your father commanded before his death, saying,”
translation:
  language: tl
  text: 'Nagpahatid sila ng mensahe kay Jose[a], na nagsasabi, “Bago namatay ang iyong ama, iniutos niya ang ganito:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na salin, “Kaya inutusan nila si Jose.” Karaniwang nangangahulugang “mag-utos” ang pandiwang Hebreo, ngunit malamang na tumutukoy ito rito sa pagpaparating ng mensahe kay Jose.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: ipinasabi nila
  rationale: Karaniwang nangangahulugang ‘mag-utos’ ang צוה, ngunit sa kontekstong ito, ang pariralang אֶל יוֹסֵף at ang kasunod na mensahe ay malamang na tumutukoy sa pagpaparating nila ng isang pahayag kay Jose. Likas sa modernong Tagalog ang ‘ipinasabi’ para sa ganitong kilos ng komunikasyon.
- source_word: אֶל יוֹסֵף
  choice: kay Jose
  rationale: Ipinakikilala ng אֶל si Jose bilang pinatutungkulan o tatanggap ng mensahe; ang ‘kay’ ang likas na katumbas nito sa Tagalog.
- source_word: לֵאמֹר
  choice: 'ipinasabi / ang ganito:'
  rationale: Dalawang ulit ginagamit ang לֵאמֹר upang ipakilala muna ang mensahe at pagkatapos ang mismong utos na sisipiin sa susunod na talata. Sa Tagalog, naipahahayag nang natural ang tungkuling ito sa pandiwang ‘ipinasabi’ at sa panandang ‘ang ganito:’.
- source_word: אָבִיךָ
  choice: ang iyong ama
  rationale: Tuwirang ikalawang-panauhang anyong paari na nakatuon kay Jose.
- source_word: צִוָּה
  choice: iniutos niya
  rationale: Pinananatili nito ang karaniwang kahulugan at lakas ng צוה at inihahanda ang mambabasa sa nilalaman ng utos sa susunod na talata.
- source_word: לִפְנֵי מוֹתוֹ
  choice: bago mamatay
  rationale: Temporal ang gamit ng לִפְנֵי rito. Ang ‘bago mamatay’ ay malinaw at likas na katumbas sa modernong Tagalog.
theological_decisions:
- issue: Katayuan ng sinasabing utos ng ama
  choice: Inilahad ito bilang mensaheng ipinasabi ng mga kapatid, nang hindi pinatutunayan o pinabubulaanan ng tagapagsalaysay ang kanilang pahayag.
  alternative: Ilarawan ang utos bilang tiyak na naunang sinabi ni Jacob.
  rationale: Sa konteksto, mga kapatid ang nag-uulat ng sinabi raw ng kanilang ama. Hindi dapat lampasan ng salin ang naratibong ebidensiya o lutasin ang posibleng tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘ipinasabi’ bilang likas na pagpapahayag ng pagpapadala ng mensahe, habang ang talababa ay nagpapanatili sa mas literal na kahulugang ‘inutusan.’ Ang tutuldok sa hulihan ay naghahanda sa tuwirang sipi sa kasunod na talata.
