lexical_decisions:
- source_word: וַיַּעַל עִמּוֹ
  choice: Kasama rin niyang umakyat
  rationale: Pinananatili ng “umakyat” ang karaniwang diwa ng עלה at ang direksiyon ng paglalakbay mula sa Ehipto, habang likas sa Tagalog ang ayos na “kasama niyang umakyat.”
- source_word: גַּם ... גַּם
  choice: rin ... at
  rationale: Ipinahihiwatig ng inuulit na גַּם na kapuwa idinagdag sa naunang mga kasama ang mga karwahe at mga mangangabayo. Ang “rin” at “at” ay malinaw at natural sa Tagalog.
- source_word: רֶכֶב
  choice: mga karwahe
  rationale: Bagaman nasa anyong isahan ang salitang Hebreo, maaari itong gamitin bilang pangngalang kolektibo para sa isang pangkat ng mga karwahe.
- source_word: פָּרָשִׁים
  choice: mga mangangabayo
  rationale: Tuwirang tumutukoy ito sa mga nakasakay sa kabayo at hindi kailangang ipakahulugang mas tiyak na makabagong yunit-militar.
- source_word: הַמַּחֲנֶה
  choice: ang pangkat
  rationale: Sa konteksto ng naglalakbay na prusisyon, ang מַחֲנֶה ay tumutukoy sa buong pangkat na kasama, hindi lamang sa isang nakahimpil na kampo.
- source_word: כָּבֵד מְאֹד
  choice: napakalaki
  rationale: Literal itong “napakabigat,” ngunit kapag inilalarawan ang isang pangkat, ipinahihiwatig nito na iyon ay lubhang malaki o maluwalhati. Ang “napakalaki” ang pinakamalinaw na diwa sa modernong Tagalog.
