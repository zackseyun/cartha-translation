  text: Umakyat ding kasama niya ang mga karwahe[b] at mga mangangabayo, at naging napakalaki ang pangkat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “napakabigat ang kampo,” na maaaring mangahulugang napakalaki, napakarami, o kahanga-hanga ang buong pangkat.
