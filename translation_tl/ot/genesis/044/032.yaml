base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/032.yaml
  text: For your servant became surety for the boy to my father[a], saying, ‘If I do not bring him to you[b], then I will bear the blame before my father all my days.’
translation:
  language: tl
  text: Sapagkat ang inyong lingkod ay nanagot sa aking ama para sa binata[a]. Sinabi ko, ‘Kung hindi ko siya maibalik sa iyo, magiging may-sala ako sa aking ama habang-buhay.’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “naging tagapanagot ako para sa binata” o “ipinanagot ko ang aking sarili para sa binata.” Ang pandiwang Hebreo ay nangangahulugang umako ng pananagutan bilang tagapanagot.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “magkakasala ako sa aking ama sa lahat ng araw.” Sa kontekstong ito, maaari itong tumukoy sa patuloy na pagkakasala o pananagutan sa harap ng kaniyang ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag ni Juda at iniuugnay ang talata sa nauna niyang pakiusap.
- source_word: עַבְדְּךָ
  choice: ako na inyong lingkod
  rationale: Magalang at mapagpakumbabang pagtukoy ni Juda sa sarili sa harap ng isang nakatataas; pinananatili ang pormal na himig nang hindi labis na idinidiin ang katayuang alipin.
- source_word: עָרַב אֶת הַנַּעַר מֵעִם אָבִי
  choice: ang nanagot sa aking ama para sa binata
  rationale: Ipinahahayag ng pandiwa ang pananagutan bilang tagapanagot. Likas sa modernong Tagalog ang ‘nanagot ... para sa’ at malinaw na ang ama ang pinangakuan.
- source_word: הַנַּעַר
  choice: binata
  rationale: Tumutukoy kay Benjamin, na hindi na maliit na bata. Pinananatili ng ‘binata’ ang relasyonal na pananaw sa kaniya bilang nakababatang anak nang hindi nagpapahiwatig na musmos siya.
- source_word: לֵאמֹר
  choice: Sinabi ko
  rationale: Natural na panimula sa tuwirang sipi sa Tagalog at malinaw na si Juda ang nagsalita.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: Kung hindi ko siya maibalik sa iyo
  rationale: Ang ‘maibalik’ ay angkop sa konteksto ng pangakong ihahatid muli si Benjamin sa ama, habang pinananatili ang kundisyong nasa Hebreo.
- source_word: וְחָטָאתִי לְאָבִי
  choice: papasanin ang pagkakasala ko sa aking ama
  rationale: Pinananatili ang tahasang bokabularyo ng kasalanan sa Hebreo, ngunit ipinahahayag din ang pangmatagalang pananagutan at bigat ng sala sa harap ng ama.
- source_word: כָּל הַיָּמִים
  choice: habang-buhay
  rationale: Natural na katumbas sa Tagalog ng idyomang tumutukoy sa buong nalalabing buhay.
theological_decisions:
- issue: Ang saklaw ng וְחָטָאתִי bilang kasalanan, pagkakasala, o pananagutan
  choice: pagkakasala ko sa aking ama
  alternative: pananagutan ko sa aking ama / kasalanan ko laban sa aking ama
  rationale: Pinananatili ng salin ang moral na lakas ng pandiwang חטא at ang relasyonal na direksiyon nito, nang hindi nililimitahan iyon sa legal na sisi lamang. Ipinaliliwanag ng talababa ang posibleng diwa ng patuloy na sala o pananagutan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang magalang na ‘inyong lingkod’ sa pakikipag-usap ni Juda kay Jose, ngunit ‘iyo’ sa sipi ng sinabi niya sa sariling ama. Iniwasan ang lipas na ‘mananagot bilang panagot’ at pinili ang mas natural na ‘nanagot ... para sa,’ habang pinanatili sa talababa ang espesipikong diwa ng pagiging guarantor.
