base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/018.yaml
  text: Then Judah came near to him and said[a], “Please, my lord, let your servant speak a word in my lord’s hearing, and do not let your anger burn against your servant[c][b], for you are like Pharaoh.”
translation:
  language: tl
  text: Pagkatapos, lumapit sa kaniya si Juda at nagsabi, “Pakiusap po, panginoon ko, hayaan ninyong magsalita ng isang salita ang inyong lingkod sa inyong pandinig, at huwag ninyong hayaang mag-alab ang inyong galit laban sa inyong lingkod, sapagkat kayo ay tulad ng Paraon.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ אֵלָיו יְהוּדָה
  choice: lumapit sa kanya si Juda
  rationale: Pinananatili nito ang kongkretong paglapit ni Juda kay Jose at natural ang ayos sa makabagong Tagalog.
- source_word: בִּי אֲדֹנִי
  choice: Nakikiusap po ako, panginoon ko
  rationale: Ang בִּי ay isang magalang at mapagpakumbabang pakiusap; ipinahahayag ng “nakikiusap po ako” ang puwersa nito, habang pinananatili ng “panginoon ko” ang mataas na paggalang sa opisyal.
- source_word: יְדַבֶּר נָא עַבְדְּךָ דָבָר
  choice: hayaan ninyong magsalita ... ang inyong lingkod
  rationale: Inililipat nito nang natural ang magalang na pakiusap at pinananatili ang mapagpakumbabang pagtukoy ni Juda sa sarili bilang lingkod. Hindi na hiwalay na isinalin ang דָבָר bilang “isang salita” dahil ang ganoong anyo ay mas matigas sa Tagalog at likas nang ipinahihiwatig ng “magsalita.”
- source_word: בְּאָזְנֵי אֲדֹנִי
  choice: sa inyong pandinig
  rationale: Ito ay natural ngunit malapit na katumbas ng Hebreong idyomang “sa mga tainga ng aking panginoon,” na nangangahulugang magsalita upang marinig niya.
- source_word: וְאַל יִחַר אַפְּךָ בְּעַבְדֶּךָ
  choice: huwag po ninyong hayaang mag-alab ang inyong galit sa inyong lingkod
  rationale: Pinananatili ng “mag-alab” ang matingkad na metapora ng Hebreo para sa pag-aalab ng galit, sa halip na patagin lamang bilang “huwag kayong magalit.”
- source_word: כִּי כָמוֹךָ כְּפַרְעֹה
  choice: sapagkat kayo ay tulad ng Paraon
  rationale: Tuwirang pinananatili ang paghahambing sa kapangyarihan at katayuan ng Paraon nang hindi ito pinalalabis bilang ganap na pagkakapantay.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at magalang na Filipino ang ginamit. Ang “po,” maramihang panghalip-galang na “ninyo/inyong,” at “panginoon ko” ay naghahatid ng matinding paggalang ni Juda sa isang mataas na pinuno. Pinanatili ang metaporang “mag-alab ang inyong galit” dahil malinaw at natural pa rin ito sa Filipino.
