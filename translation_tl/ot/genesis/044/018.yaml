  to: Pagkatapos, lumapit sa kaniya si Juda at nagsabi, “Pakiusap po, panginoon ko, hayaan ninyong magsalita ng isang salita ang inyong lingkod sa inyong pandinig, at huwag ninyong hayaang mag-alab ang inyong galit laban sa inyong lingkod, sapagkat kayo ay tulad ng Paraon.”
