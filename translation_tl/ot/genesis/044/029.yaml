base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/029.yaml
  text: If you also take this one from me[a], and harm happens to him, then you will bring my gray hair down to Sheol in misery.
translation:
  language: tl
  text: Kung kukunin din ninyo ang isang ito mula sa akin, at may kapahamakang mangyari sa kanya, ibababa ninyo ang aking uban patungong Sheol[a] sa dalamhati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “libingan” o “daigdig ng mga patay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקַחְתֶּם גַּם אֶת זֶה מֵעִם פָּנַי
  choice: Kung ilalayo rin ninyo sa akin ang isang ito
  rationale: Ang waw + perfect ay nagpapatuloy sa kundisyon ng pahayag. Ang “ilalayo ... sa akin” ay likas sa Tagalog at malinaw na naghahatid ng diwa ng pagkuha sa anak mula sa presensya ni Jacob; ang “rin” ay nagpapakita ng pagdaragdag sa naunang pagkawala.
- source_word: וְקָרָהוּ אָסוֹן
  choice: at may kapahamakang mangyari sa kanya
  rationale: Pinananatili ng “mangyari” ang diwa ng קרה na ‘mangyari’ o ‘sumapit,’ habang ang “kapahamakan” ay nagpapahayag ng malubhang pinsala o sakuna na tinutukoy ng אָסוֹן.
- source_word: וְהוֹרַדְתֶּם
  choice: ibababa ninyo
  rationale: Tuwirang ipinapahayag ang causative na anyo ng ירד at pinananatili ang larawan ng pagbaba patungo sa daigdig ng mga patay.
- source_word: שֵׂיבָתִי
  choice: ang aking uban
  rationale: Pinananatili ang konkretong larawang Hebreo ng ‘aking uban,’ na metonimiya para sa katandaan, sa halip na palitan ito ng paliwanag na ‘aking katandaan.’
- source_word: בְּרָעָה
  choice: nang may dalamhati
  rationale: Sa kontekstong ito, ang רָעָה ay tumutukoy sa matinding paghihirap o dalamhati, hindi sa moral na kasamaan.
- source_word: שְׁאֹלָה
  choice: sa Sheol
  rationale: Pinananatili ang terminong Hebreo upang hindi paliitin ang kahulugan nito sa pisikal na libingan lamang; inilalahad sa talababa ang mga posibleng paliwanag.
theological_decisions:
- issue: Pagpapakahulugan sa שְׁאוֹל
  choice: Sheol
  alternative: libingan; daigdig ng mga patay
  rationale: Ang termino ay maaaring tumukoy sa libingan o sa kinaroroonan ng mga patay. Ang transliterasyong “Sheol” sa pangunahing teksto ay nagpapanatili sa lawak at bahagyang kalabuan ng konseptong Hebreo nang hindi nag-aangkat ng mas huling doktrinal na detalye.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang matalinghagang “aking uban” at ang larawan ng pagbaba sa Sheol, habang ginawang likas sa Tagalog ang idyomang ‘mula sa aking presensya’ bilang “ilalayo ... sa akin.”
