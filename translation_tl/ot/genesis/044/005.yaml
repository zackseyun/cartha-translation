  text: Is this not the one from which my master drinks and by which he indeed practices divination? You have done evil in doing this[a][b].
translation:
  language: tl
  text: Hindi ba ito ang iniinuman ng aking panginoon at talagang ginagamit niya ito sa panghuhula?[a] Masama ang ginawa ninyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at tiyak na nakapanghuhula siya sa pamamagitan nito.” Gumagamit ang Hebreo ng infinitive absolute kasama ng pandiwang may kaparehong ugat upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “Gumawa kayo ng masama sa ginawa ninyo.”'
    reason: previous_rendering
lexical_decisions:
- source_word: הֲלוֹא זֶה
  choice: Hindi ba ito
  rationale: Naghaharap ang הֲלֹא ng retorikal na tanong na umaasang sasang-ayon ang kausap; natural sa modernong Tagalog ang “Hindi ba ito.”
- source_word: אֲשֶׁר יִשְׁתֶּה אֲדֹנִי בּוֹ
  choice: ang iniinuman ng aking panginoon
  rationale: Ang בּוֹ kasunod ng “uminom” ay tumutukoy sa sisidlang iniinuman. Ang “aking panginoon” ay angkop na panlipunang titulo ng katiwala para kay Jose at hindi kailangang unawaing teolohikal.
- source_word: וְהוּא נַחֵשׁ יְנַחֵשׁ בּוֹ
  choice: at talagang ginagamit niya sa panghuhula
  rationale: Ang נַחֵשׁ יְנַחֵשׁ ay infinitive absolute na kasunod ng pandiwang may kaparehong ugat, kaya may diin. Ipinahahayag ng “talagang” ang diin, at malinaw na ipinakikita ng “ginagamit ... sa panghuhula” ang instrumental na בּוֹ.
- source_word: הֲרֵעֹתֶם אֲשֶׁר עֲשִׂיתֶם
  choice: Masama ang ginawa ninyong ito
  rationale: Pinananatili ng “masama” ang moral na bigat ng הֲרֵעֹתֶם, samantalang natural na tinutukoy ng “ginawa ninyong ito” ang partikular na kilos nang hindi lumilikha ng di-kinakailangang pag-uulit.
theological_decisions:
- issue: Kung ilalarawan bang aktuwal na nanghuhula si Jose o kung bahagi lamang ito ng kaniyang pagkukunwari at pagsubok
  choice: Tuwirang isinalin ang pahayag ng katiwala bilang paggamit ng kaniyang panginoon sa panghuhula.
  alternative: Palambutin ang pahayag upang ipahiwatig lamang na pinaniniwalaang nanghuhula si Jose o na kaya niyang manghula.
  rationale: Maliwanag na gumagamit ng wika ng panghuhula ang sinabi ng katiwala. Hindi dapat lutasin ng salin kung totoo itong gawain ni Jose o bahagi lamang ng estratehiya sa salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “panginoon” bilang panlipunang titulo sa konteksto, at “panghuhula” bilang karaniwang malinaw na katumbas ng divination.
