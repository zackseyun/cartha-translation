  source_fidelity: Tumpak ang pangunahing diwa, kabilang ang maramihang kausap, ang pagpapakilala kay Jacob bilang ama at lingkod ni Jose, at ang di-tahasang pangngalan pagkatapos ng “dalawa.” Ngunit ang “ang isinilang sa akin ng aking asawa” ay hindi ang pinakanatural na paraan upang isalin ang aktibong Hebreong “ang aking asawa ay nagsilang sa akin ng dalawa.”
  naturalness: Ang “sinabi sa amin ng iyong lingkod na aking ama” ay maaaring pansamantalang magmukhang ang “iyong lingkod” ang pangunahing pantukoy at ang “aking ama” ay restriktibong paglalarawan. Mas malinaw at mas natural ang appositive na “ng aking ama, na iyong lingkod.” Ang aktibong ayos na “nagsilang sa akin ng dalawa ang aking asawa” ay malinaw at likas sa modernong Tagalog.
  terminology: Ang “iyong lingkod” ay angkop na magalang na pananalita. Ang “aking ama” at “aking asawa” ay wastong mga katawagang pangkaugnayan. Hindi dapat idagdag sa pangunahing teksto ang “mga anak na lalaki,” sapagkat “dalawa” lamang ang nasa Hebreo; sapat ang talababa.
