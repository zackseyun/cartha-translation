lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos, sinabi” upang ipakita ang pagkakasunod-sunod.
- source_word: עַבְדְּךָ אָבִי
  choice: ng iyong lingkod na aking ama
  rationale: Pinananatili nito kapwa ang magalang na pagtukoy ni Juda kay Jacob bilang lingkod ni Jose at ang pagkakakilanlan nito bilang kanyang ama.
- source_word: אֵלֵינוּ
  choice: sa amin
  rationale: Tuwirang katumbas ng pariralang Hebreo at natural sa Tagalog.
- source_word: אַתֶּם יְדַעְתֶּם
  choice: Alam ninyo
  rationale: Pinananatili ng maramihang “ninyo” ang tahasang panghalip at ang diin nito; ang pangkasalukuyang anyo ay angkop sa kaalamang nananatiling totoo sa siniping pananalita.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng nalalaman.
- source_word: שְׁנַיִם
  choice: dalawa
  rationale: Pinananatili ang eksaktong anyo ng Hebreo, na walang tahasang pangngalang “mga anak” o “mga lalaki”; malinaw ang tinutukoy mula sa konteksto.
- source_word: יָלְדָה לִּי
  choice: ang isinilang sa akin
  rationale: Natural na Tagalog na nagpapahayag na ang asawa ang nagsilang at na ang dalawa ay mga anak ni Jacob, nang hindi nagpapalagay ng di-likas na literal na ayos.
- source_word: אִשְׁתִּי
  choice: ng aking asawa
  rationale: Sa konteksto, malinaw na “asawa” ang kahulugan ng אִשָּׁה na may hulaping unang panauhan.
