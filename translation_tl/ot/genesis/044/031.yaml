  text: וְ/הָיָ֗ה כִּ/רְאוֹת֛/וֹ כִּי אֵ֥ין הַ/נַּ֖עַר וָ/מֵ֑ת וְ/הוֹרִ֨ידוּ עֲבָדֶ֜י/ךָ אֶת שֵׂיבַ֨ת עַבְדְּ/ךָ֥ אָבִ֛י/נוּ בְּ/יָג֖וֹן שְׁאֹֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/031.yaml
  text: then[a], when he sees that the boy is not there, he will die, and your servants will bring down the gray hair of your servant our father to Sheol in sorrow.
translation:
  language: tl
  text: Kaya kapag nakita niyang wala ang bata, mamamatay siya; at kaming mga lingkod mo ang magdadala sa uban ng iyong lingkod na aming ama pababa sa Sheol[a] nang may dalamhati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa libingan” o “sa dako ng mga patay.” Hebreo: “Sheol.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Kaya
  rationale: Ipinakikita nito ang resultang kasunod ng kondisyong binanggit sa naunang talata, nang hindi literal at mabigat na ginagaya ang Hebreong idyoma.
- source_word: כִּרְאוֹתוֹ
  choice: kapag nakita niya
  rationale: 'Ang infinitive construct na may כְּ at hulaping 3ms ay nagsasaad ng panahong pangyayari: “kapag nakita niya.”'
- source_word: כִּי אֵין הַנַּעַר
  choice: na wala ang bata
  rationale: Sa konteksto, ang אֵין ay tumutukoy sa pagkawala o hindi pagkanaroon ni Benjamin sa pagbabalik ng magkakapatid; hindi nito tahasang sinasabing patay na siya.
- source_word: הַנַּעַר
  choice: ang bata
  rationale: Maaaring tumukoy ang נַעַר sa kabataan o binata, ngunit ang “bata” ay angkop sa madamdaming pananaw ng ama at ni Juda kay Benjamin.
- source_word: וָמֵת
  choice: mamamatay siya
  rationale: Ipinagpapatuloy ng pandiwa ang bunga ng kondisyon at tumutukoy sa inaasahang pagkamatay ng ama kapag nakita niyang wala si Benjamin.
- source_word: וְהוֹרִידוּ
  choice: magdadala ... pababa
  rationale: Pinananatili nito ang direksiyonal at matalinghagang puwersa ng Hiphil ng ירד, ngunit mas natural sa Filipino kaysa sa literal na “ibababa.”
- source_word: עֲבָדֶיךָ
  choice: kaming mga lingkod mo
  rationale: Ito ay magalang na pagtukoy ni Juda at ng kaniyang mga kapatid sa kanilang sarili sa harap ng isang pinuno; hindi kailangang idiin dito ang kahulugang “alipin.”
- source_word: שֵׂיבַת
  choice: ang uban
  rationale: Pinananatili ang kongkretong larawan ng uban, na metonimikong tumutukoy sa katandaan at sa matandang ama mismo.
- source_word: עַבְדְּךָ אָבִינוּ
  choice: ng iyong lingkod na aming ama
  rationale: Pinananatili ang dalawang paglalarawan kay Jacob bilang lingkod ng kausap at ama ng mga nagsasalita.
- source_word: בְּיָגוֹן
  choice: nang may dalamhati
  rationale: Likas at marangal na Filipino ito para sa kalungkutan o dalamhating kasama ng pagbaba sa Sheol.
- source_word: שְׁאֹלָה
  choice: sa Sheol
  rationale: Pinananatili ang Hebreong katawagan upang hindi ito paliitin sa libingan lamang at upang mapanatili ang saklaw nitong maaaring tumukoy sa dako ng mga patay.
theological_decisions:
- issue: Pagbibigay-kahulugan sa שְׁאוֹל
  choice: Sheol
  alternative: libingan; dako ng mga patay
  rationale: Ang transliterasyong “Sheol” ay nagpapanatili sa mas malawak at hindi ganap na tiyak na saklaw ng Hebreong salita, sa halip na magpasok ng isang makitid na doktrinal o kosmolohikal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kongkretong larawang “uban” at ang sinaunang katawagang “Sheol,” habang ginawang natural ang ayos ng pangungusap sa Filipino.
