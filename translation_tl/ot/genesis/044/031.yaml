  source_fidelity: 'Tapat ang salin sa Hebreong sintaks at diwa: ang pansamantalang sugnay na “kapag nakita niyang wala ang bata,” ang resultang “mamamatay siya,” at ang kasunod na pagkilos ng “mga lingkod” ay malinaw na naipapahayag. Napananatili rin ang kongkretong idyomang “uban ... pababa sa Sheol” at ang dalamhati bilang kalagayan ng pagbaba.'
  naturalness: Likas, malinaw, at marangal ang modernong Filipino. Ang “Kaya” ay maayos na panandang bunga sa daloy mula sa naunang talata. Ang “kaming mga lingkod mo ang magdadala” ay natural na pagbibigay-diin sa mga nagsasalita at angkop sa magalang na pananalita sa harap ng pinuno.
  terminology: Ang “bata” ay katanggap-tanggap para sa נער sa emosyonal na pananaw ng talata. Ang “mga lingkod mo” ay angkop na pananalitang magalang para sa עבדיך. Ang “uban” ay tumpak na pinananatili ang pisikal na larawan at metonimiya ng Hebreo. Ang “Sheol,” kasama ng talababa, ay maingat na pinananatili ang saklaw at hindi nililimitahan sa isang doktrinal na pakahulugan.
