  text: Now[a], when I come to your servant my father[b], and the boy is not with us—his life being bound up with the boy’s life—
translation:
  language: tl
  text: Ngayon, pagdating ko sa iyong lingkod, ang aking ama, at hindi namin kasama ang binata—ang buhay niya ay nakatali sa buhay ng binata—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngayon
  rationale: Likas na panandang diskurso sa pagpapatuloy ng pakiusap ni Juda; naipahihiwatig na ng daloy ang pang-ugnay na וְ.
- source_word: כְּבֹאִי
  choice: pagdating ko
  rationale: 'Ang כְּ na may infinitive construct at hulaping unang panauhan ay temporal: “kapag/pagdating ko.” Ang “pagdating ko” ay natural at maikli sa Tagalog.'
- source_word: אֶל עַבְדְּךָ אָבִי
  choice: sa iyong lingkod na aking ama
  rationale: Pinananatili ang magalang na pagtukoy ni Juda kay Jacob bilang lingkod ni Jose, habang malinaw na ang lingkod ay ang kanyang ama.
- source_word: הַנַּעַר
  choice: ang binata
  rationale: Ang נַעַר ay maaaring tumukoy sa kabataan o batang lalaki; sa konteksto ni Benjamin, “binata” ang natural na modernong Tagalog nang hindi ipinapalagay na siya ay maliit na bata.
- source_word: אֵינֶנּוּ אִתָּנוּ
  choice: hindi namin kasama
  rationale: Tuwirang idiomatikong salin ng pahayag na wala siya sa piling nila.
- source_word: וְנַפְשׁוֹ
  choice: ang buhay niya
  rationale: Sa konteksto, ang נֶפֶשׁ ay tumutukoy sa mismong buhay o pagkatao ng ama, hindi kinakailangang sa teknikal na konsepto ng “kaluluwa.”
- source_word: קְשׁוּרָה
  choice: ay nakatali
  rationale: Inilalarawan ng passive participle ang matibay at patuloy na pagkakaugnay; natural sa Tagalog ang “nakatali.”
- source_word: בְנַפְשׁוֹ
  choice: sa buhay ng binata
  rationale: Ang hulaping panghalip ay tumutukoy sa konteksto kay Benjamin. Nilinaw ang tinutukoy upang maiwasan ang maling pagbasa na nakatali ang buhay ng ama sa sarili niyang buhay.
