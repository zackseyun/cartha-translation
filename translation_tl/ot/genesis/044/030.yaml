translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal. Pinanatili ang nakabitin na kayarian ng pangungusap dahil nagpapatuloy ang pahayag sa susunod na talata. Ang mga gitling ay naghihiwalay sa circumstantial clause nang hindi ito tahasang ginagawang sanhi.
