  text: So each man hurried and lowered his sack to the ground[b][a], and each man opened his sack.
translation:
  language: tl
  text: Kaya nagmadali sila. Ibinaba ng bawat isa ang kanyang sako sa lupa, at binuksan ng bawat isa ang kanyang sako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit ang “bawat isa” bago ang dalawang kilos: ibinaba at binuksan. Binibigyang-diin nito na ginawa ng bawat isa ang mga ito sa sarili niyang sako.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: nagmadali sila
  rationale: Ang pandiwang מהר ay nagsasaad ng agarang pagkilos. Ang “nagmadali sila” ay natural sa makabagong Tagalog at pinananatili ang tahasang pangmaramihang anyo ng Hebreo.
- source_word: וַיּוֹרִדוּ
  choice: ibinaba
  rationale: Ang Hiphil ng ירד ay may diwang “pinababa.” Sa konteksto ng pag-aalis ng mga sako at paglalapag sa lupa, malinaw at natural ang “ibinaba.”
- source_word: אִישׁ ... אַמְתַּחְתּוֹ
  choice: bawat isa ... ang kanyang sako
  rationale: Distributibo ang אִישׁ dito. Inilalahad ng “bawat isa” na isa-isang ibinaba at binuksan ng magkakapatid ang kani-kanilang sako, nang hindi gumagamit ng mas mabigat na “bawat lalaki.”
- source_word: אַמְתַּחַת
  choice: sako
  rationale: Tumutukoy ito sa sisidlan ng butil o panustos. Ang “sako” ang pinakanatural at angkop sa tagpo.
- source_word: אָרְצָה
  choice: sa lupa
  rationale: Ipinahihiwatig ng directional form ang paggalaw pababa patungo sa lupa. Karaniwang Tagalog ang “sa lupa” sa ganitong konteksto.
- source_word: וַיִּפְתְּחוּ
  choice: binuksan
  rationale: Tuwirang katumbas ito ng פתח at hindi nangangailangan ng pagpapalawak.
