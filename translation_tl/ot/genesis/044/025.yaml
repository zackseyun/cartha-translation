  text: Pagkatapos, sinabi ng aming ama[a], “Bumalik kayo at bumili ng kaunting pagkain para sa amin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Muling pumunta kayo at bumili para sa amin ng kaunting butil.” Pangkalahatang salita para sa “pagkain” ang ginamit sa Hebreo, bagaman butil ang tinutukoy ng mas malawak na konteksto.'
