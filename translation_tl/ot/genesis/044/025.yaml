lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng pangyayari.
- source_word: אָבִינוּ
  choice: aming ama
  rationale: Tuwirang tumutukoy ito kay Jacob bilang ama ng magkakapatid.
- source_word: שֻׁבוּ
  choice: Bumalik kayo
  rationale: Ang pautos na anyo ng שוב ay nag-uutos sa kanila na muling pumunta sa lugar na pinanggalingan nila; malinaw at natural ang “Bumalik kayo.”
- source_word: שִׁבְרוּ
  choice: bumili
  rationale: Sa salaysay tungkol kay Jose, ang pandiwa ay tumutukoy sa pagbili ng pagkain o butil. Hindi na kailangang tukuying “butil” dahil kasunod ang אֹכֶל.
- source_word: לָנוּ
  choice: para sa atin
  rationale: Malinaw na ipinapahayag nito ang benepaktibong diwa ng pang-ukol at natural ito sa modernong Tagalog.
- source_word: מְעַט
  choice: kaunting
  rationale: Pinananatili nito ang diwa ng maliit na dami sa maikli at likas na paraan.
- source_word: אֹכֶל
  choice: pagkain
  rationale: Pangkalahatang salita ang אֹכֶל para sa pagkain. Bagaman butil ang tinutukoy ng mas malawak na konteksto, hindi dapat paliitin ang kahulugan sa pangunahing teksto.
