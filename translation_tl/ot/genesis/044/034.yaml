  yaml_path: translation/ot/genesis/044/034.yaml
  text: For how can I go up to my father if the boy is not with me? Otherwise, I would have to see the disaster that would come upon my father.
translation:
  language: tl
  text: Sapagkat paano ako makababalik sa aking ama kung hindi ko kasama ang binatilyo? Baka makita ko ang kapahamakang darating sa aking ama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: makababalik
  rationale: Literal na “aahon/akyat ako,” ngunit sa konteksto ay tumutukoy sa pagbabalik ni Juda sa Canaan mula sa Ehipto; natural sa modernong Tagalog ang “makababalik.”
- source_word: הַנַּעַר
  choice: ang binatilyo
  rationale: Ang נַעַר ay maaaring “batang lalaki,” “binata,” o “lingkod.” Dito ay si Benjamin na tinutukoy bilang nakababatang anak; pinananatili ng “binatilyo” ang pampamilyang pananaw nang hindi siya ginagawang munting bata.
- source_word: בָרָע
  choice: ang kapahamakan
  rationale: Ang רָע ay malawak na “masama/sakuna/kapahamakan”; sa konteksto, ito ang matinding pinsalang sasapit kay Jacob.
- source_word: יִמְצָא אֶת אָבִי
  choice: sasapit sa aking ama
  rationale: Ang Hebreong idyomang “matatagpuan ang aking ama” ay natural na ipinahahayag bilang kapahamakang “sasapit” sa kaniya.
theological_decisions:
- issue: Lakas ng פֶּן at pananagutan ni Juda bilang saksi
  choice: Ayokong masaksihan
  alternative: Baka makita ko / Kung hindi, makikita ko
  rationale: Ang פֶּן ay nagpapahayag ng kinatatakutang kalalabasan (“nang hindi ko makita/lest I see”). Ang “Ayokong masaksihan” ay natural na Tagalog at pinananatili ang emosyonal na pakiusap ni Juda, nang hindi ipinapalagay na tiyak ang pagkamatay ni Jacob.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “aking ama” upang mapanatili ang taimtim at pormal na tono ng pakiusap ni Juda; walang kailangang talababa.
