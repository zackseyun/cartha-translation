  naturalness: Natural at marangal sa modernong Tagalog ang “Paano ako makababalik” at “kapahamakang darating sa aking ama.” Ang “Baka makita ko” ay tuwirang natural at mas malapit sa lakas ng Hebreo kaysa “Ayokong masaksihan.”
