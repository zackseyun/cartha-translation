base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/014.yaml
  text: Then Judah and his brothers came into Joseph’s house[a]. He was still there[b], and they fell to the ground before him.
translation:
  language: tl
  text: Dumating si Juda at ang kanyang mga kapatid sa bahay ni Jose. Naroon pa siya, at nagpatirapa sila sa lupa sa harap niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “bumagsak sila sa lupa sa harap niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dumating
  rationale: Ang wayyiqtol ng בוא ay nagsusulong sa salaysay bilang payak na nagdaang kilos. Likas sa modernong Tagalog ang “dumating” sa tagpong ito.
- source_word: יְהוּדָה וְאֶחָיו
  choice: si Juda at ang kanyang mga kapatid
  rationale: Pinananatili nito ang natatanging pagbanggit kay Juda bilang pangunahing tauhan habang malinaw na kasama niya ang kanyang mga kapatid.
- source_word: בֵּיתָה יוֹסֵף
  choice: sa bahay ni Jose
  rationale: Ipinahihiwatig ng hulaping patungo ang pagkilos patungo sa bahay. Sa Tagalog, likas na saklaw ng “dumating ... sa bahay” ang pagdating sa kinaroroonan, nang hindi higit na tinutukoy kung nasa loob na sila.
- source_word: וְהוּא עוֹדֶנּוּ שָׁם
  choice: Naroon pa siya
  rationale: Ang עוֹדֶנּוּ ay nagsasaad ng nagpapatuloy na kalagayan. Pinananatili ng “siya” ang panghalip ng Hebreo, na tumutukoy kay Jose ayon sa konteksto.
- source_word: וַיִּפְּלוּ ... אָרְצָה
  choice: nagpatirapa sila sa lupa
  rationale: Bagaman pangunahing kahulugan ng נפל ang “bumagsak,” ipinakikita ng paggalaw tungo sa lupa sa harap ni Jose ang kusang pagpapatirapa bilang paggalang o pagsusumamo. Natural at malinaw itong naipahahayag ng “nagpatirapa.”
- source_word: לְפָנָיו
  choice: sa harap niya
  rationale: Ito ang natural na katumbas sa Tagalog ng idyomang literal na “sa harap ng kanyang mukha.”
