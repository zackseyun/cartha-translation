translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang maramihang magalang na “ninyo/inyo” para sa pakikipag-usap ng magkakapatid sa katiwala. Ang ayos ng pangungusap ay natural sa Tagalog habang pinananatili ang lohika at konkretong pananalita ng Hebreo.
