base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/008.yaml
  text: Look[a], the silver that we found in the mouths of our sacks we brought back to you from the land of Canaan. So how could we steal silver or gold from your master's house?
translation:
  language: tl
  text: Narito, ang pilak na natagpuan namin sa bukana ng aming mga sako[a] ay ibinalik namin sa iyo mula sa lupain ng Canaan. Kaya paano namin magagawang magnakaw mula sa bahay ng iyong panginoon ng pilak o ginto?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa bibig ng aming mga sako,” isang idyoma para sa bukana o itaas ng isang sako.
    reason: cultural_note
lexical_decisions:
- source_word: הֵן
  choice: Tingnan ninyo
  rationale: Pantawag-pansin na nagpapadiin sa pangangatwiran ng mga kapatid; natural at magalang sa modernong Tagalog.
- source_word: כֶּסֶף
  choice: pilak
  rationale: Pinananatili ang konkretong kahulugan at ang pagtutugma nito sa “ginto” sa hulihan ng talata, bagaman salapi ang gamit nito sa konteksto.
- source_word: בְּפִי אַמְתְּחֹתֵינוּ
  choice: sa bukana ng aming mga sako
  rationale: Ang literal na “sa bibig ng aming mga sako” ay isang idyoma para sa bukasan o itaas ng sako; “bukana” ang malinaw at likas na katumbas sa Tagalog.
- source_word: הֱשִׁיבֹנוּ אֵלֶיךָ
  choice: ibinalik namin sa inyo
  rationale: Tumpak na ipinahahayag ang causative na diwa ng pagbabalik ng pilak sa kausap.
- source_word: מֵאֶרֶץ כְּנָעַן
  choice: mula pa sa lupain ng Canaan
  rationale: Ang “mula pa” ay natural na nagpapakita ng diin sa layo at pagsisikap na ibalik ang pilak nang hindi nagdaragdag ng bagong pangyayari.
- source_word: וְאֵיךְ נִגְנֹב
  choice: Kaya paano kami magnanakaw
  rationale: Ipinapakita ng “kaya” ang inferensiya, at ang tanong ay nagpapanatili sa retorikal at modal na puwersa ng Hebreo.
- source_word: מִבֵּית אֲדֹנֶיךָ
  choice: mula sa bahay ng inyong panginoon
  rationale: Ang אֲדֹנֶיךָ ay tumutukoy sa taong pinaglilingkuran ng katiwala, hindi sa titulong panrelihiyon; pinananatili rin ang literal na “bahay.”
- source_word: כֶּסֶף אוֹ זָהָב
  choice: pilak o ginto
  rationale: Pinananatili ang konkretong pares ng mga mahalagang metal at ang pag-uulit ng “pilak.”
