- from: Tingnan ninyo[a], ang pilak na natagpuan namin sa bukana ng aming mga sako ay ibinalik namin sa inyo mula pa sa lupain ng Canaan. Kaya paano kami magnanakaw ng pilak o ginto mula sa bahay ng inyong panginoon?
  to: Narito, ang pilak na natagpuan namin sa bukana ng aming mga sako[a] ay ibinalik namin sa iyo mula sa lupain ng Canaan. Kaya paano namin magagawang magnakaw mula sa bahay ng iyong panginoon ng pilak o ginto?
  rationale: Inalis ang dagdag na “pa,” ginawang mas malinaw ang retorikal-modal na tanong, at itinugma ang singular na kausap sa Hebreo. Inilipat ang footnote marker upang tumukoy ito sa idyomang talagang ipinapaliwanag ng tala. Napanatili ang konkretong “pilak o ginto” at ang literal na “bahay ng iyong panginoon.”
