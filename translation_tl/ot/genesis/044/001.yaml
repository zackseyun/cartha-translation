- from: Pagkatapos, iniutos niya sa namamahala sa kanyang sambahayan, “Punuin mo ng pagkain ang mga sako ng mga lalaking ito, hanggang sa makakaya nilang dalhin, at ilagay mo ang pilak ng bawat isa sa bunganga ng kanyang sako.[a]”
  to: Pagkatapos, iniutos niya sa taong namamahala sa kanyang sambahayan, “Punuin mo ng pagkain ang mga sako ng mga lalaki ayon sa makakaya nilang dalhin, at ilagay mo ang pilak ng bawat isa sa bunganga ng kanyang sako.[a]”
  rationale: Pinalitan ang pariralang maaaring magpahiwatig ng oras ng isang pananalitang nagsasaad ng sukat ayon sa kakayahang magdala, alinsunod sa Hebreo. Inalis din ang hindi kinakailangang “ito” upang hindi magdagdag ng deiktikong kahulugang wala sa pinagmulan. Pinanatili ang talababa at ang angkla nito sa pariralang ipinapaliwanag.
