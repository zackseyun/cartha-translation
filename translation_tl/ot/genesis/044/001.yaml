  text: Then he commanded the one over his house[a], saying, “Fill the men's sacks with food, as much as they can carry, and put each man's silver in the mouth of his sack.”
translation:
  language: tl
  text: Pagkatapos, iniutos niya sa taong namamahala sa kanyang sambahayan, “Punuin mo ng pagkain ang mga sako ng mga lalaki ayon sa makakaya nilang dalhin, at ilagay mo ang pilak ng bawat isa sa bunganga ng kanyang sako.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa bunganga ng kanyang sako,” ibig sabihin, sa bukana ng kanyang sako.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: Pagkatapos, iniutos niya
  rationale: Ang wayyiqtol ng צוה ay nagsusulong ng salaysay at nagpapahayag ng utos; likas na ipinahihiwatig ng “Pagkatapos” ang kasunod na pangyayari.
- source_word: אֲשֶׁר עַל בֵּיתוֹ
  choice: sa namamahala sa kanyang sambahayan
  rationale: Literal itong tumutukoy sa taong “nasa ibabaw ng kanyang bahay,” ibig sabihin, ang opisyal na nangangasiwa sa sambahayan ni Jose. Malinaw ito sa modernong Tagalog nang hindi gumagamit ng teknikal na titulo.
- source_word: מַלֵּא
  choice: Punuin mo
  rationale: Tuwirang pautos na anyo ng מלא; ang “Punuin mo” ay natural at pinananatili ang isahang kausap.
- source_word: אַמְתְּחֹת
  choice: mga sako
  rationale: Tumutukoy sa mga lalagyan ng pagkain o butil sa paglalakbay; mas angkop sa sinaunang konteksto ang “sako” kaysa sa pangkalahatang “bag.”
- source_word: הָאֲנָשִׁים
  choice: ng mga lalaking ito
  rationale: Pinananatili ang tahasang pagtukoy sa “mga lalaki” at hindi ipinapalit ang kontekstuwal ngunit hindi nakasaad na “magkakapatid.” Idinagdag ang “ito” bilang likas na Tagalog na pantukoy sa grupong kaharap.
- source_word: אֹכֶל
  choice: pagkain
  rationale: Pangkalahatang salita ito para sa pagkain. Bagaman butil ang sangkot sa konteksto, hindi iyon nililimitahan ng salitang Hebreo sa talatang ito.
- source_word: כַּאֲשֶׁר יוּכְלוּן שְׂאֵת
  choice: hanggang sa makakaya nilang dalhin
  rationale: Likas na ipinapahayag sa Tagalog ang lawak ayon sa kanilang kakayahang magdala, habang pinananatili ang diwa ng יכל at שׂאת.
- source_word: וְשִׂים
  choice: at ilagay mo
  rationale: Karaniwang katumbas ng שׂים ang “ilagay”; pinananatili rin ang pautos na anyo.
- source_word: כֶּסֶף אִישׁ
  choice: ang pilak ng bawat isa
  rationale: Pinananatili ng “pilak” ang leksikal na halaga ng כֶּסֶף at ng “bawat isa” ang distributibong diwa ng אִישׁ, nang hindi tahasang dinaragdagan ng salitang “bayad.”
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: sa bunganga ng kanyang sako
  rationale: Pinananatili ang malinaw na larawang Hebreo na “bunganga ng sako”; ipinapaliwanag sa talababa na ang tinutukoy ay ang bukana nito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” para sa saklaw ng pamamahala sa bahay at ang “namamahala” sa halip na isang teknikal o makalumang titulo. Inilagay ang talababa sa pariralang aktuwal nitong ipinapaliwanag.
