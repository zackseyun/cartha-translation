    issue: Ang “hanggang sa makakaya nilang dalhin” ay hindi angkop na pagsasalin ng panukat na parirala.
    rationale: Ang כַּאֲשֶׁר ay nagpapahayag ng “ayon sa/gaano man ang kaya,” hindi ng temporal na “hanggang sa.” Ang “ayon sa makakaya nilang dalhin” ay mas tumpak at natural.
  - severity: low
    issue: Ang “mga lalaking ito” ay nagdaragdag ng deiktikong “ito.”
    rationale: Ang הָאֲנָשִׁים ay “ang mga lalaki/tao”; hindi nito tahasang taglay ang “ito.” Hindi kinakailangan ang dagdag upang maging malinaw ang Tagalog.
