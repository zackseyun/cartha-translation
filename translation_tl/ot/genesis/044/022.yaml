  yaml_path: translation/ot/genesis/044/022.yaml
  text: And we said to my lord[a], ‘The boy cannot leave his father, for if he should leave his father, he would die.’
translation:
  language: tl
  text: At sinabi namin sa aming panginoon, “Hindi kayang iwan ng binata ang kanyang ama, sapagkat kung iiwan niya ang kanyang ama, mamamatay ang ama.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na anyo: “at iiwan niya ang kanyang ama, at mamamatay siya.” Hindi tahasang sinasabi sa Hebreo kung sino ang mamamatay; ipinahihiwatig ng konteksto na ang tinutukoy ay ang ama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: At sinabi namin
  rationale: Pinananatili nito ang sunod-sunod na daloy ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi dinaragdagan ang ugnayan bilang tahasang sanhi o bunga.
- source_word: אֶל אֲדֹנִי
  choice: sa aking panginoon
  rationale: Magalang na katawagan ito kay Jose sa konteksto ng pakikipag-usap sa isang mataas na pinuno; ang “panginoon” ay marangal at hindi labis na nagpapahiwatig ng pagkaalipin.
- source_word: לֹא יוּכַל
  choice: Hindi kayang
  rationale: Likas na makabagong Tagalog para sa kawalan ng kakayahang gawin ang kasunod na kilos.
- source_word: הַנַּעַר
  choice: ang binata
  rationale: Maaaring tumukoy ang נַעַר sa isang batang lalaki o kabataang lalaki. Ang “binata” ay angkop kay Benjamin bilang nakababatang anak nang hindi siya ipinapalagay na musmos.
- source_word: לַעֲזֹב
  choice: iwan
  rationale: Tumutukoy rito sa paglayo o pag-iwan sa ama, hindi kinakailangang sa moral na diwa ng pagtatakwil.
- source_word: אָבִיו
  choice: ang kanyang ama
  rationale: Tuwirang ipinapahayag ang pagmamay-ari at pinananatili ang pag-uulit ng Hebreo.
- source_word: וְעָזַב
  choice: kung iiwan niya
  rationale: Isinasalin ang kondisyunal na diwa ng sugnay sa natural na Tagalog habang pinananatili ang paksa bilang binata.
- source_word: וָמֵת
  choice: mamamatay ito
  rationale: Ang “ito” ay likas na tumutukoy sa kalapit na “ama” at ipinapahayag ang malamang na kahulugan sa konteksto, habang itinatala sa talababa na hindi tahasang pinangalanan ng Hebreo ang paksa.
theological_decisions:
- issue: Hindi tahasang paksa ng וָמֵת
  choice: Sa pangunahing teksto, ang “ito” ay tumutukoy sa ama.
  alternative: “mamamatay siya,” na maaaring tumukoy sa binata o sa ama
  rationale: Sa konteksto ng pakiusap ni Juda, ang ama ang malamang na mamamatay kapag iniwan siya ni Benjamin. Gayunman, hindi tahasang inuulit ng Hebreo ang pangngalan, kaya pinananatili sa talababa ang pormal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “aking panginoon” upang mapanatili ang magalang na pananalita ni Juda, at “binata” upang katawanin ang malawak na saklaw ng נַעַר nang hindi gawing musmos si Benjamin.
