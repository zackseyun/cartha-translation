  text: וַ/יֹּ֕אמֶר גַּם עַתָּ֥ה כְ/דִבְרֵי/כֶ֖ם כֶּן ה֑וּא אֲשֶׁ֨ר יִמָּצֵ֤א אִתּ/וֹ֙ יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֖ם תִּהְי֥וּ נְקִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/010.yaml
  text: And he said[a], “Even now, let it be according to your words. The one with whom it is found will be my servant[b], and you will be innocent.”
translation:
  language: tl
  text: At sinabi niya, “Sige, mangyari ayon sa sinabi ninyo. Ang sinumang makitaan nito ay magiging alipin ko, ngunit kayong iba ay walang pananagutan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Sige
  rationale: Sa kontekstong ito, ang parirala ay tugon ng agarang pagsang-ayon sa usapan. Ang “Sige” ay natural sa modernong Tagalog at hindi nagpapahiwatig ng temporal na diwang maaaring idulot ng literal na “kahit ngayon.”
- source_word: כְדִבְרֵיכֶם כֶּן הוּא
  choice: mangyari ayon sa sinabi ninyo
  rationale: Pinananatili nito ang pormal na pagsang-ayon sa kanilang sinabi, habang ang tuldok pagkatapos ng pangungusap ay nagpapakitang ang kasunod ay sariling pasiya ng katiwala at hindi ganap na pag-uulit sa parusang iminungkahi nila.
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ
  choice: ang sinumang makitaan nito
  rationale: Natural itong paraan sa Tagalog upang tukuyin ang taong matatagpuang may hawak ng saro, at nananatiling di-tiyak ang pagkakakilanlan.
- source_word: יִהְיֶה לִּי עָבֶד
  choice: ay magiging alipin ko
  rationale: Ang עֶבֶד dito ay sapilitang kalagayang bunga ng parusa, kaya mas tiyak ang “alipin” kaysa “lingkod.” Ipinahihiwatig ng “magiging” ang pagpasok sa kalagayang iyon.
- source_word: וְאַתֶּם תִּהְיוּ נְקִיִּם
  choice: ngunit kayong iba ay walang pananagutan
  rationale: Ang נְקִיִּם ay tumutukoy sa pagiging malaya sa sala o pananagutan. Nililinaw ng “kayong iba” na ang kausap ay ang mga kapatid maliban sa taong makikitaan ng saro; ang “ngunit” ay natural na nagpapakita ng kaibahan sa dalawang kahihinatnan.
