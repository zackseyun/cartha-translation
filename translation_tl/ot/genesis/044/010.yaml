  register: Makabagong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang pangunahing paghinto pagkatapos ng pagsang-ayon upang hindi magmukhang inuulit ng katiwala ang mas mabagsik na mungkahi sa naunang talata.
