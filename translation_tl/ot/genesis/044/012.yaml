  text: וַ/יְחַפֵּ֕שׂ בַּ/גָּד֣וֹל הֵחֵ֔ל וּ/בַ/קָּטֹ֖ן כִּלָּ֑ה וַ/יִּמָּצֵא֙ הַ/גָּבִ֔יעַ בְּ/אַמְתַּ֖חַת בִּנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/012.yaml
  text: And he searched[a], beginning with the oldest and finishing with the youngest, and the cup was found in Benjamin’s sack.
translation:
  language: tl
  text: Naghalughog siya, simula sa pinakamatanda hanggang sa pinakabata, at natagpuan ang kopa[a] sa sako ni Benjamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “saro.” Ang salitang Hebreo ay maaaring tumukoy sa isang kopa o saro.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַפֵּשׂ
  choice: Naghalughog siya
  rationale: Ang חפשׂ ay tumutukoy rito sa masusing paghahanap sa mga dala ng magkakapatid. Likas sa modernong Tagalog ang “naghalughog” at hindi nito kailangang dagdagan ng tahasang layon na wala sa Hebreo.
- source_word: בַּגָּדוֹל הֵחֵל
  choice: simula sa pinakamatanda
  rationale: Sa konteksto, edad at pagkakasunod-sunod ng magkakapatid ang tinutukoy ng גָּדוֹל, hindi laki o katayuan.
- source_word: וּבַקָּטֹן כִּלָּה
  choice: hanggang sa pinakabata
  rationale: Ang קָטֹן ay kasalungat ng “pinakamatanda” sa konteksto ng pamilya. Malinaw na ipinahihiwatig ng “hanggang” ang pagtatapos ng paghahanap sa pinakabata.
- source_word: וַיִּמָּצֵא
  choice: natagpuan
  rationale: Pinananatili ng “natagpuan” ang pasibong diwa ng anyong Niphal sa halip na tahasang gawing “natagpuan niya.”
- source_word: הַגָּבִיעַ
  choice: ang kopa
  rationale: Ang גָּבִיעַ ay maaaring tumukoy sa kopa o saro. Ang “kopa” ay maikli, malinaw, at angkop sa salaysay; inilalagay sa talababa ang leksikal na alternatibo.
- source_word: בְּאַמְתַּחַת
  choice: sa sako
  rationale: Ang אַמְתַּחַת ay sisidlang ginagamit sa pagdadala ng butil o iba pang panustos; ang “sako” ang pinakatumpak sa konteksto ng paglalakbay.
- source_word: בִּנְיָמִן
  choice: ni Benjamin
  rationale: Ginamit ang karaniwang modernong baybay ng pangalang pantangi at ang likas na panandang Tagalog para sa pagmamay-ari.
