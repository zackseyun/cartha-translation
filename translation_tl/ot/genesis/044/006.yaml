translation:
  language: tl
  text: Naabutan niya sila at sinabi sa kanila ang mga salitang ito:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Inabutan niya sila at sinabi sa kanila ang mga salitang ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשִּׂגֵם
  choice: Naabutan niya sila
  rationale: Ang Hifil na anyo ng נשׂג na may hulaping 3mp ay nagsasaad na hinabol at naabutan ng katiwala ang mga kapatid. Likas at malinaw sa modernong Tagalog ang “naabutan” sa ganitong konteksto.
- source_word: וַיְדַבֵּר
  choice: at sinabi
  rationale: Karaniwang nangangahulugang “nagsalita” ang דבר, ngunit dahil may tuwirang layon na “ang mga salitang ito,” mas natural sa Tagalog ang “sinabi” kaysa “sinalita,” habang pinananatili ang diwa ng pormulang pambungad sa kasunod na pananalita.
- source_word: אֲלֵהֶם
  choice: sa kanila
  rationale: Ipinapahayag ng אֶל ang direksiyon ng pagsasalita patungo sa mga kapatid; tuwiran itong naihahatid ng “sa kanila.”
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ang mga salitang ito
  rationale: Literal itong “ang mga salitang ito” at nagpapakilala sa mismong sasabihin sa kasunod na talata. Dignified at malinaw ang parirala sa modernong Tagalog.
