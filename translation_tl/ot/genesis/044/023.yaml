review_pass:
  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa: nagsasalita si Juda sa ikalawang panauhan, tumutukoy sa kanilang bunsong kapatid na kailangang bumaba kasama nila, at nagsasaad na hindi na sila muling pahihintulutang makita ang mukha ng nagsasalita. Gayunman, ang ayos ng sugnay na “hindi bababang kasama ninyo ang bunso ninyong kapatid” ay hindi sapat na malinaw o natural sa Filipino.'
  naturalness: Kailangan ang bahagyang pagsasaayos para maging likas ang pagsasaad ng pagbasang kasama nila. Gayundin, ang “makakakita sa aking mukha” ay hindi likas para sa tuwirang bagay; mas natural ang “makikita ang mukha ko.” Ang kasalukuyang talababa ay may di-likas na “makakaharap sa akin”; ang wastong idiomatikong anyo ay “haharap sa akin.”
  terminology: Ang “mga lingkod,” “bunso ninyong kapatid,” at ang literal na “mukha ko” ay angkop sa marangal at makabagong rehistro. Walang usaping teolohikal na nangangailangan ng pagbabago.
  issues:
  - severity: medium
    issue: Hindi malinaw ang ayos ng sugnay tungkol sa bunsong kapatid.
    rationale: Ang “Kung hindi bababang kasama ninyo ang bunso ninyong kapatid” ay mabigat at maaaring magmukhang mali ang pagkakabit ng “kasama ninyo.” Ang “Kung hindi bababa ang bunso ninyong kapatid na kasama ninyo” ay malinaw na inilalapat ang pagsama sa kapatid na siyang bababa.
  - severity: medium
    issue: Di-likas ang pandiwang “makakakita sa aking mukha.”
    rationale: Sa Filipino, ang mukha ay tuwirang layon ng “makita”; ang “Makikita ang mukha ko” ang likas na katumbas ng “see my face.”
  - severity: medium
    issue: Di-wasto ang idiomatikong alternatibo sa talababa.
    rationale: Ang “makakaharap sa akin” ay hindi likas sa kahulugang appear before/face someone. Ang “haharap sa akin” ang wastong idiomatikong pagpapahayag.
  revised_text: At sinabi mo sa iyong mga lingkod, ‘Kung hindi bababa ang bunso ninyong kapatid na kasama ninyo, hindi na ninyo muling makikita ang mukha ko[a].’
