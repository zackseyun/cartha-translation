translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magalang na “iyong/mong” at “ninyo/kayo,” pati ang idyomang “makakita sa aking mukha,” ngunit nilinaw ang likas na kahulugan nito sa talababa.
