translation:
  language: tl
  text: At sinabi mo sa iyong mga lingkod, ‘Kung hindi bababa ang bunso ninyong kapatid na kasama ninyo, hindi na ninyo muling makikita ang mukha ko[a].’
  philosophy: optimal-equivalence
