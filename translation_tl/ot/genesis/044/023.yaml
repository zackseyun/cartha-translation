  - marker: a
    text: O, sa mas natural na pananalita, “hindi na kayo muling haharap sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: At sinabi mo
  rationale: Pinananatili ng “At” ang pagkakaugnay sa salaysay, at natural na isinasalin sa nakaraang panahunan ang wayyiqtol ng אמר.
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Sa magalang na pananalita ni Juda sa isang makapangyarihang opisyal, ang “mga lingkod” ay angkop na pagtukoy sa kanilang mababang katayuan nang hindi ipinipilit ang diing legal ng pagkaalipin.
- source_word: אִם לֹא
  choice: Kung hindi
  rationale: Tuwirang pinananatili nito ang negatibong kondisyong nasa Hebreo.
- source_word: יֵרֵד
  choice: bababang
  rationale: Ang ירד ay literal na “bumaba.” Ang anyong “bababang kasama ninyo” ay natural sa Filipino at hindi kailangang tahasang piliin ang perspektibang “pumarito” o “pumunta.”
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: ang bunso ninyong kapatid
  rationale: Ang הַקָּטֹן sa konteksto ay tumutukoy sa pinakabata sa magkakapatid; “bunso” ang likas at eksaktong katawagan sa Filipino.
- source_word: אִתְּכֶם
  choice: kasama ninyo
  rationale: Payak at natural na katumbas ng panandang nagsasaad ng pagsama.
- source_word: לֹא תֹסִפוּן
  choice: hindi na kayo muling
  rationale: Ipinapahayag ng יסף na wala nang susunod pang pag-ulit ng kilos; malinaw at natural sa Filipino ang “hindi na ... muling.”
- source_word: לִרְאוֹת פָּנָי
  choice: makakakita sa aking mukha
  rationale: Pinananatili sa pangunahing teksto ang matingkad at literal na idyomang Hebreo, habang inilalahad sa talababa ang natural na kahulugang kontekstuwal.
