- from: At sinabi mo sa iyong mga lingkod, ‘Kung hindi bababang kasama ninyo ang bunso ninyong kapatid, hindi na kayo muling makakakita sa aking mukha[a].’
  to: At sinabi mo sa iyong mga lingkod, ‘Kung hindi bababa ang bunso ninyong kapatid na kasama ninyo, hindi na ninyo muling makikita ang mukha ko[a].’
  rationale: Inayos ang ayos ng sugnay upang malinaw na ang bunsong kapatid ang kailangang bumaba kasama ng mga kapatid. Pinalitan ang di-likas na “makakakita sa aking mukha” ng karaniwang Filipino na “makikita ang mukha ko,” habang pinanatili ang literal na Hebreong larawan sa pangunahing teksto. Itinama rin ang idiomatikong alternatibo sa talababa nang hindi binabago ang kahulugan.
