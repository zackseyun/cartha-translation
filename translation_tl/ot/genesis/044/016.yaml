base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/016.yaml
  text: And Judah said[a], “What shall we say to my lord? What shall we speak? Or how shall we justify ourselves? God has found out the guilt of your servants. Here we are, my lord’s servants[c][b], both we and the one in whose hand the cup was found.”
translation:
  language: tl
  text: At sinabi ni Juda, “Ano ang masasabi namin sa aking panginoon? Ano ang maipapahayag namin? O paano namin maipakikitang nasa tama kami[a]? Inilantad ng Diyos ang pagkakasala[b] ng iyong mga lingkod. Narito kami, mga alipin ng aking panginoon[c]—kami at ang isa na sa kamay niya ay natagpuan ang kopa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paano namin mapatutunayang wala kaming sala?” Ang pandiwang Hebreo ay maaaring mangahulugang ipakitang nasa tama o pawalang-sala ang sarili.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “natuklasan ng Diyos ang aming sala” o “ibinunyag ng Diyos ang kasamaan ng iyong mga lingkod.” Ang salitang Hebreo ay maaaring tumukoy sa masamang gawa, pananagutan, o bunga ng pagkakasala.
    reason: lexical_alternative
  - marker: c
    text: Ang “mga lingkod” sa unang banggit ay magalang na pagtukoy nila sa sarili sa harap ng isang nakatataas; ang “mga alipin” dito ay tumutukoy sa kalagayan ng pagkaaliping iniaalok nilang tanggapin.
    reason: translation_clarity
lexical_decisions:
- source_word: לַאדֹנִי
  choice: sa aking panginoon / ng aking panginoon
  rationale: Tumutukoy ito kay Jose bilang nakatataas, hindi sa Diyos. Pinananatili ng “aking panginoon” ang magalang at mapagpakumbabang pananalita ni Juda.
- source_word: נֹּאמַר / נְּדַבֵּר
  choice: masasabi / maipapahayag
  rationale: Pinananatiling magkahiwalay ang magkalapit na pandiwa at ang tumitinding retorikal na pagkasiphayo, nang hindi inuulit nang mekanikal ang “sabihin.”
- source_word: נִּצְטַדָּק
  choice: maipakikitang nasa tama kami
  rationale: Ang hitpael ng צדק ay maaaring mangahulugang ipakitang matuwid o nasa tama ang sarili. Mas natural ito sa modernong Filipino kaysa sa teknikal na “ariing-matuwid ang aming sarili,” at hindi nito ipinapalagay na tunay silang walang sala.
- source_word: מָצָא אֶת עֲוֺן
  choice: inilantad ... ang pagkakasala
  rationale: Sa konteksto, ang idioma ay nagpapahiwatig na nahayag o nabunyag ng Diyos ang nakatagong pagkakasala, hindi lamang na nakita niya itong umiiral.
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: iyong mga lingkod / mga alipin
  rationale: Ang una ay magalang na pagtukoy sa sarili sa harap ng nakatataas; ang ikalawa ay aktuwal na iniaalok na kalagayan ng pagkaalipin. Mahalaga sa konteksto ang pagkakaibang ito.
- source_word: הִנֶּנּוּ
  choice: Narito kami
  rationale: Natural na presentasyonal na pahayag ito sa Filipino at ipinahihiwatig ang pagsuko nila sa kapasyahan ni Jose.
- source_word: גַּם אֲנַחְנוּ גַּם אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: kami at ang isa na natagpuan sa kamay niya ang kopa
  rationale: Pinananatili ang pagsasama kapuwa sa magkakapatid at sa partikular na taong kinitaan ng kopa, pati ang Hebreong larawang “sa kamay niya.”
- source_word: הַגָּבִיעַ
  choice: kopa
  rationale: Ang “kopa” ay malinaw at marangal na tawag sa sisidlang iniinom, at angkop sa paulit-ulit na bagay sa salaysay.
theological_decisions:
- issue: Ang tinutukoy ng הָאֱלֹהִים sa pagtatapat ni Juda
  choice: Ang Diyos mismo ang naglantad ng kanilang pagkakasala.
  alternative: Isang di-tiyak na diyos o kapangyarihang banal ang nakatuklas nito.
  rationale: Sa daloy ng Genesis, kinikilala ni Juda na ang Diyos ang naghayag ng nakatagong pagkakasala ng magkakapatid. Malinaw sa konteksto ang isahang pagtukoy, ngunit hindi nililinaw ng salin kung aling partikular na dating kasalanan ang nasa isip niya.
- issue: Kung ang עָוֹן ay gawa, pananagutan, o kaparusahan
  choice: “pagkakasala,” na maaaring saklawin ang maling gawa at ang pananagutan dito
  alternative: “kasamaan,” “sala,” o “kaparusahan dahil sa sala”
  rationale: Sadyang malawak ang salitang Hebreo. Ang “pagkakasala” ay hindi labis na nagtatakda kung ang diin ay nasa lihim na maling gawa, sa kanilang pananagutan, o sa bunga nito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “aking panginoon” bilang magalang na tawag kay Jose, hindi bilang titulong banal. Pinanatili ang tatlong retorikal na tanong at ang kaibahan ng deferensiyal na “mga lingkod” at literal na “mga alipin.”
