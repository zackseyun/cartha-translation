translation:
  language: tl
  text: Tinanong po ng aking panginoon ang kanyang mga lingkod, ‘Mayroon ba kayong ama o kapatid na lalaki?’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: aking panginoon
  rationale: Magalang na pantawag ni Juda sa pinunong Ehipsiyo; pinananatili nito ang mapagpakumbabang pananalita sa korte at ang unang panauhang pang-angkin.
- source_word: שָׁאַל
  choice: tinanong
  rationale: Likas at tuwirang katumbas ng pandiwang nangangahulugang magtanong o magsiyasat.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Bagaman maaaring mangahulugang mga alipin ang עֶבֶד, dito ay magalang na tawag ng magkakapatid sa kanilang sarili sa harap ng isang pinuno; hindi kailangang ipahiwatig ang legal na kalagayan ng pagkaalipin.
- source_word: לֵאמֹר
  choice: (ipinahiwatig sa tuwirang sipi)
  rationale: Ipinakikilala nito ang nilalaman ng sinabi. Sa natural na Tagalog, sapat na ang pandiwang “tinanong” bago ang tuwirang tanong, kaya hindi na kailangang idagdag ang mabigat na “na sinasabi.”
- source_word: הֲיֵשׁ לָכֶם
  choice: Mayroon ba kayong
  rationale: Karaniwang Tagalog na pagpapahayag ng tanong tungkol sa pag-iral o pagkakaroon.
- source_word: אָב
  choice: ama
  rationale: Pinananatili ang payak na pangngalan; hindi gumagamit ng pantukoy ang Tagalog sa ganitong tanong.
- source_word: אָח
  choice: kapatid na lalaki
  rationale: Nililinaw ang panlalaking kahulugan ng Hebrew na אָח, na hindi tiyak sa salitang Tagalog na “kapatid” lamang.
