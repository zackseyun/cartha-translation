base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/026.yaml
  text: But we said[a], ‘We cannot go down. If our youngest brother is with us, then we will go down[c][b], for we cannot see the man's face unless our youngest brother is with us.’
translation:
  language: tl
  text: Ngunit sinabi namin, “Hindi kami maaaring bumaba. Kung kasama namin ang bunso naming kapatid, bababa kami, sapagkat hindi kami maaaring humarap sa taong iyon[a] kung hindi namin kasama ang bunso naming kapatid.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “makita ang mukha ng taong iyon,” isang idyoma na nangangahulugang humarap sa kanya o pumasok sa kanyang presensiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Ngunit sinabi namin
  rationale: Isinusulong ng waw-consecutive ang salaysay, habang ang “ngunit” ay likas na nagpapakita ng bahagyang pagsalungat sa naunang utos na isinasalaysay ni Juda.
- source_word: לֹא נוּכַל לָרֶדֶת
  choice: Hindi kami makapaparoon doon
  rationale: Ang יכל ay tumutukoy sa kakayahan. Literal na “bumaba” ang ירד, ngunit sa kasalukuyang Tagalog, mas natural ang “pumaroon doon” para sa paglalakbay patungong Ehipto; iniiwasan din nitong magmungkahi na pagbaba lamang ng lugar ang mahalagang diwa.
- source_word: אִם יֵשׁ אָחִינוּ הַקָּטֹן אִתָּנוּ
  choice: Kung kasama namin ang bunso naming kapatid
  rationale: Pinananatili ang positibong kondisyong nasa Hebreo. Sa konteksto ng magkakapatid, ang הַקָּטֹן ay tumutukoy sa pinakabata, kaya “bunso” ang likas na salin.
- source_word: וְיָרַדְנוּ
  choice: paparoon kami
  rationale: Ito ang bunga ng naunang kondisyon. Sapat na sa Tagalog ang pagkakasunod ng mga sugnay upang ipakita ang ugnayang “kung… paparoon,” nang hindi kailangang idagdag ang “kung gayon.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagtanggi. Ang “sapagkat” ay malinaw at angkop sa marangal na rehistro ng salin.
- source_word: לִרְאוֹת פְּנֵי הָאִישׁ
  choice: humarap sa taong iyon
  rationale: Literal itong “makita ang mukha ng lalaki,” ngunit isang idyoma ito para sa pagharap o pagpasok sa presensiya niya. Ang “humarap” ang natural na katumbas sa Tagalog, habang inilalahad sa talababa ang kongkretong anyo ng Hebreo.
- source_word: הָאִישׁ
  choice: taong iyon
  rationale: Ang pangngalan ay simpleng “ang lalaki/tao,” na tumutukoy kay Jose. Hindi nagdaragdag ng titulong wala sa Hebreo ang “taong iyon.”
- source_word: וְאָחִינוּ הַקָּטֹן אֵינֶנּוּ אִתָּנוּ
  choice: kung hindi namin kasama ang bunso naming kapatid
  rationale: 'Bagaman pinagdudugtong ito ng waw sa Hebreo, kondisyon ang lohikal na diwa: hindi sila maaaring humarap sa lalaki kapag wala ang bunso. Likas itong naipahahayag sa Tagalog sa “kung hindi.”'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bunso” bilang likas na katawagan sa pinakabatang kapatid at “humarap” upang malinaw na maipahayag ang Hebreong idyoma. Ang “makapaparoon/paparoon” ay bahagyang pormal ngunit malinaw at angkop sa salaysay.
