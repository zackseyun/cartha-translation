  yaml_path: translation/ot/genesis/044/033.yaml
  text: So now[a], please let your servant remain instead of the boy as a servant to my lord[b], and let the boy go up with his brothers.
translation:
  language: tl
  text: Kaya ngayon, ipinamamanhik ko, hayaan ninyong manatili ang inyong lingkod kapalit ng binata[a] bilang alipin ng aking panginoon, at hayaang umakyat ang binata[b] kasama ng kanyang mga kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa halip ng binata.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “umakyat,” isang karaniwang paraan ng paglalarawan sa paglalakbay mula sa Egipto patungong Canaan.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Pinananatili ang pang-ugnay at ang puwersa nitong naghahatid sa sukdulang pakiusap ni Juda sa natural na modernong Tagalog.
- source_word: יֵשֶׁב נָא
  choice: ipinamamanhik ko, hayaan ninyong manatili
  rationale: Ipinahahayag ng anyong jussive kasama ng נָא ang magalang at mariing pakiusap; natural itong naihahatid ng “ipinamamanhik ko” at “hayaan ninyong manatili.”
- source_word: עַבְדְּךָ
  choice: ang inyong lingkod
  rationale: Dito, ito ang mapagpakumbabang pagtukoy ni Juda sa sarili sa harap ni Jose, kaya “lingkod” ang angkop kaysa “alipin.” Ginamit ang magalang na “inyong” bilang natural na pananalita sa Tagalog.
- source_word: תַּחַת הַנַּעַר
  choice: kapalit ng binata
  rationale: Ang תַּחַת ay may diwang pagpapalit sa kontekstong ito, hindi lokasyong “sa ilalim.”
- source_word: הַנַּעַר
  choice: ang binata
  rationale: Maaaring tumukoy ang נַעַר sa isang batang lalaki o kabataang lalaki. Dahil nasa hustong gulang na si Benjamin, “binata” ang natural na pagpili nang hindi inaalis ang mapagkalingang himig ng pakiusap ni Juda.
- source_word: עֶבֶד
  choice: bilang alipin
  rationale: Hindi na lamang ito magalang na pagtukoy sa sarili; ang iniaalok ni Juda ay aktuwal na kalagayang nakagapos sa paglilingkod sa sambahayan ni Jose, kaya “alipin” ang mas tahasang salin.
- source_word: לַאדֹנִי
  choice: ng aking panginoon
  rationale: Tawag-galang ito kay Jose bilang taong may awtoridad. Pinananatili ng “aking panginoon” ang panlipunang antas ng pananalita nang hindi ito itinuturing na banal na titulo.
- source_word: וְהַנַּעַר יַעַל
  choice: at hayaang umahon ang binata
  rationale: Ipinagpapatuloy ang himig ng pakiusap, at pinananatili ng “umahon” ang pandiwang עָלָה at ang karaniwang paglalarawan sa paglalakbay mula Egipto patungong Canaan.
- source_word: עִם אֶחָיו
  choice: kasama ng kanyang mga kapatid
  rationale: Tuwirang tumutukoy sa mga kapatid ni Benjamin at natural sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Tagalog ang ginamit. Ang “ipinamamanhik ko” ay sadyang mataas nang bahagya ang antas upang maipakita ang magalang at marubdob na pakiusap ni Juda, samantalang nananatiling madaling maunawaan ang kabuuang pangungusap. Itinama rin ang pagkakalagay ng mga panandang talababa upang tumugma ang [a] sa pariralang pagpapalit at ang [b] sa “umahon.”
