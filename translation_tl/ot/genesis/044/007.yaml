translation:
  language: tl
  text: At sinabi nila sa kanya, “Bakit nagsasalita ang panginoon ko ng ganitong mga salita? Malayong gawin ito ng inyong mga lingkod.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: At sinabi nila sa kanya
  rationale: Pinananatili nito ang payak na pagsulong ng salaysay at ang tahasang pagtukoy sa katiwala ni Jose.
- source_word: לָמָּה יְדַבֵּר אֲדֹנִי
  choice: Bakit nagsasalita nang ganito ang panginoon ko?
  rationale: Ang “Bakit” ay tuwirang katumbas ng tanong, at ang “panginoon ko” ay nagpapanatili sa magalang na pantawag sa isang taong nakatataas, hindi sa Diyos.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: nang ganito
  rationale: Natural itong Tagalog para sa literal na “mga salitang tulad ng mga ito,” habang nananatiling nakatuon sa paraan o nilalaman ng sinabi.
- source_word: חָלִילָה לַעֲבָדֶיךָ מֵעֲשׂוֹת
  choice: Hinding-hindi gagawin ng inyong mga lingkod
  rationale: Ipinahahayag ng “Hinding-hindi” ang mariing pagtanggi ng interjection na חָלִילָה sa natural at marangal na modernong Tagalog.
- source_word: כַּדָּבָר הַזֶּה
  choice: ang ganitong bagay
  rationale: Tumutukoy ito sa ibinibintang na gawa at natural na katumbas ng “isang bagay na tulad nito.”
