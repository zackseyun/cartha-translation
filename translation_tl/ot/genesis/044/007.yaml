  source_fidelity: Ang unang pangungusap ay wastong naghahatid ng tanong at ng magalang na pantawag na אֲדֹנִי. Gayunman, ang “nagsasalita nang ganito” ay tumutukoy sa paraan ng pagsasalita at hindi tahasang isinasalin ang כַּדְּבָרִים הָאֵלֶּה, “mga salitang ganito.” Ang “Hinding-hindi gagawin” ay mariing pagtanggi ngunit mas direkta at mas malapit na maipapahayag ang חָלִילָה bilang “Malayong gawin ito …,” nang hindi nagpapalit ng panahon o aspekto.
  naturalness: Natural at magalang ang “panginoon ko” at “inyong mga lingkod.” Mas natural at tumpak sa modernong Tagalog ang “nagsasalita ... ng ganitong mga salita” kaysa “nagsasalita nang ganito,” at ang “Malayong gawin ito ng inyong mga lingkod” ay isang malinaw na marangal na pagtanggi.
  terminology: Ang “panginoon ko” ay angkop na magalang na pantawag sa taong nakatataas at hindi nagpapahiwatig ng banal na titulo. Ang “inyong mga lingkod” ay angkop na courtly self-designation para sa עֲבָדֶיךָ.
