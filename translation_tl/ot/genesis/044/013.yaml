  text: Then they tore their clothes[a], and each man loaded his donkey, and they returned to the city.
translation:
  language: tl
  text: Pinunit nila ang kanilang mga damit[a], at nagkarga ang bawat isa sa kaniyang asno; pagkatapos ay bumalik sila sa lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kanilang mga kasuotan.” Ang salitang Hebreo ay maaaring tumukoy sa panlabas na damit sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְעוּ
  choice: pinunit nila
  rationale: Ang קרע ay tumutukoy sa literal na pagpunit; sa kontekstong ito, ang pagpunit ng damit ay hayag na pagpapakita ng matinding dalamhati, pagkabigla, o pangamba.
- source_word: שִׂמְלֹתָם
  choice: kanilang mga damit
  rationale: Ang שִׂמְלָה ay tumutukoy sa damit o kasuotan, kadalasan ay panlabas na damit. Ang “mga damit” ay natural at malinaw sa makabagong Filipino.
- source_word: וַיַּעֲמֹס אִישׁ עַל חֲמֹרוֹ
  choice: kinargahan ng bawat isa ang kanyang asno
  rationale: 'Ang עמס ay nangangahulugang magkarga o maglagay ng pasan. Bagaman nasa isahan ang pandiwa at ang אִישׁ, distributibo ang diwa nito kaugnay ng buong pangkat: ginawa ito ng bawat isa sa sarili niyang asno.'
- source_word: אִישׁ
  choice: bawat isa
  rationale: Dito, distributibo ang אִישׁ. Ang “bawat isa” ay mas natural sa Filipino at malinaw na tumutukoy sa bawat lalaking kabilang sa pangkat nang hindi binabago ang kahulugan.
- source_word: חֲמֹרוֹ
  choice: kanyang asno
  rationale: Ang חֲמוֹר ay karaniwang salita para sa asno; ang “asno” ang tumpak at pamilyar na salin sa Filipino.
- source_word: וַיָּשֻׁבוּ
  choice: bumalik sila
  rationale: Karaniwang kahulugan ng שׁוּב ang bumalik o magbalik. Ang “bumalik sila” ay natural sa salaysay.
- source_word: הָעִירָה
  choice: sa lungsod
  rationale: Ipinahihiwatig ng directional he ang pagkilos patungo sa lungsod. Sapat at natural itong ipinapahayag ng “sa lungsod” kasunod ng pandiwang “bumalik.”
