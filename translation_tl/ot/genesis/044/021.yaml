  yaml_path: translation/ot/genesis/044/021.yaml
  text: Then you said to your servants[a], ‘Bring him down to me, that I may set my eyes on him.’
translation:
  language: tl
  text: Pagkatapos ay sinabi mo sa iyong mga lingkod, “Dalhin ninyo siya pababa sa akin, upang makita ko siya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang mapagmasdan ko siya.” Literal sa Hebreo, “upang mailagay ko ang aking mata sa kaniya,” isang idyomang maaaring mangahulugang makita, suriin, o pag-ukulan ng natatanging pansin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Pagkatapos ay sinabi mo
  rationale: Ipinahahayag ng wayyiqtol ang kasunod na pangyayari sa salaysay; natural na naihahatid ng “Pagkatapos” ang pagkakasunod-sunod.
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Sa tagpong ito sa korte, kinakausap ni Juda si Jose tungkol sa mga taong nasa ilalim ng kapangyarihan nito. Ang “mga lingkod” ay angkop at hindi nagpapalagay na alipin sila sa mahigpit na legal na diwa.
- source_word: הוֹרִדֻהוּ
  choice: Dalhin ninyo siya rito sa akin mula roon
  rationale: Ang pandiwa ay Hiphil na pautos na maramihan, literal na “pababain ninyo siya.” Ipinahihiwatig nito ang paglalakbay pababa patungong Ehipto; ang “mula roon” ay nagpapanatili ng direksiyon nang mas natural kaysa “ibaba” sa Filipino.
- source_word: אֵלָי
  choice: sa akin
  rationale: Tuwirang ipinahahayag ang paglapit o pagdadala kay Jose.
- source_word: וְאָשִׂימָה עֵינִי עָלָיו
  choice: upang makita ko siya
  rationale: Ang literal na idyomang Hebreo ay “mailagay ko ang aking mata sa kaniya.” Sa modernong Filipino, “makita ko siya” ang natural na katumbas habang iniiwan sa talababa ang mas malawak na posibilidad ng pagmasid, pagsusuri, o natatanging pagbibigay-pansin.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lingkod” para sa kontekstong pangkorte at ang “makita” bilang natural na salin ng idyoma, habang pinanatili sa talababa ang literal na larawan at saklaw ng kahulugan.
