  text: Ang isa ay umalis sa piling ko, at sinabi ko, ‘Tiyak na pinira-piraso siya,’ at hindi ko na siya nakita hanggang ngayon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הָאֶחָד מֵאִתִּי
  choice: Ang isa ay umalis sa piling ko
  rationale: Pinananatili ang literal na diwa ng pag-alis mula kay Jacob, habang natural at marangal ang ‘sa piling ko’ sa modernong Tagalog.
- source_word: אַךְ טָרֹף טֹרָף
  choice: Tiyak na nilapa siya ng mabangis na hayop
  rationale: Ang infinitive absolute at finite verb ay nagpapahayag ng mariing katiyakan. Sa konteksto, ang ‘nilapa’ ay likas na nagpapahiwatig ng mabangis na hayop at mas malinaw kaysa sa literal ngunit alanganing ‘lubusang nilapa.’
- source_word: וְלֹא רְאִיתִיו עַד הֵנָּה
  choice: at hindi ko na siya nakita hanggang ngayon
  rationale: Ang ‘hindi ko na siya nakita’ ay natural na Tagalog para sa patuloy na kawalan ng pagkakita mula noon hanggang sa kasalukuyang sandali.
