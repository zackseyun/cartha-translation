  yaml_path: translation/ot/genesis/044/015.yaml
  text: And Joseph said to them[a], “What is this deed that you have done? Did you not know that a man like me indeed practices divination?”
translation:
  language: tl
  text: Sinabi ni Jose sa kanila, “Ano itong ginawa ninyo? Hindi ba ninyo alam na ang isang lalaking tulad ko ay talagang nanghuhula[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tiyak na gumagamit ng panghuhula,” “tiyak na nakatutuklas sa pamamagitan ng panghuhula,” o “tiyak na natutuklasan ang ganitong mga bagay.” Gumagamit ang Hebreo ng pinatinding anyo ng pandiwang mula sa salitang-ugat para sa panghuhula.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַמַּעֲשֶׂה הַזֶּה אֲשֶׁר עֲשִׂיתֶם
  choice: Ano itong ginawa ninyo?
  rationale: Likas at tuwiran ito sa modernong Tagalog, habang pinananatili ang bigat ng pagsaway sa kanilang ginawa.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: Hindi ba ninyo alam
  rationale: Pinananatili nito ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: נַחֵשׁ יְנַחֵשׁ
  choice: talagang nanghuhula
  rationale: Ang infinitive absolute na kasunod ng pandiwa mula sa iisang ugat ay nagbibigay-diin sa panghuhula. Ang “talagang” ay natural na nagpapahayag ng diin sa Tagalog, at hindi nito pinapalambot ang tahasang sinabi ni Jose.
- source_word: אִישׁ אֲשֶׁר כָּמֹנִי
  choice: isang lalaking tulad ko
  rationale: Tuwiran nitong pinananatili ang panlalaking pangngalang isahan at ang paghahambing sa katayuan o uri ni Jose.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginamit ang nakagawiang anyo ng pangalang biblikal sa Tagalog.
theological_decisions:
- issue: Kung ang sinabi ni Jose tungkol sa panghuhula ay dapat ihayag nang tuwiran o palambutin bilang pagkukunwari lamang
  choice: talagang nanghuhula
  alternative: tiyak na natutuklasan ang ganitong mga bagay; gumagamit lamang ng pagkukunwaring panghuhula
  rationale: Dalawang ulit na ginagamit sa Hebreo ang ugat na tumutukoy sa panghuhula upang idiin ang pahayag. Hindi ipinapasiya ng salin kung tunay itong ginagawa ni Jose o bahagi lamang ng kanyang estratehiya at katauhang Ehipsiyo; pinananatili nito ang tensiyon ng salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ang “nanghuhula” ay karaniwang salita ngunit dito ay malinaw na tumutukoy sa panghuhula o divination sa kontekstong Ehipsiyo.
