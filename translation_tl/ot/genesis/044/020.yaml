  to: At sinabi namin sa aking panginoon, ‘Mayroon po kaming matanda nang ama at isang batang anak na isinilang noong matanda na ang ama.[a] Patay na ang kapatid niya, at siya na lamang ang natitirang anak ng kaniyang ina,[b] at mahal siya ng kaniyang ama.’
