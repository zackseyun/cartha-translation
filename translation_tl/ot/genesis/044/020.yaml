base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/020.yaml
  text: And we said to my lord[a], ‘We have an elderly father, and a young son born in his old age. His brother is dead, so he alone is left of his mother[c][b], and his father loves him.’
translation:
  language: tl
  text: At sinabi namin sa aking panginoon, ‘Mayroon po kaming matanda nang ama at isang batang anak na isinilang noong matanda na ang ama.[a] Patay na ang kapatid niya, at siya na lamang ang natitirang anak ng kaniyang ina,[b] at mahal siya ng kaniyang ama.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang batang anak ng kaniyang katandaan.” Tumutukoy ang Hebreong idyoma sa anak na isinilang noong matanda na ang ama.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “siya lamang ang natira para sa kaniyang ina”; ibig sabihin, siya na lamang ang natitirang anak ng kaniyang ina.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: aking panginoon
  rationale: Magalang na tawag sa nakatataas na nagpapanatili sa malinaw na agwat ng katayuan sa salaysay; ang “po” sa kasunod na pananalita ay nagbibigay ng likas na paggalang sa modernong Tagalog.
- source_word: זָקֵן
  choice: matanda na
  rationale: Tuwirang ipinahahayag ang lubhang edad ng ama sa natural at marangal na Tagalog.
- source_word: יֶלֶד זְקֻנִים קָטָן
  choice: isang batang anak na isinilang sa kaniyang katandaan
  rationale: Pinagsasama nito ang diwa ng יֶלֶד at קָטָן bilang batang anak at nililinaw ang Hebreong idyomang זְקֻנִים bilang anak na isinilang noong matanda na ang ama.
- source_word: וְאָחִיו מֵת
  choice: Patay na ang kapatid niya
  rationale: Ipinapakita ang kasalukuyang kalagayang bunga ng pagkamatay, gaya ng Hebreong pahayag.
- source_word: וַיִּוָּתֵר הוּא לְבַדּוֹ לְאִמּוֹ
  choice: kaya siya na lamang ang natitirang anak ng kaniyang ina
  rationale: 'Natural na inilalahad ang relational na לְאִמּוֹ: si Benjamin lamang ang natitirang anak ng kaniyang ina, nang hindi ipinahihiwatig na iniwan siya sa pangangalaga nito.'
- source_word: וְאָבִיו אֲהֵבוֹ
  choice: at mahal siya ng kaniyang ama
  rationale: Tuwiran at natural na salin ng pag-ibig o natatanging pagmamahal ng ama sa kaniya.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “aking panginoon” upang panatilihin ang panlipunang hirarkiya ng orihinal, at ang “po” upang maging likas ang magalang na pananalita. Iniwasan ang sobrang literal na “natira para sa kaniyang ina” sa pangunahing teksto dahil maaari itong mapagkamalang tumutukoy sa pag-aaruga, ngunit itinabi ito sa talababa.
