  register: Modernong Filipino na malinaw at marangal. Pinanatili ang pag-uulit sa “aking kopa, ang kopang pilak” at ang konkretong larawan ng bunganga ng sako, habang ginawang likas sa Tagalog ang utos at ang pangwakas na salaysay.
