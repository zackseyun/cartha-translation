base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/002.yaml
  text: And put my cup[a], the silver cup, in the mouth of the youngest one's sack, along with the silver for his grain purchase." And he did according to Joseph's word[b], which he had spoken.
translation:
  language: tl
  text: “At ilagay mo ang aking kopa, ang kopang pilak, sa bunganga ng sako ng bunso[a], kasama ng pilak na ipinambili niya ng butil[b].” Ginawa niya ang sinabi ni Jose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa bibig ng sako,” isang idyoma para sa bukana ng sako.
    reason: cultural_note
  - marker: b
    text: Maaari ring “ang salaping pambayad sa kanyang butil”; ang Hebreong parirala ay tumutukoy sa pilak o salaping ibinayad para sa butil o panustos.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִיעִי גְּבִיעַ הַכֶּסֶף
  choice: aking kopa, ang kopang pilak
  rationale: Ang גְּבִיעַ ay kopa o tasang inuman. Pinananatili ng pag-uulit na appositional ang diin ng Hebreo, habang ang “kopa” ay likas at marangal sa modernong Filipino.
- source_word: תָּשִׂים
  choice: ilagay mo
  rationale: Tuwirang katumbas ng karaniwang pandiwang שׂים na “ilagay”; ipinakikita rin ng “mo” na isahan ang inuutusan.
- source_word: בְּפִי אַמְתַּחַת
  choice: sa bunganga ng sako
  rationale: Ang פִּי, literal na “bibig,” ay tumutukoy sa bukana ng sisidlan. Ang “bunganga ng sako” ay nagpapanatili sa konkretong larawan at likas na nauunawaan bilang bukana.
- source_word: הַקָּטֹן
  choice: ng bunso
  rationale: Literal itong “ang maliit/bata,” ngunit sa konteksto ay ang pinakabatang kapatid. Ang “bunso” ang maikli at natural na katumbas nang hindi inuulit ang “kapatid,” na wala sa Hebreo.
- source_word: כֶּסֶף שִׁבְרוֹ
  choice: pilak na ibinayad niya sa butil
  rationale: Pinananatili ng “pilak” ang materyal na kahulugan ng כֶּסֶף, samantalang nililinaw ng parirala ang komersiyal na diwa ng שִׁבְרוֹ sa salaysay ng taggutom.
- source_word: וַיַּעַשׂ כִּדְבַר יוֹסֵף אֲשֶׁר דִּבֵּר
  choice: At ginawa niya ang ayon sa salitang sinabi ni Jose
  rationale: Pinananatili ang pormal na “ayon sa salita” at ang kasunod na sugnay ng Hebreo, sa halip na gawing “utos,” na mas mapagpakahulugan.
