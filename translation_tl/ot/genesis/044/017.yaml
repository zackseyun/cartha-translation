  text: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my servant[b], but you may go up in peace to your father."
translation:
  language: tl
  text: Ngunit sinabi niya, “Hinding-hindi ko ito gagawin! Ang lalaking sa kamay niya natagpuan ang kopa[a] ang siyang magiging alipin ko[b]. Ngunit kayo, bumalik kayo nang payapa sa inyong ama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “ang lalaking kinasumpungan ng kopa.” Literal na sinasabi ng Hebreo na ang kopa ay natagpuan “sa kamay niya.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lingkod ko.” Ang Hebreong עָבֶד ay maaaring tumukoy sa lingkod o alipin; sa kontekstong ito, sapilitang pagkakaalipin bilang parusa ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵעֲשׂוֹת זֹאת
  choice: Hinding-hindi ko gagawin iyan!
  rationale: Likas at mariing pagtanggi sa modernong Tagalog; pinananatili ang puwersa ng idyomang Hebreo nang hindi gumagamit ng malabo o lipas na pananalita.
- source_word: הָאִישׁ אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: Ang lalaking pinagkitaan ng kopa
  rationale: Natural na Tagalog para sa taong natagpuang may kopa; inilalagay sa talababa ang mas literal na larawang Hebreo na ‘sa kamay niya.’
- source_word: הוּא יִהְיֶה לִּי עָבֶד
  choice: ang siyang magiging alipin ko
  rationale: Ang עָבֶד ay maaaring lingkod o alipin, ngunit sa kontekstong ito ay ipinapataw ang sapilitang pagkakaalipin bilang parusa, kaya ‘alipin’ ang mas tiyak.
- source_word: וְאַתֶּם עֲלוּ
  choice: Ngunit kayo, umuwi kayo
  rationale: Ang עֲלוּ ay literal na ‘umahon/pumanhik,’ ngunit dito ang natural na kahulugan ay pagbabalik sa ama sa Canaan; pinananatili ng ‘ngunit’ ang paghahambing sa kaparusahan ng isang lalaki.
- source_word: לְשָׁלוֹם אֶל אֲבִיכֶם
  choice: nang payapa sa inyong ama
  rationale: Tapat at natural na paglalarawan ng ligtas at walang sagabal na pagbabalik sa kanilang ama.
