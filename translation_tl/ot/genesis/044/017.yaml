- from: Ngunit sinabi niya, “Hinding-hindi ko gagawin iyan! Ang lalaking pinagkitaan ng kopa[a] ang siyang magiging alipin ko[b]. Ngunit kayo, umuwi kayo nang payapa sa inyong ama.”
  to: Ngunit sinabi niya, “Hinding-hindi ko ito gagawin! Ang lalaking sa kamay niya natagpuan ang kopa[a] ang siyang magiging alipin ko[b]. Ngunit kayo, bumalik kayo nang payapa sa inyong ama.”
  rationale: Pinalitan ang “pinagkitaan ng kopa” ng “sa kamay niya natagpuan ang kopa” upang malinaw na maipahayag ang sintaks at kongkretong larawan ng Hebreo, nang nananatiling natural ang Tagalog. Pinanatili ang mariing pagtanggi, ang maparusang “alipin,” ang kontrast na “Ngunit kayo,” at ang idiomang “nang payapa.” Inayos din ang talababa a upang magsilbi itong tunay na alternatibong salin, hindi simpleng pag-uulit ng pangunahing teksto.
