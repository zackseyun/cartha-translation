translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang ‘kopa’ upang mapanatili ang natatanging sisidlan sa kuwento, at ‘alipin’ upang ihayag ang maparusang pagkabihag nang hindi nilulutas ang saklaw ng salitang Hebreo nang walang talababa.
