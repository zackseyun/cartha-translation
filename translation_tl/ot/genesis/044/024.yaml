  text: And when we went up to your servant my father[a], we told him the words of my lord.
translation:
  language: tl
  text: Nang umahon kami papunta sa iyong lingkod, na aking ama[a], sinabi namin sa kanya ang mga salita ng aking panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa aking ama, na iyong lingkod.” Ang ayos ng Hebreo ay “sa iyong lingkod, aking ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Nang
  rationale: Likas na ipinakikilala ng “Nang” ang kasunod na pangyayari at napapanatili ang ugnayang temporal ng pormulang Hebreo nang hindi nagiging mabigat ang Tagalog.
- source_word: עָלִינוּ
  choice: umahon kami
  rationale: Pinananatili ng “umahon” ang diwang heograpiko ng paglalakbay mula sa Ehipto patungong Canaan, sa halip na gawing pangkalahatang “bumalik.”
- source_word: אֶל עַבְדְּךָ אָבִי
  choice: sa iyong lingkod, na aking ama
  rationale: Nananatiling una ang magalang na katawagang “iyong lingkod,” ayon sa ayos ng Hebreo, habang nililinaw ng kuwit at “na” na ang tinutukoy ay ang ama ni Juda.
- source_word: וַנַּגֶּד לוֹ
  choice: sinabi namin sa kanya
  rationale: Natural at malinaw na katumbas ito ng Hiphil ng נגד, na nangangahulugang magsabi o magpabatid.
- source_word: אֵת דִּבְרֵי אֲדֹנִי
  choice: ang mga sinabi ng aking panginoon
  rationale: Ang “mga sinabi” ay likas na modernong Tagalog para sa literal na “mga salita,” at pinananatili ng “aking panginoon” ang magalang na titulong pantao sa konteksto.
