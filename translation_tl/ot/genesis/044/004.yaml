  source_fidelity: 'Tumpak ang pangunahing daloy at mga utos: kalalabas lamang ng mga lalaki sa lungsod, hindi pa sila nakalalayo, at inutusan ni Jose ang namamahala sa kanyang sambahayan na habulin sila. Gayunman, ang huling tanong sa draft ay baligtad at hindi ganap na malinaw ang sintaks: ang Hebreo ay nagtatanong kung bakit sila ang gumanti ng masama kapalit ng mabuti.'
  naturalness: Likas at angkop sa makabagong Tagalog ang karamihan ng salin. Mas malinaw at mas natural ang tuwirang ayos na “Bakit ninyo iginanti ang masama sa mabuti?” kaysa “Bakit masama ang iginanti ninyo sa mabuti?”
