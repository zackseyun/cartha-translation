base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/004.yaml
  text: They had gone out of the city; they had not gone far[a], when Joseph said to the one over his house, “Get up, pursue the men, and when you overtake them, say to them, ‘Why have you repaid evil for good?’”
translation:
  language: tl
  text: Kalalabas pa lamang nila sa lungsod at hindi pa sila nakalalayo nang sabihin ni Jose sa namamahala sa kanyang sambahayan[a], “Tumayo ka at habulin mo ang mga lalaki. Kapag naabutan mo sila, sabihin mo sa kanila, ‘Bakit ninyo iginanti ang masama sa mabuti?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa katiwala ng kanyang sambahayan.” Sa Hebreo, literal na “sa namamahala sa kanyang bahay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם יָצְאוּ אֶת הָעִיר לֹא הִרְחִיקוּ
  choice: Kalalabas pa lamang nila sa lungsod at hindi pa sila nakalalayo
  rationale: 'Ipinahahayag nang natural sa Tagalog ang magkasunod na pangyayari: nakaalis na sila sa lungsod ngunit kaunti pa lamang ang kanilang nalalayo.'
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  choice: sa namamahala sa kanyang sambahayan
  rationale: Pinananatili ang diwa ng literal na Hebreong “ang nasa ibabaw ng kanyang bahay,” na tumutukoy sa tagapangasiwa ng sambahayan, nang hindi ipinapalagay ang isang mas tiyak na opisyal na titulo.
- source_word: קוּם
  choice: Tumayo ka
  rationale: Tuwirang utos ito na karaniwang nagpapasimula ng agarang pagkilos; pinananatili ng salin ang anyo at diin ng Hebreo.
- source_word: רְדֹף אַחֲרֵי הָאֲנָשִׁים
  choice: habulin mo ang mga lalaki
  rationale: Ang pandiwa ay nangangahulugang humabol o tumugis, at ang pangngalan ay tahasang tumutukoy sa mga lalaki.
- source_word: וְהִשַּׂגְתָּם
  choice: Kapag naabutan mo sila
  rationale: Ang Hiphil ng נשׂג ay nangangahulugang maabutan o makahabol; ipinapakita ng “kapag” ang pagkakasunod bago ang susunod na utos.
- source_word: שִׁלַּמְתֶּם רָעָה תַּחַת טוֹבָה
  choice: Bakit masama ang iginanti ninyo sa mabuti?
  rationale: Likas sa Tagalog ang “iganti” para sa pagbabayad o pagganti ayon sa natanggap, at pinananatili ang matinding moral na pagsalungat ng masama at mabuti.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sambahayan” upang linawin na ang “bahay” sa Hebreo ay tumutukoy sa buong household na pinangangasiwaan, habang inilagay sa talababa ang literal na anyo at karaniwang alternatibong “katiwala.”
