  text: As soon as the morning was light[a], the men were sent away, they and their donkeys.
translation:
  language: tl
  text: Nang magliwanag na ang umaga[a], pinaalis ang mga lalaki—sila at ang kanilang mga asno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Nang magbukang-liwayway” o “Nang maliwanag na sa umaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּקֶר אוֹר
  choice: Nang magliwanag ang umaga
  rationale: Pinananatili ang pandiwang diwa ng אוֹר, na tumutukoy sa pagsapit ng liwanag sa umaga, sa natural na temporal na parirala sa Tagalog.
- source_word: וְהָאֲנָשִׁים
  choice: ang mga lalaki
  rationale: Tuwirang salin ng tiyak na pangmaramihang anyo; hindi na kailangang ilantad nang hiwalay ang pang-ugnay sa simula ng pangunahing sugnay sa Tagalog.
- source_word: שֻׁלְּחוּ
  choice: pinaalis
  rationale: Ipinahahayag ang pasibong diwa ng Pual at ang kontekstuwal na kahulugang pinayagang o inutusang umalis, hindi lamang basta 'ipinadala.'
- source_word: הֵמָּה וַחֲמֹרֵיהֶם
  choice: sila at ang kanilang mga asno
  rationale: Pinananatili ang tahasang koordinasyon at appositional na diin ng Hebreo sa mga lalaki at sa kanilang mga asno, sa halip na gawing 'kasama ang' na mas malaya.
