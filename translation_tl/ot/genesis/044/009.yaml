  text: Whichever of your servants it is found with[a], let him die[b], and we also will become servants to my lord.
translation:
  language: tl
  text: Kung matagpuan iyon sa sinuman sa iyong mga lingkod[a], mamatay siya[b]; at kami rin ay magiging mga alipin ng aking panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Iisang salitang Hebreo ang nasa likod ng “mga lingkod” dito at “mga alipin” sa hulihan ng talata. “Mga lingkod” ang ginamit sa una dahil magalang nilang tinutukoy ang kanilang sarili; “mga alipin” naman sa ikalawa dahil aktuwal na pagkaalipin ang iminungkahing parusa.
    reason: lexical_alternative
  - marker: b
    text: O “hayaan siyang mamatay.”
    reason: translation_alternative
lexical_decisions:
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ מֵעֲבָדֶיךָ
  choice: Kung kanino man sa iyong mga lingkod matagpuan iyon
  rationale: Ang אֲשֶׁר ay nagpapakilala ng di-tiyak na kaugnay na sugnay, at partitive ang מִן sa מֵעֲבָדֶיךָ. Likas sa Filipino ang ayos na “kung kanino man ... matagpuan iyon”; ang “iyon” ay tumutukoy sa kopang hinahanap sa naunang konteksto.
- source_word: וָמֵת
  choice: mamatay siya
  rationale: Ang qal perfect na may waw ay nagsasaad dito ng iminungkahing kahihinatnan na may bigat ng panunumpa. Pinananatili ng “mamatay siya” ang mariing puwersa nang hindi ipinapasiyang ito ay tuwirang utos o simpleng hula.
- source_word: וְגַם אֲנַחְנוּ
  choice: at kami rin
  rationale: Inihahayag ng וְגַם ang dagdag na kaparusahan para sa buong pangkat; natural at malinaw itong naihahatid ng “at kami rin.”
- source_word: נִהְיֶה
  choice: ay magiging
  rationale: Ang היה ay tumutukoy sa pagpasok sa isang bagong kalagayan bilang bunga ng iminungkahing parusa.
- source_word: לַאדֹנִי
  choice: ng aking panginoon
  rationale: Ang לְ ay nagmamarka rito ng taong paglilingkuran o pagmamay-ari ng mga alipin. Pinananatili ng “aking panginoon” ang unang-panauhang hulapi at ang magalang na pantawag sa isang taong pinuno, hindi sa Diyos.
- source_word: לַעֲבָדִים
  choice: mga alipin
  rationale: Aktuwal na pagkakabihag o sapilitang paglilingkod bilang parusa ang tinutukoy, kaya mas tiyak ang “mga alipin” kaysa “mga lingkod.”
theological_decisions:
- issue: Magkaibang salin ng עבד sa dalawang paglitaw
  choice: “mga lingkod” sa magalang na pagtukoy nila sa sarili, ngunit “mga alipin” sa iminungkahing kaparusahan
  alternative: “mga alipin” sa dalawang paglitaw, o “mga lingkod” sa dalawang paglitaw
  rationale: 'Iisang salitang-ugat ang ginamit, ngunit magkaiba ang diin ng konteksto: magalang na pananalita ang una, samantalang tunay na pagkaalipin bilang parusa ang ikalawa. Ipinaliliwanag ito sa talababa upang hindi maitago ang leksikal na pagkakaugnay.'
- issue: Puwersa ng וָמֵת
  choice: “mamatay siya”
  alternative: “patayin siya” o “mamamatay siya”
  rationale: Hindi tahasang ipinahahayag ng Hebreo ang tagaganap ng pagpatay. Ang napiling salin ay nagpapanatili sa maigsi at matinding iminungkahing parusa nang hindi nagdaragdag ng di-binanggit na tagaganap.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ang “aking panginoon” ay sadyang pormal upang katawanin ang magalang na pananalita sa korte; iniwasan ang mas kolokyal na “amo ko.”
