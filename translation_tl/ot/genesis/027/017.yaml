  text: Then she put the tasty food and the bread that she had made into the hand of Jacob her son[a].
translation:
  language: tl
  text: Pagkatapos, iniabot niya sa anak niyang si Jacob[a] ang masasarap na pagkain at ang tinapay na kapuwa niya ginawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa kamay ni Jacob na anak niya,” isang idyomang nangangahulugang tuwiran niya itong iniabot sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Pagkatapos, iniabot niya
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay. Sa pariralang בְּיַד, ang נתן ay likas na tumutukoy sa tuwirang pag-abot o pagbibigay sa isang tao.
- source_word: הַמַּטְעַמִּים
  choice: ang masarap na pagkain
  rationale: Tumutukoy ito sa espesyal na pagkaing inihanda upang maging kalugod-lugod sa panlasa; natural at hindi labis na tiyak ang saling ito sa modernong Tagalog.
- source_word: הַלֶּחֶם
  choice: ang tinapay
  rationale: Tuwirang katumbas ng לֶחֶם sa kontekstong ito.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: na ginawa niya
  rationale: Tuwirang isinasalin ang עשה at malinaw sa pagkakasunod ng salaysay na naihanda na niya ang mga ito bago iniabot.
- source_word: בְּיַד
  choice: iniabot niya sa
  rationale: Ang literal na 'sa kamay ng' ay isang konkretong idyomang Hebreo para sa tuwirang pag-aabot. Pinananatili ng 'iniabot' ang kilos sa natural na Tagalog, habang itinatala sa talababa ang literal na anyo.
- source_word: יַעֲקֹב בְּנָהּ
  choice: sa anak niyang si Jacob
  rationale: Natural sa Tagalog ang ayos na ito at malinaw na pinananatili ang kaugnayan ni Jacob bilang anak niya.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “iniabot” upang natural na maipahayag ang idyomang Hebreo nang hindi mawala ang konkretong kilos; ang literal na anyo ay inilagay sa talababa.
