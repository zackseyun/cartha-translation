base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/024.yaml
  text: He said[a], “Are you really my son Esau?” And he said, “I am.”
translation:
  language: tl
  text: Sinabi niya[a], “Ikaw nga ba ang anak kong si Esau?” Sumagot siya, “Ako nga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “Ikaw ba itong anak kong si Esau?” Mariing tanong ito upang tiyakin ang pagkakakilanlan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi niya
  rationale: Likas na salin ng pandiwang אמר sa pagsasalaysay; hindi kailangang isalin nang tahasan ang panimulang waw upang maging natural sa modernong Tagalog.
- source_word: אַתָּה זֶה
  choice: Ikaw nga ba
  rationale: Ipinahahayag ng malayang panghalip at demonstratibo ang mariing pagtukoy o pagtiyak; natural na naihahatid ito ng “Ikaw nga ba” sa Tagalog.
- source_word: בְּנִי
  choice: ang anak kong
  rationale: Pinananatili ang tahasang ugnayang pagmamay-ari ng construct na may hulaping unang panauhan.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: וַיֹּאמֶר
  choice: Sumagot siya
  rationale: Bagaman literal na “sinabi niya,” ipinakikita ng konteksto na tugon ito sa tanong; mas natural ang “sumagot” nang hindi binabago ang kahulugan.
- source_word: אָֽנִי
  choice: Ako nga
  rationale: Maikli itong pagpapatunay ng pagkakakilanlan. Ang “Ako nga” ay natural na sagot sa Tagalog at tumutugma sa mariing tanong.
