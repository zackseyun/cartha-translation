  text: So he went in to his father and said[a], “My father.” And he said, “Here I am. Who are you, my son?”
translation:
  language: tl
  text: Kaya lumapit siya sa kanyang ama at nagsabi[a], “Ama ko.” Sinabi ng kanyang ama, “Narito ako. Sino ka, anak ko?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “At dumating siya sa kanyang ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kaya pumasok siya sa kinaroroonan
  rationale: Isinusulong ng wayyiqtol ang salaysay, at sa konteksto ay pumapasok si Jacob sa kinaroroonan ni Isaac. Likas sa modernong Tagalog ang pariralang ito at malinaw ang direksiyon ng pagkilos.
- source_word: אֶל אָבִיו
  choice: ng kanyang ama
  rationale: Pinananatili ang tuwirang ugnayan kay “kanyang ama” nang hindi idinaragdag ang pangalang Isaac, na wala sa Hebreo.
- source_word: וַיֹּאמֶר
  choice: at sinabi / Sumagot ito
  rationale: Ang unang anyo ay karaniwang pambungad sa pagsasalita; sa ikalawang paglitaw, ang “Sumagot ito” ay natural na Tagalog at malinaw na tumutukoy sa ama nang hindi binabago ang diwa.
- source_word: אָבִי
  choice: Ama ko
  rationale: Tuwirang tawag ito na may panlaping unang panauhang isahan; pinananatili ng “Ama ko” ang literal at personal na anyo.
- source_word: הִנֶּנִּי
  choice: Narito ako
  rationale: Pinananatili nito ang kinikilalang pormulang Hebreo ng pagpapahayag ng presensiya at kahandaang tumugon.
- source_word: מִי אַתָּה
  choice: Sino ka
  rationale: Tuwirang itinatanong ng Hebreo ang pagkakakilanlan ng kausap, kaya hindi ito pinalalabnaw bilang “Sino ito?”
- source_word: בְּנִי
  choice: anak ko
  rationale: Ang pangngalan ay may panlaping unang panauhang isahan at ginagamit bilang tuwirang tawag; likas at tapat dito ang “anak ko.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pumasok siya sa kinaroroonan” upang ihatid ang kilos papasok sa presensiya ng ama; pinanatili ang personal na mga tawag na “Ama ko” at “anak ko.”
