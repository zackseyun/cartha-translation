- from: Kaya pumasok siya sa kinaroroonan ng kanyang ama at sinabi[a], “Ama ko.” Sumagot ito, “Narito ako. Sino ka, anak ko?”
  to: Kaya lumapit siya sa kanyang ama at nagsabi[a], “Ama ko.” Sinabi ng kanyang ama, “Narito ako. Sino ka, anak ko?”
  rationale: Pinalitan ang interpretatibong “pumasok siya sa kinaroroonan” ng “lumapit siya sa kanyang ama,” na tuwirang naghahatid ng kilos patungo sa ama nang hindi nagdaragdag ng detalye. Nilinaw rin ang tagapagsalita sa ikalawang pangungusap at inayos ang lexical na talababa upang tumugma sa saklaw ng Hebreong pandiwa.
