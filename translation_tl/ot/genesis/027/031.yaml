  yaml_path: translation/ot/genesis/027/031.yaml
  text: He too prepared tasty food and brought it to his father[a], and he said to his father, “Let my father rise and eat of his son's game[b], so that your soul may bless me.”
translation:
  language: tl
  text: Naghanda rin siya ng masarap na pagkain[a] at dinala iyon sa kanyang ama. Sinabi niya sa kanyang ama, “Bumangon po kayo, Ama, at kumain ng karne ng hayop na hinuli ng inyong anak, upang ako'y pagpalain ninyo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malinamnam na pagkain.” Tumutukoy ang salitang Hebreo sa pagkaing espesyal na inihanda at malasa sa salaysay na ito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “upang pagpalain ako ng iyong kaluluwa.” Maaaring gamitin sa Hebreo ang “kaluluwa” para sa mismong tao.
    reason: source_idiom
lexical_decisions:
- source_word: גַּם הוּא
  choice: Naghanda rin siya
  rationale: Ipinahahayag ng “rin” na ginawa rin ni Esau ang katulad ng naunang ginawa ni Jacob, nang hindi nagiging mabigat ang Tagalog.
- source_word: מַטְעַמִּים
  choice: masarap na pagkain
  rationale: Tumutukoy ito sa pagkaing espesyal na inihanda at malasa; karaniwan at malinaw ang parirala sa modernong Tagalog.
- source_word: וַיָּבֵא לְאָבִיו
  choice: dinala iyon sa kanyang ama
  rationale: Walang tahasang layon sa Hebreo, ngunit malinaw sa konteksto na ang tinutukoy ay ang inihandang pagkain; ang “iyon” ay likas na kailangan sa Tagalog.
- source_word: יָקֻם אָבִי
  choice: Bumangon po kayo, Ama
  rationale: Ang anyong pakiusap sa Hebreo ay isinalin sa likas at magalang na pananalita sa Tagalog. Pinananatili ng “po” ang paggalang na ipinahihiwatig ng pagtukoy sa ama sa ikatlong panauhan sa Hebreo.
- source_word: מִצֵּיד בְּנוֹ
  choice: ng karne ng hayop na hinuli ng inyong anak
  rationale: Ang צַיִד ay nahuling mailap na hayop o pagkaing mula rito, hindi basta anumang pagkain. Pinananatili rin ang tahasang pagtukoy sa “inyong anak.”
- source_word: בַּעֲבוּר
  choice: upang
  rationale: Malinaw at maikli nitong ipinahahayag ang layunin ng pagkain.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: upang ako'y pagpalain mo
  rationale: Sa idyomang Hebreo, ang נֶפֶשׁ na may panghalip ay maaaring tumukoy sa mismong tao. Likas ito sa Tagalog, habang inilalahad sa talababa ang mas literal na anyo upang hindi mawala ang ekspresyon ng pinagmulan.
theological_decisions:
- issue: Kahulugan ng נַפְשֶׁךָ sa pormula ng pagpapala
  choice: Isinalin sa pangunahing teksto bilang “ako'y pagpalain mo,” na inuunawa ang “iyong nephesh” bilang pagtukoy sa mismong tao.
  alternative: “pagpalain ako ng iyong kaluluwa”
  rationale: Ang literal na “kaluluwa” ay maaaring magpahiwatig sa modernong mambabasa ng hiwalay na espirituwal na sangkap na siyang gumagawa ng pagpapala. Hindi kinakailangan ng Hebreong idyoma ang gayong teolohikal na pagbasa; gayunman, pinananatili sa talababa ang literal na pahayag.
translation_notes:
  register: Makabago, malinaw, at magalang na Tagalog. Ginamit ang “po kayo, Ama” bilang likas na katumbas ng magalang na pakiusap, at iniwasan ang sobrang arkaikong ayos. Ang mga panandang [a] at [b] ay inilagay mismo sa mga pariralang ipinaliliwanag ng mga talababa.
