  to: Naghanda rin siya ng masarap na pagkain[a] at dinala iyon sa kanyang ama. Sinabi niya sa kanyang ama, “Bumangon po kayo, Ama, at kumain ng karne ng hayop na hinuli ng inyong anak, upang ako'y pagpalain ninyo[b].”
  rationale: Inayos ang “pagpalain mo” tungo sa “pagpalain ninyo” upang tumugma sa magalang na “kayo” at “inyong” sa parehong pahayag. Idinagdag ang “sa kanyang ama” pagkatapos ng “Sinabi niya” upang maipahayag nang tahasan ang לְאָבִיו, nang walang pagbabago sa kahulugan. Hindi binago ang pagpapakahulugan sa Hebreong idyoma ng “iyong kaluluwa”; nananatili ito sa talababa.
