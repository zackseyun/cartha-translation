  yaml_path: translation/ot/genesis/027/004.yaml
  text: Prepare for me tasty food[a], just as I love, and bring it to me, that I may eat[c][b], so that my soul may bless you before I die.
translation:
  language: tl
  text: Maghanda ka para sa akin ng masarap na pagkain[a], gaya ng gusto ko, at dalhin mo ito sa akin para kumain ako[c], upang pagpalain ka ng aking kaluluwa[b] bago ako mamatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malinamnam na pagkain” o “mga piling putahe.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “pagpalain ka ng aking kaluluwa.” Isa itong paraan ng pagsasabing si Isaac mismo, sa buo niyang personal na pagkatao, ang magbibigay ng basbas.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin, “at kakain ako, upang …”
    reason: source_ambiguity
lexical_decisions:
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: Maghanda ka para sa akin ng masarap na pagkain
  rationale: Sa konteksto ng pagluluto, likas sa modernong Tagalog ang “maghanda.” Ang מַטְעַמִּים ay tumutukoy sa espesyal at malinamnam na pagkaing inihanda, kaya malinaw at karaniwan ang “masarap na pagkain.”
- source_word: כַּאֲשֶׁר אָהַבְתִּי
  choice: gaya ng gusto ko
  rationale: Ipinahahayag nito ang personal na kagustuhan ni Isaac sa natural na Tagalog nang hindi labis na binibigyang-kahulugan ang anyo o timpla ng pagkain.
- source_word: וְהָבִיאָה לִּי
  choice: at dalhin mo ito sa akin
  rationale: Tuwirang ipinapahayag ang pagdadala ng pagkaing tinutukoy patungo sa nagsasalita; idinagdag ang “ito” para sa malinaw at natural na daloy sa Tagalog.
- source_word: וְאֹכֵלָה
  choice: para makakain ako
  rationale: Ang cohortative ay nagpapahayag ng nilalayong pagkilos ni Isaac matapos dalhin ang pagkain. Ang “para makakain ako” ay natural at pinananatili ang ugnayang layunin sa naunang utos.
- source_word: בַּעֲבוּר
  choice: upang
  rationale: 'Ipinakikilala rito ng salita ang sukdulang layunin ng paghahanda, pagdadala, at pagkain: ang pagbabasbas kay Esau.'
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: pagpalain ka ng aking kaluluwa
  rationale: Pinananatili ang tahasang נַפְשִׁי (“aking kaluluwa/buhay/sarili”) bilang simuno, pati ang mariing diwa ng personal at buong-pusong pagbabasbas, sa halip na payakin lamang bilang “pagpalain kita.”
- source_word: בְּטֶרֶם אָמוּת
  choice: bago ako mamatay
  rationale: Ito ang tuwiran, malinaw, at natural na katumbas ng temporal na sugnay.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa pariralang “pagpalain ka ng aking kaluluwa”
  choice: Pinanatili sa pangunahing teksto ang “aking kaluluwa,” na may talababa tungkol sa idyomatikong diwa nito.
  alternative: “upang pagpalain kita” o “upang pagpalain ka ng buo kong pagkatao”
  rationale: Pinananatili ng salin ang mahalagang salita at diin ng Hebreo nang hindi ipinapalagay na ang tinutukoy ay isang hiwalay at teknikal na bahagi ng tao; nililinaw ng talababa na maaari itong tumukoy kay Isaac mismo sa buo niyang personal na pagkatao.
translation_notes:
  register: Gumamit ng dignified ngunit pangkaraniwang modernong Tagalog. Ang “maghanda,” “gaya ng gusto ko,” at “para makakain ako” ay natural sa karaniwang mambabasa; pinanatili naman ang mas pormal na “aking kaluluwa” dahil mahalaga ito sa anyo at diin ng Hebreo, na nililinaw sa talababa.
