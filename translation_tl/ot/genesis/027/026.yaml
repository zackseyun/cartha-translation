  yaml_path: translation/ot/genesis/027/026.yaml
  text: Then his father Isaac said to him[a], “Come near, please, and kiss me, my son.”
translation:
  language: tl
  text: Pagkatapos, sinabi sa kanya ng ama niyang si Isaac, “Lumapit ka, pakiusap, at hagkan mo ako, anak ko.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Karaniwang katumbas ng pang-ukol na may hulaping panghalip at malinaw na tumutukoy sa kinausap.
- source_word: יִצְחָק אָבִיו
  choice: ng ama niyang si Isaac
  rationale: Pinananatili ang pangalan at ang ugnayang pampamilya sa natural na ayos ng Filipino.
- source_word: גְּשָׁה
  choice: Lumapit ka
  rationale: Tuwirang ipinahahayag ang paglapit nang pisikal na hinihiling ni Isaac.
- source_word: נָא
  choice: pakiusap
  rationale: Pinapalambot nito ang pautos bilang magalang na kahilingan; hindi ito ipinakahulugang temporal na “ngayon.”
- source_word: וּשְׁקָה לִּי
  choice: at hagkan mo ako
  rationale: Natural at marangal na Filipino para sa utos na humalik kay Isaac, habang tuwirang ipinapakita ang layon.
- source_word: בְּנִי
  choice: anak ko
  rationale: Pinananatili ang pantawag at ang tonong pampamilya.
