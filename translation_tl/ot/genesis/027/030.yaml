base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/030.yaml
  text: And it happened that as soon as Isaac had finished blessing Jacob[a], and Jacob had just gone out from the presence of Isaac his father[b], Esau his brother came in from his hunting.
translation:
  language: tl
  text: Nang matapos ni Isaac na basbasan si Jacob, at si Jacob ay kakaalis pa lamang mula sa harapan ng kanyang amang si Isaac, dumating ang kapatid niyang si Esau mula sa pangangaso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: Nang ...
  rationale: Ang dobleng pormulang pasalaysay ay ginawang likas na sugnay na panahunan sa Tagalog, habang pinananatili ang mabilis na pagkakasunod-sunod ng mga pangyayari.
- source_word: כַּאֲשֶׁר כִּלָּה
  choice: Nang matapos
  rationale: Malinaw na ipinahahayag ang pagkakumpleto sa pagbabasbas bago dumating si Esau.
- source_word: לְבָרֵךְ
  choice: na basbasan
  rationale: Ang konstruksyong kasama ng כִּלָּה ay natural na naipapahayag sa Tagalog bilang “matapos ... na basbasan.”
- source_word: אַךְ יָצֹא יָצָא
  choice: kasisimula pa lamang umalis
  rationale: Ipinakikita ng אַךְ at ng infinitive absolute na halos kasabay lamang ng pag-alis ni Jacob ang pagdating ni Esau; pinananatili ng parirala ang mariing pagkaagad nang hindi ipinahihiwatig na hindi pa siya tuluyang nakaalis.
- source_word: מֵאֵת פְּנֵי
  choice: sa harapan ng
  rationale: Pinananatili ang personal at pisikal na tagpo ng pag-alis ni Jacob mula sa kinaroroonan ni Isaac.
- source_word: בָּא
  choice: dumating naman
  rationale: Ang “dumating” ay likas sa Tagalog; ang “naman” ay nagpapatingkad sa salungat at halos sabay na kilos ng magkapatid.
- source_word: מִצֵּידוֹ
  choice: mula sa pangangaso
  rationale: Sa konteksto, tumutukoy ang ציד sa gawain ng pangangaso na pinanggalingan ni Esau, hindi kinakailangang sa nahuling hayop.
