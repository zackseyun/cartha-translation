- from: Nang matapos ni Isaac na basbasan si Jacob, at kasisimula pa lamang umalis ni Jacob sa harapan ng kanyang amang si Isaac, dumating naman mula sa pangangaso ang kapatid niyang si Esau.
  to: Nang matapos ni Isaac na basbasan si Jacob, at si Jacob ay kakaalis pa lamang mula sa harapan ng kanyang amang si Isaac, dumating ang kapatid niyang si Esau mula sa pangangaso.
  rationale: Pinalitan ang “kasisimula pa lamang umalis” ng “kakaalis pa lamang” upang ipahayag na nakalabas na si Jacob ngunit kagagaling lamang niya, alinsunod sa mariing Hebreong anyo. Walang kailangang talababa dahil sapat na naipapahayag ng salin ang diin nang hindi nagdadagdag ng kahulugang lampas sa teksto.
