base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/005.yaml
  text: Rebekah was listening when Isaac spoke to Esau his son[b][a], and Esau went to the field to hunt game and bring it back.
translation:
  language: tl
  text: Nakikinig si Rebeca habang nagsasalita si Isaac sa anak niyang si Esau, at pumunta si Esau sa parang upang mangaso at mag-uwi ng huli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang hulihan: “upang manghuli ng hayop at iuwi iyon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רִבְקָה שֹׁמַעַת
  choice: Nakikinig si Rebeca
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy at nasa likurang pangyayari; natural itong ipinapahayag sa Tagalog sa aspektong imperpektibo na “nakikinig.” Hindi na ginamitan ng panimulang “At” dahil maaaring dalhin ng daloy ng salaysay ang simpleng waw.
- source_word: בְּ/דַבֵּר יִצְחָק
  choice: habang nagsasalita si Isaac
  rationale: Ang בְּ na may infinitive construct ay nagpapakita ng magkasabay na kilos; malinaw na pinananatili ng “habang” at aspektong imperpektibo ang temporal na pagsasabay.
- source_word: אֶל עֵשָׂו בְּנ֑/וֹ
  choice: kay Esau na anak niya
  rationale: Direksiyon ng pagsasalita ang אֶל, at ang “na anak niya” ay natural na apposition sa Tagalog nang hindi nagdaragdag ng diin na wala sa Hebreo.
- source_word: וַ/יֵּלֶךְ עֵשָׂו הַ/שָּׂדֶה
  choice: at pumunta si Esau sa parang
  rationale: Tuwirang isinasalin ng “pumunta” ang kilos ng הלך. Sa konteksto ng pangangaso, mas natural ang “parang” kaysa “bukid,” na maaaring magpahiwatig ng sinasakang lupain.
- source_word: לָ/צ֥וּד צַ֖יִד
  choice: upang mangaso
  rationale: Ang magkaugnay na pandiwa at pangngalan ay idiomatikong naipapahayag sa Tagalog sa simpleng “mangaso”; hindi nililimitahan ang uri ng hayop gaya ng gagawin ng “usa.”
- source_word: לְ/הָבִיא
  choice: at mag-uwi ng mahuhuli
  rationale: Ipinahahayag nito ang layuning dalhin pabalik ang makukuhang hayop. Nililinaw ng “mag-uwi” ang pagbabalik, samantalang ang “mahuhuli” ay likas na tumutukoy sa hasil ng pangangaso.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Rebeca” at “Esau” bilang karaniwang anyong Filipino ng mga pangalan. Pinanatili ang nagpapatuloy na kilos ng pakikinig at pagsasalita, gayundin ang layunin ng pagpunta ni Esau.
