- from: Nakikinig si Rebeca habang nagsasalita si Isaac kay Esau na anak niya, at pumunta si Esau sa parang upang mangaso at mag-uwi ng mahuhuli.[a]
  to: Nakikinig si Rebeca habang nagsasalita si Isaac sa anak niyang si Esau, at pumunta si Esau sa parang upang mangaso at mag-uwi ng huli.[a]
  rationale: Pinalitan ang prospective na “mahuhuli” ng pangngalang “huli” upang mas tapat na katawanin ang צַיִד. Inayos din ang ayos ng parirala para sa mas malinaw at natural na modernong Tagalog, nang hindi binabago ang temporal na pagsasabay o ang layunin ng dalawang infinitive sa Hebreo.
