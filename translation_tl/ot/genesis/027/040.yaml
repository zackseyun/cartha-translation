  text: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
translation:
  language: tl
  text: Sa pamamagitan ng iyong tabak ay mabubuhay ka, at paglilingkuran mo ang iyong kapatid. Ngunit kapag makakawala ka[a], babaliin mo at aalisin sa iyong leeg ang kanyang pamatok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi ka na mapalagay.” Mahirap tiyakin ang kahulugan ng pandiwang Hebreo na תָּרִיד. Sinusuportahan ng kasunod na larawan ng pag-aalis ng pamatok ang “makakawala,” ngunit posible rin ang diwang “hindi ka na mapalagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל חַרְבְּךָ
  choice: Sa pamamagitan ng iyong tabak
  rationale: Ipinahihiwatig ng עַל kasama ng חֶרֶב at חיה ang paraang ikabubuhay; pinananatili ng “tabak” ang kongkretong larawan.
- source_word: תִחְיֶה
  choice: ay mabubuhay ka
  rationale: Ang Qal imperfect ng חיה ay nagsasaad dito ng magiging paraan ng pamumuhay, hindi lamang ng pananatiling buhay.
- source_word: וְאֶת אָחִיךָ תַּעֲבֹד
  choice: at paglilingkuran mo ang iyong kapatid
  rationale: Tuwirang isinasalin ang עבד bilang “paglingkuran,” nang hindi labis na tinutukoy ang anyong pampolitika ng pagpapasakop.
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: Ngunit kapag
  rationale: Natural nitong ipinapahayag sa Tagalog ang darating na kalagayan at ang pagsalungat ng huling sugnay sa naunang paglilingkod.
- source_word: תָּרִיד
  choice: nakawala ka
  rationale: Mahirap tiyakin ang pandiwa; ang “nakawala” ay umaangkop sa kasunod na larawan ng pag-aalis ng pamatok, habang inilalagay sa talababa ang posibleng kahulugang “hindi ka na mapalagay.”
- source_word: וּפָרַקְתָּ
  choice: aalisin mo
  rationale: Ang פרק ay tumutukoy sa marahas o mariing pagtanggal. Sa modernong Tagalog, malinaw at natural ang “aalisin” sa larawan ng pamatok, bagaman hindi nito lubos na ipinahahayag ang puwersa ng “pagkalag.”
- source_word: עֻלּוֹ
  choice: ang kanyang pamatok
  rationale: Pinananatili ang literal na metapora ng עֹל para sa paghahari o pagpapasakop.
- source_word: מֵעַל צַוָּארֶךָ
  choice: mula sa iyong leeg
  rationale: Natural na Tagalog ito at pinananatili ang pisikal na larawan ng pamatok na inaalis sa leeg.
theological_decisions:
- issue: Ang magiging ugnayan ni Esau sa kanyang kapatid
  choice: Ilarawan ang pagpapasakop na susundan ng paglaya mula rito, nang hindi dinaragdagan ng mga konklusyon tungkol sa buong kasaysayan ng Edom.
  alternative: Ipahiwatig ang permanenteng pagkaalipin o, sa kabilang dako, gawing simpleng paggalang lamang sa nakatatandang kapatid.
  rationale: Binabanggit ng Hebreo ang paglilingkod sa kapatid at ang kalaunang pag-aalis ng kanyang pamatok; dapat panatilihin ang tensiyong ito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang mga kongkretong larawang “tabak,” “pamatok,” at “leeg,” at iniwasan ang sobrang interpretatibong wikang pampolitika o teolohikal.
