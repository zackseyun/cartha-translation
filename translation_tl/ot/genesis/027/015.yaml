base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/015.yaml
  text: Then Rebekah took the choice garments of Esau her older son[a], which were with her in the house[b], and put them on Jacob her younger son.
translation:
  language: tl
  text: Pagkatapos, kinuha ni Rebeca ang mga piling damit[a] ni Esau, ang nakatatanda niyang anak, na kasama niya sa bahay,[b] at isinuot niya ang mga ito kay Jacob, ang nakababata niyang anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinakamagagandang damit” o “mahahalagang damit.”
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “na kasama niya sa bahay.” Maaari ring isalin na “na nasa bahay kasama niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Pagkatapos, kinuha
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay; likas sa makabagong Tagalog ang “Pagkatapos” bilang panandang sunuran.
- source_word: בִּגְדֵי
  choice: mga ... damit
  rationale: Karaniwang salitang Tagalog ito para sa mga kasuutan at angkop sa payak ngunit marangal na salaysay.
- source_word: הַחֲמֻדֹת
  choice: piling
  rationale: Ipinapahayag nito na ang mga damit ay kanais-nais, mahalaga, o natatangi nang hindi tiyak na ipinapalagay na pinakamamahalin ang mga iyon.
- source_word: בְּנָהּ הַגָּדֹל
  choice: panganay niyang anak
  rationale: Sa paghahambing kay Jacob, tumutukoy ang גָּדוֹל sa nakatatandang anak. Likas at malinaw dito ang “panganay,” yamang kambal sina Esau at Jacob ngunit unang ipinanganak si Esau.
- source_word: אֲשֶׁר אִתָּהּ בַּבָּיִת
  choice: na nasa bahay at iniingatan niya
  rationale: Ipinapahayag ng Hebreo na ang mga damit ay kasama ni Rebeca sa bahay. Ang “iniingatan niya” ay likas na Tagalog na nagpapahiwatig ng pag-iingat o paglalagak, ngunit minamarkahan sa talababa ang mas literal na pagbasa.
- source_word: וַתַּלְבֵּשׁ
  choice: isinuot ang mga iyon sa
  rationale: Tuwirang ipinapahayag na si Rebeca ang nagbihis kay Jacob gamit ang mga damit na kababanggit lamang.
- source_word: בְּנָהּ הַקָּטָן
  choice: nakababata niyang anak
  rationale: Ang קָטָן ay katapat ng גָּדוֹל at tumutukoy sa edad o pagkakasunod ng kapanganakan, hindi sa laki ng katawan.
