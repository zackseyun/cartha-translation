revisions:
- from: Pagkatapos, kinuha ni Rebeca ang mga piling damit[a] ng panganay niyang anak na si Esau, na nasa bahay at iniingatan niya,[b] at isinuot ang mga iyon sa nakababata niyang anak na si Jacob.
  to: Pagkatapos, kinuha ni Rebeca ang mga piling damit[a] ni Esau, ang nakatatanda niyang anak, na kasama niya sa bahay,[b] at isinuot niya ang mga ito kay Jacob, ang nakababata niyang anak.
  rationale: Inalis ang interpretibong “iniingatan niya” upang huwag magdagdag sa pinagmulan. Pinalitan ang “panganay” ng “nakatatanda” upang tumpak na maipakita ang paghahambing ng Hebreo sa “nakababata,” nang hindi isinasantabi ang natural na Tagalog.
