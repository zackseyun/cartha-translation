  verdict: revise
  source_fidelity: 'May dalawang di-ligtas na pagpapalawak sa draft: ang “iniingatan niya” ay wala sa Hebreo, at ang “panganay” ay mas tiyak kaysa sa payak na “nakatatanda,” bagaman si Esau nga ang unang isinilang sa konteksto. Ang binagong teksto ay pinananatili ang kahulugang “kasama niya sa bahay” nang walang dagdag na pahiwatig.'
  naturalness: Likas at malinaw sa modernong Tagalog ang “mga piling damit,” “nakatatanda niyang anak,” at “isinuot niya ang mga ito kay Jacob.” Ang ayos na “na kasama niya sa bahay” ay bahagyang mas malapit sa pinagmulan ngunit nananatiling natural sa salaysay.
  terminology: Ang “Rebeca,” “Esau,” at “Jacob” ay pare-pareho at angkop na mga anyong pangalan. Ang “piling” ay mahusay na katumbas ng הַחֲמֻדֹת; ang mga alternatibo ay maayos na inilagay sa talababa.
