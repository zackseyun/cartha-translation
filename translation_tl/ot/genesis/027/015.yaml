  - severity: low
    issue: Ang “panganay” ay mas espesipiko kaysa sa “nakatatanda.”
    rationale: Ang בְּנָהּ הַגָּדֹל ay “ang nakatatanda niyang anak.” Totoo sa mas malawak na salaysay na si Esau ang panganay, ngunit hindi iyon ang mismong paglalarawang ginagamit ng talata at ang katapat nito ay “nakababata.”
