base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/033.yaml
  text: Then Isaac trembled with a very great trembling and said[a], “Who then was it who hunted game and brought it to me, and I ate from all of it before you came and blessed him? Yes, and he will be blessed.”
translation:
  language: tl
  text: At lubhang nanginig si Isaac at sinabi, “Kung gayon, sino ang nangaso at nagdala sa akin ng nahuli niya? Kinain ko ang lahat ng iyon bago ka dumating, at binasbasan ko siya. Siya nga ay pagpapalain.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tunay ngang siya ay magiging pinagpala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱרַד ... חֲרָדָה גְּדֹלָה עַד מְאֹד
  choice: nanginig ... nang matindi
  rationale: Pinananatili ang pisikal at emosyonal na puwersa ng חרד at ang matinding pagpapalakas ng kaugnay na pangngalan, ngunit inihahayag ito sa natural na modernong Tagalog.
- source_word: מִי אֵפוֹא הוּא
  choice: Kung gayon, sino
  rationale: Ipinahahayag ng “kung gayon” ang inferensiyal at mariing diwa ng אֵפוֹא sa pagkabigla ni Isaac.
- source_word: הַצָּד צַיִד
  choice: ang nangaso
  rationale: Ang pandiwa at kaugnay na pangngalang “manghuli ng mailap na hayop” ay likas na naipapahayag sa Tagalog bilang “nangaso”; hindi ito nililimitahan sa usa.
- source_word: וַיָּבֵא לִי
  choice: at nagdala sa akin ng nahuli niya
  rationale: Ginagawang malinaw ang ipinahiwatig na layon mula sa naunang צַיִד nang hindi nagdaragdag ng espesipikong uri ng hayop.
- source_word: וָאֹכַל מִכֹּל
  choice: Kumain ako mula sa lahat ng iyon
  rationale: Pinananatili ang partitive na diwa ng מִן at ang saklaw ng כֹּל, bagaman bahagyang pormal ang anyo.
- source_word: בְּטֶרֶם תָּבוֹא
  choice: bago ka dumating
  rationale: Tuwirang temporal na salin na natural sa salaysay.
- source_word: וָאֲבָרֲכֵהוּ
  choice: at binasbasan ko siya
  rationale: Malinaw na ipinapakita ang unang panauhang simuno at ang natapos na kilos ni Isaac.
- source_word: גַּם בָּרוּךְ יִהְיֶה
  choice: Oo, mananatili siyang pinagpala
  rationale: 'Ang “Oo” ay naghahatid ng mariing pagpapatibay ng גַּם, at ang “mananatili” ay likas na ipinahahayag ang resultative/future force: ang naibigay na basbas ay patuloy na magkakabisa.'
theological_decisions:
- issue: Lakas ng pangwakas na pahayag ni Isaac matapos maibigay ang basbas
  choice: Mariing pagpapatibay na mananatiling pinagpala ang tumanggap ng basbas
  alternative: Isang payak at malungkot na pagkilala lamang sa nangyari
  rationale: Ang גַּם בָּרוּךְ יִהְיֶה ay may mariing puwersa. Pinananatili ng salin ang bigat at tensiyon ng salaysay nang hindi ipinapaliwanag kung bakit o sa anong doktrinal na paraan hindi na mababawi ang basbas.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “binasbasan” at “pinagpala” upang natural na maiba ang kilos ng pagbibigay ng basbas sa kalagayang bunga nito. Ang footnote ay nag-iingat sa posibleng mas tuwirang future rendering ng יִהְיֶה.
