  naturalness: Natural ang pangungusap sa modernong Tagalog. Ang “maiina'm na batang kambing” ay mas likas at mas tiyak sa kontekstong pagpili ng hayop na lulutuin kaysa “maganda at batang kambing.”
  terminology: Pinanatili ang “kawan,” “batang kambing,” “ama,” at “masasarap na pagkain.” Ang “maiina'm” ay angkop na katumbas ng טֹבִים sa konteksto, nang hindi ipinipilit ang ideyang ‘pinakamainam’ o ibang dagdag na kahulugan.
