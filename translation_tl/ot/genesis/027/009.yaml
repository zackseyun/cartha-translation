  yaml_path: translation/ot/genesis/027/009.yaml
  text: Please go to the flock and get for me from there two good young goats[a], and I will make them into tasty food for your father, just as he loves.
translation:
  language: tl
  text: Pumunta ka nga sa kawan at ikuha mo ako roon ng dalawang maiinam na batang kambing. Ihahanda ko ang mga iyon bilang masasarap na pagkain para sa iyong ama, gaya ng gusto niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Pumunta ka
  rationale: Ang pautos na לֶךְ ay malinaw na utos, samantalang pinalalambot o hinihimok ito ng נָא. Sa modernong Tagalog, likas na naipahihiwatig ng “Pumunta ka” sa konteksto ang magalang ngunit apurahang pakiusap; ang tahasang “pakiusap” ay maaaring maging mas mabigat kaysa sa Hebreo.
- source_word: הַצֹּאן
  choice: sa kawan
  rationale: Ang צֹאן ay pangkalahatang tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Ang “kawan” ay malawak at natural, at hindi nito nililimitahan ang tinutukoy sa mga tupa lamang.
- source_word: וְקַח לִי מִשָּׁם
  choice: at ikuha mo ako roon
  rationale: Ipinahahayag ng “ikuha mo ako roon” ang pagkuha para sa nagsasalita at ang lokasyong מִשָּׁם, nang hindi labis na binibigyang-diin ang pagdadala.
- source_word: שְׁנֵי גְּדָיֵי עִזִּים
  choice: dalawang ... batang kambing
  rationale: Ang parirala ay literal na tumutukoy sa dalawang anak ng kambing. Ang “dalawang batang kambing” ang malinaw at likas na katumbas sa modernong Tagalog.
- source_word: טֹבִים
  choice: maganda
  rationale: Sa kontekstong pagpili ng mga hayop na ihahanda, tumutukoy ang טֹבִים sa mabuti o angkop na kalidad. Ang “maganda” ay natural na paglalarawan sa napiling hayop, nang idagdag ang mas interpretibong “pinakamainam.”
- source_word: וְאֶעֱשֶׂה אֹתָם מַטְעַמִּים
  choice: Ihahanda ko ang mga iyon bilang masasarap na pagkain
  rationale: Ang מַטְעַמִּים ay masasarap o espesyal na pagkaing inihanda ayon sa panlasa ng isang tao. Ipinapakita ng “ihahanda ... bilang masasarap na pagkain” ang pagluluto sa mga kambing at ang maramihang anyo ng pangngalan.
- source_word: לְאָבִיךָ
  choice: para sa iyong ama
  rationale: Pinananatili ng “iyong ama” ang ugnayang pampamilya at ang marangal na antas ng pananalita sa salaysay.
- source_word: כַּאֲשֶׁר אָהֵב
  choice: gaya ng gusto niya
  rationale: Literal na maaaring “gaya ng iniibig niya,” ngunit sa konteksto ng pagkain, ang אָהֵב ay natural na tumutukoy sa pagkagusto o paboritong lasa. Ang “gaya ng gusto niya” ay malinaw at idiomatiko nang hindi dinaragdagan ang kahulugan.
