base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/034.yaml
  text: When Esau heard his father’s words[a], he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, my father!”
translation:
  language: tl
  text: Nang marinig ni Esau ang mga salita ng kanyang ama, sumigaw siya ng napakatindi at napakapait na sigaw. Sinabi niya sa kanyang ama, “Basbasan mo rin ako, ama ko!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: Nang marinig
  rationale: Likas na ipinahahayag sa Tagalog ang temporal na kalagayang ipinakikilala ng infinitive construct na may כִּי, nang hindi ipinapalagay na dagliang-dagli ang kilos.
- source_word: דִּבְרֵי אָבִיו
  choice: ang mga salita ng kanyang ama
  rationale: Pinananatili nito ang tuwirang kahulugan ng דָּבָר at ang marangal na himig ng salaysay.
- source_word: וַיִּצְעַק צְעָקָה
  choice: napasigaw siya
  rationale: Likas na Filipino ito para sa biglaan at matinding sigaw ni Esau. Ang inuulit na ugat sa Hebreo ay inilalahad nang mas pormal sa talababa upang hindi maging pilit ang pangunahing teksto.
- source_word: גְּדֹלָה
  choice: napakalakas
  rationale: Sa konteksto ng sigaw, malinaw nitong naihahatid ang tindi ng גָּדוֹל, bagaman maaari rin itong literal na sabihing “matindi” o “malaki.”
- source_word: וּמָרָה
  choice: buong pait
  rationale: Pinananatili ang larawan ng kapaitan bilang matinding dalamhati, sa halip na palitan ito ng mas paliwanag na “punô ng hinagpis.”
- source_word: עַד מְאֹד
  choice: napaka-
  rationale: Ang unlaping pampasidhi sa “napakalakas” ay likas na naghahatid ng sukdulang antas na ipinahahayag ng parirala.
- source_word: בָּרֲכֵנִי
  choice: Basbasan mo ako
  rationale: Tuwiran at apurahang pautos ito na tumutugma sa pandiwa at hulaping unang panauhan sa Hebreo.
- source_word: גַם אָנִי
  choice: rin ako
  rationale: Ipinahahayag nito ang pakiusap ni Esau na siya man ay tumanggap ng basbas.
- source_word: אָבִי
  choice: Ama ko
  rationale: Pinananatili ang tahasang panghalip na paari at ang matinding damdamin ng personal na pagtawag.
