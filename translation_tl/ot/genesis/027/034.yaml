translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “basbasan” upang malinaw na tumukoy sa pagbigkas o pagbibigay ng basbas sa kontekstong patriyarkal; iniwasan ang sobrang literal at pilit na pag-uulit sa pangunahing teksto.
