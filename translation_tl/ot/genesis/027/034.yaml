- from: Nang marinig ni Esau ang mga salita ng kanyang ama, napasigaw siya nang napakalakas at buong pait[a]. Sinabi niya sa kanyang ama, “Basbasan mo rin ako, Ama ko!”
  to: Nang marinig ni Esau ang mga salita ng kanyang ama, sumigaw siya ng napakatindi at napakapait na sigaw. Sinabi niya sa kanyang ama, “Basbasan mo rin ako, ama ko!”
