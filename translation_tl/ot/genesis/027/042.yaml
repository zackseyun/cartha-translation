  verdict: revise
  source_fidelity: 'Kailangang ipakita ang parehong pandiwang Hebreo: ipinadala ni Rebeca ang isang tao at ipinatawag si Jacob. Hindi sapat ang “ipinatawag” lamang, dahil nawawala ang וַתִּשְׁלַח (“nagpadala siya”). Ang “inaaliw ang sarili” ay angkop na pinananatili ang sadyang madilim at di-tuwirang kahulugan ng מִתְנַחֵם.'
  naturalness: Natural at marangal ang karamihan ng draft, ngunit mas malinaw ang “ipinaalam kay Rebeca” para sa pasibong pambungad. Ang “nagpasundo siya at ipinatawag si Jacob” ay likas na Filipino at naipahahayag ang dalawang kilos nang hindi nagdaragdag ng hindi tinukoy na sugo.
  terminology: Ang “Rebeca,” “Esau,” at “Jacob” ay pare-pareho at angkop. Ang “panganay” at “bunso” ay katanggap-tanggap sa konteksto ng kambal. Pinanatili ang “inaaliw ang sarili” sa halip na gawing tahasang “naghihiganti.”
