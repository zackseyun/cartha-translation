base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/042.yaml
  text: And the words of Esau, her older son, were told to Rebekah. So she sent and called Jacob, her younger son, and said to him, “Look, Esau your brother is consoling himself about you by planning to kill you.”
translation:
  language: tl
  text: Nang ipinaalam kay Rebeca ang mga sinabi ni Esau, ang panganay niyang anak, nagpasundo siya at ipinatawag si Jacob, ang bunso niyang anak. Sinabi niya rito, “Makinig ka! Ang kapatid mong si Esau ay inaaliw ang sarili tungkol sa iyo sa balak na patayin ka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְרִבְקָה
  choice: Nang mabalitaan ni Rebeca
  rationale: Natural na Filipino para sa impersonal na Hebreong pasibo na ‘ipinaalam/isinabi kay Rebeca,’ nang hindi tinutukoy kung sino ang nagbalita.
- source_word: דִּבְרֵי עֵשָׂו
  choice: ang sinabi ni Esau
  rationale: Ang דְּבָרִים ay maaaring ‘mga salita’ o ‘sinabi’; mas natural dito ang ‘ang sinabi’ bilang kabuuan ng pahayag ni Esau.
- source_word: בְּנָהּ הַגָּדֹל / בְּנָהּ הַקָּטָן
  choice: ang panganay niyang anak / ang bunso niyang anak
  rationale: Sa konteksto ng magkapatid na kambal, ipinahahayag ng ‘panganay’ at ‘bunso’ ang relasyonal na diwa ng literal na ‘mas matanda’ at ‘mas bata.’
- source_word: הִנֵּה
  choice: Makinig ka!
  rationale: Ginagawang natural na babala sa Filipino ang discourse marker na humihingi ng agarang pansin; hindi ito literal na utos na tumingin.
- source_word: מִתְנַחֵם לְךָ לְהָרְגֶךָ
  choice: nag-aaliw sa sarili sa balak niyang patayin ka
  rationale: Pinananatili ang kapansin-pansing diwa ng נ־ח־ם, ‘inaaliw/kinukumbinsi ang sarili,’ habang ipinakikitang ang pagpatay kay Jacob ang inaasahang paraan ng pag-aliw o paghihiganti.
theological_decisions:
- issue: Ambiguidad ng מִתְנַחֵם
  choice: nag-aaliw sa sarili
  alternative: nagbabalak maghiganti
  rationale: 'Hindi ginawang tuwirang ‘naghihiganti’ ang pandiwa, sapagkat ang Hebreo ay gumagamit ng salitang kaugnay ng pag-aliw at lumilikha ng madilim na tensiyon: inaaliw ni Esau ang sarili sa inaasahang pagpatay.'
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang karaniwang baybay na ‘Rebeca’ at pinanatili ang bigat at nakagugulat na larawan ng orihinal, sa halip na pakinisin ito bilang simpleng ‘nagbabalak.’
