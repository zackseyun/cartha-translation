    rationale: Hindi mali ang draft, ngunit ang “ipinaalam kay Rebeca” ay mas tuwirang tumutugma sa impersonal na pasibo ng Hebreo at hindi nagbibigay ng karagdagang diin sa oras.
  revised_text: Nang ipinaalam kay Rebeca ang mga sinabi ni Esau, ang panganay niyang anak, nagpasundo siya at ipinatawag si Jacob, ang bunso niyang anak. Sinabi niya rito, “Makinig ka! Ang kapatid mong si Esau ay inaaliw ang sarili tungkol sa iyo sa balak na patayin ka.”
