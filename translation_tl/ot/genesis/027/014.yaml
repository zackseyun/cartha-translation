translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Iniwasan ang lumang “masasarap na lutuin” bilang pangkalahatang salin at pinili ang malinaw na “masasarap na pagkain.” Inilagay ang talababa pagkatapos ng pariralang tinutukoy nito, hindi pagkatapos ng “ina.”
