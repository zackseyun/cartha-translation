lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Kaya umalis siya
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay; natural na ipinahahayag ito ng “Kaya” sa modernong Tagalog.
- source_word: וַיִּקַּח
  choice: kinuha ang mga iyon
  rationale: Walang tahasang layon ang pandiwa sa talata, ngunit malinaw sa naunang konteksto na tumutukoy ito sa dalawang batang kambing; ang “mga iyon” ay maingat na paglalantad ng ipinahihiwatig na layon.
- source_word: וַיָּבֵא לְאִמּוֹ
  choice: at dinala sa kanyang ina
  rationale: Ang בוא na may ל ay nangangahulugang pagdadala patungo sa isang tao. Naiintindihan pa rin bilang layon ang “mga iyon” mula sa naunang sugnay kaya hindi na ito inulit.
- source_word: וַתַּעַשׂ אִמּוֹ
  choice: Naghanda naman ang kanyang ina
  rationale: Bagaman malawak ang עשה (“gumawa”), ang “naghanda” ang likas at tiyak na gamit kapag pagkain ang layon. Ipinagdurugtong ng “naman” ang kasunod na kilos nang hindi nagdaragdag ng pagsalungat.
- source_word: מַטְעַמִּים
  choice: masasarap na pagkain
  rationale: Ang pangngalan ay tumutukoy sa mga pagkaing espesyal na inihanda at malasa. Pinananatili ng maramihang anyong “masasarap na pagkain” ang anyo at malinaw na diwa ng Hebreo.
- source_word: כַּאֲשֶׁר אָהֵב אָבִיו
  choice: gaya ng gustong-gusto ng kanyang ama
  rationale: Tuwirang “umibig/minahal” ang אָהֵב, ngunit sa modernong Tagalog, “gustong-gusto” ang likas na pagpapahayag ng matinding pagkagusto sa pagkain. Pinananatili ng “gaya ng” ang paghahambing ng כַּאֲשֶׁר.
