  text: So he went and took them and brought them to his mother[a], and his mother prepared tasty food, just as his father loved.
translation:
  language: tl
  text: Pumunta nga siya, kinuha ang mga iyon, at dinala sa kanyang ina. At naghanda ang kanyang ina ng masasarap na pagkain[a], gaya ng gusto ng kanyang ama.
