base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/022.yaml
  text: So Jacob went near to Isaac his father[a], and he felt him and said, “The voice is Jacob’s voice, but the hands are Esau’s hands.”
translation:
  language: tl
  text: Kaya lumapit si Jacob sa ama niyang si Isaac. Sinalat[a] siya ni Isaac at sinabi, “Ang tinig ay tinig ni Jacob, ngunit ang mga kamay ay mga kamay ni Esau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hinipo.”
    reason: Posibleng mas pangkalahatang katumbas ng וַיְמֻשֵּׁהוּ, bagaman ipinahihiwatig ng konteksto ang paghipo upang suriin ang pagkakakilanlan.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: lumapit
  rationale: Karaniwang kahulugan ng qal na נגשׁ ang paglapit; natural at malinaw ang “lumapit” sa makabagong salaysay sa Filipino.
- source_word: וַיְמֻשֵּׁהוּ
  choice: sinalat siya
  rationale: Ipinahihiwatig ng מושׁ dito ang sadyang paghipo upang makilala o masuri ang isang tao. Mas tiyak ang “sinalat” kaysa simpleng “hinipo.”
- source_word: הַקֹּל
  choice: ang tinig
  rationale: Sa konteksto, kinikilala ni Isaac ang nagsasalita sa pamamagitan ng boses nito; ang “tinig” ang pinakatumpak at marangal na katumbas.
- source_word: ק֣וֹל יַעֲקֹב
  choice: tinig ni Jacob
  rationale: Pinananatili nito ang payak na construct relation at ang pag-uulit na retorikal sa Hebreo.
- source_word: וְהַיָּדַיִם יְדֵי עֵשָׂו
  choice: ngunit ang mga kamay ay mga kamay ni Esau
  rationale: Ginagawang hayag ng “ngunit” ang malinaw na pagsalungat ng dalawang palatandaan, samantalang pinananatili ang pag-uulit at diin ng sugnay na walang tahasang pandiwa sa Hebreo.
- source_word: אָבִיו
  choice: ama niyang si Isaac
  rationale: Pinananatili ang tahasang ugnayang pampamilya sa Hebreo sa natural na ayos ng Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang pag-uulit na “tinig ay tinig” at “mga kamay ay mga kamay” upang maipakita ang diin at tensiyon ng orihinal.
