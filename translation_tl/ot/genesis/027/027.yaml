base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
translation:
  language: tl
  text: 'Lumapit si Jacob at hinalikan niya si Isaac. Naamoy ni Isaac ang amoy[a] ng mga damit ni Jacob, at binasbasan niya si Jacob. Sinabi niya,


    “Masdan, ang amoy ng anak ko

    ay gaya ng amoy ng isang bukid

    na pinagpala ni Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, inuulit ang iisang salita para sa “amoy” sa buong talata, kabilang sa pariralang literal na “naamoy ang amoy.”
    reason: Pinananatili ng salin ang leksikal na pag-uulit at retorikal na diin ng Hebreo.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: Kaya lumapit si Jacob
  rationale: Ang wayyiqtol ng נגשׁ ay nagpapatuloy sa salaysay at nagsasaad ng paglapit. Ginamit ang pangalang Jacob upang maging malinaw sa natural na Tagalog ang sunod-sunod na panghalip; tiyak ang tinutukoy mula sa konteksto.
- source_word: וַיִּשַּׁק לוֹ
  choice: at hinalikan ang kanyang ama
  rationale: Tuwirang isinasalin ang נשׁק bilang “hinalikan.” Ang “kanyang ama” ay malinaw na kontekstuwal na tinutukoy ng hulaping panghalip at iniiwasan ang malabong “hinalikan siya.”
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  choice: Naamoy ni Isaac ang amoy ng mga damit ni Jacob
  rationale: Pinananatili ang cognate construction na “naamoy … ang amoy” at ang pag-uulit ng רֵיחַ sa talata. Idinagdag ang mga pangalang tiyak sa konteksto upang luminaw ang mga referent sa Tagalog.
- source_word: בְּגָדָיו
  choice: mga damit ni Jacob
  rationale: Ang “mga damit” ay natural at kasalukuyang Tagalog para sa konkretong pangmaramihang בְּגָדָיו.
- source_word: וַיְבָרֲכֵהוּ
  choice: at binasbasan niya ito
  rationale: Tuwirang inilalarawan ang pagkilos ng ברך. Ang “binasbasan” ay angkop sa pormal na pagpapalang binibigkas sa tagpong ito.
- source_word: רְאֵה
  choice: Masdan
  rationale: Ang pautos ay pantawag-pansin. Pinananatili ng “Masdan” ang lakas ng Hebreo nang hindi gumagamit ng mahabang pagpapaliwanag; hindi rin nito kailangang tukuyin sa Tagalog kung sino ang kinakausap.
- source_word: רֵיחַ בְּנִי
  choice: ang amoy ng anak ko
  rationale: Pinananatili ang payak na kahulugan at ang pag-uulit ng רֵיחַ.
- source_word: כְּרֵיחַ שָׂדֶה
  choice: ay gaya ng amoy ng isang bukid
  rationale: Malinaw na ipinapahayag ng “gaya” ang paghahambing na minamarkahan ng כְּ, at ang “bukid” ang karaniwang kahulugan ng שָׂדֶה sa kontekstong ito.
- source_word: אֲשֶׁר בֵּרֲכוֹ יְהוָה
  choice: na pinagpala ni Yahweh
  rationale: Inilalarawan ng perpektong anyo ang bukid bilang tumanggap ng pagpapala, kaya natural ang “pinagpala” sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatunog ang personal na pangalang banal sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit sa Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan at hindi bilang pamalit na titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga pangalang Jacob at Isaac sa halip na magkakasunod na “siya/niya” dahil nagiging malabo ang mga referent sa Tagalog, bagaman panghalip lamang ang nasa Hebreo. Inihanay bilang maikling patulang pahayag ang mismong pagpapala upang madaling makita ang paghahambing, nang walang idinaragdag na interpretasyong teolohikal.
