  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “ni Jacob” upang linawin ang unang panghalip, at “nito” sa kasunod upang maiwasan ang paulit-ulit na pangalan. Walang kinakailangang talababa.
