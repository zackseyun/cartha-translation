  text: And she put the skins of the young goats on his hands and on the smooth part of his neck.
translation:
  language: tl
  text: At ipinantakip niya ang mga balat ng mga batang kambing sa mga kamay ni Jacob at sa makinis na bahagi ng leeg ni Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹרֹת
  choice: mga balat
  rationale: Tumutukoy ang pangmaramihang anyong ito sa mga balat ng hayop na ginamit na pantakip; natural at tuwiran ang “mga balat” sa modernong Tagalog.
- source_word: גְּדָיֵי הָעִזִּים
  choice: mga batang kambing
  rationale: Ang parirala ay tumutukoy sa mga inakay ng kambing. Malinaw at likas sa Tagalog ang “mga batang kambing.”
- source_word: הִלְבִּישָׁה
  choice: ibinalot niya
  rationale: Ang Hiphil ng לבש ay nangangahulugang isuot o ipasuot. Dahil mga balat ang inilagay sa mga bahagi ng katawan, malinaw at idiomatiko rito ang “ibinalot,” nang hindi ipinahihiwatig na karaniwang kasuotan ang mga ito.
- source_word: עַל יָדָיו
  choice: sa mga kamay ni Jacob
  rationale: Tuwirang ipinahahayag ang kinalalagyan ng mga balat. Ginawang tahasan ang reperent ng panghalip upang maging malinaw at natural sa Tagalog.
- source_word: חֶלְקַת צַוָּארָיו
  choice: sa makinis na bahagi ng leeg nito
  rationale: Ang חֶלְקַת ay tumutukoy sa makinis o walang-buhok na bahagi. Pinananatili ng salin ang kongkretong pagkakaiba nito sa mabuhok na balat na ipinantakip.
