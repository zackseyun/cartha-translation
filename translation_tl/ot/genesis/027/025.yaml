base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/025.yaml
  text: And he said[a], “Bring it near to me, and I will eat of my son’s game, so that my soul may bless you.” So he brought it near to him, and he ate; and he brought him wine, and he drank.
translation:
  language: tl
  text: Sinabi ni Isaac, “Ilapit mo sa akin iyan, at kakain ako ng nahuli ng anak ko, upang pagpalain ka ng aking kaluluwa[a].” Kaya inilapit ito ni Jacob sa kanya, at kumain si Isaac. Dinalhan siya ni Jacob ng alak, at uminom siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas natural: “upang pagpalain kita.” Sa Hebreo: “upang pagpalain ka ng aking kaluluwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּשָׁה
  choice: Ilapit mo sa akin
  rationale: Ang causative imperative ng נגשׁ ay tumutukoy sa paglalapit o paghaharap ng bagay. Likas sa Tagalog ang “ilapit mo sa akin” at pinananatili nito ang kongkretong kilos.
- source_word: וְאֹכְלָה
  choice: at kakain ako
  rationale: Ang cohortative ay nagpapahayag ng hangarin o intensiyon ni Isaac; natural itong naihahayag sa Tagalog sa hinaharap na anyong “kakain ako.”
- source_word: מִצֵּיד בְּנִי
  choice: ng nahuli ng anak ko
  rationale: Ang צַיִד ay hayop o karneng nakuha sa pangangaso. Ang “nahuli ng anak ko” ay malinaw at natural sa modernong Tagalog, habang naipahihiwatig ang partitive na diwa ng מִן sa pandiwang “kakain.”
- source_word: לְמַעַן
  choice: upang
  rationale: Tuwirang ipinapahayag ng “upang” ang layuning nakasaad sa parirala.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: pagpalain ka ng aking kaluluwa
  rationale: Pinananatili ang tahasang paksa sa Hebreo na נַפְשִׁי, “aking kaluluwa,” sa halip na gawing simpleng “pagpalain kita,” upang mapanatili ang solemneng idyoma at diin ng orihinal.
- source_word: וַיַּגֶּשׁ לוֹ
  choice: inilapit niya iyon sa kanya
  rationale: Inuulit nito ang pandiwang ginamit sa utos at pinananatili ang ugnayang leksikal at pisikal na kilos.
- source_word: יַיִן
  choice: alak
  rationale: Karaniwang katumbas sa Tagalog ng יַיִן sa kontekstong ito.
- source_word: וַיֵּשְׁתְּ
  choice: at uminom siya
  rationale: Payak at tuwirang salin ng sunod-sunod na kilos sa salaysay.
theological_decisions:
- issue: Ang idyomang “pagpalain ka ng aking kaluluwa”
  choice: Panatilihin sa pangunahing teksto ang “aking kaluluwa.”
  alternative: “upang pagpalain kita”
  rationale: Tahasan sa Hebreo na ang “aking kaluluwa” ang gramatikal na paksa. Ang pagpapanatili nito ay hindi nagpapasya ng isang partikular na antropolohiya; inililipat lamang nito ang tunay na idyoma at personal na diin ng teksto, habang ipinaliliwanag sa talababa ang mas idiomatikong kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit ng “ilapit/inilapit” at ang Hebreong idyoma tungkol sa kaluluwa; iniwasan ang sobrang teknikal na “karne ng pangangaso” sa pamamagitan ng natural na “nahuli ng anak ko.”
