  to: Sinabi ni Isaac, “Ilapit mo sa akin iyan, at kakain ako ng nahuli ng anak ko, upang pagpalain ka ng aking kaluluwa[a].” Kaya inilapit ito ni Jacob sa kanya, at kumain si Isaac. Dinalhan siya ni Jacob ng alak, at uminom siya.
