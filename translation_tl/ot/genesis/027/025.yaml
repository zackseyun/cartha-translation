  terminology: Ang 'alak' ay wastong katumbas ng יַיִן. Ang 'nahuli ng anak ko' ay sapat na natural na katumbas ng 'game,' bagaman ang konteksto ng pagkain ang nagpapakitang tumutukoy ito sa nahuling hayop bilang pagkain. Napananatili ang 'kaluluwa' bilang literal na anyo ng נַפְשִׁי, nang walang pagpapataw ng doktrinal na pakahulugan.
