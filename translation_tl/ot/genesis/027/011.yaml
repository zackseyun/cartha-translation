  yaml_path: translation/ot/genesis/027/011.yaml
  text: But Jacob said to Rebekah his mother[a], “Look, Esau my brother is a hairy man[b], and I am a smooth man.”
translation:
  language: tl
  text: Ngunit sinabi ni Jacob sa kanyang inang si Rebeca, “Tingnan mo, mabalahibo ang kapatid kong si Esau, samantalang makinis ang balat ko.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ako ay isang lalaking makinis”; tumutukoy ito sa kawalan ni Jacob ng balahibo sa katawan, kabaligtaran ng pagiging mabalahibo ni Esau.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi ni Jacob
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit sa konteksto ay nagpapahayag si Jacob ng pagtutol sa plano ng kanyang ina; kaya likas ang “Ngunit” nang hindi labis na nagpapakahulugan.
- source_word: אֶל רִבְקָה אִמּוֹ
  choice: sa kanyang inang si Rebeca
  rationale: Pinananatili kapwa ang pangalan ni Rebeca at ang kaugnayan niya kay Jacob, ngunit inayos sa likas na pariralang Tagalog.
- source_word: הֵן
  choice: Tingnan ninyo
  rationale: Isa itong pantawag-pansin na nagpapakilala sa ikinababahala ni Jacob. Ang “Tingnan ninyo” ay kasalukuyan, magalang sa ina, at likas sa usapan.
- source_word: עֵשָׂו אָחִי אִישׁ שָׂעִר
  choice: mabalahibo ang kapatid kong si Esau
  rationale: Likas na ipinahahayag sa Tagalog ang pisikal na katangiang inilalarawan ng literal na “lalaking mabalahibo,” habang pinananatili ang pagkakakilanlan ni Esau bilang kapatid ni Jacob.
- source_word: וְאָנֹכִי אִישׁ חָלָק
  choice: samantalang makinis ang balat ko
  rationale: Ipinakikita ng “samantalang” ang malinaw na paghahambing, at nililinaw ng “balat” na ang חָלָק ay tumutukoy rito sa kawalan ng balahibo sa katawan, hindi sa ugali o pananalita.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang magalang na “ninyo” sapagkat kinakausap ni Jacob ang kanyang ina. Isinaad sa natural na Tagalog ang pisikal na paghahambing sa magkapatid.
