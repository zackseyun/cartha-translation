translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “iyong ama” sa halip na kolokyal na “tatay mo,” at iniwasan ang sobrang literal na ayos na magiging mabigat sa karaniwang mambabasa.
