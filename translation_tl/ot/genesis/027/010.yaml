  text: Pagkatapos, dalhin mo ito sa iyong ama, at kakain siya, upang pagpalain ka niya bago siya mamatay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: Pagkatapos, dalhin mo
  rationale: Ang waw na sinusundan ng Qal perfect 2ms ay nagpapatuloy sa sunod-sunod na tagubilin. Likas sa modernong Tagalog ang “Pagkatapos, dalhin mo” para sa pagkakasunod at puwersang pautos.
- source_word: לְאָבִיךָ
  choice: sa iyong ama
  rationale: Tuwirang salin ng אָב na may hulaping 2ms; ang “ama” ay angkop sa marangal na rehistro ng salaysay.
- source_word: וְאָכָל
  choice: upang kainin niya
  rationale: 'Bagaman maaaring ilahad bilang kasunod na pangyayari (“at kakain siya”), sa konteksto ng plano ay likas na isama sa layunin: dadalhin ang pagkain upang kainin ito ng ama.'
- source_word: בַּעֲבֻר אֲשֶׁר
  choice: at
  rationale: Ang tambalang parirala ay nagpapakilala ng layunin. Sa Tagalog, ang unang “upang” ay sumasaklaw sa magkakaugnay na layuning kainin ng ama ang pagkain at pagpalain ang anak, kaya “at” ang natural na pang-ugnay sa ikalawang pandiwa.
- source_word: יְבָרֶכְךָ
  choice: pagpalain ka niya
  rationale: Tuwirang ipinapahayag ang Piel imperfect 3ms na may layong 2ms. Pinananatili ng “pagpalain” ang patriyarkal at teolohikal na diwa ng pagpapala.
- source_word: לִפְנֵי מוֹתוֹ
  choice: bago siya mamatay
  rationale: Natural na modernong Tagalog para sa literal na “bago ang kanyang kamatayan,” habang lubos na pinananatili ang temporal at taimtim na diwa.
