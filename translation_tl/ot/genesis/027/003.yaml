  text: Now then[b][a], please take your equipment—your quiver and your bow—and go out to the field and hunt game for me.
translation:
  language: tl
  text: Ngayon, kunin mo nga ang iyong mga kagamitan—ang lalagyan ng iyong mga palaso at ang iyong pana—at magtungo ka sa parang upang manghuli ng maiilap na hayop para sa akin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Likas na panandang nag-uugnay sa naunang sinabi at nagpapakilala sa kasunod na tagubilin; pinananatili ang diwa ng pang-ugnay at ang agarang panahon.
- source_word: שָׂא נָא
  choice: pakikuha
  rationale: Sa kontekstong ito, ang שָׂא ay idyomatikong ‘kunin/dalhin,’ at ipinahihiwatig ng נָא ang magalang o mapakiusap na tono.
- source_word: כֵלֶיךָ
  choice: ang mga gamit mo
  rationale: Malawak ang kahulugan ng כְּלִי at dito ay sinusundan ng dalawang tiyak na kagamitang pangangaso; hindi ito nilimitahan sa ‘mga sandata.’
- source_word: תֶּלְיְךָ
  choice: ang lalagyan mo ng mga palaso
  rationale: Tumutukoy sa sisidlan o lalagyan ng mga palaso. Mas madaling maunawaan ito ng karaniwang mambabasang Filipino kaysa sa hiram at di-pamilyar na teknikal na katawagan.
- source_word: וְקַשְׁתֶּךָ
  choice: at ang pana mo
  rationale: Tuwirang katumbas ng karaniwang salitang Hebreo para sa pana.
- source_word: וְצֵא הַשָּׂדֶה
  choice: at pumunta ka sa parang
  rationale: Ang שָׂדֶה ay maaaring tumukoy sa bukid, parang, o lupang bukas. Sa konteksto ng pangangaso, mas likas ang ‘parang’ kaysa sa sakahang ipinahihiwatig ng ‘bukid.’
- source_word: וְצוּדָה
  choice: upang mangaso
  rationale: Malinaw na ipinahahayag ang kilos na pangangaso na akma sa pana at lalagyan ng mga palaso.
- source_word: לִּי
  choice: para sa akin
  rationale: Pinananatili ang datibong nagpapahayag na ang mahuhuli ay para kay Isaac.
- source_word: צידה
  choice: mahuhuling hayop
  rationale: Sa konteksto, tumutukoy ito sa pagkain o hayop na nakukuha sa pangangaso; inilalahad sa talababa upang maiwasan ang mabigat na pag-uulit sa pangunahing teksto.
