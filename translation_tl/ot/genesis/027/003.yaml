  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘pakikuha’ upang maipakita ang mapakiusap na נָא, at ‘parang’ para sa bukas na lupaing angkop sa pangangaso. Iniwasan ang teknikal o di-pamilyar na katawagan para sa lalagyan ng mga palaso.
