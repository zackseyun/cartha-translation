  text: וַ/תֹּ֤אמֶר רִבְקָה֙ אֶל יִצְחָ֔ק קַ֣צְתִּי בְ/חַיַּ֔/י מִ/פְּנֵ֖י בְּנ֣וֹת חֵ֑ת אִם לֹקֵ֣חַ יַ֠עֲקֹב אִשָּׁ֨ה מִ/בְּנֽוֹת חֵ֤ת כָּ/אֵ֨לֶּה֙ מִ/בְּנ֣וֹת הָ/אָ֔רֶץ לָ֥/מָּה לִּ֖/י חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/046.yaml
  text: Then Rebekah said to Isaac[a], “I am weary of my life because of the daughters of Heth. If Jacob takes a wife from the daughters of Heth like these, from the daughters of the land, what is life to me?”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Rebeca kay Isaac, “Sawáng-sawâ na ako sa buhay ko dahil sa mga anak na babae ni Het.[a] Kung kukuha si Jacob ng asawa mula sa mga anak na babae ni Het na gaya ng mga ito, mula sa mga anak na babae ng lupain, ano pa ang saysay ng buhay ko?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga babaeng Heteo” o “mga anak na babae ng mga Heteo.”
    reason: Alternatibong pang-etnikong salin ng literal na “mga anak na babae ni Het.”
lexical_decisions:
- source_word: קַצְתִּי בְחַיַּי
  choice: Sawáng-sawâ na ako sa buhay ko
  rationale: Ipinahahayag ng idyoma ang matinding pagkayamot at pagkabagot sa sariling buhay. Likas sa modernong Tagalog ang “sawáng-sawâ” at pinananatili nito ang tindi nang hindi umaabot sa tahasang pagkapoot.
- source_word: מִפְּנֵי
  choice: dahil sa
  rationale: Sanhi ang ipinahihiwatig ng pang-ukol sa kontekstong ito, kaya malinaw at natural ang “dahil sa.”
- source_word: בְּנוֹת חֵת
  choice: mga anak na babae ni Het
  rationale: Pinananatili ang literal na balangkas ng angkan at ang pangalang Het, sa halip na agad itong gawing pangkat-etnikong katawagan.
- source_word: אִם לֹקֵחַ יַעֲקֹב אִשָּׁה
  choice: Kung kukuha si Jacob ng asawa
  rationale: Ang “kumuha ng asawa” ay malinaw na idyoma para sa pag-aasawa at malapit sa anyo ng Hebreo.
- source_word: כָּאֵלֶּה
  choice: na gaya ng mga ito
  rationale: Pinananatili ang demonstratibong pagtukoy sa mga babaeng nabanggit o nasa isip, malamang sa mga asawa ni Esau.
- source_word: מִבְּנוֹת הָאָרֶץ
  choice: mula sa mga anak na babae ng lupaing ito
  rationale: Pinananatili ang paralelismo ng “mga anak na babae” at ginagawang malinaw sa Tagalog na ang tinutukoy ay ang lokal na lupain.
- source_word: לָמָּה לִּי חַיִּים
  choice: ano pa ang saysay ng buhay ko?
  rationale: Natural na retorikal na tanong ito sa Tagalog at ipinahahayag ang diwang hindi na magiging makabuluhan o kanais-nais ang buhay sa gayong kalagayan.
theological_decisions:
- issue: Pang-etnikong katawagan na חֵת
  choice: Panatilihin sa pangunahing teksto ang literal na “mga anak na babae ni Het”
  alternative: “mga babaeng Heteo” o “mga anak na babae ng mga Heteo”
  rationale: Pinananatili nito ang pangalang Hebreo at ang paglalarawan ayon sa angkan, habang inilalagay sa talababa ang mas tuwirang katawagang etniko.
- issue: Retorikal na puwersa ng לָמָּה לִּי חַיִּים
  choice: “ano pa ang saysay ng buhay ko?”
  alternative: “ano ang buhay para sa akin?” o “bakit pa ako mabubuhay?”
  rationale: Inihahatid nito nang natural ang idyomatikong puwersa nang hindi ginagawa itong tahasang pagnanais na mamatay; ang mas literal na anyo ay malamya sa Tagalog, samantalang ang “bakit pa ako mabubuhay?” ay maaaring maging mas matindi kaysa sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang matinding ngunit karaniwang “sawáng-sawâ” para sa damdamin ni Rebeca, at pinanatili ang mga pangalang Rebeca, Isaac, Jacob, at Het sa nakasanayang anyong Filipino.
