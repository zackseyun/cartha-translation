  text: עַד שׁ֨וּב אַף אָחִ֜י/ךָ מִמְּ/ךָ֗ וְ/שָׁכַח֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתָ לּ֔/וֹ וְ/שָׁלַחְתִּ֖י וּ/לְקַחְתִּ֣י/ךָ מִ/שָּׁ֑ם לָ/מָ֥ה אֶשְׁכַּ֛ל גַּם שְׁנֵי/כֶ֖ם י֥וֹם אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/045.yaml
  text: until your brother’s anger turns away from you[a], and he forgets what you have done to him. Then I will send and bring you from there[c][b]. Why should I be bereaved of both of you in one day?
translation:
  language: tl
  text: hanggang sa humupa ang galit sa iyo ng kapatid mo[a] at makalimutan niya ang ginawa mo sa kaniya. Pagkatapos, magsusugo ako upang kunin ka mula roon[b]. Bakit ako mawawalan ng dalawa kong anak sa iisang araw?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “hanggang sa bumalik o bumaling palayo sa iyo ang galit ng kapatid mo.” Ginagamit ang pandiwang “bumalik” kasama ng “galit” sa paraang idyomatiko; isinasalin itong “humupa ang galit.”'
    reason: lexical_alternative
  - marker: b
    text: O “upang ibalik ka mula roon.” Ang Hebreo ay literal na “kunin ka mula roon”; ipinahihiwatig ng konteksto ang pagbabalik ni Jacob.
    reason: lexical_alternative
  - marker: c
    text: Hindi nililinaw ng teksto kung paano maaaring mawalan si Rebeca ng dalawang anak sa iisang araw; hindi nito kinakailangang sabihing pareho silang mamamatay sa magkatulad na paraan.
    reason: cultural_note
lexical_decisions:
- source_word: עַד שׁוּב אַף אָחִיךָ מִמְּךָ
  choice: hanggang sa mawala ang galit sa iyo ng kapatid mo
  rationale: Ang שׁוב ay literal na “bumalik/lumingon,” ngunit kapag ang paksa ay אַף (“galit”), ang likas na idyomang Filipino ay “mawala ang galit.” Pinananatili ng “sa iyo” ang puwersa ng מִמְּךָ sa ugnayang tinutukoy.
- source_word: וְשָׁכַח אֵת אֲשֶׁר עָשִׂיתָ לוֹ
  choice: at malimutan niya ang ginawa mo sa kaniya
  rationale: Tuwirang inililipat ang kahulugan sa natural at modernong Tagalog nang hindi pinalalabo ang pananagutan ni Jacob sa nagawa niya kay Esau.
- source_word: וְשָׁלַחְתִּי
  choice: Pagkatapos, magsusugo ako
  rationale: Ipinahihiwatig ng pagkakasunod ng mga pandiwa ang susunod na gagawin ni Rebeca; malinaw itong naipapahayag ng “Pagkatapos.” Hindi tinutukoy sa Hebreo kung sino ang isusugo.
- source_word: וּלְקַחְתִּיךָ מִשָּׁם
  choice: upang kunin ka mula roon
  rationale: Ang לקח ay pangunahing nangangahulugang “kunin.” Hindi idinagdag sa pangunahing teksto ang “pabalik,” yamang kontekstuwal itong ipinahihiwatig ngunit walang tahasang katumbas sa Hebreo.
- source_word: לָמָה אֶשְׁכַּל גַּם שְׁנֵיכֶם יוֹם אֶחָד
  choice: Bakit ko hahayaang mawalan ako ng inyong dalawa sa iisang araw?
  rationale: Ang שכל ay tumutukoy sa pagkaitan o pangungulila ng magulang sa anak. Mas madaling maunawaan sa kasalukuyang Filipino ang “mawalan ako” kaysa “maulila ako,” at pinananatili ng “inyong dalawa” at “sa iisang araw” ang diin ng Hebreo.
theological_decisions:
- issue: Kung paano mawawala kay Rebeca ang dalawang anak sa iisang araw
  choice: Hindi tinukoy ang paraan; pinanatili ang malawak na pahayag na “mawalan ... ng inyong dalawa.”
  alternative: Ipaliwanag sa teksto na mamamatay ang dalawang anak sa araw ding iyon.
  rationale: Hindi sinasabi ng Hebreo na pareho silang mamamatay o na pareho ang paraan ng pagkawala. Maaaring saklaw ng pangamba ni Rebeca ang pagpatay, paghihiganti, paghatol, o pagkakahiwalay; hindi dapat lutasin sa salin ang ganitong kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kapatid mo” sa halip na mas pormal na ayos, “kaniya” para sa malinaw na reperensiya, at “magsusugo” upang mapanatili ang di-tiyak na mensahero. Ang “mawalan” ay mas natural sa ordinaryong mambabasa kaysa sa teknikal o makalumang “maulila/maulila sa anak,” habang ipinapaliwanag ng talababa ang saklaw ng pangungulila.
