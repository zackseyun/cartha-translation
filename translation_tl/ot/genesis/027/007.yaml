    issue: “mabasbasan kita”
    rationale: Hindi nito malinaw na naipapahayag ang aktibong Piel cohortative na “bless you.” Maaaring mabasa ito bilang pasibo o bilang posibilidad. Ang “mapagpala kita” ay tahasang aktibo at pinananatili ang volitional/purposive na daloy ng Hebreo.
  revised_text: ‘Dalhan mo ako ng karne ng mailap na hayop at ipagluto mo ako ng masarap na pagkain[a], upang makakain ako at mapagpala kita sa harap ni Yahweh bago ako mamatay.’
