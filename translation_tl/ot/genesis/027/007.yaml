  yaml_path: translation/ot/genesis/027/007.yaml
  text: Bring me game and make me tasty food[b][a], so that I may eat and bless you before Yahweh before I die.’
translation:
  language: tl
  text: ‘Dalhan mo ako ng karne ng mailap na hayop at ipagluto mo ako ng masarap na pagkain[a], upang makakain ako at mapagpala kita sa harap ni Yahweh bago ako mamatay.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “masasarap na putahe.” Tumutukoy ang Hebreo sa espesyal na inihandang pagkaing masarap.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאָה לִּי
  choice: Dalhan mo ako
  rationale: Ang Hiphil na pautos ng בוא, kasama ang לִּי, ay likas na naipahahayag sa Filipino bilang “Dalhan mo ako.”
- source_word: צַיִד
  choice: karne ng mailap na hayop
  rationale: Tumutukoy ito sa hayop o lamang nakukuha sa pangangaso. Nililinaw ng “karne ng mailap na hayop” ang kahulugan sa konteksto nang hindi ito nililimitahan sa usa lamang.
- source_word: וַעֲשֵׂה לִי
  choice: ipagluto mo ako
  rationale: Bagaman malawak ang kahulugan ng עשה na “gumawa,” sa konteksto ng paghahanda ng pagkain, natural at tiyak sa Filipino ang “ipagluto.”
- source_word: מַטְעַמִּים
  choice: masarap na pagkain
  rationale: Ang pangngalan ay tumutukoy sa masarap o espesyal na inihandang pagkain; malinaw at karaniwan ang pariralang ito sa modernong Filipino.
- source_word: וְאֹכֵלָה
  choice: upang makakain ako
  rationale: Ipinahahayag ng cohortative ang layunin o nilalayong resulta ng mga pautos.
- source_word: וַאֲבָרֶכְכָה
  choice: at mabasbasan kita
  rationale: Pinananatili ng anyong may “ma-” ang kusang layunin ni Isaac na ibigay ang basbas, kasunod ng pagkain.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ang לִפְנֵי ay “sa harap” o “sa presensya ng,” at ang personal na pangalang יהוה ay tinumbasan bilang “Yahweh.”
- source_word: לִפְנֵי מוֹתִי
  choice: bago ako mamatay
  rationale: Ito ang natural na Filipino para sa literal na diwang “bago ang aking kamatayan.”
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong “Yahweh” sa halip na palitan ng isang titulo.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “ipagluto” at “masarap na pagkain” para sa malinaw na pang-araw-araw na pananalita, habang pinanatili ang layunin ng mga cohortative at ang hayagang pagbanggit sa banal na pangalan.
