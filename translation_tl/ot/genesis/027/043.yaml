  text: Now[a], my son, listen to my voice, and arise, flee to my brother Laban in Haran.
translation:
  language: tl
  text: Ngayon[a], anak ko, pakinggan mo ang tinig ko; bumangon ka at tumakas patungo kay Laban, kapatid ko, sa Haran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At ngayon, anak ko, pakinggan mo ako; bumangon ka at tumakas para sa iyong sarili patungo kay Laban, kapatid ko, sa Haran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ang וְ ay nag-uugnay sa naunang sinabi at ang עַתָּה ay nagpapakilala ng agarang tagubilin; natural sa Filipino ang “Kaya ngayon” sa kontekstong ito.
- source_word: בְנִי
  choice: anak ko
  rationale: Pinananatili ang tuwirang mapagmahal na pagtawag ng ina kay Jacob; hindi kailangang tukuyin ang kasarian sa karaniwang Filipino.
- source_word: שְׁמַע בְּקֹלִי
  choice: pakinggan mo ang sasabihin ko
  rationale: Ang literal na “makinig sa aking tinig” ay idyomang humihiling ng pakikinig na may pagsunod. Ang salin ay natural ngunit hindi tahasang pinapalitan ito ng “sundin mo ako.”
- source_word: וְקוּם
  choice: tumindig ka
  rationale: Tuwirang inilalarawan ang pautos na קום at pinananatiling hiwalay sa kasunod na pautos.
- source_word: בְּרַח לְךָ
  choice: tumakas
  rationale: Ang ברח ay tumakas o lumayo sa panganib. Hindi kailangang isalin nang hiwalay ang idiomatikong לְךָ sa Filipino.
- source_word: אֶל לָבָן אָחִי
  choice: papunta sa kapatid kong si Laban
  rationale: Natural na ayos sa Filipino at malinaw na si Laban ang kapatid ng nagsasalita.
- source_word: חָרָנָה
  choice: sa Haran
  rationale: Ipinahihiwatig ng directional he ang patungong Haran; sa Filipino, sapat at natural ang “sa Haran” kasunod ng “papunta.”
