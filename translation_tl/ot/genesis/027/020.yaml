base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
translation:
  language: tl
  text: Sinabi ni Isaac sa kanyang anak, “Paano mo ito natagpuan agad, anak ko?” Sumagot siya, “Sapagkat ipinangyari ni Yahweh, na iyong Diyos, na matagpuan ko ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה זֶּה
  choice: Paano
  rationale: Ipinahahayag ng idyoma ang pagtataka ni Isaac at ang pagtatanong kung paano nangyari ang mabilis na paghahanap; natural itong naipapahayag sa Tagalog sa pamamagitan ng “Paano.”
- source_word: מִהַרְתָּ לִמְצֹא
  choice: mo ito natagpuan agad
  rationale: Pinagsasama nito ang diwa ng pagmamadali at ng paghahanap sa isang natural na sugnay sa Tagalog. Ang “ito” ay tumutukoy sa hayop o pagkaing hinihingi sa konteksto.
- source_word: בְּנִי
  choice: anak ko
  rationale: Tuwirang pinananatili ang mapagmahal na katawagan at ang unang panauhang hulaping paari.
- source_word: כִּי
  choice: Sapagkat
  rationale: Malinaw nitong ipinakikilala ang paliwanag ni Jacob sa isang marangal ngunit kasalukuyang rehistro.
- source_word: הִקְרָה
  choice: ipinahanap
  rationale: Ipinahihiwatig ng causative form na pinangyari o ipinagkaloob ng Diyos na matagpuan iyon. Sa Tagalog, natural na naisasama ng “ipinahanap ... sa akin” ang causative na diwa at ang kinalabasan sa konteksto nang hindi nagsasaad ng literal na pagdadala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang mahalagang ikalawang-panauhang anyo na “iyong Diyos,” hindi “ating Diyos” o “Diyos ko.”
- source_word: לְפָנַי
  choice: sa akin
  rationale: Sa pariralang ito, inilalarawan nito ang pangyayaring ipinagkaloob o pinangyari para sa nagsasalita. Ang “sa akin” ay natural sa Tagalog at hindi nangangailangan ng di-likas na literal na “sa harap ko.”
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ang pinagmulang teksto ay tahasang gumagamit ng Tetragrammaton; ang transliterasyong “Yahweh” ang nagpapanatili rito bilang personal na pangalan.
- issue: Saklaw ng banal na pagkilos sa הִקְרָה ... לְפָנַי
  choice: ipinahanap ito sa akin
  alternative: pinangyari itong matagpuan ko / dinala ito sa akin
  rationale: Pinananatili ng napiling salin ang causative at providensiyal na diwa ngunit hindi nagdaragdag ng tahasang kilos ng pagdadala, na wala sa pandiwang Hebreo.
- issue: Pahayag na “iyong Diyos” sa bibig ni Jacob
  choice: iyong Diyos
  alternative: ating Diyos / Diyos ko
  rationale: Hindi nilulutas o pinapahina ang naratibong tensiyon sa paggamit ni Jacob ng ikalawang panauhan.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “agad” para sa bilis, “anak ko” para sa tuwirang katawagan, at “ipinahanap ito sa akin” upang maipahayag nang maayos ang causative na Hebreo nang hindi maging mabigat o labis na interpretatibo.
