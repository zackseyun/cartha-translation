  to: Sinabi ni Isaac sa kanyang anak, “Paano mo ito natagpuan agad, anak ko?” Sumagot siya, “Sapagkat ipinangyari ni Yahweh, na iyong Diyos, na matagpuan ko ito.”
  rationale: Pinalitan ang “ipinahanap ito sa akin” ng “ipinangyari ... na matagpuan ko ito” upang malinaw na maipahayag ang causative/providential na diwa ng הִקְרָה nang hindi ipinahihiwatig na si Jacob ay inutusang maghanap. Inalis ang “Kaya” upang manatiling neutral ang naratibong paglipat. Pinanatili ang bilis ng pagkakatagpo, ang mapagmahal na “anak ko,” ang banal na pangalang “Yahweh,” at ang makabuluhang “iyong Diyos.”
