  yaml_path: translation/ot/genesis/027/036.yaml
  text: 'And he said[a], “Is he not rightly named Jacob? For he has supplanted me these two times: he took my birthright, and look, now he has taken my blessing.” And he said, “Have you not reserved a blessing for me?”'
translation:
  language: tl
  text: 'At sinabi niya[a], “Hindi ba angkop lamang na Jacob ang ipinangalan sa kaniya? Sapagkat dalawang beses na niya akong nilamangan: kinuha niya ang karapatan ko bilang panganay, at heto, ngayo’y kinuha niya ang pagpapala ko.” At sinabi niya, “Wala ka bang itinabing pagpapala para sa akin?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, may paglalaro ng salita sa pangalang “Jacob” at sa pandiwang isinaling “nilamangan niya ako.” Maaari rin itong isalin na “dinaya niya ako” o “inagawan niya ako ng karapatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי קָרָא שְׁמוֹ יַעֲקֹב
  choice: Hindi ba tama lamang na Jacob ang ipinangalan sa kaniya?
  rationale: Natural na retorikal na tanong sa Filipino na naghahanda sa mapait na paglalaro sa pangalang Jacob at sa kasunod na pandiwa.
- source_word: וַיַּעְקְבֵנִי
  choice: dinaya niya ako
  rationale: Sa konteksto, ipinahihiwatig ng pandiwa ang pandaraya o panlalamang. Hindi kayang ulitin nang natural sa Filipino ang tunog na kaugnay ng pangalang Jacob, kaya ipinaliliwanag ang wordplay sa talababa.
- source_word: זֶה פַעֲמַיִם
  choice: dalawang beses na
  rationale: Karaniwan at idiomatikong Filipino na nagpapanatili sa diin ng dalawang pangyayari.
- source_word: בְּכֹרָתִי
  choice: karapatan ko bilang panganay
  rationale: Mas malinaw sa ordinaryong mambabasa kaysa sa teknikal na “pagkapanganay,” at ipinapakita ang legal at pampamilyang pribilehiyo.
- source_word: וְהִנֵּה עַתָּה
  choice: at tingnan mo, ngayo'y
  rationale: Ipinananatili ang bigla at emosyonal na diin ng הִנֵּה sa natural at makabagong Filipino.
- source_word: בִּרְכָתִי
  choice: ang pagpapala para sa akin
  rationale: Sa Filipino, iniiwasan nito ang posibleng pakahulugang isang pagpapalang ibinigay ni Esau; tumutukoy ito sa pagpapalang nakalaan sana sa kaniya.
- source_word: הֲלֹא אָצַלְתָּ לִּי בְּרָכָה
  choice: Wala ka bang itinabing pagpapala para sa akin?
  rationale: Ang “itinabi” ay natural na katumbas ng paglalaan o pagpapanatili ng isang natitirang pagpapala.
