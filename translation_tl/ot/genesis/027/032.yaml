base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/032.yaml
  text: His father Isaac said to him[a], “Who are you?” And he said, “I am your son, your firstborn[b], Esau.”
translation:
  language: tl
  text: Sinabi sa kanya ng kanyang amang si Isaac[a], “Sino ka?” Sinabi niya, “Ako ang anak mo, ang iyong panganay[b], si Esau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “si Isaac na kanyang ama.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang pinakamatanda mong anak”; pinananatili ng “panganay” ang diin sa pagkakasunod ng kapanganakan na mahalaga sa salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi / Sumagot
  rationale: Ang אָמַר ay karaniwang pandiwa ng pagsasalita. Sa unang sugnay, “Sinabi” ang tuwirang katumbas; sa ikalawa, likas sa Tagalog ang “Sumagot” dahil tugon ito sa tanong, nang hindi binabago ang nilalaman.
- source_word: לּוֹ
  choice: sa kanya
  rationale: Ang ל na may hulaping ikatlong panauhang panlalaki ay tumutukoy sa taong kinausap.
- source_word: יִצְחָק אָבִיו
  choice: ng kanyang amang si Isaac
  rationale: Pinananatili ang ugnayang ama-anak at malinaw na kinikilala si Isaac bilang nagsasalita, sa natural na ayos ng modernong Tagalog.
- source_word: מִי אַתָּה
  choice: Sino ka?
  rationale: Ito ang tuwiran at natural na katumbas ng tanong sa Hebreo.
- source_word: אֲנִי
  choice: Ako ang
  rationale: Sa nominal na pangungusap, natural sa Tagalog ang konstruksiyong “Ako ang…” nang walang tahasang copula.
- source_word: בִּנְךָ
  choice: anak mo
  rationale: Tuwirang katumbas ng בֵּן na may hulaping ikalawang panauhang panlalaki.
- source_word: בְכֹרְךָ
  choice: iyong panganay
  rationale: Ang “panganay” ay natural at tumpak na salin ng בכור, at pinananatili ang diin sa pagkakasunod ng kapanganakan at kaugnayan nito sa karapatan ng panganay.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Tagalog.
