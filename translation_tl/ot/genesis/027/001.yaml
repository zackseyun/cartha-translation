  text: וַ/יְהִי֙ כִּֽי זָקֵ֣ן יִצְחָ֔ק וַ/תִּכְהֶ֥יןָ עֵינָ֖י/ו מֵ/רְאֹ֑ת וַ/יִּקְרָ֞א אֶת עֵשָׂ֣ו בְּנ֣/וֹ הַ/גָּדֹ֗ל וַ/יֹּ֤אמֶר אֵלָי/ו֙ בְּנִ֔/י וַ/יֹּ֥אמֶר אֵלָ֖י/ו הִנֵּֽנִ/י־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/001.yaml
  text: It happened that when Isaac was old and his eyes were too dim to see[a], he called Esau his older son and said to him, “My son,” and he said to him, “Here I am.”
translation:
  language: tl
  text: Nang matanda na si Isaac at lumabo na ang kanyang mga mata kaya hindi na siya makakita, tinawag niya ang nakatatanda niyang anak na si Esau[a] at sinabi rito, “Anak ko.” Sumagot si Esau, “Narito ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang panganay niyang anak na si Esau.”
    reason: Posibleng isalin ang הַגָּדֹל bilang “panganay” sa kontekstong ito, bagaman literal nitong itinatangi si Esau bilang anak na nakatatanda.
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Nang
  rationale: Ipinakikilala ng parirala ang pangyayaring nagsisimula sa bagong yugto ng salaysay. Likas sa modernong Tagalog ang temporal na “Nang” at hindi kailangan ang makalumang tuwirang katumbas na “At nangyari na.”
- source_word: זָקֵן
  choice: matanda na
  rationale: Payak at likas na paglalarawan sa katandaan ni Isaac; ipinahihiwatig ng “na” ang kalagayang naabot na niya sa puntong ito ng salaysay.
- source_word: וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת
  choice: lumabo na ang kanyang mga mata kaya hindi na siya makakita
  rationale: Ipinahahayag ang paglabo ng paningin at ang bunga nitong kawalan ng kakayahang makakita, habang pinananatili ang konkretong pagtukoy ng Hebreo sa kanyang mga mata.
- source_word: וַיִּקְרָא
  choice: tinawag niya
  rationale: Ang קרא ay tumutukoy rito sa pagtawag kay Esau upang lumapit o tumugon; sapat at natural ang “tinawag” nang hindi nagpapahiwatig ng labis na pormalidad.
- source_word: אֶת עֵשָׂו בְּנוֹ הַגָּדֹל
  choice: ang nakatatanda niyang anak na si Esau
  rationale: Sa paghahambing kay Jacob, ang הַגָּדֹל ay tumutukoy sa anak na mas matanda. Natural sa Tagalog ang ayos na ito at hindi nito pinipilit ang absolutong kahulugang “panganay,” bagaman posible rin iyon.
- source_word: בְּנִי
  choice: Anak ko
  rationale: Pinananatili ang tahasang anyong may pagmamay-ari at ang malapit na himig ng pagtawag ng ama sa anak.
- source_word: הִנֵּנִי
  choice: Narito ako
  rationale: Karaniwang pormulang tugon na nagpapahayag ng presensya at kahandaang makinig o sumunod.
