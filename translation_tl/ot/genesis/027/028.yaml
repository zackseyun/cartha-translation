  text: וְ/יִֽתֶּן לְ/ךָ֙ הָ/אֱלֹהִ֔ים מִ/טַּל֙ הַ/שָּׁמַ֔יִם וּ/מִ/שְׁמַנֵּ֖י הָ/אָ֑רֶץ וְ/רֹ֥ב דָּגָ֖ן וְ/תִירֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/028.yaml
  text: May God give you some of the dew of heaven[a], and some of the richness of the earth, and an abundance of grain and new wine.
translation:
  language: tl
  text: Bigyan ka nawa ng Diyos ng hamog mula sa langit[a], ng kasaganaan ng lupa, at ng kasaganaan ng butil at bagong alak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hamog ng langit” at “katabaan ng lupa.” Sa Hebreo, ang mga pariralang ito ay mga larawang tumutukoy sa pagkamabunga at kasaganaan ng lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Bigyan ka nawa
  rationale: Ang anyong pandiwa sa konteksto ng pagpapala ay nagpapahayag ng hangarin o basbas, hindi lamang ng payak na prediksiyon.
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Bagaman may pantukoy sa Hebreo, karaniwan itong tiyak na tawag sa Diyos at likas na isinasalin sa Filipino bilang “Diyos.”
- source_word: מִטַּל הַשָּׁמַיִם
  choice: ng hamog mula sa langit
  rationale: Ipinahihiwatig ng מִן ang pagkakaloob mula sa hamog ng langit. Likas sa modernong Filipino ang “hamog mula sa langit,” habang pinananatili ang larawang agrikultural.
- source_word: וּמִשְׁמַנֵּי הָאָרֶץ
  choice: ng kasaganaan ng lupa
  rationale: Ang literal na “katabaan” ay tumutukoy rito sa mataba, mabunga, at masaganang lupain; malinaw na naihahatid ng “kasaganaan ng lupa” ang idyoma.
- source_word: וְרֹב
  choice: at ng saganang
  rationale: Ang רֹב ay nangangahulugang dami o kasaganaan. Ang “saganang” ay natural at marangal sa pananalita ng pagpapala.
- source_word: דָּגָן
  choice: butil
  rationale: Pangkalahatang tawag ito sa ani ng mga halamang butil, hindi sa isang partikular na uri gaya ng mais.
- source_word: וְתִירֹשׁ
  choice: at bagong alak
  rationale: Ang תִּירוֹשׁ ay karaniwang tumutukoy sa bago o sariwang alak at naiiba sa mas pangkalahatang salita para sa alak.
theological_decisions:
- issue: Kalikasan ng pahayag
  choice: 'Isang basbas o hangarin: “Bigyan ka nawa ng Diyos”'
  alternative: 'Isang tuwirang prediksiyon: “Bibigyan ka ng Diyos”'
  rationale: Ang anyong pandiwa at ang konteksto ng pagpapala ni Isaac ay pumapabor sa isang binibigkas na basbas, nang hindi nagdaragdag ng teolohikal na paliwanag na wala sa teksto.
translation_notes:
  register: Makabago at madaling maunawaang Filipino, ngunit pinanatili ang marangal na himig ng isang patriyarkal na pagpapala. Ginamit ang “nawa” upang likas na maipahayag ang volitibong diwa.
