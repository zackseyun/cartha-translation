- from: Kaya ngayon, anak ko, pakinggan mo ang sasabihin ko at sundin ang iuutos ko sa iyo.
  to: Ngayon, anak ko, makinig ka sa akin tungkol sa inuutos ko sa iyo.
  rationale: Inalis ang interpretatibong pagdaragdag na "at sundin" at pinalitan ang panghinaharap na "iuutos" ng "inuutos" upang maipakita ang kasalukuyan o agarang pag-uutos. Pinanatili ang direktang pantawag at ang ugnayan ng pakikinig sa mismong utos.
