  text: Ngayon, anak ko, makinig ka sa akin tungkol sa inuutos ko sa iyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Nagsisilbing panandang pangdiskurso at panahunan na nag-uugnay sa narinig ni Rebeca sa kasunod niyang tagubilin; natural sa Filipino ang “Kaya ngayon.”
- source_word: בְּנִי
  choice: anak ko
  rationale: Likas at magiliw na anyong pantawag sa anak sa modernong Filipino.
- source_word: שְׁמַע בְּקֹלִי
  choice: pakinggan mo ang sasabihin ko at sundin
  rationale: Ang idyomang Hebreo ay hindi lamang tumutukoy sa pandinig kundi sa pagbibigay-pansin at pagsunod. Pinananatili ng salin ang dalawang pahiwatig nang hindi ito ginagawang simpleng “sumunod” lamang.
- source_word: לַאֲשֶׁר
  choice: ang ... at
  rationale: Natural na inuugnay sa Filipino ang idyomang “pakinggan ang sasabihin ko” sa tiyak na utos na kasunod; iniiwasan ang alanganing literal na “ayon sa kung ano.”
- source_word: אֲנִי מְצַוָּה אֹתָךְ
  choice: iuutos ko sa iyo
  rationale: Ipinahahayag ang agaran at tiyak na utos sa natural na Filipino. Ang aspektong kontemplatibo ay angkop sa utos na ibibigay kaagad sa mga susunod na talata.
