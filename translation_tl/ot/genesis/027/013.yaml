  text: His mother said to him[a], “Your curse be on me, my son. Only listen to my voice, and go[b], get them for me.”
translation:
  language: tl
  text: Sinabi sa kanya ng kanyang ina, “Sa akin na mapunta ang sumpa mo, anak ko. Makinig ka lamang sa akin[a]; pumunta ka at kunin mo para sa akin ang mga iyon[b].”
  philosophy: optimal-equivalence
