lexical_decisions:
- source_word: וַתֹּאמֶר לֹו אִמּוֹ
  choice: Sinabi sa kanya ng kanyang ina
  rationale: Tuwirang salaysay ito ng pagsasalita ng ina kay Jacob; natural at marangal ang ayos sa modernong Tagalog.
- source_word: עָלַי קִלְלָתְךָ
  choice: Ako ang bahala sa sumpang para sa iyo
  rationale: Ipinahahayag ng עָלַי na handang akuin ng ina ang pananagutan o bunga ng sumpang maaaring mapunta kay Jacob. Mas natural ito sa Tagalog kaysa sa literal na ‘Mapasaakin ang sumpa mo,’ nang hindi ginagawang tiyak kung pangako, pagnanais, o matatag na pag-angkin ang anyo ng Hebreo.
- source_word: בְּנִי
  choice: anak ko
  rationale: Pinananatili ang magiliw at tuwirang katawagan ng ina sa kanyang anak.
- source_word: אַךְ
  choice: lang
  rationale: 'Ipinakikita ang panlilimita o pagbibigay-diin: ang hinihingi kay Jacob ay sundin ang utos ng kanyang ina.'
- source_word: שְׁמַע בְּקֹלִי
  choice: Sundin mo ang sinasabi ko
  rationale: Ang literal na ‘makinig sa aking tinig’ ay isang Hebreong idyoma na sa konteksto ay nangangahulugang sumunod. Ang salin ay likas sa Tagalog habang inilalagay sa talababa ang literal na larawan.
- source_word: וְלֵךְ
  choice: humayo ka
  rationale: Pinananatili ang hiwalay na pautos at ang sunod-sunod na kilos; ang ‘humayo’ ay dignified ngunit madaling maunawaan sa salaysay na biblikal.
- source_word: קַח לִי
  choice: kunin mo para sa akin ang mga iyon
  rationale: Walang tahasang layon sa talata, ngunit malinaw itong tumutukoy sa dalawang batang kambing sa naunang talata. Isinuplay ang panghalip para sa likas na Tagalog.
theological_decisions:
- issue: Kung paano ipahahayag ang pag-ako ni Rebekah sa sumpa
  choice: Ako ang bahala sa sumpang para sa iyo
  alternative: Mapasaakin ang sumpa mo
  rationale: Iniiwasan ng napiling salin ang di-likas at posibleng malabong Tagalog, ngunit hindi nito ipinapaliwanag kung paano o kung maaari ngang mailipat ang sumpa. Kaya napapanatili ang tensiyon ng salaysay nang walang idinadagdag na doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang ‘anak ko’ at ‘humayo’ upang mapanatili ang init at dignidad ng salaysay, habang ang mga idyomang Hebreo ay isinalin ayon sa gamit at ipinaliwanag sa talababa.
