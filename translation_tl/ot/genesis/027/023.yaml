  text: And he did not recognize him[a], because his hands were hairy like the hands of his brother Esau; so he blessed him.
translation:
  language: tl
  text: Hindi siya nakilala ni Isaac, sapagkat mabalahibo ang mga kamay ni Jacob, gaya ng mga kamay ng kapatid niyang si Esau; kaya binasbasan niya siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at binasbasan niya siya.” Ang anyong pasalaysay sa Hebreo ay maaaring ipakahulugang payak na pagkakasunod-sunod, bagaman maaari rin itong magpahiwatig dito ng bunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוֹ
  choice: Hindi niya nakilala si Jacob
  rationale: Ang Hifil ng נכר ay nangangahulugang ‘makilala’ o ‘matukoy.’ Nilinaw ang tinutukoy ng panghalip bilang si Jacob upang maging natural at malinaw sa Tagalog, nang hindi binabago ang diwa.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng כִּי ang dahilan kung bakit hindi nakilala ni Isaac si Jacob. Ang ‘sapagkat’ ay malinaw, dignificado, at likas na panandang sanhi.
- source_word: יָדָיו
  choice: ang mga kamay nito
  rationale: Tumutukoy ang panghalip kay Jacob. Ginamit ang ‘nito’ upang maiwasan ang malabong sunod-sunod na ‘niya’ sa Tagalog.
- source_word: כִּידֵי
  choice: gaya ng mga kamay ng
  rationale: Pinananatili ng ‘gaya ng’ ang paghahambing na ipinahihiwatig ng prefixed כ.
- source_word: אָחִיו
  choice: kapatid nitong si Esau
  rationale: Tapat ito sa literal na ugnayang ‘kanyang kapatid,’ habang nililinaw sa natural na Tagalog na si Esau ang kapatid ni Jacob.
- source_word: שְׂעִרֹת
  choice: mabalahibo
  rationale: Maikli at natural itong paglalarawan sa mga kamay at pinananatili ang pandamang detalye na mahalaga sa panlilinlang.
- source_word: וַיְבָרְכֵהוּ
  choice: kaya binasbasan niya siya
  rationale: Ang waw-consecutive ay nagsusulong ng salaysay at maaari ring magpahiwatig dito ng bunga. Ang ‘kaya’ ay naghahayag ng lohikal na daloy nang hindi inaalis ang alternatibong payak na pagkakasunod.
