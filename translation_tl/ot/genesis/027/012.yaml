base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/012.yaml
  text: Perhaps my father will feel me[a], and I will seem to him like a deceiver[b], and I will bring a curse on myself and not a blessing.
translation:
  language: tl
  text: “Baka kapain ako ng aking ama[a], at mukha akong isang manlilinlang sa paningin niya[b], at magdulot ako sa aking sarili ng sumpa sa halip na pagpapala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hipuin ako.” Ang pandiwang Hebreo ay tumutukoy sa pagkilala sa pamamagitan ng paghipo, gaya ng pisikal na pagsusuri ni Isaac sa pagkakakilanlan ni Jacob.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “gaya ng isang nanlilibak” o “gaya ng isang mapanloko.” Ang salitang Hebreo ay maaaring tumukoy sa taong nanlilinlang o gumagawang katawa-tawa sa iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Baka
  rationale: Likas na ipinapahayag sa modernong Tagalog ang isang posibilidad na kinatatakutan ni Jacob, habang pinananatili ang kawalang-katiyakan ng Hebreo.
- source_word: יְמֻשֵּׁנִי
  choice: kapain ako
  rationale: Ang pandiwang משש ay tumutukoy sa pagkilala sa pamamagitan ng paghipo o pagkapa; ang “kapain” ay angkop sa pisikal na pagsusuri ni Isaac.
- source_word: אָבִי
  choice: aking ama
  rationale: Tuwirang salin ng pangngalang may panandang paari.
- source_word: וְהָיִיתִי בְעֵינָיו
  choice: at ituring niya akong
  rationale: Likas na inililipat sa Tagalog ang idyomang Hebreo na literal na “maging sa kanyang mga mata,” na tumutukoy sa magiging pagkakilala o palagay ni Isaac kay Jacob.
- source_word: כִּמְתַעְתֵּעַ
  choice: isang manlilinlang
  rationale: Ipinahahayag nito ang taong nagliligaw o nandaraya. Ang “manlilinlang” ang pinakamalinaw sa konteksto, habang inilalagay sa talababa ang posibleng diwang panlilibak o panloloko.
- source_word: וְהֵבֵאתִי עָלַי
  choice: at magdala ako sa aking sarili
  rationale: 'Pinananatili ang causative na diwa: si Jacob mismo ang magiging dahilan ng pagdating ng bunga sa kanya.'
- source_word: קְלָלָה וְלֹא בְרָכָה
  choice: sumpa at hindi pagpapala
  rationale: Tuwirang pinananatili ang matinding paghahambing sa pagitan ng sumpa at ng inaasam na pagpapala.
