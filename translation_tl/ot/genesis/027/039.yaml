base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/039.yaml
  text: Then his father Isaac answered and said to him[a], “Behold, your dwelling shall be away from the richness of the earth, and away from the dew of heaven above.”
translation:
  language: tl
  text: Sumagot sa kanya ang ama niyang si Isaac, “Tingnan mo, ang tirahan mo ay malayo sa masaganang lupain at sa hamog na mula sa langit sa itaas.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Tingnan mo, ang tirahan mo ay nasa masaganang lupain, na may hamog mula sa langit sa itaas.” Ang pang-ukol sa Hebreo ay maaaring mangahulugang “mula sa/bahagi ng” o “malayo sa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Karaniwang pananalitang pasalaysay na nagpapakilala ng tugon; likas at malinaw sa modernong Tagalog.
- source_word: אָבִיו
  choice: ang ama niyang si Isaac
  rationale: Pinananatili ang ugnayang 'ama niya' at ang pangalang Isaac sa natural na ayos ng Tagalog.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Nagsisilbing panawag sa taimtim na pansin; mas natural sa kasalukuyang Tagalog kaysa 'Narito' sa kontekstong ito.
- source_word: מִשְׁמַנֵּי הָאָרֶץ
  choice: malalayo sa matabang lupain
  rationale: Ang שְׁמַנִּים ay tumutukoy sa kasaganaan o katabaan ng lupa. Binasa ang מִן bilang naghihiwalay o naglalayo, kaayon ng konteksto, habang itinatala sa talababa ang posibleng positibong pagbasa.
- source_word: מוֹשָׁבֶךָ
  choice: ang tirahan mo
  rationale: Tuwirang ipinahahayag ang lugar o kalagayan ng paninirahan sa malinaw na Tagalog.
- source_word: וּמִטַּל הַשָּׁמַיִם
  choice: at sa hamog mula sa langit
  rationale: Ang pang-ukol na מִן ay inuunawa ring may diwang pagkalayo; ang 'hamog mula sa langit' ay natural na paglalarawan ng pinagmulan ng hamog.
- source_word: מֵעָל
  choice: sa itaas
  rationale: Pinananatili ang Hebreong pananalitang panlunan na naglalarawan sa langit bilang nasa itaas.
theological_decisions:
- issue: Kahulugan ng pang-ukol na מִן sa sinabi ni Isaac kay Esau
  choice: 'Pagbasa bilang paghihiwalay o pagkakait: “malalayo sa” matabang lupain at hamog ng langit'
  alternative: 'Pagbasa bilang pinagmulan o pakikibahagi: “mula sa” o “tatamasa ng” matabang lupain at hamog ng langit'
  rationale: Pinapaboran ng paghahambing sa pagpapala kay Jacob sa talata 28 at ng mas malawak na konteksto ang negatibong pagbasa, ngunit tunay na pinahihintulutan ng Hebreo ang positibong pagbasa; kaya pinanatili ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Tingnan mo” bilang taimtim na panawag-pansin at “matabang lupain” bilang likas na katumbas ng metaporang Hebreo para sa lupang masagana. Inilagay ang marker na [a] sa mismong teksto.
