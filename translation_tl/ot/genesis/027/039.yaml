  rationale: Inayos ang mali at di-likas na “malalayo” bilang “malayo,” at ginawa ang magkatuwang na ayos na “malayo sa ... at sa ...” upang malinaw na maipahayag ang piniling privative na pagbasa ng dalawang מִן. Pinalitan ang “matabang lupain” ng “masaganang lupain” para sa mas angkop na metaporikong saklaw. Inayos din ang talababa upang mapanatili ang tunay na positibong pagbasa nang hindi nagdaragdag ng kahulugang wala sa teksto.
