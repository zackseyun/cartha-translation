  source_fidelity: 'Tumpak na kinikilala ng pangunahing salin ang posibleng privative/separative na pagbasa ng parehong מִן, at ang talababa ay wastong nagtatala ng positibong alternatibo. Gayunman, ang “ang tirahan mo ay malalayo” ay hindi wastong pagsasabi ng ugnayang panlunan: ang tirahan ay isahan at dapat sabihing “ay malayo sa.” Ang ikalawang parirala ay dapat ding malinaw na saklaw ng “malayo sa.”'
  naturalness: Marangal at madaling maunawaan ang “Sumagot sa kanya ang ama niyang si Isaac” at “Tingnan mo.” Ang pagwawasto sa “malalayo” tungo sa “malayo” at ang mas maayos na pag-uugnay ng dalawang bagay na kinalalayuan ay nagbibigay ng likas na modernong Tagalog.
  terminology: Ang “masaganang lupain” ay mas malawak at mas idiomatikong katumbas ng metaporang Hebreo na “katabaan/kasaganaan ng lupa” kaysa “matabang lupain,” na maaaring magpahiwatig lamang ng soil fertility. Nananatiling angkop ang “hamog.”
  issues:
