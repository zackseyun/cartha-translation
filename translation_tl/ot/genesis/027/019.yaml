base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/019.yaml
  text: And Jacob said to his father[a], “I am Esau your firstborn. I have done as you told me. Please rise, sit, and eat from my game[b], so that your soul may bless me.”
translation:
  language: tl
  text: At sinabi ni Jacob sa kanyang ama, “Ako si Esau, ang panganay mo. Ginawa ko ang sinabi mo sa akin. Pakiusap, bumangon ka, umupo ka, at kumain ka ng huli ko, upang pagpalain mo ako.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “upang pagpalain ako ng iyong kaluluwa.” Ang salitang Hebreo para sa “kaluluwa” o “sarili” ay idyomatikong tumutukoy rito sa mismong tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב אֶל־אָבִיו
  choice: At sinabi ni Jacob sa kanyang ama
  rationale: Pinananatili ng “At” ang pagsulong ng salaysay na ipinahihiwatig ng waw-consecutive, at tuwirang isinasalin ang ugnayang pampamilya.
- source_word: אָנֹכִי עֵשָׂו בְּכֹרֶךָ
  choice: Ako si Esau, ang panganay mo
  rationale: Malinaw na ipinapahayag ang mapanlinlang na pagkakakilanlan ni Jacob at ang kasunod na paglalarawan kay Esau bilang panganay ni Isaac.
- source_word: עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: Ginawa ko ang sinabi mo sa akin
  rationale: Natural na modernong Tagalog ito para sa literal na diwang “ginawa ko ayon sa sinabi mo sa akin,” nang hindi dinaragdagan ang pahayag.
- source_word: קוּם נָא
  choice: Pakiusap, bumangon ka
  rationale: Ang “bumangon” ay tumutugma sa pautos na קוּם, samantalang ipinahahayag ng “Pakiusap” ang magalang o nakikiusap na puwersa ng נָא.
- source_word: שְׁבָה
  choice: maupo
  rationale: Tuwirang katumbas ng pautos na “umupo/maupo” at natural sa sunod-sunod na tagubilin.
- source_word: וְאָכְלָה מִצֵּידִי
  choice: at kumain ng nahuli kong hayop
  rationale: Ang צַיִד ay tumutukoy sa nahuling maiilap na hayop o pagkaing mula sa pangangaso. Iniiwasan ng saling ito ang malabong “huli” lamang habang pinananatili ang pag-aangkin ni Jacob na siya ang nangaso.
- source_word: בַּעֲבוּר
  choice: upang
  rationale: Malinaw at marangal na panandang Tagalog para sa layuning ipinahahayag ng parirala.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: pagpalain mo ako
  rationale: Ang נֶפֶשׁ ay idyomatikong tumutukoy rito sa mismong tao, hindi kinakailangang isang hiwalay na sangkap na “kaluluwa.” Natural na ipinahahayag ng pandiwang may “mo” ang gumaganap; itinatala sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Kahulugan ng נַפְשֶׁךָ sa pariralang תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: upang pagpalain mo ako
  alternative: upang pagpalain ako ng iyong kaluluwa / upang ikaw mismo ang magpala sa akin
  rationale: Idyoma rito ang נֶפֶשׁ para sa tao o sarili. Ang literal na “kaluluwa” ay maaaring magmungkahi ng antropolohikal na pahayag na hindi layon ng teksto, kaya ginamit ang natural na kahulugan at pinanatili sa talababa ang literal na larawan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, magalang, at marangal. Ginamit ang “Pakiusap” upang katawanin ang נָא nang hindi nagdaragdag ng honoripikong “po” na walang tuwirang katumbas sa Hebreo. Pinanatili ang bahagyang kapansin-pansing pagkakasunod na “bumangon… maupo” sapagkat gayon ang mga pautos sa pinagmulang teksto.
