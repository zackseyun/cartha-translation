    issue: Ang “maupo” ay hindi ang pinakanatural na pautos sa modernong Filipino.
    rationale: Para sa imperatibong שְׁבָה, ang “umupo ka” ang karaniwan at malinaw na anyo. Pinananatili nito ang utos na ‘sit/sit down’ nang walang pagbabago sa kahulugan.
  - severity: low
    issue: Ang “nahuli kong hayop” ay medyo mabigat at maaaring magtunog na hayop mismo, sa halip na pagkaing mula sa pangangaso.
    rationale: Ang צַיִד ay tumutukoy sa huli o pagkaing mula sa pangangaso. Ang “huli ko” ay likas sa Tagalog at sapat na malinaw sa utos na kumain.
