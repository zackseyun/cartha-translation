revisions:
- from: At sinabi ni Jacob sa kanyang ama, “Ako si Esau, ang panganay mo. Ginawa ko ang sinabi mo sa akin. Pakiusap, bumangon ka, maupo, at kumain ng nahuli kong hayop, upang pagpalain mo ako.[a]”
  to: At sinabi ni Jacob sa kanyang ama, “Ako si Esau, ang panganay mo. Ginawa ko ang sinabi mo sa akin. Pakiusap, bumangon ka, umupo ka, at kumain ka ng huli ko, upang pagpalain mo ako.[a]”
  rationale: Inayos ang anyong pautos na “maupo” tungo sa natural na modernong Filipino na “umupo ka,” at pinasimple ang “nahuli kong hayop” tungo sa “huli ko” upang mas idiomatikong tukuyin ang pagkain mula sa pangangaso. Pinanatili ang lahat ng kahulugan, ang magalang na puwersa ng נָא, at ang idyomatikong pag-unawa sa נֶפֶשׁ na may literal na talababa.
