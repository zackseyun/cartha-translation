  source_fidelity: Tumpak na naihahatid ng draft ang salaysay, ang mapanlinlang na pahayag ni Jacob, ang sunod-sunod na pautos, ang pagkaing mula sa pangangaso, at ang sugnay ng layunin. Tama ring isinalin nang idyomatiko ang נַפְשֶׁךָ bilang ang taong magpapala, habang itinatala ang literal na anyo sa talababa.
  naturalness: 'May isang ligtas na kailangang ayos: ang “maupo” ay hindi ang karaniwang anyong pautos sa modernong Filipino sa kontekstong ito at maaaring mangahulugang ‘magkaroon ng pagkakataong makaupo.’ Mas natural at malinaw ang “umupo ka.”'
  terminology: Ang “panganay,” “pagpalain,” at “kaluluwa” sa talababa ay angkop. Ang “nahuli kong hayop” ay nauunawaan ngunit medyo hindi likas bilang pagkaing ipinakakain; ang “huli ko” ay mas natural para sa hunted game at hindi nagpapahiwatig na kailangang buong hayop ang kainin.
  issues:
