base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/029.yaml
  text: Let peoples serve you[a], and nations bow down to you. Be master over your brothers, and let your mother's sons bow down to you. Cursed be those who curse you[b], and blessed be those who bless you.
translation:
  language: tl
  text: 'Maglingkod nawa sa iyo ang mga bayan,

    at yumukod sa iyo ang mga bansa.[a]


    Maging pinuno ka ng iyong mga kapatid,[b]

    at yumukod sa iyo ang mga anak ng iyong ina.


    Sumpain nawa ang mga sumusumpa sa iyo,

    at pagpalain nawa ang mga nagpapala sa iyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “yumukod” ay maaari ring mangahulugang “magpatirapa” o “magbigay-galang.” Maaari itong gamitin sa harap ng Diyos o ng tao; dito, tao ang pinag-uukulan.
    reason: lexical_alternative
  - marker: b
    text: O “Maging panginoon ka sa iyong mga kapatid.” Ang “pinuno” ay ginamit upang hindi mapagkamalan ang salita bilang banal na titulong “Panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַבְדוּךָ
  choice: Maglingkod nawa sa iyo
  rationale: Ang Qal ng עבד na may hulaping tumutukoy sa kausap ay nagpapahayag dito ng paglilingkod o pagpapasakop. Pinananatili ng “maglingkod” ang lawak ng kahulugan nang hindi ito nililimitahan sa karaniwang trabaho.
- source_word: עַמִּים
  choice: mga bayan
  rationale: Tumutukoy ito sa maramihang pangkat ng mga tao. Ang “mga bayan” ay natural sa Filipino at naihihiwalay sa kasunod na kasingkahulugang לְאֻמִּים.
- source_word: וְיִשְׁתַּחֲווּ לְךָ
  choice: at yumukod sa iyo
  rationale: Ang pandiwa ay tumutukoy sa pagyukod o pagpapatirapa bilang pagkilala sa nakatataas. Dahil tao ang pinag-uukulan sa konteksto, hindi ginamit ang “sumamba,” na maaaring magpahiwatig ng pagsambang ukol sa Diyos.
- source_word: לְאֻמִּים
  choice: mga bansa
  rationale: Isa itong patulang kaagapay ng עַמִּים at tumutukoy sa mga pangkat ng tao. Ang “mga bansa” ay nagpapanatili ng pagkakaiba-iba ng magkasingkahulugang mga linya.
- source_word: הֱוֵה גְבִיר
  choice: Maging pinuno ka
  rationale: Ang הֱוֵה ay tuwirang pautos na “maging,” at ang גְבִיר ay isang taong may kapangyarihan o paghahari sa iba. Natural ang “pinuno” sa makabagong Filipino at iniiwasan nito ang maaaring pagkalito ng “panginoon” sa titulong ginagamit para sa Diyos.
- source_word: לְאַחֶיךָ
  choice: ng iyong mga kapatid
  rationale: Kasama ng גְבִיר, ipinahihiwatig ng parirala ang pamumuno sa mga kapatid. Ang konstruksyong “pinuno ... ng” ang natural na katumbas sa Filipino.
- source_word: בְּנֵי אִמֶּךָ
  choice: mga anak ng iyong ina
  rationale: Pinananatili ng tuwirang pariralang ito ang tiyak na pagsasabi ng Hebreo sa halip na palawakin lamang bilang “mga kamag-anak.”
- source_word: אֹרְרֶיךָ אָרוּר
  choice: Sumpain ang mga sumusumpa sa iyo
  rationale: Pinananatili nito ang pormulang gumaganti ng sumpa at ang maramihang tumutukoy sa mga gumagawa nito.
- source_word: וּמְבָרֲכֶיךָ בָּרוּךְ
  choice: at pagpalain ang mga nagpapala sa iyo
  rationale: Ito ang katapat na pormula ng pagpapala sa naunang sumpa. Ang maramihang anyo ay natural na inilapat sa lahat ng nagpapala sa kausap.
theological_decisions:
- issue: Ang uri ng pagyukod sa isang taong pinagpala
  choice: yumukod sa iyo
  alternative: sumamba sa iyo; magbigay-galang sa iyo
  rationale: Maaaring gamitin ang pandiwang Hebreo sa pagpapatirapa sa harap ng Diyos o ng tao. Sa kontekstong ito ng pampamilya at pampolitikang pangingibabaw, inilalarawan nito ang paggalang at pagpapasakop sa isang taong nakatataas. Pinananatili ng “yumukod” ang kilos nang hindi ipinapasok ang tiyak na diwa ng pagsambang ukol sa Diyos.
- issue: Ang titulo ng kapangyarihan sa mga kapatid
  choice: pinuno
  alternative: panginoon; amo
  rationale: Nagsasaad ang גְבִיר ng taong may awtoridad o pangingibabaw. Ang “pinuno” ay malinaw sa kasalukuyang Filipino at hindi nagpapahiwatig na banal ang tinutukoy; gayunman, ipinapaliwanag sa talababa ang mas literal na mga alternatibo.
translation_notes:
  register: Makabago ngunit marangal ang himig, na angkop sa patulang pagpapala. Ginamit ang “nawa” sa unang linya upang ipakita ang pahayag na hangad o pagpapala, habang pinanatili ang tuwirang pautos na “Maging” sa gitnang linya. Ang magkakatulad na hulma ng pagyukod, pagsumpa, at pagpapala ay pinanatili para sa ritmo at paralelismo.
