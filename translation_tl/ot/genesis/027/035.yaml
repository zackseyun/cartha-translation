  text: And he said[a], “Your brother came with deceit and took your blessing.”
translation:
  language: tl
  text: Sinabi niya, “Dumating ang kapatid mo nang may pandaraya[a] at kinuha niya ang pagpapala mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa pamamagitan ng pandaraya”; o, “sa mapanlinlang na paraan.” Gumagamit ang Hebreo ng pangngalang “pandaraya” na may pang-ukol, kaya maaari itong likas na ipahayag sa ilang paraan sa Tagalog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi niya
  rationale: Karaniwang salin ng anyong pasalaysay na wayyiqtol ng אמר; natural itong pambungad sa tugon ni Isaac nang hindi nagdaragdag ng di-tiyak na ugnayang pangdiskurso.
- source_word: בָּא
  choice: Dumating
  rationale: Ang Qal perfect ng בוא ay tumutukoy rito sa isang natapos na kilos sa salaysay, kaya ang payak na aspektong naganap ang angkop.
- source_word: אָחִיךָ
  choice: ang kapatid mo
  rationale: Tuwirang pinananatili ang katawagang pampamilya at ang retorikal na diin nito sa halip na ipalit ang pangalang Jacob.
- source_word: בְּמִרְמָה
  choice: nang may pandaraya
  rationale: Pinananatili nito ang pangngalang מִרְמָה at ipinapahayag ang paraan o kasangkapang tinutukoy ng pang-ukol ב, sa natural na modernong Tagalog.
- source_word: וַיִּקַּח
  choice: at kinuha niya
  rationale: Ipinagpapatuloy nito ang pagkakasunod ng mga kilos sa salaysay; ang “kinuha” ay hindi nagpapasok ng higit na puwersa kaysa sa ipinahihiwatig ng לקח.
- source_word: בִּרְכָתֶךָ
  choice: ang pagpapala mo
  rationale: Tuwirang sinasalamin ang pangngalan at hulaping ikalawang panauhang panlalaki; sa konteksto, ito ang pagpapalang nakalaan kay Esau.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang payak na katawagang “kapatid mo” at ang konkretong pangngalang “pandaraya,” habang iniwasang gawing mas tahasang “dinaya ka,” na magdaragdag ng layon na hindi tahasang nakasaad sa Hebreo.
