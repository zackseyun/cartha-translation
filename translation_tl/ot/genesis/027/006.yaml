base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/006.yaml
  text: And Rebekah said to Jacob her son[a], “Look, I heard your father speaking to Esau your brother, saying,”
translation:
  language: tl
  text: At sinabi ni Rebeca sa anak niyang si Jacob, “Makinig ka, narinig kong nagsasalita ang iyong ama sa kapatid mong si Esau. Sinabi niya,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: At sinabi ni Rebeca
  rationale: Ang וְ ay pinanatili bilang “At” upang maipagpatuloy ang daloy ng salaysay nang hindi ipinapalagay ang mas tiyak na pagkakasunod-sunod. Ginamit ang karaniwang anyong Filipino ng pangalan.
- source_word: אֶל יַעֲקֹב בְּנָהּ
  choice: sa anak niyang si Jacob
  rationale: Natural sa modernong Tagalog ang ayos na ito at malinaw nitong pinananatili na si Jacob ang anak ni Rebeca.
- source_word: הִנֵּה
  choice: Makinig ka
  rationale: Dito, ang הִנֵּה ay pantawag-pansin bago iulat ni Rebeca ang narinig niya. Ang “Makinig ka” ay natural sa kontekstong pasalita, bagaman hindi nito saklaw ang lahat ng gamit ng salitang Hebreo.
- source_word: שָׁמַעְתִּי
  choice: narinig kong
  rationale: Ipinahahayag nito ang natapos na pandinig sa nakaraan at maayos itong idinudugtong sa kasunod na participle sa Tagalog.
- source_word: אֶת אָבִיךָ מְדַבֵּר
  choice: sinasabi ng iyong ama
  rationale: Ang “narinig kong sinasabi” ay natural sa Tagalog at pinananatili ang diwang nagpapatuloy na pagkilos ng participle מְדַבֵּר.
- source_word: אֶל עֵשָׂו אָחִיךָ
  choice: sa kapatid mong si Esau
  rationale: Pinananatili ang direksiyon ng pagsasalita at ang appositional na pagkakakilanlan kay Esau bilang kapatid ni Jacob.
- source_word: לֵאמֹר
  choice: panapos na kuwit bago ang kasunod na sipi
  rationale: Ang huling לֵאמֹר ay naghahanda sa tuwirang siping sumusunod sa talata 7. Sa Filipino, sapat at natural ang bantas upang ipahiwatig ang pagpapatuloy ng siniping pananalita nang hindi gumagamit ng paulit-ulit na “na sinasabi.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinili ang natural na ayos ng pangungusap habang pinananatili ang mga ugnayang pampamilya, ang aspektong ipinahihiwatig ng participle, at ang bukas na pagpapatuloy tungo sa sipi sa susunod na talata.
