  yaml_path: translation/ot/genesis/027/038.yaml
  text: Esau said to his father[a], “Do you have only one blessing, my father? Bless me too, my father!” Then Esau raised his voice and wept.
translation:
  language: tl
  text: Sinabi ni Esau sa kanyang ama[a], “May isa lamang bang pagpapala para sa iyo, ama ko? Pagpalain mo rin ako, ama ko!” At itinaas ni Esau ang kanyang tinig at umiyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “Iisa ba ang pagpapala para sa iyo, ama ko?” Ipinahahayag ng Hebreo ang matinding hinagpis ni Esau, na tila iisa lamang ang pagpapalang maibibigay ni Isaac.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרָכָה אַחַת הִוא לְךָ
  choice: Iisa lamang ba ang pagpapalang maibibigay mo
  rationale: Ang Hebreo ay isang sugnay na walang hayag na pandiwa, literal na humigit-kumulang, ‘Ang pagpapala—iisa—ba ito sa iyo?’ Sa konteksto, retorikal itong tanong tungkol sa tila nag-iisang pagpapalang maipagkakaloob ni Isaac. Nililinaw ng ‘maibibigay mo’ ang ipinahihiwatig na diwa nang hindi binabago ang punto.
- source_word: אָבִי
  choice: ama ko
  rationale: Hayag sa hulaping unang panauhang isahan ang pagmamay-ari. Iningatan ang dalawang pag-uulit upang mapanatili ang marubdob na pagsusumamo ni Esau.
- source_word: בָּרֲכֵנִי
  choice: Pagpalain mo ako
  rationale: Tuwirang pautos ng ברך na may layong unang panauhang isahan; natural at tapat itong salin sa Tagalog.
- source_word: גַּם אָֽנִי
  choice: rin ako
  rationale: Ipinahahayag nito ang paghiling ni Esau na maisama rin siya sa tumanggap ng pagpapala. Ang ‘rin ako’ ay likas at may angkop na diin sa Tagalog.
- source_word: וַיִּשָּׂא ... קֹלוֹ וַיֵּבְךְּ
  choice: humagulgol
  rationale: Literal na ‘itinaas niya ang kanyang tinig at umiyak.’ Sa modernong Tagalog, pinagsasama ng ‘humagulgol’ ang malakas na tinig at matinding pag-iyak na ipinahahayag ng dalawang pandiwang Hebreo.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa mga saling Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na likas, marangal, at madaling maunawaan. Pinanatili ang pag-uulit ng ‘ama ko’ at ang matinding damdamin ng pananalita. Ginamit ang ‘humagulgol’ bilang masinsing katumbas ng idyomang ‘itinaas ang tinig at umiyak.’
