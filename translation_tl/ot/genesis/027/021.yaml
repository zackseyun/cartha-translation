base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/021.yaml
  text: Then Isaac said to Jacob[a], “Please come near, that I may feel you, my son, whether you are really my son Esau or not.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Isaac kay Jacob, “Lumapit ka nga upang makapa kita, anak ko, at malaman ko kung ikaw nga ang anak kong si Esau o hindi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּשָׁה נָּא
  choice: Lumapit ka nga
  rationale: Ang גְּשָׁה ay pautos na ‘lumapit,’ at ang נָּא ay nagpapalumanay sa pakiusap. Likas sa modernong Tagalog ang ‘ka nga’ bilang magalang o banayad na paghimok.
- source_word: וַאֲמֻשְׁךָ
  choice: upang makapa kita
  rationale: Ang pandiwang mula sa מושׁ ay tumutukoy sa paghipo o pagkapa. Sa konteksto, kakapain ni Isaac si Jacob upang siyasatin ang pagkakakilanlan niya; ipinahahayag ng ‘upang’ ang layunin ng paglapit.
- source_word: בְּנִי
  choice: anak ko
  rationale: Pinananatili ang tuwirang katawagan at ang ugnayang pampamilya na ipinahahayag ng hulaping unang panauhan.
- source_word: הַאַתָּה זֶה
  choice: kung ikaw nga
  rationale: Natural na inililipat sa Tagalog ang di-tuwirang tanong at ang pag-aalinlangan ni Isaac nang hindi labis na nilulutas ang diin ng Hebreo.
- source_word: בְּנִי עֵשָׂו
  choice: ang anak kong si Esau
  rationale: Likas na Tagalog na apposisyon ito at pinananatili kapwa ang ugnayang anak at ang tiyak na pangalang sinusuri.
- source_word: אִם לֹא
  choice: o hindi
  rationale: 'Tuwirang tinatapos nito ang tanong na may dalawang posibilidad: kung siya nga si Esau o hindi.'
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Ipinakikita nito ang pagsulong ng salaysay na tinutukoy ng waw-consecutive sa natural na paraan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “makapa” upang malinaw na ipahiwatig ang pagsusuri sa pamamagitan ng paghipo, at “ka nga” upang maipakita ang banayad na pakiusap ng נָא.
