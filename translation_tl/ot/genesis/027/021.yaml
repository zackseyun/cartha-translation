  revision_rationale: Pinanatili ang natural na Tagalog na pagpapahayag ng layunin at ang di-tuwirang tanong. Ang “malaman ko” ay nilinaw ang implicit na tagaganap para maging gramatikal ang Tagalog, habang ang pangungusap ay nananatiling mahigpit na nakaugnay sa layunin ng pandamang pagsubok. Inayos ang talababa upang maging tunay na alternatibong salin ng pandiwa sa halip na pagpapaliwanag ng konteksto.
