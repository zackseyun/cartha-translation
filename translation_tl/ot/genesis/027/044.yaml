  naturalness: Natural at malinaw sa makabagong Filipino ang “At manatili kang kasama niya nang ilang araw, hanggang sa humupa ang matinding galit ng kapatid mo.” Ang ayos at antas ng pananalita ay angkop sa salaysay.
