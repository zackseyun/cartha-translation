translation:
  language: tl
  text: At manatili kang kasama niya nang ilang araw, hanggang sa humupa[a] ang matinding galit ng kapatid mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bumalik” ang matinding galit; ginagamit dito ang pandiwa sa idyomatikong diwa ng paghupa nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: At manatili ka
  rationale: Ang יָשַׁב ay maaaring mangahulugang umupo, manirahan, o manatili. Dahil pansamantalang pagtira kay Laban ang ipinagagawa kay Jacob, likas at malinaw ang “manatili.”
- source_word: עִמּוֹ
  choice: kasama niya
  rationale: Tuwirang ipinahahayag ng עִם na may hulaping panghalip ang pakikisama o pananatiling kasama niya, na tumutukoy kay Laban.
- source_word: יָמִים אֲחָדִים
  choice: nang ilang araw
  rationale: Literal itong “mga araw, iilan.” Pinananatili ng “nang ilang araw” ang pansamantalang tagal na inaasahan ng nagsasalita, kahit mas matagal ang nangyari sa salaysay.
- source_word: עַד אֲשֶׁר
  choice: hanggang sa
  rationale: Karaniwang panandang temporal ito para sa hangganan ng ipinag-uutos na pananatili.
- source_word: תָּשׁוּב
  choice: humupa
  rationale: Pangunahing kahulugan ng שׁוב ang bumalik o tumalikod. Kapag matinding galit ang simuno, ipinahihiwatig nito na ang galit ay lilipas o hihina; natural itong ipinahahayag sa Tagalog bilang “humupa.”
- source_word: חֲמַת
  choice: matinding galit
  rationale: Ang חֵמָה ay naglalarawan ng nag-aalab at masidhing galit. Malinaw at kasalukuyang Tagalog ang “matinding galit,” nang hindi gumagamit ng labis na pormal na salita.
- source_word: אָחִיךָ
  choice: ng kapatid mo
  rationale: Ang anyong construct at hulaping ikalawang panauhan ay nangangahulugang “galit ng iyong kapatid,” na natural na “galit ng kapatid mo” sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapatid mo” sa halip na mas pormal na “iyong kapatid” upang maging natural sa karaniwang mambabasa, habang pinananatili ang tindi ng חֲמָה at ang pansamantalang diwa ng “ilang araw.”
