base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/041.yaml
  text: And Esau hated Jacob because of the blessing with which his father had blessed him[a], and Esau said in his heart, “The days of mourning for my father are drawing near[c][b]; then I will kill Jacob my brother.”
translation:
  language: tl
  text: At kinapootan ni Esau si Jacob dahil sa pagpapalang iginawad sa kanya ng kanyang ama.[a] Sinabi ni Esau sa kanyang puso,[b] “Nalalapit na ang mga araw ng pagluluksa para sa aking ama.[c] Pagkatapos, papatayin ko ang kapatid kong si Jacob.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang pagpapalang ipinagpala sa kanya ng kanyang ama.”
    reason: Pinananatili sa talababa ang pag-uulit ng salitang-ugat na “pagpala” sa Hebreo, na magiging mabigat kung lubos na tutularan sa pangunahing teksto.
  - marker: b
    text: Ang “sinabi sa kanyang puso” ay nangangahulugang nagsalita siya sa kanyang sarili o nagpasya sa kanyang kalooban.
    reason: Nililinaw ang idyomang Hebreo nang hindi ito inaalis sa pangunahing teksto.
  - marker: c
    text: Maaari ring isalin, “Nalalapit na ang mga araw ng pagluluksa ng aking ama.” Maaaring tumukoy ang Hebreo sa pagluluksa para kay Isaac pagkamatay niya, o sa sariling panahon ng pagdadalamhati ni Isaac.
    reason: Pinangangalagaan ang tunay na sintaktiko at semantikong kalabuan ng pariralang Hebreo.
lexical_decisions:
- source_word: וַיִּשְׂטֹם
  choice: kinapootan
  rationale: Ipinapahayag ng שׂטם ang matindi at nagpapatuloy na pagkapoot o pagkapoot na may pagkamapanira. Ang “kinapootan” ay dignidad, natural sa salaysay, at mas matindi kaysa simpleng pagkainis.
- source_word: עַל הַבְּרָכָה
  choice: dahil sa pagpapala
  rationale: Ang עַל ay nagsasaad dito ng sanhi; malinaw at natural ang “dahil sa.”
- source_word: אֲשֶׁר בֵּרֲכוֹ אָבִיו
  choice: iginawad sa kanya ng kanilang ama
  rationale: Ipinapakita nito na ang pagpapala ay ibinigay kay Jacob. Ginamit ang “kanilang ama” upang malinaw sa Tagalog na si Isaac ang ama kapuwa nina Esau at Jacob, bagaman literal na “kanyang ama” ang Hebreo.
- source_word: בְּלִבּוֹ
  choice: sa kanyang puso
  rationale: Pinananatili ang literal at madaling maunawaang idyomang Hebreo para sa panloob na pagsasalita o pagpapasya.
- source_word: יִקְרְבוּ יְמֵי אֵבֶל אָבִי
  choice: Nalalapit na ang mga araw ng pagluluksa para sa aking ama
  rationale: Natural itong pagbasa na tumutukoy sa pagluluksa pagkamatay ni Isaac, ngunit ang likas na kalabuan ng pariralang Hebreo ay inilalahad sa talababa.
- source_word: וְאַהַרְגָה
  choice: Pagkatapos, papatayin ko
  rationale: Ipinahihiwatig ng anyong cohortative ang matibay na pasya ni Esau. Nililinaw ng “Pagkatapos” ang inaasahang pagkakasunod ng mga pangyayari.
- source_word: אָחִי
  choice: ang kapatid kong si Jacob
  rationale: Pinananatili ang tahasang ugnayang magkapatid at inilalagay ito sa natural na ayos ng modernong Tagalog.
theological_decisions:
- issue: Kalabuan ng יְמֵי אֵבֶל אָבִי
  choice: “mga araw ng pagluluksa para sa aking ama” sa teksto, na may talababa tungkol sa ibang pagbasa
  alternative: “mga araw ng pagluluksa ng aking ama”
  rationale: Mas angkop sa konteksto ang pagluluksa para kay Isaac matapos siyang mamatay, ngunit maaari ring ipakahulugan ng kayariang Hebreo ang sariling panahon ng pagdadalamhati ni Isaac; hindi dapat ikubli ang kalabuang ito.
translation_notes:
  register: Modernong Filipino Tagalog na dignidad at madaling maunawaan. Ginamit ang “kinapootan” upang ipahayag ang matindi at nagtatagal na poot; iniwasan ang mas kolokyal na “nagtanim ng sama ng loob.” Ang mga panandang talababa [a], [b], at [c] ay nasa pangunahing teksto.
