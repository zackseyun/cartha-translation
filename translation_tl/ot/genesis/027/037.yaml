  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “panginoon” sa diwang taong may kapangyarihan, hindi bilang titulong banal. Inilagay ang mga tunay na leksikal na posibilidad sa mga talababa.
