base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/037.yaml
  text: Isaac answered and said to Esau[a], “Look, I have made him master over you, and I have given all his brothers to him as servants. I have sustained him with grain and new wine. What then can I do for you[c][b], my son?”
translation:
  language: tl
  text: Sumagot si Isaac kay Esau, “Tingnan mo, ginawa ko siyang panginoon mo, at ibinigay ko sa kanya ang lahat ng kanyang mga kapatid bilang mga lingkod.[a] Tinustusan ko siya ng butil at bagong alak.[b] Kaya ano pa ang magagawa ko para sa iyo, anak ko?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang mga alipin.” Ang salitang Hebreo ay maaaring tumukoy sa mga lingkod o mga alipin, depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “Inalalayan ko siya sa pamamagitan ng butil at bagong alak.” Ang pandiwang Hebreo ay maaaring magbigay-diin sa pag-alalay o paglalaan ng ikabubuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Karaniwang panandang pasalaysay sa tugon sa isang pag-uusap; natural at tuwiran sa Filipino.
- source_word: הֵן
  choice: Tingnan mo
  rationale: Pinananatili ang mapagdiing puwersa ng interjection nang hindi gumagamit ng makalumang pananalita.
- source_word: גְּבִיר
  choice: panginoon
  rationale: Tumutukoy sa taong may kapangyarihan o pamamahala sa iba; sa kontekstong ito, hindi ito titulong pantukoy sa Diyos.
- source_word: שַׂמְתִּיו לָךְ
  choice: ginawa ko siyang panginoon mo
  rationale: Ipinahahayag ng konstruksiyon ang pagtatalaga sa isang katayuang nakahihigit kay Esau.
- source_word: כָּל אֶחָיו
  choice: lahat ng kanyang mga kapatid
  rationale: Pinananatili ang tuwirang katawagang pampamilya sa Hebreo.
- source_word: לַעֲבָדִים
  choice: bilang mga lingkod
  rationale: Ipinapakita ang pagpapasakop nang hindi labis na tinutukoy ang eksaktong legal o panlipunang kalagayan; maaari ring mangahulugang mga alipin.
- source_word: דָגָן
  choice: trigo
  rationale: Sa natural na Filipino, ang trigo ay madaling maunawaang pangunahing butil na ani, bagaman mas malawak ang Hebreong salita at maaaring tumukoy sa butil sa pangkalahatan.
- source_word: תִּירֹשׁ
  choice: bagong alak
  rationale: Pinananatili ang agrikultural na diwa ng sariwa o bagong alak, sa halip na alak lamang.
- source_word: סְמַכְתִּיו
  choice: Tinustusan ko siya
  rationale: Sa konteksto ng trigo at bagong alak, likas nitong ipinahahayag ang paglalaan ng ikabubuhay; nananatili sa talababa ang diwang ‘inalalayan.’
- source_word: וּלְכָה אֵפוֹא מָה אֶעֱשֶׂה
  choice: Kaya ano pa ang magagawa ko para sa iyo
  rationale: Natural na retorikal na tanong sa Filipino na naghahayag ng naging bunga at praktikal na kawalan ng maibibigay pa.
- source_word: בְּנִי
  choice: anak ko
  rationale: Tuwiran at magiliw na katawagang pampamilya.
theological_decisions: []
