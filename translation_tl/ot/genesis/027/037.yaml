  source_fidelity: 'Maingat na sinusundan ng salin ang Hebreo: si Jacob ay itinalagang nakatataas kay Esau, ang kanyang mga kapatid ay ibinigay bilang mga lingkod, at siya ay sinuportahan sa pamamagitan ng ani at bagong alak. Gayunman, ang דָּגָן ay pangkalahatang “butil/grain,” hindi partikular na “trigo.”'
  naturalness: Natural at malinaw ang modernong Filipino. Ang “Tingnan mo” ay angkop na katumbas ng mapagdiing הֵן, at ang retorikal na “Kaya ano pa ang magagawa ko para sa iyo” ay maayos sa konteksto.
  terminology: Ang “panginoon” ay katanggap-tanggap dito bilang pantao at pampamilyang katayuan ng paghahari; ang “mga lingkod” ay maingat na salin ng עֲבָדִים, na may leksikal na alternatibo sa talababa. Kailangang palitan ang “trigo” ng “butil” upang hindi paliitin ang kahulugan ng דָּגָן.
