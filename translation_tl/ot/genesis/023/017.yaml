translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pormal at legal na pag-iisa-isa ng bukid, yungib, mga puno, at hangganan. Inilagay ang talababa sa “pinagtibay,” ang salitang aktuwal na tinutukoy nito.
