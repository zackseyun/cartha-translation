revisions:
- from: Kaya ang bukid ni Efron sa Macpela, na nasa tapat ng Mamre—ang bukid, ang yungib na naroon, at ang bawat punongkahoy sa loob ng buong hangganan ng bukid sa palibot—ay pinagtibay[a]
  to: Ang bukid ni Efron sa Macpela, na nasa tapat ng Mamre—ang bukid, ang yungib na nasa loob nito, at lahat ng punongkahoy na nasa bukid, sa loob ng buong saklaw ng hangganan nito sa palibot—ay pinagtibay[a]
  rationale: Inalis ang hindi kinakailangang pang-ugnay na sanhi-bunga, nilinaw ang lokasyon ng yungib, at inayos ang paglalarawan ng buong nakapaligid na hangganan upang maging mas natural sa modernong Filipino habang pinananatili ang pormal na estilo at legal na pag-iisa-isa ng Hebreo. Ang talababa ay pinanatiling maingat tungkol sa saklaw ng legal na kahulugan.
