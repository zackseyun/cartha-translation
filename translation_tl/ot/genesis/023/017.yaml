base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/017.yaml
  text: So Ephron’s field at Machpelah[a], which was before Mamre—the field, the cave that was in it, and every tree in the field, within all its surrounding border—was confirmed
translation:
  language: tl
  text: Ang bukid ni Efron sa Macpela, na nasa tapat ng Mamre—ang bukid, ang yungib na nasa loob nito, at lahat ng punongkahoy na nasa bukid, sa loob ng buong saklaw ng hangganan nito sa palibot—ay pinagtibay[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “itinatag” o “naipasa.” Sa konteksto ng bilihan, malamang na legal ang diwa ng pandiwang Hebreo: ang ari-arian ay pormal na pinagtibay sa transaksiyon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: ay pinagtibay
  rationale: 'Sa konteksto ng bilihan, ang pandiwang קום ay may legal na diwa: ang ari-arian at ang paglilipat nito ay naging opisyal at may bisa. Ang “pinagtibay” ay natural sa makabagong Filipino at hindi nililimitahan ang kahulugan sa pisikal na “tumayo.”'
- source_word: שְׂדֵה עֶפְרוֹן
  choice: ang bukid ni Efron
  rationale: Likas na Filipino para sa Hebreong construct chain na nagpapahayag ng pag-aari o pagkakaugnay.
- source_word: בַּמַּכְפֵּלָה
  choice: sa Macpela
  rationale: Tinumbasan bilang pangalan ng lugar; ang “sa” ay likas at sapat para sa lokasyon.
- source_word: לִפְנֵי מַמְרֵא
  choice: nasa tapat ng Mamre
  rationale: Pinananatili ang pangunahing spatial na diwa ng לִפְנֵי, “sa harap/tapat ng,” nang hindi nagpapasya sa tiyak na direksiyon.
- source_word: הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: ang bukid, ang yungib na naroon
  rationale: Pinananatili ang pormal na pag-iisa-isa ng mga bahagi ng ari-arian at ang bahagyang appositional na ayos ng Hebreo.
- source_word: וְכָל הָעֵץ אֲשֶׁר בַּשָּׂדֶה
  choice: at ang bawat punongkahoy
  rationale: Ang כָל na kasama ng pangngalang isahan ay distributive; malinaw na ipinahihiwatig ng “bawat punongkahoy” na kasama ang lahat ng puno sa transaksiyon.
- source_word: אֲשֶׁר בְּכָל גְּבֻלוֹ סָבִיב
  choice: sa loob ng buong hangganan ng bukid sa palibot
  rationale: Ipinahahayag ang kabuuang saklaw sa loob ng paikot na hangganan ng ari-arian, habang nililinaw sa Filipino na ang tinutukoy na hangganan ay sa bukid.
