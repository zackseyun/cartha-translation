translation_notes:
  register: Makabago at marangal na Tagalog. Inuna ang “mula sa mga anak ni Het” upang maging malinaw at natural ang pinagmulan ng legal na paglipat, habang pinananatili ang pagkakasama ng bukid at yungib bilang iisang ari-arian.
