  text: So the field and the cave that was in it were deeded to Abraham as a burial property from the sons of Heth[a][b][c].
translation:
  language: tl
  text: Kaya ang bukid at ang yungib na nasa loob nito ay pormal na naging pag-aari ni Abraham bilang pag-aaring libingan mula sa mga anak ni Het[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Heteo” sa halip na “mga anak ni Het.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “ay pinagtibay para kay Abraham bilang pag-aaring libingan.” Sa kontekstong ito, ang pandiwang Hebreo ay tumutukoy sa legal na pagkilala sa paglipat ng pagmamay-ari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: pormal na naging pag-aari
  rationale: Sa konteksto ng legal na pagbili, ipinahihiwatig ng קום na ang ari-arian ay kinilala at pinagtibay bilang pag-aari ni Abraham. Ang “pormal na naging pag-aari” ay natural sa modernong Tagalog at pinananatili ang legal na diwa nang hindi nagdaragdag ng hiwalay na pandiwang wala sa Hebreo.
- source_word: הַשָּׂדֶה
  choice: ang bukid
  rationale: Karaniwan at tuwirang katumbas ng שׂדה para sa lupang binili.
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: at ang yungib na nasa loob nito
  rationale: Pinananatili ang sugnay na nag-uugnay sa yungib sa bukid; ang “nito” ay tumutukoy sa bukid.
- source_word: לְאַבְרָהָם
  choice: ni Abraham
  rationale: Sa pariralang “naging pag-aari ni Abraham,” likas na ipinapahayag ng “ni” ang bagong kinilalang may-ari.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: bilang libingan
  rationale: Ipinahahayag ang layunin ng legal na pag-aari. Nasa naunang parirala na ang diwa ng pagmamay-ari, kaya iniiwasan ang mabigat at paulit-ulit na “bilang pag-aaring libingan.”
- source_word: מֵאֵת
  choice: mula sa
  rationale: Tuwirang minamarkahan ang pinagmulan ng ari-ariang inilipat sa transaksiyon.
- source_word: בְּנֵי חֵת
  choice: mga anak ni Het
  rationale: Pormal na pinananatili ang literal na anyo ng Hebreong katawagan; ibinibigay sa talababa ang kontekstuwal na katumbas na etniko.
