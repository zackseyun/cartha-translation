translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang panlipunang pagkakaiba ng “dayuhan” at “nakikipamayan,” gayundin ang legal na diwa ng pag-aari sa lupa. Ang mga panandang talababa [a] at [b] ay kapuwa nasa pangunahing teksto at tumutugma sa mga tala.
