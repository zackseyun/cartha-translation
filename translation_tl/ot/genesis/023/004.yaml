base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/004.yaml
  text: I am a foreigner and a sojourner among you[a]. Give me a burial site among you[b], so that I may bury my dead out of my sight.
translation:
  language: tl
  text: “Ako’y isang dayuhan at naninirahan sa piling ninyo. Bigyan ninyo ako ng isang lupang magiging pag-aari ko para sa paglilibingan[a] sa piling ninyo, upang mailibing ko ang aking yumao at maalis siya sa aking harapan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang lugar na paglilibingan.” Ang pariralang Hebreo ay nagpapahiwatig ng lupang magiging pag-aari, hindi lamang ng dakong paghuhukayan ng libingan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa harapan ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: dayuhan
  rationale: Tumutukoy ito sa taong naninirahan sa labas ng sariling lupain at angkan at walang ganap na katayuang katutubo; natural at malinaw sa makabagong Filipino ang “dayuhan.”
- source_word: וְתוֹשָׁב
  choice: nakikipamayan
  rationale: Idiniriin ng salita ang paninirahan sa isang pamayanan nang walang ganap na pagmamay-ari o katutubong katayuan. Pinananatili ng “nakikipamayan” ang pagkakaiba nito sa “dayuhan” nang hindi nagiging teknikal.
- source_word: עִמָּכֶם
  choice: sa piling ninyo / sa gitna ninyo
  rationale: Ang literal na “kasama ninyo” ay may panlipunan at pampamayanang diwa rito. Ginamit ang dalawang likas na ekspresyon sa Filipino upang maiwasan ang mabigat na pag-uulit.
- source_word: תְּנוּ לִי
  choice: Bigyan ninyo ako
  rationale: Tuwiran at natural na salin ng pautos na anyo ng נתן.
- source_word: אֲחֻזַּת קֶבֶר
  choice: lupaing pag-aari para sa libingan
  rationale: Ipinahihiwatig ng אֲחֻזָּה ang isang legal na pag-aari o lupang hawak, hindi lamang isang lugar na paghuhukayan ng libingan; mahalaga ang diwang ito sa kabuuan ng kabanata.
- source_word: וְאֶקְבְּרָה
  choice: upang mailibing ko
  rationale: Ang cohortative kasunod ng kahilingan ay nagpapahayag ng layunin; natural itong naipahahayag ng “upang.”
- source_word: מֵתִי
  choice: aking yumao
  rationale: Ang Hebreo ay literal na “aking patay” at tumutukoy sa namatay na kaanak. Ang “aking yumao” ay marangal at natural, at hindi tahasang idinaragdag ang pangalan ni Sara.
- source_word: מִלְּפָנַי
  choice: hindi ko na siya makita
  rationale: Ang literal na larawan ay “mula sa harapan ko.” Sa konteksto, ang paglilibing ang mag-aalis sa bangkay mula sa paningin ni Abraham; malinaw at natural ang saling ito.
