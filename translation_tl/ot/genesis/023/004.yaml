  source_fidelity: Tumpak sa kabuuan ang kahilingan ni Abraham, ang katayuan niyang dayuhan at residente, ang paghingi ng pag-aaring paglilibingan, at ang layuning mailibing ang kaniyang namatay. Gayunman, ang “nakikipamayan” ay hindi sapat na katumbas ng תוֹשָׁב, at ang hulíng sugnay ay mas maipapahayag nang malapit sa larawan ng pag-aalis ng yumao mula sa kaniyang harapan.
  naturalness: Ang “nakikipamayan” ay karaniwang tumutukoy sa pakikisalamuha o pakikibahagi sa pamayanan, hindi sa katayuang naninirahan. Ang “dayuhan at naninirahan sa piling ninyo” ay mas likas at malinaw. Inayos din ang parirala para sa pag-aari at ang puwesto ng talababa.
  terminology: Pinananatili ang “dayuhan,” ang diwa ng paninirahang walang ganap na katutubong pag-aari, at ang legal na diin ng אֲחֻזַּת sa pamamagitan ng “lupang magiging pag-aari ko.” Ang “aking yumao” ay nananatiling magalang na pananalita at hindi idinaragdag ang pangalan ni Sara.
  issues:
  - severity: medium
    issue: Ang “nakikipamayan” ay hindi tumpak na salin ng וְתוֹשָׁב.
    rationale: Mas tumutukoy ito sa pakikisalamuha o pakikibahagi sa pamayanan kaysa sa pagiging residenteng naninirahan sa isang lugar. Kailangan ang salitang nagsasaad ng paninirahan.
  - severity: low
    issue: Hindi pinakamalinaw ang “at hindi ko na siya makita” para sa מִלְּפָנַי.
    rationale: Nauunawaan ang kahulugan, ngunit ang Hebreo ay larawan ng pag-aalis ng yumao “mula sa harapan” ni Abraham. Ang rebisyon ay pinananatili ang larawang ito nang natural sa Filipino.
  - severity: low
    issue: Ang panandang [a] ay nakalagay pagkatapos ng “ninyo” sa halip na malapit sa pariralang tumutukoy sa pag-aaring paglilibingan.
    rationale: Inilipat ang pananda upang malinaw na ang tala ay tungkol sa “lupang magiging pag-aari ko para sa paglilibingan.”
