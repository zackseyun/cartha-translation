  source_fidelity: 'Tapat ang pangunahing salin sa Hebreo: ang maramihang magalang na panawagan, ang magalang na pagtawag na אֲדֹנִי, ang bukas na kahulugan ng נְשִׂיא אֱלֹהִים, ang alok ng pinakamainam na libingan, at ang pangwakas na diwang walang sinumang pipigil sa paglilibing. Ang “upang hadlangan” ay isang ligtas at natural na pagpapahayag ng puwersang pampigil ng מִן + pawatas.'
  naturalness: Marangal at likas ang pangunahing teksto sa modernong Filipino. Gayunman, ang kasalukuyang talababa b ay may di-natural at nakalilitong pariralang “mula sa paglilibing,” kahit tinatawag itong mas literal. Mas mabuting ipaliwanag ang sintaksis nang hindi nagmumungkahi na ito ay isang angkop na literal na salin sa Filipino.
  terminology: Ang “panginoon ko,” “pinuno ng Diyos,” at “yumao” ay angkop sa magalang na rehistro. Ang alternatibong “napakadakilang pinuno” ay mas malakas kaysa sa idyomatikong posibleng “makapangyarihang pinuno”; ang huli ay mas malapit sa alternatibong kahulugang sinasalamin ng audit trail.
