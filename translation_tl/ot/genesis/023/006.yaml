    rationale: Ang “magkakait ... mula sa paglilibing” ay hindi malinaw na Filipino at maaaring magmukhang maling relasyon ng mga parirala. Maipapaliwanag ang Hebreong konstruksiyon bilang pagpigil nang walang ganitong hindi likas na literalismo.
  - severity: low
