  text: שְׁמָעֵ֣/נוּ אֲדֹנִ֗/י נְשִׂ֨יא אֱלֹהִ֤ים אַתָּה֙ בְּ/תוֹכֵ֔/נוּ בְּ/מִבְחַ֣ר קְבָרֵ֔י/נוּ קְבֹ֖ר אֶת מֵתֶ֑/ךָ אִ֣ישׁ מִמֶּ֔/נּוּ אֶת קִבְר֛/וֹ לֹֽא יִכְלֶ֥ה מִמְּ/ךָ֖ מִ/קְּבֹ֥ר מֵתֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/006.yaml
  text: 'Hear us[a], my lord: you are a prince of God among us. Bury your dead in the choicest of our tombs. None of us will withhold his tomb from you[b], from burying your dead.'
translation:
  language: tl
  text: “Pakinggan ninyo kami, panginoon ko. Isa kayong pinuno ng Diyos sa gitna namin.[a] Ilibing ninyo ang inyong yumao sa pinakamainam sa aming mga libingan. Walang sinuman sa amin ang magkakait sa inyo ng kanyang libingan upang hadlangan kayong ilibing ang inyong yumao.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang makapangyarihang pinuno sa gitna namin.” Maaaring gamitin ang pariralang Hebreo na “pinuno ng Diyos” bilang pasukdol.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong parirala sa hulihan ay literal na gumagamit ng “mula sa” bago ang “paglilibing ng inyong yumao”; ipinahihiwatig nito na walang magkakait ng kanyang libingan upang pigilan kayo sa paglilibing ng inyong yumao.
    reason: source_syntax
lexical_decisions:
- source_word: שְׁמָעֵנוּ
  choice: Pakinggan ninyo kami
  rationale: Tuwirang pakiusap na tapat sa pautos na anyo. Ang “ninyo” ay magalang na pagtukoy sa iisang kausap sa modernong Filipino.
- source_word: אֲדֹנִי
  choice: panginoon ko
  rationale: Pinananatili ang magalang at mapagpakumbabang pagtawag kay Abraham, nang hindi ito ginagawang pangalan o banal na titulo.
- source_word: נְשִׂיא אֱלֹהִים
  choice: pinuno ng Diyos
  rationale: Pinananatili ang pormal na konstruktong Hebreo at ang maaaring kahulugang may natatanging kaugnayan sa Diyos; inilalagay sa talababa ang posibleng idyomatikong pasukdol.
- source_word: בְּתוֹכֵנוּ
  choice: sa gitna namin
  rationale: Likas na Filipino na nagpapahayag ng kalagayan ni Abraham sa kanilang pamayanan.
- source_word: בְּמִבְחַר קְבָרֵינוּ
  choice: sa pinakamainam sa aming mga libingan
  rationale: Ipinahahayag ang מבחר bilang pinakamahusay o pinakapiling bahagi ng kanilang mga libingan, alinsunod sa magalang na alok.
- source_word: קְבֹר אֶת־מֵתֶךָ
  choice: Ilibing ninyo ang inyong yumao
  rationale: Ang “yumao” ay natural, dignified, at tumutukoy sa namatay na mahal sa buhay nang hindi nawawala ang tuwirang diwa.
- source_word: אִישׁ מִמֶּנּוּ
  choice: Walang sinuman sa amin
  rationale: 'Tamang ipinapahayag ang diwa ng negated distributive construction: ni isa sa kanila ay hindi gagawa nito.'
- source_word: אֶת־קִבְרוֹ
  choice: kanyang libingan
  rationale: Pinananatili ang isahang panghalip na ginagamit nang distributibo para sa libingan ng bawat isa.
- source_word: לֹא יִכְלֶה מִמְּךָ
  choice: magkakait sa inyo
  rationale: Sa kontekstong ito, ang pandiwa ay nangangahulugang magpigil o magkait ng paggamit ng libingan.
- source_word: מִקְּבֹר מֵתֶךָ
  choice: upang hadlangan kayong ilibing ang inyong yumao
  rationale: Ginagawang malinaw sa natural na Filipino ang puwersa ng מן kasunod ng pawatas bilang pagkilos na hinahadlangan, habang itinatala sa talababa ang mas pormal na anyo.
theological_decisions:
- issue: Kahulugan ng נְשִׂיא אֱלֹהִים
  choice: pinuno ng Diyos
  alternative: napakadakilang pinuno
  rationale: Hindi tiyak kung ang אֱלֹהִים ay tuwirang tumutukoy sa Diyos o gumaganap bilang idyomatikong pasukdol. Pinananatili ng pangunahing teksto ang pormal at teolohikal na bukas na anyo, at inilalahad sa talababa ang idyomatikong posibilidad.
translation_notes:
  register: Modernong Filipino na magalang at marangal. Ginamit ang “ninyo/inyo” bilang magalang na pagtukoy sa iisang kausap at ang “panginoon ko” upang mapanatili ang antas ng paggalang sa sinaunang pakikipag-usap. Iniwasan ang labis na arkaikong bokabularyo; ang mga talababa ay nagpapanatili ng tunay na leksikal at sintaktikong kalabuan.
