lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: Sumagot
  rationale: Ang Qal wayyiqtol ng ענה ay tugon sa naunang sinabi ni Abraham; natural at tumpak dito ang “Sumagot.”
- source_word: בְנֵי חֵת
  choice: ang mga anak ni Het
  rationale: Pinananatili nito ang literal na ekspresyong Hebreo na tumutukoy sa pangkat ayon sa kanilang ninuno; maaaring ipakahulugan sa konteksto bilang mga Heteo.
- source_word: אֶת אַבְרָהָם
  choice: kay Abraham
  rationale: Minamarkahan ng אֶת si Abraham bilang layon ng pandiwa; sa Filipino, natural na ipinahahayag ang taong sinasagot sa pamamagitan ng “kay.”
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang istrukturang Hebreo na gumagamit ng infinitive construct upang ipakilala ang tuwirang pananalita sa kasunod na talata.
- source_word: לוֹ
  choice: sa kanya
  rationale: Tahasang isinasalin ang pang-ukol ל na may panlaping ikatlong panauhang panlalaki upang tukuyin si Abraham bilang kausap.
