  text: וְ/עֶפְר֥וֹן יֹשֵׁ֖ב בְּ/ת֣וֹךְ בְּנֵי חֵ֑ת וַ/יַּעַן֩ עֶפְר֨וֹן הַ/חִתִּ֤י אֶת אַבְרָהָם֙ בְּ/אָזְנֵ֣י בְנֵי חֵ֔ת לְ/כֹ֛ל בָּאֵ֥י שַֽׁעַר עִיר֖/וֹ לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/010.yaml
  text: Ephron was sitting among the sons of Heth[a], and Ephron the Hittite answered Abraham in the hearing of the sons of Heth, before all who entered the gate of his city, saying[b],
translation:
  language: tl
  text: Nakaupo si Efron kasama ng mga anak ni Het[a], at sumagot si Efron na Heteo kay Abraham sa pandinig ng mga anak ni Het, sa harap ng lahat ng pumapasok sa pintuang-bayan ng kanyang lungsod[b], na nagsasabi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Heteo” sa dalawang paglitaw ng pariralang ito; mas literal sa Hebreo ang “mga anak ni Het.”
    reason: lexical_alternative
  - marker: b
    text: Ang pintuang-bayan ng lungsod ang pampublikong lugar kung saan isinasagawa ang mga usaping legal at pangkalakalan sa harap ng mga saksi.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב
  choice: Nakaupo
  rationale: Ang participle ay naglalarawan sa kasalukuyang kalagayan o puwesto ni Efron sa tagpo, hindi lamang sa isang natapos na kilos.
- source_word: בְּתוֹךְ
  choice: sa gitna ng
  rationale: Likas itong nagsasaad na naroon si Efron sa loob ng nagkakatipong pangkat.
- source_word: בְּנֵי חֵת
  choice: mga anak ni Het
  rationale: Pinananatili ang literal na anyo ng Hebreo at naihihiwalay ito sa tahasang katawagang etniko na “Heteo” sa kasunod na parirala.
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Karaniwan at tuwirang salin ng pandiwa sa konteksto ng pag-uusap.
- source_word: הַחִתִּי
  choice: na Heteo
  rationale: Ipinakikilala nito ang etnikong pagkakakilanlan ni Efron sa natural na ayos ng modernong Tagalog.
- source_word: בְּאָזְנֵי
  choice: sa pandinig ng
  rationale: Pinananatili ang idyomang nagsasaad na hayagang sinabi ang tugon sa harap at abot-pandinig ng mga saksi.
- source_word: לְכֹל בָּאֵי שַׁעַר עִירוֹ
  choice: at ng lahat ng pumapasok sa pintuang-bayan ng kanyang lungsod
  rationale: Ipinahahayag nito ang saklaw ng mga pampublikong saksi habang pinananatili ang larawan ng pagpasok sa pintuang-bayan.
- source_word: שַׁעַר עִירוֹ
  choice: pintuang-bayan ng kanyang lungsod
  rationale: Ang “pintuang-bayan” ay malinaw na tumutukoy sa pasukan ng lungsod at nakatutulong ipahiwatig ang kinikilalang pook ng pampublikong gawain.
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Natural na pambungad ito sa tuwirang pananalitang nagpapatuloy sa kasunod na talata.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang literal na “mga anak ni Het” sa pangunahing teksto, habang ipinaliwanag sa talababa ang mas karaniwang katawagang “mga Heteo.” Ginamit ang “pintuang-bayan” upang maiwasang mapagkamalan ang karaniwang pinto lamang at upang maging malinaw ang pampublikong tagpuan.
