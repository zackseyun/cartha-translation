base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/016.yaml
  text: 'So Abraham listened to Ephron[a], and Abraham weighed out for Ephron the silver that he had spoken in the hearing of the sons of Heth: four hundred shekels of silver[b], current with the merchant.'
translation:
  language: tl
  text: 'Kaya pinakinggan ni Abraham si Efron, at tinimbang niya para kay Efron ang pilak na binanggit ni Efron sa pandinig ng mga anak ni Het[a]: apat na raang siklong pilak, ayon sa pamantayang ginagamit ng mga mangangalakal.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Heteo”; literal na “mga anak ni Het.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tinatanggap ng mangangalakal” o “ayon sa pamantayang timbang ng mangangalakal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אַבְרָהָם אֶל עֶפְרוֹן
  choice: pinakinggan ni Abraham si Efron
  rationale: Ang idyomang שׁמע אל ay nangangahulugang makinig o tumalima. Pinananatili ng “pinakinggan” ang pahiwatig na tinanggap ni Abraham ang sinabi ni Efron nang hindi tahasang dinaragdagan ang teksto ng “sumang-ayon.”
- source_word: וַיִּשְׁקֹל
  choice: tinimbang niya
  rationale: Tumutukoy ang שקל sa literal na pagtimbang ng pilak bilang bayad bago umiral ang mga baryang may takdang halaga.
- source_word: הַכֶּסֶף
  choice: ang pilak
  rationale: Pinananatili nito ang materyal at makasaysayang anyo ng kabayaran, sa halip na gawing pangkalahatang “salapi.”
- source_word: אֲשֶׁר דִּבֶּר
  choice: na binanggit nito
  rationale: Literal itong may diwang “na sinabi niya,” ngunit sa usapang bentahan ay tumutukoy sa halagang sinabi ni Efron. Ang “binanggit” ay natural at hindi labis na nagpapakahulugan.
- source_word: בְּאָזְנֵי
  choice: sa pandinig ng
  rationale: Malapit ito sa literal na “sa mga tainga ng” at pinananatili ang pampubliko at nasaksihang katangian ng transaksiyon.
- source_word: בְנֵי חֵת
  choice: mga anak ni Het
  rationale: Pinananatili ang literal at genealogical na anyo ng Hebreo; ibinibigay sa talababa ang karaniwang katawagang etniko.
- source_word: אַרְבַּע מֵאוֹת שֶׁקֶל כֶּסֶף
  choice: apatn daang siklong pilak
  rationale: Direktang inilalahad ang bilang, sinaunang yunit ng timbang, at materyal na pilak.
- source_word: עֹבֵר לַסֹּחֵר
  choice: ayon sa pamantayang ginagamit ng mga mangangalakal
  rationale: Ang mahirap na idyomang pangkalakalan ay malamang na tumutukoy sa pilak na tanggap o may pamantayang timbang sa kalakalan. Ang salin ay malinaw ngunit ang tunay na kalabuan ay iniingatan sa talababa.
