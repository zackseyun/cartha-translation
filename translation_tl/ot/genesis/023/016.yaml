revisions:
- from: 'Kaya pinakinggan ni Abraham si Efron, at tinimbang niya para kay Efron ang pilak na binanggit nito sa pandinig ng mga anak ni Het[a]: apatn daang siklong pilak, ayon sa pamantayang ginagamit ng mga mangangalakal.[b]'
  to: 'Kaya pinakinggan ni Abraham si Efron, at tinimbang niya para kay Efron ang pilak na binanggit ni Efron sa pandinig ng mga anak ni Het[a]: apat na raang siklong pilak, ayon sa pamantayang ginagamit ng mga mangangalakal.[b]'
