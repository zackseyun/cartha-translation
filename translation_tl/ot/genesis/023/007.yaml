  text: Then Abraham rose and bowed down to the people of the land[a], to the sons of Heth.
translation:
  language: tl
  text: Tumindig si Abraham at yumukod sa mga mamamayan ng lupain, sa mga anak ni Het.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa mga Heteo.” Sa Hebreo: “sa mga anak ni Het.”'
