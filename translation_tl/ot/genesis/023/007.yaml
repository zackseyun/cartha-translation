lexical_decisions:
- source_word: וַיָּקָם
  choice: Pagkatapos ay tumayo si Abraham
  rationale: Ang Qal wayyiqtol ng קום ay nagsasaad ng pagtayo o pagbangon; ang “Pagkatapos” ay likas na nagpapahayag ng sunod-sunod na kilos sa salaysay.
- source_word: וַיִּשְׁתַּחוּ
  choice: yumukod
  rationale: Ipinahahayag ng anyo ng שׁחה ang mababang pagyukod bilang kilos ng paggalang, nang hindi ipinapalagay na lubos siyang nagpatirapa.
- source_word: לְעַם הָאָרֶץ
  choice: sa mga tao ng lupain
  rationale: Ang לְ ay tumutukoy sa pinag-ukulan ng pagyukod, at pinananatili ng “mga tao ng lupain” ang konkretong anyo ng pariralang Hebreo.
- source_word: לִבְנֵי חֵת
  choice: sa mga anak ni Het
  rationale: Pinananatili ang literal at angkaning katawagang “mga anak ni Het,” pati ang inulit na pang-ukol sa Hebreo; maituturing din silang mga Heteo ayon sa konteksto.
- source_word: חֵת
  choice: Het
  rationale: Karaniwang anyong Tagalog ng pangalang pantanging Hebreo na חֵת.
