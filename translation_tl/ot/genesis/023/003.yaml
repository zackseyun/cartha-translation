base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/003.yaml
  text: Then Abraham rose from before his dead wife and spoke to the sons of Heth[a], saying,
translation:
  language: tl
  text: Pagkatapos, tumayo si Abraham mula sa tabi ng namatay niyang asawa at nagsalita sa mga anak ni Het[a]. Sinabi niya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Heteo”; sa Hebreo, “mga anak ni Het.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Pagkatapos, tumayo
  rationale: Ang wayyiqtol ng קום ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos, tumayo” at malinaw nitong inilalarawan ang pagkilos ni Abraham.
- source_word: מֵעַל פְּנֵי
  choice: mula sa tabi
  rationale: Bagaman mas literal na tumutukoy sa paglayo mula sa harapan o presensiya, sa kontekstong ito ay likas na ipinahihiwatig na lumayo si Abraham mula sa kinaroroonan ng bangkay. Ang “mula sa tabi” ay malinaw at hindi labis na nagpapakahulugan.
- source_word: מֵתוֹ
  choice: namatay niyang asawa
  rationale: Literal itong “kaniyang patay,” ngunit si Sara ang malinaw na tinutukoy sa konteksto. Kailangan sa natural na Tagalog ang tahasang pangngalang “asawa,” habang pinananatili ng “namatay” ang payak at matinding pananalita ng Hebreo.
- source_word: וַיְדַבֵּר אֶל
  choice: nagsalita sa
  rationale: Tuwirang inilalarawan nito ang pagsasalita ni Abraham sa mga taong kausap niya at pinananatiling hiwalay ang pandiwang ito sa kasunod na לֵאמֹר.
- source_word: בְּנֵי חֵת
  choice: mga anak ni Het
  rationale: Pinananatili nito ang literal na anyong Hebreo na “mga anak ni Het.” Inilalagay sa talababa ang karaniwang katawagang etniko.
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Ipinakikilala nito nang natural sa Tagalog ang mismong sasabihin sa susunod na talata, habang pinananatili ang pormal na tungkulin ng infinitive sa Hebreo.
