  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Ang paghahati bago sa “Sinabi niya,” ay umiiwas sa di-likas na “na sinasabi” at pinananatili ang paghahanda para sa tuwirang pananalita sa susunod na talata.
