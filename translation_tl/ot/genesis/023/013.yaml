base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/013.yaml
  text: 'And he spoke to Ephron in the hearing of the people of the land[a], saying, “If only you would hear me: I give the silver for the field; take it from me[b], so that I may bury my dead there.”'
translation:
  language: tl
  text: 'At nagsalita siya kay Efron, na naririnig ng mga tao sa lupain, at sinabi: “Kung makikinig ka lamang sa akin: ibinibigay ko ang pilak para sa bukid; tanggapin mo ito mula sa akin[a], upang mailibing ko roon ang aking patay.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ibinigay ko ang pilak para sa bukid; kunin mo mula sa akin.” Ang anyong naganap na “ibinigay ko” ay malamang na nagsasaad dito ng isang pormal na alok; maaari rin itong unawaing “ibibigay ko ang pilak para sa bukid.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita siya
  rationale: Pinananatili ang pormal na himig ng דבר at ang pagpapatuloy ng salaysay.
- source_word: בְּאָזְנֵי עַם הָאָרֶץ
  choice: sa pandinig ng mga tao sa lupain
  rationale: Natural na inilalarawan ang hayagang pagsasalita sa harap ng lokal na pamayanan habang pinananatili ang pormal at panlipunang-legal na tagpo.
- source_word: אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי
  choice: Kung makikinig ka lamang sa akin
  rationale: Ipinahahayag ang magalang at mariing pakiusap ng eliptikong pariralang Hebreo sa natural na Tagalog.
- source_word: נָתַתִּי
  choice: ibinibigay ko
  rationale: Bagaman perfect ang anyong Hebreo, malamang na performatibo ito rito—isang pormal na alok sa kasalukuyang pakikipagtawaran—kaya natural ang pangkasalukuyang anyo sa Tagalog.
- source_word: כֶּסֶף הַשָּׂדֶה
  choice: ang pilak para sa bukid
  rationale: Pinananatili ng “pilak” ang kongkretong katawagan sa Hebreo, sa halip na gawing mas interpretibong “bayad” o “halaga.”
- source_word: קַח מִמֶּנִּי
  choice: tanggapin mo ito mula sa akin
  rationale: Sa konteksto ng pormal na transaksiyon, natural sa Tagalog ang “tanggapin”; ang “ito” ay tumutukoy sa pilak na ipinahihiwatig ng Hebreo.
- source_word: וְאֶקְבְּרָה
  choice: upang mailibing ko
  rationale: Ipinakikita ang layunin ng cohortative sa natural na Tagalog.
- source_word: מֵתִי
  choice: ang aking patay
  rationale: Pinananatili ang sadyang pangkalahatang katawagan ng Hebreo at hindi tahasang idinadagdag na si Sara ang tinutukoy.
- source_word: שָׁמָּה
  choice: roon
  rationale: Natural na katumbas ng locative adverb na tumutukoy sa bukid o lugar na pinag-uusapan.
