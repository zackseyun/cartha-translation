  text: וַ/יִּשְׁתַּ֨חוּ֙ אַבְרָהָ֔ם לִ/פְנֵ֖י עַ֥ם הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/012.yaml
  text: Then Abraham bowed down before the people of the land[a].
translation:
  language: tl
  text: Pagkatapos, yumukod si Abraham sa harap ng mga tao sa lupaing iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagpatirapa sa harap ng mga tao sa lupaing iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: yumukod
  rationale: Ang pandiwa ay tumutukoy sa pisikal na pagyukod bilang pagpapakita ng paggalang. Ang “yumukod” ay natural sa modernong Tagalog at hindi nagpapahiwatig na sumamba si Abraham sa mga tao.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Tuwirang ipinahahayag nito ang kahulugang “before” o “in the presence of” sa natural na Tagalog.
- source_word: עַם
  choice: mga tao
  rationale: Tumutukoy ito sa lokal na pangkat ng mga taong naroon at saksi sa usapan; malinaw at karaniwan ang “mga tao.”
- source_word: הָאָרֶץ
  choice: sa lupaing iyon
  rationale: Sa pariralang עַם הָאָרֶץ, tumutukoy ito sa mga naninirahan sa lokal na lupain. Ang “sa lupaing iyon” ay mas natural at malinaw sa Tagalog kaysa sa literal ngunit malamya na “ng lupain.”
- source_word: וַ
  choice: Pagkatapos
  rationale: Isinusulong ng waw na kasama ng wayyiqtol ang pagkakasunod-sunod ng salaysay; natural itong ipinahahayag ng “Pagkatapos.”
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa modernong Tagalog na Bibliya.
