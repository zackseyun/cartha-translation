translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “panginoon ko” bilang magalang na pantawag sa tao, hindi bilang titulong tumutukoy sa Diyos. Ang pag-uulit ng “ibinibigay ko” ay pinanatili upang maipahayag ang pampubliko at performatibong diin ng Hebreo.
