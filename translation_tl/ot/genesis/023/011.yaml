    issue: “ang yungib na naroon”
    rationale: Hindi nito malinaw na ipinahahayag ang ugnayang panglugar ng Hebreong “ang yungib na nasa loob nito,” kung saan ang panghalip ay tumutukoy sa bukid.
  - severity: low
    issue: “Ilibing mo na”
    rationale: Ang “na” ay hindi isinasalita sa Hebreo at maaaring magdagdag ng himig ng agarang pahintulot o pagkaantala; sapat ang payak na pautos.
  - severity: low
    issue: “makinig ka sa akin”
    rationale: Maiintindihan at wasto ito, ngunit ang “pakinggan mo ako” ay mas tuwirang katumbas ng Hebreong imperative na may pronominal na layon at mas matatas sa linyang ito.
