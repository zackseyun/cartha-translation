base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/011.yaml
  text: 'No[a], my lord, listen to me: I give you the field, and I give you the cave that is in it[b]. In the sight of the sons of my people I give it to you[c]. Bury your dead.'
translation:
  language: tl
  text: '“Hindi, panginoon ko[a], pakinggan mo ako: Ibinibigay ko sa iyo ang bukid, at ibinibigay ko rin sa iyo ang yungib na nasa loob nito. Sa harap ng mga kababayan ko, ibinibigay ko ito sa iyo[b]. Ilibing mo ang iyong yumao.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi ganoon, panginoon ko; pakinggan mo ako.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa harap ng mga mata ng mga anak ng aking bayan,” isang idyoma para sa hayagang pagkakaloob sa presensya ng mga saksi mula sa kanyang komunidad.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא
  choice: Hindi
  rationale: Sa konteksto, magalang na pagtutol o pagtutuwid ito sa alok ni Abraham, hindi lamang payak na pagnenegatibo.
- source_word: אֲדֹנִי
  choice: panginoon ko
  rationale: Pinananatili nito ang magalang at mapagpakumbabang pagtawag kay Abraham sa isang pormal na usapan tungkol sa ari-arian.
- source_word: שְׁמָעֵנִי
  choice: makinig ka sa akin
  rationale: Likas sa makabagong Tagalog at malinaw na naghahayag ng tuwirang pakiusap.
- source_word: הַשָּׂדֶה
  choice: ang bukid
  rationale: Tuwirang katumbas ng bukas na lupain o bukid na pinag-uusapan bilang ari-arian.
- source_word: נָתַתִּי לָךְ / נְתַתִּיהָ לָךְ
  choice: ibinibigay ko sa iyo / ibinibigay ko iyon sa iyo
  rationale: 'Ang perpektong pandiwa ay performatibo rito: sa mismong pagsasalita ay ipinahahayag ang pagkakaloob.'
- source_word: הַמְּעָרָה אֲשֶׁר בּוֹ
  choice: ang yungib na naroon
  rationale: Malinaw at natural na ipinapakitang ang yungib ay nasa loob o sakop ng bukid.
- source_word: לְעֵינֵי בְנֵי עַמִּי
  choice: Sa harap ng mga kababayan ko
  rationale: Isinasalin ang idyomang literal na 'sa mga mata ng mga anak ng aking bayan' bilang pampublikong pagkakaloob sa presensya ng mga saksi mula sa komunidad.
- source_word: קְבֹר מֵתֶךָ
  choice: Ilibing mo na ang iyong yumao
  rationale: Pinananatili ang tuwirang pautos at ang pagtukoy sa namatay; ang 'na' ay natural na nagpapahayag ng pahintulot na magpatuloy, nang hindi binabago ang diwa.
