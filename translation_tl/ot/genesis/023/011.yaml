revisions:
- from: “Hindi, panginoon ko[a], makinig ka sa akin. Ibinibigay ko sa iyo ang bukid, pati ang yungib na naroon. Sa harap ng mga kababayan ko[b], ibinibigay ko iyon sa iyo. Ilibing mo na ang iyong yumao.”
  to: '“Hindi, panginoon ko[a], pakinggan mo ako: Ibinibigay ko sa iyo ang bukid, at ibinibigay ko rin sa iyo ang yungib na nasa loob nito. Sa harap ng mga kababayan ko, ibinibigay ko ito sa iyo[b]. Ilibing mo ang iyong yumao.”'
  rationale: Nilinaw ang lokasyon ng yungib bilang nasa loob ng bukid, pinanatili ang inuulit na performatibong pagkakaloob, at inalis ang dagdag na “na” sa pautos. Inayos din ang pandiwang “pakinggan” para sa mas tuwiran at likas na panawagan. Walang pagbabagong doktrinal o pagpapaliit ng anumang ambigwidad sa pinagmulan.
