  text: וַ/תָּ֣מָת שָׂרָ֗ה בְּ/קִרְיַ֥ת אַרְבַּ֛ע הִ֥וא חֶבְר֖וֹן בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יָּבֹא֙ אַבְרָהָ֔ם לִ/סְפֹּ֥ד לְ/שָׂרָ֖ה וְ/לִ/בְכֹּתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/002.yaml
  text: And Sarah died in Kiriath-arba (that is[a], Hebron) in the land of Canaan[b], and Abraham came to mourn for Sarah and to weep for her.
translation:
  language: tl
  text: Namatay si Sara sa Kiriat-arba (na siyang Hebron), sa lupain ng Canaan. Dumating[a] si Abraham upang magluksa para kay Sara at tangisan siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pumunta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: Namatay
  rationale: Tuwirang tumutukoy ang מות sa kamatayan. Pinananatili ng “namatay” ang payak at tahasang pahayag ng Hebreo nang hindi ito pinapalambot.
- source_word: שָׂרָה
  choice: Sara
  rationale: Ginamit ang nakasanayang anyong Filipino ng pangalan.
- source_word: בְּקִרְיַת אַרְבַּע
  choice: sa Kiriat-arba
  rationale: Isinalin sa baybay na madaling basahin sa Filipino ang pangalan ng lugar habang pinananatili ang pangalan sa halip na isalin ang kahulugan nito.
- source_word: הִוא חֶבְרוֹן
  choice: na siyang Hebron
  rationale: Ipinahahayag ng pariralang Hebreo na ang Kiriat-arba ay ang lugar ding tinatawag na Hebron. Likas at malinaw sa Filipino ang “na siyang Hebron.”
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Pinanatili ang tahasang אֶרֶץ, “lupain,” sa halip na paikliin lamang sa “sa Canaan.”
- source_word: וַיָּבֹא
  choice: Dumating
  rationale: Maaaring mangahulugan ang בוא ng “dumating” o “pumunta” ayon sa pananaw ng nagsasalaysay. Ang “dumating” ay natural sa daloy ng salaysay, at inilagay sa talababa ang alternatibo.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Ginamit ang nakasanayang anyong Filipino ng pangalan.
- source_word: לִסְפֹּד לְשָׂרָה
  choice: upang magluksa para kay Sara
  rationale: Ang ספד ay tumutukoy sa pagdadalamhati o pagluluksa, kung minsan ay may hayag na panaghoy. Sapat na malawak at natural ang “magluksa,” at ang לְשָׂרָה ay malinaw na naipahayag bilang “para kay Sara.”
- source_word: וְלִבְכֹּתָהּ
  choice: at tangisan siya
  rationale: Ang בכה ay pag-iyak dahil sa dalamhati. Ang “tangisan siya” ay likas at marangal sa konteksto ng pagluluksa at tahasang pinananatili ang pambabaeng panghalip na tumutukoy kay Sara.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang tuwirang pahayag tungkol sa pagkamatay ni Sara at ang dalawang magkaugnay ngunit magkaibang kilos ni Abraham—pagluluksa at pag-iyak. Ang mga pangalan ay nasa mga anyong karaniwang nababasa at madaling bigkasin sa Filipino.
