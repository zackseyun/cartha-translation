  to: At ibigay niya sa akin ang yungib ng Macpela, na pag-aari niya at nasa dulo ng kanyang bukid.[a] Ibigay niya ito sa akin sa gitna ninyo kapalit ng buong halaga sa pilak,[b] bilang ari-arian para sa libingan.[c]
  rationale: Binago ang katumbas ng בְּתוֹכְכֶם mula “sa harap ninyo” tungo sa “sa gitna ninyo” upang huwag limitahan ang kahulugan sa pisikal na presensiya ng mga saksi. Nilinaw rin ang panghuling legal na parirala bilang “ari-arian para sa libingan,” habang pinanatili ang kahulugan, rehistro, at mga talababa ng salin.
