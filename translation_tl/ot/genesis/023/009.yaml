  yaml_path: translation/ot/genesis/023/009.yaml
  text: and let him give me the cave of Machpelah[a], which belongs to him, which is at the end of his field. For the full price in silver[d][c][b], let him give it to me among you as a burial property.
translation:
  language: tl
  text: At ibigay niya sa akin ang yungib ng Macpela, na pag-aari niya at nasa dulo ng kanyang bukid.[a] Ibigay niya ito sa akin sa gitna ninyo kapalit ng buong halaga sa pilak,[b] bilang ari-arian para sa libingan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa gilid ng kanyang bukid.” Maaaring tumukoy ang salitang Hebreo sa dulo, gilid, o dulong bahagi ng bukid.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa buong pilak,” isang idyoma para sa pagbabayad ng buong halaga.
    reason: lexical_alternative
  - marker: c
    text: O “bilang pag-aari para sa libingan.” Binibigyang-diin ng Hebreo ang legal na pagmamay-ari, hindi lamang ang paggamit sa lugar bilang libingan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: At ibigay niya sa akin
  rationale: Ang diwa ng di-ganap na pandiwa sa konteksto ay magalang na kahilingan, hindi simpleng pahayag tungkol sa hinaharap.
- source_word: מְעָרַת הַמַּכְפֵּלָה
  choice: ang yungib ng Macpela
  rationale: Pinananatili ang ugnayang construct at isinasalin sa karaniwang anyong Tagalog; tinutumbasan ng “yungib” ang natural na kuweba.
- source_word: אֲשֶׁר לוֹ
  choice: na pag-aari niya
  rationale: Malinaw at natural na ipinahahayag ang pagmamay-ari, na mahalaga sa legal na usapan.
- source_word: אֲשֶׁר בִּקְצֵה שָׂדֵהוּ
  choice: at nasa dulo ng kanyang bukid
  rationale: Maaaring mangahulugan ang קצה ng dulo o gilid; pinili ang “dulo” habang inilalagay sa talababa ang tunay na alternatibo.
- source_word: בְּכֶסֶף מָלֵא
  choice: kapalit ng buong halaga nito sa pilak
  rationale: Ipinahahayag ang idyomatikong diwa ng lubos na bayad nang pinananatili ang pilak bilang paraan ng pagbabayad.
- source_word: יִתְּנֶנָּה
  choice: Ibigay niya ito sa akin
  rationale: Pinananatili ang literal na pandiwang “ibigay” sa halip na gawing “ipagbili”; nililinaw na ng pariralang tungkol sa buong bayad ang transaksiyon.
- source_word: בְּתוֹכְכֶם
  choice: sa harap ninyo
  rationale: Sa konteksto ng pampublikong transaksiyon, natural nitong ipinahahayag na saksi at kumikilala ang pamayanan, bagaman literal itong “sa gitna ninyo.”
- source_word: לַאֲחֻזַּת קָבֶר
  choice: bilang pag-aaring libingan
  rationale: Pinananatili ang legal na diin ng אֲחֻזָּה bilang pag-aari o ari-ariang hawak, hindi lamang pahintulot na gamitin ang lugar.
