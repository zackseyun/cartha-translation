translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “Macpela” bilang likas na baybay sa Filipino, “yungib” para sa natural na kuweba, at malinaw na wikang pang-ari-arian upang mapanatili ang legal na tono ng negosasyon.
