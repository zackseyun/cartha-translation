translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kuweba” at “bukid” bilang mga salitang madaling maunawaan, habang pinanatili ang mga pangalan ng lugar sa transliteradong anyo. Inilagay ang talababa sa “Mamre,” ang pariralang talagang nililinaw nito.
