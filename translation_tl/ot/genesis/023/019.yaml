base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/019.yaml
  text: After this[a], Abraham buried Sarah his wife in the cave of the field of Machpelah, facing Mamre (that is, Hebron), in the land of Canaan.
translation:
  language: tl
  text: Pagkatapos nito, inilibing ni Abraham ang asawa niyang si Sara sa kuweba ng bukid ng Macpela, sa tapat ng Mamre[a] (na siyang Hebron), sa lupain ng Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa harap ng Mamre.” Ang pananalitang Hebreo ay tumutukoy sa isang lugar na nasa harap o katapat ng Mamre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na panandang temporal ito sa makabagong Tagalog at malinaw na pinananatili ang pagkakasunod-sunod ng salaysay.
- source_word: קָבַר
  choice: inilibing
  rationale: Ito ang karaniwan at tuwirang katumbas ng pandiwang Hebreo na nangangahulugang maglibing.
- source_word: אֶת שָׂרָה אִשְׁתּוֹ
  choice: ang asawa niyang si Sara
  rationale: Natural sa Tagalog ang ayos na ito at malinaw na ipinapahayag ang kaugnayan ni Sara kay Abraham.
- source_word: אֶל מְעָרַת
  choice: sa kuweba
  rationale: Bagaman maaaring literal na ipakahulugan ang pang-ukol bilang “patungo sa” o “papasok sa,” hinihingi ng konteksto ng paglilibing ang natural na Tagalog na “sa kuweba.”
- source_word: מְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: sa kuweba sa bukid ng Macpela
  rationale: Malinaw at natural nitong inilalarawan sa Tagalog ang kuweba bilang nasa bukid na tinatawag na Macpela, nang hindi pinapabigat ang magkakaugnay na anyong paari sa Hebreo.
- source_word: הַמַּכְפֵּלָה
  choice: Macpela
  rationale: Isinalin bilang transliteradong pangalan ng lugar, na ang pantukoy sa Hebreo ay hindi na kailangang ilantad sa Tagalog.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: sa tapat ng Mamre
  rationale: Pinananatili nito ang relasyong panlunan—nasa harap o katapat ng Mamre—nang hindi nagdaragdag ng tiyak na direksiyon gaya ng silangan.
- source_word: הִוא חֶבְרוֹן
  choice: na siyang Hebron
  rationale: Natural na paraan ito sa Tagalog upang ipahayag ang paglilinaw o pagkakakilanlan ng lugar.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili ang tahasang salitang “lupain” sa Hebreo at ang pormal na heograpikong paglalarawan ng Genesis.
