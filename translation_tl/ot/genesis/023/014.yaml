  yaml_path: translation/ot/genesis/023/014.yaml
  text: And Ephron answered Abraham, saying to him,
translation:
  language: tl
  text: 'Sumagot si Efron kay Abraham at sinabi sa kaniya:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Ang wayyiqtol ng ענה sa salaysay na may usapan ay nagpapakilala ng tugon. Likas at tuwiran sa modernong Tagalog ang “Sumagot.”
- source_word: עֶפְרוֹן
  choice: Efron
  rationale: Isinalin sa baybay-Tagalog ang pangalang Hebreo, na gumagamit ng “f” na karaniwan na sa modernong Filipino.
- source_word: אֶת אַבְרָהָם
  choice: kay Abraham
  rationale: Hindi hiwalay na isinasalin ang panandang tuwirang layon na אֶת. Sa pandiwang “sumagot,” natural sa Tagalog na markahan ang taong kinakausap sa pamamagitan ng “kay.”
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Ang infinitive construct na ito ay pambungad sa mismong pananalita. Mas natural sa Tagalog ang koordinasyong “at sinabi” kaysa literal na participial na anyo.
- source_word: לוֹ
  choice: (nakapaloob sa “kay Abraham”)
  rationale: Ang panghalip ay tumutukoy kay Abraham. Ang pag-uulit ng “sa kaniya” matapos ang “kay Abraham” ay mabigat at di-likas sa Tagalog, kaya pinagsama ang relasyon ng pakikipag-usap sa “kay Abraham.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Pinanatili ang pormulang pambungad sa kasunod na tuwirang pananalita, habang iniwasan ang di-likas na pag-uulit ng layon sa Tagalog.
