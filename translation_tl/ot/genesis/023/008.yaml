- from: At kinausap niya sila at sinabi, “Kung nais ninyong mailibing ko ang aking yumao upang hindi ko na siya makita, pakinggan ninyo ako at makiusap kayo para sa akin kay Efron na anak ni Zohar.”
  to: At kinausap niya sila at sinabi, “Kung sang-ayon kayo na ilibing ko ang aking yumao at maalis siya sa aking harapan, pakinggan ninyo ako at makiusap kayo para sa akin kay Efron na anak ni Zohar.”
  rationale: Pinalitan ang “mailibing ko” ng “ilibing ko” upang mas tuwirang tumbasan ang infinitive na “ilibing.” Inayos ang pagsasalin ng מִלְּפָנַי bilang “maalis siya sa aking harapan” upang mapanatili ang idiomatikong saklaw ng Hebreo nang hindi magdagdag ng aspektong wala sa pinagmulan. Pinanatili ang magalang at likas na Tagalog na pagpapahayag para sa pakiusap na mamagitan kay Efron.
