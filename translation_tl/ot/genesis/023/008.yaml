  language: tl
  text: At kinausap niya sila at sinabi, “Kung sang-ayon kayo na ilibing ko ang aking yumao at maalis siya sa aking harapan, pakinggan ninyo ako at makiusap kayo para sa akin kay Efron na anak ni Zohar.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם לֵאמֹר
  choice: At kinausap niya sila at sinabi
  rationale: Ang דבר na may אִתָּם ay likas na maisasaling “kinausap niya sila,” at ang לֵאמֹר ay nagpapakilala sa tuwirang sinabi.
- source_word: אִם יֵשׁ אֶת־נַפְשְׁכֶם
  choice: Kung nais ninyo
  rationale: Idyoma ito para sa pagnanais o kusang-loob; natural at malinaw ang “kung nais ninyo” sa modernong Tagalog.
- source_word: לִקְבֹּר אֶת־מֵתִי
  choice: mailibing ko ang aking yumao
  rationale: Ipinahihiwatig ng konteksto na si Abraham ang magpapalibing. Pinananatili ng “aking yumao” ang pangkalahatang katawagan ng Hebreo nang hindi idinaragdag sa teksto ang “asawa.”
- source_word: מִלְּפָנַי
  choice: upang hindi ko na siya makita
  rationale: Ang literal na “mula sa harap ko” ay tumutukoy rito sa pag-aalis sa bangkay sa kanyang paningin sa pamamagitan ng paglilibing; ang salin ay natural at hindi binabago ang diwa.
- source_word: שְׁמָעוּנִי
  choice: pakinggan ninyo ako
  rationale: Direkta at kasalukuyang katumbas ng pautos na “makinig kayo sa akin.”
- source_word: וּפִגְעוּ לִי בְּעֶפְרוֹן
  choice: at makiusap kayo para sa akin kay Efron
  rationale: Sa konteksto ng pakikipagkasundo, ang פגע na may ב at לִי ay paghiling na lumapit at mamanhik sa isang tao alang-alang sa nagsasalita. Sapat na malawak ang “makiusap” upang hindi magpahiwatig ng isang pormal na tungkuling tagapamagitan.
- source_word: עֶפְרוֹן בֶּן־צֹחַר
  choice: Efron na anak ni Zohar
  rationale: Karaniwang modernong Tagalog na anyo para sa ugnayang ipinahahayag ng בֶּן, habang tinutumbasan sa baybay-Tagalog ang mga pangalan.
