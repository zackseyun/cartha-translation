  source_fidelity: Tumpak na naihahatid ng draft ang legal na paglilipat bilang pag-aari ni Abraham at ang pampublikong pagsaksi ng mga anak ni Het at ng lahat ng nasa pintuan ng lungsod. Gayunman, ang “pintuang-bayan ng lungsod niya” ay hindi gaanong likas at medyo paulit-ulit sa Filipino para sa שַׁעַר עִירוֹ.
  naturalness: Maayos ang anyong putol ng pangungusap, dahil pagpapatuloy ito ng naunang talata. Mas natural at malinaw ang “pintuan ng kaniyang lungsod” kaysa “pintuang-bayan ng lungsod niya.”
  terminology: Ang “mga anak ni Het” ay wastong literal na katawagan, at ang talababang “mga Heteo” ay angkop na kontekstuwal na alternatibo. Ang “pag-aari,” “sa paningin,” at “pumapasok” ay angkop sa modernong Filipino at sa legal-pampublikong konteksto.
