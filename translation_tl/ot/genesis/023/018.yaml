  text: to Abraham as a possession before the eyes of the sons of Heth[a], before all who entered the gate of his city.
translation:
  language: tl
  text: bilang pag-aari ni Abraham, sa paningin ng mga anak ni Het[a] at ng lahat ng pumapasok sa pintuan ng kaniyang lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Heteo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַבְרָהָם
  choice: ni Abraham
  rationale: Sa pariralang “bilang pag-aari ni Abraham,” natural na ipinapahayag ng “ni” ang taong pinangyarihang may-ari matapos ang legal na paglilipat.
- source_word: לְמִקְנָה
  choice: bilang pag-aari
  rationale: Ipinahihiwatig ng מִקְנָה ang ari-ariang nakuha sa transaksiyon; nakatuon ang salin sa naging kalagayan nito bilang pag-aari.
- source_word: לְעֵינֵי
  choice: sa paningin ng
  rationale: Pinananatili nito ang larawan ng Hebreong idyoma habang malinaw na ipinahahayag ang hayag at nasaksihang katangian ng transaksiyon.
- source_word: בְנֵי חֵת
  choice: mga anak ni Het
  rationale: Pinananatili ang literal na katawagang pampamilya at pangkat-etniko na inuulit sa salaysay; inilalagay sa talababa ang kontekstuwal na alternatibo.
- source_word: בְּכֹל בָּאֵי
  choice: at ng lahat ng pumapasok
  rationale: Ipinahahayag ang buong pangkat ng mga pampublikong saksi nang natural sa Tagalog, habang pinananatili ang aspektong di-tiyak sa panahon ng participle sa pamamagitan ng “pumapasok.”
- source_word: שַׁעַר עִירוֹ
  choice: pintuang-bayan ng lungsod niya
  rationale: Ang “pintuang-bayan” ay tumutukoy sa pasukan at pampublikong pook ng lungsod kung saan isinasagawa ang mga usaping legal; pinananatili ng “niya” ang reperensiyang panlalaki ng orihinal nang hindi tahasang tinutukoy kung sino iyon.
theological_decisions: []
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Bahagi ito ng pangungusap na nagsimula sa naunang talata, kaya sadyang walang idinagdag na pandiwa. Ginamit ang “sa paningin” upang mapanatili ang Hebreong larawan at legal na diwa nang hindi nagiging pilit sa Tagalog.
