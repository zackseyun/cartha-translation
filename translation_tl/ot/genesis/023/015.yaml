    rationale: Bagaman nauunawaan, ang ‘namatay’ ay mas karaniwang pandiwa/pang-uring anyo sa modernong Filipino. Sa ganitong konstruksiyon, ang ‘inyong patay’ ang likas na katumbas ng Hebreong nominal na ‘iyong patay.’
  - severity: low
