  to: '“Ginoo ko, pakinggan ninyo ako: isang lupain na nagkakahalaga ng apatnaraang siklo ng pilak[a]—ano ba iyon sa pagitan nating dalawa? Ilibing na ninyo ang inyong patay.”'
