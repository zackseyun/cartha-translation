  text: 'My lord[a], listen to me: a piece of land worth four hundred shekels of silver—what is that between me and you? Bury your dead.'
translation:
  language: tl
  text: '“Ginoo ko, pakinggan ninyo ako: isang lupain na nagkakahalaga ng apatnaraang siklo ng pilak[a]—ano ba iyon sa pagitan nating dalawa? Ilibing na ninyo ang inyong patay.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “lupain—apatnaraang siklo ng pilak—ano iyon sa pagitan nating dalawa?” Eliptiko at retorikal ang Hebreo; minamaliit nito ang halaga sa takbo ng pakikipagtawaran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Ginoo ko
  rationale: Magalang na pantawag kay Efron, hindi titulo para sa Diyos; pinananatili ang paggalang at ang isahang kausap.
- source_word: שְׁמָעֵנִי
  choice: pakinggan ninyo ako
  rationale: Magalang at likas na makabagong Tagalog para sa tuwirang pakiusap na makinig.
- source_word: אֶרֶץ
  choice: isang lupain
  rationale: Tumutukoy sa tiyak na ari-ariang lupa na pinag-uusapan, hindi sa lupa sa pangkalahatan.
- source_word: אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף
  choice: na nagkakahalaga ng apatnaraang siklong pilak
  rationale: Ginagawang malinaw sa Tagalog ang eliptikong pahayag tungkol sa halaga nang hindi nagdaragdag ng bagong diwa.
- source_word: בֵּינִי וּבֵינְךָ
  choice: sa pagitan nating dalawa
  rationale: Likas na Tagalog na nagpapanatili sa personal na ugnayan ng dalawang isahang panig sa tawaran.
- source_word: מַה הִוא
  choice: ano ba iyon
  rationale: Ipinahahayag ang retorikal na pagmamaliit sa halagang binanggit habang pinananatili ang anyong tanong.
- source_word: וְאֶת מֵתְךָ קְבֹר
  choice: Ilibing na ninyo ang inyong namatay
  rationale: Ang “na” ay likas na nagpapahiwatig ng paglipat sa praktikal na gagawin; ang “inyong namatay” ay nagpapanatili sa isahang anyo ng Hebreo.
