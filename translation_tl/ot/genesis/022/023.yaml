  yaml_path: translation/ot/genesis/022/023.yaml
  text: And Bethuel fathered Rebekah. These eight Milcah bore to Nahor[a], Abraham’s brother.
translation:
  language: tl
  text: At si Betuel ang naging ama ni Rebeca. Ang walong ito ay ipinanganak ni Milca kay Nahor[a], na kapatid ni Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na pagkakasalin, “Ito ang walong ipinanganak ni Milca kay Nahor, na kapatid ni Abraham.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְתוּאֵל
  choice: At si Betuel
  rationale: Isinasalin ang ו bilang “At” upang ipagpatuloy nang maayos ang talaangkanan; ginagamit ang karaniwang anyong Filipino ng pangalan.
- source_word: יָלַד אֶת רִבְקָה
  choice: ang naging ama ni Rebeca
  rationale: Sa lalaking paksa, ipinahahayag ng יָלַד ang pagiging ama. Ang “naging ama” ay likas at malinaw sa modernong Filipino, samantalang ang אֶת ay panandang tuwirang layon at hindi hiwalay na isinasalin.
- source_word: שְׁמֹנָה אֵלֶּה
  choice: Ang walong ito
  rationale: Pinananatili ang diin ng Hebreo sa bilang nang hindi idinaragdag sa pangunahing teksto ang salitang “anak,” na nauunawaan na mula sa konteksto.
- source_word: יָלְדָה מִלְכָּה
  choice: ay ipinanganak ni Milca
  rationale: Sa babaeng paksa, tumutukoy ang pandiwa sa panganganak. Ang balangkas na “ipinanganak ni Milca” ay natural sa Filipino at malinaw na si Milca ang nagsilang sa kanila.
- source_word: לְ/נָחוֹר
  choice: kay Nahor
  rationale: Ang ל sa pormulang pang-talaangkanan ay likas na ipinahahayag ng “kay,” na nagpapakitang ang mga anak ay isinilang ni Milca para kay Nahor bilang ama.
- source_word: אֲחִי אַבְרָהָם
  choice: na kapatid ni Abraham
  rationale: Malinaw na iniuugnay ng pariralang ito si Nahor kay Abraham bilang kapatid niya, gamit ang natural na ayos sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang mga karaniwang anyong Filipino ng mga pangalang Betuel, Rebeca, Milca, Nahor, at Abraham. Pinanatili ang maigsi at pormulang estilo ng talaangkanan.
