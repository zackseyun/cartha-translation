base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/012.yaml
  text: And he said[a], “Do not lay your hand on the boy, and do not do anything to him, for now I know that you fear God, since you have not withheld your son, your only son[b], from me.”
translation:
  language: tl
  text: At sinabi niya, “Huwag mong pagbuhatan ng kamay ang bata, at huwag mo siyang gawan ng anuman, sapagkat ngayon ay alam kong may takot ka sa Diyos, dahil hindi mo ipinagkait sa akin ang iyong anak, ang kaisa-isa mong anak[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang iyong anak, ang kaisa-isa mo”; ibig sabihin, ang kaisa-isa mong anak sa kontekstong ito ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁלַח יָדְךָ אֶל
  choice: pagbuhatan ng kamay
  rationale: Likas na idyomang Filipino ito para sa marahas na pagkilos laban sa isang tao at mahusay na tumutugma sa Hebreong idyoma nang hindi nililimitahan ang utos sa isang tiyak na paraan ng pananakit.
- source_word: הַנַּעַר
  choice: ang bata
  rationale: Maaaring tumukoy ang נַעַר sa bata o kabataang lalaki; ang “bata” ay natural at angkop sa tinig ng salaysay dito.
- source_word: תַּעַשׂ לוֹ מְאוּמָּה
  choice: huwag mo siyang gawan ng anuman
  rationale: Pinananatili nito ang ganap at malawak na pagbabawal na ipinahihiwatig ng מְאוּמָּה sa ilalim ng negasyon.
- source_word: עַתָּה יָדַעְתִּי
  choice: ngayon ay alam ko
  rationale: Direktang inililipat ang Hebreong pahayag at pinananatili ang teolohikal na tensiyon nito.
- source_word: יְרֵא אֱלֹהִים
  choice: may takot ka sa Diyos
  rationale: Karaniwang biblikal ngunit malinaw na Filipino para sa pagkatakot at pagpipitagan sa Diyos; hindi nito binabawasan ang kahulugan sa “gumagalang” lamang.
- source_word: חָשַׂכְתָּ
  choice: hindi mo ipinagkait
  rationale: Ang “ipinagkait” ay natural sa Filipino para sa hindi pagpigil o hindi pagkakait ng isang bagay o tao sa iba, at akma sa konstruksiyong may “sa akin.”
- source_word: יְחִידְךָ
  choice: ang kaisa-isa mong anak
  rationale: Bagaman literal na “ang kaisa-isa mo,” malinaw sa apposisyon na anak ang tinutukoy. Ang pag-uulit ng “anak” ay natural sa Filipino at pinananatili ang diin ng Hebreo.
- source_word: מִמֶּנִּי
  choice: sa akin
  rationale: Sa pandiwang Filipino na “ipagkait,” ang natural na katumbas ng Hebreong “mula sa akin” ay “ipinagkait sa akin,” na pinananatili ang ugnayang semantiko.
theological_decisions:
- issue: Antropomorpikong pahayag tungkol sa kaalaman ng Diyos sa “ngayon ay alam ko”
  choice: Panatilihin ang tuwirang “ngayon ay alam ko.”
  alternative: “ngayon ay nakita ko” o “ngayon ay napatunayan”
  rationale: Tahasang sinasabi ng Hebreo na “ngayon ay alam ko.” Hindi ito pinalalabnaw o ipinapaliwanag upang lutasin ang teolohikal na tensiyon ng teksto.
- issue: Kahulugan ng יְחִידְךָ sa konteksto ng iba pang anak ni Abraham
  choice: “ang kaisa-isa mong anak,” kasunod ng sariling paglalarawan ng salaysay kay Isaac
  alternative: “ang natatangi mong anak” o “ang kaisa-isa mo”
  rationale: Pinananatili ng salin ang retorikal at tipanang paglalarawan ng teksto nang hindi nagdaragdag ng paliwanag sa pangunahing talata; nililinaw ng talababa ang anyong Hebreo at konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “pagbuhatan ng kamay” bilang buhay na idyoma, habang pinanatili ang tuwirang “ngayon ay alam ko” at ang diin ng inuulit na “anak.”
