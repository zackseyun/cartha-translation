base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/001.yaml
  text: After these things[a], God tested Abraham and said to him, “Abraham!” And he said[b], “Here I am.”
translation:
  language: tl
  text: 'Pagkatapos ng mga pangyayaring ito, sinubok ng Diyos si Abraham. Sinabi niya sa kanya, “Abraham!”


    Sumagot siya, “Narito ako.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Pagkatapos ng mga pangyayaring ito
  rationale: Ginagamit ang וַיְהִי bilang panandang pasalaysay at hindi na hiwalay na isinalin upang maiwasan ang mabigat na pananalita. Ang “mga pangyayari” ay likas sa modernong Filipino at malinaw na nag-uugnay sa naunang salaysay, bagaman maaari ring mangahulugan ang דְּבָרִים ng “mga bagay” o “mga usapin.”
- source_word: הָאֱלֹהִים
  choice: ang Diyos
  rationale: Tumutukoy ito sa Diyos sa konteksto at hindi sa banal na pangalang YHWH; likas sa Filipino ang paggamit ng pantukoy na “ang.”
- source_word: נִסָּה
  choice: sinubok
  rationale: Ang Piel ng נסה ay tumutukoy sa pagsubok o pagpapatunay. Ang “sinubok” ang malinaw at karaniwang katumbas sa Filipino at hindi nagpapahiwatig ng pag-akit na gumawa ng masama.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Sinabi niya sa kanya
  rationale: Natural at tapat na paglilipat ng pandiwang אמר na may di-tuwirang layon. Pinananatili ng panghalip ang Diyos bilang tagapagsalita.
- source_word: אַבְרָהָם
  choice: Abraham!
  rationale: Ang pangalan ay tuwirang pagtawag; ipinakikita ng tandang padamdam ang malinaw na pagtawag nang hindi nagdaragdag ng emosyon na wala sa teksto.
- source_word: וַיֹּאמֶר הִנֵּנִי
  choice: Sumagot siya, “Narito ako.”
  rationale: Ang הִנֵּנִי ay pormulang nagpapahayag ng handang pakikinig at presensiya. Likas at marangal sa Filipino ang “Narito ako”; ipinahihiwatig ng “sumagot” ang gamit ng וַיֹּאמֶר sa palitang ito.
theological_decisions:
- issue: Kahulugan ng נִסָּה kapag Diyos ang simuno
  choice: sinubok ng Diyos si Abraham
  alternative: tinukso ng Diyos si Abraham
  rationale: Sa kontekstong ito, ang pandiwa ay pagsubok o pagpapatunay, hindi pag-akit na gumawa ng masama. Iniiwasan ng “sinubok” ang maling kahulugan habang hindi ipinapaliwanag nang lampas sa sinasabi ng salaysay.
translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Hinati sa dalawang pangungusap ang mahabang Hebreong ayos upang maging natural sa Filipino, ngunit pinanatili ang pagkakasunod-sunod ng kilos at ang maikling, handang tugon ni Abraham.
