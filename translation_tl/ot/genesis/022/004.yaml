  text: On the third day Abraham lifted up his eyes and saw the place from afar[a].
translation:
  language: tl
  text: Sa ikatlong araw, itinaas ni Abraham ang kanyang mga mata at nakita niya ang lugar mula sa malayo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kalayuan” o “malayong-malayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Nang ikatlong araw
  rationale: Tuwirang temporal na parirala ito. Hindi idinagdag ang “ng paglalakbay” dahil wala iyon sa Hebreo.
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: itinaas ni Abraham ang kanyang paningin
  rationale: Pinananatili nito ang larawan ng Hebreong idyoma na literal na “itinaas ang kanyang mga mata,” ngunit gumagamit ng mas natural at marangal na pananalita sa modernong Tagalog.
- source_word: וַיַּרְא
  choice: at nakita niya
  rationale: Payak na sunod-sunod na kilos sa salaysay mula sa pandiwang ראה; hindi dinagdagan ng pagpapakahulugang gaya ng “natanaw” na maaaring higit na magdiin sa layo.
- source_word: הַמָּקוֹם
  choice: ang lugar
  rationale: Karaniwang tiyak na pangngalan ang ginamit sa Hebreo. Bagaman tumutukoy ito sa itinakdang hantungan, hindi iyon higit na ipinaliwanag sa salin.
- source_word: מֵרָחֹק
  choice: mula sa malayo
  rationale: Malinaw at natural nitong ipinahahayag ang pagtanaw mula sa isang distansiya habang pinananatili ang preposisyong diwa ng Hebreo.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Karaniwang anyo ng pangalan sa Tagalog at kinikilalang transliterasyon ng pangalang Hebreo.
