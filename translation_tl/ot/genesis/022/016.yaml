  text: וַ/יֹּ֕אמֶר בִּ֥/י נִשְׁבַּ֖עְתִּי נְאֻם יְהוָ֑ה כִּ֗י יַ֚עַן אֲשֶׁ֤ר עָשִׂ֨יתָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/לֹ֥א חָשַׂ֖כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/016.yaml
  text: and said[a], “By myself I have sworn, declares Yahweh, because you have done this thing and have not withheld your son[b], your only son,”
translation:
  language: tl
  text: at sinabi, “Sumumpa ako sa aking sarili,” pahayag ni Yahweh, “sapagkat ginawa mo ang bagay na ito at hindi mo ipinagkait[a] ang iyong anak, ang iyong kaisa-isang anak[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi mo pinigil” o “hindi mo iniligtas.”
    reason: Pinahihintulutan ng pandiwang Hebreo ang mga kahulugang ‘ipagkait,’ ‘pigilan,’ o, sa kontekstong ito, ‘iligtas.’
  - marker: b
    text: O “ang natatangi mong anak.”
    reason: Ang pang-uring Hebreo ay maaaring mangahulugang ‘kaisa-isa’ o ‘natatangi.’
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: at sinabi
  rationale: Ipinagpapatuloy ng pandiwa ang salaysay. Hindi na kailangang ulitin ang simuno sapagkat malinaw ito sa konteksto.
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: Sumumpa ako sa aking sarili
  rationale: Ang בִּי sa pormula ng panunumpa ay nangangahulugang ang nagsasalita ay nanunumpa sa sarili niya; pinananatili ng pangnagdaan ang anyong ganap ng pandiwang Hebreo.
- source_word: נְאֻם יְהוָה
  choice: pahayag ni Yahweh
  rationale: Solemne itong pormula ng banal na pagpapahayag. Ginamit ang personal na pangalang Yahweh para sa Tetragrammaton.
- source_word: כִּי יַעַן אֲשֶׁר
  choice: na dahil
  rationale: Ipinapakita nito ang ugnayan ng sumpa at ng dahilan nito nang natural sa Filipino.
- source_word: עָשִׂיתָ אֶת־הַדָּבָר הַזֶּה
  choice: ginawa mo ang bagay na ito
  rationale: Pinananatili ang tuwirang demonstratibong diin ng Hebreo sa ginawa ni Abraham.
- source_word: וְלֹא חָשַׂכְתָּ
  choice: at hindi mo ipinagkait
  rationale: Ang ‘ipinagkait’ ay natural na tumutumbas sa hindi pagpigil o hindi pag-uurong sa anak, nang hindi awtomatikong pinipili ang mas interpretatibong ‘hindi iniligtas.’
- source_word: בִּנְךָ אֶת־יְחִידְךָ
  choice: ang iyong anak, ang kaisa-isa mong anak
  rationale: Inuulit ang ‘anak’ upang maging malinaw at natural sa Filipino, habang pinananatili ang appositional na diin sa pagiging kaisa-isa o natatangi niya.
theological_decisions:
- issue: Pagbibigay ng יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya tinumbasan ito ng transliterasyong ‘Yahweh’ sa halip na palitan ng titulo.
- issue: Kahulugan ng יְחִידְךָ
  choice: ang kaisa-isa mong anak
  alternative: ang natatangi mong anak
  rationale: Maaaring tumukoy ang salita sa pagiging ‘kaisa-isa’ o ‘natatangi.’ Pinili ang mas tuwirang kahulugan sa konteksto, ngunit inilagay sa talababa ang lehitimong alternatibo upang hindi ikubli ang lawak ng salita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong tuwirang pahayag at ang solemne ngunit hindi lipas na himig ng panunumpa.
