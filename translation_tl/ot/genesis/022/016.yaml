  naturalness: May maliit ngunit mahalagang suliranin sa sintaks na “Sumumpa ako sa aking sarili—pahayag ni Yahweh—na dahil...”; ang “na dahil” ay hindi likas at maaaring magpalabo kung ano ang saklaw ng sanhi. Mas malinaw at natural ang paghihiwalay ng pormula ng pagpapahayag at paggamit ng “sapagkat.”
