  yaml_path: translation/ot/genesis/022/014.yaml
  text: And Abraham called the name of that place, “The LORD will provide,” as it is said to this day, “On the mountain of the LORD it will be provided.”
translation:
  language: tl
  text: At pinangalanan ni Abraham ang lugar na iyon na “Makakakita ang PANGINOON.” Hanggang ngayon ay sinasabi, “Sa bundok ng PANGINOON ay makikita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה יִרְאֶה
  choice: Maglalaan ang PANGINOON
  rationale: Literal na ‘makikita ng YHWH,’ ngunit sa konteksto ng talata 8 at ng pagkakaloob ng lalaking tupa, ang pandiwang ‘makita’ ay may idyomatikong diwang ‘tingnan ang pangangailangan at maglaan.’ Pinananatili ang hinaharap na anyo.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang marangal na pamalit sa banal na pangalang YHWH, kaayon ng konsultasyong Ingles.
- source_word: יֵרָאֶה
  choice: ilalaan ito
  rationale: Ang Niphal ay literal na maaaring ‘makikita/magpapakita,’ at kaugnay ng paglalaro sa salitang ראה. Sa konteksto at sa tradisyong nasasalamin sa konsultasyong teksto, isinalin itong pasibo bilang ‘ilalaan,’ habang ang ‘ito’ ay tumutukoy sa kinakailangang handog o panustos.
- source_word: אֲשֶׁר יֵאָמֵר הַיּוֹם
  choice: gaya ng sinasabi hanggang sa araw na ito
  rationale: Natural na Filipino para sa pormulang nagsasaad na ang kasabihan ay umiiral pa noong panahon ng tagapagsalaysay.
theological_decisions:
- issue: Ugnayan ng banal na ‘pagkakita’ at ‘paglalaan’
  choice: Isinalin ang dalawang anyo ng ראה ayon sa kontekstuwal na diwang ‘maglaan/ilaan.’
  alternative: “Makikita ng PANGINOON” at “Sa bundok ng PANGINOON ay makikita/magpapakita siya.”
  rationale: Itinatampok ng agarang konteksto ang Diyos na naglaan ng handog kapalit ni Isaac. Gayunman, kinikilalang may tunay na leksikal na ambiguwidad ang Hebreo; hindi ito ginawang paliwanag tungkol sa isang tiyak na doktrinang denominasyonal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “PANGINOON” para sa tetragrammaton at pinanatili ang anyong kasabihan at ang pag-uulit na mahalaga sa talata.
