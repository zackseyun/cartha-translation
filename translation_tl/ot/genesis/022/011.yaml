base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/011.yaml
  text: But the angel of Yahweh called to him from heaven and said[a], “Abraham, Abraham!” And he said[b], “Here I am.”
translation:
  language: tl
  text: Ngunit mula sa langit ay tinawag siya ng anghel ni Yahweh[a] at sinabi, “Abraham, Abraham!” Sumagot siya, “Narito ako.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo ni Yahweh.” Ang salitang Hebreo na מַלְאָךְ ay maaaring mangahulugang “sugo” o “anghel”; sa makalangit na tagpong ito, mas angkop ang “anghel.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa mga langit”; isinalin itong “mula sa langit” bilang natural na gamit sa Tagalog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֵלָיו
  choice: tinawag siya
  rationale: Sa salaysay na ito, ang קרא ay tumutukoy sa malakas o malinaw na pagtawag sa isang tao; natural sa Tagalog ang “tinawag siya” nang hindi dinaragdagan ang lakas na hindi tahasang sinasabi ng teksto.
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugang “sugo” o “anghel” ang מַלְאָךְ. Dahil mula sa langit ang nagsasalita, “anghel” ang pinakamalinaw na pangunahing salin, habang inilalagay sa talababa ang tunay na alternatibo. Isinalin ang pangalang יהוה bilang “Yahweh.”
- source_word: מִן הַשָּׁמַיִם
  choice: mula sa langit
  rationale: Bagaman anyong maramihan ang שָׁמַיִם, karaniwan itong tumutukoy sa langit bilang makalangit na dako. Ang “mula sa langit” ang natural na pariralang Tagalog.
- source_word: וַיֹּאמֶר
  choice: sinabi / sumagot
  rationale: Ang unang וַיֹּאמֶר ay tuwirang isinaling “sinabi.” Sa ikalawang paglitaw, natural na “sumagot” dahil tugon ni Abraham ang kasunod na pananalita; hindi nito binabago ang kahulugan ng pandiwa sa konteksto.
- source_word: אַבְרָהָם אַבְרָהָם
  choice: Abraham, Abraham!
  rationale: Pinanatili ang pag-uulit ng pangalan, na nagpapahiwatig ng apurahan at personal na pagtawag.
- source_word: הִנֵּנִי
  choice: Narito ako
  rationale: Ito ang natural at nakaugaliang tugon sa Tagalog na nagpapahayag ng presensya at kahandaang makinig.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangngalang pantangi ang יהוה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang tahasang pangalan sa halip na palitan ito ng titulo.
- issue: Kung ang מַלְאַךְ יְהוָה ay dapat ipakahulugang si Yahweh mismo na nagpapakita
  choice: anghel ni Yahweh
  alternative: pagpapakita ni Yahweh mismo / sugo ni Yahweh
  rationale: Tinatawag ng talata ang nagsasalita na מַלְאַךְ, kaya hindi tahasang kinikilala sa salin ang anghel bilang si Yahweh mismo. Sa gayon, napapanatili ang teolohikal na tensiyon ng salaysay nang walang idinadagdag na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Ngunit” upang ihayag ang biglang pagpigil na ipinahihiwatig ng וַ sa konteksto. Inilipat ang panandang [b] sa mismong pariralang “mula sa langit,” na siyang tinutukoy ng talababa.
