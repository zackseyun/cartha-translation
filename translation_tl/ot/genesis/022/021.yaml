base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/021.yaml
  text: Uz his firstborn[a], Buz his brother, and Kemuel the father of Aram.
translation:
  language: tl
  text: si Uz, na panganay niya; si Buz na kapatid ni Uz; at si Kemuel na ama ni Aram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ninuno ni Aram.” Sa mga talaangkanan, ang “ama” ay maaari kung minsang tumukoy sa isang ninuno, hindi lamang sa agarang ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֥וּץ
  choice: Uz
  rationale: Pangalang pantangi; ginamit ang anyong karaniwang makikilala ng mga mambabasang Filipino.
- source_word: בְּכֹר֖וֹ
  choice: panganay niya
  rationale: Ang בְּכוֹר ay tumutukoy sa unang anak ayon sa pagkakasunod-sunod ng kapanganakan at maaari ring magpahiwatig ng natatanging katayuan; tuwirang naipahahayag ito ng “panganay.”
- source_word: בּ֣וּז
  choice: Buz
  rationale: Pangalang pantangi; pinanatili sa transliterasyong malinaw at likas sa Filipino.
- source_word: אָחִ֑יו
  choice: kapatid nito
  rationale: Tuwirang katawagang pampamilya na may panlalaking panghalip. Sa daloy ng talaan, tumutukoy ito kay Uz bilang kapatid ni Buz; ang “nito” ay nagpapanatili ng maikli at likas na anyo.
- source_word: קְמוּאֵ֖ל
  choice: Kemuel
  rationale: Pangalang pantangi; ginamit ang nakaugaliang anyo.
- source_word: אֲבִ֥י
  choice: ama ni
  rationale: Ito ang pinakatuwiran at karaniwang salin ng anyong konstrakto. Hindi nito ipinipilit kung agarang ama o mas naunang ninuno ang ibig sabihin sa kontekstong genealogical.
- source_word: אֲרָֽם
  choice: Aram
  rationale: Pangalang pantangi; hindi tinukoy ng teksto kung ang tinutukoy ay isang tao, bayan, o lupain sa mas malawak na pakahulugan.
theological_decisions:
- issue: Ang genealogical na diwa ng אֲבִי אֲרָם
  choice: ama ni Aram
  alternative: ninuno ni Aram
  rationale: Likas na nangangahulugang “ama ni Aram” ang Hebreo. Gayunman, maaaring gamitin ang “ama” sa talaangkanan para sa ninuno o pinagmulan; inilagay ang posibilidad na iyon sa talababa nang hindi pinapalitan ang tuwirang pagbasa sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong pira-piraso ng talata dahil pagpapatuloy ito ng listahan mula sa naunang talata. Inilagay ang talababa pagkatapos ng “Aram,” kung saan naroon ang tunay na leksikal na alternatibo.
