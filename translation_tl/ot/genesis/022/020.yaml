  yaml_path: translation/ot/genesis/022/020.yaml
  text: After these things, it was reported to Abraham, saying, “Look, Milcah also has borne sons to your brother Nahor:”
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito, ibinalita kay Abraham, “Narito, nagsilang din si Milca ng mga anak na lalaki kay Nahor na kapatid mo:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Pagkatapos ng mga pangyayaring ito
  rationale: Ang דְּבָרִים ay maaaring tumukoy sa mga bagay, salita, o pangyayari; sa salaysay na ito, natural at tumpak ang “mga pangyayari.”
- source_word: וַיֻּגַּד לְאַבְרָהָם
  choice: ibinalita kay Abraham
  rationale: Pinananatili ang impersonal na balintiyak ng Hebreo nang hindi nagdaragdag kung sino ang naghatid ng balita.
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang pantawag-pansin ng Hebreo sa isang maikli at marangal na anyong Filipino.
- source_word: יָלְדָה ... בָּנִים
  choice: nagsilang ... ng mga anak na lalaki
  rationale: Tahasang ipinahahayag ng בָּנִים na mga lalaking anak ang isinilang.
- source_word: לְנָחוֹר אָחִיךָ
  choice: kay Nahor na kapatid mo
  rationale: Pinananatili ang ugnayang ipinahahayag ng לְ at ang tuwirang pagtukoy kay Nahor bilang kapatid ni Abraham.
