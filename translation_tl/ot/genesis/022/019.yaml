base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/019.yaml
  text: So Abraham returned to his young men[a], and they arose and went together to Beersheba, and Abraham stayed in Beersheba.
translation:
  language: tl
  text: Kaya bumalik si Abraham sa kanyang mga binata[a]. Tumindig sila at sama-samang pumunta sa Beer-seba. At nanirahan si Abraham sa Beer-seba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Bumalik si Abraham sa kanyang mga binata.” Hindi binanggit si Isaac sa sugnay na ito, bagaman naroon siya sa naunang salaysay.'
    reason: Pinananatili ang kapansin-pansing hindi pagbanggit kay Isaac nang hindi nilulutas ang kahulugan nito.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Tuwirang ipinapahayag ng qal wayyiqtol ng שׁוב ang pagbabalik at natural ito sa makabagong salaysay sa Tagalog.
- source_word: נְעָרָיו
  choice: kanyang mga binata
  rationale: Maaaring tumukoy ang נַעַר sa kabataan, lingkod, o tagapaglingkod. Ang “mga binata” ay nagpapanatili sa leksikal na anyo nang hindi higit na tinutukoy ang kanilang katayuan, bagaman sila ang mga kasama ni Abraham sa 22:3, 5.
- source_word: וַיָּקֻמוּ
  choice: Tumindig sila
  rationale: Sa salaysay, ipinahihiwatig ng קום ang pagtayo upang simulan ang kasunod na pagkilos. Ang “tumindig” ay dignificado at malinaw.
- source_word: וַיֵּלְכוּ יַחְדָּו
  choice: sama-samang pumunta
  rationale: Pinagsasama nito ang kilos ng הלך at ang pagkakaisa ng יחדו nang hindi idinaragdag na naglakad sila.
- source_word: בְּאֵר שָׁבַע
  choice: Beer-seba
  rationale: Isinalin bilang transliteradong pangalang-pook, ayon sa karaniwang anyong Filipino at hindi ayon sa kahulugan ng pangalan.
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Sa kontekstong heograpiko, ang ישׁב ay tumutukoy sa paninirahan o pananatili sa isang lugar. Ang “nanirahan” ay natural at hindi sinauna, habang hindi kinakailangang magpahiwatig ng bagong pagtatatag ng tirahan.
theological_decisions:
- issue: Si Abraham lamang ang tahasang sinasabing bumalik mula sa bundok, bagaman naroon si Isaac sa naunang salaysay.
  choice: Hindi idinagdag si Isaac sa pangunahing teksto.
  alternative: Maaaring unawain na bumalik din si Isaac at nakatuon lamang kay Abraham ang pagkakasabi.
  rationale: Tahasan lamang na pinangalanan ng Hebreo si Abraham bilang bumalik sa mga binata. Pinananatili ng salin ang pagkakasabi at ang interpretatibong tensiyon sa halip na pagtugmain ito sa pamamagitan ng pagdaragdag kay Isaac.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling pangungusap upang maging natural ang sunod-sunod na Hebreong wayyiqtol; pinanatili ang [a] sa mismong teksto.
