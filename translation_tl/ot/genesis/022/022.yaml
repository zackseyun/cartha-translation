lexical_decisions:
- source_word: כֶּשֶׂד
  choice: Kesed
  rationale: Pangalang pantangi; tuwirang isinalin sa baybay na angkop sa modernong Filipino, na kumakatawan sa Hebreong k at s.
- source_word: חֲזוֹ
  choice: Hazo
  rationale: Pangalang pantangi; pinanatili ang kinikilalang anyong Hazo, na natural basahin sa Filipino.
- source_word: פִּלְדָּשׁ
  choice: Pildas
  rationale: Pangalang pantangi; ang pangwakas na Hebreong shin ay kinakatawan ng s, alinsunod sa karaniwang baybay-Filipino.
- source_word: יִדְלָף
  choice: Yidlaf
  rationale: Pangalang pantangi; ang panimulang yod ay kinakatawan ng y, at ang pangwakas na pe ay f, kaya malapit ito sa bigkas ng Hebreo at natural sa Filipino.
- source_word: בְּתוּאֵל
  choice: Betuel
  rationale: Pangalang pantangi; ginamit ang karaniwan at madaling makilalang anyong Filipino na Betuel.
- source_word: וְאֶת / וְאֵת
  choice: sina … at
  rationale: Ang inuulit na waw at pananda ng tuwirang layon ay bumubuo ng serye ng mga personal na pangalan. Sa Filipino, natural itong ihayag sa pamamagitan ng pangmaramihang panandang personal na “sina,” mga kuwit, at pangwakas na “at.”
