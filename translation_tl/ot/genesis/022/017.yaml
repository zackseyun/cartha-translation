  text: כִּֽי בָרֵ֣ךְ אֲבָרֶכְ/ךָ֗ וְ/הַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/כַ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֣ת הַ/יָּ֑ם וְ/יִרַ֣שׁ זַרְעֲ/ךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/017.yaml
  text: that I will surely bless you[a], and I will surely multiply your offspring like the stars of the heavens and like the sand that is on the seashore[c][b]; and your offspring will possess the gate of his enemies.
translation:
  language: tl
  text: na tunay kitang pagpapalain at lubha kong pararamihin ang iyong lahi[a], gaya ng mga bituin sa langit at gaya ng buhangin na nasa dalampasigan; at aangkinin ng iyong lahi ang pintuang-bayan ng kanyang mga kaaway.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “iyong binhi.” Ang salita ay isang kolektibong pangngalang isahan na maaaring tumukoy sa mga inapo bilang isang kabuuan.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “aangkinin ng iyong mga inapo ang pintuang-bayan ng kanilang mga kaaway.” Pinananatili ng Hebreo sa anyong isahan ang “lahi/binhi” at sinasabi nitong “kanyang mga kaaway.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: na tunay
  rationale: Sa konteksto ng panunumpa, ipinakikilala nito ang nilalaman ng pahayag at may diin; likas sa Tagalog ang “na tunay” kasunod ng naunang talata.
- source_word: בָרֵךְ אֲבָרֶכְךָ
  choice: tunay kitang pagpapalain
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin. Inihahatid ng “tunay” ang katiyakan nang hindi ginagaya nang mekanikal ang pag-uulit sa Hebreo.
- source_word: וְהַרְבָּה אַרְבֶּה
  choice: at lubha kong pararamihin
  rationale: Ang ikalawang infinitive absolute construction ay nagpapahayag ng matinding pagpaparami; natural at malinaw sa modernong Tagalog ang “lubha kong pararamihin.”
- source_word: זַרְעֲךָ
  choice: iyong lahi
  rationale: Ang זֶרַע ay kolektibong pangngalang isahan na tumutukoy sa mga inapo bilang isang kabuuan. Pinananatili ng “lahi” ang kolektibong diwa nang hindi gumagamit ng di-likas na literal na “binhi.”
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: gaya ng mga bituin sa langit
  rationale: Natural na Tagalog ito at tapat sa paghahambing at larawan ng Hebreo.
- source_word: וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: at gaya ng buhangin na nasa dalampasigan
  rationale: Inilalarawan ng שְׂפַת הַיָּם ang gilid o pampang ng dagat. Ang “dalampasigan” ay malinaw at likas, at pinananatili ng “na nasa” ang tahasang relative construction na אֲשֶׁר עַל.
- source_word: וְיִרַשׁ
  choice: at aangkinin
  rationale: Maaaring mangahulugan ang יָרַשׁ ng magmana, magmay-ari, o kumuha ng pag-aari. Sa konteksto ng pintuang-bayan ng mga kaaway, ipinahihiwatig ng “aangkinin” ang pagkuha at pagkontrol, hindi lamang karaniwang pagmamana.
- source_word: שַׁעַר
  choice: pintuang-bayan
  rationale: Ang pintuan ng lungsod ay sagisag at sentro ng kapangyarihan at pagkontrol. Mas malinaw ang “pintuang-bayan” kaysa sa payak na “pintuan” habang nananatili ang kongkretong larawan.
- source_word: אֹיְבָיו
  choice: kanyang mga kaaway
  rationale: Isahan ang hulaping panghalip sa Hebreo at tumutugma sa kolektibong-isahang זַרְעֲךָ. Pinananatili ng “kanyang” ang mahalagang tensiyong gramatikal na ito.
theological_decisions:
- issue: Kolektibong-isahang זֶרַע at isahang panghalip sa huling sugnay
  choice: “iyong lahi … kanyang mga kaaway”
  alternative: “iyong mga inapo … kanilang mga kaaway”
  rationale: Ginagamit ng Hebreo ang kolektibong pangngalang isahan at ang isahang hulaping panghalip. Pinananatili ng salin ang kolektibo-isahang anyo nang hindi ito sapilitang ipinapakahulugan bilang iisang indibidwal o bilang tahasang maramihan.
- issue: Kahulugan ng pag-angkin sa pintuang-bayan
  choice: Panatilihin ang larawan bilang “aangkinin … ang pintuang-bayan”
  alternative: “dadaigin ang kanyang mga kaaway”
  rationale: Ang mas malayang alternatibo ay nagpapaliwanag sa metonimiya ngunit binubura ang mismong larawan ng Hebreo. Pinananatili rito ang larawan at ang pahiwatig ng pamamahala o pagkontrol.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lahi” bilang natural na kolektibong katawagan, “pintuang-bayan” upang mapanatili ang sinaunang larawan, at magkaibang panuring na “tunay” at “lubha” upang maipahayag nang idiomatiko ang dalawang emphatic infinitive constructions.
