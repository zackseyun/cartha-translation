base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/024.yaml
  text: And his concubine[a], whose name was Reumah, also bore Tebah, Gaham, Tahash[b], and Maacah.
translation:
  language: tl
  text: At ang kanyang konkubina, na ang pangalan ay Reuma[a], ay nagsilang din[b] kina Teba, Gaham, Tahas, at Maaca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, mas literal: “at ang pangalan niya ay Reuma.”'
    reason: lexical_alternative
  - marker: b
    text: O “siya rin ay nagsilang,” na pinananatili ang tahasang panghalip at diin ng Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: At ang kinakasama niya
  rationale: Ang פִּילֶגֶשׁ ay isang babaeng kinakasama bilang asawang may mas mababang katayuan kaysa pangunahing asawa. Ang “kinakasama” ay likas sa modernong Filipino at pinananatili ang pagkakaiba ng katayuan nang hindi gumagamit ng masyadong teknikal o makalumang salita.
- source_word: וּשְׁמָהּ רְאוּמָה
  choice: si Reuma
  rationale: Sa Filipino, natural na ipakilala ang pangalan sa pamamagitan ng “si.” Hindi na kailangang isalin nang hiwalay ang pormal na Hebreong koordinasyon na “at ang pangalan niya,” ngunit itinatala ang literal na anyo sa talababa.
- source_word: וַתֵּלֶד
  choice: nagsilang
  rationale: Sa kontekstong talaangkanan, ang ילד ay tumutukoy sa panganganak. Ang “nagsilang” ay maikli, marangal, at natural.
- source_word: גַּם הִוא
  choice: ay nagsilang din
  rationale: Ipinahihiwatig ng “din” na bukod kay Milca sa naunang talata, nagkaanak din si Reuma. Ang tahasang panghalip na הִוא ay likas nang kinakatawan ng simuno sa Filipino; ang mas literal na diin ay inilagay sa talababa.
- source_word: טֶבַח וְגַּחַם וְתַּחַשׁ וּמַעֲכָה
  choice: Teba, Gaham, Tahas, at Maaca
  rationale: Isinalin ang mga pangalang pantangi ayon sa bigkas ng Hebreo at sa mga kumbensiyong karaniwan sa Filipino; ginamit ang “kina” upang natural na markahan ang maramihang tiyak na taong isinilang.
