translation_notes:
  register: Modernong Filipino na may marangal at payak na estilong talaangkanan. Ginamit ang “kinakasama” para sa isang babaeng may kinikilalang ugnayang tulad-asawa ngunit mas mababa ang katayuan kaysa pangunahing asawa; iniiwasan nito ang di-pamilyar na hiram na “konkubina.”
