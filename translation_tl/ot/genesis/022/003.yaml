  text: וַ/יַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּ/בֹּ֗קֶר וַֽ/יַּחֲבֹשׁ֙ אֶת חֲמֹר֔/וֹ וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י נְעָרָי/ו֙ אִתּ֔/וֹ וְ/אֵ֖ת יִצְחָ֣ק בְּנ֑/וֹ וַ/יְבַקַּע֙ עֲצֵ֣י עֹלָ֔ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ אֶל הַ/מָּק֖וֹם אֲשֶׁר אָֽמַר ל֥/וֹ הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/003.yaml
  text: Abraham rose early in the morning[a], saddled his donkey, took two of his young men with him and Isaac his son, split the wood for a burnt offering, and arose and went to the place that God had told him.
translation:
  language: tl
  text: Maagang bumangon si Abraham nang umagang iyon. Nilagyan niya ng siyan ang kaniyang asno, isinama ang dalawa sa kaniyang mga binata[a] at ang anak niyang si Isaac, at nagsibak ng kahoy para sa handog na sinusunog. Pagkatapos, bumangon siya at pumunta sa lugar na sinabi sa kaniya ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dalawa sa kaniyang mga lingkod” o “dalawa sa kaniyang mga tagapaglingkod.” Ang salitang Hebreo ay maaaring tumukoy sa mga binata o sa mga lalaking naglilingkod o umaalalay, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: Kinaumagahan, maagang bumangon
  rationale: Pinananatili ang diwa ng maagang pagbangon sa umaga at inilalahad ito sa natural na modernong Tagalog.
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: Inihanda niya ang kaniyang asno
  rationale: Sa konteksto, tumutukoy ang חבש sa paghahanda ng asno para sa paglalakbay, gaya ng pagkakabit ng panakyan o kagamitan; mas natural at hindi labis na tiyak ang “inihanda” sa Tagalog.
- source_word: שְׁנֵי נְעָרָיו
  choice: dalawa sa kaniyang mga binata
  rationale: Maaaring mangahulugan ang נְעָרִים ng mga binata o mga lalaking tagapaglingkod. Pinananatili ng “mga binata” ang pangunahing leksikal na diwa nang hindi tiyak na ipinapalagay ang katayuang alipin o lingkod.
- source_word: יִצְחָק בְּנוֹ
  choice: ang anak niyang si Isaac
  rationale: Natural na Tagalog na malinaw na pinananatili ang ugnayang ama at anak.
- source_word: וַיְבַקַּע עֲצֵי עֹלָה
  choice: nagsibak ng kahoy para sa handog na sinusunog
  rationale: Tumpak na inilalarawan ng “nagsibak” ang בקע, at ginagamit ang malinaw na katumbas ng terminong pansakripisyo na עֹלָה.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: tumindig siya at pumunta
  rationale: Pinananatili ang dalawang magkasunod na pandiwa at ang ritmo ng salaysay sa paraang natural sa Tagalog.
- source_word: הַמָּקוֹם אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: sa lugar na sinabi sa kaniya ng Diyos
  rationale: Direkta at natural na salin ng pook at ng naunang tagubilin ng Diyos.
theological_decisions:
- issue: Pagbibigay-kahulugan sa terminong pansakripisyo na עֹלָה
  choice: handog na sinusunog
  alternative: handog na lubos na sinusunog
  rationale: Ang “handog na sinusunog” ay malinaw at matatag na katumbas ng natatanging uri ng handog, nang hindi nagdaragdag ng paliwanag na wala sa mismong talata.
- issue: Katayuan ng dalawang נְעָרִים
  choice: mga binata
  alternative: mga lingkod / mga tagapaglingkod
  rationale: Hindi tahasang nilulutas ng konteksto kung pangunahing tinutukoy ang kanilang edad o tungkulin. Pinananatili sa pangunahing teksto ang leksikal na diwa, at inilalagay sa talababa ang mga posibleng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kaniyang” para sa malinaw at pormal na reperensiya, at hinati sa maiikling pangungusap ang mahabang serye ng mga pandiwang Hebreo upang maging natural ang daloy nang hindi nawawala ang pagkakasunod-sunod ng mga kilos.
