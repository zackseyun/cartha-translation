  text: And in your offspring all the nations of the earth will be blessed[a], because you have obeyed my voice.
translation:
  language: tl
  text: At sa iyong supling ay pagpapalain ang lahat ng bansa sa daigdig[a], sapagkat sinunod mo ang aking tinig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pagpapalain ng lahat ng bansa sa daigdig ang kanilang sarili sa iyong supling.” Maaaring unawain dito bilang reflexive ang pandiwang Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבָּרֲכוּ
  choice: pagpapalain
  rationale: Pinananatili ang malamang na pasibo o resultang diwa ng Hitpael sa pormula ng pangako, habang inilalagay sa talababa ang tunay na posibleng reflexive na pagbasa.
- source_word: בְזַרְעֲךָ
  choice: sa pamamagitan ng iyong supling
  rationale: Ang זֶרַע ay kolektibong pangngalan na maaaring tumukoy sa supling o mga inapo. Natural sa modernong Tagalog ang “supling,” at ang “sa pamamagitan ng” ay malinaw na naghahayag ng ugnayan ng pagpapala nang hindi tinutukoy kung iisa o marami ang tinutukoy ng kolektibong salita.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: ang lahat ng bansa sa daigdig
  rationale: Direktang ipinapahayag ng “mga bansa” ang גּוֹיִם, at ipinananatili ng “sa daigdig” ang pandaigdig na saklaw.
- source_word: עֵקֶב אֲשֶׁר
  choice: sapagkat
  rationale: Maikli, natural, at marangal na panandang sanhi sa Tagalog.
- source_word: שָׁמַעְתָּ בְּקֹלִי
  choice: sinunod mo ang aking tinig
  rationale: Ang Hebreong idyoma ay tumutukoy sa pakikinig na humahantong sa pagsunod; pinananatili ng “aking tinig” ang kongkretong larawan ng orihinal.
theological_decisions:
- issue: Diwa ng Hitpael ng ברך sa pangako kay Abraham
  choice: Ang lahat ng bansa ay tatanggap ng pagpapala sa pamamagitan ng supling ni Abraham (“pagpapalain”).
  alternative: Pagpapalain ng lahat ng bansa ang kanilang sarili sa pamamagitan ng supling ni Abraham.
  rationale: Mas angkop sa konteksto ng pangako ang pasibo o resultang diwa, ngunit hindi tiyak na inaalis ng anyong Hebreo ang reflexive na pagbasa; kaya pinanatili ang alternatibo sa talababa nang hindi ipinapasok ang mga doktrinal na konklusyon mula sa ibang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “sapagkat” at “aking tinig” upang mapanatili ang dignidad at Hebreong larawan, habang ang “sa pamamagitan ng iyong supling” ay madaling maunawaan ng karaniwang mambabasa.
