base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/009.yaml
  text: Then they came to the place that God had told him[a], and Abraham built the altar there and arranged the wood. He bound Isaac his son and placed him on the altar[c][b], on top of the wood.
translation:
  language: tl
  text: Pagdating nila sa lugar na sinabi sa kanya ng Diyos[a], itinayo roon ni Abraham ang altar[b] at inayos ang mga kahoy. Ginapos niya ang anak niyang si Isaac at inilagay siya sa altar, sa ibabaw ng mga kahoy.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin: “sa lugar na sinabi ng Diyos sa kanya.” Tinutukoy ng “kanya” si Abraham.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “ang altar.” Maaari ring likas na ipahayag sa Tagalog na “nagtayo roon si Abraham ng isang altar,” ngunit tiyak ang pantukoy sa Hebreo.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebreo: “sa itaas ng mga kahoy,” ibig sabihin, nakapatong sa ibabaw ng mga kahoy na inayos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Pagdating nila
  rationale: Isinusulong ng anyong pasalaysay ang pagkakasunod-sunod ng pangyayari, at pinananatili ng “nila” ang maramihang simuno—sina Abraham at Isaac.
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: na sinabi sa kanya ng Diyos
  rationale: Tinutukoy ng sugnay ang lugar ayon sa naunang sinabi ng Diyos kay Abraham. Likas sa Tagalog ang “sinabi sa kanya” at hindi nito dinaragdagan ang hindi tahasang nilalaman ng Hebreo.
- source_word: וַיִּבֶן שָׁם אַבְרָהָם אֶת הַמִּזְבֵּחַ
  choice: itinayo roon ni Abraham ang altar
  rationale: Pinananatili ng “ang altar” ang tiyak na pantukoy sa Hebreo at inilalarawan ito bilang partikular na altar na inihahanda para sa paghahandog.
- source_word: וַיַּעֲרֹךְ אֶת הָעֵצִים
  choice: at inayos ang mga kahoy
  rationale: Sa konteksto ng paghahandog, ang ערך ay tumutukoy sa maayos na paglalatag o paghahanda. Malinaw at natural ang “inayos.”
- source_word: וַיַּעֲקֹד
  choice: Ginapos niya
  rationale: Tuwirang ipinahahayag ng עקד ang paggapos. Pinananatili ng “ginapos” ang bigat ng kilos nang hindi ito pinalalambot o dinaragdagan.
- source_word: יִצְחָק בְּנוֹ
  choice: ang anak niyang si Isaac
  rationale: Natural na ayos ito sa modernong Tagalog at pinananatili ang tahasang pagkakakilanlan kay Isaac bilang anak ni Abraham.
- source_word: וַיָּשֶׂם אֹתוֹ עַל הַמִּזְבֵּחַ
  choice: at inilagay ito sa altar
  rationale: Malawak ang kahulugan ng שׂים bilang paglalagay. Hindi ipinapalagay ng “inilagay” ang paraang hindi binanggit sa teksto.
- source_word: מִמַּעַל לָעֵצִים
  choice: sa ibabaw ng mga kahoy
  rationale: Malinaw nitong ipinahahayag ang puwesto ni Isaac sa ibabaw ng mga kahoy na inayos sa altar.
theological_decisions:
- issue: Pagiging tiyak ng altar na inihahanda
  choice: ang altar
  alternative: isang altar
  rationale: May tiyak na pantukoy ang pangngalang Hebreo. Pinananatili ito nang hindi nagdaragdag ng simbolismong teolohikal na wala sa talata.
- issue: Paglalarawan sa ginawa kay Isaac
  choice: Ginapos niya ang anak niyang si Isaac
  alternative: Itinali niya ang anak niyang si Isaac
  rationale: Mas tiyak na katumbas ng pandiwang עקד ang “ginapos.” Hindi nito pinahihina ang kilos at hindi rin ito nilalagyan ng interpretasyong lampas sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang likas na ayos ng pangungusap sa Tagalog habang pinananatili ang sunod-sunod na kilos, ang maramihang simuno sa pagdating, at ang tahasang bigat ng paggapos kay Isaac.
