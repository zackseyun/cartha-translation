revisions:
- from: At sinabi niya, “Isama mo nga ang iyong anak, ang iyong nag-iisa[a], na minamahal mo—si Isaac—at pumunta ka sa lupain ng Moria. Doon, ialay mo siya bilang handog na sinusunog sa isa sa mga bundok na sasabihin ko sa iyo.”
  to: At sinabi niya, “Dalhin mo nga ang iyong anak, ang iyong bukod-tangi[a], na minamahal mo—si Isaac—at pumunta ka sa lupain ng Moria. Doon, ialay mo siya bilang handog na sinusunog sa isa sa mga bundok na sasabihin ko sa iyo.”
  rationale: Pinalitan ang di-idiomatikong “ang iyong nag-iisa” ng “ang iyong bukod-tangi” upang maipahayag nang natural ang natatangi at mariing katayuan ni Isaac, nang hindi nilulutas ang tensiyon kaugnay ng pagkakaroon ni Abraham ng isa pang anak. Pinalitan din ang “Isama mo nga” ng “Dalhin mo nga” para sa mas tuwirang katumbas ng utos na לקח. Hindi binago ang kahulugan ng talata o ang footnote anchor.
