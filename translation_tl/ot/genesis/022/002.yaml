  text: וַ/יֹּ֡אמֶר קַח נָ֠א אֶת בִּנְ/ךָ֨ אֶת יְחִֽידְ/ךָ֤ אֲשֶׁר אָהַ֨בְתָּ֙ אֶת יִצְחָ֔ק וְ/לֶךְ לְ/ךָ֔ אֶל אֶ֖רֶץ הַ/מֹּרִיָּ֑ה וְ/הַעֲלֵ֤/הוּ שָׁם֙ לְ/עֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽ/הָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/002.yaml
  text: And he said[a], “Please take your son, your only one, whom you love—Isaac—and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains that I will tell you.”
translation:
  language: tl
  text: At sinabi niya, “Dalhin mo nga ang iyong anak, ang iyong bukod-tangi[a], na minamahal mo—si Isaac—at pumunta ka sa lupain ng Moria. Doon, ialay mo siya bilang handog na sinusunog sa isa sa mga bundok na sasabihin ko sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kaisa-isa mong anak.” Maaaring idiin ng Hebreong יְחִידְךָ ang pagiging nag-iisa o bukod-tangi; dito, itinatampok nito ang natatanging katayuan ni Isaac sa utos.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  choice: nga
  rationale: Sa utos na “Isama mo nga,” likas na pinalalambot ng “nga” ang pakiusap nang hindi ito ginagawang pormal o nagdaragdag ng temporal na diwa gaya ng “ngayon.”
- source_word: בִּנְךָ
  choice: iyong anak
  rationale: Tuwirang salin ng בֵּן na may hulaping tumutukoy sa kausap.
- source_word: יְחִידְךָ
  choice: iyong nag-iisa
  rationale: Pinananatili nito ang diin sa bukod-tanging katayuan ni Isaac nang hindi tahasang ipinapakahulugang wala nang ibang anak si Abraham.
- source_word: אֲשֶׁר אָהַבְתָּ
  choice: na minamahal mo
  rationale: Ipinahahayag ng anyong perpekto ang umiiral at kinikilalang pag-ibig ni Abraham kay Isaac; natural itong sabihin sa kasalukuyang panahunan sa Tagalog.
- source_word: וְלֶךְ לְךָ
  choice: at pumunta ka
  rationale: Natural na katumbas ng idyomatikong utos; hindi na pinalawak ang panghalip na nagbibigay ng personal na paglahok o diin.
- source_word: אֶרֶץ הַמֹּרִיָּה
  choice: lupain ng Moria
  rationale: Tuwiran at malinaw na salin ng אֶרֶץ bilang lupain o rehiyon.
- source_word: וְהַעֲלֵהוּ
  choice: ialay mo siya
  rationale: Sa konteksto ng עֹלָה, ang Hiphil ng עלה ay tumutukoy sa paghahandog; malinaw itong naipapahayag ng “ialay.”
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Karaniwang terminong pansakripisyo ang עֹלָה; malinaw at madaling maunawaan ang “handog na sinusunog” sa modernong Tagalog.
- source_word: עַל אַחַד הֶהָרִים
  choice: sa isa sa mga bundok
  rationale: Ipinakikita ng parirala na isang bundok mula sa ilang bundok ang hindi pa tinutukoy.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: na sasabihin ko sa iyo
  rationale: Pinananatili nito ang pandiwang אמר bilang “sasabihin,” sa halip na ipasok ang ibang diwang gaya ng “ipakikita.”
theological_decisions:
- issue: Ang kahulugan ng יְחִידְךָ kaugnay ni Isaac kahit may anak ding si Ismael si Abraham
  choice: ang iyong nag-iisa
  alternative: ang kaisa-isa mong anak
  rationale: Pinananatili ng salin ang bukod-tanging katayuan ni Isaac sa utos at ang tensiyon ng teksto, nang hindi ipinapasiya kung ang diin ay biyolohikal, pangako-tipanan, o ugnayang-emosyonal. Inilagay sa talababa ang tradisyonal at maaari ring saling “kaisa-isa mong anak.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nga” upang likas na katawanin ang pagpapalambot ng נָא. Ang mga sugnay ay nananatiling malapit sa pagkakasunod-sunod at retorikal na bigat ng Hebreo, habang iniiwasan ang tunog na lipas o sobrang literal.
