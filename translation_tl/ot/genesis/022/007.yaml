base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/007.yaml
  text: And Isaac said to Abraham his father[a], “My father!” And he said, “Here I am, my son.” And he said, “Look, the fire and the wood—but where is the sheep for a burnt offering?”
translation:
  language: tl
  text: Sinabi ni Isaac sa kanyang amang si Abraham, “Ama ko!” Sinabi ni Abraham, “Narito ako, anak ko.” Sinabi ni Isaac, “Tingnan mo, narito ang apoy at ang panggatong, ngunit nasaan ang hayop mula sa kawan[a] para sa handog na sinusunog?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring tumukoy sa tupa o kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sinabi / sumagot
  rationale: Ang אמר ay karaniwang pandiwa ng pagsasalita. Ginamit ang “sumagot” sa tugon ni Abraham upang maging likas sa Tagalog nang hindi binabago ang kahulugan.
- source_word: אָבִיו
  choice: kanyang ama
  rationale: Pinananatili ang tahasang ugnayang pampamilya at ang marangal na himig ng salaysay.
- source_word: אָבִי
  choice: Ama ko!
  rationale: Ipinahahayag ng hulaping unang panauhan ang “aking ama”; likas at madamdaming pantawag sa Tagalog ang “Ama ko!”
- source_word: הִנֶּנִי
  choice: Narito ako
  rationale: Pinananatili ang karaniwang pormula ng paghaharap ng sarili sa salaysay na Hebreo at ang pag-uugnay nito sa naunang mga talata.
- source_word: בְּנִי
  choice: anak ko
  rationale: Pinananatili ang possessive suffix at ang magiliw na tono ng pagtugon ni Abraham.
- source_word: הִנֵּה
  choice: Narito
  rationale: Itinuturo ng partikula ang mga bagay na kapwa nila nakikita; “Narito” ang likas na modernong katumbas sa kontekstong ito.
- source_word: הָאֵשׁ
  choice: ang apoy
  rationale: Tuwirang pinananatili ang tiyak na anyo ng pangngalan.
- source_word: הָעֵצִים
  choice: ang mga kahoy
  rationale: Pinananatili ang maramihang anyo ng Hebreo; malinaw sa konteksto na ang mga ito ang kahoy na gagamitin sa paghahandog.
- source_word: אַיֵּה
  choice: nasaan
  rationale: Ito ang likas na Tagalog na tanong tungkol sa kinaroroonan.
- source_word: הַשֶּׂה
  choice: ang tupa
  rationale: Ang “tupa” ang maikli at likas na katawagan sa hayop ng kawan sa kontekstong paghahandog, habang inilalahad sa talababa na maaaring mas malawak ang saklaw ng salitang Hebreo.
- source_word: לְעֹלָה
  choice: para sa handog na sinusunog
  rationale: Ipinapahayag nito ang layon at ang uri ng handog na lubos na sinusunog, gamit ang malinaw at karaniwang pananalitang Tagalog.
theological_decisions:
- issue: Saklaw ng katawagang pansakripisyo na הַשֶּׂה
  choice: tupa
  alternative: batang tupa o batang kambing / maliit na hayop mula sa kawan
  rationale: Hindi tiyak sa salitang Hebreo kung tupa o kambing ang tinutukoy. Ginamit ang likas na “tupa” sa pangunahing teksto ngunit pinanatili sa talababa ang mas malawak na kahulugan upang hindi magpanggap ng katiyakang wala sa pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Pinanatili ang pag-uulit at emosyonal na bigat ng pag-uusap, ngunit ginamit ang “sumagot” minsan para sa likas na daloy. Inilagay ang pananda ng talababa sa “tupa,” ang salitang aktuwal na nililinaw nito.
