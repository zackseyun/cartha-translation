- from: Sinabi ni Isaac kay Abraham na kanyang ama, “Ama ko!” Sumagot si Abraham, “Narito ako, anak ko.” Sinabi ni Isaac, “Narito ang apoy at ang mga kahoy, pero nasaan ang tupa[a] para sa handog na sinusunog?”
  to: Sinabi ni Isaac sa kanyang amang si Abraham, “Ama ko!” Sinabi ni Abraham, “Narito ako, anak ko.” Sinabi ni Isaac, “Tingnan mo, narito ang apoy at ang panggatong, ngunit nasaan ang hayop mula sa kawan[a] para sa handog na sinusunog?”
  rationale: Inayos ang pagtukoy kay Abraham bilang ama ni Isaac, ginawang “panggatong” ang kahoy sa konteksto ng apoy, at pinalawak ang salin ng שֶׂה upang mapanatili ang leksikal na saklaw ng Hebreo. Pinanatili ang talababa, ngayon ay nakaangkla sa “hayop mula sa kawan,” upang tukuyin ang karaniwang mga hayop na saklaw ng salita.
