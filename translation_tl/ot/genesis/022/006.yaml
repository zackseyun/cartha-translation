base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/006.yaml
  text: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
translation:
  language: tl
  text: Kinuha ni Abraham ang mga kahoy para sa handog na sinusunog at ipinatong ang mga iyon kay Isaac na kanyang anak. At dinala niya sa kanyang kamay ang apoy at ang kutsilyo. Magkasamang naglakad ang dalawa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצֵי הָעֹלָה
  choice: ang mga kahoy para sa handog na sinusunog
  rationale: Ang עֲצֵי ay anyong construct na tumutukoy sa kahoy na gagamitin sa עֹלָה. Likas sa modernong Tagalog ang “mga kahoy para sa,” at malinaw na naipapahayag ng “handog na sinusunog” ang kinikilalang uri ng handog.
- source_word: וַיָּשֶׂם עַל
  choice: ipinatong ang mga iyon kay
  rationale: Pinananatili ng “ipinatong” ang kongkretong kilos ng paglalagay ng kahoy sa katawan ni Isaac nang hindi dinaragdagan ang teksto ng tahasang paliwanag tungkol sa pagpasan.
- source_word: יִצְחָק בְּנוֹ
  choice: Isaac na kanyang anak
  rationale: Sinusundan nito ang ayos at diin ng Hebreo habang nananatiling malinaw at marangal sa Tagalog.
- source_word: בְּיָדוֹ
  choice: sa kanyang kamay
  rationale: Tuwirang pinananatili ang isahang “kamay” ng Hebreo.
- source_word: הָאֵשׁ
  choice: ang apoy
  rationale: Apoy mismo ang tahasang binabanggit ng Hebreo; hindi tinutukoy kung baga, sulo, o sisidlan ang ginamit sa pagdadala nito.
- source_word: הַמַּאֲכֶלֶת
  choice: ang kutsilyo
  rationale: Malinaw at natural ang “kutsilyo”; ipinahihiwatig na ng konteksto ng paghahandog ang gamit nito sa pagkatay.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: At magkasamang naglakad ang dalawa
  rationale: Pinananatili nito ang tahasang pagtukoy sa kanilang dalawa at ang diin ng יַחְדָּו sa kanilang magkasamang paglalakad.
theological_decisions:
- issue: Kahulugan ng terminong panghandog na עֹלָה
  choice: handog na sinusunog
  alternative: handog na paakyat
  rationale: Sa kontekstong ritwal, tumutukoy ang עֹלָה sa handog na lubusang sinusunog. Ang saling ito ay malinaw sa karaniwang mambabasa at hindi nagpapasok ng dagdag na interpretasyong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Pinili ang mga karaniwang salitang “kahoy,” “apoy,” at “kutsilyo,” habang pinananatili ang pisikal na larawan at payak na tensiyon ng tekstong Hebreo.
