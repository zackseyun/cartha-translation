base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/005.yaml
  text: And Abraham said to his young men[a], “Stay here with the donkey. I and the boy will go over there[b], and we will worship and return to you.”
translation:
  language: tl
  text: Sinabi ni Abraham sa mga binatang kasama niya, “Manatili kayo rito kasama ng asno. Kami ng bata ay pupunta roon, sasamba[a], at babalik sa inyo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “yuyukod” o “magpapatirapa”; ang pandiwang Hebreo ay maaaring tumukoy nang mas literal sa pagyukod o pagpapatirapa bilang pagsamba.
    reason: lexical_alternative
  - marker: b
    text: 'Literal na maramihan ang sinabi ni Abraham: “babalik kami sa inyo.” Hindi ipinaliliwanag ng teksto kung ito ay pagtatago ng kanyang balak, pagpapahayag ng kanyang inaasahan, o pagtitiwala sa paglalaan ng Diyos.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: נְעָרָיו
  choice: kanyang mga kabataang kasama
  rationale: Ang נַעַר ay maaaring tumukoy sa isang kabataan, lingkod, o kasamang tagapaglingkod. Ipinahihiwatig ng konteksto na sila ang dalawang lalaking sumama kay Abraham (tal. 3); pinananatili ng “mga kabataang kasama” ang diwa ng edad at tungkulin nang hindi ginagawang tiyak na mga alipin o opisyal na lingkod.
- source_word: שְׁבוּ לָכֶם פֹּה
  choice: Manatili kayo rito
  rationale: Bagaman maaaring literal na mangahulugang “maupo,” ang utos sa kontekstong ito ay manatili sila sa lugar at huwag nang sumama; ito ang likas na modernong Tagalog.
- source_word: עִם הַחֲמוֹר
  choice: kasama ng asno
  rationale: Ang חֲמוֹר ay karaniwang katawagan sa asno; malinaw at dignified ang salin.
- source_word: וַאֲנִי וְהַנַּעַר
  choice: Kami ng bata
  rationale: Likas sa Tagalog ang “kami ng bata” para sa “ako at ang bata” kapag hindi kabilang ang mga kausap. Tinutukoy ng נַעַר si Isaac at iniiwasan ng “bata” ang labis na pagtitiyak sa kanyang eksaktong edad.
- source_word: נֵלְכָה עַד כֹּה
  choice: ay pupunta roon
  rationale: Ipinapahayag ng parirala ang balak na pumunta sa isang hiwalay na lugar na itinuturo o tinutukoy; natural sa Tagalog ang “pupunta roon.”
- source_word: וְנִשְׁתַּחֲוֶה
  choice: sasamba
  rationale: Pangunahing kahulugan sa kontekstong ito ang pagsamba, bagaman ang pandiwa ay literal ding maaaring tumukoy sa pagyukod o pagpapatirapa; itinala ang pisikal na diwa sa talababa.
- source_word: וְנָשׁוּבָה אֲלֵיכֶם
  choice: at babalik sa inyo
  rationale: 'Pinananatili ang unang panauhang maramihan ng Hebreo: kapuwa kasama sina Abraham at Isaac sa ipinahayag na pagbabalik. Hindi idinagdag ang “pagkatapos” sapagkat sapat nang malinaw ang pagkakasunod at wala itong tahasang katumbas sa teksto.'
theological_decisions:
- issue: Maramihang pandiwa sa sinabi ni Abraham tungkol sa pagbabalik
  choice: 'Panatilihin ang payak na maramihan: “babalik sa inyo.”'
  alternative: Unawain ito bilang pagtatago ni Abraham ng kanyang balak, o bilang pagpapahayag ng pananampalatayang pareho silang makababalik.
  rationale: Maramihan ang anyo ng Hebreo kapuwa sa pagsamba at pagbabalik. Hindi ipinaliliwanag ng talata kung ito ay pagtatago, pag-asa, o pagtitiwala sa paglalaan ng Diyos, kaya hindi dapat lutasin ng salin ang nananatiling tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “kami” upang malinaw na hindi kabilang sa gagawa at babalik ang mga kausap. Ang mga panandang talababa ay inilagay mismo sa mga pariralang kanilang ipinaliliwanag.
