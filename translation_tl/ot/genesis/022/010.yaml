  yaml_path: translation/ot/genesis/022/010.yaml
  text: Then Abraham reached out his hand and took the knife to slaughter his son[a][b].
translation:
  language: tl
  text: Pagkatapos, iniunat ni Abraham ang kanyang kamay[a] at kinuha ang kutsilyo upang katayin ang kanyang anak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iniabot ang kanyang kamay.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Hebreo na isinaling “katayin” ay mas tiyak kaysa sa pangkalahatang salitang “patayin” at maaaring magpahiwatig ng pagkatay bilang paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: iniunat
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pag-uunat ng kamay, hindi sa pagpapadala. Likas at malinaw sa Filipino ang “iniunat ... ang kanyang kamay.”
- source_word: יָדוֹ
  choice: ang kanyang kamay
  rationale: Tuwirang isinasalin ang pangngalang isahan na may hulaping paari.
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Ang karaniwang kahulugang “kinuha” ay angkop sa payak na pagkakasunod-sunod ng salaysay at hindi nagdaragdag ng paraan o tindi ng paghawak.
- source_word: הַמַּאֲכֶלֶת
  choice: ang kutsilyo
  rationale: Ang salita ay tumutukoy sa kagamitang pamputol na ginagamit sa pagkatay. “Kutsilyo” ang pinakamalinaw at pinakanatural na katumbas sa modernong Filipino.
- source_word: לִשְׁחֹט
  choice: upang katayin
  rationale: Mas tiyak ang pandiwang ito kaysa sa pangkalahatang “patayin” at madalas itong gamitin sa pagkatay, kabilang ang paghahandog. Pinananatili ng “katayin” ang bigat at posibleng ritwal na pahiwatig ng salita.
- source_word: בְּנוֹ
  choice: ang kanyang anak
  rationale: Tuwirang salin ng pangngalan na may hulaping paari; hindi tinutukoy ng anyong Filipino ang kasarian, ngunit malinaw ito sa mas malawak na konteksto.
- source_word: וַ
  choice: Pagkatapos
  rationale: Isinusulong ng waw-consecutive ang sunod-sunod na kilos sa salaysay. Ipinapahayag ng “Pagkatapos” ang pagkakasunod nang natural sa Filipino.
theological_decisions:
- issue: Kung gagamit ng salitang may pahiwatig ng paghahandog para sa שָׁחַט
  choice: katayin
  alternative: patayin
  rationale: Dahil sa konteksto ng paghahandog at sa karaniwang gamit ng pandiwa para sa pagkatay, pinananatili ng “katayin” ang ritwal at emosyonal na bigat ng teksto nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinananatili ang payak ngunit mabigat na kilos ng salaysay. Ginamit ang “katayin” upang maingatan ang tiyak at posibleng sakripisyal na diwa ng Hebreo.
