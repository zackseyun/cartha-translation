revisions:
- from: Tumingala si Abraham at tumingin, at naroon sa likuran niya[a] ang isang lalaking tupa na nasabit ang mga sungay sa sukal. Lumapit si Abraham, kinuha ang lalaking tupa, at inihandog iyon bilang handog na sinusunog kapalit ng kanyang anak.[b]
  to: Tumingala si Abraham at tumingin, at naroon sa likuran niya[a] ang isang lalaking tupa na nasabit ang mga sungay sa sukal. Nagpunta si Abraham, kinuha ang lalaking tupa, at inihandog iyon bilang handog na sinusunog kapalit ng kanyang anak.[b]
  rationale: Pinalitan ang “Lumapit” ng “Nagpunta” upang tumpak na maipahayag ang payak na וַיֵּלֶךְ nang hindi nagdaragdag ng direksiyong wala sa pinagmulan. Walang ibang pagbabago sa kahulugan o sa mga talababa.
