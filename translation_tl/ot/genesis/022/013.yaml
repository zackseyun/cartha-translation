  text: וַ/יִּשָּׂ֨א אַבְרָהָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ וְ/הִנֵּה אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז בַּ/סְּבַ֖ךְ בְּ/קַרְנָ֑י/ו וַ/יֵּ֤לֶךְ אַבְרָהָם֙ וַ/יִּקַּ֣ח אֶת הָ/אַ֔יִל וַ/יַּעֲלֵ֥/הוּ לְ/עֹלָ֖ה תַּ֥חַת בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/013.yaml
  text: Then Abraham lifted up his eyes and looked[a], and behold, behind him was a ram caught in the thicket by its horns[b]. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: tl
  text: Tumingala si Abraham at tumingin, at naroon sa likuran niya[a] ang isang lalaking tupa na nasabit ang mga sungay sa sukal. Nagpunta si Abraham, kinuha ang lalaking tupa, at inihandog iyon bilang handog na sinusunog kapalit ng kanyang anak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa likuran”; walang tahasang “niya” sa tekstong Hebreo.
    reason: lexical_alternative
  - marker: b
    text: O “sa lugar ng kanyang anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: Tumingala
  rationale: Likas na salin sa makabagong Tagalog ng idyomang Hebreo na literal na ‘itinaas ang kanyang mga mata,’ habang pinananatili ang kilos ng pagtataas ng tingin.
- source_word: וַיַּרְא
  choice: at tumingin
  rationale: Pinananatili ang magkakasunod na kilos sa Hebreo—pagtanaw pataas at pagkatapos ay pagtingin—sa halip na pagsamahin ang mga ito.
- source_word: וְהִנֵּה
  choice: at naroon
  rationale: Ipinahihiwatig ang biglaang pagtawag-pansin ng Hebreong pangmarka nang natural sa Tagalog.
- source_word: אַיִל
  choice: lalaking tupa
  rationale: Tumpak at madaling maunawaang katawagan sa adultong lalaking tupa sa konteksto ng paghahandog.
- source_word: אַחַר
  choice: sa likuran niya
  rationale: Pinili ang lokatibong kahulugan na pinakanababagay sa tagpo. Idinagdag ang ‘niya’ para sa likas na Tagalog, bagaman walang tahasang panghalip sa tekstong katinig.
- source_word: נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו
  choice: nasabit ang mga sungay sa sukal
  rationale: Natural na inilalarawan sa Tagalog na ang mga sungay ang bahaging nasabit sa makapal at buhol-buhol na halaman.
- source_word: וַיַּעֲלֵהוּ לְעֹלָה
  choice: inihandog iyon bilang handog na sinusunog
  rationale: Malinaw na ipinapahayag ang sakripisyal na kahulugan ng pandiwa at ng עֹלָה nang hindi nagdaragdag ng paliwanag na wala sa talata.
- source_word: תַּחַת בְּנוֹ
  choice: kapalit ng kanyang anak
  rationale: Tuwirang ipinapahayag ang kahulugang pamalit o substitution ng תַּחַת sa kontekstong ito.
theological_decisions:
- issue: Kahulugang pamalit ng תַּחַת בְּנוֹ
  choice: kapalit ng kanyang anak
  alternative: sa lugar ng kanyang anak
  rationale: Malinaw sa salaysay na ang lalaking tupa ang inihandog bilang kahalili ng anak. Pinananatili ng salin ang puntong ito nang hindi ikinakabit ang anumang mas huling doktrinal na pagpapaliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘sukal’ bilang maikli at likas na katumbas ng masukal at buhol-buhol na halaman, at ‘handog na sinusunog’ bilang malinaw na katawagan sa עֹלָה.
