    issue: “Lumapit si Abraham” para sa וַיֵּלֶךְ
    rationale: Ang Hebreo ay nagsasaad lamang na si Abraham ay nagpunta; hindi nito tinutukoy na lumapit siya. Ang “Nagpunta si Abraham” ay pinapanatili ang hindi-tiyak na direksiyon ng pandiwa.
