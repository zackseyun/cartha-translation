  yaml_path: translation/ot/genesis/022/008.yaml
  text: And Abraham said[a], “God will provide for himself the lamb for a burnt offering, my son.” So the two of them went on together.
translation:
  language: tl
  text: At sinabi ni Abraham, “Maglalaan[a] ang Diyos para sa sarili niya ng kordero para sa handog na sinusunog, anak ko.” At magkasamang nagpatuloy ang dalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Makikita ng Diyos para sa sarili niya ang kordero para sa handog na sinusunog.” Ang pandiwang Hebreo ay maaaring mangahulugang “makita” o, bilang idyoma rito, “maglaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng waw-consecutive nang hindi labis na tinutukoy ang eksaktong ugnayang temporal.
- source_word: אֱלֹהִים
  choice: Ang Diyos
  rationale: Likas at malinaw na katumbas sa modernong Tagalog para sa Diyos na tinutukoy ni Abraham.
- source_word: יִרְאֶה לּוֹ
  choice: ang maglalaan para sa sarili niya
  rationale: Ang ראה ay literal na “makikita,” ngunit sa idyomang ito ay nangangahulugang “titingnan ang kailangan” o “maglalaan.” Isinasama ng “para sa sarili niya” ang לּוֹ at pinananatili ang personal na pagkilos ng Diyos nang hindi nilulutas kung makahula, mapagpaliban, o kapwa ang pahayag.
- source_word: הַשֶּׂה
  choice: ng kordero
  rationale: Ang שֶׂה ay maliit na hayop mula sa kawan, tupa man o kambing. Ang “kordero” ang pinakanatural sa kontekstong handog at kaayon ng tanong ni Isaac, bagaman mas malawak ang salitang Hebreo.
- source_word: לְעֹלָה
  choice: handog na sinusunog
  rationale: Malinaw na modernong Tagalog para sa עֹלָה, ang handog na buong sinusunog.
- source_word: בְּנִי
  choice: anak ko
  rationale: Pinananatili ang tuwirang, magiliw, at emosyonal na pagtawag ni Abraham kay Isaac.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: At nagpatuloy silang dalawa nang magkasama
  rationale: Pinananatili ang pag-uulit at diin ng Hebreo sa kanilang dalawa at sa magkasama nilang pagpapatuloy.
theological_decisions:
- issue: Kahulugan ng sinabi ni Abraham tungkol sa gagawin ng Diyos
  choice: Ang Diyos ang maglalaan para sa sarili niya ng kordero
  alternative: Makikita ng Diyos para sa sarili niya ang kordero / Titingnan ng Diyos ang kailangan para sa kordero
  rationale: Ipinahihintulot ng Hebreo ang literal na “makikita,” ngunit idyomatiko rito ang diwang paglalaan. Ang “para sa sarili niya” ay sumasalamin sa לּוֹ at pinananatili ang tensiyon ng salaysay nang hindi ipinapasiya kung ang sinabi ni Abraham ay pag-iwas, propesiya, o pareho.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “handog na sinusunog” bilang madaling maunawaang terminong pansakripisyo. Inilagay ang panandang [a] sa hulihan ng talata upang hindi maputol ang sinabi ni Abraham habang malinaw na tumutukoy ang talababa sa salitang “maglalaan.”
