  text: And the angel of Yahweh called to Abraham a second time from heaven,[a]
translation:
  language: tl
  text: At sa ikalawang pagkakataon, tinawag ng anghel ni Yahweh[a] si Abraham mula sa langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: At muling tinawag
  rationale: Isinusulong ng wayyiqtol ang salaysay bilang kasunod na pangyayari. Likas sa Tagalog ang “tinawag” para sa tuwirang pakikipag-usap; isinama rito ang diwa ng שֵׁנִית bilang “muling.”
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאָךְ ng “sugo” o “anghel.” Sa paulit-ulit na pormulang ito sa Genesis na tumutukoy sa makalangit na nilalang, natural ang “anghel,” habang pinananatili sa talababa ang leksikal na alternatibong “sugo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan sa Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל אַבְרָהָם
  choice: si Abraham
  rationale: Sa pandiwang “tinawag,” natural na Tagalog ang tuwirang pagmamarka sa taong tinatawag gamit ang “si”; hindi kailangang kopyahin ang Hebreong pang-ukol na אֶל bilang “kay.”
- source_word: שֵׁנִית
  choice: muling
  rationale: Ang “muling” ay natural at malinaw na nagpapahiwatig ng ikalawang pagtawag sa konteksto, bagaman maaari ring isalin nang mas tahasan bilang “sa ikalawang pagkakataon.”
- source_word: מִן הַשָּׁמַיִם
  choice: mula sa langit
  rationale: Bagaman anyong maramihan ang שָׁמַיִם, ang “langit” ang natural na katumbas sa idyomang ito at angkop sa pinagmumulan ng makalangit na tinig.
theological_decisions:
- issue: Pagbibigay-kahulugan sa מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: sugo ni Yahweh
  rationale: Isinalin ang parirala ayon sa karaniwang gamit nito sa salaysay nang hindi ipinapasiya kung ang anghel ay isang nilikhang sugo o isang natatanging pagpapakita ng Diyos. Pinananatili ng talababa ang leksikal at teolohikal na puwang ng “sugo.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “muling” para sa natural na daloy ng salaysay at “mula sa langit” para sa karaniwang idyomang Filipino.
