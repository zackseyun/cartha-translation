    issue: “lahat ng kamelyo ng lalaki”
    rationale: Ang לְכָל גְּמַלָּיו ay “para sa lahat ng kanyang/mga kamelyo niya,” na may panghalip na panlalaki sa Hebreo. Ang “ng lalaki” ay nagiging di-likas at nagpapasok ng isang leksikal na pangngalan na wala sa pinagmulan. Hindi naipapahayag ng Tagalog ang kasarian sa panghalip, kaya dapat panatilihin ang likas na panghalip at hayaang ang naunang konteksto ang magtukoy ng tinutukoy nito.
