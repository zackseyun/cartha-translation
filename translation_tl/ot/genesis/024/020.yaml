translation:
  language: tl
  text: Agad niyang ibinuhos ang laman ng kanyang banga sa painuman[a]. Muli siyang tumakbo sa balon upang sumalok ng tubig, at sumalok siya para sa lahat ng kamelyo niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa labangang painuman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Agad niyang
  rationale: Ipinahahayag ng pandiwa ang mabilis at maagap na pagkilos; natural sa makabagong Tagalog ang “Agad niyang.”
- source_word: וַתְּעַר כַּדָּהּ
  choice: ibinuhos ang laman ng kanyang banga
  rationale: Ang pandiwang ערה ay tumutukoy sa pagbubuhos o pag-aalis ng laman. Nililinaw ng “ang laman” na tubig ang ibinuhos, hindi ang mismong banga.
- source_word: הַשֹּׁקֶת
  choice: painuman
  rationale: Tumutukoy ito sa sisidlan o labangang pinaiinuman sa mga hayop; “painuman” ang maikli at likas na katumbas sa konteksto.
- source_word: וַתָּרָץ עוֹד
  choice: Muli siyang tumakbo
  rationale: Pinananatili ng “muli” ang diwa ng pag-uulit sa עוֹד, at tuwirang isinasalin ng “tumakbo” ang pandiwa.
- source_word: הַבְּאֵר
  choice: balon
  rationale: Ang בְּאֵר ay karaniwang balon sa salaysay na ito.
- source_word: לִשְׁאֹב
  choice: upang sumalok ng tubig
  rationale: Ang pandiwa ay pagsalok o pag-igib mula sa balon. Idinagdag ang “tubig” bilang likas at kontekstuwal na layon sa Tagalog.
- source_word: וַתִּשְׁאַב
  choice: sumalok siya
  rationale: Pinananatili ang inuulit na pandiwa ng Hebreo at ang pagkakasunod-sunod ng mga kilos.
- source_word: לְכָל גְּמַלָּיו
  choice: para sa lahat ng kamelyo ng lalaki
  rationale: Pinananatili ng “lahat” ang kabuuang saklaw ng כָּל. Ginawang tahasang “ng lalaki” ang panghalip upang maging malinaw at natural sa nakahiwalay na talata.
