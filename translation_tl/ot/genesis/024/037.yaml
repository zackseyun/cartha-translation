translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “amo” upang malinaw na taong nakatataas ang tinutukoy, at “mapapangasawa” upang maipahayag nang natural ang konteksto ng pag-aasawa. Iningatan sa talababa ang isahang kolektibong anyo at ang alternatibong pagbasa ng huling sugnay.
