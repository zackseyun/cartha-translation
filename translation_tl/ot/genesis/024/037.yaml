  text: And my master made me swear[a], saying, ‘You shall not take a wife for my son from the daughters of the Canaanites, in whose land I am dwelling.’
translation:
  language: tl
  text: At pinasumpa ako ng aking amo, na nagsabi, ‘Huwag kang kumuha para sa aking anak ng asawa mula sa mga babaeng Cananeo, na sa lupain ng mga Cananeo ako naninirahan.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבִּעֵנִי
  choice: pinasumpa ako
  rationale: Ang Hiphil ng שׁבע ay nagsasaad na pinanumpa o inilagay sa ilalim ng panunumpa ang isang tao. Natural at malinaw sa makabagong Tagalog ang “pinasumpa ako.”
- source_word: אֲדֹנִי
  choice: amo ko
  rationale: Tinutukoy ng lingkod ang kaniyang taong nakatataas, si Abraham, hindi ang Diyos. Iniiwasan ng “amo ko” ang posibleng kalituhan ng “panginoon ko.”
- source_word: לֵאמֹר
  choice: Sinabi niya
  rationale: Ipinakikilala nito ang tuwirang pananalita. Mas natural sa salaysay na Tagalog ang hiwalay na “Sinabi niya” kaysa sa literal na “na sinasabi.”
- source_word: לֹא תִקַּח
  choice: Huwag kang kumuha
  rationale: May lakas itong pagbabawal sa konteksto ng sumpa at tagubilin. Pinananatili ng “Huwag kang kumuha” ang tuwirang utos.
- source_word: אִשָּׁה לִבְנִי
  choice: mapapangasawa para sa anak ko
  rationale: Sa konteksto, ang אִשָּׁה ay isang babaeng kukunin bilang asawa. Ang “mapapangasawa” ay malinaw at natural, at hindi nagdaragdag ng pangalang Isaac na wala sa talata.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: mula sa mga babaeng Cananeo
  rationale: Ang literal na idyomang “mga anak na babae ng Cananeo” ay likas na tumutukoy sa mga babaeng kabilang sa bayang Cananeo. Ang mas maikling anyo ay natural sa kasalukuyang Tagalog habang pinananatili ang etnikong pagtukoy.
- source_word: אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  choice: na sa lupain nila ako naninirahan
  rationale: Pinananatili nito ang tahasang pagtukoy ng Hebreo sa lupain at ang patuloy na paninirahan. Ginawang maramihan ang panghalip sa Tagalog dahil kolektibo ang isahang “Cananeo” sa Hebreo.
