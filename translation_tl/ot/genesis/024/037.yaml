revisions:
- from: At pinasumpa ako ng amo ko. Sinabi niya, ‘Huwag kang kumuha ng mapapangasawa para sa anak ko mula sa mga babaeng Cananeo[a], na sa lupain nila ako naninirahan.’
  to: At pinasumpa ako ng aking amo, na nagsabi, ‘Huwag kang kumuha para sa aking anak ng asawa mula sa mga babaeng Cananeo, na sa lupain ng mga Cananeo ako naninirahan.’
  rationale: Inayos ang pananalita upang mas tuwirang maipahayag ang “asawa para sa aking anak” at upang malinaw na ang lupain ay lupain ng kolektibong bayang Cananeo. Pinanatili ang modernong ngunit marangal na rehistro, ang pagkakaiba ng taong “amo” at ng Diyos, at ang ambigwidad/katangiang kolektibo ng isahang Hebreong anyo sa talababa.
