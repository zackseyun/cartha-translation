lexical_decisions:
- source_word: וַיֹּאמַר
  choice: At sinabi niya
  rationale: Isinusulong ng waw-consecutive ang salaysay; pinananatili ng “At sinabi niya” ang payak na daloy nang hindi dinaragdagan ang ugnayang lohikal.
- source_word: עֶבֶד
  choice: lingkod
  rationale: Maaaring mangahulugan ang עֶבֶד ng “lingkod” o “alipin.” Sa magalang na pagpapakilala niya bilang kasapi ng sambahayan ni Abraham, natural sa konteksto ang “lingkod,” habang inilalagay sa talababa ang mas tahasang alternatibo.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Ginamit ang nakagawiang anyo ng pangalang Abraham sa modernong Filipino.
- source_word: אָנֹכִי
  choice: Ako ay
  rationale: Ang malayang panghalip ay nagbibigay-diin sa pagkakakilanlan ng nagsasalita; natural itong ipinahayag sa Filipino bilang “Ako ay.”
