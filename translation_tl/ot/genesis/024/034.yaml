  text: And he said[a], “I am Abraham’s servant.”
translation:
  language: tl
  text: At sinabi niya, “Ako ay lingkod ni Abraham.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ako ay alipin ni Abraham.”
