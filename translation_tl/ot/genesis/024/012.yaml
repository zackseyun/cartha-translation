base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/012.yaml
  text: And he said[a], “O Yahweh, God of my master Abraham, please grant success before me today[c][b], and show steadfast love to my master Abraham.”
translation:
  language: tl
  text: At sinabi niya, “Yahweh, Diyos ng panginoon kong si Abraham, ipagkaloob mong mangyari ito sa harap ko ngayon[a], at magpakita ka ng tapat na pag-ibig sa panginoon kong si Abraham[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pangyarihin mo sana ito sa harap ko ngayon.” Hinihiling ng pandiwang Hebreo na ipangyari ng Diyos ang inaasahang pagtatagpo.
    reason: lexical_alternative
  - marker: b
    text: Ang “tapat na pag-ibig” ay salin ng Hebreong hesed, na maaari ring tumukoy sa tapat na kabaitan o katapatan sa tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinalin ang banal na pangalang YHWH bilang “Yahweh,” alinsunod sa anyo ng pangalang nasa tekstong Hebreo.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Diyos ng panginoon kong si Abraham
  rationale: Ipinapanatili ang ugnayang paari at ang pananalita ng isang lingkod tungkol kay Abraham; natural at marangal sa Tagalog ang “panginoon ko” sa kontekstong ito.
- source_word: הַקְרֵה נָא לְפָנַי הַיּוֹם
  choice: loobin mo, sana, na magtagumpay ako ngayon
  rationale: Ang Hiphil imperative ng קרה ay kahilingang ipagkaloob o pangyarihin ng Diyos ang kanais-nais na pagtatagpo. Ang “magtagumpay ako” ay natural sa modernong Tagalog at ipinahihiwatig ang hinihinging mabuting kinalabasan, habang nililinaw ng talababa ang mas literal na larawan.
- source_word: וַעֲשֵׂה חֶסֶד
  choice: magpakita ka ng tapat na pag-ibig
  rationale: Ang חֶסֶד ay higit sa karaniwang kabaitan at may diwa ng matatag at tapat na pagmamalasakit; hindi naman ito nililimitahan sa isang teknikal na doktrinal na kahulugan.
- source_word: עִם אֲדֹנִי אַבְרָהָם
  choice: sa panginoon kong si Abraham
  rationale: Bagaman literal na “kasama/kay,” ang “magpakita ... sa” ang natural na Tagalog na katambal ng pariralang pandiwa.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Nasa talata mismo ang Tetragrammaton, kaya pinananatili ang personal na banal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng kahulugan ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: kabaitan; tapat na kabutihan; katapatan sa tipan
  rationale: Pinananatili nito ang diwa ng matatag at tapat na pagmamahal nang hindi sapilitang ginagawang tahasang teknikal ang pagtukoy sa tipan.
- issue: Kahulugan ng הַקְרֵה sa panalangin
  choice: loobin ... na magtagumpay ako
  alternative: pangyarihin mo ito sa harap ko; ipagkaloob mong mangyari ito
  rationale: Ipinahahayag ng pangunahing salin ang kahilingan para sa tagumpay, ngunit hindi ikinakaila ang mas literal na diwang hinihiling sa Diyos na pangyarihin ang inaasahang pagtatagpo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “O Yahweh” bilang anyong panawag at “loobin mo, sana” upang mapanatili ang magalang at mapanalanging lakas ng נָא. Ang mga tunay na alternatibong kahulugan ng הַקְרֵה at חֶסֶד ay inilagay sa mga talababa.
