id: GEN.24.51
reference: Genesis 24:51
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הִנֵּֽה רִבְקָ֥ה לְ/פָנֶ֖י/ךָ קַ֣ח וָ/לֵ֑ךְ וּ/תְהִ֤י אִשָּׁה֙ לְ/בֶן אֲדֹנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/051.yaml
  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
translation:
  language: tl
  text: “Narito si Rebeca sa harap mo. Isama mo siya at umalis ka, at maging asawa siya[a] ng anak ng iyong panginoon, ayon sa sinabi ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at maging asawa nawa siya.”
    reason: Ipinakikita ng alternatibo ang maaaring mas hayag na paghahayag ng hangarin sa Hebreong jussive.
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Pantawag-pansin ito sa taong naroon at handang sumama; ang “Narito” ay malinaw, marangal, at likas sa makabagong Tagalog.
- source_word: רִבְקָה
  choice: Rebeca
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Tagalog.
- source_word: לְפָנֶיךָ
  choice: sa harap mo
  rationale: Pinananatili ang kongkretong larawan ng Hebreo habang ipinahihiwatig na naroon si Rebeca at maaari na siyang isama.
- source_word: קַח וָלֵךְ
  choice: Isama mo siya at umalis ka
  rationale: Dalawang magkasunod na utos ang nasa Hebreo. Sa konteksto, ang “isama” ay mas likas kaysa sa literal na “kunin” para sa paghatid kay Rebeca sa magiging asawa niya.
- source_word: וּתְהִי אִשָּׁה
  choice: at maging asawa siya
  rationale: Ang anyong jussive ay nagpapahayag ng pagsang-ayon o hangarin. Pinananatili ng “maging asawa siya” ang puwersang ito nang hindi ginagawang tahasang hula o utos.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: ng anak ng iyong panginoon
  rationale: Likas sa Tagalog ang ganitong pagpapahayag ng ugnayang pangmag-asawa. Ang “panginoon” ay tumutukoy sa amo ng lingkod sa kontekstong ito.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: ayon sa sinabi
  rationale: Ipinahahayag nito na ang pasya ay kaayon ng naunang sinabi ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Ang puwersa ng jussive sa וּתְהִי
  choice: maging asawa siya
  alternative: maging asawa nawa siya
  rationale: Pinananatili ng pangunahing salin ang pagsang-ayon ng pamilya nang hindi labis na binibigyang-diin kung ito ay pahintulot o hangarin; inilalagay sa talababa ang mas hayag na anyong naghahayag ng hangarin.
- issue: Pagbanggit sa pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan mismo ng Diyos ang nasa tekstong Hebreo, kaya pangalan din ang ginamit sa salin at hindi isang pamalit na titulo.
translation_notes:
  register: Makabago at marangal na Tagalog ang ginamit. Ang “Isama mo siya” ay natural sa sitwasyon ng paglalakbay, samantalang ang “panginoon” ay pinanatili bilang tawag ng lingkod sa kaniyang amo. Inilagay ang panandang [a] sa mismong pariralang tinatalakay ng talababa.
