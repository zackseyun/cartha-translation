id: GEN.24.52
reference: Genesis 24:52
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר שָׁמַ֛ע עֶ֥בֶד אַבְרָהָ֖ם אֶת דִּבְרֵי/הֶ֑ם וַ/יִּשְׁתַּ֥חוּ אַ֖רְצָ/ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/052.yaml
  text: And when Abraham’s servant heard their words[c][b][a], he bowed down to the ground before Yahweh.
translation:
  language: tl
  text: Nang marinig ng lingkod ni Abraham ang sinabi nila, nagpatirapa siya sa lupa sa harap ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “yumukod siya hanggang sa lupa kay Yahweh.” Ang pandiwang Hebreo ay maaaring tumukoy sa malalim na pagyukod o pagpapatirapa bilang pagpapakita ng pagpipitagan o pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Likas na ipinapahayag sa Tagalog ang panandang pasalaysay at ang kaugnayang temporal nang hindi mekanikal na isinasalin ang idyomang Hebreo.
- source_word: שָׁמַע
  choice: marinig
  rationale: Tuwirang tumutukoy sa pagkarinig sa sinabi ng mga kausap.
- source_word: עֶבֶד אַבְרָהָם
  choice: lingkod ni Abraham
  rationale: Natural at tumpak na konstruksiyon sa Tagalog; hindi sentro rito ang posibleng kahulugang 'alipin' kundi ang tungkulin niya bilang kinatawan ng sambahayan.
- source_word: דִּבְרֵיהֶם
  choice: ang sinabi nila
  rationale: Mas natural sa modernong Tagalog kaysa sa literal na 'kanilang mga salita,' habang pinananatili ang diwa ng pahayag nila.
- source_word: וַיִּשְׁתַּחוּ
  choice: nagpatirapa siya
  rationale: Ipinahahayag ang malalim na pagyukod o pagpapatirapa nang hindi tahasang nilulutas bilang 'sumamba' ang maaaring relihiyosong diwa.
- source_word: אַרְצָה
  choice: sa lupa
  rationale: Pinananatili ang direksiyon at pisikal na larawan ng katawan na yumuyukod hanggang sa lupa.
- source_word: לַיהוָה
  choice: sa harap ni Yahweh
  rationale: Sa ugnayan nito sa pandiwa ng pagpapatirapa, natural na ipinahahayag sa Tagalog ang kilos na iniuukol kay Yahweh bilang 'sa harap ni Yahweh.'
theological_decisions:
- issue: Paglalarawan sa kilos ng וַיִּשְׁתַּחוּ
  choice: nagpatirapa siya sa lupa
  alternative: sumamba siya
  rationale: Inilalarawan mismo ng talata ang pisikal na kilos sa pamamagitan ng אַרְצָה. Pinananatili ng salin ang posibleng diwa ng pagsamba nang hindi iyon ginagawang tanging kahulugan.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Diwa ng לַיהוָה kasunod ng pagpapatirapa
  choice: sa harap ni Yahweh
  alternative: kay Yahweh
  rationale: Ang 'sa harap ni Yahweh' ay likas na Tagalog para sa mapitagang tindig, ngunit itinatala sa talababa na literal na maaaring unawaing 'kay Yahweh.'
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “nagpatirapa” upang malinaw na maipakita ang pisikal at mapitagang kilos; iniwasan ang tahasang “sumamba” sa pangunahing teksto upang mapanatili ang saklaw ng pandiwang Hebreo.
