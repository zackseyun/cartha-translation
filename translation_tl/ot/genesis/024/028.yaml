  text: Then the young woman ran and told her mother's household about these things[a].
translation:
  language: tl
  text: Pagkatapos, tumakbo ang dalaga at ikinuwento sa sambahayan ng kanyang ina ang mga bagay na ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bahay ng kanyang ina.” Ang pariralang Hebreo ay maaaring tumukoy sa mismong bahay o sa sambahayan/pamilyang kaugnay ng kanyang ina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרָץ
  choice: tumakbo
  rationale: Tuwirang ipinahahayag ng pandiwang mula sa רוץ ang mabilis na pagkilos; natural sa salaysay ang “tumakbo.”
- source_word: הַנַּעֲרָ
  choice: ang dalaga
  rationale: Ang נַעֲרָה ay tumutukoy sa isang batang babae o kabataang babae. Ang “dalaga” ay maikli, likas, at marangal sa modernong Tagalog para kay Rebeka sa konteksto.
- source_word: וַתַּגֵּד
  choice: ikinuwento
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam o sabihin. Sa konteksto, ipinabatid niya ang naganap, kaya natural ang “ikinuwento.”
- source_word: לְבֵית אִמָּהּ
  choice: sa sambahayan ng kanyang ina
  rationale: Maaaring tumukoy ang בַּיִת sa gusaling bahay o sa sambahayan/pamilya. Pinananatili ng “sambahayan” ang malamang na kolektibong diwa rito.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ang mga bagay na ito
  rationale: Ang דְּבָרִים ay maaaring mangahulugang mga salita, usapin, o bagay. Dito, tumutukoy ito sa mga pangyayaring isinalaysay niya.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “dalaga” sa halip na mas batang pahiwatig ng “batang babae,” at pinanatili sa talababa ang likas na kalabuan ng “bahay/sambahayan.”
