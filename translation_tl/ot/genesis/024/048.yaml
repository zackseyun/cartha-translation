  text: וָ/אֶקֹּ֥ד וָֽ/אֶשְׁתַּחֲוֶ֖ה לַ/יהוָ֑ה וָ/אֲבָרֵ֗ךְ אֶת יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲשֶׁ֤ר הִנְחַ֨/נִי֙ בְּ/דֶ֣רֶךְ אֱמֶ֔ת לָ/קַ֛חַת אֶת בַּת אֲחִ֥י אֲדֹנִ֖/י לִ/בְנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/048.yaml
  text: Then I bowed down and worshiped Yahweh[a], and I blessed Yahweh, the God of my master Abraham, who led me on the true way to take the daughter of my master's brother for his son.
translation:
  language: tl
  text: At yumukod ako at sumamba kay Yahweh, at pinuri ko si Yahweh, ang Diyos ng panginoon kong si Abraham, na umakay sa akin sa tapat na landas[a] upang kunin ang anak na babae ng kapatid ng panginoon ko para sa kaniyang anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “sa landas ng katotohanan.” Maaari rin itong mangahulugang “sa isang maaasahan o tapat na landas,” na nagdiriin sa mapagkakatiwalaang paggabay ni Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקֹּד
  choice: yumukod ako
  rationale: Ipinahahayag ang pisikal na pagyukod nang hindi labis na tinutukoy kung lumuhod o nagpatirapa.
- source_word: וָאֶשְׁתַּחֲוֶה לַיהוָה
  choice: sumamba kay Yahweh
  rationale: Kapag sa Diyos nakatuon, ang pandiwa ay likas na tumutukoy sa mapitagang pagsamba, na maaaring may kasamang pagpapatirapa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וָאֲבָרֵךְ אֶת־יְהוָה
  choice: pinuri ko si Yahweh
  rationale: Kapag Diyos ang layon ng ברך, ang diwa ay pagpuri o pagsasalita ng mabuti tungkol sa kaniya; mas natural ito sa kasalukuyang Tagalog kaysa 'binasbasan ko.'
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: ang Diyos ng panginoon kong si Abraham
  rationale: Ang אֲדֹנִי ay tumutukoy sa taong pinaglilingkuran ng alipin. Ang 'panginoon ko' ay dignified at malinaw sa konteksto, at hindi banal na titulo rito.
- source_word: הִנְחַנִי
  choice: umakay sa akin
  rationale: Ang Hiphil ng נחה ay nangangahulugang gumabay o umakay; natural ang 'umakay' sa paglalarawan ng patnubay sa isang landas.
- source_word: בְּדֶרֶךְ אֱמֶת
  choice: sa tapat na landas
  rationale: Pinananatili ang saklaw ng אֱמֶת bilang katotohanan, katapatan, at pagiging maaasahan, sa halip na paliitin lamang sa direksiyong 'tama.'
- source_word: לָקַחַת
  choice: upang kunin
  rationale: Tuwirang ipinakikita ng pawatas ang layunin sa konteksto ng pagkuha ng mapapangasawa para sa anak ng panginoon.
- source_word: בַּת אֲחִי אֲדֹנִי
  choice: ang anak na babae ng kapatid ng panginoon ko
  rationale: Pinananatili ang tahasang ugnayang pampamilya ng Hebreong construct chain.
- source_word: לִבְנוֹ
  choice: para sa kaniyang anak
  rationale: Ang panghalip ay tumutukoy kay Abraham at malinaw ito sa agarang konteksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng בְּדֶרֶךְ אֱמֶת
  choice: sa tapat na landas
  alternative: sa tunay na landas / sa tamang daan
  rationale: Hindi tahasang nilulutas ng salin kung ang diin ay nasa tunay na landas o sa maaasahan at tapat na paggabay ni Yahweh; inilalahad sa talababa ang saklaw ng parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'pinuri' sa halip na literal ngunit di-likas na 'binasbasan' kapag Diyos ang layon. Pinanatili ang 'panginoon ko' para sa ugnayang alipin at amo sa sinaunang salaysay, habang malinaw na hindi ito banal na titulo.
