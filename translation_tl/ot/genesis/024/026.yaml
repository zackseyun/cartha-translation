  text: וַ/יִּקֹּ֣ד הָ/אִ֔ישׁ וַ/יִּשְׁתַּ֖חוּ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/026.yaml
  text: Then the man bowed down and worshiped Yahweh[a][b].
translation:
  language: tl
  text: Pagkatapos, yumukod ang lalaki at sumamba kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “nagpatirapa sa harap ni Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: yumukod
  rationale: Ang קָדַד ay tumutukoy sa pisikal na pagyuko o pagyukod. Likas sa modernong Tagalog ang “yumukod” at naihihiwalay nito ang unang kilos sa kasunod na pagsamba.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Tahasang “ang lalaki” ang Hebreo. Bagaman lingkod ni Abraham ang tinutukoy sa konteksto, pinananatili rito ang mismong katawagang ginamit ng teksto.
- source_word: וַיִּשְׁתַּחוּ
  choice: sumamba
  rationale: Ang anyo ng שׁחה ay nagpapahayag ng pagpapatirapa o pagyukod nang may pagpipitagan. Dahil kay Yahweh nakatuon ang kilos at naipahayag na ng naunang pandiwa ang pisikal na pagyuko, malinaw na naihahatid ng “sumamba” ang relihiyosong diwa.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan na יהוה bilang “Yahweh”; ang pantukoy na לְ ay likas na isinasalin na “kay” sa Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalang יהוה ang nasa tekstong Hebreo. Ang “Yahweh” ay direktang transliterasyon na hindi pinapalitan ang pangalan ng isang titulo.
- issue: Kung ang וַיִּשְׁתַּחוּ ay isasalin bilang pisikal na pagpapatirapa o bilang pagsamba
  choice: sumamba
  alternative: nagpatirapa; yumukod nang lubos
  rationale: May pisikal at debosyonal na saklaw ang pandiwa. Dito, ang pagtuon nito kay Yahweh at ang naunang וַיִּקֹּד (“yumukod”) ay sumusuporta sa “sumamba,” habang inilalahad sa talababa ang mas pisikal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang “ang lalaki” sa halip na ipaliwanag sa pangunahing teksto bilang “ang lingkod,” sapagkat iyon ang tahasang salita ng Hebreo.
