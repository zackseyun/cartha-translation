lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Sinabi nila
  rationale: Likas na salaysay sa modernong Tagalog para sa wayyiqtol ng אמר; sapat na naihahatid ang sunod na tugon nang hindi pinipilit ang isang tiyak na ugnayang pandiskurso.
- source_word: נִקְרָא
  choice: Tawagin natin
  rationale: Ang anyong cohortative ay nagpapahayag ng mungkahi o sama-samang pasiya; natural itong tumbasan ng “Tawagin natin.”
- source_word: לַנַּעֲרָ
  choice: ang dalaga
  rationale: Tumutukoy ang נַעֲרָה sa isang batang babaeng nasa edad nang mag-asawa; ang “dalaga” ay maikli, natural, at angkop kay Rebekah sa konteksto.
- source_word: וְנִשְׁאֲלָה אֶת־פִּיהָ
  choice: at siya mismo ang tanungin
  rationale: Literal na “tanungin ang kaniyang bibig,” isang idyoma para marinig ang sariling sagot o pasiya niya. Ipinahihiwatig ng “siya mismo” na sa kaniya tuwirang hihingin ang sagot nang hindi nagiging alanganin sa Tagalog.
