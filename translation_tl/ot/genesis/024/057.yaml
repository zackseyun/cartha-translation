  text: And they said[b][a], “Let us call the young woman and ask her.”
translation:
  language: tl
  text: Sinabi nila, “Tawagin natin ang dalaga at siya mismo ang tanungin.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “tanungin ang kaniyang bibig,” ibig sabihin, marinig nang tuwiran ang sarili niyang sagot.'
