  to: Nang makita niya ang singsing sa ilong at ang mga pulseras sa mga kamay ng kanyang kapatid, at nang marinig niya ang mga salita ng kanyang kapatid na si Rebeca, na nagsasabing, “Ganito ang sinabi sa akin ng lalaki,” pinuntahan niya ang lalaki. At naroon ang lalaki, nakatayo sa tabi ng mga kamelyo sa bukal.[a][b]
