  register: Modernong Filipino Tagalog na malinaw at marangal. Inayos ang mahabang sintaks ng Hebreo upang maging natural sa Tagalog nang hindi binabago ang pagkakasunod ng mga pangyayari. Ginamit ang ‘Rebeca’ bilang nakaugaliang anyong Tagalog ng pangalan.
