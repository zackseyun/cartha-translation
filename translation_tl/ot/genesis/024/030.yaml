  text: וַ/יְהִ֣י כִּ/רְאֹ֣ת אֶת הַ/נֶּ֗זֶם וְֽ/אֶת הַ/צְּמִדִים֮ עַל יְדֵ֣י אֲחֹת/וֹ֒ וּ/כְ/שָׁמְע֗/וֹ אֶת דִּבְרֵ֞י רִבְקָ֤ה אֲחֹת/וֹ֙ לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר אֵלַ֖/י הָ/אִ֑ישׁ וַ/יָּבֹא֙ אֶל הָ/אִ֔ישׁ וְ/הִנֵּ֛ה עֹמֵ֥ד עַל הַ/גְּמַלִּ֖ים עַל הָ/עָֽיִן׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/030.yaml
  text: And it happened[a], when he saw the nose ring and the bracelets on his sister’s hands, and when he heard the words of Rebekah his sister, saying, “This is what the man said to me,” that he went to the man. And behold[d][c][b], he was standing by the camels at the spring.
translation:
  language: tl
  text: Nang makita niya ang singsing sa ilong at ang mga pulseras sa mga kamay ng kanyang kapatid, at nang marinig niya ang mga salita ng kanyang kapatid na si Rebeca, na nagsasabing, “Ganito ang sinabi sa akin ng lalaki,” pinuntahan niya ang lalaki. At naroon ang lalaki, nakatayo sa tabi ng mga kamelyo sa bukal.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “singsing.” Ang salitang Hebreo ay maaari ring tumukoy sa singsing sa pangkalahatan; “singsing sa ilong” ang ginamit dahil sinasabi sa Genesis 24:47 na inilagay ito sa ilong ni Rebeca.
    reason: lexical_alternative
  - marker: b
    text: O “sa may balon.” Ang salitang Hebreo ay mas tiyak na tumutukoy sa bukal o pinagmumulan ng tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Sa mahabang Hebreong pangungusap, ang וַיְהִי ay nagsisilbing pambungad sa sumunod na pangyayari; natural na naisasama ito sa temporal na sugnay sa modernong Tagalog kaysa isaling hiwalay bilang ‘At nangyari.’
- source_word: הַנֶּזֶם
  choice: hikaw sa ilong
  rationale: Maaaring tumukoy ang נֶזֶם sa singsing o hikaw sa pangkalahatan, ngunit nililinaw ng Genesis 24:47 na inilagay ito sa ilong ni Rebeca.
- source_word: הַצְּמִדִים עַל יְדֵי אֲחֹתוֹ
  choice: ang mga pulseras sa mga kamay ng kanyang kapatid
  rationale: Pinananatili ng ‘mga kamay’ ang literal na יָדַיִם, habang ang ‘mga pulseras’ ay natural na katawagan sa pares ng palamuting isinusuot sa kamay o pulsuhan.
- source_word: דִּבְרֵי רִבְקָה אֲחֹתוֹ לֵאמֹר
  choice: ang sinabi ng kanyang kapatid na si Rebeca
  rationale: Natural na ipinahahayag sa Tagalog ang ‘mga salita ... na nagsasabi’ bilang ‘ang sinabi,’ habang malinaw pa ring ipinakikilala ang tuwirang sipi.
- source_word: כֹּה דִבֶּר אֵלַי הָאִישׁ
  choice: Ganito ang sinabi sa akin ng lalaki
  rationale: Ang ‘Ganito’ ay nagpapanatili sa demonstratibong puwersa ng כֹּה at natural na nagpapakilala sa nilalaman ng ulat.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: pinuntahan niya ang lalaki
  rationale: Bagaman maaaring ‘pumaroon’ o ‘lumapit,’ malinaw at natural ang ‘pinuntahan’ mula sa pananaw ng gumagalaw na tauhan.
- source_word: וְהִנֵּה עֹמֵד
  choice: Naroon ito, nakatayo
  rationale: Ipinahahayag ng ‘Naroon ito’ ang bigla at matingkad na presentasyon ng וְהִנֵּה, at ng ‘nakatayo’ ang nagpapatuloy na kalagayan ng participle.
- source_word: עַל הַגְּמַלִּים
  choice: sa tabi ng mga kamelyo
  rationale: Dito ang עַל ay lokatibo at nangangahulugang malapit o katabi, hindi nasa ibabaw ng mga kamelyo.
- source_word: עַל הָעָיִן
  choice: sa bukal
  rationale: Ang עַיִן sa kontekstong ito ay bukal o pinagmumulan ng tubig, mas tiyak kaysa ‘balon.’
