base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/061.yaml
  text: Then Rebekah and her young women arose[a], mounted the camels, and went after the man. And the servant took Rebekah and went on his way.
translation:
  language: tl
  text: Pagkatapos, tumindig si Rebeca at ang kanyang mga dalaga[a], sumakay sa mga kamelyo, at sumunod sa lalaki. Isinama ng lingkod si Rebeca at nagpatuloy sa paglalakbay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga dalaga niya” o “mga dalagang tagapaglingkod niya.” Ang salitang Hebreo ay tumutukoy sa mga kabataang babae; sa kontekstong ito, malamang na sila ang mga babaeng kasama o tagapaglingkod ni Rebeca.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: tumindig
  rationale: Pinananatili ang payak na diwa ng קום na bumangon o tumindig at ang sunod-sunod na kilos sa salaysay, nang hindi inuunahang ipakahulugang lumakad na sila.
- source_word: נַעֲרֹתֶיהָ
  choice: mga dalaga niyang kasama
  rationale: Ang נַעֲרָה ay pangunahing tumutukoy sa mga kabataang babae. Ipinahihiwatig ng konteksto na mga babaeng kasama o tagapaglingkod sila ni Rebeca, ngunit hindi tahasang tinutukoy ng salita ang kanilang katayuan bilang alipin o lingkod.
- source_word: וַתִּרְכַּבְנָה עַל הַגְּמַלִּים
  choice: sumakay sila sa mga kamelyo
  rationale: Likas at malinaw sa modernong Tagalog, at ipinahahayag ang kilos ng pagsakay bago ang paglalakbay.
- source_word: אַחֲרֵי הָאִישׁ
  choice: sumunod sa lalaki
  rationale: Likas na salin ng paglalakbay sa likuran o pagsunod sa pangunguna ng lalaki.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Pinananatili ang mismong katawagan ng Hebreo sa halip na agad itong palitan ng 'lingkod,' kahit malinaw sa konteksto kung sino siya.
- source_word: וַיִּקַּח הָעֶבֶד אֶת רִבְקָה
  choice: Isinama ng lingkod si Rebeca
  rationale: Sa konteksto ng paglalakbay, ang לקח ay natural na nangangahulugang isinama o dinala. Iniiwasan ng 'isinama' ang di-likas o posibleng mapanlinlang na literal na 'kinuha.'
- source_word: הָעֶבֶד
  choice: ang lingkod
  rationale: Bagaman maaaring mangahulugang alipin o lingkod ang עֶבֶד, inilalarawan dito ang pinagkakatiwalaang katiwala ni Abraham; 'lingkod' ang angkop at hindi labis na mapagpasiyang salin sa konteksto.
- source_word: וַיֵּלַךְ
  choice: nagpatuloy sa paglalakbay
  rationale: Ipinahahayag nang natural sa Tagalog ang pagpapatuloy niya sa daan. Ang payak na 'umalis' o 'lumakad' ay maaaring magmukhang bagong pag-alis o literal na paglalakad lamang.
