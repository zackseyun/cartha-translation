  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'Rebeca' bilang karaniwang anyong Tagalog ng pangalan. Hinati sa maiikling pangungusap upang maging natural ang daloy habang pinananatili ang pagkakasunod-sunod ng mga kilos sa Hebreo.
