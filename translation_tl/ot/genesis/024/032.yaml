revisions:
- from: Kaya pumasok sa bahay ang lalaki. Inalis niya ang mga karga ng mga kamelyo[a] at binigyan ang mga ito ng dayami at pagkain. Nagbigay rin siya ng tubig para hugasan ang kanyang mga paa at ang mga paa ng mga lalaking kasama niya.[b]
  to: Kaya pumasok sa bahay ang lalaki. Inalis ang mga karga ng mga kamelyo[a], at binigyan ang mga kamelyo ng dayami at pagkain. Naglaan din ng tubig para sa paghuhugas ng mga paa ng lalaki at ng mga lalaking kasama niya.[b]
  rationale: Inalis ang mga panghalip na awtomatikong nag-uugnay sa lahat ng gawaing pagtanggap sa panauhin sa “lalaki,” habang pinanatili ang aktuwal na pagkakasunod-sunod at kahulugan ng mga kilos. Ginawang tahasan ang “mga paa ng lalaki” upang ang panghalip sa Hebreo ay hindi maling maiugnay sa posibleng tagapagbigay ng tubig. Ang talababa ay nag-iingat sa hindi ganap na matitiyak na pagkakakilanlan ng gumagawa nang hindi idinaragdag ang pangalang Laban sa pangunahing teksto.
