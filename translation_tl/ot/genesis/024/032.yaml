base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/032.yaml
  text: So the man came into the house and unloaded the camels and gave straw and feed to the camels[b][a], and water to wash his feet and the feet of the men who were with him.
translation:
  language: tl
  text: Kaya pumasok sa bahay ang lalaki. Inalis ang mga karga ng mga kamelyo[a], at binigyan ang mga kamelyo ng dayami at pagkain. Naglaan din ng tubig para sa paghuhugas ng mga paa ng lalaki at ng mga lalaking kasama niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “binuksan ang mga kamelyo.” Maaaring tumukoy ito sa pagkakalag sa mga ito o sa pag-alis ng kanilang mga gamit at karga.
    reason: lexical_alternative
  - marker: b
    text: Hindi muling pinangalanan sa Hebreo ang gumagawa ng pag-aalis ng mga karga at pagbibigay ng pagkain at tubig. Maaaring ang lalaki ang tinutukoy, ngunit maaaring si Laban o ang kaniyang sambahayan sa konteksto.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּבֹא הָאִישׁ הַבַּיְתָה
  choice: pumasok sa bahay ang lalaki
  rationale: Ang בוא kasama ng directional na hulaping -ה sa הַבַּיְתָה ay nagpapahayag ng pagpasok o pagtungo sa loob ng bahay. Pinananatili ng “ang lalaki” ang tahasang katawagan sa Hebreo sa halip na idagdag ang interpretatibong “lingkod.”
- source_word: וַיְפַתַּח הַגְּמַלִּים
  choice: inalis niya ang mga karga ng mga kamelyo
  rationale: Literal na “binuksan niya ang mga kamelyo,” ngunit idyoma ito para sa pagkalag o pag-alis ng gamit at karga ng mga kamelyo pagdating sa hantungan. Ang salin ay malinaw sa modernong Tagalog habang may talababa para sa saklaw ng idyoma.
- source_word: תֶּבֶן וּמִסְפּוֹא
  choice: dayami at pagkain
  rationale: Ang תֶּבֶן ay dayami o pinaggapasan, at ang מִסְפּוֹא ay pagkaing ukol sa hayop. Sa konteksto ng mga kamelyo, likas at madaling maunawaan ang “dayami at pagkain.”
- source_word: וּמַיִם לִרְחֹץ רַגְלָיו
  choice: tubig para hugasan ang kanyang mga paa
  rationale: Ipinahahayag ng infinitive construct ang layunin ng pagbibigay ng tubig. Pinananatili ng “kanyang mga paa” ang panlalaking isahang panghalip ng Hebreo.
- source_word: וְרַגְלֵי הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: at ang mga paa ng mga lalaking kasama niya
  rationale: Pinananatili nito ang tahasang maramihang “mga lalaki” at ang kaugnay na pariralang “na kasama niya” sa natural na ayos ng Tagalog.
theological_decisions:
- issue: Pagkakakilanlan ng gumagawa ng mga kilos matapos pumasok ang lalaki
  choice: Gumamit ng “niya/siya” sa pangunahing teksto, kasunod ng karaniwang tuloy-tuloy na paksa ng mga pandiwang Hebreo, ngunit itinakda sa talababa ang posibleng pagtukoy kay Laban.
  alternative: Tahasang pangalanan si Laban bilang nag-alis ng karga at nagbigay ng pagkain at tubig.
  rationale: Hindi pinapangalanan ng Hebreo si Laban sa talatang ito. Karaniwang ipinagpapatuloy ng magkakasunod na pandiwang pangatlong panauhang panlalaki ang naunang tahasang paksa, “ang lalaki,” ngunit maaaring unawain sa konteksto ng pagtanggap sa panauhin na si Laban ang gumawa o nagpagawa ng mga ito. Hindi dapat tahimik na lutasin sa pamamagitan ng pagdaragdag ng pangalang wala sa teksto ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Hinati sa tatlong pangungusap ang mahabang sugnay ng Hebreo upang maging natural basahin, habang pinananatili ang pagkakasunod-sunod ng mga kilos at ang mga panghalip ng teksto.
