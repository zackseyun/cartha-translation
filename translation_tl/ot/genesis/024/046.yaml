base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/046.yaml
  text: She quickly lowered her jar from her shoulder and said[a], ‘Drink, and I will also give water to your camels.’ So I drank, and she also gave water to the camels.
translation:
  language: tl
  text: Agad niyang ibinaba ang kanyang banga mula sa kanyang balikat[a] at sinabi, “Uminom ka, at paiinumin ko rin ang iyong mga kamelyo.” Kaya uminom ako, at pinainom din niya ang mga kamelyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa ibabaw niya.” Hindi tahasang tinutukoy rito ang bahagi ng katawan, ngunit ipinahihiwatig ng mas malawak na konteksto na pasan niya ang banga sa balikat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Agad niyang
  rationale: Ipinahahayag ng מהר ang mabilis at agarang pagkilos; natural itong isama bilang pang-abay sa kasunod na pandiwa.
- source_word: וַתּוֹרֶד
  choice: ibinaba
  rationale: Ang Hiphil ng ירד ay nangangahulugang ipababa o ibaba; akma ito sa pag-aalis ng banga mula sa pagkakapasan.
- source_word: כַּדָּהּ
  choice: ang kanyang banga
  rationale: Ang כַּד ay isang banga o sisidlang ginagamit sa pagsalok ng tubig. Malinaw sa konteksto ang gamit nito kaya hindi kailangang idagdag ang salitang “tubig.”
- source_word: מֵעָלֶיהָ
  choice: mula sa kanyang balikat[a]
  rationale: Literal itong “mula sa ibabaw niya,” na walang tahasang binabanggit na bahagi ng katawan. Gayunman, ipinahihiwatig ng mas malawak na konteksto na pasan ang banga sa balikat; nililinaw ng talababa ang di-tiyak na anyo ng Hebreo.
- source_word: שְׁתֵה
  choice: Uminom ka
  rationale: Tuwirang pautos ito at likas sa modernong Tagalog.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: at paiinumin ko rin ang iyong mga kamelyo
  rationale: Ang Hiphil ng שקה ay “painumin” o bigyan ng maiinom; maikli at eksakto ang “paiinumin” sa Tagalog.
- source_word: וָאֵשְׁתְּ
  choice: Kaya uminom ako
  rationale: Ipinagpapatuloy ng waw ang salaysay at ang “Kaya” ay natural na nagpapakita ng tugon sa paanyaya.
- source_word: וְגַם הַגְּמַלִּים הִשְׁקָתָה
  choice: at pinainom din niya ang mga kamelyo
  rationale: Pinananatili nito ang kahulugan ng Hiphil ng שקה at ang pag-uulit ng “rin/din” sa pinagmulang teksto.
