base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/036.yaml
  text: And Sarah[a], my master's wife, bore a son to my master after her old age, and he gave him all that he had.
translation:
  language: tl
  text: At nagsilang si Sara, na asawa ng aking panginoon, ng isang anak na lalaki para sa aking panginoon nang matanda na siya.[a] Ibinigay naman ng aking panginoon sa anak na iyon ang lahat ng mayroon ang aking panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “pagkatapos ng kanyang katandaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: nagsilang
  rationale: Ang Qal wayyiqtol ng ילד ay karaniwang salaysay ng panganganak; malinaw at marangal sa makabagong Tagalog ang “nagsilang.”
- source_word: אֵשֶׁת אֲדֹנִי
  choice: na asawa ng aking panginoon
  rationale: Pinananatili nito ang ugnayang construct at ang magalang na pananalita ng lingkod, habang natural ang ayos sa Tagalog.
- source_word: בֵן לַאדֹנִי
  choice: ng isang anak na lalaki para sa aking panginoon
  rationale: Ipinahahayag ng “isang anak na lalaki” ang walang-artikulong בֵן, at ng “para sa” ang relasyonal o benepaktibong gamit ng ל.
- source_word: אַחֲרֵי זִקְנָתָהּ
  choice: nang matanda na siya
  rationale: Ang literal na “pagkatapos ng kanyang katandaan” ay hindi natural at maaaring makalito sa Tagalog. Ipinahahayag ng napiling parirala ang idiomatikong diwa ng panganganak ni Sara sa kanyang katandaan.
- source_word: וַיִּתֶּן לוֹ
  choice: Ibinigay naman ng aking panginoon sa anak na iyon
  rationale: Ang paksa ng pandiwa ay si Abraham at ang tumatanggap ay ang anak na kababanggit. Nilinaw ang dalawang reperente dahil maaaring maging malabo ang magkakasunod na panghalip sa Tagalog; ang “naman” ay likas na nagdurugtong sa kasunod na pangyayari.
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: ang lahat ng kanyang ari-arian
  rationale: Natural nitong ipinahahayag ang komprehensibong pormulang tumutukoy sa lahat ng pag-aari ni Abraham.
theological_decisions:
- issue: Saklaw at katangian ng pagbibigay ni Abraham sa anak
  choice: Ibinigay ... ang lahat ng kanyang ari-arian
  alternative: ipinamana ... ang lahat ng kanyang ari-arian
  rationale: Hindi tinutukoy ng נתן kung mana lamang o agarang paglilipat ang ibig sabihin. Ang “ibinigay” ay nagpapanatili sa lawak at pagiging pangkalahatan ng pahayag nang hindi nagdaragdag ng legal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “panginoon” bilang magalang na tawag ng lingkod sa kanyang amo, ayon sa konteksto, at nilinaw ang mga reperente ng panghalip upang maiwasan ang kalabuan.
