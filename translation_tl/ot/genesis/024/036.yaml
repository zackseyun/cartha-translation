  to: At nagsilang si Sara, na asawa ng aking panginoon, ng isang anak na lalaki para sa aking panginoon nang matanda na siya.[a] Ibinigay naman ng aking panginoon sa anak na iyon ang lahat ng mayroon ang aking panginoon.
