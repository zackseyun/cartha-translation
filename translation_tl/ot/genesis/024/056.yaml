base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/056.yaml
  text: But he said to them[a], “Do not delay me, since Yahweh has made my journey successful. Send me away so that I may go to my master.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila, “Huwag ninyo akong patagalin, yamang pinagtagumpay ni Yahweh ang aking paglalakbay.[a] Payagan ninyo akong umalis upang pumunta ako sa aking panginoon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang aking daan”; dito ay tumutukoy ito sa paglalakbay o misyon ng lingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Ngunit sinabi niya sa kanila
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit ang “Ngunit” ay likas na nagpapakita ng pagsalungat niya sa mungkahing pagpapatagal ng pamilya sa naunang konteksto.
- source_word: אַל תְּאַחֲרוּ אֹתִי
  choice: Huwag ninyo akong patagalin
  rationale: Ang pagbabawal na may אַל at Hiphil ng אחר ay tumutukoy sa pag-antala o pagpigil sa kanyang pag-alis; malinaw at natural ang “patagalin” sa Filipino.
- source_word: וַיהוָה
  choice: ni Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh,” ayon sa anyong nasa Hebreo.
- source_word: הִצְלִיחַ דַּרְכִּי
  choice: pinagtagumpay ... ang aking paglalakbay
  rationale: Ang Hiphil ng צלח ay nagpapahayag na si Yahweh ang nagdulot ng tagumpay. Ang דֶּרֶךְ ay literal na “daan,” ngunit dito ay tumutukoy sa paglalakbay o misyong isinagawa ng lingkod.
- source_word: שַׁלְּחוּנִי
  choice: Paalisin na ninyo ako
  rationale: Ang Piel imperative ng שלח ay kahilingang payagan at ipadala siyang umalis. Ipinahihiwatig ng “na” ang kagyat na pagpayag na hinihingi sa konteksto nang hindi dinaragdagan ang pangunahing diwa.
- source_word: וְאֵלְכָה לַאדֹנִי
  choice: upang makabalik ako sa aking panginoon
  rationale: Ang cohortative ay nagpapahayag ng nilalayong pagkilos matapos siyang payagang umalis. Sa konteksto, ang pagpunta sa kanyang panginoon ay pagbabalik kay Abraham; ang “panginoon” ay angkop para sa taong pinaglilingkuran at hindi banal na titulo rito.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Hayagang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang nasa pinagmulan nang hindi ito pinapalitan ng titulo.
- issue: Ahensiya ng Diyos sa tagumpay ng paglalakbay
  choice: pinagtagumpay ni Yahweh
  alternative: nagtagumpay sa tulong ni Yahweh
  rationale: 'Pinananatili ng anyong Hiphil ng הִצְלִיחַ ang tuwirang sanhi: si Yahweh ang nagdulot ng tagumpay, hindi lamang tumulong sa isang tagumpay na hiwalay sa kanyang pagkilos.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “paglalakbay” sa pangunahing teksto para sa likas na kahulugan sa konteksto, habang inilagay sa talababa ang literal na “daan.”
