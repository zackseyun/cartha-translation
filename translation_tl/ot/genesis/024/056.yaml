  - severity: low
    issue: Ang “Paalisin na ninyo ako” ay may dagdag na kagyat na diin at maaaring mangahulugang itaboy o pauwiin.
    rationale: Ang שַׁלְּחוּנִי ay kahilingang siya’y payagang/ipadala upang umalis. Mas malinaw ang “Payagan ninyo akong umalis,” nang walang idinagdag na “na.”
