  source_fidelity: Tumpak sa kabuuan ang diwa ng pagbabawal sa pagpapatagal, ang tuwirang pagkilos ni Yahweh sa tagumpay ng paglalakbay, at ang kahilingang umalis patungo sa kaniyang panginoon. Gayunman, ang “makabalik” ay nagdaragdag ng aspektong ‘bumalik’ na wala sa Hebreo; ang teksto ay simpleng nagsasabing ‘makapunta ako sa aking panginoon.’
  naturalness: Likas at malinaw ang modernong Filipino. Ang “Payagan ninyo akong umalis” ay mas tuwiran at natural na katumbas ng kahilingang palayain/pahintulutang umalis kaysa “Paalisin na ninyo ako,” at iniiwasan nito ang dagdag na diin ng “na.”
  terminology: Wasto ang “Yahweh” para sa יהוה at ang “panginoon” para sa human superior na אֲדֹנִי sa kontekstong ito. Ang “paglalakbay” ay angkop na kontekstuwal na pagsasalin ng ‘aking daan,’ na maayos na nililinaw ng talababa.
