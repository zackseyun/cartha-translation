base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/016.yaml
  text: The young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
translation:
  language: tl
  text: Ang kabataang babae ay napakaganda ng anyo. Birhen siya; wala pang lalaking sumiping sa kanya.[a] Bumaba siya sa bukal[b], pinuno ang kanyang banga, at umakyat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “walang lalaking nakakilala sa kanya.” Sa Hebreo, ang “makilala” rito ay isang maingat na paraan ng pagsasabing makipagtalik.
    reason: lexical_alternative
  - marker: b
    text: Maaaring “bukal ng tubig” o “pinagmumulan ng tubig.” Ang salitang Hebreo ay hindi ang karaniwang salita para sa “balon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָ
  choice: ang kabataang babae
  rationale: Tumutukoy ang נַעֲרָה sa isang batang babae o kabataang babae, madalas nasa edad nang maaaring mag-asawa. Ang “kabataang babae” ay malinaw at makabagong Filipino at hindi kasing-arkaiko ng “dalaga” sa ilang gamit.
- source_word: טֹבַת מַרְאֶה מְאֹד
  choice: napakaganda
  rationale: Inilalarawan ng parirala ang pambihirang ganda ng kanyang panlabas na anyo. Likas at sapat na naipahahayag ito ng “napakaganda” sa Filipino.
- source_word: בְּתוּלָה
  choice: birhen siya
  rationale: Ang בְּתוּלָה ay tuwirang tumutukoy rito sa isang birhen. Ginawang hiwalay na sugnay upang maging malinaw at natural sa Filipino.
- source_word: וְאִישׁ לֹא יְדָעָהּ
  choice: wala pang lalaking sumiping sa kanya
  rationale: Ang יָדַע, na literal na “makilala,” ay isang Hebreong eupemismo para sa pakikipagtalik. Pinananatili ng “sumiping sa kanya” ang maingat na tono habang malinaw ang kahulugan; inilalagay sa talababa ang literal na anyo.
- source_word: הָעַיְנָה
  choice: sa bukal
  rationale: Ang עַיִן sa kontekstong ito ay likas na bukal o pinagmumulan ng tubig, hindi ang karaniwang salita para sa balon.
- source_word: כַדָּהּ
  choice: ang kanyang banga
  rationale: Ang כַּד ay sisidlang ginagamit sa pagsalok o pag-iigib ng tubig. Ang “banga” ay natural at pamilyar na katumbas sa Filipino.
- source_word: וַתָּעַל
  choice: at umakyat
  rationale: Ang עָלָה ay nangangahulugang umakyat. Pinananatili nito ang malinaw na kaibahan sa naunang pagbaba niya patungo sa bukal.
theological_decisions:
- issue: Ugnayan ng “birhen” at ng Hebreong idyomang “walang lalaking nakakilala sa kanya”
  choice: Isinalin ang idyoma ayon sa kahulugang seksuwal ngunit pinanatili ang literal na anyo sa talababa.
  alternative: “Wala pang lalaking nakakilala sa kanya.”
  rationale: Nililinaw nito sa ordinaryong mambabasa ang kahulugan nang hindi inaalis ang maingat na eupemistikong tono o ikinukubli ang literal na Hebreong pananalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Gumamit ng maiikling pangungusap upang maiwasan ang mabigat na ayos, habang pinananatili ang pagkakasunod-sunod ng Hebreong salaysay at ang maingat nitong pananalita tungkol sa seksuwal na karanasan.
