base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/015.yaml
  text: And it happened[a], before he had finished speaking, that behold, Rebekah was coming out—she who had been born to Bethuel son of Milcah, the wife of Nahor[b], Abraham’s brother—with her jar on her shoulder.
translation:
  language: tl
  text: Habang hindi pa siya tapos magsalita, narito, lumalabas si Rebeka—na ipinanganak kay Betuel, na anak ni Milca, ang asawa ni Nahor, na kapatid ni Abraham—na may banga sa kaniyang balikat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Pinananatili ang pormulang pasalaysay ng Hebreo sa dignified ngunit hindi makalumang Tagalog.
- source_word: טֶרֶם כִּלָּה לְדַבֵּר
  choice: bago pa siya matapos magsalita
  rationale: Ipinahahayag ang naunang panahon at ang hindi pa natatapos na pagsasalita; natural sa modernong Tagalog ang “bago pa ... matapos.”
- source_word: וְהִנֵּה
  choice: narito
  rationale: Pinananatili ang bigla at matingkad na pagtawag-pansin ng הִנֵּה nang hindi dinaragdagan ng paliwanag.
- source_word: יֹצֵאת
  choice: lumalabas
  rationale: Ang pambabaeng participle ay naglalarawan ng kilos na kasalukuyang nagaganap sa sandaling iyon.
- source_word: אֲשֶׁר יֻלְּדָה לִבְתוּאֵל
  choice: na ipinanganak kay Betuel
  rationale: Pinananatili ang passive na anyo at ang pagkakakilanlan ni Rebeka ayon sa kanyang angkan.
- source_word: בֶּן מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם
  choice: na anak ni Milca, na asawa ni Nahor na kapatid ni Abraham
  rationale: Inilalahad ang buong hanay ng ugnayang pampamilya nang hindi binabago ang posibleng saklaw ng mga pariralang panuring.
- source_word: כַּד
  choice: banga
  rationale: Karaniwang katawagan sa sisidlang ginagamit sa pag-igib o pagdadala ng tubig; hindi idinagdag ang “tubig” dahil ipinahihiwatig lamang iyon ng konteksto.
- source_word: עַל שִׁכְמָהּ
  choice: pasan niya sa balikat
  rationale: Natural na Tagalog para sa sisidlang nakalagay at dinadala sa balikat.
