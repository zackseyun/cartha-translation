base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/049.yaml
  text: Now if you are going to show kindness and faithfulness to my master[a], tell me; but if not, tell me, so that I may turn to the right or to the left.
translation:
  language: tl
  text: Kaya ngayon, kung handa kayong magpakita ng kagandahang-loob at katapatan[a] sa aking panginoon, sabihin ninyo sa akin; ngunit kung hindi, sabihin din ninyo sa akin, upang bumaling ako sa kanan o sa kaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matatag na pag-ibig at katapatan.” Ang pares na salitang Hebreo ay madalas tumukoy sa matatag, maaasahan, at tapat na kagandahang-loob sa isang ugnayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinakikilala nito ang agarang praktikal na kahihinatnan ng sinabi ng lingkod. Ipinahihiwatig ng “kaya” ang ugnayan sa naunang pahayag, samantalang pinananatili ng “ngayon” ang temporal na diin.
- source_word: אִם יֶשְׁכֶם עֹשִׂים
  choice: kung handa kayong magpakita
  rationale: Ang Hebreong idyoma, na literal na pinagsasama ang “kung mayroon sa inyo” at isang participle, ay tumutukoy rito sa kanilang kahandaan o pasiyang kumilos. Likas sa modernong Tagalog ang “handa kayong” at pinananatili nito ang bolisyunal at pasulong na diwa.
- source_word: חֶסֶד וֶאֱמֶת
  choice: kagandahang-loob at katapatan
  rationale: 'Pinananatili ang dalawang magkakaugnay ngunit magkaibang sangkap: mapagmahal o tapat na kabutihang ipinakikita sa gawa, at pagiging maaasahan o tapat. Hindi ito nililimitahan sa isang teknikal na pakahulugang pangtipan.'
- source_word: אֶת אֲדֹנִי
  choice: sa aking panginoon
  rationale: Ang kilos ay nakatuon sa panginoon ng lingkod. Ang “sa” ang pinakanatural na panandang Tagalog para sa tumatanggap ng kagandahang-loob at katapatan.
- source_word: הַגִּידוּ לִי
  choice: sabihin ninyo sa akin
  rationale: Tuwirang pautos ito na humihingi ng malinaw na sagot; ang pag-uulit nito sa ikalawang sugnay ay pinanatili gaya ng Hebreo.
- source_word: וְאִם לֹא
  choice: ngunit kung hindi
  rationale: Malinaw nitong ipinakikita ang salungatan sa pagitan ng pagsang-ayon at pagtanggi.
- source_word: וְאֶפְנֶה
  choice: upang makapihit ako
  rationale: Ipinahahayag ng cohortative ang nilalayong kasunod na pagkilos. Ang “upang” ay nagmamarka ng layon o bunga, at ang “makapihit” ay nagpapanatili sa larawan ng pagbaling sa ibang direksiyon.
- source_word: עַל יָמִין אוֹ עַל שְׂמֹאל
  choice: sa kanan o sa kaliwa
  rationale: Pinananatili ang literal na larawang pandireksiyon, na nauunawaan din bilang paghahanap ng ibang landas o paraan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang magalang na maramihang “kayo/ninyo” dahil higit sa isang kausap ang tinutukoy. Pinanatili ang pag-uulit at ang larawang “kanan o kaliwa” mula sa Hebreo.
