translation:
  language: tl
  text: Nanggaling si Isaac sa Beer-lahai-roi[a][b], at naninirahan siya noon sa lupain ng Negev.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Dumating si Isaac mula sa Beer-lahai-roi.” Maaaring ipahayag ang pandiwang Hebreo sa payak na nakaraan sa halip na bilang isang pangyayaring naganap bago ang sumunod na tagpo.'
    reason: lexical_alternative
  - marker: b
    text: Ang Beer-lahai-roi ay pangalang-lugar na naunang iniugnay kay Hagar (tingnan ang Genesis 16:14).
    reason: cross_reference
lexical_decisions:
- source_word: בָּא מִבּוֹא
  choice: Dumating ... mula sa
  rationale: Ang Qal perfect na בָּא kasama ng pinaikling pariralang מִבּוֹא ay nagpapahayag ng natapos na pagdating mula sa isang lugar. Natural sa Tagalog ang payak na aspektong naganap; hindi kailangang piliting ipakita ang English past perfect.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Beer-lahai-roi
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon at pinanatili ang mga gitling upang makita ang tambalang anyo.
- source_word: וְהוּא יוֹשֵׁב
  choice: at naninirahan siya noon
  rationale: Ang tahasang panghalip at participle ay nagpapahiwatig ng nagpapatuloy o nakagawiang paninirahan. Ang “noon” ay likas na panandang pangnakaraan sa Tagalog at hindi ginagawang isang tahasang Hebreong salitang “ngayon” ang pangungusap.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: sa lupain ng Negev
  rationale: Pinananatili ng “lupain” ang אֶרֶץ, samantalang ang “Negev” ay heograpikong pangalang pantangi para sa tuyong rehiyon sa timog.
