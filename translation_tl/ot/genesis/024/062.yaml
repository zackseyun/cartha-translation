translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naninirahan” upang mapanatili ang patuloy na diwa ng participle, at iniwasan ang panimulang “Ngayon” dahil walang katumbas na tahasang temporal na salita sa Hebreo.
