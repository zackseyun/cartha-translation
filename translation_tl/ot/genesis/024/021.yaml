  text: וְ/הָ/אִ֥ישׁ מִשְׁתָּאֵ֖ה לָ֑/הּ מַחֲרִ֕ישׁ לָ/דַ֗עַת הַֽ/הִצְלִ֧יחַ יְהוָ֛ה דַּרְכּ֖/וֹ אִם לֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/021.yaml
  text: The man watched her silently[a], to know whether Yahweh had made his journey successful or not.
translation:
  language: tl
  text: Tahimik na pinagmamasdan siya ng lalaki[a] upang malaman kung pinagtagumpay ni Yahweh ang paglalakbay niya o hindi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Tahimik siyang tinitigan ng lalaki upang alamin kung pinagtagumpay ni Yahweh ang kanyang lakad o hindi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Karaniwang pangngalang “lalaki” ang אִישׁ. Bagaman alipin ni Abraham ang tinutukoy sa konteksto, hindi ipinalit ang kontekstuwal na tungkuling “alipin” sa mismong salita ng talata.
- source_word: מִשְׁתָּאֵה לָהּ
  choice: pinagmamasdan siya
  rationale: Ipinahihiwatig ng pandiwaring hitpael ang patuloy at masusing pagmamasid, na maaaring may bahid ng pagtataka. Natural sa modernong Tagalog ang “pinagmamasdan” at hindi nito labis na itinatakda ang emosyon ng lalaki.
- source_word: מַחֲרִישׁ
  choice: tahimik
  rationale: Ang pandiwari ay tumutukoy sa pananatiling tahimik; ginawang pang-abay ang salin upang maging malinaw at natural sa Tagalog.
- source_word: לָדַעַת
  choice: upang malaman
  rationale: Tuwirang ipinahahayag ng pawatas ang layunin ng kanyang tahimik na pagmamasid.
- source_word: הַהִצְלִיחַ
  choice: pinagtagumpay
  rationale: 'Pinananatili nito ang sanhiang diwa ng hiphil ng צלח: si Yahweh ang nagdulot na magtagumpay ang paglalakbay.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: דַּרְכּוֹ
  choice: ang paglalakbay niya
  rationale: Literal na “daan” ang דֶּרֶךְ, ngunit sa salaysay ay tumutukoy ito sa paglalakbay o misyong isinasagawa ng lalaki. Ang “paglalakbay” ang natural na katumbas sa konteksto.
- source_word: אִם לֹא
  choice: o hindi
  rationale: Binubuo nito ang di-tuwirang tanong na “kung … o hindi,” na malinaw at idyomatiko sa Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kung matagumpay na ba ang paglalakbay
  choice: ipinahayag bilang bagay na nais pa lamang malaman ng lalaki
  alternative: ipahiwatig na tiyak na niyang matagumpay ito
  rationale: Pinananatili ng “kung … o hindi” ang pag-aalinlangan sa pananaw ng lalaki sa sandaling iyon, kahit may mga palatandaan nang tumugon si Yahweh.
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang ginamit. Pinanatili ang karaniwang “lalaki,” ang patuloy na kilos ng pagmamasid, at ang bukas na tanong kung naging matagumpay ang paglalakbay.
