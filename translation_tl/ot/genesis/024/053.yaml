base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/053.yaml
  text: Then the servant brought out articles of silver and articles of gold and garments[a], and gave them to Rebekah; he also gave choice gifts to her brother and to her mother.
translation:
  language: tl
  text: Pagkatapos, inilabas ng lingkod ang mga bagay na pilak, mga bagay na ginto, at mga damit, at ibinigay ang mga ito kay Rebekah. Binigyan din niya ng mga piling regalo[a] ang kapatid na lalaki ni Rebekah at ang ina nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahahalagang regalo.” Ang מִגְדָּנוֹת ay tumutukoy sa mga pinong o natatanging kaloob at, sa ilang konteksto, ay maaaring tumukoy sa mga masasarap na pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: inilabas
  rationale: Ang Hiphil ng יצא ay nagpapahayag ng pagpapalabas o paglalabas; natural at kongkreto ang “inilabas” sa Tagalog.
- source_word: הָעֶבֶד
  choice: ang lingkod
  rationale: Maaaring mangahulugang alipin o lingkod ang עֶבֶד. Sa kontekstong ito, malinaw na pinagkakatiwalaang tagapaglingkod ang tinutukoy, kaya ang “lingkod” ang natural na salin nang hindi nagdaragdag ng hindi tiyak na diin sa legal na katayuan.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: mga kagamitang pilak, mga kagamitang ginto
  rationale: Malawak ang saklaw ng כְּלִי—bagay, kagamitan, sisidlan, o kasangkapan. Pinananatili ng “mga kagamitan” ang lawak nito at hindi ipinapalagay na mga sisidlan lamang ang mga ito.
- source_word: וּבְגָדִים
  choice: mga damit
  rationale: Tuwiran, makabago, at marangal na katumbas ng בְּגָדִים ang “mga damit.”
- source_word: וַיִּתֵּן לְרִבְקָה
  choice: at ibinigay ang mga iyon kay Rebekah
  rationale: Nililinaw ng “mga iyon” ang likas na ipinahihiwatig na layon ng pandiwa, na tumutukoy sa mga pilak, ginto, at damit.
- source_word: וּמִגְדָּנֹת
  choice: mahahalagang regalo
  rationale: Ang מִגְדָּנוֹת ay tumutukoy sa piling o mahahalagang handog. Akma sa tagpo ng pag-aasawa ang “mahahalagang regalo,” habang hindi isinasara ang posibleng diwa ng mga natatanging o mamahaling bagay.
- source_word: לְאָחִיהָ וּלְאִמָּהּ
  choice: ang kapatid nitong lalaki at ang ina nito
  rationale: Tinutukoy ng mga hulaping pambabae si Rebekah. Nililinaw ng “kapatid nitong lalaki” ang kasarian na nakasaad sa אָח, at iniiwasan ng “nito” ang posibleng kalituhan sa Tagalog kung kanino ang kapatid at ina.
