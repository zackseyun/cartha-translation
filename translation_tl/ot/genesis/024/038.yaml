  text: But you shall go to my father's house and to my clan[a], and you shall take a wife for my son.
translation:
  language: tl
  text: Kundi pumunta ka sa bahay ng aking ama at sa aking angkan[a], at kumuha ka ng asawa para sa aking anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking pamilya” o “aking mga kamag-anak.” Ang salitang Hebreo ay tumutukoy sa isang malawak na pangkat ng magkakamag-anak, hindi lamang sa pinakamalapit na sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Kundi
  rationale: Sa konteksto ng panunumpa at kasunod ng naunang pagbabawal, idyomatikong naghahayag ito ng pagsalungat o pagbubukod, hindi ng karaniwang kondisyong “kung hindi.” Likas sa Tagalog ang “kundi” para sa ganitong pagpapatuloy.
- source_word: בֵּית אָבִי
  choice: sambahayan ng aking ama
  rationale: Ang בַּיִת ay maaaring tumukoy hindi lamang sa gusali kundi sa sambahayan o angkan ng ama. Ang “sambahayan” ay malinaw at natural sa kontekstong pampamilya.
- source_word: תֵּלֵךְ
  choice: pumunta ka
  rationale: Ang anyong pandiwa ay may puwersa ng tagubilin sa utos ni Abraham sa lingkod; ang pautos na “pumunta ka” ang likas na katumbas sa Tagalog.
- source_word: מִשְׁפַּחְתִּי
  choice: aking angkan
  rationale: Tumutukoy ang מִשְׁפָּחָה sa mas malawak na pangkat ng magkakamag-anak, kaya mas tiyak ang “angkan” kaysa sa “pamilya,” na maaaring maunawaang nuklear na pamilya lamang.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: at kumuha ka ng asawa para sa aking anak
  rationale: Ang לקח ay “kumuha,” ang אִשָּׁה ay “asawa” sa konteksto ng pag-aasawa, at ang לִבְנִי ay nagsasaad kung para kanino ang pagkuha.
