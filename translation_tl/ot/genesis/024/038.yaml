    issue: Hindi naipahayag ang kasariang panlalaki ng לִבְנִי.
    rationale: Ang Hebreong “aking anak” ay may unang panauhang panghalip na nakakabit sa בֵּן, “anak na lalaki.” Ang salin na “aking anak” ay maaaring tumukoy sa alinmang kasarian sa modernong Tagalog.
  - severity: low
    issue: Ang “sambahayan” ay isang mas malawak na pagpapakahulugan sa “bahay ng aking ama.”
    rationale: Bagaman maaaring saklawin ng בֵּית ang sambahayan, ang “bahay” ay mas tuwirang tumutugma sa teksto at pinananatili ang kaibhan nito sa kasunod na “angkan.”
  revised_text: Kundi pumunta ka sa bahay ng aking ama at sa aking angkan[a], at kumuha ka ng asawa para sa aking anak na lalaki.
