    rationale: Sa estrukturang Tagalog, ang kamag-anak na sugnay ay madaling mabasang tumutukoy sa “Nahor,” ang pinakamalapit na pangngalan. Sa Hebreo, si Betuel ang siyang ipinanganak ni Milca para kay Nahor. Ang malinaw na panghalip na “kanya” pagkatapos ng hiwalay na pangungusap ay tumutukoy kay Betuel.
