base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/047.yaml
  text: Then I asked her[a], saying, ‘Whose daughter are you?’ And she said, ‘The daughter of Bethuel son of Nahor[c][b], whom Milcah bore to him.’ Then I put the ring on her nose and the bracelets on her hands.
translation:
  language: tl
  text: Pagkatapos, tinanong ko siya, “Kanino kang anak?” Sumagot siya, “Anak ako ni Betuel, na anak ni Nahor. Ipinanganak siya ni Milca para kay Nahor.” Pagkatapos, inilagay ko ang singsing[a] sa ilong niya at ang mga pulseras sa mga kamay niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “singsing sa ilong.” Ang salitang Hebreo ay maaaring tumukoy sa singsing sa pangkalahatan; nililinaw ng kasunod na parirala na inilagay ito sa ilong.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa mga kamay niya”; ayon sa konteksto, maaaring mas tiyak na tumukoy ito sa mga pulsuhan niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁאַל אֹתָהּ וָאֹמַר
  choice: tinanong ko siya
  rationale: Ang magkasunod na ‘nagtanong’ at ‘nagsabi’ ay bumubuo rito ng iisang kilos ng pagtatanong. Likas sa Tagalog na ihayag ito sa pandiwang ‘tinanong’ na sinusundan ng mismong tanong.
- source_word: בַּת מִי אַתְּ
  choice: Kanino kang anak?
  rationale: Karaniwan at malinaw itong paraan sa modernong Tagalog upang itanong ang pinagmulang magulang, habang pinananatili ang salitang ‘anak’ mula sa Hebreo.
- source_word: בַּת בְּתוּאֵל בֶּן נָחוֹר
  choice: Anak ako ni Betuel na anak ni Nahor
  rationale: Pinananatili ang sunod-sunod na ugnayang pampamilya sa Hebreo sa natural na pananalitang Tagalog.
- source_word: אֲשֶׁר יָלְדָה לּוֹ מִלְכָּה
  choice: na ipinanganak ni Milca kay Nahor
  rationale: Nililinaw na si Betuel ang ipinanganak ni Milca kay Nahor. Ang pagbanggit muli kay Nahor ay umiiwas sa malabong panghalip sa Tagalog.
- source_word: הַנֶּזֶם
  choice: ang singsing
  rationale: Maaaring tumukoy ang נֶזֶם sa isang singsing o palamuting bilog; ang kasunod na pariralang ‘sa ilong niya’ ang tumutukoy sa gamit nito rito.
- source_word: עַל אַפָּהּ
  choice: sa ilong niya
  rationale: Tuwirang inilalarawan ng אַף ang ilong, at natural sa Tagalog ang ‘singsing sa ilong.’
- source_word: וְהַצְּמִידִים
  choice: at ang mga pulseras
  rationale: Ang ‘pulseras’ ang pinakakaraniwang makabagong salitang Tagalog para sa mga palamuting tinutukoy ng צְמִידִים.
- source_word: עַל יָדֶיהָ
  choice: sa mga kamay niya
  rationale: Malapit ito sa literal na saklaw ng יָד, bagaman maaaring mas tiyak na mga pulsuhan ang tinutukoy dahil mga pulseras ang palamuti.
