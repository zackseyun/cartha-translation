base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/022.yaml
  text: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
translation:
  language: tl
  text: Nang matapos uminom ang mga kamelyo, kumuha ang lalaki ng isang singsing na ginto[a] na tumitimbang ng isang beka[b], at ng dalawang pulseras na isusuot sa mga kamay ng babae, na tumitimbang ng sampung siklo ng ginto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “singsing na ginto para sa ilong” o “hikaw na ginto”; ang salitang Hebreo ay maaaring tumukoy sa singsing na isinusuot sa ilong o tainga.
    reason: lexical_alternative
  - marker: b
    text: Ang isang beka ay yunit ng timbang na katumbas ng kalahating siklo.
    reason: cultural_note
lexical_decisions:
- source_word: כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת
  choice: Nang matapos uminom ang mga kamelyo
  rationale: Ipinahahayag ng parirala ang panahon at pagkakasunod-sunod ng mga pangyayari. Likas sa modernong Tagalog ang “nang matapos uminom” at hindi nito ipinipilit na agad na agad nangyari ang sumunod.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: “Ang lalaki” ang tahasang sinasabi ng Hebreo. Bagaman kilala siya sa konteksto bilang lingkod ni Abraham, hindi ginamit sa talatang ito ang salitang “lingkod.”
- source_word: נֶזֶם זָהָב
  choice: isang singsing na ginto
  rationale: Maaaring tumukoy ang נֶזֶם sa singsing na isinusuot sa ilong o tainga. Pinananatili ng pangkalahatang “singsing” ang tunay na lawak ng kahulugan, at inilalahad sa talababa ang mga posibleng tiyak na gamit.
- source_word: בֶּקַע מִשְׁקָלוֹ
  choice: na tumitimbang ng isang beka
  rationale: Ang beka ay sinaunang yunit ng timbang. Pinanatili ang katawagang Hebreo sa pangunahing teksto at ipinaliwanag ito sa talababa.
- source_word: וּשְׁנֵי צְמִידִים
  choice: at ng dalawang pulseras
  rationale: Tahasang dalawa ang bilang sa Hebreo; ang “dalawang pulseras” ay malinaw at natural sa Tagalog.
- source_word: עַל יָדֶיהָ
  choice: para sa mga kamay ng babae
  rationale: Literal itong “sa ibabaw ng kanyang mga kamay.” Ang “para sa mga kamay” ay nagpapanatili sa idyomang Hebreo nang hindi nililimitahan ang lokasyon sa pulsuhan o braso. Ginamit ang “ng babae” upang maging malinaw ang tinutukoy ng panghalip sa Tagalog.
- source_word: עֲשָׂרָה זָהָב מִשְׁקָלָם
  choice: na tumitimbang ng sampung siklong ginto
  rationale: Ibinibigay ng parirala ang pinagsamang timbang ng dalawang pulseras. Ipinahiwatig sa Hebreo ang yunit; ang paglalagay ng “siklo” ay nagbibigay ng kinakailangang linaw sa Tagalog.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang sinaunang yunit na “beka,” samantalang ginamit ang karaniwang biblikal na katawagang “siklo” para sa ipinahiwatig na yunit ng timbang. Inilagay ang marker [a] kaagad pagkatapos ng “singsing na ginto,” na siyang salitang ipinaliliwanag nito.
