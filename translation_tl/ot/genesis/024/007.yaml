revisions:
- from: Si Yahweh, ang Diyos ng langit, na kumuha sa akin mula sa sambahayan ng aking ama at mula sa lupaing sinilangan ko, ang siyang nagsalita sa akin at sumumpa sa akin, na sinasabi, ‘Sa iyong lahi ay ibibigay ko ang lupaing ito.’ Siya ang magsusugo ng kanyang anghel[a] sa unahan mo, at doon ka kukuha ng mapapangasawa para sa anak ko.
  to: Si Yahweh, ang Diyos ng langit, na nag-alis sa akin mula sa sambahayan ng aking ama at mula sa lupaing sinilangan ko, na nagsalita sa akin at sumumpa sa akin, na sinasabi, ‘Sa iyong lahi ay ibibigay ko ang lupaing ito’—siya ang magsusugo ng kanyang anghel[a] sa unahan mo, at kukuha ka mula roon ng babaeng magiging asawa ng anak ko.
  rationale: Bahagyang inayos ang salin para sa likas na modernong Filipino at para maging tahasan ang babae bilang mapapangasawa ng anak ni Abraham. Hindi binago ang pagkakasunod o saklaw ng mga pahayag, at napanatili ang leksikal na kalabuan ng מַלְאָךְ sa talababa.
