  source_fidelity: 'Tumpak na naipapasa ng draft ang mga pangunahing sugnay ng Hebreo: ang banal na pangalan, ‘Diyos ng langit,’ pag-alis ni Abraham mula sa sambahayan ng ama at lupang sinilangan, ang magkahiwalay na pagsasalita at panunumpa, ang pangako sa lahi, at ang pagsusugo ng anghel bago ang lingkod. Napananatili rin ang ‘mula roon’ sa huling atas.'
  naturalness: 'May isang maliit ngunit kapansin-pansing di-likas na konstruksyon sa modernong Filipino: ‘na kumuha sa akin mula sa ...’ Mas malinaw at mas idiomatiko ang ‘na nag-alis sa akin mula sa ...’ sa kontekstong inilayo ng Diyos si Abraham sa dating tahanan. Ang ‘babaeng mapapangasawa’ ay nilinaw bilang ‘babaeng magiging asawa’ upang maipahayag ang tahasang pambabaeng אִשָּׁה nang natural.'
  terminology: Ang ‘Yahweh,’ ‘Diyos ng langit,’ ‘lahi,’ ‘lupain,’ at ‘anghel’ ay angkop. Pinananatili ng talababa ang tunay na leksikal na alternatibong ‘mensahero’ para sa מַלְאָךְ nang hindi ipinipilit ang isang doktrinal na pagbasa.
