source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֣י הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜/נִי מִ/בֵּ֣ית אָבִ/י֮ וּ/מֵ/אֶ֣רֶץ מֽוֹלַדְתִּ/י֒ וַ/אֲשֶׁ֨ר דִּבֶּר לִ֜/י וַ/אֲשֶׁ֤ר נִֽשְׁבַּֽע לִ/י֙ לֵ/אמֹ֔ר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכ/וֹ֙ לְ/פָנֶ֔י/ךָ וְ/לָקַחְתָּ֥ אִשָּׁ֛ה לִ/בְנִ֖/י מִ/שָּֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/007.yaml
  text: Yahweh[a], the God of heaven, who took me from my father's house and from the land of my birth, and who spoke to me and who swore to me, saying, ‘To your offspring I will give this land’—he will send his angel before you, and you shall take a wife for my son from there.
translation:
  language: tl
  text: Si Yahweh, ang Diyos ng langit, na nag-alis sa akin mula sa sambahayan ng aking ama at mula sa lupaing sinilangan ko, na nagsalita sa akin at sumumpa sa akin, na sinasabi, ‘Sa iyong lahi ay ibibigay ko ang lupaing ito’—siya ang magsusugo ng kanyang anghel[a] sa unahan mo, at kukuha ka mula roon ng babaeng magiging asawa ng anak ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahero.” Ang salitang Hebreo na מַלְאָךְ ay maaaring tumukoy sa isang mensahero o sa isang anghel; sa kontekstong ito, mas malamang na isang makalangit na sugo ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: ang Diyos ng langit
  rationale: Likas at marangal sa modernong Filipino, habang pinananatili ang ugnayang genitibo ng parirala.
- source_word: לְקָחַנִי
  choice: kumuha sa akin
  rationale: Malapit sa karaniwang kahulugan ng לָקַח at tumutukoy sa pagkuha ng Diyos kay Abraham mula sa dati niyang kinaroroonan.
- source_word: מִבֵּית אָבִי
  choice: mula sa sambahayan ng aking ama
  rationale: Ang בֵּית אָב ay higit sa pisikal na bahay at maaaring tumukoy sa sambahayan o angkan ng ama; pinananatili ng salin ang aspektong pampamilya.
- source_word: וּמֵאֶרֶץ מוֹלַדְתִּי
  choice: at mula sa lupaing sinilangan ko
  rationale: Pinananatili ang diwa ng lupang pinagmulan o kapanganakan nang hindi nililimitahan ang salita sa angkan lamang.
- source_word: דִּבֶּר לִי
  choice: nagsalita sa akin
  rationale: Hindi ginawang ‘nangako’ sapagkat hiwalay sa Hebreo ang pagsasalita at ang panunumpa.
- source_word: נִשְׁבַּע לִי
  choice: sumumpa sa akin
  rationale: Tuwirang salin ng pandiwa sa konteksto ng panunumpa.
- source_word: לְזַרְעֲךָ
  choice: sa iyong lahi
  rationale: Ang ‘lahi’ ay natural sa Filipino at naipahahayag ang kolektibong diwa ng זֶרַע nang hindi sapilitang ginagawang tahasang maramihan.
- source_word: אֶתֵּן אֶת הָאָרֶץ הַזֹּאת
  choice: ibibigay ko ang lupaing ito
  rationale: Tuwirang pinananatili ang pormula ng pangako at ang covenantal na diwa ng ‘lupain.’
- source_word: הוּא
  choice: Siya ang
  rationale: Ipinahahayag ng hulma na ito ang diin ng nakahiwalay na panghalip sa Hebreo.
- source_word: יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ
  choice: magsusugo ng kanyang anghel sa unahan mo
  rationale: Sa konteksto ng paggabay ng Diyos, ‘anghel’ ang mas malamang na kahulugan ng מַלְאָךְ; ang ‘sa unahan mo’ ay malapit sa לְפָנֶיךָ.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי מִשָּׁם
  choice: at doon ka kukuha ng mapapangasawa para sa anak ko
  rationale: Natural sa modernong Filipino at pinananatili ang tungkulin ng lingkod na kumuha mula roon ng babaeng mapapangasawa ng anak ni Abraham.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng מַלְאָכוֹ
  choice: kanyang anghel
  alternative: kanyang mensahero
  rationale: Maaaring mangahulugan ang מַלְאָךְ ng mensahero o anghel. Mas malamang dito ang makalangit na sugo dahil Diyos ang nagsusugo upang manguna at gumabay, ngunit tunay ang leksikal na alternatibo kaya inilagay ito sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘sambahayan’ upang maipakita na ang ‘bahay ng ama’ ay isang yunit ng pamilya, at ‘mapapangasawa’ upang maging natural ang atas nang hindi binabago ang kahulugan. Ang paulit-ulit na mga sugnay ng Hebreo ay bahagyang inayos para sa linaw, ngunit pinanatili ang magkahiwalay na kilos ng pagsasalita at panunumpa.
