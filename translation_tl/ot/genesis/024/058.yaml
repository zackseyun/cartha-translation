  yaml_path: translation/ot/genesis/024/058.yaml
  text: So they called Rebekah and said to her, “Will you go with this man?” And she said, “I will go.”
translation:
  language: tl
  text: Kaya tinawag nila si Rebeca at sinabi sa kanya, “Sasama ka ba sa lalaking ito?” Sumagot siya, “Sasama ako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ לְרִבְקָה
  choice: tinawag nila si Rebeca
  rationale: Ang קרא na may לְ sa kontekstong ito ay pagtawag kay Rebeca upang makilahok sa usapan. Likas sa modernong Tagalog ang “tinawag,” samantalang labis na pormal o mapuwersa ang “ipinatawag.” Ginamit ang karaniwang anyong Tagalog na “Rebeca” para sa pangalang רִבְקָה.
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: sinabi sa kanya
  rationale: Pinananatili nito ang karaniwang pandiwang אמר, “sabihin,” bagaman tanong ang kasunod. Posible ang “tinanong siya,” ngunit hindi iyon kasing-tuwirang kumakatawan sa anyo ng Hebreo.
- source_word: הֲתֵלְכִי עִם הָאִישׁ הַזֶּה
  choice: Sasama ka ba sa lalaking ito?
  rationale: Literal na tumutukoy ang הלך sa pagpunta, ngunit kapag may עִם (“kasama”) at ang kausap ay inaanyayahang lumakbay kasama ng isang tao, “sasama” ang natural at tumpak na katumbas sa Tagalog. Pinanatili ang אִישׁ bilang “lalaki,” hindi “lingkod,” dahil iyon ang mismong tawag sa Hebreo.
- source_word: וַתֹּאמֶר אֵלֵךְ
  choice: Sumagot siya, “Sasama ako.”
  rationale: Sa tugon sa isang tuwirang tanong, mas natural sa Tagalog ang “sumagot” kaysa “sinabi,” kahit אמר ang pandiwa. Ang “sasama ako” ay tumutugma sa idiomatikong anyo ng naunang tanong at malinaw na naghahayag ng pasiya niyang lumakbay kasama ng lalaki.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at madaling maunawaan. Gumamit ng idiomatikong “sasama” sa halip na mekanikal na “pupunta kasama,” nang hindi nagdaragdag ng teolohikal o denominasyonal na pakahulugan.
