  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בּ֖וֹא בְּר֣וּךְ יְהוָ֑ה לָ֤/מָּה תַעֲמֹד֙ בַּ/ח֔וּץ וְ/אָנֹכִי֙ פִּנִּ֣יתִי הַ/בַּ֔יִת וּ/מָק֖וֹם לַ/גְּמַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/031.yaml
  text: And he said[a], “Come in, blessed of Yahweh. Why do you stand outside? I have prepared the house, and a place for the camels.”
translation:
  language: tl
  text: Sinabi niya, “Tumuloy ka, ikaw na pinagpala ni Yahweh.[a] Bakit ka nakatayo sa labas? Inihanda ko na ang bahay at isang lugar para sa mga kamelyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “O pinagpala ni Yahweh” o “ikaw na pinagpala ng PANGINOON.”
    reason: Ipinapakita ang posibleng himig bilang pantawag at ang tradisyonal na pagsasalin ng banal na pangalan bilang titulo.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi niya
  rationale: Likas na pasulong na salaysay sa Filipino; ipinahihiwatig na ng pagkakasunod ng mga pangungusap ang Hebreong wayyiqtol kahit hindi tahasang isalin ang וַ bilang “at.”
- source_word: בּוֹא
  choice: Tumuloy ka
  rationale: Sa konteksto ng pagpapatuloy sa panauhin, malinaw at natural itong paanyayang pumasok, hindi lamang lumapit.
- source_word: בְּרוּךְ יְהוָה
  choice: ikaw na pinagpala ni Yahweh
  rationale: Itinuturing ang pariralang participial bilang pantawag sa kausap at pinananatili ang kaugnayan ng pagpapala kay Yahweh nang hindi dinaragdagan ang kahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Filipino ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: לָמָּה תַעֲמֹד בַּחוּץ
  choice: Bakit ka nakatayo sa labas?
  rationale: Pinananatili ang tuwirang tanong at ang payak na diwa ng עמד at בחוץ sa natural na Filipino.
- source_word: פִּנִּיתִי
  choice: Inihanda ko na
  rationale: Bagaman maaari itong literal na tumukoy sa pagliligpit o pagbibigay ng espasyo, ang resulta sa konteksto ng pagpapatuloy sa panauhin ay likas na ipinahahayag bilang paghahanda.
- source_word: הַבַּיִת
  choice: ang bahay
  rationale: Direkta at karaniwang katumbas ng בית bilang tirahang pagtutuluyan.
- source_word: וּמָקוֹם לַגְּמַלִּים
  choice: at isang lugar para sa mga kamelyo
  rationale: Pinananatiling hindi tinutukoy ang eksaktong gamit ng lugar—maaaring para sa pagpapahinga, pagtali, o pag-aalaga—gaya ng tekstong Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang hayagang nasa Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Ugnayan ng בְּרוּךְ kay יְהוָה
  choice: ikaw na pinagpala ni Yahweh
  alternative: pinagpala para kay Yahweh; O pinagpala ni Yahweh
  rationale: Maaaring maunawaan ang Hebreong construct bilang pagpapalang nagmumula kay Yahweh o bilang katawagang nag-uugnay sa pinagpala kay Yahweh. Ginamit ang pinakanatural na Filipino at itinala sa talababa ang iba pang posibleng himig.
translation_notes:
  register: Makabago, malinaw, at magalang na Filipino. Ang “Tumuloy ka” ay karaniwang pananalita sa pagpapatuloy sa panauhin, samantalang ang “ikaw na pinagpala ni Yahweh” ay nagpapanatili ng marangal at bahagyang pormal na himig ng pagbati.
