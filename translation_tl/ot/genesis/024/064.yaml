base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/064.yaml
  text: Rebekah lifted up her eyes and saw Isaac[a], and she got down from the camel.
translation:
  language: tl
  text: Tumingala si Rebeca at nakita niya si Isaac. Pagkatapos, bumaba siya mula sa kamelyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “nahulog siya mula sa ibabaw ng kamelyo.” Malamang na ginamit dito ang “nahulog” bilang idyoma para sa pagbaba mula sa kamelyo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא רִבְקָה אֶת־עֵינֶיהָ
  choice: Tumingala si Rebeca
  rationale: Ang literal na idyomang Hebreo ay ‘itinaas ni Rebeca ang kaniyang mga mata.’ Ang ‘tumingala’ ay natural at malinaw sa modernong Filipino at naipapahayag ang kilos ng pag-angat ng tingin nang hindi nagiging mabigat.
- source_word: וַתֵּרֶא
  choice: nakita niya
  rationale: Tuwirang ipinapahayag nito ang payak na pandamang kahulugan ng ראה at ang sunod-sunod na kilos sa salaysay.
- source_word: אֶת־יִצְחָק
  choice: si Isaac
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa modernong Filipino.
- source_word: וַתִּפֹּל מֵעַל הַגָּמָל
  choice: bumaba siya mula sa kamelyo
  rationale: Bagaman karaniwang nangangahulugang ‘mahulog’ ang נפל, malamang na idyomatiko rito ang parirala at tumutukoy sa mabilis na pagbaba mula sa sinasakyang kamelyo. Iniiwasan ng ‘bumaba’ ang maling pahiwatig na aksidente itong pagkahulog, habang itinatala sa talababa ang mas literal na pagbasa.
theological_decisions: []
translation_notes:
  register: Natural, kasalukuyan, at marangal na Filipino. Pinili ang ‘tumingala’ sa halip na ang mas literal ngunit hindi likas na ‘itinaas ang kaniyang mga mata,’ at ‘bumaba’ sa pangunahing teksto upang maging malinaw ang malamang na kahulugan sa konteksto.
