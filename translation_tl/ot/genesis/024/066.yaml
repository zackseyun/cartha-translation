  text: And the servant told Isaac all the things that he had done[a][b].
translation:
  language: tl
  text: At isinalaysay ng lingkod kay Isaac ang lahat ng ginawa niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lahat ng pangyayari” o “ang lahat ng bagay.” Maaari ring mangahulugan ang salitang Hebreo na דְּבָרִים ng “mga salita,” “mga bagay,” “mga usapin,” o “mga pangyayari,” ayon sa konteksto. Maaari ring isalin ang “lingkod” bilang “alipin,” sapagkat maaaring taglayin ng Hebreong עֶבֶד ang alinmang kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: isinalaysay
  rationale: Ang Piel na anyo ng ספר ay nagpapahiwatig ng detalyadong pagkukuwento o pag-uulat. Likas sa konteksto ang “isinalaysay” dahil ibinalita ng lingkod kay Isaac ang naganap sa kaniyang misyon.
- source_word: הָעֶבֶד
  choice: ang lingkod
  rationale: Maaaring mangahulugan ang עֶבֶד na “lingkod” o “alipin.” Sa salaysay na ito, tungkulin niya sa sambahayan ang binibigyang-diin, kaya “lingkod” ang pinakamalinaw at pinakanatural na salin.
- source_word: לְיִצְחָק
  choice: kay Isaac
  rationale: Ginamit ang karaniwang anyo ng pangalang Isaac sa modernong Filipino, at ipinahayag ng “kay” ang di-tuwirang layon.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: ang lahat
  rationale: Sa konteksto, saklaw ng דְּבָרִים ang buong pangyayari at mga detalye ng misyon. Natural na ipinahahayag ito sa Filipino bilang “ang lahat ng ginawa niya,” habang pinananatili sa talababa ang mas literal na mga posibilidad.
- source_word: אֲשֶׁר עָשָׂה
  choice: ng ginawa niya
  rationale: Tumutukoy ang sugnay sa mga natapos nang ginawa ng lingkod bago niya isinalaysay ang mga iyon kay Isaac. Malinaw na naihahayag ng aspektong perpektibo ng “ginawa” ang naunang natapos na kilos.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Pinili ang “isinalaysay” upang ipakita na iniulat ng lingkod ang kabuuan ng kaniyang misyon. Pinagsama sa isang talababa ang dalawang leksikal na kalabuan upang hindi mabigatan ang maikling talata, at inilagay ang marker sa dulo ng pangungusap kung saan naaangkop ito sa dalawang terminong ipinaliliwanag.
