base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/044.yaml
  text: and says to me[a], ‘You also drink, and I will draw water for your camels as well’—let her be the woman whom Yahweh has appointed for my master’s son.
translation:
  language: tl
  text: at sabihin niya sa akin, ‘Uminom ka rin, at sasalok din ako ng tubig para sa mga kamelyo mo’—siya ang babaeng itinalaga ni Yahweh para sa anak ng aking panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “siya ang babaeng ipinasya [o pinili] ni Yahweh para sa anak ng aking panginoon.”
    reason: Ipinakikita ang leksikal na lawak ng הֹכִיחַ, na maaaring mangahulugang magpasya, pumili, o magtalaga sa kontekstong ito.
lexical_decisions:
- source_word: וְאָמְרָה אֵלַי
  choice: at magsabi sa akin
  rationale: Ang ganap na pandiwang Hebreo ay bahagi ng hinihiling na palatandaan sa tuwirang pananalita; ang anyong “magsabi” ay natural sa Filipino at umaayon sa kondisyunal o panalanging diwa ng konteksto.
- source_word: גַּם אַתָּה שְׁתֵה
  choice: Uminom ka rin
  rationale: Pinananatili ng “rin” ang diin ng גַּם sa taong kinakausap, at malinaw na pautos ang “uminom ka.”
- source_word: וְגַם לִגְמַלֶּיךָ אֶשְׁאָב
  choice: at sasalok din ako ng tubig para sa mga kamelyo mo
  rationale: Ang שׁאב ay “sumalok”; tahasang idinagdag ang “tubig” ayon sa konteksto at likas na gamit sa Filipino, habang ipinapakita ng “din” ang paralel na pagdaragdag.
- source_word: הִוא הָאִשָּׁה
  choice: siya nawa ang babaeng
  rationale: Ang “babae” ang wastong kahulugan dito, hindi pa tahasang “asawa.” Ipinahahayag ng “nawa” ang panalanging o jussive na puwersa ng buong pahayag sa konteksto.
- source_word: אֲשֶׁר הֹכִיחַ
  choice: itinalaga
  rationale: Sa konteksto ng pagpili ng Diyos bilang tugon sa panalangin, ang Hiphil ng יכח ay pinakamalinaw na naihahayag bilang “itinalaga,” habang kinikilala sa talababa ang posibleng “ipinasya” o “pinili.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: לְבֶן אֲדֹנִי
  choice: para sa anak ng aking panginoon
  rationale: Likas at tumpak nitong ipinahahayag ang kaugnayan at layunin ng לְ; ang “panginoon” dito ay tumutukoy sa amo ng lingkod.
theological_decisions:
- issue: Paglalarawan sa pagkilos ni Yahweh sa pagpili sa babae
  choice: itinalaga
  alternative: ipinasya o pinili
  rationale: Ipinahahayag ng “itinalaga” ang aktibong banal na pagtukoy nang hindi dinaragdagan ang teksto ng mas tiyak na doktrinal na paliwanag.
- issue: Puwersa ng הִוא הָאִשָּׁה sa loob ng panalangin
  choice: siya nawa ang babae
  alternative: siya ang babae
  rationale: Bagaman pormal na pangungusap na pantukoy ang Hebreo, ang konteksto ay panalangin para sa isang palatandaan; pinananatili ng “nawa” ang hinihiling na diwa nang hindi ginagawang utos sa Diyos.
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Direktang inililipat ang Tetragrammaton bilang personal na pangalan at hindi bilang pamagat.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “panginoon” para sa amo ng lingkod at “Yahweh” para sa banal na pangalan. Inilagay ang talababa sa dulo ng kaugnay na pangungusap upang hindi maputol ang sipi.
