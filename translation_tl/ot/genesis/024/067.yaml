translation_notes:
  register: Gumamit ng kasalukuyan, marangal, at madaling maunawaang Tagalog. Pinili ang “tolda” sa halip na mas teknikal o makalumang salita. Nilinaw ang mga panghalip sa pamamagitan ng pag-uulit sa mga pangalang Isaac at Rebeca kung saan maaaring lumabo ang tinutukoy.
