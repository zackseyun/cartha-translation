base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/067.yaml
  text: And Isaac brought her into the tent of Sarah his mother[a], and he took Rebekah, and she became his wife, and he loved her[b]. So Isaac was comforted after his mother's death.
translation:
  language: tl
  text: Dinala siya ni Isaac sa tolda ng kanyang inang si Sara[a]. Kinuha ni Isaac si Rebeca, at naging asawa niya ito. Minahal niya si Rebeca. At naaliw si Isaac pagkamatay ng kanyang ina.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa tolda ni Sara na kanyang ina.” Pinahihintulutan ng ayos ng mga salita sa Hebreo ang alinmang pagkakaayos, ngunit iisa ang pangunahing diwa.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pagkatapos ng kanyang ina.” Hindi tahasang binabanggit sa Hebreo ang salitang “kamatayan,” ngunit ang diwa sa konteksto ay matapos mamatay o mawala ang kanyang ina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִאֶהָ
  choice: Dinala siya ni Isaac
  rationale: Ang Hiphil ng בוא na may hulaping pambabae ay nangangahulugang ipinasok o dinala siya. Likas sa Tagalog ang “dinala siya” at hindi nito dinaragdagan ang kilos.
- source_word: הָאֹהֱלָה
  choice: sa tolda
  rationale: Ipinahihiwatig ng directional ה ang pagpunta papasok o patungo sa tolda. Sa kontekstong ito, natural nang ipinahihiwatig ng Tagalog na “sa tolda” ang pagpasok.
- source_word: שָׂרָה אִמּוֹ
  choice: ng kanyang inang si Sara
  rationale: Kinilala ng pariralang appositional si Sara bilang ina ni Isaac at ang tolda bilang kanya. Malinaw at likas sa modernong Tagalog ang ayos na ito.
- source_word: וַיִּקַּח אֶת־רִבְקָה
  choice: Kinuha ni Isaac si Rebeca
  rationale: Pinananatili ng “kinuha” ang karaniwang kahulugan ng לקח at hindi isinasama agad ang kasunod na hiwalay na pahayag na naging asawa niya si Rebeca.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: naging asawa niya ito
  rationale: Natural na salin ito ng idyomang היה + ל + אשה at pinananatili ang pagsulong ng salaysay tungo sa pagiging mag-asawa.
- source_word: וַיֶּאֱהָבֶהָ
  choice: Minahal niya si Rebeca
  rationale: Tuwirang katumbas ng אהב ang “minahal.” Inulit ang pangalan upang maging malinaw ang tinutukoy sa Tagalog.
- source_word: וַיִּנָּחֵם
  choice: naaliw si Isaac
  rationale: Ang Niphal ng נחם dito ay tumutukoy sa pagtanggap o pagkakaroon ng kaaliwan, hindi sa pagsisisi. Maikli at natural ang “naaliw.”
- source_word: אַחֲרֵי אִמּוֹ
  choice: pagkamatay ng kanyang ina
  rationale: Literal na “pagkatapos ng kanyang ina” ang eliptikong Hebreo, ngunit malinaw sa mas malawak na konteksto na ang tinutukoy ay ang panahon matapos mamatay si Sara. Inilagay sa talababa ang literal na anyo upang hindi maitago ang elipsis.
