base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/002.yaml
  text: And Abraham said to his servant[a], the oldest of his household, who ruled over all that belonged to him[b], “Please put your hand under my thigh.”
translation:
  language: tl
  text: At sinabi ni Abraham sa kanyang lingkod, ang pinakamatanda sa kanyang sambahayan, na namamahala sa lahat ng kanyang pag-aari[b], “Pakilagay ang kamay mo sa ilalim ng aking hita[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang paglalagay ng kamay sa ilalim ng hita ay isang sinaunang kilos na kaugnay ng panunumpa, na malamang na nagpapahiwatig ng taimtim na pagtatalaga.
    reason: cultural_note
  - marker: b
    text: 'Mas literal: “na namumuno sa lahat ng nasa kanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng waw-consecutive nang hindi dinaragdagan ang pagkakasunod-sunod ng mga pangyayari.
- source_word: עַבְדּוֹ
  choice: sa kanyang lingkod
  rationale: Maaaring tumukoy ang עֶבֶד sa alipin o lingkod, ngunit dito ay itinatampok ang pinagkakatiwalaang opisyal ng sambahayan ni Abraham; natural at angkop sa konteksto ang “lingkod.”
- source_word: זְקַן בֵּיתוֹ
  choice: ang pinakamatanda sa kanyang sambahayan
  rationale: Ipinahahayag ang katandaan o pagiging nakatatanda ng lingkod sa sambahayan nang hindi tahasang nagdaragdag ng isang titulong hindi nasa Hebreo.
- source_word: הַמֹּשֵׁל בְּכָל אֲשֶׁר־לוֹ
  choice: na namamahala sa lahat ng kanyang pag-aari
  rationale: Ang “namamahala” ay likas na Filipino para sa paggamit ng מֹשֵׁל sa kontekstong ito, at malinaw na ipinahahayag ng “kanyang pag-aari” ang lahat ng nasa kanya.
- source_word: שִׂים נָא
  choice: Pakilagay
  rationale: Naipapahayag ng “paki-” ang magalang o taimtim na pakiusap na dala ng pautos at ng katagang נָא.
- source_word: יָדְךָ
  choice: ang kamay mo
  rationale: Tuwiran at natural na salin ng parirala.
- source_word: תַּחַת יְרֵכִי
  choice: sa ilalim ng aking hita
  rationale: Pinananatili ang tiyak at makulturang kilos sa Hebreo; mas angkop na ipaliwanag ang kahulugan nito sa talababa kaysa palawakin ang pangunahing teksto.
theological_decisions:
- issue: Kahulugan ng paglalagay ng kamay sa ilalim ng hita
  choice: Pinanatili ang literal na kilos sa pangunahing teksto at maingat na ipinaliwanag sa talababa bilang sinaunang kilos sa panunumpa.
  alternative: Isalin ang kilos bilang tahasang panunumpa o bigyan ito ng mas tiyak na simbolikong kahulugan sa pangunahing teksto.
  rationale: Hindi tahasang ipinaliliwanag ng talata ang kahulugan ng kilos. Iniiwasan ng salin ang pagtiyak sa isang interpretasyong lampas sa sinabi ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” para sa malawak na kahulugan ng בַּיִת dito at ang “Pakilagay” upang natural na maipahayag ang magalang na pakiusap.
