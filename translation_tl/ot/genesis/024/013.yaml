  text: Look[a], I am standing by the spring of water[c][b], and the daughters of the men of the city are coming out to draw water.
translation:
  language: tl
  text: Narito, nakatayo ako sa tabi ng bukal[a], at lumalabas ang mga dalaga ng lungsod[b] upang umigib ng tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinagmumulan ng tubig.” Ang salitang Hebreo ay tumutukoy sa bukal o likas na labasan ng tubig, hindi sa karaniwang salita para sa “balon.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga anak na babae ng mga lalaki ng lungsod.” Isa itong panlipunan at pampamilyang pananalita para sa mga kabataang babaeng taga-lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Pantukoy na itinutuon ang pansin sa kasalukuyang tagpo. Ang “Narito” ay likas at marangal sa makabagong Tagalog nang hindi gumagamit ng tahasang pautos na wala sa Hebreo.
- source_word: אָנֹכִי נִצָּב
  choice: nakatayo ako
  rationale: Ang malayang panghalip at Niphal participle ay nagsasaad ng kasalukuyang kalagayan ng nagsasalita. Likas sa Tagalog ang ayos na “nakatayo ako.”
- source_word: עַל עֵין הַמָּיִם
  choice: sa tabi ng bukal
  rationale: Sa kontekstong ito, ang עַל ay tumutukoy sa pagiging malapit sa pinagmumulan ng tubig. Ang עֵין הַמָּיִם ay bukal o likas na labasan ng tubig, hindi ang karaniwang salitang Hebreo para sa balon.
- source_word: וּבְנוֹת אַנְשֵׁי הָעִיר
  choice: at ... ang mga anak na babae ng mga lalaki sa lungsod
  rationale: Pinananatili ang panlipunan at pampamilyang pananalita ng Hebreo at ang tahasang panlalaking anyo ng אַנְשֵׁי, kahit medyo pormal ang pagkakabuo sa Tagalog.
- source_word: יֹצְאֹת
  choice: lumalabas
  rationale: Ang pambabaeng maramihang participle ay naglalarawan ng kilos na nagaganap o nakikitang nagsisimula mula sa kinatatayuan ng nagsasalita.
- source_word: לִשְׁאֹב מָיִם
  choice: upang umigib ng tubig
  rationale: Ang “umigib ng tubig” ang likas at tiyak na katumbas sa Tagalog ng pagkuha ng tubig mula sa bukal o ibang imbakan.
