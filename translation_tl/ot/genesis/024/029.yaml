  yaml_path: translation/ot/genesis/024/029.yaml
  text: Rebekah had a brother[a], and his name was Laban; and Laban ran out to the man[b], outside by the spring.
translation:
  language: tl
  text: May kapatid na lalaki si Rebeca na nagngangalang Laban. Tumakbo si Laban palabas patungo sa lalaki na nasa bukal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “patungo sa lalaki, patungo sa bukal.”'
    reason: Pinananatili ng talababa ang magkatulad na paggamit ng אֶל sa dalawang parirala at ang posibleng sintaktikong pagbasa nito.
lexical_decisions:
- source_word: וּ/לְ/רִבְקָה אָח
  choice: May kapatid na lalaki si Rebeca
  rationale: Ang pariralang may לְ ay isang Hebreong paraan ng pagpapahayag ng pag-aari o kaugnayan. Likas itong isalin sa Filipino gamit ang “may.” Nilinaw ng “lalaki” ang kahulugan ng אָח.
- source_word: וּ/שְׁמ/וֹ לָבָן
  choice: na nagngangalang Laban
  rationale: Natural at maikli itong katumbas ng Hebreong pormula na “at ang pangalan niya ay Laban,” nang hindi binabago ang impormasyon.
- source_word: וַ/יָּרָץ
  choice: Tumakbo
  rationale: Tuwirang ipinahahayag ng pandiwa ang mabilis na pagkilos na “tumakbo,” hindi lamang “nagmadali.”
- source_word: אֶל הָ/אִישׁ
  choice: patungo sa lalaki
  rationale: Pinanatili ang karaniwang pangngalang “lalaki” sa halip na tukuyin siya bilang lingkod ni Abraham, sapagkat hindi iyon tahasang sinasabi sa talata.
- source_word: הַ/חוּצָ/ה
  choice: palabas
  rationale: Isinasalin nito ang panandang patungo sa labas at likas itong iugnay sa “tumakbo.”
- source_word: אֶל הָ/עָיִן
  choice: na nasa bukal
  rationale: Ang עַיִן ay mas tiyak na “bukal” kaysa “balon.” Ang lokatibong ayos ay natural sa Filipino at nagpapahiwatig na naroon sa bukal ang lalaki.
