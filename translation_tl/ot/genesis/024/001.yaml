  text: וְ/אַבְרָהָ֣ם זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַֽ/יהוָ֛ה בֵּרַ֥ךְ אֶת אַבְרָהָ֖ם בַּ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/001.yaml
  text: Abraham was old[a], advanced in years, and Yahweh had blessed Abraham in all things.
translation:
  language: tl
  text: Matanda na si Abraham at lipas na sa gulang, at pinagpala ni Yahweh si Abraham sa lahat ng bagay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: si Abraham
  rationale: Ang waw ay nag-uugnay at nagbubukas ng bagong bahagi ng salaysay; hindi kailangan ang artipisyal na panimulang “Ngayon” sa natural na Tagalog.
- source_word: זָקֵן
  choice: matanda na
  rationale: Direkta at karaniwang pagpapahayag ito ng katandaan sa modernong Tagalog.
- source_word: בָּא בַּ/יָּמִים
  choice: matagal nang nabubuhay[a]
  rationale: Inihahatid nito sa natural na Tagalog ang idyomang Hebreo na literal na “dumating sa mga araw,” na tumutukoy sa pagiging lubhang may edad, habang pinananatili ang pag-uulit na nagbibigay-diin sa katandaan.
- source_word: וַֽ/יהוָה
  choice: at … ni Yahweh
  rationale: Pinananatili ang pang-ugnay at tahasang isinasalin ang banal na pangalang יהוה bilang “Yahweh.”
- source_word: בֵּרַךְ
  choice: pinagpala
  rationale: Ang aspektong Tagalog ay natural na naglalahad ng pagpapalang naipagkaloob na at umiiral bilang kaligiran ng salaysay.
- source_word: בַּ/כֹּל
  choice: sa lahat ng bagay
  rationale: Ipinahahayag nito ang lawak at pagiging ganap ng pagpapala nang hindi nililimitahan iyon sa materyal na pag-aari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangngalang pantangi ang Tetragrammaton sa teksto; pinananatili ng “Yahweh” ang tahasang banal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng pagpapala sa בַּכֹּל
  choice: sa lahat ng bagay
  alternative: sa lahat ng paraan
  rationale: Pinananatili ang malawak na saklaw ng Hebreo nang hindi ipinapakahulugang materyal lamang o tinutukoy kung paano eksaktong nahayag ang pagpapala.
translation_notes:
  register: Modernong Filipino Tagalog na simple at marangal. Pinanatili ang magkatambal na pahayag tungkol sa katandaan at ang pag-uulit ng pangalang Abraham, ayon sa anyo at diin ng Hebreo.
