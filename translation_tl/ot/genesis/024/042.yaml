base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/042.yaml
  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
translation:
  language: tl
  text: “Ngayong araw ay dumating ako sa bukal[a] at sinabi ko, ‘Yahweh, Diyos ng amo kong si Abraham, kung ngayo'y ipagkakaloob mo sana ang tagumpay sa aking lakad[b] na tinatahak ko—’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “balon.” Mas tiyak na tumutukoy ang salitang Hebreo sa isang bukal o pinagmumulan ng tubig.
    reason: lexical_alternative
  - marker: b
    text: Literal na “aking daan”; sa konteksto, tumutukoy ito sa paglalakbay o misyong isinasagawa ng lingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבֹא הַיּוֹם
  choice: Dumating ako ngayon
  rationale: Pinananatili nito ang diin sa pagdating sa araw ding iyon at natural ang ayos sa makabagong Tagalog.
- source_word: הָעָיִן
  choice: bukal
  rationale: Ang עַיִן ay mas tiyak na tumutukoy sa bukal o likas na pinagmumulan ng tubig kaysa sa pangkalahatang ‘balon.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa titik ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Diyos ng amo kong si Abraham
  rationale: Tumutukoy ang אֲדֹנִי sa taong pinaglilingkuran ng alipin; malinaw at natural sa Tagalog ang ‘amo ko.’
- source_word: אִם יֶשְׁךָ נָּא מַצְלִיחַ
  choice: kung pinagtatagumpay mo nga sana ngayon
  rationale: Pinananatili ng ‘kung’ ang nakabitin na kondisyong Hebreo, ng ‘sana’ ang pakiusap na ipinahihiwatig ng נָא, at ng ‘pinagtatagumpay’ ang causative na diwa ng participle מַצְלִיחַ.
- source_word: דַּרְכִּי
  choice: aking lakad
  rationale: Pinananatili nito ang possessive at ang metaporang ‘daan/lakad,’ habang maaari ring tumukoy sa paglalakbay o misyong isinasagawa ng lingkod.
- source_word: אֲשֶׁר אָנֹכִי הֹלֵךְ עָלֶיהָ
  choice: na tinatahak ko
  rationale: Natural na katumbas sa Tagalog ng Hebreong idyoma na literal na ‘na nilalakaran ko sa ibabaw nito.’
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ng ‘Yahweh’ ang pangalan sa halip na palitan ito ng titulo.
- issue: Di-tapos na kondisyong panalangin
  choice: kung pinagtatagumpay mo nga sana ngayon …—
  alternative: pakipagtagumpayin mo ang aking paglalakbay
  rationale: Pinananatili ang tunay na sintaktikong tensiyon ng אִם at ang putol na pahayag, sa halip na tahimik itong gawing tuwirang kahilingan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘amo’ para sa taong pinaglilingkuran at ‘aking lakad’ upang mapanatili ang larawan at possessive ng Hebreo. Ang gitling sa dulo ay sadyang nagpapanatili sa hindi pa tapos na kondisyong pahayag.
