  text: She said to him[a], “I am the daughter of Bethuel son of Milcah, whom she bore to Nahor.”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Ako ang anak na babae ni Betuel, ang anak ni Milca na isinilang niya kay Nahor[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na isinilang niya para kay Nahor.” Sa ganitong pormula ng kapanganakan sa Hebreo, karaniwang ipinakikilala ng “kay” ang ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Sinabi niya sa kanya
  rationale: Ang wayyiqtol ng אמר ay nagpapatuloy sa salaysay, at malinaw na ipinahahayag ng “sa kanya” ang direksiyon ng pagsasalita sa lalaking kausap.
- source_word: בַּת בְּתוּאֵל אָנֹכִי
  choice: Ako ang anak na babae ni Betuel
  rationale: Pinananatili ang tahasang panghalip na אָנֹכִי at ang tiyak na pagkakakilanlan bilang anak na babae ni Betuel sa natural na ayos ng modernong Tagalog.
- source_word: בְּתוּאֵל
  choice: Betuel
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: בֶּן מִלְכָּה
  choice: Anak siya ni Milca
  rationale: Ang בֶּן ay tumutukoy kay Betuel bilang anak ni Milca. Ginawang hiwalay na maikling pangungusap upang luminaw ang sanggunian nang hindi binabago ang ugnayang angkan.
- source_word: מִלְכָּה
  choice: Milca
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: אֲשֶׁר יָלְדָה
  choice: na ipinanganak nito
  rationale: Ang Qal 3fs ng ילד ay naglalarawan kay Milca bilang babaeng nagsilang kay Betuel. Ang “nito” ay tumutukoy sa kalapit na Milca at iniiwasan ang labis na pag-uulit ng pangalan.
- source_word: לְנָחוֹר
  choice: kay Nahor
  rationale: Sa pormulang Hebreo tungkol sa kapanganakan, minamarkahan ng לְ ang ama; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “kay Nahor.”
