  yaml_path: translation/ot/genesis/024/059.yaml
  text: So they sent away Rebekah their sister[a], and her nurse, and Abraham’s servant, and his men.
translation:
  language: tl
  text: Kaya pinayaon nila si Rebeca, na kapatid nila, pati ang babaeng nagpasuso sa kaniya, ang lingkod ni Abraham, at ang mga tauhan nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: pinahayo nila
  rationale: Ipinahahayag ng anyong piel ang pagpapayaon sa isang tao. Ang “pinahayo” ay natural at marangal, at mas malinaw na tumutukoy sa pormal na pagpapalis para sa paglalakbay kaysa sa simpleng “ipinadala.”
- source_word: רִבְקָה
  choice: Rebeca
  rationale: Ginamit ang nakaugaliang baybay sa modernong salin ng Bibliya sa Filipino.
- source_word: אֲחֹתָם
  choice: kapatid nilang
  rationale: Tuwirang katumbas ito ng “kanilang kapatid.” Hindi likas na kailangang tukuyin sa Filipino ang kasariang pambabae sapagkat malinaw na si Rebeca ang tinutukoy.
- source_word: מֵנִקְתָּהּ
  choice: tagapag-alaga nito
  rationale: Ang salita ay tumutukoy sa babaeng nagpasuso kay Rebeca at nagpatuloy bilang kaniyang kasama o tagapag-alaga. Natural sa kasalukuyang Filipino ang “tagapag-alaga,” habang pinananatili sa talababa ang mas tiyak na kahulugan.
- source_word: עֶבֶד אַבְרָהָם
  choice: ang lingkod ni Abraham
  rationale: Likas na ipinapahayag nito ang ugnayang nasa construct phrase. Bagaman maaari ring mangahulugang alipin ang עֶבֶד, ang tungkulin niya bilang pinagkakatiwalaang lingkod ang tampok sa salaysay.
- source_word: אֲנָשָׁיו
  choice: ang mga tauhan nito
  rationale: Ang hulaping panghalip ay tumutukoy sa lingkod ni Abraham. Nililinaw ng “nito” na sa lingkod nakaugnay ang mga tauhan, nang hindi ipinapalagay ang mas tiyak nilang katungkulan.
