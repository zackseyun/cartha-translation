  terminology: Pinanatili ang Rebeca, “lingkod ni Abraham,” at “mga tauhan nito.” Ginawang tiyak ang מֵנִקְתָּהּ bilang “babaeng nagpasuso,” nang hindi ipinapalagay ang iba pang tungkulin ng isang tagapag-alaga.
