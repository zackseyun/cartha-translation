  yaml_path: translation/ot/genesis/024/054.yaml
  text: Then he and the men who were with him ate and drank[a], and they spent the night there. When they arose in the morning, he said, “Send me away to my master.”
translation:
  language: tl
  text: Pagkatapos, kumain at uminom siya at ang mga lalaking kasama niya, at doon sila nagpalipas ng gabi. Kinaumagahan, nang bumangon sila, sinabi niya, “Pahintulutan ninyo akong umalis patungo sa aking amo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking panginoon.” Ang Hebreong אֲדֹנִי ay maaaring mangahulugang “aking panginoon” o “aking amo”; dito, tumutukoy ito kay Abraham, na amo ng lingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: kumain at uminom
  rationale: Pinananatili ang maikli at sunod-sunod na mga kilos sa salaysay.
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר עִמּוֹ
  choice: siya at ang mga lalaking kasama niya
  rationale: Pinananatili ang tahasang panghalip at ang buong pangkat ng simuno; ang “siya” ay tumutukoy sa lingkod ni Abraham.
- source_word: וַיָּלִינוּ
  choice: doon sila nagpalipas ng gabi
  rationale: Likas na salin ng pandiwang nangangahulugang manatili o tumuloy nang magdamag; ipinahihiwatig ng “doon” ang lugar ng kanilang pagtuloy.
- source_word: וַיָּקֻמוּ בַבֹּקֶר
  choice: Kinaumagahan, nang bumangon sila
  rationale: Malinaw at likas sa makabagong Filipino, habang pinananatili ang kilos ng pagbangon sa umaga.
- source_word: שַׁלְּחֻנִי
  choice: Pahintulutan na ninyo akong umalis
  rationale: Ipinahahayag ang pakiusap na payagan siyang humayo; ang “ninyo” ay angkop sa maramihang pautos sa Hebreo at ang “na” ay likas na naghahatid ng kagyat na pagnanais na umalis.
- source_word: לַאדֹנִי
  choice: at pumunta sa aking amo
  rationale: Ang pang-ukol ay nagsasaad ng patutunguhan, at ang “amo” ay malinaw na tumutukoy kay Abraham bilang nakatataas sa lingkod.
theological_decisions:
- issue: Pagkakasalin ng אָדוֹן na tumutukoy kay Abraham
  choice: aking amo
  alternative: aking panginoon
  rationale: Mas malinaw sa kasalukuyang Filipino ang ugnayan ng lingkod at ng taong pinaglilingkuran niya, at naiiwasan ang di-sinasadyang pag-unawa na banal na titulo ito. Gayunman, inilalahad sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “amo” sa pangunahing teksto dahil karaniwan at tiyak ito sa ugnayang panlipunan sa konteksto; iniwasan ang labis na literal na “paalisin ninyo ako,” na maaaring magpahiwatig ng pagtataboy sa Filipino.
