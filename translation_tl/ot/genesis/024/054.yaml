  to: Pagkatapos, kumain at uminom siya at ang mga lalaking kasama niya, at doon sila nagpalipas ng gabi. Kinaumagahan, nang bumangon sila, sinabi niya, “Pahintulutan ninyo akong umalis patungo sa aking amo.[a]”
