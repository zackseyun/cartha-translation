lexical_decisions:
- source_word: כִּי
  choice: Kundi
  rationale: Sa konteksto, ipinakikita ng kataga ang pagsalungat sa naunang pagbabawal na kumuha ng asawa mula sa mga Cananeo; natural na naihahayag ito ng “Kundi” sa Filipino.
- source_word: אֶל אַרְצִי
  choice: sa aking lupain
  rationale: Pinananatili ng “lupain” ang heograpikong diwa ng אֶרֶץ nang hindi nagpapahiwatig ng makabagong bansang-estado.
- source_word: וְאֶל מוֹלַדְתִּי
  choice: at sa aking mga kamag-anak
  rationale: Maaaring tumukoy ang מוֹלֶדֶת sa pangkat ng mga kaanak o sa lugar na pinagmulan. Mas angkop sa layuning kumuha ng mapapangasawa mula sa sariling angkan ni Abraham ang “mga kamag-anak,” habang inilalahad sa talababa ang posibleng panlunan na kahulugan.
- source_word: תֵּלֵךְ
  choice: pumunta ka
  rationale: Ang anyo ng pandiwa ay may puwersa ng tagubilin sa tuwirang pananalita; malinaw at natural itong naihahayag ng pautos na “pumunta ka.”
- source_word: וְלָקַחְתָּ
  choice: at kumuha ka
  rationale: Karaniwang kahulugan ng לקח ang “kumuha.” Sa konteksto ng pag-aasawa, ang kasunod na “mapapangasawa” ang naglilinaw sa layunin nito.
- source_word: אִשָּׁה
  choice: mapapangasawa
  rationale: Bagaman maaaring mangahulugang “babae” o “asawa” ang אִשָּׁה, hinihingi ng konteksto ang diwa ng babaeng kukunin bilang asawa. Natural sa Filipino ang “mapapangasawa” para sa asawa na hahanapin pa lamang.
- source_word: לִבְנִי לְיִצְחָק
  choice: para sa anak kong si Isaac
  rationale: Ipinahahayag nito nang natural sa Filipino ang benepisyaryo at ang appositional na pagkakakilanlan ni Isaac bilang anak, habang itinatala sa talababa ang mas literal na pag-uulit ng pang-ukol.
