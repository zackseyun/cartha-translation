base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/010.yaml
  text: Then the servant took ten of his master's camels and went[a], with all kinds of good things from his master in his hand. And he arose and went to Aram-naharaim[d][c][b], to the city of Nahor.
translation:
  language: tl
  text: Pagkatapos, kumuha ang lingkod ng sampu sa mga kamelyo ng kanyang panginoon at umalis, dala ang lahat ng mahahalagang bagay ng kanyang panginoon.[a] Tumindig siya at naglakbay patungong Aram-Naharaim,[b] sa lungsod ng Nahor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at ang lahat ng mahalagang ari-arian ng kanyang panginoon ay nasa kanyang pamamahala.” Ang Hebreong “nasa kanyang kamay” ay maaaring tumukoy sa pagdadala, pag-aari, o pamamahala sa mga bagay.
    reason: lexical_alternative
  - marker: b
    text: Tradisyonal na “Mesopotamia”; maaari ding unawaing “Aram ng Dalawang Ilog.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֶבֶד
  choice: ang lingkod
  rationale: Maaaring tumukoy ang עֶבֶד sa lingkod o alipin. Sa konteksto ng sambahayan at atas na ipinagkatiwala sa kanya, natural ang “lingkod” nang hindi ipinapalagay ang tiyak na legal na katayuan.
- source_word: עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו
  choice: sampu sa mga kamelyo ng kanyang panginoon
  rationale: 'Pinananatili nito ang partitive na diwa ng מִן: pumili siya ng sampu mula sa mga kamelyong pag-aari ng kanyang panginoon.'
- source_word: וְכָל טוּב אֲדֹנָיו בְּיָדוֹ
  choice: Dala niya ang sari-saring mahahalagang bagay mula sa kanyang panginoon
  rationale: Sa kontekstong ito, ang טוּב ay tumutukoy sa mahahalagang ari-arian o handog, at ang בְּיָדוֹ ay nagpapahiwatig na ang mga iyon ay nasa kanyang pagdadala o pamamahala. Iniiwasan ng “sari-saring” ang mapanuring saling “pinakamainam,” habang ipinahahayag ang kolektibong diwa nang natural sa Tagalog.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: Tumindig siya at naglakbay
  rationale: 'Pinananatili ang dalawang magkasunod na kilos at ang Hebreong ritmo: nagsimula siyang kumilos nang may layunin at saka naglakbay.'
- source_word: אֲרַם נַהֲרַיִם
  choice: Aram-Naharaim
  rationale: Isinasatitik ang pangalang Hebreo sa halip na palitan agad ng tradisyonal ngunit interpretatibong “Mesopotamia” o isaling “Aram ng Dalawang Ilog.”
- source_word: עִיר נָחוֹר
  choice: lungsod ng Nahor
  rationale: Natural na salin ng construct chain at pinananatiling bukas kung ang lungsod ay pag-aari, itinatag, o basta kaugnay ni Nahor.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “panginoon” para sa amo ng lingkod sa sinaunang sambahayan; malinaw sa konteksto na hindi ito titulo para sa Diyos. Hinati sa maiikling pangungusap upang maging natural sa Tagalog nang hindi inaalis ang pagkakasunod-sunod ng mga kilos sa Hebreo.
