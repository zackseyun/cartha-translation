  text: And I said to my master[a], ‘Perhaps the woman will not follow me.’
translation:
  language: tl
  text: At sinabi ko sa aking panginoon, “Maaaring hindi sumama sa akin ang babae.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: At sinabi ko
  rationale: Ang wayyiqtol ng אמר ay nagpapatuloy sa salaysay; natural sa modernong Tagalog ang “At sinabi ko.”
- source_word: אֶל אֲדֹנִי
  choice: sa aking panginoon
  rationale: Tumutukoy ang אָדוֹן na may hulaping unang panauhan kay Abraham bilang nakatataas sa alipin. Pinananatili ng “aking panginoon” ang magalang at makasaysayang ugnayan nang hindi ito ginagawang pantukoy sa Diyos.
- source_word: אֻלַי
  choice: Paano kung
  rationale: Ipinahahayag ng אֻלַי ang posibilidad o pangamba. Sa tanong na ito, natural na Tagalog ang “Paano kung” at pinananatili nito ang kawalang-katiyakan.
- source_word: לֹא תֵלֵךְ הָאִשָּׁה אַחֲרָי
  choice: hindi sumama sa akin ang babae
  rationale: Ang הלך kasabay ng אַחֲרַי ay tumutukoy sa pagpunta ng babae kasama o kasunod ng alipin. Ang “sumama sa akin” ang natural na pagpapahayag sa Tagalog nang hindi dinaragdagan ang kahulugan.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Payak na “ang babae” ang nasa Hebreo; hindi pa siya tinatawag na asawa o dalaga sa mismong talata.
