base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/040.yaml
  text: And he said to me[a], ‘Yahweh, before whom I have walked, will send his angel with you and make your journey successful[b], and you will take a wife for my son from my clan and from my father’s house.’
translation:
  language: tl
  text: At sinabi niya sa akin, “Si Yahweh, na lumakad ako sa harapan niya, ay magpapadala ng kanyang anghel upang sumama sa iyo at gagawing matagumpay ang iyong paglalakbay.[a] Kukuha ka ng isang babae upang maging asawa ng aking anak na lalaki mula sa aking angkan[b] at mula sa sambahayan ng aking ama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at gagawing matagumpay ang iyong daan.”
    reason: lexical_alternative
  - marker: b
    text: O “pamilya”; maaaring tumukoy ang salitang Hebreo sa mas malawak na pangkat ng magkakamag-anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הִתְהַלַּכְתִּי לְפָנָיו
  choice: na sa harapan niya ako lumakad
  rationale: Pinananatili nito ang Hebreong talinghaga tungkol sa pamumuhay sa presensya at pananagutan sa Diyos nang hindi tahasang dinaragdagan ng salitang “tapat.”
- source_word: מַלְאָכוֹ
  choice: kanyang anghel
  rationale: Sa konteksto, isang makalangit na sugo ng Diyos ang tinutukoy; natural at tiyak dito ang “anghel.”
- source_word: וְהִצְלִיחַ דַּרְכֶּךָ
  choice: at pagtatagumpayin ang iyong paglalakbay
  rationale: Ipinahahayag ang causative na diwa ng pandiwa at ang idyomatikong “daan” bilang misyong paglalakbay.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: Kukuha ka ng mapapangasawa para sa anak kong lalaki
  rationale: Natural sa kasalukuyang Filipino at malinaw na ang babae ay kukuning asawa para sa anak na lalaki, hindi para sa nagsasalita.
- source_word: מִמִּשְׁפַּחְתִּי
  choice: mula sa aking angkan
  rationale: Maaaring tumukoy ang salita sa mas malawak na pangkat ng magkakamag-anak kaysa sa agarang pamilya.
- source_word: וּמִבֵּית אָבִי
  choice: at sa sambahayan ng aking ama
  rationale: Inilalarawan ang sambahayan o linya ng kamag-anak sa panig ng ama at iniiwasang ipakahulugan lamang bilang gusali.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang pangalan ng Diyos ayon sa anyong karaniwang ginagamit sa makabagong akademikong transliterasyon, nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng “lumakad sa harapan” ng Diyos
  choice: panatilihin ang talinghagang “sa harapan niya ako lumakad”
  alternative: “sa harapan niya ako namuhay nang tapat”
  rationale: Ipinahihiwatig ng parirala ang buong pamumuhay ni Abraham sa presensya ng Diyos, ngunit hindi tahasang nakasaad sa Hebreo ang “nang tapat”; kaya pinanatili ang teolohikal na pahiwatig at tensiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang biblikal na talinghagang “lumakad sa harapan,” samantalang ginawang natural ang mga parirala tungkol sa paglalakbay, pag-aasawa, at sambahayan.
