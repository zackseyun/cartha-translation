revisions:
- from: At sinabi niya sa akin, “Si Yahweh, na sa harapan niya ako lumakad, ay magsusugo ng kanyang anghel na kasama mo at pagtatagumpayin ang iyong paglalakbay.[a] Kukuha ka ng mapapangasawa para sa anak kong lalaki mula sa aking angkan[b] at sa sambahayan ng aking ama.”
  to: At sinabi niya sa akin, “Si Yahweh, na lumakad ako sa harapan niya, ay magpapadala ng kanyang anghel upang sumama sa iyo at gagawing matagumpay ang iyong paglalakbay.[a] Kukuha ka ng isang babae upang maging asawa ng aking anak na lalaki mula sa aking angkan[b] at mula sa sambahayan ng aking ama.”
  rationale: Inayos ang pananalita upang maging mas likas sa modernong Filipino, habang pinanatili ang saklaw at ayos ng Hebreo. Tahasang isinalin ang אִשָּׁה bilang “isang babae” upang mapanatili ang source-level na pagtukoy sa babaeng magiging asawa ng anak. Inilipat ang panandang talababa a sa parirala tungkol sa paglalakbay, na siyang tinutukoy ng alternatibong salin.
