base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/065.yaml
  text: And she said to the servant[a], “Who is this man walking in the field to meet us?” And the servant said[c][b], “He is my master.” Then she took the veil and covered herself.
translation:
  language: tl
  text: Tinanong niya ang lingkod, “Sino ang lalaking iyon na naglalakad sa bukirin upang salubungin tayo?” Sumagot ang lingkod, “Siya ang amo ko.” Pagkatapos, kinuha niya ang belo at itinakip niya ito sa sarili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֶבֶד
  choice: ang lingkod
  rationale: Maaaring tumukoy ang עֶבֶד sa lingkod o alipin; sa talatang ito, ang tungkulin niya bilang katiwala ng sambahayan ang nasa pokus, kaya natural ang “lingkod.”
- source_word: הַלָּזֶה
  choice: iyon
  rationale: Itinuturo ng demonstratibo ang lalaking nakikita sa di-kalayuan; sa modernong Tagalog, mas natural dito ang “lalaking iyon.”
- source_word: הַהֹלֵךְ בַּשָּׂדֶה לִקְרָאתֵנוּ
  choice: na naglalakad sa parang upang salubungin tayo
  rationale: Pinananatili ng “naglalakad” ang participyal na diwa ng הלך, habang malinaw na ipinapahayag ng “upang salubungin tayo” ang direksiyon at layon ng לִקְרָאתֵנוּ.
- source_word: הוּא אֲדֹנִי
  choice: Siya ang panginoon ko
  rationale: Ang אֲדֹנִי ay tumutukoy sa taong pinaglilingkuran ng lingkod, hindi sa banal na titulo. Ang “panginoon ko” ay dignified at tumutugma sa ugnayang panlipunan sa salaysay.
- source_word: הַצָּעִיף
  choice: ang belo
  rationale: Ang צָעִיף ay pantakip ng babae; malinaw at karaniwan sa konteksto ng pag-aasawa ang “belo.”
- source_word: וַתִּתְכָּס
  choice: nagtakip siya
  rationale: 'Reflexive ang anyo ng pandiwa: tinakpan ni Rebeca ang sarili niya gamit ang belong kababanggit lamang. Natural sa Tagalog ang “nagtakip siya” at hindi na kailangang ulitin ang layon.'
theological_decisions:
- issue: Kahulugan ng אֲדֹנִי
  choice: panginoon ko
  alternative: amo ko
  rationale: Tumutukoy ito sa taong panginoon o pinaglilingkuran ng lingkod, hindi sa Diyos. Pinananatili ng “panginoon ko” ang dignidad at literal na ugnayan nang hindi ito ginagawang banal na titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “parang” para sa bukirin o maluwang na lupang nasa tagpo, at iniwasan ang labis na paliwanag sa mismong talata. Walang talababa sapagkat ang mga posibleng alternatibo ay hindi kailangang ilahad upang mapanatili ang tunay na diwa ng Hebreo.
