- from: Tinanong niya ang lingkod, “Sino ang lalaking iyon na naglalakad sa parang upang salubungin tayo?” Sumagot ang lingkod, “Siya ang panginoon ko.” Pagkatapos, kinuha niya ang belo at nagtakip siya.
  to: Tinanong niya ang lingkod, “Sino ang lalaking iyon na naglalakad sa bukirin upang salubungin tayo?” Sumagot ang lingkod, “Siya ang amo ko.” Pagkatapos, kinuha niya ang belo at itinakip niya ito sa sarili.
  rationale: Nilinaw ang reflexive na pagkukubli sa sarili gamit ang belo at pinili ang mas tumpak na “bukirin” para sa “field.” Ang “amo ko” ay malinaw na tumutukoy sa taong master ng lingkod nang hindi nagdaragdag ng teolohikal na kulay. Walang talababa ang kailangan dahil hindi kinakailangan ang mga alternatibo upang maipahayag ang kahulugan ng talata sa Tagalog.
