base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/045.yaml
  text: Before I had finished speaking in my heart[a], behold, Rebekah came out with her jar on her shoulder, and she went down to the spring and drew water. Then I said to her[b], ‘Please give me a drink.’
translation:
  language: tl
  text: Bago ko matapos ang pagsasalita sa aking puso[a], narito, lumabas si Rebeca na may banga sa kanyang balikat. Bumaba siya sa bukal[b] at sumalok ng tubig. Sinabi ko sa kanya, ‘Pakiusap, painumin mo ako.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pagsasalita sa aking puso,” isang idyoma para sa panloob na pagsasalita o panalangin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pinagmumulan ng tubig.” Ang salitang Hebreo ay tumutukoy sa isang bukal, hindi sa karaniwang salita para sa “balon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם אֲכַלֶּה
  choice: Hindi ko pa natatapos ... nang
  rationale: Likas na paraan sa Tagalog upang ipahayag na hindi pa tapos ang kilos nang mangyari ang kasunod, habang pinananatili ang temporal na diwa ng Hebreo.
- source_word: לְדַבֵּר אֶל־לִבִּי
  choice: pagsasalita sa aking puso
  rationale: Pinananatili ang konkretong idyomang Hebreo sa pangunahing teksto; nililinaw sa talababa na tumutukoy ito sa panloob na pananalita o panalangin.
- source_word: וְהִנֵּה
  choice: nang, narito
  rationale: Ang “narito” ay nagpapanatili sa biglaan at masiglang paglalahad ng particle, sa isang marangal na estilong pasalaysay.
- source_word: רִבְקָה
  choice: Rebeca
  rationale: Karaniwang anyo ng pangalang ito sa tradisyong Bibliyang Tagalog at madaling makilala ng mga modernong mambabasa.
- source_word: יֹצֵאת
  choice: lumabas
  rationale: Tuwirang inilalarawan ang maliwanag at kagyat na kilos sa salaysay.
- source_word: כַדָּהּ עַל־שִׁכְמָהּ
  choice: pasan sa balikat ang kanyang banga
  rationale: Natural na ayos sa Tagalog para sa pagdadala ng sisidlan sa balikat; ang “banga” ay karaniwang katawagan sa sisidlang pansalok o imbakan ng tubig.
- source_word: וַתֵּרֶד הָעַיְנָה
  choice: Bumaba siya sa bukal
  rationale: Ang עַיִן dito ay likas na bukal, hindi ang mas karaniwang salitang Hebreo para sa balon; pinananatili ang pagkakaibang leksikal.
- source_word: וַתִּשְׁאָב
  choice: sumalok ng tubig
  rationale: Ang pandiwa ay tumutukoy sa pagsalok o pag-igib ng tubig; tahasang binabanggit ang “tubig” para sa natural at malinaw na Tagalog.
- source_word: הַשְׁקִינִי נָא
  choice: Pakiusap, painumin mo ako
  rationale: Ang causative imperative ay literal na “painumin mo ako,” at ang נָא ay kinakatawan ng magalang na “Pakiusap.”
theological_decisions:
- issue: Kung ang panloob na pagsasalita ay tahasang tatawaging panalangin
  choice: Pinanatili ang “pagsasalita sa aking puso”
  alternative: “pananalangin nang tahimik” o “pagsasalita sa sarili”
  rationale: Bagaman ipinahihiwatig ng konteksto ang panalangin, hindi ito tahasang tinatawag na panalangin sa talata; iniiwasang lutasin sa pangunahing teksto ang posibleng saklaw ng idyoma.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling unawain. Pinanatili ang bahagyang mataas na salitang “narito” upang maipakita ang biglaan at masiglang puwersa ng Hebreong וְהִנֵּה. Ginamit ang “Rebeca” bilang pamilyar na anyong Tagalog ng pangalan.
