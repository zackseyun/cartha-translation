  yaml_path: translation/ot/genesis/024/023.yaml
  text: And he said[a], “Whose daughter are you? Please tell me. Is there room in your father’s house for us to spend the night?”
translation:
  language: tl
  text: At sinabi niya, “Kanino kang anak? Pakisabi sa akin. May matutuluyan ba kami sa bahay ng iyong ama ngayong gabi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili ang karaniwang pagsulong ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi dinaragdagan ng tiyak na ugnayang temporal.
- source_word: בַּת מִי אַתְּ
  choice: Kanino kang anak?
  rationale: Natural na tanong sa modernong Tagalog tungkol sa pagkakakilanlan ng pamilya; hindi kailangang ulitin ang pambabaeng anyong “anak na babae” dahil malinaw sa konteksto at sa kausap.
- source_word: הַגִּידִי נָא לִי
  choice: Pakisabi sa akin
  rationale: Ipinahahayag ng “paki-” ang magalang at pinalambot na pakiusap ng נָא.
- source_word: הֲיֵשׁ
  choice: May ... ba
  rationale: Ito ang natural na Tagalog na anyo ng eksistensiyal na tanong na oo o hindi.
- source_word: בֵּית אָבִיךְ
  choice: sa bahay ng iyong ama
  rationale: Pinananatili ang kongkretong sanggunian sa sambahayan ng ama, sa halip na gawing mas malawak na “tahanan.”
- source_word: מָקוֹם לָנוּ לָלִין
  choice: matutuluyan ba kami ... ngayong gabi
  rationale: Natural na ipinapahayag sa Tagalog ang pagkakaroon ng lugar para sa grupo upang magpalipas ng gabi; ang “kami” ay nagpapanatili sa unang panauhang maramihan.
