  text: She said[a], “Drink, my lord,” and she quickly lowered her jar onto her hand and gave him a drink.
translation:
  language: tl
  text: Sinabi niya, “Uminom po kayo, panginoon ko[a].” Agad niyang ibinaba ang banga sa kanyang kamay at pinainom niya siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ginoo.” Literal sa Hebreo ang “panginoon ko,” na ginagamit dito bilang magalang na tawag sa isang lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: Uminom po kayo
  rationale: Tuwirang pautos o paanyaya ito sa isang lalaki. Ang “uminom” ay nagpapanatili sa maikli at tuwirang anyo ng Hebreo, samantalang ang “po kayo” ay likas na nagpapahayag ng paggalang sa modernong Tagalog.
- source_word: אֲדֹנִי
  choice: panginoon ko[a]
  rationale: Literal itong nangangahulugang “panginoon ko” at dito ay magalang na tawag sa isang lalaki, hindi titulo para sa Diyos. Pinanatili sa teksto ang literal na anyo, na nililinaw ng talababa sa mas likas na alternatibong “ginoo.”
- source_word: וַתְמַהֵר
  choice: Agad niyang
  rationale: Ipinahahayag ng pandiwa ang pagmamadali. Ang “agad” ay natural sa kasalukuyang Tagalog at pinananatili ang diin sa mabilis niyang pagkilos.
- source_word: וַתֹּרֶד כַּדָּהּ
  choice: ibinaba ... ang banga
  rationale: Inilalarawan nito ang pagbaba ng banga mula sa posisyong kinalalagyan nito. Ang “ibinaba” ay tuwiran at malinaw nang hindi nagdaragdag ng detalyeng wala sa talata.
- source_word: עַל יָדָהּ
  choice: sa kanyang kamay
  rationale: Pinananatili nito ang konkretong pahayag ng Hebreo na “sa ibabaw/sa kanyang kamay,” sa halip na idagdag ang “mula sa balikat,” na hindi tahasang binabanggit sa talatang ito.
- source_word: וַתַּשְׁקֵהוּ
  choice: pinainom ang lalaki
  rationale: Ang causative na anyo ay nangangahulugang nagbigay siya ng maiinom o pinainom niya ito. Ginamit ang “ang lalaki” sa halip na magkasunod na panghalip upang maging malinaw at natural sa Tagalog.
theological_decisions:
- issue: Kung ang אֲדֹנִי ay banal na titulo o magalang na tawag sa tao
  choice: 'Itinuring itong magalang na tawag sa lalaking kausap: “panginoon ko,” na may talababa.'
  alternative: “ginoo”
  rationale: Malinaw sa tagpo na tao ang kinakausap. Pinananatili ng pangunahing teksto ang literal na panlipunang paggalang ng Hebreo, habang iniiwasan ng talababa ang maling pagkaunawang banal na titulo ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang “po kayo” ay nagbibigay ng likas na paggalang sa pananalita, at ang “panginoon ko” ay pinanatili dahil mahalaga ang literal na panlipunang himig ng Hebreo, kalakip ang paglilinaw sa talababa.
