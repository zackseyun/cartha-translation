reference: Genesis 24:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֣ה הַֽ/נַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֨י/הָ֙ הַטִּי נָ֤א כַדֵּ/ךְ֙ וְ/אֶשְׁתֶּ֔ה וְ/אָמְרָ֣ה שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה אֹתָ֤/הּ הֹכַ֨חְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יִצְחָ֔ק וּ/בָ֣/הּ אֵדַ֔ע כִּי עָשִׂ֥יתָ חֶ֖סֶד עִם אֲדֹנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/014.yaml
  text: And let it be that the young woman to whom I say[a], ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac[c][b]. By her I will know that you have shown steadfast love to my master.
translation:
  language: tl
  text: Nawa’y ang dalagang pagsasabihan ko ng, ‘Pakibabâ nga ang iyong banga upang makainom ako,’ at magsasabi, ‘Uminom ka, at paiinumin ko rin ang iyong mga kamelyo,’ ay siya ang itinalaga mo para sa iyong lingkod, para kay Isaac.[a] Sa pamamagitan niya[b] ay malalaman kong nagpakita ka ng tapat na pag-ibig sa aking panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “para sa lingkod mong si Isaac.” Maaaring basahin ang Hebreo bilang apposition, kung saan si Isaac ang “iyong lingkod.” Sa pangunahing teksto, ang dalawang parirala ay binasang magkahiwalay: ang nananalangin ang “iyong lingkod,” at si Isaac ang hiwalay na tinutukoy.'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring: “Sa pamamagitan nito.” Literal na “sa pamamagitan niya” ang Hebreo, na tumutukoy sa dalaga bilang tanda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: At mangyari nawa
  rationale: Ipinahahayag nito ang kahilingan sa konteksto ng panalangin at pinananatili ang panimulang pang-ugnay na וְ.
- source_word: הַנַּעֲרָ
  choice: ang dalaga
  rationale: Tumutukoy sa isang babaeng bata pa ngunit nasa edad nang maaaring mag-asawa; likas at marangal ang “dalaga” sa modernong Tagalog.
- source_word: הַטִּי נָא כַדֵּךְ
  choice: Pakibaba ang iyong banga
  rationale: Isinasalin ng “pakibaba” ang magalang na pakiusap at ang pagkiling o pagbaba ng sisidlan upang makainom ang nagsasalita.
- source_word: וְאֶשְׁתֶּה
  choice: para makainom ako
  rationale: Natural na ipinahahayag sa Tagalog ang layunin ng pagpapababa sa banga.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: at paiinumin ko rin ang iyong mga kamelyo
  rationale: 'Tuwirang ipinahahayag ang causative na diwa ng Hiphil ng שׁקה: bibigyan ng maiinom ang mga kamelyo.'
- source_word: אֹתָהּ הֹכַחְתָּ
  choice: siya nawa ang itinalaga mo
  rationale: Sa konteksto, ang Hiphil ng יכח ay tumutukoy sa pagtukoy o paghirang sa babaeng magiging sagot sa hinihinging tanda.
- source_word: לְעַבְדְּךָ לְיִצְחָק
  choice: para sa lingkod mong si Isaac
  rationale: 'Pinakamadaling basahin ang magkasunod na parirala bilang apposition: si Isaac ang lingkod ng Diyos na pinatutungkulan. Inilalahad sa talababa ang posibleng pagbasa sa dalawang pariralang magkahiwalay.'
- source_word: וּבָהּ אֵדַע
  choice: Sa pamamagitan niya ay malalaman ko
  rationale: Pinananatili ang pambabaeng hulapi na likas na tumutukoy pabalik sa dalaga bilang paraan o tanda ng pagkakilala.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Sinasaklaw nito ang mapagmahal na kabutihan at katapatang nakapaloob sa חֶסֶד nang hindi ito ginagawang masyadong teknikal.
- source_word: עִם אֲדֹנִי
  choice: sa aking panginoon
  rationale: Ang “sa” ang likas na Tagalog na katuwang ng pariralang “nagpakita ng tapat na pag-ibig,” bagaman “kasama” ang literal na pangunahing diwa ng עִם.
theological_decisions:
- issue: Ang kaugnayan ng לְעַבְדְּךָ at לְיִצְחָק
  choice: “para sa lingkod mong si Isaac,” na binabasa ang “si Isaac” bilang apposition sa “lingkod mo”
  alternative: “para sa iyong lingkod—para kay Isaac,” na maaaring umugnay sa unang parirala sa nananalanging alipin ni Abraham at sa ikalawa kay Isaac
  rationale: Pinakamatuwid sa balarila at konteksto ang appositional na pagbasa, ngunit tunay na posible ang paghihiwalay sa dalawang dative kaya pinanatili iyon sa talababa.
- issue: Referente ng וּבָהּ
  choice: “Sa pamamagitan niya,” na tumutukoy sa dalaga
  alternative: “Sa pamamagitan nito,” na tumutukoy sa pangyayari o tandang hinihingi
  rationale: Pambabae ang hulapi sa Hebreo at pinakamalapit na referente ang dalaga; gayunman, maaari siyang katawanin bilang kabuuang tanda, kaya nakatala ang alternatibo.
- issue: Saklaw ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: kabutihan; matapat na kagandahang-loob
  rationale: Pinananatili nito ang pagsasama ng pag-ibig, kabutihan, at katapatan nang hindi ipinapalagay ang isang tiyak na sistematikong pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “dalaga,” “banga,” at “panginoon” bilang likas na salitang angkop sa sinaunang tagpo. Pinanatili ang anyong panalangin sa “mangyari nawa” at “siya nawa,” habang iniwasan ang labis na makalumang ayos.
