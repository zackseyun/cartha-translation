  to: Nawa’y ang dalagang pagsasabihan ko ng, ‘Pakibabâ nga ang iyong banga upang makainom ako,’ at magsasabi, ‘Uminom ka, at paiinumin ko rin ang iyong mga kamelyo,’ ay siya ang itinalaga mo para sa iyong lingkod, para kay Isaac.[a] Sa pamamagitan niya[b] ay malalaman kong nagpakita ka ng tapat na pag-ibig sa aking panginoon.
