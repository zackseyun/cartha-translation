- from: Sinabi pa niya rito, “Marami kaming dayami at pagkain para sa mga hayop, at mayroon ding matutuluyan.”
  to: Sinabi pa niya sa kanya, “Mayroon kaming maraming dayami at pakain para sa mga hayop, at mayroon din kaming lugar na matutuluyan.”
