base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/025.yaml
  text: Then she said to him[a], “We have plenty of both straw and fodder, and also a place to spend the night.”
translation:
  language: tl
  text: Sinabi pa niya sa kanya, “Mayroon kaming maraming dayami at pakain para sa mga hayop, at mayroon din kaming lugar na matutuluyan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Sinabi pa niya rito
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay, at ang “pa” ay likas sa Filipino dahil karugtong ito ng naunang sagot; ang “rito” ay tumutukoy sa lalaking kausap niya.
- source_word: גַּם ... גַּם ... גַּם
  choice: at ... at ... ding
  rationale: Pinananatili ng magkakaugnay na mga pangatnig ang naiipong diwa ng paulit-ulit na גַּם sa natural na Filipino.
- source_word: תֶּבֶן
  choice: dayami
  rationale: Ito ang malinaw at karaniwang katawagan sa straw sa konteksto ng pagkain at pangangalaga sa mga hayop.
- source_word: מִסְפּוֹא
  choice: pagkain para sa mga hayop
  rationale: Tiyak nitong ipinahahayag ang pakahulugang fodder o pakain sa hayop nang mas madaling maunawaan kaysa sa teknikal o di-gaanong karaniwang “pakain.”
- source_word: רַב עִמָּנוּ
  choice: marami kaming
  rationale: 'Ang literal na “marami ang kasama/nasa amin” ay natural na ipinapahayag sa Filipino bilang pag-aari o pagkakaroon: “marami kaming.”'
- source_word: מָקוֹם לָלוּן
  choice: matutuluyan
  rationale: Likas at maikli itong Filipino para sa isang lugar na matutuluyan sa magdamag, habang hindi tinutukoy kung silid, bahay, o ibang espasyo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Ginamit ang “pagkain para sa mga hayop” upang maging malinaw ang מִסְפּוֹא, at “matutuluyan” upang natural na katawanin ang pangkalahatang “lugar na pagpapalipasan ng gabi.”
