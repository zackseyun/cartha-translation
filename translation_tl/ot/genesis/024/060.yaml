revisions:
- from: At binasbasan nila si Rebeca at sinabi sa kanya, “Kapatid namin, nawa’y ikaw ay maging libo-libong laksa[a], at sakupin nawa ng iyong lahi ang pintuang-bayan ng mga napopoot dito[b].”
  to: At binasbasan nila si Rebeca at sinabi sa kanya, “Kapatid namin, nawa’y ikaw ay maging libo-libong laksa[a], at sakupin nawa ng iyong lahi ang pintuang-bayan ng mga napopoot sa iyong lahi[b].”
  rationale: Pinalitan ang “mga napopoot dito” ng “mga napopoot sa iyong lahi” upang maipahayag nang malinaw ang layon ng panghalip na nasa Hebrew. Bagaman inuulit nito ang “iyong lahi,” mas natural ito sa Filipino kaysa sa deiktikong “dito” at iniiwasan ang maling pagbasa na ang pagkapoot ay nakatuon sa isang lugar. Pinananatili ng talababa ang kolektibong isahang katangian ng Hebrew.
