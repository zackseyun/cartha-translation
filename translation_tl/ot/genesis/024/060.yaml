base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/060.yaml
  text: And they blessed Rebekah and said to her[a], “Our sister, may you become thousands of ten thousands[b], and may your offspring possess the gate of those who hate them.”
translation:
  language: tl
  text: At binasbasan nila si Rebeca at sinabi sa kanya, “Kapatid namin, nawa’y ikaw ay maging libo-libong laksa[a], at sakupin nawa ng iyong lahi ang pintuang-bayan ng mga napopoot sa iyong lahi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “laksa-laksang karamihan” o “di-mabilang na karamihan”; literal, “mga libo ng sampung libo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “manahin ang pintuang-bayan ng kanyang mga kaaway.” Literal na sinasabi ng Hebrew, “ang pintuan ng mga napopoot sa kanya”; ang isahang panghalip ay tumutukoy sa kolektibong “lahi.” Ang “pintuan” ay larawan ng lakas at pagkontrol sa isang lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: binasbasan nila
  rationale: Tuwirang inilalarawan ang pagbigkas nila ng pagpapala kay Rebeca; natural ito sa marangal na salaysay sa Filipino.
- source_word: רִבְקָה
  choice: Rebeca
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: אֲחֹתֵנוּ
  choice: Kapatid namin
  rationale: Likas na pantawag sa Filipino at hindi ipinipilit kung kapatid na babae ang tinutukoy, yamang malinaw na si Rebeca ang kausap.
- source_word: הֲיִי
  choice: nawa’y ikaw ay maging
  rationale: Ipinahahayag nito ang hangarin ng isang pagpapala, hindi isang karaniwang utos.
- source_word: לְאַלְפֵי רְבָבָה
  choice: libo-libong laksa
  rationale: 'Pinananatili ang pinagsamang larawang-bilang ng Hebrew: mga libo at mga laksa o sampung libo, bagaman hayperboliko ang diwa.'
- source_word: וְיִירַשׁ
  choice: sakupin nawa
  rationale: Sa konteksto ng pintuang-bayan ng mga kaaway, ang pandiwa ay tumutukoy sa matagumpay na pag-angkin o pagkontrol, hindi lamang sa pagtanggap ng mana.
- source_word: זַרְעֵךְ
  choice: iyong lahi
  rationale: Ang 'lahi' ay natural na kolektibong pangngalan sa Filipino para sa mga magiging supling o salinlahi ni Rebeca.
- source_word: שַׁעַר
  choice: pintuang-bayan
  rationale: Pinananatili ang kongkretong larawan ng tarangkahan ng isang sinaunang lungsod, na kumakatawan din sa lakas at pagkontrol dito.
- source_word: שֹׂנְאָיו
  choice: mga napopoot dito
  rationale: Malapit ito sa literal na 'mga napopoot sa kanya/rito' at inuugnay ang panghalip sa kolektibong isahang 'lahi' nang hindi ito ginagawang tahasang maramihan.
theological_decisions:
- issue: Kolektibong isahan sa 'lahi' at isahang panghalip na tumutukoy rito
  choice: iyong lahi ... mga napopoot dito
  alternative: iyong mga salinlahi ... kanilang mga kaaway
  rationale: Ang Hebrew na זֶרַע ay kolektibong isahan at sinusundan ng isahang hulaping panghalip. Pinananatili ng salin ang anyong kolektibong isahan at ang kaugnay na tensiyong pampanitikan nang hindi ito nilulutas bilang tahasang maramihan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pormula ng pagpapala sa “nawa,” ang matinding idyomang bilang, at ang sinaunang larawan ng pintuang-bayan. Ang “dito” ay tumutukoy sa kolektibong isahang “lahi.”
