  naturalness: Marangal at likas sa makabagong Filipino ang kabuuang salin. Ang “libo-libong laksa” ay sinasadyang literal at mataas na rehistro; natutulungan ito ng talababa. Mas natural at malinaw ang “mga napopoot sa iyong lahi” kaysa “mga napopoot dito.”
