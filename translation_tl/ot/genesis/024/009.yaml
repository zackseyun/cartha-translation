  text: So the servant put his hand under the thigh of Abraham his master and swore to him concerning this matter[a].
translation:
  language: tl
  text: Kaya inilagay ng lingkod ang kanyang kamay sa ilalim ng hita ng amo niyang si Abraham, at sumumpa sa kanya tungkol sa bagay na ito[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa ilalim ng hita” ay literal na salin ng Hebreong pananalita para sa isang mataimtim na kilos ng panunumpa. Itinuturing ito ng ilan na sagisag na kaugnay ng balakang o ng mga supling ng tipan.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֶבֶד
  choice: ang lingkod
  rationale: Maaaring tumukoy ang עֶבֶד sa isang lingkod o alipin. Sa kontekstong ito, higit na binibigyang-diin ang tungkulin niya sa sambahayan ni Abraham, kaya natural at angkop ang “lingkod” nang hindi inaalis ang umiiral na kaayusang panlipunan.
- source_word: וַיָּשֶׂם ... אֶת יָדוֹ
  choice: inilagay ... ang kanyang kamay
  rationale: Karaniwang kahulugan ng שׂוּם ang “ilagay” o “ipuwesto.” Tuwiran at natural sa modernong Filipino ang pagkakasaling ito.
- source_word: תַּחַת יֶרֶךְ
  choice: sa ilalim ng hita
  rationale: Ang יָרֵךְ ay literal na “hita.” Pinananatili ng salin ang kongkretong pananalita ng Hebreo sa halip na ipasok sa pangunahing teksto ang isang tiyak na paliwanag sa simbolismo ng kilos.
- source_word: אַבְרָהָם אֲדֹנָיו
  choice: ng amo niyang si Abraham
  rationale: Sa ugnayang pantao rito, ipinahihiwatig ng אֲדוֹן ang nakatataas na may kapangyarihan sa sambahayan. Mas natural at mas tiyak ang “amo” kaysa “panginoon,” na maaaring mapagkamalang banal na titulo.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: sumumpa sa kanya
  rationale: Ang Niphal ng שׁבע ay nangangahulugang “sumumpa” o “manumpa,” at ipinahihiwatig ng לוֹ na kay Abraham itinutuon ang panunumpa.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: tungkol sa bagay na ito
  rationale: Malawak ang saklaw ng דָּבָר—maaaring “salita,” “bagay,” o “usapin.” Dito ay tumutukoy ito sa iniatas ni Abraham, at malinaw na naihahatid iyon ng “bagay na ito.”
theological_decisions:
- issue: Literal na pagsasalin o interpretasyon ng kilos sa panunumpa
  choice: Panatilihin sa pangunahing teksto ang literal na “sa ilalim ng hita.”
  alternative: Isalin ito bilang isang kilos na tuwirang inuugnay sa balakang, ari, o mga supling ng tipan.
  rationale: Inilalahad ng tekstong Hebreo ang pisikal na kilos ngunit hindi nito tahasang ipinaliliwanag ang kahulugan. Pinananatili ng literal na salin ang tunay na kalabuan at iniiwasang ipasok ang isang partikular na interpretasyon sa talata.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “amo” para sa awtoridad ni Abraham sa sambahayan at pinanatili ang literal na anyo ng di-pamilyar na kilos, na ipinaliwanag sa talababa.
