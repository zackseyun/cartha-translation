  naturalness: Natural at marangal ang modernong Filipino. Ang “Lumabas si Isaac upang magbulay-bulay sa bukid” ay mas malinaw at mas malapit sa ayos ng pinagmulan. “Nag-angat siya ng tingin” ay isang likas na paraan upang maipahayag ang Hebreong idyoma nang hindi ipinahihiwatig na kinakailangang tumingin siya sa langit.
  terminology: Ang “Isaac,” “bukid,” “magbulay-bulay,” at “mga kamelyong dumarating” ay angkop. Pinananatili ng talababa ang hindi tiyak na kahulugan ng bihirang pandiwang Hebreo at hindi nito ipinagpapalagay na panalangin ang kahulugan.
