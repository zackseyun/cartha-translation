  text: וַ/יֵּצֵ֥א יִצְחָ֛ק לָ/שׂ֥וּחַ בַּ/שָּׂדֶ֖ה לִ/פְנ֣וֹת עָ֑רֶב וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּ֥ה גְמַלִּ֖ים בָּאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/063.yaml
  text: And Isaac went out to meditate in the field toward evening[a], and he lifted up his eyes and looked, and behold, camels were coming.
translation:
  language: tl
  text: Lumabas si Isaac upang magbulay-bulay[a] sa bukid nang papalapit na ang gabi. Nag-angat siya ng tingin at nakita niyang may mga kamelyong dumarating.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maglakad-lakad,” “magnilay,” “makipag-usap,” o posibleng “manalangin.” Bihira ang pandiwang Hebreo, kaya hindi tiyak ang eksaktong kahulugan nito rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Lumabas
  rationale: Tuwirang ipinahahayag ng Qal wayyiqtol ng יצא ang paglabas at ang kasunod na kilos sa salaysay.
- source_word: יִצְחָק
  choice: Isaac
  rationale: Ginamit ang nakaugaliang modernong anyo ng pangalang biblikal sa Filipino.
- source_word: לָשׂוּחַ
  choice: upang magbulay-bulay
  rationale: Bihira at pinagtatalunan ang eksaktong diwa ng pandiwa. Ang “magbulay-bulay” ay angkop sa tahimik at nag-iisang gawain sa bukid ngunit hindi nito nililimitahan ang kahulugan sa pananalangin; inilalahad sa talababa ang kawalang-katiyakan.
- source_word: בַּשָּׂדֶה
  choice: patungo sa bukid
  rationale: Ang שׂדה ay bukid o lantad na kaparangan. Sa Filipino, likas na inuugnay ng “patungo sa bukid” ang paglabas sa destinasyon, habang ang sumusunod na layuning sugnay ang nagsasaad ng gagawin niya roon.
- source_word: לִפְנוֹת עָרֶב
  choice: nang papalapit na ang gabi
  rationale: Natural na Filipino para sa idyomang tumutukoy sa paglapit o pagsapit ng gabi.
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: Tumingala siya at nakita niyang
  rationale: Pinagsama sa natural na ekspresyong Filipino ang Hebreong idyoma ng pagtataas ng mga mata at ang kasunod na pagkakita, nang hindi binabago ang pagkakasunod ng kilos at pagkatanto.
- source_word: וְהִנֵּה
  choice: may
  rationale: Sa Filipino, ang konstruksiyong “nakita niyang may” ay likas na naghaharap sa biglang napansing tanawin; ang hiwalay na “masdan” ay magiging artipisyal sa pangungusap na ito.
- source_word: גְמַלִּים בָּאִים
  choice: mga kamelyong dumarating
  rationale: Ipinananatili ng aspektong imperpektibo ng “dumarating” ang patuloy na paglapit na ipinahahayag ng Hebreong participle.
theological_decisions:
- issue: Maaaring ipakahulugan ang לָשׂוּחַ bilang pananalangin.
  choice: magbulay-bulay
  alternative: manalangin
  rationale: Hindi sapat ang bihirang pandiwa at ang konteksto upang tiyak na gawing panalangin ang kilos ni Isaac. Pinananatili ng salin at talababa ang tunay na leksikal na kalabuan nang walang denominasyonal na pagpapasiya.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Iniwasan ang makalumang “narito” o “masdan” at ang sobrang literal na “itinaas ang kanyang mga mata,” habang pinanatili ang paglapit ng gabi, ang biglang pagkakita, at ang leksikal na kalabuan ng לָשׂוּחַ.
