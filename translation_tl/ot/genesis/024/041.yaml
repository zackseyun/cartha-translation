  source_fidelity: Ang “malaya ka na” ay naglilipat sa hinaharap na pagpapalaya ng Hebreo tungo sa tila kasalukuyan o natapos nang kalagayan. Ang “sumpang kasama ng panunumpa ko” ay nagpapalawak at nagpapabigat sa isang salitang Hebreo (אָלָה) na pinakamainam na isalin sa pangunahing teksto bilang “panunumpa,” habang itinatala ang aspektong “sumpa” sa talababa. Napananatili ng “kung hindi nila ibigay sa iyo” ang hindi tahasang layon sa Hebreo.
  naturalness: Mas natural at malinaw sa makabagong Filipino ang “mapapalaya ka sa aking panunumpa” kaysa “malaya ka na sa sumpang kasama ng panunumpa ko.” Ang “pumunta ka sa aking angkan” ay tuwiran at idiomatiko para sa pagpunta sa mga kamag-anak.
  terminology: “Panunumpa” ang angkop na pangunahing katumbas ng אָלָה sa kontekstong ito ng obligasyong isinumpa. Ang “angkan” ay mabuting katumbas ng מִשְׁפָּחָה. Itinatala ng talababa ang maaaring diwang “sumpa” nang hindi ito ipinipilit sa pangunahing teksto.
