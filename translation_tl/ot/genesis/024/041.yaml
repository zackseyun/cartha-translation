    rationale: Ang אָלָה ay maaaring mangahulugang panunumpa na may kalakip na sumpa, ngunit ang konteksto at audit trail ay pumapabor sa “panunumpa” bilang pangunahing salin. Maaaring ilagay ang alternatibong diwa sa talababa.
