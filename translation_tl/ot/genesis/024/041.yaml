base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/041.yaml
  text: Then you will be free from my oath when you come to my family; and if they do not give to you[a], you will be free from my oath.
translation:
  language: tl
  text: Kung magkagayon, mapapalaya ka sa aking panunumpa kapag pumunta ka sa aking angkan; at kung hindi nila ibigay sa iyo[a], mapapalaya ka sa aking panunumpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa aking sumpa.” Ang salitang Hebreo ay maaaring tumukoy sa panunumpang may kalakip na sumpa o kaparusahan kapag nilabag.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנָּקֶה / נָקִי
  choice: malaya ka na
  rationale: Sa konteksto ng panunumpa, ang una ay Niphal at ang ikalawa ay pang-uri na kapuwa tumutukoy sa pagkalaya sa pananagutan o obligasyon, hindi sa abstraktong kawalang-sala.
- source_word: מֵאָלָתִי
  choice: sa sumpang kasama ng panunumpa ko
  rationale: Ang אָלָה ay panunumpang may kalakip na sumpa o kaparusahan. Pinananatili ng pariralang ito ang dalawang kaugnay na diwa nang hindi nililimitahan ang salita sa isa lamang.
- source_word: כִּי
  choice: kapag
  rationale: Ipinakikilala rito ng כִּי ang kalagayang temporal na may kondisyunal na puwersa; natural itong naipapahayag sa Tagalog bilang “kapag.”
- source_word: תָבוֹא אֶל מִשְׁפַּחְתִּי
  choice: nakarating ka sa aking angkan
  rationale: Ang מִשְׁפָּחָה ay tumutukoy sa mas malawak na pangkat ng magkakamag-anak o angkan, at ang “nakarating” ay natural sa Tagalog para sa pagpunta sa kanila.
- source_word: וְאִם לֹא יִתְּנוּ לָךְ
  choice: At kung hindi nila ibigay sa iyo
  rationale: Walang tahasang layon ang pandiwa sa Hebreo. Hindi ito dinagdagan sa pangunahing teksto upang mapanatili ang anyo at bahagyang pagkabitin ng pinagmulan, habang malinaw naman ang tinutukoy mula sa konteksto.
theological_decisions:
- issue: Saklaw ng kahulugan ng אָלָה sa konteksto ng panunumpa
  choice: sumpang kasama ng panunumpa ko
  alternative: panunumpa ko; sumpa ko
  rationale: Maaaring tumukoy ang salita sa panunumpa mismo at sa sumpa o kaparusahang kalakip nito. Ang piniling salin ay nagpapanatili sa legal at mapanagutang lakas ng pahayag nang hindi labis na pinipili ang isang panig ng leksikal na saklaw.
translation_notes:
  register: Makabago at marangal na Filipino; ginamit ang “angkan” para sa malawak na pamilya at iningatan ang di-tahasang layon ng “ibigay” sa Hebreo.
