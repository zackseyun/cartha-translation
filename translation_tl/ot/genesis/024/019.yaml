translation:
  language: tl
  text: Nang matapos niya siyang painumin, sinabi niya, “Iigib din ako para sa iyong mga kamelyo hanggang sa matapos silang uminom.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּכַל לְהַשְׁקֹתוֹ
  choice: Nang matapos niya itong painumin
  rationale: Ipinahahayag ng כלה kasama ng kasunod na pawatas ang pagtatapos ng naunang kilos bago ang sumunod na pangyayari. Likas sa makabagong Tagalog ang “nang matapos,” at ang Hiphil ng שקה ay wastong naipapahayag ng “painumin.”
- source_word: וַתֹּאמֶר
  choice: sinabi niya
  rationale: Karaniwang pandiwang pasalaysay mula sa אמר. Hindi na kailangang ulitin ang panimulang “at” sapagkat malinaw ang pagkakasunod-sunod sa Tagalog.
- source_word: גַּם
  choice: din
  rationale: 'Pinananatili nito ang diwang pandagdag: bukod sa pagpapainom sa lalaki, iigib din siya para sa mga kamelyo.'
- source_word: לִגְמַלֶּיךָ
  choice: para sa iyong mga kamelyo
  rationale: Ipinakikita ng pariralang may לְ ang makikinabang sa pag-igib, at pinananatili ng “iyong” ang hulaping panghalip na ikalawang panauhang panlalaki.
- source_word: אֶשְׁאָב
  choice: Iigib ako
  rationale: Ang שאב ay tumutukoy sa pagkuha o pagsalok ng tubig mula sa balon. Sapat at likas sa Tagalog ang “iigib” dahil likas nang ipinahihiwatig nito ang tubig.
- source_word: עַד אִם
  choice: hanggang sa
  rationale: Ang tambalang ito ay gumaganap bilang panandang hangganan ng kilos; “hanggang sa” ang malinaw at natural na katumbas sa Tagalog.
- source_word: כִּלּוּ לִשְׁתֹּת
  choice: matapos silang uminom
  rationale: Ang Piel perfect ng כלה at pawatas na שתה ay nagsasaad ng pagtatapos ng pag-inom. Pinananatili ng salin ang mga kamelyo bilang simuno at ang ganap na hangganan ng ipinangakong pag-igib.
