translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “itong” upang natural na tukuyin ang lalaking kapiling ng babae, at “iyong” sa halip na kolokyal na “mong” upang mapanatili ang dignidad ng salaysay.
