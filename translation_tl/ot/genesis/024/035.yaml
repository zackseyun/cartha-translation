id: GEN.24.35
reference: Genesis 24:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יהוָ֞ה בֵּרַ֧ךְ אֶת אֲדֹנִ֛/י מְאֹ֖ד וַ/יִּגְדָּ֑ל וַ/יִּתֶּן ל֞/וֹ צֹ֤אן וּ/בָקָר֙ וְ/כֶ֣סֶף וְ/זָהָ֔ב וַ/עֲבָדִם֙ וּ/שְׁפָחֹ֔ת וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/035.yaml
  text: And Yahweh has greatly blessed my master[a], and he has become great. He has given him flocks and herds, silver and gold, male servants and female servants, camels and donkeys.
translation:
  language: tl
  text: At lubos na pinagpala ni Yahweh ang aking amo, at naging dakila siya. Binigyan siya ni Yahweh ng mga kawan at mga baka, pilak at ginto, mga lingkod na lalaki at babae[a], mga kamelyo at mga asno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga aliping lalaki at babae.” Ang mga salitang Hebreo ay maaaring tumukoy sa mga lingkod sa sambahayan o sa mga alipin, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יהוה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: בֵּרַךְ ... מְאֹד
  choice: lubos na pinagpala
  rationale: Likas na pariralang Filipino na nagpapanatili sa matinding antas na ipinahahayag ng מְאֹד.
- source_word: אֲדֹנִי
  choice: aking amo
  rationale: Tumutukoy ito sa taong pinaglilingkuran ng nagsasalita, si Abraham; malinaw sa modernong Filipino ang “amo” at hindi ito mapagkakamalang banal na titulo.
- source_word: וַיִּגְדָּל
  choice: naging dakila siya
  rationale: Pinananatili ang malawak na diwa ng paglaki sa yaman, katayuan, at kapangyarihan, sa halip na paliitin ito sa “yumaman.”
- source_word: וַיִּתֶּן לוֹ
  choice: Binigyan siya ni Yahweh
  rationale: Nililinaw ang paksa at layon sa Filipino upang maiwasan ang malabong sunod-sunod na panghalip; si Yahweh ang nagbigay at ang amo ang tumanggap.
- source_word: צֹאן וּבָקָר
  choice: mga kawan at bakahan
  rationale: Pinananatili ang kolektibong paglalarawan sa maliliit at malalaking alagang hayop nang hindi labis na tinutukoy ang mga uri sa loob ng צֹאן.
- source_word: כֶסֶף וְזָהָב
  choice: pilak at ginto
  rationale: Tuwirang pinananatili ang kongkretong mga mahalagang metal sa halip na gawing pangkalahatang “kayamanan” o “salapi.”
- source_word: עֲבָדִם וּשְׁפָחֹת
  choice: mga lingkod na lalaki at babae
  rationale: Malinaw at natural ang pangunahing salin, pinananatili ang pagkakaiba ng kasarian; inilalahad sa talababa ang posibleng mas matinding kahulugang “mga alipin.”
- source_word: גְמַלִּים וַחֲמֹרִים
  choice: mga kamelyo at mga asno
  rationale: Mga tuwirang katumbas sa modernong Filipino ng dalawang uri ng hayop.
theological_decisions:
- issue: Paglalarawan sa bunga ng pagpapala kay Abraham
  choice: naging dakila siya
  alternative: yumaman siya
  rationale: Hindi nililimitahan ng salin ang וַיִּגְדָּל sa materyal na yaman lamang, bagaman ang kasunod na talaan ay nagpapakita ng kaniyang kayamanan.
- issue: Katayuan ng עֲבָדִים at שְׁפָחֹת
  choice: mga lingkod na lalaki at babae
  alternative: mga aliping lalaki at babae
  rationale: Maaaring tumukoy ang mga salitang Hebreo sa mga lingkod o alipin. Hindi tahasang nilulutas ng pangunahing teksto ang eksaktong legal at panlipunang katayuan, kaya inilalagay ang mas matinding posibilidad sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “amo” para sa taong pinaglilingkuran at “Yahweh” para sa personal na pangalan ng Diyos. Inulit ang “Yahweh” sa ikalawang pangungusap upang maging malinaw ang tinutukoy ng mga panghalip sa Filipino.
