  to: Inihain sa harap niya ang pagkain[a], ngunit sinabi niya, “Hindi ako kakain hangga’t hindi ko nasasabi ang aking sasabihin.” Sinabi naman niya, “Magsalita ka.”
  rationale: Pinanatili ang idyomatikong pangunahing salin at ang saklaw ng kahulugan ng Hebreo. Pinalitan lamang ang “nito” ng “niya” upang maging mas natural ang daloy ng diyalogo, at inayos ang talababang alternatibo upang maipakita nang mas malinaw ang pasibong “inilagay” at ang pagkaing nasa konteksto.
