translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘inihain’ bilang natural na salita para sa pagkaing inilagay sa harap ng panauhin; iniwasan ang sobrang literal ngunit alanganing ayos. Ang ‘nito’ ay tumutukoy sa lalaking kausap ng lingkod nang hindi ipinapasok sa talata ang pangalang hindi tahasang binanggit rito.
