  text: Food was set before him to eat[a], but he said, “I will not eat until I have spoken my words.” And he said, “Speak.”
translation:
  language: tl
  text: Inihain sa harap niya ang pagkain[a], ngunit sinabi niya, “Hindi ako kakain hangga’t hindi ko nasasabi ang aking sasabihin.” Sinabi naman niya, “Magsalita ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Inilagay sa harap niya ang pagkain upang kainin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם לְפָנָיו לֶאֱכֹל
  choice: Inihain sa harap niya ang pagkain
  rationale: Ang pandiwang שׂים ay ‘ilagay’ o ‘ihain.’ Hindi tahasang mahalaga ang gumagawa ng kilos, kaya likas sa Tagalog ang pokus sa pagkaing inihain. Isinama sa ‘ang pagkain’ ang layunin ng לֶאֱכֹל nang hindi gumagamit ng alanganing literal na ‘upang kainin.’
- source_word: לֹא אֹכַל
  choice: Hindi ako kakain
  rationale: Ipinapahayag ng imperfect ang matatag na pasiya tungkol sa gagawin; tuwiran at natural ang hinaharap na ‘kakain.’
- source_word: עַד אִם דִּבַּרְתִּי דְּבָרָי
  choice: hangga’t hindi ko nasasabi ang aking sasabihin
  rationale: Ang עַד אִם ay nagtatakda ng hangganan bago siya kumain. Ang idyomatikong Tagalog na ‘ang aking sasabihin’ ay naghahatid sa kahulugan ng literal na ‘aking mga salita’ bilang mensahe o pakay niya.
- source_word: דַּבֵּר
  choice: Magsalita ka
  rationale: Tuwirang pautos ito ng דבר. Pinananatili ng salin ang ikli at payak na pahintulot na magsalita.
