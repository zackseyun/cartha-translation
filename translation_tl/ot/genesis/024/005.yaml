  source_fidelity: 'Ang draft ay wastong naghahatid ng pangunahing diwa ng Hebreo: isang posibilidad na tumanggi ang babae at ang tanong kung ibabalik si Isaac sa lupain na iniwan ni Abraham. Gayunman, ang “sumunod sa akin” ay maaaring unang maunawaan bilang pagtalima o pagsunod sa utos, samantalang ang לָלֶכֶת אַחֲרַי ay tumutukoy rito sa pagsama/pagpunta kasunod ng lingkod. Ang “Dapat ko bang” ay katanggap-tanggap ngunit bahagyang nagdaragdag ng normatibong obligasyon; ang simpleng tanong na “Ibabalik ko ba” ay mas maingat at ang diin ng Hebreo ay maitatala sa talababa.'
  naturalness: Natural ang pangkalahatang register, ngunit mas malinaw at likas sa modernong Tagalog ang “sumama sa akin patungo” kaysa “sumunod sa akin ... papunta.” Ang binagong hulíng tanong ay tuwiran at marangal nang hindi tunog sobrang mapilit.
  terminology: Ang “lingkod,” “babae,” “anak mo,” at “lupain” ay angkop at hindi nagdaragdag ng interpretasyong wala sa teksto. Pinananatili ang “babae,” sa halip na “mapapangasawa,” sapagkat iyon lamang ang tahasang sinasabi ng Hebreo sa talatang ito.
