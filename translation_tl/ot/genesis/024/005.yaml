revisions:
- from: Sinabi sa kanya ng lingkod, “Paano kung ayaw sumunod sa akin ng babae papunta sa lupaing ito? Dapat ko bang ibalik ang anak mo sa lupaing pinanggalingan mo?”[a]
  to: Sinabi sa kanya ng lingkod, “Paano kung ayaw ng babae na sumama sa akin patungo sa lupaing ito? Ibabalik ko ba ang anak mo sa lupaing pinanggalingan mo?”[a]
  rationale: Pinalitan ang “sumunod sa akin” ng “sumama sa akin” upang malinaw na tumukoy sa paglalakbay kasama ng lingkod, hindi sa pagtalima sa kanya. Pinasimple ang ikalawang tanong upang hindi magdagdag ng kahulugang obligasyon, at iningatan ang mariing anyong Hebreo sa talababa. Inayos din ang terminolohiyang panggramatika ng talababa.
