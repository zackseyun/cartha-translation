base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/005.yaml
  text: And the servant said to him[a], “Perhaps the woman will not be willing to follow me to this land[b]. Should I then take your son back to the land from which you came?”
translation:
  language: tl
  text: Sinabi sa kanya ng lingkod, “Paano kung ayaw ng babae na sumama sa akin patungo sa lupaing ito? Ibabalik ko ba ang anak mo sa lupaing pinanggalingan mo?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, magkasamang ginamit ang pawatas at pandiwang banghay upang bigyang-diin ang “ibalik”; maaari ring isalin, “Talaga bang ibabalik ko ang anak mo?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: ang lingkod
  rationale: Maaaring mangahulugang ‘lingkod’ o ‘alipin’ ang עֶבֶד. Sa salaysay na ito, natural ang ‘lingkod’ at pinananatili nito ang ugnayang nakapailalim siya kay Abraham nang hindi labis na itinatampok ang legal na katayuan niya.
- source_word: אוּלַי
  choice: Paano kung
  rationale: Ipinahahayag ng אוּלַי ang isang posibleng mangyari. Sa tanong ng lingkod, natural sa modernong Tagalog ang ‘Paano kung’ at malinaw nitong naihahatid ang pangamba o pag-aalinlangan.
- source_word: לֹא תֹאבֶה
  choice: ayaw
  rationale: Ang אָבָה ay tumutukoy sa pagkukusa o pagsang-ayon. Ang ‘ayaw’ ay maikli, natural, at sapat na naghahayag ng kawalan ng kusang-loob sa kontekstong ito.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Payak na ‘ang babae’ ang sinasabi ng Hebreo; hindi pa siya tahasang tinatawag na mapapangasawa o inilalarawang bata.
- source_word: לָלֶכֶת אַחֲרַי
  choice: sumunod sa akin
  rationale: Literal itong ‘lumakad kasunod ko.’ Ang ‘sumunod sa akin’ ang natural na katumbas sa Tagalog at pinananatili ang direksiyon ng pagsama sa lingkod.
- source_word: אֶל הָאָרֶץ הַזֹּאת
  choice: papunta sa lupaing ito
  rationale: Ang ‘lupain’ ay angkop sa אֶרֶץ at sa konteksto ng salaysay; nililinaw ng ‘papunta’ ang direksiyon ng paglalakbay.
- source_word: הֶהָשֵׁב אָשִׁיב
  choice: Dapat ko bang ibalik
  rationale: Ang infinitive absolute na kasama ng finite verb ay nagbibigay-diin sa pagbabalik. Sa deliberatibong tanong, natural ang ‘Dapat ko bang ibalik’; ang talab ng diin ay itinatala rin sa talababa.
- source_word: אֶת בִּנְךָ
  choice: ang anak mo
  rationale: Tuwiran at malinaw itong katumbas ng parirala; lalaki ang tinutukoy sa konteksto, ngunit hindi kailangang idagdag ang kasarian dahil malinaw na si Isaac ang anak.
- source_word: אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  choice: sa lupaing pinanggalingan mo
  rationale: Natural na Tagalog ito para sa ‘lupaing mula roon ay umalis ka’ at pinananatili ang ideya ng pagbabalik sa pinagmulang lupain ni Abraham.
theological_decisions:
- issue: Kung ipinahihiwatig ba ng tanong na kailangang ibalik si Isaac o humihingi lamang ng tagubilin ang lingkod
  choice: Dapat ko bang ibalik
  alternative: Kailangan ko nga bang ibalik
  rationale: Pinananatili ng ‘Dapat ko bang’ ang deliberatibong tanong nang hindi nagpapahiwatig ng lubos na pangangailangan. Ang pagbibigay-diin ng anyong Hebreo ay hindi ginawang isang teolohikal na pahayag na tiyak na dapat bumalik si Isaac.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal ang gamit. Pinili ang ‘Paano kung’ sa halip na mas pormal na ‘Marahil’ dahil bahagi ito ng tuwirang tanong. Iniwasan ang mga salitang maaaring magtakda nang higit sa sinasabi ng Hebreo tungkol sa babae o sa obligasyon ng lingkod.
