  - severity: low
    issue: Ang “Dapat ko bang” ay maaaring magpahiwatig ng obligasyong hindi tahasang ipinapahayag ng tanong.
    rationale: Ang Hebreo ay isang mariing deliberatibong tanong. Mas ligtas ang “Ibabalik ko ba,” habang itinatala sa talababa ang diin ng infinitive absolute at finite verb.
  - severity: low
