  yaml_path: translation/ot/genesis/024/008.yaml
  text: But if the woman is not willing to go after you[a], then you will be free from this oath of mine[b]; only you must not take my son back there.
translation:
  language: tl
  text: Ngunit kung ayaw ng babae na sumama sa iyo[a], malaya ka na sa panunumpa kong ito[b]. Huwag mo lamang dalhin pabalik doon ang anak ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumunod sa iyo”; literal, “lumakad sa likuran mo.”
    reason: lexical_alternative
  - marker: b
    text: O “mapapalaya ka mula sa panunumpa kong ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא תֹאבֶה
  choice: Ngunit kung ayaw
  rationale: Ipinahahayag ng parirala ang pasubaling salungat sa naunang bilin; ang “ayaw” ay natural na nagsasaad ng kawalan ng pagsang-ayon nang hindi kinakailangang ipakahulugang tahasang pagsuway.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Hindi pa nakikilala o napapangasawa ang tinutukoy, kaya hindi pa angkop ang “asawa.”
- source_word: לָלֶכֶת אַחֲרֶיךָ
  choice: sumama sa iyo
  rationale: Sa konteksto ng paglalakbay, natural na Filipino ito para sa literal na “lumakad sa likuran mo/sumunod sa iyo,” habang inilalagay sa talababa ang anyong mas malapit sa Hebreo.
- source_word: וְנִקִּיתָ
  choice: malaya ka na
  rationale: Ang Niphal ng נקה ay tumutukoy rito sa pagiging ligtas o napawalang-bisa ang pananagutan sa panunumpa.
- source_word: מִשְּׁבֻעָתִי זֹאת
  choice: sa sumpang ito na ipinasumpa ko sa iyo
  rationale: Pinananatili ang demonstratibong “ito” at nililinaw sa natural na Filipino na ang alipin ang pinasumpa ni Abraham.
- source_word: רַק
  choice: lamang
  rationale: Naglalagay ito ng mahigpit na limitasyon sa paglaya ng alipin mula sa sumpa.
- source_word: אֶת־בְּנִי לֹא תָשֵׁב שָׁמָּה
  choice: Huwag mo lamang dalhin doon ang anak ko
  rationale: Ang Hiphil ng שוב ay causative, “dalhin/pabalikin.” Iniwasan ang “ibalik” sapagkat hindi pa nanggaling doon ang anak ayon sa salaysay, bagaman may semantikong diwa ng pagbalik sa lupain ng pinagmulan ng ama.
