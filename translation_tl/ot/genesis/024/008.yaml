translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “sumama sa iyo” bilang malinaw na pananalita sa konteksto ng paglalakbay, habang pinanatili sa talababa ang literal na larawan ng Hebreo. Ang “sumpa” rito ay nangangahulugang taimtim na panunumpa, hindi isang malédiksyon.
