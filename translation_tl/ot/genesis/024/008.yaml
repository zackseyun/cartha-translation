- from: Ngunit kung ayaw sumama sa iyo ng babae[a], malaya ka na sa sumpang ito na ipinasumpa ko sa iyo[b]. Huwag mo lamang dalhin doon ang anak ko.
  to: Ngunit kung ayaw ng babae na sumama sa iyo[a], malaya ka na sa panunumpa kong ito[b]. Huwag mo lamang dalhin pabalik doon ang anak ko.
  rationale: Inalis ang hindi hayagang detalye na “ipinasumpa ko sa iyo” at isinalin ang unang-panauhang panghalip bilang “kong.” Ginamit ang “panunumpa” upang tumpak at malinaw na maipahayag ang שְׁבוּעָה. Idinagdag ang “pabalik” upang katawanin ang causative na pagbabalik sa huling sugnay, nang hindi binabago ang kahulugan.
