base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/011.yaml
  text: And he made the camels kneel down outside the city by the well of water at evening time[b][a], at the time when the women go out to draw water.
translation:
  language: tl
  text: Pinaluhod niya ang mga kamelyo sa labas ng lungsod, sa tabi ng balon, nang dapithapon, sa oras na lumalabas ang mga babaeng sumasalok ng tubig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְרֵךְ
  choice: Pinaluhod niya
  rationale: 'Ang Hiphil ng ברך ay causative rito: pinapangyari niyang lumuhod ang mga kamelyo. Likas at tuwiran sa modernong Tagalog ang “pinaluhod niya.”'
- source_word: הַגְּמַלִּים
  choice: ang mga kamelyo
  rationale: Karaniwang katumbas ng pangngalang maramihan na may pantukoy, at tumutukoy sa mga hayop ng karaban na nabanggit na sa konteksto.
- source_word: מִחוּץ לָעִיר
  choice: sa labas ng lungsod
  rationale: Tumpak na ipinapahayag ang lokasyon; maaaring mangahulugan ang עִיר ng lungsod o bayan, ngunit ang “lungsod” ang karaniwang pormal na salin.
- source_word: אֶל בְּאֵר הַמָּיִם
  choice: sa tabi ng balon
  rationale: Bagaman maaaring magpahiwatig ang אֶל ng paglapit, ang inilalarawang kinalalagyan ng mga kamelyo matapos paluhurin ay natural na ipinapahayag sa Tagalog bilang “sa tabi ng balon.” Sapat na sa Tagalog ang “balon” upang maipahiwatig na balon ito ng tubig.
- source_word: לְעֵת עֶרֶב
  choice: nang dapithapon
  rationale: Ang “dapithapon” ay likas at marangal na salitang Tagalog para sa oras ng pagdating ng gabi.
- source_word: לְעֵת צֵאת הַשֹּׁאֲבֹת
  choice: sa oras na lumalabas ang mga babaeng sumasalok ng tubig
  rationale: Pinananatili ang ikalawang pariralang temporal at ang pambabaeng maramihang anyo ng הַשֹּׁאֲבֹת. Nililinaw ng “mga babaeng sumasalok ng tubig” kung sino ang lumalabas nang oras na iyon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Pinanatili ang magkatabing pagtukoy sa oras—“nang dapithapon” at “sa oras na…”—nang hindi nagiging labis na literal o mabigat.
