translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at madaling maunawaan. Ang “ibabalik” ay mahusay na nagpapanatili sa causative at return sense ng Hebreo, kaya hindi kailangan ang footnote para sa alternatibong “dadalhin pabalik.”
