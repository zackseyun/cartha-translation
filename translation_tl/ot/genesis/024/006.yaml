  text: Abraham said to him[a], “Be careful that you do not take my son back there.”
translation:
  language: tl
  text: Sinabi ni Abraham sa kanya, “Mag-ingat ka na huwag mong ibalik doon ang anak ko.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אַבְרָהָם
  choice: Sinabi sa kanya ni Abraham
  rationale: Pinananatili ang payak na pagsasalaysay ng וַיֹּאמֶר at ang di-tuwirang layon ng אֵלָיו sa natural na ayos ng modernong Tagalog.
- source_word: הִשָּׁמֶר לְךָ
  choice: Tiyakin mong
  rationale: Ang Niphal imperative na may ethical dative ay isang mariing babala na mag-ingat upang hindi mangyari ang kasunod; natural itong ipinahahayag sa Tagalog bilang “Tiyakin mong hindi.”
- source_word: פֶּן
  choice: hindi
  rationale: Ipinapaloob sa hulma na “Tiyakin mong hindi” ang negatibong babala ng פֶּן nang hindi gumagamit ng makaluma o mabigat na pananalita.
- source_word: תָּשִׁיב
  choice: ibabalik
  rationale: Ang Hiphil ng שוב ay causative, “papagbalikin/ibalik.” Ang “ibabalik” ay malinaw at natural, habang hindi ipinapasya kung ang kilos ay mas angkop ilarawan bilang pagdala o paghatid.
- source_word: אֶת־בְּנִי
  choice: ang anak ko
  rationale: Tuwirang tumutugma sa pangngalang may panlaping unang panauhang isahan.
- source_word: שָׁמָּה
  choice: doon
  rationale: Natural na katumbas ng directional adverb na tumutukoy sa lugar na nabanggit sa konteksto.
