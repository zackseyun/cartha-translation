  yaml_path: translation/ot/genesis/024/050.yaml
  text: Then Laban and Bethuel answered and said[a], “The matter has come from Yahweh[b]; we cannot speak to you bad or good.”
translation:
  language: tl
  text: Sumagot sina Laban at Betuel at sinabi nila, “Ang usaping ito ay nagmula kay Yahweh; hindi kami makapagsasabi sa iyo ng masama o mabuti[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “masama o mabuti” ay isang idyomatikong pares. Maaaring ipinahihiwatig nito na wala silang maaaring sabihin laban o pabor sa usaping ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: Sumagot ... at sinabi nila
  rationale: Pinananatili ang dalawang pandiwa ng karaniwang pormulang Hebreo sa pagpapakilala ng tugon, bagaman maaaring paikliin sa natural na Filipino bilang “sumagot.”
- source_word: מֵיְהוָה
  choice: nagmula kay Yahweh
  rationale: Ipinahahayag ng מִן ang pinagmulan, at isinasalin ang banal na pangalang יהוה bilang “Yahweh.”
- source_word: יָצָא הַדָּבָר
  choice: Ang bagay na ito ay nagmula
  rationale: Ang דָּבָר ay tumutukoy rito sa usaping pinag-uusapan, at ang יָצָא kasama ng pariralang nagsasaad ng pinagmulan ay likas na naipapahayag bilang “nagmula.”
- source_word: לֹא נוּכַל דַּבֵּר אֵלֶיךָ
  choice: hindi kami makapagsasabi sa iyo
  rationale: Pinananatili ang diwa ng kawalan ng kakayahang magsalita o magpasiya laban sa nangyari, sa malinaw at kasalukuyang Filipino.
- source_word: רַע אוֹ טוֹב
  choice: masama o mabuti
  rationale: Pinananatili ang ayos at magkatambal na mga salita sa Hebreo, nang hindi tahasang nilulutas ang idyoma sa pangunahing teksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo.
- issue: Saklaw ng pahayag na “masama o mabuti”
  choice: Pinanatili bilang idyomatikong pares
  alternative: “Hindi namin maaaring tutulan o baguhin ito”
  rationale: Ang mas malayang alternatibo ay nagpapaliwanag sa malamang na diwa ngunit inaalis ang tunay na anyo at bahagyang tensiyon ng pahayag sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormulang “sumagot ... at sinabi” at ang pares na “masama o mabuti” upang manatiling malapit sa tekstong Hebreo, habang ipinaliliwanag sa talababa ang idyomatikong diwa.
