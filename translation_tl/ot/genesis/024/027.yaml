revisions:
- from: At sinabi niya, “Purihin si Yahweh, ang Diyos ng panginoon kong si Abraham! Hindi niya pinagkaitan ang aking panginoon ng kaniyang tapat na pag-ibig at katapatan.[a] Ako naman, inakay ako ni Yahweh sa paglalakbay patungo sa sambahayan ng mga kapatid[b] ng aking panginoon.”
  to: At sinabi niya, “Purihin nawa si Yahweh, ang Diyos ng panginoon kong si Abraham! Hindi niya ipinagkait sa aking panginoon ang kaniyang tapat na pag-ibig at katapatan.[a] Ako naman, inakay ni Yahweh sa daan patungo sa bahay ng mga kapatid[b] ng aking panginoon.”
  rationale: The revision preserves the Hebrew structure and semantic range while improving natural modern Filipino Tagalog. It renders the opening as a benediction, removes an unnecessary pronoun repetition, uses more source-proximate wording for “on the way” and “house,” and adjusts the lexical-alternative footnote to offer a defensible alternative for the Hebrew pair.
