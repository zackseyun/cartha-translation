id: GEN.24.27
reference: Genesis 24:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲ֠שֶׁר לֹֽא עָזַ֥ב חַסְדּ֛/וֹ וַ/אֲמִתּ֖/וֹ מֵ/עִ֣ם אֲדֹנִ֑/י אָנֹכִ֗י בַּ/דֶּ֨רֶךְ֙ נָחַ֣/נִי יְהוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/027.yaml
  text: And he said[a], “Blessed be Yahweh, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness from my master. As for me[b], Yahweh has led me on the way to the house of my master’s brothers.”
translation:
  language: tl
  text: At sinabi niya, “Purihin nawa si Yahweh, ang Diyos ng panginoon kong si Abraham! Hindi niya ipinagkait sa aking panginoon ang kaniyang tapat na pag-ibig at katapatan.[a] Ako naman, inakay ni Yahweh sa daan patungo sa bahay ng mga kapatid[b] ng aking panginoon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaniyang kagandahang-loob at katotohanan.” Ang pares ng mga salitang Hebreo ay madalas magpahiwatig ng matibay na pag-ibig at pagiging maaasahan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga kapatid”; dito ay tumutukoy ito sa mga lalaking kamag-anak o angkan ni Abraham.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: Purihin si Yahweh
  rationale: Ang Hebreong pormula ay isang pagpapahayag ng papuri. Ang “Purihin si Yahweh” ay likas at marangal sa makabagong Tagalog at mas malinaw na naghahatid ng doxolohikal na diwa kaysa sa literal ngunit di-likas na “Pinagpala si Yahweh.”
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: ang Diyos ng panginoon kong si Abraham
  rationale: Pinananatili nito ang ugnayang construct sa Hebreo at ang magalang na pagtukoy ng lingkod kay Abraham bilang kaniyang panginoon.
- source_word: לֹא עָזַב חַסְדּוֹ וַאֲמִתּוֹ מֵעִם אֲדֹנִי
  choice: Hindi niya pinagkaitan ang aking panginoon ng kaniyang tapat na pag-ibig at katapatan
  rationale: Sa idyomang Hebreo, hindi inalis o iniwan ni Yahweh ang kaniyang חסד at אמת kaugnay ng panginoon ng nagsasalita. Ang “pinagkaitan ... ng” ay natural sa Tagalog at pinananatili ang ideya na patuloy niyang ipinakita ang mga ito.
- source_word: חַסְדּוֹ וַאֲמִתּוֹ
  choice: kaniyang tapat na pag-ibig at katapatan
  rationale: Ipinahihiwatig ng pares ang matibay na pag-ibig, katapatan, at pagiging maaasahan. Ang salin ay madaling maunawaan nang hindi nililimitahan ang mga salita sa isang teknikal na teolohikal na kahulugan.
- source_word: אָנֹכִי
  choice: Ako naman
  rationale: Ipinakikita ng malayang panghalip na nasa unahan ang diin sa nagsasalita; likas itong naipahahayag sa Tagalog sa pamamagitan ng “Ako naman.”
- source_word: בַּדֶּרֶךְ נָחַנִי יְהוָה
  choice: inakay ako ni Yahweh sa paglalakbay
  rationale: Ang “inakay” ay nagpapanatili sa personal na paggabay ni Yahweh, at ang “sa paglalakbay” ay natural na katumbas ng lokatibong pariralang “sa daan.”
- source_word: בֵּית אֲחֵי אֲדֹנִי
  choice: patungo sa sambahayan ng mga kapatid ng aking panginoon
  rationale: Maaaring tumukoy ang בֵּית sa bahay o sambahayan; sa konteksto, ang “sambahayan” ay maayos na sumasaklaw sa tahanan at angkan. Pinanatili sa teksto ang literal na panlalaking katawagang “mga kapatid,” na nililinaw sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa חסד ואמת
  choice: tapat na pag-ibig at katapatan
  alternative: wagas na pagmamahal at katotohanan
  rationale: Ang piniling salin ay nagpapanatili sa relasyonal na diwa ng matibay na pag-ibig at pagiging maaasahan, nang hindi sapilitang ginagawa itong tahasang teknikal na terminong pangtipan.
- issue: Pangalan ng Diyos na יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh.”
- issue: Saklaw ng אֲחֵי
  choice: mga kapatid, na may paglilinaw sa talababa
  alternative: mga kamag-anak
  rationale: Pinananatili ng pangunahing teksto ang literal na panlalaking katawagan habang kinikilala ng talababa na mas malawak ang tinutukoy nitong angkan o mga lalaking kamag-anak ni Abraham sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “panginoon” sa maliit na titik para sa amo ng lingkod at “Yahweh” para sa banal na pangalan. Ang ayos ng mga sugnay ay ginawang natural sa Tagalog habang pinananatili ang diin ng אָנֹכִי at ang pag-ugnay ng חסד at אמת.
