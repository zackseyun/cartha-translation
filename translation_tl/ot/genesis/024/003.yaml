  text: וְ/אַשְׁבִּ֣יעֲ/ךָ֔ בַּֽ/יהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וֵֽ/אלֹהֵ֖י הָ/אָ֑רֶץ אֲשֶׁ֨ר לֹֽא תִקַּ֤ח אִשָּׁה֙ לִ/בְנִ֔/י מִ/בְּנוֹת֙ הַֽ/כְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יוֹשֵׁ֥ב בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/003.yaml
  text: and I will make you swear by Yahweh[a], the God of heaven and the God of the earth, that you shall not take a wife for my son from the daughters of the Canaanites, among whom I dwell.
translation:
  language: tl
  text: at pasusumpain kita sa pangalan ni Yahweh, ang Diyos ng langit at ang Diyos ng lupa, na hindi ka kukuha ng mapapangasawa para sa anak kong lalaki mula sa mga anak na babae ng mga Cananeo, na sa gitna nila ay naninirahan ako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַשְׁבִּיעֲךָ
  choice: at pasusumpain kita
  rationale: 'Pinananatili nito ang causative na diwa ng Hiphil: ipasasagawa ni Abraham sa kausap ang panunumpa.'
- source_word: בַּיהוָה
  choice: sa pangalan ni Yahweh
  rationale: Minamarkahan ng בְּ ang Diyos na pinagbabatayan o tinatawagan sa panunumpa. Likas sa modernong Tagalog ang 'sumumpa sa pangalan ni' at pinananatili ang pangalang Yahweh.
- source_word: אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ
  choice: ang Diyos ng langit at ang Diyos ng lupa
  rationale: Pinananatili ang pag-uulit ng 'Diyos ng' sa Hebreo at ang malawak na tambalang langit-lupa.
- source_word: אֲשֶׁר לֹא תִקַּח
  choice: na hindi ka kukuha
  rationale: Ipinapahayag nito ang nilalaman ng sumpa nang tuwiran at may marangal na himig.
- source_word: אִשָּׁה לִבְנִי
  choice: ng mapapangasawa para sa anak kong lalaki
  rationale: Sa konteksto ng pag-aasawa, ang אִשָּׁה ay tumutukoy sa magiging asawa; nililinaw ng 'anak kong lalaki' ang referent ng בְּנִי.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: mula sa mga anak na babae ng mga Cananeo
  rationale: Pinananatili ang Hebreong idyomang 'mga anak na babae' habang malinaw na tumutukoy sa mga babaeng kabilang sa mga Cananeo.
- source_word: אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּוֹ
  choice: na kasama kong naninirahan
  rationale: Likas na Filipino ito para sa paninirahan sa gitna ng isang pangkat at pinananatili ang patuloy na diwa ng participle.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng transliterasyong 'Yahweh' ang natatanging pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng pariralang 'Diyos ng langit at Diyos ng lupa'
  choice: panatilihin ang dalawang construct phrase
  alternative: Diyos ng langit at lupa
  rationale: Ang pag-uulit sa Hebreo ay nagbibigay-diin sa kapamahalaan ng Diyos sa kapuwa langit at lupa; hindi ito pinaikli.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'pasusumpain' upang mapanatili ang causative na pandiwa, at 'mapapangasawa' bilang natural na katumbas sa konteksto. Walang kinakailangang talababa dahil ang 'Yahweh' ay nasa pangunahing teksto at walang alternatibong pagbasa na kailangang ilahad.
