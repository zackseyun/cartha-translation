  yaml_path: translation/ot/genesis/024/043.yaml
  text: Look[a], I am standing by the spring of water, and let it be that the young woman who comes out to draw, to whom I say[b], ‘Please let me drink a little water from your jar,’
translation:
  language: tl
  text: “Narito, nakatayo ako sa tabi ng bukal, at mangyari nawa na ang dalagang[a] lalabas upang umigib, at kapag sinabi ko sa kanya, ‘Pakibigyan mo ako ng kaunting tubig mula sa iyong banga upang mainom ko,’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kabataang babae.” Ang Hebreong עַלְמָה ay tumutukoy sa isang kabataang babaeng nasa edad nang mag-asawa; hindi nito sa ganang sarili tahasang ibig sabihin na “birhen.”
    reason: lexical_alternative
  - marker: b
    text: O “Pahintulutan mo akong uminom ng kaunting tubig mula sa iyong banga.”
    reason: translation_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Ipinakikilala ng pantukoy na ito ang tagpo nang tuwiran at malinaw; likas at marangal sa makabagong Filipino ang “Narito.”
- source_word: נִצָּב
  choice: nakatayo ako
  rationale: Ipinahihiwatig ng participle ang kasalukuyan at nagpapatuloy na kalagayan ng nagsasalita.
- source_word: עַל עֵין הַמָּיִם
  choice: sa tabi ng bukal
  rationale: Ang עֵין ay likas na bukal o pinagmumulan ng tubig, hindi karaniwang balon; sapat na sa Filipino ang “bukal” nang hindi na inuulit ang “ng tubig.”
- source_word: וְהָיָה
  choice: at mangyari nawa na
  rationale: Sa konteksto ng panalangin at hinihinging tanda, ipinapahayag nito ang inaasam na mangyari, hindi lamang isang payak na hinaharap.
- source_word: הָעַלְמָה
  choice: ang dalaga
  rationale: Tumutukoy ang עַלְמָה sa isang kabataang babaeng nasa edad nang mag-asawa; hindi nito sa ganang sarili tahasang ipinapahayag ang pagkabirhen.
- source_word: הַיֹּצֵאת לִשְׁאֹב
  choice: lalabas upang umigib
  rationale: Pinananatili nito ang kilos ng paglabas at ang layuning umigib, na likas ang pagkakasabi sa Filipino.
- source_word: וְאָמַרְתִּי אֵלֶיהָ
  choice: at sasabihan ko
  rationale: Tuwirang pinananatili ang pagkakasunod ng mga kilos at maayos na iniuugnay ang babae sa sasabihin ng lingkod.
- source_word: הַשְׁקִינִי נָא
  choice: Pakibigyan mo ako ... upang mainom ko
  rationale: Ipinapahayag nito ang magalang na pakiusap at ang causative na diwa ng pagbibigay ng maiinom sa natural na Filipino.
- source_word: מְעַט מַיִם מִכַּדֵּךְ
  choice: ng kaunting tubig mula sa iyong banga
  rationale: Tumpak nitong inilalarawan ang maliit na dami ng tubig at ang sisidlang pinagmulan nito.
theological_decisions:
- issue: Kahulugan ng עַלְמָה
  choice: dalaga
  alternative: kabataang babae; birhen
  rationale: Ang salitang Hebreo ay tumutukoy sa kabataang babaeng nasa edad nang mag-asawa ngunit hindi tahasang nagsasaad ng pagkabirhen. Iniiwasan ng salin ang pagpasok ng mas tiyak na teolohikal na pakahulugan kaysa sa mismong salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong nakabitin ng pangungusap sapagkat nagpapatuloy ang kundisyon sa kasunod na talata. Ang “iyong” ay ginamit sa halip na “mo” sa loob ng pakiusap upang mapanatili ang bahagyang pormal na himig.
