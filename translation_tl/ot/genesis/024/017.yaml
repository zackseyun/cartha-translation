    issue: Hindi idiomatiko ang “Pakiinom mo ako.”
    rationale: Ang anyong ito ay hindi karaniwang Tagalog para sa kahilingang painumin ang nagsasalita. Ang Hiphil imperative na הַגְמִיאִנִי ay mas tapat at natural na maipapahayag bilang “Painumin mo sana ako” o, bilang alternatibo, “Hayaan mong uminom ako.”
  - severity: low
    issue: Medyo bitin ang “at sinabi” bago ang tuwirang sipi.
    rationale: Bagaman nauunawaan, mas likas sa Tagalog ang “at sinabi niya,” at malinaw nitong itinutukoy ang lingkod bilang nagsasalita.
