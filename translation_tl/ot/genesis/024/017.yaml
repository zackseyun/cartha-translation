  text: The servant ran to meet her and said[a], “Please let me drink a little water from your jar.”
translation:
  language: tl
  text: Tumakbo ang lingkod upang salubungin siya at sinabi niya[a], “Painumin mo sana ako ng kaunting tubig mula sa iyong banga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hayaan mong uminom ako ng kaunting tubig mula sa iyong banga.” Ang pandiwang pautos sa Hebreo ay maaaring ipahayag bilang “painumin mo ako” o “hayaan mong uminom ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: Tumakbo
  rationale: Tuwirang ipinapahayag ng רוץ ang pagtakbo at pinananatili nito ang mabilis at agarang kilos sa salaysay.
- source_word: הָעֶבֶד
  choice: ang lingkod
  rationale: Maaaring tumukoy ang עֶבֶד sa lingkod o alipin. Sa kontekstong ito, siya ay pinagkakatiwalaang katiwala ni Abraham, kaya natural at angkop ang “lingkod” nang hindi itinatanggi ang kalagayang panlipunan na maaaring saklawin ng salita.
- source_word: לִקְרָאתָהּ
  choice: upang salubungin siya
  rationale: Ipinahihiwatig ng לִקְרָאתָהּ ang pagkilos patungo sa isang tao upang makaharap siya; likas sa Tagalog ang “salubungin siya.”
- source_word: וַיֹּאמֶר
  choice: at sinabi
  rationale: Karaniwang panimula ito sa tuwirang pananalita sa salaysay. Hindi na kailangang ulitin ang panghalip dahil malinaw ang simuno.
- source_word: הַגְמִיאִינִי
  choice: Pakiinom mo ako
  rationale: Ang Hiphil imperative ng גמא na may unang panauhang hulapi ay kahilingang painumin ang nagsasalita. Ang “pakiinom mo ako” ay magalang, natural, at pinananatili ang sanhiang anyo ng Hebreo.
- source_word: נָא
  choice: paki-
  rationale: Ang נָא ay nagpapalambot sa utos bilang magalang na pakiusap; natural itong naisasama sa unlaping “paki-” sa modernong Tagalog.
- source_word: מְעַט מַיִם
  choice: kaunting tubig
  rationale: Tumpak na ipinapahayag ng “kaunting tubig” ang maliit at mapagkumbabang dami ng hinihingi.
- source_word: מִכַּדֵּךְ
  choice: mula sa iyong banga
  rationale: Ang כַּד ay sisidlang ginagamit sa pagsalok o pag-iigib ng tubig. Karaniwan at malinaw sa Tagalog ang “banga,” at pinananatili ng “iyong” ang pambabaeng isahang hulapi ayon sa konteksto.
