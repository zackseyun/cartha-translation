translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “lingkod,” “salubungin,” at “banga” bilang mga karaniwang salitang madaling maunawaan. Ang magalang na pakiusap ay likas na ipinahayag sa “Pakiinom mo ako,” habang inilagay sa talababa ang tunay na alternatibong pagbasa ng sanhiang pandiwa.
