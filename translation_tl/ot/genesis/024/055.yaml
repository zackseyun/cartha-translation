  text: But her brother and her mother said[a], “Let the young woman stay with us a few days, or ten; after that she may go.”
translation:
  language: tl
  text: Ngunit sinabi ng kaniyang kapatid na lalaki at ng kaniyang ina, “Manatili muna sa amin ang dalaga nang ilang araw, o sampung araw; pagkatapos nito, maaari siyang umalis.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga araw, o sampu.” Malamang na ang parirala ay nangangahulugang “ilang araw, o sampung araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay, ngunit ang tugon ay salungat sa agarang kahilingan ng lingkod sa naunang talata; kaya natural dito ang “Ngunit.”
- source_word: אָחִיהָ וְאִמָּהּ
  choice: ng kanyang kapatid na lalaki at ng kanyang ina
  rationale: Pinananatili ang isahang “kapatid” at ang pagkakasunod ng mga tauhan sa Hebreo. Nilinaw ng “kapatid na lalaki” ang kasarian na tahasang nasa אָח.
- source_word: תֵּשֵׁב
  choice: Manatili muna
  rationale: Sa usapin ng pagpapaliban sa pag-alis, natural na katumbas ng ישב ang “manatili.” Ipinahihiwatig ng “muna” ang pansamantalang pananatili nang hindi binabago ang diwa.
- source_word: הַנַּעֲרָ
  choice: ang dalaga
  rationale: Ang נַעֲרָה ay tumutukoy sa isang kabataang babae. Ang “dalaga” ay maikli, dignified, at natural sa makabagong Filipino.
- source_word: אִתָּנוּ
  choice: sa amin
  rationale: Sa pandiwang “manatili,” ang natural na Filipino para sa presensiya o pakikisama ay “sa amin.”
- source_word: יָמִים
  choice: nang ilang araw
  rationale: Bagaman literal na “mga araw,” maaari itong maging idyomatikong “ilang araw” sa kontekstong ito.
- source_word: אוֹ עָשׂוֹר
  choice: o sampung araw
  rationale: Ang עָשׂוֹר ay “sampu.” Inulit ang “araw” sa Filipino upang maging malinaw at natural ang bilang.
- source_word: אַחַר
  choice: pagkatapos
  rationale: Natural nitong ipinapahayag ang kasunod na pangyayari.
- source_word: תֵּלֵךְ
  choice: maaari na siyang umalis
  rationale: Ang konteksto ay malinaw na tumutukoy sa dalaga. Ang “maaari” ay nagpapanatili sa pahintulot o jussive na himig, sa halip na gawing tiyak na panghinaharap.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dalaga” sa halip na mas kolokyal na “babae” o makalumang katawagan. Walang talababa sapagkat malinaw na naipahayag sa teksto ang malamang na idyomatikong kahulugan na “ilang araw, o sampung araw.”
