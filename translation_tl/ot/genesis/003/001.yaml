id: GEN.3.1
reference: Genesis 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/נָּחָשׁ֙ הָיָ֣ה עָר֔וּם מִ/כֹּל֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר עָשָׂ֖ה יְהוָ֣ה אֱלֹהִ֑ים וַ/יֹּ֨אמֶר֙ אֶל הָ֣/אִשָּׁ֔ה אַ֚ף כִּֽי אָמַ֣ר אֱלֹהִ֔ים לֹ֣א תֹֽאכְל֔וּ מִ/כֹּ֖ל עֵ֥ץ הַ/גָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/001.yaml
  text: The serpent was more crafty than any beast of the field that Yahweh God had made[a]. And he said to the woman, “Indeed, has God said[c][b], ‘You shall not eat from any tree of the garden’?”
translation:
  language: tl
  text: Ang ahas ay higit na tuso[a] kaysa sa alinmang hayop sa parang na ginawa ni Yahweh na Diyos. Sinabi nito sa babae, “Talaga bang sinabi ng Diyos[b], ‘Huwag kayong kumain mula sa alinmang punongkahoy sa hardin[c]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mas matalas ang isip” o “mas maparaan.” Ang salitang Hebreo ay maaaring tumukoy sa maingat na karunungan, ngunit sa kontekstong ito ay may pahiwatig ng panlilinlang.
    reason: lexical_alternative
  - marker: b
    text: “Yahweh na Diyos” ang tawag ng tagapagsalaysay, ngunit “Diyos” lamang ang sinabi ng ahas. Pinananatili rito ang pagbabagong ito sa pananalitang Hebreo.
    reason: alternative_reading
  - marker: c
    text: Maaari ring unawaing “bawat punongkahoy sa hardin.” Sa tanong na may pagtanggi, mas natural na naihahayag ng “alinmang punongkahoy” ang pagpapalabis ng ahas sa utos ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּחָשׁ
  choice: Ang ahas
  rationale: Tuwirang tinutukoy ng הַנָּחָשׁ ang ahas. Hindi na ginawang hiwalay na “at” ang וְ sapagkat nagsisimula rito ang isang bagong tagpo at mas natural sa Tagalog ang payak na pambungad.
- source_word: עָרוּם
  choice: tuso
  rationale: Maaaring tumukoy ang salita sa pagiging matalino, maingat, o maparaan, ngunit sa kontekstong ito ay may pahiwatig ng panlilinlang. Pinananatili ng talababa ang mas malawak na saklaw nito.
- source_word: מִכֹּל חַיַּת הַשָּׂדֶה
  choice: kaysa sa alinmang hayop sa parang
  rationale: Ipinahahayag nito ang paghahambing sa lahat ng hayop na kaugnay ng bukid o lantad na lupain. Natural at malinaw sa modernong Tagalog ang “hayop sa parang.”
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Pinananatili ang personal na pangalang יְהוָה bilang “Yahweh” at ang kalakip na אֱלֹהִים bilang “Diyos.”
- source_word: וַיֹּאמֶר אֶל־הָאִשָּׁה
  choice: Sinabi nito sa babae
  rationale: Ang simuno ay ang ahas. Ang “nito” ay natural na panghalip para sa hayop at hindi nagdaragdag ng kasariang hindi kailangang ipahayag sa Tagalog.
- source_word: אַף כִּי אָמַר
  choice: Talaga bang sinabi
  rationale: Naihahatid nito ang mapagduda at mapanuyang puwersa ng tanong nang hindi ito ginagawang tahasang pagtanggi.
- source_word: לֹא תֹאכְלוּ
  choice: Huwag kayong kumain
  rationale: Ang pandiwa ay maramihan; kaya pinananatili ng “kayo” na higit sa babae lamang ang saklaw ng siniping pagbabawal.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: mula sa alinmang punongkahoy sa hardin
  rationale: Sa loob ng tanong na may pagtanggi, natural na ipinahahayag ng “alinmang” ang pinalabis na anyo ng utos. Hindi idinagdag sa pangunahing teksto ang “bunga,” bagaman iyon ang likas na ipinahihiwatig ng pagkain mula sa puno.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya tahasan itong pinananatili bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Pagkakaiba ng katawagan ng tagapagsalaysay at ng ahas
  choice: “Yahweh na Diyos” sa pagsasalaysay, ngunit “Diyos” lamang sa sinabi ng ahas
  alternative: Gawing “Yahweh na Diyos” sa parehong lugar
  rationale: Sadyang magkaiba ang יְהוָה אֱלֹהִים at אֱלֹהִים sa Hebreo. Hindi pinagtutugma ang mga ito upang mapanatili ang pagbabago sa pananalita.
- issue: Moral na kulay ng עָרוּם
  choice: tuso
  alternative: matalas ang isip / maparaan
  rationale: May saklaw ang salitang Hebreo mula sa pagkamatalino hanggang sa katusuhan. Dahil sinusundan ito ng mapanlinlang na tanong, ang “tuso” ang pinakamabisang katumbas, habang kinikilala sa talababa ang ibang posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang lumang ayos ng pangungusap at labis na teknikal na pananalita. Ginamit ang “punongkahoy” para sa dignidad at linaw, at pinanatili ang maramihang “kayo” ng Hebreo.
