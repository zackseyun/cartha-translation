id: GEN.3.24
reference: Genesis 3:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְגָ֖רֶשׁ אֶת הָֽ/אָדָ֑ם וַ/יַּשְׁכֵּן֩ מִ/קֶּ֨דֶם לְ/גַן עֵ֜דֶן אֶת הַ/כְּרֻבִ֗ים וְ/אֵ֨ת לַ֤הַט הַ/חֶ֨רֶב֙ הַ/מִּתְהַפֶּ֔כֶת לִ/שְׁמֹ֕ר אֶת דֶּ֖רֶךְ עֵ֥ץ הַֽ/חַיִּֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/024.yaml
  text: So he drove out the man[a], and to the east of the garden of Eden he stationed the cherubim and the flame of the sword that turns every way[b], to guard the way to the tree of life.
translation:
  language: tl
  text: Kaya pinalayas niya ang lalaki, at sa gawing silangan ng hardin ng Eden ay inilagay niya ang mga kerubin at ang ningas ng tabak na umiikot sa lahat ng dako[a], upang bantayan ang daan patungo sa punongkahoy ng buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradisyonal ding isinasalin: “ang nagliliyab na tabak na umiikot sa lahat ng dako.” Mas literal sa Hebreo: “ang ningas ng tabak na umiikot” o “umiikot sa lahat ng dako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: pinalayas
  rationale: Malinaw na ipinapahayag ng גרשׁ ang sapilitang pagpapaalis; natural at tuwiran sa makabagong Tagalog ang “pinalayas.”
- source_word: הָאָדָם
  choice: ang lalaki
  rationale: Sa kontekstong ito, tumutukoy ang אָדָם sa partikular na lalaking nilalang at inilagay sa hardin, hindi sa sangkatauhan sa pangkalahatan.
- source_word: וַיַּשְׁכֵּן
  choice: inilagay
  rationale: Ang Hiphil ng שכן ay nangangahulugang pinatahan o inilagay sa isang lugar. Ang “inilagay” ay natural sa Tagalog at hindi nagdaragdag ng di-tiyak na detalyeng militar.
- source_word: מִקֶּדֶם לְגַן עֵדֶן
  choice: sa gawing silangan ng hardin ng Eden
  rationale: Ipinahihiwatig ng parirala ang dakong silangan o silangang panig ng hardin; pinananatili ng “sa gawing silangan” ang posibleng saklaw nito nang natural.
- source_word: הַכְּרֻבִים
  choice: ang mga kerubin
  rationale: Ang “kerubin” ang kinikilalang transliterasyon sa Tagalog para sa tiyak na uri ng makalangit na nilalang; nililinaw ng “mga” ang maramihan.
- source_word: לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: ang ningas ng tabak na umiikot sa lahat ng dako
  rationale: Pinananatili nito ang literal na ugnayang “ningas ng tabak” at ang patuloy, sari-saring direksiyon ng kilos na ipinahihiwatig ng participle.
- source_word: לִשְׁמֹר
  choice: upang bantayan
  rationale: Sa konteksto ng pagpigil sa paglapit, ang “bantayan” ang pinakanatural na katumbas ng שׁמר.
- source_word: דֶּרֶךְ
  choice: ang daan patungo sa
  rationale: Bagaman pormal na “daan ng” ang Hebreo, malinaw at natural na ipinahahayag ng “patungo sa” ang rutang humahantong sa punongkahoy.
- source_word: עֵץ הַחַיִּים
  choice: punongkahoy ng buhay
  rationale: Tuwiran at dignidad na katumbas ito ng pariralang Hebreo at pamilyar sa gamit na biblikal sa Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa אָדָם sa kontekstong pasalaysay
  choice: ang lalaki
  alternative: ang tao / sangkatauhan
  rationale: Ang tinutukoy ay ang tiyak na indibidwal na pinalayas sa Eden. Hindi ginagawang abstraktong sangkatauhan ang referensiya, bagaman kinikilala ang mas malawak na kahulugan ng אָדָם sa ibang konteksto.
- issue: Anyo ng mahiwagang hadlang sa pasukan
  choice: ang ningas ng tabak na umiikot sa lahat ng dako
  alternative: ang nagliliyab na tabak na umiikot sa lahat ng dako
  rationale: Pinananatili ng pinili ang hindi pangkaraniwang konstruksiyong Hebreo na “ningas ng tabak” sa halip na tahimik itong gawing simpleng nagliliyab na tabak.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “gawing silangan” upang likas na maipahayag ang lokasyon, “mga kerubin” bilang kinikilalang terminong biblikal, at “punongkahoy” upang mapanatili ang marangal na rehistro nang hindi nagiging lipas o mahirap unawain.
