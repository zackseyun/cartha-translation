  text: וַ/יֹּ֕אמֶר אֶת קֹלְ/ךָ֥ שָׁמַ֖עְתִּי בַּ/גָּ֑ן וָ/אִירָ֛א כִּֽי עֵירֹ֥ם אָנֹ֖כִי וָ/אֵחָבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/010.yaml
  text: And he said[a], “I heard your voice in the garden, and I was afraid because I was naked, so I hid myself.”
translation:
  language: tl
  text: At sinabi niya, “Narinig ko ang tunog mo[a] sa hardin, at natakot ako dahil hubad ako, kaya nagtago ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinig mo.” Ang salitang Hebreo ay maaaring mangahulugang “tunog” o “tinig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng Hebrew wayyiqtol nang hindi dinaragdagan ang diwa bilang tahasang ‘sumagot.’
- source_word: אֶת קֹלְךָ
  choice: ang tunog mo
  rationale: Maaaring mangahulugan ang קוֹל ng ‘tunog’ o ‘tinig.’ Pinananatili ng ‘tunog mo’ ang mas malawak na diwa at hindi agad ipinapalagay na pagsasalita ang narinig; inilalagay sa talababa ang natural at tradisyonal na alternatibong ‘tinig mo.’
- source_word: שָׁמַעְתִּי
  choice: Narinig ko
  rationale: Tuwiran at likas na salin ng qal perfect na unang panauhang isahan.
- source_word: בַּגָּן
  choice: sa hardin
  rationale: Likas na makabagong Tagalog para sa tiyak na harding naitatag na sa konteksto.
- source_word: וָאִירָא
  choice: at natakot ako
  rationale: Malinaw at idyomatikong inilalahad ang takot na naranasan ng lalaki.
- source_word: כִּי
  choice: dahil
  rationale: Ipinahahayag ang sanhi ng kanyang pagkatakot.
- source_word: עֵירֹם אָנֹכִי
  choice: hubad ako
  rationale: Pinananatili ang payak at walang tahasang panahong nominal clause sa Hebreo; natural din ito sa Tagalog sa loob ng salaysay na nasa nakaraan.
- source_word: וָאֵחָבֵא
  choice: kaya nagtago ako
  rationale: Ang pandiwa ay may diwang reflexive na ‘itago ang sarili.’ Ang ‘kaya’ ay natural na nagpapakita ng bunga ng takot nang hindi binabago ang pangyayari.
theological_decisions:
- issue: Kahulugan ng קוֹל kaugnay ng presensiya ng Diyos
  choice: tunog mo
  alternative: tinig mo
  rationale: Hindi tinitiyak ng salitang Hebreo kung karaniwang tunog o binigkas na tinig ang narinig. Pinananatili sa pangunahing teksto ang mas malawak na pagbasa, habang inilalahad sa talababa ang lehitimong tradisyonal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘hardin’ sa halip na mas makalumang ‘halamanan,’ at pinanatiling payak ang pagtatapat ng lalaki.
