  text: It will produce thorns and thistles for you[c][b][a], and you will eat the plants of the field.
translation:
  language: tl
  text: Magpapatubo ito para sa iyo ng mga tinik at dawag,[a] at kakainin mo ang mga halaman sa bukid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Tutubuan ka nito ng mga tinik at dawag.” Ang “ito” ay tumutukoy sa lupa sa naunang talata. Ang pandiwang Hebreo ay nasa anyong causative.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga halaman sa bukid” ay maaari ring isaling “mga pananim sa bukid” o “mga halaman sa kaparangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֹוץ וְדַרְדַּר
  choice: mga tinik at dawag
  rationale: Ang pares na ito ay tumutukoy sa dalawang uri ng matinik at ligaw na pananim. Pinananatili ng “tinik at dawag” ang pagkakaiba ng dalawang salitang Hebreo nang hindi nagtatakda ng tiyak na uring botanikal.
- source_word: תַּצְמִיחַ לָךְ
  choice: Patutubuin nito para sa iyo
  rationale: Ang pandiwa ay nasa anyong causative at pambabaeng isahan, kaya likas itong tumutukoy sa lupa sa naunang talata. Malinaw na ipinapahayag ng “patutubuin” ang causative na diwa, at pinananatili ng “para sa iyo” ang לָךְ.
- source_word: וְאָכַלְתָּ
  choice: at kakainin mo
  rationale: Ipinagpapatuloy nito ang pahayag tungkol sa magiging bunga ng sumpa; natural sa modernong Tagalog ang aspektong kontemplatibo upang ihayag ang hinaharap.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: mga halaman sa parang
  rationale: Malawak ang kahulugan ng עֵשֶׂב at hindi lamang damo o halamang-gamot. Ang “mga halaman” ay malinaw at pangkalahatan, samantalang ang “sa parang” ay kumakatawan sa bukas na lupain na tinutukoy ng הַשָּׂדֶה.
theological_decisions:
- issue: Ang tinutukoy ng pambabaeng isahang pandiwang תַּצְמִיחַ
  choice: Ang “nito” ay tumutukoy sa lupa sa Genesis 3:17.
  alternative: Gawing tahasang simuno ang “lupa,” o gumamit ng konstruksiyong walang malinaw na tinutukoy.
  rationale: Ang anyo ng pandiwang Hebreo ay natural na bumabalik sa pambabaeng pangngalang הָאֲדָמָה (“lupa”) sa naunang talata. Pinananatili ng “nito” ang pagkakaugnay ng mga talata nang hindi nagdaragdag ng inuulit na pangngalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “dawag” bilang karaniwang tawag sa matinik na ligaw na halaman at ang “parang” para sa bukas na lupain, habang iniwasan ang labis na teknikal o makalumang pananalita.
