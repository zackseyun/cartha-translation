  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵיבָ֣ה אָשִׁ֗ית בֵּֽינְ/ךָ֙ וּ/בֵ֣ין הָֽ/אִשָּׁ֔ה וּ/בֵ֥ין זַרְעֲ/ךָ֖ וּ/בֵ֣ין זַרְעָ֑/הּ ה֚וּא יְשׁוּפְ/ךָ֣ רֹ֔אשׁ וְ/אַתָּ֖ה תְּשׁוּפֶ֥/נּוּ עָקֵֽב׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/015.yaml
  text: And I will put enmity[a] between you and the woman, and between your seed[b] and her seed; he will crush your head[c][d], and you will bruise his heel.
translation:
  language: tl
  text: At maglalagay ako ng alitan[a] sa pagitan mo at ng babae, at sa pagitan ng iyong binhi[b] at ng kanyang binhi. Siya[c] ang dudurog sa iyong ulo[d], at ikaw ang susugat sa kanyang sakong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkakapootan.”
    reason: lexical_alternative
  - marker: b
    text: “Binhi” sa Hebreo sa dalawang lugar; maaari itong tumukoy nang sama-sama sa mga inapo o sa isang kinatawang indibidwal.
    reason: lexical_alternative
  - marker: c
    text: Ang panghalip sa Hebreo ay panlalaking isahan, kasunod ng kolektibong pangngalang “binhi”; maaari ring unawain ang tinutukoy bilang kolektibo.
    reason: alternative_reading
  - marker: d
    text: Iisang pandiwang Hebreo ang ginamit sa “dudurog” at “susugat.” Maaari rin itong isaling “susugat” o “hahampas” sa parehong sugnay; ipinahihiwatig ng ulo at sakong ang magkaibang tindi ng pinsala.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיבָה
  choice: alitan
  rationale: Likas at malinaw sa makabagong Tagalog; ipinapahayag nito ang matindi at nagpapatuloy na hidwaan. Ang “pagkakapootan” ay posibleng mas tahasang alternatibo.
- source_word: אָשִׁית
  choice: maglalagay ako
  rationale: Tuwirang katumbas ng karaniwang kahulugang “maglagay/magtakda” ng שׂים at natural sa pangungusap.
- source_word: בֵּינְךָ ... וּבֵין הָאִשָּׁה
  choice: sa pagitan mo at ng babae
  rationale: Pinananatili ang tuwirang ugnayan at ang paulit-ulit na paralelismo ng Hebreo.
- source_word: זַרְעֲךָ ... זַרְעָהּ
  choice: iyong binhi ... kanyang binhi
  rationale: Pinananatili ang iisang larawang ginamit sa dalawang panig. Ang “binhi” ay maaaring tumukoy sa mga inapo bilang isang kabuuan o sa isang kinatawang indibidwal.
- source_word: הוּא
  choice: siya
  rationale: Ang panghalip na Hebreo ay panlalaking isahan, kasunod ng kolektibong pangngalang “binhi.” Hindi minamarkahan ng “siya” ang kasarian sa Tagalog, kaya nililinaw sa talababa ang anyong Hebreo nang hindi ipinipilit ang isang teolohikal na pakahulugan.
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  choice: dudurog ... susugat
  rationale: Iisang bihirang pandiwa ang ginamit sa Hebreo, ngunit ipinahihiwatig ng magkaibang bahaging tinatamaan—ulo at sakong—ang magkaibang bigat ng pinsala. Inilalantad ng talababa ang pag-uulit at mga alternatibong salin.
- source_word: רֹאשׁ
  choice: ulo
  rationale: Tuwiran at likas na salin ng bahagi ng katawan.
- source_word: עָקֵב
  choice: sakong
  rationale: Tuwiran at likas na salin ng bahagi ng katawan.
theological_decisions:
- issue: Kung paano pananatilihin ang kapuwa kolektibo at indibidwal na posibilidad ng “binhi” ng babae
  choice: Ginamit ang “binhi” sa dalawang lugar at “siya” sa kasunod na pangungusap, na may talababa tungkol sa panlalaking-isahang anyo ng Hebreo.
  alternative: “Mga inapo” at “sila,” o “supling” at “siya.”
  rationale: Inuulit ng Hebreo ang kolektibong pangngalang זֶרַע para sa ahas at babae, saka gumagamit ng panlalaking-isahang panghalip. Pinananatili ng salin ang dalawang posibilidad nang hindi tahasang naglalagay ng ganap na mesiyanikong interpretasyon sa pangunahing teksto.
- issue: Kung gaano katindi ang pagsasalin sa unang gamit ng שׁוּף
  choice: “Dudurog” para sa ulo at “susugat” para sa sakong.
  alternative: Gamitin ang “susugat” o “hahampas” sa parehong sugnay.
  rationale: Iisang pandiwa ang inuulit sa Hebreo, ngunit mas malubha ang ipinahihiwatig na pinsala sa ulo kaysa sa sakong. Ipinakikita ng magkaibang pandiwa ang asimetring ito, habang pinananatiling hayag sa talababa ang pagkakapareho ng salitang Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang “binhi” bilang sadyang source-near na salita upang maingatan ang larawang Hebreo at ang kolektibo/indibidwal na kalabuan. Ginamit ang “alitan” sa halip na mas arkaikong “pag-aalitan” o mas mabigat na “pagkakapootan,” na inilagay bilang alternatibo sa talababa.
