  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/לְ/אָדָ֣ם אָמַ֗ר כִּֽי שָׁמַעְתָּ֮ לְ/ק֣וֹל אִשְׁתֶּ/ךָ֒ וַ/תֹּ֨אכַל֙ מִן הָ/עֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ אֲרוּרָ֤ה הָֽ/אֲדָמָה֙ בַּֽ/עֲבוּרֶ֔/ךָ בְּ/עִצָּבוֹן֙ תֹּֽאכֲלֶ֔/נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/017.yaml
  text: And to Adam he said[a], “Because you listened to the voice of your wife and ate from the tree about which I commanded you, saying, ‘You shall not eat from it,’ the ground is cursed because of you[f][e][d][c][b]; in painful toil you shall eat from it all the days of your life.”
translation:
  language: tl
  text: At sinabi niya kay Adan[a], “Dahil nakinig ka sa sinabi ng iyong asawa[b] at kumain ka mula sa punongkahoy na iniutos kong huwag mong kainin, isinumpa ang lupa dahil sa iyo[c]. Sa paghihirap ay kakain ka mula rito sa lahat ng araw ng iyong buhay[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lalaki” sa halip na “kay Adan.”
    reason: alternative_reading
  - marker: b
    text: Sa literal, “nakinig ka sa tinig ng iyong asawa”; maaari ring maunawaan na “sinunod mo ang iyong asawa.”
    reason: lexical_alternative
  - marker: c
    text: O “Sumpa ang lupa dahil sa iyo.”
    reason: lexical_alternative
  - marker: d
    text: Ang salitang Hebreo ay maaari ring isaling “sa sakit,” “sa dalamhati,” o “sa matinding pagpapagal”; dito, kaugnay ito ng paghihirap sa pagkuha ng pagkain mula sa lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  choice: kay Adan
  rationale: Tumutukoy ito sa partikular na lalaki sa salaysay. Ginamit ang pangalang “Adan,” habang itinabi sa talababa ang posibleng “sa lalaki.”
- source_word: כִּי
  choice: Dahil
  rationale: Malinaw na ipinakikilala nito ang dahilan ng hatol.
- source_word: שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  choice: nakinig ka sa sinabi ng iyong asawa
  rationale: Ang idyomang Hebreo ay literal na “nakinig ka sa tinig ng iyong asawa.” Ang “sa sinabi” ay likas sa makabagong Tagalog at hindi kasing-tiyak ng “sinunod mo,” na maaaring labis na magpakahulugan.
- source_word: וַתֹּאכַל מִן הָעֵץ
  choice: at kumain ka mula sa punongkahoy
  rationale: Pinananatili ng “mula sa” ang מִן at ipinahihiwatig na ang kinain ay bunga o anumang nagmula sa puno, hindi ang mismong kahoy.
- source_word: אֲשֶׁר צִוִּיתִיךָ לֵאמֹר
  choice: na iniutos ko sa iyo tungkol dito
  rationale: Pinananatili ang ugnayan ng punongkahoy sa utos; ang kasunod na tuwirang sipi ang likas na Tagalog na gumaganap sa Hebreong לֵאמֹר, kaya hindi na idinagdag ang mabigat na “na sinasabi.”
- source_word: לֹא תֹאכַל מִמֶּנּוּ
  choice: Huwag kang kakain mula rito
  rationale: Likas na anyo ito ng mariing pagbabawal sa Tagalog at pinananatili ang diwang “mula rito.”
- source_word: אֲרוּרָה הָאֲדָמָה
  choice: isinumpa ang lupa
  rationale: Natural sa Tagalog at pinananatili ang lupa bilang tumanggap ng sumpa; ang pasibong anyo ay hindi tahasang nagdaragdag ng gumagawa sa sugnay.
- source_word: בַּעֲבוּרֶךָ
  choice: dahil sa iyo
  rationale: Malinaw nitong ipinapahayag na ang sumpa sa lupa ay bunga ng ginawa ni Adan, nang walang kapakinabangang pahiwatig ng “para sa iyo.”
- source_word: בְּעִצָּבוֹן
  choice: sa hirap at sakit
  rationale: Malawak ang saklaw ng salita—sakit, dalamhati, at mabigat na pagpapagal. Pinananatili ng tambalang parirala ang parehong paghihirap at masakit na paggawa nang hindi ito nililimitahan sa isang aspekto lamang.
- source_word: תֹּאכֲלֶנָּה
  choice: ka kakain mula rito
  rationale: Ang hulaping pambabae ay bumabalik sa “lupa.” Ang “kakain mula rito” ay malinaw na tumutukoy sa pagkaing nagmumula sa lupa, hindi sa literal na pagkain ng lupa.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: sa lahat ng araw ng iyong buhay
  rationale: Pinananatili ang buong Hebreong idyoma at ang marangal, mabigat na indayog ng hatol.
theological_decisions:
- issue: Pagpapakahulugan sa אָדָם sa konteksto ng salaysay
  choice: Adan
  alternative: ang lalaki
  rationale: Ang kausap ay ang partikular na lalaki sa salaysay sa Eden. Hindi nito ginagawang pangkalahatang pahayag tungkol sa buong sangkatauhan ang sugnay, ngunit kinikilala sa talababa ang leksikal na alternatibo.
- issue: Diwa ng שׁמע לקול sa tugon ni Adan sa asawa
  choice: nakinig ka sa sinabi ng iyong asawa
  alternative: sinunod mo ang iyong asawa; nakinig ka sa tinig ng iyong asawa
  rationale: Maaaring magpahiwatig ang idyoma ng pagtalima, ngunit hindi tahasang nilulutas ng salin ang saklaw nito bilang simpleng pakikinig o pagsunod. Ang napiling anyo ay natural at malapit sa larawan ng pinagmulan.
- issue: Saklaw ng בְּעִצָּבוֹן
  choice: sa hirap at sakit
  alternative: sa matinding pagpapagal; sa dalamhati
  rationale: Ang salita ay may tensiyon sa pagitan ng sakit, pighati, at mabigat na paggawa. Pinananatili ng salin ang lawak na iyon, lalo na ang tematikong ugnayan sa naunang talata, nang hindi ito isinasara sa isang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “punongkahoy” upang maiwasan ang kalituhan sa kahoy bilang materyal, at pinanatili ang solemne at tuwirang himig ng hatol. Hindi pinanatili ang bawat Hebreong idyoma nang literal kapag magiging alanganin sa Tagalog, ngunit inilagay sa talababa ang mahahalagang alternatibo at tunay na kalabuan.
