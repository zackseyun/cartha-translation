revisions:
- from: At sinabi niya kay Adan[a], “Dahil nakinig ka sa sinabi ng iyong asawa[b] at kumain ka mula sa punongkahoy na iniutos ko sa iyo tungkol dito, ‘Huwag kang kakain mula rito,’ isinumpa ang lupa dahil sa iyo[c]. Sa hirap at sakit[d] ka kakain mula rito sa lahat ng araw ng iyong buhay.”
  to: At sinabi niya kay Adan[a], “Dahil nakinig ka sa sinabi ng iyong asawa[b] at kumain ka mula sa punongkahoy na iniutos kong huwag mong kainin, isinumpa ang lupa dahil sa iyo[c]. Sa paghihirap ay kakain ka mula rito sa lahat ng araw ng iyong buhay[d].”
  rationale: Inayos ang sugnay tungkol sa utos upang malinaw na ang ipinag-utos ay huwag kainin ang bunga ng punongkahoy. Inayos ang alternatibong salin ng sumpa upang maging pahayag na katumbas ng Hebreo. Pinalitan ang “hirap at sakit” ng “paghihirap” para sa mas likas na daloy, habang inilalagay sa talababa ang magkakaugnay na saklaw ng Hebreong termino.
