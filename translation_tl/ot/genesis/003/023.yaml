  yaml_path: translation/ot/genesis/003/023.yaml
  text: So Yahweh God sent him out from the garden of Eden to work the ground from which he had been taken[a].
translation:
  language: tl
  text: Kaya pinalabas siya ni Yahweh na Diyos mula sa hardin ng Eden upang linangin ang lupang pinagmulan niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang trabahuhin ang lupa.” Ang pandiwang Hebreo ay maaaring mangahulugang “magtrabaho,” “maglingkod,” o, sa kontekstong ito, “maglinang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחֵהוּ
  choice: pinaalis siya
  rationale: Ang piel ng שׁלח ay maaaring mangahulugang magpadala o magpaalis. Sa konteksto, malinaw na inalis ang lalaki sa Eden; ang “pinaalis” ay nagpapanatili ng diwang ito nang hindi ginagamit ang mas matinding “itinaboy,” na tumutugma sa ibang pandiwa sa kasunod na talata.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh,” at natural na inuugnay sa “Diyos” sa modernong Tagalog.
- source_word: מִגַּן עֵדֶן
  choice: sa hardin ng Eden
  rationale: Kasunod ng pandiwang “pinaalis,” natural sa Tagalog ang “sa” upang ipahayag ang lugar na pinanggalingan; malinaw na mula sa hardin ang pag-aalis.
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: upang bungkalin ang lupa
  rationale: Sa kontekstong agrikultural, ang עבד ay tumutukoy sa paggawa o paglilinang ng lupa. Ang “bungkalin” ay karaniwan at kongkreto, habang ang talababa ay nagpapanatili sa mas malawak na alternatibong “pagtrabahuhan.”
- source_word: אֲשֶׁר לֻקַּח מִשָּׁם
  choice: na pinagmulan niya
  rationale: Ipinahahayag nito sa natural na Tagalog na mula sa lupang iyon kinuha ang lalaki, at pinananatili ang ugnayang salaysay sa paglikha sa Genesis 2.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Nasa tekstong Hebreo ang mismong Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalan sa halip na palitan ito ng titulo.
- issue: Ugnayan ng gawain ng lalaki sa orihinal niyang atas
  choice: bungkalin ang lupa
  alternative: pagtrabahuhan ang lupa; paglingkuran ang lupa
  rationale: Pinananatili ang agrikultural na diwa at ang leksikal na kaugnayan sa naunang atas, nang hindi nagdaragdag ng paliwanag na teolohikal na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “hardin” at “lupa” bilang natural at pamilyar na mga salita; iniwasan ang mas lumang “halamanan” at ang mas marahas na “itinaboy.”
