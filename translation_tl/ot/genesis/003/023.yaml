  - severity: low
    issue: “sa hardin ng Eden”
    rationale: Bagaman mauunawaan matapos ang “pinaalis,” hindi gaanong tahasang naipapakita ang מִן (“mula sa”). Ang “mula sa hardin ng Eden” ay parehong tapat at natural.
  - severity: low
    issue: “bungkalin” at talababa
    rationale: Ang “bungkalin” ay isang mas espesipikong gawaing pagsasaka kaysa sa malawak na עבד (“magtrabaho/linangin”). Mas angkop ang “linangin” sa pangunahing teksto; ang talababa ay dapat magbigay ng natural na alternatibong “trabahuhin ang lupa.”
