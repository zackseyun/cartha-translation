base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/021.yaml
  text: And Yahweh God made garments of skin for the man and for his wife[b][a], and clothed them.
translation:
  language: tl
  text: At gumawa si Yahweh na Diyos ng mga kasuotang yari sa balat[a] para sa lalaki[b] at sa kanyang asawa, at binihisan niya sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tunikang yari sa balat.”
    reason: lexical_alternative
  - marker: b
    text: O “para kay Adam.” Ang Hebreong אָדָם ay maaaring mangahulugang “ang lalaki” o magsilbing pangalang “Adam,” depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at natural na iniuugnay rito sa Tagalog ang titulong Diyos.
- source_word: לְאָדָם
  choice: para sa lalaki
  rationale: Sa konteksto, tumutukoy ito sa lalaking tao na itinatambal sa kanyang asawa; pinananatili rin sa talababa ang posibleng pagbasa rito bilang pangalang Adam.
- source_word: וּלְאִשְׁתּוֹ
  choice: at sa asawa niya
  rationale: Tuwirang ipinapahayag ng hulaping panlalaki sa אִשָּׁה ang diwang 'kanyang asawa,' at natural ito sa modernong Tagalog.
- source_word: כָּתְנוֹת עוֹר
  choice: mga kasuotang yari sa balat
  rationale: Ang כֻּתֹּנֶת ay kasuotang pantakip sa katawan, samantalang ang עוֹר ay balat o hide; hindi labis na tinutukoy ang eksaktong estilo o proseso ng materyal.
- source_word: וַיַּעַשׂ
  choice: At gumawa
  rationale: Ang עשה ay karaniwang pandiwang 'gumawa'; pinananatili ng 'At' ang pasulong na daloy ng salaysay.
- source_word: וַיַּלְבִּשֵׁם
  choice: at isinuot niya ang mga iyon sa kanila
  rationale: Ipinahihiwatig ng Hiphil ng לבש na pinasuot o dinamitan ang mga tao. Nililinaw ng Tagalog na ang mga kasuotan ang isinuot sa kanila.
theological_decisions:
- issue: Kung ang אָדָם ay pangalang pantangi o pangngalang pambalana
  choice: 'pangngalang pambalana: “ang lalaki”'
  alternative: 'pangalang pantangi: “Adam”'
  rationale: Itinatambal dito ang lalaking tao sa kanyang asawa, kaya nananatiling natural ang pambalanang pagbasa. Gayunman, tunay na posible rin sa Hebreo ang pagbasa bilang pangalang Adam, kaya hindi ito ikinukubli at inilalagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “kasuotan” bilang likas at malawak na katawagan, habang ang mas tiyak na “tunika” ay nasa talababa. Inilagay ang bawat pananda ng talababa kaagad pagkatapos ng pariralang tinutukoy nito.
