base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/002.yaml
  text: And the woman said to the serpent[a], “We may eat from the fruit of the trees of the garden,”
translation:
  language: tl
  text: At sinabi ng babae sa ahas, “Maaari naming kainin ang bunga ng mga puno sa hardin.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mula sa bunga ng puno sa hardin ay makakakain kami.” Dito, kolektibo ang diwa ng “puno,” kaya isinaling “mga puno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; pinananatili ng “At sinabi” ang payak na daloy nang hindi dinaragdagan ang ugnayang lohikal.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Tumutukoy ito sa babaeng tauhan, hindi partikular sa papel niya bilang asawa.
- source_word: הַנָּחָשׁ
  choice: ahas
  rationale: Ang נָחָשׁ ay ahas; ito ang natural at dignidad na katumbas sa modernong Tagalog.
- source_word: מִפְּרִי
  choice: ang bunga
  rationale: Bagaman may pang-ukol na מִן (“mula sa”), mas natural sa Tagalog na ang pandiwang “kainin” ay tuwirang sundan ng layong “ang bunga”; nananatili ang diwa ng pagkain mula sa bunga.
- source_word: עֵץ הַגָּן
  choice: ng mga puno sa hardin
  rationale: Morpolohikal na isahan ang עֵץ, ngunit kolektibo o distributibo ang gamit sa konteksto; nililinaw ng maramihan ang pangkalahatang pahintulot nang hindi ipinahihiwatig na iisang puno lamang ang tinutukoy.
- source_word: נֹאכֵל
  choice: Maaari naming kainin
  rationale: Sa konteksto, ipinahahayag ng imperfect na unang panauhang maramihan ang pahintulot, hindi lamang kakayahan o nakagawiang kilos.
theological_decisions:
- issue: Saklaw ng mga punong pinahihintulutang pagkunan ng bunga
  choice: 'Pangkalahatang pahintulot: “ang bunga ng mga puno sa hardin”'
  alternative: “mula sa bunga ng puno sa hardin”
  rationale: Isahan ang עֵץ sa anyo, ngunit kolektibo ang kahulugan sa konteksto ng Genesis 2:16 at ng eksepsiyong susunod sa 3:3. Iniiwasan ng maramihan ang maling pahiwatig na iisang puno lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “Maaari naming” upang malinaw na ipahayag ang pahintulot, at “hardin” bilang karaniwang makabagong salita. Inilagay ang panandang talababa pagkatapos ng sugnay na tinutukoy nito.
