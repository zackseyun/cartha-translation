base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/005.yaml
  text: For God knows that on the day you eat from it[a], your eyes will be opened, and you will be like God, knowing good and evil.
translation:
  language: tl
  text: Sapagkat alam ng Diyos na sa araw na kumain kayo nito, mabubuksan ang inyong mga mata, at magiging tulad kayo ng Diyos[a] at makaaalam kayo ng mabuti at masama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tulad ng mga diyos” o “tulad ng mga nilalang na may pagka-diyos.” Maaaring taglayin ng Hebreong אֱלֹהִים ang mga kahulugang ito sa ilang konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o pangangatwiran ng ahas kaugnay ng naunang sinabi.
- source_word: יֹדֵעַ אֱלֹהִים
  choice: alam ng Diyos
  rationale: Likas na modernong Tagalog para sa Hebreong participle na nagsasaad ng kasalukuyang kaalaman.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng nalalaman ng Diyos.
- source_word: בְּיוֹם
  choice: sa araw na
  rationale: Pinananatili ang Hebreong temporal na idyoma; tumutukoy ito sa panahong mangyari ang pagkain at hindi kinakailangang sa isang 24-oras na araw.
- source_word: אֲכָלְכֶם מִמֶּנּוּ
  choice: kumain kayo mula roon
  rationale: Malinaw at natural sa Tagalog, habang pinananatili ang ideya ng pagkain mula sa tinutukoy na puno o bunga.
- source_word: וְנִפְקְחוּ עֵינֵיכֶם
  choice: mabubuksan ang inyong mga mata
  rationale: Pinananatili ang pasibong anyo at ang metapora ng pagkakaroon ng pagkaunawa o kamalayan.
- source_word: וִהְיִיתֶם
  choice: magiging
  rationale: Likas na ipinahahayag sa Tagalog ang pagpasok sa isang kalagayan.
- source_word: כֵּאלֹהִים
  choice: tulad ... ng Diyos
  rationale: Malamang na iisang Diyos ang tinutukoy sa konteksto, ngunit tunay na posible rin sa Hebreo ang “mga diyos” o “mga nilalang na banal,” kaya inilagay ang mga iyon sa talababa.
- source_word: יֹדְעֵי
  choice: na nakaaalam
  rationale: Inilalarawan nito ang magiging kalagayan ng “kayo” at malinaw na inuugnay ang kaalaman sa paghahambing sa Diyos.
- source_word: טוֹב וָרָע
  choice: mabuti at masama
  rationale: Karaniwan, malinaw, at may sapat na bigat para sa moral at mapagkilatis na saklaw ng parirala.
theological_decisions:
- issue: Ang tinutukoy ng אֱלֹהִים sa כֵּאלֹהִים
  choice: tulad ng Diyos
  alternative: tulad ng mga diyos; tulad ng mga nilalang na banal
  rationale: Paulit-ulit na tumutukoy ang kalapit na konteksto sa iisang Diyos, at ang kaalaman sa mabuti at masama ay iniuugnay sa Diyos sa salaysay. Gayunman, hindi dapat ikubli ang tunay na leksikal na kalabuan, kaya nasa talababa ang ibang posibleng pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “inyong” sa pariralang “inyong mga mata” para sa maayos na biblikal na rehistro, habang nananatiling natural ang “kayo.”
