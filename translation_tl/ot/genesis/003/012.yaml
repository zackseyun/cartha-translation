  rationale: Pinalitan lamang ang “upang makasama ko” ng “upang maging kasama ko” para sa mas malinaw at likas na Tagalog. Hindi binago ang saklaw ng kahulugan, ang mariing “siya ang,” ang pagkakasunod ng mga kilos, o ang pahiwatig ng pagsisisi ng lalaki. Pinanatili ang minarkahang kontekstuwal na dagdag na “bunga,” kasama ng talababa nito.
