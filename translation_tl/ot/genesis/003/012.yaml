  yaml_path: translation/ot/genesis/003/012.yaml
  text: And the man said[a], “The woman whom you gave to be with me—she gave me from the tree, and I ate.”
translation:
  language: tl
  text: At sinabi ng lalaki, “Ang babaeng ibinigay mo upang maging kasama ko—siya ang nagbigay sa akin ng bunga[a] mula sa puno, at kumain ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa puno.” Idinagdag ang “bunga” dahil ito ang ipinahihiwatig na bagay ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם
  choice: ang lalaki
  rationale: Sa konteksto, tumutukoy ito sa indibidwal na lalaking tao, hindi sa sangkatauhan sa pangkalahatan.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Pinananatili nito ang tuwirang katawagan sa Hebreo; bagaman maaari ring mangahulugang “asawa” ang salita sa ibang konteksto, “babae” ang mas eksaktong katumbas dito.
- source_word: אֲשֶׁר נָתַתָּה עִמָּדִי
  choice: ibinigay mo upang makasama ko
  rationale: Likas itong pagpapahayag sa Tagalog ng diwang ang babae ay ibinigay bilang kasama ng lalaki, nang walang idinaragdag na paliwanag.
- source_word: הִוא
  choice: siya ang
  rationale: Ipinakikita ng ayos na ito ang diin ng hiwalay na panghalip sa Hebreo.
- source_word: נָתְנָה לִי
  choice: nagbigay sa akin
  rationale: Tuwirang inilalahad ang naganap na kilos ayon sa daloy ng salaysay.
- source_word: מִן הָעֵץ
  choice: ng bunga mula sa puno
  rationale: Hindi tahasang nasa Hebreo ang “bunga,” ngunit kailangan ang ipinahihiwatig na layon upang maging likas at malinaw sa Tagalog; itinatala ito sa talababa.
- source_word: וָאֹכֵל
  choice: at kumain ako
  rationale: Pinananatili ang payak na pagkakasunod ng mga kilos nang hindi idinaragdag ang sanhi na maaaring ipahiwatig ng “kaya.”
theological_decisions:
- issue: Maaaring ipinapasa ng lalaki ang sisi sa babae at pahiwatig na pati sa Diyos
  choice: Pinanatili ang “ang babaeng ibinigay mo upang makasama ko” nang hindi pinahihina o pinatitindi.
  alternative: ang babaeng ibinigay mo sa akin
  rationale: Taglay ng Hebreo ang tensiyong maaaring naninisi ang lalaki kapuwa sa babae at, sa pahiwatig, sa Diyos; hindi ito dapat lutasin ng salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang em dash upang mapanatili ang diin sa “siya ang,” at iniwasan ang mas interpretatibong “kaya kumain ako.”
