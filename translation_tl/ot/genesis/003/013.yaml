base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/013.yaml
  text: Then Yahweh God said to the woman[a], “What is this you have done?” And the woman said, “The serpent deceived me, and I ate.”
translation:
  language: tl
  text: At sinabi ni Yahweh na Diyos sa babae, “Ano itong ginawa mo?” Sumagot ang babae, “Nilinlang ako ng ahas[a], at kumain ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dinaya ako.” Ang pandiwang Hebreo ay maaaring tumukoy sa panlilinlang o pagliligaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang kasunod na titulong Diyos sa isang natural na pariralang Tagalog.
- source_word: לָאִשָּׁה
  choice: sa babae
  rationale: Ang אִשָּׁה ay maaaring mangahulugang babae o asawa; ang ‘babae’ ang angkop na katawagan sa daloy ng salaysay nang hindi ipinipilit ang kahulugang pang-asawa.
- source_word: מַה זֹּאת עָשִׂית
  choice: Ano itong ginawa mo?
  rationale: Pinananatili nito ang tanong na מַה at ang demonstratibong זֹּאת, habang natural at mariin sa makabagong Tagalog.
- source_word: הַנָּחָשׁ
  choice: ang ahas
  rationale: Ang ‘ahas’ ang malinaw, karaniwan, at kontekstuwal na katumbas sa Tagalog.
- source_word: הִשִּׁיאַנִי
  choice: Nilinlang ako
  rationale: Ipinahahayag ng pandiwa ang panlilinlang o pagliligaw; malinaw at likas sa kasalukuyang Tagalog ang ‘nilinlang ako.’
- source_word: וָאֹכֵל
  choice: at kumain ako
  rationale: Pinananatili ang payak na pagkakasunod ng mga pangyayari at hindi nagdaragdag ng tahasang ugnayang sanhi gaya ng ‘kaya.’
theological_decisions:
- issue: Paglalarawan sa ginawa ng ahas sa babae
  choice: Nilinlang ako ng ahas
  alternative: Dinaya ako ng ahas
  rationale: Tumpak na pinananatili ng ‘nilinlang’ ang moral at salaysay na bigat ng Hebreo nang hindi nagdaragdag ng paliwanag o natatanging doktrinal na pakahulugan.
- issue: Ugnayan ng panlilinlang at pagkain
  choice: at kumain ako
  alternative: kaya kumain ako
  rationale: Hindi ginagawang mas tahasang sanhi ang panlilinlang kaysa sa ipinahihiwatig ng payak na pang-ugnay sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang payak na ayos ng pangungusap at iniwasan ang sinaunang o labis na teknikal na pananalita.
