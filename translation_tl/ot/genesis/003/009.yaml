id: GEN.3.9
reference: Genesis 3:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְרָ֛א יְהוָ֥ה אֱלֹהִ֖ים אֶל הָֽ/אָדָ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ אַיֶּֽ/כָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/009.yaml
  text: Then Yahweh God called to the man and said to him[a], “Where are you?”
translation:
  language: tl
  text: Pagkatapos, tinawag ni Yahweh na Diyos[a] ang lalaki at sinabi sa kanya, “Nasaan ka?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “PANGINOONG Diyos.”
    reason: Ibinibigay ang nakaugaliang salin ng banal na pangalang יְהוָה bilang alternatibo.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Ang Qal wayyiqtol ng קרא ay nagpapatuloy sa salaysay. Likas at sapat ang “tinawag” sa Filipino; hindi kailangang dagdagan ng “nang malakas” o gawing “ipinatawag.”
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Tuwirang pinananatili ng “Yahweh” ang pangalang יְהוָה, at inilalarawan ng “na Diyos” ang kasunod na אֱלֹהִים sa natural na ayos ng Filipino.
- source_word: אֶל־הָאָדָם
  choice: ang lalaki
  rationale: Bagaman maaaring tumukoy ang אָדָם sa tao o sangkatauhan sa ibang konteksto, dito ito ang tiyak na lalaking kinakausap sa hardin. Dahil palipat ang “tinawag” sa Filipino, likas na ginawang tuwirang layon ang tinatawag.
- source_word: וַיֹּאמֶר לוֹ
  choice: at sinabi sa kanya
  rationale: Pinananatili ang tahasang panghalip na לוֹ (“sa kanya”) at ang pagpapatuloy ng salaysay.
- source_word: אַיֶּכָּה
  choice: Nasaan ka?
  rationale: Ito ang tuwiran at likas na salin ng panandang pananong na may hulaping ikalawang panauhang panlalaki; hindi dinaragdagan ng paliwanag tungkol sa layunin ng tanong.
- source_word: וַ
  choice: Pagkatapos
  rationale: Ipinahahayag nito ang sunod-sunod na kilos sa salaysay nang hindi ipinapalagay na ang pang-ugnay ay likas na nagsasaad ng pagsalungat.
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh.” Inilalagay sa talababa ang nakaugaliang pamalit na titulong “PANGINOON” nang hindi ito ipinapalit sa pangunahing teksto.
- issue: Tinutukoy ng הָאָדָם
  choice: ang lalaki
  alternative: ang tao
  rationale: Sa agarang konteksto, isang tiyak na lalaking tauhan ang kinakausap, hindi ang sangkatauhan sa pangkalahatan. Gayunman, kinikilalang mas malawak ang saklaw ng salita sa ibang konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na “sinabi sa kanya” at ang payak na tanong na “Nasaan ka?”; iniwasan ang dagdag na interpretasyon tungkol sa dahilan o tono ng pagtawag ng Diyos.
