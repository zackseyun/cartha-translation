  text: בְּ/זֵעַ֤ת אַפֶּ֨י/ךָ֙ תֹּ֣אכַל לֶ֔חֶם עַ֤ד שֽׁוּבְ/ךָ֙ אֶל הָ֣/אֲדָמָ֔ה כִּ֥י מִמֶּ֖/נָּה לֻקָּ֑חְתָּ כִּֽי עָפָ֣ר אַ֔תָּה וְ/אֶל עָפָ֖ר תָּשֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/019.yaml
  text: By the sweat of your face you will eat bread until you return to the ground[a], because from it you were taken; for you are dust, and to dust you will return.
translation:
  language: tl
  text: Sa pawis ng iyong mukha, kakain ka ng tinapay hanggang sa bumalik ka sa lupa[a], sapagkat mula sa lupa ka kinuha; sapagkat ikaw ay alabok, at sa alabok ka babalik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, sa mas karaniwang idyoma, “Sa pawis ng iyong noo.” Sa Hebreo ay “pawis ng iyong mukha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֵעַת אַפֶּיךָ
  choice: Sa pawis ng iyong mukha
  rationale: Tuwirang pinananatili ang larawang Hebreo na “pawis ng iyong mukha.” Bagaman mas karaniwang idyoma sa Filipino ang “pawis ng iyong noo,” malinaw at natural pa rin ang literal na larawan.
- source_word: תֹּאכַל לֶחֶם
  choice: kakain ka ng tinapay
  rationale: Ang לֶחֶם ay tiyak na “tinapay,” bagaman maaari itong kumatawan sa pagkain sa pangkalahatan. Pinanatili ang kongkretong salita ng Hebreo.
- source_word: עַד שׁוּבְךָ אֶל הָאֲדָמָה
  choice: hanggang sa bumalik ka sa lupa
  rationale: Ang אֲדָמָה ay lupa o ground/soil. Ang “lupa” ay natural sa Filipino at pinananatili ang kaugnayan sa pinagmulan ng tao.
- source_word: כִּי מִמֶּנָּה לֻקָּחְתָּ
  choice: sapagkat mula rito ka kinuha
  rationale: Ipinakikita ng pambabaeng panghalip na ang tinutukoy ay ang אֲדָמָה. Ang “rito” ay natural na tumutukoy sa naunang “lupa,” at ang balintiyak na “kinuha” ay tumutugma sa Pual.
- source_word: כִּי
  choice: sapagkat
  rationale: Parehong gamit ng כִּי ay nagpapakilala ng paliwanag o dahilan. Ang “sapagkat” ay malinaw, marangal, at hindi lipas sa makabagong Filipino.
- source_word: עָפָר
  choice: alabok
  rationale: Ang “alabok” ang tuwiran at tradisyonal na katumbas dito, at pinananatili nito ang matinding larawan ng marupok at mortal na kalagayan ng tao.
- source_word: תָּשׁוּב
  choice: babalik ka
  rationale: Ipinahahayag ng imperfect ang tiyak na kahihinatnang inihayag. Natural sa Filipino ang panghinaharap na “babalik ka.”
theological_decisions:
- issue: Pagiging mortal ng tao at ang materyal niyang pinagmulan
  choice: Inilalarawan ang pisikal na pagbabalik ng tao sa lupa o alabok na pinagmulan niya.
  alternative: Basahin ito pangunahin bilang metapora ng pagpapakababa o kahihiyan.
  rationale: Mahigpit na pinag-uugnay ng konteksto at ng mga salitang אֲדָמָה at עָפָר ang pinagmulan ng tao at ang kamatayan niya. Hindi dinaragdagan ng salin ang pahayag ng mga doktrinang hindi tahasang nasa talata.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang pag-uulit ng “sapagkat” at “alabok” upang maingatan ang diin at takbo ng Hebreo; iniwasan ang mas lumang “ikaw ay magbabalik.”
