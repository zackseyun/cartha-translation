  text: וַ/יִּקְרָ֧א הָֽ/אָדָ֛ם שֵׁ֥ם אִשְׁתּ֖/וֹ חַוָּ֑ה כִּ֛י הִ֥וא הָֽיְתָ֖ה אֵ֥ם כָּל חָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/020.yaml
  text: And the man called his wife's name Eve[b][a], because she was the mother of all the living.
translation:
  language: tl
  text: Pinangalanan ng lalaki[a] ang kanyang asawa na Eva[b], sapagkat siya ang ina ng lahat ng nabubuhay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pinangalanan ni Adan ang kanyang asawa.” Sa Hebreo ay “ang lalaki” (ha’adam), na may tiyak na pantukoy.
    reason: alternative_reading
  - marker: b
    text: Ang pangalang Hebreo na Havvah (Eva) ay kaugnay sa tunog ng salitang Hebreo na nangangahulugang “nabubuhay.”
    reason: wordplay
  - marker: c
    text: 'O, “ina ng lahat ng may buhay” o “ina ng bawat nabubuhay.” Literal sa Hebreo: “ina ng lahat ng nabubuhay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Pinangalanan
  rationale: Sa pormulang ito, ang Qal wayyiqtol ng קרא ay tumutukoy sa pagbibigay ng pangalan. Mas natural sa makabagong Tagalog ang “pinangalanan” kaysa sa literal na “tinawag ang pangalan.”
- source_word: הָאָדָם
  choice: ang lalaki
  rationale: May tiyak na pantukoy ang אָדָם sa Hebreo, kaya inilalarawan siya rito bilang “ang lalaki,” hindi tahasang ginagamit ang pangalang Adan.
- source_word: אִשְׁתּוֹ
  choice: ang kanyang asawa
  rationale: Sa kontekstong ito, ang אִשָּׁה na may hulaping paari ay tumutukoy sa asawa ng lalaki; ito ang natural at tiyak na katumbas sa Tagalog.
- source_word: חַוָּה
  choice: Eva
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog. Ipinaliliwanag sa talababa ang ugnayang tunog nito sa salitang Hebreo para sa “nabubuhay.”
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinahahayag ang dahilan ng pagbibigay ng pangalan at angkop sa marangal na rehistro.
- source_word: הָיְתָה
  choice: naging
  rationale: Ipinananatili nito ang aspektong nakumpleto ng pandiwang היה sa paliwanag tungkol kay Eva, nang hindi ito tahasang ginagawang pahayag sa hinaharap.
- source_word: אֵם
  choice: ina
  rationale: Ito ang tuwirang katumbas sa kontekstong ang tinutukoy ay pinagmulan ng mga inapo.
- source_word: כָּל חָי
  choice: lahat ng nabubuhay
  rationale: Pinananatili nito ang maikli at malawak na saklaw ng Hebreo nang hindi nililimitahan sa “lahat ng tao” o pinalalawak nang tahasan sa lahat ng nilalang.
theological_decisions:
- issue: Kung ang הָאָדָם ay pangalang “Adan” o paglalarawang “ang lalaki”
  choice: ang lalaki
  alternative: Adan
  rationale: Ang tiyak na pantukoy sa Hebreo ay pumapabor sa paglalarawang “ang lalaki.” Iniiwasan nitong ipasok nang maaga ang pagbasa rito bilang tahasang pangalang pantangi, habang inilalahad sa talababa ang posibleng tradisyonal na pagbasa.
- issue: Ang saklaw ng “ina ng lahat ng nabubuhay”
  choice: Panatilihin ang malawak na pananalitang “lahat ng nabubuhay”
  alternative: ina ng lahat ng taong nabubuhay / ina ng lahat ng may buhay
  rationale: Hindi tahasang nililinaw ng maikling pariralang Hebreo ang buong saklaw nito. Pinananatili ng salin ang tunay na kaluwagan ng kahulugan sa halip na paliitin o palawakin ito ayon sa isang interpretasyon.
- issue: Ang ugnayan ng pangalang חַוָּה sa חָי
  choice: Panatilihin ang nakaugaliang pangalang “Eva” at ilahad ang paglalaro sa tunog sa talababa
  alternative: Gumamit ng transliterasyong Hava upang higit na makita ang pagkakahawig sa salitang Hebreo
  rationale: Ang “Eva” ang malinaw at kinikilalang anyo sa Tagalog, ngunit natatakpan nito ang ugnayang tunog sa Hebreo. Naipababatid ng talababa ang mahalagang ugnayang iyon nang hindi gumagamit ng di-pamilyar na pangalan sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang natural na pormulang “Pinangalanan … na Eva” sa halip na gayahin ang sintaks na Hebreo. Pinanatili ang “sapagkat” para sa bahagyang pormal at angkop-sa-Kasulatang himig, at iniwasang paliitin ang saklaw ng “lahat ng nabubuhay.”
