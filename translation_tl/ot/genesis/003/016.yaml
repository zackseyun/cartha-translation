source:
  edition: WLC
  text: אֶֽל הָ/אִשָּׁ֣ה אָמַ֗ר הַרְבָּ֤ה אַרְבֶּה֙ עִצְּבוֹנֵ֣/ךְ וְ/הֵֽרֹנֵ֔/ךְ בְּ/עֶ֖צֶב תֵּֽלְדִ֣י בָנִ֑ים וְ/אֶל אִישֵׁ/ךְ֙ תְּשׁ֣וּקָתֵ֔/ךְ וְ/ה֖וּא יִמְשָׁל בָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/016.yaml
  text: To the woman he said[a], “I will greatly multiply your pain and your conception; in pain you will bear children. Your desire will be for your husband[c][b], and he will rule over you.”
translation:
  language: tl
  text: Sinabi niya sa babae, “Labis kong pararamihin ang iyong hirap at ang iyong paglilihi[a]; sa hirap ay manganganak ka ng mga anak[b]. Ang pagnanasa mo ay para sa iyong asawa[c], at mamamahala siya sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iyong pagbubuntis.” Ang salitang Hebreo ay maaaring tumukoy sa paglilihi o pagbubuntis.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak na lalaki”; malamang na tumutukoy rito sa mga anak o supling sa pangkalahatan.
    reason: lexical_alternative
  - marker: c
    text: O “pananabik.” Malawak ang maaaring diwa ng bihirang salitang Hebreo. Itinuturing ito ng ilan na hangaring mangibabaw (ihambing sa Gen. 4:7), ngunit inuunawa naman ng iba bilang relational o seksuwal na pananabik.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: sa babae
  rationale: Sa tagpong ito, ang babae bilang tao ang kinakausap; hindi kailangang gawing ‘asawang babae,’ bagaman malinaw na ‘asawa’ ang kaugnayan sa kasunod na אִישֵׁךְ.
- source_word: הַרְבָּה אַרְבֶּה
  choice: Labis kong pararamihin
  rationale: Pinananatili nito ang mariing diwa ng infinitive absolute na kasama ng finite verb, sa natural na Filipino.
- source_word: עִצְּבוֹנֵךְ וְהֵרֹנֵךְ
  choice: ang hirap ng iyong pagdadalang-tao
  rationale: Ang dalawang terminong Hebreo ay masinsin at may ilang posibleng ugnayan. Ang pariralang Filipino ay natural at iniuugnay ang hirap sa paglilihi/pagbubuntis nang hindi nililimitahan iyon sa sandali ng panganganak.
- source_word: בְּעֶצֶב
  choice: sa hirap
  rationale: Ang עֶצֶב ay maaaring tumukoy sa sakit, hirap, o pagdurusa. Ang ‘sa hirap’ ay malawak ngunit malinaw sa konteksto ng panganganak.
- source_word: תֵּלְדִי בָנִים
  choice: manganganak ka ng mga anak
  rationale: Bagaman literal na ‘mga anak na lalaki’ ang בָנִים, karaniwan itong tumutukoy sa mga anak o supling sa pangkalahatan.
- source_word: אִישֵׁךְ
  choice: iyong asawa
  rationale: Sa ugnayan nito sa babae rito, natural na nangangahulugang ‘asawa’ ang אִישׁ.
- source_word: תְּשׁוּקָתֵךְ
  choice: Ang pagnanasa mo ay mauukol sa
  rationale: Bihira at pinagtatalunan ang salita. Ang ‘pagnanasa’ ay nagpapanatili ng kalabuan kung ito ay pananabik na seksuwal, emosyonal o relational, o hangaring mangibabaw.
- source_word: יִמְשָׁל בָּךְ
  choice: pamamahalaan ka niya
  rationale: Tuwirang ipinahahayag ng pandiwa ang pamamahala. Hindi ginamit ang mas mabigat at interpretibong ‘paghaharian’ o ‘sisiilin.’
theological_decisions:
- issue: Kahulugan ng pagnanasa ng babae sa kanyang asawa
  choice: Pinanatili ang malawak na ‘pagnanasa’ nang hindi tinutukoy ang tiyak na uri nito.
  alternative: Pananabik na seksuwal; relational na pananabik o pagdepende; hangaring kontrolin ang asawa, kaugnay ng Genesis 4:7.
  rationale: Bihira ang תְּשׁוּקָה at hindi sapat ang konteksto upang tiyakin ang iisang pakahulugan. Ang tala ang naglalahad ng mga pangunahing posibilidad.
- issue: Kung ang pamamahala ng lalaki ay utos o paglalarawan
  choice: 'Isinalin bilang pahayag ng mangyayari: ‘pamamahalaan ka niya.’'
  alternative: Isang di-tuwirang utos o pagtatatag ng pamumuno ng lalaki.
  rationale: Ang anyong pandiwa sa Hebreo ay nagsasaad ng mangyayari at hindi, sa sarili nito, ng nararapat mangyari.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘hirap’ upang mapanatili ang mas malawak na saklaw ng עִצָּבוֹן/עֶצֶב, at mga talababa upang hindi ikubli ang tunay na leksikal at interpretibong kalabuan.
