  naturalness: Natural at marangal ang rebisyon sa modernong Filipino. Bagaman medyo pormal ang “iyong paglilihi,” ito ang pinakamalinaw na paraan upang mapanatili ang natatanging terminong Hebreo; ipinaliliwanag ng talababa ang mas natural ding alternatibong “pagbubuntis.”
  terminology: Pinanatili ang “babae,” “asawa,” “pagnanasa,” at “mamamahala ... sa iyo.” Hindi tinutukoy ng “pagnanasa” ang isang partikular na interpretasyon, at ang “mamamahala” ay nagsasaad ng inilalarawang mangyayari nang hindi ginagawa itong utos.
