id: GEN.3.7
reference: Genesis 3:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תִּפָּקַ֨חְנָה֙ עֵינֵ֣י שְׁנֵי/הֶ֔ם וַ/יֵּ֣דְע֔וּ כִּ֥י עֵֽירֻמִּ֖ם הֵ֑ם וַֽ/יִּתְפְּרוּ֙ עֲלֵ֣ה תְאֵנָ֔ה וַ/יַּעֲשׂ֥וּ לָ/הֶ֖ם חֲגֹרֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/007.yaml
  text: Then the eyes of both of them were opened[a], and they knew that they were naked[b]. So they sewed fig leaves together and made coverings for themselves.
translation:
  language: tl
  text: At nabuksan ang mga mata nilang dalawa, at nalaman nilang hubad sila. Kaya nagtahi sila ng mga dahon ng igos at gumawa ng mga pantakip para sa kanilang sarili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tapis” o “mga bahag” para sa “mga pantakip.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפָּקַחְנָה
  choice: nabuksan
  rationale: Pinananatili ang pasibong diwa at idyomang Hebreo tungkol sa mga mata nang hindi ipinapaliwanag kung anong uri ng bagong pagkaunawa ang naganap.
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: ang mga mata nilang dalawa
  rationale: Tuwirang ipinahahayag na kapwa sila saklaw, sa natural na ayos ng makabagong Tagalog.
- source_word: וַיֵּדְעוּ
  choice: nalaman nila
  rationale: Ang ידע ay nangangahulugang ‘malaman’ o ‘makilala’; ang ‘nalaman’ ay natural sa konteksto at hindi nagdaragdag ng tahasang kahihiyan o konsensiyang wala sa teksto.
- source_word: עֵירֻמִּם
  choice: hubad
  rationale: Ito ang tuwiran at karaniwang katumbas, at pinananatili ang ugnayan sa Genesis 2:25.
- source_word: וַיִּתְפְּרוּ
  choice: nagtahi sila
  rationale: Natural at tuwirang inilalarawan ang isinagawang pagdurugtong sa mga dahon.
- source_word: עֲלֵה תְאֵנָה
  choice: mga dahon ng igos
  rationale: Karaniwan at malinaw na katumbas ng pariralang konstruktong Hebreo.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: gumawa ... para sa kanilang sarili
  rationale: Pinananatili ang tahasang diwa ng sariling paglalaan na ipinahahayag ng לָהֶם.
- source_word: חֲגֹרֹת
  choice: mga pantakip
  rationale: Ipinahahayag ang gamit ng bagay na ibinigkis sa katawan nang hindi labis na tinutukoy ang eksaktong anyo nito.
theological_decisions:
- issue: Ugnayan ng nabuksang mga mata sa kahihiyan at kamalayang moral
  choice: Inilalarawan lamang na nabuksan ang kanilang mga mata at nalaman nilang hubad sila.
  alternative: Idagdag na nahiya sila o nagising ang kanilang konsensiya.
  rationale: Maaaring ipahiwatig ng salaysay ang kahihiyan at nagbagong pagkilala sa sarili, ngunit hindi iyon tahasang sinasabi sa talata.
- issue: Eksaktong anyo ng חֲגֹרֹת
  choice: mga pantakip
  alternative: mga tapis, bahag, o epron
  rationale: Ang salita ay tumutukoy sa mga bagay na ibinigkis sa katawan, ngunit hindi ganap na tiyak ang eksaktong anyo; iniiwasan ng salin ang labis na pagtutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘At’ at ‘Kaya’ upang mapanatili ang daloy ng magkakasunod na kilos sa Hebreo. Inilagay ang talababa sa mismong pariralang may leksikal na alternatibo.
