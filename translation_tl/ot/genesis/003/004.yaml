translation:
  language: tl
  text: Ngunit sinabi ng ahas sa babae, “Tiyak na hindi kayo mamamatay.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, ang infinitive absolute na kasama ng pandiwa ay isang mariing konstruksyon. Saklaw ito ng “hindi,” kaya ipinahihiwatig nito ang tiyak at tahasang pagtanggi: “Tiyak na hindi kayo mamamatay.”'
    reason: Ipinaliliwanag ang mariing Hebreong infinitive absolute + finite verb na nasa ilalim ng negasyon, nang hindi nagmumungkahi ng di-eksaktong literal na ayos sa Tagalog.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit dahil tuwirang sinasalungat ng ahas ang naunang babala ng Diyos, likas at angkop sa konteksto ang panandang pasalungat na “Ngunit.”
- source_word: הַנָּחָשׁ
  choice: ang ahas
  rationale: Ang נָחָשׁ ay tumutukoy sa ahas; ito ang karaniwan, malinaw, at dignified na katawagan sa modernong Tagalog.
- source_word: הָאִשָּׁה
  choice: sa babae
  rationale: Maaaring mangahulugan ang אִשָּׁה na “babae” o “asawa,” ngunit “babae” ang nagpapanatili sa paulit-ulit na katawagan ng salaysay bago siya pangalanang Eva.
- source_word: לֹא מוֹת תְּמֻתוּן
  choice: Tiyak na hindi kayo mamamatay
  rationale: Ang infinitive absolute na מוֹת kasama ng finite verb na תְּמֻתוּן ay nagbibigay-diin sa katiyakan ng pahayag, at nilalagay ng לֹא ang buong pahayag sa tahasang pagtanggi. Iniiwasan ng ayos na ito ang malabong “Hindi tiyak na mamamatay,” na maaaring mangahulugang hindi lamang sigurado. Pinananatili rin ng “kayo” ang pangmaramihang ikalawang panauhan ng Hebreo.
theological_decisions:
- issue: Lakas ng pagtanggi ng ahas
  choice: “Tiyak na hindi kayo mamamatay.”
  alternative: “Hindi kayo mamamatay” o “Hindi tiyak na mamamatay kayo.”
  rationale: Tuwirang sinasalungat ng ahas ang naunang babala. Pinananatili ng napiling salin ang mariing pagtanggi nang hindi ipinapaliwanag kung agaran o kalaunan ang tinutukoy na kamatayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “kayo” upang maipakita ang pangmaramihang anyo ng pandiwa sa Hebreo, at iniwasan ang ayos na maaaring magpalabo sa tiyak na pagtanggi ng ahas.
