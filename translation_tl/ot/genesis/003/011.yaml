  yaml_path: translation/ot/genesis/003/011.yaml
  text: And he said[b][a], “Who told you that you were naked? Have you eaten from the tree from which I commanded you not to eat?”
translation:
  language: tl
  text: At sinabi niya, “Sino ang nagsabi sa iyo na hubad ka? Kumain ka ba[a] mula sa puno na iniutos ko sa iyo na huwag kang kumain mula rito[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang "kumain" ay aspektong naganap sa Tagalog. Ang Hebreong perfect sa tanong na ito ay tumutukoy sa isang naganap na pagkilos.
    reason: lexical_alternative
  - marker: b
    text: Literal, “mula rito.” Pinanatili ang ugnayang ito sa salin sa halip na idagdag ang salitang “bunga,” na hindi tahasang nasa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi nagdaragdag ng tahasang paksa na wala sa talata.
- source_word: מִי הִגִּיד לְךָ
  choice: Sino ang nagsabi sa iyo
  rationale: Likas at tuwirang salin ng tanong; ang Hiphil ng נגד ay karaniwang nangangahulugang ‘magsabi’ o ‘magpabatid.’
- source_word: כִּי עֵירֹם אָתָּה
  choice: na hubad ka
  rationale: Ang ‘hubad’ ang malinaw at karaniwang katumbas ng עֵירֹם, at ang ‘ka’ ay likas na naghahatid sa Tagalog ng panghalip at panaguring pang-uri.
- source_word: הֲמִן הָעֵץ ... אָכָלְתָּ
  choice: Kumain ka ba mula sa puno
  rationale: Ang ‘ba’ ay malinaw na naghahatid ng tanong na masasagot ng oo o hindi; ang aspektong naganap na ‘kumain’ ay angkop sa Qal perfect sa kontekstong ito.
- source_word: אֲשֶׁר צִוִּיתִיךָ
  choice: na iniutos ko sa iyo
  rationale: Inihahatid ang sugnay na panlarawan at ang tuwirang pagtukoy sa taong inutusan. Sa pinagsamang pangungusap, likas itong pinaikli bilang ‘iniutos kong.’
- source_word: לְבִלְתִּי אֲכָל מִמֶּנּוּ
  choice: huwag kang kumain mula roon
  rationale: Pinananatili ang pagbabawal at ang literal na ugnayang ‘mula roon’ nang hindi idinaragdag ang salitang ‘bunga,’ na hindi tahasang nasa Hebreo.
theological_decisions:
- issue: Pagkilala sa nagsasalitang paksa ng pandiwang panlalaking isahan
  choice: ‘niya,’ nang hindi inuulit ang ‘PANGINOONG Diyos’
  alternative: ‘At sinabi ng PANGINOONG Diyos’
  rationale: Walang tahasang pangngalang paksa sa Hebreo ng talatang ito. Diyos ang tinutukoy ayon sa naunang konteksto, ngunit pinananatili ng salin ang panghalip upang hindi magdagdag ng pangalang hindi muling binanggit sa mismong sugnay.
- issue: Bagay na kinain mula sa puno
  choice: Hindi idinagdag ang ‘bunga’; ginamit ang ‘kumain mula roon’
  alternative: ‘kinain mo ba ang bunga ng puno’
  rationale: Bagaman bunga ang nauunawaan sa konteksto, ang talata ay literal na nagsasabing kumain ‘mula sa’ puno. Pinananatili nito ang anyo ng pinagmulan nang hindi nagpapasok ng salitang wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ‘puno’ sa halip na mas makalumang ‘punongkahoy.’ Ang bahagyang pag-uulit ng ‘mula’ ay sadyang pinanatili upang maipakita ang Hebreong מִן at מִמֶּנּוּ at maiwasang sabihing ang mismong puno ang kinain.
