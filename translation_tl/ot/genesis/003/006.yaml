  text: וַ/תֵּ֣רֶא הָֽ/אִשָּׁ֡ה כִּ֣י טוֹב֩ הָ/עֵ֨ץ לְ/מַאֲכָ֜ל וְ/כִ֧י תַֽאֲוָה ה֣וּא לָ/עֵינַ֗יִם וְ/נֶחְמָ֤ד הָ/עֵץ֙ לְ/הַשְׂכִּ֔יל וַ/תִּקַּ֥ח מִ/פִּרְי֖/וֹ וַ/תֹּאכַ֑ל וַ/תִּתֵּ֧ן גַּם לְ/אִישָׁ֛/הּ עִמָּ֖/הּ וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/006.yaml
  text: So the woman saw that the tree was good for food[a], and that it was a delight to the eyes, and that the tree was desirable to make one wise. So she took from its fruit and ate, and she also gave some to her husband, who was with her[b], and he ate.
translation:
  language: tl
  text: Nakita ng babae na ang puno ay mabuti para sa pagkain, kaaya-aya sa paningin, at kanais-nais upang magbigay ng karunungan.[a] Kaya kumuha siya ng bunga nito at kumain. Ibinigay rin niya ang ilan nito sa kaniyang asawang lalaki, na kasama niya, at kumain siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kanais-nais upang maging marunong” o “kanais-nais upang magkaroon ng pang-unawa.” Maaaring tumukoy ang Hebreo sa pagpaparunong o sa pagtatamo ng karunungan o pang-unawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Nakita
  rationale: Pinananatili ang payak na diwa ng pandiwa ng pagkakita nang hindi nagdaragdag ng interpretasyon.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Tuwirang katumbas ng katawagang ginamit sa salaysay; hindi inuuna ang papel niya bilang asawa.
- source_word: טוֹב ... לְמַאֲכָל
  choice: mabuti para sa pagkain
  rationale: Pinananatili ang paghatol na 'mabuti' at ang pagiging angkop bilang pagkain, nang hindi ito pinatitindi bilang 'masarap.'
- source_word: תַאֲוָה ... לָעֵינַיִם
  choice: kaaya-aya sa paningin
  rationale: Natural na Filipino para sa bagay na nakalulugod o kanais-nais tingnan, nang hindi nilalagyan agad ng negatibong kahulugang moral.
- source_word: וְנֶחְמָד הָעֵץ לְהַשְׂכִּיל
  choice: kanais-nais dahil makapagpaparunong ito
  rationale: Ipinapahayag ang pagiging kanais-nais ng puno at ang posibleng causative na lakas ng Hiphil לְהַשְׂכִּיל, habang inilalagay sa talababa ang kaugnay na alternatibong pagbasa.
- source_word: מִפִּרְיוֹ
  choice: ng bunga nito
  rationale: Natural na Filipino para sa pagkuha mula sa bunga ng puno; ang dami ay hindi tinutukoy ng Hebreo.
- source_word: לְאִישָׁהּ עִמָּהּ
  choice: sa asawa niyang lalaki, na kasama niya
  rationale: Nililinaw na ang אִישָׁהּ ay ang kaniyang asawang lalaki at pinananatili ang tahasang detalyeng עִמָּהּ, 'kasama niya.'
- source_word: וַיֹּאכַל
  choice: at kumain din ito
  rationale: Ang 'ito' ay natural na tumutukoy sa asawa, at ipinahihiwatig ng 'din' ang magkatulad nilang ginawa.
theological_decisions:
- issue: Moral na kulay ng pagtingin ng babae
  choice: Gumamit ng medyo neutral na mga salitang 'mabuti,' 'kaaya-aya,' at 'kanais-nais.'
  alternative: Gumamit ng mga salitang may tahasang negatibong kulay gaya ng 'pinagnasaan' o 'mahalay na pagnanasa.'
  rationale: Positibo ang anyo ng mga salitang Hebreo sa paglalarawan ng kaniyang pagtingin. Hindi dapat paunahan ng salin ang moral na paghatol na ipinakikita ng mas malawak na salaysay.
- issue: Kahulugan ng לְהַשְׂכִּיל
  choice: makapagpaparunong ito
  alternative: upang magkaroon ng karunungan o pang-unawa
  rationale: Maaaring ipahayag ng Hiphil ang pagpaparunong, ngunit maaari ring tumukoy sa pagtatamo o paggamit ng pang-unawa. Pinananatili sa talababa ang saklaw ng kahulugan.
- issue: Presensiya ng asawa
  choice: na kasama niya
  alternative: sa asawa niya na kasama niya
  rationale: Tahasan sa Hebreo ang עִמָּהּ. Hindi tinatanggal ang mahalagang detalyeng ito at hindi rin ipinapaliwanag kung gaano katagal o sa anong eksaktong paraan siyang naroon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'asawa niyang lalaki' upang maging tiyak ang kasarian ng tinutukoy nang hindi nagiging arkaiko. Iniwasan ang 'masarap' at iba pang salitang higit ang ipinahahayag kaysa sa Hebreo.
