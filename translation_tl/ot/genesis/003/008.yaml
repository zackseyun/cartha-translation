id: GEN.3.8
reference: Genesis 3:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֞וּ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהִ֛ים מִתְהַלֵּ֥ךְ בַּ/גָּ֖ן לְ/ר֣וּחַ הַ/יּ֑וֹם וַ/יִּתְחַבֵּ֨א הָֽ/אָדָ֜ם וְ/אִשְׁתּ֗/וֹ מִ/פְּנֵי֙ יְהוָ֣ה אֱלֹהִ֔ים בְּ/ת֖וֹךְ עֵ֥ץ הַ/גָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/008.yaml
  text: And they heard the sound of Yahweh God walking in the garden in the breeze of the day[c][b][a], and the man and his wife hid themselves from the presence of Yahweh God among the trees of the garden.
translation:
  language: tl
  text: At narinig nila ang tunog[a] ni Yahweh na Diyos habang naglalakad siya sa hardin sa simoy ng araw[b], at nagtago ang lalaki[c] at ang kanyang asawa mula sa presensiya ni Yahweh na Diyos, sa gitna ng mga puno sa hardin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinig ni Yahweh na Diyos.” Ang salitang Hebreo ay maaaring mangahulugang “tunog” o “tinig.”
    reason: lexical_alternative
  - marker: b
    text: O “sa malamig na bahagi ng araw.” Sa literal, “sa simoy/hangin ng araw.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “ang lalaki”; maaari ring isalin na “Adan.”
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: tunog
  rationale: Maaaring tumukoy ang salitang Hebreo sa tinig o sa mas malawak na tunog. Pinananatili ng “tunog” ang kalabuan at hindi ipinapalagay na nagsalita ang Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Kasunod ng Yahweh, bumubuo ito ng katawagang “Yahweh na Diyos,” na malinaw at natural sa Filipino.
- source_word: מִתְהַלֵּךְ
  choice: naglalakad
  rationale: Pinananatili nito ang kongkretong paglalarawan sa pagkilos ng Diyos nang hindi ito pinapahina o ipinapaliwanag nang alegoriko.
- source_word: בַּגָּן
  choice: sa hardin
  rationale: Tuwirang katumbas ng karaniwang gamit ng pang-ukol at natural sa modernong Filipino.
- source_word: לְרוּחַ הַיּוֹם
  choice: sa simoy ng araw
  rationale: Ipinananatili ang larawan ng רוּחַ bilang hangin o simoy at iniiwasang gawing tiyak ang ipinahihiwatig lamang na malamig na bahagi ng araw.
- source_word: הָאָדָם
  choice: ang lalaki
  rationale: Sa kontekstong binabanggit ang kanyang asawa, pangunahing tumutukoy ito sa partikular na lalaki, habang inilalagay sa talababa ang posibleng pangalang “Adan.”
- source_word: וְאִשְׁתּוֹ
  choice: at ang kanyang asawa
  rationale: Tuwiran at natural na paglilipat ng parirala sa Filipino.
- source_word: מִפְּנֵי
  choice: mula sa harapan ni
  rationale: Pinananatili nito ang relasyonal at panlugar na diwa ng literal na “mula sa mukha/presensiya ng,” bagaman bahagyang pormal ang parirala sa Filipino.
- source_word: בְּתוֹךְ עֵץ הַגָּן
  choice: sa gitna ng mga puno sa hardin
  rationale: Bagaman anyong isahan ang עֵץ, maaari itong gamitin bilang kolektibo; hinihingi rin ng konteksto ang mga puno bilang taguan.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa Diyos na naglalakad sa hardin
  choice: Pinanatili ang kongkretong “naglalakad siya.”
  alternative: “Kumikilos sa hardin” o paglalarawan lamang sa presensiya ng Diyos.
  rationale: Matingkad at kongkreto ang Hebreo. Hindi dapat pahinain, gawing alegoriko, o sistematikong ipaliwanag ng salin ang teolohikal na tensiyon.
- issue: Paglilipat ng הָאָדָם
  choice: ang lalaki
  alternative: “ang tao” o “Adan”
  rationale: Maaaring taglayin ng salita ang indibidwal at kumakatawang diwa. Dahil sa agarang pariralang “ang kanyang asawa,” mas angkop dito ang “ang lalaki,” habang kinikilala sa talababa ang “Adan.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pangalang “Yahweh,” ang konkretong larawang “naglalakad,” at ang bahagyang pormal na “mula sa harapan” upang huwag mawala ang diwa ng presensiya sa Hebreo. Ang “sa simoy ng araw” ay sadyang source-transparent at bahagyang patula; nililinaw sa talababa ang tradisyonal na alternatibo.
