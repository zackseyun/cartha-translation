source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֣ה אֱלֹהִ֗ים הֵ֤ן הָֽ/אָדָם֙ הָיָה֙ כְּ/אַחַ֣ד מִמֶּ֔/נּוּ לָ/דַ֖עַת ט֣וֹב וָ/רָ֑ע וְ/עַתָּ֣ה פֶּן יִשְׁלַ֣ח יָד֗/וֹ וְ/לָקַח֙ גַּ֚ם מֵ/עֵ֣ץ הַֽ/חַיִּ֔ים וְ/אָכַ֖ל וָ/חַ֥י לְ/עֹלָֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/022.yaml
  text: Then Yahweh God said[a], “Behold, the man has become like one of us, knowing good and evil. And now, lest he reach out his hand and also take from the tree of life and eat, and live forever—”
translation:
  language: tl
  text: At sinabi ni Yahweh na Diyos, “Narito, ang tao ay naging tulad ng isa sa atin[a], na nakaaalam ng mabuti at masama. At ngayon, baka iunat niya ang kanyang kamay at kumuha rin mula sa punongkahoy ng buhay, at kumain, at mabuhay magpakailanman—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “gaya ng isa sa atin.” Pinananatili rito ang maramihang “atin” sa Hebreo. Iba-iba ang paliwanag dito: maaaring pananalita tungkol sa kapulungang makalangit, maramihang pananalita ng pagninilay, o pahiwatig ng pagkamarami sa loob ng pagka-Diyos.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at natural na inuugnay ito sa titulong Diyos sa modernong Tagalog.
- source_word: הֵן
  choice: Narito
  rationale: Pinananatili ang pantawag-pansing at maringal na bisa ng Hebreo nang hindi nagiging lipas ang pananalita.
- source_word: הָאָדָם
  choice: ang tao
  rationale: Tumutukoy sa indibiduwal na lalaking binabanggit sa konteksto, habang natural na isinasalin ang parirala sa Tagalog.
- source_word: הָיָה
  choice: ay naging
  rationale: Ipinahahayag ang pagbabagong nagbunga ng kasalukuyang kalagayan pagkatapos ng pagsuway.
- source_word: כְּאַחַד מִמֶּנּוּ
  choice: tulad ng isa sa atin
  rationale: Tuwirang pinananatili ang paghahambing at ang mahiwagang panghalip na maramihan.
- source_word: לָדַעַת טוֹב וָרָע
  choice: sa pagkakilala ng mabuti at masama
  rationale: Inilalarawan kung sa anong diwa naging tulad ng isa sa kanila ang tao, habang pinananatili ang saklaw ng Hebreong ‘makilala/malaman.’
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pagpapatuloy ng pahayag at ang agarang paglipat sa susunod na pangyayari.
- source_word: פֶּן
  choice: baka
  rationale: Natural na Tagalog para sa sugnay na nagpapahayag ng kinatatakutang o pinipigilang maaaring mangyari.
- source_word: יִשְׁלַח יָדוֹ
  choice: iunat niya ang kanyang kamay
  rationale: Pinananatili ang kongkretong larawan ng Hebreong idyoma.
- source_word: וְלָקַח גַּם מֵעֵץ הַחַיִּים
  choice: at kumuha rin mula sa punongkahoy ng buhay
  rationale: Pinananatili ng ‘rin’ ang pandagdag na bisa ng גַּם at malinaw na ang kukunin ay mula sa puno.
- source_word: עֵץ הַחַיִּים
  choice: punongkahoy ng buhay
  rationale: Maringal ngunit madaling maunawaang salin ng tradisyonal na katawagan.
- source_word: וָחַי לְעֹלָם
  choice: at mabuhay magpakailanman
  rationale: Tuwirang inilalahad ang walang-hanggang pagpapatuloy ng buhay at pinananatili ang di-natapos na pangungusap.
theological_decisions:
- issue: Maramihang panghalip sa ‘tulad ng isa sa atin’
  choice: Panatilihin ang ‘atin’ nang walang paliwanag sa pangunahing teksto.
  alternative: Ipaliwanag ito bilang kapulungang makalangit, maramihang deliberasyon, o pahiwatig ng pagkamaramihan sa loob ng Diyos.
  rationale: Malinaw na maramihan ang anyo sa Hebreo, ngunit hindi nito tahasang nilulutas kung sino ang tinutukoy. Dapat manatili ang teolohikal na tensiyon.
- issue: Biglang pagkaputol ng pahayag ng Diyos
  choice: Tapusin sa mahabang gitling pagkatapos ng ‘magpakailanman—’.
  alternative: Buuin ang ipinahihiwatig na kasunod na sugnay o tapusin nang walang tandang nagpapakita ng pagkaputol.
  rationale: Hindi ganap ang sintaktikong pahayag sa Hebreo bago magpatuloy ang salaysay sa susunod na talata; iniiwasan ng gitling ang pagdaragdag ng wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang ‘Yahweh’ bilang personal na pangalan ng Diyos, ‘Narito’ para sa solemneng pantawag-pansin, at ‘punongkahoy’ upang mapanatili ang dignidad ng salaysay. Pinanatili ang maramihang ‘atin’ at ang biglang putol na wakas nang hindi nilulutas o pinupunan ang mga ito.
