revisions:
- from: At sinabi ni Yahweh na Diyos, “Narito, ang tao ay naging tulad ng isa sa atin[a] sa pagkakilala ng mabuti at masama. At ngayon, baka iunat niya ang kanyang kamay at kumuha rin mula sa punongkahoy ng buhay, at kumain, at mabuhay magpakailanman—”
  to: At sinabi ni Yahweh na Diyos, “Narito, ang tao ay naging tulad ng isa sa atin[a], na nakaaalam ng mabuti at masama. At ngayon, baka iunat niya ang kanyang kamay at kumuha rin mula sa punongkahoy ng buhay, at kumain, at mabuhay magpakailanman—”
  rationale: Pinalitan ang hindi gaanong idiomatikong “sa pagkakilala ng mabuti at masama” ng “na nakaaalam ng mabuti at masama,” na malinaw na nagpapahayag ng resultang kalagayang ipinahihiwatig ng Hebreo. Inayos din ang isang parirala sa talababa para sa natural na Tagalog, nang hindi nilulutas ang sinadyang maramihang panghalip o nagpapataw ng isang doktrinal na pagbasa.
