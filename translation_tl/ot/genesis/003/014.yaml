  text: וַ/יֹּאמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים אֶֽל הַ/נָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִ/כָּל הַ/בְּהֵמָ֔ה וּ/מִ/כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה עַל גְּחֹנְ/ךָ֣ תֵלֵ֔ךְ וְ/עָפָ֥ר תֹּאכַ֖ל כָּל יְמֵ֥י חַיֶּֽי/ךָ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/014.yaml
  text: Then Yahweh God said to the serpent[a], “Because you have done this, cursed are you above all livestock and above every beast of the field. On your belly you shall go[b], and dust you shall eat all the days of your life.”
translation:
  language: tl
  text: 'At sinabi ni Yahweh na Diyos sa ahas[a],


    “Dahil ginawa mo ito,


    higit kang isinumpa kaysa sa lahat ng alagang hayop


    at kaysa sa lahat ng maiilap na hayop sa parang.


    Sa iyong tiyan ka gagapang,


    at alikabok ang kakainin mo[b]


    sa lahat ng araw ng iyong buhay.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin bilang “serpiyente.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kumain ng alikabok” ay maaari ring maging larawan ng matinding pagkahamak at pagkatalo, hindi lamang paglalarawan ng literal na pagkain.
    reason: cultural_note
lexical_decisions:
- source_word: יְהֹוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Pinananatili ang personal na pangalang יהוה at ang kasunod na titulong אֱלֹהִים, sa likas na ayos ng modernong Tagalog.
- source_word: הַנָּחָשׁ
  choice: ahas
  rationale: Karaniwan, malinaw, at tumpak na katawagan sa Tagalog; hindi nito ipinapasok sa talata ang isang pagkakakilanlang mula sa mga susunod na tekstong teolohikal.
- source_word: כִּי עָשִׂיתָ זֹּאת
  choice: Dahil ginawa mo ito
  rationale: Malinaw na ipinahahayag ang sanhi ng hatol at likas ang parirala sa modernong Tagalog.
- source_word: אָרוּר אַתָּה מִכָּל
  choice: isinumpa ka nang higit sa lahat
  rationale: Inilalarawan ang paghahambing na ipinahihiwatig ng מִן habang pinananatili ang diin ng pangungusap sa sumpa.
- source_word: הַבְּהֵמָה
  choice: mga alagang hayop
  rationale: Tumutukoy sa mga domestikadong hayop at malinaw na ipinag-iiba sa kasunod na mga hayop sa parang.
- source_word: חַיַּת הַשָּׂדֶה
  choice: mga mababangis na hayop sa parang
  rationale: Ipinahahayag ang mga di-inamong hayop na nasa lupain o parang, taliwas sa mga alagang hayop.
- source_word: עַל גְּחֹנְךָ תֵלֵךְ
  choice: Sa tiyan mo ikaw ay gagalaw
  rationale: Hindi ginawang tahasang ‘gagapang’ ang payak na pandiwang הלך (‘humayo/gumalaw’), ngunit malinaw na pinananatili ang paraang ‘sa tiyan.’
- source_word: וְעָפָר תֹּאכַל
  choice: at alikabok ang kakainin mo
  rationale: Pinananatili ang matingkad na larawan at ang pag-una sa ‘alikabok’ nang hindi nagpapasiya kung literal lamang o patalinghaga ang pahayag.
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: sa lahat ng araw ng iyong buhay
  rationale: Malapit sa buong anyo at maringal na indayog ng Hebreo.
theological_decisions:
- issue: Pagkakakilanlan ng ahas
  choice: Tuwirang tinutukoy bilang ‘ahas’ sa pangunahing teksto.
  alternative: Kilalanin ito bilang si Satanas sa mismong salin.
  rationale: Ang talata mismo ay nakikipag-usap sa ahas. Hindi ipinapasok sa salin ang pagkakaugnay na hayagang lumilitaw sa mga susunod na teksto.
- issue: Kahulugan ng pagkain ng alikabok
  choice: Panatilihin ang konkretong larawan at banggitin sa talababa ang posibleng pahiwatig ng pagkahamak at pagkatalo.
  alternative: Isalin lamang bilang ‘lubos kang hahamakin’ o ituring lamang bilang literal na pagkain.
  rationale: Maaaring gumana ang parirala bilang konkretong paglalarawan at bilang larawan ng pagkapahiya; hindi dapat tahimik na alisin ang alinman sa mga posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na maringal ngunit madaling maunawaan. Ginamit ang ‘Yahweh’ bilang transliterasyon ng banal na pangalan, ang karaniwang ‘ahas’ sa pangunahing teksto, at bahagyang patulang paghahanay upang mapanatili ang solemneng himig ng hatol.
