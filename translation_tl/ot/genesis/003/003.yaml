  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מִ/פְּרִ֣י הָ/עֵץ֮ אֲשֶׁ֣ר בְּ/תוֹךְ הַ/גָּן֒ אָמַ֣ר אֱלֹהִ֗ים לֹ֤א תֹֽאכְלוּ֙ מִמֶּ֔/נּוּ וְ/לֹ֥א תִגְּע֖וּ בּ֑/וֹ פֶּן תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/003.yaml
  text: But from the fruit of the tree that is in the middle of the garden[a], God said, ‘You shall not eat from it, and you shall not touch it, lest you die.’
translation:
  language: tl
  text: Ngunit tungkol sa bunga ng punong nasa gitna ng hardin[a], sinabi ng Diyos, “Huwag kayong kumain nito, at huwag ninyo itong hipuin, baka mamatay kayo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nasa loob ng hardin.”
    reason: Ipinakikita ang alternatibong pagsasalin ng בְּתוֹךְ, na maaaring tumukoy sa loob o gitnang bahagi.
lexical_decisions:
- source_word: וּמִפְּרִי
  choice: Ngunit tungkol sa bunga
  rationale: Ipinahahayag ng וּ ang pagsalungat sa naunang sinabi, kaya ang “Ngunit” ay angkop. Ginagawang natural ng “tungkol sa bunga” ang panimulang pariralang may מִן sa Filipino habang pinananatili ang bunga bilang paksa ng iniulat na utos.
- source_word: הָעֵץ
  choice: ng puno
  rationale: Payak at likas na katumbas ng tiyak na pangngalang Hebreo; malinaw na tumutukoy sa partikular na punong binabanggit.
- source_word: אֲשֶׁר בְּתוֹךְ הַגָּן
  choice: nasa gitna ng hardin
  rationale: Ang בְּתוֹךְ ay tumutukoy sa loob o gitnang bahagi. Ang “nasa gitna ng hardin” ay malinaw at natural sa modernong Filipino.
- source_word: אָמַר אֱלֹהִים
  choice: sinabi ng Diyos
  rationale: Iniulat ng anyong qatal ang naunang pagsasalita ng Diyos; ang pangnagdaang “sinabi” ang natural na salin.
- source_word: לֹא תֹאכְלוּ מִמֶּנּוּ
  choice: Huwag kayong kumain nito
  rationale: Ang “Huwag kayong” ay likas na anyo ng pagbabawal sa Filipino at pinananatili ang maramihang kausap. Ang “kumain nito” ay mas natural kaysa sa literal na “kumain mula rito” ngunit tumpak na itinuturo ang bunga bilang bagay na hindi dapat kainin.
- source_word: וְלֹא תִגְּעוּ בוֹ
  choice: at huwag ninyo itong hipuin
  rationale: Pinananatili ng “at” ang idinagdag na pagbabawal. Ang “hipuin” ay isang malinaw at marangal na katumbas ng נגע na angkop sa kasalukuyang Filipino.
- source_word: פֶּן תְּמֻתוּן
  choice: baka mamatay kayo
  rationale: Ipinahahayag ng פֶּן ang kinatatakutang o iniiwasang bunga, hindi isang payak na tiyak na pahayag. Pinananatili ng “baka” ang modal na puwersang ito.
theological_decisions:
- issue: Ang iniulat na pananalita ng babae ay nagdaragdag ng “at huwag ninyo itong hipuin,” na wala sa pagkakasabi ng utos sa Genesis 2:17.
  choice: Isinalin nang tahasan ang dagdag na pagbabawal ayon sa tekstong Hebreo ng talatang ito.
  alternative: Alisin o palambutin ang pagbabawal upang iayon sa Genesis 2:17.
  rationale: Dapat panatilihin ang pagkakaiba ng iniulat na pananalita at ng naunang utos, kasama ang kaakibat nitong salaysay at teolohikal na tensiyon, sa halip na pagtugmain ang mga ito.
- issue: Ang פֶּן ay maaaring unawain bilang pag-iingat o bunga ng pagsuway.
  choice: baka mamatay kayo
  alternative: kung hindi ay mamamatay kayo
  rationale: Mas maingat na pinananatili ng “baka” ang modal na puwersa ng פֶּן at hindi ginagawang mas tiyak kaysa sa anyo ng iniulat na pananalita.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang maramihang “kayo/ninyo” upang tumpak na katawanin ang mga anyong pangmaramihan sa Hebreo. Iniwasan ang sobrang literal na pariralang hindi likas sa Filipino, ngunit pinanatili ang ayos, diin, at modal na diwa ng pinagmulan.
