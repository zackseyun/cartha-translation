  text: וְ/הַ/מַּ֗יִם גָּֽבְר֛וּ מְאֹ֥ד מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/יְכֻסּ֗וּ כָּל הֶֽ/הָרִים֙ הַ/גְּבֹהִ֔ים אֲשֶׁר תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/019.yaml
  text: And the waters prevailed exceedingly over the earth[b][a], and all the high mountains under all the heavens were covered.
translation:
  language: tl
  text: Labis na labis na nanaig ang tubig sa ibabaw ng lupa[a], at natakpan ang lahat ng matataas na bundok sa ilalim ng buong kalangitan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lupain.” Ang Hebreong אֶרֶץ ay maaaring mangahulugang “lupa” o “lupain,” ayon sa pagkaunawa sa lawak ng baha sa konteksto.
    reason: alternative_reading
  - marker: b
    text: Sa mas literal na anyo, “sa ilalim ng lahat ng kalangitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְרוּ
  choice: nanaig
  rationale: Ipinapanatili ng “nanaig” ang larawan ng tubig na naging makapangyarihan at dumaig sa lupa; mas malapit ito sa lakas ng pandiwa kaysa sa payak na “tumaas.”
- source_word: מְאֹד מְאֹד
  choice: labis na labis
  rationale: Ang pag-uulit ay tuwirang naghahayag ng matinding pagpapalakas at natural pa ring pakinggan sa makabagong Filipino.
- source_word: עַל הָאָרֶץ
  choice: sa ibabaw ng lupa
  rationale: Tumpak na ipinapahayag ng “sa ibabaw ng” ang עַל. Pinananatili ng “lupa” ang maaaring kahulugang earth o land ng אֶרֶץ nang hindi agad nilulutas ang lawak ng baha.
- source_word: וַיְכֻסּוּ
  choice: at natakpan
  rationale: Ang anyong pasibo ay malinaw at natural sa Filipino at itinatampok ang naging kalagayan ng mga bundok.
- source_word: כָּל הֶהָרִים הַגְּבֹהִים
  choice: ang lahat ng matataas na bundok
  rationale: Tuwirang pinananatili ang kabuuang saklaw, pangngalan, at panuring ng Hebreo.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: sa ilalim ng buong kalangitan
  rationale: Ito ang natural na Filipino para sa Hebreong pangkalahatang pahayag; ang kolektibong “kalangitan” ay hindi nangangailangang gawing maramihan upang maipahayag ang saklaw.
theological_decisions:
- issue: Lawak ng אֶרֶץ sa salaysay ng baha
  choice: lupa
  alternative: lupain
  rationale: Ang “lupa” ay kaayon ng malawak na pananalita ng talata ngunit nananatiling may kakayahang tumukoy sa earth o land. Hindi nito ipinapasok sa salin ang isang makabagong siyentipikong paliwanag o nilulutas ang usapin nang lampas sa sinasabi ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding pag-uulit sa “labis na labis,” ang larawan ng pananaig ng tubig, at ang tunay na kalabuan ng אֶרֶץ.
