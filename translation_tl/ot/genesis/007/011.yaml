  source_fidelity: 'Tumpak na naisasalin ang pormula ng petsa ayon sa edad ni Noe, ang ikalawang buwan at ikalabimpitong araw, at ang mariing pagtukoy sa araw na iyon. Napananatili rin ang dalawang magkatambal na pangyayaring nasa Hebreo: ang pagbuka ng lahat ng bukal ng dakilang/malawak na kalaliman at ang pagbukas ng mga bintana ng kalangitan. Hindi nito isinasamoderno o ipinapaliwanag ang sinaunang kosmikong larawan.'
  naturalness: Likas, malinaw, at marangal ang modernong Filipino. Ang paggamit ng dash sa “sa mismong araw na iyon” ay epektibong naghihiwalay at nagbibigay-diin sa pormula ng petsa nang hindi nagiging mabigat ang pangungusap.
  terminology: Ang “Noe,” “bukal,” “kalaliman,” at “mga bintana ng kalangitan” ay angkop at pare-pareho ang rehistro. Ang “malawak na kalaliman” ay isang katanggap-tanggap na pagsasalin ng תְּהוֹם רַבָּה na pinananatili ang lawak at kosmikong imahen. Ang mga talababa ay wastong nakaugnay sa mga salitang binibigyan nila ng alternatibo.
