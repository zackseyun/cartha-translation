language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שֵׁשׁ מֵא֤וֹת שָׁנָה֙ לְ/חַיֵּי נֹ֔חַ בַּ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָֽה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ בַּ/יּ֣וֹם הַ/זֶּ֗ה נִבְקְעוּ֙ כָּֽל מַעְיְנֹת֙ תְּה֣וֹם רַבָּ֔ה וַ/אֲרֻבֹּ֥ת הַ/שָּׁמַ֖יִם נִפְתָּֽחוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/011.yaml
  text: In the six hundredth year of Noah’s life[a], in the second month, on the seventeenth day of the month, on that day all the springs of the great deep burst open[b], and the windows of the heavens were opened.
translation:
  language: tl
  text: Sa ikaanimnaraang taon ng buhay ni Noe, sa ikalawang buwan, sa ikalabimpitong araw ng buwan—sa mismong araw na iyon—bumuka ang lahat ng bukal[a] ng malawak na kalaliman, at nabuksan ang mga bintana ng kalangitan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga pinagmumulan ng tubig.”
    reason: lexical_alternative
  - marker: b
    text: O, “mga lagusan ng kalangitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שֵׁשׁ מֵאוֹת שָׁנָה לְחַיֵּי נֹחַ
  choice: Sa ikaanimnaraang taon ng buhay ni Noe
  rationale: Pinananatili ang pormulang Hebreo na nagtatakda ng petsa ayon sa haba ng buhay ni Noe, habang gumagamit ng likas na ayos sa Filipino.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: sa ikalawang buwan
  rationale: Tuwirang katumbas at likas na pahayag ng petsa sa Filipino.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: sa ikalabimpitong araw ng buwan
  rationale: Ang kardinal na anyo sa Hebreo ay gumaganap bilang ordinal na petsa; ganito ito likas na ipinapahayag sa Filipino.
- source_word: בַּיּוֹם הַזֶּה
  choice: sa mismong araw na iyon
  rationale: Ipinapakita ng “mismo” ang diin ng Hebreong parirala at malinaw na tumutukoy sa araw na kababanggit lamang.
- source_word: נִבְקְעוּ
  choice: bumuka
  rationale: Ipinahihiwatig ng Nifal ng בקע ang pagkabiyak o pagkapunit upang bumukas. Ang “bumuka” ay malinaw at natural sa Filipino nang hindi pinapahina ang marahas na larawan.
- source_word: כָּל מַעְיְנֹת
  choice: lahat ng bukal
  rationale: Karaniwang tumutukoy ang מַעְיָן sa bukal o pinagmumulan ng tubig. Ang “bukal” ang pinakamaikli at pinakanatural na katumbas.
- source_word: תְּהוֹם רַבָּה
  choice: malawak na kalaliman
  rationale: Pinananatili ng “kalaliman” ang larawan ng malalim at sinaunang katubigan, samantalang ipinapahayag ng “malawak” ang tindi o lawak ng רַבָּה nang hindi ginagawang makabagong siyentipikong paglalarawan.
- source_word: וַאֲרֻבֹּת הַשָּׁמַיִם
  choice: at ang mga bintana ng kalangitan
  rationale: Pinananatili ng “mga bintana” ang kongkretong larawan ng mga bukasan sa itaas. Ang “kalangitan” ay natural na katumbas ng שָׁמַיִם sa kontekstong ito.
- source_word: נִפְתָּחוּ
  choice: nabuksan
  rationale: Tumpak na sinasalamin ng anyong balintiyak ang Nifal na pandiwa at ang kaparis nitong paglalarawan sa unang sugnay.
theological_decisions:
- issue: Kosmikong larawan ng pinagmulan ng tubig-baha
  choice: Panatilihin ang “malawak na kalaliman” at “mga bintana ng kalangitan” bilang mga larawan ng teksto.
  alternative: Ipaliwanag ang mga ito bilang “mga tubig sa ilalim ng lupa” at “mga lagusan ng ulan sa himpapawid.”
  rationale: Hindi inilalarawan ng salin ang talata ayon sa makabagong agham ni nilulutas ang sinaunang kosmikong larawan nito. Pinananatili nito ang sariling wika at teolohikong puwersa ng salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na pormula ng petsa at ang kosmikong larawan ng Hebreo, ngunit iniwasan ang labis na arkaikong mga salita.
