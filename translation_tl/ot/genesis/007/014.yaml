base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/014.yaml
  text: they[a], and every wild animal according to its kind, and every livestock animal according to its kind, and every creeping thing that creeps on the earth according to its kind[b], and every bird according to its kind—every winged bird.
translation:
  language: tl
  text: sila, kasama ang bawat ligaw na hayop ayon sa uri nito, bawat hayop na inaalagaan ayon sa uri nito, bawat nilalang na gumagapang sa lupa ayon sa uri nito, at bawat ibon ayon sa uri nito—bawat ibong may pakpak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵמָּה
  choice: sila
  rationale: Panghalip na panlalaking maramihan na tumutukoy kay Noe at sa mga kasama niyang pumasok sa arka; natural itong dugtong sa naunang talata.
- source_word: הַחַיָּה
  choice: mabangis na hayop
  rationale: Pinananatili ang pagkakaiba nito sa בְּהֵמָה sa pag-uuri ng mga hayop sa Genesis; tumutukoy ito sa mga hayop na hindi inaalagaan.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: ayon sa uri nito
  rationale: Malinaw at likas na salin ng pormulang pangklasipikasyon na inuulit sa talata.
- source_word: הַבְּהֵמָה
  choice: alagang hayop
  rationale: Tumutukoy sa mga domestikadong hayop at pinananatili ang kaibahan sa mababangis na hayop nang hindi nililimitahan sa baka lamang.
- source_word: הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: gumagapang na nilalang na gumagapang sa ibabaw ng lupa
  rationale: Pinananatili ang pag-uulit ng ugat sa Hebreo at ang larawan ng maliliit na nilalang na kumikilos sa lupa.
- source_word: הָעוֹף
  choice: ibon
  rationale: Bagaman maaaring mas malawak ang kahulugan bilang lumilipad na nilalang, nililinaw ng kasunod na parirala na mga ibon ang tinutukoy rito.
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: bawat ibong may pakpak
  rationale: Likas na Filipino na nagpapahayag sa idiomatikong Hebreong apposition, literal na ‘bawat ibon, bawat pakpak,’ nang hindi lumilikha ng di-natural na pag-uulit.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang serye ng mga uri at ang paulit-ulit na ‘ayon sa uri nito.’ Ginamit ang ‘kasama ang’ upang maging natural ang sintaks sapagkat ang talata ay nagpapatuloy mula sa naunang pangungusap.
