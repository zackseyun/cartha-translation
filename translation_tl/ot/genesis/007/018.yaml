translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Pinanatiling magkahiwalay ang dalawang pandiwa para sa paglakas at pagdami ng tubig, at iniwasang gawing tiyak ang saklaw ng אֶרֶץ o ang eksaktong paraan ng pagkilos ng arka.
