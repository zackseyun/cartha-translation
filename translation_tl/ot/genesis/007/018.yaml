translation:
  language: tl
  text: Lumakas ang tubig at lubhang dumami sa ibabaw ng lupa, at gumalaw ang arka sa ibabaw ng tubig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lumutang sa ibabaw ng tubig.” Sa literal, “pumunta sa ibabaw ng tubig”; inilalarawan ng idyomang Hebreo ang pagkilos sa ibabaw ng tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: lalong lumakas
  rationale: Ipinahahayag ng גבר ang paglakas o pangingibabaw. Ang “lalong lumakas” ay natural sa Filipino at pinananatili ang diwa ng tumitinding puwersa ng tubig.
- source_word: הַמַּיִם
  choice: ang tubig
  rationale: Bagaman anyong maramihan ang salitang Hebreo, karaniwang pangngalang di-mabilang ang “tubig” sa Filipino at ito ang pinakanatural na katumbas.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: dumami nang husto
  rationale: Pinananatili nito ang hiwalay na ideya ng matinding pagdami sa רבה na pinalakas ng מְאֹד, nang hindi ito isinasama lamang sa naunang pandiwa.
- source_word: עַל הָאָרֶץ
  choice: sa ibabaw ng lupa
  rationale: Maaaring tumukoy ang אֶרֶץ sa lupa o daigdig. Ang “lupa” ay natural dito at hindi nagpapasya nang higit sa saklaw na tahasang sinasabi ng talata.
- source_word: וַתֵּלֶךְ
  choice: gumalaw
  rationale: Literal na “pumunta” ang הלך, ngunit kapag arka ang simuno sa tubig, malinaw at natural ang “gumalaw” habang hindi tinutukoy nang labis kung paano ito kumilos.
- source_word: הַתֵּבָה
  choice: ang arka
  rationale: Ang “arka” ang nakagawiang at malinaw na katawagan sa sasakyang ginawa ni Noe.
- source_word: עַל פְּנֵי הַמָּיִם
  choice: sa ibabaw ng tubig
  rationale: Ang literal na “sa mukha ng tubig” ay isang idyoma para sa ibabaw nito; malinaw at likas sa modernong Filipino ang napiling parirala.
