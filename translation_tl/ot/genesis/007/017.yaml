  text: And the flood was on the earth forty days[a], and the waters increased and lifted up the ark, so that it rose above the earth.
translation:
  language: tl
  text: Ang baha ay tumagal sa lupa nang apatnapung araw,[a] at dumami ang tubig at iniangat ang arka, kaya umangat ito nang higit sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At ang baha ay nasa lupa nang apatnapung araw.” Maaaring isalin nang mas pormal ang idyomang Hebreo gamit ang “ay nasa,” ngunit mas malinaw na ipinahahayag ng “tumagal” ang tagal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nanatili
  rationale: Sa kasunod na panahong “apatnapung araw,” ipinahihiwatig ng pandiwa ang tagal ng baha. Likas sa Tagalog ang “nanatili” at mas malinaw ito kaysa sa literal na “nangyari” o “ay.”
- source_word: הַמַּבּוּל
  choice: ang baha
  rationale: Karaniwan, malinaw, at angkop na tawag sa natatanging baha sa salaysay ni Noe.
- source_word: אַרְבָּעִים יוֹם
  choice: nang apatnapung araw
  rationale: Ipinapahayag ng “nang” ang tagal na likas na nauunawaan sa Hebreo bagaman walang tahasang pang-ukol doon.
- source_word: עַל הָאָרֶץ
  choice: sa ibabaw ng lupa
  rationale: Tumpak na inilalarawan ang baha na nasa ibabaw ng אֶרֶץ; pinananatili ng “lupa” ang maaaring saklaw na lupain o daigdig nang hindi ito labis na nilulutas.
- source_word: וַיִּרְבּוּ הַמַּיִם
  choice: dumami ang tubig
  rationale: Ang רבה ay tumutukoy sa pagdami o paglaki ng dami at lawak; natural sa Tagalog ang “dumami ang tubig.”
- source_word: וַיִּשְׂאוּ אֶת הַתֵּבָה
  choice: itinaas ang arka
  rationale: Inilalarawan ang tubig bilang siyang nag-angat sa arka; malinaw na naipahahayag ng “itinaas” ang pisikal na kilos.
- source_word: הַתֵּבָה
  choice: ang arka
  rationale: Ito ang nakasanayan at tiyak na katawagan sa sasakyang ginawa ni Noe.
- source_word: וַתָּרָם
  choice: umangat ito
  rationale: Ang anyong pambabae sa Hebreo ay tumutukoy sa arka. Ang intransitibong “umangat” ay natural na nagsasaad ng resulta ng pagtaas dito ng tubig.
- source_word: מֵעַל הָאָרֶץ
  choice: mula sa lupa
  rationale: Ang מֵעַל ay maaaring magpahayag ng paglayo paitaas mula sa ibabaw. Sa konteksto, malinaw na ipinahihiwatig na ang arka ay naiangat mula sa lupa.
