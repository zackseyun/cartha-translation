- from: Nanatili sa ibabaw ng lupa ang baha nang apatnapung araw,[a] at dumami ang tubig at itinaas ang arka, kaya umangat ito mula sa lupa.
  to: Ang baha ay tumagal sa lupa nang apatnapung araw,[a] at dumami ang tubig at iniangat ang arka, kaya umangat ito nang higit sa lupa.
  rationale: Pinalitan ang “nanatili” ng “tumagal” upang maipahayag nang natural ang Hebreong pandiwa kasama ng pariralang panahon nang hindi nagdaragdag ng ideyang leksikal. Nilinaw rin ang huling parirala upang maipakita na ang arka ay naiangat nang higit sa lupa, ayon sa resulta ng kilos ng tubig.
