translation_notes:
  register: Makabago at marangal na Filipino; payak ang ayos at bokabularyo. Ginamit ang “arka” bilang nakasanayang terminong biblikal, at iniwasang gawing tiyak kung ang אֶרֶץ ay “lupain” o ang buong “daigdig.”
