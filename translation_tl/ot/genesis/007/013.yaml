  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
translation:
  language: tl
  text: Noong mismong araw na iyon, pumasok[a] sa daong si Noe kasama sina Sem, Ham, at Jafet na mga anak niya, ang asawa niya, at ang tatlong asawa ng kanyang mga anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dumating sa daong.” Ang pandiwang Hebreo ay literal na “dumating,” ngunit sa kontekstong ito ay tumutukoy sa pagpasok.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Nang mismong araw na iyon
  rationale: Ipinahahayag ng idyomang Hebreo ang diin at katiyakan ng araw; natural itong naipapakita sa modernong Tagalog sa pamamagitan ng “mismong araw na iyon.”
- source_word: בָּא ... אֶל הַתֵּבָה
  choice: pumasok sa daong
  rationale: Ang pandiwa ay karaniwang nangangahulugang “dumating,” ngunit kasama ng pariralang patungo sa daong, tumutukoy ito rito sa pagpasok. Ang “pumasok sa daong” ay malinaw at natural sa Tagalog.
- source_word: נֹחַ
  choice: Noe
  rationale: Ito ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: וְשֵׁם וְחָם וָיֶפֶת בְּנֵי נֹחַ
  choice: kasama sina Sem, Ham, at Jafet na mga anak niya
  rationale: Ginagamit ang “sina” para sa likas na paglilista ng mga pangalan sa Tagalog, habang malinaw na pinananatili ang pagkakakilanlan nila bilang mga anak ni Noe.
- source_word: וְאֵשֶׁת נֹחַ
  choice: ang asawa niya
  rationale: Likas na Tagalog na katumbas ng konstruktong “asawa ni Noe”; malinaw sa pinakamalapit na tinutukoy na si Noe ang panghalip.
- source_word: וּשְׁלֹשֶׁת נְשֵׁי בָנָיו
  choice: at ang tatlong asawa ng kanyang mga anak
  rationale: Tuwirang pinananatili ang bilang at ang ugnayang pampamilya sa malinaw na modernong Tagalog.
- source_word: אִתָּם
  choice: kasama
  rationale: Ang maramihang “kasama nila” sa Hebreo ay isinama sa pambungad na “kasama,” na natural na sumasaklaw sa buong kasunod na talaan at umiiwas sa mabigat na pag-uulit sa Tagalog.
- source_word: הַתֵּבָה
  choice: daong
  rationale: Ang “daong” ay isang dignidad at nakaugaliang salitang Tagalog para sa sasakyang-dagat ni Noe, at naiiba ito sa karaniwang kahulugang “kaban” ng salitang ark.
