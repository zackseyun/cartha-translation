base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/021.yaml
  text: 'And all flesh that moved on the earth died: birds[a], livestock, wild animals, every swarming thing that swarms on the earth, and all mankind.'
translation:
  language: tl
  text: Namatay ang lahat ng nilalang na may laman na gumagalaw sa lupa—ang mga ibon, mga alagang hayop, mga mababangis na hayop, lahat ng maliliit na nilalang na naglipana sa lupa, at ang buong sangkatauhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng tao.” Sa Hebreo, “ang lahat ng adam,” na kolektibong tumutukoy sa lahi ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: Namatay
  rationale: Tuwirang ipinahahayag ng pandiwang גוע ang pagkamatay o pagpanaw. Ang “namatay” ang pinakamalinaw at pinakanatural na katumbas sa makabagong Tagalog.
- source_word: כָּל בָּשָׂר
  choice: lahat ng nilalang na may laman
  rationale: Pinananatili nito ang konkretong idyomang Hebreo na “lahat ng laman,” ngunit nililinaw na mga nilalang ang tinutukoy sa talaan ng buhay na nasa lupa.
- source_word: הָרֹמֵשׂ
  choice: na gumagalaw
  rationale: Malawak ang saklaw ng רמש at kasama rito ang mga ibon at malalaking hayop, kaya hindi ito nilimitahan sa “gumagapang.”
- source_word: עַל הָאָרֶץ
  choice: sa lupa
  rationale: Natural sa Tagalog ang “sa lupa” at angkop kapuwa sa ibabaw ng daigdig at sa tuyong lupa sa konteksto ng salaysay.
- source_word: בָּעוֹף
  choice: ang mga ibon
  rationale: Ang “mga ibon” ang natural at karaniwang katumbas ng עוֹף sa ganitong pag-uuri.
- source_word: וּבַבְּהֵמָה
  choice: mga alagang hayop
  rationale: Sa pagkakatapat nito sa mababangis na hayop, tumutukoy ang בְּהֵמָה sa mga hayop na inaalagaan o domestikado.
- source_word: וּבַחַיָּה
  choice: mga mababangis na hayop
  rationale: Ipinahahayag nito ang mga hayop na hindi domestikado at pinananatili ang kaibahan sa mga alagang hayop.
- source_word: וּבְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: lahat ng maliliit na nilalang na naglipana
  rationale: Ang שֶׁרֶץ ay tumutukoy sa maliliit na nilalang na dumarami, nagkukumpulan, o gumagapang. Ang “naglipana” ay natural na nagpapahiwatig ng sama-samang paggalaw at pagdami nang hindi ito nililimitahan sa mga gumagapang lamang.
- source_word: וְכֹל הָאָדָם
  choice: at ang buong sangkatauhan
  rationale: Kolektibo rito ang אָדָם at tumutukoy sa lahi ng tao, hindi lamang sa mga lalaking indibidwal.
theological_decisions:
- issue: Kolektibong kahulugan ng הָאָדָם
  choice: ang buong sangkatauhan
  alternative: lahat ng tao
  rationale: Ginagamit dito ang אָדָם para sa sangkatauhan bilang kabuuan. Pinananatili ng “buong sangkatauhan” ang kolektibo at maringal na diin nang hindi ito nililimitahan ayon sa kasarian.
- issue: Saklaw ng כָּל בָּשָׂר
  choice: lahat ng nilalang na may laman
  alternative: lahat ng may buhay
  rationale: Hindi ginamit ang “lahat ng may buhay” sapagkat maaari itong magmukhang sumasaklaw sa mga halaman. Pinananatili ng napiling salin ang idyomang tumutukoy sa mga nilalang na may laman na isa-isang binanggit sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal ang rehistro. Ginamit ang em dash upang ipakilala ang mga uring bumubuo sa “lahat ng nilalang na may laman.” Inilagay ang [a] pagkatapos ng “sangkatauhan,” ang salitang talagang tinutukoy ng talababa.
