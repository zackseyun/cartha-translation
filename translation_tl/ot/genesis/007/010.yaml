  text: And after seven days[b][a], the waters of the flood came upon the earth.
translation:
  language: tl
  text: Pagkaraan ng pitong araw, ang tubig ng baha ay nasa ibabaw ng lupa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “daigdig.” Ang salitang Hebreo ay maaaring mangahulugang “lupa,” “lupain,” o “daigdig,” ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: 'Sa mas literal na ayos: “At nangyari, pagkaraan ng pitong araw, at ang tubig ng baha ay nasa ibabaw ng lupa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְשִׁבְעַת הַיָּמִים
  choice: Pagkaraan ng pitong araw
  rationale: Ang וַיְהִי ay nagdurugtong sa kasunod na pangyayari sa salaysay, at ang לְ sa pariralang pamanahon ay tumutukoy sa pagdating sa wakas ng itinakdang pitong araw. Natural itong ipinahahayag sa modernong Tagalog bilang “Pagkaraan ng pitong araw.”
- source_word: וּמֵי הַמַּבּוּל
  choice: ang tubig ng baha
  rationale: Ang מֵי ay anyong construct ng מַיִם at tiyak ang buong parirala dahil sa הַמַּבּוּל. Mas natural sa Tagalog ang pang-isahang kolektibong “tubig” kaysa “mga tubig,” habang malinaw na tinutukoy ng מַבּוּל ang baha sa salaysay ni Noe.
- source_word: הָיוּ עַל
  choice: dumating sa ibabaw ng
  rationale: Literal itong “ay nasa ibabaw ng,” ngunit sa konteksto ay inilalahad ang pagsapit o pag-iral ng tubig-baha sa lupa. Ang “dumating sa ibabaw ng” ay nagpapanatili sa pangyayaring-diwa nang hindi nagdaragdag ng ideya ng pagtakip na hindi tahasang nasa talata.
- source_word: הָאָרֶץ
  choice: lupa
  rationale: Maaaring tumukoy ang אֶרֶץ sa buong daigdig o sa isang lupain. Ang “lupa” ay natural at marangal sa Tagalog at naiiwan ang saklaw na matutukoy ayon sa konteksto; inilalahad sa talababa ang leksikal na alternatibong “daigdig.”
theological_decisions:
- issue: Saklaw ng אֶרֶץ sa salaysay ng baha
  choice: lupa
  alternative: daigdig
  rationale: Hindi likas na nilulutas ng pangngalang Hebreo lamang kung lokal na lupain o buong daigdig ang tinutukoy. Pinili ang “lupa” upang mapanatili ang tunay na leksikal na kalabuan, habang ang “daigdig” ay ibinigay bilang posibleng pagbasa sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “pagkaraan” para sa natural na salaysay at “tubig ng baha” bilang malinaw na kolektibong parirala. Iniwasan ang makalumang “at nangyari” sa pangunahing teksto ngunit pinanatili ito sa talababa para makita ang anyo ng Hebreo.
