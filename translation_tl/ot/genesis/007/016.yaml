base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/016.yaml
  text: And those that entered[a], male and female from all flesh, as God had commanded him[c][b]; and Yahweh shut him in.
translation:
  language: tl
  text: At ang mga pumasok—lalaki at babae mula sa lahat ng may buhay[a]—ay nagsipasok ayon sa iniutos sa kanya ng Diyos; at sinarhan siya ni Yahweh sa loob.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa lahat ng laman,” isang kolektibong pananalita para sa mga nilalang na may buhay.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin, “at nagsara si Yahweh sa likuran niya.” Hindi tahasang binabanggit sa Hebreo ang pinto, bagaman ipinahihiwatig iyon ng konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּאִים ... בָּאוּ
  choice: At ang mga pumasok ... ay pumasok
  rationale: 'Pinananatili ang pag-uulit ng Hebreo: ang substantibong participle na הַבָּאִים ay sinusundan ng pandiwang בָּאוּ. Bagaman may pag-uulit sa Filipino, malinaw at tapat ito sa estruktura ng pinagmulan.'
- source_word: זָכָר וּנְקֵבָה
  choice: lalaki at babae
  rationale: Karaniwang pares ito para sa pagkakaiba ng kasarian at natural na nauunawaan sa Filipino kahit mga hayop ang tinutukoy.
- source_word: מִכָּל בָּשָׂר
  choice: mula sa lahat ng may laman
  rationale: Pinananatili ng “mula” ang puwersa ng preposisyong מִן at ng “may laman” ang kolektibong larawang ipinahahayag ng בָּשָׂר, nang hindi tahasang pinapalitan ng mas interpretibong “bawat uri ng hayop.”
- source_word: כַּאֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִים
  choice: ayon sa iniutos sa kanya ng Diyos
  rationale: Ipinahahayag ng “ayon sa” na ang pagpasok ay alinsunod sa naunang utos ng Diyos; ang “iniutos” ay likas na Filipino para sa aspektong natapos na bago ang kilos sa salaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וַיִּסְגֹּר ... בַּעֲדוֹ
  choice: at isinara siya ni Yahweh sa loob
  rationale: Natural na ipinahahayag nito na si Yahweh ang nagsara upang manatili si Noe sa loob, nang hindi idinaragdag sa pangunahing teksto ang salitang “pinto,” na hindi tahasang binanggit sa Hebreo.
theological_decisions:
- issue: Paglalarawan sa pagkilos ni Yahweh sa pagsasara
  choice: isinara siya ni Yahweh sa loob
  alternative: isinara ni Yahweh ang pinto sa likuran niya
  rationale: Hindi tahasang binabanggit ng Hebreo ang pinto. Pinananatili ng napiling salin ang pagkukusa at pagkilos ni Yahweh nang hindi nagdaragdag ng di-nakasulat na layon.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang יְהוָה sa talata; ang transliterasyong “Yahweh” ay nagpapanatili sa pagkakaiba nito sa titulong אֱלֹהִים, na isinaling “Diyos.”
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang bahagyang pag-uulit ng Hebreo para sa katapatan sa anyo, habang ginamit ang mga gitling upang maging malinaw ang nakasingit na paglalarawan sa mga pumasok.
