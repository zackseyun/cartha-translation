revisions:
- from: At ang mga pumasok—lalaki at babae mula sa lahat ng may laman[a]—ay pumasok ayon sa iniutos sa kanya ng Diyos; at isinara siya ni Yahweh sa loob.[b]
  to: At ang mga pumasok—lalaki at babae mula sa lahat ng may buhay[a]—ay nagsipasok ayon sa iniutos sa kanya ng Diyos; at sinarhan siya ni Yahweh sa loob.[b]
  rationale: Inayos ang dalawang pariralang hindi likas sa Filipino nang hindi binabago ang kahulugan. Ang “nagsipasok” ay nagbibigay ng natural na plural na kilos matapos ang “mga pumasok,” at ang “sinarhan siya ... sa loob” ay tapat na nagsasaad na isinara ni Yahweh si Noe sa loob nang hindi tahasang idinadagdag ang pinto. Iningatan ang ambigwidad ng בַּעֲדוֹ sa pangunahing teksto at sa talababa.
