    rationale: Bagaman sinisikap nitong tularan ang substantibong participle at ang kasunod na pandiwa sa Hebreo, hindi ito likas na daloy sa Filipino. Ang “mga pumasok ... ay nagsipasok” ay mas maayos habang pinananatili ang aspektong plural at ang dalawang antas ng Hebreong pagpapahayag.
