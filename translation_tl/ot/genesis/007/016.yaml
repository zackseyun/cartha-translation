  source_fidelity: 'Ang draft ay wasto sa mahahalagang punto: naipapakita ang pares na “lalaki at babae,” ang kolektibong “lahat ng laman,” ang Diyos/Yahweh na pagkakaiba, at ang di-tahasang layon ng pagsasara. Gayunman, ang “isinara siya ... sa loob” ay hindi idiomatiko at maaaring magmukhang literal na ‘isinara ang tao.’'
  naturalness: Ang “At ang mga pumasok ... ay pumasok” ay mabigat at hindi likas sa makabagong Filipino. Ang “mga pumasok ... ay nagsipasok” ay nagpapanatili ng dalawang pandiwang Hebreo nang mas natural. Ang “sinarhan siya ni Yahweh sa loob” ay natural na nagpapahiwatig ng pagsasarang nagkulong kay Noe sa loob nang hindi nagdaragdag ng ‘pinto.’
  terminology: Ang “Yahweh” at “Diyos” ay angkop at pare-pareho. Pinalitan ang “lahat ng may laman” ng “lahat ng may buhay,” isang likas na Filipino para sa kolektibong Hebreong כָּל־בָּשָׂר; ang literal na “lahat ng laman” ay pinananatili sa talababa.
