source:
  edition: WLC
  text: וַ/יִּ֜מַח אֶֽת כָּל הַ/יְק֣וּם אֲשֶׁ֣ר עַל פְּנֵ֣י הָֽ/אֲדָמָ֗ה מֵ/אָדָ֤ם עַד בְּהֵמָה֙ עַד רֶ֨מֶשׂ֙ וְ/עַד ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יִּמָּח֖וּ מִן הָ/אָ֑רֶץ וַ/יִשָּׁ֧אֶר אַךְ נֹ֛חַ וַֽ/אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָֽה־־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/023.yaml
  text: He blotted out every living thing that was on the face of the ground[a], from man to livestock to creeping things and to the birds of the heavens. They were blotted out from the earth, and only Noah was left[c][b], and those who were with him in the ark.
translation:
  language: tl
  text: Pinawi[a] niya ang lahat ng may buhay na nasa ibabaw ng lupa—mula sa tao[b] hanggang sa mga alagang hayop, sa mga gumagapang na nilalang, at sa mga ibon sa langit[c]. Napawi sila mula sa lupa. Tanging si Noe at ang mga kasama niya sa arka ang natira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binura.” Ang pandiwang Hebreo ay may larawan ng pagpahid o pagbura nang lubusan.
    reason: lexical_alternative
  - marker: b
    text: Ang “tao” rito ay kumakatawan sa buong sangkatauhan; maaari ring isaling “sangkatauhan.”
    reason: lexical_alternative
  - marker: c
    text: O “mga ibon sa kalangitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמַח / וַיִּמָּחוּ
  choice: Pinawi / Napawi
  rationale: Ipinananatili ng “pinawi” ang larawan ng Hebreong מחה na gaya ng pagpahid o pagbura, habang likas pa ring basahin sa Filipino. Ang “napawi” sa ikalawang pangungusap ay sumasalamin sa anyong Niphal.
- source_word: כָּל הַיְקוּם
  choice: lahat ng may buhay
  rationale: Sa konteksto ng baha, tumutukoy ito sa lahat ng nabubuhay sa lupa, hindi sa abstraktong “lahat ng umiiral.”
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: nasa ibabaw ng lupa
  rationale: Natural na Filipino ito para sa Hebreong idyomang “sa ibabaw/mukha ng lupa” at malinaw na inilalarawan ang kinaroroonan ng mga pinawi.
- source_word: מֵאָדָם
  choice: mula sa tao
  rationale: Ang isahang אָדָם ay ginagamit dito bilang kinatawan ng sangkatauhan at panimula sa talaan ng mga uri ng nilalang.
- source_word: בְּהֵמָה
  choice: mga alagang hayop
  rationale: Malinaw at makabagong katumbas ito para sa mga domestikadong hayop, nang hindi nililimitahan sa baka lamang.
- source_word: רֶמֶשׂ
  choice: mga gumagapang na nilalang
  rationale: Saklaw nito ang maliliit na nilalang na gumagalaw nang malapit sa lupa at mas malinaw kaysa sa simpleng “mga gumagapang.”
- source_word: עוֹף הַשָּׁמַיִם
  choice: mga ibon sa langit
  rationale: Pinananatili nito ang karaniwang larawang Hebreo at ang marangal na estilo ng salaysay; maaari ring unawain ang שָׁמַיִם bilang “kalangitan.”
- source_word: מִן הָאָרֶץ
  choice: sa daigdig
  rationale: Dito, ang אֶרֶץ ay tumutukoy sa lupa o daigdig kung saan napawi ang mga nilalang. Ang “sa daigdig” ay natural kasunod ng pandiwang “napawi” at hindi ipinipilit ang isang teknikal na pagbasa sa lawak ng baha.
- source_word: וַיִּשָּׁאֶר אַךְ נֹחַ
  choice: Tanging si Noe … ang natira
  rationale: Malinaw nitong naipapahayag kapwa ang paghihigpit ng אַךְ (“tanging”) at ang kahulugan ng שׁאר (“matira”).
- source_word: וַאֲשֶׁר אִתּוֹ בַּתֵּבָה
  choice: at ang mga kasama niya sa arka
  rationale: Natural na Filipino para sa mga taong at nilalang na kasama ni Noe sa loob ng תֵּבָה; ang “arka” ang nakagawiang katawagan sa salaysay ni Noe.
theological_decisions:
- issue: Lawak ng pagkapawi sa salaysay ng baha
  choice: Tuwirang ilarawan ang pagkapawi sa lahat ng may buhay sa lupa na binanggit ng talata, nang hindi pinahihina o pinalalawak ang pahayag.
  alternative: Basahin ito bilang eksaheradong panrehiyong pananalita, o bilang tahasang pandaigdigang siyentipikong pahayag.
  rationale: Pinananatili ng salin ang lakas at saklaw ng pananalitang Hebreo ngunit hindi nagdaragdag ng paninindigan sa mga pagtatalo tungkol sa heograpikong lawak ng baha.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinawi/napawi” upang mapanatili ang kongkretong larawan ng Hebreo; iniwasan ang sobrang teknikal o makalumang mga salita. Inayos ang huling sugnay bilang “Tanging si Noe at ang mga kasama niya sa arka ang natira” upang maging natural sa Filipino nang hindi binabago ang diwa.
