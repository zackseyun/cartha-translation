  text: וַ/יָּבֹ֥אוּ אֶל נֹ֖חַ אֶל הַ/תֵּבָ֑ה שְׁנַ֤יִם שְׁנַ֨יִם֙ מִ/כָּל הַ/בָּשָׂ֔ר אֲשֶׁר בּ֖/וֹ ר֥וּחַ חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/015.yaml
  text: They came to Noah into the ark[a], two by two from all flesh in which was the breath of life.
translation:
  language: tl
  text: Dumating sila kay Noe at pumasok sa arka, dala-dalawa mula sa lahat ng nilalang na may hininga ng buhay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “espiritu ng buhay.” Ang salitang Hebreo na רוּחַ (ruach) ay maaaring mangahulugang “hininga,” “hangin,” o “espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dumating sila
  rationale: Ang wayyiqtol ng בוא ay nagsasaad ng payak na nakaraang paggalaw. Likas sa Tagalog ang “dumating sila” at napapanatili nito ang paglapit kay Noe.
- source_word: אֶל נֹחַ אֶל הַתֵּבָה
  choice: kay Noe at pumasok sa arka
  rationale: Dalawang pariralang may אֶל ang tumutukoy kay Noe at sa arka bilang hantungan. Nililinaw ng “at pumasok” ang kontekstuwal na pagpasok sa arka nang hindi binabago ang pangunahing kilos.
- source_word: שְׁנַיִם שְׁנַיִם
  choice: dala-dalawa
  rationale: Ang inuulit na bilang ay distributibo at natural na ipinahahayag sa Tagalog bilang “dala-dalawa.”
- source_word: מִכָּל הַבָּשָׂר
  choice: mula sa lahat ng nilalang
  rationale: Sa salaysay ng baha, ang literal na “laman” ay tumutukoy sa kabuuan ng mga nilalang na may buhay. Mas malinaw at likas sa modernong Tagalog ang “lahat ng nilalang,” habang pinananatili ang malawak na saklaw.
- source_word: אֲשֶׁר בּוֹ
  choice: na may
  rationale: 'Ang Hebreong pariralang “na nasa loob nito” ay natural na naihahayag sa Tagalog bilang pag-aari: “na may.”'
- source_word: רוּחַ חַיִּים
  choice: hininga ng buhay
  rationale: Sa konteksto ng mga hayop at buhay na nilalang, ang “hininga ng buhay” ang pinakamalinaw na kahulugan, ngunit nananatiling posible ang “espiritu ng buhay.”
theological_decisions:
- issue: Kahulugan ng רוּחַ sa pariralang רוּחַ חַיִּים
  choice: hininga ng buhay
  alternative: espiritu ng buhay
  rationale: Binibigyang-diin ng konteksto ang buhay na taglay ng mga nilalang, kaya ang “hininga” ang mas angkop. Inilalagay sa talababa ang tunay na leksikal na alternatibo upang hindi lubusang alisin ang ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang biblikal na terminong “arka” at ang natural na distributibong “dala-dalawa.”
