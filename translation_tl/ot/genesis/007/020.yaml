translation:
  language: tl
  text: Tumaas pa nang labinlimang siko ang tubig, at natabunan ang mga bundok.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּבְרוּ הַמָּיִם
  choice: Tumaas ... ang tubig
  rationale: Sa konteksto ng baha, natural na ipinahahayag sa modernong Tagalog ang paglakas o pangingibabaw ng tubig bilang patuloy na pagtaas nito.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה מִלְמַעְלָה
  choice: pa nang labinlimang siko
  rationale: Pinananatili ang sinaunang sukat na 'siko'; ang 'pa' ay malinaw na naghahatid ng diwang pataas o higit pa nang hindi nagdaragdag ng tiyak na puntong panukat na hindi tahasang sinasabi sa Hebreo.
- source_word: וַיְכֻסּוּ הֶהָרִים
  choice: at natabunan ang mga bundok
  rationale: Tuwirang ipinapahayag ang pasibong anyo at ang ganap na pagkakatakip sa mga bundok.
theological_decisions:
- issue: Batayan ng labinlimang siko
  choice: Hindi tahasang tinukoy kung saan sinusukat ang karagdagang taas.
  alternative: Sabihing labinlimang siko sa ibabaw ng pinakamataas na bundok.
  rationale: Bagaman maaaring ipahiwatig ng konteksto na lampas ito sa mga bundok, hindi tahasang binabanggit ng Hebreong parirala ang 'pinakamataas na bundok'; iniiwasang lutasin sa salin ang likas na pagkaikli ng pahayag.
translation_notes:
  register: Natural, maikli, at marangal na modernong Tagalog. Ginamit ang tradisyonal at madaling maunawaang yunit na 'siko' sa halip na tahimik na ikonberte sa modernong sukat.
