base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/001.yaml
  text: Then Yahweh said to Noah, “Enter the ark, you and all your household, because I have seen that you are righteous before me in this generation.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Noe, “Pumasok ka sa arka, ikaw at ang buo mong sambahayan, sapagkat nakita kong matuwid ka sa harapan ko sa salinlahing ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng pangyayari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בֹּא
  choice: Pumasok ka
  rationale: Ang pandiwa ay isang pautos sa isahan na nangangahulugang pumasok o lumapit sa loob; malinaw at natural ang “Pumasok ka” sa konteksto ng arka.
- source_word: בֵּיתְךָ
  choice: buo mong sambahayan
  rationale: Ang “bahay” sa Hebreo ay tumutukoy rito sa sambahayan o mga kasapi nito, hindi sa gusali lamang.
- source_word: הַתֵּבָה
  choice: arka
  rationale: Ito ang kinikilalang katawagan sa sasakyang inilalarawan sa salaysay tungkol kay Noe.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos at ang “sapagkat” ay angkop sa dignidad ng salaysay.
- source_word: רָאִיתִי
  choice: nakita kong
  rationale: Pinananatili nito ang natapos nang pagsusuri ng Diyos na may bisa sa kasalukuyang sitwasyon.
- source_word: צַדִּיק
  choice: matuwid
  rationale: Karaniwan at teolohikal na angkop na salin ito para sa taong itinuturing na naaayon sa pamantayan ng katuwiran.
- source_word: לְפָנַי
  choice: sa harapan ko
  rationale: Pinananatili ang Hebreong idyoma ng pagtataya sa presensya o paningin ng Diyos nang hindi ito labis na ipinapaliwanag.
- source_word: בַּדּוֹר הַזֶּה
  choice: sa salinlahing ito
  rationale: Tumutukoy ito sa kapanahong salinlahi at mga kasabayan ni Noe.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang personal na pangalan; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng pagiging matuwid ni Noe
  choice: nakita kong matuwid ka sa harapan ko
  alternative: ikaw lamang ang nakita kong matuwid; itinuring kitang matuwid
  rationale: Inihahayag ng teksto ang pagtataya ng Diyos kay Noe ngunit hindi sinasabing siya lamang ang matuwid at hindi rin ipinaliliwanag dito ang batayan ng kaniyang katuwiran. Pinananatili ng salin ang teolohikal na tensiyong iyon.
- issue: Bilang ng pautos at saklaw ng sambahayan
  choice: Pumasok ka sa arka, ikaw at ang buo mong sambahayan
  alternative: Pumasok kayo sa arka ng buo mong sambahayan
  rationale: Isahan ang pautos sa Hebreo at si Noe ang tuwirang kinakausap, saka isinama ang buong sambahayan niya. Pinananatili ng salin ang estrukturang ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “sambahayan” upang ipakita ang panlipunang kahulugan ng Hebreong “bahay,” at “salinlahi” upang mapanatili ang biblikal ngunit pangkaraniwang rehistro.
