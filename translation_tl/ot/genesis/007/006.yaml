  text: Noah was six hundred years old[b][a], and the flood was upon the earth.
translation:
  language: tl
  text: Animnaraang taong gulang si Noe, at ang tubig ng baha ay nasa ibabaw ng lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “lupa” ay maaari ring mangahulugang “lupain” o “daigdig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: si Noe
  rationale: Ginamit ang karaniwang anyo ng pangalan sa Filipino. Hindi isinalin nang hiwalay ang unang וְ sapagkat natural nang naiuugnay ang pangungusap sa naunang salaysay sa Filipino.
- source_word: בֶּן שֵׁשׁ מֵאוֹת שָׁנָה
  choice: animnaraang taong gulang
  rationale: Ang literal na idyomang Hebreo na ‘anak ng animnaraang taon’ ay karaniwang pahayag ng edad; ito ang malinaw at likas na katumbas sa Filipino.
- source_word: וְ/הַ/מַּבּוּל
  choice: at ... baha
  rationale: Ang מַבּוּל ay tumutukoy sa natatanging malaking baha sa salaysay. Pinanatili ng ‘at’ ang pagkakaugnay ng dalawang sugnay.
- source_word: הָיָה מַיִם
  choice: nagkaroon ng baha
  rationale: Ang mas literal na ‘ang baha ay naging/naroon bilang tubig’ ay hindi likas sa Filipino. Ipinahahayag ng napiling anyo ang pag-iral ng baha nang hindi dinaragdagan ang teksto ng kilos na gaya ng ‘dumating’ o ‘lumaganap.’
- source_word: עַל הָאָרֶץ
  choice: sa lupa
  rationale: Ang ‘lupa’ ay likas sa Filipino at maaari ring tumukoy sa lupain o sa daigdig ayon sa konteksto, kaya hindi nito isinasara ang tunay na saklaw ng salitang Hebreo.
theological_decisions:
- issue: Saklaw ng הָאָרֶץ
  choice: lupa
  alternative: daigdig o lupain
  rationale: Maaaring mangahulugan ang הָאָרֶץ ng ‘daigdig/earth’ o ‘lupain/land.’ Ang ‘lupa’ ay nagpapanatili ng ganitong kaluwagan sa Filipino sa halip na pasiyahan sa salin ang usapin tungkol sa saklaw ng baha.
translation_notes:
  register: Makabago, payak, at marangal na salaysay. Ginamit ang ‘nagkaroon ng baha’ upang maging natural sa Filipino habang inilalagay sa talababa ang di-karaniwang literal na kayarian at pinananatili ang kalabuan ng ‘lupa.’
