base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/008.yaml
  text: From the clean animals and from the animals that are not clean[a], and from the birds and everything that creeps on the ground—
translation:
  language: tl
  text: Mula sa malilinis na hayop, mula sa mga hayop na hindi malinis[a], mula sa mga ibon, at sa lahat ng gumagapang sa lupa—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maruruming hayop.” Mas literal sa Hebreo, “mga hayop na hindi malinis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: mula sa
  rationale: Ipinahihiwatig ng pang-ukol ang pinagmulan o pagkabilang sa bawat pangkat. Pinanatili ang pag-uulit upang maipakita ang ayos at ritmo ng talaan sa Hebreo.
- source_word: בְּהֵמָה
  choice: hayop
  rationale: Malawak ang saklaw ng salita rito at itinatangi ang pangkat na ito sa mga ibon at gumagapang; hindi lamang mga alagang hayop ang tinutukoy.
- source_word: טְּהוֹרָה
  choice: malinis
  rationale: Ito ang likas at karaniwang salin sa konteksto ng ritwal na pag-uuri sa mga hayop, nang hindi ipinapalagay na pisikal na kalinisan lamang ang tinutukoy.
- source_word: אֲשֶׁר אֵינֶנָּה טְהֹרָה
  choice: na hindi malinis
  rationale: Pinananatili nito ang tahasang negatibong anyo ng Hebreo, sa halip na palitan agad ng iisang salitang kasalungat.
- source_word: עוֹף
  choice: mga ibon
  rationale: Bagaman maaaring mas malawak ang saklaw ng terminong Hebreo sa mga lumilipad na nilalang, 'mga ibon' ang pinakanatural at sapat na tumpak sa kontekstong ito.
- source_word: כֹּל אֲשֶׁר רֹמֵשׂ
  choice: lahat ng gumagapang
  rationale: Naipapahayag nito nang natural sa modernong Tagalog ang uri ng mga nilalang na kumikilos nang paggapang.
- source_word: עַל הָאֲדָמָה
  choice: sa lupa
  rationale: Tumutukoy dito ang אֲדָמָה sa ibabaw ng lupa bilang tirahan o lugar na ginagalawan ng mga gumagapang.
theological_decisions:
- issue: Paglalarawan sa ikalawang uri ng mga hayop
  choice: hindi malinis
  alternative: marumi
  rationale: Ang 'hindi malinis' ay mas tuwirang sumusunod sa analitikong negasyon ng Hebreo at hindi basta nilulutas ang posibleng ritwal na diwa sa mas malakas na salitang 'marumi.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang anyong talaan ng Hebreo at ang bitin na wakas na may gatlang, sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
