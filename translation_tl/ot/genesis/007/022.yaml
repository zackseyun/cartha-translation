lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: ang lahat ng
  rationale: Ipinahahayag nito ang kabuuan ng lahat ng nilalang na tumutugon sa kasunod na paglalarawan, kapwa tao at hayop.
- source_word: נִשְׁמַת רוּחַ חַיִּים
  choice: hininga ng buhay
  rationale: Likas at malinaw itong katumbas sa modernong Tagalog ng tambalang Hebreo tungkol sa hiningang tanda at pinagmumulan ng buhay. Inilalagay sa talababa ang mas literal na anyo upang hindi mawala ang salitang רוּחַ at ang posibleng pagkakaiba ng pagbasa.
- source_word: בְּאַפָּיו
  choice: sa mga butas ng ilong
  rationale: Tahasang pinananatili ang larawan ng Hebreo. Bagaman isahan ang hulaping Hebreo sa diwang pamahagi, hindi kailangang ulitin sa Tagalog ang panghalip na maaaring maging alanganin pagkatapos ng kolektibong “lahat.”
- source_word: מִכֹּל אֲשֶׁר בֶּחָרָבָה
  choice: nasa tuyong lupa
  rationale: Nililinaw nito na ang saklaw ay ang mga nilalang sa lupang hindi natatakpan ng tubig, salungat sa mga nilalang sa tubig.
- source_word: מֵתוּ
  choice: namatay
  rationale: Payak at tuwirang katumbas ito ng pandiwang Hebreo.
theological_decisions:
- issue: Ang ugnayan ng נִשְׁמַת at רוּחַ sa pariralang נִשְׁמַת רוּחַ חַיִּים
  choice: “hininga ng buhay” sa pangunahing teksto, na may mas literal na anyo sa talababa
  alternative: “hininga ng espiritu ng buhay”
  rationale: Maaaring magsanib ang kahulugan ng נִשְׁמַת at רוּחַ bilang hiningang nagbibigay-buhay. Ang lubhang literal na anyo sa pangunahing teksto ay maaaring magpahiwatig sa Tagalog ng isang masalimuot na metapisikang hindi tiyak na ipinahahayag ng Hebreo; pinananatili ng talababa ang tunay na leksikal na tensiyon.
translation_notes:
  register: Makabago, payak, at marangal na Tagalog. Pinanatili ang konkretong larawang “mga butas ng ilong,” habang ginawang natural ang tambalang Hebreo sa pangunahing teksto.
