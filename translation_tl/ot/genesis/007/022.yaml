  text: Everything on the dry land in whose nostrils was the breath of the spirit of life died[a][b].
translation:
  language: tl
  text: Ang lahat ng nasa tuyong lupa na may hininga ng buhay sa mga butas ng ilong ay namatay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “hininga ng espiritu ng buhay.”
