source:
  edition: WLC
  text: גַּ֣ם מֵ/ע֧וֹף הַ/שָּׁמַ֛יִם שִׁבְעָ֥ה שִׁבְעָ֖ה זָכָ֣ר וּ/נְקֵבָ֑ה לְ/חַיּ֥וֹת זֶ֖רַע עַל פְּנֵ֥י כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/003.yaml
  text: Also from the birds of the sky[a], seven and seven, male and female, to keep offspring alive on the face of all the earth.
translation:
  language: tl
  text: Gayundin, mula sa mga ibon sa himpapawid, pito-pito[a], lalaki at babae, upang mapanatiling buhay ang mga supling sa ibabaw ng buong lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pitong pares.” Sa Hebreo, literal itong “pito, pito,” isang distributibong pananalita na maaaring unawaing pito sa bawat uri o pitong pares; mas malapit na pinananatili ng pangunahing teksto ang anyong Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Gayundin
  rationale: Ipinagpapatuloy nito ang utos sa naunang talata at idinaragdag ang mga ibon bilang isa pang pangkat.
- source_word: מֵעוֹף הַשָּׁמַיִם
  choice: mula sa mga ibon sa himpapawid
  rationale: Ang עוֹף ay tumutukoy rito sa mga ibon o lumilipad na nilalang, at ang הַשָּׁמַיִם ay likas na maisasaling “himpapawid” sa kontekstong ito.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: pito-pito
  rationale: Pinananatili nito ang pag-uulit ng bilang sa Hebreo at ang distributibong diwa nang hindi tiyak na nagpapasya kung pitong indibidwal o pitong pares ang tinutukoy.
- source_word: זָכָר וּנְקֵבָה
  choice: lalaki at babae
  rationale: Tuwirang ipinahahayag nito ang pagpapares ayon sa kasarian sa paraang karaniwan at malinaw sa modernong Tagalog.
- source_word: לְחַיּוֹת זֶרַע
  choice: upang mapanatiling buhay ang lahi
  rationale: Ang Hiphil na לְחַיּוֹת ay nagsasaad ng pagpapanatili ng buhay, samantalang ang זֶרַע ay tumutukoy rito sa pagpapatuloy ng supling o lahi, hindi sa literal na binhi.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: sa ibabaw ng buong lupa
  rationale: Pinananatili nito ang kongkretong larawan ng idyomang Hebreo habang nananatiling malinaw sa Tagalog.
theological_decisions:
- issue: Kung ang “pito-pito” ay nangangahulugang pitong indibidwal o pitong pares
  choice: Pinanatili sa pangunahing teksto ang literal at distributibong “pito-pito.”
  alternative: “pitong pares”
  rationale: Hindi ganap na nilulutas ng anyong Hebreo na שִׁבְעָה שִׁבְעָה ang tanong; kaya hindi dapat tahimik na alisin ng salin ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang “pito-pito” ay sadyang nagpapanatili sa anyo at kalabuan ng Hebreo; ang talababa ang nagbibigay ng karaniwang alternatibong pagbasa.
