base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/002.yaml
  text: From every clean animal you shall take for yourself seven pairs[a], a male and its mate; and from the animals that are not clean, two[b], a male and its mate.
translation:
  language: tl
  text: Mula sa bawat malinis na hayop ay kumuha ka para sa iyong sarili ng pitong pares[a]—isang lalaki at ang kapareha nito sa bawat pares; at mula sa mga hayop na hindi malinis ay kumuha ka ng dalawa[b]—isang lalaki at ang kapareha nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pito-pito, isang lalaki at ang kapareha nito.” Malamang na pitong pares ang ibig sabihin, bagaman inuunawa ito ng ilan bilang pitong indibidwal na hayop.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “mga hayop na marumi.” Sinasabi ng Hebreo, “mga hayop na hindi malinis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הַבְּהֵמָה
  choice: Sa bawat ... hayop
  rationale: Ipinapakita ng מִן kasama ng כֹּל ang pagpili mula sa bawat uri o pangkat. Natural sa modernong Tagalog ang “sa bawat ... hayop” at napapanatili nito ang distributibong diwa.
- source_word: הַטְּהוֹרָה
  choice: malinis
  rationale: Ang טָהוֹר ay tumutukoy rito sa pagkakaibang malinis at hindi malinis. Ang “malinis” ay maikli at hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: תִּקַּח לְךָ
  choice: kumuha ka para sa iyong sarili
  rationale: Ang anyong pandiwa ay utos sa kontekstong ito, at ang “para sa iyong sarili” ay tahasang kumakatawan sa לְךָ kahit medyo magaan ang tungkulin nito.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: tigpipitong pares
  rationale: Ang inuulit na bilang ay nagpapahiwatig ng pamamahagi o pagpapangkat. Dahil sinusundan ito ng “lalaki at ang kapareha nito,” pinakamalamang na pitong pares ang ibig sabihin; pinananatili sa talababa ang ibang pagkaunawa.
- source_word: אִישׁ וְאִשְׁתּוֹ
  choice: lalaki at ang kapareha nito
  rationale: Literal itong gumagamit ng mga salitang “lalaki” at “asawa/babae nito,” ngunit sa mga hayop ay idyoma ito para sa magkaparehang kasarian. Iniiwasan ng “kapareha” ang di-angkop na antropomorpikong “asawa.”
- source_word: אֲשֶׁר לֹא טְהֹרָה הִוא
  choice: na hindi malinis
  rationale: Pinananatili nito ang analitikong pananalita ng Hebreo—“hindi malinis”—sa halip na gawing iisang katawagang “marumi.”
- source_word: שְׁנַיִם
  choice: dalawa
  rationale: Tuwirang kahulugan nito ang bilang na dalawa. Nililinaw ng kasunod na parirala na ang dalawa ay isang lalaki at ang kapareha nito.
theological_decisions:
- issue: Kahulugan ng bilang para sa malilinis na hayop
  choice: pitong pares ng bawat malinis na hayop
  alternative: pitong indibidwal na hayop
  rationale: Ang שִׁבְעָה שִׁבְעָה na sinusundan ng אִישׁ וְאִשְׁתּוֹ ay malakas na nagpapahiwatig ng pitong pares na lalaki at babae. Gayunman, dahil maaaring unawain ang parirala bilang pitong indibidwal, hindi itinatago ang alternatibong pagbasa at inilalagay ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “hayop” sa halip na mas makaluma o mas makitid na katawagan. Ang “tigpipitong pares” ay natural na nagpapahayag ng distributibong bilang, samantalang ang talababa ay nagpapanatili ng tunay na ambiguwidad ng Hebreo.
