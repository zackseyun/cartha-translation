  yaml_path: translation/ot/genesis/007/009.yaml
  text: Two by two they came to Noah into the ark[a], male and female[b], just as God had commanded Noah.
translation:
  language: tl
  text: Dala-dalawa silang pumunta kay Noe at pumasok sa arka, lalaki at babae, gaya ng iniutos ng Diyos kay Noe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁנַיִם שְׁנַיִם
  choice: dala-dalawa
  rationale: Ang inuulit na bilang ay distributibong idyoma na nagsasaad ng pagdating nang pares-pares. Likas at maikli sa makabagong Filipino ang “dala-dalawa.”
- source_word: בָּאוּ
  choice: lumapit … at pumasok
  rationale: Ang בוא ay karaniwang pandiwa ng pagpunta o pagdating at, kasama ng patungong arka, ay nagpapahiwatig ng pagpasok. Ginawang dalawang magkaugnay na kilos sa Filipino upang malinaw at natural na maipahayag ang dalawang pariralang may אֶל nang hindi binabago ang kinalabasan ng kilos.
- source_word: אֶל נֹחַ
  choice: kay Noe
  rationale: Ipinahihiwatig ng אֶל ang kilos patungo kay Noe; ang “kay Noe” ang payak at likas na katumbas sa Filipino.
- source_word: אֶל הַתֵּבָה
  choice: sa arka
  rationale: Sa konteksto ng kilos, ang arka ang patutunguhan at aktuwal na pinapasok. Sa pagsama sa pandiwang “pumasok,” malinaw ang direksiyon nang hindi kailangang gumamit ng mabigat na parirala.
- source_word: זָכָר וּנְקֵבָה
  choice: lalaki at babae
  rationale: Pinananatili nito ang payak na pagtukoy ng Hebreo sa dalawang kasarian ng mga hayop. Sa konteksto, malinaw na mga hayop ang tinutukoy.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Ipinapahayag nito ang pagkakatugma ng nangyari sa naunang utos ng Diyos.
- source_word: צִוָּה אֱלֹהִים אֶת נֹחַ
  choice: iniutos ng Diyos kay Noe
  rationale: Ang aspektong ganap ng Hebreo ay tumutukoy sa utos na naibigay na bago ang pagdating ng mga hayop. Likas na naipahihiwatig ng “iniutos” ang naunang kilos sa salaysay.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Sa kontekstong ito, tumutukoy ang אֱלֹהִים sa iisang Diyos at karaniwang isinasalin sa Filipino na “Diyos.”
theological_decisions:
- issue: Ang sanhi o paraan ng pagdating ng mga hayop
  choice: Sinasabi lamang na dumating ang mga hayop ayon sa iniutos ng Diyos, nang hindi ipinapaliwanag ang mekanismo.
  alternative: Sabihing kusang dumating ang mga hayop dahil sa likas na ugali, o sabihing si Noe lamang ang nagtipon sa kanila.
  rationale: Binibigyang-diin ng teksto ang pagkakatugma ng kanilang pagdating sa utos ng Diyos ngunit hindi nito tahasang sinasabi kung paano sila dinala o tinipon. Hindi dinaragdagan ng salin ang pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dala-dalawa” bilang likas na distributibong anyo at “arka” bilang pamilyar na katawagan sa sasakyang-dagat ni Noe. Ang gitling na pahaba ay nagbubukod sa “lalaki at babae” bilang paglilinaw sa pares.
