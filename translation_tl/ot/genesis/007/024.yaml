  text: וַ/יִּגְבְּר֥וּ הַ/מַּ֖יִם עַל הָ/אָ֑רֶץ חֲמִשִּׁ֥ים וּ/מְאַ֖ת יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/024.yaml
  text: And the waters prevailed over the earth for 150 days[a].
translation:
  language: tl
  text: At nanaig ang tubig sa ibabaw ng lupa sa loob ng 150 araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ibabaw ng lupain”; ang salitang Hebreo na אֶרֶץ ay maaaring tumukoy sa lupa o sa isang lupain, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: nanaig
  rationale: Ang Qal wayyiqtol ng גבר ay nagsasaad ng paglakas o pangingibabaw. Ang “nanaig” ay natural sa modernong Tagalog at pinananatili ang larawan ng tubig na nangingibabaw, sa halip na simpleng dumarami lamang.
- source_word: הַמַּיִם
  choice: ang tubig
  rationale: Bagaman anyong maramihan sa Hebreo, likas sa Tagalog na gamitin ang pangngalang kolektibong “tubig” sa ganitong konteksto.
- source_word: עַל הָאָרֶץ
  choice: sa ibabaw ng lupa
  rationale: Ang עַל ay tumutukoy sa pagiging nasa ibabaw o paglaganap sa ibabaw, at ang אֶרֶץ ay maaaring mangahulugang “lupa” sa diwang buong daigdig o isang lupain. Ang “sa ibabaw ng lupa” ay malinaw at hindi nangangailangan ng mas teknikal na pananalita.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: sa loob ng 150 araw
  rationale: Ang literal na ayos na “limampu at isang daang araw” ay likas na ipinahahayag sa Tagalog bilang “150 araw”; idinagdag ang “sa loob ng” upang malinaw na ipakita ang tagal.
theological_decisions:
- issue: Saklaw ng אֶרֶץ sa salaysay ng baha
  choice: lupa, sa diwang buong ibabaw ng daigdig
  alternative: lupain
  rationale: Ang agarang konteksto ay naglalarawan sa baha sa malawak at pangkalahatang mga termino. Gayunman, dahil maaaring mangahulugan ang אֶרֶץ ng “lupain,” pinanatili ang leksikal na alternatibo sa talababa sa halip na lubusang isara ang tunay na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “nanaig” upang mapanatili ang lakas ng pandiwang Hebreo, at ang “ang tubig” bilang likas na kolektibong anyo sa Tagalog. Ang bilang ay isinulat sa numeral para sa madaling pagbasa at kaayon ng consultation layer.
