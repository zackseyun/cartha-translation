base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
translation:
  language: tl
  text: Sapagkat pitong araw na lamang at magpapaulan ako sa daigdig sa loob ng apatnapung araw at apatnapung gabi; papawiin ko mula sa ibabaw ng lupa ang bawat nilalang na ginawa ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “papawiin” ay maaari ring isalin na “buburahin” o “lilipulin”; ipinahihiwatig ng pandiwang Hebreo ang pagpahid o pagbura. Ang “daigdig” sa unang bahagi ay salin ng ibang salitang Hebreo kaysa “lupa” sa pariralang “mula sa ibabaw ng lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng utos sa naunang talata at pinananatili ang malinaw na kaugnayang paliwanag.
- source_word: לְיָמִים עוֹד שִׁבְעָה
  choice: pitong araw na lamang
  rationale: Likas na salin ng idyomang Hebreo na nagsasabing pitong araw pa ang natitira bago magsimula ang ulan.
- source_word: מַמְטִיר
  choice: pauulanin ko
  rationale: Pinananatili ang causative na anyo at tahasang ipinahahayag na ang Diyos ang magpapabuhos ng ulan.
- source_word: עַל הָאָרֶץ
  choice: ang buong lupa
  rationale: Ang 'lupa' ay natural na katumbas ng אֶרֶץ; idinagdag ang 'buong' upang maipahayag ang malawak na saklaw na ipinahihiwatig ng konteksto, nang hindi ginagamit ang mas siyentipikong tunog na 'daigdig.'
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: sa loob ng apatnapung araw at apatnapung gabi
  rationale: Malinaw at natural na pahayag ng tagal sa modernong Filipino.
- source_word: וּמָחִיתִי
  choice: at papawiin ko
  rationale: Pinananatili ang matingkad na larawan ng pagpahid o pagbura sa pandiwang מחה, sa halip na gawing pangkalahatang 'pupuksa.'
- source_word: כָּל הַיְקוּם
  choice: ang bawat nilalang
  rationale: Tumutukoy sa lahat ng nilikhang nabubuhay o umiiral na saklaw ng hatol; ang 'nilalang' ay malinaw ngunit hindi kasing-labis ng 'lahat ng umiiral.'
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: na ginawa ko
  rationale: Direkta at natural na inilalarawan ang naunang gawa ng Diyos na ngayo'y saklaw ng hatol.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: sa ibabaw ng lupang-taniman
  rationale: Pinananatili hangga't maaari ang pagkakaiba ng אֲדָמָה mula sa naunang אֶרֶץ; ang 'lupang-taniman' ay tumutukoy sa lupa o ground, hindi lamang sa planeta o lupain.
theological_decisions:
- issue: Saklaw ng hatol sa אֶרֶץ at כָּל הַיְקוּם
  choice: Gumamit ng malawak na pananalitang 'buong lupa' at 'bawat nilalang' nang hindi tahasang nilulutas ang makabagong debate tungkol sa heograpikong lawak ng baha.
  alternative: Isalin ang אֶרֶץ bilang 'lupain,' na maaaring magpahiwatig ng panrehiyong saklaw.
  rationale: Malawak at masaklaw ang puwersa ng talata, ngunit hindi dapat ipasok sa salin ang isang makabagong siyentipiko o denominasyonal na konklusyon.
- issue: Larawang ipinahihiwatig ng מחה
  choice: papawiin
  alternative: pupuksain
  rationale: Ang 'papawiin' ay nagpapanatili sa metapora ng pagpahid o pagbura at sa tindi ng ganap na hatol.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'pauulanin,' 'papawiin,' at 'nilalang' upang manatiling malinaw ngunit mapanatili ang mga larawan at diin ng Hebreo. Ang tuldok-kuwit ay naghihiwalay sa tagal ng ulan at sa ibubungang hatol.
