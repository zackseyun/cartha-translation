  yaml_path: translation/ot/genesis/007/005.yaml
  text: And Noah did according to all that Yahweh had commanded him[a].
translation:
  language: tl
  text: At ginawa ni Noe ang lahat ayon sa iniutos sa kanya ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: At ginawa
  rationale: Ang עשה ay malawak ang kahulugang “gawin.” Kasama ng waw na nagsusulong sa salaysay, natural itong isinalin na “At ginawa.”
- source_word: נֹחַ
  choice: Noe
  rationale: Ito ang nakagawiang anyo ng pangalang נֹחַ sa makabagong saling Tagalog.
- source_word: כְּכֹל אֲשֶׁר
  choice: ang lahat ayon sa
  rationale: Pinananatili ng “ayon sa” ang diwa ng pagkakatugma o pagsunod na ipinahihiwatig ng prefixed כְּ, habang ang “ang lahat” ay nagpapahayag ng kabuuan.
- source_word: צִוָּהוּ
  choice: iniutos sa kanya
  rationale: Ang צוה ay nangangahulugang “mag-utos,” at ang hulaping panghalip ay tumutukoy kay Noe. Ang aspektong Hebreo ay likas na naipapahayag sa Tagalog sa ganitong ayos nang hindi kailangang dagdagan ng pantulong na pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikli at tuwirang anyo ng Hebreo at ang diin sa ganap na pagsunod ni Noe, nang hindi nagdaragdag ng paliwanag sa mismong talata.
