  text: And Noah, with his sons, his wife, and his sons’ wives with him, entered the ark because of the waters of the flood.
translation:
  language: tl
  text: Pumasok sa arka si Noe, kasama ang kanyang mga anak na lalaki, ang kanyang asawa, at ang mga asawa ng kanyang mga anak na lalaki, dahil sa tubig ng baha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pumasok
  rationale: Ang בוא ay maaaring mangahulugang ‘dumating,’ ‘pumunta,’ o ‘pumasok.’ Dahil ang patutunguhan ay ang arka, malinaw at likas sa Tagalog ang “pumasok.”
- source_word: נֹחַ
  choice: Noe
  rationale: Ito ang nakagawiang anyo ng pangalang נֹחַ sa mga saling Tagalog ng Bibliya.
- source_word: בָנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng Hebrew, kaya hindi ito pinalawak sa pangkalahatang “mga anak.”
- source_word: אִשְׁתּוֹ
  choice: kanyang asawa
  rationale: Sa kontekstong ito, ang אִשָּׁה na may hulaping paari ay malinaw na tumutukoy sa asawa ni Noe.
- source_word: נְשֵׁי בָנָיו
  choice: mga asawa ng kanyang mga anak
  rationale: Malapit itong sumusunod sa literal na pariralang “mga asawa ng kanyang mga anak [na lalaki]”; malinaw na mula sa naunang parirala na mga anak na lalaki ang tinutukoy.
- source_word: אִתּוֹ
  choice: kasama
  rationale: Ipinahahayag nito na ang mga nabanggit na kapamilya ay pumasok na kasama ni Noe. Likas sa Tagalog na ilahad ito sa pariralang “kasama ang…”
- source_word: אֶל הַתֵּבָה
  choice: sa arka
  rationale: Kapag kasama ng pandiwang “pumasok,” likas na Tagalog ang “sa arka” at naipapahayag nito ang pagpasok sa loob nito.
- source_word: מִפְּנֵי
  choice: dahil sa
  rationale: Dito ay nagpapahayag ang parirala ng dahilan o sanhi, hindi lamang ng puwesto sa harapan ng isang bagay.
- source_word: מֵי הַמַּבּוּל
  choice: tubig ng baha
  rationale: 'Pinananatili nito ang dalawang tahasang ideya sa Hebrew: ang tubig at ang baha.'
