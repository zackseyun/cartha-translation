  yaml_path: translation/ot/genesis/016/009.yaml
  text: Then the angel of Yahweh said to her[c][b][a], “Return to your mistress and humble yourself under her hand.”
translation:
  language: tl
  text: At sinabi sa kanya ng anghel ni Yahweh[a], “Bumalik ka sa iyong amo at magpasakop ka sa kanyang awtoridad.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “magpakumbaba ka sa ilalim ng kanyang kamay.” Ang “sa ilalim ng kanyang kamay” ay isang idyoma para sa pagiging nasa ilalim ng kanyang awtoridad. Maaari ring maunawaan ang utos bilang “magpakumbaba ka sa kanya” o “tanggapin mong magtiis sa ilalim ng kanyang awtoridad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Ang מַלְאַךְ ay maaaring mangahulugang sugo o anghel; sa salaysay na ito tungkol sa pakikipagtagpo sa Diyos, “anghel” ang pinakanatural na tawag nang hindi nagpapasya kung ano mismo ang ontolohikal na pagkakakilanlan niya. Pinanatili ang personal na pangalang Yahweh para sa יְהוָה.
- source_word: שׁוּבִי
  choice: Bumalik ka
  rationale: Tuwirang utos sa isang babae; natural at malinaw ito sa modernong Tagalog.
- source_word: גְּבִרְתֵּךְ
  choice: iyong amo
  rationale: Tinutukoy nito ang babaeng nakatataas kay Hagar. Sa Tagalog, ang “amo” ay natural at hindi kailangang markahan ang kasarian, na malinaw naman sa konteksto.
- source_word: וְהִתְעַנִּי
  choice: magpasakop ka
  rationale: Ang anyong Hitpael ay nagpapahiwatig ng pagtanggap sa mababa o nasasakupang kalagayan. Ipinapahayag ng “magpasakop” ang relasyonal na diwa, habang inilalagay sa talababa ang mas mabigat na posibilidad na magtiis o tumanggap ng pagpapahirap.
- source_word: תַּחַת יָדֶיהָ
  choice: sa kapangyarihan niya
  rationale: Literal itong “sa ilalim ng kanyang kamay,” isang idyoma para sa pagiging nasa ilalim ng awtoridad o kapangyarihan. Mas natural sa Tagalog ang “sa kapangyarihan niya,” habang pinananatili sa talababa ang Hebreong larawan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya “Yahweh” ang ginamit sa halip na palitan ito ng titulo.
- issue: Kung “anghel” o “sugo” ang מַלְאַךְ
  choice: anghel
  alternative: sugo
  rationale: Parehong posible sa leksikon, ngunit mas malamang at mas natural ang “anghel” sa konteksto ng banal na pakikipagtagpo. Hindi nito ipinapalagay ang anumang tiyak na doktrina tungkol sa pagkakakilanlan ng anghel.
- issue: Saklaw ng kahulugan ng וְהִתְעַנִּי
  choice: magpasakop ka
  alternative: magpakumbaba ka; tanggapin mong pagmalupitan ka
  rationale: Pinananatili ng pangunahing salin ang utos na pumasok muli sa kalagayang nasa ilalim ng awtoridad, ngunit hindi ikinukubli ng talababa na maaaring kasama sa pandiwa ang pagtitiis ng pagpapahirap o pagmamalupit.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Ang “amo” at “magpasakop” ay madaling maunawaan ng karaniwang mambabasa; ipinaliwanag sa talababa ang literal na idyomang Hebreo at ang mas mabigat na kahulugang maaaring taglay ng pandiwa.
