base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/013.yaml
  text: So she called the name of Yahweh who spoke to her[a], “You are a God who sees me,” for she said[c][b], “Have I really here seen after the One who sees me?”
translation:
  language: tl
  text: Kaya tinawag niya si Yahweh na nagsalita sa kanya, “Ikaw ang Diyos na nakakakita sa akin,” sapagkat sinabi niya, “Talaga bang nakakita ako rito matapos akong makita ng Nakakakita sa akin?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang Hebreo sa huling pangungusap. Maaari rin itong mangahulugang, “Nakita ko ba talaga siya rito at nanatili akong buhay matapos niya akong makita?”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרָא שֵׁם יְהוָה
  choice: tinawag niya si Yahweh ... sa pangalang
  rationale: Ipinahahayag nang natural sa Filipino ang idyomang Hebreo na ‘tumawag ng pangalan,’ habang nililinaw na nagbibigay si Hagar ng pantawag o paglalarawan kay Yahweh, hindi lamang binibigkas ang pangalan niya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הַדֹּבֵר אֵלֶיהָ
  choice: na nakipag-usap sa kanya
  rationale: Ang participle ay tumutukoy kay Yahweh bilang siyang nagsasalita kay Hagar; ang ‘nakipag-usap’ ay natural sa salaysay at malinaw na personal ang pakikipagtagpo.
- source_word: אַתָּה אֵל רֳאִי
  choice: Ikaw ang Diyos na nakakakita sa akin
  rationale: Ipinahahayag nito ang malamang na diwa ng mahirap na רֳאִי bilang Diyos na nakakakita kay Hagar. Hindi minamarkahan ng Filipino ang pagkakaibang ‘a God/the God,’ kaya hindi nito artipisyal na nilulutas ang usapin ng definiteness.
- source_word: הֲגַם הֲלֹם
  choice: Talaga bang ... rito
  rationale: Ipinapakita ng ‘talaga bang’ ang pagkagulat at diin ng mga particle, at ng ‘rito’ ang lokasyong ipinahihiwatig ng הֲלֹם.
- source_word: רָאִיתִי אַחֲרֵי רֹאִי
  choice: nakakita ako ... matapos akong makita ng Nakakakita sa akin
  rationale: Pinananatili ang salitang-ulit tungkol sa pagkakita at ang diwa ng אַחֲרֵי bilang ‘matapos,’ nang hindi idinaragdag sa pangunahing teksto ang ideyang ‘nanatiling buhay.’
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang transliterasyong ‘Yahweh’ ang tuwirang nagpapanatili nito.
- issue: Kahulugan ng titulong אֵל רֳאִי
  choice: Diyos na nakakakita sa akin
  alternative: Diyos na nakakakita; Diyos ng pagkakita
  rationale: Akma ito sa konteksto ng pagkakita ng Diyos sa paghihirap ni Hagar, ngunit inilalahad sa talababa ang iba pang posibleng anyo dahil mahirap at maikli ang Hebreo.
- issue: Kahulugan ng huling pariralang רָאִיתִי אַחֲרֵי רֹאִי
  choice: nakakita ako rito matapos akong makita ng Nakakakita sa akin
  alternative: nakita ko siya rito at nanatili akong buhay matapos niya akong makita
  rationale: Siksik at hindi tiyak ang sintaks. Pinananatili ng pangunahing teksto ang ugnayan ng ‘pagkakita’ at ‘matapos’ sa halip na tahasang idagdag ang pananatiling buhay; inilalagay ang karaniwang interpretasyon sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘kanya’ ayon sa karaniwang modernong gamit, pinanatili ang pangalang Yahweh, at iniwasang gawing sobrang makinis ang sadyang mahirap at malabong huling parirala.
