revisions:
- from: Kaya tinawag niya si Yahweh na nakipag-usap sa kanya sa pangalang, “Ikaw ang Diyos na nakakakita sa akin.”[a] Sapagkat sinabi niya, “Talaga bang nakakita ako rito matapos akong makita ng Nakakakita sa akin?”[b]
  to: Kaya tinawag niya si Yahweh na nagsalita sa kanya, “Ikaw ang Diyos na nakakakita sa akin,” sapagkat sinabi niya, “Talaga bang nakakita ako rito matapos akong makita ng Nakakakita sa akin?”[a]
  rationale: Pinalitan ang 'nakipag-usap' ng 'nagsalita' upang maipakita nang mas tumpak ang participle na tumutukoy kay Yahweh bilang siyang nagsasalita kay Hagar. Inayos ang pangungusap upang maging mas natural ang pagsipi sa titulong ibinigay ni Hagar. Pinanatili ang maingat at hindi mapagpasyang salin ng huling mahirap na parirala at ang talababa para sa karaniwang interpretibong pagbasa.
