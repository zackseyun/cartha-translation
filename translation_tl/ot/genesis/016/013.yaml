  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: pinangalanan ni Hagar si Yahweh, ipinahayag niyang siya ang Diyos na nakakakita sa kanya, at pinananatili ang sadyang mahirap na paglalaro sa ''pagkakita'' sa huling tanong. Gayunman, ang ''nakipag-usap'' ay mas nagpapahiwatig ng kapuwa pag-uusap kaysa sa pandiwang Hebreo, na tuwirang tumutukoy kay Yahweh bilang ''ang nagsasalita sa kanya.'''
  naturalness: Karaniwang natural ang Filipino, ngunit mas malinaw at mas tuwiran ang 'si Yahweh na nagsalita sa kanya' kaysa 'si Yahweh na nakipag-usap sa kanya.' Iniiwasan din nito ang bahagyang mabigat na pagkakasunod ng 'sa pangalang' bago ang tuwirang sipi.
  terminology: Ang 'Yahweh' ay angkop na pagpapanatili ng Tetragrammaton. Ang 'Diyos na nakakakita sa akin' ay natural at maingat na salin ng mahirap na אֵל רֳאִי. Ang 'Nakakakita sa akin' sa huling sugnay ay pinananatili upang huwag lutasin nang labis ang hindi tiyak na Hebreo.
