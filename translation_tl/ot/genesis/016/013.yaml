  - severity: low
    issue: Medyo mabigat ang ayos na 'tinawag niya si Yahweh na nakipag-usap sa kanya sa pangalang.'
    rationale: Mas malinaw sa modernong Filipino ang paglalagay ng paglalarawang relatif na 'na nagsalita sa kanya' at ang sipi bilang mismong pangalang itinawag.
