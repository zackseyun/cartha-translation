  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘ipanganak ni Hagar’ bilang natural na katumbas ng aktibong Hebreong ‘nang manganak si Hagar,’ at pinanatili sa talababa ang tunay na kalabuan ng לְ.
