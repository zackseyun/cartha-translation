  naturalness: Nauunawaan ang draft, ngunit mas natural at malinaw sa makabagong Filipino ang "walumpu't anim na taong gulang" at "nang isilang ni Hagar si Ismael." Ang "para kay Abram" ay posible, subalit ang "kay Abram" ay mas maikli at mas malapit sa anyo ng Hebreo sa pormulang panganganak.
