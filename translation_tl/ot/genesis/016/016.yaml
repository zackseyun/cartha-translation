  text: Abram was eighty-six years old when Hagar bore Ishmael to Abram[a].
translation:
  language: tl
  text: Walumpu't anim na taong gulang si Abram nang isilang ni Hagar si Ismael kay Abram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para kay Abram.” Ang pang-ukol na Hebreo ay maaaring isalin bilang “kay” o “para kay” sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: Abram
  rationale: Isinalin sa karaniwang anyong Filipino ang pangalang pantangi.
- source_word: בֶּן
  choice: na taon si Abram
  rationale: Sa pormulang nagsasaad ng edad, ang בֶּן ay likas na ipinapahayag sa Filipino bilang edad ng tao, hindi literal na ‘anak ng.’
- source_word: שְׁמֹנִים שָׁנָה וְ/שֵׁשׁ שָׁנִים
  choice: Walumpu't anim na taon
  rationale: Pinagsama ang mga bilang ayon sa natural na makabagong Filipino habang pinananatili ang eksaktong edad na 86.
- source_word: בְּ/לֶדֶת
  choice: nang ipanganak ni
  rationale: Ang בְּ na kasunod ng infinitive construct ay nagpapakilala ng panahong pangyayari; natural itong ipinahayag bilang ‘nang ipanganak ni Hagar.’
- source_word: הָגָר
  choice: Hagar
  rationale: Ginamit ang karaniwang transliterasyon ng pangalang pantangi sa Filipino.
- source_word: אֶת יִשְׁמָעֵאל
  choice: si Ismael
  rationale: Hindi isinasalin ang pananda sa tuwirang layon na אֶת; ginamit ang karaniwang anyong Filipino na ‘Ismael’ at ang angkop na personal marker na ‘si.’
- source_word: לְ/אַבְרָם
  choice: para kay Abram
  rationale: Ang לְ ay maaaring magpahiwatig ng kaugnayang ‘para kay Abram’ o ‘kay Abram.’ Ang ‘para kay Abram’ ay natural sa Filipino at pinananatili ang posibleng benefactive na diwa.
