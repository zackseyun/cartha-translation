  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת זַרְעֵ֑/ךְ וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/010.yaml
  text: Then the angel of Yahweh said to her[a], “I will greatly multiply your offspring, so that it cannot be counted because of its multitude.”
translation:
  language: tl
  text: Pagkatapos, sinabi sa kanya ng anghel ni Yahweh[a], “Labis kong pararamihin ang iyong lahi, kaya hindi ito mabibilang sa sobrang dami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאַךְ na “sugo” o “anghel.” Sa paulit-ulit na pormulang ito sa Genesis, ang “anghel ni Yahweh” ang malinaw at kinikilalang salin, habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: הַרְבָּה אַרְבֶּה
  choice: Labis kong pararamihin
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagpapasidhi sa lawak ng pagpaparami. Ipinahahayag ito nang natural at mariin sa Filipino nang hindi inililipat ang diin tungo lamang sa katiyakan.
- source_word: זַרְעֵךְ
  choice: ang iyong lahi
  rationale: Ang זֶרַע ay kolektibong pangngalan para sa mga supling o inapo. Ang “lahi” ay natural sa kontekstong pangako ng napakaraming magiging inapo at maaari pa ring tukuyin bilang isang kolektibo.
- source_word: וְלֹא יִסָּפֵר
  choice: kaya hindi na ito mabibilang
  rationale: Ipinahahayag ng Niphal ang hindi kayang bilangin; ginagawang malinaw ng “kaya” ang resultang ugnayan na ipinahihiwatig ng konteksto.
- source_word: מֵרֹב
  choice: sa sobrang dami
  rationale: Ipinahahayag ng מִן kasama ng רֹב ang dahilan ng kawalan ng kakayahang bilangin. Ang parirala ay maikli, natural, at malinaw sa modernong Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng kahulugan ng מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: sugo ni Yahweh
  rationale: Pinipili ng pangunahing teksto ang nakagawiang kahulugan sa kontekstong ito, ngunit pinananatili sa talababa ang tunay na leksikal na posibilidad na “sugo,” nang hindi nagpapasya nang higit sa sinasabi ng talata tungkol sa identidad nito.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “pararamihin” at “lahi” upang malinaw sa karaniwang mambabasa, habang pinananatili ang kolektibong sanggunian at mariing pangako ng Hebreo.
