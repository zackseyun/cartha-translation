id: GEN.16.12
reference: Genesis 16:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/ה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣/וֹ בַ/כֹּ֔ל וְ/יַ֥ד כֹּ֖ל בּ֑/וֹ וְ/עַל פְּנֵ֥י כָל אֶחָ֖י/ו יִשְׁכֹּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/012.yaml
  text: And he will be a wild donkey of a man[a]; his hand will be against everyone, and everyone's hand against him[c][b], and he will dwell opposite all his brothers.
translation:
  language: tl
  text: At siya ay magiging taong tulad ng mailap na asno[a]; ang kamay niya ay laban sa lahat, at ang kamay ng lahat ay laban sa kanya. Maninirahan siya sa tapat ng lahat ng kanyang mga kapatid[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “taong mailap na asno.” Ang larawan ay naghahambing sa kanya sa mailap na asno—isang hayop na malaya at hindi napaaamo—hindi lamang nagsasabing siya ay “mailap.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sa tapat ng” ay maaari ring mangahulugang “sa harap ng,” “sa piling ng,” o “bilang kasalungat ng.” Ang “mga kapatid” ay maaari ring tumukoy sa malalapit na kamag-anak o magkakaugnay na mga bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּרֶא אָדָם
  choice: taong tulad ng mailap na asno
  rationale: Tahasang pinananatili ang paghahambing sa mailap na asno, ngunit inihahayag ito sa likas at malinaw na Tagalog sa halip na palabuin bilang simpleng “mailap na tao.”
- source_word: יָדוֹ בַכֹּל וְיַד כֹּל בּוֹ
  choice: ang kamay niya ay laban sa lahat, at ang kamay ng lahat ay laban sa kanya
  rationale: Pinananatili ang larawan ng “kamay” at ang magkatugmang pagkakabuo ng dalawang sugnay, habang malinaw na ipinapahayag ang magkasalungat na pagkilos.
- source_word: וְעַל־פְּנֵי
  choice: sa tapat ng
  rationale: Nananatili ang malawak na kahulugang panlunan at panlipunan ng parirala—nasa harap, kaharap, o kasalungat—nang hindi ito nililimitahan sa direksiyong silangan o tahasang pagsuway.
- source_word: כָּל־אֶחָיו
  choice: lahat ng kanyang mga kapatid
  rationale: Ang literal na “mga kapatid” ang pinanatili sa teksto; maaaring sumaklaw ang Hebreo sa mas malawak na kamag-anakan o magkakaugnay na mga bayan, kaya ipinaliliwanag ito sa talababa.
- source_word: יִשְׁכֹּן
  choice: maninirahan siya
  rationale: Natural sa modernong Tagalog at tumpak na naghahatid ng diwang manahan o mamuhay sa isang lugar.
theological_decisions:
- issue: Paglalarawan kay Ismael sa pariralang פֶּרֶא אָדָם
  choice: 'Panatilihin ang hayagang paghahambing: “taong tulad ng mailap na asno”'
  alternative: “mailap na tao”
  rationale: Hindi pinapahina ang matingkad na larawang Hebreo at hindi rin dinaragdagan ng moral na hatol na wala sa mismong talata.
- issue: Kahulugan ng וְעַל־פְּנֵי כָל־אֶחָיו
  choice: “sa tapat ng lahat ng kanyang mga kapatid”
  alternative: “bilang pagsalungat sa lahat ng kanyang mga kapatid”
  rationale: Pinananatili ang tunay na kalabuan ng parirala, na maaaring tumukoy sa lokasyon, pagharap, o mapanlabang ugnayan, sa halip na gawing tiyak na pagsuway lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang matitingkad na larawan at paralelismo ng Hebreo; ginamit ang “mailap na asno” sa halip na mas teknikal o di-pamilyar na katawagan.
