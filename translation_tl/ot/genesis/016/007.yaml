  source_fidelity: 'Tumpak na naipapahayag ang lahat ng pangunahing sangkap ng Hebreo: natagpuan ang pambabaeng tinutukoy, ang anghel ni Yahweh, ang bukal sa ilang, at ang bukal na nasa daan patungong Shur. Ang “isang bukal” ay natural na Filipino para sa pariralang lokatibo at hindi nagbabago sa kahulugan.'
