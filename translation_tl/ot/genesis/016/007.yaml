  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יִּמְצָאָ֞/הּ מַלְאַ֧ךְ יְהוָ֛ה עַל עֵ֥ין הַ/מַּ֖יִם בַּ/מִּדְבָּ֑ר עַל הָ/עַ֖יִן בְּ/דֶ֥רֶךְ שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/007.yaml
  text: And the angel of Yahweh found her by a spring of water in the wilderness[b][a], by the spring on the way to Shur.
translation:
  language: tl
  text: Natagpuan siya ng anghel ni Yahweh[a] sa tabi ng isang bukal sa ilang—ang bukal na nasa daan patungong Shur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo ni Yahweh.” Ang salitang Hebreo ay maaaring mangahulugang “anghel” o “sugo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָאָהּ
  choice: Natagpuan siya
  rationale: Tuwirang inilalarawan ng מצא ang pagkakatagpo kay Hagar; malinaw sa hulaping pambabae na siya ang layon.
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugang “sugo” o “anghel” ang מַלְאַךְ; ang “anghel” ay natural sa konteksto ng isang mensaherong mula sa Diyos, habang itinatala sa talababa ang tunay na leksikal na alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton sa tekstong Hebreo.
- source_word: עַל עֵין הַמַּיִם
  choice: sa tabi ng isang bukal
  rationale: Sa konteksto, ang עַיִן ay bukal ng tubig, at ang עַל ay natural na lokatibong isinasalin bilang “sa tabi ng.” Hindi na kailangang idagdag ang “ng tubig” dahil likas na malinaw iyon sa “bukal.”
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay malawak na tigang at di-tinatahang lupain, hindi kinakailangang mabuhanging disyerto; maikli at angkop ang “ilang.”
- source_word: עַל הָעַיִן
  choice: ang bukal na nasa
  rationale: Inuulit ng Hebreo ang pagtukoy sa bukal upang tukuyin ang lokasyon nito; pinananatili ang pag-uulit sa natural na Filipino.
- source_word: בְּדֶרֶךְ שׁוּר
  choice: daan patungong Shur
  rationale: Ipinapahayag nito ang ruta o daang patungo sa pook na Shur.
theological_decisions:
- issue: Pagpapakahulugan sa מַלְאַךְ bilang anghel o sugo
  choice: anghel ni Yahweh
  alternative: sugo ni Yahweh
  rationale: Hindi lubusang nilulutas ng salitang Hebreo kung “anghel” o “sugo” ang dapat idiin; ginagamit sa teksto ang kinaugaliang “anghel” at pinananatili sa talababa ang alternatibo.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Direktang pinananatili ng “Yahweh” ang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa ilang” bilang natural at malawak na katumbas ng מִדְבָּר, at em dash upang malinaw na ang ikalawang parirala ay higit na tumutukoy sa lokasyon ng bukal.
