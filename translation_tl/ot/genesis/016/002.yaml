  to: At sinabi ni Sarai kay Abram, “Tingnan mo nga, pinigilan ako ni Yahweh na magkaanak. Sumiping ka nga sa aking aliping babae; baka sa pamamagitan niya ay magkaroon ako ng mga anak.”[a] At nakinig si Abram sa tinig ni Sarai.
