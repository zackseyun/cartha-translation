  text: וַ/תֹּ֨אמֶר שָׂרַ֜י אֶל אַבְרָ֗ם הִנֵּה נָ֞א עֲצָרַ֤/נִי יְהוָה֙ מִ/לֶּ֔דֶת בֹּא נָא֙ אֶל שִׁפְחָתִ֔/י אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑/נָּה וַ/יִּשְׁמַ֥ע אַבְרָ֖ם לְ/ק֥וֹל שָׂרָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/002.yaml
  text: Then Sarai said to Abram[a], “Look now, Yahweh has kept me from bearing children. Please go in to my female servant; perhaps I will be built up through her.” And Abram listened to the voice of Sarai.
translation:
  language: tl
  text: At sinabi ni Sarai kay Abram, “Tingnan mo nga, pinigilan ako ni Yahweh na magkaanak. Sumiping ka nga sa aking aliping babae; baka sa pamamagitan niya ay magkaroon ako ng mga anak.”[a] At nakinig si Abram sa tinig ni Sarai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “baka ako ay maitayo/mabuo mula sa pamamagitan niya.” Isa itong Hebreong metapora na maaari ring unawain na “baka magkaanak ako sa pamamagitan niya” o “baka maitatag ang aking pamilya sa pamamagitan niya.”
    reason: Pinananatili ang literal na metapora ng Hebreo at ang lawak ng posibleng kahulugan nito, habang ang pangunahing teksto ay gumagamit ng likas na Tagalog na idyomatikong kahulugan.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: At sinabi
  rationale: Likas na daloy-salaysay sa Tagalog para sa waw-consecutive, habang pinananatili ang pagkakasunod ng mga pangyayari.
- source_word: הִנֵּה נָא
  choice: Tingnan mo
  rationale: Makabagong panawag-pansin na hindi gumagamit ng makalumang pananalita; ipinahihiwatig ng konteksto ang mariing pagharap ni Sarai sa kalagayan.
- source_word: עֲצָרַנִי יְהוָה מִלֶּדֶת
  choice: pinigilan ako ni Yahweh na magkaanak
  rationale: Tuwirang pinananatili ang pahayag na si Yahweh ang humadlang sa panganganak ni Sarai; ang “magkaanak” ay natural at malinaw sa Tagalog.
- source_word: בֹּא נָא אֶל
  choice: Pakisipingan mo
  rationale: Ipinapahayag nang maikli at may paggalang ang nakaugaliang Hebreong eupemismo para sa pakikipagtalik, nang hindi nagiging teknikal o mahalay.
- source_word: שִׁפְחָתִי
  choice: aking aliping babae
  rationale: Pinananatili ang mababang katayuang legal at panlipunan ng שִׁפְחָה, sa halip na palambutin bilang karaniwang katulong lamang.
- source_word: אוּלַי אִבָּנֶה מִמֶּנָּה
  choice: baka sa pamamagitan niya ay mabuo ang aking sambahayan
  rationale: Pinananatili ang metapora ng “pagkakabuo/pagtatayo” ngunit nililinaw ang pampamilyang diwa nito sa natural na Tagalog; inilalagay sa talababa ang higit na literal at ibang posibleng pakahulugan.
- source_word: וַיִּשְׁמַע ... לְקוֹל
  choice: At nakinig ... sa tinig
  rationale: Pinananatili ang literal na idyomang “nakinig sa tinig,” kasama ang posibleng intertekstuwal na alingawngaw nito, sa halip na tahasang gawing “sumunod.”
theological_decisions:
- issue: Ang papel ni Yahweh sa hindi pagkakaroon ng anak ni Sarai
  choice: pinigilan ako ni Yahweh na magkaanak
  alternative: hindi ako pinahintulutan ni Yahweh na manganak
  rationale: Tahasang iniuugnay ng teksto kay Yahweh ang kalagayan ni Sarai. Hindi ito pinalalambot o dinaragdagan ng paliwanag na wala sa talata.
- issue: Antas ng pagiging tahas sa eupemismo para sa pakikipagtalik
  choice: Pakisipingan mo ang aking aliping babae
  alternative: Pakipagtalik ka sa aking aliping babae
  rationale: Ang “sipigan” ay dignified at malinaw sa modernong Tagalog, habang pinananatili ang eupemistikong rehistro ng Hebreo.
- issue: Metapora ng pagkakabuo sa pamamagitan ng alipin
  choice: mabuo ang aking sambahayan
  alternative: ako ay maitayo sa pamamagitan niya
  rationale: Ang salin ay nagpapanatili ng imahen ng pagbuo ngunit iniiwasan ang lubhang di-natural na literalismo. Hindi nito ipinipinid ang saklaw sa biyolohikal na panganganak lamang, sapagkat maaari ring tumukoy sa pagtatatag ng pamilya o sambahayan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Yahweh” para sa banal na pangalan. Ang “aliping babae” ay sadyang nagpapanatili sa katayuang pagkaalipin; ang “sipigan” ay isang malinaw ngunit hindi mahalay na eupemismo. Ang talababa ay minarkahan sa pangunahing teksto bilang [a].
