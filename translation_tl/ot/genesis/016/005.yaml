  naturalness: Ang binagong pananalita ay makabago at marangal na Filipino. “Sa iyong piling” ay mas likas sa daloy ng pangungusap kaysa “sa iyong kandungan,” samantalang inilalahad ng talababa ang literal na larawan at ang idyomatikong gamit nito.
  terminology: Pinanatili ang “aliping babae” para sa שִׁפְחָה at “Yahweh” para sa יהוה. Ang “kawalang-katarungang dinaranas ko” ay mas tapat na sumasaklaw sa paratang ni Sarai nang hindi ipinapakahulugang sarili niyang kasalanan ang חֲמָסִי.
