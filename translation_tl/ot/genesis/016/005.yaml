  to: Sinabi ni Sarai kay Abram, “Ikaw ang mananagot sa kawalang-katarungang dinaranas ko.[a] Ibinigay ko ang aking aliping babae sa iyong piling,[b] ngunit nang makita niyang naglihi siya, naging hamak ako sa paningin niya. Humatol nawa si Yahweh sa pagitan ko at mo.”
