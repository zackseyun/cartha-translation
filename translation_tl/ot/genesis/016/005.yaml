  text: וַ/תֹּ֨אמֶר שָׂרַ֣י אֶל אַבְרָם֮ חֲמָסִ֣/י עָלֶי/ךָ֒ אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִ/י֙ בְּ/חֵיקֶ֔/ךָ וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וָ/אֵקַ֖ל בְּ/עֵינֶ֑י/הָ יִשְׁפֹּ֥ט יְהוָ֖ה בֵּינִ֥/י וּ/בֵינֶֽיׄ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/005.yaml
  text: Then Sarai said to Abram[a], “The wrong done to me is on you. I gave my female servant into your embrace, and when she saw that she had conceived, I became contemptible in her eyes[b]. May Yahweh judge between me and you.”
translation:
  language: tl
  text: Sinabi ni Sarai kay Abram, “Ikaw ang mananagot sa kawalang-katarungang dinaranas ko.[a] Ibinigay ko ang aking aliping babae sa iyong piling,[b] ngunit nang makita niyang naglihi siya, naging hamak ako sa paningin niya. Humatol nawa si Yahweh sa pagitan ko at mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na Hebreo, “Ang aking kawalang-katarungan ay nasa iyo” o “Ang pinsalang dinaranas ko ay nasa iyo.” Ang pananalita ay isang paratang na pananagutan ni Abram ang kawalang-katarungang naranasan ni Sarai.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa iyong dibdib” o “sa iyong kandungan”; isang mahinahong idyoma rito para sa matalik na pagtanggap.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָסִי עָלֶיךָ
  choice: Pananagutan mo ang paghamak na dinaranas ko
  rationale: Ang חָמָס ay maaaring tumukoy sa karahasan, kamalian, o kawalang-katarungan, at ang עָלֶיךָ ay nagpapataw ng pananagutan kay Abram. Ipinahahayag ng salin ang paratang ni Sarai nang hindi ipinapalagay na siya mismo ang gumawa ng kamalian.
- source_word: שִׁפְחָתִי
  choice: aking aliping babae
  rationale: Malinaw nitong ipinakikita ang nakagapos na katayuan ni Hagar at likas itong pakinggan sa modernong Filipino.
- source_word: בְּחֵיקֶךָ
  choice: sa iyong kandungan
  rationale: Pinananatili nito ang literal na larawang 'dibdib/kandungan' bilang mahinahong idyoma para sa matalik na pagtanggap, nang hindi tahasang dinaragdagan ang teksto.
- source_word: הָרָתָה
  choice: naglihi siya
  rationale: Isinasalamin nito ang natapos na paglilihi at natural ang pagkakasunod ng pangyayari sa Filipino.
- source_word: וָאֵקַל בְּעֵינֶיהָ
  choice: hinamak niya ako
  rationale: Ipinahahayag nito ang pagbaba ng tingin ni Hagar kay Sarai. Mas natural ito sa Filipino kaysa sa literal na 'naging hamak ako sa kanyang mga mata,' habang pinananatili ang diwa ng paghamak.
- source_word: יִשְׁפֹּט יְהוָה
  choice: Humatol nawa si Yahweh
  rationale: Ang anyong pandiwa ay isang paghiling o panawagan para sa banal na paghatol; ang 'nawa' ay malinaw na naghahatid ng puwersang ito.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: sa pagitan nating dalawa
  rationale: Tahasang tinutukoy ang dalawang panig—sina Sarai at Abram—at natural itong pakinggan sa Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng Hebreong teksto ang Tetragrammaton. Pinananatili ng 'Yahweh' ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kung sino ang may pananagutan sa חֲמָסִי עָלֶיךָ
  choice: Paratang ni Sarai na pananagutan ni Abram ang paghamak o kawalang-katarungang dinaranas niya
  alternative: Isang sumpang 'mapasa iyo ang sarili kong kamalian'
  rationale: Maaaring literal na basahin ang possessive bilang 'aking kamalian,' ngunit sa konteksto ay inaakusahan ni Sarai si Abram. Pinananatili sa talababa ang mas literal at hindi gaanong tiyak na anyo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'aliping babae' upang maging lantad ang katayuang panlipunan ni Hagar. Pinanatili sa talababa ang tunay na kalabuan ng חֲמָסִי at ang larawang Hebreo sa בְּחֵיקֶךָ.
