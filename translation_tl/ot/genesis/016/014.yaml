  yaml_path: translation/ot/genesis/016/014.yaml
  text: Therefore the well was called Beer-lahai-roi. Look, it is between Kadesh and Bered.
translation:
  language: tl
  text: Kaya tinawag ang balon na Beer-lahai-roi[a]. Tingnan ninyo, nasa pagitan ito ng Kades at Bered.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Beer-lahai-roi” ay maaaring mangahulugang “Balon ng isang Buháy na nakakakita sa akin.”
    reason: Ipinapaliwanag ang posibleng kahulugan ng pangalang Hebreo habang pinananatili ang pangalan sa pangunahing teksto at hindi inaangkin ang isang ganap na tiyak na pagbubuo nito.
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Natural na ipinahahayag ang ugnayang sanhi at bunga ng pariralang Hebreo.
- source_word: קָרָא לַבְּאֵר
  choice: tinawag ang balon
  rationale: Pinananatili ang di-tiyak na tagaganap sa Hebreo sa pamamagitan ng pangungusap na nakatuon sa bagay, sa halip na tukuyin kung sino ang nagpangalan.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Beer-lahai-roi
  rationale: Pinananatili bilang pangalan ng pook, gaya ng gamit nito sa salaysay; ipinaliliwanag sa talababa ang posibleng kahulugan.
- source_word: הִנֵּה
  choice: Narito
  rationale: Dignified at likas na panandang pantawag-pansin at pagtuturo ng kinaroroonan, nang hindi nagdaragdag ng tahasang kausap o bilang.
- source_word: בֵין קָדֵשׁ וּבֵין בָּרֶד
  choice: sa pagitan ito ng Kades at Bered
  rationale: Tuwirang inililipat ang lokasyong nasa pagitan ng dalawang pinangalanang pook.
theological_decisions:
- issue: Kahulugan ng pangalang Beer-lahai-roi
  choice: Panatilihin ang pangalang transliterado sa teksto at ilagay sa talababa ang karaniwang kahulugan nito.
  alternative: Isalin mismo sa teksto bilang “Balon ng Buháy na nakakakita sa akin” o “Balon ng Nabubuhay na nakakakita sa akin.”
  rationale: May kahalagahang teolohikal ang pangalan kaugnay ng naunang pahayag ni Hagar, ngunit ang anyong Hebreo ay pangalan ng pook at may bahagyang kalabuan sa eksaktong pagbubuo. Iniiwasan ng transliterasyon na ipako sa teksto ang isang interpretasyon.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “Narito” bilang natural na panandang pantawag-pansin, at pinanatili ang mga pangalang Kades, Bered, at Beer-lahai-roi sa karaniwang anyong transliterado.
