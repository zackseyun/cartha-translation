  text: וַ/תִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת אַבְרָ֗ם אֶת הָגָ֤ר הַ/מִּצְרִית֙ שִׁפְחָתָ֔/הּ מִ/קֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְ/שֶׁ֥בֶת אַבְרָ֖ם בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/אַבְרָ֥ם אִישָׁ֖/הּ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female servant, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
translation:
  language: tl
  text: Noon, kinuha ni Sarai, ang asawa ni Abram, si Hagar, ang Ehipsiyong babaeng alipin niya, pagkaraan ng sampung taon ng paninirahan ni Abram sa lupain ng Canaan,[a] at ibinigay niya si Hagar sa kanyang asawang si Abram bilang asawa ni Abram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa katapusan ng sampung taon mula nang manirahan si Abram sa lupain ng Canaan.”
    reason: Ipinakikita ang mas pormal na anyo ng panahong parirala sa Hebreo habang nananatiling natural ang pangunahing salin.
  - marker: b
    text: Sa Hebreo, “bilang asawa”; tinatawag din si Hagar na babaeng alipin ni Sarai sa talatang ito.
    reason: Pinananatiling lantad ang dalawang paglalarawan sa katayuan ni Hagar nang hindi ipinapalit ang “kalunya” sa salitang Hebreo.
lexical_decisions:
- source_word: וַתִּקַּח
  choice: kinuha
  rationale: Karaniwang gamit ng לָקַח sa salaysay ang “kumuha”; pinananatili nito ang tuwirang kilos ni Sarai nang hindi nagdaragdag ng paliwanag.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: ni Sarai, na asawa ni Abram
  rationale: Likas sa modernong Tagalog ang sugnay na panuring at malinaw nitong pinananatili ang pagkakakilanlan ni Sarai bilang asawa ni Abram.
- source_word: הָגָר הַמִּצְרִית
  choice: si Hagar, ang Ehipsiyo
  rationale: Pinananatili ang pangalang pantangi at ang pagtukoy sa kaniyang pinagmulan. Isinama ang “Ehipsiyo” sa mas buong pariralang “ang Ehipsiyong babaeng alipin niya” para sa natural na daloy.
- source_word: שִׁפְחָתָהּ
  choice: babaeng alipin niya
  rationale: Tapat na ipinahahayag ng “alipin” ang nakagapos na katayuan ni Hagar; hindi ito pinalalambot bilang simpleng katulong o alila.
- source_word: מִקֵּץ עֶשֶׂר שָׁנִים לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן
  choice: matapos ang sampung taon ng paninirahan ni Abram sa lupain ng Canaan
  rationale: Malinaw at natural na ipinapahayag ang natapos na sampung taong yugto habang pinananatili ang kaugnayan nito sa paninirahan ni Abram sa Canaan.
- source_word: וַתִּתֵּן אֹתָהּ לְאַבְרָם אִישָׁהּ
  choice: at ibinigay niya si Hagar sa asawa niyang si Abram
  rationale: Inulit ang pangalang Hagar upang maiwasan ang malabong panghalip at mapanatiling malinaw ang mga kalahok sa pangungusap.
- source_word: לוֹ לְאִשָּׁה
  choice: bilang asawa
  rationale: Tuwirang sinasalamin nito ang אִשָּׁה at hindi ito pinapalitan ng “kalunya,” isang katawagang wala sa talata.
theological_decisions:
- issue: Ang sabay na katayuan ni Hagar bilang alipin ni Sarai at asawa ni Abram
  choice: Pinanatili kapuwa ang “babaeng alipin” at “bilang asawa.”
  alternative: Isalin ang huling parirala bilang “bilang kalunya” o palitan ang “alipin” ng mas malambot na “katulong.”
  rationale: Tahasan siyang tinatawag ng Hebreo na שִׁפְחָה, babaeng alipin, at ginagamit din ang אִשָּׁה, asawa/babae. Hindi dapat alisin o pagkaisahin ng salin ang tensiyon sa dalawang katayuang ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “babaeng alipin” sa halip na mas tradisyonal ngunit malabong “alila,” at iniwasan ang dehumanizing na panghalip na “ito” para kay Hagar.
