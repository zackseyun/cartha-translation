  terminology: Ang “Ehipsiyong babaeng alipin” at “asawa” ay angkop at pinananatili ang magkasabay na katayuang ibinibigay ng Hebreo. Ginamit ang “kanyang asawang si Abram” upang maging likas at malinaw ang ugnayan nang walang dagdag na interpretasyong doktrinal.
