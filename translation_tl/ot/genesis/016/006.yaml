  to: Sinabi ni Abram kay Sarai, “Narito, ang alipin mong babae ay nasa iyong kamay. Gawin mo sa kanya kung ano ang mabuti sa paningin mo.” Pagkatapos, pinahirapan[a] siya ni Sarai, at tumakas siya palayo kay Sarai.
