  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵ/ךְ֙ בְּ/יָדֵ֔/ךְ עֲשִׂי לָ֖/הּ הַ/טּ֣וֹב בְּ/עֵינָ֑יִ/ךְ וַ/תְּעַנֶּ֣/הָ שָׂרַ֔י וַ/תִּבְרַ֖ח מִ/פָּנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/006.yaml
  text: Then Abram said to Sarai[a], “Look, your female servant is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
translation:
  language: tl
  text: Sinabi ni Abram kay Sarai, “Narito, ang alipin mong babae ay nasa iyong kamay. Gawin mo sa kanya kung ano ang mabuti sa paningin mo.” Pagkatapos, pinahirapan[a] siya ni Sarai, at tumakas siya palayo kay Sarai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malupit ang pakikitungo sa kanya” o “inapi siya.” Maaaring tumukoy ang pandiwang Hebreo sa pagpapahirap, pang-aapi, pagpapahiya, o malupit na pakikitungo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang pantawag-pansing at panturong puwersa ng salitang Hebreo sa isang marangal ngunit nauunawaang anyo.
- source_word: שִׁפְחָתֵךְ
  choice: ang alipin mong babae
  rationale: Malinaw na ipinahahayag ang kalagayang nakagapos sa pagkaalipin at hindi ito pinalalambot bilang karaniwang paglilingkod.
- source_word: בְּיָדֵךְ
  choice: nasa iyong kamay
  rationale: Pinananatili ang idyomang Hebreo, na sa konteksto ay tumutukoy sa kapangyarihan at pamamahala ni Sarai.
- source_word: עֲשִׂי לָהּ הַטּוֹב בְּעֵינָיִךְ
  choice: Gawin mo sa kanya ang mabuti sa paningin mo
  rationale: Inililipat nang tuwiran ang kilos at pinananatili ang idyomang ‘mabuti sa iyong paningin’ nang hindi ito ganap na pinapakahulugan.
- source_word: וַתְּעַנֶּהָ
  choice: pinahirapan siya
  rationale: Ang piel ng ענה ay maaaring tumukoy sa pagpapahirap, pang-aapi, pagpapakumbaba, o malupit na pakikitungo. Malawak at mabigat ang ‘pinahirapan’ ngunit hindi nito tinutukoy ang eksaktong anyo ng ginawa.
- source_word: וַתִּבְרַח מִפָּנֶיהָ
  choice: tumakas siya mula sa harapan nito
  rationale: Pinananatili ang seryosong diwa ng pagtakas at ang larawang Hebreo na ‘mula sa harapan niya’; ginagamit ang ‘nito’ upang ituro pabalik kay Sarai.
theological_decisions:
- issue: Kalagayang panlipunan ni Hagar
  choice: alipin mong babae
  alternative: babaeng lingkod
  rationale: Mahalaga sa salaysay ang hindi pantay na kapangyarihan sa sambahayan. Ang ‘alipin’ ay tapat na naghahayag ng nakagapos na katayuan at hindi nagpapalabo rito bilang pangkalahatang paglilingkod.
- issue: Tindi ng ginawa ni Sarai sa וַתְּעַנֶּהָ
  choice: pinahirapan siya
  alternative: malupit siyang pinakitunguhan
  rationale: Ipinahihiwatig ng Hebreo ang tunay na pagpapahirap o pang-aapi ngunit hindi sinasabi rito ang tiyak na anyo nito. Pinananatili ng salin ang bigat at ang talab ng hindi pagkakatalaga.
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang mga idyomang ‘nasa iyong kamay,’ ‘mabuti sa paningin mo,’ at ‘mula sa harapan’ sapagkat nauunawaan ang mga ito sa konteksto at mahalaga ang kanilang larawang Hebreo. Inilagay ang talababa sa pandiwang ‘pinahirapan,’ na siyang salitang tinatalakay nito.
