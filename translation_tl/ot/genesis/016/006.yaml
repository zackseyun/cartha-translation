review_pass:
  verdict: revise
  source_fidelity: 'Tapat ang pangunahing salin sa Hebreo: malinaw ang katayuan ng babae bilang alipin, napananatili ang idyomang nasa kapangyarihan ni Sarai, at ang ''pinahirapan'' ay sapat na mabigat ngunit hindi labis na tumutukoy sa anyo ng pagtrato. Gayunman, kailangan ang ''kung ano'' sa utos upang maipahayag nang wasto ang ''ang mabuti [na] sa paningin mo.'''
  naturalness: 'May dalawang bahaging hindi lubos na natural sa modernong Filipino: ang ''Gawin mo sa kanya ang mabuti sa paningin mo'' ay nangangailangan ng ''kung ano,'' at ang ''tumakas siya mula sa harapan nito'' ay di-natural at ang ''nito'' ay hindi angkop na pantukoy sa taong si Sarai. Mas malinaw ang ''tumakas siya palayo kay Sarai.'''
  terminology: Ang 'alipin mong babae' ay wastong nagpapahayag ng שִׁפְחָתֵךְ nang hindi pinapalambot ang katayuang alipin. Ang 'pinahirapan' ay angkop para sa ענה sa piel; pinananatili ng talababa ang iba pang posibleng diin. Inilipat ang pananda ng talababa sa mismong salitang tinatalakay.
  issues:
  - severity: medium
    issue: Kulang ang panandang 'kung ano' sa sugnay na 'Gawin mo sa kanya ang mabuti sa paningin mo.'
    rationale: Ang הַטּוֹב בְּעֵינָיִךְ ay tumutukoy sa bagay na itinuturing na mabuti ni Sarai. Sa Filipino, kailangan ang 'kung ano ang' upang maging malinaw at idiomatiko ang saklaw ng utos.
  - severity: medium
    issue: Ang 'mula sa harapan nito' ay hindi natural at ang 'nito' ay karaniwang pantukoy sa di-tao.
    rationale: Ang מִפָּנֶיהָ ay nangangahulugang paglayo mula kay Sarai/presensya niya. Ang 'palayo kay Sarai' ay likas na Filipino at pinananatili ang direksiyon ng pagtakas.
  - severity: low
    issue: Ang talababa ay nakadugtong sa 'Sarai' sa halip na sa pandiwang 'pinahirapan.'
    rationale: Ang talababa ay paliwanag sa וַתְּעַנֶּהָ; dapat nakatali ang pananda sa katumbas nitong salin.
