  yaml_path: translation/ot/genesis/016/001.yaml
  text: Sarai[a], Abram’s wife, had borne him no children, and she had an Egyptian servant woman whose name was Hagar.
translation:
  language: tl
  text: Si Sarai, na asawa ni Abram, ay hindi nagkaanak kay Abram. Mayroon siyang isang babaeng alipin na taga-Ehipto, na ang pangalan ay Hagar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “babaeng lingkod” o “katulong na babae.” Ang Hebreong שִׁפְחָה ay tumutukoy sa isang babaeng alipin o lingkod sa sambahayan; ginamit dito ang “babaeng alipin” upang maipakita ang kanyang nakataling katayuang panlipunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרַי
  choice: Si Sarai
  rationale: Ang וְ ay nag-uugnay sa naunang salaysay, ngunit hindi kailangang tumbasan ng tahasang “at” sa simula ng pangungusap sa natural na Filipino. Pinanatili ang pangalang Sarai ayon sa karaniwang transliterasyon.
- source_word: אֵשֶׁת אַבְרָם
  choice: na asawa ni Abram
  rationale: Natural na Filipino para sa construct chain na “asawa ni Abram,” habang malinaw na ipinakikilala kung sino si Sarai.
- source_word: לֹא יָלְדָה לוֹ
  choice: hindi nagsilang ng anak para sa kanya
  rationale: Pinananatili ng “nagsilang” ang diwa ng יָלַד at ng “para sa kanya” ang di-tuwirang layon na לוֹ. Idinagdag ang “anak,” na likas na ipinahihiwatig ng pandiwa sa kontekstong ito.
- source_word: וְלָהּ
  choice: Mayroon siyang
  rationale: Ang Hebreong konstruksyon ng pag-aari, literal na “at sa kanya ay mayroong,” ay natural na ipinapahayag sa Filipino bilang “Mayroon siyang.”
- source_word: שִׁפְחָה
  choice: aliping babae
  rationale: Ipinapakita nito ang nakataling katayuang panlipunan ng babae sa sambahayan, na mas tiyak kaysa sa mas malambot na “katulong.”
- source_word: מִצְרִית
  choice: Ehipsiyo
  rationale: Karaniwang pang-uring Filipino para sa isang babaeng mula sa Ehipto; ang kasarian ay malinaw na sa “aliping babae.”
- source_word: וּשְׁמָהּ הָגָר
  choice: na ang pangalan ay Hagar
  rationale: Malinaw at likas na pagtutumbas sa tahasang pahayag ng Hebreo tungkol sa pangalan ng babae.
