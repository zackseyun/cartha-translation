  verdict: revise
  source_fidelity: Ang “hindi nagsilang ng anak para sa kanya” ay masyadong literal at sa Filipino ay maaaring mangahulugang nagsilang para sa kapakinabangan ni Abram, sa halip na si Abram ang ama. Ang “hindi nagkaanak si Sarai kay Abram” ay likas at tumpak na naghahayag ng kahulugan ng לֹא יָלְדָה לוֹ. Ang “taga-Ehipto” ay malinaw na tumutumbas sa מִצְרִית nang walang alanganing paggamit ng pang-uring “Ehipsiyo” kasunod ng “aliping babae.”
  naturalness: Mas natural ang dalawang pangungusap na may “Hindi nagkaanak si Sarai kay Abram” at “Mayroon siyang isang babaeng alipin na taga-Ehipto, na ang pangalan ay Hagar.” Ang binagong ayos ay malinaw, makabago, at angkop sa marangal na salaysay.
  terminology: Pinanatili ang “babaeng alipin” upang malinaw ang nakataling katayuan na ipinahihiwatig ng שִׁפְחָה. Ginamit ang “taga-Ehipto” bilang likas at walang-kalabuan na pagtukoy sa pinagmulan ng babae. Pinanatili ang mga pangalang Sarai, Abram, at Hagar.
  issues:
  - severity: medium
    issue: Hindi likas at posibleng mali ang “nagsilang ng anak para sa kanya.”
    rationale: Bagaman sinusubukan nitong tumbasan ang לוֹ, ang “para sa kanya” sa modernong Filipino ay karaniwang nagpapahiwatig ng layon o benepisyo, hindi ng pagiging ama ng anak. Ang “nagkaanak ... kay Abram” ang likas na katumbas sa kontekstong mag-asawa.
  - severity: low
    issue: Hindi ganap na natural ang “aliping babaeng Ehipsiyo.”
    rationale: Maaaring maunawaan, ngunit mas idiomatiko at malinaw ang “babaeng alipin na taga-Ehipto.”
  revised_text: Si Sarai, na asawa ni Abram, ay hindi nagkaanak kay Abram. Mayroon siyang isang babaeng alipin na taga-Ehipto, na ang pangalan ay Hagar[a].
