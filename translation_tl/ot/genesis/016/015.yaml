source:
  edition: WLC
  text: וַ/תֵּ֧לֶד הָגָ֛ר לְ/אַבְרָ֖ם בֵּ֑ן וַ/יִּקְרָ֨א אַבְרָ֧ם שֶׁם בְּנ֛/וֹ אֲשֶׁר יָלְדָ֥ה הָגָ֖ר יִשְׁמָעֵֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/015.yaml
  text: Hagar bore a son to Abram[a], and Abram called the name of his son, whom Hagar bore, Ishmael.
translation:
  language: tl
  text: Nagsilang si Hagar ng isang anak na lalaki para kay Abram, at pinangalanan ni Abram na Ismael ang anak niyang isinilang ni Hagar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: nagsilang
  rationale: Ang Qal ng ילד na may babaeng simuno ay nangangahulugang manganak o magsilang; natural at marangal sa salaysay ang “nagsilang.”
- source_word: לְאַבְרָם
  choice: para kay Abram
  rationale: 'Ipinahihiwatig ng ל ang kaugnayan o benepisyaryo: ang batang isinilang ni Hagar ay anak para kay Abram. Mas natural ito sa modernong Tagalog kaysa “kay Abram” lamang.'
- source_word: בֵּן
  choice: isang anak na lalaki
  rationale: Tahasang tinutukoy ng בֵּן ang anak na lalaki, at ang “isang” ay angkop sa di-tiyak na pangngalan sa kontekstong ito.
- source_word: וַיִּקְרָא ... שֵׁם
  choice: pinangalanan
  rationale: Ang קרא שם ay idyomang Hebreo para sa pagbibigay ng pangalan. Ang “pinangalanan” ang natural na katumbas sa Tagalog at malinaw na pinananatili ang kilos.
- source_word: בְּנוֹ
  choice: ang anak niya
  rationale: Pinananatili ng “anak niya” ang hulaping paari na tumutukoy kay Abram.
- source_word: אֲשֶׁר יָלְדָה הָגָר
  choice: na isinilang ni Hagar
  rationale: Pinananatili nito ang sugnay na naglalarawan sa anak at ang tahasang muling pagbanggit kay Hagar.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Hebreo na יִשְׁמָעֵאל.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “pinangalanan” sa halip na literal ngunit mabigat na “tinawag ang pangalan” upang maihatid nang malinaw ang idyomang Hebreo, habang pinanatili ang pag-uulit kay Hagar at ang kaugnayan ng anak kay Abram.
