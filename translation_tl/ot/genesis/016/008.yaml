base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/008.yaml
  text: And he said[a], “Hagar, Sarai’s servant woman, where have you come from, and where are you going?” And she said[b], “I am fleeing from the presence of Sarai my mistress.”
translation:
  language: tl
  text: Sinabi niya, “Hagar, aliping babae[a] ni Sarai, saan ka nanggaling, at saan ka pupunta?” Sumagot siya, “Tumatakas ako mula sa harapan ni Sarai, na siyang babaeng amo ko[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “babaeng alipin.” Ang salitang Hebreo ay tumutukoy sa isang babaeng nasa katayuang alipin sa ilalim ni Sarai.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa harapan ni Sarai, na siyang babaeng amo ko.”
    reason: literal_rendering
lexical_decisions:
- source_word: שִׁפְחַת
  choice: aliping babae
  rationale: Tahas nitong ipinapahayag ang kasarian at katayuang alipin ni Hagar sa ilalim ni Sarai, nang hindi pinalalambot bilang karaniwang katulong lamang.
- source_word: אֵי מִזֶּה
  choice: saan ka nanggaling
  rationale: Likas na makabagong Tagalog para sa tanong tungkol sa pinanggalingan.
- source_word: וְאָנָה תֵלֵכִי
  choice: at saan ka pupunta
  rationale: Malinaw na tanong tungkol sa patutunguhan at likas sa tuwirang usapan.
- source_word: מִפְּנֵי
  choice: palayo sa
  rationale: Sa konteksto ng pagtakas, ipinahihiwatig ng idyomang literal na 'mula sa harapan/presensiya ng' ang paglayo kay Sarai; inilalagay sa talababa ang literal na anyo.
- source_word: גְּבִרְתִּי
  choice: aking among
  rationale: Ang pambabaeng pangngalan ay tumutukoy sa babaeng nakatataas at may kapangyarihan kay Hagar; natural sa Tagalog ang 'amo' at hindi nito ikinukubli ang ugnayang panlipunan.
- source_word: בֹּרַחַת
  choice: Tumatakas ako
  rationale: Pinananatili ng aspektong imperpektibo/progresibo ang kasalukuyan at nagpapatuloy na kilos.
- source_word: וַיֹּאמַר
  choice: Sinabi niya
  rationale: Hindi inuulit ng talata ang pagkakakilanlan ng tagapagsalita; ang panghalip ay sumusunod sa mismong anyo at sa naunang konteksto.
- source_word: הָגָר
  choice: Hagar
  rationale: Karaniwang transliterasyon ng pangalang pantangi.
- source_word: שָׂרַי
  choice: Sarai
  rationale: Karaniwang transliterasyon ng pangalang pantangi.
theological_decisions:
- issue: Paglalarawan sa katayuan ni Hagar
  choice: aliping babae
  alternative: babaeng lingkod / katulong
  rationale: Ang שִׁפְחָה ay nagsasaad ng babaeng nasa katayuang alipin o nakagapos na paglilingkod; hindi dapat palambutin ang tahasang hindi pantay na ugnayan.
- issue: Pagpapakilala sa tagapagsalita bilang ang anghel ng PANGINOON
  choice: Sinabi niya
  alternative: Sinabi ng anghel ng PANGINOON
  rationale: Malinaw sa naunang talata ang tinutukoy, ngunit hindi inuulit ng Hebreo sa talatang ito ang titulo; pinananatili rito ang lokal na pagkakasabi.
- issue: Pagpapakahulugan sa מִפְּנֵי
  choice: palayo sa aking among si Sarai
  alternative: mula sa harapan ng aking among si Sarai
  rationale: Ang pangunahing teksto ay naghahatid ng idyomatikong diwa ng pagtakas nang hindi ipinapalagay kung takot, pagmamalupit, o ibang sanhi ang nangingibabaw; ang literal na hugis ay nasa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “aliping babae” upang ihayag ang katayuang panlipunan ni Hagar, at “palayo sa” upang natural na maipahayag ang idyomang Hebreo habang pinananatili sa talababa ang literal na anyo.
