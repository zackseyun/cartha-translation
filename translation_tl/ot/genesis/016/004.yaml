  yaml_path: translation/ot/genesis/016/004.yaml
  text: He went in to Hagar[a], and she conceived. When she saw that she had conceived, her mistress was despised in her eyes.
translation:
  language: tl
  text: Sumiping si Abram kay Hagar, at naglihi siya. Nang makita ni Hagar na naglihi siya, naging hamak sa paningin niya ang kanyang among babae.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hinamak niya ang kanyang among babae.” Literal na inilalarawan ng Hebreo na ang among babae ay naging hamak sa pagtataya ni Hagar; maaari rin itong ipahayag bilang paghamak ni Hagar sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל הָגָר
  choice: Nakipagtalik si Abram kay Hagar
  rationale: Ang בוא אל sa kontekstong ito ay isang Hebreong idyoma para sa pakikipagtalik. Ginawang tahasan ngunit marangal sa makabagong Tagalog; nilinaw ang ipinahihiwatig na simuno mula sa naunang konteksto.
- source_word: וַתַּהַר / הָרָתָה
  choice: nagdalang-tao / nagdalang-tao
  rationale: Pinananatili ang pag-uulit ng ugat na הרה at ang pagkakasunod ng paglilihi at pagkabatid ni Hagar sa kanyang kalagayan.
- source_word: וַתֵּרֶא כִּי
  choice: Nang makita ... na
  rationale: Natural na ipinahahayag ang temporal na daloy at ang pagkaunawa ni Hagar sa kanyang pagdadalang-tao nang hindi dinaragdagan ang diwa.
- source_word: וַתֵּקַל
  choice: hinamak niya
  rationale: Sa konteksto, ang qal na anyo ng קלל ay nagsasaad na naging mababa o walang halaga ang amo sa paningin ni Hagar. Ang aktibong Tagalog ay natural at ipinapakita ang saloobin ni Hagar, ngunit tinatala sa talababa ang mas pormal na alternatibo.
- source_word: גְּבִרְתָּהּ
  choice: ang kanyang amo
  rationale: Ang גברת ay babaeng nakatataas o among babae. Sa Tagalog, ang “amo” ay likas at hindi nangangailangan ng markang pangkasarian.
- source_word: בְּעֵינֶיהָ
  choice: sa kanyang paningin
  rationale: Karaniwang idyoma ito para sa pagtataya o pagtingin; ang diwa ay isinama sa aktibong “hinamak niya,” habang pinananatili sa talababa ang mas malapit na anyo.
theological_decisions:
- issue: Kung ang huling sugnay ay naglalarawan ng pagbabago kay Sarai o ng paghamak ni Hagar sa kanya
  choice: hinamak niya ang kanyang amo
  alternative: naging hamak sa kanyang paningin ang kanyang amo
  rationale: Ang Hebreo ay maaaring pormal na basahing ang amo ang naging mababa sa paningin ni Hagar, ngunit ang pragmatikong diwa ay ang paghamak ni Hagar. Hindi ito pinalalawak upang ipahiwatig ang anumang karagdagang kilos o pang-aabuso.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakipagtalik” bilang natural na katumbas ng Hebreong eupemismo at “amo” para sa ugnayang panlipunan ni Hagar kay Sarai.
