  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/קָרָ֤את שְׁמ/וֹ֙ יִשְׁמָעֵ֔אל כִּֽי שָׁמַ֥ע יְהוָ֖ה אֶל עָנְיֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/011.yaml
  text: Then the angel of Yahweh said to her[a], “Behold, you are pregnant and will bear a son, and you shall call his name Ishmael, because Yahweh has heard your affliction.”
translation:
  language: tl
  text: Pagkatapos, sinabi sa kanya ng anghel ni Yahweh[a], “Narito, nagdadalang-tao ka at manganganak ka ng isang anak na lalaki. Pangangalanan mo siyang Ismael, sapagkat dininig ni Yahweh ang iyong pagdurusa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Ang מַלְאַךְ ay maaaring mangahulugang sugo o anghel. Sa kontekstong ito, ang tradisyonal at likas na saling “anghel” ay angkop para sa makalangit na sugo, habang pinananatili ang alternatibo sa talababa.
- source_word: הִנָּךְ הָרָה
  choice: Narito, nagdadalang-tao ka
  rationale: Ang הִנֵּה ay pantawag-pansin sa isang maringal na pahayag; ang “Narito” ay dignificado at pamilyar sa estilong biblikal. Ang “nagdadalang-tao” ay malinaw at magalang na modernong Tagalog para sa הָרָה.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: at manganganak ka ng isang lalaki
  rationale: Ipinahahayag ng anyo ng pandiwa ang nalalapit na kapanganakan. Ang “isang lalaki” ay natural na katumbas ng בֵּן sa pormulang ito.
- source_word: וְקָרָאת שְׁמוֹ
  choice: Pangangalanan mo siyang
  rationale: Natural sa modernong Tagalog ang “pangangalanan mo siyang” at tumpak nitong naihahatid ang Hebreong pormula ng pagbibigay ng pangalan nang hindi nagiging malamya.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog; ipinapaliwanag ng kasunod na sugnay ang kaugnayan ng pangalan sa pandiwang “duminig.”
- source_word: כִּי שָׁמַע יְהוָה
  choice: sapagkat dininig ni Yahweh
  rationale: Ang כִּי ay nagbibigay ng dahilan sa ipinag-utos na pangalan. Ang “dinig” ay nagpapanatili sa larong-salita sa pangalang Ismael, at ang aspektong ganap ng pandiwa ay likas na naipahahayag ng “dininig.”
- source_word: עָנְיֵךְ
  choice: ang iyong pagdurusa
  rationale: Saklaw ng עֳנִי ang paghihirap, kaapihan, at abang kalagayan. Hindi nililimitahan ng “pagdurusa” ang kahulugan sa damdamin lamang o sa kahihiyan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nakasulat sa Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Pagkakakilanlan ng מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: sugo ni Yahweh
  rationale: Pinananatili ng salin ang karaniwang kahulugan sa konteksto ngunit hindi nito kinikilala ang anghel bilang isang partikular na persona ng Diyos o nilulutas ang teolohikal na tensiyong hindi tahasang nilulutas ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at bahagyang maringal. Ginamit ang “Narito” upang mapanatili ang pantawag-pansin ng Hebreo, at “Pangangalanan mo siyang” upang maging natural ang pormula ng pagbibigay ng pangalan.
