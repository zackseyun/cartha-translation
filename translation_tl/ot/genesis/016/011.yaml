  naturalness: Malinaw at angkop ang register. Mas natural at mas tumpak sa pormulang pangkapanganakan ang “isang anak na lalaki” kaysa “isang lalaki.”
  terminology: Wasto ang “anghel ni Yahweh,” kasama ang talababa para sa “sugo ni Yahweh.” Ang “Yahweh,” “Ismael,” “Narito,” at “pagdurusa” ay angkop at hindi nagdaragdag ng interpretasyong teolohikal.
