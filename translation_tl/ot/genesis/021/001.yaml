  yaml_path: translation/ot/genesis/021/001.yaml
  text: Yahweh visited Sarah as he had said[a], and Yahweh did for Sarah as he had spoken.
translation:
  language: tl
  text: Binalingan ni Yahweh si Sara, ayon sa sinabi niya,[a] at ginawa ni Yahweh para kay Sara ang ipinahayag niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dinalaw.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagbaling ng Diyos ng kanyang pansin sa isang tao upang kumilos para sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: פָּקַד
  choice: binalingan
  rationale: Ipinahihiwatig nito na itinuon ng Diyos ang kanyang pansin kay Sara upang kumilos para sa kanya, nang hindi nililimitahan ang pandiwa sa isang pisikal na pagdalaw.
- source_word: אֶת שָׂרָה
  choice: si Sara
  rationale: Ginagamit ang pantukoy na “si” para sa tiyak na taong tuwirang layon ng pandiwa.
- source_word: כַּאֲשֶׁר אָמָר
  choice: ayon sa sinabi niya
  rationale: Natural na ipinapakita sa Tagalog na ang pagkilos ay katuparan ng naunang sinabi ng Diyos.
- source_word: וַיַּעַשׂ
  choice: ginawa
  rationale: Pinananatili ang malawak at hindi espesipikong kahulugan ng karaniwang pandiwang Hebreo.
- source_word: לְשָׂרָה
  choice: para kay Sara
  rationale: Inilalarawan ang kilos bilang ginawa alang-alang at sa kapakinabangan ni Sara.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: ayon sa ipinahayag niya
  rationale: Pinananatili ang bahagyang pagkakaiba ng דִּבֵּר sa naunang אָמַר nang hindi tahasang pinapalitan ito ng mas interpretatibong “ipinangako.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang ginagamit sa Hebreo; pinananatili ito sa halip na palitan ng isang titulo.
- issue: Saklaw ng pagkilos na ipinahihiwatig ng פָּקַד
  choice: binalingan
  alternative: dinalaw
  rationale: Pinananatili ang diwa ng mapagkalingang pansin na humahantong sa pagkilos, ngunit hindi pa tinutukoy sa talatang ito mismo ang eksaktong bunga na malinaw na ilalahad sa kasunod na talata.
translation_notes:
  register: Makabago at marangal na Filipino; pinanatili ang pag-uulit ng “Yahweh” at ang magkatulad na ayos ng dalawang sugnay upang masalamin ang diin at paralelismo ng Hebreo.
