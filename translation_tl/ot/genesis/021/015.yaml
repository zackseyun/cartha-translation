  text: When the water in the skin was gone[b][a], she cast the boy under one of the bushes.
translation:
  language: tl
  text: Nang maubos ang tubig sa sisidlang yari sa balat[a], inihagis[b] niya ang bata sa ilalim ng isa sa mga palumpong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sisidlang balat para sa tubig.” Ang salitang Hebreo ay tumutukoy sa sisidlang yari sa balat ng hayop.
    reason: lexical_alternative
  - marker: b
    text: O “itinapon.” Mas malakas ang pandiwang Hebreo kaysa sa simpleng “inilagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְלוּ
  choice: maubos
  rationale: Ang כלה ay nagsasaad na naubos o sumapit sa katapusan ang laman; natural sa Filipino ang “maubos ang tubig.”
- source_word: הַמַּיִם
  choice: ang tubig
  rationale: Bagaman anyong maramihan sa Hebreo, karaniwang pangngalang di-mabilang ang מַיִם at likas na isinasalin bilang “tubig.”
- source_word: מִן הַחֵמֶת
  choice: sa sisidlang-balat
  rationale: Ang חֵמֶת ay sisidlang yari sa balat ng hayop. Ipinahihiwatig ng מִן na ang tubig sa sisidlan ang naubos; malinaw at maikli ang “sa sisidlang-balat.”
- source_word: וַתַּשְׁלֵךְ
  choice: inihagis
  rationale: Karaniwang malakas ang kahulugan ng שלך—“ihagis” o “itapon”—kaya hindi ito pinahina tungo sa simpleng “inilagay.” Pinananatili ng “inihagis” ang biglaan at mabigat na kilos sa tagpo.
- source_word: אֶת הַיֶּלֶד
  choice: ang bata
  rationale: Ang יֶלֶד ay bata o batang lalaki. Sapat ang “bata” sa Filipino dahil malinaw sa konteksto ang tinutukoy at hindi ito lipas sa gamit.
- source_word: תַּחַת
  choice: sa ilalim ng
  rationale: Tuwirang katumbas ng תַּחַת ang “sa ilalim ng.”
- source_word: אַחַד הַשִּׂיחִם
  choice: isa sa mga palumpong
  rationale: Ang שִׂיחַ ay mababang halamang makahoy, palumpong, o bush. Dignified at madaling maunawaan ang “palumpong” sa salaysay.
