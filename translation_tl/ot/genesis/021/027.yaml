base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/027.yaml
  text: So Abraham took sheep and cattle and gave them to Abimelech[a], and the two of them made a covenant.
translation:
  language: tl
  text: Kaya kumuha si Abraham ng mga tupa at baka at ibinigay ang mga iyon kay Abimelec. At silang dalawa ay nakipagtipan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pumutol ng tipan,” isang karaniwang idyomang Hebreo para sa pormal na pakikipagtipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kumuha
  rationale: Karaniwang kahulugan ng Qal wayyiqtol ng לקח ang ‘kumuha.’ Likas ito sa salaysay at pinananatili ang payak na sunod-sunod na kilos.
- source_word: צֹאן
  choice: mga tupa
  rationale: Tumutukoy ang צֹאן sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Ang ‘mga tupa’ ay malinaw at natural na katambal ng ‘baka’ sa kontekstong ito, nang hindi dinaragdagan ang detalye ng teksto.
- source_word: וּבָקָר
  choice: baka
  rationale: Ang בָּקָר ay tumutukoy sa malalaking hayop ng kawan, lalo na sa mga baka. Ang ‘baka’ ang karaniwan at natural na katumbas sa Filipino.
- source_word: וַיִּתֵּן
  choice: ibinigay
  rationale: Ang נתן dito ay payak na nangangahulugang ‘magbigay.’ Hindi kailangan ng salitang magpapahiwatig ng seremonyang hindi tahasang binanggit sa Hebreo.
- source_word: לַאֲבִימֶלֶךְ
  choice: kay Abimelec
  rationale: Isinalin ang pang-ukol na ל bilang ‘kay,’ at ginamit ang nakaugaliang anyong Filipino ng pangalang Abimelec.
- source_word: וַיִּכְרְתוּ
  choice: nakipagtipan
  rationale: Bahagi ito ng idyomang כרת ברית, literal na ‘pumutol ng tipan.’ Ang ‘nakipagtipan’ ay malinaw at likas sa modernong Filipino, samantalang inilalahad sa talababa ang literal na larawan ng Hebreo.
- source_word: שְׁנֵיהֶם
  choice: silang dalawa
  rationale: Tahasang tinutukoy ng Hebreo ang dalawang panig. Pinananatili ng ‘silang dalawa’ ang diin at bilang.
- source_word: בְּרִית
  choice: tipan
  rationale: Ang בְּרִית ay mahalagang terminong biblikal. Pinananatili ng ‘tipan’ ang malawak nitong gamit at kabuluhan, bagaman ang tipang ito ay may katangian din ng isang kasunduan.
theological_decisions:
- issue: Paglalarawan sa idyomang כרת ברית
  choice: nakipagtipan
  alternative: pumutol ng tipan
  rationale: Ang literal na ‘pumutol ng tipan’ ay hindi likas na idyoma sa Filipino at maaaring makapagpahiwatig na sinira ang tipan. Ginamit sa pangunahing teksto ang malinaw na kahulugan ng idyoma, habang pinanatili sa talababa ang literal na anyo para sa katapatan at pagiging masusuri ng salin.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang ‘nakipagtipan’ upang maging natural at malinaw, at iniwasan ang literal na pariralang maaaring mapagkamalang paglabag o pagputol sa isang umiiral na tipan.
