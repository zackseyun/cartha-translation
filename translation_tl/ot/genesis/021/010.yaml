base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/010.yaml
  text: So she said to Abraham[a], “Drive out this servant woman and her son, for the son of this servant woman will not inherit with my son Isaac.”
translation:
  language: tl
  text: Kaya sinabi niya kay Abraham, “Palayasin[a] mo ang aliping babaeng ito at ang anak niya, sapagkat hindi magmamana ang anak ng aliping babaeng ito kasama ng anak ko, si Isaac.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Itaboy ang aliping babaeng ito at ang anak niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר לְאַבְרָהָם
  choice: Kaya sinabi niya kay Abraham
  rationale: Ipinahahayag ng pang-ugnay na waw ang pagpapatuloy o bunga sa salaysay; natural sa modernong Tagalog ang “Kaya” sa kontekstong ito.
- source_word: גָּרֵשׁ
  choice: Palayasin mo
  rationale: Malakas na pautos ang pandiwa at tumutukoy sa sapilitang pagpapaalis, hindi lamang sa mahinahong pagpapauwi.
- source_word: הָאָמָה הַזֹּאת
  choice: ang aliping babaeng ito
  rationale: Ipinakikita ng אָמָה ang mababang katayuan bilang babaeng alipin; pinananatili rin ng “ito” ang mariing paglayo at paghamak sa pananalita.
- source_word: וְאֶת בְּנָהּ
  choice: at ang anak niya
  rationale: Tuwirang isinasalin ang layong tuwirang may panghalip na paari nang natural sa Tagalog.
- source_word: כִּי לֹא יִירַשׁ
  choice: sapagkat hindi magmamana
  rationale: Ang כִּי ay nagbibigay ng dahilan, at ang יִירַשׁ ay tumutukoy sa pagtanggap ng mana o pagiging tagapagmana.
- source_word: בֶּן הָאָמָה הַזֹּאת
  choice: ang anak ng aliping babaeng ito
  rationale: Pinananatili ang inulit at mariing parirala ng Hebreo sa halip na palitan ng pangalan o gawing simpleng panghalip.
- source_word: עִם בְּנִי עִם יִצְחָק
  choice: kasama ng anak ko—kasama ni Isaac
  rationale: Pinananatili ang pag-uulit ng עִם at ang appositional na diin kay Isaac, habang ginagamit ang gitling upang maging malinaw at natural sa Tagalog.
theological_decisions:
- issue: Saklaw ng pahayag tungkol sa mana
  choice: Pinanatili ang tuwirang “hindi magmamana ... kasama” nang hindi ipinapaliwanag ang legal o tipolohikal na kahulugan.
  alternative: Ipaliwanag bilang hindi pakikibahagi sa tipan o sa partikular na ari-arian ni Abraham.
  rationale: Hindi tahasang nililinaw ng talata ang buong saklaw ng mana; ang pagpapaliwanag nito sa salin ay magpapasok ng interpretasyong higit sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “aliping babae” upang hayagang ipakita ang bonded status, at pinanatili ang matalim at mapaglayong tono ng mismong pananalita nang hindi ito pinapalambot.
