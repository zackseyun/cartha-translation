revisions:
- from: Kaya sinabi niya kay Abraham, “Palayasin mo ang aliping babaeng ito at ang anak niya, sapagkat hindi magmamana ang anak ng aliping babaeng ito kasama ng anak ko—kasama ni Isaac.”
  to: Kaya sinabi niya kay Abraham, “Palayasin[a] mo ang aliping babaeng ito at ang anak niya, sapagkat hindi magmamana ang anak ng aliping babaeng ito kasama ng anak ko, si Isaac.”
  rationale: Pinalitan ang hindi idiomatikong pag-uulit na “kasama ni Isaac” ng natural na appositive na “si Isaac,” habang pinananatili ang diin na ang tinutukoy na anak ay si Isaac. Idinagdag at wastong ikinabit ang talababa para sa alternatibong pagsasalin ng גָּרֵשׁ.
