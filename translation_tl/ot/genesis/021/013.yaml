  text: וְ/גַ֥ם אֶת בֶּן הָ/אָמָ֖ה לְ/ג֣וֹי אֲשִׂימֶ֑/נּוּ כִּ֥י זַרְעֲ/ךָ֖ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/013.yaml
  text: And I will also make the son of the servant woman into a nation[a], because he is your offspring.
translation:
  language: tl
  text: At gagawin ko ring isang bansa ang anak na lalaki ng babaeng alipin[a], sapagkat supling mo siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anak ng babaeng alipin” o “anak na lalaki ng babaeng lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: At ... rin
  rationale: Pinananatili nito ang pagpapatuloy at pandagdag na diin ng וְגַם sa natural na ayos ng makabagong Tagalog.
- source_word: אֶת בֶּן הָאָמָה
  choice: ang anak ng aliping babae
  rationale: Ang בֶּן ay 'anak na lalaki,' ngunit malinaw na ang kasarian sa konteksto at sa panghalip na 'siya'; ang אָמָה ay tumutukoy sa babaeng nasa kalagayang alipin, kaya hindi pinalalambot bilang karaniwang katulong lamang.
- source_word: לְגוֹי
  choice: isang bansa
  rationale: 'Kasama ng אֲשִׂימֶנּוּ, ipinahihiwatig ng לְ ang resultang kalagayan: bubuo mula sa kaniya ng isang bansa. Likas sa Tagalog ang ''gagawin ... isang bansa.'''
- source_word: אֲשִׂימֶנּוּ
  choice: gagawin ko rin
  rationale: Sa kontekstong ito, ang שׂים ay nangangahulugang gawin o itatag sa isang kalagayan; ang 'gagawin' ang pinakanatural na katumbas.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ito ng dahilan ng pangako. Ang 'sapagkat' ay malinaw, marangal, at angkop sa kasalukuyang salin-Bibliya.
- source_word: זַרְעֲךָ
  choice: iyong supling
  rationale: Ang זֶרַע ay maaaring 'binhi,' 'supling,' o 'mga inapo.' Dito ay tumutukoy ito sa mismong anak ni Abraham; pinananatili ng 'supling' ang saklaw ng salitang Hebreo nang hindi ginagawang tahasang maramihan.
- source_word: הוּא
  choice: siya ay
  rationale: Pinananatili ang hayag na panghalip sa Hebreo at ang bahagyang diin nito nang hindi dinaragdagan ng labis na 'siya mismo.'
theological_decisions:
- issue: Paglalarawan sa kalagayang panlipunan ng אָמָה
  choice: aliping babae
  alternative: babaeng lingkod / utusang babae
  rationale: Mahalaga sa salaysay ang di-malayang kalagayan ni Hagar. Ang 'aliping babae' ay tahasang nagpapakita nito at hindi pinapahina ang panlipunang realidad ng teksto.
- issue: Saklaw ng זַרְעֲךָ
  choice: iyong supling
  alternative: iyong inapo / iyong binhi
  rationale: Ang pangungusap ay tumutukoy kay Ismael bilang anak ni Abraham, habang ang salitang Hebreo ay may mas malawak na saklaw kaysa sa simpleng 'anak.' Ang 'supling' ay nagpapanatili sa ugnayang ito nang hindi nagpapasok ng karagdagang interpretasyong doktrinal.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang 'aliping babae' upang malinaw na maipakita ang bonded status; ang 'sapagkat' at 'supling' ay pormal ngunit madaling maunawaan. Ang marker na [a] ay nasa pangunahing teksto at tumutugma sa talababa.
