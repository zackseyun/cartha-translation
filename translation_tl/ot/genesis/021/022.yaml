base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/022.yaml
  text: And it happened at that time that Abimelech and Phicol[a], the commander of his army, said to Abraham[b], “God is with you in all that you do.”
translation:
  language: tl
  text: Noong panahong iyon, sinabi nina Abimelec at Picol, ang kumander ng hukbo ni Abimelec, kay Abraham[b], “Kasama mo ang Diyos[a] sa lahat ng ginagawa mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, bagaman hindi gaanong malamang sa kontekstong ito, “isang diyos ang kasama mo.” Maaaring maunawaan sa ibang paraan ang salitang Hebreo na אֱלֹהִים sa ilang konteksto, ngunit dito ay pinakamalamang na tumutukoy ito sa Diyos na nagpapala kay Abraham.
    reason: alternative_reading
  - marker: b
    text: 'Sa mas literal na ayos ng Hebreo: “sinabi kay Abraham, na sinasabi.” Isa itong karaniwang pormula sa Hebreo para ipakilala ang tuwirang pananalita.'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: Nang panahong iyon
  rationale: Likas na panandang pasalaysay sa modernong Tagalog; ipinahihiwatig nito ang paglipat sa bagong tagpo nang hindi gumagamit ng makalumang parirala.
- source_word: אֲבִימֶלֶךְ וּפִיכֹל
  choice: Abimelec at Picol
  rationale: Isina-Tagalog ang baybay ng mga pangalang Hebreo ayon sa karaniwang anyo sa mga saling Filipino.
- source_word: שַׂר צְבָאוֹ
  choice: pinuno ng hukbo ni Abimelec
  rationale: Malinaw na tumutukoy ang parirala sa tungkuling militar ni Picol. Inulit ang pangalang Abimelec upang maiwasan ang malabong reperensiya ng panghalip na 'kanyang' sa Tagalog.
- source_word: וַיֹּאמֶר ... אֶל־אַבְרָהָם לֵאמֹר
  choice: sinabi ... kay Abraham
  rationale: Natural na pagpapakilala ng tuwirang pananalita sa Tagalog. Hindi na isinalin nang hiwalay ang pormulang לֵאמֹר dahil magiging paulit-ulit ang 'sinabi ... na sinasabi'.
- source_word: אֱלֹהִים עִמְּךָ
  choice: Kasama mo ang Diyos
  rationale: Ipinapahayag ng עִם ang presensiya at pagsang-ayon o pagtulong. Ang 'Kasama mo ang Diyos' ay tuwiran, natural, at hindi nagdaragdag ng paliwanag sa mismong talata.
- source_word: בְּכֹל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: sa lahat ng ginagawa mo
  rationale: Pinananatili ang ganap na saklaw ng בְּכֹל at ang karaniwang o nagpapatuloy na diwa ng participle עֹשֶׂה.
theological_decisions:
- issue: Tinutukoy ng אֱלֹהִים sa sinabi ni Abimelec
  choice: ang Diyos
  alternative: isang diyos; mga diyos
  rationale: Bagaman maaaring magkaroon ng ibang bilang o di-tiyak na diwa ang אֱלֹהִים sa ilang konteksto, pinakamalamang dito na kinikilala ni Abimelec ang Diyos na nagpapala at sumasama kay Abraham. Inilalagay sa talababa ang tunay ngunit hindi gaanong malamang na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang payak na ayos ng pangungusap at nilinaw ang tinutukoy ng panghalip sa pariralang tungkol sa hukbo. Pinanatili sa talababa ang leksikal na posibilidad sa אֱלֹהִים at ang literal na pormula ng pagsasalita sa Hebreo.
