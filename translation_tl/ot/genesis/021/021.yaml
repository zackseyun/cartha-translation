  yaml_path: translation/ot/genesis/021/021.yaml
  text: He lived in the wilderness of Paran[b][a], and his mother took a wife for him from the land of Egypt.
translation:
  language: tl
  text: Nanirahan[a] siya sa ilang ng Paran, at kumuha ang kanyang ina para sa kanya ng isang asawa[b] mula sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Tumira siya sa ilang ng Paran.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “kumuha ang kanyang ina para sa kanya ng isang babae mula sa lupain ng Ehipto”; ipinahihiwatig ng konteksto na kaayusan ito para sa pag-aasawa, kaya “asawa” ang ginamit sa pangunahing teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Nanirahan siya
  rationale: Ang יָשַׁב ay maaaring mangahulugang umupo, manatili, manirahan, o tumira. Ang “nanirahan” ay likas sa makabagong Tagalog at hindi nagpapahiwatig ng permanenteng paninirahan nang higit sa hinihingi ng Hebreo.
- source_word: בְּמִדְבַּר פָּארָן
  choice: sa ilang ng Paran
  rationale: Ang מִדְבָּר ay malawak na lupaing hindi matao at maaaring isaling “ilang” o “disyerto.” Ang “ilang” ay mas malawak at angkop sa salaysay; pinanatili ang Paran bilang pangalan ng lugar.
- source_word: וַתִּקַּח ... לוֹ
  choice: ikuha siya
  rationale: Sa kontekstong ito, ang לָקַח kasama ng לוֹ ay tumutukoy sa pagkilos ng ina upang kumuha o humanap ng mapapangasawa para sa kanya. Ang “ikuha siya” ay natural na Tagalog at pinananatili ang diwa ng para sa kanyang kapakanan.
- source_word: אִמּוֹ
  choice: ng kanyang ina
  rationale: Tuwirang salin ng tahasang pagtukoy sa ina at ng kaugnayang pag-aari.
- source_word: אִשָּׁה
  choice: isang asawa
  rationale: Maaaring mangahulugang “babae” o “asawa” ang אִשָּׁה. Ipinakikita ng konteksto ng pagkuha para sa lalaki na mapapangasawa ang tinutukoy.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: mula sa lupain ng Ehipto
  rationale: Tahasan sa Hebreo ang אֶרֶץ, “lupain,” kaya pinanatili ito sa salin sa halip na paikliin lamang sa “mula sa Ehipto.”
