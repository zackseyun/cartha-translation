  text: וְ/אַבְרָהָ֖ם בֶּן מְאַ֣ת שָׁנָ֑ה בְּ/הִוָּ֣לֶד ל֔/וֹ אֵ֖ת יִצְחָ֥ק בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/005.yaml
  text: And Abraham was a hundred years old when Isaac his son was born to him[a].
translation:
  language: tl
  text: Isandaang taon si Abraham nang isilang sa kanya ang anak niyang si Isaac.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “At si Abraham ay anak ng isang daang taon nang isilang sa kanya si Isaac na anak niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: si Abraham
  rationale: Hindi kailangang isalin nang hiwalay ang וְ sa Filipino sa kontekstong ito; nananatiling natural ang pagpapatuloy ng salaysay nang walang idinagdag na mas malakas na panandang pandiskurso.
- source_word: בֶּן מְאַת שָׁנָה
  choice: Isandaang taon
  rationale: Ang literal na idyomang Hebreo na ‘anak ng isang daang taon’ ay tumutukoy sa edad. Ang ‘Isandaang taon si Abraham’ ay natural at malinaw sa modernong Filipino.
- source_word: בְּ/הִוָּלֶד
  choice: nang isilang
  rationale: Ang בְּ na kasama ng infinitive construct na Niphal ng ילד ay nagpapahayag ng panahong pangyayari at may pasibong diwa; ang ‘nang isilang’ ay natural na katumbas nito.
- source_word: ל֔/וֹ
  choice: sa kanya
  rationale: Ipinakikita ng parirala na kay Abraham isinilang ang bata, nang hindi dinaragdagan ang kahulugan ng ‘para sa kanya.’
- source_word: אֵת יִצְחָק
  choice: si Isaac
  rationale: Ang אֵת ay pananda ng tiyak na layon at walang hiwalay na salin; ginamit ang karaniwang anyong Filipino ng pangalang Isaac.
- source_word: בְּנֽ/וֹ
  choice: ang anak niyang
  rationale: Pinananatili nito ang ugnayang filial at ang paglalapat ng ‘anak niya’ kay Isaac sa isang natural na ayos sa Filipino.
