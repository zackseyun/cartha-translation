  text: And she said[b][a], “Who would have said to Abraham that Sarah would nurse children? For I have borne a son in his old age.”
translation:
  language: tl
  text: At sinabi niya, “Sino ang makapagsasabi noon kay Abraham na magpapasuso si Sara ng mga anak?[a] Sapagkat nagsilang ako ng isang anak na lalaki sa katandaan ni Abraham.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak na lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili nito ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi dinaragdagan ang temporal na diwa.
- source_word: מִי מִלֵּל לְאַבְרָהָם
  choice: Sino ang makapagsasabi noon kay Abraham
  rationale: Ipinahahayag ng retorikal na tanong ang pagkamangha sa isang kinalabasang hindi inaasahan; natural sa Filipino ang potensiyal na anyong “makapagsasabi,” at ipinahihiwatig ng “noon” ang tanaw pabalik.
- source_word: הֵינִיקָה
  choice: magpapasuso
  rationale: Tuwirang inilalarawan ng Hiphil ng ינק ang pagpapasuso ng isang ina; karaniwan at malinaw ang pandiwang Filipino.
- source_word: בָנִים
  choice: mga anak
  rationale: Bagaman panlalaking maramihan ang literal na anyo, natural sa kontekstong ito ang “mga anak”; nililinaw ng kasunod na בֵן na lalaki ang partikular na anak.
- source_word: שָׂרָה
  choice: Sara
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa modernong Bibliyang Filipino.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala rito ng כִּי ang paliwanag o batayan ng naunang pahayag, hindi pangunahing isang pagsalungat.
- source_word: יָלַדְתִּי
  choice: nagsilang ako
  rationale: Natural, marangal, at tumpak na katumbas ng ganap na pandiwang tumutukoy sa panganganak.
- source_word: בֵן
  choice: isang anak na lalaki
  rationale: Malinaw na pinananatili ang tiyak na kasariang ipinahahayag ng בֵן.
- source_word: לִזְקֻנָיו
  choice: sa kaniyang katandaan
  rationale: Natural na Filipino para sa pagtukoy sa matandang gulang ni Abraham habang pinananatili ang ugnayang ipinahihiwatig ng parirala.
