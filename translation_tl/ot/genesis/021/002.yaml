  yaml_path: translation/ot/genesis/021/002.yaml
  text: So Sarah conceived and bore a son to Abraham in his old age[b][a], at the appointed time that God had spoken to him.
translation:
  language: tl
  text: Kaya naglihi si Sara at nagsilang ng isang anak na lalaki kay Abraham sa katandaan ni Abraham, sa takdang panahon na binanggit ng Diyos kay Abraham.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: naglihi
  rationale: Tumpak at likas na katumbas ng Hebreong pandiwang tumutukoy sa paglilihi o pagbubuntis.
- source_word: וַתֵּלֶד
  choice: nagsilang
  rationale: Dignificado at karaniwang salitang Filipino para sa panganganak sa salaysay.
- source_word: בֵּן
  choice: isang anak na lalaki
  rationale: Malinaw na ipinahahayag ang kasarian ng anak gaya ng nasa Hebreo.
- source_word: לְאַבְרָהָם
  choice: para kay Abraham
  rationale: Inilalarawan ng pariralang Hebreo na si Abraham ang ama at tumanggap ng anak; likas sa Filipino ang ganitong gamit ng “para kay.”
- source_word: לִזְקֻנָיו
  choice: nang matanda na ito
  rationale: Ipinahahayag ang kalagayan ng katandaan ni Abraham nang hindi ipinahihiwatig na layunin o pakinabang ang katandaan.
- source_word: לַמּוֹעֵד
  choice: sa takdang panahon
  rationale: Pinananatili ang diwa ng isang itinakda o tiyak na panahon.
- source_word: אֲשֶׁר דִּבֶּר אֹתוֹ אֱלֹהִים
  choice: sinabi sa kanya ng Diyos
  rationale: Iniuugnay ang takdang panahon sa naunang sinabi ng Diyos kay Abraham nang hindi dinaragdagan ang nilalaman ng sinabi.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tuwirang katumbas ng karaniwang katawagan sa Diyos sa talata.
- source_word: וַ
  choice: Kaya
  rationale: Ipinakikita ang pagpapatuloy at katuparan ng naunang pangako sa natural na daloy ng modernong Filipino.
theological_decisions:
- issue: Paglalarawan sa katuparan ng salita ng Diyos sa itinakdang panahon
  choice: sa takdang panahong sinabi sa kanya ng Diyos
  alternative: sa itinakdang panahon na tungkol dito ay nagsalita sa kanya ang Diyos
  rationale: Pinananatili ang ugnayan ng pagsilang sa naunang sinabi ng Diyos at sa takdang panahon, nang hindi nagdaragdag ng paliwanag tungkol sa paraan o layunin ng katuparan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa salaysay. Ginamit ang “ito” upang ang katandaan ay malinaw na tumukoy kay Abraham, hindi kay Sara.
