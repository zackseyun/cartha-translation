    issue: Ang “para kay Abraham” ay posibleng magpahiwatig ng layunin o pakinabang.
    rationale: Ang לְאַבְרָהָם ay dative sa salaysay ng panganganak; mas neutral at mas tumpak na Filipino ang “kay Abraham.”
  - severity: medium
    issue: Malabo ang ugnayan ng “sinabi sa kanya ng Diyos” sa “takdang panahon.”
    rationale: Maaaring mabasa na nagsalita ang Diyos sa takdang panahong iyon. Ang Hebreong sugnay ay tumutukoy sa panahon bilang bagay na napag-usapan/binanggit ng Diyos kay Abraham.
  revised_text: Kaya naglihi si Sara at nagsilang ng isang anak na lalaki kay Abraham sa katandaan ni Abraham, sa takdang panahon na binanggit ng Diyos kay Abraham.
