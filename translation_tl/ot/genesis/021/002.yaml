- from: Kaya naglihi si Sara at nagsilang ng isang anak na lalaki para kay Abraham nang matanda na ito, sa takdang panahong sinabi sa kanya ng Diyos.
  to: Kaya naglihi si Sara at nagsilang ng isang anak na lalaki kay Abraham sa katandaan ni Abraham, sa takdang panahon na binanggit ng Diyos kay Abraham.
  rationale: Pinalitan ang “para kay Abraham” ng dative na “kay Abraham” upang iwasan ang diwang layunin o pakinabang. Ginawang tahasan ang tinutukoy ng katandaan. Pinalitan ang “sinabi sa kanya ng Diyos” ng “binanggit ng Diyos kay Abraham” upang malinaw na ang takdang panahon ang tinukoy sa naunang pagsasalita ng Diyos, habang hindi nagdaragdag ng paliwanag sa nilalaman nito.
