  text: וַ/יִּטַּ֥ע אֶ֖שֶׁל בִּ/בְאֵ֣ר שָׁ֑בַע וַ/יִּ֨קְרָא שָׁ֔ם בְּ/שֵׁ֥ם יְהוָ֖ה אֵ֥ל עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/033.yaml
  text: And he planted a tamarisk tree in Beersheba[a], and there he called on the name of Yahweh[b], the Everlasting God.
translation:
  language: tl
  text: Nagtanim siya ng punong tamarisko sa Beer-seba, at doon ay tumawag siya sa pangalan ni Yahweh[a], ang Diyos na Walang Hanggan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “doon ay ipinahayag niya ang pangalan ni Yahweh” o “doon ay nanawagan siya kay Yahweh.” Maaaring taglayin ng Hebreong idyoma ang diwa ng pagpapahayag at ng pagtawag sa Diyos sa konteksto ng pagsamba.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang Diyos na Walang Katapusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: Nagtanim siya
  rationale: Ang Qal ng נטע ay karaniwang nangangahulugang “magtanim.” Pinananatili rin ang panghalip na “siya” sa Hebreo sa halip na tahasang idagdag ang pangalang Abraham mula sa konteksto.
- source_word: אֶשֶׁל
  choice: punong tamarisko
  rationale: Malamang na isang uri ng punong tamarisk ang tinutukoy ng isahang pangngalan. Mas tiyak ito kaysa “puno” at hindi ipinapalagay ang mas lumang pagbasa na “kakahuyan.”
- source_word: בִּבְאֵר שָׁבַע
  choice: sa Beer-seba
  rationale: Likas sa Filipino ang “sa” para sa lokasyon, at ang “Beer-seba” ay malinaw na transliterasyon ng pangalan ng lugar.
- source_word: וַיִּקְרָא שָׁם בְּשֵׁם
  choice: at doon ay tumawag siya sa pangalan ni
  rationale: Pinananatili ng “tumawag sa pangalan ni” ang Hebreong idyoma ng pagsamba at pananalangin nang hindi lubusang inaalis ang posibilidad na may pagpapahayag din ng pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang isinasalin ang personal na pangalang יהוה bilang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֵל עוֹלָם
  choice: ang Diyos na Walang Hanggan
  rationale: Natural at marangal itong salin ng titulong אֵל עוֹלָם, na nagpapahayag ng walang hanggang pag-iral ng Diyos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Saklaw ng idyomang קרא בשם יהוה
  choice: tumawag siya sa pangalan ni Yahweh
  alternative: ipinahayag niya ang pangalan ni Yahweh; dumalangin siya sa pangalan ni Yahweh
  rationale: Maaaring saklawin ng parirala ang pagtawag o pagdalangin at ang pagpapahayag sa konteksto ng pagsamba. Pinananatili ng pangunahing salin ang idyoma, at inilalahad sa talababa ang tunay na leksikal na posibilidad.
- issue: Diwa ng אֵל עוֹלָם
  choice: ang Diyos na Walang Hanggan
  alternative: ang Diyos na Walang Katapusan; ang Diyos na Walang-Hanggan
  rationale: Ipinahahayag ng parirala ang walang hanggang pag-iral ng Diyos nang hindi nagdaragdag ng paliwanag na wala sa talata.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang maikli at tuwirang ayos ng Hebreo, ang personal na pangalang “Yahweh,” at ang bahagyang kalabuan ng pormula ng pagsamba. Ginamit ang “punong tamarisko” upang maging tiyak ngunit madaling maunawaan.
