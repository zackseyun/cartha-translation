lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Likas at maikli itong panandang sanhi at bunga sa modernong Tagalog.
- source_word: קָרָא
  choice: tinawag niya
  rationale: Pinananatili nito ang karaniwang kahulugang “tinawag,” na sa konteksto ay tumutukoy sa pagbibigay ng pangalan.
- source_word: לַמָּקוֹם הַהוּא
  choice: ang lugar na iyon
  rationale: Pinananatili ang tiyak na pagtukoy at ang lakas ng demonstratibong הַהוּא.
- source_word: בְּאֵר שָׁבַע
  choice: Beer-seba
  rationale: Isinalin bilang transliteradong pangalan ng lugar; ang larong-salita tungkol sa “balon,” “pito,” at “panunumpa” ay ipinaliliwanag sa talababa.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng pagpapangalan, sa dignified ngunit madaling maunawaang rehistro.
- source_word: שָׁם
  choice: doon
  rationale: Direkta at natural na katumbas ng pang-abay na panlunan.
- source_word: נִשְׁבְּעוּ
  choice: nanumpa
  rationale: Tumpak at likas na Tagalog para sa Niphal na “sumumpa/manumpa,” nang hindi na inuulit ang ideya sa pariralang “nanumpa ng isang sumpa.”
- source_word: שְׁנֵיהֶם
  choice: silang dalawa
  rationale: Tuwirang pinananatili ang diin ng Hebreo sa dalawang panig na kapuwa nanumpa.
