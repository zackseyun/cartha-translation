  text: Therefore he called that place Beersheba[a], because there the two of them swore an oath.
translation:
  language: tl
  text: Kaya tinawag niya ang lugar na iyon na Beer-seba[a], sapagkat doon silang dalawa nanumpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Beer-seba ay katunog ng mga salitang Hebreo para sa “balon ng pito” at “balon ng panunumpa”; dito, lalo itong iniuugnay sa panunumpang ginawa roon.
