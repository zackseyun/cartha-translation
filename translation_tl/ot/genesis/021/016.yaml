translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “masaksihan” upang panatilihin ang bigat ng tagpo, at “humagulgol” upang natural na maipahayag ang Hebreong idyoma at ang kasunod na pag-iyak.
