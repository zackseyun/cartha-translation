  - severity: medium
    issue: Ang “saka humagulgol” ay pinagsasama at bahagyang pinaiigting ang dalawang Hebreong pandiwa.
    rationale: 'Tahasan ang teksto: itinaas niya ang kanyang tinig at umiyak. Maaaring may malakas na panaghoy ang idyoma, ngunit hindi kailangan ang mas tiyak na “humagulgol.”'
