  yaml_path: translation/ot/genesis/021/016.yaml
  text: Then she went and sat down opposite him[a], at a distance, about a bowshot away, for she said, “Let me not look on the death of the boy.” So she sat opposite him and lifted up her voice and wept.
translation:
  language: tl
  text: Pagkatapos, lumayo siya at umupo sa tapat ng bata, sa malayo—mga kasinlayo ng naaabot ng palaso mula sa pana—sapagkat sinabi niya, “Huwag kong makita ang pagkamatay ng bata.” Kaya umupo siya sa tapat ng bata, itinaas ang kanyang tinig, at umiyak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: sa tapat nito
  rationale: Pinananatili ang pangunahing diwang pang-espasyo na nasa tapat o kaharap ngunit may pagitan; nililinaw ng kasunod na parirala ang layo.
- source_word: הַרְחֵק
  choice: sa layong
  rationale: Likas na ipinahahayag sa modernong Tagalog ang adberbiyal na diwa ng pagkalayo.
- source_word: כִּמְטַחֲוֵי קֶשֶׁת
  choice: halos abot ng isang pana
  rationale: Pinananatili ang sinaunang larawang tumutukoy sa tinatayang layong maaabot ng palaso mula sa pana.
- source_word: הַיָּלֶד
  choice: ang bata
  rationale: Ang ילד ay maaaring tumukoy sa isang batang lalaki o kabataan; ang “bata” ay natural at hindi nagpapalagay ng mas tiyak na edad kaysa sa ibinibigay ng salita.
- source_word: אַל אֶרְאֶה בְּמוֹת הַיָּלֶד
  choice: Ayokong masaksihan ang pagkamatay ng bata
  rationale: Ipinahahayag nang natural ang negatibong pagnanais ng nagsasalita habang pinananatili ang nominal na “pagkamatay ng bata.”
- source_word: וַתִּשָּׂא אֶת־קֹלָהּ וַתֵּבְךְּ
  choice: saka humagulgol
  rationale: Sa Tagalog, ang “humagulgol” ay likas na pinagsasama ang malakas na pag-iyak at pagluha na ipinahahayag ng magkasunod na Hebreong parirala.
- source_word: לָהּ
  choice: umupo
  rationale: Ang datibong panghalip ay hindi kailangang isalin nang hiwalay sa Tagalog; ang pagdaragdag ng “mag-isa” ay maaaring magmungkahi ng impormasyong hindi tiyak, samantalang ang מִנֶּגֶד ang naglalarawan sa posisyon niya.
