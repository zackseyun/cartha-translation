  naturalness: Natural at marangal ang binagong Tagalog. Iniiwasan nito ang di-likas na “halos abot ng isang pana,” at ang malinaw na pag-uulit ng “sa tapat ng bata” ay mas mabuting Tagalog kaysa sa malabong panghalip na “nito.”
  terminology: Ang “bata” ay katanggap-tanggap para sa הַיָּלֶד. Ang “Huwag kong makita ang pagkamatay ng bata” ay natural na panalangin o paghiling at pinananatili ang nominal na pagpapahayag ng Hebreo.
