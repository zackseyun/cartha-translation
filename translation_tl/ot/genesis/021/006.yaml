  text: And Sarah said[a], “God has made laughter for me; everyone who hears will laugh with me.”
translation:
  language: tl
  text: At sinabi ni Sara, “Ginawa ng Diyos ang pagtawa para sa akin; ang bawat makaririnig ay tatawa kasama ko.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang bawat makaririnig ay tatawa sa akin” o “ang bawat makaririnig ay tatawa para sa akin.” Pinahihintulutan ng Hebreo ang ilang diwa, ngunit sa konteksto ay malamang na tumutukoy ito sa pakikibahagi sa kagalakan ni Sara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng waw-consecutive sa natural na Tagalog.
- source_word: שָׂרָה
  choice: Sara
  rationale: Karaniwang anyo ng pangalang Sarah sa makabagong saling Tagalog.
- source_word: צְחֹק
  choice: dahilan upang tumawa
  rationale: Natural na ipinahahayag sa Tagalog ang ideya ng tawang dulot ng Diyos, habang pinananatili ang ugnayan sa pandiwang 'tatawa' sa kasunod na sugnay.
- source_word: עָשָׂה לִי
  choice: Binigyan ako ... ng
  rationale: Idyomatikong Tagalog para sa literal na 'gumawa para sa akin,' at malinaw na inilalahad na ang Diyos ang pinagmulan ng pagtawa.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang anyo ay tumutukoy rito sa nag-iisang Diyos na kumilos para kay Sara.
- source_word: כָּל הַשֹּׁמֵעַ
  choice: ang bawat makarinig nito
  rationale: Pinananatili ang distributibong diwa ng pariralang Hebreo; ang 'nito' ay natural na tumutukoy sa balita tungkol sa pangyayari.
- source_word: יִצְחַק
  choice: tatawa
  rationale: Pinananatili ang pangunahing kahulugan at ang paglalaro sa ugat na צחק, na kaugnay rin ng pangalan ni Isaac.
- source_word: לִי
  choice: kasama ko
  rationale: Sa konteksto ng kapanganakan at kagalakan ni Sara, malamang na pakikibahagi sa kanyang pagtawa ang diwa, ngunit inilalahad sa talababa ang tunay na ambiguwidad.
theological_decisions:
- issue: Diwa ng יִצְחַק לִי sa huling sugnay
  choice: tatawa kasama ko
  alternative: tatawanan ako; tatawa para sa akin
  rationale: Sinusuportahan ng masayang konteksto ang pakikibahagi sa tuwa ni Sara, ngunit maaaring dalhin ng לִי ang ibang ugnayan; kaya nasa pangunahing teksto ang malamang na diwa at nasa talababa ang mga alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'dahilan upang tumawa' sa halip na mas literal ngunit di-likas na 'gumawa ng pagtawa para sa akin.'
