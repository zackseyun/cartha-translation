  text: וַ/יִּכְרְת֥וּ בְרִ֖ית בִּ/בְאֵ֣ר שָׁ֑בַע וַ/יָּ֣קָם אֲבִימֶ֗לֶךְ וּ/פִיכֹל֙ שַׂר צְבָא֔/וֹ וַ/יָּשֻׁ֖בוּ אֶל אֶ֥רֶץ פְּלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/032.yaml
  text: So they made a covenant at Beer-sheba[a], and Abimelech rose up with Phicol, the commander of his army, and they returned to the land of the Philistines.
translation:
  language: tl
  text: Kaya gumawa sila ng tipan sa Beer-seba[a]. Pagkatapos, tumindig si Abimelec kasama si Picol, ang pinuno ng kaniyang hukbo, at bumalik sila sa lupain ng mga Filisteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pumutol ng tipan,” isang idyoma na nangangahulugang gumawa ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ בְרִית
  choice: gumawa sila ng tipan
  rationale: Ang literal na idyomang Hebreo ay “pumutol ng tipan,” ngunit ang “gumawa ng tipan” ang natural at malinaw na katumbas sa modernong Tagalog habang pinananatili ang diwa ng pormal na kasunduan.
- source_word: בִּבְאֵר שָׁבַע
  choice: sa Beer-seba
  rationale: Maaaring tumukoy ang ב sa “sa” o “nasa”; ang “sa” ay angkop para sa lugar kung saan ginawa ang tipan. Pinanatili ang transliterasyon ng tambalang pangalan.
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Ang קום ay nangangahulugang bumangon o tumindig. Ang “tumindig” ay dignified at natural sa salaysay at maaari ring magpahiwatig ng paghahandang umalis nang hindi dinaragdagan ang teksto.
- source_word: וּפִיכֹל
  choice: kasama si Picol
  rationale: Bagaman literal na “at si Picol,” nililinaw ng “kasama” na kapwa sila sangkot sa kasunod na maramihang kilos na “bumalik sila.”
- source_word: שַׂר צְבָאוֹ
  choice: ang pinuno ng kaniyang hukbo
  rationale: Ang שַׂר ay pinuno o kumandante, at ang צָבָא rito ay hukbo. Ang “pinuno ng kaniyang hukbo” ay malinaw at likas sa Tagalog nang hindi nagpapataw ng tiyak na modernong ranggo.
- source_word: וַיָּשֻׁבוּ
  choice: bumalik sila
  rationale: Ang שׁוב sa kontekstong ito ay pagbabalik; ang ayos na “bumalik sila” ay natural sa salaysay na Tagalog.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: sa lupain ng mga Filisteo
  rationale: Malapit itong sumusunod sa literal na “patungo sa lupain ng mga Filisteo” at pinananatili ang etnograpiko at heograpikong anyo ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “tipan” para sa covenant at pinanatili ang tradisyonal na anyo ng mga pangalang Beer-seba, Abimelec, Picol, at Filisteo. Ang panandang [a] ay inilagay mismo sa teksto.
