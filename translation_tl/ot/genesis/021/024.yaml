  yaml_path: translation/ot/genesis/021/024.yaml
  text: And Abraham said[a], “I swear it.”
translation:
  language: tl
  text: At sinabi ni Abraham, “Manunumpa ako[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Nanunumpa ako” o “Gagawa ako ng panunumpa.”
    reason: 'Pinananatili ang posibleng pagkakaiba sa aspekto at ang leksikal na saklaw ng pandiwang Hebreo: maaari itong unawain bilang kasalukuyang pagbigkas ng panunumpa o bilang pangakong manumpa.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay; natural sa Tagalog ang payak na “At sinabi” nang hindi dinaragdagan ang ugnayang pandiskurso.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Ginamit ang nakasanayang anyo ng pangalang Abraham sa makabagong saling Tagalog.
- source_word: אָנֹכִי
  choice: ako
  rationale: Hayag at bahagyang binibigyang-diin ng malayang panghalip ang nagsasalita. Sapat na ang “ako” sa Tagalog; magiging labis sa konteksto ang “ako mismo.”
- source_word: אִשָּׁבֵעַ
  choice: Susumpa ako
  rationale: Ang nifal ng שבע ay nangangahulugang manumpa o gumawa ng panunumpa. Bilang tugon sa hiling ni Abimelec, likas na ipinahihiwatig ng imperfect ang kusang pangako o nalalapit na kilos, kaya ang “Susumpa ako” ay tuwiran at natural.
