  text: The boy grew and was weaned[b][a], and Abraham made a great feast on the day Isaac was weaned.
translation:
  language: tl
  text: Lumaki ang bata at inawat sa pagsuso. Noong araw na inawat sa pagsuso si Isaac, naghanda si Abraham ng isang malaking handaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: Lumaki
  rationale: Sa konteksto ng pag-unlad ng isang bata, ang pandiwang גדל ay likas na tumutukoy sa paglaki.
- source_word: הַיֶּלֶד
  choice: ang bata
  rationale: Ang יֶלֶד ay maaaring mangahulugang bata o batang lalaki. Likas sa modernong Tagalog ang mas pangkalahatang “bata,” at malinaw na si Isaac ang tinutukoy sa konteksto.
- source_word: וַיִּגָּמַל
  choice: inawat sa pagsuso
  rationale: Ang nifal ng גמל dito ay tumutukoy sa pagtigil ng bata sa pagsuso. Mas malinaw sa karaniwang mambabasa ang “inawat sa pagsuso” kaysa sa “inawat” lamang.
- source_word: וַיַּעַשׂ
  choice: naghanda
  rationale: Bagaman malawak ang kahulugan ng עשה na “gumawa,” kapag handaan ang layon, natural at tumpak sa Tagalog ang “naghanda.”
- source_word: מִשְׁתֶּה גָדוֹל
  choice: isang malaking handaan
  rationale: Ipinahahayag ng מִשְׁתֶּה ang isang piging o handaan, at pinananatili ng “malaking” ang lakas ng גָדוֹל sa natural na Tagalog.
- source_word: בְּיוֹם
  choice: Nang araw na
  rationale: Pinananatili nito ang tiyak na temporal na ugnayan ng Hebreong “sa araw ng,” habang mas natural ang ayos sa Tagalog.
- source_word: הִגָּמֵל אֶת יִצְחָק
  choice: inawat sa pagsuso si Isaac
  rationale: Ang konstruksiyon ay tumutukoy sa pangyayari ng pag-awat kay Isaac. Ang pasibong diwa ay naipahahayag nang malinaw sa Tagalog nang hindi tinutukoy kung sino ang nag-awat.
