translation_notes:
  register: Makabago at madaling maunawaang Tagalog, ngunit pinananatili ang marangal na himig ng salaysay. Ang “Ano itong…” ay natural na tanong sa Filipino at hindi ipinapalit ang “bakit,” na magiging mas tiyak kaysa sa Hebreo.
