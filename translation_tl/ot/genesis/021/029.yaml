  yaml_path: translation/ot/genesis/021/029.yaml
  text: And Abimelech said to Abraham[a], “What are these seven ewe lambs that you have set apart by themselves?”
translation:
  language: tl
  text: At sinabi ni Abimelec kay Abraham, “Ano itong pitong babaeng kordero na inilagay[a] mo nang bukod?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibinukod.” Ang pandiwang Hebreo ay maaari lamang mangahulugang “inilagay,” ngunit ipinahihiwatig ng konteksto na inilagay ang mga ito bilang isang hiwalay na pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; ang “At sinabi” ay likas at marangal sa salaysay na Tagalog.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelec
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog.
- source_word: אֶל־אַבְרָהָם
  choice: ni Abimelec kay Abraham
  rationale: Ang “kay” ang likas na panandang Tagalog para sa taong kinakausap.
- source_word: מָה הֵנָּה
  choice: Ano itong
  rationale: Pinananatili nito ang tanong tungkol sa pagkakakilanlan o kabuluhan ng mga hayop nang hindi tahasang ginagawang tanong na “bakit.”
- source_word: שֶׁבַע כְּבָשֹׂת הָאֵלֶּה
  choice: pitong babaeng kordero
  rationale: Tiyak na pambabae ang pangngalang Hebreo; ipinahahayag ito ng “babaeng kordero,” samantalang hindi kailangang markahan ng maramihan ang “kordero” matapos ang bilang sa likas na Tagalog.
- source_word: הִצַּבְתָּ
  choice: ibinukod
  rationale: Pangunahing nangangahulugan ang anyong Hiphil na maglagay o magpatayo, ngunit ipinahihiwatig ng konteksto at ng לְבַדָּנָה na inilagay ang mga ito bilang hiwalay na pangkat.
- source_word: לְבַדָּנָה
  choice: ibinukod ... mo
  rationale: Ang diwa ng pagiging hiwalay sa iba ay likas na naipapahayag sa pandiwang “ibinukod” sa Tagalog, kaya hindi na kailangan ang mabigat na pag-uulit gaya ng “nang bukod sa iba.”
