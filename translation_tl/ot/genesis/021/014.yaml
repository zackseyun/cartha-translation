  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֣ם אַבְרָהָ֣ם בַּ/בֹּ֡קֶר וַ/יִּֽקַּֽח לֶחֶם֩ וְ/חֵ֨מַת מַ֜יִם וַ/יִּתֵּ֣ן אֶל הָ֠גָר שָׂ֧ם עַל שִׁכְמָ֛/הּ וְ/אֶת הַ/יֶּ֖לֶד וַֽ/יְשַׁלְּחֶ֑/הָ וַ/תֵּ֣לֶךְ וַ/תֵּ֔תַע בְּ/מִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/014.yaml
  text: So Abraham rose early in the morning and took bread and a skin of water and gave them to Hagar[a], putting them on her shoulder, along with the boy, and sent her away. And she went and wandered in the wilderness of Beersheba.
translation:
  language: tl
  text: Maagang bumangon si Abraham nang umaga. Kumuha siya ng tinapay at isang sisidlang balat na may tubig at ibinigay niya ang mga ito kay Hagar. Ipinatong niya ang mga iyon sa balikat ni Hagar[a]; kasama ang bata, pinaalis niya si Hagar. Umalis si Hagar at nagpagala-gala sa ilang ng Beer-seba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na, “ipinatong [iyon/ang mga iyon] sa balikat niya, at ang bata.” Siksik ang sintaks; maaari rin itong unawain na, “ipinatong ang mga iyon sa balikat niya at [ibinigay] sa kanya ang bata.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר
  choice: kinaumagahan, maagang bumangon si Abraham
  rationale: Pinananatili ang diin ng Hiphil ng שׁכם sa maagang pagbangon at likas ang ayos sa makabagong Tagalog.
- source_word: לֶחֶם
  choice: tinapay
  rationale: Ito ang tuwirang kahulugan ng salita; hindi kailangang palawakin bilang pangkalahatang pagkain.
- source_word: חֵמַת מַיִם
  choice: isang sisidlang-balat na may tubig
  rationale: Ang חֵמֶת ay sisidlang yari sa balat para sa likido. Iniiwasan ng saling ito ang modernong pakahulugan ng bote.
- source_word: שָׂם עַל שִׁכְמָהּ
  choice: ipinatong sa balikat nito
  rationale: Inilalarawan nito kung paano ibinigay ni Abraham kay Hagar ang mga panustos, habang pinananatili ang siksik na sintaks ng Hebreo.
- source_word: וְאֶת הַיֶּלֶד
  choice: kasama ang bata
  rationale: Ipinahihiwatig na sumama ang bata kay Hagar nang paalisin siya, nang hindi tiyakang ipinapalagay na ipinatong siya sa balikat nito.
- source_word: וַיְשַׁלְּחֶהָ
  choice: pinaalis siya
  rationale: Natural at marangal na Tagalog para sa pagpapayaon o pagpapalayo sa kontekstong ito.
- source_word: וַתֵּתַע
  choice: nagpagala-gala
  rationale: Pinananatili ang di-tiyak na kahulugan ng paglibot o pagkaligaw, nang hindi ipinipilit na talagang nawala siya ng landas.
- source_word: בְּמִדְבַּר בְּאֵר שָׁבַע
  choice: sa ilang ng Beer-seba
  rationale: Ang 'ilang' ay angkop sa biblikal na מִדְבָּר at hindi limitado sa larawang disyertong puro buhangin.
theological_decisions:
- issue: Ugnayang sintaktiko ng “bata” sa pariralang “ipinatong sa balikat nito”
  choice: Ang mga panustos ang ipinatong sa balikat ni Hagar, at kasama niya ang bata nang paalisin sila.
  alternative: Maaaring basahin ang siksik na Hebreo bilang paglalagay ng mga panustos at ng bata sa balikat ni Hagar, o bilang pagbibigay sa kanya ng mga panustos at paghabilin din sa bata.
  rationale: Siksik at tunay na malabo ang ayos ng Hebreo. Iniiwasan ng pangunahing salin ang malamang na nakalilitong larawan na pisikal na ipinatong ang bata sa balikat, ngunit itinatala ng talababa ang literal na pagkakasunod at ang ibang posibleng pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sisidlang-balat” upang maipakita ang materyal ng sinaunang lalagyan, at “ilang” para sa biblikal na kaparangan. Ang panghalip na “nito” sa sugnay tungkol kay Hagar ay nagpapalinaw ng reperensiya nang hindi paulit-ulit ang pangalan.
