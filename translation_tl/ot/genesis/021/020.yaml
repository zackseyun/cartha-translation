  text: God was with the boy[a], and he grew. He lived in the wilderness and became an archer.
translation:
  language: tl
  text: Ang Diyos ay kasama ng bata, at lumaki siya. Nanirahan siya sa ilang at naging mamamana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging tagapana.” Sa literal na Hebreo, “naging isang nagpapana gamit ang busog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אֱלֹהִים אֶת הַנַּעַר
  choice: Kasama ng Diyos ang bata
  rationale: Ang idyomang היה את ay nagsasaad ng presensiya at pagsuporta. Pinananatili ng “kasama ng Diyos” ang payak na pahayag tungkol sa pagkalinga ng Diyos nang hindi dinaragdagan ang teolohikal na kahulugan nito.
- source_word: וַיִּגְדָּל
  choice: lumaki siya
  rationale: Sa konteksto, tumutukoy ang גדל sa paglaki o pag-unlad ng bata. Natural at tuwiran sa makabagong Tagalog ang “lumaki siya.”
- source_word: וַיֵּשֶׁב בַּמִּדְבָּר
  choice: Nanirahan siya sa ilang
  rationale: Ang ישב ay nangangahulugang manirahan, at ang מִדְבָּר ay malawak na lupaing ligaw at kakaunti ang naninirahan, hindi lamang mabuhanging disyerto. Ang “ilang” ay maikli at angkop sa register ng Bibliya.
- source_word: וַיְהִי רֹבֶה קַשָּׁת
  choice: naging mamamana
  rationale: Inilalarawan ng parirala ang isang taong gumagamit o nagpapakadalubhasa sa pana. Ang “mamamana” ang natural at maikling katumbas sa Tagalog, samantalang ipinapaliwanag sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Pormula ng presensiya ng Diyos kaugnay ni Ismael
  choice: Kasama ng Diyos ang bata
  alternative: Tinulungan ng Diyos ang bata / Pumanig ang Diyos sa bata
  rationale: Tahasang pinagtitibay ng Hebreo ang presensiya at pagsuporta ng Diyos, ngunit hindi nito nililinaw rito ang lahat ng teolohikal na implikasyon. Hindi ginagawang tahasang “tumulong” o “pumanig” ang pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ilang” bilang karaniwang biblikal na tawag sa lupaing ligaw at kakaunti ang naninirahan, at “mamamana” bilang natural na katawagan sa archer.
