    issue: Malabo ang tungkulin ng “Kasama ng Diyos ang bata.”
    rationale: Bagaman maaaring ipakahulugan bilang “God was with the boy,” maaari rin itong marinig na ang bata ang kasama ng Diyos. Ang “Ang Diyos ay kasama ng bata” ay malinaw na pinananatili ang direksiyon ng Hebreong אֱלֹהִים אֶת־הַנַּעַר.
  - severity: low
    issue: Hindi tumpak ang instrumentong binanggit sa talababa.
    rationale: Ang קַשָּׁת ay “busog,” samantalang ang pana sa karaniwang Tagalog ay “palaso.” Ang literal na paliwanag ay dapat magsabing “gamit ang busog.”
  - severity: low
    issue: Ang “bihasa” sa talababa ay nagdaragdag ng antas ng kasanayang hindi tahasang isinasaad.
    rationale: Inilalarawan ng Hebreo ang pagiging isang taong nagpapana; hindi kailangang ipahiwatig na siya ay bihasa.
  revised_text: Ang Diyos ay kasama ng bata, at lumaki siya. Nanirahan siya sa ilang at naging mamamana.[a]
