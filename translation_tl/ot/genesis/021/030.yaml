base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/030.yaml
  text: And he said[a], “You are to take these seven ewe lambs from my hand, so that it may serve as a witness for me that I dug this well.”
translation:
  language: tl
  text: At sinabi niya, “Tatanggapin mo mula sa kamay ko ang pitong babaeng korderong ito, upang magsilbi itong saksi[a] para sa akin na hinukay ko ang balong ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang magsilbi silang saksi para sa akin.” Isahan ang pandiwang Hebreo, bagaman ang pinakamalapit na tinutukoy ay ang pitong babaeng kordero. Maaaring ituring na isang kabuuan ang mga ito, o maaaring ang pagtanggap o kasunduang isinasagisag ng mga ito ang tinutukoy na saksi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi dinaragdagan ang tiyak na ugnayang temporal.
- source_word: כִּי ... תִּקַּח
  choice: Tatanggapin mo
  rationale: Sa konteksto, ipinakikilala ng כִּי ang nilalaman ng paliwanag o inaasahang gagawin; ang pandiwa ay may puwersang direktibo. Ang “tatanggapin” ay likas sa pormal na paglilipat ng mga kordero.
- source_word: אֶת שֶׁבַע כְּבָשֹׂת
  choice: ang pitong babaeng korderong ito
  rationale: Ang כְּבָשֹׂת ay tumutukoy sa mga batang tupa na babae. Ang “ito” ay natural dahil naroon at katatalakay lamang ang mga hayop.
- source_word: מִיָּדִי
  choice: mula sa kamay ko
  rationale: Pinananatili ang konkretong idyomang Hebreo at ang larawan ng pormal na pag-abot o paglilipat.
- source_word: בַּעֲבוּר
  choice: upang
  rationale: Malinaw na nagpapahayag ng layunin sa makabagong Tagalog.
- source_word: תִּהְיֶה לִּי לְעֵדָה
  choice: magsilbi itong saksi para sa akin
  rationale: Ang pandiwang Hebreo ay pambabae at isahan. Ang “ito” ay maaaring tumukoy sa pitong kordero bilang isang kabuuan o sa kaayusan ng pagtanggap sa mga ito; pinananatili ng “saksi” ang legal at patunay na diwa.
- source_word: כִּי חָפַרְתִּי
  choice: na ako ang naghukay
  rationale: Ipinakikilala ng כִּי ang nilalaman ng patotoo. Ang “ako ang” ay natural na Tagalog at malinaw na itinatampok ang paghahabol ni Abraham na siya ang gumawa nito.
- source_word: הַבְּאֵר הַזֹּאת
  choice: ng balong ito
  rationale: Tuwirang katumbas ng demonstratibong parirala at natural sa Tagalog.
