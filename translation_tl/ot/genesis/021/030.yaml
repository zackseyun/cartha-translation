revisions:
- from: At sinabi niya, “Tatanggapin mo mula sa kamay ko ang pitong babaeng korderong ito, upang magsilbi itong saksi para sa akin na ako ang naghukay ng balong ito.”[a]
  to: At sinabi niya, “Tatanggapin mo mula sa kamay ko ang pitong babaeng korderong ito, upang magsilbi itong saksi[a] para sa akin na hinukay ko ang balong ito.”
  rationale: Pinalitan ang di-kailangang mariing “ako ang naghukay” ng “hinukay ko,” at inilipat ang angkla ng tala sa isahang “itong saksi.” Walang binago sa kahulugan, sa isahang kalabuan ng Hebreo, o sa terminolohiyang legal-na-patunay.
