  - severity: medium
    issue: “sapilitang inagaw” para sa גָּזְלוּ
    rationale: Ang pandiwa ay nagpapahiwatig ng maling pag-agaw/pagnanakaw, ngunit hindi nito tahasang sinasabing ginawa ito sa pamamagitan ng puwersa.
  - severity: low
    issue: “mga tauhan” para sa עַבְדֵי
    rationale: Posible ito sa malawak na diwa, ngunit ang “mga lingkod” ang mas direktang katumbas at pinananatili ang panlipunang katawagan ng pinagmulan.
  revised_text: Pagkatapos, sinita ni Abraham si Abimelec tungkol sa balon ng tubig na inagaw ng mga lingkod ni Abimelec.
