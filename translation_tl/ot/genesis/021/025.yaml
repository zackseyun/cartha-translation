  text: Then Abraham reproved Abimelech about the well of water that Abimelech’s servants had seized.
translation:
  language: tl
  text: Pagkatapos, sinita ni Abraham si Abimelec tungkol sa balon ng tubig na inagaw ng mga lingkod ni Abimelec.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹכִחַ
  choice: Ngunit sinita
  rationale: Ang הוכיח sa konteksto ay tahasang pagsita o pagrereklamo dahil sa maling ginawa. Isinalin ang וְ bilang “Ngunit” upang ihayag ang paglipat mula sa pagkakasundo sa naunang talata tungo sa usaping iniharap ni Abraham.
- source_word: עַל אֹדוֹת
  choice: tungkol sa
  rationale: Natural at tumpak na katumbas ng pariralang nagpapakilala sa paksa ng pagsita.
- source_word: בְּאֵר הַמַּיִם
  choice: balon ng tubig
  rationale: Pinananatili ang tahasang anyo ng Hebreo, kahit sapat na sa karaniwang Filipino ang “balon.”
- source_word: גָּזְלוּ
  choice: sapilitang inagaw
  rationale: Ang pandiwa ay higit sa simpleng pagkuha; ipinahihiwatig nito ang marahas o di-makatarungang pag-agaw.
- source_word: עַבְדֵי אֲבִימֶלֶךְ
  choice: mga tauhan ni Abimelec
  rationale: Sa konteksto, maaaring tumukoy ang עֲבָדִים sa mga lingkod o opisyal na nasa ilalim ng isang hari. Ang “mga tauhan” ay natural at hindi labis na nagtatakda ng kanilang eksaktong katayuan.
