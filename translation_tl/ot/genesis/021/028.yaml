translation:
  language: tl
  text: At inilagay ni Abraham nang hiwalay ang pitong babaeng kordero ng kawan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itinabi ni Abraham ang pitong babaeng kordero ng kawan.” Maaaring ipahiwatig ng pandiwang Hebreo ang paglalagay sa mga ito sa isang hiwalay na puwesto; nagiging mahalaga ang pagkakahiwalay na ito sa kasunod na salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: ibinukod
  rationale: Ang Hiphil ng נצב ay tumutukoy sa pagpapalagay o pagpapatayo sa isang tiyak na posisyon. Kasama ng לְבַדְּהֶן, likas sa Tagalog ang “ibinukod” upang ipahayag na inilagay ang mga ito nang hiwalay, nang hindi pa sinasabi ang layunin.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Karaniwang anyo ng pangalang ito sa makabagong saling Tagalog.
- source_word: אֶת
  choice: '[pananda ng tiyak na tuwirang layon, hindi isinalin]'
  rationale: Walang tuwirang katumbas sa Tagalog; ipinahihiwatig ito ng ayos at pokus ng pandiwa.
- source_word: שֶׁבַע
  choice: pitong
  rationale: Tuwirang salin ng bilang na pito, na may pang-angkop bago ang pangngalan.
- source_word: כִּבְשֹׂת
  choice: babaeng tupa
  rationale: Tumutukoy ang salita sa mga tupa na babae, malamang ay mga batang tupa. Pinananatili ng “babaeng tupa” ang kasarian sa natural at madaling maunawaang Tagalog; ang eksaktong kabataan ay inilalahad sa talababa bilang posibleng mas tiyak na salin.
- source_word: הַצֹּאן
  choice: mula sa kawan
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Sa pariralang ito, natural ang “mula sa kawan” at ipinapakita nitong ang pitong hayop ay kinuha at inihiwalay sa kabuuang kawan.
- source_word: לְבַדְּהֶן
  choice: ibinukod ... mula sa kawan
  rationale: Ipinahihiwatig ng parirala na ang pitong babaeng tupa ay inilagay nang hiwalay sa iba. Isinama ang kahulugan nito sa pandiwang “ibinukod” at sa pariralang “mula sa kawan” para sa likas na Tagalog.
