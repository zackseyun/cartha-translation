  text: Get up[a], lift up the boy, and hold him fast with your hand[b], for I will make him into a great nation.
translation:
  language: tl
  text: Bumangon ka, iangat mo ang bata at alalayan mo siya nang mahigpit gamit ang iyong kamay[a], sapagkat gagawin ko siyang isang dakilang bansa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hawakan mo siya nang mahigpit gamit ang iyong kamay.” Idinidiin ng pananalitang Hebreo ang matatag na paghawak o pagsuporta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּמִי
  choice: Bumangon ka
  rationale: Pautos na pambabaeng isahan ng קום, na nakatuon kay Hagar. Likas at tuwiran sa makabagong Tagalog ang “Bumangon ka.”
- source_word: שְׂאִ֣י
  choice: buhatin mo
  rationale: Ang נשׂא ay tumutukoy rito sa pag-angat sa bata mula sa kinalalagyan niya; pinananatili ng “buhatin” ang konkretong larawan nang hindi ipinapalagay na patuloy siyang kakargahin.
- source_word: הַנַּעַר
  choice: ang bata
  rationale: Maaaring mangahulugan ang נַעַר ng batang lalaki o kabataan. Sa kontekstong ito, natural at hindi labis na tiyak sa edad ang “ang bata.”
- source_word: וְהַחֲזִיקִי אֶת יָדֵךְ בּוֹ
  choice: at hawakan mo siyang mahigpit sa iyong kamay
  rationale: Ipinahihiwatig ng החזיק ang matatag na paghawak o pagsuporta. Inilalarawan ng salin ang mahigpit at sumusuportang paghawak, hindi lamang ang paghawak sa kamay ng bata.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos; ang “sapagkat” ay malinaw, marangal, at angkop sa daloy ng pangungusap.
- source_word: לְגוֹי גָּדוֹל אֲשִׂימֶנּוּ
  choice: gagawin ko siyang isang dakilang bansa
  rationale: Kasama ng לְגוֹי גָּדוֹל, ang שׂים ay nagpapahayag ng magiging resulta o kalagayan. Likas sa Tagalog ang pangakong “gagawin ko siyang isang dakilang bansa.”
theological_decisions:
- issue: Ang pangako ng Diyos tungkol sa kinabukasan ni Ismael
  choice: Tuwirang isinalin bilang pangako ng Diyos na gagawin ang bata na isang dakilang bansa.
  alternative: Ipaliwanag ang pangako ayon sa isang partikular na sistemang tipan o doktrina.
  rationale: Tahasan sa Hebreo ang pangako tungkol sa pambansang kinabukasan ng bata. Pinananatili ng salin ang payak na diwa nang hindi nagdaragdag ng teolohikal na pagtatangi na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang mga karaniwang pautos na anyo at iniwasan ang makaluma o labis na teknikal na pananalita.
