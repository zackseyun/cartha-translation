  text: וַ/יָּ֧גָר אַבְרָהָ֛ם בְּ/אֶ֥רֶץ פְּלִשְׁתִּ֖ים יָמִ֥ים רַבִּֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/034.yaml
  text: And Abraham stayed in the land of the Philistines for many days[a].
translation:
  language: tl
  text: At nanirahan si Abraham sa lupain ng mga Filisteo nang mahabang panahon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “namuhay bilang dayuhan sa lupain ng mga Filisteo sa loob ng maraming araw.” Maaaring idiin ng pandiwang Hebreo ang paninirahan bilang isang dayuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: At nanirahan
  rationale: Ang pandiwang גּוּר ay tumutukoy sa paninirahan bilang dayuhan o pansamantalang naninirahan. Likas sa modernong Tagalog ang “nanirahan,” habang inilalahad sa talababa ang mahalagang diwa ng pagiging dayuhan.
- source_word: בְּאֶרֶץ
  choice: sa lupain
  rationale: Ang אֶרֶץ dito ay isang teritoryo o rehiyon; malinaw at angkop sa estilong biblikal ang “lupain.”
- source_word: פְּלִשְׁתִּים
  choice: ng mga Filisteo
  rationale: Karaniwang Tagalog na anyo ng pangalan ng pangkat ng mga tao; sa pariralang ito, sila ang tinutukoy na kaugnay ng lupain.
- source_word: יָמִים רַבִּים
  choice: nang mahabang panahon
  rationale: Literal itong “maraming araw,” ngunit idiomatikong ipinapahayag nito ang mahabang tagal. Mas natural sa kasalukuyang Tagalog ang “nang mahabang panahon.”
- source_word: וַ
  choice: At
  rationale: Ipinagpapatuloy ng waw ang daloy ng salaysay; tuwirang pinananatili ito ng “At” nang hindi dinaragdagan ang tiyak na temporal na kahulugan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit sa pangunahing teksto ang idiomatikong “nang mahabang panahon,” habang pinanatili sa talababa ang mas literal na “maraming araw” at ang diwa ng paninirahan bilang dayuhan.
