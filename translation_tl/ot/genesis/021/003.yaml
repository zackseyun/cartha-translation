  yaml_path: translation/ot/genesis/021/003.yaml
  text: And Abraham called the name of his son who was born to him[a], whom Sarah bore to him[b], Isaac.
translation:
  language: tl
  text: Pinangalanan ni Abraham na Isaac ang anak niyang ipinanganak sa kanya, na isinilang sa kanya ni Sara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֶׁם
  choice: Pinangalanan
  rationale: Ang pariralang Hebreo na ‘tinawag ang pangalan’ ay karaniwang idyoma para sa pagbibigay ng pangalan. Mas natural at malinaw sa modernong Tagalog ang ‘pinangalanan.’
- source_word: בְּנוֹ
  choice: ang anak niya
  rationale: Malinaw na ipinakikita ng hulaping panghalip na anak ito ni Abraham; ginawang ‘anak niyang’ sa pangungusap para sa natural na daloy.
- source_word: הַנּוֹלַד לוֹ
  choice: ipinanganak sa kanya
  rationale: Pinananatili nito ang pasibong paglalarawan sa anak at ang ugnayang ipinahahayag ng לוֹ, ibig sabihin, anak na ipinanganak kay Abraham.
- source_word: אֲשֶׁר יָלְדָה לּוֹ שָׂרָה
  choice: na siyang isinilang ni Sara para sa kanya
  rationale: Pinananatili ang aktibong papel ni Sara bilang nanganak at ang inuulit na לוֹ. Ang ‘para sa kanya’ ay naghahatid ng diwang ang anak ay isinilang kay Abraham nang hindi inaalis ang pag-uulit sa Hebreo.
- source_word: יִצְחָק
  choice: Isaac
  rationale: Ito ang nakasanayang anyo ng pangalang יִצְחָק sa Filipino at sa mga saling Bibliya.
