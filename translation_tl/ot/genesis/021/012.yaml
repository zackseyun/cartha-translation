    rationale: Ang לְךָ ay tumutukoy kay Abraham. Ang “iyong lahi” ay mas malinaw kaysa “lahing mula sa iyo,” samantalang ang “kikilalanin” ay maaaring manatili bilang maingat na pagpapahayag ng pagtatalaga/pagbilang ng linya sa pamamagitan ni Isaac.
