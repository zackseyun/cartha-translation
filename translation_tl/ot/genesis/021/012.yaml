    rationale: Walang katumbas na pangyayari o sitwasyon sa “אַל־יֵרַע בְּעֵינֶיךָ עַל הַנַּעַר וְעַל אֲמָתֶךָ”; ang parirala ay “huwag itong maging masama/mabigat sa iyong paningin dahil sa bata at dahil sa babaeng alipin mo.”
  - severity: low
    issue: Ang “sundin mo siya” ay mas matibay at mas personal kaysa sa ekspresyong “pakinggan ang tinig niya.”
    rationale: Bagaman ang idyoma ay karaniwang nangangahulugang pagdinig o pagsunod sa sinasabi, mas ligtas na isalin sa pangunahing teksto bilang “pakinggan mo ang sinasabi niya,” upang hindi mapalawak ang saklaw ng pagsunod.
  - severity: low
