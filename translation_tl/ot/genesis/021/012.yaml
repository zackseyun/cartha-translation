revisions:
- from: Ngunit sinabi ng Diyos kay Abraham, “Huwag mong ikasama ng loob ang nangyari sa bata at sa babaeng alipin mo. Anuman ang sabihin sa iyo ni Sara, sundin mo siya,[a] sapagkat sa pamamagitan ni Isaac kikilalanin ang lahing mula sa iyo.[b]”
  to: Ngunit sinabi ng Diyos kay Abraham, “Huwag mong ikasama ng loob dahil sa bata at dahil sa babaeng alipin mo. Anuman ang sabihin sa iyo ni Sara, pakinggan mo ang sinasabi niya,[a] sapagkat sa pamamagitan ni Isaac kikilalanin ang iyong lahi.[b]”
  rationale: Inalis ang di-sinasadyang dagdag na “ang nangyari” at ibinalik ang tuwirang pagbanggit sa bata at sa babaeng alipin bilang dahilan ng sama ng loob. Pinalitan ang “sundin mo siya” ng mas maingat ngunit idiomatiko at natural na “pakinggan mo ang sinasabi niya.” Nilinaw ang ugnayan ng זֶרַע at לְךָ bilang “iyong lahi,” nang hindi ipinapataw ang isang mas makitid na pagpapakahulugang doktrinal sa pandiwang “tatawagin/kikilalanin.”
