base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/012.yaml
  text: But God said to Abraham[a], “Do not let it be grievous in your sight because of the boy and because of your servant woman. Whatever Sarah says to you, listen to her voice[d][c][b], for through Isaac your offspring will be called.”
translation:
  language: tl
  text: Ngunit sinabi ng Diyos kay Abraham, “Huwag mong ikasama ng loob dahil sa bata at dahil sa babaeng alipin mo. Anuman ang sabihin sa iyo ni Sara, pakinggan mo ang sinasabi niya,[a] sapagkat sa pamamagitan ni Isaac kikilalanin ang iyong lahi.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pakinggan mo ang tinig niya”; ibig sabihin, dinggin o sundin ang sinasabi ni Sara.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “sapagkat kay Isaac tatawagin ang iyong lahi.” Ipinahihiwatig nito na sa pamamagitan ni Isaac kinikilala ang linyang kabilang sa lahi ni Abraham.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: Ngunit sinabi ng Diyos
  rationale: Ipinahihiwatig ng “Ngunit” ang pagsalungat ng tugon ng Diyos sa matinding sama ng loob ni Abraham sa naunang talata, samantalang ang pandiwa ay nagpapatuloy sa salaysay.
- source_word: אַל יֵרַע בְּעֵינֶיךָ
  choice: Huwag mong ikasama ng loob
  rationale: Ang idyomang Hebreo ay tumutukoy sa pagkabalisa o di-pagkalugod. Natural sa modernong Tagalog ang “ikasama ng loob” at napapanatili nito ang bigat ng damdamin.
- source_word: הַנַּעַר
  choice: ang bata
  rationale: Ang נַעַר ay maaaring tumukoy sa batang lalaki o kabataan; sa kontekstong ito, payak at natural ang “bata” para kay Ismael.
- source_word: אֲמָתֶךָ
  choice: babaeng alipin mo
  rationale: Malinaw na ipinahahayag ng אָמָה ang nakabababang katayuang panlipunan ng isang babaeng alipin, kaya hindi ito pinalalambot bilang karaniwang katulong lamang.
- source_word: שְׁמַע בְּקֹלָהּ
  choice: sundin mo siya
  rationale: Literal itong “pakinggan mo ang tinig niya,” ngunit idyoma ito na nangangahulugang dinggin o sundin ang sinasabi niya. Mas natural sa Tagalog ang “sundin mo siya,” habang inilalagay sa talababa ang literal na larawan.
- source_word: בְּיִצְחָק
  choice: sa pamamagitan ni Isaac
  rationale: Ipinakikita ng בְּ dito ang linya o paraang kaugnay kay Isaac; malinaw itong naihahayag ng “sa pamamagitan ni Isaac.”
- source_word: יִקָּרֵא לְךָ זָרַע
  choice: kikilalanin ang lahing mula sa iyo
  rationale: Ang Niphal ng קרא kasama ng לְךָ ay nagpapahiwatig ng pagtawag, pagtatalaga, o pagkilalang isang lahi ay kay Abraham. Iniiwasan ng “kikilalanin” ang maling pakahulugang bibigyan lamang ng pangalan, ngunit pinananatili sa talababa ang literal na anyo.
- source_word: זָרַע
  choice: lahi
  rationale: Kolektibong pangngalan ang זֶרַע. Ang “lahi” ay natural sa Tagalog at napapanatili ang kolektibong diwa nang hindi sapilitang ginagawang tahasang maramihan.
theological_decisions:
- issue: Katayuan ni Hagar
  choice: babaeng alipin mo
  alternative: babaeng lingkod mo
  rationale: Tahasang tinutukoy ng salita ang di-malayang katayuan ni Hagar. Hindi ito dapat palambutin, ngunit hindi rin dinaragdagan ng paliwanag na wala sa talata.
- issue: Kahulugan ng pangako tungkol kay Isaac
  choice: sa pamamagitan ni Isaac kikilalanin ang lahing mula sa iyo
  alternative: kay Isaac tatawagin ang iyong lahi
  rationale: Tinutukoy ng sugnay ang pagkilala o pagtatalaga sa linya ni Abraham sa pamamagitan ni Isaac. Hindi nito itinatanggi ang biyolohikal na kaugnayan ni Ismael kay Abraham; inilalarawan nito kung aling linya ang kinikilala sa pangakong ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “ikasama ng loob” bilang buhay na katumbas ng idyomang Hebreo, at “babaeng alipin” upang hindi pagtakpan ang katayuang panlipunan ni Hagar. Iniwasan ang arkaikong “binata” o “alilang babae” at ang malabong pariralang maaaring magpahiwatig lamang ng pagbibigay ng pangalan.
