base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/023.yaml
  text: Swear to me here by God that you will not deal falsely with me, or with my children, or with my descendants. According to the kindness that I have shown to you, you shall show to me and to the land where you have lived as a foreigner.
translation:
  language: tl
  text: Ngayon, manumpa ka rito sa akin sa ngalan ng Diyos na hindi mo ako lilinlangin, ni ang aking mga anak, ni ang aking mga inapo. Gawin mo rin sa akin at sa lupaing tinitirhan mo bilang dayuhan ang katulad ng kabutihang ipinakita ko sa iyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Pinananatili ang tahasang temporal at diskursibong pahayag na “at ngayon,” habang likas sa Tagalog ang “Kaya ngayon” bilang paglipat tungo sa kahilingan.
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים הֵנָּה
  choice: manumpa ka rito sa akin sa ngalan ng Diyos
  rationale: Ipinahahayag ang pormal na panunumpa at ang Diyos bilang saksi o batayan ng sumpa; ang “sa ngalan ng Diyos” ay likas na katumbas sa modernong Tagalog ng panunumpa “by God.”
- source_word: תִּשְׁקֹר
  choice: lilinlangin
  rationale: Sinasaklaw ang diwa ng pagkilos nang may kabulaanan o pandaraya laban sa isang tao.
- source_word: נִינִי וּלְנֶכְדִּי
  choice: aking mga anak, ni ang aking mga inapo
  rationale: Pinananatili ang paglawak mula sa malapit na supling tungo sa mga susunod na salinlahi, nang hindi ipinipilit ang mas teknikal ngunit di-tiyak na mga antas ng angkan.
- source_word: חֶסֶד
  choice: kabutihan
  rationale: Sa kontekstong ito, tumutukoy sa tapat at mabuting pakikitungo; “kabutihan” ang malinaw at dignidad na salin nang hindi labis na tinutukoy ang konsepto bilang pormal na tipan.
- source_word: גַּרְתָּה בָּהּ
  choice: tinitirhan mo bilang dayuhan
  rationale: Pinananatili ang katayuan ni Abraham bilang naninirahang dayuhan, hindi bilang katutubong may-ari ng lupain.
theological_decisions:
- issue: Ang Diyos bilang saksi sa sumpa
  choice: sa ngalan ng Diyos
  alternative: sa harap ng Diyos
  rationale: Mas tuwirang pinananatili nito ang instrumental na בְּ sa pananalitang panunumpa, samantalang ang “sa harap ng Diyos” ay maaaring magpahina sa diwang “by God.”
- issue: Ang kabutihang gagawin sa lupain
  choice: gayon din ang gawin mo sa akin at sa lupain
  alternative: maging mabuti ka sa akin at sa mga tao ng lupain
  rationale: Pinananatili ang lupain mismo bilang gramatikal na kaugnay ng hinihinging kabutihan, sa halip na tahimik na palitan ito ng “mga tao ng lupain.”
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw sa karaniwang mambabasa. Pinanatili ang pormal na tono ng panunumpa at ang bahagyang di-karaniwang pagtukoy sa lupain bilang tatanggap ng kabutihan, sapagkat naroon ito sa Hebreo.
