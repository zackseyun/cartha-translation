  - severity: low
    issue: Pagkakaayos ng sugnay tungkol sa kabutihan
    rationale: Ang binagong ayos ay mas natural sa Tagalog at mas hayag na iniuugnay ang hinihinging gawin sa "kabutihang" na ipinakita ng nagsasalita.
