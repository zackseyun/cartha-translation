revisions:
- from: Kaya ngayon, manumpa ka rito sa akin sa ngalan ng Diyos na hindi mo ako lilinlangin, ni ang aking mga anak, ni ang aking mga inapo. Kung paanong nagpakita ako sa iyo ng kabutihan, gayon din ang gawin mo sa akin at sa lupaing tinitirhan mo bilang dayuhan.
  to: Ngayon, manumpa ka rito sa akin sa ngalan ng Diyos na hindi mo ako lilinlangin, ni ang aking mga anak, ni ang aking mga inapo. Gawin mo rin sa akin at sa lupaing tinitirhan mo bilang dayuhan ang katulad ng kabutihang ipinakita ko sa iyo.
  rationale: Inalis ang dagdag na konklusibong "Kaya" upang mapanatili ang payak na diskursibong "ngayon" ng Hebreo. Inayos ang ikalawang pangungusap para sa higit na likas na Tagalog habang pinananatili ang kahilingang tumbasan ang kabutihang ipinakita sa kanya, maging sa lupain kung saan nanirahan si Abraham bilang dayuhan.
