  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ לֹ֣א יָדַ֔עְתִּי מִ֥י עָשָׂ֖ה אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/גַם אַתָּ֞ה לֹא הִגַּ֣דְתָּ לִּ֗/י וְ/גַ֧ם אָנֹכִ֛י לֹ֥א שָׁמַ֖עְתִּי בִּלְתִּ֥י הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/026.yaml
  text: And Abimelech said[a], “I did not know who had done this thing. You also did not tell me, and I myself had not heard of it until today.”
translation:
  language: tl
  text: At sinabi ni Abimelec, “Hindi ko alam kung sino ang gumawa ng bagay na ito.[a] Hindi mo rin ito sinabi sa akin, at ako man ay walang narinig tungkol dito hanggang sa araw na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “usaping ito” o “pangyayaring ito.” Ang Hebreong dābār ay maaaring tumukoy sa isang bagay, usapin, o pangyayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; ang “At sinabi” ay likas at pormal na pananalita sa salaysay sa Tagalog.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelec
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang pantangi.
- source_word: לֹא יָדַעְתִּי
  choice: Hindi ko alam
  rationale: Likas itong pagpapahayag sa Tagalog ng kawalan ng kaalaman ni Abimelec; hindi kailangang piliting markahan ang aspektong nakaraan dahil malinaw ito sa konteksto ng usapan.
- source_word: מִי עָשָׂה
  choice: kung sino ang gumawa
  rationale: Tuwirang tinutukoy ng sugnay ang hindi kilalang gumawa ng naunang kilos.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: ng bagay na ito
  rationale: Malapit ito sa malawak na saklaw ng דָּבָר, na maaaring tumukoy sa isang bagay, usapin, o pangyayari; pinananatili sa talababa ang mga posibleng kahulugan.
- source_word: וְגַם אַתָּה
  choice: Hindi mo rin
  rationale: Ang “rin” ay likas na naghahatid ng inklusibo o idinagdag na diin ng גַּם sa pakikipag-usap.
- source_word: לֹא הִגַּדְתָּ לִּי
  choice: ito sinabi sa akin
  rationale: Ang הִגִּיד ay nangangahulugang magsabi o magbigay-alam; ginawang lantad ang ipinahiwatig na layon upang maging malinaw at natural sa Tagalog.
- source_word: וְגַם אָנֹכִי
  choice: at ako man
  rationale: Pinananatili ng “ako man” ang idinagdag na diin ng גַּם at ng hayag at mas buong panghalip na אָנֹכִי.
- source_word: לֹא שָׁמַעְתִּי
  choice: ay walang narinig tungkol dito
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa pagtanggap ng balita o ulat tungkol sa pangyayari.
- source_word: בִּלְתִּי הַיּוֹם
  choice: hanggang sa araw na ito
  rationale: Ipinahahayag ng parirala na wala siyang narinig bago sumapit ang kasalukuyang araw.
