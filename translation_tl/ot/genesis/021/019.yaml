  terminology: Ang “Diyos,” “balon,” at “bata” ay angkop. Ang “sisidlang yari sa balat” ay malinaw na katumbas ng חֵמֶת at pinananatili ang sinaunang anyo ng sisidlan nang hindi nagpapataw ng labis na pagpapakahulugan. Ang talababa ay dapat magbigay ng aktuwal na leksikal na alternatibo, hindi lamang paliwanag.
