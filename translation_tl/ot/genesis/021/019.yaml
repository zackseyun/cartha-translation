  to: Pagkatapos, binuksan ng Diyos ang kanyang mga mata, at nakita niya ang isang balon na may tubig. Pumunta siya at pinuno ng tubig ang sisidlang yari sa balat[a], at pinainom ang bata.
  rationale: Pinalitan ang bahagyang hindi likas na “sisidlang balat” ng “sisidlang yari sa balat.” Inayos din ang talababa upang maglahad ng isang malinaw na alternatibong salin, habang pinananatili ang maikling paliwanag tungkol sa sinaunang sisidlan. Inalis ang “roon” upang mas malapit sa payak na pandiwang Hebreo na “pumunta,” nang hindi binabago ang kahulugan.
