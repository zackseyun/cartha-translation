  yaml_path: translation/ot/genesis/021/019.yaml
  text: Then God opened her eyes[a], and she saw a well of water. She went and filled the skin with water and gave the boy a drink.
translation:
  language: tl
  text: Pagkatapos, binuksan ng Diyos ang kanyang mga mata, at nakita niya ang isang balon na may tubig. Pumunta siya at pinuno ng tubig ang sisidlang yari sa balat[a], at pinainom ang bata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sisidlang-tubig na yari sa balat.” Ang Hebreong salita ay tumutukoy sa sisidlang yari sa balat na ginagamit sa pagdadala ng likido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקַח
  choice: binuksan
  rationale: Pinananatili nito ang kongkretong idyomang Hebreo na ang mga mata ay ‘binuksan,’ nang hindi ipinapaliwanag kung paano nangyari ang pagkakita.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tumutukoy ito sa iisang Diyos sa salaysay, gaya ng ipinakikita ng pandiwang nasa isahan.
- source_word: עֵינֶיהָ
  choice: kanyang mga mata
  rationale: Tuwirang salin ito ng pariralang Hebreo at likas sa Tagalog.
- source_word: וַתֵּרֶא
  choice: nakita niya
  rationale: Malinaw at natural itong naglalahad ng kasunod na pangyayari matapos buksan ng Diyos ang kanyang mga mata.
- source_word: בְּאֵר מָיִם
  choice: isang balon na may tubig
  rationale: Pinananatili ang tahasang pagbanggit sa tubig habang mas natural sa Tagalog kaysa sa literal na ‘balon ng tubig.’
- source_word: וַתֵּלֶךְ
  choice: Pumunta siya roon
  rationale: Isinasalin ang payak na kilos ng pagpunta; ang ‘roon’ ay likas na tumutukoy sa balong katatapos makita.
- source_word: וַתְּמַלֵּא
  choice: pinuno
  rationale: Karaniwang katumbas ng pandiwang ‘punuin’ at sapat para sa payak na pagkakasunod-sunod ng salaysay.
- source_word: הַחֵמֶת
  choice: sisidlang balat
  rationale: Ang salita ay tumutukoy sa sisidlang yari sa balat na ginagamit sa pagdadala ng likido. Malinaw ito sa makabagong mambabasa at hindi gumagamit ng malabong ‘balat’ lamang.
- source_word: מַיִם
  choice: ng tubig
  rationale: Likas sa Tagalog ang konstruksyong ‘pinuno ng tubig’ para sa nilalaman ng sisidlan.
- source_word: וַתַּשְׁקְ
  choice: pinainom
  rationale: 'Naipahahayag ng pandiwang ito ang causative na diwa ng Hebreo: binigyan niya ang bata ng maiinom.'
- source_word: הַנַּעַר
  choice: ang bata
  rationale: Ang ‘bata’ ay malinaw, kasalukuyan, at angkop sa pagtukoy kay Ismael sa konteksto.
theological_decisions:
- issue: Kung ang ‘binuksan ng Diyos ang kanyang mga mata’ ay dapat panatilihin bilang tuwirang pagkilos ng Diyos o ipaliwanag lamang bilang pagpansin sa dati nang naroroong balon
  choice: Binuksan ng Diyos ang kanyang mga mata
  alternative: Ipinaalam o ipinakita sa kanya ng Diyos ang balon
  rationale: Tahasang iniuugnay ng Hebreo sa Diyos ang pagbubukas ng kanyang mga mata. Pinananatili ng salin ang banal na pagkilos at ang maaaring matalinghagang diwa nito nang hindi ipinapasiya ang mekanismo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘sisidlang balat’ upang maging nauunawaan ang sinaunang kagamitan, at inilagay ang talababa sa mismong terminong tinutukoy nito.
