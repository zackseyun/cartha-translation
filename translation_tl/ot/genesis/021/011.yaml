  text: The matter was very displeasing in Abraham’s eyes on account of his son[a].
translation:
  language: tl
  text: Lubhang hindi nagustuhan ni Abraham ang bagay na ito dahil sa kanyang anak na lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Lubhang masama ang bagay na ito sa paningin ni Abraham tungkol sa kanyang anak na lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: Napakasama
  rationale: Ang Qal na anyo ng רעע, kasama ng idyomang בְּעֵינֵי, ay nagsasaad na ang bagay ay itinuring na napakasama o lubhang hindi kalugod-lugod. Pinananatili ng salin ang lakas ng negatibong pagtataya nang hindi ipinapalagay na moral na kasamaan ang tinutukoy.
- source_word: הַדָּבָר
  choice: nito
  rationale: Tumutukoy ito sa sinabi o hinihingi ni Sara sa naunang talata. Natural sa Filipino ang panghalip na “nito” habang malinaw pa rin ang tinutukoy sa konteksto.
- source_word: מְאֹד
  choice: napaka-
  rationale: Ang unlaping “napaka-” ay natural at malinaw na katumbas ng matinding pang-abay na מְאֹד.
- source_word: בְּעֵינֵי
  choice: sa paningin ni Abraham
  rationale: Pinananatili nito ang larawang Hebreo na “sa mga mata ni Abraham” sa isang natural na idyomang Filipino.
- source_word: עַל אֹדוֹת
  choice: dahil sa
  rationale: Sa konteksto, ipinakikilala ng parirala ang dahilan o pinagmulan ng matinding pagtutol ni Abraham; natural itong ipinahahayag ng “dahil sa,” habang ang alternatibong ugnayang “tungkol sa” ay inilalagay sa talababa.
- source_word: בְּנוֹ
  choice: kanyang anak
  rationale: Ang בֵּן ay tumutukoy sa anak na lalaki; sa konteksto ay malinaw na si Ismael ang tinutukoy. Karaniwan at natural sa Filipino ang “anak,” na hindi naman nag-aalis sa kasariang malinaw mula sa konteksto.
theological_decisions:
- issue: Kung moral na kasamaan o personal na pagkabahala ang ipinahihiwatig ng וַיֵּרַע בְּעֵינֵי
  choice: Napakasama nito sa paningin ni Abraham
  alternative: Labis itong ikinalungkot ni Abraham
  rationale: Pinananatili ng piniling salin ang evaluative na idyoma at ang larawang “sa paningin” nang hindi nililimitahan ang diwa sa kalungkutan lamang. Sa konteksto, maaari itong magsangkot kapwa ng pagtutol at matinding pagkabahala.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang Hebreong idyoma na “sa paningin” dahil natural din ito sa Filipino at pinananatili ang evaluative na tensiyon ng teksto.
