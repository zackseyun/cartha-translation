  naturalness: Nauunawaan ang “Napakasama nito sa paningin ni Abraham,” ngunit mas natural at malinaw sa makabagong Filipino na tahasang banggitin ang “ang bagay na ito” at gamitin ang pandiwang “hindi nagustuhan” para sa idiomatikong evaluative sense.
  terminology: Ang “anak na lalaki” ay angkop para sa בֵּן at hindi umaasa lamang sa konteksto upang maipakita ang kasarian. Ang “lubhang hindi nagustuhan” ay iniiwasan ang di-sinasadyang pagbasa sa “masama” bilang moral na kasamaan, samantalang pinananatili ng talababa ang mas literal na alternatibo.
