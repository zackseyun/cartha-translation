source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע אֱלֹהִים֮ אֶת ק֣וֹל הַ/נַּעַר֒ וַ/יִּקְרָא֩ מַלְאַ֨ךְ אֱלֹהִ֤ים אֶל הָגָר֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֥אמֶר לָ֖/הּ מַה לָּ֣/ךְ הָגָ֑ר אַל תִּ֣ירְאִ֔י כִּֽי שָׁמַ֧ע אֱלֹהִ֛ים אֶל ק֥וֹל הַ/נַּ֖עַר בַּ/אֲשֶׁ֥ר הוּא שָֽׁם־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/017.yaml
  text: And God heard the boy’s voice[a], and the angel of God called to Hagar from heaven and said to her, “What is the matter with you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”
translation:
  language: tl
  text: At narinig ng Diyos ang tinig ng bata[a], at tumawag ang anghel ng Diyos kay Hagar mula sa langit at sinabi sa kanya, “Ano ang bumabagabag sa iyo, Hagar? Huwag kang matakot, sapagkat narinig ng Diyos ang tinig ng bata sa kinaroroonan niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “daing ng bata” sa dalawang paglitaw ng parirala; ang Hebreong qol ay maaaring tumukoy sa naririnig na daing o iyak ng isang naghihirap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים
  choice: At narinig ng Diyos
  rationale: Karaniwang nangangahulugang “marinig” ang qal ng שׁמע. Pinananatili ng “narinig” ang daloy ng salaysay nang hindi dinaragdagan ng kahulugang “sinagot.”
- source_word: אֶת קוֹל הַנַּעַר / אֶל קוֹל הַנַּעַר
  choice: ang tinig ng bata
  rationale: Literal na “tinig/tunog” ang קוֹל at maaaring tumukoy rito sa daing o iyak ng bata. Pinananatili ng “tinig” ang pag-uulit at ang mas malawak na saklaw ng salitang Hebreo.
- source_word: הַנַּעַר
  choice: ang bata
  rationale: Tumutukoy ang נַעַר kay Ismael bilang batang lalaki; natural at malinaw sa makabagong Filipino ang “bata.”
- source_word: וַיִּקְרָא מַלְאַךְ אֱלֹהִים
  choice: Tinawag ng anghel ng Diyos
  rationale: Direktang pinananatili ang pariralang construct na “anghel ng Diyos” at hindi nilulutas ang tanong tungkol sa tiyak na pagkakakilanlan ng mensahero.
- source_word: מִן הַשָּׁמַיִם
  choice: mula sa langit
  rationale: Ang “langit” ang natural na Filipino para sa lokatibong gamit ng שׁמים, bagaman anyong maramihan ito sa Hebreo.
- source_word: מַה לָּךְ
  choice: Ano ang bumabagabag sa iyo
  rationale: Idyomatikong itinatanong ng parirala kung ano ang nagpapahirap o bumabagabag sa isang tao. Natural ito sa Filipino at angkop sa mapagkalingang tono ng pahayag.
- source_word: אַל תִּירְאִי
  choice: Huwag kang matakot
  rationale: Direkta, natural, at malinaw na katumbas ng pambabaeng negatibong pautos.
- source_word: כִּי שָׁמַע אֱלֹהִים
  choice: sapagkat narinig ng Diyos
  rationale: Ipinapahayag ng כִּי ang dahilan ng katiyakan. Sapat ang aspektong Filipino na “narinig” upang ipakita ang naganap na pakikinig na mahalaga sa kasalukuyang kalagayan.
- source_word: בַּאֲשֶׁר הוּא שָׁם
  choice: mula sa kinaroroonan niya
  rationale: Lokatibo ang parirala. Mas natural sa Filipino ang “mula sa kinaroroonan niya” at malinaw nitong inuugnay ang tinig na narinig sa kasalukuyang kinalalagyan ng bata.
theological_decisions:
- issue: Ang pagkakakilanlan ng מַלְאַךְ אֱלֹהִים at ang malapit na ugnayan ng mensahero sa Diyos
  choice: ang anghel ng Diyos
  alternative: isang anghel ng Diyos; ang anghel na sugo ng Diyos
  rationale: Pinananatili ang mismong ekspresyon ng Hebreo nang hindi nagpapasya sa mas malawak na teolohikal na usapin tungkol sa pagkakakilanlan ng anghel.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “bumabagabag” upang natural na ihatid ang idyomang Hebreo, at iningatan ang pag-uulit ng “tinig ng bata.”
