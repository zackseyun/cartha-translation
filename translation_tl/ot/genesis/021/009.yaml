base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/009.yaml
  text: And Sarah saw the son of Hagar the Egyptian[a], whom she had borne to Abraham, mocking.
translation:
  language: tl
  text: At nakita ni Sara ang anak ni Hagar na Ehipsiyang babae, na ipinanganak ni Hagar kay Abraham, na tumatawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naglalaro” o “nanunuya.” Ang salitang Hebreo ay maaaring tumukoy sa pagtawa o sa kilos na mapaglaro o mapanlibak; maaaring magpahiwatig ang konteksto ng negatibong diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: At nakita ni Sara
  rationale: Pinananatili ang tuwirang pagkakasunod ng salaysay na ipinahihiwatig ng wayyiqtol ng ראה, nang hindi nagdaragdag ng di-tiyak na pagsalungat.
- source_word: בֶּן הָגָר הַמִּצְרִית
  choice: ang anak ni Hagar na Ehipsiyohanon
  rationale: Likas sa modernong Tagalog ang pariralang ito at malinaw na inuugnay kay Hagar ang katawagang הַמִּצְרִית.
- source_word: אֲשֶׁר יָלְדָה לְאַבְרָהָם
  choice: na isinilang nito kay Abraham
  rationale: Ang “nito” ay tumutukoy kay Hagar at umiiwas sa alanganing pag-uulit ng “niya”; ipinapahayag ng “isinilang ... kay Abraham” ang naunang panganganak at ang kaugnayan kay Abraham.
- source_word: מְצַחֵק
  choice: na tumatawa
  rationale: Ang participle ng צחק ay maaaring tumukoy sa pagtawa, paglalaro, o mapanlibak na pagkilos. Pinananatili sa pangunahing teksto ang mas malawak at di-gaanong mapagpasiyang diwa.
theological_decisions:
- issue: Eksaktong diwa ng kilos ni Ismael sa מְצַחֵק
  choice: “na tumatawa” sa pangunahing teksto
  alternative: “na nanunuya” o “na naglalaro”
  rationale: Walang tahasang layon ang participle at hindi tiyak sa anyong Hebreo lamang kung pagtawa, paglalaro, o panunuya ang tinutukoy. Hindi dapat tahimik na lutasin ang tunay na interpretatibong tensiyon; inilalagay sa talababa ang mga mas tiyak na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Ehipsiyohanon” bilang likas na katawagan sa pinagmulan at ang “nito” upang maging malinaw na si Hagar, hindi si Sara, ang nagsilang sa anak.
