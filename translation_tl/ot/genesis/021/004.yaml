  yaml_path: translation/ot/genesis/021/004.yaml
  text: And Abraham circumcised Isaac his son when he was eight days old[a], just as God had commanded him.
translation:
  language: tl
  text: At tinuli ni Abraham ang anak niyang si Isaac nang walong araw pa lamang ito, gaya ng iniutos sa kanya ng Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָל
  choice: tinuli
  rationale: Ang pandiwang מול ay tiyak na tumutukoy sa pagtutuli. Ang “tinuli” ang natural at eksaktong katumbas sa modernong Tagalog.
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: ang anak niyang si Isaac
  rationale: Pinananatili nito ang pangalang Isaac at ang pagbibigay-diin ng Hebreo na siya ay anak ni Abraham, sa natural na ayos ng Tagalog.
- source_word: בֶּן שְׁמֹנַת יָמִים
  choice: nang walong araw na ito
  rationale: Natural na ipinapahayag sa Tagalog ang edad habang pinananatili ang kahulugan ng idyomang Hebreo na literal na “anak na walong araw.”
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Ipinahahayag nito ang pagtutugma ng ginawa ni Abraham sa utos ng Diyos nang hindi nagpapalabis sa diin.
- source_word: צִוָּה אֹתוֹ
  choice: iniutos sa kanya
  rationale: Malinaw sa konteksto na nauna ang utos ng Diyos; sapat at natural sa Tagalog ang aspektong naganap na “iniutos” nang hindi nangangailangan ng dagdag na panandang temporal.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang anyo rito ay tumutukoy sa iisang Diyos at natural na isinasalin bilang “Diyos.”
theological_decisions:
- issue: Pagpapahayag na nauna ang utos ng Diyos
  choice: iniutos sa kanya ng Diyos
  alternative: nauna nang iniutos sa kanya ng Diyos
  rationale: Ipinahihiwatig na ng konteksto at ng aspektong pandiwa na nauna ang utos. Ang mas payak na anyo ay hindi nagdaragdag ng diin na wala sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang karaniwang biblikal na pangalang “Abraham” at “Isaac,” at pinanatili ang payak na daloy ng salaysay.
