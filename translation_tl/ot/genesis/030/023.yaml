base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/023.yaml
  text: She conceived and bore a son[a], and said, “God has taken away my reproach.”
translation:
  language: tl
  text: Nagdalang-tao siya at nagsilang ng isang anak na lalaki. Sinabi niya, “Inalis ng Diyos ang aking kahihiyan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang aking kadustaan” o “ang paghamak sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: Nagdalang-tao siya
  rationale: Likas at marangal na modernong Tagalog para sa paglihi o pagbubuntis, at malinaw na pinananatili ang unang pangyayari sa pagkakasunod-sunod ng salaysay.
- source_word: וַתֵּלֶד בֵּן
  choice: at nagsilang ng isang anak na lalaki
  rationale: Tuwirang ipinapahayag ang panganganak at ang kasarian ng anak sa natural na Tagalog.
- source_word: וַתֹּאמֶר
  choice: Sinabi niya
  rationale: Karaniwang salin ng pagpapatuloy ng salaysay at malinaw ang tinutukoy na nagsasalita.
- source_word: אָסַף
  choice: Inalis
  rationale: Sa kontekstong ito, ang pandiwa ay nangangahulugang pag-aalis ng kahihiyan; ipinahahayag ng aspektong Tagalog ang natapos na kilos at kasalukuyang bunga nito.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Isahan ang pandiwang kaakibat nito at tumutukoy ito sa Diyos, hindi sa maraming diyos.
- source_word: חֶרְפָּתִי
  choice: ang aking kahihiyan
  rationale: Ang חֶרְפָּה ay maaaring tumukoy sa kahihiyan, kadustaan, o paghamak ng lipunan. Ang “kahihiyan” ay malinaw sa modernong Tagalog habang naipahihiwatig pa rin ang panlipunang dungis na kaugnay ng pagiging baog sa salaysay.
theological_decisions:
- issue: Isahang kahulugan ng אֱלֹהִים
  choice: Diyos
  alternative: mga diyos
  rationale: Hinihingi ng isahang pandiwa at ng konteksto ang isahang tinutukoy; walang idinagdag na pagpapakahulugang lampas sa gramatika.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at angkop sa salaysay. Pinili ang “kahihiyan” bilang madaling maunawaan, at inilagay sa talababa ang mga alternatibong mas lantad ang panlipunang dimensiyon ng חֶרְפָּה.
