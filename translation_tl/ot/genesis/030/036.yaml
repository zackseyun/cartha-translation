  text: And he put a distance of three days between himself and Jacob, and Jacob was shepherding the rest of Laban’s flock.
translation:
  language: tl
  text: Naglagay siya ng agwat na tatlong araw ang paglalakbay sa pagitan niya at ni Jacob, at pinapastol ni Jacob ang natitirang kawan ni Laban.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: Naglagay siya ng layong tatlong araw na paglalakbay
  rationale: Ang דֶּרֶךְ שְׁלֹשֶׁת יָמִים ay tumutukoy sa distansiyang nalalakbay sa loob ng tatlong araw; nilinaw ang yunit nang hindi dinaragdagan ang diwa.
- source_word: בֵּינוֹ וּבֵין יַעֲקֹב
  choice: sa pagitan niya at ni Jacob
  rationale: Pinananatili ang di-tiyak na panghalip na 'siya,' na ayon sa konteksto ay tumutukoy kay Laban, gaya ng nasa Hebreo.
- source_word: רֹעֶה
  choice: patuloy na pinapastol
  rationale: Ang participle ay naglalarawan ng nagpapatuloy na gawain ni Jacob.
- source_word: צֹאן לָבָן הַנּוֹתָרֹת
  choice: ang natitirang kawan ni Laban
  rationale: Natural na salin ng kolektibong צֹאן at ng participial adjective na 'mga natira.'
