translation_notes:
  register: Makabago at dignified na Filipino, na gumagamit ng karaniwang bokabularyo sa pag-aalaga ng hayop. Pinanatili ang paulit-ulit na kilos at ang kaibahan ng malalakas at mahihinang hayop, habang iniwasang gawing mas tiyak kaysa sa Hebreo ang uri ng kawan o ang sanhi ng pagpapalahi.
