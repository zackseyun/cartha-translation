base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/041.yaml
  text: And whenever the stronger of the flock were breeding[a], Jacob would place the rods before the eyes of the flock in the watering troughs[b], so that they might breed among the rods.
translation:
  language: tl
  text: Tuwing nag-iinit ang mas malalakas na hayop sa kawan[a], inilalagay ni Jacob ang mga patpat sa mga labangan[b], sa harap mismo ng kawan, upang magtalik ang mga ito sa tabi ng mga patpat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malulusog” o “matitibay na hayop”; tumutukoy ang salitang Hebreo sa mga hayop na higit na malakas kaysa sa mahihina sa kasunod na talata.
    reason: lexical_alternative
  - marker: b
    text: O “mga daluyan ng tubig”; tumutukoy ang salitang Hebreo sa mga painuman ng mga hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּכָל יַחֵם
  choice: Tuwing nag-iinit
  rationale: Ipinahihiwatig ng parirala ang isang paulit-ulit na pangyayari. Ang “nag-iinit” ay likas na katawagan sa kalagayan ng mga hayop na handa nang magtalik, at hindi nito ipinagkakamali ang yugto sa paglilihi.
- source_word: הַצֹּאן
  choice: ang ... kawan / mga hayop sa kawan
  rationale: Maaaring tumukoy ang צאן sa sama-samang maliliit na alagang hayop, kabilang ang mga tupa at kambing; hindi ito nililimitahan sa iisang uri.
- source_word: הַמְקֻשָּׁרוֹת
  choice: mas malalakas na hayop
  rationale: Sa konteksto, kasalungat ito ng mahihinang hayop sa susunod na talata. Malinaw na ipinahahayag ng “mas malalakas” ang paghahambing nang hindi labis na tinutukoy ang eksaktong pisikal na katangian.
- source_word: וְשָׂם
  choice: inilalagay ni Jacob
  rationale: Ang aspektong paulit-ulit ay naitatag na ng “Tuwing,” kaya natural sa Filipino ang pangkasalukuyang anyong “inilalagay” para sa nakaugaliang kilos.
- source_word: הַמַּקְלוֹת
  choice: mga patpat
  rationale: Ang מַקְלוֹת ay mga patpat o tungkod; ang “mga patpat” ay natural at kaayon ng mga binalatang sanga sa naunang konteksto.
- source_word: לְעֵינֵי הַצֹּאן
  choice: sa harap mismo ng kawan
  rationale: Pinananatili nito ang biswal na diin ng literal na “sa harap ng mga mata ng kawan” sa mas natural na Filipino.
- source_word: בָּרֳהָטִים
  choice: sa mga labangan
  rationale: Tumutukoy ang רֳהָטִים sa mga sisidlan o daluyan sa painuman. Ang “labangan” ay maikli at karaniwang katawagan sa painuman ng mga hayop.
- source_word: לְיַחְמֶנָּה
  choice: upang magtalik ang mga ito
  rationale: Ang לְ ay nagpapahayag ng layunin. Dito, ang anyo ng יחם ay tumutukoy sa pagpapalahi o pagtatalik; malinaw ang “magtalik” at hindi nito labis na ipinapahiwatig na tiyak na naglihi ang mga hayop.
- source_word: בַּמַּקְלוֹת
  choice: sa harap ng mga patpat
  rationale: May saklaw ng kahulugan ang pang-ukol בְּ. Sa konteksto ng mga patpat na inilagay sa kanilang paningin, ang “sa harap ng” ay nagpapahayag ng kalagayan nang hindi ipinahihiwatig na ang mga patpat ang mismong kapareha o tuwirang sanhi.
