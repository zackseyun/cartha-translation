base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/020.yaml
  text: And Leah said[a], “God has endowed me with a good endowment. This time my husband will honor me, because I have borne him six sons.” So she called his name Zebulun.
translation:
  language: tl
  text: Sinabi ni Lea, “Pinagkalooban ako ng Diyos ng isang mabuting kaloob. Sa pagkakataong ito, pararangalan[a] ako ng asawa ko, sapagkat nagsilang ako para sa kanya ng anim na anak na lalaki.” Kaya pinangalanan niya itong Zebulun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maninirahan sa piling ko.” Bihira ang Hebreong pandiwa at may paglalaro ng salita kaugnay ng pangalang Zebulun; maaaring saklaw ng kahulugan nito kapwa ang paggalang at ang paninirahan o pananatili sa piling ni Lea.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבָדַנִי אֱלֹהִים אֹתִי זֵבֶד טוֹב
  choice: Pinagkalooban ako ng Diyos ng isang mabuting kaloob
  rationale: Ang “pinagkalooban” at “kaloob” ay likas na Filipino at pinananatili ang pag-uulit at paglalaro sa magkaugnay na pandiwa at pangngalang Hebreo mula sa ugat na זבד.
- source_word: הַפַּעַם
  choice: Sa pagkakataong ito
  rationale: Malinaw at likas itong katumbas ng pahayag na tumutukoy sa inaasahang pagbabago matapos ang kapanganakang ito.
- source_word: יִזְבְּלֵנִי
  choice: pararangalan na ako
  rationale: Ang bihirang pandiwa ay maaaring magpahiwatig ng pagbibigay-dangal at kaugnay sa pangalang Zebulun. Ang “pararangalan” ay angkop sa pag-asa ni Lea na magbabago ang pakikitungo sa kanya ng asawa niya, habang inilalahad sa talababa ang ibang posibleng diwa.
- source_word: אִישִׁי
  choice: asawa ko
  rationale: Ito ang malinaw at natural na katumbas sa kontekstong pangmag-asawa.
- source_word: כִּי יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים
  choice: sapagkat ipinanganak ko sa kanya ang anim na anak na lalaki
  rationale: Pinananatili nito ang pagsilang ni Lea, ang di-tuwirang layon na “sa kanya,” at ang tiyak na bilang at kasarian ng mga anak.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ זְבֻלוּן
  choice: Kaya pinangalanan niya itong Zebulun
  rationale: Natural na Filipino para sa Hebreong pormula ng pagpapangalan, habang pinananatili ang pangalan sa karaniwang transliterasyon.
theological_decisions:
- issue: Di-tiyak na kahulugan ng יִזְבְּלֵנִי
  choice: pararangalan na ako
  alternative: maninirahan/makikisama sa piling ko
  rationale: Hindi tiyak ang bihirang pandiwa at may paglalaro ng salita sa pangalang Zebulun. Pinili sa teksto ang kahulugang angkop sa pagnanais ni Lea ng pagkilala mula sa asawa, ngunit hindi isinasantabi ang posibleng diwa ng paninirahan o pananatili.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkaugnay na “pinagkalooban” at “kaloob” upang maipakita hangga't maaari ang Hebreong paglalaro ng salita, at inilagay ang talababa sa mismong pandiwang may tunay na leksikal na kalabuan.
