revisions:
- from: Inilagay niya ang mga patpat na binalatan niya sa mga labangan—sa mga painuman ng tubig na pinupuntahan ng kawan upang uminom—sa harap mismo ng kawan. At nag-iinit ang mga hayop[a] pagdating nila upang uminom.
  to: Inilagay niya ang mga patpat na binalatan niya sa mga labangan—sa mga painuman na pinupuntahan ng kawan upang uminom—sa harap ng kawan. At nag-init ang mga ito[a] nang dumating upang uminom.
  rationale: Inayos ang aspekto ng pandiwa upang tumugma sa salaysay na nasa nakaraan, at pinanatili ang leksikal na kalabuan ng וַיֵּחַמְנָה sa pangunahing teksto. Pinagaan ang mga katagang panglokasyon nang hindi inaalis ang magkapares na paglalarawan ng lugar ng pag-inom sa Hebreo.
