base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/038.yaml
  text: He set the rods that he had peeled in the troughs[a], in the watering channels where the flock came to drink, in front of the flock[c][b]; and they mated when they came to drink.
translation:
  language: tl
  text: Inilagay niya ang mga patpat na binalatan niya sa mga labangan—sa mga painuman na pinupuntahan ng kawan upang uminom—sa harap ng kawan. At nag-init ang mga ito[a] nang dumating upang uminom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsiping ang mga ito.” Ang pandiwang Hebreo ay mas literal na tumutukoy sa pag-iinit o pagiging handang magparami; ipinahihiwatig ng konteksto ang kanilang pagsasama upang magparami.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּג
  choice: Inilagay niya
  rationale: Tumutukoy sa sadyang paglalagay ng isang bagay sa isang tiyak na puwesto; natural at tuwiran sa modernong Tagalog.
- source_word: הַמַּקְלוֹת
  choice: ang mga patpat
  rationale: Mga pinutol na sanga o patpat ang tinutukoy sa naunang talata; mas karaniwan at malinaw kaysa “mga tungkod.”
- source_word: אֲשֶׁר פִּצֵּל
  choice: na binalatan niya
  rationale: Sa konteksto, inalis ni Jacob ang ilang bahagi ng balat upang lumitaw ang maputing kahoy; ang detalyeng guhitan ay nasa naunang talata.
- source_word: בָּרֳהָטִים בְּשִׁקֲתוֹת הַמָּיִם
  choice: sa mga labangan—sa mga painuman ng tubig
  rationale: Pinananatili ang dalawang magkaugnay na paglalarawan ng Hebreo, habang ipinakikitang kapwa tumutukoy ang mga ito sa lugar na pinaiinuman sa mga hayop.
- source_word: הַצֹּאן
  choice: ang kawan
  rationale: Kolektibong katawagan ito sa maliliit na alagang hayop, na maaaring kinabibilangan ng mga tupa at kambing; hindi ito nilimitahan sa isang uri lamang.
- source_word: לְנֹכַח הַצֹּאן
  choice: sa harap mismo ng kawan
  rationale: Ipinahahayag ang tuwirang pagkakalagay sa harap o katapat ng mga hayop; ang “mismo” ay nagpapalinaw sa lokasyon nang hindi nagdaragdag ng bagong diwa.
- source_word: וַיֵּחַמְנָה
  choice: nag-iinit ang mga hayop
  rationale: Pinananatili ang kongkretong larawan ng Hebreong ugat na tumutukoy sa pag-iinit o pagiging in heat; ipinahihiwatig ng konteksto ang pag-aasawa ngunit hindi iyon tahasang ipinapalit sa pangunahing teksto.
- source_word: בְּבֹאָן לִשְׁתּוֹת
  choice: pagdating nila upang uminom
  rationale: Natural na temporal na pahayag sa Tagalog na tapat sa diwang “nang dumating sila upang uminom.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “kawan” upang hindi limitahan ang צֹאן sa mga tupa lamang. Pinanatili ang bahagyang pag-uulit sa paglalarawan ng painuman at ang seksuwal na pahiwatig ng pandiwang Hebreo nang hindi ito ginawang mas tahasan kaysa sa pinagmulan.
