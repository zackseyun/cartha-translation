base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/018.yaml
  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
translation:
  language: tl
  text: Sinabi ni Lea, “Ibinigay sa akin ng Diyos ang aking kabayaran, dahil ibinigay ko sa aking asawa ang aking aliping babae.” Kaya pinangalanan niya itong Isacar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Isacar ay kahawig ng tunog ng salitang Hebreo para sa “upa” o “kabayaran,” na kaugnay ng paliwanag ni Lea.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן אֱלֹהִים
  choice: Ibinigay sa akin ng Diyos
  rationale: Tuwirang pinananatili ang Diyos bilang gumagawa at natural na ipinahahayag sa Filipino ang pagbibigay kay Lea.
- source_word: שְׂכָרִי
  choice: ang aking kabayaran
  rationale: Ang “kabayaran” ay sumasaklaw sa diwa ng upa o gantimpala at tumutulong mapanatili ang kaugnayan sa paliwanag sa pangalang Isacar.
- source_word: אֲשֶׁר
  choice: dahil
  rationale: Sa pangungusap na ito, ang relative particle ay may malinaw na puwersang sanhi at natural na isinasalin bilang “dahil.”
- source_word: נָתַתִּי
  choice: ibinigay ko
  rationale: Payak at tuwirang anyong naganap para sa naunang ginawa ni Lea.
- source_word: שִׁפְחָתִי
  choice: ang aking aliping babae
  rationale: Pinananatili nito kapwa ang kasarian at ang kalagayang nakapaloob sa terminong Hebreo, nang hindi ipinapalagay ang edad.
- source_word: לְאִישִׁי
  choice: sa aking asawa
  rationale: Sa konteksto, ang אִישׁ ay tumutukoy kay Jacob bilang asawa ni Lea.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Kaya pinangalanan niya itong
  rationale: Natural na Filipino para sa idyomang pagbibigay ng pangalan, habang ipinakikita ang ugnayan ng paliwanag ni Lea at ng ipinangalan niya.
- source_word: יִשָּׂשכָר
  choice: Isacar
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan; ipinaliliwanag sa talababa ang tunog-kaugnayan nito sa שָׂכָר.
theological_decisions:
- issue: Ang paliwanag ni Lea tungkol sa pagkilos ng Diyos at sa kapanganakan
  choice: Inilahad nang tuwiran ang sinabi ni Lea na ang bata ay kabayarang ibinigay ng Diyos.
  alternative: Gamitin ang mas abstraktong “gantimpala” upang pahinain ang transaksiyonal na himig.
  rationale: Ang talata ay nag-uulat ng sariling pagpapakahulugan ni Lea. Hindi dapat dagdagan ng salin ang pagsang-ayon o pagpuna sa kanyang teolohiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “kabayaran” sa halip na mas lumang “upa” bilang pangunahing salita, at inilagay ang paliwanag sa paglalaro ng salita sa talababa.
