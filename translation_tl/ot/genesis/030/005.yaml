- source_word: לְיַעֲקֹב
  choice: para kay Jacob
  rationale: Pinananatili ng “para kay Jacob” ang ugnayang ipinahihiwatig ng pang-ukol na ל, na mahalaga sa konteksto ng panganganak ni Bilha para kay Jacob.
- source_word: בֵּן
