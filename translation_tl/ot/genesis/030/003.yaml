  text: וַ/תֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥/י בִלְהָ֖ה בֹּ֣א אֵלֶ֑י/הָ וְ/תֵלֵד֙ עַל בִּרְכַּ֔/י וְ/אִבָּנֶ֥ה גַם אָנֹכִ֖י מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/003.yaml
  text: Then she said[a], “Here is my female servant Bilhah. Go in to her, so that she may bear on my knees[c][b], and I too may be built up through her.”
translation:
  language: tl
  text: Pagkatapos ay sinabi niya, “Narito ang alipin kong si Bilha. Sipingan mo siya upang manganak siya sa ibabaw ng aking mga tuhod[a], at magkaroon din ako ng mga anak sa pamamagitan niya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “manganak sa ibabaw ng aking mga tuhod.” Malamang na tumutukoy ito sa isang kaugaliang simbolikong pagtanggap sa anak ng isang aliping babae bilang anak ng maybahay.
    reason: cultural_note
  - marker: b
    text: Literal na “at maitayo rin ako sa pamamagitan niya”—isang talinghaga para sa pagkakaroon ng pamilya o mga anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתִי
  choice: alipin kong si Bilha
  rationale: Ang אמה ay tumutukoy sa babaeng alipin o lingkod. Ang “alipin” ay tahasang nagpapanatili sa mababang katayuang panlipunan ni Bilha at natural sa modernong Tagalog.
- source_word: בֹּא אֵלֶיהָ
  choice: Sipingan mo siya
  rationale: Karaniwang Hebreong eupemismo ito para sa pakikipagtalik. Ang “sipingan” ay maikli, marangal, at malinaw sa Tagalog nang hindi maging tahasan o magaspang.
- source_word: וְתֵלֵד עַל בִּרְכַּי
  choice: upang manganak siya sa ibabaw ng aking mga tuhod
  rationale: Pinananatili ang kapansin-pansing literal na larawan ng Hebreo. Malamang na tumutukoy ito sa simbolikong pagtanggap ng maybahay sa anak na isinilang ng alipin; ipinaliliwanag ito sa talababa sa halip na palitan sa pangunahing teksto.
- source_word: וְאִבָּנֶה
  choice: magkaroon din ako ng mga anak
  rationale: Literal na “maitayo” o “mapatayo,” ngunit sa konteksto ang talinghaga ay tumutukoy sa pagkakaroon ng sambahayan o lahi sa pamamagitan ng mga anak. Ang natural na kahulugan ay inilagay sa teksto, habang pinananatili sa talababa ang literal na metapora.
- source_word: מִמֶּנָּה
  choice: sa pamamagitan niya
  rationale: 'Ipinapahayag nito nang natural ang instrumental na diwa: si Bilha ang magiging paraan upang magkaroon si Raquel ng mga anak.'
- source_word: גַם אָנֹכִי
  choice: din ako
  rationale: Pinananatili ang diin na umaasa ring magkaroon si Raquel ng kinikilalang supling sa kabila ng sarili niyang pagkabaog.
theological_decisions:
- issue: Kung paano ilalarawan ang inaasahang resulta para kay Raquel
  choice: magkaroon din ako ng mga anak
  alternative: maitayo rin ako
  rationale: Hindi nilulutas ang moral o teolohikal na katayuan ng kaayusan; ipinahahayag lamang ang idiomatikong layunin sa konteksto. Itinatala sa talababa ang literal na talinghagang “maitayo.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sipingan” bilang likas na eupemismo at pinanatili ang kakaibang larawang “sa ibabaw ng aking mga tuhod,” na nilinaw sa talababa.
