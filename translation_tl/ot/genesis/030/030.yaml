  naturalness: Mas natural sa makabagong Filipino ang “ang kaunti mong pag-aari” kaysa “ang kaunting pag-aari mo,” “dumami nang lubha” kaysa “dumami nang sagana,” at “maglalaan para sa sarili kong sambahayan” para sa ekonomikong diwa ng huling tanong.
