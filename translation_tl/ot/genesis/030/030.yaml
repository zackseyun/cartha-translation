language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֡י מְעַט֩ אֲשֶׁר הָיָ֨ה לְ/ךָ֤ לְ/פָנַ/י֙ וַ/יִּפְרֹ֣ץ לָ/רֹ֔ב וַ/יְבָ֧רֶךְ יְהוָ֛ה אֹתְ/ךָ֖ לְ/רַגְלִ֑/י וְ/עַתָּ֗ה מָתַ֛י אֶֽעֱשֶׂ֥ה גַם אָנֹכִ֖י לְ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/030.yaml
  text: For the little that you had before me has increased into abundance[a], and Yahweh has blessed you at my coming. And now[b], when shall I also provide for my own household?
translation:
  language: tl
  text: Sapagkat ang kaunti mong pag-aari bago ako dumating ay dumami nang lubha, at pinagpala ka ni Yahweh sa pagdating ko[a]. Ngunit ngayon, kailan naman ako maglalaan para sa sarili kong sambahayan[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa aking paa”; ang idyoma ay maaaring mangahulugang “sa pagdating ko” o “dahil sa akin.”
    reason: lexical_alternative
  - marker: b
    text: O “kailan naman ako gagawa ng isang bagay para sa sarili kong sambahayan?”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט אֲשֶׁר הָיָה לְךָ
  choice: ang kaunting pag-aari mo
  rationale: Ang מְעַט ay tumutukoy rito sa maliit na dami ng mga ari-arian ni Laban; idinagdag ang “pag-aari” upang maging malinaw at natural sa Tagalog ang ipinahihiwatig ng Hebreo.
- source_word: לְפָנַי
  choice: bago ako dumating
  rationale: Bagaman literal na “sa harap ko,” sa konteksto ay inihahambing ni Jacob ang kalagayan ni Laban bago at matapos ang kanyang pagdating.
- source_word: וַיִּפְרֹץ לָרֹב
  choice: ay dumami nang sagana
  rationale: Ipinahahayag nito ang mabilis at malaking paglago; natural na naihahatid ng parirala ang bunga ng pandiwang פרץ at ng לָרֹב.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalan ng Diyos sa Hebreo.
- source_word: לְרַגְלִי
  choice: dahil sa pagdating ko
  rationale: Literal itong “sa aking paa,” ngunit idyomatikong maaaring mangahulugang kasabay ng pagdating ni Jacob o dahil sa kanya. Ang pangunahing salin ay natural at akma sa konteksto, habang pinananatili sa talababa ang tunay na saklaw ng kahulugan.
- source_word: מָתַי אֶעֱשֶׂה גַם אָנֹכִי לְבֵיתִי
  choice: kailan naman ako makapaghahanda para sa sarili kong sambahayan?
  rationale: Ang עשה לְבֵיתִי ay literal na “gumawa para sa aking bahay,” ngunit sa konteksto ay tumutukoy sa pagkilos para sa kapakanan at kabuhayan ng sariling sambahayan. Ang “naman” ay naghahatid sa diin ng גַם אָנֹכִי.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Pinananatili ang personal na pangalan sa halip na palitan ito ng titulo, nang walang pagpasok ng denominasyonal na pagpapakahulugan.
- issue: Ugnayan ng pagpapala at pagdating ni Jacob sa לְרַגְלִי
  choice: dahil sa pagdating ko
  alternative: kasabay ng pagdating ko; dahil sa akin
  rationale: Maaaring temporal o sanhi ang idyoma. Ang napiling salin ay akma sa pahayag ni Jacob ngunit ang alternatibong saklaw ay hayagang pinananatili sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sambahayan” para sa בֵּיתִי dahil ang tinutukoy ay pamilya at kabuhayan, hindi lamang gusali. Iniwasan ang sobrang literal na “sa aking paa,” na hindi natural bilang idyoma sa Tagalog, ngunit itinabi ito sa talababa.
