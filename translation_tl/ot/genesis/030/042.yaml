base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/042.yaml
  text: But when the flock were feeble[a], he would not put them in; so the feeble ones became Laban’s[c][b], and the strong ones Jacob’s.
translation:
  language: tl
  text: Ngunit kapag mahihina ang mga hayop sa kawan[a], hindi niya inilalagay ang mga patpat sa harap ng mga ito[b]. Kaya ang mahihina ay napupunta kay Laban, at ang malalakas[c] ay kay Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapag mahihina ang kawan.” Maaaring tumukoy ang salitang Hebreo sa mahihinang hayop; nauunawaan naman ito ng ilan bilang mas tiyak na pagtukoy sa mga hayop na nahuhuli o di-mainam para sa pagpapalahi.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, hindi niya inilalagay sa harap nila ang mga patpat na binanggit sa mga naunang talata.
    reason: cross_reference
  - marker: c
    text: O “matitibay” o “masisigla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲטִיף הַצֹּאן
  choice: kapag mahihina ang mga hayop sa kawan
  rationale: Ang ב na may infinitive construct ay bumubuo ng sugnay na panahunan. Sa konteksto ng pagpapalahi, ang עטף ay tumutukoy sa mahihinang hayop, bagaman maaaring may mas tiyak na pahiwatig tungkol sa huli o di-mainam na pagpapalahi. Ang parirala ay likas sa Filipino at hindi labis na nagpapakahulugan.
- source_word: הַצֹּאן
  choice: mga hayop sa kawan
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Nililinaw ng saling ito na mga hayop ang tinutukoy habang pinananatili ang pangkalahatang kahulugan ng kawan.
- source_word: לֹא יָשִׂים
  choice: hindi niya inilalagay ang mga patpat sa harap ng mga ito
  rationale: Ang שׂים ay nangangahulugang ilagay o ipuwesto. Walang tahasang layon sa Hebreo, ngunit malinaw sa mga naunang talata na ang tinutukoy ay ang mga patpat; isinama ito sa teksto para sa natural at malinaw na Filipino, na may talababa upang tukuyin ang kontekstuwal na paglilinaw.
- source_word: וְהָיָה
  choice: Kaya ... ay napupunta
  rationale: 'Ipinahahayag ng anyo ang naging resulta: ang bawat pangkat ay nauukol kina Laban o Jacob. Ang “Kaya” at “napupunta” ay natural na naghahatid ng resultang ito.'
- source_word: הָעֲטֻפִים
  choice: ang mahihina
  rationale: Ang anyong mula sa עטף ay tumutukoy sa mahihinang hayop at inuulit ang parehong konsepto sa unang sugnay.
- source_word: לְלָבָן
  choice: kay Laban
  rationale: Ang ל ay nagpapahayag dito ng pag-aari o pagkakabahagi. Sa Filipino, natural na ipinahahayag ito sa pamamagitan ng “napupunta kay Laban.”
- source_word: וְהַקְּשֻׁרִים
  choice: ang malalakas
  rationale: Bagaman di-karaniwan ang anyo, ipinakikita ng kaibahan nito sa הָעֲטֻפִים na tumutukoy ito sa matitibay o masiglang hayop. Ang “malalakas” ang pinakatuwirang salin.
- source_word: לְיַעֲקֹב
  choice: ay kay Jacob
  rationale: Gaya ng לְלָבָן, ang ל ay nagpapahayag ng pag-aari o pagkakabahagi. Naiiwasan ng elipsis ang hindi kailangang pag-uulit ng “napupunta” habang malinaw pa rin ang kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga hayop sa kawan” upang maging malinaw ang kolektibong צֹאן, at ang “mahihina” laban sa “malalakas” upang mapanatili ang pangunahing paghahambing nang hindi pinipili ang mas tiyak ngunit di-tiyak na paliwanag tungkol sa panahon o kalidad ng pagpapalahi.
