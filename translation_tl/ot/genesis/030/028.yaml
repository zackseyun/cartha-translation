  text: Then he said[a], “Name your wages, and I will give it.”
translation:
  language: tl
  text: Pagkatapos ay sinabi niya, “Sabihin mo kung magkano ang sahod mo, at ibibigay ko ito sa iyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Pagkatapos ay sinabi niya
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinapahayag ng “Pagkatapos” ang pagkakasunod-sunod ng pangyayari.
- source_word: נָקְבָה
  choice: Sabihin mo kung magkano
  rationale: Ang נקב dito ay tumutukoy sa tahasang pagtukoy o pagtatakda. Sa usapin ng kabayaran, mas natural sa modernong Tagalog ang “Sabihin mo kung magkano” kaysa literal na “Pangalanan mo.”
- source_word: שְׂכָרְךָ
  choice: ang magiging sahod mo
  rationale: Ang שָׂכָר ay kabayaran para sa paggawa. Ang “sahod” ang malinaw at karaniwang salitang Tagalog sa kontekstong ito.
- source_word: עָלַי
  choice: sa iyo
  rationale: Literal itong “sa ibabaw ko/sa akin,” ngunit sa idyomang ito ipinahihiwatig na dapat tukuyin ni Jacob ang sahod na pananagutan ni Laban. Isinama ang “sa iyo” sa kasunod na sugnay upang maging natural at malinaw sa Tagalog nang hindi ginagawang hiwalay na “sa akin” ang Hebreong idyoma.
- source_word: וְאֶתֵּנָה
  choice: at ibibigay ko iyon sa iyo
  rationale: Ang נתן ay “magbigay.” Ginamit ang “iyon” bilang panghalip para sa itinakdang halaga ng sahod, at ang “sa iyo” ay likas na kailangan sa Tagalog upang linawin ang tatanggap.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, tuwiran, at marangal. Iniwasan ang di-likas na literalismong “Pangalanan mo ang iyong sahod sa akin,” habang pinananatili ang diwa ng tahasang pagtatakda ng kabayaran at ang pangako ni Laban na ibigay ito.
