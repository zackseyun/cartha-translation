  text: אֶֽעֱבֹ֨ר בְּ/כָל צֹֽאנְ/ךָ֜ הַ/יּ֗וֹם הָסֵ֨ר מִ/שָּׁ֜ם כָּל שֶׂ֣ה נָקֹ֣ד וְ/טָל֗וּא וְ/כָל שֶׂה חוּם֙ בַּ/כְּשָׂבִ֔ים וְ/טָל֥וּא וְ/נָקֹ֖ד בָּ/עִזִּ֑ים וְ/הָיָ֖ה שְׂכָרִֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/032.yaml
  text: Let me pass through all your flock today[a], removing from there every speckled and spotted sheep, every dark-colored lamb among the sheep, and every spotted and speckled one among the goats[b]; and that will be my wages.
translation:
  language: tl
  text: Hayaan mong daanan ko ngayon ang buong kawan mo at ibukod mula rito ang bawat tupang may batik at may tagpi, ang bawat tupang maitim ang kulay[a], at ang bawat kambing na may tagpi at may batik[b]. Ang mga iyon ang magiging sahod ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kayumanggi.” Ang salitang Hebreo ay tumutukoy sa madilim o kayumangging kulay ng mga tupa.
    reason: lexical_alternative
  - marker: b
    text: Ang “may batik” (נָקֹד) at “may tagpi” (טָלוּא) ay kapwa tumutukoy sa mga markang kulay sa balahibo. Maaaring bahagyang mag-overlap ang eksaktong kahulugan ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱבֹר
  choice: Daraan ko
  rationale: Ang Qal imperfect na 1cs ay maaaring pahiwatig ng mungkahi o pahintulot sa konteksto ng pakikipagkasundo; natural sa Filipino ang “Daraan ko ngayon…” bilang panukalang gagawin ni Jacob.
- source_word: בְּכָל צֹאנְךָ
  choice: ang buo mong kawan
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing; pinananatili ng “kawan” ang kolektibong diwa.
- source_word: הָסֵר מִשָּׁם
  choice: ihihiwalay mula roon
  rationale: Sa konteksto, ang pag-aalis ay pagsasama-sama at pagbubukod ng mga hayop na magiging kabayaran, kaya malinaw at likas ang “ihihiwalay.”
- source_word: נָקֹד
  choice: may batik
  rationale: Tumutukoy sa maliliit o hiwa-hiwalay na marka sa balahibo; karaniwang mauunawaan ang “may batik.”
- source_word: טָלוּא
  choice: may tagpi
  rationale: Tumutukoy sa mas malalaki o tagpi-tagping kulay; ang “may tagpi” ay nagpapanatili ng posibleng kaibahan nito sa נָקֹד nang hindi nagiging labis na tiyak.
- source_word: חוּם
  choice: maitim ang kulay
  rationale: Ang salita ay tumutukoy sa madilim o kayumangging kulay. Hindi nililimitahan ng “maitim ang kulay” ang kahulugan sa isang eksaktong modernong kulay.
- source_word: בַּכְּשָׂבִים
  choice: tupa
  rationale: Bagaman maaaring tumukoy ang כֶּשֶׂב sa batang tupa, sa konteksto ng paghahambing sa mga kambing ay natural ang pangkalahatang “tupa.”
- source_word: בָּעִזִּים
  choice: kambing
  rationale: Pangkalahatang kolektibong tawag sa goats at hindi nagpapasok ng kasariang hindi kailangang tukuyin dito.
- source_word: וְהָיָה שְׂכָרִי
  choice: Ang mga iyon ang magiging kabayaran sa akin
  rationale: Malinaw na ang mga ibinukod na hayop ang magiging bayad kay Jacob; ang “kabayaran” ay dignified at natural sa kasunduang paggawa.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “kawan” bilang kolektibong tawag, saka tahasang “tupa” at “kambing” sa mga kasunod na sugnay. Pinanatili sa talababa ang kawalang-katiyakan sa eksaktong kulay at uri ng mga marka.
