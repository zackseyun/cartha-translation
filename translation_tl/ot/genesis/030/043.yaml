  naturalness: 'Ang “At ang lalaki ay lubhang umunlad” ay naiintindihan ngunit medyo di-likas sa modernong Tagalog: ang “ang lalaki” ay maaaring magtunog pangkalahatang paglalarawan, at ang “umunlad” ay masyadong malawak. Mas natural ang “At lubhang yumaman ang lalaking iyon,” habang pinananatili ang pangngalang “lalaki” ng Hebreo at ang pagtukoy nito kay Jacob sa konteksto.'
