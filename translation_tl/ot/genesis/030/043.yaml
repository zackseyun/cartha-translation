base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/043.yaml
  text: And the man became exceedingly prosperous[b][a], and he came to have many flocks and female servants and male servants and camels and donkeys.
translation:
  language: tl
  text: At lubhang yumaman ang lalaking iyon, at nagkaroon siya ng maraming kawan, mga aliping babae at mga aliping lalaki, mga kamelyo at mga asno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹץ
  choice: lubhang umunlad
  rationale: Ang pandiwang פרץ ay literal na may diwang pagbulusok o paglaganap, ngunit sa kontekstong ito ay tumutukoy sa pambihirang paglago ng kayamanan. Likas sa modernong Tagalog ang “lubhang umunlad” at naipahahayag nito ang resultang diwa.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Karaniwang pangngalan ang ginamit sa Hebreo at tumutukoy kay Jacob sa konteksto. Pinanatili ang anyong “ang lalaki” sa halip na tahasang ilagay ang pangalan.
- source_word: מְאֹד מְאֹד
  choice: lubha
  rationale: Ang pag-uulit ng מְאֹד ay matinding pagpapalakas. Sapat na ipinahahayag ng “lubha” ang diin nang hindi nagiging alanganin ang Tagalog.
- source_word: וַיְהִי לוֹ
  choice: nagkaroon siya ng
  rationale: Ipinakikita ng konstruksyon ang pagdating sa kalagayan ng pagmamay-ari. Natural at malinaw sa Tagalog ang “nagkaroon siya ng.”
- source_word: צֹאן רַבּוֹת
  choice: maraming kawan
  rationale: Ang צֹאן ay kolektibong katawagan sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Iniiwasan ng “kawan” ang di-makatwirang paglilimita sa isang uri lamang.
- source_word: שְׁפָחוֹת
  choice: mga aliping babae
  rationale: Tumutukoy ito sa mga babaeng nasa katayuang alipin o nakataling tagapaglingkod. Dahil kasama sila sa talaan ng mga ari-ariang natamo, pinananatili ng “aliping babae” ang panlipunang realidad ng teksto.
- source_word: עֲבָדִים
  choice: mga aliping lalaki
  rationale: Ito ang panlalaking katapat sa listahan at maaaring mangahulugang mga alipin o tagapaglingkod. Nililinaw ng “aliping lalaki” kapuwa ang kasarian at ang nakataling katayuan sa kontekstong ito.
- source_word: גְמַלִּים
  choice: mga kamelyo
  rationale: Ito ang karaniwan at malinaw na modernong katumbas sa Tagalog.
- source_word: חֲמֹרִים
  choice: mga asno
  rationale: Ang “asno” ay dignified at karaniwang katawagang biblikal sa modernong Filipino para sa hayop na tinutukoy.
theological_decisions:
- issue: Kung gagamitin ang wikang “alipin” o “tagapaglingkod” para sa שְׁפָחוֹת at עֲבָדִים
  choice: mga aliping babae at mga aliping lalaki
  alternative: mga babaeng tagapaglingkod at mga lalaking tagapaglingkod
  rationale: Maaaring tumukoy ang mga salitang Hebreo sa mga kasambahay o tagapaglingkod, ngunit maaari rin nilang ipahiwatig ang legal at panlipunang katayuan ng pagkaalipin. Dahil inilista rito ang mga tao kasama ng kawan at mga hayop bilang bahagi ng natamong kayamanan, mas tumpak sa konteksto ang “alipin,” nang hindi nagbibigay ng pagsang-ayon sa institusyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at tuwiran. Pinanatili ang sunod-sunod na listahan ng Hebreo, ngunit gumamit ng mga kuwit upang maging natural at madaling basahin sa Tagalog.
