  yaml_path: translation/ot/genesis/030/012.yaml
  text: And Zilpah[a], Leah's female servant, bore Jacob a second son.
translation:
  language: tl
  text: At nagsilang si Zilpa, ang aliping babae[a] ni Lea, ng ikalawang anak na lalaki para kay Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “babaeng lingkod.” Ang salitang Hebreo ay tumutukoy sa babaeng lingkod o alipin na kaugnay ni Lea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: At muling nanganak
  rationale: Ang wayyiqtol ng ילד ay nagpapatuloy sa salaysay. Idinagdag ang “muling” upang likas na maipahayag sa Tagalog na ito ang ikalawang panganganak ni Zilpa, gaya ng nililinaw ng בֵּן שֵׁנִי.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Isinalin sa karaniwang anyong Tagalog ang personal na pangalang Hebreo.
- source_word: שִׁפְחַת לֵאָה
  choice: ang aliping babae ni Lea
  rationale: Pinananatili nito ang tahasang kasarian at mababang katayuang panlipunan ng שִׁפְחָה. Mas tumpak ito kaysa sa payak na “katulong,” na maaaring magpahiwatig ng makabagong bayarang empleyado.
- source_word: בֵּן שֵׁנִי
  choice: isang anak na lalaki
  rationale: Kasama ng “muling nanganak,” malinaw na ito ang ikalawang anak na lalaki ni Zilpa kay Jacob, habang nananatiling natural ang daloy sa Tagalog.
- source_word: לְיַעֲקֹב
  choice: para kay Jacob
  rationale: Ang לְ ay tumutukoy kay Jacob bilang ama o kinauukulan ng panganganak. Ang “para kay Jacob” ay likas na Tagalog at pinananatili ang relasyong ipinahihiwatig ng Hebreo.
