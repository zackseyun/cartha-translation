  text: And it happened, when Rachel had borne Joseph, that Jacob said to Laban, “Send me away, that I may go to my own place and to my own land.”
translation:
  language: tl
  text: Nang maipanganak ni Raquel si Jose, sinabi ni Jacob kay Laban, “Pahintulutan mo na akong umalis upang makapunta ako sa aking sariling lugar at sa aking lupain.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Likas na panandang temporal sa modernong Tagalog; naipapahayag nito ang Hebreong pangyayari at pagkakasunod nang hindi mabigat ang literal na ‘At nangyari.’
- source_word: יָלְדָה רָחֵל אֶת־יוֹסֵף
  choice: maipanganak na ni Raquel si Jose
  rationale: Tumpak at likas na salin ng natapos na panganganak; pinananatili ang mga pangalang karaniwang anyo sa Tagalog.
- source_word: שַׁלְּחֵנִי
  choice: Pahintulutan mo na akong umalis
  rationale: Sa konteksto, humihiling si Jacob kay Laban na payagan o paalisin siya; mas natural ito kaysa sa literal na ‘Ipadala mo ako’ at hindi ipinapalagay na marahas siyang itinataboy.
- source_word: אֶל־מְקוֹמִי וּלְאַרְצִי
  choice: sa sarili kong lugar at lupain
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na katawagan sa Hebreo at ang diin ng mga hulaping paari.
