  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Iniwasan ang sobrang literal at lipas na panimulang ‘At nangyari,’ habang pinanatili ang temporal na ugnayan at ang tuwirang pakiusap ni Jacob.
