base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/006.yaml
  text: Then Rachel said[a], “God has judged me, and has also heard my voice and given me a son.” Therefore she called his name Dan.
translation:
  language: tl
  text: Sinabi ni Raquel, “Hinatulan ng Diyos ang aking usapin; dininig din niya ang aking tinig at binigyan ako ng isang anak na lalaki.” Kaya pinangalanan niya itong Dan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Dan ay katunog ng pandiwang Hebreo na nangangahulugang “humatol” o “hinatulan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּנַנִּי
  choice: Hinatulan ng Diyos ang aking usapin
  rationale: Pinananatili nito ang larawang panghukuman at ang kaugnayan sa pangalang Dan, ngunit hindi nito pinalalakas ang kahulugan tungo sa tahasang ‘pinawalang-sala’ o ‘binigyang-katarungan.’
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang pangngalan sa Hebreo, isahan ang pandiwa at ang tinutukoy sa salaysay ay ang Diyos.
- source_word: שָׁמַע בְּקֹלִי
  choice: dininig din niya ang aking tinig
  rationale: Pinananatili ang tahasang ‘aking tinig’ ng Hebreo at ang diwang dininig ng Diyos ang personal na pakiusap ni Raquel.
- source_word: וַיִּתֶּן לִי בֵּן
  choice: binigyan ako ng isang anak na lalaki
  rationale: Tuwirang ipinahahayag ang pagbibigay at pinananatili na lalaki ang anak, gaya ng בֵּן.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Likas at maikli itong panandang naghahayag na ang sumunod na pagpapangalan ay bunga ng naunang pahayag.
- source_word: קָרְאָה שְׁמוֹ דָּן
  choice: pinangalanan niya itong Dan
  rationale: Natural na katumbas sa makabagong Tagalog ng idyomang Hebreo na ‘tinawag ang pangalan niya,’ habang malinaw na pinananatili ang paliwanag sa pangalan.
- source_word: דָּן
  choice: Dan
  rationale: Karaniwang anyo ng pangalang Hebreo at kailangan upang mapanatili ang larong-salita sa pandiwang may kahulugang humatol.
theological_decisions:
- issue: Ang kahulugan ng pahayag ni Raquel tungkol sa paghatol ng Diyos
  choice: Hinatulan ng Diyos ang aking usapin
  alternative: Binigyang-katarungan ako ng Diyos; Hinatulan ako ng Diyos
  rationale: Pinananatili ng napiling salin ang legal na metapora at ang kaugnayan sa Dan nang hindi ipinapalagay na ang sinabi ay isang mas malakas na doktrinal na pahayag tungkol sa pagpapawalang-sala. Iniiwasan din nito ang karaniwang negatibong pahiwatig sa Tagalog ng payak na ‘hinatulan ako.’
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘dininig’ upang ihayag ang tugon sa personal na pakiusap, at ang likas na ‘pinangalanan’ sa halip na literal ngunit asiwa na ‘tinawag ang pangalan.’
