  text: וַ/תֵּ֣רֶא רָחֵ֗ל כִּ֣י לֹ֤א יָֽלְדָה֙ לְ/יַעֲקֹ֔ב וַ/תְּקַנֵּ֥א רָחֵ֖ל בַּ/אֲחֹתָ֑/הּ וַ/תֹּ֤אמֶר אֶֽל יַעֲקֹב֙ הָֽבָ/ה לִּ֣/י בָנִ֔ים וְ/אִם אַ֖יִן מֵתָ֥ה אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/001.yaml
  text: When Rachel saw that she had borne no children to Jacob[a], she became jealous of her sister, and she said to Jacob, “Give me children[b], or I will die!”
translation:
  language: tl
  text: Nang makita ni Raquel na hindi siya nagkaanak kay Jacob, nainggit siya sa kanyang kapatid. Sinabi niya kay Jacob, “Bigyan mo ako ng mga anak[a], kung hindi ay mamamatay ako!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak na lalaki”; maaari rin itong tumukoy sa mga anak o supling sa pangkalahatan sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא רָחֵל
  choice: Nang makita ni Raquel
  rationale: Ipinahahayag ng “nang” ang ugnayang temporal sa pagitan ng pagkaunawa ni Raquel at ng sumunod niyang reaksiyon, habang natural ang daloy sa makabagong Tagalog.
- source_word: כִּי לֹא יָלְדָה לְיַעֲקֹב
  choice: na hindi siya nagkaanak kay Jacob
  rationale: Ang יָלַד kapag babae ang simuno ay tumutukoy sa panganganak. Ang “hindi nagkaanak kay Jacob” ay natural sa Tagalog at pinananatili ang kaugnayang ipinahahayag ng לְ.
- source_word: וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ
  choice: nainggit siya sa kanyang kapatid
  rationale: Sa konteksto ng pagkamayabong ng kapatid, ang קנא ay likas na isinasaling “nainggit.” Ginamit ang panghalip sa ikalawang pagbanggit kay Raquel upang maging natural sa Tagalog nang hindi nagiging malabo ang tinutukoy.
- source_word: הָבָה לִּי בָנִים
  choice: Bigyan mo ako ng mga anak
  rationale: Bagaman ang בָנִים ay pormal na “mga anak na lalaki,” maaari itong tumukoy nang mas malawak sa mga supling sa konteksto ng panganganak. Ang “mga anak” ang natural at hindi labis na nagtatakda ng kasarian.
- source_word: וְאִם אַיִן
  choice: kung hindi ay
  rationale: Pinananatili nito ang tuwirang kondisyon at matinding alternatibong ipinahahayag ng Hebreo.
- source_word: מֵתָה אָנֹכִי
  choice: mamamatay ako
  rationale: Natural nitong ipinahahayag sa Tagalog ang mariin at napipintong bunga ng sinabi ni Raquel, nang hindi ipinapaliwanag kung literal o pagmamalabis ang pananalita.
theological_decisions:
- issue: Kung literal o eksaherado ang pahayag na מֵתָה אָנֹכִי
  choice: Pinanatiling tuwiran bilang “mamamatay ako”
  alternative: “Para na rin akong patay” o “mamamatay ako sa lungkot”
  rationale: Hindi nililinaw ng teksto kung literal, idyomatiko, o pagmamalabis ang sinabi ni Raquel. Iniiwasan ng tuwirang salin ang pagpasok ng sikolohikal o teolohikal na paliwanag na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nagkaanak kay Jacob” bilang natural na katumbas ng pariralang Hebreo at “nainggit” bilang karaniwang pagpapahayag ng reaksiyon ni Raquel. Pinanatili ang matinding tono ng kanyang kahilingan.
