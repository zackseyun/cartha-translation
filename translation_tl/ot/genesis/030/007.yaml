  yaml_path: translation/ot/genesis/030/007.yaml
  text: Bilhah[a], Rachel’s female servant, conceived again and bore Jacob a second son.
translation:
  language: tl
  text: Muling nagdalang-tao si Bilha, ang aliping babae ni Raquel, at nagsilang siya kay Jacob ng ikalawang anak na lalaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Muling nagdalang-tao
  rationale: Ang הרה ay tumutukoy sa paglilihi o pagdadalang-tao, at ang עוֹד ay nagsasaad ng pag-uulit. Natural at malinaw sa modernong Tagalog ang “muling nagdalang-tao.”
- source_word: וַתֵּלֶד
  choice: nagsilang
  rationale: Ang ילד sa qal ay nangangahulugang manganak o magsilang; ang “nagsilang” ay maikli, marangal, at angkop sa salaysay.
- source_word: שִׁפְחַת
  choice: aliping babae
  rationale: Ang שִׁפְחָה ay babaeng alipin o utusang may mababang katayuang panlipunan. Ipinakikita ng “aliping babae” ang hindi malayang kalagayan nang hindi gumagamit ng makalumang katawagan.
- source_word: בֵּן שֵׁנִי
  choice: ikalawang anak na lalaki
  rationale: Tuwirang inilalarawan ng parirala ang pangalawang lalaking anak; malinaw at natural ito sa Tagalog.
- source_word: לְיַעֲקֹב
  choice: para kay Jacob
  rationale: Ang לְ ay maaaring magpahiwatig na ang anak ay ipinanganak para o ukol kay Jacob. Pinananatili ng “para kay Jacob” ang relasyong ipinahihiwatig ng Hebreo.
- source_word: בִּלְהָה שִׁפְחַת רָחֵל
  choice: si Bilha, ang aliping babae ni Raquel
  rationale: Pinananatili nito ang appositional na pagkakakilanlan kay Bilha at ang relasyon ng kanyang katayuan kay Raquel sa malinaw na ayos ng Tagalog.
theological_decisions:
- issue: Diwa ng לְיַעֲקֹב sa pagsilang
  choice: para kay Jacob
  alternative: kay Jacob / anak ni Jacob
  rationale: Maaaring magpahiwatig ang pang-ukol ng kaugnayan, kapakinabangan, o kinikilalang pagiging ama. Hindi ito ginawang tahasang “anak ni Jacob” upang hindi labis na paliitin ang saklaw ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang mga anyong “Bilha,” “Raquel,” at “Jacob.” Tahasang isinalin ang katayuang nakapaloob sa שִׁפְחָה bilang “aliping babae.”
