  text: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
translation:
  language: tl
  text: Ibigay mo sa akin ang mga asawa ko at ang mga anak ko,[a] na dahil sa kanila ay naglingkod ako sa iyo, upang makaalis ako; sapagkat alam mo ang paglilingkod na ginawa ko para sa iyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “na dahil sa kanila ay naglingkod ako sa iyo.” Maaaring ang “kanila” sa Hebreo ay higit na tumutukoy sa mga asawa kaysa sa buong pamilyang kababanggit lamang.'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, magkaugnay ang mga salitang isinasaling “paglilingkod” at “naglingkod,” kaya mariing itinatampok ang gawaing ginawa ni Jacob para kay Laban.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה
  choice: Ibigay mo sa akin
  rationale: Tuwirang pautos ito kay Laban; likas sa Tagalog na banggitin ang tumatanggap na “sa akin.”
- source_word: נָשַׁי וְאֶת יְלָדַי
  choice: ang mga asawa ko at ang mga anak ko
  rationale: Malinaw sa konteksto na mga asawa ni Jacob ang tinutukoy ng נָשַׁי, at “mga anak” ang natural na katumbas ng יְלָדַי.
- source_word: אֲשֶׁר עָבַדְתִּי אֹתְךָ בָהֵן
  choice: na ipinaglingkod ko sa iyo
  rationale: Ipinahahayag ng “ipinaglingkod” na sila ang dahilan o kapalit ng paglilingkod ni Jacob, habang pinananatili ang posibilidad na ang reperensiya ay lalo nang tumutukoy sa mga asawa.
- source_word: וְאֵלֵכָה
  choice: at aalis na ako
  rationale: Ipinakikita ng anyong cohortative ang hangarin ni Jacob na umalis; natural at matatag ang “aalis na ako” sa makabagong Tagalog.
- source_word: כִּי אַתָּה יָדַעְתָּ
  choice: sapagkat alam mo
  rationale: Nagbibigay ang כִּי ng dahilan, at ang perpektong יָדַעְתָּ ay may kasalukuyang saysay na likas isaling “alam mo.”
- source_word: אֶת עֲבֹדָתִי אֲשֶׁר עֲבַדְתִּיךָ
  choice: kung paano ako naglingkod sa iyo
  rationale: Natural itong Tagalog para sa kauri-ng-layong konstruksyon ng Hebreo. Napananatili ng “naglingkod” ang ugat na עבד, bagaman hindi lubos na maigagaya nang hindi pilit ang pag-uulit ng pangngalan at pandiwa.
