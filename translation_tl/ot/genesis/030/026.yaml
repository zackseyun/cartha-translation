revisions:
- from: Ibigay mo sa akin ang mga asawa ko at ang mga anak ko[a], na ipinaglingkod ko sa iyo, at aalis na ako; sapagkat alam mo kung paano ako naglingkod sa iyo.[b]
  to: Ibigay mo sa akin ang mga asawa ko at ang mga anak ko,[a] na dahil sa kanila ay naglingkod ako sa iyo, upang makaalis ako; sapagkat alam mo ang paglilingkod na ginawa ko para sa iyo.[b]
  rationale: Pinalitan ang malabong “ipinaglingkod” ng malinaw na pananalitang nagpapahayag na ang mga nabanggit ang dahilan ng paglilingkod, habang pinapanatili sa talababa ang tunay na kalabuan kung lalo bang mga asawa ang tinutukoy. Inayos din ang cohortative bilang layuning makaalis at ibinalik sa pangunahing teksto ang pag-uulit ng ‘paglilingkod/naglingkod.’
