translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Napakaligaya ko!” bilang natural na padamdam at “mga babae” para sa idyomatikong saklaw ng בָּנוֹת. Ang hindi maililipat na larong-salita sa Hebreo ay pinanatili sa talababa.
