  yaml_path: translation/ot/genesis/030/013.yaml
  text: Then Leah said[b][a], “Happy am I! For women will call me happy.” So she called his name Asher.
translation:
  language: tl
  text: Sinabi ni Lea, “Napakaligaya ko! Sapagkat tatawagin akong maligaya ng mga babae.[b]” Kaya pinangalanan niya siyang Asher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Asher ay kaugnay ng mga salitang Hebreo para sa “maligaya” at “tatawaging maligaya” sa sinabi ni Lea.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga anak na babae”; maaari itong tumukoy sa mga babae sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָשְׁרִי
  choice: Napakaligaya ko!
  rationale: Ang anyong padamdam ay natural sa modernong Tagalog at malinaw na nagpapahayag ng kaligayahan ni Lea. Pinananatili rin nito ang ugnayang leksikal sa אִשְּׁרוּנִי, bagaman hindi maisasalin nang tuwiran sa Tagalog ang tunog na kaugnay ng pangalang Asher.
- source_word: אִשְּׁרוּנִי
  choice: tatawagin akong maligaya
  rationale: Ipinapahayag ng Piel ng אשר ang pagkilala o pagtawag sa isang tao bilang maligaya. Ang saling ito ay natural at pinananatili ang pag-uulit ng diwa ng kaligayahan.
- source_word: בָּנוֹת
  choice: mga babae
  rationale: Bagaman literal na “mga anak na babae,” maaari itong tumukoy sa kababaihan sa pangkalahatan sa idyomang Hebreo. Mas natural at mas malamang na tama sa kontekstong panlipunan ang “mga babae”; inilalahad sa talababa ang literal na anyo.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  choice: Kaya pinangalanan niya siyang Asher
  rationale: Natural na katumbas sa Tagalog ng karaniwang pormulang Hebreo sa pagbibigay ng pangalan, habang ipinakikita ng “Kaya” ang kaugnayan ng sinabi ni Lea sa ipinangalan niya.
- source_word: אָשֵׁר
  choice: Asher
  rationale: Isinasatitik ang pangalang pantangi sa halip na isalin. Ipinaliliwanag sa talababa ang larong-salita sa Hebreo.
