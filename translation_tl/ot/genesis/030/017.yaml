  text: And God listened to Leah[a], and she conceived and bore Jacob a fifth son.
translation:
  language: tl
  text: Dininig ng Diyos si Lea[a], at naglihi siya at nagsilang para kay Jacob ng ikalima niyang anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Narinig ng Diyos si Lea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Dininig
  rationale: 'Sa pariralang שׁמע אֶל, higit ito sa basta pagkarinig: ipinahihiwatig nito ang mapagkalingang pakikinig at pagtugon. Likas din sa Filipino ang “dininig” para sa panalangin o pakiusap na pinakinggan nang may pagsang-ayon.'
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tumutukoy ito sa iisang Diyos sa salaysay; “Diyos” ang karaniwan at malinaw na katumbas.
- source_word: אֶל לֵאָה
  choice: si Lea
  rationale: Ang אֶל ay likas nang naipapahayag sa pandiwang Filipino na “dininig,” kaya hindi kailangan ng hiwalay na pang-ukol. Ginamit ang karaniwang anyong Filipino ng pangalang Lea.
- source_word: וַתַּהַר
  choice: Naglihi siya
  rationale: Maikli at marangal na katumbas ng paglilihi sa salaysay ng kapanganakan, at pinananatiling hiwalay sa mismong panganganak.
- source_word: וַתֵּלֶד
  choice: at nagsilang
  rationale: Natural at dignified na paglalarawan ng panganganak, habang pinananatili ang maikli at sunod-sunod na daloy ng Hebreo.
- source_word: לְיַעֲקֹב
  choice: kay Jacob
  rationale: 'Pinananatili ang di-tuwirang ugnayang ipinahahayag ng לְ: isinilang ni Lea ang anak kay Jacob.'
- source_word: בֵּן חֲמִישִׁי
  choice: ikalima niyang anak na lalaki
  rationale: Malinaw na ipinahahayag ang ordinal at ang kasarian ng anak. Ang “niyang” ay likas na nag-uugnay sa bilang kay Lea sa konteksto, nang hindi ipinahihiwatig na ito ang ikalimang anak na lalaki ni Jacob sa kabuuan.
theological_decisions:
- issue: Pahiwatig ng banal na pagtugon sa שׁמע אֶל
  choice: Dininig ng Diyos si Lea
  alternative: Narinig ng Diyos si Lea
  rationale: Ang “dininig” ay nagpapahayag ng mapagkalingang pakikinig at kanais-nais na pagtugon na ipinahihiwatig ng idyomang Hebreo, ngunit hindi nagdaragdag kung ano mismo ang sinabi o ipinanalangin ni Lea.
translation_notes:
  register: Modernong Filipino na maikli, marangal, at madaling maunawaan. Ginamit ang “dininig” bilang pangunahing salin dahil likas itong tumutukoy sa pakikinig na may pagtugon; inilagay sa talababa ang mas pormal na “narinig.”
