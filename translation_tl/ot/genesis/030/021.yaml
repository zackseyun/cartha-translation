lexical_decisions:
- source_word: וְאַחַר
  choice: Pagkatapos nito
  rationale: Nagsasaad ng pagkakasunod sa naunang mga kapanganakan at likas pakinggan sa makabagong salaysay sa Filipino.
- source_word: יָלְדָה
  choice: nagsilang siya
  rationale: Tuwirang katumbas ng Qal perfect na pambabae at malinaw na tumutukoy sa panganganak.
- source_word: בַּת
  choice: isang anak na babae
  rationale: Karaniwang Filipino para sa isang babaeng anak bilang layon ng pandiwang “nagsilang.”
- source_word: וַתִּקְרָא אֶת־שְׁמָהּ
  choice: at pinangalanan niya itong
  rationale: Natural na Filipino para sa Hebreong idyomang literal na “tinawag ang pangalan niya,” habang pinananatili ang kasunod na kilos sa salaysay.
- source_word: דִּינָה
  choice: Dina
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo na דִּינָה.
