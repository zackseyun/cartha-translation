- from: Sinabi niya sa kanya, “Alam mo kung paano ako naglingkod sa iyo at kung ano ang naging kalagayan ng mga alaga mong hayop habang nasa pangangalaga ko.[a]”
  to: Sinabi niya sa kanya, “Alam mo kung paano ako naglingkod sa iyo at kung ano ang naging kalagayan ng iyong mga kawan sa aking pangangalaga.[a]”
  rationale: Inalis ang “habang” upang hindi gawing tahasang pansamantalang paglalarawan ang Hebreong parirala. Pinalitan ang “mga alaga mong hayop” ng “iyong mga kawan” para sa mas angkop na terminong pastoral. Nananatili ang “naging kalagayan” upang hindi igiit sa pangunahing teksto na tiyak na pag-unlad ang ibig sabihin, at inilalagay ang literal at posibleng idiomatikong pakahulugan sa talababa.
