  language: tl
  text: Sinabi niya sa kanya, “Alam mo kung paano ako naglingkod sa iyo at kung ano ang naging kalagayan ng iyong mga kawan sa aking pangangalaga.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at kung ano ang naging lagay ng iyong mga kawan kasama ko.” Maaaring tumukoy ang Hebreong pananalita sa naging lagay o pag-unlad ng mga kawan ni Laban habang nasa pangangalaga ni Jacob, hindi lamang sa kinaroroonan ng mga ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Sinabi niya sa kanya
  rationale: Likas na salaysay sa modernong Tagalog; hindi kailangang ilantad ang panimulang waw bilang “At” upang mapanatili ang pagkakasunod ng pangyayari.
- source_word: אַתָּה יָדַעְתָּ
  choice: Alam mo
  rationale: Ang tahasang panghalip ay may diin sa Hebreo, ngunit sapat at likas sa Tagalog ang “Alam mo”; ang “ikaw mismo” ay maaaring magbigay ng labis na diin.
- source_word: אֵת אֲשֶׁר עֲבַדְתִּיךָ
  choice: kung paano ako naglingkod sa iyo
  rationale: Pinananatili ng “naglingkod” ang diwa ng paggawa para sa isang nakatataas, habang ang “kung paano” ay natural na kumakatawan sa Hebreong konstruksyon.
- source_word: מִקְנְךָ
  choice: mga alaga mong hayop
  rationale: Tumutukoy ang kolektibong מִקְנֶה sa mga domestikadong hayop, kabilang ang mga kawan; mas madaling maunawaan ito ng karaniwang mambabasa kaysa sa teknikal na “mga hayop na pag-aari.”
- source_word: הָיָה מִקְנְךָ אִתִּי
  choice: kung ano ang naging kalagayan ng mga alaga mong hayop habang nasa pangangalaga ko
  rationale: Ipinahihiwatig ng idyoma ang naging lagay o pag-unlad ng mga hayop sa ilalim ng pangangalaga ni Jacob, hindi lamang ang kanilang lokasyon. Gayunman, inilalahad sa talababa ang mas literal na anyo upang mapanatili ang tunay na kalabuan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Ginamit ang “mga alaga mong hayop” para sa malawak na kolektibong katawagan sa mga kawan, at “nasa pangangalaga ko” upang likas na maipahayag ang konteksto nang hindi itinatago ang mas literal na pagbasa sa talababa.
