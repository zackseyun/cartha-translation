  yaml_path: translation/ot/genesis/030/008.yaml
  text: Then Rachel said[a], “With wrestlings of God I have wrestled with my sister, and I have also prevailed.” So she called his name Naphtali.
translation:
  language: tl
  text: Sinabi ni Raquel, “Sa mga pakikipagbuno ng Diyos[a], nakipagbuno ako sa aking kapatid, at nanaig din ako.” Kaya pinangalanan niya itong Neftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga pakikipagbuno ng Diyos.” Maaari rin itong mangahulugang “mga banal na pakikipagbuno” o, bilang idyoma, “matitinding pakikipagbuno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתּוּלֵי אֱלֹהִים
  choice: sa mga pakikipagbuno ng Diyos
  rationale: Pinananatili ang di-karaniwang anyong Hebreo at ang tunay na kalabuan kung tuwirang tumutukoy ito sa Diyos, nangangahulugang ‘banal,’ o nagsisilbing panidhi na ‘matitindi.’ Ipinaliliwanag ang mga posibilidad sa talababa.
- source_word: נִפְתַּלְתִּי
  choice: nakipagbuno ako
  rationale: Pinananatili ang kongkretong larawan ng pagbubuno at ang ugnayang salita sa pangalang Neftali.
- source_word: עִם אֲחֹתִי
  choice: sa aking kapatid
  rationale: Sa Filipino, natural ang ‘nakipagbuno sa aking kapatid.’ Maaari itong magpahiwatig ng pakikipaglaban o tunggalian nang hindi kailangang idagdag ang ‘laban sa.’
- source_word: גַּם יָכֹלְתִּי
  choice: at nanaig din ako
  rationale: Sa konteksto ng tunggalian, ang pandiwa ay nagpapahayag ng pagtatagumpay o pagdaig, hindi lamang ng kakayahan.
- source_word: וַתִּקְרָא שְׁמוֹ נַפְתָּלִי
  choice: Kaya pinangalanan niya itong Neftali
  rationale: Natural na makabagong Filipino para sa pormula ng pagbibigay-pangalan, habang malinaw na inuugnay ang sinabi ni Raquel sa pangalan ng bata.
- source_word: נַפְתָּלִי
  choice: Neftali
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa Filipino; kaugnay ito sa salitang Hebreo para sa pagbubuno, bagaman hindi ganap na maililipat sa Filipino ang tunog-laro.
theological_decisions:
- issue: Kung ang אֱלֹהִים ay tuwirang tumutukoy sa Diyos o nagsisilbing panidhi
  choice: mga pakikipagbuno ng Diyos
  alternative: matitinding pakikipagbuno
  rationale: Hindi tahasang nilulutas ang malabong pariralang Hebreo. Pinananatili sa pangunahing teksto ang pormal na ugnay sa Diyos at inilalahad sa talababa ang posibleng idyomatikong diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sadyang di-karaniwang pariralang “mga pakikipagbuno ng Diyos” upang huwag ikubli ang kalabuan ng Hebreo; tinutulungan ito ng maikling talababa.
