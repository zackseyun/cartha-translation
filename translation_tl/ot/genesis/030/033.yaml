  text: וְ/עָֽנְתָה בִּ֤/י צִדְקָתִ/י֙ בְּ/י֣וֹם מָחָ֔ר כִּֽי תָב֥וֹא עַל שְׂכָרִ֖/י לְ/פָנֶ֑י/ךָ כֹּ֣ל אֲשֶׁר אֵינֶ/נּוּ֩ נָקֹ֨ד וְ/טָל֜וּא בָּֽ/עִזִּ֗ים וְ/חוּם֙ בַּ/כְּשָׂבִ֔ים גָּנ֥וּב ה֖וּא אִתִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/033.yaml
  text: 'So my honesty will answer for me later[a], when you come to inspect my wages: every goat that is not speckled and spotted, and every lamb that is not dark-colored[e][d][c][b], will be considered stolen if it is found with me.'
translation:
  language: tl
  text: 'Sasagot para sa akin ang katapatan ko[a] sa susunod na araw[b], kapag dumating ka upang siyasatin ang kabayaran ko: bawat kambing na hindi batik-batik o tagpi-tagpi, at bawat tupang hindi maitim, ay ituturing na ninakaw kung matagpuan itong kasama ko.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang katuwiran ko” o “ang integridad ko ang sasagot para sa akin.” Dito, tumutukoy ang salitang Hebreo sa mapatutunayang pagiging matuwid ni Jacob sa kasunduan tungkol sa kaniyang kabayaran.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa araw ng bukas.” Maaaring mangahulugang “bukas” o, sa kontekstong ito, isang susunod na panahon kapag susuriin ni Laban ang kawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְתָה בִּי
  choice: ang katapatan ko ang magpapatotoo para sa akin
  rationale: Ang pandiwang ענה kasama ng בִּי ay naglalarawan ng katapatan ni Jacob bilang patotoong magpapatunay na matuwid ang kaniyang pakikitungo. Natural sa Filipino ang “magpapatotoo para sa akin” at napapanatili nito ang personipikasyon.
- source_word: צִדְקָתִי
  choice: ang katapatan ko
  rationale: Sa usapin ng kabayaran at pagsisiyasat, tumutukoy ito sa mapatutunayang pagiging tapat o matuwid sa pakikitungo. Mas malinaw sa karaniwang mambabasa ang “katapatan” kaysa sa mas abstraktong “katuwiran,” habang inilalahad sa talababa ang alternatibo.
- source_word: בְּיוֹם מָחָר
  choice: sa hinaharap
  rationale: Literal itong “sa araw ng bukas,” ngunit maaaring tumukoy sa isang susunod na panahon ng pagsusuri, hindi lamang sa kasunod na araw.
- source_word: כִּי תָבוֹא עַל שְׂכָרִי לְפָנֶיךָ
  choice: kapag siniyasat mo ang aking kabayaran
  rationale: Ipinahihiwatig ng parirala ang paglapit ni Laban upang suriin ang kabayaran ni Jacob sa harap niya. Ang “siniyasat” ay malinaw at natural na pagpapahayag ng praktikal na diwa.
- source_word: נָקֹד וְטָלוּא
  choice: batik-batik o tagpi-tagpi
  rationale: Pinag-iiba ng salin ang maliliit na batik at mas malalaking marka o tagpi. Sa negatibong sugnay, natural sa Filipino ang “hindi ... o ...” upang mangahulugang wala sa alinmang itinakdang uri.
- source_word: חוּם
  choice: maitim
  rationale: Ang salita ay tumutukoy sa maitim o kayumangging kulay ng tupa. Pinananatili ng “maitim” ang mas malawak na saklaw nang hindi nagtatakda ng eksaktong kulay.
- source_word: בָּעִזִּים / בַּכְּשָׂבִים
  choice: kambing / tupa
  rationale: Malinaw na itinatangi ang dalawang uri ng hayop. Ang כְּשָׂבִים ay maaaring isaling “mga batang tupa,” ngunit sa konteksto ng kawan, mas natural at hindi labis na tiyak ang “tupa.”
- source_word: גָּנוּב הוּא אִתִּי
  choice: ay maituturing na ninakaw
  rationale: 'Maikli at tahasan ang Hebreo: anumang hindi pasok sa napagkasunduang marka ngunit nasa pangangalaga ni Jacob ay bibilanging ninakaw. Ipinahahayag ng “maituturing” ang ipinahihiwatig na hatol.'
theological_decisions:
- issue: Saklaw ng צִדְקָתִי
  choice: katapatan
  alternative: katuwiran
  rationale: Hindi inaalis ang teolohikal na saklaw ng salitang “katuwiran,” ngunit sa agarang konteksto ay ang mapatutunayang integridad ni Jacob sa kasunduan sa kabayaran ang pangunahing diwa. Nasa talababa ang mas literal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kabayaran” para sa napagkasunduang bahagi ni Jacob sa kawan, “siniyasat” para sa aktuwal na pagsusuri ni Laban, at mga karaniwang katawagang “batik-batik,” “tagpi-tagpi,” at “maitim” para madaling maunawaan ang mga uri ng hayop.
