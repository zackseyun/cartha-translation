  to: 'Sasagot para sa akin ang katapatan ko[a] sa susunod na araw[b], kapag dumating ka upang siyasatin ang kabayaran ko: bawat kambing na hindi batik-batik o tagpi-tagpi, at bawat tupang hindi maitim, ay ituturing na ninakaw kung matagpuan itong kasama ko.'
  rationale: Inilipat ang pariralang tumutukoy sa pagkakatagpo ng hayop kay Jacob upang malinaw na saklaw nito ang parehong kambing at tupa. Pinalitan ang “sa hinaharap” ng mas malapit na “sa susunod na araw,” at nagdagdag ng talababa upang mapanatili ang posibilidad na tumutukoy ito sa mas huling pagsusuri. Inilagay ang talababa para sa kulay na “maitim” sa mismong salita upang maayos ang angkla ng leksikal na alternatibo.
