  naturalness: Natural at malinaw ang rebisyong Filipino. Ginamit ang “punong plane (Platanus)” upang maiwasan ang maling pagkakakilanlan ng “sikomoro” at ang kalabuan ng “platano,” na sa karaniwang Filipino ay maaaring tumukoy sa saging.
  terminology: Ang “alamo” at “almendras” ay katanggap-tanggap na mga katawagan, na may talababa para sa alternatibong pagkakakilanlan. Ang “mga patpat” ay mas tiyak sa pinutol na kahoy na tinutukoy ng מַקַּל kaysa sa karaniwang “mga sanga.”
