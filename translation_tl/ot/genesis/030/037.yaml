base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/037.yaml
  text: Then Jacob took for himself fresh rods of poplar[a], almond, and plane tree, and peeled white stripes in them[c][b], exposing the white that was on the rods.
translation:
  language: tl
  text: 'Kaya kumuha si Jacob ng mga patpat: mula sa sariwang alamo[a], sa almendras[b], at sa punong plane (Platanus)[c]. Binalatan niya ang mga iyon nang pahaba, anupat gumawa siya ng mga puting guhit at inilantad ang maputing bahagi ng mga patpat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “estoraque”; hindi tiyak ang eksaktong uri ng punong tinutukoy ng salitang Hebreo, bagaman karaniwang isinasaling “alamo.”
    reason: lexical_alternative
  - marker: b
    text: Sa ilang lumang salin, “avelano,” ngunit mas malamang na punong almendras ang tinutukoy.
    reason: lexical_alternative
  - marker: c
    text: Ang Hebrew ay malamang tumutukoy sa plane tree (Platanus), hindi sa punong sikomoro na igos. Sa ilang lumang salin, “kastanyas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקַּל
  choice: mga sanga
  rationale: Sa konteksto, tumutukoy ito sa mga pinutol na piraso ng kahoy na ginamit ni Jacob. Mas natural sa Filipino ang “mga sanga” kaysa “mga tungkod,” yamang mula sa mga punong binanggit ang mga ito.
- source_word: לִבְנֶה לַח
  choice: bagong putol na sanga ng alamo
  rationale: Ang לַח ay nagpapahiwatig ng sariwa o luntiang kahoy; malinaw na ipinahahayag ng “bagong putol” ang kalagayan nito. Karaniwang kinikilalang poplar ang לִבְנֶה, kaya ginamit ang pangkaraniwang Filipino na “alamo,” habang inilalagay sa talababa ang kawalang-katiyakan sa uri.
- source_word: לוּז
  choice: almendras
  rationale: Mas malamang na punong almond ang tinutukoy kaysa hazel. Ang “almendras” ay pamilyar at natural na katawagan sa Filipino.
- source_word: עֶרְמוֹן
  choice: sikomoro
  rationale: Tumutukoy ang salita sa plane tree, hindi sa chestnut. Pinili ang “sikomoro” bilang maikli at nagagamit na katawagang Filipino para sa punong Platanus, na nililinaw sa talababa.
- source_word: וַיְפַצֵּל
  choice: binalatan niya ... nang pahaba
  rationale: Inaalis ni Jacob ang ilang bahagi ng balat ng mga sanga. Nililinaw ng “nang pahaba” kung paano nabuo ang mga guhit nang hindi dinaragdagan ang diwa ng pangyayari.
- source_word: פְּצָלוֹת לְבָנוֹת
  choice: mga puting guhit
  rationale: Inilalarawan nito ang mapuputing markang nalikha sa pagtatanggal ng balat. Natural at malinaw sa Filipino ang “mga puting guhit.”
- source_word: מַחְשֹׂף הַלָּבָן אֲשֶׁר עַל הַמַּקְלוֹת
  choice: lumitaw ang puting kahoy ng mga sanga
  rationale: Ipinahahayag nito ang paglalantad sa maputing bahaging nasa ilalim ng balat. Ang “puting kahoy” ay mas malinaw sa karaniwang mambabasa kaysa sa literal ngunit malabong “kaputian.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “Kaya” upang likas na iugnay ang talata sa naunang salaysay. Iniwasan ang teknikal at di-pamilyar na “tungkod” para sa mga pinutol na sanga, at pinanatili sa mga talababa ang kawalang-katiyakan sa pagkakakilanlan ng mga puno.
