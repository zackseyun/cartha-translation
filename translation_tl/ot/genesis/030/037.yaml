revisions:
- from: Kaya kumuha si Jacob ng mga bagong putol na sanga ng alamo[a], almendras[b], at sikomoro[c]. Binalatan niya ang mga iyon nang pahaba upang magkaroon ng mga puting guhit at lumitaw ang puting kahoy ng mga sanga.
  to: 'Kaya kumuha si Jacob ng mga patpat: mula sa sariwang alamo[a], sa almendras[b], at sa punong plane (Platanus)[c]. Binalatan niya ang mga iyon nang pahaba, anupat gumawa siya ng mga puting guhit at inilantad ang maputing bahagi ng mga patpat.'
  rationale: Pinalitan ang “sikomoro” ng “punong plane (Platanus)” para sa wastong pagkakakilanlan ng עֶרְמוֹן at upang hindi magmungkahi ng punong igos. Inayos din ang ayos ng parirala upang ang “sariwang” ay malinaw na tumukoy lamang sa alamo, gaya ng Hebreo. Ang natitirang paglalarawan ay pinanatiling malapit sa kilos ng pagbabalat at sa resultang mapuputing guhit.
