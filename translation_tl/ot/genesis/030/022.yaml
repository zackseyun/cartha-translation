base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/022.yaml
  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
translation:
  language: tl
  text: Pagkatapos, inalala ng Diyos si Raquel[a]. Dininig siya ng Diyos[b] at binuksan ang kanyang sinapupunan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binigyang-pansin ng Diyos si Raquel” o “isinaalang-alang ng Diyos si Raquel.” Ang “inalala” ay idyomang biblikal para sa mapagpalang pagpansin ng Diyos na humahantong sa pagkilos; hindi nito ipinahihiwatig na nakalimot siya.
    reason: lexical_alternative
  - marker: b
    text: O “pinakinggan siya” o “narinig siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: inalala
  rationale: Pinananatili nito ang biblikal na idyoma ng זכר, na sa salaysay ay tumutukoy sa mapagpalang pagpansin ng Diyos na humahantong sa pagkilos, hindi sa paggunita matapos makalimot.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Isahan ang mga pandiwang kaugnay nito, kaya malinaw na tumutukoy ito sa iisang Diyos.
- source_word: אֶת רָחֵל
  choice: si Raquel
  rationale: Tuwirang layon si Raquel; ginamit ang karaniwang anyo ng pangalang ito sa Tagalog.
- source_word: וַיִּשְׁמַע אֵלֶיהָ
  choice: Dininig siya
  rationale: Ang שׁמע na may אֶל ay maaaring mangahulugang makinig nang may pagtugon. Likas at marangal sa Tagalog ang “dininig,” at hindi nito tahasang ipinapasok ang mas interpretatibong “sinagot ang kanyang panalangin.”
- source_word: וַיִּפְתַּח
  choice: binuksan
  rationale: Tuwirang pinananatili ang kongkretong pandiwang Hebreo at ang kasunod na biblikal na idyoma.
- source_word: רַחְמָהּ
  choice: ang kanyang sinapupunan
  rationale: Ang רֶחֶם ay “sinapupunan”; pinananatili ng parirala ang biblikal na paglalarawan sa pagbibigay-kakayahang magdalang-tao.
- source_word: וַ
  choice: Pagkatapos / at
  rationale: Ang unang waw-consecutive ay isinaling “Pagkatapos” upang malinaw na isulong ang salaysay; ang huling ugnayan ay “at” para sa natural na daloy.
theological_decisions:
- issue: Ang antropomorpikong pahayag na “inalala” ng Diyos si Raquel
  choice: Pinanatili ang “inalala” sa pangunahing teksto bilang biblikal na idyoma ng mapagpalang pagpansin at pagkilos ng Diyos.
  alternative: “Binigyang-pansin ng Diyos si Raquel” o “isinaalang-alang ng Diyos si Raquel.”
  rationale: Hindi ipinahihiwatig ng Hebreo na nakalimot muna ang Diyos. Gayunman, mahalagang panatilihin ang idyomang biblikal; nililinaw ng kasunod na pagdinig at pagbubukas ng sinapupunan ang praktikal na kahulugan nito.
- issue: Ang saklaw ng וַיִּשְׁמַע אֵלֶיהָ
  choice: “Dininig siya”
  alternative: “Pinakinggan siya” o “narinig siya.”
  rationale: Pinananatili ng “dininig” ang posibilidad ng pakikinig na may tugon nang hindi tahasang dinaragdagan ang teksto ng salitang “panalangin” o ng ganap na parapraseng “sinagot siya.”
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Pinanatili ang mga biblikal na idyomang “inalala” at “binuksan ang kanyang sinapupunan,” samantalang ang mga talababa ay nagbibigay ng mas malinaw na alternatibo nang hindi inaalis ang tunay na saklaw ng Hebreo.
