base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/010.yaml
  text: And Zilpah[a], Leah's female servant, bore Jacob a son.
translation:
  language: tl
  text: At nagsilang si Zilpa, ang aliping babae[a] ni Lea, ng isang anak na lalaki para kay Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “babaeng lingkod.” Ang Hebreong שִׁפְחָה ay tumutukoy sa isang babaeng lingkod o alipin na may nakabababang katayuan sa sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: At nagsilang
  rationale: Ang wayyiqtol ng ילד ay nagpapatuloy sa sunod-sunod na salaysay; natural sa modernong Tagalog ang “nagsilang” para sa panganganak.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Isinalin sa karaniwang anyong Tagalog ang pangalang Hebreo.
- source_word: שִׁפְחַת
  choice: aliping babae
  rationale: Ang שִׁפְחָה ay tumutukoy sa babaeng lingkod o alipin na mababa ang katayuan sa sambahayan; malinaw na naipapakita ng “aliping babae” ang kasarian at nakabababang kalagayan nito.
- source_word: לֵאָה
  choice: ni Lea
  rationale: Likas na ipinahahayag sa Tagalog ng “ni Lea” ang ugnayang construct sa Hebreo.
- source_word: לְיַעֲקֹב
  choice: para kay Jacob
  rationale: Ang לְ sa konstruksiyong ito ay tumutukoy sa ama o pinag-uukulan; pinananatili ng “para kay Jacob” ang tahasang preposisyunal na ugnayan nang hindi ipinapalagay na si Jacob ang tuwirang layon.
- source_word: בֵּן
  choice: isang anak na lalaki
  rationale: Ang pangngalan ay tiyak sa kasariang lalaki ngunit walang pantukoy; natural sa Tagalog ang “isang anak na lalaki.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinili ang “aliping babae” upang hindi ikubli ang nakabababang katayuang ipinahihiwatig ng terminong Hebreo; inilagay sa talababa ang mas banayad na alternatibong “babaeng lingkod.”
