  to: Noong panahon ng pag-aani ng trigo, pumunta si Ruben at nakakita ng mga mandragora[a] sa bukid. Dinala niya ang mga iyon sa kanyang inang si Lea. Sinabi naman ni Raquel kay Lea, “Bigyan mo naman ako ng ilan sa mga mandragora ng anak mo.”
