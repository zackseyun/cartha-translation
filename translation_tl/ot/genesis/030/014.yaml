base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/014.yaml
  text: In the days of the wheat harvest[a], Reuben went and found mandrakes in the field, and he brought them to Leah his mother. Then Rachel said to Leah, “Please give me some of your son’s mandrakes.”
translation:
  language: tl
  text: Noong panahon ng pag-aani ng trigo, pumunta si Ruben at nakakita ng mga mandragora[a] sa bukid. Dinala niya ang mga iyon sa kanyang inang si Lea. Sinabi naman ni Raquel kay Lea, “Bigyan mo naman ako ng ilan sa mga mandragora ng anak mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa isang halamang tradisyonal na kinikilalang mandragora, na tinatawag ding “love-apple”; hindi tiyak ang eksaktong uri ng halaman. Iniuugnay ito sa pag-ibig o pagkamayabong sa nakapaligid na salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: Nang panahon ng pag-aani ng trigo
  rationale: Likas na salin sa modernong Tagalog ng panahong tinutukoy ng pariralang konstruktong Hebreo, habang pinananatili ang tiyak na ani ng trigo.
- source_word: וַיֵּלֶךְ
  choice: lumabas
  rationale: Bagaman karaniwang nangangahulugang “pumunta,” ipinahihiwatig ng daloy na nagpunta si Ruben sa bukid; ang “lumabas” ay natural sa Tagalog nang hindi dinaragdagan ang patutunguhan.
- source_word: דּוּדָאִים
  choice: mga mandragora
  rationale: Ito ang tradisyonal na pagkakakilanlan sa halaman at isang kinikilalang katawagang Filipino; inilalagay sa talababa ang kawalang-katiyakan sa eksaktong halamang tinutukoy.
- source_word: בַּשָּׂדֶה
  choice: sa bukid
  rationale: Ang שָׂדֶה ay maaaring tumukoy sa bukid o lantad na lupain; ang “sa bukid” ang tuwiran at angkop sa tagpuang pang-agrikultura.
- source_word: וַיָּבֵא אֹתָם אֶל לֵאָה אִמּוֹ
  choice: Dinala niya ang mga iyon sa kanyang inang si Lea
  rationale: Pinananatili ang maramihang layon at malinaw na ipinapahayag ang ugnayan ni Lea kay Ruben sa natural na ayos ng Tagalog.
- source_word: תְּנִי נָא לִי
  choice: Pahingi naman ako
  rationale: Ipinahahayag nito ang pakiusap at ang nagpapalumanay na bisa ng נָא sa natural at kasalukuyang Tagalog.
- source_word: מִדּוּדָאֵי בְּנֵךְ
  choice: ng ilan sa mga mandragora ng anak mo
  rationale: Ang מִן ay partitive rito, kaya malinaw na hindi hinihingi ni Raquel ang lahat; pinananatili rin ang payak na pagmamay-ari sa “ng anak mo.”
theological_decisions:
- issue: Kaugnayan ng mga mandragora sa pagkamayabong
  choice: Hindi tahasang sinabi sa pangunahing teksto na pampabunga ang halaman
  alternative: Isalin o ipaliwanag sa teksto bilang halamang pampabunga
  rationale: Pinangalanan lamang ng Hebreo ang halaman. Bagaman may kaugnayan ito sa pag-ibig o pagkamayabong sa sinaunang tradisyon at sa nakapaligid na salaysay, hindi dapat gawing tahasang pahayag ang isang implikasyon na hindi tuwirang nasa talata.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang karaniwang anyong Filipino ng mga pangalan na Ruben, Lea, at Raquel. Ang “Pahingi naman ako” ay magalang at natural, at pinananatili ang himig ng pakiusap.
