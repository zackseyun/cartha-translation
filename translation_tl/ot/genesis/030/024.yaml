  source_fidelity: Tumpak na naihahatid ng draft ang pagpapangalan kay Jose, ang tuwirang pagbanggit kay Yahweh, at ang hiling na magdagdag pa siya ng isang anak na lalaki. Gayunman, ang “tinawag niyang Jose ang pangalan nito” ay hindi likas at ang “nito” ay hindi angkop na pantukoy sa sanggol sa ganitong salaysay. Ang “Nawa’y” ay mas tuwirang nagpapahayag ng anyong pakiusap/hiling ng Hebreo kaysa sa pagkakasunud-sunod na “Dagdagan pa sana ako ni Yahweh.”
  naturalness: Kailangan ng kaunting rebisyon para sa makabagong natural na Tagalog. Mas malinaw at marangal ang “Pinangalanan niya siyang Jose, at sinabi” kaysa sa literal ngunit mabigat na “tinawag niyang ... ang pangalan nito, na sinasabi.”
  terminology: Ang “Jose,” “Yahweh,” at “anak na lalaki” ay angkop. Inayos ang talababa upang hindi sabihing ang anyong Tagalog na “Jose” mismo ay kahawig sa tunog ng pandiwang Hebreo; ang kaugnayan ay paglalaro ng salita sa orihinal na Hebreo.
  issues:
