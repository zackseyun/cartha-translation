    issue: Hindi likas at di-tiyak ang “tinawag niyang Jose ang pangalan nito.”
    rationale: Bagaman sinusubukang panatilihin nito ang Hebreong pormula, ang “nito” ay di-likas na pantukoy sa bagong silang na tao at nagiging mabigat ang buong parirala. Ang “Pinangalanan niya siyang Jose” ay malinaw at tapat sa diwa ng pormula ng pagpapangalan.
  - severity: low
    issue: Ang “na sinasabi” ay hindi natural na pang-ugnay sa tuwirang sipi sa Tagalog.
    rationale: Ang “at sinabi” ay karaniwang salaysay na panandang Tagalog at hindi nagdaragdag ng kahulugang wala sa לֵאמֹר.
  - severity: low
    issue: Hindi eksakto ang pahayag na ang pangalang Tagalog na “Jose” ay kahawig sa tunog ng pandiwang Hebreo.
    rationale: Ang paglalaro ng salita ay nasa pangalang Hebreo na Yosef at sa pandiwang yasaf. Dapat itong ilarawan bilang kaugnayang Hebreo, hindi bilang pagkakatulad ng tunog ng anyong Tagalog.
  revised_text: At pinangalanan niya siyang Jose[a], at sinabi, “Nawa’y dagdagan pa ako ni Yahweh ng isa pang anak na lalaki.”
