lexical_decisions:
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: At tinawag niyang ... ang pangalan nito
  rationale: Pinananatili ang Hebreong pormula ng pagpapangalan, ‘tinawag ang pangalan niya,’ habang ginagamit ang natural at malinaw na ayos sa Tagalog.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginagamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog; ipinapaliwanag sa talababa ang Hebreong paglalaro sa pangalan.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Tuwirang inililipat ang pambungad sa sinabi ni Raquel nang hindi dinaragdagan kung kanino niya ito sinabi.
- source_word: יֹסֵף
  choice: Dagdagan pa sana
  rationale: Ang hiphil ng יסף ay nangangahulugang ‘magdagdag.’ Ipinahahayag ng ‘sana’ ang malamang na diwang paghiling o panalangin at pinananatili ang kaugnayan nito sa pangalang Jose.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa titik ang personal na banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: לִי
  choice: ako
  rationale: Sa natural na Tagalog, ang Hebreong ‘magdagdag sa akin’ ay malinaw na naihahayag sa ‘dagdagan ... ako.’
- source_word: בֵּן אַחֵר
  choice: isa pang anak na lalaki
  rationale: Tiyak na ‘anak na lalaki’ ang בֵּן, at ang אַחֵר ay natural na ‘isa pa’ sa kontekstong ito.
theological_decisions:
- issue: Diwa ng יֹסֵף bilang pahayag, hula, o kahilingan
  choice: Dagdagan pa sana
  alternative: Magdaragdag pa
  rationale: Sa konteksto ng pagpapangalan at sa tuwirang pagbanggit kay Yahweh, maaaring unawain ang anyo bilang isang kahilingan o panalangin. Pinananatili ng ‘sana’ ang diwang ito nang hindi ito ginagawang tiyak na hula.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa Hebreo, kaya pinananatili itong Yahweh sa halip na palitan ng titulong ‘PANGINOON.’
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang pormula ng pagpapangalan at ang paglalaro ng salita sa Hebreo sa pamamagitan ng talababa.
