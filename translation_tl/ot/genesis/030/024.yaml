  text: At pinangalanan niya siyang Jose[a], at sinabi, “Nawa’y dagdagan pa ako ni Yahweh ng isa pang anak na lalaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang pangalang Yosef ay kaugnay ng pandiwang nangangahulugang “nawa’y magdagdag siya” o “nagdaragdag siya.”
