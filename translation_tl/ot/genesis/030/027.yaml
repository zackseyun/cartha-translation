base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/027.yaml
  text: Then Laban said to him[a], “If I have found favor in your eyes, please stay[b]. I have learned by divination that Yahweh has blessed me because of you.”
translation:
  language: tl
  text: Sinabi ni Laban sa kanya, “Kung nakasumpong ako ng lingap sa iyong paningin, sana’y manatili ka.[a] Nalaman ko sa pamamagitan ng panghuhula[b] na pinagpala ako ni Yahweh dahil sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang pormulang “Kung nakasumpong ako ng lingap sa iyong paningin” ay hindi sinusundan ng tahasang kahilingang manatili; ipinahihiwatig ng konteksto ang “sana’y manatili ka.”
    reason: supplied_words
  - marker: b
    text: O “Nalaman ko sa pamamagitan ng pagbasa ng mga tanda.” Maaari ring unawain ng ilan na “Nalaman ko sa karanasan,” ngunit karaniwang tumutukoy rito ang pandiwang Hebreo sa panghuhula o pagbasa ng mga tanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Kung nalulugod ka sa akin, manatili ka sana
  rationale: Ang pariralang Hebreo ay literal na ‘kung nakasumpong ako ng lingap sa iyong mga mata.’ Isinalin ito sa likas na modernong Tagalog na ‘kung nalulugod ka sa akin.’ Ang ‘sana’ ay naghahatid ng magalang at nakikiusap na diwa ng נָא, at ang ‘manatili ka’ ay ipinahiwatig ng konteksto bagaman walang tahasang pandiwa sa sugnay na Hebreo.
- source_word: נִחַשְׁתִּי
  choice: Nalaman ko sa pamamagitan ng panghuhula
  rationale: Sa piel, karaniwang tumutukoy ang נחשׁ sa panghuhula o pagbasa ng mga tanda. Pinananatili ng salin ang mas tiyak at mas matinding leksikal na diwang ito sa halip na palabuin bilang simpleng pagkatuto mula sa karanasan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang ‘Yahweh’ sa halip na palitan ito ng isang titulo.
- source_word: וַיְבָרֲכֵנִי
  choice: pinagpala ako
  rationale: Tuwirang ipinahahayag ng anyong pandiwa na si Laban ang tumanggap ng pagpapala; likas sa Tagalog ang aspektong perpektibo sa loob ng sugnay na ito.
- source_word: בִּגְלָלֶךָ
  choice: dahil sa iyo
  rationale: Malinaw at natural nitong ipinahahayag ang sanhi o dahilan na taglay ng pariralang Hebreo.
- source_word: לָבָן
  choice: Laban
  rationale: Ginamit ang nakaugaliang anyo ng pangalang pantangi sa Tagalog na Bibliya.
theological_decisions:
- issue: Paglalarawan sa ginawa ni Laban sa נִחַשְׁתִּי
  choice: panghuhula
  alternative: natutuhan ko sa karanasan
  rationale: Mas karaniwang ipinahihiwatig ng pandiwang Hebreo sa anyong ito ang panghuhula o pagbasa ng tanda. Hindi pinapahina ng salin ang diwang iyon at hindi rin nito ipinahihiwatig na sinasang-ayunan ng teksto ang gawain ni Laban.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo, kaya pinanatili ito bilang ‘Yahweh’ sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Ang ‘nalulugod ka sa akin’ ay natural na katumbas ng idyomang Hebreo na literal na ‘nakasumpong ako ng lingap sa iyong mga mata.’ Pinanatili ang ‘panghuhula’ upang hindi ikubli ang tunay na leksikal na tensiyon ng pahayag.
