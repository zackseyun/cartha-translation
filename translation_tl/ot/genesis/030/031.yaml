  text: And he said[a], “What shall I give you?” And Jacob said, “You shall not give me anything. If you will do this thing for me, I will again pasture your flock and keep it.”
translation:
  language: tl
  text: Sinabi niya, “Ano ang ibibigay ko sa iyo?” Sumagot si Jacob, “Huwag mo akong bigyan ng anuman. Kung gagawin mo para sa akin ang bagay na ito, muli[a] akong magpapastol ng iyong kawan at magbabantay rito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Babalik ako upang magpastol ng iyong kawan at magbantay rito.” Maaaring tumukoy ang pandiwang Hebreo sa pagbabalik o sa muling pagpapatuloy ng gawain.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶתֶּן לָךְ
  choice: Ano ang ibibigay ko sa iyo?
  rationale: Tuwirang tanong ito tungkol sa kabayarang maibibigay ni Laban kay Jacob; natural at malinaw ang anyong ito sa makabagong Tagalog.
- source_word: לֹא תִתֶּן לִי מְאוּמָה
  choice: Huwag mo akong bigyan ng anuman
  rationale: Ang לֹא kasama ng imperfect ay nagpapahayag dito ng mariing pagtanggi sa alok, hindi lamang ng hula tungkol sa hinaharap. Ang “anuman” ay likas na katumbas ng מְאוּמָה sa negatibong pahayag.
- source_word: אִם תַּעֲשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: Kung gagawin mo para sa akin ang bagay na ito
  rationale: Pinananatili ang kondisyunal na ayos at ang demonstratibong “ang bagay na ito,” na tumutukoy sa kasunduang ilalahad ni Jacob.
- source_word: אָשׁוּבָה
  choice: muli kong
  rationale: Sa konteksto, maaaring ipahiwatig ng שׁוב ang pagpapatuloy o muling pagsisimula ng gawain, ngunit maaari rin itong unawaing pagbabalik. Isinasalin sa pangunahing teksto bilang “muli kong” at inilalahad sa talababa ang tunay na alternatibo.
- source_word: אֶרְעֶה צֹאנְךָ
  choice: papastulan ... ang iyong kawan
  rationale: Ang רעה ay tumutukoy sa pagpapastol o pag-aalaga ng mga hayop, at ang צֹאן ay kolektibong katawagan sa kawan ng maliliit na hayop, karaniwang mga tupa at kambing.
- source_word: אֶשְׁמֹר
  choice: babantayan
  rationale: Ipinahihiwatig ng שׁמר ang maingat at mapangalagang pagbabantay sa kawan; natural itong kaagapay ng “papastulan” sa Tagalog.
