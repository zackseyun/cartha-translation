base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/016.yaml
  text: When Jacob came in from the field in the evening[a], Leah went out to meet him and said, “You must come in to me, for I have hired you with my son’s mandrakes.” So he lay with her that night.
translation:
  language: tl
  text: Nang dumating si Jacob mula sa bukid kinagabihan, lumabas si Lea upang salubungin siya at sinabi, “Dapat kang pumarito sa akin, sapagkat inupahan kita kapalit ng mga mandragora ng anak ko.” Kaya nakisiping siya sa kanya nang gabing iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “inupahan kita sa pamamagitan ng mga mandragora ng anak ko.” Iniuugnay ng Hebrew ang pag-upa sa mga mandragora bilang kapalit o paraan ng kasunduan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא יַעֲקֹב מִן הַשָּׂדֶה בָּעֶרֶב
  choice: Nang gabing iyon, nang umuwi si Jacob mula sa bukid
  rationale: Ang בוא מן השדה ay likas na tumutukoy sa pag-uwi mula sa bukid sa konteksto. Inililipat nang bahagya ang temporal na parirala upang maging malinaw at natural sa Tagalog nang hindi binabago ang pangyayari.
- source_word: וַתֵּצֵא לֵאָה לִקְרָאתוֹ
  choice: sinalubong siya ni Lea
  rationale: Ang ‘sinalubong’ ay maikli at likas na katumbas ng paglabas upang salubungin ang isang dumarating.
- source_word: אֵלַי תָּבוֹא
  choice: Sa akin ka makikisiping
  rationale: Sa konteksto, ito ay tuwirang pag-angkin ni Lea sa pakikipagtalik kay Jacob. Ang ‘makikisiping’ ay malinaw ngunit marangal at hindi mahalay.
- source_word: שָׂכֹר שְׂכַרְתִּיךָ
  choice: inupahan talaga kita
  rationale: Pinananatili ng ‘inupahan’ ang transaksiyonal na larawan, samantalang ang ‘talaga’ ay nagpapahiwatig ng diin ng infinitive absolute kasama ng finite verb nang hindi labis na pinatitindi.
- source_word: בְּדוּדָאֵי בְּנִי
  choice: kapalit ng mga mandragora ng aking anak
  rationale: Dito ang בְּ ay nagpapahiwatig ng halaga o kapalit sa kasunduan. Mas malinaw sa modernong Tagalog ang ‘kapalit ng’ kaysa literal na ‘sa pamamagitan ng.’
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: nakisiping siya kay Lea
  rationale: Ang ‘nakisiping’ ay isang likas at marangal na eupemismo sa Tagalog para sa pakikipagtalik at tumutugma sa Hebreong idyoma.
- source_word: בַּלַּיְלָה הוּא
  choice: nang gabing iyon
  rationale: Likas na Tagalog na katumbas ng idiomatikong temporal na parirala.
