revisions:
- from: Nang gabing iyon, nang umuwi si Jacob mula sa bukid, sinalubong siya ni Lea at sinabi, “Sa akin ka makikisiping, sapagkat inupahan talaga kita kapalit ng mga mandragora ng aking anak.” Kaya nakisiping siya kay Lea nang gabing iyon.
  to: Nang dumating si Jacob mula sa bukid kinagabihan, lumabas si Lea upang salubungin siya at sinabi, “Dapat kang pumarito sa akin, sapagkat inupahan kita kapalit ng mga mandragora ng anak ko.” Kaya nakisiping siya sa kanya nang gabing iyon.[a]
  rationale: Inayos ang pagkakasunod ng mga pangyayari at pinanatili ang dalawang magkaibang pahiwatig ng oras sa kanilang wastong lugar. Idinagdag ang “lumabas” upang katawanin ang pandiwang Hebrew. Ang paanyaya ni Lea ay isinaling tuwiran ngunit hindi mas tahasan kaysa sa eupemistikong anyo ng pinagmulan. Nagdagdag ng talababa upang ipakita ang saklaw na kahulugan ng preposisyon sa pariralang tungkol sa mga mandragora.
