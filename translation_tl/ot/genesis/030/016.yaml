translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘makikisiping/nakisiping’ upang mapanatili ang malinaw ngunit eupemistikong tono ng Hebreo; pinanatili rin ang transaksiyonal na talinghaga sa ‘inupahan.’
