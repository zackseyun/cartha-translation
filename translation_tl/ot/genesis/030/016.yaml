  source_fidelity: 'Kailangang iwasto ang ayos ng panahon: ang Hebrew ay nagsasabing dumating si Jacob mula sa bukid kinagabihan, at saka pa lamang sinabing nakisiping siya kay Lea nang gabing iyon. Ang pambungad na “Nang gabing iyon” ay napaaga at inuulit ang panahong nasa hulihan. Mas tumpak ding ilahad na lumabas si Lea upang salubungin siya.'
  naturalness: Likas at marangal ang “nakisiping,” ngunit mas malinaw at mas malapit sa kilos sa pinagmulan ang “lumabas si Lea upang salubungin siya.” Ang “Dapat kang pumarito sa akin” ay natural na tuwirang pananalita at pinananatili ang eupemistikong bukas na anyo ng Hebrew.
  terminology: Ang “mandragora” ay katanggap-tanggap na tawag para sa dudaim. Ang “inupahan kita” ay pinananatili ang sadyang transaksiyonal na larawan. Ang “kapalit ng” ay isang makatwirang pagbasa sa preposisyong Hebrew, ngunit may sapat na kawalang-singaw upang bigyan ng talababa.
