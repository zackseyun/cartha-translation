  yaml_path: translation/ot/genesis/030/004.yaml
  text: So she gave him Bilhah her servant as a wife[a], and Jacob went in to her.
translation:
  language: tl
  text: At ibinigay niya kay Jacob si Bilha, ang kanyang aliping babae, bilang asawa[a]; at sinipingan siya ni Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “babaeng lingkod.” Ang salitang Hebreo ay tumutukoy sa isang babaeng lingkod o alipin na may nakabababang katayuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Kaya ibinigay niya
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa Tagalog ang “Kaya” bilang ugnay sa naunang sinabi ni Raquel at pinananatili nito ang bunga at pagkakasunod ng pangyayari.
- source_word: לּוֹ
  choice: kay Jacob
  rationale: Ginamit ang pangalan sa halip na “sa kanya” upang maging malinaw ang tinutukoy sa natural na Tagalog.
- source_word: בִּלְהָה
  choice: Bilha
  rationale: Isinalin ang personal na pangalan ayon sa karaniwang anyong Filipino.
- source_word: שִׁפְחָתָהּ
  choice: ang kanyang aliping babae[a]
  rationale: Ang שִׁפְחָה ay babaeng lingkod o alipin na may nakabababang katayuan. Malinaw sa modernong Tagalog ang “aliping babae” at hindi nito ikinukubli ang hindi pantay na katayuang panlipunan.
- source_word: לְאִשָּׁה
  choice: bilang asawa
  rationale: Ipinahahayag nito ang legal at relasyonal na layunin ng pagkakaloob kay Bilha nang hindi nagdaragdag ng paliwanag na wala sa talata.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: sinipingan ito
  rationale: Ang parirala ay karaniwang Hebreong eupemismo para sa pakikipagtalik. Ang “sinipingan” ay isang mahinahon ngunit nauunawaang eupemismo sa Tagalog at iniiwasan ang mas tahasang pagpapaliwanag.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Filipino.
theological_decisions:
- issue: Katayuan ni Bilha bilang “asawa” sa konteksto ng pagiging aliping babae
  choice: bilang asawa
  alternative: upang maging asawa niya
  rationale: Pinananatili ang tahasang אִשָּׁה (“asawa/babae”) at ang tensiyon sa pagitan ng kanyang relasyong pang-asawa at nakabababang katayuan, nang hindi ito awtomatikong tinutukoy bilang isang partikular na teknikal na uri ng pagsasama.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sinipingan” upang mapanatili ang mahinahong eupemismo ng Hebreo, at inulit ang pangalang Jacob upang maiwasan ang kalituhan ng mga panghalip.
