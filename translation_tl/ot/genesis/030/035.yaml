base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/035.yaml
  text: That day he removed the male goats that were streaked and spotted[a], and all the female goats that were speckled and spotted—every one that had white on it—and every dark-colored one among the lambs[c][b], and he put them into the care of his sons.
translation:
  language: tl
  text: Noong araw ding iyon, inihiwalay niya ang mga lalaking kambing na may guhit[a] at batik-batik, at ang lahat ng babaeng kambing na may maliliit na tuldok at batik-batik—bawat isa na may puti sa katawan—at lahat ng maitim na batang tupa[b]. Ipinagkatiwala niya ang mga iyon sa kanyang mga anak.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “may mga bandang marka”; tumutukoy ang Hebrew sa mga markang tila guhit o banda sa katawan ng hayop.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga kayumangging batang tupa.” Maaaring tumukoy ang salitang Hebrew sa kulay na kayumanggi o maitim.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “ibinigay niya sa kamay ng kanyang mga anak,” isang idyomang Hebrew na nangangahulugang inilagay niya sa kanilang pangangalaga o pamamahala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: inihiwalay niya
  rationale: Sa Hiphil, ipinahihiwatig ng pandiwa ang pagpapalayo o pagbubukod sa mga hayop mula sa kawan; natural sa Tagalog ang “inihiwalay.”
- source_word: בַּיּוֹם הַהוּא
  choice: Nang araw ding iyon
  rationale: Pinananatili nito ang agarang panahong tinutukoy at ang idiomatikong diin ng Hebrew.
- source_word: הַתְּיָשִׁים
  choice: mga lalaking kambing
  rationale: Tiyak na tumutukoy ang תיש sa lalaking kambing; malinaw at makabago ang salin.
- source_word: הָעֲקֻדִּים
  choice: may guhit
  rationale: Tumutukoy ang salita sa mga markang tila banda o guhit sa katawan ng hayop nang hindi labis na tinutukoy ang eksaktong hugis.
- source_word: הַטְּלֻאִים / הַטְּלֻאֹת
  choice: may batik / may malalaking batik
  rationale: Tumutukoy ang טלא sa batik-batik o tipak-tipak na kulay. Sa ikalawang paglitaw, ginamit ang “malalaking batik” upang maipakitang naiiba ito sa נקד, na mas maliliit na tuldok ang ipinahihiwatig.
- source_word: הָעִזִּים
  choice: mga babaeng kambing
  rationale: Bagaman karaniwang “mga kambing,” malinaw sa kaibahan nito sa naunang תישים na mga babaeng kambing ang tinutukoy.
- source_word: הַנְּקֻדּוֹת
  choice: may maliliit na batik
  rationale: Ang נקד ay tumutukoy sa maliliit na tuldok o batik; pinananatili ng salin ang kaibahan nito sa טלאות.
- source_word: כֹּל אֲשֶׁר לָבָן בּוֹ
  choice: bawat isa na may puti sa katawan
  rationale: Pinananatili ang distributibong puwersa ng כֹּל at malinaw na ang puti ay bahagi ng kulay o marka ng bawat hayop.
- source_word: וְכָל חוּם בַּכְּשָׂבִים
  choice: pati ang bawat maitim na tupa
  rationale: Maaaring tumukoy ang חוּם sa kayumanggi o pangkalahatang maitim na kulay. Ang “tupa” ay natural at hindi labis na nagtatakda ng edad na maaaring ipahiwatig ng כְּשָׂבִים.
- source_word: וַיִּתֵּן בְּיַד בָּנָיו
  choice: Ipinagkatiwala niya ang mga iyon sa kanyang mga anak
  rationale: Natural na inilalahad nito ang idyomang Hebrew na “ibinigay sa kamay,” ibig sabihi’y inilagay sa pangangalaga o pamamahala.
