    issue: Ang “malalaking batik” ay labis na pagtutukoy sa טְלֻאֹת.
    rationale: Ang salitang Hebrew ay nagpapahiwatig ng batik-batik/tagpi-tagping marka, hindi naman kinakailangang malalaki ang mga batik.
  - severity: low
    issue: Ang “tupa” ay mas malawak kaysa כְּשָׂבִים.
    rationale: Mas malapit sa anyong Hebrew at sa English audit trail ang “mga batang tupa” o “mga kordero.”
  - severity: low
    issue: Ang pambungad na “Nang araw ding iyon” ay hindi gaanong likas sa kasalukuyang Filipino.
    rationale: Ang “Noong araw ding iyon” ay mas karaniwang malayang sugnay na panandang panahon.
