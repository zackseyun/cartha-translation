  yaml_path: translation/ot/genesis/030/039.yaml
  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
translation:
  language: tl
  text: Kaya nagtalik ang mga hayop sa kawan sa harap ng mga patpat, at nagsilang ang mga ito ng mga anak na may guhit[a], maliliit na batik[b], at tagpi-tagping batik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “may mga bigkis”; ang tradisyonal na salin ay kadalasang “guhit na paikot.”
    reason: lexical_alternative
  - marker: b
    text: Tinatayang pagkakaiba lamang ang “maliliit na batik” (נְקֻדִּים) at “tagpi-tagping batik” (טְלֻאִים). Ang huli ay maaari ring isaling “may mga bahid” o “batik-batik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱמוּ
  choice: nagtalik
  rationale: Ang pandiwa ay literal na tumutukoy sa pag-iinit ng hayop, ngunit sa konteksto ng pagpaparami ay nagpapahiwatig ito ng pakikipagtalik. Malinaw at natural ang “nagtalik” nang hindi ipinapalagay kung kailan naglihi.
- source_word: הַצֹּאן
  choice: ang mga hayop
  rationale: Ang צאן ay kolektibong tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Sa kontekstong malinaw na ang kawan ang tinutukoy, likas sa Filipino ang “mga hayop” at naiiwasan nitong limitahan ang salita sa tupa lamang.
- source_word: אֶל הַמַּקְלוֹת
  choice: sa harap ng mga patpat
  rationale: Bagaman maaaring mangahulugang “patungo sa” ang אֶל, ipinakikita ng nakapaligid na salaysay na nakapuwesto ang mga hayop sa harap ng mga patpat habang nagpaparami.
- source_word: וַתֵּלַדְןָ
  choice: nagsilang ... ng mga anak
  rationale: Tuwirang ipinahahayag ng ילד ang panganganak. Idinagdag ang “mga anak” bilang likas na layon sa Filipino sapagkat mga pang-uri lamang ang kasunod sa Hebreo.
- source_word: עֲקֻדִּים
  choice: may guhit
  rationale: Tumutukoy ang salita sa mga markang tila guhit o bigkis. Ang “may guhit” ay malinaw at karaniwang Filipino.
- source_word: נְקֻדִּים
  choice: may maliliit na batik
  rationale: Nagpapahiwatig ito ng maliliit na tuldok o batik. Ang “maliliit na batik” ay tumutulong na maiba ito sa kasunod na uri ng marka.
- source_word: וּטְלֻאִים
  choice: may malalaking batik
  rationale: Tumutukoy ito sa mga markang tagpi-tagpi o malalapad na batik. Ang salin ay natural, bagaman tinatayang paglalarawan lamang ang laki at pagkakaiba ng dalawang uri ng batik.
