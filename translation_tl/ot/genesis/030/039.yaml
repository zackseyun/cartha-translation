translation_notes:
  register: Makabago at dignidad na Filipino, na gumagamit ng karaniwang bokabularyo. Pinanatili ang pag-uulit ng paksa sa diwa ngunit gumamit ng panghalip sa ikalawang sugnay upang maging likas sa Tagalog. Nasa mismong teksto ang lahat ng panandang talababa.
