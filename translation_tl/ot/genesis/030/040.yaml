  text: וְ/הַ/כְּשָׂבִים֮ הִפְרִ֣יד יַעֲקֹב֒ וַ֠/יִּתֵּן פְּנֵ֨י הַ/צֹּ֧אן אֶל עָקֹ֛ד וְ/כָל ח֖וּם בְּ/צֹ֣אן לָבָ֑ן וַ/יָּֽשֶׁת ל֤/וֹ עֲדָרִים֙ לְ/בַדּ֔/וֹ וְ/לֹ֥א שָׁתָ֖/ם עַל צֹ֥אן לָבָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/040.yaml
  text: And Jacob separated the lambs[a], and he set the faces of the flock toward the striped and all the dark-colored among Laban's flock. Then he set apart flocks for himself[c][b], and did not put them with Laban’s flock.
translation:
  language: tl
  text: Inihiwalay ni Jacob ang mga batang tupa, at iniharap niya ang kawan sa mga hayop na may guhit at sa lahat ng madidilim ang kulay sa kawan ni Laban.[a] Nagbukod siya ng mga kawan para sa sarili niya, at hindi niya isinama ang mga iyon sa kawan ni Laban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa kawan ni Laban.” Maaari ring isalin ang “madidilim ang kulay” bilang “kayumanggi.”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: הַכְּשָׂבִים
  choice: mga batang tupa
  rationale: Mas tiyak ito kaysa sa pangkalahatang “mga tupa” at angkop sa kahulugan ng כֶּשֶׂב bilang batang tupa sa konteksto ng pagpaparami ng kawan.
- source_word: הִפְרִיד
  choice: inihiwalay
  rationale: 'Tuwirang ipinapahayag ang Hiphil ng פרד: pinaghiwalay o ibinukod ni Jacob ang mga hayop.'
- source_word: פְּנֵי הַצֹּאן אֶל
  choice: iniharap niya ang kawan sa
  rationale: Likas na Tagalog para sa kongkretong Hebreong larawan na itinakda ang mukha o harapan ng kawan tungo sa mga tinutukoy na hayop.
- source_word: עָקֹד
  choice: mga hayop na may guhit
  rationale: Ang salita ay tumutukoy sa mga hayop na may mga banda o guhit; malinaw at natural ang “may guhit” sa modernong Tagalog.
- source_word: כָל חוּם
  choice: lahat ng maiitim na hayop
  rationale: Ang חוּם ay kulay na maitim o kayumanggi. Hindi labis na nililimitahan ng “maiitim” ang eksaktong kulay, habang nananatiling malinaw ang kaibahan ng kulay.
- source_word: וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ
  choice: bumuo siya ng sarili niyang mga kawan na nakabukod
  rationale: Ipinahahayag ang paglalagay o pagbuo ng mga pangkat para kay Jacob at ang diin ng לְבַדּוֹ na hiwalay ang mga ito.
- source_word: וְלֹא שָׁתָם עַל צֹאן לָבָן
  choice: hindi niya isinama ang mga iyon sa kawan ni Laban
  rationale: Natural na ipinapahayag sa Tagalog ang diwa na hindi inilagay ni Jacob ang sarili niyang mga kawan kasama ng kawan ni Laban.
theological_decisions:
- issue: Ugnayan ng mga hayop na may maitim na kulay sa kawan ni Laban
  choice: sa kawan ni Laban
  alternative: mula sa kawan ni Laban
  rationale: Ang karaniwang locative na diwa ng בְּ ay “sa” o “kabilang sa.” Gayunman, maaaring unawain ang parirala bilang pinagmulan; pinanatili sa talababa ang alternatibo sa halip na lutasin ang tensiyon sa salaysay sa pamamagitan ng tahimik na pag-aangkop.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kawan” para sa kolektibong pangkat ng mga tupa at kambing, at iniwasan ang sobrang literal na “mga mukha ng kawan” dahil hindi ito likas sa Tagalog; pinanatili naman ang larawan sa pandiwang “iniharap.”
