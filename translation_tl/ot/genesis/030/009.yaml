base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/009.yaml
  text: When Leah saw that she had stopped bearing children[b][a], she took Zilpah her female servant and gave her to Jacob as a wife.
translation:
  language: tl
  text: Nang makita ni Lea na tumigil na siya sa panganganak,[a] kinuha niya si Zilpa na kanyang alilang babae[b] at ibinigay siya kay Jacob bilang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi na siya nanganganak”; literal sa Hebreo, “tumayo mula sa panganganak.”
    reason: lexical_alternative
  - marker: b
    text: O “babaeng lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Nang makita
  rationale: Isinasalaysay ng waw-consecutive ang kasunod na pangyayari, at likas sa Tagalog ang “Nang makita” upang iugnay ang pagkaunawa ni Lea sa ginawa niya.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng napansin ni Lea, hindi ang sanhi.
- source_word: עָמְדָה מִלֶּדֶת
  choice: tumigil na siya sa panganganak
  rationale: Ang idyomang עמד + מן + pawatas ay nangangahulugang tumigil sa isang gawain; malinaw at likas sa Tagalog ang “tumigil ... sa panganganak.”
- source_word: שִׁפְחָתָהּ
  choice: kanyang alilang babae
  rationale: Pinananatili nito ang kasarian at mababang katayuan ni Zilpa sa sambahayan; ang talababa ay nagbibigay ng mas banayad na alternatibong leksikal.
- source_word: לְאִשָּׁה
  choice: bilang asawa
  rationale: Pinananatili nito ang tahasang pananalitang pangmag-asawa ng Hebreo at hindi ipinapalit ang teknikal na katawagang “kalunya.”
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalan.
- source_word: לְיַעֲקֹב
  choice: kay Jacob
  rationale: Likas na Tagalog na pagpapahayag ng di-tuwirang layon sa konstruksyong ito.
theological_decisions:
- issue: Katayuan ni Zilpa sa sambahayan at ang pananalitang pangmag-asawa
  choice: “alilang babae” at “bilang asawa”
  alternative: “babaeng lingkod” at/o “bilang kalunya”
  rationale: Tahasan siyang tinatawag ng Hebreo na שִׁפְחָה ni Lea at sinasabing ibinigay siya kay Jacob לְאִשָּׁה. Pinananatili ng salin ang parehong mababang katayuan niya sa sambahayan at ang pormal na pananalitang pangmag-asawa, nang hindi nagdaragdag ng kategoryang “kalunya” na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bigat ng katayuang panlipunan ni Zilpa at ang tahasang wika ng pag-aasawa sa Hebreo. Inayos ang mga pananda ng talababa upang lumitaw sa lohikal na pagkakasunod na [a], [b].
