  text: And Leah said[a], “Good fortune!” So she called his name Gad.
translation:
  language: tl
  text: At sinabi ni Lea, “Mabuting kapalaran!”[a] At pinangalanan niya siyang Gad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang Hebreong בגד. Maaaring unawain ito bilang bulalas na “Mabuting kapalaran!”; ayon sa isang tradisyonal na pagbasa, “Isang hukbo!” Ang pangalang Gad ay kaugnay ng tunog ng salitang Hebreo sa larong ito ng salita.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi dinaragdagan ang ugnayang lohikal.
- source_word: לֵאָה
  choice: Lea
  rationale: Karaniwang anyo ng pangalang ito sa makabagong saling Tagalog.
- source_word: בגד
  choice: Mapalad!
  rationale: Likas itong bulalas sa Tagalog na nagpapahayag ng mabuting kapalaran at nag-uugnay sa laro ng salita sa pangalang Gad, habang kinikilala sa talababa ang kahirapan ng Hebreo.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  choice: Kaya pinangalanan niya itong
  rationale: Natural na paglilipat sa Tagalog ng Hebreong pormula sa pagbibigay ng pangalan; ipinakikita ng “Kaya” ang daloy mula sa bulalas tungo sa pagpapangalan.
- source_word: גָּד
  choice: Gad
  rationale: Transliterasyon ng pangalang Hebreo na nagpapanatili rin sa tunog na kaugnay ng laro ng salita.
