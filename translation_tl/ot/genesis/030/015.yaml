base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/015.yaml
  text: But she said to her, “Was it a small thing that you took my husband, and would you also take my son’s mandrakes?” Rachel said, “Then he may lie with you tonight in exchange for your son’s mandrakes.”
translation:
  language: tl
  text: Ngunit sinabi ni Lea sa kanya, “Maliit na bagay ba na kinuha mo ang asawa ko, at kukunin mo pa pati ang mga mandragora ng anak ko?” Sinabi ni Raquel, “Kung gayon, sisiping siya sa iyo ngayong gabi kapalit ng mga mandragora ng anak mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְעַט
  choice: Maliit na bagay ba
  rationale: Pinananatili ang retorikal na tanong at ang diwa ng pagmamaliit sa bigat ng ginawa.
- source_word: קַחְתֵּךְ
  choice: kinuha mo
  rationale: Tuwirang katumbas ng pandiwang ‘kumuha’; hindi dinaragdagan ng paliwanag tungkol sa pananagutan o aktuwal na kalagayan ni Jacob.
- source_word: דּוּדָאֵי
  choice: mga mandragora
  rationale: Tumutukoy sa halamang mandrake; ginamit ang kinikilalang salin sa Filipino at pinanatili ang historikal na bagay sa salaysay.
- source_word: יִשְׁכַּב עִמָּךְ
  choice: sisiping siya sa iyo
  rationale: Likas at marangal na Filipino para sa pakikipagtalik sa kontekstong mag-asawa, habang malinaw na hindi lamang literal na paghiga ang tinutukoy.
- source_word: תַּחַת
  choice: kapalit ng
  rationale: Ipinahahayag ang palitang napagkasunduan sa talata.
theological_decisions:
- issue: Paglalarawan kay Jacob bilang ‘asawa ko’
  choice: ang asawa ko
  alternative: ang aking lalaki
  rationale: Sa konteksto ng pag-aasawa nina Lea at Jacob, ito ang natural at tumpak na Filipino nang hindi nilulutas ang tensiyon ng maramihang pag-aasawa sa salaysay.
- issue: Antas ng pagsang-ayon sa magiging pagsiping ni Jacob
  choice: sisiping siya sa iyo
  alternative: maaari siyang sumiping sa iyo
  rationale: Ang Hebreong imperfect ay nasa konteksto ng tiyak na kasunduan; ang payak na panghinaharap ay pinananatili ang lakas ng pahayag nang hindi nagdaragdag ng modal na ‘maaari.’
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Tahasang pinangalanan si Lea sa unang sugnay upang maging malinaw ang nagsasalita sa hiwalay na talata; pinanatili ang matalas na retorikal na tanong at ang transaksiyonal na himig ng usapan.
