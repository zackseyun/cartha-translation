  verdict: revise
  source_fidelity: Tumpak ang pagkilala sa mga nagsasalita, sa retorikal na panunumbat ni Lea, sa mga mandragora ng kaniyang anak, at sa kasunduang si Jacob ay sisiping kay Lea nang gabing iyon kapalit ng mga ito. Ang “sisiping siya sa iyo” ay angkop na marangal na pagpapahayag ng יִשְׁכַּב עִמָּךְ sa kontekstong ito.
  naturalness: May bahagyang hindi likas at paulit-ulit na kumbinasyon sa “kukunin mo rin pati.” Mas matatas ang “kukunin mo pa pati,” na pinananatili ang diwa ng pagdaragdag na nasa גם.
  terminology: Ang “mandragora,” “asawa ko,” at “sisiping” ay angkop sa modernong Filipino na may marangal na rehistro. Wala itong ipinapasok na interpretasyong doktrinal.
