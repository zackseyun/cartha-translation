  to: Ngunit sinabi ni Lea sa kanya, “Maliit na bagay ba na kinuha mo ang asawa ko, at kukunin mo pa pati ang mga mandragora ng anak ko?” Sinabi ni Raquel, “Kung gayon, sisiping siya sa iyo ngayong gabi kapalit ng mga mandragora ng anak mo.”
