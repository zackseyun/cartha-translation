id: GEN.30.2
reference: Genesis 30:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יַעֲקֹ֖ב בְּ/רָחֵ֑ל וַ/יֹּ֗אמֶר הֲ/תַ֤חַת אֱלֹהִים֙ אָנֹ֔כִי אֲשֶׁר מָנַ֥ע מִמֵּ֖/ךְ פְּרִי בָֽטֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/002.yaml
  text: Then Jacob became angry with Rachel and said[a], “Am I in the place of God[b], who has withheld the fruit of the womb from you?”
translation:
  language: tl
  text: Nagalit si Jacob kay Raquel at sinabi[a], “Ako ba ang nasa lugar ng Diyos, na siyang nagkait sa iyo ng bunga ng sinapupunan[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na anyo: “nag-alab ang galit ni Jacob kay Raquel.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “bunga ng sinapupunan” ay isang Hebreong idyoma para sa mga anak o supling.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: Nagalit
  rationale: Ang Hebreong idyoma ay literal na naglalarawan ng paglalagablab ng galit. Ang “nagalit” ay natural at malinaw sa makabagong Tagalog, samantalang inilalahad sa talababa ang mas pormal na anyo.
- source_word: בְּרָחֵל
  choice: kay Raquel
  rationale: Tinutukoy ng pang-ukol ang taong pinag-ukulan ng galit; “kay Raquel” ang likas na anyo sa Tagalog.
- source_word: הֲתַחַת אֱלֹהִים אָנֹכִי
  choice: Ako ba ang nasa lugar ng Diyos
  rationale: Ang תַּחַת ay nagpapahayag dito ng paghalili o pagtayo sa katayuan ng iba, hindi lamang ng lokasyong “nasa ilalim.” Pinananatili ng salin ang retorikal na tanong at ang pagtanggi ni Jacob na taglay niya ang kapangyarihan ng Diyos.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang konteksto at ang kasunod na pandiwang isahan ay tumutukoy sa iisang Diyos.
- source_word: אֲשֶׁר מָנַע
  choice: na siyang nagkait
  rationale: Malinaw na iniuugnay ng sugnay sa Diyos ang pagkakait ng kakayahang magkaanak. Ang “siyang” ay tumutulong upang maging malinaw sa Tagalog ang tinutukoy ng panghalip na pamanggit.
- source_word: מִמֵּךְ
  choice: sa iyo
  rationale: Sa Tagalog, ang “nagkait sa iyo” ay natural na nagpapahayag ng pagkakait o hindi pagbibigay sa isang tao.
- source_word: פְּרִי בָטֶן
  choice: bunga ng sinapupunan
  rationale: Pinananatili nito ang konkretong Hebreong talinghaga para sa anak o supling habang nananatiling nauunawaan sa marangal na makabagong Tagalog.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa kawalan ng anak ni Raquel
  choice: Iniuugnay ng sinabi ni Jacob sa Diyos ang pagkakait ng bunga ng sinapupunan.
  alternative: Ituring ang sinabi bilang retorika lamang na hindi nagpapatibay ng pagkilos ng Diyos.
  rationale: Tuwirang inilalarawan ng אֲשֶׁר מָנַע ang Diyos bilang siyang nagkait. Pinananatili ng salin ang pahayag na ito nang hindi ito pinapalambot o dinaragdagan ng paliwanag na doktrinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Raquel,” ang karaniwang anyong Filipino ng pangalan. Pinanatili ang talinghagang “bunga ng sinapupunan” at ang matinding retorikal na tanong ni Jacob.
