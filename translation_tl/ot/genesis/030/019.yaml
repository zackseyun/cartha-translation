  text: Leah conceived again and bore Jacob a sixth son.
translation:
  language: tl
  text: Muling nagdalang-tao si Lea at nagsilang siya kay Jacob ng ikaanim na anak na lalaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: nagdalang-tao
  rationale: Ang qal na pandiwang הרה ay nangangahulugang maglihi o magdalang-tao. Likas at malinaw sa makabagong Filipino ang “nagdalang-tao” sa salaysay ng kapanganakan.
- source_word: עוֹד
  choice: muling
  rationale: 'Dito, ipinahihiwatig ng עוֹד ang pag-uulit: nagdalang-tao si Lea nang isa pang pagkakataon.'
- source_word: וַתֵּלֶד
  choice: nagsilang
  rationale: Ang ילד sa anyong ito ay tumutukoy sa panganganak. Ang “nagsilang” ay maikli, marangal, at angkop sa salaysay.
- source_word: בֵּן
  choice: anak na lalaki
  rationale: Tuwirang tumutukoy ang בֵּן sa isang anak na lalaki; mas malinaw ito kaysa sa “anak” lamang sa Filipino.
- source_word: שִׁשִּׁי
  choice: ikaanim
  rationale: Ang ordinal ay naglalarawan sa anak na lalaki bilang ikaanim sa pagkakasunod na tinutukoy ng salaysay.
- source_word: לְיַעֲקֹב
  choice: para kay Jacob
  rationale: Pinananatili ng “para kay Jacob” ang relasyonal na diwa ng prefiks na לְ sa idyomang Hebreo tungkol sa pagsilang ng anak para sa isang ama.
