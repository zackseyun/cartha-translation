id: GEN.13.4
reference: Genesis 13:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֶל מְקוֹם֙ הַ/מִּזְבֵּ֔חַ אֲשֶׁר עָ֥שָׂה שָׁ֖ם בָּ/רִאשֹׁנָ֑ה וַ/יִּקְרָ֥א שָׁ֛ם אַבְרָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/004.yaml
  text: to the place of the altar that he had made there at first[b][a]. And there Abram called on the name of Yahweh.
translation:
  language: tl
  text: sa lugar ng altar na ginawa niya roon noong una. Doon, tumawag si Abram sa pangalan ni Yahweh[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; tradisyonal na isinasaling “ang PANGINOON.” Maaari ring “Jehova.”'
    reason: alternative_reading
  - marker: b
    text: Maaari ring “ipinahayag ang pangalan ni Yahweh” o “nanawagan kay Yahweh.” Maaaring taglayin ng idyomang Hebreo kapwa ang diwa ng pagtawag o pananalangin at ng pagpapahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם
  choice: lugar
  rationale: Karaniwan at natural na katumbas ng pangngalang tumutukoy sa pook o lokasyon.
- source_word: הַמִּזְבֵּחַ
  choice: ang altar
  rationale: Tiyak na altar ang tinutukoy, yaong naunang ginawa ni Abram; “altar” ang malinaw at kinikilalang terminong panrelihiyon sa makabagong Filipino.
- source_word: אֲשֶׁר עָשָׂה
  choice: na ginawa niya
  rationale: Pinananatili ang payak na diwa ng pandiwang עשה, “gumawa,” nang hindi pinakikitid ito sa mas tiyak na “itinayo.”
- source_word: שָׁם
  choice: roon / Doon
  rationale: Pinanatili ang dalawang paglitaw ng pang-abay na panlunan upang maipakita ang pag-uulit at diin ng Hebreo.
- source_word: בָּרִאשֹׁנָה
  choice: noong una
  rationale: Tumutukoy ito sa naunang pagpunta ni Abram at paggawa niya ng altar sa lugar na iyon; natural at maikli ang parirala sa Filipino.
- source_word: וַיִּקְרָא ... בְּשֵׁם יְהוָה
  choice: tumawag ... sa pangalan ni Yahweh
  rationale: Malapit ito sa anyo ng idyomang Hebreo at hindi nito lubusang nilulutas kung ang diin ay pananalangin, pagtawag, o pagpapahayag; ipinaliliwanag ang saklaw sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa baybay-Filipino ang personal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אַבְרָם
  choice: Abram
  rationale: Ginamit ang nakaugaliang transliterasyon sa Filipino ng personal na pangalan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalang YHWH ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan, habang inilalahad sa talababa ang tradisyonal at iba pang posibleng anyo.
- issue: Diwa ng idyomang קרא בשם יהוה
  choice: tumawag sa pangalan ni Yahweh
  alternative: ipinahayag ang pangalan ni Yahweh; nanawagan kay Yahweh sa pangalan
  rationale: Maaaring saklawin ng idyoma ang panawagan o pagsamba at ang pagpapahayag ng pangalan. Pinananatili ng pangunahing salin ang pormal na lawak ng pananalita at inilalagay sa talababa ang mga posibleng diin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong pira-piraso sa simula sapagkat ipinagpapatuloy ng talata ang kilos mula sa naunang talata. Ang bahagyang pormal na “tumawag ... sa pangalan” ay sadyang pinili upang mapanatili ang tunay na kalabuan ng idyomang Hebreo.
