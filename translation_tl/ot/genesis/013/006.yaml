translation:
  language: tl
  text: Hindi sila kayang tustusan ng lupain upang manirahang magkasama, sapagkat napakarami ng kanilang mga ari-arian kaya hindi sila makapanirahang magkasama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא
  choice: kayang panirahan
  rationale: Sa kontekstong ito, ang literal na ‘dalhin/pasanin’ ay tumutukoy sa kakayahan ng lupain na tustusan o bigyan ng sapat na lugar ang dalawa at ang kanilang sambahayan; pinananatili ng parirala ang lupain bilang simuno at natural ito sa Filipino.
- source_word: לָשֶׁבֶת יַחְדָּו
  choice: panirahan ... nang magkasama / makapanirahang magkasama
  rationale: Ang יָשַׁב ay ‘manirahan’ o ‘tumira,’ at ang יַחְדָּו ay ‘magkasama.’ Ang pag-uulit nito ay pinanatili gaya ng Hebreo.
- source_word: רְכוּשָׁם רָב
  choice: napakarami ng kanilang mga ari-arian
  rationale: Ang רְכוּשׁ ay mga pag-aari o ari-arian, kabilang sa konteksto ang mga kawan at yaman; ang רָב ay nagpapahayag ng napakalaking dami.
