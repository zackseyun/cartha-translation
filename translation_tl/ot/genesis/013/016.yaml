base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/016.yaml
  text: And I will make your offspring like the dust of the earth[a], so that if a man can count the dust of the earth[b], then your offspring also can be counted.
translation:
  language: tl
  text: At gagawin kong gaya ng alabok ng lupa ang iyong mga inapo[a], kaya kung mabibilang ng isang tao[b] ang alabok ng lupa, mabibilang din ang iyong mga inapo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “iyong binhi.” Kolektibong tumutukoy ang salita sa mga supling o inapo.
    reason: lexical_alternative
  - marker: b
    text: O “sinuman.” Masculine singular ang anyo sa Hebreo ngunit pangkalahatan ang gamit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: At gagawin ko
  rationale: Bagaman literal na ‘ilalagay’ o ‘itatakda’ ang pandiwa, sa konstruksiyong may paghahambing ay natural itong nangangahulugang ‘gagawin kong gaya ng.’
- source_word: זַרְעֲךָ
  choice: iyong mga inapo
  rationale: Ang זֶרַע ay literal na ‘binhi’ ngunit dito ay kolektibong tumutukoy sa mga magiging salinlahi ni Abram. Ang ‘mga inapo’ ang pinakamalinaw sa karaniwang makabagong Tagalog; inilalahad sa talababa ang literal at kolektibong anyo.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: gaya ng alabok ng lupa
  rationale: Pinananatili nito ang tahasang larawan at paghahambing ng Hebreo, na ipinaliliwanag ng kasunod na pahayag tungkol sa pagbibilang.
- source_word: אֲשֶׁר אִם
  choice: kaya kung
  rationale: 'Ipinakikilala ng parirala ang resultang paghahambing: kung mabibilang ang alabok, mabibilang din ang mga inapo ni Abram.'
- source_word: אִישׁ
  choice: isang tao
  rationale: Masculine singular ang anyong Hebreo ngunit pangkalahatan ang gamit nito. Sa Tagalog, ang ‘tao’ ay likas na hindi tumutukoy sa isang kasarian at tumpak na naghahatid ng generic force.
- source_word: לִמְנוֹת ... יִמָּנֶה
  choice: mabibilang ... mabibilang
  rationale: Ang pag-uulit ay tumutugma sa protasis at apodosis ng Hebreo at malinaw na nagpapahayag ng posibilidad sa kondisyunal na paghahambing.
- source_word: גַּם
  choice: din
  rationale: Ipinakikita ng ‘din’ ang pagtutumbas sa pagbibilang sa alabok at sa mga inapo.
theological_decisions:
- issue: Ang kolektibong pangngalang זֶרַע sa pangako kay Abram
  choice: iyong mga inapo
  alternative: iyong binhi; iyong supling
  rationale: Kolektibong tumutukoy ang talata sa napakaraming magiging salinlahi ni Abram. Hindi ipinipilit ng salin ang eksklusibong singular o mesiyanikong pagbasa, ngunit pinananatili sa talababa ang literal na ‘binhi’ at ang kolektibong katangian ng salita.
- issue: Ang pangkalahatang gamit ng אִישׁ
  choice: isang tao
  alternative: sinuman; isang lalaki
  rationale: Bagaman masculine singular ang anyong Hebreo, generic ang puwersa nito. Ang ‘isang tao’ ay natural at eksaktong pangkalahatan sa Tagalog nang hindi nagdaragdag ng limitasyong pangkasarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang larawan ng ‘alabok ng lupa’ at ang kondisyunal na diin ng orihinal, habang ginamit ang karaniwang ‘mga inapo’ para sa kolektibong זֶרַע.
