base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/008.yaml
  text: So Abram said to Lot[a], “Please, let there be no strife between me and you, and between my herdsmen and your herdsmen[b], for we are kinsmen.”
translation:
  language: tl
  text: Kaya sinabi ni Abram kay Lot, “Pakiusap, huwag sanang magkaroon ng alitan sa pagitan nating dalawa at sa pagitan ng mga pastol ko at mga pastol mo, sapagkat magkamag-anak tayo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kaya sinabi ni Abram
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas na ipinahihiwatig ng “Kaya” ang pagkakasunod at kaugnayan sa naunang pangyayari.
- source_word: אַל נָא תְהִי מְרִיבָה
  choice: Pakiusap, huwag sanang magkaroon ng alitan
  rationale: Pinagsasama ng “Pakiusap” at “sana” ang magalang at pinalambot na pakiusap ng נָא at ang negatibong jussive; ang “alitan” ay natural at sapat na malawak para sa pagtatalo.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: sa pagitan nating dalawa
  rationale: Natural sa Tagalog at malinaw na tumutukoy kina Abram at Lot, habang pinananatili ang tahasang ugnayang pairwise ng Hebreo.
- source_word: רֹעַי ... רֹעֶיךָ
  choice: mga tagapag-alaga ko ... mga tagapag-alaga mo
  rationale: Ang mga anyo mula sa רעה ay tumutukoy sa mga nag-aalaga ng mga hayop. Mas malawak at angkop sa konteksto ang “tagapag-alaga” kaysa “pastol,” na maaaring maunawaang para lamang sa tupa.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala nito ang dahilan ng pakiusap ni Abram at nagpapanatili ng marangal na himig.
- source_word: אֲנָשִׁים אַחִים אֲנָחְנוּ
  choice: magkamag-anak tayo
  rationale: Sa kontekstong si Abram ay tiyuhin ni Lot, ginagamit ang אַחִים sa mas malawak na diwang pampamilya. Ang “magkamag-anak tayo” ay natural at tumpak na naghahatid ng idiomatikong puwersa ng parirala.
theological_decisions:
- issue: Kahulugan ng אַחִים kaugnay nina Abram at Lot
  choice: magkamag-anak tayo
  alternative: magkapatid tayo; tayo ay mga lalaking magkakapatid
  rationale: Bagaman literal na maaaring mangahulugang “mga kapatid,” maaari ring tumukoy ang Hebreong אַחִים sa mas malawak na pagkakamag-anak. Yamang tiyuhin ni Lot si Abram, iniiwasan ng “magkamag-anak” ang maling pahiwatig na pareho ang kanilang mga magulang, nang hindi binabago ang diin sa kanilang buklod na pampamilya.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Pakiusap” at “sana” upang mapanatili ang magalang na tono ni Abram. Hindi nilagyan ng talababa dahil malinaw na naihahatid sa pangunahing teksto ang malawak na kahulugan ng Hebreong אַחִים.
