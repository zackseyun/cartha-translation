    issue: Ginamit ang “o” bago ang ikalawang pariralang “sa pagitan.”
    rationale: 'May dalawang magkaugnay na pahayag ang Hebreo: walang alitan sa pagitan nina Abram at Lot, at walang alitan sa pagitan ng kanilang mga pastol. Dapat itong pagdugtungin ng “at,” hindi “o.”'
  - severity: low
    issue: Masyadong malawak ang “mga tagapag-alaga.”
    rationale: Ang רֹעַי/רֹעֶיךָ ay mga taong nagpapastol o nag-aalaga ng mga kawan. Ang “mga pastol” ang mas tiyak, natural, at pangkontekstong Tagalog na katumbas.
  revised_text: Kaya sinabi ni Abram kay Lot, “Pakiusap, huwag sanang magkaroon ng alitan sa pagitan nating dalawa at sa pagitan ng mga pastol ko at mga pastol mo, sapagkat magkamag-anak tayo.”
