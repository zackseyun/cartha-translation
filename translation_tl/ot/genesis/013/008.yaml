  to: Kaya sinabi ni Abram kay Lot, “Pakiusap, huwag sanang magkaroon ng alitan sa pagitan nating dalawa at sa pagitan ng mga pastol ko at mga pastol mo, sapagkat magkamag-anak tayo.”
  rationale: Pinalitan ang “o” ng “at” upang maipakita ang parehong saklaw na magkakaugnay sa Hebreo. Pinalitan ang “mga tagapag-alaga” ng “mga pastol” upang malinaw na tukuyin ang mga nag-aalaga ng mga kawan. Pinanatili ang magalang na tono, ang malawak na kahulugan ng pagkakamag-anak, at ang daloy ng salaysay.
