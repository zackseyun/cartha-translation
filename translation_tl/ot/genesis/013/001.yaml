base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/001.yaml
  text: So Abram went up from Egypt[a], he and his wife and all that he had, and Lot with him, to the Negev.
translation:
  language: tl
  text: Umakyat si Abram mula sa Ehipto patungong Negev[a], kasama ang kanyang asawa, ang lahat ng mayroon siya, at si Lot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patungong timog.” Ang Hebreong negev ay maaaring tumukoy sa rehiyong nasa timog na tinatawag na Negev o, sa mas pangkalahatang diwa, sa timog o katimugang lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: umalis … at umahon
  rationale: Pinananatili ng “umahon” ang diwang pataas ng עלה at ang heograpikong idyoma ng paglalakbay mula sa Ehipto patungo sa lupain; idinagdag ang “umalis” upang maging natural at malinaw sa modernong Tagalog ang pinagmulan ng paglalakbay.
- source_word: מִמִּצְרַיִם
  choice: mula sa Ehipto
  rationale: Tuwirang katumbas ng pang-ukol מן at ng pangalang pantanging מִצְרַיִם.
- source_word: הוּא וְאִשְׁתּוֹ
  choice: kasama ang kanyang asawa
  rationale: Natural na inilalahad sa Tagalog ang pagsama ng asawa ni Abram nang hindi inuulit ang panghalip na magiging alanganin sa salin.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: ang lahat ng kanyang ari-arian
  rationale: Ipinahihiwatig ang lahat ng pag-aari ni Abram sa paraang malinaw sa karaniwang mambabasa; maaaring malawak ang saklaw nito at hindi lamang iisang uri ng kayamanan.
- source_word: וְלוֹט עִמּוֹ
  choice: at si Lot
  rationale: Sa balangkas na nagsisimula sa “kasama,” malinaw na kabilang din si Lot sa mga kasabay ni Abram, habang napapanatili ang huling pagbanggit sa kanya.
- source_word: הַנֶּגְבָּה
  choice: patungong Negev
  rationale: Pinananatili ang malamang na pangalan ng timog na rehiyon at isinasalin ang hulaping paturol na -ה sa pamamagitan ng “patungong.” Ang posibleng pangkalahatang kahulugang “timog” ay inilagay sa talababa.
