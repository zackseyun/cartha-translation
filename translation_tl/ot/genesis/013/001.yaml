    issue: May idinagdag na “Kaya” at “umalis … at umahon.”
    rationale: Ang pinagmulan ay may isang pangunahing pandiwa lamang, וַיַּעַל (“umakyat/umahon”), at walang pangatnig na nangangahulugang “kaya.” Ang pagdaragdag ng ikalawang kilos at inferensiyal na ugnayan ay lumalampas sa teksto.
  - severity: medium
    issue: Ang “lahat ng kanyang ari-arian” ay nagpapakitid sa “lahat ng mayroon siya.”
    rationale: Ang וְכָל אֲשֶׁר לוֹ ay malawak na pananalita para sa lahat ng mayroon kay Abram; maaaring kabilang dito ang mga pag-aari ngunit hindi dapat limitahan dito.
  revised_text: Umakyat si Abram mula sa Ehipto patungong Negev[a], kasama ang kanyang asawa, ang lahat ng mayroon siya, at si Lot.
