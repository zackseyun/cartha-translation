translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “umahon” upang mapanatili ang idyomang Hebreo, ngunit ipinares sa “umalis” upang hindi maging malabo sa ordinaryong mambabasa. Ang marker na [a] ay nasa pangunahing teksto.
