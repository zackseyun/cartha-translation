- from: Kaya umalis si Abram mula sa Ehipto at umahon patungong Negev[a], kasama ang kanyang asawa, ang lahat ng kanyang ari-arian, at si Lot.
  to: Umakyat si Abram mula sa Ehipto patungong Negev[a], kasama ang kanyang asawa, ang lahat ng mayroon siya, at si Lot.
  rationale: Inalis ang mga dagdag na elementong wala sa Hebreo at isinaayos ang parirala para mapanatili ang iisang pandiwang “umakyat,” ang malawak na saklaw ng “lahat ng mayroon siya,” at ang pagbanggit kay Lot bilang kasamang naglalakbay. Nananatili ang lexical na kalabuan ng negev sa talababa.
