  terminology: Ang “Yahweh” ay wastong salin ng יהוה ayon sa ibinigay na patakaran. Ang “laban kay Yahweh” ay isang makatwirang pangunahing pagbasa ng לַיהוָה; dapat manatili ang alternatibong “sa harapan ni Yahweh” sa talababa.
