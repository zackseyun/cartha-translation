- from: Napakasama ng mga lalaki sa Sodoma at labis silang nagkakasala laban kay Yahweh[a].
  to: Ang mga lalaki ng Sodoma ay lubhang masasama at makasalanan laban kay Yahweh[a].
  rationale: Pinalitan ang pandiwang “nagkakasala” ng pang-uring “makasalanan” upang matapat na maipakita ang magkahanay na רָעִים at חַטָּאִים. Ginamit ang “lubhang” bilang iisang likas na pagsasalin ng מְאֹד na sumasaklaw sa parehong paglalarawan. Pinanatili ang pangunahing pagbasa at talababa para sa tunay na ambiguity ng לַיהוָה.
