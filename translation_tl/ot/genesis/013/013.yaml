  text: The men of Sodom were exceedingly wicked and sinful against Yahweh[a].
translation:
  language: tl
  text: Ang mga lalaki ng Sodoma ay lubhang masasama at makasalanan laban kay Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa harapan ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַנְשֵׁי סְדֹם
  choice: mga lalaki sa Sodoma
  rationale: Ang אַנְשֵׁי ay construct plural ng אִישׁ at tumutukoy sa mga lalaking naninirahan sa Sodoma. Natural sa modernong Tagalog ang “mga lalaki sa Sodoma.” Hindi ginawang hiwalay na “at” ang וְ dahil nagsisilbi rito itong pang-ugnay sa daloy ng salaysay at hindi kailangan sa malayang talata sa Tagalog.
- source_word: רָעִים
  choice: napakasama
  rationale: Sa kontekstong moral, ang רָעִים ay tumutukoy sa kasamaan, hindi lamang sa pagiging di-kaaya-aya. Isinama sa “napaka-” ang matinding diin ng מְאֹד sa natural na Tagalog.
- source_word: וְ/חַטָּאִים
  choice: at labis silang nagkakasala
  rationale: Inilalarawan ng חַטָּאִים ang mga lalaki bilang puspos o kilala sa kasalanan. Mas natural at malinaw sa Tagalog ang pandiwang “nagkakasala” kaysa sa pariralang “makasalanan laban,” habang napapanatili ang patuloy o katangiang diwa ng anyo.
- source_word: לַ/יהוָה
  choice: laban kay Yahweh
  rationale: Kasama ng חטא, maaaring tukuyin ng ל ang Diyos bilang siyang nilalabag ng kasalanan. Ang “laban kay Yahweh” ay malinaw na nagpapahayag ng relasyonal at moral na bigat ng parirala.
- source_word: מְאֹד
  choice: napaka- … labis
  rationale: Matindi ang diin ng מְאֹד sa kabuuang paglalarawan. Ipinahayag ito sa dalawang magkatugmang panaguri upang maging malinaw at natural sa Tagalog nang hindi pinahihina ang lakas ng Hebreo.
theological_decisions:
- issue: Pagpapangalan sa Diyos na יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginamit sa Hebreo ang banal na pangalang יהוה. Pinanatili ang pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Diwa ng לַיהוָה kasunod ng חַטָּאִים
  choice: laban kay Yahweh
  alternative: sa harap ni Yahweh
  rationale: Maaaring ipahiwatig ng parirala na ang kasalanan ay paglabag laban kay Yahweh o na nagaganap ito sa kanyang harapan. Pinili sa teksto ang relasyonal na diwang “laban,” ngunit pinanatili sa talababa ang tunay na posibleng alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang ayos na panaguri muna (“Napakasama…”) upang maiwasan ang mabigat at di-likas na sunod-sunod na pang-uri, habang nananatiling matindi ang paghatol ng tekstong Hebreo.
