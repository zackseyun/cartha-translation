  yaml_path: translation/ot/genesis/013/002.yaml
  text: Abram was very wealthy in livestock[a], silver, and gold.
translation:
  language: tl
  text: At si Abram ay napakayaman sa mga alagang hayop, pilak, at ginto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: At si Abram
  rationale: Isinalin ang וְ bilang “At” upang mapanatili ang malinaw na pagdurugtong sa naunang salaysay; pinanatili ang pangalang Abram ayon sa anyo nito sa yugtong ito ng Genesis.
- source_word: כָּבֵד מְאֹד
  choice: napakayaman
  rationale: Bagaman literal na “napakabigat,” ang כָּבֵד sa talaan ng mga ari-arian ay idyomang tumutukoy sa malaking kayamanan. Likas na ipinapahayag ng “napakayaman” ang pandiwang-diwang ito kasama ng tindi ng מְאֹד.
- source_word: בַּ/מִּקְנֶה
  choice: sa mga alagang hayop
  rationale: Ang מִקְנֶה ay tumutukoy rito sa pag-aaring mga hayop, kabilang ang mga kawan. Mas malinaw at mas malawak ang “mga alagang hayop” kaysa “mga baka” lamang.
- source_word: בַּ/כֶּסֶף
  choice: pilak
  rationale: Tumutukoy ang כֶּסֶף sa pilak bilang isang uri ng kayamanan; ang “sa” bago sa magkakaugnay na talaan ay likas na sumasaklaw rin dito sa Filipino.
- source_word: וּ/בַ/זָּהָב
  choice: at ginto
  rationale: Pinananatili ng “at ginto” ang huling magkakaugnay na uri ng kayamanan at ang pang-ugnay na וּ.
