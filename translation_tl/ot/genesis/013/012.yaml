  yaml_path: translation/ot/genesis/013/012.yaml
  text: Abram lived in the land of Canaan[a], and Lot lived in the cities of the plain and pitched his tents as far as Sodom.
translation:
  language: tl
  text: Nanirahan si Abram sa lupain ng Canaan, at nanirahan si Lot sa mga lungsod ng kapatagan at itinayo ang kanyang mga tolda hanggang sa Sodoma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “at inilipat ang kanyang tolda hanggang sa Sodoma.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagkakampo o pagtatayo ng tolda. Ipinahihiwatig nito na pinalawak ni Lot ang kanyang kampamento sa direksiyon ng Sodoma; hindi pa sinasabi ng talata na pumasok o nanirahan na siya sa lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: nanirahan
  rationale: Likas at makabagong salin para sa paninirahan o pagtira; angkop sa parehong pagbanggit kina Abram at Lot.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili ang tahasang אֶרֶץ ('lupain') at ang pangalang Canaan sa karaniwang anyong Filipino.
- source_word: בְּעָרֵי הַכִּכָּר
  choice: sa mga lungsod ng kapatagan
  rationale: Ang כִּכָּר dito ay tumutukoy sa kapatagan o malawak na patag na rehiyon; pinananatili rin ang maramihang ugnayang 'mga lungsod ng kapatagan.'
- source_word: וַיֶּאֱהַל
  choice: itinayo ang kanyang mga tolda
  rationale: Ipinahahayag ang pagkakampo sa pamamagitan ng pagtatayo ng tolda; natural sa Filipino ang maramihang 'mga tolda' para sa buong sambahayan at kampo ni Lot.
- source_word: עַד סְדֹם
  choice: hanggang sa Sodoma
  rationale: Pinananatili ang ideya ng hangganan o lawak na ipinahihiwatig ng עַד, nang hindi tahasang sinasabing nanirahan na si Lot sa loob ng lungsod.
- source_word: אַבְרָם
  choice: Abram
  rationale: Karaniwang transliterasyon ng personal na pangalan sa Filipino.
- source_word: לוֹט
  choice: Lot
  rationale: Karaniwang transliterasyon ng personal na pangalan sa Filipino.
- source_word: סְדֹם
  choice: Sodoma
  rationale: Karaniwang anyo ng pangalan ng lugar sa tradisyong biblikal na Filipino.
