  text: כִּ֧י אֶת כָּל הָ/אָ֛רֶץ אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/015.yaml
  text: For all the land that you see[a], I will give to you and to your offspring forever.
translation:
  language: tl
  text: Sapagkat ang buong lupaing nakikita mo ay ibibigay ko sa iyo at sa iyong lahi[a] magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binhi” o “mga inapo.” Ang Hebreong זֶרַע ay isang pangngalang kolektibo na maaaring mangahulugang “binhi,” “supling,” “lahi,” o “mga inapo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinagdurugtong nito ang utos na tumingin sa naunang talata at ang paliwanag o pangakong kasunod, nang hindi pinatitindi ang diwang sanhi.
- source_word: כָּל הָאָרֶץ
  choice: ang buong lupain
  rationale: Likas sa modernong Tagalog at malinaw na saklaw nito ang kabuuan ng lupaing nakikita ni Abram.
- source_word: אֲשֶׁר אַתָּה רֹאֶה
  choice: nakikita mo
  rationale: Tuwirang ipinahahayag ang nagpapatuloy na pagtingin sa konteksto sa isang natural na anyong Tagalog.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: ay ibibigay ko sa iyo
  rationale: Ang pandiwa ay pangakong nakatuon sa hinaharap, at ang 'sa iyo' ang malinaw na tumutukoy sa tatanggap.
- source_word: וּלְזַרְעֲךָ
  choice: at sa iyong lahi
  rationale: Ang 'lahi' ay likas na kolektibong katawagan sa mga magmumula kay Abram at hindi agad nililimitahan ang Hebreong זֶרַע sa tahasang maramihang anyo.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Pinananatili nito ang matibay at pangmatagalang diwa ng pangako sa isang marangal at karaniwang pahayag sa Tagalog.
theological_decisions:
- issue: Tagal ng pangako sa lupain sa pariralang עַד עוֹלָם
  choice: magpakailanman
  alternative: sa walang takdang panahon
  rationale: Ang 'magpakailanman' ang pinakatuwirang katumbas sa kontekstong ito at pinananatili ang bigat at tensiyong teolohikal ng pangako nang hindi ipinapasok ang isang partikular na sistemang eskatolohikal.
- issue: Kolektibong kahulugan ng זֶרַע
  choice: lahi
  alternative: mga inapo
  rationale: Pinananatili ng 'lahi' ang kolektibong katangian ng salita at hindi ipinipilit kung dapat itong unawain bilang isang indibidwal o bilang marami; nililinaw ng talababa ang lawak ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'lupain' para sa teritoryo at 'lahi' bilang natural na kolektibong katawagan; inilagay ang panandang [a] kaagad pagkatapos ng salitang tinatalakay nito.
