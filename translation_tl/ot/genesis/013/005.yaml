  text: And Lot[a], who went with Abram, also had flocks and herds and tents.
translation:
  language: tl
  text: At si Lot, na sumama kay Abram, ay mayroon ding mga kawan ng maliliit na alagang hayop[a], mga baka, at mga tolda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong salitang isinaling “mga kawan ng maliliit na alagang hayop” ay malawak na tumutukoy sa mga alagang hayop gaya ng mga tupa at kambing; ang kasunod na “mga baka” ay tumutukoy sa bovine livestock.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: At ... ding
  rationale: 'Pinananatili nito kapuwa ang pagkakaugnay sa naunang talata at ang diwang pandagdag: si Lot man ay may mga ari-arian.'
- source_word: לְלוֹט ... הָיָה
  choice: si Lot ... ay mayroon
  rationale: Ang לְ ay pananda ng nagmamay-ari sa eksistensiyal na konstruksiyon; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “mayroon.”
- source_word: הַהֹלֵךְ אֶת אַבְרָם
  choice: na sumama kay Abram
  rationale: Ang participle ay tumutukoy kay Lot bilang kasama ni Abram sa paglalakbay. Likas sa modernong Tagalog ang “sumama,” bagaman maaari ring isalin na “naglalakbay na kasama.”
- source_word: צֹאן
  choice: mga kawan
  rationale: Malawak itong tumutukoy sa maliliit na alagang hayop, lalo na sa mga tupa at kambing; ang “mga kawan” ay maikli at natural.
- source_word: וּבָקָר
  choice: mga bakahan
  rationale: Tumutukoy ito sa mga alagang baka bilang pangkat at malinaw na ipinapaiba sa maliliit na hayop ng צֹאן.
- source_word: וְאֹהָלִים
  choice: at mga tolda
  rationale: Tuwirang katumbas ito ng pangmaramihang pangngalan at nagpapahiwatig ng sambahayan o kampamento ni Lot.
