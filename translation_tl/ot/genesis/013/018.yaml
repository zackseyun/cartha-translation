base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/018.yaml
  text: So Abram moved his tent and came and settled by the oaks of Mamre[a], which are at Hebron[b], and there he built an altar to Yahweh.
translation:
  language: tl
  text: Kaya inilipat ni Abram ang kanyang tolda, at pumunta siya at nanirahan sa tabi ng malalaking puno ng Mamre[a], na nasa Hebron. Doon ay nagtayo siya ng altar para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga ensina ng Mamre” o “mga terebinto ng Mamre.” Maaaring tumukoy ang salitang Hebreo sa malalaking punong gaya ng ensina o terebinto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַל
  choice: inilipat ... ang kanyang tolda
  rationale: Ipinahihiwatig ng pandiwang mula sa אהל ang pagtitolda o paglipat ng tolda. Ang 'inilipat ... ang kanyang tolda' ay natural sa modernong Tagalog at angkop sa kasunod na pagpunta at paninirahan.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: pumunta siya at nanirahan
  rationale: 'Pinananatili nito ang sunod-sunod na kilos sa Hebreo: pagpunta at pagkatapos ay paninirahan sa lugar.'
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: sa tabi ng malalaking puno ng Mamre
  rationale: Hindi tiyak kung oak o terebinto ang tinutukoy ng אֵלוֹן. Ang mas pangkalahatang 'malalaking puno' ay nagpapanatili sa tunay na leksikal na kalabuan; nasa talababa ang mga posibleng uri.
- source_word: אֲשֶׁר בְּחֶבְרוֹן
  choice: na nasa Hebron
  rationale: Malinaw at natural na inilalagay ng pariralang ito ang mga puno ng Mamre sa Hebron.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Doon ay nagtayo siya ng altar
  rationale: Tuwirang pinananatili ang lokatibong שָׁם at ang karaniwang kahulugan ng מִזְבֵּחַ bilang altar.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה sa transliterasyong 'Yahweh'; natural sa Tagalog ang 'para kay' para sa altar na inialay o itinayo ukol sa Diyos.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang 'Yahweh' ay nagpapanatili rito bilang personal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Eksaktong uri ng mga punong אֵלֹנֵי מַמְרֵא
  choice: malalaking puno ng Mamre
  alternative: mga ensina ng Mamre; mga terebinto ng Mamre
  rationale: Hindi tiyak ang eksaktong uri ng puno. Hindi dapat magtakda ang pangunahing teksto ng isang uri na hindi tiyak sa Hebreo, kaya pinanatili ang kalabuan at inilagay sa talababa ang mga karaniwang posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang 'tolda,' 'nanirahan,' at 'altar' bilang mga salitang karaniwang nauunawaan. Pinanatili ang Hebreong ayos ng mga kilos nang hindi nagiging asiwa ang pangungusap.
