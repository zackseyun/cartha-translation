id: GEN.13.10
reference: Genesis 13:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשָּׂא ל֣וֹט אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן כִּ֥י כֻלָּ֖/הּ מַשְׁקֶ֑ה לִ/פְנֵ֣י שַׁחֵ֣ת יְהוָ֗ה אֶת סְדֹם֙ וְ/אֶת עֲמֹרָ֔ה כְּ/גַן יְהוָה֙ כְּ/אֶ֣רֶץ מִצְרַ֔יִם בֹּאֲ/כָ֖ה צֹֽעַר־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/010.yaml
  text: Lot lifted up his eyes and saw all the plain of the Jordan[a], that all of it was well watered before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt[d][c][b], as you go toward Zoar.
translation:
  language: tl
  text: Tumingala si Lot at nakita niya ang buong Kapatagan ng Jordan.[a] Ang buong lugar ay saganang nadidiligan—bago winasak ni Yahweh ang Sodoma at Gomorra—tulad ng hardin ni Yahweh[b] at ng lupain ng Ehipto, sa gawing Zoar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang buong Lambak ng Jordan”; mas literal, “ang buong bilog na distrito ng Jordan.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na ipinahihiwatig ng “hardin ni Yahweh” ang luntiang kasaganaan ng Eden.
    reason: cross_reference
  - marker: c
    text: Maaari ring “habang papalapit sa Zoar.” Ang pananalitang Hebreo ay nagsasaad ng direksiyon patungo sa Zoar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  choice: Tumingala si Lot
  rationale: Ang idyomang Hebreo ay tumutukoy sa pagtataas at pagtutuon ng tingin. Ang “tumingala” ay likas at malinaw sa modernong Tagalog.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: ang buong Kapatagan ng Jordan
  rationale: Ang כִּכָּר ay maaaring tumukoy sa bilog na distrito o kapatagan. Ang “Kapatagan ng Jordan” ay malinaw na heograpikong katawagan nang hindi ipinipilit ang literal na hugis.
- source_word: כִּי כֻלָּהּ מַשְׁקֶה
  choice: Ang buong lugar ay saganang nadidiligan
  rationale: Inilalarawan ng מַשְׁקֶה ang lupaing may saganang suplay ng tubig o irigasyon. Ipinahahayag ng “saganang nadidiligan” ang kasaganaan, hindi lamang ang payak na pagkabasa.
- source_word: לִפְנֵי שַׁחֵת יְהוָה
  choice: bago winasak ni Yahweh
  rationale: Ang לִפְנֵי ay temporal dito, at ang שׁחת ay tumutukoy sa pagwasak sa mga lungsod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: כְּגַן יְהוָה
  choice: tulad ng hardin ni Yahweh
  rationale: Pinananatili ang tahasang paghahambing at ang alusyong maaaring tumukoy sa malagong hardin ng Eden.
- source_word: כְּאֶרֶץ מִצְרַיִם
  choice: tulad ng lupain ng Ehipto
  rationale: Pinananatili ang אֶרֶץ bilang “lupain” upang manatiling heograpiko at agrikultural ang paghahambing.
- source_word: בֹּאֲכָה צֹעַר
  choice: sa gawing Zoar
  rationale: Ang idyoma ay nagsasaad ng direksiyon o paglapit. Ang “sa gawing Zoar” ay likas sa Tagalog at hindi nagdaragdag ng tiyak na hangganang wala sa Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa banal na pangalan sa halip na palitan ito ng titulo.
- issue: Pahiwatig ng “hardin ni Yahweh”
  choice: Pinanatili ang parirala at ipinaliwanag lamang sa talababa na malamang na ipinahihiwatig nito ang Eden
  alternative: Isalin nang tuwiran bilang “hardin ng Eden”
  rationale: Hindi tahasang binabanggit ng tekstong Hebreo ang Eden sa talatang ito, kaya hindi ito isinisingit sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang karaniwang baybay na “Sodoma,” “Gomorra,” at “Ehipto.” Hinati sa dalawang pangungusap para luminaw ang paglalarawan, habang pinanatili ng mga gitling ang parentetikong tala tungkol sa pagwasak sa mga lungsod.
