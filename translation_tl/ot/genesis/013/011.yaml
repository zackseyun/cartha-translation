id: GEN.13.11
reference: Genesis 13:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּבְחַר ל֣/וֹ ל֗וֹט אֵ֚ת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן וַ/יִּסַּ֥ע ל֖וֹט מִ/קֶּ֑דֶם וַ/יִּפָּ֣רְד֔וּ אִ֖ישׁ מֵ/עַ֥ל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/011.yaml
  text: So Lot chose for himself all the plain of the Jordan[a], and Lot journeyed eastward; and they separated from each other.
translation:
  language: tl
  text: Kaya pinili ni Lot para sa sarili niya ang buong kapatagan ng Jordan. Naglakbay si Lot pasilangan[a], at naghiwalay sila sa isa’t isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa silangan.” Maaaring tumukoy ang pariralang Hebreo sa direksiyon ng paglalakbay o sa pinanggalingan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: pinili ... para sa sarili niya
  rationale: Pinananatili ng parirala ang kahulugan ng בחר na “pumili” at ang personal na diin ng לוֹ, sa natural na modernong Tagalog.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: ang buong kapatagan ng Jordan
  rationale: Sa kontekstong heograpikal, ang כִּכָּר ay tumutukoy sa patag na rehiyon sa paligid ng Jordan; malinaw at likas sa Tagalog ang “kapatagan.”
- source_word: וַיִּסַּע
  choice: naglakbay
  rationale: Ipinahihiwatig ng נסע ang pag-alis ng kampo at pagpapatuloy ng paglalakbay; maikli at angkop sa salaysay ang “naglakbay.”
- source_word: מִקֶּדֶם
  choice: pasilangan
  rationale: Pinili sa pangunahing teksto ang direksiyon ng paglalakbay bilang pagbasa na mas maayos sa konteksto, habang inilalagay sa talababa ang tunay na alternatibong “mula sa silangan.”
- source_word: וַיִּפָּרְדוּ
  choice: naghiwalay sila
  rationale: Ang anyong Niphal ay nagpapahayag ng magkatugong paghihiwalay, na natural na naihahatid ng “naghiwalay sila.”
- source_word: אִישׁ מֵעַל אָחִיו
  choice: sa isa’t isa
  rationale: Ang literal na idyomang “bawat lalaki mula sa kaniyang kapatid” ay distributibo at tumutukoy kina Abram at Lot; malinaw na naihahatid sa Tagalog ng “sa isa’t isa” ang magkatugong diwa nang hindi lumilikha ng maling pahiwatig na magkapatid sila sa agarang kahulugan.
theological_decisions:
- issue: Wikang panlalaki at katawagang pampamilya sa אִישׁ מֵעַל אָחִיו
  choice: sa isa’t isa
  alternative: bawat isa mula sa kaniyang kapatid
  rationale: Bagaman gumagamit ang Hebreo ng panlalaking anyong distributibo at ng salitang “kapatid,” idyomatiko rito ang parirala para sa paghihiwalay ng dalawang magkamag-anak. Pinananatili ng napiling salin ang magkatugong kahulugan at iniiwasan ang di-likas o mapanlinlang na literalismo.
- issue: Kalabuan ng direksiyon sa מִקֶּדֶם
  choice: pasilangan
  alternative: mula sa silangan
  rationale: Maaaring ipahiwatig ng pariralang Hebreo ang direksiyon ng paglalakbay o ang pinanggalingan. Mas angkop sa konteksto ang “pasilangan,” ngunit pinananatili sa talababa ang alternatibo upang hindi itago ang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural para sa karaniwang mambabasa. Ginamit ang “niya” sa halip na mas pormal na “kaniya” sa pangunahing teksto para sa likas na daloy, habang iniwasan ang kolokyal o sektaryang pananalita.
