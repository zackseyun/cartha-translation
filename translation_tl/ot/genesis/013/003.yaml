base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/003.yaml
  text: And he journeyed by stages from the Negev as far as Bethel[a], to the place where his tent had been at the beginning, between Bethel and Ai.
translation:
  language: tl
  text: Naglakbay siya nang yugto-yugto[a] mula sa Negev hanggang Bethel, hanggang sa lugar kung saan unang nakatayo ang kanyang tolda, sa pagitan ng Bethel at Ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa kanyang mga paglalakbay”; ibig sabihin, sunod-sunod siyang lumipat mula sa isang kampo patungo sa isa pa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Naglakbay siya
  rationale: Karaniwang nangangahulugang “pumunta” o “lumakad” ang pandiwa, ngunit sa salaysay na may ruta at malayuang paglalakbay, likas at tumpak ang “naglakbay.”
- source_word: לְמַסָּעָיו
  choice: nang yugto-yugto
  rationale: Tumutukoy ang מַסָּע sa paghahakot ng kampo o isang yugto ng paglalakbay; ipinahihiwatig ng maramihan ang sunod-sunod na paglipat mula sa isang himpilan patungo sa iba.
- source_word: מִנֶּגֶב
  choice: mula sa Negev
  rationale: Bagaman maaari ring mangahulugang “timog” ang נֶגֶב, mas angkop dito ang heograpikong rehiyon ng Negev sa konteksto ng paglalakbay ni Abram.
- source_word: וְעַד בֵּית אֵל
  choice: hanggang Bethel
  rationale: Ipinahahayag ng עַד ang hangganan o dulo ng ruta; natural itong isalin na “hanggang” sa Filipino.
- source_word: עַד הַמָּקוֹם
  choice: patungo sa lugar
  rationale: Nililinaw ng ikalawang עַד ang mas tiyak na hantungan. Ang “patungo sa lugar” ay natural at iniiwasan ang mabigat na pag-uulit ng “hanggang.”
- source_word: אֲשֶׁר הָיָה שָׁם אהל/ה
  choice: na kinatatayuan ng tolda niya
  rationale: Tinutukoy ng sugnay ang dating kinalalagyan ng tolda ni Abram. Nasa diwa na ng “kinatatayuan” ang lokasyong ipinahahayag ng שָׁם.
- source_word: בַּתְּחִלָּה
  choice: noong una
  rationale: Tumutukoy ito sa naunang pagkakampo ni Abram sa salaysay; malinaw at natural sa modernong Filipino ang “noong una.”
- source_word: בֵּין בֵּית אֵל וּבֵין הָעָי
  choice: sa pagitan ng Bethel at Ai
  rationale: Tuwirang ipinahahayag ng parirala ang lokasyon sa pagitan ng dalawang pook. Ang pantukoy sa anyong Hebreo ng Ai ay hindi kailangang katawanin sa saling Filipino.
theological_decisions: []
