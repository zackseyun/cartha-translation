  naturalness: Natural sa modernong Filipino ang “Naglakbay siya nang yugto-yugto.” Mas malinaw at natural ang “kung saan unang nakatayo ang kanyang tolda” kaysa sa kasalukuyang “kinatatayuan,” habang naipapahayag ang naunang panahon sa salaysay.
  terminology: Wastong pinanatili ang mga pangalang Negev, Bethel, at Ai. Ang “tolda” ay angkop para sa אָהֳלֹה. Napananatili ng talababa ang leksikal na alternatibo para sa לְמַסָּעָיו.
