  yaml_path: translation/ot/genesis/013/009.yaml
  text: Is not the whole land before you? Please separate from me. If you go to the left[a], then I will go to the right; and if you go to the right, then I will go to the left.
translation:
  language: tl
  text: Hindi ba nasa harapan mo ang buong lupain? Humiwalay ka sana sa akin. Kung pupunta ka sa kaliwa[a], pupunta naman ako sa kanan; at kung pupunta ka sa kanan, pupunta naman ako sa kaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'May elipsis ang mga kondisyunal na sugnay sa Hebreo. Sa literal: “Kung sa kaliwa, pupunta ako sa kanan; at kung sa kanan, pupunta ako sa kaliwa.” Idinagdag sa salin ang “pupunta ka sa” upang maging malinaw sa Tagalog.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Ipinahahayag nito ang isang retorikal na tanong na umaasang sasang-ayon ang kausap; likas at malinaw ito sa modernong Tagalog.
- source_word: כָל הָאָרֶץ
  choice: ang buong lupain
  rationale: Ang אָרֶץ dito ay tumutukoy sa teritoryong nakalatag para sa paninirahan, hindi sa buong daigdig.
- source_word: לְפָנֶיךָ
  choice: nasa harapan mo
  rationale: Pinananatili ang larawang spatial ng Hebreo habang likas na ipinahihiwatig na bukás sa pagpili ni Lot ang lupain.
- source_word: הִפָּרֶד נָא מֵעָלָי
  choice: Humiwalay ka sana sa akin
  rationale: Ang pautos na Niphal ay tuwirang humihiling ng paghihiwalay, at ipinahahayag ng “sana” ang magalang na pakiusap ng נָא nang hindi ginagawang marahas ang tono.
- source_word: אִם הַשְּׂמֹאל
  choice: Kung pupunta ka sa kaliwa
  rationale: Pinaikli sa Hebreo ang sugnay; idinagdag ang “pupunta ka sa” upang maging malinaw at natural sa Tagalog nang hindi ipinapasok ang mas interpretibong “pipiliin.”
- source_word: וְאֵימִנָה
  choice: pupunta naman ako sa kanan
  rationale: Ipinahahayag ng anyong pandireksiyon ang pagkilos patungo sa kanan; nililinaw ng “naman” ang katapat na kilos ni Abram.
- source_word: וְאִם הַיָּמִין
  choice: at kung pupunta ka sa kanan
  rationale: Pinananatili ang paralelismo ng unang kondisyunal na sugnay at ang pang-ugnay na “at” ng Hebreo.
- source_word: וְאַשְׂמְאִילָה
  choice: pupunta naman ako sa kaliwa
  rationale: Ipinahahayag ang katapat na pagkilos patungo sa kaliwa at pinananatili ang balanseng ayos ng alok.
