base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/014.yaml
  text: 'And Yahweh said to Abram[a], after Lot had separated from him, “Please lift up your eyes and look from the place where you are: northward and southward and eastward and westward.”'
translation:
  language: tl
  text: At sinabi ni Yahweh kay Abram, matapos humiwalay sa kanya si Lot, “Itaas mo nga ang iyong mga mata at tumingin mula sa kinaroroonan mo, sa hilaga, timog, silangan, at kanluran.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  choice: At sinabi ni Yahweh
  rationale: Pinananatili ng “At” ang pagpapatuloy ng salaysay, at ang pangalang יְהוָה ay tuwirang isinalin bilang “Yahweh.”
- source_word: אַחֲרֵי הִפָּרֶד לוֹט מֵעִמּוֹ
  choice: matapos humiwalay sa kanya si Lot
  rationale: Malinaw na ipinahahayag ang panahong kasunod ng paghihiwalay ni Lot kay Abram, habang pinananatili ang diwang intransitibo ng Niphal.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Itaas mo ngayon ang iyong tingin
  rationale: Ang “tingin” ay likas na modernong Tagalog para sa idyomang Hebreo na literal na “itaas ang iyong mga mata.” Ipinahihiwatig ng “ngayon” ang banayad na pakiusap o paghihikayat ng נָא nang hindi ginagawang di-likas ang utos.
- source_word: וּרְאֵה
  choice: at masdan
  rationale: Ang “masdan” ay angkop sa sadyang pagtingin sa malawak na lupaing nakapaligid kay Abram.
- source_word: מִן הַמָּקוֹם אֲשֶׁר אַתָּה שָׁם
  choice: mula sa kinaroroonan mo
  rationale: Likas at maikli itong katumbas ng lugar na kinalalagyan ni Abram, nang walang idinadagdag na ideya gaya ng “kinatatayuan.”
- source_word: צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה
  choice: ang gawing hilaga, timog, silangan, at kanluran
  rationale: Ang “gawing” ay nagpapahayag ng direksiyon, gaya ng directional suffix sa apat na salitang Hebreo, sa natural na ayos ng Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangngalang pantangi ang יְהוָה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang tuwirang banal na pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kinaroroonan” at “masdan” bilang pormal ngunit karaniwang nauunawaang mga salita; iniwasan ang sobrang literal at di-likas na “itaas ang iyong mga mata.”
