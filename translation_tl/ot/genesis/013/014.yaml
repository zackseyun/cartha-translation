  naturalness: Malinaw at marangal ang kabuuang Tagalog. Mas likas ang “Itaas mo nga” upang maipahayag ang banayad na puwersa ng utos nang hindi ipinahihiwatig na ‘now.’ Ang “tumingin” ay tuwirang natural kasama ng mga direksiyong “sa hilaga ... sa kanluran.”
