- from: At sinabi ni Yahweh kay Abram, matapos humiwalay sa kanya si Lot, “Itaas mo ngayon ang iyong tingin at masdan mula sa kinaroroonan mo ang gawing hilaga, timog, silangan, at kanluran.”
  to: At sinabi ni Yahweh kay Abram, matapos humiwalay sa kanya si Lot, “Itaas mo nga ang iyong mga mata at tumingin mula sa kinaroroonan mo, sa hilaga, timog, silangan, at kanluran.”
  rationale: Pinalitan ang temporal na “ngayon” ng pampalambot na “nga” upang maipakita ang נָא nang walang idinagdag na kahulugang temporal. Ginawang “mga mata at tumingin” ang idyoma at kilos ng pagtanaw upang maging tuwiran at natural sa Tagalog, habang pinananatili ang saklaw at direksiyonal na puwersa ng Hebreo.
