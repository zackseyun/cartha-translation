  text: וַֽ/יְהִי רִ֗יב בֵּ֚ין רֹעֵ֣י מִקְנֵֽה אַבְרָ֔ם וּ/בֵ֖ין רֹעֵ֣י מִקְנֵה ל֑וֹט וְ/הַֽ/כְּנַעֲנִי֙ וְ/הַ/פְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
translation:
  language: tl
  text: At nagkaroon ng alitan sa pagitan ng mga tagapag-alaga ng mga kawan ni Abram at ng mga tagapag-alaga ng mga kawan ni Lot. Nang panahong iyon, naninirahan sa lupain ang mga Cananeo at mga Perezeo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, pang-isahan ang “Cananeo” at “Perezeo,” ngunit kolektibo ang kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nagkaroon
  rationale: Ipinagpapatuloy nito ang salaysay at natural na ipinahahayag ang paglitaw ng pangyayari.
- source_word: רִיב
  choice: alitan
  rationale: Tumutukoy ito sa sigalot o pag-aaway at angkop sa marangal ngunit karaniwang modernong Tagalog.
- source_word: רֹעֵי מִקְנֵה
  choice: mga tagapag-alaga ng mga kawan
  rationale: Saklaw ng מִקְנֶה ang iba't ibang alagang hayop; ang 'mga kawan' ay mas natural kaysa teknikal na 'mga hayupan,' at hindi ito nililimitahan sa mga tupa lamang.
- source_word: בֵּין ... וּבֵין
  choice: sa pagitan ng ... at ng
  rationale: Pinananatili ang malinaw na dalawang panig ng alitan.
- source_word: וְהַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: ang mga Cananeo at mga Perezeo
  rationale: Bagaman pang-isahan ang mga etnonimo sa Hebreo, kolektibo ang gamit; likas sa Tagalog ang tahasang maramihan.
- source_word: אָז
  choice: Nang panahong iyon
  rationale: Malinaw at natural nitong inilalagay ang kalagayan sa panahong tinutukoy ng salaysay.
- source_word: יֹשֵׁב
  choice: naninirahan
  rationale: Pinananatili ang nagpapatuloy na kalagayang ipinahihiwatig ng participle.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Pinananatili ng 'lupain' ang heograpikal at posibleng tipanang pahiwatig nang hindi ito dinaragdagan.
theological_decisions:
- issue: Posibleng tipanang pahiwatig ng הָאָרֶץ
  choice: sa lupain
  alternative: sa lugar na iyon / sa bansa
  rationale: Ang 'lupain' ay tumpak sa konteksto ng Genesis at hindi pinapawi ang posibleng mas malawak na pahiwatig ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang 'mga tagapag-alaga ng mga kawan' upang maging malinaw sa karaniwang mambabasa at maiwasan ang pagkitid sa tupa lamang. Inilagay ang temporal na parirala sa simula ng ikalawang pangungusap para sa maayos na daloy.
