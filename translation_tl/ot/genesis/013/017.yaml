  text: ק֚וּם הִתְהַלֵּ֣ךְ בָּ/אָ֔רֶץ לְ/אָרְכָּ֖/הּ וּ/לְ/רָחְבָּ֑/הּ כִּ֥י לְ/ךָ֖ אֶתְּנֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/017.yaml
  text: Get up[a], walk through the land, through its length and its width[b], for I will give it to you.
translation:
  language: tl
  text: Bumangon ka at lakarin mo ang lupain, sa buong haba at luwang nito, sapagkat ibibigay ko ito sa iyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֚וּם
  choice: Bumangon ka
  rationale: Tuwirang pautos na natural sa makabagong Filipino at pinananatili ang diwa ng pagbangon o pagtindig upang kumilos.
- source_word: הִתְהַלֵּ֣ךְ
  choice: lakarin mo
  rationale: Ang hitpael imperative ay nagpapahiwatig ng paglalakad o paglilibot sa isang pook; ipinahahayag ng “lakarin mo” ang aktuwal na pagtahak sa lupain nang hindi nagdaragdag ng layuning hindi tahasang sinabi.
- source_word: בָּאָרֶץ
  choice: ang lupain
  rationale: Sa konteksto, tumutukoy ang אֶרֶץ sa tiyak na teritoryong ipinangako, hindi sa buong daigdig.
- source_word: לְאָרְכָּהּ וּלְרָחְבָּהּ
  choice: sa buong haba at luwang nito
  rationale: Pinananatili ang pares na “haba at luwang,” na nagpapahiwatig sa kabuuang lawak ng lupain; idinagdag ang “buong” upang natural na maipahayag sa Filipino ang saklaw ng paglalakad na likas sa Hebreong parirala.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos sa isang marangal ngunit karaniwang anyo ng Filipino.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: ibibigay ko ito sa iyo
  rationale: Pinananatili ang promissoryong hinaharap at ang lupain bilang bagay na ibinibigay kay Abram.
theological_decisions:
- issue: Tinutukoy ng pambabaeng hulapi sa אֶתְּנֶנָּה
  choice: Ang “ito” ay tumutukoy sa lupain.
  alternative: 'Ulitin ang “lupain”: “ibibigay ko sa iyo ang lupaing ito.”'
  rationale: Ang hulaping pambabaeng isahan ay likas na bumabalik sa אֶרֶץ. Pinananatili ng panghalip ang anyo ng Hebreo nang hindi nagdaragdag ng interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lupain” para sa teritoryo at ang “lakarin mo” para sa tuwirang utos na tahakin ito. Walang talababa dahil walang mahalagang tekstuwal o leksikal na kalabuan na kailangang ilahad para sa talatang ito.
