  text: There was a famine in the land[a], and Abram went down to Egypt to sojourn there, because the famine was severe in the land.
translation:
  language: tl
  text: Nagkaroon ng taggutom sa lupain, at bumaba si Abram sa Ehipto upang manirahan doon nang pansamantala[a], sapagkat matindi ang taggutom sa lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “manirahan doon bilang dayuhan.” Ipinahihiwatig ng Hebreo ang pansamantalang paninirahan bilang isang dayuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nagkaroon
  rationale: Likas na panimulang salaysay sa Tagalog na naghahayag ng bagong pangyayari nang hindi nagdaragdag ng tahasang salitang panahunan gaya ng “ngayon.”
- source_word: רָעָב
  choice: taggutom
  rationale: Tumutukoy sa malawakang kakulangan ng pagkain, hindi lamang sa personal na pagkagutom.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Tumutukoy sa lokal na lupaing kinaroroonan ni Abram, hindi sa buong daigdig; pinananatili rin ang mahalagang temang “lupain” sa Genesis.
- source_word: וַיֵּרֶד
  choice: bumaba
  rationale: Pinananatili ang literal at nakaugaliang paglalarawan sa paglalakbay patungong Ehipto.
- source_word: מִצְרַיְמָה
  choice: sa Ehipto
  rationale: Natural na Tagalog para sa direksiyon ng paglalakbay patungong Ehipto.
- source_word: לָגוּר
  choice: upang manirahan doon nang pansamantala
  rationale: Ipinahahayag ang pansamantalang paninirahan na nasa pandiwang Hebreo; inilalagay sa talababa ang kaugnay na diwa ng pamumuhay bilang dayuhan.
- source_word: שָׁם
  choice: doon
  rationale: Tuwirang katumbas ng pang-abay na panlunan.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng pagbaba ni Abram sa Ehipto, sa dignified ngunit karaniwang rehistro.
- source_word: כָבֵד
  choice: matindi
  rationale: Idyomatikong inilalarawan ang bigat o tindi ng taggutom sa natural na Tagalog.
- source_word: הָרָעָב ... בָּאָרֶץ
  choice: ang taggutom sa lupain
  rationale: Pinananatili ang tiyak na pagtukoy at ang sinadyang pag-uulit sa Hebreo.
