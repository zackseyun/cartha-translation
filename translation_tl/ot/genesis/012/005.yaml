language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אַבְרָם֩ אֶת שָׂרַ֨י אִשְׁתּ֜/וֹ וְ/אֶת ל֣וֹט בֶּן אָחִ֗י/ו וְ/אֶת כָּל רְכוּשָׁ/ם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְ/אֶת הַ/נֶּ֖פֶשׁ אֲשֶׁר עָשׂ֣וּ בְ/חָרָ֑ן וַ/יֵּצְא֗וּ לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/005.yaml
  text: Abram took Sarai his wife[a], and Lot his brother’s son, and all their possessions that they had acquired, and the people whom they had acquired in Haran; and they set out to go to the land of Canaan[b], and they came to the land of Canaan.
translation:
  language: tl
  text: Isinama ni Abram ang asawa niyang si Sarai, si Lot na anak ng kanyang kapatid, ang lahat ng ari-ariang natamo nila, at ang mga taong natipon nila sa Haran.[a] Umalis sila upang pumunta sa lupain ng Canaan, at nakarating sila sa lupain ng Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga taong nakuha nila”; mas literal, “ang mga kaluluwang ginawa nila.” Malamang na tumutukoy ang idyomang Hebreo sa mga taong nakuha, natipon, o naisama nila sa kanilang sambahayan sa Haran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Isinama
  rationale: Sa konteksto ng paglalakbay, likas na ipinapahayag ng Tagalog na isinama ni Abram ang mga taong binanggit; naipapakita nito ang diwang ‘kinuha at dinala’ nang hindi tunog na pag-aari ang asawa at kamag-anak.
- source_word: אִשְׁתּוֹ
  choice: ang asawa niyang si Sarai
  rationale: Malinaw na tumutukoy ang אִשָּׁה sa asawa sa kontekstong ito; natural sa modernong Tagalog ang ayos na ito.
- source_word: בֶּן אָחִיו
  choice: si Lot na anak ng kanyang kapatid
  rationale: Pinananatili ang tahasang ugnayang pampamilya ng Hebreo, ‘anak ng kanyang kapatid,’ sa halip na paikliin bilang ‘pamangkin.’
- source_word: רְכוּשָׁם אֲשֶׁר רָכָשׁוּ
  choice: ang lahat ng ari-ariang natamo nila
  rationale: Saklaw ng ‘ari-arian’ ang kanilang mga pag-aari, at ipinahihiwatig ng ‘natamo’ na nakuha o naipon ang mga ito.
- source_word: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: ang mga taong natipon nila
  rationale: Ang נֶפֶשׁ ay tumutukoy rito sa mga tao, samantalang ang idyomang may עָשׂוּ ay malamang na tumutukoy sa mga taong nakuha o naisama sa sambahayan. Pinipili ng ‘natipon’ ang malinaw ngunit hindi labis na mapagpasiyang salin; inilalahad sa talababa ang literal at iba pang posibleng diwa.
- source_word: בְחָרָן
  choice: sa Haran
  rationale: Karaniwang lokatibong salin ng pangalan ng lugar.
- source_word: וַיֵּצְאוּ לָלֶכֶת
  choice: Umalis sila upang pumunta
  rationale: Pinananatili nito kapwa ang pag-alis at ang layunin ng paglalakbay na nasa Hebreong parirala.
- source_word: אַרְצָה כְּנַעַן
  choice: sa lupain ng Canaan
  rationale: Isinasalin ang panandang patungo at pinananatili ang tahasang ‘lupain’ ng Hebreo.
- source_word: וַיָּבֹאוּ אַרְצָה כְּנָעַן
  choice: nakarating sila sa lupain ng Canaan
  rationale: Natural na Tagalog para sa pagdating sa destinasyon, habang pinananatili ang pag-uulit ng ‘lupain ng Canaan’ sa pinagmulang teksto.
theological_decisions:
- issue: Kahulugan ng ‘mga taong ginawa/nakuha’ sa Haran
  choice: mga taong natipon nila
  alternative: mga taong nakuha nila; mas literal, mga kaluluwang ginawa nila
  rationale: Hindi tahasang tinutukoy ng teksto kung alipin, lingkod, kaanib ng sambahayan, o ibang mga kasamahan ang mga ito. Kaya hindi nagdaragdag ng tiyak na katayuang panlipunan o teolohikal ang pangunahing salin, at pinananatili sa talababa ang di-karaniwang anyo ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinanatili ang pag-uulit ng ‘lupain ng Canaan’ at ang tahasang ugnayang ‘anak ng kanyang kapatid.’ Iniwasan ang ‘kaluluwa’ sa pangunahing teksto dahil ang נֶפֶשׁ ay tumutukoy rito sa mga tao, ngunit itinabi ang literal na anyo sa talababa.
