translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na takbo ng salaysay, ang hindi pagtukoy sa gumawa ng pagdadala, at ang maaaring kahulugan ng “bahay” bilang tirahan o sambahayan.
