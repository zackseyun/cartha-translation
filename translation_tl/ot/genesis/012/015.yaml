  yaml_path: translation/ot/genesis/012/015.yaml
  text: When Pharaoh’s officials saw her[a], they praised her to Pharaoh[b], and the woman was taken into Pharaoh’s house.
translation:
  language: tl
  text: Nang makita siya ng mga opisyal ni Faraon, pinuri nila siya[a] kay Faraon, at dinala ang babae sa bahay ni Faraon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maganda ang sinabi nila tungkol sa kanya kay Faraon” o “inirekomenda nila siya kay Faraon.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “bahay.” Maaaring tumukoy ito sa maharlikang sambahayan ni Faraon, hindi lamang sa gusali.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי פַרְעֹה
  choice: mga opisyal ng Faraon
  rationale: Ang שָׂרִים ay tumutukoy sa matataas na pinuno o opisyal. Likas sa makabagong Filipino ang “mga opisyal” at hindi nito ipinahihiwatig na mga anak sila ng hari.
- source_word: וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה
  choice: pinuri nila siya sa Faraon
  rationale: Ang piel ng הלל dito ay nangangahulugang purihin o magsalita nang maganda tungkol sa isang tao. Pinananatili ng salin ang direksiyon ng papuri patungo sa Faraon nang hindi dinaragdagan ang motibo ng mga opisyal.
- source_word: וַתֻּקַּח
  choice: dinala
  rationale: Bagaman karaniwang nangangahulugang “kinuha,” ipinahihiwatig ng pariralang patungo sa bahay ng Faraon ang pagdadala. Ang anyong pokus sa layon ay hindi tahasang tumutukoy sa gumawa at pinananatili ang pagiging pasibo ng babae sa pangyayari.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Tuwirang katumbas ito ng Hebreong “ang babae.” Hindi ginawang “ang asawa” kahit asawa ni Abram ang tinutukoy, sapagkat hindi iyon ang salitang ginamit sa talata.
- source_word: בֵּית פַּרְעֹה
  choice: sa bahay ng Faraon
  rationale: Pinananatili ng “bahay” ang lawak ng kahulugan ng בַּיִת, na maaaring tumukoy sa gusali, tirahan, o sambahayan. Iniwasan ang mas mapagpasyang “palasyo.”
- source_word: וַיִּרְאוּ אֹתָהּ
  choice: nang makita siya
  rationale: Karaniwang pandiwa para sa pagkakita ang ראה; sapat ang payak at natural na salin nang walang dagdag na pagpapakahulugan.
