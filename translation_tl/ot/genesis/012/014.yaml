  text: And when Abram entered Egypt[a], the Egyptians saw that the woman was very beautiful.
translation:
  language: tl
  text: Nang pumasok si Abram sa Egipto, nakita ng mga Egipcio na napakaganda ng babae[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “asawa.” Ang salitang Hebreo na אִשָּׁה ay maaaring mangahulugang “babae” o “asawa”; pinananatili rito ng salin ang mas pangkalahatang pananalita ng sugnay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹא
  choice: Nang pumasok
  rationale: Ang pagkakasunod-sunod ng salaysay at ang temporal na infinitive ay likas na naipapahayag sa modernong Tagalog sa pamamagitan ng “Nang pumasok,” nang hindi na kailangang isalin nang mekanikal ang “at nangyari.”
- source_word: מִצְרָיְמָה
  choice: sa Egipto
  rationale: Ang hulaping paturol sa direksiyon ay naisasama nang natural sa pariralang “pumasok ... sa Egipto.”
- source_word: וַיִּרְאוּ
  choice: nakita
  rationale: Tuwirang katumbas ito ng pandiwang ראה at hindi nagdaragdag ng interpretasyong gaya ng “napansin.”
- source_word: הַמִּצְרִים
  choice: mga Egipcio
  rationale: Karaniwan at malinaw na katawagan sa modernong Tagalog para sa mga taga-Egipto.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Maaaring mangahulugang “babae” o “asawa” ang אִשָּׁה; pinananatili rito ang mas pangkalahatang tawag ng mismong sugnay.
- source_word: כִּי יָפָה הִוא מְאֹד
  choice: na napakaganda
  rationale: Likas na ipinahahayag ng “na” ang nilalaman ng kanilang nakita, samantalang mahusay na tinutumbasan ng “napakaganda” ang matinding antas ng יָפָה ... מְאֹד.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “Egipcio” bilang nakaugaliang katawagan sa Bibliyang Tagalog, at iniwasan ang mas mekanikal na pambungad na “At nangyari.”
