  text: Then Pharaoh gave men orders concerning him[c][b][a], and they sent him away with his wife and all that belonged to him.
translation:
  language: tl
  text: Kaya nag-utos si Faraon sa mga lalaki tungkol kay Abram,[a][b] at pinayaon nila siya kasama ang kanyang asawa at ang lahat ng pag-aari niya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagbigay si Faraon ng mga utos tungkol sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: “Mga lalaki” ang nasa Hebreo. Malamang na mga tauhan o kinatawan sila ng Faraon, ngunit hindi tinukoy ng teksto ang kanilang tungkulin.
    reason: cultural_note
  - marker: c
    text: O “lahat ng mayroon siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: nag-utos
  rationale: Karaniwang kahulugan ng צוה ang mag-utos; natural at tuwiran ito sa modernong Tagalog.
- source_word: עָלָיו
  choice: tungkol kay Abram
  rationale: Ang עַל kasunod ng צוה ay maaaring tumukoy sa taong saklaw ng utos. Ginawang tahasan ang tinutukoy ng panghalip para sa linaw.
- source_word: פַרְעֹה
  choice: ang Faraon
  rationale: Karaniwang anyong Tagalog ng titulong hari ng Ehipto.
- source_word: אֲנָשִׁים
  choice: ilang lalaki
  rationale: Literal na 'mga lalaki' ang Hebreo. Hindi tinukoy kung sila ay mga lingkod, kawal, o opisyal, kaya hindi iyon idinagdag sa teksto.
- source_word: וַיְשַׁלְּחוּ
  choice: pinaalis nila
  rationale: Sa konteksto, ang שלח ay pagpapayaon o pagpapaalis, hindi kinakailangang pormal na paghatid.
- source_word: אֹתוֹ
  choice: siya
  rationale: Tumutukoy kay Abram bilang layon ng pandiwa.
- source_word: אִשְׁתּוֹ
  choice: ang asawa niya
  rationale: Sa kontekstong pangmag-asawa, ito ang natural na salin ng אִשְׁתּוֹ.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: ang lahat ng pag-aari niya
  rationale: Ipinahahayag ng parirala ang lahat ng nasa pagmamay-ari ni Abram; malinaw at likas ito sa Tagalog.
