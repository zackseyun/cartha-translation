  naturalness: Natural at malinaw sa modernong Tagalog ang “nag-utos si Faraon sa mga lalaki tungkol kay Abram” at “pinayaon nila siya.”
  terminology: Ang “Faraon,” “Abram,” at “asawa” ay angkop. Pinananatili ng “mga lalaki” ang di-tiyak na papel ng אֲנָשִׁים.
