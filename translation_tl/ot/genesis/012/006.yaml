  verdict: revise
  source_fidelity: Tapat ang pangunahing salin sa kilos ni Abram, sa saklaw na ‘hanggang,’ sa pook ng Shekem, sa punong kaugnay ng More, at sa kolektibong kahulugan ng katawagang Cananeo. Ang ‘malaking puno’ ay maingat na pinananatili ang kawalang-katiyakan sa eksaktong uri ng puno.
  naturalness: Likas, malinaw, at angkop ang modernong Tagalog na ‘Dumaan si Abram,’ ‘lupain,’ at ‘Nang panahong iyon.’ Ang ‘pook’ ay bahagyang pormal ngunit natural sa ganitong salin ng kasulatan.
  terminology: Wasto at magkakatugma ang Abram, Shekem, More, lupain, at mga Cananeo. Ang alternatibong ensina/terebinto at ang pang-isahang kolektibong anyo ng etniko ay dapat manatiling nasa mga talababa na nakakabit sa tamang salita.
  issues:
  - severity: medium
    issue: Hindi tugma ang mga panandang talababa sa kanilang nilalaman.
    rationale: Ang talababa a ay tumatalakay sa אֵלוֹן, ang malaking puno ng More, ngunit ang [a] ay kasalukuyang nakakabit sa ‘More’ lamang pagkatapos ng pariralang puno at ang [b] naman ay nakakabit sa ‘mga Cananeo’; sa ibinigay na ayos, ang [a] ay sapat na nakakabit sa More/tree phrase, ngunit ang English audit trail ay malinaw na naglalayong iugnay ang lexical note sa tree expression at ang ethnic-number note sa Canaanite expression. Upang maging walang alinlangan ang mga anchor, inilalagay ang [a] kaagad kasunod ng ‘malaking puno ng More’ at pinananatili ang [b] kasunod ng ‘mga Cananeo’.
  revised_text: Dumaan si Abram sa lupain hanggang sa pook ng Shekem, hanggang sa malaking puno ng More.[a] Nang panahong iyon, nasa lupain ang mga Cananeo.[b]
