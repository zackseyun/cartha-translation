  text: וַ/יַּעֲבֹ֤ר אַבְרָם֙ בָּ/אָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְ/הַֽ/כְּנַעֲנִ֖י אָ֥ז בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
translation:
  language: tl
  text: Dumaan si Abram sa lupain hanggang sa pook ng Shekem, hanggang sa malaking puno ng More.[a] Nang panahong iyon, nasa lupain ang mga Cananeo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ensina ng More” o “terebinto ng More.” Tumutukoy ang salitang Hebreo sa isang malaking puno, ngunit hindi tiyak ang eksaktong uri nito.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, pang-isahan ang katawagan: “ang Cananeo ay naroon noon sa lupain,” ngunit maaari itong gamitin bilang kolektibong tawag sa mga Cananeo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: Dumaan
  rationale: Ipinahihiwatig ng pandiwang mula sa עבר ang pagdaan o pagtahak ni Abram sa lupain, nang hindi nagdaragdag ng tiyak na ruta o paraan ng paglalakbay.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Tumutukoy ito sa lupaing tinatalakay sa konteksto, ang Canaan; likas at marangal sa modernong Tagalog ang “lupain.”
- source_word: עַד מְקוֹם שְׁכֶם
  choice: hanggang sa pook ng Shekem
  rationale: Pinananatili ng “hanggang” ang saklaw na ipinahahayag ng עַד, at ng “pook ng Shekem” ang ugnayan ng karaniwang pangngalang מְקוֹם sa pangalang Shekem nang hindi ipinapalagay na ganap nang maunlad na lunsod iyon.
- source_word: אֵלוֹן מוֹרֶה
  choice: malaking puno ng More
  rationale: Ang אֵלוֹן ay tumutukoy sa isang malaking puno, ngunit hindi tiyak ang eksaktong uri nito. Iniiwasan ng pangunahing salin ang di-tiyak na pagtukoy sa ensina o terebinto, samantalang pinananatiling pantanging pangalan ang More.
- source_word: וְהַכְּנַעֲנִי
  choice: ang mga Cananeo
  rationale: Bagaman pang-isahan ang anyong Hebreo, karaniwan itong gumaganap bilang kolektibong katawagan sa isang pangkat. Mas natural at malinaw sa Tagalog ang pangmaramihang “mga Cananeo,” habang itinatala sa talababa ang anyong pang-isahan.
- source_word: אָז
  choice: Nang panahong iyon
  rationale: Malinaw at natural nitong ipinahahayag ang kalagayang umiiral sa panahong iyon sa salaysay.
theological_decisions:
- issue: Bilang ng katawagang etniko sa וְהַכְּנַעֲנִי
  choice: 'Pangmaramihang kolektibo: “ang mga Cananeo”'
  alternative: 'Pang-isahang kolektibo: “ang Cananeo”'
  rationale: Pang-isahan ang anyong Hebreo ngunit maaari itong tumukoy nang kolektibo sa buong pangkat. Pinili ang natural na pangmaramihan sa Tagalog at pinanatili sa talababa ang pormal na alternatibo; walang doktrinal na pagpapasya na idinaragdag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignipikado, at madaling maunawaan. Ginamit ang “pook” at “lupain” upang mapanatili ang pormal na himig nang hindi nagiging lipas; pinili ang “malaking puno” upang hindi pagpasiyahan ang hindi tiyak na uri ng punong tinutukoy.
