  text: And I will bless those who bless you[a], and the one who curses you I will curse[c][b]; and in you all the families of the earth will be blessed.
translation:
  language: tl
  text: At pagpapalain ko ang mga nagpapala sa iyo, at susumpain ko ang sinumang humahamak sa iyo.[a] At sa iyo ay pagpapalain ang lahat ng angkan sa lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang sinumang lumalait sa iyo” o “ang sinumang sumusumpa sa iyo.” Ang pandiwang Hebreo rito (קלל) ay maaaring mangahulugang ituring na mababa, lapastanganin, o sumpain, at mas mahina ito kaysa sa kasunod na pandiwang isinaling “susumpain” (ארר).
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang lahat ng angkan sa lupa ay magpapala sa kanilang sarili sa iyo,” o “sa pamamagitan mo ay pagpapalain ang lahat ng angkan sa lupa.” Maaaring unawain ang anyong Hebreo bilang pasibo o reflexive/middle, at maaari ring magkaroon ng instrumental na diwa ang pang-ukol.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲבָרֲכָה
  choice: At pagpapalain ko
  rationale: Tuwirang ipinahahayag ang pangako ng Diyos sa natural na makabagong Tagalog.
- source_word: מְבָרְכֶיךָ
  choice: ang mga nagpapala sa iyo
  rationale: Pinananatili ang substantibong gamit ng participle at ang maramihang bilang.
- source_word: וּמְקַלֶּלְךָ
  choice: ang sinumang humahamak sa iyo
  rationale: Ipinahahayag ng humahamak ang diwang ituring na mababa o walang halaga, at pinananatili ang pagkakaiba nito sa mas mabigat na אָאֹר. Ang 'sinuman' ay natural na Tagalog para sa pangkalahatang isahan.
- source_word: אָאֹר
  choice: susumpain ko
  rationale: Malinaw na katumbas ng mas malakas na pandiwa para sa pagsumpa at pinananatili ang pag-igting mula sa kilos ng tao tungo sa tugon ng Diyos.
- source_word: וְנִבְרְכוּ
  choice: ay pagpapalain
  rationale: Pinipili ang natural na pasibong pagbasa ng Niphal habang inilalagay sa talababa ang posibleng reflexive o middle na diwa.
- source_word: בְּךָ
  choice: sa iyo
  rationale: Pinananatili ang pinakadirektang katumbas ng pang-ukol; ang posibleng instrumental na diwang 'sa pamamagitan mo' ay nasa talababa.
- source_word: כֹּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: ang lahat ng angkan sa lupa
  rationale: Ang 'angkan' ay angkop sa mga pangkat na magkakamag-anak, at ang 'lupa' ay likas na katumbas ng אֲדָמָה habang sa konteksto ay naghahatid ng pandaigdig na saklaw.
theological_decisions:
- issue: Kahulugan ng pormulang וְנִבְרְכוּ בְךָ sa pangako kay Abraham
  choice: 'pasibo: ''sa iyo ay pagpapalain'''
  alternative: 'reflexive/middle: ''sa iyo ay pagpapalain ng lahat ng angkan sa lupa ang kanilang sarili''; instrumental: ''sa pamamagitan mo ay pagpapalain ang lahat ng angkan sa lupa'''
  rationale: Pinananatili sa pangunahing teksto ang tuwirang pasibong pagbasa, ngunit hindi ikinukubli ang pagtatalo tungkol sa reflexive/middle na diwa ng Niphal at instrumental na gamit ng pang-ukol.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'angkan' sa halip na mas teknikal na 'lipi' o mas makitid na 'pamilya.' Ang 'humahamak' ay natural na naghahatid ng pagpapawalang-halaga at pinananatili ang leksikal na pagkakaiba ng dalawang pandiwang Hebreo.
