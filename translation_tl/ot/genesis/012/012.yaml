base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/012.yaml
  text: And it will be that when the Egyptians see you[a], they will say, ‘This is his wife,’ and they will kill me[b], but they will let you live.
translation:
  language: tl
  text: At kapag nakita ka ng mga Ehipsiyo, sasabihin nila, “Asawa niya ang babaeng ito.” Papatayin nila ako, ngunit hahayaan ka nilang mabuhay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At kapag
  rationale: Natural na ipinahahayag sa Tagalog ang inaasahang pangyayari at ang temporal na ugnayan; hindi na kailangang gawing mabigat ang panimula sa pagsasabing “At mangyayari na kapag.”
- source_word: יִרְאוּ אֹתָךְ
  choice: nakita ka
  rationale: Karaniwang diwa ng ראה ang “makita”; ang aspektong kontemplatibo sa Tagalog ay angkop sa pangyayaring inaasahan ni Abram.
- source_word: הַמִּצְרִים
  choice: mga Ehipsiyo
  rationale: Karaniwan at malinaw na katawagan sa pangkat-etniko; likas nang tiyak sa konteksto kahit walang hiwalay na katumbas ng artikulong Hebreo.
- source_word: וְאָמְרוּ
  choice: sasabihin nila
  rationale: Tuwirang isinasalin ang pandiwa ng pagsasalita at pinananatili ang hinaharap na pananaw.
- source_word: אִשְׁתּוֹ זֹאת
  choice: Asawa niya ang babaeng ito
  rationale: Pinananatili ang demonstratibong diin ng זֹאת at malinaw na inilalahad ang nominal na sugnay sa natural na ayos ng Tagalog.
- source_word: וְהָרְגוּ אֹתִי
  choice: Papatayin nila ako
  rationale: Direkta at karaniwang katumbas ng הרג sa kontekstong ito.
- source_word: וְאֹתָךְ יְחַיּוּ
  choice: ngunit hahayaan ka nilang mabuhay
  rationale: Ang Hiphil ng חיה ay nangangahulugang hayaang mabuhay o panatilihing buhay; ipinakikita ng “ngunit” ang malinaw na pagsalungat sa pagpatay kay Abram.
