base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/008.yaml
  text: From there he moved to the hill country east of Bethel and pitched his tent[a], with Bethel on the west and Ai on the east[b]. There he built an altar to Yahweh and called on the name of Yahweh.
translation:
  language: tl
  text: Mula roon, lumipat siya sa maburol na lupain sa silangan ng Bethel at naglatag ng kanyang tolda, na nasa kanluran ang Bethel at nasa silangan ang Ai. Doon siya nagtayo ng altar para kay Yahweh[b] at tumawag sa pangalan ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipinahayag ang pangalan ni Yahweh.” Maaaring mangahulugan ang pananalitang Hebreo ng pagtawag kay Yahweh sa pagsamba o ng hayagang pagpapahayag ng kanyang pangalan.
    reason: alternative_reading
  - marker: b
    text: Hebreo YHWH, ang personal na pangalan ng Diyos; tradisyonal na isinasaling “PANGINOON.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְתֵּק
  choice: lumipat siya
  rationale: Ipinahahayag ng pandiwa ang pag-alis at paglipat sa ibang lugar; natural at tuwiran ang “lumipat” sa makabagong Filipino.
- source_word: הָהָרָה מִקֶּדֶם לְבֵית אֵל
  choice: sa kabundukan sa silangan ng Bethel
  rationale: Ang hulaping patungo sa הָהָרָה ay nagpapahiwatig ng pagkilos patungo sa mataas na lupain, at ang מִקֶּדֶם ay tumutukoy sa lokasyong nasa silangan ng Bethel.
- source_word: וַיֵּט אָהֳלֹה
  choice: itinayo ang kanyang tolda
  rationale: Likas na katumbas ito ng idyomang Hebreo para sa paglalatag o pagtatayo ng tolda.
- source_word: מִיָּם
  choice: nasa kanluran
  rationale: Bagaman literal na maaaring tumukoy ang יָם sa dagat, ginagamit ito rito bilang heograpikong direksiyon na “kanluran.”
- source_word: וְהָעַי מִקֶּדֶם
  choice: ang Ai naman ay nasa silangan
  rationale: Malinaw nitong inilalarawan na nasa pagitan ng Bethel sa kanluran at Ai sa silangan ang kampo.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Karaniwan at madaling maunawaang salitang Filipino para sa estrukturang ginagamit sa paghahandog at pagsamba.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: tumawag sa pangalan ni Yahweh
  rationale: Pinananatili nito ang idyomang Hebreo at ang pangunahing diwa ng pagtawag kay Yahweh sa pagsamba, nang hindi ganap na isinasara ang posibleng diwa ng hayagang pagpapahayag.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; ang “Yahweh” ay mas malinaw na kumakatawan sa personal na pangalan kaysa sa isang pamalit na titulo.
- issue: Kahulugan ng וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: tumawag sa pangalan ni Yahweh
  alternative: ipinahayag ang pangalan ni Yahweh
  rationale: Sa konteksto ng altar, malamang na pagsamba at pananalangin ang agarang diwa, ngunit maaari ring tumukoy ang parirala sa hayagang pagpapahayag; pinananatili sa talababa ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “kabundukan” bilang madaling maunawaang heograpikong paglalarawan, at pinanatili ang pormulang “tumawag sa pangalan” upang hindi patahimikin ang ambiguwidad ng Hebreo.
