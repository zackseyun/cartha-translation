  yaml_path: translation/ot/genesis/012/019.yaml
  text: Why did you say[a], ‘She is my sister,’ and I took her to be my wife? And now, here is your wife[c][b]. Take her and go.”
translation:
  language: tl
  text: Bakit mo sinabi, ‘Kapatid kong babae siya,’ at kinuha ko siya bilang asawa ko? Ngayon, narito ang asawa mo. Kunin mo siya at umalis ka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָה
  choice: Bakit
  rationale: Likas at tuwirang tanong sa dahilan o motibo sa makabagong Tagalog.
- source_word: אָמַרְתָּ
  choice: mo sinabi
  rationale: Ang aspektong naganap ay angkop sa salaysay at natural kasunod ng “Bakit.”
- source_word: אֲחֹתִי הִוא
  choice: Kapatid ko siya
  rationale: Pinananatili ang tuwirang sipi at ang walang-tiyak-na-kasariang salitang Tagalog na “kapatid,” gaya ng konteksto.
- source_word: וָאֶקַּח
  choice: kaya kinuha ko siya
  rationale: Ipinahihiwatig ng waw sa konteksto ang bunga ng sinabi ni Abram; ang “kaya” ay mas natural kaysa payak na “at” at hindi nagpapahiwatig ng layunin.
- source_word: לִי לְאִשָּׁה
  choice: upang maging asawa ko
  rationale: Natural na Tagalog para sa pagkuha sa isang babae bilang sariling asawa; naipahahayag ng “ko” ang personal na kaugnayang nasa לִי.
- source_word: וְעַתָּה
  choice: Ngayon
  rationale: Malinaw na paglipat mula sa pagsaway tungo sa utos; hindi kailangan ang panimulang “At” sa natural na Tagalog.
- source_word: הִנֵּה אִשְׁתְּךָ
  choice: narito ang asawa mo
  rationale: Ang “narito” ay natural at sapat upang ihatid ang pantawag-pansing at panturong lakas ng הִנֵּה.
- source_word: קַח
  choice: Isama mo siya
  rationale: Sa konteksto ng pagpapauwi kay Sarai, mas natural sa Tagalog ang “isama” kaysa literal na “kunin,” habang malinaw na tumutukoy sa pag-alis na kasama siya.
- source_word: וָלֵךְ
  choice: at umalis ka
  rationale: Pinananatili ang ikalawang pautos at ang pagkakasunod nito nang hindi nagdaragdag ng tindi gaya ng “lumayas.”
theological_decisions:
- issue: Ugnayan ng sinabi ni Abram at ng pagkuha ni Faraon kay Sarai
  choice: kaya kinuha ko siya
  alternative: at kinuha ko siya
  rationale: Ipinakikita ng konteksto na iniuugnay ni Faraon ang kilos niya sa sinabi ni Abram. Ang “kaya” ay naghahayag ng bunga, ngunit hindi ginagawang layunin ang pagkuha.
translation_notes:
  register: Makabagong, dignified, at madaling maunawaang Filipino. Ginamit ang “kapatid” sa sipi dahil natural ito at hindi kailangang ulitin ang kasarian na malinaw na sa panghalip na “siya.” Ang “Isama mo siya” ay kontekstuwal na katumbas ng pautos na “kunin” kasunod ng “umalis.”
