  yaml_path: translation/ot/genesis/012/009.yaml
  text: And Abram journeyed on[b][a], going toward the Negev.
translation:
  language: tl
  text: At nagpatuloy sa paglalakbay si Abram patungong Negev.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patimog.” Maaaring tumukoy ang salitang Hebreo sa katimugang rehiyong tinatawag na Negev o sa direksiyong timog, bagaman malamang na rehiyon ang tinutukoy rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: nagpatuloy sa paglalakbay
  rationale: Ang qal wayyiqtol ng נסע ay tumutukoy rito sa pagpapatuloy ng paglalakbay, na maaaring may kasamang pag-alis ng kampo. Likas sa makabagong Tagalog ang pariralang ito at hindi nito labis na tinutukoy ang mekanika ng pagkakampo.
- source_word: אַבְרָם
  choice: Abram
  rationale: Pinanatili ang karaniwang transliterasyon ng pangalang Hebreo.
- source_word: הָלוֹךְ וְנָסוֹעַ
  choice: nagpatuloy sa paglalakbay
  rationale: Ang tambalang infinitive absolute ay nagpapahayag ng tuloy-tuloy o pasulong na pagkilos. Isinama ang diwang ito sa pangunahing pandiwa upang maging natural at maiwasan ang paulit-ulit na pananalita sa Tagalog.
- source_word: הַנֶּגְבָּה
  choice: patungong Negev
  rationale: Maaaring tumukoy ang נֶגֶב sa rehiyong Negev o sa direksiyong timog. Dahil may tiyak na pantukoy at directional he, malamang na heograpikong rehiyon ang tinutukoy dito; ipinahahayag ng “patungo” ang direksiyon nang hindi ipinahihiwatig na nakarating na siya roon.
