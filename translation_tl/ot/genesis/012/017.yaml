- from: Ngunit pinahirapan ni Yahweh ang Faraon at ang sambahayan nito sa pamamagitan ng matitinding salot dahil kay Sarai, na asawa ni Abram.[a]
  to: Ngunit pinahirapan ni Yahweh ang Faraon at ang kanyang sambahayan ng matitinding salot dahil kay Sarai, na asawa ni Abram.[a]
  rationale: Pinalitan ang instrumental na “sa pamamagitan ng” ng tuwirang “ng” upang masaklaw nang wasto ang ugnayan ng pandiwa at ng “matitinding salot” sa Hebreo. Ginawang “kanyang sambahayan” ang pantukoy para sa mas likas na modernong Filipino. Kinumpleto ang saling-palit sa footnote upang hindi maalis ang “na asawa ni Abram.”
