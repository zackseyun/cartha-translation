  naturalness: Makabago at marangal ang rehistro. Mas natural at mas malapit sa konstruksiyong Hebreo ang “ng matitinding salot” kaysa “sa pamamagitan ng matitinding salot.” Ang “kanyang sambahayan” ay mas likas ding pantukoy sa Faraon kaysa “sambahayan nito.”
  terminology: Wasto ang “Yahweh,” “Faraon,” “sambahayan,” “salot,” at “Sarai, na asawa ni Abram.” Dapat panatilihin ng lexical footnote ang pagkakakilanlan kay Sarai bilang asawa ni Abram, na bahagi ng pinagmumulan.
