  yaml_path: translation/ot/genesis/012/017.yaml
  text: But Yahweh afflicted Pharaoh and his household with severe plagues because of Sarai[a], Abram’s wife.
translation:
  language: tl
  text: Ngunit pinahirapan ni Yahweh ang Faraon at ang kanyang sambahayan ng matitinding salot dahil kay Sarai, na asawa ni Abram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ngunit hinampas ni Yahweh ang Faraon at ang kanyang sambahayan ng matitinding kapighatian dahil kay Sarai, na asawa ni Abram.” Gumagamit ang Hebreo ng magkaugnay na pandiwa at pangngalan na maaaring mangahulugang “hinampas” o “pinahirapan” at “mga kapighatian” o “mga salot.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַגַּע
  choice: pinahirapan
  rationale: Ang pandiwang נגע ay maaaring mangahulugang humipo o humampas, ngunit sa sanhiang anyo at kasama ng נְגָעִים, tumutukoy ito sa pagpaparanas ng matinding kapahamakan. Likas sa Filipino ang “pinahirapan” at iniiwasan nito ang alanganing pag-uulit ng “sinalot ... ng mga salot.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: פַּרְעֹה
  choice: Faraon
  rationale: Ito ang nakasanayang anyong Filipino ng titulong maharlika sa Ehipto.
- source_word: נְגָעִים גְּדֹלִים
  choice: matitinding salot
  rationale: Ang נְגָעִים ay maaaring tumukoy sa mga hampas, kapighatian, o salot; sa konteksto ng salaysay, malinaw at natural ang “mga salot.” Ipinahahayag ng “matitindi” ang nagpapalakas na diwa ng גְּדֹלִים.
- source_word: וְאֶת בֵּיתוֹ
  choice: at ang sambahayan nito
  rationale: Ang בֵּיתוֹ ay hindi lamang gusali kundi maaaring tumukoy sa mga taong saklaw ng tahanan ng Faraon. Ang “sambahayan” ang pinakatumpak na likas na katumbas; “nito” ang malinaw na tumutukoy sa Faraon bilang titulo.
- source_word: עַל דְּבַר
  choice: dahil kay
  rationale: Sa talatang ito, ipinakikita ng parirala ang dahilan o sanhing kaugnay ni Sarai. Ang “dahil kay” ay tuwiran at natural, habang hindi tinutukoy nang higit sa sinasabi ng Hebreo kung ano mismo ang papel ni Sarai.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: Sarai, na asawa ni Abram
  rationale: Pinananatili ng pariralang paningit ang pagkakakilanlan kay Sarai bilang asawa ni Abram, na mahalaga sa sanhi ng parusa.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pinananatili ang pangalan sa anyong transliterado upang huwag palitan ng titulo ang personal na pangalang nasa tekstong Hebreo.
- issue: Kung si Sarai ba ang may kasalanan o siya ang dahilan ng paghatol
  choice: dahil kay Sarai
  alternative: dahil sa nangyari kay Sarai / dahil sa usapin tungkol kay Sarai
  rationale: Ang עַל דְּבַר ay nagbibigay ng sanhi ngunit hindi lubos na nililinaw kung ang tinutukoy ay si Sarai mismo, ang pagkuha sa kaniya, o ang usaping may kaugnayan sa kaniya. Pinananatili ng payak na “dahil kay Sarai” ang ikli at bahagyang kalabuan ng Hebreo nang hindi ipinaparatang sa kaniya ang kasalanan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” upang tukuyin ang mga taong nasa tahanan o sambahayan ng Faraon, hindi lamang ang gusali. Inilagay ang footnote marker [a] matapos ang buong pangungusap sapagkat ipinapaliwanag nito ang magkatuwang na pandiwa at pangngalan sa pangunahing sugnay.
