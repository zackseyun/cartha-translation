  verdict: revise
  source_fidelity: Tumpak ang pagsasalin ng pagpapakita ni Yahweh kay Abram, ng pangako tungkol sa lupain, ng kolektibong-isahang «binhi», at ng altar na itinayo para kay Yahweh. Gayunman, ang «Kaya» ay maaaring magpahiwatig na ang pagtatayo ng altar ay lohikal o sanhi-bungang resulta ng sinabi ni Yahweh, samantalang ang Hebreo ay pangunahing nagsusunod lamang ng pangyayari sa pamamagitan ng wayyiqtol.
  naturalness: Natural at marangal ang karamihan ng salin. Mas neutral at mas malapit sa daloy ng salaysay ang «At nagtayo siya roon ng altar» kaysa «Kaya nagtayo siya roon ng altar».
  terminology: Ang «Yahweh» ay pare-pareho at angkop para sa יהוה. Ang «binhi» ay leksikally tapat at pinananatili ang isahan ngunit kolektibong saklaw ng זרע; ang tala ay sapat na nagpapaliwanag ng mas natural na alternatibong «supling». Ang «altar» at «lupain» ay angkop sa rehistro at konteksto.
  issues:
