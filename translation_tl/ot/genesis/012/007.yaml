  text: וַ/יֵּרָ֤א יְהוָה֙ אֶל אַבְרָ֔ם וַ/יֹּ֕אמֶר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה הַ/נִּרְאֶ֥ה אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/007.yaml
  text: Then Yahweh appeared to Abram and said[a], “To your offspring I will give this land.” So there he built an altar to Yahweh, who had appeared to him.
translation:
  language: tl
  text: Nagpakita si Yahweh kay Abram at sinabi, “Sa iyong binhi[a] ko ibibigay ang lupaing ito.” At nagtayo siya roon ng altar para kay Yahweh, na nagpakita sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “supling.” Isahan ang anyo ng salitang Hebreo ngunit maaari itong gamitin nang kolektibo para sa mga inapo bilang isang pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיֵּרָא
  choice: nagpakita
  rationale: Likas at tuwirang ipinahahayag nito ang nakikitang pagpapahayag ni Yahweh kay Abram.
- source_word: לְזַרְעֲךָ
  choice: sa iyong binhi
  rationale: Pinananatili ng “binhi” ang anyong isahan at ang maaaring kolektibong diwa ng Hebreo, sa halip na agad itong limitahan sa tahasang maramihang “mga inapo.”
- source_word: אֶתֵּן
  choice: ko ibibigay
  rationale: Ipinahahayag ng pandiwa ang pangako tungkol sa hinaharap; pinananatili rin ng ayos ng pangungusap ang diin sa tatanggap.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ang lupaing ito
  rationale: Ang “lupain” ang natural na salita sa konteksto ng pangakong teritoryal at hindi kasing politikal ng “bansa.”
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Kaya nagtayo siya roon ng altar
  rationale: Ipinakikita ng “Kaya” ang kasunod na tugon ni Abram, habang malinaw na pinananatili ng “roon” ang lokasyon.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Natural nitong ipinahahayag sa Filipino na ang altar ay itinayo at itinalaga kay Yahweh.
- source_word: הַנִּרְאֶה אֵלָיו
  choice: na nagpakita sa kanya
  rationale: Pinananatili ang panuring na kumikilala kay Yahweh bilang siyang nagpakita kay Abram nang hindi nagdaragdag ng paliwanag.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito sa transliterasyon sa halip na palitan ng titulo.
- issue: Isahan ngunit kolektibong kahulugan ng זֶרַע
  choice: binhi
  alternative: supling; mga inapo
  rationale: 'Pinananatili ng “binhi” ang tunay na tensiyon ng tekstong Hebreo: isahan ang anyo ngunit maaari itong tumukoy nang kolektibo sa mga inapo.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “altar,” na karaniwan at madaling maunawaan, at pinanatili ang “binhi” upang huwag alisin ang leksikal at teolohikal na ambiguwidad ng orihinal.
