base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/016.yaml
  text: And he treated Abram well because of her[a], and he came to have sheep and cattle and male donkeys and male servants and female servants and female donkeys and camels.
translation:
  language: tl
  text: Pinakitunguhan niya nang mabuti si Abram dahil sa kanya[a]. At nagkaroon si Abram ng mga tupa, baka, lalaking asno, aliping lalaki, aliping babae, babaeng asno, at kamelyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alang-alang sa kanya.” Maaaring isalin sa alinman sa dalawang paraan ang pananalitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיב
  choice: pinakitunguhan … nang mabuti
  rationale: Likas at malinaw na Filipino para sa Hiphil na nangangahulugang gumawa ng mabuti sa isang tao o pakitunguhan siya nang pabor.
- source_word: בַּעֲבוּרָהּ
  choice: dahil sa kanya
  rationale: Pinananatili ang sanhi o pagkakataong ipinahihiwatig ng parirala nang hindi ipinapalagay na ang kilos ay sadyang para sa kapakinabangan ng babae.
- source_word: וַיְהִי לוֹ
  choice: nagkaroon si Abram
  rationale: Ipinahahayag ang nagresultang pag-aari; inulit ang pangalang Abram upang maiwasang mapagkamalang ang naunang paksa ang nagkaroon ng mga ari-arian.
- source_word: צֹאן
  choice: mga tupa
  rationale: Karaniwan at madaling maunawaang katumbas sa talaan ng mga alagang hayop, bagaman maaaring mas malawak ang Hebreo at tumukoy sa maliliit na hayop ng kawan.
- source_word: בָקָר
  choice: baka
  rationale: Natural na kolektibong katawagan sa mga bovine sa modernong Filipino.
- source_word: חֲמֹרִים
  choice: lalaking asno
  rationale: Pinananatili ang panlalaking anyo at ang kaibahan nito sa kasunod na אֲתֹנֹת.
- source_word: עֲבָדִים
  choice: aliping lalaki
  rationale: Sa talaan ng mga pag-aari, malinaw na ipinahahayag ng 'alipin' ang nakagapos na katayuan; pinananatili rin ang kasarian ng pangngalan.
- source_word: שְׁפָחֹת
  choice: aliping babae
  rationale: Tumpak na inilalarawan ang mga babaeng alipin at pinananatili ang kaibahan sa naunang panlalaking pangkat.
- source_word: אֲתֹנֹת
  choice: babaeng asno
  rationale: Pinananatili ang tiyak na pambabaeng kahulugan at ang kaibahan sa חֲמֹרִים.
- source_word: גְמַלִּים
  choice: kamelyo
  rationale: Karaniwang katumbas sa Filipino ng pangmaramihang pangngalang Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na tuwiran at marangal. Ginamit ang “alipin” sa halip na “lingkod” dahil kabilang ang mga tao sa talaan ng mga ari-arian at mahalagang huwag pagaanin ang katayuang ipinahihiwatig ng konteksto. Iningatan ang pagkakaiba ng lalaki at babaeng asno at ng aliping lalaki at babae.
