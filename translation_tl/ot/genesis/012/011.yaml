  text: And it happened[a], as he was about to enter Egypt, that he said to Sarai his wife, “Look now[b], I know that you are a woman beautiful in appearance.”
translation:
  language: tl
  text: Nang malapit na siyang pumasok sa Ehipto, sinabi niya sa asawa niyang si Sarai, “Tingnan mo, alam kong maganda kang babae.[a]”
  philosophy: optimal-equivalence
  footnotes:
