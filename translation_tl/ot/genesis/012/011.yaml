  source_fidelity: Ang temporal na “Nang malapit na siyang pumasok sa Ehipto” ay tapat sa כַּאֲשֶׁר הִקְרִיב לָבוֹא. Gayunman, ganap na nawawala ang panghimok na הִנֵּה נָא; dapat itong katawanin sa salin. Ang “napakaganda” ay mas matindi kaysa sa יְפַת מַרְאֶה, na nagsasabing maganda ang anyo/kaanyuan.
  naturalness: Natural at malinaw sa modernong Tagalog ang binagong pananalita. Ang “Tingnan mo” ay gumaganap bilang pangtawag-pansin sa loob ng tuwirang pananalita, hindi bilang mahigpit na utos na tumingin.
  terminology: Ang “Ehipto,” “Sarai,” at “asawa niyang si Sarai” ay angkop. Ang “maganda kang babae” ay mas maingat kaysa “napakaganda mong babae” at pinananatili ng talababa ang pokus sa nakikitang anyo.
