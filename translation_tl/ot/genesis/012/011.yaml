    text: O “babaeng magandang pagmasdan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Ang karaniwang Hebreong pormulang pasalaysay ay likas na naipahahayag sa Tagalog sa pamamagitan ng sugnay na temporal; napapanatili nito ang pagkakasunod ng pangyayari nang hindi nagiging mabigat o makaluma.
- source_word: הִקְרִיב לָבוֹא
  choice: malapit na siyang pumasok
  rationale: Ipinahahayag ng Hiphil ng קרב kasama ang pawatas na בוא ang nalalapit na pagpasok; natural at malinaw ito sa modernong Tagalog.
- source_word: מִצְרָיְמָה
  choice: sa Ehipto
  rationale: Ang hulaping paturol sa direksiyon ay ipinahahayag ng pariralang 'pumasok sa Ehipto.'
- source_word: וַיֹּאמֶר אֶל שָׂרַי אִשְׁתּוֹ
  choice: sinabi niya sa asawa niyang si Sarai
  rationale: Natural na ayos sa Tagalog na pinananatili kapwa ang pangalan at ang pagkakakilanlan kay Sarai bilang asawa niya.
- source_word: הִנֵּה נָא
  choice: hindi isinalin nang hiwalay
  rationale: Sa kontekstong ito, ang pinagsamang pantawag-pansin at panandang pagpapalambot o pagdiriin ay likas na nadadala ng tuwirang pananalita sa Tagalog; ang literal na 'Tingnan mo ngayon' ay maaaring magmukhang utos na tumingin.
- source_word: יָדַעְתִּי כִּי
  choice: Alam kong
  rationale: Ang perpektong anyo ng ידע ay nagsasaad ng kasalukuyang kalagayan ng pagkaalam, at ang enclitic na '-ng' ay natural na nagpapakilala sa nilalaman nito.
- source_word: אִשָּׁה יְפַת מַרְאֶה אָתְּ
  choice: napakaganda mong babae
  rationale: Ipinahahayag nang natural ang predikasyon at ang nakikitang kagandahan ni Sarai. Ang kahulugang nakatuon sa anyo ay nililinaw sa talababa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit pangkaraniwan. Ginawang natural ang Hebreong pormulang pasalaysay sa pamamagitan ng sugnay na temporal, at iniwasan ang artipisyal na literalismo sa הִנֵּה נָא. Ang talababa ay nagpapanatili sa mas tahasang diwa ng יְפַת מַרְאֶה.
