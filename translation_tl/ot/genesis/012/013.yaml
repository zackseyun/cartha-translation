  yaml_path: translation/ot/genesis/012/013.yaml
  text: Please say that you are my sister[a], so that it may go well with me because of you[b], and my life may be spared on your account.
translation:
  language: tl
  text: Pakisabi na ikaw ay kapatid kong babae, upang maging maayos ang kalagayan ko dahil sa iyo, at manatili akong buhay dahil sa iyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “at mabuhay ang aking kaluluwa dahil sa iyo.” Dito, ang “kaluluwa” (nefesh) ay idyoma para sa buhay o sarili ni Abram. Ang dalawang pananalitang “dahil sa iyo” ay magkalapit ang kahulugan at kapuwa nagdiriin na inaasahan ni Abram na magmumula sa ipinakikilalang kaugnayan ni Sarai sa kaniya ang mabuting pakikitungo at kaligtasan niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: Pakisabi
  rationale: Ang pambabaeng pang-isahang pautos na אִמְרִי kasama ng נָא ay isang magalang ngunit apurahang pakiusap. Likas at malinaw sa modernong Tagalog ang “Pakisabi.”
- source_word: אֲחֹתִי אָתְּ
  choice: na ikaw ay kapatid kong babae
  rationale: Tuwirang ipinakikilala si Sarai bilang kapatid na babae ni Abram. Nililinaw ng “babae” ang kasarian na tahasang nasa salitang Hebreo אֲחוֹת.
- source_word: לְמַעַן
  choice: upang
  rationale: Ipinahahayag nito ang layunin o inaasahang resulta; maikli, marangal, at likas sa Tagalog ang “upang.”
- source_word: יִיטַב לִי
  choice: mapabuti ang kalagayan ko
  rationale: Ang idyomang mula sa יטב ay nangangahulugang maging mabuti o maging maayos para kay Abram. Pinananatili ng salin ang malawak na diwa nang hindi nililimitahan sa isang partikular na uri ng mabuting pakikitungo.
- source_word: בַּעֲבוּרֵךְ
  choice: dahil sa iyo
  rationale: 'Nagpapahayag ito ng sanhi o batayan: inaasahan ni Abram na bubuti ang kaniyang kalagayan dahil kay Sarai.'
- source_word: וְחָיְתָה נַפְשִׁי
  choice: at manatili akong buhay
  rationale: Literal na “at mabuhay ang aking nephesh.” Sa konteksto, ang נֶפֶשׁ ay tumutukoy sa buhay o sarili ni Abram, kaya natural na ipinahahayag ito bilang pananatiling buhay.
- source_word: בִּגְלָלֵךְ
  choice: alang-alang sa iyo
  rationale: Ikalawang malapit na magkaugnay na pananalitang sanhi sa talata. Ang “alang-alang sa iyo” ay nagpapanatili sa pag-uulit nang hindi eksaktong inuulit ang “dahil sa iyo.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal. Ginamit ang “Pakisabi” para sa pakiusap, at iniwasan ang sobrang literal na “mabuhay ang aking kaluluwa,” na maaaring magpahiwatig ng kahulugang wala sa konteksto. Pinanatili ang dalawang magkaugnay ngunit hindi eksaktong magkaparehong pariralang sanhi.
