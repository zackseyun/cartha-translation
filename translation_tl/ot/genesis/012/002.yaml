  text: וְ/אֶֽעֶשְׂ/ךָ֙ לְ/ג֣וֹי גָּד֔וֹל וַ/אֲבָ֣רֶכְ/ךָ֔ וַ/אֲגַדְּלָ֖ה שְׁמֶ֑/ךָ וֶ/הְיֵ֖ה בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/002.yaml
  text: And I will make you into a great nation[a], and I will bless you, and I will make your name great[b], and be a blessing.
translation:
  language: tl
  text: Gagawin kitang isang dakilang bansa, pagpapalain kita, at gagawin kong dakila ang iyong pangalan; at maging pagpapala ka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at ikaw ay magiging pagpapala.” Pautos (“maging”) ang anyong Hebreo, ngunit maaaring unawain ito bilang bunga ng mga pangako ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶעֶשְׂךָ
  choice: Gagawin kita
  rationale: Ang עשה na may hulaping tumutukoy kay Abram ay nangangahulugang bubuuin o itatatag siya ng Diyos bilang isang bagay; natural sa Tagalog ang hulma na “Gagawin kitang…” kasama ng kasunod na panaguring pangngalan.
- source_word: לְגוֹי גָּדוֹל
  choice: isang dakilang bansa
  rationale: Ang גוי ay tumutukoy sa isang bansa o pangkat ng mga tao. Ang “bansa” ang malinaw at angkop na salita sa konteksto ng pangako sa mga patriyarka, habang ang “dakila” ay nagpapanatili sa lawak ng גָּדוֹל.
- source_word: וַאֲבָרֶכְךָ
  choice: pagpapalain kita
  rationale: Tuwirang ipinapahayag ng anyong Piel ng ברך ang pagkilos na “pagpalain,” at pinananatili ng “kita” na si Abram mismo ang tuwirang tatanggap ng pagpapala.
- source_word: וַאֲגַדְּלָה שְׁמֶךָ
  choice: gagawin kong dakila ang iyong pangalan
  rationale: Pinananatili ng “pangalan” ang tahasang שֵׁם at ang biblikal na diwa nito, sa halip na paliitin ito sa “reputasyon” lamang. Ang “gagawin kong dakila” ay malapit sa causative na kahulugan ng גדל.
- source_word: וֶהְיֵה
  choice: at maging … ka
  rationale: Ito ay pautos na anyo, ikalawang panauhang panlalaki na isahan, ng היה. Ang “maging … ka” ay nagpapanatili sa pautos na lakas nito at sa biglang paglipat mula sa mga pangako ng Diyos tungo sa tungkulin ni Abram.
- source_word: בְּרָכָה
  choice: pagpapala
  rationale: Ang pangngalan ay isahan at inilalarawan kung ano ang dapat maging si Abram. Sa natural na Tagalog, hindi kailangan ang katumbas ng English indefinite article; malinaw sa “maging pagpapala ka” ang predikatibong gamit.
theological_decisions:
- issue: Lakas ng וֶהְיֵה בְּרָכָה
  choice: 'Pautos: “at maging pagpapala ka”'
  alternative: 'Bunga o pahayag sa hinaharap: “at ikaw ay magiging pagpapala”'
  rationale: Pautos ang anyong Hebreo, kaya iyon ang pinananatili sa pangunahing teksto. Gayunman, dahil bahagi ito ng sunod-sunod na mga pangako ng Diyos, maaaring maunawaan ang sugnay bilang ipinangakong resulta; inilalahad ang posibilidad na iyon sa talababa nang hindi inaalis ang gramatikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dakila” upang mapanatili ang mataas ngunit pangkaraniwang rehistro ng talata. Ang semicolon bago ang huling sugnay ay nagpapahiwatig ng retorikal na paglipat tungo sa pautos habang pinananatili ang Hebreong pang-ugnay na “at.”
