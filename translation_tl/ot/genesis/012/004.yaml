  source_fidelity: 'Tumpak na naipapahayag ng salin ang magkakasunod na kilos: umalis si Abram bilang pagsunod sa sinabi ni Yahweh, sumama si Lot, at pitumpu’t limang taong gulang si Abram nang umalis siya mula sa Haran. Ang “ayon sa sinabi sa kanya” ay sapat na katumbas ng כַּאֲשֶׁר דִּבֶּר אֵלָיו at hindi nagdaragdag ng interpretasyon.'
  naturalness: Natural at malinaw ang modernong Tagalog. Ang “sumama sa kanya si Lot” ay idiomatiko at wastong naghihiwalay sa kilos ni Lot mula sa kilos ni Abram. Malinaw rin ang huling “siya” bilang pagtukoy kay Abram.
  terminology: Wasto at pare-pareho ang paggamit ng “Yahweh” para sa יהוה. Ang “Pitumpu't limang taong gulang” ay karaniwan at angkop na paraan ng pagsasaad ng edad sa makabagong Tagalog. Ang mga pangalang Abram, Lot, at Haran ay wastong napanatili.
