  text: וַ/יֵּ֣לֶךְ אַבְרָ֗ם כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר אֵלָי/ו֙ יְהוָ֔ה וַ/יֵּ֥לֶךְ אִתּ֖/וֹ ל֑וֹט וְ/אַבְרָ֗ם בֶּן חָמֵ֤שׁ שָׁנִים֙ וְ/שִׁבְעִ֣ים שָׁנָ֔ה בְּ/צֵאת֖/וֹ מֵ/חָרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/004.yaml
  text: So Abram went, just as Yahweh had spoken to him, and Lot went with him. Abram was seventy-five years old when he departed from Haran.
translation:
  language: tl
  text: Kaya umalis si Abram, ayon sa sinabi sa kanya ni Yahweh, at sumama sa kanya si Lot. Pitumpu't limang taong gulang si Abram nang umalis siya sa Haran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: umalis
  rationale: Sa konteksto ng utos na lisanin ang lupain at ng pag-alis mula sa Haran, natural na ipinahahayag ng “umalis” ang pasulong na kilos ng salaysay nang hindi labis na dinidiinan ang pagsisimula ng paglalakbay.
- source_word: כַּאֲשֶׁר
  choice: ayon sa
  rationale: Ipinapakita nito na ang ginawa ni Abram ay kaayon ng naunang sinabi ni Yahweh; likas at malinaw ito sa modernong Tagalog.
- source_word: דִּבֶּר אֵלָיו
  choice: sinabi sa kanya
  rationale: Karaniwang paraan ito sa Tagalog upang ipahayag ang naunang pagsasalita. Hindi kailangang markahan nang hiwalay ang past perfect dahil malinaw sa daloy ng salaysay na nauna ang sinabi sa pag-alis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אִתּוֹ
  choice: sumama sa kanya
  rationale: Sa halip na literal na “naglakad na kasama niya,” natural na ipinapahayag sa Tagalog ang pakikisama ni Lot sa paglalakbay sa pamamagitan ng “sumama sa kanya.”
- source_word: בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה
  choice: pitumpu't limang taong gulang
  rationale: Ito ang natural na makabagong Tagalog para sa idyomang Hebreo na nagsasaad ng edad.
- source_word: בְּצֵאתוֹ מֵחָרָן
  choice: nang umalis siya sa Haran
  rationale: Ang בְּ na kalakip ng infinitive construct ay nagpapahayag ng panahon; ang “nang” ay malinaw at idiomatikong katumbas nito sa Tagalog.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ang tekstong Hebreo ay tuwirang gumagamit ng Tetragrammaton. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang personal na pangalan at hindi ito ginagawang titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang payak na ayos ng pangungusap at karaniwang mga pandiwa, habang pinananatili ang paulit-ulit na pagbanggit kay Abram at ang dalawang magkahiwalay na kilos sa Hebreo.
