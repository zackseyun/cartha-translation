  text: Then Pharaoh called Abram and said, “What is this you have done to me? Why did you not tell me that she is your wife?”
translation:
  language: tl
  text: Pagkatapos, ipinatawag ng Paraon si Abram at sinabi, “Ano itong ginawa mo sa akin? Bakit hindi mo sinabi sa akin na asawa mo siya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... לְאַבְרָם
  choice: ipinatawag ... si Abram
  rationale: Sa konstruksiyong קרא na may לְ at tao, ang diwa ay ipatawag o tawagin ang isang tao. Mas likas sa kontekstong maharlika ang “ipinatawag” at hindi nito hinihigitan ang puwersa ng Hebreo.
- source_word: פַרְעֹה
  choice: Paraon
  rationale: Karaniwang anyong Filipino ng titulong hari sa Ehipto.
- source_word: וַיֹּאמֶר
  choice: sinabi
  rationale: Pinananatili ang karaniwang pandiwang salaysay na אמר; bagaman mga tanong ang kasunod, natural pa rin sa Filipino ang “sinabi.”
- source_word: מַה זֹּאת עָשִׂיתָ לִּי
  choice: Ano itong ginawa mo sa akin?
  rationale: Pinananatili ang demonstratibong diin ng מַה זֹּאת at ang personal na hinaing sa לִּי, habang natural ang ayos sa makabagong Filipino.
- source_word: לָמָּה לֹא הִגַּדְתָּ לִּי
  choice: Bakit hindi mo sinabi sa akin
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi o magpabatid; “sinabi sa akin” ang malinaw at karaniwang pahayag.
- source_word: כִּי אִשְׁתְּךָ הִוא
  choice: na asawa mo siya
  rationale: Ang כִּי ay nagpapakilala sa nilalaman ng hindi sinabi. Ang nominal na sugnay ay natural na isinasalin bilang “asawa mo siya,” na pinananatili ang kasalukuyang ugnayan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinatawag” upang natural na ilarawan ang kilos ng isang pinuno, at pinanatili ang tuwirang, matinding tono ng pagsaway ng Paraon.
