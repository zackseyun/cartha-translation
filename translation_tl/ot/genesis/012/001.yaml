  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל אַבְרָ֔ם לֶךְ לְ/ךָ֛ מֵ/אַרְצְ/ךָ֥ וּ/מִ/מּֽוֹלַדְתְּ/ךָ֖ וּ/מִ/בֵּ֣ית אָבִ֑י/ךָ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר אַרְאֶֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/001.yaml
  text: Yahweh said to Abram, “Go out from your land, from your kindred, and from your father’s house to the land that I will show you.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Abram, “Umalis ka sa iyong lupain, sa iyong mga kamag-anak, at sa sambahayan ng iyong ama, at pumunta ka sa lupaing ipapakita ko sa iyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: לֶךְ־לְךָ
  choice: Umalis ka
  rationale: Ang idyomang Hebreo ay mariing utos na lumisan; natural at malinaw sa modernong Tagalog ang “Umalis ka.”
- source_word: מִמּוֹלַדְתְּךָ
  choice: sa iyong mga kamag-anak
  rationale: Sa kontekstong ito, tumutukoy ito sa pangkat ng pagkakamag-anak o angkan, hindi lamang sa lugar ng kapanganakan.
- source_word: מִבֵּית אָבִיךָ
  choice: sa sambahayan ng iyong ama
  rationale: Pinananatili ang panlipunan at pampamilyang diwa ng Hebreong “bahay ng iyong ama,” na mas malawak kaysa pisikal na bahay lamang.
- source_word: אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶךָּ
  choice: at pumunta ka sa lupaing ipapakita ko sa iyo
  rationale: Ginagawang hayag sa natural na Tagalog ang ipinahihiwatig na pagpunta sa destinasyon, habang pinananatili ang hindi pa tinutukoy na lupain.
theological_decisions:
- issue: Paglalahad sa banal na pangalan
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasan sa tekstong Hebreo ang Tetragrammaton; ang transliterasyon ay hindi nagkukubli sa personal na pangalan sa likod ng isang titulo.
- issue: Saklaw ng pagtalikod ni Abram
  choice: lupain, mga kamag-anak, at sambahayan ng ama
  alternative: bayan, lugar ng kapanganakan, at bahay ng ama
  rationale: Pinananatili ang tatlong magkakaugnay ngunit magkakaibang ugnayan sa lupain, angkan, at sambahayan nang hindi nililimitahan ang mga ito sa heograpiya o gusali.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “sambahayan” upang maipahayag ang mas malawak na yunit ng pamilya sa “bahay ng ama,” at iniwasan ang di-kailangang panimulang “Ngayon” dahil ang וַיֹּאמֶר ay pang-ugnay na salaysay, hindi tahasang salitang pangpanahon.
