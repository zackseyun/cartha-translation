lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Nagbibigay-pansin ito sa kasunod na pahayag at pinananatili ang masigla ngunit marangal na himig nang hindi gumagamit ng makalumang pananalita.
- source_word: שֶׁבַע שָׁנִים
  choice: pitong taon
  rationale: Tuwirang katumbas ng bilang at yunit ng panahon sa Hebreo.
- source_word: בָּאוֹת
  choice: darating
  rationale: Ang participle ay tumutukoy sa nalalapit na panahon; natural na ipinahahayag ito sa Tagalog sa anyong panghinaharap.
- source_word: שָׂבָע גָּדוֹל
  choice: lubos na kasaganaan
  rationale: Ang שָׂבָע ay tumutukoy sa saganang pagkain o ani sa konteksto, at ang גָּדוֹל ay nagpapatingkad sa antas nito. Saklaw ng 'kasaganaan' ang diwa nang hindi nililimitahan sa ani lamang.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: sa buong lupain ng Ehipto
  rationale: Natural at tumpak na ipinahahayag ang lawak na sumasaklaw sa lahat ng teritoryo ng Ehipto.
