  yaml_path: translation/ot/genesis/041/050.yaml
  text: Before the year of famine came[a], two sons were born to Joseph, whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: tl
  text: Bago dumating ang taon ng taggutom[a], dalawang anak na lalaki ang isinilang kay Jose ni Asenat, anak ni Potifera, pari ng On[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bago sumapit ang taon ng taggutom.” Isahan ang “taon” sa Hebreo at tumutukoy ito sa pagsisimula ng panahon ng taggutom.
    reason: lexical_alternative
  - marker: b
    text: Ang On ay isang lungsod sa Ehipto na nang maglaon ay tinawag na Heliopolis sa Griyego.
    reason: cultural_note
lexical_decisions:
- source_word: יֻלַּד ... שְׁנֵי בָנִים
  choice: nagkaanak si Jose ng dalawang lalaki
  rationale: Ang pasibong Hebreong pahayag ay likas na naihahayag sa modernong Tagalog sa pamamagitan ng “nagkaanak”; pinananatili ng “dalawang lalaki” ang bilang at kasarian ng בָנִים nang hindi nagmumungkahi na bata pa sila sa puntong isinasalaysay.
- source_word: וּלְיוֹסֵף
  choice: si Jose
  rationale: Ang lamed ay nagpapakita kung kanino ipinanganak ang mga anak; sa likas na konstruksiyong Tagalog na “nagkaanak si Jose,” naipahahayag ang ugnayang ito nang hindi pilit.
- source_word: בְּטֶרֶם
  choice: Bago
  rationale: Tuwirang temporal na katumbas na malinaw na inilalagay ang kapanganakan bago sumapit ang taggutom.
- source_word: תָּבוֹא שְׁנַת הָרָעָב
  choice: dumating ang taon ng taggutom
  rationale: Pinananatili ang literal na isahan na “taon” at ang larawang pandiwa na “dumating,” kahit tumutukoy ito sa pagsisimula ng panahon ng taggutom.
- source_word: יָלְדָה לּוֹ אָסְנַת
  choice: kay Asenat
  rationale: Sa konstruksiyong “nagkaanak ... kay Asenat,” natural na ipinahihiwatig na si Asenat ang nagsilang ng dalawang anak kay Jose, nang hindi inuulit ang impormasyong likas nang malinaw sa Tagalog.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: anak ni Potifera
  rationale: Ang “anak” ay natural sa Tagalog at malinaw ang babaeng tinutukoy mula sa pangalang Asenat at sa konteksto; ang pangalan ay isinalin sa ponetikong anyong madaling basahin.
- source_word: כֹּהֵן אֽוֹן
  choice: pari sa On
  rationale: Ang כֹּהֵן ay karaniwang “pari,” at ang “sa On” ay natural na nagpapahayag ng kaugnayan ng tungkulin sa lungsod nang hindi nagpapasya kung eksaktong pag-aari o lokasyon ang diin.
