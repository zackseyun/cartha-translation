- from: Bago dumating ang taon ng taggutom[a], nagkaanak si Jose ng dalawang lalaki kay Asenat, na anak ni Potifera na pari sa On[b].
  to: Bago dumating ang taon ng taggutom[a], dalawang anak na lalaki ang isinilang kay Jose ni Asenat, anak ni Potifera, pari ng On[b].
