  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “nagkaanak ... kay” upang maiwasan ang matigas na pasibong hulma habang pinananatili ang diwa ng Hebreo. Napanatili sa pangunahing teksto ang parehong panandang talababa [a] at [b].
