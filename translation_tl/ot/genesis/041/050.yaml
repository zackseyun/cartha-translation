  - marker: b
    text: Ang On ay isang lungsod sa Ehipto na nang maglaon ay tinawag na Heliopolis sa Griyego.
    reason: cultural_note
  revision_rationale: Ginawang tahasan ang pasibong kapanganakan at ang papel ni Asenat bilang ina, pinalitan ang malabong “dalawang lalaki” ng “dalawang anak na lalaki,” at inayos ang talababa [a] upang maglaman ng aktuwal na alternatibong salin. Napanatili ang isahang “taon,” ang pagkakasunod sa panahon, at ang mga panandang talababa.
