  text: And the thin and ugly cows ate up the first seven healthy cows[a].
translation:
  language: tl
  text: At kinain ng payat at pangit na mga baka ang unang pitong malulusog na baka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bakang payat at pangit ang anyo ... ang unang pitong matatabang baka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: nilamon
  rationale: Ang pandiwang אכל ay nangangahulugang ‘kumain.’ Sa tagpo ng panaginip, natural na ipinahihiwatig ng “nilamon” ang lubusang pagkain sa mga baka, nang hindi kailangang magdagdag ng paliwanag.
- source_word: הַפָּרוֹת
  choice: mga baka
  rationale: Ang anyong pambabaeng maramihan ay tumutukoy sa mga babaeng bovine; sa karaniwang modernong Tagalog, sapat at natural ang “mga baka.”
- source_word: הָרַקּוֹת
  choice: payat
  rationale: Inilalarawan nito ang kapayatan o kawalan ng laman ng katawan; malinaw at karaniwan ang “payat” sa modernong Tagalog.
- source_word: וְהָרָעוֹת
  choice: pangit
  rationale: Sa kontekstong ito, ang רעות ay tumutukoy sa masamang anyo, hindi sa kasamaang moral; natural na naihahatid ito ng “pangit.”
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: ang ... pitong ... baka
  rationale: Tuwirang isinasalin ang tiyak na layon, bilang, at pangngalan ayon sa natural na ayos ng Tagalog.
- source_word: הָרִאשֹׁנוֹת
  choice: unang
  rationale: Tinutukoy nito ang pangkat ng mga baka na naunang lumitaw sa panaginip; “unang” ang pinakanatural na katumbas.
- source_word: הַבְּרִיאֹת
  choice: malulusog
  rationale: Ipinahihiwatig ng salita ang mabuti at matipunong kalagayan. Pinananatili ng “malulusog” ang mas malawak na diwa kaysa sa “matataba,” bagaman posible rin iyon sa konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nilamon” bilang likas na pagsasabi ng ganap na pagkain sa konteksto ng panaginip; inilagay sa talababa ang mas literal na mga alternatibo para sa רעות at בריאות.
