  yaml_path: translation/ot/genesis/041/019.yaml
  text: And behold[a], seven other cows came up after them, poor and very ugly in appearance and thin in flesh[b]. I had not seen any like them in all the land of Egypt for ugliness.
translation:
  language: tl
  text: At narito, pitong iba pang baka ang umahon kasunod ng mga iyon. Mahihina ang mga ito, napakapangit tingnan, at payat na payat. Wala pa akong nakitang tulad nila sa buong lupain ng Ehipto dahil sa kapangitan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa kasamaan” o “dahil sa kaawa-awang kalagayan.” Malawak ang salitang Hebreo at dito ay tumutukoy sa sukdulang masamang hitsura at kalagayan ng mga baka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang masiglang panandang pasalaysay na nagpapakilala sa sumunod na nakita sa panaginip.
- source_word: שֶׁבַע פָּרוֹת אֲחֵרוֹת
  choice: pitong iba pang baka
  rationale: Tiyak na mga babaeng baka ang tinutukoy, at malinaw na hiwalay na pangkat ito sa unang pito.
- source_word: עֹלֹת אַחֲרֵיהֶן
  choice: ang umahon kasunod ng mga iyon
  rationale: Pinananatili ang larawang umaahon ang mga baka at ang pagkakasunod nila sa unang pangkat.
- source_word: דַּלּוֹת
  choice: Mahihina
  rationale: Ipinahahayag ang kaawa-awa at kulang-sa-lakas na kalagayan nang hindi inuulit agad ang ideya ng kapayatan.
- source_word: וְרָעוֹת תֹּאַר מְאֹד
  choice: napakapangit tingnan
  rationale: Sa konteksto, ang רָעוֹת ay tumutukoy sa napakasamang panlabas na anyo, hindi sa kasamaang moral.
- source_word: וְרַקּוֹת בָּשָׂר
  choice: payat na payat
  rationale: Likas na modernong Tagalog para sa labis na kapayatan ng katawan o laman.
- source_word: לֹא רָאִיתִי כָהֵנָּה בְּכָל אֶרֶץ מִצְרַיִם לָרֹעַ
  choice: Sa buong lupain ng Ehipto, wala pa akong nakitang mga bakang gayon kasama ang anyo at kalagayan
  rationale: Ipinananatili ang paghahambing at pambihirang kasamaan ng kanilang hitsura at pisikal na kalagayan, habang iniiwasang magmukhang moral na paghatol ang 'masama'.
