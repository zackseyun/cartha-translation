base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/036.yaml
  text: That food shall be a reserve for the land for the seven years of famine that will be in the land of Egypt[c][b][a], so that the land may not be cut off by the famine.
translation:
  language: tl
  text: Ang pagkaing iyon ay magsisilbing nakalaang panustos[a] para sa lupain sa panahon ng pitong taon ng taggutom na darating sa lupain ng Ehipto,[b] upang hindi malipol[c] ang lupain dahil sa taggutom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “imbak” o “nakaimbak na pagkain.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “para sa lupain para sa pitong taon ng taggutom na darating sa lupain ng Ehipto.”'
    reason: previous_rendering
  - marker: c
    text: Literal na “maputol.” Ang diwa rito ay hindi mawasak o malipol ang lupain o bansa dahil sa taggutom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ay magiging
  rationale: Ang anyong pandiwa sa kontekstong ito ay tumutukoy sa inaasahang bunga ng planong iminungkahi ni Jose.
- source_word: הָאֹכֶל
  choice: ang pagkaing iyon
  rationale: Malawak ang kahulugan ng אֹכֶל na ‘pagkain’; ang ‘iyon’ ay likas na tumutukoy sa pagkaing titipunin ayon sa naunang talata nang hindi ito nililimitahan sa butil lamang.
- source_word: לְפִקָּדוֹן
  choice: imbak
  rationale: Tumutukoy ito sa bagay na iniingatan at inilaan para sa pangangailangan sa hinaharap. Maikli at natural sa Filipino ang ‘imbak,’ habang inilalahad sa talababa ang posibleng ‘nakalaang panustos.’
- source_word: לָאָרֶץ
  choice: para sa lupain
  rationale: Ang אֶרֶץ ay tumutukoy sa lupain o buong bansa ng Ehipto. Pinananatili ng ‘lupain’ ang pag-uulit ng salitang Hebreo sa talata.
- source_word: לְשֶׁבַע שְׁנֵי הָרָעָב
  choice: sa pitong taon ng taggutom
  rationale: Tumutukoy ito sa tiyak na pitong taon ng taggutom na naipaliwanag na ni Jose. Ang ‘sa’ ay natural na nagpapahayag ng panahong paglalaanan ng imbak.
- source_word: אֲשֶׁר תִּהְיֶיןָ בְּאֶרֶץ מִצְרָיִם
  choice: na darating sa lupain ng Ehipto
  rationale: Bagaman literal na ‘na mangyayari/magkakaroon sa lupain ng Ehipto,’ mas natural sa Filipino ang ‘darating’ para sa mga taon ng taggutom at malinaw pa rin ang hinaharap na diwa.
- source_word: וְלֹא תִכָּרֵת הָאָרֶץ
  choice: upang hindi mapuksa ang lupain
  rationale: Literal na larawan ng Niphal כרת ang ‘maputol,’ ngunit sa konteksto ang diwa ay ang hindi pagkawasak o pagkalipol ng bansa dahil sa taggutom. Ginawang malinaw ang diwa sa pangunahing teksto at pinanatili ang literal na larawan sa talababa.
- source_word: בָּרָעָב
  choice: dahil sa taggutom
  rationale: Ipinahahayag ng pang-ukol ang sanhi o paraang magdudulot sana ng pagkawasak; natural sa Filipino ang ‘dahil sa.’
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘imbak’ sa halip na mas teknikal o banyagang ‘reserba,’ at pinanatili ang pag-uulit ng ‘lupain’ upang maipakita ang padron ng tekstong Hebreo.
