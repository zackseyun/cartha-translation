translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Inayos ang puwesto ng intensifier bilang “napakaraming” upang maging likas ang daloy, habang pinananatili ang simile at ang sanhi-bungang ugnayan ng Hebreo.
