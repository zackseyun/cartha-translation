base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/049.yaml
  text: And Yoseph stored up grain[a], like the sand of the sea, in very great abundance, until he stopped counting[c][b], because there was no number.
translation:
  language: tl
  text: Nag-imbak si Jose ng napakaraming butil, gaya ng buhangin sa dagat, hanggang sa tumigil na siya sa pagbibilang sapagkat hindi na iyon mabilang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְבֹּר
  choice: Nag-imbak
  rationale: Ipinahihiwatig ng צבר ang pagtitipon at pagtatambak para sa imbakan; ang “nag-imbak” ang natural na salin sa konteksto ng pangangasiwa sa ani.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa modernong Bibliyang Tagalog, sa halip na artipisyal na tuwirang transliterasyon.
- source_word: בָּר
  choice: butil
  rationale: Pangkalahatang tawag ito sa inaning cereal grain at hindi tiyak na trigo; malinaw at karaniwan sa Tagalog ang “butil.”
- source_word: כְּחוֹל הַיָּם
  choice: gaya ng buhangin sa dagat
  rationale: Pinananatili nito ang pamilyar na larawang Hebreo ng di-masukat na dami sa natural na Tagalog.
- source_word: הַרְבֵּה מְאֹד
  choice: napakaraming
  rationale: Likas at mariing ipinapahayag ng “napakaraming” ang pinagsamang diwa ng הַרְבֵּה at מְאֹד nang hindi nagiging paulit-ulit o mabigat.
- source_word: עַד כִּי
  choice: hanggang sa
  rationale: Ipinakikita nito ang hangganan o kinalabasang naabot ng pag-iimbak.
- source_word: חָדַל לִסְפֹּר
  choice: tumigil na siya sa pagbibilang
  rationale: Ang panlalaking isahang pandiwa ay pinakamalamang na tumutukoy kay Jose; natural sa Tagalog ang tahasang panghalip.
- source_word: כִּי אֵין מִסְפָּר
  choice: sapagkat hindi na iyon mabilang
  rationale: Isinasalin nito ang Hebreong idyomang “walang bilang” sa malinaw na modernong Tagalog habang pinananatili ang paliwanag kung bakit itinigil ang pagbibilang.
