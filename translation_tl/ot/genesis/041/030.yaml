  text: וְ֠/קָמוּ שֶׁ֜בַע שְׁנֵ֤י רָעָב֙ אַחֲרֵי/הֶ֔ן וְ/נִשְׁכַּ֥ח כָּל הַ/שָּׂבָ֖ע בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/כִלָּ֥ה הָ/רָעָ֖ב אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/030.yaml
  text: Then seven years of famine will arise after them[a], and all the abundance in the land of Egypt will be forgotten[b], and the famine will consume the land.
translation:
  language: tl
  text: Pagkatapos ng mga iyon, darating ang pitong taon ng taggutom. Malilimutan ang lahat ng kasaganaan[a] sa lupain ng Ehipto, at uubusin[b] ng taggutom ang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng kasapatan.” Ang salitang Hebreo ay tumutukoy sa kapunuan o kasaganaan, lalo na bilang kabaligtaran ng taggutom.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “wawasakin.” Ang pandiwang Hebreo ay maaaring mangahulugang lubusang umubos o magdala sa pagkawasak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמוּ
  choice: darating
  rationale: Sa kontekstong makahulang, ang anyong pandiwa ay tumutukoy sa mangyayari sa hinaharap. Mas likas sa modernong Tagalog ang “darating” para sa pagsapit ng mga taon, habang pinananatili ang diwa ng paglitaw o pagsisimula.
- source_word: שֶׁבַע שְׁנֵי רָעָב
  choice: pitong taon ng taggutom
  rationale: Tumpak at natural na katumbas ng pariralang Hebreo; ang “taggutom” ay tumutukoy sa malawakang kakulangan sa pagkain, hindi lamang sa personal na gutom.
- source_word: אַחֲרֵיהֶן
  choice: pagkatapos ng mga iyon
  rationale: Tumutukoy ang panghalip sa pitong taon ng kasaganaan sa naunang talata. Pinananatili ng salin ang sanggunian nang hindi ito labis na nililinaw sa pangunahing teksto.
- source_word: וְנִשְׁכַּח
  choice: malilimutan
  rationale: 'Pinananatili ang balintiyak na diwa ng Nifal: dahil sa tindi ng taggutom, hindi na maaalala ang naunang kasaganaan.'
- source_word: כָּל הַשָּׂבָע
  choice: lahat ng kasaganaan
  rationale: Ang שָׂבָע ay nagsasaad ng kapunuan, kasapatan, o kasaganaan, lalo na bilang kabaligtaran ng taggutom. Hindi ito nilimitahan sa nakaimbak na butil lamang.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang buong heograpikong parirala ng Hebreo sa natural at marangal na Tagalog.
- source_word: וְכִלָּה
  choice: uubusin
  rationale: Ang Piel ng כלה ay maaaring magpahiwatig ng lubusang pag-ubos o pagwasak. Ang “uubusin” ay natural kapag taggutom ang gumaganap at pinananatili ang matinding larawan ng pagkonsumo.
- source_word: הָרָעָב
  choice: ang taggutom
  rationale: Ang tiyak na pangngalan ay tumutukoy sa taggutom na kababanggit lamang at nagpapanatili ng malinaw na ugnayan sa talata.
- source_word: אֶת הָאָרֶץ
  choice: ang lupain
  rationale: Malawak ang saklaw ng אָרֶץ at dito ay tumutukoy sa buong lupain ng Ehipto, hindi lamang sa lupaing sakahan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taggutom,” “kasaganaan,” at “lupain” bilang mga karaniwang salitang angkop sa salaysay at sa kontekstong pangkabuhayan. Hinati sa dalawang pangungusap para sa likas na daloy sa Filipino nang hindi binabago ang pagkakasunod ng mga kaisipan.
