  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תְּחִלֶּ֜ינָה שֶׁ֣בַע שְׁנֵ֤י הָ/רָעָב֙ לָ/ב֔וֹא כַּ/אֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַ/יְהִ֤י רָעָב֙ בְּ/כָל הָ֣/אֲרָצ֔וֹת וּ/בְ/כָל אֶ֥רֶץ מִצְרַ֖יִם הָ֥יָה לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/054.yaml
  text: And the seven years of famine began to come[a], just as Joseph had said. And there was famine in all the lands, but in all the land of Egypt there was bread.
translation:
  language: tl
  text: Nagsimula nang dumating ang pitong taon ng taggutom, gaya ng sinabi ni Jose. Nagkaroon ng taggutom sa lahat ng lupain, ngunit may tinapay[a] sa buong lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkain”; ang salitang Hebreo para sa “tinapay” ay maaari ring tumukoy nang mas malawak sa pagkain o panustos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחִלֶּינָה ... לָבוֹא
  choice: Nagsimula nang dumating
  rationale: Pinananatili ang aspektong pasimula ng pandiwa at ang larawan ng pagdating ng mga taon ng taggutom, habang likas pa ring mababasa sa modernong Tagalog.
- source_word: שֶׁבַע שְׁנֵי הָרָעָב
  choice: ang pitong taon ng taggutom
  rationale: Tuwirang katumbas ng pariralang konstrukto at karaniwang paraan ng pagpapahayag sa Tagalog.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: gaya ng sinabi ni Jose
  rationale: Ipinahahayag ang eksaktong pagtutugma ng pangyayari sa naunang sinabi ni Jose nang hindi nagdaragdag ng interpretasyon.
- source_word: וַיְהִי רָעָב
  choice: Nagkaroon ng taggutom
  rationale: Natural na Tagalog para sa eksistensiyal na gamit ng היה sa salaysay.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: sa lahat ng lupain
  rationale: Pinananatili ang maramihang anyo at iniiwasan ang makabagong politikal na pahiwatig ng “mga bansa.”
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: ngunit ... sa buong lupain ng Ehipto
  rationale: Bagaman literal na pang-ugnay ang “at,” malinaw na pasalungat ang ugnayan sa naunang sugnay; likas itong ipinahahayag ng “ngunit” sa Tagalog.
- source_word: הָיָה לָחֶם
  choice: may tinapay
  rationale: Pinananatili ang konkretong pangunahing kahulugan ng לֶחֶם, habang inilalahad sa talababa ang posibleng mas malawak na diwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Ehipto” at “Jose,” na pamilyar sa karaniwang mambabasang Filipino. Inilagay ang talababa sa “tinapay,” ang salitang aktuwal na may leksikal na alternatibo.
