  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַ֨ל הִשָּׁנ֧וֹת הַ/חֲל֛וֹם אֶל פַּרְעֹ֖ה פַּעֲמָ֑יִם כִּֽי נָכ֤וֹן הַ/דָּבָר֙ מֵ/עִ֣ם הָ/אֱלֹהִ֔ים וּ/מְמַהֵ֥ר הָ/אֱלֹהִ֖ים לַ/עֲשֹׂתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/032.yaml
  text: And as for the dream being repeated to Pharaoh twice[a], it is because the matter is fixed by God[b], and God is hastening to do it.
translation:
  language: tl
  text: At kung bakit inulit kay Paraon nang dalawang beses ang panaginip, ito ay sapagkat naitakda na ng Diyos ang bagay na ito[a], at minamadali ng Diyos na isagawa ito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang bagay na ito ay tiyak na mula sa Diyos” o “pinagtibay na ng Diyos ang bagay na ito.”
    reason: lexical_alternative
  - marker: b
    text: O, “malapit nang isagawa ito ng Diyos” o “agad itong isasagawa ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: At kung bakit
  rationale: Ipinakikilala nito ang paliwanag sa dahilan ng pag-uulit ng panaginip; natural sa Filipino ang konstruksiyong ito.
- source_word: הִשָּׁנוֹת הַחֲלוֹם
  choice: inulit ... ang panaginip
  rationale: Pinananatili ang pasibong diwa ng pandiwa habang gumagamit ng natural na ayos sa Filipino.
- source_word: אֶל־פַּרְעֹה
  choice: kay Paraon
  rationale: Ipinapahayag ang taong tumanggap ng inulit na panaginip.
- source_word: פַּעֲמָיִם
  choice: nang dalawang beses
  rationale: Karaniwang modernong Filipino para sa dual na anyong nangangahulugang 'twice.'
- source_word: כִּי
  choice: ito ay sapagkat
  rationale: Malinaw na ipinakikita ang sanhi o paliwanag sa pag-uulit.
- source_word: נָכוֹן הַדָּבָר מֵעִם הָאֱלֹהִים
  choice: tiyak na mula sa Diyos ang bagay na ito
  rationale: Pinananatili ang katatagan o katiyakan ng נָכוֹן at ang literal na diwa ng pinagmulan sa מֵעִם, nang hindi lubusang isinasara ang posibilidad na ang kahulugan ay 'itinakda' o 'pinagtibay' ng Diyos.
- source_word: וּמְמַהֵר הָאֱלֹהִים לַעֲשֹׂתוֹ
  choice: at agad itong isasagawa ng Diyos
  rationale: Natural na Filipino na naghahatid ng diwa ng pagmamadali at nalalapit na pagsasakatuparan, bagaman ang aspektong participial ay maaari ring isaling 'minamadali.'
theological_decisions:
- issue: Kahulugan ng הָאֱלֹהִים sa paliwanag ni Jose
  choice: Diyos
  alternative: mga diyos
  rationale: Bagaman plural ang anyong morpolohikal ng אֱלֹהִים, ang sintaks at konteksto ay malinaw na tumutukoy sa iisang Diyos.
- issue: Ugnayan ng ipinahayag na bagay at ng Diyos sa מֵעִם הָאֱלֹהִים
  choice: tiyak na mula sa Diyos ang bagay na ito
  alternative: itinakda na ng Diyos ang bagay na ito
  rationale: Pinananatili ng pangunahing salin ang pinagmulan at katiyakan ng pahayag; inilalagay sa talababa ang mas tahasang pagbasa ng banal na pagtatakda upang hindi tahimik na lutasin ang leksikal na saklaw.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “Paraon” bilang karaniwang anyong biblikal. Iniwasan ang labis na teknikal o denominasyonal na pananalita, at pinanatili sa mga talababa ang tunay na mga alternatibong diwa ng mga pariralang Hebreo.
