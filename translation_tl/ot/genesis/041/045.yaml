reference: Genesis 41:45
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֣ה שֵׁם יוֹסֵף֮ צָֽפְנַ֣ת פַּעְנֵחַ֒ וַ/יִּתֶּן ל֣/וֹ אֶת אָֽסְנַ֗ת בַּת פּ֥וֹטִי פֶ֛רַע כֹּהֵ֥ן אֹ֖ן לְ/אִשָּׁ֑ה וַ/יֵּצֵ֥א יוֹסֵ֖ף עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/045.yaml
  text: And Pharaoh called Joseph’s name Zaphenath-paneah[a], and he gave him Asenath, the daughter of Potiphera, the priest of On, as a wife[d][c][b]. And Joseph went out over the land of Egypt.
translation:
  language: tl
  text: At tinawag ng Faraon si Jose na Zafenat-panea[a]. Ibinigay niya kay Jose si Asenat, na anak ni Potifera, ang saserdote ng On[b], upang maging asawa niya. Pagkatapos, lumabas si Jose at naglakbay sa buong lupain ng Ehipto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang kahulugan ng pangalang Ehipsiyong ito ay hindi tiyak. Maaari rin itong baybayin na “Zafenat-paanea.”
    reason: Pinananatili ang kawalang-katiyakan sa etimolohiya at alternatibong transliterasyon ng pangalan.
  - marker: b
    text: Ang On ay isang lungsod sa Ehipto na nang maglaon ay tinawag na Heliopolis sa Griego.
    reason: Nagbibigay ng mahalagang pagkakakilanlang pangkasaysayan sa sinaunang pangalan ng lugar.
  - marker: c
    text: 'Maaari ring isalin: “lumabas si Jose sa buong lupain ng Ehipto” o “lumabas si Jose sa lupain ng Ehipto.”'
    reason: Ang pandiwang Hebreo ay “lumabas,” at ang pariralang may pang-ukol ay maaaring ipahayag nang mas literal na “sa/sa ibabaw ng lupain.” Sa konteksto, natural ang diwang paglalakbay sa saklaw ng Ehipto; hindi ito nangangahulugang pag-alis niya mula sa Ehipto.
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם יוֹסֵף
  choice: tinawag ... si Jose na
  rationale: Ang קרא na may שׁם ay isang pormula ng pagbibigay ng pangalan. Ang likas na modernong Tagalog ay “tinawag si Jose na,” na malinaw na naghahayag ng opisyal na pagpapangalan nang hindi ginagaya ang alanganing idyomang Hebreo nang salita-sa-salita.
- source_word: צָפְנַת פַּעְנֵחַ
  choice: Zafenat-panea
  rationale: Pangalan o titulong Ehipsiyo ito na hindi tiyak ang kahulugan, kaya tinumbasan sa baybay na madaling bigkasin sa Tagalog sa halip na isalin ang isang pinagtatalunang etimolohiya.
- source_word: וַיִּתֶּן לוֹ אֶת אָסְנַת
  choice: Ibinigay rin niya kay Jose si Asenat
  rationale: Pinananatili ang tahasang kilos ni Faraon at nililinaw sa Tagalog ang tinutukoy ng hulaping “sa kaniya” sa Hebreo.
- source_word: בַּת פּוֹטִי פֶרַע כֹּהֵן אֹן
  choice: anak ni Potifera, ang saserdote ng On
  rationale: Itinuturing ang “saserdote ng On” bilang pariralang nagpapakilala kay Potifera. Ang “saserdote” ay marangal at karaniwang salin ng כֹּהֵן sa kontekstong panrelihiyon.
- source_word: לְאִשָּׁה
  choice: upang maging asawa niya
  rationale: Likas na Tagalog para sa idyomang tumutukoy sa pag-aasawa, habang hindi dinaragdagan ang teksto ng seremonya o motibo.
- source_word: וַיֵּצֵא יוֹסֵף עַל אֶרֶץ מִצְרָיִם
  choice: naglakbay si Jose sa buong lupain ng Ehipto
  rationale: Sa konteksto ng bagong tungkulin ni Jose, ipinahihiwatig ng יצא at עַל ang paglabas at paggalaw niya sa saklaw ng lupain. Ang “sa buong” ay natural sa Tagalog ngunit kinikilalang maaaring unawain nang mas pormal bilang “sa ibabaw/sa lupain,” kaya may talababa.
theological_decisions:
- issue: Ugnayan ng “saserdote ng On” kay Potifera
  choice: Potifera, ang saserdote ng On
  alternative: Potifera na anak ng saserdote ng On
  rationale: Sa Hebreo, ang כֹּהֵן אֹן ay tuwirang kasunod at apositibo sa pangalang Potifera; walang batayan sa teksto upang iugnay ang titulo sa ibang tao.
- issue: Saklaw ng paglabas ni Jose sa עַל אֶרֶץ מִצְרָיִם
  choice: naglakbay ... sa buong lupain ng Ehipto
  alternative: lumabas ... sa lupain ng Ehipto
  rationale: Pinipili ang likas na kahulugang heograpiko sa konteksto, ngunit hindi ito ginagamit upang ipasok ang higit na tiyak na ideya ng pamamahala o inspeksiyon na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Faraon,” “Jose,” “Asenat,” “Potifera,” “On,” at “Ehipto” ayon sa nakasanayang anyong Tagalog. Iniwasan ang sobrang literal na “tinawag ang pangalan ni Jose” at ang makalumang “bilang asawa,” habang pinanatili sa mga talababa ang tunay na kawalang-katiyakan ng pangalan at huling parirala.
