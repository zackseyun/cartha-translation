    issue: Ang “rin” sa “Ibinigay rin niya” ay dagdag na pang-ugnay.
    rationale: Walang katumbas na “also” sa Hebreo. Magkakasunod lamang ang mga kilos ni Faraon, kaya hindi dapat magpahiwatig ang salin ng karagdagang diin o paghahambing.
  - severity: high
    issue: Hindi tumpak ang alternatibo sa talababa c na “lumabas si Jose sa lupain ng Ehipto.”
    rationale: Ang Hebreong עַל אֶרֶץ מִצְרַיִם ay hindi gumagamit ng pang-ukol na nangangahulugang “mula sa.” Ang alternatibong ito ay maaaring magpahiwatig na umalis si Jose palabas ng Ehipto, na salungat sa konteksto at sa parirala.
  - severity: low
    issue: Hindi tahasang naisasama sa pangunahing teksto ang pandiwang “lumabas” (וַיֵּצֵא).
    rationale: Ang “naglakbay” ay nakukuha ang resulta ng kilos, ngunit ang “lumabas ... at naglakbay” ay mas ganap na kumakatawan sa pandiwang Hebreo habang nananatiling natural.
