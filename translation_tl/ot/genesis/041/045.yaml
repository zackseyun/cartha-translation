  to: At tinawag ng Faraon si Jose na Zafenat-panea[a]. Ibinigay niya kay Jose si Asenat, na anak ni Potifera, ang saserdote ng On[b], upang maging asawa niya. Pagkatapos, lumabas si Jose at naglakbay sa buong lupain ng Ehipto[c].
