  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל פַּרְעֹ֔ה חֲל֥וֹם פַּרְעֹ֖ה אֶחָ֣ד ה֑וּא אֵ֣ת אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הִגִּ֥יד לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/025.yaml
  text: Then Joseph said to Pharaoh[a], “Pharaoh’s dreams are one[b]; what God is doing he has declared to Pharaoh.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Jose sa Paraon, “Iisa ang panaginip ng Paraon[a]. Ipinahayag ng Diyos sa Paraon kung ano ang Kanyang ginagawa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa konteksto, ang dalawang panaginip ng Paraon ay may iisang mensahe.
    reason: lexical_clarification
  - marker: b
    text: Maaari ring isalin na “kung ano ang gagawin ng Diyos” o “kung ano ang malapit nang gawin ng Diyos.” Maaaring tumukoy ang anyong Hebreo sa gawaing isinasagawa o sa nalalapit na gagawin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng pangyayari.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Karaniwang anyo ng pangalang Joseph sa modernong saling Tagalog ng Bibliya.
- source_word: אֶל־פַּרְעֹה
  choice: sa Paraon
  rationale: Natural na Tagalog para sa kausap na pinatutungkulan ng pandiwang “sinabi.”
- source_word: חֲלוֹם פַּרְעֹה אֶחָד הוּא
  choice: Iisa ang panaginip ng Paraon
  rationale: Pinananatili ang isahang “panaginip” at ang panaguring “iisa” ng Hebreo. Sa konteksto, tinutukoy nito ang dalawang panaginip bilang iisang mensahe.
- source_word: אֵת אֲשֶׁר
  choice: kung ano ang
  rationale: Likas na Tagalog na panimula sa sugnay na nagsasaad ng nilalaman ng ipinahayag.
- source_word: הָאֱלֹהִים
  choice: ang Diyos
  rationale: Tiyak na pagtukoy sa Diyos; likas sa Tagalog ang “ang Diyos.”
- source_word: עֹשֶׂה
  choice: ginagawa
  rationale: Pinananatili ang aspektong ipinahihiwatig ng participle nang hindi tahasang nagdaragdag ng futurity, bagaman maaaring tumukoy sa malapit nang isagawa sa konteksto.
- source_word: הִגִּיד
  choice: Ipinahayag
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam o sabihin; ang “ipinahayag” ay nagpapanatili ng marangal na himig ng banal na paghahayag.
- source_word: לְפַרְעֹה
  choice: sa Paraon
  rationale: Karaniwang Tagalog para sa di-tuwirang layon.
theological_decisions:
- issue: Pagpapakahulugan sa הָאֱלֹהִים
  choice: ang Diyos
  alternative: ang diyos
  rationale: Tiyak ang reperensiya sa Diyos na naghahayag kay Paraon; ang malaking titik at pantukoy ay natural sa Tagalog at hindi nagdaragdag ng doktrinang wala sa teksto.
- issue: Panahunan ng עֹשֶׂה
  choice: ginagawa
  alternative: gagawin / malapit nang gawin
  rationale: Ang participle ay maaaring magkaroon ng kasalukuyan o prospektibong diwa. Pinananatili ng pangunahing teksto ang mas direktang anyo at inilalagay sa talababa ang posibleng prospektibong kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pag-uulit ng “Paraon,” ang isahang “panaginip,” at ang ambiguwidad ng participle. Ginamit ang “Kanyang” bilang magalang at malinaw na panghalip na tumutukoy sa Diyos.
