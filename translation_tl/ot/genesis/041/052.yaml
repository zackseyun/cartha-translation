  yaml_path: translation/ot/genesis/041/052.yaml
  text: And he named the second Ephraim[a], for God has made me fruitful in the land of my affliction.
translation:
  language: tl
  text: At Efraim[a] ang itinawag niya sa ikalawa, sapagkat ginawa siyang mabunga ng Diyos sa lupain ng kanyang paghihirap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Efraim ay kahawig ng tunog ng Hebreong pananalitang “ginawa akong mabunga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת שֵׁם הַשֵּׁנִי קָרָא
  choice: At tinawag niyang … ang ikalawa
  rationale: Natural na Filipino para sa Hebreong idyoma ng pagbibigay ng pangalan; pinanatili ng “At” ang pang-ugnay na וְ, at malinaw na ang ikalawang anak ang pinangalanan.
- source_word: אֶפְרָיִם
  choice: Efraim
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo; ipinaliliwanag sa talababa ang paglalaro sa tunog at kahulugan.
- source_word: כִּי
  choice: sapagkat sinabi niya
  rationale: Ipinakikilala nito ang paliwanag ni Jose sa pangalan. Idinagdag ang “sinabi niya” bilang likas na panandang diskurso sa Filipino, nang hindi binabago ang nilalaman ng paliwanag.
- source_word: הִפְרַנִי
  choice: Ginawa akong mabunga
  rationale: Pinananatili ang sanhiang diwa ng Hiphil ng פרה at ang kaugnayan nito sa pangalang Efraim; mas tapat ito kaysa sa mas malawak na “pinaunlad” o “pinagtagumpay.”
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman maramihan ang anyong morpolohikal, isahan ang pandiwa at ang tinutukoy sa konteksto, kaya wastong isahan ang salin.
- source_word: בְּאֶרֶץ עָנְיִי
  choice: sa lupain ng aking paghihirap
  rationale: Ang “lupain” ay tuwirang katumbas ng אֶרֶץ, at ang “paghihirap” ay natural at marangal na salin ng עֳנִי na hindi nililimitahan ang saklaw ng dinanas ni Jose.
theological_decisions:
- issue: Ang bunga ng pagpapala ng Diyos sa gitna ng paghihirap ni Jose
  choice: Magkasabay na pinanatili ang pagkilos ng Diyos na nagbigay ng pagiging mabunga at ang paglalarawan ni Jose sa lugar bilang lupain ng kanyang paghihirap.
  alternative: Limitahan ang “aking paghihirap” sa mga pagdurusa lamang bago siya dumating sa Ehipto, o tukuyin itong partikular na pagkakahiwalay sa pamilya.
  rationale: Hindi nililinaw ng talata ang eksaktong saklaw ng paghihirap. Dapat panatilihin ng salin ang tensiyon sa pagitan ng pagpapala at pagdurusa sa halip na lutasin ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “tinawag niyang … ang ikalawa” bilang natural na pahayag sa pagbibigay ng pangalan, habang pinanatili ang metaporang “mabunga” upang maipakita ang Hebreong paglalaro sa pangalan.
