base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/018.yaml
  text: And behold[a], seven cows were coming up from the Nile, healthy in flesh and beautiful in form[c][b], and they grazed in the reeds.
translation:
  language: tl
  text: At narito, mula sa Nilo ay umaahon ang pitong bakang malulusog ang pangangatawan[b] at magaganda ang anyo, at nanginginain ang mga ito sa damuhan sa latian.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Maaari ring “matataba ang laman” o “malulusog ang pangangatawan”; literal na inilalarawan ng Hebreo na mabuti o hitik ang kanilang laman.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa mga tambo” o “sa damo sa latian”; tumutukoy ang Hebreo sa mga halamang tumutubo sa basang pampang ng Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang masiglang panandang diskurso na biglang naghaharap sa tagpo ng panaginip; likas at marangal sa makabagong Tagalog.
- source_word: מִן הַיְאֹר
  choice: mula sa Nilo
  rationale: Sa kontekstong Ehipsiyo ng Genesis, ang יְאֹר ay tumutukoy sa Nilo, hindi lamang sa isang pangkalahatang ilog.
- source_word: עֹלֹת
  choice: umaahon
  rationale: Ang participle ay naglalarawan ng kilos na nagaganap sa mismong tagpo; malinaw itong naipahahayag ng aspektong imperpektibo sa Tagalog.
- source_word: שֶׁבַע פָּרוֹת
  choice: pitong baka
  rationale: Tiyak na mga babaeng bovine ang פָּרוֹת; mas eksakto at natural ang “baka” kaysa sa mas malawak na “mga hayop.”
- source_word: בְּרִיאוֹת בָּשָׂר
  choice: malulusog ang katawan
  rationale: Ipinahahayag ang pisikal na kalusugan o kapunuan na literal na inilalarawan bilang mabuti o malusog sa laman, nang hindi ito nililimitahan sa pagiging mataba lamang.
- source_word: וִיפֹת תֹּאַר
  choice: magaganda ang anyo
  rationale: Malapit sa Hebreong paglalarawan ng kaakit-akit o magandang hugis at hitsura, at natural sa Tagalog.
- source_word: וַתִּרְעֶינָה
  choice: nanginginain
  rationale: Karaniwang salitang Tagalog para sa patuloy na pagkain ng mga hayop sa tumutubong halaman.
- source_word: בָּאָחוּ
  choice: sa damong-latian
  rationale: Tinutukoy ng אָחוּ ang mga halamang tumutubo sa basang pampang o latian sa tabi ng Nilo; mas tiyak ito kaysa “parang.”
