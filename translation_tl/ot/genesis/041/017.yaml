  text: וַ/יְדַבֵּ֥ר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף בַּ/חֲלֹמִ֕/י הִנְ/נִ֥י עֹמֵ֖ד עַל שְׂפַ֥ת הַ/יְאֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/017.yaml
  text: Then Pharaoh said to Joseph[a], “In my dream, behold, I was standing on the bank of the Nile.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng Faraon kay Jose, “Sa panaginip ko, naroon ako at nakatayo sa pampang ng Nilo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “ilog.” Sa kontekstong Ehipsiyo ng Genesis, ang salitang ito ay karaniwang tumutukoy sa Nilo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sinabi
  rationale: Bagaman literal na “nagsalita,” ang “sinabi” ang likas na katumbas sa salaysay na sinusundan ng tuwirang pahayag.
- source_word: פַּרְעֹה
  choice: Faraon
  rationale: Karaniwan at kinikilalang anyo sa modernong saling Tagalog para sa titulong maharlika ng Ehipto.
- source_word: אֶל יוֹסֵף
  choice: kay Jose
  rationale: Malinaw na tinutukoy ng pang-ukol ang taong kinakausap; natural sa Tagalog ang “kay Jose.”
- source_word: בַּחֲלֹמִי
  choice: Sa panaginip ko
  rationale: Tuwirang ipinapahayag ang pang-ukol at hulaping unang panauhan habang nananatiling natural sa Tagalog.
- source_word: הִנְנִי
  choice: naroon ako
  rationale: Ang presentatibong anyo ay nagbibigay ng bigla at matingkad na paglitaw ng nagsasalita sa tagpo; ipinahahayag ito ng “naroon ako” nang hindi gumagamit ng lipas o matigas na “masdan.”
- source_word: עֹמֵד
  choice: nakatayo
  rationale: Tumpak at likas na katumbas ng participle na naglalarawan sa posisyon ng Faraon sa panaginip.
- source_word: עַל שְׂפַת
  choice: sa pampang
  rationale: Ang literal na “sa ibabaw ng labi/gilid” ay tumutukoy sa pampang ng ilog; “sa pampang” ang malinaw at idiomatikong Tagalog.
- source_word: הַיְאֹר
  choice: Nilo
  rationale: Sa kontekstong Ehipsiyo, ang יְאֹר ay karaniwang tumutukoy sa Ilog Nilo; inilalagay sa talababa ang literal na leksikal na anyong “ilog.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang matingkad na presentatibong diwa ng הִנְנִי sa natural na pariralang “naroon ako,” at iniwasan ang artipisyal na literalismong “masdan, ako ay.”
