  text: And behold[a], seven thin ears of grain, scorched by the east wind, were sprouting up after them.
translation:
  language: tl
  text: At narito, pitong maninipis na uhay, na tinuyo ng hanging silangan[a], ang sumisibol kasunod ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinalanta ng hanging silangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang masigla at biglaang panandang pasalaysay na nagpapakilala ng bagong larawan sa panaginip.
- source_word: שֶׁבַע
  choice: pitong
  rationale: Tuwirang salin ng bilang at likas ang anyong pang-uring pamilang sa Tagalog.
- source_word: שִׁבֳּלִים
  choice: uhay
  rationale: Tumutukoy sa bahaging namumunga ng halamang-butil, hindi sa buong tangkay; maikli at tiyak ang “uhay” sa kontekstong pansakahan.
- source_word: דַּקּוֹת
  choice: maninipis
  rationale: Inilalarawan ang mga uhay bilang payat o kulang sa laman; mas angkop sa pisikal na anyo ng uhay ang “maninipis” kaysa “payat.”
- source_word: וּשְׁדוּפֹת קָדִים
  choice: na tinuyo ng hanging silangan
  rationale: Ipinahahayag ang mapanirang epekto ng mainit na hanging silangan sa natural at madaling maunawaang Tagalog, habang itinatala sa talababa ang mas malakas na alternatibong “sinalanta.”
- source_word: צֹמְחוֹת
  choice: ang sumibol
  rationale: Inilalarawan ang paglitaw at pagtubo ng mga uhay sa tagpo ng panaginip; natural sa Tagalog ang aspektong perpektibo sa ganitong salaysay.
- source_word: אַחֲרֵיהֶן
  choice: kasunod ng mga iyon
  rationale: Pinananatili ang posibleng diwang temporal o sunud-sunod na paglitaw at malinaw na tumutukoy sa mga uhay sa naunang talata.
