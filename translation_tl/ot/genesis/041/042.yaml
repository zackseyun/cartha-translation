base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/042.yaml
  text: Then Pharaoh removed his signet ring from his hand and put it on Joseph’s hand[c][b][a], and he clothed him in garments of fine linen and put a gold chain around his neck.
translation:
  language: tl
  text: Pagkatapos, hinubad ng Faraon sa kanyang kamay ang kanyang singsing na pantatak[a] at isinuot iyon sa kamay ni Jose. Dinamitan niya si Jose ng mga kasuotang yari sa pinong lino[b] at isinuot sa leeg ni Jose ang isang gintong kuwintas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “singsing.” Maaaring tumukoy ang salitang Hebreo sa isang singsing sa pangkalahatan, ngunit sa kontekstong ito ay malamang na singsing itong pantatak ng Faraon, na sumasagisag sa kapangyarihang ipinagkatiwala kay Jose.
    reason: lexical_alternative
  - marker: b
    text: Ang “pinong lino” ay salin ng Hebreong שֵׁשׁ, isang uri ng mataas na kalidad na lino na kaugnay ng yaman at karangalan.
    reason: cultural_note
  - marker: c
    text: O “gintong palamuti sa leeg” o “gintong kulyar.” Hindi tiyak ang eksaktong anyo ng palamuti sa leeg na tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: hinubad
  rationale: Ang pandiwa ay nangangahulugang alisin o hubarin. Ang “hinubad” ay natural sa Filipino para sa pag-aalis ng singsing mula sa sariling kamay.
- source_word: טַבַּעְתּוֹ
  choice: kanyang singsing na pantatak
  rationale: Maaaring mangahulugan ang pangngalan ng singsing sa pangkalahatan, ngunit sa kontekstong maharlika ito ay malamang na singsing na ginagamit bilang pantatak at sagisag ng ipinagkatiwalang kapangyarihan.
- source_word: מֵעַל יָדוֹ
  choice: sa kanyang kamay
  rationale: Kasama ng “hinubad,” likas na ipinapahayag ng pariralang ito sa Filipino ang pinagmulan ng singsing nang hindi ginagaya nang matigas ang Hebreong estruktura.
- source_word: וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  choice: isinuot iyon sa kamay ni Jose
  rationale: Bagaman karaniwang nangangahulugang “ibinigay” ang נתן, ang pariralang “sa kamay” at ang singsing bilang layon ay tumutukoy sa aktuwal na pagsusuot o paglalagay nito sa kamay ni Jose.
- source_word: וַיַּלְבֵּשׁ אֹתוֹ
  choice: dinamitan niya si Jose
  rationale: Pinananatili ng “dinamitan” ang pormal at seremonyal na diwa ng pagkakaloob ng kasuotan at malinaw nitong tinutukoy ang gumagawa at ang dinadamitan.
- source_word: בִּגְדֵי שֵׁשׁ
  choice: mga kasuotang yari sa pinong lino
  rationale: Ang שֵׁשׁ ay tumutukoy sa mataas na uring lino na kaugnay ng yaman at karangalan. Ang salin ay tumpak at madaling maunawaan.
- source_word: רְבִד הַזָּהָב
  choice: isang gintong kuwintas
  rationale: Tumutukoy ang רְבִיד sa palamuting isinusuot sa leeg, ngunit hindi tiyak ang eksaktong anyo nito. Ang “gintong kuwintas” ay natural habang ang alternatibong anyo ay inilalahad sa talababa.
- source_word: עַל צַוָּארוֹ
  choice: sa leeg nito
  rationale: Ang “isinuot sa leeg” ay likas na Filipino para sa paglalagay ng palamuti sa leeg. Ginamit ang “nito” upang malinaw na si Jose, hindi ang Faraon, ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang seremonyal na himig ng pagtatalaga kay Jose, habang ginawang natural ang mga kilos ng paghuhubad at pagsusuot. Lahat ng marker [a], [b], at [c] ay nakalagay kaagad matapos ang kaugnay na salita o parirala.
