  naturalness: Natural at marangal sa makabagong Filipino ang “Nang matapos ang dalawang buong taon ... nanaginip ang Faraon, at narito, nakatayo siya ...” Ang “at narito” ay bahagyang pampanitikan ngunit angkop sa matingkad na estilo ng salaysay at hindi lipas.
  terminology: “Faraon” at “Ilog Nilo” ay karaniwan at malinaw na mga anyong Filipino. Ang “dalawang buong taon” ay mahusay na katumbas ng idyomang Hebreo.
  issues:
