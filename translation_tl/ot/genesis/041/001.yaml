  yaml_path: translation/ot/genesis/041/001.yaml
  text: At the end of two full years[a], Pharaoh dreamed, and behold[b], he was standing by the Nile.
translation:
  language: tl
  text: Nang matapos ang dalawang buong taon[a], nanaginip ang Faraon, at narito, nakatayo siya sa tabi ng Ilog Nilo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “dalawang taon ng mga araw,” isang idyomang Hebreo na tumutukoy sa isang ganap na yugto ng dalawang taon.
    reason: lexical_alternative
  - marker: b
    text: O “ilog.” Sa tagpong ito sa Ehipto, ang tinutukoy ay ang Ilog Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: Pagkalipas ng
  rationale: Likas na panandang pasalaysay at temporal sa modernong Tagalog; ipinahahayag nito ang pagdating sa dulo ng itinakdang panahon nang hindi pilit na isinasalin ang pambungad na וַיְהִי.
- source_word: שְׁנָתַיִם יָמִים
  choice: dalawang buong taon
  rationale: Ipinapakita ng idyomang Hebreo na kumpleto ang dalawang-taóng yugto.
- source_word: פַרְעֹה
  choice: ang Faraon
  rationale: Ginamit ang karaniwang anyong Filipino ng titulong maharlika sa Ehipto.
- source_word: חֹלֵם
  choice: nanaginip
  rationale: Natural na salaysay sa Tagalog para sa pangyayaring ipinakikilala ng participle; ang sumusunod na tagpo ang naglalarawan sa nilalaman ng panaginip.
- source_word: וְהִנֵּה
  choice: naroon siya
  rationale: Pinananatili ang bigla at matingkad na pagharap sa tagpo ng panaginip nang hindi gumagamit ng lipas o artipisyal na katumbas ng 'behold.'
- source_word: עֹמֵד עַל
  choice: nakatayo sa tabi ng
  rationale: Inilalarawan ang nagpapatuloy na ayos ng tagpo at ang lokasyon sa gilid ng ilog.
- source_word: הַיְאֹר
  choice: Nilo
  rationale: Sa kontekstong Ehipsiyo, ang יְאֹר ay tumutukoy sa Ilog Nilo; tahasang pangalan ang mas malinaw sa karaniwang mambabasa.
