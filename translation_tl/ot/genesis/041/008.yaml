base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/008.yaml
  text: In the morning[a], his spirit was troubled, so he sent and called all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but there was no one who could interpret them for Pharaoh.
translation:
  language: tl
  text: Kinaumagahan, nabagabag ang kanyang espiritu, kaya nagsugo siya at ipinatawag ang lahat ng salamangkero ng Ehipto at lahat ng pantas nito. Isinalaysay ni Faraon sa kanila ang kanyang panaginip, ngunit walang makapagpaliwanag ng mga iyon[a] kay Faraon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, pang-isahan ang naunang “panaginip,” ngunit pangmaramihan ang panghalip na isinaling “mga iyon.” Maaaring tumukoy ito sa mga bahagi ng napanaginipan o sa karanasan ng panaginip na itinuturing na may maraming bahagi. Isinasalin naman ng ilan ang parirala bilang “makapagpaliwanag niyon.”
    reason: Pinananatili at ipinaliliwanag ang paglipat mula sa pang-isahang pangngalan tungo sa pangmaramihang panghalip sa Hebreo nang hindi itinatakda ang isang tiyak na reperente.
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Kinaumagahan
  rationale: Likas at maikli itong panandang temporal sa salaysay, at pinananatili ang pagkakasunod-sunod ng mga pangyayari.
- source_word: וַתִּפָּעֶם רוּחוֹ
  choice: nabagabag ang kanyang espiritu
  rationale: Ipinahahayag ng pandiwa ang matinding panloob na pagkabalisa; pinananatili ng “espiritu” ang רוּחַ nang hindi ito agad ipinapakahulugang “isip” o “kalooban.”
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: nagsugo siya at ipinatawag
  rationale: 'Pinananatili ang dalawang magkasunod na kilos: nagsugo si Faraon ng mga tao at sa pamamagitan nila ay ipinatawag ang mga dalubhasa.'
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: lahat ng salamangkero ng Ehipto
  rationale: Sa konteksto, tumutukoy ang salita sa mga Ehipsiyong dalubhasa sa mga lihim na sining at pagpapakahulugan ng panaginip; malinaw at nakaugaliang katumbas ang “salamangkero.”
- source_word: כָּל חֲכָמֶיהָ
  choice: lahat ng marurunong doon
  rationale: Ang hulaping pambabae ay tumutukoy sa Ehipto. Natural sa Tagalog ang “doon” at naihihiwalay nito ang pangkalahatang marurunong sa mga espesyalistang salamangkero.
- source_word: וַיְסַפֵּר פַּרְעֹה לָהֶם אֶת חֲלֹמוֹ
  choice: Isinalaysay ni Faraon sa kanila ang kanyang panaginip
  rationale: Pinananatili ang pang-isahang “panaginip” ng tekstong Masoretiko, samantalang natural na ipinapahayag ng “isinalaysay” ang masusing pagkukuwento nito.
- source_word: וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה
  choice: ngunit walang makapagpaliwanag ng mga iyon kay Faraon
  rationale: Ang “makapagpaliwanag” ay malinaw na katumbas ng pagpapakahulugan sa panaginip. Pinananatili ng “mga iyon” ang pangmaramihang panghalip sa Hebreo sa halip na tahimik itong gawing pang-isahan.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang “espiritu” dahil ito ang tuwirang leksikal na katumbas at iniiwasang paliitin ang kahulugan sa “isip” lamang. Inilagay ang talababa sa “mga iyon,” ang mismong bahaging nangangailangan ng paliwanag.
