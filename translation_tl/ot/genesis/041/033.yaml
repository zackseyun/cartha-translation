  text: Now let Pharaoh look for a discerning and wise man[a], and appoint him over the land of Egypt.
translation:
  language: tl
  text: Ngayon, humanap ang Paraon ng isang lalaking may unawa at marunong[a], at italaga niya itong mamahala sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pumili ang Paraon ng isang lalaking may unawa at marunong.” Ang pandiwang Hebreo ay maaaring mangahulugang tumingin, humanap, o pumili ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Minamarkahan nito ang paglipat ni Jose mula sa pagpapaliwanag ng panaginip tungo sa praktikal na payo; ipinahihiwatig ng “Kaya” ang kaugnayan ng payo sa naunang paliwanag.
- source_word: יֵרֶא
  choice: humanap
  rationale: Ang jussive ng ראה sa kontekstong ito ay hindi lamang literal na pagtingin kundi paghahanap o pagpili ng angkop na tao.
- source_word: פַרְעֹה
  choice: ang Paraon
  rationale: Karaniwang anyong Filipino ng titulong maharlika sa Ehipto.
- source_word: אִישׁ
  choice: isang lalaking
  rationale: Pinananatili ang panlalaking isahan ng Hebreo at ang konteksto ng isang lalaking opisyal.
- source_word: נָבוֹן
  choice: may unawa
  rationale: Nagpapahayag ng kakayahang umunawa at humatol nang tama, lalo na sa praktikal na pangangasiwa.
- source_word: וְחָכָם
  choice: at marunong
  rationale: Likas na katambal ng “may unawa” sa Filipino at nagsasaad ng karunungan at kakayahang gamitin ito.
- source_word: וִישִׁיתֵהוּ
  choice: at italaga niya ito upang mamahala
  rationale: Ang שׂים ay literal na maglagay o magtakda; sa kontekstong pampamahalaan, malinaw na ipinahihiwatig ang pagtatalaga sa kapangyarihan.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: sa buong lupain ng Ehipto
  rationale: Ang עַל dito ay nagsasaad ng pamamahala o awtoridad. Ginawang tahasan ang ideyang ito sa “upang mamahala,” habang pinananatili ang “lupain ng Ehipto”; ang “buong” ay nagpapalinaw sa pambansang saklaw na ipinahihiwatig ng parirala.
