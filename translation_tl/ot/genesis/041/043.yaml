base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/043.yaml
  text: He had him ride in the second chariot that he had[a], and they cried out before him, “Abrek!” And he set him over all the land of Egypt.
translation:
  language: tl
  text: Ipinasakay niya si Jose sa ikalawang karwahe na pag-aari niya, at sumigaw sila sa unahan ni Jose, “Abrek!”[a] At itinalaga niya si Jose na mamahala sa buong lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan ng “Abrek.” Maaaring isa itong sigaw ng pagpupugay na Ehipsiyo o Hebreo. Madalas itong inuunawa bilang “Lumuhod kayo!” o katulad nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכֵּב אֹתוֹ
  choice: Ipinasakay niya si Jose
  rationale: 'Ang Hiphil ng רכב ay nagpapahayag ng sanhi: pinasakay ng paraon si Jose. Nilinaw ang mga panghalip sa pamamagitan ng mga pangalan upang maging natural at maiwasan ang kalituhan sa Tagalog.'
- source_word: בְּמִרְכֶּבֶת הַמִּשְׁנֶה אֲשֶׁר־לוֹ
  choice: sa pangalawang karwahe na pag-aari niya
  rationale: Pinananatili ng “pangalawang karwahe” ang ideya ng ikalawang ranggo, at ng “na pag-aari niya” ang tahasang sugnay na אֲשֶׁר־לוֹ.
- source_word: וַיִּקְרְאוּ לְפָנָיו
  choice: at sumigaw ang mga tao sa unahan nito
  rationale: Ang קרא rito ay pampublikong pagsigaw o paghahayag sa harap ng prusisyon. Ang “sa unahan nito” ay likas sa Tagalog at malinaw na tumutukoy sa karwahe ni Jose.
- source_word: אַבְרֵךְ
  choice: Abrek
  rationale: Malabo at hindi tiyak ang kahulugan ng salita, kaya pinanatili ang transliterasyon sa pangunahing teksto sa halip na gawing tiyak ang isang interpretasyon.
- source_word: וְנָתוֹן אֹתוֹ
  choice: Sa gayon, inilagay niya si Jose bilang tagapamahala
  rationale: Ipinahahayag nito ang bunga at opisyal na pagtatalaga sa konteksto; ang “bilang tagapamahala” ay natural na paglalahad ng awtoridad na ipinahihiwatig ng kasunod na עַל.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: sa buong lupain ng Ehipto
  rationale: Ang parirala ay tumutukoy sa saklaw ng awtoridad ni Jose sa buong teritoryo ng Ehipto.
