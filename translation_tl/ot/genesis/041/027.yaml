base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/027.yaml
  text: And the seven thin and bad cows that came up after them are seven years[a], and the seven empty heads of grain, scorched by the east wind[b], will be seven years of famine.
translation:
  language: tl
  text: At ang pitong payat at pangit na bakang umahon kasunod ng mga iyon ay pitong taon; at ang pitong uhay na walang laman, na nilanta ng hanging silangan, ay magiging pitong taon ng taggutom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרַקּוֹת
  choice: payat
  rationale: Sa paglalarawan sa mga baka, tumutukoy ito sa kapayatan o kawalan ng laman ng katawan. Natural at malinaw sa modernong Filipino ang “payat.”
- source_word: וְהָרָעֹת
  choice: pangit
  rationale: Hindi moral na kasamaan ang tinutukoy kundi ang hindi magandang anyo o kalagayan ng mga baka sa panaginip. Sa konteksto, mas tiyak at natural ang “pangit” kaysa “masama.”
- source_word: הָעֹלֹת אַחֲרֵיהֶן
  choice: na umahon kasunod ng mga iyon
  rationale: Pinananatili ng “umahon” ang kilos ng pag-ahon sa panaginip at malinaw na ipinahahayag ng “kasunod” ang pagkakasunod-sunod.
- source_word: שֶׁבַע שָׁנִים הֵנָּה
  choice: ay pitong taon
  rationale: Tuwirang ipinapahayag ang simbolikong pagkakakilanlan ng pitong baka at pitong taon nang hindi nagdaragdag ng paliwanag.
- source_word: הַשִׁבֳּלִים
  choice: uhay
  rationale: Ang “uhay” ang natural at tumpak na katawagan sa bahaging namumunga ng butil; mas maikli at mas idiomatiko ito kaysa isang paliwanag na parirala.
- source_word: הָרֵקוֹת
  choice: walang laman
  rationale: Tumutukoy ito sa mga uhay na walang buo o hitik na butil, kaya mas malinaw ang “walang laman” kaysa literal na “payat.”
- source_word: שְׁדֻפוֹת הַקָּדִים
  choice: nilanta ng hanging silangan
  rationale: Inilalarawan ng parirala ang pinsalang dulot ng mainit at tuyong hanging mula sa silangan. Ang “nilanta” ay likas na salitang pang-agrikultura at pinananatili ang pasibong diwa.
- source_word: יִהְיוּ
  choice: ay magiging
  rationale: Ang anyong di-ganap ay may pasulong o prediktibong lakas sa paliwanag ni Jose, na natural na naihahayag ng “magiging.”
- source_word: שְׁנֵי רָעָב
  choice: pitong taon ng taggutom
  rationale: Ang “taggutom” ang karaniwan at eksaktong salin para sa malawakang kakulangan ng pagkain sa salaysay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal ngunit payak na himig. Pinanatili ang dalawang magkatimbang na sugnay at ang simbolikong pagtutumbas ng mga elemento ng panaginip sa mga taon. Walang talababa sapagkat walang mahalagang leksikal o teolohikal na kalabuan na kailangang ipaliwanag sa talatang ito.
