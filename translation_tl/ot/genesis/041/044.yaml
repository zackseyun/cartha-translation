base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/044.yaml
  text: Then Pharaoh said to Joseph[a], “I am Pharaoh[b], and without you no man will lift up his hand or his foot in all the land of Egypt.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng Paraon kay Jose, “Ako ang Paraon, at kung wala ka[a], walang sinumang magtataas ng kamay o paa[b] sa buong lupain ng Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang walang pahintulot mo,” na nagdiriing walang sinuman sa Ehipto ang maaaring kumilos nang hiwalay sa awtoridad ni Jose.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “magtataas ng kaniyang kamay o ng kaniyang paa,” isang idyoma para sa paggawa ng anumang kilos o hakbang.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay; natural sa modernong Tagalog ang “Pagkatapos, sinabi.”
- source_word: פַּרְעֹה
  choice: Paraon
  rationale: Karaniwang anyong Tagalog ng titulong maharlika sa Ehipto sa salaysay ni Jose.
- source_word: אֲנִי פַרְעֹה
  choice: Ako ang Paraon
  rationale: Tuwirang pinananatili ang mariing pagpapakilala at pahayag ng soberanong awtoridad nang hindi dinaragdagan ang kahulugan.
- source_word: וּבִלְעָדֶיךָ
  choice: at kung wala ka
  rationale: Pinananatili ang payak at bahagyang malabong diwa ng pagiging hiwalay o pagkilos nang wala si Jose; ipinapaliwanag sa talababa ang posibleng diin sa kaniyang pahintulot.
- source_word: לֹא יָרִים אִישׁ
  choice: walang sinumang magtataas
  rationale: Ang “walang sinuman” ay natural na panlahatang katumbas ng generic na אִישׁ, samantalang pinananatili ng “magtataas” ang kongkretong larawan ng Hebreong idyoma.
- source_word: אֶת יָדוֹ וְאֶת רַגְלוֹ
  choice: ng kamay o paa
  rationale: Pinananatili ang Hebreong larawan, habang ang “o” ay likas sa negatibong pahayag sa Tagalog at ipinahihiwatig ang anumang pagkilos.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: sa buong lupain ng Ehipto
  rationale: Malapit sa Hebreo at natural na pananalita para sa kabuuan ng teritoryo ng Ehipto.
