  text: Pharaoh was angry with his servants[a], and he put me in custody in the house of the captain of the guard[b], me and the chief baker.
translation:
  language: tl
  text: Nagalit ang Paraon sa kanyang mga lingkod, at ipinadetine niya ako[a] sa bahay ng pinuno ng mga bantay[b], kasama ang punong panadero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inilagay sa ilalim ng pagbabantay.” Ang salitang Hebreo ay tumutukoy sa pagkadetine o pagkakapiit sa ilalim ng pagbabantay at hindi kinakailangang mangahulugan ng isang pormal na bilangguan.
    reason: lexical_alternative
  - marker: b
    text: Ang titulong “pinuno ng mga bantay” ay mas literal na “pinuno ng mga tagapatay” o “pinuno ng mga berdugo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַף
  choice: nagalit
  rationale: Tuwirang ipinapahayag ng pandiwa ang galit; natural ang “nagalit” at hindi nito pinalalabis ang tindi.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Sa konteksto ng palasyo, tumutukoy ito sa mga taong naglilingkod sa Paraon, kabilang ang katiwala ng kopa at punong panadero. Pinananatili ng “mga lingkod” ang ugnayang ipinahihiwatig ng Hebreo nang hindi awtomatikong nagpapakahulugang mga alipin.
- source_word: בְּמִשְׁמַר
  choice: ipiniit
  rationale: Ipinahihiwatig ng salita ang pagkakapiit o pagkakadetine sa ilalim ng pagbabantay, ngunit hindi nito kailangang tukuyin ang isang pormal na gusali ng bilangguan.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: bahay ng pinuno ng mga bantay
  rationale: Ginamit ang kinikilalang kahulugan ng titulong panghukuman sa salaysay ni Jose. Ang literal na kaugnayan nito sa mga tagapatay o berdugo ay inilagay sa talababa upang mapanatili ang mahalagang leksikal na detalye.
- source_word: שַׂר הָאֹפִים
  choice: punong panadero
  rationale: Malinaw at likas itong tawag sa namumuno sa mga panadero.
- source_word: אֹתִי ... וְאֵת שַׂר הָאֹפִים
  choice: ako ... kasama ang punong panadero
  rationale: Pinananatili nito na kapwa sila ipiniit, habang sumusunod sa natural na ayos ng pangungusap sa makabagong Tagalog.
