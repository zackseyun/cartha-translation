  text: וְ/יִקְבְּצ֗וּ אֶת כָּל אֹ֨כֶל֙ הַ/שָּׁנִ֣ים הַ/טֹּבֹ֔ת הַ/בָּאֹ֖ת הָ/אֵ֑לֶּה וְ/יִצְבְּרוּ בָ֞ר תַּ֧חַת יַד פַּרְעֹ֛ה אֹ֥כֶל בֶּ/עָרִ֖ים וְ/שָׁמָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/035.yaml
  text: Let them gather all the food of these coming good years[a], and let them store up grain under Pharaoh’s authority as food in the cities[b], and let them keep it.
translation:
  language: tl
  text: Ipunin nila ang lahat ng pagkain sa mabubuting taong ito na darating, at mag-imbak sila ng butil sa ilalim ng pamamahala ng Paraon[a] bilang pagkain sa mga lungsod, at ingatan nila ito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa ilalim ng kamay ng Paraon,” isang idyomang Hebreo na tumutukoy sa kapangyarihan o pangangasiwa.
    reason: lexical_alternative
  - marker: b
    text: O “bantayan nila ito” o “panatilihin nila ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִקְבְּצוּ
  choice: Ipunin nila
  rationale: Ang anyong di-ganap ay ginagamit dito bilang mungkahi o utos sa panukala ni Jose. Likas sa modernong Tagalog ang “Ipunin nila” para sa ganitong diwa.
- source_word: כָּל אֹכֶל
  choice: lahat ng pagkain
  rationale: Malawak ang saklaw ng אֹכֶל at maaaring tumukoy sa pagkain o panustos; pinananatili ng “pagkain” ang pangkalahatang kahulugan.
- source_word: הַשָּׁנִים הַטֹּבוֹת הַבָּאֹת הָאֵלֶּה
  choice: sa mabubuting taong ito na darating
  rationale: Pinananatili nito ang paglalarawan sa mga taon bilang mabuti, darating, at partikular na tinutukoy ng “ito,” nang hindi nagdaragdag ng bilang na wala sa parirala.
- source_word: וְיִצְבְּרוּ
  choice: mag-imbak sila
  rationale: Ang pandiwa ay tumutukoy sa pagtitipon o pagtatambak ng maraming ani para itago; malinaw at natural ang “mag-imbak” sa kontekstong pang-administratibo.
- source_word: בָּר
  choice: butil
  rationale: Tumutukoy ito sa butil, lalo na sa nagiik na butil; masyadong makitid ang pagtukoy sa isang partikular na uri gaya ng trigo.
- source_word: תַּחַת יַד פַּרְעֹה
  choice: sa ilalim ng pamamahala ng Paraon
  rationale: Ang literal na “sa ilalim ng kamay ng Paraon” ay isang idyoma para sa kapangyarihan, pangangasiwa, o kontrol. Ipinahahayag ng “pamamahala” ang diwa nang natural.
- source_word: אֹכֶל בֶּעָרִים
  choice: bilang pagkain sa mga lungsod
  rationale: Ipinakikita ng parirala na ang nakaimbak na butil ay magsisilbing panustos na nakalaan sa mga lungsod.
- source_word: וְשָׁמָרוּ
  choice: at ingatan nila ito
  rationale: Maaaring mangahulugan ang שׁמר na ingatan, bantayan, o panatilihin. Saklaw ng “ingatan” ang pag-iingat sa nakaimbak na butil para sa hinaharap.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang mga anyong “Ipunin nila,” “mag-imbak sila,” at “ingatan nila” upang maipahayag ang magkakaugnay na mga mungkahi ni Jose. Inayos ang mga panandang talababa upang ang [a] ay tumukoy sa idyoma tungkol sa pamamahala ng Paraon at ang [b] sa saklaw ng pandiwang שׁמר.
