  text: And the abundance in the land will not be known because of that famine afterward[b][a], for it will be very severe.
translation:
  language: tl
  text: At hindi na makikilala[a] ang kasaganaan sa lupain dahil sa taggutom na kasunod nito, sapagkat magiging napakatindi ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malalaman” o “mapapansin.”
    reason: Saklaw ng pandiwang Hebreo ang pagiging alam, nakikilala, o napapansin.
lexical_decisions:
- source_word: יִוָּדַע
  choice: mapapansin
  rationale: Ang Niphal ng ידע ay maaaring tumukoy sa pagiging alam, nakikilala, o napapansin. Sa konteksto, ipinahihiwatig na mapapawi sa karanasan ng mga tao ang dating kasaganaan dahil sa tindi ng taggutom.
- source_word: הַשָּׂבָע
  choice: ang kasaganaan
  rationale: Tumutukoy ito sa saganang ani at pagkain sa mga taon ng kasaganaan; malinaw at natural sa modernong Tagalog ang “kasaganaan.”
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Ang tinutukoy ay ang teritoryong saklaw ng salaysay, hindi kinakailangang ang buong daigdig.
- source_word: מִפְּנֵי
  choice: dahil sa
  rationale: 'Ipinapahayag ng parirala ang sanhi: hindi na mapapansin ang kasaganaan dahil sa darating na taggutom.'
- source_word: הָרָעָב הַהוּא אַחֲרֵי כֵן
  choice: sa taggutom na kasunod nito
  rationale: Pinananatili nito ang pagkakasunod ng kasaganaan at taggutom sa natural na Tagalog. Ang demonstratibong הַהוּא ay muling ipinahahayag sa hulihan bilang “taggutom na iyon.”
- source_word: כִּי כָבֵד הוּא מְאֹד
  choice: sapagkat magiging napakatindi ng taggutom na iyon
  rationale: Ang literal na “napakabigat” ay idyomatikong nangangahulugang napakatindi o lubhang malubha kapag taggutom ang tinutukoy. Ang tahasang pagbanggit muli sa taggutom ay nag-aalis ng malabong reperensiya sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mapapansin” sa pangunahing teksto upang natural na ipahayag na hindi na mahahalata ang dating kasaganaan, habang pinanatili sa talababa ang leksikal na lawak ng Hebreo.
