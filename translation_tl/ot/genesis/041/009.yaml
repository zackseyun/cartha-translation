  yaml_path: translation/ot/genesis/041/009.yaml
  text: Then the chief cupbearer spoke to Pharaoh[a], saying, “Today I remember my offenses.”
translation:
  language: tl
  text: 'Pagkatapos, nagsalita kay Faraon ang pinuno ng mga tagapaghain ng inumin: “Ngayon ay naaalala ko ang mga pagkakasala ko.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kasalanan ko,” “mga paglabag ko,” o “mga pagkakamali ko.” Malawak ang saklaw ng salitang Hebreo at maaaring tumukoy sa maling gawa, moral man o kaugnay ng tungkulin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang “Pagkatapos” at hindi kailangang mekanikal na ulitin ang “At.”
- source_word: שַׂר הַמַּשְׁקִים
  choice: ang pinuno ng mga tagapaghain ng inumin
  rationale: Tumutukoy ang titulong panghukuman sa opisyal na namamahala sa paghahain ng inumin kay Faraon. Malinaw ito sa karaniwang mambabasa at iniiwasan ang lipas o mapanlinlang na “punong katiwala ng kopa.”
- source_word: אֶת־פַּרְעֹה
  choice: kay Faraon
  rationale: Bagaman pananda ng tuwirang layon ang אֶת, karaniwang ginagamit sa Tagalog ang “nagsalita kay” para sa taong kinakausap.
- source_word: לֵאמֹר
  choice: —
  rationale: Ang infinitibong panimula sa tuwirang pananalita ay likas na ipinahihiwatig ng tutuldok sa Tagalog; ang tahasang “na sinasabi” ay magiging mabigat at di-likas.
- source_word: אֶת חֲטָאַי
  choice: ang mga pagkakasala ko
  rationale: Maaaring tumukoy ang חטא sa kasalanan, paglabag, o pagkakamali. Pinananatili ng “mga pagkakasala” ang moral at opisyal na saklaw nito nang hindi nililimitahan sa isang uri ng kamalian.
- source_word: אֲנִי מַזְכִּיר
  choice: naaalala ko
  rationale: Ang Hiphil ng זכר ay maaaring mangahulugang ipaalaala, banggitin, o alalahanin. Sa konteksto, ibinabalik ng tagapagsalita sa isip at binabanggit sa harap ni Faraon ang dati niyang mga pagkakasala; “naaalala ko” ang pinakanatural na pahayag.
- source_word: הַיּוֹם
  choice: Ngayon
  rationale: Natural na makabagong katumbas ito ng temporal na diin ng Hebreo.
theological_decisions:
- issue: Saklaw ng חֲטָאַי
  choice: mga pagkakasala ko
  alternative: mga kasalanan ko; mga pagkakamali ko; mga paglabag ko
  rationale: Hindi tiyak sa salita lamang kung moral na kasalanan, opisyal na paglabag, o mas pangkalahatang pagkakamali ang tinutukoy. Pinananatili ng salin at talababa ang malawak na saklaw sa kontekstong panghukuman.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tagapaghain ng inumin” upang madaling maunawaan ang tungkulin sa korte; ang ayos ng pangungusap ay natural sa Tagalog habang pinananatili ang pag-usad at diin ng Hebreo.
