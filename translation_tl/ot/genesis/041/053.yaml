  text: Then the seven years of abundance that had been in the land of Egypt came to an end.
translation:
  language: tl
  text: Natapos ang pitong taon ng kasaganaang umiral sa lupain ng Ehipto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכְלֶינָה
  choice: Natapos
  rationale: Ang pandiwang כלה sa wayyiqtol ay nagsasaad na sumapit sa wakas ang tinutukoy na panahon. Likas at tuwiran sa makabagong Tagalog ang “Natapos.”
- source_word: שֶׁבַע שְׁנֵי
  choice: ang pitong taon
  rationale: Tuwirang ipinapahayag ang bilang at ang pangngalang nasa anyong construct; ang “pitong taon” ang natural na ayos sa Tagalog.
- source_word: הַשָּׂבָע
  choice: ng kasaganaan
  rationale: Tumutukoy sa saganang ani at pagkain sa naunang pitong taon. Ang “kasaganaan” ay malinaw, marangal, at angkop sa konteksto.
- source_word: אֲשֶׁר הָיָה
  choice: '[ipinahiwatig sa pariralang “sa lupain ng Ehipto”]'
  rationale: Ang relasyong ‘na nangyari/umiral’ ay natural na naipapaloob sa Tagalog sa lokatibong parirala; ang tahasang “na nagkaroon” ay magiging mabigat at hindi kailangan.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang אֶרֶץ bilang “lupain,” habang ginagamit ang tradisyonal at madaling makilalang pangalang “Ehipto.”
