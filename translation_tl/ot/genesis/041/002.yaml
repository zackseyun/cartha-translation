  text: And behold[a], seven cows were coming up from the Nile, beautiful in appearance and fat in flesh[c][b], and they were grazing in the reed grass.
translation:
  language: tl
  text: At narito, pitong baka ang umaahon mula sa Nilo[a]. Magaganda ang anyo at matataba ang laman[b] ng mga ito. Nanginain sila sa damo sa latian[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ilog”; sa kontekstong Ehipsiyo, ang salitang Hebreo ay karaniwang tumutukoy sa Nilo.
    reason: lexical_alternative
  - marker: b
    text: O “magaganda silang tingnan.”
    reason: lexical_alternative
  - marker: c
    text: O “sa gitna ng mga tambo” o “sa damong-singaw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang masigla at pantawag-pansing panandang pandiskurso sa salaysay ng panaginip.
- source_word: הַיְאֹר
  choice: Nilo
  rationale: Sa kontekstong Ehipsiyo, ang יְאֹר ay tumutukoy sa Ilog Nilo, hindi lamang sa isang di-tiyak na ilog.
- source_word: עֹלֹת
  choice: ang umaahon
  rationale: Ipinahahayag ng participle ang kilos na kasalukuyang nagaganap sa tanawin ng panaginip.
- source_word: פָּרוֹת
  choice: baka
  rationale: Tumutukoy ito sa mga babaeng bovine; sa natural na Tagalog, sapat at tuwiran ang 'baka.'
- source_word: יְפוֹת מַרְאֶה
  choice: Magaganda silang tingnan
  rationale: Natural na inilalarawan nito ang kaaya-ayang panlabas na anyo habang pinananatili ang diwa ng מַרְאֶה.
- source_word: וּבְרִיאֹת בָּשָׂר
  choice: matataba ang katawan
  rationale: Pinananatili ang diin sa kapunuan o katabaan ng laman, sa halip na palitan lamang ng pangkalahatang 'malulusog.'
- source_word: וַתִּרְעֶינָה
  choice: Nanginain sila
  rationale: Tuwirang katumbas ng pagpapastol o pagkain ng damo, at natural sa salaysay na Tagalog.
- source_word: בָּאָחוּ
  choice: sa damong-latian
  rationale: Tumutukoy sa halamang tumutubo sa latian o sa mga pampang ng Nilo; mas tiyak ito kaysa 'parang.'
