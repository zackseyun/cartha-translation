  source_fidelity: Tumpak na naihahatid ang pagkakasunod ng pangyayari, ang mga pangmaramihang baka, ang magkatapat na paglalarawan ng kanilang anyo at pangangatawan, at ang paggising ng Faraon. Ang “kinain” ay hindi mas matindi kaysa sa Hebreong אכל, at ang “matataba” ay angkop sa konteksto bilang katapat ng “payat ang katawan.”
  naturalness: Likas at malinaw ang modernong Tagalog. Ang pag-uulit ng “pangit/maganda ang anyo” at “payat/matataba” ay nakapagpapanatili ng paralelismo ng panaginip nang hindi nagiging hindi natural.
