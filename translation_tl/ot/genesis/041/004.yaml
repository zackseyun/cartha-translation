  text: Then the cows ugly in appearance and thin in flesh ate the seven cows beautiful in appearance and fat[a], and Pharaoh awoke.
translation:
  language: tl
  text: Pagkatapos, kinain ng mga bakang pangit ang anyo at payat ang katawan ang pitong bakang maganda ang anyo at matataba[a]. At nagising ang Faraon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pangit ang anyo ... at malulusog.” Ang mga salitang Hebreo ay mas literal na “masama” at “malusog/mataba,” ngunit sa konteksto ay binibigyang-diin ang pisikal na pagkakaiba ng mga bakang pangit at payat sa mga bakang maganda at mataba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: Pagkatapos, kinain
  rationale: Ang anyong wayyiqtol na pambabaeng maramihan ay nagsasaad ng kasunod na pangyayari sa panaginip. Karaniwang kahulugan ng pandiwa ang “kinain”; hindi ginamit ang mas matinding “nilapa.”
- source_word: הַפָּרוֹת
  choice: mga baka
  rationale: Ang פָּרוֹת ay pambabaeng maramihan at tumutukoy sa mga bakang nasa panaginip.
- source_word: רָעוֹת הַמַּרְאֶה
  choice: pangit ang anyo
  rationale: Bagaman literal na “masama” ang רָעוֹת, kapag inuugnay sa מַרְאֶה ay natural itong tumutukoy sa pangit na hitsura.
- source_word: וְדַקֹּת הַבָּשָׂר
  choice: at payat ang katawan
  rationale: Literal na tumutukoy ang parirala sa pagiging manipis ng laman. Ang “payat ang katawan” ay malinaw at likas sa modernong Tagalog habang pinananatili ang pisikal na paglalarawan.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: ang pitong baka
  rationale: Tuwirang isinasalin ang tiyak na layon, bilang, at pangngalan.
- source_word: יְפֹת הַמַּרְאֶה
  choice: maganda ang anyo
  rationale: Pinananatili nito ang parallel na kaibahan sa “pangit ang anyo” at ang tahasang pagtukoy sa hitsura.
- source_word: וְהַבְּרִיאֹת
  choice: at matataba
  rationale: Maaaring mangahulugang malusog, mataba, o malaman ang בְּרִיאֹת. Sa tuwirang kaibahan nito sa mga payat na baka, ang konkretong “matataba” ang higit na angkop.
- source_word: וַיִּיקַץ פַּרְעֹה
  choice: At nagising ang Faraon
  rationale: Tuwirang ipinahahayag ng pandiwa ang paggising. Ang hiwalay na pangungusap ay natural sa Tagalog at malinaw na nagtatapos sa tagpo ng panaginip.
