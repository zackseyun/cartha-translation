base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/046.yaml
  text: Joseph was thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from before Pharaoh and traveled through all the land of Egypt.
translation:
  language: tl
  text: Tatlumpung taong gulang si Jose nang humarap siya sa Faraon, hari ng Ehipto. At umalis si Jose mula sa presensiya ng Faraon at naglakbay sa buong lupain ng Ehipto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: Tatlumpung taong gulang
  rationale: Likas na salin sa Tagalog ng Hebreong idyoma para sa edad, nang hindi ginagaya ang literal na ‘anak ng tatlumpung taon.’
- source_word: בְּעָמְדוֹ לִפְנֵי פַּרְעֹה
  choice: nang humarap siya sa Faraon
  rationale: Ang infinitive construct ay nagsasaad ng panahon. Sa kontekstong maharlikang pagharap, natural na ipinahahayag ng ‘humarap’ ang pagtayo o pagharap sa presensiya ng Faraon.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: na hari ng Ehipto
  rationale: Malinaw at natural na appositional na pagkakakilanlan kay Faraon sa modernong Tagalog.
- source_word: וַיֵּצֵא יוֹסֵף מִלִּפְנֵי פַרְעֹה
  choice: umalis si Jose mula sa harapan ng Faraon
  rationale: Pinananatili ang kilos ng pag-alis at ang pag-uulit ng konseptong לִפְנֵי, habang nananatiling nauunawaan sa Tagalog.
- source_word: וַיַּעְבֹר בְּכָל אֶרֶץ מִצְרָיִם
  choice: naglakbay sa buong lupain ng Ehipto
  rationale: Ipinahahayag ang malawak na pagkilos ni Jose sa lupain nang hindi nagdaragdag ng tiyak na layuning administratibo na hindi tahasang sinabi sa talata.
- source_word: וְ / וַ
  choice: Pagkatapos
  rationale: Ginagamit sa ikalawang pangungusap bilang natural na pang-ugnay sa sunod na kilos; hindi nilagyan ng hiwalay na panimulang ‘Ngayon’ ang talata.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang karaniwang mga pangalang Jose, Faraon, at Ehipto. Pinanatili ang ‘mula sa harapan ng Faraon’ upang maaninag ang pag-uulit ng Hebreong לִפְנֵי, kahit bahagyang mas pormal ito kaysa ‘mula sa presensiya.’
