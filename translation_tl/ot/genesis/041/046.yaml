  to: Tatlumpung taong gulang si Jose nang humarap siya sa Faraon, hari ng Ehipto. At umalis si Jose mula sa presensiya ng Faraon at naglakbay sa buong lupain ng Ehipto.
  rationale: Pinalitan ang pang-ugnay na “Pagkatapos” ng “At” upang huwag magdagdag ng diin sa pagkakasunod-sunod na hindi tahasang nasa Hebreo. Pinakinis din ang apposition at ang idyomang tumutukoy sa pag-alis ni Jose mula sa haring kaniyang kaharap, nang hindi binabago ang kahulugan o saklaw ng kilos.
