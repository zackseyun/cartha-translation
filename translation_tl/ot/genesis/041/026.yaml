base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/026.yaml
  text: The seven good cows are seven years[a], and the seven good ears of grain are seven years; it is one dream.
translation:
  language: tl
  text: Ang pitong magagandang baka ay pitong taon, at ang pitong magagandang uhay ay pitong taon; iisa itong panaginip.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּרֹת
  choice: mga baka
  rationale: Tumutukoy ito sa mga babaeng bovine sa panaginip ng Faraon. Sa natural na Filipino, sapat at tiyak sa konteksto ang “mga baka.”
- source_word: הַטֹּבֹת
  choice: mabubuti
  rationale: Pinananatili ng “mabubuti” ang malawak at tuwirang kahulugan ng Hebreo nang hindi nililimitahan sa pagiging malusog o maganda lamang.
- source_word: שָׁנִים
  choice: mga taon
  rationale: Ito ang tuwirang katumbas at hayagang pagpapakahulugan sa mga sagisag ng panaginip.
- source_word: שִׁבֳּלִים
  choice: mga uhay
  rationale: Ang “uhay” ang natural na salitang Filipino para sa bahaging nasa dulo ng tangkay na kinalalagyan ng mga butil; hindi na kailangang dagdagan ng “ng trigo” sapagkat hindi tinutukoy ng Hebreo ang isang partikular na uri ng butil.
- source_word: חֲלוֹם אֶחָד הוּא
  choice: Iisang panaginip lamang iyon
  rationale: Ipinapahayag nito na ang dalawang hanay ng sagisag ay bumubuo ng isang nagkakaisang panaginip. Ginagawang natural sa Filipino ng “lamang” ang diin ng “iisa” nang hindi nagdaragdag ng bagong kahulugan.
- source_word: הֵנָּה
  choice: ay
  rationale: Ang pambabaeng pangmaramihang panghalip ay gumaganap bilang kopula sa Hebreo; natural itong ipinahahayag sa Filipino sa pamamagitan ng “ay.”
