  yaml_path: translation/ot/genesis/041/005.yaml
  text: Then he slept and dreamed a second time[a], and behold, seven ears of grain were coming up on one stalk[b], plump and good.
translation:
  language: tl
  text: Pagkatapos ay natulog siya at nanaginip sa ikalawang pagkakataon. Narito, pitong uhay[a] ang tumutubo sa iisang tangkay—hitik[b] at maganda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pitong ulo ng butil.” Ang salitang Hebreo ay maaaring tumukoy sa bahaging namumunga ng butil.
    reason: lexical_alternative
  - marker: b
    text: O “malulusog” o “punô.” Inilalarawan ng salitang Hebreo ang mga uhay na mahusay ang pagkalaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישָׁן
  choice: Pagkatapos, natulog siyang muli
  rationale: Isinusulong ng wayyiqtol ang pagkakasunod-sunod ng salaysay. Ipinahihiwatig ng “muli” na bumalik siya sa pagtulog matapos ang naunang panaginip, ayon sa konteksto.
- source_word: וַיַּחֲלֹם שֵׁנִית
  choice: at nanaginip sa ikalawang pagkakataon
  rationale: Tuwirang pinananatili ang adberbiyal na diwa ng שֵׁנִית, sa halip na gawing lamang na “nanaginip muli.”
- source_word: וְהִנֵּה
  choice: Narito
  rationale: Pinananatili ang masiglang pantukoy na naghaharap ng bagong tagpo sa loob ng panaginip.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: pitong uhay
  rationale: Ang “uhay” ang likas at tumpak na katawagang Filipino sa bahaging namumunga ng butil; nililinaw sa talababa na mga uhay ito ng butil.
- source_word: עֹלֹת
  choice: ang tumutubo
  rationale: Ipinakikita ng pandiwaring Hebreo ang nagpapatuloy at malinaw na kilos sa tanawin ng panaginip.
- source_word: בְּקָנֶה אֶחָד
  choice: sa iisang tangkay
  rationale: Likas sa Filipino ang “sa iisang tangkay” para sa maraming uhay na lumilitaw o tumutubo sa isang tangkay.
- source_word: בְּרִיאוֹת
  choice: hitik
  rationale: Sa butil, natural na ipinahahayag ng “hitik” ang pagiging siksik, puno, at mahusay ang pagkalaman, nang hindi ginagamit ang di-likas na “mataba” para sa mga uhay.
- source_word: וְטֹבוֹת
  choice: at maganda
  rationale: Sa paglalarawan ng ani, ang “maganda” ay likas na tumutukoy sa mahusay na anyo at kalidad habang pinananatili ang malawak na positibong diwa ng טוֹב.
