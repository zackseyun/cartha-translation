translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang karaniwang salitang agrikultural na “uhay,” at pinanatili ang masiglang “Narito” para sa וְהִנֵּה. Ang gitling bago ang huling paglalarawan ay tumutulong na malinaw na iugnay ang “hitik at maganda” sa pitong uhay.
