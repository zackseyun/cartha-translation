  text: 'And it happened just as he interpreted for us[a], so it was: me he restored to my office[b], but him he hanged.'
translation:
  language: tl
  text: 'At ayon nga sa ipinakahulugan niya sa amin, gayon ang nangyari: ibinalik niya ako sa dati kong tungkulin, ngunit siya ay ibinitin niya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: At nangyari nga ang lahat ayon sa
  rationale: Ipinahahayag nito ang ganap na pagtutugma ng kinalabasan sa interpretasyon. Ang “nga” at “ang lahat” ay natural na naghahatid sa Filipino ng diin ng Hebreong כַּאֲשֶׁר ... כֵּן הָיָה nang hindi inuulit nang alanganin ang “nangyari.”
- source_word: פָּתַר לָנוּ
  choice: pagkakapaliwanag niya sa amin
  rationale: Sa konteksto ng panaginip, ang פתר ay tumutukoy sa pagbibigay-kahulugan o interpretasyon. Natural sa kasalukuyang Filipino ang “pagkakapaliwanag” at malinaw ang reperensiya sa naunang paliwanag sa mga panaginip.
- source_word: אֹתִי הֵשִׁיב עַל כַּנִּי
  choice: ibinalik niya ako sa aking tungkulin
  rationale: Ang כַּנִּי ay idyoma para sa dating puwesto o opisyal na katungkulan ng tagapagdala ng kopa. Pinananatili ng ayos ang malinaw na pagkakaiba ng sinapit ng dalawang tauhan.
- source_word: וְאֹתוֹ תָלָה
  choice: ngunit ibinitin niya ang isa
  rationale: Ang “ngunit” ay natural na nagpapakita ng matinding pagsalungat ng dalawang kinalabasan. Ang “ibinitin” ay malapit sa pangunahing diwa ng תלה at hindi higit na nililinaw kaysa sa Hebreo ang tiyak na paraan ng pagbitay o paglalantad ng bangkay.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hindi tahasang pinangalanan ang Paraon sapagkat pahiwatig lamang sa Hebreo ang simuno ng “ibinalik” at “ibinitin”; malinaw ito mula sa konteksto. Ginamit ang “ang isa” sa halip na paulit-ulit na panghalip upang maging likas ang kontrast sa Filipino.
