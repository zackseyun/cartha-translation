  source_fidelity: Kailangang baguhin nang bahagya. Ang "pagkakapaliwanag" ay mas malawak na "explanation" kaysa sa pagpapakahulugan ng panaginip (פָּתַר), at ang "ang isa" ay hindi likas o sapat na tiyak na katumbas ng contrastive na "siya" sa Hebreo. Ang rebisyon ay malinaw na pinananatili ang pagtutugma ng interpretasyon at kaganapan, gayundin ang magkasalungat na kapalaran ng dalawang opisyal.
  naturalness: Marangal at madaling unawain ang pangkalahatang rehistro ng draft, ngunit mas natural at tuwiran sa modernong Filipino ang "ayon sa ipinakahulugan niya sa amin, gayon ang nangyari". Ang ayos na "siya ay ibinitin niya" ay nagbibigay ng kinakailangang paghahambing sa "ako" nang hindi gumagamit ng di-likas na "ang isa."
  terminology: Ang "ipinakahulugan" ang angkop na termino para sa pagbibigay-kahulugan sa panaginip. Ang "dati kong tungkulin" ay wastong paglilinaw ng idyomatikong עַל־כַּנִּי bilang pagbabalik sa dating opisyal na puwesto. Ang "ibinitin" ay pinananatili bilang maingat na katumbas ng תָלָה nang hindi nagpapasiya ng higit pa sa ipinahihiwatig ng teksto.
