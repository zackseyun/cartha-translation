  text: 'This is the matter that I spoke to Pharaoh: what God is doing he has shown to Pharaoh[a].'
translation:
  language: tl
  text: 'Ito ang bagay na sinabi ko sa Paraon: ipinakita ng Diyos sa Paraon ang malapit na niyang gawin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “ang ginagawa ng Diyos.” Ang anyong Hebreo ay maaaring tumukoy sa kasalukuyan o sa napipintong kilos; sa konteksto ng pagpapaliwanag sa panaginip, ang “malapit na niyang gawin” ay tumutukoy sa mga pangyayaring darating.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא הַדָּבָר
  choice: Ito ang bagay
  rationale: Ginagawang natural na pangungusap na pagkakakilanlan sa Tagalog ang panghalip at pariralang pangngalan; ang “bagay” ay tumutukoy sa nilalaman ng naunang paliwanag.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל־פַּרְעֹה
  choice: na sinabi ko sa Paraon
  rationale: Ang “sinabi” ay natural sa makabagong Tagalog para sa pahayag ni Jose, at pinananatili ng “sa Paraon” ang kausap na tahasang binanggit sa Hebreo.
- source_word: הָאֱלֹהִים
  choice: ang Diyos
  rationale: Karaniwang pantukoy ito sa Diyos sa konteksto at natural na isinasalin bilang “ang Diyos.”
- source_word: עֹשֶׂה
  choice: malapit na niyang gawin
  rationale: Ang participle ay maaaring tumukoy sa kasalukuyan o napipintong kilos; dahil ipinapaliwanag ni Jose ang mga pangyayaring darating, malinaw at likas sa Tagalog ang napipintong diwa.
- source_word: הֶרְאָה אֶת־פַּרְעֹה
  choice: ipinakita ... sa Paraon
  rationale: Ang Hiphil ng ראה ay “ipakita” o “ipakita upang makita”; ang ayos na ito ay malinaw at natural sa Tagalog.
theological_decisions:
- issue: Pagpapahayag ng panahon ng kilos ng Diyos sa עֹשֶׂה
  choice: malapit na niyang gawin
  alternative: ginagawa niya
  rationale: Hindi tiyak sa participle lamang kung kasalukuyan o napipinto ang kilos. Pinapaboran ng konteksto ng hulang panaginip ang napipintong kilos, habang inilalahad sa talababa ang tunay na alternatibo.
- issue: Pagtukoy ng הָאֱלֹהִים sa pananalita ni Jose
  choice: ang Diyos
  alternative: ang diyos
  rationale: Sa konteksto, tinutukoy ni Jose ang Diyos na kumikilos at naghahayag; hindi kailangang magdagdag ng anumang katawagang teolohikal na wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang pangalang “Paraon” at iniwasan ang sobrang literal na ayos na magiging asiwa sa Tagalog.
