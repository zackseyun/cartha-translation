  text: And all the earth came to Egypt to Joseph to buy grain[a], because the famine was severe in all the earth.
translation:
  language: tl
  text: Ang mga tao mula sa buong daigdig[a] ay nagpunta sa Ehipto kay Jose upang bumili ng butil, sapagkat matindi ang taggutom sa buong daigdig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tao mula sa buong lupain” o “mga tao mula sa buong mundo.” Ang Hebreong אֶרֶץ ay maaaring mangahulugang “daigdig,” “lupain,” o “bansa”; dito, malamang na malawak itong tumutukoy sa mga lupaing naapektuhan ng taggutom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: ang mga tao mula sa buong daigdig
  rationale: Literal na “ang buong daigdig,” ngunit mga tao ang tinutukoy na nagpunta. Ginawang tahasan ang ipinahihiwatig na mga naninirahan habang pinananatili ang malawak at retorikal na saklaw ng parirala.
- source_word: בָּאוּ מִצְרַיְמָה
  choice: nagpunta ... sa Ehipto
  rationale: Ipinahihiwatig ng hulaping paturol sa מִצְרַיְמָה ang paggalaw patungong Ehipto. Likas sa pananaw at balarilang Filipino ang “nagpunta ... sa Ehipto.”
- source_word: לִשְׁבֹּר
  choice: upang bumili ng butil
  rationale: Sa salaysay tungkol sa taggutom, ang pandiwa ay idyomatikong tumutukoy sa pagbili o pagkuha ng butil, hindi sa pangkalahatang pagbili lamang.
- source_word: אֶל יוֹסֵף
  choice: kay Jose
  rationale: Pinananatili ang literal na direksiyong “kay Jose” at hindi ito pinakikitid sa “mula kay Jose,” bagaman siya ang tagapangasiwa ng pagbebenta ng butil.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng pagpunta ng mga tao sa Ehipto at angkop sa marangal ngunit makabagong rehistro.
- source_word: חָזַק הָרָעָב
  choice: matindi ang taggutom
  rationale: Ang literal na ideyang “malakas ang taggutom” ay likas na ipinahahayag sa Filipino bilang “matindi ang taggutom.”
- source_word: בְּכָל הָאָרֶץ
  choice: sa buong daigdig
  rationale: Pinananatili ang pag-uulit at malawak na saklaw ng אֶרֶץ sa hulihan ng talata.
