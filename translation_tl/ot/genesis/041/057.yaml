  naturalness: 'Likas at makabago ang “bumili ng butil” at “matindi ang taggutom.” Mas natural at malinaw ang ayos na may simuno sa unahan: “Ang mga tao mula sa buong daigdig ay nagpunta sa Ehipto kay Jose.”'
  terminology: Ang “Ehipto,” “Jose,” “butil,” at “taggutom” ay angkop. Ang “buong daigdig” ay pinananatili sa dalawang paglitaw upang tumbasan ang inuulit na Hebrew אָרֶץ. Dahil tahasang idinagdag sa salin ang “mga tao mula sa,” dapat itong isama rin sa mga alternatibo ng talababa.
