  text: אַתָּה֙ תִּהְיֶ֣ה עַל בֵּיתִ֔/י וְ/עַל פִּ֖י/ךָ יִשַּׁ֣ק כָּל עַמִּ֑/י רַ֥ק הַ/כִּסֵּ֖א אֶגְדַּ֥ל מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/040.yaml
  text: You shall be over my house[a], and all my people shall obey your command. Only with respect to the throne will I be greater than you.
translation:
  language: tl
  text: Ikaw ang mamamahala sa aking sambahayan, at susunod sa iyong utos ang buong bayan ko.[a] Sa trono lamang ako magiging higit sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “at sa iyong bibig ay hahalik ang buong bayan ko.” Dito, ang pananalita ay karaniwang inuunawang tumutukoy sa pagsunod sa utos ni Jose o pagbibigay-galang sa kaniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל בֵּיתִי
  choice: mamamahala sa aking sambahayan
  rationale: Ipinahahayag ng עַל kasama ng בֵּיתִי ang pamamahala o pangangasiwa. Ang “sambahayan” ay likas sa Filipino at maaaring tumukoy kapwa sa sambahayan at sa saklaw ng administrasyon ng palasyo.
- source_word: וְעַל־פִּיךָ יִשַּׁק
  choice: susunod sa iyong utos
  rationale: Literal na tinutukoy ng פִּיךָ ang “iyong bibig,” at karaniwang nangangahulugang “hahalik” ang יִשַּׁק. Sa kontekstong ito, ipinahihiwatig ng parirala ang pagsunod o pagbibigay-galang ayon sa utos ni Jose; pinananatili sa talababa ang literal na anyo at ang tunay na leksikal na tensiyon.
- source_word: כָּל עַמִּי
  choice: ang buong bayan ko
  rationale: Ang עַם ay kolektibong tumutukoy sa mga taong nasasakupan ni Paraon. Mas natural dito ang “buong bayan ko” kaysa “lahat ng aking mga tao.”
- source_word: רַק הַכִּסֵּא
  choice: Sa trono lamang
  rationale: Ang רַק ay nagtatakda ng tanging eksepsiyon, at ang הַכִּסֵּא ay literal na “ang trono,” na kumakatawan sa natatanging katayuang maharlika ni Paraon.
- source_word: אֶגְדַּל מִמֶּךָּ
  choice: ako magiging higit sa iyo
  rationale: Ang גדל na may מן ay nagpapahayag ng pagiging nakahihigit. Pinananatili ng salin ang paghahambing at nililimitahan ito ng naunang pariralang “Sa trono lamang.”
