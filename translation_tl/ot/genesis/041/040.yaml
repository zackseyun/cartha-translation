  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mamamahala” upang malinaw na ihatid ang ipinagkatiwalang awtoridad, habang ang “sambahayan,” “bayan,” at “trono” ay nagpapanatili ng sinaunang maharlikang konteksto nang hindi nagiging lipas o teknikal.
