  yaml_path: translation/ot/genesis/041/024.yaml
  text: And the thin ears swallowed up the seven good ears[a]. Then I told the magicians[c][b], but there was no one who could explain it to me.
translation:
  language: tl
  text: Nilamon ng maninipis na uhay ang pitong magagandang uhay.[a] Isinalaysay ko ito sa mga salamangkero[b], ngunit walang makapagpaliwanag nito sa akin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga ulo ng butil” sa halip na “mga uhay.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na isinaling “mga salamangkero” ay tumutukoy sa mga espesyalistang Ehipsiyo sa ritwal o sa pagbibigay-kahulugan sa mga panaginip.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin na “ngunit walang makapagbigay-kahulugan nito para sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְןָ
  choice: Nilamon
  rationale: Tuwirang pinananatili ang matingkad at di-pangkaraniwang larawan sa panaginip na nilalamon ng isang pangkat ng mga uhay ang isa pa.
- source_word: שִׁבֳּלִים
  choice: mga uhay
  rationale: Sa kontekstong pansakahan, tumutukoy ito sa bahaging namumunga ng butil; ang “uhay” ang likas at maikling katumbas sa Filipino.
- source_word: הַדַּקֹּת
  choice: maninipis
  rationale: Pinananatili ang payak na kahulugan ng pang-uri at ang kaibahan nito sa magagandang uhay nang hindi dinaragdagan ng ideyang tuyot o bansot.
- source_word: הַטֹּבוֹת
  choice: magagandang
  rationale: Ang טוֹב ay malawak na “mabuti/maganda.” Ang “magagandang uhay” ay likas sa Filipino at hindi tahasang nagpapalit dito ng mas tiyak na “malulusog” o “hitik.”
- source_word: וָאֹמַר אֶל
  choice: Isinalaysay ko ito sa
  rationale: Sa konteksto, ang sinabi ni Faraon sa mga dalubhasa ay ang panaginip. Ginagawang natural sa Filipino ang ipinahihiwatig na layon nang hindi sinasabing humingi siya ng interpretasyon sa mismong sugnay na ito.
- source_word: הַחַרְטֻמִּים
  choice: mga salamangkero
  rationale: Ito ang maikli at pamilyar na katawagan sa mga Ehipsyong espesyalista sa ritwal at pagpapakahulugan sa mga panaginip at tanda; nililinaw ng talababa ang sinaunang saklaw nito.
- source_word: וְאֵין מַגִּיד לִי
  choice: ngunit walang makapagpaliwanag nito sa akin
  rationale: Sa konteksto ng panaginip, ang נגד ay tumutukoy sa pagpapahayag o pagpapabatid ng kahulugan. Ang “makapagpaliwanag” ay natural ngunit pinananatili sa talababa ang mas tiyak na “makapagbigay-kahulugan.”
theological_decisions:
- issue: Kung ang huling sugnay ay “magpaliwanag” o “magbigay-kahulugan” sa panaginip
  choice: makapagpaliwanag nito sa akin
  alternative: makapagbigay-kahulugan nito para sa akin
  rationale: Hindi lubos na tinutukoy ng pandiwang נגד ang teknikal na gawain ng interpretasyon, bagaman malinaw iyon sa konteksto. Pinananatili sa pangunahing teksto ang mas malawak na diwa at inilalagay ang mas tiyak na pagbasa sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “uhay” at ang pamilyar na “salamangkero,” habang nililinaw sa mga talababa ang posibleng alternatibo at ang sinaunang papel ng mga חַרְטֻמִּים.
