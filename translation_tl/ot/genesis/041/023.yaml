  yaml_path: translation/ot/genesis/041/023.yaml
  text: And behold[a], seven ears, thin and scorched by the east wind[b], were sprouting after them.
translation:
  language: tl
  text: At narito, pitong uhay na lanta, maninipis, at pinatuyo ng hanging silangan[a] ang tumutubo pagkatapos ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinalanta ng hanging silangan.”
    reason: Ipinapakita ang posibleng paglalarawan sa שְׁדֻפוֹת bilang pinsalang dulot ng hanging silangan.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At naroon
  rationale: Pinananatili ang bigla at malinaw na paglitaw ng panibagong tanawin sa salaysay ng panaginip, sa likas na modernong Tagalog.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: pitong uhay
  rationale: Ang שִׁבֳּלִים ay tumutukoy sa mga uhay o ulo ng butil, hindi lamang sa mga tangkay.
- source_word: צְנֻמוֹת
  choice: lanta
  rationale: Inihahayag ang kalagayang nangulubot o nalanta at hindi ito isinasama lamang sa kasunod na דַּקּוֹת.
- source_word: דַּקּוֹת
  choice: maninipis
  rationale: Pinananatili bilang hiwalay na paglalarawan ang pagiging manipis o kakaunti ang laman ng mga uhay.
- source_word: שְׁדֻפוֹת קָדִים
  choice: pinaso ng hanging silangan
  rationale: Ipinapakita ang pinsalang dulot ng mainit at tuyong hanging nagmumula sa silangan; ang “pinaso” ay malinaw at angkop sa pananim.
- source_word: צֹמְחוֹת אַחֲרֵיהֶם
  choice: na tumutubong kasunod ng mga iyon
  rationale: Ang pandiwaring participle ay inilalarawang nagpapatuloy ang pagtubo sa tagpo, at ang “mga iyon” ay tumutukoy sa naunang pitong uhay.
