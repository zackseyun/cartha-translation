- from: At naroon, pitong uhay na lanta, maninipis, at pinaso ng hanging silangan[a], na tumutubong kasunod ng mga iyon.
  to: At narito, pitong uhay na lanta, maninipis, at pinatuyo ng hanging silangan[a] ang tumutubo pagkatapos ng mga iyon.
  rationale: Pinalitan ang pambungad upang mas tapat na maipahayag ang וְהִנֵּה, inayos ang sintaks upang mas malinaw ang saklaw ng “tumutubo,” at ginawang “pinatuyo” ang paglalarawan ng epekto ng hanging silangan. Napanatili ang magkahiwalay na paglalarawan na “lanta” at “maninipis,” pati ang sinadyang diin ng Hebreo.
