base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/056.yaml
  text: And the famine was over all the face of the earth[a], and Joseph opened all that was in them and sold grain to Egypt[b], and the famine grew severe in the land of Egypt.
translation:
  language: tl
  text: Laganap ang taggutom sa buong lupain. Binuksan ni Jose ang lahat ng mga kamalig[a] at nagbenta ng butil sa mga Ehipsiyo. Lalong tumindi ang taggutom sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lahat ng nasa mga iyon.” Hindi tahasang binanggit ang mga sisidlan o imbakan; ayon sa konteksto, mga kamalig o imbakan ng butil ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָב
  choice: ang taggutom
  rationale: Ang רָעָב ay tumutukoy rito sa malawak at matinding kakulangan ng pagkain; “taggutom” ang likas at karaniwang salin sa salaysay.
- source_word: עַל כָּל פְּנֵי הָאָרֶץ
  choice: sa buong lupain
  rationale: Ipinahahayag nito na laganap ang taggutom sa buong saklaw ng lupain. Ang הָאָרֶץ ay maaaring “lupain” o “daigdig”; pinananatili ng “lupain” ang saklaw na hindi tiyak nang hindi ipinipilit na buong planeta ang tinutukoy.
- source_word: וַיִּפְתַּח ... אֶת כָּל אֲשֶׁר בָּהֶם
  choice: binuksan ... ang lahat ng kamalig
  rationale: Ang parirala ay eliptikal at hindi tahasang pinapangalanan ang binuksan. Sa konteksto, mga kamalig o imbakan ng butil ang tinutukoy. Nililinaw ito sa pangunahing teksto, habang inilalahad sa talababa ang anyong literal at ang tunay na kalabuan.
- source_word: וַיִּשְׁבֹּר לְמִצְרַיִם
  choice: nagbenta ng butil sa mga Ehipsiyo
  rationale: Sa kontekstong ito, ang שׁבר ay idyomatikong nangangahulugang magbenta ng butil o panustos. Ang “mga Ehipsiyo” ang likas na kolektibong diwa ng לְמִצְרַיִם.
- source_word: וַיֶּחֱזַק
  choice: lalong tumindi
  rationale: Bagaman pangunahing nangangahulugang “lumakas” ang חזק, kapag taggutom ang simuno ay nangangahulugan itong naging higit na matindi.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Tapat itong kumakatawan sa buong pariralang Hebreo at angkop sa marangal na estilong pasalaysay ng Genesis.
