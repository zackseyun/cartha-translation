revisions:
- from: Pumasok ang mga iyon sa tiyan ng mga payat na baka[a], ngunit hindi mahalatang nakapasok ang mga iyon sa kanilang tiyan. Masama pa rin ang anyo ng mga payat na baka, gaya noong una. Pagkatapos, nagising ako.
  to: Pumasok sa tiyan ng mga payat na baka[a] ang matatabang baka, ngunit hindi napansin na nakapasok ang matatabang baka sa kanilang tiyan. Masama ang anyo ng mga payat na baka, gaya noong una. Pagkatapos, nagising ako.
  rationale: Tahasan ang mga reperenteng ‘matatabang baka’ at ‘payat na baka’ upang maiwasan ang kalabuan na likha ng magkaparehong pambabaeng panghalip sa salaysay. Pinanatili ang pag-uulit ng ‘pumasok sa ... tiyan,’ gaya ng pag-uulit sa Hebreo, at inalis ang ‘pa rin’ upang hindi magdagdag ng aspektuwal na diin na hindi tuwirang nasa teksto.
