  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Tahasang pinangalanan ang mga payat na baka upang linawin ang salit-salit na reperente ng pambabaeng maramihang mga panghalip sa Hebreo. Hindi pinanatili ang footnote b ng English consultation layer sapagkat wala itong malinaw na tekstuwal na alternatibo at inuulit lamang ang isang sugnay.
