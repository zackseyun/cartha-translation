  yaml_path: translation/ot/genesis/041/021.yaml
  text: And they went into their bellies[a], but it was not known that they had gone into their bellies, and their appearance was bad, just as at the beginning[b]. Then I awoke.
translation:
  language: tl
  text: Pumasok sa tiyan ng mga payat na baka[a] ang matatabang baka, ngunit hindi napansin na nakapasok ang matatabang baka sa kanilang tiyan. Masama ang anyo ng mga payat na baka, gaya noong una. Pagkatapos, nagising ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa kanilang kaloob-looban/gitna”; sa kontekstong ito, tumutukoy ito sa tiyan ng mga payat na baka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה אֶל קִרְבֶּנָה
  choice: Pumasok ang mga iyon sa tiyan ng mga payat na baka
  rationale: Ang pambabaeng maramihang pandiwa ay tumutukoy sa mga bakang kinain sa naunang konteksto, samantalang ang hulaping pambabaeng maramihan sa קִרְבֶּנָה ay tumutukoy sa mga payat na baka. Nililinaw ng salin ang dalawang reperente upang maiwasan ang maling diwang pumasok ang mga baka sa sarili nilang tiyan. Ang 'tiyan' ay likas na katumbas sa kontekstong pisikal ng panaginip.
- source_word: וְלֹא נוֹדַע כִּי בָאוּ אֶל קִרְבֶּנָה
  choice: ngunit hindi mahalatang nakapasok ang mga iyon sa kanilang tiyan
  rationale: Ang Niphal na נוֹדַע ay nagsasaad na hindi napansin o nahalata ang pangyayari. Ang 'hindi mahalata' ay natural sa Filipino at tumutugma sa biswal na konteksto; pinananatili rin ang pag-uulit ng pagpasok sa tiyan.
- source_word: וּמַרְאֵיהֶן רַע
  choice: Masama pa rin ang anyo ng mga payat na baka
  rationale: Pinananatili ng 'masama ang anyo' ang malawak na kahulugan ng רַע nang hindi ito nililimitahan sa 'pangit' o 'payat.' Idinagdag ang reperenteng 'mga payat na baka' para sa malinaw na Filipino; ang 'pa rin' ay inilalantad ang pagpapatuloy na ipinahihiwatig ng kasunod na paghahambing.
- source_word: כַּאֲשֶׁר בַּתְּחִלָּה
  choice: gaya noong una
  rationale: Maikli, natural, at tumpak na temporal na paghahambing sa dati nilang anyo.
- source_word: וָאִיקָץ
  choice: Pagkatapos, nagising ako
  rationale: Ipinahahayag ang kasunod na pangyayari ng wayyiqtol sa natural na daloy ng salaysay sa Filipino.
