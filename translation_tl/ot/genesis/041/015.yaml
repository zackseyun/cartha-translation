base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/015.yaml
  text: And Pharaoh said to Joseph, “I have dreamed a dream, and there is no one to interpret it. But I have heard it said about you that when you hear a dream, you can interpret it.”
translation:
  language: tl
  text: Sinabi ng Faraon kay Jose, “Nanaginip ako, at walang makapagbibigay-kahulugan dito. Ngunit narinig ko tungkol sa iyo na kapag nakarinig ka ng panaginip, nabibigyan mo ito ng kahulugan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְתִּי
  choice: Nanaginip ako
  rationale: Natural na modernong Tagalog para sa Hebreong cognate construction na literal na ‘nanaginip ako ng isang panaginip’; hindi kailangan ang di-likas na pag-uulit upang maipahayag ang diwa.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: ngunit walang makapagpaliwanag nito
  rationale: Ang participle na פֹתֵר ay tumutukoy sa taong magbibigay-kahulugan sa panaginip; malinaw at natural ang ‘makapagpaliwanag’ sa konteksto.
- source_word: שָׁמַעְתִּי עָלֶיךָ לֵאמֹר
  choice: Narinig kong sinasabi tungkol sa iyo
  rationale: Pinananatili ang impersonal na ulat at hindi nagdaragdag ng tiyak na pinagmulan ng balita.
- source_word: תִּשְׁמַע חֲלוֹם לִפְתֹּר אֹתוֹ
  choice: kapag nakarinig ka ng panaginip, kaya mo itong ipaliwanag
  rationale: 'Inilalahad ang idiomatikong diwa ng Hebreo: sa pagkarinig ni Jose ng isang panaginip, nagagawa niyang ipaliwanag ito. Ang ‘kaya mo’ ay nagpapanatili sa iniulat na kakayahan, hindi sa garantiya o utos.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na magalang at dignified. Ginamit ang karaniwang anyong ‘Faraon’ at ‘Jose.’ Pinanatili ang bahagyang kakaibang pahayag na ‘makarinig ka ng panaginip’ dahil mahalaga ito sa anyo at diwa ng pinagmulang Hebreo, habang ginawang natural ang kabuuang pangungusap.
