  yaml_path: translation/ot/genesis/041/016.yaml
  text: Joseph answered Pharaoh[a], saying, “It is not in me[b]; God will answer for Pharaoh’s well-being.”
translation:
  language: tl
  text: Sumagot si Jose kay Paraon, “Hindi ko ito kaya; ang Diyos ang magbibigay ng sagot tungkol sa kapakanan ng Paraon.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya: “Hindi ako; ang Diyos ang sasagot tungkol sa kapakanan ng Paraon.” Ang salitang Hebreo para sa “kapakanan” ay maaari ring mangahulugang “kapayapaan,” “mabuting kalagayan,” o “kanais-nais na kahihinatnan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן יוֹסֵף אֶת־פַּרְעֹה
  choice: Sumagot si Jose sa Paraon
  rationale: Likas na salaysay sa Tagalog para sa karaniwang Hebreong pormula ng pagsagot, habang malinaw na si Paraon ang kausap.
- source_word: בִּלְעָדָי
  choice: Hindi sa akin magmumula ang sagot
  rationale: Ipinahahayag ang pagbubukod sa sarili ni Jose bilang pinagmumulan ng sagot. Bahagyang inilantad ang ipinahihiwatig na “sagot” upang maging malinaw at natural sa Tagalog.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Ang pangngalan ay tumutukoy rito sa Diyos at ang kasunod na pandiwa ay nasa anyong isahan.
- source_word: יַעֲנֶה
  choice: magbibigay … ng sagot
  rationale: Natural itong katumbas sa konteksto ng pagbibigay-kahulugan sa panaginip at pinananatili ang diwa ng pagtugon.
- source_word: אֶת־שְׁלוֹם פַּרְעֹה
  choice: sa Paraon ng sagot na para sa kanyang ikabubuti
  rationale: Ang שְׁלוֹם ay maaaring tumukoy sa kapayapaan, kalagayan, o mabuting kahihinatnan. Ang “ikabubuti” ay malinaw sa modernong Tagalog ngunit hindi nito nililimitahan ang diwa sa panloob na kapayapaan lamang.
theological_decisions:
- issue: Pinagmumulan ng pagbubunyag at pagpapakahulugan
  choice: Itinatanggi ni Jose na sa kanya nagmumula ang sagot at itinuturo niya ang Diyos bilang nagbibigay nito.
  alternative: “Hindi ako; ang Diyos ang magbibigay sa Paraon ng isang mapayapang sagot.”
  rationale: Malinaw sa paghahambing ng בִּלְעָדָי at אֱלֹהִים יַעֲנֶה na hindi inaangkin ni Jose ang kakayahang ito. Hindi dinaragdagan ng salin ang talata ng paliwanag na doktrinal.
- issue: Saklaw ng שְׁלוֹם
  choice: ikabubuti
  alternative: kapayapaan; mabuting kahihinatnan; kalagayan
  rationale: Pinananatili ng “ikabubuti” ang malawak na ideya ng kapakanan o kanais-nais na kalagayan, samantalang kinikilala sa talababa ang tunay na kalabuan ng Hebreong parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paraon,” ang karaniwang anyo sa saling biblikal na Tagalog, at iniwasan ang sobrang literal ngunit di-likas na “wala sa akin.”
