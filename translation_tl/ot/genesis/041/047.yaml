  yaml_path: translation/ot/genesis/041/047.yaml
  text: During the seven years of abundance[a], the land produced by handfuls.
translation:
  language: tl
  text: Sa pitong taon ng kasaganaan, namunga nang dakot-dakot[a] ang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga dakot” o “sa pamamagitan ng mga dakot.” Inilalarawan ng Hebreong salita ang ani sa pamamagitan ng mga dakot o fistful; ipinahihiwatig nito ang napakasaganang ani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ
  choice: namunga
  rationale: Ang עשה ay karaniwang nangangahulugang “gumawa,” ngunit kapag ang lupain ang simuno sa kontekstong pansakahan, tumutukoy ito sa pagluwal o pagbibigay nito ng bunga. Likas at malinaw sa Tagalog ang “namunga.”
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa sakahang lupain ng Ehipto sa salaysay, hindi sa buong daigdig. Pinananatili ng “lupain” ang konkretong diwang pansakahan.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: Sa pitong taon ng kasaganaan
  rationale: Malinaw nitong ipinapahayag ang panahong tinutukoy at isinasalin ang שׂבע bilang saganang ani o kasapatan nang hindi nililimitahan sa isang uri ng pananim.
- source_word: לִקְמָצִים
  choice: nang dakot-dakot
  rationale: Ang קְמָץ ay “isang dakot” o “isang kamao.” Pinananatili ng “dakot-dakot” ang kongkretong larawan at ang di-pangkaraniwang paraan ng paglalarawan sa napakaraming ani.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Pinanatili ang matingkad at medyo di-pangkaraniwang larawang “dakot-dakot” sa halip na palitan lamang ng abstraktong “sagana.”
