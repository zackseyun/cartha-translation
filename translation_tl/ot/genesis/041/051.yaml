  source_fidelity: 'Tapat ang salin sa Hebreo: malinaw na naipahayag ang pagbibigay ni Jose ng pangalan sa kanyang panganay, ang sanhiang diwa ng נַשַּׁנִי sa “Ipinalimot sa akin,” at ang dalawang saklaw ng “lahat”—ang paghihirap niya at ang sambahayan ng kanyang ama. Hindi nilulutas o pinapalambot ng salin ang sinadyang tensiyon ng pahayag tungkol sa pagkalimot sa sambahayan ng ama.'
