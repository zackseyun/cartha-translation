  text: וַ/יִּקְרָ֥א יוֹסֵ֛ף אֶת שֵׁ֥ם הַ/בְּכ֖וֹר מְנַשֶּׁ֑ה כִּֽי נַשַּׁ֤/נִי אֱלֹהִים֙ אֶת כָּל עֲמָלִ֔/י וְ/אֵ֖ת כָּל בֵּ֥ית אָבִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/051.yaml
  text: Joseph called the name of the firstborn Manasseh[a], for he said[c][b], “God has made me forget all my hardship and all my father’s house.”
translation:
  language: tl
  text: Tinawag ni Jose na Manases[a] ang kanyang panganay, sapagkat sinabi niya, “Ipinalimot sa akin ng Diyos ang lahat ng paghihirap ko[b] at ang buong sambahayan ng aking ama.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Manases ay kahawig sa tunog ng salitang Hebreo na nangangahulugang “nagpapalimot” o “ipinalimot.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “lahat ng hirap ko” o “lahat ng mabigat kong pagpapagal.”
    reason: lexical_alternative
  - marker: c
    text: Ang “sambahayan ng aking ama” ay isang Hebreong pahayag na tumutukoy sa pamilya o angkan ng isang tao sa panig ng kanyang ama.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם הַבְּכוֹר
  choice: Tinawag ni Jose na ... ang kanyang panganay
  rationale: Likas na Filipino para sa Hebreong pormulang ‘tinawag ang pangalan ng panganay,’ habang pinananatili ang tahasang pagtukoy sa panganay.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino; ipinaliliwanag sa talababa ang paglalaro sa tunog at sa pandiwang ‘magpalimot.’
- source_word: כִּי
  choice: sapagkat sinabi niya
  rationale: Ipinahahayag nito na ang kasunod ay paliwanag ni Jose sa ipinangalan niya; ang ‘sinabi niya’ ay likas na pagpapalinaw sa Filipino bagaman ipinahihiwatig lamang sa Hebreo.
- source_word: נַשַּׁנִי
  choice: Ipinalimot sa akin
  rationale: 'Pinananatili ang sanhiang diwa: ang Diyos ang naging dahilan ng pagkalimot ni Jose.'
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang konteksto at pandiwa ay nagpapakitang iisang Diyos ang tinutukoy.
- source_word: כָּל עֲמָלִי
  choice: ang lahat ng paghihirap ko
  rationale: Saklaw ng ‘paghihirap’ ang hirap, pagdurusa, at mabigat na pagpapagal na maaaring ipahiwatig ng עָמָל.
- source_word: וְאֵת כָּל בֵּית אָבִי
  choice: at ang buong sambahayan ng aking ama
  rationale: Ang ‘sambahayan ng aking ama’ ay likas ngunit malapit na katumbas ng Hebreong idyoma para sa pamilya o angkan sa panig ng ama.
theological_decisions:
- issue: Maaaring ipahiwatig na kinalimutan ni Jose ang sambahayan ng kanyang ama
  choice: Tuwirang pinanatili ang pahayag na ipinalimot ng Diyos kay Jose ang kanyang paghihirap at ang buong sambahayan ng kanyang ama.
  alternative: Ipaliwanag na ang sakit lamang na kaugnay ng kanyang pamilya ang nawala, o na pagmamalabis lamang ito.
  rationale: Hindi nililinaw ng Hebreo kung literal, emosyonal, o retorikal ang ‘pagkalimot.’ Pinananatili ng salin ang tunay na tensiyon sa halip na lutasin ito sa pamamagitan ng pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘Manases,’ ‘panganay,’ at ‘sambahayan’ bilang mga pamilyar na anyong biblikal nang hindi nagiging lipas o labis na teknikal. Inayos ang mga marker ayon sa mismong salitang ipinapaliwanag.
