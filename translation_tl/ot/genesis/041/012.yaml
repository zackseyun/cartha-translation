  text: וְ/שָׁ֨ם אִתָּ֜/נוּ נַ֣עַר עִבְרִ֗י עֶ֚בֶד לְ/שַׂ֣ר הַ/טַּבָּחִ֔ים וַ/נְּ֨סַפֶּר ל֔/וֹ וַ/יִּפְתָּר לָ֖/נוּ אֶת חֲלֹמֹתֵ֑י/נוּ אִ֥ישׁ כַּ/חֲלֹמ֖/וֹ פָּתָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/012.yaml
  text: And there with us was a young Hebrew man[a], a servant of the captain of the guard, and we told him, and he interpreted our dreams for us[c][b]; he interpreted each man's dream according to his dream.
translation:
  language: tl
  text: At kasama namin doon ang isang kabataang Hebreo, isang alipin ng pinuno ng mga tanod. Isinalaysay namin sa kaniya ang aming mga panaginip, at binigyan niya ng kahulugan ang mga iyon para sa amin; binigyan niya ng kahulugan ang panaginip ng bawat isa ayon sa kani-kaniyang panaginip.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעַר
  choice: kabataan
  rationale: Tumutukoy sa isang kabataang lalaki o binata; sa konteksto, natural ang “kabataan” at hindi ito nagpapahiwatig na bata pa si Jose.
- source_word: עִבְרִי
  choice: Hebreo
  rationale: Karaniwang katawagang etniko sa Filipino at tuwirang katumbas ng Hebreo.
- source_word: עֶבֶד
  choice: alipin
  rationale: Ipinahihiwatig ng parirala na si Jose ay pag-aari o nasa ilalim ng kapangyarihan ng pinuno; mas malinaw na naipapakita ng “alipin” ang kaniyang nakagapos na katayuan kaysa “lingkod.”
- source_word: שַׂר הַטַּבָּחִים
  choice: pinuno ng mga tanod
  rationale: Inilalarawan ang opisyal na namumuno sa pangkat ng mga tanod o tagapagpatupad ng hatol; ang “pinuno ng mga tanod” ay malinaw at natural sa modernong Filipino.
- source_word: וַנְּסַפֶּר לוֹ
  choice: isinalaysay namin sa kaniya
  rationale: Ang pandiwa ay nangangahulugang ikuwento o isalaysay; ang pagpili ay angkop sa pagsasabi nang buo ng mga panaginip.
- source_word: וַיִּפְתָּר לָנוּ
  choice: binigyan niya ng kahulugan ... para sa amin
  rationale: Sa konteksto ng panaginip, ang פתר ay tumutukoy sa pagpapakahulugan; mas natural sa karaniwang Filipino ang “binigyan ng kahulugan” kaysa “ipinaliwanag” o “isinalin.”
- source_word: חֲלֹמֹתֵינוּ
  choice: aming mga panaginip
  rationale: Tuwirang inililipat ang maramihang anyo at unang panauhang pangmaramihang hulapi.
- source_word: אִישׁ כַּחֲלֹמוֹ פָּתָר
  choice: binigyan niya ng kahulugan ang panaginip ng bawat isa ayon sa kani-kaniyang panaginip
  rationale: 'Pinananatili ang distributibong diin ng Hebreo: ang bawat isa ay tumanggap ng kahulugang naaayon sa sarili niyang panaginip, kahit may sinadyang pag-uulit na katulad ng pinagmulan.'
theological_decisions: []
