  yaml_path: translation/ot/genesis/041/014.yaml
  text: Then Pharaoh sent and called for Joseph[a], and they quickly brought him out of the pit. He shaved, changed his clothes[c][b], and came to Pharaoh.
translation:
  language: tl
  text: Kaya nagsugo ang Faraon at ipinatawag si Jose. Dali-dali nila siyang inilabas mula sa hukay.[a] Nag-ahit siya, nagpalit ng damit, at humarap sa Faraon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “hukay” ay maaari ring tumukoy sa isang balon o hukay na ginamit na bilangguan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא אֶת יוֹסֵף
  choice: nagsugo ... at ipinatawag si Jose
  rationale: Pinananatili ang dalawang pandiwa sa Hebreo habang likas na ipinahahayag sa Tagalog na nagpadala ang Faraon ng mga tao upang ipatawag si Jose.
- source_word: וַיְרִיצֻהוּ
  choice: Dali-dali nila siyang inilabas
  rationale: Ang causative na anyo ay nagpapahiwatig na may mga taong naglabas kay Jose nang apurahan; malinaw at natural itong naihahatid ng “dali-dali nila siyang inilabas.”
- source_word: מִן הַבּוֹר
  choice: mula sa hukay
  rationale: Ang בּוֹר ay literal na hukay at maaari ring tumukoy sa isang balon o hukay na ginamit na bilangguan. Pinananatili ng “hukay” ang kongkretong larawan at ugnayan sa naunang salaysay.
- source_word: וַיְגַלַּח
  choice: Nag-ahit siya
  rationale: Aktibo at maikli ang pandiwa sa Hebreo. Ang “nag-ahit siya” ay natural sa modernong Tagalog at hindi nagdaragdag kung anong bahagi ang inahit.
- source_word: וַיְחַלֵּף שִׂמְלֹתָיו
  choice: nagpalit ng damit
  rationale: Direkta at pangkaraniwang salin ito ng pagpapalit ng sariling kasuutan.
- source_word: וַיָּבֹא אֶל פַּרְעֹה
  choice: humarap sa Faraon
  rationale: Sa konteksto ng maharlikang pagpapatawag, natural na ipinahahayag ng “humarap” ang pagdating ni Jose sa presensiya ng Faraon, nang hindi dinaragdagan ang tagpo.
