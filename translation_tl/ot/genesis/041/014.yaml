translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Faraon” bilang karaniwang anyo sa Bibliyang Tagalog; pinanatili ang apurahang kilos at ang sunod-sunod na mga pandiwa ng Hebreo.
