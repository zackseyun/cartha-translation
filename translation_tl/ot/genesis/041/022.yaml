  naturalness: Natural at malinaw ang modernong Filipino. Ang “uhay,” “tangkay,” at “hitik” ay angkop sa larawang pang-agrikultura; ang “at narito” ay bahagyang mataas ngunit akmang-akma sa matingkad na himig ng tuwirang salaysay.
