base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/022.yaml
  text: And I saw in my dream[a], and behold, seven ears of grain were coming up on one stalk, full and good.
translation:
  language: tl
  text: At nakita ko sa aking panaginip, at narito, pitong uhay[a] ang tumutubo sa iisang tangkay, hitik at magaganda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga ulo ng butil.” Ang salitang Hebreo ay tumutukoy sa uhay o ulo ng halamang butil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: At nakita ko
  rationale: Pinananatili ang sunod-sunod na daloy ng salaysay ni Faraon at ang unang panauhang anyo ng pandiwa.
- source_word: בַּחֲלֹמִי
  choice: sa aking panaginip
  rationale: Tuwirang ipinapahayag ang panaginip bilang tagpuan ng kanyang nakita.
- source_word: וְהִנֵּה
  choice: at narito
  rationale: Pinananatili ang bigla at matingkad na pagpapakita ng larawan sa salaysay, nang hindi ito pinapantay lamang sa 'mayroon.'
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: pitong uhay
  rationale: Ang שִׁבֹּלֶת ay tumutukoy rito sa bahaging namumunga ng halamang butil; ang 'uhay' ang likas at tiyak na katumbas sa Filipino.
- source_word: עֹלֹת
  choice: ang tumutubo
  rationale: Ipinakikita ng participle ang nagaganap at matingkad na kilos sa panaginip. Ang 'tumutubo' ay natural sa larawang pang-agrikultura.
- source_word: בְּקָנֶה אֶחָד
  choice: sa iisang tangkay
  rationale: Ang קָנֶה ay ang tangkay na kinasusulputan ng mga uhay; natural sa Filipino ang 'sa iisang tangkay' at pinananatili nito ang di-pangkaraniwang larawan ng pito sa isa.
- source_word: מְלֵאֹת
  choice: hitik
  rationale: Sa uhay, likas na ipinahihiwatig ng 'hitik' na punô o sagana ito sa butil, habang pinananatili ang positibong larawang agrikultural.
- source_word: וְטֹבוֹת
  choice: at magaganda
  rationale: Ipinahahayag ang kanais-nais na anyo at kalidad ng mga uhay. Ang pambabaeng pangmaramihang anyo ay natural na naihahatid sa Filipino sa pangmaramihang 'magaganda.'
