  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang pagsapit ng gutom sa buong lupain ng Egipto, ang daing ng mga tao sa Faraon para sa tinapay, at ang utos na lumapit kay Jose at sundin ang kanyang sasabihin. Ang “anumang sabihin niya sa inyo” ay likas na Tagalog at sapat na sumasaklaw sa אֲשֶׁר יֹאמַר לָכֶם.'
