  terminology: Wasto at magkakatugma ang mga pangalang “Egipto,” “Faraon,” at “Jose.” Ang “tinapay” ay ang literal na katumbas ng לֶחֶם; ang talababa ay angkop na nagpapaliwanag ng mas malawak na gamit nito bilang pagkain o panustos.
