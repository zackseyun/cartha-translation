base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/055.yaml
  text: And all the land of Egypt became hungry[a], and the people cried out to Pharaoh for bread. Pharaoh said to all Egypt, “Go to Joseph. What he says to you, do.”
translation:
  language: tl
  text: Nang magutom ang buong lupain ng Egipto, dumaing ang mga tao sa Faraon para sa tinapay.[a] Sinabi ng Faraon sa buong Egipto, “Pumunta kayo kay Jose. Gawin ninyo ang anumang sabihin niya sa inyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkain.”
    reason: Maaaring gamitin ang “tinapay” bilang pangkalahatang tawag sa pagkain o panustos sa kontekstong ito.
lexical_decisions:
- source_word: וַתִּרְעַב
  choice: Nang magutom
  rationale: 'Pinananatili nito ang pandiwang diwa ng רעב at ang pag-usad ng salaysay: dumating ang gutom at naranasan ito ng lupain. Natural din sa Tagalog ang personipikasyong “magutom ang lupain.”'
- source_word: כָּל אֶרֶץ מִצְרַיִם
  choice: ang buong lupain ng Egipto
  rationale: Tahasang pinananatili ang אֶרֶץ (“lupain”) at likas na ipinahahayag sa Tagalog ang kabuuan sa pamamagitan ng “buong.”
- source_word: וַיִּצְעַק הָעָם
  choice: dumaing ang mga tao
  rationale: Ipinahihiwatig ng צעק ang matinding paghingi ng saklolo dahil sa paghihirap. Ang “dumaing” ay natural at marangal, at higit na angkop sa konteksto kaysa sa payak na “sumigaw.”
- source_word: לַלָּחֶם
  choice: para sa tinapay
  rationale: Pinananatili ang literal na kahulugan ng לֶחֶם, habang kinikilala sa talababa na maaari itong tumukoy nang mas malawak sa pagkain.
- source_word: לְכָל מִצְרַיִם
  choice: sa buong Egipto
  rationale: Pinananatili ang kolektibong paggamit ng pangalang-lugar sa Hebreo nang hindi ito tahasang ginagawang “lahat ng taga-Egipto.”
- source_word: לְכוּ אֶל יוֹסֵף
  choice: Pumunta kayo kay Jose
  rationale: Direkta at natural na salin ng maramihang pautos at ng pariralang may אֶל.
- source_word: אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ
  choice: Gawin ninyo ang anumang sabihin niya sa inyo
  rationale: 'Natural na pautos sa modernong Tagalog na pinananatili ang saklaw ng אֲשֶׁר: ang sasabihin ni Jose sa kanila ang dapat nilang gawin.'
