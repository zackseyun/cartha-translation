  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל עֲבָדָ֑י/ו הֲ/נִמְצָ֣א כָ/זֶ֔ה אִ֕ישׁ אֲשֶׁ֛ר ר֥וּחַ אֱלֹהִ֖ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/038.yaml
  text: Then Pharaoh said to his servants[a], “Can we find a man like this[b], in whom is the spirit of God?”
translation:
  language: tl
  text: Pagkatapos, sinabi ng Paraon sa kanyang mga lingkod, “Makakakita ba tayo ng isang lalaking tulad nito, na may espiritu ng Diyos?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Espiritu ng Diyos,” “isang espiritu ng Diyos,” o “isang espiritung dibino.” Maaaring unawain sa higit sa isang paraan ang pariralang Hebreo na רוּחַ אֱלֹהִים.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Tagalog ang “Pagkatapos” bilang panandang sunod na pangyayari.
- source_word: פַּרְעֹה
  choice: Paraon
  rationale: Karaniwang anyong Tagalog ng titulong maharlika sa Ehipto.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Tuwirang katumbas ng pangngalan; maaari itong tumukoy sa mga lingkod o opisyal ng korte, ngunit hindi kailangang tukuyin nang higit ang kanilang ranggo.
- source_word: הֲנִמְצָא
  choice: Makakakita ba tayo
  rationale: Pinananatili ang retorikal at deliberatibong tanong sa unang panauhang maramihan.
- source_word: כָזֶה אִישׁ
  choice: isang lalaking tulad nito
  rationale: Pinananatili ang demonstratibong diwa at ang tiyak na pagtukoy kay Jose bilang isang lalaki.
- source_word: אֲשֶׁר ... בּוֹ
  choice: na kinaroroonan
  rationale: Natural ngunit malapit sa lokatibong diwa ng בּוֹ, “nasa kanya,” nang hindi ito ginagawang mas interpretatibong “may taglay.”
- source_word: רוּחַ אֱלֹהִים
  choice: espiritu ng Diyos
  rationale: Pinananatili ang payak na anyo at hindi ipinapasya sa malaking titik ang pagkakakilanlan ng “espiritu”; inilalahad sa talababa ang tunay na kalabuan ng pariralang Hebreo.
theological_decisions:
- issue: Kung ang רוּחַ אֱלֹהִים ay tiyak na “Espiritu ng Diyos” o mas di-tiyak na “isang espiritung mula sa Diyos/divinong espiritu”
  choice: espiritu ng Diyos
  alternative: Espiritu ng Diyos; isang espiritung mula sa Diyos; isang espiritung banal
  rationale: Walang artikulo ang pariralang Hebreo at maaaring maunawaan sa higit sa isang paraan, lalo na bilang pananalita ng Paraon. Ang maliit na titik at talababa ay nagpapanatili sa kalabuan nang hindi itinatanggi ang posibleng tiyak na pagtukoy sa Espiritu ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga lingkod” sa halip na mas espesipikong “mga opisyal,” at “kinaroroonan” upang mapanatili ang lokatibong larawan ng Hebreo. Ang tanging talababa ay inilagay pagkatapos ng pariralang talagang nangangailangan ng paglilinaw.
