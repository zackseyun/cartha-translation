    reason: alternative_reading
  revision_rationale: Pinalitan ang masyadong pormal na “na kinaroroonan ng” ng natural na “na may,” na sa kontekstong ito ay naihahatid pa rin ang “in whom is.” Itinama rin ang alternatibong tala upang maipreserba ang leksikal na kalabuan ng Hebreo nang hindi ipinapasok ang mas tiyak na konseptong “banal.”
