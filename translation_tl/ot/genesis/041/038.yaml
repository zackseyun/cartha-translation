revisions:
- from: Pagkatapos, sinabi ng Paraon sa kanyang mga lingkod, “Makakakita ba tayo ng isang lalaking tulad nito, na kinaroroonan ng espiritu ng Diyos?[a]”
  to: Pagkatapos, sinabi ng Paraon sa kanyang mga lingkod, “Makakakita ba tayo ng isang lalaking tulad nito, na may espiritu ng Diyos?[a]”
  rationale: Pinalitan ang masyadong pormal na “na kinaroroonan ng” ng natural na “na may,” na sa kontekstong ito ay naihahatid pa rin ang “in whom is.” Itinama rin ang alternatibong tala upang maipreserba ang leksikal na kalabuan ng Hebreo nang hindi ipinapasok ang mas tiyak na konseptong “banal.”
