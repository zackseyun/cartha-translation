  to: 'Ito ang gawin ng Faraon: magtalaga siya ng mga tagapangasiwang mamamahala sa lupain at mangolekta ng ikalimang bahagi ng ani ng lupain ng Ehipto sa pitong taon ng kasaganaan.[a]'
