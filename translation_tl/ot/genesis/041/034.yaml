  source_fidelity: 'Tumpak ang pangunahing diwa: pagpapatalaga ng mga opisyal at pagkuha ng ikalimang bahagi sa pitong taon ng kasaganaan. Gayunman, ang “sa buong lupain” ay higit na nagsasaad ng pagkalat sa heograpikong saklaw kaysa ng pagiging mga tagapangasiwa na may pananagutan “sa ibabaw/ng” lupain. Maaaring ipahayag nang mas malinaw ang relasyong administratibo nang hindi nagdaragdag ng kahulugan.'
  naturalness: Malinaw at marangal ang kasalukuyang Tagalog. Mas natural at mas tiyak sa modernong Filipino ang “mga tagapangasiwang mamamahala sa lupain” at “sa pitong taon” kaysa “sa buong lupain” at “sa loob ng pitong taon.”
