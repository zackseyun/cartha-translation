translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Faraon,” “tagapangasiwa,” at “kasaganaan” bilang mga salitang madaling maunawaan ngunit angkop sa salaysay. Ang panandang [a] ay inilagay kaagad pagkatapos ng sugnay na nililinaw nito.
