  yaml_path: translation/ot/genesis/041/034.yaml
  text: 'Let Pharaoh do this: let him appoint overseers over the land and take a fifth of the produce of the land of Egypt during the seven years of abundance[a].'
translation:
  language: tl
  text: 'Ito ang gawin ng Faraon: magtalaga siya ng mga tagapangasiwang mamamahala sa lupain at mangolekta ng ikalimang bahagi ng ani ng lupain ng Ehipto sa pitong taon ng kasaganaan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kumuha ng ikalimang bahagi mula sa lupain ng Ehipto.” Maaaring unawain ang pandiwang Hebreo bilang pagsingil o pagkuha ng ikalimang bahagi sa mga taon ng kasaganaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲשֶׂה
  choice: Gawin ito ng Faraon
  rationale: Malawak ang kahulugan ng עשה, ngunit sa konteksto ay nagpapayo si Jose. Likas sa modernong Tagalog ang anyong pautos na “Gawin ito ng Faraon,” at ipinahihiwatig ng “ito” ang mungkahing kasunod.
- source_word: וְיַפְקֵד
  choice: magtalaga siya
  rationale: Ang Hiphil ng פקד ay tumutukoy rito sa paghirang o pagtatalaga ng mga taong bibigyan ng pananagutan.
- source_word: פְּקִדִים
  choice: mga tagapangasiwa
  rationale: Tumutukoy ang pangngalan sa mga itinalagang opisyal na nangangasiwa; malinaw at hindi labis na teknikal ang “mga tagapangasiwa.”
- source_word: עַל הָאָרֶץ
  choice: sa buong lupain
  rationale: Sa kontekstong administratibo, nangangahulugan itong magtalaga ng mga tagapangasiwa sa saklaw ng lupain. Ang “sa buong lupain” ay natural sa Tagalog at naghahatid ng ipinamahaging pangangasiwa, bagaman literal na maaaring “sa ibabaw ng lupain.”
- source_word: וְחִמֵּשׁ
  choice: kumuha ng ikalimang bahagi
  rationale: Malamang na ang Piel ng חמשׁ ay tumutukoy sa pagkuha o pagsingil ng isang-kalimang bahagi. Pinananatili ng salin ang tiyak na proporsiyon at ang administratibong kilos.
- source_word: אֶת אֶרֶץ מִצְרַיִם
  choice: ng ani sa lupain ng Ehipto
  rationale: Bagaman ang tahasang layon sa Hebreo ay “ang lupain ng Ehipto,” ipinakikita ng konteksto na ang ikalimang bahagi ay mula sa ani o bunga ng lupain, hindi bahagi ng mismong teritoryo. Idinagdag ang “ani” upang maging malinaw at natural.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: sa loob ng pitong taon ng kasaganaan
  rationale: Ang שָׂבָע ay pagkabusog o kasaganaan at sa salaysay ay tumutukoy sa mga taong sagana ang ani. Ang “kasaganaan” ay dignified at karaniwang nauunawaan.
