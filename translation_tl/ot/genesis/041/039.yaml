base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng Paraon kay Jose, “Dahil[a] ipinaalam sa iyo ng Diyos ang lahat ng ito, walang sinumang kasing-unawa at kasing-karunong mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Matapos ipaalam ng Diyos sa iyo ang lahat ng ito.” Ang salitang Hebreo ay maaari ring isaling “matapos,” ngunit dito ay ipinahihiwatig nito ang batayan ng pasya ng Paraon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: פַּרְעֹה
  choice: Paraon
  rationale: Karaniwang anyo sa Tagalog ng titulong maharlika ng Ehipto.
- source_word: אַחֲרֵי
  choice: Dahil
  rationale: Bagaman pangunahing nangangahulugang “pagkatapos,” dito ay ipinakikita nito ang batayan ng pasya ng Paraon. Ang “Dahil” ang likas na pagpapahayag ng ugnayang ito sa Tagalog, habang nasa talababa ang mas pormal na alternatibo.
- source_word: הוֹדִיעַ
  choice: ipinaalam
  rationale: 'Pinananatili nito ang causative na diwa ng Hiphil ng ידע: ginawa ng Diyos na malaman ni Jose ang bagay na ito.'
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: 'Iisa ang tinutukoy ayon sa pandiwa at sa konteksto: ang Diyos na naghayag kay Jose.'
- source_word: אֶת כָּל זֹאת
  choice: ang lahat ng ito
  rationale: Tumutukoy nang maikli at malinaw sa buong bagay na ipinaliwanag ni Jose.
- source_word: אֵין
  choice: walang sinuman
  rationale: Likas na modernong Tagalog para sa Hebreong eksistensiyal na pagtanggi.
- source_word: נָבוֹן
  choice: may unawa
  rationale: Ipinahahayag ang kakayahang umunawa at kumilatis na ipinakita ni Jose, nang hindi ito pinapaliit sa karaniwang talino lamang.
- source_word: וְחָכָם
  choice: at karunungan
  rationale: Pinananatili ang hiwalay ngunit kaugnay na katangian ng karunungan sa pares na נבון וְחָכָם.
- source_word: כָּמוֹךָ
  choice: gaya mo
  rationale: Likas na Tagalog na paghahambing kasunod ng “walang sinuman.”
theological_decisions:
- issue: Tinutukoy ng אֱלֹהִים sa pananalita ng Paraon
  choice: Diyos
  alternative: mga diyos
  rationale: Bagaman maaaring anyong maramihan ang אֱלֹהִים sa ibang konteksto, isahan ang gamit dito at tumutukoy sa Diyos na nagpaalam ng kahulugan kay Jose.
- issue: Ugnayan ng אַחֲרֵי sa konklusyon ng Paraon
  choice: Dahil
  alternative: Matapos na
  rationale: Maaaring pormal na isalin ang pang-ukol bilang “matapos,” ngunit sa kontekstong ito ang pagkakahayag ng Diyos ang batayan ng pasya ng Paraon. Pinananatili sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “may unawa at karunungan” upang mapanatiling magkaiba ang dalawang katangiang Hebreo nang hindi nagiging teknikal o lipas ang pananalita.
