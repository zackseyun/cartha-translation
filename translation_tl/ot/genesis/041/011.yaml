  yaml_path: translation/ot/genesis/041/011.yaml
  text: And we dreamed a dream in one night[a], I and he; each man dreamed according to the interpretation of his dream.
translation:
  language: tl
  text: At nanaginip kami sa iisang gabi—ako at siya. Bawat isa sa amin ay nanaginip ayon sa kahulugan ng kanyang panaginip.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, literal na: “Nanaginip kami ng isang panaginip sa iisang gabi, ako at siya; bawat isa ayon sa kahulugan ng kanyang panaginip ay nanaginip kami.”'
    reason: Ipinapakita ang cognate accusative at ang di-karaniwang distributibong ayos ng orihinal.
lexical_decisions:
- source_word: וַנַּחַלְמָה חֲלוֹם
  choice: kapwa kami nanaginip
  rationale: Ang pandiwa at kaugnay na pangngalang Hebreo ay bumubuo ng cognate accusative. Sa makabagong Tagalog, sapat at natural ang “nanaginip”; ipinahahayag ng “kapwa kami” na parehong nakaranas nito ang dalawang lalaki.
- source_word: בְּלַיְלָה אֶחָד
  choice: sa iisang gabi
  rationale: Pinananatili nito ang literal na ideya ng “isang gabi” at malinaw na ipinahahayag na naganap ang dalawang panaginip sa gabi ring iyon.
- source_word: אֲנִי וָהוּא
  choice: ako at siya
  rationale: Sinusunod ang pagkakasunod ng mga panghalip sa Hebreo at nananatiling malinaw at katanggap-tanggap sa Tagalog.
- source_word: אִישׁ
  choice: bawat isa sa amin
  rationale: 'Distributibo ang gamit ng אִישׁ: ang bawat isa sa dalawang lalaki ay nagkaroon ng sariling panaginip. Mas natural sa Tagalog ang “bawat isa sa amin” kaysa “bawat lalaki.”'
- source_word: כְּפִתְרוֹן חֲלֹמוֹ
  choice: ayon sa kahulugan ng sarili niyang panaginip
  rationale: Ipinakikita ng כְּ ang pagtutugma ng bawat panaginip sa interpretasyon o kahulugan nito. Ang “sarili niyang” ay nagpapanatili sa distributibong diwa ng hulaping pang-isahan.
- source_word: חָלָמְנוּ
  choice: nanaginip
  rationale: Ang huling pandiwa ay muling bumabalik sa kilos ng pangangarap at kinukumpleto ang distributibong parirala; pinanatili ang pag-uulit upang masalamin ang estruktura ng Hebreo.
theological_decisions:
- issue: Ugnayan ng panaginip at kahulugan nito
  choice: ayon sa kahulugan ng sarili niyang panaginip
  alternative: bawat panaginip ay may kanya-kanyang kahulugan
  rationale: Pinananatili ng napiling salin ang bahagyang di-karaniwang pahayag ng Hebreo at hindi nito ipinapalagay nang higit sa teksto kung ang tinutukoy ay likas na kahulugan, interpretasyon, o katuparan ng panaginip.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sa iisang gabi” upang idiin ang sabayang panahon, at pinanatili ang “ako at siya” bilang malinaw na pag-uulit sa dalawang kalahok.
