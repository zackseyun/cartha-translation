base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/003.yaml
  text: And behold[a], seven other cows came up after them from the Nile, ugly in appearance and thin in flesh[b], and they stood beside the cows on the bank of the Nile.
translation:
  language: tl
  text: At narito[a], pitong iba pang baka ang umahon mula sa Nilo, kasunod ng mga nauna. Pangit ang kanilang hitsura at payat ang kanilang katawan[b]. Tumayo sila sa tabi ng mga baka sa pampang ng Nilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang “narito” ay isang masiglang panawag-pansin sa biglang lumitaw na tanawin sa panaginip.
    reason: discourse_feature
  - marker: b
    text: 'O: “masama ang hitsura at manipis ang laman.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang masiglang panandang pandiskurso na biglang nagtutuon ng pansin sa sumunod na tanawin sa panaginip.
- source_word: פָּרוֹת
  choice: mga baka
  rationale: Tiyak na mga babaeng bovine ang tinutukoy; likas at sapat na tiyak sa modernong Tagalog ang “mga baka,” samantalang hindi sinabi ang edad upang gawing “dumalaga.”
- source_word: אֲחֵרוֹת
  choice: iba pang
  rationale: Malinaw na ipinakikilala ang ikalawang pangkat na naiiba sa unang pitong baka.
- source_word: עֹלוֹת
  choice: umahon
  rationale: Likas na paglalarawan sa paglabas at pag-akyat ng mga hayop mula sa ilog, at tumutugma sa kilos ng pandiwang Hebreo.
- source_word: אַחֲרֵיהֶן
  choice: kasunod ng mga iyon
  rationale: Ipinahahayag ang malamang na pagkakasunod-sunod sa panaginip habang hindi kinakailangang gawing pisikal na “sa likuran.”
- source_word: הַיְאֹר
  choice: Nilo
  rationale: Sa kontekstong Ehipsiyo, ang karaniwang tawag na “ang ilog” ay tumutukoy sa Nilo; tuwirang ipinapahayag sa teksto ang referent at inilalagay sa talababa ang literal na anyo.
- source_word: רָעוֹת מַרְאֶה
  choice: Pangit ang kanilang hitsura
  rationale: Inilalarawan nito ang masamang anyo, hindi moral na kasamaan. Natural at malinaw ang “pangit” sa kasalukuyang Tagalog.
- source_word: דַקּוֹת בָּשָׂר
  choice: payat ang kanilang katawan
  rationale: Inihahatid ang pisikal na kapayatan sa natural na Tagalog; inilalagay sa talababa ang mas literal na “manipis ang laman.”
- source_word: וַתַּעֲמֹדְנָה
  choice: Tumayo sila
  rationale: Payak at tuwirang katumbas ng kilos sa salaysay.
- source_word: אֵצֶל
  choice: sa tabi ng
  rationale: Malinaw na ipinapahayag ang malapit na posisyon ng dalawang pangkat.
- source_word: שְׂפַת
  choice: pampang
  rationale: Ito ang natural na salitang Tagalog para sa gilid o bank ng isang ilog.
