  text: And he gathered all the food of the seven years that were in the land of Egypt[a], and he put the food in the cities. In each city he put the food from the fields around it.
translation:
  language: tl
  text: Tinipon niya ang lahat ng pagkaing mula sa pitong taon na iyon sa lupain ng Egipto, at inilagay niya ang pagkain sa mga lungsod. Sa bawat lungsod ay inilagay niya ang pagkaing mula sa mga bukid sa paligid nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “Ang pagkain ng bukid ng lungsod na nakapaligid dito ay inilagay niya sa loob nito.” Inuulit sa Hebreo ang “pagkain” at gumagamit ng panumbalik na pagkakabuo ng pangungusap upang magbigay-diin.'
    reason: Pinananatili ang mas literal na anyo at diin ng Hebreo bilang alternatibo, samantalang mas natural ang ayos sa pangunahing teksto.
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: Tinipon niya
  rationale: Ang קבץ ay tumutukoy sa pagsasama-sama o pagtitipon. Natural at tumpak sa salaysay ang “tinipon.”
- source_word: כָּל אֹכֶל
  choice: lahat ng pagkain
  rationale: Mas malawak ang אֹכֶל kaysa “butil” o “ani.” Pinananatili ng “pagkain” ang saklaw ng salitang Hebreo nang hindi nagpapakitid sa kahulugan.
- source_word: שֶׁבַע שָׁנִים אֲשֶׁר הָיוּ בְּאֶרֶץ מִצְרַיִם
  choice: sa pitong taon na iyon sa lupain ng Egipto
  rationale: Tinutukoy nito ang pitong taon na nauna nang binanggit. Ang “sa ... taon” ay likas sa Filipino para sa pagkaing natipon sa panahong iyon, habang iniiwasan ang napakailang literal na “mga taong nasa lupain.”
- source_word: וַיִּתֶּן אֹכֶל בֶּעָרִים
  choice: inilagay niya ang pagkain sa mga lungsod
  rationale: Ang נתן ay karaniwang “ibinigay” o “inilagay.” Ang “inilagay” ay malapit sa anyo ng Hebreo; ang “inimbak” ay maaaring tama sa konteksto ngunit mas interpretatibo.
- source_word: אֹכֶל שְׂדֵה הָעִיר אֲשֶׁר סְבִיבֹתֶיהָ
  choice: ang pagkaing mula sa mga bukid sa paligid nito
  rationale: Malinaw na iniuugnay ng parirala ang pagkain sa mga bukid na nakapaligid sa bawat lungsod. Ginagawang tahasan ng “mula sa” ang relasyong likas na nauunawaan sa Hebreong construct phrase.
- source_word: נָתַן בְּתוֹכָהּ
  choice: Sa bawat lungsod ay inilagay niya
  rationale: Literal itong “inilagay niya sa loob nito.” Ang distributibong “sa bawat lungsod” ay malinaw na ipinahihiwatig ng magkakatugmang lungsod at mga bukid nito, at natural itong pakinggan sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino na angkop sa salaysay. Ginamit ang “lungsod” at “lupain ng Egipto” bilang malinaw at karaniwang mga terminong biblikal. Inilapit ang salin sa Hebreo ngunit inayos ang panumbalik na konstruksyon upang maging likas at madaling maunawaan.
