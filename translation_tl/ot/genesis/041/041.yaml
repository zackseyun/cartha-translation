  text: At sinabi ng Faraon kay Jose, “Tingnan mo, inilagay kitang mamahala sa buong lupain ng Ehipto.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; pinananatili ng “At sinabi” ang payak na daloy ng Hebreo.
- source_word: פַּרְעֹה
  choice: Faraon
  rationale: Karaniwang anyong Filipino ng titulong maharlika sa Ehipto.
- source_word: אֶל יוֹסֵף
  choice: kay Jose
  rationale: Natural na Filipino para sa patunguhan ng pagsasalita at sa pangalang יוֹסֵף.
- source_word: רְאֵה
  choice: Tingnan mo
  rationale: Pautos na anyo na tumatawag ng pansin sa taimtim na pahayag; malinaw at kasalukuyang Filipino.
- source_word: נָתַתִּי אֹתְךָ עַל
  choice: inilagay kitang mamahala sa
  rationale: Sa kontekstong administratibo, ang literal na “ibinigay kita sa ibabaw ng” ay tumutukoy sa paghirang at pagbibigay ng kapangyarihan; natural na ipinapahayag ito sa Filipino bilang “inilagay kitang mamahala sa.”
- source_word: כָּל אֶרֶץ מִצְרָיִם
  choice: buong lupain ng Ehipto
  rationale: Pinananatili ang kabuuang saklaw ng כָּל at ang teritoryal na diwa ng אֶרֶץ.
