  naturalness: 'Natural at malinaw ang modernong Filipino: “At sinabi ng Faraon kay Jose” at “buong lupain ng Ehipto” ay maayos at marangal sa salaysay. Ang “Tingnan mo” ay gumaganap nang sapat bilang pantawag-pansin sa tuwirang pahayag.'
