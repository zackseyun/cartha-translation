base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/007.yaml
  text: And the thin ears swallowed up the seven healthy and full ears[a]. Then Pharaoh awoke, and behold[b], it was a dream.
translation:
  language: tl
  text: Nilamon ng maninipis na uhay ang pitong malulusog at hitik na uhay.[a] Nagising ang Paraon—at panaginip pala iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “uhay” ay ang bahaging namumunga ng butil, hindi ang buong tangkay.
    reason: lexical_clarification
  - marker: b
    text: Sa Hebreo, literal na “at narito, isang panaginip.”
    reason: formal_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְנָה
  choice: Nilamon
  rationale: Tuwirang inilalarawan ng pandiwang בלע ang paglunok. Pinananatili ng “nilamon” ang matingkad at di-pangkaraniwang larawan sa panaginip nang hindi dinaragdagan ng tiyak na diwang mapanila.
- source_word: הַשִּׁבֳּלִים
  choice: mga uhay
  rationale: Ang שִׁבֹּלֶת dito ay ang bahaging namumunga ng butil, hindi ang buong tangkay. Ang “uhay” ang maikli at tumpak na katawagang Filipino.
- source_word: הַדַּקּוֹת
  choice: maninipis
  rationale: Tuwirang katumbas ito ng pang-uring nangangahulugang manipis o pino at angkop sa paglalarawan sa mga uhay.
- source_word: שֶׁבַע
  choice: pitong
  rationale: Likas na anyong Filipino ng kardinal na bilang kapag sinusundan ng pang-uri at pangngalan.
- source_word: הַבְּרִיאוֹת
  choice: malulusog
  rationale: Ipinahihiwatig ng salita ang mabuting kalagayan, katabaan, o kasaganaan. Ang “malulusog” ay natural para sa mahusay na tumubong mga uhay habang pinananatili ang kaibahan sa maninipis.
- source_word: וְהַמְּלֵאוֹת
  choice: at hitik
  rationale: Ang מלא ay “puno.” Sa uhay, natural na ipinapahayag ng “hitik” na punô ito ng mga butil, nang hindi ito ginagawang “hinog,” na ibang katangian.
- source_word: וַיִּיקַץ
  choice: Nagising
  rationale: Karaniwan at malinaw na pandiwang pasalaysay para sa paggising mula sa tulog.
- source_word: פַּרְעֹה
  choice: ang Paraon
  rationale: Ginamit ang nakaugaliang titulong Filipino; nilalagyan ito ng pantukoy bilang simuno.
- source_word: וְהִנֵּה חֲלוֹם
  choice: —at panaginip pala iyon
  rationale: 'Napakaikli ng Hebreo: “at narito, isang panaginip.” Ipinahahayag ng “pala” ang biglang pagkatanto na dala ng הִנֵּה, habang ang “iyon” at ang ipinahiwatig na panaguri ay nagbibigay ng natural na pangungusap sa Filipino.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Pinili ang “uhay” bilang tumpak na terminong pang-agrikultura, at ang “panaginip pala iyon” bilang likas na Filipino na nagpapanatili sa biglang pagkatanto ng orihinal.
