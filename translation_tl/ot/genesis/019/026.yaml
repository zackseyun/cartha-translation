  yaml_path: translation/ot/genesis/019/026.yaml
  text: But his wife looked back from behind him[b][a], and she became a pillar of salt.
translation:
  language: tl
  text: Ngunit ang asawa niya, na nasa likuran niya, ay tumingin pabalik[a], at siya’y naging haliging asin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “tumingin sa likuran.” Mas literal sa Hebreo: “tumingin mula sa likuran niya.” Maaari ring tumukoy ang parirala sa kinaroroonan niya sa likuran ni Lot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: lumingon
  rationale: Ang נבט ay nangangahulugang tumingin o magmasid. Sa kontekstong ito at kasama ng מֵאַחֲרָיו, likas na ipinahahayag ng “lumingon” ang pagtingin pabalik nang hindi nagdaragdag ng motibo.
- source_word: אִשְׁתּוֹ
  choice: ang asawa niya
  rationale: Tuwirang ipinahahayag ng pangngalang may hulaping panlalaking isahan ang “asawa niya,” na tumutukoy sa asawa ni Lot.
- source_word: מֵאַחֲרָיו
  choice: mula sa likuran niya
  rationale: Pinananatili nito ang di-karaniwang anyo ng Hebreo at ang posibleng pagtukoy sa kinaroroonan ng babae sa likuran ni Lot, sa halip na tahimik na gawing direksiyon lamang ng kanyang tingin.
- source_word: וַתְּהִי
  choice: siya’y naging
  rationale: Sa sunod-sunod na salaysay, ang היה ay nagpapahayag ng naging kalagayan o pagbabago, hindi lamang ng pag-iral.
- source_word: נְצִיב מֶלַח
  choice: haliging asin
  rationale: Ang נְצִיב ay isang bagay na nakatayo o itinayo; sa kontekstong ito, ang “haligi” ang malinaw at kinaugaliang katumbas, at ang construct na may מֶלַח ay likas na “haliging asin.”
theological_decisions:
- issue: Ang kalikasan ng nangyari sa asawa ni Lot
  choice: 'Isinalin bilang tuwirang pagbabago: “siya’y naging haliging asin.”'
  alternative: “naging parang haliging asin” o “nakatayo roon na gaya ng haliging asin”
  rationale: Walang pantulad na pananda sa Hebreo. Pinananatili ng salin ang tahasang pahayag ng salaysay nang hindi ito pinahihina o dinaragdagan ng paliwanag na teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lumingon” para sa natural na daloy, habang inilakip ang “mula sa likuran niya” at ang talababa upang mapanatili ang tunay na kalabuan ng Hebreo.
