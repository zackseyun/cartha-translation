  text: וַֽ/יַּהֲפֹךְ֙ אֶת הֶ/עָרִ֣ים הָ/אֵ֔ל וְ/אֵ֖ת כָּל הַ/כִּכָּ֑ר וְ/אֵת֙ כָּל יֹשְׁבֵ֣י הֶ/עָרִ֔ים וְ/צֶ֖מַח הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/025.yaml
  text: And he overthrew those cities[a], and all the plain, and all the inhabitants of the cities[b], and the vegetation of the ground.
translation:
  language: tl
  text: At winasak niya ang mga lunsod na iyon[a], ang buong kapatagan[b], ang lahat ng naninirahan sa mga lunsod, at ang mga halamang tumutubo sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binaligtad.” Maaaring idiin ng pandiwang Hebreo ang isang kapaha-pahamak na pagbaligtad o pagpapabagsak.
    reason: lexical_alternative
  - marker: b
    text: Ang “kapatagan” dito ay tumutukoy sa distrito ng kapatagan ng Jordan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: winasak
  rationale: Sa kontekstong ito, ang הפך ay tumutukoy sa kapaha-pahamak na pagpapabagsak o pagbaligtad. Likas at malinaw sa modernong Tagalog ang “winasak”; pinananatili sa talababa ang mas kongkretong larawang “binaligtad.”
- source_word: הֶעָרִים הָאֵל
  choice: ang mga lunsod na iyon
  rationale: Tinutukoy ng demonstratibo ang mga lunsod na nabanggit na sa salaysay. Ang “na iyon” ang natural na pagtukoy pabalik sa Tagalog.
- source_word: כָּל הַכִּכָּר
  choice: ang buong Kapatagan
  rationale: Sa konteksto ng Genesis, ang כִּכָּר ay ang rehiyon o kapatagan ng Jordan, hindi lamang isang pangkalahatang patag na lugar. Ginamit ang malaking titik bilang katawagan sa nasabing distrito.
- source_word: כָּל יֹשְׁבֵי הֶעָרִים
  choice: ang lahat ng naninirahan sa mga lunsod
  rationale: Tumpak at likas na ipinapahayag ng “naninirahan” ang participial na anyo mula sa ישב nang hindi gumagamit ng mas pormal na “mga nananahan.”
- source_word: צֶמַח הָאֲדָמָה
  choice: ang mga halamang tumutubo sa lupa
  rationale: Ipinahahayag nito ang sumisibol o tumutubong halaman mula sa lupa at mas natural sa karaniwang Tagalog kaysa sa literal na “pananim ng lupa.”
theological_decisions:
- issue: Hindi tahasang binanggit na simuno ng pandiwang isahan
  choice: Ginamit ang “niya” nang hindi tahasang pinangalanan ang gumagawa.
  alternative: “ng Diyos” o “ng PANGINOON” bilang tahasang simuno
  rationale: Walang tahasang simuno sa mismong sugnay na Hebreo, bagaman malinaw sa naunang konteksto na Diyos ang gumagawa. Pinananatili ng panghalip ang anyo at pagpipigil ng pinagmulang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “lunsod” at “Kapatagan” para sa dignidad at heograpikong linaw; iniwasan ang labis na teknikal o makalumang pananalita.
