  text: But Lot said to them[a], “No, please, my lords.”
translation:
  language: tl
  text: Ngunit sinabi ni Lot sa kanila[a], “Hindi po, mga panginoon ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi po, panginoon ko.” Maaaring unawain ang anyong Hebreo na אֲדֹנָי bilang isahang magalang na pagtawag sa ilang pagbasa, ngunit pinapaboran dito ng maramihang “sa kanila” ang “mga panginoon ko.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit sa kontekstong ito ay tumututol si Lot sa naunang tagubilin, kaya likas ang “Ngunit sinabi” sa Filipino.
- source_word: לוֹט
  choice: Lot
  rationale: Ginamit ang karaniwang anyo ng pangalang pantangi sa Filipino.
- source_word: אֲלֵהֶם
  choice: sa kanila
  rationale: Tuwirang pinananatili ang panghalip na maramihan ng Hebreo, na tumutukoy sa dalawang panauhin.
- source_word: אַל
  choice: Huwag
  rationale: Bagaman walang kasunod na pandiwa sa Hebreo, ipinahihiwatig nito ang mariing pagtanggi sa naunang mungkahi. Ang “Huwag” ay natural na pakiusap na tumututol sa Filipino.
- source_word: נָא
  choice: po
  rationale: Ang נָא ay kataga ng magalang na pakiusap. Sa mismong sambit, natural na ipinahahayag ito ng “po” sa modernong Filipino.
- source_word: אֲדֹנָי
  choice: mga panginoon ko
  rationale: Pinapaboran ng maramihang “sa kanila” at ng dalawang kausap ang maramihang pagtawag. Pinananatili ng “mga panginoon ko” ang leksikal na diwa ng אֲדוֹן, sa halip na gawing mas maluwag na “mga ginoo.”
theological_decisions:
- issue: Kung ang אֲדֹנָי ay banal na titulong isahan (“Panginoon ko”) o maramihang magalang na tawag sa mga panauhin (“mga panginoon ko”)
  choice: 'Maramihang pagtawag: “mga panginoon ko”'
  alternative: “Panginoon ko”
  rationale: Maramihan ang tinutukoy ng אֲלֵהֶם (“sa kanila”), at dalawang panauhin ang kausap sa agarang konteksto. Gayunman, maaari ring maunawaan ang anyo bilang isahang magalang o banal na pagtawag, kaya pinananatili ang posibilidad na iyon sa talababa.
translation_notes:
  register: Modernong Filipino na magalang at marangal. Ginamit ang “po” upang natural na maipahayag ang pakiusap na נָא, habang pinanatili ang mas literal na “mga panginoon ko” dahil mahalaga ang bilang at posibleng teolohikal na pagbasa ng אֲדֹנָי.
