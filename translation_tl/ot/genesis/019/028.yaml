base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/028.yaml
  text: And he looked out over Sodom and Gomorrah and over all the land of the plain[a], and he saw, and behold, smoke was rising from the land like the smoke of a furnace.
translation:
  language: tl
  text: 'Tumanaw siya sa Sodoma at Gomorra at sa buong lupain ng kapatagan, at nakita niya: narito, umaakyat ang usok mula sa lupain, gaya ng usok ng pugon.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “gaya ng usok ng hurnuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: Tumanaw
  rationale: Ipinahihiwatig ng pandiwa ang pagtanaw mula sa mataas na kinaroroonan; natural sa Tagalog ang “tumanaw” nang hindi labis na itinatakda ang direksiyon.
- source_word: עַל פְּנֵי
  choice: sa
  rationale: Sa kontekstong ito, ang payak na “sa” ay likas na nagpapahayag ng pagtanaw sa ibabaw o kabuuan ng isang lugar; iiwas ito sa matigas na literal na “sa ibabaw ng mukha ng.”
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sodoma at Gomorra
  rationale: Ito ang nakaugaliang anyo ng mga pangalan sa Filipino.
- source_word: כָּל פְּנֵי אֶרֶץ הַכִּכָּר
  choice: buong lupain ng Kapatagan
  rationale: Ang כִּכָּר ay tumutukoy sa malawak na kapatagan o distrito. Ginawang pantanging heograpikong tawag ang “Kapatagan” ayon sa konteksto, habang pinananatili ang “lupain.”
- source_word: וַיַּרְא
  choice: nakita niya
  rationale: Tuwirang salin ito na nagpapanatili sa pagkakasunod-sunod at diin ng salaysay.
- source_word: וְהִנֵּה
  choice: narito
  rationale: Pinananatili ng “narito” ang biglaan at matingkad na pagkapansin na hudyat ng salitang Hebreo, sa halip na alisin ito sa salin.
- source_word: עָלָה
  choice: umaakyat
  rationale: Ipinakikita ng anyong ito ang nakikitang patuloy na pagtaas ng usok.
- source_word: קִיטֹר
  choice: usok
  rationale: “Usok” ang payak at sapat na katumbas; hindi dinagdagan ng katangiang gaya ng “makapal” na wala sa salita mismo.
- source_word: הָאָרֶץ
  choice: lupain
  rationale: Lokal na rehiyon ang tinutukoy, kaya mas angkop ang “lupain” kaysa “daigdig” o “lupa.”
- source_word: כְּקִיטֹר הַכִּבְשָׁן
  choice: gaya ng usok mula sa isang pugon
  rationale: Maaaring tumukoy ang כִּבְשָׁן sa pugon o hurnuhan. Ang “pugon” ay malinaw at pamilyar na larawan, habang inilalagay sa talababa ang leksikal na alternatibo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang “narito” upang maihatid ang masiglang puwersa ng וְהִנֵּה, at ginamit ang gitling-pahaba upang maging malinaw at natural ang biglang paglalarawan.
