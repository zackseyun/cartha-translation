revisions:
- from: Tumanaw siya sa Sodoma at Gomorra at sa buong lupain ng Kapatagan. At nakita niya—narito, umaakyat mula sa lupain ang usok, gaya ng usok mula sa isang pugon.[a]
  to: 'Tumanaw siya sa Sodoma at Gomorra at sa buong lupain ng kapatagan, at nakita niya: narito, umaakyat ang usok mula sa lupain, gaya ng usok ng pugon.[a]'
  rationale: 'Ginawa lamang ang ligtas at maliliit na pagbabago: inalis ang di-kailangang pagpapantangi sa “kapatagan,” inayos ang bantas upang maging likas ang pangungusap at mapanatili ang puwersa ng וְהִנֵּה, at ginawang “usok ng pugon” upang mas malapit sa Hebreong konstruksiyon. Nananatili ang leksikal na alternatibong “hurnuhan” sa talababa.'
