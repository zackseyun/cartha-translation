revisions:
- from: Kaya nang gabing iyon ay pinainom nila ng alak ang kanilang ama. Pumasok ang panganay at sumiping sa kanyang ama. Hindi niya namalayan nang humiga ito o nang bumangon ito.[a]
  to: Nang gabing iyon, pinainom nila ng alak ang kanilang ama. Pumasok ang panganay at sumiping sa kanyang ama. Hindi niya namalayan nang humiga ito at nang bumangon ito.[a]
  rationale: Pinalitan ang “o” ng “at” upang maipreserba ang tambalang saklaw ng kawalan ng kamalayan ng ama sa parehong paghiga at pagbangon. Inalis ang “Kaya” upang masundan ang payak na daloy ng salaysay sa Hebreo. Pinanatili ang eupemistikong “sumiping” at ang hindi pinalawak na pahayag tungkol sa kawalan ng kamalayan.
