  terminology: Ang “alak” ay angkop para sa יַיִן, at ang “sumiping” ay maingat ngunit malinaw na katumbas ng seksuwal na eupemismo sa pinagmulan. Ang “panganay” ay angkop sa kontekstong malinaw nang babae ang tinutukoy.
