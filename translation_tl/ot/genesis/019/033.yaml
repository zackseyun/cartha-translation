  source_fidelity: 'Tumpak sa kabuuan ang salin: naipapahayag nito ang pagpapainom ng alak, ang pagpasok at pagsiping ng panganay sa ama niya, at ang kawalan ng kamalayan ng ama sa paghiga at pagbangon ng anak. Gayunman, ang וְ sa magkatambal na pariralang בְּשִׁכְבָהּ וּבְקוּמָהּ ay dapat panatilihing “at,” hindi “o.”'
