base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/033.yaml
  text: So they gave their father wine to drink that night[a], and the firstborn went in and lay with her father. He did not know when she lay down or when she arose.
translation:
  language: tl
  text: Nang gabing iyon, pinainom nila ng alak ang kanilang ama. Pumasok ang panganay at sumiping sa kanyang ama. Hindi niya namalayan nang humiga ito at nang bumangon ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Hindi niya nalaman sa paghiga nito at sa pagbangon nito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: pinainom nila
  rationale: 'Ang Hiphil ng שׁקה ay causative: pinainom o binigyan ng maiinom. Likas at malinaw sa Tagalog ang “pinainom nila,” at pinananatili nito ang aktibong papel ng magkapatid.'
- source_word: יַיִן
  choice: alak
  rationale: Sa kontekstong ito, ang יַיִן ay alak na mula sa ubas. Mas karaniwang nauunawaan ng modernong mambabasang Tagalog ang “alak” kaysa “bino,” nang hindi nawawala ang mahalagang diwang nakalalasing na inumin.
- source_word: בַּלַּיְלָה הוּא
  choice: nang gabing iyon
  rationale: Likas na temporal na parirala sa Tagalog at tumpak na tumutukoy sa partikular na gabing binanggit.
- source_word: הַבְּכִירָה
  choice: ang panganay
  rationale: Ang anyo ay pambabae at literal na tumutukoy sa unang ipinanganak. Dahil malinaw sa konteksto na anak na babae ang tinutukoy, sapat at natural ang “ang panganay.”
- source_word: וַתָּבֹא
  choice: pumasok
  rationale: Karaniwang pandiwa ito para sa pagpasok. Hindi na kailangang dagdagan ng tahasang seksuwal na kahulugan sapagkat malinaw iyon sa kasunod na parirala.
- source_word: וַתִּשְׁכַּב אֶת אָבִיהָ
  choice: sumiping sa kanyang ama
  rationale: Ang konstruksiyon ay isang seksuwal na eupemismo. Pinananatili ng “sumiping sa” ang mahinahon ngunit malinaw na rehistro ng Hebreo.
- source_word: וְלֹא יָדַע
  choice: Hindi niya namalayan
  rationale: Ang יָדַע dito ay tumutukoy sa kamalayan, hindi sa pagkakilala o kaalamang seksuwal. Mas natural sa Tagalog ang “hindi namalayan” kaysa literal na “hindi nalaman.”
- source_word: בְּשִׁכְבָהּ וּבְקוּמָהּ
  choice: nang humiga ito o nang bumangon ito
  rationale: Ang mga infinitive construct na may בְּ ay temporal dito. Pinananatili ng magkatulad na parirala ang paralelismo, at hindi idinaragdag sa huling sugnay ang “sa kanya,” na hindi inuulit sa Hebreo.
theological_decisions:
- issue: Saklaw ng kawalan ng kamalayan ng ama
  choice: Hindi niya namalayan nang humiga ang panganay o nang bumangon ito
  alternative: Hindi niya alam na sumiping sa kanya ang anak niya
  rationale: Tinukoy ng Hebreo ang dalawang sandali—ang paghiga at pagbangon—nang hindi tahasang nagpapaliwanag ng antas o dahilan ng kawalan niya ng kamalayan. Pinananatili ng salin ang tensiyong ito at hindi nagdaragdag ng interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang ginamit. Ang “sumiping” ay nagpapanatili sa eupemistikong rehistro ng salaysay, samantalang ang “pinainom” at “namalayan” ay natural sa pang-araw-araw ngunit hindi kolokyal na pagbasa. Inilagay ang talababa sa hulihan ng sugnay na talagang tinutukoy nito.
