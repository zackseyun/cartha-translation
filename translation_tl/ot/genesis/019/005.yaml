  text: וַ/יִּקְרְא֤וּ אֶל לוֹט֙ וַ/יֹּ֣אמְרוּ ל֔/וֹ אַיֵּ֧ה הָ/אֲנָשִׁ֛ים אֲשֶׁר בָּ֥אוּ אֵלֶ֖י/ךָ הַ/לָּ֑יְלָה הוֹצִיאֵ֣/ם אֵלֵ֔י/נוּ וְ/נֵדְעָ֖ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/005.yaml
  text: And they called to Lot and said to him[a], “Where are the men who came to you tonight? Bring them out to us so that we may know them.”
translation:
  language: tl
  text: Tinawag nila si Lot at sinabi sa kanya, “Nasaan ang mga lalaking pumunta sa iyo ngayong gabi? Ilabas mo sila sa amin upang makilala namin sila.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasan ayon sa konteksto, “upang makipagtalik kami sa kanila.” Ang sabi sa Hebreo ay “makilala namin sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: Tinawag nila
  rationale: Ang קרא sa kontekstong ito ay karaniwang nangangahulugang tumawag sa isang tao. Hindi dinagdagan ng tinding gaya ng “sinigawan,” na hindi tahasang nasa pandiwa.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaki
  rationale: Tiyak na tumutukoy ang panlalaking maramihan na אֲנָשִׁים sa mga lalaking panauhin, kaya mas wasto ito kaysa sa neutral na “mga tao.”
- source_word: בָּאוּ אֵלֶיךָ הַלָּיְלָה
  choice: pumunta sa iyo ngayong gabi
  rationale: Natural sa modernong Tagalog ang pariralang ito at pinananatili nito ang pagtukoy sa pagdating ng mga panauhin nang gabing iyon.
- source_word: הוֹצִיאֵם אֵלֵינוּ
  choice: Ilabas mo sila sa amin
  rationale: Ang Hiphil ng יצא ay nangangahulugang papalabasin o ilalabas; tuwiran at natural ang anyong pautos na ito.
- source_word: וְנֵדְעָה אֹתָם
  choice: upang makilala namin sila
  rationale: Ang ידע ay literal na “makilala” o “malaman.” Pinananatili ng salin ang payak na salita ng Hebreo at ang pampanitikang tensiyon nito, habang nililinaw sa talababa ang malamang na seksuwal na diwa sa konteksto.
theological_decisions:
- issue: Kung gagawing tahasan sa pangunahing teksto ang seksuwal na layunin ng וְנֵדְעָה אֹתָם
  choice: Panatilihin sa pangunahing teksto ang literal na “makilala namin sila” at ipaliwanag sa talababa ang seksuwal na diwa.
  alternative: Isalin bilang “makipagtalik kami sa kanila” o “gahasain namin sila.”
  rationale: Bagaman malinaw na nagpapahiwatig ang konteksto ng marahas na seksuwal na layunin, ang mismong pandiwang Hebreo ay karaniwang “kilalanin.” Ang tahasang pagbibigay ng seksuwal na kahulugan sa pangunahing teksto ay magpapasya sa interpretasyon nang higit sa pormal na anyo ng pinagmulan; pinangangalagaan ng talababa kapwa ang literal na salita at ang malamang na kahulugan nito.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “upang” para sa bahagyang pormal ngunit likas na himig ng salaysay; iniwasan ang mas matinding “sinigawan” at ang interpretatibong “gahasain” sa pangunahing teksto.
