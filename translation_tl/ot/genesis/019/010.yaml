  text: But the men reached out their hands and brought Lot into the house with them[c][b][a], and shut the door.
translation:
  language: tl
  text: Ngunit iniunat ng mga lalaki ang kanilang mga kamay, ipinasok nila si Lot sa bahay kasama nila, at isinara nila ang pinto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: mga lalaki
  rationale: Karaniwang nangangahulugang “mga lalaki” ang Hebreo. Bagaman ipinakikilala sila ng mas malawak na konteksto bilang mga anghel na sugo, pinananatili rito ang mismong tawag ng talata.
- source_word: וַיִּשְׁלְחוּ אֶת יָדָם
  choice: iniunat ... ang kanilang mga kamay
  rationale: Likas na Filipino ito para sa idyomang Hebreo na tumutukoy sa pisikal na pag-abot o pag-unat ng kamay.
- source_word: וַיָּבִיאוּ אֶת לוֹט
  choice: ipinasok si Lot
  rationale: Ang causative na anyo ng בוא ay “dalhin o papasukin.” Sa konteksto ng paggalaw paloob sa bahay, malinaw at natural ang “ipinasok.”
- source_word: אֲלֵיהֶם הַבָּיְתָה
  choice: sa bahay kasama nila
  rationale: Ipinahihiwatig ng parirala ang pagpasok ni Lot sa bahay patungo sa kinaroroonan ng mga lalaki; pinananatili ng “kasama nila” ang ideya ng אֲלֵיהֶם.
- source_word: הַדֶּלֶת
  choice: ang pinto
  rationale: Ito ang tuwiran at karaniwang katumbas sa Filipino.
- source_word: סָגָרוּ
  choice: isinara
  rationale: Tumpak at natural na katumbas ng pandiwang Hebreo sa kontekstong ito.
- source_word: וַ
  choice: Ngunit
  rationale: Ipinakikita rito ng pang-ugnay ang pagsalungat ng ginawa ng mga lalaki sa kilos ng mga tao sa labas sa naunang talata.
theological_decisions:
- issue: Kung tahasang tatawaging mga anghel ang הָאֲנָשִׁים
  choice: Panatilihin ang “mga lalaki” sa pangunahing teksto
  alternative: mga anghel; mga panauhin
  rationale: Maliwanag sa konteksto na mga anghel na sugo sila, ngunit “mga lalaki” ang katawagang ginamit mismo sa talatang ito. Hindi dapat ipalit sa pangunahing teksto ang pagpapakahulugang mula sa mas malawak na konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mabilis na sunod-sunod na kilos sa iisang pangungusap at iniwasang tahasang tawaging “mga anghel” ang mga tauhang tinawag ng Hebreo na “mga lalaki.”
