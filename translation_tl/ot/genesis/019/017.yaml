base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/017.yaml
  text: And as they brought them outside[a], he said, “Escape for your life. Do not look behind you, and do not stop anywhere in the plain. Escape to the hills[c][b], lest you be swept away.”
translation:
  language: tl
  text: Nang mailabas na nila sila, sinabi niya, “Tumakas ka upang iligtas ang buhay mo! Huwag kang lumingon[a] at huwag kang tumigil saanman sa kapatagan. Tumakas ka patungo sa kabundukan,[b] baka mapuksa ka.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Huwag kang tumingin sa likuran mo.”
    reason: lexical_alternative
  - marker: b
    text: O, “sa bundok” o “sa bulubunduking lupain.”
    reason: lexical_alternative
  - marker: c
    text: O, “baka matangay ka sa kapahamakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוּצָה
  choice: mailabas
  rationale: Ipinahahayag ng anyong paturol sa Hebreo ang paggalaw mula sa loob patungo sa labas; likas sa Filipino ang pandiwang “mailabas” sa sugnay na ito.
- source_word: הִמָּלֵט
  choice: Tumakas ka
  rationale: Ang pautos na Niphal ay nagsasaad ng apurahang pagtakas upang makaligtas. Inulit ang parehong salin upang mapanatili ang pag-uulit at diin ng Hebreo.
- source_word: עַל נַפְשֶׁךָ
  choice: upang iligtas ang buhay mo
  rationale: Idyoma itong tumutukoy sa pagliligtas ng sariling buhay. Malinaw at natural ang pagkakasalin habang pinananatili ang matinding pagkaapurahan.
- source_word: אַל תַּבִּיט אַחֲרֶיךָ
  choice: Huwag kang lumingon
  rationale: Ang “lumingon” ang natural na katumbas sa Filipino ng pagtingin sa likuran o pabalik habang tumatakas.
- source_word: וְאַל תַּעֲמֹד
  choice: at huwag kang tumigil
  rationale: Sa konteksto ng agarang pagtakas, ang עמד ay tumutukoy sa paghinto o pananatili, hindi lamang sa pisikal na pagtayo.
- source_word: בְּכָל הַכִּכָּר
  choice: saanman sa kapatagan
  rationale: Ang כִּכָּר dito ay ang malawak na kapatagan sa rehiyon; ipinahahayag ng “saanman” ang saklaw ng בְּכָל sa natural na Filipino.
- source_word: הָהָרָה
  choice: patungo sa kabundukan
  rationale: May hulaping paturol ang salita at maaaring tumukoy sa bundok o bulubunduking lupain. Ang “kabundukan” ay natural na katapat ng mataas na lupa bilang kaibahan sa kapatagan.
- source_word: פֶּן תִּסָּפֶה
  choice: baka mapuksa ka
  rationale: Ang פֶּן ay babalang “baka,” at ang Niphal na נספה ay maaaring mangahulugang mapuksa, mamatay, o matangay kasama ng iba sa kapahamakan.
theological_decisions:
- issue: Pagkakakilanlan ng nagsasalita
  choice: “sinabi niya”
  alternative: “sinabi nila” o “sinabi ng anghel”
  rationale: Isahan ang pandiwa sa tekstong Hebreo. Pinananatili ng salin ang anyong iyon nang hindi tahasang ipinapasiya kung sino sa mga sugo ang nagsalita.
- issue: Saklaw ng banta sa פֶּן תִּסָּפֶה
  choice: “baka mapuksa ka”
  alternative: “baka matangay ka sa kapahamakan”
  rationale: Pinananatili ng pangunahing salin ang babala ng ganap na pagkawasak nang hindi itinatakda ang tiyak na paraan; ibinibigay sa talababa ang posibleng diwa ng pagkadamay sa sakunang sasapit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “buhay mo” at “lumingon” sa halip na mga salitang sobrang literal o makaluma, ngunit pinanatili ang maiikli at mariing pautos ng Hebreo.
