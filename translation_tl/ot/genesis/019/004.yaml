base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/004.yaml
  text: Before they lay down[a], the men of the city, the men of Sodom, surrounded the house—from young to old[c][b], all the people from every quarter.
translation:
  language: tl
  text: Bago sila mahiga, pinalibutan ng mga lalaki ng lungsod—ang mga lalaki ng Sodoma—ang bahay. Mula sa bata hanggang sa matanda, naroon ang buong bayan mula sa bawat dako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa dulo.” Maaari rin itong isaling “mula sa bawat sulok” o “mula sa lahat ng bahagi ng lungsod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם יִשְׁכָּבוּ
  choice: Bago sila mahiga
  rationale: Tuwirang ipinahahayag ang kilos na hindi pa nagaganap at pinananatili ang konkretong diwa ng שׁכב na paghiga, malamang para sa gabi.
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם
  choice: mga lalaki sa lungsod—ang mga lalaki ng Sodoma
  rationale: Pinananatili ang tahasang panlalaking katawagan at ang appositional na pagkakakilanlan ng lungsod bilang Sodoma.
- source_word: נָסַבּוּ עַל הַבַּיִת
  choice: pinalibutan ... ang bahay
  rationale: Likas na Tagalog para sa pagtitipon sa palibot na may diwang nagsasara o kumukubkob.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: Mula sa bata hanggang sa matanda
  rationale: Pinananatili ang merism na sumasaklaw sa buong agwat ng edad nang hindi ito nililimitahan sa mas makitid na mga katawagan.
- source_word: כָּל הָעָם
  choice: ang buong bayan
  rationale: Ang bayan ay likas na kolektibong tawag sa mga mamamayan at pinananatili ang pagkakaiba nito sa naunang tahasang 'mga lalaki.'
- source_word: מִקָּצֶה
  choice: mula sa bawat dako
  rationale: Ipinahahayag ang idyomatikong diwa na nagmula sila sa lahat ng bahagi o sulok ng lungsod, habang iniiwasang magdagdag ng salitang wala sa parirala.
theological_decisions:
- issue: Kasariang tinutukoy sa paglalarawan sa karamihan
  choice: Pinanatili ang 'mga lalaki' para sa אַנְשֵׁי, ngunit ginamit ang kolektibong 'buong bayan' para sa כָּל הָעָם.
  alternative: Gawing pangkalahatan ang lahat bilang 'mga tao sa lungsod,' o gawing 'lahat ng lalaki' ang כָּל הָעָם.
  rationale: Sinasalamin nito ang paglipat sa Hebreo mula sa tahasang panlalaking katawagan tungo sa mas malawak na kolektibong pangngalan, nang hindi pinapantay ang dalawang anyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Hinati sa dalawang pangungusap upang maging malinaw ang sunod-sunod na pariralang Hebreo, habang pinananatili ang pag-uulit at saklaw ng karamihan.
