base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/015.yaml
  text: And as dawn was rising[a], the angels urged Lot, saying, “Get up, take your wife and your two daughters who are here, lest you be swept away in the punishment of the city.”
translation:
  language: tl
  text: Nang magbubukang-liwayway na, mahigpit na hinimok ng mga anghel si Lot, “Bumangon ka! Isama mo ang asawa mo at ang dalawa mong anak na babae na narito, upang hindi ka matangay sa kaparusahan[a] ng lungsod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kasamaan ng lungsod” o “dahil sa pagkakasala ng lungsod.” Ang salitang Hebreo ay maaaring tumukoy sa kasamaan, pananagutan sa kasalanan, o sa kaparusahang bunga nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמוֹ הַשַּׁחַר עָלָה
  choice: Nang nagsisimula nang magbukang-liwayway
  rationale: Likas na ipinapahayag sa modernong Tagalog ang temporal na diwa ng parirala habang pinananatili ang unti-unting pagsapit ng bukang-liwayway.
- source_word: וַיָּאִיצוּ
  choice: mahigpit na hinimok
  rationale: Ipinahihiwatig ng pandiwa ang apurahan at mapilit na pag-uudyok. Malinaw ang “mahigpit na hinimok” nang hindi ipinapalagay na sapilitang kinaladkad si Lot.
- source_word: הַמַּלְאָכִים
  choice: mga anghel
  rationale: Bagaman maaari ring mangahulugang “mga mensahero,” malinaw sa konteksto ng Genesis 19 na mga makalangit na sugo ang tinutukoy.
- source_word: קוּם קַח
  choice: Bumangon ka! Isama mo
  rationale: Pinananatili ang dalawang utos at ang madaliang tono. Mas natural sa Tagalog ang “isama mo” kaysa literal na “kunin mo” para sa paglikas kasama ang pamilya.
- source_word: אֶת אִשְׁתְּךָ וְאֶת שְׁתֵּי בְנֹתֶיךָ
  choice: ang asawa mo at ang dalawa mong anak na babae
  rationale: Tuwirang pinananatili ang asawa, ang tiyak na bilang na dalawa, at ang kaugnayan nila kay Lot.
- source_word: הַנִּמְצָאֹת
  choice: na narito
  rationale: Ang participle ay tumutukoy sa mga anak na babaeng naroroon o kasama niya; maikli at natural ang “na narito.”
- source_word: פֶּן תִּסָּפֶה
  choice: upang hindi ka matangay
  rationale: Ipinapahayag ang babala ng Hebreong פֶּן at ang diwa ng pagkapahamak kasama ng iba na taglay ng Niphal na anyo ng ספה.
- source_word: בַּעֲוֺן הָעִיר
  choice: sa kaparusahan ng lungsod
  rationale: Sa konteksto ng nalalapit na paghatol, maaaring tukuyin ng עָוֹן ang bunga o kaparusahan ng kasamaan. Inilalagay sa talababa ang tunay na saklaw ng kahulugan ng salita.
theological_decisions:
- issue: Ang kahulugan ng עָוֹן sa konteksto ng paghatol
  choice: kaparusahan ng lungsod
  alternative: kasamaan ng lungsod; dahil sa pagkakasala ng lungsod
  rationale: Maaaring mangahulugan ang עָוֹן ng kasamaan, pananagutan sa kasalanan, o kaparusahang bunga nito. Ang agarang babala ay tungkol sa pagkapahamak sa paghatol sa Sodoma, kaya “kaparusahan” ang malinaw na pagbasa sa teksto; pinananatili sa talababa ang ibang lehitimong kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bukang-liwayway” bilang pamilyar na anyong pampanitikan at ang “mahigpit na hinimok” upang maipahayag ang apurahang tono nang hindi nagiging lipas o labis na kolokyal.
