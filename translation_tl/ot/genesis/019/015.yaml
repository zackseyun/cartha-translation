revisions:
- from: Nang nagsisimula nang magbukang-liwayway, mahigpit na hinimok ng mga anghel si Lot, “Bumangon ka! Isama mo ang asawa mo at ang dalawa mong anak na babae na narito, upang hindi ka matangay sa kaparusahan[a] ng lungsod.”
  to: Nang magbubukang-liwayway na, mahigpit na hinimok ng mga anghel si Lot, “Bumangon ka! Isama mo ang asawa mo at ang dalawa mong anak na babae na narito, upang hindi ka matangay sa kaparusahan[a] ng lungsod.”
  rationale: Pinalitan lamang ang panimulang parirala upang alisin ang pag-uulit at gawing mas likas ang Tagalog. Walang binago sa saklaw ng kahulugan, mga tauhan, bilang ng mga anak na babae, apurahang tono, o sa sinadyang kalabuan ng עָוֹן na itinatala ng talababa.
