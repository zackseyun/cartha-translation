  text: הִנֵּה נָ֠א הָ/עִ֨יר הַ/זֹּ֧את קְרֹבָ֛ה לָ/נ֥וּס שָׁ֖מָּ/ה וְ/הִ֣יא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּ/ה הֲ/לֹ֥א מִצְעָ֛ר הִ֖וא וּ/תְחִ֥י נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/020.yaml
  text: Look[a], please, this city is near enough to flee there, and it is small[b]. Please let me escape there—is it not small? Then my life will live.
translation:
  language: tl
  text: '“Tingnan mo, pakiusap: malapit ang lungsod na ito upang doon ako makatakas, at maliit lamang iyon. Pahintulutan mo akong tumakas doon—maliit lamang naman iyon, hindi ba?—upang mabuhay ako.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Tingnan mo, pakiusap
  rationale: Pinananatili ang agarang pagtawag-pansin ng הִנֵּה at ang mapakiusap na puwersa ng נָא sa natural na makabagong Tagalog.
- source_word: הָעִיר הַזֹּאת
  choice: ang lungsod na iyon
  rationale: Bagaman literal na “ang lungsod na ito,” ang tinutukoy ay isang lugar na itinuturo ni Lot at paroroonan pa lamang niya; natural sa Tagalog ang “iyon” para sa lugar na malayo sa nagsasalita.
- source_word: קְרֹבָה לָנוּס שָׁמָּה
  choice: malapit ... at maaari kong takasan
  rationale: Ipinahahayag ang kalapitan ng lungsod bilang dahilan kung bakit maaabot ito ni Lot sa pagtakas. Ginamit ang “takasan” sa diwang tumakas patungo sa isang ligtas na lugar.
- source_word: מִצְעָר
  choice: maliit lamang
  rationale: Pinananatili ang kahulugan at pag-uulit ng salitang tumutukoy sa kaliitan; ipinakikita ng “lamang” ang argumento ni Lot na hindi gaanong mahalaga ang lungsod.
- source_word: אִמָּלְטָה נָּא שָׁמָּה
  choice: Pahintulutan mo akong tumakas doon
  rationale: Ang cohortative at נָא ay isang magalang ngunit apurahang pakiusap, hindi payak na pahayag tungkol sa hinaharap.
- source_word: הֲלֹא מִצְעָר הִוא
  choice: maliit lamang naman iyon, hindi ba?
  rationale: Pinananatili ang retorikal na tanong at ang pag-uulit ng מִצְעָר sa natural na ayos ng Tagalog.
- source_word: וּתְחִי נַפְשִׁי
  choice: upang mabuhay ako
  rationale: Ang נַפְשִׁי rito ay idyomatikong tumutukoy sa mismong tao, at ang waw kasunod ng pakiusap ay nagpapahayag ng layunin o bunga. Iniiwasan nito ang di-natural na literalismong “mabubuhay ang buhay ko.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang mapilit at mapakiusap na tono ni Lot, pati ang dalawang ulit na pagbanggit sa kaliitan ng lungsod. Walang idinagdag na denominasyonal na pagpapakahulugan.
