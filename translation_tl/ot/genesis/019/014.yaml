base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/014.yaml
  text: So Lot went out and spoke to his sons-in-law[a], who were to marry his daughters, and said, “Get up, get out of this place[b], because Yahweh is about to destroy the city.” But he seemed to his sons-in-law to be joking.
translation:
  language: tl
  text: Kaya lumabas si Lot at kinausap ang mga manugang niyang lalaki[a], na nakatakdang magpakasal sa kanyang mga anak na babae. Sinabi niya, “Bumangon kayo! Umalis kayo sa lugar na ito, sapagkat malapit nang wasakin ni Yahweh ang lungsod.” Ngunit para sa kanyang mga manugang, para lamang siyang nagbibiro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “mga manugang niyang lalaki, na napangasawa na ang kanyang mga anak na babae.” Maaaring tumukoy ang pariralang Hebreo sa mga lalaking kasal na sa kanyang mga anak na babae o sa mga nakatakda pa lamang magpakasal.'
    reason: alternative_reading
  - marker: b
    text: 'Sa literal: “ngunit siya ay naging gaya ng isang nagbibiro sa mga mata ng kanyang mga manugang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲתָנָיו
  choice: mga manugang niyang lalaki
  rationale: Ang חָתָן ay maaaring tumukoy sa lalaking ikakasal o sa manugang na lalaki. Ang saling ito ay natural sa Filipino, habang nililinaw ng kasunod na parirala at talababa ang kalagayan ng pag-aasawa.
- source_word: לֹקְחֵי בְנֹתָיו
  choice: na nakatakdang magpakasal sa kanyang mga anak na babae
  rationale: Ang participle na לֹקְחֵי, kasama ng “mga anak na babae,” ay tumutukoy sa pagkuha sa kanila bilang asawa. Ang hinaharap na diwa ay angkop sa daloy ng salaysay, ngunit nananatiling posible sa Hebreo na kasal na sila, kaya inilagay ang alternatibo sa talababa.
- source_word: קוּמוּ צְאוּ
  choice: Bumangon kayo! Umalis kayo
  rationale: Pinananatili ng dalawang tuwirang pautos ang pagmamadali at bigat ng babala sa natural na modernong Filipino.
- source_word: מִן־הַמָּקוֹם הַזֶּה
  choice: sa lugar na ito
  rationale: Kasama ng “umalis,” malinaw at idiomatiko sa Filipino ang “umalis sa lugar na ito,” habang pinananatili ang deiktikong “ito.”
- source_word: מַשְׁחִית
  choice: wawasakin na
  rationale: Ang Hiphil participle ay nagpapahiwatig dito ng napipintong pagkilos. Ang “wawasakin na” ay natural na naghahayag na malapit nang mangyari ang pagwasak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: הָעִיר
  choice: ang lungsod
  rationale: Tuwirang katumbas ito ng tiyak na pangngalang Hebreo at tumutukoy sa lungsod na pinag-uusapan sa salaysay.
- source_word: כִמְצַחֵק
  choice: para lamang siyang nagbibiro
  rationale: Ipinahahayag nito na sa tingin ng mga manugang ay hindi seryoso si Lot, nang hindi pinipiling unawain ang salita bilang panunuya.
- source_word: בְּעֵינֵי
  choice: para sa kanyang mga manugang
  rationale: Natural na Filipino ito para sa idyomang Hebreo na literal na “sa mga mata ng,” na nangangahulugang “sa kanilang palagay.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kalagayan ng pag-aasawa ng mga anak ni Lot
  choice: mga lalaking nakatakdang magpakasal sa kanyang mga anak
  alternative: mga lalaking nakapag-asawa na sa kanyang mga anak
  rationale: Maaaring tumukoy ang pariralang Hebreo sa mga nobyo o sa mga asawa na. Mas angkop sa agarang konteksto ang nalalapit na pag-aasawa, ngunit tunay ang gramatikal na kalabuan at tahasang pinanatili sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling pautos upang madama ang pagmamadali, at pinanatili sa talababa ang tunay na kalabuan tungkol sa kalagayan ng pag-aasawa.
