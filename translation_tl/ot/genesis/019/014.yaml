revisions:
- from: Kaya lumabas si Lot at kinausap ang mga manugang niyang lalaki[a], na nakatakdang magpakasal sa kanyang mga anak na babae. Sinabi niya, “Bumangon kayo! Umalis kayo sa lugar na ito, sapagkat wawasakin na ni Yahweh ang lungsod.” Ngunit para sa kanyang mga manugang, para lamang siyang nagbibiro.[b]
  to: Kaya lumabas si Lot at kinausap ang mga manugang niyang lalaki[a], na nakatakdang magpakasal sa kanyang mga anak na babae. Sinabi niya, “Bumangon kayo! Umalis kayo sa lugar na ito, sapagkat malapit nang wasakin ni Yahweh ang lungsod.” Ngunit para sa kanyang mga manugang, para lamang siyang nagbibiro.[b]
  rationale: Ginawang “malapit nang wasakin” ang pandiwang pangwasak upang maipakita ang napipintong kilos na ipinahihiwatig ng Hebreo at ng English audit trail. Inayos ang alternatibong pagbasa sa talababa para sa mas natural na Filipino, nang hindi inaalis ang tunay na kalabuan kung kasal na ba ang mga lalaki sa mga anak ni Lot o ikakasal pa lamang.
