base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/031.yaml
  text: And the firstborn said to the younger[a], “Our father is old[b], and there is not a man in the land to come in to us according to the way of all the earth.”
translation:
  language: tl
  text: Sinabi ng panganay sa nakababatang kapatid, “Matanda na ang ating ama, at walang lalaki sa lupain na sisiping sa atin[a], ayon sa kaugalian ng buong daigdig[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong parirala ay may diwang “dumating o lumapit sa atin” at isang eupemismo para sa pakikipagtalik.
    reason: lexical_alternative
  - marker: b
    text: Ang “kaugalian ng buong daigdig” ay tumutukoy sa karaniwang paraan ng mga tao; sa kontekstong ito, maaaring partikular itong tumukoy sa pagsasama ng lalaki at babae at pagpapatuloy ng angkan.
    reason: cultural_note
lexical_decisions:
- source_word: הַבְּכִירָה
  choice: ang panganay
  rationale: Tuwirang pinananatili ang diin sa pagkakasunod ng kapanganakan; malinaw sa konteksto na siya ang panganay na anak na babae ni Lot.
- source_word: הַצְּעִירָה
  choice: sa nakababatang kapatid
  rationale: Ang salita ay nangangahulugang mas bata o nakababata. Idinagdag ang “kapatid” upang maging likas at malinaw sa Tagalog nang hindi inuulit ang impormasyong babae silang dalawa.
- source_word: אָבִינוּ זָקֵן
  choice: Matanda na ang ating ama
  rationale: Likas na Tagalog ito para sa payak na sugnay na Hebreo at ipinahihiwatig ng “na” ang pagtanda ng ama sa kasalukuyang kalagayan.
- source_word: וְאִישׁ אֵין בָּאָרֶץ
  choice: at walang lalaki sa lupain
  rationale: Pinananatili ang tiyak na pagtukoy sa lalaki at ang literal na saklaw na “sa lupain,” nang hindi ipinapalagay kung lokal o pandaigdig ang pagkaunawa ng nagsasalita.
- source_word: לָבוֹא עָלֵינוּ
  choice: na sisiping sa atin
  rationale: Seksuwal na eupemismo ang Hebreo. Ang “sisiping sa atin” ay isang likas at marangal na eupemismo sa Tagalog; ang literal na “papasok sa atin” ay madaling mapagkamalang pisikal na pagpasok lamang at hindi natural sa ganitong diwa.
- source_word: כְּדֶרֶךְ כָּל הָאָרֶץ
  choice: ayon sa kaugalian ng buong daigdig
  rationale: Ipinahahayag nito ang karaniwang paraan o gawi ng sangkatauhan, habang pinananatili ang malawak na pananalitang “buong daigdig.”
theological_decisions:
- issue: Saklaw ng בָאָרֶץ sa pahayag na walang lalaki
  choice: sa lupain
  alternative: sa buong daigdig
  rationale: Maaaring limitado sa nakikitang lupain o maunawaan ng mga anak bilang mas malawak ang saklaw. Hindi nilulutas ng salin ang posibleng tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sisiping” upang mapanatili ang eupemistikong tono ng Hebreo nang hindi maging malabo o magaspang; pinanatili naman ang “sa lupain” upang hindi paliitin o palawakin nang sapilitan ang saklaw ng orihinal.
