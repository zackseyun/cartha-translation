  text: 'And he said to him[a], “Look, I grant you this request also: I will not overthrow the city of which you have spoken.”'
translation:
  language: tl
  text: 'At sinabi niya sa kanya, “Narito, pinagbigyan din kita sa kahilingang ito[a]: hindi ko gugunawin ang lungsod na binanggit mo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “itinaas ko ang iyong mukha,” isang idyomang nangangahulugang “pinakitaan kita ng pabor” o “pinagbigyan ko ang kahilingan mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang pantawag-pansing puwersa ng Hebreo sa isang maikli at marangal na panandang nauunawaan pa rin sa makabagong Filipino.
- source_word: נָשָׂאתִי פָנֶיךָ
  choice: pinagbigyan kita
  rationale: Ang literal na idyomang ‘itinaas ko ang iyong mukha’ ay nagpapahiwatig ng pagpapakita ng pabor sa pamamagitan ng pagtanggap sa pakiusap; natural na ipinahahayag ito ng ‘pinagbigyan kita.’
- source_word: גַּם לַדָּבָר הַזֶּה
  choice: din ... sa kahilingang ito
  rationale: Ang דָּבָר ay tumutukoy sa bagay na kababanggit lamang ni Lot, na sa konteksto ay isang kahilingan; pinananatili ng ‘din’ ang puwersang pandagdag ng גַּם.
- source_word: לְבִלְתִּי הָפְכִּי
  choice: hindi ko gugunawin
  rationale: 'Ipinahahayag ng parirala ang ipinagkaloob na resulta: hindi wawasakin ng nagsasalita ang lungsod. Ang ‘gugunawin’ ay natural sa Filipino para sa malaking kapahamakang sinasapit ng isang lungsod, bagaman hindi nito literal na inuulit ang larawang ‘baligtarin’ ng ugat הפך.'
- source_word: הָעִיר
  choice: ang lungsod
  rationale: Tuwirang salin ng tiyak at isahang pangngalan.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: na sinabi mo
  rationale: Malinaw at natural na tumutukoy sa lungsod na binanggit ni Lot nang hindi nagdaragdag ng paliwanag na wala sa Hebreo.
