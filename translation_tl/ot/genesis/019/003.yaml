  to: Ngunit mahigpit niya silang hinimok[a], kaya lumihis sila patungo sa kanya at pumasok sa kanyang bahay. Naghanda siya ng isang handaan para sa kanila, at naghurno siya ng tinapay na walang pampaalsa[b]. At kumain sila.
