  yaml_path: translation/ot/genesis/019/003.yaml
  text: But he urged them strongly[a], so they turned aside to him and entered his house. He prepared a feast for them, baked unleavened bread[b], and they ate.
translation:
  language: tl
  text: Ngunit mahigpit niya silang hinimok[a], kaya lumihis sila patungo sa kanya at pumasok sa kanyang bahay. Naghanda siya ng isang handaan para sa kanila, at naghurno siya ng tinapay na walang pampaalsa[b]. At kumain sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matindi niya silang pinakiusapan” o “mariin niyang iginiit.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga tinapay na walang pampaalsa” o “mga tinapay na hindi pinaalsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצַר בָּם מְאֹד
  choice: mahigpit niya silang hinimok
  rationale: Ipinahahayag ng פצר ang mapilit at masidhing paghimok, at pinatitindi ito ng מְאֹד. Ang pariralang ito ay natural sa modernong Filipino at pinananatili ang tindi ng Hebreo.
- source_word: וַיָּסֻרוּ אֵלָיו
  choice: lumihis sila patungo sa kanya
  rationale: Pinananatili ng “lumihis” ang pangunahing larawan ng סור na pagtalikod o paglihis mula sa dating daraanan, habang malinaw na isinasalin ng “patungo sa kanya” ang אֵלָיו.
- source_word: וַיָּבֹאוּ אֶל־בֵּיתוֹ
  choice: pumasok sa kanyang bahay
  rationale: Natural at tuwirang ipinapahayag nito ang pagdating sa loob ng bahay na tinutukoy ng Hebreo.
- source_word: מִשְׁתֶּה
  choice: isang handaan
  rationale: Ang מִשְׁתֶּה ay handaan o piging, na maaaring may kasamang inumin. Hindi kailangang idiin dito ang pag-inom, kaya malawak at angkop ang “handaan.”
- source_word: מַצּוֹת אָפָה
  choice: nagluto ng tinapay na walang pampaalsa
  rationale: Malinaw sa karaniwang mambabasa ang uri ng tinapay. Ang “nagluto” ay natural na Filipino para sa paghahanda ng tinapay sa pamamagitan ng init, samantalang ipinaliliwanag sa talababa ang mas tiyak na “naghurno.”
- source_word: וַיֹּאכֵלוּ
  choice: At kumain sila
  rationale: Payak na pinananatili ang kasunod na pangyayari at ang pang-ugnay ng salaysay.
