source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/שַׁחֵ֤ת אֱלֹהִים֙ אֶת עָרֵ֣י הַ/כִּכָּ֔ר וַ/יִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת אַבְרָהָ֑ם וַ/יְשַׁלַּ֤ח אֶת לוֹט֙ מִ/תּ֣וֹךְ הַ/הֲפֵכָ֔ה בַּ/הֲפֹךְ֙ אֶת הֶ֣/עָרִ֔ים אֲשֶׁר יָשַׁ֥ב בָּ/הֵ֖ן לֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/029.yaml
  text: So it happened[a], when God destroyed the cities of the plain, that God remembered Abraham and sent Lot out of the midst of the overthrow[d][c][b], when he overthrew the cities in which Lot had lived.
translation:
  language: tl
  text: Nang wasakin ng Diyos ang mga lungsod sa kapatagan, inalala ng Diyos si Abraham[a] at pinalabas niya si Lot mula sa gitna ng pagkawasak[b], nang wasakin niya ang mga lungsod na tinirhan ni Lot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “inalala ng Diyos si Abraham” ay idyomang Hebreo na nagpapahiwatig na kumilos ang Diyos nang may tapat na pagkalinga kay Abraham; hindi nito sinasabing nalimutan muna siya ng Diyos.
    reason: cultural_note
  - marker: b
    text: O “mula sa gitna ng pagwasak.” Ang salitang Hebreo para sa “pagkawasak” ay kaugnay ng kasunod na pandiwang isinaling “wasakin,” kaya may pag-uulit ng magkaugnay na salita sa orihinal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּשַׁחֵת
  choice: Kaya nang wasakin
  rationale: Ang וַיְהִי ay panandang pasalaysay at ang בְּשַׁחֵת ay sugnay na temporal. Likas sa modernong Tagalog ang “Kaya nang…” at naipapakita nito ang pag-usad ng salaysay nang hindi gumagamit ng mabigat na “At nangyari na.”
- source_word: עָרֵי הַכִּכָּר
  choice: ang mga lungsod sa Kapatagan
  rationale: Sa konteksto ng Genesis 13 at 19, ang כִּכָּר ay tumutukoy sa partikular na kapatagan o distrito ng Jordan; ang malaking titik ay tumutulong na ipakitang heograpikong tawag ito rito.
- source_word: וַיִּזְכֹּר אֱלֹהִים אֶת אַבְרָהָם
  choice: inalala ng Diyos si Abraham
  rationale: Pinananatili ang idyomang Hebreo ng pag-alaala ng Diyos sa halip na palitan ito ng interpretatibong “kumilos alang-alang kay Abraham.”
- source_word: וַיְשַׁלַּח אֶת לוֹט
  choice: at inilabas niya si Lot
  rationale: Sa kontekstong ito, ipinahihiwatig ng שׁלח ang pagpapalabas kay Lot mula sa sakuna. Mas natural sa Tagalog ang “inilabas” kaysa “ipinadala palabas,” nang hindi tahasang pinapalitan ito ng interpretatibong “iniligtas.”
- source_word: מִתּוֹךְ הַהֲפֵכָה
  choice: mula sa gitna ng pagkawasak
  rationale: Pinananatili ng “mula sa gitna” ang diwa ng תּוֹךְ. Ang הֲפֵכָה ay literal na pagbaligtad o paggiba ngunit tumutukoy dito sa malaking pagkawasak.
- source_word: בַּהֲפֹךְ אֶת הֶעָרִים
  choice: nang gibain niya ang mga lungsod
  rationale: Ang infinitive construct na may בְּ ay temporal. Ang “gibain” ay nagpapanatili sa larawan ng pagbagsak o pagbaligtad, bagaman hindi lubos na matutumbasan sa Tagalog ang ugnayang leksikal nito sa הֲפֵכָה.
- source_word: אֲשֶׁר יָשַׁב בָּהֵן לוֹט
  choice: na tinirhan ni Lot
  rationale: Natural at tuwirang katumbas sa Tagalog ng paninirahan ni Lot sa mga lungsod na tinutukoy.
theological_decisions:
- issue: Kahulugan ng “inalala ng Diyos si Abraham”
  choice: Panatilihin sa pangunahing teksto ang idyomang “inalala ng Diyos si Abraham.”
  alternative: “Kumilos ang Diyos alang-alang kay Abraham” o “isinaalang-alang ng Diyos si Abraham.”
  rationale: Sa salaysay na Hebreo, ang pag-alaala ng Diyos ay karaniwang nagpapahiwatig ng tapat na pagkalingang humahantong sa pagkilos. Hindi ito nangangahulugang nalimutan muna ng Diyos si Abraham. Pinananatili ng salin ang mismong idyoma at ipinapaliwanag ang implikasyon sa talababa.
- issue: Ugnayan ng pag-alaala kay Abraham at paglabas ni Lot
  choice: Panatilihin ang pagkakasunod ng mga sugnay nang hindi tahasang idinaragdag ang “dahil kay Abraham.”
  alternative: “Dahil inalala ng Diyos si Abraham, iniligtas niya si Lot.”
  rationale: Malinaw sa teksto ang ugnayan, ngunit hindi ginamit ng Hebreo ang tahasang pormulang sanhi. Ang mas interpretatibong pagbubuo ay maaaring magsara sa tunay na sintaktikong puwang ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lungsod” at “Kapatagan” bilang natural na katawagang heograpiko. Iniwasan ang arkaikong “At nangyari” at ang interpretatibong “iniligtas,” habang pinanatili ang idyoma at teolohikal na tensiyon ng tekstong Hebreo.
