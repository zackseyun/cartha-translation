base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/037.yaml
  text: The firstborn bore a son and called his name Moab[a]; he is the father of Moab to this day.
translation:
  language: tl
  text: Nagsilang ng isang anak na lalaki ang panganay na anak na babae at pinangalanan niya itong Moab[a]. Siya ang ninuno ng mga Moabita hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring may paglalaro ng tunog o salita ang pangalang “Moab” sa Hebreong pariralang nangangahulugang “mula sa ama.”
    reason: wordplay
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Nagsilang
  rationale: Ang Qal ng ילד dito ay nangangahulugang manganak o magsilang; natural at tuwiran ang “nagsilang” sa salaysay.
- source_word: הַבְּכִירָה
  choice: ang panganay na anak na babae
  rationale: Feminine singular ang anyo at tumutukoy sa nakatatandang anak na babae ni Lot; nililinaw ng “anak na babae” ang referent habang pinananatili ang diwang “panganay.”
- source_word: בֵּן
  choice: isang anak na lalaki
  rationale: Tuwirang katumbas ng Hebrew at likas sa modernong Tagalog.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: pinangalanan niya itong
  rationale: Natural na Tagalog para sa idyomang literal na “tinawag ang pangalan niya,” nang hindi binabago ang kilos ng pagbibigay ng pangalan.
- source_word: מוֹאָב
  choice: Moab
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang pantangi.
- source_word: אֲבִי מוֹאָב
  choice: ninuno ng mga Moabita
  rationale: Bagaman literal na “ama ng Moab,” ginagamit dito ang pangalan ng ninuno para sa bayang nagmula sa kanya; “ninuno ng mga Moabita” ang malinaw at natural na pagpapahayag ng diwa.
- source_word: עַד הַיּוֹם
  choice: hanggang sa araw na ito
  rationale: Pinananatili ang karaniwang Hebreong pormula na tumutukoy sa panahon ng tagapagsalaysay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “panganay na anak na babae” upang maging tiyak ang feminine referent, at “ninuno ng mga Moabita” upang natural na maipahayag ang etnikong kahulugan ng literal na “ama ng Moab.”
