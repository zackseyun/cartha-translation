id: GEN.19.13
reference: Genesis 19:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי מַשְׁחִתִ֣ים אֲנַ֔חְנוּ אֶת הַ/מָּק֖וֹם הַ/זֶּ֑ה כִּֽי גָֽדְלָ֤ה צַעֲקָתָ/ם֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יְשַׁלְּחֵ֥/נוּ יְהוָ֖ה לְ/שַׁחֲתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/013.yaml
  text: For we are about to destroy this place[a], because their outcry has become great before Yahweh, and Yahweh has sent us to destroy it.
translation:
  language: tl
  text: Sapagkat malapit na naming wasakin ang lugar na ito[a], dahil naging matindi ang kanilang daing sa harap ni Yahweh, at isinugo kami ni Yahweh upang wasakin ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang kasunod na bahagi: “sapagkat naging matindi sa harap ni Yahweh ang daing laban sa kanila.” Pormal na mababasa sa Hebreo ang “kanilang daing,” ngunit sa konteksto ay inuunawa ito ng marami bilang daing na ibinangon laban sa mga tao sa lugar na ito.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁחִתִים
  choice: malapit na naming wasakin
  rationale: Ang Hiphil participle na maramihan ay nagpapahayag dito ng nalalapit na pagkilos; natural sa Tagalog ang pariralang ito para sa kapahamakang agad nang isasagawa.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ang lugar na ito
  rationale: Tuwirang pinananatili ang kahulugan at deiktikong diin ng parirala.
- source_word: גָדְלָה
  choice: naging matindi
  rationale: Ipinahahayag ng Qal perfect ang pag-abot sa isang matinding antas; mas natural sa Tagalog ang “naging matindi” kaysa sa literal na “naging dakila” kapag daing ang tinutukoy.
- source_word: צַעֲקָתָם
  choice: ang kanilang daing
  rationale: Pinananatili nito ang tuwirang lakas ng hulaping 3mp (“kanilang”) at ang diwa ng sigaw ng dalamhati o hinaing, nang hindi nilulutas sa pangunahing teksto kung ang daing ay sa kanila o laban sa kanila.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Likas na katumbas sa Tagalog ng idyomang Hebreo, na may diwa ng pagdating sa presensiya o pansin ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וַיְשַׁלְּחֵנוּ
  choice: isinugo kami
  rationale: Ipinahahayag ang natapos na pagsusugo o pag-aatas na humantong sa kasalukuyang misyon ng mga nagsasalita.
- source_word: לְשַׁחֲתָהּ
  choice: upang wasakin ito
  rationale: Malinaw na ipinahahayag ang layunin ng pagsusugo at inuulit ang parehong pandiwang-ugat para sa pagkakaugnay; “ito” ang natural na pagtukoy sa lugar o lungsod.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo; ang “Yahweh” ay nagpapanatili sa personal na pangalan sa halip na ipalit ang isang titulo.
- issue: Kahulugan ng צַעֲקָתָם
  choice: ang kanilang daing
  alternative: ang daing laban sa kanila
  rationale: Ang hulaping Hebreo ay pormal na “kanilang,” ngunit maaaring unawain sa konteksto bilang daing na ibinangon laban sa mga tao ng lugar. Pinananatili sa pangunahing teksto ang anyong Hebreo at inilalagay sa talababa ang mahalagang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “malapit na naming wasakin” upang likas na maipahayag ang nalalapit na kilos, at “daing” upang panatilihin ang bigat ng sigaw ng paghihirap o hinaing. Nasa pangunahing teksto ang marker na [a] at tumutugma ito sa talababa.
