  yaml_path: translation/ot/genesis/019/032.yaml
  text: Come[a], let us make our father drink wine, and let us lie with him[b], so that we may preserve offspring through our father.
translation:
  language: tl
  text: “Halika, painumin natin ng alak ang ating ama, at sumiping tayo sa kanya, upang mapanatili natin ang lahi mula sa ating ama.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָה
  choice: Halika
  rationale: Isang idyomatikong panawagan na humihimok na kumilos; natural sa makabagong Tagalog at pinananatili ang puwersang paghihikayat.
- source_word: נַשְׁקֶה אֶת־אָבִינוּ יַיִן
  choice: painumin natin ng alak ang ating ama
  rationale: Ang Hiphil ng שקה ay causative. Malinaw at natural na ipinahahayag ng “painumin natin” na bibigyan o gagawing uminom ng alak ang ama.
- source_word: וְנִשְׁכְּבָה עִמּוֹ
  choice: at sipingan natin siya
  rationale: Ang שכב na may עִם ay eupemismo para sa pakikipagtalik. Ang “sipinan” ay dignified at hindi labis na tahas, habang malinaw ang seksuwal na diwa sa konteksto.
- source_word: וּנְחַיֶּה
  choice: upang magkaroon tayo
  rationale: Sa ugnayan nito sa זרע, ipinahahayag ng parirala ang layuning maipagpatuloy o mapanatili ang lahi. Ang natural na Tagalog na “magkaroon tayo ng supling” ay naghahatid ng layuning ito nang hindi mekanikal.
- source_word: מֵאָבִינוּ זָרַע
  choice: ng supling mula sa ating ama
  rationale: Ang זרע rito ay tumutukoy sa anak o lahi, kaya ang “supling” ay malinaw at angkop. Pinananatili ng “mula sa ating ama” ang pinagmumulang ipinahahayag ng מִן.
