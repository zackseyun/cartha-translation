  - severity: low
    issue: Ang “sipingan natin siya” ay hindi gaanong natural at hindi gaanong tiyak bilang seksuwal na eupemismo.
    rationale: Ang “sumiping tayo sa kanya” ay mas karaniwang gamit sa marangal na Filipino at mas mahusay na tumutugma sa שכב עם.
