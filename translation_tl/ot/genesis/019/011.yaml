  text: וְֽ/אֶת הָ/אֲנָשִׁ֞ים אֲשֶׁר פֶּ֣תַח הַ/בַּ֗יִת הִכּוּ֙ בַּ/סַּנְוֵרִ֔ים מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּלְא֖וּ לִ/מְצֹ֥א הַ/פָּֽתַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/011.yaml
  text: And they struck the men who were at the entrance of the house with blindness[a], from the least to the greatest, so that they wore themselves out trying to find the doorway.
translation:
  language: tl
  text: At binulag nila ang mga lalaking nasa pasukan ng bahay[a], mula sa pinakamababa hanggang sa pinakadakila, kaya napagod sila nang husto sa paghahanap sa pasukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinagulo ang kanilang paningin” o “pinasilaw”; ang pambihirang salitang Hebreo ay maaaring tumukoy sa higit pa sa karaniwang pagkabulag.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּ
  choice: binulag
  rationale: Sa pariralang הִכּוּ בַּסַּנְוֵרִים, ang Hiphil ng נכה kasama ng uri ng kapansanan ay likas na maisasalin sa Filipino bilang pagpapasapit ng pagkabulag; mas natural ang “binulag” kaysa literal na “hinampas ng pagkabulag.”
- source_word: הָאֲנָשִׁים
  choice: mga lalaking
  rationale: Tumutukoy ito sa mga lalaking nagkakagulong sa labas ng bahay ni Lot, kaya pinananatili ang tiyak na kasarian ng אֲנָשִׁים.
- source_word: אֲשֶׁר פֶּתַח הַבַּיִת
  choice: nasa pasukan ng bahay
  rationale: Ang פֶּתַח ay pasukan o bukana; malinaw at natural sa modernong Filipino ang “pasukan ng bahay.”
- source_word: בַּסַּנְוֵרִים
  choice: binulag
  rationale: Ang pambihirang salitang סַנְוֵרִים ay nagsasaad ng sobrenatural na kapansanan sa paningin. “Binulag” ang pinakamalinaw na pangunahing salin, habang inilalagay sa talababa ang posibleng diwang pagkalito o pagkasilaw ng paningin.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: mula sa pinakamababa hanggang sa pinakadakila
  rationale: Pinananatili nito ang merismong tumutukoy sa buong pangkat ayon sa antas o katayuan, nang hindi ito ginagawang “bata hanggang matanda,” na hindi tahasang sinasabi ng Hebreo.
- source_word: וַיִּלְאוּ
  choice: napagod sila nang husto
  rationale: Ipinahahayag ng לָאָה ang matinding pagkapagod o pagkaubos ng lakas; natural at malinaw sa Filipino ang pariralang ito.
- source_word: לִמְצֹא
  choice: sa paghahanap
  rationale: Ipinapakita ng infinitive ang gawaing sanhi ng kanilang matinding pagkapagod at pagkabigo.
- source_word: הַפָּתַח
  choice: sa pasukan
  rationale: Ang “pasukan” ay direktang katumbas ng bukana o doorway at pinananatili ang pag-uulit ng parehong salitang Hebreo sa talata.
theological_decisions:
- issue: Likas ng kapansanang ipinahihiwatig ng סַנְוֵרִים
  choice: sobrenatural na pagkabulag
  alternative: nakabubulag na pagkasilaw o pagkalito ng paningin
  rationale: Malinaw sa salaysay na hindi na nila makita o matagpuan ang pasukan, ngunit pambihira ang terminong Hebreo at maaaring higit pa sa karaniwang pagkabulag ang kahulugan. Kaya “binulag” ang nasa teksto at pinananatili sa talababa ang ibang posibleng nuances.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Iniwasan ang di-likas na literalismong “hinampas ng pagkabulag,” ngunit pinanatili ang merismo at ang pag-uulit ng “pasukan.”
