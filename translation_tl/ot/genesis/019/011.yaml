  source_fidelity: Tumpak na naipapahayag ng salin ang pagkilos na ipinataw sa mga lalaking nasa bungad ng bahay, ang saklaw na “mula sa pinakamababa hanggang sa pinakadakila,” at ang kanilang pagkaubos ng lakas sa pagtatangkang matagpuan ang pasukan. Ang “binulag” ay isang malinaw at katanggap-tanggap na pangunahing salin ng bihirang סַנְוֵרִים nang hindi inaalis ang leksikal na pag-aalinlangan, dahil nasa talababa ang mga alternatibong diwa.
  naturalness: 'Natural at malinaw ang modernong Filipino: “binulag nila,” “mga lalaking nasa pasukan ng bahay,” at “napagod sila nang husto sa paghahanap” ay maayos ang daloy at angkop sa marangal na rehistro ng salaysay. Naiiwasan nito ang di-likas na literal na konstruksiyon.'
