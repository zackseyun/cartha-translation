base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/038.yaml
  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
translation:
  language: tl
  text: Nagsilang din ng isang anak na lalaki ang nakababatang anak na babae at pinangalanan niya itong Ben-ammi.[a] Siya ang ninuno ng mga Ammonita[b] hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Ben-ammi ay malamang na nangangahulugang “anak ng aking bayan” o “anak ng aking kamag-anak.”
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “mga anak ni Ammon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצְּעִירָה
  choice: ang nakababatang anak na babae
  rationale: Bagaman substantibo lamang ang Hebreong pang-uri, malinaw sa konteksto na tumutukoy ito sa nakababatang anak na babae ni Lot; ginagawang tahas ito sa Tagalog para sa likas at malinaw na daloy.
- source_word: גַם הִוא
  choice: din
  rationale: Ipinahihiwatig na tulad ng nakatatandang kapatid, nagsilang din siya; natural na ipinapahayag ito ng enclitic na “din.”
- source_word: יָלְדָה בֵּן
  choice: nagsilang ng isang anak na lalaki
  rationale: Tumpak at karaniwang salin ng Hebreong parirala sa salaysay ng kapanganakan.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: pinangalanan niya itong
  rationale: Natural na modernong Tagalog para sa Hebreong pormula ng pagbibigay-pangalan nang hindi nawawala ang diwa nito.
- source_word: בֶּן עַמִּי
  choice: Ben-ammi
  rationale: Pinananatili ang personal na pangalan sa transliterasyon; inilalagay sa talababa ang posibleng kahulugan dahil mahalaga ito sa salaysay.
- source_word: הוּא אֲבִי
  choice: Siya ang ninuno
  rationale: Ang “ama” rito ay tumutukoy sa pinagmulan ng isang pangkat ng mga tao; mas malinaw at natural sa Tagalog ang “ninuno” kaysa literal na “ama.”
- source_word: בְנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Likas na katawagan sa modernong Tagalog para sa pangkat na literal na tinatawag na “mga anak ni Ammon”; pinananatili sa talababa ang literal na anyo.
- source_word: עַד הַיּוֹם
  choice: hanggang sa araw na ito
  rationale: Karaniwang katumbas ng Hebreong pahayag na tumutukoy sa pagpapatuloy hanggang sa panahon ng tagapagsalaysay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nakababatang anak na babae” para maging tahas ang konteksto, “ninuno” para sa kolektibong genealogical na diwa ng אָב, at “mga Ammonita” bilang natural na pangalan ng bayan.
