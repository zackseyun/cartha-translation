- from: “Masdan po, ang inyong lingkod ay nakasumpong ng kagandahang-loob sa inyong paningin, at ginawa ninyong dakila ang inyong tapat na pag-ibig[a] na ipinakita ninyo sa akin sa pagliligtas ng aking buhay. Ngunit hindi ako makatakas patungo sa bundok, baka abutan ako ng kapahamakan[b] at mamatay ako.”
  to: “Masdan po, ang inyong lingkod ay nakasumpong ng kagandahang-loob sa inyong paningin, at lalo ninyong ipinakita ang inyong tapat na pag-ibig[a] sa akin sa pagliligtas ng aking buhay. Ngunit hindi ako makatakas patungo sa bundok, baka abutan ako ng kapahamakan[b] at mamatay ako.”
  rationale: Pinalitan ang hindi gaanong likas na literal na ayos ng “ginawa ninyong dakila” ng “lalo ninyong ipinakita,” na malinaw na naghahayag ng pinasidhing ḥesed na aktuwal na ipinamalas sa pag-iingat sa buhay ni Lot. Inalis din ang paulit-ulit na sugnay na “na ipinakita ninyo” dahil saklaw na ito ng binagong pandiwa. Walang binagong kahulugan, pangalan, terminong teolohikal, o ankla ng talababa.
