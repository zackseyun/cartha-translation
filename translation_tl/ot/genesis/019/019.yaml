source:
  edition: WLC
  text: הִנֵּה נָ֠א מָצָ֨א עַבְדְּ/ךָ֣ חֵן֮ בְּ/עֵינֶי/ךָ֒ וַ/תַּגְדֵּ֣ל חַסְדְּ/ךָ֗ אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִמָּדִ֔/י לְ/הַחֲי֖וֹת אֶת נַפְשִׁ֑/י וְ/אָנֹכִ֗י לֹ֤א אוּכַל֙ לְ/הִמָּלֵ֣ט הָ/הָ֔רָ/ה פֶּן תִּדְבָּקַ֥/נִי הָ/רָעָ֖ה וָ/מַֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/019.yaml
  text: Look[a], please, your servant has found favor in your eyes, and you have made great your steadfast love that you have shown me by preserving my life. But I cannot escape to the mountain[b], lest the disaster overtake me and I die.
translation:
  language: tl
  text: “Masdan po, ang inyong lingkod ay nakasumpong ng kagandahang-loob sa inyong paningin, at lalo ninyong ipinakita ang inyong tapat na pag-ibig[a] sa akin sa pagliligtas ng aking buhay. Ngunit hindi ako makatakas patungo sa bundok, baka abutan ako ng kapahamakan[b] at mamatay ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inyong kagandahang-loob,” “inyong awa,” o “inyong tapat na kabutihan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kasamaan”; dito ay tumutukoy sa sakuna o kapahamakang maaaring umabot kay Lot.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Masdan po
  rationale: Pinananatili ng “Masdan” ang panawag-pansin ng הִנֵּה, samantalang ipinahahayag ng “po” ang magalang at apurahang pakiusap ng נָא sa natural na paraang Tagalog.
- source_word: מָצָא ... חֵן בְּעֵינֶיךָ
  choice: nakasumpong ng kagandahang-loob sa inyong paningin
  rationale: Pinananatili ang Hebreong idyoma at larawan ng pagtanggap ng mabuting pagtingin, habang malinaw sa makabagong Tagalog.
- source_word: עַבְדְּךָ
  choice: ang inyong lingkod
  rationale: Ito ay magalang na pagtukoy ni Lot sa sarili sa harap ng mga nakatataas; hindi pangunahing binibigyang-diin dito ang katayuang alipin.
- source_word: וַתַּגְדֵּל
  choice: ginawa ninyong dakila
  rationale: Tuwirang ipinahahayag ang Hiphil na diwang ‘ginawang dakila’ nang hindi pinapahina ang pagpapasidhi ng pandiwa.
- source_word: חַסְדְּךָ
  choice: ang inyong tapat na pag-ibig
  rationale: Sinasaklaw nito ang matatag, mapagbiyaya, at tapat na kabutihan ng חֶסֶד; inilalagay sa talababa ang iba pang lehitimong salin.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: na ipinakita ninyo sa akin
  rationale: Natural itong kaakibat ng ‘tapat na pag-ibig’ at ipinahahayag ang kabutihang aktuwal na ginawa para kay Lot.
- source_word: לְהַחֲיוֹת אֶת נַפְשִׁי
  choice: sa pagliligtas ng aking buhay
  rationale: Ipinahahayag ang layunin o bunga na manatiling buhay si Lot. Ang ‘buhay’ rito ang diwa ng נֶפֶשׁ, hindi isang hiwalay na di-materyal na bahagi ng tao.
- source_word: וְאָנֹכִי לֹא אוּכַל
  choice: Ngunit hindi ako makata­kas
  rationale: Ipinapakita ng “Ngunit” ang malinaw na pagsalungat sa naunang kabutihang tinanggap, at pinananatili ng “ako” ang diin ng אָנֹכִי.
- source_word: לְהִמָּלֵט הָהָרָה
  choice: makatakas patungo sa bundok
  rationale: Pinananatili ang isahang ‘bundok’ at ang direksiyong ipinahahayag ng hulaping locative na -ה.
- source_word: פֶּן תִּדְבָּקַנִי
  choice: baka abutan ako
  rationale: Ang פֶּן ay nagpapakilala ng kinatatakutang bunga, at ang דבק ay idyomatikong tumutukoy rito sa kapahamakang makaaabot o makahahabol kay Lot.
- source_word: הָרָעָה
  choice: ang kapahamakan
  rationale: Sa konteksto, tumutukoy ang רָעָה sa mapaminsalang kalamidad, hindi lamang sa moral na kasamaan; pinananatili sa talababa ang literal na anyo.
theological_decisions:
- issue: Pagpapakahulugan sa חֶסֶד sa pakiusap sa mga sugo na kumikilos sa kapangyarihan ng Diyos
  choice: tapat na pag-ibig
  alternative: kagandahang-loob; awa; tapat na kabutihan
  rationale: Pinananatili ng salin ang lalim ng mapagbiyaya at matatag na katapatan nang hindi iginigiit na isa itong teknikal na pormulang pangtipan sa talatang ito.
- issue: Kahulugan ng נַפְשִׁי
  choice: aking buhay
  alternative: aking kaluluwa; ako
  rationale: Sa kontekstong inililigtas si Lot mula sa kamatayan, ang tinutukoy ay ang kaniyang buhay. Iniiwasan nitong magpasok ng di-kinakailangang antropolohikal na pagpapakahulugan.
- issue: Kahulugan ng הָרָעָה
  choice: kapahamakan
  alternative: kasamaan; sakuna
  rationale: Ang nalalapit na pagwasak ang kinatatakutan ni Lot. Ang ‘kapahamakan’ ay nagpapanatili ng negatibong lakas ng salita nang hindi ito ginagawang moral na kasamaan lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “po” at maramihang anyong “inyong/ninyo” bilang magalang na pakikipag-usap, nang hindi nilulutas kung isa o higit pa ang tuwirang kinakausap sa sandaling ito. Ang “Masdan” ay bahagyang mataas ang rehistro ngunit malinaw at angkop sa panawag-pansin ng salaysay.
