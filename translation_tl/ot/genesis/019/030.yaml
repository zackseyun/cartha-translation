base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/030.yaml
  text: Then Lot went up from Zoar and lived in the mountains[a], and his two daughters were with him, because he was afraid to live in Zoar. So he lived in a cave, he and his two daughters.
translation:
  language: tl
  text: Pagkatapos, umahon si Lot mula sa Zoar at nanirahan sa kabundukan, at kasama niya ang dalawa niyang anak na babae, sapagkat natatakot siyang manirahan sa Zoar. Kaya nanirahan siya sa isang yungib[a], siya at ang dalawa niyang anak na babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “sa yungib.” Maaaring tumukoy ang tiyak na pantukoy sa mismong yungib na tinirhan niya, bagaman natural sa Filipino ang “sa isang yungib” sa unang pagbanggit sa tirahang ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: umahon
  rationale: Pinananatili nito ang direksiyong pataas na ipinahihiwatig ng pandiwang עלה at ang topograpiya ng pag-alis ni Lot sa Zoar.
- source_word: מִצּוֹעַר
  choice: mula sa Zoar
  rationale: Tuwirang ipinapahayag ng pang-ukol na מִן ang paggalaw palayo sa Zoar.
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Sa kontekstong ito, ang ישב ay tumutukoy sa paninirahan, hindi lamang sa pag-upo. Ang “nanirahan” ay natural at dignified sa makabagong Filipino.
- source_word: בָּהָר
  choice: sa kabundukan
  rationale: Maaaring gamitin nang kolektibo o topograpiko ang isahang הַר. Ang “kabundukan” ay natural sa Filipino at pinananatili ang bulubunduking lokasyon nang hindi ipinapalagay na isang tiyak na bundok lamang.
- source_word: וּשְׁתֵּי בְנֹתָיו עִמּוֹ
  choice: kasama ang dalawa niyang anak na babae
  rationale: Natural nitong ipinahahayag sa Filipino ang pariralang Hebreo na nagsasabing kasama ni Lot ang kanyang dalawang anak na babae.
- source_word: כִּי יָרֵא
  choice: sapagkat natatakot siya
  rationale: Ipinakikilala ng כִּי ang dahilan ng paglipat, at ang יָרֵא ay isang kalagayang wastong ipinapahayag ng “natatakot.”
- source_word: לָשֶׁבֶת בְּצֹעַר
  choice: manirahan sa Zoar
  rationale: Tumutukoy muli ang ישב sa paninirahan; pinananatili ng salin ang pagkakapareho ng diwa sa naunang paggamit.
- source_word: בַּמְּעָרָה
  choice: sa isang yungib
  rationale: Bagaman may tiyak na pantukoy ang Hebreo, mas natural sa Filipino ang “isang yungib” sa unang pagbanggit sa tirahang ito. Itinatala sa talababa ang mas literal na anyo.
- source_word: הוּא וּשְׁתֵּי בְנֹתָיו
  choice: kasama ang dalawa niyang anak na babae
  rationale: Pinananatili nito ang inuulit na pagtukoy sa mga nakatira sa yungib habang gumagamit ng natural na ayos sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit sa paninirahan ni Lot at sa pagsama ng kanyang dalawang anak na babae, ngunit inayos ang sintaks upang maging natural sa Tagalog. Ginamit ang “kabundukan” para sa topograpikong gamit ng singular na הַר at “yungib” bilang dignified ngunit karaniwang nauunawaang salita.
