- from: Pagkatapos, umahon si Lot mula sa Zoar at nanirahan sa kabundukan kasama ang dalawa niyang anak na babae, sapagkat natatakot siyang manirahan sa Zoar. Nanirahan siya sa isang yungib[a], kasama ang dalawa niyang anak na babae.
  to: Pagkatapos, umahon si Lot mula sa Zoar at nanirahan sa kabundukan, at kasama niya ang dalawa niyang anak na babae, sapagkat natatakot siyang manirahan sa Zoar. Kaya nanirahan siya sa isang yungib[a], siya at ang dalawa niyang anak na babae.
  rationale: Ginawang tahasan ang dalawang magkahiwalay na pagbanggit sa pagsama ng mga anak na babae upang masundan ang koordinasyon at pag-uulit ng Hebreo. Pinalitan ang ikalawang pang-ugnay ng ‘Kaya’ upang likas na maipahayag ang resulta o pagpapatuloy ng salaysay, nang hindi nagdaragdag ng kahulugan. Pinanatili ang talababa dahil ang Hebreong בַּמְּעָרָה ay may tiyak na pantukoy, samantalang ang ‘isang yungib’ ay idiomatiko sa Filipino sa unang pagbanggit.
