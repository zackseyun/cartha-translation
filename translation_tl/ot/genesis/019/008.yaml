  text: הִנֵּה נָ֨א לִ֜/י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה נָּ֤א אֶתְ/הֶן֙ אֲלֵי/כֶ֔ם וַ/עֲשׂ֣וּ לָ/הֶ֔ן כַּ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם רַ֠ק לָֽ/אֲנָשִׁ֤ים הָ/אֵל֙ אַל תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי עַל כֵּ֥ן בָּ֖אוּ בְּ/צֵ֥ל קֹרָתִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/008.yaml
  text: Look[a], please, I have two daughters who have not known a man. Please let me bring them out to you, and do to them as is good in your eyes. Only to these men do nothing[c][b], for they have come under the shadow of my roof.
translation:
  language: tl
  text: '“Tingnan ninyo, pakiusap: mayroon akong dalawang anak na babae na hindi pa nakasiping sa lalaki.[a] Hayaan ninyong ilabas ko sila sa inyo, pakiusap, at gawin ninyo sa kanila kung ano ang mabuti sa inyong paningin. Ngunit ang mga lalaking ito ay huwag ninyong gawan ng anuman, sapagkat pumarito sila sa lilim ng aking bubong.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas tahasan, “na hindi pa nakipagtalik sa lalaki”; ayon sa tradisyon, “na mga birhen.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa lilim ng aking bubong,” isang idyomang nagpapahayag ng kanlungan at proteksiyong dapat ibigay sa mga panauhing tinanggap sa tahanan.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Narito, pakiusap
  rationale: Pinananatili ng “Narito” ang panawag-pansin ng הִנֵּה, at ipinahahayag ng “pakiusap” ang mapamanhik na puwersa ng נָא.
- source_word: שְׁתֵּי בָנוֹת
  choice: dalawang anak na babae
  rationale: Tuwirang katumbas na malinaw at likas sa modernong Filipino.
- source_word: אֲשֶׁר לֹא יָדְעוּ אִישׁ
  choice: na hindi pa nakakakilala ng lalaki
  rationale: Pinananatili ang Hebreong idyoma ng “pagkilala” para sa pakikipagtalik, habang ipinahihiwatig ng “pa” ang kalagayang hanggang sa sandaling iyon.
- source_word: אוֹצִיאָה נָּא אֶתְהֶן אֲלֵיכֶם
  choice: Ilalabas ko sila sa inyo, pakiusap
  rationale: Ang unang panauhang anyong cohortative ay maaaring magpahayag ng alok o pasiyang gawin ang kilos; natural na naihahatid ito ng hinaharap na “Ilalabas ko,” habang pinananatili ang ikalawang נָא bilang “pakiusap.”
- source_word: וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם
  choice: at gawin ninyo sa kanila kung ano ang mabuti sa inyong paningin
  rationale: Pinananatili ang nakakagimbal na tuwirang puwersa at ang imaheng Hebreo na “mabuti sa inyong paningin,” sa halip na palambutin bilang simpleng pagtrato ayon sa gusto.
- source_word: רַק לָאֲנָשִׁים הָאֵל אַל תַּעֲשׂוּ דָבָר
  choice: Huwag lamang ninyong gawin ang anumang bagay sa mga lalaking ito
  rationale: Ang “lamang” ay naghahatid ng mahigpit na pagtatangi ng רַק; ang ayos ng pangungusap ay natural sa Filipino at malinaw na lubos ang pagbabawal.
- source_word: כִּי עַל כֵּן בָּאוּ
  choice: sapagkat pumarito sila
  rationale: Inihahatid ang sanhi nang hindi pinipilit ang mas literal ngunit alanganing “dahil dito ay dumating sila”; ang kasunod na parirala ang nagpapaliwanag sa pananagutan ng punong-abala.
- source_word: בְּצֵל קֹרָתִי
  choice: sa lilim ng aking bubong
  rationale: Pinananatili ang literal na larawan ng lilim at bubong, na sa konteksto ay nagpapahiwatig ng kanlungan at proteksiyong inilalaan sa mga panauhin.
theological_decisions:
- issue: Kung palalambutin ang nakagigimbal na alok ni Lot
  choice: Panatilihin ang tahasang puwersa ng Hebreo nang hindi ito pinahuhusay o binibigyang-katwirang moral
  alternative: Gumamit ng mas malambot na pananalitang gaya ng “gawin ninyo sa kanila ang gusto ninyo” o “pakitunguhan ninyo sila ayon sa inyong kagustuhan”
  rationale: Hindi ipinahahayag ng talata na tama ang alok, ngunit inilalahad ito nang tahasan. Hindi dapat magpasok ang salin ng pagsang-ayon o magkubli sa tindi ng pangyayari.
- issue: Kahulugan ng pagdating “sa lilim ng aking bubong”
  choice: Panatilihin ang metapora sa pangunahing teksto at ipaliwanag ang kaugalian sa talababa
  alternative: Isalin nang tuwiran bilang “sa ilalim ng aking proteksiyon”
  rationale: Ang metapora ay bahagi ng anyo at diin ng pinagmulang teksto; ang implikasyon ng tungkulin sa mga panauhin ay mahalaga ngunit hindi kailangang ipalit sa mismong larawan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Sadyang pinanatili ang Hebreong mga larawang “mabuti sa inyong paningin” at “lilim ng aking bubong.” Hindi pinalambot ang marahas at nakagigimbal na nilalaman, at walang idinagdag na moral na pagsang-ayon.
