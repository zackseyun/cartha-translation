  to: '“Tingnan ninyo, pakiusap: mayroon akong dalawang anak na babae na hindi pa nakasiping sa lalaki.[a] Hayaan ninyong ilabas ko sila sa inyo, pakiusap, at gawin ninyo sa kanila kung ano ang mabuti sa inyong paningin. Ngunit ang mga lalaking ito ay huwag ninyong gawan ng anuman, sapagkat pumarito sila sa lilim ng aking bubong.”[b]'
