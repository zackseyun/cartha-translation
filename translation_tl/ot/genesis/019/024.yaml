  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יהוָ֗ה הִמְטִ֧יר עַל סְדֹ֛ם וְ/עַל עֲמֹרָ֖ה גָּפְרִ֣ית וָ/אֵ֑שׁ מֵ/אֵ֥ת יְהוָ֖ה מִן הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/024.yaml
  text: Then Yahweh rained sulfur and fire on Sodom and Gomorrah from Yahweh out of the heavens[a][b].
translation:
  language: tl
  text: Pagkatapos, nagpaulan si Yahweh ng asupre at apoy sa Sodoma at Gomorra mula kay Yahweh, mula sa kalangitan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong גָּפְרִית ay tumutukoy sa asupre; sa ilang tradisyonal na salin, ginagamit ang mas lumang katawagang “azufre.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo: “mula kay Yahweh, mula sa kalangitan.” Pinanatili ang pag-uulit ng banal na pangalan sa tekstong pinagmulan sa halip na pasimplehin ito.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH bilang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: הִמְטִיר
  choice: nagpaulan
  rationale: Ang anyong Hiphil ay may diwang “nagpasapit bilang ulan” o “nagpaulan”; natural sa Filipino ang “nagpaulan” at napananatili ang larawang nagmumula sa itaas.
- source_word: גָּפְרִית
  choice: asupre
  rationale: Ang “asupre” ang malinaw at karaniwang makabagong katumbas ng sulfur sa Filipino.
- source_word: אֵשׁ
  choice: apoy
  rationale: Tuwirang katumbas ng salitang Hebreo at kaagapay ng “asupre” bilang bagay na ipinaulan.
- source_word: עַל סְדֹם וְעַל עֲמֹרָה
  choice: sa Sodoma at Gomorra
  rationale: Ipinahihiwatig ng “sa” ang pinatutungkulan ng kaparusahan; ang mga pangalan ay nasa kinagawiang anyong Filipino.
- source_word: מֵאֵת יְהוָה
  choice: mula kay Yahweh
  rationale: Pinananatili ang tahasang pinagmulan at ang di-pangkaraniwang pag-uulit ng banal na pangalan.
- source_word: מִן הַשָּׁמָיִם
  choice: mula sa kalangitan
  rationale: Ang “kalangitan” ay likas at marangal na Filipino na sumasalamin sa kolektibo o maramihang anyo ng Hebreong shamayim.
- source_word: וַ
  choice: Pagkatapos
  rationale: Ipinakikita ang pagsulong ng salaysay sa natural na makabagong Filipino.
theological_decisions:
- issue: Pag-uulit ng banal na pangalan sa “si Yahweh … mula kay Yahweh”
  choice: Panatilihin ang pag-uulit sa pangunahing teksto.
  alternative: “Nagpaulan si Yahweh … mula sa kalangitan” o “nagpaulan si Yahweh … mula sa kanyang sarili sa kalangitan.”
  rationale: Tahasan itong inuulit sa tekstong Hebreo. Hindi ito pinasimple o ipinaliwanag upang mapanatili ang tunay na tensiyong pangwika at teolohikal nang hindi nagpapasok ng isang tiyak na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalan na “Yahweh,” ang konkretong larawang “nagpaulan,” at ang sadyang di-pangkaraniwang pag-uulit ng banal na pangalan. Ang “mula kay Yahweh, mula sa kalangitan” ay gumagamit ng kuwit upang malinaw na maipakita ang dalawang magkakaugnay na pariralang nagsasaad ng pinagmulan.
