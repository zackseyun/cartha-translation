  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּ/ה כִּ֣י לֹ֤א אוּכַל֙ לַ/עֲשׂ֣וֹת דָּבָ֔ר עַד בֹּאֲ/ךָ֖ שָׁ֑מָּ/ה עַל כֵּ֛ן קָרָ֥א שֵׁם הָ/עִ֖יר צֽוֹעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/022.yaml
  text: Hurry[a], escape there[b], for I cannot do anything until you arrive there.” Therefore the city was called Zoar.
translation:
  language: tl
  text: “Magmadali ka! Tumakas ka roon, sapagkat wala akong magagawa hanggang sa makarating ka roon.” Kaya tinawag na Zoar[a] ang lunsod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Zoar ay kahawig sa tunog ng salitang Hebreo para sa “maliit” o “walang gaanong halaga”; tingnan ang Genesis 19:20.
    reason: cross_reference
  - marker: b
    text: 'Mas literal: “tinawag niya na Zoar ang pangalan ng lunsod.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: Magmadali ka
  rationale: Pautos na anyo na nagpapahayag ng matinding pagmamadali; natural at tuwiran sa makabagong Tagalog.
- source_word: הִמָּלֵט
  choice: Tumakas ka
  rationale: Pautos na Niphal ng מלט, na nangangahulugang tumakas o iligtas ang sarili. Ang “tumakas” ay maikli at angkop sa agarang pag-iwas sa kapahamakan.
- source_word: שָׁמָּה
  choice: roon
  rationale: Pang-abay na paturol sa isang lugar, na may diwang “patungo roon.” Sa Tagalog, likas ang “roon” kasunod ng “tumakas” at “makarating.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ang dahilan ng utos; malinaw, marangal, at angkop sa salaysay.
- source_word: לֹא אוּכַל
  choice: wala akong magagawa
  rationale: Likas na katumbas sa Tagalog ng tahasang pahayag na “hindi ko kaya” sa kontekstong may kailangang gawin; pinananatili nito ang ipinahayag na kawalan ng kakayahang kumilos.
- source_word: לַעֲשׂוֹת דָּבָר
  choice: magagawa
  rationale: Ang literal na “gumawa ng isang bagay” ay idiomatikong naipapahayag sa negatibong Tagalog bilang “wala akong magagawa,” nang hindi nililimitahan ang saklaw ng דָּבָר.
- source_word: עַד בֹּאֲךָ
  choice: hanggang sa makarating ka
  rationale: Ipinapahayag ang hangganan sa panahon at ang pagdating sa tinutukoy na lugar.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Natural na pormulang naghahayag ng bunga at nagpapakilala sa paliwanag sa pangalan ng lugar.
- source_word: קָרָא שֵׁם הָעִיר
  choice: tinawag na … ang lunsod
  rationale: Natural na balintiyak sa Tagalog para sa literal na Hebreong “tinawag niya ang pangalan ng lunsod,” habang hindi ipinagpapalagay kung sino ang di-tinukoy na gumagawa.
- source_word: צֹעַר
  choice: Zoar
  rationale: Isinalin sa baybay bilang pangalang pantangi ng lugar, hindi isinalin ang kahulugan.
theological_decisions:
- issue: Pahayag ng kawalan ng kakayahan sa konteksto ng paghatol
  choice: wala akong magagawa hanggang sa makarating ka roon
  alternative: hindi ako dapat gumawa ng anuman hanggang sa makarating ka roon
  rationale: Tuwirang nagsasaad ang Hebreo ng kawalan ng kakayahan (לֹא אוּכַל). Pinananatili ng salin ang tensiyong ito at hindi ito ipinapaliwanag bilang simpleng pagbabawal, pahintulot, o limitasyon ng isang anghel.
- issue: Di-tinukoy na simuno ng pagpapangalan
  choice: balintiyak na “tinawag na Zoar ang lunsod”
  alternative: “tinawag niya na Zoar ang pangalan ng lunsod”
  rationale: May pandiwang nasa ikatlong panauhang panlalaki sa Hebreo ngunit walang tahasang pinangalanang simuno. Iniiwasan ng natural na balintiyak sa Tagalog ang pagdaragdag ng pagkakakilanlan ng gumawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sapagkat” at “lunsod” upang mapanatili ang dignidad ng salaysay, habang ang maiikling pautos ay naghahatid ng pagkaapurahan. Inilagay ang mga panandang talababa sa bahaging tunay na tinutukoy ng bawat paliwanag.
