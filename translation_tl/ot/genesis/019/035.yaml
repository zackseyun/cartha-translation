base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/035.yaml
  text: So they also gave their father wine to drink that night[a], and the younger arose and lay with him, and he did not know when she lay down or when she arose.
translation:
  language: tl
  text: Kaya nang gabing iyon, pinainom din nila ng alak ang kanilang ama. Bumangon ang nakababatang anak na babae at sumiping sa kanya, at hindi niya namalayan kung kailan siya nahiga o bumangon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: pinainom nila
  rationale: 'Ang Hifil ng שׁקה ay causative: ‘painumin’ o ‘bigyan ng maiinom.’ Likas sa Tagalog ang ‘pinainom nila ng alak’ at hindi nito idinaragdag ang mas matinding pagpapakahulugang ‘nilasing.’'
- source_word: גַּם בַּלַּיְלָה הַהוּא
  choice: nang gabing iyon ... din
  rationale: Ang גַּם ay nag-uugnay sa ginawa noong naunang gabi; ang ‘din’ ay natural na nagpapahayag ng pagpapatuloy, samantalang ang בַּלַּיְלָה הַהוּא ay malinaw na ‘nang gabing iyon.’
- source_word: אֶת אֲבִיהֶן יָיִן
  choice: ang kanilang ama ... ng alak
  rationale: Ang ama ang taong pinainom at alak ang ipinainom; ang hulma na ‘pinainom ... ng alak’ ang natural na Tagalog para sa konstruksiyong Hebreo.
- source_word: וַתָּקָם הַצְּעִירָה
  choice: Bumangon ang nakababatang anak na babae
  rationale: Ang הַצְּעִירָה ay pambabaeng anyong nangangahulugang ‘ang nakababata.’ Idinagdag ang ‘anak na babae’ upang maging malinaw ang tinutukoy sa natural na Tagalog.
- source_word: וַתִּשְׁכַּב עִמּוֹ
  choice: sumiping sa kanya
  rationale: Ang ‘sumiping sa’ ay isang dignificado at nauunawaang idyomang Tagalog para sa pakikipagtalik, at pinananatili ang di-tahasang anyo ng Hebreo.
- source_word: וְלֹא יָדַע
  choice: ngunit hindi niya namalayan
  rationale: Dito ang ידע ay tumutukoy sa kamalayan, hindi sa kaalamang intelektuwal. Ang ‘hindi niya namalayan’ ay natural na Tagalog at sinusuportahan ng kasunod na mga pariralang temporal.
- source_word: בְּשִׁכְבָהּ וּבְקֻמָהּ
  choice: nang mahiga ito o nang bumangon ito
  rationale: Ang בְּ na kalakip ng mga anyong pandiwa ay temporal dito. Ang magkatimbang na ‘nang ... o nang ...’ ay nagpapanatili sa paralelismo ng Hebreo.
theological_decisions:
- issue: Antas at sanhi ng kawalan ng kamalayan ng ama
  choice: hindi niya namalayan
  alternative: wala siyang kamalay-malay
  rationale: Hindi tahasang sinasabi ng talata kung gaano kalalim o ano mismo ang sanhi ng kanyang kawalan ng kamalayan. Ang napiling salin ay nagpapanatili sa limitadong pahayag ng Hebreo nang hindi nagdaragdag ng paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignificado. Ginamit ang ‘sumiping’ bilang di-tahasang ngunit madaling maunawaang pananalita para sa seksuwal na ugnayan. Walang talababa sapagkat ang temporal na pagbasa sa huling mga parirala ay maipapahayag nang malinaw sa pangunahing teksto.
