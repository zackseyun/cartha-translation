  to: Kaya nang gabing iyon, pinainom din nila ng alak ang kanilang ama. Bumangon ang nakababatang anak na babae at sumiping sa kanya, at hindi niya namalayan kung kailan siya nahiga o bumangon.
  rationale: Pinalitan ang “ito” ng “siya” upang maging natural at dignipikadong Tagalog ang pagtukoy sa anak na babae. Pinalitan ang “ngunit” ng “at” upang hindi magdagdag ng antitesis na wala sa payak na pang-ugnay ng Hebreo. Ang “kung kailan siya nahiga o bumangon” ay malinaw na temporal na pagsasalin ng mga pariralang tumutukoy sa kanyang paghiga at pagbangon.
