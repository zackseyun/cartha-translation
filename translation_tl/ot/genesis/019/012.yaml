revisions:
- from: Pagkatapos, sinabi ng mga lalaki kay Lot, “May iba ka pa bang kasama rito—manugang na lalaki[a], mga anak mong lalaki, mga anak mong babae, o sinumang kabilang sa iyo sa lungsod? Ilabas mo sila sa lugar na ito.”
  to: Pagkatapos, sinabi ng mga lalaki kay Lot, “May iba ka pa bang narito na kaugnay mo—manugang na lalaki, mga anak mong lalaki, mga anak mong babae, at sinumang kabilang sa iyo sa lungsod? Ilabas mo sila sa lugar na ito.”
  rationale: Inayos ang tanong upang maipahayag ang malawak na relasyonal na diwa ng לְךָ, at pinalitan ang “o” ng “at” upang mapanatili ang magkakasamang saklaw ng talaan sa Hebreo. Pinahusay din ang pananalita ng talababa para sa alternatibong leksikal na kahulugan. Napanatili ang modernong Tagalog, ang ordinaryong “mga lalaki,” at ang kontekstuwal na personal na pag-unawa sa “lahat ng sa iyo sa lungsod.”
