base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/012.yaml
  text: Then the men said to Lot[a], “Who else do you have here? A son-in-law, your sons, your daughters[c][b], and everyone who belongs to you in the city—bring them out of the place.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng mga lalaki kay Lot, “May iba ka pa bang narito na kaugnay mo—manugang na lalaki, mga anak mong lalaki, mga anak mong babae, at sinumang kabilang sa iyo sa lungsod? Ilabas mo sila sa lugar na ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: mga lalaki
  rationale: Karaniwang kahulugan ng pangngalan ang “mga lalaki.” Bagaman ipinakikilala sila ng mas malawak na salaysay bilang mga anghel, hindi idinagdag sa talatang ito ang pagkakakilanlang iyon.
- source_word: עֹד מִי לְךָ פֹה
  choice: May iba ka pa bang kasama rito?
  rationale: Likas na tanong ito sa modernong Tagalog tungkol sa iba pang mga taong kaugnay ni Lot na naroon, habang pinananatili ang di-tiyak na saklaw ng ugnayan.
- source_word: חָתָן
  choice: manugang na lalaki
  rationale: Sa konteksto, malamang na tumutukoy ito sa kasalukuyan o nakatakdang mapangasawa ng mga anak na babae ni Lot. Inilalagay sa talababa ang posibleng kahulugang “lalaking ikakasal.”
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: mga anak mong lalaki, mga anak mong babae
  rationale: Malinaw na ipinahahayag ang kasarian ng dalawang pangmaramihang anyo at ang kaugnayan ng mga ito kay Lot.
- source_word: וְכֹל אֲשֶׁר לְךָ בָּעִיר
  choice: sinumang kabilang sa iyo sa lungsod
  rationale: Bagaman literal na malawak ang pariralang “lahat ng sa iyo,” mga taong ilalabas sa lungsod ang tinutukoy ng konteksto. Ang “kabilang sa iyo” ay hindi naglilimita sa kanila sa malapit na kamag-anak lamang.
- source_word: הוֹצֵא מִן הַמָּקוֹם
  choice: Ilabas mo sila sa lugar na ito
  rationale: Isahan ang utos kay Lot. Ipinahihiwatig ng naunang talaan ang layong “sila”; natural sa Tagalog ang “lugar na ito” para sa lugar na kinaroroonan nila.
theological_decisions:
- issue: Kung tatawaging mga anghel ang הָאֲנָשִׁים sa pangunahing teksto
  choice: Panatilihin ang “mga lalaki”
  alternative: mga anghel; mga mensahero
  rationale: Ang mismong talata ay gumagamit ng karaniwang salitang Hebreo para sa “mga lalaki.” Hindi ipinapasok sa salin ng talatang ito ang pagkakakilanlang nalalaman mula sa mas malawak na salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “rito” at “lugar na ito” bilang natural na pagtukoy sa kinaroroonan; iniwasan ang teknikal o makalumang pananalita. Ang gitling-pahaba ay nagbubukas ng talaan ng mga taong maaaring kasama ni Lot.
