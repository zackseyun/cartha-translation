translation:
  language: tl
  text: Kaya kapuwa nabuntis ng kanilang ama ang mga anak na babae ni Lot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa kanilang ama.”
