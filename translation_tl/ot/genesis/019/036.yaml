lexical_decisions:
- source_word: וַתַּהֲרֶיןָ
  choice: nabuntis
  rationale: Ang pandiwang mula sa הרה ay nagsasaad na nagdalang-tao ang dalawang babae. Ang “nabuntis” ay malinaw at likas sa makabagong Filipino.
- source_word: שְׁתֵּי
  choice: kapuwa
  rationale: Ipinakikita ng bilang na parehong anak na babae ang tinutukoy; natural itong naipapahayag ng “kapuwa” sa Filipino.
- source_word: בְנוֹת לוֹט
  choice: ang mga anak na babae ni Lot
  rationale: Tumpak at natural na katumbas ito ng konstruktong nangangahulugang “mga anak na babae ni Lot,” at iniiwasan nitong maging malabo ang kasarian.
- source_word: מֵאֲבִיהֶן
  choice: sa kanilang ama
  rationale: Ang מִן ay tumutukoy rito sa pinagmulan o pagkaama ng ipinagbubuntis. Sa kontekstong ito, malinaw at natural sa Filipino ang “nabuntis … sa kanilang ama,” samantalang ang literal na “mula sa kanilang ama” ay maaaring ilagay sa talababa.
