base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/027.yaml
  text: Abraham rose early in the morning to the place where he had stood before Yahweh[a].
translation:
  language: tl
  text: Kinaumagahan, maagang bumangon si Abraham at pumunta sa lugar kung saan siya tumayo noon sa harap ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa harap ng mukha ni Yahweh,” isang idyomang nangangahulugang “sa harap ni Yahweh” o “sa presensya ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: maagang bumangon
  rationale: Ang Hiphil ng שׁכם ay karaniwang tumutukoy sa maagang pagbangon. Pinananatili ng parirala ang diin sa pagiging maaga nang hindi isinasama sa pandiwa ang pagpunta.
- source_word: בַּבֹּקֶר
  choice: kinaumagahan
  rationale: Ang בֹּקֶר ay nangangahulugang umaga. Sa konteksto ng salaysay, natural na ipinahihiwatig ng “kinaumagahan” ang sumunod na umaga, habang ang “maagang” ay nagpapanatili sa temporal na diin ng magkasamang pandiwa at parirala.
- source_word: אֶל הַמָּקוֹם
  choice: at pumunta sa lugar
  rationale: Ang אֶל ay nagsasaad ng patutunguhan at ang מָקוֹם ay karaniwang “lugar.” Idinagdag ang “pumunta” sa Tagalog upang likas na maipahayag ang kilos patungo sa lugar na nakapaloob sa Hebreong kayarian.
- source_word: אֲשֶׁר עָמַד שָׁם
  choice: na kinatatayuan niya noon
  rationale: Tumutukoy ang sugnay sa dating pagtayo ni Abraham sa lugar na iyon. Ang “noon” ay natural na katumbas ng retrospektibong gamit at ng שָׁם sa konteksto.
- source_word: אֶת־פְּנֵי
  choice: sa harap ni
  rationale: Sa pariralang עמד את־פני, ang literal na “mukha” ay bumubuo ng idyomang nangangahulugang tumayo sa harap o presensya ng isang tao. Natural at maikli sa Tagalog ang “sa harap ni.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng tetragrammaton, ang personal na pangalan ng Diyos; kaya pinanatili itong “Yahweh” sa halip na palitan ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa pagtayo ni Abraham sa harap ni Yahweh
  choice: sa harap ni Yahweh
  alternative: sa presensya ni Yahweh
  rationale: Pinananatili ng “sa harap” ang konkretong idyoma ng Hebreo nang hindi ipinahihiwatig na pagsamba, panalangin, o anumang gawaing hindi tahasang sinabi ng talata.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong pinagmulan, kaya ginamit ang transliterasyong “Yahweh” sa halip na ang pamalit na titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “kinaumagahan, maagang bumangon” upang mapanatili kapwa ang tahasang “umaga” at ang diin ng pandiwa sa maagang pagkilos; ang bahagyang pag-uulit ay likas pa rin sa salaysay.
