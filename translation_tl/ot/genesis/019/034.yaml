base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/034.yaml
  text: And it happened on the next day that the firstborn said to the younger[a], “Look, I lay with my father last night. Let us make him drink wine tonight also. Then come, lie with him, so that we may preserve offspring from our father.”
translation:
  language: tl
  text: Nang sumunod na araw, sinabi ng panganay sa nakababata, “Tingnan mo, sumiping ako sa aking ama kagabi. Painumin din natin siya ng alak ngayong gabi. Pagkatapos, halika at sumiping ka sa kanya, upang maipagpatuloy natin ang lahi sa pamamagitan ng ating ama[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “binhi mula sa ating ama.” Ang “binhi” ay idyoma para sa mga anak o salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Nang sumunod na araw
  rationale: Likas na panimulang pagsasalaysay sa makabagong Tagalog; ipinahihiwatig nito ang pagpapatuloy at pagkakasunod ng pangyayari nang hindi gumagamit ng lipas na pormula.
- source_word: הַבְּכִירָה ... הַצְּעִירָה
  choice: ang panganay ... ang nakababata
  rationale: Pinananatili ang malinaw na pagkakaiba sa ayos ng kapanganakan. Nauunawaan sa konteksto na kapuwa babae ang tinutukoy, kaya hindi na kailangang ulitin ang “anak na babae.”
- source_word: הֵן
  choice: Tingnan mo
  rationale: Natural na panawag-pansin sa Tagalog na tumutugma sa deiktikong lakas ng salitang Hebreo.
- source_word: שָׁכַבְתִּי אֶת־אָבִי
  choice: sumiping ako sa aking ama
  rationale: Ang “sumiping” ay malinaw na eupemismong seksuwal sa kontekstong ito at pinananatili ang mabigat ngunit hindi klinikal na tono ng Hebreo.
- source_word: נַשְׁקֶנּוּ יַיִן גַּם הַלַּיְלָה
  choice: Painumin din natin siya ng alak ngayong gabi
  rationale: Ipinahahayag ng “painumin” ang sanhiang anyo ng pandiwa, samantalang pinananatili ng “din” ang diwa ng pag-uulit na nasa גַּם.
- source_word: וּבֹאִי שִׁכְבִי עִמּוֹ
  choice: Pagkatapos, halika at sumiping ka sa kanya
  rationale: Malinaw at natural na inilalahad ang sunod-sunod na utos habang pinananatili ang seksuwal na eupemismo ng שׁכב.
- source_word: וּנְחַיֶּה מֵאָבִינוּ זָרַע
  choice: upang maipagpatuloy natin ang lahi ng ating ama
  rationale: Ipinahahayag ng “maipagpatuloy” ang diwa ng pagpapanatiling buhay, at ng “lahi” ang reproduktibong kahulugan ng זֶרַע. Ang talababa ay nagpapanatili sa mas literal na anyo at sa posibleng diin sa pinagmulan.
theological_decisions:
- issue: Kung ang מֵאָבִינוּ זָרַע ay tumutukoy sa lahi ng ama o sa mga anak na magmumula sa pakikipagtalik sa ama
  choice: lahi ng ating ama
  alternative: mga anak mula sa ating ama
  rationale: Pinananatili ng pangunahing teksto ang maikli at likas na pahayag sa Tagalog nang hindi ginagawang higit na tahasan kaysa sa Hebreong idyoma; inilalahad ng talababa ang literal na larawan at pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sumiping” upang mapanatili ang eupemistikong tono ng Hebreo, at iniwasan ang kapwa sobrang klinikal at sobrang malabong pananalita.
