  to: Dumating sa Sodoma ang dalawang anghel pagsapit ng gabi, at nakaupo si Lot sa may pintuang-bayan ng Sodoma.[a] Nang makita sila ni Lot, tumindig siya upang salubungin sila at yumukod na nakalapat ang mukha sa lupa.[b]
  rationale: Pinalitan ang “nang gabing iyon” ng “pagsapit ng gabi” upang maiwasan ang di-kinakailangang dagdag na pagtukoy at mapanatili ang payak na temporal na parirala ng Hebreo. Pinahusay din ang paglalarawan ng pagpapatirapa para sa mas malinaw at natural na Filipino, nang hindi ipinapakahulugang pagsamba ang kilos.
