base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/001.yaml
  text: The two angels came to Sodom in the evening[a], and Lot was sitting in the gate of Sodom. When Lot saw them[c][b], he rose to meet them and bowed with his face to the ground.
translation:
  language: tl
  text: Dumating sa Sodoma ang dalawang anghel pagsapit ng gabi, at nakaupo si Lot sa may pintuang-bayan ng Sodoma.[a] Nang makita sila ni Lot, tumindig siya upang salubungin sila at yumukod na nakalapat ang mukha sa lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pintuang-bayan” ay ang lugar sa may tarangkahan ng lungsod, na karaniwang sentro ng pampublikong gawain.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin, “nagpatirapa siya nang nakalapat ang mukha sa lupa.” Inilalarawan ng Hebreo ang lubos na pagyukod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dumating
  rationale: Ang pandiwa ay nagsasaad ng pagdating sa isang lugar; natural at malinaw sa salaysay ang “dumating.”
- source_word: שְׁנֵי הַמַּלְאָכִים
  choice: ang dalawang anghel
  rationale: Bagaman maaaring mangahulugang “mga sugo” ang מַלְאָכִים, tinutukoy rito ang makalangit na mga panauhin mula sa naunang salaysay.
- source_word: סְדֹמָה
  choice: sa Sodoma
  rationale: Ipinahihiwatig ng directional he ang pagpunta sa Sodoma; likas sa Filipino ang “sa Sodoma” kasunod ng “dumating.”
- source_word: בָּעֶרֶב
  choice: nang gabing iyon
  rationale: Tumutukoy ito sa oras ng pagdating. Ang “nang gabing iyon” ay natural sa makabagong salaysay at inuugnay ang tagpo sa araw ng naunang pangyayari.
- source_word: יֹשֵׁב
  choice: nakaupo
  rationale: Ang participle ay nagbibigay ng nagpapatuloy na kalagayan bilang background ng salaysay.
- source_word: בְּשַׁעַר סְדֹם
  choice: sa may pintuang-bayan ng Sodoma
  rationale: Ang שַׁעַר ay tumutukoy sa lugar o kompleks ng tarangkahan ng lungsod, hindi lamang sa isang pinto. Nililinaw ito ng “pintuang-bayan.”
- source_word: וַיַּרְא לוֹט
  choice: Nang makita sila ni Lot
  rationale: Walang tahasang layon sa Hebreo ngunit malinaw sa konteksto na ang dalawang anghel ang nakita; kailangan ang “sila” sa natural na Filipino.
- source_word: וַיָּקָם לִקְרָאתָם
  choice: tumindig siya upang salubungin sila
  rationale: Pinananatili nito kapwa ang pagtayo ni Lot at ang layunin niyang harapin o salubungin ang mga panauhin.
- source_word: וַיִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: yumukod nang sayad ang mukha sa lupa
  rationale: Inilalarawan ng buong idyoma ang napakalalim na pagyukod o pagpapatirapa. Malinaw at dignificado ang parirala nang hindi awtomatikong ipinapalagay na pagsamba ito.
theological_decisions:
- issue: Kung ang וַיִּשְׁתַּחוּ ay dapat ipakahulugang pagsamba o magalang na pagpapatirapa
  choice: malalim na pagyukod bilang paggalang
  alternative: sumamba; nagpatirapa
  rationale: Maaaring tumukoy ang pandiwa sa pagsamba o sa pagyukod sa harap ng isang iginagalang. Hindi tahasang nilulutas ng talata ang kilos bilang pagsamba, kaya pinili ang saling naglalarawan sa pisikal na kilos nang hindi nagdaragdag ng teolohikal na pagpapakahulugan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “pintuang-bayan” upang maipakita ang sinaunang city-gate area, at ang “yumukod nang sayad ang mukha sa lupa” upang mailarawan ang kilos nang hindi ito agad tawaging pagsamba.
