- source_word: תָּרֵעוּ
  choice: gumawa ng masama
  rationale: Ang Hiphil ng רעע dito ay tumutukoy sa paggawa o pagkilos nang masama; tuwiran at likas sa Tagalog ang ‘gumawa ng masama.’
