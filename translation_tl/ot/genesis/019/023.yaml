  text: The sun had risen over the land[b][a], and Lot had come to Zoar.
translation:
  language: tl
  text: Sumikat na ang araw sa lupain[a] nang makarating si Lot sa Zoar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “daigdig” ang salin sa salitang Hebreo para sa “lupain.”
    reason: lexical_alternative
  - marker: b
    text: O “Sumikat ang araw sa lupain, at dumating si Lot sa Zoar.” Ang mga pandiwang Hebreo ay maaari ring isalin bilang payak na naganap na kilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: ang araw
  rationale: Tiyak na pangngalan na may artikulo; natural at karaniwang katumbas sa Tagalog.
- source_word: יָצָא
  choice: sumikat na
  rationale: Bagaman literal na 'lumabas,' kapag araw ang simuno, ang natural na kahulugan ay pagsikat ng araw. Ipinahihiwatig ng 'na' na tapos na ang pangyayari sa puntong inilalarawan.
- source_word: עַל הָאָרֶץ
  choice: sa lupain
  rationale: Maaaring tumukoy ang אֶרֶץ sa 'lupain' o 'daigdig.' Mas angkop sa lokal na tagpo ang 'lupain'; sapat na naipahihiwatig sa Tagalog ng 'sa' ang pagsikat sa ibabaw nito.
- source_word: וְלוֹט
  choice: nang ... si Lot
  rationale: Ang waw ay ipinahayag bilang ugnayang pangpanahon sa natural na Tagalog; nananatili ang pagkakaugnay ng dalawang sugnay nang hindi dinaragdagan ang nilalaman.
- source_word: בָּא
  choice: makarating
  rationale: Ang בוא ay 'dumating/pumasok.' Sa konteksto ng paglalakbay patungo sa Zoar, natural ang 'makarating,' at ang hulmaing 'nang makarating' ay nagpapahayag ng kaugnayang temporal ng dalawang ganap na kilos.
- source_word: צֹעֲרָה
  choice: sa Zoar
  rationale: Ang directional he ay nagsasaad ng paggalaw patungo sa lugar; natural itong isinasalin sa Tagalog bilang 'sa Zoar.'
