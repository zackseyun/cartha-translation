base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/002.yaml
  text: And he said[a], “Please, my lords, turn aside to your servant’s house, and spend the night, and wash your feet. Then you may rise early and go on your way.” But they said, “No[d][c][b], but we will spend the night in the square.”
translation:
  language: tl
  text: At sinabi niya, “Pakiusap, mga panginoon ko, tumuloy kayo sa bahay ng inyong lingkod. Magpalipas kayo roon ng gabi at hugasan ninyo ang inyong mga paa. Pagkatapos, maaari kayong bumangon nang maaga at magpatuloy sa inyong lakad.” Ngunit sinabi nila, “Hindi; sa liwasan kami magpapalipas ng gabi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֶּה נָּא
  choice: Nakikiusap ako
  rationale: Sa konteksto, ang tambalan ay magalang at apurahang pambungad, hindi literal na utos na tumingin. Likas sa Tagalog ang “Nakikiusap ako” bilang pakiusap ng isang punong-abala.
- source_word: אֲדֹנַי
  choice: mga panginoon ko
  rationale: Dalawang panauhin ang kinakausap, gaya ng ipinakikita ng maramihang pandiwa at panghalip. Pinananatili nito ang magalang na katawagan nang hindi ito ginagawang banal na titulong “Panginoon.”
- source_word: סוּרוּ נָא אֶל בֵּית עַבְדְּכֶם
  choice: tumuloy kayo sa bahay ng inyong lingkod
  rationale: Ang סור ay paglihis o pagpasok mula sa daan; sa paanyayang tumanggap ng bisita, likas na katumbas sa Tagalog ang “tumuloy.” Napananatili ng “inyong lingkod” ang mapagpakumbabang pagtukoy ni Lot sa sarili.
- source_word: וְלִינוּ
  choice: magpalipas kayo ng gabi roon
  rationale: Malinaw at kasalukuyang pananalita ito para sa pananatili nang magdamag; idinagdag ang “roon” upang natural na iugnay sa bahay na kababanggit.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: maghugas ng inyong mga paa
  rationale: Tuwirang pinananatili ang sinaunang kaugalian ng pagpapatuloy sa bisita.
- source_word: וְהִשְׁכַּמְתֶּם
  choice: maaari kayong bumangon nang maaga
  rationale: Ipinahahayag ang maagang pagbangon sa loob ng magalang na mungkahi, nang hindi pinalalakas bilang mahigpit na utos.
- source_word: וַהֲלַכְתֶּם לְדַרְכְּכֶם
  choice: magpatuloy sa inyong lakad
  rationale: Natural na katumbas ng pagpapatuloy sa sariling ruta o paglalakbay.
- source_word: בָרְחוֹב
  choice: sa liwasan
  rationale: Ang רְחוֹב ay bukas na pampublikong lugar sa lungsod, hindi lamang isang kalsada. Ang “liwasan” ang malinaw at maikling katumbas.
- source_word: נָלִין
  choice: kami magpapalipas ng gabi
  rationale: Ginamit ang kaparehong parirala gaya ng naunang לין upang mapanatili ang leksikal na pag-uugnay sa talata.
theological_decisions:
- issue: Kung ang אֲדֹנַי ay banal na titulo o katawagang pantao
  choice: 'Katawagang pantao na maramihan: “mga panginoon ko”'
  alternative: “panginoon ko,” bilang isahang katawagang pandangal o pakikipag-usap sa isang banal na persona
  rationale: Dalawang bisita ang tuwirang kinakausap ni Lot, at maramihan ang mga pandiwa at panghalip sa talata. Kaya ang maramihang katawagang pantao ang pinakamalinaw sa agarang konteksto, nang hindi nag-aangkat ng teolohikal na pagkakakilanlan na hindi tahasang sinasabi rito.
- issue: Lakas ng כִּי pagkatapos ng pagtangging לֹא
  choice: 'Natural na pagtanggi sa Tagalog: “Hindi, sa liwasan kami magpapalipas ng gabi”'
  alternative: “Hindi, kundi sa liwasan kami magpapalipas ng gabi”
  rationale: Dito, pinatitibay o ipinapaliwanag ng כִּי ang pagtanggi. Sa Tagalog, sapat at mas natural ang tuwirang kasunod na pahayag; ang “kundi” ay maaari ngunit bahagyang nagpapatingkad sa pagsalungat.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “tumuloy” sa halip na literal na “lumihis” dahil ito ang likas na salita sa paanyaya sa isang tahanan. Pinanatili ang mapagpakumbabang pormulang “inyong lingkod” at ang pampublikong espasyong “liwasan.”
