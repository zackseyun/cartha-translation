    issue: Ang “Nakikiusap ako” ay mas tahasang unang-panauhang pahayag kaysa sa pang-abay na pakiusap sa Hebreo.
    rationale: Ang הִנֵּה נָא ay isang magalang na pambungad/pakiusap, hindi kinakailangang isang ekspresyong “ako ay nakikiusap.” Ang “Pakiusap” ay nagpapanatili ng tungkulin nito nang mas hindi nagdaragdag ng persona.
  - severity: low
    issue: Hindi ganap na likas ang “maghugas ng inyong mga paa.”
    rationale: 'Sa Tagalog, mas malinaw at natural ang pandiwang may tahasang pokus sa layon: “hugasan ninyo ang inyong mga paa.” Pareho nitong pinananatili ang literal na gawaing pangmagiliw na pagtanggap sa panauhin.'
