revisions:
- from: At sinabi niya, “Nakikiusap ako, mga panginoon ko, tumuloy kayo sa bahay ng inyong lingkod. Magpalipas kayo ng gabi roon at maghugas ng inyong mga paa. Pagkatapos, maaari kayong bumangon nang maaga at magpatuloy sa inyong lakad.” Ngunit sinabi nila, “Hindi, sa liwasan kami magpapalipas ng gabi.”
  to: At sinabi niya, “Pakiusap, mga panginoon ko, tumuloy kayo sa bahay ng inyong lingkod. Magpalipas kayo roon ng gabi at hugasan ninyo ang inyong mga paa. Pagkatapos, maaari kayong bumangon nang maaga at magpatuloy sa inyong lakad.” Ngunit sinabi nila, “Hindi; sa liwasan kami magpapalipas ng gabi.”
