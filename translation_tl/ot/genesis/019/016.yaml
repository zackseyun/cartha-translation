base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/016.yaml
  text: But he lingered[a], so the men seized his hand, his wife’s hand, and the hands of his two daughters, because of Yahweh’s compassion for him[b]; and they brought him out and set him outside the city.
translation:
  language: tl
  text: Ngunit nagtagal siya, kaya mahigpit na hinawakan ng mga lalaki ang kanyang kamay, ang kamay ng kanyang asawa, at ang mga kamay ng dalawa niyang anak na babae, dahil sa habag ni Yahweh sa kanya. Inilabas nila siya at inilagay sa labas ng lungsod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְמַהְמָהּ
  choice: nag-atubili siya
  rationale: Ipinahihiwatig ng pandiwa ang pagkaantala o pag-aatubili sa gitna ng agarang panganib; natural sa Filipino ang “nag-atubili” at hindi nito nililimitahan ang dahilan sa simpleng pag-aalinlangan.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaki
  rationale: Karaniwang salitang “mga lalaki” ang tahasang ginamit sa Hebreo. Bagaman makikilalang mga anghel ang mga ito mula sa konteksto, hindi iyon ipinalit sa katawagan ng talata.
- source_word: וַיַּחֲזִקוּ
  choice: mahigpit na hinawakan
  rationale: Sa konstruksiyong ito, ipinapahayag ng חזק ang matatag at mapilit na paghawak. Naipakikita ng “mahigpit na hinawakan” ang puwersa at pagmamadali nang natural sa Filipino.
- source_word: בְּיָדוֹ ... וּבְיַד אִשְׁתּוֹ ... וּבְיַד שְׁתֵּי בְנֹתָיו
  choice: ang kamay niya, ang kamay ng asawa niya, at ang mga kamay ng dalawa niyang anak na babae
  rationale: Pinananatili ang pag-uulit ng “kamay” sa Hebreo, samantalang ginagamit ang maramihang “mga kamay” sa huling parirala upang ipahiwatig na kapuwa anak ay hinawakan.
- source_word: בְּחֶמְלַת יְהוָה עָלָיו
  choice: sapagkat nahabag sa kanya si Yahweh
  rationale: Ang חמלה ay habag o malasakit. Ginagawang malinaw ng sugnay na ito ang sanhi ng pagliligtas habang pinananatiling tahasan ang banal na kumikilos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang pantanging banal na pangalan sa anyong “Yahweh,” alinsunod sa patakaran ng proyekto at hindi bilang titulong “PANGINOON.”
- source_word: וַיֹּצִאֻהוּ
  choice: inilabas nila siya
  rationale: Ang hiphil ng יצא ay nagsasaad ng pagpapalabas o pagdadala palabas; tuwiran at natural dito ang “inilabas nila siya.”
- source_word: וַיַּנִּחֻהוּ מִחוּץ לָעִיר
  choice: dinala sa labas ng lungsod
  rationale: Sa kontekstong ito, ang hiphil ng נוח ay ang paglalagay o pagpapahimpil sa isang lugar. Ang “dinala sa labas” ay natural na Filipino at hindi nagpapahiwatig na pinabayaan siya.
theological_decisions:
- issue: Pagkakakilanlan ng mga tagapagligtas sa salaysay
  choice: ang mga lalaki
  alternative: ang mga anghel
  rationale: Tinatawag sila ng talatang Hebreo na “mga lalaki.” Bagaman ipinakikilala sila ng mas malawak na konteksto bilang mga anghel, pinananatili ng pangunahing teksto ang katawagan at tensiyon ng pinagmulan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pag-uulit ng “kamay” dahil mahalaga ito sa pisikal at agarang pagliligtas, ngunit inayos ang pangungusap upang maging natural sa Tagalog.
