revisions:
- from: Ngunit nag-atubili siya, kaya mahigpit na hinawakan ng mga lalaki ang kamay niya, ang kamay ng asawa niya, at ang mga kamay ng dalawa niyang anak na babae, sapagkat nahabag sa kanya si Yahweh. Pagkatapos, inilabas nila siya at dinala sa labas ng lungsod.
  to: Ngunit nagtagal siya, kaya mahigpit na hinawakan ng mga lalaki ang kanyang kamay, ang kamay ng kanyang asawa, at ang mga kamay ng dalawa niyang anak na babae, dahil sa habag ni Yahweh sa kanya. Inilabas nila siya at inilagay sa labas ng lungsod.
  rationale: Pinapalitan ang ‘nag-atubili’ ng ‘nagtagal’ upang mapanatili ang kahulugang pagkaantala ng Hebreo nang hindi ipinipilit ang motibong pag-aalinlangan. Pinapalitan ang huling ‘dinala’ ng ‘inilagay’ upang maisalin ang pandiwang nagsasaad ng paglalagay sa labas ng lungsod. Walang kinakailangang talababa, sapagkat malinaw na pinananatili ng pangunahing teksto ang ‘mga lalaki’ at walang isyung tekstuwal na kailangang lagyan ng angkla.
