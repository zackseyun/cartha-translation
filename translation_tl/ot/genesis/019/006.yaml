  text: Lot went out to them at the entrance and shut the door behind him[a].
translation:
  language: tl
  text: Lumabas si Lot sa bungad patungo sa kanila, at isinara niya ang pinto sa likuran niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “papunta sa bukana.” Magkaiba sa Hebreo ang bungad o bukana (פֶּתַח) at ang mismong pinto (דֶּלֶת).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Lumabas
  rationale: Ang wayyiqtol ng יצא ay nagsusulong sa salaysay bilang payak na naganap na kilos; natural na ipinahahayag ng “lumabas” ang pagpunta mula sa loob patungo sa labas.
- source_word: אֲלֵהֶם
  choice: papunta sa kanila
  rationale: Ang אֶל na may hulaping panghalip ay nagpapahiwatig ng pagkilos patungo sa mga lalaking nasa labas.
- source_word: לוֹט
  choice: si Lot
  rationale: Ginamit ang karaniwang anyo ng pangalang pantangi sa Tagalog, na may panandang “si.”
- source_word: הַפֶּתְחָה
  choice: sa may pasukan
  rationale: Ang פֶּתַח ay tumutukoy sa bukana o pasukan, at ang directional he ay nagpapahiwatig ng paglapit doon. Pinananatili ng “pasukan” ang pagkakaiba nito sa mismong pinto na binanggit sa kasunod na sugnay.
- source_word: וְהַדֶּלֶת
  choice: ang pinto
  rationale: Ang דֶּלֶת ay tumutukoy sa mismong pinto, na naiiba sa פֶּתַח, ang bukana o pasukan.
- source_word: סָגַר
  choice: isinara
  rationale: Ang “isinara” ay natural at malinaw na katumbas sa makabagong Tagalog para sa pagsasara ng pinto.
- source_word: אַחֲרָיו
  choice: sa likuran niya
  rationale: 'Spatial ang gamit ng אַחַר dito: matapos lumabas ni Lot, isinara niya ang pinto sa likuran niya.'
