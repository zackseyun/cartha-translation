  verdict: revise
  source_fidelity: Ang salin ay wastong naghahatid ng utos na mapanaboy, ang paghamak kay Lot bilang dayuhang naninirahan, ang banta ng mas malubhang gagawin sa kaniya kaysa sa mga panauhin, at ang pagsulong ng karamihan upang sirain ang pinto. Gayunman, ang “nagmamarunong humatol” ay bahagyang nagdaragdag ng kahulugang pag-aangking mas marunong; mas tuwirang naipapahayag ng “nag-aastang hukom” ang mapanuyang paratang ng Hebreo. Ang “itinulak ang lalaking si Lot” ay maaari ring tunog na isang tuwirang pagtulak sa kaniya, samantalang ang pandiwang Hebreo ay tumutukoy sa mariing pagsisiksik o pagdiin laban sa kaniya.
  naturalness: Moderno at malinaw ang pangkalahatang rehistro. Ang binagong mga parirala ay mas natural na Tagalog sa loob ng marahas na diyalogo at mas malinaw na itinatali ang pisikal na pagkilos ng pangkat kay Lot.
  terminology: Walang problemang pangalang pantangi o terminong teolohikal. Pinananatili ang “dayuhan” para sa katayuang hindi katutubo/tagalabas at ang “hukom” para sa שׁפט, nang hindi ipinipilit na si Lot ay may pormal na katungkulang panghukom.
  issues:
