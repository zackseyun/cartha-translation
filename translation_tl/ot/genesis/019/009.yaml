  to: Sinabi nila, “Umatras ka!” Pagkatapos ay sinabi nila, “Ang isang ito ay naparito upang manirahan bilang dayuhan, at ngayo'y nag-aastang hukom pa siya! Ngayon, mas masama ang gagawin namin sa iyo kaysa sa kanila.” Pagkatapos ay mariin silang sumiksik laban sa lalaking si Lot at lumapit upang gibain ang pinto.
