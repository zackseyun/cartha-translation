base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/009.yaml
  text: And they said[a], “Get back!” Then they said, “This one came to live as a foreigner, and now he keeps acting as judge! Now we will treat you worse than them.” And they pressed very hard against the man, against Lot[d][c][b], and came near to break down the door.
translation:
  language: tl
  text: Sinabi nila, “Umatras ka!” Pagkatapos ay sinabi nila, “Ang isang ito ay naparito upang manirahan bilang dayuhan, at ngayo'y nag-aastang hukom pa siya! Ngayon, mas masama ang gagawin namin sa iyo kaysa sa kanila.” Pagkatapos ay mariin silang sumiksik laban sa lalaking si Lot at lumapit upang gibain ang pinto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֶּשׁ הָלְאָה
  choice: Umatras ka!
  rationale: Likas at mariing utos sa modernong Tagalog; ipinapahayag ang pagtaboy kay Lot nang hindi nililimitahan sa pananatili lamang sa isang puwesto.
- source_word: הָאֶחָד
  choice: ang isang ito
  rationale: Pinananatili ang mapanghamak at mapaglayong pagtukoy ng Hebreo nang hindi nagdaragdag ng masyadong kolokyal na bansag.
- source_word: בָּא לָגוּר
  choice: dumating dito ... para manirahan bilang dayuhan
  rationale: Malinaw na ipinapahayag ang גור bilang paninirahan ng isang hindi katutubo o tagalabas, gamit ang kasalukuyang wikang madaling maunawaan.
- source_word: וַיִּשְׁפֹּט שָׁפוֹט
  choice: lagi pa siyang nagmamarunong humatol
  rationale: Ang konstruksyong may infinitive absolute ay mariin. Ipinahihiwatig ng konteksto ang mapanuyang paratang na inaangkin ni Lot ang karapatang humatol; ang “nagmamarunong” ay naghahatid ng tinig ng mga nagsasalita, hindi ng hatol ng tagapagsalaysay.
- source_word: נָרַע לְךָ מֵהֶם
  choice: mas masama ang gagawin namin sa iyo kaysa sa kanila
  rationale: Malapit sa literal na banta na “gagawa kami ng masama” at pinananatili ang paghahambing kay Lot at sa mga panauhin.
- source_word: וַיִּפְצְרוּ ... מְאֹד
  choice: buong lakas nilang itinulak
  rationale: Sa pisikal na konteksto bago ang pagtatangkang gibain ang pinto, natural na ipinapahayag nito ang napakatinding pagdiin o pagtulak; iniiwasan ang alanganing literal na “diniinan nang labis.”
- source_word: בָאִישׁ בְּלוֹט
  choice: ang lalaking si Lot
  rationale: Natural na Tagalog na apposisyon para sa “ang lalaki—si Lot.” Hindi kailangang ulitin ang pang-ukol dahil magiging mabigat at di-likas iyon sa Tagalog.
- source_word: וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת
  choice: lumapit sila upang gibain ang pinto
  rationale: Pinananatili ang pagkilos palapit na may layuning sirain ang pinto; ang “gibain” ay angkop sa sapilitang pagbuwag sa nakasarang pinto.
theological_decisions:
- issue: Ang mariing anyo ng שׁפט at kung paratang ba ito ng paulit-ulit na paghatol o pag-aangking maging hukom
  choice: lagi pa siyang nagmamarunong humatol
  alternative: at ngayo'y talagang humahatol siya
  rationale: Pinananatili ang pagdidiin at mapanuyang tono ng mga taga-Sodoma, ngunit hindi ginagawang obhetibong pahayag ng tagapagsalaysay na si Lot ay itinalagang hukom.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ang usapan ay sadyang marahas at mapanghamak; ang salaysay ay malinaw at hindi arkaiko. Walang talababa dahil naihahatid sa teksto ang mahahalagang leksikal na diwa nang hindi kinakailangang lutasin ang anumang makabuluhang teolohikal na kalabuan.
