    issue: “lagi pa siyang nagmamarunong humatol”
    rationale: Ang “nagmamarunong” ay maaaring magpahiwatig na nagpapanggap siyang may kaalaman o dunong. Ang Hebreo ay mariing mapanuyang reklamo na siya ay humahatol o nag-aastang hukom; hindi nito tuwirang tinutukoy ang pagmamamarunong.
  - severity: low
    issue: “buong lakas nilang itinulak ang lalaking si Lot”
    rationale: Naiintindihan ang marahas na konteksto, ngunit mas tumpak at mas malinaw ang pananalitang nagsasaad na mariin silang sumiksik o dumiin laban kay Lot, gaya ng ipinahihiwatig ng פצר sa kontekstong ito.
