id: GEN.4.4
reference: Genesis 4:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הֶ֨בֶל הֵבִ֥יא גַם ה֛וּא מִ/בְּכֹר֥וֹת צֹאנ֖/וֹ וּ/מֵֽ/חֶלְבֵ/הֶ֑ן וַ/יִּ֣שַׁע יְהוָ֔ה אֶל הֶ֖בֶל וְ/אֶל מִנְחָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/004.yaml
  text: And Abel also brought some of the firstborn of his flock[a], and of their fat portions. And Yahweh regarded Abel and his offering[b],
translation:
  language: tl
  text: At nagdala rin si Abel ng ilan sa mga panganay ng kanyang kawan at ng matatabang bahagi ng mga iyon.[a] Tiningnan ni Yahweh nang may paglingap si Abel at ang handog niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa matatabang bahagi ng mga iyon”; malamang na tumutukoy ito sa piling matatabang bahagi ng mga hayop na inihandog.
    reason: cultural_note
  - marker: b
    text: O, “Pinansin ni Yahweh nang may pagsang-ayon si Abel at ang handog niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶבֶל
  choice: At ... si Abel
  rationale: Pinananatili ng “At” ang karaniwang pagkakasunod-sunod ng salaysay na ipinahihiwatig ng וְ, nang hindi dinaragdagan ang diwang wala sa Hebreo.
- source_word: הֵבִיא גַם הוּא
  choice: nagdala rin
  rationale: Ang “nagdala” ang tuwirang kahulugan ng Hiphil ng בוא sa konteksto ng handog, at ipinahahayag ng “rin” na si Abel, gaya ni Cain, ay nagdala ng handog.
- source_word: מִבְּכֹרוֹת צֹאנוֹ
  choice: ng ilan sa mga panganay ng kanyang kawan
  rationale: 'Partitibo ang מִן: nagdala si Abel mula sa hanay ng mga panganay, hindi kinakailangang lahat ng panganay ng kanyang kawan.'
- source_word: וּמֵחֶלְבֵהֶן
  choice: at ng matatabang bahagi ng mga iyon
  rationale: Ang חֵלֶב ay tumutukoy sa taba o matatabang bahaging inihahandog. Pinananatili ng salin ang kongkretong kahulugan sa halip na ipakahulugang “pinakamainam na bahagi” lamang.
- source_word: וַיִּשַׁע
  choice: Tiningnan ... nang may paglingap
  rationale: Ipinahahayag nito ang pagtinging may pagsang-ayon o pabor, ngunit hindi nito ipinapaliwanag kung paano ipinakita ni Yahweh ang pagtanggap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa anyong transliterasyon ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: אֶל הֶבֶל וְאֶל מִנְחָתוֹ
  choice: si Abel at ang handog niya
  rationale: Kapwa si Abel at ang kanyang handog ang layon ng paglingap ni Yahweh; natural itong ipinapahayag sa balarilang Filipino nang walang pag-uulit ng pang-ukol.
- source_word: מִנְחָתוֹ
  choice: ang handog niya
  rationale: Ang מִנְחָה ay regalo o handog na iniaalay; “handog” ang malinaw at likas na salita sa kontekstong ito.
theological_decisions:
- issue: Uri ng tugon ng Diyos sa וַיִּשַׁע
  choice: “Tiningnan ni Yahweh nang may paglingap”
  alternative: “Kinalugdan ni Yahweh” o “Tinanggap ni Yahweh”
  rationale: Ipinahihiwatig ng pandiwa ang positibo at mapagpalang pagtingin, ngunit hindi tahasang sinasabi ng talata ang paraan ng pagtanggap. Iniiwasan ng salin ang higit na tiyak na “tinanggap” at hindi nagdaragdag ng mekanismo o palatandaan ng pagsang-ayon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kawan” at “handog” bilang pamilyar na mga salitang biblikal, habang iniwasan ang lipas o labis na teknikal na pananalita. Inayos ang mga panandang talababa upang ang tala tungkol sa matatabang bahagi ay sumunod sa pariralang iyon at ang leksikal na alternatibo para sa וַיִּשַׁע ay sumunod sa tugon ni Yahweh.
