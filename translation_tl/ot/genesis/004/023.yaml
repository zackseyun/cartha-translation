  text: וַ/יֹּ֨אמֶר לֶ֜מֶךְ לְ/נָשָׁ֗י/ו עָדָ֤ה וְ/צִלָּה֙ שְׁמַ֣עַן קוֹלִ֔/י נְשֵׁ֣י לֶ֔מֶךְ הַאְזֵ֖נָּה אִמְרָתִ֑/י כִּ֣י אִ֤ישׁ הָרַ֨גְתִּי֙ לְ/פִצְעִ֔/י וְ/יֶ֖לֶד לְ/חַבֻּרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/023.yaml
  text: 'And Lamech said to his wives[a], “Adah and Zillah, hear my voice; wives of Lamech, listen to my word: for I have killed a man for wounding me[b], even a young man for striking me.”'
translation:
  language: tl
  text: 'Sinabi ni Lamec sa kanyang mga asawa,

    “Adah at Zillah, pakinggan ninyo ang tinig ko;

    mga asawa ni Lamec, makinig kayo sa aking salita.

    Sapagkat pumatay ako ng isang lalaki dahil sinugatan niya ako,

    at ng isang binata dahil hinampas niya ako.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pumatay ako ng isang lalaki dahil sa sugat ko, at ng isang binata dahil sa pasa ko.” Mas literal na mababasa ang Hebreo gamit ang mga pangngalang “sugat” at “pasa” sa halip na “sinugatan niya ako” at “hinampas niya ako.”
    reason: lexical_alternative
  - marker: b
    text: Nauunawaan ng ilan ang mga salita ni Lamec bilang isang banta o pangkalahatang pagyayabang—“Papatay ako ng isang lalaki...” —sa halip na ulat ng isang aktuwal na pagpatay.
    reason: alternative_reading
lexical_decisions:
- source_word: לְנָשָׁיו
  choice: sa kanyang mga asawa
  rationale: Sa konteksto, ang pangmaramihang anyo ng אִשָּׁה na may hulaping tumutukoy kay Lamec ay malinaw na nangangahulugang mga asawa niya, hindi mga babae sa pangkalahatan.
- source_word: שְׁמַעַן קוֹלִי
  choice: pakinggan ninyo ang tinig ko
  rationale: Pinananatili ang tahasang pautos at ang konkretong larawan ng קוֹל bilang “tinig,” habang natural sa modernong Tagalog ang pandiwang “pakinggan.”
- source_word: הַאְזֵנָּה אִמְרָתִי
  choice: makinig kayo sa aking salita
  rationale: Ang הַאְזֵנָּה ay masinsing panawagang makinig; ang “aking salita” ay nagpapanatili sa patulang isahan ng אִמְרָה at sa paralelismo ng naunang linya.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang nilalaman o batayan ng ipinahayag ni Lamec nang hindi dinaragdagan ang moral na paliwanag.
- source_word: אִישׁ הָרַגְתִּי
  choice: pumatay ako ng isang lalaki
  rationale: Ang qatal na הָרַגְתִּי ay pinakapayak na nauunawaan bilang ulat ng naganap na pagpatay; ang “lalaki” ay nagpapanatili sa kaibahan nito sa יֶלֶד.
- source_word: לְפִצְעִי
  choice: dahil sinugatan niya ako
  rationale: Ang לְ na kasama ng pangngalang “sugat” at hulaping unang panauhan ay natural na nagpapahayag dito ng sanhi o pagganti. Ginawang pandiwa ang parirala para maging malinaw at likas sa Tagalog, habang itinatala sa talababa ang mas literal na anyo.
- source_word: יֶלֶד
  choice: isang binata
  rationale: Maaaring tumukoy ang יֶלֶד sa bata, batang lalaki, o kabataan. Ang “binata” ay nagpapahayag ng mas batang lalaki sa paralelismo nang hindi ipinapalagay na musmos siya.
- source_word: לְחַבֻּרָתִי
  choice: dahil hinampas niya ako
  rationale: Ang חַבּוּרָה ay maaaring “pasa,” “latay,” o “sugat.” Ang pandiwang “hinampas” ay natural na nagpapakita ng sanhi ng pagganti at bahagyang naiiba sa “sinugatan” sa unang linya.
theological_decisions:
- issue: Kung ang pagmamalaki ni Lamec ay ulat ng pagganti, pagtatanggol sa sarili, o pangkalahatang banta
  choice: Isinalin bilang ulat ng naganap na pagpatay dahil sa pananakit, nang hindi tinatawag itong pagtatanggol sa sarili.
  alternative: 'Maaaring unawain bilang banta o pangkalahatang pagyayabang: “Papatay ako ng isang lalaki...”'
  rationale: Ang qatal na הָרַגְתִּי ay pinakadirektang tumutukoy sa isang naganap na kilos, ngunit maaaring unawain ng ilan bilang modal o pangkalahatang pahayag. Hindi idinagdag ang “bilang pagtatanggol sa sarili,” sapagkat hindi iyon tahasang sinasabi ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang patulang paralelismo, ang pag-uulit ng pagtawag sa mga asawa, at ang tensiyon sa pagitan ng aktuwal na ulat at posibleng banta. Ang mga pangalang Adah, Zillah, at Lamec ay ginamit sa karaniwang anyong Filipino.
