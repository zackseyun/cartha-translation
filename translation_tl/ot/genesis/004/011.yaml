base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/011.yaml
  text: And now you are cursed from the ground[c][b][a], which has opened its mouth to receive your brother’s blood from your hand.
translation:
  language: tl
  text: At ngayon, isinumpa ka mula sa lupa[a], na nagbuka ng bibig nito upang tanggapin ang dugo[b] ng kapatid mo mula sa iyong kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ipakahulugang “palayo sa lupa” o “sa pamamagitan ng lupa.” Maaaring tumukoy ang Hebreo sa pagkakalayo ni Cain sa lupa o sa lupa bilang pinagmumulan o instrumento ng sumpa.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “mga dugo,” isang idyoma para sa dugong nabuhos o pagdanak ng dugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay at ang agarang paglipat sa bunga ng ginawa ni Cain.
- source_word: אָרוּר אָתָּה
  choice: isinumpa ka
  rationale: Likas sa makabagong Tagalog at malinaw na ipinahahayag ang kalagayan ni Cain sa ilalim ng sumpa.
- source_word: מִן הָאֲדָמָה
  choice: mula sa lupa
  rationale: Malapit sa anyo ng Hebreo at hindi tahasang nagpapasya kung ang lupa ang pinagmumulan o saklaw ng sumpa, o kung inilalayo si Cain mula rito.
- source_word: אֲשֶׁר פָּצְתָה אֶת פִּיהָ
  choice: na ibinuka ang bibig nito
  rationale: Pinananatili ang personipikasyon ng lupa nang hindi ito binibigyan ng kasariang wala namang kailangang ipahayag sa Tagalog.
- source_word: לָקַחַת
  choice: upang tanggapin
  rationale: Sa konteksto ng lupang sumisipsip sa dugong nabuhos, mas natural ang “tanggapin” kaysa sa mekanikal na “kunin.”
- source_word: דְּמֵי אָחִיךָ
  choice: ang dugo ng kapatid mo
  rationale: Bagaman maramihan ang anyong Hebreo na “mga dugo,” isa itong idyoma para sa dugong nabuhos o pagdanak ng dugo; natural sa Tagalog ang isahan.
- source_word: מִיָּדֶךָ
  choice: mula sa iyong kamay
  rationale: Pinananatili ang matingkad na larawan ng Hebreo at ang tuwirang pananagutan ni Cain.
theological_decisions:
- issue: Ugnayan ng sumpa sa lupa
  choice: “mula sa lupa,” na iniiwang bukas ang eksaktong diwa ng מִן
  alternative: “dahil sa lupa,” “ng lupa,” o “palayo sa lupa”
  rationale: Maaaring magpahiwatig ang Hebreong מִן ng pinagmulan o paghihiwalay. Hindi dapat tahasang ipasya ng salin kung ang lupa ang instrumento ng sumpa o kung ang diin ay ang pagkakalayo ni Cain mula rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang personipikasyon ng lupa at ang bahagyang di-likas ngunit mahalagang pariralang “mula sa lupa” upang hindi mawala ang tunay na kalabuan ng Hebreo.
