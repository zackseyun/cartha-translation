  naturalness: Ang “At ngayon” at “isinumpa ka mula sa lupa” ay katanggap-tanggap sa marangal na salin at sinasadyang pinananatili ang kalabuan ng Hebreong min. Mas likas at malinaw ang aktibong “na nagbuka ng bibig nito,” at mas maayos ang pagkakasunod ng layon at pariralang pinagmulan sa loob ng sugnay.
  terminology: Ang “sumpa,” “lupa,” “dugo,” at “kamay” ay angkop. Ang talababang “mga dugo” ay wastong nagpapaliwanag sa anyong maramihan sa Hebreo nang hindi ito sapilitang isinasalin nang maramihan sa pangunahing teksto.
