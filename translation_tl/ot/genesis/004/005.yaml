    rationale: Nauunawaan ito, ngunit medyo pilit ang kolokasyon. Ang Hebreong pandiwa ay tumutukoy sa pagbibigay o hindi pagbibigay ng pabor; mas idiomatiko ang “hindi niya pinakitaan ng pabor.”
