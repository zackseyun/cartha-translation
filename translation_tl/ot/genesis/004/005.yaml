  yaml_path: translation/ot/genesis/004/005.yaml
  text: But for Cain and for his offering he had no regard[a]. So Cain became very angry[b], and his face fell.
translation:
  language: tl
  text: Ngunit hindi niya pinakitaan ng pabor si Cain at ang kanyang handog.[a] Lubhang nagalit si Cain, at nabakas sa kanyang mukha ang panlulumo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi niya tiningnan nang may pabor si Cain at ang kanyang handog.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “bumagsak ang kanyang mukha,” isang idyoma para sa nakikitang panlulumo o pagsimangot.
    reason: idiom_explanation
lexical_decisions:
- source_word: וְאֶל קַיִן וְאֶל מִנְחָתוֹ
  choice: si Cain at ang handog nito
  rationale: 'Ang inuulit na אֶל ay tumutukoy sa dalawang layon ng pagtingin o pagbibigay-pansin: kay Cain at sa kanyang handog. Ang “handog” ay angkop sa kontekstong paghahandog sa Diyos, at nililinaw ng “nito” na kay Cain ang handog.'
- source_word: לֹא שָׁעָה
  choice: hindi niya tiningnan nang may pagkalugod
  rationale: Ipinahihiwatig ng pandiwa ang pagtingin o pagbibigay-pansin na may pabor. Pinananatili ng salin ang larawan ng pagtingin at ang diwa ng ipinagkait na pagsang-ayon, nang hindi nagdaragdag ng dahilan kung bakit.
- source_word: וַיִּחַר לְקַיִן מְאֹד
  choice: Labis itong ikinagalit ni Cain
  rationale: Ang Hebreong idyoma ay literal na may larawan ng pag-aalab, ngunit ang kasalukuyang pariralang Filipino ay likas at malinaw na naghahatid ng matinding galit at ng kaugnayan nito sa naunang pangyayari.
- source_word: וַיִּפְּלוּ פָנָיו
  choice: bakas sa kanyang mukha ang panlulumo
  rationale: Literal na “bumagsak ang kanyang mukha,” isang idyomang tumutukoy sa nakikitang panlulumo o pagsimangot. Inililipat ng salin ang diwa at nananatili ang pagtukoy sa mukha nang hindi gumagamit ng di-likas na literalismong Filipino.
theological_decisions:
- issue: Ang uri ng tugon ng Diyos kay Cain at sa handog nito
  choice: Isinalin bilang hindi pagtingin nang may pagkalugod, nang hindi sinasabi ang dahilan.
  alternative: “Hindi niya tinanggap” o “hindi niya kinalugdan.”
  rationale: Hindi ipinaliliwanag ng talata kung bakit ipinagkait ang pabor. Iniiwasan ng salin ang pagpasok ng anumang doktrinal na paliwanag at pinananatili ang pagpipigil at bahagyang kalabuan ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagkalugod” upang maipahayag ang pabor nang hindi tahasang ginagawang teknikal na pagtanggap sa handog; ang huling idyoma ay isinalin ayon sa diwa habang pinananatili ang larawan ng mukha.
