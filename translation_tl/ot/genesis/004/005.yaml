  naturalness: 'May ilang bahagyang di-likas na parirala ang draft: “tiningnan nang may pagkalugod si Cain” at “handog nito.” Ang “hindi niya pinakitaan ng pabor si Cain at ang kanyang handog” ay mas malinaw at karaniwan sa makabagong Filipino. Ang “nabakas sa kanyang mukha ang panlulumo” ay likas na pagsasalin ng idyoma nang hindi ipinipilit ang literal na larawan.'
  terminology: Ang “handog” ay angkop para sa מִנְחָה sa kontekstong ito. Ang “pabor” ay malinaw na katumbas ng kanais-nais na pagtingin/regard at hindi nagdaragdag ng paliwanag sa dahilan ng pagtanggi.
