  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל יְהוָ֑ה גָּד֥וֹל עֲוֺנִ֖/י מִ/נְּשֹֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/013.yaml
  text: And Cain said to Yahweh[a], “My iniquity is too great to bear.”
translation:
  language: tl
  text: At sinabi ni Cain kay Yahweh, “Napakabigat ng aking pagkakasala, higit sa makakaya kong pasanin.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Napakabigat ng aking parusa, higit sa makakaya kong pasanin.” Ang “aking pagkakasala” ay maaari ring unawaing “aking pananagutan” o “aking kasamaan.” Maaari ring unawain ang huling bahagi bilang “napakalaki ng aking pagkakasala para patawarin [mo].” Ang mga salitang Hebreo ay maaaring tumukoy sa kasamaan, pananagutan, o parusa, at ang pandiwa ay maaaring mangahulugang “pasanin” o, sa ilang konteksto, “patawarin.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Karaniwang anyo ng pagpapatuloy sa salaysay; pinananatili ng “At sinabi” ang daloy ng Hebreong naratibo sa natural na Tagalog.
- source_word: קַיִן
  choice: Cain
  rationale: Ginamit ang nakagawiang baybay ng pangalang ito sa Tagalog.
- source_word: אֶל־יְהוָה
  choice: kay Yahweh
  rationale: Ang “kay” ang natural na panandang Tagalog para sa taong kinakausap, at ang יהוה ay isinalin bilang personal na pangalang “Yahweh” sa halip na palitan ng isang titulo.
- source_word: גָּדוֹל
  choice: napakalaki
  rationale: Ipinahahayag ng pang-uri ang tindi o laki; ang “napakalaki” ay nagpapanatili sa pangunahing larawan nang hindi agad nagpapasya kung kasamaan, bigat ng pagkakasala, o parusa ang tinutukoy.
- source_word: עֲוֺנִי
  choice: aking kasamaan
  rationale: Ang עָוֹן ay maaaring tumukoy sa kasamaan, pagkakasala o pananagutan, at maging sa kaparusahang bunga nito. Ginamit sa pangunahing teksto ang “kasamaan,” habang inilalahad sa talababa ang mahahalagang alternatibo.
- source_word: מִנְּשֹׂא
  choice: upang pasanin
  rationale: Ang נָשָׂא ay pangunahing maaaring mangahulugang magdala o magpasan, ngunit maaari ring mangahulugang magpatawad sa ilang konteksto. Pinananatili ng “upang pasanin” ang pinakadirektang diwa at ang maikling anyo ng Hebreo.
theological_decisions:
- issue: Kalabuan ng עֲוֺנִי מִנְּשֹׂא
  choice: “Napakalaki ng aking kasamaan upang pasanin.”
  alternative: Maaaring tumukoy si Cain sa bigat ng kaniyang pagkakasala o parusa; maaari ring unawain ang pandiwa bilang “patawarin.”
  rationale: Pinahihintulutan ng saklaw ng kahulugan ng עָוֹן ang kasamaan, pananagutan, o parusa, samantalang ang נָשָׂא ay maaaring mangahulugang pasanin o, sa ilang gamit, patawarin. Hindi nilulutas nang tahimik ng salin ang teolohikal na tensiyon; inilalahad ito sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang personal na pangalang “Yahweh” at iniwasan ang lumang pananalitang hindi na karaniwan. Ang pangunahing teksto ay maikli gaya ng Hebreo, habang ang tunay na leksikal at teolohikal na kalabuan ay inilagay sa talababa.
