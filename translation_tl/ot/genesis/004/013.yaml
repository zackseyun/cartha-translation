revisions:
- from: At sinabi ni Cain kay Yahweh, “Napakalaki ng aking kasamaan upang pasanin.”[a]
  to: At sinabi ni Cain kay Yahweh, “Napakabigat ng aking pagkakasala, higit sa makakaya kong pasanin.”[a]
  rationale: Inayos ang sintaks upang maipahayag nang natural ang Hebreong paghahambing na “masyadong malaki/mabigat upang pasanin,” nang hindi ipinipilit ang isang kahulugan ng עָוֹן. Ang pangunahing teksto ay nananatiling malapit sa audit trail na “iniquity ... bear,” samantalang ang talababa ay malinaw na nag-iingat sa kontekstuwal na pagbasa na “parusa,” gayundin sa posibilidad na “patawarin.”
