base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/016.yaml
  text: Then Cain went out from before Yahweh and settled in the land of Nod[a], east of Eden.
translation:
  language: tl
  text: Pagkatapos, umalis si Cain mula sa harapan ni Yahweh at nanirahan sa lupain ng Nod[a], sa silangan ng Eden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Nod” ay katunog ng salitang Hebreo para sa “paglalagalag,” na umaalingawngaw sa naunang hatol kay Cain sa kabanatang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: umalis
  rationale: Tuwirang ipinahihiwatig ng pandiwa ang paglabas o paglayo. Likas sa makabagong Tagalog ang “umalis” at hindi nito dinaragdagan ang paraan o dahilan ng pag-alis.
- source_word: מִלִּפְנֵי
  choice: mula sa harap
  rationale: Pinananatili nito ang konkretong idyomang Hebreo na “mula sa mukha/harap ng” at ang kaugnay na tensiyong pangkuwento, sa halip na tahasang ipakahulugang lubos na nawala si Cain sa presensiya ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa paninirahan o pagtira sa isang lugar. Natural at malinaw ang “nanirahan” sa Tagalog.
- source_word: בְּאֶרֶץ נוֹד
  choice: sa lupain ng Nod
  rationale: Pangalan ng lugar ang Nod kaya isinalin ito sa pamamagitan ng transliterasyon; inilagay sa talababa ang mahalagang paglalaro sa tunog at kahulugan.
- source_word: קִדְמַת עֵדֶן
  choice: sa silangan ng Eden
  rationale: Malinaw at likas nitong ipinahahayag ang lokasyong nasa dakong silangan kaugnay ng Eden.
- source_word: עֵדֶן
  choice: Eden
  rationale: Pinanatili ang nakaugaliang transliterasyon ng pangalan ng lugar.
theological_decisions:
- issue: Kung paano ilalarawan ang pag-alis ni Cain kaugnay ng Diyos
  choice: umalis si Cain mula sa harap ni Yahweh
  alternative: umalis si Cain mula sa presensiya ni Yahweh
  rationale: Ang “mula sa harap” ay mas malapit sa idyomang Hebreo at pinananatili ang tensiyon tungkol sa paglayo at pagkakahiwalay ni Cain nang hindi ipinapasyang maaaring literal na makaalis ang isang tao sa presensiya ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang bahagyang di-pangkaraniwang “mula sa harap” upang maingatan ang konkretong idyomang Hebreo at ang teolohikal na tensiyon nito; natural naman ang natitirang pangungusap para sa karaniwang mambabasa.
