  text: וְ/שֵׁ֥ם אָחִ֖י/ו יוּבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י כָּל תֹּפֵ֥שׂ כִּנּ֖וֹר וְ/עוּגָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/021.yaml
  text: And the name of his brother was Jubal[c][b][a]; he was the father of all who play the lyre and the pipe.
translation:
  language: tl
  text: Ang pangalan ng kapatid niya ay Jubal. Siya ang ama[a] ng lahat ng tumutugtog[b] ng lira at instrumentong de-ihip.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ama” rito ay maaaring mangahulugang ninuno, tagapagtatag, o tagapanguna, at hindi kinakailangang tuwirang ama ng bawat musikero.
    reason: cultural_note
  - marker: b
    text: Sa literal, “humahawak” o “humahawak sa.” Sa kontekstong ito ng mga instrumentong pangmusika, tumutukoy ito sa pagtugtog ng mga ito.
    reason: lexical_alternative
  - marker: c
    text: Hindi tiyak ang eksaktong sinaunang instrumentong de-ihip na tinutukoy ng salitang Hebreo. Maaari rin itong isaling “plawta” o “tambuling hinihipan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אָחִיו
  choice: Ang pangalan ng kapatid niya
  rationale: Likas sa modernong Tagalog at tapat sa ugnayang ipinahahayag ng Hebreo; ang pang-ugnay na וְ ay hindi kailangang isalin bilang “at” sa simula upang maging maayos ang salaysay.
- source_word: יוּבָל
  choice: Jubal
  rationale: Karaniwang transliterasyon ng pangalang Hebreo sa Filipino.
- source_word: הוּא הָיָה
  choice: Siya ang
  rationale: Malinaw at natural na panaguring Tagalog para sa Hebreong emphatic predication; hindi ipinapalagay na “naging” ang kahulugan.
- source_word: אֲבִי
  choice: ama ng
  rationale: Pinananatili ang Hebreong talinghaga, na sa kontekstong ito ay maaaring tumukoy sa pinagmulan, ninuno, o tagapanguna ng isang pangkat.
- source_word: כָּל תֹּפֵשׂ
  choice: lahat ng tumutugtog
  rationale: Bagaman literal na “humahawak” o “humahawak nang mahigpit” ang pandiwa, ang konteksto ng mga instrumentong pangmusika ay nagpapahiwatig ng pagtugtog.
- source_word: כִּנּוֹר
  choice: lira
  rationale: Mas tiyak na katumbas kaysa “alpa” para sa sinaunang instrumentong de-kuwerdas na tinutukoy ng כִּנּוֹר.
- source_word: עוּגָב
  choice: plawta
  rationale: Natural at madaling maunawaang katawagan para sa instrumentong hinihipan, habang inilalahad sa talababa ang kawalan ng katiyakan sa eksaktong anyo nito.
theological_decisions:
- issue: Kahulugan ng “ama ng lahat” sa pahayag tungkol kay Jubal
  choice: Pinanatili sa teksto ang “ama ng lahat,” na may paliwanag na maaari itong mangahulugang ninuno, pinagmulan, o tagapanguna.
  alternative: “tagapanguna ng lahat” o “pinagmulan ng lahat”
  rationale: Pinananatili nito ang Hebreong idyoma at ang maaaring literal o kultural na saklaw nito nang hindi sapilitang nilulutas ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “lira” bilang mas tumpak na katawagan sa instrumentong de-kuwerdas at “plawta” bilang malinaw ngunit hindi ganap na tiyak na katumbas ng sinaunang instrumentong de-ihip.
