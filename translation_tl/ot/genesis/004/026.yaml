base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/026.yaml
  text: And to Seth also a son was born[a], and he called his name Enosh[b]. At that time people began to call on the name of Yahweh.
translation:
  language: tl
  text: Nagkaroon din si Set ng isang anak na lalaki, at pinangalanan niya itong Enosh. Nang panahong iyon, nagsimulang tumawag ang mga tao sa pangalan ni Yahweh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Noon ay sinimulang tumawag sa pangalan ni Yahweh.” Hindi tahasang binabanggit sa Hebreo kung sino ang tumawag.'
    reason: lexical_alternative
  - marker: b
    text: 'Ayon sa isang minoryang pagpapakahulugan sa pandiwa: “Noon ay nagsimulang lapastanganin ng mga tao ang pangalan ni Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁת גַּם הוּא יֻלַּד בֵּן
  choice: Nagkaroon din si Set ng isang anak na lalaki
  rationale: Natural itong paglilipat sa Tagalog ng Hebreong pasibong pahayag na isang anak na lalaki ang ipinanganak para kay Set; pinananatili ng “din” ang diwa ng pagdaragdag ng גַּם.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ אֱנוֹשׁ
  choice: at pinangalanan niya itong Enos
  rationale: Ang Hebreong idyomang “tinawag ang pangalan niya” ay likas na ipinapahayag sa makabagong Tagalog bilang “pinangalanan niya.” Ginamit ang karaniwang anyong Tagalog na “Enos” para sa pangalang אֱנוֹשׁ.
- source_word: אָז
  choice: Nang panahong iyon
  rationale: Malinaw nitong ipinapahayag ang temporal na diwa ng אָז nang hindi ipinapalagay ang eksaktong tagal o sandali.
- source_word: הוּחַל
  choice: nagsimula
  rationale: Isinalin ang Hophal bilang pasimulang kilos sa natural na Tagalog. Ang mas literal na balangkas na “sinimulan” at ang minoryang pagbasa na “nilapastangan” ay inilagay sa mga talababa.
- source_word: לִקְרֹא בְּשֵׁם
  choice: tumawag ... sa pangalan
  rationale: Pinananatili nito ang karaniwang Hebreong idyoma ng pagtawag o pananalangin sa pangalan ng Diyos, habang hindi isinasara ang iba pang posibleng himig ng pagpapahayag o pagsamba.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na personal na pangalan sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kahulugan ng הוּחַל לִקְרֹא בְּשֵׁם יְהוָה
  choice: nagsimulang tumawag ang mga tao sa pangalan ni Yahweh
  alternative: sinimulang tumawag sa pangalan ni Yahweh; o, ayon sa minoryang pagpapakahulugan, nagsimulang lapastanganin ang pangalan ni Yahweh
  rationale: Ang pangunahing salin ay kumakatawan sa pinakakaraniwang pag-unawa sa parirala bilang pagsisimula ng pagtawag sa Diyos. Gayunman, hindi tahasang binabanggit sa Hebreo ang “mga tao,” pasibo ang anyo ng pandiwa, at may pinagtatalunang pagbasa sa ugat; kaya pinananatili sa mga talababa ang tunay na gramatikal at leksikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Set” at “Enos,” na mga anyong pamilyar sa mga mambabasang Tagalog, at iniwasan ang sobrang literal ngunit alanganing pariralang “tinawag niya ang pangalan nito.”
