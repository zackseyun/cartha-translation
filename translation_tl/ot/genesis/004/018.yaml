base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/018.yaml
  text: To Hanok was born Irad[a], and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.
translation:
  language: tl
  text: Ipinanganak kay Hanok si Irad. Naging ama ni Mehujael[a] si Irad, naging ama ni Metushael si Mehujael, at naging ama ni Lamek si Metushael.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Magkaiba ang baybay sa Hebreo ng pangalang ito sa talatang ito: Mehujael at Mehijael.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּוָּלֵד
  choice: Ipinanganak
  rationale: Ang Niphal ng ילד ay pasibo; malinaw at likas sa modernong Tagalog ang “ipinanganak” at pinananatili nito ang kaibahan sa kasunod na aktibong anyo.
- source_word: לַחֲנוֹךְ
  choice: kay Hanok
  rationale: Tinutukoy ng ל ang magulang na pinanganakan ng anak. Ang “kay” ang likas na pananda sa pangalang pantangi sa ganitong pangungusap.
- source_word: עִירָד
  choice: Irad
  rationale: Tuwirang transliterasyon ng pangalang Hebreo na angkop sa baybay ng Filipino.
- source_word: יָלַד
  choice: naging ama ni
  rationale: Sa talaangkanan, ipinahihiwatig ng aktibong Qal ang pagiging ama o pag-aanak. Natural at marangal sa modernong Tagalog ang “naging ama ni,” samantalang iniiwasan ang makalumang “ipinanganak” bilang aktibong pandiwa.
- source_word: מְחוּיָאֵל / מְחִיּיָאֵל
  choice: Mehujael
  rationale: Iisang anyo ang ginamit sa pangunahing teksto para sa maayos na pagbasa, ngunit inilalahad sa talababa ang dalawang magkaibang baybay sa tekstong Hebreo.
- source_word: מְתוּשָׁאֵל
  choice: Metushael
  rationale: Tuwirang transliterasyon mula sa Hebreo, gamit ang baybay na madaling basahin sa Filipino.
- source_word: לָמֶךְ
  choice: Lamek
  rationale: Tuwirang transliterasyon mula sa Hebreo; ang hulíng כ ay kinakatawan ng “k” ayon sa karaniwang baybay sa Filipino.
