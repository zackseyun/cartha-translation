  register: Modernong Filipino na payak ngunit marangal. Ginamit ang mga pangalang transliterado mula sa Hebreo at pinanatili ang pagkakaiba ng pasibong “ipinanganak” sa unang sugnay at aktibong “naging ama” sa mga sumunod.
