  text: הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜/י הַ/יּ֗וֹם מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה וּ/מִ/פָּנֶ֖י/ךָ אֶסָּתֵ֑ר וְ/הָיִ֜יתִי נָ֤ע וָ/נָד֙ בָּ/אָ֔רֶץ וְ/הָיָ֥ה כָל מֹצְאִ֖/י יַֽהַרְגֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/014.yaml
  text: Look[a], today you have driven me away from the face of the ground, and I will be hidden from your face. I will be a wanderer and a fugitive on the earth[b], and whoever finds me will kill me.
translation:
  language: tl
  text: “Tingnan mo, itinaboy mo ako ngayon mula sa ibabaw ng lupa, at maikukubli ako mula sa iyong harapan.[a] Magiging palaboy at lagalag ako sa daigdig,[b] at papatayin ako ng sinumang makatagpo sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magtatago ako mula sa iyong presensiya” o “maikukubli ako mula sa iyong presensiya.” Literal sa Hebreo, “mula sa iyong mukha.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa lupain.” Ang salitang Hebreo na אֶרֶץ ay maaaring mangahulugang “daigdig” o “lupain,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tingnan mo
  rationale: Isang pantawag-pansin na nagbibigay-diin sa kasunod na sinabi. Likas ito sa makabagong Tagalog at pinananatili ang kagyat na himig ng pahayag.
- source_word: גֵּרַשְׁתָּ אֹתִי
  choice: itinaboy mo ako
  rationale: Ipinahihiwatig ng pandiwa ang sapilitang pagpapaalis; malinaw at natural sa Tagalog ang “itinaboy.”
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: mula sa ibabaw ng lupa
  rationale: Pinananatili ng “ibabaw” ang larawan ng Hebreong “mukha ng lupa,” samantalang ang “lupa” ay umaalingawngaw sa sinumpang lupang sinasaka sa konteksto.
- source_word: וּמִפָּנֶיךָ אֶסָּתֵר
  choice: maikukubli ako mula sa iyong harapan
  rationale: Pinananatili ang pasibo o mapanumbalik na posibilidad ng Niphal at ang idyomang tumutukoy sa mukha o presensiya ng Diyos, nang hindi tiyakang nilulutas kung si Cain ang magtatago o siya ay maikukubli.
- source_word: נָע וָנָד
  choice: palaboy at lagalag
  rationale: Dalawang magkaugnay ngunit magkahiwalay na salita ang ginamit upang ipahayag ang buhay na walang katiyakan at walang pirming tahanan.
- source_word: בָּאָרֶץ
  choice: sa daigdig
  rationale: Ang mas malawak na kahulugan ng אֶרֶץ ay angkop sa sinaunang pangkalahatang saklaw ng salaysay; inilalahad sa talababa ang posibleng mas panrehiyong kahulugang “lupain.”
- source_word: כָל מֹצְאִי
  choice: sinumang makakita sa akin
  rationale: 'Natural na katumbas sa Tagalog ng di-tiyak at pansaklaw na parirala: sinumang makatagpo o makakita sa kaniya.'
- source_word: יַהַרְגֵנִי
  choice: papatayin ako
  rationale: Tuwiran at karaniwang katumbas ng pandiwang Hebreo para sa pagpatay.
theological_decisions:
- issue: Ang idyoma ng presensiya ng Diyos sa וּמִפָּנֶיךָ אֶסָּתֵר
  choice: maikukubli ako mula sa iyong harapan
  alternative: magtatago ako mula sa iyong presensiya / maikukubli ako mula sa iyong presensiya
  rationale: Ang “harapan” ay nagpapanatili sa konkretong larawang “mukha” at sa bigat ng pagkakahiwalay kay Diyos. Ang anyong “maikukubli” ay hindi basta nagpapasiya sa tunay na kalabuan ng Hebreo sa pagitan ng pasibo at mapanumbalik na diwa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Iniwasan ang labis na arkaikong pananalita habang pinananatili ang konkretong larawan at ang kalabuan ng tekstong Hebreo.
