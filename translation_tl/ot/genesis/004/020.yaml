  yaml_path: translation/ot/genesis/004/020.yaml
  text: Adah bore Jabal[a]; he was the father of those who dwell in tents and have livestock.
translation:
  language: tl
  text: Ipinanganak ni Ada si Jabal.[a] Siya ang ama ng mga naninirahan sa mga tolda at may mga alagang hayop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Siya ang ninuno o tagapagtatag ng mga naninirahan sa mga tolda at may mga alagang hayop.” Ang Hebreong “ama ng” ay maaaring mangahulugang ninuno, tagapagtatag, o unang huwaran ng isang paraan ng pamumuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Ipinanganak ni
  rationale: Likas at maikli itong pormula sa makabagong Filipino para sa pagsilang sa salaysay ng angkan; malinaw nitong ipinakikilalang si Ada ang ina.
- source_word: עָדָה
  choice: Ada
  rationale: Isinalin sa baybay na madaling bigkasin sa Filipino ang pangalang Hebreo.
- source_word: אֶת
  choice: '[pananda ng tuwirang layon, hindi isinalin]'
  rationale: Minamarkahan nito si Jabal bilang tuwirang layon at wala itong hiwalay na katumbas dito sa Filipino.
- source_word: יָבָל
  choice: Jabal
  rationale: Pinanatili ang kinagawiang transliterasyon ng pangalan.
- source_word: הוּא הָיָה
  choice: Siya ang
  rationale: Natural na Filipino ito sa pagtukoy sa papel ni Jabal; hindi nito idinaragdag ang di-tiyak na diwang ‘naging.’
- source_word: אֲבִי
  choice: ama ng
  rationale: Pinananatili nito ang metaporang Hebreo, na maaaring tumukoy sa ninuno, tagapagtatag, o unang huwaran ng isang uri ng pamumuhay.
- source_word: יֹשֵׁב אֹהֶל
  choice: mga naninirahan sa mga tolda
  rationale: Ipinakikita ng maramihang ‘mga’ ang kolektibong diwa ng pang-isahang participle at natural itong maunawaan sa Filipino.
- source_word: וּמִקְנֶה
  choice: at nag-aalaga ng mga hayop
  rationale: Ang מִקְנֶה ay tumutukoy sa livestock o mga alagang hayop; nilinaw ng pandiwang ‘nag-aalaga’ ang ipinahihiwatig na gawaing kaugnay ng ganitong paraan ng pamumuhay.
theological_decisions:
- issue: Saklaw ng titulong ‘ama’
  choice: Pinanatili sa pangunahing teksto ang ‘ama’ at ipinaliwanag sa talababa ang mas malawak na idyomatikong diwa.
  alternative: ninuno o tagapagtatag
  rationale: Hindi tiyak kung biyolohikal na ninuno lamang, tagapagtatag, o huwarang pinagmulan ang tinutukoy; pinananatili ng salin ang sadyang lawak ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘tolda’ bilang karaniwang salita at pinanatili ang maikli at pormulang anyo ng talaangkanan.
