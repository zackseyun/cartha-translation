base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/017.yaml
  text: Cain knew his wife[a], and she conceived and bore Enoch. He was building a city[d][c][b], and he named the city after his son Enoch.
translation:
  language: tl
  text: Nakipagtalik si Cain sa kanyang asawa,[a] at naglihi ito at nagsilang kay Enoc. Nagpapatuloy siyang nagtatayo ng isang lungsod,[b] at ipinangalan niya ang lungsod sa kanyang anak na si Enoc.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Nakilala ni Cain ang kanyang asawa.” Ang “nakilala” ay karaniwang Hebreong idyoma para sa pakikipagtalik.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin na “nagtayo siya ng isang lungsod,” ngunit ang anyo sa Hebreo ay maaaring magpahiwatig ng nagpapatuloy na gawain: “nagpapatuloy siyang nagtatayo.”'
    reason: lexical_alternative
  - marker: c
    text: 'Mas literal: “tinawag niya ang pangalan ng lungsod ayon sa pangalan ng kanyang anak na si Enoc”; ibig sabihin, ipinangalan niya ang lungsod sa kanyang anak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: Nakipagtalik
  rationale: Ang יָדַע ay literal na “nakilala/nalaman,” ngunit dito ay karaniwang Hebreong idyoma para sa pakikipagtalik. Ang tuwirang salin ay malinaw at natural sa modernong Filipino; pinananatili sa talababa ang literal na anyo.
- source_word: אִשְׁתּוֹ
  choice: kanyang asawa
  rationale: Maaaring mangahulugang “babae” o “asawa” ang אִשָּׁה; ipinahihiwatig ng hulaping paari at ng konteksto ng pagsasama ang “asawa.”
- source_word: וַתַּהַר
  choice: naglihi
  rationale: Natural at maikli itong katumbas ng pandiwang tumutukoy sa paglilihi o pagbubuntis.
- source_word: וַתֵּלֶד
  choice: ipinanganak
  rationale: Karaniwang Filipino para sa pagsilang ng isang anak at angkop sa sunod-sunod na salaysay.
- source_word: חֲנוֹךְ
  choice: Enoc
  rationale: Ginamit ang nakagawiang anyo ng pangalang biblikal sa Filipino.
- source_word: וַיְהִי בֹּנֶה עִיר
  choice: Noon ay nagtatayo si Cain ng isang lungsod
  rationale: Ang היה kasama ng participle na בֹּנֶה ay maaaring magpahiwatig ng nagpapatuloy na gawain, kaya “nagtatayo” sa halip na ang ganap na “nagtayo.” Nilinaw ang simuno bilang si Cain upang maiwasan ang kalituhan sa Filipino.
- source_word: עִיר
  choice: lungsod
  rationale: Ito ang karaniwang katumbas ng עִיר; hindi ito pinaliit sa “bayan.”
- source_word: וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ
  choice: ipinangalan niya rito ang pangalan ng anak niyang si Enoc
  rationale: Pinananatili nito ang pag-uulit ng שֵׁם (“pangalan”) sa Hebreo nang mas natural kaysa sa lubos na literal na pormulasyon. Ang “rito” ay tumutukoy sa lungsod.
