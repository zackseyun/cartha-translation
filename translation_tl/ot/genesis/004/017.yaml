- from: Nakipagtalik si Cain sa kanyang asawa,[a] at naglihi ito at ipinanganak si Enoc. Noon ay nagtatayo si Cain ng isang lungsod,[b] at ipinangalan niya rito ang pangalan ng anak niyang si Enoc.[c]
  to: Nakipagtalik si Cain sa kanyang asawa,[a] at naglihi ito at nagsilang kay Enoc. Nagpapatuloy siyang nagtatayo ng isang lungsod,[b] at ipinangalan niya ang lungsod sa kanyang anak na si Enoc.[c]
  rationale: Pinalitan ang “ipinanganak si Enoc” ng “nagsilang kay Enoc” upang malinaw na ang asawa ni Cain ang gumaganap ng kilos, gaya ng Hebreo. Inayos ang hulíng sugnay sa likas na Filipino na “ipinangalan niya ang lungsod sa kanyang anak,” samantalang pinanatili sa talababa ang mas literal na pag-uulit ng “pangalan.” Ginawang “Nagpapatuloy siyang nagtatayo” ang progresibong konstruksyon upang maipakita ang posibleng nagpapatuloy na aspekto ng היה + participle nang walang di-kailangang temporal na “Noon.”
