  terminology: Ang “Nakipagtalik,” “asawa,” “naglihi,” “lungsod,” at mga pangalang “Cain” at “Enoc” ay angkop sa modernong Filipino Tagalog at sa rehistro ng salaysay. Pinanatili ng talababa ang literal na Hebreong idyoma nang hindi ginagawa itong pangunahing salin.
