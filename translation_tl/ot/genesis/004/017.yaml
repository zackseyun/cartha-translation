translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa salaysay. Ginawang tuwiran ang Hebreong idyoma sa pangunahing teksto at inilagay ang literal na anyo sa talababa. Pinanatili ang posibleng progresibong aspekto ng pagtatayo at ang pag-uulit ng konsepto ng “pangalan” sa hulí ng talata.
