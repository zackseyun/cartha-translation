base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/007.yaml
  text: If you do well[a], will there not be acceptance? But if you do not do well, sin is crouching at the door; its desire is for you[d][c][b], but you must rule over it.
translation:
  language: tl
  text: Kung gagawin mo ang mabuti, hindi ba't tatanggapin ka?[a] Ngunit kung hindi mo gagawin ang mabuti, ang kasalanan ay nakadapa sa pintuan; ikaw ang hinahangad nito,[b][c] ngunit dapat mo itong pagharian.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pag-aangat.” Maaaring ang mukha ni Cain ang aangat o tatanggapin siya ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang handog para sa kasalanan ang nakahimlay sa pintuan,” ngunit mas natural sa konteksto ang larawan ng kasalanan bilang isang mabangis na hayop na nakadapa.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “ang pagnanasa nito” o “ang paghahangad nito.” Ihambing ang kahawig na pananalita sa Genesis 3:16.
    reason: cross_reference
  - marker: d
    text: Maaari ring “paghaharian mo ito” o “maaari mo itong pagharian.” Maaaring unawain ang Hebreo bilang paghihikayat, prediksiyon, o posibilidad.
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּיטִיב
  choice: gagawin mo ang mabuti
  rationale: Ipinahahayag ng Hiphil ng יטב ang paggawa ng tama o mabuti, hindi lamang ang pagiging maayos ang pakiramdam. Likas at malinaw ito sa modernong Tagalog.
- source_word: שְׂאֵת
  choice: tatanggapin ka
  rationale: Literal itong kaugnay ng ‘pag-aangat,’ ngunit sa konteksto ay maaaring tumukoy sa pag-angat ng mukha ni Cain o sa pagtanggap sa kaniya. Inilalahad ng pangunahing teksto ang malamang na diwa, habang pinananatili sa talababa ang tunay na kalabuan.
- source_word: לַפֶּתַח
  choice: sa pintuan
  rationale: Tuwirang lokatibong parirala ito at pinananatili ang matingkad na larawan ng bantang nasa bungad.
- source_word: חַטָּאת
  choice: kasalanan
  rationale: Bagaman maaari ring mangahulugang ‘handog para sa kasalanan,’ higit na umaangkop sa pandiwaring ‘nakadapa’ ang kasalanang isinatao bilang mabangis na hayop.
- source_word: רֹבֵץ
  choice: nakadapa
  rationale: Inilalarawan ng participle ang hayop na nakadapa o nag-aabang. Pinananatili ng ‘nakadapa’ ang larawan nang hindi labis na idinaragdag ang ideya ng pananambang.
- source_word: תְּשׁוּקָתוֹ
  choice: ikaw ang hinahangad nito
  rationale: Ang תְּשׁוּקָה ay pagnanasa o paghahangad. Ang ayos na ito ay natural sa Tagalog at pinananatili ang kaugnayan ng pananalita sa Genesis 3:16.
- source_word: תִּמְשָׁל בּוֹ
  choice: dapat mo itong pagharian
  rationale: Maaaring utos, hula, o pahayag ng posibilidad ang imperfect. Sa konteksto ng babala, naipahahayag ng ‘dapat’ ang paghihikayat nang hindi ginagawang tiyak na pangako o tahasang pahayag tungkol sa kakayahan.
theological_decisions:
- issue: Kung ang huling sugnay ay utos na pagharian ni Cain ang kasalanan, pangakong paghaharian niya ito, o pahayag na kaya niya itong pagharian
  choice: dapat mo itong pagharian
  alternative: ‘paghaharian mo ito’ o ‘maaari mo itong pagharian’
  rationale: Pinahihintulutan ng anyong Hebreo ang paghihikayat, prediksiyon, o posibilidad. Pinakamalapit sa daloy ng babala ang paghihikayat, ngunit inilalahad sa talababa ang ibang tunay na posibleng pagbasa upang hindi alisin ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘hindi ba’t’ upang mapanatili ang retorikal na tanong, at ‘pagharian’ upang mapanatili ang metapora ng pamamahala. Ang lahat ng marker [a]–[d] ay nasa pangunahing teksto.
