revisions:
- from: Si Zila rin ay nagsilang kay Tubal-cain[a], na nagpapanday ng lahat ng uri ng kasangkapang tanso at bakal[b]. Ang kapatid na babae ni Tubal-cain ay si Naama.
  to: Si Zila rin ay nagsilang kay Tubal-Cain[a], isang panday ng bawat kasangkapang bronse at bakal[b]. Ang kapatid na babae ni Tubal-Cain ay si Naama.
  rationale: Inalis ang dagdag na ‘uri,’ pinili ang mas tuwirang ‘bawat,’ at inayos ang katawagan para sa copper/bronze sa modernong Filipino. Pinanatili ang pangunahing pagbasa na inilalarawan si Tubal-Cain bilang panday ng mga kasangkapang metal, habang malinaw na itinatala sa talababa ang literal ngunit mahirap na alternatibong pagbasa. Walang idinagdag na teolohikal o doktrinal na pagpapakahulugan.
