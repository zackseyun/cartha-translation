base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/022.yaml
  text: Zillah also bore Tubal-cain[a], a forger of every cutting tool of bronze and iron[b]. And the sister of Tubal-cain was Naamah.
translation:
  language: tl
  text: Si Zila rin ay nagsilang kay Tubal-Cain[a], isang panday ng bawat kasangkapang bronse at bakal[b]. Ang kapatid na babae ni Tubal-Cain ay si Naama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mahirap unawain ang Hebreong parirala pagkatapos ng “Tubal-Cain.” Maaari rin itong isalin nang mas literal: “isang tagapatalas o tagapanday ng bawat manggagawa sa bronse at bakal.”'
    reason: alternative_reading
  - marker: b
    text: Ang salitang isinaling “bronse” ay maaari ring isalin na “tanso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הִוא
  choice: rin
  rationale: 'Likas na ipinahahayag ng “rin” ang pandagdag na diwa: si Zila, gaya ng naunang binanggit, ay nagsilang din.'
- source_word: יָלְדָה
  choice: nagsilang
  rationale: Maikli, marangal, at karaniwang salin sa kontekstong talaangkanan.
- source_word: תּוּבַל קַיִן
  choice: Tubal-cain
  rationale: Pangalang pantangi na tinumbasan sa pamamagitan ng transliterasyon; pinanatili ang gitling ng tambalang anyo.
- source_word: לֹטֵשׁ כָּל חֹרֵשׁ
  choice: nagpapanday ng lahat ng uri ng kasangkapan
  rationale: Mahirap at hindi tiyak ang konstruksiyong Hebreo. Ipinahahayag ng pangunahing salin ang malamang na diwa ng paggawa o pagpapanday ng mga kagamitang metal, habang inilalagay sa talababa ang posibleng pagtukoy sa isang tagapanday o manggagawa.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Ang “tanso” ang natural na katawagang Filipino na maaaring tumukoy sa copper o bronze sa ganitong sinaunang konteksto; nililinaw sa talababa ang saklaw.
- source_word: בַרְזֶל
  choice: bakal
  rationale: Tuwirang katumbas ng katawagang Hebreo para sa iron.
- source_word: אֲחוֹת
  choice: kapatid na babae
  rationale: Tiyak na ipinahahayag ang kasariang nakasaad sa Hebreo.
- source_word: נַעֲמָה
  choice: Naama
  rationale: Pangalang pantangi na isinalin sa karaniwang baybay na madaling bigkasin sa Filipino.
theological_decisions:
- issue: Pagkakakilanlan ng inilalarawan ng pariralang לֹטֵשׁ כָּל חֹרֵשׁ
  choice: Inilarawan si Tubal-cain bilang nagpapanday ng mga kasangkapang metal.
  alternative: Maaari siyang ilarawan bilang tagapatalas o tagapanday ng bawat manggagawa sa tanso at bakal.
  rationale: Hindi teolohikal na nilutas ang malabong sintaks; pinili ang pinakamaayos na pangunahing pagbasa at hayagang pinanatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago at dignidad na Filipino, na may payak na estruktura para sa karaniwang mambabasa. Ginamit ang “nagpapanday” sa halip na teknikal o lipas na katawagan, at pinanatili sa mga talababa ang leksikal at sintaktikong kalabuan.
