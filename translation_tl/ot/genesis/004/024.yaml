  text: כִּ֥י שִׁבְעָתַ֖יִם יֻקַּם קָ֑יִן וְ/לֶ֖מֶךְ שִׁבְעִ֥ים וְ/שִׁבְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/024.yaml
  text: For Cain is avenged sevenfold[b][a], and Lamech seventy-sevenfold.
translation:
  language: tl
  text: 'Sapagkat pitong ulit ipaghihiganti si Cain[a],

    at si Lamec naman, pitumpu’t pitong ulit.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinaghihiganti si Cain.” Maaaring ipahayag ng pandiwang Hebreo ang isang pangkalahatang katotohanan o ang tiyak na mangyayari.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “pitumpu at pito”; ibig sabihin, “pitumpu’t pitong ulit.” Hindi ito “pitumpung ulit na pito.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan ng pagyayabang ni Lamec sa naunang talata at pinananatili ang ugnayang sanhi o katuwiran.
- source_word: שִׁבְעָתַיִם
  choice: pitong ulit
  rationale: Ginagamit ang anyong ito bilang pang-abay upang ipahayag ang pitong antas o sukat ng paghihiganti; natural at malinaw ito sa makabagong Filipino.
- source_word: יֻקַּם
  choice: ipaghihiganti
  rationale: Ang Hophal ng נקם ay balintiyak at tumutukoy sa paghihiganti para sa isang tao. Ang anyong panghinaharap sa Filipino ay angkop sa diwang tiyak na mangyayari, habang itinatala sa talababa ang maaaring pangkalahatan o kasalukuyang diwa.
- source_word: קָיִן
  choice: Cain
  rationale: Karaniwang anyo ng pangalang ito sa Filipino.
- source_word: וְלֶמֶךְ
  choice: at si Lamec naman
  rationale: Pinananatili ng “at” ang pang-ugnay na Hebreo, samantalang nililinaw ng “naman” ang paghahambing kay Cain nang hindi ginagawang tahasang pagsalungat.
- source_word: שִׁבְעִים וְשִׁבְעָה
  choice: pitumpu’t pitong ulit
  rationale: Literal itong “pitumpu at pito,” kaya ang natural na bilang ay pitumpu’t pito. Ang “ulit” ay nagpapanatili sa pagkakatulad nito sa “pitong ulit.”
theological_decisions:
- issue: Bilang sa pahayag ni Lamec tungkol sa paghihiganti
  choice: pitumpu’t pitong ulit
  alternative: pitumpung ulit na pito
  rationale: Ang Hebreong שִׁבְעִים וְשִׁבְעָה ay karaniwang nangangahulugang pitumpu’t pito, hindi pitumpung ulit na pito. Pinananatili nito ang pagtindi mula sa pitong ulit para kay Cain nang hindi ipinapasok sa Genesis ang posibleng impluwensiya ng Mateo 18:22.
- issue: Panahon o aspekto ng paghihiganti kay Cain
  choice: ipaghihiganti
  alternative: ipinaghihiganti
  rationale: Maaaring magpahayag ang Hebreong imperfect ng tiyak na pangyayari sa hinaharap o ng pangkalahatang katotohanan. Pinili ang anyong panghinaharap bilang natural na pahayag ng katiyakan, ngunit hindi inalis ang ibang posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyong patula at ang elipsis sa ikalawang linya, kung saan nauunawaan mula sa unang linya ang pandiwang “ipaghihiganti.”
