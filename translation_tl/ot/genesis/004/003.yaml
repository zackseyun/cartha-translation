  text: וַֽ/יְהִ֖י מִ/קֵּ֣ץ יָמִ֑ים וַ/יָּבֵ֨א קַ֜יִן מִ/פְּרִ֧י הָֽ/אֲדָמָ֛ה מִנְחָ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/003.yaml
  text: And in the course of time[c][b][a], Cain brought to Yahweh an offering from the fruit of the ground.
translation:
  language: tl
  text: Pagkalipas ng ilang panahon[a], nagdala si Cain kay Yahweh[c] ng isang handog mula sa bunga ng lupa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mula sa katapusan ng mga araw”; ibig sabihin, pagkalipas ng isang yugto ng panahon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mula sa ani ng lupa.”
    reason: lexical_alternative
  - marker: c
    text: Ang “Yahweh” ay kumakatawan sa banal na pangalang YHWH sa Hebreo; ayon sa nakaugaliang pagsasalin, maaari rin itong isalin na “PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Pagkalipas ...
  rationale: Ipinagpapatuloy ng anyong pandiwa ang salaysay. Sa makabagong Tagalog, likas na naihahatid ang tungkulin nito sa pamamagitan ng pariralang temporal nang hindi gumagamit ng makalumang “at nangyari.”
- source_word: מִקֵּץ יָמִים
  choice: pagkalipas ng ilang panahon
  rationale: Ang literal na diwa ay “mula sa katapusan ng mga araw,” ngunit isa itong idyomang tumutukoy sa paglipas ng di-tiyak na panahon, hindi sa eskatolohikal na wakas.
- source_word: וַיָּבֵא
  choice: nagdala
  rationale: Ang Hiphil ng בוא ay nangangahulugang magdala o magharap. Ang “nagdala” ang tuwiran at likas na salin sa konteksto.
- source_word: קַיִן
  choice: Cain
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa makabagong saling Filipino.
- source_word: מִפְּרִי הָאֲדָמָה
  choice: mula sa bunga ng lupa
  rationale: Pinananatili ng “bunga” ang pangunahing diwa ng פְּרִי, samantalang malinaw na tumutukoy ang “lupa” sa אֲדָמָה at sa pagsasaka ni Cain.
- source_word: מִנְחָה
  choice: isang handog
  rationale: Malawak ang saklaw ng מִנְחָה—maaaring regalo, tributo, o handog. Ang “handog” ang pinakamalinaw sa konteksto ng pagsamba nang hindi tinutukoy nang higit sa sinasabi ng teksto ang uri nito.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tahasang pangalan ng Diyos ang יהוה. Pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalang pantangi ang Tetragrammaton sa tekstong Hebreo. Ang transliterasyong “Yahweh” ay malinaw na naghahatid nito nang hindi ito pinapalitan ng isang titulo.
- issue: Diwa ng מִקֵּץ יָמִים
  choice: karaniwang pahayag tungkol sa paglipas ng panahon
  alternative: sa katapusan ng mga araw
  rationale: Sa konteksto, ipinakikilala ng parirala ang panahong lumipas bago naghandog si Cain; walang pahiwatig na tumutukoy ito sa eskatolohikal na wakas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang makalumang “at nangyari” at pinanatili ang payak na daloy ng salaysay. Ginamit ang “bunga ng lupa” upang mapanatili ang konkretong larawang agrikultural ng Hebreo.
