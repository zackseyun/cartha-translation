  yaml_path: translation/ot/genesis/004/006.yaml
  text: Then Yahweh said to Cain[a], “Why are you angry, and why has your face fallen?”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Cain, “Bakit ka nagagalit, at bakit nakayuko ang mukha mo[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “bakit bumagsak ang mukha mo?” Maaari ring isalin, “bakit malungkot ang mukha mo?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang “Pagkatapos, sinabi” upang ipakita ang pagkakasunod-sunod ng pangyayari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang personal na pangalang Hebreo na יהוה sa halip na palitan ito ng isang titulo.
- source_word: אֶל קָיִן
  choice: kay Cain
  rationale: Ang “kay” ang likas na panandang Tagalog para sa taong pinagsabihan, at “Cain” ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: לָמָּה חָרָה לָךְ
  choice: Bakit ka nagagalit
  rationale: Ang Hebreong idyoma ay literal na may diwang ‘pagliyab’ para sa isang tao, ngunit karaniwang tumutukoy sa galit. Malinaw at natural itong naipahahayag ng “nagagalit.”
- source_word: וְלָמָּה נָפְלוּ פָנֶיךָ
  choice: at bakit nanlulumo ang mukha mo
  rationale: Literal na ‘bumagsak ang mukha mo’ ang Hebreo. Pinananatili ng “nanlulumo ang mukha mo” ang matalinghagang pagtukoy sa anyo ng mukha habang malinaw na ipinahihiwatig ang panlulumo o pagiging mabigat ang kalooban.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang mismong nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “ang PANGINOON.”
- issue: Kahulugan ng ‘pagbagsak’ ng mukha
  choice: nanlulumo ang mukha mo
  alternative: nakayuko ang mukha mo; bumagsak ang mukha mo
  rationale: Hindi tahasang sinasabi ng Hebreo kung ang diin ay sa pisikal na pagkakayuko o sa malungkot na anyo. Ipinahahayag ng salin ang idyomatikong diwa nang hindi ito ginagawang tiyak na kilos lamang ng katawan, at inilalagay sa talababa ang literal na larawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mo” sa halip na “iyong” para sa natural na tuwirang pananalita, habang pinanatili ang Hebreong larawan sa paraang mauunawaan at ipinaliwanag ang literal na anyo sa talababa.
