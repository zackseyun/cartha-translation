id: GEN.4.2
reference: Genesis 4:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תֹּ֣סֶף לָ/לֶ֔דֶת אֶת אָחִ֖י/ו אֶת הָ֑בֶל וַֽ/יְהִי הֶ֨בֶל֙ רֹ֣עֵה צֹ֔אן וְ/קַ֕יִן הָיָ֖ה עֹבֵ֥ד אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/002.yaml
  text: And she gave birth again[a], to his brother Abel. Abel became a shepherd of flocks[c][b], but Cain was a worker of the ground.
translation:
  language: tl
  text: 'At muli siyang nanganak[a]: si Abel, na kapatid ni Cain. Si Abel ay pastol ng kawan[b], samantalang si Cain ay nagbubungkal ng lupa[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpatuloy siyang manganak.” Literal na gumagamit ang Hebreo ng pandiwang “magdagdag” kasama ng pawatas upang ipahayag ang pag-uulit o pagpapatuloy.
    reason: lexical_alternative
  - marker: b
    text: Ang “kawan” ay tumutukoy sa maliliit na alagang hayop, lalo na sa mga tupa at kambing.
    reason: cultural_note
  - marker: c
    text: Maaari ring “tagapagbungkal ng lupa” o “magsasaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף לָלֶדֶת
  choice: muli siyang nanganak
  rationale: Ang יָסַף na sinusundan ng pawatas ay nagpapahayag ng pag-uulit o pagpapatuloy. Likas sa modernong Tagalog ang “muli siyang nanganak” at malinaw nitong ipinahihiwatig ang kasunod na panganganak.
- source_word: אֶת אָחִיו אֶת הָבֶל
  choice: si Abel, na kapatid ni Cain
  rationale: Ipinakikilala ng dobleng panandang layon si Abel bilang kapatid ng naunang binanggit na si Cain. Ginawang tahasan ang pangalang Cain sa halip na gumamit ng malabong panghalip sa Tagalog.
- source_word: וַיְהִי הֶבֶל רֹעֵה צֹאן
  choice: Si Abel ay naging tagapag-alaga ng mga kawan
  rationale: Maaaring magpahiwatig ang וַיְהִי ng naging kalagayan o gawain ni Abel. Saklaw ng צֹאן ang maliliit na alagang hayop, lalo na ang mga tupa at kambing, kaya mas tumpak ang “mga kawan” kaysa “mga tupa” lamang.
- source_word: וְקַיִן הָיָה עֹבֵד אֲדָמָה
  choice: samantalang si Cain ay tagapagsaka ng lupa
  rationale: Ang עבד + אֲדָמָה ay tumutukoy sa paggawa o paglilinang ng lupa. Pinananatili ng “lupa” ang mahalagang ugnayang leksikal sa אֲדָמָה sa mga kalapit na salaysay sa Genesis, at ipinakikita ng “samantalang” ang paghahambing ng dalawang gawain nang hindi naglalagay ng moral na paghuhusga.
theological_decisions:
- issue: Paglalarawan sa mga hanapbuhay ng magkapatid
  choice: Ilarawan lamang ang magkaibang gawain nina Abel at Cain nang walang ipinahihiwatig na moral na kahigitan ng alinman.
  alternative: Gumamit ng pananalitang tila nagpaparangal sa isang gawain kaysa sa isa.
  rationale: Payak na inilalahad ng Hebreo ang kanilang mga gawain; walang moral o teolohikal na paghuhusga sa talatang ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nanganak” at “tagapagsaka” bilang karaniwang salita, habang pinanatili ang “lupa” upang maipakita ang tematikong ugnayan ng אֲדָמָה sa unang bahagi ng Genesis.
