  text: Then Yahweh said to Cain[a], “Where is Abel your brother?” And he said, “I do not know. Am I my brother’s keeper?”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Yahweh kay Cain, “Nasaan ang kapatid mong si Abel?” Sinabi niya, “Hindi ko alam.[a] Ako ba ang tagapagbantay ng kapatid ko?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi ko alam noon.” Maaaring isalin bilang pagtanggi tungkol sa nakaraan ang perfect na pandiwang Hebreo, bagaman sa konteksto ay natural itong pahayag na wala siyang alam sa kasalukuyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi / Sumagot siya
  rationale: Ipinahihiwatig ng unang anyo ang pagsulong ng salaysay; sa ikalawa, natural sa usapan ang “Sumagot siya,” bagaman literal itong “at sinabi niya.”
- source_word: אֵי
  choice: Nasaan
  rationale: Ito ang natural at tuwirang tanong sa Filipino tungkol sa kinaroroonan.
- source_word: הֶבֶל
  choice: Abel
  rationale: Ginamit ang karaniwang anyo ng pangalang pantangi sa Filipino.
- source_word: אָחִיךָ
  choice: kapatid mo
  rationale: Tumutukoy ito sa lalaking kapatid ni Cain; malinaw na si Abel ang tinutukoy kaya hindi kailangang idagdag ang “lalaki.”
- source_word: לֹא יָדַעְתִּי
  choice: Hindi ko alam
  rationale: Bagaman perfect ang pandiwang Hebreo at maaari itong unawaing pagtanggi sa nakaraan, sa konteksto ay natural itong pahayag ng kasalukuyang kawalan umano ng kaalaman.
- source_word: הֲשֹׁמֵר
  choice: tagapagbantay
  rationale: Mula ito sa pandiwang nangangahulugang magbantay, mag-ingat, o magpanatili; ipinapahayag ng “tagapagbantay” ang pananagutang ipinagkakaila ni Cain nang hindi nagdaragdag ng paliwanag.
- source_word: אָחִי
  choice: kapatid ko
  rationale: Pinananatili ang tahasang ugnayang pampamilya na nasa Hebreo.
- source_word: אָנֹכִי
  choice: Ako ba
  rationale: Ang malayang panghalip ay may diin; naipahahayag ito nang natural sa Filipino sa paglalagay ng “Ako” sa unahan ng retorikal na tanong.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal ang himig. Pinanatili ang maikli at mariing palitan ng salita, pati ang retorikal na puwersa ng huling tanong.
