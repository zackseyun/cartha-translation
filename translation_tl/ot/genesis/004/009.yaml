- from: Pagkatapos ay sinabi ni Yahweh kay Cain, “Nasaan si Abel na kapatid mo?” Sumagot siya, “Hindi ko alam.[a] Ako ba ang tagapagbantay ng kapatid ko?”
  to: Pagkatapos ay sinabi ni Yahweh kay Cain, “Nasaan ang kapatid mong si Abel?” Sinabi niya, “Hindi ko alam.[a] Ako ba ang tagapagbantay ng kapatid ko?”
  rationale: Inayos ang ayos ng “Abel, your brother” upang maging likas na Filipino nang hindi binabago ang kahulugan. Pinalitan ang “Sumagot siya” ng “Sinabi niya” upang mas malapit sa payak na pandiwang Hebreo para sa pagsasalita. Nilinaw ang talababa upang ang alternatibong nakaraang pagbasa ay manatiling semantikong katumbas ng pagtanggi ni Cain.
