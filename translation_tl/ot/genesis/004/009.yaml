  naturalness: Natural ang kabuuang rehistro, ngunit ang “si Abel na kapatid mo” ay medyo mabigat sa modernong Filipino. Mas idiomatiko at malinaw ang “ang kapatid mong si Abel.” Ang “Sinabi niya” ay sapat at mas malapit sa וַיֹּאמֶר kaysa “Sumagot siya.”
