  yaml_path: translation/ot/genesis/004/019.yaml
  text: Lamech took for himself two wives[a]. The name of the one was Adah[b], and the name of the other was Zillah.
translation:
  language: tl
  text: Nag-asawa si Lamec ng dalawang babae.[a] Ada ang pangalan ng isa, at Zila ang pangalan ng isa pa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Kumuha si Lamec para sa sarili niya ng dalawang asawa.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang ikalawa.”
    reason: source_literalness
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kumuha
  rationale: Pinananatili ang karaniwang diwa ng לקח na “kumuha”; malinaw naman sa kasunod na “dalawang asawa” na pag-aasawa ang tinutukoy.
- source_word: לוֹ
  choice: para sa sarili niya
  rationale: Ipinahahayag ang personal o reflexive na diwa ng pariralang Hebreo sa natural na modernong Tagalog.
- source_word: שְׁתֵּי נָשִׁים
  choice: dalawang asawa
  rationale: Bagaman maaaring mangahulugang “dalawang babae,” malinaw sa konstruksyon at konteksto na mga asawa ang tinutukoy.
- source_word: שֵׁם הָאַחַת
  choice: Ang pangalan ng isa
  rationale: Malapit sa pormulang Hebreo at likas pa rin sa Tagalog.
- source_word: עָדָה
  choice: Ada
  rationale: Transliterasyon ng pangalang Hebreo ayon sa likas na baybay at bigkas sa Filipino.
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: at ang pangalan ng isa pa
  rationale: Ang literal na “ikalawa” ay likas na naipahahayag bilang “isa pa” kapag dalawa lamang ang tinutukoy; pinananatili sa talababa ang mas literal na alternatibo.
- source_word: צִלָּה
  choice: Zila
  rationale: Transliterasyon ng pangalang Hebreo ayon sa likas na baybay at bigkas sa Filipino.
theological_decisions:
- issue: Kung tahasang ipapakita na dalawa ang asawa ni Lamec
  choice: Isinaling “dalawang asawa” nang walang moral na komentaryo
  alternative: dalawang babae; nag-asawa ng dalawang babae
  rationale: Tahasang nagsasalaysay ang talata ng pagkakaroon ni Lamec ng dalawang asawa ngunit hindi ito nagbibigay rito ng moral na paghuhusga; hindi dapat magdagdag ang salin ng wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang bahagyang pormal na Hebreong ayos sa “Kumuha ... para sa sarili niya,” habang ibinigay sa talababa ang mas natural na idyomatikong salin. Walang idinagdag na moral o denominasyonal na paliwanag.
