base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/001.yaml
  text: And Adam knew Eve his wife[a]; and she conceived and bore Cain, and said[b], “I have acquired a man from Yahweh.”
translation:
  language: tl
  text: At nakipagtalik[a] si Adan sa kanyang asawang si Eva; naglihi siya at nagsilang siya kay Cain.[b] At sinabi niya, “Nagkaroon ako ng isang lalaki mula kay Yahweh.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal sa Hebreo: “nakilala ni Adan si Eva na kanyang asawa.” Ang “nakilala” ay isang eupemismo rito para sa pakikipagtalik.'
    reason: source_idiom
  - marker: b
    text: Ang pangalang Cain ay kahawig sa tunog ng pandiwang Hebreo na nangangahulugang “magkaroon,” “magtamo,” o “makakuha” (qaniti).
    reason: wordplay
  - marker: c
    text: 'Literal sa Hebreo: “Nakamit ko ang isang lalaki kasama si Yahweh.” Maaari rin itong unawain na “mula kay Yahweh” o “sa tulong ni Yahweh”; mas di-malamang ang pagbasa na “Nakamit ko ang isang lalaki—si Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָאָדָם
  choice: At ... si Adan
  rationale: Ang pang-ugnay na וְ ay isinaling “At,” at ang הָאָדָם ay tumutukoy rito sa tiyak na taong si Adan, hindi sa sangkatauhan sa pangkalahatan.
- source_word: יָדַע
  choice: nakipagtalik
  rationale: Literal na “nakilala,” ngunit sa kontekstong ito ay isang Hebreong eupemismo para sa seksuwal na ugnayan. Ang “nakipagtalik” ay malinaw at natural sa makabagong Filipino; pinanatili sa talababa ang literal na idyoma.
- source_word: אֶת חַוָּה אִשְׁתּוֹ
  choice: kay Eva na kanyang asawa
  rationale: Tinutukoy si Eva at nililinaw ang relasyon niya kay Adan, alinsunod sa appositional na pariralang Hebreo.
- source_word: וַתַּהַר
  choice: naglihi si Eva
  rationale: Natural at maikling salin ng pandiwang הרה sa salaysay ng panganganak. Inulit ang pangalan upang maging malinaw ang simuno sa Filipino.
- source_word: וַתֵּלֶד אֶת קַיִן
  choice: at isinilang niya si Cain
  rationale: Tumpak at likas na paglalarawan sa panganganak, habang pinananatili ang maikli at sunod-sunod na daloy ng Hebreo.
- source_word: קַיִן
  choice: Cain
  rationale: Isinalin ang personal na pangalan sa karaniwang transliterasyon. Ang laro ng salita sa קָנִיתִי ay ipinaliwanag sa talababa.
- source_word: קָנִיתִי
  choice: Nagkaroon ako
  rationale: Ipinahahayag ang pagkakamit o pagtatamo nang natural sa Filipino. Ang mas literal na “nakakuha ako” ay maaaring tumunog na tila pinulot o kinuha ang sanggol, samantalang ang “nagkaroon ako” ay angkop sa konteksto ng kapanganakan.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Pinanatili ang karaniwang kahulugang “lalaki” sa halip na gawing “anak na lalaki” o “sanggol,” na magiging mas paliwanag kaysa sa mismong Hebreo.
- source_word: אֶת יְהוָה
  choice: mula kay Yahweh
  rationale: Ang mahirap na pariralang ito ay inuunawa sa pangunahing teksto bilang pagkilala ni Eva na kay Yahweh nagmula ang bata. Inilalahad sa talababa ang mas literal at iba pang posibleng pagbasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapakahulugan sa אֶת יְהוָה sa sinabi ni Eva
  choice: mula kay Yahweh
  alternative: kasama si Yahweh; sa tulong ni Yahweh; isang lalaki—si Yahweh
  rationale: Tunay na hindi tiyak ang gamit ng אֶת sa pariralang ito. Pinili ng pangunahing teksto ang pagbasa na kinikilala si Yahweh bilang pinagmulan ng kapanganakan, ngunit hindi ikinukubli ang ibang mahahalagang posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang “nakipagtalik” sa pangunahing teksto upang maiwasan ang malabong literal na kalkang “nakilala,” habang inilagay ang Hebreong idyoma sa talababa. Pinanatili ang kapansin-pansing “isang lalaki” at ang tunay na kalabuan ng huling parirala.
