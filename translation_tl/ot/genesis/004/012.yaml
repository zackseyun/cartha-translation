base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/012.yaml
  text: When you work the ground[a], it will no longer yield its strength to you[d][c][b]. You will be a wanderer and a fugitive on the earth.
translation:
  language: tl
  text: Kapag nililinang mo ang lupa[a], hindi na nito ibibigay sa iyo ang lakas nito[b]. Ikaw ay magiging palaboy at lagalag[c] sa daigdig[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Sapagkat nililinang mo ang lupa” o “Kung lilinangin mo ang lupa.” Maaaring unawain ang pang-ugnay na Hebreo bilang nagsasaad ng sanhi, panahon, o kondisyon.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi na ito magpapatuloy na ibigay sa iyo ang lakas nito.” Ang “lakas” ay tumutukoy rito sa kakayahan ng lupa na magbunga.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “isang hindi mapalagay na lagalag.” Magkalapit ang kahulugan ng dalawang salitang Hebreo at pinatitingkad ng pagsasama ng mga ito ang kalagayan ni Cain na walang kapanatagan o matatag na tirahan.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “sa lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Ipinakikilala nito ang pangyayaring paulit-ulit na mararanasan ni Cain kapag nililinang niya ang lupa. Pinananatili sa talababa ang posibleng pagbasa bilang sanhi o kondisyon.
- source_word: תַעֲבֹד אֶת־הָאֲדָמָה
  choice: nilinang mo ang lupa
  rationale: Ang עבד kasama ng אֲדָמָה ay tumutukoy sa paggawa o pagsasaka sa lupa. Ang “linangin” ay likas at malinaw sa makabagong Filipino, at hindi kasingkipot ng “bungkalin.”
- source_word: לֹא תֹסֵף תֵּת
  choice: hindi na nito ibibigay
  rationale: Ipinahahayag ng יסף na titigil na ang dating pagbibigay. Pinananatili ng parirala ang larawan ng lupang nagbibigay, sa halip na agad itong gawing “hindi na mamumunga.”
- source_word: כֹּחָהּ
  choice: ang lakas nito
  rationale: Literal itong “lakas nito,” na sa konteksto ay tumutukoy sa kakayahan o sigla ng lupa na magbunga. Pinananatili ang metapora ng Hebreo.
- source_word: נָע וָנָד
  choice: palaboy at lagalag
  rationale: Magkalapit ang kahulugan ng dalawang salitang Hebreo at magkasamang nagpapatindi sa kawalan ni Cain ng matatag na tirahan. Ang pares na Filipino ay natural at hindi nagpapasok ng di-tiyak na diwa ng isang kriminal na tumatakas.
- source_word: בָאָרֶץ
  choice: sa daigdig
  rationale: Maaaring mangahulugan ang אֶרֶץ ng “daigdig” o “lupain.” Sa sinaunang pangkalahatang tagpuan ng Genesis, ipinapakita ng “daigdig” ang malawak na saklaw at naihihiwalay ito sa אֲדָמָה, ang lupang sinasaka.
theological_decisions:
- issue: Saklaw ng hatol kay Cain
  choice: Isang konkretong hatol na kapuwa humahadlang sa kanyang pagsasaka at nag-iiwan sa kanya nang walang matatag na tirahan.
  alternative: Purong panloob na pagkabalisa lamang, o pagpapatapon lamang mula sa isang tiyak na rehiyon.
  rationale: Tahasan sa talata kapuwa ang hindi na pagbibigay ng lakas ng lupa at ang pagiging נָע וָנָד ni Cain. Pinananatili ng salin ang dalawang dimensiyon nang hindi inuugnay sa mga doktrinang wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong larawan ng lupang nagbibigay ng “lakas” at ang magkatugmang paglalarawan sa hindi matatag na kalagayan ni Cain. Ginamit ang “daigdig” sa hulihan upang maipakita ang posibleng mas malawak na kahulugan ng אֶרֶץ at maiwasang pag-isahin ito sa אֲדָמָה, ang lupang nililinang.
