  text: וַ/יֹּ֖אמֶר מֶ֣ה עָשִׂ֑יתָ ק֚וֹל דְּמֵ֣י אָחִ֔י/ךָ צֹעֲקִ֥ים אֵלַ֖/י מִן הָֽ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/010.yaml
  text: And he said[a], “What have you done? The voice of your brother’s blood is crying out to me from the ground.”
translation:
  language: tl
  text: At sinabi niya, “Ano ang ginawa mo? Ang tinig ng dugo[a] ng kapatid mo ay sumisigaw sa akin mula sa lupa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga dugo,” isang anyong maramihan na madalas gamitin kaugnay ng pagdanak ng dugo; karaniwang isinasalin ito sa Filipino bilang “dugo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili nito ang karaniwang pagsulong ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi dinaragdagan ng tiyak na pagkakasunod na gaya ng “Pagkatapos.”
- source_word: מֶה עָשִׂיתָ
  choice: Ano ang ginawa mo?
  rationale: Natural at tuwirang tanong-akusasyon ito sa modernong Filipino at pinananatili ang moral na bigat ng natapos na ginawa.
- source_word: קוֹל דְּמֵי אָחִיךָ
  choice: Ang dugo ng kapatid mo
  rationale: Sa Filipino, ang “sumisigaw” ay sapat nang naghahayag na may tinig ang dugo; ang literal na “ang tinig ng dugo” ay posible ngunit mas mabigat at hindi gaanong natural. Nananatili ang personipikasyon.
- source_word: דְּמֵי
  choice: dugo
  rationale: Bagaman maramihan ang anyong Hebreo (“mga dugo”), idiomatiko ito sa konteksto ng pagdanak ng dugo. Ang pangngalang pambalana na “dugo” ang natural na katumbas sa Filipino; ipinaliliwanag ang anyong maramihan sa talababa.
- source_word: אָחִיךָ
  choice: ng kapatid mo
  rationale: Natural na ipinapahayag sa Filipino ang ugnayang construct sa pamamagitan ng pariralang paari.
- source_word: צֹעֲקִים
  choice: ay sumisigaw
  rationale: Pinananatili ang masidhing personipikasyon at ang nagpapatuloy na pagdaing. Isahan ang anyo upang umayon sa natural na Filipino na “dugo.”
- source_word: אֵלַי
  choice: sa akin
  rationale: Tuwirang ipinahahayag na sa Diyos nakatuon ang sigaw.
- source_word: מִן הָאֲדָמָה
  choice: mula sa lupa
  rationale: Ang “lupa” ay natural at umaangkop sa paulit-ulit na imahen ng adamah bilang lupang sinasaka sa salaysay tungkol kay Cain.
theological_decisions:
- issue: Personipikasyon ng dugong ibinuhos ng kapatid ni Cain
  choice: Pinanatili na ang dugo mismo ay sumisigaw sa Diyos.
  alternative: Isalin nang abstrakto bilang pagdanak ng dugo o pananagutan sa dugo na humihingi ng katarungan.
  rationale: Matingkad na personipikasyon ang nasa Hebreo. Ang pagpapanatili rito ay nag-iingat sa moral at teolohikal na puwersa ng teksto nang hindi nililimitahan ang larawan sa isang partikular na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kapatid mo” sa halip na mas pormal na “iyong kapatid,” at pinanatili ang matingkad na larawan ng dugong sumisigaw.
