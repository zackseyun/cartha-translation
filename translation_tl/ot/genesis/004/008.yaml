  source_fidelity: Tapat ang pangunahing tekstong pinili sa mas maikling pagbasa ng WLC/MT at wastong inilalagay sa talababa ang mas mahabang sinaunang pagbasa. Gayunman, ang “Pagkatapos” ay nagpapahiwatig ng sunod na pangyayaring hindi tahasang nasa וַיְהִי בִּהְיוֹתָם; mas tumpak ang simpleng temporal na “Nang.”
  naturalness: Ang “Abel na kanyang kapatid” ay alanganin at maaaring basahing restriktibo; mas malinaw at natural ang appositive na “Abel, na kapatid niya.” Ang biglang pagtatapos ng unang pangungusap ay sinasadya, sapagkat pinananatili nito ang lacuna ng MT.
  terminology: Ang “bukid,” “sinalakay,” at “pinatay siya” ay angkop sa modernong Filipino Tagalog at sapat na tumutugon sa Hebreo. Pinananatili ang pag-uulit ng “kapatid” bilang makabuluhang diin ng salaysay.
  issues:
