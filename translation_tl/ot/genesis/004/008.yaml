base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/008.yaml
  text: And Cain said to Abel his brother. Then[a], while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: tl
  text: At sinabi ni Cain kay Abel, na kapatid niya.[a] Nang nasa bukid sila, sinalakay ni Cain si Abel, na kapatid niya, at pinatay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ganito lamang ang mababasa sa Hebreong Tekstong Masoretiko: “At sinabi ni Cain kay Abel, na kapatid niya,” ngunit hindi nito ibinibigay ang sinabi ni Cain. Mababasa sa ilang sinaunang saksi, kabilang ang Septuagint, Pentateukong Samaritano, at Vulgata: “Lumabas tayo patungo sa bukid.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi ni Cain
  rationale: Karaniwang nangangahulugang “sabihin” ang אמר. Pinananatili ng salin ang di-kumpletong pahayag ng Tekstong Masoretiko sa halip na magdagdag sa pangunahing teksto ng mga salitang wala sa ibinigay na Hebreo.
- source_word: אֶל
  choice: kay
  rationale: Ipinahihiwatig ng pang-ukol ang patutunguhan ng pagsasalita; likas sa Tagalog ang “sinabi ... kay Abel.”
- source_word: אָחִיו
  choice: na kanyang kapatid
  rationale: Pinananatili ang dalawang ulit na pagtukoy kay Abel bilang kapatid ni Cain upang maingatan ang diin ng salaysay sa pagpatay sa sariling kapatid.
- source_word: וַיְהִי בִּהְיוֹתָם
  choice: Pagkatapos, habang ... sila
  rationale: Likas na panandang pasalaysay at temporal ito sa modernong Tagalog, habang pinananatili ang diwa ng pangyayaring naganap nang naroon sila.
- source_word: בַּשָּׂדֶה
  choice: nasa bukid
  rationale: Ang שָׂדֶה ay bukid o lantad na lupain; “bukid” ang tuwiran at karaniwang katumbas sa kontekstong ito.
- source_word: וַיָּקָם ... אֶל
  choice: sinalakay
  rationale: Idyoma itong naglalarawan ng pagbangon laban sa isang tao. Mas natural sa kasalukuyang Tagalog ang “sinalakay” kaysa sa literal ngunit alanganing “tumindig laban,” at malinaw nitong naihahayag ang pagalit na pagkilos.
- source_word: וַיַּהַרְגֵהוּ
  choice: pinatay siya
  rationale: Tuwirang nangangahulugang pumatay ang הרג. Hindi ginamit ang mas legal o moral na tiyak na “pinaslang” upang hindi dagdagan ang leksikal na kahulugan.
theological_decisions:
- issue: Kung isasama ang mga salita ni Cain na wala sa Tekstong Masoretiko
  choice: Panatilihin sa pangunahing teksto ang maikling anyo ng Tekstong Masoretiko at ilahad sa talababa ang mas mahabang pagbasa.
  alternative: Isama sa pangunahing teksto ang “Pumunta tayo sa bukid,” gaya ng sinusuportahan ng Septuagint, Pentateukong Samaritano, at Vulgata.
  rationale: Ang ibinigay na WLC ay walang nilalaman pagkatapos ng “sinabi ni Cain kay Abel.” Bagaman abrupto ang pagbasa at may malawak na sinaunang suporta ang mas mahabang anyo, mas tapat sa ibinigay na pangunahing Hebreong teksto na huwag itong tahimik na idagdag. Inilalahad ng talababa ang tunay na tekstuwal na pagkakaiba nang hindi nagpapasya nang lampas sa ebidensiya.
translation_notes:
  register: Modernong Filipino na may marangal at payak na himig. Pinanatili ang paulit-ulit na “kanyang kapatid” dahil mahalaga ito sa retorika ng Hebreo. Ginamit ang “sinalakay” bilang natural na katumbas ng Hebreong idyomang “tumindig laban.”
