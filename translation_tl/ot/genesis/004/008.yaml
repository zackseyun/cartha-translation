- from: At sinabi ni Cain kay Abel na kanyang kapatid. Pagkatapos[a], habang nasa bukid sila, sinalakay ni Cain si Abel na kanyang kapatid at pinatay siya.
  to: At sinabi ni Cain kay Abel, na kapatid niya.[a] Nang nasa bukid sila, sinalakay ni Cain si Abel, na kapatid niya, at pinatay siya.
  rationale: Inayos ang temporal na pang-ugnay upang sundin ang temporal na saklaw ng Hebreo, at pinasimple ang appositive na pagtukoy sa kapatid para sa likas at malinaw na Tagalog. Pinanatili sa pangunahing teksto ang mas maikling MT/WLC, kabilang ang biglang putol na pahayag ni Cain, habang malinaw na iniaatas ng talababa ang suportadong mas mahabang pagbasa nang hindi ito ipinapasok sa teksto.
