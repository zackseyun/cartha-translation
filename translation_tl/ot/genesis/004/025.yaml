  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּ֨דַע אָדָ֥ם עוֹד֙ אֶת אִשְׁתּ֔/וֹ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁ֑ת כִּ֣י שָֽׁת לִ֤/י אֱלֹהִים֙ זֶ֣רַע אַחֵ֔ר תַּ֣חַת הֶ֔בֶל כִּ֥י הֲרָג֖/וֹ קָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/025.yaml
  text: And Adam knew his wife again[a], and she bore a son and called his name Seth, for she said, “God has appointed for me another offspring in place of Abel, because Cain killed him.”
translation:
  language: tl
  text: Muling sumiping si Adan sa kanyang asawa, at ang kanyang asawa ay nagsilang ng isang anak na lalaki. Pinangalanan niya itong Set,[a] sapagkat sinabi niya, “Itinakda ng Diyos para sa akin ang isa pang supling bilang kapalit ni Abel, dahil pinatay siya ni Cain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'May larong-salita sa Hebreo: ang pangalang Set ay kaugnay ng pandiwang isinaling “itinakda,” na maaari ring mangahulugang “inilagay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: sumiping
  rationale: Ang יָדַע kapag tumutukoy sa mag-asawa ay isang nakaugaliang eupemismo para sa pakikipagtalik. Ang “sumiping” ay likas, mahinahon, at marangal sa modernong Tagalog, samantalang ang literal na “nakilala” ay hindi malinaw sa ganitong diwa.
- source_word: אָדָם
  choice: Adan
  rationale: Pangngalang pantangi ang gamit dito; “Adan” ang nakaugaliang anyo sa Tagalog.
- source_word: עוֹד
  choice: muling
  rationale: Ipinahihiwatig nito ang pag-uulit ng pagsiping; natural itong ilagay bago ang pandiwa sa Tagalog.
- source_word: וַתֵּלֶד בֵּן
  choice: nagsilang ito ng isang anak na lalaki
  rationale: Tuwirang ipinapahayag ang panganganak at ang kasarian ng anak. Ang “ito” ay malinaw na tumutukoy sa asawa ni Adan nang hindi nagdaragdag ng pangalan na wala sa talata.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: pinangalanan niya itong
  rationale: Ang literal na idyomang Hebreo ay “tinawag ang pangalan niya,” ngunit “pinangalanan niya itong” ang natural at eksaktong pormula sa modernong Tagalog.
- source_word: שֵׁת
  choice: Set
  rationale: Ito ang nakaugaliang transliterasyon ng pangalang Seth sa Tagalog.
- source_word: שָׁת
  choice: itinakda
  rationale: Ang pandiwang שִׁית ay nangangahulugang maglagay o magtakda. Pinananatili ng “itinakda” ang diwa ng sinadyang paglalaan ng Diyos at bahagyang naiparirinig ang larong-salita sa pangalang Set.
- source_word: זֶרַע
  choice: supling
  rationale: Sa kontekstong ito, ang זֶרַע ay tumutukoy sa anak o salinlahi. Ang “supling” ay natural at marangal at hindi kasing-literal o malabo ng “binhi.”
- source_word: אַחֵר
  choice: isa pang
  rationale: Likas na katumbas sa Tagalog na nagpapahayag ng karagdagang supling.
- source_word: תַּחַת
  choice: bilang kapalit ni
  rationale: Dito ay nagpapahayag ang תַּחַת ng pagpapalit, hindi ng lokasyong “sa ilalim.”
- source_word: הֶבֶל
  choice: Abel
  rationale: Nakaugaliang anyo ng pangalang pantangi sa Tagalog.
- source_word: הֲרָגוֹ
  choice: pinatay siya
  rationale: Karaniwang pandiwa sa pagpatay ang הרג. Hindi ginawang mas tiyak na “pinaslang” o “minurder” sapagkat hindi ganoon katiyak ang mismong salitang Hebreo.
- source_word: קָיִן
  choice: Cain
  rationale: Nakaugaliang anyo ng pangalang pantangi sa Tagalog.
theological_decisions:
- issue: Paliwanag sa pangalan ni Set at ang pagkilos ng Diyos
  choice: Itinakda ng Diyos para sa akin ang isa pang supling
  alternative: Binigyan ako ng Diyos ng isa pang anak
  rationale: Pinananatili ng “itinakda” ang kahulugan ng pandiwang שָׁת at ang larong-salita nito sa שֵׁת. Hindi nito ipinapalagay nang higit sa teksto kung paano isinagawa ng Diyos ang paglalaan.
- issue: Pagpapahayag sa eupemismo tungkol sa pagtatalik
  choice: Muling sumiping si Adan sa kanyang asawa
  alternative: Muling nakilala ni Adan ang kanyang asawa
  rationale: Ang “sumiping” ay nagpapanatili ng mahinahon at pampanitikang tono ng eupemismong Hebreo, habang malinaw sa karaniwang mambabasang Tagalog. Ang literal na “nakilala” ay madaling maunawaan sa maling diwa.
- issue: Diwa ng pagpapalit kay Abel
  choice: bilang kapalit ni Abel
  alternative: sa halip ni Abel
  rationale: Malinaw na ipinahahayag ang substitusyong taglay ng תַּחַת nang hindi sinasabing si Set ay katumbas ni Abel sa lahat ng bagay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sumiping” bilang mahinahong eupemismo, “supling” para sa pampamilyang diwa ng זֶרַע, at ang mga nakaugaliang pangalang Adan, Set, Abel, at Cain. Inilipat ang talababa sa pangalang Set, kung saan malinaw na kaugnay ang paliwanag tungkol sa larong-salita.
