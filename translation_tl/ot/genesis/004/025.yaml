  terminology: Ang mga pangalang Adan, Set, Abel, at Cain ay magkakatugma sa nakaugaliang paggamit. Ang “supling,” “sumiping,” at “itinakda” ay naaangkop sa marangal na rehistro. Inayos ang talababa upang ipaliwanag ang larong-salita bilang ugnayan ng pangalan at pandiwang Hebreo, sa halip na magmungkahi ng pagkakatulad ng tunog sa saling Tagalog.
