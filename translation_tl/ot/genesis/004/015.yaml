  terminology: Ang “Yahweh” ay kaayon ng itinakdang pangalan. Ang “tanda” ay mahusay na salin ng אוֹת sapagkat hindi nito ipinagpapalagay na pisikal ang anyo nito; ang talababa na “marka” ay angkop na alternatibo. Ang “saktan” ay tumpak na hindi nagpapakitid sa הַכּוֹת tungo lamang sa pagpatay.
