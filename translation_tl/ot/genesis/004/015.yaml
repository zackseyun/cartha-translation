  source_fidelity: 'Tumpak ang pangunahing diwa: ang sinumang papatay kay Cain ang sasailalim sa makapitong paghihiganti, at naglagay si Yahweh ng isang tanda kay Cain upang hindi siya saktan ng makatatagpo sa kanya. Gayunman, hindi naisama sa salin ang panimulang pangatnig na וַ, na naghuhudyat ng pagpapatuloy ng salaysay ("Pagkatapos"/"At").'
