- from: Sinabi sa kanya ni Yahweh, “Kaya, ang sinumang pumatay kay Cain ay paghihigantihan nang makapitong ulit.” At nilagyan ni Yahweh si Cain ng isang tanda[a] upang hindi siya saktan ng sinumang makatagpo sa kanya.
  to: Pagkatapos, sinabi ni Yahweh sa kanya, “Kaya ang sinumang pumatay kay Cain ay paghihigantihan nang pitong ulit.” At nilagyan ni Yahweh si Cain ng isang tanda[a] upang hindi siya saktan ng sinumang makatagpo sa kanya.
  rationale: Idinagdag ang panandang pagpapatuloy ng salaysay at pinakinis ang Filipino nang hindi binabago ang kahulugan. Nanatiling hindi tinutukoy ang anyo ng tanda at hindi ipinangalan ang tagapaghiganti, samantalang malinaw pa ring ang papatay kay Cain ang tatanggap ng paghihiganti.
