  text: וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה לָ/כֵן֙ כָּל הֹרֵ֣ג קַ֔יִן שִׁבְעָתַ֖יִם יֻקָּ֑ם וַ/יָּ֨שֶׂם יְהוָ֤ה לְ/קַ֨יִן֙ א֔וֹת לְ/בִלְתִּ֥י הַכּוֹת אֹת֖/וֹ כָּל מֹצְאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/015.yaml
  text: Then Yahweh said to him[a], “Therefore whoever kills Cain, vengeance will be taken on him sevenfold.” And Yahweh put a mark on Cain[b], lest anyone finding him should strike him.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh sa kanya, “Kaya ang sinumang pumatay kay Cain ay paghihigantihan nang pitong ulit.” At nilagyan ni Yahweh si Cain ng isang tanda[a] upang hindi siya saktan ng sinumang makatagpo sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “marka.” Hindi sinasabi ng tekstong Hebreo kung ano ang anyo ng tandang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos ayon sa anyong karaniwang ginagamit sa makabagong saling Filipino.
- source_word: לָכֵן
  choice: Kaya
  rationale: Likas at malinaw na ipinahahayag sa Filipino ang bunga o tugon sa sinabi ni Cain.
- source_word: כָּל הֹרֵג קַיִן
  choice: ang sinumang pumatay kay Cain
  rationale: Ipinananatili ang pangkalahatan at di-tiyak na saklaw ng konstruksiyong Hebreo.
- source_word: שִׁבְעָתַיִם יֻקָּם
  choice: ay paghihigantihan nang makapitong ulit
  rationale: Pinananatili ang pasibong anyo at ang pitong-ulit na antas ng paghihiganti; sa konteksto, ang papatay kay Cain ang tatanggap nito.
- source_word: אוֹת
  choice: tanda
  rationale: Malawak ang saklaw ng salitang Hebreo at hindi tinutukoy ng teksto kung pisikal na marka o ibang uri ng palatandaan ito.
- source_word: לְבִלְתִּי הַכּוֹת אֹתוֹ כָּל מֹצְאוֹ
  choice: upang hindi siya saktan ng sinumang makatagpo sa kanya
  rationale: Natural na pinagsasama sa Filipino ang negatibong layunin at ang di-tiyak na gumagawa; ang 'saktan' ay hindi nagpapakitid sa pandiwa tungo lamang sa pagpatay.
theological_decisions:
- issue: Anyo at kalikasan ng tanda kay Cain
  choice: tanda
  alternative: marka
  rationale: Hindi inilalarawan ng Hebreo ang anyo ng אוֹת; iniiwasan ng 'tanda' ang pagdaragdag na tiyak itong pisikal na marka.
- issue: Tatanggap ng makapitong paghihiganti
  choice: Ang sinumang pumatay kay Cain ang paghihigantihan
  alternative: Si Cain ay ipaghihiganti nang makapitong ulit
  rationale: Ang pasibong Hebreo ay maikli at maaaring magmukhang malabo, ngunit malinaw sa babala ng konteksto na ang papatay kay Cain ang sasailalim sa paghihiganti.
- issue: Saklaw ng ipinagbabawal na pananakit
  choice: saktan
  alternative: patayin
  rationale: Mas tuwirang sinasalamin ng 'saktan' ang הַכּוֹת at hindi nililimitahan ang proteksiyon sa nakamamatay na pag-atake lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Yahweh” para sa banal na pangalan at iniwasan ang mga salitang masyadong arkaiko. Ang “makatagpo sa kanya” ay natural na katumbas ng participial na pahayag sa Hebreo.
