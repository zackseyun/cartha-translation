  to: 'Nang pinagpagala-gala ako ng Diyos mula sa sambahayan ng aking ama[a], sinabi ko sa kanya, “Ito ang kagandahang-loob na ipapakita mo sa akin[b]: sa bawat lugar na mararating natin, sabihin mo tungkol sa akin, ‘Kapatid ko siya.’”'
