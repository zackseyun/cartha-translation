base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/013.yaml
  text: 'And when God caused me to wander from my father’s house[a], I said to her, ‘This is the kindness you must show me: at every place we come to, say of me[b], “He is my brother.”’'
translation:
  language: tl
  text: 'Nang pinagpagala-gala ako ng Diyos mula sa sambahayan ng aking ama[a], sinabi ko sa kanya, “Ito ang kagandahang-loob na ipapakita mo sa akin[b]: sa bawat lugar na mararating natin, sabihin mo tungkol sa akin, ‘Kapatid ko siya.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Nang ginawa akong lagalag ng Diyos mula sa sambahayan ng aking ama.” Causative ang pandiwang Hebreo at maaaring tumukoy sa pagpapagala o pagpapaligaw; dito, hindi nito kinakailangang ipahiwatig ang moral na pagkaligaw. Maramihan ang anyo ng pandiwa, kaya posible ring basahin nang literal na “Nang pinagpagala-gala ako ng mga diyos,” bagaman “Diyos” ang higit na angkop sa konteksto.'
    reason: lexical_and_grammatical_alternative
  - marker: b
    text: Ang salitang Hebreo na ḥesed ay maaari ring mangahulugang tapat na pag-ibig o matapat na kabaitan, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוּ
  choice: papaglakbayin ako
  rationale: Pinananatili nito ang tahasang causative na diwa ng Hiphil, ngunit hindi ipinahihiwatig na moral na naligaw o nagkasala si Abraham. Ang kasunod na pariralang “mula sa sambahayan” ay naglilinaw na pag-alis at hindi palagiang paninirahan ang tinutukoy.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Sa konteksto ng salaysay, ang tinutukoy ay ang Diyos ni Abraham. Gayunman, dahil kapansin-pansing maramihan ang anyo ng pandiwa, inilalahad sa talababa ang literal na posibleng pagbasa na “mga diyos.”
- source_word: מִבֵּית אָבִי
  choice: mula sa sambahayan ng aking ama
  rationale: Ang בֵּית אָב ay hindi lamang gusali kundi tahanan at pangkat-pamilya sa ilalim ng ama. Mas malinaw dito ang “sambahayan” kaysa sa literal na “bahay.”
- source_word: חַסְדֵּךְ
  choice: kagandahang-loob
  rationale: Sa interpersonal na kahilingang ito, natural na ipinahahayag ng “kagandahang-loob” ang חסד bilang kabutihan o tapat na pakikitungo, nang hindi ipinapasok ang mas teknikal na wikang pangtipan.
- source_word: תַּעֲשִׂי עִמָּדִי
  choice: mo ako pakikitaan
  rationale: Ang literal na “gagawin mo sa akin” ay hindi natural kasama ng “kagandahang-loob.” Ang “pakikitaan” ay karaniwang Filipino para sa pagpapakita ng kabutihan sa isang tao.
- source_word: אֶל כָּל הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה
  choice: sa bawat lugar na mararating natin
  rationale: Pinananatili nito ang distributibong “bawat lugar” at ang diwa ng pagdating sa mga lugar, sa natural na ayos ng Filipino.
- source_word: אִמְרִי לִי
  choice: sabihin mo tungkol sa akin
  rationale: Bagaman literal na “sabihin mo sa/para sa akin,” malinaw sa konteksto na magsasalita si Sara sa iba tungkol kay Abraham.
- source_word: אָחִי הוּא
  choice: Kapatid ko siya
  rationale: Pinananatili ang tuwirang pahayag at ang tiyak na relasyong “kapatid,” na mahalaga sa salaysay.
theological_decisions:
- issue: Ang gumaganap sa pagpapalagakbay kay Abraham
  choice: 'Ang Diyos ang tahasang gumaganap: “papaglakbayin ako ng Diyos.”'
  alternative: “Pinahintulutan ako ng Diyos na maglakbay” o “papaglakbayin ako ng mga diyos.”
  rationale: Hindi pinalalambot ng salin ang causative na pahayag tungo sa pahintulot lamang. Pinipili sa pangunahing teksto ang isahang “Diyos” ayon sa mas malawak na konteksto, ngunit hindi itinatago sa talababa ang di-karaniwang maramihang pandiwa at ang posibleng pagbasa nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sambahayan” upang maipakita ang panlipunan at pampamilyang diwa ng “bahay ng ama,” at iniwasan ang “maligaw” sa pangunahing teksto dahil maaari itong magpahiwatig ng moral na pagkakamali. Inilagay ang marker [b] kaagad pagkatapos ng “kagandahang-loob,” na siyang salitang ipinaliliwanag ng talababa.
