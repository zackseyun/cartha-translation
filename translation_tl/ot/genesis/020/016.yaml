base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/016.yaml
  text: And to Sarah he said[a], “Look, I have given a thousand pieces of silver to your brother. Look, it is for you a covering of the eyes to all who are with you[b], and before everyone you are vindicated.”
translation:
  language: tl
  text: At sinabi niya kay Sara, “Tingnan mo, nagbigay ako sa kapatid mo ng isang libong piraso ng pilak. Para sa iyo, ito ay pantakip sa mga mata para sa lahat ng kasama mo[a]; at sa harap ng lahat, napawalang-sala ka[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pantakip sa mga mata” ay isang mahirap na parirala. Maaaring tumukoy ito sa hayagang kabayarang tumutugon sa kahihiyan ng pangyayari at nagpapanumbalik sa dangal ni Sara.
    reason: lexical_alternative
  - marker: b
    text: O “nalinis ang pangalan mo,” “nasaway ka,” o “nalutas na ang usapin sa harap ng lahat.” Mahirap unawain ang huling sugnay sa Hebreo at naisalin ito sa iba’t ibang paraan.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶלֶף כֶּסֶף
  choice: isang libong piraso ng pilak
  rationale: Literal na ‘isang libong pilak.’ Hindi tinutukoy sa Hebreo kung mga siklo o barya ang mga ito, kaya pinananatili ng ‘piraso ng pilak’ ang di-tiyak na anyo ng bayad.
- source_word: לְאָחִיךְ
  choice: sa kapatid mo
  rationale: Tahasang ‘kapatid’ ang Hebreo. Pinananatili ito upang maipakita ang kaugnayan sa pagpapakilala ni Sara kay Abraham at ang kabalintunaan sa salaysay.
- source_word: כְּסוּת עֵינַיִם
  choice: pantakip sa mga mata
  rationale: Mahirap at matalinghagang parirala ito. Pinananatili sa pangunahing teksto ang larawan sa halip na limitahan ito sa iisang paliwanag gaya ng ‘kabayaran’ o ‘pagpapanumbalik ng dangal.’
- source_word: לְכֹל אֲשֶׁר אִתָּךְ
  choice: sa harap ng lahat ng kasama mo
  rationale: Ipinahahayag nito ang hayagan at panlipunang saklaw ng ginawa; natural sa Tagalog ang ‘sa harap ng’ para sa ganitong pampublikong diwa.
- source_word: וְאֵת כֹּל
  choice: at sa harap ng lahat
  rationale: Pinaikli at mahirap ang sintaks ng Hebreo. Ang salin ay nagpapalawak sa pampublikong saklaw mula sa mga kasama ni Sara tungo sa lahat, nang hindi pinabibigat ang pangungusap.
- source_word: וְנֹכָחַת
  choice: napawalang-sala ka
  rationale: Ang Niphal ng יכח ay maaaring mangahulugang naipakitang tama o nalinis sa paratang. Ang ‘napawalang-sala’ ay natural at akma sa pampublikong pagpapanumbalik ng dangal ni Sara, habang inilalahad sa talababa ang kahirapan ng parirala.
theological_decisions:
- issue: Kung ang huling pandiwa ay pagpapawalang-sala o pagsaway
  choice: napawalang-sala ka
  alternative: nasaway ka; nalutas na ang usapin
  rationale: Sa konteksto, hayagang nagbibigay si Abimelec ng kabayaran at kinikilalang walang sala si Sara. Gayunman, tunay na mahirap ang anyo at maaaring unawain sa ibang paraan, kaya hindi ikinukubli ang mga alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang pag-uulit ng panawagang ‘Tingnan mo’ sa diwa ng הִנֵּה, ang tahasang ‘kapatid,’ at ang malabong talinghagang ‘pantakip sa mga mata.’
