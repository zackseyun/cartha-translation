id: GEN.20.4
reference: Genesis 20:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/אֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑י/הָ וַ/יֹּאמַ֕ר אֲדֹנָ֕/י הֲ/ג֥וֹי גַּם צַדִּ֖יק תַּהֲרֹֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/004.yaml
  text: Abimelech had not come near her[a], so he said, “Lord[b], will you kill even a righteous nation?”
translation:
  language: tl
  text: Hindi pa nakipagtalik si Abimelec sa kanya,[a] kaya sinabi niya, “Panginoon, papatayin mo ba kahit ang isang matuwid na bayan?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “lumapit sa kanya.” Isa itong Hebreong idyoma na tumutukoy rito sa pakikipagtalik.'
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “sambayanan” o “bansa.” Ang Hebreong salita ay kolektibong tumutukoy sa isang pangkat ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַב אֵלֶיהָ
  choice: hindi pa nakipagtalik ... sa kanya
  rationale: Ang literal na ‘lumapit sa kanya’ ay isang Hebreong idyoma na tumutukoy rito sa pakikipagtalik. Ginawang malinaw sa likas at makabagong Tagalog ang ipinahihiwatig ng konteksto, habang itinala sa talababa ang literal na larawan.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ito ang likas at marangal na pagtawag ni Abimelec sa Diyos sa panaginip, nang walang idinagdag na salitang wala sa Hebreo.
- source_word: גּוֹי
  choice: bayan
  rationale: Ang salita ay kolektibong tumutukoy sa isang sambayanan o bansa. Ang ‘bayan’ ay natural sa Tagalog at naiiwang bukas ang tiyak na lawak ng pangkat na tinutukoy.
- source_word: גַּם
  choice: kahit
  rationale: Sa retorikal na tanong, ipinahahayag ng ‘kahit’ ang mariing diwa ng Hebreong גַּם.
- source_word: צַדִּיק
  choice: matuwid
  rationale: Pinananatili nito ang karaniwang biblikal na kahulugan ng pagiging matuwid, habang maaari ring magpahiwatig ng kawalang-sala sa usaping ito.
- source_word: תַּהֲרֹג
  choice: papatayin mo ba
  rationale: Direkta at natural nitong isinasalin ang imperfect na nasa anyong retorikal na tanong.
- source_word: וַאֲבִימֶלֶךְ ... וַיֹּאמַר
  choice: Hindi pa ... kaya sinabi niya
  rationale: Ipinakikita ng ‘kaya’ ang ugnayan ng hindi pa pakikipagtalik ni Abimelec at ng sumunod niyang pakiusap, nang hindi nagdaragdag ng tahasang panandang panahong wala sa Hebreo.
theological_decisions:
- issue: Saklaw ng kolektibong גּוֹי sa pakiusap ni Abimelec
  choice: bayan
  alternative: sambayanan; bansa; sambahayan
  rationale: Pinananatili ng ‘bayan’ ang kolektibong saklaw at hindi ito pinakikitid kay Abimelec lamang o sa sambahayan niya, ni tiyak na ginagawang isang makabagong estadong politikal.
- issue: Diwa ng צַדִּיק
  choice: matuwid
  alternative: walang-sala
  rationale: Pinananatili ng ‘matuwid’ ang mas malawak na teolohikal at leksikal na diwa, nang hindi lubusang nilulutas kung ang diin ay pangkalahatang katuwiran o kawalang-sala sa partikular na kasong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘nakipagtalik’ bilang tuwiran ngunit hindi bulgar na pagpapahayag; ‘Panginoon’ para sa banal na titulo; at ‘bayan’ upang mapanatili ang kolektibong diwa nang hindi sobra ang pagpapakahulugan.
