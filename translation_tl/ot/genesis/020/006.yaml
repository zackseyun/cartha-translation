  to: Sinabi ng Diyos sa kanya sa panaginip[a], “Oo, alam kong ginawa mo ito dahil tapat ang iyong kalooban. Ako rin ang pumigil sa iyo na magkasala laban sa akin. Kaya hindi kita hinayaang galawin siya.[b]”
