base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/006.yaml
  text: Then God said to him in the dream[a], “Yes, I know that you did this in the integrity of your heart, and I also kept you from sinning against me[b]. Therefore I did not let you touch her.”
translation:
  language: tl
  text: Sinabi ng Diyos sa kanya sa panaginip[a], “Oo, alam kong ginawa mo ito dahil tapat ang iyong kalooban. Ako rin ang pumigil sa iyo na magkasala laban sa akin. Kaya hindi kita hinayaang galawin siya.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa isang panaginip.” Maaaring unawain ang Hebreo bilang di-tiyak, bagaman pinapaboran ng pantukoy at ng konteksto ang partikular na panaginip na ito.
    reason: lexical_alternative
  - marker: b
    text: Ang “galawin siya” ay isang maingat na pahayag na tumutukoy rito sa ugnayang seksuwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלֹום
  choice: sa panaginip
  rationale: Ang anyong may pantukoy sa Hebreo ay tumutukoy sa panaginip na nagpapatuloy sa tagpong ito. Sa natural na Tagalog, sapat ang “sa panaginip” upang tukuyin ang nasabing panaginip nang hindi kailangang idagdag ang “na iyon.”
- source_word: גַּם אָנֹכִי
  choice: Oo, alam ko / Ako rin
  rationale: Sa unang paglitaw, ang parirala ay mariing nagpapatibay sa sinabi ni Abimelec; kaya natural ang “Oo, alam ko.” Sa ikalawa, pinananatili ng “Ako rin” ang pag-uulit at diin sa pagkilos ng Diyos.
- source_word: בְתָם לְבָבְךָ
  choice: nang may katapatan sa puso
  rationale: Ang תֹּם ay nagsasaad ng integridad, pagiging buo, o matuwid na layunin. Ang “katapatan sa puso” ay nagpapanatili sa moral na diwa nang hindi pinalalabis ito bilang ganap na kawalang-sala.
- source_word: וָאֶחְשֹׂךְ ... אוֹתְךָ
  choice: pumigil sa iyo
  rationale: Ang חָשַׂךְ sa pangungusap na ito ay nangangahulugang pigilan o ilayo ang isang tao sa isang gagawin.
- source_word: מֵחֲטוֹא לִי
  choice: na magkasala laban sa akin
  rationale: Ipinahihiwatig ng מִן ang pagpigil sa isang kilos, at tinutukoy ng לִי ang Diyos bilang siyang pagkakasalahan.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Natural na ipinahahayag ng “Kaya” ang bunga ng pagpigil ng Diyos na binanggit sa naunang pangungusap.
- source_word: לֹא נְתַתִּיךָ
  choice: hindi kita hinayaang
  rationale: Ang נָתַן na sinusundan ng pawatas ay idyomatikong nangangahulugang pahintulutan o hayaan.
- source_word: לִנְגֹּעַ אֵלֶיהָ
  choice: galawin siya
  rationale: Pinananatili ng “galawin siya” ang maingat at di-tahasang pananalita ng Hebreo tungkol sa seksuwal na pakikipag-ugnayan.
theological_decisions:
- issue: Ang kahulugan ng “magkasala laban sa akin” sa sinabi ng Diyos
  choice: Inilalarawan ang balak na pagkakasala bilang kasalanan laban sa Diyos.
  alternative: Unawain lamang ito bilang pangkalahatang pagkakasala o pagkakaroon ng pananagutan sa harap ng Diyos.
  rationale: Tinutukoy ng Hebreong לִי ang Diyos bilang siyang pagkakasalahan. Pinananatili nito ang tahasang moral at teolohikal na bigat ng orihinal nang walang idinaragdag na paliwanag na lampas sa teksto.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang pagpipigil ng pananalita sa huling sugnay at ang pagdiin ng dalawang paglitaw ng גַּם אָנֹכִי nang hindi nagiging asiwa ang Tagalog.
