  to: Pagkatapos, kumuha si Abimelec ng mga tupa[a] at mga baka, pati mga aliping lalaki at babae, at ibinigay niya ang mga ito kay Abraham. At ibinalik niya kay Abraham si Sara, na asawa ni Abraham.[b]
