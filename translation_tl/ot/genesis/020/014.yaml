base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/014.yaml
  text: Then Abimelech took sheep and cattle[a], and male servants and female servants, and gave them to Abraham[c][b]; and he returned Sarah his wife to him.
translation:
  language: tl
  text: Pagkatapos, kumuha si Abimelec ng mga tupa[a] at mga baka, pati mga aliping lalaki at babae, at ibinigay niya ang mga ito kay Abraham. At ibinalik niya kay Abraham si Sara, na asawa ni Abraham.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kawan.” Ang Hebreong צֹאן ay maaaring tumukoy nang mas malawak sa maliliit na alagang hayop, gaya ng mga tupa at kambing.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at isinauli niya sa kanya si Sara, ang kanyang asawa.”
    reason: translation_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kumuha
  rationale: Karaniwang kahulugan ng לקח at tuwirang nagpapatuloy sa salaysay nang walang idinaragdag na diwa.
- source_word: צֹאן
  choice: mga tupa
  rationale: Likas at kongkretong katumbas sa talaan ng mga hayop, bagaman maaari ring tumukoy ang Hebreo sa maliliit na alagang hayop, kabilang ang mga kambing.
- source_word: בָקָר
  choice: mga baka
  rationale: Natural na kolektibong tawag sa mga alagang bovine sa makabagong Tagalog.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: mga aliping lalaki at babae
  rationale: Ipinakikita ng konteksto ng pagbibigay kasama ng mga hayop ang kalagayang hindi malaya; pinananatili rin ang tahasang pagkakaiba ng kasarian sa Hebreo.
- source_word: וַיִּתֵּן
  choice: ibinigay ang mga iyon
  rationale: Ang 'ibinigay' ay tuwirang katumbas; idinagdag ang 'ang mga iyon' upang malinaw na tumukoy sa naunang talaan.
- source_word: וַיָּשֶׁב
  choice: ibinalik
  rationale: Ang Hiphil ng שוב ay causative, 'pinabalik' o 'ibinalik'; natural ang 'ibinalik' sa Tagalog.
- source_word: אֵת שָׂרָה אִשְׁתּוֹ ... לּוֹ
  choice: kay Abraham si Sara na asawa nito
  rationale: Nililinaw ng pangalang 'Abraham' ang tinutukoy ng panghalip, habang ang 'asawa nito' ay tumutukoy kay Abraham at hindi kay Abimelec.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “alipin” sa halip na “lingkod” upang hindi ikubli ang kalagayang ipinahihiwatig ng paglilipat sa kanila kasama ng mga hayop. Inulit ang “kay Abraham” upang maiwasan ang kalituhan sa mga panghalip.
