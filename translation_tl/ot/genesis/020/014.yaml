  terminology: Ang “mga tupa,” “mga baka,” at “mga aliping lalaki at babae” ay angkop. Pinanatili ang pangalang “Abimelec” at “Sara,” na likas sa karaniwang Tagalog na anyo ng mga pangalang ito.
