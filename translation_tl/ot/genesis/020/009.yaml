source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֲבִימֶ֜לֶךְ לְ/אַבְרָהָ֗ם וַ/יֹּ֨אמֶר ל֜/וֹ מֶֽה עָשִׂ֤יתָ לָּ֨/נוּ֙ וּ/מֶֽה חָטָ֣אתִי לָ֔/ךְ כִּֽי הֵבֵ֧אתָ עָלַ֛/י וְ/עַל מַמְלַכְתִּ֖/י חֲטָאָ֣ה גְדֹלָ֑ה מַעֲשִׂים֙ אֲשֶׁ֣ר לֹא יֵֽעָשׂ֔וּ עָשִׂ֖יתָ עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/009.yaml
  text: Then Abimelech called Abraham and said to him[a], “What have you done to us? And how have I sinned against you[b], that you have brought a great sin on me and on my kingdom? You have done to me things that should not be done.”
translation:
  language: tl
  text: Pagkatapos, ipinatawag ni Abimelec si Abraham at sinabi sa kanya, “Ano itong ginawa mo sa amin? Ano ang kasalanang nagawa ko laban sa iyo[a], upang dinalhan mo ako at ang aking kaharian ng malaking kasalanan? Ginawa mo sa akin ang mga bagay na hindi dapat gawin.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Paano ako nagkasala laban sa iyo?”
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “mga bagay na hindi ginagawa.” Ipinahihiwatig ng pahayag ang mga gawaing hindi nararapat gawin.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיִּקְרָא אֲבִימֶלֶךְ לְאַבְרָהָם
  choice: ipinatawag ni Abimelec si Abraham
  rationale: Sa kayariang קרא + לְ para sa isang tao, maaaring mangahulugang ipatawag o tawagin. Ang “ipinatawag” ay natural sa konteksto ng isang haring humaharap kay Abraham, nang hindi dinaragdagan ang tindi ng pananalita.
- source_word: מֶה עָשִׂיתָ לָּנוּ
  choice: Ano itong ginawa mo sa amin?
  rationale: Tuwirang naihahatid ang mapanumbat na tanong at ang kasalukuyang epekto ng ginawa ni Abraham. Ang “itong” ay likas sa modernong Filipino sa ganitong pananalita.
- source_word: וּמֶה חָטָאתִי לָךְ
  choice: Ano ang pagkakasala ko sa iyo
  rationale: Pinananatili ng “pagkakasala” ang moral na bigat ng חטא at ang tanong na מֶה, sa halip na gawing mas malabong “Ano ang ginawa kong masama?”
- source_word: כִּי
  choice: at
  rationale: Dito, iniuugnay ng כִּי ang diumano'y pagkakasala ni Abimelec sa naging bunga ng ginawa ni Abraham. Ang “at” sa Filipino ay natural na naghahatid ng mapanumbat na ugnayang ito nang piliting tukuyin kung ito ay sanhi o nilalaman.
- source_word: הֵבֵאתָ עָלַי וְעַל מַמְלַכְתִּי
  choice: nagdala ka ... sa akin at sa aking kaharian
  rationale: Inilalarawan ng hiphil ng בוא ang pagpapasapit ng isang bagay sa isang tao o sakop. Natural at malinaw sa Filipino ang “nagdala ... sa.”
- source_word: חֲטָאָה גְדֹלָה
  choice: malaking kasalanan
  rationale: Pinananatili nito ang malinaw na moral at panrelihiyong bigat ng חֲטָאָה, sa halip na pahinain bilang “malaking pagkakamali.”
- source_word: מַמְלַכְתִּי
  choice: aking kaharian
  rationale: Ang “kaharian” ang malinaw at karaniwang katumbas ng maharlikang nasasakupan o pamumuno.
- source_word: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ
  choice: mga bagay na hindi dapat gawin
  rationale: 'Ang pasibong pahayag ay may normatibong diwa: mga gawaing hindi nararapat o katanggap-tanggap. Natural itong ipinahahayag sa Filipino sa pamamagitan ng “hindi dapat gawin.”'
- source_word: עָשִׂיתָ עִמָּדִי
  choice: Ginawa mo sa akin
  rationale: Ang idyomang עשה עם/עמד ay tumutukoy sa ginawa o pakikitungo sa isang tao. Ang “ginawa mo sa akin” ay natural at angkop sa mapanumbat na tono.
theological_decisions:
- issue: Kung ang חטא laban sa isang tao ay isasalin bilang moral-relihiyosong “magkasala” o mas pangkalahatang “magkasala/magkamali laban.”
  choice: Ano ang pagkakasala ko sa iyo
  alternative: Ano ang ginawa kong masama sa iyo
  rationale: Pinananatili ng napiling salin ang moral na lakas ng ugat na חטא nang hindi nagpapasok ng partikular na doktrinal na pakahulugan.
- issue: Kung ang malaking kasalanan ay kasalanang aktuwal nang nagawa o kapahamakang moral na muntik ipasapit ni Abraham.
  choice: nagdala ka ng malaking kasalanan sa akin at sa aking kaharian
  alternative: nagdala ka ng malaking pananagutan sa kasalanan sa akin at sa aking kaharian
  rationale: Hindi nilulutas ng Hebreo kung ang diin ay nasa kasalanan, pagkakasala, o kaakibat na pananagutan. Ang tuwirang “malaking kasalanan” ay nagpapanatili sa tensiyong iyon.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “ipinatawag” dahil hari ang nagsasalita, ngunit iniwasan ang labis na pormal o makalumang pananalita. Ang mga retorikal na tanong at mapanumbat na tono ng Hebreo ay pinanatili.
