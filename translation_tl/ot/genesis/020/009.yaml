revisions:
- from: Pagkatapos, ipinatawag ni Abimelec si Abraham at sinabi sa kanya, “Ano itong ginawa mo sa amin? Ano ang pagkakasala ko sa iyo[a] at nagdala ka ng malaking kasalanan sa akin at sa aking kaharian? Ginawa mo sa akin ang mga bagay na hindi dapat gawin.[b]”
  to: Pagkatapos, ipinatawag ni Abimelec si Abraham at sinabi sa kanya, “Ano itong ginawa mo sa amin? Ano ang kasalanang nagawa ko laban sa iyo[a], upang dinalhan mo ako at ang aking kaharian ng malaking kasalanan? Ginawa mo sa akin ang mga bagay na hindi dapat gawin.[b]”
  rationale: Nilinaw ang ugnayan ng ikalawang retorikal na tanong at ng kasunod na paratang, at inayos ang ayos ng pandiwang “dalhan” upang maging natural sa modernong Filipino. Pinanatili ang mapanumbat na tono, ang moral na bigat ng חטא/חטאה, at ang normatibong diwa ng “mga bagay na hindi dapat gawin.” Ang mga talababa ay nananatiling nakatali sa mga salitang sinusuportahan nila.
