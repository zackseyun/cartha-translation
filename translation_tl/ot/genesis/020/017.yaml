base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/017.yaml
  text: Then Abraham prayed to God[a], and God healed Abimelech, his wife, and his female servants[b], and they gave birth.
translation:
  language: tl
  text: Nanalangin si Abraham sa Diyos, at pinagaling ng Diyos si Abimelec, ang kaniyang asawa, at ang kaniyang mga babaeng lingkod[a], at nanganak ang kaniyang asawa at mga babaeng lingkod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga babaeng alipin nito”; maaaring tumukoy ang salitang Hebreo sa mga babaeng alipin o lingkod.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ding isalin ayon sa ipinahihiwatig na resulta sa konteksto: “kaya nanganak ang kaniyang asawa at mga babaeng lingkod.”'
    reason: discourse_ambiguity
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: nanalangin
  rationale: Ang Hitpael ng פלל ay karaniwang nangangahulugang manalangin. Ipinahihiwatig ng konteksto na namamagitan si Abraham para kay Abimelec, ngunit hindi kailangang gawing tahasan iyon sa salin.
- source_word: אֶל הָאֱלֹהִים
  choice: sa Diyos
  rationale: Ito ang likas at tumpak na paraan sa modernong Tagalog upang tukuyin ang pananalangin sa tunay na Diyos.
- source_word: וַיִּרְפָּא
  choice: pinagaling
  rationale: Tuwirang kahulugan ng רפא ang magpagaling. Hindi nito labis na tinutukoy kung ano ang sakit o kalagayang pinagaling.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: si Abimelec
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino at ang pantukoy na angkop sa tiyak na layon na pangalan ng tao.
- source_word: אִשְׁתּוֹ
  choice: ang asawa nito
  rationale: Tumutukoy ito sa asawa ni Abimelec. Iniiwasan ng “nito” ang posibleng kalituhan kung kanino tumutukoy ang asawa.
- source_word: אַמְהֹתָיו
  choice: ang mga babaeng lingkod nito
  rationale: Ang אָמָה ay babaeng lingkod at maaari ring tumukoy sa babaeng alipin. Likas sa modernong Tagalog ang “mga babaeng lingkod,” habang inilalahad sa talababa ang mas mariing kahulugan tungkol sa katayuang panlipunan.
- source_word: וַיֵּלֵדוּ
  choice: at nanganak sila
  rationale: Ang ילד sa anyong ito ay nangangahulugang manganak o magsilang. Pinananatili ng “at” ang payak na pagkakasunod ng Hebreo nang hindi ginagawang tahasang sugnay ng resulta ang maaaring ipinahihiwatig lamang ng konteksto.
theological_decisions:
- issue: Ugnayan ng panghuling pandiwa sa pagpapagaling
  choice: 'Pinanatili ang payak na pagkakasunod: “at nanganak sila.”'
  alternative: “kaya nanganak sila” o “upang makapanganak sila”
  rationale: Maaaring maunawaan sa konteksto, lalo na sa talata 18, na bunga ito ng pagpapagaling ng Diyos. Gayunman, pang-ugnay na waw ang nasa tekstong Hebreo at hindi nito tahasang tinutukoy ang lohikal na ugnayan; kaya pinananatili sa pangunahing teksto ang tunay na kalabuan.
- issue: Kahulugang panlipunan ng אָמָה
  choice: “mga babaeng lingkod” sa pangunahing teksto
  alternative: “mga babaeng alipin”
  rationale: Saklaw ng salitang Hebreo ang babaeng lingkod o aliping babae. Hindi tiyak sa talatang ito kung gaano dapat idiin ang legal na katayuan, kaya ginamit ang mas malawak na katumbas at inilagay sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nanalangin,” “pinagaling,” at “nanganak” bilang karaniwan at likas na mga salita. Pinanatili ang paulit-ulit na “Diyos” gaya ng Hebreo at iniwasang gawing tahasan ang resultang ugnayan sa huling sugnay.
