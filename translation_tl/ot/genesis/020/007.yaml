base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/007.yaml
  text: Now then[a], return the man's wife, for he is a prophet, and he will pray for you, and you will live. But if you do not return her, know that you will surely die—you and all who are yours.
translation:
  language: tl
  text: Kaya ngayon, ibalik mo ang asawa ng lalaki, sapagkat isa siyang propeta. Mananalangin siya para sa iyo, at mabubuhay ka. Ngunit kung hindi mo siya ibabalik, alamin mong tiyak na mamamatay ka—ikaw at ang lahat ng sa iyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ikaw at ang lahat ng pag-aari mo” o “ikaw at ang lahat ng kabilang sa iyong sambahayan.” Malawak ang Hebreong pananalita at maaaring tumukoy kapuwa sa mga miyembro ng sambahayan at sa lahat ng pag-aari ni Abimelec.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Nagsisilbi itong panandang diskurso para sa agarang utos at may temporal at inferensiyal na puwersa; natural itong naipapahayag sa modernong Tagalog bilang “Kaya ngayon.”
- source_word: הָשֵׁב
  choice: ibalik mo
  rationale: Ang causative imperative ng שוב ay nag-uutos na isauli ang babae sa dati at nararapat niyang kalagayan bilang asawa ng lalaki.
- source_word: אֵשֶׁת הָאִישׁ
  choice: ang asawa ng lalaki
  rationale: Pinananatili nito ang tahasang construct phrase ng Hebreo nang hindi agad pinapalitan ng panghalip.
- source_word: כִּי נָבִיא הוּא
  choice: sapagkat isa siyang propeta
  rationale: Ang כִּי ay nagbibigay ng dahilan sa utos, at ang נָבִיא ay tuwirang isinasaling “propeta.”
- source_word: וְיִתְפַּלֵּל בַּעַדְךָ
  choice: Mananalangin siya para sa iyo
  rationale: Ipinahahayag ng yiqtol ang kasunod na gagawin ni Abraham para kay Abimelec; malinaw at karaniwan ang “mananalangin ... para sa iyo,” habang taglay pa rin ang diwa ng pamamagitan.
- source_word: וֶחְיֵה
  choice: at mabubuhay ka
  rationale: Bagaman imperative ang anyo, sa pagkakasunod ng mga sugnay ipinahahayag nito ang bunga ng panalangin; natural itong isalin bilang katiyakang “mabubuhay ka.”
- source_word: וְאִם אֵינְךָ מֵשִׁיב
  choice: Ngunit kung hindi mo siya ibabalik
  rationale: Ang negatibo at participle ay nagpapahiwatig ng hindi pagsunod sa utos. Ang “siya” ay likas na ipinapasok sa Tagalog mula sa malinaw na tinutukoy na asawa.
- source_word: דַּע
  choice: tiyak mong malaman
  rationale: Pinananatili ang tuwirang utos na “alamin,” habang ipinakikita sa natural na Tagalog ang taimtim na katiyakan ng babala.
- source_word: מוֹת תָּמוּת
  choice: mamamatay ka
  rationale: Ang infinitive absolute at finite verb ay mariing nagpapahayag ng tiyak na kamatayan; ang diin ay naipapakita ng kasamang “tiyak mong malaman.”
- source_word: אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: ikaw at ang lahat ng sa iyo
  rationale: Pinananatili ng malawak na parirala ang tunay na kalabuan kung mga tao sa sambahayan, mga pag-aari, o kapuwa ang saklaw.
theological_decisions:
- issue: Saklaw ng banta sa “ikaw at lahat ng אֲשֶׁר לָךְ”
  choice: ikaw at ang lahat ng sa iyo
  alternative: ikaw at ang lahat ng taong nasasakupan mo
  rationale: Malawak ang Hebreong parirala at maaaring sumaklaw sa mga kasambahay at sa mga pag-aari. Hindi nililimitahan ng salin ang hatol sa mga tao lamang, at ipinaliliwanag ng talababa ang saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sapagkat” para sa dignidad ng salaysay, ngunit iniwasan ang lipas o labis na pormal na pananalita. Pinanatili sa pangunahing teksto ang kalabuan ng huling Hebreong parirala at nilinaw ang mga posibilidad sa talababa.
