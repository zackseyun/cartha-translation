revisions:
- from: Kaya ngayon, ibalik mo ang asawa ng lalaki, sapagkat isa siyang propeta. Mananalangin siya para sa iyo, at mabubuhay ka. Ngunit kung hindi mo siya ibabalik, tiyak mong malaman na mamamatay ka—ikaw at ang lahat ng sa iyo.[a]
  to: Kaya ngayon, ibalik mo ang asawa ng lalaki, sapagkat isa siyang propeta. Mananalangin siya para sa iyo, at mabubuhay ka. Ngunit kung hindi mo siya ibabalik, alamin mong tiyak na mamamatay ka—ikaw at ang lahat ng sa iyo.[a]
  rationale: Inayos ang di-natural na ayos ng “tiyak mong malaman” upang ang imperatibong “alamin” at ang mariing babalang “tiyak na mamamatay” ay kapuwa malinaw. Inayos din ang talababa upang mapanatili ang malawak at hindi pinagtataligahang saklaw ng Hebreong parirala. Walang binagong kahulugan sa talata.
