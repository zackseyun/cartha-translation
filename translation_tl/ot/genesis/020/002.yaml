  yaml_path: translation/ot/genesis/020/002.yaml
  text: And Abraham said of Sarah his wife[b][a], “She is my sister.” So Abimelech king of Gerar sent and took Sarah.
translation:
  language: tl
  text: Sinabi ni Abraham tungkol sa kanyang asawang si Sara,[a] “Kapatid kong babae siya.” Kaya nagsugo si Abimelec, na hari ng Gerar, at kinuha si Sara.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Sinabi ni Abraham sa kanyang asawang si Sara.” Karaniwang nangangahulugang “sa” ang pang-ukol na Hebreo, ngunit mas angkop sa konteksto ang “tungkol sa kanyang asawang si Sara” dahil ang iniulat na sinabi niya ay “Kapatid kong babae siya.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ipinakuha ni Abimelec si Sara at dinala sa kanya; payak na sinasabi ng Hebreo na “nagsugo at kinuha si Sara.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang salaysay na katumbas ng wayyiqtol ng אמר; natural sa makabagong Filipino.
- source_word: אֶל שָׂרָה אִשְׁתּוֹ
  choice: tungkol kay Sara na asawa niya
  rationale: Bagaman karaniwang nangangahulugang “kay” ang אֶל, ipinahihiwatig ng kasunod na pahayag na nagsalita si Abraham tungkol kay Sara. Pinananatili sa talababa ang leksikal na alternatibo.
- source_word: אֲחֹתִי הִוא
  choice: Kapatid ko siya
  rationale: Direkta at natural na salin ng sugnay na walang hayag na pandiwa; hindi tinutukoy ng salitang Filipino ang kasarian ng kapatid, ngunit malinaw ito sa panghalip na “siya” at sa konteksto.
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Inilalarawan ng שלח ang pagpapadala ni Abimelec ng mga di-tinukoy na tauhan; ang “nagsugo” ay natural at hindi nagdaragdag ng tahasang layon.
- source_word: מֶלֶךְ גְּרָר
  choice: hari ng Gerar
  rationale: Tuwirang salin ng construct chain na tumutukoy sa katungkulan at nasasakupan ni Abimelec.
- source_word: וַיִּקַּח אֶת שָׂרָה
  choice: kinuha si Sara
  rationale: Pinananatili ang payak at sadyang di-tiyak na kahulugan ng לקח, nang hindi idinaragdag sa pangunahing teksto na dinala siya sa sambahayan o kinuha bilang asawa.
theological_decisions:
- issue: Posibleng mapagpasyang pagpapalawak sa ginawa ni Abimelec
  choice: kinuha si Sara
  alternative: dinala si Sara sa kanyang sambahayan / kinuha si Sara bilang asawa
  rationale: Hindi tahasang sinasabi ng Hebreo sa talatang ito ang layunin o katayuan ng pagkuha. Pinananatili ng salin ang tensiyon at hinahayaang linawin ito ng mas malawak na konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tungkol kay” upang maging natural ang diwa ng pahayag, habang inilagay sa talababa ang mas literal na “kay.” Pinanatili ang payak na “kinuha” upang hindi lumampas sa sinasabi ng Hebreo.
