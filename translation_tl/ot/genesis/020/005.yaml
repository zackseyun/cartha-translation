  to: Hindi ba siya mismo ang nagsabi sa akin, “Kapatid kong babae siya”? At siya rin mismo ang nagsabi, “Kapatid kong lalaki siya.” Ginawa ko ito nang may tapat na puso at malilinis na kamay.[a]
