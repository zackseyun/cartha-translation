base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/005.yaml
  text: Did he not himself say to me[a], ‘She is my sister’? And she herself also said, ‘He is my brother.’ In the integrity of my heart and the innocence of my hands I have done this.
translation:
  language: tl
  text: Hindi ba siya mismo ang nagsabi sa akin, “Kapatid kong babae siya”? At siya rin mismo ang nagsabi, “Kapatid kong lalaki siya.” Ginawa ko ito nang may tapat na puso at malilinis na kamay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ginawa ko ito nang may katapatan ng puso at malilinis na kamay.” Ang Hebreo ay gumagamit ng mga idyomang moral at legal upang ipahayag ang katapatan ng layunin at kawalang-sala sa ginawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הוּא אָמַר לִי
  choice: Hindi ba siya mismo ang nagsabi sa akin
  rationale: Pinananatili ng tanong na may inaasahang pagsang-ayon ang הֲלֹא, at ipinahahayag ng “siya mismo” ang diin ng malayang panghalip na הוּא.
- source_word: אֲחֹתִי הִוא
  choice: Kapatid ko siya
  rationale: Likas sa modernong Tagalog at pinananatili ang hindi tiyak-sa-kasariang gamit ng “kapatid”; malinaw na babae ang tinutukoy mula sa konteksto.
- source_word: וְהִיא גַם הִוא אָמְרָה
  choice: At siya rin mismo ang nagsabi
  rationale: Ang “rin” at “mismo” ay magkasamang nagpapanatili sa dagdag at diin ng גַם at ng malayang panghalip.
- source_word: אָחִי הוּא
  choice: Kapatid ko siya
  rationale: Tuwirang salin ng pahayag tungkol sa pagkakamag-anak; bagaman walang kasarian ang salitang Tagalog, malinaw sa panghalip na “siya” at sa konteksto na lalaki ang tinutukoy.
- source_word: בְּתָם לְבָבִי
  choice: nang tapat ang puso
  rationale: Ipinahahayag ang moral na katapatan at malinis na layunin ng תָם sa natural na idyomang Tagalog, nang hindi ipinahihiwatig ang ganap na kawalang-kasalanan.
- source_word: וּבְנִקְיֹן כַּפַּי
  choice: at walang-sala ang mga kamay
  rationale: Pinananatili ang metapora ng mga kamay bilang mga gawa at pananagutan, pati ang moral-legal na diwa ng נִקָּיוֹן.
- source_word: עָשִׂיתִי זֹאת
  choice: Ginawa ko ito
  rationale: Ang payak na naganap na aspekto ay natural na naglalahad ng kilos na ipinagtatanggol ni Abimelec.
theological_decisions:
- issue: Saklaw ng pag-aangkin ni Abimelec na tapat at walang-sala siya
  choice: Iniuugnay ang katapatan ng puso at kawalang-sala ng mga kamay sa partikular na ginawa niya.
  alternative: Gamitin ang “may pusong walang kapintasan,” na maaaring mapagkamalang pag-aangkin ng ganap na moral na kasakdalan.
  rationale: Ang Hebreo ay moral-legal na pagtatanggol tungkol sa pangyayaring ito, hindi malinaw na pahayag ng lubos na kawalang-kasalanan sa lahat ng bagay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang likas na ayos ng pangungusap at pinanatili ang diin ng mga panghalip at ang metapora ng puso at mga kamay.
