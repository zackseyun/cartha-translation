- source_word: אַרְצִי לְפָנֶיךָ
  choice: ang lupain ko sa harap mo
  rationale: 'Pinananatili ang larawan at ayos ng Hebreo: ang lupain ay nakahain o bukás sa pagpili ni Abraham.'
- source_word: שֵׁב
  choice: Manirahan ka
