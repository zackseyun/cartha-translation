- source_word: בַּטּוֹב בְּעֵינֶיךָ
  choice: kung saan mo minamabuting tumira
  rationale: Natural na Tagalog para sa idyomang Hebreo na literal na ‘sa mabuti sa iyong mga mata,’ habang pinananatili ang malayang pagpili ng kausap.
