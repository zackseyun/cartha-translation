    text: O “Ano ang nasa isip mo para gawin mo ang bagay na ito?” Literal sa Hebreo, “Ano ang nakita mo...?” Ginagamit dito ang “makita” sa idyomatikong diwa ng kung ano ang nasa isip o isinaalang-alang ng isang tao.
