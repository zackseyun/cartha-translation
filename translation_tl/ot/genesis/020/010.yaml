lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang “Pagkatapos, sinabi” at pinananatili nito ang pagkakasunod-sunod.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelec
  rationale: Ginamit ang karaniwang anyong Filipino ng personal na pangalan.
- source_word: אֶל אַבְרָהָם
  choice: kay Abraham
  rationale: Ang “kay” ang likas na panandang Filipino para sa taong kinakausap.
- source_word: מָה רָאִיתָ
  choice: Ano ang nakita mo
  rationale: Pinananatili ang literal na larawan ng Hebreong “makita,” bagaman idyomatiko itong tumutukoy sa naisip, napansin, o isinasaalang-alang.
- source_word: כִּי עָשִׂיתָ
  choice: kaya mo ginawa
  rationale: Ikinakabit ng כִּי ang nakita o isinaalang-alang ni Abraham sa ginawa niya; natural sa Filipino ang “kaya” habang nananatili ang tanong tungkol sa batayan ng pagkilos.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Malapit at hindi labis na mapanghusgang salin ng דָּבָר sa konteksto ng isang ginawa.
