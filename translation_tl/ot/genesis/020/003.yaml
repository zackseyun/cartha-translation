base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/003.yaml
  text: But God came to Abimelech in a dream by night and said to him[a], “Behold, you are a dead man because of the woman whom you have taken[c][b], for she is married.”
translation:
  language: tl
  text: Ngunit nagpakita ang Diyos kay Abimelec sa panaginip nang gabing iyon at sinabi sa kanya, “Tingnan mo, mamamatay ka[a] dahil sa babaeng kinuha mo, sapagkat siya ay may asawa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Tingnan mo, patay ka.” Maaari rin itong unawain na “Tingnan mo, tiyak na mamamatay ka.” Ipinahahayag ng Hebreo ang tiyak at nalalapit na kamatayan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “siya ay isang babaeng may asawa,” gamit ang Hebreong idyoma na tumutukoy sa isang babaeng nakabuklod na sa kanyang asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: nagpakita
  rationale: Literal na ‘dumating,’ ngunit sa konteksto ng pakikipagtagpo sa panaginip, ang ‘nagpakita’ ang likas na salin sa Filipino at hindi nagpapahiwatig ng pisikal na paglalakbay.
- source_word: בַּחֲלוֹם הַלָּיְלָה
  choice: sa panaginip nang gabing iyon
  rationale: Likas na Filipino para sa pagpapahayag na naganap sa gabi ang panaginip; pinananatili ang panahong binibigyang-diin ng Hebreo.
- source_word: הִנְּךָ מֵת
  choice: Tingnan mo, mamamatay ka
  rationale: Ang הִנֵּה ay naghahayag ng mariing babala, at ang participial na מֵת ay nagpapahiwatig ng tiyak at nalalapit na kamatayan. Mas natural ito kaysa sa literal na ‘patay ka’ habang itinatala sa talababa ang tunay na anyo at saklaw ng Hebreo.
- source_word: עַל הָאִשָּׁה אֲשֶׁר לָקַחְתָּ
  choice: dahil sa babaeng kinuha mo
  rationale: Ang עַל ay nagsasaad ng dahilan, at ang לקח ay simpleng ‘kunin’; hindi idinaragdag ang puwersa o karahasang hindi tahasang nasa teksto.
- source_word: בְּעֻלַת בָּעַל
  choice: siya ay may asawa
  rationale: Ang idyomang Hebreo ay literal na tumutukoy sa isang babaeng ‘may-ari/asawang lalaki,’ kaya ang ‘may asawa’ ang malinaw at likas na Filipino para sa umiiral niyang buklod sa asawa.
theological_decisions:
- issue: Panahunan at bisa ng babalang הִנְּךָ מֵת
  choice: mamamatay ka
  alternative: patay ka / para ka nang patay
  rationale: Hindi tahasang nilulutas ng anyong Hebreo kung ito ay pahayag ng kasalukuyang hatol o nalalapit na kamatayan. Inihahatid ng pangunahing salin ang tiyak na banta, at pinananatili ng talababa ang literal na posibilidad.
- issue: Kahulugan ng בְּעֻלַת בָּעַל
  choice: siya ay may asawa
  alternative: siya ay babaeng pag-aari ng isang asawa / siya ay kasal
  rationale: Ipinahahayag nito ang umiiral na relasyon sa asawa nang hindi inaangkat sa Filipino ang posibleng mapanlinlang na ideya ng ganap na pagmamay-ari o anumang karagdagang doktrinal na paliwanag.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang ‘Abimelec’ bilang karaniwang anyong Filipino ng pangalan. Iniwasan ang masyadong literal ngunit hindi likas na ‘dumating ang Diyos kay Abimelec’ at ang salitang ‘pag-aari’ na maaaring maghatid ng higit kaysa sa kontekstuwal na diwa ng idyoma.
