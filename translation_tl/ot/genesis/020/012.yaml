base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/012.yaml
  text: Besides[a], she really is my sister—the daughter of my father, though not the daughter of my mother—and she became my wife.
translation:
  language: tl
  text: At totoo rin namang kapatid ko siya—anak siya ng aking ama, ngunit hindi ng aking ina—at naging asawa ko siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: At ... rin
  rationale: 'Pinananatili ang pang-ugnay at pandagdag na diwa: nagdaragdag si Abraham ng isa pang paliwanag sa nauna niyang sinabi.'
- source_word: אָמְנָה
  choice: totoo ... naman
  rationale: Likas na makabagong Tagalog ito para sa mariing pagpapatunay na talagang totoo ang pahayag.
- source_word: אֲחֹתִי
  choice: kapatid ko
  rationale: Sa konteksto, ipinaliliwanag agad ng kasunod na mga parirala na kapatid niyang babae sa ama ang tinutukoy; natural sa Tagalog ang walang-kasariang salitang “kapatid.”
- source_word: בַת אָבִי
  choice: anak siya ng aking ama
  rationale: Malinaw na ipinapahayag ang ugnayang pampamilya at pinananatili ang pagkakatimbang sa kasunod na parirala.
- source_word: אַךְ לֹא
  choice: ngunit hindi
  rationale: Ipinahahayag ang paglilimita o kwalipikasyon sa naunang pahayag nang hindi nagdaragdag ng interpretasyon.
- source_word: בַת אִמִּי
  choice: ng aking ina
  rationale: Sa ilalim ng naunang “anak siya,” sapat at natural ang pinaikling pariralang ito habang nananatiling malinaw ang kahulugan.
- source_word: וַתְּהִי לִי לְאִשָּׁה
  choice: at naging asawa ko siya
  rationale: Pinananatili ng “naging” ang pangyayaring pagpasok sa kalagayan ng pag-aasawa, hindi lamang ang statikong pagiging asawa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit pangkaraniwan. Ginamit ang “aking” sa mga pariralang pampamilya para sa maayos na ritmo, at “ko” sa “kapatid ko” at “asawa ko” bilang natural na gamit. Hindi nilutas o pinalawak ang tensiyon sa paliwanag ni Abraham.
