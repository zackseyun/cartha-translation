  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pagkakaiba ng karaniwang paninirahan (וַיֵּשֶׁב) at paninirahan bilang dayuhan o nakikipamayan (וַיָּגָר), at inilagay ang marker na [a] sa pangunahing teksto.
