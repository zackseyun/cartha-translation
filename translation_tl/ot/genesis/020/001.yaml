  text: וַ/יִּסַּ֨ע מִ/שָּׁ֤ם אַבְרָהָם֙ אַ֣רְצָ/ה הַ/נֶּ֔גֶב וַ/יֵּ֥שֶׁב בֵּין קָדֵ֖שׁ וּ/בֵ֣ין שׁ֑וּר וַ/יָּ֖גָר בִּ/גְרָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/001.yaml
  text: From there Abraham journeyed toward the Negev and settled between Kadesh and Shur[a]; he sojourned in Gerar.
translation:
  language: tl
  text: Mula roon, naglakbay si Abraham patungo sa Negev[a] at nanirahan sa pagitan ng Kades at Shur; nanirahan siya bilang dayuhan sa Gerar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patimog.” Maaaring tumukoy ang salitang Hebreo sa katimugang rehiyong tinatawag na Negev o sa pagkilos patungo sa timog; pinananatili sa pangunahing teksto ang malamang na heograpikong tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: naglakbay
  rationale: Ipinahahayag ng qal wayyiqtol ng נסע ang pag-alis at paglalakbay mula sa isang lugar; natural sa makabagong Tagalog ang “naglakbay.”
- source_word: מִשָּׁם
  choice: Mula roon
  rationale: Tuwirang tumutukoy ito sa naunang kinaroroonan ni Abraham at likas na pahayag sa Tagalog.
- source_word: אַרְצָה הַנֶּגֶב
  choice: patungo sa Negev
  rationale: Ipinakikita ng directional he sa אַרְצָה ang pagkilos patungo sa isang lugar. Pinananatili ng “Negev” ang malamang na heograpikong kahulugan ng הַנֶּגֶב, habang inilalahad sa talababa ang posibleng kahulugang “patimog.”
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Ang ישב ay maaaring mangahulugang tumira o manirahan; malinaw at likas ang “nanirahan” sa kontekstong heograpiko nang hindi ipinapalagay na permanente ang pagtira.
- source_word: בֵּין קָדֵשׁ וּבֵין שׁוּר
  choice: sa pagitan ng Kades at Shur
  rationale: Tuwirang lokasyong heograpiko ito; isinalin sa karaniwang anyong Filipino ang Kades at pinanatili ang madaling makilalang anyong Shur.
- source_word: וַיָּגָר
  choice: nakipamayan
  rationale: Taglay ng גור ang diwa ng paninirahan bilang dayuhan o hindi ganap na katutubo. Mas natural sa dignified na Tagalog ang “nakipamayan” kaysa sa literal ngunit mabigat na “nanirahan bilang dayuhan.”
- source_word: בִּגְרָר
  choice: sa Gerar
  rationale: Likas na salin ito ng lokatibong pang-ukol at pangalan ng lugar.
