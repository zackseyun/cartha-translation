  text: וַ/יַּשְׁכֵּ֨ם אֲבִימֶ֜לֶךְ בַּ/בֹּ֗קֶר וַ/יִּקְרָא֙ לְ/כָל עֲבָדָ֔י/ו וַ/יְדַבֵּ֛ר אֶת כָּל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/אָזְנֵי/הֶ֑ם וַ/יִּֽירְא֥וּ הָ/אֲנָשִׁ֖ים מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/008.yaml
  text: So Abimelech rose early in the morning and called all his servants and spoke all these things in their hearing[b][a], and the men were very afraid.
translation:
  language: tl
  text: Kaya maagang bumangon si Abimelec kinaumagahan. Tinawag niya ang lahat ng kanyang mga lingkod at sinabi sa kanila ang lahat ng bagay na ito. Labis na natakot ang mga lalaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: maagang bumangon ... kinaumagahan
  rationale: Ipinahahayag ng Hiphil ng שׁכם ang maagang pagbangon, at natural sa makabagong Tagalog ang pagsasama nito sa temporal na “kinaumagahan.”
- source_word: וַיִּקְרָא לְכָל עֲבָדָיו
  choice: Tinawag niya ang lahat ng kanyang mga lingkod
  rationale: Maaaring mangahulugan ang עֶבֶד na lingkod o alipin. Sa konteksto ng sambahayan o korte ng hari, hindi binibigyang-diin ang pagkaalipin, kaya “mga lingkod” ang mas angkop; tuwirang katumbas naman ng קרא ang “tinawag.”
- source_word: וַיְדַבֵּר אֶת כָּל הַדְּבָרִים הָאֵלֶּה בְּאָזְנֵיהֶם
  choice: sinabi sa kanila ang lahat ng bagay na ito
  rationale: Ang literal na “nagsalita ... sa kanilang mga tainga” ay idyomang nangangahulugang ipinahayag sa kanilang pandinig. Ang “sinabi sa kanila” ay natural at buong naihahatid ang diwa.
- source_word: וַיִּירְאוּ ... מְאֹד
  choice: Labis na natakot
  rationale: Sa konteksto, ang ירא ay takot o pangamba, at pinatitindi ito ng מְאֹד. Ang “labis na natakot” ay malinaw at natural sa salaysay.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaki
  rationale: Tiyak na panlalaking maramihan ang Hebreo, kaya pinananatili ang “mga lalaki” sa halip na gawing pangkalahatang “mga tao.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, natural, at marangal. Pinanatili ang panlalaking pagtukoy ng הָאֲנָשִׁים at iniwasan ang masyadong literal na idyomang “sa kanilang mga tainga.”
