base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/011.yaml
  text: And Abraham said[a], “Because I said, ‘Surely there is no fear of God in this place, and they will kill me because of my wife.’”
translation:
  language: tl
  text: Sinabi ni Abraham, “Sapagkat sinabi ko, ‘Tiyak na walang takot sa Diyos sa lugar na ito, at papatayin nila ako dahil sa aking asawa.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ni Abraham sa nauna niyang ginawa; likas at malinaw ang panandang sanhi sa Filipino.
- source_word: אָמַרְתִּי
  choice: naisip ko
  rationale: Literal itong ‘sinabi ko,’ ngunit sa konteksto ay tumutukoy sa panloob na pangangatwiran ni Abraham. Mas natural sa modernong Filipino ang ‘naisip ko’ nang hindi binabago ang diwa.
- source_word: רַק
  choice: Tiyak na
  rationale: Ginagamit dito ang salita bilang idiomatikong pagdidiin sa palagay ni Abraham, hindi bilang payak na ‘lamang.’
- source_word: אֵין יִרְאַת אֱלֹהִים
  choice: walang takot sa Diyos
  rationale: Pinananatili ang biblikal na idyoma at ang moral-relihiyosong bigat ng Hebreong parirala.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: sa lugar na ito
  rationale: Tuwiran at natural na salin ng pariralang tumutukoy sa kinaroroonan.
- source_word: וַהֲרָגוּנִי
  choice: at papatayin nila ako
  rationale: Ipinahahayag nito ang inaasahang kahihinatnan ayon sa palagay ni Abraham.
- source_word: עַל דְּבַר אִשְׁתִּי
  choice: dahil sa aking asawa
  rationale: Malinaw na ipinapahayag ang sanhi o dahilan na taglay ng Hebreong idyoma.
theological_decisions:
- issue: Pagpapakahulugan sa יִרְאַת אֱלֹהִים
  choice: takot sa Diyos
  alternative: paggalang sa Diyos
  rationale: Pinananatili ng ‘takot sa Diyos’ ang hayag na metapora at biblikal na idyoma ng Hebreo, pati ang saklaw nitong paggalang at moral na pananagutan, sa halip na paliitin ito sa ‘paggalang’ lamang.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang ‘asawa’ sa karaniwang kahulugan nito bilang kabiyak na babae ayon sa konteksto. Hindi kinailangan ang talababa sapagkat maayos na napapanatili ng ‘takot sa Diyos’ ang Hebreong idyoma.
