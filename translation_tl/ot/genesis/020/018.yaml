  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי עָצֹ֤ר עָצַר֙ יְהוָ֔ה בְּעַ֥ד כָּל רֶ֖חֶם לְ/בֵ֣ית אֲבִימֶ֑לֶךְ עַל דְּבַ֥ר שָׂרָ֖ה אֵ֥שֶׁת אַבְרָהָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/018.yaml
  text: For Yahweh had completely closed every womb in Abimelech’s household because of Sarah[a], Abraham’s wife.
translation:
  language: tl
  text: Sapagkat lubusang isinara[a] ni Yahweh ang bawat sinapupunan sa sambahayan ni Abimelec dahil kay Sara, na asawa ni Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tiyak na isinara” o “ganap na ipininid.” Gumagamit ang Hebreo ng infinitive absolute kasama ng pandiwang may parehong ugat upang bigyang-diin ang kilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag sa naunang talata; likas sa Tagalog ang “Sapagkat” para sa ganitong ugnayang pangdiskurso.
- source_word: עָצֹר עָצַר
  choice: lubusang isinara
  rationale: Ang infinitive absolute na kasunod ng pandiwang may parehong ugat ay nagbibigay-diin sa kilos; ipinahahayag ito ng “lubusang” nang hindi dinaragdagan ang diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בְּעַד כָּל רֶחֶם לְבֵית אֲבִימֶלֶךְ
  choice: ang bawat sinapupunan sa sambahayan ni Abimelec
  rationale: Pinananatili ng “bawat sinapupunan” ang kongkretong larawang Hebreo, habang ang “sambahayan” ay tumutukoy sa mga kabilang sa bahay ni Abimelec, hindi lamang sa gusali.
- source_word: עַל דְּבַר שָׂרָה
  choice: dahil kay Sara
  rationale: Sa konteksto, ipinakikita ng parirala ang dahilan ng ginawang paghatol.
- source_word: אֵשֶׁת אַבְרָהָם
  choice: na asawa ni Abraham
  rationale: Natural na pagkakakilanlan kay Sara sa modernong Tagalog at malinaw na pinananatili ang kaugnayang mahalaga sa salaysay.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sinapupunan” upang mapanatili ang kongkretong pahayag ng Hebreo, at “sambahayan” upang ipahiwatig ang buong sambahayan ni Abimelec, hindi lamang ang kaniyang tirahan.
