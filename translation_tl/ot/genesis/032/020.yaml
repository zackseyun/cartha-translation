review_pass:
  verdict: revise
  source_fidelity: Tumpak ang pangunahing diwa, mga ordinal, at temporal na sugnay. Gayunman, ang “sumusunod sa likuran ng mga kawan” ay maaaring magpahiwatig na ang lahat ay basta sumusunod, samantalang ang Hebreo ay tumutukoy sa lahat ng mga naglalakad sa likod ng mga pangkat/drove ng hayop. Mas malinaw ang “lahat ng naglalakad sa likod ng mga pangkat ng hayop.”
  naturalness: Natural at angkop ang modernong Tagalog. Ang “Sinabi niya” ay katanggap-tanggap na panimula ng sipi, ngunit ang “na nagsasabi” ay mas malapit sa לֵאמֹר at mas maayos na ikinakabit ang utos sa kasunod na direktang pananalita.
  terminology: Wasto ang “Inutusan,” “ikalawa,” “ikatlo,” at “Esau.” Ang “mga pangkat ng hayop” ay mas tiyak na katumbas ng עֲדָרִים kaysa “mga kawan” sa pangungusap na ito, sapagkat mga magkakasunod na drove ang tinutukoy.
  issues:
  - severity: low
    issue: “sumusunod sa likuran ng mga kawan”
    rationale: Mas natural ngunit bahagyang malabo ang saklaw at galaw ng participle הַהֹלְכִים. Ang “naglalakad sa likod ng mga pangkat ng hayop” ay tuwirang pinananatili ang relasyong spatial at ang tinutukoy na mga droves.
  - severity: low
    issue: 'Talababa: “Ayon sa mensaheng ito”'
    rationale: Ang דָּבָר ay maaaring “salita,” “bagay,” o “utos/mensahe” ayon sa konteksto. Posible ang “mensahe,” ngunit ang “ganito ang sasabihin” ay isang idyomatikong salin ng buong parirala, hindi lamang alternatibong leksikal. Mas kapaki-pakinabang ang talababa na magbigay ng pormal na alternatibo at banggitin ang posibleng “kapag nakatagpo/namataan ninyo siya.”
  revised_text: Inutusan din niya ang ikalawa, ang ikatlo, at ang lahat ng naglalakad sa likod ng mga pangkat ng hayop, na nagsasabi, “Ganito ang sasabihin ninyo kay Esau kapag nakatagpo ninyo siya.”[a]
