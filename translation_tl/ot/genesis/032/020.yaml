  text: And he commanded the second also[a], and the third also, and all those going behind the droves, saying, “According to this word you shall speak to Esau when you find him.”
translation:
  language: tl
  text: Inutusan din niya ang ikalawa, ang ikatlo, at ang lahat ng naglalakad sa likod ng mga pangkat ng hayop, na nagsasabi, “Ganito ang sasabihin ninyo kay Esau kapag nakatagpo ninyo siya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ayon sa salitang ito ay magsasalita kayo kay Esau kapag natagpuan ninyo siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: Inutusan
  rationale: Ang Piel ng צוה ay nagpapahayag ng tuwirang pag-uutos o pagbibigay ng tagubilin; natural at may sapat na puwersa ang “inutusan” sa modernong Tagalog.
- source_word: הַשֵּׁנִי ... הַשְּׁלִישִׁי
  choice: ang ikalawa, ang ikatlo
  rationale: Mga ordinal na ginamit bilang pangngalan ang mga anyong Hebreo. Hindi idinagdag ang “lingkod” dahil wala itong tahasang katumbas sa talata.
- source_word: כָּל הַהֹלְכִים אַחֲרֵי הָעֲדָרִים
  choice: ang lahat ng sumusunod sa likuran ng mga kawan
  rationale: Pinananatili nito ang pangkatang saklaw ng כָּל at ang diwa ng participle na הַהֹלְכִים. Ang “mga kawan” ay karaniwang tawag sa magkakahiwalay na pangkat ng mga hayop sa Filipino.
- source_word: לֵאמֹר
  choice: Sinabi niya
  rationale: Ginawang likas na panimula sa tuwirang pananalita sa Tagalog ang Hebreong pormulang nagpapakilala ng sipi.
- source_word: כַּדָּבָר הַזֶּה תְּדַבְּרוּן
  choice: Ganito ang sasabihin ninyo
  rationale: Idyomatiko sa Tagalog at malinaw na tumutukoy sa itinakdang mensahe. Ang literal na pag-uulit ng “salita/magsalita” ay magiging pilit.
- source_word: בְּמֹצַאֲכֶם אֹתוֹ
  choice: kapag nakatagpo ninyo siya
  rationale: Ipinahahayag ang temporal na gamit ng בְּ na may infinitive construct. Ang “nakatagpo” ay nananatiling malapit sa מצא habang natural sa konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Iniwasan ang pagdaragdag ng “lingkod” sa mga ordinal, at ginamit ang idyomatikong “Ganito ang sasabihin ninyo” habang inilalagay sa talababa ang mas pormal na anyo.
