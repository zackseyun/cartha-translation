revisions:
- from: Inutusan din niya ang ikalawa, ang ikatlo, at ang lahat ng sumusunod sa likuran ng mga kawan. Sinabi niya, “Ganito ang sasabihin ninyo kay Esau kapag nakatagpo ninyo siya.”[a]
  to: Inutusan din niya ang ikalawa, ang ikatlo, at ang lahat ng naglalakad sa likod ng mga pangkat ng hayop, na nagsasabi, “Ganito ang sasabihin ninyo kay Esau kapag nakatagpo ninyo siya.”[a]
  rationale: Pinalinaw ang pagtukoy sa mga taong nasa likod ng magkakahiwalay na pangkat ng hayop at ginawang mas malapit sa pormulang Hebreo ang pagpapakilala sa direktang pananalita. Nananatiling idyomatiko ang pangunahing salin ng כַּדָּבָר הַזֶּה תְּדַבְּרוּן, samantalang ibinibigay ng talababa ang mas pormal at word-oriented na alternatibo.
