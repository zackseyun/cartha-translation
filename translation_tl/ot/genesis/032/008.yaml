base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/008.yaml
  text: Then Jacob was very afraid and distressed[a], and he divided the people who were with him, and the flocks, and the herds, and the camels, into two camps.
translation:
  language: tl
  text: Labis na natakot si Jacob at nabagabag siya. Hinati niya sa dalawang kampo[a] ang mga taong kasama niya, ang mga kawan, ang mga baka, at ang mga kamelyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dalawang pangkat.” Ang salitang Hebreo ay maaaring tumukoy sa isang kampo o sa isang organisadong pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא ... מְאֹד
  choice: Labis na natakot
  rationale: Pinagsama ang pandiwa at ang paningit na מְאֹד upang likas na maipahayag sa Tagalog ang matinding takot ni Jacob.
- source_word: וַיֵּצֶר לוֹ
  choice: at nabagabag siya
  rationale: Ipinahahayag ng idyomang Hebreo ang panloob na pagkabalisa o matinding pagkabahala; ang “nabagabag” ay natural at marangal na katumbas.
- source_word: וַיַּחַץ
  choice: Hinati niya
  rationale: Tuwirang inilalarawan ang sinadyang paghahati ni Jacob sa kaniyang kasamang pangkat at mga alagang hayop.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: ang mga taong kasama niya
  rationale: Ang עָם dito ay tumutukoy sa mga taong kabilang sa naglalakbay na sambahayan ni Jacob, hindi sa isang bansa o lahi.
- source_word: הַצֹּאן
  choice: ang mga kawan
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing; pinananatili ng “mga kawan” ang malawak na saklaw nito.
- source_word: הַבָּקָר
  choice: ang mga bakahan
  rationale: Ang בָּקָר ay kolektibong tumutukoy sa mga baka; malinaw na ipinaparis ng “mga bakahan” ang mga ito sa mga kawan.
- source_word: הַגְּמַלִּים
  choice: ang mga kamelyo
  rationale: Tuwiran at karaniwang katumbas sa modernong Tagalog.
- source_word: לִשְׁנֵי מַחֲנוֹת
  choice: sa dalawang kampo
  rationale: Ang מַחֲנֶה ay maaaring tumukoy sa kampo o sa organisadong pangkat. Ang “kampo” ay maikli at nagpapanatili sa terminong ginagamit sa kasunod na salaysay.
