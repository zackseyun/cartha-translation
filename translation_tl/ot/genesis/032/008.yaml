  verdict: revise
  source_fidelity: Tumpak na naipapahayag ng draft ang matinding takot at pagkabagabag ni Jacob, gayundin ang sinadya niyang paghahati sa mga taong kasama niya at sa mga hayop tungo sa dalawang kampo. Ang dalawang pangungusap ay hindi nakapagbabago sa ugnayan ng mga kilos sa Hebreo.
  naturalness: Malinaw at marangal ang pangungusap. Gayunman, ang “mga bakahan” ay maaaring mas karaniwang maunawaan bilang mga lugar o pasilidad na pinag-aalagaan ng baka, kaysa bilang kolektibong katawagan para sa mga baka. Mas natural at walang kalabuan ang “mga baka.”
  terminology: Ang “kampo” ay angkop para sa מַחֲנוֹת at pinananatili ang terminong mahalaga sa daloy ng salaysay. Ang “mga kawan” para sa צֹאן at “mga kamelyo” para sa גמלים ay angkop. Pinalitan ang “mga bakahan” ng “mga baka” para sa בָּקָר.
