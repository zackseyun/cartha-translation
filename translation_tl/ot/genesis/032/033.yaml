base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/033.yaml
  text: Therefore[a], to this day the sons of Israel do not eat the sinew of the hip, which is on the socket of the thigh[d][c][b], because he touched the socket of Jacob’s thigh at the sinew of the hip.
translation:
  language: tl
  text: Kaya, hanggang ngayon, hindi kinakain ng mga Israelita[a] ang litid ng balakang na nasa sugpungan ng hita[b], dahil hinipo niya ang sugpungan ng hita ni Jacob sa litid ng balakang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak na lalaki ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong katawagan ay ayon sa tradisyon ay tumutukoy sa isang partikular na litid o kahawig na himaymay sa may balakang at hita; itinuturing ito ng ilan na nerbiyong siyatiko o litid.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Likas at malinaw na panandang sanhi at bunga sa Filipino.
- source_word: לֹא יֹאכְלוּ
  choice: hindi kinakain
  rationale: Ipinahahayag ng aspektong Filipino ang patuloy na kaugalian nang hindi dinaragdagan ang kahulugan ng pandiwa.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Pinakanatural na modernong Filipino para sa kolektibong katawagan; inilalagay sa talababa ang literal na anyo.
- source_word: גִּיד הַנָּשֶׁה
  choice: litid ng balakang
  rationale: Ang “litid” ay sapat na malawak para sa cord-like tissue na tinutukoy ng גִּיד, at iniiwasan ang di-tiyak na teknikal na pagtukoy rito bilang sciatic nerve o tendon.
- source_word: אֲשֶׁר עַל כַּף הַיָּרֵךְ
  choice: na nasa sugpungan ng hita
  rationale: Ang “sugpungan” ay natural na Filipino para sa bahaging socket/joint, samantalang pinananatili ng “hita” ang konkretong pagtukoy ng יָרֵךְ.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang ngayon
  rationale: Karaniwang idyomang Filipino para sa kaugaliang nagpapatuloy hanggang sa panahon ng tagapagsalaysay.
- source_word: כִּי נָגַע
  choice: dahil hinipo niya
  rationale: Pinananatili ang pangunahing kahulugang “humipo” ng נגע at hindi ito pinalalakas bilang “hinampas.”
- source_word: בְּכַף יֶרֶךְ יַעֲקֹב
  choice: ang sugpungan ng hita ni Jacob
  rationale: Pare-pareho ang salin ng mga terminong anatomikal sa dalawang paglitaw ng parirala.
- source_word: בְּגִיד הַנָּשֶׁה
  choice: sa litid ng balakang
  rationale: Inuulit ang parehong katawagan at inuunawa ang pang-ukol bilang pagtukoy sa lugar ng paghipo.
theological_decisions:
- issue: Hindi tahasang pinangalanan sa talata ang gumaganap ng נָגַע.
  choice: hinipo niya
  alternative: hinipo ng lalaking nakipagbuno kay Jacob
  rationale: Pinananatili ang di-tahasang paksa ng Hebreo at iniiwasang ipasok sa mismong talata ang isang interpretatibong pagkakakilanlan mula sa konteksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga Israelita” sa halip na ang mas literal ngunit di-gaanong likas na “mga anak na lalaki ni Israel.” Iniwasan ang sobrang teknikal na terminong anatomikal dahil hindi tiyak ang eksaktong tinutukoy ng Hebreo.
