  yaml_path: translation/ot/genesis/032/024.yaml
  text: He took them and brought them across the stream[b][a], and he brought across what belonged to him.
translation:
  language: tl
  text: Kinuha niya sila at itinawid sa batis[a]. Itinawid niya ang mga pag-aari niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bangin” o “pana-panahong daluyan ng tubig.” Ang salitang Hebreo na נחל ay maaaring tumukoy sa isang batis, bangin, o daluyang may tubig lamang sa ilang panahon.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang nasa kaniya,” ibig sabihin, ang mga bagay na pag-aari niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵם
  choice: Kinuha niya sila
  rationale: Tuwirang ipinahahayag ng לקח ang pagkuha ni Jacob sa mga taong binanggit sa naunang konteksto; hindi na dinagdagan ng di-tiyak na diwang gaya ng “isinama.”
- source_word: וַיַּעֲבִרֵם
  choice: itinawid
  rationale: 'Ang Hiphil ng עבר ay may diwang sanhi: pinatawid o dinala niya sila sa kabilang panig. Likas at malinaw sa Filipino ang “itinawid.”'
- source_word: הַנָּחַל
  choice: batis
  rationale: Ang נחל ay maaaring tumukoy sa batis, bangin, o pana-panahong daluyan ng tubig. Madaling maunawaan ang “batis” at angkop sa ginagawang pagtawid, habang inilalahad sa talababa ang mas malawak na saklaw ng salita.
- source_word: וַיַּעֲבֵר
  choice: Itinawid din niya
  rationale: Pinananatili nito ang diwang sanhi ng Hiphil at malinaw na inilalapat ang kilos sa mga ari-arian ni Jacob.
- source_word: אֲשֶׁר לוֹ
  choice: ang mga pag-aari niya
  rationale: Literal itong “ang nasa kaniya” o “ang kaniya.” Sa konteksto, tumutukoy ito sa mga bagay na pag-aari ni Jacob; likas sa modernong Filipino ang “mga pag-aari niya.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “itinawid” upang natural na maipahayag ang causative na anyo ng Hebreo, at hinati sa dalawang pangungusap upang maging malinaw nang hindi binabago ang daloy ng salaysay.
