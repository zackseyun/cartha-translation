  text: So the gift passed on ahead of him[a], but he himself stayed that night in the camp.
translation:
  language: tl
  text: Kaya, nagpatuloy sa unahan niya ang regalo[a], ngunit siya mismo ay nanatili sa kampo nang gabing iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaloob.” Ang Hebreong מִנְחָה ay maaaring tumukoy sa regalo, tributo, o handog; dito, tumutukoy ito sa regalong ipinadala ni Jacob kay Esau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲבֹר
  choice: nauna
  rationale: Sa konteksto, ipinahihiwatig ng pandiwa ang pagpapatuloy ng handog sa unahan ni Jacob, hindi ang pagtawid sa isang tahasang binanggit na hangganan o ilog.
- source_word: הַמִּנְחָה
  choice: ang handog
  rationale: Dito, tumutukoy ang מִנְחָה sa regalong ipinadala ni Jacob kay Esau. Ang “handog” ay likas at marangal sa Filipino, at hindi kinakailangang mangahulugang handog sa ritwal.
- source_word: עַל־פָּנָיו
  choice: sa kanya
  rationale: Kasama ng “nauna,” natural nitong ipinapahayag ang idyomatikong diwang “sa unahan niya” nang hindi inuulit ang ideya.
- source_word: וְהוּא
  choice: ngunit siya mismo
  rationale: 'Pinananatili nito ang hayag at kontrasibong panghalip: nauna ang handog, samantalang si Jacob mismo ay nanatili.'
- source_word: לָן
  choice: nanatili
  rationale: Ipinahihiwatig ng pandiwa ang panunuluyan o pagpapalipas ng gabi; malinaw ang “nanatili” dahil kasunod ang “nang gabing iyon.”
- source_word: בַּלַּיְלָה הַהוּא
  choice: nang gabing iyon
  rationale: Natural na modernong Filipino para sa tiyak na panahong tinutukoy.
- source_word: בַּמַּחֲנֶה
  choice: sa kampo
  rationale: Tuwirang katumbas ng lugar na pinagkampuhan o himpilan.
