  terminology: Pinalitan ang “handog” sa pangunahing teksto ng “regalo,” sapagkat ang מִנְחָה rito ay kaloob ni Jacob kay Esau at hindi ritwal na handog. Iningatan sa talababa ang mas malawak na saklaw leksikal, kabilang ang “handog” bilang posibleng kahulugan sa ibang konteksto.
