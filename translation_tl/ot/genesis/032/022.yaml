  source_fidelity: Napananatili ng rebisyon ang kilos ng וַתַּעֲבֹר bilang pagpapatuloy/pagdaan ng kaloob sa unahan ni Jacob, ang idyomang עַל־פָּנָיו bilang “sa unahan niya,” at ang hayag na kontrast ng וְהוּא. Ang “nang gabing iyon” at “sa kampo” ay tapat sa mga pariralang Hebreo.
