  text: He said[a], “If Esau comes to the one camp and strikes it, then the camp that remains will escape.”
translation:
  language: tl
  text: Sinabi niya, “Kung dumating si Esau sa isa sa mga pangkat at salakayin ito, makatatakas ang natitirang pangkat.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang natitirang pangkat ay maliligtas,” o mas literal, “ang natitirang pangkat ay magiging ukol sa pagtakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi niya
  rationale: Likas na salaysay sa nakaraang panahunan para sa karaniwang Hebrew wayyiqtol ng אמר; hindi kailangang tahasang isalin ang pang-ugnay.
- source_word: אִם
  choice: Kung
  rationale: Pinananatili ang kondisyon at kawalang-katiyakan sa pangangatwiran ni Jacob.
- source_word: יָבֹא עֵשָׂו
  choice: dumating si Esau
  rationale: Ipinananatili ang payak na diwa ng בוא na ‘dumating/pumarito’; nasa kasunod na pandiwa ang kilos na mapanakit.
- source_word: אֶל־הַמַּחֲנֶה הָאַחַת
  choice: sa isang pangkat
  rationale: Tumutukoy sa isa sa dalawang pangkat na binuo ni Jacob. Mas natural sa Filipino ang ‘isang pangkat’ kaysa ‘ang isang kampo’ sa kontekstong mga tao at ari-arian.
- source_word: וְהִכָּהוּ
  choice: at salakayin iyon
  rationale: Sa kontekstong si Esau ay paparating laban sa isang buong pangkat, natural na ipinahahayag ng ‘salakayin’ ang נכה; ang panghalip ay tumutukoy sa pangkat bilang kabuuan.
- source_word: הַמַּחֲנֶה הַנִּשְׁאָר
  choice: ang natitirang pangkat
  rationale: Malinaw at natural na katumbas ng pangkat na maiiwan o mananatili matapos salakayin ang isa.
- source_word: לִפְלֵיטָה
  choice: makatatakas
  rationale: Natural na ginagawang pandiwa sa Filipino ang pangngalang tumutukoy sa pagtakas o pagkaligtas, nang hindi ipinapasok ang mas teolohikal na ‘pagliligtas.’
