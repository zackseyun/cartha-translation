translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘pangkat’ sa halip na ‘kampo’ dahil mga tao, sambahayan, at kawan ang hinati ni Jacob sa dalawang pangkat. Inilagay ang talababa pagkatapos ng buong pangungusap, at naroon ang katugmang marker na [a] sa pangunahing teksto.
