  naturalness: Natural at angkop ang “Mayroon akong,” “mga baka at asno,” “mga kawan,” at “paglingap.” Mas malinaw at mas likas sa modernong Filipino ang “Nagpadala ako ng mensahe ... upang ipaalam ito” kaysa “Nagpasabi ako nito sa iyo.”
