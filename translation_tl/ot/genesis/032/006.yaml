  yaml_path: translation/ot/genesis/032/006.yaml
  text: I have oxen and donkeys[a], flocks, male servants and female servants, and I have sent to tell my lord, so that I may find favor in your eyes.
translation:
  language: tl
  text: Mayroon akong mga baka at asno, mga kawan, at mga aliping lalaki at babae[a]. Nagpadala ako ng mensahe sa aking panginoon upang ipaalam ito, upang makamit ko ang iyong paglingap.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lingkod na lalaki at babae.” Ang mga salitang Hebreo ay maaaring tumukoy sa mga taong nakataling maglingkod sa isang sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִי
  choice: Mayroon akong
  rationale: Ang konstruksiyong היה + ל ay idyoma ng pag-aari; natural itong ipinahahayag sa modernong Tagalog bilang “mayroon akong.”
- source_word: שׁוֹר וַחֲמוֹר
  choice: mga baka at asno
  rationale: Ginamit nang kolektibo ang mga pangngalang Hebreo. Ang “baka” ay likas at sapat na malawak para sa bovine livestock, at ang “asno” ang malinaw na modernong tawag sa חֲמוֹר.
- source_word: צֹאן
  choice: mga kawan
  rationale: Kolektibong tumutukoy ang צֹאן sa maliliit na hayop, lalo na sa mga tupa at kambing; pinananatili ng “mga kawan” ang saklaw nang hindi labis na tinutukoy ang uri.
- source_word: עֶבֶד וְשִׁפְחָה
  choice: mga aliping lalaki at babae
  rationale: Sa talaan ng sambahayan at mga pag-aari, ipinahihiwatig ng mga salita ang nakataling katayuan sa paglilingkod. Pinananatili rin ng salin ang tahasang pagkakaiba ng kasarian.
- source_word: וָאֶשְׁלְחָה לְהַגִּיד לַאדֹנִי
  choice: Nagpasabi ako nito sa iyo, panginoon ko
  rationale: Likas sa Tagalog ang “nagpasabi” para sa pagpapadala ng mensahe. Ginawang tuwirang patungkol kay Esau ang parirala upang maging malinaw ang daloy ng siniping mensahe, habang pinananatili ang mapagpakumbabang tawag na “panginoon ko.”
- source_word: לִמְצֹא חֵן בְּעֵינֶיךָ
  choice: upang makamit ko ang iyong paglingap
  rationale: Ito ang natural na Tagalog para sa Hebreong idyoma ng pagtatamo ng mabuting pagtingin; pinananatili nito ang layuning ipinahahayag ng לִמְצֹא.
theological_decisions:
- issue: Katayuan ng עֶבֶד at שִׁפְחָה sa talaan ng sambahayan
  choice: mga aliping lalaki at babae
  alternative: mga lingkod na lalaki at babae
  rationale: Dahil kasama sila sa talaan ng mga pag-aari ni Jacob, mas malinaw na naihahayag ng “alipin” ang hindi malayang katayuang maaaring taglay ng mga terminong Hebreo. Gayunman, inilalagay sa talababa ang “lingkod” dahil maaaring ituon ng mga salita ang gampanin sa sambahayan, at hindi ganap na inilalarawan ng talata ang kanilang legal na kalagayan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “panginoon ko” bilang magalang na tawag kay Esau, hindi bilang banal na titulo. Inilipat ang talababa sa pariralang talagang tinutukoy nito, sa halip na sa “mga asno.”
