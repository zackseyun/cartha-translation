revisions:
- from: Pagkatapos, sabihin mo, “Ang mga ito ay sa lingkod ninyong si Jacob. Handog[a] po ito na ipinadala sa panginoon kong si Esau. At narito, nasa likuran din po namin siya[b].”
  to: Pagkatapos, sabihin mo, “Ang mga ito ay pag-aari ng lingkod ninyong si Jacob. Kaloob[a] ito na ipinadala sa panginoon kong si Esau; at narito, siya rin ay nasa likuran namin[b].”
  rationale: Binago ang unang sugnay upang maging idiomatikong Filipino at malinaw na maipakita na ang mga hayop ay kay Jacob. Pinalitan ang “handog” ng “kaloob” upang maiwasan ang posibleng kultikong kahulugan, habang pinananatili ito bilang alternatibo sa talababa. Inayos ang huling sugnay upang ang “rin” ay malinaw na tumukoy kay Jacob bilang karagdagan sa kaloob at sa mga lingkod. Napanatili ang parehong mga footnote anchor at ang kahulugan ng mga ito.
