translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “po” at mga anyong “ninyo/namin” ay natural na nagpapakita ng paggalang ng lingkod habang inuulit niya ang mapagpakumbabang pananalita ni Jacob. Nilinaw ang ipinahihiwatig na simuno ng unang sugnay mula sa naunang tanong, nang hindi pinagsasama ang dalawang magkahiwalay na nominal na pahayag sa Hebreo.
