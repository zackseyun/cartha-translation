base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/019.yaml
  text: Then you shall say[a], ‘Your servant Jacob's gift is sent to my lord, to Esau; and look[b], he also is behind us.’
translation:
  language: tl
  text: Pagkatapos, sabihin mo, “Ang mga ito ay pag-aari ng lingkod ninyong si Jacob. Kaloob[a] ito na ipinadala sa panginoon kong si Esau; at narito, siya rin ay nasa likuran namin[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “regalo” o “handog.” Ang salitang Hebreo na minḥah ay tumutukoy rito sa kaloob na ipinadala upang mapalubag ang loob ni Esau.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sumusunod siya sa amin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָ
  choice: Pagkatapos, sabihin mo
  rationale: Ang waw na sinusundan ng perfect ay nagpapatuloy sa sunod-sunod na tagubilin ni Jacob. Likas sa Tagalog ang “Pagkatapos, sabihin mo” at napapanatili nito ang puwersa ng utos.
- source_word: לְעַבְדְּךָ לְיַעֲקֹב
  choice: Ang mga ito ay sa lingkod ninyong si Jacob
  rationale: Sinasagot ng parirala ang tanong sa naunang talata kung kanino ang mga hayop. Idinagdag ang “Ang mga ito” bilang likas na pagpuno sa ipinahihiwatig na simuno, habang pinananatili ng “lingkod ninyo” ang mapagpakumbabang pagtukoy ni Jacob sa sarili niya sa harap ni Esau.
- source_word: מִנְחָה
  choice: Handog
  rationale: Sa salaysay na ito, tumutukoy ang minḥah sa kaloob na ipinadala upang mapalubag ang loob ni Esau, hindi sa isang kultikong alay. Ang “handog” ay marangal at angkop sa isang bagay na pormal na inihaharap.
- source_word: שְׁלוּחָה
  choice: ipinadala
  rationale: Ang passive participle ay naglalarawan sa handog bilang bagay na ipinadala. Tuwiran at natural sa Tagalog ang “ipinadala.”
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: sa panginoon kong si Esau
  rationale: Ang אָדוֹן ay magalang na tawag ni Jacob kay Esau. Pinananatili ng “panginoon ko” ang pagpapakumbaba, at likas na ipinapahayag ng pang-ugnay na “si” ang apposisyon sa Tagalog.
- source_word: וְהִנֵּה גַם הוּא אַחֲרֵינוּ
  choice: At narito, nasa likuran din po namin siya
  rationale: Iginigiit ng הִנֵּה na pansinin ang kasunod na pahayag; ang “narito” ay marangal ngunit kasalukuyang gamit. Pinananatili ng “din” ang diin ng גַּם, at ang “nasa likuran namin” ang tuwirang kahulugan ng אַחֲרֵינוּ.
