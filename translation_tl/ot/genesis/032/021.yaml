  text: וַ/אֲמַרְתֶּ֕ם גַּ֗ם הִנֵּ֛ה עַבְדְּ/ךָ֥ יַעֲקֹ֖ב אַחֲרֵ֑י/נוּ כִּֽי אָמַ֞ר אֲכַפְּרָ֣ה פָנָ֗י/ו בַּ/מִּנְחָה֙ הַ/הֹלֶ֣כֶת לְ/פָנָ֔/י וְ/אַחֲרֵי כֵן֙ אֶרְאֶ֣ה פָנָ֔י/ו אוּלַ֖י יִשָּׂ֥א פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/021.yaml
  text: And you shall also say[a], ‘Look, your servant Jacob is behind us,’ for he said, ‘I will appease him with the gift that is going ahead of me, and afterward I will see his face[b]; perhaps he will accept me.’
translation:
  language: tl
  text: At sabihin din ninyo, “Narito, nasa likuran namin ang lingkod mong si Jacob.” Sapagkat sinabi niya, “Palulubagin ko siya sa pamamagitan ng regalong nauuna sa akin, at pagkatapos ay makikita ko ang mukha niya; baka tanggapin niya ako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲמַרְתֶּם גַּם
  choice: At sabihin din ninyo
  rationale: Pinananatili ang utos sa maramihan at ang diwa ng גַּם bilang karagdagang sasabihin ng mga sugo.
- source_word: הִנֵּה
  choice: Narito
  rationale: Likas at marangal na pantawag-pansin sa modernong Filipino; hindi kasing-kaswal ng “Tingnan ninyo.”
- source_word: עַבְדְּךָ
  choice: ang lingkod mong
  rationale: Ipinahahayag ang mapagpakumbabang pananalita ni Jacob kay Esau nang hindi ipinahihiwatig ang legal na kalagayan ng isang alipin.
- source_word: אַחֲרֵינוּ
  choice: nasa likuran namin
  rationale: Tuwirang inilalarawan ang posisyon ni Jacob na sumusunod sa mga sugo.
- source_word: אֲכַפְּרָה פָנָיו
  choice: Palulubagin ko ang kalooban niya
  rationale: Sa di-kultikong ugnayang pantao rito, ang כפר ay tumutukoy sa pagpapahupa ng galit o pagkamit ng mabuting pagtanggap. Ang likas na idyomang Filipino ay naghahatid ng kahulugan nang hindi nag-aangkat ng ritwal na pagbabayad-sala.
- source_word: מִנְחָה
  choice: regalo
  rationale: Tumutukoy ito sa handog na pampalubag kay Esau. Ang “regalo” ay malinaw at hindi kusang nagpapahiwatig ng ritwal na handog.
- source_word: הַהֹלֶכֶת לְפָנַי
  choice: nauuna sa akin
  rationale: Maikli at natural na inilalarawan ang regalong ipinadala sa unahan ni Jacob.
- source_word: אֶרְאֶה פָנָיו
  choice: haharap ako sa kanya
  rationale: Natural na Filipino para sa pakikipagkita nang harapan, habang naipagpapatuloy ang motibo ng mukha/pagharap sa paraang hindi pilit.
- source_word: אוּלַי יִשָּׂא פָנָי
  choice: baka tanggapin niya ako
  rationale: Ang idyomang Hebreo na “iangat ang aking mukha” ay nangangahulugang tanggapin nang may pabor. Pinananatili ng “baka” ang pag-asa at kawalang-katiyakan ni Jacob.
theological_decisions:
- issue: Ang kahulugan ng כפר sa pakikipagkasundo ni Jacob kay Esau
  choice: Palulubagin ko ang kalooban niya
  alternative: Gagawa ako ng pambayad-sala sa harap niya
  rationale: Ang tuwirang layon ay ang “mukha” ni Esau at ang paraan ay isang regalo; kaya interpersonal na pagpapalubag ang konteksto, hindi ritwal na pagtubos o paghahandog.
- issue: Ang idyomang יִשָּׂא פָנָי
  choice: baka tanggapin niya ako
  alternative: baka iangat niya ang aking mukha
  rationale: Ang literal na anyo ay hindi likas at maaaring maging malabo sa Filipino. Ang napiling salin ay naghahatid ng paborableng pagtanggap nang hindi ginagawang tiyak ang inaasahan ni Jacob.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at malinaw. Ginamit ang “lingkod” bilang magalang at mapagpakumbabang pagtukoy sa sarili. Isinalin nang idyomatiko ang tatlong paggamit ng פָנִים—kalooban, pagharap, at pagtanggap—upang mapanatili ang lohika ng tagpo, bagaman hindi lubusang maisasalin ang Hebreong paglalaro sa salitang “mukha.”
