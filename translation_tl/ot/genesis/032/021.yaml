  to: At sabihin din ninyo, “Narito, nasa likuran namin ang lingkod mong si Jacob.” Sapagkat sinabi niya, “Palulubagin ko siya sa pamamagitan ng regalong nauuna sa akin, at pagkatapos ay makikita ko ang mukha niya; baka tanggapin niya ako.”
