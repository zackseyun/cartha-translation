  yaml_path: translation/ot/genesis/032/003.yaml
  text: When Jacob saw them[a], he said, “This is God’s camp.” So he called the name of that place Mahanaim.
translation:
  language: tl
  text: Nang makita sila ni Jacob, sinabi niya, “Kampo ito ng Diyos.” Kaya tinawag niyang Mahanaim[a] ang lugar na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang pangalang Mahanaim ay kahawig sa tunog ng “dalawang kampo” o “dobleng kampo,” at iniuugnay nito ang pangalan sa sinabi ni Jacob na “Kampo ito ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sinabi niya
  rationale: Payak at tapat na salin ng pandiwang nagsisimula sa sinabi ni Jacob; hindi dinaragdagan ng bagay na wala sa Hebreo.
- source_word: כַּאֲשֶׁר רָאָם
  choice: Nang makita sila
  rationale: Ipinahahayag ng כַּאֲשֶׁר ang panahong kaugnayan, at ang hulaping maramihan sa רָאָם ay tumutukoy sa mga anghel ng Diyos sa naunang talata.
- source_word: מַחֲנֵה
  choice: kampo
  rationale: Karaniwan at malinaw na katumbas na nagpapanatili rin sa paglalaro ng salita sa pangalang Mahanaim.
- source_word: אֱלֹהִים
  choice: ng Diyos
  rationale: Sa pariralang konstrakto, tumutukoy ito sa kampong pag-aari o kaugnay ng Diyos; natural sa Filipino ang “ng Diyos.”
- source_word: זֶה
  choice: ito
  rationale: Gumaganap na panaguri ang demonstratibo; natural na naihahayag sa “Kampo ito ng Diyos.”
- source_word: וַיִּקְרָא שֵׁם
  choice: tinawag niyang
  rationale: Natural na Filipino para sa idyomang Hebreo na literal na “tinawag ang pangalan,” nang hindi nawawala ang kilos ng pagbibigay ng pangalan.
- source_word: הַמָּקוֹם הַהוּא
  choice: ang lugar na iyon
  rationale: Pinananatili ang tiyak at panturong diwa ng pariralang Hebreo.
- source_word: מַחֲנָיִם
  choice: Mahanaim
  rationale: Isinasatitik ang pangalan ng lugar sa halip na isalin sa pangunahing teksto; ipinaliliwanag sa talababa ang posibleng diwang dalawahan at ang ugnayan nito sa “kampo.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “kampo” upang mapanatili ang pag-uugnay ng מַחֲנֶה sa pangalang מַחֲנָיִם. Inilipat ang talababa sa “Mahanaim,” na siyang salitang aktuwal na ipinaliliwanag nito.
