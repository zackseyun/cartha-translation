  text: וַ/יֹּאמֶר֮ יַעֲקֹב֒ אֱלֹהֵי֙ אָבִ֣/י אַבְרָהָ֔ם וֵ/אלֹהֵ֖י אָבִ֣/י יִצְחָ֑ק יְהוָ֞ה הָ/אֹמֵ֣ר אֵלַ֗/י שׁ֧וּב לְ/אַרְצְ/ךָ֛ וּ/לְ/מוֹלַדְתְּ/ךָ֖ וְ/אֵיטִ֥יבָה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/010.yaml
  text: And Jacob said[a], “O God of my father Abraham and God of my father Isaac, O Yahweh, who said to me, ‘Return to your land and to your kindred[b], and I will do you good,’”
translation:
  language: tl
  text: At sinabi ni Jacob, “O Diyos ng ninuno kong si Abraham at Diyos ng ama kong si Isaac, O Yahweh, na nagsabi sa akin, ‘Bumalik ka sa iyong lupain at sa iyong mga kamag-anak[a], at pakikitunguhan kita nang mabuti[b],’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa iyong bayang pinagmulan.” Maaaring tumukoy ang salitang Hebreo sa mga kaanak o sa sariling lupain o bayang pinagmulan.
    reason: lexical_ambiguity
  - marker: b
    text: O “magiging mabuti ako sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; pinananatili ng “At sinabi” ang daloy nang hindi dinaragdagan ang tiyak na ugnayang temporal o sanhi.
- source_word: אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק
  choice: O Diyos ng aking amang si Abraham at Diyos ng aking amang si Isaac
  rationale: Tuwirang inililipat ang dalawang pariralang construct, at ang “O” ay likas na panandang pantawag sa isang panalangin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הָאֹמֵר אֵלַי
  choice: na nagsabi sa akin
  rationale: Ang participle na may pantukoy ay naglalarawan kay Yahweh bilang siyang nagsalita; natural itong ipinahahayag sa Filipino bilang sugnay na panuring.
- source_word: שׁוּב לְאַרְצְךָ
  choice: Bumalik ka sa iyong lupain
  rationale: Pinananatili ng “bumalik” ang heograpikal na diwa ng utos, at ang “lupain” ay angkop sa konteksto ng mga patriyarka.
- source_word: וּלְמוֹלַדְתְּךָ
  choice: at sa iyong mga kamag-anak
  rationale: Maaaring tumukoy ang מוֹלֶדֶת sa pangkat ng kaanak o sa lupaing pinagmulan. Ang “mga kamag-anak” ay natural sa konteksto, habang inilalahad sa talababa ang tunay na alternatibo.
- source_word: וְאֵיטִיבָה עִמָּךְ
  choice: at gagawan kita ng kabutihan
  rationale: Ipinahahayag nito ang mapagpalang pakikitungo ng Hiphil ng יטב kasama ang עִם, nang hindi ito pinapaliit sa materyal na pagpapala lamang.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tuwirang ginagamit sa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Saklaw ng pangakong וְאֵיטִיבָה עִמָּךְ
  choice: gagawan kita ng kabutihan
  alternative: pagpapalain kita
  rationale: Mas malawak ang idyomang Hebreo kaysa sa salitang “pagpapalain”; pinananatili ng napiling salin ang kabutihan ng pakikitungo nang hindi nililimitahan ang uri nito.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “O” upang malinaw ang tuwirang pagtawag sa panalangin. Pinanatili ang bahagyang pormal na “lupain” dahil angkop ito sa salaysay ng mga patriyarka; iniwasan ang mas doktrinal o mas makitid na “pagpapalain kita.”
