revisions:
- from: At sinabi ni Jacob, “O Diyos ng aking amang si Abraham at Diyos ng aking amang si Isaac, O Yahweh, na nagsabi sa akin, ‘Bumalik ka sa iyong lupain at sa iyong mga kamag-anak[a], at gagawan kita ng kabutihan[b],’”
  to: At sinabi ni Jacob, “O Diyos ng ninuno kong si Abraham at Diyos ng ama kong si Isaac, O Yahweh, na nagsabi sa akin, ‘Bumalik ka sa iyong lupain at sa iyong mga kamag-anak[a], at pakikitunguhan kita nang mabuti[b],’”
  rationale: Pinalitan ang pananalitang maaaring magmukhang si Abraham ang literal na ama ni Jacob ng “ninuno kong si Abraham,” samantalang pinanatili ang “ama kong si Isaac.” Pinalitan din ang di-likas na “gagawan kita ng kabutihan” ng natural at tapat-sa-diwing “pakikitunguhan kita nang mabuti.” Hindi binago ang saklaw ng pangako o ang natitirang mga ambigwidad ng teksto.
