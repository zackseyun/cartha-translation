- from: Ipinagkatiwala niya sa kanyang mga lingkod ang bawat pangkat ng mga hayop nang bukod-bukod[a], at sinabi niya sa kanila, “Mauna kayo sa akin, at maglagay kayo ng agwat sa pagitan ng bawat pangkat.”[b]
  to: Ipinagkatiwala niya sa kanyang mga lingkod ang bawat pangkat ng mga hayop nang bukod-bukod[a], at sinabi niya sa kanila, “Mauna kayo sa akin, at maglagay kayo ng agwat sa pagitan ng isang pangkat at ng kasunod na pangkat.”[b]
  rationale: Inayos ang huling parirala upang malinaw na maipahayag ang pagitan ng magkahiwalay na mga pangkat at upang mapanatili ang distributibong diin ng inuulit na Hebreong “kawan ... kawan.” Iniayon din ang talababa a sa terminolohiya ng pangunahing teksto. Walang binagong kahulugan.
