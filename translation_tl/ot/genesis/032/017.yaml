base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/017.yaml
  text: He put each herd by itself into the hand of his servants[a], and said to his servants, “Pass on ahead of me[d][c][b], and put a space between herd and herd.”
translation:
  language: tl
  text: Ipinagkatiwala niya sa kanyang mga lingkod ang bawat pangkat ng mga hayop nang bukod-bukod[a], at sinabi niya sa kanila, “Mauna kayo sa akin, at maglagay kayo ng agwat sa pagitan ng isang pangkat at ng kasunod na pangkat.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “inilagay niya sa kamay ng kanyang mga lingkod ang bawat pangkat nang bukod-bukod.” Ang “sa kamay” ay idyoma para sa pagpapasailalim sa pangangalaga o pamamahala ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: O “maglagay kayo ng agwat sa pagitan ng isang pangkat at ng isa pang pangkat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּיַד עֲבָדָיו
  choice: Ipinagkatiwala niya sa kanyang mga lingkod
  rationale: Ang literal na ‘ibinigay sa kamay’ ay isang idyoma ng pagpapasailalim sa pangangalaga o pamamahala ng iba. Likas na ipinahahayag ng ‘ipinagkatiwala’ ang kahulugan nito sa modernong Tagalog.
- source_word: עֵדֶר עֵדֶר לְבַדּוֹ
  choice: ang bawat pangkat ng mga hayop nang bukod-bukod
  rationale: 'Ang pag-uulit ng עֵדֶר ay distributibo: isa-isang pangkat na magkakahiwalay. Mas angkop ang pangkalahatang ‘pangkat ng mga hayop’ dahil halo-halong uri ng hayop ang nasa konteksto.'
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Maaaring mangahulugang alipin o lingkod ang עבד, ngunit dito ay mga tauhan ng sambahayan na sumusunod sa utos ni Jacob ang tinutukoy; ‘mga lingkod’ ang angkop at dignified na salin.
- source_word: עִבְרוּ לְפָנַי
  choice: Mauna kayo sa akin
  rationale: Sa kontekstong paglalakbay, ang עבר ay tumutukoy sa pagdaan o pagpapatuloy sa unahan, hindi kinakailangang sa pagtawid sa isang tiyak na bagay.
- source_word: וְרֶוַח תָּשִׂימוּ
  choice: maglagay kayo ng agwat
  rationale: Ang רֶוַח ay espasyo o pagitan; malinaw at natural sa Tagalog ang ‘agwat’ para sa sinadyang paghihiwalay ng mga pangkat.
- source_word: בֵּין עֵדֶר וּבֵין עֵדֶר
  choice: sa pagitan ng bawat pangkat
  rationale: Ipinahihiwatig ng inuulit na Hebreong parirala ang pagitan mula sa isang pangkat tungo sa kasunod. Ang ‘sa pagitan ng bawat pangkat’ ang likas na Tagalog na nagpapanatili sa distributibong diwa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘pangkat ng mga hayop’ sa halip na ‘kawan’ upang masaklaw ang magkakaibang uri ng hayop sa agarang konteksto; inilagay ang panandang [b] pagkatapos ng buong sipi dahil tumutukoy ito sa huling parirala.
