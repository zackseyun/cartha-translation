  text: And he said to him, “What is your name?” And he said, “Jacob.”
translation:
  language: tl
  text: At sinabi niya sa kanya, “Ano ang pangalan mo?” At sinabi niya, “Jacob.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Ang waw-consecutive kasama ng אָמַר ay nagpapatuloy sa salaysay. Pinananatili ng “At sinabi niya” ang daloy ng Hebreo nang hindi dinaragdagan ng tiyak na temporal na kahulugan.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Ang אֶל na may panlaping ikatlong panauhang panlalaki ay tumutukoy sa taong kinakausap; natural sa makabagong Tagalog ang “sa kanya.”
- source_word: מַה שְּׁמֶךָ
  choice: Ano ang pangalan mo?
  rationale: Tuwirang tanong ito tungkol sa pangalan. Ang “Ano ang pangalan mo?” ang malinaw at likas na katumbas sa Tagalog.
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinanatili ang karaniwang kahulugan ng אָמַר na “sinabi,” kahit gumaganap itong sagot sa konteksto.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Ginamit ang nakagawiang anyo ng pangalang pantangi sa Filipino sa halip na isalin ang posibleng kahulugan nito.
