  text: The sun rose upon him as he passed Penuel[c][b][a], and he was limping on his thigh.
translation:
  language: tl
  text: Sumikat ang araw sa kanya nang dumaan siya sa Penuel[a], at siya ay umiika dahil sa kanyang hita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Penuel ang baybay ng pangalan ng lugar sa Hebreo rito; lumilitaw din itong Peniel sa ibang talata.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “sa kanyang hita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַח לוֹ הַשֶּׁמֶשׁ
  choice: Pagsikat ng araw sa kanya
  rationale: Ipinahahayag ng זרח kasama ng הַשֶּׁמֶשׁ ang pagsikat ng araw, at pinananatili ng “sa kanya” ang pananaw ng Hebreong לוֹ nang natural sa Tagalog.
- source_word: כַּאֲשֶׁר עָבַר
  choice: dumaan siya
  rationale: Temporal ang כַּאֲשֶׁר, at maaaring ipahayag sa Tagalog sa hulma ng sabayang pangyayari; ang עָבַר ay natural na “dumaan” sa isang lugar.
- source_word: אֶת פְּנוּאֵל
  choice: sa Penuel
  rationale: Sinusunod ang anyong פְּנוּאֵל sa talatang ito sa halip na itugma sa alternatibong baybay na Peniel.
- source_word: וְהוּא צֹלֵעַ
  choice: at napilay ang kanyang paglakad
  rationale: Ang participle na צֹלֵעַ ay naglalarawan sa patuloy niyang pag-ika. Ang parirala ay malinaw at marangal sa modernong Tagalog nang hindi nagsasabing permanente siyang pilay.
- source_word: עַל יְרֵכוֹ
  choice: dahil sa kanyang hita
  rationale: Maaaring gumamit ang עַל ng sanhi sa kontekstong ito. Iniiwasan nitong maging alanganin ang literal na “sa ibabaw ng kanyang hita,” habang pinananatili ang יָרֵךְ bilang “hita” at hindi inaangkat ang mas tiyak na “kasukasuan ng balakang” mula sa naunang konteksto.
theological_decisions:
- issue: Kung ilalarawan ang pinsala bilang pansamantala o permanenteng kapansanan
  choice: napilay ang kanyang paglakad
  alternative: siya ay pilay
  rationale: Ang Hebreo ay participle na naglalarawan sa kasalukuyang paraan ng paglakad; hindi nito kinakailangang ipasiya rito kung permanente ang kalagayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pangalan ng lugar ayon sa anyong nasa WLC at nilinaw sa talababa ang alternatibong baybay. Ginawang natural ang Hebreong idyoma tungkol sa pag-ika nang hindi labis na tinutukoy ang anatomiya o pagiging permanente ng pinsala.
