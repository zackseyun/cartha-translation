  text: וַ/יֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְ/ךָ֔ כִּ֖י אִם יִשְׂרָאֵ֑ל כִּֽי שָׂרִ֧יתָ עִם אֱלֹהִ֛ים וְ/עִם אֲנָשִׁ֖ים וַ/תּוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/029.yaml
  text: And he said[a], “Your name shall no longer be called Jacob, but Israel, because you have striven with God and with men[b], and have prevailed.”
translation:
  language: tl
  text: At sinabi niya, “Hindi na Jacob ang magiging pangalan mo, kundi Israel, sapagkat nakipaglaban ka sa Diyos[a] at sa mga tao[b], at nanaig ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga diyos” o “mga makalangit na nilalang.” Sa ilang konteksto, ang Hebreong אֱלֹהִים ay maaaring tumukoy sa Diyos, sa mga diyos, o sa mga makalangit na nilalang. “Diyos” ang ginamit dito dahil sa konteksto ng salaysay.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “mga lalaki.” Ang Hebreo ay maaari ring tumukoy sa mga tao sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָמֵר
  choice: ang itatawag sa iyo
  rationale: Sa pormula ng pagpapalit ng pangalan, ang pasibong anyo ng אמר ay likas na naipapahayag sa Filipino bilang “itatawag sa iyo,” hindi bilang literal na “sasabihin.”
- source_word: עוֹד
  choice: hindi na
  rationale: Ipinahihiwatig dito ang pagtigil sa dating katawagan; malinaw at natural sa modernong Filipino ang “hindi na.”
- source_word: כִּי אִם
  choice: kundi
  rationale: Naghahayag ito ng tuwirang pagsalungat sa pormulang “hindi X, kundi Y.”
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinanatili ang pangalan sa karaniwang transliterasyon; ang kasunod na paliwanag ang nagdadala ng paglalaro sa tunog at kahulugan ng pangalang Hebreo.
- source_word: שָׂרִיתָ
  choice: nakipaglaban ka
  rationale: Ipinahahayag ng pandiwa ang pakikipagtunggali o pakikipaglaban at inuugnay sa pangalang Israel. Ang “nakipaglaban” ay malinaw, marangal, at hindi naglilimita sa kilos sa pisikal na pakikipagbuno lamang.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Sa konteksto ng salaysay, ang isahang “Diyos” ang pinakamalamang na tinutukoy, habang pinananatili sa talababa ang tunay na saklaw ng salitang Hebreo.
- source_word: אֲנָשִׁים
  choice: mga tao
  rationale: Ang אֲנָשִׁים ay maaaring tumukoy sa mga lalaki o sa mga tao sa pangkalahatan. Ang “mga tao” ang pinakanatural na Filipino at malinaw na kaagapay ng “Diyos” sa pangungusap.
- source_word: וַתּוּכָל
  choice: at nanaig ka
  rationale: Sa konteksto, inilalarawan ng יכל ang matagumpay na kinalabasan ng pakikipagtunggali. Ang “nanaig” ay hindi nagpapahiwatig nang labis ng ganap na pagwasak o pagsakop.
theological_decisions:
- issue: Ang tinutukoy ng אֱלֹהִים sa paliwanag sa pangalan
  choice: Diyos
  alternative: mga diyos o mga makalangit na nilalang
  rationale: Itinuturing ng agarang konteksto ang mahiwagang nakatunggali ni Jacob bilang pakikipagtagpo sa Diyos, ngunit hindi lubusang inaalis ng salita at ng salaysay ang hiwaga tungkol sa anyo o pagkakakilanlan ng nakatunggali. Kaya “Diyos” ang nasa teksto at nasa talababa ang alternatibo.
- issue: Saklaw ng אֲנָשִׁים
  choice: mga tao
  alternative: mga lalaki o mga mortal
  rationale: Hindi kailangang gawing eksklusibong panlalaki sa Filipino ang pangngalang Hebreo, na maaari ring gamitin para sa mga tao sa pangkalahatan. Pinananatili ng “mga tao” ang pangunahing paghahambing sa Diyos, habang itinatala sa talababa ang mas tiyak na alternatibo.
translation_notes:
  register: Gumamit ng natural at marangal na modernong Filipino. Pinanatili ang maikli at pormal na hulma ng pagpapalit ng pangalan, pati ang tensiyon sa mahiwagang pakikipagtunggali kay אֱלֹהִים. Ang “nakipaglaban” at “nanaig” ay madaling maunawaan ngunit sapat na malawak upang hindi gawing pisikal na pakikipagbuno lamang ang kahulugan.
