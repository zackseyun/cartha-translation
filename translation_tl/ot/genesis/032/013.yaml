translation:
  language: tl
  text: Ngunit sinabi mo, “Tiyak na gagawa ako ng mabuti para sa iyo[a], at gagawin kong kasindami ng buhangin sa dalampasigan ang iyong mga supling[b], na hindi mabibilang[c] dahil sa dami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, magkasunod na ginagamit ang isang infinitive absolute at pandiwang may kaparehong ugat upang magbigay-diin: “Tiyak na gagawa ako ng mabuti para sa iyo.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “iyong mga inapo.” Ang Hebreong זֶרַע ay pangngalang isahan na tumutukoy sa mga supling bilang isang pangkat.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “hindi matutuos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה אָמַרְתָּ
  choice: Ngunit sinabi mo
  rationale: Ang malayang panghalip na kasama ng pang-ugnay ay nagbibigay-diin sa tuwirang pagsamo ni Jacob at naghaharap ng pangako ng Diyos laban sa kasalukuyang panganib. Likas sa Filipino ang “Ngunit sinabi mo” para sa ganitong paghahambing.
- source_word: הֵיטֵב אֵיטִיב עִמָּךְ
  choice: Tiyak na gagawan kita ng mabuti
  rationale: Ang infinitive absolute na kasunod ng pandiwang may kaparehong ugat ay nagpapalakas sa katiyakan ng pangako. Pinananatili ng “tiyak” ang diin, at natural na ipinahahayag ng “gagawan kita ng mabuti” ang kapakinabangang nakatuon sa kausap.
- source_word: וְשַׂמְתִּי
  choice: at gagawin kong
  rationale: Sa konteksto ng pagpaparami sa mga supling, idiomatikong nangangahulugan ang שׂים na “gawin” sa halip na literal na “ilagay.”
- source_word: זַרְעֲךָ
  choice: iyong mga supling
  rationale: Ang זֶרַע ay kolektibong pangngalang isahan. Ang “mga supling” ay malinaw at dignidad na katumbas sa modernong Filipino, habang hindi gumagamit ng literal ngunit maaaring malabong “binhi.”
- source_word: כְּחוֹל הַיָּם
  choice: gaya ng buhangin sa dagat
  rationale: Pinananatili nito ang Hebreong pagtutulad at natural itong basahin sa Filipino.
- source_word: אֲשֶׁר לֹא יִסָּפֵר מֵרֹב
  choice: na hindi mabibilang dahil sa dami
  rationale: Ipinahahayag ng Niphal imperfect ang praktikal na imposibilidad ng pagbilang, at ipinakikita ng מֵרֹב na ang napakaraming bilang ang dahilan.
