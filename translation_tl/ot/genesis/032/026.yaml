  source_fidelity: Tumpak na naipapahayag ng draft ang pagkakita, hindi pagdaig, paghipo, pagkalinsad, at kasabay na pakikipagbuno. Napananatili rin nito ang hindi tahasang pagkakakilanlan ng mga tinutukoy ng panghalip. Gayunman, ang “rito” sa hulíng parirala ay karaniwang panuring na panlunan sa modernong Filipino at hindi angkop na katumbas ng personal na “sa kaniya/sa kanya” sa עִמּוֹ.
  naturalness: Likas sa pangkalahatan ang daloy. Mas natural at malinaw ang “nakikipagbuno siya sa kanya” kaysa “nakikipagbuno siya rito.” Inayos din ang talababa upang huwag magmungkahi ng literal na “palad,” na hindi ang kahulugan ng כַּף sa pariralang ito.
  terminology: Ang “hugpungan ng hita” at “nalinsad” ay katanggap-tanggap na modernong Filipino para sa socket/joint area at dislokasyon. Pinanatili ang mga ito para sa pagkakatugma sa dalawang paglitaw ng Hebreong parirala.
