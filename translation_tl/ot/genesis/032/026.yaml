  to: Nang makita niyang hindi niya ito madaig[a][c], hinipo niya ang hugpungan ng hita nito[b], at nalinsad ang hugpungan ng hita ni Jacob habang nakikipagbuno siya sa kanya.
  rationale: Pinalitan ang “rito” ng “sa kanya” upang maipahayag nang natural ang pakikipagbuno sa isang kalaban, samantalang pinananatili ang panghalip at ang ambiguwidad ng Hebreo. Inalis ang “palad” sa talababa dahil ang kahulugan ng termino rito ay uka/socket ng kasukasuan.
