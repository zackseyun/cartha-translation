base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/026.yaml
  text: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
translation:
  language: tl
  text: Nang makita niyang hindi niya ito madaig[a][c], hinipo niya ang hugpungan ng hita nito[b], at nalinsad ang hugpungan ng hita ni Jacob habang nakikipagbuno siya sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi niya ito mapangibabawan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang uka ng kaniyang hita”; tradisyonal na isinasaling “ang uka ng kaniyang hita.” Tumutukoy ito sa hugpungan sa bahagi ng balakang at hita.
    reason: lexical_alternative
  - marker: c
    text: Nananatiling hindi tahasang tinutukoy sa Hebreo kung sino ang kalaban ni Jacob; mga panghalip lamang ang ginagamit sa talatang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita niya
  rationale: Likas na ipinahahayag ng “nang” ang temporal na ugnayan habang isinusulong ng waw-consecutive ang salaysay.
- source_word: לֹא יָכֹל לוֹ
  choice: hindi niya ito madaig
  rationale: Ipinahahayag ng יכל + ל ang kawalang-kakayahang manaig laban sa isang kalaban; ang “madaig” ay angkop sa konteksto ng pakikipagbuno nang hindi pinalalabis ang diwa.
- source_word: וַיִּגַּע
  choice: hinipo niya
  rationale: Karaniwang nangangahulugang “humipo” ang נגע. Pinananatili ang payak na pandiwa kahit matindi ang naging epekto ng paghipo.
- source_word: בְּכַף יְרֵכוֹ
  choice: ang hugpungan ng hita nito
  rationale: Sa kontekstong ito, ang כף ירך ay tumutukoy sa uka o hugpungan sa bahagi ng balakang at hita. Malinaw at natural sa modernong Filipino ang “hugpungan ng hita.”
- source_word: וַתֵּקַע
  choice: nalinsad
  rationale: Ipinahihiwatig ng pandiwa na nawala sa wastong puwesto ang kasukasuan; tuwiran at likas na katumbas ang “nalinsad.”
- source_word: כַּף יֶרֶךְ יַעֲקֹב
  choice: ang hugpungan ng hita ni Jacob
  rationale: Pinananatili ang parehong katawagan sa naunang parirala at ang tahasang pagbanggit kay Jacob sa Hebreo.
- source_word: בְּהֵאָבְקוֹ עִמּוֹ
  choice: habang nakikipagbuno siya rito
  rationale: Ipinahahayag ng infinitive construct na kasabay ang kilos. Natural sa Filipino ang “habang,” at hindi nito tahasang pinapangalanan ang tinutukoy ng mga panghalip.
theological_decisions:
- issue: Ang tinutukoy ng mga panghalip sa tagpo ng pakikipagbuno
  choice: Panatilihin ang mga panghalip at huwag tahasang pangalanan sa talata ang kalaban ni Jacob.
  alternative: Tukuyin ang kumilos bilang lalaki, anghel, o Diyos.
  rationale: Hindi muling pinapangalanan ng talatang Hebreo ang kalaban ni Jacob. Unti-unting inilalahad ng mas malawak na salaysay ang kahulugan ng kaniyang pagkakakilanlan, kaya hindi ito dapat pasiyahan ng salin sa talatang ito.
translation_notes:
  register: Makabago, dignidad, at madaling maunawaang Filipino. Ginamit ang “hugpungan ng hita” sa halip na mas teknikal na “supsupan ng balakang,” at pinanatili ang hindi tahasang pagkakakilanlan ng kalaban sa pamamagitan ng mga panghalip.
