  yaml_path: translation/ot/genesis/032/030.yaml
  text: Then Jacob asked[a], “Please tell me your name.” But he said[c][b], “Why is it that you ask my name?” And he blessed him there.
translation:
  language: tl
  text: Nagtanong si Jacob, “Pakisabi sa akin ang pangalan mo.” Ngunit sinabi niya, “Bakit mo itinatanong ang pangalan ko?” At doon ay pinagpala niya si Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל יַעֲקֹב וַיֹּאמֶר
  choice: Kaya nagtanong si Jacob
  rationale: Ang magkasunod na pandiwang Hebreo na literal na ‘nagtanong ... at sinabi’ ay likas na naipahahayag sa modernong Tagalog sa pamamagitan ng ‘nagtanong,’ yamang kasunod agad ang tuwirang sinabi.
- source_word: הַגִּידָה נָּא
  choice: Pakisabi sa akin
  rationale: Ang Hiphil imperative ng נגד ay humihiling na ipaalam o sabihin ang isang bagay, at ang נָא ay nagpapalumanay sa pakiusap. Likas at magalang ang ‘Pakisabi sa akin.’
- source_word: שְׁמֶךָ
  choice: ang pangalan mo
  rationale: Tuwirang katumbas ito ng pariralang Hebreo. Bagaman maaaring may mas malalim na kahulugan ang pangalan sa konteksto, hindi iyon dapat idagdag sa salin.
- source_word: לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי
  choice: Bakit mo itinatanong ang pangalan ko?
  rationale: Idyomatiko at malinaw ito sa modernong Tagalog. Ang לָמָּה זֶּה ay nagbibigay-diin sa tanong ngunit hindi kailangang tumbasan ng artipisyal na parirala.
- source_word: וַיְבָרֶךְ אֹתוֹ שָׁם
  choice: At doon ay pinagpala niya si Jacob
  rationale: Ang ברך ay ‘pagpalain,’ at pinananatili ng ‘doon’ ang pagbibigay-diin sa lugar. Nililinaw ang layon bilang si Jacob, na siyang tinutukoy ng panghalip sa konteksto, habang hindi pinapangalanan ang hindi tahasang tinukoy na gumagawa.
theological_decisions:
- issue: Pagkakakilanlan ng nagsasalitang tumangging sabihin ang kaniyang pangalan
  choice: Panatilihin ang di-tiyak na pagkakakilanlan sa pamamagitan ng ‘sinabi niya’ at ‘pinagpala niya.’
  alternative: Tukuyin siya bilang ‘ang lalaki,’ ‘ang anghel,’ o ‘ang Diyos.’
  rationale: Hindi tahasang pinapangalanan sa talatang Hebreo ang paksa ng mga pandiwa. Bagaman mahalaga ang mas malawak na konteksto sa pagkilala sa kaniya, hindi dapat lutasin ng salin ang sadyang naiwan na di-tiyak sa mismong talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang ‘pakisabi’ bilang magalang ngunit karaniwang pakiusap. Iniwasan ang pagbanggit kung sino ang di-tahasang paksa upang mapanatili ang teolohikal na tensiyon ng salaysay.
