  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א יַעֲקֹ֛ב שֵׁ֥ם הַ/מָּק֖וֹם פְּנִיאֵ֑ל כִּֽי רָאִ֤יתִי אֱלֹהִים֙ פָּנִ֣ים אֶל פָּנִ֔ים וַ/תִּנָּצֵ֖ל נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
translation:
  language: tl
  text: At tinawag ni Jacob na Peniel[a] ang lugar, sapagkat, “Nakita ko ang Diyos nang mukhaan,[b] at naligtas ang buhay ko.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Peniel ay nangangahulugang “mukha ng Diyos,” na kaugnay ng paliwanag ni Jacob na nakita niya ang Diyos nang mukhaan.
    reason: cultural_note
  - marker: b
    text: Ang “Diyos” ay maaari ring unawain sa mas malawak na kahulugang “isang banal na nilalang,” ngunit pinapaboran ng konteksto ang “Diyos.”
    reason: alternative_reading
  - marker: c
    text: Sa literal, “naligtas ang aking buhay [o sarili].” Ang salitang Hebreo ay maaari ring isaling “kaluluwa,” ngunit tumutukoy rito sa buhay o sarili ni Jacob.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם הַמָּקוֹם
  choice: tinawag ni Jacob na ... ang lugar
  rationale: Likas na pormula ito sa modernong Tagalog para sa pagbibigay ng pangalan, habang tapat sa diwa ng Hebreong ‘tinawag ang pangalan ng lugar.’
- source_word: פְּנִיאֵל
  choice: Peniel
  rationale: Isinalin sa baybay na malapit sa anyong Hebreo rito at pinananatili ang laro ng salita sa ‘mukha ng Diyos.’
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikita ang dahilan ng ipinangalan ni Jacob sa lugar.
- source_word: רָאִיתִי אֱלֹהִים
  choice: Nakita ko ang Diyos
  rationale: Bagaman maaaring mas malawak ang saklaw ng אֱלֹהִים sa ilang konteksto, pinapaboran ng salaysay ang tuwirang pagtukoy sa Diyos.
- source_word: פָּנִים אֶל פָּנִים
  choice: nang mukhaan
  rationale: Natural na idyomang Tagalog para sa tuwirang personal na pagharap at pinananatili ang ugnayan sa pangalang Peniel.
- source_word: וַתִּנָּצֵל נַפְשִׁי
  choice: gayunman ay naligtas ang buhay ko
  rationale: Ang נֶפֶשׁ ay tumutukoy rito sa buhay o sarili ni Jacob, at ang נצל ay nagsasaad na siya ay nailigtas o nakaligtas. Ang ‘gayunman’ ay inilalantad ang kontekstuwal na pagtataka na nakakita siya sa Diyos ngunit nabuhay.
theological_decisions:
- issue: Pagtukoy ng אֱלֹהִים sa pahayag ni Jacob
  choice: ang Diyos
  alternative: isang banal na nilalang
  rationale: Ang pagpapangalan ni Jacob at ang mas malawak na konteksto ng pakikipagbuno ay pumapabor sa ‘Diyos,’ ngunit itinatala sa talababa ang tunay na mas malawak na posibilidad ng salitang Hebreo.
- issue: Kahulugan ng pagkaligtas ng נַפְשִׁי
  choice: naligtas ang buhay ko
  alternative: naligtas ang aking kaluluwa / nakaligtas ako
  rationale: Sa konteksto, ang punto ay nakaligtas si Jacob nang buhay matapos ang tuwirang pakikipagtagpo, hindi isang tiyak na pahayag tungkol sa hiwalay na imateryal na kaluluwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘mukhaan’ upang maging natural at mapanatili ang laro ng salita sa Peniel. Ang tuwirang unang panauhang paliwanag ay inilagay sa panipi nang hindi idinaragdag ang ‘sinabi niya,’ na wala sa Hebreo.
