  text: וְ/יַעֲקֹ֖ב הָלַ֣ךְ לְ/דַרְכּ֑/וֹ וַ/יִּפְגְּעוּ ב֖/וֹ מַלְאֲכֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/002.yaml
  text: And Jacob went on his way[b][a], and the angels of God met him.
translation:
  language: tl
  text: At nagpatuloy si Jacob sa kanyang paglalakbay, at sinalubong siya ng mga anghel ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga mensahero ng Diyos.” Ang salitang Hebreo ay maaaring mangahulugang “mga anghel” o “mga mensahero.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַעֲקֹב
  choice: At ... si Jacob
  rationale: Pinananatili ng “At” ang payak na daloy ng salaysay na ipinahihiwatig ng וְ, nang hindi ito ginagawang mas mariing panandang diskurso.
- source_word: הָלַךְ לְ/דַרְכּ/וֹ
  choice: nagpatuloy ... sa kanyang paglalakbay
  rationale: Ang parirala ay literal na tumutukoy sa paglakad o pagpunta ni Jacob sa kanyang daan. Sa likas na modernong Tagalog, malinaw na ipinahahayag ng “nagpatuloy sa kanyang paglalakbay” ang pagpapatuloy niya sa ruta.
- source_word: וַ/יִּפְגְּעוּ ב/וֹ
  choice: sinalubong siya
  rationale: Ang פגע na may בְּ ay maaaring mangahulugang makasalubong, makatagpo, o dumating sa kinaroroonan ng isang tao. Ang “sinalubong siya” ay natural sa konteksto ngunit hindi nagpapahiwatig ng pagkapoot.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: mga anghel ng Diyos
  rationale: Bagaman maaaring tumukoy ang מַלְאָךְ sa mensahero, itinuturo ng konteksto—lalo na ang “kampo ng Diyos” sa kasunod na talata—ang mga makalangit na nilalang. Pinananatili rin ng parirala ang Hebreong construct na “mga anghel ng Diyos.”
theological_decisions:
- issue: Tinutukoy ng מַלְאֲכֵי אֱלֹהִים
  choice: mga makalangit na anghel
  alternative: mga mensahero ng Diyos
  rationale: Maaaring mangahulugan ang מַלְאָךְ ng taong mensahero o makalangit na anghel, ngunit mariing sinusuportahan ng pagbanggit sa “kampo ng Diyos” sa Genesis 32:3 sa Tagalog versification/context ang supernatural na tinutukoy. Gayunman, itinatala sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “nagpatuloy sa kanyang paglalakbay” sa halip na literal ngunit di-likas na “pumunta sa kanyang daan,” at “sinalubong” upang mapanatili ang di-tiyak na diwa ng pagkakatagpo nang walang ipinapasok na poot o aksidente.
