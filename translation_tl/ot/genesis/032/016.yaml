  text: thirty nursing camels and their young[a], forty cows and ten bulls, twenty female donkeys and ten foals.
translation:
  language: tl
  text: tatlumpung inahing kamelyong nagpapasuso at ang kanilang mga anak, apatnapung baka at sampung toro, dalawampung inahing asno at sampung batang asno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sampung lalaking asno.” Ang salitang Hebreo ay maaaring tumukoy sa batang asno o, sa kontekstong ito, sa lalaking asno na kaugnay ng mga inahing asno.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמַלִּים מֵינִיקוֹת
  choice: inahing kamelyong nagpapasuso
  rationale: Ang participle na מֵינִיקוֹת ay tumutukoy sa mga babaeng kamelyong nagpapasuso sa kanilang mga anak. Malinaw at likas ito sa makabagong Tagalog.
- source_word: וּבְנֵיהֶם
  choice: kasama ang kanilang mga anak
  rationale: Bagaman literal na ‘at ang kanilang mga anak,’ sa konteksto ng mga hayop ay natural ang ‘kanilang mga anak’; ipinahihiwatig ng kasama ang ugnayan nito sa bilang ng mga kamelyo.
- source_word: פָּרוֹת
  choice: baka
  rationale: Tumutukoy ito sa mga babaeng baka. Sa Filipino, ang karaniwang ‘baka’ ay natural dito, lalo na't kasunod ang tiyak na panlalaking ‘toro.’
- source_word: וּפָרִים
  choice: at sampung toro
  rationale: Ang פָּרִים ay mga lalaking baka, kaya malinaw na katumbas ang ‘toro.’
- source_word: אֲתֹנֹת
  choice: inahing asno
  rationale: Tiyak na pambabae ang Hebreong anyo; pinananatili ng ‘inahing asno’ ang pagkakaibang pangkasarian sa talaan.
- source_word: וַעְיָרִם
  choice: at sampung batang asno
  rationale: Ang עַיִר ay karaniwang tumutukoy sa batang asno, ngunit maaari ring maunawaan bilang lalaking asno sa kontekstong ito. Pinananatili sa talababa ang tunay na leksikal na kalabuan.
