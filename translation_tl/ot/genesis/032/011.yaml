base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/011.yaml
  text: I am unworthy of all the steadfast love and all the faithfulness that you have shown to your servant[a], for with my staff I crossed this Jordan[c][b], and now I have become two camps.
translation:
  language: tl
  text: Hindi ako karapat-dapat[a] sa lahat ng tapat mong pag-ibig[b] at sa lahat ng katapatan na ipinakita mo sa iyong lingkod. Sapagkat dala ang aking tungkod[c] nang tumawid ako sa Jordan na ito, at ngayo’y naging dalawang kampo na ang aking pangkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Maliit ako kung ihahambing sa lahat…” Isa itong Hebreong paraan ng mapagpakumbabang pagkilala sa laki ng kabutihang ipinakita ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay nasa anyong maramihan at maaari ring isalin na “lahat ng mga gawa ng tapat mong pag-ibig,” na tumutukoy sa paulit-ulit at kongkretong pagpapakita nito.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “kasama ang aking tungkod.” Ipinahihiwatig ng konteksto na kakaunti ang dala niya nang una siyang tumawid.
    reason: translation_clarity
lexical_decisions:
- source_word: קָטֹנְתִּי
  choice: Hindi ako karapat-dapat
  rationale: Literal itong ‘ako ay maliit’ o ‘naging maliit ako,’ ngunit sa konteksto ay kapakumbabaang kumikilala na hindi matutumbasan ni Jacob ang kabutihang ipinakita ng Diyos. Ang ‘hindi ako karapat-dapat’ ang likas at malinaw na pagpapahayag nito sa modernong Tagalog.
- source_word: הַחֲסָדִים
  choice: lahat ng tapat mong pag-ibig
  rationale: Ang חֶסֶד ay tumutukoy sa matatag at tapat na kagandahang-loob sa isang ugnayan. Bagaman maramihan ang anyo rito at maaaring tumukoy sa paulit-ulit na mga gawa, pinananatili ng pangunahing teksto ang likas na pariralang Tagalog; ipinaliliwanag sa talababa ang puwersa ng maramihan.
- source_word: הָאֱמֶת
  choice: lahat ng katapatan
  rationale: Kapag katambal ng חֶסֶד, ang אֱמֶת ay tumutukoy sa pagiging maaasahan at tapat, hindi lamang sa abstraktong ‘katotohanan.’
- source_word: עָשִׂיתָ אֶת עַבְדֶּךָ
  choice: ipinakita mo sa iyong lingkod
  rationale: Literal na ‘ginawa mo sa/para sa iyong lingkod.’ Ang ‘ipinakita’ ay natural sa Tagalog kapag ang layon ay tapat na pag-ibig at katapatan, habang pinananatili ang ‘lingkod.’
- source_word: בְמַקְלִי
  choice: taglay lamang ang aking tungkod
  rationale: Ang literal na parirala ay ‘sa/pamamagitan ng aking tungkod.’ Ipinahihiwatig ng konteksto na tungkod lamang ang ari-ariang kasama niya; ang ayos na ito ay malinaw at natural sa Tagalog, at minamarkahan sa talababa ang mas literal na anyo.
- source_word: עָבַרְתִּי אֶת הַיַּרְדֵּן הַזֶּה
  choice: nang tumawid ako sa Jordan na ito
  rationale: Pinananatili nito ang payak na kilos at ang demonstratibong ‘ito,’ na nagbibigay ng agarang heograpikong pagtukoy.
- source_word: הָיִיתִי לִשְׁנֵי מַחֲנוֹת
  choice: ngayo’y naging dalawang kampo na kami
  rationale: Literal na ‘ako ay naging dalawang kampo.’ Dahil kolektibong tumutukoy si Jacob sa kanyang buong pangkat, ang ‘kami’ ay natural sa Tagalog at pinananatili ang konkretong larawang ‘dalawang kampo.’
theological_decisions:
- issue: Pagpapahayag sa חסד at אמת bilang paglalarawan sa pakikitungo ng Diyos kay Jacob
  choice: tapat na pag-ibig at katapatan
  alternative: kagandahang-loob at katotohanan
  rationale: 'Pinananatiling magkaiba ngunit magkaugnay ang dalawang salitang Hebreo: ang una ay matatag at tapat na pag-ibig na nahahayag sa gawa, at ang ikalawa ay pagiging maaasahan. Hindi nito nililimitahan ang mga salita sa damdamin lamang o sa abstraktong katotohanan.'
- issue: Kolektibong diwa ng ‘ako ay naging dalawang kampo’
  choice: naging dalawang kampo na kami
  alternative: ako ay naging dalawang kampo
  rationale: Ang isahan sa Hebreo ay si Jacob bilang pinuno at kinatawan ng kanyang sambahayan at mga kasama. Ang ‘kami’ ay nagpapanatili sa kahulugan nang hindi lumilikha ng di-likas na pahayag sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang karaniwang ‘Jordan,’ ‘tungkod,’ ‘lingkod,’ at ‘kampo.’ Iniwasan ang teknikal na katawagang teolohikal sa pangunahing teksto, habang pinanatili sa mga talababa ang literal na anyo at tunay na puwersa ng mga salitang Hebreo.
