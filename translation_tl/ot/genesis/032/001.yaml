base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/001.yaml
  text: Laban rose early in the morning[a], kissed his sons and his daughters, and blessed them. Then Laban departed and returned to his place.
translation:
  language: tl
  text: Maagang bumangon si Laban nang umagang iyon. Hinalikan niya ang kanyang mga anak na lalaki at mga anak na babae[a] at binasbasan sila. Pagkatapos, umalis si Laban at bumalik sa kanyang lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kanyang mga anak na lalaki at mga anak na babae.” Malamang na tumutukoy ang mga ito sa mga inapo ni Laban, samakatuwid ay sa kanyang mga apo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: Kinaumagahan, maagang bumangon
  rationale: Ang Hiphil ng שׁכם ay nagpapahayag ng maagang pagbangon o pagsisimula, at ang בַּבֹּקֶר ay tumutukoy sa umaga. Natural sa modernong Tagalog ang pariralang ito at napapanatili ang parehong temporal na diin.
- source_word: וַיְנַשֵּׁק
  choice: Hinalikan
  rationale: Tuwirang ipinapahayag ng pandiwa ang halik ng pagmamahal at pamamaalam sa pamilya.
- source_word: לְבָנָיו וְלִבְנוֹתָיו
  choice: ang kanyang mga anak na lalaki at mga anak na babae
  rationale: Pinananatili nito ang tiyak na panlalaki at pambabaeng katawagang pampamilya sa Hebreo, sa halip na gawing pangkalahatang 'mga anak' o tahasang 'mga apo.'
- source_word: וַיְבָרֶךְ אֶתְהֶם
  choice: at binasbasan sila
  rationale: Ang ברך ay nangangahulugang magbasbas o magpala. Ang 'binasbasan' ay malinaw at angkop sa marangal na salaysay, at hindi ito pinapaliit tungo sa simpleng pamamaalam.
- source_word: וַיֵּלֶךְ
  choice: umalis
  rationale: Ipinahihiwatig ng pandiwa ang pag-alis ni Laban; ang saling ito ay natural bago ang kasunod na 'bumalik.'
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: bumalik sa kanyang lugar
  rationale: Pinananatili ng 'bumalik' ang pangunahing diwa ng שׁוב, habang ang 'kanyang lugar' ay malapit sa literal na מְקוֹמוֹ at hindi nagdaragdag ng tahasang 'tahanan.'
theological_decisions:
- issue: Mga katawagang pampamilya na may tiyak na kasarian
  choice: ang kanyang mga anak na lalaki at mga anak na babae
  alternative: ang kanyang mga anak; ang kanyang mga apo
  rationale: Tahasang gumagamit ang Hebreo ng panlalaki at pambabaeng katawagan. Pinananatili iyon sa pangunahing teksto, samantalang nililinaw sa talababa na maaaring tumukoy ang mga ito sa mas malawak na mga inapo, malamang sa mga apo ni Laban.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'kinaumagahan' upang maayos na iugnay ang pangyayari sa naunang salaysay, habang pinanatili ang 'maagang bumangon' para sa diin ng Hebreo. Iniwasan ang masyadong teknikal, makaluma, o denominasyonal na pananalita.
