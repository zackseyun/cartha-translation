  text: And he said[a], “Let me go, for the dawn has risen.” But he said[c][b], “I will not let you go unless you bless me.”
translation:
  language: tl
  text: Sinabi niya[a], “Pakawalan mo ako, sapagkat sumikat na ang bukang-liwayway.” Ngunit sinabi niya[b], “Hindi kita pakakawalan hangga't hindi mo ako pagpapalain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang tinutukoy sa Hebreo kung sino ang nagsasalita sa alinmang bahagi ng talatang ito; nahihinuha ang kanilang pagkakakilanlan mula sa nakapaligid na salaysay.
    reason: cultural_note
  - marker: b
    text: Sa literal, “at sinabi niya.” Inuulit ng Hebreo ang di-tahasang paksa; ipinahihiwatig ng daloy ng usapan na ang kausap ang tumutugon.
    reason: translation_clarity
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: Pakawalan mo ako
  rationale: Ang pautos na anyo ng שׁלח na may hulaping unang panauhan ay nangangahulugang pakawalan o paalisin ang nagsasalita. Sa konteksto ng pagbubuno, likas at malinaw sa Filipino ang “Pakawalan mo ako.”
- source_word: כִּי עָלָה הַשָּׁחַר
  choice: sapagkat sumikat na ang bukang-liwayway
  rationale: Pinananatili ng “sapagkat” ang sanhi na ipinahihiwatig ng כִּי, at ng “sumikat na ang bukang-liwayway” ang larawan ng pagsikat o pag-ahon ng liwayway sa עָלָה הַשָּׁחַר.
- source_word: לֹא אֲשַׁלֵּחֲךָ
  choice: Hindi kita pakakawalan
  rationale: Ipinahahayag ng negatibong imperfect ang matatag na pagtanggi. Inuulit ng “pakakawalan” ang ugat ng naunang pakiusap at pinananatili ang ugnayang pandiwa sa Hebreo.
- source_word: כִּי אִם
  choice: hangga't hindi
  rationale: Sa negatibong pangungusap, natural na ipinapahayag sa Filipino ng “hangga't hindi” ang kondisyong dapat munang matupad bago siya pakawalan.
- source_word: בֵּרַכְתָּנִי
  choice: mo ako binabasbasan
  rationale: Bagaman perfect ang anyo sa Hebreo, kasunod ito ng kondisyong כִּי אִם at tumutukoy sa hinihinging pagpapalang dapat maganap muna. Ang aspektong di-ganap na “binabasbasan” ay natural sa Filipino pagkatapos ng “hangga't hindi.”
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Sinabi niya ... Ngunit sinabi naman ng isa
  rationale: Kapwa walang tahasang pangalang paksa ang mga pandiwa. Nililinaw ng “ng isa” na nagpalit ang nagsasalita nang hindi tinutukoy kung sino ang bawat isa; ipinakikita ng “ngunit” ang pagsalungat ng tugon.
theological_decisions:
- issue: Pagkakakilanlan ng mga nagsasalita
  choice: Gumamit ng “niya” at “ng isa” nang hindi pinapangalanan ang mga nagsasalita.
  alternative: Tukuyin sila bilang “ang lalaki,” “Jacob,” “ang anghel,” o “Diyos.”
  rationale: Walang tahasang binabanggit na pangalan ang Hebreo sa talatang ito; makikilala lamang sila mula sa mas malawak na salaysay. Iniiwasan nitong lutasin sa mismong salin ang sadyang di-tahasang pagkakakilanlan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “bukang-liwayway” upang mapanatili ang imahen ng Hebreo, at “binabasbasan” bilang natural na pandiwa para sa personal na pagbibigay ng pagpapala. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
