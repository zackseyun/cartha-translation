  yaml_path: translation/ot/genesis/032/014.yaml
  text: 'So he spent that night there[a], and he took from what came to his hand a gift for Esau his brother:'
translation:
  language: tl
  text: 'Nagpalipas siya roon nang gabing iyon, at mula sa anumang mayroon siya[a] ay kumuha siya ng isang regalo para sa kanyang kapatid na si Esau:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa dumating sa kanyang kamay”; maaari ring “mula sa anumang abot-kamay niya.”
    reason: Inilalahad ang literal na larawan ng Hebreong idyoma at isang malapit na alternatibong pagpapahayag, samantalang ang pangunahing teksto ay gumagamit ng natural na Tagalog.
lexical_decisions:
- source_word: וַיָּלֶן
  choice: nagpalipas siya ... ng gabi
  rationale: Ipinahahayag ng לון ang pananatili sa isang lugar nang magdamag; natural at malinaw sa modernong Tagalog ang “nagpalipas ng gabi.”
- source_word: שָׁם
  choice: roon
  rationale: Tuwirang katumbas na panlunan at angkop sa salaysay.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ng gabing iyon
  rationale: Natural na Tagalog para sa literal na “sa gabing iyon,” habang buo ang tiyak na pagtukoy sa gabi.
- source_word: וַיִּקַּח
  choice: kumuha siya
  rationale: Pinananatili ang karaniwang kahulugan ng לקח na “kumuha,” nang hindi ipinapalagay na ang kilos ay mas tiyak na pagpili.
- source_word: מִן הַבָּא בְיָדוֹ
  choice: mula sa mga dala niya
  rationale: Ang literal na idyomang “mula sa dumating sa kanyang kamay” ay tumutukoy sa mga bagay na kasama o magagamit niya. Ang “mga dala niya” ay natural sa Tagalog at ang literal na larawan ay inilalagak sa talababa.
- source_word: מִנְחָה
  choice: isang regalo
  rationale: Sa ugnayang pantao rito, tumutukoy ito sa handog na ibinibigay sa ibang tao, hindi sa kultikong handog. Hindi rin ipinapahiwatig ng “regalo” ang pormal na pagpapasakop na maaaring idulot ng “tributo.”
- source_word: לְעֵשָׂו אָחִיו
  choice: para sa kapatid niyang si Esau
  rationale: Malinaw na ipinakikita ang tumatanggap at pinananatili ang pagkakakilanlan ni Esau bilang kapatid niya.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “mga dala niya” upang maipahayag nang natural ang Hebreong idyoma; iniwasan ang “handog” dahil maaari itong unang maunawaan bilang panrelihiyong alay. Pinanatili ang tutuldok sapagkat kasunod na ililista ang regalo.
