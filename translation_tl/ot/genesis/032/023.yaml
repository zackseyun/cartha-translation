base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/023.yaml
  text: That night he arose and took his two wives[a], his two female servants, and his eleven children, and crossed the ford of the Jabbok.
translation:
  language: tl
  text: Nang gabing iyon, bumangon siya at isinama ang dalawa niyang asawa, ang dalawa niyang babaeng alipin[a], at ang labing-isa niyang anak. Tumawid siya sa tawiran ng Jabok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “babaeng lingkod.” Ang Hebreong שִׁפְחֹתָיו ay tumutukoy sa mga babaeng may mababang katayuan sa sambahayan at maaaring mangahulugan ng mga babaeng alipin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם בַּלַּיְלָה הוּא
  choice: Nang gabing iyon, bumangon siya
  rationale: Likas na salin sa modernong Tagalog ng pagkilos at panahong binibigyang-diin ng pariralang Hebreo.
- source_word: וַיִּקַּח
  choice: isinama
  rationale: Bagaman karaniwang nangangahulugang “kinuha” ang לָקַח, sa kontekstong ito ay tinitipon at dinadala ni Jacob ang kaniyang sambahayan; mas natural at malinaw sa Tagalog ang “isinama.”
- source_word: שְׁתֵּי נָשָׁיו
  choice: ang dalawa niyang asawa
  rationale: Sa konteksto, ang נָשִׁים ay tumutukoy sa mga asawa ni Jacob.
- source_word: שְׁתֵּי שִׁפְחֹתָיו
  choice: ang dalawa niyang babaeng alipin
  rationale: Ang שִׁפְחָה ay babaeng nasa mababang katayuan sa sambahayan at maaaring tahasang tumukoy sa pagkaalipin; pinananatili ng saling ito ang historikal na katayuan nang hindi gumagamit ng makalumang katawagan.
- source_word: אַחַד עָשָׂר יְלָדָיו
  choice: ang labing-isa niyang anak
  rationale: Ang יְלָדִים ay “mga anak” o “supling,” hindi espesipikong “mga anak na lalaki”; hindi nilulutas sa salin ang tanong kung sino ang kabilang sa bilang.
- source_word: וַיַּעֲבֹר
  choice: Tumawid siya
  rationale: Sa konteksto ng paglalakbay, ang עָבַר ay nangangahulugang tumawid.
- source_word: מַעֲבַר יַבֹּק
  choice: sa tawiran ng Jabok
  rationale: Ang מַעֲבָר ay lugar na tawiran, karaniwang tawiran sa ilog; malinaw at hindi labis na nagpapaliwanag ang “tawiran ng Jabok.”
