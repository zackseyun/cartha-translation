  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag nito ang panahon, ang pagbangon ni Jacob, ang pagsama niya sa dalawang asawa, dalawang babaeng alipin, at labing-isang anak, at ang pagtawid sa tawiran ng Jabok. Ang “isinama” ay natural na kontekstuwal na katumbas ng וַיִּקַּח at hindi nagdaragdag ng diwa.'
