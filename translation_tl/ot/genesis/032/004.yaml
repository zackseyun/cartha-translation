  yaml_path: translation/ot/genesis/032/004.yaml
  text: Jacob sent messengers ahead of him to Esau his brother[a], to the land of Seir, the country of Edom.
translation:
  language: tl
  text: Ipinadala ni Jacob ang mga mensahero upang mauna sa kanya kay Esau, na kapatid niya, na nasa lupain ng Seir—ang nasasakupan ng Edom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang bukid ng Edom”; maaari ring “ang teritoryo ng Edom.” Malamang na katawagan ito sa rehiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ipinadala
  rationale: Ang pandiwa ay karaniwang salaysay ng nakaraang kilos. Likas sa modernong Tagalog ang “ipinadala” at malinaw na si Jacob ang nag-utos sa kanilang pagpunta.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Maaari itong mangahulugang mga anghel o mga mensahero, ngunit mga taong isinugo ni Jacob kay Esau ang tinutukoy sa konteksto.
- source_word: לְפָנָיו
  choice: na mauna sa kanya
  rationale: Literal itong tumutukoy sa pagiging nasa harap niya; dito, ang diwa ay ipinadala sila ni Jacob nang mas maaga sa kanyang pagdating.
- source_word: אֶל עֵשָׂו אָחִיו
  choice: papunta kay Esau na kanyang kapatid
  rationale: Ipinahahayag ng אֶל ang patutunguhan, at pinananatili ng parirala ang pagkakakilanlan kay Esau bilang kapatid ni Jacob.
- source_word: אַרְצָה שֵׂעִיר
  choice: sa lupain ng Seir
  rationale: Ang hulaping paturol sa אַרְצָה ay nagpapahiwatig ng pagkilos patungo sa isang lupain; pinananatili rito ang tahasang “lupain.”
- source_word: שְׂדֵה אֱדֹם
  choice: ang nasasakupan ng Edom
  rationale: Bagaman literal na “parang/bukid ng Edom,” gumaganap ang parirala bilang heograpikong katawagan sa isang rehiyon. Ang “nasasakupan” ay natural at hindi nagpapahiwatig na isang bukid lamang ang tinutukoy.
