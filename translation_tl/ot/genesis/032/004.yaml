translation_notes:
  register: Gumamit ng kasalukuyan, malinaw, at marangal na Tagalog. Pinili ang “mga mensahero” sa halip na “mga sugo” upang maging madaling maunawaan, at ang “na mauna sa kanya” upang natural na maipahayag ang kilos na nauuna kay Jacob.
