  naturalness: May bahagyang kabigatan at kalabuan ang 'papunta kay Esau na kanyang kapatid, sa lupain...' Mas natural ang paghiwalay kay Esau bilang tatanggap at sa Seir/Edom bilang kaniyang kinaroroonan. Ang 'na kapatid niya' ay higit na likas kaysa 'na kanyang kapatid' sa pangungusap na ito.
