lexical_decisions:
- source_word: עִזִּים
  choice: babaeng kambing
  rationale: Tumutukoy ito sa mga kambing at, sa talaang ito ng mga hayop na ipinaparis sa mga lalaki, mahalagang hayagang panatilihin ang kasarian.
- source_word: מָאתַיִם
  choice: dalawandaan
  rationale: Tuwirang katumbas ng bilang na 200; sa teksto, ginagamit ang anyong “dalawandaang” bilang panuring.
- source_word: תְיָשִׁים
  choice: lalaking kambing
  rationale: Partikular itong tumutukoy sa mga kambing na lalaki. Natural at malinaw ito sa modernong Filipino.
- source_word: עֶשְׂרִים
  choice: dalawampu
  rationale: Tuwirang katumbas ng bilang na 20; sa teksto, ginagamit ang anyong “dalawampung” bilang panuring.
- source_word: רְחֵלִים
  choice: babaeng tupa
  rationale: Tumutukoy sa mga tupang babae. Mas madaling maunawaan ng karaniwang mambabasa kaysa sa isang bihira o teknikal na katawagan.
- source_word: אֵילִים
  choice: lalaking tupa
  rationale: Tumutukoy sa mga tupang lalaki, lalo na sa mga barako. Pinili ang malinaw at pangkalahatang parirala upang tumbasan ang pares na babae at lalaki.
