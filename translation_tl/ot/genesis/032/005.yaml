base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/005.yaml
  text: 'And he commanded them[a], saying[c][b], “Thus you shall say to my lord Esau: ‘Thus says your servant Jacob: I have sojourned with Laban and have stayed until now.’”'
translation:
  language: tl
  text: 'At inutusan niya sila[a]: “Ganito ang sasabihin ninyo sa panginoon kong si Esau: ‘Ganito ang sabi ng lingkod mong si Jacob: Nanirahan ako kay Laban bilang isang dayuhan[b], at nanatili ako roon hanggang ngayon.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mahigpit niyang tinagubilinan sila.”
    reason: lexical_alternative
  - marker: b
    text: O “Nakipanirahan ako kay Laban.” Ang pandiwa ay maaaring magbigay-diin sa paninirahan bilang isang tagalabas o dayuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: inutusan
  rationale: Pinananatili nito ang puwersa ng pagbibigay ng tiyak na tagubilin, ngunit mas natural sa makabagong Tagalog kaysa sa mas matigas na “iniutos.”
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Inilalarawan nito ang Hebreong pormula ng pagpapakilala sa pananalita nang hindi inaalis ang paulit-ulit na balangkas ng mensahe.
- source_word: כֹּה תֹאמְרוּן
  choice: Ganito ang sasabihin ninyo
  rationale: Malinaw nitong ipinakikilalang ang sumusunod ay ang eksaktong mensaheng dapat ihatid.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: sa panginoon kong si Esau
  rationale: Ang “panginoon” ay magalang na panlipunang titulo rito, hindi banal na titulo; natural na ipinakikita ng “si” ang apposisyon sa Tagalog.
- source_word: כֹּה אָמַר
  choice: Ganito ang sabi
  rationale: Karaniwang pormula ito ng mensahero; ang kasalukuyang anyong “ang sabi” ay likas sa Tagalog para sa inihahatid na mensahe.
- source_word: עַבְדְּךָ
  choice: lingkod mo
  rationale: Tumutukoy ito sa mapagpakumbabang pagtawag ni Jacob sa sarili sa harap ni Esau, hindi kinakailangang sa literal na pagkaalipin.
- source_word: גַּרְתִּי
  choice: Nanirahan akong dayuhan
  rationale: Pinananatili nito ang diwa ng paninirahan bilang tagalabas o dayuhang residente, na mahalagang bahagi ng pandiwang גור.
- source_word: וָאֵחַר
  choice: at nanatili roon
  rationale: Ipinahahayag nito ang pagpapatuloy ng pananatili hanggang sa kasalukuyang punto; hindi pangunahing ibig sabihin dito ang pagiging huli o pagkaantala.
- source_word: עַד עָתָּה
  choice: hanggang ngayon
  rationale: Ito ang natural at eksaktong katumbas sa makabagong Tagalog.
theological_decisions:
- issue: Kahulugan ng “lingkod mo” sa pakikipag-usap kay Esau
  choice: Pinanatili bilang magalang at mapagpakumbabang pagtukoy sa sarili.
  alternative: Unawain bilang pahayag ng literal na pagkaalipin.
  rationale: Sa konteksto ng mensaherong pormula at pakikipagkasundo, ang panlipunang pagpapakumbaba ang nangingibabaw, bagaman hindi binabago ang literal na salitang “lingkod.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pormulang pangmensahero at ang magalang na “panginoon” at “lingkod,” habang nilinaw sa talababa ang diwa ng paninirahan bilang dayuhan.
