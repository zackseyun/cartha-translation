id: GEN.32.25
reference: Genesis 32:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּוָּתֵ֥ר יַעֲקֹ֖ב לְ/בַדּ֑/וֹ וַ/יֵּאָבֵ֥ק אִישׁ֙ עִמּ֔/וֹ עַ֖ד עֲל֥וֹת הַ/שָּֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/025.yaml
  text: And Jacob was left alone[b][a], and a man wrestled with him until the dawn came up.
translation:
  language: tl
  text: At naiwang nag-iisa si Jacob, at isang lalaki[b] ang nakipagbuno sa kanya hanggang sa pagbubukang-liwayway.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang magbukang-liwayway”; sa literal, “hanggang sa pagsikat ng bukang-liwayway.”
    reason: lexical_alternative
  - marker: b
    text: Sinasabi ng Hebreo na “isang lalaki.” Ang kasunod na konteksto at Oseas 12:4 ay tumutulong sa mas buong pagkakakilanlan sa kanya.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּוָּתֵר
  choice: naiwang
  rationale: 'Pinananatili nito ang pasibong diwa ng Niphal: matapos maitawid ang iba, si Jacob ay naiwang mag-isa.'
- source_word: לְבַדּוֹ
  choice: nag-iisa
  rationale: Natural at malinaw na katumbas sa modernong Tagalog na nagbibigay-diin sa pag-iisa ni Jacob.
- source_word: וַיֵּאָבֵק
  choice: nakipagbuno
  rationale: Tiyak nitong inilalarawan ang pisikal na pagdadaupang-palad o wrestling, hindi lamang isang pangkalahatang pakikipaglaban.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Ito ang tahasang tawag ng Hebreo sa mahiwagang tauhan; hindi muna nilulutas sa talatang ito ang buo niyang pagkakakilanlan.
- source_word: עִמּוֹ
  choice: sa kanya
  rationale: Natural na Tagalog sa pariralang 'nakipagbuno sa kanya,' na nagpapahayag na si Jacob ang kabuno ng lalaki.
- source_word: עַד עֲלוֹת הַשָּׁחַר
  choice: hanggang sa pagbubukang-liwayway
  rationale: Natural at marangal na salin ng pagdating o pagsikat ng bukang-liwayway, habang pinananatili ang larawan ng Hebreo.
theological_decisions:
- issue: Pagkakakilanlan ng אִישׁ sa tagpo ng pakikipagbuno
  choice: Isinalin bilang 'isang lalaki' sa pangunahing teksto nang hindi tinutukoy kung siya ay anghel o banal na pagpapakita.
  alternative: isang anghel; ang Diyos/ang PANGINOON na nagpakita bilang lalaki
  rationale: Sa mismong talata, 'isang lalaki' lamang ang pagkakilala sa tauhan. Ang kasunod na konteksto at Oseas 12:4 ay tumutulong sa mas buong pagkaunawa, ngunit dapat panatilihin rito ang sinadyang hiwaga at tensiyong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'nakipagbuno' para sa tiyak na kilos at 'isang lalaki' upang hindi maagang lutasin ang pagkakakilanlan ng tauhan.
