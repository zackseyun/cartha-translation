  source_fidelity: 'Tumpak ang salin sa Hebreo: ang pasibong וַיִּוָּתֵר ay naipahayag sa “naiwang,” ang לְבַדּוֹ sa “nag-iisa,” at ang bihirang pandiwang וַיֵּאָבֵק ay wasto at tiyak na “nakipagbuno.” Pinananatili rin ng “isang lalaki” ang sinadyang hindi pa ganap na ipinakikilalang tauhan. Ang “hanggang sa pagbubukang-liwayway” ay natural na katumbas ng “hanggang sa pagsikat/pagdating ng bukang-liwayway.”'
