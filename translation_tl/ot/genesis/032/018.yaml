base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/018.yaml
  text: And he commanded the first one, saying, “When Esau my brother meets you and asks you, ‘Whose are you, and where are you going, and whose are these before you?’...”
translation:
  language: tl
  text: Inutusan niya ang unang lingkod, “Kapag nasalubong ka ng kapatid kong si Esau at tinanong ka niya, ‘Kanino ka? Saan ka pupunta? At kanino ang mga hayop na nasa unahan mo?’...”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִאשׁוֹן
  choice: ang unang lingkod
  rationale: Literal itong ‘ang una,’ ngunit ipinahihiwatig ng konteksto na siya ang unang lingkod na nangunguna sa pangkat; idinagdag ang ‘lingkod’ upang maging malinaw at natural sa Tagalog.
- source_word: כִּי יִפְגָּשְׁךָ
  choice: Kapag nasalubong ka
  rationale: Ang כִּי sa kondisyong ito ay natural na ‘kapag,’ at ang פגשׁ ay tumutukoy sa pagsalubong o pagtatagpo.
- source_word: לְמִי אַתָּה
  choice: Kanino ka?
  rationale: Pinananatili ang maikli at bahagyang eliptikong tanong ng Hebreo tungkol sa kung kanino siya kabilang o naglilingkod.
- source_word: וְאָנָה תֵלֵךְ
  choice: Saan ka pupunta?
  rationale: Direkta at natural na katumbas ng tanong tungkol sa patutunguhan.
- source_word: וּלְמִי אֵלֶּה לְפָנֶיךָ
  choice: At kanino ang mga hayop na nasa unahan mo?
  rationale: Ang ‘mga ito’ ay tumutukoy sa mga kawan sa agarang konteksto; ang ‘mga hayop’ ay nilinaw upang maiwasan ang malabong panghalip sa Tagalog, habang pinananatili ang tanong tungkol sa pagmamay-ari.
theological_decisions: []
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Pinanatili ang tuwirang pananalita at ang elipsis sa ‘Kanino ka?’ Hindi inulit ang Hebreong idiom na ‘nagtanong sa iyo, na sinasabi,’ dahil hindi ito natural sa kasalukuyang Tagalog.
