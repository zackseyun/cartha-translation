  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים אֶֽל יַעֲקֹ֖ב לֵ/אמֹ֑ר בָּ֤אנוּ אֶל אָחִ֨י/ךָ֙ אֶל עֵשָׂ֔ו וְ/גַם֙ הֹלֵ֣ךְ לִ/קְרָֽאתְ/ךָ֔ וְ/אַרְבַּע מֵא֥וֹת אִ֖ישׁ עִמּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/007.yaml
  text: The messengers returned to Jacob[a], saying, “We came to your brother, to Esau, and he is also coming to meet you, and four hundred men are with him.”
translation:
  language: tl
  text: Bumalik kay Jacob ang mga sugo[a] at sinabi, “Nakarating kami sa kapatid mong si Esau. Paparating din siya upang salubungin ka, at may kasama siyang apatnaraang lalaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga anghel,” ngunit mas malamang dito ang “mga sugo.” Ang salitang Hebreo na מַלְאָכִים ay maaaring tumukoy sa mga sugo o sa mga anghel; sa kontekstong ito, sila ang mga taong isinugo ni Jacob kay Esau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Bumalik
  rationale: Ang wayyiqtol ng שוב ay nagsasalaysay ng natapos na kilos; natural at tuwiran sa Tagalog ang “bumalik.”
- source_word: הַמַּלְאָכִים
  choice: ang mga sugo
  rationale: Maaaring mangahulugang “mga sugo” o “mga anghel” ang מַלְאָכִים. Sa konteksto, sila ang mga taong isinugo ni Jacob kay Esau, kaya “mga sugo” ang angkop.
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Karaniwang pananda ito ng tuwirang pananalita. Mas natural sa makabagong Tagalog ang “at sinabi” kaysa sa literal na anyong “na nagsasabi.”
- source_word: בָּאנוּ
  choice: Nakarating kami
  rationale: Ang בוא ay pagdating o pagpunta sa isang lugar. Iniiwasan ng “nakarating kami” ang di-natural na deiktikong “dumating kami kay” habang pinananatili ang natapos na paglapit kay Esau.
- source_word: אֶל אָחִיךָ אֶל עֵשָׂו
  choice: sa kapatid mong si Esau
  rationale: Ang ikalawang pariralang may אֶל ay tumutukoy kung sino ang kapatid. Likas sa Tagalog ang pinagsamang “sa kapatid mong si Esau,” habang nananatili ang mahalagang ugnayang pampamilya.
- source_word: וְגַם הֹלֵךְ לִקְרָאתְךָ
  choice: Paparating din siya upang salubungin ka
  rationale: Ipinakikita ng participle ang kasalukuyang nagpapatuloy o nalalapit na kilos, at ng גם ang karagdagang kapansin-pansing balita. Ang “salubungin” ay likas na katumbas ng pagpunta upang makipagtagpo, nang hindi tinutukoy kung mapayapa o mapanlaban ang layunin.
- source_word: וְאַרְבַּע מֵאוֹת אִישׁ עִמּוֹ
  choice: at may kasama siyang apatnaraang lalaki
  rationale: Malinaw na ipinahahayag ang bilang at na kasama ni Esau ang mga lalaki. Ang “lalaki” ay nagpapanatili sa kasarian ng אִישׁ at angkop sa konteksto ng pangkat na kasama niya.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga sugo” bilang kontekstuwal na tawag sa mga tauhang ipinadala, at pinanatiling walang hatol ang layunin ng pagsalubong ni Esau.
