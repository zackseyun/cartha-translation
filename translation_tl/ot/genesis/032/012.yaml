  text: הַצִּילֵ֥/נִי נָ֛א מִ/יַּ֥ד אָחִ֖/י מִ/יַּ֣ד עֵשָׂ֑ו כִּֽי יָרֵ֤א אָנֹכִי֙ אֹת֔/וֹ פֶּן יָב֣וֹא וְ/הִכַּ֔/נִי אֵ֖ם עַל בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/012.yaml
  text: Please deliver me from the hand of my brother[a], from the hand of Esau, for I am afraid of him, lest he come and strike me[b], the mother with the children.
translation:
  language: tl
  text: Iligtas mo sana ako mula sa kamay ng aking kapatid, mula sa kamay ni Esau, sapagkat natatakot ako sa kaniya. Baka dumating siya at salakayin ako—ina kasama ng mga anak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ina sa ibabaw ng mga anak,” isang idyoma para sa pananakit o pagpatay sa ina kasama ng mga anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי נָא
  choice: Iligtas mo sana ako
  rationale: Ang Hiphil imperative ng נצל na may hulaping unang panauhan ay humihiling ng pagliligtas; ipinahahayag ng “sana” ang magalang at nagsusumamong diwa ng נָא.
- source_word: מִיַּד אָחִי מִיַּד עֵשָׂו
  choice: mula sa kamay ng kapatid kong si Esau
  rationale: Pinananatili ang kongkretong idyomang “mula sa kamay,” ngunit likas na pinagsasanib sa Tagalog ang appositional na “kapatid ko—si Esau” upang maiwasan ang mabigat na pag-uulit.
- source_word: כִּי יָרֵא אָנֹכִי אֹתוֹ
  choice: sapagkat natatakot ako sa kaniya
  rationale: Tuwirang ipinahahayag ang dahilan ng pagsusumamo at ang kasalukuyang takot ni Jacob.
- source_word: פֶּן יָבוֹא וְהִכַּנִי
  choice: Baka dumating siya at salakayin ako
  rationale: Ang “baka” ay likas na Tagalog para sa kinatatakutang posibilidad na ipinahahayag ng פֶּן. Ang “salakayin” ay nagpapakita ng marahas na pag-atake nang hindi tiyak na ipinapakahulugang pagpatay ang נכה.
- source_word: אֵם עַל בָּנִים
  choice: pati ang mga ina at kanilang mga anak
  rationale: Ang Hebreong idyoma ay tumutukoy sa paglipol sa ina kasama ng mga anak. Ginawang maramihang pangkalahatang kategorya sa Tagalog upang maging malinaw na hindi si Jacob ang tinutukoy na “ina,” habang pinananatili ang larawan ng pagkawasak ng mga pamilya.
theological_decisions:
- issue: Saklaw ng אֵם עַל בָּנִים
  choice: pati ang mga ina at kanilang mga anak
  alternative: ina kasama ng mga anak
  rationale: Hindi tahasang tinutukoy ng Hebreo kung alin sa mga ina ang nasa isip, at idyomatiko ang parirala. Ang napiling salin ay malinaw na nagsasama sa sambahayan ni Jacob sa kinatatakutang pag-atake nang hindi ipinapalagay na si Jacob mismo ang tinutukoy ng parirala.
- issue: Lakas ng kahulugan ng וְהִכַּנִי
  choice: salakayin ako
  alternative: patayin ako
  rationale: Maaaring tumukoy ang נכה sa pananakit o pagpatay, ngunit hindi nararapat gawing tiyak ang “patayin” kung mas malawak ang pandiwang Hebreo.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at angkop sa panalangin. Ginamit ang “sana” para sa pagsusumamo at “baka” para sa kinatatakutang posibilidad. Ang talababa ay nagpapanatili sa di-pangkaraniwang larawang Hebreo habang malinaw ang pangunahing teksto.
