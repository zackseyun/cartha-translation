  text: וַ/יִּשְׁאַ֞ל אֶת סְרִיסֵ֣י פַרְעֹ֗ה אֲשֶׁ֨ר אִתּ֧/וֹ בְ/מִשְׁמַ֛ר בֵּ֥ית אֲדֹנָ֖י/ו לֵ/אמֹ֑ר מַדּ֛וּעַ פְּנֵי/כֶ֥ם רָעִ֖ים הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/007.yaml
  text: So he asked Pharaoh’s officials who were with him in custody in his master’s house[a], saying[b], “Why are your faces downcast today?”
translation:
  language: tl
  text: Kaya tinanong niya ang mga opisyal[a] ng Paraon na kasama niyang nakakulong sa bahay ng kanyang panginoon[b], “Bakit malungkot ang mga mukha ninyo ngayon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga eunuko.” Maaaring tumukoy ang salitang Hebreo sa mga literal na eunuko o sa mga opisyal ng palasyo sa pangkalahatan.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “na kasama niya sa pagkakapiit sa bahay ng kanyang panginoon.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Kaya tinanong niya
  rationale: Isinusulong ng wayyiqtol ang salaysay; natural sa Tagalog ang “Kaya” bilang ugnay sa napansin ni Jose sa naunang talata.
- source_word: סְרִיסֵי פַרְעֹה
  choice: mga opisyal ng Paraon
  rationale: Maaaring tumukoy ang סָרִיס sa mga literal na eunuko o, sa mas malawak na diwa, sa matataas na opisyal ng palasyo. Ang tungkulin nila ang mahalaga sa konteksto, kaya “mga opisyal” ang pinakamalinaw na pangunahing salin.
- source_word: אֲשֶׁר אִתּוֹ
  choice: na kasama niya
  rationale: Pinananatili ang panghalip ng Hebreo; malinaw sa konteksto na si Jose ang tinutukoy.
- source_word: בְמִשְׁמַר
  choice: nakakulong
  rationale: Ipinahihiwatig ng salita ang kalagayan o lugar ng pagkakapiit. Ang “nakakulong” ay natural at malinaw sa konteksto.
- source_word: בֵּית אֲדֹנָיו
  choice: sa bahay ng kanyang panginoon
  rationale: Tumutukoy ito sa bahay o nasasakupan ng panginoon ni Jose. Pinananatili ng “panginoon” ang ugnayan sa Hebreo nang hindi tahasang ipinapasok ang pangalan ni Potifar.
- source_word: לֵאמֹר
  choice: —
  rationale: Ang karaniwang pormulang pambanggit na לֵאמֹר ay likas na naipapahayag sa Tagalog sa pamamagitan ng tuwirang sipi; ang pagdaragdag ng “na sinasabi” ay magiging alanganin at hindi kailangan.
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Direkta at likas na katumbas ng tanong sa Hebreo.
- source_word: פְּנֵיכֶם רָעִים
  choice: malungkot ang mga mukha ninyo
  rationale: Literal na “masama ang inyong mga mukha,” ngunit isang idyoma ito para sa mukhang malungkot o balisa. Pinananatili ng salin ang hayag na pagtukoy sa kanilang mga mukha.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Natural na katumbas sa Tagalog sa tanong tungkol sa kanilang kasalukuyang anyo sa araw na iyon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “panginoon” sa maliit na titik dahil amo ni Jose ang tinutukoy, hindi isang banal na titulo. Iniwasan ang di-likas na “na sinasabi” bago ang tuwirang sipi.
