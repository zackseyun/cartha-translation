  text: Joseph came to them in the morning and saw them[a], and behold, they were troubled.
translation:
  language: tl
  text: Noong umaga, pumunta si Jose sa kanila at napansin niyang balisa sila[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malungkot,” “matamlay,” o “mabigat ang kalooban.” Inilalarawan ng Hebreo ang isang nakikitang kalagayan ng pagkabagabag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: pumunta si Jose sa kanila
  rationale: Likas sa makabagong Tagalog ang “pumunta ... sa kanila” para sa pagkilos patungo sa mga bilanggo; hindi nito labis na tinutukoy ang lugar gaya ng “pumasok.”
- source_word: בַּבֹּקֶר
  choice: kinaumagahan
  rationale: Sa daloy ng salaysay, malinaw at natural na ipinahihiwatig ng “kinaumagahan” ang umagang kasunod ng mga panaginip.
- source_word: וַיַּרְא אֹתָם
  choice: nakita niyang
  rationale: Tuwirang isinasalin ang pandiwang ראה bilang “nakita,” habang ang pang-ugnay na “-ng” ay natural na nagdurugtong sa napansing kalagayan nila.
- source_word: וְהִנָּם
  choice: '[ipinahayag sa ayos na “nakita niyang ... sila”]'
  rationale: Ang presentatibong diin ng הִנֵּה ay likas na naipapahayag sa Tagalog sa konstruksiyong nagsasaad ng biglang napansing kalagayan; ang literal na “narito” ay magiging pilit sa kontekstong ito.
- source_word: זֹעֲפִים
  choice: balisa
  rationale: Saklaw ng “balisa” ang nakikitang pagkabagabag o pagkabahala nang hindi nililimitahan ang diwa sa galit o lungkot lamang.
