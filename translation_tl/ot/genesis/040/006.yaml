  source_fidelity: Ang “pumunta si Jose sa kanila” at “nakita niyang balisa sila” ay tapat sa pangunahing diwa ng Hebreo. Gayunman, ang “kinaumagahan” ay nagsasaad ng umagang kasunod ng isang tiyak na araw, samantalang ang בַּבֹּקֶר ay simpleng “noong umaga.” Ang presentatibong diin ng וְהִנָּם ay maaaring idiin nang banayad sa Tagalog sa “at napansin niyang.”
