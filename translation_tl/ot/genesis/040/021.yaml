- from: Ibinalik niya ang punong tagapaghain ng inumin sa tungkulin nito,[a] at inilagay nito[b] ang kopa sa kamay ng Paraon.
  to: Ibinalik ng Paraon ang punong tagapaghain ng inumin sa tungkulin bilang tagapaghain ng inumin,[a] at inilagay ng punong tagapaghain ang kopa sa kamay ng Paraon.
