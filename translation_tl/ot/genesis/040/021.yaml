  text: He restored the chief cupbearer to his office[b][a], and he put the cup into Pharaoh’s hand.
translation:
  language: tl
  text: Ibinalik ng Paraon ang punong tagapaghain ng inumin sa tungkulin bilang tagapaghain ng inumin,[a] at inilagay ng punong tagapaghain ang kopa sa kamay ng Paraon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “sa kanyang paglilingkod sa paghahain ng inumin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: Ibinalik niya
  rationale: Ang Hiphil ng שׁוב ay nagsasaad ng pagpapabalik sa dating kalagayan o tungkulin. Likas sa modernong Tagalog ang “ibinalik” at hindi nito dinaragdagan ang kahulugan.
- source_word: שַׂר הַמַּשְׁקִים
  choice: ang punong tagapaghain ng inumin
  rationale: Ang שַׂר ay pinuno o mataas na opisyal, at ang מַּשְׁקִים ay mga tagapaghain ng inumin. Malinaw ang pariralang ito sa karaniwang mambabasa at angkop sa konteksto ng palasyo.
- source_word: עַל מַשְׁקֵהוּ
  choice: sa tungkulin nito
  rationale: Literal itong tumutukoy sa paglilingkod nito bilang tagapaghain ng inumin. Ang “sa tungkulin nito” ay natural sa Tagalog, samantalang pinananatili sa talababa ang mas kongkretong anyo ng Hebreo.
- source_word: וַיִּתֵּן
  choice: inilagay nito
  rationale: Bagaman karaniwang nangangahulugang “nagbigay” ang נתן, sa pariralang may kopa at kamay ay angkop ang “inilagay.” Ginamit ang “nito” upang ituro sa punong tagapaghain bilang malamang na gumagawa ng kilos, habang itinatala sa talababa na hindi tahasang pinangalanan ang simuno sa Hebreo.
- source_word: הַכּוֹס
  choice: ang kopa
  rationale: Ang “kopa” ay tuwiran, marangal, at karaniwang salin para sa sisidlang inuman sa ganitong konteksto.
- source_word: עַל כַּף פַּרְעֹה
  choice: sa kamay ng Paraon
  rationale: Literal na “sa ibabaw ng palad ng Paraon,” ngunit ang “sa kamay ng Paraon” ang natural na idyoma sa Tagalog at tumpak na naghahayag ng paghahain ng kopa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “punong tagapaghain ng inumin” sa halip na isang teknikal o hiram na katawagan, at “tungkulin” para sa natural na pagpapahayag ng muling pagkatalaga sa serbisyo.
