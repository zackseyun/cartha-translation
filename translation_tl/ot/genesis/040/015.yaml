base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/015.yaml
  text: For I was indeed kidnapped from the land of the Hebrews[b][a], and even here I have done nothing that they should put me in the pit.
translation:
  language: tl
  text: Sapagkat talagang dinukot ako[a] mula sa lupain ng mga Hebreo, at kahit dito, wala akong ginawang anumang bagay na magbibigay-katwiran sa paglalagay nila sa akin sa hukay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “talagang ninakaw ako” o “ninakaw ako palayo.” Gumagamit ang Hebreo ng infinitive absolute kasama ng pandiwang may banghay upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong ito, ang “hukay” ay maaaring tumukoy sa bartolina o silid-bilangguan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag ni Jose tungkol sa kanyang kalagayan at pinananatili ang sanhi o paliwanag na diwa ng pang-ugnay.
- source_word: גֻנֹּב גֻּנַּבְתִּי
  choice: talagang dinukot ako
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa pasibong pagkakuha kay Jose. Ang “dinukot” ay likas sa modernong Tagalog para sa sapilitang pagkuha sa isang tao, samantalang ipinapakita ng “talagang” ang diin ng Hebreo.
- source_word: מֵאֶרֶץ הָעִבְרִים
  choice: mula sa lupain ng mga Hebreo
  rationale: Pinananatili nito ang etnikong katawagang “mga Hebreo” nang hindi ipinapalagay na tiyak na estadong pampolitika ang tinutukoy na lupain.
- source_word: וְגַם פֹּה
  choice: At kahit dito
  rationale: 'Ipinahahayag nito ang dagdag na diin: bukod sa dinukot si Jose, wala rin siyang kasalanan sa lugar na kinaroroonan niya ngayon.'
- source_word: לֹא עָשִׂיתִי מְאוּמָה
  choice: wala akong ginawang anuman
  rationale: Likas na ganap na pagtanggi sa Tagalog at tapat sa kahulugang “wala ni anumang ginawa.”
- source_word: כִּי שָׂמוּ אֹתִי
  choice: na dahilan para ilagay nila ako
  rationale: Ipinahahayag na walang ginawa si Jose na makapagbibigay ng dahilan o batayan sa kanyang pagkakabilanggo, nang hindi ipinahihiwatig na layunin niyang maipakulong.
- source_word: בַּבּוֹר
  choice: sa hukay
  rationale: Pinananatili ang kongkretong larawan at pangunahing kahulugan ng בּוֹר, habang nililinaw sa talababa ang kahulugan nito sa konteksto.
