translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “dinukot” para sa likas na paglalarawan sa sapilitang pagkuha sa isang tao, ngunit pinanatili sa talababa ang mas literal na “ninakaw.”
