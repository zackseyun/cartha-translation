  text: and on the vine were three branches[a]. As it was budding, its blossoms came up[b], and its clusters ripened into grapes.
translation:
  language: tl
  text: at sa baging ng ubas ay may tatlong sanga.[a] Habang namumulaklak ito, lumitaw ang bulaklak nito,[b] at ang mga kumpol nito ay naghinog na mga ubas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tatlong supang” o “tatlong usbong.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “at ito, gaya ng namumulaklak, ay umakyat ang bulaklak nito”; inilalarawan ng linya ang mabilis na pag-unlad ng baging hanggang sa pamumulaklak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַגֶּפֶן
  choice: at sa puno ng ubas
  rationale: Likas sa modernong Tagalog ang “puno ng ubas” para sa punong-baging; pinananatili ng “at sa” ang pang-ugnay at lokatibong larawan ng Hebreo.
- source_word: שְׁלֹשָׁה שָׂרִיגִם
  choice: tatlong sanga
  rationale: Ang שָׂרִיגִים ay maaaring tumukoy sa mga sanga, usbong, o galamay ng baging. “Mga sanga” ang pinakamalinaw at pinakapamilyar sa karaniwang mambabasa.
- source_word: וְהִיא כְפֹרַחַת
  choice: Habang umuusbong iyon
  rationale: Ipinahahayag nito ang nagpapatuloy na yugto ng paglago at ginagawang malinaw na ang tinutukoy ng pambabaeng panghalip ay ang puno ng ubas.
- source_word: עָלְתָה נִצָּהּ
  choice: lumitaw ang mga bulaklak nito
  rationale: Ang literal na pag-ahon o paglabas ng namumulaklak na bahagi ay natural na naipahahayag bilang paglitaw ng mga bulaklak; ang maramihan ay kolektibong natural sa Tagalog.
- source_word: הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים
  choice: ang mga kumpol nito ay nahinog at naging mga ubas
  rationale: Pinananatili nito ang mabilis na pagsulong ng larawan tungo sa hinog na bunga at malinaw na ipinapahayag ang predikatibong gamit ng “mga ubas.”
