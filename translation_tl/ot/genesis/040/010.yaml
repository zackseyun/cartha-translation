  naturalness: Likas at malinaw sa modernong Tagalog ang “Sa baging ng ubas ay may tatlong sanga” at ang magkakasunod na paglalarawan ng pamumulaklak at pagkahinog.
  terminology: Ang “baging ng ubas,” “sanga,” “bulaklak,” “kumpol,” at “ubas” ay angkop at di-teknikal. Pinalitan ang “galamay,” na maaaring magpahiwatig ng tentacle at hindi natural na pangunahing alternatibo para sa bahaging tumutubo sa baging.
