  text: 'Joseph answered and said, “This is its interpretation: the three baskets are three days.”'
translation:
  language: tl
  text: 'Sumagot si Jose at sinabi, “Ito ang kahulugan niyon: ang tatlong basket ay tatlong araw.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Sumagot ... at sinabi
  rationale: Pinananatili ang dobleng pormula ng pagsagot at pagsasalita sa Hebreo sa isang natural ngunit tapat na anyong Tagalog.
- source_word: פִּתְרֹנוֹ
  choice: kahulugan niyon
  rationale: Sa konteksto ng panaginip, tumutukoy ito sa paliwanag o interpretasyon nito; mas natural sa karaniwang modernong Tagalog ang “kahulugan niyon.”
- source_word: שְׁלֹשֶׁת הַסַּלִּים
  choice: ang tatlong basket
  rationale: Tuwirang katumbas ng pangngalang סַל ang “basket”; hindi idinagdag ang materyal o pagkakayari na hindi tahasang nakasaad.
- source_word: שְׁלֹשֶׁת יָמִים הֵם
  choice: ay tatlong araw
  rationale: Pinananatili ang tuwirang pagtutumbas ng walang-pandiwang sugnay sa Hebreo, sa halip na gawing mas mapagpaliwanag na “nangangahulugang tatlong araw.”
