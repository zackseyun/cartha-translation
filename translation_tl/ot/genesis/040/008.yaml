  terminology: Ang “Diyos” at “Jose” ay angkop. Pinalitan ang “mga paliwanag” ng “mga pagpapakahulugan” upang maipakita ang פִּתְרֹנִים bilang interpretasyon, lalo na sa konteksto ng panaginip, nang hindi ipinapasok ang isang doktrinal na pagpapakahulugan.
