base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/008.yaml
  text: They said to him[a], “We have dreamed a dream, and there is no one to interpret it.” Joseph said to them[b], “Do not interpretations belong to God? Please tell them to me.”
translation:
  language: tl
  text: Sinabi nila sa kanya, “Nanaginip kami, at walang makapagpaliwanag nito.” Sinabi ni Jose sa kanila, “Hindi ba sa Diyos ang mga pagpapakahulugan? Isalaysay ninyo sa akin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְנוּ
  choice: Nanaginip kami
  rationale: Ang Hebreo ay literal na cognate construction na ‘isang panaginip ang napanaginipan namin.’ Hindi likas sa modernong Tagalog ang gayong pag-uulit, kaya malinaw at natural itong isinalin bilang ‘Nanaginip kami.’ Bagaman anyong isahan ang חֲלוֹם, kapwa lalaki ang may kani-kaniyang panaginip ayon sa konteksto.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: ngunit walang makapagpaliwanag nito
  rationale: Ang פֹתֵר ay aktibong participle, ‘tagapagpaliwanag’ o ‘isang nagpapaliwanag.’ Ang pandiwang ayos na ‘walang makapagpaliwanag’ ay natural sa Tagalog at hindi nagsasabing likas na imposibleng ipaliwanag ang panaginip; ipinahihiwatig nitong walang taong naroon na makapagbibigay ng paliwanag.
- source_word: הֲלוֹא
  choice: Hindi ba
  rationale: Naghuhudyat ito ng retorikal na tanong na umaasang sasang-ayon ang kausap. Tuwirang napapanatili ng ‘Hindi ba’ ang anyo at puwersang iyon.
- source_word: לֵאלֹהִים פִּתְרֹנִים
  choice: sa Diyos nagmumula ang mga paliwanag
  rationale: Ang לְ kay אֱלֹהִים ay maaaring magpahayag ng pag-aari o pinagmulan. Sa Tagalog, natural na ipinahahayag ng ‘sa Diyos nagmumula’ na ang wastong pagpapaliwanag ay nasa Diyos o mula sa kanya, nang hindi inaangkin ni Jose na sarili niya ang kakayahan.
- source_word: פִּתְרֹנִים
  choice: mga paliwanag
  rationale: Pinanatili ang maramihang anyo ng pangngalang Hebreo at ang pangkalahatang diwa nito.
- source_word: סַפְּרוּ נָא לִי
  choice: Pakisabi sa akin ang inyong mga panaginip
  rationale: Ang סַפְּרוּ ay maramihang pautos na ‘isaysay/sabihin,’ at ang נָא ay nagpapalumanay sa pakiusap. Walang tahasang layon sa Hebreo; mula sa konteksto, ang ipasasaysay ay ang mga panaginip ng dalawang lalaki. Ginawang tahasan ito sa Tagalog upang maiwasan ang malabong panghalip.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa modernong Tagalog.
theological_decisions:
- issue: Tinutukoy ng אֱלֹהִים sa sinabi ni Jose
  choice: Diyos
  alternative: isang diyos / mga diyos
  rationale: Sa salaysay tungkol kay Jose, inilalahad niya ang Diyos bilang pinagmumulan ng wastong pagpapaliwanag sa mga panaginip. Hindi hinihingi ng konteksto ang di-tiyak o politeistikong pagbasa.
- issue: Pag-aari o pinagmulan sa לֵאלֹהִים פִּתְרֹנִים
  choice: sa Diyos nagmumula ang mga paliwanag
  alternative: sa Diyos ang mga paliwanag
  rationale: Parehong maaaring katawanin ng Hebreo ang pag-aari at pinagmulan. Pinili ang natural na pahayag sa Tagalog na binibigyang-diin ang Diyos bilang pinagmumulan, habang hindi itinatangging sa kanya rin nauukol ang pagpapaliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang retorikal na tanong ni Jose at ang maramihang ‘mga paliwanag.’ Walang talababa dahil walang alternatibong pagbasa na kailangang ilakip upang maunawaan ang talata.
