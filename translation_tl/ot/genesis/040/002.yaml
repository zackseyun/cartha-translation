  text: And Pharaoh was angry with his two officials[b][a], with the chief cupbearer and with the chief baker.
translation:
  language: tl
  text: At nagalit ang Paraon sa dalawa niyang opisyal[a]—sa punong tagapaghain ng inumin at sa punong panadero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dalawa niyang opisyal sa palasyo”; ang salitang Hebreo ay maaari ring mangahulugang “mga eunuko” sa ilang konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: At nagalit
  rationale: Ang קצף ay nagpapahayag ng galit. Ang “nagalit” ay natural sa makabagong Tagalog at hindi nagpapalabis sa tindi ng damdamin.
- source_word: פַּרְעֹה
  choice: ang Paraon
  rationale: Ito ang karaniwang katawagang Filipino para sa titulong maharlika ng Ehipto.
- source_word: שְׁנֵי סָרִיסָיו
  choice: sa dalawa niyang opisyal
  rationale: Ang סָרִיס ay maaaring tumukoy sa opisyal ng palasyo at, sa ilang konteksto, sa isang eunuko. Dahil pinapangalanan dito ang kanilang mga tungkulin sa palasyo, malinaw ang “opisyal” nang hindi ipinapalagay ang kanilang pisikal na kalagayan.
- source_word: שַׂר הַמַּשְׁקִים
  choice: sa punong tagapaghain ng inumin
  rationale: Ipinapakita ng שַׂר na siya ang pinuno, at ang הַמַּשְׁקִים ay tumutukoy sa mga naghahain o nagbibigay ng inumin. Mas malinaw ito sa karaniwang mambabasa kaysa sa transliteradong titulong teknikal.
- source_word: שַׂר הָאֹפִים
  choice: sa punong panadero
  rationale: Ang parirala ay tumutukoy sa pinuno ng mga panadero; maikli, natural, at tumpak ang “punong panadero.”
- source_word: עַל ... עַל ... וְעַל
  choice: sa ...—sa ... at sa ...
  rationale: Pagkatapos ng pandiwa ng pagkagalit, tinutukoy ng עַל ang mga taong kinagalitan. Pinananatili ng pag-uulit ng “sa” ang diin ng Hebreo, habang nililinaw ng gatlang na ang dalawang kasunod na titulo ang mismong dalawang opisyal.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tagapaghain ng inumin” upang malinaw na ilarawan ang tungkulin sa palasyo, at ang gatlang upang ipakitang ang punong tagapaghain at punong panadero ang dalawang opisyal na tinutukoy.
