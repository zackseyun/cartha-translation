base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/005.yaml
  text: And the two of them dreamed a dream[a], each man his own dream, in one night, each according to the interpretation of his dream—the cupbearer and the baker who belonged to the king of Egypt[d][c][b], who were confined in the prison house.
translation:
  language: tl
  text: At kapuwa sila ay nanaginip sa iisang gabi, bawat isa ay may sarili niyang panaginip, at ang bawat panaginip ay may angkop na kahulugan[a]—ang tagapaghain ng inumin at ang panadero ng hari ng Ehipto, na kapuwa nakabilanggo sa bilangguan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bawat isa ayon sa kahulugan ng sarili niyang panaginip.” Ipinahihiwatig ng Hebreo na ang bawat panaginip ay may kahulugang angkop dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַלְמוּ חֲלוֹם
  choice: ay nanaginip
  rationale: Likas sa modernong Tagalog ang “nanaginip”; ang literal na magkaugnay na pandiwa at pangngalan ay magiging mabigat kung gagawing “nanaginip ng panaginip.”
- source_word: שְׁנֵיהֶם
  choice: silang dalawa
  rationale: Malinaw na pinananatili ang tiyak na bilang na dalawa.
- source_word: אִישׁ חֲלֹמוֹ
  choice: bawat isa ng sarili niyang panaginip
  rationale: 'Pinananatili ang distributibong diwa: magkahiwalay na panaginip ang naranasan ng dalawang lalaking opisyal.'
- source_word: בְּלַיְלָה אֶחָד
  choice: nang gabing iyon
  rationale: Natural na Tagalog para sa isang gabing kapuwa nila naranasan; hindi ipinahihiwatig na iisang panaginip ang kanilang nakita.
- source_word: אִישׁ כְּפִתְרוֹן חֲלֹמוֹ
  choice: bawat panaginip ay may sariling kahulugan
  rationale: Malinaw at natural na ipinahahayag ang pagtutugma ng bawat panaginip sa bukod nitong interpretasyon.
- source_word: הַמַּשְׁקֶה
  choice: ang tagapaghain ng inumin
  rationale: Inilalarawan ang opisyal na tungkulin nang hindi idinaragdag ang “puno,” na wala sa talata.
- source_word: הָאֹפֶה
  choice: ang panadero
  rationale: Tuwirang katumbas at hindi idinaragdag ang ranggong “puno.”
- source_word: אֲשֶׁר לְמֶלֶךְ מִצְרַיִם
  choice: na naglilingkod sa hari ng Ehipto
  rationale: Natural na Tagalog para sa ugnayan o pagkakatalaga nila sa hari; iniiwasan ang di-likas at posibleng mapanlinlang na “pag-aari ng hari.”
- source_word: אֲסוּרִים
  choice: nakabilanggo
  rationale: Ang konteksto ng bilangguan ang nagpapakitang ang pagiging gapos ay pagkakapiit.
- source_word: בֵּית הַסֹּהַר
  choice: sa bilangguan
  rationale: Likas at malinaw na modernong Tagalog; ang literal na “bahay ng bilangguan” ay paulit-ulit at hindi idiomatiko.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinagaan ang Hebreong pag-uulit na magiging di-likas sa Tagalog, habang pinanatili ang dalawang magkahiwalay na panaginip at ang natatanging kahulugan ng bawat isa.
