base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/016.yaml
  text: When the chief baker saw that he had interpreted well[a], he said to Yoseph, “I also had a dream, and behold, three baskets of white bread were on my head.”
translation:
  language: tl
  text: Nang makita ng punong panadero na mahusay ang pagpapakahulugan ni Yoseph, sinabi niya kay Yoseph, “Ako rin ay nanaginip. Narito, may tatlong basket ng puting tinapay[a] sa aking ulo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tatlong basket ng mga pagkaing inihurno.” Hindi tiyak ang salitang Hebreo na חֹרִי; maaari itong tumukoy sa puting tinapay o mga pagkaing inihurno na laman ng mga basket, o sa mga basket mismo bilang butas-butas o hinabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הָאֹפִים
  choice: punong panadero
  rationale: Likas at malinaw na tawag sa opisyal na namumuno sa mga panadero; pinananatili ang diwa ng שַׂר bilang pinuno.
- source_word: כִּי טוֹב פָּתָר
  choice: na maganda ang pagpapakahulugan ni Jose
  rationale: Ipinapahayag ng parirala na itinuring na mahusay o mabuti ang interpretasyon, nang hindi nililimitahan ito sa kahulugang kanais-nais lamang.
- source_word: אַף אֲנִי בַּחֲלוֹמִי
  choice: Ako rin ay nanaginip
  rationale: Natural na Filipino para sa eliptikong pahayag sa Hebreo at malinaw na iniuugnay ang salaysay sa naunang panaginip.
- source_word: וְהִנֵּה
  choice: Narito
  rationale: Pinananatili ang masiglang pantukoy na nagpapakilala sa tagpo sa panaginip.
- source_word: שְׁלֹשָׁה סַלֵּי
  choice: tatlong basket
  rationale: Tuwirang katumbas ng bilang at pangngalan sa Hebreo.
- source_word: חֹרִי
  choice: ng puting tinapay
  rationale: Isang tradisyonal at angkop-sa-kontekstong pagbasa ng di-tiyak na salitang Hebreo; inilalahad sa talababa ang iba pang posibleng kahulugan.
- source_word: עַל רֹאשִׁי
  choice: sa ibabaw ng aking ulo
  rationale: Malinaw at natural na locative expression sa Filipino.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Gumagamit ng nakaugaliang anyo ng pangalang biblikal sa modernong Filipino, na madaling makilala ng karaniwang mambabasa.
