  naturalness: 'Natural at malinaw ang modernong Filipino: “Ngunit ibinitin niya ang punong panadero, gaya ng ipinaliwanag sa kanila ni Jose.” Ang ayos ng pangungusap ay angkop sa marangal na salaysay-Bibliya.'
