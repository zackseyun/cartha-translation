  yaml_path: translation/ot/genesis/040/022.yaml
  text: But he hanged the chief baker[a], just as Joseph had interpreted to them.
translation:
  language: tl
  text: Ngunit ibinitin niya ang punong panadero[a], gaya ng ipinaliwanag sa kanila ni Jose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isinabit.” Ang pandiwang Hebreo ay tumutukoy sa pagbitin o pagsabit; sa ilang konteksto, nauunawaan itong pagtuhog sa tulos o pagtatanghal ng bangkay matapos patayin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: Ngunit
  rationale: 'Bagaman karaniwang pang-ugnay ang וְ at hindi isinasalin ang pantukoy sa layon na אֵת, malinaw ang paghahambing na pasalungat sa naunang talata: ibinalik sa tungkulin ang punong tagapaghain, ngunit pinatay ang punong panadero.'
- source_word: שַׂר הָאֹפִים
  choice: ang punong panadero
  rationale: Ang שַׂר ay tumutukoy sa pinuno o opisyal; ang “punong panadero” ay natural at tumpak sa konteksto ng korte.
- source_word: תָּלָה
  choice: ibinitin
  rationale: Pangunahing kahulugan ng pandiwa ang pagbitin o pagsabit. Pinananatili ng “ibinitin” ang lawak ng Hebreo nang hindi tiyakang ipinapalagay ang eksaktong paraan ng pagpatay.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Ipinakikita nito ang pagtutugma ng nangyari sa naunang interpretasyon ni Jose.
- source_word: פָּתַר
  choice: ipinaliwanag
  rationale: Sa konteksto ng panaginip, nangangahulugan itong magbigay-kahulugan o magpaliwanag. Natural sa Filipino ang “ipinaliwanag” at malinaw na tumutukoy sa naunang paliwanag sa mga panaginip.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Pinananatili ang pangmaramihang panghalip na tumutukoy sa dalawang opisyal.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ito ang nakagawiang anyo ng pangalang יוֹסֵף sa mga saling Bibliya sa Filipino.
