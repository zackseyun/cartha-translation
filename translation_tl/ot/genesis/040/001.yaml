  yaml_path: translation/ot/genesis/040/001.yaml
  text: After these things[a], the cupbearer of the king of Egypt and the baker sinned against their master, the king of Egypt.
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito[a], nagkasala laban sa kanilang panginoon—ang hari ng Ehipto—ang tagapaghain ng inumin ng hari at ang panadero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pagkatapos ng mga bagay na ito.” Mas pormal na maisasalin ang karaniwang panimulang pormula sa salaysay na Hebreo bilang, “At nangyari pagkatapos ng mga bagay na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Pagkatapos ng mga pangyayaring ito
  rationale: Likas na salaysay na transisyon ito sa Hebreo. Ang salin ay malinaw sa makabagong Tagalog habang pinananatili ang pagtukoy sa naunang mga pangyayari; inilalagay sa talababa ang mas pormal na anyo.
- source_word: חָטְאוּ
  choice: nagkasala sa
  rationale: Pinananatili nito ang moral at relasyonal na bigat ng pandiwa, kasama ang offended party na minamarkahan ng ל, sa halip na pahinain bilang simpleng pagpapagalit o pagkakamali.
- source_word: מַשְׁקֵה
  choice: tagapaghain ng inumin
  rationale: Tumutukoy ito sa opisyal na tagapagsilbi ng inumin ng hari. Mas madaling maunawaan ito ng karaniwang mambabasang Filipino kaysa sa hiniram o teknikal na terminong 'tagadala ng kopa,' nang hindi nagdaragdag ng ranggong hindi tahasang nasa talata.
- source_word: הָאֹפֶה
  choice: ang panadero
  rationale: Tuwirang sinasalamin ang tiyak na anyong Hebreo at iniiwasang magdagdag ng panghalip na paari na wala sa teksto.
- source_word: לַאֲדֹנֵיהֶם
  choice: sa kanilang panginoon
  rationale: Ang אדון ay tumutukoy rito sa kanilang taong nakatataas. Ang 'panginoon' ay dignified at akma sa ugnayan ng mga lingkod at hari; nililinaw agad ng kasunod na pariralang ito ay ang hari ng Ehipto, hindi isang titulong tumutukoy sa Diyos.
- source_word: לְמֶלֶךְ מִצְרַיִם
  choice: ang hari ng Ehipto
  rationale: Pinananatili ang appositional na pagkakakilanlan ng kanilang panginoon at ang pag-uulit ng Hebreo para sa diin.
theological_decisions:
- issue: Moral na lakas ng חָטְאוּ sa kontekstong korte
  choice: nagkasala sa
  alternative: nagkasala laban sa / nagkasala ng pagkakasala sa tungkulin laban sa / nagkasala (offended)
  rationale: Hindi nilulutas ng konteksto kung ano mismo ang paglabag. Pinananatili ng 'nagkasala sa' ang moral at relasyonal na bigat ng Hebreo nang hindi ipinapalagay ang tiyak na krimen o doktrinal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'tagapaghain ng inumin' bilang madaling maunawaang katawagan sa opisyal ng palasyo. Ang mga gatlang sa apposition ay tumutulong na malinaw na kilalanin ang 'kanilang panginoon' bilang hari ng Ehipto.
