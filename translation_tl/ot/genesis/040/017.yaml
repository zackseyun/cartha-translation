  text: and in the top basket were all kinds of food for Pharaoh[a], the work of a baker, and the birds were eating them from the basket above my head.
translation:
  language: tl
  text: At ang nasa pinakataas na basket ay sari-saring pagkain para sa Faraon, mga pagkaing gawa ng panadero[a]; at kinakain ang mga ito ng mga ibon mula sa basket na nasa ibabaw ng ulo ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gawa ng panadero,” samakatuwid, mga pagkaing inihanda ng panadero para sa Faraon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַסַּל הָעֶלְיוֹן
  choice: At nasa pinakataas na basket
  rationale: Ang עֶלְיוֹן ay tumutukoy sa basket na nasa itaas o pinakatuktok; malinaw at natural dito ang “pinakataas na basket.”
- source_word: מִכֹּל מַאֲכַל פַּרְעֹה
  choice: ang sari-saring pagkain para sa Faraon
  rationale: Ipinahihiwatig ng מִכֹּל kasama ng kolektibong מַאֲכַל ang iba’t ibang uri ng pagkain; ang “para sa Faraon” ay nagpapanatili sa ugnayang ipinahahayag ng Hebreo nang hindi labis na tinutukoy kung pag-aari o inihanda para sa kaniya.
- source_word: מַעֲשֵׂה אֹפֶה
  choice: mga gawa ng panadero
  rationale: Malapit ito sa literal na “gawa ng panadero” at sa konteksto ay tumutukoy sa mga pagkaing ginawa o niluto ng panadero; pinananatili sa talababa ang mas tiyak na paliwanag.
- source_word: וְהָעוֹף
  choice: at ... ng mga ibon
  rationale: Maaaring kolektibo ang עוֹף; natural sa Tagalog ang maramihang “mga ibon.”
- source_word: אֹכֵל
  choice: kinakain
  rationale: Ang participle ay naglalarawan ng patuloy na kilos sa tagpo ng panaginip; naipahahayag ito ng aspektong imperpektibo sa “kinakain.”
- source_word: אֹתָם
  choice: iyon
  rationale: Bagaman panlalaking maramihan ang hulapi sa Hebreo, walang bilang ang panghalip na Tagalog na “iyon”; likas itong tumutukoy sa sari-saring pagkain o mga pagkaing ginawa ng panadero.
- source_word: מִן הַסַּל
  choice: mula sa basket
  rationale: Tuwirang ipinahahayag ng “mula sa” ang pinagmumulan na tinutukoy ng מִן.
- source_word: מֵעַל רֹאשִׁי
  choice: sa ibabaw ng ulo ko
  rationale: Pinananatili nito ang posisyong nasa itaas na ipinahahayag ng מֵעַל nang hindi kinakailangang ipalagay na nakadikit ang basket sa ulo.
