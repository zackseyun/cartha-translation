  source_fidelity: 'Tumpak ang pangunahing tagpo: ang pagkain ay nasa pinakataas na basket, para sa Faraon, at kinakain ng mga ibon mula sa basket na nasa ibabaw ng ulo ng nagsasalita. Gayunman, ang “mga gawa ng panadero” ay hindi likas na pantukoy sa pagkain sa modernong Filipino at maaaring maunawaang hiwalay na mga bagay, sa halip na paglalarawan ng pagkaing nasa basket.'
