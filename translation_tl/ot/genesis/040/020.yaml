    issue: Ang “Sa harap ng mga ito” ay bahagyang mas tiyak kaysa sa “sa gitna ng kaniyang mga lingkod.”
    rationale: Ang בְּתוֹךְ ay literal na “sa gitna/sa kalagitnaan,” samantalang ang “sa harap ng” ay nagbibigay-diin sa pagiging pampubliko. Gayunman, hindi nito binabago ang diwa sa konteksto at nananatiling katanggap-tanggap.
