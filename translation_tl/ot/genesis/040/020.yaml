base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
translation:
  language: tl
  text: Pagsapit ng ikatlong araw, na kaarawan ng Paraon, naghanda siya ng isang piging para sa lahat ng kaniyang mga lingkod. Sa harap ng mga ito, itinaas niya ang ulo[a] ng punong tagapaghain ng inumin at ang ulo ng punong panadero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas malayang pagpapakahulugan, “binigyang-pansin niya” o “tinawag niya sa harap.” Literal na sinasabi ng Hebreo na “itinaas niya ang ulo.” Pinanatili rito ang idyoma dahil ginagamit ito sa kalapit na salaysay para sa magkaibang kinahinatnan ng dalawang opisyal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: Pagsapit ng ikatlong araw
  rationale: Likas na salaysay sa modernong Tagalog na malinaw na nag-uugnay sa sumunod na pangyayari, nang hindi ginagawang kahoy ang pambungad na וַיְהִי.
- source_word: יוֹם הֻלֶּדֶת אֶת־פַּרְעֹה
  choice: na kaarawan ng Paraon
  rationale: Tuwirang katumbas ng araw ng kapanganakan ng Paraon at natural sa kasalukuyang Tagalog.
- source_word: וַיַּעַשׂ מִשְׁתֶּה
  choice: naghanda siya ng isang piging
  rationale: Ang מִשְׁתֶּה ay piging o handaan, karaniwang may pag-inom; malinaw at marangal ang 'naghanda ... ng isang piging.'
- source_word: לְכָל עֲבָדָיו
  choice: para sa lahat ng kaniyang mga lingkod
  rationale: Sa konteksto ng maharlikang korte, saklaw ng עֲבָדִים ang mga lingkod, tauhan, at opisyal; hindi kailangang ipakahulugang mga alipin.
- source_word: וַיִּשָּׂא אֶת־רֹאשׁ
  choice: itinaas niya ang ulo
  rationale: Pinanatili ang literal na idyoma dahil sinasadyang paglaruan ng salaysay ang pariralang ito at ang magkaibang kinahinatnan ng dalawang opisyal.
- source_word: שַׂר הַמַּשְׁקִים
  choice: punong tagapaghain ng inumin
  rationale: Malinaw na modernong Tagalog para sa opisyal na namamahala sa paghahain ng inumin sa korte.
- source_word: שַׂר הָאֹפִים
  choice: punong panadero
  rationale: Natural at maikling katumbas ng titulong pangkorte.
- source_word: בְּתוֹךְ עֲבָדָיו
  choice: Sa harap ng mga ito
  rationale: Ipinahihiwatig ng parirala na ginawa ito sa gitna o presensiya ng kaniyang mga lingkod; iniiwasan din nito ang mabigat na pag-uulit sa Tagalog.
