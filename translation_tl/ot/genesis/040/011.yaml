  text: Pharaoh’s cup was in my hand[a], and I took the grapes and squeezed them into Pharaoh’s cup[c][b], and I placed the cup into Pharaoh’s hand.
translation:
  language: tl
  text: Nasa kamay ko ang kopa ng Faraon. Kinuha ko ang mga ubas at piniga ko ang mga ito, at pinatulo ang katas sa kopa ng Faraon. Inilagay ko ang kopa sa kamay ng Faraon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa ibabaw ng palad ng Faraon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: kopa
  rationale: Karaniwang sisidlang inuman ang tinutukoy. Ang “kopa” ay natural at marangal sa salaysay tungkol sa palasyo.
- source_word: בְּיָדִי
  choice: nasa kamay ko
  rationale: Pinananatili nito ang malinaw at kongkretong larawan ng ulat sa panaginip.
- source_word: וָאֶקַּח
  choice: kinuha ko
  rationale: Direkta at karaniwang katumbas ng pandiwa sa sunod-sunod na salaysay.
- source_word: הָעֲנָבִים
  choice: ang mga ubas
  rationale: Tuwirang katumbas na pinananatili ang tiyak na pantukoy.
- source_word: וָאֶשְׂחַט אֹתָם אֶל כּוֹס פַּרְעֹה
  choice: piniga ang mga iyon sa kopa ng Faraon
  rationale: Ang pandiwa ay tumutukoy sa pagpiga upang lumabas ang katas; malinaw sa konteksto na sa kopa napunta ang katas ng mga ubas.
- source_word: וָאֶתֵּן
  choice: inilagay ko
  rationale: Bagaman maaari itong mangahulugang “ibinigay,” inilalarawan dito ang kongkretong paglalagay ng kopa sa kamay ng Faraon.
- source_word: עַל כַּף פַּרְעֹה
  choice: sa kamay ng Faraon
  rationale: Literal na “sa ibabaw ng palad ng Faraon,” ngunit ang “sa kamay” ang natural na Filipino para sa kilos ng pag-aabot o paglalagay ng kopa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Hinati sa tatlong pangungusap upang maging natural ang sunod-sunod na kilos, habang pinananatili ang daloy ng Hebreong salaysay. Ginamit ang “Faraon” bilang titulo at “kopa” para sa sisidlang inuman.
