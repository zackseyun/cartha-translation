revisions:
- from: Nasa kamay ko ang kopa ng Faraon. Kinuha ko ang mga ubas at piniga ang mga iyon sa kopa ng Faraon. Pagkatapos, inilagay ko ang kopa sa kamay ng Faraon.[a]
  to: Nasa kamay ko ang kopa ng Faraon. Kinuha ko ang mga ubas at piniga ko ang mga ito, at pinatulo ang katas sa kopa ng Faraon. Inilagay ko ang kopa sa kamay ng Faraon.[a]
  rationale: Nilinaw ang resulta at patutunguhan ng pagpiga—ang katas ng ubas ay napunta sa kopa—nang hindi nagdaragdag ng hindi ipinahihiwatig ng teksto. Inalis ang hindi kailangang “Pagkatapos.” Pinanatili ang natural na idiomang “sa kamay ng Faraon” at ang talababa para sa literal na kahulugan ng כַּף (“palad”).
