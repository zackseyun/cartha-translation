base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/013.yaml
  text: In three more days Pharaoh will lift up your head and restore you to your position[a], and you will place Pharaoh’s cup into his hand, according to the former custom when you were his cupbearer.
translation:
  language: tl
  text: Pagkalipas ng tatlo pang araw, itataas ng Paraon ang iyong ulo[a] at ibabalik ka sa iyong dating tungkulin. Ilalagay mo sa kanyang kamay ang kopa ng Paraon ayon sa dating kaugalian, nang ikaw ang kanyang tagapag-abot ng inumin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “itataas ang iyong ulo.” Dito, ang idyoma ay tumutukoy sa pagpapanumbalik sa tungkulin; pinaghahanda rin ng literal na pananalitang ito ang kasalungat na gamit sa talata 19.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: Pagkalipas ng tatlong araw
  rationale: Likas na ipinapahayag sa modernong Tagalog ang natitirang yugto bago mangyari ang ipinahahayag, nang hindi ipinahihiwatig na maaaring mangyari anumang oras sa loob ng tatlong araw.
- source_word: יִשָּׂא ... אֶת רֹאשֶׁךָ
  choice: itataas ... ang iyong ulo
  rationale: Pinananatili ang literal na idyomang Hebreo at ang mahalagang ugnayang pampanitikan nito sa talata 19; nililinaw ng kasunod na sugnay na paborableng pagpapanumbalik ang kahulugan dito.
- source_word: וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  choice: ibabalik ka sa iyong tungkulin
  rationale: Ang כֵּן ay tumutukoy rito sa dating puwesto o katungkulan sa korte; malinaw at natural ang “tungkulin” sa Tagalog.
- source_word: וְנָתַתָּ כוֹס פַּרְעֹה בְּיָדוֹ
  choice: ilalagay ang kopa ng Paraon sa kanyang kamay
  rationale: Pinananatili ang kongkretong larawan ng seremonyal na paghahain ng kopa; ang נתן ay maaaring mangahulugang ibigay o ilagay.
- source_word: כַּמִּשְׁפָּט הָרִאשׁוֹן
  choice: gaya ng dati mong ginagawa
  rationale: Sa konteksto, ang מִשְׁפָּט ay ang dating nakagawiang pamamaraan ng paglilingkod, hindi isang batas o hatol.
- source_word: אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  choice: noong ikaw ang tagapagdala niya ng kopa
  rationale: Isinasalin ang opisyal na tungkuling מַשְׁקֶה sa malinaw na katawagang mauunawaan ng karaniwang mambabasa, habang iniiwasan ang hiram at di-gaanong pamilyar na terminong “kopero.”
