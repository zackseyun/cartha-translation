  naturalness: Marangal at malinaw ang pangkalahatang rehistro, ngunit medyo mabigat ang “gaya ng dati mong ginagawa noong ikaw ang tagapagdala niya ng kopa.” Mas natural ang “ayon sa dating kaugalian, nang ikaw ang kanyang tagapag-abot ng inumin.”
