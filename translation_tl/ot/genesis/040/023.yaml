  yaml_path: translation/ot/genesis/040/023.yaml
  text: But the chief cupbearer did not remember Joseph[a], but forgot him.
translation:
  language: tl
  text: Ngunit hindi naalala ng punong tagapaghain ng inumin si Jose; nalimutan niya siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At hindi naalala ng punong tagapaghain ng inumin si Jose; nalimutan niya siya.”
    reason: Ipinakikita ang posibleng simpleng pandugtong na kahulugan ng וְ sa halip na ang kontras na “Ngunit.”
lexical_decisions:
- source_word: וְ/לֹא
  choice: Ngunit hindi
  rationale: Ipinahihiwatig ng pang-ugnay at pagtanggi ang pagsalungat sa naunang katuparan ng paliwanag ni Jose; natural sa Filipino ang “Ngunit hindi.”
- source_word: זָכַר
  choice: naalala
  rationale: Pinananatili nito ang karaniwang kahulugang “remember” nang hindi idinaragdag ang ipinahihiwatig na pagkilos sana para kay Jose.
- source_word: שַׂר הַמַּשְׁקִים
  choice: punong tagapaghain ng inumin
  rationale: Malinaw at marangal na paglalarawan ito sa mataas na opisyal ng palasyo na namamahala sa paghahain ng inumin.
- source_word: אֶת יוֹסֵף
  choice: si Jose
  rationale: Ang pantukoy na אֶת ay hindi tuwirang isinasalin; ginagamit ang karaniwang anyong Filipino ng pangalan.
- source_word: וַיִּשְׁכָּחֵהוּ
  choice: nalimutan niya ito
  rationale: Tuwirang inilalahad ang pandiwang “nakalimot” at ang panlalaking isahang layon na tumutukoy kay Jose; pinananatili rin ang madiing pag-uulit ng unang sugnay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “punong tagapaghain ng inumin” bilang malinaw na katawagan sa opisyal ng palasyo, at semicolon upang mapanatili ang madiing magkaugnay na mga sugnay.
