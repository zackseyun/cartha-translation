  text: So the chief cupbearer told his dream to Joseph and said to him[a], “In my dream, behold, a vine was before me.”
translation:
  language: tl
  text: Isinalaysay ng punong tagapaghain ng inumin kay Jose ang kanyang panaginip at sinabi niya kay Jose, “Sa panaginip ko, narito, isang baging ang nasa harap ko.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa panaginip ko, may isang baging sa harap ko.” Ang Hebreong “narito” ay isang pantawag-pansing salita na mariing nagpapakilala sa imahen sa panaginip.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: isinalaysay
  rationale: Ang piel ng ספר ay nangangahulugang ikuwento o isalaysay. Ang “isinalaysay” ay natural at angkop sa paglalahad ng isang panaginip.
- source_word: שַׂר הַמַּשְׁקִים
  choice: punong tagapaghain ng inumin
  rationale: Tumutukoy ito sa mataas na opisyal na namamahala sa paghahain ng inumin sa hari. Iniiwasan ng saling ito ang makalumang “punong katiwala ng kopa” at malinaw sa karaniwang mambabasa.
- source_word: אֶת חֲלֹמוֹ
  choice: ang kanyang panaginip
  rationale: Tuwirang layon ito na may hulaping panlalaking isahan; malinaw na tumutukoy sa panaginip ng punong tagapaghain.
- source_word: לְיוֹסֵף
  choice: kay Jose
  rationale: Ang לְ ay nagmamarka sa pinagsabihan; “kay Jose” ang natural na anyo sa Tagalog.
- source_word: וַיֹּאמֶר לוֹ
  choice: Sinabi niya
  rationale: Sa Tagalog, sapat at mas natural ang “Sinabi niya” dahil malinaw na si Jose ang kausap mula sa naunang sugnay; hindi nawawala ang referensiya ng לוֹ.
- source_word: בַּחֲלוֹמִי
  choice: Sa panaginip ko
  rationale: Direkta at natural na katumbas ng pariralang nagpapakilala sa salaysay ng panaginip.
- source_word: וְהִנֵּה
  choice: naroon
  rationale: Ang הִנֵּה ay pantawag-pansin na mas natural na naihahatid sa modernong Tagalog sa “naroon,” habang pinananatili ang biglang paglitaw ng larawan sa panaginip.
- source_word: גֶפֶן
  choice: isang puno ng ubas
  rationale: Bagaman literal na “baging,” ang “puno ng ubas” ay mas madaling maunawaan sa karaniwang modernong Filipino at malinaw na tumutukoy sa halamang ubas.
- source_word: לְפָנַי
  choice: sa harap ko
  rationale: Ito ang tuwirang at natural na katumbas ng Hebreong parirala; ang lokatibong diwa ay ikinabit sa “naroon.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit payak na himig. Ginamit ang “punong tagapaghain ng inumin” upang malinaw na ilarawan ang katungkulan, at “puno ng ubas” para sa mas pangkaraniwang pag-unawa; inilagay sa talababa ang mas pormal at literal na “masdan” at “baging.”
