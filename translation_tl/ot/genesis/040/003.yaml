  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkasunod na pagtukoy sa bahay ng opisyal at sa bilangguan, at inilagay sa talababa ang posibleng ugnayang sintaktiko ng dalawang lokasyon.
