  yaml_path: translation/ot/genesis/040/003.yaml
  text: And he put them in custody in the house of the captain of the guard[a], in the prison house[c][b], the place where Joseph was confined.
translation:
  language: tl
  text: At inilagay niya sila sa kustodiya sa bahay ng pinuno ng mga bantay[a], sa bilangguan[b], ang lugar kung saan nakapiit si Jose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “pinuno ng mga tagakatay”; sa kontekstong ito, maaari ring unawain bilang “pinuno ng mga tagapagpatupad ng hatol.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring unawain ang ayos ng mga parirala bilang: “sa bahay ng pinuno ng mga bantay, papunta sa bilangguan.”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָם בְּמִשְׁמַר
  choice: ipiniit niya sila
  rationale: Sa kontekstong ito, ang נָתַן na may בְּמִשְׁמַר ay nangangahulugang ilagay sa kustodiya o pagkakapiit. Likas at malinaw sa modernong Tagalog ang “ipiniit” nang hindi dinaragdagan ang detalye.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: bahay ng pinuno ng mga bantay
  rationale: Ginamit ang pamagat na “pinuno ng mga bantay” dahil ang literal na kaugnayan ng טַבָּחִים sa mga tagapatay o tagapagpatupad ng hatol ay maaaring magbigay ng maling larawan sa karaniwang mambabasa; inilalahad sa talababa ang mas literal na posibilidad.
- source_word: אֶל בֵּית הַסֹּהַר
  choice: sa bilangguan
  rationale: Ang בֵּית הַסֹּהַר ay tumutukoy sa bilangguan. Ang payak na “sa bilangguan” ay natural sa Tagalog, habang ang literal na “bahay-bilangguan” ay hindi karaniwang gamit.
- source_word: אֲשֶׁר יוֹסֵף אָסוּר שָׁם
  choice: ang lugar na pinagkulungan kay Jose
  rationale: Ang אָסוּר ay maaaring mangahulugang nakagapos o nakapiit. Ang “pinagkulungan” ay angkop sa konteksto ng bilangguan at likas na isinasama ang diwa ng שָׁם sa pariralang “ang lugar na.”
