  source_fidelity: Ang "ipiniit niya sila" ay katanggap-tanggap sa konteksto, ngunit ang "inilagay niya sila sa kustodiya" ay mas malinaw na tumutugon sa וַיִּתֵּן ... בְּמִשְׁמָר, na nagsasaad ng paglalagay sa kustodiya. Ang huling parirala ng draft na "pinagkulungan kay Jose" ay hindi likas at hindi wastong paraan upang ipahayag na si Jose ay nakapiit sa lugar na iyon.
  naturalness: Mas natural sa modernong Tagalog ang "ang lugar kung saan nakapiit si Jose" kaysa "ang lugar na pinagkulungan kay Jose." Ang magkasunod na pariralang "sa bahay ... , sa bilangguan" ay nananatiling malinaw at pinapanatili ang kaugnayan ng dalawang lokasyon sa Hebreo.
  terminology: 'Ang "pinuno ng mga bantay" ay isang angkop at matatag na salin ng pamagat sa naratibong ito. Dapat lamang gawing mas tumpak ang talababa: ang literal na kaugnayan ng טַבָּחִים ay sa mga tagakatay at, sa kontekstong panghukuman, maaaring sa mga tagapagpatupad ng hatol; hindi kinakailangang ipakahulugang karaniwang "tagapatay."'
