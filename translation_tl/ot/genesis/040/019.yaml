base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/019.yaml
  text: In three more days Pharaoh will lift up your head from upon you and hang you on a tree[b][a], and the birds will eat your flesh from upon you.
translation:
  language: tl
  text: Sa loob ng tatlo pang araw, iaangat ng Paraon ang iyong ulo mula sa iyong katawan[a] at ibibitin ka sa isang puno[b]. Kakainin ng mga ibon ang laman ng iyong katawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “iaangat ang iyong ulo mula sa iyo.” Malamang na malagim na paglalaro ito ng salita sa kaparehong pananalitang ginamit sa positibong diwa sa paliwanag sa panaginip ng tagapagdala ng kopa; dito, ipinahihiwatig nito ang pag-aalis ng ulo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “ibibitin ka sa kahoy” o “itutusok ka sa isang poste.” Sa Hebreo, “sa isang puno.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: Pagkalipas pa ng tatlong araw
  rationale: Likas sa makabagong Tagalog at ipinahahayag ang natitirang tatlong araw bago mangyari ang sinabi.
- source_word: יִשָּׂא ... אֶת רֹאשְׁךָ מֵעָלֶיךָ
  choice: iaangat ... ang iyong ulo mula sa iyo
  rationale: Pinananatili ang idyoma at malagim na paglalaro sa kaparehong pananalita sa talata 13, habang ipinahihiwatig ng “mula sa iyo” ang pag-aalis ng ulo.
- source_word: וְתָלָה אוֹתְךָ עַל עֵץ
  choice: ibibitin ka sa isang puno
  rationale: Ang תלה ay “ibitin,” at ang עֵץ ay “puno” o “kahoy.” Pinananatili ng “puno” ang lantad na anyo at ugnayang pampanitikan ng Hebreo.
- source_word: וְאָכַל הָעוֹף
  choice: Kakainin ng mga ibon
  rationale: Bagaman kolektibong isahan ang Hebreo, mas likas sa Tagalog ang maramihang “mga ibon.” Ang “kakainin” ay payak at hindi nagpapalabis.
- source_word: אֶת בְּשָׂרְךָ מֵעָלֶיךָ
  choice: ang laman mula sa iyong katawan
  rationale: Pinananatili ng “laman” ang kongkreto at malagim na larawan; nililinaw ng “mula sa iyong katawan” ang ikalawang מֵעָלֶיךָ sa paraang mauunawaan sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa pagbitay at ang malagim na pagbaligtad sa idyoma ng talata 13
  choice: Panatilihin sa pangunahing teksto ang “iaangat ... ang iyong ulo mula sa iyo” sa halip na tahasang sabihing “pupugutan ka.”
  alternative: Pupugutan ka ng Paraon at ibibitin ang iyong katawan sa isang poste.
  rationale: Mas malinaw ang alternatibo ngunit nilulutas nito ang idyoma at inaalis ang sadyang pag-uugnay sa positibong gamit ng kaparehong pananalita sa talata 13. Pinananatili ng napiling salin ang tensiyon at ironiyang pampanitikan ng Hebreo.
translation_notes:
  register: Makabago, marangal, at tuwirang Tagalog. Bahagyang di-karaniwan ang “iaangat ... ang iyong ulo mula sa iyo,” ngunit sinadya ito upang mapanatili ang idyoma, wordplay, at malagim na pahiwatig ng Hebreo; ipinaliliwanag ito sa talababa.
