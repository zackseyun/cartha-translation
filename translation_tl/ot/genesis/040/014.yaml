base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/014.yaml
  text: But if you remember me when it goes well for you[a], please show kindness to me, and mention me to Pharaoh[b], and bring me out of this house.
translation:
  language: tl
  text: 'Ngunit kung bumuti ang kalagayan mo, alalahanin mo ako[a], at pakisuyong pagpakitaan mo ako ng kabutihan: banggitin mo ako sa Paraon at ilabas mo ako sa bahay na ito.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isaisip mo ako kapag bumuti ang kalagayan mo.”
    reason: Pinananatili ng alternatibo ang posibleng diin ng אִתְּךָ (“kasama mo”), na idyomatikong nagpapahiwatig ng personal na pagsasaisip.
  - marker: b
    text: Ang “bahay” dito ay tumutukoy sa lugar ng pagkakulong.
    reason: Nililinaw ang kahulugan sa konteksto nang hindi pinapalitan ng “bilangguan” ang literal na salita sa pangunahing teksto.
lexical_decisions:
- source_word: כִּי אִם
  choice: Ngunit kapag
  rationale: Sa konteksto, ipinakikita ng parirala ang pagsalungat at isang inaasahang pagkakataon matapos maibalik ang katiwala sa tungkulin; natural sa Tagalog ang “Ngunit kapag.”
- source_word: זְכַרְתַּנִי אִתְּךָ
  choice: alalahanin mo ako
  rationale: Ang אִתְּךָ ay bahagi ng idyomatikong pahayag at hindi kailangang tumbasan ng artipisyal na “kasama mo”; naipahahayag ng “alalahanin mo ako” ang diwa nang malinaw.
- source_word: כַּאֲשֶׁר יִיטַב לָךְ
  choice: kapag naging mabuti na ang kalagayan mo
  rationale: Tumutukoy ito sa inaasahang pagpapanumbalik at mabuting kapalaran ng katiwala, hindi lamang sa pansamantalang magandang pakiramdam.
- source_word: וְעָשִׂיתָ נָּא עִמָּדִי חָסֶד
  choice: Pakisuyong pagpakitaan mo ako ng kabutihan
  rationale: Inihahatid ng “pakisuyo” ang pakiusap na נָא, at ang “kabutihan” ay angkop sa praktikal na kagandahang-loob na hinihingi rito ng חֶסֶד.
- source_word: וְהִזְכַּרְתַּנִי אֶל פַּרְעֹה
  choice: banggitin mo ako sa Paraon
  rationale: Ang Hiphil ng זכר ay nangangahulugang dalhin si Jose sa pansin ng Paraon; tuwiran at natural ang “banggitin mo ako.”
- source_word: וְהוֹצֵאתַנִי מִן הַבַּיִת הַזֶּה
  choice: ilabas mo ako sa bahay na ito
  rationale: Pinananatili ng “ilabas” ang sanhiing anyo ng pandiwa, at ng “bahay” ang literal na salita sa Hebreo, bagaman lugar ng pagkakulong ang tinutukoy.
