translation_notes:
  register: Makabago, magalang, at marangal na Filipino. Ginamit ang “Paraon,” ang karaniwang anyong Filipino ng titulo. Hinati sa dalawang pangungusap upang maging malinaw ang masidhing personal na pakiusap ni Jose habang pinananatili ang daloy ng Hebreo.
