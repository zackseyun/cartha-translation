base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/004.yaml
  text: So the captain of the guard assigned Joseph to them[a], and he attended them[b]; and they were in custody for some time.
translation:
  language: tl
  text: Itinalaga ng pinuno ng mga bantay si Jose na mag-asikaso sa kanila[a], at pinaglingkuran niya sila. Nanatili sila sa piitan nang ilang panahon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinalaga si Jose sa kanila” o “inatasang mamahala sa kanila.” Maaaring magpahiwatig ang pandiwang Hebreo ng pagtatalaga sa pananagutan; kaya ang tungkulin ni Jose ay maaaring unawain bilang pag-aasikaso o pangangasiwa.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at sila ay mga araw sa ilalim ng bantay,” isang idyomang Hebreo na nangangahulugang nanatili sila roon nang isang yugto ng panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: inatasan
  rationale: Ipinahihiwatig ng פקד ang pagtatalaga sa isang pananagutan. Likas sa makabagong Tagalog ang “inatasan” at hindi nito lubusang nilulutas kung ang tungkulin ni Jose ay pangangasiwa o personal na paglilingkod.
- source_word: שַׂר הַטַּבָּחִים
  choice: pinuno ng mga bantay
  rationale: Bagaman literal na tumutukoy sa pinuno ng mga tagapatay, isa itong titulong panghukuman o panseguridad sa salaysay. Malinaw at marangal sa Tagalog ang “pinuno ng mga bantay.”
- source_word: אֶת יוֹסֵף אִתָּם
  choice: si Jose na mamahala sa kanila
  rationale: Iniuugnay ng parirala si Jose sa mga bilanggo bilang itinalagang responsable sa kanila. Ang “mamahala sa kanila” ay angkop sa konteksto, habang kinikilala sa talababa ang posibleng diing pag-aasikaso.
- source_word: וַיְשָׁרֶת אֹתָם
  choice: at pinaglingkuran niya sila
  rationale: Karaniwang nangangahulugan ang שרת na maglingkod o mag-asikaso. Tuwirang naipapahayag ng “pinaglingkuran” ang aktuwal na paglilingkod ni Jose nang walang natatanging ritwal na pahiwatig.
- source_word: וַיִּהְיוּ יָמִים
  choice: Nanatili sila nang ilang panahon
  rationale: Ang literal na “sila ay mga araw” ay idyomang Hebreo para sa pananatili sa loob ng isang di-tiyak na yugto.
- source_word: בְּמִשְׁמָר
  choice: sa piitan
  rationale: Sa konteksto, ang מִשְׁמָר ay binabantayang pagkakakulong. Natural sa Tagalog ang “sa piitan,” bagaman maaari rin itong isaling “nasa kustodiya.”
theological_decisions:
- issue: Saklaw ng awtoridad ni Jose sa dalawang bilanggo
  choice: 'Panatilihin ang ugnayan ng pangangasiwa at paglilingkod: “mamahala sa kanila” kasunod ng “pinaglingkuran niya sila.”'
  alternative: “Itinalaga si Jose sa kanila” o “inatasang mag-asikaso sa kanila.”
  rationale: Maaaring tumukoy ang פקד sa pananagutan o pangangasiwa, samantalang malinaw na paglilingkod ang kasunod na שרת. Hindi dapat ipakahulugang lubos na opisyal na kapangyarihan lamang o personal na serbisyo lamang ang tungkulin niya.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang payak na pagkakasunod-sunod ng mga kilos at ang di-tiyak na haba ng pagkakabilanggo. Ang “pinaglingkuran” ay ginamit sa karaniwang kahulugan, hindi bilang natatanging terminong panrelihiyon.
