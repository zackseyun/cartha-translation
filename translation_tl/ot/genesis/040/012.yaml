  text: 'Then Joseph said to him[a], “This is its interpretation: the three branches are three days.”'
translation:
  language: tl
  text: 'Sinabi ni Jose sa kanya, “Ito ang kahulugan nito: ang tatlong sanga[a] ay tatlong araw.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga sanga ng baging,” “mga usbong,” o “mga galamay ng baging.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas na ipinahahayag ng “Pagkatapos ay” ang pagkakasunod-sunod ng pangyayari.
- source_word: לוֹ
  choice: sa kanya
  rationale: Pinananatili ang tahasang panghalip sa Hebreo at hindi ipinapalit sa pangunahing teksto ang tinutukoy nitong tagapagdala ng kopa.
- source_word: פִּתְרֹנוֹ
  choice: kahulugan niyon
  rationale: Tumutukoy ito sa kahulugan o pagpapaliwanag ng panaginip; natural sa modernong Tagalog ang “kahulugan niyon” at naipapahayag ang hulaping panlalaking isahan nang hindi inuulit ang “panaginip.”
- source_word: שְׁלֹשֶׁת
  choice: tatlong / tatlong
  rationale: Pinananatili ang pag-uulit ng bilang upang mapanatili ang tuwirang pagtutumbas sa paliwanag.
- source_word: הַשָּׂרִגִים
  choice: sanga
  rationale: Malinaw at natural ang “sanga” para sa mga bahagi ng punong ubas sa panaginip, habang inilalagay sa talababa ang mas tiyak na mga posibleng kahulugan.
- source_word: יָמִים
  choice: araw
  rationale: Tuwirang katumbas ng pangngalang temporal at angkop sa pagtutumbas ng sagisag sa isang takdang panahon.
- source_word: הֵם
  choice: ay
  rationale: Ipinahahayag ng panandang panaguri na “ay” ang mariing pagtutumbas sa Hebreo sa natural at marangal na Tagalog.
