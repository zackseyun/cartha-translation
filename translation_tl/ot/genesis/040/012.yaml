translation_notes:
  register: Gumamit ng kasalukuyan, malinaw, at marangal na Tagalog. Ang ayos na “sinabi sa kanya ni Jose” ay natural at pinananatiling malinaw ang tumatanggap ng sinabi. Inilagay ang talababa sa mismong salitang “sanga,” na siyang may leksikal na mga alternatibo.
