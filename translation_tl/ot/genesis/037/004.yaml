  text: When his brothers saw that their father loved him more than all his brothers[a], they hated him and could not speak peaceably to him.
translation:
  language: tl
  text: Nang makita ng mga kapatid niya na mas mahal siya ng kanilang ama kaysa sa lahat ng kapatid niya, kinamuhian nila siya at hindi nila magawang makipag-usap sa kanya nang mapayapa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi nila siya makausap sa maayos at magiliw na paraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Nang makita
  rationale: Ipinapakita ang temporal na ugnayan ng pagkakita ng mga kapatid at ng sumunod nilang pagkamuhi, habang pinananatili ang daloy ng salaysay.
- source_word: אֶחָיו
  choice: mga kapatid niya
  rationale: Tumutukoy sa mga lalaking kapatid ni Jose; sa modernong Tagalog, likas sa konteksto ang pangkalahatang salitang “mga kapatid.”
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng kanilang nakita, hindi lamang ang sanhi ng kanilang pagkilos.
- source_word: אָהַב
  choice: mas mahal
  rationale: Ang pandiwa ay karaniwang nangangahulugang “mahalin”; ang paghahambing na may מִן ang naghahatid ng diwa ng higit na pagmamahal, nang hindi pinapalitan ng mas interpretatibong “pinaboran.”
- source_word: אֲבִיהֶם
  choice: kanilang ama
  rationale: Ang hulapi ay ikatlong panauhang maramihan at tumutukoy sa ama nilang magkakapatid.
- source_word: מִכָּל אֶחָיו
  choice: kaysa sa lahat ng kapatid niya
  rationale: Malapit na pinananatili ang paghahambing sa Hebreo at hindi idinaragdag sa pangunahing teksto ang salitang “iba,” bagaman ipinahihiwatig iyon ng konteksto.
- source_word: וַיִּשְׂנְאוּ
  choice: kinamuhian nila
  rationale: Tuwirang naghahatid ng matinding diwa ng שׂנא at ang payak na pagkakasunod ng salaysay.
- source_word: וְלֹא יָכְלוּ
  choice: at hindi nila magawang
  rationale: Pinananatili ang tahasang kawalan nila ng kakayahang gawin ang kasunod na kilos, sa natural na Tagalog.
- source_word: דַּבְּרוֹ
  choice: makipag-usap sa kanya
  rationale: Likas na Tagalog para sa pagsasalita o pakikitungo sa isang tao; hindi nito ipinapalagay na iisang pahayag lamang ang tinutukoy.
- source_word: לְשָׁלֹם
  choice: nang mapayapa
  rationale: Pinananatili ang larawang may kaugnayan sa kapayapaan habang natural na inilalarawan ang paraan ng kanilang pakikipag-usap.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “mahal” sa halip na mas interpretatibong “pinaboran,” at ang “mapayapa” upang hindi mawala ang salitang-ugat na shalom. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang nililinaw nito.
