    issue: Hindi natural ang salita ng talababa na “nang may pakikipagkaibigan.”
    rationale: Hindi ito karaniwang paraan ng pagpapahayag sa Filipino at ang kasunod na “bilang kaibigan” ay masyadong nagpapakitid sa diwa. Ang לְשָׁלוֹם ay tumutukoy sa mapayapa o magiliw na pakikitungo, hindi kinakailangang pormal na pagkakaibigan.
