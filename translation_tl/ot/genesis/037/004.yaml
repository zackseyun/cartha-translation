revisions:
- from: Nang makita ng mga kapatid niya na mas mahal siya ng kanilang ama kaysa sa lahat ng kapatid niya, kinamuhian nila siya at hindi nila magawang makipag-usap sa kanya nang mapayapa.[a]
  to: Nang makita ng mga kapatid niya na mas mahal siya ng kanilang ama kaysa sa lahat ng kapatid niya, kinamuhian nila siya at hindi nila magawang makipag-usap sa kanya nang mapayapa.[a]
  rationale: Walang kailangang baguhin sa pangunahing teksto. Binago lamang ang talababa upang maging natural na Filipino at upang malinaw na maipaliwanag ang idyomatikong kahulugan ng “magsalita sa kapayapaan” bilang magiliw o mapayapang pakikitungo, nang hindi nagdaragdag ng mas tiyak na relasyong “bilang kaibigan.”
