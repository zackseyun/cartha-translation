  text: He recognized it and said[a], “It is my son’s tunic. A wild animal has devoured him[c][b]. Yosef has surely been torn to pieces.”
translation:
  language: tl
  text: Nakilala niya iyon at sinabi, “Ito ang tunika ng anak ko. Nilapa siya ng isang mabangis na hayop. Tiyak na niluray si Yosef.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, ang isang anyong pandiwang inuulit upang magbigay-diin ay sinusundan ng anyong nangangahulugang “niluray”; ipinahihiwatig nito ang mariing pahayag: “tunay ngang niluray.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכִּירָהּ
  choice: Nakilala niya iyon
  rationale: Ang Hifil ng נכר ay nangangahulugang kilalanin o matukoy. Tumutukoy ang pambabaeng hulapi sa כְּתֹנֶת; natural itong katawanin sa Tagalog ng “iyon.”
- source_word: כְּתֹנֶת בְּנִי
  choice: Damit ito ng anak ko
  rationale: Ang כְּתֹנֶת ay isang kasuotang tulad ng tunika o mahabang damit. Mas madaling maunawaan ng karaniwang mambabasa ang “damit,” at malinaw sa konteksto na ito ang kasuotang ipinakita kay Jacob.
- source_word: חַיָּה רָעָה
  choice: isang mabangis na hayop
  rationale: Ang חַיָּה ay hayop, lalo na rito ay hayop na ligaw, at ang רָעָה ay nagpapahiwatig ng mapanganib o mabangis, hindi ng moral na kasamaan. Ang “mabangis na hayop” ay natural at tumpak sa konteksto.
- source_word: אֲכָלָתְהוּ
  choice: Nilapa siya
  rationale: Literal na “kinain siya,” ngunit sa konteksto ng mabangis na hayop, malinaw at natural na ipinapahayag ng “nilapa” ang marahas na pagkain o pagdevor sa biktima.
- source_word: טָרֹף טֹרַף
  choice: Tiyak na niluray
  rationale: Ang infinitive absolute na kasunod ng passive finite verb ay nagbibigay-diin sa kilos. Ipinahahayag ng “tiyak” ang diin, at ng “niluray” ang marahas na pagpunit ng mandaragit.
- source_word: יוֹסֵף
  choice: Yosef
  rationale: Direktang transliterasyon ito ng pangalang Hebreo at iniiwasan ang anyong inangkop sa Ingles.
