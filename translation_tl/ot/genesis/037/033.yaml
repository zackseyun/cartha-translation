  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “damit” sa halip na teknikal na “tunika,” at ang “nilapa” at “niluray” upang natural na maipahayag ang predatoryong konteksto at ang diin ng Hebreo.
