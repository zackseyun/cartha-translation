  edition: WLC
  text: וַ/יָּקֻמוּ֩ כָל בָּנָ֨י/ו וְ/כָל בְּנֹתָ֜י/ו לְ/נַחֲמ֗/וֹ וַ/יְמָאֵן֙ לְ/הִתְנַחֵ֔ם וַ/יֹּ֕אמֶר כִּֽי אֵרֵ֧ד אֶל בְּנִ֛/י אָבֵ֖ל שְׁאֹ֑לָ/ה וַ/יֵּ֥בְךְּ אֹת֖/וֹ אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/035.yaml
  text: Then all his sons and all his daughters rose up to comfort him[a], but he refused to be comforted and said, “For I will go down to Sheol to my son[b], mourning.” So his father wept for him.
translation:
  language: tl
  text: At tumayo ang lahat ng kanyang mga anak na lalaki at lahat ng kanyang mga anak na babae upang aliwin siya, ngunit tumanggi siyang maaliw. Sinabi niya, “Sapagkat bababa ako sa Sheol[a] habang nagdadalamhati para sa anak ko.”[b] At iniyakan siya ng kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Sheol” ay terminong Hebreo na maaaring tumukoy sa daigdig ng mga patay; kung minsan ay isinasaling “libingan.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring isalin nang mas literal: “Bababa ako sa Sheol patungo sa anak ko, na nagdadalamhati.” Maaari ring unawain ang parirala bilang pagdadalamhati para sa anak niya.'
    reason: word_order_ambiguity
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: tumindig
  rationale: Ang Qal wayyiqtol ng קום ay karaniwang pandiwang nagsasaad ng pagtindig o pagbangon. Pinananatili ng “tumindig” ang kilos sa salaysay nang hindi nagdaragdag ng kahulugan.
- source_word: כָל בָּנָיו וְכָל בְּנֹתָיו
  choice: ang lahat ng kanyang anak na lalaki at babae
  rationale: Malinaw na pinaghihiwalay ng Hebreo ang mga anak na lalaki at mga anak na babae; pinananatili ito sa halip na gawing pangkalahatang “mga anak” lamang.
- source_word: לְנַחֲמוֹ
  choice: upang aliwin siya
  rationale: Sa konteksto ng pagdadalamhati, ang Piel infinitive ng נחם ay tumutukoy sa pagbibigay-aliw o pagdamay. Natural sa modernong Tagalog ang “aliwin.”
- source_word: וַיְמָאֵן לְהִתְנַחֵם
  choice: ngunit tumanggi siyang maaliw
  rationale: Ipinahahayag ng מאן ang tahasang pagtanggi, at ang Hitpael ng נחם dito ay natural na naipapahayag bilang “maaliw.”
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o dahilan ng pagtanggi ni Jacob. Pinananatili ng “Sapagkat” ang paliwanag na ugnayan.
- source_word: אֵרֵד
  choice: bababa ako
  rationale: Tuwirang pinananatili ang unang panauhang imperfect ng ירד at ang sinaunang paglalarawan sa patutunguhan ng mga patay bilang nasa ibaba.
- source_word: אֶל־בְּנִי
  choice: tungo sa anak ko
  rationale: Karaniwang nangangahulugang “patungo sa” ang אֶל. Iniiwasan ng salin ang pagdaragdag ng “kinaroroonan” o iba pang paliwanag na wala mismo sa teksto.
- source_word: אָבֵל
  choice: nagdadalamhati
  rationale: Ipinahahayag nito ang kalagayan ni Jacob bilang isang nagluluksa. Natural itong iugnay sa “bababa” sa Tagalog.
- source_word: שְׁאֹלָה
  choice: sa Sheol
  rationale: Pinananatili ang mahalagang terminong Hebreo sa halip na paliitin ang kahulugan nito bilang libingan lamang o lagyan ito ng mas huling konsepto tungkol sa kabilang buhay.
- source_word: וַיֵּבְךְּ אֹתוֹ אָבִיו
  choice: At iniyakan siya ng kanyang ama
  rationale: Pinananatili ang tuwirang paksa at layon ng Hebreo at ang payak na pagpapatuloy ng salaysay.
theological_decisions:
- issue: Paglilipat ng שְׁאוֹל
  choice: Sheol
  alternative: daigdig ng mga patay; libingan
  rationale: Mas malawak ang saklaw ng שְׁאוֹל kaysa sa isang hukay o libingan lamang. Ang transliterasyong “Sheol” ay nagpapanatili sa konsepto at sa teolohikal na tensiyon ng teksto nang hindi nag-aangkat ng mas maunlad na doktrina tungkol sa kabilang buhay.
- issue: Kaugnayan ng “sa anak ko,” “nagdadalamhati,” at “sa Sheol”
  choice: “bababa akong nagdadalamhati sa Sheol, tungo sa anak ko”
  alternative: “bababa ako sa Sheol na nagdadalamhati dahil sa anak ko”
  rationale: Ang Hebreo ay maaaring unawain na si Jacob ay bababa sa Sheol patungo sa kanyang anak habang nagdadalamhati. Pinananatili ng pangunahing salin ang direksiyonal na lakas ng אֶל at hindi ito ginagawang “dahil sa,” habang itinatala sa talababa ang mas literal na ayos.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang tahasang “anak na lalaki at babae,” ang pag-uulit ng ideya ng pag-aliw, at ang terminong “Sheol.” Inayos lamang ang pagkakasunod ng mga parirala sa direktang pananalita upang maging natural sa Tagalog, habang inilagay sa talababa ang mas literal na ayos ng Hebreo.
