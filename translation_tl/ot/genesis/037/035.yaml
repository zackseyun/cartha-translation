revisions:
- from: At tumindig ang lahat ng kanyang anak na lalaki at babae upang aliwin siya, ngunit tumanggi siyang maaliw. Sinabi niya, “Sapagkat bababa akong nagdadalamhati sa Sheol[a], tungo sa anak ko.”[b] At iniyakan siya ng kanyang ama.
  to: At tumayo ang lahat ng kanyang mga anak na lalaki at lahat ng kanyang mga anak na babae upang aliwin siya, ngunit tumanggi siyang maaliw. Sinabi niya, “Sapagkat bababa ako sa Sheol[a] habang nagdadalamhati para sa anak ko.”[b] At iniyakan siya ng kanyang ama.
  rationale: Inayos ang direktang pananalita upang maging likas sa modernong Tagalog at maipahayag ang malamang na idiomatikong diwa ng pagdadalamhati ni Jacob para sa kanyang anak. Hindi tinanggal ang literal na direksiyonal na posibilidad ng אֶל־בְּנִי; sa halip, iniingatan ito sa talababa. Pinanatili ang Sheol upang huwag bawasan ang semantikong saklaw ng Hebreong termino o magpasok ng partikular na doktrina.
