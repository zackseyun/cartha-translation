  text: So his brothers were jealous of him[a], but his father kept the matter in mind.
translation:
  language: tl
  text: Kaya nainggit sa kanya ang kanyang mga kapatid, ngunit iningatan ng kanyang ama sa kanyang isipan ang bagay na iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iningatan ng kanyang ama ang sinabi,” samakatuwid, hindi niya ito kinalimutan at patuloy niya itong pinag-isipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: nainggit
  rationale: Sa kontekstong ito, ang קנא ay tumutukoy sa inggit na ibinunga ng katayuan at mga panaginip ni Jose. Natural at tuwiran sa modernong Tagalog ang “nainggit.”
- source_word: בּוֹ
  choice: sa kanya
  rationale: Ito ang likas na Tagalog na pananda sa taong pinagtutuunan ng inggit.
- source_word: אֶחָיו
  choice: ang kanyang mga kapatid
  rationale: Bagaman maaaring pangkalahatan sa Tagalog ang “mga kapatid,” malinaw sa salaysay na mga lalaking kapatid ni Jose ang tinutukoy; natural itong pakinggan at hindi nagdaragdag ng hindi nasa teksto.
- source_word: וְאָבִיו
  choice: ngunit ... ang kanyang ama
  rationale: Ang וְ ay literal na “at,” ngunit dito ay nagpapakita ng malinaw na paghahambing o pagsalungat sa reaksiyon ng mga kapatid; natural itong ipinahahayag ng “ngunit.”
- source_word: שָׁמַר
  choice: iningatan ... sa isip
  rationale: Pinananatili nito ang larawan ng “pag-iingat” habang malinaw na ipinahahayag ang idyomatikong diwa na patuloy itong tinandaan at pinag-isipan.
- source_word: אֶת־הַדָּבָר
  choice: ang bagay na iyon
  rationale: Ang דָּבָר ay maaaring mangahulugang salita, sinabi, pangyayari, o usapin. Ang “bagay na iyon” ay nagpapanatili ng lawak at bahagyang kalabuan ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “nainggit” sa halip na mas mabigat o mas pormal na katawagan, at pinanatili sa talababa ang alternatibong diwa ng דָּבָר bilang “ang sinabi.”
