base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/005.yaml
  text: Joseph dreamed a dream[a], and he told it to his brothers, and they hated him even more.
translation:
  language: tl
  text: Nagkaroon si Jose ng isang panaginip[a], at ikinuwento niya ito sa kanyang mga kapatid. Lalo pa nila siyang kinamuhian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “Nanaginip si Jose ng isang panaginip.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם יוֹסֵף חֲלוֹם
  choice: Nagkaroon si Jose ng isang panaginip
  rationale: Ang Hebreo ay gumagamit ng magkaugnay na pandiwa at pangngalan, literal na “nanaginip ng isang panaginip.” Ginawang likas sa makabagong Tagalog ang pangunahing teksto habang pinanatili sa talababa ang anyong literal.
- source_word: וַיַּגֵּד
  choice: ikinuwento niya ito
  rationale: Ang נגד ay nangangahulugang sabihin, iulat, o ipaalam. Ang “ikinuwento” ay natural sa konteksto ng pagsasalaysay ng isang panaginip, at ang “ito” ay tumutukoy sa panaginip.
- source_word: לְאֶחָיו
  choice: sa kanyang mga kapatid
  rationale: Tuwirang inililipat ang pangmaramihang katawagang pampamilya na may hulaping tumutukoy kay Jose.
- source_word: וַיּוֹסִפוּ עוֹד
  choice: Lalo pa
  rationale: Ipinahahayag ng pinagsamang יסף at עוד ang pag-igting o pagdaragdag; malinaw at likas itong naihahatid ng “lalo pa.”
- source_word: שְׂנֹא אֹתוֹ
  choice: nila siyang kinamuhian
  rationale: Ang pawatas pagkatapos ng יסף ay may diwang “dinagdagan pa nila ang pagkapoot sa kanya.” Ang “kinamuhian” ay natural na pandiwang Tagalog na nagpapanatili sa matinding diwa ng pagkapoot.
- source_word: וַ
  choice: at / pagpapatuloy ng salaysay
  rationale: Ang waw ay nagpapasulong sa salaysay. Ginamit ang “at” sa unang pag-uugnay, ngunit hindi nagdagdag ng “Ngayon” sapagkat walang tahasang salitang temporal sa Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Jose,” ang karaniwang anyo ng pangalang biblikal sa Tagalog. Iniwasan ang hindi likas na pag-uulit sa pangunahing teksto, ngunit itinago sa talababa ang natatanging magkaugnay na pandiwa at pangngalan ng Hebreo.
