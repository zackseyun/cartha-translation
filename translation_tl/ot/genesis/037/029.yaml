  text: וַ/יָּ֤שָׁב רְאוּבֵן֙ אֶל הַ/בּ֔וֹר וְ/הִנֵּ֥ה אֵין יוֹסֵ֖ף בַּ/בּ֑וֹר וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/029.yaml
  text: When Reuben returned to the pit[a], behold, Joseph was not in the pit[b], and he tore his clothes.
translation:
  language: tl
  text: Pagbalik ni Ruben sa hukay[a], nakita niyang wala si Jose roon, at pinunit niya ang kanyang mga damit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “balon” o “imbakan ng tubig” (Hebreo: bor).'
    reason: lexical_alternative
  - marker: b
    text: Ang pagpunit sa sariling damit ay nakaugaliang pagpapahayag ng dalamhati, pagkabigla, o matinding pagkabalisa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Pagbalik
  rationale: Ang pandiwang mula sa שׁוב ay nagsasaad ng pagbabalik ni Ruben sa dati niyang kinaroroonan. Ang “Pagbalik” ay likas at malinaw sa makabagong Tagalog.
- source_word: הַבּוֹר / בַּבּוֹר
  choice: sa hukay / roon
  rationale: Ang בּוֹר ay maaaring tumukoy sa hukay o balon/imbakan ng tubig. Ang “hukay” ang pinakanatural at malawak na mauunawaan sa salaysay; ginamit ang “roon” sa ikalawang pagbanggit upang maiwasan ang hindi likas na pag-uulit nang hindi binabago ang kahulugan.
- source_word: וְהִנֵּה
  choice: nakita niyang
  rationale: Ang הִנֵּה ay tumatawag ng pansin sa biglaang natuklasan ni Ruben. Sa makabagong salaysay sa Tagalog, natural na naipahahayag ang tungkuling ito ng “nakita niyang,” nang hindi tahasang nagdaragdag ng damdaming hindi binanggit sa teksto.
- source_word: אֵין יוֹסֵף בַּבּוֹר
  choice: wala si Jose roon
  rationale: Tuwirang ipinahahayag nito ang kawalan ni Jose sa hukay. Hindi ginamit ang “nakaalis na” o “nawala” upang hindi magdagdag ng paliwanag kung paano siya nawala roon.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: pinunit niya ang kanyang mga damit
  rationale: Malinaw at natural itong salin ng nakaugaliang kilos na pagpunit sa sariling kasuotan bilang pagpapahayag ng matinding dalamhati o pagkabigla.
