base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/032.yaml
  text: Then they sent the robe with long sleeves and brought it to their father[a], and said, “We found this[b]. Please identify whether it is your son's robe or not.”
translation:
  language: tl
  text: Pagkatapos, ipinadala nila ang damit na may mahahabang manggas[a] at dinala iyon sa kanilang ama. Sinabi nila, “Natagpuan namin ito. Kilalanin mo nga[b] kung ito ang damit ng anak mo o hindi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang marangyang damit” o “ang damit na may magagarang palamuti”; ayon sa tradisyon, “ang makulay na damit.” Hindi tiyak ang kahulugan ng pariralang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: O “Suriin mo nga.” Mahalaga ang pananalitang “kilalanin” sa mas malawak na salaysay, kung saan paulit-ulit ang pagkilala at maling pagkilala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: Pagkatapos, ipinadala nila
  rationale: Ang piel na שׁלח sa sunod-sunod na salaysay ay likas na nangangahulugang “ipinadala.” Ipinahahayag ng “Pagkatapos” ang pagpapatuloy ng salaysay na dala ng waw-consecutive.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: ang damit na may mahahabang manggas
  rationale: Ang כְּתֹנֶת ay kasuotang tulad ng tunika o mahabang damit. Hindi tiyak ang kahulugan ng פַּסִּים; malamang na tumutukoy ito sa kasuotang umaabot sa mga palad o talampakan, kaya maaaring mahaba o may mahahabang manggas. Iniiwasan ng salin ang tradisyonal ngunit hindi tiyak na “makulay na damit.”
- source_word: וַיָּבִיאוּ אֶל אֲבִיהֶם
  choice: at dinala iyon sa kanilang ama
  rationale: Ang “iyon” ay tumutukoy sa damit na kababanggit lamang. Pinananatili ang tahasang “kanilang ama” at hindi idinaragdag ang pangalang Jacob.
- source_word: זֹאת מָצָאנוּ
  choice: Nakita namin ito
  rationale: Ang מָצָאנוּ ay “natagpuan namin.” Sa kasalukuyang Tagalog, natural ding ipahayag ito bilang “Nakita namin ito,” na nagpapanatili sa payak at mapanlinlang na pahayag ng magkakapatid.
- source_word: הַכֶּר נָא
  choice: Tingnan mo ngang mabuti
  rationale: Ang hiphil ng נכר ay nangangahulugang kilalanin o tiyakin ang pagkakakilanlan. Ang “Tingnan mo ngang mabuti” ay natural na pakiusap sa Tagalog sa kontekstong nagpapasuri ng isang bagay; inilalagay sa talababa ang mas literal na “Kilalanin mo nga” at ang kahalagahan nito sa salaysay.
- source_word: הַכְּתֹנֶת בִּנְךָ הִוא אִם לֹא
  choice: kung damit ito ng anak mo o hindi
  rationale: Pinananatili nito ang di-tuwirang tanong na “kung ... o hindi” at ang mapaglayong pananalitang “anak mo” sa halip na pangalanan si Jose.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “damit” sa halip na mas teknikal o maaaring mapanlinlang na katawagan sa uri ng kasuotan. Pinanatili ang mapaglayong “anak mo” at ang di-tiyak na kahulugan ng כְּתֹנֶת הַפַּסִּים sa pamamagitan ng talababa.
