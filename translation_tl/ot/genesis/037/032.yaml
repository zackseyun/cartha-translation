  source_fidelity: Kailangang baguhin ang “Nakita namin ito” tungo sa “Natagpuan namin ito,” dahil ang מָצָאנוּ ay ‘natagpuan namin,’ hindi lamang ‘nakita namin.’ Ang “Tingnan mo ngang mabuti” ay isang posibleng kontekstuwal na pagpapakahulugan, ngunit hindi nito sapat na naipapakita ang pandiwang הַכֶּר (‘kilalanin/tiyakin ang pagkakakilanlan’), na may sinasadyang pag-uugnay sa mas malawak na salaysay.
  naturalness: Natural at malinaw ang pangungusap sa makabagong Tagalog. Ang “Kilalanin mo nga kung ito ang damit ng anak mo o hindi” ay marangal, nauunawaan, at mas malapit sa pandiwang Hebreo. Ang “Natagpuan namin ito” ay bahagyang mas pormal kaysa “Nakita namin ito,” ngunit angkop sa register ng salaysay.
  terminology: Ang “damit na may mahahabang manggas” ay isang maingat na pangunahing salin para sa di-tiyak na כְּתֹנֶת הַפַּסִּים. Pinananatili ng “anak mo” ang mapaglayong pagtukoy ng mga kapatid. Inayos ang talababa b upang hindi nito tawaging alternatibo ang mismong salin sa pangunahing teksto.
