    issue: “Tingnan mo ngang mabuti” para sa הַכֶּר נָא
    rationale: Bagaman natural ito, ang salin ay higit na tumutukoy sa pagsusuri kaysa sa pagkilala o pagtukoy sa pagkakakilanlan. Mahalaga ang ugat na ‘kilalanin’ sa naratibong pag-uugnay na ipinapaliwanag sa talababa.
