  text: וַ/יֹּ֕אמֶר אֶת אַחַ֖/י אָנֹכִ֣י מְבַקֵּ֑שׁ הַגִּֽידָ/ה נָּ֣א לִ֔/י אֵיפֹ֖ה הֵ֥ם רֹעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/016.yaml
  text: He said[a], “I am looking for my brothers. Please tell me where they are pasturing.”
translation:
  language: tl
  text: Sinabi niya, “Hinahanap ko ang mga kapatid ko. Pakisabi nga sa akin kung saan sila nagpapastol.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nag-aalaga ng kawan habang nanginginain.” Ang participle sa Hebreo ay tumutukoy sa pag-aalaga ng mga hayop sa pastulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi niya
  rationale: Karaniwang anyong pasalaysay ng wayyiqtol mula sa אמר. Hindi kailangang isalin ang וַ bilang “At” sa natural na makabagong Tagalog.
- source_word: אֶת אַחַי
  choice: ang mga kapatid ko
  rationale: Ang אֶת ay pananda ng tiyak na layon, at ang אַחַי ay tumutukoy sa mga kapatid na lalaki ni Jose; sa konteksto, malinaw ito kahit ang “kapatid” sa Tagalog ay hindi minamarkahan ang kasarian.
- source_word: אָנֹכִי מְבַקֵּשׁ
  choice: Hinahanap ko
  rationale: Ang malayang panghalip na kasama ng participle ay nagpapahiwatig ng kasalukuyan at nagpapatuloy na paghahanap. Natural sa Tagalog ang “Hinahanap ko.”
- source_word: הַגִּידָה נָּא לִי
  choice: Pakisabi nga sa akin
  rationale: Ang Hiphil imperative ng נגד, kasama ang נָא, ay magalang na pakiusap. Ipinahahayag ng “Pakisabi nga sa akin” ang pakiusap nang natural at magalang.
- source_word: אֵיפֹה הֵם
  choice: kung saan sila
  rationale: Ang אֵיפֹה ay tanong tungkol sa lugar at ang הֵם ang hayag na paksa. Kailangan ang “kung” sa di-tuwirang tanong sa Tagalog.
- source_word: רֹעִים
  choice: nagpapastol
  rationale: Ang Qal participle ng רעה ay tumutukoy sa pag-aalaga ng mga hayop habang nanginginain. Pinananatili ng “nagpapastol” ang pastoral na diwa nang hindi nagdaragdag sa pangunahing teksto ng layong hindi hayag sa Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga kapatid” bilang natural na salin kahit hindi nito tahasang minamarkahan ang kasarian; malinaw sa konteksto na mga kapatid na lalaki ni Jose ang tinutukoy. Inilagay ang talababa sa “nagpapastol,” ang salitang aktuwal na may leksikal na alternatibo.
