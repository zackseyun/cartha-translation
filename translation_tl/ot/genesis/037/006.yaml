  text: At sinabi niya sa kanila, “Pakinggan nga ninyo ang panaginip na ito na napanaginipan ko.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit ang magkaugnay na pangngalan at pandiwa: “ang panaginip na ito na napanaginipan ko.”'
