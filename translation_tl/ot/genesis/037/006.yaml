lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: At sinabi niya sa kanila
  rationale: Pinananatili ng “At” ang tuloy-tuloy na daloy ng salaysay, at tuwirang isinasalin ng “sa kanila” ang mga pinatutungkulan ng sinabi ni Jose.
- source_word: שִׁמְעוּ נָא
  choice: Pakinggan nga ninyo
  rationale: Ang maramihang pautos na שִׁמְעוּ ay natural na “pakinggan ninyo”; ipinahahayag ng “nga” ang magalang o mapanghikayat na puwersa ng נָא nang hindi ito ginagawang sobrang pormal.
- source_word: הַחֲלוֹם הַזֶּה
  choice: ang panaginip kong ito
  rationale: Natural sa modernong Tagalog ang ayos na “panaginip kong ito,” at malinaw nitong pinananatili ang demonstratibong “ito.”
- source_word: אֲשֶׁר חָלָמְתִּי
  choice: kong
  rationale: Sa Tagalog, likas na ipinahahayag ng “panaginip kong ito” na ito ang panaginip na napanaginipan niya. Ang ganap na pag-uulit na “panaginip na napanaginipan ko” ay mas lantad ngunit mabigat at di-likas sa karaniwang pananalita; inilalagay sa talababa ang pag-uulit sa Hebreo.
