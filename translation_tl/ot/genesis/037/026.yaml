  text: וַ/יֹּ֥אמֶר יְהוּדָ֖ה אֶל אֶחָ֑י/ו מַה בֶּ֗צַע כִּ֤י נַהֲרֹג֙ אֶת אָחִ֔י/נוּ וְ/כִסִּ֖ינוּ אֶת דָּמֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/026.yaml
  text: Then Judah said to his brothers[a], “What profit is there if we kill our brother and cover up his blood?”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Juda sa kanyang mga kapatid, “Ano ang mapapala natin kung papatayin natin ang ating kapatid at pagtatakpan ang kanyang dugo[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at tatakpan ang kanyang dugo.” Ang pananalitang Hebreo ay tumutukoy sa pagtatago ng pagpatay o ng pananagutan sa pagdanak ng dugo.
    reason: Ipinaliliwanag ang idyomang Hebreo habang pinananatili sa pangunahing teksto ang larawan ng dugo.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng pangyayari sa modernong Tagalog.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyo ng pangalang Judah sa mga saling Bibliya sa Tagalog.
- source_word: אֶל אֶחָיו
  choice: sa kanyang mga kapatid
  rationale: Tumutukoy ang panlalaking maramihan sa mga lalaking kapatid ni Jose na naroon sa salaysay; natural at tumpak ang “mga kapatid” sa Tagalog.
- source_word: מַה בֶּצַע
  choice: Ano ang mapapala natin
  rationale: Ipinahahayag ng בֶּצַע ang pakinabang o tubong inuudyukan ng pansariling interes. Natural sa Tagalog ang “mapapala” at pinananatili nito ang mapagkalkulang tono ni Juda.
- source_word: כִּי נַהֲרֹג
  choice: kung papatayin natin
  rationale: Sa retorikal na tanong, likas na ipinakikilala ng “kung” ang ipinapalagay na kilos, at ang “papatayin natin” ay malinaw na kumakatawan sa unang panauhang maramihan.
- source_word: אָחִינוּ
  choice: ating kapatid
  rationale: Tuwirang salin na nagpapanatili sa moral na bigat ng ugnayang pampamilya.
- source_word: וְכִסִּינוּ אֶת דָּמוֹ
  choice: at pagtatakpan ang kanyang dugo
  rationale: Pinananatili ang matinding larawang Hebreo ng “pagtakip sa dugo,” habang ang “pagtatakpan” ay nagpapahiwatig din sa Tagalog ng pagtatago ng pagpatay o pananagutan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “mapapala” upang maipahayag ang praktikal at pansariling pagkalkula ni Juda, at pinanatili ang larawan ng pagtatakip sa dugo sa halip na lubusang ipaliwanag ito sa mismong talata.
