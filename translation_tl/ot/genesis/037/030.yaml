  text: He returned to his brothers and said[a], “The boy is gone, and I—where shall I go?”
translation:
  language: tl
  text: Bumalik siya sa kanyang mga kapatid at sinabi niya[a], “Wala na ang bata, at ako—saan ako pupunta?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Wala roon ang bata, at ako—saan ako darating?” Ang Hebreong pananalita ay nangangahulugang “saan ako pupunta?” o “ano ang gagawin ko?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Bumalik siya
  rationale: Ang שׁוב sa anyong wayyiqtol ay nagsasaad ng pagbabalik at nagpapatuloy sa pagkakasunod-sunod ng salaysay.
- source_word: אֶל אֶחָיו
  choice: sa kanyang mga kapatid
  rationale: Ang אֶל ay tumutukoy sa direksiyon, at ang אֶחָיו ay nangangahulugang kanyang mga kapatid na lalaki; malinaw na sa konteksto na mga kapatid ni Ruben ang tinutukoy.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Karaniwang salaysay na pormula ito para ipakilala ang tuwirang pananalita.
- source_word: הַיֶּלֶד
  choice: ang bata
  rationale: Ang יֶלֶד ay maaaring mangahulugang bata o batang lalaki. Natural ang “bata” sa makabagong Tagalog at malinaw sa konteksto na si Jose ang tinutukoy.
- source_word: אֵינֶנּוּ
  choice: Wala na
  rationale: Literal itong nagpapahayag na wala siya roon. Ipinahihiwatig ng “wala na” ang pagkawala o pagliban nang hindi ipinapalagay na patay na siya.
- source_word: וַאֲנִי
  choice: At ako—
  rationale: Pinananatili ng hiwalay na panghalip at gitling ang biglang pagtuon ni Ruben sa sarili niyang kalagayan at ang emosyonal na pagkaputol ng pangungusap.
- source_word: אָנָה אֲנִי בָא
  choice: saan ako pupunta?
  rationale: Bagaman literal na malapit sa “saan ako dumarating,” isa itong Hebreong paraan ng pagtatanong kung saan siya makapupunta o ano ang gagawin niya. Natural at malinaw ang “saan ako pupunta?” habang pinananatili ang retorikal na dalamhati.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “wala na” upang ihatid ang agarang pagkabigla ni Ruben nang hindi ito ginagawang tiyak na pahayag tungkol sa kamatayan. Ang gitling pagkatapos ng “ako” ay nagpapanatili sa putol at emosyonal na himig ng Hebreo.
