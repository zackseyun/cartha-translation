  naturalness: Natural ang pangkalahatang Tagalog, ngunit mas buo at mas maayos ang pangungusap kung uulitin ang panghalip sa “sinabi niya.” Ang pag-alis ng tandang padamdam ay umiiwas sa dagdag na antas ng emosyon na hindi tuwirang minamarkahan ng Hebreo, samantalang nananatili ang biglang pagkabigla sa pananalita.
  terminology: Ang “bata” ay angkop para sa הַיֶּלֶד at hindi kailangang palitan ng mas makalumang “binata” o “batang lalaki.” Ang “mga kapatid” ay wasto sa Tagalog; nililinaw ng konteksto na mga kapatid na lalaki ang tinutukoy.
