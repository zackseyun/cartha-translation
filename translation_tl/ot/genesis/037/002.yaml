  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵ֣לֶּה תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן שְׁבַֽע עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת אֶחָי/ו֙ בַּ/צֹּ֔אן וְ/ה֣וּא נַ֗עַר אֶת בְּנֵ֥י בִלְהָ֛ה וְ/אֶת בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑י/ו וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת דִּבָּתָ֥/ם רָעָ֖ה אֶל אֲבִי/הֶֽם׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
translation:
  language: tl
  text: Ito ang kasaysayan ng pamilya ni Jacob:[a] Labimpitong taong gulang si Jose noon. Nagpapastol siya ng kawan kasama ng kanyang mga kapatid. Bilang isang binata, kasama niya ang mga anak nina Bilha at Zilpa, na mga asawa ng kanyang ama.[b] Naghatid si Jose sa kanilang ama[c] ng masamang ulat tungkol sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Ito ang mga salinlahi ni Jacob.” Ang Hebreong toledot ay madalas magpakilala ng bagong bahagi sa Genesis at maaaring tumukoy sa kasaysayan o sa nagmula sa isang tao, hindi lamang sa talaan ng kanyang mga inapo.
    reason: lexical_alternative
  - marker: b
    text: 'Mahirap ang ayos ng pariralang Hebreo. Maaari rin itong unawain: “Nagpapastol siya ng kawan kasama ng kanyang mga kapatid; at siya, na isang binata, ay kasama ng mga anak nina Bilha at ng mga anak ni Zilpa, na mga asawa ng kanyang ama.”'
    reason: source_ambiguity
  - marker: c
    text: Sa Hebreo, “kanilang ama,” hindi “kanyang ama”; si Jacob ang amang kapwa nila Jose at ng kanyang mga kapatid.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּלְדוֹת
  choice: kasaysayan ng pamilya
  rationale: Sa Genesis, ang salita ay nagsisilbing pamagat ng isang bagong bahagi at tumutukoy sa kasaysayan o salinlahing nagmumula sa isang tao. Mas natural sa makabagong Tagalog ang “kasaysayan ng pamilya” kaysa literal na “mga salinlahi,” lalo na dahil salaysay tungkol sa pamilya ni Jacob ang sumusunod.
- source_word: הָיָה רֹעֶה
  choice: nagpapastol
  rationale: Ipinahihiwatig ng anyong Hebreo ang nagpapatuloy na gawain. Pinananatili ng “nagpapastol” ang tiyak na larangan ng kahulugan nito.
- source_word: אֶת אֶחָיו בַּצֹּאן
  choice: nagpapastol siya ng kawan kasama ng kanyang mga kapatid
  rationale: Pinakamalamang na inilalarawan nito si Jose na gumagawa sa kawan kasama ng kanyang mga kapatid, hindi na pinapastol niya ang mga kapatid niya. Idinagdag nang tahasan ang “kawan” upang maging malinaw at natural sa Tagalog.
- source_word: נַעַר
  choice: binata
  rationale: Dahil tahasang sinabing labimpitong taong gulang si Jose, ang “binata” ay angkop at hindi nagpapahiwatig na maliit na bata pa siya. Hindi hinihingi ng konteksto ang posibleng kahulugang “lingkod.”
- source_word: אֶת בְּנֵי בִלְהָה וְאֶת בְּנֵי זִלְפָּה
  choice: kasama niya ang mga anak nina Bilha at Zilpa
  rationale: Mahirap ang sintaks ng Hebreo. Ang “kasama” ay nagpapanatili sa ugnayan ni Jose sa mga kapatid niyang ito nang hindi ipinapalagay na naglilingkod siya sa kanila.
- source_word: נְשֵׁי אָבִיו
  choice: mga asawa ng kanyang ama
  rationale: Tuwirang kinikilala ng parirala sina Bilha at Zilpa bilang mga asawa ng ama ni Jose.
- source_word: דִּבָּתָם רָעָה
  choice: masamang ulat tungkol sa kanila
  rationale: Ipinahihiwatig ng parirala ang di-kanais-nais na ulat tungkol sa kanila. Hindi nito tahasang sinasabi kung totoo o maling paratang ang ulat, kaya pinananatili ang gayong posibilidad.
- source_word: אֶל אֲבִיהֶם
  choice: sa kanilang ama
  rationale: Maramihan ang hulaping panghalip sa Hebreo. Tahasang pinananatili ng salin na si Jacob ang ama kapwa ni Jose at ng mga kapatid niya.
theological_decisions:
- issue: Kung ang masamang ulat ni Jose ay totoo o mapanirang-puri
  choice: Hindi tinukoy; isinalin bilang “masamang ulat.”
  alternative: “maling paratang” o “masasamang ginagawa nila”
  rationale: Hindi nilulutas ng talata kung huwad ang ulat o kung iniulat ni Jose ang tunay na masasamang gawa. Ang mas tiyak na mga salin ay magdaragdag ng interpretasyong wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinili ang “Jose,” “Jacob,” “Bilha,” at “Zilpa” ayon sa karaniwang anyong biblikal sa Filipino. Hinati sa maiikling pangungusap ang masalimuot na sintaks ng Hebreo, habang inilagay sa talababa ang tunay na kalabuan ng pariralang tumutukoy sa mga anak nina Bilha at Zilpa.
