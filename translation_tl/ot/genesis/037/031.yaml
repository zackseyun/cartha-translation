  yaml_path: translation/ot/genesis/037/031.yaml
  text: Then they took Joseph’s tunic[a], slaughtered a male goat, and dipped the tunic in the blood.
translation:
  language: tl
  text: Pagkatapos ay kinuha nila ang tunika ni Jose[a], kumatay ng isang lalaking kambing, at isinawsaw ang tunika sa dugo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “damit” o “balabal”; ang salitang Hebreo ay tumutukoy sa isang kasuotang kahawig ng tunika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Pagkatapos ay kinuha nila
  rationale: Isinusulong ng wayyiqtol ang pagkakasunod-sunod ng salaysay. Likas sa modernong Tagalog ang “Pagkatapos ay” at napananatili nito ang diwang sunod na pangyayari.
- source_word: כְּתֹנֶת יוֹסֵף
  choice: ang tunika ni Jose
  rationale: Ang כְּתֹנֶת ay kasuotang kahawig ng tunika. Ang “tunika” ay mas malapit sa uri ng kasuotang tinutukoy kaysa sa “amerikana” o sa malabong “damit,” at natural na isinasalin ang construct bilang pag-aari ni Jose.
- source_word: וַיִּשְׁחֲטוּ
  choice: kumatay
  rationale: Tiyak na tumutukoy ang pandiwa sa pagkatay ng hayop. Ang “kumatay” ang karaniwan at tuwirang salitang Tagalog para rito, nang hindi nagdaragdag ng ideyang rituwal o sakripisyo.
- source_word: שְׂעִיר עִזִּים
  choice: isang lalaking kambing
  rationale: Tinutukoy ng parirala ang isang kambing na lalaki; pinananatili ng salin ang pagkakakilanlan sa kasarian na wala sa payak na “kambing.”
- source_word: וַיִּטְבְּלוּ
  choice: isinawsaw
  rationale: Ang pandiwa ay nangangahulugang isawsaw o ilubog. Ang “isinawsaw” ang pinakanatural sa Tagalog para sa paglalagay ng kasuotan sa dugo.
- source_word: הַכֻּתֹּנֶת
  choice: ang tunika
  rationale: Inulit ang parehong katawagan upang tumugma sa pag-uulit ng Hebreo at maging malinaw na ang kasuotan ni Jose pa rin ang tinutukoy.
- source_word: בַּדָּם
  choice: sa dugo
  rationale: Ang pang-ukol na may pantukoy ay tumutukoy sa dugo ng kambing na bagong katay; natural itong ipinahahayag sa Tagalog bilang “sa dugo.”
