  text: וְ/יִשְׂרָאֵ֗ל אָהַ֤ב אֶת יוֹסֵף֙ מִ/כָּל בָּנָ֔י/ו כִּֽי בֶן זְקֻנִ֥ים ה֖וּא ל֑/וֹ וְ/עָ֥שָׂה ל֖/וֹ כְּתֹ֥נֶת פַּסִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/003.yaml
  text: Israel loved Joseph more than all his sons[a], because he was the son of his old age; and he made for him a richly ornamented robe.
translation:
  language: tl
  text: Mas minahal ni Israel si Jose kaysa sa lahat ng kaniyang mga anak na lalaki, sapagkat si Jose ay anak niya sa kaniyang katandaan. Gumawa siya para kay Jose ng isang marangyang kasuotan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayon sa tradisyon, “kasuotang may maraming kulay.” Hindi tiyak ang kahulugan ng salitang Hebreo; maaaring tumukoy ito sa kasuotang marangya o napapalamutian, o sa kasuotang umaabot hanggang sa mga pulsuhan at bukung-bukong, sa halip na partikular na tumukoy sa mga kulay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂרָאֵל
  choice: Israel
  rationale: Pinanatili ang pangalang “Israel” na ginamit sa Hebreo. Hindi na tahasang isinalin ang וְ bilang “at” dahil likas na naipagpapatuloy ng Filipino ang salaysay nang walang panimulang pang-ugnay.
- source_word: אָהַב
  choice: mas minahal
  rationale: Ang pandiwa ay karaniwang nangangahulugang “magmahal.” Kasama ng pariralang pahambing, natural itong isinalin na “mas minahal” sa halip na ipakahulugang “pinaboran.”
- source_word: מִכָּל בָּנָיו
  choice: kaysa sa lahat ng iba pa niyang anak
  rationale: Ipinahahayag nito ang paghahambing kay Jose at sa lahat ng iba pang anak na lalaki ni Israel. Sa Filipino, natural ang “anak” at hindi nito binabago ang tinutukoy sa konteksto.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ito ng dahilan. Ang “sapagkat” ay malinaw, marangal, at angkop sa estilong biblikal na Filipino.
- source_word: בֶן זְקֻנִים הוּא לוֹ
  choice: siya ang anak na isinilang sa kaniyang katandaan
  rationale: Malinaw na ipinahahayag sa natural na Filipino na si Jose ay anak ni Israel noong matanda na siya, habang pinananatili ang diwa ng idyomang Hebreo.
- source_word: וְעָשָׂה לוֹ
  choice: ipinagawa rin niya si Jose
  rationale: Maaaring mangahulugan ang Hebreo na ginawa mismo ni Israel ang kasuotan o pinagawa niya iyon. Ang “ipinagawa” ay natural sa Filipino ngunit hindi idinidiin kung sino ang aktuwal na tumahi; tahasang binanggit si Jose upang luminaw ang reperente.
- source_word: כְּתֹנֶת
  choice: kasuotan
  rationale: Ang salita ay tumutukoy sa tunika o mahabang damit. Ang “kasuotan” ay madaling maunawaan at hindi nag-uudyok ng maling modernong larawan ng amerikana.
- source_word: פַּסִּים
  choice: maringal na … mahaba
  rationale: Hindi tiyak ang eksaktong kahulugan ng salita. Maaaring tumukoy ito sa marangya o napapalamutiang kasuotan, o sa kasuotang umaabot sa mga pulsuhan at bukung-bukong. Ang maingat na paglalarawan at talababa ay nagpapanatili sa tunay na kawalang-katiyakan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “Jose,” “sapagkat,” at “kasuotan” bilang mga anyong madaling maunawaan sa pagbasa ng Bibliya. Inilagay ang tandang talababa sa mismong pariralang pinapaliwanag nito.
