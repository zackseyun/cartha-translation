revisions:
- from: Mas minahal ni Israel si Jose kaysa sa lahat ng iba pa niyang anak, sapagkat siya ang anak na isinilang sa kaniyang katandaan. Ipinagawa rin niya si Jose ng isang maringal na kasuotang mahaba.[a]
  to: Mas minahal ni Israel si Jose kaysa sa lahat ng kaniyang mga anak na lalaki, sapagkat si Jose ay anak niya sa kaniyang katandaan. Gumawa siya para kay Jose ng isang marangyang kasuotan.[a]
  rationale: Itinama ang pandiwa upang si Israel, hindi si Jose, ang gumagawa ng kasuotan. Inalis ang di-sinusuportahang “rin,” pinalitan ang sobrang-tiyak na paliwanag ng idyoma, at hindi na pinagsama ang mga pinagtatalunang kahulugan ng פַּסִּים sa pangunahing teksto. Pinanatili ng talababa ang tradisyonal na “may maraming kulay” at ang iba pang pangunahing posibilidad.
