    issue: “Ipinagawa rin niya si Jose ng isang … kasuotan”
    rationale: Sa karaniwang Filipino, ipinahihiwatig nito na si Jose ang inutusang gumawa ng kasuotan. Ang Hebreong וְעָשָׂה לוֹ ay nagsasabing si Israel ang gumawa nito para kay Jose.
  - severity: medium
    issue: “anak na isinilang sa kaniyang katandaan”
    rationale: Ang בֶן זְקֻנִים ay idyomang “anak sa kaniyang katandaan”; ang “isinilang” ay nagpapaliit sa kahulugan tungo sa isang mas tiyak na paliwanag.
  - severity: medium
    issue: “mar­ingal na kasuotang mahaba” sa pangunahing teksto
    rationale: Pinagsasama nito ang dalawang magkaibang, pinagtatalunang pagpapakahulugan ng פַּסִּים at sa gayo’y lumalampas sa katiyakang ibinibigay ng Hebreo.
  - severity: low
    issue: “lahat ng iba pa niyang anak”
    rationale: Bagaman ipinahihiwatig ng paghahambing ang ibang mga anak, mas tuwirang isalin ang “lahat ng kaniyang mga anak na lalaki,” ayon sa panlalaking pangmaramihan na בָּנָיו.
