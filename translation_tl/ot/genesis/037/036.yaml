  naturalness: Natural at marangal ang karamihan ng draft. Ang “upang dalhin sa Ehipto” ay mas idiomatiko at mas malinaw sa Filipino kaysa gamitin ang “sa Ehipto” upang ipahayag ang patutunguhan ng ipinagbiling tao. Inilipat din ang panandang [c] upang tuwirang nakakabit ito sa “kapitan ng mga bantay.”
