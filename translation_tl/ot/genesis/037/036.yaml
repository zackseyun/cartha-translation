base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/036.yaml
  text: Meanwhile[a], the Medanites sold him into Egypt to Potiphar, an officer of Pharaoh[c][b], the captain of the guard.
translation:
  language: tl
  text: Samantala, ipinagbili siya ng mga Medanita[a] upang dalhin sa Ehipto, kay Potifar, isang opisyal[b] ng Faraon at kapitan ng mga bantay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring “mga Midianita.” “Mga Medanita” ang anyong nasa tekstong Hebreo rito, ngunit karaniwang inuunawa itong “mga Midianita” dahil sa nakapaligid na salaysay at sa ilang sinaunang salin.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “isang bating ng Faraon” o “isang opisyal ng palasyo ng Faraon.” Ang salitang Hebreo ay maaaring tumukoy sa isang literal na bating o sa isang opisyal ng hari.
    reason: lexical_alternative
  - marker: c
    text: Literal na “pinuno ng mga tagakatay.” Sa konteksto ng palasyo, malamang na tumutukoy ito sa kapitan ng mga bantay o mga tagapagpatupad ng hatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּדָנִים
  choice: Samantala, ... ang mga Medanita
  rationale: Ginawang “Samantala” ang pang-ugnay upang likas na ipakita ang pagbabalik ng salaysay sa nangyari kay Jose. Ang anyong Hebreo ay tuwirang tumutukoy sa mga Medanita; pinanatili ito sa pangunahing teksto, habang inilagay sa talababa ang “mga Midianita” dahil sa nakapaligid na salaysay at mga sinaunang salin.
- source_word: מָכְרוּ אֹתוֹ
  choice: ipinagbili siya
  rationale: Tuwirang inilalarawan ng pandiwa ang natapos na pagbebenta, at si Jose ang tinutukoy ng panghalip.
- source_word: אֶל מִצְרָיִם
  choice: sa Ehipto
  rationale: Ang אֶל ay nagpapahiwatig ng patutunguhan. Sa natural na Filipino, ang “ipinagbili ... sa Ehipto” ay maayos na naghahatid ng diwang ipinagbili siya patungo at papasok sa Ehipto nang hindi nagdaragdag ng hiwalay na kilos ng pagdadala.
- source_word: לְפוֹטִיפַר
  choice: kay Potifar
  rationale: Tinutukoy ng לְ ang bumili o pinagbilhan; ginamit ang karaniwang anyong Filipino ng pangalan.
- source_word: סְרִיס פַּרְעֹה
  choice: isang opisyal ng Faraon
  rationale: Maaaring mangahulugan ang סָרִיס ng literal na bating o ng opisyal sa maharlikang sambahayan. Ang “opisyal” ang malinaw at hindi labis na tiyak na salin; pinanatili sa talababa ang ibang posibilidad.
- source_word: שַׂר הַטַּבָּחִים
  choice: kapitan ng mga bantay
  rationale: Literal na tumutukoy ang parirala sa pinuno ng mga tagakatay o tagapagpatupad ng hatol, ngunit sa kontekstong maharlika ay malamang na isang mataas na pinuno ng mga tanod o bantay ng hari.
