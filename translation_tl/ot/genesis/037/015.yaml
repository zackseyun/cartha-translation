  yaml_path: translation/ot/genesis/037/015.yaml
  text: A man found him[a], and behold, he was wandering in the field. The man asked him, saying, “What are you seeking?”
translation:
  language: tl
  text: Natagpuan siya ng isang lalaki. Pagala-gala siya sa parang. Tinanong siya ng lalaki, “Ano ang hinahanap mo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצָאֵהוּ
  choice: nakakita sa kanya
  rationale: Tuwirang ipinapahayag nito ang karaniwang diwa ng Qal na מצא sa salaysay, nang hindi dinaragdagan ang tagpo.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Pinananatili nito ang tiyak at panlalaking pang-isahang pagtukoy ng Hebreo.
- source_word: וְהִנֵּה
  choice: at naroon siyang
  rationale: Likas na ipinahihiwatig sa makabagong Tagalog ang bigla at matingkad na pagtutuon ng pansin na dala ng הִנֵּה, nang hindi gumagamit ng lipas o artipisyal na katumbas.
- source_word: תֹעֶה
  choice: pagala-gala
  rationale: Ipinapakita nito ang patuloy na pagkilos ng participle at hindi labis na nagpapasyang siya ay lubusang naliligaw.
- source_word: בַּשָּׂדֶה
  choice: sa parang
  rationale: Sa kontekstong pastoral, ang “parang” ay natural na tumutukoy sa bukas na lupain o bukid na saklaw ng שׂדה.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: Tinanong siya
  rationale: Ito ang tuwiran at likas na katumbas ng שאל sa pagpapakilala ng tanong.
- source_word: לֵאמֹר
  choice: '[ipinahiwatig ng tuwirang pananalita]'
  rationale: Hindi kailangang isalin nang hiwalay ang pormulang “sinasabi” dahil sapat at mas natural sa Tagalog ang pandiwang “tinanong” bago ang tuwirang sipi.
- source_word: מַה תְּבַקֵּשׁ
  choice: Ano ang hinahanap mo?
  rationale: Saklaw ng “hinahanap” ang diwa ng בקש na paghahanap o pagsisikap na matagpuan ang isang tao o bagay, at natural ito sa kasalukuyang Tagalog.
