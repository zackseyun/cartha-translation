translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “pagala-gala” upang mapanatili ang posibilidad na naliligaw si Jose nang hindi iyon tahasang ipinasiya. Hindi isinama ang footnote ng English consultation layer dahil ang ibinigay na alternatibo ay tumutukoy sa huling tanong ngunit mali ang puwesto ng marker, at likas nang nasasaklaw ng “hinahanap” ang lexical na saklaw nito sa Tagalog.
