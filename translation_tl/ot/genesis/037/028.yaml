  text: וַ/יַּֽעַבְרוּ֩ אֲנָשִׁ֨ים מִדְיָנִ֜ים סֹֽחֲרִ֗ים וַֽ/יִּמְשְׁכוּ֙ וַ/יַּֽעֲל֤וּ אֶת יוֹסֵף֙ מִן הַ/בּ֔וֹר וַ/יִּמְכְּר֧וּ אֶת יוֹסֵ֛ף לַ/יִּשְׁמְעֵאלִ֖ים בְּ/עֶשְׂרִ֣ים כָּ֑סֶף וַ/יָּבִ֥יאוּ אֶת יוֹסֵ֖ף מִצְרָֽיְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/028.yaml
  text: Then Midianite men[a], traders, passed by; and they pulled Joseph up and lifted him out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver[c][b]. Then they brought Joseph to Egypt.
translation:
  language: tl
  text: Nang dumaan ang mga lalaking Midianitang mangangalakal, hinila nila si Jose pataas at iniahon mula sa hukay. Ipinagbili nila si Jose sa mga Ismaelita sa halagang dalawampung pirasong pilak.[a][b] Pagkatapos, dinala nila si Jose sa Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa halagang dalawampung pilak”; hindi tahasang binanggit ang yunit, kaya “pirasong pilak” ang ginamit.
    reason: lexical_alternative
  - marker: b
    text: Maramihan ang mga pandiwa sa Hebreo—“hinila,” “iniahon,” “ipinagbili,” at “dinala”—matapos banggitin ang mga Midianitang mangangalakal at ang mga Ismaelita. Kaya hindi lubos na malinaw kung aling pangkat ang tinutukoy sa bawat kilos.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: Nang dumaan
  rationale: Likas na salin ng pagkilos na pagdaan sa lugar sa daloy ng salaysay.
- source_word: אֲנָשִׁים מִדְיָנִים סֹחֲרִים
  choice: ang mga lalaking Midianita na mga mangangalakal
  rationale: Pinananatili ang tahasang 'mga lalaki,' ang katawagang Midianita, at ang kanilang gawain bilang mga mangangalakal.
- source_word: וַיִּמְשְׁכוּ וַיַּעֲלוּ
  choice: hinila nila si Jose pataas at iniahon
  rationale: Ipinakikita ang dalawang magkaibang pandiwa at ang paitaas na pagkilos nang hindi nagiging labis na paulit-ulit sa Tagalog.
- source_word: מִן הַבּוֹר
  choice: mula sa balon
  rationale: Ang בּוֹר ay maaaring hukay o imbakan ng tubig; 'balon' ay angkop sa konteksto at karaniwang gamit sa salaysay, bagaman hindi nito ipinipilit na may tubig iyon.
- source_word: וַיִּמְכְּרוּ
  choice: Ipinagbili nila
  rationale: Tuwirang katumbas ng pandiwang nangangahulugang ibenta.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: sa mga Ismaelita
  rationale: Pinananatili ang tahasang pinagbilhan at ang pagkakaiba nito sa mga Midianitang nabanggit.
- source_word: בְּעֶשְׂרִים כָּסֶף
  choice: sa halagang dalawampung pirasong pilak
  rationale: Literal na 'dalawampung pilak'; idinagdag ang pangkalahatang 'piraso' para sa natural na Tagalog nang hindi ipinapalagay na siklo ang di-binanggit na yunit.
- source_word: וַיָּבִיאוּ אֶת יוֹסֵף מִצְרָיְמָה
  choice: dinala nila si Jose sa Ehipto
  rationale: Malinaw at natural na ipinahahayag ang pagdadala patungo sa Ehipto.
theological_decisions:
- issue: Kung sino ang tinutukoy ng maramihang mga pandiwa matapos banggitin ang mga Midianita at mga Ismaelita
  choice: Gamitin ang panghalip na 'nila' nang hindi tahasang tinutukoy muli ang pangkat
  alternative: Tukuying ang mga Midianitang mangangalakal ang gumawa ng lahat ng kilos, o ang mga Ismaelita ang nagdala kay Jose sa Ehipto
  rationale: Maramihan lamang ang mga pandiwa sa Hebreo at may dalawang pangkat na binanggit; pinananatili ng salin ang tunay na kalabuan sa halip na lutasin ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang 'iniahon' upang likas na ipahayag ang pag-angat mula sa balon, at pinanatili sa mga talababa ang mahalagang leksikal at pangsalaysay na kalabuan.
