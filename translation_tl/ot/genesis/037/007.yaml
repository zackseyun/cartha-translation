  text: And behold[a], we were binding sheaves in the midst of the field, and behold, my sheaf rose and also stood upright; and behold[c][b], your sheaves gathered around and bowed down to my sheaf.
translation:
  language: tl
  text: '“Tingnan ninyo: nagtatali tayo ng mga bigkis ng ani sa gitna ng bukid. Tingnan ninyo, bumangon ang aking bigkis at tumayo rin nang tuwid; at tingnan ninyo, pumalibot ang inyong mga bigkis at yumukod sa aking bigkis.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tingnan ninyo / Walang anu-ano
  rationale: Ang marker ay paulit-ulit na nagbibigay ng biglaan at matingkad na daloy sa pagsasalaysay ng panaginip. Ginamit ang “Tingnan ninyo” bilang tuwirang paanyaya sa mga nakikinig, ngunit “Walang anu-ano” sa gitnang sugnay upang maging natural sa modernong Tagalog habang pinananatili ang biglaang pangyayari.
- source_word: מְאַלְּמִים אֲלֻמִּים
  choice: nagbibigkis ... ng mga bigkis ng ani
  rationale: Pinananatili nito ang magkaugnay na pandiwa at pangngalan sa Hebreo at nililinaw na mga bigkis ng inaning halaman ang tinutukoy.
- source_word: בְּתוֹךְ הַשָּׂדֶה
  choice: sa gitna ng bukid
  rationale: Tuwirang pinananatili ang tiyak na diwang panlunan ng בְּתוֹךְ, hindi lamang “sa bukid.”
- source_word: קָמָה וְגַם נִצָּבָה
  choice: tumayo ... at nanatiling nakatayo
  rationale: 'Ipinakikita ang dalawang yugto: unang bumangon o tumayo ang bigkis, pagkatapos ay nanatili itong tuwid at matatag.'
- source_word: תְסֻבֶּינָה
  choice: pumalibot
  rationale: Ipinahahayag ang pag-ikot at pagpuwesto sa paligid nang hindi ipinapalagay na ganap na pinaligiran ang bigkis.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: yumukod
  rationale: Karaniwan at malinaw na katumbas ng kilos ng pagyukod; hindi nito ipinapasok ang mas tiyak na interpretasyong politikal o panrelihiyon.
- source_word: אֲלֻמָּתִי / אֲלֻמֹּתֵיכֶם
  choice: aking bigkis / inyong mga bigkis
  rationale: Pare-parehong salin na nagpapanatili sa larawan ng mga tinaling ani at sa simbolikong pagtutumbas ng panaginip.
