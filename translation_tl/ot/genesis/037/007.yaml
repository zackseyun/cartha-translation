translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tatlong-yugtong daloy at ang pag-uulit ng pansin-marker hangga’t natural, ngunit iniwasan ang makalumang “narito.” Ginamit ang “tayo” dahil kasama ni Jose ang kaniyang mga kapatid sa gawain sa loob ng panaginip.
