  text: וַ/יִּקְרַ֤ע יַעֲקֹב֙ שִׂמְלֹתָ֔י/ו וַ/יָּ֥שֶׂם שַׂ֖ק בְּ/מָתְנָ֑י/ו וַ/יִּתְאַבֵּ֥ל עַל בְּנ֖/וֹ יָמִ֥ים רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/034.yaml
  text: Then Jacob tore his clothes[a], put sackcloth around his waist, and mourned for his son many days.
translation:
  language: tl
  text: Pagkatapos, pinunit ni Jacob ang kanyang mga damit, nagbigkis ng telang-sako sa kanyang baywang, at nagluksa para sa kanyang anak nang maraming araw.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרַע
  choice: pinunit
  rationale: Ang קרע sa konteksto ng pagluluksa ay tumutukoy sa pagpunit ng damit bilang hayag na tanda ng matinding dalamhati.
- source_word: שִׂמְלֹתָיו
  choice: ang kanyang mga damit
  rationale: Malawak ang saklaw ng שִׂמְלָה at tumutukoy sa kasuotan; natural at malinaw sa modernong Filipino ang “mga damit.”
- source_word: שַׂק
  choice: telang-sako
  rationale: Tumutukoy ito sa magaspang na telang isinusuot bilang tanda ng pagluluksa; pinananatili ng “telang-sako” ang konkretong larawan at kaugaliang biblikal.
- source_word: בְּמָתְנָיו
  choice: sa kanyang baywang
  rationale: Ang מָתְנַיִם ay tumutukoy sa baywang o bahagi ng katawan sa may balakang; “sa kanyang baywang” ang natural na pahayag sa Filipino.
- source_word: וַיִּתְאַבֵּל
  choice: nagluksa
  rationale: Ang anyong Hitpael ng אבל ay nagpapahayag ng pagpasok o pananatili sa kalagayan at mga kaugalian ng pagluluksa.
- source_word: עַל־בְּנוֹ
  choice: para sa kanyang anak
  rationale: Sa pandiwa ng pagluluksa, maaaring ipahayag ng עַל ang taong dahilan o paksa ng pagluluksa; idiomatiko sa Filipino ang “para sa kanyang anak.”
- source_word: יָמִים רַבִּים
  choice: nang maraming araw
  rationale: Tuwirang pinananatili ang di-tiyak ngunit mahabang tagal na ipinahahayag ng “maraming araw.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “telang-sako” upang maipakita na kasuotang panluksa ang tinutukoy, hindi isang sisidlang sako. Walang footnote sapagkat sapat na naihahatid ng “baywang” ang kahulugan ng Hebreong מָתְנַיִם nang walang mahalagang ambiguwidad na kailangang itala.
