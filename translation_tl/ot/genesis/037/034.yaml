  source_fidelity: 'Tumpak na naihahatid ng salin ang lahat ng pangunahing elemento ng Hebreo: pagpunit ni Jacob ng kanyang mga damit, paglalagay/pagbibigkis ng telang-sako sa baywang, at matagal na pagluluksa para sa kanyang anak. Ang “nang maraming araw” ay wastong naghahayag ng יָמִים רַבִּים.'
