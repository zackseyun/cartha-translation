  yaml_path: translation/ot/genesis/037/001.yaml
  text: Jacob lived in the land of his father's sojournings[a], in the land of Canaan.
translation:
  language: tl
  text: Nanirahan si Jacob sa lupaing pinanirahan ng kanyang ama bilang dayuhan[a], sa lupain ng Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “sa lupain ng mga paninirahan ng kanyang ama bilang dayuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Nanirahan si Jacob
  rationale: Ang pandiwang ישׁב ay tumutukoy sa paninirahan o pagtira. Likas sa makabagong Tagalog ang “nanirahan,” at hindi nito ipinahihiwatig ang ganap na permanenteng pag-aari ng lupain. Hindi na nilagyan ng tahasang “at” o “ngayon” sapagkat ang waw-consecutive ay pangunahing nagsusulong ng salaysay at walang hiwalay na salitang Hebreo para sa “ngayon.”
- source_word: בְּאֶרֶץ
  choice: sa lupain
  rationale: Sa heograpikal na konteksto, malinaw at marangal na katumbas ng אֶרֶץ ang “lupain.”
- source_word: מְגוּרֵי אָבִיו
  choice: pinanirahan ng kanyang ama bilang dayuhan
  rationale: Ang מְגוּרִים ay hindi lamang karaniwang pagtira kundi paninirahan bilang isang nakikipamayan o dayuhan. Ginawang sugnay ang konstruktong Hebreo upang maging natural sa Tagalog habang pinananatili ang mahalagang diwa ng pansamantala at di-katutubong paninirahan.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Pinanatili ang pag-uulit ng “sa lupain” dahil inuulit din ng Hebreo ang בְּאֶרֶץ, at nililinaw ng pariralang ito kung aling lupain ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “bilang dayuhan” upang maipahayag ang natatanging diwa ng מְגוּרֵי nang hindi gumagamit ng mabigat o lipas na pananalita; inilakip ang mas pormal na anyo sa talababa.
