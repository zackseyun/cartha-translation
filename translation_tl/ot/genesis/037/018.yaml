  text: They saw him from a distance[a], and before he came near to them, they conspired against him to kill him.
translation:
  language: tl
  text: Nakita nila siya mula sa malayo, at bago pa siya makalapit sa kanila, nagpakana sila laban sa kanya[a] upang patayin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagbalak sila nang may pandaraya laban sa kanya.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagpapakana o mapanlinlang na pagkilos; nililinaw ng konteksto rito na ang balak ay patayin siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אֹתוֹ מֵרָחֹק
  choice: Nakita nila siya mula sa malayo
  rationale: Likas na salaysay sa modernong Tagalog na pinananatili ang tuwirang layon at ang diwang pangdistansiya ng מֵרָחֹק.
- source_word: וּבְטֶרֶם יִקְרַב אֲלֵיהֶם
  choice: at bago pa siya makalapit sa kanila
  rationale: Ang “bago pa” ay natural na nagpapahayag ng temporal na diwa ng בְטֶרֶם, at ang “makalapit” ay nagpapanatili sa spatial na kahulugan ng קרב.
- source_word: וַיִּתְנַכְּלוּ אֹתוֹ
  choice: nagpakana sila laban sa kanya
  rationale: Sa kontekstong ito, ang Hitpael ng נכל ay tumutukoy sa masamang pagpapakana laban sa isang tao. Pinananatili ng parirala ang hostile at sinadyang katangian ng kilos nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- source_word: לַהֲמִיתוֹ
  choice: upang patayin siya
  rationale: Malinaw na ipinapahayag ng “upang” ang layunin ng Hiphil infinitive construct, habang ang “patayin siya” ay tuwiran at natural sa modernong Tagalog.
