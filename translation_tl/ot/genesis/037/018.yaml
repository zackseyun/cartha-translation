translation_notes:
  register: 'Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nagpakana” upang maipakita ang lihim at masamang balak, habang pinanatili ang hiwalay na pariralang nagsasaad ng layunin: “upang patayin siya.”'
