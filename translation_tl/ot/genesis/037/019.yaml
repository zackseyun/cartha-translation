  text: And they said to one another[a], “Look, this dreamer is coming.”
translation:
  language: tl
  text: Sinabi nila sa isa't isa, “Tingnan ninyo! Dumarating na ang mapanaginiping iyan!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang panginoon” o “ang may-ari ng mga panaginip.” Dito, mapanuyang tawag ito sa taong kilala dahil sa kanyang mga panaginip.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Sinabi nila
  rationale: Inilalahad ng wayyiqtol ang sumunod na kilos sa salaysay; natural itong isalin sa payak na pangnagdaan sa modernong Tagalog.
- source_word: אִישׁ אֶל־אָחִיו
  choice: sa isa't isa
  rationale: Bagaman literal na 'ang isang lalaki sa kanyang kapatid,' katumbas itong idyomatikong Hebreo ng pandiwang gantihan o reciprocal expression.
- source_word: הִנֵּה
  choice: Tingnan ninyo!
  rationale: Pantawag-pansin ang הִנֵּה. Ang maramihang anyo ay natural dahil higit sa isang kapatid ang kausap, at ipinahihiwatig ito ng konteksto.
- source_word: בַּעַל הַחֲלֹמוֹת הַלָּזֶה
  choice: ang taong iyan na puro panaginip
  rationale: Ang בַּעַל ay maaaring tumukoy sa taong namumukod o kilala dahil sa isang bagay. Naipahahayag ng 'taong iyan na puro panaginip' ang mapanuyang tono at dismissive na demonstrative nang hindi ipinapalagay na literal siyang panginoon ng mga panaginip.
- source_word: בָּא
  choice: Paparating na
  rationale: Ang participle ay naglalarawan sa kasalukuyan o nalalapit na pagdating ni Jose; natural itong ipinahahayag sa Tagalog sa 'paparating na.'
