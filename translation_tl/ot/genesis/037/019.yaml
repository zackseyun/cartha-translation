  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang 'taong iyan na puro panaginip' upang mapanatili ang mapanuyang diin ng Hebreo; inilagay ang mas literal na anyo sa talababa. Ang marker na [a] ay nakalagay sa pangunahing teksto.
