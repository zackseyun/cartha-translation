base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/020.yaml
  text: So now[a], come, let us kill him and throw him into one of the pits, and we will say[b], ‘A wild animal has devoured him.’ Then we will see what becomes of his dreams.’
translation:
  language: tl
  text: Kaya ngayon, halikayo! Patayin natin siya at ihulog sa isa sa mga hukay[a]. Pagkatapos, sasabihin natin, ‘Nilapa siya ng isang mabangis na hayop[b].’ At makikita natin kung ano ang mangyayari sa mga panaginip niya.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa isa sa mga balon” o “sa isa sa mga imbakan ng tubig.” Ang salitang Hebreo ay maaaring tumukoy sa hukay, balon, o imbakang hinukay para sa tubig, depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang mapanganib na hayop” o “isang mabangis na hayop.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Pinananatili ang ugnay na ipinahihiwatig ng וְ at ang kagyat na panahong ipinahihiwatig ng עַתָּה.
- source_word: לְכוּ
  choice: halikayo
  rationale: Ginagamit dito ang pandiwa bilang panawagang humihimok sa pangkat, hindi bilang literal na utos na umalis.
- source_word: וְנַהַרְגֵהוּ
  choice: Patayin natin siya
  rationale: Malinaw na ipinapahayag ang cohortative o mungkahing sama-samang pagkilos.
- source_word: וְנַשְׁלִכֵהוּ
  choice: ihulog
  rationale: Likas sa Filipino para sa paghahagis o pagpapabagsak ng isang tao sa hukay; iniiwasan ang labis na pormal na ‘itapon’ habang pinananatili ang marahas na kilos.
- source_word: בְּאַחַד הַבֹּרוֹת
  choice: sa isa sa mga hukay
  rationale: Ang בּוֹר ay maaaring hukay o balon/imbakan ng tubig; ‘hukay’ ang malinaw at hindi labis na tiyak na salin sa talatang ito.
- source_word: וְאָמַרְנוּ
  choice: Pagkatapos, sasabihin natin
  rationale: Inihahayag ang susunod na hakbang sa kanilang balak sa natural na Filipino.
- source_word: חַיָּה רָעָה
  choice: isang mabangis na hayop
  rationale: Ipinahihiwatig ng parirala ang mapanganib na hayop; natural at marangal sa modernong Filipino ang ‘mabangis na hayop.’
- source_word: אֲכָלָתְהוּ
  choice: Nilapa siya
  rationale: Bagaman literal na ‘kinain,’ ang ‘nilapa’ ay natural sa ulat tungkol sa pag-atake ng mabangis na hayop at tumutugma sa marahas na konteksto.
- source_word: וְנִרְאֶה
  choice: At makikita natin
  rationale: Pinananatili ang maaaring panghinaharap na diwa at ang mapanuyang pag-asam sa kalalabasan.
- source_word: מַה יִּהְיוּ חֲלֹמֹתָיו
  choice: kung ano ang mangyayari sa mga panaginip niya
  rationale: Natural na Filipino para sa mapanuyang hamon tungkol sa magiging katuparan o kahihinatnan ng mga panaginip, nang hindi ipinapasok ang ‘katuparan’ na wala nang tuwiran sa Hebreo.
theological_decisions:
- issue: Ang kahulugan ng magiging kalagayan ng mga panaginip ni Jose
  choice: kung ano ang mangyayari sa mga panaginip niya
  alternative: kung ano ang kahihinatnan ng mga panaginip niya
  rationale: Pinananatili ang bukas at mapanuyang tanong ng Hebreo sa halip na tahasang sabihing mabibigo o matutupad ang mga ito.
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang “halikayo” bilang natural na panawagan sa maramihan, at pinanatili sa loob ng tuwirang pananalita ang buong balak at mapanuyang pangwakas na pahayag ng mga kapatid.
