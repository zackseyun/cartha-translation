translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pastulan” bilang karaniwang pandiwa para sa pagpapakain at pag-aalaga sa kawan, at “Sikem” bilang nakaugaliang anyong Filipino ng pangalang lugar.
