translation:
  language: tl
  text: Pumunta ang mga kapatid niya upang magpastol ng kawan ng kanilang ama sa Sikem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa loob ng Sikem.” Ang pang-ukol sa Hebreo ay maaaring tumukoy sa loob mismo ng lugar o sa lugar at mga karatig nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Pumunta
  rationale: Ang wayyiqtol ng הלך ay nagsasaad ng kasunod na pangyayari sa salaysay. Likas at tuwirang katumbas ang “Pumunta,” nang hindi nagdaragdag ng tahasang panandang pamanahon gaya ng “Ngayon.”
- source_word: אֶחָיו
  choice: ang mga kapatid niya
  rationale: Tumutukoy ito sa mga lalaking kapatid ni Jose ayon sa konteksto. Sa Filipino, sapat at natural ang “mga kapatid niya”; malinaw sa mas malawak na salaysay kung sino ang tinutukoy.
- source_word: לִרְעוֹת
  choice: upang pastulan
  rationale: Ang infinitive ng רעה ay nagpapahayag ng layunin at tumutukoy sa pagpapakain o pag-aalaga sa kawan. Ang “upang pastulan” ay natural at pinananatili ang pokus sa gawain.
- source_word: אֶת
  choice: '[pananda ng tuwirang layon; hindi isinalin]'
  rationale: Minamarkahan ng אֵת ang tiyak na tuwirang layon at wala itong hiwalay na katumbas sa Filipino.
- source_word: צֹאן
  choice: kawan
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Hindi labis na nililimitahan ng “kawan” ang uri ng hayop.
- source_word: אֲבִיהֶם
  choice: ng kanilang ama
  rationale: Ipinahahayag ng anyong construct na may hulaping panghalip ang pagmamay-ari. Likas sa Filipino ang “kawan ng kanilang ama.”
- source_word: בִּשְׁכֶם
  choice: sa Sikem
  rationale: Ang בְּ ay maaaring magpahiwatig ng lokasyon sa loob ng isang lugar o sa lugar at paligid nito. Ang “sa Sikem” ang natural na salin at pinananatili ang lawak ng kahulugan.
