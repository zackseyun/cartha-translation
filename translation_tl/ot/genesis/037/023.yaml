  text: וַֽ/יְהִ֕י כַּֽ/אֲשֶׁר בָּ֥א יוֹסֵ֖ף אֶל אֶחָ֑י/ו וַ/יַּפְשִׁ֤יטוּ אֶת יוֹסֵף֙ אֶת כֻּתָּנְתּ֔/וֹ אֶת כְּתֹ֥נֶת הַ/פַּסִּ֖ים אֲשֶׁ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/023.yaml
  text: And when Joseph came to his brothers[a], they stripped Joseph of his tunic, the tunic of many colors that was on him.
translation:
  language: tl
  text: Nang dumating si Jose sa kanyang mga kapatid, hinubaran nila siya ng kanyang tunika—ang natatanging tunika[a] na suot niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tunikang mahaba ang manggas” o “tunikang marangyang napapalamutian.” Hindi tiyak ang kahulugan ng Hebreong pariralang כְּתֹנֶת הַפַּסִּים. Posible rin ang tradisyonal na “tunikang sari-sari ang kulay,” ngunit malamang na hindi iyon ang kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Likas na panandang temporal sa salaysay; naihahatid nito ang diwang “at nang mangyari na” nang hindi mabigat o literalista.
- source_word: בָּא
  choice: dumating
  rationale: Sa konteksto, tumutukoy ito sa pagdating ni Jose sa kinaroroonan ng kanyang mga kapatid.
- source_word: אֶל אֶחָיו
  choice: sa kanyang mga kapatid
  rationale: Ang panlalaking maramihan ay tumutukoy rito sa mga kapatid na lalaki ni Jose; sapat at natural sa Filipino ang “mga kapatid” ayon sa konteksto.
- source_word: וַיַּפְשִׁיטוּ
  choice: hinubaran nila siya
  rationale: Ipinahihiwatig ng pandiwa ang sapilitang pag-aalis ng kasuotan mula kay Jose, hindi lamang ang payak na paghubad niya sa sarili.
- source_word: כֻּתָּנְתּוֹ
  choice: kanyang tunika
  rationale: Ang “tunika” ay malapit na katumbas ng kasuotang tinutukoy at mas tiyak kaysa sa pangkalahatang “damit.”
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: ang natatanging tunika
  rationale: Hindi tiyak ang kahulugan ng פַּסִּים. Ipinahahayag ng “natatangi” na espesyal ang kasuotan nang hindi ipinipilit kung ito ay makulay, marangyang napapalamutian, o mahaba ang manggas o laylayan.
- source_word: אֲשֶׁר עָלָיו
  choice: na suot niya
  rationale: Natural na Filipino para sa literal na “na nasa ibabaw niya,” at malinaw na tumutukoy sa kasuotang suot niya noon.
