  yaml_path: translation/ot/genesis/037/009.yaml
  text: 'Then he dreamed another dream and told it to his brothers[a], and said, “Look, I have dreamed another dream: the sun, the moon, and eleven stars were bowing down to me.”'
translation:
  language: tl
  text: 'Pagkatapos ay nanaginip pa siya ng isa pang panaginip at isinalaysay niya ito sa kanyang mga kapatid. Sinabi niya, “Tingnan ninyo, nanaginip na naman ako: ang araw, ang buwan, at labing-isang bituin ay yumuyukod sa akin[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpapatirapa sa harap ko.” Ang pandiwang Hebreo ay maaaring tumukoy sa malalim na pagyukod bilang pagpaparangal; sa kontekstong ito, tumutukoy ito sa pagbibigay-galang, hindi sa pagsambang panrelihiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם עוֹד חֲלוֹם אַחֵר
  choice: Pagkatapos, nanaginip pa siya ng isa pang panaginip
  rationale: Ipinapakita ng “Pagkatapos” ang pagsulong ng salaysay, habang pinananatili ng “pa” at “isa pang panaginip” ang diin ng עוֹד ... אַחֵר sa pag-uulit.
- source_word: וַיְסַפֵּר אֹתוֹ לְאֶחָיו
  choice: at isinalaysay iyon sa kanyang mga kapatid
  rationale: Ang “isinalaysay” ay natural at marangal na katumbas ng סִפֵּר sa konteksto ng pagkukuwento ng isang panaginip.
- source_word: הִנֵּה
  choice: Tingnan ninyo!
  rationale: Pinananatili nito ang pansin-tawag na bisa ng הִנֵּה sa tuwirang pananalita at ang maramihang kausap na ipinahihiwatig ng konteksto.
- source_word: חָלַמְתִּי חֲלוֹם עוֹד
  choice: Nanaginip na naman ako
  rationale: Natural na modernong Tagalog ito para sa Hebreong pariralang inuulit ang ideya ng panaginip. Ang “na naman” ay malinaw na nagpapahayag na isa pa itong panaginip.
- source_word: הַשֶּׁמֶשׁ וְהַיָּרֵחַ וְאַחַד עָשָׂר כּוֹכָבִים
  choice: Ang araw, ang buwan, at labing-isang bituin
  rationale: Tuwiran at likas na salin ng mga bagay sa langit at ng bilang.
- source_word: מִשְׁתַּחֲוִים לִי
  choice: ay yumuyukod sa akin
  rationale: Ang participle ay naglalarawan ng kilos sa tagpo ng panaginip. Sapat na saklaw ng “yumuyukod” ang pagpapakumbaba o pagbibigay-galang nang hindi ipinapalagay na pagsambang panrelihiyon.
theological_decisions:
- issue: Kahulugan ng מִשְׁתַּחֲוִים sa panaginip ni Jose
  choice: yumuyukod sa akin
  alternative: sumasamba sa akin; nagpapatirapa sa harap ko
  rationale: Ang konteksto ay tungkol sa pagpapasakop at pagbibigay-galang ng pamilya, hindi tahasang pagsambang ukol sa Diyos. Iniiwasan ng salin ang pagpasok ng teolohikal na pahayag na hindi hinihingi ng teksto, habang inilalagay sa talababa ang mas matinding pisikal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, likas, at marangal. Ginamit ang “isinalaysay” para sa dignidad ng salaysay, at “Tingnan ninyo!” upang mapanatili ang buhay na pansin-tawag ng tuwirang pananalita.
