  yaml_path: translation/ot/genesis/037/027.yaml
  text: Come[a], let us sell him to the Ishmaelites, and let not our hand be upon him, for he is our brother[c][b], our own flesh.” And his brothers listened.
translation:
  language: tl
  text: “Halikayo, ipagbili natin siya sa mga Ismaelita at huwag natin siyang pagbuhatan ng kamay,[a] sapagkat kapatid natin siya, sarili nating laman.[b]” At nakinig ang kanyang mga kapatid.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “huwag mapasakanya ang ating kamay,” isang sawikaing nangangahulugang huwag siyang tuwirang saktan.
    reason: lexical_alternative
  - marker: b
    text: O “sarili nating kaanak.”
    reason: lexical_alternative
  - marker: c
    text: Ang “nakinig” ay maaari ring unawaing “dininig,” “sumang-ayon,” o “tumalima” sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Halikayo
  rationale: Ang maramihang pautos ng הלך ay ginagamit dito bilang paghimok na kumilos. Likas at maikli sa makabagong Tagalog ang “Halikayo.”
- source_word: וְנִמְכְּרֶנּוּ
  choice: ipagbili natin siya
  rationale: Ipinahahayag ng anyong cohortative ang isang mungkahi o paghimok; malinaw itong naihahatid ng “ipagbili natin siya.”
- source_word: לַיִּשְׁמְעֵאלִים
  choice: sa mga Ismaelita
  rationale: Ito ang karaniwang anyong Tagalog para sa pangalang pantukoy sa pangkat ng mga inapo ni Ismael.
- source_word: וְיָדֵנוּ אַל תְּהִי בוֹ
  choice: at huwag natin siyang pagbuhatan ng kamay
  rationale: Pinananatili ng sawikaing Tagalog ang larawan ng Hebreong “huwag mapasakanya ang ating kamay” habang malinaw na tumutukoy sa hindi tuwirang pananakit o pagpatay sa kanya.
- source_word: כִּי אָחִינוּ בְשָׂרֵנוּ הוּא
  choice: sapagkat kapatid natin siya, sarili nating laman
  rationale: Pinananatili ang tuwirang ugnayang pampamilya at ang kongkretong larawang בשר (“laman”), na dito ay nagpapahiwatig ng pagkakamag-anak.
- source_word: וַיִּשְׁמְעוּ אֶחָיו
  choice: At nakinig sa kanya ang kanyang mga kapatid
  rationale: Maaaring mangahulugan ang שמע ng makarinig, makinig, o tumalima. Ang “nakinig sa kanya” ay natural sa Tagalog at hindi lubusang nilulutas ang posibilidad na tinanggap nila ang mungkahi.
