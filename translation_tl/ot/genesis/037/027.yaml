translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “Halikayo” bilang likas na maramihang paghimok, at pinanatili ang mga larawang “kamay” at “laman” ng Hebreo nang hindi nagiging di-natural ang pangungusap.
