  text: Then they took him and threw him into the pit[a]. Now the pit was empty; there was no water in it.
translation:
  language: tl
  text: Pagkatapos, kinuha nila siya at inihagis sa hukay[a]. Walang laman ang hukay; wala itong tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “balon” o “imbakan ng tubig.” Ang salitang Hebreo na bor ay maaaring tumukoy sa isang hukay na pinag-iipunan ng tubig, gaya ng ipinahihiwatig ng paglilinaw na wala itong tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֻהוּ
  choice: Pagkatapos, kinuha nila siya
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay. Ang “kinuha” ang payak na katumbas ng לקח at hindi nagdaragdag ng tindi gaya ng “sinunggaban.”
- source_word: וַיַּשְׁלִכוּ אֹתוֹ
  choice: at inihagis
  rationale: Karaniwang nangangahulugang “ihagis” o “itapon” ang השליך. Malinaw at likas sa makabagong Tagalog ang “inihagis” at ipinakikita ang marahas na kilos nang hindi ito pinalalabis.
- source_word: הַבֹּרָה
  choice: sa hukay[a]
  rationale: Maaaring tumukoy ang בּוֹר sa hukay, balon, o imbakan ng tubig. Pinananatili ng “hukay” ang malawak na kahulugan ng Hebreo, habang inilalahad sa talababa ang mas tiyak na posibilidad na ang tinutukoy ay isang balon o imbakan ng tubig.
- source_word: וְהַבּוֹר רֵק
  choice: Walang laman ang hukay
  rationale: Nagbibigay ang sugnay ng paliwanag tungkol sa kalagayan ng hukay. Natural at tuwiran sa Tagalog ang “walang laman” para sa רֵק.
- source_word: אֵין בּוֹ מָיִם
  choice: wala itong tubig
  rationale: Tahasang nililinaw ng Hebreo na walang tubig sa loob ng hukay. Maikli, natural, at tapat dito ang “wala itong tubig.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “hukay” sa pangunahing teksto upang hindi labis na tukuyin ang uri nito, at pinanatili sa talababa ang posibleng kahulugang balon o imbakan ng tubig.
