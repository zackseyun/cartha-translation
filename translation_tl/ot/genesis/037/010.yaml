revisions:
- from: Isinalaysay niya ang panaginip sa kanyang ama at sa kanyang mga kapatid. Ngunit sinaway siya ng kanyang ama at sinabi sa kanya, “Ano ba itong panaginip mo? Talaga bang pupunta kaming iyong ina at mga kapatid at yuyukod sa lupa sa harap mo[a]?”
  to: Ikinuwento niya ang panaginip sa kanyang ama at mga kapatid, at sinaway siya ng kanyang ama at sinabi sa kanya, “Ano ba itong panaginip na napanaginipan mo? Talaga bang pupunta ako, ang iyong ina, at ang mga kapatid mo upang yumukod[a] sa lupa sa harap mo?”
  rationale: Inalis ang inklusibong “kami” at pinalitan ng tahasang talaan upang tumpak na maipakita ang mga taong binanggit sa Hebreo. Pinalitan din ang di-kinakailangang “Ngunit” ng payak na pag-uugnay, at ibinalik ang retorikal na pag-uulit na “panaginip na napanaginipan mo.” Napanatili ang modernong Filipino Tagalog, ang marangal na rehistro, at ang di-kultikong diwa ng malalim na pagyukod.
