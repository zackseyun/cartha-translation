base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/010.yaml
  text: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
translation:
  language: tl
  text: Ikinuwento niya ang panaginip sa kanyang ama at mga kapatid, at sinaway siya ng kanyang ama at sinabi sa kanya, “Ano ba itong panaginip na napanaginipan mo? Talaga bang pupunta ako, ang iyong ina, at ang mga kapatid mo upang yumukod[a] sa lupa sa harap mo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpapatirapa sa harap mo.” Ang pandiwang Hebreo ay maaaring tumukoy sa malalim na pagyukod bilang pagpapasakop; dito, hindi nito kinakailangang ibig sabihin ang pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: Isinalaysay niya ang panaginip
  rationale: Ang piel ng ספר ay nangangahulugang magsalaysay o magkuwento. Nilinaw ang ipinahihiwatig na layon na ‘ang panaginip’ mula sa konteksto upang maging natural sa Tagalog.
- source_word: וַיִּגְעַר בּוֹ
  choice: sinaway siya
  rationale: Ang גער ay matinding pasalitang pagsaway o pagsita. Ang ‘sinaway’ ay malinaw, dignified, at hindi labis ang tindi.
- source_word: מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ
  choice: Ano ba itong panaginip mo?
  rationale: Pinananatili ang retorikal at mapanuyang himig ng tanong sa natural na modernong Tagalog; ang ‘ba’ ay naghahatid ng diin nang hindi pilit na inuulit ang ‘panaginip’ at ‘napanaginipan.’
- source_word: הֲבוֹא נָבוֹא
  choice: Talaga bang pupunta kami
  rationale: Ang infinitive absolute na kasama ng finite verb ay nagbibigay-diin. Ang ‘talaga bang’ ay likas na Tagalog na katumbas ng emphatic at nagdududang tanong.
- source_word: אֲנִי וְאִמְּךָ וְאַחֶיךָ
  choice: kaming iyong ina at mga kapatid
  rationale: Ang ‘kami’ ay inclusive sa kausap at maaaring maging malabo, ngunit ang kasunod na tahasang talaan ay naglilinaw na ang tinutukoy ay ang ama, ina, at mga kapatid ni Jose; natural ito sa Tagalog.
- source_word: לְהִשְׁתַּחֲוֺת לְךָ אָרְצָה
  choice: yuyukod sa lupa sa harap mo
  rationale: Ipinahahayag nito ang malalim na pagyukod at pagpapasakop sa kontekstong pampamilya, habang pinananatili ang direksiyong ‘sa lupa’ ng אָרְצָה at iniiwasang gawing pagsamba ang di-kailangang kultikong kahulugan.
theological_decisions:
- issue: Kahulugan ng השתחוה sa di-kultikong konteksto
  choice: yuyukod sa lupa sa harap mo
  alternative: sasamba sa iyo; magpapatirapa sa harap mo
  rationale: Sa tagpong ito, tumutukoy ang pandiwa sa malalim na paggalang o pagpapasakop sa loob ng pamilya, hindi kinakailangang sa pagsambang panrelihiyon. Ang pangunahing salin ay nagpapanatili ng sosyal na diwa; inilalagay sa talababa ang mas literal na kilos.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang ‘isinalaysay’ at ‘sinaway’ para sa dignified ngunit madaling maunawaang himig. Ang tuwirang pananalita ay ginawang idiomatiko nang hindi inaalis ang diin at tensiyon ng Hebreo.
