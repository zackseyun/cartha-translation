- from: Sinabi ni Ruben sa kanila, “Huwag kayong magpadanak ng dugo. Ihagis ninyo siya sa hukay[a] na ito na nasa ilang, ngunit huwag ninyo siyang pagbuhatan ng kamay”[b]—upang mailigtas niya siya mula sa kanilang mga kamay at maibalik sa kanyang ama.
  to: Sinabi ni Ruben sa kanila, “Huwag kayong magpadanak ng dugo. Ihagis ninyo siya sa hukay[a] na ito sa ilang, ngunit huwag ninyo siyang pagbuhatan ng kamay”[b]—upang mailigtas ni Ruben si Jose mula sa kamay nila at maibalik niya si Jose sa ama nito.
  rationale: Pinagaan ang parirala tungkol sa hukay at ginawang likas na idyoma ang “mula sa kamay nila.” Nilinaw rin ang mga sanggunian ng panghalip sa paliwanag ng tagapagsalaysay upang malinaw na si Ruben ang naglalayong iligtas at ibalik si Jose. Pinanatili ng gatlang at panakip-sipi na ang sugnay na “upang” ay komento ng tagapagsalaysay, hindi bahagi ng tuwirang sinabi ni Ruben. Itinama rin ang talababa upang ilarawan ang sistern nang hindi ito ipinagpapalagay na balon.
