base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/022.yaml
  text: And Reuben said to them[a], “Do not shed blood. Throw him into this pit that is in the wilderness, but do not lay a hand on him”—that he might rescue him from their hand[b], to return him to his father.
translation:
  language: tl
  text: Sinabi ni Ruben sa kanila, “Huwag kayong magpadanak ng dugo. Ihagis ninyo siya sa hukay[a] na ito sa ilang, ngunit huwag ninyo siyang pagbuhatan ng kamay”[b]—upang mailigtas ni Ruben si Jose mula sa kamay nila at maibalik niya si Jose sa ama nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “imbakan ng tubig.” Ang Hebreong בּוֹר ay maaaring tumukoy sa hukay o sistern na imbakan ng tubig.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring bantasang: “...huwag ninyo siyang pagbuhatan ng kamay, upang mailigtas ni Ruben si Jose mula sa kamay nila....”'
    reason: previous_rendering
lexical_decisions:
- source_word: אַל תִּשְׁפְּכוּ דָם
  choice: Huwag kayong magpadanak ng dugo
  rationale: Pinananatili nito ang Hebreong idyoma ng pagbububo o pagpapadanak ng dugo, na tumutukoy sa pagpatay at pananagutan sa dugo, nang hindi agad pinapaliit sa paliwanag na “huwag ninyo siyang patayin.”
- source_word: הַשְׁלִיכוּ אֹתוֹ
  choice: Ihagis ninyo siya
  rationale: Tuwiran at likas na katumbas ito ng utos na ihagis ang isang tao sa hukay; mas kasalukuyan ang himig kaysa sa “ipukol.”
- source_word: הַבּוֹר
  choice: hukay
  rationale: Maaaring tumukoy ang בּוֹר sa hukay o imbakan ng tubig. “Hukay” ang pinakamalawak at pinakanatural sa pangunahing teksto, habang nasa talababa ang mas tiyak na posibilidad.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: na ito na nasa ilang
  rationale: Hayagang kinakatawan ng unang “na” ang kaugnayan ng אֲשֶׁר, at ang “ilang” ay tumutukoy sa ilang o tuyong kaparangan, hindi kinakailangang disyertong puro buhangin.
- source_word: וְיָד אַל תִּשְׁלְחוּ בוֹ
  choice: ngunit huwag ninyo siyang pagbuhatan ng kamay
  rationale: Ang “pagbuhatan ng kamay” ay likas na idyomang Filipino para sa tuwirang pananakit at pinananatili ang larawan ng kamay sa Hebreo.
- source_word: לְמַעַן
  choice: upang
  rationale: Malinaw na naghahayag ng layunin at angkop sa dignidad ng salaysay.
- source_word: הַצִּיל אֹתוֹ מִיָּדָם
  choice: mailigtas niya siya mula sa kanilang mga kamay
  rationale: Pinananatili ang kahulugan ng pagliligtas at ang Hebreong larawan ng kamay bilang kapangyarihan o pagkakahawak, na nauunawaan din sa Filipino.
- source_word: לַהֲשִׁיבוֹ אֶל אָבִיו
  choice: at maibalik sa kanyang ama
  rationale: Natural at tapat na ipinahahayag ang sanhi o layuning maibalik si Jose sa kanyang ama.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Ginagamit ang nakaugaliang anyong Filipino ng pangalan.
theological_decisions:
- issue: Ang layunin ni Ruben bilang paliwanag ng tagapagsalaysay
  choice: Isinara ang tuwirang pananalita bago ang “upang” at gumamit ng gatlang upang ipakitang paliwanag ito ng tagapagsalaysay.
  alternative: Isama ang “upang mailigtas niya siya” sa mismong sinabi ni Ruben sa pamamagitan ng kuwit at mas huling panakip-sipi.
  rationale: Sa Hebreo, ang sugnay na לְמַעַן ay pinakamalamang na naglalahad ng lihim na layunin ni Ruben, hindi ng sinabi niya sa kanyang mga kapatid; gayunman, itinatala sa talababa ang alternatibong pagbabantas.
translation_notes:
  register: 'Makabago ngunit marangal na Filipino. Pinili ang mga karaniwang idyomang “magpadanak ng dugo” at “pagbuhatan ng kamay,” habang pinanatili ang larawang “mula sa kanilang mga kamay.” Ang “ilang” ay maikli, biblikal, at nauunawaan bilang kaparangan. Ang mga panghalip ay sadyang sumusunod sa salaysay: si Ruben ang tinutukoy ng “niya,” at si Jose ng “siya.”'
