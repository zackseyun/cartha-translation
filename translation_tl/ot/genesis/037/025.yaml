base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/025.yaml
  text: Then they sat down to eat bread, and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites was coming from Gilead, with their camels carrying gum, balm, and myrrh, on their way to take it down to Egypt.
translation:
  language: tl
  text: Pagkatapos, naupo sila upang kumain. Nang tumingala sila, nakita nila na may isang karaban ng mga Ismaelita na dumarating mula sa Gilead. Dala ng kanilang mga kamelyo ang dagta, balsamo, at ladano[a], at patungo sila sa Ehipto upang dalhin ang mga ito roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng mga produktong Hebreo. Ang unang salita ay maaaring tumukoy sa isang uri ng dagta o goma, at ang huli ay malamang na ladano (labdanum), isang mabangong dagta; isinasalin ito ng iba bilang mira.
    reason: Pinananatili nito ang tunay na leksikal at botanikal na kawalang-katiyakan, lalo na para sa נְכֹאת at לֹט, nang hindi itinatanghal bilang tiyak ang isang pinagtatalunang pagkakakilanlan.
lexical_decisions:
- source_word: לֶאֱכָל לֶחֶם
  choice: upang kumain
  rationale: Ang literal na 'kumain ng tinapay' ay isang karaniwang Hebreong paraan ng pagsasabing kumain; natural sa modernong Tagalog ang 'kumain' nang hindi ipinapalagay na tinapay lamang ang pagkain.
- source_word: וַיִּשְׂאוּ עֵינֵיהֶם וַיִּרְאוּ
  choice: Nang tumingala sila, nakita nilang
  rationale: Pinananatili ang kilos at pagkakita ng Hebreo sa natural na daloy ng Tagalog.
- source_word: וְהִנֵּה
  choice: nakita nilang may dumarating
  rationale: Ipinahihiwatig ng ayos ang biglaang pagkapansin na dala ng hinnēh nang hindi gumagamit ng artipisyal na 'narito'.
- source_word: אֹרְחַת יִשְׁמְעֵאלִים
  choice: isang pangkat ng mga Ismaelita
  rationale: Ang אֹרְחָה ay pangkat ng mga manlalakbay, karaniwang caravan; mas madaling maunawaan ng ordinaryong mambabasa ang 'pangkat'.
- source_word: נְכֹאת
  choice: tragakanto
  rationale: Malamang na mabangong dagta o gum tragacanth ang tinutukoy, bagaman hindi tiyak ang pagkakakilanlan.
- source_word: צְרִי
  choice: balsamo
  rationale: Tumutukoy sa mahalagang mabangong dagta o resinang ginagamit bilang gamot; 'balsamo' ang maikli at tradisyonal na katumbas.
- source_word: לֹט
  choice: ladano
  rationale: Mas malamang na labdanum/ladanum, isang mabangong dagta, kaysa mira; pinananatili sa talababa ang leksikal na kawalang-katiyakan.
- source_word: לְהוֹרִיד מִצְרָיְמָה
  choice: na ibababa sa Ehipto
  rationale: Pinananatili ang heograpikong pananaw ng Hebreo na ang pagpunta sa Ehipto ay pagbaba.
