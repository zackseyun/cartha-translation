base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/008.yaml
  text: His brothers said to him, “Will you really reign over us? Will you really rule over us?” So they hated him even more because of his dreams and because of his words.
translation:
  language: tl
  text: Sinabi sa kanya ng mga kapatid niya, “Talaga bang maghahari ka sa amin? Talaga bang mamumuno ka sa amin?” Kaya lalo pa nila siyang kinamuhian dahil sa mga panaginip niya at sa mga sinabi niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמָלֹךְ תִּמְלֹךְ
  choice: Talaga bang maghahari ka
  rationale: Pinananatili ang mariing retorikal na tanong na nabubuo sa infinitive absolute at finite verb, sa natural na modernong Tagalog.
- source_word: מָשׁוֹל תִּמְשֹׁל
  choice: Talaga bang mamumuno ka
  rationale: Ipinapakita ang kaibhan sa naunang “maghahari” habang pinananatili ang parallelismo at diin ng Hebreo.
- source_word: עַל חֲלֹמֹתָיו וְעַל דְּבָרָיו
  choice: dahil sa mga panaginip niya at sa mga sinabi niya
  rationale: Ang עַל ay natural na sanhi sa kontekstong ito; ang דְּבָרָיו ay tumutukoy sa mga salitang sinabi niya habang isinasalaysay ang mga panaginip.
theological_decisions:
- issue: Kung ang mga tanong ng mga kapatid ay hula o mapanuyang pagtutol
  choice: Pinanatili bilang mariing retorikal na mga tanong
  alternative: Isalin bilang tuwirang pagtanggi na hindi siya maghahari o mamumuno
  rationale: Ang anyong Hebreo ay mga tanong at hindi tahasang nilulutas kung gaano kalaki ang pagkutya, galit, o di-sinasadyang paghula sa mga ito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit karaniwan at malinaw. Ginamit ang “sa amin” sa halip na mas mabigat na “sa ibabaw namin,” at pinanatili ang magkatambal na “maghahari” at “mamumuno.”
