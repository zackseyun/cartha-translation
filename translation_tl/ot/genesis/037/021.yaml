translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Pinanatili ang Hebreong larawan ng pagliligtas “mula sa kanilang mga kamay,” ngunit ginawang likas sa Tagalog ang huling idyoma. Ang marker na [a] ay inilagay kaagad pagkatapos ng kaugnay na pahayag.
