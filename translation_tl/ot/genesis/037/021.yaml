  text: But when Reuben heard it[a], he rescued him from their hand and said, “Let us not take his life.”
translation:
  language: tl
  text: Ngunit nang marinig iyon ni Ruben, iniligtas niya si Jose mula sa kamay nila. Sinabi niya, “Huwag nating kitilin ang buhay niya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Huwag natin siyang patayin.” Sa literal, ang Hebreo ay nagsasabing, “Huwag natin siyang hampasin hinggil sa buhay,” isang idyomang tumutukoy sa pagbibigay ng nakamamatay na dagok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: nang marinig iyon
  rationale: Pangunahing kahulugan ng שׁמע ang “marinig.” Ipinahihiwatig ng konteksto na narinig ni Ruben ang balak ng mga kapatid; natural sa Tagalog na ilantad ang layon sa “iyon,” at ipinapahayag ng “nang” ang pagkakasunod ng salaysay.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: וַיַּצִּלֵהוּ
  choice: iniligtas niya si Jose
  rationale: Ang Hiphil ng נצל ay nangangahulugang magligtas o sumagip. Inulit ang pangalang “Jose” sa halip na gumamit ng sunod-sunod na panghalip upang maging malinaw at natural sa Tagalog.
- source_word: מִיָּדָם
  choice: mula sa kanilang mga kamay
  rationale: Pinanatili ang Hebreong larawan ng “kamay” bilang kapangyarihan o kontrol. Ang maramihang “mga kamay” ay likas sa Tagalog dahil marami ang tinutukoy.
- source_word: וַיֹּאמֶר
  choice: Sinabi niya
  rationale: Likas at malinaw na pambungad sa tuwirang pananalita sa makabagong Tagalog.
- source_word: לֹא נַכֶּנּוּ נָפֶשׁ
  choice: Huwag nating kitilin ang buhay niya
  rationale: Ang literal na larawan ay paghampas na nauukol sa buhay, ngunit idiomatiko itong tumutukoy sa nakamamatay na pananakit. Ang “kitilin ang buhay” ay dignified at malinaw habang pinananatili ang tahasang pagtukoy sa נָפֶשׁ, “buhay.”
