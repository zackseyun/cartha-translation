base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/014.yaml
  text: He said to him[a], “Go now, see about the well-being of your brothers and the well-being of the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.
translation:
  language: tl
  text: Sinabi niya sa kanya, “Pumunta ka nga at tingnan mo kung maayos ang kalagayan ng mga kapatid mo at kung maayos ang kalagayan ng kawan, at magbalita ka sa akin.” Kaya ipinadala niya siya mula sa Lambak ng Hebron, at nakarating siya sa Shekem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Pumunta ka ngayon
  rationale: Ang לֶךְ ay pautos na ‘pumunta,’ at ang נָא ay nagpapalumanay o nagpapahiwatig ng paghiling. Likas sa makabagong Tagalog ang ‘Pumunta ka ngayon’ at naipahihiwatig ang agarang atas.
- source_word: רְאֵה אֶת שְׁלוֹם
  choice: tingnan mo kung maayos ang kalagayan
  rationale: Literal na ‘tingnan ang shalom,’ ngunit sa konteksto ay nangangahulugang alamin ang kapakanan o kalagayan. Pinananatili ng ‘tingnan’ ang konkretong pandiwa at ipinahahayag ng ‘maayos ang kalagayan’ ang kontekstuwal na diwa ng שְׁלוֹם.
- source_word: אַחֶיךָ
  choice: mga kapatid mo
  rationale: Tumutukoy ang panlalaking maramihan sa mga lalaking kapatid ni Jose; sa Tagalog, ang ‘mga kapatid’ ang natural at hindi tinutukoy ang kasarian sa anyo ng salita, ngunit malinaw ito sa konteksto.
- source_word: הַצֹּאן
  choice: kawan
  rationale: Maaaring tumukoy ang צֹאן sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Ang ‘kawan’ ay natural na kolektibong katawagan nang hindi labis na nililimitahan ang uri.
- source_word: וַהֲשִׁבֵנִי דָּבָר
  choice: magbalik ka sa akin ng balita
  rationale: Idyoma itong nangangahulugang bumalik na may ulat. Malinaw na naipapakita ng salin kapwa ang pagbabalik at ang pagdadala ng balita.
- source_word: מֵעֵמֶק חֶבְרוֹן
  choice: mula sa Lambak ng Hebron
  rationale: Tuwirang pinananatili ang עֵמֶק bilang ‘Lambak’ at ang kaugnayan nito sa Hebron.
- source_word: שְׁכֶמָה
  choice: sa Shekem
  rationale: Ang hulaping lokatibo/direksiyonal na ה ay nagpapahiwatig ng pagtungo sa Shekem; natural itong ipinahahayag sa Tagalog sa pariralang ‘nakarating ... sa Shekem.’
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit na diwa ng שְׁלוֹם sa iisang pariralang sumasaklaw sa mga kapatid at sa kawan, nang hindi inuunawa ito bilang kawalan lamang ng alitan. Ginamit ang karaniwang anyong Tagalog na ‘Shekem.’
