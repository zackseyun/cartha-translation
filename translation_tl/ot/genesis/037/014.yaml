  source_fidelity: Tumpak sa kabuuan ang diwa at pagkakasunod ng Hebreo. Gayunman, inuulit ng מקור ang שָׁלוֹם para sa mga kapatid at para sa kawan; dapat ding malinaw na maulit ang pagsusuri sa dalawang ito. Ang וַהֲשִׁבֵנִי דָּבָר ay idiomang pag-uulat pabalik at hindi kailangang mangahulugang pisikal na pagbabalik.
  naturalness: Likas ang karamihan ng salin, ngunit ang “magbalik ka sa akin ng balita” ay bahagyang hindi pangkaraniwan at maaaring magpahiwatig na kinakailangang bumalik mismo. Mas natural at malinaw ang “magbalita ka sa akin.”
  terminology: Ang “kawan,” “Lambak ng Hebron,” at “Shekem” ay angkop. Ang “kalagayan” ay mahusay na kontekstuwal na salin ng שָׁלוֹם dito, at dapat gamitin nang magkakatulad sa dalawang paglitaw nito.
  issues:
  - severity: medium
    issue: Hindi tahasang nauulit ang pagsusuri sa kalagayan ng mga kapatid at ng kawan.
    rationale: 'May dalawang magkatulad na parirala sa Hebreo: “ang shalom ng iyong mga kapatid” at “ang shalom ng kawan.” Ang kasalukuyang iisang “kung maayos ang kalagayan ... at ng kawan” ay maaaring basahin bilang isang pinagsamang kalagayan sa halip na dalawang bagay na susuriin.'
  - severity: low
    issue: Ang “magbalik ka sa akin ng balita” ay maaaring magdagdag ng ideya ng pisikal na pagbabalik.
    rationale: Ang Hebreong idyoma ay nangangahulugang magbigay o mag-ulat ng balita pabalik. Ang “magbalita ka sa akin” ay mas idiomatiko sa modernong Filipino at hindi nagdaragdag ng kinakailangang pagbabalik ng tao.
  revised_text: Sinabi niya sa kanya, “Pumunta ka nga at tingnan mo kung maayos ang kalagayan ng mga kapatid mo at kung maayos ang kalagayan ng kawan, at magbalita ka sa akin.” Kaya ipinadala niya siya mula sa Lambak ng Hebron, at nakarating siya sa Shekem.
