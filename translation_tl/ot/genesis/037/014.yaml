  to: Sinabi niya sa kanya, “Pumunta ka nga at tingnan mo kung maayos ang kalagayan ng mga kapatid mo at kung maayos ang kalagayan ng kawan, at magbalita ka sa akin.” Kaya ipinadala niya siya mula sa Lambak ng Hebron, at nakarating siya sa Shekem.
