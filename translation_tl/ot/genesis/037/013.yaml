base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/013.yaml
  text: Then Israel said to Joseph[a], “Are not your brothers shepherding at Shechem? Come, and I will send you to them.” And he said to him, “Here I am.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Israel kay Jose, “Hindi ba nagpapastol ang mga kapatid mo sa Shekem? Halika, at susuguin kita sa kanila.” Sinabi ni Jose sa kanya, “Narito ako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinanatili ang pangalang tahasang ginamit sa tekstong Hebreo, sa halip na palitan ito ng Jacob.
- source_word: הֲלוֹא
  choice: Hindi ba
  rationale: Pinananatili nito ang anyong patanong na umaasang sasang-ayon ang kausap.
- source_word: אַחֶיךָ
  choice: mga kapatid mo
  rationale: Tuwirang tumutukoy ito sa mga lalaking kapatid ni Jose; natural sa modernong Tagalog ang ayos na ito.
- source_word: רֹעִים
  choice: nagpapastol
  rationale: Ipinahahayag nito ang patuloy na gawain ng pangangalaga at pagpapakain sa kawan nang hindi kinakailangang idagdag ang bagay na hindi tahasang binanggit.
- source_word: בִּשְׁכֶם
  choice: sa Shekem
  rationale: Ang sa ay natural na panandang panlunan sa Tagalog, at ang Shekem ay malapit na transliterasyon ng pangalang Hebreo.
- source_word: לְכָה
  choice: Halika
  rationale: Pinananatili ang anyong paanyaya o pagtawag ng Hebreo, sa halip na isalin nang mas interpretatibong Humayo ka.
- source_word: וְאֶשְׁלָחֲךָ
  choice: at susuguin kita
  rationale: Ang suguin ay angkop sa pagpapadala sa isang takdang pakay at pinananatili ang pagkakasunod ng utos at atas.
- source_word: אֲלֵיהֶם
  choice: sa kanila
  rationale: Pinananatili ang panghalip na tumutukoy sa mga kapatid ni Jose nang walang di-kailangang pag-uulit.
- source_word: הִנֵּנִי
  choice: Narito ako
  rationale: Ito ang natural at marangal na katumbas ng pormulang Hebreo ng paghaharap ng sarili bilang handang tumugon.
