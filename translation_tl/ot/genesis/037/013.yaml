translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang Israel at isinalin ang שְׁכֶם bilang Shekem ayon sa tunog ng Hebreo. Hindi nilagyan ng talababa ang nagpapastol sapagkat natural nitong nasasaklaw ang pag-aalaga o pagpapakain sa kawan at walang mahalagang ambiguwidad na nangangailangan ng paliwanag.
