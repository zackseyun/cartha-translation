  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ נָסְע֣וּ מִ/זֶּ֔ה כִּ֤י שָׁמַ֨עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָ/ה וַ/יֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔י/ו וַ/יִּמְצָאֵ֖/ם בְּ/דֹתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/017.yaml
  text: The man said[a], “They have moved on from here, because I heard them saying[b], ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.
translation:
  language: tl
  text: Sinabi ng lalaki, “Umalis na sila rito, dahil narinig ko silang nagsasabi[a], ‘Pumunta tayo sa Dotan[b].’” Kaya sinundan ni Jose ang kanyang mga kapatid at natagpuan niya sila sa Dotan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “narinig kong sinabi nila.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, ang pangalan ng lugar ay may hulaping nagsasaad ng direksiyon, na literal na “patungong Dotan.”
    reason: cultural_note
lexical_decisions:
- source_word: נָסְעוּ מִזֶּה
  choice: Umalis na sila rito
  rationale: Ang נָסַע ay maaaring tumukoy sa paglisan o pagpapatuloy ng paglalakbay, kung minsan ay may diwang pagkalas ng kampo. Likas sa modernong Tagalog ang “umalis na sila rito” at hindi nito labis na tinutukoy ang paraan ng pag-alis.
- source_word: כִּי
  choice: dahil
  rationale: Ipinakikilala rito ng כִּי ang dahilan kung bakit alam ng lalaki na umalis ang mga kapatid ni Jose.
- source_word: שָׁמַעְתִּי אֹמְרִים
  choice: narinig ko silang nagsasabi
  rationale: Pinananatili nito ang participial na anyo ng אֹמְרִים at malinaw na ang tinutukoy na mga nagsasalita ay ang mga kapatid ni Jose, ayon sa konteksto.
- source_word: נֵלְכָה
  choice: Pumunta tayo
  rationale: Ang unang panauhang pangmaramihang cohortative ay likas na naihahayag sa Tagalog sa anyong “Pumunta tayo,” na may diwa ng mungkahi o sama-samang pagpapasya.
- source_word: דֹּתָיְנָה
  choice: sa Dotan
  rationale: Ang hulaping direksiyonal na -ה ay nagpapahiwatig ng paggalaw patungo sa Dotan. Karaniwang sapat sa Tagalog ang “sa Dotan,” habang ipinaliliwanag sa talababa ang anyong Hebreo.
- source_word: אַחַר אֶחָיו
  choice: sinundan ... ang kanyang mga kapatid
  rationale: Ipinahahayag ng אַחַר ang pagsunod ni Jose sa kanyang mga kapatid. Ang pandiwang “sinundan” ang pinakanatural na pagsasalin sa kontekstong ito.
- source_word: וַיִּמְצָאֵם בְּדֹתָן
  choice: natagpuan niya sila sa Dotan
  rationale: Tuwirang ipinapahayag nito na nakita o natunton ni Jose ang kanyang mga kapatid sa nasabing lugar.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Pinanatili ang pangalang “Dotan” bilang transliterasyon at ang payak na daloy ng salaysay. Inilagay ang mga pananda ng talababa sa mismong pariralang tinutukoy ng bawat paliwanag.
