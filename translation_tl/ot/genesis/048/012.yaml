  text: Then Joseph brought them out from between his knees[a], and he bowed with his face to the ground.
translation:
  language: tl
  text: Pagkatapos, inilabas ni Jose ang dalawa mula sa pagitan ng mga tuhod ni Jacob[a], at nagpatirapa siya hanggang sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa tabi ng mga tuhod ni Jacob.” Maaaring inilalarawan ng pariralang Hebreo ang malapit na puwesto ng dalawa kay Jacob sa tagpo ng pagpapala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: inilabas
  rationale: 'Ang anyong Hiphil ng יצא ay may diwang sanhi: pinakilos ni Jose ang dalawa palabas mula sa kinalalagyan nila. Pinananatili ng “inilabas” ang diwang ito nang hindi dinaragdagan ang detalye ng kilos.'
- source_word: אֹתָם
  choice: ang dalawa
  rationale: Tumutukoy ang panghalip kina Efraim at Manases. Likas sa Tagalog ang “ang dalawa” at malinaw ang tinutukoy nang hindi inuulit ang kanilang mga pangalan.
- source_word: מֵעִם בִּרְכָּיו
  choice: mula sa pagitan ng mga tuhod ni Jacob
  rationale: Literal na nagpapahiwatig ang parirala ng paglayo mula sa piling o tabi ng mga tuhod niya. Sa tagpo ng pagpapala, mahusay na inilalarawan ng “mula sa pagitan ng mga tuhod” ang malapit na puwesto ng dalawa kay Jacob; nilinaw ang tinutukoy ng hulaping panghalip ayon sa konteksto.
- source_word: וַיִּשְׁתַּחוּ
  choice: yumukod siya
  rationale: Ang pandiwa ay nagsasaad ng malalim na pagyukod bilang paggalang. Sapat at likas ang “yumukod,” habang nililinaw ng kasunod na parirala ang buong tindig.
- source_word: לְאַפָּיו אָרְצָה
  choice: na ang mukha ay nakaharap sa lupa
  rationale: Ipinahihiwatig ng pinagsamang parirala ang mukha na nakatuon pababa, sa lupa. Iniiwasan ng salin na sabihing tiyak na sumayad ang mukha, na hindi tahasang hinihingi ng Hebreo.
theological_decisions:
- issue: Tinutukoy ng hulaping panghalip sa “mga tuhod niya”
  choice: mga tuhod ni Jacob
  alternative: mga tuhod ni Jose
  rationale: Sa konteksto, inilalayo ni Jose ang kanyang mga anak mula kay Jacob matapos silang yakapin at ilapit ni Jacob para pagpalain. Kaya si Jacob ang pinakalikas na tinutukoy, bagaman panghalip lamang ang nasa Hebreo. Isa itong pasyang pangkonteksto, hindi pangdoktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling daloy ng salaysay at ang kilos ng matinding paggalang nang walang lipas o labis na teknikal na pananalita.
