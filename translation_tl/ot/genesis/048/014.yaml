base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/014.yaml
  text: Then Israel stretched out his right hand and placed it on Ephraim’s head[a], though he was the younger, and his left hand on Manasseh’s head, crossing his hands, for Manasseh was the firstborn.
translation:
  language: tl
  text: Iniunat ni Israel ang kaniyang kanang kamay at ipinatong iyon sa ulo ni Efraim, bagaman siya ang nakababata, at ang kaniyang kaliwang kamay naman sa ulo ni Manases. Pinagkrus niya ang kaniyang mga kamay[a], sapagkat si Manases ang panganay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Maingat niyang isinaayos ang kaniyang mga kamay.” Maaaring idiin ng pariralang Hebreo ang sinadya at mahusay na pag-aayos ng mga kamay; ipinakikita ng konteksto na kasama rito ang pagkrus sa mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: iniunat
  rationale: Sa konteksto ng pisikal na pagkilos ng kamay, nangangahulugan ang pandiwa na iunat, hindi magpadala.
- source_word: וַיָּשֶׁת
  choice: ipinatong
  rationale: Likas na Filipino ito para sa sadyang paglalagay ng kamay sa ulo habang nagbibigay ng pagpapala.
- source_word: יְמִינוֹ / שְׂמֹאלוֹ
  choice: kaniyang kanang kamay / kaniyang kaliwang kamay
  rationale: Malinaw at magkatimbang na ipinahahayag ang dalawang kamay, alinsunod sa Hebreo.
- source_word: וְהוּא הַצָּעִיר
  choice: bagaman siya ang nakababata
  rationale: 'Ipinakikita ng ''bagaman'' ang diwang pasalungat sa konteksto: tumanggap ng kanang kamay si Efraim kahit siya ang nakababata.'
- source_word: שִׂכֵּל אֶת יָדָיו
  choice: pinagkrus niya ang kaniyang mga kamay
  rationale: Mahirap ang pariralang Hebreo at maaari itong tumukoy sa sinadya o mahusay na pag-aayos ng mga kamay. Gayunman, malinaw sa agarang konteksto na inilagay ang kanang kamay sa nakababatang si Efraim at ang kaliwa sa panganay na si Manases, kaya ang pagkrus ang pinakamalinaw na kahulugan sa salaysay.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag kung bakit kapansin-pansin ang pagkakaayos ng mga kamay.
- source_word: הַבְּכֹר
  choice: panganay
  rationale: Karaniwang salitang Filipino ito na nagpapanatili sa kahalagahan ng kaayusan ng kapanganakan sa konteksto ng pagpapala.
theological_decisions:
- issue: Kahulugan ng שִׂכֵּל אֶת יָדָיו
  choice: Sinadyang pinagkrus ni Israel ang kaniyang mga kamay sa pagpapala kina Efraim at Manases.
  alternative: Maingat o sinadya lamang niyang inayos ang kaniyang mga kamay, nang hindi tahasang binibigyang-diin ang pagkrus.
  rationale: 'Mariing sinusuportahan ng agarang konteksto ang pagkrus: napunta ang kanang kamay sa nakababatang si Efraim at ang kaliwa sa panganay na si Manases. Pinananatili ng salin ang sinadyang pagbaligtad sa inaasahang kaayusan nang hindi nagdaragdag ng doktrinang wala sa talata.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaniyang” para sa dignidad at pagkakapare-pareho, “ipinatong” para sa likas na kilos ng pagbabasbas, at “panganay” upang mapanatili ang bigat ng kaayusan ng kapanganakan.
