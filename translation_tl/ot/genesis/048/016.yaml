  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הַ/מַּלְאָךְ֩ הַ/גֹּאֵ֨ל אֹתִ֜/י מִ/כָּל רָ֗ע יְבָרֵךְ֮ אֶת הַ/נְּעָרִים֒ וְ/יִקָּרֵ֤א בָ/הֶם֙ שְׁמִ֔/י וְ/שֵׁ֥ם אֲבֹתַ֖/י אַבְרָהָ֣ם וְ/יִצְחָ֑ק וְ/יִדְגּ֥וּ לָ/רֹ֖ב בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/016.yaml
  text: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
translation:
  language: tl
  text: Ang anghel na tumubos sa akin mula sa lahat ng kapahamakan[a]—pagpalain nawa niya ang mga bata. Taglayin nawa nila ang pangalan ko at ang pangalan ng aking mga ninunong sina Abraham at Isaac[b]. Dumami nawa sila nang lubos sa gitna ng lupain[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa lahat ng kasamaan” o “mula sa bawat kaguluhan.” Maaaring tumukoy ang salitang Hebreo sa kapahamakan at paghihirap, hindi lamang sa moral na kasamaan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Matawag nawa sa kanila ang pangalan ko at ang pangalan ng aking mga ninunong sina Abraham at Isaac.” Ipinahihiwatig ng idyomang Hebreo na madadala nila ang pangalan at pagkakaugnay sa lahi ni Jacob at ng kaniyang mga ninuno.
    reason: lexical_alternative
  - marker: c
    text: O “Lumago nawa sila bilang napakaraming tao.” Pambihira ang pandiwang Hebreo at nagpapahiwatig ng masaganang pagdami, marahil gaya ng pagdami ng mga isda.
    reason: lexical_alternative
  - marker: d
    text: O “sa gitna ng daigdig.” Maaaring mangahulugan ang salitang Hebreo ng “lupain” o “daigdig.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: Ang Anghel
  rationale: Maaaring mangahulugang sugo o anghel ang מַלְאָךְ. Sa konteksto ng pagpapala at pag-iingat ng Diyos, natural ang “Anghel,” nang hindi tinutukoy nang higit sa teksto ang kaniyang pagkakakilanlan.
- source_word: הַגֹּאֵל אֹתִי
  choice: na tumubos sa akin
  rationale: Ang participle ng גאל ay tumutukoy sa tagatubos o tagapagligtas. Ang “tumubos sa akin” ay nagpapanatili sa natatanging diwang mapagtubos at angkop sa pagbabalik-tanaw ni Jacob sa kaniyang buhay.
- source_word: מִכָּל רָע
  choice: mula sa lahat ng kasamaan
  rationale: Saklaw ng רָע ang kasamaan, kapahamakan, at kaguluhan. Pinananatili ng “kasamaan” ang lawak ng salitang Hebreo; inilalahad sa talababa ang mga posibleng kahulugan sa kontekstong ito.
- source_word: יְבָרֵךְ אֶת הַנְּעָרִים
  choice: pagpalain niya ang mga batang ito
  rationale: Jussive ang gamit ng pandiwa sa konteksto ng pagpapala. Tumutukoy ang “mga batang ito” kina Efraim at Manases at natural ito sa makabagong Filipino.
- source_word: וְיִקָּרֵא בָהֶם שְׁמִי וְשֵׁם אֲבֹתַי
  choice: Taglayin nawa nila ang pangalan ko at ang pangalan ng aking mga ninuno
  rationale: Literal na “tawagin sa kanila ang pangalan ko.” Ipinahihiwatig ng idyoma ang pag-uugnay sa kanila ng pangalan, identidad, at angkan. Ang “taglayin” ay natural sa Filipino ngunit pinananatili sa talababa ang mas literal na anyo.
- source_word: אֲבֹתַי
  choice: aking mga ninuno
  rationale: Bagaman literal na “mga ama ko,” sina Abraham at Isaac ay mga ninuno ni Jacob sa linyang pampamilya. Ang “mga ninuno” ay malinaw at likas sa Filipino.
- source_word: וְיִדְגּוּ לָרֹב
  choice: Dumami nawa sila nang lubos
  rationale: Ang pambihirang pandiwang דגה ay nagpapahiwatig ng napakasaganang pagdami at maaaring pumukaw ng larawan ng pagdami ng mga isda. Inihahatid ng pangunahing teksto ang diwa nang hindi nagiging malabo.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: sa gitna ng lupain
  rationale: Maaaring “lupain” o “daigdig” ang אֶרֶץ. Mas angkop ang “lupain” sa konteksto ng mga patriyarka at ng lupang pamana, habang itinatala sa talababa ang mas malawak na posibilidad.
theological_decisions:
- issue: Pagkakakilanlan ng “Anghel” sa pagpapala ni Jacob
  choice: Panatilihin ang “Anghel” nang hindi tahasang sinasabing siya ay pagpapakita ng Diyos o isang nilalang na sugo.
  alternative: Unawain ang Anghel bilang pagpapakita ng Diyos; o bilang nilalang na sugong kumikilos para sa Diyos.
  rationale: Mahigpit na iniuugnay ng talata ang Diyos at ang Anghel sa pagpapala, ngunit hindi tahasang nililinaw ng Hebreo ang ontolohikal na pagkakakilanlan ng Anghel. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Taglayin nawa nila” upang natural na ihatid ang Hebreong idyoma ng pagtawag ng pangalan sa kanila, samantalang inilagay sa talababa ang literal na anyo. Naka-capitalize ang “Anghel” bilang tiyak na katawagan sa konteksto, ngunit hindi nito nilulutas ang pagkakakilanlan ng anghel.
