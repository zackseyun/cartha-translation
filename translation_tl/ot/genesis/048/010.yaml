base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/010.yaml
  text: Israel’s eyes were dim with age[a]; he could not see. So he brought them near to him[b], and he kissed them and embraced them.
translation:
  language: tl
  text: Malabo na ang mga mata ni Israel dahil sa katandaan[a], kaya hindi na siya makakita. Inilapit ni Jose sa kanya ang dalawa[b], at hinalikan at niyakap sila ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mabigat ang mga mata ni Israel dahil sa katandaan,” isang idyomang tumutukoy sa mahinang paningin.
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang pinangalanan sa Hebreo ang simuno ng “inilapit.” Mula sa konteksto, si Jose ang naglapit sa kanyang dalawang anak kay Israel.
    reason: ambiguity
lexical_decisions:
- source_word: עֵינֵי יִשְׂרָאֵל
  choice: ang mga mata ni Israel
  rationale: Likas na Filipino para sa construct chain, at pinananatili ang pangalang “Israel” na tahasang ginamit sa Hebreo.
- source_word: כָּבְדוּ מִזֹּקֶן
  choice: malabo na ... dahil sa katandaan
  rationale: Literal na “mabigat dahil sa katandaan,” ngunit sa konteksto ng mga mata ay tumutukoy sa paghina o paglabo ng paningin. Ang “dahil sa katandaan” ay malinaw na naghahayag ng sanhi.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: hindi na siya makakita
  rationale: Natural na modernong Filipino para sa kawalan ng kakayahang makakita; ipinahihiwatig ng “na” ang kalagayang dulot ng pagtanda.
- source_word: וַיַּגֵּשׁ אֹתָם אֵלָיו
  choice: Inilapit ni Jose sa kanya ang dalawa
  rationale: Ang pandiwa ay nangangahulugang “inilapit.” Bagaman hindi tahasang pinangalanan sa pandiwa ang gumagawa, ipinakikita ng naunang konteksto na si Jose ang naglapit sa dalawang anak kay Israel. Ginamit ang “ang dalawa” upang malinaw na tukuyin ang dalawang anak nang hindi paulit-ulit ang “sila.”
- source_word: וַיִּשַּׁק לָהֶם וַיְחַבֵּק לָהֶם
  choice: at hinalikan at niyakap sila ni Israel
  rationale: Tumpak at natural ang dalawang pandiwang nagpapahayag ng pagmamahal. Tahasang binanggit si Israel upang maiwasan ang maling pagbasa na si Jose rin ang humalik at yumakap.
theological_decisions:
- issue: Pagkilala sa mga di-tahasang simuno ng magkakasunod na pandiwa
  choice: Si Jose ang naglapit sa dalawa; si Israel ang humalik at yumakap sa kanila.
  alternative: 'Panatilihin lamang ang mga panghalip: “Inilapit niya sila sa kanya, at hinalikan at niyakap niya sila.”'
  rationale: Hindi teolohikal na nilulutas ang teksto kundi nililinaw ang aksiyon ayon sa talata 9 at sa lohika ng tagpo. Sa Filipino, ang sunod-sunod na “niya” ay madaling magpahiwatig na iisa ang simuno ng lahat ng pandiwa at maaaring magligaw sa mambabasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “malabo na ang mga mata” sa halip na literal ngunit di-likas na “mabigat ang mga mata.” Tahasang pinangalanan sina Jose at Israel kung saan kinakailangan upang maiwasan ang kalituhan sa mga panghalip.
