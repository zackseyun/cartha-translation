  text: וַ/יְבָ֨רֲכֵ֜/ם בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמוֹר֒ בְּ/ךָ֗ יְבָרֵ֤ךְ יִשְׂרָאֵל֙ לֵ/אמֹ֔ר יְשִֽׂמְ/ךָ֣ אֱלֹהִ֔ים כְּ/אֶפְרַ֖יִם וְ/כִ/מְנַשֶּׁ֑ה וַ/יָּ֥שֶׂם אֶת אֶפְרַ֖יִם לִ/פְנֵ֥י מְנַשֶּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/020.yaml
  text: So he blessed them that day[a], saying, “By you Israel will bless, saying, ‘May God make you like Ephraim and like Manasseh.’” And he set Ephraim before Manasseh.
translation:
  language: tl
  text: Binasbasan niya sila nang araw na iyon[a] at sinabi, “Sa pamamagitan mo ay magbabasbas ang Israel at sasabihin, ‘Gawin ka nawa ng Diyos na tulad ni Efraim at tulad ni Manases.’” At inuna niya si Efraim kay Manases.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa iyo ay magbabasbas ang Israel”; ibig sabihin, gagamitin ng Israel ang mga pangalang ito bilang pormula ng basbas.
    reason: Pinananatili ang posibleng lokatibo o reperensiyal na diwa ng בְּךָ at nililinaw ang idyomatikong gamit nito nang hindi binabago ang isahang anyo ng pangunahing teksto.
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: binasbasan niya sila
  rationale: Ang Piel ng ברך ay nangangahulugang magbasbas; pinananatili ng “sila” ang maramihang layon na tumutukoy kina Efraim at Manases.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Likas na makabagong Tagalog para sa tiyak na panandang panahong Hebreo.
- source_word: בְּךָ יְבָרֵךְ יִשְׂרָאֵל
  choice: Sa pamamagitan ninyo ay magbabasbas ang Israel
  rationale: 'Ipinahahayag ang instrumental o reperensiyal na gamit ng ב: gagamitin ng Israel ang kanilang mga pangalan bilang huwaran ng pagbabasbas. Ginawang maramihan ang “ninyo” ayon sa malinaw na tinutukoy sa pormula, bagaman isahan ang anyong Hebreo bilang kolektibong pagtukoy.'
- source_word: יְשִׂמְךָ אֱלֹהִים
  choice: Gawin nawa kayo ng Diyos
  rationale: Ang konteksto ng basbas ay humihingi ng anyong paghiling; ang שׂים ay likas na maisasalin dito bilang “gawin.”
- source_word: כְּאֶפְרַיִם וְכִמְנַשֶּׁה
  choice: tulad ni Efraim at tulad ni Manases
  rationale: Pinananatili ang inuulit na paghahambing para sa ritmo at diin.
- source_word: וַיָּשֶׂם אֶת אֶפְרַיִם לִפְנֵי מְנַשֶּׁה
  choice: At inuna niya si Efraim kay Manases
  rationale: Sa konteksto, ang לִפְנֵי ay nagpapahayag ng pag-una o pagbibigay ng higit na katayuan kay Efraim sa pormula ng basbas; natural itong ipinahahayag sa Tagalog bilang “inuna.”
theological_decisions:
- issue: Tinutukoy ng “Israel” sa pormula ng basbas
  choice: Israel
  alternative: Jacob; ang sambayanang Israel
  rationale: Israel lamang ang nasa Hebreo. Hindi ito pinalawak upang mapanatili kapuwa ang kaugnayan kay Jacob at ang kolektibo o pambansang diwa.
- issue: Pagkauna ni Efraim kay Manases
  choice: inuna niya si Efraim kay Manases
  alternative: inilagay niya si Efraim sa unahan ni Manases
  rationale: Ipinakikita ng pangungusap ang pagkakasunod at kahigitan sa basbas, nang hindi dinaragdagan ang teksto ng mas tiyak na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magbasbas/binasbasan” para sa pare-parehong pormal na bokabularyo, at “nawa” upang likas na maipahayag ang pormula ng paghiling.
