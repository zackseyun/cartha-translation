  yaml_path: translation/ot/genesis/048/022.yaml
  text: And I give you one portion above your brothers[a], which I took from the hand of the Amorite with my sword and with my bow.
translation:
  language: tl
  text: At ako ay nagbibigay sa iyo ng isang bahaging higit kaysa sa iyong mga kapatid[a], na kinuha ko mula sa kamay ng Amorita sa pamamagitan ng aking tabak at aking pana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong שְׁכֶם (shekhem) ay maaari ring mangahulugang “balikat” o “gulod,” at maaaring umalingawngaw sa pangalang Shekem. Maaaring sabay na tumukoy ang pahayag sa dagdag na bahagi ng mana at sa lugar na kalauna’y iniugnay kay Jose.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: At ako
  rationale: Pinananatili ang tahasang panghalip na nagbibigay-diin sa nagsasalita, ngunit iniiwasan ang di-likas na 'ako mismo' sa Filipino.
- source_word: נָתַתִּי
  choice: ibinibigay ko
  rationale: Bagaman nasa anyong perfect ang Hebreo, ang pahayag ay maaaring gumana bilang kasalukuyang pormal na pagkakaloob sa konteksto ng basbas ni Jacob.
- source_word: שְׁכֶם אַחַד
  choice: isang bahagi
  rationale: Sa konteksto ng pamana, natural na tumutukoy ito sa isang bahagi o takdang mana; inilalahad sa talababa ang posibleng paglalaro sa kahulugan at sa pangalang Shekem.
- source_word: עַל אַחֶיךָ
  choice: na higit kaysa sa iyong mga kapatid
  rationale: Ipinahahayag ang diwa ng dagdag o kalamangan sa mana nang natural sa Filipino.
- source_word: אֲשֶׁר לָקַחְתִּי
  choice: na kinuha ko
  rationale: Direktang salin na hindi nagpapasya nang higit sa sinasabi ng pandiwa tungkol sa paraan ng pagkuha.
- source_word: מִיַּד הָאֱמֹרִי
  choice: mula sa kamay ng Amorita
  rationale: Pinananatili ang Hebreong idyoma at ang kolektibo o kinatawang isahan na 'Amorita.'
- source_word: בְּחַרְבִּי וּבְקַשְׁתִּי
  choice: sa pamamagitan ng aking tabak at pana
  rationale: Pinananatili ang malinaw na larawang pandigma at ang pag-aari ni Jacob sa dalawang sandata.
theological_decisions:
- issue: Kahulugan ng שְׁכֶם kaugnay ng pangalang Shekem at ng dagdag na bahagi ni Jose
  choice: Gamitin ang karaniwang kahulugang 'bahagi' sa pangunahing teksto at ilahad sa talababa ang iba pang posibleng pahiwatig.
  alternative: '''isang gulod'' o ''Shekem, isang bahagi'''
  rationale: Pinakamalinaw sa konteksto ng pamana ang 'bahagi,' ngunit maaaring sinasadyang umalingawngaw ang kahulugang 'balikat/gulod' at ang pangalang Shekem. Hindi dapat mawala ang tunay na kalabuan, kaya pinananatili ito sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang bahagyang pormal na himig ng testamentaryong pagkakaloob at ang Hebreong idyomang 'mula sa kamay.'
