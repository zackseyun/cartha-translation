  naturalness: Nauunawaan ang “At ako, ibinibigay ko,” ngunit ang paghihiwalay ng “ako” sa pamamagitan ng kuwit ay bahagyang matigas sa makabagong marangal na Filipino. Mas likas at nananatiling mariin ang “At ako ay nagbibigay.” Ang “isang bahaging higit kaysa sa iyong mga kapatid” ay bahagyang pinakinis sa pamamagitan ng pag-uugnay ng pangngalan at panuring.
  terminology: Ang “bahagi,” “Amorita,” “tabak,” “pana,” at “Shekem” ay angkop. Pinananatili ang “bahagi” sa teksto nang hindi isinasara ang topograpiko/pangalan-lugar na alusyon; malinaw itong inilalahad sa talababa.
