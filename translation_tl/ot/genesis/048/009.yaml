base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/009.yaml
  text: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
translation:
  language: tl
  text: Sinabi ni Jose sa kanyang ama, “Mga anak kong lalaki sila na ibinigay sa akin ng Diyos dito.[a]” Sinabi naman ng kanyang ama, “Ilapit mo sila sa akin, pakiusap, at pagpapalain ko sila.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lugar na ito.” Maaaring mas tiyak na tumukoy ang salitang Hebreo sa kinaroroonan ni Jose.
    reason: lexical_alternative
  - marker: b
    text: O “Dalhin mo sila sa akin, pakiusap, upang pagpalain ko sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יוֹסֵף אֶל־אָבִיו
  choice: Sinabi ni Jose sa kanyang ama
  rationale: Natural na salaysay sa Tagalog na pinananatili ang tahasang pagkilala kay Jose at ang pormal ngunit karaniwang katawagang ‘ama.’
- source_word: בָּנַי הֵם
  choice: Mga anak ko sila
  rationale: Tumutukoy ang בָּנַי sa mga anak na lalaki ni Jose; sa kontekstong malinaw na sina Efraim at Manases ang tinutukoy, natural sa Tagalog ang ‘mga anak ko’ nang hindi nawawala ang partikular na reperensiya.
- source_word: אֲשֶׁר נָתַן לִי אֱלֹהִים
  choice: na ibinigay sa akin ng Diyos
  rationale: Pinananatili ang pagkilala kay Elohim bilang Diyos at ang paglalarawan sa mga anak bilang kaloob niya kay Jose.
- source_word: בָּזֶה
  choice: dito
  rationale: Ang deiktikong anyo ay natural na tumutukoy sa kasalukuyang lugar o kalagayan ni Jose; inilalahad sa talababa ang mas tiyak na posibilidad na ‘sa lugar na ito.’
- source_word: קָחֶם נָא אֵלַי
  choice: Pakilapit sila sa akin
  rationale: Bagaman karaniwang nangangahulugang ‘kunin’ ang לקח, hinihiling dito ng ama ni Jose na ilapit sa kanya ang mga bata. Ipinapahayag ng ‘paki-’ ang magalang na pakiusap ng נָא.
- source_word: וַאֲבָרֲכֵם
  choice: upang pagpalain ko sila
  rationale: Ipinapakita ng ‘upang’ ang layunin ng pagpapalapit sa mga bata, habang tapat na isinasalin ng ‘pagpalain’ ang ugat na ברך.
theological_decisions:
- issue: Ang tinutukoy ng אֱלֹהִים sa pahayag ni Jose
  choice: Diyos, bilang nagbigay ng mga anak kay Jose
  alternative: isang diyos o mga diyos
  rationale: Sa konteksto ng salaysay tungkol sa mga patriyarka, ang singular na pandiwa at ang pahayag ni Jose ay tumutukoy sa Diyos na sinasamba ng kanyang pamilya, hindi sa isang di-tiyak na diyos o sa maraming diyos.
- issue: Ang tagapagsalita sa ikalawang וַיֹּאמֶר
  choice: ang ama ni Jose
  alternative: panatilihin lamang ang ‘sinabi niya’
  rationale: Ang diyalogo at agarang konteksto ay malinaw na nagpapalit ng tagapagsalita mula kay Jose tungo sa kanyang ama. Ang tahasang pagbanggit ay likas sa Tagalog at umiiwas sa malabong panghalip nang hindi nagdaragdag ng teolohikong interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Pakilapit’ bilang likas na pakiusap sa Tagalog at ang ‘pagpalain’ bilang karaniwang salitang biblikal. Inilipat ang unang talababa sa ‘dito,’ sapagkat בָּזֶה—hindi ‘ama’—ang may alternatibong kahulugang ‘sa lugar na ito.’
