revisions:
- from: Sinabi ni Jose sa kanyang ama, “Mga anak ko sila na ibinigay sa akin ng Diyos dito.[a]” Sinabi naman ng kanyang ama, “Pakilapit sila sa akin upang pagpalain ko sila.[b]”
  to: Sinabi ni Jose sa kanyang ama, “Mga anak kong lalaki sila na ibinigay sa akin ng Diyos dito.[a]” Sinabi naman ng kanyang ama, “Ilapit mo sila sa akin, pakiusap, at pagpapalain ko sila.[b]”
  rationale: Binago ang ‘mga anak ko’ tungo sa ‘mga anak kong lalaki’ upang maipakita ang panlalaking maramihan ng Hebreo. Pinalitan ang hindi likas na ‘Pakilapit sila’ ng malinaw na utos na ‘Ilapit mo sila,’ at inayos ang huling sugnay bilang ‘at pagpapalain ko sila’ upang mapanatili ang magkakaugnay na kahilingan at pagpapala. Nananatili ang deiktikong ‘dito’ at ang alternatibo nito sa talababa nang hindi pinipilit ang isang mas tiyak na pakahulugan.
