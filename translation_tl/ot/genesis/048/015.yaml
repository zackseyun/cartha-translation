  source_fidelity: Tumpak na naisasalin ang tahasang layon na si Jose, ang dalawang magkaugnay na paglalarawan sa Diyos, ang idyomang “lumakad sa harap,” ang larawang pastoral ng רעה, at ang saklaw na mula sa pinakaunang yugto ng buhay hanggang sa kasalukuyan. Ang bukas na hulihang guhit ay angkop sapagkat nagpapatuloy ang pagpapala sa kasunod na talata.
  naturalness: Natural at marangal ang modernong Tagalog. Ang “mga ninunong sina Abraham at Isaac” ay malinaw at maayos sa kasalukuyang gamit; ang “nagpastol sa akin” ay nagpapanatili ng matalinghagang rehistro ng talata.
  terminology: Wasto at magkakatugma ang “Diyos,” “lumakad sa harap,” “nagpastol,” at ang karaniwang mga pangalang “Abraham,” “Isaac,” at “Jose.” Hindi pinapalitan ng salin ang talinghaga ng pastol ng payak na ideya lamang ng paglalaan.
