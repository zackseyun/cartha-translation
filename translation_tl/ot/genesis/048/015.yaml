  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְבָ֥רֶךְ אֶת יוֹסֵ֖ף וַ/יֹּאמַ֑ר הָֽ/אֱלֹהִ֡ים אֲשֶׁר֩ הִתְהַלְּכ֨וּ אֲבֹתַ֤/י לְ/פָנָי/ו֙ אַבְרָהָ֣ם וְ/יִצְחָ֔ק הָֽ/אֱלֹהִים֙ הָ/רֹעֶ֣ה אֹתִ֔/י מֵ/עוֹדִ֖/י עַד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/015.yaml
  text: And he blessed Joseph and said[a], “The God before whom my fathers Abraham and Isaac walked[b], the God who has shepherded me from my beginning to this day,”
translation:
  language: tl
  text: At binasbasan niya si Jose at sinabi, “Ang Diyos na sa harap niya’y lumakad ang aking mga ninunong sina Abraham at Isaac, ang Diyos na nagpastol sa akin[a] mula pa sa simula ng aking buhay[b] hanggang sa araw na ito—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na naging pastol ko” o “na nagpakain sa akin.” Taglay ng pandiwang Hebreo ang larawan ng patuloy na pagkalinga at paglalaan ng isang pastol.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa buong buhay ko.” Literal na tumutukoy ang pananalitang Hebreo sa pinakamaagang bahagi ng buhay ni Jacob at binibigyang-diin ang pagkalinga ng Diyos mula pa sa simula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ אֶת יוֹסֵף
  choice: At binasbasan niya si Jose
  rationale: Pinananatili ang tahasang layon ng Hebreo na si Jose, kahit sa konteksto ay kasama sa pagpapala ang mga anak nito. Ang “binasbasan” ay natural at marangal na katumbas ng kilos ng pagbigkas ng pagpapala.
- source_word: הָאֱלֹהִים
  choice: Ang Diyos
  rationale: Ipinapakita ng “Ang” ang tiyak na pagtukoy ng pariralang Hebreo at ang pormal na pagkilala sa Diyos sa pamamagitan ng kaniyang kaugnayan sa mga patriyarka.
- source_word: אֲשֶׁר הִתְהַלְּכוּ אֲבֹתַי לְפָנָיו
  choice: na sa harap niya’y lumakad ang aking mga ninuno
  rationale: Pinananatili ang Hebreong talinghaga ng paglakad sa harap ng Diyos, na tumutukoy sa pamumuhay sa kaniyang presensiya at hindi lamang sa pagsunod sa mga utos.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: Abraham at Isaac
  rationale: Ginagamit ang nakaugaliang anyo ng mga pangalang ito sa modernong saling Tagalog.
- source_word: הָרֹעֶה אֹתִי
  choice: na nagpastol sa akin
  rationale: Pinananatili ang aktibong larawang pastoral ng רעה at ang patuloy na pagkalinga at paglalaan ng Diyos, sa halip na paliitin ito sa pagpapakain lamang.
- source_word: מֵעוֹדִי
  choice: mula pa sa simula ng aking buhay
  rationale: Likas sa Tagalog at malapit sa diwa ng pinakamaagang bahagi ng pag-iral ni Jacob, nang hindi ito nililimitahan sa mismong sandali ng kapanganakan.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Tuwirang pinananatili ang pagpapatuloy ng pagkalinga ng Diyos mula sa simula ng buhay ni Jacob hanggang sa kasalukuyang sandali.
theological_decisions:
- issue: Ang idyoma ng paglakad sa harap ng Diyos
  choice: na sa harap niya’y lumakad ang aking mga ninunong sina Abraham at Isaac
  alternative: na sa presensiya niya’y namuhay ang aking mga ninunong sina Abraham at Isaac
  rationale: Pinananatili ng napiling salin ang relasyonal at tipanang talinghaga ng orihinal, sa halip na ipakahulugan ito bilang pagsunod lamang.
- issue: Ang talinghaga ng Diyos bilang pastol
  choice: ang Diyos na nagpastol sa akin
  alternative: ang Diyos na naging pastol ko
  rationale: Pinananatili ang aktibong pandiwang puwersa at ang patuloy na pagkalinga ng Diyos, habang iniiwasang bawasan ang larawan tungo sa paglalaan lamang ng pagkain.
- issue: Ang simula ng pagkalinga ng Diyos kay Jacob
  choice: mula pa sa simula ng aking buhay
  alternative: sa buong buhay ko
  rationale: Ipinahahayag ang pagkalinga mula sa pinakaumpisa ng buhay nang hindi ipinipilit na ang tinutukoy ay isang tiyak na sandali lamang gaya ng kapanganakan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mga pangunahing Hebreong talinghaga—“lumakad sa harap” at “nagpastol”—upang huwag mawala ang kanilang teolohikal at pampanitikang bigat. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” dahil mas malinaw itong tumutukoy kina Abraham at Isaac sa kasalukuyang Tagalog.
