id: GEN.48.5
reference: Genesis 48:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֡ה שְׁנֵֽי בָנֶי/ךָ֩ הַ/נּוֹלָדִ֨ים לְ/ךָ֜ בְּ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּאִ֥/י אֵלֶ֛י/ךָ מִצְרַ֖יְמָ/ה לִ/י הֵ֑ם אֶפְרַ֨יִם֙ וּ/מְנַשֶּׁ֔ה כִּ/רְאוּבֵ֥ן וְ/שִׁמְע֖וֹן יִֽהְיוּ לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/005.yaml
  text: And now[a], your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine; Ephraim and Manasseh shall be mine[c][b], like Reuben and Simeon.
translation:
  language: tl
  text: At ngayon, ang dalawa mong anak na ipinanganak sa iyo sa lupain ng Ehipto bago ako dumating sa iyo sa Ehipto ay akin. Si Efraim at si Manases ay magiging akin, tulad nina Ruben at Simeon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ibinibilang sina Efraim at Manases bilang mga anak ni Jacob at magkakaroon sila ng katayuang tulad ng kina Ruben at Simeon.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang ugnayan sa naunang sinabi at ang mariing paglipat sa bagong pahayag ni Jacob.
- source_word: שְׁנֵי בָנֶיךָ
  choice: ang dalawa mong anak
  rationale: Likas na modernong Tagalog na malinaw na nagpapanatili sa bilang at pagmamay-ari.
- source_word: הַנּוֹלָדִים לְךָ
  choice: na isinilang sa iyo
  rationale: Tapat sa pasibong anyo at sa ugnayang ipinahahayag ng pariralang Hebreo.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang אֶרֶץ, 'lupain,' sa pinagmulang teksto.
- source_word: עַד בֹּאִי אֵלֶיךָ מִצְרָיְמָה
  choice: bago ako dumating sa iyo sa Ehipto
  rationale: Sa konteksto, nililimitahan nito ang tinutukoy sa mga anak na isinilang bago dumating si Jacob; pinananatili rin ang tahasang pag-uulit sa Ehipto.
- source_word: לִי הֵם
  choice: ay akin
  rationale: Maikli at tuwirang ipinapahayag ang pag-angkin ni Jacob nang hindi nagdaragdag ng teknikal na katawagang legal.
- source_word: אֶפְרַיִם וּמְנַשֶּׁה
  choice: Efraim at Manases
  rationale: Mga pangalang karaniwan at madaling makilala sa tradisyong salin sa Filipino.
- source_word: כִּרְאוּבֵן וְשִׁמְעוֹן
  choice: tulad nina Ruben at Simeon
  rationale: Malinaw na ipinahahayag ang paghahambing na minamarkahan ng כְּ.
- source_word: יִהְיוּ לִי
  choice: ay magiging akin
  rationale: Pinananatili ang di-ganap na pandiwa bilang pahayag ng magiging katayuan, kasabay ng pag-uulit sa naunang 'akin.'
theological_decisions:
- issue: Kalikasan ng pag-angkin ni Jacob kina Efraim at Manases
  choice: Isinalin bilang “akin” at “magiging akin,” na nagpapahayag ng kanilang pagkabilang bilang mga anak ni Jacob.
  alternative: “Aampunin ko sila bilang sarili kong mga anak.”
  rationale: Malinaw sa konteksto ang pagbibigay sa kanila ng katayuang tulad ng kina Ruben at Simeon, ngunit walang teknikal na salitang Hebreo para sa pag-aampon; kaya hindi iyon tahasang idinagdag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinanatili ang pag-uulit ng “Ehipto” dahil tahasan itong inuulit sa Hebreo. Ginamit ang “isinilang” sa halip na mas kolokyal na “ipinanganak” upang mapanatili ang marangal na rehistro nang hindi nagiging lipas.
