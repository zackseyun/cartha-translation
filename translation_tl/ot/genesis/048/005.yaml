- from: At ngayon, ang dalawa mong anak na isinilang sa iyo sa lupain ng Ehipto bago ako dumating sa iyo sa Ehipto ay akin. Si Efraim at si Manases ay magiging akin, tulad nina Ruben at Simeon.[a]
  to: At ngayon, ang dalawa mong anak na ipinanganak sa iyo sa lupain ng Ehipto bago ako dumating sa iyo sa Ehipto ay akin. Si Efraim at si Manases ay magiging akin, tulad nina Ruben at Simeon.[a]
  rationale: Pinalitan ang “isinilang” ng mas likas na modernong “ipinanganak.” Inayos din ang talababa upang ipaliwanag ang katayuang ipinahahayag ng talata nang hindi nagdaragdag ng teknikal na terminolohiya o doktrinal na pagpapakahulugan.
