base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/002.yaml
  text: And it was told to Jacob[a], and it was said, “Look, your son Joseph has come to you.” And Israel strengthened himself and sat up on the bed.
translation:
  language: tl
  text: May nagbalita kay Jacob at nagsabi, “Tingnan mo, dumating na sa iyo ang anak mong si Jose.” Nag-ipon ng lakas si Israel at umupo sa higaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד לְיַעֲקֹב וַיֹּאמֶר
  choice: May nagbalita kay Jacob at nagsabi
  rationale: Hindi tinukoy sa Hebreo kung sino ang naghatid ng balita. Pinananatili ng “may nagbalita” ang di-tiyak na tagaganap, at ng “at nagsabi” ang dalawang magkasunod na pandiwa ng pinagmulang teksto.
- source_word: הִנֵּה
  choice: Narito
  rationale: Isang likas at marangal na panawag-pansin sa Filipino na angkop sa agarang pagdating ni Jose.
- source_word: בִּנְךָ יוֹסֵף
  choice: ang anak mong si Jose
  rationale: Karaniwang ayos sa modernong Filipino para sa pariralang tumutukoy sa anak at pagkatapos ay pinapangalanan siya.
- source_word: בָּא אֵלֶיךָ
  choice: dumating sa iyo
  rationale: Ipinahahayag ang natapos na pagdating na may agarang kaugnayan sa kasalukuyang tagpo.
- source_word: וַיִּתְחַזֵּק
  choice: Nag-ipon ng lakas
  rationale: Likas na Filipino para sa reflexive na pagpapalakas ng isang taong maysakit o mahina, nang hindi ito ginagawang simpleng paglalakas-loob.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinananatili ang sadyang paglipat ng pangalan mula Jacob tungo sa Israel.
- source_word: וַיֵּשֶׁב עַל הַמִּטָּה
  choice: umupo sa higaan
  rationale: Tuwirang isinasalin ang pag-upo sa higaan; ipinahihiwatig na ng konteksto na bumangon siya mula sa pagkakahiga.
theological_decisions:
- issue: Paggamit ng “Jacob” at “Israel” sa iisang talata
  choice: Panatilihin ang paglipat ng pangalan ayon sa Hebreo
  alternative: Gamitin ang “Jacob” sa buong talata para sa estilistikong pagkakapare-pareho
  rationale: Maaaring may pampanitikan o teolohikal na kabuluhan ang pagpapalit ng pangalan. Hindi ito dapat pantayin o ipaliwanag nang higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ang “May nagbalita … at nagsabi” ay bahagyang pormal upang mapanatili ang dalawang pandiwa sa Hebreo, samantalang ang “Nag-ipon ng lakas” ay likas na pahayag sa karaniwang gamit.
