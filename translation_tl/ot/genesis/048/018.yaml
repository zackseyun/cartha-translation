base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/018.yaml
  text: And Joseph said to his father, “Not so, my father, for this one is the firstborn. Put your right hand on his head.”
translation:
  language: tl
  text: Sinabi ni Jose sa kanyang ama, “Hindi po ganyan, Ama, dahil ito ang panganay. Ipatong ninyo ang inyong kanang kamay sa ulo niya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang payak na “Sinabi” nang hindi kinakailangang idagdag ang “At.”
- source_word: אֶל אָבִיו
  choice: sa kanyang ama
  rationale: Tuwirang ipinapahayag ang kausap ni Jose at natural ang pariralang ito sa Tagalog.
- source_word: לֹא כֵן
  choice: Hindi po ganyan
  rationale: Ipinapahayag nito ang magalang ngunit tuwirang pagtutuwid ni Jose. Ang “po” ay angkop na panandang-galang sa ama, samantalang pinananatili ng “ganyan” ang pagtukoy sa maling pagkakapatong ng kamay.
- source_word: אָבִי
  choice: Ama
  rationale: Pinananatili ang tuwirang magalang na pagtawag na “aking ama” sa paraang natural sa usapang Tagalog; hindi kailangang ulitin ang panghalip na “ko” sa bokatibo.
- source_word: כִּי
  choice: dahil
  rationale: Ipinakikilala nito ang dahilan ng pagtutol ni Jose.
- source_word: זֶה
  choice: ito
  rationale: Pinananatili ang deiktikong pagtukoy ni Jose sa anak na nasa harap nila.
- source_word: הַבְּכֹר
  choice: ang panganay
  rationale: Ang “panganay” ang natural at eksaktong terminong Tagalog para sa unang isinilang, kasama ang kaugnay na katayuan nito sa pamilya.
- source_word: שִׂים
  choice: Ipatong ninyo
  rationale: Sa konteksto ng kamay at ulo, mas natural at tiyak ang “ipatong” kaysa pangkalahatang “ilagay”; ang “ninyo” ay nagpapanatili ng paggalang.
- source_word: יְמִינְךָ
  choice: ang inyong kanang kamay
  rationale: Hayagang tinutukoy ang kanang kamay at pinananatili ang magalang na pakikipag-usap ni Jose sa kanyang ama.
- source_word: עַל רֹאשׁוֹ
  choice: sa ulo niya
  rationale: Natural na Tagalog para sa pisikal na pagpatong ng kamay sa ulo habang nagbibigay ng pagpapala.
theological_decisions:
- issue: Katayuan ng unang isinilang sa konteksto ng pagpapala
  choice: ang panganay
  alternative: ang nakatatanda
  rationale: Hindi lamang paghahambing ng edad ang הַבְּכֹר; tumutukoy ito sa katayuan ng unang isinilang sa pamilya at sa konteksto ng pagpapala. Pinananatili ng “panganay” ang kahulugang iyon nang walang idinaragdag na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “po” at “ninyo” upang ihatid ang paggalang ni Jose sa kanyang ama, ngunit nanatiling tuwiran ang kanyang pagtutol. Walang kinakailangang talababa sa talatang ito.
