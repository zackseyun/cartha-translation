base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/019.yaml
  text: But his father refused and said[a], “I know, my son, I know. He too will become a people, and he too will become great. Nevertheless, his younger brother will become greater than he, and his offspring will become the fullness of nations.”
translation:
  language: tl
  text: Ngunit tumanggi ang kanyang ama at sinabi, “Alam ko, anak ko, alam ko. Siya rin ay magiging isang bayan, at siya rin ay magiging dakila. Gayunman, ang nakababata niyang kapatid ay magiging higit na dakila kaysa sa kanya, at ang kanyang lahi ay magiging kapuspusan ng mga bansa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “napakaraming bansa.” Mas literal sa Hebreo: “kapuspusan ng mga bansa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: tumanggi
  rationale: Tuwirang ipinahahayag ng pandiwang מאן ang sadyang pagtanggi ni Jacob, hindi lamang pag-aatubili.
- source_word: יָדַעְתִּי ... יָדַעְתִּי
  choice: Alam ko, anak ko, alam ko
  rationale: Pinananatili ang mariing pag-uulit ng Hebreo sa natural na makabagong Tagalog.
- source_word: גַּם הוּא יִהְיֶה לְעָם
  choice: Siya rin ay magiging isang bayan
  rationale: Ang “bayan” ay malinaw na kolektibong katawagan para sa עָם at akma sa pangakong magiging isang pangkat ng mga tao ang kanyang mga inapo.
- source_word: וְגַם הוּא יִגְדָּל
  choice: at siya rin ay magiging dakila
  rationale: Ipinakikita ng “magiging dakila” ang hinaharap na paglaki sa katayuan o kadakilaan.
- source_word: וְאוּלָם
  choice: Gayunman
  rationale: Nagpapahayag ito ng matibay na pagsalungat nang hindi binubura ang naunang pangako tungkol kay Manases.
- source_word: אָחִיו הַקָּטֹן
  choice: ang nakababata niyang kapatid
  rationale: Sa konteksto ng magkapatid, ang הַקָּטֹן ay tumutukoy sa mas bata, hindi sa mas maliit ang katawan.
- source_word: יִגְדַּל מִמֶּנּוּ
  choice: ay magiging higit na dakila kaysa sa kanya
  rationale: Pinananatili ang paghahambing at ang aspektong pag-unlad ng pandiwa.
- source_word: וְזַרְעוֹ
  choice: at ang kanyang lahi
  rationale: Ang “lahi” ay natural na kolektibong salin ng זֶרַע sa konteksto ng mga inapo.
- source_word: יִהְיֶה מְלֹא הַגּוֹיִם
  choice: ay magiging kapuspusan ng mga bansa
  rationale: Pinananatili ng “kapuspusan” ang kongkretong diwa at tunay na kalabuan ng מְלֹא sa halip na agad itong ipakahulugang “napakaraming.”
theological_decisions:
- issue: Kahulugan ng מְלֹא הַגּוֹיִם
  choice: kapuspusan ng mga bansa
  alternative: napakaraming bansa / kalipunan ng mga bansa
  rationale: Pinananatili sa pangunahing teksto ang “kapuspusan,” na pinakamalapit sa Hebreo at hindi agad nilulutas ang posibleng teolohikal at intertekstuwal na pahiwatig. Ipinaliliwanag ng talababa ang mas idyomatikong posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang mariing pag-uulit na “Alam ko ... alam ko” at ang hindi pangkaraniwang pariralang “kapuspusan ng mga bansa” upang hindi mawala ang kalabuan ng Hebreo.
