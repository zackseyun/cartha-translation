base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/004.yaml
  text: And he said to me, ‘Look, I will make you fruitful and multiply you, and I will make you into an assembly of peoples, and I will give this land to your offspring after you as an everlasting possession.’
translation:
  language: tl
  text: At sinabi niya sa akin, ‘Tingnan mo, gagawin kitang mabunga at pararamihin kita. Gagawin kitang isang kapulungan ng mga bayan, at ibibigay ko ang lupaing ito sa iyong mga supling na susunod sa iyo bilang pag-aari magpakailanman.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Tingnan mo
  rationale: Pinananatili ang pantawag-pansing puwersa ng Hebreong hinnēnî bago ang pangako, sa natural na makabagong Tagalog.
- source_word: מַפְרְךָ
  choice: gagawin kitang mabunga
  rationale: Tuwirang inilalarawan ang causative na anyo ng pandiwang פרה at pinananatili ang imahen ng pagiging mabunga.
- source_word: וְהִרְבִּיתִךָ
  choice: at pararamihin kita
  rationale: Pinananatili ang hiwalay ngunit kaugnay na pangako ng pagpaparami.
- source_word: לִקְהַל עַמִּים
  choice: isang kapulungan ng mga bayan
  rationale: Ang קהל ay kapulungan o pagtitipon, at ang maramihang עמים ay mga bayan; iniiwasang gawing iisang bansa lamang ang diwa.
- source_word: לְזַרְעֲךָ אַחֲרֶיךָ
  choice: sa iyong mga salinlahi
  rationale: Ginagawang likas sa Tagalog ang kolektibong זרע sa konteksto ng mga inapo ni Jacob pagkamatay niya, habang pinapaloob ang diwa ng אַחֲרֶיךָ.
- source_word: אֲחֻזַּת עוֹלָם
  choice: bilang pag-aari magpakailanman
  rationale: Pinananatili ang pangmatagalang legal at tipanang diwa ng isang permanenteng pag-aari.
theological_decisions:
- issue: Saklaw ng ‘kapulungan ng mga bayan’
  choice: kapulungan ng mga bayan
  alternative: kalipunan ng mga bansa
  rationale: Pinananatili ang pluralidad at kolektibong larawan ng Hebreo nang hindi ipinapasok ang isang tiyak na interpretasyon tungkol sa katuparan nito.
- issue: Tagal ng pag-aari sa lupa
  choice: magpakailanman
  alternative: panghabang-panahon
  rationale: Tapat na pinananatili ang malawak na temporal na puwersa ng עוֹלָם nang hindi nilulutas sa salin ang mga tanong tungkol sa tipan o katuparan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tuwirang pananalita at ang sunod-sunod na pangako, habang iniwasan ang labis na teknikal o denominasyonal na pananalita.
