  source_fidelity: 'Tapat ang mga pangunahing pangako: pagiging mabunga, pagpaparami, pagiging isang kapulungan ng mga bayan, at pagbibigay ng lupain bilang walang-hanggang pag-aari. Gayunman, ang “iyong mga salinlahi” ay hindi malinaw na naipapahayag ang qualifier na אַחֲרֶיךָ (“na kasunod mo/after you”); dapat itong ilahad nang hindi binabago ang kolektibong diwa ng זַרְעֲךָ.'
  naturalness: Malinaw at marangal ang daloy sa makabagong Filipino. Ang “mga supling na susunod sa iyo” ay natural at mas malinaw kaysa “mga salinlahi” para sa pagpapasa ng lupa sa mga inapo sa hinaharap.
