  naturalness: Likas ang karamihan ng Tagalog. Mas maayos ang "sa aking matinding dalamhati" bilang marangal ngunit malinaw na pagpapahayag ng personal na bigat ng pagkamatay ni Raquel. Ang "na siyang Bethlehem" ay katanggap-tanggap sa mataas na rehistro ngunit mas natural ang tuwirang paglilinaw na "iyon ang Bethlehem."
  terminology: Ang mga pangalang Padan, Raquel, Canaan, Efrata, at Bethlehem ay angkop at pare-pareho. Napananatili ng mga talababa ang mahalagang obserbasyong ang Hebreo ay "Padan" lamang at hindi tiyak ang eksaktong layo.
