  text: וַ/אֲנִ֣י בְּ/בֹאִ֣/י מִ/פַּדָּ֗ן מֵ֩תָה֩ עָלַ֨/י רָחֵ֜ל בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ בַּ/דֶּ֔רֶךְ בְּ/ע֥וֹד כִּבְרַת אֶ֖רֶץ לָ/בֹ֣א אֶפְרָ֑תָה וָ/אֶקְבְּרֶ֤/הָ שָּׁם֙ בְּ/דֶ֣רֶךְ אֶפְרָ֔ת הִ֖וא בֵּ֥ית לָֽחֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/007.yaml
  text: As for me[a], when I came from Paddan, Rachel died to my sorrow in the land of Canaan on the way, while there was still some distance to go to Ephrath; and I buried her there on the way to Ephrath (that is[c][b], Bethlehem).
translation:
  language: tl
  text: Ako naman, nang dumating ako mula sa Padan[a], namatay si Raquel, sa aking matinding dalamhati[b], sa lupain ng Canaan, sa daan, habang may natitira pang lakbayin bago makarating sa Efrata.[c] Inilibing ko siya roon, sa daan patungong Efrata—iyon ang Bethlehem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Padan” ang nakasulat sa Hebreo rito. Sa ibang kaugnay na talata ay ginagamit ang mas buong pangalang “Padan-Aram.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “namatay sa akin/sa ibabaw ko.” Maaaring idiin ng idyomang Hebreo ang personal na bigat ng pagkamatay ni Raquel kay Jacob; maaari rin itong magpahiwatig ng pagkamatay niya malapit sa kaniya.
    reason: lexical_alternative
  - marker: c
    text: Ang pariralang Hebreo ay tumutukoy sa isang nalalabing layo o bahagi ng paglalakbay; hindi tiyak ang eksaktong distansiya.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ako naman
  rationale: Ipinahahayag ng hiwalay na panghalip at pangatnig ang paglipat ng paksa at ang personal na paggunita ni Jacob. Likas sa modernong Tagalog ang “Ako naman” at naipakikita nito ang bahagyang pagbibigay-diin.
- source_word: בְּבֹאִי מִפַּדָּן
  choice: nang dumating ako mula sa Padan
  rationale: Ang infinitive construct na may hulaping unang panauhan ay temporal. Pinananatili rin ang “Padan” sapagkat iyon lamang ang nasa tekstong Hebreo, hindi ang pinalawak na “Padan-Aram.”
- source_word: מֵתָה עָלַי
  choice: namatay si Raquel sa piling ko
  rationale: Ang literal na idyoma ay “namatay sa/ibabaw ko.” Ang “sa piling ko” ay nagpapanatili sa personal at posibleng malapit na presensiya ni Jacob nang mamatay si Raquel, nang hindi nililimitahan ang parirala sa kalungkutan lamang.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili ang buong heograpikong parirala ng Hebreo sa malinaw at marangal na Tagalog.
- source_word: בַּדֶּרֶךְ
  choice: habang nasa daan
  rationale: Natural na paglalarawan ito sa kalagayan ng paglalakbay at malinaw na tumutugma sa Hebreong parirala.
- source_word: בְּעוֹד כִּבְרַת אֶרֶץ לָבֹא אֶפְרָתָה
  choice: at may kalayuan pa bago makarating sa Efrata
  rationale: Ang כִּבְרַת אֶרֶץ ay idyoma para sa nalalabing distansiya na hindi tiyak ang sukat. Iniiwasan ng “may kalayuan pa” ang huwad na katiyakan.
- source_word: וָאֶקְבְּרֶהָ שָּׁם
  choice: Inilibing ko siya roon
  rationale: Tuwirang pinananatili ang kasunod na personal na kilos ni Jacob at ang lokatibong “roon.”
- source_word: בְּדֶרֶךְ אֶפְרָת
  choice: sa daan patungong Efrata
  rationale: Malinaw at likas na Tagalog para sa ruta o lugar na kaugnay ng Efrata.
- source_word: הִוא בֵּית לָחֶם
  choice: na siyang Bethlehem
  rationale: Pinananatili ang paliwanag na kinikilala ang Efrata bilang Bethlehem.
theological_decisions:
- issue: Saklaw ng idyomang מֵתָה עָלַי
  choice: namatay si Raquel sa piling ko
  alternative: namatay si Raquel, na labis kong ikinalungkot
  rationale: Maaaring magpahiwatig ang Hebreong עָלַי ng pagkamatay na nangyari kay Jacob o malapit sa kaniya, kalakip ang personal na bigat nito. Hindi ginagawang tahasang emosyonal lamang ng salin ang isang idyomang may tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang karaniwang anyong “Raquel” at ang mga pangalang “Canaan,” “Efrata,” at “Bethlehem.” Pinanatili ang pag-uulit ng “daan” at ang heograpikong pagkakasunod-sunod ng Hebreo.
