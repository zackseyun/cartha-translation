  yaml_path: translation/ot/genesis/048/003.yaml
  text: And Jacob said to Joseph[a], “God Almighty appeared to me at Luz in the land of Canaan and blessed me,”
translation:
  language: tl
  text: Sinabi ni Jacob kay Jose, “Ang Diyos na Makapangyarihan sa Lahat[a] ay nagpakita sa akin sa Luz, sa lupain ng Canaan, at pinagpala niya ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “El Shaddai.” Tradisyonal itong isinasaling “Diyos na Makapangyarihan sa Lahat,” ngunit pinagtatalunan ang eksaktong diwa ng Shaddai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas sa makabagong Tagalog ang pandiwang panimulang ito at sapat na ipinagpapatuloy ang daloy ng salaysay nang hindi pinabibigat ng hindi kailangang pang-ugnay.
- source_word: אֶל
  choice: kay
  rationale: Ito ang karaniwang pananda sa Tagalog para sa taong kinakausap.
- source_word: אֵל שַׁדַּי
  choice: Ang Diyos na Makapangyarihan sa Lahat
  rationale: Isinasalin ang banal na titulo sa malinaw at kinikilalang Tagalog; pinananatili sa talababa ang transliterasyong “El Shaddai” dahil pinagtatalunan ang eksaktong diwa ng שַׁדַּי.
- source_word: נִרְאָה
  choice: nagpakita
  rationale: Ipinahahayag nito ang pagpapakita ng Diyos nang natural sa Tagalog, nang hindi nagdaragdag ng paliwanag hinggil sa anyo o paraan ng pagpapakita.
- source_word: אֵלַי
  choice: sa akin
  rationale: Karaniwang katumbas ito ng direksiyon ng pagpapakita patungo kay Jacob.
- source_word: בְּלוּז
  choice: sa Luz
  rationale: Natural na Tagalog para sa pinangyarihang isang tiyak na lugar.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili ang tahasang salitang “lupain” at ang heograpikong pangalan.
- source_word: וַיְבָרֶךְ אֹתִי
  choice: at pinagpala niya ako
  rationale: Nililinaw ng panghalip ang nagpapatuloy na banal na simuno at natural ang ayos sa Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na titulong אֵל שַׁדַּי
  choice: Ang Diyos na Makapangyarihan sa Lahat
  alternative: El Shaddai; Makapangyarihang Diyos
  rationale: Malinaw na ipinahahayag ng pangunahing teksto ang tradisyonal na diwa ng titulo, habang kinikilala sa talababa na hindi tiyak ang eksaktong kahulugan ng Shaddai; sa gayon ay hindi ikinukubli ang tunay na leksikal na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino Tagalog. Pinanatili ang pangalang Luz at ang pariralang “lupain ng Canaan,” at iniwasan ang denominasyonal o labis na interpretatibong pananalita.
