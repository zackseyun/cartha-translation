  yaml_path: translation/ot/genesis/048/006.yaml
  text: But your offspring whom you father after them will be yours[b][a]; they will be called by the name of their brothers in their inheritance.
translation:
  language: tl
  text: Ngunit ang mga anak mong isinilang pagkaraan nila ay magiging iyo[a]; tatawagin sila sa pangalan ng kanilang mga kapatid sa kanilang mana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga supling mo.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, hindi sila tatanggap ng magkakahiwalay na mana bilang mga lipi, kundi maibibilang sa ilalim nina Efraim at Manases.
    reason: cross_reference
lexical_decisions:
- source_word: וּמוֹלַדְתְּךָ
  choice: ang mga anak na magiging iyo
  rationale: Tumutukoy ang anyo sa mga isisilang o magiging supling ni Jose. Natural sa makabagong Tagalog ang “mga anak na magiging iyo” at hindi nito pinalalawak ang kahulugan tungo sa malalayong salinlahi.
- source_word: אֲשֶׁר הוֹלַדְתָּ
  choice: na magiging iyo
  rationale: Ang Hiphil ng ילד ay literal na tumutukoy sa pag-aanak o pagiging ama. Sa Tagalog, ang “mga anak na magiging iyo” ay likas na paraan upang ipahayag ang mga anak na magiging anak ni Jose nang hindi gumagamit ng alanganing “ipanganganak mo,” na maaaring magpahiwatig na siya mismo ang manganganak.
- source_word: אַחֲרֵיהֶם
  choice: pagkaraan nila
  rationale: Tuwirang tumutukoy sa mga anak na darating pagkatapos nina Efraim at Manases.
- source_word: לְךָ יִהְיוּ
  choice: ay magiging iyo
  rationale: Pinananatili ang legal at pampamilyang diwa ng pag-aari o pagkabilang kay Jose, bilang kaibahan sa pagkilala kina Efraim at Manases bilang mga anak ni Jacob.
- source_word: עַל שֵׁם אֲחֵיהֶם
  choice: ayon sa pangalan ng kanilang mga kapatid
  rationale: Malapit ito sa Hebreo at pinananatili ang diwa ng pagtawag o pagkakabilang sa pangalan ng kanilang mga kapatid, sa halip na tahasang ipasok sa pangunahing teksto ang paliwanag tungkol sa mga lipi.
- source_word: אֲחֵיהֶם
  choice: kanilang mga kapatid
  rationale: Pinananatili ang literal na ugnayang pampamilya; malinaw sa konteksto na tumutukoy ito kina Efraim at Manases.
- source_word: יִקָּרְאוּ
  choice: tatawagin sila
  rationale: Tuwirang katumbas ng Niphal ng קרא at maaari ring magpahiwatig ng pagkilala o pagkakabilang sa isang pangalan sa kontekstong ito.
- source_word: בְּנַחֲלָתָם
  choice: sa mana ng mga ito
  rationale: Ang נַחֲלָה ay minanang bahagi o lupain. Nililinaw ng “mga ito” na ang tinutukoy na mana ay sa mga kapatid, habang iniiwasan ang malabong sunod-sunod na panghalip.
theological_decisions:
- issue: Katayuan ng mga susunod na anak ni Jose sa paghahati ng mana
  choice: Pinanatili sa pangunahing teksto ang pormulang tatawagin sila ayon sa pangalan ng kanilang mga kapatid, at ipinaliwanag sa talababa ang implikasyon sa mana.
  alternative: Isalin sa pangunahing teksto na mabibilang sila sa mga lipi nina Efraim at Manases.
  rationale: Ang Hebreo ay gumagamit ng wika ng pangalan at mana, hindi ng tahasang pahayag tungkol sa hiwalay na katayuang panlipi. Pinananatili ng salin ang pahiwatig at tensiyon ng orihinal, samantalang ang talababa ay nagbibigay ng kinakailangang konteksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Iniwasan ang teknikal o lipas na “ipanganganak mo” para sa paternal na Hiphil, at pinanatili sa teksto ang Hebreong pananalita tungkol sa pangalan at mana.
