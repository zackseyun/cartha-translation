  source_fidelity: 'Kailangang ayusin ang unang sugnay: ang “magiging iyo” sa paglalarawan ng mga anak ay hindi tapat sa participial na “mga anak/supling mo na ipinanganak o iyong inianak pagkatapos nila,” at ang pangalawang “magiging iyo” lamang ang tumutugma sa לְךָ יִהְיוּ. Ang panghalip sa “sa mana ng mga ito” ay nagpapaliit sa isang panandang Hebreo na maaaring tumukoy sa mana ng mga anak na ito; mas mabuting panatilihin ang “kanilang mana.”'
  naturalness: Mas natural at malinaw ang “mga anak mong isinilang pagkaraan nila” kaysa “mga anak na magiging iyo.” Ang “sa pangalan ng kanilang mga kapatid” ay tuwiran at angkop sa marangal na makabagong Filipino.
  terminology: Ang “mana,” “mga kapatid,” at “mga lipi” ay angkop. Pinananatili ang mga pangalang Efraim at Manases. Hindi isinasama sa pangunahing teksto ang pagpapakahulugang panlipi na nasa talababa lamang.
