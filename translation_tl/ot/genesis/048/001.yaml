  yaml_path: translation/ot/genesis/048/001.yaml
  text: After these things[a], it was said to Yoseph, “Look, your father is sick.” So he took his two sons with him, Manasseh and Ephraim.
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito, may nagsabi kay Jose, “Tingnan mo, may sakit ang iyong ama.” At isinama niya ang dalawa niyang anak, sina Manases at Efraim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Pagkatapos ng mga pangyayaring ito
  rationale: Ipinahihiwatig ng וַיְהִי ang pagsulong ng salaysay at hindi kailangang isalin nang hiwalay sa natural na Tagalog. Ang “mga pangyayaring ito” ay angkop sa malawak na diwa ng דְּבָרִים sa kontekstong pasalaysay.
- source_word: וַיֹּאמֶר לְיוֹסֵף
  choice: may nagsabi kay Jose
  rationale: Hindi pinangalanan sa Hebreo ang nagsalita. Pinananatili ng “may nagsabi” ang kawalang-tiyak nang hindi nagdaragdag ng pagkakakilanlan.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Ang pantawag-pansing kataga ay natural na naihahatid ng “Tingnan mo,” na nagpapanatili sa agarang diin nang hindi gumagamit ng makalumang pananalita.
- source_word: אָבִיךָ חֹלֶה
  choice: may sakit ang iyong ama
  rationale: Direkta at likas na paglalarawan sa kasalukuyang kalagayan ng ama ni Jose.
- source_word: וַיִּקַּח אֶת שְׁנֵי בָנָיו עִמּוֹ
  choice: Kaya isinama niya ang dalawa niyang anak
  rationale: Sa konteksto, ang pagkuha sa mga anak “kasama niya” ay natural na ipinahahayag sa Tagalog bilang “isinama.” Ipinakikita ng “Kaya” ang lohikal at pasalaysay na tugon ni Jose sa balita.
- source_word: מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: sina Manases at Efraim
  rationale: Ginamit ang karaniwang anyo ng mga pangalang biblikal sa Filipino at ang pantukoy na “sina” para sa dalawang pangalan ng tao.
