  source_fidelity: Tumpak ang pagsasalin ng hindi pinangalanang tagapagsalita, ng kasalukuyang pagkakasakit ng ama, at ng dalawang anak ni Jose. Ang “isinama niya” ay likas na naghahatid ng pagkuha sa mga anak upang makasama niya. Gayunman, ang “Kaya” ay nagbibigay ng mas malinaw na ugnayang sanhi-bunga kaysa sa simpleng pagsulong ng salaysay na ipinahihiwatig ng waw-consecutive.
  naturalness: Malinaw, makabago, at marangal ang Filipino. Ang “Pagkatapos ng mga pangyayaring ito,” “may nagsabi,” at “Tingnan mo” ay natural sa kontekstong pasalaysay. Mas neutral at tapat sa pagkakasunod-sunod ng Hebreo ang “At” kaysa “Kaya” sa ikalawang pangungusap.
  terminology: Ang Jose, Manases, at Efraim ay mga karaniwan at angkop na anyong Filipino ng mga pangalang biblikal. Walang problemang pangteolohikal o terminolohikal.
