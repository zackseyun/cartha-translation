  to: Pagkatapos ng mga pangyayaring ito, may nagsabi kay Jose, “Tingnan mo, may sakit ang iyong ama.” At isinama niya ang dalawa niyang anak, sina Manases at Efraim.
  rationale: Pinalitan lamang ang “Kaya” ng “At” upang mapanatili ang simpleng pasalaysay na pag-usad ng Hebreong waw-consecutive nang hindi nagdaragdag ng tahasang lohikal na sanhi-bunga. Ang iba pang bahagi ng salin ay tapat at likas sa modernong Filipino Tagalog.
