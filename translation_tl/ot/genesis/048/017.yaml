base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/017.yaml
  text: When Joseph saw that his father had placed his right hand on Ephraim’s head[a], it was displeasing in his eyes, and he took hold of his father’s hand to remove it from Ephraim’s head to Manasseh’s head.
translation:
  language: tl
  text: Nang makita ni Jose na nakapatong ang kanang kamay ng kanyang ama sa ulo ni Efraim, hindi niya ito nagustuhan.[a] Hinawakan niya ang kamay ng kanyang ama upang ilipat ito mula sa ulo ni Efraim patungo sa ulo ni Manases.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal sa Hebreo: “naging masama iyon sa kanyang mga mata,” isang idyomang tumutukoy sa hindi niya pagkagusto rito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: Nang makita ni Jose na
  rationale: Ipinahahayag ng waw-consecutive ang pagsulong ng salaysay, at ipinakikilala ng כִּי ang nilalaman ng nakita ni Jose. Likas sa Tagalog ang hulma na “Nang makita ... na.”
- source_word: יָשִׁית
  choice: ipinatong
  rationale: Ang pandiwa ay nangangahulugang ilagay o ipatong. Ang “ipinatong” ang pinakanatural para sa kamay na inilagay sa ulo bilang kilos ng pagbabasbas.
- source_word: יַד יְמִינוֹ
  choice: ang kanang kamay nito
  rationale: Pinananatili nito ang kongkretong kilos at kahalagahan ng kanang kamay. Ginamit ang “nito” upang malinaw na ang kamay ay sa ama, hindi kay Jose.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: hindi iyon naging kalugod-lugod sa kanyang paningin
  rationale: Pinananatili ang Hebreong idyoma ng pansariling pagtingin nang hindi ipinahihiwatig na talagang masama sa moral na diwa ang kilos.
- source_word: וַיִּתְמֹךְ
  choice: hinawakan niya
  rationale: Sa konteksto, hinawakan ni Jose ang kamay ng ama upang baguhin ang kinalalagyan nito. Hindi pinalalakas nang labis ang kilos gaya ng “sinunggaban.”
- source_word: לְהָסִיר אֹתָהּ
  choice: upang ilipat iyon
  rationale: Bagaman pangunahing diwa ng הסיר ang alisin o ilihis, malinaw sa kasunod na parirala na ang kamay ay inililipat mula sa isang ulo patungo sa isa pa; natural at tumpak dito ang “ilipat.”
- source_word: מֵעַל רֹאשׁ אֶפְרַיִם עַל רֹאשׁ מְנַשֶּׁה
  choice: mula sa ulo ni Efraim patungo sa ulo ni Manases
  rationale: Malinaw na inilalarawan ang direksiyon ng paglipat mula sa ulo ni Efraim tungo sa ulo ni Manases.
theological_decisions:
- issue: Paglalarawan sa reaksiyon ni Jose sa kilos ng kanyang ama
  choice: hindi iyon naging kalugod-lugod sa kanyang paningin
  alternative: sumama ang loob niya / hindi niya iyon nagustuhan
  rationale: Hindi tinutukoy ng Hebreo kung simpleng hindi niya nagustuhan ang nakita o kung mas matindi ang damdamin niya. Pinananatili ng napiling salin ang pansariling pagtataya nang hindi nagdaragdag ng tiyak na sikolohikal o moral na kahulugan.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “Jose,” “Efraim,” at “Manases,” na pamilyar na anyo ng mga pangalan sa Tagalog. Inilagay ang talababa matapos ang buong idyomatikong pahayag na nililinaw nito.
