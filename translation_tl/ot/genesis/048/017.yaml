  to: Nang makita ni Jose na nakapatong ang kanang kamay ng kanyang ama sa ulo ni Efraim, hindi niya ito nagustuhan.[a] Hinawakan niya ang kamay ng kanyang ama upang ilipat ito mula sa ulo ni Efraim patungo sa ulo ni Manases.
