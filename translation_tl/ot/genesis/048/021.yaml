  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף הִנֵּ֥ה אָנֹכִ֖י מֵ֑ת וְ/הָיָ֤ה אֱלֹהִים֙ עִמָּ/כֶ֔ם וְ/הֵשִׁ֣יב אֶתְ/כֶ֔ם אֶל אֶ֖רֶץ אֲבֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/021.yaml
  text: Then Israel said to Joseph[a], “Behold, I am about to die[b], but God will be with you and will bring you back to the land of your fathers.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Israel kay Jose, “Narito, malapit na akong mamatay. Ngunit[a] sasamahan kayo[b] ng Diyos at ibabalik niya kayo sa lupain ng inyong mga ninuno.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “At.” Payak na “at” ang pang-ugnay sa Hebreo, ngunit malamang na nagpapahiwatig ito rito ng pagtutunggali: mamamatay si Israel, ngunit patuloy silang sasamahan ng Diyos.'
    reason: lexical_alternative
  - marker: b
    text: Maramihan ang “kayo” sa Hebreo sa “sasamahan kayo” at “ibabalik niya kayo”; kaya ang pangako ay hindi lamang para kay Jose kundi umaabot sa kaniyang pamilya o mga inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos ay sinabi” habang pinananatili ang pagkakasunod-sunod.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: “Israel” ang pangalang ginamit sa Hebreo, kaya hindi ito pinalitan ng “Jacob.”
- source_word: הִנֵּה
  choice: Narito
  rationale: Panandang pantawag-pansin ang הִנֵּה. Pinananatili ng “Narito” ang pormal at marangal na himig nang hindi gumagamit ng napakalumang pananalita.
- source_word: אָנֹכִי מֵת
  choice: malapit na akong mamatay
  rationale: Ang participial na pahayag ay tumutukoy sa nalalapit na kamatayan, hindi sa kamatayang naganap na.
- source_word: וְהָיָה אֱלֹהִים עִמָּכֶם
  choice: Ngunit sasamahan kayo ng Diyos
  rationale: Bagaman payak na pang-ugnay na “at” ang waw, malinaw na may paghahambing sa nalalapit na pagkamatay ni Israel at sa patuloy na presensiya ng Diyos. Natural sa Tagalog ang “sasamahan kayo ng Diyos.”
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang salin para sa nag-iisang Diyos na tinutukoy ng konteksto.
- source_word: עִמָּכֶם
  choice: kayo
  rationale: Maramihan ang hulapi sa Hebreo. Malinaw na maramihan din ang “kayo” sa Tagalog at ipinauunawa nitong lampas kay Jose lamang ang pangako.
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: at ibabalik niya kayo
  rationale: 'Causative ang Hiphil ng שׁוב: ang Diyos ang magpapabalik sa kanila. Tuwiran at natural sa Tagalog ang “ibabalik niya kayo.”'
- source_word: אֶל אֶרֶץ אֲבֹתֵיכֶם
  choice: sa lupain ng inyong mga ninuno
  rationale: Tumutukoy ito sa lupaing minana at ipinangako sa mga patriyarka. Mas natural at malinaw sa modernong Tagalog ang “mga ninuno” kaysa literal na “mga ama.”
theological_decisions:
- issue: Tinutukoy ng maramihang panghalip sa pangako
  choice: Pinanatili ang maramihang “kayo,” kaya ang pangako ay umaabot kay Jose at sa kaniyang sambahayan o mga inapo.
  alternative: Ituring ang pahayag na para lamang kay Jose at gumamit ng isahang “ikaw.”
  rationale: Maramihan ang mga hulapi sa עִמָּכֶם at אֶתְכֶם. Pinananatili ito ng Tagalog nang malinaw at hindi nililimitahan ang saklaw ng pangako.
- issue: Lakas ng waw bago ang pangungusap tungkol sa presensiya ng Diyos
  choice: Isinalin bilang panalungat na “Ngunit.”
  alternative: Isalin bilang payak na “At.”
  rationale: 'Tunay na maaaring payak na pang-ugnay ang Hebreo, ngunit sa konteksto ay may malinaw na pagtutunggali: mamamatay si Israel, subalit patuloy na sasamahan ng Diyos ang mga kausap. Itinala sa talababa ang literal na alternatibo upang mapanatili ang tunay na posibilidad.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pangalang “Israel,” ang pantawag-pansing “Narito,” at ang maramihang “kayo.” Iniwasan ang labis na arkaikong “sasainyo” at ang posibleng mapanlinlang na literal na “mga ama.”
