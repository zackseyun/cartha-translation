translation:
  language: tl
  text: Nang makita ni Israel ang mga anak ni Jose, sinabi niya, “Sino ang mga ito?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita
  rationale: Ipinahahayag ng waw-consecutive ang pagsulong ng salaysay; natural sa Tagalog ang sugnay na “Nang makita” bilang panimula sa sumunod na pagsasalita.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Israel ang pangalang tahasang ginamit sa tekstong Hebreo, kaya pinanatili ito sa halip na palitan ng Jacob.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang katumbas na hiwalay na salita sa Tagalog.
- source_word: בְּנֵי יוֹסֵף
  choice: ang mga anak ni Jose
  rationale: Ang construct chain ay literal na “mga anak ni Jose”; ito rin ang natural at malinaw na anyo sa modernong Tagalog.
- source_word: וַיֹּאמֶר
  choice: sinabi niya
  rationale: Karaniwang panimula ito sa tuwirang pananalita sa salaysay. Likas sa Tagalog ang “sinabi niya” at naipagpapatuloy nito ang pagkakasunod-sunod ng pangyayari.
- source_word: מִי
  choice: Sino
  rationale: Pananong na panghalip ito na nagtatanong tungkol sa pagkakakilanlan ng mga taong tinutukoy.
- source_word: אֵלֶּה
  choice: ang mga ito
  rationale: Panghalip na pamatlig na maramihan ito para sa mga taong naroon; natural sa Tagalog ang tanong na “Sino ang mga ito?”
theological_decisions:
- issue: Pangalan ng patriyarka
  choice: Israel
  alternative: Jacob
  rationale: Pinananatili ang mismong pangalang ginamit ng Hebreo nang hindi ipinapalit ang mas karaniwang pangalan ng parehong tao.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang “Israel” at ginamit ang natural na ayos ng salaysay at tuwirang tanong.
