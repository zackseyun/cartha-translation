base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/011.yaml
  text: And Israel said to Joseph[a], “I did not expect to see your face, and behold, God has let me see even your offspring.”
translation:
  language: tl
  text: Sinabi ni Israel kay Jose, “Hindi ko inasahang makikita ko ang mukha mo, at heto, ipinakita pa sa akin ng Diyos maging ang mga anak mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na pagsulong ng salaysay sa Filipino; hindi kailangang laging tumbasan ng tahasang pang-ugnay ang wayyiqtol.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinananatili ang pangalang ginamit mismo ng tekstong Hebreo sa halip na palitan ng Jacob.
- source_word: רְאֹה פָנֶיךָ
  choice: makikita ko pang muli ang mukha mo
  rationale: Pinananatili ang kongkretong idyomang 'makita ang mukha,' habang ipinahihiwatig ng 'muli' ang konteksto ng muling pagkikita at ng 'pa' ang hindi inaasahang pagkakataon.
- source_word: לֹא פִלָּלְתִּי
  choice: Hindi ko inasahan
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pag-asam o pag-aakala, hindi sa pananalangin.
- source_word: וְהִנֵּה
  choice: ngunit ngayo'y
  rationale: Natural na ipinahahayag sa modernong Filipino ang biglang kabaligtaran at pagtataka; ang literal na 'narito' ay magiging artipisyal sa pangungusap na ito.
- source_word: הֶרְאָה אֹתִי
  choice: ipinakita pa sa akin
  rationale: 'Pinananatili ang causative na diwa ng Hiphil: ang Diyos ang nagkaloob na makita niya ang mga anak ni Jose.'
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang tuwirang salin ng pangkalahatang titulong banal na Elohim.
- source_word: גַּם
  choice: maging
  rationale: Ipinakikita ang dagdag at higit pang di-inaasahang pagpapala bukod sa muling pagkakita kay Jose.
- source_word: זַרְעֶךָ
  choice: mga anak mo
  rationale: Bagaman kolektibong 'supling/binhi' ang literal na saklaw, ang agarang tinutukoy rito ay sina Efraim at Manases; 'mga anak mo' ang pinakanatural at tumpak sa konteksto.
theological_decisions:
- issue: Paglalarawan sa pagkilos ng Diyos sa muling pagkikita
  choice: ipinakita pa sa akin ng Diyos
  alternative: pinahintulutan pa ako ng Diyos na makita
  rationale: Pinananatili nito ang causative na anyo at malinaw na iniuukol sa Diyos ang kaloob na pagkakita, nang hindi nagdaragdag ng paliwanag tungkol sa providensiya.
translation_notes:
  register: Modernong Filipino na marangal ngunit natural. Pinanatili ang pangalang Israel at ang Hebreong larawang 'makita ang mukha,' habang iniwasan ang lipas o artipisyal na 'narito.'
