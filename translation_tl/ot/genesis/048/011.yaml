  source_fidelity: Kailangang alisin ang “pang muli,” dahil hindi ito hayagang nasa Hebreo at ang לֹא פִלָּלְתִּי ay nagsasaad ng hindi pag-asam, hindi tahasang ng muling pagkikita. Ang “mga anak mo” ay katanggap-tanggap sa agarang konteksto, kung saan ang tinutukoy ay ang mga anak ni Jose.
  naturalness: Natural at marangal ang pangungusap sa modernong Filipino. Ang “at heto” ay maikling likas na panandang pandiskurso para sa וְהִנֵּה at mas malapit sa biglang pagtataka kaysa “ngunit ngayo’y.”
  terminology: Tamang pinananatili ang “Israel,” “Jose,” at “Diyos.” Ang “mukha mo” ay angkop na pagpapanatili ng Hebreong idyoma nang hindi nagiging di-natural.
