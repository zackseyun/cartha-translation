base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/013.yaml
  text: And Joseph took the two of them—Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right—and brought them near to him.
translation:
  language: tl
  text: Kinuha ni Jose silang dalawa—si Efraim sa kanang kamay niya, sa tapat ng kaliwang bahagi ni Israel, at si Manases sa kaliwang kamay niya, sa tapat ng kanang bahagi ni Israel—at inilapit niya sila kay Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח ... אֶת־שְׁנֵיהֶם
  choice: Kinuha ni Jose silang dalawa
  rationale: Tuwirang inililipat ang kilos at ang pagkatukoy sa dalawang anak sa natural na modernong Tagalog.
- source_word: בִּימִינוֹ ... בִשְׂמֹאלוֹ
  choice: sa kanan niya ... sa kaliwa niya
  rationale: Pinananatili ang maingat na pagkakaayos ni Jose sa dalawang anak ayon sa sarili niyang kanan at kaliwa.
- source_word: מִשְּׂמֹאל יִשְׂרָאֵל ... מִימִין יִשְׂרָאֵל
  choice: sa tapat ng kaliwa ni Israel ... sa tapat ng kanan ni Israel
  rationale: Ang מִן ay naglalarawan dito ng posisyon o oryentasyon; nililinaw ng “sa tapat ng” ang magkaharap na ayos nang hindi ipinahihiwatig na nagmula sila sa mga panig ni Israel.
- source_word: וַיַּגֵּשׁ אֵלָיו
  choice: at inilapit niya sila kay Israel
  rationale: Ang pandiwang hiphil ay causative, “inilapit”; ginawang tahasan ang tinutukoy ng panghalip upang maiwasan ang kalituhan sa Tagalog.
