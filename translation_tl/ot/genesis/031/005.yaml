  yaml_path: translation/ot/genesis/031/005.yaml
  text: And he said to them[a], “I see that your father's face is not toward me as before, but the God of my father has been with me.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Napapansin kong hindi na tulad ng dati ang pakikitungo sa akin ng inyong ama.[a] Ngunit patuloy na kasama ko ang Diyos ng aking ama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang mukha ng inyong ama ay hindi nakaharap sa akin gaya ng kahapon at noong isang araw.” Ang huling parirala ay idyomang Hebreo na nangangahulugang “gaya ng dati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  choice: Sinabi niya sa kanila
  rationale: Likas na salin ng karaniwang panimulang pandiwa sa salaysay. Bagaman pambabae ang pangmaramihang panghalip sa Hebreo, hindi minamarkahan ng “kanila” ang kasarian; malinaw sa konteksto na sina Raquel at Lea ang kausap.
- source_word: רֹאֶה אָנֹכִי
  choice: Napapansin kong
  rationale: Ipinahihiwatig ng participle at tahasang panghalip ang kasalukuyang pagkilala ni Jacob sa kalagayan. Mas natural sa Filipino ang “napapansin” kaysa literal na “nakikita” kapag saloobin o pakikitungo ang tinutukoy.
- source_word: אֶת פְּנֵי אֲבִיכֶן כִּי אֵינֶנּוּ אֵלַי
  choice: ang pakikitungo sa akin ng inyong ama
  rationale: Ang literal na “mukha” at ang pagkakaharap nito ay idyoma para sa disposisyon o saloobin. Inihahatid ng “pakikitungo” ang kahulugan nang natural at hindi ipinapalagay kung anong tiyak na damdamin ang taglay ni Laban.
- source_word: כִּתְמֹל שִׁלְשֹׁם
  choice: hindi na tulad ng dati
  rationale: Idyomang Hebreo ito para sa dating kalagayan. Ang literal na anyo ay inilagay sa talababa.
- source_word: וֵאלֹהֵי אָבִי
  choice: Ngunit ... ang Diyos ng aking ama
  rationale: Ang pangatnig ay nauunawaang nagpapakita ng pagsalungat sa nagbagong pakikitungo ni Laban at sa patuloy na presensya ng Diyos. Pinananatili ng “Diyos ng aking ama” ang anyo at pampamilyang pagtukoy ng Hebreo.
- source_word: הָיָה עִמָּדִי
  choice: patuloy na kasama ko
  rationale: Binubuod ng perfect ang presensya at pagtulong ng Diyos hanggang sa kasalukuyang sandali. Ipinahahayag ng “patuloy” ang nagpapatuloy na kabuluhang ito sa natural na Filipino.
theological_decisions:
- issue: Paglalahad sa אֱלֹהֵי אָבִי
  choice: ang Diyos ng aking ama
  alternative: ang Diyos ng aking amang si Isaac
  rationale: Mas malapit sa Hebreo ang piniling anyo at hindi nito idinaragdag ang pangalan ni Isaac, kahit malinaw sa mas malawak na konteksto kung sino ang ama ni Jacob.
- issue: Kahulugan ng presensya ng Diyos sa הָיָה עִמָּדִי
  choice: patuloy na kasama ko
  alternative: tinulungan ako
  rationale: Pinananatili ang malawak na pahayag tungkol sa presensya ng Diyos sa halip na paliitin ito sa isang partikular na uri ng tulong.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pakikitungo” upang maipahayag nang natural ang idyoma tungkol sa mukha at pagkakaharap, habang nasa talababa ang mas literal na anyo.
