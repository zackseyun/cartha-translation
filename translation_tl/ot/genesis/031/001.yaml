  text: וַ/יִּשְׁמַ֗ע אֶת דִּבְרֵ֤י בְנֵֽי לָבָן֙ לֵ/אמֹ֔ר לָקַ֣ח יַעֲקֹ֔ב אֵ֖ת כָּל אֲשֶׁ֣ר לְ/אָבִ֑י/נוּ וּ/מֵ/אֲשֶׁ֣ר לְ/אָבִ֔י/נוּ עָשָׂ֕ה אֵ֥ת כָּל הַ/כָּבֹ֖ד הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/001.yaml
  text: He heard the words of Laban’s sons[a], saying, “Jacob has taken all that belonged to our father, and from what belonged to our father he has gained all this wealth.”
translation:
  language: tl
  text: 'Narinig ni Jacob ang mga sinabi ng mga anak ni Laban: “Kinuha ni Jacob ang lahat ng pag-aari ng ating ama, at mula sa pag-aari ng ating ama ay natamo niya ang lahat ng kayamanang ito[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lahat ng kaluwalhatiang ito.” Ang salitang Hebreo ay maaaring tumukoy sa karangalan, kaningningan, o materyal na kayamanan; dito, tumutukoy ito sa nakikitang kasaganaan ni Jacob.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Narinig ni Jacob
  rationale: Isinusulong ng wayyiqtol ang salaysay. Tahasang pinangalanan si Jacob sa Filipino upang maging malinaw ang paksa na ipinahihiwatig ng konteksto, nang hindi nagdaragdag ng di-kailangang panandang gaya ng “Ngayon.”
- source_word: דִּבְרֵי בְנֵי לָבָן לֵאמֹר
  choice: ang sinasabi ng mga anak ni Laban
  rationale: Natural na Filipino ito para sa literal na “mga salita ... na nagsasabi,” at malinaw na ipinakikilalang sila ang pinagmulan ng kasunod na tuwirang pananalita.
- source_word: לָקַח
  choice: Kinuha
  rationale: Karaniwang kahulugan ng pandiwa at angkop sa paratang ng mga anak ni Laban; hindi pinalalakas tungo sa “inagaw,” na maaaring magdagdag ng puwersang hindi tahasang nasa Hebreo.
- source_word: כָּל אֲשֶׁר לְאָבִינוּ
  choice: lahat ng pag-aari ng ating ama
  rationale: Ipinahahayag nang natural ang pagmamay-aring tinutukoy ng pariralang may לְ, habang pinananatili ang saklaw na “lahat.”
- source_word: וּמֵאֲשֶׁר לְאָבִינוּ
  choice: at mula sa pag-aari ng ating ama
  rationale: Pinananatili ang מִן bilang pinagmulan at ang pag-uulit ng “ating ama,” na nagbibigay-diin sa paratang.
- source_word: עָשָׂה
  choice: natamo niya
  rationale: Bagaman literal na “ginawa,” sa konstruksiyong ito tumutukoy ito sa pagkamit o pagkakaroon ng nakikitang kasaganaan. Ang “natamo” ay malinaw at hindi nagsasaad nang higit sa konteksto.
- source_word: כָּל הַכָּבֹד הַזֶּה
  choice: lahat ng kayamanang ito
  rationale: Maaaring mangahulugan ang כָּבוֹד ng karangalan, kaluwalhatian, o materyal na yaman. Sa konteksto ng lumaking mga ari-arian ni Jacob, “kayamanan” ang pinakamalinaw na pangunahing salin; inilalahad sa talababa ang tunay na alternatibo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ating ama” sa tuwirang pananalita bilang likas na inklusibong pagtukoy ng magkakapatid sa kanilang ama. Inilagay ang pananda ng talababa sa “kayamanang ito,” ang mismong salitang may leksikal na alternatibo.
