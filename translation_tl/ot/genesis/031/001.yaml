  to: 'Narinig ni Jacob ang mga sinabi ng mga anak ni Laban: “Kinuha ni Jacob ang lahat ng pag-aari ng ating ama, at mula sa pag-aari ng ating ama ay natamo niya ang lahat ng kayamanang ito[a].”'
