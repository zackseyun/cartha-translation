base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/029.yaml
  text: It is in my power to do you harm[a], but the God of your father spoke to me last night, saying, ‘Be careful not to speak to Jacob either good or bad.’
translation:
  language: tl
  text: May kapangyarihan akong saktan kayo, ngunit sinabi sa akin kagabi ng Diyos ng inyong ama, ‘Mag-ingat kang huwag magsalita kay Jacob ng mabuti man o masama.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa mabuti hanggang sa masama,” isang idyomang maaaring mangahulugang anumang sasabihin, pabor man o laban.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  choice: May kapangyarihan ako
  rationale: Ang idyomang Hebreo ay literal na tumutukoy sa kapangyarihang nasa kamay ng nagsasalita. Likas at malinaw sa modernong Tagalog ang “May kapangyarihan ako,” habang pinananatili ang diwa ng kakayahang kumilos.
- source_word: לַעֲשׂוֹת עִמָּכֶם רָע
  choice: gawan kayo ng masama
  rationale: Ang רָע ay tumutukoy rito sa masamang gagawin na makapipinsala sa kausap. Pinananatili ng “gawan kayo ng masama” ang moral at mapaminsalang kulay ng salita.
- source_word: וֵאלֹהֵי אֲבִיכֶם
  choice: ngunit ... ng Diyos ng inyong ama
  rationale: Bagaman maaaring simpleng “at” ang pang-ugnay, malinaw na ipinakikita ng konteksto ang pagsalungat sa kapangyarihan ni Laban at sa pagpigil ng Diyos. Ang “inyong” ay nagpapanatili sa pangmaramihang hulapi ng Hebreo.
- source_word: אֶמֶשׁ
  choice: kagabi
  rationale: Tumutukoy ito sa nakaraang gabi; “kagabi” ang pinakanatural at eksaktong katumbas sa Tagalog.
- source_word: הִשָּׁמֶר לְךָ
  choice: Mag-ingat ka
  rationale: Ang pautos na anyo ay isang mariing babala na magpakaingat. Natural sa Tagalog ang “Mag-ingat ka” at pinananatili nito ang isahang kausap.
- source_word: מִדַּבֵּר עִם יַעֲקֹב
  choice: magsalita kay Jacob
  rationale: Sa kasunod na pariralang “maging mabuti man o masama,” ipinagbabawal ng kayarian ang pagsasalita kay Jacob sa alinmang paraan.
- source_word: מִטּוֹב עַד רָע
  choice: maging mabuti man o masama
  rationale: Pinananatili nito ang dalawang magkasalungat na dulo ng Hebreong idyoma sa natural na Tagalog; ipinaliliwanag sa talababa ang saklaw nitong maaaring mangahulugang anumang sasabihin.
theological_decisions:
- issue: Paglalarawan sa Diyos na nagsalita kay Laban
  choice: Diyos ng inyong ama
  alternative: Diyos ng iyong ama
  rationale: Ang tekstong Hebreo ay may pangmaramihang hulapi sa אֲבִיכֶם (“inyong ama”), kaya pinanatili iyon sa salin nang hindi ipinapalagay na “mga ama” ang tinutukoy. Hindi rin dinaragdagan ng anumang denominasyonal na pagpapakahulugan ang pagkakakilanlan ng Diyos.
- issue: Saklaw ng babalang “mula sa mabuti hanggang sa masama”
  choice: maging mabuti man o masama
  alternative: huwag magsabi ng anuman
  rationale: Pinananatili sa pangunahing teksto ang kongkretong Hebreong polaridad at ang tensiyon ng pahayag, sa halip na lubusang palitan ito ng interpretasyong “anuman.” Ang idyomatikong diwa ay ibinibigay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “kayo/inyong” para sa mga pangmaramihang anyo at “ka” sa isahang babala kay Laban tungkol kay Jacob. Inilagay ang talababa sa pariralang aktuwal nitong ipinaliliwanag.
