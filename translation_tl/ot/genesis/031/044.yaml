base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/044.yaml
  text: So now[a], come, let us make a covenant, you and I, and let it be a witness between me and you.
translation:
  language: tl
  text: Kaya ngayon, halika, gumawa tayo ng tipan, ikaw at ako, at magsilbi itong saksi sa pagitan nating dalawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pumutol tayo ng tipan.” Ang idyomang Hebreo ay nangangahulugang gumawa o magtatag ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Pinananatili ang pang-ugnay at inilalahad nang natural ang paglipat sa susunod na hakbang ng usapan.
- source_word: לְכָה
  choice: halika
  rationale: Bagaman mula sa pandiwang 'lumakad/pumunta,' ginagamit dito ang pautos bilang paanyaya o panawagan.
- source_word: נִכְרְתָה בְרִית
  choice: gumawa tayo ng tipan
  rationale: Ang literal na idyomang Hebreo ay 'pumutol tayo ng tipan,' ngunit ang malinaw at likas na katumbas sa Filipino ay 'gumawa tayo ng tipan.'
- source_word: בְרִית
  choice: tipan
  rationale: Ang 'tipan' ang kinikilalang salin na nagpapanatili sa pormal at mabigat na ugnayang ipinahihiwatig ng salita.
- source_word: אֲנִי וָאָתָּה
  choice: ikaw at ako
  rationale: Tahasang pinangalanan ang dalawang panig at pinananatili ang diin sa kanilang kapwa pakikibahagi.
- source_word: וְהָיָה לְעֵד
  choice: at magsilbi itong saksi
  rationale: Ipinapahayag ang ninanais na tungkulin ng tipan bilang saksi, sa natural na Filipino.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: sa pagitan nating dalawa
  rationale: Malinaw at likas na Filipino para sa ugnayang nasa pagitan ng nagsasalita at kausap; hindi nito iniiwan ang bilateral na diin.
theological_decisions:
- issue: Ang tinutukoy ng panghalip sa 'magsilbi itong saksi'
  choice: Pinanatili ang isahang panghalip na 'ito' nang hindi tahasang pinangalanan ang referent.
  alternative: At ang tipang ito ang magsilbing saksi.
  rationale: Maaaring tumukoy ang Hebreong וְהָיָה sa tipan o sa kaugnay na kaayusan/palatandaan. Ang di-tahasang panghalip ay nagpapanatili sa likas na antas ng kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'tipan' upang mapanatili ang bigat ng terminong biblikal; iniwasan ang mas mahinang 'kasunduan.'
