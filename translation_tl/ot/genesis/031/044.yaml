  source_fidelity: Tumpak na naipapahayag ang וְעַתָּה bilang transisyong “Kaya ngayon,” ang paanyayang לְכָה bilang “halika,” at ang cohortative na “gumawa tayo ng tipan.” Napananatili ang tahasang dalawang panig sa “ikaw at ako,” gayundin ang layuning ang isang bagay na hindi tahasang pinapangalanan sa huling sugnay ay magsilbing saksi sa pagitan nila. Ang “sa pagitan nating dalawa” ay wastong katumbas ng “sa pagitan ko at mo” nang hindi binabawasan ang bilateral na diin.
  naturalness: Likas, malinaw, at marangal ang modernong Filipino. Ang “Kaya ngayon, halika” ay maayos na panimulang panghikayat sa kontekstong diyalogo. Ang “magsilbi itong saksi” ay natural at maingat na hindi nagpapataw ng mas tiyak na referent kaysa sa ipinahihiwatig ng Hebreo.
  terminology: Ang “tipan” ay angkop at matatag na katumbas ng בְּרִית. Ang “saksi” ay tuwirang katumbas ng עֵד at ang tala ay wastong nagpapaliwanag sa literal na idyomang “pumutol ... ng tipan.”
