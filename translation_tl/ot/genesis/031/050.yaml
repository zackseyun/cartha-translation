  to: Kung pagmamalupitan mo ang mga anak kong babae, o kung mag-aasawa ka pa ng iba bukod sa mga anak kong babae—kahit walang taong kasama natin[a]—tingnan mo, ang Diyos ang saksi sa pagitan nating dalawa.
