  text: אִם תְּעַנֶּ֣ה אֶת בְּנֹתַ֗/י וְ/אִם תִּקַּ֤ח נָשִׁים֙ עַל בְּנֹתַ֔/י אֵ֥ין אִ֖ישׁ עִמָּ֑/נוּ רְאֵ֕ה אֱלֹהִ֥ים עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/050.yaml
  text: If you mistreat my daughters[a], or if you take wives besides my daughters—though no man is with us—see, God is witness between me and you.
translation:
  language: tl
  text: Kung pagmamalupitan mo ang mga anak kong babae, o kung mag-aasawa ka pa ng iba bukod sa mga anak kong babae—kahit walang taong kasama natin[a]—tingnan mo, ang Diyos ang saksi sa pagitan nating dalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “walang sinumang kasama natin”; ang diwa ay walang taong naroroon bilang saksi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּעַנֶּה
  choice: pagmamalupitan
  rationale: Sa Piel, tumutukoy ito sa pagdudulot ng hirap o masamang pakikitungo sa mga anak ni Laban bilang mga asawa ni Jacob. Likas at malinaw sa modernong Filipino ang “pagmamalupitan.”
- source_word: בְּנֹתַי
  choice: mga anak kong babae
  rationale: Tuwirang isinasalin ang pangmaramihang anyong may pag-aari at pinananatili sa dalawang paglitaw nito para sa diin at linaw.
- source_word: תִּקַּח נָשִׁים עַל בְּנֹתַי
  choice: mag-aasawa ka pa bukod sa mga anak kong babae
  rationale: Ang idyoma ay tumutukoy sa pagkuha ng karagdagang mga asawa, hindi sa pagpapalit sa mga anak ni Laban. Ipinahihiwatig ng “pa bukod sa” ang pagdaragdag.
- source_word: אֵין אִישׁ עִמָּנוּ
  choice: kahit walang taong kasama natin
  rationale: Ipinakikita ng sugnay na walang taong naroroon bilang saksi. Ang “kahit” ay natural na naghahayag ng pasalungat na diwa sa konteksto, at ang “tao” ay angkop sa pangkalahatang gamit ng אִישׁ dito.
- source_word: רְאֵה
  choice: tandaan mo
  rationale: Bagaman literal na “tingnan mo,” isa itong pautos na tumatawag ng taimtim na pansin sa kasunod na pahayag. Mas natural sa Filipino ang “tandaan mo” sa ganitong babala nang hindi binabago ang tungkulin nito.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Tumutukoy ito sa iisang Diyos na tinatawag na saksi sa kasunduan.
- source_word: עֵד
  choice: ang saksi
  rationale: Pinananatili ang pormulang pangkasunduan na ang Diyos mismo ang saksi sa pananagutan ng dalawang panig.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: sa pagitan nating dalawa
  rationale: Natural na Filipino para sa ugnayang may pananagutan sa pagitan ni Laban at ni Jacob; nililinaw ng “dalawa” ang dalawang panig ng kasunduan.
theological_decisions:
- issue: Pangkalahatang-taong diwa ng אִישׁ
  choice: walang taong kasama natin
  alternative: walang lalaking kasama natin
  rationale: Sa konteksto, ang punto ay walang taong naroroon bilang saksi, hindi na walang lalaki lamang. Pinananatili ng “tao” ang pangkalahatang diwa nang hindi nagpapasok ng interpretasyong pangkasarian na hindi mahalaga sa babala.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pagmamalupitan” para sa malinaw na masamang pakikitungo sa pag-aasawa, at “mag-aasawa ka pa” para natural na ipahayag ang pagkuha ng karagdagang mga asawa. Inilipat ang talababa sa sugnay na talagang ipinaliliwanag nito.
