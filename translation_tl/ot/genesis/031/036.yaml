- from: Kaya nagalit si Jacob at nakipagtalo kay Laban. Sumagot si Jacob at sinabi kay Laban, “Ano ang paglabag ko? Ano ang kasalanan ko at buong tindi mo akong hinabol[a]?”
  to: Pagkatapos, nagalit si Jacob at nakipagtalo kay Laban. Sumagot si Jacob at sinabi kay Laban, “Ano ang paglabag ko? Ano ang kasalanan ko, bakit mo ako hinabol nang buong tindi[a]?”
