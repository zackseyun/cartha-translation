  yaml_path: translation/ot/genesis/031/036.yaml
  text: Then Jacob became angry and contended with Laban. Jacob answered and said to Laban[a], “What is my transgression? What is my sin, that you have pursued me?”
translation:
  language: tl
  text: Pagkatapos, nagalit si Jacob at nakipagtalo kay Laban. Sumagot si Jacob at sinabi kay Laban, “Ano ang paglabag ko? Ano ang kasalanan ko, bakit mo ako hinabol nang buong tindi[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hinabol mo ako.” Ang pandiwang Hebreo ay maaaring magpahiwatig ng marubdob o nag-aalab na pagtugis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְיַעֲקֹב
  choice: nagalit si Jacob
  rationale: Ang idyomang Hebreo ay nagsasaad na nag-alab o napukaw ang galit ni Jacob. Ang “nagalit” ang natural at malinaw na katumbas sa modernong Tagalog.
- source_word: וַיָּרֶב בְּלָבָן
  choice: nakipagtalo kay Laban
  rationale: Ang ריב ay tumutukoy sa pakikipagtunggali o pakikipagtalo. Pinananatili ng “nakipagtalo” ang harapang alitan nang hindi ipinapalagay na pisikal ang labanan.
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Sumagot si Jacob at sinabi
  rationale: Pinananatili nito ang dalawang pandiwa ng karaniwang Hebreong pormula sa pagsasalaysay, ngunit nananatiling nauunawaan sa Tagalog.
- source_word: מַה פִּשְׁעִי
  choice: Ano ang paglabag ko?
  rationale: Ang פשע ay may moral at legal na diwa ng kusang paglabag o pagsuway. Inihihiwalay ng “paglabag” ang salita mula sa kasunod na “kasalanan” at pinananatili ang paralelismo.
- source_word: מַה חַטָּאתִי
  choice: Ano ang kasalanan ko
  rationale: Ang חטאת ay tuwirang tumutukoy sa kasalanan o pagkakasala. Ang “kasalanan” ang pinakadirekta at pamilyar na salin.
- source_word: כִּי
  choice: at
  rationale: Sa retorikal na tanong, likas sa Tagalog ang pag-uugnay sa kasalanan at sa naging tugon ni Laban sa pamamagitan ng “at”; ipinahihiwatig nito ang diwang “na anupa’t” nang hindi mabigat ang pangungusap.
- source_word: דָלַקְתָּ אַחֲרָי
  choice: buong tindi mo akong hinabol
  rationale: Ang דלק ay nangangahulugang humabol at may larawang kaugnay ng pagliyab o marubdob na pagtugis. Ang “buong tindi” ay natural na nagpapakita ng sidhi, habang ang talababa ay nagbibigay ng mas payak na alternatibo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nakipagtalo,” “paglabag,” at “kasalanan” upang mapanatili ang adversarial at moral-legal na himig ng Hebreo, pati ang retorikal na paralelismo.
