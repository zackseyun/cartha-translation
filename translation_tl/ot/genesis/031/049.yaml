base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/049.yaml
  text: And Mizpah[a], because he said[b], “May Yahweh watch between me and you when we are hidden from each other.”
translation:
  language: tl
  text: At ang Mizpa[a], sapagkat sinabi niya, “Magbantay nawa si Yahweh sa pagitan nating dalawa kapag wala na tayo sa paningin ng isa’t isa.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Mizpa ay pangalang kaugnay ng salitang Hebreo para sa “bantayan” o “dakong pinagmamasdan,” kaya inuugnay ito rito sa “Magbantay nawa si Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “kapag nakukubli tayo sa isa’t isa”; maaari ring unawain na “kapag wala na tayo sa paningin ng isa’t isa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמִּצְפָּה
  choice: At ang Mizpa
  rationale: Ginamit bilang pangalan ng lugar sa konteksto. Isinalin sa baybay na likas sa Filipino at pinanatili sa talababa ang paglalaro sa salitang kaugnay ng pagbabantay.
- source_word: אֲשֶׁר אָמַר
  choice: sapagkat sinabi niya
  rationale: Ipinakikilala ng parirala ang paliwanag sa pangalang Mizpa. Hindi idinagdag sa pangunahing teksto ang ‘tinawag niya itong’ sapagkat ipinahihiwatig lamang iyon ng konteksto at hindi tahasang nakasulat dito.
- source_word: יִצֶף
  choice: Magbantay nawa
  rationale: Ang pandiwa ay mula sa צפה, ‘magmasid/magbantay,’ at ang anyo nito rito ay nagpapahayag ng kahilingan o hangarin. Iniuugnay rin nito ang sinabi sa pangalang Mizpa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalang banal sa pamamagitan ng transliterasyong ‘Yahweh,’ sa halip na palitan ito ng isang titulo.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: sa pagitan nating dalawa
  rationale: Natural na Filipino para sa literal na ‘sa pagitan ko at mo,’ at malinaw na tumutukoy sa dalawang nagsasalita sa tipan.
- source_word: כִּי נִסָּתֵר אִישׁ מֵרֵעֵהוּ
  choice: kapag hindi na tayo nakikita ng isa’t isa
  rationale: Ipinahahayag ng כִּי ang kalagayan o panahong tinutukoy, at ang Niphal ng סתר ay literal na ‘maikubli/mawala sa paningin.’ Ang saling ito ay natural habang pinananatili ang ideya ng pagkawala sa paningin ng isa’t isa.
theological_decisions:
- issue: Pagsasalin sa pangalang banal na יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong ‘Yahweh’ sa halip na palitan ng titulo.
- issue: Diwa ng pagbabantay ni Yahweh
  choice: Magbantay nawa si Yahweh sa pagitan nating dalawa
  alternative: Bantayan nawa tayo ni Yahweh
  rationale: Pinananatili ng napiling anyo ang di-pangkaraniwang ngunit makahulugang ‘sa pagitan ko at mo’ ng Hebreo, nang hindi ipinapakahulugan nang labis kung ang pagbabantay ay proteksiyon, pagsaksi, o kapuwa.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang bahagyang putol na anyo ng pambungad dahil karugtong ito ng naunang talata, at iniwasang idagdag sa pangunahing teksto ang di-tahasang ‘tinawag niya itong.’
