  text: כִּֽי מִשַּׁ֣שְׁתָּ אֶת כָּל כֵּלַ֗/י מַה מָּצָ֨אתָ֙ מִ/כֹּ֣ל כְּלֵי בֵיתֶ֔/ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖/י וְ/אַחֶ֑י/ךָ וְ/יוֹכִ֖יחוּ בֵּ֥ין שְׁנֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/037.yaml
  text: Since you have searched through all my goods[a], what have you found of all the goods of your house? Set it here before my brothers and your brothers[b], and let them judge between the two of us.
translation:
  language: tl
  text: Yamang kinapa mo nang husto ang lahat ng aking ari-arian, ano ang natagpuan mong kabilang sa mga ari-arian ng iyong sambahayan? Ilagay mo rito sa harap ng mga kapatid ko at ng mga kapatid mo, at hayaan silang humatol[a] sa ating dalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpasya sa ating dalawa.” Ang pandiwang Hebreo ay maaaring tumukoy sa paghatol o pag-aayos ng isang alitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשַּׁשְׁתָּ
  choice: kinapa mo nang husto
  rationale: Ang pandiwa ay literal na tumutukoy sa pagkapa o paghipo habang naghahanap. Pinananatili ng salin ang kongkretong larawan at ipinahihiwatig ang masusing paghahanap.
- source_word: כָּל כֵּלַי
  choice: lahat ng aking ari-arian
  rationale: Sa konteksto, ang כְּלִי ay malawak na tumutukoy sa mga naililipat na gamit o pag-aari, hindi lamang sa mga sisidlan.
- source_word: מַה מָּצָאתָ
  choice: ano ang natagpuan mo
  rationale: Tuwirang tanong ito tungkol sa naging resulta ng paghahanap.
- source_word: מִכֹּל כְּלֵי בֵיתֶךָ
  choice: kabilang sa mga ari-arian ng iyong sambahayan
  rationale: 'Ginagawang malinaw ang partitive na diwa ng מִן: anong bagay na pag-aari ng sambahayan ni Laban ang natagpuan. Ang ''sambahayan'' ay saklaw ang bahay bilang yunit ng pamilya at pag-aari.'
- source_word: שִׂים כֹּה
  choice: Ilagay mo rito
  rationale: Natural at tuwirang utos na ilantad sa harap ng mga saksi ang anumang sinasabing ninakaw.
- source_word: נֶגֶד
  choice: sa harap ng
  rationale: Ipinahahayag ang hayagang paglalagay sa presensiya at paningin ng mga saksi.
- source_word: אַחַי וְאַחֶיךָ
  choice: mga kapatid ko at mga kapatid mo
  rationale: Pinananatili ang karaniwang salitang pampamilya ng Hebreo, na maaari ring gamitin para sa mas malawak na kamag-anakan sa kontekstong ito.
- source_word: וְיוֹכִיחוּ
  choice: hayaan silang humatol
  rationale: Ang Hiphil ng יכח ay may hudisyal o arbitral na diwa rito. Ang 'humatol' ay malinaw at angkop sa marangal na rehistro.
- source_word: בֵּין שְׁנֵינוּ
  choice: sa ating dalawa
  rationale: Pinananatili ang tahasang diin ng Hebreo sa dalawang panig ng alitan.
theological_decisions:
- issue: Saklaw ng 'mga kapatid'
  choice: mga kapatid ko at mga kapatid mo
  alternative: mga kamag-anak ko at mga kamag-anak mo
  rationale: Hindi nilulutas nang tahasan ang posibleng mas malawak na gamit ng אַחַי/אַחֶיךָ; pinananatili ang leksikal na anyo ng pinagmulan habang nananatiling natural sa Tagalog.
- issue: Diwa ng וְיוֹכִיחוּ
  choice: humatol
  alternative: magpasya / mamagitan
  rationale: Pinananatili ang pormal na diwang hudisyal ng pandiwa nang hindi nagdaragdag ng espesipikong institusyon o doktrinal na pakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'kinapa mo nang husto' upang mapanatili ang pisikal na larawan ng masusing paghahanap, at 'ari-arian' upang masaklaw ang iba't ibang gamit at pag-aari.
