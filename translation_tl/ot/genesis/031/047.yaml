  text: Laban called it Jegar-sahadutha[b][a], but Jacob called it Galeed.
translation:
  language: tl
  text: Tinawag iyon ni Laban na Yegar-Sahaduta[a], ngunit tinawag naman iyon ni Jacob na Galeed.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Yegar-Sahaduta ay pangalan sa Aramaiko na nangangahulugang “bunton ng saksi” o “bunton ng patotoo.”
    reason: lexical_alternative
  - marker: b
    text: Ang Galeed ay pangalan sa Hebreo na nangangahulugang “bunton ng saksi” o “bunton ng patotoo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ לָבָן
  choice: Tinawag iyon ni Laban
  rationale: Ang קרא sa ganitong konteksto ay tumutukoy sa pagbibigay ng pangalan. Pinananatili ng “tinawag” ang payak na estilong pasalaysay, at ang “iyon” ay likas na tumutukoy sa bunton na kababanggit lamang.
- source_word: יְגַר שָׂהֲדוּתָא
  choice: Yegar-Sahaduta
  rationale: Isinalin sa baybay na malapit sa Aramaic upang mapanatili ang mismong pangalang ibinigay ni Laban; inilagay sa talababa ang kahulugan nito.
- source_word: וְיַעֲקֹב
  choice: ngunit … naman ni Jacob
  rationale: Bagaman maaaring payak na “at” ang וְ, ipinakikita rito ang pagkakaiba ng pangalang Aramaic ni Laban at pangalang Hebreo ni Jacob. Likas sa Filipino ang “ngunit … naman” para sa ganitong paghahambing.
- source_word: קָרָא לוֹ
  choice: tinawag naman iyon
  rationale: Inuulit ang pandiwa ng pagpapangalan at pinananatiling malinaw na iisang bunton ang tinutukoy.
- source_word: גַּלְעֵד
  choice: Galeed
  rationale: Pinananatili bilang transliteradong pangalang Hebreo upang makita ang magkatumbas na pagpapangalan sa dalawang wika; nasa talababa ang kahulugan.
theological_decisions: []
