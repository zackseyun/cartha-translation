  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָנֹכִ֤י הָ/אֵל֙ בֵּֽית אֵ֔ל אֲשֶׁ֨ר מָשַׁ֤חְתָּ שָּׁם֙ מַצֵּבָ֔ה אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛/י שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/שׁ֖וּב אֶל אֶ֥רֶץ מוֹלַדְתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/013.yaml
  text: I am the God of Bethel[a], where you anointed a pillar and where you vowed a vow to me. Now arise, go out from this land[b], and return to the land of your birth.
translation:
  language: tl
  text: “Ako ang Diyos ng Bethel[a], kung saan pinahiran mo ng langis ang isang haliging bato at kung saan gumawa ka ng panata sa akin. Ngayon, bumangon ka, umalis ka sa lupaing ito, at bumalik ka sa lupaing pinagmulan mo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Bethel” ay nangangahulugang “bahay ng Diyos,” ngunit pangalan ito ng lugar dito.
    reason: cultural_note
  - marker: b
    text: Ang “lupaing pinagmulan mo” ay maaari ring unawaing “lupain ng iyong kapanganakan” o “lupain ng iyong mga kamag-anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: ang Diyos
  rationale: Ang tiyak na pantukoy at ang tuwirang pananalita ng Diyos ay tumutukoy sa Diyos na nagpakilala kay Jacob, hindi sa isang di-tiyak na diyos.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Pangalan ito ng lugar. Pinanatili ang nakasanayang transliterasyon sa halip na isaling “Bahay ng Diyos.”
- source_word: מָשַׁחְתָּ ... מַצֵּבָה
  choice: pinahiran mo ng langis ang isang haliging bato
  rationale: Ipinahahayag nito sa natural na Tagalog ang konkretong pagpapahid/pagbubuhos ng langis sa itinayong batong alaala, ayon sa Genesis 28:18.
- source_word: נָדַרְתָּ לִּי ... נֶדֶר
  choice: gumawa ka ng panata sa akin
  rationale: Natural na Tagalog ito para sa Hebreong magkaugnay na pandiwa at pangngalan na literal na “nanata ng panata,” habang pinananatili na sa Diyos iniukol ang panata.
- source_word: עַתָּה קוּם
  choice: Ngayon, bumangon ka
  rationale: Ang “ngayon” ay naghuhudyat ng paglipat tungo sa utos; ang “bumangon ka” ay likas at malinaw na panimulang utos bago umalis.
- source_word: צֵא מִן הָאָרֶץ הַזֹּאת
  choice: umalis ka sa lupaing ito
  rationale: Sa konteksto ng paglalakbay, ang צֵא ay natural na “umalis,” at ang אֶרֶץ ay tumutukoy sa lupain o teritoryo, hindi sa buong daigdig.
- source_word: וְשׁוּב אֶל אֶרֶץ מוֹלַדְתֶּךָ
  choice: at bumalik ka sa lupaing pinagmulan mo
  rationale: Pinananatili ng “pinagmulan” ang saklaw ng מוֹלֶדֶת, na maaaring tumukoy sa sariling lupain o sa ugnayang pampamilya, nang hindi ito nililimitahan sa eksaktong lugar ng kapanganakan.
theological_decisions:
- issue: Pagpapakilala ng nagsasalita bilang הָאֵל בֵּית אֵל
  choice: Ako ang Diyos ng Bethel
  alternative: Ako ang Diyos sa Bethel
  rationale: Mas malamang na inuugnay ng konstruksyon ang nagsasalita sa dating pakikipagtagpo kay Jacob sa Bethel. Hindi nito inilalarawan ang Diyos bilang isa lamang lokal na diyos, at hindi rin dinaragdagan ang teksto ng paliwanag na wala rito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “haliging bato” upang maging malinaw ang konkretong bagay, at ang magkakasunod na pautos na “bumangon,” “umalis,” at “bumalik” upang mapanatili ang diin at galaw ng Hebreo.
