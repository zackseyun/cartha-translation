base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/041.yaml
  text: 'These twenty years I have been in your house: I served you fourteen years for your two daughters[a], and six years for your flock, and you changed my wages ten times.'
translation:
  language: tl
  text: Dalawampung taon akong nasa bahay mo[a]. Naglingkod ako sa iyo nang labing-apat na taon para sa dalawa mong anak na babae, at anim na taon para sa kawan mo. Sampung beses mong binago ang sahod ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa sambahayan mo.”
    reason: Maaaring tumukoy ang בַּיִת hindi lamang sa pisikal na bahay kundi sa buong sambahayan.
lexical_decisions:
- source_word: זֶה לִּי עֶשְׂרִים שָׁנָה
  choice: Dalawampung taon akong
  rationale: Inihahatid nito sa natural na Tagalog ang idyomatikong panandang tagal, habang pinananatili ang diin sa buong dalawampung taon ni Jacob.
- source_word: בְּבֵיתֶךָ
  choice: nasa bahay mo
  rationale: Pinananatili ang konkretong kahulugan ng בַּיִת na “bahay,” ngunit nilalagyan ng talababa ang posibleng mas malawak na diwang “sambahayan.”
- source_word: עֲבַדְתִּיךָ
  choice: Naglingkod ako sa iyo
  rationale: Sinasaklaw ng “naglingkod” kapwa ang paggawa at ang personal na paglilingkod ni Jacob kay Laban.
- source_word: אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ
  choice: nang labing-apat na taon para sa dalawa mong anak na babae
  rationale: Ang “para sa” ay malinaw at maikli, at nagpapahiwatig ng paglilingkod bilang kapalit sa pag-aasawa nang hindi nagdaragdag ng paliwanag sa teksto.
- source_word: וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ
  choice: at anim na taon para sa kawan mo
  rationale: Ang “kawan” ay kolektibong katawagan na maaaring sumaklaw sa mga tupa at kambing, gaya ng צֹאן.
- source_word: וַתַּחֲלֵף אֶת מַשְׂכֻּרְתִּי
  choice: binago ang sahod ko
  rationale: Direktang inilalarawan nito ang paulit-ulit na pagpapalit ni Laban sa kabayaran ni Jacob.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: sampung beses
  rationale: Ito ang natural na katumbas sa Tagalog ng Hebreong idyoma para sa sampung ulit o pagkakataon.
