  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “anak na babae” upang tiyak na maipakita ang kasarian ng בְנֹתֶיךָ, at “kawan” upang hindi paliitin sa mga tupa lamang ang צֹאן.
