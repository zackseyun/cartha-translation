  source_fidelity: 'Tumpak na naihahatid ng draft ang dalawang magkatapat na kondisyon: ang batik-batik o may guhit na hayop ang magiging sahod ni Jacob, at ang buong kawan ay nagluwal ng mga anak na may gayong marka. Gayunman, ang “ang buong kawan ay nagsilang” ay hindi gaanong likas sa Tagalog, dahil ang kawan bilang kolektibo ay hindi karaniwang ginagawang paksa ng “nagsilang.”'
