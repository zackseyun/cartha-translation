revisions:
- from: Kung sinabi niya, ‘Ang mga batik-batik ang magiging kabayaran mo,’ ang buong kawan ay nagsilang ng mga batik-batik. At kung sinabi niya, ‘Ang mga may guhit ang magiging kabayaran mo,’ ang buong kawan ay nagsilang ng mga may guhit.
  to: Kung sinabi niya, ‘Ang mga batik-batik ang magiging kabayaran mo,’ lahat ng hayop sa kawan ay nagsilang ng mga anak na batik-batik; at kung sinabi niya, ‘Ang mga may guhit ang magiging kabayaran mo,’ lahat ng hayop sa kawan ay nagsilang ng mga anak na may guhit.
  rationale: Inayos ang pananalita upang maging likas sa modernong Tagalog habang pinananatili ang pag-uulit, kondisyonal na estruktura, at saklaw na “lahat ng kawan” ng Hebreong teksto. Nilinaw lamang na ang isinilang ay mga anak ng mga hayop, na ipinahihiwatig na ng pandiwang “nagsilang.”
