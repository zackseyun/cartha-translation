  yaml_path: translation/ot/genesis/031/008.yaml
  text: If he said this, ‘The speckled will be your wages,’ then all the flock bore speckled young; and if he said this, ‘The streaked will be your wages,’ then all the flock bore streaked young.
translation:
  language: tl
  text: Kung sinabi niya, ‘Ang mga batik-batik ang magiging kabayaran mo,’ lahat ng hayop sa kawan ay nagsilang ng mga anak na batik-batik; at kung sinabi niya, ‘Ang mga may guhit ang magiging kabayaran mo,’ lahat ng hayop sa kawan ay nagsilang ng mga anak na may guhit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֻדִּים
  choice: mga batik-batik
  rationale: Tumutukoy sa mga hayop na may maliliit o kapansin-pansing batik; natural at malinaw ito sa modernong Tagalog.
- source_word: עֲקֻדִּים
  choice: mga may guhit
  rationale: Ipinapahayag ang markang parang banda o guhit sa mga hayop nang hindi dinaragdagan ang detalye ng Hebreo.
- source_word: שְׂכָרֶךָ
  choice: kabayaran mo
  rationale: Ang שָׂכָר dito ay bayad o kabayarang napagkasunduan para sa paggawa ni Jacob.
- source_word: וְיָלְדוּ
  choice: ay nagsilang
  rationale: Pinananatili ang literal na larawan ng panganganak ng kawan; nauunawaan sa konteksto na ang isinilang ay mga anak na hayop.
- source_word: כָל־הַצֹּאן
  choice: ang buong kawan
  rationale: Direktang katumbas na kolektibong pananalita at hindi kinakailangang ipahiwatig ang bawat hayop nang hiwalay.
theological_decisions: []
translation_notes:
  register: Gumamit ng payak ngunit marangal na modernong Tagalog. Pinanatili ang paulit-ulit na kondisyonal na ayos ng Hebreo at ang retorikal na pahayag na ‘ang buong kawan,’ nang hindi niluluwagan ang diin nito.
