  yaml_path: translation/ot/genesis/031/051.yaml
  text: Then Laban said to Jacob[a], “Look at this mound[b], and look at the pillar that I have set up between me and you.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Laban kay Jacob, “Tingnan mo ang bunton[a] na ito ng mga bato, at tingnan mo ang haliging bato[b] na inilagay ko sa pagitan nating dalawa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tambak.” Ang salitang Hebreo ay tumutukoy rito sa bunton ng mga batong itinambak bilang saksi sa pagitan nina Laban at Jacob.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “batong itinayo nang patayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa makabagong Tagalog ang “Pagkatapos ay sinabi” at napananatili nito ang pagkakasunod-sunod.
- source_word: הִנֵּה ... וְהִנֵּה
  choice: Tingnan mo ... at tingnan mo
  rationale: Ang inuulit na pantawag-pansin ay isinalin nang magkatulad upang mapanatili ang diin at paralelismo ng Hebreo.
- source_word: הַגַּל הַזֶּה
  choice: ang buntong ito ng mga bato
  rationale: Sa konteksto, ang גַּל ay isang bunton ng mga batong itinayo bilang saksi. Nililinaw ng “ng mga bato” ang tinutukoy nang hindi binabago ang kahulugan.
- source_word: הַמַּצֵּבָה
  choice: ang haliging bato
  rationale: Tumutukoy ang מַצֵּבָה sa isang batong itinayo nang patayo bilang tanda; malinaw at natural sa Tagalog ang “haliging bato.”
- source_word: יָרִיתִי
  choice: itinayo ko
  rationale: Bagaman maaari itong literal na magpahiwatig ng paghahagis o pagtitipon, sa ugnay nito sa מַצֵּבָה at sa konteksto ng tandang tipan, ang “itinayo ko” ang likas at angkop na salin.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: sa pagitan nating dalawa
  rationale: Likas na Tagalog ito para sa literal na “sa pagitan ko at mo” at malinaw na tumutukoy kina Laban at Jacob.
