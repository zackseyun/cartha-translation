  register: Makabago, malinaw, at marangal na Filipino. Iningatan ang pag-uulit ng הִנֵּה para sa diin, habang gumamit ng mga salitang madaling maunawaan ng karaniwang mambabasa. Inilagay ang mga panandang talababa sa mismong mga salitang tinatalakay.
