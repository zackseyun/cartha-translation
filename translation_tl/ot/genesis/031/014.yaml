  yaml_path: translation/ot/genesis/031/014.yaml
  text: Then Rachel and Leah answered and said to him[b][a], “Do we still have any share or inheritance in our father’s house?”
translation:
  language: tl
  text: Sumagot sina Raquel at Lea at sinabi sa kanya, “May bahagi at mana pa ba kami sa sambahayan ng aming ama?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sambahayan ng aming ama” ay maaaring tumukoy hindi lamang sa pisikal na bahay kundi pati sa pamilya at minanang ari-arian nito.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעַן
  choice: Sumagot
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Tagalog ang payak na “Sumagot” sa kontekstong ito.
- source_word: רָחֵל וְלֵאָה
  choice: sina Raquel at Lea
  rationale: Ginamit ang karaniwang anyong Tagalog ng mga pangalan at ang pantukoy na “sina” para sa dalawang tao.
- source_word: וַתֹּאמַרְנָה לוֹ
  choice: at sinabi sa kanya
  rationale: Pinananatili nito kapwa ang pandiwa ng pagsasalita at ang tahasang di-tuwirang layon na tumutukoy kay Jacob.
- source_word: הַעוֹד לָנוּ
  choice: May ... pa ba kami
  rationale: Likas na tanong sa Tagalog na pinananatili ang diwa ng patuloy o natitirang pag-aari na ipinahihiwatig ng הַעוֹד.
- source_word: חֵלֶק
  choice: bahagi
  rationale: Ang “bahagi” ay malinaw at likas na tumutukoy sa takdang parte sa ari-arian.
- source_word: וְנַחֲלָה
  choice: at mana
  rationale: Ang “mana” ang karaniwang salitang Tagalog para sa minanang ari-arian o karapatang namamana.
- source_word: בְּבֵית אָבִינוּ
  choice: sa sambahayan ng aming ama
  rationale: Sinasaklaw ng “sambahayan” ang higit sa pisikal na bahay—ang pamilya at saklaw ng ari-arian—nang hindi nililimitahan ang kahulugan sa gusali lamang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang pares na “bahagi at mana” upang katawanin ang dalawang magkaibang terminong Hebreo, at iniwasang ipakahulugan nang labis ang retorikal na tanong.
