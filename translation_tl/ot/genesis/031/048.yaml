  yaml_path: translation/ot/genesis/031/048.yaml
  text: And Laban said[a], “This heap is a witness between me and you today.” Therefore he called its name Galeed.
translation:
  language: tl
  text: Sinabi ni Laban, “Ang bunton na ito ay saksi sa pagitan nating dalawa ngayon.” Kaya pinangalanan niya itong Galeed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Galeed” ay katunog ng mga salitang Hebreo na nangangahulugang “bunton ng saksi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na pagsasalaysay ito sa modernong Tagalog at ipinagpapatuloy ang pagkakasunod-sunod ng salaysay nang hindi dinaragdagan ang temporal na diwa.
- source_word: לָבָן
  choice: Laban
  rationale: Isinalin-titik ang pangalang pantangi ayon sa karaniwang anyo nito sa Tagalog.
- source_word: הַגַּל הַזֶּה
  choice: ang bunton na ito
  rationale: Ang גַּל ay tumutukoy rito sa bunton ng mga bato; malinaw at karaniwan sa Tagalog ang “bunton.”
- source_word: עֵד
  choice: saksi
  rationale: Ipinakikita ng salita na ang bunton ay nagsisilbing tagapagpatunay sa kasunduan ng dalawang panig.
- source_word: בֵּינִי וּבֵינְךָ
  choice: sa pagitan nating dalawa
  rationale: Natural itong Tagalog na nagpapanatili sa tuwirang pagtukoy sa dalawang panig, bagaman hindi inuulit ang literal na “ako at ikaw.”
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Ito ang malinaw at makabagong katumbas ng temporal na pahayag na “sa araw na ito.”
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Malinaw nitong ipinahahayag ang ugnayang sanhi at bunga sa paliwanag ng pagpapangalan.
- source_word: קָרָא שְׁמוֹ
  choice: pinangalanan niya itong
  rationale: Natural na pormula ito ng pagpapangalan sa Tagalog at pinananatili ang isahang panlalaking simuno ng pandiwa, na tumutukoy kay Laban.
- source_word: גַּלְעֵד
  choice: Galeed
  rationale: Isinalin-titik ang pangalan sa pangunahing teksto; ipinaliliwanag sa talababa ang paglalaro sa kahulugan ng pangalan.
