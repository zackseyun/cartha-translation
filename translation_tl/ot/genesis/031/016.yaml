  yaml_path: translation/ot/genesis/031/016.yaml
  text: For all the wealth that God has taken from our father belongs to us and to our children. So now[a], whatever God has said to you, do.
translation:
  language: tl
  text: Sapagkat ang lahat ng kayamanang kinuha ng Diyos mula sa aming ama ay para sa amin at sa aming mga anak. Kaya ngayon, gawin mo ang lahat ng sinabi sa iyo ng Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag ng magkapatid kung bakit sila sumasang-ayon kay Jacob; likas at marangal ang “Sapagkat” sa daloy ng Filipino.
- source_word: כָל הָעֹשֶׁר
  choice: ang lahat ng kayamanan
  rationale: Ang עֹשֶׁר ay kayamanan o mga ari-arian; saklaw ng “kayamanan” ang mga hayop at materyal na pag-aari sa konteksto.
- source_word: הִצִּיל
  choice: iniligtas
  rationale: Pinananatili nito ang karaniwang diwa ng Hiphil ng נצל na “iligtas” o “hanguin,” habang nililinaw ng pariralang “mula sa aming ama” ang pag-aalis ng kayamanan mula kay Laban. Isinasaad sa talababa ang kontekstuwal na alternatibo.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang salin kapag tumutukoy sa tunay na Diyos sa salaysay.
- source_word: מֵאָבִינוּ
  choice: mula sa aming ama
  rationale: Ang מן ay nagmamarka ng pinagmulan; payak at malinaw ang salin.
- source_word: לָנוּ הוּא וּלְבָנֵינוּ
  choice: ay para sa amin at sa aming mga anak
  rationale: Pinananatili ng “para sa” ang anyong may לְ at ang diwa ng pag-aari o karampatang pakinabang nang hindi labis na pinatitindi ang legal na pagmamay-ari.
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Natural na inililipat nito ang katuwiran tungo sa panghuling tagubilin at ipinahihiwatig ang bunga ng naunang pahayag.
- source_word: כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ
  choice: ang lahat ng sinabi sa iyo ng Diyos
  rationale: Tapat sa kabuuang saklaw ng כֹּל אֲשֶׁר at natural sa modernong Filipino.
- source_word: עֲשֵׂה
  choice: gawin mo
  rationale: Tuwirang pautos na tumutugma sa maikli at mariing imperatibo ng Hebreo.
theological_decisions:
- issue: Ang pagkilos ng Diyos kaugnay ng kayamanan ni Laban
  choice: “iniligtas” sa pangunahing teksto, na may talababa para sa “kinuha” o “inialis”
  alternative: “kinuha” / “inialis”
  rationale: Karaniwang taglay ng הִצִּיל ang diwang pagliligtas o paghango, ngunit sa konteksto ay kayamanan ang inilalayo mula kay Laban at napupunta sa sambahayan ni Jacob. Pinananatili ng pangunahing salin at talababa ang tunay na leksikal at kontekstuwal na tensiyon nang hindi ipinahihiwatig na nagnakaw ang Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “aming ama” dahil sina Raquel at Lea ang nagsasalita, at “gawin mo” dahil kay Jacob nakatuon ang panlalaking isahang pautos.
