  source_fidelity: 'Ang pangunahing saling “iniligtas ... mula sa aming ama” ay hindi angkop sa kontekstuwal na gamit ng הִצִּיל: ang kayamanan ang simuno/layon na inaalis mula kay Laban, hindi isang bagay na inililigtas mula sa panganib. Mas tapat at malinaw ang “kinuha ... mula sa aming ama,” habang pinananatili sa talababa ang karaniwang diwang “iniligtas/hinango.” Napananatili rin ang saklaw ng “lahat,” ang pagmamay-ari/karapatan ng mga nagsasalita at kanilang mga anak, at ang tuwirang utos kay Jacob.'
  naturalness: Natural at marangal sa makabagong Filipino ang “ang lahat ng kayamanang kinuha ng Diyos mula sa aming ama.” Ang “Kaya ngayon” ay maayos na transisyon, at ang “gawin mo ang lahat ng sinabi sa iyo ng Diyos” ay malinaw at tuwiran.
  terminology: Ang “Diyos,” “kayamanan,” “aming ama,” at “aming mga anak” ay wasto at pare-pareho sa salaysay. Ginagamit ang “kinuha” sa pangunahing teksto bilang kontekstuwal na salin, hindi bilang pahayag na ang Diyos ay nagnakaw; nililinaw ng talababa ang leksikal na alternatibo.
  issues:
