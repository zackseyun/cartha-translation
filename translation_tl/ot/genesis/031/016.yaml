    issue: Ang “iniligtas” bilang pangunahing salin ng הִצִּיל ay nakaliligaw sa pangungusap.
    rationale: Sa talata, ang Diyos ang nag-alis o kumuha ng kayamanan mula kay Laban tungo sa sambahayan ni Jacob. Sa Filipino, “kayamanang iniligtas mula sa aming ama” ay karaniwang nagpapahiwatig na ang kayamanan ay sinagip mula sa ama, na hindi ang nilalayong diwa ng konteksto.
  revised_text: Sapagkat ang lahat ng kayamanang kinuha ng Diyos mula sa aming ama ay para sa amin at sa aming mga anak. Kaya ngayon, gawin mo ang lahat ng sinabi sa iyo ng Diyos.
