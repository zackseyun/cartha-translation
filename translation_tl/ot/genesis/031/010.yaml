base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/010.yaml
  text: And it happened at the time when the flock was mating that I lifted up my eyes and saw in a dream[a], and behold, the male goats that were mounting the flock were striped, speckled[b], and mottled.
translation:
  language: tl
  text: 'Noong panahong nag-iinit ang kawan, tumingala ako at nakita ko sa panaginip: naroon ang mga lalaking kambing na kumakasta sa mga hayop sa kawan—may guhit[a], batik-batik, at may sari-saring kulay[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “may mga bandang marka.” Ang salitang Hebreo ay tumutukoy sa mga markang hugis banda o guhit sa katawan ng hayop.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sari-sari ang batik.” Malamang na inilalarawan ng tatlong terminong Hebreo ang magkakaibang disenyo ng kulay sa balahibo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Nang panahon
  rationale: Pinagsama ang pormulang pasalaysay at ang pariralang pamanahon sa isang likas na pambungad sa Tagalog, nang hindi ginagawang arkaiko ang pangungusap.
- source_word: יַחֵם הַצֹּאן
  choice: pag-aasawahan ng kawan
  rationale: Tumutukoy ang pandiwa sa init at pagsasama ng mga hayop para magparami. Malinaw ang 'pag-aasawahan' sa kontekstong ito at hindi nito ipinapalagay na naglihi na ang mga hayop.
- source_word: וָאֶשָּׂא עֵינַי
  choice: tumingala ako
  rationale: Likas na katumbas sa modernong Tagalog ng idyomang Hebreo na literal na 'itinaas ko ang aking mga mata.'
- source_word: וָאֵרֶא בַּחֲלוֹם
  choice: nakita ko sa panaginip
  rationale: Pinananatili nitong ang panaginip ang paraan o kalagayan ng pagkakita, nang hindi labis na tinutukoy kung aling panaginip iyon.
- source_word: וְהִנֵּה
  choice: naroon
  rationale: Ipinakikita ang bigla at matingkad na pagharap sa nakita sa pangitain, sa paraang natural sa Tagalog.
- source_word: הָעַתֻּדִים
  choice: mga lalaking kambing
  rationale: Tiyak at madaling maunawaan; tumutukoy ito sa mga kambing na lalaki na ginagamit sa pagpaparami.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: na sumasampa sa kawan
  rationale: Pinananatili ang kongkretong paglalarawan sa kilos ng pagpaparami nang hindi ito pinapalabo bilang pangkalahatang 'nakikipagtalik.'
- source_word: עֲקֻדִּים
  choice: may guhit
  rationale: Naghahayag ng mga markang tila banda o guhit at madaling maunawaan ng karaniwang mambabasa.
- source_word: נְקֻדִּים
  choice: batik-batik
  rationale: Naghahayag ng maliliit o hiwa-hiwalay na batik at naihihiwalay sa iba pang uri ng marka.
- source_word: וּבְרֻדִּים
  choice: halu-halo ang kulay
  rationale: Ipinahihiwatig ang sari-sari o di-pantay na pagkakahalo ng kulay, bilang ikatlong uring naiiba sa may guhit at batik-batik.
