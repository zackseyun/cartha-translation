translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang 'kawan' bilang panlahat na tawag sa pangkat ng mga alagang hayop at ang 'pag-aasawahan' para sa konteksto ng pagpaparami. Inilagay ang mga talababa sa mismong mga terminong tinatalakay, sa halip na sundin ang hindi tugmang puwesto ng unang marker sa English consultation layer.
