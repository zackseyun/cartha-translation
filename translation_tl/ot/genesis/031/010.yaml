    rationale: Ang בְּעֵת יַחֵם הַצֹּאן ay panahon kung kailan nag-iinit ang kawan para magparami. Ang binagong pahayag ay mas tuwiran at idiomatiko sa modernong Tagalog.
  - severity: medium
    issue: Malabo ang “mga lalaking kambing na sumasampa sa kawan.”
    rationale: Ang עֹלִים עַל ay paglalarawan/eupemismo ng pagkakasta. Kailangang ipakita sa Tagalog na ang pagkilos ay sa mga hayop sa kawan, hindi simpleng pagsampa sa isang pangkat.
