  text: וַ/יֹּ֨אמֶר אֵלַ֜/י מַלְאַ֧ךְ הָ/אֱלֹהִ֛ים בַּ/חֲל֖וֹם יַֽעֲקֹ֑ב וָ/אֹמַ֖ר הִנֵּֽנִ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/011.yaml
  text: Then the angel of God said to me in the dream[a], ‘Jacob,’ and I said, ‘Here I am.’
translation:
  language: tl
  text: Pagkatapos, sinabi sa akin ng anghel ng Diyos sa panaginip[a], “Jacob!” At sinabi ko, “Narito ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “sa isang panaginip.” May tiyak na pantukoy sa Hebreo: “sa panaginip.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ang wayyiqtol ng אמר ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos, sinabi” at malinaw nitong ipinapakita ang pagkakasunod-sunod.
- source_word: אֵלַי
  choice: sa akin
  rationale: Tuwirang katumbas ng pang-ukol na may hulaping unang panauhang isahan.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: anghel ng Diyos
  rationale: Bagaman maaaring mangahulugang “mensahero” ang מַלְאָךְ, isang makalangit na nilalang ang tinutukoy sa kontekstong ito. Pinananatili ng “anghel ng Diyos” ang katawagan ng teksto nang hindi nilulutas ang mas malawak na tanong tungkol sa kaniyang pagkakakilanlan.
- source_word: בַּחֲלוֹם
  choice: sa panaginip
  rationale: Natural itong salin sa Tagalog. May tiyak na pantukoy ang pariralang Hebreo, ngunit hindi karaniwang minamarkahan sa Tagalog ang pagkakaiba ng “the dream” at “a dream” sa pariralang ito.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Ginamit ang karaniwang anyo ng pangalan sa Tagalog na tradisyon ng Biblia.
- source_word: וָאֹמַר
  choice: At sinabi ko
  rationale: Pinananatili nito ang payak na kasunod na tugon sa salaysay.
- source_word: הִנְנִי
  choice: Narito ako
  rationale: Ito ang natural at kinikilalang katumbas sa Tagalog ng pormulang Hebreo ng agarang pagtugon o paghaharap ng sarili.
theological_decisions:
- issue: Ang pagkakakilanlan ng מַלְאַךְ הָאֱלֹהִים sa kontekstong maaaring mag-ugnay sa anghel at sa Diyos
  choice: anghel ng Diyos
  alternative: mensahero ng Diyos
  rationale: Tinatawag lamang siya ng talata na “anghel ng Diyos.” Hindi pinalalakas o nilulutas ng salin ang teolohikal na tensiyon tungkol sa kaniyang eksaktong pagkakakilanlan.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “Pagkatapos” upang likas na maipahayag ang pag-usad ng salaysay, at “Narito ako” para sa pormal ngunit madaling maunawaang tugon.
