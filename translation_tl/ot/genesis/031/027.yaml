base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/027.yaml
  text: Why did you hide yourself to flee and steal away from me[a], and not tell me, so that I might have sent you away with joy and with songs[d][c][b], with tambourine and lyre?
translation:
  language: tl
  text: Bakit ka nagtago upang tumakas at palihim na lumayo sa akin[a], at hindi mo sinabi sa akin, upang maihatid sana kita nang may kagalakan at mga awit[b], na may tamburin[c] at lira[d]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “at ninakaw mo ako.” Sa Hebreo, idyoma ito para sa palihim na pag-alis mula sa isang tao.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pag-awit.”
    reason: lexical_alternative
  - marker: c
    text: Tradisyonal na “pandereta”; maaari ring tumukoy sa maliit na tambol na hinahawakan sa kamay.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “alpa,” bagaman mas tiyak na tumutukoy ang salitang Hebreo sa isang instrumentong tulad ng lira.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Bakit
  rationale: Likas at tuwirang tanong sa dahilan sa makabagong Tagalog.
- source_word: נַחְבֵּאתָ לִבְרֹחַ
  choice: ka nagtago para tumakas
  rationale: Pinananatili ang reflexive na diwa ng Nifal na ‘nagtago’ at ang malinaw na layunin ng infinitive na ‘tumakas.’
- source_word: וַתִּגְנֹב אֹתִי
  choice: at palihim na lumayo sa akin
  rationale: Ang literal na ‘ninakaw mo ako’ ay isang idyomang Hebreo para sa lihim na pag-alis nang hindi namamalayan ng isang tao. Inihahatid ng salin ang kahulugan habang ipinapaliwanag sa talababa ang tayutay ng orihinal.
- source_word: וְלֹא הִגַּדְתָּ לִּי
  choice: Bakit hindi mo sinabi sa akin?
  rationale: Tuwirang salin ng Hifil ng נגד; ang paghahati bilang ikalawang tanong ay natural sa Tagalog at pinananatili ang mapanumbat na tono.
- source_word: וָאֲשַׁלֵּחֲךָ
  choice: Napahayo sana kita
  rationale: Ipinahahayag ang hindi natupad na posibilidad na mapayaong maayos si Jacob, nang hindi ipinahihiwatig na itinaboy o sapilitang pinaalis siya.
- source_word: בְּשִׂמְחָה
  choice: nang may kagalakan
  rationale: Likas at marangal na katumbas ng pangngalang tumutukoy sa masayang pagpapaalam.
- source_word: וּבְשִׁרִים
  choice: at mga awit
  rationale: Pinananatili ang pangmaramihang anyo at ang kaugnayan nito sa kasunod na mga instrumentong pangmusika.
- source_word: בְּתֹף
  choice: na may tamburin
  rationale: Makabagong katawagan sa maliit na tambol na tinutukoy ng תֹף; mas madaling maunawaan kaysa sa makalumang ‘pandereta’ sa ilang gamit.
- source_word: וּבְכִנּוֹר
  choice: at lira
  rationale: Mas tiyak na tumutukoy sa uring instrumentong de-kuwerdas kaysa sa pangkalahatang ‘alpa.’
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang mapanumbat na himig ni Laban at ang magkakasunod na kilos ng pagtatago, pagtakas, at palihim na paglayo. Ginamit ang bahagyang mas pormal na ‘napahayo’ upang maiwasan ang sapilitang dating ng ‘pinaalis.’
