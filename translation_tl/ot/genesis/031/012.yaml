  to: 'At sinabi niya, “Pakitingala ka at tingnan mo: lahat ng lalaking kambing na nakikipares sa mga hayop sa kawan ay may mga guhit, batik-batik, at sari-saring marka[a], sapagkat nakita ko ang lahat ng ginagawa sa iyo ni Laban.”'
