  naturalness: Malinaw ang kabuuan, ngunit mas natural ang “Pakitingala ka,” at ang “sari-saring batik” ay bahagyang paulit-ulit at hindi kasinglinaw ng mas malawak na “sari-saring marka.” Ang pagdaragdag ng “mga hayop sa” bago ang “kawan” ay nagpapalinaw na ang mga lalaking kambing ay nakikipares sa mga hayop ng kawan.
  terminology: Ang “lalaking kambing,” “nakikipares,” “mga guhit,” at “batik-batik” ay angkop sa modernong Filipino Tagalog. Ginamit ang “sari-saring marka” para sa huling terminong Hebreo upang hindi magpanggap ng eksaktong pisikal na pagkakaiba na pinagtatalunan pa rin.
