base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/012.yaml
  text: 'And he said[a], “Please lift up your eyes and see: all the male goats that are mating with the flock are striped, speckled, and spotted[b], for I have seen all that Laban is doing to you.”'
translation:
  language: tl
  text: 'At sinabi niya, “Pakitingala ka at tingnan mo: lahat ng lalaking kambing na nakikipares sa mga hayop sa kawan ay may mga guhit, batik-batik, at sari-saring marka[a], sapagkat nakita ko ang lahat ng ginagawa sa iyo ni Laban.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tatlong salitang Hebreo ay naglalarawan ng magkakaibang mga marka sa balahibo, ngunit hindi tiyak ang eksaktong pagkakaiba ng mga ito. Ang una ay maaari ring isaling “may mga banda,” at ang ikatlo ay maaaring tumukoy sa batik-batik o tagpi-tagpi na kulay.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Pakitingala
  rationale: Likas na modernong Tagalog para sa idyomang ‘itaas ang iyong mga mata’; naipahahayag ng ‘paki-’ ang magalang na puwersa ng נָא.
- source_word: וּרְאֵה
  choice: at tingnan mo
  rationale: Pinananatili ang tahasang utos at ang diin sa nakikita sa pangitain.
- source_word: הָעַתֻּדִים
  choice: mga lalaking kambing
  rationale: Malinaw at pangkaraniwang tawag sa mga barakong kambing; iniiwasan ang ‘lalaking tupa,’ na ibang hayop.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: na nakikipares sa kawan
  rationale: Natural at mahinahong salin ng idyomang Hebreo tungkol sa pag-akyat o pagsampa ng hayop para magparami.
- source_word: עֲקֻדִּים
  choice: may mga guhit
  rationale: Naghahatid ng kahulugang may banda o guhit sa malinaw na modernong Tagalog.
- source_word: נְקֻדִּים
  choice: batik-batik
  rationale: Ang salita ay tumutukoy sa maliliit at maraming batik; ang pag-uulit ay natural sa Tagalog.
- source_word: וּבְרֻדִּים
  choice: sari-saring batik
  rationale: Ipinakikita ang pabagu-bago o malalaking markang naiiba sa maliliit na batik ng נְקֻדִּים; inilalagay sa talababa ang posibleng alternatibo dahil hindi tiyak ang eksaktong anyo ng marka.
- source_word: כִּי רָאִיתִי
  choice: sapagkat nakita ko
  rationale: Pinananatili ang sanhi na ipinahahayag ng כִּי at ang ganap na anyo ng pandiwa.
- source_word: אֵת כָּל אֲשֶׁר לָבָן עֹשֶׂה לָּךְ
  choice: ang lahat ng ginagawa sa iyo ni Laban
  rationale: Ang kasalukuyang kilos ng participle ay likas na naihahayag ng ‘ginagawa’; ang ‘sa iyo’ ay nagpapahiwatig ng pagtrato ni Laban kay Jacob.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ngunit madaling maunawaan. Ginamit ang ‘nakikipares’ bilang malinaw ngunit hindi magaspang na katawagan sa pagpaparami ng mga hayop. Iningatan sa talababa ang kawalang-katiyakan sa tatlong terminong tumutukoy sa mga marka.
