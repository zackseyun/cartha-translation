translation:
  language: tl
  text: At kayo mismo ang nakaaalam na buong lakas kong pinaglingkuran ang inyong ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagtrabaho ako para sa inyong ama.” Ang pandiwang Hebreo ay maaaring mangahulugang “maglingkod” o “magtrabaho,” at kapuwa ay angkop sa mga taon ng paggawa ni Jacob sa ilalim ni Laban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֵּנָה
  choice: At alam ninyo mismo
  rationale: Ang וְ ay payak na pang-ugnay na “At,” at ang hiwalay na panghalip na pambabaeng maramihan ay nagbibigay-diin sa kausap na sina Raquel at Lea; natural itong naipapahayag sa Filipino sa pamamagitan ng “ninyo mismo.”
- source_word: יְדַעְתֶּן
  choice: alam ninyo
  rationale: Ang Qal perfect na ikalawang panauhang pambabaeng maramihan ng ידע ay tumutukoy rito sa umiiral na kaalamang bunga ng kanilang karanasan; natural sa modernong Tagalog ang “alam ninyo.”
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng nalalaman nila, kaya ang pang-ugnay na “na” ang likas na katumbas sa Tagalog.
- source_word: בְּכָל־כֹּחִי
  choice: nang buong lakas ko
  rationale: Ang כֹּחַ ay lakas, kapangyarihan, o kakayahan; sa konteksto ng paggawa, malinaw at natural ang “nang buong lakas ko” para sa ganap na pagsisikap.
- source_word: עָבַדְתִּי
  choice: pinaglingkuran ko
  rationale: Maaaring mangahulugan ang עבד ng maglingkod o magtrabaho. Dahil tao ang tuwirang layon, pinananatili ng “pinaglingkuran ko” ang relasyonal na diwa habang ipinahihiwatig pa rin ang paggawa.
- source_word: אֶת־אֲבִיכֶן
  choice: ang inyong ama
  rationale: Ang אֶת ay pananda ng tiyak na tuwirang layon at hindi kailangang isalin nang hiwalay; ang hulaping pambabaeng maramihan ay likas na naihahayag bilang “inyong” sa marangal at dignified na Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ninyo mismo” upang mapanatili ang diin ng tahasang pambabaeng maramihang panghalip sa Hebreo, bagaman walang markang pambabae ang panghalip sa Tagalog. Inilagay ang talababa pagkatapos ng buong pangungusap at tiniyak na lumilitaw ang marker na [a] sa pangunahing teksto.
