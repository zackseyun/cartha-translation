review_pass:
  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang pang-ugnay, ang mariing pagtukoy sa dalawang kausap, ang nilalaman ng kanilang nalalaman, ang ganap na pagsisikap ni Jacob, at ang kaniyang paglilingkod sa kanilang ama. Ang alternatibong 'magtrabaho para sa' sa talababa ay lehitimo rin para sa עָבַד.
  naturalness: Ang 'alam ninyo mismo' ay nauunawaan ngunit medyo hindi likas bilang paraan ng pagmamarka ng mariing panghalip. Mas malinaw at idiomatiko ang 'kayo mismo ang nakaaalam.' Mas natural ding ilagay ang 'buong lakas kong' bago ang pandiwa upang tuwirang ikabit ito sa paglilingkod.
  terminology: Ang 'pinaglingkuran' ay angkop at marangal para sa עָבַד sa relasyong ito; hindi nito inaalis ang aspektong paggawa, na maayos na naitatala sa talababa. Ang 'inyong ama' ay wastong katumbas ng אֲבִיכֶן.
  issues:
  - severity: low
    issue: Di-ganap na idiomatiko ang paglalagay ng diin sa 'alam ninyo mismo.'
    rationale: Ang malayang panghalip na pambabaeng maramihan sa Hebreo ay nagbibigay-diin sa mga kausap. Sa modernong Filipino, mas malinaw na naipapahayag ito ng 'kayo mismo ang nakaaalam' kaysa sa 'alam ninyo mismo,' na maaaring magtunog na ang diin ay nasa paraan ng pag-alam.
  - severity: low
    issue: Mas natural ang ayos ng pariralang nagsasaad ng buong pagsisikap.
    rationale: Ang 'buong lakas kong pinaglingkuran' ay mas tuwirang ikinakabit ang 'buong lakas' sa pandiwang 'pinaglingkuran' kaysa sa hulihang 'nang buong lakas ko.'
