base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/022.yaml
  text: On the third day[a], Laban was told that Jacob had fled.
translation:
  language: tl
  text: Nang ikatlong araw, ibinalita kay Laban na tumakas si Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: ibinalita
  rationale: Ang Hophal na anyo ng נגד ay nagpapahayag na ipinaabot ang impormasyon. Ang “ibinalita kay Laban” ay likas sa modernong Tagalog at hindi nagdaragdag ng hindi tinukoy na tagapagbalita.
- source_word: לְלָבָן
  choice: kay Laban
  rationale: Minamarkahan ng ל ang tumanggap ng balita; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “kay.”
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Nang ikatlong araw
  rationale: Tuwirang pinananatili ang temporal na parirala nang hindi idinaragdag ang “pagkatapos noon,” na hindi tahasang nasa Hebreo.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng ibinalita, kaya ang pang-ugnay na “na” ang natural na katumbas.
- source_word: בָרַח
  choice: tumakas
  rationale: Ang ברח ay nangangahulugang tumakas o lumayo sa pamamagitan ng pagtakas. Ang “tumakas” ay maikli, malinaw, at angkop sa konteksto.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa modernong Bibliyang Tagalog.
