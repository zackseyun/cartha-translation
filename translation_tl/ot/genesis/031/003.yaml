  yaml_path: translation/ot/genesis/031/003.yaml
  text: Then Yahweh said to Jacob[a], “Return to the land of your fathers and to your kindred, and I will be with you.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Yahweh kay Jacob, “Bumalik ka sa lupain ng iyong mga ninuno at sa iyong mga kamag-anak[a], at sasamahan kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa iyong lupang pinagmulan.” Ang salitang Hebreo ay maaaring tumukoy sa mga kaanak o angkan, o sa lugar na pinagmulan, gaya ng sariling bayan o lupang sinilangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay; likas na naipapahayag ito sa modernong Tagalog sa pamamagitan ng “Pagkatapos ay sinabi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang personal na pangalang יהוה sa transliterasyong “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: שׁוּב
  choice: Bumalik ka
  rationale: Ang pandiwang pautos ay nangangahulugang bumalik; kailangan ang “ka” sa natural na Tagalog upang malinaw na si Jacob ang kinakausap.
- source_word: אֶל אֶרֶץ אֲבוֹתֶיךָ
  choice: sa lupain ng iyong mga ninuno
  rationale: Ang “mga ninuno” ay natural at malinaw sa kasalukuyang Tagalog at angkop na tumutukoy sa mga naunang salinlahi ng pamilya na saklaw ng Hebrew na אבות.
- source_word: מוֹלַדְתֶּךָ
  choice: sa iyong mga kamag-anak[a]
  rationale: Maaaring tumukoy ang מוֹלֶדֶת sa angkan o mga kaanak, gayundin sa lugar na pinagmulan. Pinili rito ang relasyonal na diwa, ngunit pinanatili sa talababa ang tunay na leksikal na kalabuan.
- source_word: וְאֶהְיֶה עִמָּךְ
  choice: at ako ay makakasama mo
  rationale: Natural nitong ipinahahayag sa Tagalog ang pangako ng presensiya ng Diyos nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebrew, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “Panginoon.”
- issue: Uri ng pangako sa וְאֶהְיֶה עִמָּךְ
  choice: at ako ay makakasama mo
  alternative: at sasamahan kita
  rationale: Mas malapit ang pinili sa literal na “ako ay magiging kasama mo” at pinananatili ang diin sa presensiya ng Diyos, samantalang ang “sasamahan kita” ay maaaring magbigay ng bahagyang mas aktibong diwa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Iniwasan ang lipas na “sasaiyo” habang pinanatili ang tuwirang pangako ng presensiya ng Diyos.
