  text: So Jacob sent and called Rachel and Leah to the field[a], to his flock[b],
translation:
  language: tl
  text: Kaya nagsugo si Jacob at ipinatawag sina Raquel at Lea sa bukid, kung nasaan ang kanyang kawan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa bukid, sa kanyang kawan.” Malamang na nililinaw ng huling parirala kung saang bahagi ng bukid sila ipinatawag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Tuwirang ipinapahayag ng שׁלח ang pagpapadala o pagsusugo ni Jacob; hindi tinutukoy sa Hebreo kung sino ang isinugo.
- source_word: וַיִּקְרָא לְרָחֵל וּלְלֵאָה
  choice: ipinatawag sina Raquel at Lea
  rationale: Ang קרא na may לְ at mga tao bilang layon ay nangangahulugang ipatawag o papuntahin sila. Likas at malinaw sa modernong Tagalog ang “ipinatawag.”
- source_word: הַשָּׂדֶה
  choice: sa bukid
  rationale: Ang שׂדה ay bukid o lantad na lupain; ipinahihiwatig rito ang lugar na pupuntahan.
- source_word: אֶל צֹאנוֹ
  choice: kung nasaan ang kanyang kawan
  rationale: Maaaring literal na “patungo sa kanyang kawan,” ngunit malamang na nililinaw ng parirala ang tiyak na lugar sa bukid. Ang salin ay natural habang pinananatili sa talababa ang mas pormal na pagbasa.
