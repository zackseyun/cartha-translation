base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/007.yaml
  text: Yet your father has deceived me and changed my wages ten times[c][b][a], but God did not allow him to harm me.
translation:
  language: tl
  text: Ngunit dinaya ako ng inyong ama at sampung ulit niyang binago ang aking sahod,[a] pero hindi siya pinahintulutan ng Diyos na pinsalain ako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sampung ulit,” isang pananalitang maaaring mangahulugang paulit-ulit at hindi kinakailangang eksaktong sampu.
    reason: cultural_note
  - marker: b
    text: Literal, “hindi siya binigyan ng Diyos upang pinsalain ako”; ibig sabihin, hindi siya pinahintulutan ng Diyos na gawan ako ng masama.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתֶל
  choice: dinaya ako
  rationale: Ang Hiphil ng התל ay maaaring tumukoy sa mapanlinlang o mapangutyang pakikitungo. Sa konteksto ng paulit-ulit na pagbabago sa sahod ni Jacob, malinaw at natural na ipinahahayag ng “dinaya ako” ang mapanlinlang na pagtrato nang hindi inaalis ang saklaw ng pandiwa.
- source_word: וְהֶחֱלִיף
  choice: binago
  rationale: Ang Hiphil ng חלף dito ay tumutukoy sa pagpapalit o pagbabago sa napagkasunduang kabayaran. Ang “binago” ang pinakanatural sa konteksto ng trabaho.
- source_word: מַשְׂכֻּרְתִּי
  choice: aking sahod
  rationale: Ang pangngalan ay tumutukoy sa kabayaran para sa paggawa. Ang “sahod” ay karaniwan, malinaw, at angkop sa modernong Filipino.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: sampung ulit
  rationale: Literal itong “sampung beses/ulit” at maaaring isang idyomatikong pahayag para sa paulit-ulit na pagbabago, hindi kinakailangang eksaktong bilang.
- source_word: וְלֹא נְתָנוֹ אֱלֹהִים
  choice: hindi siya pinahintulutan ng Diyos
  rationale: Literal na “hindi siya ibinigay ng Diyos,” na sa konteksto ay nangangahulugang hindi siya binigyan ng pahintulot o pagkakataong gawin ang kasunod na pinsala.
- source_word: לְהָרַע עִמָּדִי
  choice: na pinsalain ako
  rationale: Ang רעע na may עִם ay nangangahulugang gumawa ng masama laban sa isang tao o pinsalain siya. Maikli at natural ang “pinsalain ako.”
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tumutukoy ito sa Diyos sa pananalita ni Jacob, kaya ang karaniwang “Diyos” ang angkop.
theological_decisions:
- issue: Pagpigil ng Diyos na ipinahahayag ng idyomang “hindi siya ibinigay ng Diyos”
  choice: Hindi pinahintulutan ng Diyos ang ama nilang pinsalain si Jacob
  alternative: Hindi hinayaan ng Diyos na magtagumpay siya sa pagpinsala kay Jacob
  rationale: Pinananatili ng salin ang aktibong pagpigil ng Diyos ngunit hindi nito tinutukoy nang higit sa teksto kung ito ay pagkakait ng pahintulot, pagkakataon, o tagumpay.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “inyong ama” dahil maramihan ang kausap ni Jacob, at “dinaya” upang akma sa tiyak na konteksto ng mapanlinlang na pagbabago sa sahod. Inilagay ang mga talababa kaagad pagkatapos ng kaugnay na parirala.
