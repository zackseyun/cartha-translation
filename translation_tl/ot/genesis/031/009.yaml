  source_fidelity: 'Tumpak na isinasalin ng “Kaya kinuha ng Diyos ang mga alagang hayop ng inyong ama at ibinigay sa akin” ang dalawang kilos na iniuugnay sa Diyos: pag-alis/pagkuha ng kawan mula sa ama nina Raquel at Lea at pagbibigay nito kay Jacob. Ang di-tahasang pag-uulit ng layon pagkatapos ng “ibinigay” ay natural sa Tagalog at malinaw mula sa naunang parirala.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang “mga alagang hayop” ay angkop sa pastoral na konteksto at ang “inyong ama” ay wastong tumutukoy sa iisang ama ng maramihang kausap. Ang “Kaya” ay katanggap-tanggap sa daloy ng pagsasalaysay at tugma sa English audit trail na “So.”
  terminology: Wasto at pare-pareho ang “Diyos,” “mga alagang hayop,” at “inyong ama.” Hindi pinapalambot ng salin ang tahasang pagkilos ng Diyos. Ang talababa ay maingat na naghahain ng mga alternatibong leksikal nang hindi nagtatakda ng interpretasyong doktrinal.
