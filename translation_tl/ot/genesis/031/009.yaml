  text: So God took away your father's livestock and gave it to me[a].
translation:
  language: tl
  text: Kaya kinuha ng Diyos ang mga alagang hayop ng inyong ama at ibinigay sa akin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inagaw” o “iniligtas.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagkuha mula sa isang panig at paglilipat sa iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל
  choice: kinuha
  rationale: Ang Hiphil ng נצל ay maaaring mangahulugang agawin, iligtas, o alisin sa pag-aari ng isang panig. Sa konteksto, inililipat ng Diyos kay Jacob ang mga alagang hayop ni Laban; malinaw ang “kinuha” ngunit hindi nito labis na idinidiin ang biglaan o marahas na paraan.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang tawag ito sa Diyos, na tahasang ipinakikilalang kumikilos para kay Jacob.
- source_word: מִקְנֵה
  choice: mga alagang hayop
  rationale: Tumutukoy ang salita sa mga ari-arian, lalo na sa mga domestikadong hayop. Sa kontekstong pastoral, natural at tiyak ang “mga alagang hayop.”
- source_word: אֲבִיכֶם
  choice: ng inyong ama
  rationale: Isahan ang “ama” ngunit maramihan ang mga kinakausap—sina Raquel at Lea—kaya angkop ang “inyong ama.”
- source_word: וַיִּתֶּן לִי
  choice: at ibinigay sa akin
  rationale: Ipinahihiwatig ng naunang tuwirang layon kung ano ang ibinigay, kaya hindi na kailangang ulitin sa Tagalog ang “mga iyon.”
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pag-unlad ni Jacob
  choice: Tahasang sinasabing kinuha ng Diyos ang mga alagang hayop ni Laban at ibinigay kay Jacob.
  alternative: Palambutin ang pahayag bilang pangkalahatang pagpapala lamang ng Diyos.
  rationale: Malinaw na iniuugnay ng dalawang pandiwa sa Hebreo sa Diyos ang pag-aalis at pagbibigay. Pinananatili ng salin ang matibay na pahayag na ito nang hindi ipinapaliwanag kung paano ito isinagawa.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “mga alagang hayop” bilang natural na kolektibong katawagan at ang “inyong” upang ipakita na higit sa isa ang kinakausap.
