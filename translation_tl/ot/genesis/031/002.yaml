  yaml_path: translation/ot/genesis/031/002.yaml
  text: And Jacob saw Laban’s face[a], and behold[b], it was not toward him as before.
translation:
  language: tl
  text: Nakita ni Jacob ang mukha ni Laban[a], at narito, hindi na gaya ng dati ang pakikitungo ni Laban kay Jacob.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mukha” ay maaari ring tumukoy sa nakikitang anyo o saloobin ni Laban.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at narito, hindi siya kasama niya gaya ng kahapon at noong makalawa.” Ipinahihiwatig ng idyomang ito na nagbago ang saloobin ni Laban kay Jacob.
    reason: literal_rendering
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nakita
  rationale: Karaniwang pandiwang pasalaysay ito para sa aktuwal na pagkakita; sa kasunod na sugnay, ang “napansin” ay likas na naghahatid ng pagkaunawa ni Jacob sa nakita niya.
- source_word: פְּנֵי לָבָן
  choice: ang mukha ni Laban
  rationale: Pinananatili nito ang kongkretong larawang Hebreo ng “mukha,” na maaari ring magpahiwatig ng anyo, saloobin, o disposisyon.
- source_word: וְהִנֵּה
  choice: at napansin niyang
  rationale: Ang הִנֵּה ay tumatawag ng pansin sa biglang napagtanto sa salaysay. Sa modernong Tagalog, natural na naihahatid ito ng “napansin niyang” nang hindi gumagamit ng lipas o sobrang matalinghagang pananalita.
- source_word: אֵינֶנּוּ עִמּוֹ
  choice: hindi na ... ang pakikitungo nito sa kanya
  rationale: Ang literal na “hindi ito/kasama niya” ay isang pananalitang tumutukoy rito sa nagbagong disposisyon ni Laban kay Jacob. Nililinaw ng “pakikitungo” ang relasyonal na diwa habang itinatala sa talababa ang literal na anyo.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: gaya ng dati
  rationale: Idyoma itong literal na tumutukoy sa “kahapon at noong makalawa,” ngunit ang kahulugan ay “tulad noong una” o “gaya ng dati.”
