translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang kongkretong “mukha,” ngunit ginawang natural ang idyomang Hebreo sa pangunahing teksto; nasa talababa ang literal at bahagyang malabong ayos ng mga panghalip.
