id: GEN.31.42
reference: Genesis 31:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לוּלֵ֡י אֱלֹהֵ֣י אָבִ/י֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּ/פַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔/י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑/נִי אֶת עָנְיִ֞/י וְ/אֶת יְגִ֧יעַ כַּפַּ֛/י רָאָ֥ה אֱלֹהִ֖ים וַ/יּ֥וֹכַח אָֽמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/042.yaml
  text: If the God of my father[a], the God of Abraham, and the Fear of Isaac, had not been with me, surely by now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and he judged last night.
translation:
  language: tl
  text: Kung hindi ako sinamahan ng Diyos ng aking ama, ng Diyos ni Abraham, at ng Kinatatakutan ni Isaac[a], tiyak na pinaalis mo na sana akong walang dala. Nakita ng Diyos ang paghihirap ko at ang pagpapagal ng aking mga kamay, at humatol siya kagabi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang Takot ni Isaac,” isang natatanging titulo para sa Diyos. Maaari ring unawain na “ang Isa na kinatatakutan ni Isaac.”
    reason: Pinananatili ang kakaibang titulong Hebreo habang nililinaw ang posibleng kahulugan nito.
  - marker: b
    text: Ang salitang Hebreo ay maaari ring mangahulugang “nagpasya” o “sumaway.” Walang tahasang layon ang pandiwa sa Hebreo; sa konteksto, tumutukoy ito sa pakikialam ng Diyos kay Laban noong nakaraang gabi.
    reason: Pinananatili ang leksikal at sintaktikong kalabuan ng pandiwa sa halip na tahasang idagdag ang “ikaw.”
lexical_decisions:
- source_word: לוּלֵי ... הָיָה לִי
  choice: Kung hindi ko kasama ...
  rationale: Ipinapahayag nito nang natural sa Tagalog ang kondisyong salungat sa aktuwal na nangyari at ang diwang ang Diyos ay sumuporta o nanatiling kasama ni Jacob.
- source_word: אֱלֹהֵי אָבִי
  choice: ang Diyos ng aking ama
  rationale: Malinaw at tuwirang pinananatili ang ugnayan sa ama ni Jacob at ang pagkakakilanlang minana sa mga ninuno.
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: ang Diyos ni Abraham
  rationale: Karaniwan at natural na salin ng pariralang Hebreo.
- source_word: וּפַחַד יִצְחָק
  choice: at ang Kinatatakutan ni Isaac
  rationale: Pinananatili ang natatanging titulong may diwa ng takot o pangingilabot, ngunit isinasalin sa paraang mas malinaw kaysa sa literal na “Takot ni Isaac.”
- source_word: כִּי עַתָּה רֵיקָם שִׁלַּחְתָּנִי
  choice: tiyak na pinaalis mo na sana akong walang dala
  rationale: Ang “na sana” ay natural na naghahayag ng kinalabasang hindi nangyari; ang “walang dala” ay malinaw na katumbas ng pagpapauwi nang walang anumang tinanggap.
- source_word: עָנְיִי
  choice: ang paghihirap ko
  rationale: Saklaw nito ang pagdurusa at masamang kalagayan ni Jacob, hindi lamang kahirapang pinansiyal.
- source_word: יְגִיעַ כַּפַּי
  choice: ang pagpapagal ng aking mga kamay
  rationale: Pinananatili ang konkretong larawan ng Hebreo at ipinahihiwatig ang mabigat na gawaing personal niyang isinagawa.
- source_word: וַיּוֹכַח
  choice: at humatol siya
  rationale: Ang pandiwa ay maaaring tumukoy sa paghatol, pagpapasya sa alitan, o pagsaway. Ang “humatol” ay nagpapanatili ng juridikal na diwa nang hindi nagdaragdag ng tahasang layon na wala sa Hebreo.
- source_word: אָמֶשׁ
  choice: kagabi
  rationale: Natural at eksaktong temporal na katumbas sa konteksto ng panaginip ni Laban noong nagdaang gabi.
theological_decisions:
- issue: Ang natatanging titulo sa וּפַחַד יִצְחָק
  choice: ang Kinatatakutan ni Isaac
  alternative: ang Takot ni Isaac; ang Isa na kinatatakutan ni Isaac
  rationale: Tinutukoy ng parirala ang Diyos, ngunit sadyang kakaiba ang anyo nito sa Hebreo. Pinananatili ng pangunahing salin ang takot bilang mahalagang bahagi ng titulo, habang inilalahad sa talababa ang mas literal na anyo.
- issue: Ang diwa at walang tahasang layon ng וַיּוֹכַח
  choice: humatol siya
  alternative: nagpasya siya; sumaway siya; sinaway ka niya
  rationale: Hindi tahasang binabanggit ng Hebreo kung sino ang hinatulan o sinaway. Iniiwasan ng pangunahing salin ang pagdaragdag ng “ka,” samantalang kinikilala ng talababa ang saklaw ng kahulugan at ang konteksto ng babala kay Laban.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “aking” at “pagpapagal” upang mapanatili ang dignidad ng salaysay, ngunit iniwasan ang lipas o labis na pormal na pananalita. Ang malaking titik sa “Kinatatakutan” ay nagpapakitang ginagamit ito bilang natatanging titulo para sa Diyos.
