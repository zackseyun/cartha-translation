  yaml_path: translation/ot/genesis/031/054.yaml
  text: Then Jacob offered a sacrifice on the mountain and called his brothers to eat bread[a]. They ate bread and spent the night on the mountain.
translation:
  language: tl
  text: Pagkatapos, naghandog si Jacob ng isang hain sa bundok at tinawag niya ang kanyang mga kapatid upang kumain ng tinapay.[a] Kumain sila ng tinapay at nagpalipas ng gabi sa bundok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lalaking kamag-anak” o “mga kasamahan.” Sa kontekstong ito, ang salitang Hebreo para sa “mga kapatid” ay maaari ring tumukoy nang mas malawak sa mga lalaking kamag-anak o kasamahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח ... זֶבַח
  choice: naghandog ... ng isang hain
  rationale: Pinananatili ang tahasang diwang pansakripisyo ng pandiwa at pangngalang magkaugnay sa Hebreo, ngunit iniiwasan ang di-likas na pag-uulit na “naghain ng hain.”
- source_word: בָּהָר
  choice: sa bundok
  rationale: Tuwirang katumbas ng tiyak na anyong Hebreo at angkop sa dalawang pagbanggit sa lugar.
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Pinananatili ang literal na kahulugan ng קרא; sa konteksto, ang pagtawag ay nagsisilbing paanyaya.
- source_word: לְאֶחָיו
  choice: ang kanyang mga kapatid
  rationale: Pinananatili ang salitang pampamilya at panlalaki sa Hebreo, habang inilalahad sa talababa na maaari itong tumukoy sa mas malawak na kamag-anakan o mga kasamahan.
- source_word: לֶאֱכָל לָחֶם / וַיֹּאכְלוּ לֶחֶם
  choice: upang kumain ng tinapay / Kumain sila ng tinapay
  rationale: Pinananatili ang idyomang Hebreo at ang sinadyang pag-uulit; maaari rin itong mangahulugang pagkain ng isang salu-salo.
- source_word: וַיָּלִינוּ
  choice: nagpalipas ng gabi
  rationale: Natural na makabagong Tagalog para sa pananatili o pagtuloy nang magdamag.
theological_decisions:
- issue: Saklaw ng “kanyang mga kapatid” sa tagpo ng tipan
  choice: ang kanyang mga kapatid
  alternative: ang kanyang mga kamag-anak; ang kanyang mga kasamahan
  rationale: Maaaring lumawak ang אָח lampas sa mga tunay na kapatid, ngunit hindi tiyak sa teksto kung alin sa mas malalawak na kahulugan ang nilalayon. Kaya pinanatili sa pangunahing teksto ang payak na katawagang pampamilya at inilagay sa talababa ang mga posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “kumain ng tinapay” upang maipakita ang anyo at himig ng Hebreo, bagaman karaniwang tumutukoy ito sa pagsasalo sa pagkain.
