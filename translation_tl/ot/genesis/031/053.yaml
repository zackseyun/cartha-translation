  text: אֱלֹהֵ֨י אַבְרָהָ֜ם וֵֽ/אלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔י/נוּ אֱלֹהֵ֖י אֲבִי/הֶ֑ם וַ/יִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּ/פַ֖חַד אָבִ֥י/ו יִצְחָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/053.yaml
  text: May the God of Abraham and the god of Nahor[a], the god of their father, judge between us[c][b]. And Jacob swore by the Fear of his father Isaac.
translation:
  language: tl
  text: “Nawa’y humatol sa pagitan natin ang Diyos ni Abraham at ang diyos ni Nahor[a], ang diyos ng kanilang ama[c].” At sumumpa si Jacob sa Takot ng kanyang amang si Isaac[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Nawa’y humatol sa pagitan natin ang Diyos ni Abraham at ang Diyos ni Nahor, ang Diyos ng kanilang ama.” Maaaring unawain ang Hebreo na iisang Diyos ang tinutukoy sa lahat ng katawagan.'
    reason: alternative_reading
  - marker: b
    text: Ang “Takot ng kanyang amang si Isaac” ay isang di-pangkaraniwang katawagan sa Diyos. Literal na ginagamit dito ang pangngalang nangangahulugang “takot” o “pangamba.”
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring unawain bilang isang nakasingit na paglilinaw: “—ang diyos ng kanilang ama—.”'
    reason: previous_rendering
lexical_decisions:
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: ang Diyos ni Abraham
  rationale: Ang אֱלֹהֵי ay anyong maramihan sa morpolohiya ngunit karaniwang tumutukoy sa iisang Diyos kapag may isahang personal na tinutukoy. Ang malaking titik sa “Diyos” ay angkop sa Diyos na sinasamba ni Abraham.
- source_word: וֵאלֹהֵי נָחוֹר
  choice: at ang diyos ni Nahor
  rationale: Ginamit ang maliit na titik sa “diyos” upang hindi agad ipalagay na ang diyos na inuugnay kay Nahor ay tahasang kapareho ng Diyos ni Abraham. Pinananatili nito ang kalabuan at tensiyon ng pananalita ni Laban.
- source_word: אֱלֹהֵי אֲבִיהֶם
  choice: ang diyos ng kanilang ama
  rationale: Maaaring basahin ang parirala bilang paglilinaw o panumbalik na pagtukoy sa naunang panawagan. Ang maliit na titik ay nagpapanatili sa kalabuan kung iisang minanang Diyos o mas malawak na panawagang pampamilya ang tinutukoy.
- source_word: יִשְׁפְּטוּ
  choice: nawa’y humatol
  rationale: Ang imperfect na pandiwa ay may diwang kahilingan o panawagan, kaya likas ang “nawa’y.” Hindi kailangang markahan sa pandiwang Tagalog ang bilang; ang magkatuwang na simuno ay nananatiling makikita sa pangungusap.
- source_word: בֵינֵינוּ
  choice: sa pagitan natin
  rationale: Tuwiran at natural na salin ng kapalitang ugnayan sa konteksto ng tipan.
- source_word: וַיִּשָּׁבַע
  choice: At sumumpa
  rationale: Tuwirang isinasalin ang karaniwang pasalaysay na waw-consecutive bilang naganap na kilos.
- source_word: בְּפַחַד
  choice: sa Takot
  rationale: Ang פַחַד ay literal na “takot” o “pangamba,” ngunit dito ay ginagamit bilang di-pangkaraniwang katawagan sa Diyos. Pinanatili ang literal na pangngalan at ginamitan ng malaking titik sa halip na pakinisin bilang “Diyos na kinatatakutan.”
- source_word: אָבִיו יִצְחָק
  choice: ng kanyang amang si Isaac
  rationale: Natural na apposisyon sa modernong Tagalog na malinaw na kinikilala si Isaac bilang ama ni Jacob.
theological_decisions:
- issue: Kung dapat bang ipakilala bilang iisang Diyos ang lahat ng tinawag ni Laban
  choice: “Diyos ni Abraham” ngunit “diyos ni Nahor, ang diyos ng kanilang ama”
  alternative: “Diyos ni Abraham at Diyos ni Nahor, ang Diyos ng kanilang ama”
  rationale: Paulit-ulit na gumagamit ang Hebreo ng אֱלֹהֵי at sinusundan ito ng pandiwang maramihan. Ang magkaibang gamit ng malaking at maliit na titik ay hindi nagpapasya nang lampas sa teksto kung ang lahat ng katawagan ay tumutukoy sa iisang Diyos.
- issue: Kung paano isasalin ang pormula ng panunumpa na בְּפַחַד אָבִיו יִצְחָק
  choice: “sa Takot ng kanyang amang si Isaac”
  alternative: “sa Diyos na kinatatakutan ng kanyang amang si Isaac”
  rationale: Pinananatili ng “Takot” ang pambihira at sadyang matinding katawagan sa Diyos, sa halip na palitan ito ng isang pagpapaliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang sadyang pambihirang “Takot” bilang banal na katawagan at ang malaking/maliit na titik sa “Diyos/diyos” upang huwag alisin ang kalabuan ng Hebreo.
