  text: These twenty years I have been with you; your ewes and your female goats have not miscarried[a], and I have not eaten the rams of your flock.
translation:
  language: tl
  text: Dalawampung taon na akong kasama mo. Hindi nakunan ang iyong mga babaeng tupa at babaeng kambing[a], at hindi ko kinain ang mga lalaking tupa ng iyong kawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi nawalan ng mga anak.” Ang pandiwang Hebrew ay maaaring tumukoy sa pagkakait o pagkawala ng supling; sa kontekstong ito ng pagpapastol, tumutukoy ito sa pagkalaglag o pagkawala ng anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשְׂרִים שָׁנָה
  choice: Sa loob ng dalawampung taon na ito
  rationale: Natural na ipinahahayag sa modernong Tagalog ang haba ng panahong tinutukoy habang pinananatili ang demonstratibong diwa ng Hebrew.
- source_word: אָנֹכִי עִמָּךְ
  choice: ay kasama mo ako
  rationale: Walang tahasang pandiwa sa Hebrew, ngunit malinaw na inilalarawan ng sugnay ang patuloy na pananatili ni Jacob kasama ni Laban sa loob ng dalawampung taon.
- source_word: רְחֵלֶיךָ וְעִזֶּיךָ
  choice: iyong mga babaeng tupa at mga babaeng kambing
  rationale: Pinananatili ang tiyak na kasarian ng dalawang katawagang Hebrew, mahalaga sa konteksto ng pagpaparami ng kawan.
- source_word: לֹא שִׁכֵּלוּ
  choice: Hindi nakunan
  rationale: Sa konteksto ng mga alagang hayop, tumutukoy ang pandiwa sa pagkakait o pagkawala ng supling, karaniwang dahil sa pagkalaglag; maikli at natural ang 'nakunan' sa Tagalog.
- source_word: וְאֵילֵי צֹאנְךָ
  choice: ang mga barakong tupa sa iyong kawan
  rationale: Ang אֵילִים ay partikular na mga lalaking tupa; malinaw sa ordinaryong mambabasa ang 'barakong tupa' at napapanatili ang kaugnayan sa kawan.
- source_word: לֹא אָכָלְתִּי
  choice: hindi ko kinain
  rationale: Natural na aspektong pangnagdaan sa Tagalog para sa pagbabalik-tanaw ni Jacob sa kanyang asal sa buong panahon ng paglilingkod.
