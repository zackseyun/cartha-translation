  source_fidelity: Tumpak na naihahatid ng salin ang dalawampung-taóng paglilingkod ni Jacob, ang mga babaeng tupa at kambing, ang hindi pagkawala ng kanilang supling, at ang hindi niya pagkain ng mga lalaking tupa. Gayunman, ang “sa iyong kawan” ay mas madaling basahing lokatibo (“in your flock”) kaysa sa pagmamay-ari/ugnayang nasa Hebrew na “ng iyong kawan.”
  naturalness: Karaniwan at malinaw ang “nakunan” sa konteksto ng mga hayop, at maayos ang kabuuang rehistro. Mas natural at mas malawak na nauunawaan sa modernong Tagalog ang “mga lalaking tupa” kaysa “mga barakong tupa.” Ang “Dalawampung taon na akong kasama mo” ay higit na likas na nagpapahayag ng nagpapatuloy na tagal hanggang sa sandali ng pagsasalita.
  terminology: Napanatili ang pagkakaiba ng babaeng tupa, babaeng kambing, at lalaking tupa. Nananatiling angkop ang talababa upang ipakita na ang Hebrew ay maaari ring tumukoy sa pagkawala ng supling, hindi lamang pagkalaglag.
