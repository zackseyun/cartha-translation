  text: But God came to Laban the Aramean in a dream at night and said to him[c][b][a], “Be careful not to speak to Jacob either good or bad.”
translation:
  language: tl
  text: Ngunit dumating ang Diyos kay Laban na Arameo sa isang panaginip nang gabing iyon at sinabi sa kanya, “Mag-ingat ka na huwag magsabi kay Jacob ng mabuti man o masama.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa mabuti hanggang sa masama.” Isa itong idyoma na nangangahulugang huwag magsabi ng anuman, paborable man o salungat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Karaniwang salaysay na kahulugan ng בוא sa anyong wayyiqtol; hindi idinaragdag ang mas interpretibong ‘nagpakita.’
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Ang pandiwang isahan at konteksto ay tumutukoy sa iisang Diyos.
- source_word: לָבָן הָאֲרַמִּי
  choice: Laban na Arameo
  rationale: Tuwirang tinutukoy ng אֲרַמִּי ang etnisidad na Arameo; mas tumpak ito kaysa sa tradisyonal na ‘Sirio.’
- source_word: בַּחֲלֹם הַלָּיְלָה
  choice: sa isang panaginip nang gabing iyon
  rationale: Natural na Filipino na pinananatili ang panaginip at ang panggabing tagpuan; ang tiyak na anyo ng ‘gabi’ ay angkop na naipahahayag bilang gabing iyon.
- source_word: הִשָּׁמֶר לְךָ
  choice: Mag-ingat ka
  rationale: Natural at malinaw na babala sa modernong Filipino, katumbas ng idyomatikong pormula sa Hebreo.
- source_word: פֶּן תְּדַבֵּר עִם יַעֲקֹב
  choice: na huwag magsalita kay Jacob
  rationale: Ipinahahayag ng פֶּן ang babala laban sa isang kilos; ang ‘magsalita kay’ ay malapit sa Hebreo at nauunawaan sa Filipino.
- source_word: מִטּוֹב עַד רָע
  choice: ng mabuti man o masama
  rationale: Pinananatili ang dalawang dulo ng Hebreong idyoma nang hindi tahasang pinapalitan ng interpretibong ‘anuman.’
theological_decisions:
- issue: Pagkakakilanlan ng אֱלֹהִים
  choice: ang Diyos
  alternative: isang diyos / mga diyos
  rationale: Ang pandiwang isahan at ang salaysay ay malinaw na tumutukoy sa Diyos, hindi sa isang di-tiyak na bathala o sa maraming diyos.
- issue: Saklaw ng pagbabawal na מִטּוֹב עַד רָע
  choice: huwag magsalita kay Jacob ng mabuti man o masama
  alternative: huwag magsabi ng anuman kay Jacob
  rationale: Pinananatili sa pangunahing teksto ang tunay na anyo at tensiyon ng idyoma, habang ipinapaliwanag sa talababa na maaari nitong saklawin ang anumang sasabihin, paborable man o salungat.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang ‘Arameo’ bilang tumpak na katawagang etniko at iniwasan ang mas lumang ‘Sirio.’
