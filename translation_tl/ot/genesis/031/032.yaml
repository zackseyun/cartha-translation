  to: “Ang sinumang makitaan mo ng iyong mga diyos ay hindi mabubuhay.[a] Sa harap ng mga kapatid natin,[b] kilalanin mo kung ano sa mga kasama ko ang sa iyo, at kunin mo iyon.” Hindi alam ni Jacob na ninakaw ni Raquel ang mga iyon.[c]
