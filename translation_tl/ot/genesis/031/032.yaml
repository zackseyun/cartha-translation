base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/032.yaml
  text: Whoever is found with your gods shall not live[a]. In the presence of our brothers, identify what of yours is with me[c][b], and take it for yourself.” Jacob did not know that Rachel had stolen them.
translation:
  language: tl
  text: “Ang sinumang makitaan mo ng iyong mga diyos ay hindi mabubuhay.[a] Sa harap ng mga kapatid natin,[b] kilalanin mo kung ano sa mga kasama ko ang sa iyo, at kunin mo iyon.” Hindi alam ni Jacob na ninakaw ni Raquel ang mga iyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Ang sinumang makitaan mo ng iyong mga diyos.”'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na literal na “mga kapatid” ay maaari ring tumukoy sa mas malawak na pangkat ng mga lalaking kaanak o kasamang naroon.
    reason: cultural_note
  - marker: c
    text: Ang “mga iyon” ay ang mga diyos ni Laban na ninakaw ni Raquel.
    reason: referent_clarification
lexical_decisions:
- source_word: עִם אֲשֶׁר תִּמְצָא
  choice: Ang sinumang pagdalhan mo
  rationale: Pinananatili nito ang aktibong ikalawang panauhan ng pandiwang Hebreo—si Laban ang hahanap—at likas na ipinapahayag sa Tagalog ang taong matatagpuang may dala ng mga bagay.
- source_word: אֱלֹהֶיךָ
  choice: iyong mga diyos
  rationale: Tuwirang sinasalamin ang pangmaramihang anyo ng Hebreo nang hindi ipinapasok sa pangunahing teksto ang mas tiyak na katawagang ‘mga diyos ng sambahayan.’
- source_word: לֹא יִחְיֶה
  choice: ay hindi mabubuhay
  rationale: Pinananatili ang matinding pormulang maaaring marinig bilang hatol, sumpa, o mariing pahayag, nang hindi tahasang nagpapasya sa pagitan ng mga iyon.
- source_word: נֶגֶד אַחֵינוּ
  choice: Sa harap ng ating mga kamag-anak
  rationale: Ang ‘mga kapatid’ sa Hebreo ay maaaring tumukoy nang mas malawak sa mga lalaking kaanak o kasamang naroon; ‘mga kamag-anak’ ang mas malinaw at likas sa konteksto.
- source_word: הַכֶּר לְךָ מָה עִמָּדִי
  choice: kilalanin mo kung alin sa mga dala ko ang sa iyo
  rationale: Ipinahahayag ang utos na siyasatin at tukuyin ang sariling pag-aari ni Laban sa mga bagay na kasama ni Jacob, habang pinananatili ang ellipsis ng konteksto sa likas na Tagalog.
- source_word: וְקַח לָךְ
  choice: at kunin mo
  rationale: Likas at sapat sa Tagalog ang simpleng utos; ipinahihiwatig na ng pandiwa at konteksto na kukunin iyon ni Laban para sa sarili.
- source_word: וְלֹא יָדַע יַעֲקֹב
  choice: Hindi alam ni Jacob
  rationale: Tuwirang salaysay na patlang; hindi kailangang panatilihin ang panimulang pangatnig upang maging natural sa Tagalog.
- source_word: כִּי רָחֵל גְּנָבָתַם
  choice: na ninakaw ni Raquel ang mga iyon
  rationale: Ang pangmaramihang hulapi ay tinutukoy ng ‘mga iyon,’ at ang aspektong naganap na bago ang pagkaalam ni Jacob ay natural na naipapakita ng ‘ninakaw’ sa Tagalog.
theological_decisions:
- issue: Lakas at uri ng pahayag na לֹא יִחְיֶה
  choice: hindi mabubuhay
  alternative: dapat patayin
  rationale: Hindi nililinaw ng Hebreo kung ito ay legal na hatol, sumpa, o mariing pangako; ang napiling salin ay nagpapanatili sa tensiyong iyon.
- issue: Pagkakakilanlan ng אֱלֹהֶיךָ
  choice: mga diyos
  alternative: mga diyos ng sambahayan
  rationale: Bagaman ipinakikita ng konteksto na ang tinutukoy ay mga larawang panambahin ni Laban, hindi ginagamit sa sugnay na ito ang mas tiyak na terminong terafim; kaya pinanatili ang pangkalahatang salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Raquel,’ ang nakaugaliang anyong Filipino ng pangalan. Iniwasan ang sobrang teknikal na ‘idolo’ sa pangunahing teksto upang mapanatili ang mismong leksikal na anyo at ambiguwidad ng Hebreo.
