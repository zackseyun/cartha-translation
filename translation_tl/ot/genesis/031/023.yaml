  yaml_path: translation/ot/genesis/031/023.yaml
  text: And he took his kinsmen with him[a], and pursued him for a journey of seven days[d][c][b], and caught up with him in the hill country of Gilead.
translation:
  language: tl
  text: Isinama niya ang kanyang mga kamag-anak[a] at hinabol si Jacob sa layong katumbas ng pitong araw na paglalakbay. Naabutan niya si Jacob sa mabundok na lupain ng Gilead.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kapatid”; ang salitang Hebreo ay maaaring tumukoy sa mga kapatid o, sa mas malawak na diwa, sa mga kamag-anak.
    reason: lexical_alternative
  - marker: b
    text: O “sa Bundok Gilead”; maaaring tumukoy ang Hebreo sa isang tiyak na bundok o sa mabundok na rehiyon ng Gilead.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: kanyang mga kamag-anak
  rationale: Bagaman karaniwang nangangahulugang “mga kapatid” ang אָח, maaari rin itong tumukoy sa mas malawak na angkan. Sa konteksto, mga kasapi ng angkan ni Laban ang kasama niya, kaya mas angkop ang “mga kamag-anak.”
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: hinabol si Jacob
  rationale: Likas sa modernong Tagalog ang “hinabol” para sa רדף אחר. Ginawang tahasan ang tinutukoy ng panghalip upang maiwasan ang kalituhan sa sunod-sunod na panlalaking panghalip.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: nang pitong araw na paglalakbay
  rationale: Pinananatili nito ang diwa ng דֶּרֶךְ bilang daan o paglalakbay at ang sukat na pitong araw, sa halip na sabihing pitong araw lamang ang buong pagtugis.
- source_word: וַיַּדְבֵּק אֹתוֹ
  choice: naabutan niya ito
  rationale: Sa konteksto ng pagtugis, ipinahihiwatig ng דבק na naabutan o nahabol ni Laban si Jacob. Natural at malinaw sa Tagalog ang “naabutan.”
- source_word: בְּהַר הַגִּלְעָד
  choice: sa bulubundukin ng Gilead
  rationale: Maaaring tumukoy ang הַר sa isang bundok o sa isang maburol o mabundok na rehiyon. Ang “bulubundukin” ay angkop sa malamang na panrehiyong kahulugan habang hindi itinatangging maaaring isang tiyak na bundok ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Inalis ang pambungad na paulit-ulit na “at” upang maging natural ang daloy, ngunit pinanatili ang pagkakasunod-sunod ng mga kilos. Ginamit ang “si Jacob” upang luminaw ang reperensiya ng panghalip.
