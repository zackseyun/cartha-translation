translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na daloy ng salaysay at ang pag-uulit ng “mga bato” at “bunton,” habang inilagay sa mga talababa ang tunay na mga posibleng kahulugan ng לְאֶחָיו at עַל.
