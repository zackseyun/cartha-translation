base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/046.yaml
  text: Then Jacob said to his brothers[a], “Gather stones.” So they took stones and made a heap[b], and they ate there by the heap.
translation:
  language: tl
  text: Sinabi ni Jacob sa kanyang mga kapatid[a], “Magtipon kayo ng mga bato.” Kaya kumuha sila ng mga bato at gumawa ng isang bunton, at kumain sila roon sa tabi ng bunton.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay maaaring tumukoy nang mas malawak sa mga lalaking kamag-anak o kasamahan ni Jacob, at hindi lamang sa kanyang mga kapatid sa laman.
    reason: cultural_note
  - marker: b
    text: O “sa ibabaw ng bunton.” Maaari ring unawain nang mas literal na “sa ibabaw” ang Hebreong pang-ukol.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֶחָיו
  choice: sa kanyang mga kapatid
  rationale: Karaniwang nangangahulugang “mga kapatid” ang אָח, ngunit maaari rin itong tumukoy sa mas malawak na pangkat ng mga lalaking kamag-anak o kasamahan. Pinanatili sa pangunahing teksto ang tuwirang salin at nilinaw ang mas malawak na saklaw sa talababa.
- source_word: לִקְטוּ אֲבָנִים
  choice: Magtipon kayo ng mga bato
  rationale: Ang pautos na לקט ay tumutukoy sa pangangalap o pagpupulot. Likas at malinaw sa Filipino ang “magtipon” para sa pag-iipon ng mga batong gagawing bunton.
- source_word: וַיַּעֲשׂוּ גָל
  choice: gumawa ng isang bunton
  rationale: Ang גַּל ay bunton o tumpok, lalo na ng mga bato. Ang “bunton” ay karaniwan, malinaw, at angkop sa konteksto.
- source_word: עַל הַגָּל
  choice: sa tabi ng bunton
  rationale: Maaaring mangahulugan ang עַל ng “sa ibabaw ng” ngunit maaari rin itong gamitin sa diwang “sa tabi ng” o “malapit sa.” Mas natural sa tagpo ang “sa tabi,” habang pinananatili sa talababa ang mas literal na posibilidad.
