base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/035.yaml
  text: And she said to her father[a], “Let not my lord be angry in my sight that I cannot rise before you, for the way of women is upon me.” So he searched[b], but did not find the household idols.
translation:
  language: tl
  text: Sinabi niya sa kanyang ama, “Huwag po kayong magalit sa akin, panginoon ko, dahil hindi ako makatayo sa harap ninyo, sapagkat dinatnan ako.” Kaya naghanap siya, ngunit hindi niya natagpuan ang mga diyus-diyosan ng sambahayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “ang mga terafim,” mga imaheng panrelihiyon o diyus-diyosan na kaugnay ng sambahayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל אָבִיהָ
  choice: Sinabi niya sa kanyang ama
  rationale: Likas na salaysay sa modernong Tagalog; malinaw na ang nagsasalita ay si Raquel at ang kausap ay ang kanyang ama.
- source_word: אַל יִחַר בְּעֵינֵי אֲדֹנִי
  choice: Huwag po kayong magalit, panginoon ko
  rationale: Ang idyomang Hebreo ay nagpapahayag ng magalang na pakiusap na huwag magalit o masamain. Ang “po” at “panginoon ko” ay nagpapanatili ng mapagpakumbabang pagtawag nang hindi ginagawang titulong para sa Diyos.
- source_word: כִּי לֹא אוּכַל לָקוּם מִפָּנֶיךָ
  choice: dahil hindi ako makatayo sa harap ninyo
  rationale: Pinananatili ang pisikal na diwa ng קום at ang kahulugan ng pagharap o presensiya sa מִפָּנֶיךָ, sa natural na Tagalog.
- source_word: כִּי דֶרֶךְ נָשִׁים לִי
  choice: sapagkat dinatnan ako
  rationale: Ang pariralang Hebreo ay isang magalang na eupemismo para sa pagreregla. Ang “dinatnan ako” ay karaniwan, malinaw, at may katulad na mahinahong rehistro sa Filipino.
- source_word: וַיְחַפֵּשׂ וְלֹא מָצָא
  choice: Kaya naghanap siya, ngunit hindi niya natagpuan
  rationale: Ipinahahayag ang pagpapatuloy ng salaysay at ang salungat na kinalabasan ng paghahanap.
- source_word: הַתְּרָפִים
  choice: mga diyus-diyosan sa sambahayan
  rationale: Ipinakikita ang mga terafim bilang mga bagay na panrelihiyon o larawang sinasamba na kaugnay ng sambahayan, habang iniiwasan ang di-pamilyar na transliterasyon sa pangunahing teksto.
theological_decisions:
- issue: Pagbibigay-kahulugan sa תְּרָפִים
  choice: mga diyus-diyosan sa sambahayan
  alternative: mga terafim; mga diyos ng sambahayan
  rationale: Ang termino ay tumutukoy sa mga bagay o imaheng kultiko sa tahanan. Ang saling “mga diyus-diyosan sa sambahayan” ay madaling maunawaan at hindi ipinapalagay nang higit sa ipinahihiwatig ng konteksto.
- issue: Pagpapahayag ng דֶרֶךְ נָשִׁים לִי
  choice: dinatnan ako
  alternative: nasa akin ang karaniwang kalagayan ng mga babae; ako ay nireregla
  rationale: Pinananatili ng “dinatnan ako” ang eupemistikong tono ng Hebreo habang malinaw pa rin sa karaniwang mambabasang Filipino.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal. Ginamit ang “po” at maramihang panghalip bilang likas na paggalang ng anak sa ama; ang “panginoon ko” ay pinanatili bilang mapagpakumbabang katawagan, hindi bilang banal na titulo. Ang eupemismong “dinatnan ako” ay tumutugma sa mahinahong paraan ng orihinal.
