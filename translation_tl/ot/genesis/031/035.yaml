  naturalness: Bahagyang hindi likas ang “Huwag po kayong magalit, panginoon ko” sapagkat hindi malinaw na ang galit ay nakatuon sa nagsasalita. Ang “Huwag po kayong magalit sa akin, panginoon ko” ay mas idiomatiko at wastong naghahatid ng puwersa ng Hebreong pakiusap. Mas natural din ang “mga diyus-diyosan ng sambahayan” kaysa “sa sambahayan.”
  terminology: Ang “panginoon ko” ay angkop na magalang na tawag sa ama at hindi dapat unawaing banal na titulo. Ang “mga diyus-diyosan ng sambahayan,” na nililinaw ng talababa bilang “mga terafim,” ay malinaw at nananatiling maingat sa saklaw ng termino.
