base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/043.yaml
  text: Then Laban answered and said to Jacob[a], “The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that you see is mine. But what can I do this day for these my daughters, or for their children whom they have borne?”
translation:
  language: tl
  text: Sumagot si Laban at sinabi kay Jacob, “Ang mga anak na babae ay mga anak kong babae, ang mga anak na lalaki ay mga anak kong lalaki, ang kawan ay kawan ko, at lahat ng nakikita mo ay akin. Ngunit ano ang magagawa ko ngayon para sa mga anak kong babaeng ito, o para sa mga anak[a] na kanilang isinilang?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak na lalaki,” kung ang בְּנֵיהֶן ay uunawain sa mas makitid na kahulugang mga lalaking supling sa halip na mga anak sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן לָבָן וַיֹּאמֶר אֶל יַעֲקֹב
  choice: Sumagot si Laban at sinabi kay Jacob
  rationale: Pinananatili ang magkaparis na pandiwang Hebreo na “sumagot” at “sinabi,” habang natural pa rin sa marangal na salaysay sa Tagalog.
- source_word: הַבָּנוֹת בְּנֹתַי
  choice: Ang mga anak na babae ay mga anak kong babae
  rationale: Pinananatili ang mariing pag-uulit at ang pag-angkin ni Laban sa ugnayang pampamilya.
- source_word: וְהַבָּנִים בָּנַי
  choice: ang mga anak na lalaki ay mga anak kong lalaki
  rationale: Ipinapakita ang panlalaking anyo ng בָּנִים at ang paralelismo nito sa “mga anak na babae,” sa halip na gawing pangkalahatang “mga anak.”
- source_word: וְהַצֹּאן צֹאנִי
  choice: ang kawan ay kawan ko
  rationale: Ang “kawan” ay natural na kolektibong tawag sa maliliit na alagang hayop at pinananatili nito ang pag-uulit ng Hebreo.
- source_word: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא
  choice: at lahat ng nakikita mo ay akin
  rationale: Maikli at tuwirang ipinahahayag ang mariing pag-angkin ni Laban.
- source_word: מָה אֶעֱשֶׂה הַיּוֹם
  choice: ano ang magagawa ko ngayon
  rationale: Ang tanong ay retorikal at tumutukoy sa praktikal na magagawa ni Laban sa kasalukuyang pagkakataon; natural na katumbas ng הַיּוֹם ang “ngayon” sa modernong Tagalog.
- source_word: וְלִבְנֹתַי ... לָאֵלֶּה
  choice: para sa mga anak kong babaeng ito
  rationale: Isinasalin ang לְ bilang pakinabang o malasakit (“para sa”), at pinagsasama sa natural na ayos ang “mga anak kong babae” at “mga ito.”
- source_word: אוֹ לִבְנֵיהֶן
  choice: o para sa mga anak[a]
  rationale: Maaaring tumukoy ang בְּנֵיהֶן sa mga supling sa pangkalahatan, ngunit tunay ding posible ang mas makitid na “mga anak na lalaki”; pinananatili sa talababa ang alternatibo.
- source_word: אֲשֶׁר יָלָדוּ
  choice: na kanilang isinilang
  rationale: Tapat na inilalarawan ang mga anak na ipinanganak ng mga anak na babae ni Laban, sa maikli at natural na Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Sadyang pinanatili ang mga pag-uulit sa mga anak na babae, mga anak na lalaki, at kawan upang maipakita ang mariing pag-angkin ni Laban. Ang marker na [a] ay inilagay kaagad pagkatapos ng salitang may leksikal na alternatibo.
