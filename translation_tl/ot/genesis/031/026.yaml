  yaml_path: translation/ot/genesis/031/026.yaml
  text: Then Laban said to Jacob[a], “What have you done[c][b], that you have stolen my heart and driven my daughters away like captives of the sword?”
translation:
  language: tl
  text: Sinabi ni Laban kay Jacob, “Ano itong ginawa mo? Nilinlang mo ako[a] at itinaboy ang mga anak kong babae na parang mga babaeng binihag sa digmaan[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ninakaw mo ang puso ko,” isang idyoma na maaaring mangahulugang nilinlang o ginawan nang palihim.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “gaya ng mga bihag ng tabak,” ibig sabihin, mga babaeng dinalang bihag sa digmaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: Ano itong ginawa mo?
  rationale: Isang natural na tanong ng pagsumbat sa Filipino; ipinahihiwatig ng “itong” na ang natapos na ginawa ni Jacob ang kasalukuyang dahilan ng galit ni Laban.
- source_word: וַתִּגְנֹב אֶת לְבָבִי
  choice: Nilinlang mo ako
  rationale: Ang literal na “ninakaw mo ang puso ko” ay madaling magpahiwatig ng pag-ibig sa modernong Filipino. Sa konteksto, ang idyoma ay tumutukoy sa panlilinlang o pagkilos nang hindi nalalaman ni Laban; inilagay sa talababa ang literal na larawan.
- source_word: וַתְּנַהֵג
  choice: itinaboy
  rationale: Pinananatili nito ang mapuwersa at mapamilit na himig ng pandiwa, lalo na sa kasunod na paghahambing sa mga bihag sa digmaan.
- source_word: בְּנֹתַי
  choice: mga anak kong babae
  rationale: Malinaw na ipinahahayag ang pambabaeng maramihan at ang pag-angkin ni Laban sa kaniyang pananalita.
- source_word: כִּשְׁבֻיוֹת חָרֶב
  choice: parang mga babaeng binihag sa digmaan
  rationale: Natural itong unawain sa Filipino at tumpak na naghahatid ng larawan ng mga babaeng dinalang bihag sa digmaan; pinananatili sa talababa ang literal na pagtukoy sa tabak.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nilinlang” upang maiwasan ang romantikong pakahulugan ng literal na “ninakaw ang puso,” habang ang literal na larawan ay pinanatili sa talababa. Ang “itinaboy” ay nagpapanatili sa mapuwersang tono ng paratang ni Laban.
