  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
translation:
  language: tl
  text: Kaya tumakas siya kasama ang lahat ng kanyang pag-aari. Bumangon siya, tumawid sa Ilog[a], at nagtungo patungo sa bulubundukin ng Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumawid sa Eufrates.” “Ang Ilog” lamang ang nasa Hebreo, at malamang na tumutukoy ito sa Eufrates.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: tumakas
  rationale: Karaniwang ipinahihiwatig ng ברח ang pagtakas o palihim na paglayo; malinaw at natural ang “tumakas” sa kontekstong ito.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: kasama ang lahat ng kanya
  rationale: Pinananatili nitong malawak ang saklaw ng parirala upang maisama kapuwa ang sambahayan at mga ari-arian ni Jacob, nang hindi tinuturing na mga pag-aari lamang ang mga taong kasama niya.
- source_word: וַיָּקָם
  choice: Bumangon siya
  rationale: Pinananatili nito ang hiwalay na hakbang sa pagkakasunod-sunod ng salaysay na ipinahihiwatig ng קום, sa halip na agad itong ipakahulugang “umalis.”
- source_word: וַיַּעֲבֹר אֶת־הַנָּהָר
  choice: tumawid sa Ilog
  rationale: Ang עבר ay “tumawid,” at ang may-tiyak na הַנָּהָר ay malamang na kilalang katawagan sa Eufrates. Pinananatili sa teksto ang literal na “Ilog,” na may paliwanag sa talababa.
- source_word: וַיָּשֶׂם אֶת־פָּנָיו
  choice: itinuon ang kanyang mukha sa
  rationale: Pinananatili ang larawang Hebreo ng sinasadyang pagharap at matatag na pagtungo, habang nananatiling nauunawaan sa makabagong Filipino.
- source_word: הַר הַגִּלְעָד
  choice: bulubundukin ng Gilead
  rationale: Maaaring tumukoy ang הַר sa isang mabundok na rehiyon, hindi lamang sa iisang bundok; ang “bulubundukin” ang higit na angkop sa heograpiya rito.
