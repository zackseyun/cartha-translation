  source_fidelity: 'Wastong naihahatid ng draft ang pagkakasunod ng mga kilos sa Hebreo: tumakas si Jacob kasama ang lahat ng pag-aari niya, bumangon, tumawid sa tiyak na “ilog,” at itinuro ang kaniyang landas patungo sa bulubundukin ng Gilead. Ang “bulubundukin ng Gilead” ay angkop sa panrehiyong pakahulugan ng הַר.'
  naturalness: Hindi ganap na natural sa makabagong Filipino ang “lahat ng kanya,” at ang “itinuon ang kanyang mukha sa” ay labis na literal at matigas pakinggan sa ganitong konteksto. Ang rebisyon ay gumagamit ng mas likas na mga parirala nang hindi nagdaragdag ng kahulugan.
