  text: Are we not regarded by him as foreigners? For he has sold us and has indeed completely consumed our money[a].
translation:
  language: tl
  text: Hindi ba mga dayuhan ang turing niya sa amin? Sapagkat ipinagbili niya kami at lubusan ngang inubos ang salapi namin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lubusan ngang kinain ang aming pilak.” Gumagamit ang Hebreo ng idyomang “kumain” at ng isang anyong nagbibigay-diin upang ipahayag ang lubos na pagkaubos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: Hindi ba
  rationale: Naghuhudyat ito ng retorikal na tanong na umaasa ng pagsang-ayon; natural itong ipinapahayag sa modernong Tagalog bilang “Hindi ba...?”
- source_word: נָכְרִיּוֹת
  choice: mga dayuhan
  rationale: Tumutukoy ito sa mga taong itinuturing na hindi kabilang sa sambahayan o pamilya. Malinaw at natural ang “mga dayuhan” habang pinananatili ang hinaing ng mga anak.
- source_word: נֶחְשַׁבְנוּ לוֹ
  choice: ang turing niya sa amin
  rationale: Ang Niphal ng חשב ay nangangahulugang ituring o kilalanin bilang. Ang hulmaing ito ay natural sa Tagalog at naipapakita ang pananaw ng ama sa kanila nang hindi binabago ang diwa.
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito rito ng batayan para sa naunang retorikal na tanong.
- source_word: מְכָרָנוּ
  choice: ipinagbili niya kami
  rationale: Tuwirang pinananatili ang larawan at ang natapos na kilos na may kasalukuyang epekto sa hinaing ng magkapatid.
- source_word: וַיֹּאכַל גַּם אָכוֹל
  choice: at lubusan ngang inubos
  rationale: Ipinahahayag ng pandiwa kasama ng infinitive absolute at גַּם ang matinding diin at ganap na pagkaubos. Natural sa Tagalog ang “lubusan ngang inubos” at pinananatili ang emphatic force.
- source_word: אֶת כַּסְפֵּנוּ
  choice: ang salapi namin
  rationale: Maaaring mangahulugan ang כֶּסֶף ng pilak o salapi. Sa kontekstong pangkabuhayan, malinaw at marangal ang “salapi,” habang inilalagay sa talababa ang mas literal na “pilak.”
