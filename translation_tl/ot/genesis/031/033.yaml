base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/033.yaml
  text: So Laban went into Jacob’s tent[a], and into Leah’s tent, and into the tent of the two female servants, but he did not find them. Then he came out of Leah’s tent and went into Rachel’s tent.
translation:
  language: tl
  text: Pumasok si Laban sa tolda ni Jacob, at sa tolda ni Lea, at sa tolda ng dalawang aliping babae, ngunit wala siyang natagpuan.[a] Pagkatapos ay lumabas siya sa tolda ni Lea at pumasok sa tolda ni Raquel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hindi siya nakatagpo”; walang tahasang binanggit na layon sa talatang ito, ngunit ayon sa konteksto, tumutukoy ito sa mga diyus-diyosan ng sambahayan na hinahanap ni Laban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... בְּאֹהֶל
  choice: pumasok ... sa tolda
  rationale: Kapag may בְּ, ang בוא ay nagsasaad ng pagpasok sa isang lugar. Natural at tuwiran sa makabagong Tagalog ang “pumasok sa.”
- source_word: אֹהֶל
  choice: tolda
  rationale: Ito ang karaniwang kongkretong kahulugan ng salita at angkop sa kontekstong patriyarkal; hindi ito ginawang mas pangkalahatang “tirahan.”
- source_word: שְׁתֵּי הָאֲמָהֹת
  choice: dalawang alilang babae
  rationale: Ang אָמָה ay babaeng alipin o lingkod. Ang “alilang babae” ay malinaw at kasalukuyang nauunawaan, habang pinananatili ang mababang kalagayang panlipunan na ipinahihiwatig ng Hebreo.
- source_word: וְלֹא מָצָא
  choice: ngunit hindi niya natagpuan ang mga iyon
  rationale: Walang tahasang layon ang pandiwa sa Hebreo, ngunit mula sa konteksto ay tumutukoy ito sa mga diyus-diyosan ng sambahayan na hinahanap ni Laban. Ang “mga iyon” ay natural sa Tagalog at nililinaw sa talababa na ipinahiwatig lamang ang layon.
- source_word: וַיֵּצֵא מֵאֹהֶל לֵאָה
  choice: Pagkatapos, lumabas siya sa tolda ni Lea
  rationale: Ang יצא ay “lumabas,” at ang “Pagkatapos” ay natural na naghahayag ng sunod-sunod na kilos ng salaysay.
- source_word: וַיָּבֹא בְּאֹהֶל רָחֵל
  choice: at pumasok sa tolda ni Raquel
  rationale: Inuulit ang parehong pandiwa ng paggalaw at pinananatili ang sunod-sunod na paghahalughog sa mga tolda.
