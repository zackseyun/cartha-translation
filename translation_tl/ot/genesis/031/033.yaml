revisions:
- from: Kaya pumasok si Laban sa tolda ni Jacob, sa tolda ni Lea, at sa tolda ng dalawang alilang babae, ngunit hindi niya natagpuan ang mga iyon.[a] Pagkatapos, lumabas siya sa tolda ni Lea at pumasok sa tolda ni Raquel.
  to: Pumasok si Laban sa tolda ni Jacob, at sa tolda ni Lea, at sa tolda ng dalawang aliping babae, ngunit wala siyang natagpuan.[a] Pagkatapos ay lumabas siya sa tolda ni Lea at pumasok sa tolda ni Raquel.
  rationale: Inalis ang “mga iyon” upang mapanatili ang hindi tahasang layon ng Hebreo. Ginamit ang “wala siyang natagpuan,” na natural sa Tagalog ngunit hindi pinapangalanan ang hinahanap; pinananatili ng talababa ang kontekstuwal na paglilinaw. Inayos din ang “alilang babae” bilang “aliping babae” para sa mas tuwirang modernong gamit.
