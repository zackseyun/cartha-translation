  yaml_path: translation/ot/genesis/031/031.yaml
  text: Then Jacob answered and said to Laban[a], “Because I was afraid, for I said[b], ‘Lest you take your daughters from me by force.’”
translation:
  language: tl
  text: Sumagot si Jacob kay Laban, “Dahil natakot ako. Sinabi ko sa sarili ko, ‘Baka agawin mo sa akin ang mga anak mong babae.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן יַעֲקֹב וַיֹּאמֶר לְלָבָן
  choice: Sumagot si Jacob kay Laban
  rationale: Ang magkatambal na ‘sumagot at nagsabi’ ay karaniwang pormula sa salaysay na Hebreo. Sapat at mas natural sa modernong Tagalog ang ‘sumagot,’ habang malinaw pa rin ang pagpapakilala sa tugon ni Jacob.
- source_word: כִּי יָרֵאתִי
  choice: Dahil natakot ako
  rationale: Ang unang כִּי ay nagbibigay ng dahilan, at ang יָרֵאתִי ay tuwirang nagpapahayag ng takot ni Jacob.
- source_word: כִּי אָמַרְתִּי
  choice: Sinabi ko sa sarili ko
  rationale: Literal na ‘sapagkat sinabi ko,’ ngunit malinaw sa konteksto na panloob na pagsasalita ito. Pinananatili ng salin ang ideya ng ‘pagsasabi’ habang likas na ipinahahayag sa Tagalog ang iniisip ni Jacob.
- source_word: פֶּן
  choice: Baka
  rationale: Ipinahahayag nito ang kinatatakutang posibleng mangyari; natural at malinaw na katumbas sa modernong Tagalog ang ‘baka.’
- source_word: תִּגְזֹל
  choice: agawin
  rationale: Ang גזל ay may diwa ng marahas o maling pagkuha. Mas tumpak ang ‘agawin’ kaysa sa payak na ‘kunin’ at hindi na nangangailangan ng dagdag na pariralang ‘nang sapilitan.’
- source_word: אֶת־בְּנוֹתֶיךָ מֵעִמִּי
  choice: mo sa akin ang mga anak mong babae
  rationale: Ang ‘sa akin’ ay naghahayag ng paglalayo mula sa piling ni Jacob, at ang ‘mga anak mong babae’ ay malinaw na tumutukoy sa mga anak ni Laban nang hindi umaasa sa posibleng malabong ‘mga anak mo.’
