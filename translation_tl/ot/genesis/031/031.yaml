translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Iniiwasan ang di-likas na dobleng pormulang ‘sumagot at sinabi’ at pinipili ang ‘agawin’ upang mapanatili sa mismong teksto ang lakas ng pandiwang Hebreo.
