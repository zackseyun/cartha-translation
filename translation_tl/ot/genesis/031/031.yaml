  source_fidelity: 'Tumpak na naihahatid ng salin ang lohika ng Hebreo: ipinaliwanag ni Jacob na siya ay natakot dahil inakala niyang maaaring agawin ni Laban ang mga anak nitong babae mula sa kanya. Ang “agawin” ay angkop na nagpapakita ng masidhi at maling pagkuha na nasa גזל, at ang “sa akin” ay sapat na nagsasaad ng pag-aalis mula sa piling ni Jacob.'
  naturalness: Likas at malinaw ang modernong Tagalog. Ang “Sinabi ko sa sarili ko” ay idiomatikong paraan upang ipahayag ang panloob na pagsasabi/pag-iisip na ipinahihiwatig ng konteksto, nang hindi nawawala ang pandiwang “sinabi.” Ang pag-iwas sa dobleng “sumagot at nagsabi” ay katanggap-tanggap sa natural na Tagalog na salaysay.
  terminology: Wasto ang mga pangalan na Jacob at Laban. Ang “mga anak mong babae” ay malinaw at pinananatili ang kaugnayan ni Laban kina Lea at Raquel. Walang terminong teolohikal o footnote anchor na nangangailangan ng pagbabago sa talatang ito.
