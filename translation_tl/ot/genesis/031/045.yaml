  text: וַ/יִּקַּ֥ח יַעֲקֹ֖ב אָ֑בֶן וַ/יְרִימֶ֖/הָ מַצֵּבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/045.yaml
  text: Then Jacob took a stone and set it up as a pillar[a].
translation:
  language: tl
  text: Pagkatapos, kumuha si Jacob ng isang bato at itinayo iyon bilang isang haliging bato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakatayong bato” o “batong pang-alaala.” Ang Hebreong מַצֵּבָה ay tumutukoy sa isang batong itinindig bilang pananda o haligi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kumuha
  rationale: Ang Qal wayyiqtol ng לקח ay karaniwang nangangahulugang “kumuha.” Natural ito sa salaysay at hindi ipinapalagay na pinulot lamang ang bato.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa makabagong salin sa Filipino.
- source_word: אָבֶן
  choice: isang bato
  rationale: Isahan ang pangngalan; likas sa Filipino ang “isang bato” upang ipahayag ang di-tiyak na isang bagay.
- source_word: וַיְרִימֶהָ
  choice: itinayo iyon
  rationale: Ipinahihiwatig ng pandiwa at ng pambabaeng hulapi na ang batong nabanggit ang itinaas o itinindig. Ang “itinayo iyon” ay natural na Filipino para sa pagtatayo ng isang nakatayong pananda.
- source_word: מַצֵּבָה
  choice: bilang isang haliging bato
  rationale: Ang מַצֵּבָה ay isang batong itinindig bilang haligi o pananda. Nililinaw ng “haliging bato” ang materyal at anyo nang hindi pa tiyak na tinatawag itong pang-alaala.
theological_decisions:
- issue: Ang מַצֵּבָה ay maaaring magkaroon ng gamit na pang-alaala o panrelihiyon depende sa konteksto.
  choice: haliging bato
  alternative: nakatayong bato; batong pang-alaala
  rationale: Inilalarawan lamang ng talata ang pisikal na pagtatayo ng bato. Hindi nito tahasang sinasabi rito ang tiyak na kahulugang panrelihiyon o pang-alaala, kaya pinanatiling bukas ang gamit nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iyon” sa halip na “ito” upang likas na tumukoy pabalik sa batong nabanggit; ang “haliging bato” ay mas tiyak kaysa sa “haligi” lamang.
