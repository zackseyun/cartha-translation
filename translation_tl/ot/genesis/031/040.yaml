  text: By day the heat consumed me[a], and the frost by night, and my sleep fled from my eyes.
translation:
  language: tl
  text: 'Ganito ang kalagayan ko: sa araw ay nilalamon ako ng matinding init, at sa gabi naman ay ng hamog na nagyelo; at nawawala ang tulog ko sa mga mata ko.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִיתִי
  choice: Ganito ang kalagayan ko
  rationale: Ipinahahayag ang panimulang pandiwang “ako ay/naroon ako” bilang paglalarawan sa kalagayan ni Jacob, sa natural na modernong Tagalog.
- source_word: בַיּוֹם
  choice: sa araw
  rationale: Likas at maikling panandang pamanahon na itinatambal sa “sa gabi.”
- source_word: אֲכָלַנִי
  choice: nilalamon ako
  rationale: Pinananatili ang matingkad na metapora ng Hebreong אכל, “kumain/lumamon,” para sa matinding epekto ng panahon.
- source_word: חֹרֶב
  choice: matinding init
  rationale: Sa konteksto ng pagkakalantad at kaibahan sa nagyeyelong hamog sa gabi, tumutukoy ito sa nakapapasong tuyong init.
- source_word: וְקֶרַח
  choice: at ... hamog na nagyelo
  rationale: Ang קֶרַח ay yelo o nagyeyelong lamig; ang pariralang ito ay natural sa Tagalog at angkop sa kondisyong panggabi.
- source_word: בַּלָּיְלָה
  choice: sa gabi naman
  rationale: Pinananatili ang paralelismo at malinaw na kaibahan sa “sa araw.”
- source_word: וַתִּדַּד
  choice: tumatakas
  rationale: Pinananatili ang personipikasyon at diwa ng paglayo o pagtakas ng tulog.
- source_word: שְׁנָתִי
  choice: ang tulog ko
  rationale: Tuwiran at karaniwang modernong Tagalog para sa kalagayan ng pagtulog.
- source_word: מֵעֵינָי
  choice: mula sa aking mga mata
  rationale: Pinananatili ang Hebreong larawan para sa kawalan ng tulog.
