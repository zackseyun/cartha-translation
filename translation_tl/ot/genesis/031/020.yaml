  text: And Jacob deceived Laban the Aramean by not telling him that he was fleeing[a].
translation:
  language: tl
  text: Nilinlang ni Jacob si Laban na Arameo nang hindi niya ipinaalam kay Laban na tumatakas si Jacob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na pagsasalin, “ninakaw ni Jacob ang puso ni Laban na Arameo.” Isa itong idyomang Hebreo na nangangahulugang nilinlang niya si Laban o kumilos siyang palihim upang hindi ito makapaghanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְנֹב ... אֶת־לֵב
  choice: Nilinlang
  rationale: Ang literal na “ninakaw ang puso” ay isang idyomang Hebreo para sa palihim na pagkilos upang malinlang o hindi mapaghandaan ng isang tao ang ginawa. Inihahatid ng “nilinlang” ang diwang ito nang hindi nagpapahiwatig ng pagnanakaw ng pagmamahal.
- source_word: לָבָן הָאֲרַמִּי
  choice: si Laban na Arameo
  rationale: Tuwirang tinutukoy ng הָאֲרַמִּי ang etniko o heograpikong pagkakakilanlan ni Laban bilang Arameo.
- source_word: עַל בְּלִי הִגִּיד לוֹ
  choice: nang hindi niya sinabi rito
  rationale: 'Natural na ipinahahayag sa Tagalog ang paraan o kalagayan ng panlilinlang: hindi ipinaalam ni Jacob kay Laban ang kanyang ginagawa.'
- source_word: כִּי בֹרֵחַ הוּא
  choice: na tumatakas siya
  rationale: Pinananatili ng “tumatakas” ang nagpapatuloy o kasalukuyang aspekto ng participle at ang diwa ng palihim na pag-alis.
