  yaml_path: translation/ot/genesis/031/030.yaml
  text: And now[a], you have indeed gone away, because you longed greatly for your father's house. Why did you steal my gods?
translation:
  language: tl
  text: At ngayon, talagang umalis ka dahil sabik na sabik ka sa bahay ng iyong ama. Bakit mo ninakaw ang aking mga diyos[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “aking mga diyos ng sambahayan.” “Aking mga diyos” lamang ang literal na sinasabi ng Hebreo, ngunit sa konteksto ay malamang na tumutukoy ito sa mga rebultong sinasamba sa sambahayan ni Laban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na וְ at ang panandang pangdiskurso at pamanahon na עַתָּה.
- source_word: הָלֹךְ הָלַכְתָּ
  choice: talagang umalis ka
  rationale: Ang infinitive absolute na kasunod ng pandiwang may takdang anyo ay nagbibigay-diin sa pag-alis; natural itong naipahahayag sa Filipino sa pamamagitan ng “talagang.”
- source_word: כִּי
  choice: dahil
  rationale: Ipinakikilala nito ang dahilang kinikilala ni Laban sa pag-alis ni Jacob.
- source_word: נִכְסֹף נִכְסַפְתָּה
  choice: sabik na sabik ka
  rationale: Ang inuulit na kayarian ay nagpapahayag ng matinding pananabik; ang “sabik na sabik” ay natural at nagpapanatili ng diin.
- source_word: לְבֵית אָבִיךָ
  choice: makabalik sa bahay ng iyong ama
  rationale: Ipinahahayag ng “bahay ng iyong ama” ang tuwirang diwang pampamilya ng parirala, habang nililinaw ng “makabalik” ang patutunguhang ipinahihiwatig ng לְ sa konteksto.
- source_word: לָמָּה גָנַבְתָּ
  choice: Pero bakit mo ninakaw
  rationale: Ang “bakit” ay tuwirang tanong; ang “pero” ay natural na nagpapakita ng biglang paglipat mula sa pagkilala sa dahilan ng pag-alis tungo sa paratang.
- source_word: אֶת אֱלֹהָי
  choice: ang aking mga diyos
  rationale: Tuwirang pinananatili ang maramihang “aking mga diyos” sa halip na isingit sa pangunahing teksto ang mas tiyak na paliwanag na mga diyos ng sambahayan.
theological_decisions:
- issue: Paglalarawan sa אֱלֹהָי sa pananalita ni Laban
  choice: aking mga diyos
  alternative: aking mga diyos ng sambahayan
  rationale: “Aking mga diyos” lamang ang tahasang sinasabi ng Hebreo. Malamang na tumutukoy ito sa mga rebulto o diyos ng sambahayan ni Laban ayon sa konteksto, ngunit inilalagay ang paglilinaw na iyon sa talababa upang hindi dagdagan ang pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “sabik na sabik” upang natural na maipakita ang mariing kayarian ng Hebreo, at pinanatili ang “mga diyos” nang hindi pinapahina o muling binibigyang-kahulugan ang paratang ni Laban.
