translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “hagkan” sa halip na mas kolokyal na “halikan” upang panatilihin ang payak at dignified na himig; hindi idinagdag ang “bilang pamamaalam” dahil ipinahihiwatig lamang iyon ng konteksto.
