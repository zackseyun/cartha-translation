  text: And you did not let me kiss my sons and my daughters[a]. Now you have acted foolishly.
translation:
  language: tl
  text: At hindi mo ako hinayaang hagkan ang aking mga anak na lalaki at mga anak na babae.[a] Ngayon, hangal ang ginawa mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na salin: “hindi mo ako iniwan upang hagkan ang aking mga anak na lalaki at mga anak na babae.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטַשְׁתַּנִי
  choice: hindi mo man lamang ako hinayaang
  rationale: Bagaman karaniwang nangangahulugang “iwan” o “pabayaan” ang pandiwa, sa pagkakaugnay nito sa pawatas na “hagkan” ay ipinahihiwatig nitong hindi binigyan ng pagkakataon si Laban. Likas sa modernong Tagalog ang “hinayaang,” at ipinakikita ng “man lamang” ang himig ng kanyang reklamo.
- source_word: לְנַשֵּׁק
  choice: hagkan
  rationale: Tuwirang nangangahulugang “hagkan” ang salita. Ipinahihiwatig ng konteksto na pamamaalam ito, ngunit hindi iyon tahasang nakasaad sa Hebreo.
- source_word: לְבָנַי וְלִבְנֹתָי
  choice: ang aking mga anak na lalaki at mga anak na babae
  rationale: Tahasan at magkahiwalay na binabanggit sa Hebreo ang mga anak na lalaki at mga anak na babae, kaya pinanatili ang dalawang katawagan sa halip na pagsamahin bilang “mga anak.”
- source_word: עַתָּה
  choice: ngayon
  rationale: Pinananatili ang payak na panandang temporal o diskurso, ngunit inilagay sa hulihan upang maging mas natural ang daloy sa Tagalog.
- source_word: הִסְכַּלְתָּ עֲשׂוֹ
  choice: Talagang naging hangal ang ginawa mo
  rationale: Ipinahahayag ng parirala na hangal ang naging pagkilos ni Jacob. Ang pagkakabuo ay natural at mariin sa Tagalog habang malapit sa diwa ng Hebreo.
