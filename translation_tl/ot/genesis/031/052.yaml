  text: עֵ֚ד הַ/גַּ֣ל הַ/זֶּ֔ה וְ/עֵדָ֖ה הַ/מַּצֵּבָ֑ה אִם אָ֗נִי לֹֽא אֶֽעֱבֹ֤ר אֵלֶ֨י/ךָ֙ אֶת הַ/גַּ֣ל הַ/זֶּ֔ה וְ/אִם אַ֠תָּה לֹא תַעֲבֹ֨ר אֵלַ֜/י אֶת הַ/גַּ֥ל הַ/זֶּ֛ה וְ/אֶת הַ/מַּצֵּבָ֥ה הַ/זֹּ֖את לְ/רָעָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/052.yaml
  text: This heap is a witness[a], and the pillar is a witness, that I will not pass over this heap toward you[c][b], and that you will not pass over this heap and this pillar toward me for harm.
translation:
  language: tl
  text: Saksi ang bunton na ito, at saksi rin ang haliging ito, na hindi ako tatawid sa bunton na ito papunta sa iyo, at hindi ka rin tatawid sa bunton na ito at sa haliging ito papunta sa akin upang manakit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “upang manakit” ay nangangahulugang pagtawid na may masama o mapaminsalang layunin, hindi simpleng pagtawid lamang sa hangganan.
    reason: cultural_note
lexical_decisions:
- source_word: עֵד / וְעֵדָה
  choice: saksi / saksi rin
  rationale: Magkapantay na inilalarawan ng dalawang sugnay ang bunton at haligi bilang mga saksi sa kasunduan; pinananatili ang personipikasyong nasa Hebreo.
- source_word: גַּל
  choice: bunton
  rationale: Tumutukoy sa bunton ng mga batong itinayo bilang tanda ng hangganan; malinaw ito sa konteksto nang hindi nagdaragdag sa mismong teksto.
- source_word: מַצֵּבָה
  choice: haligi
  rationale: Isang itinayong batong pananda ang tinutukoy; ang “haligi” ay maikli, dignified, at pamilyar sa modernong Tagalog.
- source_word: אִם ... אִם
  choice: na ... at ... rin
  rationale: Sa konteksto ng panunumpa, ipinakikilala ng אִם ang mga itinatakdang pinatutunayan ng mga pananda, hindi lamang mga karaniwang kondisyon.
- source_word: אֶעֱבֹר / תַעֲבֹר
  choice: tatawid
  rationale: Ipinahihiwatig ng pandiwa ang pagtawid sa hangganang kinakatawan ng mga batong pananda.
- source_word: אֵלֶיךָ / אֵלַי
  choice: papunta sa iyo / papunta sa akin
  rationale: Pinananatili ang direksiyonal na kahulugan at hindi agad ipinapasok ang mas matinding “laban sa,” sapagkat ang masamang layunin ay tahasang sinasabi sa hulihan.
- source_word: לְרָעָה
  choice: upang manakit
  rationale: Likas na Filipino para sa pagtawid na may layuning makapinsala o gumawa ng masama; hindi nito ipinagbabawal ang lahat ng pisikal na pagtawid.
theological_decisions:
- issue: Saklaw ng לְרָעָה sa dalawang magkatulad na pagbabawal
  choice: 'Unawain itong tumutukoy sa kapuwa panig: bawal tumawid nang may layuning manakit.'
  alternative: Iugnay lamang ang parirala sa ikalawang pagbabawal dahil nasa hulihan ito ng pangungusap.
  rationale: Ang magkatimbang na estruktura at konteksto ng kasunduang pangkapayapaan ay nagpapakitang ang masamang layunin ang ipinagbabawal sa kapuwa panig, bagaman nasa dulo lamang ang parirala sa Hebreo.
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na paralelismo. Ginamit ang “bunton” at “haligi” bilang maiikling tawag sa dalawang batong pananda; ang talababa ay naglilinaw sa saklaw ng pagbabawal nang hindi pinabibigat ang pangunahing teksto.
