base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/019.yaml
  text: Laban had gone to shear his flock[a], and Rachel stole the household idols that belonged to her father.
translation:
  language: tl
  text: Umalis na si Laban upang gupitan ang kanyang kawan, at ninakaw ni Raquel ang mga diyus-diyosan ng sambahayan[a] na pag-aari ng kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: mga terafim; maaari ring isaling “mga diyos ng sambahayan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלַךְ
  choice: Pumunta
  rationale: Ang anyong qatal ay nagbibigay ng pangyayaring nasa likuran ng pangunahing kilos. Sa natural na salaysay sa Tagalog, malinaw sa pagkakasunod ng mga sugnay na wala si Laban nang kumilos si Raquel, nang hindi kailangang magdagdag ng salitang wala sa Hebreo.
- source_word: לִגְזֹז
  choice: upang gupitan
  rationale: Tumutukoy ito sa paggupit ng balahibo ng mga hayop sa kawan; ang “gupitan” ang natural at tiyak na pandiwang Tagalog sa kontekstong ito.
- source_word: צֹאנוֹ
  choice: ang kanyang kawan
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Pinananatili ng “kawan” ang kolektibong diwa nang hindi nililimitahan sa tupa lamang.
- source_word: וַתִּגְנֹב
  choice: ninakaw
  rationale: Tuwirang nangangahulugang magnakaw ang גנב. Pinananatili ng “ninakaw” ang moral at legal na bigat ng kilos sa halip na palambutin ito bilang lihim na pagkuha.
- source_word: הַתְּרָפִים
  choice: ang mga diyus-diyosan ng sambahayan
  rationale: Ang תְּרָפִים ay mga bagay o imaheng panrelihiyon na kaugnay ng isang sambahayan. Malinaw sa karaniwang mambabasa ang “mga diyus-diyosan ng sambahayan,” habang inilalagay sa talababa ang transliterasyon at isa pang posibleng salin.
- source_word: אֲשֶׁר לְאָבִיהָ
  choice: na pag-aari ng kanyang ama
  rationale: Ipinahahayag ng parirala ang pagmamay-ari. Natural at malinaw sa modernong Tagalog ang “na pag-aari ng kanyang ama.”
- source_word: וְ
  choice: at
  rationale: Ang pang-ugnay ay pinanatili bilang payak na “at,” nang hindi nagdaragdag ng tahasang panandang pamanahon gaya ng “ngayon” o “noon.”
theological_decisions:
- issue: Paglalarawan sa תְּרָפִים bilang mga bagay na ginagamit sa pagsamba sa sambahayan
  choice: mga diyus-diyosan ng sambahayan
  alternative: mga terafim; mga diyos ng sambahayan
  rationale: Ipinakikita ng pangunahing salin ang panrelihiyong gamit ng mga bagay at ang kaugnayan ng mga ito sa sambahayan, ngunit hindi nito higit na tinutukoy ang anyo o tiyak na tungkulin ng mga ito kaysa sa pinahihintulutan ng salitang Hebreo. Ang mga alternatibo ay inilagay sa talababa upang mapanatili ang leksikal na pagiging bukas.
translation_notes:
  register: Gumamit ng modernong, marangal, at madaling maunawaang Tagalog. Ang “Raquel” ay ang karaniwang anyong Filipino ng pangalang Rachel. Inilagay ang talababa sa mismong terminong tinutukoy nito, hindi sa “kawan.”
