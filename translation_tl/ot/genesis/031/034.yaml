  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/רָחֵ֞ל לָקְחָ֣ה אֶת הַ/תְּרָפִ֗ים וַ/תְּשִׂמֵ֛/ם בְּ/כַ֥ר הַ/גָּמָ֖ל וַ/תֵּ֣שֶׁב עֲלֵי/הֶ֑ם וַ/יְמַשֵּׁ֥שׁ לָבָ֛ן אֶת כָּל הָ/אֹ֖הֶל וְ/לֹ֥א מָצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/034.yaml
  text: Rachel had taken the household idols[a], put them in the camel’s saddle cushion, and sat on them. Laban felt through the whole tent[c][b], but did not find them.
translation:
  language: tl
  text: Kinuha na ni Raquel ang mga diyus-diyosan ng sambahayan[a], inilagay ang mga iyon sa sapin ng siyahan ng kamelyo[b], at inupuan niya ang mga iyon. Kinapa ni Laban ang buong tolda, ngunit hindi niya natagpuan ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga terafim” o “mga diyos ng sambahayan.” Ang salitang Hebreo ay tumutukoy sa mga kultikong bagay na ginagamit sa sambahayan.
    reason: lexical_alternative
  - marker: b
    text: O “sa siyahan ng kamelyo.” Malamang na tumutukoy ang Hebreo sa malambot at may sapin na bahagi ng kagamitang pansakay sa kamelyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: mga diyus-diyosan ng sambahayan
  rationale: Ang תְּרָפִים ay mga bagay na ginagamit sa pagsamba sa loob ng sambahayan. Malinaw sa karaniwang mambabasa ang saling ito at hindi nito itinatago ang uri ng mga bagay sa isang di-pamilyar na transliterasyon.
- source_word: בְּכַר הַגָּמָל
  choice: sa kutson ng siyahan ng kamelyo
  rationale: Karaniwang tumutukoy ang כַּר sa isang kutson o malambot at may sapin na bahagi. Sa konteksto, ito ay bahagi ng kagamitang pansakay sa kamelyo.
- source_word: וַתֵּשֶׁב עֲלֵיהֶם
  choice: at inupuan niya ang mga iyon
  rationale: Pinananatili nito ang sunod-sunod na kilos at ang kongkretong paraan ng pagtatago ni Raquel sa mga bagay.
- source_word: וַיְמַשֵּׁשׁ
  choice: Kinapa
  rationale: Ipinahihiwatig ng pandiwa ang paghahanap sa pamamagitan ng paghipo, hindi lamang ang pangkalahatang paghahanap.
- source_word: כָּל הָאֹהֶל
  choice: ang buong tolda
  rationale: Ito ang natural at tuwirang katumbas ng pariralang tumutukoy sa kabuuan ng tolda.
- source_word: וְלֹא מָצָא
  choice: ngunit hindi niya natagpuan ang mga iyon
  rationale: Ipinahahayag ng “ngunit” ang salungat na kinalabasan ng paghahanap, at ang ipinahiwatig na layon ay nilinaw bilang mga diyus-diyosan.
- source_word: וְרָחֵל לָקְחָה
  choice: Kinuha na ni Raquel
  rationale: Ang “na” ay likas na paraan sa Tagalog upang ipakitang naganap na ang pagkuha bago ang paghahanap ni Laban, nang hindi nagdaragdag ng hayag na salitang katumbas ng “ngayon.”
theological_decisions:
- issue: Paglalarawan sa תְּרָפִים bilang mga diyus-diyosan
  choice: mga diyus-diyosan ng sambahayan
  alternative: mga terafim; mga diyos ng sambahayan
  rationale: Tumutukoy ang salita sa mga kultikong bagay o representasyon ng mga diyos sa sambahayan. Ang “diyus-diyosan” ay malinaw at angkop sa salaysay, habang pinananatili sa talababa ang mas literal na pangalan at ibang posibleng paglalarawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sambahayan” sa halip na mas kolokyal na “bahay” upang ipahiwatig na ang mga bagay ay kaugnay ng kulto o pagsamba ng buong sambahayan. Ang “Kinapa” ay sadyang nagpapanatili sa pandamang diin ng Hebreong pandiwa.
