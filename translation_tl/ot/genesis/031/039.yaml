  text: I did not bring to you an animal torn by beasts[a]; I myself bore the loss of it. You required it from my hand[b], whether stolen by day or stolen by night.
translation:
  language: tl
  text: Hindi ko dinala sa iyo ang hayop na nilapa ng mabangis na hayop; ako mismo ang pumasan sa pagkawala nito.[a] Sinisingil mo sa akin ang ninakaw sa araw at ang ninakaw sa gabi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ako ang nagbayad para rito” o “ako ang sumagot sa pagkawala nito.” Ang pandiwang Hebreo rito ay may diwa ng pagpasan ng pananagutan sa nawawalang hayop.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “Hiningi mo iyon mula sa aking kamay—ang ninakaw sa araw at ang ninakaw sa gabi.” Ang “mula sa aking kamay” ay idyomang Hebreo para sa personal na pananagutan.'
    reason: idiom_and_syntax
lexical_decisions:
- source_word: טְרֵפָה
  choice: hayop na nilapa ng mabangis na hayop
  rationale: Sa kontekstong pastoral, tumutukoy ito sa alagang hayop na pinatay o nilapa ng maninila. Pinananatili ng salin ang kongkretong larawan sa Hebreo.
- source_word: הֵבֵאתִי אֵלֶיךָ
  choice: Hindi ko dinala sa iyo
  rationale: Tuwirang inilalarawan ng parirala ang hindi pagdadala ni Jacob kay Laban; nauunawaan ang layon mula sa naunang 'hayop na nilapa.'
- source_word: אָנֹכִי
  choice: ako mismo
  rationale: Pinananatili nito ang diin ng malayang panghalip sa pagtatanggol ni Jacob.
- source_word: אֲחַטֶּנָּה
  choice: ako mismo ang pumasan sa pagkawala nito
  rationale: Ang Piel ng חטא rito ay tumutukoy sa pananagutan o pagsagot sa nawalang hayop, hindi sa moral na pagkakasala. Likas sa Filipino ang 'pumasan sa pagkawala' at hindi nito nililimitahan ang diwa sa aktuwal na pagbabayad lamang.
- source_word: מִיָּדִי תְּבַקְשֶׁנָּה
  choice: Sinisingil mo sa akin
  rationale: Ipinahihiwatig ng idyomang Hebreo ang paghingi ng pananagutan. Mas natural sa modernong Tagalog ang 'sinisingil mo sa akin' kaysa literal na 'hinahanap mo mula sa aking kamay.'
- source_word: גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה
  choice: ang ninakaw sa araw at ang ninakaw sa gabi
  rationale: Pinananatili ang additive na 'at' ng Hebreo at itinuturing ang dalawang parirala bilang mga layon ng pagsingil, sa halip na gawing disjunctive na 'maging...o.'
