translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'nilapa' upang ilarawan ang pinsalang dulot ng mabangis na hayop, at 'sinisingil' upang natural na ihatid ang pananagutang ipinapataw kay Jacob. Pinanatili ang magkahiwalay at additive na pagtukoy sa mga ninakaw sa araw at gabi.
