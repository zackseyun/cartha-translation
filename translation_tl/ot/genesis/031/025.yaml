base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/025.yaml
  text: And Laban caught up with Jacob[a]. Now Jacob had pitched his tent in the hill country[c][b], and Laban pitched with his kinsmen in the hill country of Gilead.
translation:
  language: tl
  text: Naabutan ni Laban si Jacob. Si Jacob ay nakapagtayo na ng kanyang tolda sa kabundukan[a], at nagkampo si Laban kasama ang kanyang mga kamag-anak[b] sa kabundukan ng Gilead[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa bundok” o “sa mga bundok.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga kapatid niya”; dito, malamang na tumutukoy sa mga kamag-anak o kasapi ng kanyang angkan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa Bundok Gilead” o “sa mga bundok ng Gilead.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשֵּׂג
  choice: Naabutan
  rationale: Ipinahihiwatig ng pandiwa ang paghabol hanggang maabutan ang isang tao; natural sa makabagong Tagalog ang “naabutan” at hindi nito ipinapalagay na nabihag si Jacob.
- source_word: תָּקַע ... אָהֳלוֹ
  choice: naitayo na ... ang tolda niya
  rationale: Ang tambalang Hebreo ay idyoma para sa pagtatayo ng tolda. Ipinakikita ng “naitayo na” na nakahimpil na si Jacob nang maabutan siya ni Laban.
- source_word: בָּהָר
  choice: sa kabundukan
  rationale: Maaaring tumukoy ang הַר sa isang bundok o sa isang mataas at mabundok na rehiyon. Ang “kabundukan” ay natural at angkop sa heograpikal na tagpo, habang pinananatili sa talababa ang ibang posibilidad.
- source_word: תָּקַע אֶת אֶחָיו
  choice: nagkampo ... kasama ang mga kamag-anak niya
  rationale: 'Elliptical ang pariralang Hebreo: ang literal na anyo ay gumagamit ng pandiwang kaugnay ng pagtatayo ng tolda at ng pangkat na kasama ni Laban. Ang “nagkampo ... kasama” ay malinaw sa Tagalog nang hindi nagdaragdag ng tahasang maramihang “mga tolda.”'
- source_word: אֶחָיו
  choice: mga kamag-anak niya
  rationale: Literal itong “mga kapatid niya,” ngunit maaaring mas malawak ang saklaw ng salitang Hebreo at tumukoy sa mga kaanak o kasapi ng angkan; ito ang mas malamang na diwa sa pangkat na kasama ni Laban.
- source_word: בְּהַר הַגִּלְעָד
  choice: sa kabundukan ng Gilead
  rationale: Ang pariralang konstrukto ay maaaring unawain bilang isang bundok o bilang mabundok na rehiyon ng Gilead. Ang “kabundukan ng Gilead” ay malinaw at natural sa konteksto.
