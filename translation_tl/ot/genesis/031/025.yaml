translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tolda” at “nagkampo” bilang karaniwang salitang madaling maunawaan, at pinanatili sa mga talababa ang tunay na heograpikal at leksikal na mga alternatibo ng Hebreo.
