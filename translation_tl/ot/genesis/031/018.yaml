base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/018.yaml
  text: And he drove all his livestock and all his possessions that he had acquired—the livestock he had acquired in Paddan-aram—to go to Isaac his father in the land of Canaan[a].
translation:
  language: tl
  text: Dinala niya ang lahat ng kanyang mga alagang hayop at ang lahat ng mga pag-aaring nakuha niya—ang mga alagang hayop na nakuha niya sa Padan-Aram—upang magtungo sa kanyang amang si Isaac sa lupain ng Canaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patungo sa lupain ng Canaan.” Gumagamit ang Hebreo ng anyong nagsasaad ng direksiyon, na literal na “patungong Canaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְהַג
  choice: Itinaboy niya
  rationale: Ang נהג ay tumutukoy sa pagpapakilos ng mga hayop mula sa likuran o pagpapasunod sa mga ito; natural sa kontekstong pastoral ang “itinaboy.”
- source_word: מִקְנֵהוּ
  choice: kanyang mga alagang hayop
  rationale: Saklaw ng מִקְנֶה ang sama-samang pag-aari niyang mga hayop, hindi lamang baka; malinaw at karaniwan sa modernong Filipino ang parirala.
- source_word: רְכֻשׁוֹ
  choice: kanyang ari-arian
  rationale: Ang רְכוּשׁ ay malawak na tumutukoy sa mga pag-aari o kayamanan, lalo na sa naililipat na kagamitan at yaman.
- source_word: רָכָשׁ
  choice: natamo
  rationale: Ipinahihiwatig ng pandiwa ang pagtatamo o pagkakaroon ng pag-aari. Inuulit ang “natamo” upang mapanatili ang kapansin-pansing pag-uulit sa Hebreo.
- source_word: מִקְנֵה קִנְיָנוֹ
  choice: ang mga alagang hayop na natamo niya
  rationale: Natural na Filipino ito habang pinananatili ang pagbibigay-diin ng Hebreong parirala sa mga hayop na naging pag-aari niya.
- source_word: בְּפַדַּן אֲרָם
  choice: sa Padan-Aram
  rationale: Pangalan ng lugar ito kaya tinumbasan sa karaniwang transliterasyong Filipino.
- source_word: לָבוֹא אֶל יִצְחָק אָבִיו
  choice: upang pumunta sa kanyang amang si Isaac
  rationale: Ang infinitive na לָבוֹא ay nagsasaad ng layunin o patutunguhan; ang ayos na “kanyang amang si Isaac” ay malinaw at marangal sa Filipino.
- source_word: אַרְצָה כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Ang hulaping direksiyonal na ־ָה ay nagpapahiwatig ng pagkilos patungo sa Canaan. Sa pangunahing teksto, natural na nakakabit ang parirala sa kinaroroonan ni Isaac, habang nililinaw sa talababa ang direksiyonal na pagbasa.
