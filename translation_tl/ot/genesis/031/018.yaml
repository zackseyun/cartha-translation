translation_notes:
  register: Makabago at madaling maunawaang Filipino, ngunit pinanatili ang marangal na himig at ang sadyang pag-uulit ng orihinal. Ginamit ang “itinaboy” para sa pastoral na kilos at “dinala” para luminaw na ang ari-arian, bukod sa mga hayop, ay kasama sa paglalakbay.
