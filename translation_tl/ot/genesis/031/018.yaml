revisions:
- from: Itinaboy niya ang lahat ng kanyang mga alagang hayop at dinala ang lahat ng ari-ariang natamo niya—ang mga alagang hayop na natamo niya sa Padan-Aram—upang pumunta sa kanyang amang si Isaac sa lupain ng Canaan.[a]
  to: Dinala niya ang lahat ng kanyang mga alagang hayop at ang lahat ng mga pag-aaring nakuha niya—ang mga alagang hayop na nakuha niya sa Padan-Aram—upang magtungo sa kanyang amang si Isaac sa lupain ng Canaan.[a]
  rationale: Pinalitan ang dalawang pandiwa ng iisang “Dinala niya” upang tumugma sa iisang pandiwa sa Hebreo at upang maging natural ang saklaw na kapwa hayop at mga pag-aari. Pinalitan ang “ari-ariang natamo” ng “mga pag-aaring nakuha” para sa mas karaniwang modernong Filipino, habang pinanatili ang pag-uulit ng pandiwang “nakuha.”
