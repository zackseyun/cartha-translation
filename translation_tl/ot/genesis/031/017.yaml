  yaml_path: translation/ot/genesis/031/017.yaml
  text: Then Jacob arose and put his sons and his wives on the camels[a].
translation:
  language: tl
  text: Pagkatapos, tumindig si Jacob at isinakay sa mga kamelyo[a] ang kanyang mga anak na lalaki at ang kanyang mga asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ibabaw ng mga kamelyo.” Sa kontekstong ito, maaaring ipahayag nang ganito ang Hebreong pang-ukol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Ang anyong wayyiqtol ng קום ay nagpapasulong sa salaysay at tumutukoy sa pagbangon upang kumilos. Likas at marangal sa Filipino ang “tumindig” sa kontekstong ito.
- source_word: וַיִּשָּׂא
  choice: isinakay
  rationale: Bagaman pangunahing nangangahulugang “buhatin” o “dalhin” ang נשׂא, kasama ng עַל הַגְּמַלִּים ay ipinahihiwatig nito ang pagpapasakay o paglalagay sa ibabaw ng mga kamelyo. Pinakanatural dito ang “isinakay.”
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na panlalaking maramihan ang בנים; pinananatili ng salin ang kasariang tahasang nasa Hebreo.
- source_word: נָשָׁיו
  choice: ang kanyang mga asawa
  rationale: Sa konteksto, ang maramihan ng אשה na may pagtukoy kay Jacob bilang may kaugnayan ay malinaw na nangangahulugang kanyang mga asawa.
- source_word: עַל הַגְּמַלִּים
  choice: sa mga kamelyo
  rationale: Sa pandiwang “isinakay,” natural na ipinapahayag ng “sa” ang paggalaw patungo sa ibabaw ng mga kamelyo. Maaaring gawing tahasan ang ibabaw sa alternatibong salin.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pagkatapos” upang natural na ihatid ang sunod-sunod na kilos sa salaysay, at “isinakay” upang idiomatikong maipahayag ang kilos nang hindi nawawala ang kahulugan ng Hebreo.
