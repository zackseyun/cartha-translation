base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/026.yaml
  text: Then Judah recognized them and said[a], “She is more righteous than I[b], because I did not give her to Shelah my son.” And he did not know her again.
translation:
  language: tl
  text: Nakilala ni Juda ang mga iyon at sinabi niya, “Mas matuwid siya kaysa sa akin,[a] sapagkat hindi ko siya ibinigay sa anak kong si Sela.” Hindi na muling sumiping si Juda sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Mas nasa tama siya kaysa sa akin.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “hindi na niya siya muling nakilala”; isang eupemismo ang “kilalanin” para sa pakikipagtalik.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: Nakilala ... ang mga iyon
  rationale: Tumutukoy ang pandiwa sa pagkilala ni Juda sa mga bagay na panagot na ipinakita sa naunang talata. Idinagdag ang “ang mga iyon” upang maging malinaw ang bagay na kinilala.
- source_word: צָדְקָה מִמֶּנִּי
  choice: Mas matuwid siya kaysa sa akin
  rationale: Pinananatili nito ang paghahambing at ang moral na puwersa ng salitang mula sa ugat na צדק, nang hindi ipinahihiwatig na ganap na walang kasalanan si Tamar.
- source_word: כִּי עַל כֵּן
  choice: sapagkat
  rationale: Likas na ipinapahayag sa Filipino ang sanhi o paliwanag na ibinibigay ni Juda.
- source_word: לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי
  choice: hindi ko siya ibinigay sa anak kong si Sela
  rationale: Malapit ito sa anyo ng Hebreo; malinaw sa konteksto na ang pagbibigay ay para sa pag-aasawa.
- source_word: וְלֹא יָסַף עוֹד לְדַעְתָּהּ
  choice: hindi na siya muling sinipingan ni Juda
  rationale: Ang “sinipingan” ay isang marangal at nauunawaang eupemismo para sa pakikipagtalik. Ipinahihiwatig ng “hindi na ... muling” na wala nang sumunod na relasyong seksuwal.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: שֵׁלָה
  choice: Sela
  rationale: Ginamit ang likas na transliterasyon sa Filipino.
theological_decisions:
- issue: Ang moral na pagtatasa sa pag-amin ni Juda
  choice: Kinikilala ni Juda na mas matuwid si Tamar kaysa sa kanya sa usaping ito.
  alternative: Maaaring unawain bilang “mas nasa tama siya kaysa sa akin,” na higit na nakatuon sa pagiging makatwiran ng kanyang ginawa.
  rationale: Pahambing at nakabatay sa partikular na pangyayari ang pahayag. Pinananatili ng salin ang moral na bigat ng צדק nang hindi ito ginagawang pahayag na lubos na walang kasalanan si Tamar.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paghahambing sa pag-amin ni Juda at ginamit ang “sinipingan” bilang dignified na eupemismong madaling maunawaan. Lahat ng panandang talababa ay nasa mismong teksto at tumutugma sa kani-kanilang paliwanag.
