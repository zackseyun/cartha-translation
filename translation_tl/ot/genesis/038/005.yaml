  yaml_path: translation/ot/genesis/038/005.yaml
  text: She conceived again and bore a son[a], and she called his name Shelah[b]. And he was at Chezib when she bore him.
translation:
  language: tl
  text: Muli siyang nagdalang-tao at nagsilang ng isang anak na lalaki, at pinangalanan niya itong Sela. Nasa Kezib[b] siya[a] nang isilang ng babae ang batang iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Panlalaki ang anyong Hebreo para sa “siya,” at maaaring tumukoy kay Juda. Gayunman, ayon sa ilang sinaunang saksi at tagapagpaliwanag, “ang babae ay nasa Kezib.” Walang ipinakikitang kasarian ang panghalip na “siya” sa Tagalog.
    reason: alternative_reading
  - marker: b
    text: Ang Kezib ay isinusulat ding Chezib sa ibang mga transliterasyon; iisang lugar ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף עוֹד וַתֵּלֶד בֵּן
  choice: Muli siyang nagsilang ng isang anak na lalaki
  rationale: Ang וַתֹּסֶף עוֹד ay idyomang nagsasaad ng pag-ulit ng kilos. Ang “muli siyang nagsilang” ay natural sa Tagalog at hindi nagdaragdag ng tahasang paglilihi na wala sa mismong Hebreo.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ שֵׁלָה
  choice: at pinangalanan niya itong Sela
  rationale: Natural na katumbas sa modernong Tagalog ng literal na “tinawag niya ang pangalan nito.” Ginamit ang “Sela” bilang payak na transliterasyong Filipino ng שֵׁלָה.
- source_word: וְהָיָה
  choice: Nasa … siya
  rationale: Ang panghalip na “siya” sa Tagalog ay hindi nagpapakita ng kasarian, kaya napapanatili nito ang tunay na pag-aalinlangan tungkol sa tinutukoy ng panlalaking anyo sa tekstong Hebreo.
- source_word: בִכְזִיב
  choice: sa Kezib
  rationale: Ang pang-ukol na “sa” ang likas na pananda ng lokasyon sa Tagalog. Ang Kezib ay transliterasyon ng pangalang-lugar כְזִיב.
- source_word: בְּלִדְתָּהּ אֹתוֹ
  choice: nang isilang niya ang bata
  rationale: 'Ipinapahayag ng בְּ kasama ng infinitive construct ang panahon: “nang isilang niya siya.” Ang “ang bata” ay mas malinaw at natural kaysa sa magkasunod na mga panghalip sa Tagalog.'
theological_decisions:
- issue: Ang tinutukoy ng panlalaking וְהָיָה (“at siya ay naroon”)
  choice: Pinanatili sa pangunahing teksto ang walang-kasariang “siya,” at ipinaliwanag ang suliranin sa talababa.
  alternative: Tukuyin si Juda bilang nasa Kezib, o sundin ang ilang sinaunang saksi na ang babae ang nasa Kezib.
  rationale: Panlalaki ang anyo sa tekstong Masoretiko at maaaring tumukoy kay Juda, ngunit may mga sinaunang saksi at tagapagpaliwanag na inuunawa itong pambabae. Hindi dapat tahimik na lutasin ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Iniwasan ang lipas na “ipinanganak” bilang aktibong kilos ng ina at ang sobrang literal na “tinawag ang pangalan.” Ang walang-kasariang “siya” ay kapaki-pakinabang sa pagpapanatili ng kalabuan ng pinagmulan.
