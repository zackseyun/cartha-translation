base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/014.yaml
  text: So she took off her widow’s garments from herself, and wrapped herself in a veil, and sat at the entrance to Enaim, which is on the road to Timnah. For she saw that Shelah had grown up, yet she had not been given to him as a wife.
translation:
  language: tl
  text: Kaya hinubad niya ang mga damit ng pagkabalo niya, tinakpan niya ang sarili ng belo at nagbalot siya, at naupo sa pasukan ng Enaim, na nasa daan patungong Timna. Sapagkat nakita niyang lumaki na si Sela, ngunit hindi siya ibinigay na asawa ni Sela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: kanyang damit-pambalo
  rationale: Likas at maikli sa modernong Tagalog para sa mga kasuotang nagpapakita ng kalagayan niya bilang balo.
- source_word: וַתְּכַס בַּצָּעִיף וַתִּתְעַלָּף
  choice: nagtalukbong at nagbalot ng belo
  rationale: 'Pinananatili ang dalawang kilos sa Hebreo: pagtatakip sa pamamagitan ng belo at pagbabalot/pagkukubli ng sarili.'
- source_word: בְּפֶתַח עֵינַיִם
  choice: sa pasukan ng Enaim
  rationale: Tinatrato ang עֵינַיִם bilang pangalang pantangi, ayon sa konteksto at sa konsultasyong salin, habang pinananatili ang literal na ideya ng פתח bilang pasukan.
- source_word: תִּמְנָתָה
  choice: patungong Timna
  rationale: Ang direksiyonal na hulapi ay ipinahahayag ng 'patungong'; ginagamit ang karaniwang anyong Filipino ng pangalan.
- source_word: גָדַל שֵׁלָה
  choice: malaki na si Sela
  rationale: Sa konteksto, nangangahulugang nasa hustong gulang na; ang natural na Tagalog na 'malaki na' ay nagpapanatili ng payak na pahayag.
theological_decisions:
- issue: Dahilan ng pagkilos ni Tamar
  choice: Sapagkat nakita niyang malaki na si Sela, ngunit hindi pa siya ibinibigay dito bilang asawa.
  alternative: Sapagkat nakita niyang malaki na si Sela, at hindi siya ibinigay dito bilang asawa.
  rationale: Ang 'ngunit' ay natural na naghahayag ng kontrast na nasa konteksto nang hindi nagdaragdag ng motibo o moral na paghatol.
- issue: Paglalarawan sa pagbabalatkayo
  choice: nagtalukbong at nagbalot ng belo
  alternative: nagbalatkayo bilang babaeng bayaran
  rationale: Hindi tahasang sinasabi ng talata na nagbihis siya bilang babaeng bayaran; iniiwasang ipasok ang interpretasyong nagmumula sa kasunod na pangyayari.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang sunod-sunod na kilos at ang kawalang-tiyak na etikal o motibasyonal na hindi tahasang nilulutas ng Hebreo.
