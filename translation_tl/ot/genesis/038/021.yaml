base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/021.yaml
  text: He asked the men of her place[a], saying, “Where is the cult prostitute who was at Enaim by the road?” But they said[b], “There has been no cult prostitute here.”
translation:
  language: tl
  text: Tinanong niya ang mga lalaki roon[a], “Nasaan ang babaeng bayaran sa kulto na nasa Enaim[b], sa tabi ng daan?” Sumagot sila, “Walang babaeng bayaran sa kulto rito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang mga lalaki ng lugar niya.” Hindi tinutukoy ng Hebreo kung kanino eksaktong tumutukoy ang “niya.”
    reason: literal_rendering
  - marker: b
    text: Ang Enaim ay pangalan ng lugar. Kaugnay ang anyong Hebreo nito sa salitang nangangahulugang “mga mata,” at maaari ring iugnay sa “mga bukal.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Tinanong niya
  rationale: Likas na salaysay sa modernong Tagalog para sa wayyiqtol ng שׁאל; malinaw na ipinagpapatuloy ang kilos ng sugo mula sa konteksto.
- source_word: אַנְשֵׁי מְקֹמָהּ
  choice: ang mga lalaki roon
  rationale: Idyomatikong katumbas ng ‘mga lalaki ng lugar niya/iyon’; iniiwasan ang alanganing literal na ‘mga lalaki ng kanyang lugar’ habang pinananatili ang lokal na pagtukoy.
- source_word: לֵאמֹר
  choice: '[ipinahihiwatig ng tuwirang sipi]'
  rationale: Hindi kailangang isalin nang hiwalay ang pormulang Hebreo na ‘na sinasabi’ dahil natural na ipinakikilala ng ‘Tinanong’ ang tuwirang tanong sa Tagalog.
- source_word: הַקְּדֵשָׁה
  choice: babaeng bayaran sa kulto
  rationale: Pinananatili ang pagkakaiba nito sa karaniwang זֹנָה at ang ugnay sa gawaing pangkulto, nang hindi ipinapalagay na may partikular na gusaling templo.
- source_word: בָעֵינַיִם
  choice: sa Enaim
  rationale: Itinuturing na pangalan ng lugar ayon sa konteksto ng Genesis 38:14, hindi literal na ‘mga mata’ o ‘mga bukal.’
- source_word: עַל הַדָּרֶךְ
  choice: sa tabi ng daan
  rationale: Natural at malinaw na lokatibong salin ng עַל הַדָּרֶךְ sa tagpong ito.
- source_word: לֹא הָיְתָה בָזֶה קְדֵשָׁה
  choice: Walang naging babaeng bayaran sa kulto rito
  rationale: Tapat na ipinahahayag ang pagtanggi ng mga tagaroon na may ganoong babae sa lugar; pinananatili ng ‘naging’ ang aspektong nakaraan ng הָיְתָה.
theological_decisions:
- issue: Ang tiyak na katangian ng קְדֵשָׁה
  choice: babaeng bayaran sa kulto
  alternative: babaeng bayaran sa templo; babaeng naglilingkod sa dambana
  rationale: Ipinahihiwatig ng termino ang ugnay sa gawaing pangkulto, ngunit hindi tahasang binabanggit ng talata ang isang templo o ang eksaktong institusyonal na tungkulin niya. Kaya hindi dapat gawing mas tiyak kaysa sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘babaeng bayaran sa kulto’ upang maiba sa pangkalahatang katawagang ‘babaeng bayaran’ sa ibang bahagi ng kabanata at upang hindi ipalagay ang isang partikular na templong gusali. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
