revisions:
- from: Tinanong niya ang mga lalaki roon[a], “Nasaan ang babaeng bayaran sa kulto na dating nasa Enaim[b], sa tabi ng daan?” Sumagot sila, “Walang naging babaeng bayaran sa kulto rito.”
  to: Tinanong niya ang mga lalaki roon[a], “Nasaan ang babaeng bayaran sa kulto na nasa Enaim[b], sa tabi ng daan?” Sumagot sila, “Walang babaeng bayaran sa kulto rito.”
  rationale: Inalis ang “dating,” na nagdaragdag ng pansamantalang o nakaraang kahulugan na wala sa tanong. Pinalitan ang hindi idiomatikong “Walang naging” ng tuwirang lokal na pagtanggi. Pinanatili ang terminong “babaeng bayaran sa kulto” at ang mga talababa, habang nililinaw sa talababa a ang hindi tiyak na reperensiya ng panghalip nang hindi ipinapataw ang isang interpretasyon.
