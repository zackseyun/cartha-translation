  verdict: revise
  source_fidelity: Ang pangunahing diwa ay naipasa, kabilang ang paulit-ulit na kilos at layuning huwag maglaan ng supling para sa kapatid. Gayunman, ang “itatapon niya sa lupa” ay nagpapahiwatig ng paghahagis at walang malinaw na layon; hindi nito mahusay na isinasalin ang וְשִׁחֵת אַרְצָה, na tumutukoy sa pagsira/pagsasayang ng semilya sa lupa upang maiwasan ang paglilihi. Ang “magiging anak” ay masyadong tiyak at paulit-ulit; ang זרע sa una at huling sugnay ay kolektibong “supling,” na may legal na pagkakabilang sa namatay na kapatid.
  naturalness: Natural at marangal ang “sumisiping,” ngunit mas malinaw at natural sa modernong Filipino ang “ang supling ay hindi maibilang sa kanya” kaysa “hindi magiging kanya ang magiging anak.” Ang “ibinubuhos niya ang kanyang binhi sa lupa” ay isang mahinahong ngunit malinaw na pananalitang akma sa konteksto.
  terminology: Panatilihin ang “supling” para sa זרע sa mga legal/pampamilyang sugnay. Gamitin ang “binhi” sa pisikal na kilos, na ipinaliliwanag sa talababa bilang semilyang ipinagkait upang maiwasan ang paglilihi. Hindi ito nagdaragdag ng doktrinal na hatol.
