base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/009.yaml
  text: But Onan knew that the offspring would not be his[a]; so whenever he went in to his brother’s wife, he spilled it on the ground[b], so as not to give offspring to his brother.
translation:
  language: tl
  text: Ngunit alam ni Onan na ang supling ay hindi maibilang sa kanya[a]. Kaya, tuwing sumisiping siya sa asawa ng kanyang kapatid, ibinubuhos niya ang kanyang binhi sa lupa[b], upang hindi siya magbigay ng supling para sa kanyang kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “binhi” sa dalawang sugnay; dito ay tumutukoy ito sa supling o tagapagmana sa konteksto ng pag-aasawa upang magkaanak para sa namatay na kapatid.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “sinira niya [ito] patungo sa lupa.” Hindi tahasang binabanggit ng Hebreo ang layon, ngunit inilalarawan nito ang ginawa ni Onan upang pigilan ang paglilihi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: alam
  rationale: Tuwirang salin ng ידע sa pagsasalaysay; likas sa modernong Filipino.
- source_word: הַזָּרַע
  choice: ang magiging anak
  rationale: Bagaman literal na “binhi,” tumutukoy rito ang salita sa supling o tagapagmana sa konteksto ng pag-aasawa para sa namatay na kapatid.
- source_word: לֹּא לוֹ יִהְיֶה הַזָּרַע
  choice: hindi magiging kanya ang magiging anak
  rationale: 'Pinananatili nito ang legal at pampamilyang diwa: ang isisilang ay ibibilang sa namatay na kapatid, hindi kay Onan.'
- source_word: וְהָיָה אִם־בָּא
  choice: Kaya tuwing
  rationale: Ipinahihiwatig ng konstruksiyon ang paulit-ulit o nakaugaliang kilos sa nakaraan.
- source_word: בָּא אֶל־אֵשֶׁת אָחִיו
  choice: sumisiping siya sa asawa ng kanyang kapatid
  rationale: Ang “sumiping” ay malinaw ngunit marangal na eupemismo para sa pakikipagtalik at natural sa Filipino.
- source_word: וְשִׁחֵת אַרְצָה
  choice: itinatapon niya sa lupa
  rationale: Ipinapahayag ang sinadyang pagsayang o pagsira na pumipigil sa paglilihi, nang hindi ginagawang higit na tahasan kaysa sa Hebreo.
- source_word: לְבִלְתִּי נְתָן זֶרַע לְאָחִיו
  choice: upang hindi siya magbigay ng anak sa kanyang kapatid
  rationale: Malinaw na layuning sugnay; ang “anak” ay angkop sa tungkuling maglaan ng supling para sa namatay na kapatid.
theological_decisions:
- issue: Ang kahulugan ng זרע at ang uri ng ginawa ni Onan
  choice: Isinalin ang זרע bilang “anak” sa mga sugnay tungkol sa supling, at ang וְשִׁחֵת אַרְצָה bilang “itinatapon niya sa lupa.”
  alternative: Gamitin ang “binhi” sa lahat ng paglitaw, o tahasang sabihing “ibinubuhos niya ang kanyang semilya sa lupa.”
  rationale: Magkaugnay ngunit magkaiba ang legal na usapin ng supling para sa namatay na kapatid at ang pisikal na paraang ginamit ni Onan upang pigilan ang paglilihi. Nililinaw ng salin ang dalawa nang hindi nagdaragdag ng doktrinal o moral na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sumiping” bilang mahinahong eupemismo at “anak” upang malinaw na maipahayag ang kontekstong pampamilya at legal.
