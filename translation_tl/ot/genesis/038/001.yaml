translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taga-Adulam” sa halip na isang di-pamilyar na katawagang etniko, at pinanatili ang pangalang Juda at Hira ayon sa karaniwang anyong Filipino.
