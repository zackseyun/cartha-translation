  source_fidelity: Kailangang panatilihin sa pangunahing teksto ang direksiyonal na diwa ng וַיֵּרֶד (“bumaba”) at ang paglihis ng וַיֵּט (“lumihis/bumaling”). Ang kasalukuyang “humiwalay” at “nagtungo” ay nagpapahayag ng pangkalahatang resulta ngunit hindi ang dalawang tiyak na kilos sa Hebreo.
  naturalness: Malinaw at angkop ang rehistro ng draft. Gayunman, ang “Noong panahong iyon” ay mas tuwirang natural na panimulang pormula, at ang binagong pangungusap ay nananatiling madaling basahin sa modernong Filipino.
  terminology: Ang “Juda,” “Hira,” at “lalaking taga-Adulam” ay angkop. Ang “lalaking taga-Adulam” ay wastong kumakatawan sa אִישׁ עֲדֻלָּמִי nang hindi ipinapasok ang di-tiyak na karagdagang kahulugan.
