  text: At that time Judah went down from his brothers and turned aside to a certain Adullamite whose name was Hirah[a][b].
translation:
  language: tl
  text: Noong panahong iyon, bumaba si Juda mula sa piling ng kanyang mga kapatid at lumihis patungo sa isang lalaking taga-Adulam na ang pangalan ay Hira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: Nang panahong iyon
  rationale: Likas na panimulang panahunan sa modernong Tagalog; ipinahihiwatig nito ang pormulang pasalaysay nang hindi ginagawang mabigat ang pangungusap.
- source_word: וַיֵּרֶד ... מֵאֵת אֶחָיו
  choice: humiwalay ... sa kanyang mga kapatid
  rationale: Sa konteksto, ang pagbaba ay kasabay ng paglayo ni Juda sa kanyang mga kapatid. Inilalantad ng salin ang malinaw na diwa ng paghihiwalay; inilalagay sa talababa ang mas pormal na heograpikong ‘bumaba.’
- source_word: וַיֵּט עַד
  choice: nagtungo sa
  rationale: Ipinahahayag nang natural sa Tagalog ang pagkilos ni Juda patungo sa taong binanggit. Ang literal na ‘lumihis patungo sa’ ay maaaring magpahiwatig ng hindi sinasadyang paglihis na hindi tiyak sa Hebreo.
- source_word: אִישׁ עֲדֻלָּמִי
  choice: isang lalaking taga-Adulam
  rationale: Pinananatili ang אִישׁ at ang pagkakakilanlan batay sa pinagmulan nang malinaw at natural sa Tagalog.
- source_word: וּשְׁמוֹ חִירָה
  choice: na ang pangalan ay Hira
  rationale: Direktang inililipat ang sugnay na nagpapakilala sa pangalan, sa natural na ayos ng Tagalog.
