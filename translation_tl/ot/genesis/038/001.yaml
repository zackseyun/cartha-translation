    rationale: Ang talababa ay inuulit lamang ang kinakailangang salin at walang natitirang mahalagang alternatibong kailangang iangkla.
  revised_text: Noong panahong iyon, bumaba si Juda mula sa piling ng kanyang mga kapatid at lumihis patungo sa isang lalaking taga-Adulam na ang pangalan ay Hira.
