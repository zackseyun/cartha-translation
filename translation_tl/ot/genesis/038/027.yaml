  text: Nang dumating ang oras ng kanyang panganganak, may kambal pala sa kanyang sinapupunan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Nang dumating ang oras
  rationale: Ipinapahayag ng parirala ang pagdating ng takdang panahon sa daloy ng salaysay. Natural ito sa makabagong Tagalog at hindi nagdaragdag ng tahasang salitang katumbas ng “ngayon.”
- source_word: לִדְתָּהּ
  choice: ng kanyang panganganak
  rationale: Ang infinitive construct mula sa ילד na may hulaping pambabae ay tumutukoy sa kanyang panganganak; malinaw at karaniwan ang nominal na anyong ito sa Tagalog.
- source_word: וְהִנֵּה
  choice: naroon nga
  rationale: Pinananatili ng “nga” ang pansin at bahagyang pagkagulat na hatid ng הִנֵּה, habang natural na ipinakikilala ng “naroon” ang natuklasang kalagayan.
- source_word: תְאוֹמִים
  choice: ang kambal
  rationale: Tuwirang katumbas ng pangngalan ang “kambal,” na likas nang tumutukoy sa dalawang sanggol na sabay na dinadala o ipinanganak.
- source_word: בְּבִטְנָהּ
  choice: sa kanyang sinapupunan
  rationale: Bagaman maaaring mangahulugang tiyan ang בֶּטֶן, sa konteksto ng panganganak ay tiyak at marangal ang “sinapupunan.”
