  text: And he said[a], “I will send a young goat from the flock.” And she said, “If you will give a pledge until you send it.”
translation:
  language: tl
  text: At sinabi niya, “Magpapadala ako ng isang batang kambing mula sa kawan.” Sumagot siya, “Kung magbibigay ka ng panagot[a] hanggang sa ipadala mo ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “deposito” o “garantiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִי עִזִּים
  choice: isang batang kambing
  rationale: Ang pariralang konstrukto ay tumutukoy sa isang batang mula sa mga kambing. Likas at malinaw sa makabagong Tagalog ang “batang kambing.”
- source_word: מִן הַצֹּאן
  choice: mula sa kawan
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Dahil tukoy nang kambing ang hayop, sapat at natural ang “kawan.”
- source_word: עֵרָבוֹן
  choice: panagot
  rationale: Tumutukoy ito sa bagay na pansamantalang ibinibigay bilang katiyakan na tutuparin ang ipinangako. Ang “panagot” ay maikli, dignificado, at angkop sa konteksto.
- source_word: עַד שָׁלְחֶךָ
  choice: hanggang sa maipadala mo iyon
  rationale: Ang hulapi ay ikalawang panauhang panlalaki at tumutukoy sa gagawing pagpapadala ni Juda. Ang “iyon” ay likas na tumutukoy sa ipinangakong batang kambing.
- source_word: אִם תִּתֵּן
  choice: Kung magbibigay ka
  rationale: Pinananatili nito ang tahasang kondisyong ipinahayag ni Tamar nang hindi dinaragdagan ang di-nakasulat na layon.
- source_word: אָנֹכִי אֲשַׁלַּח
  choice: Magpapadala ako
  rationale: Naipapahayag ng ayos na ito ang pangako at likas sa Tagalog; hindi kailangang hiwalay na tumbasan ang bahagyang diin ng malayang panghalip.
