base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/008.yaml
  text: Then Judah said to Onan[a], “Go in to your brother’s wife, perform the duty of a brother-in-law to her, and raise up offspring for your brother.”
translation:
  language: tl
  text: Sinabi ni Juda kay Onan, “Sumiping ka sa asawa ng iyong kapatid. Gampanan mo sa kanya ang tungkulin ng isang bayaw[a], at magbigay ka ng supling para sa iyong kapatid.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas teknikal na pananalita, “gampanan mo sa kanya ang tungkulin ng levirato.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na pasulong na daloy ng salaysay sa Filipino; sapat nang ipinahihiwatig ng pagkakasunod ng mga pangyayari ang waw-consecutive.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyo ng pangalang biblikal sa modernong Tagalog.
- source_word: בֹּא אֶל
  choice: Sipingan mo
  rationale: Malinaw at dignified na ipinahahayag ang idyomang tumutukoy sa pakikipagtalik sa konteksto ng pag-aasawa, nang hindi gumagamit ng malabo o masagwang pananalita.
- source_word: אֵשֶׁת אָחִיךָ
  choice: ang asawa ng iyong kapatid
  rationale: Tuwiran at natural na salin ng pariralang konstruktibo.
- source_word: וְיַבֵּם אֹתָהּ
  choice: Gampanan mo sa kanya ang tungkulin ng isang bayaw
  rationale: Ipinapakita ang teknikal na tungkuling pampamilya ng bayaw nang hindi umaasa sa di-pamilyar na terminong akademiko o nililimitahan ito sa pag-aasawa lamang.
- source_word: וְהָקֵם
  choice: magkaroon ka
  rationale: Sa ugnay nito sa זֶרַע, natural na ipinahahayag ang layuning magluwal ng supling na magpapatuloy sa angkan ng namatay na kapatid.
- source_word: זֶרַע
  choice: supling
  rationale: Malinaw na tumutukoy sa anak o inapo sa kontekstong ito, habang iniiwasan ang literal ngunit malabong “binhi.”
- source_word: לְאָחִיךָ
  choice: para sa iyong kapatid
  rationale: Pinananatili ang diwa na ang supling ay ibibilang o magpapatuloy sa linya ng namatay na kapatid.
theological_decisions:
- issue: Paglalahad ng terminong ukol sa tungkulin ng bayaw nang hindi ipinapasok ang mas huling legal o denominasyonal na pagpapaliwanag
  choice: Gampanan mo sa kanya ang tungkulin ng isang bayaw
  alternative: Pakitunguhan mo siya ayon sa batas ng pag-aasawa ng bayaw
  rationale: Ang pandiwang יִבֵּם ay teknikal na tumutukoy sa pananagutan ng bayaw na magbigay ng supling para sa namatay na kapatid. Pinananatili ng pangunahing salin ang pampamilya at obligasyong diwa, samantalang inilalagay sa talababa ang mas teknikal na paglalarawan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sipingan” upang maging malinaw ang seksuwal na idyoma nang hindi masagwa, at “tungkulin ng isang bayaw” upang maipaliwanag ang teknikal na pandiwang Hebreo sa karaniwang mambabasa.
