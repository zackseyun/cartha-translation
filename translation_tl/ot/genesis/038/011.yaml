base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/011.yaml
  text: Then Judah said to Tamar his daughter-in-law[a], “Remain a widow in your father’s house until my son Shelah grows up,” for he said, “Lest he also die like his brothers.” So Tamar went and lived in her father’s house.
translation:
  language: tl
  text: Pagkatapos nito, sinabi ni Juda kay Tamar, na kanyang manugang, “Manatili kang balo sa bahay ng iyong ama hanggang sa lumaki ang anak kong si Sela.” Sapagkat sinabi niya sa sarili[a], “Baka mamatay din siya tulad ng kanyang mga kapatid.” Kaya umalis si Tamar at nanirahan sa bahay ng kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sinabi niya.” Sa Hebreo, maaari rin itong magpakilala ng iniisip o sinasabi ng isang tao sa sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי אַלְמָנָה
  choice: Manatili kang balo
  rationale: Pinagsasama nito ang pautos na anyo ng ישׁב at ang kalagayang אַלְמָנָה. Natural ito sa modernong Tagalog at pinananatili ang utos ni Juda na manatili si Tamar sa kalagayan ng pagkabalo.
- source_word: בֵית אָבִיךְ
  choice: sa bahay ng iyong ama
  rationale: Karaniwang salin ito ng idyomang Hebreo para sa paninirahan sa sambahayan ng ama.
- source_word: עַד יִגְדַּל שֵׁלָה בְנִי
  choice: hanggang sa lumaki ang anak kong si Sela
  rationale: Ang יִגְדַּל ay tumutukoy sa paglaki o pag-abot sa hustong gulang; hindi na idinagdag sa teksto ang tahasang interpretasyong handa na siyang mag-asawa.
- source_word: כִּי אָמַר
  choice: Sapagkat sinabi niya sa sarili
  rationale: Literal na 'sinabi niya' ang Hebreo, ngunit sa konteksto ay ipinakikilala nito ang panloob na pangangatwiran ni Juda. Nililinaw ito ng natural na ekspresyong Tagalog habang itinatala sa talababa ang mas literal na anyo.
- source_word: פֶּן
  choice: Baka
  rationale: Natural at malinaw na ipinahahayag ng 'baka' ang pangambang ipinakikilala ng פֶּן.
- source_word: כְּאֶחָיו
  choice: tulad ng kanyang mga kapatid
  rationale: Pinananatili nito ang tahasang paghahambing sa sinapit ng mga kapatid ni Sela.
- source_word: וַתֵּשֶׁב
  choice: nanirahan
  rationale: Sa daloy ng salaysay, ipinahihiwatig ng pandiwa ang patuloy na paninirahan, hindi lamang pansamantalang pananatili.
- source_word: כַּלָּתוֹ
  choice: kanyang manugang
  rationale: Ang כַּלָּה ay tumutukoy rito sa babaeng manugang ni Juda; sapat at natural sa konteksto ang 'manugang.'
- source_word: בֵּית אָבִיהָ
  choice: bahay ng kanyang ama
  rationale: Tumutugma ito sa naunang parirala at pinananatili ang diwa ng paninirahan sa sambahayan ng ama.
theological_decisions:
- issue: Kung ang כִּי אָמַר ay binigkas nang malakas o panloob na sinabi ni Juda
  choice: sinabi niya sa sarili
  alternative: sinabi niya
  rationale: Ipinakikita ng konteksto na dahilan o pangamba ito ni Juda, ngunit tunay na malawak ang gamit ng Hebreong אָמַר. Kaya pinili ang natural na panloob na pananalita at pinanatili sa talababa ang literal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Sela,” ang karaniwang anyong Tagalog ng pangalang Shelah, at iniwasan ang masyadong makalumang mga salitang gaya ng “tumahan” at “nangamba na baka.”
