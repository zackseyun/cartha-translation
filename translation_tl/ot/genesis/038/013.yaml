  text: And Tamar was told[a], saying, “Look, your father-in-law is going up to Timnah to shear his sheep.”
translation:
  language: tl
  text: At sinabihan si Tamar[a], “Tingnan mo, umaakyat ang biyenan mong lalaki patungong Timnah upang gupitan ang kanyang mga tupa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ipinaalam kay Tamar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: may nagsabi
  rationale: Ang Hophal na anyo ay pasibo at hindi tinutukoy ang tagapagbalita. Natural sa modernong Tagalog ang di-tiyak na aktibong pariralang “may nagsabi,” habang pinananatiling hindi kilala ang nagsabi.
- source_word: לְתָמָר
  choice: kay Tamar
  rationale: Tinutukoy nito ang tumanggap ng balita; pinanatili ang pangalang Tamar.
- source_word: לֵאמֹר
  choice: ipinakilala sa pamamagitan ng tuwirang sipi
  rationale: Karaniwang pormula ito sa pagpapakilala ng sinabi. Sa natural na Tagalog, sapat itong katawanin ng kuwit at panipi sa halip na idagdag ang mabigat na “na sinasabi.”
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Tinatawag nito ang pansin ni Tamar sa balita at pinananatili ang ikalawang panauhang pambabae ng konteksto nang natural sa Tagalog.
- source_word: חָמִיךְ
  choice: iyong biyenang lalaki
  rationale: Pinananatili ang tiyak na ugnayang pampamilya at ang pambabaeng isahang kausap na si Tamar.
- source_word: עֹלֶה
  choice: umaahon
  rationale: Ang Qal participle ay nagpapahiwatig ng kasalukuyan o nalalapit na paggalaw; pinananatili ng “umaahon” ang direksiyong paitaas.
- source_word: תִמְנָתָה
  choice: patungong Timnah
  rationale: Ang directional he ay likas na naipapahayag sa Tagalog sa pamamagitan ng “patungong.”
- source_word: לָגֹז
  choice: upang gupitan
  rationale: Ipinapahayag ng infinitive construct na may ל ang layunin ng pagpunta.
- source_word: צֹאנוֹ
  choice: kanyang mga tupa
  rationale: Bagaman maaaring mangahulugan ang צאן ng kawan ng maliliit na hayop, ang konteksto ng paggugupit ay natural na tumutukoy sa mga tupa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “biyenang lalaki” upang malinaw na tukuyin ang father-in-law, at iniwasan ang arkaiko o masyadong literal na “narito” para sa הִנֵּה.
