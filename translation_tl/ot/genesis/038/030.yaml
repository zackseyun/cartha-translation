  text: Afterward his brother came out[a], with the scarlet thread on his hand[b], and he called his name Zerah.
translation:
  language: tl
  text: Pagkatapos, lumabas ang kapatid niyang lalaki, na may iskarlatang sinulid sa kamay[a], at tinawag niya siyang Zera.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang iskarlata” ang nasa kamay niya; ang “sinulid” ay isinusuplay mula sa agarang konteksto sa talata 28.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “at tinawag niya ang pangalan nito na Zera.” Hindi tahasang tinutukoy rito kung sino ang nagpangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Pagkatapos
  rationale: Ipinahahayag nito ang kasunod na pangyayari sa payak at natural na modernong Tagalog.
- source_word: יָצָא
  choice: lumabas
  rationale: Karaniwang kahulugan ng pandiwa at angkop sa konteksto ng panganganak.
- source_word: אָחִיו
  choice: ang kapatid niya
  rationale: Tuwirang salin ng katawagang pampamilya; malinaw sa konteksto na kakambal na lalaki ang tinutukoy.
- source_word: אֲשֶׁר עַל יָדוֹ הַשָּׁנִי
  choice: na may matingkad na pulang sinulid sa kamay
  rationale: Ginawang natural na sugnay sa Tagalog. Ang “sinulid” ay ipinahihiwatig rito at tahasang binanggit sa naunang konteksto ng talata 28.
- source_word: הַשָּׁנִי
  choice: matingkad na pulang sinulid
  rationale: Tinutukoy nito ang iskarlata o matingkad na pulang materyal; ang “sinulid” ay isinusuplay mula sa agarang konteksto upang maging malinaw.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: at pinangalanan siyang
  rationale: Natural na Tagalog para sa Hebreong idyomang “tinawag ang pangalan niya.” Hindi nito sapilitang tinutukoy kung sino ang nagpangalan, yamang hindi malinaw sa konteksto ang tinutukoy na panlalaking simuno.
- source_word: זָרַח
  choice: Zera
  rationale: Karaniwang anyong Tagalog ng personal na pangalang Hebreo na Zerah.
