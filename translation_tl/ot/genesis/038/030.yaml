  terminology: Gamitin ang “iskarlata/iskarlatang sinulid” para sa שָׁנִי, habang malinaw na ipinababatid ng talababa na ellipsis ang “sinulid.” Panatilihin ang pangalang “Zera,” isang katanggap-tanggap na anyong Tagalog ng Zerah.
