base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/018.yaml
  text: He said[a], “What pledge shall I give you?” And she said, “Your seal, your cord, and your staff that is in your hand.” So he gave them to her and went in to her[c][b], and she conceived by him.
translation:
  language: tl
  text: Sinabi niya, “Anong sangla ang ibibigay ko sa iyo?” Sumagot siya, “Ang iyong pantatak[a], ang iyong pisi, at ang tungkod na hawak mo.” Kaya ibinigay niya sa babae ang mga iyon at sumiping sa kanya[b], at naglihi ang babae sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “singsing na pantatak.” Hindi tinutukoy ng Hebreo ang eksaktong anyo ng kagamitang pantatak.
    reason: lexical_alternative
  - marker: b
    text: Ang “sumiping sa kanya” ay eupemismo para sa pakikipagtalik.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵרָבוֹן
  choice: sangla
  rationale: Tumutukoy sa bagay na iniiwan bilang garantiya hanggang sa maibigay ang napagkasunduang bayad; natural at tiyak ang “sangla” sa konteksto.
- source_word: חֹתָמְךָ
  choice: iyong pantatak
  rationale: Ang חֹתָם ay kagamitang pantatak na nagsisilbing pagkakakilanlan. Hindi tinukoy ng Hebreo kung singsing ito, kaya iniwasan ang mas espesipikong “singsing na pantatak.”
- source_word: וּפְתִילֶךָ
  choice: iyong panali
  rationale: Ang פְּתִיל ay tali o pisi, malamang na kaugnay ng pantatak. Pinananatili ng “panali” ang pangkalahatang kahulugan nang hindi nagdaragdag ng hindi tahasang detalye.
- source_word: וּמַטְּךָ אֲשֶׁר בְּיָדֶךָ
  choice: ang tungkod na hawak mo
  rationale: Ang מַטֶּה ay tungkod; likas sa modernong Tagalog ang “na hawak mo” at pinananatili nito ang konkretong larawan ng bagay na nasa kamay niya.
- source_word: וַיִּתֵּן לָּהּ
  choice: ibinigay niya sa babae ang mga iyon
  rationale: Bagaman walang tahasang panghalip na maramihan sa Hebreo, malinaw na ang tatlong hiniling na bagay ang ibinigay. Nililinaw ito ng “ang mga iyon.”
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: sumiping sa kanya
  rationale: Karaniwang Hebreong eupemismo ito para sa pakikipagtalik. Ang “sumiping sa kanya” ay dignified at malinaw na katumbas na eupemismo sa Tagalog.
- source_word: וַתַּהַר לוֹ
  choice: naglihi ang babae sa pamamagitan niya
  rationale: Ang pandiwa ay nangangahulugang maglihi o mabuntis, at ipinahihiwatig ng לוֹ na siya ang ama. Malapit ang “naglihi” sa anyo ng Hebreo, samantalang pinananatili ng “sa pamamagitan niya” ang ugnayang ipinapahayag ng parirala.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Ginamit ang “sangla” at “pantatak” para sa malinaw na konkretong mga bagay, at ang eupemismong “sumiping” upang mapanatili ang maingat na pagsasalita ng Hebreo. Inulit ang “ang babae” sa huling sugnay upang maiwasan ang malabong reperensiya ng sunod-sunod na “niya/kanya.”
