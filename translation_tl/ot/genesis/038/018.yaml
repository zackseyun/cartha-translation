revisions:
- from: Sinabi niya, “Ano ang ibibigay kong sangla sa iyo?” Sumagot siya, “Ang iyong pantatak[a], ang iyong panali, at ang tungkod na hawak mo.” Kaya ibinigay niya sa babae ang mga iyon at sumiping sa kanya[b], at naglihi ang babae sa pamamagitan niya.
  to: Sinabi niya, “Anong sangla ang ibibigay ko sa iyo?” Sumagot siya, “Ang iyong pantatak[a], ang iyong pisi, at ang tungkod na hawak mo.” Kaya ibinigay niya sa babae ang mga iyon at sumiping sa kanya[b], at naglihi ang babae sa kanya.
  rationale: Inayos ang mga pananalita para maging mas likas sa modernong Tagalog habang pinananatili ang saklaw ng Hebreo. Pinalitan ang “panali” ng “pisi” para sa פְתִיל, at ang “sa pamamagitan niya” ng “sa kanya” upang malinaw at idiomatikong maipahayag na siya ang ama. Napanatili ang maingat na eupemismo para sa וַיָּבֹא אֵלֶיהָ at ang di-pagtitiyak sa anyo ng pantatak.
