  naturalness: 'May ilang pananalitang mapapakinis: “Anong sangla ang ibibigay ko sa iyo?” ay mas likas kaysa “Ano ang ibibigay kong sangla sa iyo?”; “pisi” ay mas malinaw na katawagan sa isang cord kaysa “panali”; at “naglihi ang babae sa kanya” ay natural at marangal.'
  terminology: Ang “sangla,” “pantatak,” at “tungkod” ay angkop. Pinananatili ang “pantatak” nang hindi ipinagpapalagay na singsing ang kagamitan. Ang “sumiping sa kanya” ay katanggap-tanggap na maingat na eupemismo, na nililinaw ng talababa.
