source:
  edition: WLC
  text: וַ/יְהִ֗י עֵ֚ר בְּכ֣וֹר יְהוּדָ֔ה רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְמִתֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/007.yaml
  text: Er[a], Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
translation:
  language: tl
  text: Si Er, ang panganay ni Juda, ay masama sa paningin ni Yahweh, at pinatay siya ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “pinangyari ni Yahweh na mamatay siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ay
  rationale: Ang anyong pasalaysay ng היה ay nagsisilbing kopula rito. Hindi na nilagyan ng tahasang “ngayon” o “pagkatapos” sapagkat walang katumbas na salitang temporal sa Hebreo.
- source_word: עֵר
  choice: Er
  rationale: Isinalin sa karaniwang transliterasyon ang personal na pangalan.
- source_word: בְּכוֹר יְהוּדָה
  choice: ang panganay ni Juda
  rationale: Likas na Filipino ito para sa construct chain na nagsasaad ng ugnayang pampamilya at pagkakasunod sa kapanganakan.
- source_word: רַע
  choice: masama
  rationale: Sa kontekstong ito, moral na kasamaan ang tinutukoy, hindi lamang pagiging hindi kanais-nais o malas.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili nito ang Hebreong idyoma ng pagsusuri mula sa pananaw ni Yahweh sa malinaw at likas na Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan sa pamamagitan ng transliterasyon sa halip na palitan ito ng isang titulo.
- source_word: וַיְמִתֵהוּ
  choice: pinatay siya
  rationale: Ang Hiphil ng מות ay tahasang causative. Ang “pinatay siya” ang pinakanatural at tuwirang Filipino para sa pagkilos na iniuukol ng teksto kay Yahweh.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng titulo.
- issue: Pagkilos ni Yahweh sa pagkamatay ni Er
  choice: pinatay siya ni Yahweh
  alternative: pinangyari ni Yahweh na mamatay siya
  rationale: Tahasang iniuukol ng causative na pandiwa kay Yahweh ang pagkamatay ni Er. Hindi ito pinalalambot o dinaragdagan ng paliwanag hinggil sa paraan ng pagkamatay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na “masama” at ang tuwirang “pinatay” upang mapanatili ang bigat at tahasang banal na pagkilos sa tekstong Hebreo. Inilagay ang talababa sa pariralang tinutukoy nito.
