  source_fidelity: 'Tapat ang salin sa Hebreo: si Er ang panganay ni Juda, ang kaniyang kalagayang moral ay masama sa paghatol ni Yahweh, at tuwirang iniuugnay ng Hiphil na וַיְמִתֵהוּ ang pagkamatay ni Er sa pagkilos ni Yahweh. Hindi ito nagdaragdag ng dahilan o paraan ng pagpatay.'
  naturalness: 'Likas at malinaw ang modernong Filipino: “Si Er, ang panganay ni Juda, ay masama sa paningin ni Yahweh, at pinatay siya ni Yahweh.” Ang ayos ng mga parirala ay marangal ngunit hindi lipas.'
  terminology: Ang “Juda,” “Yahweh,” “masama,” at “sa paningin ni Yahweh” ay pare-pareho, angkop, at tapat sa mga pangunahing termino at idyoma ng pinagmulan. Ang “pinatay siya” ay isang tuwiran at natural na paghahatid ng causative na pandiwa nang hindi pinalalambot ang banal na pagkilos.
