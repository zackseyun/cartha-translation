  yaml_path: translation/ot/genesis/038/006.yaml
  text: And Judah took a wife for Er his firstborn, and her name was Tamar.
translation:
  language: tl
  text: Kumuha si Juda ng asawa para kay Er, ang kanyang panganay na anak. Tamar ang pangalan ng babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kumuha
  rationale: Karaniwang kahulugan ng לָקַח ang “kumuha.” Sa kontekstong ito, ipinahihiwatig nitong si Juda ang humanap o nagtakda ng mapapangasawa para sa kanyang anak, nang hindi labis na dinaragdagan ang sinabi ng Hebreo.
- source_word: אִשָּׁה
  choice: mapapangasawa
  rationale: Sa konteksto ng pag-aasawa, ang אִשָּׁה ay tumutukoy sa asawa. Ang “mapapangasawa” ay likas sa Filipino kapag ang ama ang kumukuha ng asawa para sa anak.
- source_word: לְעֵר
  choice: para kay Er
  rationale: Ang לְ ay nagsasaad dito ng taong pinaglalaanan ng ginawa ni Juda; malinaw at natural itong ipinapahayag ng “para kay Er.”
- source_word: בְּכוֹרוֹ
  choice: ang kanyang panganay
  rationale: Ang בְּכוֹר ay “panganay,” lalo na ang panganay na anak na lalaki sa kontekstong ito. Hindi na kailangang ulitin ang “anak” sapagkat malinaw na si Er ang tinutukoy.
- source_word: וּשְׁמָהּ
  choice: Tamar ang pangalan nito
  rationale: Ito ang natural na modernong Filipino na katumbas ng karaniwang pormulang Hebreo na “at ang pangalan niya ay.” Ginamit ang “nito” upang malinaw na tumukoy sa mapapangasawa at maiwasan ang kalituhan sa “kanyang.”
- source_word: תָּמָר
  choice: Tamar
  rationale: Pinanatili ang nakaugaliang transliterasyon ng pangalang pantangi.
