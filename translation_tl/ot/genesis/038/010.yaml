  text: וַ/יֵּ֛רַע בְּ/עֵינֵ֥י יְהוָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה וַ/יָּ֖מֶת גַּם אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/010.yaml
  text: What he did was evil in the sight of Yahweh, so he put him to death also.
translation:
  language: tl
  text: Masama sa paningin ni Yahweh ang ginawa niya, kaya pinatay din siya ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרַע
  choice: Masama
  rationale: Tuwirang ipinapahayag ang moral na pagtataya ng pandiwang רעע at hindi ito pinalalambot bilang basta ‘hindi nakalugod.’
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Likas na idyomang Tagalog ito para sa pagtataya ni Yahweh at pinananatili ang larawang ‘sa mga mata/paningin’ ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na יהוה sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר עָשָׂה
  choice: ang ginawa niya
  rationale: Natural na modernong Tagalog para sa sugnay na tumutukoy sa ginawa ni Onan sa naunang konteksto.
- source_word: וַיָּמֶת
  choice: pinatay ... ni Yahweh
  rationale: 'Ipinakikita ng Hiphil ng מות ang tuwirang sanhi o ahensiya: si Yahweh ang nagpataw ng kamatayan.'
- source_word: גַּם אֹתוֹ
  choice: din siya
  rationale: 'Pinananatili ang kaugnayan sa naunang pagkamatay ni Er: si Onan ay pinatay rin.'
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong Yahweh sa halip na gawing titulo.
- issue: Ahensiya ng Diyos sa וַיָּמֶת
  choice: kaya pinatay din siya ni Yahweh
  alternative: kaya namatay din siya; kaya hinayaan din siyang mamatay ni Yahweh
  rationale: Causative ang anyo ng pandiwa at tuwirang iniuugnay kay Yahweh ang kamatayan; hindi ito dapat gawing di-tiyak o pahintulot lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at tuwiran. Inulit ang ‘Yahweh’ sa ikalawang sugnay upang maiwasan ang malabong reperensiya ng panghalip at malinaw na mapanatili ang banal na ahensiya.
