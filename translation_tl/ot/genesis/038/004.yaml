  yaml_path: translation/ot/genesis/038/004.yaml
  text: She conceived again and bore a son, and she named him Onan.
translation:
  language: tl
  text: Muli siyang nagdalang-tao at nagsilang ng isang anak na lalaki, at pinangalanan niya itong Onan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: nagdalang-tao siya
  rationale: Ang pandiwang הרה ay tumutukoy sa paglilihi o pagbubuntis. Ang “nagdalang-tao” ay natural, malinaw, at marangal sa makabagong salaysay sa Filipino.
- source_word: עוֹד
  choice: muli
  rationale: Sa sunod-sunod na salaysay ng panganganak, ipinahihiwatig nito ang pag-uulit, kaya ang “muli” ang angkop.
- source_word: וַתֵּלֶד בֵּן
  choice: nagsilang ng isang anak na lalaki
  rationale: Tuwirang ipinapahayag ng parirala ang panganganak ng isang lalaking anak; natural at dignified ang “nagsilang” sa Filipino.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: pinangalanan niya itong
  rationale: Ang literal na idyomang Hebreo na “tinawag ang pangalan niya” ay likas na ipinapahayag sa Filipino bilang “pinangalanan niya itong.”
- source_word: אוֹנָן
  choice: Onan
  rationale: Isinalin sa karaniwang anyong transliterado ang personal na pangalan.
