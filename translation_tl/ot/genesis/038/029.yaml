  revision_rationale: Pinalitan ang malayang “Kaylakas mong bumutas ng daan” ng bulalas na mas malapit sa larawan ng isang breach/siwang sa Hebreo at hindi nagdaragdag ng diin sa lakas. Nilinaw ang nagsalita bilang komadrona batay sa pambabaeng pandiwa at sa agarang konteksto. Iningatan ang kawalang-tiyak ng pormula sa pagpapangalan sa pamamagitan ng “Perez ang ipinangalan sa kanya.”
