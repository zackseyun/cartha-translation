  - marker: b
    text: 'Sa Hebreo, inuulit dito ang ugat na פרץ: “Anong siwang ang ibinutas mo para sa sarili mo!” Mula rin sa ugat na ito ang pangalang Perez.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמֵשִׁיב יָדוֹ
  choice: nang iurong niya ang kanyang kamay
  rationale: Ang Hiphil participle ng שוב kasama ng יָד ay tumutukoy sa paghila o pag-urong ng kamay. Likas sa modernong Tagalog ang “iurong” at pinananatili nito ang kongkretong kilos.
- source_word: וְהִנֵּה
  choice: heto’t
  rationale: Ipinahahayag ng הִנֵּה ang biglaan at kapansin-pansing pangyayari. Ang “heto’t” ay natural na panandang pasalaysay sa Tagalog at pinananatili ang matingkad na pagkabigla.
- source_word: יָצָא אָחִיו
  choice: lumabas ang kapatid niya
  rationale: Sa konteksto ng panganganak, tuwirang tumutukoy ang יָצָא sa paglabas. Payak at natural ang “lumabas” nang hindi nawawala ang pisikal na diwa.
- source_word: מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  choice: Kaylakas mong bumutas ng daan para sa sarili mo!
  rationale: Ang pag-uulit ng ugat na פרץ ay isang matinding bulalas tungkol sa sapilitang paglusot o pagbukas ng daan at naghahanda sa pangalang Perez. Inilalarawan ng “bumutas ng daan” ang pag突破 habang ang “para sa sarili mo” ay nagpapanatili sa mahirap na עָלֶיךָ nang hindi ito labis na binibigyang-kahulugan.
- source_word: פָּרֶץ
  choice: Perez
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa Filipino. Ipinaliliwanag sa talababa ang kaugnayan nito sa ugat na nangangahulugang bumutas, bumasag, o lumusot.
- source_word: וַיִּקְרָא שְׁמוֹ פָּרֶץ
  choice: Kaya Perez ang ipinangalan sa kanya
  rationale: Pinananatili ng di-tiyak na ayos na ito ang pormulang Hebreo sa pagpapangalan nang hindi nagdaragdag ng tahasang tagapagpangalan na wala sa teksto.
