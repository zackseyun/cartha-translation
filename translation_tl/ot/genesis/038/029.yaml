  yaml_path: translation/ot/genesis/038/029.yaml
  text: And as he drew back his hand[a], behold, his brother came out. Then she said[b], “What a breach you have made for yourself!” So his name was called Perez.
translation:
  language: tl
  text: At nang iurong niya ang kamay niya,[a] heto’t lumabas ang kapatid niya. Sinabi ng komadrona, “Anong laking siwang ang ginawa mo para sa sarili mo!”[b] Kaya Perez ang ipinangalan sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “At nangyari, habang iniuurong niya ang kamay niya, na heto’t…”'
