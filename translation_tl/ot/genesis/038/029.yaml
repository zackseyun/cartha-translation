  to: At nang iurong niya ang kamay niya,[a] heto’t lumabas ang kapatid niya. Sinabi ng komadrona, “Anong laking siwang ang ginawa mo para sa sarili mo!”[b] Kaya Perez ang ipinangalan sa kanya.
