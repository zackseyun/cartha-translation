  terminology: Ang “nagdalang-tao,” “nagsilang,” “anak na lalaki,” at “Er” ay angkop sa salaysay at pare-pareho sa karaniwang gamit sa Bibliyang Tagalog. Ang “Juda” sa talababa ay wastong anyong Tagalog ng pangalan.
