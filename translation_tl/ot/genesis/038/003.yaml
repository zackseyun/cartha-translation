  source_fidelity: 'Tumpak ang salin sa pagkakasunod ng Hebreo: siya ay naglihi/nagdalang-tao, nagsilang ng isang anak na lalaki, at isang panlalaking isahang simuno ang nagbigay ng pangalang Er. Hindi nito pilit na pinapangalanan si Juda sa pangunahing teksto, kaya napapanatili ang anyo ng pinagmulan habang ipinapaliwanag ang pinakamalamang na simuno sa talababa.'
