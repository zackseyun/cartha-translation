  yaml_path: translation/ot/genesis/038/003.yaml
  text: She conceived and bore a son[a], and he called his name Er.
translation:
  language: tl
  text: Nagdalang-tao siya at nagsilang ng isang anak na lalaki, at pinangalanan niya itong Er.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, panlalaking isahan ang pandiwang “pinangalanan”; malamang na si Juda ang simuno.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר
  choice: Nagdalang-tao siya
  rationale: Likas at marangal na salin ng pandiwang tumutukoy sa paglilihi o pagiging buntis, habang pinananatili ang sunod-sunod na kilos sa salaysay.
- source_word: וַתֵּלֶד בֵּן
  choice: at nagsilang ng isang anak na lalaki
  rationale: Malinaw na ipinapahayag ang panganganak at ang relasyong pampamilya ng בֵּן sa natural na modernong Tagalog.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: at pinangalanan niya itong
  rationale: Natural na katumbas sa Tagalog ng literal na 'tinawag niya ang pangalan nito'; hindi tahasang tinutukoy sa pangungusap kung sino ang 'niya,' kaya ipinapaliwanag sa talababa ang panlalaking anyo ng pandiwa.
- source_word: עֵר
  choice: Er
  rationale: Karaniwang transliterasyon ng pangalang Hebreo.
theological_decisions:
- issue: Simuno ng וַיִּקְרָא ('at pinangalanan niya')
  choice: Pinanatili ang panghalip na 'niya' at ang paglipat mula sa babaeng simuno ng naunang mga pandiwa patungo sa panlalaking simuno ng pandiwang Hebreo.
  alternative: Gawing tahasan na 'pinangalanan ni Juda' o baguhin bilang 'pinangalanan niya [ang babae].'
  rationale: Panlalaking isahan ang pandiwang Hebreo, kaya malamang na si Juda ang simuno. Gayunman, hindi tahasang inuulit ng teksto ang pangalan niya; pinananatili ng salin ang katangiang ito at nililinaw sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang 'nagdalang-tao' at 'nagsilang' para sa malinaw ngunit hindi kolokyal na salaysay; iniwasan ang literal at alanganing 'tinawag ang pangalan niya.'
