  to: Pagkaraan ng mga tatlong buwan, ibinalita kay Juda, “Nagpatutot[a] ang manugang mong si Tamar, at ngayo’y buntis pa siya dahil sa pagpapatutot[b].” Sinabi ni Juda, “Ilabas ninyo siya, at hayaang sunugin siya.”
