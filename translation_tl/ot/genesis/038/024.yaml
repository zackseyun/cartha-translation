base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/024.yaml
  text: And it happened about three months later that Judah was told[a], “Tamar your daughter-in-law has acted as a prostitute, and behold, she is also pregnant by prostitution.” Then Judah said, “Bring her out[b], and let her be burned.”
translation:
  language: tl
  text: Pagkaraan ng mga tatlong buwan, ibinalita kay Juda, “Nagpatutot[a] ang manugang mong si Tamar, at ngayo’y buntis pa siya dahil sa pagpapatutot[b].” Sinabi ni Juda, “Ilabas ninyo siya, at hayaang sunugin siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “umasal na parang babaeng bayaran”; sa mas malawak na diwa, “gumawa ng seksuwal na imoralidad.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nabuntis bunga ng pakikipagtalik bilang babaeng bayaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים
  choice: Pagkaraan ng halos tatlong buwan
  rationale: Likas na panandang salaysay sa modernong Tagalog; pinananatili ng “halos” ang pagtatantiya ng כְּ.
- source_word: וַיֻּגַּד לִיהוּדָה לֵאמֹר
  choice: ibinalita kay Juda
  rationale: Ipinahahayag ang pasibong pag-uulat ng Hophal nang maikli at natural, at ang kasunod na tuwirang sipi ang laman ng balita.
- source_word: זָנְתָה
  choice: Nagpatutot
  rationale: Pinananatili ang tiyak at mapanumbat na larawan ng prostitusyon sa ugat na זנה, sa halip na palawakin agad bilang pangkalahatang seksuwal na imoralidad.
- source_word: כַּלָּתֶךָ
  choice: ang manugang mong si Tamar
  rationale: Ang “manugang” ang natural na katumbas sa Tagalog; malinaw sa pangalan at konteksto na babae ang tinutukoy.
- source_word: וְגַם הִנֵּה הָרָה
  choice: at ngayo’y buntis siya
  rationale: Ang “ngayo’y” ay natural na naghahatid ng diin at biglang pagkakatuklas na dala ng וְגַם הִנֵּה, nang hindi gumagamit ng artipisyal na “narito.”
- source_word: לִזְנוּנִים
  choice: dahil sa pagpapatutot
  rationale: Ipinakikita ang sanhi o bunga at pinananatili ang ugnayang leksikal sa naunang זָנְתָה.
- source_word: הוֹצִיאוּהָ
  choice: Ilabas ninyo siya
  rationale: Tuwirang pautos sa maramihan na may pambabaeng isahang layon.
- source_word: וְתִשָּׂרֵף
  choice: at hayaang sunugin siya
  rationale: Pinananatili ang pasibong anyo at puwersa ng utos nang hindi tinutukoy kung sino ang magsasagawa nito.
theological_decisions:
- issue: Pananalita tungkol sa seksuwal na kasalanan sa isang paratang
  choice: 'Gamitin ang wika ng prostitusyon: “Nagpatutot” at “dahil sa pagpapatutot.”'
  alternative: “Nakiapid” o “gumawa ng seksuwal na imoralidad.”
  rationale: Magkaugnay na anyo ng זנה/זנונים ang ginamit sa Hebreo. Ang tiyak na wika ng prostitusyon ay nagpapanatili sa tindi at tekstura ng paratang nang hindi ito ginagawang pangkalahatang moral na kategorya.
- issue: Puwersa at anyo ng hatol ni Juda
  choice: “Ilabas ninyo siya, at hayaang sunugin siya.”
  alternative: “Ilabas ninyo siya upang sunugin” o “Ilabas ninyo siya at sunugin.”
  rationale: Agarang utos ang pahayag, ngunit pasibo ang תִשָּׂרֵף. Pinananatili ng salin ang kalubhaan ng hatol habang hindi nagdaragdag ng tagaganap o paraang hindi tahasang sinabi.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal ang himig. Sadyang pinanatili ang mabigat na wika ng prostitusyon sapagkat iyon ang nasa paratang ng Hebreo. Inilagay ang mga pananda ng talababa sa mismong mga pariralang ipinaliliwanag ng mga ito.
