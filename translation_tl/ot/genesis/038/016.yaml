base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/016.yaml
  text: So he turned aside to her by the road and said[a], “Please, let me come in to you,” for he did not know that she was his daughter-in-law. And she said, “What will you give me[b], that you may come in to me?”
translation:
  language: tl
  text: Lumihis siya patungo sa kaniya sa tabi ng daan at sinabi, “Pakiusap, hayaan mong sumiping ako sa iyo[a],” sapagkat hindi niya alam na siya ang kanyang manugang. Sinabi niya, “Ano ang ibibigay mo sa akin[b] upang makasiping ka sa akin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pumaroon sa iyo/akin,” isang di-tahasang pananalita para sa pakikipagtalik.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Ano ang ibabayad mo sa akin?” Mas literal sa Hebreo ang “Ano ang ibibigay mo sa akin?”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ
  choice: lumihis siya ng daan at lumapit sa babae
  rationale: Ipinahihiwatig ng נטה ang paglihis ni Juda mula sa dinaraanan niya patungo sa babae; natural itong ipinahayag sa makabagong Tagalog habang pinananatili ang kilos at tagpuan.
- source_word: הָבָה נָּא
  choice: Pakiusap, hayaan mong
  rationale: Ang kumbinasyon ay isang magalang ngunit mapilit na pakiusap; ang salin ay natural at marangal sa kasalukuyang Tagalog.
- source_word: אָבוֹא אֵלַיִךְ / תָבוֹא אֵלַי
  choice: sumiping ako sa iyo / makasiping ka sa akin
  rationale: Ang בוא אל ay eupemismo para sa pakikipagtalik sa kontekstong ito. Ang “sumiping” ay likas na eupemismong Tagalog at hindi labis na tahasan.
- source_word: כִּי לֹא יָדַע
  choice: sapagkat hindi niya alam
  rationale: Ang כִּי ay nagbibigay ng paliwanag sa kilos ni Juda; malinaw itong naihahatid ng “sapagkat.”
- source_word: כִּי כַלָּתוֹ הִוא
  choice: na ito ang kanyang manugang
  rationale: Ang כַלָּה ay tumutukoy sa daughter-in-law; sa Tagalog, ang “manugang” ay likas na katawagan bagaman hindi nito tahasang tinutukoy ang kasarian.
- source_word: מַה תִּתֶּן לִּי
  choice: Ano ang ibibigay mo sa akin
  rationale: Pinananatili nito ang karaniwang kahulugan ng נתן na “magbigay,” sa halip na tahasang gawing “ibabayad,” kahit ipinahihiwatig ng konteksto ang kabayaran.
