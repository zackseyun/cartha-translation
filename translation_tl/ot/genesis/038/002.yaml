  text: There Judah saw the daughter of a Canaanite man whose name was Shua[b][a], and he took her and went in to her.
translation:
  language: tl
  text: Doon, nakita ni Juda ang anak na babae ng isang lalaking Cananeo, na ang pangalan ay Sua[a]. Kinuha niya siya at sinipingan niya siya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “at ang pangalan niya ay Sua.” Ang tinutukoy ay ang lalaking Cananeo, hindi ang anak niyang babae.
    reason: lexical_alternative
  - marker: b
    text: Ang literal na Hebreong idyoma ay “pumasok sa kanya,” na nangangahulugang nakipagtalik sa kanya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: nakita
  rationale: Tuwirang katumbas ng ראה sa sunod-sunod na salaysay; hindi nito dinaragdagan ang diwang gaya ng “nakilala” o “napansin.”
- source_word: שָׁם
  choice: doon
  rationale: Likas at maikling panumbas sa pang-abay na tumutukoy sa lugar.
- source_word: בַּת אִישׁ כְּנַעֲנִי
  choice: ang anak na babae ng isang lalaking Cananeo
  rationale: 'Malinaw na pinananatili ang ugnayang nasa pariralang Hebreo: anak na babae ng isang lalaki na Cananeo.'
- source_word: וּשְׁמוֹ שׁוּעַ
  choice: na ang pangalan ay Sua
  rationale: Pinananatili ang gramatikal na pagtukoy ng panlalaking hulapi sa lalaking Cananeo, hindi sa kanyang anak na babae.
- source_word: וַיִּקָּחֶהָ
  choice: Kinuha niya ito
  rationale: Pinananatili ang payak na kahulugan ng לקח at hindi tahasang idinaragdag ang “bilang asawa,” bagaman maaari itong ipahiwatig ng konteksto.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: sinipingan
  rationale: Natural at marangal na salin ng Hebreong idyoma para sa pakikipagtalik; iniiwasan ang hindi likas na literal na “pumasok sa kanya.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sinipingan” bilang likas na idyomatikong panumbas, habang ipinaliliwanag sa talababa ang anyong literal ng Hebreo. Ang “ito” ay tumutukoy sa babae at umiiwas sa paulit-ulit na “siya.”
