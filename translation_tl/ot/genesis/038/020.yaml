    issue: Malabong panghalip na 'nito' sa huling sugnay
    rationale: Sa Tagalog, madaling maunawaang ang 'nito' ay tumutukoy sa 'batang kambing,' hindi sa kaibigang taga-Adulam. Samantalang ang di-tahasang paksa ng Hebreo ay, ayon sa konteksto, ang kaibigang isinugo ni Juda. Ang pag-uulit sa 'kaibigan' ay kinakailangan upang maging malinaw ang kahulugan.
