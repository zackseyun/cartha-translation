translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang natural na idyomang “sa pamamagitan ng” sa pangunahing teksto, habang pinananatili sa talababa ang literal na larawan ng Hebreong “kamay.”
