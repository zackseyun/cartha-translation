  yaml_path: translation/ot/genesis/038/020.yaml
  text: Then Judah sent the young goat by the hand of his Adullamite friend to take back the pledge from the woman's hand[c][b][a], but he did not find her.
translation:
  language: tl
  text: Pagkatapos, ipinadala ni Juda ang batang kambing sa pamamagitan ng kaibigan niyang taga-Adulam[a] upang mabawi ang panagot[b] mula sa babae[c], ngunit hindi natagpuan ng kaibigan ang babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa kamay ng kaibigan niyang taga-Adulam,” isang idyomang nangangahulugang “sa pamamagitan ng.”
    reason: lexical_alternative
  - marker: b
    text: O “ang garantiya” o “ang kolateral.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “mula sa kamay ng babae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Pagkatapos, ipinadala
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng mga pangyayari.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyo ng pangalang ito sa Tagalog na salin ng Bibliya.
- source_word: גְּדִי הָעִזִּים
  choice: ang batang kambing
  rationale: Tumutukoy ang parirala sa isang anak o batang kambing; malinaw at natural ito sa modernong Tagalog.
- source_word: בְּיַד רֵעֵהוּ הָעֲדֻלָּמִי
  choice: sa pamamagitan ng kaibigan niyang taga-Adulam
  rationale: Ang literal na “sa kamay ng” ay idyoma ng ahensiya. Inihahatid ng “sa pamamagitan ng” ang kahulugan nito sa natural na Tagalog, habang ang רֵעֵהוּ ay ang kaniyang kaibigan o kasama at ang הָעֲדֻלָּמִי ay taong mula sa Adulam.
- source_word: לָקַחַת
  choice: upang mabawi
  rationale: Nagpapahayag ng layunin ang pawatas. Sa konteksto, kukunin ni Juda pabalik ang mga bagay na iniwan niya bilang garantiya.
- source_word: הָעֵרָבוֹן
  choice: ang panagot
  rationale: Tumutukoy ito sa bagay na ibinigay bilang garantiya o seguridad. Ang “panagot” ay maikli, malinaw, at angkop sa konteksto.
- source_word: מִיַּד הָאִשָּׁה
  choice: mula sa babae
  rationale: Literal itong “mula sa kamay ng babae,” ngunit ang “mula sa babae” ang natural na Tagalog para sa pinagmulan o pag-aari; inilagay sa talababa ang kongkretong anyo ng Hebreo.
- source_word: וְלֹא מְצָאָהּ
  choice: ngunit hindi nito natagpuan ang babae
  rationale: Ipinakikita ng “ngunit” ang kabiguan ng layunin. Nililinaw ng “nito” na ang kaibigang taga-Adulam ang naghahanap, at inuulit ang “babae” upang maiwasan ang malabong panghalip.
