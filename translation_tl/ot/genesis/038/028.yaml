translation:
  language: tl
  text: Habang nanganganak siya, iniunat ng isa sa mga kambal ang kaniyang kamay.[a] Hinawakan ito ng komadrona at tinalian niya ito ng iskarlatang sinulid, habang sinasabi, “Ito ang unang lumabas.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nagbigay siya ng kamay,” isang idyoma na naglalarawan sa paglitaw ng kamay ng sanggol habang nanganganak.
    reason: lexical_alternative
  - marker: b
    text: Ang iskarlatang sinulid ay nagsilbing nakikitang palatandaan kung aling kambal ang unang lumitaw.
    reason: cultural_note
lexical_decisions:
- source_word: בְּלִדְתָּהּ
  choice: Habang nanganganak siya
  rationale: Ang ב na may infinitive construct at hulaping 3fs ay nagsasaad ng kasabay na pangyayari; natural sa modernong Tagalog ang “habang nanganganak siya.”
- source_word: וַיִּתֶּן יָד
  choice: iniunat ng isa sa mga sanggol ang kamay nito
  rationale: Literal na “nagbigay siya ng kamay,” isang idyoma para sa paglitaw o paglabas ng kamay sa panganganak. Nililinaw ng “isa sa mga sanggol” ang di-tiyak na tinutukoy nang hindi pinapangalanan kung aling kambal iyon.
- source_word: הַמְיַלֶּדֶת
  choice: komadrona
  rationale: Karaniwan at maikling katawagan sa babaeng tumutulong sa panganganak.
- source_word: וַתִּקְשֹׁר עַל יָדוֹ שָׁנִי
  choice: tinalian ng pulang sinulid
  rationale: Ang שָׁנִי ay iskarlatang materyal; sa Tagalog, natural na tukuyin itong “pulang sinulid” sa konteksto ng panandang itinali sa kamay.
- source_word: זֶה יָצָא רִאשֹׁנָה
  choice: Ito ang unang lumabas
  rationale: Pinananatili nito ang pagkakakilanlan batay sa pagkakasunod ng paglabas at hindi ipinapasok ang legal o panlipunang katawagang “panganay,” na wala rito sa Hebreo.
