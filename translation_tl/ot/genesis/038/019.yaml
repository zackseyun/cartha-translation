  source_fidelity: 'Tumpak na naisasalin ang magkakasunod na kilos sa Hebreo: tumayo siya, umalis, inalis ang kanyang belo, at isinuot ang kasuotang nauugnay sa kanyang pagkabalo. Ang “inalis niya ang kanyang belo” ay natural na sumasaklaw sa מֵעָלֶיהָ nang walang di-likas na pag-uulit.'
  naturalness: Malinaw, makabago, at marangal ang daloy. Ang paghahati sa dalawang pangungusap ay hindi nakaaapekto sa pagkakasunod ng salaysay. Natural ang “mga damit niya bilang balo” bilang paglalarawan ng mga kasuotang nauugnay sa pagiging balo.
