  yaml_path: translation/ot/genesis/038/019.yaml
  text: Then she arose and went away[b][a], and she removed her veil from upon her and put on the garments of her widowhood.
translation:
  language: tl
  text: Pagkatapos, tumayo siya at umalis. Inalis niya ang kanyang belo[a] at isinuot ang mga damit niya bilang balo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pantakip.”
    reason: Maaaring tumukoy ang צָעִיף sa belo o sa isang balabal na pantakip, bagaman mas angkop sa konteksto ang “belo.”
lexical_decisions:
- source_word: וַתָּקָם
  choice: tumayo siya
  rationale: Ang Qal wayyiqtol ng קום ay nagsasaad ng kasunod na kilos sa salaysay; natural at tuwiran sa Filipino ang “tumayo siya.”
- source_word: וַתֵּלֶךְ
  choice: umalis
  rationale: Sa pagkakasunod sa “tumayo,” ipinahihiwatig ng הלך na nilisan niya ang lugar; malinaw itong naihahayag ng “umalis.”
- source_word: וַתָּסַר ... מֵעָלֶיהָ
  choice: inalis niya
  rationale: Ipinahihiwatig ng Hiphil ng סור kasama ng מֵעָלֶיהָ na hinubad o inalis niya sa sarili ang pantakip; sapat at likas sa Filipino ang “inalis niya” nang hindi inuulit ang diwang “mula sa ibabaw niya.”
- source_word: צְעִיפָהּ
  choice: ang kanyang belo
  rationale: Ang צָעִיף ay pantakip sa ulo o mukha; “belo” ang pinakanatural na salita ayon sa konteksto ng pagpapanggap ni Tamar.
- source_word: וַתִּלְבַּשׁ
  choice: isinuot
  rationale: Ang לבש ay tumutukoy sa pagsusuot ng kasuotan; direkta at natural ang “isinuot.”
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: ang mga damit niya bilang balo
  rationale: Ipinapahayag ng pariralang konstruktibo ang kasuotang kaugnay ng kanyang kalagayan bilang balo. Pinananatili ng salin ang diwa nang hindi gumagamit ng di-likas na “mga damit ng kanyang pagkabalo.”
