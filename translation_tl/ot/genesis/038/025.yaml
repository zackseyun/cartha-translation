  source_fidelity: Tumpak na naipapahayag ng salin ang pasibong kilos na nagaganap, ang pagpapadala ng mensahe sa kaniyang biyenan, ang pagdadalang-tao sa may-ari ng mga bagay, at ang hamon na kilalanin ang mga gamit. Gayunman, ang pangwakas na “na ito” sa kasalukuyang pangungusap ay maaaring mabasang tumutukoy lamang sa “tungkod,” samantalang ang Hebreong הָאֵלֶּה ay tumutukoy sa lahat ng tatlong bagay.
  naturalness: Makabago at malinaw sa kabuuan. Ang muling pag-aayos sa talaan ng mga bagay ay higit na likas at inaalis ang kalabuan ng saklaw ng “mga ito.”
