  yaml_path: translation/ot/genesis/038/025.yaml
  text: As she was being brought out[a], she sent word to her father-in-law, saying, “I am pregnant by the man to whom these belong.” And she said, “Please identify whose signet ring, cords, and staff these are.”
translation:
  language: tl
  text: 'Habang inilalabas siya, nagpadala siya ng mensahe sa biyenan niyang lalaki: “Buntis ako sa lalaking nagmamay-ari ng mga ito.” Sinabi pa niya, “Tukuyin mo nga[a] kung kanino ang mga ito—ang pantatak, mga tali, at tungkod.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kilalanin mo nga.” Ang pandiwang Hebreo ay maaaring mangahulugang kilalanin o tukuyin; dito ay may diin itong tulad ng paghaharap ng katibayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּצֵאת
  choice: habang inilalabas siya
  rationale: Ipinapahayag ng pasibong participle ang kilos na kasalukuyang nagaganap habang dinadala si Tamar palabas para parusahan.
- source_word: שָׁלְחָה
  choice: nagpadala siya ng mensahe
  rationale: Bagaman literal na ‘nagpadala,’ ipinahihiwatig ng kasunod na pahayag na isang mensahe ang ipinadala.
- source_word: חָמִיהָ
  choice: biyenan niyang lalaki
  rationale: Tuwirang katumbas ng tiyak na katawagang Hebreo para sa ama ng asawa; nililinaw ng ‘lalaki’ ang kasarian na maaaring hindi tukoy sa salitang ‘biyenan’ lamang.
- source_word: לְאִישׁ אֲשֶׁר אֵלֶּה לּוֹ אָנֹכִי הָרָה
  choice: Buntis ako sa lalaking nagmamay-ari ng mga ito
  rationale: Natural na Filipino na pinananatili ang kaugnayan ng pagdadalantao at ng lalaking may-ari ng mga bagay.
- source_word: הַכֶּר נָא
  choice: Tukuyin mo nga
  rationale: Ang pautos na נכר ay maaaring mangahulugang kilalanin o tukuyin; ang ‘tukuyin’ ay angkop sa mapanuring hamon sa konteksto, at ipinahahayag ng ‘nga’ ang pakiusap na dala ng נָא.
- source_word: חֹתֶמֶת
  choice: pantatak
  rationale: Tumutukoy ito sa personal na seal na ginagamit sa pagpapatunay ng pagkakakilanlan; hindi ipinapalagay na tiyak na singsing ang anyo nito.
- source_word: פְּתִילִים
  choice: mga tali
  rationale: Pinananatili ang anyong maramihan at malamang na tumutukoy sa mga taling kaugnay ng pantatak.
- source_word: מַטֶּה
  choice: tungkod
  rationale: Karaniwan at angkop na katumbas sa salaysay ng mga patriarka.
