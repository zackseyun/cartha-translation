  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘biyenan niyang lalaki’ upang maging tiyak ang ugnayang pampamilya, at iniwasang gawing ‘singsing’ ang pantatak dahil hindi iyon tahasang sinasabi ng salitang Hebreo.
