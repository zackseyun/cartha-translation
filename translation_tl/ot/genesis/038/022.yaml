base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/022.yaml
  text: So he returned to Judah and said[a], “I did not find her, and also the men of the place said[b], ‘There has been no cult prostitute here.’”
translation:
  language: tl
  text: Bumalik siya kay Juda at sinabi, “Hindi ko siya natagpuan, at sinabi rin ng mga lalaki roon, ‘Walang patutot na kaugnay ng kulto rito.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: qĕdēšâ. Kaugnay ito ng salitang “banal” o “nakatalaga” at tumutukoy rito sa isang babaeng iniuugnay sa seksuwal na gawaing kultiko. Maaari ring isalin na “patutot sa templo,” bagaman mas tiyak iyon kaysa sa mismong salita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Kaya bumalik siya
  rationale: Isinusulong ng wayyiqtol ang pagkakasunod-sunod ng salaysay; natural na ipinahahayag ng “Kaya” ang pagbabalik matapos ang nabigong paghahanap.
- source_word: אֶל־יְהוּדָה
  choice: kay Juda
  rationale: Ang אֶל ay nagsasaad ng patungo sa isang tao; “kay” ang likas na panandang Filipino para rito.
- source_word: לֹא מְצָאתִיהָ
  choice: Hindi ko siya natagpuan
  rationale: Tuwirang inilalahad ang natapos ngunit nabigong paghahanap, nang hindi dinaragdagan ng diwang modal na “hindi ko makita.”
- source_word: וְגַם אַנְשֵׁי הַמָּקוֹם אָמְרוּ
  choice: Sinabi rin ng mga lalaki roon
  rationale: Pinananatili ng “rin” ang dagdag na patotoo, at ng “mga lalaki” ang tahasang panlalaking anyo ng Hebrew; natural na katumbas ng “sa lugar” ang “roon.”
- source_word: לֹא הָיְתָה בָזֶה
  choice: Walang naging … rito
  rationale: Ang eksistensiyal na ayos ay natural sa Filipino at pinananatili ang pagtanggi na may gayong babae sa lugar na iyon.
- source_word: קְדֵשָׁה
  choice: patutot na kaugnay ng kultong pagsamba
  rationale: Ipinakikita ang kaibahan nito sa karaniwang זֹנָה sa nakapaligid na salaysay at pinananatili ang kaugnayang kultiko, nang hindi ipinapalagay na isang pormal na templo ang sangkot.
theological_decisions:
- issue: Tiyak na tungkulin ng קְדֵשָׁה
  choice: Isinaling “patutot na kaugnay ng kultong pagsamba” at nilagyan ng talababa.
  alternative: “babaeng nakatalaga,” “sagradong patutot,” o “patutot sa templo”
  rationale: May kultiko at seksuwal na pahiwatig ang salita sa konteksto, ngunit hindi tiyak na tumutukoy ito sa isang pormal na institusyon ng prostitusyon sa templo. Iniiwasan ng salin ang labis na pagtitiyak habang inilalantad ng talababa ang tunay na suliraning leksikal.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang payak na ayos ng salaysay at malinaw na tuwirang pananalita. Ang teknikal na pariralang “kultong pagsamba” ay pinili upang mapanatili ang aspektong panrelihiyon ng קְדֵשָׁה nang hindi ito awtomatikong itinatali sa isang templo.
