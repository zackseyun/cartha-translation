revisions:
- from: At sinabi ni Juda, “Hayaan mo na siyang magmay-ari ng mga iyon, baka tayo'y maging tampulan ng paglibak.[a] Tingnan mo, ipinadala ko ang batang kambing na ito, pero hindi mo siya natagpuan.”
  to: At sinabi ni Juda, “Hayaan mo na siyang magkaroon ng mga iyon, baka tayo'y maging tampulan ng paglibak.[a] Tingnan mo, ipinadala ko ang batang kambing na ito, pero hindi mo siya natagpuan.”
  rationale: Pinalitan ang “magmay-ari” ng “magkaroon” upang maipahayag ang permissive na diwa ng Hebreo—na ipinauubaya ni Juda sa babae ang mga bagay na panagot—nang hindi nagdaragdag ng diwa ng ganap na pagmamay-ari. Hindi binago ang ibang bahagi dahil tapat at natural ang mga ito.
