  text: And Judah said[a], “Let her keep them, lest we become a laughingstock. Look, I sent this young goat, but you did not find her.”
translation:
  language: tl
  text: At sinabi ni Juda, “Hayaan mo na siyang magkaroon ng mga iyon, baka tayo'y maging tampulan ng paglibak.[a] Tingnan mo, ipinadala ko ang batang kambing na ito, pero hindi mo siya natagpuan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “baka tayo'y mapahiya” o “baka tayo'y tuyain.” Ang pananalitang Hebreo ay tumutukoy sa pagiging tampulan ng paghamak o panunuya.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקַּח לָהּ
  choice: Hayaan mo na siyang magmay-ari ng mga iyon
  rationale: 'Ang 3fs imperfect na may לָהּ ay may pahintulot na diwa: ipinauubaya ni Juda sa babae ang mga bagay na panagot. Ginawang tahasang maramihan ang ipinahihiwatig na layon sapagkat maraming bagay ang panagot sa konteksto.'
- source_word: פֶּן נִהְיֶה לָבוּז
  choice: baka tayo'y maging tampulan ng paglibak
  rationale: Ang בּוּז ay tumutukoy sa paghamak, panunuya, o paglibak. Ang parirala ay natural sa Filipino at pinananatili ang diwa ng pampublikong kahihiyan o panunuya.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Ang הִנֵּה ay pantawag-pansin sa kasunod na pahayag. Ang “Tingnan mo” ay makabago at natural nang hindi gumagamit ng makalumang pananalita.
- source_word: שָׁלַחְתִּי הַגְּדִי הַזֶּה
  choice: ipinadala ko ang batang kambing na ito
  rationale: Ang גְּדִי ay batang kambing; pinanatili rin ang demonstratibong “ito” mula sa Hebreo.
- source_word: וְאַתָּה לֹא מְצָאתָהּ
  choice: pero hindi mo siya natagpuan
  rationale: Ang וְ ay may kontras na tungkulin dito sa pagitan ng pagpapadala ni Juda at ng kabiguang mahanap ang babae. Ang hulaping pambabae ay tumutukoy sa babaeng hinahanap.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Judah.
