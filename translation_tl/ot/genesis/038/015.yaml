  text: When Judah saw her[a], he thought she was a prostitute, because she had covered her face.
translation:
  language: tl
  text: Nang makita ni Juda ang babae, inakala[a] niyang isa itong prostituta, sapagkat tinakpan ng babae ang kanyang mukha.
  philosophy: optimal-equivalence
