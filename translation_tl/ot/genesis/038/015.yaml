lexical_decisions:
- source_word: וַיִּרְאֶהָ
  choice: Nang makita siya ni Juda
  rationale: Ang ראה ay nangangahulugang “makita.” Ipinahahayag ng “Nang” ang pagkakasunod at ugnayang temporal ng dalawang pangyayari sa natural na Tagalog.
- source_word: וַיַּחְשְׁבֶהָ
  choice: inakala niyang isa siyang
  rationale: Ipinahahayag dito ng חשב ang naging palagay ni Juda tungkol sa pagkakakilanlan ng babae. Natural sa modernong Tagalog ang “inakala niyang,” at malinaw na maaaring mali ang palagay.
- source_word: לְזוֹנָה
  choice: isang prostituta
  rationale: Ang זֹנָה ay tumutukoy sa isang prostituta. Tuwiran at nauunawaan sa kasalukuyang Filipino ang “prostituta,” samantalang ang ilang alternatibo ay maaaring maging lipas, mapanlait, o labis na eupemistiko.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng כִּי ang dahilan ng naging palagay ni Juda. Ang “sapagkat” ay malinaw, sanhiang pang-ugnay na angkop sa marangal na salaysay.
- source_word: כִסְּתָה פָּנֶיהָ
  choice: tinakpan niya ang kanyang mukha
  rationale: Ang כסה ay “takpan,” at ang פָּנֶיהָ ay “kanyang mukha.” Sa Tagalog, sapat nang ipinahihiwatig ng konteksto na nauna ang pagtatakip sa naging palagay ni Juda.
