  text: וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/תָּ֖מָת בַּת שׁ֣וּעַ אֵֽשֶׁת יְהוּדָ֑ה וַ/יִּנָּ֣חֶם יְהוּדָ֗ה וַ/יַּ֜עַל עַל גֹּֽזֲזֵ֤י צֹאנ/וֹ֙ ה֗וּא וְ/חִירָ֛ה רֵעֵ֥/הוּ הָ/עֲדֻלָּמִ֖י תִּמְנָֽתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/012.yaml
  text: After many days had passed[a], the daughter of Shua, Judah’s wife, died. When Judah was comforted[c][b], he went up to Timnah to his sheep shearers—he and his friend Hirah the Adullamite.
translation:
  language: tl
  text: Pagkalipas ng maraming araw,[a] namatay ang anak na babae ni Shua,[b] na asawa ni Juda. Nang maaliw na si Juda,[c] umakyat siya sa Timna upang puntahan ang mga manggugupit ng kaniyang mga tupa, kasama ang kaibigan niyang si Hira na taga-Adulam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagkalipas ng mahabang panahon.” Literal na “dumami ang mga araw.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “anak na babae ni Shua”; itinuturing naman ito ng ilan na pangalang “Bath-shua.”
    reason: alternative_reading
  - marker: c
    text: O “Matapos maaliw si Juda” / “At naaliw si Juda.” Ang pandiwang Hebreo rito ay tumutukoy sa pagkaaliw matapos ang pagluluksa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: Pagkalipas ng maraming araw
  rationale: Natural na salin ng idyomang literal na nagsasabing ‘dumami ang mga araw,’ habang pinananatili ang diwa ng paglipas ng mahabang panahon.
- source_word: וַתָּמָת
  choice: namatay
  rationale: Karaniwang katumbas ng מות sa salaysay.
- source_word: בַּת שׁוּעַ
  choice: ang anak na babae ni Shua
  rationale: Malinaw na ugnayang pampamilya ang pariralang Hebreo; hindi ito kailangang ituring na tambalang pangalang Bath-shua.
- source_word: אֵשֶׁת יְהוּדָה
  choice: na asawa ni Juda
  rationale: Likas na Tagalog na paglalarawan sa anak ni Shua bilang asawa ni Juda.
- source_word: וַיִּנָּחֶם יְהוּדָה
  choice: Nang maaliw na si Juda sa kanyang pagdadalamhati
  rationale: Ang Niphal ng נחם dito ay tumutukoy sa pagkaaliw matapos ang pagluluksa, hindi sa pagsisisi. Nilinaw ng pariralang ‘sa kanyang pagdadalamhati’ ang kahulugan sa konteksto.
- source_word: וַיַּעַל
  choice: umakyat siya
  rationale: Pinananatili ang direksiyonal na diwa ng עלה, na maaaring tumukoy sa pagpunta sa mas mataas na lugar.
- source_word: עַל גֹּזֲזֵי צֹאנוֹ
  choice: kung saan naroon ang mga manggugupit ng kanyang mga tupa
  rationale: Ipinahahayag na pumunta siya sa mga manggagawang gumugupit sa sarili niyang kawan, nang hindi ginagawang si Juda mismo ang gagawa ng paggugupit.
- source_word: הוּא וְחִירָה רֵעֵהוּ
  choice: Kasama niya ang kaibigan niyang si Hira
  rationale: Natural na Tagalog para sa kasama at kaibigang binanggit sa Hebreo.
- source_word: הָעֲדֻלָּמִי
  choice: na taga-Adulam
  rationale: Likas na paraan sa Tagalog upang ipahayag ang pinagmulan ni Hira.
- source_word: תִּמְנָתָה
  choice: sa Timna
  rationale: Ang hulaping direksiyonal sa Hebreo ay nagpapahiwatig ng pagpunta patungong Timna; natural itong ipinahahayag sa Tagalog sa konteksto ng ‘umakyat.’
