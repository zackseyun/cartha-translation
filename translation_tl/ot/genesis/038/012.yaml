translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘manggugupit’ para sa mga taong gumugupit ng balahibo ng tupa at ‘taga-Adulam’ bilang natural na katumbas ng gentilic. Ang lahat ng talababa ay may katumbas na marker sa pangunahing teksto.
