base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/010.yaml
  text: And God said to him[a], “Your name is Jacob. Your name will no longer be called Jacob, but Israel will be your name.” So he called his name Israel.
translation:
  language: tl
  text: Sinabi sa kanya ng Diyos, “Jacob ang pangalan mo. Hindi ka na tatawaging Jacob; Israel na ang magiging pangalan mo.” At tinawag niya siyang Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “At tinawag niya ang pangalan niya na Israel.” Maaari ring isalin: “At pinangalanan niya siyang Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang pangngalan, isahan ang pandiwa at malinaw na tumutukoy ito sa iisang Diyos.
- source_word: שִׁמְךָ
  choice: ang pangalan mo
  rationale: Likas at tuwirang katumbas sa modernong Tagalog ng pangngalang may panlaping ikalawang panauhang panlalaki at isahan.
- source_word: לֹא יִקָּרֵא ... עוֹד
  choice: Hindi ka na tatawaging
  rationale: Ipinahahayag ng balintiyak na anyo ng קרא at ng לֹא ... עוֹד na mula ngayon ay hindi na iyon ang itatawag sa kanya.
- source_word: כִּי אִם
  choice: Israel na
  rationale: 'Sa kontekstong ito, naghuhudyat ang parirala ng tuwirang pagpapalit: hindi na Jacob, kundi Israel. Ang hulaping “na” ay likas na naghahatid ng kontrast at pagbabago sa Tagalog.'
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: Israel na ang magiging pangalan mo
  rationale: Pinananatili ang diin sa bagong pangalang Israel habang natural ang ayos sa Tagalog.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ יִשְׂרָאֵל
  choice: Kaya pinangalanan niya siyang Israel
  rationale: Likas na Tagalog para sa Hebreong pormula ng pagbibigay ng pangalan; ipinakikita ng “Kaya” na isinagawa ang naunang pahayag nang hindi dinaragdagan ang kahulugan nito.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Karaniwang anyo ng pangalang ito sa Bibliyang Tagalog.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Karaniwang anyo ng pangalang ito sa Bibliyang Tagalog.
theological_decisions:
- issue: Ang pormula ng pagpapalit ng pangalan ay maaaring magmukhang lubusang nag-aalis sa pangalang Jacob kahit ginagamit pa rin ito sa sumunod na salaysay.
  choice: Hindi ka na tatawaging Jacob; Israel na ang magiging pangalan mo.
  alternative: Hindi na Jacob ang itatawag sa iyo, kundi Israel ang magiging pangalan mo.
  rationale: Pinananatili ang buong lakas ng pormal na pahayag ng Diyos nang hindi ipinapaliwanag o pinapahina ang tensiyon sa patuloy na paggamit ng pangalang Jacob sa salaysay.
- issue: Ang di-tahasang simuno ng huling pandiwa.
  choice: pinangalanan niya siyang Israel
  alternative: tinawag siyang Israel
  rationale: Pinananatili ang panghalip na “niya,” gaya ng di-tahasang ikatlong-panauhang simuno sa Hebreo, at hindi pinapalitan ito ng isang tahasang pangngalan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tatawaging” sa halip na mas mabigat na nominal na pormula, at iniwasan ang arkaikong pananalita.
