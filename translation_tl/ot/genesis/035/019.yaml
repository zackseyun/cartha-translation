  yaml_path: translation/ot/genesis/035/019.yaml
  text: So Rachel died and was buried on the way to Ephrath (that is[a], Bethlehem).
translation:
  language: tl
  text: Kaya namatay si Raquel at inilibing sa daan patungong Efrata[a] (na siyang Betlehem).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Efrata ay maaari ring baybayin na “Efrat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: namatay
  rationale: Tuwirang katumbas ng pisikal na kamatayan; iniiwasan ang eupemismong gaya ng “pumanaw.”
- source_word: רָחֵל
  choice: Raquel
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa makabagong saling Tagalog.
- source_word: וַתִּקָּבֵר
  choice: inilibing
  rationale: Likas na ipinahihiwatig ng pandiwang Hebreo ang pasibong diwa; hindi idinagdag ang “doon” sapagkat wala ito sa teksto.
- source_word: בְּדֶרֶךְ
  choice: sa daan patungong
  rationale: Natural na Tagalog para sa lokasyon sa rutang patungo sa isang lugar; pinananatili ang konteksto ng paglalakbay.
- source_word: אֶפְרָתָה
  choice: Efrata
  rationale: Malapit na transliterasyon ng anyong Hebreo at madaling basahin sa Tagalog.
- source_word: הִוא
  choice: na siyang
  rationale: Ipinapahayag ang appositional na pagkakakilanlan ng Efrata at Betlehem nang natural, nang hindi dinaragdagan ang kahulugan.
- source_word: בֵּית לָחֶם
  choice: Betlehem
  rationale: Karaniwang transliterasyon sa Tagalog ng pangalan ng lugar.
