base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/005.yaml
  text: Then they set out[a], and a terror from God fell on the cities that were around them, so that they did not pursue the sons of Jacob.
translation:
  language: tl
  text: Pagkatapos, naglakbay sila, at bumalot sa mga lunsod sa palibot nila ang sindak mula sa Diyos[a], kaya hindi hinabol ng mga ito ang mga anak na lalaki ni Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ang sindak ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעוּ
  choice: Pagkatapos, naglakbay sila
  rationale: Isinusulong ng waw-consecutive ang salaysay, at likas na ipinahahayag ng “naglakbay sila” ang pag-alis at pagpapatuloy ng paglalakbay.
- source_word: וַיְהִי חִתַּת אֱלֹהִים עַל הֶעָרִים
  choice: bumalot sa mga lunsod ... ang sindak mula sa Diyos
  rationale: Ang “bumalot” ay natural sa Filipino para sa sindak na sumapit sa mga lunsod, samantalang pinananatili ng “mula sa Diyos” ang malamang na diwang pinagmulan ng construct phrase.
- source_word: אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: sa palibot nila
  rationale: Maikli, malinaw, at likas na tumutukoy sa mga kalapit na lunsod na nakapaligid sa pangkat ni Jacob.
- source_word: וְלֹא רָדְפוּ אַחֲרֵי
  choice: kaya hindi hinabol ng mga ito
  rationale: Ipinakikita ng “kaya” ang resultang kaugnayan sa naunang sindak; ang “hinabol” ay karaniwang salin ng idyomang רדף אחרי.
- source_word: בְּנֵי יַעֲקֹב
  choice: mga anak na lalaki ni Jacob
  rationale: Tahasang pinananatili ang panlalaking sanggunian ng Hebrew at iniiwasan ang posibleng neutral na kahulugan ng “mga anak.”
theological_decisions:
- issue: Kahulugan ng construct na חִתַּת אֱלֹהִים
  choice: sindak mula sa Diyos
  alternative: sindak ng Diyos; matinding sindak
  rationale: Pinakamalamang sa konteksto na ang Diyos ang pinagmulan ng sindak na nag-ingat sa sambahayan ni Jacob. Gayunman, maaaring mas pormal na unawain itong “sindak ng Diyos,” kaya pinanatili ang alternatibo sa talababa.
- issue: Paglalarawan sa בְּנֵי יַעֲקֹב
  choice: mga anak na lalaki ni Jacob
  alternative: mga anak ni Jacob
  rationale: Panlalaking maramihan ang anyong Hebrew at tumutukoy sa mga lalaking anak ni Jacob sa salaysay, kaya hindi ito ginawang neutral.
translation_notes:
  register: Makabago at marangal na Filipino; pinili ang “lunsod” bilang malinaw na katumbas ng עָרִים at ang “bumalot” bilang natural na paglalarawan ng pagdating ng sindak. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
