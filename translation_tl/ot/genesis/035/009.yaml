  yaml_path: translation/ot/genesis/035/009.yaml
  text: God appeared to Jacob again when he came from Paddan-aram[a], and he blessed him.
translation:
  language: tl
  text: Muling nagpakita[a] ang Diyos kay Jacob nang dumating siya mula sa Padan-Aram, at pinagpala siya ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Muling inihayag ng Diyos ang sarili niya kay Jacob.” Ang pandiwang Hebreo ay maaaring mangahulugang “nagpakita” o “ipinakita ang sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: nagpakita
  rationale: Ang Niphal ng ראה ay tumutukoy rito sa pagpapakita o pagpapakitang-nakikita. Natural sa modernong Tagalog ang “nagpakita” at hindi nito tinutukoy kung sa anong paraan naganap ang pagpapakita ng Diyos.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Dahil isahan ang pandiwa at malinaw sa konteksto na ang tinutukoy ay ang nag-iisang Diyos, “ang Diyos” ang angkop na salin.
- source_word: עוֹד
  choice: muling
  rationale: Ipinahihiwatig ng עוֹד na naulit ang naunang pagpapakita ng Diyos; maikli at natural itong ipinapahayag ng “muling.”
- source_word: בְּבֹאוֹ
  choice: nang dumating siya
  rationale: Ang ב na kasama ng infinitive construct at hulaping panghalip ay may temporal na diwa rito. Malinaw at natural sa Tagalog ang “nang dumating siya.”
- source_word: מִפַּדַּן אֲרָם
  choice: mula sa Padan-Aram
  rationale: Pangalan ito ng lugar kaya tinumbasan ito sa pamamagitan ng transliterasyon; ang “mula sa” ay tuwirang nagpapahayag ng מִן.
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: at pinagpala siya ng Diyos
  rationale: Ang Piel ng ברך ay nangangahulugang “pagpalain.” Inulit ang “Diyos” bilang simuno upang maiwasan ang kalituhan sa sunod-sunod na panghalip sa Tagalog, habang pinananatili ang Diyos bilang tagapagpala at si Jacob bilang pinagpala.
theological_decisions:
- issue: Kalikasan ng pagpapakita ng Diyos
  choice: Muling nagpakita ang Diyos kay Jacob.
  alternative: Muling inihayag ng Diyos ang kanyang sarili kay Jacob.
  rationale: Inilalahad ng talata ang isang tunay na pagpapakita ng Diyos ngunit hindi sinasabi ang paraan nito. Pinananatili ng “nagpakita” ang bukas na diwa ng Hebreo at hindi ito nililimitahan sa pangitain o sa isang abstraktong paghahayag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang karaniwang baybay na “Padan-Aram.” Inulit ang “Diyos” sa hulí para luminaw ang simuno nang hindi binabago ang kahulugan.
