  yaml_path: translation/ot/genesis/035/020.yaml
  text: And Jacob set up a pillar over her grave[a]. It is the pillar of Rachel’s grave to this day.
translation:
  language: tl
  text: At nagtayo si Jacob ng isang haliging bato sa ibabaw ng libingan niya.[a] Ito ang haliging bato ng libingan ni Raquel hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang batong pananda sa libingan niya” o “isang haliging batong palatandaan ng libingan niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: nagtayo
  rationale: Ang pandiwang Hiphil ay nangangahulugang magtayo o maglagay nang nakatayo; natural sa Filipino ang “nagtayo” para sa isang haliging bato.
- source_word: מַצֵּבָה
  choice: isang haliging bato
  rationale: Tumutukoy ito sa isang batong itinayong patayo. Pinananatili ng “haliging bato” ang kongkretong larawan nang hindi agad ipinapalagay na isa itong masalimuot na monumento.
- source_word: עַל קְבֻרָתָהּ
  choice: sa ibabaw ng libingan niya
  rationale: Ipinapahayag ng parirala ang kinalalagyan ng bato kaugnay ng libingan. Ang “libingan” ay tuwiran at hindi nagpapahiwatig ng marangyang puntod.
- source_word: הִוא
  choice: Ito ang
  rationale: Tinutukoy ng panghalip ang naunang haliging bato at ipinakikilala ang pagkakakilanlan nito.
- source_word: מַצֶּבֶת קְבֻרַת רָחֵל
  choice: ang haliging bato sa libingan ni Raquel
  rationale: Natural itong salin ng ugnayan sa construct chain at malinaw na ang bato ay kaugnay ng libingan ni Raquel.
- source_word: עַד הַיּוֹם
  choice: hanggang sa araw na ito
  rationale: Karaniwang Hebreong idyoma ito para sa pagpapatuloy hanggang sa panahon ng tagapagsalaysay; pinananatili rito ang pormal at malinaw na anyo.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “haliging bato” upang mapanatili ang kongkretong larawan ng Hebreong מַצֵּבָה, habang inilagay sa talababa ang mas interpretibong diwang pananda o palatandaan.
