base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/029.yaml
  text: Then Isaac breathed his last and died[a], and was gathered to his people, old and full of days. And Esau and Jacob, his sons, buried him.
translation:
  language: tl
  text: Pagkatapos, nalagutan ng hininga si Isaac at namatay; natipon siya sa kanyang bayan[a], matanda na at puspos ng mga araw. Inilibing siya ng kanyang mga anak na sina Esau at Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “natipon sa kanyang mga ninuno” o “sa kanyang mga kaanak.” Ang Hebreong pananalita ay isang karaniwang pormula tungkol sa kamatayan at maaaring higit pa sa pisikal na paglilibing ang ipinahihiwatig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: nalagutan ng hininga
  rationale: Ipinahahayag nito sa natural na Filipino ang pagpanaw at pinananatili ang kaibhan nito sa kasunod na tahasang pandiwang “namatay.”
- source_word: וַיָּמָת
  choice: namatay
  rationale: Ito ang tuwiran at karaniwang katumbas ng Hebreong מות at pinananatili ang pagkakasunod ng dalawang pandiwa.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: napisan siya sa kanyang bayan
  rationale: Pinananatili nito ang tradisyonal na pormula ng Hebreo at ang likas na kalabuan kung tumutukoy ito sa pakikipisan sa mga kaanak o ninuno, sa libing, o sa kalagayan pagkamatay.
- source_word: זָקֵן
  choice: matanda na
  rationale: Payak at natural na paglalarawan ito sa katandaan ni Isaac.
- source_word: וּשְׂבַע יָמִים
  choice: puspos ng mga araw
  rationale: Pinananatili ang matalinghagang anyo ng Hebreong pormula sa ulat ng kamatayan sa halip na paliitin ito sa “mahaba ang buhay.”
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: inilibing siya
  rationale: Tuwiran, malinaw, at karaniwang katumbas ito ng pandiwang קבר.
- source_word: עֵשָׂו וְיַעֲקֹב בָּנָיו
  choice: kanyang mga anak na sina Esau at Jacob
  rationale: Natural sa modernong Filipino ang ayos na ito at malinaw na kinikilala ang dalawang naglibing bilang mga anak ni Isaac.
theological_decisions:
- issue: Kahulugan ng pormulang “napisan sa kanyang bayan”
  choice: Pinanatili bilang isang pormulang hindi nililinaw kung ito ay libing, pakikipisan sa mga ninuno o kaanak, o kalagayan pagkamatay.
  alternative: Isalin nang tahasan bilang “napisan sa kanyang mga ninuno” o unawain lamang bilang pagkalibing sa libingan ng pamilya.
  rationale: Hindi tiyak na nilulutas ng Hebreong pahayag ang saklaw ng kahulugan nito. Ang pagpapanatili sa pormula at paglalagay ng talababa ay umiiwas sa pagpasok ng isang tiyak na doktrina sa salin.
translation_notes:
  register: Modernong Filipino na may marangal at bahagyang pampanitikang himig. Ang “nalagutan ng hininga” ay natural at malinaw; ang “puspos ng mga araw” at “napisan sa kanyang bayan” ay sadyang nagpapanatili sa matalinghagang tekstura at kalabuan ng Hebreo.
