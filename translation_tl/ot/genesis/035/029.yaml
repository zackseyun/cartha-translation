revisions:
- from: Pagkatapos, nalagutan ng hininga si Isaac at namatay. Napisan siya sa kanyang bayan[a] nang matanda na at puspos ng mga araw. Inilibing siya ng kanyang mga anak na sina Esau at Jacob.
  to: Pagkatapos, nalagutan ng hininga si Isaac at namatay; natipon siya sa kanyang bayan[a], matanda na at puspos ng mga araw. Inilibing siya ng kanyang mga anak na sina Esau at Jacob.
  rationale: Pinalitan ang “napisan” ng “natipon” upang masundan ang passive na pandiwang Hebreo at mapanatili ang tradisyonal na pormula nang walang teolohikal na pagpapaliwanag. Inayos ang bantas upang malinaw na ang “matanda na at puspos ng mga araw” ay paglalarawan kay Isaac sa ulat ng kanyang kamatayan, hindi isang temporal na modifier lamang ng pagkatipon sa kanyang bayan.
