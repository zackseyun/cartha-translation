id: GEN.35.3
reference: Genesis 35:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נָק֥וּמָה וְ/נַעֲלֶ֖ה בֵּֽית אֵ֑ל וְ/אֶֽעֱשֶׂה שָּׁ֣ם מִזְבֵּ֗חַ לָ/אֵ֞ל הָ/עֹנֶ֤ה אֹתִ/י֙ בְּ/י֣וֹם צָֽרָתִ֔/י וַ/יְהִי֙ עִמָּדִ֔/י בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/003.yaml
  text: Let us rise and go up to Bethel[a], and there I will make an altar to the God who answered me in the day of my distress and was with me on the way that I went.
translation:
  language: tl
  text: Bumangon tayo at umakyat sa Bethel; doon ay gagawa ako ng altar para sa Diyos na sumagot sa akin[a] sa araw ng aking kagipitan at kasama ko sa daang tinahak ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na sumasagot sa akin,” na pinananatili ang Hebreong participle bilang paglalarawan sa karaniwan o nagpapatuloy na pagkilos ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָקוּמָה
  choice: Bumangon tayo
  rationale: Pinananatili nito ang panghikayat na diwa ng cohortative na unang panauhang maramihan sa natural na makabagong Tagalog.
- source_word: וְנַעֲלֶה
  choice: at umakyat
  rationale: Pinananatili ang tiyak na diwang paakyat ng עלה, hindi lamang ang pangkalahatang pagpunta.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng karaniwang transliterasyon, hindi isinaling 'Bahay ng Diyos.'
- source_word: וְאֶעֱשֶׂה שָּׁם מִזְבֵּחַ
  choice: Doon ay gagawa ako ng altar
  rationale: Ang 'gagawa' ay malapit sa malawak na kahulugan ng עשה at likas pa ring pakinggan sa Tagalog.
- source_word: לָאֵל
  choice: para sa Diyos
  rationale: Ipinahahayag ng ל ang pag-aalay o pagtatalaga ng altar sa Diyos; natural sa Tagalog ang 'para sa' sa ganitong gamit.
- source_word: הָעֹנֶה אֹתִי
  choice: na sumagot sa akin
  rationale: Ang participle ay binasang tumutukoy sa tiyak na nakaraang pagtugon ng Diyos na ginugunita ni Jacob, habang itinatala sa talababa ang posibleng pangkalahatan o nagpapatuloy na diwa.
- source_word: בְּיוֹם צָרָתִי
  choice: noong araw ng aking kagipitan
  rationale: Pinananatili ang Hebreong idyomang 'araw ng' at ipinahahayag ng 'kagipitan' ang matinding kalagayan ng צָרָה nang hindi dinaragdagan ang detalye.
- source_word: וַיְהִי עִמָּדִי
  choice: at sumama sa akin
  rationale: Sa konteksto ng paglalakbay, natural na ipinahahayag ng 'sumama sa akin' ang presensiya ng Diyos kay Jacob, bagaman ang literal na anyo ay 'nasa akin/kasama ko.'
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתִּי
  choice: sa daang aking nilakbay
  rationale: Pinananatili ang konkretong larawan ng דרך bilang daan at ang kilos ng paglalakbay sa malinaw at dignified na Tagalog.
theological_decisions:
- issue: Tiyak na pagkakakilanlan ng אֵל sa pananalita ni Jacob
  choice: sa Diyos na sumagot sa akin
  alternative: sa isang Diyos na sumagot sa akin / sa Diyos
  rationale: Ang artikulo at kasunod na participial clause ay tumutukoy nang tiyak sa Diyos ayon sa ginawa niya para kay Jacob. Sa Tagalog, na walang katumbas na definite article, naipakikita ang katiyakan sa sugnay na 'na sumagot sa akin' nang hindi nagdaragdag ng doktrina.
- issue: Pamanahong diwa ng participle הָעֹנֶה
  choice: na sumagot sa akin
  alternative: na sumasagot sa akin
  rationale: Ipinahihiwatig ng konteksto ang isang tiyak na nakaraang pagtugon sa panahon ng kagipitan, ngunit maaari ring ilarawan ng participle ang katangian o patuloy na pagkilos ng Diyos; pinanatili ang alternatibong ito sa talababa.
- issue: Diwa ng presensiya sa וַיְהִי עִמָּדִי
  choice: sumama sa akin
  alternative: kasama ko
  rationale: Ang konteksto ng daan at paglalakbay ay nagpapahintulot sa dinamikong 'sumama sa akin,' ngunit hindi ito pinalawak tungo sa partikular na paraan ng paggabay o pagliligtas na hindi hayag sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'altar' bilang karaniwan at madaling maunawaang terminong panrelihiyon; iniwasan ang mas arkaikong ayos at bokabularyo.
