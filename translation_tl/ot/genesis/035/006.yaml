base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/006.yaml
  text: So Jacob came to Luz (that is[a], Bethel), which is in the land of Canaan, he and all the people who were with him.
translation:
  language: tl
  text: Dumating si Jacob sa Luz (iyon ay Bethel[a]), na nasa lupain ng Canaan, siya at ang lahat ng taong kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, kapuwa binanggit ang mas naunang pangalan ng lugar na “Luz” at ang pagkakakilanlan nito bilang “Bethel.”
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Ang Qal wayyiqtol ng בוא ay tumutukoy sa pagdating sa isang patutunguhan; natural at malinaw sa salaysay ang “dumating.”
- source_word: לוּזָה
  choice: sa Luz
  rationale: Ang hulaping he ay nagsasaad ng direksiyon patungo sa lugar; ipinahahayag ito sa Filipino sa pamamagitan ng “sa,” habang pinananatili ang pangalang Luz.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: na nasa lupain ng Canaan
  rationale: Tuwirang pinananatili ang sugnay na tumutukoy sa kinaroroonan ng Luz.
- source_word: הִוא בֵּית אֵל
  choice: iyon ay ang Bethel
  rationale: Pinananatili ang paliwanag na ang Luz ay kinikilalang Bethel, nang hindi inaalis ang mas matandang pangalan ng lugar.
- source_word: הוּא וְכָל הָעָם אֲשֶׁר עִמּוֹ
  choice: kasama ang lahat ng taong kasama niya
  rationale: 'Natural na Filipino itong paglalahad sa appositional na parirala: si Jacob at ang buong pangkat na sumama sa kanya. Ang “mga taong” ay hindi nagpapahiwatig na isang bansa o lahi ang tinutukoy.'
