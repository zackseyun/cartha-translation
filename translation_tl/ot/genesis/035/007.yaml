base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/007.yaml
  text: There he built an altar and called the place El-bethel[a], because there God had revealed himself to him when he fled from his brother.
translation:
  language: tl
  text: Doon ay nagtayo siya ng isang altar at tinawag niyang El-Bethel[a] ang lugar, sapagkat doon nagpakita sa kanya ang Diyos nang tumakas siya palayo sa kanyang kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang El-Bethel ay malamang na nangangahulugang “Diyos ng Bethel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Doon ay nagtayo siya ng isang altar
  rationale: Tuwirang inililipat ang karaniwang salaysay na pandiwa at ang pang-abay na שָׁם; natural at marangal sa modernong Filipino ang ayos.
- source_word: וַיִּקְרָא לַמָּקוֹם
  choice: tinawag niyang ... ang lugar
  rationale: Ang קרא + לְ sa konteksto ng pagpapangalan ay likas na naipapahayag sa Filipino bilang pagtawag o pagbibigay-ngalan sa lugar.
- source_word: אֵל בֵּית אֵל
  choice: El-Bethel
  rationale: Pinanatili bilang transliteradong pangalang ibinigay sa lugar; inilalagay sa talababa ang malamang na kahulugan nito.
- source_word: כִּי שָׁם
  choice: sapagkat doon
  rationale: Ipinakikita ang dahilan ng pagpapangalan at pinananatili ang pag-uulit ng שָׁם.
- source_word: נִגְלוּ אֵלָיו הָאֱלֹהִים
  choice: nagpakita sa kanya ang Diyos
  rationale: Ang Niphal ng גלה ay natural na 'nagpakita' sa konteksto ng banal na pagpapahayag. Bagaman kapwa anyong maramihan ang pandiwa at אֱלֹהִים, iisang Diyos ang tinutukoy sa konteksto.
- source_word: בְּבָרְחוֹ מִפְּנֵי אָחִיו
  choice: nang tumakas siya mula sa kanyang kapatid
  rationale: Ang infinitive construct na may בְּ ay temporal, kaya 'nang'; ang מִפְּנֵי sa konteksto ng pagtakas ay natural na 'mula sa.'
theological_decisions:
- issue: Maramihang anyo ng אֱלֹהִים at ng pandiwang נִגְלוּ habang ang Diyos ng Israel ang tinutukoy
  choice: 'Isahan: “nagpakita sa kanya ang Diyos”'
  alternative: Mas pormal ngunit di-likas na maramihang pahayag, o “ipinahayag ng Diyos ang kanyang sarili sa kanya”
  rationale: Malinaw sa konteksto ng Bethel na iisang Diyos ang tinutukoy. Iniiwasan ng isahang salin ang maling pahiwatig na maraming diyos, samantalang ang “nagpakita” ay tapat sa di-tahasang paraan ng banal na pagpapahayag.
- issue: Kung isasalin o ita-transliterate ang אֵל בֵּית אֵל
  choice: El-Bethel sa pangunahing teksto
  alternative: Diyos ng Bethel
  rationale: Gumaganap ang parirala bilang pangalang ibinigay ni Jacob sa lugar. Pinananatili ng transliterasyon ang kilos ng pagpapangalan, habang inililinaw ng talababa ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Pinanatili ang dalawang paglitaw ng “doon” at ang pangalang El-Bethel, nang hindi pinapawi ang kakaibang anyong maramihan sa Hebreo sa pamamagitan ng mapagpalagay na paliwanag.
