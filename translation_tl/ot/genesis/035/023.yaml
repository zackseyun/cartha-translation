lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: Ang mga anak na lalaki ni Lea
  rationale: Tumutukoy ang anyong construct plural sa anim na lalaking anak ni Lea; nililinaw ng “anak na lalaki” ang kasarian na tahasang ipinahihiwatig ng בְּנֵי sa talaang ito.
- source_word: בְּכוֹר יַעֲקֹב רְאוּבֵן
  choice: si Ruben, na panganay ni Jacob
  rationale: 'Pinananatili ang ugnayang appositional: si Ruben ang tinutukoy na panganay ni Jacob. Natural ito sa modernong Tagalog nang hindi pinapalitan ang “panganay” ng mas interpretatibong pananalita.'
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: לֵוִי
  choice: Levi
  rationale: Tuwirang transliterasyon at karaniwang anyo sa Tagalog.
- source_word: יְהוּדָה
