  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: יִשָּׂשכָר
  choice: Isacar
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: זְבוּלֻן
  choice: Zebulun
  rationale: Malapit na transliterasyon ng pangalang Hebreo at malinaw sa modernong mambabasa.
- source_word: וְ
  choice: mga kuwit, at “at” bago ang huling pangalan
  rationale: Ang paulit-ulit na pang-ugnay sa Hebreo ay inangkop sa likas na paraan ng paglilista sa Tagalog, habang pinananatili ang pagkakasunod-sunod ng mga pangalan.
