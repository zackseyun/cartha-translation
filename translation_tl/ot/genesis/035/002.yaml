  to: Pagkatapos, sinabi ni Jacob sa kanyang sambahayan at sa lahat ng kasama niya, “Alisin ninyo ang mga banyagang diyos[a] na nasa gitna ninyo, magpakadalisay kayo[b], at magpalit kayo ng damit.”
