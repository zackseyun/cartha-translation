base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/002.yaml
  text: Then Jacob said to his household and to all who were with him[a], “Put away the foreign gods that are among you, purify yourselves[b], and change your clothes.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Jacob sa kanyang sambahayan at sa lahat ng kasama niya, “Alisin ninyo ang mga banyagang diyos[a] na nasa gitna ninyo, magpakadalisay kayo[b], at magpalit kayo ng damit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga diyos ng mga dayuhan” o “mga kakaibang diyos.”
    reason: lexical_alternative
  - marker: b
    text: Ang “magpakadalisay kayo” ay maaaring tumukoy sa ritwal na paglilinis bilang paghahanda sa paglapit sa Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: kanyang sambahayan
  rationale: Ang literal na ‘kanyang bahay’ ay tumutukoy rito sa mga taong kabilang sa sambahayan ni Jacob, hindi sa gusali.
- source_word: כָּל אֲשֶׁר עִמּוֹ
  choice: lahat ng kasama niya
  rationale: Natural at malinaw itong tumutukoy sa lahat ng taong kasama ni Jacob.
- source_word: הָסִרוּ
  choice: Alisin ninyo
  rationale: Tuwirang ipinahahayag nito ang pautos na anyo at ang pag-aalis sa mga bagay na ginagamit sa pagsamba sa ibang mga diyos.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: mga diyos ng mga dayuhan
  rationale: Pinananatili nito ang anyong konstrukto ng Hebreo at ang posibilidad na ang tinutukoy ay mga diyos na kaugnay ng mga dayuhan o banyagang pagsamba.
- source_word: בְּתֹכְכֶם
  choice: na nasa gitna ninyo
  rationale: 'Pinananatili nito ang lawak ng Hebreo: maaaring tumukoy sa presensiya ng mga diyos na ito sa komunidad at sa pag-iingat ng kanilang mga larawan o kagamitan.'
- source_word: וְהִטַּהֲרוּ
  choice: magpakadalisay kayo
  rationale: Ipinakikita nito ang reflexive na utos at pinananatili ang posibleng ritwal na diwa nang hindi tinutukoy ang paraang hindi naman binanggit sa talata.
- source_word: וְהַחֲלִיפוּ שִׂמְלֹתֵיכֶם
  choice: magpalit kayo ng damit
  rationale: Ito ang natural na modernong Tagalog para sa pagpalit ng kasuotan at malinaw na distributibo sa konteksto.
theological_decisions:
- issue: Kalikasan ng utos na magpakadalisay
  choice: magpakadalisay kayo
  alternative: linisin ninyo ang inyong sarili
  rationale: Ang konteksto ng pag-aalis ng ibang mga diyos at paghahanda sa paglapit sa Diyos ay nagpapahiwatig ng posibleng ritwal o tipanang pagdadalisay. Pinananatili ng salin ang pahiwatig na iyon nang hindi nagdaragdag ng isang tiyak na seremonya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sambahayan” para sa panlipunang kahulugan ng בֵּיתוֹ, at ang “magpakadalisay” upang mapanatili ang posibleng ritwal na diwa ng utos.
