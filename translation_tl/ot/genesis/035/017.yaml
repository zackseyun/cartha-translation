  text: And when her labor was hard[a], the midwife said to her, “Do not fear[b], for this also is a son for you.”
translation:
  language: tl
  text: Habang nahihirapan siyang manganak, sinabi sa kanya ng komadrona, “Huwag kang matakot, dahil anak mo ring lalaki ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְהַקְשֹׁתָהּ בְלִדְתָּהּ
  choice: Habang nahihirapan siyang manganak
  rationale: Ipinahahayag ng konstruksyon ang pangyayaring kasabay ng mahirap na panganganak. Natural sa modernong Tagalog ang “habang nahihirapan siyang manganak” at malinaw nitong pinananatili ang tindi ng hirap.
- source_word: הַמְיַלֶּדֶת
  choice: komadrona
  rationale: Ito ang tiyak at karaniwang katawagan sa babaeng tumutulong sa panganganak; mas eksakto rito kaysa sa mas malawak na kahulugan ng “hilot.”
- source_word: אַל תִּירְאִי
  choice: Huwag kang matakot
  rationale: Direkta at natural na katumbas ng pambabaeng anyo ng pagbabawal sa Hebreo.
- source_word: כִּי
  choice: dahil
  rationale: Ipinakikilala nito ang dahilan ng pagpapalakas-loob ng komadrona.
- source_word: גַּם זֶה לָךְ בֵּן
  choice: anak mo ring lalaki ito
  rationale: Pinananatili ng “ito” ang demonstratibong pagtukoy sa sanggol at ng “rin” ang pagdaragdag na ipinahahayag ng גַּם, nang hindi ipinapasok ang mas interpretibong “isa pa.”
