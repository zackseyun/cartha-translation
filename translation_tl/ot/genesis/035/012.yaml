base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/012.yaml
  text: And the land that I gave to Abraham and to Isaac[a], I will give to you[b]; and to your offspring after you I will give the land.
translation:
  language: tl
  text: At ang lupaing ibinigay ko kay Abraham at kay Isaac[a] ay ibibigay ko sa iyo; at ibibigay ko ang lupain sa iyong lahi[b] pagkatapos mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “naibigay ko na kina Abraham at Isaac.”
    reason: lexical_alternative
  - marker: b
    text: Ang “lahi” ay salin ng pangngalang isahan na may kolektibong diwa; maaari rin itong isaling “binhi” o “mga inapo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Sa konteksto ng pangako sa mga patriyarka, ang “lupain” ang likas at tiyak na salin; mas angkop ito kaysa “bansa” o “daigdig.”
- source_word: אֲשֶׁר
  choice: -ng (lupaing ibinigay)
  rationale: Ginamit ang pang-angkop sa “lupaing ibinigay” bilang natural na paraang Tagalog upang ihayag ang sugnay na panuring.
- source_word: נָתַתִּי
  choice: ibinigay ko
  rationale: Pinananatili ng aspektong naganap ang pagtukoy sa naunang pagkakaloob o pangako ng Diyos kina Abraham at Isaac.
- source_word: לְאַבְרָהָם וּלְיִצְחָק
  choice: kay Abraham at kay Isaac
  rationale: Inulit ang “kay” upang katawanin ang inuulit na pang-ukol sa Hebreo at upang luminaw na kapuwa sila ang pinagkalooban.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: ibibigay ko sa iyo
  rationale: Malinaw mula sa nauunang “lupain” ang layon ng pandiwa, kaya natural sa Tagalog na huwag nang ulitin dito ang panghalip na “iyon.”
- source_word: זַרְעֲךָ
  choice: iyong lahi
  rationale: Ang זֶרַע ay pangngalang isahan na may kolektibong diwa. Ang “lahi” ay natural sa modernong Tagalog at hindi ipinipilit kung iisang inapo o maraming salinlahi ang tinutukoy.
- source_word: אַחֲרֶיךָ
  choice: pagkatapos mo
  rationale: Tuwirang pinananatili ang temporal at salinlahing diwa ng parirala.
- source_word: אֶתֵּן אֶת הָאָרֶץ
  choice: ibibigay ko ang lupain
  rationale: Pinanatili ang pag-uulit ng “ibibigay” at “lupain,” gaya ng Hebreo, upang idiin ang pangako sa lahi ni Jacob.
theological_decisions:
- issue: Ugnayan ng naganap at hinaharap na pagkakaloob ng lupain
  choice: Isinalin ang נָתַתִּי bilang “ibinigay ko” at ang kasunod na mga pandiwa bilang “ibibigay ko.”
  alternative: Maaaring isalin ang נָתַתִּי bilang “naibigay ko na” upang idiin ang nananatiling bisa ng naunang pangako.
  rationale: Magkatabing inilalahad ng Hebreo ang naunang pagkakaloob ng Diyos at ang pangako ng pagkakaloob sa hinaharap. Pinananatili ng salin ang temporal at teolohikal na tensiyong ito sa halip na pag-isahin ang mga ito.
- issue: Kolektibong saklaw ng זַרְעֲךָ
  choice: Ginamit ang “iyong lahi,” na maaaring tumukoy nang kolektibo sa mga magmumula kay Jacob.
  alternative: “iyong binhi” o “iyong mga inapo”
  rationale: Hindi dapat tahimik na limitahan ang kolektibong pangngalan sa isang indibidwal o tahasang gawing maramihan; pinananatili ng “lahi” ang lawak ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit at ang pagkakaiba ng naganap na “ibinigay” at hinaharap na “ibibigay.” Inilagay ang [a] kasunod ng pariralang saklaw nito at ang [b] kasunod ng buong pahayag tungkol sa lahi upang hindi maputol ang natural na daloy.
