base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/022.yaml
  text: And it happened[a], while Israel was dwelling in that land, that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it[b]. Now the sons of Jacob were twelve.
translation:
  language: tl
  text: 'Habang naninirahan si Israel sa lupaing iyon, pumunta si Ruben at sumiping kay Bilha, ang pangalawahing asawa ng kanyang ama. Nabalitaan iyon ng Israel.[a]


    Labindalawa ang mga anak ni Jacob.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “at narinig ng Israel.” Hindi tahasang binanggit ang layon, ngunit malinaw na ang ginawa ni Ruben ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “At ang mga anak ni Jacob ay labindalawa.” Malamang na nagsisilbi itong transisyon patungo sa talaan ng mga anak sa mga kasunod na talata.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בִּשְׁכֹּן
  choice: Habang naninirahan
  rationale: Ang ב na kasunod ng infinitive construct ay nagtatakda ng kasabay na pangyayari. Likas sa modernong Tagalog ang “Habang naninirahan” at hindi na kailangang isalin nang hiwalay ang pormulang וַיְהִי.
- source_word: בָּאָרֶץ הַהִוא
  choice: sa lupaing iyon
  rationale: Tumutukoy ang אֶרֶץ sa lokal na lupain o rehiyon; ang “lupaing iyon” ay malinaw at hindi nagpapahiwatig ng buong daigdig.
- source_word: וַיֵּלֶךְ
  choice: pumunta
  rationale: Pinananatili ang hiwalay na pandiwang Hebreo bago ang sumunod na kilos ni Ruben.
- source_word: וַיִּשְׁכַּב אֶת
  choice: sumiping kay
  rationale: Karaniwang idyomang Hebreo ito para sa pakikipagtalik. Ang “sumiping kay” ay tuwiran ngunit marangal, at hindi labis na klinikal o malabo.
- source_word: פִּילֶגֶשׁ
  choice: pangalawahing asawa
  rationale: Ipinapahayag nito sa madaling maunawaang Tagalog ang kinikilalang ugnayan sa sambahayan na mas mababa ang katayuan kaysa pangunahing asawa. Iniiwasan nito ang mapanlait o makabagong pahiwatig ng “kerida” at “kalunya.”
- source_word: וַיִּשְׁמַע יִשְׂרָאֵל
  choice: Nabalitaan iyon ng Israel
  rationale: Walang tahasang layon ang “Israel heard” sa Hebreo, ngunit malinaw na ang ginawa ni Ruben ang tinutukoy. Likas sa Tagalog ang paglalagay ng “iyon,” habang itinatala sa talababa ang literal na anyo.
- source_word: וַיִּהְיוּ בְנֵי יַעֲקֹב שְׁנֵים עָשָׂר
  choice: Labindalawa ang mga anak ni Jacob
  rationale: Natural na pangungusap ito sa Tagalog at pinananatili ang payak na pahayag na bilang, na nagsisilbing transisyon patungo sa talaan sa mga kasunod na talata.
theological_decisions:
- issue: Paglalahad sa seksuwal na ginawa ni Ruben
  choice: sumiping kay
  alternative: nakipagtalik kay
  rationale: Pinananatili ng “sumiping kay” ang tuwiran at mabigat na diwa ng idyomang Hebreo nang hindi ito ginagawang mas klinikal kaysa sa pinagmulan.
- issue: Katayuan ni Bilha bilang פִּילֶגֶשׁ
  choice: pangalawahing asawa
  alternative: kalunya
  rationale: Ipinakikita ng piniling salita ang kinikilalang ngunit mas mababang katayuan niya sa sinaunang sambahayan, nang hindi ipinapasok ang mapanlait na modernong pakahulugan ng alternatibo.
- issue: Reaksiyon ng Israel at tungkulin ng huling sugnay
  choice: Isaad lamang na nabalitaan niya iyon, saka ilahad ang bilang ng mga anak ni Jacob bilang transisyon.
  alternative: Magpahiwatig ng pagsang-ayon, pananahimik, o agarang paghatol ng Israel.
  rationale: Hindi sinasabi ng tekstong Hebreo kung ano ang reaksiyon ng Israel. Hindi dapat dagdagan ng salin ang anumang moral o hudisyal na tugon na hindi tahasang nakasaad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “sumiping” upang mapanatili ang direktang idyoma nang hindi nagiging magaspang, at “pangalawahing asawa” upang maipahayag ang sinaunang katayuang panlipunan ni Bilha nang walang mapanlait na modernong konotasyon.
