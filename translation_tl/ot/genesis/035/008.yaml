  text: וַ/תָּ֤מָת דְּבֹרָה֙ מֵינֶ֣קֶת רִבְקָ֔ה וַ/תִּקָּבֵ֛ר מִ/תַּ֥חַת לְ/בֵֽית אֵ֖ל תַּ֣חַת הָֽ/אַלּ֑וֹן וַ/יִּקְרָ֥א שְׁמ֖/וֹ אַלּ֥וֹן בָּכֽוּת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
translation:
  language: tl
  text: Namatay si Debora, ang tagapagpasuso ni Rebeca, at inilibing siya sa ibaba ng Bethel, sa ilalim ng puno ng ensina[a]. Kaya tinawag niya itong Allon-bacut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo para sa puno ay maaaring tumukoy sa ensina o terebinto; hindi tiyak ang eksaktong uri nito.
    reason: lexical_alternative
  - marker: b
    text: Ang Allon-bacut ay malamang na nangangahulugang “Ensina ng Pagtangis”; kung terebinto ang tinutukoy ng אַלּוֹן, “Terebinto ng Pagtangis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵינֶקֶת
  choice: tagapag-alaga
  rationale: Tumutukoy ito sa babaeng nagpasuso at nag-alaga sa isang bata. Likas sa makabagong Tagalog ang “tagapag-alaga” at hindi nito labis na nililimitahan ang matagal nang papel ni Debora bilang tagapagpasuso lamang.
- source_word: מִתַּחַת לְבֵית אֵל
  choice: sa ibaba ng Bethel
  rationale: Pinananatili nito ang panlokasyong diwa na mas mababa sa Bethel nang hindi ipinapalagay na tiyak na ‘timog’ ang ibig sabihin.
- source_word: תַּחַת הָאַלּוֹן
  choice: sa ilalim ng malaking puno
  rationale: Malinaw ang תַּחַת bilang ‘sa ilalim ng.’ Hindi tiyak kung anong uri ng puno ang אַלּוֹן, kaya hindi pinili sa pangunahing teksto ang espesipikong ‘ensina’ o ‘terebinto.’
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: Kaya tinawag niya itong
  rationale: Aktibo at panlalaking isahan ang pandiwa, ngunit hindi tahasang binanggit ang simuno. Pinananatili ng ‘niya’ ang di-tiyak na simuno, habang ang ‘itong’ ay natural na tumutukoy sa puno o pook na pinangalanan.
- source_word: אַלּוֹן בָּכוּת
  choice: Alon-bacut
  rationale: Isinalin sa baybay-Tagalog ang pangalang Hebreo sa halip na isalin sa pangunahing teksto; ibinigay sa talababa ang malamang na kahulugan nito.
- source_word: וַתִּקָּבֵר
  choice: inilibing siya
  rationale: Likas na salin ng anyong Niphal na hindi nagdaragdag ng tahasang gumawa ng paglilibing.
- source_word: וַתָּמָת
  choice: Namatay
  rationale: Direktang ipinahahayag ang simpleng kahulugan ng pandiwang Hebreo nang hindi ito pinalalambot.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “tagapag-alaga” upang maging madaling maunawaan nang hindi labis na nililimitahan ang מֵינֶקֶת sa aktuwal na pagpapasuso. Pinanatili ang di-tiyak na uri ng puno sa pangunahing teksto at ipinaliwanag ang mga posibilidad sa talababa.
