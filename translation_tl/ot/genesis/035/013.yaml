  text: Then God went up from him in the place where he had spoken with him[a].
translation:
  language: tl
  text: Pagkatapos, umakyat ang Diyos mula kay Jacob sa lugar kung saan nakipag-usap ang Diyos kay Jacob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “pumaitaas mula sa kanya.” Pinananatili ng Hebreo ang paitaas na pagkilos sa paglisan ng Diyos matapos ang pagtatagpo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: pumaitaas
  rationale: Ang qal na עלה ay karaniwang nangangahulugang ‘umakyat’ o ‘pumaitaas.’ Pinananatili ng ‘pumaitaas’ ang tahasang paitaas na pagkilos sa paglisan ng Diyos, sa halip na gawing ‘umalis’ lamang.
- source_word: מֵעָלָיו
  choice: mula sa piling niya
  rationale: Literal itong may diwang ‘mula sa ibabaw niya,’ ngunit hindi natural iyon sa Tagalog sa kontekstong ito. Ipinahahayag ng ‘mula sa piling niya’ ang paglisan mula sa kinaroroonan ni Jacob nang hindi nawawala ang ugnayang personal sa tagpo.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman anyong maramihan ang salita, isahan ang pandiwa at tumutukoy ito rito sa iisang Diyos.
- source_word: בַּמָּקוֹם
  choice: sa lugar
  rationale: Ang pang-ukol na בְּ sa pariralang ito ay likas na maisasalin bilang ‘sa,’ na angkop sa pook ng pagtatagpo.
- source_word: אֲשֶׁר
  choice: kung saan
  rationale: Dahil ‘lugar’ ang tinutukoy, natural na ipinapakilala ng ‘kung saan’ ang sugnay na naglalarawan sa lokasyon.
- source_word: דִּבֶּר אִתּוֹ
  choice: siya ay nakipag-usap sa kanya
  rationale: Ang piel ng דבר kasama ang אֵת ay nagpapahiwatig ng pakikipag-usap ‘kasama’ o ‘kay’ Jacob. Ang ‘nakipag-usap’ ay natural at pinananatili ang relasyonal na diwa, bagaman ang mga panghalip ay umaasa sa konteksto para sa kanilang tinutukoy.
theological_decisions:
- issue: Antropomorpiko at panlugar na paglalarawan sa paglisan ng Diyos
  choice: Pinanatili ang paitaas na pagkilos sa ‘pumaitaas ang Diyos mula sa piling niya.’
  alternative: Pagkatapos, umalis ang Diyos sa kanya.
  rationale: Karaniwang salita para sa pag-akyat ang gamit ng Hebreo. Ang pagpapanatili nito ay gumagalang sa larawan ng pagpapakita at paglisan ng Diyos nang hindi ipinapaliwanag o binabawasan ang panlugar na pananalita ng teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘pumaitaas’ upang mapanatili ang konkretong kilos ng Hebreo; ang ‘mula sa piling niya’ ay mas natural kaysa sa literal na ‘mula sa ibabaw niya.’
