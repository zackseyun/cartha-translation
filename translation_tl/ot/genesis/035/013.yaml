  naturalness: Ang “pumaitaas” ay nauunawaan ngunit hindi kasingsidhi ng pagiging natural ng “umakyat” sa modernong Filipino. Ang “kung saan siya nakipag-usap sa kanya” ay mabigat at malabo kung sino ang tinutukoy ng bawat panghalip.
  terminology: Ang “Diyos” ay tama para sa אֱלֹהִים sa kontekstong ito. Pinananatili ng “umakyat” ang antropomorpiko at panlugar na larawan ng Hebreo nang hindi ito ipinapaliwanag bilang simpleng paglisan.
