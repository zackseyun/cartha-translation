base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/026.yaml
  text: 'And the sons of Zilpah[a], Leah’s servant: Gad and Asher[b]. These are the sons of Jacob who were born to him in Paddan-aram.'
translation:
  language: tl
  text: 'At ang mga anak na lalaki ni Zilpa[a], na alilang babae ni Lea: sina Gad at Aser[b]. Ito ang mga anak na lalaki ni Jacob na ipinanganak sa kanya sa Padan-Aram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa isang babaeng alipin o tagapaglingkod; maaari rin itong isaling “babaeng tagapaglingkod” o “babaeng alipin.”
    reason: lexical_alternative
  - marker: b
    text: Bagaman inuugnay ng pangwakas na sugnay ang mga anak na lalaki ni Jacob sa Padan-Aram, ipinanganak si Benjamin kalaunan sa Canaan (tal. 16–18). Tila binubuod ng pahayag ang mga anak na kaugnay ng panahon ng sambahayan ni Jacob sa Aram, ngunit hindi tahasang nililinaw ng Hebreo ang pagkakaibang ito.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי זִלְפָּה
  choice: At ang mga anak ni Zilpa
  rationale: Ang בְּנֵי ay tiyak na tumutukoy sa mga anak na lalaki, ngunit sa natural na Tagalog, malinaw na ito sa mga pangalang Gad at Aser at sa konteksto ng talaan; pinanatili rin ang pang-ugnay na וּ bilang “At.”
- source_word: שִׁפְחַת לֵאָה
  choice: na alilang babae ni Lea
  rationale: Ipinahahayag ng שִׁפְחָה ang isang babaeng nasa katayuang alipin o tagapaglingkod. Ang “alilang babae” ay malinaw, kasalukuyang mauunawaan, at hindi pinapahina ang katayuang panlipunang nakapaloob sa Hebreo.
- source_word: גָּד וְאָשֵׁר
  choice: sina Gad at Aser
  rationale: Ginamit ang pantukoy na “sina” na likas sa Tagalog para sa dalawang personal na pangalan; isinalin ang mga pangalan ayon sa karaniwang anyong Filipino.
- source_word: אֵלֶּה בְּנֵי יַעֲקֹב
  choice: Ito ang mga anak ni Jacob
  rationale: Ang “Ito ang” ay likas na panimulang buod sa Tagalog. Bagaman literal na “mga anak na lalaki,” sapat at hindi malabo ang “mga anak” sa kontekstong ito.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: na ipinanganak sa kanya
  rationale: Pinananatili ang balintiyak na anyo at ang pananaw kay Jacob; hindi nagdaragdag ng isang tahasang babaeng simuno na wala sa Hebreo.
- source_word: בְּפַדַּן אֲרָם
  choice: sa Padan-Aram
  rationale: Pinanatili bilang pangalan ng lugar sa halip na bigyan ng di-tiyak na etimolohikal na salin.
theological_decisions:
- issue: Ang pahayag na ipinanganak kay Jacob ang mga anak “sa Padan-Aram” samantalang ipinanganak si Benjamin sa Canaan
  choice: Pinanatili nang tuwiran ang pangkalahatang pahayag ng tekstong Hebreo at nilagyan ng talababa ang heograpikong tensiyon.
  alternative: Baguhin ang pangunahing teksto upang tahasang ibukod si Benjamin o sabihing tumutukoy lamang ito sa panahon ng sambahayan ni Jacob sa Aram.
  rationale: Hindi tahasang ibinubukod ng sugnay na Hebreo si Benjamin, kaya hindi nararapat lutasin ang tensiyon sa pamamagitan ng pagdaragdag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na may marangal at payak na himig. Ginamit ang “alilang babae” upang maging natural ngunit tapat sa kasarian at mababang katayuang panlipunan ng שִׁפְחָה. Ang mga pangalang Zilpa, Lea, Gad, Aser, at Jacob ay nasa karaniwang anyong Filipino; pinanatili ang Padan-Aram bilang transliteradong pangalan ng lugar.
