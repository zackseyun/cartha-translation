base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
translation:
  language: tl
  text: Habang lumilisan ang kanyang buhay—sapagkat naghihingalo siya—pinangalanan niya ang anak na Ben-oni[a]; ngunit pinangalanan siya ng kanyang ama na Benjamin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Ben-oni ay malamang na nangangahulugang “anak ng aking dalamhati” o “anak ng aking paghihirap.”
    reason: lexical_alternative
  - marker: b
    text: Ang Benjamin ay malamang na nangangahulugang “anak ng kanang kamay”; nauunawaan naman ito ng ilan bilang “anak ng timog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת נַפְשָׁהּ
  choice: Habang lumilisan ang kanyang buhay
  rationale: Maaaring tumukoy ang נֶפֶשׁ sa buhay o sa sarili ng isang taong nabubuhay. Ang “buhay” ay natural sa konteksto ng kamatayan at hindi nagpapasok ng mas teknikal na aral tungkol sa kaluluwa kaysa sa ipinahihiwatig ng Hebreo. Ang ב na may infinitive construct ay isinaling panahunan bilang “habang.”
- source_word: כִּי מֵתָה
  choice: sapagkat naghihingalo siya
  rationale: Ipinaliliwanag ng sugnay ang pag-alis ng kanyang buhay. Sa daloy ng salaysay, kasabay ng kanyang pagkamatay ang pagbibigay niya ng pangalan, kaya malinaw at natural ang “naghihingalo siya.”
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: pinangalanan niya ang anak
  rationale: Ang idyomang Hebreo na literal na “tinawag niya ang pangalan nito” ay natural na ipinahayag sa modernong Tagalog bilang “pinangalanan niya.” Idinagdag ang “anak” bilang malinaw na reperente, hindi bilang bagong impormasyon.
- source_word: בֶּן אוֹנִי
  choice: Ben-oni
  rationale: Pinanatili ang personal na pangalan sa transliterasyon. Dahil mahalaga sa salaysay ang posibleng kahulugan nito, inilagay ang paliwanag sa talababa.
- source_word: וְאָבִיו קָרָא לוֹ
  choice: ngunit pinangalanan ito ng ama nito
  rationale: Ang וְ ay isinaling “ngunit” upang ihayag ang malinaw na pagsalungat ng pangalang ibinigay ng ama sa pangalang ibinigay ng ina.
- source_word: בִנְיָמִין
  choice: Benjamin
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalan. Ang dalawang pangunahing posibleng kahulugan nito ay pinanatili sa talababa.
theological_decisions:
- issue: Kahulugang antropolohikal ng נֶפֶשׁ sa konteksto ng kamatayan
  choice: Isinalin bilang “buhay” sa halip na “kaluluwa.”
  alternative: kaluluwa
  rationale: Maaaring tukuyin ng salitang Hebreo ang buhay o ang taong nabubuhay, at hindi nito kinakailangang tahasang ilarawan ang isang di-materyal na kaluluwang humihiwalay sa katawan. Pinananatili ng “buhay” ang diwa ng salaysay nang hindi nilulutas ang mas malawak na usaping teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pinangalanan” bilang likas na katumbas ng idyomang Hebreo sa pagbibigay ng pangalan, at pinanatili ang mga pangalan sa kinagawiang transliterasyon.
