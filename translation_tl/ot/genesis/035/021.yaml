  yaml_path: translation/ot/genesis/035/021.yaml
  text: Then Israel journeyed on and pitched his tent beyond Migdal-eder[a].
translation:
  language: tl
  text: Pagkatapos, nagpatuloy sa paglalakbay si Israel at itinayo ang kanyang tolda lampas sa Migdal-eder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang ibig sabihin ng Migdal-eder ay “tore ng kawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: nagpatuloy sa paglalakbay
  rationale: Ipinahahayag ng נסע sa sunod-sunod na salaysay ang pag-alis at pagpapatuloy ng paglalakbay; likas sa makabagong Tagalog ang pariralang ito.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Israel ang pangalang tahasang ginamit sa tekstong Hebreo, kaya hindi ito pinalitan ng Jacob.
- source_word: וַיֵּט
  choice: itinayo
  rationale: Kapag tolda ang layon, ang נטה ay tumutukoy sa pagtatayo o pagbubuklat nito; 'itinayo' ang pinakanatural na katumbas sa Tagalog.
- source_word: אָהֳלֹה
  choice: ang kanyang tolda
  rationale: Ang אֹהֶל ay 'tolda,' at ang hulaping panlalaking isahan ay nangangahulugang 'kanyang.'
- source_word: מֵהָלְאָה
  choice: sa kabila ng
  rationale: Ipinahahayag ng מֵהָלְאָה ang lokasyong mas malayo o lampas sa isang palatandaan; malinaw itong naihahatid ng 'sa kabila ng.'
- source_word: לְמִגְדַּל עֵדֶר
  choice: Migdal-eder
  rationale: Gumaganap itong pangalan ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon; inilagay sa talababa ang literal na kahulugan.
