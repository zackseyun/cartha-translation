language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶֽל יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית אֵ֖ל וְ/שֶׁב שָׁ֑ם וַ/עֲשֵׂה שָׁ֣ם מִזְבֵּ֔חַ לָ/אֵל֙ הַ/נִּרְאֶ֣ה אֵלֶ֔י/ךָ בְּ/בָרְחֲ/ךָ֔ מִ/פְּנֵ֖י עֵשָׂ֥ו אָחִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/001.yaml
  text: Then God said to Jacob[a], “Arise, go up to Bethel and dwell there, and make there an altar to the God who appeared to you when you fled from the presence of Esau your brother.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng Diyos kay Jacob, “Tumindig ka, umakyat ka sa Bethel, at manirahan ka roon. Gumawa ka roon ng altar para sa Diyos na nagpakita sa iyo nang tumakas ka mula sa iyong kapatid na si Esau.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng pangyayari.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang pangngalan, isahan ang pandiwa at malinaw sa konteksto na tumutukoy ito sa iisang Diyos.
- source_word: קוּם
  choice: Tumindig ka
  rationale: Pinananatili nito ang lakas ng pautos at ang marangal na tono, nang hindi nagiging lipas o labis na pormal.
- source_word: עֲלֵה
  choice: umahon ka
  rationale: Pinananatili ang direksiyonal at posibleng heograpikong diwa ng pag-akyat patungong Bethel.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Ginamit ang kinikilalang transliterasyon ng pangalan ng lugar sa halip na isaling “Bahay ng Diyos.”
- source_word: וְשֶׁב שָׁם
  choice: at manirahan ka roon
  rationale: Ang ישב ay maaaring mangahulugang manatili o manirahan; ang “manirahan” ay natural at angkop sa utos na tumira sa Bethel.
- source_word: וַעֲשֵׂה שָׁם מִזְבֵּחַ
  choice: Gumawa ka roon ng altar
  rationale: Malapit ito sa malawak na kahulugan ng עשה na “gumawa,” at malinaw at natural sa Filipino.
- source_word: לָאֵל
  choice: para sa Diyos
  rationale: Ipinahahayag ng “para sa” ang pag-aalay o pagtatalaga ng altar sa Diyos at natural ito sa modernong Filipino.
- source_word: הַנִּרְאֶה אֵלֶיךָ
  choice: na nagpakita sa iyo
  rationale: Ito ang malinaw at karaniwang katumbas ng Niphal ng ראה sa konteksto ng pagpapakita ng Diyos.
- source_word: בְּבָרְחֲךָ
  choice: nang tumakas ka
  rationale: Natural na ipinahahayag nito ang temporal na gamit ng infinitive construct na may בְּ.
- source_word: מִפְּנֵי
  choice: mula sa
  rationale: Ang literal na idyomang “mula sa mukha/presensiya ni” ay nangangahulugang pagtakas mula o paglayo kay; “mula sa” ang pinakanatural na katumbas dito.
- source_word: עֵשָׂו אָחִיךָ
  choice: iyong kapatid na si Esau
  rationale: Natural na ayos ito sa Filipino at ganap na pinananatili ang ugnayang ipinahahayag ng Hebreo.
theological_decisions:
- issue: Tinutukoy ng אֱלֹהִים
  choice: Ang iisang Diyos ang nagsasalita kay Jacob
  alternative: mga diyos
  rationale: Isahan ang pandiwang Hebreo at malinaw sa konteksto ng salaysay na ang Diyos ng Israel ang tinutukoy.
- issue: Paglalahad sa בֵּית אֵל
  choice: Bethel bilang pangalan ng lugar
  alternative: Bahay ng Diyos
  rationale: Pangalan ng lugar ang gamit dito; ang transliterasyon ay hindi nagpapataw ng paliwanag sa pangunahing teksto.
- issue: Pagkakakilanlan ng “Diyos na nagpakita”
  choice: Pinanatili ang tiyak na pariralang “para sa Diyos na nagpakita sa iyo”
  alternative: “para sa akin, na nagpakita sa iyo”
  rationale: Hindi tahasang lumilipat sa unang panauhan ang Hebreo; pinananatili ng salin ang ikatlong-panauhang anyo at ang retorikal na tensiyon nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang “Tumindig” kaysa kolokyal na “Bumangon,” at “umahon” upang mapanatili ang direksiyonal na diwa. Walang talababa dahil maipahahayag nang natural sa pangunahing teksto ang Hebreong idyoma na מִפְּנֵי nang walang mahalagang pagkawala ng kahulugan.
