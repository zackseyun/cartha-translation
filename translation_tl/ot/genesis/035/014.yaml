  text: וַ/יַּצֵּ֨ב יַעֲקֹ֜ב מַצֵּבָ֗ה בַּ/מָּק֛וֹם אֲשֶׁר דִּבֶּ֥ר אִתּ֖/וֹ מַצֶּ֣בֶת אָ֑בֶן וַ/יַּסֵּ֤ךְ עָלֶ֨י/הָ֙ נֶ֔סֶךְ וַ/יִּצֹ֥ק עָלֶ֖י/הָ שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/014.yaml
  text: And Jacob set up a pillar in the place where he had spoken with him[a], a pillar of stone; and he poured out a drink offering on it[b], and he poured oil on it.
translation:
  language: tl
  text: Nagtayo si Jacob ng isang haligi sa lugar kung saan nakipag-usap sa kanya ang Diyos—isang haliging bato[a]. Ibinuhos niya sa ibabaw nito ang handog na inumin[b], at binuhusan din niya ito ng langis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang nakatayong bato.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, isang libasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: nagtayo
  rationale: Ipinahahayag ng Hiphil ng נצב ang pagpapangyaring tumayo nang tuwid ang isang bagay. Likas at kongkreto sa Filipino ang “nagtayo.”
- source_word: מַצֵּבָה / מַצֶּבֶת אָבֶן
  choice: isang haligi / isang haliging bato
  rationale: Ang מַצֵּבָה ay isang itinayong monumentong bato o haligi. Pinananatili ng “haliging bato” ang tahasang pagtukoy sa materyal nang hindi dinaragdagan ang layunin nito.
- source_word: בַּמָּקוֹם
  choice: sa lugar
  rationale: Payak at natural na panumbas sa lokatibong parirala.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: kung saan nakipag-usap sa kanya ang Diyos
  rationale: Ang di-binanggit na simuno ng pandiwa ay tumutukoy sa Diyos sa naunang konteksto. Nililinaw ito sa Filipino upang maiwasan ang malabong panghalip, habang pinananatili ang diwa ng pakikipag-usap.
- source_word: וַיַּסֵּךְ ... נֶסֶךְ
  choice: nagbuhos ... ng handog na inumin
  rationale: Ang magkaugnay na pandiwa at pangngalan ay tumutukoy sa ritwal na pagbubuhos. Mas madaling maunawaan ng karaniwang mambabasa ang “handog na inumin” kaysa “libasyon.”
- source_word: וַיִּצֹק ... שָׁמֶן
  choice: nagbuhos ... ng langis
  rationale: Pinananatili ang kongkretong kilos at ang pangkalahatang salitang “langis”; hindi idinagdag ang “olibo,” na hindi tahasang nasa Hebreo.
theological_decisions:
- issue: Kahulugan ng ginawa ni Jacob sa haligi at mga handog
  choice: Ilarawan lamang ang pagtatayo ng haligi at ang pagbubuhos ng handog na inumin at langis.
  alternative: Tukuyin ang kilos bilang pagtatalaga sa haligi o tahasang paggunita sa pakikipagtagpo sa Diyos.
  rationale: Isinasalaysay ng talata ang mga ritwal na kilos ngunit hindi nito tahasang ipinaliliwanag ang teolohikal na layunin ng mga iyon.
- issue: Di-binanggit na simuno ng דִּבֶּר
  choice: Tukuyin ang simuno bilang “ang Diyos” batay sa agarang konteksto.
  alternative: Panatilihin lamang ang isang panghalip na maaaring magdulot ng kalabuan sa Filipino.
  rationale: Sa Hebreo, nadadala ang simuno mula sa naunang konteksto; sa Filipino, ang tahasang pangngalan ang natural na paraan upang ipakita ang parehong ugnayan nang hindi nagkakaroon ng maling kalabuan kung sino ang nagsalita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “haligi” at “handog na inumin” bilang malinaw na mga katawagan, samantalang inilagay sa talababa ang mas teknikal na “libasyon.”
