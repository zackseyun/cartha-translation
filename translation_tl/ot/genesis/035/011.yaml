id: GEN.35.11
reference: Genesis 35:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּ/רְבֵ֔ה גּ֛וֹי וּ/קְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑/ךָּ וּ/מְלָכִ֖ים מֵ/חֲלָצֶ֥י/ךָ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/011.yaml
  text: And God said to him[a], “I am God Almighty. Be fruitful and multiply. A nation and an assembly of nations shall come from you[c][b], and kings shall come from your loins.”
translation:
  language: tl
  text: Sinabi sa kanya ng Diyos, “Ako ang Diyos na Makapangyarihan sa Lahat.[a] Magkaroon ka ng maraming anak at dumami. Isang bansa at isang kapulungan ng mga bansa[b] ang magmumula sa iyo, at may mga haring magmumula sa sarili mong katawan.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “El Shaddai”; karaniwang isinasaling “Diyos na Makapangyarihan sa Lahat.” Hindi ganap na tiyak ang eksaktong kahulugan ng titulong Shaddai.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang kalipunan ng mga bansa.” Ang salitang Hebreo ay maaaring tumukoy sa isang nagkakatipon o binuong pangkat ng mga bansa.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “mula sa iyong mga balakang,” isang idyoma para sa mga pisikal na inapo mula sa sariling katawan.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang salitang Hebreo, ang pandiwang isahan at ang konteksto ay malinaw na tumutukoy sa nag-iisang Diyos na nakikipag-usap kay Jacob.
- source_word: אֵל שַׁדַּי
  choice: Diyos na Makapangyarihan sa Lahat
  rationale: Isinalin ang banal na titulo sa likas at marangal na Filipino sa halip na basta baybayin bilang “El Shaddai”; inilagay sa talababa ang anyong Hebreo dahil hindi ganap na tiyak ang pinagmulan at saklaw ng שַׁדַּי.
- source_word: פְּרֵה וּרְבֵה
  choice: Magkaroon ka ng maraming anak at dumami
  rationale: Ipinahahayag nito sa natural na Filipino ang dalawang utos tungkol sa pagkakaroon ng mga supling at pagdami, habang pinananatili ang pormula ng pagpapalang patriyarkal.
- source_word: גּוֹי
  choice: bansa
  rationale: Sa konteksto ng pangako sa mga patriyarka, tumutukoy ito sa isang pangkat ng taong mabubuo bilang bansa.
- source_word: קְהַל גּוֹיִם
  choice: isang kapulungan ng mga bansa
  rationale: Pinananatili ng “kapulungan” ang diwa ng קָהָל bilang pangkat na nagkakatipon o nabubuo bilang isang kalipunan, sa halip na gawing payak na “maraming bansa.”
- source_word: יִהְיֶה מִמֶּךָּ
  choice: ang magmumula sa iyo
  rationale: Ang literal na “magiging mula sa iyo” ay hindi likas sa Filipino; malinaw na ipinahahayag ng “magmumula” ang genealogical na pinagmulan.
- source_word: מְלָכִים
  choice: mga hari
  rationale: Tuwirang katumbas ito ng pangngalang Hebreo at hindi nangangailangan ng pagpapalawak.
- source_word: מֵחֲלָצֶיךָ
  choice: mula sa sarili mong katawan
  rationale: Natural nitong ipinahahayag sa Filipino ang idyomang Hebreo tungkol sa mga pisikal na inapo, habang ipinaliliwanag sa talababa ang konkretong larawan ng “mga balakang.”
- source_word: יֵצֵאוּ
  choice: magmumula
  rationale: Sa konteksto ng lahi at mga inapo, mas natural ang “magmumula” kaysa sa literal na pandiwang panlunan na “lalabas.”
theological_decisions:
- issue: Pagpapakahulugan sa banal na titulong אֵל שַׁדַּי
  choice: Diyos na Makapangyarihan sa Lahat
  alternative: El Shaddai
  rationale: Ang tradisyonal na kahulugan ay malinaw at nauunawaan sa Filipino, ngunit hindi itinatago ng talababa na “El Shaddai” ang mismong anyong Hebreo at na may kawalang-katiyakan sa eksaktong kahulugan nito.
- issue: Antas ng literalidad sa pangako tungkol sa lahi
  choice: magmumula sa iyo / mula sa sarili mong katawan
  alternative: magiging mula sa iyo / lalabas mula sa iyong mga balakang
  rationale: Pinananatili ang pisikal at genealogical na diwa ng pangako nang hindi gumagamit ng pariralang magiging katawa-tawa o malabo sa modernong Filipino; ang literal na larawang pangkatawan ay nasa talababa.
- issue: Kahulugan ng קְהַל גּוֹיִם
  choice: kapulungan ng mga bansa
  alternative: kalipunan ng mga bansa / maraming bansa
  rationale: Hindi ginawang simpleng dami lamang ang salita; pinananatili ang posibleng diwa ng isang binuo o nagkakatipong pangkat ng mga bansa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Iniwasan ang mekanikal na salin na “magbunga” dahil maaari itong unang maunawaan bilang bunga ng halaman, at ginamit ang natural na pahayag tungkol sa pagkakaroon ng maraming anak. Pinanatili ang pormal na “kapulungan” upang maipakita ang kolektibong diwa ng קָהָל.
