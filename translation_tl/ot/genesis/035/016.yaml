base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/016.yaml
  text: Then they journeyed from Bethel[a], and when there was still some distance to go before reaching Ephrath, Rachel gave birth, and she had difficulty in childbirth.
translation:
  language: tl
  text: Pagkatapos, umalis sila sa Bethel. Nang may kalayuan pa bago makarating sa Efrata[a], nanganak si Raquel, at nahirapan siya sa panganganak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Efrat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: umalis sila
  rationale: Ang נסע sa sunod-sunod na salaysay ay karaniwang tumutukoy sa pag-alis upang magpatuloy sa paglalakbay. Natural sa Filipino ang “umalis sila” at hindi nito ipinahihiwatig na narating na ang patutunguhan.
- source_word: מִבֵּית אֵל
  choice: sa Bethel
  rationale: Kasunod ng “umalis,” natural na ipinahahayag ng “sa Bethel” ang pinagmulang lugar; ginamit ang nakaugaliang baybay na Bethel.
- source_word: וַיְהִי עוֹד כִּבְרַת הָאָרֶץ
  choice: Nang may kalayuan pa
  rationale: Idyomatiko itong naghahayag na may natitira pang distansiya. Hindi tinutukoy ng bihirang parirala ang isang tiyak na sukat, kaya iniiwasan ang labis na espesipikong salin.
- source_word: לָבוֹא אֶפְרָתָה
  choice: bago makarating sa Efrata
  rationale: Ang infinitive na may ל ay tumutukoy sa pagdating sa patutunguhan; malinaw sa konteksto na hindi pa sila nakararating doon.
- source_word: אֶפְרָתָה
  choice: Efrata
  rationale: Ang “Efrata” ay natural na transliterasyon sa Filipino ng anyong Hebreo; ang “Efrat” ay pinanatili bilang posibleng alternatibo sa talababa.
- source_word: וַתֵּלֶד רָחֵל
  choice: nanganak si Raquel
  rationale: Tuwirang ipinahahayag ng Qal na ילד na si Raquel ay nanganak. Ginamit ang nakaugaliang Filipino na anyo ng pangalang Rachel.
- source_word: וַתְּקַשׁ בְּלִדְתָּהּ
  choice: nahirapan siya sa panganganak
  rationale: Ipinahahayag ng קשה ang matinding hirap sa proseso ng panganganak. Natural, malinaw, at hindi nagdaragdag ng detalyeng wala sa Hebreo ang saling ito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang di-tiyak na sukat ng כִּבְרַת הָאָרֶץ sa pamamagitan ng “may kalayuan pa,” at iniwasan ang salitang teknikal o lipas.
