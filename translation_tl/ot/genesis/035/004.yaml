revisions:
- from: Kaya ibinigay nila kay Jacob ang lahat ng diyos na banyaga na nasa kanilang mga kamay, pati ang mga singsing[a] na nasa kanilang mga tainga. Itinago ni Jacob ang mga iyon sa ilalim ng punong terebinto[b] na malapit sa Shechem.
  to: At ibinigay nila kay Jacob ang lahat ng mga banyagang diyos na nasa kanilang mga kamay, pati ang mga singsing[a] na nasa kanilang mga tainga. Itinago ni Jacob ang mga iyon sa ilalim ng punong terebinto[b] na malapit sa Shechem.
  rationale: Pinalitan ang “Kaya” ng “At” upang mapanatili ang payak na pagkakasunod ng salaysay, at inayos ang parirala bilang “mga banyagang diyos” para sa mas natural na modernong Filipino. Walang binagong kahulugan, walang idinagdag na paliwanag tungkol sa gamit ng mga singsing, at napanatili ang lahat ng wastong footnote anchor at talababa.
