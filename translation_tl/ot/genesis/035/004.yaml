  text: וַ/יִּתְּנ֣וּ אֶֽל יַעֲקֹ֗ב אֵ֣ת כָּל אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/יָדָ֔/ם וְ/אֶת הַ/נְּזָמִ֖ים אֲשֶׁ֣ר בְּ/אָזְנֵי/הֶ֑ם וַ/יִּטְמֹ֤ן אֹתָ/ם֙ יַעֲקֹ֔ב תַּ֥חַת הָ/אֵלָ֖ה אֲשֶׁ֥ר עִם שְׁכֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/004.yaml
  text: So they gave Jacob all the foreign gods that were in their hands[a], and the rings that were in their ears[b], and Jacob hid them under the terebinth that was near Shechem.
translation:
  language: tl
  text: At ibinigay nila kay Jacob ang lahat ng mga banyagang diyos na nasa kanilang mga kamay, pati ang mga singsing[a] na nasa kanilang mga tainga. Itinago ni Jacob ang mga iyon sa ilalim ng punong terebinto[b] na malapit sa Shechem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga hikaw.” Ang salitang Hebreo ay maaaring tumukoy sa mga singsing na isinusuot sa iba’t ibang bahagi ng katawan, ngunit dito ay tinutukoy na nasa mga tainga ang mga ito.
    reason: lexical_alternative
  - marker: b
    text: O “punong roble”; malamang na mas tiyak na tumutukoy ang salitang Hebreo sa punong terebinto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Kaya ibinigay nila
  rationale: Ang wayyiqtol ay nagpapatuloy sa salaysay at tumutugon sa naunang utos ni Jacob; natural na ipinahahayag ng “Kaya” ang bunga at pagkakasunod-sunod.
- source_word: כָּל אֱלֹהֵי הַנֵּכָר
  choice: ang lahat ng diyos na banyaga
  rationale: Malinaw nitong tinutukoy ang mga diyos na hindi kabilang sa pagsamba sa Diyos ni Jacob, nang hindi dinaragdagan ang teksto ng paliwanag tungkol sa anyo ng mga ito.
- source_word: אֲשֶׁר בְּיָדָם
  choice: na nasa kanilang mga kamay
  rationale: Pinananatili nito ang kongkretong idyomang Hebreo, na maaari ring mangahulugang nasa kanilang pag-aari.
- source_word: הַנְּזָמִים אֲשֶׁר בְּאָזְנֵיהֶם
  choice: ang mga singsing na nasa kanilang mga tainga
  rationale: Maaaring tumukoy ang נְזָמִים sa mga palamuting singsing na isinusuot sa iba’t ibang bahagi ng katawan; ang kasunod na parirala mismo ang nagtatakdang nasa mga tainga ang mga ito.
- source_word: וַיִּטְמֹן אֹתָם
  choice: Itinago ni Jacob ang mga iyon
  rationale: Ang טמן ay maaaring mangahulugang itago, ikubli, o ibaon. Ang “itinago” ay tumpak ngunit hindi nagpapasya kung talagang ibinaon ang mga bagay.
- source_word: תַּחַת הָאֵלָה
  choice: sa ilalim ng punong terebinto
  rationale: Ang אֵלָה ay malamang na tumutukoy sa terebinto, hindi sa roble; pinananatili ang mas tiyak na pagkakakilanlang botanikal.
- source_word: אֲשֶׁר עִם שְׁכֶם
  choice: na malapit sa Shechem
  rationale: Kapag kasama ng pangalan ng lugar, ipinahahayag ng עִם ang pagiging kalapit; natural sa Tagalog ang “malapit sa Shechem.”
theological_decisions:
- issue: Kalikasan ng mga singsing na isinuko
  choice: Binanggit ang mga singsing nang hindi sinasabing likas na mga anting-anting o bagay na sinasamba ang mga ito.
  alternative: Ipaliwanag ang mga singsing bilang mga anting-anting o idolatrosong palamuti.
  rationale: Tiyak na tinatawag ng teksto na “mga diyos na banyaga” ang unang pangkat ng mga bagay, ngunit hindi nito tahasang ipinaliliwanag kung bakit isinama ang mga singsing. Pinananatili ng salin ang hindi pagtukoy na iyon.
- issue: Paraan ng pagtatago sa mga bagay
  choice: “Itinago”
  alternative: “Ibinaon”
  rationale: Maaaring saklawin ng pandiwang Hebreo ang pagbabaon, ngunit hindi nito kailangang tukuyin ang eksaktong paraan. Hindi nilulutas ng salin ang hindi tahasang sinabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “diyos na banyaga” at “punong terebinto” upang manatiling malapit sa Hebreo, samantalang ang mga talababa ay nagbibigay ng pamilyar na mga alternatibo. Nasa pangunahing teksto ang lahat ng panandang talababa.
