  source_fidelity: 'Tumpak ang pagsasalin ng mga pangunahing yunit: ibinigay ang mga diyos, mga palamuting nasa tainga, at itinago ang mga ito sa ilalim ng terebinto malapit sa Shechem. Gayunman, ang pang-ugnay na “Kaya” ay maaaring magpahiwatig ng mas malinaw na bunga kaysa sa payak na pagsulong ng salaysay na ipinahihiwatig ng wayyiqtol; mas maingat ang “At.”'
  naturalness: Nauunawaan ang draft, ngunit mas likas at karaniwang ayos sa makabagong Filipino ang “mga banyagang diyos” kaysa “mga diyos na banyaga.” Ang “mga singsing na nasa kanilang mga tainga” ay tapat sa anyong Hebreo at katanggap-tanggap, bagaman bahagyang mabigat; pinananatili ito upang hindi isara ang saklaw ng נְזָמִים nang higit sa kailangan.
  terminology: Ang “diyos,” “terebinto,” at “itinago” ay angkop. Ang “punong terebinto” ay malinaw at ang talababa para sa “roble” ay wastong nagtatala ng alternatibong leksikal. Nananatiling maayos ang mga panandang talababa sa mga salitang tinutukoy nila.
