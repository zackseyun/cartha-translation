  yaml_path: translation/ot/genesis/035/025.yaml
  text: 'And the sons of Bilhah[a], Rachel’s female servant: Dan and Naphtali.'
translation:
  language: tl
  text: 'At ang mga anak ni Bilha[a], na lingkod na babae ni Raquel: sina Dan at Neftali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aliping babae ni Raquel.” Ang salitang Hebreo ay tumutukoy sa isang babaeng lingkod na may mababang katayuan sa lipunan; sa ilang konteksto, maaari itong mangahulugang babaeng alipin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang pang-ugnay at ayos ng talaan; sa Filipino, likas na tumutukoy ang “mga anak” sa mga lalaking nakapangalan sa kasunod na tala.
- source_word: בִלְהָה
  choice: Bilha
  rationale: Pangngalang pantangi na isinalin ayon sa karaniwang anyong Filipino.
- source_word: שִׁפְחַת
  choice: lingkod na babae
  rationale: Malinaw nitong ipinahahayag ang kasariang pambabae at mababang katayuang panlipunan ng terminong Hebreo nang hindi agad nililimitahan ang kahulugan nito sa “alipin.”
- source_word: רָחֵל
  choice: ni Raquel
  rationale: Likas na ipinapahayag sa Filipino ang ugnayang construct bilang “lingkod na babae ni Raquel.”
- source_word: דָּן
  choice: Dan
  rationale: Pangngalang pantangi; pinanatili ang nakaugaliang anyo.
- source_word: וְ/נַפְתָּלִי
  choice: at Neftali
  rationale: Pinananatili ang pang-ugnay sa pagitan ng dalawang pangalan at ginagamit ang karaniwang anyong Filipino ng pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “lingkod na babae” upang mapanatili ang pambabaeng pagtukoy at ang saklaw ng kahulugang panlipunan ng Hebreo; inilagay sa talababa ang mas tahasang alternatibong “aliping babae.”
