  text: וַ/יִּקְרָ֨א יַעֲקֹ֜ב אֶת שֵׁ֣ם הַ/מָּק֗וֹם אֲשֶׁר֩ דִּבֶּ֨ר אִתּ֥/וֹ שָׁ֛ם אֱלֹהִ֖ים בֵּֽית אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/015.yaml
  text: And Jacob called the name of the place where God had spoken with him there[b][a], Bethel.
translation:
  language: tl
  text: At pinangalanan ni Jacob na Bethel[a] ang lugar na iyon, kung saan nakipag-usap sa kanya ang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang ibig sabihin ng “Bethel” ay “bahay ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: pinangalanan
  rationale: Ang pariralang Hebreo na literal na “tinawag ang pangalan” ay karaniwang idyoma para sa pagbibigay ng pangalan; natural at tumpak sa modernong Tagalog ang “pinangalanan.”
- source_word: הַמָּקוֹם
  choice: ang lugar na iyon
  rationale: Tinutukoy nito ang partikular na lugar na nabanggit sa salaysay; malinaw at natural sa Tagalog ang “lugar na iyon.”
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ שָׁם אֱלֹהִים
  choice: kung saan nakipag-usap sa kanya ang Diyos
  rationale: Ipinahahayag ng “kung saan” ang lokatibong diwa ng אֲשֶׁר ... שָׁם nang hindi lumilikha ng di-natural na pag-uulit. Ang “nakipag-usap sa kanya” ay angkop sa דִּבֶּר אִתּוֹ at pinananatili ang diwang pakikipag-usap.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman anyong maramihan ang salita, isahan ang gamit at tinutukoy nito rito ang Diyos na nakipag-usap kay Jacob.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Ginamit ang nakasanayang transliterasyon ng pangalan ng lugar; ipinaliwanag sa talababa ang kahulugan nito.
theological_decisions:
- issue: Isahan o maramihang diwa ng אֱלֹהִים
  choice: ang Diyos
  alternative: mga diyos
  rationale: Ang konteksto at sintaks ay tumutukoy sa iisang Diyos na nakipag-usap kay Jacob; mali ang maramihang pagbasa rito.
translation_notes:
  register: 'Modernong Filipino Tagalog na payak ngunit marangal. Isinapuso ang Hebreong ayos sa natural na pangungusap: ang pleonasmong “kung saan ... doon” ay ipinahayag bilang “kung saan,” habang ang tiyak na lokasyon ay nananatili sa “ang lugar na iyon.”'
