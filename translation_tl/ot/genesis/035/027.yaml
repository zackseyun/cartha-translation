id: GEN.35.27
reference: Genesis 35:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֤א יַעֲקֹב֙ אֶל יִצְחָ֣ק אָבִ֔י/ו מַמְרֵ֖א קִרְיַ֣ת הָֽאַרְבַּ֑ע הִ֣וא חֶבְר֔וֹן אֲשֶׁר גָּֽר שָׁ֥ם אַבְרָהָ֖ם וְ/יִצְחָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/027.yaml
  text: And Jacob came to Isaac his father at Mamre[a], Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.
translation:
  language: tl
  text: Dumating si Jacob sa kanyang amang si Isaac sa Mamre, sa Kiriat-arba (na siyang Hebron), kung saan nanirahan bilang mga dayuhan[a] sina Abraham at Isaac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pansamantalang nanirahan.” Ang pandiwang Hebreo ay tumutukoy sa paninirahan bilang dayuhan o hindi permanenteng residente, hindi lamang sa simpleng pagtira sa isang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dumating
  rationale: Ang בוא ay maaaring mangahulugang ‘pumunta’ o ‘dumating.’ Ang ‘dumating’ ay natural dito dahil nakatuon ang salaysay sa pagdating ni Jacob sa kinaroroonan ni Isaac.
- source_word: אָבִיו
  choice: kanyang amang si Isaac
  rationale: Malinaw at likas sa Tagalog ang ayos na ito, at tahasang pinananatili ang ugnayan ni Isaac bilang ama ni Jacob.
- source_word: מַמְרֵא
  choice: Mamre
  rationale: Pangalan ng lugar; tinumbasan sa karaniwang transliterasyong Filipino.
- source_word: קִרְיַת הָאַרְבַּע
  choice: Kiriat-arba
  rationale: Pinanatili bilang pangalan ng lugar sa halip na isaling ‘Lunsod ni Arba’; kaayon ito ng kasunod na pagkakakilanlan dito bilang Hebron.
- source_word: הִוא חֶבְרוֹן
  choice: na siyang Hebron
  rationale: Ipinakikilala ng parirala ang Kiriat-arba bilang Hebron. Natural sa Tagalog ang ‘na siyang Hebron’ at hindi nito dinaragdagan ang diwa.
- source_word: אֲשֶׁר ... שָׁם
  choice: kung saan
  rationale: Likas na salin sa Tagalog ng sugnay na tumutukoy sa lugar; hindi na kailangang ulitin ang ‘doon.’
- source_word: גָּר
  choice: nanirahan bilang mga dayuhan
  rationale: Ang גור ay hindi lamang karaniwang ‘tumira’; ipinahihiwatig nito ang paninirahan bilang dayuhan o pansamantalang residente. Pinananatili ng saling ito ang mahalagang kahulugang iyon.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: sina Abraham at Isaac
  rationale: Ginamit ang panandang ‘sina’ na natural sa Tagalog para sa dalawang personal na pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang mga pangalang pantangi at ang pagkakaugnay ng Mamre, Kiriat-arba, at Hebron ayon sa Hebreong teksto. Iniwasan ang salitang ‘nakipamayan,’ na maaaring hindi agad maunawaan ng karaniwang mambabasa.
