id: GEN.2.10
reference: Genesis 2:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נָהָרּ֙ יֹצֵ֣א מֵ/עֵ֔דֶן לְ/הַשְׁק֖וֹת אֶת הַ/גָּ֑ן וּ/מִ/שָּׁם֙ יִפָּרֵ֔ד וְ/הָיָ֖ה לְ/אַרְבָּעָ֥ה רָאשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/010.yaml
  text: A river flowed out of Eden to water the garden[a], and from there it divided and became four headwaters.
translation:
  language: tl
  text: Umaagos mula sa Eden ang isang ilog upang diligan ang hardin. Mula roon ay nahahati ito at nagiging apat na pangunahing sangay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “apat na ulo.” Literal na “mga ulo” ang salitang Hebreo rito, na tumutukoy sa apat na pangunahing pagkakahati ng ilog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהָר
  choice: ang isang ilog
  rationale: Ang נָהָר ay “ilog.” Hindi kailangang gawing hiwalay na salitang “at” ang וְ sa Filipino dahil natural nang naipagpapatuloy ng pangungusap ang salaysay.
- source_word: יֹצֵא
  choice: umaagos mula
  rationale: Ang participle ng יצא ay naglalarawan ng patuloy na paglabas. Sa konteksto ng ilog, natural na ipinahahayag ito ng “umaagos mula.”
- source_word: מֵעֵדֶן
  choice: mula sa Eden
  rationale: Ang מִן ay nagpapahiwatig ng pinagmulan; tuwirang katumbas nito rito ang “mula sa Eden.”
- source_word: לְהַשְׁקוֹת
  choice: upang diligan
  rationale: Ipinahahayag ng infinitive ang layunin ng pag-agos ng ilog. Ang “diligan” ay malinaw at hindi teknikal.
- source_word: אֶת־הַגָּן
  choice: ang hardin
  rationale: Tuwirang tumutukoy ito sa harding nabanggit na sa konteksto.
- source_word: וּמִשָּׁם
  choice: Mula roon
  rationale: Tinutukoy nito ang susunod na yugto ng daloy ng ilog. Hindi kailangang isalin nang hiwalay ang pang-ugnay sa simula ng bagong pangungusap.
- source_word: יִפָּרֵד
  choice: nahahati ito
  rationale: Maaaring mangahulugan ang Niphal ng פרד na “mahati” o “maghiwa-hiwalay.” Pinananatili ng “nahahati” ang di-tahasang sanhi at ang larawan ng ilog na nagkakaroon ng mga sangay.
- source_word: וְהָיָה לְאַרְבָּעָה
  choice: at nagiging apat
  rationale: 'Ipinahahayag ng היה na may resultang kalagayan: matapos mahati, ang ilog ay nagiging apat.'
- source_word: רָאשִׁים
  choice: pangunahing sangay
  rationale: Literal itong “mga ulo,” ngunit sa konteksto ng ilog ay tumutukoy sa apat na pangunahing pagkakahati. Mas malinaw sa karaniwang mambabasa ang “pangunahing sangay” kaysa “mga ulo” o “bukal,” at hindi nito ipinapalagay na ang mga ito ang pinagmumulan ng ilog.
