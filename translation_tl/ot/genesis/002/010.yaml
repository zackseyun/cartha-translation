translation_notes:
  register: Gumamit ng natural at marangal na modernong Filipino. Hinati sa dalawang pangungusap para luminaw ang galaw mula sa pinagmulan ng ilog tungo sa pagkakahati nito, nang hindi dinaragdagan ang kahulugan.
