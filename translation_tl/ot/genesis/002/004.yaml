base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/004.yaml
  text: These are the generations of the heavens and the earth when they were created[c][b][a], in the day that Yahweh God made the earth and the heavens.
translation:
  language: tl
  text: Ito ang kasaysayan[a] ng langit at ng lupa nang likhain ang mga ito, nang gawin ng Diyos na si Yahweh[b] ang lupa at ang langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong toledot ay maaari ding isaling “mga salinlahi,” “salaysay,” o “mga pinagmulan”; madalas itong nagsisilbing pamagat ng mga seksiyon sa Genesis.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreo ay YHWH, ang banal na pangalang tradisyonal na isinasaling “PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה תוֹלְדוֹת
  choice: Ito ang kasaysayan
  rationale: Ang pormulang Hebreo ay literal na may pangmaramihang demonstratibo at toledot, ngunit sa makabagong Tagalog, ang “Ito ang kasaysayan” ay likas na panimula ng isang seksiyon. Pinananatili ng talababa ang saklaw na “mga salinlahi” at “mga pinagmulan.”
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: ng langit at ng lupa
  rationale: Ang “langit at lupa” ay likas at pamilyar na merismo sa Tagalog para sa buong nilikhang kaayusan; hindi kailangang gawing tahasang pangmaramihan ang שָׁמַיִם sa Tagalog.
- source_word: בְּהִבָּרְאָם
  choice: nang likhain ang mga ito
  rationale: Ipinahahayag ng “nang” ang panahong kahulugan ng בְּ, at pinananatili ng “likhain” ang balintiyak na diwa ng Niphal infinitive. Nililinaw ng “ang mga ito” ang panghalip na tumutukoy sa langit at lupa.
- source_word: בְּיוֹם עֲשׂוֹת
  choice: nang gawin
  rationale: Ang pariralang “sa araw na” ay idyomang Hebreo na nangangahulugang “nang” o “noong panahong”; ang natural na Tagalog na “nang gawin” ang nagpapahayag nito nang hindi nagpapahiwatig na kailangang isang literal na 24-oras na araw.
- source_word: יְהוָה אֱלֹהִים
  choice: Diyos na si Yahweh
  rationale: Sa Tagalog, ang ayos na “Diyos na si Yahweh” ay mas natural kaysa “Yahweh Diyos” at kapuwa pinananatili ang titulong אֱלֹהִים at ang personal na pangalang YHWH.
- source_word: אֶרֶץ וְשָׁמָיִם
  choice: ang lupa at ang langit
  rationale: Pinananatili ang binaligtad na ayos kumpara sa unang parirala, isang kapansin-pansing katangiang pampanitikan ng Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang pangalan; kinikilala sa talababa ang tradisyonal na saling “PANGINOON” nang hindi pinagbubukod ang isang denominasyonal na pagbasa.
- issue: Kahulugan ng בְּיוֹם sa salaysay ng paglikha
  choice: nang
  alternative: sa araw na
  rationale: Idyomatiko ang Hebreo at maaaring tumukoy sa panahon ng pangyayari sa halip na magtakda rito ng haba ng isang literal na araw. Hindi nilulutas ng salin ang mas malawak na usaping kronolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kasaysayan” bilang natural na pormula ng seksiyon, habang inilagay sa talababa ang tunay na lawak ng toledot. Iniwasan ang masalimuot na “sa araw ng paggawa” at ginamit ang idyomatikong “nang gawin.”
