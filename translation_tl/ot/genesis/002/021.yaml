  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
translation:
  language: tl
  text: Pinatulog nang mahimbing ng PANGINOONG Diyos ang lalaki, at nakatulog siya. Pagkatapos, kinuha niya ang isa sa mga tadyang[a] nito at isinara niya ng laman ang lugar na pinagkunan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagiliran.” Ang salitang Hebreo ay maaaring tumukoy sa tagiliran o bahagi ng tagiliran, gayundin sa tadyang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל ... תַּרְדֵּמָה
  choice: pinatulog nang mahimbing
  rationale: Ipinahahayag nito sa natural na Tagalog ang causative na anyo at ang diwa ng isang napakalalim na tulog, nang hindi nagpapahiwatig ng karagdagang detalye.
- source_word: יְהוָה אֱלֹהִים
  choice: PANGINOONG Diyos
  rationale: Ginagamit ang kinagawiang salin ng banal na pangalan bilang PANGINOON at likas na pinagdurugtong sa Diyos sa pariralang Tagalog.
- source_word: הָאָדָם
  choice: ang lalaki
  rationale: Sa agarang konteksto, tumutukoy ito sa tiyak na lalaking mula sa kaniya ay bubuuin ang babae, hindi sa sangkatauhan sa pangkalahatan.
- source_word: וַיִּישָׁן
  choice: at nakatulog siya
  rationale: Likas sa modernong Tagalog at pinananatili ang tahasang pahayag ng Hebreo na siya ay natulog.
- source_word: אַחַת מִצַּלְעֹתָיו
  choice: isa sa mga tadyang nito
  rationale: Ang 'tadyang' ang pinakanatural na anatomikal na kahulugan sa konteksto, ngunit maaaring mangahulugan ang צֵלָע ng 'tagiliran,' kaya itinatala iyon sa talababa.
- source_word: וַיִּסְגֹּר בָּשָׂר תַּחְתֶּנָּה
  choice: isinara ng laman ang kinalalagyan niyon
  rationale: Ipinahahayag nito ang pagsasara sa lugar na pinanggalan, habang pinananatili ang 'laman' bilang materyal na ipinangsara.
theological_decisions:
- issue: Kahulugan ng אָדָם sa konteksto
  choice: ang lalaki
  alternative: ang tao / ang taong nilalang
  rationale: Isang tiyak na lalaki ang tinutukoy sa salaysay; hindi pangunahing tumutukoy ang talata sa buong sangkatauhan.
- issue: Kahulugan ng צֵלָע
  choice: tadyang
  alternative: tagiliran
  rationale: Sinusuportahan ng pagkuha at pagsasara ng laman ang anatomikal na pagbasa na 'tadyang,' ngunit tunay na posibleng kahulugan ang 'tagiliran' at hindi ito dapat ikubli.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang magaan ngunit tumpak na daloy ng salaysay; iniwasan ang sobrang literal na pariralang magiging alanganin sa karaniwang mambabasa.
