    rationale: Ang waw-consecutive sa Hebreo ay pangunahing sumusulong sa salaysay; hindi nito kailangang magpahiwatig ng sanhi-bunga.
  - severity: medium
    issue: Malabo ang “isinara ng laman ang kinalalagyan niyon.”
    rationale: Hindi tahasang ipinakikita ang Diyos bilang tagaganap, at maaaring hindi agad malinaw kung ano ang tinutukoy ng “niyon.” Ang Hebreo ay nagsasabing isinara niya ang lugar na pinagkunan ng tadyang/side-part sa pamamagitan ng laman.
