  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: si YHWH Diyos ang sanhi ng malalim na pagtulog, kumuha siya ng isa sa mga tadyang, at isinara ang lugar sa pamamagitan ng laman. Gayunman, ang “Kaya” ay maaaring magpahiwatig ng ugnayang sanhi-bunga na wala sa anyong pasalaysay ng Hebreo, at ang “isinara ng laman ang kinalalagyan niyon” ay kulang sa tahasang tagaganap at medyo malabo ang tinutukoy ng panghalip.'
  naturalness: Natural ang karamihan ng draft, lalo na ang “pinatulog nang mahimbing.” Mas malinaw at mas maayos sa modernong Tagalog ang pagtukoy kay Diyos sa huling sugnay sa pamamagitan ng “isinara niya,” at ang “lugar na pinagkunan nito” ay mas madaling unawain kaysa “kinalalagyan niyon.”
  terminology: Ang “PANGINOONG Diyos,” “lalaki,” at “tadyang” ay angkop. Napananatili ng talababa ang mahalagang alternatibong “tagiliran,” nang hindi ipinipilit ang isang interpretasyong doktrinal.
