  to: Pinatulog nang mahimbing ng PANGINOONG Diyos ang lalaki, at nakatulog siya. Pagkatapos, kinuha niya ang isa sa mga tadyang[a] nito at isinara niya ng laman ang lugar na pinagkunan nito.
  rationale: Inalis ang “Kaya” upang hindi magdagdag ng ugnayang sanhi-bunga. Inayos ang huling sugnay upang malinaw na ang Diyos ang kumikilos at upang maipahayag nang natural ang pagsasara sa lugar na pinagkunan ng tadyang, samantalang pinananatili ang “laman” bilang ipinangsara. Napanatili ang leksikal na kalabuan ng צֵלָע sa talababa.
