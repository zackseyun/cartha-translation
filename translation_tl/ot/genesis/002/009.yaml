source:
  edition: WLC
  text: וַ/יַּצְמַ֞ח יְהוָ֤ה אֱלֹהִים֙ מִן הָ֣/אֲדָמָ֔ה כָּל עֵ֛ץ נֶחְמָ֥ד לְ/מַרְאֶ֖ה וְ/ט֣וֹב לְ/מַאֲכָ֑ל וְ/עֵ֤ץ הַֽ/חַיִּים֙ בְּ/ת֣וֹךְ הַ/גָּ֔ן וְ/עֵ֕ץ הַ/דַּ֖עַת ט֥וֹב וָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/009.yaml
  text: And Yahweh God caused to grow from the ground every tree that is pleasant to the sight and good for food[a], and the tree of life in the midst of the garden[b], and the tree of the knowledge of good and evil.
translation:
  language: tl
  text: At pinatubo ni Yahweh na Diyos mula sa lupa ang bawat punong kanais-nais tingnan at mabuti para kainin, pati ang puno ng buhay sa gitna ng hardin, at ang puno ng kaalaman sa mabuti at masama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kaalaman sa mabuti at masama” ay isinaling literal. Pinagtatalunan kung tumutukoy ito sa moral na paghatol, kapanahunan, o malawak na kaalaman.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּצְמַח
  choice: pinatubo
  rationale: Ang Hiphil na anyo ay sanhi o causative; malinaw na si Yahweh na Diyos ang nagpangyaring tumubo ang mga puno.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Pinananatili ang personal na pangalang יְהוָה bilang “Yahweh,” at natural na pinag-uugnay sa “Diyos” sa Tagalog.
- source_word: מִן הָאֲדָמָה
  choice: mula sa lupa
  rationale: Ang אֲדָמָה ay tumutukoy rito sa lupang pinagtutubuan; “lupa” ang payak at natural na katumbas.
- source_word: כָּל עֵץ
  choice: ang bawat puno
  rationale: Pinananatili ang distributibong diwa ng כָּל na sinusundan ng pang-isahang pangngalan.
- source_word: נֶחְמָד לְמַרְאֶה
  choice: kaaya-ayang tingnan
  rationale: Natural na Tagalog para sa isang bagay na kanais-nais o nakalulugod sa paningin.
- source_word: וְטוֹב לְמַאֲכָל
  choice: at mabuting kainin
  rationale: Tuwirang ipinahahayag ang pagiging angkop at mabuti bilang pagkain nang hindi nagiging mabigat ang pananalita.
- source_word: וְעֵץ הַחַיִּים
  choice: gayundin ang puno ng buhay
  rationale: Pinananatili ang tradisyonal at malinaw na construct phrase; ang “gayundin” ay natural na nag-uugnay sa kasunod na mga punong partikular na binanggit.
- source_word: בְּתוֹךְ הַגָּן
  choice: sa gitna ng hardin
  rationale: Ang בְּתוֹךְ ay maaaring mangahulugang nasa gitna o kaloob-looban; “sa gitna” ang maikli at tapat na salin.
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  choice: at ang puno ng pagkakilala sa mabuti at masama
  rationale: Ang “pagkakilala” ay nagpapanatili sa diwa ng דַּעַת nang hindi nililimitahan ito sa impormasyong intelektuwal lamang; hindi rin nito nilulutas ang pinagtatalunang saklaw ng parirala.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ang tekstong Hebreo ay tuwirang gumagamit ng Tetragrammaton; pinananatili ang pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng הַדַּעַת טוֹב וָרָע
  choice: Panatilihin ang literal na “pagkakilala sa mabuti at masama”
  alternative: kaalamang moral; kaalaman sa lahat ng bagay; pagkaunawa sa kapaki-pakinabang at nakapipinsala
  rationale: Hindi tiyak kung ang parirala ay tumutukoy sa moral na paghatol, kapanahunan, o malawak na kaalaman. Pinananatili ng pangunahing teksto ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “hardin” bilang karaniwang modernong salita at iniwasan ang mas arkaikong ayos ng pangungusap. Isang talababa lamang ang inilagay upang ipaliwanag ang tunay na semantikong kalabuan ng pangwakas na parirala.
