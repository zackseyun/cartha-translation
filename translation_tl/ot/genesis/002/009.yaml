- from: At pinatubo ni Yahweh na Diyos mula sa lupa ang bawat punong kaaya-ayang tingnan at mabuting kainin, gayundin ang puno ng buhay sa gitna ng hardin at ang puno ng pagkakilala sa mabuti at masama.[a]
  to: At pinatubo ni Yahweh na Diyos mula sa lupa ang bawat punong kanais-nais tingnan at mabuti para kainin, pati ang puno ng buhay sa gitna ng hardin, at ang puno ng kaalaman sa mabuti at masama.[a]
  rationale: Ginawang mas tuwiran ang pag-uugnay sa dalawang natatanging puno at pinalitan ang “pagkakilala” ng “kaalaman” upang higit na tumugma sa literal na diwa ng דַּעַת nang hindi nilulutas ang interpretibong usapin. Nananatili ang talababa sa mismong pariralang may pinagtatalunang saklaw.
