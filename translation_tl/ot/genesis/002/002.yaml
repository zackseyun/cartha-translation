  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְכַ֤ל אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מְלַאכְתּ֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּשְׁבֹּת֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מִ/כָּל מְלַאכְתּ֖/וֹ אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/002.yaml
  text: By the seventh day God had finished his work that he had done[a], and he rested on the seventh day from all his work that he had done.
translation:
  language: tl
  text: Pagsapit ng ikapitong araw, natapos na ng Diyos ang gawaing ginawa niya[a], at nagpahinga siya sa ikapitong araw mula sa lahat ng gawaing ginawa niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Sa ikapitong araw, tinapos ng Diyos ang gawaing ginawa niya.” Madalas isalin nang ganito ang pananalitang Hebreo; ipinahahayag ng “Pagsapit ng ikapitong araw” sa pangunahing teksto ang malamang na diwa nito sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַל
  choice: natapos na
  rationale: Ang כלה ay nangangahulugang tapusin o lubusin. Ang aspektong “natapos na” ay natural sa Filipino at ipinahihiwatig na ganap na ang gawain pagsapit ng ikapitong araw.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang salita, isahan ang pandiwang kaugnay nito at tumutukoy ito sa Diyos sa konteksto.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Pagsapit ng ikapitong araw
  rationale: Literal itong “sa ikapitong araw,” ngunit ipinahahayag ng “pagsapit” ang malamang na temporal na diwa sa konteksto habang pinananatili sa talababa ang literal na anyo.
- source_word: מְלַאכְתּוֹ
  choice: ang gawaing ginawa niya
  rationale: Ang מְלָאכָה ay gawain o trabaho. Ang “gawain” ay natural at marangal sa salaysay ng paglikha.
- source_word: אֲשֶׁר עָשָׂה
  choice: ginawa niya
  rationale: Malawak ang kahulugan ng עשה bilang gawin o likhain; hindi ito kailangang paliitin sa materyal na paggawa lamang.
- source_word: וַיִּשְׁבֹּת
  choice: nagpahinga siya
  rationale: Pangunahing diwa ng שבת ang pagtigil. Sa kontekstong ito, ang “nagpahinga” ang nakaugaliang salin at nangangahulugang tumigil sa gawain, hindi kinakailangang napagod.
- source_word: מִכָּל
  choice: mula sa lahat
  rationale: Tuwirang ipinahahayag nito ang pagtigil kaugnay ng kabuuan ng gawain ng Diyos.
theological_decisions:
- issue: Kung ipinahihiwatig ng teksto na gumawa pa ang Diyos sa ikapitong araw
  choice: “Pagsapit ng ikapitong araw, natapos na” upang ipahiwatig na ganap na ang gawain sa pagdating ng araw na iyon.
  alternative: “Sa ikapitong araw, tinapos ng Diyos ang kanyang gawain,” na mas literal sa anyong Hebreo.
  rationale: Maaaring isalin nang literal ang parirala bilang “sa ikapitong araw,” ngunit maaari itong magbigay ng impresyong nagpatuloy ang paggawa sa araw ding iyon. Pinananatili ng pangunahing salin ang malamang na diwa sa konteksto, samantalang nasa talababa ang pormal na literal na pagbasa upang hindi maitago ang tunay na tensiyon sa pananalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagsapit” upang natural na ipahayag ang temporal na relasyon, at “nagpahinga” bilang pamilyar na salin na hindi nagpapahiwatig na napagod ang Diyos.
