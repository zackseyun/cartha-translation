  yaml_path: translation/ot/genesis/002/015.yaml
  text: Then Yahweh God took the man and placed him in the garden of Eden to work it and to keep it[a][b].
translation:
  language: tl
  text: Kinuha ni Yahweh na Diyos ang lalaki at inilagay siya sa halamanan ng Eden upang linangin at ingatan ang halamanan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “upang pagtrabahuhan o linangin ito at bantayan ito.” Ang mga pandiwang Hebreo ay maaaring mangahulugang “pagtrabahuhan, linangin, o paglingkuran” at “ingatan, bantayan, o pangalagaan.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang isinaling “inilagay siya” ay maaari ring mangahulugang “pinatahan siya roon” o “pinagpahinga siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Likas na salin ng pangkalahatang titulong pandiyos sa tambalang “Yahweh na Diyos.”
- source_word: הָאָדָם
  choice: ang lalaki
  rationale: Tumutukoy rito sa partikular na lalaking nilalang sa naunang salaysay, hindi sa sangkatauhan sa pangkalahatan.
- source_word: וַיִּקַּח
  choice: Kinuha
  rationale: Tuwirang ipinapahayag ang karaniwang kahulugan ng pandiwang לקח sa salaysay.
- source_word: וַיַּנִּחֵהוּ
  choice: inilagay siya
  rationale: Ang Hiphil ng נוח ay maaaring mangahulugang ilagay, panirahin, o papagpahingahin; ang “inilagay” ang pinakanatural sa agarang konteksto ng pagdadala sa halamanan.
- source_word: בְּגַן עֵדֶן
  choice: sa halamanan ng Eden
  rationale: Natural at matatag na salin ng pariralang Hebreo habang pinananatili ang pangalang Eden.
- source_word: לְעָבְדָהּ
  choice: upang linangin
  rationale: Sa konteksto ng halamanan, malinaw at natural na ipinahahayag ng “linangin” ang gawaing tinutukoy ng עבד, habang itinatala sa talababa ang mas malawak na saklaw nito.
- source_word: וּלְשָׁמְרָהּ
  choice: at pangalagaan iyon
  rationale: Saklaw ng “pangalagaan” ang pag-iingat at pagbabantay nang hindi nagbibigay ng labis na militar na himig.
theological_decisions:
- issue: Tungkulin ng tao sa Eden
  choice: Inilalarawan ang gawain ng lalaki bilang paglinang at pangangalaga sa halamanan nang hindi ipinapasok ang isang tiyak na teolohikal na kategorya.
  alternative: Maaaring unawain ang mga pandiwa bilang natatanging wikang pangsaserdote o pangsantuwaryo, o bilang purong gawaing pansakahan.
  rationale: Maaaring magtaglay ang עבד at שמר ng mga pahiwatig na lampas sa pagsasaka, ngunit hindi hinihingi ng talata ang isang espesyalisadong interpretasyon. Pinananatili ng salin at talababa ang saklaw ng mga salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “halamanan” upang panatilihin ang tradisyonal ngunit madaling maunawaang katawagan sa hardin ng Eden; natural ang “linangin at pangalagaan” para sa ordinaryong mambabasa.
