id: GEN.2.18
reference: Genesis 2:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְהוָ֣ה אֱלֹהִ֔ים לֹא ט֛וֹב הֱי֥וֹת הָֽ/אָדָ֖ם לְ/בַדּ֑/וֹ אֶֽעֱשֶׂהּ לּ֥/וֹ עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/018.yaml
  text: Then Yahweh God said[a], “It is not good for the man to be alone. I will make a helper corresponding to him.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Yahweh na Diyos, “Hindi mabuting mag-isa ang lalaki. Gagawa ako para sa kanya ng isang katuwang na katapat niya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang katuwang na angkop sa kanya,” “isang katuwang na katugma niya,” o “isang katuwang na kaharap niya.” Ipinahihiwatig ng pariralang Hebreo ang isang tumutugma at tumutugon sa kanya, hindi lamang isang tagapaglingkod na mas mababa ang katayuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang titulong Diyos sa natural na pariralang Tagalog.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Ang pandiwa ay nangangahulugang ‘sinabi,’ at ipinahihiwatig ng anyong pasalaysay ang pagpapatuloy ng pangyayari, na likas na ipinapahayag ng ‘Pagkatapos ay.’
- source_word: לֹא טוֹב הֱיוֹת הָאָדָם לְבַדּוֹ
  choice: Hindi mabuting mag-isa ang lalaki
  rationale: Direktang pinananatili ang negatibong pagtataya at ang kalagayan ng nag-iisang lalaking tinutukoy sa salaysay.
- source_word: אֶעֱשֶׂה־לּוֹ
  choice: Gagawa ako para sa kanya
  rationale: Ipinapahayag ng anyong Hebreo ang layunin ng Diyos; natural sa Tagalog ang ayos na ito.
- source_word: עֵזֶר
  choice: katuwang
  rationale: Ang ‘katuwang’ ay likas at marangal na katawagan sa isang tumutulong, at hindi nito ipinahihiwatig na mas mababa ang katayuan.
- source_word: כְּנֶגְדּוֹ
  choice: na katapat niya
  rationale: Pinananatili ng ‘katapat’ ang ideya ng isang kaharap, katugma, o tumutugon sa kanya, nang hindi basta ginagawang tagapaglingkod o mababang uri ng katulong.
theological_decisions:
- issue: Kahulugan ng הָאָדָם sa konteksto
  choice: ang lalaki
  alternative: ang tao; sangkatauhan
  rationale: Ang tinutukoy rito ay ang partikular na lalaking nag-iisa sa hardin, hindi lamang ang sangkatauhan bilang isang abstraktong kabuuan.
- issue: Posibleng hierarkikal na pagbasa sa עֵזֶר כְּנֶגְדּוֹ
  choice: isang katuwang na katapat niya
  alternative: isang katulong na angkop sa kanya; isang katuwang na katugma niya
  rationale: Hindi tahasang nagsasaad ang Hebreo ng pagiging nakatataas o nakabababa. Pinananatili ng salin ang parehong ideya ng pagtulong at ng pagtutugma o pagtapat.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘katapat’ upang mapanatili ang ugnayang ipinahihiwatig ng Hebreo; nililinaw ng talababa ang saklaw nito upang maiwasan ang karaniwang kahulugang ‘kalaban.’
