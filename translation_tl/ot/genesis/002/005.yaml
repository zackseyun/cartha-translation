revisions:
- from: Wala pang anumang palumpong sa parang[a] sa lupa, at wala pang anumang halaman sa parang na sumisibol, sapagkat hindi pa pinauulanan ni Yahweh na Diyos ang lupa, at wala pang taong magbungkal ng lupa.[b]
  to: Sa lupa ay wala pang anumang palumpong sa bukid[a], at wala pang anumang halaman sa bukid ang tumutubo, sapagkat hindi pa nagpapaulan si Yahweh na Diyos sa lupa, at wala pang tao upang bungkalin ang lupa.[b]
  rationale: Inayos ang aspekto ng ikalawang sugnay at ang causative na pandiwa para sa ulan, at ginawang “bukid” ang katumbas ng שָׂדֶה. Hindi binibigyang-kahulugan ng rebisyon ang mga halaman bilang eksklusibong pananim; pinananatili nito ang sanhi at saklaw na ipinahahayag ng Hebreo. Napanatili rin ang dalawang talababa at ang mga anchor nito.
