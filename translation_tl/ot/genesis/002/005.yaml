id: GEN.2.5
reference: Genesis 2:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כֹ֣ל שִׂ֣יחַ הַ/שָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָ/אָ֔רֶץ וְ/כָל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהוָ֤ה אֱלֹהִים֙ עַל הָ/אָ֔רֶץ וְ/אָדָ֣ם אַ֔יִן לַֽ/עֲבֹ֖ד אֶת הָֽ/אֲדָמָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/005.yaml
  text: No shrub of the field was yet on the earth[a], and no plant of the field had yet sprung up, because Yahweh God had not caused it to rain on the earth[c][b], and there was no man to work the ground.
translation:
  language: tl
  text: Sa lupa ay wala pang anumang palumpong sa bukid[a], at wala pang anumang halaman sa bukid ang tumutubo, sapagkat hindi pa nagpapaulan si Yahweh na Diyos sa lupa, at wala pang tao upang bungkalin ang lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “palumpong sa parang.”
    reason: lexical_alternative
  - marker: b
    text: Ang “lupa” sa huling parirala ay Hebreong אֲדָמָה, na tumutukoy sa lupang binubungkal o lupaing sakahan; iba ito sa אֶרֶץ, “lupa” o “daigdig,” sa naunang mga parirala.
    reason: source_language_distinction
lexical_decisions:
- source_word: שִׂיחַ הַשָּׂדֶה
  choice: palumpong sa parang
  rationale: Ang שִׂיחַ ay palumpong o mababang halamang makahoy, kaya pinananatili ang pagkakaiba nito sa עֵשֶׂב. Ang הַשָּׂדֶה ay likas na isinaling “sa parang” sa kontekstong ito.
- source_word: טֶרֶם יִהְיֶה בָאָרֶץ
  choice: wala pa ... sa lupa
  rationale: Ipinahahayag ng טֶרֶם ang kalagayang hindi pa nagaganap, samantalang ang יִהְיֶה ay tumutukoy sa pag-iral o presensiya.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: halaman sa parang
  rationale: Malawak ang saklaw ng עֵשֶׂב para sa maliliit o mala-damong halaman; ang “halaman” ay malinaw at hindi labis na espesipiko.
- source_word: טֶרֶם יִצְמָח
  choice: wala pang ... na sumisibol
  rationale: Ang צמח ay tumutukoy sa pagsibol o pagtubo; “sumisibol” ang natural na katumbas habang pinananatili ang aspektong hindi pa nagaganap.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ito rito ng dahilan ng kawalan ng mga halamang nabanggit.
- source_word: הִמְטִיר
  choice: pinauulanan
  rationale: Ang anyong hiphil ng מטר ay causative; malinaw na ipinahahayag ng “pinauulanan” na ang Diyos ang sanhi ng pag-ulan.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang kasunod na titulong Diyos sa natural na ayos ng Tagalog.
- source_word: וְאָדָם אַיִן
  choice: wala pang taong
  rationale: Ang אָדָם ay tumutukoy dito sa isang tao bilang tagapagbungkal, hindi kinakailangang sa pangalan o sa kasariang lalaki; “tao” ang tumpak at likas na pangkalahatang katawagan.
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: magbungkal ng lupa
  rationale: Sa kontekstong agrikultural, ang עבד ay paggawa o paglilinang sa אֲדָמָה; “magbungkal ng lupa” ay malinaw at natural.
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: lupa / lupa
  rationale: Walang lubos na natural na pare-parehong paraan sa Tagalog upang laging ibukod ang “earth/land” sa “ground/soil” rito. Iisang salitang “lupa” ang ginamit sa teksto, ngunit nililinaw sa talababa ang mas tiyak na diwa ng אֲדָמָה.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang Hebreo ay tahasang gumagamit ng Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng אָדָם sa konteksto
  choice: tao
  alternative: lalaki; sangkatauhan
  rationale: Ang salita ay tumutukoy sa kawalan ng isang taong maglilinang ng lupa. Hindi hinihingi ng mismong parirala na tukuyin ang kasarian, at ang “tao” ay nagpapanatili sa pangkalahatang diwa nang hindi ginagawang abstraktong “sangkatauhan.”
- issue: Ugnayan ng kawalan ng halaman, ulan, at tagapagbungkal
  choice: pinanatili ang tahasang sanhi sa כִּי nang hindi nililimitahan ang lahat ng halaman sa pananim lamang
  alternative: ipakahulugang tanging mga halamang sinasaka ang tinutukoy
  rationale: Binabanggit ng teksto ang kawalan ng ulan at ng taong magbungkal, ngunit hindi nito tahasang nilulutas kung ang dalawang uri ng halaman ay eksklusibong pananim. Pinananatili ang tensiyong ito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “parang” upang ilarawan ang שׂדה nang hindi ipinapalagay na isa na itong sinasakang bukid. Inilagay ang lahat ng markang talababa sa pangunahing teksto.
