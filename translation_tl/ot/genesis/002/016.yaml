  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְצַו֙ יְהוָ֣ה אֱלֹהִ֔ים עַל הָֽ/אָדָ֖ם לֵ/אמֹ֑ר מִ/כֹּ֥ל עֵֽץ הַ/גָּ֖ן אָכֹ֥ל תֹּאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/016.yaml
  text: And Yahweh God commanded the man[a], saying[b], “From every tree of the garden you may surely eat.”
translation:
  language: tl
  text: At iniutos ni Yahweh na Diyos sa lalaki, “Mula sa bawat puno sa hardin ay malaya kang makakakain[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit sa magkaugnay na anyo ang pandiwang “kumain” upang bigyang-diin ang malayang pahintulot: maaari ring isaling “tiyak na makakakain ka.”'
    reason: Ipinaliliwanag ang diin ng infinitive absolute na kasama ng finite verb at pinananatili ang posibleng alternatibong pagpapahayag.
lexical_decisions:
- source_word: וַיְצַו
  choice: At iniutos
  rationale: Ang צוה ay nagpapahayag ng makapangyarihang pag-uutos; natural at malinaw sa modernong Tagalog ang “iniutos.”
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Pinananatili ng “Yahweh” ang personal na pangalang יהוה, habang ang אֱלֹהִים ay likas na isinasaling “Diyos.” Ang pang-ugnay na “na” ay natural sa tambalang katawagan sa Tagalog.
- source_word: עַל הָאָדָם
  choice: sa lalaki
  rationale: Sa konteksto, ang הָאָדָם ay ang partikular na lalaking nilalang at inilagay sa hardin; ang “sa lalaki” ay likas na tumutukoy sa tumanggap ng utos.
- source_word: לֵאמֹר
  choice: (ipinahiwatig ng tuwirang sipi)
  rationale: Karaniwang panandang Hebreo ito sa pagpapakilala ng tuwirang pananalita. Hindi kailangang isalin nang hiwalay na “na sinasabi” dahil magiging mabigat at di-likas iyon sa Tagalog; sapat ang pandiwang “iniutos” at ang kasunod na sipi.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: Mula sa bawat puno sa hardin
  rationale: Pinananatili ng “mula sa bawat” ang saklaw ng כֹּל at ang diwa ng pagkain ng bunga mula sa lahat ng puno; mas natural sa Tagalog ang “puno sa hardin” kaysa “puno ng hardin.”
- source_word: אָכֹל תֹּאכֵל
  choice: malaya kang makakakain
  rationale: Ang infinitive absolute na kasama ng imperfect ay nagbibigay-diin sa pandiwa. Sa konteksto, pahintulot ang diwa, kaya ipinahahayag ng “malaya kang makakakain” kapwa ang pahintulot at diin nang natural sa Tagalog.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Tukoy ng הָאָדָם
  choice: ang lalaki
  alternative: ang tao; sangkatauhan
  rationale: Ang tinutukoy rito ay ang indibiduwal na lalaking inilagay sa hardin, hindi ang sangkatauhan sa pangkalahatan.
- issue: Lakas at modalidad ng אָכֹל תֹּאכֵל
  choice: malaya kang makakakain
  alternative: tiyak na makakakain ka; maaari kang kumain
  rationale: Pinagsasama ng piniling salin ang kontekstuwal na pahintulot at ang diin ng Hebreong konstruksiyon nang hindi ito ginagawang utos na kailangang kumain.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Iniwasan ang mabigat na literalismong “na sinasabi” at pinanatili ang diin ng Hebreo sa pamamagitan ng “malaya kang makakakain.”
