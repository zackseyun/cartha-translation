  register: Makabagong Filipino na simple, marangal, at madaling maunawaan. Pinanatili ang maikling ayos ng Hebreo at ang kawalang-katiyakan sa pagkakakilanlan ng dalawang likas na yaman sa pamamagitan ng mga talababa.
