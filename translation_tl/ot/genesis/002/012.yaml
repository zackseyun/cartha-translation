  text: And the gold of that land is good[b][a]; bdellium and onyx stone are there.
translation:
  language: tl
  text: At ang ginto sa lupaing iyon ay mainam. Naroon ang bedolyo[a] at batong oniks[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O posibleng “mabangong dagta”; hindi tiyak kung anong sangkap ang tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: O posibleng ibang mahalagang bato, gaya ng berilo; hindi tiyak kung anong mineral ang tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזֲהַב
  choice: At ang ginto
  rationale: Ipinagpapatuloy ng waw ang paglalarawan sa naunang talata; ang זָהָב ay tuwirang nangangahulugang “ginto.”
- source_word: הָאָרֶץ הַהִוא
  choice: sa lupaing iyon
  rationale: Ang אֶרֶץ ay “lupain,” at ang הַהִוא ay tumutukoy pabalik sa Havila sa naunang talata.
- source_word: טוֹב
  choice: ay mainam
  rationale: Inilalarawan dito ng טוֹב ang kalidad ng ginto. Likas at marangal sa Filipino ang “mainam” nang hindi dinaragdagan ang kahulugan.
- source_word: שָׁם
  choice: Naroon
  rationale: Ang שָׁם ay nangangahulugang “doon/naroon” at natural na nagpapakilala sa dalawang bagay na matatagpuan sa lupain.
- source_word: הַבְּדֹלַח
  choice: ang bedolyo[a]
  rationale: Hindi tiyak ang eksaktong sangkap na tinutukoy ng בְּדֹלַח. Pinananatili ng transliterasyong “bedolyo” ang natatanging katawagan at iniiwasan ang huwad na katiyakan.
- source_word: וְאֶבֶן הַשֹּׁהַם
  choice: at batong onix[b]
  rationale: Tahasang nangangahulugang “bato” ang אֶבֶן, samantalang hindi tiyak ang mineral na tinutukoy ng שֹׁהַם. Ginagamit ang tradisyonal na pagkakakilanlang “onix” ngunit nililinaw sa talababa ang kawalang-katiyakan.
