revisions:
- from: Ngunit huwag kang kakain mula sa punong nagbibigay ng kaalaman tungkol sa mabuti at masama,[a] sapagkat sa araw na kumain ka mula roon,[b] tiyak na mamamatay ka.
  to: Ngunit mula sa punongkahoy ng kaalaman tungkol sa mabuti at masama ay huwag kang kumain, sapagkat sa araw na kumain ka mula rito,[a] tiyak na mamamatay ka.
  rationale: Pinalitan ang interpretibong “punong nagbibigay ng kaalaman” ng mas tapat na “punongkahoy ng kaalaman tungkol sa mabuti at masama.” Inayos din ang anyo ng pagbabawal para sa natural na modernong Tagalog. Inalis ang tala tungkol sa resumptive na panghalip, dahil ang natural na Tagalog ay hindi kailangang tularan ang pag-uulit nito; pinanatili ang mahalagang tala ukol sa idyomang “sa araw na.”
