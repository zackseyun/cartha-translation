  text: but from the tree of the knowledge of good and evil you shall not eat[a], for in the day you eat from it[b], you shall surely die.
translation:
  language: tl
  text: Ngunit mula sa punongkahoy ng kaalaman tungkol sa mabuti at masama ay huwag kang kumain, sapagkat sa araw na kumain ka mula rito,[a] tiyak na mamamatay ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa araw na kumain ka mula rito.” Maaari ring mangahulugan ang idyomang ito na “kapag kumain ka mula rito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵץ
  choice: Ngunit ... mula sa punong
  rationale: Ang וּ ay gumaganap na panandang pagsalungat sa malawak na pahintulot sa talata 16, kaya natural ang “ngunit”; pinananatili ng “mula sa” ang מִן.
- source_word: הַדַּעַת טוֹב וָרָע
  choice: nagbibigay ng kaalaman tungkol sa mabuti at masama
  rationale: Ipinahahayag nito sa natural na Tagalog ang ugnayang construct ng “punong [ng] kaalaman ng mabuti at masama,” habang pinananatili ang bigat ng דַּעַת at ang tambalang טוֹב וָרָע.
- source_word: לֹא תֹאכַל
  choice: huwag kang kakain
  rationale: Karaniwan at marangal na anyo ito ng tahasang pagbabawal sa modernong Tagalog.
- source_word: בְּיוֹם אֲכָלְךָ
  choice: sa araw na kumain ka
  rationale: Malapit ito sa Hebreong idyoma at hindi agad nagpapasya kung isang tiyak na araw o mas pangkalahatang “kapag” ang temporal na diwa.
- source_word: מִמֶּנּוּ
  choice: mula roon
  rationale: Tumutukoy nang natural sa punong nabanggit at pinananatili ang puwersa ng preposisyong מִן.
- source_word: מוֹת תָּמוּת
  choice: tiyak na mamamatay ka
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa katiyakan ng kamatayan; malinaw itong naihahatid ng “tiyak na.”
theological_decisions:
- issue: Temporal na puwersa ng בְּיוֹם kaugnay ng katuparan ng kamatayan
  choice: sa araw na kumain ka
  alternative: kapag kumain ka
  rationale: Pinananatili ng pangunahing teksto ang Hebreong pananalita at ang kaakibat nitong tensiyon, nang hindi ipinapasiya kung agarang pisikal na kamatayan, pagsisimula ng pagiging mortal, o tiyak na hatol ng kamatayan ang tinutukoy.
- issue: Saklaw ng pariralang טוֹב וָרָע
  choice: mabuti at masama
  alternative: tama at mali
  rationale: Ang mas literal at malawak na pares na “mabuti at masama” ay hindi nililimitahan ang parirala sa moral na paghatol lamang.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “huwag kang kakain” para sa mariing pagbabawal at “tiyak na mamamatay ka” para sa Hebreong intensification. Iniwasan ang sobrang teknikal o denominasyonal na pananalita.
