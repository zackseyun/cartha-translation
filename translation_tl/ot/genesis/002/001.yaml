  source_fidelity: Tumpak na naipapahayag ng “natapos ang langit at ang lupa, pati ang lahat ng naroroon sa mga ito” ang pasibong pagkaganap ng וַיְכֻלּוּ at ang komprehensibong saklaw ng וְכָל־צְבָאָם. Hindi nito pinipilit ang militar na pakahulugan ng צָבָא, habang malinaw na isinasaad ang lahat ng bumubuo sa langit at lupa.
  naturalness: Likas, malinaw, at marangal ang modernong Tagalog. Ang isahang “langit” ay karaniwang kolektibong gamit sa Tagalog at angkop sa kontekstong pangkosmolohiya. Ang “Sa gayon” ay katamtamang pormal ngunit nababagay sa salaysay.
  terminology: Maayos ang “langit,” “lupa,” at “lahat ng naroroon sa mga ito.” Ang talababa ay kapaki-pakinabang na nag-iingat sa leksikal na larawan ng Hebreong “hukbo/kalipunan” nang hindi nililimitahan ang tinutukoy sa mga bituin o sa literal na hukbo.
