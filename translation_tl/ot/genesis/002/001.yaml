id: GEN.2.1
reference: Genesis 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְכֻלּ֛וּ הַ/שָּׁמַ֥יִם וְ/הָ/אָ֖רֶץ וְ/כָל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/001.yaml
  text: Thus the heavens and the earth were finished[b][a], and all their hosts.
translation:
  language: tl
  text: Sa gayon, natapos ang langit at ang lupa, pati ang lahat ng naroroon sa mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang kanilang buong hukbo,” na nangangahulugang ang buong kalipunan ng lahat ng nasa langit at lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכֻלּוּ
  choice: natapos
  rationale: Ang pasibong anyo ng כלה ay nagsasaad na sumapit sa ganap na pagkabuo o pagtatapos ang nilikha. Likas sa modernong Tagalog ang “natapos” at pinananatili nito ang resultang diwa ng pandiwa.
- source_word: הַשָּׁמַיִם
  choice: ang langit
  rationale: Bagaman anyong maramihan ang salitang Hebreo, karaniwang kolektibong pangngalan ang “langit” sa Tagalog at angkop ito sa malawak na kosmolohikal na kahulugan dito.
- source_word: וְהָאָרֶץ
  choice: at ang lupa
  rationale: Sa salaysay ng paglikha, tumutukoy ang אֶרֶץ sa buong makalupang dako, hindi sa isang partikular na lupain.
- source_word: וְכָל צְבָאָם
  choice: pati ang lahat ng naroroon sa mga ito
  rationale: Ang צָבָא ay maaaring mangahulugang hukbo o organisadong karamihan, ngunit dito ay komprehensibong tumutukoy sa lahat ng bumubuo at pumupuno sa langit at lupa. Iniiwasan ng saling ito ang maling impresyong militar habang pinananatili ang saklaw ng parirala.
theological_decisions:
- issue: Saklaw ng “lahat ng naroroon sa mga ito”
  choice: Komprehensibong tumutukoy sa lahat ng nilikhang nasa langit at lupa o kabilang sa mga ito.
  alternative: Maaaring unawain nang mas makitid bilang mga bagay sa langit, gaya ng mga bituin, o bilang larawang militar ng mga hanay.
  rationale: Dahil kasunod ito ng magkaparis na “langit at lupa,” pinakamalamang na buod ito ng kabuuan ng mga nilalaman ng dalawang dako. Ipinaliliwanag ng talababa ang larawang nasa salitang Hebreo nang hindi nililimitahan ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang kolektibong “langit” at ang likas na pariralang “lahat ng naroroon sa mga ito” upang maipahayag ang kabuuang saklaw ng Hebreo nang hindi lumilikha ng di-inaasahang kahulugang militar.
