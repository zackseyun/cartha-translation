id: GEN.2.8
reference: Genesis 2:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּטַּ֞ע יְהוָ֧ה אֱלֹהִ֛ים גַּן בְ/עֵ֖דֶן מִ/קֶּ֑דֶם וַ/יָּ֣שֶׂם שָׁ֔ם אֶת הָֽ/אָדָ֖ם אֲשֶׁ֥ר יָצָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/008.yaml
  text: And Yahweh God planted a garden in Eden[a], in the east, and there he put the man whom he had formed.
translation:
  language: tl
  text: At nagtanim si Yahweh na Diyos ng isang hardin sa Eden, sa silangan,[a] at doon niya inilagay ang lalaking kanyang hinubog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pasilangan.” Maaaring tumukoy ang pariralang Hebreo sa kinaroroonan (“sa silangan”) o sa direksiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: nagtanim
  rationale: Tuwirang ipinapahayag ng נטע ang pagtatanim; natural ito sa Filipino at angkop sa larawan ng isang hardin.
- source_word: יְהוָה אֱלֹהִים
  choice: si Yahweh na Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at natural na inuugnay rito sa Filipino ang titulong Diyos.
- source_word: גַּן
  choice: isang hardin
  rationale: Ang גן ay isang hardin o nilinang na lugar; 'hardin' ang malinaw at karaniwang katumbas.
- source_word: בְעֵדֶן
  choice: sa Eden
  rationale: Pangalan ng lugar ang עֵדֶן kaya tinumbasan ito sa pamamagitan ng transliterasyong 'Eden.'
- source_word: מִקֶּדֶם
  choice: sa silangan
  rationale: Maaaring tukuyin ng parirala ang kinaroroonan sa silangan; pinananatili sa talababa ang posibleng kahulugang direksiyon na 'pasilangan.'
- source_word: וַיָּשֶׂם שָׁם
  choice: doon niya inilagay
  rationale: Natural na Filipino ito para sa payak na diwang 'placed there,' at malinaw na tumutukoy sa hardin.
- source_word: הָאָדָם
  choice: ang lalaki
  rationale: Tumutukoy rito ang tiyak na anyong isahan sa partikular na taong hinubog na ng Diyos, hindi sa sangkatauhan sa kabuuan.
- source_word: אֲשֶׁר יָצָר
  choice: kanyang hinubog
  rationale: Ang יצר ay nangangahulugang humubog o mag-anyo; malinaw na ipinahihiwatig ng konstruksiyon ang naunang paghubog sa lalaki.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo; pinananatili ito bilang 'Yahweh' sa halip na palitan ng isang titulo.
- issue: Pag-render sa הָאָדָם
  choice: ang lalaki
  alternative: ang tao; ang taong iyon
  rationale: Sa kontekstong ito, isang partikular na lalaking nilalang ang tinutukoy. Hindi ito pangkalahatang katawagan para sa buong sangkatauhan.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang 'hardin,' 'inilagay,' at 'hinubog' bilang natural at malinaw na mga salita; pinanatili ang tunay na kalabuan ng מִקֶּדֶם sa talababa.
