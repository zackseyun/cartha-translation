  text: And the man and his wife were both naked[a], and they were not ashamed.
translation:
  language: tl
  text: Parehong hubad[a] ang lalaki at ang kanyang asawa, at hindi sila nahihiya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang dalawa sa kanila ay hubad”; idiniriin ng pagkakasabi na pareho silang walang saplot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: '[ipinahayag sa sugnay na] kapuwa hubad'
  rationale: Ang anyong ito ng היה ay nag-uugnay sa salaysay at nagpapahayag ng kalagayan. Sa natural na Tagalog, hindi kailangang tumbasan ng hiwalay na pandiwang “ay naging” o “ay naroon.”
- source_word: שְׁנֵיהֶם
  choice: kapuwa
  rationale: Malinaw at likas na ipinakikita ng “kapuwa” na ang tinutukoy ay parehong kasapi ng pares.
- source_word: עֲרוּמִּים
  choice: hubad
  rationale: Tuwirang tumutukoy ito sa kawalan ng saplot. Ang “hubad” ang pinakanatural at malinaw na katumbas sa modernong Tagalog.
- source_word: הָאָדָם
  choice: ang lalaki
  rationale: Sa talatang ito, ang tinutukoy ay ang lalaking tao na ipinares sa “kanyang asawa,” hindi ang sangkatauhan sa pangkalahatan.
- source_word: וְאִשְׁתּוֹ
  choice: at ang kanyang asawa
  rationale: Ang pangngalan na may hulaping panghalip na panlalaki ay natural na nangangahulugang “kanyang asawa” at nagpapanatili sa ugnayang mag-asawa ng konteksto.
- source_word: וְלֹא יִתְבֹּשָׁשׁוּ
  choice: at hindi sila nahihiya
  rationale: Ang pariralang ito ay nagpapahayag na hindi sila nakararanas ng hiya. Ang “nahihiya” ay natural at higit na angkop kaysa sa mas mahinang diwang “naiilang” o “napapahiya.”
theological_decisions:
- issue: Pagpapakahulugan sa הָאָדָם ayon sa konteksto
  choice: ang lalaki
  alternative: ang tao / ang taong nilalang
  rationale: Dahil tahasang ipinapares siya sa “kanyang asawa,” ang tinutukoy rito ay ang indibidwal na lalaki. Pinananatili nito ang tiyak na tauhan sa salaysay nang hindi nagdaragdag ng mas malawak na pahayag tungkol sa sangkatauhan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kapuwa” upang likas na maipahayag ang diin sa dalawang mag-asawa, at pinanatili ang payak na pang-ugnay na “at” sa dalawang sugnay.
