  to: Kaya pinagpala ng Diyos ang ikapitong araw at ginawa niya itong banal[a], sapagkat sa araw na iyon ay nagpahinga[b] siya mula sa lahat ng kaniyang gawain—na nilikha ng Diyos upang gawin.[c]
