  text: So God blessed the seventh day and made it holy[d][c][b][a], because on it he rested from all his work that God had created to make.
translation:
  language: tl
  text: Kaya pinagpala ng Diyos ang ikapitong araw at ginawa niya itong banal[a], sapagkat sa araw na iyon ay nagpahinga[b] siya mula sa lahat ng kaniyang gawain—na nilikha ng Diyos upang gawin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinabanal niya ito” o “ibinukod niya ito bilang banal.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Hebreo ay “nagpahinga”; maaari rin itong mangahulugang “tumigil.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “na nilikha ng Diyos upang gawin.” Mahirap ang pangwakas na parirala; nauunawaan din ito ng ilan bilang “na nilikha at ginawa ng Diyos” o “na nilikha ng Diyos sa paggawa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: pinagpala
  rationale: Likas at tuwirang katumbas ng piel na anyo ng ברך, na nagpapahayag ng pagkakaloob ng pagpapala sa araw.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: May pang-isahang pandiwa at tumutukoy sa iisang Diyos sa konteksto ng Genesis 1–2.
- source_word: יוֹם הַשְּׁבִיעִי
  choice: ang ikapitong araw
  rationale: Tuwirang salin ng pangngalan at ordinal na may tiyak na pantukoy.
- source_word: וַיְקַדֵּשׁ אֹתוֹ
  choice: ginawa niya itong banal
  rationale: Malinaw sa makabagong Tagalog at pinananatili ang diwa ng pagpapabanal; hindi nito nililimitahan ang kahulugan sa isang denominasyonal na gamit ng 'itinalaga' o 'pinabanal.'
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagpapala at pagpapabanal sa ikapitong araw; ang 'sapagkat' ay marangal ngunit karaniwang nauunawaan.
- source_word: בּוֹ
  choice: sa araw na iyon
  rationale: Mas malinaw at natural sa Tagalog kaysa sa literal na 'dito/roon,' habang tapat na ibinabalik ang tinutukoy na ikapitong araw.
- source_word: שָׁבַת
  choice: nagpahinga
  rationale: Karaniwan at angkop sa konteksto, at pinananatili ang ugnayan sa Sabbath; maaaring mangahulugan din ang pandiwa na 'tumigil.'
- source_word: מִכָּל מְלַאכְתּוֹ
  choice: mula sa lahat ng gawain
  rationale: Ang מְלָאכָה ay malawak na tumutukoy sa gawain o trabaho; natural ang 'gawain' sa kontekstong ito.
- source_word: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: na nilikha ng Diyos upang gawin
  rationale: Malapit sa anyo ng Hebreo at sadyang pinananatili ang mahirap at hindi ganap na tiyak na ugnayan ng ברא at infinitibong לעשות, sa halip na tahimik na gawing 'nilikha at ginawa.'
theological_decisions:
- issue: Kahulugan ng שָׁבַת kaugnay ng Sabbath
  choice: nagpahinga
  alternative: tumigil
  rationale: Pinananatili ng 'nagpahinga' ang mahalagang ugnayan sa ikapitong araw at Sabbath nang hindi kinakailangang magpahiwatig ng pagkapagod; inilalahad sa talababa ang leksikal na alternatibo.
- issue: Pagpapakahulugan sa וַיְקַדֵּשׁ אֹתוֹ
  choice: ginawa niya itong banal
  alternative: pinabanal niya ito; ibinukod niya ito bilang banal
  rationale: Pinananatili ang wika ng kabanalan sa malinaw at hindi labis na eklesyastikong Tagalog.
- issue: Mahirap na pangwakas na pariralang אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: na nilikha ng Diyos upang gawin
  alternative: na nilikha at ginawa ng Diyos; na nilikha ng Diyos sa paggawa
  rationale: Hindi nilulutas nang tahimik ang sintaktikong hirap ng Hebreo; pinananatili sa pangunahing teksto ang malapit na pagbasa at inilalagay sa talababa ang mga posibleng pagkaunawa.
translation_notes:
  register: Makabago, natural, at marangal na Filipino Tagalog. Ginamit ang 'sapagkat' para sa dignidad at linaw, ngunit iniwasan ang lipas o teknikal na pananalita. Ang mahirap na hulíng sugnay ay sadyang hindi pinakinis nang higit sa ebidensiya ng Hebreo.
