  text: וַ/יִּקְרָ֨א הָֽ/אָדָ֜ם שֵׁמ֗וֹת לְ/כָל הַ/בְּהֵמָה֙ וּ/לְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/לְ/כֹ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/לְ/אָדָ֕ם לֹֽא מָצָ֥א עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/020.yaml
  text: And the man gave names to all the livestock[a], to the birds of the sky, and to every wild animal[c][b], but for the man no helper corresponding to him was found.
translation:
  language: tl
  text: Pinangalanan ng lalaki[a] ang lahat ng alagang hayop, ang mga ibon sa himpapawid, at ang bawat mabangis na hayop. Ngunit hindi nakatagpo ang lalaki ng isang katuwang na katugma niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Adan.”'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring: “isang katuwang na angkop sa kaniya” o “isang katuwang na tumutugma sa kaniya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם / לְאָדָם
  choice: ang lalaki
  rationale: May pantukoy ang unang anyo at tumutukoy sa indibidwal na tao sa salaysay. Pinananatili ng “ang lalaki” ang karaniwang-pangngalang diwa sa bahaging ito, samantalang posible rin ang pangalang “Adan.”
- source_word: וַיִּקְרָא ... שֵׁמוֹת
  choice: binigyan ... ng mga pangalan
  rationale: Ang idyoma ay tumutukoy sa pagtatalaga ng mga pangalan. Likas ito sa modernong Filipino at naipapakita rin ang maramihang שֵׁמוֹת.
- source_word: הַבְּהֵמָה
  choice: mga alagang hayop
  rationale: Sa paghahanay na ito, tumutukoy ito sa mga hayop na inaalagaan, bilang kaiba sa mababangis na hayop.
- source_word: עוֹף הַשָּׁמַיִם
  choice: mga ibon sa langit
  rationale: Malinaw at likas na salin ito ng larawang Hebreo para sa mga ibong lumilipad sa himpapawid.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: bawat mabangis na hayop
  rationale: Ipinahihiwatig ng parirala ang mga hayop sa parang o mga hindi inaalagaang hayop; malinaw sa karaniwang mambabasa ang “mabangis na hayop.”
- source_word: עֵזֶר
  choice: katuwang
  rationale: Ipinahahayag nito ang isang nagbibigay ng tulong at, sa kontekstong ito, isang kaparehang makakatulong. Hindi ipinahihiwatig ng salitang Hebreo ang pagiging mababa o utusan; mas naiiwasan ng “katuwang” ang gayong maling pahiwatig kaysa “katulong.”
- source_word: כְּנֶגְדּוֹ
  choice: na katapat niya
  rationale: Pinananatili nito ang diwa ng isang nasa tapat niya at tumutugma sa kaniya, nang hindi lubusang nilulutas ang lawak ng relasyong ipinahihiwatig.
- source_word: לֹא מָצָא
  choice: hindi nakatagpo ang lalaki
  rationale: Direktang pinananatili ang aktibong pandiwang Hebreo na nasa ikatlong panauhang panlalaki, sa halip na gawing pasibo ang pangungusap.
theological_decisions:
- issue: Pagpapakahulugan sa אָדָם sa Genesis 2:20
  choice: ang lalaki
  alternative: Adan
  rationale: Ang konteksto ay tumutukoy sa indibidwal na lalaki sa hardin, hindi sa sangkatauhan sa pangkalahatan. Gayunman, maaari nang unawain ang salita bilang nagiging personal na pangalang “Adan,” kaya inilagay ang alternatibo sa talababa.
- issue: Ugnayang ipinahihiwatig ng עֵזֶר כְּנֶגְדּוֹ
  choice: isang katuwang na katapat niya
  alternative: isang katuwang na angkop sa kaniya
  rationale: Pinananatili ng “katapat niya” ang tensiyon ng Hebreong כְּנֶגְדּוֹ—kapuwa nasa tapat at tumutugma—nang hindi nagdaragdag ng ideya ng pagpapasakop o isang tiyak na doktrina ng mga gampanin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “katuwang” sa halip na “katulong” upang maiwasan ang karaniwang makabagong pahiwatig na kasambahay o taong nakabababa ang katayuan. Pinanatili ang aktibong ayos ng Hebreo sa huling sugnay.
