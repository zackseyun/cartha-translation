base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/023.yaml
  text: Then the man said[a], “This at last is bone of my bones and flesh of my flesh; this one will be called woman[b], because from man she was taken.”
translation:
  language: tl
  text: Sinabi ng lalaki, “Sa wakas, ito ay buto mula sa aking mga buto at laman mula sa aking laman; ang isang ito ay tatawaging ‘babae,’[a] sapagkat mula sa lalaki siya kinuha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, magkaugnay ang mga salitang ’ishshah (“babae”) at ’ish (“lalaki”), kaya may paglalaro ng mga salita rito na hindi ganap na matutumbasan sa Tagalog.
    reason: wordplay
lexical_decisions:
- source_word: הָאָדָם
  choice: ang lalaki
  rationale: Sa kontekstong ito, tumutukoy ito sa lalaking tao at inihahambing sa אִשָּׁה at אִישׁ sa kasunod na paglalaro ng mga salita.
- source_word: זֹאת הַפַּעַם
  choice: Sa wakas, ito
  rationale: Ipinahahayag ng parirala ang pagkilala na ang naroon na ngayon ang hinihintay o angkop na kapareha; natural sa Tagalog ang “Sa wakas” habang pinananatili ng “ito” ang demonstratibong diin.
- source_word: עֶצֶם מֵעֲצָמַי
  choice: buto mula sa aking mga buto
  rationale: Pinananatili ng “mula sa” ang pangunahing diwa ng preposisyong מִן at ang larawang tumutukoy sa pinagmulan.
- source_word: וּבָשָׂר מִבְּשָׂרִי
  choice: at laman mula sa aking laman
  rationale: Kaagapay ito ng naunang parirala at malinaw na inilalarawan ang pinagmulan ayon sa Hebreo.
- source_word: יִקָּרֵא
  choice: Tatawagin
  rationale: Natural na pasibong pormula ng pagpapangalan sa modernong Tagalog.
- source_word: אִשָּׁה ... אִישׁ
  choice: babae ... lalaki
  rationale: Ito ang wastong kahulugan sa konteksto, bagaman hindi kayang tumbasan ng Tagalog ang tunog at anyo ng Hebreong paglalaro sa magkaugnay na mga salita.
- source_word: לֻקֳחָה זֹאת
  choice: siya kinuha
  rationale: Ang pambabaeng panghalip ay malinaw na tumutukoy sa babae; ang demonstratibong diin ay naipahayag na sa “ito” sa unang bahagi.
theological_decisions:
- issue: Kahulugan ng אָדָם sa konteksto
  choice: ang lalaki
  alternative: ang tao / ang taong nilalang
  rationale: Bagaman maaaring mangahulugan ang אָדָם ng tao o sangkatauhan, dito ay nakatuon ang talata sa pagkakaiba at ugnayan ng lalaki at babae, kaya “ang lalaki” ang pinakamalinaw nang hindi nagdaragdag ng doktrinal na pahayag.
- issue: Pagpapanatili sa paglalaro ng mga salitang אִישׁ at אִשָּׁה
  choice: babae ... lalaki, na may talababa
  alternative: asawang babae ... asawang lalaki
  rationale: Hindi tiyak na asawa ang leksikal na diin sa mismong parirala. Pinananatili ng “babae/lalaki” ang mas malawak na kahulugan, at ipinapaliwanag ng talababa ang paglalaro ng mga salita na hindi ganap na matutumbasan sa Tagalog.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Sa wakas” upang natural na maipahayag ang masiglang pagkilala sa זֹאת הַפַּעַם, at “mula sa” upang panatilihin ang larawan ng pinagmulan sa dalawang magkatulad na parirala.
