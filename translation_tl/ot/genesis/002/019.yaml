revisions:
- from: Hinubog[a] ng Diyos na si Yahweh mula sa lupa ang bawat hayop sa parang at ang bawat ibon sa himpapawid, at dinala niya ang mga ito sa lalaki[b] upang makita kung ano ang itatawag nito sa bawat isa. Anuman ang itawag ng lalaki sa bawat nilalang na may buhay, iyon ang pangalan nito.
  to: Hinubog[a] ni Yahweh na Diyos mula sa lupa ang bawat hayop sa parang at ang bawat ibon sa himpapawid, at dinala niya ang mga ito sa lalaki[b] upang makita kung ano ang itatawag niya sa mga ito. Anuman ang itawag ng lalaki sa bawat nilalang na may buhay, iyon ang pangalan nito.
  rationale: Inayos ang malabong panghalip sa unang sugnay at ginawang mas likas ang ayos ng banal na pangalan at titulo. Hindi binago ang payak na nakaraang pagbasa ng וַיִּצֶר, ang karaniwang pangngalang pagbasa sa ha’adam, o ang mga umiiral na talababa at anchor.
