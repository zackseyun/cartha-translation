id: GEN.2.19
reference: Genesis 2:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים מִן הָֽ/אֲדָמָ֗ה כָּל חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/אֵת֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יָּבֵא֙ אֶל הָ֣/אָדָ֔ם לִ/רְא֖וֹת מַה יִּקְרָא ל֑/וֹ וְ/כֹל֩ אֲשֶׁ֨ר יִקְרָא ל֧/וֹ הָֽ/אָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/019.yaml
  text: Yahweh God formed from the ground every wild animal and every bird of the sky[a], and he brought them to the man to see what he would call them. Whatever the man called each living creature[b], that was its name.
translation:
  language: tl
  text: Hinubog[a] ni Yahweh na Diyos mula sa lupa ang bawat hayop sa parang at ang bawat ibon sa himpapawid, at dinala niya ang mga ito sa lalaki[b] upang makita kung ano ang itatawag niya sa mga ito. Anuman ang itawag ng lalaki sa bawat nilalang na may buhay, iyon ang pangalan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawaing “hinubog na.” Hindi tahasang minamarkahan ng anyong Hebreo ang pluperfect, ngunit maaaring tumukoy ito sa paghubog na nauna sa pagdadala ng mga hayop sa lalaki.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “Adam.” Ang Hebreo ay ha’adam, na literal na “ang tao” o, sa kontekstong ito, “ang lalaki.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצֶר
  choice: Hinubog
  rationale: Tuwirang isinasalin ang karaniwang pasalaysay na anyo ng pandiwa. Ang “hinubog” ay likas sa Filipino at nagpapanatili sa larawan ng maingat na pagbuo mula sa lupa.
- source_word: יְהוָה אֱלֹהִים
  choice: Diyos na si Yahweh
  rationale: Pinananatili ang personal na pangalang Yahweh at ang titulong Diyos sa isang malinaw at likas na ayos sa modernong Filipino.
- source_word: מִן הָאֲדָמָה
  choice: mula sa lupa
  rationale: Ang “lupa” ay malinaw na tumutukoy sa ground/soil at pinananatili ang ugnayan nito sa paglikha sa tao sa kalapit na konteksto.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: bawat hayop sa parang
  rationale: Ang “parang” ay kumakatawan sa bukas na lupain o field nang hindi ipinapalagay na mabangis ang lahat ng hayop.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: bawat ibon sa himpapawid
  rationale: Likas na pariralang Filipino para sa mga ibong lumilipad sa kalangitan at angkop sa konteksto.
- source_word: וַיָּבֵא אֶל הָאָדָם
  choice: dinala niya ang mga ito sa lalaki
  rationale: Ginagawang hayag sa Filipino ang ipinahihiwatig na maramihang layon. Ang may pantukoy na הָאָדָם ay pinananatiling karaniwang pangngalang “ang lalaki,” hindi agad ginagawang pangalang Adam.
- source_word: לִרְאוֹת מַה יִּקְרָא לוֹ
  choice: upang makita kung ano ang itatawag nito sa bawat isa
  rationale: Pinananatili ang layuning “upang makita” at ipinahahayag ang distributibong diwa ng isahang panghalip sa pamamagitan ng “sa bawat isa.” Ginamit ang “nito” upang malinaw na tumukoy sa lalaki at maiwasan ang kalituhan sa Diyos bilang pinakamalapit na naunang paksa.
- source_word: נֶפֶשׁ חַיָּה
  choice: nilalang na may buhay
  rationale: Ipinahahayag ang buhay at pagiging nilalang nang hindi ipinapasok ang mga teolohikal na kahulugang maaaring idikit sa salitang “kaluluwa.”
- source_word: הוּא שְׁמוֹ
  choice: iyon ang pangalan nito
  rationale: Tapat sa sugnay na walang hayag na pandiwang “naging”; hindi ipinapalagay kung ang diin ay sa pagiging pangalan o sa pagkakaroon nito ng pangalan.
theological_decisions:
- issue: Ugnayang pamanahon ng וַיִּצֶר sa pagkakasunod ng paglikha
  choice: 'Payak na nagdaang aspekto: “Hinubog”'
  alternative: “Hinubog na” o “nauna nang hinubog”
  rationale: Karaniwang isinusulong ng anyong wayyiqtol ang salaysay at hindi nito tahasang minamarkahan ang pluperfect. Gayunman, maaaring unawain sa konteksto na nauna na ang paghubog; pinananatili sa talababa ang posibilidad na iyon sa halip na tahimik na lutasin ang tensiyon.
- issue: Karaniwang pangngalan o pangalang pantangi ang הָאָדָם
  choice: “ang lalaki”
  alternative: “Adam”
  rationale: Ang anyong may pantukoy ay likas na nangangahulugang “ang tao/lalaki,” at mahalaga sa konteksto ang kaugnayan nito sa אֲדָמָה, “lupa.” Pinananatili sa talababa ang tradisyonal na pagbasa bilang Adam.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling basahin. Ginamit ang “lalaki” sa halip na “tao” upang hindi mapagkamalang sangkatauhan ang tiyak na indibidwal, ngunit iniwasang gawing pangalang pantangi ang ha’adam sa pangunahing teksto. Ang “Diyos na si Yahweh” ay nagpapanatili sa banal na pangalan sa likas na ayos ng Filipino.
