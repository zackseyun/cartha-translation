  yaml_path: translation/ot/genesis/002/024.yaml
  text: Therefore a man shall leave his father and his mother and cling to his wife[b][a], and they shall become one flesh.
translation:
  language: tl
  text: Dahil dito, iiwan ng isang lalaki ang kaniyang ama at ang kaniyang ina, at kakapit siya sa kaniyang asawa[a], at sila ay magiging isang laman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahigpit na manghahawak sa” o “mananatiling nakaugnay sa.” Ang pandiwang Hebreo ay nagpapahiwatig ng matibay na pagdikit o pagkakaugnay.
    reason: lexical_alternative
  - marker: b
    text: Ang “isang laman” ay ekspresyong Hebreo na sumasaklaw sa pisikal na pagsasama at sa pagkabuo ng isang bagong ugnayang pampamilya.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Dahil dito
  rationale: Ipinahahayag nito na ang pangungusap ay kongklusyon o bunga ng naunang salaysay; likas at malinaw ito sa makabagong Filipino.
- source_word: יַעֲזָב
  choice: iiwan
  rationale: Ang anyong Hebreo ay nagpapahayag dito ng pangkalahatan at normatibong simulain, hindi ng tuwirang utos. Hindi ginamit ang “tatalikuran” sapagkat masyado itong nagpapahiwatig ng pagtatakwil.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Pinananatili ang panlalaking isahan ng Hebreo at ang kinatawang gamit nito sa pormulasyon tungkol sa pag-aasawa.
- source_word: אָבִיו ... אִמּוֹ
  choice: ang kaniyang ama at ang kaniyang ina
  rationale: Tahasan at magkahiwalay na binabanggit ng Hebreo ang ama at ina, kaya hindi ito pinaikli bilang “mga magulang.”
- source_word: וְדָבַק
  choice: at kakapit siya
  rationale: Ipinahahayag ng pandiwa ang matibay na pagdikit o pagkakaugnay. Ang “kakapit” ay buhay at madaling maunawaan, habang iniiwasan ang masyadong paliwanag na salin.
- source_word: בְּאִשְׁתּוֹ
  choice: sa kaniyang asawa
  rationale: Sa kontekstong ito, ang אִשָּׁה na may hulaping paari ay tumutukoy sa asawa ng lalaki, hindi lamang sa isang babae.
- source_word: וְהָיוּ
  choice: at sila ay magiging
  rationale: Natural nitong ipinakikita ang pagpasok sa isang bagong kalagayan o bunga, habang pinananatili ang maramihang paksa ng Hebreo.
- source_word: לְבָשָׂר אֶחָד
  choice: isang laman
  rationale: Pinananatili ang matalinghagang pahayag ng Hebreo at ang saklaw nitong pisikal at pampamilyang pagkakaisa nang hindi nililimitahan ang kahulugan.
theological_decisions:
- issue: Panlalaking wikang kumakatawan sa pormulasyon ng pag-aasawa
  choice: isang lalaki
  alternative: isang tao
  rationale: Tahasan ang panlalaking isahan na אִישׁ sa Hebreo; pinananatili ito sa halip na gawing neutral ang kasarian.
- issue: Likas ng pahayag
  choice: 'Pangkalahatan at normatibong simulain sa anyong hinaharap: “iiwan ... kakapit ... magiging”'
  alternative: Tuwirang utos o paglalarawan lamang ng dating kaugalian
  rationale: Ang mga anyong pandiwa ay naglalahad ng pangkalahatang simulain na nakaugat sa salaysay ng paglikha, ngunit hindi mga tahasang pautos.
- issue: Saklaw ng “isang laman”
  choice: Panatilihin ang matalinghagang pahayag
  alternative: Ipaliwanag sa mismong talata bilang seksuwal na pagsasama lamang o bilang legal na tipan lamang
  rationale: May lawak ang ekspresyong Hebreo na sumasaklaw sa pisikal na pag-iisa at sa pagkabuo ng bagong ugnayang pampamilya; hindi dapat paliitin sa iisang aspekto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaniyang” bilang pormal ngunit karaniwang anyo. Pinanatili ang Hebreong larawan sa “kakapit” at “isang laman,” at ipinaliwanag sa mga talababa ang saklaw ng mga ito.
