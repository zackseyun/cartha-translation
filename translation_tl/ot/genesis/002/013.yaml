    issue: Ang “dumadaloy” ay idinagdag sa pagsasalin ng הַסּוֹבֵב.
    rationale: Hindi tahasang sinasabi ng Hebreo ang karaniwang pagdaloy ng ilog; ang pokus ay ang pag-ikot o pagpapalibot nito sa lupain. Ang dagdag ay hindi kailangan at bahagyang nagpapaliit sa saklaw ng pandiwang Hebreo.
  - severity: low
    issue: Wala ang panimulang pang-ugnay na “At.”
    rationale: Maaaring maging natural ang pag-alis nito sa Tagalog, ngunit sa optimal-equivalence na salin, ligtas at natural na panatilihin ang pagpapatuloy ng salaysay na ipinahihiwatig ng וְ.
