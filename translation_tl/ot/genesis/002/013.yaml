  source_fidelity: Kailangang alisin ang idinagdag na pandiwang “dumadaloy.” Bagaman likas na dumadaloy ang ilog, ang Hebreong הַסּוֹבֵב ay inilalarawan lamang ang Gihon bilang pumapalibot/umiikot sa palibot ng lupain. Ang “pumapalibot” ay mas tuwirang katumbas at pinananatili ang topograpikong kalabuan. Isinama rin ang panandang pang-ugnay na “At” upang katawanin ang וְ.
  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “At ang pangalan ng ikalawang ilog ay Gihon. Ito ang pumapalibot sa buong lupain ng Cush.” Malinaw ang pagtukoy ng “Ito” sa naunang ilog.
  terminology: Ang “ilog,” “ikalawa,” “Gihon,” at “Cush” ay angkop. Ang pagpapanatili sa “Cush” sa halip na isang makabagong heograpikong pangalan ay umiiwas sa anakronistikong pagtutumbas.
