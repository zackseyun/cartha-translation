  text: And the name of the second river was Gihon[b][a]; it is the one that goes around all the land of Cush.
translation:
  language: tl
  text: At ang pangalan ng ikalawang ilog ay Gihon. Ito ang pumapalibot sa buong lupain ng Cush.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Cush ay sinaunang pangalan ng isang lugar na karaniwang iniuugnay sa mga rehiyon sa timog ng Ehipto. Maaari ring isalin ang “pumapalibot” bilang “umiikot sa palibot.”
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: Ang pangalan
  rationale: Ipinagpapatuloy ng וְ ang paglalarawan sa mga ilog; hindi na kailangang isalin nang hiwalay bilang “At” dahil natural sa modernong Tagalog ang tuwirang pagpapatuloy.
- source_word: הַ/נָּהָר הַ/שֵּׁנִי
  choice: ng ikalawang ilog
  rationale: Tuwirang ipinapahayag ang pagkakasunod-sunod ng mga ilog; ang “ilog” ang karaniwang katumbas ng נָהָר.
- source_word: גִּיחוֹן
  choice: Gihon
  rationale: Isinalin sa baybay-Latin ang sinaunang pangalang pantangi sa halip na bigyan ito ng kahulugang wala sa teksto.
- source_word: הוּא
  choice: Ito ang ilog
  rationale: Ipinakikita ang mapagkilalang diin ng panghalip at malinaw na inuugnay ang Gihon sa kasunod na paglalarawan.
- source_word: הַ/סּוֹבֵב
  choice: na dumadaloy sa palibot
  rationale: Ang participle mula sa סבב ay maaaring mangahulugang pumalibot o umikot. Idinagdag ang “dumadaloy” bilang likas na paglalarawan sa kilos ng isang ilog, habang pinananatili ng “sa palibot” ang posibleng topograpikong kalabuan.
- source_word: אֵת כָּל אֶרֶץ
  choice: ng buong lupain ng
  rationale: Natural na Tagalog para sa kabuuan ng tinutukoy na lupain o teritoryo.
- source_word: כּוּשׁ
  choice: Cush
  rationale: Pinanatili ang sinaunang pangalan ng lugar; ang pagtutumbas dito sa isang makabagong bansa ay magiging labis na interpretatibo at maaaring anakronistiko.
