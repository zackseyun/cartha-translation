base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/014.yaml
  text: And the name of the third river is Hiddekel[a]; it is the one that goes east of Asshur[b]. And the fourth river is the Euphrates.
translation:
  language: tl
  text: Ang pangalan ng ikatlong ilog ay Hiddekel[a]. Ito ang dumadaloy sa silangan ng Asur[b]. At ang ikaapat na ilog ay ang Eufrates.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hiddekel ay tradisyonal na kinikilala bilang Tigris.
    reason: alternative_reading
  - marker: b
    text: O “sa silangan ng Asiria”; sa Hebreo, “sa silangan ng Asur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם
  choice: pangalan
  rationale: Tuwirang katumbas sa pormulang tumutukoy sa pangalan ng ilog.
- source_word: נָּהָר
  choice: ilog
  rationale: Karaniwan at angkop na katawagan sa malaking daluyan ng tubig sa konteksto.
- source_word: שְּׁלִישִׁי
  choice: ikatlo
  rationale: Likas na salin ng ordinal sa Filipino.
- source_word: חִדֶּקֶל
  choice: Hidekel
  rationale: Transliterasyon ng pangalang Hebreo; hindi isinasama sa pangunahing teksto ang tradisyonal na pagkakakilanlan dito bilang Tigris.
- source_word: הוּא
  choice: Ito ang
  rationale: Likas sa Filipino at pinananatili ang puwersang tumutukoy kung aling ilog ang inilalarawan.
- source_word: הֹלֵךְ
  choice: dumadaloy
  rationale: Bagaman literal na 'pumupunta,' ang 'dumadaloy' ang natural na paglalarawan sa pagtakbo ng isang ilog.
- source_word: קִדְמַת
  choice: sa silangan ng
  rationale: Pinakamalamang na heograpikong kahulugan dito, habang ang ibang posibleng diwa ay hindi kailangang ipasok sa katawan ng talata.
- source_word: אַשּׁוּר
  choice: Asur
  rationale: Pinananatili ang Hebreong pangalang pantangi; maaaring tumukoy sa Asiria, kaya inilalahad iyon sa talababa.
- source_word: רְבִיעִי
  choice: ikaapat
  rationale: Tuwirang salin ng ordinal.
- source_word: פְרָת
  choice: Eufrates
  rationale: Ginagamit ang nakaugaliang modernong pangalan ng ilog sa Filipino para sa malinaw na pagkilala.
