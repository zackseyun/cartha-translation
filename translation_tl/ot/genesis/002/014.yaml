translation_notes:
  register: Modernong Filipino na malinaw, marangal, at natural. Ginamit ang “dumadaloy” sa halip na literal na “pumupunta” dahil iyon ang karaniwang pandiwa para sa ilog. Pinanatili ang mga pangalang Hidekel at Asur upang hindi tahimik na ipasya sa pangunahing teksto ang kanilang heograpikong pagkakakilanlan.
