revisions:
- from: At hinubog ng Diyos na si Yahweh ang tao mula sa alabok ng lupa[a]. Inihip niya sa mga butas ng ilong nito ang hininga ng buhay, at ang tao ay naging isang buhay na nilalang[b].
  to: At hinubog ni Yahweh na Diyos ang tao mula sa alabok ng lupa, at inihip niya sa mga butas ng ilong ng tao ang hininga ng buhay; at ang tao ay naging isang buhay na nilalang[a].
  rationale: The revision retains the draft’s faithful core choices while improving the human referent’s natural Tagalog treatment and replacing the overly interpretive footnote alternative. The unnecessary dust/ground note is removed, and the remaining note is correctly anchored to the expression it explains.
