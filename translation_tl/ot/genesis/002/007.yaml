  text: וַ/יִּיצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים אֶת הָֽ/אָדָ֗ם עָפָר֙ מִן הָ֣/אֲדָמָ֔ה וַ/יִּפַּ֥ח בְּ/אַפָּ֖י/ו נִשְׁמַ֣ת חַיִּ֑ים וַֽ/יְהִ֥י הָֽ/אָדָ֖ם לְ/נֶ֥פֶשׁ חַיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/007.yaml
  text: Then Yahweh God formed the man from the dust of the ground[a], and breathed into his nostrils the breath of life[b], and the man became a living creature.
translation:
  language: tl
  text: At hinubog ni Yahweh na Diyos ang tao mula sa alabok ng lupa, at inihip niya sa mga butas ng ilong ng tao ang hininga ng buhay; at ang tao ay naging isang buhay na nilalang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang nilalang na may buhay”; ayon sa tradisyon, “isang kaluluwang may buhay.”
    reason: Ipinakikita ang malapit na leksikal na alternatibo para sa נֶפֶשׁ חַיָּה at kinikilala ang tradisyonal na salin nang hindi ipinapalagay na ang “kaluluwa” ay hiwalay na sangkap ng tao sa talatang ito.
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Diyos na si Yahweh
  rationale: Pinananatili ang personal na pangalang Yahweh at ang titulong Diyos, habang gumagamit ng likas na ayos sa modernong Filipino.
- source_word: וַיִּיצֶר
  choice: hinubog
  rationale: Ipinahihiwatig ng pandiwa ang kongkreto at maingat na paghubog, gaya ng gawain ng isang magpapalayok.
- source_word: הָאָדָם
  choice: ang tao
  rationale: Tumutukoy ito rito sa indibiduwal na taong hinuhubog. Ang “tao” ay mas tapat sa saklaw ng Hebreo kaysa sa tahasang “lalaki” at hindi paunang nilulutas ang kinatawang diwa ng salita.
- source_word: עָפָר מִן־הָאֲדָמָה
  choice: mula sa alabok ng lupa
  rationale: Pinananatili ang pisikal na larawan ng alabok bilang materyal na mula sa lupa, sa natural na pananalitang Filipino.
- source_word: וַיִּפַּח בְּאַפָּיו
  choice: Inihip niya sa mga butas ng ilong nito
  rationale: Pinananatili ang kongkretong kilos at ang maramihang anyo ng “mga butas ng ilong,” nang hindi ginagawang abstrakto ang larawan.
- source_word: נִשְׁמַת חַיִּים
  choice: ang hininga ng buhay
  rationale: Natural na katumbas ito ng idyomatikong pariralang Hebreo at pinananatili ang ugnayan ng hininga at buhay.
- source_word: וַיְהִי
  choice: naging
  rationale: Malinaw na ipinapahayag ang paglipat tungo sa isang kalagayan.
- source_word: לְנֶפֶשׁ חַיָּה
  choice: isang buhay na nilalang
  rationale: Tumutukoy ang parirala sa buong nilalang na may buhay, hindi lamang sa isang hiwalay at di-materyal na kaluluwa. Sumasaklaw rin ang “nilalang” sa gamit ng kaparehong parirala para sa mga hayop.
theological_decisions:
- issue: Ang kahulugan ng הָאָדָם at ang kasarian ng tinutukoy
  choice: ang tao
  alternative: ang lalaki; ang sangkatauhan
  rationale: Isang indibiduwal ang tinutukoy sa salaysay, ngunit hindi kailangang dagdagan ng salin ang tahasang salitang “lalaki.” Pinananatili ng “tao” ang mas malawak na saklaw ng אָדָם at ang posibleng kinatawang diwa nito.
- issue: Ang kahulugan ng לְנֶפֶשׁ חַיָּה
  choice: isang buhay na nilalang
  alternative: isang buhay na persona; isang buhay na kaluluwa
  rationale: Inilalarawan ng Hebreo ang tao bilang isang buháy at humihingang kabuuan. Hindi nito tahasang itinuturo rito na ang נֶפֶשׁ ay isang hiwalay na di-materyal na sangkap, kaya hindi iyon ipinapasok sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nito” para sa taong kababanggit pa lamang at upang maiwasan ang di-likas na pag-uulit. Ang “Diyos na si Yahweh” ay natural na Filipino na nagpapanatili sa banal na pangalan.
