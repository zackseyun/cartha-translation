translation:
  language: tl
  text: At ang tadyang na kinuha ng PANGINOONG Diyos mula sa lalaki ay ginawa niyang isang babae, at dinala niya siya sa lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “tadyang” ay maaari ring mangahulugang “tagiliran” o bahagi ng tagiliran; ang pandiwang isinaling “ginawa” ay literal na “itinayo” o “binuo.”
    reason: Pinananatili ang leksikal na lawak ng צֵלָע at ang kapansin-pansing larawang ginamit ng וַיִּבֶן nang hindi ginagawang di-natural ang pangunahing teksto.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: ginawa
  rationale: Literal itong ‘itinayo/binuo,’ ngunit sa makabagong Tagalog, ang ‘ginawa ... isang babae’ ay natural at malinaw habang ipinahihiwatig pa rin ang malikhaing paghubog ng Diyos.
- source_word: יְהוָה אֱלֹהִים
  choice: PANGINOONG Diyos
  rationale: Sinusunod ang kinagawiang salin ng banal na pangalan bilang PANGINOON, na ikinakabit nang natural sa ‘Diyos.’
- source_word: הַצֵּלָע
  choice: tadyang
  rationale: Ang salita ay maaaring tumukoy sa ‘tagiliran’ o isang bahagi nito; sa kontekstong ito, ‘tadyang’ ang tradisyonal at malinaw na pagbasa.
- source_word: הָאָדָם
  choice: lalaki
  rationale: Sa talatang ito, ang tao ay inihaharap bilang katapat ng babaeng nilikha mula sa kanya, kaya natural ang ‘lalaki.’
- source_word: וַיְבִאֶהָ
  choice: dinala niya ito
  rationale: Pinananatili ang tuwirang kilos ng Diyos na pagdadala sa babae sa lalaki; ang ‘ito’ ay tumutukoy sa babae nang hindi inuulit nang mabigat ang pangngalan.
theological_decisions:
- issue: Larawang ‘itinayo’ ang babae
  choice: ginawa niyang isang babae
  alternative: binuo niya bilang isang babae / itinayo niya bilang isang babae
  rationale: Hindi ginawang teknikal o doktrinal ang talinghaga. Ang pangunahing diwa ay hinubog ng Diyos ang kinuha sa lalaki upang maging babae; nililinaw sa talababa ang mas literal na larawan.
- issue: Saklaw ng צֵלָע
  choice: tadyang
  alternative: tagiliran / bahagi ng tagiliran
  rationale: Pinananatili ang karaniwang pagkakilala sa salaysay ngunit kinikilala sa talababa ang tunay na leksikal na lawak ng salitang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘PANGINOONG Diyos’ bilang likas na anyong Tagalog ng pamagat at ‘dinala niya ito’ upang maiwasan ang malabong panghalip habang nananatiling maikli ang talata.
