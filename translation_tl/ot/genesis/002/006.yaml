translation:
  language: tl
  text: Ngunit may singaw na umaahon mula sa lupa at dumidilig sa buong ibabaw ng lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “batis” o “agos ng tubig.” Bihira ang salitang Hebreo at maaaring tumukoy sa tubig na bumubukal mula sa lupa sa halip na singaw sa hangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵד
  choice: Ngunit may singaw
  rationale: Bihira at pinagtatalunan ang אֵד. Ang “singaw” ay angkop sa kilos na pag-ahon mula sa lupa, habang ipinapahiwatig ng “ngunit” ang kaibahan sa naunang pahayag na wala pang ulan.
- source_word: יַעֲלֶה
  choice: na umaahon
  rationale: Ang Qal imperfect ng עלה ay nagsasaad ng pag-akyat o pag-ahon. Ang aspektong nagaganap o nakagawian sa paglalarawan ay likas na naipapahayag ng “umaahon.”
- source_word: מִן הָ/אָ֑רֶץ
  choice: mula sa lupain
  rationale: Maaaring mangahulugan ang אֶרֶץ ng lupa o lupain. Ginamit ang “lupain” upang mapanatili ang pagkakaiba nito sa אֲדָמָה sa hulihan ng talata.
- source_word: וְ/הִשְׁקָה
  choice: at dinidilig
  rationale: Ang Hiphil ng שקה ay nangangahulugang magbigay ng tubig o diligin. Ang “dinidilig” ay natural at nagpapanatili sa nagpapatuloy o nakagawiang kilos.
- source_word: אֶת כָּל פְּנֵי
  choice: ang buong ibabaw ng
  rationale: Ang idyomang Hebreo ay tumutukoy sa kabuuang nakalantad na ibabaw; malinaw at natural itong naipahahayag sa Filipino bilang “ang buong ibabaw ng.”
- source_word: הָֽ/אֲדָמָֽה
  choice: lupa
  rationale: Ang אֲדָמָה ay karaniwang tumutukoy sa lupa o lupang maaaring tamnan. Pinananatili ng “lupa” ang kaibahan nito sa mas malawak na אֶרֶץ, na isinaling “lupain.”
theological_decisions:
- issue: Kahulugan ng אֵד
  choice: singaw
  alternative: batis o agos ng tubig
  rationale: Ang “singaw” ang tuwirang umaangkop sa pandiwang nagsasaad ng pag-ahon. Gayunman, dahil bihira at hindi tiyak ang salitang Hebreo, pinanatili sa talababa ang posibilidad na tumutukoy ito sa tubig na bumubukal o umaagos mula sa ilalim ng lupa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang aspektong nagaganap sa “umaahon” at “dinidilig” upang ipakita ang nagpatuloy o nakagawiang kilos sa salaysay. Ang “lupain” at “lupa” ay sadyang pinag-iba upang katawanin ang magkaibang salitang Hebreo na אֶרֶץ at אֲדָמָה.
