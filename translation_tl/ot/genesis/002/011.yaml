base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/011.yaml
  text: The name of the first is Pishon; it is the one that goes around all the land of Havilah[a], where there is gold.
translation:
  language: tl
  text: Pison ang pangalan ng una; ito ang pumapalibot sa buong lupain ng Havila[a], kung saan may ginto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dumadaloy sa palibot ng buong lupain ng Havila.” Ang participle na הַסֹּבֵב ay maaaring mangahulugang “pumapalibot,” “umiikot sa palibot,” o, dahil ilog ang tinutukoy, “dumadaloy sa palibot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם הָאֶחָד
  choice: ang pangalan ng unang ilog
  rationale: Sa talaan ng apat na ilog, ang הָאֶחָד ay ginagamit sa ordinal na diwang “una.” Idinagdag ang “ilog” mula sa malinaw na konteksto upang maging likas at malinaw sa Filipino.
- source_word: פִּישׁוֹן
  choice: Pison
  rationale: Isinalin sa karaniwang anyong Filipino ang pangalan ng ilog.
- source_word: הַסֹּבֵב
  choice: dumadaloy sa palibot
  rationale: Ang pandiwang סבב ay nangangahulugang umikot o pumalibot. Dahil ilog ang tinutukoy, likas sa Filipino ang “dumadaloy sa palibot,” habang inilalagay sa talababa ang mas tuwirang alternatibo.
- source_word: אֵת כָּל אֶרֶץ הַחֲוִילָה
  choice: sa buong lupain ng Havila
  rationale: Pinananatili ng “buong lupain” ang saklaw ng כָּל at ang teritoryal na diwa ng אֶרֶץ; ang Havila ay pangalang-pook.
- source_word: אֲשֶׁר שָׁם הַזָּהָב
  choice: kung saan may ginto
  rationale: Likas na ipinahahayag sa Filipino ang lokatibong sugnay at ang pag-iral ng ginto nang hindi kinakailangang tumbasan ang pantukoy ng Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong Filipino ng mga pangalang Pison at Havila; iniwasan ang labis na teknikal o makalumang pananalita.
