base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/011.yaml
  text: From that land Asshur went out and built Nineveh[a], Rehoboth-Ir, and Calah.
translation:
  language: tl
  text: Mula sa lupaing iyon ay umalis si Asur[a] at itinayo niya ang Nineve, Rehobot-Ir, at Calah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Mula sa lupaing iyon ay nagtungo siya sa Asiria at itinayo ang Nineve, Rehobot-Ir, at Calah.” Sa pagbasa ring ito, si Nimrod mula sa naunang talata ang simuno, at ang אַשּׁוּר ay tumutukoy sa rehiyong Asiria sa halip na sa taong si Asur.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הָאָרֶץ הַהִוא
  choice: Mula sa lupaing iyon
  rationale: Ipinapahayag ng מִן ang pinagmulan, at tumutukoy rito ang אֶרֶץ sa isang nasasakupang lupain, hindi lamang sa lupa o lupaing sakahan.
- source_word: יָצָא
  choice: umalis
  rationale: Karaniwang nangangahulugan ang יצא na lumabas o umalis. Ang “umalis” ay natural sa Filipino at malinaw na naghahayag ng paggalaw mula sa naunang binanggit na lupain.
- source_word: אַשּׁוּר
  choice: Asur
  rationale: Maaaring pangalan ng taong si Asur o pangalan ng rehiyong Asiria ang salitang Hebreo. Pinanatili sa pangunahing teksto ang pagbasa rito bilang tahasang simuno ng pandiwa; inilagay sa talababa ang tunay na posibleng pagbasa bilang rehiyon.
- source_word: וַיִּבֶן
  choice: itinayo niya
  rationale: Ang בנה ay karaniwang nangangahulugang “magtayo.” Nilinaw ng “niya” na ang gumawa ay ang simuno ng naunang pandiwa nang hindi binabago ang diwa.
- source_word: נִינְוֵה
  choice: Ninive
  rationale: Ito ang natural at nakaugaliang anyo ng pangalan ng lunsod sa Filipino.
- source_word: רְחֹבֹת עִיר
  choice: Rehobot-Ir
  rationale: Pinakamalamang na pangalan ito ng isang lugar dahil kabilang ito sa talaan ng mga lunsod at bawat pangalan ay pinangungunahan ng panandang אֶת. Iniiwasan nitong ipilit ang mas literal ngunit hindi gaanong malamang na “malalawak na dako ng lunsod.”
- source_word: כָּלַח
  choice: Cala
  rationale: Ginamit ang malinaw na transliterasyong angkop sa baybay ng Filipino.
theological_decisions:
- issue: Ang simuno at tinutukoy ng אַשּׁוּר
  choice: 'Si Asur ang simuno: “umalis si Asur.”'
  alternative: “Mula sa lupaing iyon ay nagtungo siya sa Asiria,” kung si Nimrod mula sa naunang talata ang ipinagpapalagay na simuno at ang אַשּׁוּר ay tumutukoy sa rehiyon.
  rationale: Pinahihintulutan ng tekstong Hebreo ang dalawang pagbasa. Likas na mababasa ang אַשּׁוּר bilang tahasang simuno pagkatapos ng pandiwa, ngunit maaari rin itong unawaing patutunguhang Asiria habang ipinagpapatuloy ang simunong si Nimrod mula sa naunang talata. Pinanatili sa talababa ang tunay na kalabuan sa halip na tahimik na lutasin ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “lupain” para sa heograpikong diwa, “umalis” sa halip na mas makalumang “yumaon,” at mga anyong pangalang madaling bigkasin sa Filipino. Inilagay ang pananda ng talababa pagkatapos ng “Asur,” kung saan pinakamalinaw na makikita ang leksikal at sintaktikong kalabuan.
