id: GEN.10.13
reference: Genesis 10:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מִצְרַ֡יִם יָלַ֞ד אֶת לוּדִ֧ים וְ/אֶת עֲנָמִ֛ים וְ/אֶת לְהָבִ֖ים וְ/אֶת נַפְתֻּחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/013.yaml
  text: And Mizraim fathered the Ludim[a], the Anamim, the Lehabim[b], and the Naphtuhim.
translation:
  language: tl
  text: Naging ama[a] si Mizraim ng mga Ludim, mga Anamim, mga Lehabim, at mga Naphtuhim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagkaanak” o “naging ninuno.” Ang pandiwang Hebreo ay karaniwang terminong ginagamit sa mga talaangkanan para sa pagkakaroon ng mga inapo.
    reason: lexical_alternative
  - marker: b
    text: Ang mga pangalang ito ay mga transliteradong pangalan ng mga pangkat ng tao; hindi sila isinalin bilang mga lugar o itinumbas sa mga pagkakakilanlang etniko noong bandang huli.
    reason: cultural_note
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Mizraim
  rationale: Ginamit bilang pangalang pantangi ng ninunong kumakatawan sa isang bayan sa talaangkanan; hindi ito isinaling “Ehipto” upang mapanatili ang tungkulin nito rito bilang pangalan.
- source_word: יָלַד
  choice: naging ama
  rationale: Sa kontekstong talaangkanan, tumutukoy ang pandiwa sa pagiging ama o pinagmulan ng mga inapo. Likas at marangal sa modernong Tagalog ang “naging ama,” at hindi nito nililinaw nang lampas sa ipinahihiwatig ng Hebreo kung tuwiran o mas malawak na angkan ang tinutukoy.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tuwirang layon sa Hebreo at walang hiwalay na katumbas na kailangan sa Tagalog.
- source_word: לוּדִים
  choice: mga Ludim
  rationale: Tinumbasan bilang transliteradong pangalan ng pangkat ng mga tao, sa halip na ipilit ang isang di-tiyak na pagkakakilanlang etniko o heograpiko.
- source_word: עֲנָמִים
  choice: mga Anamim
  rationale: Pinanatili bilang transliteradong pangalan ng pangkat; idinagdag ang “mga” upang maging malinaw at natural sa Tagalog na isang bayan o pangkat ang tinutukoy.
- source_word: לְהָבִים
  choice: mga Lehabim
  rationale: Malapit na transliterasyon ng anyong Hebreo; iniwasan ang mga posibleng pagkakakilanlan na hindi tiyak.
- source_word: נַפְתֻּחִים
  choice: mga Naphtuhim
  rationale: Pinanatili ang anyo bilang transliteradong pangalan ng pangkat sa talaangkanan.
- source_word: וְ
  choice: at
  rationale: Karaniwang pangatnig sa Tagalog para sa huling bahagi ng magkakaugnay na talaan.
theological_decisions:
- issue: Kung ang יָלַד ay tumutukoy sa tuwirang pagiging ama o sa mas malawak na pinagmulan ng mga bayan
  choice: naging ama
  alternative: naging ninuno o pinagmulan
  rationale: Pinananatili ng “naging ama” ang karaniwang talinghagang pang-talaangkanan at ang tensiyon ng teksto, nang hindi tahasang ginagawang lugar lamang o malayong angkan ang mga nakatalang pangkat.
translation_notes:
  register: Gumamit ng kasalukuyan, malinaw, at marangal na Tagalog. Ang “mga” bago sa bawat transliteradong etnonimo ay tumutulong sa ordinaryong mambabasa na maunawaang mga pangkat ng tao ang tinutukoy, kahit ang hulaping Hebreong -im ay maramihan na.
