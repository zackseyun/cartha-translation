  text: בְּנֵ֥י שֵׁ֖ם עֵילָ֣ם וְ/אַשּׁ֑וּר וְ/אַרְפַּכְשַׁ֖ד וְ/ל֥וּד וַֽ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/022.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud[b], and Aram.'
translation:
  language: tl
  text: Ang mga anak ni Sem ay sina Elam, Ashur, Arpakshad[a], Lud, at Aram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Arpakshad”; ang tradisyonal na anyong “Arfaxad” ay naimpluwensiyahan ng Griyego.
    reason: lexical_alternative
  - marker: b
    text: Ang mga pangalang “Ashur” at “Aram” ay madalas iugnay sa mga lupain o mga bayang nakilala kalaunan bilang Asiria at Siria.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Tuwirang inililipat ang construct plural ng בֵּן at pinananatili ang balangkas ng talaangkanan, sa halip na palawakin ito bilang “mga inapo.”
- source_word: שֵׁם
  choice: Sem
  rationale: Karaniwang anyo ng pangalang Shem sa Filipino at malinaw sa mga modernong mambabasa.
- source_word: עֵילָם
  choice: Elam
  rationale: Transliterasyon ng pangalang Hebreo na angkop sa talaangkanan.
- source_word: אַשּׁוּר
  choice: Ashur
  rationale: Pinananatili ang pangalan sa Hebreo sa halip na isalin bilang Asiria, sapagkat mga pangalan sa talaangkanan ang inililista rito.
- source_word: אַרְפַּכְשַׁד
  choice: Arpakshad
  rationale: Malapit na transliterasyon ng mga katinig at bigkas ng Hebreo; hindi ginamit ang tradisyonal na anyong Arfaxad na naimpluwensiyahan ng Griyego.
- source_word: לוּד
  choice: Lud
  rationale: Tuwirang transliterasyon ng isahang pangalang Hebreo; hindi ito pinalitan ng ibang anyong gaya ng Ludim.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang pangalang Hebreo sa halip na ang mas huling heograpikong katawagang Siria.
