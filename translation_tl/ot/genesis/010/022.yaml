  register: Gumamit ng payak ngunit marangal na modernong Filipino. Ang hulma na “Ang mga anak ni Sem ay sina…” ay natural para sa listahan ng mga pangalan, habang pinananatili ang tuwirang genealogical na pahayag ng Hebreo.
