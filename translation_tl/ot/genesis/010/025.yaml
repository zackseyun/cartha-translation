  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָֽ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/025.yaml
  text: 'And to Eber two sons were born: the name of the one was Peleg[a], for in his days the earth was divided, and his brother''s name was Joktan.'
translation:
  language: tl
  text: At ipinanganak kay Eber ang dalawang anak na lalaki. Peleg[a] ang pangalan ng isa, sapagkat noong panahon niya ay nahati ang lupa; at Joktan ang pangalan ng kapatid niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nahati ang lupain.” Ang salitang Hebreo ay maaaring mangahulugang “lupa” o “lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֵבֶר יֻלַּד שְׁנֵי בָנִים
  choice: At ipinanganak kay Eber ang dalawang anak na lalaki
  rationale: Pinananatili nito ang pasibong anyo ng Hebreo at malinaw na isinasalin ang שְׁנֵי בָנִים bilang dalawang anak na lalaki.
- source_word: שֵׁם הָאֶחָד
  choice: Peleg ang pangalan ng isa
  rationale: Tumpak nitong pinananatili ang pagtukoy sa 'isa,' sa halip na ipakahulugang siya ang una.
- source_word: פֶּלֶג
  choice: Peleg
  rationale: Karaniwang transliterasyon ng pangalang Hebreo; napapanatili rin ang ugnayang tunog nito sa pandiwang nangangahulugang paghahati.
- source_word: כִּי בְיָמָיו
  choice: sapagkat noong panahon niya
  rationale: Likas na modernong Tagalog para sa paliwanag sa pangalan at sa idyomang temporal na 'sa mga araw niya.'
- source_word: נִפְלְגָה הָאָרֶץ
  choice: nahati ang lupa
  rationale: Ang נִפְלְגָה ay pasibong 'nahati,' samantalang ang הָאָרֶץ ay maaaring tumukoy sa lupa/daigdig o sa isang lupain. Ang 'lupa' ay maikli at likas ngunit nananatiling may saklaw na kailangang linawin sa talababa.
- source_word: וְשֵׁם אָחִיו יָקְטָן
  choice: at Joktan ang pangalan ng kapatid niya
  rationale: Likas na ayos sa Tagalog na tapat sa Hebreong pagtukoy kay Joktan bilang kapatid ni Peleg.
theological_decisions:
- issue: Saklaw ng הָאָרֶץ sa paliwanag sa pangalan ni Peleg
  choice: ang lupa
  alternative: ang lupain; ang daigdig
  rationale: Maaaring mangahulugan ang אֶרֶץ ng buong lupa/daigdig o ng isang partikular na lupain. Hindi tiyak na nilulutas ng talata ang saklaw, kaya pinananatili sa talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang 'ipinanganak kay Eber' upang mapanatili ang pasibong hulma ng Hebreo, at iniwasang gawing 'panganay' ang 'isa' dahil hindi iyon tahasang sinasabi ng teksto.
