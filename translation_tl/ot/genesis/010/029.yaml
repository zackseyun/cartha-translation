  text: Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: tl
  text: si Ofir, si Havila, at si Jobab. Lahat ng mga ito ay mga anak na lalaki ni Joktan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga inapo ni Joktan.” Sa mga talaangkanan, ang Hebreong pananalitang “mga anak na lalaki ni” ay kung minsan ay may mas malawak na kahulugan, ngunit dito ay pinakamalamang na tumutukoy ito sa mga pinangalanang anak na lalaki na kababanggit lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: si …, si …, at si …
  rationale: Ang אֵת ay pananda ng tuwirang layon at hindi isinasalin nang hiwalay sa Tagalog. Ginamit ang personal marker na “si” sa bawat pangalan at “at” bago ang huling pangalan upang mapanatili ang ayos ng talaan.
- source_word: אוֹפִר
  choice: Ofir
  rationale: Pangngalang pantangi; isina-Tagalog ang transliterasyon ayon sa karaniwang bigkas at baybay.
- source_word: חֲוִילָה
  choice: Havila
  rationale: Pangngalang pantangi; ginamit ang natural na transliterasyong Tagalog.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Pangngalang pantangi; pinanatili ang nakikilalang anyo habang umaayon sa baybay-Tagalog.
- source_word: כָּל אֵלֶּה
  choice: Lahat ng mga ito
  rationale: Tuwiran at natural na buod sa modernong Tagalog para sa lahat ng pangalang kababanggit lamang.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Bagaman maaaring mas malawak ang kahulugan ng salitang Hebreo sa ilang talaangkanan, sa agarang konteksto ay pinakamalamang na tumutukoy ito sa mga lalaking anak na nakalista.
- source_word: יָקְטָן
  choice: Joktan
  rationale: Pangngalang pantangi; pinanatili ang nakikilalang tradisyonal na anyo sa Tagalog.
theological_decisions:
- issue: Saklaw ng בְּנֵי sa talaangkanan
  choice: mga anak ni Joktan
  alternative: mga inapo ni Joktan
  rationale: Pinananatili ng “mga anak” ang pangunahing leksikal na kahulugan at pinakaangkop ito sa agarang listahan, habang inilalahad sa talababa ang tunay na posibilidad ng mas malawak na genealogical na gamit.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “si” sa bawat personal na pangalan para sa likas na daloy, at pinanatili ang maikli at panggenealohiyang anyo ng talata.
