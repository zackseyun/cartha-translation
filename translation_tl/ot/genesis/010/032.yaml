  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵ֣לֶּה מִשְׁפְּחֹ֧ת בְּנֵי נֹ֛חַ לְ/תוֹלְדֹתָ֖/ם בְּ/גוֹיֵ/הֶ֑ם וּ/מֵ/אֵ֜לֶּה נִפְרְד֧וּ הַ/גּוֹיִ֛ם בָּ/אָ֖רֶץ אַחַ֥ר הַ/מַּבּֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/032.yaml
  text: These are the families of the sons of Noah[a], according to their generations, by their nations[c][b]; and from these the nations were separated on the earth after the flood.
translation:
  language: tl
  text: Ito ang mga angkan ng mga anak ni Noe, ayon sa kanilang mga salinlahi, sa kani-kanilang mga bansa. Mula sa kanila ay nagkahiwa-hiwalay ang mga bansa sa lupa pagkatapos ng baha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Tumutukoy ito sa mga pangkat na magkakamag-anak sa talaangkanan. Mas angkop dito ang “angkan” kaysa sa mas makitid na “pamilya.”
- source_word: לְתוֹלְדֹתָם
  choice: ayon sa kanilang mga salinlahi
  rationale: Pinananatili ng “mga salinlahi” ang genealogical na diwa ng תּוֹלְדוֹת nang hindi ito nililimitahan lamang sa nakasulat na talaangkanan o sa mga inapo.
- source_word: בְּגוֹיֵהֶם
  choice: sa kani-kanilang mga bansa
  rationale: Ipinahihiwatig ng parirala ang pagkakaayos ng mga angkan ayon sa mga bansang kinabibilangan nila; natural sa Tagalog ang “kani-kanilang” upang ipakita ang distributibong ugnayan.
- source_word: וּמֵאֵלֶּה
  choice: Mula sa kanila
  rationale: Direktang ipinapahayag ang pinagmulan ng mga bansang tinutukoy, habang ang bagong pangungusap ay mas natural sa modernong Tagalog.
- source_word: נִפְרְדוּ
  choice: nagkahiwa-hiwalay
  rationale: Ang Niphal ng פרד ay nagpapahayag ng paghihiwalay o pagkakabukod. Pinananatili ng “nagkahiwa-hiwalay” ang posibleng kusang/resultang diwa nang tahasang magtakda ng gumagawa.
- source_word: הַגּוֹיִם
  choice: ang mga bansa
  rationale: Sa konteksto ng Genesis 10, tumutukoy ito sa magkakaibang pangkat-bayan na nagmula sa mga anak ni Noe; “mga bansa” ang malinaw at karaniwang katumbas.
- source_word: בָּאָרֶץ
  choice: sa lupa
  rationale: Ang “lupa” ay likas na salin ng אֶרֶץ at maaari rito na tumukoy sa buong daigdig bilang tirahan ng sangkatauhan, nang hindi labis na ipinapasok ang terminong “mundo.”
- source_word: אַחַר הַמַּבּוּל
  choice: pagkatapos ng baha
  rationale: Direkta at natural na salin ng temporal na parirala na tumutukoy sa malaking baha sa naunang salaysay.
theological_decisions:
- issue: Saklaw ng אֶרֶץ sa buod ng pagkalat pagkatapos ng baha
  choice: “sa lupa,” na sa konteksto ay may malawak na saklaw
  alternative: “sa lupain,” na maaaring magpahiwatig ng isang lokal na teritoryo
  rationale: Ang kabanata ay nagbubuod sa mga bansang nagmula sa mga anak ni Noe. Pinananatili ng “sa lupa” ang malawak na saklaw ng salaysay nang hindi ginagawang mas tiyak kaysa sa Hebreo.
- issue: Ahensiya at paraan ng paghihiwalay sa נִפְרְדוּ
  choice: “nagkahiwa-hiwalay,” nang walang tahasang tinukoy na ahente
  alternative: “pinaghiwa-hiwalay” o “kumalat”
  rationale: Hindi tahasang pinapangalanan ng anyong Hebreo ang gumagawa. Iniiwasan ng salin na magdagdag ng ahente o gawing simpleng pagkalat lamang ang ideya ng pagkakahiwalay.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “angkan,” “salinlahi,” at “kani-kanilang mga bansa” upang maipakita ang genealogical at distributibong ayos ng Hebreo nang hindi nagiging teknikal o alanganin.
