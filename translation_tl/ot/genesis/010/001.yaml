  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת בְּנֵי נֹ֔חַ שֵׁ֖ם חָ֣ם וָ/יָ֑פֶת וַ/יִּוָּלְד֥וּ לָ/הֶ֛ם בָּנִ֖ים אַחַ֥ר הַ/מַּבּֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/001.yaml
  text: 'These are the generations of the sons of Noah: Shem[a], Ham, and Japheth. And sons were born to them after the flood.'
translation:
  language: tl
  text: 'Ito ang mga salinlahi[a] ng mga anak ni Noe: sina Sem, Ham, at Jafet. At ipinanganak sa kanila ang mga anak na lalaki pagkatapos ng baha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “salaysay tungkol sa lahi” o “mga inapo.” Ang salitang Hebreo ay maaaring tumukoy nang malawakan sa linya ng angkan o sa nagmula sa isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Ipinakikilala nito ang isang bagong seksiyon. Hindi na kailangang gawing tahasang “Ngayon” ang pang-ugnay na ו sapagkat wala itong temporal na kahulugan dito.
- source_word: תּוֹלְדֹת
  choice: mga salinlahi
  rationale: Pinananatili nito ang pormulang paulit-ulit na nagbabalangkas sa Genesis at maaari itong tumukoy sa linya ng angkan o sa mga nagmula sa isang tao. Nilagyan ng talababa upang ipakita ang mas malawak na saklaw nito.
- source_word: בְּנֵי נֹחַ
  choice: mga anak ni Noe
  rationale: Likas at tuwirang salin ng construct phrase; malinaw sa kasunod na mga pangalan na mga anak na lalaki ang tinutukoy.
- source_word: שֵׁם חָם וָיָפֶת
  choice: Sem, Ham, at Jafet
  rationale: Ginamit ang mga anyong pangalan na likas at matagal nang makikilala sa Filipino habang malapit sa mga pangalang Hebreo.
- source_word: וַיִּוָּלְדוּ לָהֶם
  choice: At ipinanganak sa kanila
  rationale: Pinananatili ang pang-ugnay at ang pasibo/intransitibong diwa ng Nifal ng ילד, sa halip na gawing aktibong “nagkaanak” o “nagkaanak sila.”
- source_word: בָּנִים
  choice: mga anak na lalaki
  rationale: Tahasang pinananatili ang panlalaking kahulugan ng salitang Hebreo sa kontekstong talaangkanan.
- source_word: אַחַר הַמַּבּוּל
  choice: pagkatapos ng baha
  rationale: Malinaw at karaniwang Filipino para sa panahong kasunod ng malaking baha sa Genesis.
theological_decisions:
- issue: Pagpapakahulugan sa pormulang תּוֹלְדֹת sa Genesis
  choice: mga salinlahi
  alternative: salaysay tungkol sa lahi; mga inapo
  rationale: Ang “mga salinlahi” ay nagpapanatili sa pormang pampanitikan at sa ugnayan nito sa talaangkanan nang hindi lubusang nililimitahan ang kahulugan sa listahan lamang ng mga inapo.
- issue: Kasariang ipinahahayag ng בָּנִים
  choice: mga anak na lalaki
  alternative: mga anak
  rationale: Panlalaki ang salitang Hebreo, at ang kasunod na talaangkanan ay nakatuon sa mga lalaking inapo; kaya hindi ito ginawang neutral sa kasarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormulang pantalaangkanan at ang pasibong anyo ng kapanganakan, habang gumamit ng mga pangalang karaniwang makikilala ng mambabasang Filipino.
