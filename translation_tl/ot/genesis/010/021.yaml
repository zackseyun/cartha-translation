base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/021.yaml
  text: And to Shem also[a], the father of all the sons of Eber, the brother of Japheth the elder, children were born.
translation:
  language: tl
  text: Nagkaroon din ng mga anak si Sem, ang ama ng lahat ng anak ni Eber at ang nakatatandang kapatid ni Jafet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “kapatid ng nakatatandang Jafet.” Maaaring tumukoy kay Sem o kay Jafet ang salitang Hebreo na isinaling “nakatatanda.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁם ... גַּם הוּא
  choice: Nagkaroon din ... si Sem
  rationale: Ipinahahayag ng parirala na nagkaroon din si Sem ng mga supling. Inayos ang ayos ng mga salita ayon sa likas na daloy ng modernong Tagalog habang pinananatili ang diwang pandagdag ng גַּם.
- source_word: יֻלַּד
  choice: Nagkaroon ... ng mga anak
  rationale: Ang pasibong pandiwa ay isang idyomang pang-talaan ng angkan na nagpapakilalang may mga supling na ipinanganak sa isang tao. Mas natural sa Tagalog ang “nagkaroon ng mga anak” kaysa sa literal na pasibong anyo.
- source_word: אֲבִי כָּל־בְּנֵי־עֵבֶר
  choice: ang ama ng lahat ng anak ni Eber
  rationale: Pinanatili ang tuwirang katawagang “ama” at ang pormal na “mga anak ni Eber,” sa halip na ipakahulugan agad bilang “ninuno” o “mga Hebreo.”
- source_word: אֲחִי יֶפֶת
  choice: kapatid ni Jafet
  rationale: Tuwirang isinasalin ang ugnayang pampamilya na ipinahahayag ng pariralang Hebreo.
- source_word: הַגָּדוֹל
  choice: nakatatandang
  rationale: Sa konteksto ng magkakapatid, tumutukoy ito nang natural sa edad o pagiging panganay, hindi sa kadakilaan. Ikinabit ito kay Sem sa pangunahing teksto, ngunit inilagay sa talababa ang posibleng pagkakabit kay Jafet.
theological_decisions:
- issue: Kung kanino nakakabit ang הַגָּדוֹל—kay Sem o kay Jafet
  choice: 'Kay Sem: “ang nakatatandang kapatid ni Jafet”'
  alternative: 'Kay Jafet: “kapatid ng nakatatandang si Jafet”'
  rationale: Pinahihintulutan ng balangkas ng Hebreo ang dalawang pagbasa. Pinili sa pangunahing teksto ang isang likas na pagbasa ngunit hindi inalis ang tunay na kalabuan; ang isa pang posibilidad ay malinaw na pinanatili sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang karaniwang baybay na Sem, Eber, at Jafet. Pinanatili ang wikang pampamilya ng tekstong Hebreo at iniwasang gawing “mga Hebreo” ang “mga anak ni Eber.”
