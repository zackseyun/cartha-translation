translation_notes:
  register: Makabago at marangal na Filipino, na may payak na ayos ng pangungusap at mga pangalang isina-Filipino ang baybay. Pinanatili ang “pasimula” upang hindi gawing tiyak ang maaaring diwa bilang kabisera o pangunahing lungsod.
