lexical_decisions:
- source_word: וַתְּהִי
  choice: ay
  rationale: Sa sugnay na ito, ang anyo ng היה ay nagsisilbing payak na pang-ugnay sa paglalarawan ng nasasakupan ni Nimrod; natural itong ipinahahayag sa Tagalog sa hulma na “Ang … ay …”
- source_word: רֵאשִׁית
  choice: Ang pasimula ng
  rationale: Maaaring tumukoy ang salita sa pasimula, unang bahagi, o pangunahing bahagi. Pinananatili ng “pasimula” ang diwa ng unang sentro o saklaw ng kaharian nang hindi ito ipinapalagay na kabisera.
- source_word: מַמְלַכְתּוֹ
  choice: kanyang kaharian
  rationale: Bagaman maaari ring mangahulugang paghahari o maharlikang nasasakupan, ang “kaharian” ang malinaw at likas na tawag dahil mga lungsod ang nakatala.
- source_word: בָּבֶל
  choice: Babel
  rationale: Tinutumbasan ito bilang pangalang pantangi ayon sa anyong Hebreo at napapanatili ang ugnayang pampanitikan sa Genesis 11.
- source_word: אֶרֶךְ
  choice: Erek
  rationale: Isinalin sa baybay na madaling basahin sa Filipino mula sa pangalang Hebreo; karaniwang kinikilala ang lungsod bilang sinaunang Uruk.
- source_word: אַכַּד
  choice: Akad
  rationale: Isinalin ang pangalang pantangi sa payak na baybay-Filipino na malapit sa anyong Hebreo at sa makasaysayang Akkad.
- source_word: כַלְנֵה
  choice: Kalne
  rationale: Sinusundan ang anyo ng Masoretic Text sa Genesis 10:10, sa halip na ipalit ang kaugnay na pangalang Kalno na lumilitaw sa ibang teksto.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: sa lupain ng Sinar
  rationale: Pinananatili ng “lupain” ang heograpikong katawagang אֶרֶץ, at ang Sinar ay inililipat sa natural na baybay-Filipino.
