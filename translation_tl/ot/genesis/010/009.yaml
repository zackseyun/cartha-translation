  text: הֽוּא הָיָ֥ה גִבֹּֽר צַ֖יִד לִ/פְנֵ֣י יְהוָ֑ה עַל כֵּן֙ יֵֽאָמַ֔ר כְּ/נִמְרֹ֛ד גִּבּ֥וֹר צַ֖יִד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/009.yaml
  text: He was a mighty hunter before Yahweh; therefore it is said[a], “Like Nimrod, a mighty hunter before Yahweh.”
translation:
  language: tl
  text: Siya ay isang makapangyarihang mangangaso sa harap ni Yahweh. Kaya sinasabi[a], “Gaya ni Nimrod, isang makapangyarihang mangangaso sa harap ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O posibleng, “bilang pagsalungat kay Yahweh,” kung ang parirala ay uunawain sa mapanlabang diwa batay sa mas malawak na konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: גִבֹּר צַיִד
  choice: makapangyarihang mangangaso
  rationale: Pinagsamang idyoma ito para sa isang taong pambihira ang lakas o husay sa pangangaso; natural at marangal sa modernong Tagalog ang “makapangyarihang mangangaso.”
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Pinananatili nito ang pangunahing kahulugang “sa harap” o “sa presensya ng” nang hindi ipinapasya kung positibo, neutral, o mapanlabang diwa ang nasa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Natural na panandang Tagalog ito para sa resultang nagpapakilala sa kasabihang sumunod.
- source_word: יֵאָמַר
  choice: sinasabi
  rationale: Ipinahahayag nito ang di-tiyak na tagaganap ng Niphal bilang isang pangkalahatan o kawikaang kasabihan.
- source_word: כְּנִמְרֹד
  choice: Gaya ni Nimrod
  rationale: Malinaw at likas na ipinahahayag ng “gaya ni” ang paghahambing na minamarkahan ng כְּ.
theological_decisions:
- issue: Diwa ng לִפְנֵי יְהוָה kaugnay ni Nimrod
  choice: sa harap ni Yahweh
  alternative: bilang pagsalungat kay Yahweh
  rationale: Ang karaniwang kahulugan ng parirala ay “sa harap” o “sa presensya ng.” Posible ang mapanlabang pagbasa ayon sa mas malawak na konteksto, kaya hindi ito ipinasok sa pangunahing teksto kundi inilagay sa talababa upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang bahagyang pormal na himig ng kawikaang pahayag at ang pag-uulit ng parirala sa Hebreo.
