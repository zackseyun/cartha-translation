  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְֽ/אֶת רֶ֔סֶן בֵּ֥ין נִֽינְוֵ֖ה וּ/בֵ֣ין כָּ֑לַח הִ֖וא הָ/עִ֥יר הַ/גְּדֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/012.yaml
  text: and Resen[a], between Nineveh and Calah[b]; that is the great city.
translation:
  language: tl
  text: at ang Resen, sa pagitan ng Nineve at Calah[a]; iyon ang malaking lungsod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kalhu,” ayon sa Asiriong anyo ng pangalan ng lugar na karaniwang tinatawag na “Calah.”
    reason: lexical_alternative
  - marker: b
    text: Ang mga salitang “iyon ang malaking lungsod” ay maaaring tumukoy sa Resen mismo o sa mas malawak na sonang urban sa pagitan ng Nineve at Calah.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: at ang
  rationale: Ipinagpapatuloy ng וְ ang talaan ng mga lungsod, samantalang ang אֵת ay pananda ng tiyak na layon; likas na naipahahayag ang dalawang tungkulin sa Tagalog sa pamamagitan ng “at ang.”
- source_word: רֶסֶן
  choice: Resen
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng transliterasyon.
- source_word: בֵּין ... וּבֵין
  choice: sa pagitan ng ... at
  rationale: Ito ang karaniwang likas na katumbas sa Tagalog ng Hebreong tambalang pariralang nagsasaad ng kinalalagyan sa pagitan ng dalawang lugar.
- source_word: נִינְוֵה
  choice: Nineve
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng lungsod.
- source_word: כָּלַח
  choice: Calah
  rationale: Pinanatili ang anyong malapit sa Hebreong pangalan; inilagay sa talababa ang Asiriong anyong “Kalhu.”
- source_word: הִוא
  choice: iyon ang
  rationale: Ang pambabaeng panghalip na isahan ay gumaganap bilang panumbalik o pang-ugnay sa paliwanag. Ang “iyon ang” ay natural sa Tagalog at hindi tahasang nagpapasya kung ano ang tinutukoy nito.
- source_word: הָעִיר
  choice: lungsod
  rationale: Tuwirang katumbas ng tiyak na pangngalang “ang lungsod”; ang katiyakan ay naipapahayag na ng “ang” sa pariralang “iyon ang malaking lungsod.”
- source_word: הַגְּדֹלָה
  choice: malaking
  rationale: Maaaring mangahulugan ang גָּדוֹל ng malaki o dakila. Sa paglalarawan ng isang lungsod, malinaw at likas ang “malaking,” nang hindi nagdaragdag ng tiyak na pagpapakahulugang tungkol sa dangal o katanyagan.
theological_decisions:
- issue: Tinutukoy ng “iyon ang malaking lungsod”
  choice: Pinanatiling hindi tiyak kung ang tinutukoy ay ang Resen lamang o ang mas malawak na sonang urban sa pagitan ng Nineve at Calah.
  alternative: Maaaring tahasang gawing “Ang Resen ang malaking lungsod” o ipaliwanag na ang buong kalipunan ng mga lungsod ang tinutukoy.
  rationale: Hindi ganap na nilulutas ng sintaks ng Hebreo ang tinutukoy ng pangwakas na sugnay. Pinananatili ng “iyon ang malaking lungsod” ang tunay na kalabuan ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling ayos ng talaan at ang pormal na tuldok-kuwit ng pinakahuling rebisyon. Inilagay ang unang pananda ng talababa pagkatapos ng “Calah,” sapagkat ang tala ay tungkol sa alternatibong anyo ng pangalang iyon.
