  yaml_path: translation/ot/genesis/010/023.yaml
  text: 'The sons of Aram: Uz[a], Hul, Gether, and Mash.'
translation:
  language: tl
  text: Ang mga anak ni Aram ay sina Uz, Hul, Geter, at Mas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa tekstong Hebreo rito, Mas; sa 1 Cronica 1:17, Mesec.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Ang mga anak ni
  rationale: Ang construct plural na בְנֵי ay tuwirang isinaling “mga anak ni,” ang likas at karaniwang pormula sa talaangkanan. Hindi na hiwalay na isinalin ang prefixed conjunction na וּ dahil nagsisimula rito ang isang bagong sugnay sa listahan.
- source_word: אֲרָם
  choice: Aram
  rationale: Pangngalang pantangi; pinanatili sa transliterasyong karaniwang ginagamit sa Filipino.
- source_word: עוּץ
  choice: Uz
  rationale: Transliterasyon ng pangalang Hebreo na עוּץ, ayon sa karaniwang anyo sa mga saling Filipino.
- source_word: חוּל
  choice: Hul
  rationale: Tuwirang transliterasyon ng pangalang Hebreo na חוּל.
- source_word: גֶתֶר
  choice: Geter
  rationale: Transliterasyong angkop sa baybay at pagbigkas sa Filipino ng pangalang Hebreo na גֶתֶר.
- source_word: מַשׁ
  choice: Mas
  rationale: Ang tekstong Masoretiko sa talatang ito ay מַשׁ; ang “Mas” ang likas na transliterasyon sa Filipino. Hindi ipinalit sa pangunahing teksto ang ibang anyo sa 1 Cronica 1:17.
theological_decisions: []
translation_notes:
  register: Maikli at marangal na modernong Filipino, na pinananatili ang pormula ng talaangkanan. Ginamit ang “sina” bago ang listahan ng mga pangalan upang maging natural ang gramatika sa Filipino. Inilagay ang talababa pagkatapos ng “Mas,” ang pangalang mismong may kaugnayan sa pagkakaiba ng teksto.
