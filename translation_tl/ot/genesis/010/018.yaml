  text: and the Arvadites[a], the Zemarites, and the Hamathites. Afterward the clans of the Canaanites were scattered.
translation:
  language: tl
  text: at ang mga Arvadita, Zemarita, at Hamatita. At pagkatapos, nagkahiwa-hiwalay ang mga angkan ng mga Cananeo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, pang-isahan ang katawagang “ang Cananeo,” ngunit kolektibo itong tumutukoy sa pangkat ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְוָדִי
  choice: mga Arvadita
  rationale: Isang pang-isahang katawagang etniko na kolektibo ang gamit sa Hebreo; natural sa Filipino ang maramihang anyo para sa pangkat ng mga tao.
- source_word: הַצְּמָרִי
  choice: mga Semarita
  rationale: Kolektibong katawagang etniko ito sa talaan ng mga bayan; ang maramihang anyo ang malinaw at natural sa Filipino.
- source_word: הַחֲמָתִי
  choice: mga Hamatita
  rationale: Isinalin bilang pangalan ng isang pangkat ng mga tao, kaayon ng iba pang katawagang etniko sa talata.
- source_word: וְאַחַר
  choice: Pagkatapos
  rationale: Malinaw nitong ipinahihiwatig ang sumunod na pangyayari nang hindi kailangang ulitin ang pang-ugnay sa simula ng bagong pangungusap.
- source_word: נָפֹצוּ
  choice: nagkahiwa-hiwalay
  rationale: Ipinahihiwatig ng anyong Niphal ang pagkalat o pagkakawatak-watak ng mga angkan; pinananatili ng salin ang resultang dispersal nang hindi nagdaragdag ng tahasang gumagawa nito.
- source_word: מִשְׁפְּחוֹת
  choice: mga angkan
  rationale: Sa kontekstong heneyalohikal at etnograpiko, tumutukoy ito sa mas malalaking pangkat na magkakamag-anak, hindi lamang sa nukleyar na mga pamilya.
- source_word: הַכְּנַעֲנִי
  choice: mga Cananeo
  rationale: Bagaman pang-isahan ang anyo sa Hebreo, kolektibo itong tumutukoy sa buong pangkat ng mga Cananeo; mas malinaw sa Filipino ang maramihang anyo.
