  source_fidelity: Tumpak na naihahatid ng draft ang pinagmulan (מֵאֵלֶּה), pagkakahiwalay (נִפְרְדוּ), heograpikong pariralang אִיֵּי הַגּוֹיִם, at ang sunod-sunod na pag-uuri ayon sa lupain, wika, angkan, at bansa. Gayunman, ang “baybaying lupain” ay bahagyang mabigat at maaaring magmukhang inuulit lamang ang kasunod na “sa kani-kanilang lupain.” Ang “baybaying rehiyon” ay mas likas habang pinananatili ang saklaw ng Hebreo.
  naturalness: Makabago at marangal ang rehistro. Ang maliit na pagpapakinis sa “mga baybaying rehiyon” at pag-uugnay sa huling dalawang parirala ay nagpapalinaw sa daloy nang hindi nagdaragdag ng kahulugan.
  terminology: Ang “angkan” para sa מִשְׁפָּחָה at “bansa” para sa גּוֹי ay angkop. Pinanatili ang “wika” para sa לָשׁוֹן. Ang tala tungkol sa “mga pulo” ay mahalagang panatilihin dahil saklaw ito ng אִיִּים.
  issues:
