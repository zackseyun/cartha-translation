    issue: Medyo mabigat at paulit-ulit ang “mga baybaying lupain ... sa kani-kanilang lupain.”
    rationale: Bagaman literal na maipagtatanggol, mas natural sa Filipino ang “mga baybaying rehiyon,” at malinaw pa ring naipapakita ang magkaibang gamit ng אִיִּים at אֲרָצוֹת.
  - severity: low
    issue: Hindi ganap na magkakatugma ang alternatibong tala sa pangunahing salin.
    rationale: Ang alternatibong “kumalat ang mga mamamayan” ay isang posibleng metonimikong pagbasa, ngunit ang pangunahing pandiwa ay mas tuwirang “nagkahiwa-hiwalay.” Mainam na ihayag ito bilang alternatibong pag-unawa, hindi bilang kapalit na salin na tila mas tiyak.
