revisions:
- from: Mula sa mga ito, nagkahiwa-hiwalay ang mga baybaying lupain[a] ng mga bansa[b] sa kani-kanilang lupain—bawat isa ayon sa sariling wika, ayon sa kani-kanilang angkan, sa kani-kanilang bansa.
  to: Mula sa mga ito ay nagkahiwa-hiwalay ang mga baybaying rehiyon[a] ng mga bansa[b] sa kani-kanilang lupain—bawat isa ayon sa sariling wika, ayon sa kani-kanilang angkan at bansa.
  rationale: Pinalitan ang “baybaying lupain” ng “baybaying rehiyon” upang maging higit na likas ang Filipino at maiwasan ang malapit na pag-uulit sa “sa kani-kanilang lupain.” Pinagsama ang pangwakas na “angkan at bansa” para sa mas maayos na daloy, habang pinananatili ang lahat ng kategoryang nasa Hebreo at ang hindi tiyak na metonimikong saklaw ng paksa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:53:14Z'
