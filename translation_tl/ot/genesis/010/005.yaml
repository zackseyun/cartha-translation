base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/005.yaml
  text: From these the coastlands of the nations were separated in their lands[a], each according to his language, by their clans[c][b], in their nations.
translation:
  language: tl
  text: Mula sa mga ito ay nagkahiwa-hiwalay ang mga baybaying rehiyon[a] ng mga bansa[b] sa kani-kanilang lupain—bawat isa ayon sa sariling wika, ayon sa kani-kanilang angkan at bansa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pulo.” Ang salitang Hebreo ay maaaring tumukoy sa mga pulo o sa mga baybaying lupain at rehiyon.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring unawain na tumutukoy ito sa mga mamamayan ng mga baybaying rehiyon: “Mula sa mga ito ay nagkahiwa-hiwalay ang mga mamamayan ng mga baybaying rehiyon.” Maaaring gamitin ang katawagan sa mga lupain bilang pantukoy sa mga taong naninirahan doon.'
    reason: translation_ambiguity
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: Mula sa mga ito
  rationale: Ipinahahayag ng מִן kasama ng demonstratibong אֵלֶּה ang pinagmulan ng mga pangkat o lupaing kasunod na tinutukoy.
- source_word: נִפְרְדוּ
  choice: nagkahiwa-hiwalay
  rationale: Ang Niphal ng פרד ay nagsasaad ng pagkakahiwalay o pagkakabukod. Pinananatili ng anyong ito ang di-tahasang tinig ng Hebreo nang hindi ipinapalagay kung sino ang naghati.
- source_word: אִיֵּי הַגּוֹיִם
  choice: mga baybaying lupain ng mga bansa
  rationale: Ang אִיִּים ay maaaring tumukoy sa mga pulo o, sa mas malawak na diwa, sa mga baybaying rehiyon. Ang salin ay nagpapanatili rin sa ugnayang construct ng parirala.
- source_word: בְּאַרְצֹתָם
  choice: sa kani-kanilang lupain
  rationale: Ang אֶרֶץ ay tumutukoy rito sa mga lupaing tinitirhan o nasasakupan; ipinakikita ng 'kani-kanilang' ang distributibong diwa ng hulaping maramihan.
- source_word: אִישׁ לִלְשֹׁנוֹ
  choice: bawat isa ayon sa sariling wika
  rationale: Ang אִישׁ ay distributibo rito, at ang לָשׁוֹן ay nangangahulugang wika sa konteksto ng pag-uuri ng mga bayan.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa talaangkanan at kontekstong pantribo, ang מִשְׁפָּחָה ay mas malawak kaysa makabagong sambahayan at angkop na isaling 'angkan.'
- source_word: בְּגוֹיֵהֶם
  choice: sa kani-kanilang bansa
  rationale: Pinananatili nito ang pangwakas na pag-uuri ayon sa mga bansa o grupong bayan at ang preposisyong בְּ.
theological_decisions:
- issue: Kung lupain o mga taong naninirahan doon ang tuwirang paksa
  choice: Pinanatiling tuwirang paksa ang 'mga baybaying lupain ng mga bansa.'
  alternative: Mula sa mga ito ay kumalat ang mga mamamayan ng mga baybaying lupain.
  rationale: Gramatikal na paksa ng Hebreo ang אִיֵּי הַגּוֹיִם, bagaman maaaring metonimikong tumukoy iyon sa mga mamamayan ng mga rehiyong iyon. Hindi tahasang nilutas sa pangunahing teksto ang tensiyong ito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'kani-kanilang' upang natural na maipahayag ang paulit-ulit na distributibong diwa ng Hebreo, habang pinanatili ang heograpikong larawan at ang posibleng metonimiya ng orihinal.
