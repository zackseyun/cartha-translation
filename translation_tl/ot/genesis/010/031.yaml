id: GEN.10.31
reference: Genesis 10:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵ֣לֶּה בְנֵי שֵׁ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לִ/לְשֹׁנֹתָ֑/ם בְּ/אַרְצֹתָ֖/ם לְ/גוֹיֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/031.yaml
  text: These are the sons of Shem[a], by their clans, by their languages, in their lands, by their nations.
translation:
  language: tl
  text: Ito ang mga anak ni Sem, ayon sa kanilang mga angkan, ayon sa kanilang mga wika, sa kanilang mga lupain, at ayon sa kanilang mga bansa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang mga parirala bilang “batay sa kanilang mga angkan … batay sa kanilang mga wika … batay sa kanilang mga bansa.” Sa Hebreo, inuulit ang mga pang-ukol upang ipakita ang pag-uuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na panimula sa modernong Tagalog para sa Hebreong deiktikong buod; hindi nangangailangan ng tahasang pandiwang katumbas ng “are.”
- source_word: בְנֵי שֵׁם
  choice: mga anak ni Sem
  rationale: Pinananatili ang pormal na wikang pangkanunuan ng Hebreo at ang balangkas nitong nakatuon sa linyang panlalaki, sa halip na palawakin agad bilang “mga inapo.” Ginamit ang karaniwang anyong Tagalog na “Sem” para sa pangalan.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Sa kontekstong pantribo at pangkanunuan, ang מִשְׁפָּחָה ay tumutukoy sa angkan. Ipinahahayag ng “ayon sa” ang gamit ng לְ bilang tanda ng pag-uuri.
- source_word: לִלְשֹׁנֹתָם
  choice: ayon sa kanilang mga wika
  rationale: Bagaman maaaring literal na “mga dila,” malinaw na mga wikang sinasalita ang tinutukoy rito. Ang “wika” ang likas at kasalukuyang katawagan.
- source_word: בְּאַרְצֹתָם
  choice: sa kanilang mga lupain
  rationale: Pinananatili ng “sa” ang lokatibong בְּ. Ang “mga lupain” ay hindi nagpapahiwatig ng makabagong estadong politikal gaya ng maaaring gawin ng “mga bansa.”
- source_word: לְגוֹיֵהֶם
  choice: ayon sa kanilang mga bansa
  rationale: Ang גּוֹי ay tumutukoy sa mga bayan o bansa. Ang “ayon sa” ay nagpapatuloy sa Hebreong hulma ng pag-uuri, samantalang ang “mga bansa” ay malinaw sa ordinaryong mambabasa sa konteksto ng talaan ng mga bansa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Pinanatili ang maindayog na pag-uulit ng “ayon sa kanilang mga” upang maipakita ang pormulang Hebreo, habang ginamit ang payak na “sa kanilang mga lupain” para sa naiibang lokatibong pang-ukol.
