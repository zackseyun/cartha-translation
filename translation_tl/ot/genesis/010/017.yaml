  text: and the Hivites[a], the Arkites, and the Sinites.
translation:
  language: tl
  text: at ang mga Hivita[a], ang mga Arkita, at ang mga Sinita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang angkan ng Hivita, ang angkan ng Arkita, at ang angkan ng Sinita.” Gumagamit ang Hebreo ng mga pang-etnikong katawagan sa anyong isahan na may pantukoy, ngunit kolektibong tumutukoy sa mga bayan o angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: at ang
  rationale: Sa talaangkanang listahan, ang וְ ay nag-uugnay ng kasunod na pangkat, samantalang ang אֶת ay pananda ng tuwirang layon na walang hiwalay na katumbas sa Tagalog.
- source_word: הַחִוִּי
  choice: mga Hivita
  rationale: Isang pang-etnikong katawagan na nasa anyong isahan sa Hebreo ngunit kolektibong tumutukoy sa isang bayan o angkan; likas sa Tagalog ang paggamit ng “mga” para rito.
- source_word: הָעַרְקִי
  choice: mga Arkita
  rationale: Pang-etnikong katawagan para sa mga taong kaugnay ng Arka; pinananatili ng “Arkita” ang katangian nitong pangalang pantangi at ang anyo ng magkakasunod na katawagan sa listahan.
- source_word: הַסִּינִי
  choice: mga Sinita
  rationale: Pang-etnikong katawagan sa isang pangkat na Cananeo; ang “mga Sinita” ay malinaw at natural na kolektibong anyo sa modernong Tagalog.
