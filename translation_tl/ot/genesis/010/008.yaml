id: GEN.10.8
reference: Genesis 10:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְרֹ֑ד ה֣וּא הֵחֵ֔ל לִֽ/הְי֥וֹת גִּבֹּ֖ר בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/008.yaml
  text: And Cush fathered Nimrod[d][c][b][a]; he began to be a mighty man on the earth.
translation:
  language: tl
  text: At si Cush ay naging ama ni Nimrod; siya ay nagsimulang maging isang makapangyarihang tao[a] sa lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “makapangyarihang tao” ay maaari ring isaling “makapangyarihan,” “bayani,” o “mandirigma.”
    reason: lexical_alternative
  - marker: b
    text: O “sa lupain.” Ang salitang Hebreo ay maaaring tumukoy sa lupa o sa isang lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכּוּשׁ
  choice: At si Cush
  rationale: Ang וְ ay payak na pang-ugnay na nagpapatuloy sa talaangkanan; pinanatili ang pangalang Cush ayon sa karaniwang anyong ginagamit sa Bibliyang Tagalog.
- source_word: יָלַד
  choice: naging anak ni Cush si
  rationale: Sa talaangkanan, tumutukoy ang יָלַד sa pagiging ama o pag-aanak. Ang hulmaing “naging anak ni Cush si Nimrod” ay natural sa modernong Tagalog at malinaw na nagpapanatili sa ugnayang genealogical.
- source_word: נִמְרֹד
  choice: Nimrod
  rationale: Pangalang pantangi; ginamit ang nakagawiang transliterasyon sa Tagalog.
- source_word: הוּא
  choice: siya
  rationale: Ang malayang panghalip ay muling tumutukoy kay Nimrod at bahagyang nagbibigay-diin; sapat itong naipahahayag ng “siya.”
- source_word: הֵחֵל לִהְיוֹת
  choice: nagsimulang maging
  rationale: Direktang pinananatili nito ang aspektong pasimula ng pariralang Hebreo nang hindi idinaragdag ang interpretasyong siya ang unang naging gayon.
- source_word: גִּבֹּר
  choice: isang makapangyarihang tao
  rationale: 'Malawak ang saklaw ng גִּבּוֹר: maaaring malakas o makapangyarihang tao, bayani, o mandirigma. Hindi ito agad nililimitahan sa kahulugang militar.'
- source_word: בָּאָרֶץ
  choice: sa lupa
  rationale: Maaaring mangahulugan ang אֶרֶץ ng buong lupa o ng isang lupain. Ang “sa lupa” ay natural at pinananatili ang posibleng mas malawak na saklaw sa konteksto ng mga bansa.
theological_decisions:
- issue: Saklaw ng אֶרֶץ
  choice: lupa
  alternative: lupain
  rationale: Sa konteksto ng talaan ng mga bansa, malamang na malawak ang saklaw, ngunit pinananatili sa talababa ang tunay na posibilidad ng panrehiyong “lupain.”
- issue: Diwa ng הֵחֵל לִהְיוֹת
  choice: nagsimulang maging
  alternative: siya ang unang naging
  rationale: Ang Hebreo ay tahasang nagsasaad ng pagsisimula. Ang “siya ang unang naging” ay maaaring magdagdag ng di-tiyak na ideya ng kronolohikal na pangunguna.
- issue: Saklaw ng גִּבֹּר
  choice: makapangyarihang tao
  alternative: bayani o mandirigma
  rationale: Hindi tiyak sa talatang ito kung pisikal, panlipunan, o militar ang diin; pinananatili ng pangunahing salin ang lawak ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang natural na hulmaing genealogical at iniwasan ang arkaikong “ipinanganak ni Cush si Nimrod,” na maaaring magpahiwatig na si Cush mismo ang nanganak. Inilagay ang mga talababa pagkatapos ng kaugnay na pangungusap.
