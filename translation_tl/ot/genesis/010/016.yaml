  text: at ang mga Jebuseo[a], at ang mga Amoreo, at ang mga Girgaseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga katawagang etniko sa Hebreo ay nasa anyong pang-isahan (“ang Jebuseo,” “ang Amoreo,” “ang Girgaseo”), ngunit kolektibo ang gamit ng mga ito rito para sa mga sambayanan; kaya pangmaramihan ang ginamit sa salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: ang mga Jebuseo
  rationale: Ang anyong Hebreo ay pang-isahang katawagang-etniko, ngunit kolektibo ang gamit nito sa talaangkanan ng Genesis 10. Likas sa modernong Tagalog ang maramihang anyo para sa isang pangkat ng mga tao.
- source_word: הָאֱמֹרִי
  choice: ang mga Amoreo
  rationale: Bagaman pang-isahan ang anyong Hebreo, tumutukoy ito nang kolektibo sa isang pangkat ng mga tao; malinaw at natural itong ipinahahayag sa Tagalog sa pamamagitan ng “mga.”
- source_word: הַגִּרְגָּשִׁי
  choice: ang mga Gergeseo
  rationale: Kolektibo ang gamit ng pang-isahang katawagang-etniko. Ginamit ang “mga Gergeseo” bilang natural na pangmaramihang katawagan sa sambayanan.
- source_word: וְאֶת / וְאֵת
  choice: at / walang hiwalay na salin
  rationale: Isinalin ang וְ bilang “at” kung kailangan sa daloy ng listahan; hindi hiwalay na isinalin ang pananda ng tuwirang layon na אֵת. Sa gitnang aytem, sapat ang kuwit ayon sa natural na ayos ng listahan sa Tagalog.
