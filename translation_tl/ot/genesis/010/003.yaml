  source_fidelity: 'Tumpak ang salin sa Hebreo: napanatili ang pang-ugnay na וּ bilang “At,” ang ugnayang talaangkanan sa “mga anak ni Gomer,” at ang tatlong pangngalang pantangi. Ang “Rifat” ay angkop na Filipino transliterasyon ng רִיפַת, at ang “Togarma” ay wastong kumakatawan sa pangwakas na patinig ng תֹגַרְמָה.'
