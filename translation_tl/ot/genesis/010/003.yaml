  text: 'And the sons of Gomer: Ashkenaz[a], Riphath, and Togarmah.'
translation:
  language: tl
  text: At ang mga anak ni Gomer ay sina Ashkenaz[a], Rifat, at Togarma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa 1 Cronica 1:6, “Difat” ang mababasa sa halip na “Rifat.”
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Ang בְּנֵי ay construct plural ng בֵּן at tumutukoy sa mga anak na lalaki sa talaangkanan. Likas sa modernong Filipino ang hulma na “ang mga anak ni,” habang pinananatili ng “At” ang pang-ugnay na וּ.
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Pangngalang pantangi; tinumbasan sa baybay na madaling basahin sa Filipino nang hindi isinasalin ang kahulugan.
- source_word: אַשְׁכֲּנַז
  choice: Ashkenaz
  rationale: Pangngalang pantangi; pinanatili ang nakikilalang transliterasyon.
- source_word: וְ/רִיפַת
  choice: Rifat
  rationale: Ang WLC/Masoretic Text ay may רִיפַת. Ginamit ang “Rifat,” na angkop sa ponolohiya at pagbabaybay ng Filipino; ang ibang anyo sa 1 Cronica 1:6 ay inilagay sa talababa.
- source_word: וְ/תֹגַרְמָה
  choice: Togarma
  rationale: Pangngalang pantangi; ang “Togarma” ay tuwirang transliterasyon na natural basahin sa Filipino.
