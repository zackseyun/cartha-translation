  text: And Canaan fathered Sidon his firstborn[a], and Heth.
translation:
  language: tl
  text: At si Canaan ay naging ama ni Sidon, ang kanyang panganay, at ni Het[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Si Het ang ninunong iniuugnay sa mga Heteo sa nakapaligid na talaangkanan.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: At si Canaan
  rationale: Isinalin ang pang-ugnay na ו bilang “At” upang mapanatili ang daloy ng talaangkanan; pinanatili ang karaniwang anyo ng pangalang Canaan.
- source_word: יָלַד
  choice: ang naging ama ni
  rationale: Sa konteksto ng talaangkanan, tumutukoy ito sa pagiging ama o pagkakaroon ng anak. Ang “naging ama ni” ay likas at marangal sa makabagong Tagalog, nang hindi gumagamit ng makalumang pananalita.
- source_word: אֶת
  choice: '[hindi isinalin]'
  rationale: Walang tuwirang katumbas sa Tagalog ang pananda ng tiyak na layon sa Hebreo.
- source_word: צִידֹן
  choice: Sidon
  rationale: Isinalin ang pangalang pantangi ayon sa karaniwang anyo nito sa Tagalog.
- source_word: בְּכֹר/וֹ
  choice: na kanyang panganay
  rationale: Tuwirang ipinahahayag ng pangngalan at hulaping panghalip na si Sidon ang panganay ni Canaan.
- source_word: וְ/אֶת
  choice: at ni
  rationale: Ang pang-ugnay ay isinaling “at,” samantalang ang panandang Hebreo sa layon ay likas na naipapakita ng “ni” sa kayariang Tagalog.
- source_word: חֵת
  choice: Het
  rationale: Pinanatili bilang pangalang pantangi lamang, gaya ng Hebreo; hindi idinagdag sa pangunahing teksto ang kaugnayan niya sa mga Heteo.
