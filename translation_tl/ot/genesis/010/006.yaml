  text: 'And the sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: tl
  text: At ang mga anak ni Ham ay sina Kus, Mizraim[a], Put[b], at Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Mizraim” ang anyong Hebreo na karaniwang tumutukoy rin sa Ehipto. Dito, sa talaangkanan, ginamit ito bilang pangalan ng isang ninuno.
    reason: alternative_reading
  - marker: b
    text: Ang “Put” ay tradisyonal ding isinusulat na “Phut” sa ilang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Pinanatili ng “At” ang daloy ng talaangkanan. Ang literal na “mga anak ni” ay natural sa Tagalog at hindi nilalabnaw tungo sa mas malawak na “mga inapo ni,” bagaman maaaring kumatawan ang mga pangalan sa mga ninuno ng mga bayan.
- source_word: חָם
  choice: Ham
  rationale: Karaniwang transliterasyon ng pangalang Hebreo sa mga saling Filipino.
- source_word: כּוּשׁ
  choice: Kus
  rationale: Direktang transliterasyon na gumagamit ng makabagong baybay-Filipino at malinaw na kumakatawan sa tunog ng Hebreong כּוּשׁ.
- source_word: וּ/מִצְרַיִם
  choice: Mizraim[a]
  rationale: Itinuring na pangalang personal o pangninuno sa konteksto ng talaangkanan, sa halip na isalin lamang bilang “Ehipto.” Nilagyan ng talababa upang mapanatili ang kaugnayan nito sa pangalan ng lupain at bayan.
- source_word: וּ/פוּט
  choice: Put[b]
  rationale: Malapit na transliterasyon ng Hebreong פּוּט; itinala sa talababa ang tradisyonal na alternatibong anyo.
- source_word: וּ/כְנָעַן
  choice: at Canaan
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan at pinanatili ang pang-ugnay sa huling pangalan sa talaan.
theological_decisions: []
translation_notes:
  register: Payak ngunit marangal na modernong Tagalog. Ginamit ang “sina” upang natural na ipakilala ang serye ng mga pangalang pantangi. Pinili ang baybay na “Kus” para sa malinaw na pagbigkas sa Filipino, habang pinanatili ang mga nakaugaliang anyong Ham, Mizraim, Put, at Canaan.
