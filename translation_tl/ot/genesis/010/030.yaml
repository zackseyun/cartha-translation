  text: And their settlement was from Mesha as you go toward Sephar[a], the hill country of the east.
translation:
  language: tl
  text: Ang kanilang tirahan ay mula sa Mesha, patungo sa Sefar[a], sa kabundukan ng silangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang kanilang tirahan ay mula sa Mesha sa pagpunta sa Sefar, ang bundok sa silangan.”
    reason: Pinananatili ng alternatibo ang mas literal na direksiyonal na diwa ng בֹּאֲכָה at ang isahang “bundok” para sa הַר; maaaring iugnay ang huling parirala sa Sefar.
lexical_decisions:
- source_word: וַיְהִי
  choice: ay
  rationale: Inihahayag ng וַיְהִי ang kalagayan ng saklaw ng kanilang tirahan; natural itong naipapahayag sa Tagalog sa panaguring may “ay” nang hindi dinaragdagan ng di-tiyak na ideyang “umabot.”
- source_word: מוֹשָׁבָם
  choice: ang kanilang tirahan
  rationale: Ang מוֹשָׁב ay tumutukoy sa lugar o rehiyong tinitirhan; malinaw at likas sa modernong Tagalog ang “tirahan” sa heograpikong paglalarawang ito.
- source_word: מִמֵּשָׁא
  choice: mula sa Mesa
  rationale: Pangalan ito ng lugar; isinatagalog ang transliterasyon bilang “Mesa,” at pinananatili ang pang-ukol na “mula sa.”
- source_word: בֹּאֲכָה
  choice: hanggang sa
  rationale: Ang pormulang heograpiko mula sa בוא ay nagpapahiwatig ng direksiyon ng paglapit o pagpunta sa isang lugar. Sa konteksto ng saklaw na nagsisimula sa מִן, natural itong isinasalin na “hanggang sa,” habang inilalagay sa talababa ang mas tahasang alternatibong direksiyonal.
- source_word: סְפָרָה
  choice: Sefar
  rationale: Pangalan ito ng lugar; ang hulaping direksiyonal na ה ay naipahahayag na ng pariralang “hanggang sa.”
- source_word: הַר
  choice: kabundukan
  rationale: Sa paglalarawang heograpiko, maaaring tumukoy ang הַר hindi lamang sa isang bundok kundi sa bulubunduking rehiyon. Ang “kabundukan” ay likas at hindi labis na tiyak.
- source_word: הַקֶּדֶם
  choice: sa silangan
  rationale: Tumutukoy ang קֶדֶם sa silangan o silangang rehiyon; ang “sa silangan” ay malinaw at natural na lokatibong paglalarawan.
