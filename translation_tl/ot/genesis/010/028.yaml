  text: at Obal[a], at Abimael, at Sheba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit ang “at” at ang pananda ng tiyak na layon bago sa bawat pangalan: “at [pananda ng layon] Obal, at [pananda ng layon] Abimael, at [pananda ng layon] Sheba.” Walang tuwirang katumbas sa Tagalog ang panandang ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: at / si
  rationale: Ang וְ ay pang-ugnay na “at,” samantalang ang אֶת ay pananda ng tiyak na layon. Walang eksaktong katumbas nito sa Tagalog; sa talaan ng mga pangalan, likas na ginagamit ang “si” upang markahan ang bawat pangalang pantao, habang ang “at” ay inilalagay ayon sa karaniwang ayos ng serye sa Tagalog.
- source_word: עוֹבָל
  choice: Obal
  rationale: Pangalang pantangi; itinumbas sa baybay na “Obal,” na malapit sa anyong Hebreo at karaniwang gamit sa mga saling Filipino.
- source_word: אֲבִימָאֵל
  choice: Abimael
  rationale: Pangalang pantangi; tinumbasan sa transkripsiyong “Abimael” at hindi isinalin ang posibleng kahulugan ng mga sangkap ng pangalan.
- source_word: שְׁבָא
  choice: Sheba
  rationale: Pangalang pantangi; ginamit ang kinikilalang anyong “Sheba” para sa שְׁבָא sa kontekstong ito, hindi “Seba,” na maaaring tumukoy sa ibang baybay at pangalan sa Hebreo.
