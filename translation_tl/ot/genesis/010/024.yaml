  text: Arpachshad fathered Shelah[a], and Shelah fathered Eber.
translation:
  language: tl
  text: Si Arpakshad ay naging ama ni Shelah[a], at si Shelah ay naging ama ni Eber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang tradisyonal na salin, mababasa ang “Arfaxad” at “Sala,” mga anyong naiimpluwensiyahan ng Griego. Sinusunod dito ang mga anyong Hebreo na “Arpakshad” at “Shelah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: Arpaksad
  rationale: Isina-Tagalog ang transliterasyon ng Hebreong pangalang אַרְפַּכְשַׁד, gamit ang “k” para sa tunog /k/ at iniiwasan ang anyong Arfaxad na dumaan sa tradisyong Griego.
- source_word: יָלַד
  choice: naging ama ... ni
  rationale: Sa talaangkanang may lalaking simuno, ang יָלַד ay tumutukoy sa pagiging ama ng isang anak. Natural at malinaw sa makabagong Tagalog ang “naging ama ... ni,” nang hindi gumagamit ng makalumang “ipinanganak.”
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang hiwalay na katumbas sa Tagalog; naipahihiwatig ang ugnayan sa kayariang “naging ama ... ni.”
- source_word: שָׁלַח / שֶׁלַח
  choice: Shela
  rationale: Direktang transliterasyon sa baybay-Tagalog ng Hebreong pangalan; pinananatili ang tunog na “sh” at hindi ginagamit ang tradisyonal na anyong Sala na hindi gaanong malapit sa anyong Hebreo sa talatang ito.
- source_word: וְ/שֶׁלַח
  choice: at ... si Shela
  rationale: Isinalin ang וְ bilang “at” at inulit nang pare-pareho ang pangalan ayon sa Hebreo.
- source_word: עֵבֶר
  choice: Eber
  rationale: Karaniwang transliterasyon ng Hebreong עֵבֶר; hindi dinaragdagan ng H ang simula, yamang ang unang katinig ay ayin at hindi he.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang likas na pariralang “naging ama ... ni” para sa maikling pormula ng talaangkanan, at ang mga pangalan ay ibinatay sa Hebreo sa baybay na madaling basahin ng mga Tagalog.
