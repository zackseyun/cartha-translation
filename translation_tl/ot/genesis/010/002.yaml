  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: tl
  text: Ang mga anak ni Jafet ay sina Gomer[a], Magog, Madai, Javan, Tubal, Mesec, at Tiras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mga kalaunang gamit, maaaring may mga pagkakakilanlang etniko o heograpiko ang ilan sa mga pangalang ito: ang “Madai” ay maaaring tumukoy sa mga Medo, at ang “Javan” sa Ionia o sa mga Griyego. Pinananatili sa pangunahing teksto ang mga pangalang Hebreo sa anyong transliterado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Tuwirang salin ng construct plural ng בֵּן na nagpapakilala ng talaangkanan; pinananatili nito ang paglalahad ng Hebreo bilang mga lalaking anak.
- source_word: יֶפֶת
  choice: Jafet
  rationale: Pangngalang pantangi; ginamit ang anyong karaniwan at madaling makilala sa tradisyong Tagalog.
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Pangngalang pantangi sa talaan; tinumbasan sa pamamagitan ng transliterasyon.
- source_word: מָגוֹג
  choice: Magog
  rationale: Dito ay gumaganap bilang pangalan sa talaangkanan, kaya pinanatili bilang transliteradong pangngalang pantangi.
- source_word: מָדַי
  choice: Madai
  rationale: Bagaman maaari itong tumukoy sa mga Medo sa ibang gamit, pinananatili rito ang anyong pangalang Hebreo upang hindi gawing tahasang etnikong katawagan ang talaangkanan.
- source_word: יָוָן
  choice: Javan
  rationale: Pinanatili bilang pangalan sa talaangkanan; hindi ito isinalin bilang Ionia o mga Griyego upang mapanatili ang anyo at pagkakalahad ng Hebreo.
- source_word: תֻבָל
  choice: Tubal
  rationale: Pangngalang pantangi; transliterasyon.
- source_word: מֶשֶׁךְ
  choice: Mesec
  rationale: Pangngalang pantangi; ginamit ang natural na baybay sa Filipino para sa tunog ng pangalang Hebreo.
- source_word: תִירָס
  choice: Tiras
  rationale: Pangngalang pantangi; transliterasyon.
