  text: Joktan fathered Almodad[a], Sheleph, Hazarmaveth, and Jerah.
translation:
  language: tl
  text: At naging ama si Joktan nina Almodad, Shelef, Hazarmavet, at Jera.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit ang “at” bago ng bawat pangalan: “At naging ama si Joktan ni Almodad, at ni Shelef, at ni Hazarmavet, at ni Jera.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָקְטָן
  choice: Joktan
  rationale: Pangngalang pantangi; ginamit ang nakaugaliang anyo sa modernong saling Tagalog sa halip na mahigpit na transliterasyong Yoktan.
- source_word: יָלַד
  choice: naging mga anak ni
  rationale: Sa talaangkanan, tumutukoy ang pandiwa sa pagiging ama o pinagmulan ng angkan. Likas sa Tagalog ang konstruksiyong ito at hindi makaluma gaya ng “ipinanganak ni” kapag lalaki ang simuno.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang hiwalay na katumbas sa Tagalog.
- source_word: אַלְמוֹדָד
  choice: Almodad
  rationale: Pangngalang pantangi; transliterasyon ng pangalang Hebreo.
- source_word: שָׁלֶף
  choice: Shelef
  rationale: Pangngalang pantangi; ang f ay kumakatawan sa spirantisadong pe (ף), at ang anyo ay madaling bigkasin sa Tagalog.
- source_word: חֲצַרְמָוֶת
  choice: Hazarmavet
  rationale: Pangngalang pantangi; transliterasyong malapit sa tunog ng Hebreo, gamit ang t sa hulihan sa halip na tradisyonal na Ingles na th.
- source_word: יָרַח
  choice: Jera
  rationale: Pangngalang pantangi; ginamit ang J ayon sa nakaugaliang anyo ng mga pangalang biblikal sa Tagalog, at hindi isinulat ang halos di-binibigkas na h sa hulihan.
theological_decisions:
- issue: Saklaw ng יָלַד sa talaangkanan
  choice: naging mga anak ni
  alternative: naging ama ni / ipinanganak kay
  rationale: Pinananatili ang ugnayang genealogical nang hindi iginigiit kung tuwirang mga anak ang bawat nakalista o mga ninunong pinagmulan ng mga pangkat.
translation_notes:
  register: Modernong, dignidadong Tagalog. Pinakinis ang paulit-ulit na pang-ugnay ng Hebreo sa pangunahing teksto, ngunit itinabi ang anyong iyon sa talababa. Ginamit ang “sina” upang likas na ipakilala ang magkakasunod na pangalan.
