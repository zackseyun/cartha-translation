  terminology: Ang mga pangalang Joktan, Almodad, Shelef, Hazarmavet, at Jera ay pinanatili ayon sa draft at magkakatugma ang anyo sa teksto at talababa. Ang “naging ama” ay angkop na modernong katumbas sa talaangkanan para sa lalaking simuno.
