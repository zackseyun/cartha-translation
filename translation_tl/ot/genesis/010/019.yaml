base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/019.yaml
  text: And the border of the Canaanites was from Sidon[a], as you go toward Gerar, as far as Gaza; and as you go toward Sodom and Gomorrah and Admah and Zeboiim, as far as Lasha.
translation:
  language: tl
  text: At ang hangganan ng mga Cananeo ay mula sa Sidon, patungo sa Gerar, hanggang sa Gaza; at patungo sa Sodoma, Gomorra, Adma, at Zeboyim, hanggang sa Lasha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring “Lesha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At ... ay
  rationale: Ipinagpapatuloy ng anyong pasalaysay ang talaan at ipinahahayag ang pag-iral o lokasyon ng hangganan nang natural sa Filipino.
- source_word: גְּבוּל
  choice: hangganan
  rationale: Tumutukoy ito sa guhit o saklaw na nagtatakda sa teritoryo; mas natural sa Filipino ang “hangganan” kaysa sa literal na hiram na “border.”
- source_word: הַכְּנַעֲנִי
  choice: mga Cananeo
  rationale: Bagaman pang-isahang katawagang-etniko ang anyo sa Hebreo, kolektibo itong tumutukoy sa liping Cananeo.
- source_word: מִצִּידֹן
  choice: mula sa Sidon
  rationale: Malinaw na minamarkahan ng pang-ukol ang panimulang lugar ng paglalarawan sa hangganan.
- source_word: בֹּאֲכָה
  choice: sa direksiyon ng
  rationale: Idyoma ito sa mga paglalarawan ng hangganan na nagsasaad ng pagkilos o oryentasyon patungo sa isang lugar. Iniiwasan ng salin ang di-likas na literal na anyo ngunit pinananatili ang heograpikong diwa.
- source_word: גְרָרָה
  choice: Gerar
  rationale: Pangalan ng lugar; ang hulaping patungo ay naipahayag na ng “sa direksiyon ng.”
- source_word: עַד
  choice: hanggang
  rationale: Natural at tumpak itong nagsasaad ng pinakahangganan ng inilalarawang saklaw.
- source_word: עַזָּה
  choice: Gaza
  rationale: Karaniwang anyo sa Filipino ng pangalan ng lugar.
- source_word: סְדֹמָה וַעֲמֹרָה וְאַדְמָה וּצְבֹיִם
  choice: Sodoma, Gomorra, Adma, at Zeboyim
  rationale: Ginamit ang mga anyong madaling makilala ng mambabasang Filipino habang pinananatili ang pagkakasunod-sunod ng mga lugar sa Hebreo.
- source_word: לָשַׁע
  choice: Lasha
  rationale: Malapit na inilalarawan ng “Lasha” ang pagbikas sa tekstong Hebreo; inilagay sa talababa ang alternatibong “Lesha.”
