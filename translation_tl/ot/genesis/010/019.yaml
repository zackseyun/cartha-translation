revisions:
- from: At ang hangganan ng mga Cananeo ay mula sa Sidon, sa direksiyon ng Gerar hanggang Gaza; at sa direksiyon ng Sodoma, Gomorra, Adma, at Zeboyim, hanggang Lasha[a].
  to: At ang hangganan ng mga Cananeo ay mula sa Sidon, patungo sa Gerar, hanggang sa Gaza; at patungo sa Sodoma, Gomorra, Adma, at Zeboyim, hanggang sa Lasha[a].
  rationale: Pinalitan ang mas pangkalahatang "sa direksiyon ng" ng "patungo sa" upang mas tapat na maipahayag ang direksiyonal na pormula ng Hebreo at mapanatiling malinaw ang dalawang saklaw ng hangganan. Isinalin din sa Filipino ang panandang nagpapakilala sa alternatibong anyo ng Lasha.
