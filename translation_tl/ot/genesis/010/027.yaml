lexical_decisions:
- source_word: וְ/אֶת
  choice: at / sina
  rationale: Ang אֵת ay pananda ng tuwirang layon at hindi isinasalin nang hiwalay; ang וְ ay ipinahayag sa likas na pag-uugnay ng listahan. Ginamit ang “sina” bago ang magkakasunod na pangalang pantangi upang maging natural sa Filipino.
- source_word: הֲדוֹרָם
  choice: Hadoram
  rationale: Pangalang pantangi sa talaangkanan; tinumbasan sa transliterasyong malinaw at karaniwan sa Filipino.
- source_word: אוּזָל
  choice: Uzal
  rationale: Pangalang pantangi; pinanatili ang transliterasyong malapit sa anyong Hebreo.
- source_word: דִּקְלָה
  choice: Dikla
  rationale: Pangalang pantangi; isina-Filipino ang transliterasyon sa pamamagitan ng pag-aalis ng tahimik na h na ginagamit sa anyong Ingles.
