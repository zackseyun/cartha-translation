id: GEN.10.20
reference: Genesis 10:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵ֣לֶּה בְנֵי חָ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לִ/לְשֹֽׁנֹתָ֑/ם בְּ/אַרְצֹתָ֖/ם בְּ/גוֹיֵ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/020.yaml
  text: These are the sons of Ham[a], by their clans, by their languages, in their lands[b], by their nations.
translation:
  language: tl
  text: Ito ang mga anak ni Ham, ayon sa kani-kanilang angkan at wika, sa kani-kanilang lupain at bansa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na pormulang Filipino para sa demonstratibong nagpapakilala o nagbubuod ng isang talaan.
- source_word: בְנֵי חָם
  choice: mga anak ni Ham
  rationale: Pinananatili ang pormal na ugnayang 'mga anak ni Ham'; sa konteksto ng talaangkanan, maaari rin itong sumaklaw sa mga inapo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Ipinahahayag ng לְ ang pag-uuri ayon sa pangkat; mas angkop ang 'angkan' kaysa 'pamilya' para sa malalaking pangkat na magkakamag-anak.
- source_word: לִלְשֹׁנֹתָם
  choice: at wika
  rationale: Ang literal na 'mga dila' ay idyomatikong tumutukoy sa mga wika; pinananatili ng pagkakaugnay sa 'ayon sa kani-kanilang' ang diwa ng pag-uuri.
- source_word: בְּאַרְצֹתָם
  choice: sa kani-kanilang lupain
  rationale: Locative ang בְּ, at ang 'lupain' ay hindi nag-aangkat ng makabagong konsepto ng nation-state.
- source_word: בְּגוֹיֵהֶם
  choice: at bansa
  rationale: Ang גּוֹי ay tumutukoy sa bayan o bansa bilang pangkat ng mga tao. Sa Filipino, ang koordinasyong 'sa kani-kanilang lupain at bansa' ay likas habang pinananatili ang pagkakaiba ng teritoryo at pangkat-bayan.
theological_decisions:
- issue: Saklaw ng 'mga anak' sa talaangkanan
  choice: mga anak ni Ham
  alternative: mga inapo ni Ham
  rationale: Hindi tahasang nilulutas ang maaaring mas malawak na genealogical na saklaw ng בְנֵי; pinananatili ang kongkretong pahayag ng Hebreo.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang 'kani-kanilang' upang likas na maipakita ang distributibo at klasipikasyong diwa ng magkakasunod na parirala sa Hebreo nang hindi mabigat ang pag-uulit.
