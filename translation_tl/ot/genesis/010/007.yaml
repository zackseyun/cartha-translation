source:
  edition: WLC
  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַֽ/חֲוִילָ֔ה וְ/סַבְתָּ֥ה וְ/רַעְמָ֖ה וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖ה שְׁבָ֥א וּ/דְדָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/007.yaml
  text: 'And the sons of Cush: Seba[a], Havilah, Sabtah, Raamah, and Sabteca[b]. And the sons of Raamah: Sheba and Dedan.'
translation:
  language: tl
  text: At ang mga anak ni Cus[a] ay sina Seba, Havila, Sabta, Raama, at Sabteca[b]. At ang mga anak ni Raama ay sina Sheba at Dedan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga talaan ng angkan, ang Hebreong “mga anak ni” ay maaaring tumukoy sa mga inapo o sa pinagmulan ng isang angkan o pangkat ng mga tao, hindi lamang sa mga tuwirang anak.
    reason: cultural_note
  - marker: b
    text: Ang ilan sa mga pangalan sa talatang ito ay maaaring tumukoy sa mga bayan, lupain, o mga ninunong pinagmulan ng mga pangkat, at hindi lamang sa mga indibidwal.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “mga anak” ang tuwirang anyong pangangkanan ng בְּנֵי, ngunit sa ganitong talaan maaari rin itong tumukoy sa mas malalayong inapo o sa mga pangkat na nagmula sa isang ninuno. Isinasalin ng “At” ang pang-ugnay na וּ.
- source_word: כּוּשׁ
  choice: Cus
  rationale: Pangngalang pantangi na isinatitik ayon sa karaniwang bigkas at baybay sa Filipino.
- source_word: סְבָא
  choice: Seba
  rationale: Pinanatili bilang pangngalang pantangi nang hindi ipinapalagay kung ito ay tao, bayan, o lupain.
- source_word: חֲוִילָה
  choice: Havila
  rationale: Likas na transliterasyon sa Filipino ng pangngalang pantangi.
- source_word: סַבְתָּה
  choice: Sabta
  rationale: Malinaw at payak na transliterasyon ng pangngalang pantangi sa Filipino.
- source_word: רַעְמָה
  choice: Raama
  rationale: Pinananatili ang dalawang patinig upang katawanin ang anyong Hebreo nang hindi gumagamit ng di-likas na baybay sa Filipino.
- source_word: סַבְתְּכָא
  choice: Sabteca
  rationale: Nababasa at makabagong transliterasyon sa Filipino; hindi nito dinaragdagan ng interpretasyong etniko ang pangalan.
- source_word: וּבְנֵי רַעְמָה
  choice: At ang mga anak ni Raama
  rationale: Inuulit ang pormulang pangangkanan ng Hebreo upang mapanatili ang estruktura at posibleng lawak ng kahulugang “mga anak.”
- source_word: שְׁבָא
  choice: Sheba
  rationale: Transliterasyon ng pangngalang pantangi na ikinakaiba nito sa Seba (סְבָא) sa parehong talata.
- source_word: דְדָן
  choice: Dedan
  rationale: Tuwirang transliterasyon ng pangngalang pantangi; hindi ginawang pangalan ng isang lahi o pang-uri.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa likas na paglilista ng mga pangalan, habang pinanatili ang paulit-ulit na pormulang “At ang mga anak ni” ng tekstong Hebreo. Ang mga pangalan ay tinransliterado at hindi binigyan ng tiyak na interpretasyong heograpiko o etniko.
