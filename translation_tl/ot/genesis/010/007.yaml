  verdict: approve
  source_fidelity: 'Tapat ang salin sa Hebreong estruktura: kapwa napanatili ang pang-ugnay na “At,” ang dalawang pormulang pangangkanan na “mga anak ni,” ang limang pangalan sa ilalim ni Cus, at ang dalawang pangalan sa ilalim ni Raama. Ang paggamit ng “sina” ay wastong paraan ng paglilista ng mga pangngalang pantangi sa Filipino. Hindi ipinipilit ng salin na mga agarang anak lamang ang tinutukoy.'
  naturalness: Likas, malinaw, at marangal ang daloy sa makabagong Filipino. Ang pag-uulit ng “At ang mga anak ni” ay sinadyang tumutugma sa pormulang genealogical ng Hebreo at hindi mabigat sa maikling talata.
  terminology: 'Ang “mga anak ni” ay angkop na tuwirang katumbas ng בְּנֵי sa talaan ng angkan. Maingat at magkakatugma ang pagsasatitik ng mga pangalan: Cus, Seba, Havila, Sabta, Raama, Sabteca, Sheba, at Dedan. Ang pagkakaibang Seba/Sheba ay kapaki-pakinabang upang huwag pag-isahin ang dalawang magkaibang anyong Hebreo sa talata.'
