  yaml_path: translation/ot/genesis/010/014.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: tl
  text: at ang mga Patrusita, at ang mga Casluhita (na mula roon ay nagmula ang mga Filisteo[a]), at ang mga Caftorita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na mula roon ay lumabas ang mga Filisteo.” Maaaring unawain ang Hebreo bilang pag-uugnay sa pinagmulan ng mga Filisteo sa mga Casluhitang kababanggit lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: mga Patrusita
  rationale: Isinalin bilang pangalan ng pangkat ng mga tao na hango sa Patros; ginamit ang hulaping Filipino na -ita, gaya ng karaniwang anyo ng mga etnonimo sa Bibliya.
- source_word: כַּסְלֻחִים
  choice: mga Casluhita
  rationale: Hindi tiyak ang pagkakakilanlan ng pangkat na ito sa labas ng Bibliya, kaya tinumbasan ito sa pamamagitan ng transliterasyon nang hindi nagdaragdag ng di-tiyak na kahulugan.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: na pinagmulan ng
  rationale: Likas itong pagpapahayag sa Filipino ng kaugnayang pinagmulan sa talaangkanan. Iniuugnay ng pangunahing teksto ang sugnay sa naunang mga Casluhita, samantalang inilalahad sa talababa ang mas literal at hindi gaanong tiyak na anyo.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Ito ang malinaw at nakagawiang Filipino na pangalan para sa pangkat na ito.
- source_word: כַּפְתֹּרִים
  choice: mga Caftorita
  rationale: Transliterasyon ng etnonimong kaugnay ng Caftor, gamit ang karaniwang hulaping Filipino na -ita.
- source_word: וְאֶת
  choice: at
  rationale: Ang וְ ay nag-uugnay sa mga pangkat sa talaan; ang pantukoy sa tuwirang layon na אֶת ay hindi kailangang katawanin nang hiwalay sa Filipino.
theological_decisions:
- issue: Tinutukoy ng sugnay na אֲשֶׁר יָצְאוּ מִשָּׁם (“na mula roon ay lumabas”)
  choice: 'Iniugnay sa mga Casluhita: “na pinagmulan ng mga Filisteo.”'
  alternative: “na mula roon ay nagmula ang mga Filisteo,” na hindi tahasang tinutukoy ang mga Casluhita bilang pinagmulan.
  rationale: Ang mga Casluhita ang pinakamalapit na naunang pangkat at natural na kaugnay ng sugnay sa daloy ng talaangkanan. Gayunman, adberbiyal ang literal na מִשָּׁם (“mula roon”), kaya pinanatili sa talababa ang tunay na kalabuan sa pagkakaugnay nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga” at hulaping -ita para malinaw na mga pangkat ng tao ang tinutukoy. Ang mga gitling na pahaba ay nagbubukod sa paliwanag tungkol sa pinagmulan ng mga Filisteo nang hindi sinisira ang daloy ng talaan.
