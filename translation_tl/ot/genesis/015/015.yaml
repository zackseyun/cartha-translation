  text: As for you[a], you will go to your fathers in peace; you will be buried at a good old age.
translation:
  language: tl
  text: Para naman sa iyo, papanaw ka[a] nang payapa; ililibing ka sa iyong mabuting katandaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pupunta ka sa iyong mga ama,” isang idyomang Hebreo para sa pagpanaw at pagsama sa mga naunang salinlahi; maaari ring “sa iyong mga ninuno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Ngunit ikaw
  rationale: Ang pangatnig kasama ng hayag na panghalip ay naglilipat ng paksa at naghahambing sa sasapitin ng mga lahi ni Abram; natural na ipinahahayag ito ng “Ngunit ikaw” sa Filipino.
- source_word: תָּב֥וֹא אֶל אֲבֹתֶ֖יךָ
  choice: papanaw
  rationale: Literal itong “pupunta sa iyong mga ama,” isang idyoma ng pagkamatay at pagsama sa mga naunang salinlahi. Ang “papanaw” ay likas at marangal sa modernong Filipino, habang pinananatili sa talababa ang larawang Hebreo.
- source_word: בְּשָׁל֑וֹם
  choice: nang payapa
  rationale: Ipinahihiwatig ng שָׁלוֹם ang kapayapaan, kabuuan, at mabuting kalagayan; ang “nang payapa” ay maikli at natural sa konteksto ng pagpanaw.
- source_word: תִּקָּבֵ֖ר
  choice: ililibing
  rationale: Tuwirang katumbas ito ng pasibong anyo ng קבר at karaniwang salita sa modernong Filipino.
- source_word: בְּשֵׂיבָ֥ה טוֹבָֽה
  choice: sa isang mabuting katandaan
  rationale: Pinananatili nito ang positibong paglalarawan ng טוֹבָה at ang diwa ng pag-abot sa matandang gulang, nang hindi dinaragdagan ang teksto ng salitang wala sa Hebreo.
theological_decisions:
- issue: Kahulugan ng “pupunta sa iyong mga ama”
  choice: Isinalin sa teksto bilang “papanaw,” na may talababa tungkol sa literal na idyomang Hebreo.
  alternative: Panatilihin sa teksto ang “pupunta ka sa iyong mga ninuno” o “sa iyong mga ama.”
  rationale: Ang pahayag ay kumbensiyonal na idyoma para sa kamatayan at pagsama sa mga naunang salinlahi. Hindi ito nililimitahan sa pisikal na paglilibing, sapagkat hindi ililibing si Abram kasama ng kaniyang agarang mga ninuno; gayunman, hindi rin nito tahasang inilalahad ang isang detalyadong doktrina tungkol sa kalagayan pagkamatay.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “papanaw” upang natural na maipahayag ang idyoma ng kamatayan, habang ang talababa ang nagpapanatili sa literal na larawang Hebreo at sa teolohikal na hindi-tiyak na saklaw nito.
