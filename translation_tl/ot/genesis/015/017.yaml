  text: And when the sun had gone down and it was dark[a], behold[b], a smoking firepot and a flaming torch passed between these pieces.
translation:
  language: tl
  text: Nang lumubog na ang araw at dumilim na, narito, isang umuusok na hurno[a] at isang nagliliyab na sulo ang dumaan sa pagitan ng mga pirasong ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umuusok na pugon.” Ang salitang Hebreo ay tumutukoy sa isang hurno o sisidlang pinagsusunugan.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga piraso” ay ang mga bahagi ng mga hayop na pinagputol-putol bilang paghahanda sa ritwal ng tipan (tingnan ang Genesis 15:10).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ בָּאָה
  choice: Nang lumubog na ang araw
  rationale: Ang בוא kapag ang paksa ay ang araw ay idyoma para sa paglubog nito. Likas sa makabagong Tagalog ang temporal na sugnay na “Nang…” at malinaw nitong naihahatid ang pagsulong ng salaysay.
- source_word: וַעֲלָטָה הָיָה
  choice: at dumilim na
  rationale: Ang עֲלָטָה ay kadiliman o karimlan. Ang “dumilim na” ay natural at hindi nagdaragdag ng antas gaya ng “napakadilim” o “makapal na dilim.”
- source_word: וְהִנֵּה
  choice: narito
  rationale: Itinatampok ng הִנֵּה ang bigla at malinaw na paglitaw ng tanawin. Pinananatili ng “narito” ang marangal at masidhing himig nang hindi ito ginagawang tahasang pahayag na nakita iyon ni Abram.
- source_word: תַנּוּר עָשָׁן
  choice: isang umuusok na hurno
  rationale: Ang תַנּוּר ay hurno o sisidlang pinagsusunugan, at ang עָשָׁן ay nagbibigay rito ng larawang may usok. Ang “umuusok na hurno” ay malinaw at konkretong paglalarawan, habang inilalagay sa talababa ang posibleng “pugon.”
- source_word: לַפִּיד אֵשׁ
  choice: isang nagliliyab na sulo
  rationale: Ang לַפִּיד ay sulo, at binibigyang-diin ng אֵשׁ ang apoy nito. Ang “nagliliyab na sulo” ay likas na Tagalog at pinananatili ang masiglang larawan.
- source_word: אֲשֶׁר עָבַר
  choice: ang dumaan
  rationale: Sa Tagalog, hindi minamarkahan ng pandiwa ang bilang, kaya naipahahayag ang Hebreong anyong isahan nang hindi kinakailangang ipaliwanag kung paano magkakaugnay ang dalawang larawang apoy.
- source_word: בֵּין הַגְּזָרִים הָאֵלֶּה
  choice: sa pagitan ng mga pirasong iyon
  rationale: Ang גְּזָרִים ay ang mga bahaging pinagputol-putol sa naunang paghahanda. Sapat at natural ang “mga piraso,” at nililinaw ng talababa ang tinutukoy.
theological_decisions:
- issue: Ang pagkakakilanlan ng umuusok na hurno at nagliliyab na sulo sa tagpo ng tipan
  choice: Ilarawan lamang ang nakikitang mga anyo at huwag tahasang tukuyin sa pangunahing teksto na ang mga ito ay ang Diyos mismo.
  alternative: Ipaliwanag sa salin na ang mga ito ay pagpapakita ng presensiya ng PANGINOON.
  rationale: Mahigpit na ipinahihiwatig ng mas malawak na konteksto na isa itong pagpapakita ng Diyos sa pagpapatibay ng tipan, ngunit ang Hebreo sa talatang ito ay pinapangalanan lamang ang dalawang nakikitang larawan. Pinananatili ng deskriptibong salin ang teolohikal na tensiyon at hindi ipinapasok ang interpretasyon sa mismong teksto.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig. Ginamit ang “narito” upang mapanatili ang pantawag-pansing lakas ng הִנֵּה, at iniwasan ang mga paliwanag na tahasang kumikilala sa mga larawang apoy bilang Diyos sa pangunahing teksto.
