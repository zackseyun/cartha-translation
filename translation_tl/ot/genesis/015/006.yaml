  yaml_path: translation/ot/genesis/015/006.yaml
  text: And he believed Yahweh[c][b][a], and he counted it to him as righteousness.
translation:
  language: tl
  text: At sumampalataya siya sa PANGINOON[a], at ibinilang niya iyon sa kanya bilang katuwiran.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “At nagtiwala siya sa PANGINOON.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “ibinilang” bilang “itinuring” o “ipinagpalagay sa kanya bilang katuwiran.”
    reason: lexical_alternative
  - marker: c
    text: Karaniwang nauunawaan ang balarila ng Hebreo na ang PANGINOON ang nagbilang sa pagsampalataya ni Abram bilang katuwiran. Ang isang mas di-malamang na pagbasa ay si Abram ang paksa ng “ibinilang.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֶאֱמִן
  choice: At sumampalataya siya
  rationale: Ang Hiphil ng אמן na may kasunod na בְּ ay nagsasaad ng paniniwala o pagtitiwala sa isang tao. Ang “sumampalataya” ay likas sa marangal na modernong Filipino at pinananatili ang kaugnayan ng talata sa paggamit nito sa ibang bahagi ng Kasulatan.
- source_word: בַּיהוָה
  choice: sa PANGINOON
  rationale: Itinuturo ng pang-ukol na בְּ ang pinagtutuunan ng pananampalataya o pagtitiwala. Isinalin ang banal na pangalang יהוה bilang “PANGINOON,” ayon sa karaniwang kinikilalang anyo sa saling Filipino.
- source_word: וַיַּחְשְׁבֶהָ
  choice: at ibinilang niya iyon
  rationale: Ang חשב ay maaaring mangahulugang magbilang, magturing, o magpalagay sa kapakanan ng isang tao. Ang “ibinilang” ay malinaw at pinananatili ang diwang pagtutuos; ang “iyon” ay kumakatawan sa naunang kilos ng pagsampalataya nang hindi tahasang ipinapasok ang pangngalang “pananampalataya.”
- source_word: לּוֹ
  choice: sa kanya
  rationale: Ipinakikita ng לְ na may hulaping panghalip ang taong pinag-uukulan ng pagbibilang o pagtuturing.
- source_word: צְדָקָה
  choice: bilang katuwiran
  rationale: Sa kontekstong ito, ang צְדָקָה ay tumutukoy sa katuwiran. Ang “bilang katuwiran” ay pinananatili ang predikatibong gamit ng pangngalan at hindi ito nililimitahan sa kahulugang panlipunang katarungan lamang.
theological_decisions:
- issue: Paksa ng “ibinilang”
  choice: 'Ang PANGINOON ang karaniwang nauunawaang paksa: ibinilang niya sa kanya ang pagsampalataya bilang katuwiran.'
  alternative: Maaaring basahin, bagaman hindi gaanong malamang, na si Abram ang paksa ng “ibinilang.”
  rationale: Sa konteksto at sa malawak na pagtanggap sa talata sa Kasulatan, ang PANGINOON ang pinakanatural na paksa. Gayunman, hindi inuulit ng Hebreo ang tahasang paksa, kaya pinanatili ng panghalip na “niya” ang anyo ng pangungusap at ipinaliwanag ang mas di-malamang na pagbasa sa talababa.
- issue: Tinutukoy ng hulaping pambabae sa וַיַּחְשְׁבֶהָ
  choice: Tumutukoy ito sa kilos o tugon ng pagsampalataya ni Abram, na isinaling “iyon.”
  alternative: Maaari itong unawain nang mas malawak bilang pagtitiwala o tugon ni Abram.
  rationale: Maaaring tumukoy ang hulaping pambabae sa Hebreo sa isang abstraktong kilos o pangyayari kahit walang tahasang pangngalang pambabae na nauuna. Iniiwasan ng “iyon” ang pagdaragdag ng interpretatibong pangngalan sa pangunahing teksto.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo at mga panghalip ng Hebreo upang hindi sobra-sobrang ipaliwanag ang talata; inilagay sa mga talababa ang mahahalagang alternatibong leksikal at sintaktiko.
