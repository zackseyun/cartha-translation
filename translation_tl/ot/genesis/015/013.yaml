base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/013.yaml
  text: Then he said to Abram[a], “Know for certain that your offspring will be sojourners in a land not theirs[c][b], and they will enslave them and afflict them four hundred years.”
translation:
  language: tl
  text: At sinabi niya kay Abram, “Tiyak mong malalaman na ang iyong lahi ay magiging mga dayuhang naninirahan[a] sa lupaing hindi kanila, at aalipinin[b] at pahihirapan sila sa loob ng apat na raang taon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pansamantalang naninirahan” o “mga dayuhang nakikipamayan.” Tumutukoy ang salitang Hebreo sa mga taong naninirahan sa lupaing hindi nila sarili.
    reason: lexical_alternative
  - marker: b
    text: O “paglilingkurin nang sapilitan.” Hindi tahasang pinangalanan sa Hebreo kung sino ang aalipin at magpapahirap sa kanila.
    reason: lexical_and_grammatical_ambiguity
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: Tiyak mong malaman
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa katiyakan. Pinananatili ng parirala ang mariing utos/pahayag sa likas at marangal na Tagalog.
- source_word: גֵר
  choice: mga dayuhang naninirahan
  rationale: Tumutukoy ang גֵר sa mga taong naninirahan sa lupaing hindi kanila bilang mga hindi katutubo o walang sariling pag-aari roon. Mas malinaw ito sa modernong Tagalog kaysa sa teknikal o makalumang katawagan.
- source_word: זַרְעֲךָ
  choice: iyong lahi
  rationale: Kolektibong pangngalan ang זֶרַע. Ang “lahi” ay natural sa Tagalog at tumutukoy rito sa mga salinlahi ni Abram nang hindi gumagamit ng literal ngunit alanganing “binhi.”
- source_word: בְּאֶרֶץ לֹא לָהֶם
  choice: sa lupaing hindi kanila
  rationale: Tuwirang pinananatili nito ang diwa ng kawalan nila ng pagmamay-ari sa lupain at ang maikli at mariing ayos ng Hebreo.
- source_word: וַעֲבָדוּם
  choice: Aalipinin sila
  rationale: Sa konteksto, ang pandiwa ay nagpapahiwatig ng sapilitang paglilingkod. Ginawang tahasang layon ang lahi ni Abram, habang hindi pinangalanan ang mga mang-aalipin na hindi naman tahasang tinutukoy sa talata.
- source_word: וְעִנּוּ אֹתָם
  choice: at pahihirapan sila
  rationale: Ang piel ng ענה ay nagpapahayag ng pagpapahirap o pang-aapi. Malawak ang “pahihirapan” at hindi nito nililimitahan ang masamang pagtrato sa iisang uri.
- source_word: אַרְבַּע מֵאוֹת שָׁנָה
  choice: sa loob ng apat na raang taon
  rationale: Nililinaw ng natural na pariralang Tagalog ang gamit ng bilang bilang tagal ng kalagayang inilarawan.
- source_word: וַיֹּאמֶר לְאַבְרָם
  choice: At sinabi niya kay Abram
  rationale: Pinananatili ng “At” ang waw-consecutive at ang pagpapatuloy ng salaysay nang hindi labis na binibigyang-kahulugan ang eksaktong ugnayang temporal.
theological_decisions:
- issue: Ang tinutukoy ng maramihang simuno sa “aalipinin at pahihirapan sila”
  choice: Hindi pinangalanan ang simuno; ang lahi ni Abram ang tahasang layon ng mga pandiwa.
  alternative: Tukuyin ang mga naninirahan sa lupaing iyon bilang mga mang-aalipin at mang-aapi.
  rationale: May maramihang simuno at maramihang layon sa Hebreo, ngunit hindi tahasang pinangalanan ang simuno. Iniiwasan ng ayos sa Tagalog ang nakalilitong magkasunod na “sila” at hindi nagdaragdag ng pagkakakilanlan na wala sa teksto.
- issue: Saklaw ng “apat na raang taon”
  choice: Iniuugnay sa kabuuang kalagayan ng paninirahan sa ibang lupain at pagdurusa, nang hindi higit na nililinaw ang eksaktong panimulang punto.
  alternative: Iugnay lamang ang apat na raang taon sa mismong pagpapahirap at pagkaalipin.
  rationale: Nasa dulo ng pangungusap ang pariralang tumutukoy sa tagal, kaya may posibleng sintaktikong saklaw na hindi dapat tahimik na paliitin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Iniwasan ang sobrang teknikal na “resident alien,” ang makalumang “nakikipamayan” sa pangunahing teksto, at ang nakalilitong aktibong ayos na may dalawang magkasunod na panghalip na “sila.”
