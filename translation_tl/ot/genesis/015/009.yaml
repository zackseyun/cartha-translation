  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו קְחָ֥/ה לִ/י֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת וְ/עֵ֥ז מְשֻׁלֶּ֖שֶׁת וְ/אַ֣יִל מְשֻׁלָּ֑שׁ וְ/תֹ֖ר וְ/גוֹזָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/009.yaml
  text: And he said to him[a], “Bring me a three-year-old heifer, a three-year-old female goat, a three-year-old ram, a turtledove[b], and a young pigeon.”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Dalhin mo sa akin[a] ang isang dumalagang baka na tatlong taong gulang[b], isang babaeng kambing na tatlong taong gulang, isang lalaking tupa na tatlong taong gulang, isang batubato, at isang inakay na kalapati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “kumuha ka para sa akin.” Sa konteksto, ang diwa ay kunin at dalhin ang mga hayop para sa seremonya ng tipan.
    reason: lexical_alternative
  - marker: b
    text: Ang paulit-ulit na salitang Hebreo na isinaling “tatlong taong gulang” ay tradisyonal na inuunawa rito bilang pagtukoy sa mga hayop na tatlong taon ang edad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Sinabi niya sa kanya
  rationale: Likas na salin ng Hebreong anyong pasalaysay at ng pariralang ‘sa kanya’; hindi na pinangalanan si Abram dahil panghalip din ang nasa pinagmulang teksto.
- source_word: קְחָה לִי
  choice: Dalhin mo sa akin
  rationale: Bagaman literal na ‘kumuha ka para sa akin,’ ipinahihiwatig ng konteksto na kukunin at ihaharap ang mga hayop; malinaw at natural sa modernong Tagalog ang ‘dalhin mo sa akin.’
- source_word: עֶגְלָה
  choice: dumalagang baka
  rationale: Tumutukoy sa batang babaeng baka; mas tiyak ito kaysa sa pangkalahatang ‘baka’ at mas madaling maunawaan kaysa sa teknikal na hiram na salita.
- source_word: מְשֻׁלֶּשֶׁת / מְשֻׁלָּשׁ
  choice: tatlong taong gulang
  rationale: Sa talaang ito ng mga hayop, tradisyonal at kontekstuwal na nauunawaan ang paulit-ulit na anyo bilang pagtukoy sa edad, bagaman may leksikal na posibilidad na ‘tatluhan’ o ‘tatlong ulit.’
- source_word: עֵז
  choice: babaeng kambing
  rationale: Ang pangngalan ay tumutukoy rito sa babaeng kambing; tahasang ipinapakita ng salin ang kasarian.
- source_word: אַיִל
  choice: lalaking tupa
  rationale: Karaniwan at malinaw na katumbas ng ram sa Tagalog.
- source_word: תֹר
  choice: batubato
  rationale: Tiyak na uri ng ibong kauri ng kalapati, hindi lamang pangkalahatang ‘kalapati.’
- source_word: גּוֹזָל
  choice: inakay na kalapati
  rationale: Sa pagkakapares nito sa תֹר at sa kontekstong ritwal, natural na tumutukoy sa batang kalapati; pinananatili ng ‘inakay’ ang diin sa murang edad.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘dumalagang baka’ at ‘batubato’ upang mapanatili ang mga tiyak na uri ng hayop nang hindi nagiging labis na teknikal; iniwasan ang lumang anyong ‘inakay ng kalapati’ pabor sa mas natural na ‘inakay na kalapati.’
