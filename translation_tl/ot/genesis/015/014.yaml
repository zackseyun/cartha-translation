  yaml_path: translation/ot/genesis/015/014.yaml
  text: But I will also judge the nation that they serve[b][a], and afterward they will come out with great possessions.
translation:
  language: tl
  text: Ngunit hahatulan ko rin ang bansang paglilingkuran nila[a], at pagkatapos nito ay lalabas sila na may napakaraming ari-arian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bansang aalipin sa kanila”; literal na “paglilingkuran” ang pandiwang Hebreo, ngunit sa konteksto ay tumutukoy ito sa sapilitang paglilingkod sa ilalim ng isang banyagang bansa.
    reason: lexical_alternative
  - marker: b
    text: O “taglay ang malaking kayamanan” o “na may saganang mga pag-aari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Ngunit ... rin
  rationale: Pinananatili ng “rin” ang dagdag na diin ng גַם, samantalang likas na ipinahahayag ng “Ngunit” ang paghahambing sa naunang pagdurusa ng mga inapo ni Abram.
- source_word: הַגּוֹי
  choice: ang bansa
  rationale: Tuwirang katumbas ito ng גּוֹי sa kontekstong tumutukoy sa bansang paglilingkuran ng mga inapo ni Abram.
- source_word: אֲשֶׁר יַעֲבֹדוּ
  choice: na paglilingkuran nila
  rationale: Pinananatili nito ang literal na diwa ng עבד na “maglingkod,” habang hindi isinasara ang kontekstuwal na posibilidad ng sapilitang paglilingkod.
- source_word: דָּן אָנֹכִי
  choice: hahatulan ko
  rationale: Ipinahahayag nito ang panghinaharap na diwa sa konteksto at pinananatili ang hudisyal na kahulugan ng דָּן, sa halip na paliitin iyon sa “parurusahan.”
- source_word: וְאַחֲרֵי כֵן
  choice: at pagkatapos nito
  rationale: Malinaw at likas nitong ipinapakita ang pagkakasunod ng mga pangyayari.
- source_word: יֵצְאוּ
  choice: lalabas sila
  rationale: Tuwirang isinasalin ang יצא at ang pag-alis nila mula sa bansang pinaglilingkuran.
- source_word: בִּרְכֻשׁ גָּדוֹל
  choice: na may napakaraming ari-arian
  rationale: Ang רְכוּשׁ ay tumutukoy sa mga pag-aari o ari-arian; ipinahahayag ng “napakarami” ang laki o kasaganaan na dala ng גָּדוֹל nang gawing abstraktong “kayamanan” lamang ang kahulugan.
theological_decisions:
- issue: Ang uri ng paghatol ng Diyos sa bansang nang-aapi
  choice: hahatulan
  alternative: parurusahan
  rationale: Ang דָּן ay wikang hudisyal. Pinananatili ng “hahatulan” ang legal at moral na saklaw nito nang hindi paunang itinatakda ang tiyak na anyo o bunga ng paghatol.
- issue: Ang katangian ng paglilingkod ng mga inapo ni Abram
  choice: paglilingkuran
  alternative: aalipinin sila ng
  rationale: Ang qal na anyo ng עבד ay tahasang “maglingkod.” Ipinahihiwatig ng konteksto ang sapilitang paglilingkod, ngunit pinananatili sa pangunahing teksto ang mismong leksikal na anyo at inilalagay sa talababa ang mas malinaw na kontekstuwal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bansa,” “paglilingkuran,” at “hahatulan” upang manatiling malapit sa Hebreo, habang inililinaw sa mga talababa ang kontekstuwal at leksikal na mga alternatibo.
