  text: וַ/יֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤/י יֱהוִה֙ מַה תִּתֶּן לִ֔/י וְ/אָנֹכִ֖י הוֹלֵ֣ךְ עֲרִירִ֑י וּ/בֶן מֶ֣שֶׁק בֵּיתִ֔/י ה֖וּא דַּמֶּ֥שֶׂק אֱלִיעֶֽזֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/002.yaml
  text: But Abram said[a], “Lord Yahweh, what will you give me, since I am going childless, and the heir of my house is Eliezer of Damascus?”
translation:
  language: tl
  text: Ngunit sinabi ni Abram[a], “Panginoong Yahweh, ano ang ibibigay mo sa akin, gayong mananatili akong walang anak at ang tagapagmana ng aking sambahayan ay si Eliezer na taga-Damasco?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang anak ng mesheq ng aking sambahayan,” isang di-pangkaraniwang parirala; maaari ring mangahulugang “ang katiwala ng aking sambahayan” o “ang magmamay-ari/tagapagmana ng aking sambahayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi ni Abram
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit ang sinabi ni Abram ay nagpapahayag ng pag-aalinlangan o pagtutol bilang tugon sa naunang pangako; kaya natural ang “Ngunit.”
- source_word: אֲדֹנָי יֱהוִה
  choice: Panginoong Yahweh
  rationale: Pinananatili ang titulong אֲדֹנָי bilang “Panginoon” at ang banal na pangalan na יֱהוִה bilang “Yahweh,” sa isang likas na anyong Tagalog.
- source_word: מַה תִּתֶּן לִי
  choice: ano ang ibibigay mo sa akin
  rationale: Ang imperfect ay may natural na diwang panghinaharap sa konteksto ng ipinangakong pagpapala.
- source_word: וְאָנֹכִי הוֹלֵךְ עֲרִירִי
  choice: gayong mananatili akong walang anak
  rationale: Ang literal na larawan ng “paglakad/pagyao nang walang anak” ay tumutukoy sa pagpapatuloy ng kalagayan ni Abram hanggang kamatayan. Inihahayag ng “mananatili” ang diwa nang natural, habang hindi ito tahasang ginagawang “mamamatay” sa pangunahing teksto.
- source_word: בֶן מֶשֶׁק בֵּיתִי
  choice: ang tagapagmana ng aking sambahayan
  rationale: Lubhang di-pangkaraniwan at malabo ang parirala. Sa konteksto, si Eliezer ang inaasahang magmamana ng ari-arian ni Abram; ang literal at iba pang posibleng pakahulugan ay inilalagay sa talababa.
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  choice: si Eliezer na taga-Damasco
  rationale: Natural na ipinakikilala si Eliezer ayon sa pinagmulan o kaugnayan niya sa Damasco.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan sa tambalang אֲדֹנָי יֱהוִה
  choice: Panginoong Yahweh
  alternative: Panginoong DIYOS
  rationale: Pinananatili ng “Yahweh” ang tahasang banal na pangalan sa Hebreo, samantalang isinasalin ang אֲדֹנָי bilang titulong “Panginoon.”
- issue: Katayuan ni Eliezer sa sambahayan ni Abram
  choice: tagapagmana ng aking sambahayan
  alternative: katiwala ng aking sambahayan
  rationale: Ipinahihiwatig ng kasunod na konteksto ang usapin ng mamanahin, ngunit tunay na malabo ang pambihirang pariralang Hebreo; kaya hindi ipinagpapalagay sa talababa na tiyak lamang ang isang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” upang saklawin ang buong household ni Abram, hindi lamang ang gusaling tinitirhan. Ang hulma na “Panginoong Yahweh” ay natural sa Tagalog at pinananatili ang dalawang elemento ng tawag.
