  terminology: Wasto at magkakatugma ang paggamit ng “Yahweh,” “salita,” “pangitain,” “kalasag,” at “gantimpala.” Ang “iyong kalasag” ay natural na Tagalog na katumbas ng “a shield for you” at hindi binabago ang metapora o saklaw nito.
