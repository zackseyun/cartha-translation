id: GEN.15.1
reference: Genesis 15:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הָיָ֤ה דְבַר יְהוָה֙ אֶל אַבְרָ֔ם בַּֽ/מַּחֲזֶ֖ה לֵ/אמֹ֑ר אַל תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔/ךְ שְׂכָרְ/ךָ֖ הַרְבֵּ֥ה מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/001.yaml
  text: After these things[a], the word of Yahweh came to Abram in a vision, saying, “Do not fear, Abram. I am a shield for you; your reward will be very great.”
translation:
  language: tl
  text: 'Pagkatapos ng mga pangyayaring ito, dumating kay Abram sa isang pangitain ang salita ni Yahweh: “Huwag kang matakot, Abram. Ako ang iyong kalasag; magiging napakadakila ng iyong gantimpala.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ako ang iyong kalasag; napakadakila ng iyong gantimpala.” Posible rin ang pagbasa: “Ako ang iyong kalasag, ang iyong napakadakilang gantimpala.”'
    reason: Pinananatili ang kalabuan ng eliptikal na sugnay sa Hebreo hinggil sa panahunan at sa kung si Yahweh mismo ang tinutukoy na gantimpala.
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Pagkatapos ng mga pangyayaring ito
  rationale: Malawak ang saklaw ng דְּבָרִים at sa konteksto ay tumutukoy sa mga naunang pangyayari sa salaysay; mas natural dito ang “mga pangyayari” kaysa literal na “mga bagay” o “mga salita.”
- source_word: דְבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ang kinikilalang pormula para sa banal na kapahayagan at ang tuwirang pangalan na יְהוָה bilang Yahweh.
- source_word: הָיָה ... אֶל אַבְרָם
  choice: dumating kay Abram
  rationale: Natural na katumbas sa Tagalog ng Hebreong pormulang nagsasaad na ang salita ay ipinahayag sa isang tao.
- source_word: בַּמַּחֲזֶה
  choice: sa isang pangitain
  rationale: Tumutukoy ang pangngalan sa kapahayagang natanggap sa pamamagitan ng pangitain; natural sa Tagalog ang di-tiyak na “isang.”
- source_word: אַל תִּירָא
  choice: Huwag kang matakot
  rationale: Tuwiran, makabago, at natural na pagbabawal sa Tagalog.
- source_word: מָגֵן לָךְ
  choice: Ako ang iyong kalasag
  rationale: Bagaman literal na “kalasag para sa iyo,” ang “iyong kalasag” ay natural na panaguring Tagalog at hindi lumalampas sa kahulugan ng proteksiyon para kay Abram.
- source_word: שְׂכָרְךָ
  choice: iyong gantimpala
  rationale: Maaaring mangahulugang bayad o gantimpala ang salita; “gantimpala” ang pinakaangkop sa konteksto ng pangako.
- source_word: הַרְבֵּה מְאֹד
  choice: magiging napakadakila
  rationale: Nagdaragdag ng pandiwang panulad na hinihingi ng natural na Tagalog at ipinahahayag ang promissoryong diwa, habang kinikilala sa talababa na maaari ring unawaing pangkasalukuyan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang pinananatili ang natatanging pangalan sa tekstong Hebreo nang hindi ito pinapalitan ng titulo.
- issue: Ugnayan ng מָגֵן לָךְ at שְׂכָרְךָ הַרְבֵּה מְאֹד
  choice: 'Dalawang panaguri: si Yahweh ang kalasag ni Abram, at magiging napakadakila ang gantimpala nito'
  alternative: Si Yahweh mismo ang napakadakilang gantimpala ni Abram
  rationale: Pinakaagarang pagbasa sa sintaks ang dalawang magkaugnay na pahayag, ngunit eliptikal ang Hebreo kaya inilalahad sa talababa ang ibang posibleng pagbasa at ang pangkasalukuyang anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pangyayari” para sa kontekstuwal na diwa ng דְּבָרִים, “pangitain” bilang karaniwang salitang biblikal, at “kalasag” bilang madaling maunawaang larawang metaporikal.
