  to: At sinabi niya sa kanya, “Ako si Yahweh, na naglabas sa iyo mula sa Ur ng mga Caldeo upang ibigay sa iyo ang lupaing ito para ariin mo.[a]”
  rationale: Pinalitan ang “ang naglabas” ng “na naglabas” para sa mas likas na ugnayan ng sugnay sa Filipino. Pinalitan ang “angkinin mo” ng “ariin mo” upang mas tumpak na maihatid ang malawak na diwa ng ירשׁ—ang pagtanggap at pagmamay-ari ng ipinangakong lupain—nang hindi nagpapahiwatig nang labis ng pag-claim o sapilitang pagkuha. Inilipat ang “angkinin mo” sa talababa bilang isang posibleng alternatibo.
