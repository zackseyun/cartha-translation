  yaml_path: translation/ot/genesis/015/007.yaml
  text: And he said to him[a], “I am Yahweh[c][b], who brought you out from Ur of the Chaldeans to give you this land to possess.”
translation:
  language: tl
  text: At sinabi niya sa kanya, “Ako si Yahweh, na naglabas sa iyo mula sa Ur ng mga Caldeo upang ibigay sa iyo ang lupaing ito para ariin mo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “manahin mo” o “angkinin mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: At sinabi niya sa kanya
  rationale: Pinananatili ng “At” ang pagsulong ng salaysay na ipinahihiwatig ng wayyiqtol, at tuwirang isinasalin ng “sa kanya” ang אֵלָיו.
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Likas sa Tagalog ang “Ako si” sa pagpapakilala, at tuwirang tinutumbasan ng “Yahweh” ang pangalang banal na יהוה.
- source_word: אֲשֶׁר הוֹצֵאתִיךָ
  choice: ang naglabas sa iyo
  rationale: Ang “ang naglabas” ay natural na Tagalog na panuring sa nagsasalita at pinananatili ang causative na diwa ng Hiphil ng יצא.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: mula sa Ur ng mga Caldeo
  rationale: Pinananatili ang pangalang pook na Ur at inilalarawan ang kaugnayan nito sa mga Caldeo sa karaniwang anyong Tagalog.
- source_word: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת
  choice: upang ibigay sa iyo ang lupaing ito
  rationale: Malinaw na ipinahahayag ng “upang” ang layunin ng infinitive construct, habang natural ang ayos ng parirala sa Tagalog.
- source_word: לְרִשְׁתָּהּ
  choice: para angkinin mo
  rationale: Sinasaklaw ng “angkinin” ang diwa ng pagtanggap at paghawak sa lupain nang hindi nililimitahan ang salita sa pormal na pagmamana; tahasang tinutukoy ng “mo” si Abram bilang gagawa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalang tipan ang tahasang nasa tekstong Hebreo; pinananatili ng transliterasyong “Yahweh” ang pagkakakilanlan nito bilang sariling pangalan sa halip na palitan ito ng isang titulo.
- issue: Diwa ng ירשׁ sa pangako ng lupain
  choice: angkinin
  alternative: manahin
  rationale: Maaaring tumukoy ang pandiwa sa pagmamana o pagkuha ng pag-aari. Hindi nilulutas nang labis ng “angkinin” ang paraan ng pagtanggap sa lupain, samantalang maaaring magpahiwatig ang “manahin” ng mas makitid na ugnayang pampamilya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na daloy ng salaysay at iniwasan ang labis na teknikal o denominasyonal na pananalita.
