id: GEN.15.18
reference: Genesis 15:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת אַבְרָ֖ם בְּרִ֣ית לֵ/אמֹ֑ר לְ/זַרְעֲ/ךָ֗ נָתַ֨תִּי֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/נְּהַ֣ר מִצְרַ֔יִם עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/018.yaml
  text: On that day Yahweh made a covenant with Abram[a], saying, “To your offspring I have given this land, from the river of Egypt as far as the great river[b], the Euphrates.”
translation:
  language: tl
  text: Noong araw na iyon, nakipagtipan si Yahweh kay Abram[a] at sinabi, “Sa iyong lahi ay ibinigay ko na ang lupaing ito, mula sa ilog ng Ehipto[b] hanggang sa malaking ilog, ang Eufrates.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pumutol ng tipan,” isang idyoma para sa pakikipagtipan na malamang ay tumutukoy sa ritwal ng pagputol na inilalarawan sa kalapit na talata.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “batis ng Ehipto” o “wadi ng Ehipto.” “Ilog ng Ehipto” ang literal na nasa Hebreo, ngunit pinagtatalunan ang tiyak na lugar na tinutukoy.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Nang araw na iyon
  rationale: Natural na panandang temporal sa Filipino para sa isang tiyak na pangyayari.
- source_word: כָּרַת ... בְּרִית
  choice: nakipagtipan
  rationale: Malinaw at likas na katumbas ng idyomang Hebreo na literal na “pumutol ng tipan”; pinananatili sa talababa ang literal na larawan dahil kaugnay ito ng ritwal sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: לְזַרְעֲךָ
  choice: sa iyong lahi
  rationale: Ang “lahi” ay natural sa Filipino at maaaring tumukoy nang kolektibo sa mga nagmumula kay Abram, gaya ng singular na kolektibong זֶרַע.
- source_word: נָתַתִּי
  choice: ibinigay ko na
  rationale: Ipinahahayag ng anyong ganap ang kaloob bilang tiyak at itinuturing nang ipinagkaloob, nang hindi ginagawang payak na panghinaharap.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ang lupaing ito
  rationale: Ang “lupain” ang natural na salita sa konteksto ng pangakong teritoryal.
- source_word: מִנְּהַר מִצְרַיִם
  choice: mula sa ilog ng Ehipto
  rationale: Karaniwang nangangahulugang “ilog” ang נָהָר; inilalahad sa talababa ang alternatibong heograpikong pagkilala.
- source_word: עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: hanggang sa malaking ilog, ang Eufrates
  rationale: Pinananatili ang hangganang ipinahihiwatig ng עַד at ang appositional na pagkakakilanlan ng malaking ilog bilang Eufrates.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Aspekto ng kaloob sa נָתַתִּי
  choice: ibinigay ko na
  alternative: ibinibigay ko; ibinigay ko
  rationale: Pinananatili nito ang tensiyon ng isang pangakong ipinahahayag bilang tiyak at ganap nang ipinagkaloob, nang hindi ipinapalagay na lubos nang naganap ang makasaysayang pag-aangkin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nakipagtipan” at “lupain” bilang natural na mga salitang biblikal na hindi lipas; pinanatili ang pangalang Yahweh at ang kolektibong saklaw ng “lahi.”
