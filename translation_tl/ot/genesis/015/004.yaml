  text: And behold, the word of the LORD came to him, saying, “This man will not be your heir; rather, one who comes from your own body will be your heir.”
translation:
  language: tl
  text: 'At narito, dumating sa kanya ang salita ni Yahweh: “Hindi ang taong ito ang magiging tagapagmana mo, kundi ang magmumula mismo sa iyong katawan ang magiging tagapagmana mo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang pantawag-pansing gamit ng Hebreong hinnēh habang nananatiling malinaw at marangal sa modernong Tagalog.
- source_word: דְבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Tuwirang inililipat ang pariralang Hebreo at ginagamit ang personal na pangalan ng Diyos na kinakatawan ng יהוה.
- source_word: לֹא יִירָשְׁךָ זֶה
  choice: Hindi ang taong ito ang magiging tagapagmana mo
  rationale: Ang demonstratibong זֶה ay tumutukoy sa lalaking kababanggit lamang; nililinaw ito bilang “ang taong ito” nang hindi nagdaragdag ng pagkakakilanlan.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: ang magmumula sa sarili mong katawan
  rationale: Ang literal na idyomang “lalabas mula sa iyong mga laman-loob” ay natural na ipinahahayag bilang pisikal na supling mula sa sariling katawan ni Abram.
- source_word: הוּא יִירָשֶׁךָ
  choice: ang magiging tagapagmana mo
  rationale: Inililipat ang idiomatikong pandiwang “magmamana sa iyo” sa natural na Tagalog nang pinananatili ang diwa ng legal at pampamilyang pagmamana.
theological_decisions:
- issue: Pagkakakilanlan ng ipinangakong tagapagmana
  choice: ang magmumula sa sarili mong katawan
  alternative: ang sarili mong anak
  rationale: Hindi tahasang sinasabi sa talata ang “anak”; pinananatili ng napiling salin ang biyolohikal na diin at ang antas ng detalye ng Hebreo.
- issue: Paglalahad sa banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang pinagmulang teksto ay may Tetragrammaton bilang personal na pangalan; ang transliterasyong “Yahweh” ay malinaw at hindi ipinagpapalit sa titulong Adonai.
translation_notes:
  register: Modernong Filipino Tagalog na simple, dignified, at angkop sa pampublikong pagbasa. Ginamit ang “tagapagmana” dahil malinaw ito sa kontekstong legal at pampamilya; iniwasan ang sobrang literal na “mula sa iyong mga laman-loob,” na magiging di-natural o madaling maunawaan nang mali.
