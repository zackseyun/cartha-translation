source:
  edition: WLC
  text: וְ/אֶת הַ/חִתִּ֥י וְ/אֶת הַ/פְּרִזִּ֖י וְ/אֶת הָ/רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/020.yaml
  text: and the Hittites[a], and the Perizzites, and the Rephaim,
translation:
  language: tl
  text: at ang mga Heteo, ang mga Perezeo, at ang mga Refaim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga higante.” Sa ilang konteksto, maaaring unawain sa ganitong paraan ang Hebreong Refaim, ngunit dito ay malamang na tumutukoy ito sa isang pangkat ng mga tao sa lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: at ang
  rationale: Ang וְ ay nagdurugtong ng isa pang pangkat sa nagpapatuloy na talaan mula sa naunang talata. Hindi hiwalay na isinasalin sa Tagalog ang panandang tuwirang layon na אֵת.
- source_word: הַחִתִּי
  choice: ang mga Heteo
  rationale: Bagaman anyong isahan ang gentiliko sa Hebreo, kolektibo ang gamit nito at tumutukoy sa isang pangkat ng mga tao; kaya likas sa Tagalog ang anyong maramihan.
- source_word: הַפְּרִזִּי
  choice: ang mga Perezeo
  rationale: Kolektibong gentiliko rin ito. Ginamit ang kinagawiang anyong pangkat sa Tagalog upang malinaw na isang bayan ang tinutukoy.
- source_word: הָרְפָאִים
  choice: ang mga Refaim
  rationale: Sa talaang ito ng mga bayang naninirahan sa lupain, pinakamalamang na pangalang etniko ang רְפָאִים. Pinanatili ang pangalan sa halip na ilagay sa pangunahing teksto ang mapagpakahulugang saling “mga higante.”
theological_decisions:
- issue: Kung ang רְפָאִים ay isasaling pangalang etniko o paglalarawang “mga higante”
  choice: mga Refaim
  alternative: mga higante
  rationale: Ang Genesis 15:19–21 ay talaan ng mga bayang nasa lupaing ipinangako kay Abram, kaya mas malakas sa konteksto ang pagbasa rito bilang pangalan ng isang pangkat. Inilagay sa talababa ang tradisyonal na alternatibo upang mapanatili ang leksikal na posibilidad nang hindi ito ipinipilit sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang mga anyong “Heteo,” “Perezeo,” at “Refaim” bilang madaling basahing mga pangalang etniko. Pinanatili ang panimulang “at” dahil nagpapatuloy ang talaan mula sa naunang talata.
