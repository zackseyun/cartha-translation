  yaml_path: translation/ot/genesis/015/008.yaml
  text: And he said[a], “Lord Yahweh, how will I know that I will possess it?”
translation:
  language: tl
  text: At sinabi niya, “Panginoong Yahweh, paano ko malalaman na mapapasakin ito[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mamanahin ko ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: At sinabi niya
  rationale: Karaniwang salaysay na anyo ng wayyiqtol ng אמר; ipinagpapatuloy nito ang daloy ng kuwento nang hindi dinaragdagan ang tiyak na ugnayang temporal.
- source_word: אֲדֹנָי יֱהוִה
  choice: Panginoong Yahweh
  rationale: Pinananatili ang magkasamang titulong אֲדֹנָי at pangalang tipan na יהוה sa isang natural na anyong Tagalog.
- source_word: בַּמָּה
  choice: paano
  rationale: Bagaman literal na “sa pamamagitan ng ano,” idiomatikong itinatanong dito ang paraan o batayan ng pagkakaalam; natural sa modernong Tagalog ang “paano.”
- source_word: אֵדַע
  choice: ko malalaman
  rationale: Ang Qal imperfect na unang panauhan ay tumutukoy sa pagkakaalam sa hinaharap o bilang bunga ng ibibigay na tanda.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng nais malaman ni Abram.
- source_word: אִירָשֶׁנָּה
  choice: mapapasakin ito
  rationale: Ang ירשׁ ay maaaring mangahulugang magmay-ari, angkinin, o manahin. Malinaw at natural na ipinapahayag ng “mapapasakin” ang aktuwal na pagtatamo ng lupa, habang inilalagay sa talababa ang posibleng diwang “mamanahin.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalan sa אֲדֹנָי יֱהוִה
  choice: Panginoong Yahweh
  alternative: Panginoong DIYOS
  rationale: Tuwirang pinananatili ng “Yahweh” ang natatanging banal na pangalan sa Hebreo, samantalang malinaw na naihihiwalay rito ang titulong “Panginoon.”
- issue: Saklaw ng kahulugan ng ירשׁ sa pangako tungkol sa lupain
  choice: mapapasakin ito
  alternative: mamanahin ko ito
  rationale: Hindi ipinapasya ng salin kung ang diin ay legal na mana o aktuwal na pag-aari; pinili sa pangunahing teksto ang mas malawak na diwa ng pagtatamo ng pag-aari at pinanatili sa talababa ang tunay na posibleng kahulugang “mana.”
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “mapapasakin” upang maiwasan ang mas matigas na “aangkinin” at maipahayag nang malinaw ang inaasahang pagmamay-ari sa lupa.
