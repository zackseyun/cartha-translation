    issue: Hindi angkop ang “lumusong” para sa pagdating ng mga ibon mula sa itaas.
    rationale: Bagaman maaari itong magpahiwatig ng pababang galaw sa ilang konteksto, karaniwan itong nauugnay sa pagpasok o pagtawid sa tubig, putik, o isang espasyo. Ang Hebreong ירד ay payak na “bumaba/came down.”
  - severity: low
    issue: “Mga ibong maninila” ay hindi gaanong tiyak at natural na katumbas ng “birds of prey.”
    rationale: Ang “mga ibong mandaragit” ang karaniwang modernong Filipino para sa mga ibong naninila; hindi nito pinipilit ang mas tiyak na “mga buwitre.”
