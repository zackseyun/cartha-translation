  text: And the birds of prey came down on the carcasses[a], and Abram drove them away.
translation:
  language: tl
  text: At bumaba ang mga ibong mandaragit sa mga bangkay[a], at itinaboy sila ni Abram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “bumaba ang ibong mandaragit sa mga bangkay.” Maaaring unawain ang pangngalang Hebreo bilang isahang kolektibo, ngunit malamang na kolektibo ang diwa rito: mga ibong kumakain ng bangkay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: lumusong
  rationale: Ipinahahayag ng ירד ang pagbaba patungo sa mga bangkay; natural sa Filipino ang “lumusong” para sa mga ibong bumababa mula sa himpapawid.
- source_word: הָעַיִט
  choice: mga ibong maninila
  rationale: Maaaring kolektibong pangngalan ang עַיִט. Pinananatili ng “mga ibong maninila” ang lawak ng salita nang hindi ito nililimitahan sa mga buwitre lamang.
- source_word: הַפְּגָרִים
  choice: mga bangkay
  rationale: Ang פֶּגֶר ay bangkay o patay na katawan; sa konteksto, tumutukoy ito sa mga kinatay na hayop.
- source_word: וַיַּשֵּׁב אֹתָם
  choice: itinaboy sila
  rationale: Ang Hiphil ng שוב dito ay pagpapabalik o pagpapaalis; malinaw at likas na ipinahahayag ng “itinaboy sila” ang aktibong pagtataboy ni Abram.
- source_word: אַבְרָם
  choice: Abram
  rationale: Pinananatili ang pangalang Abram sapagkat hindi pa ito napapalitan ng Abraham sa bahaging ito ng Genesis.
