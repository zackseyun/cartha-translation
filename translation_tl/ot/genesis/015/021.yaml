  text: and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: tl
  text: at ang mga Amoreo, ang mga Cananeo, ang mga Gergeseo, at ang mga Jebuseo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: at ang mga / ang mga
  rationale: Ang וְ ay nagpapatuloy sa talaan at ang אֶת ay pananda ng tiyak na layon. Sa natural na Tagalog, ipinahihiwatig ng pag-uulit ng “ang mga” ang magk magkahiwalay na pangkat, samantalang ginagamit ang “at” ayon sa karaniwang ayos ng isang talaan.
- source_word: הָאֱמֹרִי
  choice: ang mga Amoreo
  rationale: Bagaman anyong pang-isahan ang kolektibong katawagan sa Hebreo, tumutukoy ito rito sa isang buong pangkat ng mga tao; kaya natural ang maramihang “mga Amoreo” sa Tagalog.
- source_word: הַכְּנַעֲנִי
  choice: ang mga Cananeo
  rationale: Isinalin bilang maramihang katawagan sa pangkat-etniko, alinsunod sa kolektibong gamit ng anyong pang-isahan sa Hebreo.
- source_word: הַגִּרְגָּשִׁי
  choice: ang mga Gergeseo
  rationale: Ginamit ang nakaugaliang Tagalog na anyo ng pangalan at ang “mga” upang malinaw na tukuyin ang buong pangkat ng mga tao.
- source_word: הַיְבוּסִי
  choice: ang mga Jebuseo
  rationale: Ginamit ang nakaugaliang Tagalog na katawagan sa pangkat at ang maramihang “mga,” na tumutugma sa kolektibong kahulugan ng Hebreo.
