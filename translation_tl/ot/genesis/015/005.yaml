base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/005.yaml
  text: Then he brought him outside and said[a], “Please look toward the heavens and count the stars, if you are able to count them.” Then he said to him, “So shall your offspring be.”
translation:
  language: tl
  text: Pagkatapos, dinala niya si Abram sa labas at sinabi, “Tumingin ka nga sa langit at bilangin mo ang mga bituin, kung kaya mong bilangin ang mga iyon.” At sinabi niya sa kanya, “Ganyan karami ang magiging binhi mo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo mo.” Ang salitang Hebreo ay isahan sa anyo ngunit maaaring tumukoy nang sama-sama sa mga supling o inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא אֹתוֹ הַחוּצָה
  choice: dinala niya si Abram sa labas
  rationale: Ipinahahayag ng Hiphil ng יצא ang pagpapalabas o pagdadala sa labas. Ginamit ang pangalang “Abram” mula sa agarang konteksto upang maiwasan ang malabong sunod-sunod na panghalip sa natural na Tagalog.
- source_word: הַבֶּט נָא
  choice: Tumingin ka nga
  rationale: Ang “tumingin” ay malinaw na katumbas ng pautos na הבט, habang ang “nga” ay natural na nagpapalambot o nagbibigay-diin sa pakiusap, gaya ng נָא.
- source_word: הַשָּׁמַיְמָה
  choice: sa langit
  rationale: Ipinahihiwatig ng anyong patungo ang pagharap o pagtingin paitaas. Ang “sa langit” ang pinakanatural na makabagong Tagalog sa kontekstong astronomiko.
- source_word: וּסְפֹר הַכּוֹכָבִים
  choice: at bilangin mo ang mga bituin
  rationale: Tuwirang ipinapahayag ang pagbilang o pag-iisa-isa sa mga bituin.
- source_word: אִם תּוּכַל לִסְפֹּר אֹתָם
  choice: kung kaya mong bilangin ang mga iyon
  rationale: Pinananatili ang kondisyon at ang diin sa kakayahang bilangin ang mga bituin.
- source_word: כֹּה יִהְיֶה זַרְעֶךָ
  choice: Ganyan karami ang magiging binhi mo
  rationale: Ang “ganyan karami” ay likas na Tagalog na naghahatid ng paghahambing sa di-mabilang na mga bituin. Pinananatili ng “binhi” ang kongkretong larawan at ang kolektibong saklaw ng זֶרַע.
theological_decisions:
- issue: Ang isahan ngunit kolektibong kahulugan ng זַרְעֶךָ sa pangako kay Abram
  choice: binhi mo
  alternative: mga inapo mo / lahi mo
  rationale: Ang “binhi” ay nagpapanatili sa anyong isahan at sa posibilidad ng kolektibong kahulugan, kaya hindi agad nilulutas ang teolohikal na tensiyon sa pagitan ng isang binhi at ng maraming inapo. Nililinaw sa talababa ang karaniwang kolektibong gamit nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nga” upang natural na katawanin ang magalang o mapilit na himig ng נָא, at “binhi” upang mapanatili ang mahalagang leksikal at teolohikal na ambiguwidad ng Hebreo.
