base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/003.yaml
  text: Then Abram said[a], “Behold, you have given me no offspring, and behold[b], a son of my household will inherit me.”
translation:
  language: tl
  text: At sinabi ni Abram, “Tingnan mo, hindi mo ako binigyan ng supling, at narito, isang anak ng aking sambahayan ang magmamana sa akin[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magmamana ng aking ari-arian,” o mas malayang “magiging tagapagmana ko.” Literal sa Hebreo, “isang anak ng aking sambahayan ang nagmamana sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa salaysay na Tagalog ang “At sinabi” habang pinananatili ang pagkakasunod.
- source_word: הֵן
  choice: Tingnan mo
  rationale: Pantawag-pansin at pandiin ang particle; ang “Tingnan mo” ay makabago, natural, at tuwirang nakatuon sa kausap.
- source_word: לִי לֹא נָתַתָּה זָרַע
  choice: hindi mo ako binigyan ng supling
  rationale: Likas na Tagalog ito para sa di-tuwirang layon na לִי at sa natapos na kalagayang inirereklamo ni Abram. Ang “supling” ay tumutukoy sa anak o lahi, hindi sa literal na binhi.
- source_word: וְהִנֵּה
  choice: kaya
  rationale: Sa konteksto, ipinakikita ng ikalawang sugnay ang bunga ng kawalan ni Abram ng supling. Ang “kaya” ay malinaw at natural sa Tagalog, bagaman mas literal ang “at narito.”
- source_word: בֶן בֵּיתִי
  choice: isang anak ng aking sambahayan
  rationale: Pinananatili nito ang literal na larawang “anak ng aking bahay” nang hindi ipinapalagay na alipin ang taong tinutukoy.
- source_word: יוֹרֵשׁ אֹתִי
  choice: ang magmamana sa akin
  rationale: Pinananatili ang di-karaniwang tuwirang layon na “ako” sa Hebreo at ang pahiwatig ng tagapagmana, nang hindi tahasang pinapalitan ito ng interpretibong “magmamana ng aking ari-arian.”
theological_decisions:
- issue: Katayuan ng taong magmamana kay Abram
  choice: isang anak ng aking sambahayan
  alternative: isang aliping ipinanganak sa aking sambahayan
  rationale: Hindi tahasang ginagamit sa talata ang salitang “alipin.” Iniiwasan ng salin ang pagdaragdag ng mas tiyak na katayuang panlipunan kaysa sa sinasabi ng Hebreo.
- issue: Layon ng pandiwang “magmana”
  choice: magmamana sa akin
  alternative: magmamana ng aking ari-arian / magiging tagapagmana ko
  rationale: Ang Hebreo ay literal na may layong “ako.” Pinananatili ng teksto ang kakaibang pahayag at inilalagay sa talababa ang mas interpretibong mga pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “sambahayan” upang mapanatili ang saklaw ng sambahayang pinamumunuan ni Abram, at ang “supling” para sa kolektibong diwa ng זֶרַע. Isang talababa lamang ang inilagay at ang pananda [a] ay nasa pangunahing teksto.
