translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang nakaugaliang hulaping -eo sa pagsasalin ng ilang sinaunang etnonimo at ang “mga” upang ihayag ang kolektibong diwa. Pinanatili ang em dash dahil nagpapatuloy ang talaan sa kasunod na talata.
