  text: the Kenites[a], the Kenizzites, and the Kadmonites—
translation:
  language: tl
  text: ang mga Keneo, ang mga Kenizeo, at ang mga Kadmoneo—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶת
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Pananda ito ng tuwirang layon sa Hebreo at walang hiwalay na katumbas sa Tagalog; makikita ang gamit nito sa talaan ng mga bayang kabilang sa layon ng mas malaking pangungusap.
- source_word: הַקֵּינִי
  choice: ang mga Keneo
  rationale: Etnonimong may pantukoy na tumutukoy nang pangkatan sa isang bayan; ang “mga” ay likas na naghahayag ng kolektibong kahulugan sa Tagalog.
- source_word: וְאֶת
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Ang וְ ay likas na naipahihiwatig ng ayos ng talaan, samantalang ang אֶת ay pananda ng tuwirang layon; hindi kailangan ang hiwalay na “at” sa bawat kasunod na item sa natural na Tagalog.
- source_word: הַקְּנִזִּי
  choice: ang mga Kenizeo
  rationale: Kolektibong etnonimo ito sa talaan ng mga bayan; ginamit ang anyong pangmaramihan upang malinaw na isang pangkat ng mga tao ang tinutukoy.
- source_word: וְאֵת
  choice: at ang
  rationale: Pinagdurugtong ng וְ ang huling item sa talaan, at ang אֵת ay hindi isinasalin nang hiwalay.
- source_word: הַקַּדְמֹנִי
  choice: ang mga Kadmoneo
  rationale: Bagaman kaugnay ang salita sa “silangan” o “taga-silangan,” gumaganap ito rito bilang etnonimo na kapantay ng iba pang pangalan ng mga bayan; pinanatili ang bisa nito bilang pangalang pantangi.
