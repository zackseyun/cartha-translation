  yaml_path: translation/ot/genesis/015/012.yaml
  text: As the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
translation:
  language: tl
  text: Habang papalubog ang araw, dumapo kay Abram ang mahimbing na pagtulog[a]. At narito, nilulukob siya ng isang matindi at madilim na sindak[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kawalan ng ulirat.” Ang salitang Hebreo ay maaaring tumukoy sa isang di-pangkaraniwang malalim na tulog, na marahil ay dulot ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “matinding sindak ng kadiliman” o “matinding sindak at kadiliman.” Pinagsasama ng Hebreo sa isang siksik na parirala ang mga ideya ng sindak at kadiliman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ לָבוֹא
  choice: Habang papalubog ang araw
  rationale: Likas na ipinahahayag sa modernong Tagalog ang temporal na tagpo at ang nagpapatuloy na paglapit ng paglubog ng araw, nang hindi nagdaragdag ng tahasang salitang katumbas ng “ngayon.”
- source_word: תַרְדֵּמָה
  choice: mahimbing na pagkakatulog
  rationale: Tuwirang inilalarawan nito ang di-pangkaraniwang malalim na tulog; hindi nito agad ipinapalagay na kawalan ng malay o pangitain lamang.
- source_word: נָפְלָה עַל אַבְרָם
  choice: dumapo kay Abram
  rationale: Pinananatili ang larawang may isang bagay na dumarating o lumalapat sa isang tao, ngunit iniiwasan ang di-likas na “bumagsak kay Abram ang pagkakatulog.”
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang bigla at dramatikong pagtawag-pansin ng Hebreo sa isang marangal at pamilyar na anyong pampanitikan.
- source_word: אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: isang matindi at madilim na pangamba
  rationale: Pinananatili ang siksik at matingkad na pagsasama ng tindi, dilim, at pangamba sa Hebreo nang hindi tiyak na ginagawang hiwalay na pangyayari ang kadiliman.
- source_word: נֹפֶלֶת עָלָיו
  choice: nilulukob siya
  rationale: Natural na Tagalog ito para sa isang matinding damdamin o kalagayang dumarating at bumabalot sa tao, at naipahihiwatig ang nagpapatuloy at matingkad na aspekto ng participle.
- source_word: אַבְרָם
  choice: Abram
  rationale: Ginamit ang karaniwang transliterasyon ng pangalang Hebreo sa Tagalog.
theological_decisions:
- issue: Ang kalikasan ng תַרְדֵּמָה sa konteksto ng paghahayag
  choice: mahimbing na pagkakatulog
  alternative: pagkawalang-malay o kawalan ng ulirat
  rationale: Pinakamalapit sa karaniwang kahulugan ng salita ang malalim na tulog. Maaaring ipinadala ito ng Diyos sa konteksto, ngunit hindi iyon tahasang idinaragdag sa salin.
- issue: Ugnayan ng pangamba at kadiliman sa אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: matindi at madilim na pangamba
  alternative: matinding pangamba dahil sa kadiliman / matinding sindak ng kadiliman
  rationale: Hindi ganap na nililinaw ng siksik na pariralang Hebreo kung ang kadiliman ay katangian, pinagmulan, o kasabay ng pangamba. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ang “dumapo” at “nilulukob” ay nagpapanatili sa larawang may dumarating kay Abram, samantalang ang “At narito” ay nagpapanatili sa dramatikong tono ng salaysay.
