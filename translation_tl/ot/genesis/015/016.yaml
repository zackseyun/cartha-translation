  text: וְ/ד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא שָׁלֵ֛ם עֲוֺ֥ן הָ/אֱמֹרִ֖י עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/016.yaml
  text: And in the fourth generation they will return here[b][a], for the iniquity of the Amorites is not yet complete.
translation:
  language: tl
  text: At sa ikaapat na salinlahi ay babalik sila rito, sapagkat hindi pa lubos ang kasamaan ng mga Amoreo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “hindi pa lubos ang kasamaan ng Amoreo hanggang dito.” Ginagamit nang kolektibo ang “Amoreo” para sa buong pangkat ng mga tao; ang “hanggang dito” ay tumutukoy sa hindi pa pag-abot ng kanilang kasamaan sa ganap na sukat hanggang sa panahong iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֹור רְבִיעִי
  choice: At sa ikaapat na salinlahi
  rationale: Ang דּוֹר ay tumutukoy sa isang salinlahi, at ang רְבִיעִי ay ordinal na “ikaapat.” Ginamit ang “sa” upang likas na ipahayag sa Filipino ang panahong pagbabalikan.
- source_word: יָשׁוּבוּ
  choice: babalik sila
  rationale: Ang שׁוּב ay karaniwang nangangahulugang bumalik; pinananatili nito ang ideya ng muling pagdating ng mga inapo ni Abram sa lupaing ito.
- source_word: הֵנָּה
  choice: rito
  rationale: Ang deiktikong pang-abay ay tumutukoy sa lugar na kinaroroonan ng nagsasalita; natural sa Filipino ang “rito” kasunod ng pandiwang “babalik.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit hindi agad mangyayari ang pagbabalik; ang “sapagkat” ay malinaw at marangal na pang-ugnay.
- source_word: לֹא שָׁלֵם
  choice: hindi pa lubos
  rationale: Ang שָׁלֵם ay nagpapahiwatig ng pagiging ganap o pag-abot sa kabuuang sukat. Ang “hindi pa lubos” ay maikli at pinananatili ang temporal na diwa.
- source_word: עֲוֹן
  choice: kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, sala, o pananagutang bunga nito. Sa konteksto, ang “kasamaan” ay natural at sapat na malawak upang hindi ito paliitin sa pansariling pagkadama ng pagkakasala.
- source_word: הָאֱמֹרִי
  choice: ng mga Amoreo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo itong tumutukoy sa pangkat ng mga tao. Natural sa Filipino ang maramihang “mga Amoreo.”
- source_word: עַד הֵנָּה
  choice: pa
  rationale: Literal na “hanggang dito/ngayon.” Sa sugnay na nakatuon sa hinaharap, likas na naipapahayag ng “hindi pa lubos” ang hindi pa pag-abot sa itinakdang hangganan; nililinaw sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Pagkaantala ng pagbabalik at paghatol
  choice: Iniuugnay ng talata ang takdang panahon ng pagbabalik sa hindi pa pagiging lubos ng kasamaan ng mga Amoreo.
  alternative: Maaaring bigyang-diin ang pagtitiis ng Diyos sa mga Amoreo o ang paghubog sa Israel sa Ehipto.
  rationale: Ang mismong teksto ay nagbibigay ng dahilan tungkol sa kasamaan ng mga Amoreo ngunit hindi bumubuo ng mas malawak na paliwanag tungkol sa kalooban ng Diyos. Pinananatili ng salin ang tensiyong ito nang hindi nagdaragdag ng doktrina.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinili ang “salinlahi” para sa dignidad at linaw, “rito” para sa likas na deiktikong gamit, at “kasamaan” bilang malawak at karaniwang katumbas ng עָוֹן sa kontekstong ito.
