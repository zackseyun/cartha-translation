base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/010.yaml
  text: So he brought all these to him[a], cut them in two, and placed each half opposite the other[c][b]; but he did not cut the birds in two.
translation:
  language: tl
  text: Kaya dinala niya sa kanya ang lahat ng iyon[a], hinati niya ang mga iyon sa gitna, at inilagay niya ang bawat kalahati sa tapat ng kabilang kalahati[b]; ngunit hindi niya hinati ang mga ibon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kaya kinuha niya para sa kanya ang lahat ng iyon.”
    reason: Pinananatili ang posibleng mas literal na pagbasa sa pandiwang “kinuha” at ang bahagyang kalabuan ng לוֹ.
  - marker: b
    text: Sa literal, “inilagay ang bawat piraso sa tapat ng kapwa nito.”
    reason: Ipinakikita ang distributibong idyoma ng Hebreo at ang literal na katawagan sa mga pinaghating bahagi.
lexical_decisions:
- source_word: וַיִּקַּח לוֹ אֶת כָּל אֵלֶּה
  choice: Kaya dinala niya sa kanya ang lahat ng iyon
  rationale: Sa konteksto ng utos sa naunang talata na magdala para sa Diyos, natural na ipinahihiwatig ng לוֹ na dinala ni Abram sa kanya ang mga hayop. Ang “Kaya” ay angkop sa pagsunod ng salaysay sa utos.
- source_word: וַיְבַתֵּר אֹתָם בַּתָּוֶךְ
  choice: hinati sa gitna
  rationale: Ang בתר ay tumutukoy sa paghiwa o paghahati ng mga hayop sa mga bahagi, at malinaw na naipapahayag ng “hinati sa gitna” ang בַּתָּוֶךְ nang hindi dinaragdagan ang ritwal na paliwanag sa mismong talata.
- source_word: וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ
  choice: at inilagay ang bawat hati na katapat ng isa pang hati
  rationale: Pinananatili nito ang distributibong idyomang “bawat isa … ang kapwa nito” at ang ayos na magkaharap o magkatapat ang mga bahaging hiniwa.
- source_word: וְאֶת הַצִּפֹּר לֹא בָתָר
  choice: ngunit hindi niya hinati ang mga ibon
  rationale: Bagaman pang-isahang kolektibo ang הַצִּפֹּר, tumutukoy ito sa dalawang ibong binanggit sa naunang talata; kaya natural at malinaw sa Tagalog ang maramihang “mga ibon.”
theological_decisions:
- issue: Wika ng ritwal sa paggawa ng tipan
  choice: Inilarawan lamang ang paghahati at pag-aayos ng mga hayop
  alternative: Magdagdag ng tuwirang paliwanag na ito ay ritwal ng paggawa ng tipan
  rationale: Ipinakikita ng talata ang konkretong paghahanda para sa tipan, ngunit hindi nito mismo ipinaliliwanag ang kahulugan ng ritwal. Kaya pinananatili ang larawan at pahiwatig nang walang doktrinal na pagpapalawak.
- issue: Referente ng לוֹ
  choice: “sa kanya,” na tumutukoy sa Diyos sa konteksto
  alternative: “para sa sarili niya,” na tumutukoy kay Abram
  rationale: Posible sa anyo ang datibong pakinabang, ngunit ang utos sa talata 9 na kumuha o magdala “para sa akin” ay mas malakas na kontekstuwal na batayan para sa Diyos bilang referente. Hindi pinapangalanan ang Diyos sa salin upang mapanatili ang panghalip ng Hebreo.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “hinati sa gitna” at “bawat hati” upang madaling maunawaan ang konkretong kilos, habang iniwasan ang teknikal o denominasyonal na pagpapaliwanag.
