  terminology: Ang “hinati sa gitna” ay naaayon sa konkretong kilos ng Hebreo. Ang “kalahati” ay mas idiomatiko at mas eksakto kaysa “hati” sa kontekstong ang mga hayop ay hinati sa gitna.
