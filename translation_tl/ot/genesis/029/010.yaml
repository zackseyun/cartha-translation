translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Sadyang pinanatili ang tatlong ulit na pariralang pampamilya kahit may bahagyang pag-uulit sa Filipino, sapagkat kapansin-pansin at makabuluhan ang pag-uulit sa tekstong Hebreo.
