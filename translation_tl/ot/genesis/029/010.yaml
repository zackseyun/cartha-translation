base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/010.yaml
  text: And when Jacob saw Rachel[a], the daughter of Laban, his mother’s brother, and the flock of Laban, his mother’s brother, Jacob came near and rolled the stone from the mouth of the well, and watered the flock of Laban, his mother’s brother.
translation:
  language: tl
  text: Nang makita ni Jacob si Raquel[a], na anak ni Laban, na kapatid ng ina ni Jacob, at ang kawan ni Laban, na kapatid ng ina ni Jacob, lumapit si Jacob, iginulong ang bato mula sa bukana ng balon, at pinainom ang kawan ni Laban, na kapatid ng ina ni Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tatlong ulit na binabanggit sa Hebreo sa talatang ito na si Laban ay kapatid ng ina ni Jacob, na nagdiriin sa kaugnayan ni Jacob kay Laban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Likas na ipinahahayag ng “Nang” ang temporal na pag-usad ng salaysay nang hindi mekanikal na isinasalin ang pormulang Hebreo.
- source_word: רָאָה
  choice: makita
  rationale: Tuwirang tumutukoy sa visual na pagkakita at natural sa pagkakabuo ng pangungusap sa Filipino.
- source_word: בַּת לָבָן
  choice: anak ni Laban
  rationale: Hindi kailangang tukuyin ang kasarian sa salitang “anak” dahil malinaw na babae si Raquel; ito ang natural na anyo ng ugnayang pampamilya sa Filipino.
- source_word: אֲחִי אִמּוֹ
  choice: kapatid ng kanyang ina
  rationale: Pinananatili ang tahasang pananalita at tatlong ulit na pagbanggit sa Hebreo, sa halip na paikliin bilang “tiyuhin,” upang mapanatili ang diin sa kaugnayan ni Jacob kay Laban.
- source_word: צֹאן
  choice: kawan
  rationale: Kolektibong katawagan ito sa maliliit na alagang hayop at hindi nito nililimitahan ang tinutukoy sa mga tupa lamang.
- source_word: וַיִּגַּשׁ
  choice: lumapit
  rationale: Malinaw at natural na inilalarawan ang paglapit ni Jacob sa balon.
- source_word: וַיָּגֶל
  choice: iginulong
  rationale: Pinananatili ang kongkretong kilos ng paggulong sa bato, hindi lamang ang pangkalahatang ideya ng pag-aalis nito.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: mula sa bukana ng balon
  rationale: Ang “bukana” ang natural na katumbas sa Filipino ng Hebreong idyomang “bibig” para sa bungad o opening ng balon.
- source_word: וַיַּשְׁקְ
  choice: pinainom
  rationale: Ang anyong sanhi ng pandiwa ay nangangahulugang binigyan ng tubig ang kawan; “pinainom” ang maikli at natural na salin.
