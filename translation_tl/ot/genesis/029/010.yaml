  to: Nang makita ni Jacob si Raquel[a], na anak ni Laban, na kapatid ng ina ni Jacob, at ang kawan ni Laban, na kapatid ng ina ni Jacob, lumapit si Jacob, iginulong ang bato mula sa bukana ng balon, at pinainom ang kawan ni Laban, na kapatid ng ina ni Jacob.
