  text: So Jacob served seven years for Rachel[a], and they seemed like only a few days to him because of his love for her.
translation:
  language: tl
  text: Naglingkod si Jacob nang pitong taon para kay Raquel, at ang mga iyon ay tila ilang araw lamang para sa kanya dahil sa pag-ibig niya kay Raquel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at ang mga iyon ay naging gaya ng ilang araw sa paningin niya.”
    reason: Ipinakikita ang kongkretong Hebreong idyoma sa likod ng natural na saling “tila … para sa kanya.”
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: naglingkod
  rationale: Ang עבד ay maaaring mangahulugang maglingkod o magtrabaho. Sa kontekstong ito, tumutukoy ito sa paglilingkod ni Jacob bilang napagkasunduang kapalit upang mapangasawa si Raquel; pinananatili ng “naglingkod” ang ugnayang nakapaloob sa kasunduan.
- source_word: בְּרָחֵל
  choice: para kay Raquel
  rationale: Idyomatiko rito ang ב at tumutukoy sa paglilingkod na ginawa kaugnay ng pagkuha kay Raquel bilang asawa. Natural sa Tagalog ang “para kay Raquel” at hindi nito labis na ipinapaliwanag ang konteksto.
- source_word: שֶׁבַע שָׁנִים
  choice: nang pitong taon
  rationale: Tuwirang salin ng tagal ng paglilingkod; ang “nang” ang natural na pananda ng haba ng panahon sa pangungusap.
- source_word: וַיִּהְיוּ בְעֵינָיו
  choice: ang mga iyon ay tila … para sa kanya
  rationale: Ang literal na “nasa kanyang mga mata” ay isang idyoma ng pansariling pananaw. Malinaw at natural na ipinahahayag ng “tila … para sa kanya” ang diwa nito.
- source_word: כְּיָמִים אֲחָדִים
  choice: ilang araw lamang
  rationale: Ang parirala ay literal na naghahambing sa pitong taon sa kakaunting araw. Ipinahahayag ng “lamang” ang diin sa kaiklian nang hindi binabago ang paghahambing.
- source_word: בְּאַהֲבָתוֹ אֹתָהּ
  choice: dahil sa pag-ibig niya kay Raquel
  rationale: Ang prefixed ב ay nagpapahayag dito ng dahilan o kalagayan. Iniiwasan ng pag-uulit sa pangalang “Raquel” ang maaaring kalabuan ng panghalip sa natural na Tagalog.
