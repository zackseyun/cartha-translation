- from: Tumingin siya, at naroon ang isang balon sa parang. Naroon din ang tatlong kawan ng mga tupa na nakahimlay sa tabi nito, sapagkat mula sa balong iyon pinaiinom ang mga kawan. May malaking bato sa bunganga ng balon.[a]
  to: Tumingin siya, at naroon ang isang balon sa parang. Naroon din ang tatlong kawan ng mga tupa na nakahimlay sa tabi nito, sapagkat mula sa balong iyon pinaiinom ang mga kawan. At may malaking bato sa ibabaw ng bunganga ng balon.[a]
  rationale: Pinalitan ang pangwakas na sugnay upang tahasang maipahayag na ang malaking bato ay nasa ibabaw ng bukana ng balon, alinsunod sa Hebreong pang-ukol. Walang binagong kahulugan sa iba pang bahagi ng talata.
