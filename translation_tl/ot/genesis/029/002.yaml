base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/002.yaml
  text: He looked[a], and behold, there was a well in the field, and behold, three flocks of sheep were lying there beside it, because from that well they watered the flocks[e][d][c][b]. And the stone on the mouth of the well was large.
translation:
  language: tl
  text: Tumingin siya, at naroon ang isang balon sa parang. Naroon din ang tatlong kawan ng mga tupa na nakahimlay sa tabi nito, sapagkat mula sa balong iyon pinaiinom ang mga kawan. At may malaking bato sa ibabaw ng bunganga ng balon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa bibig ng balon,” ibig sabihin, sa ibabaw ng bukana nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Tumingin siya
  rationale: Isinusulong ng wayyiqtol ng ראה ang salaysay at ipinakikita ang sadyang pagpansin ni Jacob sa tanawin; posible rin ang “nakita niya,” ngunit mas buhay rito ang “tumingin siya.”
- source_word: וְהִנֵּה ... וְהִנֵּה
  choice: naroon ... naroon din
  rationale: Ang הִנֵּה ay pantawag-pansin na nagpapatingkad sa biglang namalas. Pinananatili ng pag-uulit ang bisa nito sa natural na modernong Tagalog nang hindi gumagamit ng lipas na “narito.”
- source_word: בְאֵר בַּשָּׂדֶה
  choice: isang balon sa parang
  rationale: Ang בְאֵר ay karaniwang “balon,” at ang שׂדה rito ay bukás na lupa o pastulan; mas natural sa pastoral na tagpo ang “parang” kaysa “bukid,” na maaaring magpahiwatig ng sinasakang lupa.
- source_word: שְׁלֹשָׁה עֶדְרֵי צֹאן
  choice: tatlong kawan ng mga tupa
  rationale: Ang עֵדֶר ay kawan, at ang צֹאן ay maliliit na alagang hayop, lalo na tupa at kambing. Ang “mga tupa” ay malinaw at angkop sa konteksto.
- source_word: רֹבְצִים עָלֶיהָ
  choice: nakahimlay sa tabi nito
  rationale: Ang רבץ ay paghimlay o pagpapahinga ng mga hayop. Bagaman literal na “sa ibabaw/ibabaw nito” ang pang-ukol, sa balon ay likas itong tumutukoy sa kalapitan, kaya “sa tabi nito.”
- source_word: יַשְׁקוּ הָעֲדָרִים
  choice: pinaiinom ang mga kawan
  rationale: Ang Hiphil ng שׁקה ay “painumin.” Ang anyong walang tahasang simuno ay natural na naihahayag sa Tagalog sa impersonal na “pinaiinom,” nang hindi nagdaragdag kung sino ang nagpapainom.
- source_word: וְהָאֶבֶן גְּדֹלָה עַל פִּי הַבְּאֵר
  choice: May malaking bato sa bunganga ng balon
  rationale: Ang “bunganga ng balon” ay malapit sa larawang Hebreo na “bibig ng balon” at malinaw na tumutukoy sa bukana nito; ang umiiral na sugnay ay natural sa Tagalog at naghahanda sa susunod na kilos.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang dalawang pantawag-pansing הִנֵּה sa magkatugmang “naroon ... naroon din,” at iniwasan ang sobrang literal ngunit di-likas na mga parirala.
