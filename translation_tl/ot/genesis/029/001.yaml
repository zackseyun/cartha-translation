lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב רַגְלָיו
  choice: nagpatuloy sa paglalakbay si Jacob
  rationale: Ang literal na idyomang “itinaas ni Jacob ang kanyang mga paa” ay nangangahulugang muli siyang humayo o nagpatuloy sa paglalakbay. Pinananatili ng salin ang diwa ng masiglang pagpapatuloy nang natural sa modernong Tagalog.
- source_word: אַרְצָה בְנֵי קֶדֶם
  choice: sa lupain ng mga taga-silangan
  rationale: Ang בְּנֵי־קֶדֶם ay literal na “mga anak ng silangan,” ngunit karaniwang tumutukoy sa mga taong naninirahan sa silangan. Ang “mga taga-silangan” ay malinaw at likas sa Tagalog nang hindi labis na tinutukoy ang kanilang etnikong pagkakakilanlan.
