  text: When the LORD saw that Leah was hated, he opened her womb, but Rachel was barren.
translation:
  language: tl
  text: Nang makita ni Yahweh na kinapopootan si Lea, binuksan niya ang sinapupunan ni Lea, ngunit baog si Raquel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos sa isang kinikilalang anyong Tagalog sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: שְׂנוּאָה
  choice: kinapopootan
  rationale: Pinananatili ang tuwirang lakas ng Hebreong salita na nangangahulugang “kinamumuhian/kinapopootan,” sa halip na pahinain bilang “hindi minamahal.”
- source_word: וַיִּפְתַּח אֶת־רַחְמָהּ
  choice: binuksan niya ang sinapupunan nito
  rationale: Pinananatili ang konkretong idyoma ng Hebreo at malinaw na tumutukoy kay Lea ang panghalip.
- source_word: עֲקָרָה
  choice: baog
  rationale: Natural at tuwirang salitang Tagalog para sa kawalan ng kakayahang magkaanak sa kontekstong ito.
theological_decisions:
- issue: Lakas ng paglalarawan sa kalagayan ni Lea
  choice: kinapopootan
  alternative: hindi minamahal
  rationale: Ang Hebreo ay gumagamit ng salitang “hated”; hindi tahimik na nilulutas o pinahihina ang tensiyon sa salaysay.
- issue: Paglalahad sa banal na pangalan
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ang pinagmulang teksto ay may tetragrammaton, isang personal na pangalan; pinananatili ito nang tuwiran at walang idinadagdag na denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nito” upang maiwasan ang kalituhan sa tinutukoy ng panghalip, habang nananatiling maikli at malapit sa estruktura ng Hebreo.
