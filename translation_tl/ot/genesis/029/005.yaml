base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/005.yaml
  text: He said to them[a], “Do you know Laban son of Nahor?” They said, “We know him.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Kilala ba ninyo si Laban na anak ni Nahor?” Sumagot sila, “Kilala namin siya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Kilala namin”; ipinahihiwatig ng konteksto ang “siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Sinabi niya sa kanila
  rationale: Isinasalaysay ng waw-consecutive ang kasunod na pangyayari; natural sa makabagong Tagalog na hindi na isalin nang hiwalay ang panimulang pangatnig.
- source_word: הֲיְדַעְתֶּם
  choice: Kilala ba ninyo
  rationale: Ang יָדַע sa kontekstong ito ay tumutukoy sa pagkakilala sa isang tao, kaya mas natural at tiyak ang “kilala” kaysa “alam.”
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Ang pananda ng tuwirang layon sa Hebreo ay walang hiwalay na katumbas dito; naipapakita ang tungkulin nito sa pamamagitan ng “si Laban.”
- source_word: לָבָן
  choice: Laban
  rationale: Isinalin sa karaniwang anyo ng pangalang pantangi sa Tagalog.
- source_word: בֶּן נָחוֹר
  choice: anak ni Nahor
  rationale: Pinananatili ang tuwirang kahulugan ng בֶּן bilang “anak,” nang hindi ito pinalalawak sa “inapo.”
- source_word: וַיֹּאמְרוּ
  choice: Sumagot sila
  rationale: Bagaman literal na “sinabi nila,” malinaw na tugon ito sa tanong; ang “sumagot sila” ang natural na salaysay sa Tagalog nang hindi binabago ang kilos.
- source_word: יָדָעְנוּ
  choice: Kilala namin siya
  rationale: Inuulit ng “kilala” ang ugat at diwa ng pandiwa sa tanong. Idinagdag ang “siya,” na ipinahihiwatig ng konteksto, upang maging natural at malinaw sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang “ninyo” at “namin” bilang natural na mga panghalip at pinanatili ang pag-uulit ng “kilala” mula sa tanong hanggang sa sagot.
