lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Nang gabing iyon
  rationale: Likas na salaysay sa modernong Tagalog ang pariralang ito para sa Hebreong pormulang nagtatakda ng sumunod na pangyayari sa gabi.
- source_word: וַיִּקַּח אֶת־לֵאָה בִתּוֹ
  choice: kinuha ni Laban ang anak niyang si Lea
  rationale: Pinananatili ang payak na kahulugan ng לקח at ang ugnayang 'Lea, kanyang anak.' Isinaad ang pangalang Laban, na malinaw sa konteksto, upang maiwasan ang malabong sunod-sunod na panghalip sa Tagalog.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו
  choice: at dinala ito kay Jacob
  rationale: Ang Hiphil ng בוא ay tuwirang nangangahulugang 'dalhin.' Isinaad si Jacob bilang tinutukoy ng panghalip upang maging malinaw at natural sa Tagalog.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: At sinipingan ni Jacob si Lea
  rationale: Ang בוא אל ay karaniwang Hebreong idyoma para sa pakikipagtalik. Ang 'sinipingan' ay maikli, marangal, at eupemistikong katumbas sa Tagalog nang hindi ginagawang mas tahasan kaysa sa orihinal.
