translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang konkretong kilos ng paghalik at ang Hebreong pagtukoy sa tinig, ngunit inayos ang idyoma upang maging malinaw sa karaniwang mambabasa.
