  text: Then Jacob kissed Rachel[a], and he lifted up his voice and wept.
translation:
  language: tl
  text: Pagkatapos, hinalikan ni Jacob si Raquel[a]. Itinaas niya ang kanyang tinig at umiyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “binati ni Jacob si Raquel sa pamamagitan ng isang halik.” Karaniwang nangangahulugang “humalik” ang pandiwang Hebreo, ngunit sa kontekstong ito ay maaari rin itong tumukoy sa pagbati ng magkakamag-anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁק
  choice: hinalikan
  rationale: Ang qal ng נשק ay karaniwang nangangahulugang pisikal na paghalik. Tuwiran itong isinalin, habang inilalagay sa talababa ang posibleng gamit nito bilang pampamilyang pagbati sa kontekstong ito.
- source_word: לְרָחֵל
  choice: si Raquel
  rationale: Ang לְ ay nagmamarka sa taong hinalikan. Sa natural na Tagalog, ginagamit ang pantukoy na “si” para sa tuwirang layon na pangalang pantangi.
- source_word: וַיִּשָּׂא אֶת־קֹלוֹ
  choice: Inilakas niya ang kanyang tinig
  rationale: Idyoma ito na nagpapahiwatig ng malakas at naririnig na pag-iyak. Pinananatili ng salin ang pagtukoy sa “tinig” nang hindi gumagamit ng di-likas na literalismong “itinaas ang kanyang tinig.”
- source_word: וַיֵּבְךְּ
  choice: umiyak
  rationale: Ang בכה ay nangangahulugang umiyak o tumangis. Ang “umiyak” ay natural, marangal, at hindi nagdaragdag ng antas ng dalamhati na hindi tahasang tinutukoy ng pandiwa.
- source_word: וַ
  choice: Pagkatapos
  rationale: Ang sunod-sunod na waw-consecutive ay nagpapausad sa salaysay. Ang “Pagkatapos” ay malinaw na nagpapahayag ng pagkakasunod-sunod sa modernong Tagalog.
