base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/032.yaml
  text: Leah conceived and bore a son[a], and she called his name Reuben, for she said, “Because Yahweh has seen my affliction, now my husband will love me.”
translation:
  language: tl
  text: Nagdalang-tao si Lea at nagsilang ng isang anak na lalaki. Pinangalanan niya itong Ruben[a], sapagkat sinabi niya, “Nakita ni Yahweh ang paghihirap ko; ngayon ay mamahalin ako ng aking asawa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Ruben ay kahawig ng tunog ng mga salitang Hebreo para sa “tingnan, isang anak na lalaki,” at iniuugnay rito sa sinabi ni Lea na nakita ni Yahweh ang kanyang paghihirap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: Nagdalang-tao
  rationale: Likas at malinaw na modernong Tagalog para sa paglilihi o pagbubuntis sa salaysay ng kapanganakan.
- source_word: וַתֵּלֶד בֵּן
  choice: nagsilang ng isang anak na lalaki
  rationale: Tumpak na inilalarawan ang panganganak at pinananatili ang tiyak na kasarian ng בֵּן.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Pinangalanan niya itong
  rationale: Natural sa modernong Tagalog at malinaw na naihahatid ang Hebreong pormula ng pagbibigay-pangalan.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Ginagamit ang karaniwang anyo ng pangalan sa Tagalog; ipinaliliwanag sa talababa ang Hebreong paglalaro sa tunog at kahulugan.
- source_word: כִּי רָאָה יְהוָה
  choice: Nakita ni Yahweh
  rationale: Direktang pinananatili ang pandiwang ראה, na mahalaga sa paliwanag sa pangalang Ruben, at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: בְּעָנְיִי
  choice: ang paghihirap ko
  rationale: Natural at marangal na Tagalog para sa dinaranas na pagdurusa o kaapihan ni Lea.
- source_word: כִּי עַתָּה
  choice: kaya ngayon
  rationale: Sa konteksto, inihahayag nito ang inaasahang resulta ng pagkakita ni Yahweh at ng pagsilang sa anak.
- source_word: יֶאֱהָבַנִי אִישִׁי
  choice: mamahalin na ako ng aking asawa
  rationale: Pinananatili ang emosyonal at pangmag-asawang diwa; ipinahihiwatig ng “na” ang pag-asa ni Lea sa pagbabago ngayon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito sa transliterasyong Yahweh sa halip na palitan ng isang titulo.
- issue: Ugnayan ng dalawang sugnay na כִּי sa sinabi ni Lea
  choice: “Nakita ni Yahweh…; kaya ngayon…”
  alternative: “Sapagkat nakita ni Yahweh…; sapagkat ngayon…”
  rationale: Maaaring magkaroon ng iba’t ibang gamit ang כִּי. Dito, natural na ipinapakita ng ikalawang sugnay ang inaasahang bunga nang hindi ginagawang katiyakan ng tagapagsalaysay ang pag-asa ni Lea.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “nagdalang-tao” at “nagsilang” upang mapanatili ang maikli ngunit pormal na himig ng salaysay; ang kuwit bago ang talababa ay inilagay ayon sa natural na bantas sa Filipino.
