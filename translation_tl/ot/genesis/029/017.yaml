translation:
  language: tl
  text: Malalambot[a] ang mga mata ni Lea, ngunit si Raquel ay maganda ang hubog at kaanyuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malumanay,” “maselan,” o “mahihina.” Maaaring magpahiwatig ang salitang Hebreo ng lambot o pagiging maselan; hindi tiyak ang eksaktong diwa rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: mga mata
  rationale: Tuwirang tumutukoy ang construct plural sa mga mata ni Lea, hindi sa pangkalahatan niyang anyo.
- source_word: רַכּוֹת
  choice: malalambot
  rationale: Pinananatili nito ang pangunahing diwa ng lambot nang hindi agad ipinapalagay ang negatibong kahulugang “mahihina”; inilalahad sa talababa ang tunay na kalabuan.
- source_word: יְפַת תֹּאַר
  choice: maganda ang hubog
  rationale: Tumutukoy ang parirala sa pisikal na anyo o hubog ng katawan at natural itong pakinggan sa makabagong Tagalog.
- source_word: וִיפַת מַרְאֶה
  choice: at kaanyuan
  rationale: Pinananatiling naiiba ang nakikitang kaanyuan mula sa hubog, habang ang iisang “maganda” ay natural na sumasaklaw sa kapuwa parirala.
- source_word: וְ
  choice: ngunit
  rationale: Bagaman karaniwang nangangahulugang “at,” contrastive ang gamit nito rito sa paghahambing kina Lea at Raquel.
