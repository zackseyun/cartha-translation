  yaml_path: translation/ot/genesis/029/003.yaml
  text: And all the flocks would gather there[a], and they would roll the stone away from the mouth of the well and water the flock[b], and then put the stone back in its place over the mouth of the well.
translation:
  language: tl
  text: Doon nagtitipon ang lahat ng kawan. Iginugulong nila ang bato mula sa bukana[a] ng balon at pinaiinom ang mga tupa. Pagkatapos, ibinabalik nila ang bato sa puwesto nito, sa ibabaw ng bukana ng balon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bibig ng balon,” isang idyoma para sa bukana ng balon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶאֶסְפוּ
  choice: nagtitipon
  rationale: Ang Niphal imperfect ay naglalarawan dito ng nakaugalian o paulit-ulit na kilos; likas sa Tagalog ang pangkasalukuyang anyong “nagtitipon” para sa ganitong pangkalahatang gawain.
- source_word: כָל הָעֲדָרִים
  choice: lahat ng kawan
  rationale: Tumutukoy ang עֲדָרִים sa mga pangkat ng maliliit na alagang hayop; ang “kawan” ang karaniwang salitang pastoral sa Tagalog.
- source_word: וְגָלֲלוּ אֶת הָאֶבֶן
  choice: iginugulong nila ang bato
  rationale: Pinananatili ng “iginugulong” ang kongkretong larawan ng pag-aalis sa bato sa pamamagitan ng pagpapagulong, sa halip na gawing pangkalahatang “inaalis.”
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: mula sa bukana ng balon
  rationale: Ang literal na “bibig ng balon” ay isang idyomang Hebreo para sa bukasan nito; “bukana” ang malinaw at likas na katumbas sa modernong Tagalog.
- source_word: וְהִשְׁקוּ אֶת הַצֹּאן
  choice: pinaiinom ang mga tupa
  rationale: Ang Hiphil ng שׁקה ay nangangahulugang magbigay ng tubig o magpainom. Ipinahahayag ng “pinaiinom” ang causative na diwa, at ang “mga tupa” ay natural na kolektibong pagtukoy sa צֹאן sa konteksto.
- source_word: וְהֵשִׁיבוּ אֶת הָאֶבֶן
  choice: ibinabalik nila ang bato
  rationale: Ang Hiphil ng שוב ay nagpapahiwatig ng pagpapabalik sa dating kinalalagyan; tuwiran at natural ang “ibinabalik.”
- source_word: עַל פִּי הַבְּאֵר לִמְקֹמָהּ
  choice: sa dating lugar nito sa ibabaw ng bukana ng balon
  rationale: Pinananatili nito kapwa ang pagbabalik sa wastong lugar ng bato at ang posisyon nitong nakapatong o nakatakip sa bukana.
