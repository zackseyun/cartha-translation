  yaml_path: translation/ot/genesis/029/004.yaml
  text: Jacob said to them[a], “My brothers, where are you from?” They said[b], “We are from Haran.”
translation:
  language: tl
  text: Sinabi ni Jacob sa kanila, “Mga kapatid ko[a], taga-saan kayo?” Sinabi nila, “Taga-Haran kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid ko” ay magalang na pantawag dito; hindi ito nangangahulugang tunay silang magkakamag-anak.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Sinabi ni Jacob sa kanila
  rationale: Pinananatili ang karaniwang pandiwa ng pagsasalita na אמר bilang “sinabi” at ang לָהֶם bilang “sa kanila”; hindi kailangang gawing “tinanong” dahil malinaw na tanong ang kasunod.
- source_word: אַחַי
  choice: Mga kapatid
  rationale: Likas na magalang na pantawag sa isang pangkat ng mga lalaki sa Filipino. Bagaman literal na “mga kapatid ko,” hindi kinakailangang nagpapahayag dito ng tunay na pagkakamag-anak.
- source_word: מֵאַיִן אַתֶּם
  choice: taga-saan kayo
  rationale: Ipinahahayag ng מֵאַיִן ang pinagmulan. Ang “taga-saan kayo?” ay natural at malinaw sa makabagong Filipino.
- source_word: וַיֹּאמְרוּ
  choice: Sumagot sila
  rationale: Ang literal na kahulugan ay “sinabi nila,” ngunit sa palitan ng tanong at tugon, natural na katumbas sa Filipino ang “sumagot sila” nang hindi binabago ang diwa.
- source_word: מֵחָרָן אֲנָחְנוּ
  choice: Taga-Haran kami
  rationale: Ang מִן ay nagsasaad ng pinagmulan, at likas na ipinapahayag sa Filipino sa hulma na “taga-Haran kami.”
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “taga-saan” at “taga-Haran” bilang karaniwang paraan ng pagtukoy sa pinagmulan, habang pinanatili ang magalang na tono ng pakikipag-usap ni Jacob.
