  to: Muli siyang nagdalang-tao at nagsilang ng isang anak na lalaki. Sinabi niya, “Dahil narinig ni Yahweh na kinamumuhian ako[a], ibinigay niya rin sa akin ang anak na ito.” Kaya pinangalanan niya itong Simeon.[b]
