base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/033.yaml
  text: Then she conceived again and bore a son[a], and said, “Because Yahweh has heard that I am hated[b], he has given me this one also.” So she called his name Simeon.
translation:
  language: tl
  text: Muli siyang nagdalang-tao at nagsilang ng isang anak na lalaki. Sinabi niya, “Dahil narinig ni Yahweh na kinamumuhian ako[a], ibinigay niya rin sa akin ang anak na ito.” Kaya pinangalanan niya itong Simeon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi ako minamahal” o “hindi ako gaanong minamahal.” Literal na “kinamumuhian” ang salitang Hebreo, ngunit sa konteksto ay maaari itong tumukoy sa pagtatakwil o sa pagiging hindi gaanong minamahal.
    reason: lexical_alternative
  - marker: b
    text: Ang pangalang Simeon ay kaugnay ng salitang Hebreo para sa “narinig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Muli siyang nagdalang-tao
  rationale: Ipinahahayag ng עוֹד ang pag-uulit, at natural sa makabagong Filipino ang “muling nagdalang-tao” habang malinaw na naipagpapatuloy ang salaysay.
- source_word: וַתֵּלֶד בֵּן
  choice: at nagsilang ng isang anak na lalaki
  rationale: Tuwirang inilalarawan nito ang panganganak at pinananatili ang tiyak na kahulugan ng בֵּן bilang anak na lalaki.
- source_word: כִּי שָׁמַע יְהוָה
  choice: Dahil narinig ni Yahweh
  rationale: Ang כִּי ay nagbibigay ng dahilan sa sinabi ni Lea. Ang “narinig” ay natural na anyong naganap sa Filipino at ang יְהוָה ay pinanatiling personal na pangalang “Yahweh.”
- source_word: כִּי שְׂנוּאָה אָנֹכִי
  choice: na kinamumuhian ako
  rationale: Pinananatili ng “kinamumuhian” ang malakas at payak na leksikal na diwa ng שְׂנוּאָה nang hindi idinaragdag kung sino ang namumuhi. Inilalahad sa talababa ang posibleng kontekstuwal na diwang paghahambing.
- source_word: וַיִּתֶּן לִי גַּם אֶת זֶה
  choice: ibinigay din niya sa akin ang isang ito
  rationale: Pinananatili ng “din” ang גַּם at ng “ang isang ito” ang demonstratibong אֶת זֶה, na tumutukoy sa bagong silang na anak nang hindi inuulit ang salitang “anak.”
- source_word: וַתִּקְרָא שְׁמוֹ שִׁמְעוֹן
  choice: Kaya pinangalanan niya itong Simeon
  rationale: Natural sa Filipino ang pormulang ito ng pagbibigay-pangalan. Ang “Simeon” ang nakaugaliang anyo ng pangalan at ang kaugnayan nito sa pandiwang “narinig” ay ipinaliliwanag sa talababa.
theological_decisions:
- issue: Paglalarawan ni Lea sa kaniyang kalagayan kaugnay ni Jacob
  choice: kinamumuhian ako
  alternative: hindi ako minamahal; hindi ako gaanong minamahal
  rationale: Karaniwang malakas ang kahulugan ng Hebreong שְׂנוּאָה. Bagaman maaari itong tumukoy sa pagtatakwil o sa pagiging hindi gaanong minamahal sa konteksto, hindi pinalalambot ng pangunahing teksto ang tensiyon ng orihinal.
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Isinasatitik ang personal na pangalan sa halip na palitan ito ng isang titulo, alinsunod sa tahasang paggamit ng Tetragrammaton sa Hebreong teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “nagdalang-tao,” “nagsilang,” at “pinangalanan” upang maging natural sa ordinaryong mambabasa, habang pinanatili ang matinding diwa ng “kinamumuhian” at ang pangalang Yahweh.
