  yaml_path: translation/ot/genesis/029/009.yaml
  text: While he was still speaking with them[a], Rachel came with her father’s flock, for she was a shepherdess.
translation:
  language: tl
  text: Habang nakikipag-usap pa siya sa kanila, dumating si Raquel kasama ang kawan ng kanyang ama, sapagkat siya ang pastol nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “siya ang nagpapastol sa kawan.” Ang salitang Hebreo ay nasa anyong pambabae at maaaring tumukoy sa tungkulin ni Raquel bilang pastol o sa ginagawa niyang pagpapastol.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: Habang nakikipag-usap pa siya
  rationale: Ipinahahayag ng idyoma at kasunod na participle ang kilos na nagpapatuloy nang dumating si Raquel. Likas sa makabagong Tagalog ang “habang … pa” para sa ganitong sabayang pangyayari.
- source_word: עִמָּם
  choice: sa kanila
  rationale: Tumutukoy ang panghalip sa mga pastol na kausap ni Jacob; natural sa Tagalog ang “nakikipag-usap sa kanila.”
- source_word: וְרָחֵל בָּאָה
  choice: dumating si Raquel
  rationale: Ang Qal perfect ng בוא ay nagpapatuloy sa salaysay. Mas natural dito ang “dumating” kaysa sa literal na “pumarito.”
- source_word: עִם הַצֹּאן אֲשֶׁר לְאָבִיהָ
  choice: kasama ang kawan ng kanyang ama
  rationale: Pinananatili ang kolektibong kahulugan ng צאן at malinaw na ipinahahayag ang pag-aari na nasa pariralang אֲשֶׁר לְאָבִיהָ.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ito ng paliwanag kung bakit kasama ni Raquel ang kawan; ang “sapagkat” ay angkop sa marangal na salaysay.
- source_word: רֹעָה הִוא
  choice: siya ang pastol nito
  rationale: Tinutukoy ng pambabaeng participle ang tungkulin ni Raquel bilang nag-aalaga sa kawan. Walang hiwalay na karaniwang pambabaeng anyo ang “pastol” sa makabagong Tagalog, ngunit malinaw ang kasarian mula sa “siya” at sa pangalang Raquel.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “nakikipag-usap” para sa tuloy-tuloy at kapwa nakikibahaging pag-uusap, at “pastol” bilang karaniwang salitang walang kasariang gramatikal sa Filipino. Inilagay ang talababa sa pariralang mismong may leksikal na alternatibo.
