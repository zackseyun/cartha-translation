  language: en
  yaml_path: translation/ot/genesis/029/025.yaml
  text: In the morning, behold, it was Leah. And he said to Laban, “What is this you have done to me? Was it not for Rachel that I worked with you? So why have you deceived me?”
translation:
  language: tl
  text: Pagsapit ng umaga, nakita niyang si Lea pala iyon! Sinabi niya kay Laban, “Ano itong ginawa mo sa akin? Hindi ba’t naglingkod ako sa iyo para kay Raquel? Bakit mo ako dinaya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה הִוא לֵאָה
  choice: nakita niyang si Lea pala iyon!
  rationale: Ipinahahayag ng הִנֵּה ang biglaang pagkakatuklas at pagkagulat; likas na naihahatid ito sa modernong Tagalog sa pamamagitan ng “nakita niyang … pala” at tandang padamdam.
- source_word: עָבַדְתִּי עִמָּךְ
  choice: naglingkod ako sa iyo
  rationale: Ang עבד ay tumutukoy rito sa paglilingkod o pagtatrabaho para kay Laban; pinanatili ng “naglingkod” ang ugnayang personal na ipinahihiwatig ng עִמָּךְ.
- source_word: רִמִּיתָנִי
  choice: dinaya mo ako
  rationale: Tuwirang ipinahahayag ng pandiwa ang mapanlinlang na pakikitungo ni Laban kay Jacob; natural at malinaw ang “dinaya” sa Tagalog.
