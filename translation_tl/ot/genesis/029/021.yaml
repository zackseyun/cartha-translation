  text: Then Jacob said to Laban[a], “Give me my wife, for my days are fulfilled, that I may go in to her.”
translation:
  language: tl
  text: Sinabi ni Jacob kay Laban, “Ibigay mo sa akin ang aking asawa, sapagkat natapos na ang takdang panahon ko, upang ako'y makisiping sa kanya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pumasok sa kanya,” isang nakaugaliang mahinahong pahayag para sa pakikipagtalik at sa pagsasakatuparan ng kasal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Ibigay mo na sa akin
  rationale: Isang pormula ng pautos o mariing pakiusap. Ginagawang malinaw ng “sa akin” ang ipinahihiwatig na tagatanggap, at ipinahahayag ng “na” na natapos na ang napagkasunduang panahon.
- source_word: אֶת אִשְׁתִּי
  choice: ang aking asawa
  rationale: Ang אִשָּׁה ay maaaring mangahulugang “babae” o “asawa”; sa kontekstong ito, tinutukoy ni Jacob ang babaeng ipinangakong mapapangasawa niya.
- source_word: כִּי מָלְאוּ יָמָי
  choice: sapagkat natapos na ang takdang panahon ko
  rationale: Literal itong tumutukoy sa pagkapuno o pagkakumpleto ng “mga araw” ni Jacob, ibig sabihin, ang napagkasunduang panahon ng paglilingkod. Natural sa modernong Tagalog ang “takdang panahon” at hindi nito ipinahihiwatig na katapusan na ng kanyang buhay.
- source_word: וְאָבוֹאָה אֵלֶיהָ
  choice: upang makisiping ako sa kanya
  rationale: Ang בוא אל ay isang mahinahong Hebreong pahayag para sa pakikipagtalik at sa pagganap ng kasal. Pinananatili ng “makisiping” ang disente at eupemistikong tono, habang ipinahahayag ng “upang” ang layuning ipinakikita ng anyong cohortative.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “makisiping” sa halip na literal ngunit hindi likas na “pumasok sa kanya,” at nilinaw sa talababa ang Hebreong idyoma.
