  yaml_path: translation/ot/genesis/029/007.yaml
  text: Then he said[a], “Look, the day is still long; it is not time for the livestock to be gathered. Water the flock[b], then go and pasture them.”
translation:
  language: tl
  text: Sinabi niya, “Tingnan ninyo, mahaba pa ang araw[a]. Hindi pa oras para tipunin ang mga alagang hayop. Painumin ninyo ang kawan[b], pagkatapos ay umalis kayo at ipastol ninyo ang mga iyon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maliwanag pa.” Literal na sinasabi ng idyomang Hebreo na “malaki/mahaba pa ang araw,” na nangangahulugang marami pang oras ng araw ang natitira.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga alagang hayop” ay salin ng malawak na kolektibong katawagan para sa mga hayop na inaalagaan, samantalang ang “kawan” ay salin ng mas tiyak na katawagan para sa maliliit na alagang hayop gaya ng mga tupa o kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tingnan ninyo
  rationale: Isang pantawag-pansin ang salitang Hebreo. Ang “Tingnan ninyo” ay likas sa makabagong Filipino at pinananatili ang tuwirang pakikipag-usap ni Jacob sa mga pastol.
- source_word: עוֹד הַיּוֹם גָּדוֹל
  choice: mahaba pa ang araw
  rationale: Pinananatili nito ang larawang nasa idyomang Hebreo—marami pang oras ng araw ang natitira—habang nananatiling malinaw sa Filipino.
- source_word: לֹא עֵת הֵאָסֵף הַמִּקְנֶה
  choice: Hindi pa oras para tipunin ang mga alagang hayop
  rationale: Ipinahahayag ng עֵת ang angkop na oras, pasibo ang diwa ng הֵאָסֵף, at ang מִקְנֶה ay malawak na kolektibong katawagan para sa mga domestikadong hayop.
- source_word: הַשְׁקוּ
  choice: Painumin ninyo
  rationale: Ang Hiphil na pautos mula sa שׁקה ay nangangahulugang bigyan ng tubig o painumin; tuwiran at natural ang “Painumin ninyo.”
- source_word: הַצֹּאן
  choice: ang kawan
  rationale: Kolektibong tumutukoy ang צֹאן sa maliliit na alagang hayop, karaniwang mga tupa at maaari ring mga kambing; hindi ito nililimitahan ng “kawan” sa tupa lamang.
- source_word: וּלְכוּ רְעוּ
  choice: saka kayo humayo at ipastol ang mga iyon
  rationale: Pinananatili ng “humayo” ang hiwalay na pautos na “pumunta,” at ipinapakita ng “ipastol” ang kasunod na pagpapastol o pagpapakain sa kawan.
