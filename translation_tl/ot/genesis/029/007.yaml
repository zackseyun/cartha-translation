translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang idyomang “mahaba pa ang araw” at ipinaliwanag ito sa talababa; ginamit ang maramihang “ninyo/kayo” ayon sa kausap na pangkat ng mga pastol.
