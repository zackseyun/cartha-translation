  to: Sinabi niya, “Tingnan ninyo, mahaba pa ang araw[a]. Hindi pa oras para tipunin ang mga alagang hayop. Painumin ninyo ang kawan[b], pagkatapos ay umalis kayo at ipastol ninyo ang mga iyon.”
