    rationale: Ang “nitong” ay maaaring maunawaang tumutukoy kay Laban ngunit hindi ito ang pinakanatural na anyo rito, at ang “niya” sa “asawa niya” ay maaaring sandaling iugnay sa pinakamalapit na pangngalang Raquel. Ang tahasang pagtukoy kina Laban at Jacob ay nagpapanatili ng kahulugan nang walang dagdag na interpretasyon.
