  source_fidelity: Maayos na naihahatid ng draft ang pagkakasunod ng pangyayari, ang pagkumpleto ng itinakdang yugto, at ang pagbibigay ni Laban kay Raquel bilang asawa ni Jacob. Gayunman, ang זֹאת ay mas tuwirang “ito” kaysa “iyon,” at ang mga panghalip sa huling pangungusap ay maaaring pansamantalang lumabo sa Tagalog.
  naturalness: Natural at marangal ang pangkalahatang rehistro. Mas malinaw at mas maayos ang daloy kung gagamitin ang mga pangalan sa huling sugnay sa halip na magkakasunod na “niya/niyang/niya.”
  terminology: Ang “linggo” at ang talababa tungkol sa isang yugto ng pito at sa linggo ng kasal ay angkop. Ang “bilang asawa ni Jacob” ay tumpak na katumbas ng pagbibigay kay Raquel לוֹ לְאִשָּׁה at iniiwasan ang hindi malinaw na panghalip.
