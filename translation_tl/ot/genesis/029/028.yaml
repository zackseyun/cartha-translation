  text: And Jacob did so[a], and he completed this week; then Laban gave him Rachel his daughter as his wife.
translation:
  language: tl
  text: Ginawa ito ni Jacob at tinapos niya ang linggong ito[a]. Pagkatapos, ibinigay ni Laban kay Jacob si Raquel, ang kanyang anak, bilang asawa ni Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang linggo ng kasalang ito.” Literal na tumutukoy ang Hebreo sa isang yugto ng pito; dito, malamang na ito ang isang linggong pagdiriwang ng kasal.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ יַעֲקֹב כֵּן
  choice: Ginawa nga iyon ni Jacob
  rationale: Likas sa modernong Tagalog ang “ginawa iyon” bilang pagtukoy sa ipinagawa sa naunang talata. Ipinahihiwatig ng “nga” na sumunod si Jacob sa sinabi sa kanya nang hindi dinaragdagan ang detalye.
- source_word: וַיְמַלֵּא
  choice: tinapos niya
  rationale: Ang piel ng מלא ay tumutukoy rito sa pagkumpleto ng isang takdang panahon. Malinaw at karaniwan sa Tagalog ang “tinapos.”
- source_word: שְׁבֻעַ זֹאת
  choice: ang linggong iyon
  rationale: Ang שְׁבֻעַ ay isang yugto ng pito at sa konteksto ay malamang na linggo ng pagdiriwang ng kasal. Pinananatili ng “linggong iyon” ang maikli at bahagyang di-tiyak na pahayag ng Hebreo; ipinaliliwanag sa talababa ang konteksto.
- source_word: וַיִּתֶּן לוֹ
  choice: ibinigay sa kanya ni Laban
  rationale: Hindi inuulit sa Hebreo ang pangalan ng simuno, ngunit malinaw mula sa konteksto na si Laban iyon. Ang pagbanggit sa pangalan ay umiiwas sa kalituhan sa Tagalog, at ang “Pagkatapos” ay nagpapakita ng sunod-sunod na pangyayari.
- source_word: אֶת־רָחֵל בִּתּוֹ
  choice: ang anak nitong si Raquel
  rationale: Ang “anak nitong si Raquel” ay natural na Tagalog at malinaw na si Raquel ay anak ni Laban.
- source_word: לוֹ לְאִשָּׁה
  choice: upang maging asawa niya
  rationale: Ipinahahayag nito ang pagbibigay kay Raquel sa pag-aasawa sa likas at dignified na modernong Tagalog.
