  to: Ginawa ito ni Jacob at tinapos niya ang linggong ito[a]. Pagkatapos, ibinigay ni Laban kay Jacob si Raquel, ang kanyang anak, bilang asawa ni Jacob.
  rationale: Pinalitan ang “iyon” ng “ito” upang higit na tumugma sa Hebreong demonstratibo. Ginawang tahasan ang mga pangalan sa huling pangungusap upang malinaw na si Laban ang nagbibigay at si Jacob ang tumatanggap kay Raquel bilang asawa. Pinanatili ang maingat na “malamang” sa talababa, sapagkat ang kontekstong pangkasal ay nagpapahiwatig ngunit hindi tahasang ipinapangalan sa mismong Hebreong parirala.
