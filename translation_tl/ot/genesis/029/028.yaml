translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Pinanatili ang anyong salaysay at hindi nilinaw nang lampas sa ipinahihintulot ng Hebreo ang eksaktong kaugnayan ng “linggong iyon” sa pagdiriwang ng kasal.
