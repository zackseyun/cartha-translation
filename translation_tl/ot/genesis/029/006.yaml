  text: He said to them[a], “Is he well?” And they said, “He is well. And look, Rachel his daughter is coming with the flock.”
translation:
  language: tl
  text: Tinanong niya sila[a], “Mabuti ba ang lagay niya?” Sumagot sila, “Mabuti naman siya. At heto, paparating ang anak niyang babae na si Raquel, kasama ang kawan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na, “Maayos ba siya?” Ginagamit dito ang Hebreong shalom para sa kapakanan o mabuting kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשָׁלוֹם לוֹ
  choice: Mabuti ba ang kalagayan niya?
  rationale: Ang שָׁלוֹם sa tanong na ito ay tumutukoy sa kapakanan o kalagayan ni Laban, hindi lamang sa kapayapaan. Likas at malinaw ito sa modernong Tagalog.
- source_word: שָׁלוֹם
  choice: Mabuti naman
  rationale: Tuwirang sinasagot nito ang tanong tungkol sa kalagayan ni Laban. Ang “naman” ay natural sa usapang Tagalog at hindi nagdaragdag ng bagong diwa.
- source_word: וְהִנֵּה
  choice: Tingnan mo
  rationale: Itinutuon ng הִנֵּה ang pansin sa taong nakikita at paparating; pinananatili ng “Tingnan mo” ang agarang deiktikong puwersa nito.
- source_word: רָחֵל
  choice: Raquel
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Rachel sa mga saling Bibliya sa Filipino.
- source_word: בִּתּוֹ
  choice: anak niyang
  rationale: Ang hulaping panghalip ay tumutukoy kay Laban. Sa konteksto, si Raquel ay anak niyang babae; sapat at natural sa Tagalog ang “anak niyang si Raquel.”
- source_word: בָּאָה
  choice: paparating
  rationale: Inilalarawan nito ang kilos na kasalukuyang nakikita sa tagpo, kaya ang “paparating” ay natural na katumbas sa salaysay.
- source_word: עִם הַצֹּאן
  choice: kasama ang kawan
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop, karaniwang mga tupa at kambing; mas malawak at tumpak ang “kawan” kaysa “mga tupa.”
