  text: And Laban gave Bilhah[a], his female servant, to Rachel his daughter as her female servant.
translation:
  language: tl
  text: At ibinigay ni Laban kay Raquel, na kanyang anak, si Bilha, na kanyang aliping babae, bilang aliping babae ni Raquel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “babaeng lingkod” sa dalawang paglitaw ng salitang Hebreo na שִׁפְחָה.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: At ibinigay
  rationale: Tuwirang isinasalaysay ng anyong waw-consecutive ng נתן ang nakaraang kilos; natural sa Filipino ang “At ibinigay.”
- source_word: לָבָן
  choice: Laban
  rationale: Karaniwang anyong Filipino ng personal na pangalan.
- source_word: לְרָחֵל
  choice: kay Raquel
  rationale: Minamarkahan ng ל ang tumatanggap; “kay Raquel” ang natural na anyo para sa pangalan ng tao.
- source_word: בִּתּוֹ
  choice: na anak niya
  rationale: Tumutukoy ang hulaping 3ms kay Laban; malinaw at natural ang pariralang “kay Raquel na anak niya.”
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Walang tuwirang katumbas sa Filipino ang pananda ng tiyak na layon; naipahihiwatig ito ng ayos at mga pananda sa pangungusap.
- source_word: בִּלְהָה
  choice: Bilha
  rationale: Ginamit ang natural na transliterasyong Filipino ng personal na pangalan.
- source_word: שִׁפְחָתוֹ
  choice: ang kanyang alilang babae
  rationale: Ang שִׁפְחָה ay babaeng alipin o lingkod. Pinananatili ng “alilang babae” ang kasarian at nakabababang katayuang panlipunan nang hindi nagpapahiwatig ng edad.
- source_word: לָהּ
  choice: ni Raquel
  rationale: Tumutukoy ang panghalip kay Raquel. Inulit ang pangalan upang maging malinaw at natural sa Filipino ang relasyon.
- source_word: לְשִׁפְחָה
  choice: upang maging alilang babae
  rationale: Ipinapahayag ng pariralang לְשִׁפְחָה ang tungkulin o kalagayang ibinigay kay Bilha; natural itong isalin na “upang maging alilang babae,” habang pinananatili ang pag-uulit ng שִׁפְחָה.
