  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “alilang babae” upang katawanin ang lawak ng שִׁפְחָה bilang babaeng nasa paglilingkod o pagkaalipin; inilagay sa talababa ang mas banayad na alternatibong “babaeng lingkod.”
