  text: Jacob loved Rachel[a], and he said, “I will serve you seven years for Rachel your younger daughter.”
translation:
  language: tl
  text: Minahal ni Jacob si Raquel, at sinabi niya, “Maglilingkod ako sa iyo nang pitong taon para kay Raquel, ang nakababata mong anak na babae.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: Minahal
  rationale: Tuwirang ipinapahayag ng אָהַב ang pag-ibig. Ang “minahal” ay natural at hindi nagdaragdag ng mas tiyak na diwang gaya ng “umibig nang lubos.”
- source_word: יַעֲקֹב אֶת־רָחֵל
  choice: ni Jacob si Raquel
  rationale: Ginagamit ang karaniwang anyong Filipino para sa simuno at tiyak na layon, at ang tradisyonal na baybay na “Raquel.”
- source_word: וַיֹּאמֶר
  choice: kaya sinabi niya
  rationale: Ang אמר ay “sinabi.” Sa konteksto, ang waw ay nag-uugnay sa pagmamahal ni Jacob at sa kasunod niyang alok; ipinahihiwatig ng “kaya” ang natural na daloy nang hindi binabago ang nilalaman.
- source_word: אֶעֱבָדְךָ
  choice: Maglilingkod ako sa iyo
  rationale: Pinananatili ng “maglilingkod” ang diwa ng עבד bilang paglilingkod o paggawa para sa isang tao, hindi lamang impersonal na pagtatrabaho.
- source_word: שֶׁבַע שָׁנִים
  choice: nang pitong taon
  rationale: Tuwirang salin ng tagal ng paglilingkod; ang “nang” ang natural na pananda ng haba ng panahon sa Filipino.
- source_word: בְּרָחֵל
  choice: para kay Raquel
  rationale: Sa kontekstong ito, ipinakikita ng ב ang batayan o kapalit ng paglilingkod. Natural at sapat ang “para kay Raquel” at hindi nito labis na ginagawang komersiyal ang kasunduan.
- source_word: בִּתְּךָ הַקְּטַנָּה
  choice: ang nakababata mong anak na babae
  rationale: Sa paghahambing ng magkapatid, ang הַקְּטַנָּה ay tumutukoy sa mas bata, hindi sa pisikal na kaliitan. Nililinaw ng “anak na babae” ang kasarian na nasa בִּתְּךָ.
