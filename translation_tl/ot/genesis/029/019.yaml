  text: Laban said[a], “It is better that I give her to you than that I give her to another man. Stay with me.”
translation:
  language: tl
  text: Sinabi ni Laban, “Mas mabuting ibigay ko siya sa iyo kaysa ibigay ko siya sa ibang lalaki. Manatili ka sa piling ko.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang panandang pasalaysay ng tuwirang pananalita; natural sa modernong Filipino ang “Sinabi ni Laban.”
- source_word: טוֹב
  choice: Mas mabuti
  rationale: 'Dahil sinusundan ito ng paghahambing na may מִן, malinaw na pahambing ang diwa: “mas mabuti ... kaysa.”'
- source_word: תִּתִּי אֹתָהּ לָךְ
  choice: ibigay ko siya sa iyo
  rationale: Ang infinitive construct na may hulaping unang panauhan ay likas na maisinasalin sa Filipino bilang sugnay na may pandiwang “ibigay ko.”
- source_word: מִתִּתִּי אֹתָהּ לְאִישׁ אַחֵר
  choice: kaysa ibigay ko siya sa ibang lalaki
  rationale: Pinananatili ang ikalawang bahagi ng paghahambing at ang literal na diwa ng אִישׁ אַחֵר nang hindi dinaragdagan ng “asawa.”
- source_word: שְׁבָה
  choice: Manatili ka rito
  rationale: Sa konteksto, ang pautos ay tumutukoy sa patuloy na pananatili sa kinaroroonan ni Laban; idinagdag ang “rito” bilang likas na deiktikong pahayag sa Filipino, kasabay ng “kasama ko.”
- source_word: עִמָּדִי
  choice: kasama ko
  rationale: Natural at tuwirang katumbas ng patuloy na presensiya kay Laban.
