  text: Laban said[a], “It is not done this way in our place[c][b], to give the younger before the older.”
translation:
  language: tl
  text: Sinabi ni Laban, “Hindi kaugalian sa aming lugar[a] na ibigay[b] ang nakababatang babae bago ang panganay na babae[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa aming nasasakupan” o “sa amin.” Literal na “sa aming lugar” ang Hebreo at tumutukoy dito sa lokal na kaugalian.
    reason: lexical_alternative
  - marker: b
    text: Ang “ibigay” ay nangangahulugang ibigay upang maipakasal; hindi tahasang binabanggit sa Hebreo ang pag-aasawa.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nakatatandang babae” o “panganay na anak na babae.” Binibigyang-diin ng salitang Hebreo ang pagkauna sa kapanganakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָבָן
  choice: Sinabi ni Laban
  rationale: Karaniwang salaysay na anyo ang וַיֹּאמֶר, kaya natural at tuwiran ang “Sinabi”; pinanatili ang pangalang Laban sa nakaugaliang anyong Filipino.
- source_word: לֹא יֵעָשֶׂה כֵן
  choice: Hindi ganito ang ginagawa
  rationale: Ipinahihiwatig ng anyong impersonal na ito ang kinikilalang kaugalian o gawi ng pamayanan, hindi lamang kung ano ang maaaring gawin.
- source_word: בִּמְקוֹמֵנוּ
  choice: sa aming lugar
  rationale: Pinananatili nito ang kongkretong kahulugan ng מָקוֹם habang malinaw sa konteksto na tumutukoy ito sa lokal na kaugalian.
- source_word: לָתֵת
  choice: ang ibigay
  rationale: Payak na “ibigay” ang literal na diwa ng נתן; ipinauunawa ng konteksto na ang tinutukoy ay pagbibigay bilang asawa, ngunit hindi iyon tahasang sinasabi sa Hebreo.
- source_word: הַצְּעִירָה
  choice: ang nakababatang babae
  rationale: Ang pang-uri ay ginagamit bilang pangngalan at nasa anyong pambabae. Ginawang tahas ang “babae” upang maging natural at malinaw sa Filipino nang hindi idinaragdag ang relasyong “anak” na hindi lantad sa parirala.
- source_word: לִפְנֵי
  choice: bago
  rationale: Dito ay tumutukoy ang לִפְנֵי sa pagkauna sa kaayusan, kaya ang “bago” ang pinakadirektang katumbas.
- source_word: הַבְּכִירָה
  choice: ang panganay
  rationale: Pinananatili ng “panganay” ang diin ng בְּכִירָה sa pagkakasunod ayon sa kapanganakan at ang pambabaeng tinutukoy ay malinaw na sa konteksto.
