  source_fidelity: Ang draft ay wastong kumikilala kay Laban bilang nagbibigay, kay Lea bilang anak niya at tumatanggap, at kay Zilpa bilang isang שפחה. Gayunman, ang “upang maging” ay masidhi ang layuning himig kaysa sa simpleng pagtatalaga ng katayuan ng huling pangngalang Hebreo. Ang “bilang alipin ni Lea” ay mas tuwirang naghahatid ng tungkuling iyon.
  naturalness: Mas natural at malinaw sa modernong Tagalog ang “sa anak niyang si Lea” kaysa “kay Lea na kanyang anak.” Iniiwasan din ng “ni Lea” ang posibleng malabong reperensiya ng “nito.”
  terminology: Ang “aliping babae” ay malinaw na modernong katawagan para sa babae sa kalagayang pagkaalipin at mas tuwirang katumbas ng שפחה kaysa sa “babaeng alipin,” bagaman kapwa maaaring unawain. Pinananatili ang parehong katayuan sa huling parirala nang hindi inuulit ang buong parirala nang hindi likas.
