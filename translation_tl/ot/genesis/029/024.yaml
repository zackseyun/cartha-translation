  - severity: low
    issue: Medyo di-likas ang “kay Lea na kanyang anak.”
    rationale: Ang ayos na “sa anak niyang si Lea” ay mas karaniwan sa maayos na modernong Tagalog at malinaw na si Laban ang ama.
