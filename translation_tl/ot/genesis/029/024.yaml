  text: And Laban gave Zilpah his female servant to Leah his daughter as a female servant[a][b].
translation:
  language: tl
  text: At ibinigay ni Laban sa anak niyang si Lea si Zilpa, ang aliping babae niya, bilang alipin ni Lea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa isang babaeng nasa mababang katayuan ng paglilingkod, na malamang ay nasa kalagayang pagkaalipin; maaari ring isaling “babaeng alipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ibinigay
  rationale: Tuwirang ipinapahayag ng נתן ang pagbibigay; likas sa salaysay ang “ibinigay” at hindi nito dinaragdagan ang kahulugan.
- source_word: לָהּ ... לְלֵאָה בִתּוֹ
  choice: kay Lea na kanyang anak
  rationale: Ang literal na “sa kanya” ay nililinaw ng kasunod na pariralang tumutukoy kay Lea bilang anak ni Laban. Pinagsama ito sa natural na ayos ng Tagalog nang hindi binabago ang referent.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Isinalin sa karaniwang anyong Tagalog ang pangalang pantangi.
- source_word: שִׁפְחָתוֹ
  choice: ang kanyang babaeng alipin
  rationale: Ang שִׁפְחָה ay tumutukoy sa babaeng nasa nakadepende at malamang na pagkaaliping kalagayan. Mas malinaw sa modernong Tagalog ang “babaeng alipin” kaysa sa mas lumang “alilang babae.”
- source_word: שִׁפְחָה
  choice: upang maging alipin nito
  rationale: Ipinahahayag ng huling pangngalan ang tungkulin o katayuang ibinigay kay Zilpa. Ang “upang maging alipin nito” ay natural sa Tagalog; ang “nito” ay tumutukoy kay Lea at hindi nagdaragdag ng hindi malinaw na bagong kalahok.
