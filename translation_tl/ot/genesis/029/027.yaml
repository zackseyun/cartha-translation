base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/027.yaml
  text: Complete this woman's bridal week[c][b][a], and we will give you this one also in return for the work that you will do with me for another seven years.
translation:
  language: tl
  text: Tapusin mo ang linggo ng kasal ng babaeng ito[a], at ibibigay din sa iyo ang babaeng ito rin[b] bilang kapalit ng pagtatrabaho mo para sa akin nang pitong taon pa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Tapusin mo ang linggo ng isang ito.” Tumutukoy ang parirala sa nakaugaliang isang linggong pagdiriwang ng kasal.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin, “at ibibigay din siya sa iyo” o “at ibibigay din sa iyo ang isang ito.” Pormal na ikatlong panauhang pambabae ang anyong Hebreo, ngunit sa konteksto ay pangako ito ni Laban na ibigay din ang isa pa niyang anak na babae.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “bilang kapalit ng paglilingkod mo sa akin.” Ang pandiwang Hebreo ay maaaring mangahulugang “magtrabaho” o “maglingkod,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: Tapusin mo
  rationale: Ang pautos na anyo ng מלא ay humihiling na buuin o tapusin ni Jacob ang itinakdang panahon. Likas at malinaw sa modernong Tagalog ang “Tapusin mo.”
- source_word: שְׁבֻעַ זֹאת
  choice: ang linggo ng kasal ng babaeng ito
  rationale: Literal itong “ang linggo ng isang ito,” ngunit sa konteksto ay tumutukoy sa nakaugaliang isang linggong pagdiriwang ng kasal ni Lea. Nililinaw ng “babaeng ito” ang pambabaeng demonstratibo nang hindi pinapangalanan ang tinutukoy sa mismong talata.
- source_word: וְנִתְּנָה לְךָ
  choice: at ibibigay din namin sa iyo
  rationale: Bagaman pormal na ikatlong panauhang pambabae ang anyo, ipinahihiwatig ng konteksto ang pangako ni Laban at ng kanyang sambahayan na ibigay din si Raquel. Natural sa Tagalog ang aktibong pangmaramihang pagpapahayag, habang itinatala sa talababa ang pormal na alternatibo.
- source_word: גַּם אֶת זֹאת
  choice: ang isa pang ito
  rationale: Tumutukoy ito sa isa pang anak na babae, si Raquel. Pinananatili ng “ito” ang demonstratibong diin at ng “isa pang” ang diwa ng גַּם.
- source_word: בַּעֲבֹדָה אֲשֶׁר תַּעֲבֹד עִמָּדִי
  choice: bilang kapalit ng pagtatrabaho mo sa akin
  rationale: Ipinapahayag ng parirala ang kondisyon o kapalit ng pagbibigay kay Raquel. Ang “pagtatrabaho mo sa akin” ay natural na Tagalog para sa paggawa o paglilingkod ni Jacob sa ilalim ni Laban.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: nang pitong taon pa
  rationale: Malinaw nitong pinananatili ang karagdagang tagal na pitong taon na ipinahihiwatig ng עוֹד at אֲחֵרוֹת.
