  text: Jacob told Rachel that he was her father's relative and that he was Rebekah's son[a]. Then she ran and told her father.
translation:
  language: tl
  text: Sinabi ni Jacob kay Raquel na kamag-anak siya ng ama ni Raquel at anak siya ni Rebeca.[a] Pagkatapos, tumakbo si Raquel at ibinalita niya ito sa kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “kapatid ng kanyang ama.” Ginagamit dito ang “kapatid” para sa isang malapit na lalaking kamag-anak; si Jacob ay pamangkin ni Laban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: Sinabi
  rationale: Ang Hiphil ng נגד ay karaniwang nangangahulugang magsabi o magpabatid; natural sa salaysay ang “sinabi.”
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng sinabi ni Jacob.
- source_word: אֲחִי אָבִיהָ
  choice: kamag-anak siya ng ama nito
  rationale: Bagaman literal na “kapatid ng kanyang ama,” maaari ring tumukoy ang אָח sa lalaking kamag-anak. Pamangkin ni Laban si Jacob, kaya ipinahahayag ng “kamag-anak” ang kahulugan nang hindi nagbibigay ng maling tiyak na relasyon sa pangunahing teksto.
- source_word: בֶן רִבְקָה
  choice: anak siya ni Rebeca
  rationale: Tuwiran at natural na salin ng ugnayang mag-ina.
- source_word: וַתָּרָץ
  choice: tumakbo
  rationale: Pinananatili ang malinaw at masiglang kilos na ipinahahayag ng רוץ.
- source_word: וַתַּגֵּד
  choice: sinabi ito
  rationale: Kapareho ito ng pandiwang ginamit sa unang sugnay; ang “ito” ay natural na tumutukoy sa ibinalitang impormasyon.
- source_word: לְאָבִיהָ
  choice: sa kanyang ama
  rationale: Tuwiran at natural na salin ng pariralang may pang-ukol.
