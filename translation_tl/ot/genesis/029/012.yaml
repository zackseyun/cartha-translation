translation_notes:
  register: Modernong Filipino na malinaw at marangal ang himig. Ginamit ang “nito” sa unang pagtukoy sa ama ni Raquel upang maiwasan ang kalituhan kung kaninong ama ang tinutukoy, at pinanatili sa talababa ang literal na idyomang Hebreo.
