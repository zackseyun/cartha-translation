  yaml_path: translation/ot/genesis/029/022.yaml
  text: So Laban gathered all the men of the place and made a feast[a][b].
translation:
  language: tl
  text: Kaya tinipon ni Laban ang lahat ng kalalakihan sa lugar na iyon at naghanda siya ng isang handaan[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang lahat ng tao sa lugar na iyon.” Mas literal na “ang lahat ng kalalakihan sa lugar” ang Hebreo; pinanatili rito ang panlalaking anyo sapagkat malamang na tumutukoy ito sa mga lalaking tagaroon na inanyayahan sa pagdiriwang ng kasal.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang isinaling “handaan” ay tumutukoy sa isang masayang salu-salo at maaaring magpahiwatig na bahagi ng okasyon ang pag-inom.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: tinipon
  rationale: Ang אסף sa kontekstong ito ay nangangahulugang pagsasama-sama ng mga tao. Natural at tuwiran sa makabagong Filipino ang “tinipon.”
- source_word: לָבָן
  choice: Laban
  rationale: Ginamit ang karaniwang anyo ng pangalang pantangi sa mga saling Filipino ng Biblia.
- source_word: אֶת כָּל אַנְשֵׁי הַמָּקוֹם
  choice: ang lahat ng kalalakihan sa lugar na iyon
  rationale: Ang אַנְשֵׁי ay panlalaking maramihang anyo ng אִישׁ at literal na tumutukoy sa “mga lalaki.” Pinanatili ang panlalaking kahulugan, habang ang “sa lugar na iyon” ay natural na katumbas ng הַמָּקוֹם sa salaysay.
- source_word: וַיַּעַשׂ
  choice: naghanda siya
  rationale: Malawak ang kahulugan ng עשה (“gumawa/gawin”), ngunit kasama ng מִשְׁתֶּה, mas natural sa Filipino ang “naghanda ng isang handaan” kaysa “gumawa ng handaan.”
- source_word: מִשְׁתֶּה
  choice: isang handaan
  rationale: Ang מִשְׁתֶּה ay isang pagdiriwang na may salu-salo at karaniwang may kasamang pag-inom. Ang “handaan” ay malinaw, natural, at angkop sa konteksto ng kasal nang hindi labis na ipinapahayag ang pag-inom.
