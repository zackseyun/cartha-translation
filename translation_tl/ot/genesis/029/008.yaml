revisions:
- from: Sumagot sila, “Hindi pa namin magagawa iyon hangga’t hindi natitipon ang lahat ng kawan at naigugulong nila ang bato mula sa bukana ng balon[b]. Saka namin pinaiinom ang mga tupa[a].”
  to: Sumagot sila, “Hindi namin magagawa iyon hangga’t hindi natitipon ang lahat ng kawan at hindi nila iginugulong palayo ang bato mula sa bungad ng balon[b]. Saka namin pinaiinom ang kawan[a].”
  rationale: Pinalitan ang di-angkop na “naigugulong nila” ng aktibong “iginugulong nila palayo,” na mas tumpak sa pandiwang Hebreo at malinaw na nagpapakita ng pag-alis ng bato. Ginawang “kawan” ang huling צֹאן upang mapanatili ang kolektibong saklaw ng salita; inilagay ang “mga tupa” bilang lehitimong alternatibo sa talababa. Napanatili ang mga marker at ang pagkakasunod ng mga sugnay.
