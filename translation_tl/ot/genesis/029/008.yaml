base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/008.yaml
  text: They said[a], “We cannot until all the flocks are gathered and they roll the stone away from the mouth of the well[b]; then we water the sheep.”
translation:
  language: tl
  text: Sumagot sila, “Hindi namin magagawa iyon hangga’t hindi natitipon ang lahat ng kawan at hindi nila iginugulong palayo ang bato mula sa bungad ng balon[b]. Saka namin pinaiinom ang kawan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tupa.” Ang salitang Hebreo ay maaaring tumukoy nang pangkalahatan sa maliliit na alagang hayop, lalo na sa mga tupa at kambing.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bibig ng balon.”
    reason: hebrew_idiom
lexical_decisions:
- source_word: נוּכַל
  choice: magagawa namin
  rationale: Ipinahahayag ng pandiwa ang kawalan ng kakayahan. Ang “hindi pa namin magagawa iyon” ay natural sa Filipino; ang “iyon” ay tumutukoy sa pagpapainom na hinihingi ng konteksto, habang pinananatili ng “pa” ang pansamantalang hadlang.
- source_word: יֵאָסְפוּ
  choice: natitipon
  rationale: Ang Niphal ng אסף ay nagpapahiwatig na ang mga kawan ay natitipon o napagsasama-sama. Ang anyong ito ay angkop sa sugnay na may “hangga’t hindi.”
- source_word: הָעֲדָרִים
  choice: mga kawan
  rationale: Ang עדר ay kawan ng mga hayop, lalo na sa pastoral na tagpo. Hindi ito nilimitahan sa iisang uri ng hayop.
- source_word: וְגָלֲלוּ אֶת־הָאֶבֶן
  choice: naigugulong nila ang bato
  rationale: Ang גלל ay “igulong.” Ipinahihiwatig ng konteksto na inaalis ang batong nakatakip sa balon; pinananatili rin ang di-tiyak na panghalip na “nila” ng Hebreong pangmaramihang pandiwa.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: mula sa bukana ng balon
  rationale: Literal na “mula sa ibabaw ng bibig ng balon.” Ang “bukana” ang natural na katumbas sa Filipino habang naihahatid ang kahulugang pambungad ng balon.
- source_word: וְהִשְׁקִינוּ
  choice: saka namin pinaiinom
  rationale: Ang Hiphil ng שקה ay “painumin.” Ipinakikita ng “saka” na nangyayari ang pagpapainom pagkatapos matipon ang mga kawan at maalis ang bato.
- source_word: הַצֹּאן
  choice: mga tupa
  rationale: Ang צאן ay kolektibong tawag sa maliliit na alagang hayop at madalas ay tumutukoy sa mga tupa, bagaman maaari ring saklawin ang mga kambing; inilalahad ang lawak na ito sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino na angkop sa pasalitang sagot. Ginamit ang “hangga’t hindi” at “saka” upang malinaw na maipakita ang pagkakasunod-sunod ng mga kilos nang hindi tinutukoy kung sino mismo ang nagpagulong ng bato.
