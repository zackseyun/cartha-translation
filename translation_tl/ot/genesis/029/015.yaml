  text: Then Laban said to Jacob[a], “Because you are my relative, should you work for me for nothing? Tell me, what your wages should be.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Laban kay Jacob, “Dahil kamag-anak kita,[a] magtatrabaho ka ba para sa akin nang walang bayad? Sabihin mo sa akin kung ano ang dapat na maging sahod mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kapatid ko”; ginagamit dito sa mas malawak na kahulugang kamag-anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי
  choice: Dahil
  rationale: 'Ipinakikilala nito ang batayan ng retorikal na tanong: hindi dapat magtrabaho si Jacob nang walang bayad dahil lamang sa pagiging magkamag-anak nila.'
- source_word: אָחִי
  choice: kamag-anak kita
  rationale: Bagaman literal na “kapatid ko,” mas malawak ang gamit ng אָח dito. Pamangkin ni Laban si Jacob, kaya malinaw at tumpak sa konteksto ang “kamag-anak kita.”
- source_word: וַעֲבַדְתַּנִי
  choice: magtatrabaho ka na lamang ba sa akin
  rationale: Ang עבד ay tumutukoy rito sa paggawa para kay Laban. Ipinahahayag ng anyong patanong ang retorikal na diwa ng sugnay.
- source_word: חִנָּם
  choice: nang walang bayad
  rationale: Tuwirang ipinahahayag ang diwa ng paggawa na walang kabayaran at natural itong kaugnay ng kasunod na usapan tungkol sa sahod.
- source_word: הַגִּידָה לִּי
  choice: Sabihin mo sa akin
  rationale: Natural at tuwirang salin ng pautos na pandiwa kasama ang di-tuwirang layon.
- source_word: מַה מַשְׂכֻּרְתֶּךָ
  choice: kung ano ang dapat na maging sahod mo
  rationale: Ang מַשְׂכֹּרֶת ay sahod o bayad. Ang “dapat na maging” ay angkop sa konteksto ng pagtatakda o pakikipagkasundo sa kabayaran.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na natural, marangal, at madaling maunawaan. Pinanatili ang retorikal na tanong at ang pautos na “Sabihin mo sa akin,” habang nilinaw ang konteksto ng sahod nang hindi dinaragdagan ang diwa.
