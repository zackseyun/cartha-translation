  to: Pagkatapos, sinabi ni Laban kay Jacob, “Dahil kamag-anak kita,[a] magtatrabaho ka ba para sa akin nang walang bayad? Sabihin mo sa akin kung ano ang dapat na maging sahod mo.”
  rationale: Inalis ang “na lamang” upang hindi magdagdag ng diwang wala sa Hebreo, at pinalitan ang “sa akin” ng “para sa akin” upang mas malinaw na maipahayag ang paggawa para kay Laban. Pinanatili ang retorikal na tanong, ang marangal na rehistro, ang negosasyonal na diwa ng sahod, at ang talababa sa malawak na gamit ng אָח.
