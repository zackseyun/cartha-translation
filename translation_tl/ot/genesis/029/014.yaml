base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/014.yaml
  text: Then Laban said to him[b][a], “Surely you are my bone and my flesh.” And he stayed with him for a month.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Laban sa kanya, “Tunay ngang ikaw ay buto ko at laman ko[a].” At nanatili siyang kasama niya nang isang buwan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Idyomang Hebreo ang “buto ko at laman ko,” na nangangahulugang malapit na kadugo o kamag-anak.
    reason: cultural_note
  - marker: b
    text: Sa literal, “isang buwan ng mga araw”; maaari ring unawaing “isang buong buwan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive ay nagsusulong ng salaysay; likas sa makabagong Tagalog ang “Pagkatapos, sinabi” upang ipakita ang pagkakasunod-sunod.
- source_word: אַךְ
  choice: Tunay ngang
  rationale: Ginagamit dito ang particle bilang mariing pagpapatibay sa pagkakamag-anak, hindi bilang panakda na “lamang.”
- source_word: עַצְמִי וּבְשָׂרִי
  choice: buto ko at laman ko
  rationale: Pinananatili ang kongkretong larawang Hebreo at ang pormulang nagpapahayag ng malapit na ugnayang kadugo, sa halip na palitan agad ng paliwanag na “kamag-anak.”
- source_word: וַיֵּשֶׁב עִמּוֹ
  choice: At nanatili siyang kasama niya
  rationale: Sa konteksto, ang ישב ay tumutukoy sa pansamantalang pananatili ni Jacob kasama ni Laban; pinananatili rin ang mga panghalip ng Hebreo.
- source_word: חֹדֶשׁ יָמִים
  choice: nang isang buwan
  rationale: Ang pariralang Hebreo ay isang idyomatikong pagtukoy sa tagal na isang buwan. Ang natural na Tagalog ay inilagay sa teksto, habang ang mas literal na anyo ay itinala sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang idyomang pangkamag-anakan ng Hebreo sa pangunahing teksto at ipinaliwanag ito sa talababa; ginawang natural sa Tagalog ang pahayag ng tagal.
