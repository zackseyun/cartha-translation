  rationale: Inalis ang “muna” upang hindi magdagdag ng aspektong pansamantala na wala sa pinagmulan. Inayos din ang panghalip sa pangungusap ng pagpapangalan para sa mas malinaw at likas na modernong Filipino, nang hindi binabago ang kahulugan.
