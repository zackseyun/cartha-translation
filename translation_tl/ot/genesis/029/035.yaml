  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תַּ֨הַר ע֜וֹד וַ/תֵּ֣לֶד בֵּ֗ן וַ/תֹּ֨אמֶר֙ הַ/פַּ֨עַם֙ אוֹדֶ֣ה אֶת יְהוָ֔ה עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ יְהוּדָ֑ה וַֽ/תַּעֲמֹ֖ד מִ/לֶּֽדֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/035.yaml
  text: And she conceived again and bore a son[a], and she said, “This time I will praise Yahweh.” Therefore she named him Judah. Then she stopped bearing children.
translation:
  language: tl
  text: Muli siyang naglihi at nagsilang ng isang anak na lalaki. Sinabi niya, “Sa pagkakataong ito, pupurihin ko si Yahweh.” Kaya pinangalanan niya siyang Juda.[a] Pagkatapos, tumigil siyang manganak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Juda ay kahawig sa tunog ng pandiwang Hebreo na nangangahulugang “pumuri” o “magpasalamat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Muli siyang naglihi
  rationale: Ang הרה ay tumutukoy sa paglilihi, at ang עוֹד ay nagpapahayag ng pag-uulit sa sunod-sunod na salaysay ng mga kapanganakan.
- source_word: וַתֵּלֶד בֵּן
  choice: nagsilang ng isang anak na lalaki
  rationale: Likas at malinaw na salin ng karaniwang idyoma sa Hebreo para sa panganganak ng anak na lalaki.
- source_word: הַפַּעַם
  choice: Sa pagkakataong ito
  rationale: Pinananatili nito ang pagtukoy ni Lea sa kasalukuyang panganganak bilang kaiba sa mga nauna, nang hindi nagdaragdag ng di-tiyak na damdamin gaya ng 'sa wakas.'
- source_word: אוֹדֶה
  choice: pupurihin ko
  rationale: Ang anyong Hiphil ng ידה ay maaaring mangahulugang pagpuri o pasasalamat. Ang 'pupurihin ko' ay natural dito at pinananatili ang ugnayang pandiwa sa pangalang Juda.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang banal na nakasulat sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: עַל כֵּן קָרְאָה שְׁמוֹ
  choice: Kaya pinangalanan niya itong
  rationale: Natural na Filipino para sa literal na idyomang 'tinawag niya ang pangalan nito,' habang malinaw na pinananatili ang ugnayang sanhi.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Ginagamit ang nakagawiang anyo ng pangalang biblikal sa modernong Tagalog; ipinaliliwanag sa talababa ang laro sa tunog at kahulugan sa Hebreo.
- source_word: וַתַּעֲמֹד מִלֶּדֶת
  choice: Pagkatapos nito, tumigil muna siyang manganak
  rationale: Ang עמד מן ay nangangahulugang huminto sa isang gawain. Ang 'muna' ay angkop sa konteksto sapagkat pansamantala ang paghinto ni Lea sa panganganak, ngunit hindi nito ipinahihiwatig na alam iyon ni Lea sa sandaling ito.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa orihinal na teksto. Pinananatili ng 'Yahweh' ang pangalan sa halip na palitan ito ng titulong 'PANGINOON'; hindi rin ginagamit ang huling anyong 'Jehovah.'
- issue: Saklaw ng אוֹדֶה bilang pagpuri o pasasalamat
  choice: pupurihin ko
  alternative: magpapasalamat ako kay
  rationale: Parehong posible sa leksikon ang pagpuri at pasasalamat. Pinili ang 'pupurihin ko' dahil akma ito sa pormula ng pagbibigay-pangalan at malinaw ang kaugnayan nito sa Juda, habang kinikilala sa talababa ang mas malawak na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang “naglihi” at “nagsilang” bilang mga karaniwang terminong biblikal na nauunawaan pa rin ngayon. Inilagay ang talababa pagkatapos ng “Juda,” kung saan pinakamalinaw ang paliwanag sa pagbibigay-pangalan.
