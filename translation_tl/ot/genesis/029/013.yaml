  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ לָבָ֜ן אֶת שֵׁ֣מַע יַעֲקֹ֣ב בֶּן אֲחֹת֗/וֹ וַ/יָּ֤רָץ לִ/קְרָאת/וֹ֙ וַ/יְחַבֶּק ל/וֹ֙ וַ/יְנַשֶּׁק ל֔/וֹ וַ/יְבִיאֵ֖/הוּ אֶל בֵּית֑/וֹ וַ/יְסַפֵּ֣ר לְ/לָבָ֔ן אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/013.yaml
  text: And when Laban heard the news about Jacob[a], his sister’s son, he ran to meet him and embraced him and kissed him and brought him to his house[c][b]. Then Jacob told Laban all these things.
translation:
  language: tl
  text: Nang marinig ni Laban ang balita tungkol kay Jacob[a], na anak ng kapatid na babae ni Laban, tumakbo siya upang salubungin si Jacob. Niyakap at hinagkan niya si Jacob, at dinala niya ito sa kanyang bahay. Pagkatapos, isinalaysay ni Jacob[b] kay Laban ang lahat ng bagay na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang ulat tungkol kay Jacob.”
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang pinangalanan sa Hebreo ang gumagawa ng kilos na ito; ipinahihiwatig ng konteksto na si Jacob ang nagsalaysay kay Laban.
    reason: source_ambiguity
lexical_decisions:
- source_word: כִשְׁמֹעַ לָבָן
  choice: Nang mabalitaan ni Laban
  rationale: Ang כ na may infinitive construct ay bumubuo ng sugnay na temporal. Likas sa makabagong Tagalog ang “nang mabalitaan” at hindi nito pinalalabis ang agarang pagkilos.
- source_word: שֵׁמַע יַעֲקֹב
  choice: ang tungkol kay Jacob
  rationale: Ang שֵׁמַע ay tumutukoy sa balita o ulat tungkol kay Jacob. Sa Tagalog, nasa pandiwang “mabalitaan” na ang diwa ng balita, kaya iniiwasan ang mabigat na pag-uulit na “mabalitaan ang balita.”
- source_word: בֶּן אֲחֹתוֹ
  choice: anak ng kanyang kapatid na babae
  rationale: Pinananatili nito ang tiyak na ugnayang-pampamilya na hayagang binabanggit sa Hebreo, sa halip na paikliin lamang bilang “pamangkin.”
- source_word: וַיָּרָץ לִקְרָאתוֹ
  choice: tumakbo siya upang salubungin ito
  rationale: Ang לִקְרָאתוֹ ay nangangahulugang lumabas o pumunta upang makipagtagpo. Ang “salubungin” ay malinaw at natural sa konteksto.
- source_word: וַיְחַבֶּק לוֹ וַיְנַשֶּׁק לוֹ
  choice: Niyakap at hinagkan niya si Jacob
  rationale: Tuwirang inilalarawan ng mga pandiwa ang magiliw na pagbati ng magkamag-anak. Ang “hinagkan” ay marangal at angkop sa salaysay.
- source_word: וַיְבִיאֵהוּ אֶל־בֵּיתוֹ
  choice: dinala sa kanyang bahay
  rationale: Ang causative na anyo ng בוא ay “dalhin,” at ang אֶל־בֵּיתוֹ ay natural na “sa kanyang bahay.”
- source_word: וַיְסַפֵּר לְלָבָן
  choice: isinalaysay ni Jacob kay Laban
  rationale: Ang ספר sa Piel ay “magsalaysay” o “magkuwento.” Tahasang pinangalanan si Jacob upang malinaw ang pagbabago ng gumaganap matapos ang sunod-sunod na kilos ni Laban.
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: ang lahat ng nangyari
  rationale: Sa konteksto, ang דְּבָרִים ay tumutukoy sa mga pangyayari o usaping isinalaysay, hindi lamang sa mga salitang binigkas.
theological_decisions:
- issue: Hindi hayag na paksa ng וַיְסַפֵּר
  choice: Si Jacob ang tahasang pinangalanang nagsalaysay.
  alternative: “Siya” ang nagsalaysay, na maaaring unang ipalagay na tumutukoy kay Laban.
  rationale: Bagaman walang nakasaad na pangngalang paksa sa Hebreo at si Laban ang paksa ng mga naunang pandiwa, hinihingi ng “kay Laban” na ibang tao ang nagsasalaysay; sa konteksto, iyon ay si Jacob. Nililinaw ito sa teksto habang itinatala sa talababa ang di-hayag na paksa ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “hinagkan” at “isinalaysay” upang mapanatili ang dignidad ng salaysay, samantalang ang ayos ng mga pangungusap ay nananatiling natural sa karaniwang mambabasa.
