revisions:
- from: Nang mabalitaan ni Laban ang tungkol kay Jacob[a], na anak ng kanyang kapatid na babae, tumakbo siya upang salubungin ito. Niyakap at hinagkan niya si Jacob, at dinala sa kanyang bahay. Pagkatapos, isinalaysay ni Jacob[b] kay Laban ang lahat ng nangyari.
  to: Nang marinig ni Laban ang balita tungkol kay Jacob[a], na anak ng kapatid na babae ni Laban, tumakbo siya upang salubungin si Jacob. Niyakap at hinagkan niya si Jacob, at dinala niya ito sa kanyang bahay. Pagkatapos, isinalaysay ni Jacob[b] kay Laban ang lahat ng bagay na ito.
  rationale: Pinalitan ang malabong panghalip sa paglalarawan ng pagkakamag-anak upang malinaw na kapatid na babae ni Laban ang tinutukoy. Pinalitan din ang hindi-angkop na “ito” bilang layon ng pagsalubong. Ginawang mas malapit sa saklaw ng Hebreo ang pangwakas na parirala, nang hindi ipinipilit kung ang mga “bagay” ay mga salita, usapin, o pangyayari.
