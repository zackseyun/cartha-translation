  text: So he went in to Rachel also[a], and he loved Rachel more than Leah; and he served with him for another seven years.
translation:
  language: tl
  text: Kaya nakipagsiping din si Jacob kay Raquel. Minahal din niya si Raquel nang higit kaysa kay Lea,[a] at naglingkod siya kay Laban sa loob pa ng pitong taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “minahal niya si Raquel sa halip na si Lea.” Ang pang-ukol sa Hebreo ay maaaring magpahiwatig ng paghahambing; dito, ang pinakanatural na diwa ay “nang higit kaysa kay Lea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גַּם אֶל־רָחֵל
  choice: nakipagtalik din si Jacob kay Raquel
  rationale: Sa konteksto ng pag-aasawa, ang בוא אֶל ay isang idyomang tumutukoy sa pagsiping at pagganap sa pagsasama bilang mag-asawa. Ang tahasang ngunit marangal na “nakipagtalik” ay malinaw sa modernong Filipino; pinanatili ng “din” ang גַּם.
- source_word: וַיֶּאֱהַב גַּם אֶת־רָחֵל
  choice: Minahal niya si Raquel
  rationale: Ang אָהַב ay karaniwang pandiwang “magmahal.” Hindi dinagdagan ng pang-abay na wala sa Hebreo. Hindi na hiwalay na isinalin ang ikalawang גַּם dahil likas nang ipinahihiwatig ng daloy at magiging mabigat ang pag-uulit ng “din” sa Filipino.
- source_word: מִלֵּאָה
  choice: nang higit kaysa kay Lea
  rationale: 'Ang מִן kasunod ng pandiwa ng pagmamahal ay pinakanatural na naghahayag ng paghahambing dito: mas mahal niya si Raquel kaysa kay Lea. Ang alternatibong eksklusibong diwa ay inilagay sa talababa upang mapanatili ang saklaw ng Hebreo.'
- source_word: וַיַּעֲבֹד עִמּוֹ
  choice: naglingkod pa siya kay Laban
  rationale: Ang עבד ay “maglingkod/magtrabaho,” at ang עִמּוֹ ay literal na “kasama niya.” Sa Filipino, “naglingkod kay Laban” ang natural na paglalarawan sa patuloy na paggawa sa ilalim niya; tinukoy ang pangalang Laban upang maging malinaw ang reperente ng panghalip.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: nang pitong taon
  rationale: Ang “pa” sa “naglingkod pa” kasama ng “pitong taon” ay natural na naghahayag ng karagdagang pitong taon nang hindi inuulit ang ideya ng pagdaragdag.
theological_decisions:
- issue: Kung paghahambing o pagtatangi ang diwa ng מִן sa מִלֵּאָה
  choice: nang higit kaysa kay Lea
  alternative: sa halip na si Lea
  rationale: Mas angkop sa konteksto at karaniwang gamit ng מִן ang paghahambing, ngunit posible ang mas matinding pagtatangi; kaya hindi ito tuluyang inalis at binanggit sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang mga pangalang Jacob, Raquel, Lea, at Laban ayon sa karaniwang anyong Filipino. Tahasan ang seksuwal na idyoma ngunit hindi malaswa; natural ang sintaks at pinanatili ang paghahambing at ang tunay na alternatibong pagbasa sa talababa.
