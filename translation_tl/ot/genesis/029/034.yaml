revisions:
- from: At muli siyang nagdalang-tao at nagsilang ng isang anak na lalaki. Sinabi niya, “Ngayon, sa pagkakataong ito, mapapalapit na sa akin ang asawa ko, sapagkat ipinanganak ko sa kaniya ang tatlong anak na lalaki.” Kaya tinawag na Levi[a] ang pangalan nito.
  to: At muli siyang nagdalang-tao at nagsilang ng isang anak na lalaki. Sinabi niya, “Ngayon, sa pagkakataong ito, makakaugnay na sa akin ang asawa ko,[a] sapagkat nagsilang ako para sa kaniya ng tatlong anak na lalaki.” Kaya Levi ang itinawag sa kaniya.
  rationale: Pinalitan ang mas malabong “mapapalapit” ng “makakaugnay” upang mas maipakita ang saklaw ng Niphal ng לוה at ang etimolohikal na paglalaro sa Levi. Inayos ang idiomang Tagalog para sa ‘I have borne him three sons’ at ang pormula ng pagpapangalan, habang pinananatili ang kalabuan tungkol sa kung sino ang nagpangalan.
