language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר עַתָּ֤ה הַ/פַּ֨עַם֙ יִלָּוֶ֤ה אִישִׁ/י֙ אֵלַ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שְׁלֹשָׁ֣ה בָנִ֑ים עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ לֵוִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/034.yaml
  text: And she conceived again and bore a son[a], and said, “Now this time my husband will be attached to me, because I have borne him three sons.” Therefore his name was called Levi.
translation:
  language: tl
  text: At muli siyang nagdalang-tao at nagsilang ng isang anak na lalaki. Sinabi niya, “Ngayon, sa pagkakataong ito, makakaugnay na sa akin ang asawa ko,[a] sapagkat nagsilang ako para sa kaniya ng tatlong anak na lalaki.” Kaya Levi ang itinawag sa kaniya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makakalakip na sa akin.” Sa Hebreo, ang pandiwa ay katunog ng pangalang Levi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: At muli siyang nagdalang-tao
  rationale: Ang הרה ay tumutukoy sa paglilihi o pagdadalang-tao, at malinaw na naipapahayag ng “muli” ang עוֹד sa likas na modernong Tagalog.
- source_word: וַתֵּלֶד בֵּן
  choice: at nagsilang ng isang anak na lalaki
  rationale: Karaniwang pormula ito para sa panganganak ng isang anak na lalaki; dignified at natural ang “nagsilang.”
- source_word: עַתָּה הַפַּעַם
  choice: Ngayon, sa pagkakataong ito
  rationale: Pinananatili nito ang dalawang elementong nagbibigay-diin sa Hebreo nang hindi dinaragdagan ng ideyang “sa wakas.”
- source_word: יִלָּוֶה
  choice: mapapalapit na
  rationale: Ipinahihiwatig ng Niphal ng לוה ang pagiging kalakip o kaugnay. Sa kontekstong mag-asawa, natural na ipinapahayag ng “mapapalapit” ang inaasam na relasyonal na pagkakalapit, habang inilalahad sa talababa ang mas literal na alternatibo at ang paglalaro sa tunog ng Levi.
- source_word: אִישִׁי אֵלַי
  choice: sa akin ang asawa ko
  rationale: Sa konteksto ng pag-aasawa, ang אִישִׁי ay “asawa ko,” at pinananatili ng “sa akin” ang direksiyong ipinahihiwatig ng אֵלַי.
- source_word: כִּי יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים
  choice: sapagkat ipinanganak ko sa kaniya ang tatlong anak na lalaki
  rationale: Inilalahad ng כִּי ang dahilan; ang “sa kaniya” ay kumakatawan sa לוֹ, at malinaw na pinananatili ang bilang na tatlo.
- source_word: עַל כֵּן קָרָא שְׁמוֹ
  choice: Kaya tinawag na ... ang pangalan nito
  rationale: Walang tahasang paksa ang pandiwang panlalaki na קָרָא. Ang pasibong ayos sa Tagalog ay umiiwas sa di-makatwirang pagtukoy kung sino ang nagpangalan.
- source_word: לֵוִי
  choice: Levi
  rationale: Ginagamit ang karaniwang transliterasyon ng personal na pangalan at pinananatili ang ugnayan nito sa λוה sa pamamagitan ng talababa.
theological_decisions:
- issue: Paglalaro sa salita sa pagitan ng יִלָּוֶה at לֵוִי
  choice: “mapapalapit na sa akin” sa pangunahing teksto, na may talababa para sa “makakaugnay/makakalakip” at sa pagkakatunog sa Levi
  alternative: “makakaugnay na sa akin” o “makakalakip na sa akin”
  rationale: Mas natural sa modernong Tagalog ang “mapapalapit” para sa inaasam na ugnayan ng mag-asawa, ngunit kailangang ipaalam ang mas literal na saklaw at ang Hebreong paglalaro sa pangalan.
- issue: Hindi tahasang tinukoy kung sino ang nagpangalan
  choice: Gumamit ng pasibong “tinawag na Levi ang pangalan nito”
  alternative: “tinawag niyang Levi ang pangalan nito,” na maaaring tumukoy kay Lea o sa asawa niya
  rationale: Pinananatili ng pasibo ang tunay na kalabuan ng Hebreo sa halip na magdagdag ng isang tiyak na tagapagpangalan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nagdalang-tao” at “nagsilang” bilang natural ngunit hindi kolokyal na pananalita. Iniwasan ang pagdaragdag ng paksa sa pormula ng pagpapangalan, at inilagay ang marker na [a] pagkaraan ng “Levi,” ang terminong ipinaliliwanag ng talababa.
