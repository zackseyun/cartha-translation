base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/016.yaml
  text: Laban had two daughters; the name of the older was Leah[a], and the name of the younger was Rachel.
translation:
  language: tl
  text: 'May dalawang anak na babae si Laban: Lea[a] ang pangalan ng nakatatanda, at Raquel ang pangalan ng nakababata.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na Hebreo, “kay Laban ay dalawang anak na babae,” isang idyomang nangangahulugang “may dalawang anak na babae si Laban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְלָבָן
  choice: May ... si Laban
  rationale: Ang Hebreong pang-ukol na konstruksyong literal na ‘kay Laban ay’ ay idyoma ng pagmamay-ari. Likas itong ipinapahayag sa Tagalog sa pamamagitan ng ‘may ... si Laban.’ Hindi na ginawang hiwalay na salita ang waw dahil sapat ang daloy ng salaysay at wala itong tahasang temporal na diwang ‘ngayon.’
- source_word: שְׁתֵּי בָנוֹת
  choice: dalawang anak na babae
  rationale: Tumpak at karaniwang Tagalog para sa bilang at pangngalang tumutukoy sa mga anak na babae.
- source_word: שֵׁם
  choice: ang pangalan ng
  rationale: Pinananatili sa dalawang magkatimbang na sugnay ang inuulit na pormula ng Hebreo tungkol sa pangalan, habang inaayos sa likas na ayos ng Tagalog.
- source_word: הַגְּדֹלָה
  choice: nakatatanda
  rationale: Sa konteksto ng dalawang magkapatid na babae, tumutukoy ito sa mas matanda sa edad, hindi sa mas malaki ang katawan o mas dakila.
- source_word: לֵאָה
  choice: Lea
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga Bibliyang Tagalog.
- source_word: וְשֵׁם
  choice: at ... ang pangalan ng
  rationale: Pinananatili ang pang-ugnay at ang paralelismong inuulit ang pormula ng pagkilala sa pangalan.
- source_word: הַקְּטַנָּה
  choice: nakababata
  rationale: Sa ugnayan ng magkapatid, malinaw nitong ipinahahayag ang mas bata sa edad sa halip na mas maliit ang sukat.
- source_word: רָחֵל
  choice: Raquel
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa modernong tradisyong Bibliyang Tagalog.
