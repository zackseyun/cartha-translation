  text: וַ/יֵּ֤שֶׁב עֵשָׂו֙ בְּ/הַ֣ר שֵׂעִ֔יר עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/008.yaml
  text: So Esau settled in the hill country of Seir[a]; Esau is Edom.
translation:
  language: tl
  text: Kaya nanirahan si Esau sa bulubundukin ng Seir[a]; si Esau ay Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga bundok ng Seir” o “sa Bundok Seir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Ang pandiwang ישׁב sa anyong pasalaysay ay tumutukoy rito sa paninirahan o pagtira sa isang lugar. Natural sa makabagong Tagalog ang “nanirahan” at hindi nito labis na ipinahihiwatig ang unang pagtatatag ng tirahan.
- source_word: בְּהַר
  choice: sa bulubundukin ng
  rationale: Maaaring tumukoy ang הַר sa isang bundok o sa isang rehiyong mabundok. Dahil teritoryal na lugar ang Seir sa konteksto, malinaw at likas ang “bulubundukin ng,” habang pinananatili sa talababa ang ibang posibleng pagbasa.
- source_word: שֵׂעִיר
  choice: Seir
  rationale: Pangalan ng lugar; ginamit ang karaniwang anyong “Seir” sa Tagalog na salin ng Bibliya.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Pangalan ng tao; ginamit ang nakaugaliang anyong “Esau” sa Tagalog.
- source_word: הוּא אֱדוֹם
  choice: si Esau ay Edom
  rationale: Tuwirang pinananatili nito ang walang-pandiwang sugnay ng pagkakakilanlan sa Hebreo at ang ugnayang pangangkan sa pagitan ni Esau at Edom.
theological_decisions:
- issue: Pagkakakilanlan ni Esau at Edom
  choice: si Esau ay Edom
  alternative: siya rin si Edom / ibig sabihin, Edom
  rationale: Pinananatili ng tuwirang pahayag ang lakas at bahagyang tensiyon ng Hebreong pagkakakilanlan nang hindi ipinapaliwanag kung ito ay tumutukoy sa tao, sa ninuno, o sa bayang nagmula sa kaniya.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “bulubundukin” para sa heograpikong diwa ng הַר, at iniwasan ang mas lumang “tumahan.”
