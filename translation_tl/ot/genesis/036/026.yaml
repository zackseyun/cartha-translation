  yaml_path: translation/ot/genesis/036/026.yaml
  text: 'And these were the sons of Dishan: Hemdan[a], Eshban, Ithran, and Keran.'
translation:
  language: tl
  text: 'At ito ang mga anak ni Disan: sina Hemdan, Esban, Itran, at Keran.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang salin, “Cheran” ang baybay sa pangalang ito. “Keran” ang ginamit dito upang mas tuwirang katawanin ang katinig na kaf (כ) sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: At ito ang
  rationale: Ipinananatili ng “At” ang pang-ugnay na וְ, samantalang natural sa Filipino ang “ito ang” bilang panimula sa talaan kahit walang tahasang pandiwa ang Hebreo.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Tumutukoy ang construct form sa mga anak na lalaki ni Disan. Sa Filipino, natural na gamitin ang “mga anak ni,” at malinaw na mga lalaki ang tinutukoy dahil sa mga pangalang nakatala.
- source_word: דִישָׁן
  choice: Disan
  rationale: Isinatinig ang pangalang Hebreo ayon sa likas na baybay at bigkas sa Filipino; ang titik shin ay kinakatawan ng “s” sa halip na ng digrapong Ingles na “sh.”
- source_word: חֶמְדָּן
  choice: Hemdan
  rationale: Malapit na pagsasatinig sa anyong Hebreo at malinaw basahin sa Filipino.
- source_word: וְ/אֶשְׁבָּן
  choice: Esban
  rationale: Isinatinig ang pangalang Hebreo sa baybay na natural sa Filipino; ang prefixed conjunction ay naipapakita sa bantas at sa “at” bago ang huling pangalan.
- source_word: וְ/יִתְרָן
  choice: Itran
  rationale: Direktang pagsasatinig ng pangalang Hebreo na angkop sa ponolohiya at ortograpiyang Filipino.
- source_word: וּ/כְרָן
  choice: at Keran
  rationale: Tahasang isinalin ang pang-ugnay bago ang huling pangalan. Ang “K” ay malinaw na kumakatawan sa Hebreong kaf at natural sa Filipino.
