  text: Ito ang mga salinlahi ni Esau (siya si Edom).
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Ito ang
  rationale: Ipinakikilala ng parirala ang isang bagong bahagi. Likas sa modernong Tagalog ang “Ito ang,” samantalang mauunawaan sa konteksto ang puwersa ng pang-ugnay na וְ nang hindi kailangang lagyan ng temporal na “ngayon.”
- source_word: תֹּלְדֹוֹת
  choice: mga salinlahi ni
  rationale: Ang תֹּלְדֹוֹת ay paulit-ulit na pormulang pang-istruktura sa Genesis. Pinananatili ng “mga salinlahi” ang kaugnayan nito sa lahi at mga sumunod na henerasyon nang hindi ito nililimitahan sa “kasaysayan” lamang o sa “mga inapo” lamang.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Ginamit ang nakagawiang anyo ng pangalang ito sa Tagalog na Bibliya.
- source_word: הוּא
  choice: na siya ring
  rationale: Binibigyang-kahulugan nito ang kaugnayan ni Esau sa pangalang Edom sa paraang natural sa Tagalog. Inilalahad sa talababa ang mas tuwirang anyong sugnay upang mapanatili ang posibleng pagbasa sa Hebreo.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Pinanatili ang pangalang pantangi; sa konteksto, ipinakikilala nito ang isa pang pagkakakilanlan o pangalang kaugnay ni Esau.
theological_decisions:
- issue: Saklaw ng תֹּלְדֹוֹת bilang pormulang pampanitikan sa Genesis
  choice: mga salinlahi
  alternative: kasaysayan; mga inapo
  rationale: Pinananatili ng “mga salinlahi” ang malawak na saklaw at paulit-ulit na pormula ng Genesis, sa halip na ipakahulugang salaysay lamang o mga biyolohikal na inapo lamang.
- issue: Pagkakaugnay ni Esau at Edom sa הוּא אֱדוֹם
  choice: na siya ring si Edom
  alternative: siya ay Edom
  rationale: Natural na ipinahahayag ng pangunahing teksto ang pagkakakilanlan, habang pinananatili sa talababa ang mas literal at bahagyang mas mariing sugnay upang hindi burahin ang anyo at maaaring diin ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pangunahing terminong “mga salinlahi” para sa pormulang תֹּלְדֹוֹת at gumamit ng talababa upang ilahad ang mas literal na alternatibo.
