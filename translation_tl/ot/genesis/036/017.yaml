  text: וְ/אֵ֗לֶּה בְּנֵ֤י רְעוּאֵל֙ בֶּן עֵשָׂ֔ו אַלּ֥וּף נַ֨חַת֙ אַלּ֣וּף זֶ֔רַח אַלּ֥וּף שַׁמָּ֖ה אַלּ֣וּף מִזָּ֑ה אֵ֣לֶּה אַלּוּפֵ֤י רְעוּאֵל֙ בְּ/אֶ֣רֶץ אֱד֔וֹם אֵ֕לֶּה בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/017.yaml
  text: 'And these are the sons of Reuel[a], the son of Esau: chief Nahath, chief Zerah, chief Shammah, chief Mizzah. These are the chiefs of Reuel in the land of Edom. These are the sons of Basemath, Esau’s wife.'
translation:
  language: tl
  text: 'At ito ang mga anak ni Reuel na anak ni Esau: ang pinuno[a] na si Nahat, ang pinunong si Zerah, ang pinunong si Shama, at ang pinunong si Miza. Sila ang mga pinuno ni Reuel sa lupain ng Edom. Sila ang mga anak ni Basemat, na asawa ni Esau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinuno ng angkan.” Ang salitang Hebreo ay tumutukoy sa isang pinunong Edomita ng isang lipi o angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito ang
  rationale: Pinananatili ng “At” ang ugnayan sa naunang talaangkanan, habang likas sa Filipino ang pormulang “ito ang.”
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Mga lalaking anak ang isa-isang pinangalanan sa konteksto, kaya tuwiran at angkop ang “mga anak.”
- source_word: רְעוּאֵל בֶּן עֵשָׂו
  choice: Reuel na anak ni Esau
  rationale: Malinaw at natural na ipinapahayag sa Filipino ang genealogical na kaugnayan nang hindi nagdaragdag ng interpretasyon.
- source_word: אַלּוּף
  choice: pinuno
  rationale: Ang salitang Hebreo ay tumutukoy sa isang pinunong Edomita, malamang ng isang angkan o pangkat. Ang “pinuno” ay dignified, malinaw, at hindi kasing-interpretatibo ng “pinuno ng angkan”; inilalahad sa talababa ang mas tiyak na alternatibo.
- source_word: נַחַת
  choice: Nahat
  rationale: Isina-Filipinong transliterasyon ng personal na pangalan ayon sa tunog ng Hebreo.
- source_word: זֶרַח
  choice: Zerah
  rationale: Transliterasyon ng personal na pangalan na pinananatili ang huling katinig ng anyong Hebreo.
- source_word: שַׁמָּה
  choice: Shama
  rationale: Malinaw na transliterasyon para sa mambabasang Filipino; hindi kailangang katawanin sa baybay ang dobleng katinig ng Hebreo.
- source_word: מִזָּה
  choice: Miza
  rationale: Malinaw na transliterasyon para sa mambabasang Filipino; hindi kailangang katawanin sa baybay ang dobleng katinig ng Hebreo.
- source_word: אֵלֶּה אַלּוּפֵי רְעוּאֵל
  choice: Sila ang mga pinuno mula kay Reuel
  rationale: Ipinahihiwatig ng talaangkanan na ang mga pinunong ito ay nagmula kay Reuel. Iniiwasan nito ang di-likas at posibleng malabong “mga pinuno ni Reuel.”
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: sa lupain ng Edom
  rationale: Pinananatili ang tahasang salitang Hebreo para sa “lupain.”
- source_word: בָשְׂמַת אֵשֶׁת עֵשָׂו
  choice: Basemat, na asawa ni Esau
  rationale: Natural na appositional na pagkakakilanlan sa Filipino at malinaw na ipinapakita ang panig ng ina.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na titulong “pinuno” bilang mahalagang anyo ng talaan, at iniwasan ang lumang katawagang katumbas ng “duke.”
