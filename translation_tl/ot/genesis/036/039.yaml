id: GEN.36.39
reference: Genesis 36:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּמָת֮ בַּ֣עַל חָנָ֣ן בֶּן עַכְבּוֹר֒ וַ/יִּמְלֹ֤ךְ תַּחְתָּי/ו֙ הֲדַ֔ר וְ/שֵׁ֥ם עִיר֖/וֹ פָּ֑עוּ וְ/שֵׁ֨ם אִשְׁתּ֤/וֹ מְהֵֽיטַבְאֵל֙ בַּת מַטְרֵ֔ד בַּ֖ת מֵ֥י זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/039.yaml
  text: Baal-hanan son of Achbor died[a], and Hadar reigned in his place. The name of his city was Pau, and the name of his wife was Mehetabel daughter of Matred[c][b], daughter of Me-zahab.
translation:
  language: tl
  text: Namatay si Baal-Hanan na anak ni Acbor, at si Hadar[a] ang naghari bilang kapalit niya. Pau[b] ang pangalan ng kaniyang lungsod, at Mehetabel ang pangalan ng kaniyang asawa—anak ni Matred, na anak naman ni Me-Zahab.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang tradisyong tekstuwal at sa 1 Cronica 1:50, Hadad ang pangalan sa halip na Hadar.
    reason: textual_variant
  - marker: b
    text: Sa 1 Cronica 1:50, Pai ang anyo ng pangalan sa halip na Pau.
    reason: textual_variant
  - marker: c
    text: 'Sa Hebreo, literal: “anak ni Matred, anak ni Me-Zahab.”'
    reason: source_clarity
lexical_decisions:
- source_word: וַיָּמָת
  choice: Namatay
  rationale: Tuwiran at karaniwang katumbas ng pandiwang Hebreo na מות; iniiwasan ang eupemismong “pumanaw.”
- source_word: בַּעַל חָנָן בֶּן עַכְבּוֹר
  choice: si Baal-Hanan na anak ni Acbor
  rationale: Pinananatili ang mga pangalang pantangi at likas sa Tagalog ang hulma na “si X na anak ni Y.”
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: ang naghari bilang kapalit niya
  rationale: Sinasaklaw ng “naghari” ang מלך at malinaw na ipinahahayag ng “bilang kapalit niya” ang diwa ng paghalili sa תַּחְתָּיו.
- source_word: הֲדַר
  choice: Hadar
  rationale: Sinusunod ang anyo ng pangalan sa WLC/Masoretic Text; inilalagay sa talababa ang tekstuwal na anyong Hadad.
- source_word: וְשֵׁם עִירוֹ פָּעוּ
  choice: Pau ang pangalan ng kaniyang lungsod
  rationale: Natural na ayos sa modernong Tagalog habang tapat sa pormulang Hebreo; sinusunod ang pangalang Pau sa WLC.
- source_word: וְשֵׁם אִשְׁתּוֹ מְהֵיטַבְאֵל
  choice: Mehetabel ang pangalan ng kaniyang asawa
  rationale: Malinaw at natural na salin ng pormulang Hebreo nang hindi dinaragdagan ang kahulugan.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: anak ni Matred, na anak naman ni Me-Zahab
  rationale: Ipinakikita ang sunod-sunod na ugnayang pampamilya na ipinahihiwatig ng inuulit na בַּת, habang itinatala sa talababa ang literal na siksik na anyo ng Hebreo.
