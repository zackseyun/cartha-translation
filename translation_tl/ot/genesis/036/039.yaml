  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay ng Kasulatan. Ginamit ang “kaniyang” sa halip na kolokyal na “kanyang,” at pinanatili ang maikli at pormulang estilo ng talaan ng mga hari.
