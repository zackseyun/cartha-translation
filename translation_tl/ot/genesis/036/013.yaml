base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/013.yaml
  text: 'And these were the sons of Reuel: Nahath[a], Zerah, Shammah, and Mizzah. These were the sons of Basemath, Esau’s wife.'
translation:
  language: tl
  text: 'At ito ang mga anak ni Reuel: sina Nahat, Zera, Samma, at Miza. Sila ang mga anak[a] ni Basemat, na asawa ni Esau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak.” Maaari itong tumukoy nang mas malawak sa mga inapo; ayon sa talaangkanan, mga apo sila ni Basemat.
    reason: Nililinaw ang malawak na saklaw ng salitang Hebreo at ang ugnayang ipinakikita ng konteksto nang hindi pinapalitan ang pormulasyon ng pangunahing teksto.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito
  rationale: Pinananatili ng “At” ang pang-ugnay ng Hebreo at likas na ipinagpapatuloy ang talaangkanan.
- source_word: בְּנֵי רְעוּאֵל
  choice: mga anak ni Reuel
  rationale: Mga lalaking tuwirang anak ni Reuel ang isa-isang binabanggit, kaya ang “mga anak” ang malinaw at tumpak na salin.
- source_word: נַחַת וָזֶרַח שַׁמָּה וּמִזָּה
  choice: Nahat, Zera, Sama, at Miza
  rationale: Isinatinig ang mga pangalang pantangi sa paraang natural sa makabagong Filipino, at ginamit ang “at” bago ang huling pangalan upang maging maayos ang talaan.
- source_word: אֵלֶּה הָיוּ
  choice: Sila ang
  rationale: Likas na pormula sa Filipino para tukuyin muli ang mga naunang ipinangalan; ipinahihiwatig na ng salaysay ang nagdaang panahon kaya hindi kailangan ang mabigat na “ang mga ito ay naging.”
- source_word: בְּנֵי בָשְׂמַת
  choice: mga anak ni Basemat
  rationale: Pinananatili sa pangunahing teksto ang mismong salitang pangkamag-anakan ng Hebreo, na maaaring gamitin nang mas malawak para sa mga inapo. Nililinaw sa talababa na mga apo sila ayon sa konteksto.
- source_word: אֵשֶׁת עֵשָׂו
  choice: na asawa ni Esau
  rationale: Natural at malinaw na Filipino para sa pariralang naglalarawan kung sino si Basemat.
theological_decisions:
- issue: Saklaw ng בְּנֵי sa pariralang “mga anak ni Basemat”
  choice: Panatilihin ang “mga anak” sa teksto at ipaliwanag sa talababa ang mas malawak na gamit nito.
  alternative: Isalin nang tuwiran bilang “mga apo ni Basemat.”
  rationale: Sa Hebreo, inuulit ang בְּנֵי (“mga anak”), ngunit ipinakikita ng konteksto na anak ni Basemat si Reuel at samakatuwid ay mga apo niya ang apat na lalaki. Pinananatili ng salin ang anyo at lawak ng orihinal habang iniiwasan ng talababa ang maling pagkaunawa sa talaangkanan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” sa unang pangungusap bilang natural na pananda sa talaan ng mga pangalan; pinanatiling payak ang pormulang pang-talaangkanan.
