revisions:
- from: 'Kinuha ni Esau ang kanyang mga asawa mula sa mga anak na babae ng Canaan: si Ada na anak ni Elon na Hitita, at si Oholibama na anak ni Ana, na anak ni Zibeon na Hivita.[a]'
  to: 'Kumuha si Esau ng mga asawa mula sa mga anak na babae ng Canaan: si Ada, anak ni Elon na Hitita, at si Oholibama, anak ni Ana na anak ni Zibeon na Hivita.[a]'
  rationale: Binago ang ayos ng unang sugnay upang alisin ang kalabuan sa Tagalog habang pinananatili ang literal na diwa ng ‘took … wives from.’ Nilinaw rin ang ayos ng talaangkanan sa pamamagitan ng bantas at pinasak ang talababa upang tumpak nitong itangi ang Masoretikong ‘ang Hivita’ mula sa interpretatibong pagkakaugnay sa ‘Horeo.’
