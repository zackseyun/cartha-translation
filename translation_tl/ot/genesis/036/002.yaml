  text: עֵשָׂ֛ו לָקַ֥ח אֶת נָשָׁ֖י/ו מִ/בְּנ֣וֹת כְּנָ֑עַן אֶת עָדָ֗ה בַּת אֵילוֹן֙ הַֽ/חִתִּ֔י וְ/אֶת אָהֳלִֽיבָמָה֙ בַּת עֲנָ֔ה בַּת צִבְע֖וֹן הַֽ/חִוִּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/002.yaml
  text: 'Esau took his wives from the daughters of Canaan: Adah daughter of Elon the Hittite[a], and Oholibamah daughter of Anah, daughter of Zibeon the Hivite.'
translation:
  language: tl
  text: 'Kumuha si Esau ng mga asawa mula sa mga anak na babae ng Canaan: si Ada, anak ni Elon na Hitita, at si Oholibama, anak ni Ana na anak ni Zibeon na Hivita.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “ang Hivita.” Dahil sa kaugnay na mga talaangkanan, inuunawa ng ilang tagapagpaliwanag ang ugnayang pampamilya sa ibang paraan, kabilang ang pagkakaugnay sa “Horeo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח
  choice: kinuha
  rationale: Pinananatili ang karaniwang kahulugan ng pandiwa na “kumuha.” Sa konteksto, malinaw na ang tinutukoy ay ang pagkuha sa kanila bilang mga asawa, kaya hindi na kailangang palitan ito ng mas interpretatibong “pinakasalan.”
- source_word: נָשָׁיו
  choice: kanyang mga asawa
  rationale: Sa kontekstong ito, ang pangmaramihang anyo ng אִשָּׁה na may hulaping paari ay malinaw na tumutukoy sa mga asawa ni Esau.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: mula sa mga anak na babae ng Canaan
  rationale: Pinananatili ang Hebreong idyomang “mga anak na babae ng Canaan,” na tumutukoy sa mga babaeng kabilang sa mga mamamayan o lupain ng Canaan.
- source_word: בַּת
  choice: anak ni
  rationale: Ito ang natural at malinaw na paraang Tagalog sa pagpapahayag ng tuwirang ugnayang genealogical; hindi kailangang tukuyin ang kasarian dahil mga babae na ang pinapangalanan sa konteksto.
- source_word: הַחִתִּי
  choice: Hitita
  rationale: Ginamit ang makabagong anyong etnonimo sa Tagalog para sa “Hittite,” at iniugnay ito kay Elon nang hindi nagdaragdag ng paliwanag.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Malapit na transliterasyon sa Hebreong pangalan at angkop sa ortograpiyang Tagalog.
- source_word: הַחִוִּי
  choice: Hivita
  rationale: Sinusunod ng pangunahing teksto ang Masoretikong anyong חִוִּי, “Hivita,” habang inilalahad sa talababa ang kaugnay na alternatibong pagkakakilanlan.
theological_decisions:
- issue: Genealogical at etnikong katawagan sa huling parirala
  choice: 'Sinunod ang Masoretikong Teksto: “Hivita.”'
  alternative: Ipinapalagay ng ilan, batay sa kaugnay na mga talaangkanan, na “Horeo” ang tinutukoy.
  rationale: May tunay na tensiyong genealogical sa mga kaugnay na talata. Hindi ito tahimik na pinagkasundo; ang natanggap na tekstong Hebreo ang nasa pangunahing salin at ang alternatibo ay nasa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang anyo ng talaangkanan at ang idyomang “mga anak na babae ng Canaan,” ngunit ginamit ang natural na “anak ni” para sa Hebreong construct na בַּת. Inilagay ang panandang [a] pagkatapos ng “Hivita,” na siyang katawagang tinatalakay ng talababa.
