lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na pormulang Tagalog para ipakilala ang kasunod na talaan; ang isahang “ito” ay tumutukoy sa talaan bilang kabuuan, samantalang ang “mga anak” ang nagpapahayag ng maramihan.
- source_word: בְנֵי
  choice: mga anak ni
  rationale: Sa kontekstong talaangkanan, tumutukoy ito sa mga lalaking anak na agad pinangalanan; sapat at natural sa Tagalog ang “mga anak,” at nililinaw ng mga pangalang panlalaki ang tinutukoy.
- source_word: דִישָׁן
  choice: Disan
  rationale: Isinalin sa karaniwang anyong Tagalog ng pangalang Hebreo, na gumagamit ng “s” para sa tunog ng שׁ.
- source_word: עוּץ
  choice: Uz
  rationale: Transliterasyon ng pangalang pantangi na nagpapanatili sa nakikilalang anyong biblikal sa Tagalog.
- source_word: וַאֲרָן
  choice: at Aran
  rationale: Tuwirang ipinahayag ang pang-ugnay na ו bilang “at,” kasunod ang transliterasyon ng pangalang pantangi.
