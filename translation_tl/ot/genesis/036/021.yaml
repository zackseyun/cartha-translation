  yaml_path: translation/ot/genesis/036/021.yaml
  text: and Dishon[a], and Ezer, and Dishan. These are the chiefs of the Horites, the sons of Seir, in the land of Edom.
translation:
  language: tl
  text: at sina Dishon, Ezer, at Dishan. Sila ang mga pinuno[a] ng mga Horita, na mga anak ni Seir, sa lupain ng Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pinuno ng mga angkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִשׁוֹן
  choice: Dishon
  rationale: Pangngalang pantangi; tinumbasan sa paraang transliterasyon at pinanatiling naiiba sa pangalang Dishan.
- source_word: אֵצֶר
  choice: Ezer
  rationale: Pangngalang pantangi; ginamit ang karaniwang anyong transliterado.
- source_word: דִישָׁן
  choice: Dishan
  rationale: Pangngalang pantangi; tinumbasan sa paraang transliterasyon at pinanatiling naiiba sa Dishon.
- source_word: אֵלֶּה
  choice: Sila ang
  rationale: Likas na pormulang Filipino para sa maramihang demonstratibong nagpapakilala sa mga naunang binanggit.
- source_word: אַלּוּפֵי
  choice: mga pinuno
  rationale: Tumutukoy sa mga pinunong panlipunan at pampolitika ng mga pangkat; malinaw at kasalukuyang Filipino, nang hindi gumagamit ng makaluma o labis na tiyak na titulo.
- source_word: הַחֹרִי
  choice: ng mga Horeo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo ang gamit at tumutukoy sa pangkat-etniko; natural sa Filipino ang maramihang anyo.
- source_word: בְּנֵי שֵׂעִיר
  choice: na mga anak ni Seir
  rationale: Pinananatili ang pormal na pananalitang pangkanunu-nunuan na 'mga anak,' sa halip na agad itong ipakahulugang 'mga inapo.'
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: sa lupain ng Edom
  rationale: Pinananatili ang tahasang salitang 'lupain' at ang heograpikong diin ng Hebreo.
