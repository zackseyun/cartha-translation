  verdict: revise
  source_fidelity: Tapat ang salin sa pagkakasunod ng mga pangalan, sa pormulang pagkakakilanlan, sa katayuang pamunuan ng אַלּוּפֵי, sa ugnayang pangkanunu-nunuan na “mga anak ni Seir,” at sa “lupain ng Edom.” Gayunman, ang “Horeo” ay hindi ang karaniwan o pinakanakikilalang anyong Filipino para sa etnonym na Horites; “mga Horita” ang mas malinaw at likas na anyo.
  naturalness: Natural ang pangungusap at ang “Sila ang mga pinuno.” Ang pagpapalit sa “Horeo” tungo sa “Horita” ay nagpapabuti sa kasalukuyang gamit at pagkakapare-pareho ng pangalang-etniko sa Filipino.
  terminology: Ang “mga pinuno” ay angkop para sa אַלּוּפֵי at hindi nagdadagdag ng tiyak na sistemang pampolitika. Ang talababa ay dapat gumamit ng “mga angkan” upang malinaw na ang tinutukoy ay mga pinunong namumuno sa mga pangkat/angkan, hindi isang malabong tambalang parirala.
  issues:
