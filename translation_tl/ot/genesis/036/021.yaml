    issue: Di-karaniwang anyong etniko ang “mga Horeo.”
    rationale: Para sa Hebrew הַחֹרִי, na kolektibong tumutukoy sa Horites, mas natural at madaling makilala sa modernong Filipino ang “mga Horita.”
  - severity: low
    issue: Maaaring linawin ang alternatibo sa talababa.
    rationale: Ang “mga pinuno ng angkan” ay maaaring basahing pinuno ng iisang angkan; “mga pinuno ng mga angkan” ay mas malinaw na katumbas ng clan leaders.
  revised_text: at sina Dishon, Ezer, at Dishan. Sila ang mga pinuno[a] ng mga Horita, na mga anak ni Seir, sa lupain ng Edom.
