base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/012.yaml
  text: Timna was a concubine of Eliphaz[a], Esau’s son, and she bore Amalek to Eliphaz. These are the sons of Adah[b], Esau’s wife.
translation:
  language: tl
  text: Si Timna ay isang babaeng kinakasama ni Elifaz[a], na anak ni Esau, at ipinanganak niya kay Elifaz si Amalek. Ang mga ito ang mga anak ni Ada[b], na asawa ni Esau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “babaeng kinakasama” ay tumutukoy sa isang babaeng nasa kinikilalang ugnayan na tulad ng pag-aasawa ngunit mas mababa ang katayuan kaysa sa pangunahing asawa.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ni Ada.” Maaaring gamitin ang “mga anak” sa mas malawak na diwa na “mga inapo”; sa konteksto, kabilang dito ang mga apo ni Ada.
    reason: genealogical_ambiguity
lexical_decisions:
- source_word: וְתִמְנַע הָיְתָה
  choice: Si Timna ay
  rationale: Ang pang-ugnay na וְ ay hindi kailangang ihayag nang hiwalay sa natural na Tagalog; ang הָיְתָה ay nagsisilbing kopula na inilalarawan ng “ay.”
- source_word: פִילֶגֶשׁ
  choice: kinakasama
  rationale: Tumutukoy ito sa isang kinikilalang ugnayang seksuwal o parang pag-aasawa ngunit mas mababa ang katayuan kaysa sa pangunahing asawa. Ang “kinakasama” ay likas sa modernong Filipino, bagaman hindi nito lubos na naihahayag ang sinaunang legal na katayuan; nililinaw ito sa talababa.
- source_word: לֶאֱלִיפַז בֶּן עֵשָׂו
  choice: ni Elifaz, na anak ni Esau
  rationale: Idyomatikong ipinapahayag ng “ni” ang kaugnayan kay Elifaz, at malinaw na isinasalin ang construct chain na “anak ni Esau.”
- source_word: וַתֵּלֶד לֶאֱלִיפַז אֶת־עֲמָלֵק
  choice: at ipinanganak niya kay Elifaz si Amalek
  rationale: Pinananatili ang genealogical construction kung saan minamarkahan ng לְ ang ama, habang gumagamit ng natural na pariralang Filipino.
- source_word: אֵלֶּה בְּנֵי עָדָה
  choice: Ito ang mga anak ni Ada
  rationale: Ang בְּנֵי ay tuwirang “mga anak,” ngunit maaari ring mas malawak na tumukoy sa mga inapo. Pinananatili sa teksto ang anyong Hebreo at inilalahad sa talababa ang kontekstuwal na posibilidad.
- source_word: אֵשֶׁת עֵשָׂו
  choice: na asawa ni Esau
  rationale: Natural na appositional identification sa Filipino.
theological_decisions:
- issue: Saklaw ng בְּנֵי sa pormulang genealogical
  choice: mga anak ni Ada
  alternative: mga apo ni Ada / mga inapo ni Ada
  rationale: Ang literal na salita ay “mga anak,” ngunit ayon sa talaangkanan ang tinutukoy ay mga anak ni Elifaz at samakatuwid ay mga apo ni Ada. Hindi tahimik na nilulutas ang tensiyong ito; pinananatili ang pormal na pahayag at nililinaw ang mas malawak na gamit sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “kinakasama” sa halip na teknikal at hindi gaanong pangkaraniwang “kalunya,” kasabay ng talababa upang mapanatili ang sinaunang panlipunang pagkakaiba. Ang mga pangalang Elifaz at Ada ay iniangkop sa karaniwang baybay-Filipino.
