- from: 'Ito ang mga anak ni Zibeon: sina Aya at Ana. Ito ang Ana na nakatagpo sa yemim[a] sa ilang habang pinapastol niya ang mga asno ng kanyang amang si Zibeon.'
  to: 'Ito ang mga anak na lalaki ni Zibeon: sina Aya at Anah. Ito ang Anah na nakatagpo sa yemim[a] sa ilang habang pinapastol niya ang mga asno para sa kanyang amang si Zibeon.'
  rationale: Inayos ang salin upang malinaw na tukuyin ang mga anak na lalaki, mapanatili ang relational na diwa ng pariralang “para sa kanyang amang si Zibeon,” at gamitin ang mas tapat at hindi-nakalilitong anyong “Anah.” Pinanatili ang yemim at ang kawalang-katiyakan nito sa talababa, nang hindi pumipili ng isang pinagtatalunang kahulugan.
