base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/024.yaml
  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
translation:
  language: tl
  text: 'Ito ang mga anak na lalaki ni Zibeon: sina Aya at Anah. Ito ang Anah na nakatagpo sa yemim[a] sa ilang habang pinapastol niya ang mga asno para sa kanyang amang si Zibeon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan ng salitang Hebreo na yemim. Nauunawaan ito ng ilan bilang “maiinit na bukal,” at sa ilang sinauna at mas huling pagpapakahulugan, bilang “mga mule.” Pinanatili sa pangunahing teksto ang salitang Hebreo dahil hindi sapat ang katibayang leksikal upang matiyak ang kahulugan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי
  choice: mga anak ni
  rationale: Sa talaangkanang ito, tumutukoy ang parirala sa mga lalaking anak; likas sa Filipino na gamitin ang “mga anak ni” kaysa sa mas mabigat na “mga anak na lalaki ni.”
- source_word: צִבְעוֹן
  choice: Zibeon
  rationale: Isinalin-titik ang pangalang pantangi ayon sa anyong karaniwang ginagamit sa Filipino.
- source_word: אַיָּה
  choice: Aya
  rationale: Isinalin-titik ang pangalang pantangi sa paraang natural bigkasin sa Filipino.
- source_word: עֲנָה
  choice: Ana
  rationale: Isinalin-titik nang pare-pareho ang pangalan sa loob ng talata.
- source_word: הוּא עֲנָה
  choice: Ito ang Ana
  rationale: Ipinahahayag nito ang pagkakakilanlan sa partikular na Ana sa talaangkanan.
- source_word: מָצָא
  choice: nakatagpo
  rationale: Karaniwang kahulugan ng pandiwa ang makatagpo o makahanap; ang “nakatagpo” ay natural habang hindi ipinapalagay kung sinadya ang pagkakatuklas.
- source_word: הַיֵּמִם
  choice: yemim
  rationale: Bihira at hindi tiyak ang kahulugan ng salitang Hebreo. Pinanatili ang transliterasyon upang hindi ipilit sa pangunahing teksto ang isang pinagtatalunang pakahulugan.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, dignified, at malawak na katumbas ng מִדְבָּר, na hindi kinakailangang tumukoy lamang sa disyerto.
- source_word: בִּרְעֹתוֹ
  choice: habang pinapastol niya
  rationale: Ipinakikita ng anyo ang kasabay na kilos. Ang “pinapastol” ay angkop sa pag-aalaga at pagpapakain sa mga asno.
- source_word: הַחֲמֹרִים
  choice: mga asno
  rationale: Malinaw at kasalukuyang salitang Filipino para sa hayop.
- source_word: לְצִבְעוֹן אָבִיו
  choice: ng kanyang amang si Zibeon
  rationale: Natural na ipinahahayag sa Filipino na ang mga asno ay kaugnay o pag-aari ng ama niyang si Zibeon, habang pinananatili ang appositional na pagkakakilanlan.
