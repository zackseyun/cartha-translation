base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/010.yaml
  text: 'These are the names of Esau’s sons: Eliphaz son of Adah[a], Esau’s wife; Reuel son of Basemath[b], Esau’s wife.'
translation:
  language: tl
  text: 'Ito ang mga pangalan ng mga anak na lalaki ni Esau: si Elifaz, anak ni Ada, na asawa ni Esau; si Reuel, anak ni Basemat, na asawa ni Esau.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Ito ang mga pangalan
  rationale: Likas na presentasyonal na pormula sa modernong Tagalog na pinananatili ang deiktikong diin ng Hebreo.
- source_word: בְּנֵי עֵשָׂו
  choice: mga anak na lalaki ni Esau
  rationale: Tiyak na panlalaki ang בְּנֵי at ang dalawang binanggit ay mga anak na lalaki; mas malinaw ito kaysa sa mas malawak na “mga anak.”
- source_word: אֱלִיפַז
  choice: Elifaz
  rationale: Transliterasyon ng pangalang Hebreo ayon sa karaniwang anyong Filipino.
- source_word: בֶּן עָדָה
  choice: anak ni Ada
  rationale: Tuwirang ipinahahayag ng בֶּן ang ugnayang anak na lalaki; sapat na ang “anak” sa kontekstong malinaw nang tumutukoy sa mga anak na lalaki.
- source_word: אֵשֶׁת עֵשָׂו
  choice: asawa ni Esau
  rationale: Tumpak at natural na katumbas ng pariralang konstruktong Hebreo; pinanatili sa dalawang paglitaw.
- source_word: רְעוּאֵל
  choice: Reuel
  rationale: Malapit na transliterasyon ng pangalang Hebreo רְעוּאֵל at kinikilalang anyo sa tradisyong Filipino.
- source_word: בֶּן בָּשְׂמַת
  choice: anak ni Basemat
  rationale: Isinalin nang pareho sa naunang ugnayang magulang-anak.
- source_word: בָּשְׂמַת
  choice: Basemat
  rationale: Direktang transliterasyon ng Hebreong בָּשְׂמַת na angkop sa ortograpiyang Filipino.
