  text: וַ/יָּ֖מָת בָּ֑לַע וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו יוֹבָ֥ב בֶּן זֶ֖רַח מִ/בָּצְרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/033.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: tl
  text: Namatay si Bela, at si Jobab na anak ni Zera, na mula sa Bozra,[a] ang naghari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na taga-Bozra.” Ang pang-ukol sa Hebreo ay maaaring tumukoy sa pinagmulan o kaugnayan sa lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת בָּלַע
  choice: Namatay si Bela
  rationale: Ang wayyiqtol ng מוּת ay nagsasaad ng kasunod na pangyayari sa salaysay; likas sa Tagalog na tahasang ilagay ang pangalang Bela bilang simuno.
- source_word: וַיִּמְלֹךְ
  choice: ang naghari
  rationale: Sa pormula ng paghalili ng mga hari, ang מלך ay likas na isinasaling “naghari,” na sumasaklaw sa pag-upo at pamamahala bilang hari.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Ipinahihiwatig ng תחת na may hulaping panghalip ang paghalili sa dating pinuno; malinaw at natural sa modernong Tagalog ang “bilang kahalili niya.”
- source_word: יוֹבָב בֶּן זֶרַח
  choice: si Jobab na anak ni Zera
  rationale: Tuwirang inililipat ang pangalang pantangi at ang patronimik sa karaniwang ayos ng Tagalog.
- source_word: מִבָּצְרָה
  choice: na mula sa Bozra
  rationale: Karaniwang ipinahihiwatig ng מִן ang pinagmulan, kaya “mula sa Bozra” ang pinakadirektang salin; maaari rin itong magpahiwatig ng kaugnayan sa lungsod.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “bilang kahalili niya” upang natural na maipahayag ang pormula ng paghalili, at pinanatili sa talababa ang saklaw ng kahulugan ng מִן.
