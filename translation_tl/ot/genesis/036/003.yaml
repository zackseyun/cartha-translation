  text: and Basemath[a], the daughter of Ishmael, the sister of Nebaioth.
translation:
  language: tl
  text: at si Basemat, na anak na babae ni Ismael at kapatid na babae ni Nebayot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nebayot: tradisyonal ding binabaybay na “Nebajot” sa ilang salin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: at si
  rationale: Ang וְ ay nagdaragdag ng isa pang pangalan sa talaan, samantalang ang אֶת ay pananda ng tiyak na layon at hindi kailangang isalin nang hiwalay. Ginamit ang “si” bilang likas na pananda sa personal na pangalan sa Tagalog.
- source_word: בָּשְׂמַת
  choice: Basemat
  rationale: Pangngalang pantangi; tinumbasan ayon sa tunog ng Hebreo sa paraang likas sa baybay-Tagalog.
- source_word: בַּת
  choice: anak na babae ni
  rationale: Tuwirang ipinahahayag ang ugnayang magulang-anak at pinananatili ang espesipikong kasarian ng pangngalang Hebreo.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Hebreo.
- source_word: אֲחוֹת
  choice: kapatid na babae ni
  rationale: Pinananatili ang espesipikong kasarian na ipinahahayag ng pangngalang Hebreo.
- source_word: נְבָיוֹת
  choice: Nebayot
  rationale: Isinabaybay ayon sa anyong Hebreo at sa karaniwang ponolohiya ng Tagalog; inilagay sa talababa ang tradisyonal na alternatibong anyo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na simple at marangal. Ginamit ang “anak na babae” at “kapatid na babae” upang mapanatili ang kasariang tahasang nasa Hebreo; pinagsama sa isang likas na sugnay ang dalawang appositional na kaugnayan.
