  yaml_path: translation/ot/genesis/036/041.yaml
  text: Chief Oholibamah[a], chief Elah, chief Pinon.
translation:
  language: tl
  text: Ang pinunong si Oholibama[a], ang pinunong si Ela, at ang pinunong si Pinon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinuno ng angkan” ang salin ng אַלּוּף.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: pinuno
  rationale: Sa talaan ng mga Edomita sa Genesis 36, tumutukoy ito sa pinuno ng isang angkan o pangkat. Likas at marangal sa modernong Tagalog ang “pinuno,” at hindi nito dinaragdagan ang maikling anyo ng tekstong Hebreo.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa anyong madaling bigkasin at basahin sa Filipino.
- source_word: אֵלָה
  choice: Ela
  rationale: Ginamit bilang pantanging pangalan sa talaan, hindi bilang karaniwang pangngalan; isinalin sa payak na transliterasyong Filipino.
- source_word: פִּינֹן
  choice: Pinon
  rationale: Tuwirang transliterasyon ng pantanging pangalang Hebreo, na pinananatili ang anyong walang di-kailangang pagdodoble ng katinig.
theological_decisions: []
translation_notes:
  register: Maikli at paulit-ulit ang ayos upang tularan ang anyo ng talaang Hebreo. Idinagdag ang “si” at “at” para sa natural at malinaw na Filipino nang hindi binabago ang kahulugan.
