base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/043.yaml
  text: Chief Magdiel[a], chief Iram. These are the chiefs of Edom according to their settlements in the land of their possession. This is Esau[d][c][b], the father of Edom.
translation:
  language: tl
  text: Pinunong Magdiel[a], pinunong Iram. Ito ang mga pinuno ng Edom ayon sa kanilang mga pamayanan sa lupaing pag-aari nila.[b] Ito si Esau[c], ang ama ng Edom.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinunong pang-angkan.” Ang salitang Hebreo ay maaaring tumukoy sa pinuno ng isang lipi o angkan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa lupain ng kanilang pag-aari.”
    reason: lexical_alternative
  - marker: c
    text: Mas literal, “Siya si Esau.” Dito, pangwakas na kinikilala si Esau bilang tinutukoy sa buong talaan.
    reason: translation_clarity
  - marker: d
    text: Ibig sabihin, si Esau ang ninuno ng mga Edomita.
    reason: cultural_note
lexical_decisions:
- source_word: אַלּוּף
  choice: pinuno
  rationale: Sa konteksto ng Genesis 36, tumutukoy ito sa mga namumuno sa mga angkan o pangkat ng Edom. Likas at marangal sa modernong Filipino ang “pinuno,” samantalang iniiwasan nito ang makaluma o masyadong espesipikong titulong “duke.”
- source_word: מַגְדִּיאֵל
  choice: Magdiel
  rationale: Pangngalang pantangi na tinumbasan sa pamamagitan ng transliterasyon.
- source_word: עִירָם
  choice: Iram
  rationale: Pangngalang pantangi na tinumbasan sa pamamagitan ng transliterasyon.
- source_word: אַלּוּפֵי אֱדֹם
  choice: mga pinuno ng Edom
  rationale: Inuulit ang salitang “pinuno” upang mapanatili ang pagkakaugnay sa naunang talaan at ang pormal na katawagan sa mga lider ng Edom.
- source_word: לְמֹשְׁבֹתָם
  choice: ayon sa kanilang mga pamayanan
  rationale: Ang לְ ay nagsasaad dito ng pagsasaayos o pag-uuri. Ipinahahayag ng “ayon sa” ang ugnayang iyon, at natural na katumbas ng mga tirahan o pamayanang tinutukoy ang “mga pamayanan.”
- source_word: בְּאֶרֶץ אֲחֻזָּתָם
  choice: sa lupaing pag-aari nila
  rationale: Ang אֲחֻזָּה ay lupain o ari-ariang hawak bilang pag-aari. Malinaw at natural sa Filipino ang pariralang ito nang hindi nawawala ang diwa ng pagmamay-ari.
- source_word: הוּא עֵשָׂו
  choice: Ito si Esau
  rationale: Gumaganap ang parirala bilang pangwakas na pagkakakilanlan ng pinagmulan ng buong talaan. Iniiwasan ng “Ito” ang maling impresyong si Iram lamang ang tinutukoy ng panghalip.
- source_word: אֲבִי אֱדֹם
  choice: ang ama ng Edom
  rationale: Pinananatili nito ang Hebreong idyomang panggenealohiya, kung saan ang “ama” ay maaaring tumukoy sa ninuno o pinagmulan ng isang bayan.
theological_decisions:
- issue: Ang katawagang panggenealohiya kay Esau bilang pinagmulan ng Edom
  choice: ang ama ng Edom
  alternative: ang ninuno ng mga Edomita
  rationale: Pinananatili ng salin ang talinghagang Hebreo at ang posibleng saklaw ng “ama,” habang ipinapaliwanag sa talababa na ang tinutukoy ay ang pagiging ninuno ni Esau ng mga Edomita.
- issue: Ang tinutukoy ng panghalip sa הוּא עֵשָׂו
  choice: Ito si Esau
  alternative: Siya si Esau
  rationale: Mas malinaw na ipinakikita ng “Ito” na ang pahayag ay pangwakas na pagkilala sa pinagmulan ng buong talaan, hindi pagkilala kay Iram bilang Esau; inilalahad sa talababa ang mas literal na anyo.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling estilong pantalaan ng talata, ang magkakatulad na katawagang “pinuno,” at ang Hebreong idyomang “ama ng Edom,” habang nililinaw sa mga talababa ang mga leksikal at panggenealohiyang posibilidad.
