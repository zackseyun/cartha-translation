  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “manirahang magkasama” bilang likas na katumbas ng ישב יחדו, at “tustusan” upang ihatid ang kontekstuwal na kahulugan ng נשא habang ipinaliliwanag sa talababa ang pansamantalang katangian ng kanilang paninirahan.
