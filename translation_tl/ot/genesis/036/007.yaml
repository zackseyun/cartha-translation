  revised_text: Sapagkat napakarami ng kanilang mga ari-arian kaya hindi sila maaaring manirahang magkasama, at hindi sila kayang tustusan ng lupaing pansamantala nilang tinitirhan[a] dahil sa kanilang mga alagang hayop.
