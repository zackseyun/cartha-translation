  yaml_path: translation/ot/genesis/036/007.yaml
  text: For their possessions were too great for them to dwell together[b][a], and the land of their sojourning could not support them because of their livestock.
translation:
  language: tl
  text: Sapagkat napakarami ng kanilang mga ari-arian kaya hindi sila maaaring manirahang magkasama, at hindi sila kayang tustusan ng lupaing pansamantala nilang tinitirhan[a] dahil sa kanilang mga alagang hayop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lupain ng kanilang pansamantalang paninirahan,” na nagpapahiwatig na namumuhay sila roon bilang mga dayong naninirahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng paghihiwalay na binanggit sa naunang talata.
- source_word: רְכוּשָׁם
  choice: kanilang mga ari-arian
  rationale: Malawak na katawagang sumasaklaw sa naipong pag-aari, kasama ang naililipat na yaman.
- source_word: רָב מִשֶּׁבֶת יַחְדָּו
  choice: napakarami ... kaya hindi sila maaaring manirahang magkasama
  rationale: Likas na ipinahahayag sa Tagalog ang labis na dami na naging hadlang sa magkasamang paninirahan.
- source_word: אֶרֶץ מְגוּרֵיהֶם
  choice: lupaing pansamantala nilang tinitirhan
  rationale: Pinananatili ang diwa ng pansamantalang paninirahan o pagiging dayong naninirahan nang hindi gumagamit ng di-likas na teknikal na parirala.
- source_word: לָשֵׂאת אֹתָם
  choice: hindi sila kayang tustusan
  rationale: Ang literal na 'buhatin' o 'pasanin' ay tumutukoy dito sa kakayahan ng lupain na maglaan ng kailangan nila.
- source_word: מִפְּנֵי מִקְנֵיהֶם
  choice: dahil sa dami ng kanilang mga alagang hayop
  rationale: Ipinahahayag ang sanhi at ang kontekstuwal na suliraning dulot ng napakaraming livestock.
