  yaml_path: translation/ot/genesis/036/015.yaml
  text: 'These are the chiefs of the sons of Esau: the sons of Eliphaz[a], Esau’s firstborn: Chief Teman, Chief Omar, Chief Zepho[b], Chief Kenaz.'
translation:
  language: tl
  text: 'Ito ang mga pinuno[a] ng mga anak ni Esau: ang mga anak ni Elifaz, na panganay ni Esau: ang pinunong si Teman, ang pinunong si Omar, ang pinunong si Zefo, at ang pinunong si Kenaz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pinuno ng angkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּפֵי / אַלּוּף
  choice: mga pinuno / pinuno
  rationale: Sa mga talaangkanang Edomita, tumutukoy ang salita sa isang pinuno ng angkan o lipi. Likas at marangal sa makabagong Tagalog ang “pinuno,” samantalang ipinapaliwanag sa talababa ang mas tiyak na posibilidad na “pinuno ng angkan.”
- source_word: בְנֵי
  choice: mga anak ni
  rationale: Pinananatili nito ang literal na ugnayang pang-angkan ng Hebreo; bagaman maaari itong sumaklaw sa mga inapo, hindi kailangang lutasin iyon nang higit sa sinasabi ng teksto.
- source_word: בְּכוֹר
  choice: panganay
  rationale: Tuwirang ipinapahayag ang kaayusan ng kapanganakan at hindi dinaragdagan ang posibleng pahiwatig tungkol sa katayuan.
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Natural na panimula sa Tagalog para sa isang talaan o pagpapakilala.
- source_word: עֵשָׂו / אֱלִיפַז / תֵּימָן / אוֹמָר / צְפוֹ / קְנַז
  choice: Esau / Elifaz / Teman / Omar / Zefo / Kenaz
  rationale: Ginamit ang nakikilalang anyong Filipino ng mga pangalang pantangi, na may “Zefo” bilang tuwirang pagbaybay sa pangalang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan at ang pag-uulit ng titulong “pinuno” para sa bawat pangalan. Ang “mula sa” ay ginamit upang likas na maiugnay sa Filipino ang pangkalahatang pambungad at ang kasunod na pangkat ng mga anak ni Elifaz.
