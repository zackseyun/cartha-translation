  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang gitling na em dash upang malinaw na ang mga pariralang talaangkanan at “asawa ni Esau” ay tumutukoy kay Oholibama, nang hindi binabago ang paulit-ulit na estruktura ng Hebreo.
