id: GEN.36.14
reference: Genesis 36:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הָי֗וּ בְּנֵ֨י אָהֳלִיבָמָ֧ה בַת עֲנָ֛ה בַּת צִבְע֖וֹן אֵ֣שֶׁת עֵשָׂ֑ו וַ/תֵּ֣לֶד לְ/עֵשָׂ֔ו אֶת יעיש וְ/אֶת יַעְלָ֖ם וְ/אֶת קֹֽרַח־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/014.yaml
  text: 'And these were the sons of Oholibamah daughter of Anah, daughter of Zibeon, Esau''s wife: she bore to Esau Jeush, Jalam, and Korah.'
translation:
  language: tl
  text: 'At ito ang mga anak na lalaki ni Oholibama—anak ni Ana, na anak ni Zibeon, at asawa ni Esau: ipinanganak niya kay Esau sina Jeus, Jalam, at Kora.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה הָיוּ
  choice: At ito ang
  rationale: Natural na pormulang Tagalog para sa pambungad ng talaangkanan; pinananatili ng “At” ang pang-ugnay na ו, samantalang hindi na kailangang tahasang tumbasan ang copulang הָיוּ.
- source_word: בְּנֵי
  choice: mga anak na lalaki
  rationale: Mga lalaking anak ang kasunod na pinapangalanan, kaya mas tiyak ito kaysa sa pangkalahatang “mga anak.”
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Transliterasyon ng pangalang pantangi sa anyong madaling basahin sa Filipino.
- source_word: בַת עֲנָה בַּת צִבְעוֹן
  choice: anak ni Ana, na anak ni Zibeon
  rationale: Pinananatili ang dalawang magkasunod na ugnayang “anak ni” sa Hebreo sa halip na pakinisin ang ikalawa bilang “apo,” kaya nananatili ang anyo at posibleng saklaw ng talaangkanan.
- source_word: אֵשֶׁת עֵשָׂו
  choice: asawa ni Esau
  rationale: Direkta at likas na katumbas sa modernong Filipino ng ugnayang construct sa Hebreo.
- source_word: וַ/תֵּלֶד לְ/עֵשָׂו
  choice: ipinanganak niya kay Esau
  rationale: Likas na Filipino na nagpapahayag na ang mga anak ay isinilang niya para o bilang mga anak ni Esau, habang pinananatili ang relational na diwa ng לְ.
- source_word: יעיש
  choice: Jeus
  rationale: Transliterasyong Filipino ng pangalang Hebreo.
- source_word: יַעְלָם
  choice: Jalam
  rationale: Transliterasyong Filipino ng pangalang Hebreo.
- source_word: קֹרַח
  choice: Kora
  rationale: Transliterasyong Filipino ng pangalang Hebreo.
