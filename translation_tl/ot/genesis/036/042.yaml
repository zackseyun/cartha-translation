lexical_decisions:
- source_word: אַלּוּף
  choice: pinuno
  rationale: Sa talaan ng mga Edomita sa Genesis 36, tumutukoy ito sa isang pinuno ng lipi o angkan. Ang “pinuno” ay maikli, natural sa makabagong Filipino, at angkop sa paulit-ulit na anyo ng talaan.
- source_word: קְנַז
  choice: Kenaz
  rationale: Pangalan ito ng tao o angkan, kaya tinumbasan sa pamamagitan ng transliterasyon.
- source_word: תֵּימָן
  choice: Teman
  rationale: Gumaganap dito bilang pangalan sa talaan ng mga pinunong Edomita, kaya transliterasyon ang ginamit sa halip na isalin ang kaugnay nitong kahulugang “timog” o “kanang kamay.”
- source_word: מִבְצָר
  choice: Mibzar
  rationale: Pangalan ito ng tao o angkan, kaya pinanatili sa transliterasyon sa halip na isalin ang leksikal na kahulugan nito.
