  yaml_path: translation/ot/genesis/036/023.yaml
  text: 'These are the sons of Shobal: Alvan[a], Manahath, Ebal, Shepho[b], and Onam.'
translation:
  language: tl
  text: 'Ito ang mga anak na lalaki ni Shobal: sina Alvan[a], Manahat, Ebal, Shefo[b], at Onam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alvan ang nasa Hebreo; Alian naman ang mababasa sa kaugnay na talaan sa 1 Cronica 1:40.
    reason: alternative_reading
  - marker: b
    text: Shefo ang nasa Hebreo; Shefi naman ang mababasa sa kaugnay na talaan sa 1 Cronica 1:40.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Ito ang
  rationale: Ipinakikilala ng pariralang ito ang susunod na tala sa angkan. Likas sa modernong Tagalog ang “Ito ang,” at hindi kailangang isalin nang hiwalay ang panimulang waw.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Tumutukoy rito sa tuwirang listahan ng mga lalaking anak; sa Tagalog, natural at sapat ang “mga anak ni,” samantalang ipinakikita ng mga pangalang nakalista na lalaki sila.
- source_word: שׁוֹבָל
  choice: Shobal
  rationale: Pangngalang pantangi na tinumbasan sa paraang transliterasyon.
- source_word: עַלְוָן
  choice: Alvan
  rationale: Sinusunod ang anyo ng pangalang nasa tekstong Hebreo ng Genesis; binanggit sa talababa ang ibang anyo sa kahawig na talaan.
- source_word: וּ/מָנַחַת
  choice: Manahat
  rationale: Transliterasyon ng pangalang Hebreo ayon sa karaniwang baybay at bigkas sa Filipino; ang pang-ugnay ay naipahahayag ng bantas sa talaan.
- source_word: וְ/עֵיבָל
  choice: Ebal
  rationale: Tuwirang transliterasyon ng pangngalang pantangi mula sa Hebreo.
- source_word: שְׁפוֹ
  choice: Shefo
  rationale: Sinusunod ang anyong nasa tekstong Hebreo ng Genesis, na may Filipino na representasyon ng tunog /f/; iniingatan sa talababa ang ibang anyo sa 1 Cronica 1:40.
- source_word: וְ/אוֹנָם
  choice: at Onam
  rationale: Tuwirang transliterasyon ng pangalan; pinanatili ang pang-ugnay bago ang huling pangalan ayon sa natural na ayos ng listahan sa Tagalog.
