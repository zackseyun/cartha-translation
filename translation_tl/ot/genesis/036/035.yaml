base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/035.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab[b]; and the name of his city was Avith.
translation:
  language: tl
  text: Nang mamatay si Husham, si Hadad na anak ni Bedad ang naghari bilang kapalit niya. Siya ang sumalakay sa Midian sa lupain ng Moab[a]. Avit ang pangalan ng kanyang lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “lupain ng Moab” ay maaari ring isaling “bukirin ng Moab,” “kanayunan ng Moab,” o “teritoryo ng Moab.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Nang mamatay
  rationale: Tuwirang ipinapahayag ng מות ang pagkamatay; natural sa Filipino ang temporal na pagkakaugnay nito sa sumunod na paghahari.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: ang naghari bilang kapalit niya
  rationale: Pinananatili ng “naghari” ang kahulugan ng מלך at malinaw na ipinahahayag ng “bilang kapalit niya” ang paghalili na taglay ng תחתיו.
- source_word: הֲדַד בֶּן בְּדַד
  choice: Hadad na anak ni Bedad
  rationale: Karaniwang makabagong Filipino ang “anak ni” para sa ugnayang ipinahahayag ng בן, habang tinutumbasan sa baybay ang mga pangalang pantangi.
- source_word: הַמַּכֶּה
  choice: Siya ang tumalo
  rationale: Ang Hiphil participle ng נכה ay tumutukoy kay Hadad sa pamamagitan ng isang tanyag na ginawang paglusob o pananakit. Sa konteksto ng isang bayan, natural ang “tumalo,” bagaman maaari ring unawain nang mas literal bilang “sumalakay” o “humampas.”
- source_word: אֶת מִדְיָן
  choice: sa Midian
  rationale: Pinananatili ang pangalang Midian nang hindi tahasang nagpapasya kung ang tinutukoy ay ang bayan o ang mga Midianita.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: sa lupain ng Moab
  rationale: Sa heograpikong parirala, maaaring tumukoy ang שׂדה sa bukirin, kanayunan, o teritoryo; ang “lupain” ay malinaw at natural sa Filipino habang pinananatili ang lawak ng kahulugan.
- source_word: וְשֵׁם עִירוֹ
  choice: Avit ang pangalan ng kanyang lungsod
  rationale: Natural na Filipino para sa pormulang Hebreo ng pagbibigay ng pangalan sa lungsod.
- source_word: עֲוִית
  choice: Avit
  rationale: Isinasatitik ang pangalang-lugar ayon sa bigkas na angkop sa Filipino; hindi kailangang gamitin ang Ingles na anyong “Avith.”
