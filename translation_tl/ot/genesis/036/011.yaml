  text: And the sons of Eliphaz were Teman[a], Omar, Zepho, Gatam, and Kenaz.
translation:
  language: tl
  text: Ang mga anak na lalaki ni Elifaz ay sina Teman, Omar, Zefo[a], Gatam, at Kenaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang salin, “Zepo.” Sinusuportahan ng pagmamarka ng patinig sa Masoretikong Hebreo rito ang anyong “Zefo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay
  rationale: Sa talaangkanan, ang anyong ito ng היה ay nagsisilbing payak na pandiwang nag-uugnay sa ama at sa nakalistang mga anak; hindi nito ipinahihiwatig na sila ay ‘naging’ gayon.
- source_word: בְּנֵי
  choice: mga anak na lalaki ni
  rationale: Tahasang panlalaking maramihan ang Hebreo. Pinananatili ng salin ang kasarian habang gumagamit ng likas na pariralang Tagalog para sa talaangkanan.
- source_word: אֱלִיפָז
  choice: Elifaz
  rationale: Isinatinig ang personal na pangalan sa paraang malinaw at karaniwan sa modernong Filipino.
- source_word: תֵּימָן
  choice: Teman
  rationale: Personal na pangalan ito sa konteksto ng talaangkanan, kaya isinatining at hindi isinalin ayon sa anumang posibleng kahulugan nito.
- source_word: אוֹמָר
  choice: Omar
  rationale: Isinatinig ang personal na pangalan.
- source_word: צְפוֹ
  choice: Zefo
  rationale: Isinatinig ayon sa Masoretikong anyo at ginamit ang ‘f’ na natural sa modernong ortograpiyang Filipino para sa tunog na karaniwang kinakatawan ng ‘ph’ sa Ingles.
- source_word: גַעְתָּם
  choice: Gatam
  rationale: Isinatinig ang personal na pangalan.
- source_word: קְנַז
  choice: Kenaz
  rationale: Isinatinig ang personal na pangalan; pinili ang K sa halip na mas teknikal na Q upang maging madaling basahin sa Filipino.
