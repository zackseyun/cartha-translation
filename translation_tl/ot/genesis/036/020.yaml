source:
  edition: WLC
  text: אֵ֤לֶּה בְנֵֽי שֵׂעִיר֙ הַ/חֹרִ֔י יֹשְׁבֵ֖י הָ/אָ֑רֶץ לוֹטָ֥ן וְ/שׁוֹבָ֖ל וְ/צִבְע֥וֹן וַ/עֲנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/020.yaml
  text: 'These are the sons of Seir the Horite[a], the inhabitants of the land: Lotan, Shobal, Zibeon, and Anah.'
translation:
  language: tl
  text: 'Ito ang mga anak ni Seir na Horeo, ang mga naninirahan sa lupain: sina Lotan, Shobal, Zibeon, at Anah.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na panandang Filipino sa pagpapakilala ng isang talaan; ang isahan na “ito” ay tumutukoy sa kabuuang listahan.
- source_word: בְנֵי
  choice: mga anak ni
  rationale: Pinananatili ang tuwirang pananalitang pangangkan sa Hebreo, sapagkat mga lalaking pangalan ang kasunod.
- source_word: שֵׂעִיר
  choice: Seir
  rationale: Transliterasyon ng pangalang pantangi.
- source_word: הַחֹרִי
  choice: na Horeo
  rationale: Ipinahahayag ang katawagang etniko kay Seir sa natural na anyong Filipino nang hindi dinaragdagan ang kahulugan.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ang mga naninirahan sa lupain
  rationale: Ang pangmaramihang participle ay tumutukoy sa mga anak na nakatala bilang mga naninirahan sa lupain; pinananatili ang hiwalay na appositional na parirala ng Hebreo.
- source_word: לוֹטָן
  choice: Lotan
  rationale: Transliterasyon ng pangalang pantangi.
- source_word: שׁוֹבָל
  choice: Shobal
  rationale: Transliterasyon ng pangalang pantangi.
- source_word: צִבְעוֹן
  choice: Zibeon
  rationale: Transliterasyon ng pangalang pantangi.
- source_word: עֲנָה
  choice: Anah
  rationale: Transliterasyon ng pangalang pantangi.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na may marangal at malinaw na estilong pangangkan. Ginamit ang “sina” bago ang talaan ng mga pangalan. Walang footnote sapagkat ang mungkahing Ingles na alternatibo ay hindi alternatibong kahulugan ng “Horeo”; ang Hebreong יֹשְׁבֵי הָאָרֶץ ay isang hiwalay at pangmaramihang pariralang nangangahulugang “mga naninirahan sa lupain.”
