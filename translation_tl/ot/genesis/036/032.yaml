  yaml_path: translation/ot/genesis/036/032.yaml
  text: Bela son of Beor reigned in Edom[a], and the name of his city was Dinhabah.
translation:
  language: tl
  text: Naghari sa Edom[a] si Bela na anak ni Beor, at Dinhaba ang pangalan ng kanyang lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “namahala sa Edom.” Literal na “naghari sa Edom” ang Hebrew; ang “sa Edom” ay maaaring tumukoy sa lugar ng paghahari o, ayon sa konteksto, sa nasasakupan niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: Naghari
  rationale: Sa talaan ng mga hari, ipinahihiwatig ng pandiwang מלך ang paghawak at pagsasagawa ng paghahari; natural at marangal sa modernong Tagalog ang “naghari.”
- source_word: בֶּאֱדוֹם
  choice: sa Edom
  rationale: Karaniwang pananda ng kinaroroonan ang ב; pinananatili ng “sa Edom” ang anyong lokatibo habang maaari ring maunawaan ang Edom bilang nasasakupan ng hari.
- source_word: בֶּלַע
  choice: Bela
  rationale: Pangalan ng tao; tinumbasan sa karaniwang anyong ginagamit sa Tagalog.
- source_word: בֶּן בְּעוֹר
  choice: anak ni Beor
  rationale: Likas na Tagalog para sa tuwirang ugnayang genealogical na ipinahahayag ng Hebrew.
- source_word: וְשֵׁם
  choice: at ... ang pangalan
  rationale: Natural na ayos sa Tagalog na nagpapanatili sa pang-ugnay at sa tahasang pagbanggit sa pangalan.
- source_word: עִירוֹ
  choice: kanyang lungsod
  rationale: Tahasan nitong kinakatawan ang ikatlong-panauhang panlalaking hulapi; tumutukoy sa lungsod na kaugnay ng kanyang paghahari o tirahan.
- source_word: דִּנְהָבָה
  choice: Dinhaba
  rationale: Pangalan ng lugar; isinalin sa karaniwang anyong transliterado sa Tagalog.
