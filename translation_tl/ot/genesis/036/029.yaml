  yaml_path: translation/ot/genesis/036/029.yaml
  text: 'These are the chiefs of the Horites: chief Lotan[a], chief Shobal, chief Zibeon, chief Anah.'
translation:
  language: tl
  text: 'Ito ang mga pinuno ng mga Horeo: pinunong Lotan[a], pinunong Shobal, pinunong Zibeon, at pinunong Ana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pinuno ng angkan” o “mga pinuno ng lipi”; ang salitang Hebreo ay maaaring tumukoy sa pinuno ng isang angkan o lipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Ang pangmaramihang pantukoy ay nagpapakilala ng isang talaan; sa natural na Filipino, ang “Ito ang” ay maaaring tumukoy sa sumusunod na pangkat ng mga tao.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: mga pinuno / pinuno
  rationale: Sa Genesis 36, tumutukoy ang termino sa mga namumuno sa angkan o lipi. Malinaw at makabago ang “pinuno,” at pinanatili ang pag-uulit nito bago ang bawat pangalan gaya sa Hebreo.
- source_word: הַחֹרִי
  choice: mga Horeo
  rationale: Bagaman anyong isahang pangkat-etniko sa Hebreo, kolektibo ang kahulugan nito sa konteksto, kaya likas sa Filipino ang pangmaramihang “mga Horeo.”
- source_word: לוֹטָן
  choice: Lotan
  rationale: Pangalan ng tao na isinalin-titik ayon sa nakaugaliang anyong Filipino.
- source_word: שׁוֹבָל
  choice: Shobal
  rationale: Pangalan ng tao na isinalin-titik at hindi isinalin ang kahulugan.
- source_word: צִבְעוֹן
  choice: Zibeon
  rationale: Pangalan ng tao na isinalin-titik ayon sa karaniwang anyong biblikal.
- source_word: עֲנָה
  choice: Ana
  rationale: Pangalan ng tao na isinalin-titik sa natural na anyong Filipino; hindi isinama ang huling h na hindi binibigkas.
theological_decisions: []
