base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/034.yaml
  text: And Jobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: tl
  text: Namatay si Jobab, at si Husam, na mula sa lupain ng mga Temanita,[a] ang naghari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa lupain ng Teman” o “mula sa lupain ng Temanita.” Ang anyong Hebreo ay maaaring tumukoy sa lupaing kaugnay ng Teman o sa mga taong mula roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Namatay
  rationale: Ang wayyiqtol ng מות ay nagsasaad ng kasunod na pangyayari sa payak na nakaraan; natural at tuwiran ang “namatay” sa talaan ng mga hari.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Pangalang pantangi; isinalin sa karaniwang anyong transliterado sa Filipino.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Ang מלך sa pormulang ito ay tumutukoy sa paghalili at pamumuno bilang hari; malinaw at natural sa Filipino ang “naghari.”
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Ipinahihiwatig ng תחת na may hulaping panghalip ang paghalili sa tungkulin. Mas natural sa Filipino ang “bilang kahalili niya” kaysa sa literal na “sa lugar niya.”
- source_word: חֻשָׁם
  choice: Husam
  rationale: Pangalang pantangi; ginamit ang angkop na transliterasyong Filipino.
- source_word: מֵאֶרֶץ
  choice: mula sa lupain ng
  rationale: Ang מן kasama ng אֶרֶץ ay nagsasaad ng heograpikong pinagmulan; pinananatili ng “mula sa lupain ng” ang pormal na diwa.
- source_word: הַתֵּימָנִי
  choice: mga Temanita
  rationale: Ang anyong gentilic ay maaaring tumukoy sa mga taong kaugnay ng Teman o sa kanilang lupain. Natural sa pangunahing teksto ang kolektibong “mga Temanita,” habang inilalahad sa talababa ang tunay na kalabuan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bilang kahalili niya” upang natural na maipahayag ang paghalili sa hari, at pinanatili sa talababa ang kalabuan ng katawagang gentilic sa Hebreo.
