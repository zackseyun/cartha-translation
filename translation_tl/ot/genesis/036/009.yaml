  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו אֲבִ֣י אֱד֑וֹם בְּ/הַ֖ר שֵׂעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/009.yaml
  text: And these are the generations of Esau[a], the father of Edom, in the hill country of Seir.
translation:
  language: tl
  text: At ito ang mga salinlahi ni Esau, ang ama ng Edom, sa kabundukan ng Seir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa Bundok Seir” o “sa mga bundok ng Seir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: At ito ang
  rationale: Pinanatili ang pang-ugnay na וְ bilang “At” upang maipakita ang kaugnayan sa naunang salaysay, at natural na isinalin ang pormulang אֵלֶּה sa Filipino.
- source_word: תֹּלְדוֹת
  choice: salaysay tungkol sa angkan
  rationale: Ang תּוֹלְדוֹת ay paulit-ulit na pormulang pang-istruktura sa Genesis na maaaring tumukoy sa salaysay ng pinagmulan at mga salinlahi. Ang pariralang ito ay malinaw sa modernong Filipino habang pinananatili ang saklaw nito.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga Bibliyang Filipino.
- source_word: אֲבִי
  choice: ama ng
  rationale: Tuwirang katumbas ng anyong construct; ipinahahayag dito na si Esau ang pinagmulan ng Edom.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Pinanatili ang pangalang pantangi; sa konteksto, maaari itong tumukoy sa bayang nagmula kay Esau.
- source_word: בְּ/הַר
  choice: sa kabundukan ng
  rationale: Sa heograpikong pariralang ito, maaaring tumukoy ang הַר sa bulubunduking lupain, hindi lamang sa isang tuktok. Natural at angkop sa Seir ang “kabundukan.”
- source_word: שֵׂעִיר
  choice: Seir
  rationale: Pinanatili ang nakaugaliang transliterasyon ng pangalang-lugar.
theological_decisions:
- issue: Ang kahulugan ng “ama ng Edom”
  choice: Pinanatili ang literal na “ama ng Edom.”
  alternative: “ninuno ng mga Edomita”
  rationale: Hindi nilinaw nang higit sa Hebreo kung ang Edom dito ay pangalan, bayan, o bansang nagmula kay Esau; pinananatili ng literal na anyo ang siksik na pagkakaugnay ng mga kahulugang ito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “salaysay tungkol sa angkan” upang natural na maipahayag ang pormulang תּוֹלְדוֹת nang hindi ito nililimitahan sa listahan lamang ng mga inapo. Inilagay ang talababa pagkatapos ng Seir dahil ang minamarkahang pagkakaiba ay ang heograpikong pariralang בְּהַר שֵׂעִיר.
