id: GEN.36.40
reference: Genesis 36:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ֠/אֵלֶּה שְׁמ֞וֹת אַלּוּפֵ֤י עֵשָׂו֙ לְ/מִשְׁפְּחֹתָ֔/ם לִ/מְקֹמֹתָ֖/ם בִּ/שְׁמֹתָ֑/ם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עַֽלְוָ֖ה אַלּ֥וּף יְתֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/040.yaml
  text: 'And these are the names of the chiefs of Esau[a], according to their clans, according to their places, by their names: Chief Timna, Chief Alvah[b], Chief Jetheth.'
translation:
  language: tl
  text: 'At ito ang mga pangalan ng mga pinuno ni Esau, ayon sa kanilang mga angkan, ayon sa kanilang mga lugar, at ayon sa kanilang mga pangalan: ang pinunong si Timna[a], ang pinunong si Alva[b], at ang pinunong si Jetet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isulat ang Timna bilang “Timnah.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “Alvah”; ihambing ang kaugnay na anyong “Aliah” sa 1 Cronica 1:51.'
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito ang
  rationale: Pinananatili ng “At” ang ugnayan sa naunang talaan, at likas na ipinakikilala ng “ito ang” ang kasunod na listahan.
- source_word: שְׁמוֹת אַלּוּפֵי עֵשָׂו
  choice: mga pangalan ng mga pinuno ni Esau
  rationale: Ang אַלּוּף sa konteksto ng Genesis 36 ay tumutukoy sa mga pinunong panlipi o pang-angkan; malinaw at hindi makaluma ang “pinuno.”
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Sa kontekstong pangangkan, mas angkop ang “angkan” kaysa sa “pamilya,” at ipinahahayag ng “ayon sa” ang paraan ng pag-uuri.
- source_word: לִמְקֹמֹתָם
  choice: ayon sa kanilang mga lugar
  rationale: Pinananatili ng “mga lugar” ang malawak na kahulugan ng מָקוֹם nang hindi ito nililimitahan sa “mga pamayanan” o “mga teritoryo.”
- source_word: בִּשְׁמֹתָם
  choice: ayon sa kanilang mga pangalan
  rationale: Ipinapakita nito na isa-isang itinatala ang mga pinuno ayon sa pangalan habang pinananatili ang tatlong magkakatulad na parirala ng Hebreo.
- source_word: אַלּוּף
  choice: ang pinunong si
  rationale: Likas sa modernong Tagalog ang konstruksiyong ito bago ang pangalan at pare-pareho nitong naihahatid ang inuulit na titulo.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Tuwirang transliterasyon ng pangalang Hebreo; inilalahad sa talababa ang alternatibong “Timnah.”
- source_word: עַלְוָה
  choice: Alva
  rationale: Iniaangkop sa ortograpiyang Filipino ang anyong Masoretiko na karaniwang isinusulat na “Alvah”; hindi ito itinutugma sa kaugnay na anyong nasa 1 Cronica 1:51.
- source_word: יְתֵת
  choice: Jetet
  rationale: Malapit na transliterasyon sa Filipino ng יְתֵת at hindi ito itinutugma sa ibang kahawig na pangalan.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang paulit-ulit na ayos ng Hebreo upang maipakita ang pag-uuri ayon sa angkan, lugar, at pangalan; iniwasan ang makaluma at mapanlinlang na katumbas na “duke.”
