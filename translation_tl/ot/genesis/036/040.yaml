  verdict: approve
  source_fidelity: 'Tapat ang salin sa Hebreong teksto: naipapahayag ang panimulang pang-listahan, ang mga pinuno ni Esau, at ang tatlong batayan ng pag-uuri—mga angkan, mga lugar, at mga pangalan. Wasto ring hindi pinalalawak ang “mga lugar” tungo sa mas tiyak na “mga pamayanan” o “mga teritoryo.”'
  naturalness: Likas at malinaw ang makabagong Tagalog. Ang pag-uulit ng “ayon sa kanilang” ay bahagyang pormal ngunit angkop sa estilong talaan at sinasadyang sumasalamin sa Hebreo. Ang seryeng “ang pinunong si ...” ay natural at madaling basahin.
  terminology: Ang “mga pinuno” ay angkop na modernong katumbas ng אַלּוּף at iniiwasan ang makaluma o mapanlinlang na katumbas na “duke.” Pare-pareho ang paggamit ng titulo. Katanggap-tanggap ang mga anyong Filipino na Timna, Alva, at Jetet; malinaw ding itinatala ng talababa ang anyong “Alvah” at ang kaugnay na anyong nasa 1 Cronica 1:51.
