base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/037.yaml
  text: Then Samlah died[c][b][a], and Shaul from Rehoboth on the River reigned in his place.
translation:
  language: tl
  text: Pagkatapos, namatay si Samla, at si Shaul na mula sa Rehobot sa Ilog[a] ang naghari bilang kapalit niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Rehobot ng Ilog”; maaari ring isaling “Rehobot sa tabi ng Ilog.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: Pagkatapos, namatay
  rationale: Ang wayyiqtol ay nagpapatuloy sa pagkakasunod-sunod ng salaysay; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “Pagkatapos” at payak na aspektong naganap.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa anyong madaling bigkasin sa Filipino.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Ang מלך sa pormula ng paghalili ng mga hari ay nangangahulugang namahala bilang hari; malinaw at likas dito ang “naghari.”
- source_word: תַּחְתָּיו
  choice: bilang kapalit niya
  rationale: Ipinahahayag ng idyoma ang paghalili sa puwesto ng naunang hari, hindi lamang ang kronolohikal na pagsunod.
- source_word: שָׁאוּל
  choice: Shaul
  rationale: Pinananatili ang anyong malapit sa Hebreong pangalan at iniiwasang ipalit ang tradisyonal na anyong Ingles na “Saul.”
- source_word: מֵרְחֹבוֹת
  choice: mula sa Rehobot
  rationale: Ang מִן ay tumutukoy sa pinagmulan o kaugnayan sa isang lugar; ang Rehobot ay itinuturing na pangalang-pook.
- source_word: הַנָּהָר
  choice: sa Ilog
  rationale: Ang parirala ay heograpikong pantukoy sa Rehobot. Pinananatili ng malaking titik ang posibleng diwa ng isang kilala o tiyak na ilog nang hindi tinutukoy kung aling ilog iyon.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na payak ngunit marangal. Ginamit ang “bilang kapalit niya” upang maging natural ang pormula ng paghalili, at pinanatili ang “Ilog” bilang tiyak ngunit hindi pinangalanang heograpikong katawagan.
