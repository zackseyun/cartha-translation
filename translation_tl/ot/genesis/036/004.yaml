base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/004.yaml
  text: Adah bore Eliphaz to Esau, and Basemath bore Reuel.
translation:
  language: tl
  text: Ipinanganak ni Ada kay Esau si Elifaz, at ipinanganak naman ni Basemat si Reuel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד / יָלְדָה
  choice: ipinanganak
  rationale: Ang dalawang anyo ay mula sa ילד, “manganak/ magsilang.” Sa Filipino, natural sa talaangkanan ang konstruksiyong “ipinanganak ni [ina] kay [ama] si [anak],” at malinaw nitong pinananatili ang ina bilang gumagawa ng kilos.
- source_word: לְעֵשָׂו
  choice: kay Esau
  rationale: Ang לְ sa ganitong pormulang talaangkanan ay tumutukoy sa ama. Ang “kay Esau” ang natural na katumbas sa Filipino nang hindi dinaragdagan ang kahulugan.
- source_word: אֶת
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang hiwalay na katumbas sa Filipino; naipahihiwatig ang tungkulin nito sa ayos at mga panandang “si.”
- source_word: אֱלִיפָז
  choice: Elifaz
  rationale: Transliterasyon ng pangalang Hebreo ayon sa karaniwang baybay sa Filipino.
- source_word: בָשְׂמַת
  choice: Basemat
  rationale: Malapit na transliterasyon ng Masoretikong anyong Basemat at natural basahin sa Filipino.
- source_word: רְעוּאֵל
  choice: Reuel
  rationale: Transliterasyon na malapit sa mga katinig at patinig ng Masoretikong teksto.
- source_word: וּ
  choice: at ... naman
  rationale: Pinag-uugnay ng pangatnig ang dalawang ulat ng panganganak. Ang “naman” ay natural na panandang Filipino sa magkatugmang ikalawang sugnay, nang hindi binabago ang ugnayan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang pormulang Filipino para sa talaangkanan at iniwasan ang mas lumang “nagsilang ... para kay,” na maaaring hindi likas o magbigay ng ibang pahiwatig.
