base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/030.yaml
  text: Chief Dishon[a], chief Ezer[b], chief Dishan—these were the chiefs of the Horites according to their chiefs in the land of Seir.
translation:
  language: tl
  text: Ang pinunong si Dishon, ang pinunong si Ezer, at ang pinunong si Dishan—sila ang mga pinuno ng mga Horeo ayon sa kani-kanilang pangkat[a] sa lupain ng Seir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa kani-kanilang pinuno.” Maaaring tumukoy ang pariralang Hebreo sa pag-uuri ayon sa mga pinuno o sa mga pangkat na kanilang pinamumunuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: pinuno
  rationale: Sa Genesis 36, tumutukoy ito sa pinuno ng isang pangkat o angkan sa Edom at sa mga Horeo. Likas at marangal sa makabagong Tagalog ang “pinuno,” at pinananatili ang pag-uulit ng Hebreo.
- source_word: דִּשֹׁן
  choice: Dishon
  rationale: Pangngalang pantangi; isinalin sa baybay na malinaw na naiiba sa Dishan.
- source_word: אֵצֶר
  choice: Ezer
  rationale: Pangngalang pantangi; tinumbasan sa karaniwang transliterasyon sa Tagalog.
- source_word: דִּישָׁן
  choice: Dishan
  rationale: Pangngalang pantangi; pinanatiling naiiba sa Dishon gaya sa tekstong Hebreo.
- source_word: אַלּוּפֵי הַחֹרִי
  choice: mga pinuno ng mga Horeo
  rationale: Ang הַחֹרִי ay tumutukoy sa mga Horeo bilang isang pangkat ng mga tao; natural sa Tagalog ang maramihang anyo.
- source_word: לְאַלֻּפֵיהֶם
  choice: ayon sa kani-kanilang pangkat
  rationale: Ang parirala ay malamang na nag-uuri sa mga pinuno ayon sa mga pangkat o nasasakupang pinamumunuan nila. Iniiwasan nito ang malabong pag-uulit na “mga pinuno ayon sa kanilang mga pinuno,” habang inilalahad sa talababa ang mas pormal na posibilidad.
- source_word: בְּאֶרֶץ שֵׂעִיר
  choice: sa lupain ng Seir
  rationale: Direkta at natural na katumbas ng karaniwang heograpikong parirala sa Hebreo.
