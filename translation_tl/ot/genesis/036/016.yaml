base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/016.yaml
  text: Chief Korah, chief Gaatham, chief Amalek—these are the chiefs of Eliphaz in the land of Edom; these are the sons of Adah.
translation:
  language: tl
  text: Pinunong si Kora, pinunong si Gatam, at pinunong si Amalek—ito ang mga pinuno ni Elifaz sa lupain ng Edom; sila ang mga anak ni Ada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף
  choice: pinuno
  rationale: Sa talaangkanang ito, tumutukoy ito sa pinuno ng isang angkan o pangkat; likas at malinaw sa modernong Tagalog ang “pinuno” nang hindi labis na tinutukoy ang eksaktong ranggo.
- source_word: גַּעְתָּם
  choice: Gatam
  rationale: Tuwirang transliterasyon ng pangalang Hebreo; ang anyong “Gatam” ay mas malapit sa mga katinig at karaniwang pagbigkas sa Filipino kaysa “Gaatham.”
- source_word: בְּנֵי
  choice: mga anak
  rationale: Pinananatili ang literal na ugnayang pampamilya ng Hebreo, bagaman sa konteksto ng talaangkanan maaari rin itong sumaklaw sa mga inapo.
theological_decisions:
- issue: Ang ugnayan ng mga pinuno kay Elifaz at Ada
  choice: “mga pinuno mula kay Elifaz” at “mga anak ni Ada”
  alternative: “mga pinuno ni Elifaz” at “mga inapo ni Ada”
  rationale: Pinananatili ang payak na pormulasyon at posibleng malawak na saklaw ng talaangkanan nang hindi ipinipilit kung tuwirang mga anak o mas malalayong inapo ang tinutukoy.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Inulit ang “ang pinunong si” ayon sa estilong talaan ng Hebreo, saka hinati sa maiikling pangungusap para sa malinaw na pagbasa.
