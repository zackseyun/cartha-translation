  text: These are the kings who reigned in the land of Edom before a king reigned over the sons of Israel[a].
translation:
  language: tl
  text: At ito ang mga haring naghari sa lupain ng Edom bago magkaroon ng hari ang mga anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “bago mamuno ang isang hari sa mga Israelita.” Sa Hebreo, literal na “bago naghari ang isang hari para sa/sa mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito ang
  rationale: Pinananatili ang pang-ugnay na וְ at ang panandang nagpapakilala sa bagong talaan, sa likas na anyong Tagalog.
- source_word: הַמְּלָכִים אֲשֶׁר מָלְכוּ
  choice: mga haring naghari
  rationale: Tuwirang ipinapahayag ang mga hari at ang paggamit nila ng paghahari; likas at malinaw ito sa Tagalog.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: sa lupain ng Edom
  rationale: Pinananatili ang tahasang אֶרֶץ, na tumutukoy sa teritoryo ng Edom.
- source_word: לִפְנֵי
  choice: bago
  rationale: Malinaw na temporal ang gamit dito.
- source_word: מְלָךְ מֶלֶךְ
  choice: naghari ang isang hari
  rationale: Pinananatili ang isahang ‘hari’ at ang pandiwang ‘naghari’ nang hindi dinaragdagan ng di-tahasang ‘sinumang.’
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang anyo ng Hebreong etnonimo at ang ugnayan ng paghahari sa bayan; ang ‘sa’ ay sadyang hindi lubos na nilulutas kung ‘para sa’ o ‘sa ibabaw ng’ ang diin.
theological_decisions:
- issue: Paglalarawan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Ang pangunahing teksto ay nagpapanatili sa literal at tradisyonal na anyo ng Hebreo, samantalang ibinibigay sa talababa ang mas idiomatikong etnonimo.
- issue: Saklaw ng לְ kaugnay ng paghahari
  choice: sa mga anak ni Israel
  alternative: nagkaroon ng hari ang mga Israelita
  rationale: Hindi tiyak kung dapat idiin ng לְ ang pamamahala ‘sa’ kanila o ang pagkakaroon nila ng hari; pinananatili ng pangunahing salin ang mas malapit na kayarian at inilalahad ang likas na alternatibo sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang bahagyang pag-uulit sa “mga haring naghari” at “naghari ang isang hari” sapagkat kaayon ito ng anyo at diin ng Hebreo.
