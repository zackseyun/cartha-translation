revisions:
- from: At ito ang mga haring naghari sa lupain ng Edom bago naghari ang isang hari sa mga anak ni Israel.[a]
  to: At ito ang mga haring naghari sa lupain ng Edom bago magkaroon ng hari ang mga anak ni Israel.[a]
  rationale: Pinalitan ang hindi idiomatikong “naghari ang isang hari sa mga anak ni Israel” ng “magkaroon ng hari ang mga anak ni Israel,” na likas sa Tagalog at tapat sa temporal na punto ng Hebreo. Iniingatan ng talababa ang alternatibong pagbasa na ang hari ay mamumuno sa Israel, nang hindi ipinapataw ang isang tiyak na pagpapakahulugan sa לְ sa pangunahing teksto.
