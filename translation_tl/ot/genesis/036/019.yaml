  text: אֵ֧לֶּה בְנֵי עֵשָׂ֛ו וְ/אֵ֥לֶּה אַלּוּפֵי/הֶ֖ם ה֥וּא אֱדֽוֹם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/019.yaml
  text: These are the sons of Esau[a], and these are their chiefs. He is Edom.
translation:
  language: tl
  text: Ito ang mga anak ni Esau, at ito ang kanilang mga pinuno.[a] Siya si Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanilang mga pinuno ng angkan.” Ang Hebreong אַלּוּפִים ay tumutukoy sa mga pinuno ng angkan o lipi sa Edom.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang mga
  rationale: Ipinakikilala ng pangmaramihang demonstratibo ang buod ng talaangkanan. Likas sa makabagong Tagalog ang “Ito ang mga” sa ganitong pormula, bagaman walang tahasang pandiwa sa Hebreo.
- source_word: בְנֵי
  choice: mga anak ni
  rationale: Sa konteksto ng talaangkanan, tumutukoy ito sa mga lalaking anak ni Esau; sapat at natural sa Tagalog ang “mga anak ni” nang hindi pinapalawak sa lahat ng inapo.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Ginamit ang nakaugaliang anyo ng personal na pangalan sa Tagalog.
- source_word: וְאֵלֶּה
  choice: at ito ang kanilang
  rationale: Pinananatili ng “at” at ng pag-uulit ng “ito” ang magkatugmang ayos ng dalawang sugnay sa Hebreo.
- source_word: אַלּוּפֵיהֶם
  choice: kanilang mga pinuno
  rationale: Ang אַלּוּף sa Genesis 36 ay tumutukoy sa mga namumuno sa mga angkan o pangkat sa Edom. Malinaw at kasalukuyang pananalita ang “mga pinuno,” habang ipinapaliwanag sa talababa ang mas tiyak na diwa.
- source_word: הוּא
  choice: Siya si
  rationale: Muling tinutukoy ng panghalip si Esau at tuwiran siyang iniuugnay sa pangalang Edom.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Pinanatili ang nakaugaliang transliterasyon ng pangalan; sa konteksto, si Esau ang tinutukoy bilang Edom at bilang pinagmulan ng bayang Edom.
theological_decisions:
- issue: Ang pagkakakilanlan ni Esau bilang Edom
  choice: Siya si Edom
  alternative: Iyon ay Edom
  rationale: Pinananatili ng salin ang personal na panghalip na הוּא at ang tuwirang pagkakakilanlan sa tekstong Hebreo, nang hindi nililimitahan kung ang “Edom” ay pangalan, katawagan, o eponimong pagkakakilanlan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikli at magkatugmang estruktura ng Hebreo, at inilagay ang talababa pagkatapos ng “mga pinuno,” ang salitang aktuwal na nililinaw nito.
