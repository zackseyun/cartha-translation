translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “sambahayan” para sa buong household at “ari-arian” para sa malawak na kategorya ng mga pag-aari. Hinati sa dalawang pangungusap ang mahabang sugnay upang maging malinaw sa karaniwang mambabasa, habang pinananatili ang pagkakasunod-sunod at buong nilalaman ng Hebreo.
