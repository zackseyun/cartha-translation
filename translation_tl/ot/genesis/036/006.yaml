  text: וַ/יִּקַּ֣ח עֵשָׂ֡ו אֶת נָ֠שָׁי/ו וְ/אֶת בָּנָ֣י/ו וְ/אֶת בְּנֹתָי/ו֮ וְ/אֶת כָּל נַפְשׁ֣וֹת בֵּית/וֹ֒ וְ/אֶת מִקְנֵ֣/הוּ וְ/אֶת כָּל בְּהֶמְתּ֗/וֹ וְ/אֵת֙ כָּל קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יֵּ֣לֶךְ אֶל אֶ֔רֶץ מִ/פְּנֵ֖י יַעֲקֹ֥ב אָחִֽי/ו־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/006.yaml
  text: And Esau took his wives[a], his sons, his daughters, and all the persons of his household, along with his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and went to a land because of his brother Jacob.
translation:
  language: tl
  text: At isinama ni Esau ang kanyang mga asawa, mga anak niyang lalaki at babae, at lahat ng tao sa kanyang sambahayan, kasama ang kanyang mga alagang hayop, lahat ng kanyang hayop, at lahat ng ari-ariang natamo niya sa lupain ng Canaan. Pumunta siya sa isang lupain[a] dahil sa kanyang kapatid na si Jacob.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “sa isang lupain.” May ilang manuskrito at sinaunang salin na sumusuporta sa “sa lupain ng Seir”; ayon sa konteksto, isinasalin din ito ng ilan bilang “sa ibang lupain.”'
    reason: textual_variant
  - marker: b
    text: O, “palayo sa kanyang kapatid na si Jacob.”
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: isinama
  rationale: Bagaman pangunahing nangangahulugang “kinuha,” sa konteksto ng paglipat ay likas na ipinahihiwatig ng pandiwa na isinama ni Esau ang mga tao at ari-arian.
- source_word: נָשָׁיו
  choice: kanyang mga asawa
  rationale: Tumutukoy ang anyong maramihan sa mga asawa ni Esau, hindi sa mga babae sa pangkalahatan.
- source_word: בָּנָיו / בְּנֹתָיו
  choice: mga anak na lalaki at babae
  rationale: Pinananatili ang tahasang pagkakilala ng Hebreo sa mga anak na lalaki at mga anak na babae.
- source_word: כָּל נַפְשׁוֹת בֵּיתוֹ
  choice: lahat ng kabilang sa kanyang sambahayan
  rationale: Sa idyomang ito, ang נֶפֶשׁ ay tumutukoy sa mga tao ng sambahayan; iniiwasan ng salin ang di-angkop na teolohikal na diwa ng literal na “mga kaluluwa.”
- source_word: מִקְנֵהוּ
  choice: kanyang mga alagang hayop
  rationale: Ang מִקְנֶה ay tumutukoy sa mga hayop na pag-aari o livestock; malinaw at karaniwan ang “mga alagang hayop” sa modernong Filipino.
- source_word: כָּל בְּהֶמְתּוֹ
  choice: lahat ng iba pa niyang hayop
  rationale: Malawak ang saklaw ng בְּהֵמָה. Ang “iba pa” ay nagbibigay ng likas na pagkakaiba mula sa naunang מִקְנֶה nang hindi inuulit nang malamya ang parehong parirala.
- source_word: כָּל קִנְיָנוֹ אֲשֶׁר רָכַשׁ
  choice: lahat ng ari-ariang natamo niya
  rationale: Ipinahihiwatig ng dalawang kaugnay na salita ang mga pag-aaring kanyang nakuha o naipon; maikli at natural ang “ari-ariang natamo.”
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili ang pormal na heograpikong pananalitang “lupain ng Canaan.”
- source_word: אֶל אֶרֶץ
  choice: sa isang lupain
  rationale: Ito ang tuwirang pagbasa ng tekstong Masoretiko at hindi idinaragdag ang “ibang” na wala sa nakasulat na Hebreo.
- source_word: מִפְּנֵי יַעֲקֹב אָחִיו
  choice: dahil sa kanyang kapatid na si Jacob
  rationale: Maaaring magpahayag ang מִפְּנֵי ng sanhi o paglayo mula sa harapan ng isang tao. Ang sanhi ang pangunahing salin dahil nililinaw ng kasunod na talata ang dahilan ng paghihiwalay, habang itinatala sa talababa ang alternatibong diwang spatial.
