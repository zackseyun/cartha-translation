  register: Modernong Filipino na may marangal at malinaw na estilong angkop sa talaangkanan. Inilagay ang panandang talababa pagkatapos ng talaan ng mga pinuno, sapagkat ang paliwanag ay para sa salitang “pinuno,” hindi sa pangalang Oholibama.
