base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/018.yaml
  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
translation:
  language: tl
  text: 'At ito ang mga anak na lalaki ni Oholibama, na asawa ni Esau: ang pinunong si Jeus, ang pinunong si Jalam, at ang pinunong si Kora.[a] Ito ang mga pinuno sa angkan ni Oholibama, na anak na babae ni Ana at asawa ni Esau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pinuno ng angkan.” Ang salitang Hebreo ay tumutukoy sa mga namumuno sa mga pangkat o angkan ng Edom.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak na lalaki ni
  rationale: Tiyak na panlalaki ang anyong Hebreo at tumutukoy rito sa tatlong lalaking pinangalanan; mas tiyak ito kaysa sa pangkalahatang “mga anak.”
- source_word: אֵשֶׁת עֵשָׂו
  choice: asawa ni Esau
  rationale: Natural na katumbas sa modernong Tagalog ng pariralang Hebreo; pinanatili sa dalawang paglitaw nito.
- source_word: אַלּוּף
  choice: pinuno
  rationale: Sa Genesis 36, tumutukoy ito sa mga pinuno ng mga pangkat o angkan ng Edom. Malinaw at hindi makaluma ang “pinuno,” samantalang ipinapaliwanag sa talababa ang mas tiyak na posibleng diwa.
- source_word: יְעוּשׁ
  choice: Jeus
  rationale: Transliterasyong angkop sa baybay at bigkas sa Tagalog.
- source_word: יַעְלָם
  choice: Jalam
  rationale: Malapit na transliterasyon ng pangalang Hebreo sa anyong madaling basahin sa Tagalog.
- source_word: קֹרַח
  choice: Kora
  rationale: Transliterasyong angkop sa karaniwang baybay sa Tagalog.
- source_word: אֵלֶּה אַלּוּפֵי אָהֳלִיבָמָה
  choice: Ito ang mga pinuno sa angkan ni Oholibama
  rationale: Ipinahahayag nang natural ang ugnayan ng mga pinuno kay Oholibama nang hindi tahasang dinaragdagan ang Hebreo ng “nagmula” o “mga inapo.”
- source_word: בַּת עֲנָה
  choice: anak na babae ni Ana
  rationale: Pinananatili ang tahasang kasariang ipinahahayag ng Hebreong בַּת, na hindi lilitaw kung “anak” lamang ang gagamitin.
- source_word: וְאֵלֶּה ... אֵלֶּה
  choice: At ito ... Ito
  rationale: Pinananatili ang inuulit na demonstratibong balangkas ng talaangkanan. Hindi nangangailangan ng pandiwang pamanahon ang natural na Tagalog.
