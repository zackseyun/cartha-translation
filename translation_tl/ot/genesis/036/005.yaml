  register: Makabago at dignidad na Filipino, na may maikli at tuwirang estilong angkop sa talaangkanan. Ginamit ang 'sina' upang natural na ipakilala ang magkakasunod na pangalan, at pinanatili ang pag-uulit ng 'ipinanganak' na nasa Hebreo.
