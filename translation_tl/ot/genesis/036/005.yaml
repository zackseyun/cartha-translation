base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/005.yaml
  text: And Oholibamah bore Jeush, Jalam, and Korah. These are the sons of Esau who were born to him in the land of Canaan.
translation:
  language: tl
  text: At ipinanganak ni Oholibama sina Jeus, Jalam, at Korah. Sila ang mga anak na lalaki ni Esau na ipinanganak sa kaniya sa lupain ng Canaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Isinalin sa karaniwang anyong transliterasyon sa Filipino, nang hindi isinasalin ang kahulugan ng pangalang pantangi.
- source_word: יָלְדָה
  choice: ipinanganak ni
  rationale: Natural na Filipino para sa pandiwang may babaeng simuno sa talaangkanan; malinaw nitong pinananatili na si Oholibama ang ina.
- source_word: יעיש
  choice: Jeus
  rationale: Transliterasyong angkop sa Filipino ng pangalang Hebreo.
- source_word: יַעְלָם
  choice: Jalam
  rationale: Malapit na transliterasyon ng pangalang Hebreo at madaling basahin sa Filipino.
- source_word: קֹרַח
  choice: Korah
  rationale: Pinananatili ang nakikilalang transliterasyon ng pangalang pantangi.
- source_word: בְּנֵי
  choice: mga anak na lalaki
  rationale: Tiyak na mga lalaking anak ang tinutukoy at nakalista rito, kaya hindi ginawang pangkalahatang 'mga anak' lamang.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: אֲשֶׁר יֻלְּדוּ לוֹ
  choice: na ipinanganak sa kaniya
  rationale: Pinananatili ang pasibong anyo at ang pagtuon sa kanila bilang mga anak ni Esau, nang hindi idinaragdag sa ikalawang pangungusap ang tahasang pagtukoy sa ina.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili ang tahasang אֶרֶץ ('lupain') at ang marangal na himig ng talaangkanan.
