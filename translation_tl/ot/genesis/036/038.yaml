- source_word: בַּעַל חָנָן
  choice: Baal-hanan
  rationale: Pinananatili ang dalawang bahaging anyo ng personal na pangalan sa Hebreo.
- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwang natural na paraan sa Filipino upang tukuyin ang tuwirang ugnayang ama at anak.
- source_word: עַכְבּוֹר
  choice: Akbor
  rationale: Transliterasyong malapit sa pangalang Hebreo at madaling basahin sa Filipino.
