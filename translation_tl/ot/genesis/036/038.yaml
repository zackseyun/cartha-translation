    text: Sa ilang tradisyonal na salin, ang mga pangalang ito ay binabaybay na “Saul,” “Baal-hanan,” at “Achbor.” Ginamit dito ang “Shaul” at “Akbor,” na mas malapit sa mga anyong Hebreo.
