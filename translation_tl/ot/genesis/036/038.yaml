  rationale: Transliterasyong malapit sa anyong Hebreo at malinaw basahin sa Filipino.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Likas at maikling salin sa Filipino para sa paghahari sa pormula ng paghalili ng mga hari.
- source_word: תַּחְתָּיו
