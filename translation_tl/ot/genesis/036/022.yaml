  yaml_path: translation/ot/genesis/036/022.yaml
  text: The sons of Lotan were Hori and Hemam[b][a], and Lotan’s sister was Timna.
translation:
  language: tl
  text: Ang mga anak na lalaki ni Lotan ay sina Hori at Hemam[a], at ang kapatid na babae ni Lotan ay si Timna[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Hemam”; “Homam” naman ang mababasa sa katumbas na tala sa 1 Cronica 1:39.
    reason: textual_variant
  - marker: b
    text: May baybay na “Timnah” sa ilang salin sa Ingles; “Timna” ang anyong Hebreo rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay
  rationale: Sa talaangkanan, ang anyo ng היה ay nagsisilbing payak na pang-ugnay; natural itong ipinahahayag sa Filipino sa pamamagitan ng “ay.”
- source_word: בְנֵי
  choice: mga anak na lalaki ni
  rationale: Dalawang lalaking pangalan ang kasunod, kaya mas tiyak ang “mga anak na lalaki” kaysa sa pangkalahatang “mga anak.”
- source_word: לוֹטָן
  choice: Lotan
  rationale: Isinalin-titik ang pangalang pantangi ayon sa karaniwang anyong madaling basahin sa Filipino.
- source_word: חֹרִי
  choice: Hori
  rationale: Pangalan itong pantangi kaya isinalin-titik, hindi isinalin ang kahulugan.
- source_word: הֵימָם
  choice: Hemam
  rationale: Ito ang pinakamalapit na paglilipat ng anyong Hebreo sa talatang ito; ang Homam ay nasa katumbas na tala sa 1 Cronica 1:39.
- source_word: וַאֲחוֹת
  choice: at ang kapatid na babae ... ay
  rationale: Tiyak na “kapatid na babae” ang kahulugan ng pangngalan; idinagdag ang likas na pang-ugnay na “ay” para sa malinaw na pangungusap sa Filipino.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Isinalin-titik ang personal na pangalan nang malapit sa anyong Hebreo; pinananatili rin nitong naiiba ang anyo sa tradisyonal na baybay na Timnah.
