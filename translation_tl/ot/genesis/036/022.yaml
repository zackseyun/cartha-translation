translation_notes:
  register: Makabago at marangal na Filipino; ginamit ang “sina” at “si” para sa natural na pagtukoy sa mga pangalan, at ang tahasang “anak na lalaki” at “kapatid na babae” upang mapanatili ang kasariang ipinahahayag ng Hebreo.
