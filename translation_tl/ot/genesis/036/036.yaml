translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling pormula ng paghalili sa hari. Walang talababa dahil ang Hebreong מִן dito ay tuwirang maisasalin na “mula sa”; ang posibleng diwang kaugnayan sa lugar ay hindi nangangailangan ng hiwalay na tala sa payak na talatang ito.
