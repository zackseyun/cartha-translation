  text: And Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: tl
  text: Namatay si Hadad, at si Samla na mula sa Masreka[a] ang naghari kapalit niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “taga-Masreka.” Maaaring ipahiwatig ng Hebreong pang-ukol ang pinagmulan o kaugnayan sa isang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Namatay
  rationale: Ang wayyiqtol ng מות ay nagsasalaysay ng kasunod na pangyayari; natural sa Filipino ang payak na anyong “namatay.”
- source_word: הֲדָד
  choice: Hadad
  rationale: Isinalin sa karaniwang transliterasyong Filipino ang pangalang pantangi.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Sa talaan ng mga hari, ang מלך ay tumutukoy sa pamamahala bilang hari; maikli at natural ang “naghari.”
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Ipinahihiwatig dito ng תחת na pumalit si Samla sa posisyon ni Hadad; malinaw at natural ito sa Filipino.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Ginamit ang anyong madaling bigkasin sa Filipino para sa pangalang pantangi.
- source_word: מִמַּשְׂרֵקָה
  choice: mula sa Masreka
  rationale: Karaniwang ipinahihiwatig ng prefixed מן ang pinagmulan o kaugnayan sa isang lugar; pinananatili ng “mula sa” ang pinakatuwirang kahulugan.
