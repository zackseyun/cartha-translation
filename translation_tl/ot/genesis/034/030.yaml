base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/030.yaml
  text: Then Jacob said to Simeon and Levi[a], “You have brought trouble on me, making me stink among the inhabitants of the land, among the Canaanites and the Perizzites. Since I am few in number, they will gather against me and strike me down[b], and I will be destroyed—I and my household.”
translation:
  language: tl
  text: Sinabi ni Jacob kina Simeon at Levi, “Pinahamak ninyo ako dahil ginawa ninyo akong kasuklam-suklam[a] sa mga naninirahan sa lupain—sa mga Cananeo at mga Perezeo. Ako ay kakaunti lamang sa bilang; magkakatipon sila laban sa akin at sasalakayin ako. Malilipol ako, ako at ang aking sambahayan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ginawa ninyo akong mabaho,” isang matalinghagang paraan ng pagsasabing ginawa siyang kasuklam-suklam o kinamumuhian.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתֶּם
  choice: Ipinahamak ninyo ako
  rationale: Ang pandiwa ay tumutukoy sa pagdadala ng matinding gulo o kapahamakan sa isang tao. Likas sa modernong Tagalog ang “ipinahamak” at angkop sa bantang inilalarawan ni Jacob.
- source_word: לְהַבְאִישֵׁנִי
  choice: ginawa ninyo akong kasuklam-suklam
  rationale: Literal itong “ginawa ninyo akong mabaho,” ngunit metaporikal na tumutukoy sa pagkakaroon ng kinamumuhiang reputasyon. Nasa talababa ang literal na larawan.
- source_word: בְּיֹשֵׁב הָאָרֶץ
  choice: sa mga naninirahan sa lupaing ito
  rationale: Ang kolektibong participle ay tumutukoy sa populasyong naninirahan sa lupain; malinaw at natural ang salin.
- source_word: בַּכְּנַעֲנִי וּבַפְּרִזִּי
  choice: sa mga Cananeo at mga Perezeo
  rationale: Ipinagpapatuloy ng parirala ang pagtukoy sa mga pangkat na sa paningin nila ay naging kasuklam-suklam si Jacob.
- source_word: מְתֵי מִסְפָּר
  choice: Kakaunti lamang tayo
  rationale: Idyoma ito para sa maliit na bilang. Ginawang “tayo” sa Tagalog sapagkat ang panganib ay kay Jacob at sa kanyang sambahayan, na tahasang binabanggit sa hulihan.
- source_word: וְנֶאֶסְפוּ עָלַי
  choice: Kapag nagsama-sama sila laban sa akin
  rationale: Ipinahahayag nito ang mga kaaway na nagtitipon o nagkakaisa upang salakayin siya, habang natural sa Tagalog ang anyong “nagsama-sama.”
- source_word: וְהִכּוּנִי
  choice: sinalakay ako
  rationale: Sa kontekstong militar, ang malawak na pandiwang “humampas/tumama” ay likas na naihahatid bilang marahas na pagsalakay.
- source_word: וְנִשְׁמַדְתִּי
  choice: malilipol ako
  rationale: Pinananatili ng “malilipol” ang matinding diwa ng pagkawasak o pagkal extermina nang hindi nagiging kolokyal.
- source_word: בֵּיתִי
  choice: aking sambahayan
  rationale: Ang salita ay tumutukoy sa buong yunit ng pamilya at mga taong sakop ng tahanan, hindi lamang sa gusali.
