revisions:
- from: Pagkatapos, sinabi ni Jacob kina Simeon at Levi, “Ipinahamak ninyo ako dahil ginawa ninyo akong kasuklam-suklam[a] sa mga naninirahan sa lupaing ito—sa mga Cananeo at mga Perezeo. Kakaunti lamang tayo. Kapag nagsama-sama sila laban sa akin at sinalakay ako, malilipol ako, ako at ang aking sambahayan.”
  to: Sinabi ni Jacob kina Simeon at Levi, “Pinahamak ninyo ako dahil ginawa ninyo akong kasuklam-suklam[a] sa mga naninirahan sa lupain—sa mga Cananeo at mga Perezeo. Ako ay kakaunti lamang sa bilang; magkakatipon sila laban sa akin at sasalakayin ako. Malilipol ako, ako at ang aking sambahayan.”
  rationale: Inalis ang hindi kinakailangang “Pagkatapos” at ang dagdag na “ito,” ibinalik ang unang panauhang isahan sa “Ako ay kakaunti lamang sa bilang,” at ginawang inaasahang panghinaharap ang pagkakatipon at pagsalakay. Pinanatili ang umiiral na metaporikal na salin at ang literal na talababa.
