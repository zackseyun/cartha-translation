  text: At lumabas si Hamor, ama ni Shekem, upang makipag-usap kay Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Pagkatapos, lumabas
  rationale: Ang wayyiqtol ay nagpapatuloy sa salaysay, at pinananatili ng “lumabas” ang direksiyonal na diwa ng יצא.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Isinalin sa baybay na madaling basahin sa modernong Filipino habang nananatiling malapit sa pangalang Hebreo.
- source_word: אֲבִי שְׁכֶם
  choice: na ama ni Shekem
  rationale: Malinaw at likas na ipinapahayag ang ugnayang nasa construct chain nang hindi napagkakamalang pangalan ng lugar ang Shekem.
- source_word: אֶל יַעֲקֹב
  choice: kay Jacob
  rationale: Ang אֶל ay nagsasaad ng paglapit o pagpunta sa isang tao; likas sa Filipino ang “kay Jacob” sa kontekstong ito.
- source_word: לְדַבֵּר אִתּוֹ
  choice: upang makipag-usap kay Jacob
  rationale: Ipinahahayag ng לְ ang layunin, at ang “makipag-usap” ay nagpapanatili sa kapwa-panig na diwa ng דבר אִתּוֹ. Inulit ang “Jacob” sa halip na gumamit ng malabong panghalip.
- source_word: וַ
  choice: Pagkatapos
  rationale: Ipinapakita nito ang sunod-sunod na takbo ng salaysay sa natural na modernong Filipino.
