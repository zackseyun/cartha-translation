revisions:
- from: Nang ikatlong araw, habang masakit pa ang kanilang mga sugat, kumuha ng kani-kaniyang espada ang dalawa sa mga anak ni Jacob—sina Simeon at Levi, na mga kapatid ni Dina. Sinalakay nila ang lungsod habang panatag ito[a], at pinatay nila ang lahat ng lalaki.[b]
  to: Sa ikatlong araw, habang sila ay nasasaktan, kumuha ng kani-kaniyang espada ang dalawa sa mga anak ni Jacob—sina Simeon at Levi, na mga kapatid ni Dina. Sinalakay nila ang lungsod habang panatag ito[a], at pinatay nila ang lahat ng lalaki.[b]
