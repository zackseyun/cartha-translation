  naturalness: Natural at marangal ang daloy sa modernong Filipino Tagalog. Ang “Sa ikatlong araw” ay mas karaniwang anyong pangpanahon kaysa “Nang ikatlong araw,” at ang dalawang pangungusap ay malinaw.
  terminology: Ang mga pangalang Simeon, Levi, at Dina ay angkop. Ang “lahat ng lalaki” ay natural, ngunit nililinaw ng talababa na ang Hebreong זָכָר ay “bawat may kasariang lalaki” at hindi kinakailangang limitado sa mga lalaking nasa hustong gulang.
