base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
translation:
  language: tl
  text: Sa ikatlong araw, habang sila ay nasasaktan, kumuha ng kani-kaniyang espada ang dalawa sa mga anak ni Jacob—sina Simeon at Levi, na mga kapatid ni Dina. Sinalakay nila ang lungsod habang panatag ito[a], at pinatay nila ang lahat ng lalaki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “buong tapang” o “nang ligtas.” Maaaring ilarawan ng salitang Hebreo ang paraan ng pagsalakay nila o ang panatag at hindi nakahandang kalagayan ng lungsod.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bawat may kasariang lalaki.” Hindi nililimitahan ng salitang Hebreo ang tinutukoy sa mga lalaking nasa hustong gulang lamang.
    reason: source_precision
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: Nang ikatlong araw
  rationale: Natural na panimulang temporal sa modernong Tagalog; naipapahayag nito ang pagkakasunod ng salaysay nang hindi gumagamit ng mabigat na ‘At nangyari.’
- source_word: בִּהְיוֹתָם כֹּאֲבִים
  choice: habang masakit pa ang kanilang mga sugat
  rationale: Ipinahahayag ang kasabay na kalagayan ng pananakit. Ang ‘mga sugat’ ay malinaw sa konteksto ng pagtutuli, ngunit hindi tuwirang binabanggit ng Hebreo, kaya itinatala rin ang mas literal na alternatibo sa talababa.
- source_word: שְׁנֵי בְנֵי יַעֲקֹב
  choice: ang dalawa sa mga anak ni Jacob
  rationale: 'Pinananatili ang diwang partitive: dalawa mula sa mas malaking pangkat ng mga anak ni Jacob.'
- source_word: שִׁמְעוֹן וְלֵוִי אֲחֵי דִינָה
  choice: sina Simeon at Levi, na mga kapatid ni Dina
  rationale: Karaniwang anyo ng mga pangalan sa Filipino at natural na appositional na pagkakakilanlan.
- source_word: אִישׁ חַרְבּוֹ
  choice: kumuha ng kani-kaniyang espada
  rationale: Ang distributibong אִישׁ at hulaping panghalip ay nagsasaad na bawat isa ay kumuha ng sarili niyang espada.
- source_word: וַיָּבֹאוּ עַל הָעִיר
  choice: Sinalakay nila ang lungsod
  rationale: Sa konteksto, ang בוא על ay hostile movement laban sa lungsod. Mas natural sa Tagalog ang ‘sinalakay’ kaysa literal ngunit alanganing ‘dumating laban sa.’
- source_word: בֶּטַח
  choice: habang panatag ito
  rationale: Binabasa ang pang-abay bilang paglalarawan sa lungsod na ligtas ang pakiramdam at hindi nakahanda; pinananatili sa talababa ang tunay na posibilidad na tumukoy ito sa paraan ng paglapit ng mga sumalakay.
- source_word: וַיַּהַרְגוּ כָּל זָכָר
  choice: at pinatay nila ang lahat ng lalaki
  rationale: Ang הרג ay tuwirang ‘pumatay.’ Sa kontekstong ito, ang ‘lahat ng lalaki’ ang natural na Filipino para sa כָּל זָכָר, bagaman literal itong ‘bawat lalaking kasarian,’ kaya itinatala ang saklaw sa talababa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at malinaw. Hinati sa dalawang pangungusap para maiwasan ang mabigat na sunod-sunod na sugnay. Ginamit ang ‘panatag’ upang ilarawan ang lungsod nang hindi ipinapasok ang ideya ng kawalang-malay bilang tiyak na kahulugan. Lahat ng talababa ay may katugmang marker sa pangunahing teksto.
