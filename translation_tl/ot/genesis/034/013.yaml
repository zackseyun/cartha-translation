base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/013.yaml
  text: Jacob’s sons answered Shechem and Hamor his father deceitfully and spoke[b][a], because he had defiled Dinah their sister.
translation:
  language: tl
  text: Sumagot nang may panlilinlang[a] ang mga anak na lalaki ni Jacob kina Shekem at Hamor, na ama ni Shekem, at nagsalita sila, sapagkat dinungisan[b] ni Shekem si Dina, na kapatid nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “sa mapanlinlang na paraan.” Pangngalan ang ginamit sa Hebreo: “nang may panlilinlang.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nilapastangan” o “hinalay.” Ang Hebreo ay tumutukoy sa pagdungis o paggawa na marumi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: Sumagot
  rationale: Sa kontekstong pasalaysay, ang pandiwa ay tugon sa naunang mungkahi; natural at tuwiran ang “sumagot” sa modernong Tagalog.
- source_word: בְנֵי יַעֲקֹב
  choice: ang mga anak ni Jacob
  rationale: Likas na anyong Tagalog para sa literal na “mga anak na lalaki ni Jacob”; malinaw na mga kapatid ni Dina ang tinutukoy sa konteksto.
- source_word: אֶת־שְׁכֶם וְאֶת־חֲמוֹר אָבִיו
  choice: kina Shekem at Hamor na ama nito
  rationale: Inilalahad ang dalawang tuwirang pinag-uukulan ng sagot at pinananatiling malinaw na si Hamor ang ama ni Shekem.
- source_word: בְּמִרְמָה
  choice: nang may panlilinlang
  rationale: Pinananatili nito ang pangngalang Hebreo na may pang-abay na gamit at malinaw na ipinahihiwatig ang sadyang pandaraya.
- source_word: וַיְדַבֵּרוּ
  choice: at nagsalita sila
  rationale: Pinananatili ang hiwalay na pandiwang “magsalita” sa Hebreo sa halip na isama lamang ito sa “sumagot,” kahit nagpapatuloy sa susunod na talata ang nilalaman ng kanilang sinabi.
- source_word: אֲשֶׁר
  choice: sapagkat
  rationale: Dito ay natural itong unawain bilang nagpapakilala ng dahilan ng mapanlinlang na sagot ng magkakapatid.
- source_word: טִמֵּא
  choice: dinungisan
  rationale: Tumutugma ito sa larangan ng kahulugan na “gawing marumi/dungisan” at pinananatili ang moral at rituwal na bigat ng salita sa konteksto ng seksuwal na paglapastangan.
- source_word: אֵת דִּינָה אֲחֹתָם
  choice: si Dina na kapatid nila
  rationale: Tuwirang pinananatili ang pagkakakilanlan kay Dina at ang ugnayang pampamilya na mahalaga sa reaksiyon ng mga kapatid.
theological_decisions:
- issue: Ang simuno ng isahang pandiwang טִמֵּא (“dinungisan niya”)
  choice: Tahasan na pinangalanan si Shekem
  alternative: “sapagkat dinungisan niya si Dina”
  rationale: Bagaman panghalip lamang ang nakapaloob sa anyong Hebreo, malinaw sa naunang salaysay na si Shekem ang gumawa nito. Iniiwasan ng tahasang pangalan ang maling pagbasa sa Tagalog na si Hamor, ang pinakamalapit na pangngalan, ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig. Ginamit ang “kina” para sa dalawang taong sinagot at “na ama nito” upang malinaw ngunit hindi mabigat ang ugnayan nina Shekem at Hamor. Pinanatiling hiwalay ang “at nagsalita sila” dahil hiwalay din itong pandiwa sa Hebreo at ang kanilang mismong pananalita ay nagpapatuloy sa kasunod na talata.
