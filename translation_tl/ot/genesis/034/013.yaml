- from: Sumagot nang may panlilinlang[a] ang mga anak ni Jacob kina Shekem at Hamor na ama nito, at nagsalita sila, sapagkat dinungisan[b] ni Shekem si Dina na kapatid nila.
  to: Sumagot nang may panlilinlang[a] ang mga anak na lalaki ni Jacob kina Shekem at Hamor, na ama ni Shekem, at nagsalita sila, sapagkat dinungisan[b] ni Shekem si Dina, na kapatid nila.
