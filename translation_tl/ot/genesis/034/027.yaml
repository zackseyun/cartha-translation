  yaml_path: translation/ot/genesis/034/027.yaml
  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
translation:
  language: tl
  text: Lumapit ang mga anak ni Jacob sa mga napatay[a] at dinambong nila ang lungsod, sapagkat doon nilapastangan ang kanilang kapatid na babae.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “dumating sa mga napatay” o “sumugod laban sa mga napatay.” Ang Hebreong parirala ay maaaring tumukoy sa pagkilos patungo o laban sa mga napatay na.
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “ang lungsod na nilapastangan nila ang kanilang kapatid na babae.” Siksik at hindi pangkaraniwan ang ayos ng Hebreo; ipinahahayag dito ang malamang na diwang ang lungsod ang lugar na pinangyarihan ng paglapastangan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יַעֲקֹב
  choice: mga anak ni Jacob
  rationale: Likas at tuwirang katumbas ng pariralang konstruktong “mga anak ni Jacob,” at pinananatili ang pagbibigay-diin sa kanila bilang isang pangkat.
- source_word: בָּאוּ עַל
  choice: pinuntahan ... ang
  rationale: Ipinahahayag sa natural na Tagalog ang paglapit o pagdating sa kinaroroonan ng mga napatay. Hindi ito ginawang tahasang panibagong pagsalakay, yamang mga napatay na ang kasunod na layon.
- source_word: הַחֲלָלִים
  choice: mga napatay
  rationale: Tumutukoy sa mga taong napatay sa marahas na labanan o pagpaslang; mas tiyak ito kaysa sa pangkalahatang “mga patay.”
- source_word: וַיָּבֹזּוּ
  choice: dinambong
  rationale: Malinaw na ipinahahayag ang pagkuha ng mga ari-arian bilang samsam pagkatapos ng karahasan.
- source_word: הָעִיר
  choice: lungsod
  rationale: Karaniwang katumbas ng עִיר at angkop sa marangal ngunit madaling maunawaang modernong Tagalog.
- source_word: אֲשֶׁר
  choice: sapagkat doon
  rationale: Ang Hebreong pangungusap na may relative particle ay siksik at inuugnay ang lungsod sa paglapastangan sa kapatid nila. Ang “sapagkat doon” ay nagpapahayag ng malamang na sanhi at lokasyon nang hindi maling itinuturo na ang mga anak ni Jacob ang gumawa nito.
- source_word: טִמְּאוּ
  choice: nilapastangan
  rationale: Sa kontekstong seksuwal at panlipunan, ipinahahayag nito ang matinding pagyurak at pagdungis sa babae, habang nananatiling marangal ang pananalita.
- source_word: אֲחוֹתָם
  choice: kanilang kapatid na babae
  rationale: Tuwirang pinananatili ang ugnayang pampamilya at nililinaw ang kasarian na mahalaga sa salaysay.
theological_decisions:
- issue: Hindi tiyak na antecedent ng pangmaramihang pandiwa sa sugnay na אֲשֶׁר טִמְּאוּ אֲחוֹתָם
  choice: Ginamit ang di-tiyak na tagaganap na “nilapastangan” at ang “doon” upang iugnay ang pangyayari sa lungsod.
  alternative: “sapagkat nilapastangan nila ang kanilang kapatid na babae”
  rationale: Sa Tagalog, ang “nila” ay pinakamadaling iugnay sa mga anak ni Jacob at sa gayon ay maaaring magpahiwatig ng kabaligtaran ng ibig sabihin ng salaysay. Iniiwasan ng napiling ayos ang maling pagkakakilanlan sa gumawa, habang hindi pinapangalanan nang higit sa teksto ang mga salarin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “dinambong” at “nilapastangan” upang mapanatili ang bigat ng karahasan nang hindi maging kolokyal o tahasang grapiko. Ang aktibong “Pinuntahan” ay natural sa Tagalog, samantalang ang di-tiyak na tagaganap sa “nilapastangan” ay umiiwas sa mapanlinlang na reperensiya ng panghalip.
