  terminology: Ang “kayamanan” para sa חֵיל, “maliliit nilang anak” para sa טַף, “mga asawa” para sa נְשֵׁיהֶם, “binihag” para sa שָׁבָה, at “sinamsam” para sa בזז ay pare-parehong angkop. Wasto ring pinananatili ng “bahay” ang literal na larawan ng בַּבַּיִת, na may talababa para sa posibleng kahulugang sambahayan.
