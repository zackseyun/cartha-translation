  yaml_path: translation/ot/genesis/034/029.yaml
  text: They took captive all their wealth and all their little ones and their wives[c][b][a], and plundered everything that was in the house.
translation:
  language: tl
  text: Binihag nila ang lahat ng maliliit nilang anak[a] at ang kanilang mga asawa, at sinamsam ang lahat ng kayamanan nila at ang lahat ng nasa bahay[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga anak nila.” Ang Hebreong טַף ay madalas tumukoy sa maliliit na bata o sa mga umaasa sa sambahayan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang lahat ng nasa sambahayan.” Kung minsan, ang Hebreong “bahay” ay tumutukoy sa sambahayan at sa mga pag-aari nito.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, nauuna sa dalawang pandiwang “binihag” at “sinamsam” ang magkakasamang talaan ng kayamanan, maliliit na anak, at mga asawa. Inayos dito ang pagkakasunod upang maging malinaw kung alin ang binihag at alin ang sinamsam.
    reason: translation_clarity
lexical_decisions:
- source_word: חֵילָם
  choice: lahat ng kayamanan nila
  rationale: Sa konteksto ng pagsamsam sa Shekem, ang חֵיל ay tumutukoy sa kayamanan, ari-arian, o kabuuang yaman; hindi ito nilimitahan sa mga hayop o sa hukbong sandatahan.
- source_word: טַפָּם
  choice: lahat ng maliliit nilang anak
  rationale: Ang טַף ay karaniwang tumutukoy sa maliliit na bata o sa mga batang umaasa sa sambahayan. Pinananatili ng saling ito ang diin sa murang edad.
- source_word: נְשֵׁיהֶם
  choice: kanilang mga asawa
  rationale: Maaaring mangahulugang “mga babae” o “mga asawa” ang אִשָּׁה; sa talaan ng mga miyembro ng sambahayan na binihag, natural ang relasyonal na kahulugang “mga asawa.”
- source_word: שָׁבוּ
  choice: binihag nila
  rationale: Tuwirang ipinahahayag ng שָׁבָה ang pagkuha sa mga tao bilang bihag.
- source_word: וַיָּבֹזּוּ
  choice: sinamsam
  rationale: Ang בזז ay tumutukoy sa marahas na pagkuha ng samsam; malinaw at angkop sa kasalukuyang Tagalog ang “sinamsam.”
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: ang lahat ng nasa bahay
  rationale: Malapit ito sa isahan ng Hebreong בַּבָּיִת habang nananatiling natural sa Tagalog; maaaring mas malawak ang “bahay” bilang sambahayan.
theological_decisions:
- issue: Magkahalong mga tao at ari-arian ang nauuna sa dalawang pandiwang Hebreo
  choice: Iniugnay ang “binihag” sa mga anak at asawa, at ang “sinamsam” sa kayamanan at mga nasa bahay.
  alternative: Panatilihin ang eksaktong ayos at iugnay sa “binihag” ang kayamanan kasama ng mga tao.
  rationale: May sintaktikong pagpapaikli o zeugma sa Hebreo. Ang bahagyang pagsasaayos ay nagpapalinaw sa likas na ugnayan ng mga pandiwa at layon nang hindi binabago ang mga elementong nasa teksto; walang usaping doktrinal na ipinapasok.
translation_notes:
  register: Gumamit ng makabago ngunit marangal at tuwirang Filipino. Pinili ang “binihag” at “sinamsam” upang mapanatili ang marahas na diwa ng salaysay. Ang “maliliit nilang anak” ay mas likas kaysa sa literal na “kanilang maliliit,” at ang bahagyang pagbabago ng ayos ay umiiwas sa di-likas na pahiwatig na binihag ang kayamanan.
