lexical_decisions:
- source_word: וְהִתְחַתְּנוּ אֹתָנוּ
  choice: Makipag-asawahan kayo sa amin
  rationale: Ipinapahayag ng hitpael ng חתן ang kapuwa at tuloy-tuloy na pagbuo ng mga ugnayan sa pamamagitan ng pag-aasawa. Likas sa modernong Tagalog ang “makipag-asawahan” at pinananatili nito ang diwang tumbasan.
- source_word: בְּנֹתֵיכֶם
  choice: ang inyong mga anak na babae
  rationale: Tuwirang salin ng pangngalang maramihan na may hulaping tumutukoy sa ikalawang panauhang maramihan.
- source_word: תִּתְּנוּ לָנוּ
  choice: ibigay ninyo sa amin ... upang mapangasawa
  rationale: Bagaman literal na “ibigay ... sa amin,” malinaw sa konteksto na pag-aasawa ang layon. Ang “upang mapangasawa” ay natural at iniiwasan ang maling pagbasa na karaniwang pagbibigay o pag-aari ang tinutukoy.
- source_word: וְאֶת בְּנֹתֵינוּ תִּקְחוּ לָכֶם
  choice: at kunin ninyo ang aming mga anak na babae upang mapangasawa
  rationale: Pinananatili ng “kunin” ang pandiwang Hebrew na לקח at ang katumbasang estruktura ng talata; nililinaw ng “upang mapangasawa” ang kahulugang pangkasal na itinatakda ng pambungad na pandiwa.
