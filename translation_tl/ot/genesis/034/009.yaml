  source_fidelity: 'Tumpak ang pangunahing diwa: ang hitpael ng חתן ay panawagan sa kapuwaang pakikipag-ugnayan sa pag-aasawa, na sinusundan ng magkatumbas na pagbibigay at pagkuha ng mga anak na babae sa kasal. Gayunman, ang walang tahasang tagaganap na “upang mapangasawa” ay maaaring bahagyang malabo sa Tagalog. Ang “bilang mapapangasawa namin/ninyo” ay mas malinaw na naghahayag ng katumbasang nasa Hebreo.'
  naturalness: Natural at marangal ang “Makipag-asawahan kayo sa amin.” Mas natural at mas tiyak ang “bilang mapapangasawa namin/ninyo” kaysa sa inuulit na “upang mapangasawa,” dahil malinaw nito kung kaninong pag-aasawa ang tinutukoy.
  terminology: Ang “makipag-asawahan” ay angkop na modernong Filipino para sa mutual na marriage alliance. Ang “mga anak na babae” ay wastong salin ng בנות. Inilalagay ang paliwanag hinggil sa kahulugang pangkasal sa isang talababa upang suportahan ang idyomatikong “ibigay” at “kunin” nang hindi lumilihis sa estruktura ng Hebreo.
