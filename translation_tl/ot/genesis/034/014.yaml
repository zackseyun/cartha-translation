  source_fidelity: 'Ang pangkalahatang estruktura at kahulugan ay tapat sa Hebreo: maramihan ang nagsasalita at kausap, ang pagtanggi ay ipinahahayag bilang kawalan ng kakayahan, at nananatili ang literal na “ibigay ang aming kapatid na babae” at ang panlipunang kahihiyan. Gayunman, ang “balat ng maselang bahagi” ay hindi sapat na tiyak para sa עָרְלָה, na tumutukoy sa balat ng ari (foreskin).'
  naturalness: Ang “Sinabi nila sa mga ito” ay hindi natural sa modernong Tagalog kapag tumutukoy sa mga taong nakausap; “Sinabi nila sa kanila” ang karaniwang anyo. Mas malinaw at marangal ang “balat sa ari” para sa anatomikong sanggunian kaysa sa euphemistic ngunit malabong “balat ng maselang bahagi.”
  terminology: Ang “kahihiyan” ay angkop para sa חֶרְפָּה. Ang “lalaki” ay pinananatili para sa אִישׁ, hindi “asawa.” Ang “balat sa ari” ay tumpak na literal na katumbas ng Hebreong pagpapahayag, habang ang “hindi tuli” ay wastong idiomatikong alternatibo sa talababa.
