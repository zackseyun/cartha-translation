lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵיהֶם
  choice: Sinabi nila sa mga ito
  rationale: Pinananatili ang maramihang tagapagsalita at maramihang pinatutungkulan. Ang “sinabi” ang likas na salaysay na katumbas ng אמר.
- source_word: לֹא נוּכַל
  choice: Hindi namin magagawa
  rationale: Likas sa modernong Tagalog at tapat sa pahayag ng kawalan ng kakayahan sa יכל.
- source_word: לַעֲשׂוֹת הַדָּבָר הַזֶּה
  choice: magagawa ang bagay na ito
  rationale: Nananatili ang tahasang pangngalang דָּבָר habang maayos ang daloy sa Tagalog.
- source_word: לָתֵת אֶת אֲחֹתֵנוּ
  choice: ibigay ang aming kapatid na babae
  rationale: Tuwirang isinasalin ang נתן bilang “ibigay”; hindi idinaragdag sa teksto ang “bilang asawa,” bagaman malinaw iyon sa konteksto.
- source_word: לְאִישׁ
  choice: sa isang lalaki
  rationale: Karaniwang kahulugan ng אִישׁ ang “lalaki”; iniiwasang gawing “asawa” upang hindi palawakin ang tahasang sinabi ng Hebreo.
- source_word: אֲשֶׁר לוֹ עָרְלָה
  choice: may balat ng maselang bahagi
  rationale: Inililipat ang konkretong Hebreong idyoma na literal na nagsasabing ang lalaki ay “may foreskin,” sa paraang dignified at mauunawaan sa modernong Tagalog. Inilalagay sa talababa ang mas karaniwang kahulugang “hindi tuli.”
- source_word: כִּי חֶרְפָּה הִוא לָנוּ
  choice: sapagkat kahihiyan iyon sa amin
  rationale: Ang חֶרְפָּה ay tumutukoy sa kahihiyan o paghamak sa larangan ng dangal sa lipunan; malinaw at natural ang “kahihiyan” sa Tagalog.
