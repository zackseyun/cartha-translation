revisions:
- from: Sinabi nila sa mga ito, “Hindi namin magagawa ang bagay na ito—ang ibigay ang aming kapatid na babae sa isang lalaking may balat ng maselang bahagi[a]—sapagkat kahihiyan iyon sa amin.”
  to: Sinabi nila sa kanila, “Hindi namin magagawa ang bagay na ito—ang ibigay ang aming kapatid na babae sa isang lalaking may balat sa ari[a]—sapagkat kahihiyan iyon sa amin.”
  rationale: Pinalitan ang hindi natural na “sa mga ito” ng “sa kanila.” Pinalitan ang malabong euphemism na “balat ng maselang bahagi” ng mas tiyak ngunit mahinahong “balat sa ari,” na pinananatili ang literal na Hebreong pananalita. Nananatili sa talababa ang idiomatikong alternatibong “hindi tuli.”
