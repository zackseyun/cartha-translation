translation:
  language: tl
  text: Sinabi nila sa kanila, “Hindi namin magagawa ang bagay na ito—ang ibigay ang aming kapatid na babae sa isang lalaking may balat sa ari[a]—sapagkat kahihiyan iyon sa amin.”
  philosophy: optimal-equivalence
