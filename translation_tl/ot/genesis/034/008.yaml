  yaml_path: translation/ot/genesis/034/008.yaml
  text: And Hamor spoke with them[a], saying, “My son Shechem longs for your daughter. Please give her to him as a wife.”
translation:
  language: tl
  text: At kinausap sila ni Hamor. Sinabi niya, “Ang anak kong si Shekem ay labis na nananabik sa inyong anak na babae.[a] Pakibigay ninyo siya sa kanya upang maging asawa niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “ang kanyang kaluluwa ay naging lubhang nakatuon sa inyong anak na babae”; o “labis niyang ninanais ang inyong anak na babae.”
    reason: Pinananatili ang saklaw ng idyomang חָשְׁקָה נַפְשׁוֹ, na nagpapahayag ng matinding pagkagiliw o pagnanais.
lexical_decisions:
- source_word: וַיְדַבֵּר ... אִתָּם לֵאמֹר
  choice: At kinausap sila ni Hamor. Sinabi niya
  rationale: Ang “kinausap” ay likas na katumbas ng pagsasalitang “kasama/kausap sila,” habang pinananatili ng hiwalay na “Sinabi niya” ang kasunod na לֵאמֹר.
- source_word: שְׁכֶם בְּנִי
  choice: Ang anak kong si Shekem
  rationale: Natural sa modernong Tagalog ang ayos na ito at malinaw na si Shekem ang anak ni Hamor.
- source_word: חָשְׁקָה נַפְשׁוֹ
  choice: ay labis na nananabik
  rationale: Ipinahahayag nito ang matinding pagnanasa o pagkahumaling ng buong pagkatao nang hindi pinipilit ang literal ngunit di-likas na “ang kanyang kaluluwa ay kumapit.”
- source_word: בְּבִתְּכֶם
  choice: sa inyong anak na babae
  rationale: Isahan ang “anak na babae,” ngunit maramihan ang kinakausap sa hulaping “inyong”; tumutukoy ito kay Dina bilang anak ng pamilya.
- source_word: תְּנוּ נָא אֹתָהּ לוֹ
  choice: Pakibigay ninyo siya rito
  rationale: Pinananatili ng “paki-” ang magalang o nakikiusap na puwersa ng נָא, at ng “ninyo” ang maramihang utos; ang “rito” ay tumutukoy kay Shekem.
- source_word: לְאִשָּׁה
  choice: upang maging asawa niya
  rationale: Malinaw at natural na ipinapahayag ang pagbibigay sa babae para sa pag-aasawa.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw at marangal. Ginamit ang “Shekem” bilang tuwirang transliterasyon na angkop sa bigkas sa Filipino. Ang pangungusap ay hinati upang maging natural habang napapanatili ang pagkakaiba ng וַיְדַבֵּר at לֵאמֹר. Nasa pangunahing teksto ang marker na [a].
