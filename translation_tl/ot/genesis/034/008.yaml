  verdict: revise
  source_fidelity: Tumpak sa kabuuan ang pagsasalin ng pananalita ni Hamor, ng matinding pagnanais ni Shekem, at ng magalang na pakiusap na ibigay ang babae upang maging asawa niya. Gayunman, ang “rito” ay nangangahulugang “dito” at nagdaragdag ng deiktikong kahulugang wala sa Hebreo; ang אֹתָהּ לוֹ ay malinaw na “siya sa kanya.”
  naturalness: Likas at angkop sa makabagong Filipino ang “Ang anak kong si Shekem” at “Pakibigay ninyo.” Mas natural at mas tumpak ang “sa kanya” kaysa “rito.”
  terminology: Ang “asawa niya” ay wastong katumbas ng לְאִשָּׁה. Ang “labis na nananabik” ay katanggap-tanggap para sa matinding pagnanais, ngunit inaayos ang talababa upang mas tumpak na maipakita ang idyomang Hebreo nang hindi gumagamit ng di-likas na “buong pagkatao.”
  issues:
  - severity: medium
    issue: Ang “rito” ay hindi katumbas ng לוֹ.
    rationale: Ang “rito” ay “dito,” samantalang ang Hebreong לוֹ ay “sa kanya/para sa kanya,” na tumutukoy kay Shekem. Ang “rito” ay nagdaragdag ng lokasyon o direksiyong wala sa pinagmulan.
  - severity: low
    issue: Hindi tumpak at hindi natural ang unang alternatibo sa talababa.
    rationale: Ang “ang buong pagkatao niya ay lubhang napalapit” ay hindi malinaw na katumbas ng חָשְׁקָה נַפְשׁוֹ. Mas mabuting ipakita ang literal na anyo (“ang kanyang kaluluwa ay naging lubhang nakatuon”) at isang likas na alternatibo.
