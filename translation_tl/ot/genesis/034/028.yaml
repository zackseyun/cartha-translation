- from: Kinuha nila ang kanilang mga kawan ng tupa at kambing, mga bakahan, mga asno, at lahat ng nasa lungsod at nasa bukid.
  to: Kinuha nila ang kanilang mga kawan ng tupa at kambing, mga baka, mga asno, at ang anumang nasa lungsod at ang anumang nasa bukid.[a]
  rationale: Pinalitan ang “mga bakahan” ng “mga baka” upang tukuyin ang mga hayop, hindi ang lugar ng pag-aalaga sa mga ito. Ginawang “ang anumang” ang dalawang panghuling sugnay upang mapanatili ang saklaw ng Hebreong relatibong konstruksyon nang hindi pinatitibay ang “lahat”; ibinigay ang huling ito bilang alternatibong salin sa talababa.
