  yaml_path: translation/ot/genesis/034/028.yaml
  text: They took their flocks[a], their herds, their donkeys, and whatever was in the city and whatever was in the field.
translation:
  language: tl
  text: Kinuha nila ang kanilang mga kawan ng tupa at kambing, mga baka, mga asno, at ang anumang nasa lungsod at ang anumang nasa bukid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: lahat ng nasa lungsod at lahat ng nasa bukid.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאנָם
  choice: kanilang mga kawan ng tupa at kambing
  rationale: Ang צֹאן ay pangkalahatang tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Nililinaw ng salin ang saklaw nito habang pinananatili ang kolektibong diwa ng 'kawan.'
- source_word: בְּקָרָם
  choice: mga bakahan
  rationale: Ang בָּקָר ay kolektibong tumutukoy sa mga baka. Ang 'mga bakahan' ay maikli, natural, at katapat ng kolektibong anyo ng Hebreo.
- source_word: חֲמֹרֵיהֶם
  choice: mga asno
  rationale: Tuwirang modernong salin ito para sa mga donkey at angkop sa marangal na rehistro ng salaysay.
- source_word: אֲשֶׁר בָּעִיר
  choice: lahat ng nasa lungsod
  rationale: Ipinahihiwatig ng malawak na sugnay na pantukoy ang kabuuan ng mga bagay na kinuha sa lungsod. Natural sa Filipino ang 'lahat ng nasa lungsod.'
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: lahat ng nasa bukid
  rationale: Ang שָׂדֶה ay maaaring tumukoy sa bukid o lantad na lupain. Ang 'bukid' ang pinakadirekta at pinakanatural dito.
- source_word: לָקָחוּ
  choice: Kinuha nila
  rationale: Pinananatili ng 'kinuha' ang payak na kahulugan ng לָקַח. Hindi ginamit ang mas interpretibong 'tinangay' o 'sinamsam,' bagaman pandarambong ang konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga kolektibong katawagan para sa mga hayop at pinanatili ang payak na pandiwang 'kinuha' upang hindi dagdagan ang tindi ng pandiwa sa Hebreo.
