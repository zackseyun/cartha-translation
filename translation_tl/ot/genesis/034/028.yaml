    rationale: Ang “bakahan” ay mas karaniwang nangangahulugang rantso, kulungan, o lugar ng pag-aalaga ng baka. Ang Hebreo ay tumutukoy sa mga baka/cattle na kinuha.
  - severity: low
    issue: “lahat ng nasa...” bilang pangunahing salin ng dalawang אֲשֶׁר na sugnay
    rationale: Posible ang distributibong “lahat,” ngunit hindi ito hayagang minamarkahan ng כֹּל sa Hebreo. Ang “anumang” ay mas malapit sa malawak na relatibong pahayag; maaaring itala ang “lahat” bilang alternatibo.
