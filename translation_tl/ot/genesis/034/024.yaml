base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/024.yaml
  text: And all who went out of the gate of his city listened to Hamor and to Shechem his son[a], and every male, all who went out of the gate of his city[c][b], was circumcised.
translation:
  language: tl
  text: Nakinig kay Hamor at sa anak niyang si Shekem ang lahat ng lumalabas sa tarangkahan ng kanyang lungsod[a], at tinuli ang bawat lalaki, ang lahat ng lumalabas sa tarangkahan ng kanyang lungsod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lahat ng lumalabas sa tarangkahan ng kanyang lungsod.” Isa itong pananalitang tumutukoy sa mga lalaking mamamayan na nakikibahagi sa pampublikong buhay ng lungsod.
    reason: cultural_note
  - marker: b
    text: O “nagpatuli ang bawat lalaki.” Ang anyong Hebreo ay maaaring unawaing pasibo o bilang kusang pagpapagawa ng pagtutuli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֶל
  choice: Nakinig kay
  rationale: Ang שׁמע אֶל ay nangangahulugang makinig sa isang tao at, sa kontekstong ito, sang-ayunan ang kanyang panukala. Pinananatili ng “nakinig” ang saklaw ng kahulugan nang hindi ito ginagawang tahasang “sumunod.”
- source_word: כָּל יֹצְאֵי שַׁעַר עִירוֹ
  choice: ang lahat ng lumalabas sa tarangkahan ng kanyang lungsod
  rationale: Malapit ito sa kongkretong Hebreong pananalita at pinananatili ang sinadyang pag-uulit nito. Ipinaliliwanag sa talababa ang gamit nitong tumutukoy sa mga lalaking mamamayang nakikibahagi sa pampublikong buhay ng lungsod.
- source_word: בְּנוֹ
  choice: sa anak niyang si Shekem
  rationale: Likas na ayos sa modernong Tagalog para sa “Shekem na kanyang anak,” at malinaw na si Shekem ang anak ni Hamor.
- source_word: וַיִּמֹּלוּ
  choice: nagpatuli
  rationale: Ang Niphal ng מול ay maaaring pasibo o may pahiwatig na kusang pagpapagawa. Ang “nagpatuli” ay likas sa Tagalog para sa mga lalaking sumailalim sa pagtutuli, nang hindi ipinahihiwatig na sila mismo ang nagsagawa nito.
- source_word: כָּל זָכָר
  choice: ang bawat lalaki
  rationale: Ipinakikita ng “bawat” ang distributibong diwa ng כָּל na may pang-isahang זָכָר. Sa konteksto, ang “lalaki” ang pinakanatural at malinaw na katumbas ng “male.”
- source_word: שַׁעַר עִירוֹ
  choice: tarangkahan ng kanyang lungsod
  rationale: Pinananatili ang kongkretong larawan ng tarangkahan bilang lugar ng paglabas at ng pampublikong buhay, at hindi tahasang tinutukoy kung kanino tumutukoy ang panghalip na “kanyang.”
theological_decisions:
- issue: Pasibo o kusang pagpapagawa sa pagtutuli
  choice: nagpatuli
  alternative: tinuli
  rationale: Maaaring basahin ang anyong Niphal bilang pasibo o reflexive. Ang “nagpatuli” ay natural na nagsasaad na sumailalim sila sa ritwal nang hindi nilulutas kung gaano kalakas ang kusang-loob o kung sino ang aktuwal na nagsagawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pag-uulit ng pariralang tungkol sa tarangkahan at ang di-tiyak na tinutukoy ng “kanyang,” habang ginawang natural ang ayos ng pangungusap sa Filipino.
