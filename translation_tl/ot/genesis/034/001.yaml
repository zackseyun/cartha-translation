base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/001.yaml
  text: Dinah[a], the daughter of Leah, whom she had borne to Jacob, went out to see the daughters of the land.
translation:
  language: tl
  text: Lumabas si Dina, ang anak ni Lea, na ipinanganak ni Lea kay Jacob, upang makita ang mga anak na babae ng lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang dalawin ang mga babae sa lupain.” Sa literal na Hebreo, “upang makita ang mga anak na babae ng lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: Lumabas
  rationale: Karaniwang kahulugan ng Qal wayyiqtol ng יצא ang paglabas. Hindi dinagdagan ng tiyak na pinanggalingang lugar, sapagkat wala nito sa Hebreo.
- source_word: דִינָה
  choice: Dina
  rationale: Karaniwang makabagong anyong Tagalog ng personal na pangalang Hebreo.
- source_word: בַּת לֵאָה
  choice: anak ni Lea
  rationale: Likas sa Tagalog at malinaw na ipinakikilalang si Dina ang anak na babae ni Lea; hindi na kailangang ulitin ang kasarian dahil babae ang pangalan at nililinaw rin ito ng konteksto.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: na isinilang niya kay Jacob
  rationale: Pinananatili ang kaugnayan kay Lea at ang pagkilala kay Jacob bilang ama. Ang pasibong anyo ay mas natural at marangal sa modernong Tagalog kaysa sa literal na 'ipinanganak niya para/kay Jacob.'
- source_word: לִרְאוֹת
  choice: upang makita
  rationale: Direktang pinananatili ang literal na diwa ng ראה, habang inilalagay sa talababa ang posibleng kontekstuwal na diwang pagdalaw.
- source_word: בִּבְנוֹת הָאָרֶץ
  choice: ang mga anak na babae ng lupain
  rationale: Pinananatili ang Hebreong idyoma at ang tunay na kalabuan kung mga babae o mga dalaga ang tinutukoy; mas idiomatikong alternatibo ang ibinibigay sa talababa.
