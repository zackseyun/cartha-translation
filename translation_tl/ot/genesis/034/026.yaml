translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang karaniwang baybay na Shekem at Dina. Hinati sa dalawang pangungusap para sa natural na daloy, nang hindi binabago ang pagkakasunod-sunod ng mga kilos.
