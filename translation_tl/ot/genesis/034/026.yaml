  yaml_path: translation/ot/genesis/034/026.yaml
  text: They also killed Hamor and his son Shechem with the sword[a], and they took Dinah from Shechem’s house and went out.
translation:
  language: tl
  text: Pinatay din nila sa pamamagitan ng espada si Hamor at ang anak niyang si Shekem.[a] Pagkatapos, kinuha nila si Dina mula sa bahay ni Shekem at lumabas sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa pamamagitan ng bibig ng espada,” isang idyoma na nangangahulugang pinatay sa pamamagitan ng espada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת חֲמוֹר וְאֶת שְׁכֶם בְּנוֹ
  choice: Pinatay din nila ... si Hamor at ang anak niyang si Shekem
  rationale: Ang pang-ugnay at mga pananda ng tuwirang layon ay nagdurugtong sa naunang pagpatay at nagdaragdag kina Hamor at Shekem bilang mga pinatay. Likas sa modernong Tagalog ang ayos na ito at malinaw na si Shekem ang anak ni Hamor.
- source_word: הָרְגוּ
  choice: Pinatay
  rationale: Tuwiran at karaniwang salin ng pandiwang הרג sa salaysay; hindi nito dinaragdagan ang antas o paraan ng karahasan.
- source_word: לְפִי חָרֶב
  choice: sa pamamagitan ng espada
  rationale: Idyomang Hebreo ito na literal na tumutukoy sa 'bibig ng espada.' Inihahatid ng salin ang paraang ginamit sa pagpatay nang natural sa Tagalog, habang inilalagay sa talababa ang literal na larawan.
- source_word: וַיִּקְחוּ אֶת דִּינָה
  choice: kinuha nila si Dina
  rationale: Pinananatili ang malawak at payak na diwa ng לקח nang hindi pinatitindi bilang 'dinukot' o 'sinunggaban.'
- source_word: מִבֵּית שְׁכֶם
  choice: mula sa bahay ni Shekem
  rationale: Ang בֵּית ay pinakamalamang na tumutukoy rito sa konkretong tirahan kung saan naroon si Dina, at natural sa Tagalog ang anyong paari na 'bahay ni Shekem.'
- source_word: וַיֵּצֵאוּ
  choice: at umalis
  rationale: Likas na salaysay sa Tagalog para sa paglabas o paglayo nila sa bahay; hindi nagdaragdag ng hindi tinukoy na destinasyon.
