  text: But if you will not listen to us[a], to be circumcised[b], then we will take our daughter and go.
translation:
  language: tl
  text: Ngunit kung hindi ninyo kami pakikinggan sa aming kahilingang magpatuli kayo[a], kukunin namin ang aming anak na babae at aalis kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “kung hindi ninyo kami pakikinggan, upang magpatuli.” Maaaring ipahiwatig ng pawatas na Hebreo ang nilalaman ng hinihinging pakikinig: magpatuli kayo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Ngunit kung
  rationale: Ipinahihiwatig ng pangatnig ang kondisyong salungat sa alok na nauna; likas itong naipapahayag sa Tagalog bilang “Ngunit kung.”
- source_word: תִשְׁמְעוּ אֵלֵינוּ
  choice: hindi ninyo kami pakikinggan
  rationale: Ang שׁמע na may אֶל ay nangangahulugang makinig o tumalima. Pinananatili ng “pakikinggan” ang tuwirang larawan nang hindi pinatitindi tungo sa tahasang “susundin.”
- source_word: לְ/הִמּוֹל
  choice: at hindi kayo magpapatuli
  rationale: Ang pawatas ay nagsasaad ng hinihinging nilalaman o kilos ng pakikinig. Inulit ang negasyon sa Tagalog upang maging malinaw na ang pagtangging makinig ay makikita sa hindi pagpapatuli, habang ang talababa ay nagpapanatili sa mas pormal na ugnayang sintaktiko.
- source_word: וְ/לָקַחְנוּ
  choice: kukunin namin
  rationale: Sa kasunod na bahagi ng kondisyon, ang anyong pandiwa ay may hinaharap na diwa at nagsasaad ng magiging bunga.
- source_word: אֶת בִּתֵּנוּ
  choice: ang aming anak na babae
  rationale: Tuwirang katumbas ng pangngalang may hulaping unang panauhang maramihan; sa konteksto, tumutukoy ito kay Dina.
- source_word: וְ/הָלָכְנוּ
  choice: at aalis kami
  rationale: Sa kontekstong ito, ang הלך ay pag-alis o pagyaon mula sa lugar. Mas likas at tiyak sa Tagalog ang “aalis kami” kaysa simpleng “pupunta kami.”
