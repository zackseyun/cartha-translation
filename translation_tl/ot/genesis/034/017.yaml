translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “anak na babae” upang tahasang maipahayag ang kasarian na nasa Hebreo, at “aalis” upang ihatid ang kontekstuwal na diwa ng pagyaon.
