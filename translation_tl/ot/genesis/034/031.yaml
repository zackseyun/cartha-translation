  text: But they said[a], “Should he treat our sister like a prostitute?”
translation:
  language: tl
  text: Ngunit sinabi nila[a], “Itatrato ba niya ang kapatid naming babae na parang isang patutot?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Gagawin ba niya ang kapatid naming babae na parang isang patutot?” Ang pandiwang Hebreo ay literal na “gawin/gawing,” ngunit malamang na “tratuhin” ang diwa rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ngunit sinabi nila
  rationale: Ang wayyiqtol ng אמר ay nagpapakilala sa tugon ng mga anak ni Jacob. Ang “Ngunit” ay likas na nagpapahayag ng pagsalungat nila sa sinabi ni Jacob sa naunang talata.
- source_word: הַכְזוֹנָה
  choice: na parang isang babaeng bayaran
  rationale: Ang pantanong na ה, kasama ng כ at זונה, ay nangangahulugang “na parang isang babaeng bayaran?” Pinili ang kasalukuyan at dignified na katawagang madaling maunawaan, habang pinananatili ang paghahambing.
- source_word: יַעֲשֶׂה
  choice: Dapat ba niyang tratuhin
  rationale: Malawak ang kahulugan ng עשה (“gawin/gawing”), ngunit kapag tao ang tuwirang layon sa kontekstong ito, natural na ipinahahayag ng “tratuhin” ang diwang tinutukoy. Ang imperfect ay angkop na isinalin bilang retorikal na tanong.
- source_word: אֶת אֲחוֹתֵנוּ
  choice: ang kapatid namin
  rationale: Ang אֶת ay pananda ng tuwirang layon at hindi hiwalay na isinasalin; ang אֲחוֹתֵנוּ ay “aming kapatid na babae.” Sa Tagalog, malinaw na sa konteksto na babae si Dina, kaya natural ang “kapatid namin.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “babaeng bayaran” sa halip na mas arkaiko o mas mapanlait na katawagan; pinanatili ang maigsi at mariing retorikal na tanong ng Hebreo.
