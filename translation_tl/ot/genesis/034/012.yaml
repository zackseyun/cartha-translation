  text: Demand from me a very large bride-price and gift[a], and I will give whatever you say to me; only give me the young woman as a wife.
translation:
  language: tl
  text: “Humingi kayo sa akin ng napakalaking bayad-pangkasal at regalo[a], at ibibigay ko ang anumang sabihin ninyo sa akin. At ibigay ninyo sa akin ang dalaga upang maging asawa ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dote”; ang Hebreong מֹהַר ay partikular na tumutukoy sa bayad na ibinibigay ng lalaki o ng pamilya niya sa pamilya ng babaeng pakakasalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  choice: Humingi kayo sa akin ng napakalaking
  rationale: Ang maramihang pautos ay nagpapahintulot sa mga kausap na magtakda ng napakataas na halaga na ipapataw sa nagsasalita. Likas sa modernong Tagalog ang “humingi kayo sa akin” para sa ganitong transaksiyon.
- source_word: מֹהַר
  choice: bayad-pangkasal
  rationale: Tumutukoy ito sa halagang ibinibigay ng lalaki o ng pamilya niya sa pamilya ng babaeng pakakasalan. Mas tumpak ito kaysa sa “dote,” na maaaring maunawaan bilang ari-ariang mula naman sa panig ng babae.
- source_word: וּמַתָּן
  choice: at regalo
  rationale: Tumutukoy sa karagdagang handog o regalo na kaakibat ng bayad-pangkasal; pinananatili ng isahan ang anyo ng pangngalang Hebreo.
- source_word: וְאֶתְּנָה
  choice: at ibibigay ko
  rationale: Ipinapahayag ng cohortative ang matibay na kahandaan o pasiya ng nagsasalita; natural itong naihahayag sa panghinaharap na anyo sa Tagalog.
- source_word: כַּאֲשֶׁר תֹּאמְרוּ אֵלָי
  choice: ang anumang sabihin ninyo sa akin
  rationale: Pinananatili nito ang bukas na saklaw ng halaga o kundisyong maaari nilang itakda.
- source_word: וּתְנוּ לִי
  choice: Ibigay lamang ninyo sa akin
  rationale: Ang “lamang” ay natural na naghahayag ng mariing pangwakas na pakiusap matapos ang alok, nang hindi ginagawang tahasang kondisyon ang simpleng pang-ugnay.
- source_word: הַנַּעֲרָ
  choice: ang dalaga
  rationale: Sa kontekstong pangkasal, ang salita ay tumutukoy sa isang kabataang babaeng nasa edad nang mag-asawa. Ang “dalaga” ay maikli, natural, at marangal sa Tagalog.
- source_word: לְאִשָּׁה
  choice: upang maging asawa ko
  rationale: Natural na Tagalog ito para sa karaniwang Hebreong pahayag tungkol sa pagkuha sa isang babae bilang asawa, at malinaw na naiuugnay sa “ibigay ninyo sa akin.”
