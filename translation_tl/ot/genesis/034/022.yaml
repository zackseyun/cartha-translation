base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/022.yaml
  text: 'Only on this condition will the men agree with us[a], to dwell with us and to become one people: that every male among us be circumcised, just as they are circumcised.'
translation:
  language: tl
  text: 'Sa ganitong kondisyon lamang papayag ang mga lalaki na manirahang kasama natin at maging iisang bayan: kung magpapatuli ang bawat lalaki sa atin, gaya nila.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung tutuliin ang bawat lalaki sa atin, gaya ng pagtutuli sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: Sa ganitong kondisyon lamang
  rationale: Pinagsama ang pan限定 na אַךְ at ang kondisyunal na בְּזֹאת sa natural na Filipino upang malinaw na ipakilala ang tanging kondisyon.
- source_word: יֵאֹתוּ לָנוּ
  choice: papayag sa atin
  rationale: Ipinahahayag ng Niphal ng אוה ang pagpayag o pagsang-ayon; natural sa konteksto ng pakikipagkasundo ang “papayag sa atin,” habang pinananatili sa talababa ang posibleng “sasang-ayon sa atin.”
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaking ito
  rationale: Tumutukoy ang panlalaking pangmaramihang pangngalan sa tiyak na pangkat ng mga lalaking pinag-uusapan sa salaysay.
- source_word: לָשֶׁבֶת אִתָּנוּ
  choice: na manirahang kasama natin
  rationale: Ang ישב ay nangangahulugang manirahan o tumahan; ang “manirahan” ay kasalukuyan, dignified, at malinaw na tumutukoy sa sama-samang paninirahan.
- source_word: לִהְיוֹת לְעַם אֶחָד
  choice: at maging isang bayan
  rationale: Ipinahahayag ang pagpasok sa iisang pagkakakilanlang panlipunan. Ang “bayan” ay mas angkop kaysa “bansa” sa kontekstong angkan at pamayanan.
- source_word: בְּהִמּוֹל לָנוּ כָּל זָכָר
  choice: kailangang tuliin ang bawat lalaki sa atin
  rationale: Ginagawang malinaw ng “kailangang” ang kondisyong ipinahahayag ng בְּ kasama ng infinitive, at pinananatili ng “bawat lalaki” ang saklaw ng כָּל זָכָר.
- source_word: כַּאֲשֶׁר הֵם נִמֹּלִים
  choice: gaya ng pagkakatuli nila
  rationale: Pinananatili ang paghahambing at ang kalagayang tuli ng kabilang pangkat nang hindi ipinapalagay kung kailan isinagawa ang pagtutuli.
