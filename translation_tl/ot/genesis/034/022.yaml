    issue: Ang “ito” sa “mga lalaking ito” ay walang tuwirang katumbas sa Hebreo.
    rationale: Tiyak ang pangngalan sa Hebreo (“ang mga lalaki”), ngunit hindi ito may deiktikong panghalip. Hindi kailangan ang dagdag na “ito” upang maging malinaw ang pagtukoy sa konteksto.
  - severity: low
    issue: Ang pariralang talababa na “magiging handang makiisa sa atin” ay mas interpretatibo kaysa sa pandiwang יֵאֹתוּ.
    rationale: Ipinahihiwatig ng pandiwa ang pagpayag, pagsang-ayon, o pagiging handa; ang “makibahagi/makiisa” ay maaaring magpahiwatig ng mas tiyak na uri ng pakikiisa na inilalahad na ng kasunod na mga infinitive.
