revisions:
- from: 'Sa ganitong kondisyon lamang papayag sa atin ang mga lalaking ito[a] na manirahang kasama natin at maging isang bayan: kailangang tuliin ang bawat lalaki sa atin, gaya ng pagkakatuli nila.'
  to: 'Sa ganitong kondisyon lamang papayag ang mga lalaki na manirahang kasama natin at maging iisang bayan: kung magpapatuli ang bawat lalaki sa atin, gaya nila.[a]'
  rationale: Inalis ang hindi kinakailangang “ito,” inayos ang ayos ng pangungusap para sa natural na Filipino, at ginawang “iisang bayan” upang malinaw ang ideya ng pagiging isang people. Ang “magpapatuli” ay karaniwang Filipino para sa kondisyong ang bawat lalaki ay sasailalim sa pagtutuli; ang alternatibong pasibong anyo ay ibinigay sa talababa upang ipakita ang anyo ng Hebreong infinitive. Pinalitan ang dating talababa ng alternatibong tuwirang sumasalamin sa pasibong pagkakabuo ng sugnay.
