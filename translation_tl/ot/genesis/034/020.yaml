    rationale: Ang וַ־ ay karaniwang pangsulong-salaysay na “at,” hindi kinakailangang nagpapahayag ng lohikal na resulta.
  - severity: low
    issue: Hindi natural ang “nagsalita sa mga lalaki ... na sinasabi.”
    rationale: Mas idiomatiko sa Filipino ang “kinausap nila ang ... at sinabi,” na pinananatili ang dalawang Hebreong pandiwa at ang pagpapakilala sa kasunod na pananalita.
