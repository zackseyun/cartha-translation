base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/020.yaml
  text: So Hamor and Shechem his son came to the gate of their city and spoke to the men of their city[a], saying[b],
translation:
  language: tl
  text: 'At pumunta sina Hamor at ang anak niyang si Shekem sa tarangkahan ng kanilang lungsod[a] at kinausap nila ang mga lalaki ng kanilang lungsod[b] at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “sa pintuang-bayan.” Literal sa Hebreo: “sa tarangkahan ng kanilang lungsod.”'
    reason: lexical_alternative
  - marker: b
    text: 'Literal sa Hebreo: “mga lalaki ng kanilang lungsod.” Malamang na tumutukoy ito sa mga lalaking mamamayan na nagtipon sa tarangkahan para sa pampublikong pagpapasiya.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: nagpunta
  rationale: Ang Qal wayyiqtol ng בוא ay maaaring mangahulugang ‘dumating’ o ‘pumunta’ ayon sa pananaw ng salaysay. Ang ‘nagpunta’ ay natural sa Filipino at hindi nagpapahiwatig na naroon ang tagapagsalaysay sa patutunguhan.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Pangngalang pantangi; tinumbasan sa pamamagitan ng transliterasyon.
- source_word: וּשְׁכֶם בְּנוֹ
  choice: at ang anak niyang si Shekem
  rationale: Malinaw at natural na ipinapahayag sa Filipino ang ugnayang ama-anak habang pinananatili ang pangalan.
- source_word: אֶל שַׁעַר עִירָם
  choice: sa tarangkahan ng kanilang lungsod
  rationale: Ang שַׁעַר ay literal na tarangkahan o pintuan ng lungsod. Pinananatili ng salin ang tahasang kaugnayan nito sa kanilang lungsod at ang sinaunang tagpuang pampubliko.
- source_word: וַיְדַבְּרוּ
  choice: at nagsalita
  rationale: Ang דבר na may אֶל ay nangangahulugang magsalita sa o humarap sa isang kausap. Ang ‘nagsalita’ ay angkop sa pormal at pampublikong tagpo.
- source_word: אֶל אַנְשֵׁי עִירָם
  choice: sa mga lalaki ng kanilang lungsod
  rationale: Ang אַנְשֵׁי ay literal na ‘mga lalaki ng.’ Sa konteksto ng pagpupulong sa tarangkahan, malamang na tumutukoy ito sa mga lalaking mamamayang kalahok sa pampublikong pagpapasiya, kaya hindi ito ginawang pangkalahatang ‘mga tao.’
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang karaniwang Hebreong pananda na nagpapakilala sa tuwirang pananalitang kasunod, kahit bahagyang pormal ang himig sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘tarangkahan’ upang malinaw na tumukoy sa pasukan ng napapaderang lungsod, at pinanatili ang bahagyang pormal na ‘na sinasabi’ dahil nagpapatuloy ang pangungusap sa susunod na talata.
