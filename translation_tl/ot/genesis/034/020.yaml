  source_fidelity: Ang “Kaya” ay nagpapahiwatig ng konklusyon o resulta na wala sa simpleng pang-ugnay na וַ־; mas tapat ang “At.” Wasto ang mga pangalan, ang “tarangkahan ng kanilang lungsod,” at ang tahasang “mga lalaki ng kanilang lungsod.” Ang pandiwang pangmaramihan ay mas malinaw na maipapakita sa “kinausap nila ... at sinabi.”
  naturalness: Hindi natural at medyo kalabisan ang “nagsalita sa ... , na sinasabi,” sa modernong Filipino. Ang “kinausap nila ... at sinabi” ay malinaw, marangal, at angkop sa pagpapatuloy ng tuwirang pananalita sa susunod na talata.
  terminology: Ang “tarangkahan” ay angkop para sa שַׁעַר sa konteksto ng lungsod. Pinanatili ang Hamor at Shekem, gayundin ang literal na kasariang “mga lalaki,” habang maingat na inilalahad ng talababa ang kontekstong sibiko bilang malamang na pakahulugan.
  issues:
