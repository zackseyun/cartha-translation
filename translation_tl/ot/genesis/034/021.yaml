  to: Ang mga lalaking ito ay kasundo natin[a]. Hayaan natin silang manirahan sa lupain at makipagkalakalan dito[b], sapagkat, tingnan ninyo[c], maluwang ang lupain para sa kanila[d]. Kukunin natin ang kanilang mga anak na babae bilang mga asawa natin, at ibibigay natin sa kanila ang ating mga anak na babae.
