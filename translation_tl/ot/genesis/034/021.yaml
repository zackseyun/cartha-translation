source:
  edition: WLC
  text: הָ/אֲנָשִׁ֨ים הָ/אֵ֜לֶּה שְֽׁלֵמִ֧ים הֵ֣ם אִתָּ֗/נוּ וְ/יֵשְׁב֤וּ בָ/אָ֨רֶץ֙ וְ/יִסְחֲר֣וּ אֹתָ֔/הּ וְ/הָ/אָ֛רֶץ הִנֵּ֥ה רַֽחֲבַת יָדַ֖יִם לִ/פְנֵי/הֶ֑ם אֶת בְּנֹתָ/ם֙ נִקַּֽח לָ֣/נוּ לְ/נָשִׁ֔ים וְ/אֶת בְּנֹתֵ֖י/נוּ נִתֵּ֥ן לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/021.yaml
  text: These men are at peace with us[a]. Let them dwell in the land and trade in it, for, you see, the land is broad enough for them. We will take their daughters for wives for ourselves[d][c][b], and we will give our daughters to them.
translation:
  language: tl
  text: Ang mga lalaking ito ay kasundo natin[a]. Hayaan natin silang manirahan sa lupain at makipagkalakalan dito[b], sapagkat, tingnan ninyo[c], maluwang ang lupain para sa kanila[d]. Kukunin natin ang kanilang mga anak na babae bilang mga asawa natin, at ibibigay natin sa kanila ang ating mga anak na babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapayapa ang pakikitungo nila sa atin” o “mabuti ang pakikitungo nila sa atin.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “makipagkalakalan sa pamamagitan nito” o “dumaan dito para makipagkalakalan”; maaaring tumukoy ang Hebreo sa pangangalakal sa loob ng lupain o sa paglalakbay na pangkalakalan sa teritoryo nito.
    reason: lexical_alternative
  - marker: c
    text: Ang Hebreong הִנֵּה ay panawag-pansin; maaari ring isaling “masdan ninyo” o ipahiwatig lamang sa daloy ng pangungusap.
    reason: lexical_alternative
  - marker: d
    text: Sa literal, “ang lupain—tingnan ninyo—ay maluwang ng mga kamay sa harap nila,” isang idyomang nangangahulugang malawak ang lupain at may sapat na puwang para sa kanila.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: mapayapa sa atin
  rationale: Ipinahihiwatig ng pang-uri ang mapayapang ugnayan o pagiging kasundo nila ng mga taga-lunsod. Pinananatili ng “mapayapa sa atin” ang relational na diwa nang hindi ipinapalagay na malapit silang magkaibigan.
- source_word: וְיֵשְׁבוּ
  choice: Hayaan natin silang manirahan
  rationale: 'Bagaman anyong imperfect ang pandiwa, gumaganap itong panawagan o mungkahi sa konteksto: hinihikayat ang mga mamamayan na pahintulutan silang tumira sa lupain.'
- source_word: וְיִסְחֲרוּ אֹתָהּ
  choice: makipagkalakalan dito
  rationale: Ang סחר ay tumutukoy sa gawaing pangkalakalan, at ang pambabaeng panghalip ay bumabalik sa lupain. Likas sa Filipino ang “makipagkalakalan dito,” habang kinikilala sa talababa ang posibleng diwang pagdaan sa lupain para sa kalakalan.
- source_word: הִנֵּה
  choice: tingnan ninyo
  rationale: Ginaganyak nito ang mga tagapakinig na pansinin ang kasunod na dahilan. Ang “tingnan ninyo” ay malinaw at kasalukuyang Filipino, na hindi gumagamit ng makalumang pahayag.
- source_word: רַחֲבַת יָדַיִם לִפְנֵיהֶם
  choice: maluwang ang lupain para sa kanila
  rationale: Ang literal na idyomang “maluwang ng mga kamay sa harap nila” ay nangangahulugang malawak o may sapat na puwang ang lupain. Inihahatid ng salin ang idyomatikong kahulugan sa natural na Filipino.
- source_word: נִקַּח לָנוּ לְנָשִׁים
  choice: Kukunin natin ... bilang mga asawa natin
  rationale: Ang imperfect ay nagpapahayag ng balak o mungkahi. Napananatili ng “bilang mga asawa natin” ang לָנוּ at ang Hebreong idyoma ng pagkuha ng babae bilang asawa.
- source_word: נִתֵּן לָהֶם
  choice: ibibigay natin sa kanila
  rationale: Kaagapay ito ng naunang sugnay at nagpapahayag ng katumbas na kasunduang pagpapakasal sa pagitan ng dalawang pangkat.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lupain” para sa הָאָרֶץ at ang inklusibong “Hayaan natin” upang likas na maipahayag ang panawagan sa mga mamamayan. Napanatili ang mapayapang ugnayan, komersiyal na gawain, at pagpapalitan sa pag-aasawa nang hindi dinaragdagan ang teksto ng motibong hindi tahasang sinasabi sa talata.
