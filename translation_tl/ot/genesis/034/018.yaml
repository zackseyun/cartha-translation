  yaml_path: translation/ot/genesis/034/018.yaml
  text: Their words seemed good to Hamor and to Shechem son of Hamor[a].
translation:
  language: tl
  text: Nagustuhan ni Hamor at ng anak niyang si Shekem ang mga sinabi nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Naging kalugod-lugod kay Hamor at sa anak niyang si Shekem ang mga sinabi nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטְבוּ
  choice: Nagustuhan
  rationale: Sa idyomang may בְּעֵינֵי, ipinapahayag ng יטב ang positibong pagtanggap o pagsang-ayon. Likas sa makabagong Tagalog ang “nagustuhan” at hindi nito ipinahihiwatig na talagang mabuti sa moral ang sinabi.
- source_word: דִבְרֵיהֶם
  choice: ang mga sinabi nila
  rationale: Tapat ito sa pangmaramihang anyo ng דָּבָר habang mas natural sa Tagalog kaysa sa literal na “kanilang mga salita”; hindi rin ito kasing-kitid ng interpretibong “kanilang panukala.”
- source_word: בְּעֵינֵי
  choice: ni … at ng
  rationale: Ang literal na “sa mga mata ni” ay isang idyoma ng pagtataya o pagsang-ayon. Isinasama ng Tagalog na kayarian ng “nagustuhan ni” ang kahulugan nito nang natural.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Transliterasyon ng pangalang pantangi ayon sa karaniwang baybay sa Filipino.
- source_word: שְׁכֶם
  choice: Shekem
  rationale: Transliterasyon ng pangalang pantangi na kumakatawan sa Hebreong שְׁכֶם at madaling basahin sa Filipino.
- source_word: בֶּן חֲמוֹר
  choice: ang anak niyang si Shekem
  rationale: Ipinananatili ang ugnayang ama-anak, ngunit gumagamit ng natural na ayos sa Tagalog. Malinaw sa pangungusap na si Hamor ang tinutukoy ng “niyang.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na “nagustuhan” para sa Hebreong idyoma, habang inilagay sa talababa ang mas pormal na alternatibo. Ang marker na [a] ay nasa pangunahing teksto.
