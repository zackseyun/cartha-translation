base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/003.yaml
  text: His soul clung to Dinah[a], the daughter of Jacob[b], and he loved the young woman and spoke to the heart of the young woman.
translation:
  language: tl
  text: Nabigkis ang kanyang kalooban kay Dina[a], na anak ni Jacob. Minahal niya ang dalaga at kinausap niya ang dalaga nang magiliw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Kumapit ang kanyang kaluluwa kay Dina.” Maaari ring isalin na “Mahigpit na naugnay ang kanyang kalooban kay Dina.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “nagsalita siya sa puso ng dalaga,” isang idyomang nangangahulugang magsalita nang magiliw, nakaaalo, o nakapagpapalakas-loob.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק נַפְשׁוֹ
  choice: Nabigkis ang kalooban niya
  rationale: Ang דבק ay tumutukoy sa mahigpit na pagkapit o pagkakaugnay, at ang נֶפֶשׁ dito ay ang panloob na sarili o kalooban. Pinananatili ng “nabigkis ang kalooban niya” ang matinding larawang Hebreo sa natural na Tagalog.
- source_word: בְּדִינָה
  choice: kay Dina
  rationale: Sa kayariang דבק + ב, ang natural na katumbas sa Tagalog ay ang pagkabigkis “kay” Dina.
- source_word: בַּת יַעֲקֹב
  choice: na anak ni Jacob
  rationale: Likas sa Tagalog ang pariralang panuring na ito at malinaw nitong pinananatili ang apposition ng Hebreo.
- source_word: וַיֶּאֱהַב
  choice: Minahal niya
  rationale: Ang אהב ay karaniwang pandiwa para sa pag-ibig. Hindi ito pinalitan ng “nagnasa” ni pinalabis bilang romantikong pag-ibig.
- source_word: הַנַּעֲרָ
  choice: ang dalaga
  rationale: Ang נַעֲרָה ay batang babae o kabataang babae; ang “dalaga” ay maikli, marangal, at karaniwang modernong salin sa kontekstong ito.
- source_word: וַיְדַבֵּר עַל לֵב הַנַּעֲרָ
  choice: kinausap ito nang buong lambing
  rationale: Ang literal na “nagsalita sa puso” ay isang Hebreong idyoma para sa magiliw, mapanuyo, o nakaaaliw na pananalita. Ang salin ay natural sa Tagalog habang inilalahad sa talababa ang literal na larawan.
theological_decisions:
- issue: Paglalarawan sa damdamin ni Shekem matapos ang karahasang isinalaysay sa nakapaligid na konteksto
  choice: Panatilihin ang tuwirang paglalarawan ng talata sa pagkabigkis ng kanyang kalooban, pag-ibig, at magiliw na pananalita.
  alternative: Magdagdag ng negatibong paghatol o gumamit ng mas romantikong pananalita sa mismong salin.
  rationale: Iniuulat ng Hebreo ang damdamin at pananalita ni Shekem nang hindi nito pinawawalang-sala ang naunang ginawa niya. Hindi dapat pagaanin ng salin ang karahasan o magdagdag ng paghatol na wala sa talatang ito.
translation_notes:
  register: Makabago at marangal na Tagalog na madaling maunawaan. Ang “kalooban” ay mas natural kaysa literal na “kaluluwa” para sa נֶפֶשׁ sa kontekstong emosyonal, samantalang ang literal na larawan ay pinanatili sa talababa. Hindi ginawang romantiko o mapagpaumanhin ang tono.
