  text: then we will give our daughters to you[a], and we will take your daughters for ourselves, and we will live with you and become one people.
translation:
  language: tl
  text: Kung gayon, ibibigay namin sa inyo ang aming mga anak na babae, at kukunin namin bilang mga asawa ang inyong mga anak na babae. Maninirahan kami kasama ninyo, at magiging iisang sambayanan tayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at magiging isang sambayanan tayo.” Literal sa Hebreo, “at magiging kami para sa isang bayan.” Maaaring ipahayag ng pandiwang “magiging” ang kalagayang darating o ang kalalabasang pagiging isang sambayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַנּוּ
  choice: kung gayon, ibibigay namin
  rationale: Ang Qal perfect na may waw ay may hinaharap na diwa bilang bunga ng naunang kondisyon sa kasunduang iminumungkahi; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “kung gayon.”
- source_word: בְּנֹתֵינוּ / בְּנֹתֵיכֶם
  choice: aming mga anak na babae / inyong mga anak na babae
  rationale: Pinananatili ang tahasang katawagang pampamilya at ang magkatugong ayos ng panukala.
- source_word: נִקַּח לָנוּ
  choice: kukunin naman namin para sa amin
  rationale: Pinananatili ng “kukunin” ang payak na kahulugan ng pandiwa; malinaw sa konteksto na pag-aasawa ang tinutukoy, kaya hindi na ito idinagdag sa pangunahing teksto. Ipinahahayag ng “naman” ang tugunang ayos, at ng “para sa amin” ang lakas ng לָנוּ.
- source_word: וְיָשַׁבְנוּ אִתְּכֶם
  choice: maninirahan kaming kasama ninyo
  rationale: Ang “maninirahan” ay likas at makabagong katumbas ng ישׁב sa konteksto ng permanenteng pakikipamayan.
- source_word: וְהָיִינוּ לְעַם אֶחָד
  choice: at magiging iisang sambayanan tayo
  rationale: Ang “magiging” ay nagpapanatili sa maaaring diwa ng kalagayang darating o kalalabasan, samantalang ang “iisang sambayanan” ay tumutukoy sa nagkakaisang pangkat ng mga tao, hindi lamang sa isang makabagong estadong politikal. Ang inklusibong “tayo” ay natural na ipinahahayag ang pagsasama ng nagsasalita at ng kausap.
theological_decisions:
- issue: Kung ang וְהָיִינוּ ay nangangahulugang “magiging” bilang kalalabasan o “magiging/naroroon bilang” isang kalagayan sa hinaharap
  choice: magiging iisang sambayanan tayo
  alternative: tayo ay magiging isang sambayanan
  rationale: Kayang panatilihin ng Tagalog na “magiging” ang dalawang malapit na diwa nang hindi sapilitang pinipili ang isa; inililinaw sa talababa ang tunay na kalabuan ng Hebreo.
translation_notes:
  register: Makabago at marangal na Filipino; ginamit ang “sambayanan” upang malinaw na tumukoy sa isang pangkat ng mga tao at maiwasan ang pangunahing heograpiko o politikal na dating ng “bayan.”
