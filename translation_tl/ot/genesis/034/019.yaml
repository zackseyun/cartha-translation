base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/019.yaml
  text: And the young man did not delay to do the thing[a], because he delighted in Jacob’s daughter[d][c][b], and he was honored above all his father’s house.
translation:
  language: tl
  text: At hindi nagpaliban ang binata na gawin iyon[a], sapagkat kinalugdan niya ang anak na babae ni Jacob[b], at siya ang pinakaginagalang sa buong sambahayan ng kanyang ama[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi nag-atubiling gawin iyon.”
    reason: lexical_alternative
  - marker: b
    text: O “ninanais niya ang anak na babae ni Jacob” o “labis niyang nagustuhan ang anak na babae ni Jacob.”
    reason: lexical_alternative
  - marker: c
    text: O “higit siyang iginagalang kaysa sa sinuman sa sambahayan ng kanyang ama.”
    reason: grammatical_alternative
lexical_decisions:
- source_word: אֵחַר
  choice: hindi nagpaliban
  rationale: Pangunahing ipinahihiwatig ng pandiwa ang hindi pagkaantala o pagpapaliban. Ang “hindi nagpaliban” ay natural sa Filipino at pinananatili ang temporal na diwa ng mabilis na pagkilos.
- source_word: הַנַּעַר
  choice: ang binata
  rationale: Tumutukoy ito kay Shekem bilang isang kabataang lalaki. Ang “binata” ay maikli, natural, at angkop sa salaysay.
- source_word: לַעֲשׂוֹת הַדָּבָר
  choice: na gawin iyon
  rationale: Ang parirala ay tumutukoy pabalik sa hinihinging gawain sa naunang konteksto. Mas natural sa modernong Filipino ang “gawin iyon” kaysa sa literal na “gawin ang bagay.”
- source_word: חָפֵץ
  choice: kinalugdan
  rationale: Saklaw ng pandiwa ang matinding pagkagusto, pagkalugod, o pagnanasa. Pinananatili ng “kinalugdan” ang positibong damdamin nang hindi nililimitahan ito sa seksuwal na pagnanasa.
- source_word: בְּבַת יַעֲקֹב
  choice: niya ang anak na babae ni Jacob
  rationale: Sa Filipino, likas na tuwirang layon ng “kinalugdan” ang taong tinutukoy; malinaw ring pinananatili ng “anak na babae ni Jacob” ang pagkakakilanlan sa Hebreo.
- source_word: נִכְבָּד
  choice: pinakaginagalang
  rationale: Ang Niphal participle ay nagpapahayag ng pagiging marangal, iginagalang, o mataas ang katayuan. Ang “pinakaginagalang” ay malinaw at natural sa konteksto ng sambahayan.
- source_word: מִכֹּל בֵּית אָבִיו
  choice: sa buong sambahayan ng kanyang ama
  rationale: Ang konstruksyong may מִכֹּל ay maaaring ihayag bilang superlatibo. Ang “sa buong sambahayan ng kanyang ama” ay tumutukoy sa lahat ng kabilang sa sambahayan o angkan ng ama niya.
theological_decisions:
- issue: Lakas at uri ng damdamin ni Shekem kay Dina
  choice: kinalugdan
  alternative: ninanais / labis na nagustuhan
  rationale: Hindi tahasang nilulutas ng salin kung ang חָפֵץ ay pangunahing romantiko, seksuwal, o pangkalahatang matinding pagkagusto; inilalagay sa talababa ang leksikal na saklaw.
- issue: Paghahambing ng katayuan sa sambahayan
  choice: pinakaginagalang sa buong sambahayan
  alternative: higit na iginagalang kaysa sa sinuman sa sambahayan
  rationale: Ang superlatibo at komparatibong anyo ay magkatumbas na paraan ng pagpapahayag sa kontekstong ito. Ginamit sa teksto ang mas natural na superlatibo, habang pinanatili sa talababa ang mas pormal na komparatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “binata,” “nagpaliban,” at “sambahayan” bilang mga salitang madaling maunawaan ngunit angkop sa salaysay ng Kasulatan. Iniwasan ang sobrang literal na “gawin ang bagay” at ang pagpapakahulugang nagdaragdag ng pag-aasawa o eksklusibong seksuwal na pagnanasa.
