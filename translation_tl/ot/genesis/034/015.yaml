  yaml_path: translation/ot/genesis/034/015.yaml
  text: 'Only on this condition will we agree with you: if you become like us[b][a], by circumcising every male among you.'
translation:
  language: tl
  text: 'Sa ganitong kundisyon lamang kami makikipagkasundo sa inyo: kung magiging katulad namin kayo sa pamamagitan ng pagpapatuli ng bawat lalaking kabilang sa inyo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung magpapatuli ang bawat lalaking kabilang sa inyo.”
    reason: Ipinapakita nang mas tuwiran ang kondisyon at ang Niphal na diwang ang bawat lalaki ang magpapasailalim sa pagtutuli.
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: Sa ganitong kondisyon lamang
  rationale: Pinagsamang idyomatikong salin na malinaw na naghahayag ng tanging kondisyong hinihingi; pinananatili ng “lamang” ang restriktibong lakas ng אַךְ.
- source_word: נֵאוֹת לָכֶם
  choice: kami papayag sa inyo
  rationale: Ang Niphal ng אוה ay tumutukoy sa pagpayag o pagsang-ayon. Likas sa Filipino ang “papayag sa inyo” sa konteksto ng pakikipagkasundo.
- source_word: אִם תִּהְיוּ כָמֹנוּ
  choice: kung magiging tulad namin kayo
  rationale: Ipinapakita ng kondisyunal na sugnay ang pagpasok sa isang kalagayan o gawain, kaya ang “magiging” ay mas angkop kaysa sa simpleng “kayo ay.”
- source_word: לְהִמֹּל לָכֶם כָּל זָכָר
  choice: sa pamamagitan ng pagtutuli sa bawat lalaki sa inyo
  rationale: Ang infinitive ay nagpapaliwanag kung paano sila magiging tulad ng mga nagsasalita. Ang “bawat lalaki sa inyo” ay nagpapanatili sa distributibong diwa ng כָּל זָכָר at sa kaugnayan ng לָכֶם sa kanilang pangkat.
