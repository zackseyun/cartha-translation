  text: And Shechem said to Hamor his father, “Get me this girl as a wife.”
translation:
  language: tl
  text: Sinabi ni Shekem sa kanyang amang si Hamor, “Kunin mo para sa akin ang dalagang ito upang maging asawa ko.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח־לִי
  choice: Kunin mo para sa akin
  rationale: Pinananatili ang tuwirang utos na literal na ‘kunin mo para sa akin,’ na sa konteksto ay paghiling sa ama na ayusin ang pag-aasawa.
- source_word: הַיַּלְדָּה הַזֹּאת
  choice: ang dalagang ito
  rationale: Bagaman maaaring mangahulugang ‘batang babae’ ang יַלְדָּה, mas natural at angkop sa konteksto ng pag-aasawa ang ‘dalaga,’ nang hindi nagdaragdag ng tiyak na edad.
- source_word: לְאִשָּׁה
  choice: upang maging asawa ko
  rationale: Likas na Tagalog para sa layuning ‘bilang asawa’; nililinaw ng ‘ko’ ang relasyong hinihingi ni Shekem, na nakapaloob sa לִי.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Hindi pinalambot ang mapang-angking tono ng utos ni Shekem, ngunit ginawang likas sa Tagalog ang pangungusap.
