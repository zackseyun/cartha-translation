base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/023.yaml
  text: Will not their livestock[a], their property, and all their animals be ours? Only let us agree with them[b], and they will dwell with us.
translation:
  language: tl
  text: Hindi ba mapapasaatin ang kanilang mga kawan, mga ari-arian, at lahat ng kanilang hayop? Pumayag lamang tayo sa kanila[a], at maninirahan sila kasama natin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sumang-ayon lamang tayo sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵהֶם
  choice: kanilang mga kawan
  rationale: Ang מִקְנֶה ay tumutukoy sa mga alagang hayop na itinuturing na yaman; malinaw at likas sa konteksto ang “mga kawan,” at naiiwasan nito ang pag-uulit sa mas malawak na “lahat ng kanilang hayop.”
- source_word: קִנְיָנָם
  choice: mga ari-arian
  rationale: Ang קִנְיָן ay mga bagay o yamang pag-aari. Pinananatili ng “mga ari-arian” ang malawak na diwang pangkabuhayan nang hindi nililimitahan sa isang uri ng pag-aari.
- source_word: כָל בְּהֶמְתָּם
  choice: lahat ng kanilang hayop
  rationale: Malawak ang saklaw ng בְּהֵמָה, lalo na sa mga domestikadong hayop. Ang “lahat ng kanilang hayop” ay nagpapanatili sa diin ng כָל at sa pagkakaiba nito sa “mga kawan.”
- source_word: הֲלוֹא לָנוּ הֵם
  choice: Hindi ba mapapasaatin
  rationale: Ang הֲלוֹא ay nagpapakilala ng retorikal na tanong na umaasang sasang-ayon ang kausap. Ipinahahayag ng “mapapasaatin” ang inaasahang pag-angkin sa hinaharap sa natural na Filipino.
- source_word: אַךְ
  choice: lamang
  rationale: Dito, ang אַךְ ay nagtatakda ng tanging kondisyon sa panukala; malinaw itong naipahahayag ng “lamang.”
- source_word: נֵאֹותָה
  choice: Pumayag ... tayo sa kanila
  rationale: Ang anyo mula sa אוה ay nangangahulugang maging handa, pumayag, o sumang-ayon. Ang “pumayag tayo sa kanila” ay natural at pinananatili ang ideya ng pagsang-ayon sa kanilang hinihingi.
- source_word: וְיֵשְׁבוּ אִתָּנוּ
  choice: at maninirahan sila kasama natin
  rationale: Ang יָשַׁב ay maaaring mangahulugang manirahan o mamalagi. Ang “maninirahan ... kasama natin” ay malinaw na nagpapahayag ng patuloy na paninirahang magkasama.
