  source_fidelity: Tapat ang salin sa Hebreo. Ang “Nabalitaan” ay likas na pagsasalin ng שָׁמַע sa kontekstong pagtanggap ng balita; ang “dinungisan” ay pinananatili ang leksikal at panlipunang bigat ng טִמֵּא nang hindi higit na tinutukoy ang uri ng ginawa. Ang tahasang pagbanggit kay Shekem ay suportado ng agarang konteksto at nililinaw ang di-inuulit na simuno. Naipapahayag din nang tumpak na ang mga anak ni Jacob ay kasama ng kanyang mga hayop sa bukid at na nanahimik siya hanggang sa pagdating nila.
  naturalness: Malinaw, makabago, at marangal ang Filipino. Ang daloy mula sa balita, sa kawalan ng mga anak, hanggang sa pananahimik ni Jacob ay natural. Ang “mga anak niyang lalaki” ay malinaw at ang “mga alagang hayop” ay karaniwang gamit para sa malawak na saklaw ng מִקְנֶה.
  terminology: 'Ang “dinungisan” at ang talababa nito ay angkop na magkasama: nananatili sa pangunahing teksto ang metapora ng Hebreo, samantalang maingat na ipinaliliwanag ng talababa ang seksuwal na konteksto. Hindi ipinipilit ng salin ang mas tiyak na paglalarawan kaysa sa pandiwang Hebreo.'
