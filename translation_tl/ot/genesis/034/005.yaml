  text: וְ/יַעֲקֹ֣ב שָׁמַ֗ע כִּ֤י טִמֵּא֙ אֶת דִּינָ֣ה בִתּ֔/וֹ וּ/בָנָ֛י/ו הָי֥וּ אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶ֑ה וְ/הֶחֱרִ֥שׁ יַעֲקֹ֖ב עַד בֹּאָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/005.yaml
  text: Jacob heard that he had defiled his daughter Dinah. But his sons were with his livestock in the field[a], so Jacob kept silent until they came.
translation:
  language: tl
  text: Nabalitaan ni Jacob na dinungisan ni Shekem ang anak niyang si Dina.[a] Nasa bukid noon ang mga anak niyang lalaki kasama ng kanyang mga alagang hayop, kaya nanahimik si Jacob hanggang sa dumating sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nilapastangan ang anak niyang si Dina.” Ang pandiwang Hebreo ay literal na nangangahulugang “dinungisan” o “ginawang marumi”; sa kontekstong ito, tumutukoy ito sa seksuwal na paglapastangan kay Dina.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: Nabalitaan
  rationale: Sa kontekstong pasalaysay, tumutukoy ito sa pagtanggap ni Jacob ng balita; mas natural sa Filipino kaysa sa literal na “narinig.”
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng balitang natanggap ni Jacob.
- source_word: טִמֵּא
  choice: dinungisan
  rationale: Pinananatili nito ang pangunahing diwa ng piel na “dungisan/gawing marumi” at ang moral at panlipunang bigat nito sa konteksto, nang hindi ginagawang mas tiyak kaysa sa mismong pandiwang Hebreo.
- source_word: בִתּוֹ
  choice: ang anak niyang si Dina
  rationale: Natural na Filipino para sa “his daughter Dinah”; malinaw ang kaugnayan kay Jacob.
- source_word: וּבָנָיו
  choice: Nasa bukid noon ang mga anak niyang lalaki
  rationale: Ang waw ay nag-uugnay sa kalagayang nagpapaliwanag sa pananahimik ni Jacob. Ang ayos na ito ay natural sa Filipino at nililinaw na mga anak na lalaki ang tinutukoy.
- source_word: הָיוּ אֶת מִקְנֵהוּ בַּשָּׂדֶה
  choice: Nasa bukid noon ... kasama ng kanyang mga alagang hayop
  rationale: Pinananatili ang tahasang sinabi ng Hebreo tungkol sa kanilang kinaroroonan kasama ng mga hayop, nang hindi idinaragdag na sila ay nagpapastol.
- source_word: מִקְנֵהוּ
  choice: kanyang mga alagang hayop
  rationale: Malawak at karaniwang katumbas sa Filipino para sa mga hayop na pag-aari; hindi nililimitahan sa baka lamang.
- source_word: וְהֶחֱרִשׁ
  choice: kaya nanahimik
  rationale: Ipinahihiwatig ng hiphil ang pagpipigil na magsalita o tumugon; natural itong ipinapahayag ng “nanahimik.”
- source_word: עַד בֹּאָם
  choice: hanggang sa dumating sila
  rationale: Tuwirang salin ng “hanggang sa kanilang pagdating”; hindi idinaragdag ang ideyang “bumalik,” na hindi tahasang nasa Hebreo.
theological_decisions:
- issue: Pagkilala sa di-tahasang simuno ng טִמֵּא
  choice: Tinukoy si Shekem sa pangunahing teksto
  alternative: Gamitin ang “dinungisan ang anak niyang si Dina” na walang tahasang simuno
  rationale: Ang simuno ay hindi inuulit sa talata ngunit malinaw na si Shekem mula sa naunang konteksto. Ang pagbanggit sa pangalan ay kailangan para maging likas at hindi malabo sa Filipino, nang walang idinadagdag na interpretasyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dinungisan” upang mapanatili ang metapora at bigat ng Hebreo, habang ipinaliliwanag sa talababa ang seksuwal na diwa sa konteksto. Iniwasang sabihing “nagpapastol” ang mga anak dahil lokasyon at pagsama sa mga hayop lamang ang tahasang sinasabi ng teksto.
