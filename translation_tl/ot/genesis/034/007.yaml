revisions:
- from: Nang mabalitaan iyon ng mga anak ni Jacob, umuwi sila mula sa bukid. Labis silang nasaktan at nagalit, sapagkat gumawa si Shekem ng isang karumal-dumal na bagay sa Israel sa pakikipagtalik sa anak na babae ni Jacob—isang bagay na hindi dapat gawin.
  to: Nang marinig nila ito, dumating ang mga anak ni Jacob mula sa bukid. Labis silang nasaktan at nagalit, sapagkat ang pakikipagtalik ni Shekem sa anak na babae ni Jacob ay isang kahindik-hindik na bagay sa Israel. Hindi dapat gawin ang ganitong bagay.
  rationale: Inalis ang dagdag na kahulugang “umuwi” at inayos ang huling dalawang sugnay upang maging mas tapat sa sintaks at diin ng Hebreo. Ang pagtukoy kay Shekem ay paglilinaw lamang sa malinaw na antecedent ng “siya” mula sa agarang konteksto at hindi nagdaragdag ng interpretasyon. Pinanatili ang hindi nilinaw na “sa Israel.”
