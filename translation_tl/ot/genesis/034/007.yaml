review_pass:
  verdict: revise
  source_fidelity: 'Kailangang alisin ang “umuwi,” dahil ang Hebreo ay nagsasabing dumating ang mga anak ni Jacob mula sa bukid ngunit hindi tinutukoy na umuwi sila. Ang binagong ayos ay pinananatili ang pagkakasunod: pagdating mula sa bukid nang marinig nila ang balita, pagdadalamhati at matinding galit, at ang dahilan nito. Ang “sa Israel” ay sinadyang hindi nilinaw upang mapanatili ang saklaw ng Hebreo.'
  naturalness: Mas natural at malinaw ang “Dumating ... mula sa bukid” kaysa “umuwi sila mula sa bukid.” Ang paghahati ng huling pahayag sa dalawang pangungusap ay malinaw na naghahatid ng normatibong pangwakas na pahayag nang hindi ginagawang malabong apposition ang “isang bagay na hindi dapat gawin.”
  terminology: 'Ang “kahindik-hindik na bagay” ay angkop na modernong katumbas ng נְבָלָה sa kontekstong ito: isang lantad na kahiya-hiya at moral na paglabag. Hindi nito idinadagdag ang partikular na legal o denominasyonal na pagpapakahulugan. Pinanatili ang “pakikipagtalik” bilang tahasan ngunit marangal na pagpapahayag ng idyomang “humiga kasama.”'
  issues:
  - severity: medium
    issue: Ang “umuwi” ay nagdaragdag ng hindi hayag na destinasyon.
    rationale: Sinasabi lamang ng מקור na dumating ang mga anak ni Jacob mula sa bukid; hindi nito tahasang sinasabing nakauwi sila.
  - severity: low
    issue: Ang pangwakas na sugnay ay nakakabit bilang apposition sa naunang pangungusap.
    rationale: 'Mas malinaw na isalin ang וְכֵן לֹא יֵעָשֶׂה bilang hiwalay na pangkalahatang pahayag: “Hindi dapat gawin ang ganitong bagay.”'
  revised_text: Nang marinig nila ito, dumating ang mga anak ni Jacob mula sa bukid. Labis silang nasaktan at nagalit, sapagkat ang pakikipagtalik ni Shekem sa anak na babae ni Jacob ay isang kahindik-hindik na bagay sa Israel. Hindi dapat gawin ang ganitong bagay.
