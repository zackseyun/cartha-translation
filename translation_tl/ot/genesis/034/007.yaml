base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/007.yaml
  text: And Jacob’s sons came in from the field when they heard it, and the men were grieved and very angry, because he had done an outrageous thing in Israel by lying with Jacob’s daughter, for such a thing must not be done.
translation:
  language: tl
  text: Nang marinig nila ito, dumating ang mga anak ni Jacob mula sa bukid. Labis silang nasaktan at nagalit, sapagkat ang pakikipagtalik ni Shekem sa anak na babae ni Jacob ay isang kahindik-hindik na bagay sa Israel. Hindi dapat gawin ang ganitong bagay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְעַצְּבוּ
  choice: nasaktan
  rationale: Ipinahahayag ng pandiwa ang matinding sama ng loob o dalamhati; natural sa modernong Tagalog ang “nasaktan” sa kontekstong ito.
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: labis ... nagalit
  rationale: Pinananatili ang tindi ng idyomang Hebreo sa malinaw at likas na Tagalog.
- source_word: נְבָלָה
  choice: isang karumal-dumal na bagay
  rationale: Tumutukoy ito sa kahiya-hiya at moral na kasuklam-suklam na gawa, hindi lamang sa simpleng kahihiyan o kamangmangan.
- source_word: לִשְׁכַּב אֶת
  choice: sa pakikipagtalik sa
  rationale: Ang idyomang literal na “humiga kasama” ay tumutukoy sa seksuwal na pakikipagtalik; tahasan ngunit marangal ang salin.
- source_word: וְכֵן לֹא יֵעָשֶׂה
  choice: isang bagay na hindi dapat gawin
  rationale: Pinananatili ang impersonal at normatibong diin ng Hebreo nang hindi labis na pinatitindi bilang tahasang batas.
theological_decisions:
- issue: Ang pariralang “sa Israel” bago pa gamitin ang Israel bilang pangalan ng bansa
  choice: Pinanatili ang “sa Israel”
  alternative: “sa sambahayan ni Israel” o “sa bayan ng Israel”
  rationale: Ang Hebreo ay sadyang maikli at maaaring tumukoy kay Jacob/Israel at sa umuusbong na sambayanan; hindi nilutas ng salin ang posibleng anachronistic o kolektibong himig.
- issue: Ang moral na puwersa ng pangwakas na pahayag
  choice: “hindi dapat gawin”
  alternative: “hinding-hindi maaaring gawin”
  rationale: Sapat itong nagpapahayag ng matibay na pagbabawal habang iniiwasang magdagdag ng modal na tindi na hindi tahasang minarkahan sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Shekem” upang linawin ang di-tahasang paksa ng pandiwa mula sa naunang konteksto; walang idinagdag na denominasyonal na interpretasyon.
