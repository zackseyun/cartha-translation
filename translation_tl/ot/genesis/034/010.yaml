  - severity: low
    issue: Bahagyang hindi likas ang ayos na “Manirahan kayo kasama namin.”
    rationale: Mas karaniwan at marangal sa modernong Filipino ang “Manirahan kayo sa piling namin,” nang hindi binabago ang kahulugang “with us.”
