base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/010.yaml
  text: You may dwell with us[a], and the land will be before you. Settle in it, trade in it[b], and acquire property in it.
translation:
  language: tl
  text: “Manirahan kayo sa piling namin, at ang lupain ay magiging bukás sa inyo.[a] Tumira kayo rito, mangalakal kayo rito, at magkaroon kayo ng ari-arian dito.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at ang lupain ay magiging nasa harap ninyo”; maaari ring unawain na “at ang lupain ay magagamit ninyo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “magkaroon kayo rito ng lupang pag-aari” o “magkaroon kayo rito ng sariling pag-aari.” Tumutukoy ang Hebreo sa pagkakaroon ng pag-aari o karapatan sa lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתָּנוּ תֵּשֵׁבוּ
  choice: Manirahan kayo kasama namin
  rationale: Ang יָשַׁב ay maaaring mangahulugang ‘manirahan,’ ‘tumira,’ o ‘manatili.’ Ang anyong ito ay paanyaya sa konteksto, kaya likas sa Tagalog ang ‘Manirahan kayo kasama namin.’
- source_word: וְהָאָרֶץ תִּהְיֶה לִפְנֵיכֶם
  choice: at ang lupain ay nasa harap ninyo
  rationale: Pinananatili nito ang konkretong idyomang Hebreo na ‘ang lupain ay magiging/nasa harap ninyo,’ habang ipinahihiwatig ng konteksto na malaya nilang magagamit o matitirhan ang lupain.
- source_word: שְׁבוּ
  choice: Tumira kayo rito
  rationale: Ang pautos mula sa יָשַׁב ay tumutukoy sa paninirahan sa lupain. Ginamit ang ‘rito’ upang malinaw na iugnay ito sa nabanggit na lupain.
- source_word: וּסְחָרוּהָ
  choice: mangalakal kayo rito
  rationale: Ang סחר ay tumutukoy sa pangangalakal o gawaing pangkomersiyo. Ang ‘mangalakal’ ay maikli, natural, at tiyak ang diwa.
- source_word: וְהֵאָחֲזוּ בָּהּ
  choice: at magkaroon kayo ng ari-arian dito
  rationale: Ang Niphal ng אָחַז sa kontekstong ito ay malamang na tumutukoy sa pagkakaroon ng hawak na lupain o karapatang magmay-ari, hindi lamang sa pisikal na paghawak.
