base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/002.yaml
  text: When Shechem son of Hamor the Hivite[a], the prince of the land, saw her[b], he took her and lay with her and humiliated her.
translation:
  language: tl
  text: Nang makita siya ni Shekem, na anak ni Hamor na Hivita at pinuno ng lupain, kinuha niya siya, sinipingan, at nilapastangan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinamak” o, batay sa puwersa ng buong pangungusap, “ginahasa.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagpapahirap, paghamak, o paglapastangan; sa kontekstong ito, tumutukoy ito sa seksuwal na paglabag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita siya
  rationale: Karaniwang salaysay na kahulugan ng ראה; natural sa modernong Tagalog ang temporal na ugnayan sa kasunod na mga kilos.
- source_word: שְׁכֶם בֶּן־חֲמוֹר הַחִוִּי
  choice: ni Shekem na anak ni Hamor na Hivita
  rationale: Ginamit ang karaniwang anyong Tagalog ng mga pangalan at ang etnikong katawagang “Hivita”; ang “na Hivita” ay pinakamalamang na tumutukoy kay Hamor ayon sa pinakamalapit na pangngalan, bagaman maaaring maunawaan ang katawagan bilang pagkakakilanlan ng angkan.
- source_word: נְשִׂיא הָאָרֶץ
  choice: ang pinuno ng lupaing iyon
  rationale: Ang נָשִׂיא ay lider, pinuno, o prinsipe. Hindi labis na tinutukoy ng “pinuno” ang uri ng pamamahala, at nililinaw ng “lupaing iyon” ang tinutukoy na rehiyon.
- source_word: וַיִּקַּח אֹתָהּ
  choice: kinuha siya nito
  rationale: Pinananatili ang payak na kahulugan ng לקח at ang sunod-sunod na kilos sa Hebreo; ipinahihiwatig ng “nito” na si Shekem ang gumagawa nang hindi paulit-ulit ang pangalan.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: sinipingan
  rationale: Ang “sinipingan” ay isang marangal ngunit malinaw na idyomang Tagalog para sa pakikipagtalik, at mas angkop sa bigat ng konteksto kaysa sa kolokyal na “sipingan.”
- source_word: וַיְעַנֶּהָ
  choice: nilapastangan
  rationale: Sa piel, ang ענה ay maaaring mangahulugang magpahirap, humamak, o lumabag. Sa kontekstong seksuwal, ipinahahayag ng “nilapastangan” ang marahas at kahiya-hiyang paglabag nang hindi ikinukulong ang salita sa iisang posibleng gloss.
theological_decisions:
- issue: Malinaw ngunit hindi labis na interpretatibong paglalarawan sa seksuwal na karahasan
  choice: “kinuha siya nito, sinipingan, at nilapastangan”
  alternative: “sinunggaban siya nito at ginahasa” / “kinuha siya nito, sinipingan, at hinamak”
  rationale: Pinananatili ng salin ang tatlong magkakasunod na pandiwa sa Hebreo at hindi pinapalambot ang pangwakas na pagtatasa. Ang “ginahasa” ay malinaw na kontekstuwal na pagbasa ngunit mas tiyak kaysa sa leksikal na saklaw ng pangwakas na pandiwa lamang; ang “hinamak” naman ay maaaring hindi sapat na magpahayag ng seksuwal na paglabag.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “sinipingan” at “nilapastangan” upang maging malinaw ang seksuwal na paglabag nang hindi kolokyal o labis na eksplisito. Ang panghalip na “nito” ay nagpapalinaw sa gumagawa ng kilos.
