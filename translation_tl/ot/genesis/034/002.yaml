  terminology: Ang “Hivita,” “pinuno,” “sinipingan,” at “nilapastangan” ay angkop. Ang “nilapastangan” ay wastong pangwakas na salin para sa ענה sa kontekstong ito; ang talababa ay dapat magpaliwanag ng saklaw nito at kilalanin ang mas tahasang kontekstuwal na saling “ginahasa.”
