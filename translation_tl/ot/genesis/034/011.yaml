  text: Then Shechem said to her father and to her brothers[a], “Let me find favor in your eyes, and whatever you say to me[b], I will give.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Shekem sa kanyang ama at sa kanyang mga kapatid na lalaki, “Nawa’y kalugdan ninyo ako,[a] at ibibigay ko ang anumang sabihin ninyo sa akin.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Makasumpong sana ako ng lingap sa inyong mga mata.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “anumang hingin ninyo sa akin ay ibibigay ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos” habang pinananatili ang pagkakasunod-sunod ng pangyayari.
- source_word: שְׁכֶם
  choice: Shekem
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa baybay na madaling bigkasin sa Tagalog.
- source_word: אֶל אָבִיהָ וְאֶל אַחֶיהָ
  choice: sa ama ng babae at sa mga kapatid nitong lalaki
  rationale: Nililinaw ng parirala ang mga pambabaeng hulapi na tumutukoy sa babaeng binanggit sa konteksto, at ipinakikita ng “lalaki” na panlalaking maramihan ang אַחֶיהָ.
- source_word: אֶמְצָא חֵן בְּעֵינֵיכֶם
  choice: Nawa’y kalugdan ninyo ako
  rationale: Natural na Tagalog ito para sa idyomang humihiling ng pagtanggap o mabuting pagtingin, nang hindi binibigyan ng natatanging teolohikal na diwa ang חֵן.
- source_word: וַאֲשֶׁר
  choice: at ... ang anumang
  rationale: Pinananatili ng “at” ang pang-ugnay, at ipinahahayag ng “anumang” ang bukás at di-tiyak na saklaw ng sugnay.
- source_word: תֹּאמְרוּ אֵלַי
  choice: sabihin ninyo sa akin
  rationale: Ito ang tuwirang kahulugan ng אָמַר na may אֶל; hindi ginawang “hingin ninyo sa akin” sa pangunahing teksto dahil iyon ay pagpapakahulugang batay sa konteksto.
- source_word: אֶתֵּן
  choice: ibibigay ko
  rationale: Pinananatili ang payak at malawak na kahulugan ng נָתַן na “magbigay”; ang “babayaran ko” ay labis na magpapakitid sa kahulugan.
