  text: Seth lived 105 years and fathered Enosh[a].
translation:
  language: tl
  text: Nang si Set ay 105 taong gulang na, naging ama siya ni Enos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Nang … taong gulang na
  rationale: Sa pormulang pangangkanan, ipinahahayag ng חיה ang edad na inabot bago ang kasunod na pangyayari; natural itong isinasalin sa modernong Tagalog bilang sugnay ng edad.
- source_word: שֵׁת
  choice: Set
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Tagalog.
- source_word: חָמֵשׁ שָׁנִים וּמְאַת שָׁנָה
  choice: 105 taong gulang
  rationale: Ang literal na ayos na 'limang taon at isang daang taon' ay karaniwang Hebreong pagpapahayag para sa 105; malinaw at eksakto ang numerong anyo sa modernong Tagalog.
- source_word: וַיּוֹלֶד
  choice: naging anak niya
  rationale: Sa talaangkanan, tumutukoy ang ילד sa pag-aanak o pagiging ama. Ang pariralang ito ay natural at malinaw sa Tagalog, samantalang inilalahad sa talababa ang mas pormal na alternatibo.
- source_word: אֶת אֱנוֹשׁ
  choice: si Enos
  rationale: Hindi hiwalay na isinasalin ang panandang layon na אֶת. Ginamit ang nakaugaliang anyong Tagalog na Enos para sa Hebreong אֱנוֹשׁ.
