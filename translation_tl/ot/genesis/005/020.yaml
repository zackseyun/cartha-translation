  text: So all the days of Yered were nine hundred and sixty-two years[a], and he died.
translation:
  language: tl
  text: Kaya ang lahat ng araw ni Yered[a] ay siyam na raan at animnapu't dalawang taon; at namatay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Yered; nakaugaliang isalin bilang “Jared” sa maraming salin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Kaya ... ay
  rationale: Ipinahahayag ng wayyiqtol ng היה ang pangwakas na buod sa talaangkanan. Natural na naihahatid ng “Kaya” ang pagsulong tungo sa kabuuang bilang ng kanyang mga araw.
- source_word: כָּל יְמֵי
  choice: ang lahat ng araw ni
  rationale: Pinananatili nito ang karaniwang Hebreong idyoma sa talaangkanan para sa buong haba ng buhay, sa paraang malinaw pa rin sa modernong Tagalog.
- source_word: יֶרֶד
  choice: Yered
  rationale: Tuwirang sinasalamin ng transliterasyong “Yered” ang anyong Hebreo ng pangalan; inilalagay sa talababa ang nakaugaliang anyong “Jared.”
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: siyam na raan at animnapu't dalawang taon
  rationale: Isinaayos ang mga bilang ayon sa likas na pagkakasunod sa modernong Tagalog at pinagsama ang dalawang pariralang Hebreo bilang isang malinaw na kabuuang edad.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: Payak na pinananatili ang nakagawiang pangwakas na pormula sa Genesis 5; natural sa Tagalog ang tahasang panghalip pagkatapos ng pandiwa.
