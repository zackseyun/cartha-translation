  yaml_path: translation/ot/genesis/005/016.yaml
  text: After he fathered Jared, Mahalalel lived eight hundred and thirty years and fathered sons and daughters.
translation:
  language: tl
  text: Pagkatapos niyang maging ama ni Jared, nabuhay si Mahalalel nang walong daan at tatlumpung taon at naging ama ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: nabuhay
  rationale: Sa pormula ng talaangkanan, tumutukoy ito sa ipinagpatuloy na buhay ni Mahalalel pagkaraang ipanganak ang pinangalanang anak.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Ginamit ang karaniwang anyo ng pangalang pantangi sa mga saling Filipino.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־יֶרֶד
  choice: Matapos niyang maging ama ni Jared
  rationale: Pinananatili nito ang temporal na ugnayan at ang Hiphil ng ילד, na tumutukoy sa pagiging ama o pag-aanak ng lalaking simuno, sa natural na modernong Filipino.
- source_word: שְׁלֹשִׁים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: walong daan at tatlumpung taon
  rationale: Isinaayos ang bilang ayon sa likas na ayos sa Filipino habang pinananatili ang kabuuang 830 taon.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: at nagkaroon siya ng iba pang mga anak na lalaki at babae
  rationale: Ang 'nagkaroon' ay natural para sa talaangkanan; tahasang pinananatili ng 'mga anak na lalaki at babae' ang dalawang kategorya sa Hebreo. Idinagdag ang 'iba pang' upang malinaw na hindi kasama rito ang nauna nang pinangalanang si Jared.
