  rationale: Ang Hebreong bilang na literal na nakaayos bilang dalawa at animnapu at isang daan ay isinaayos ayon sa likas na gamit sa modernong Filipino.
- source_word: וַיּוֹלֶד
  choice: naging anak niya
  rationale: Sa talaangkanan, ipinahihiwatig ng pandiwa na siya ang ama ni Enoc. Ang pariralang ito ay natural at dignified sa modernong Filipino, at hindi kasing-arkaiko ng “ipinanganak niya.”
- source_word: אֶת חֲנוֹךְ
  choice: si Enoc
  rationale: Hindi hiwalay na isinasalin ang pananda ng tuwirang layon na אֶת; ginamit ang nakaugaliang anyong Filipino na “Enoc.”
