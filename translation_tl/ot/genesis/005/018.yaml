- source_word: וַיְחִי
  choice: Nang ... taong gulang na
  rationale: Sa pormulang talaangkanan, ang literal na “nabuhay” ay natural na ipinapahayag sa Filipino bilang pag-abot sa isang tiyak na gulang.
- source_word: יֶרֶד
