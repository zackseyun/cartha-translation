  yaml_path: translation/ot/genesis/005/002.yaml
  text: Male and female he created them[a], and he blessed them and called their name Man on the day they were created.
translation:
  language: tl
  text: Nilikha niya sila na lalaki at babae; pinagpala niya sila at pinangalanan niya silang “Tao”[a] noong araw na nilikha sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ’adam. Maaari itong mangahulugang “tao” o “sangkatauhan” bilang kabuuan, at ito rin ang personal na pangalang Adan.
    reason: Pinananatili ang tunay na leksikal na kalabuan ng אָדָם sa pagitan ng kolektibong katawagan sa sangkatauhan at ng personal na pangalang Adan.
lexical_decisions:
- source_word: זָכָר וּנְקֵבָה
  choice: Lalaki at babae
  rationale: Pinananatili ang magkatambal na katawagang tumutukoy sa kasarian, sa natural at karaniwang pananalitang Filipino.
- source_word: בְּרָאָם
  choice: silang nilikha niya
  rationale: Isinasalin ang Qal perfect at ang pangmaramihang hulapi bilang tuwirang kilos ng Diyos sa dalawa.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: pinagpala niya sila
  rationale: Karaniwan, malinaw, at tuwirang katumbas ng banal na pagkilos na ipinahahayag ng בּרך.
- source_word: וַיִּקְרָא אֶת־שְׁמָם
  choice: pinangalanan niya silang
  rationale: Likas na Filipino para sa Hebreong pormula ng pagbibigay-pangalan; naipahihiwatig nitong kapuwa sila saklaw ng iisang kolektibong pangalan.
- source_word: אָדָם
  choice: “Tao”
  rationale: Sa konteksto, kapuwa lalaki at babae ang tinatawag sa kolektibong katawagang ito. Pinananatili ng “Tao” ang kaugnayan sa Hebreong אָדָם nang hindi ito nililimitahan sa lalaking indibidwal.
- source_word: בְּיוֹם הִבָּרְאָם
  choice: nang araw na likhain sila
  rationale: Pinananatili ang tahasang panahong “araw” at ang pasibong diwa ng kanilang pagkalikha sa natural na ayos ng Filipino.
theological_decisions:
- issue: Kolektibo o personal na kahulugan ng אָדָם
  choice: “Tao” bilang kolektibong pangalan ng lalaki at babae
  alternative: “Adan” bilang personal na pangalan
  rationale: Ang tuwirang konteksto ay kapuwa lalaki at babae, kaya pangunahing ipinahahayag ng אָדָם ang kanilang magkasanib na pagkakakilanlan bilang sangkatauhan. Gayunman, tunay na nananatili ang posibilidad na mabasa ang anyong Hebreo bilang pangalang Adan, lalo na sa konteksto ng talaangkanan; kaya inilagay ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinangalanan niya silang” sa halip na ang mas literal ngunit asiwa na “tinawag niya ang kanilang pangalan,” habang pinananatili ang kolektibong bisa ng iisang pangalan.
