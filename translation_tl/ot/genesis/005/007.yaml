base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/007.yaml
  text: After he fathered Enosh, Seth lived eight hundred and seven years and fathered sons and daughters.
translation:
  language: tl
  text: Matapos niyang maging ama ni Enosh, nabuhay pa si Set nang walong daan at pitong taon, at nagkaroon siya ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: nabuhay pa
  rationale: Sa pormula ng talaangkanan, ipinahihiwatig nito ang tagal ng patuloy na buhay ni Set matapos ang kapanganakan ni Enosh; natural sa Tagalog ang “nabuhay pa.”
- source_word: אֲחֲרֵי הוֹלִידוֹ אֶת אֱנוֹשׁ
  choice: Matapos niyang maging ama ni Enosh
  rationale: Pinananatili nito ang panandang temporal at ang panlalaking pakahulugan ng Hiphil ng ילד, nang hindi gumagamit ng lipas o di-natural na pananalita.
- source_word: שֶׁבַע שָׁנִים וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: walong daan at pitong taon
  rationale: Isinaayos ang bilang ayon sa natural na ayos sa Tagalog habang pinananatili ang kabuuang 807 taon.
- source_word: וַיּוֹלֶד
  choice: nagkaroon siya
  rationale: Sa kontekstong talaangkanan, natural at malinaw itong nagsasaad na nagkaanak pa si Set; ang kasunod na tahasang “mga anak na lalaki at babae” ang nagpapanatili sa detalye ng Hebreo.
- source_word: בָּנִים וּבָנוֹת
  choice: mga anak na lalaki at babae
  rationale: Pinananatili ang tahasang pagtukoy ng Hebreo sa kapwa mga anak na lalaki at mga anak na babae sa halip na gawing pangkalahatang “mga anak.”
