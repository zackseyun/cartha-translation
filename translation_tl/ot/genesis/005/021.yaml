  text: Si Enoc ay animnapu't limang taong gulang nang maging ama siya ni Matusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Nang ... taong gulang na
  rationale: Sa pormulang talaangkanan, ipinapahayag ng pandiwa ang edad ni Enoc bago ang sumunod na pangyayari. Likas sa modernong Tagalog ang ganitong ayos kaysa sa literal na “nabuhay siya nang.”
- source_word: חֲנוֹךְ
  choice: Enoc
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa Tagalog.
- source_word: חָמֵשׁ וְשִׁשִּׁים שָׁנָה
  choice: animnapu't limang taong gulang
  rationale: Natural na anyo ito ng edad na animnapu't lima sa modernong Tagalog.
- source_word: וַיּוֹלֶד
  choice: naging anak niya
  rationale: Sa talaangkanan at kapag lalaki ang simuno, tumutukoy ang ילד sa pagiging ama o pag-aanak. Ang “naging anak niya” ay malinaw, natural, at hindi arkaiko.
- source_word: אֶת
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang hiwalay na katumbas na kailangan sa Tagalog.
- source_word: מְתוּשָׁלַח
  choice: Matusalem
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa Tagalog.
