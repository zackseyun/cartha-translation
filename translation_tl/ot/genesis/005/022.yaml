  yaml_path: translation/ot/genesis/005/022.yaml
  text: Enoch walked with God three hundred years after he fathered Methuselah[b][a], and he fathered sons and daughters.
translation:
  language: tl
  text: Lumakad si Enoc na kasama ang Diyos[a] sa loob ng tatlong daang taon matapos siyang maging ama ni Matusalem, at nagkaroon siya ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Namuhay si Enoc na may pakikipag-ugnayan sa Diyos.” Literal na “lumakad ... na kasama ang Diyos” ang idyomang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ חֲנוֹךְ אֶת הָאֱלֹהִים
  choice: Lumakad si Enoc na kasama ang Diyos
  rationale: Pinananatili ang metaporang Hebreo na tumutukoy sa paraan ng pamumuhay ni Enoc kaugnay ng Diyos. Ang “na kasama ang Diyos” ay likas sa Tagalog at hindi nagpapaliit sa masaklaw na diwa ng idyoma.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מְתוּשֶׁלַח
  choice: matapos niyang maging ama ni Matusalem
  rationale: Malinaw na ipinahahayag ang panahong kasunod ng pagsilang ni Matusalem at ang panig ng lalaking magulang, nang hindi gumagamit ng lipas na pananalita.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: sa loob ng tatlong daang taon
  rationale: Ipinakikita ng parirala ang tagal ng paglakad ni Enoc na kasama ang Diyos; nililinaw ng “sa loob ng” ang ugnayang sintaktiko sa natural na Tagalog.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: at nagkaanak siya ng mga anak na lalaki at babae
  rationale: Natural sa modernong Tagalog ang “nagkaanak,” samantalang pinananatili ng “mga anak na lalaki at babae” ang tahasang pagkakabanggit sa parehong kasarian.
- source_word: מְתוּשֶׁלַח
  choice: Matusalem
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog na tradisyong biblikal.
theological_decisions:
- issue: Kalikasan ng kaugnayan ni Enoc sa Diyos sa idyomang “lumakad na kasama ang Diyos”
  choice: Panatilihin sa pangunahing teksto ang metaporang “Lumakad ... na kasama ang Diyos”
  alternative: Namuhay si Enoc na may malapit na pakikipag-ugnayan sa Diyos
  rationale: Mahalaga ang masaklaw at matalinghagang pananalita ng Hebreo. Hindi ito dapat paliitin sa isang tiyak na pagpapakahulugan lamang, gaya ng katapatan o matalik na pakikisama.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang metaporang Hebreo, ngunit inayos ang pagkakasunod ng mga parirala at idinagdag ang “sa loob ng” upang maging likas at hindi malabo ang tagal sa Tagalog.
