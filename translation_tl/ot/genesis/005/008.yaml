lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay
  rationale: Sa pormulang talaangkanan, ang anyong ito ng היה ay nagsisilbing panandang kopular sa pagbubuod ng haba ng buhay; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “ay.”
- source_word: כָּל יְמֵי
  choice: ang lahat ng araw ni
  rationale: Pinananatili nito ang konkretong idyomang Hebreo para sa kabuuang haba ng buhay, habang malinaw at marangal pa rin sa modernong Tagalog.
- source_word: שֵׁת
  choice: Set
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa Bibliyang Tagalog.
- source_word: שְׁתֵּים עֶשְׂרֵה ... וּתְשַׁע מֵאוֹת שָׁנָה
  choice: siyam na raan at labindalawang taon
  rationale: Ang literal na ayos na “labindalawang taon at siyam na raang taon” ay likas na nangangahulugang 912; inayos ito ayon sa karaniwang pagbigkas ng bilang sa Tagalog.
- source_word: וַיָּמֹת
  choice: pagkatapos, namatay siya
  rationale: Ipinahahayag nito ang kasunod na pangyayari at pinananatili ang payak at mariing pangwakas na pormula ng talaangkanan.
