translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kabuuang haba ng buhay” bilang natural na katumbas ng Hebreong idyoma, at isinulat sa salita ang bilang upang bumagay sa estilong pampanitikan ng talata.
