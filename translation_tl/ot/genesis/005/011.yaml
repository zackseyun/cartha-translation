  text: Ang kabuuang haba ng buhay ni Enosh ay siyam na raan at limang taon, at namatay siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: ang kabuuang haba ng buhay ... ay
  rationale: Ang parirala ay isang karaniwang buod ng kabuuang haba ng buhay sa talaangkanan. Inihahatid ng salin ang diwa nito sa natural na modernong Tagalog sa halip na ang mas literal ngunit di-gaanong likas na “ang lahat ng mga araw.”
- source_word: אֱנוֹשׁ
  choice: Enosh
  rationale: Pinananatili ang transliterasyong malapit sa anyong Hebreo at kaayon ng ibinigay na pangalang ginagamit sa proyekto.
- source_word: חָמֵשׁ שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: siyamnaraan at limang taon
  rationale: Ang ayos ng bilang sa Hebreo ay literal na lima at siyam na raan; inayos ito ayon sa likas na pagkakasunod sa Tagalog nang hindi binabago ang kabuuang 905 taon.
- source_word: וַיָּמֹת
  choice: Pagkatapos, namatay siya
  rationale: Malinaw at natural nitong ipinapahayag ang kasunod na pangyayari at pinananatili ang paulit-ulit na pangwakas na pormula ng Genesis 5.
