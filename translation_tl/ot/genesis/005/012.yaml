lexical_decisions:
- source_word: וַיְחִי
  choice: Nang … taóng gulang na
  rationale: Sa pormulang talaangkanan, ang pandiwa kasama ng bilang ng mga taon ay tumutukoy sa edad ni Kenan nang magkaanak siya. Isinaad ito sa natural na Filipino bilang sugnay ng panahon.
- source_word: קֵינָן
  choice: Kenan
  rationale: Tuwirang transliterasyon ng pangalang Hebreo, alinsunod sa karaniwang makabagong anyo.
- source_word: שִׁבְעִים שָׁנָה
  choice: pitumpung taóng gulang
  rationale: Malinaw at likas na ipinahahayag sa Filipino ang edad na tinutukoy ng parirala.
- source_word: וַיּוֹלֶד
  choice: naging ama siya ni
  rationale: Pinananatili nito ang panlalaking ugnayang talaangkanan ng Hebreong ילד habang gumagamit ng malinaw at kasalukuyang pananalita.
- source_word: אֶת
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang hiwalay na katumbas na kailangan sa Filipino.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Tuwirang transliterasyon ng pangalang Hebreo.
