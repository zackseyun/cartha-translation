  text: Enosh lived ninety years and fathered Kenan[a][b].
translation:
  language: tl
  text: Nabuhay si Enosh nang siyamnapung taon at naging ama ni Kenan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang tradisyon, ang pangalang ito ay binabaybay na “Cainan,” ayon sa anyong Griyego; “Kenan” ang nasa tekstong Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחִי
  choice: Nang … taong gulang na
  rationale: Sa pormulang talaangkanan na sinusundan ng bilang ng edad, ipinapahayag ng pandiwa ang edad ni Enosh nang maganap ang kasunod na pangyayari. Natural itong ihayag sa modernong Tagalog sa sugnay na “Nang … taong gulang na.”
- source_word: אֱנוֹשׁ
  choice: Enosh
  rationale: Direktang transliterasyon ito ng Hebreong pangalan at mas malapit sa anyong Masoretiko kaysa sa tradisyonal na “Enos.”
- source_word: תִּשְׁעִים שָׁנָה
  choice: siyamnapung taong gulang
  rationale: Ito ang likas na ekspresyon sa Tagalog para sa edad na siyamnapung taon.
- source_word: וַיּוֹלֶד
  choice: naging anak niya
  rationale: Sa Hiphil at sa konteksto ng talaangkanan, tumutukoy ito sa pagiging ama o pagkakaroon ng anak. Ang “naging anak niya” ay malinaw, kasalukuyan, at hindi arkaiko.
- source_word: אֶת
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang hiwalay na katumbas na salita sa Tagalog.
- source_word: קֵינָן
  choice: Kenan
  rationale: Sinusunod nito nang tuwiran ang anyo ng pangalan sa tekstong Hebreo; ang “Cainan” ay nagmula sa tradisyong Griyego.
