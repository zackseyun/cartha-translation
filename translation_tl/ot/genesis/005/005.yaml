lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: Kaya ang lahat ng araw ... ay
  rationale: Pinananatili nito ang paulit-ulit na pormula ng talaangkanan at ang Hebreong idyoma na inilalarawan ang buhay bilang kabuuan ng mga “araw,” habang nananatiling likas sa Tagalog.
- source_word: אָדָם
  choice: Adan
  rationale: Sa konteksto ng talaangkanan, ito ang pangalan ng isang tiyak na tao, hindi pangkalahatang tawag sa tao o sangkatauhan.
- source_word: אֲשֶׁר חַי
  choice: na nabuhay si Adan
  rationale: Likas na inilalahad sa Tagalog ang sugnay na tumutukoy sa mga araw ng kanyang buhay; ang pag-uulit sa pangalang Adan ay umiiwas sa malabong reperensiya.
- source_word: תְּשַׁע מֵאוֹת ... וּשְׁלֹשִׁים שָׁנָה
  choice: siyamnaraan at tatlumpung taon
  rationale: Isinusulat nang buo ang bilang upang tumugma sa marangal at pampanitikang rehistro ng talaangkanan.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: Pinananatili ang payak at mariing pangwakas na pormula ng Genesis 5 nang hindi nagdaragdag ng temporal na diwa.
theological_decisions:
- issue: Kahulugan ng אָדָם
  choice: Adan bilang pangalang pantangi
  alternative: tao o sangkatauhan
  rationale: Bagaman maaaring mangahulugan ang salita ng “tao” o “sangkatauhan” sa ibang konteksto, malinaw na tumutukoy ito rito sa indibidwal na si Adan sa talaangkanan.
- issue: Pagpapanatili sa pormula ng kamatayan
  choice: at namatay siya
  alternative: at saka siya namatay
  rationale: Pinananatili ng tuwirang anyo ang paulit-ulit at mabigat na diin sa mortalidad nang hindi nagdaragdag ng hindi kinakailangang temporal na pahiwatig.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang Hebreong idyomang “lahat ng araw” at ang payak na pangwakas na “at namatay siya” upang maingatan ang pormula at bigat ng talaangkanan.
