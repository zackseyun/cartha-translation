translation_notes:
  register: Modernong Filipino na simple, marangal, at angkop sa paulit-ulit na pormula ng talaangkanan. Ginamit ang ‘Nang … taon na’ upang malinaw na ang bilang ay edad ni Mahalalel nang isilang ang anak.
