translation:
  language: tl
  text: Si Mahalalel ay animnapu't limang taong gulang nang maging ama siya ni Jared.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Nang … taon na si
  rationale: Sa pormulang talaangkanan, ipinahahayag nito ang edad ni Mahalalel bago ang kasunod na pangyayari; natural itong isinasalin sa Filipino bilang sugnay na nagsasaad ng edad.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Isinalin sa baybay na malapit sa Hebreo at kaayon ng karaniwang anyo ng pangalan sa Filipino.
- source_word: חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה
  choice: animnapu't limang taon
  rationale: Inayos ang Hebreong ‘lima at animnapu’ ayon sa likas na ayos ng bilang sa modernong Filipino, habang pinananatili ang eksaktong halaga.
- source_word: וַיּוֹלֶד
  choice: naging anak niya
  rationale: Ipinahahayag ang pagiging ama o pagkakaanak sa natural at madaling maunawaang Filipino, nang hindi gumagamit ng makalumang ‘nagkaanak kay’ o teknikal na pananalita.
- source_word: אֶת יָרֶד
  choice: si Jared
  rationale: Hindi isinasalin nang hiwalay ang panandang tuwirang layon na אֶת; pinanatili ang kinagawiang transliterasyong Jared.
