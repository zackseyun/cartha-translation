reference: Genesis 5:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אֶת שְׁמ֛/וֹ נֹ֖חַ לֵ/אמֹ֑ר זֶ֞֠ה יְנַחֲמֵ֤/נוּ מִֽ/מַּעֲשֵׂ֨/נוּ֙ וּ/מֵ/עִצְּב֣וֹן יָדֵ֔י/נוּ מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר אֵֽרְרָ֖/הּ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/029.yaml
  text: And he called his name Noah[a], saying, “This one will comfort us from our work and from the painful toil of our hands, from the ground that Yahweh has cursed.”
translation:
  language: tl
  text: At pinangalanan niya itong Noe[a], at sinabi, “Ang isang ito ang magbibigay sa atin ng ginhawa mula sa ating gawain at sa masakit na pagpapagal ng ating mga kamay, mula sa lupang isinumpa ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aaliw sa atin.” Sa Hebreo, may paglalaro sa tunog ng pangalang Noe, na kahawig ng salitang tumutukoy sa “pahinga” o “ginhawa.”
    reason: Pinananatili ang mas tuwirang kahulugan ng pandiwang Hebreo at ang paglalaro sa tunog ng pangalan.
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: pinangalanan niya itong
  rationale: Likas na makabagong Tagalog para sa pormulang Hebreo na literal na “tinawag niya ang pangalan nito,” habang malinaw na tumutukoy sa pagbibigay ng pangalan.
- source_word: נֹחַ
  choice: Noe
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Noah sa Tagalog; ipinaliliwanag sa talababa ang paglalaro sa tunog ng pangalang Hebreo.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili ang pormulang nagpapakilala sa tuwirang pananalita.
- source_word: זֶה
  choice: Ang isang ito
  rationale: Pinananatili ang diin ng demonstratibong Hebreo sa bata, sa halip na gawing simpleng panghalip lamang.
- source_word: יְנַחֲמֵנוּ
  choice: magbibigay sa atin ng ginhawa
  rationale: Ipinahahayag ang ginhawang inaasahan sa gitna ng mabigat na paggawa. Iniiwasan din nito ang posibleng modernong kahulugan ng “aaliw” bilang paglilibang, habang itinatala sa talababa ang mas tuwirang alternatibo at ang paglalaro sa salita.
- source_word: מִמַּעֲשֵׂנוּ
  choice: mula sa ating gawain
  rationale: Ang מַעֲשֶׂה rito ay tumutukoy sa paggawa o gawain, hindi sa mga gawang moral.
- source_word: וּמֵעִצְּבוֹן יָדֵינוּ
  choice: at sa masakit na pagpapagal ng ating mga kamay
  rationale: Sinasalamin ng “masakit na pagpapagal” ang hirap at kirot na nakapaloob sa עִצָּבוֹן at pinananatili ang larawang “ng ating mga kamay.”
- source_word: מִן־הָאֲדָמָה
  choice: mula sa lupa
  rationale: Pinananatili ang pag-uulit ng Hebreong pang-ukol at ang mahalagang ugnay sa lupang isinumpa sa Genesis 3, kahit bahagyang mabigat ang pagkakabuo.
- source_word: אֲשֶׁר אֵרְרָהּ
  choice: isinumpa
  rationale: Tuwirang inilalarawan ang lupa bilang tumanggap ng sumpa; natural sa Tagalog ang ayos na may kasunod na gumagawa ng kilos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ng Diyos sa halip na palitan ng titulong “PANGINOON.”
theological_decisions:
- issue: Paglalaro sa pangalang Noe at sa pandiwang יְנַחֲמֵנוּ
  choice: Ginamit sa pangunahing teksto ang “magbibigay sa atin ng ginhawa,” at ipinaliwanag sa talababa ang “aaliw sa atin” at ang kaugnayan sa pahinga.
  alternative: “aaliw sa atin” o “magbibigay sa atin ng pahinga”
  rationale: Karaniwang nangangahulugan ang pandiwang נחם ng pag-aliw o pagbibigay-kaaliwan, samantalang ang pangalang נֹחַ ay katunog ng ideya ng pahinga. Hindi mahigpit na etimolohiya ang paliwanag ng talata kundi paglalaro sa tunog; kaya pinananatili sa talababa ang parehong saklaw nang hindi pinag-iisa ang mga ito.
- issue: Kaugnayan ng “mula sa lupa” sa naunang mga parirala
  choice: Pinanatili itong hiwalay na pariralang “mula sa lupang isinumpa ni Yahweh.”
  alternative: “dahil sa lupang isinumpa ni Yahweh” o “sa lupang isinumpa ni Yahweh”
  rationale: Maaaring ipakahulugan ang parirala bilang pinagmumulan o sanhi ng hirap. Ang mas pormal na “mula sa” ay nagpapanatili sa sintaktikong pag-uulit at sa bahagyang kalabuan ng Hebreo.
translation_notes:
  register: Makabago at marangal na Tagalog. Ginamit ang “pinangalanan” para sa likas na salaysay, “pagpapagal” para sa mabigat at masakit na paggawa, at “Yahweh” para sa pangalan ng Diyos. Sadyang pinanatili ang bahagyang mabigat na pag-uulit ng “mula sa” upang huwag tahimik na lutasin ang sintaktikong ugnayan ng huling parirala.
