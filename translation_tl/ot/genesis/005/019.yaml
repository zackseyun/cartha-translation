  source_fidelity: 'Ang pangunahing sugnay at bilang ay wasto: si Yered ay nabuhay pa nang walong daang taon pagkatapos kay Hanok. Gayunman, ang “nagkaanak siya ng mga lalaki at babae” ay hindi sapat na tiyak na katumbas ng בָּנִים וּבָנוֹת, na tumutukoy sa mga anak na lalaki at mga anak na babae, hindi lamang sa mga lalaking at babaeng tao.'
