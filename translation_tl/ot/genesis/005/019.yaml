  terminology: Ang mga transliterasyong “Yered” at “Hanok” ay pare-pareho sa napiling patakaran. Ang “maging ama” ay angkop para sa panlalaking Hiphil ng ילד sa talaangkanan. Nananatiling angkop ang talababa para sa tradisyonal na mga anyo ng pangalan.
