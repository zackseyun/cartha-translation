  yaml_path: translation/ot/genesis/005/019.yaml
  text: And Yered lived eight hundred years after he fathered Hanokh[a], and he fathered sons and daughters.
translation:
  language: tl
  text: Nabuhay pa si Yered nang walong daang taon matapos niyang maging ama ni Hanok[a], at naging ama siya ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tradisyonal na mga anyo ng mga pangalang ito ay “Jared” at “Enoc.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: Nabuhay pa
  rationale: Sa pormulang pangangkanan, ipinahihiwatig ng pandiwa ang patuloy na pagkabuhay sa loob ng panahong binanggit; likas itong naihahayag sa Filipino sa pamamagitan ng “nabuhay pa.”
- source_word: יֶרֶד
  choice: Yered
  rationale: Direktang transliterasyon ito ng pangalang Hebreo at mas malapit sa bigkas ng orihinal kaysa sa tradisyonal na “Jared.”
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת חֲנוֹךְ
  choice: matapos siyang maging ama ni Hanok
  rationale: Malinaw at likas sa modernong Filipino ang pariralang ito para sa panlalaking tagaganap ng Hiphil ng ילד, nang hindi ipinahihiwatig na siya mismo ang nanganak.
- source_word: חֲנוֹךְ
  choice: Hanok
  rationale: Direktang transliterasyon ito ng pangalang Hebreo; iniiwasan nitong gawing batayan ang tradisyonal na anyong mula sa ibang wika.
- source_word: שְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: walong daang taon
  rationale: Karaniwan at malinaw na pagpapahayag sa Filipino ng tagal na walong daang taon.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: at nagkaanak siya ng mga lalaki at babae
  rationale: Likas sa modernong Filipino ang “nagkaanak,” habang pinananatili ng “mga lalaki at babae” ang tahasang pagtukoy ng Hebreo sa kapwa mga anak na lalaki at mga anak na babae.
