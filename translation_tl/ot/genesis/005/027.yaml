  text: Ang lahat ng araw ni Metusela ay siyam na raan at animnapu’t siyam na taon, at namatay siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay
  rationale: Sa pormulang panggenealohiya, ang pandiwa ay nagsisilbing payak na panapos na paglalahad; natural itong ipinahihiwatig ng panandang panaguri na “ay” sa Filipino.
- source_word: כָּל יְמֵי
  choice: ang lahat ng araw ni
  rationale: Pinananatili ang literal at paulit-ulit na pormulang “lahat ng araw” sa Genesis 5 sa halip na gawing “haba ng buhay,” habang nananatiling malinaw dahil sinusundan ito ng kabuuang bilang ng mga taon.
- source_word: מְתוּשֶׁלַח
  choice: Metusela
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: תֵּשַׁע וְשִׁשִּׁים ... וּתְשַׁע מֵאוֹת
  choice: siyam na raan at animnapu't siyam
  rationale: Isinaayos ang mga bilang ayon sa natural na ayos sa modernong Filipino; ang kabuuan ay 969.
- source_word: שָׁנָה ... שָׁנָה
  choice: taon
  rationale: Ang “taon” ay karaniwang hindi nagbabago ng anyo pagkatapos ng bilang sa Filipino.
- source_word: וַיָּמֹת
  choice: Pagkatapos, namatay siya
  rationale: Malinaw at natural na ipinahahayag ang kasunod na pangyayari at ang paksa, habang pinananatili ang pangwakas na pormula ng talaangkanan.
