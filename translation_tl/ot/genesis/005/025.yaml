lexical_decisions:
- source_word: וַיְחִי
  choice: Nang ... taong gulang na
  rationale: Sa pormulang talaangkanan, ang literal na “nabuhay” kasunod ang bilang ng taon ay likas na ipinapahayag sa modernong Tagalog bilang edad bago magkaanak.
- source_word: מְתוּשֶׁלַח
  choice: Metusela
  rationale: Transliterasyon ng pangalang Hebreo sa anyong karaniwang ginagamit sa Tagalog.
- source_word: שֶׁבַע וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: 187 taong gulang
  rationale: Ang Hebreong ayos na “pito at walumpu ... at isang daang taon” ay isinaayos ayon sa likas na pagbibilang sa Tagalog.
- source_word: וַיּוֹלֶד
  choice: naging anak niya
  rationale: Ipinapahayag nito ang lalaking pinagmulan sa talaangkanan sa natural at malinaw na modernong Tagalog; ang mas pormal na katumbas ay nasa talababa.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang hiwalay na katumbas sa Tagalog.
- source_word: לָמֶךְ
  choice: Lamec
  rationale: Transliterasyon ng pangalang Hebreo sa tradisyonal at madaling makilalang anyong Tagalog.
