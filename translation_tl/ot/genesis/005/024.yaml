  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang patuloy na pamumuhay ni Enoc na kasama ng Diyos, ang kanyang pagkawala, at ang Diyos na kumuha sa kanya ay naipahayag nang walang pagdaragdag na dinala siya sa langit o hindi siya namatay. Gayunman, ang “Pagkatapos” ay hindi hayagang nasa וְ at naglalagay ng mas tiyak na sunod-sunod na oras kaysa sa simpleng pagkakaugnay ng Hebreo.'
