  terminology: Ang “Enoc,” “Diyos,” at “kinuha siya” ay angkop sa modernong Filipino Tagalog at sa antas ng pananalita ng salaysay. Napananatili rin ang maingat na di-pagpapaliwanag sa paraan ng pagkawala ni Enoc.
