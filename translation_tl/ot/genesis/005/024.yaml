  yaml_path: translation/ot/genesis/005/024.yaml
  text: Enoch walked with God[a], and he was no more, because God took him.
translation:
  language: tl
  text: Namuhay si Enoc na kasama ng Diyos, at wala na siya[a], sapagkat kinuha siya ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “at wala siya.” Ipinahihiwatig ng Hebreong pahayag na hindi na naroon si Enoc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: Namuhay
  rationale: Ang hitpael ng הלך ay tumutukoy rito sa patuloy na paraan ng pamumuhay, hindi lamang sa literal na paglakad. Mas likas sa modernong Tagalog ang “namuhay” habang pinananatili ng kasunod na “kasama ng Diyos” ang relasyonal at moral na diwa ng idyoma.
- source_word: אֶת הָאֱלֹהִים
  choice: kasama ng Diyos
  rationale: Kapag ginagamit kasama ng הלך, ang אֶת ay nagpapahayag ng pagsama. Tuwirang pinananatili ng “kasama ng Diyos” ang relasyonal na lakas ng Hebreong pahayag.
- source_word: וְאֵינֶנּוּ
  choice: Pagkatapos, wala na siya
  rationale: Literal itong nagsasaad na “at wala siya.” Ang “wala na siya” ay natural sa Tagalog at nagpapahayag ng pagkawala sa piling ng mga tao nang hindi tinutukoy kung paano ito nangyari. Ang “Pagkatapos” ay nagpapalinaw sa daloy ng salaysay nang hindi dinaragdagan ang teolohikal na nilalaman.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit wala na si Enoc. Ang “sapagkat” ay malinaw, marangal, at angkop sa kasalukuyang salin ng Kasulatan.
- source_word: לָקַח אֹתוֹ
  choice: kinuha siya
  rationale: Karaniwang kahulugan ng לקח ang “kunin.” Pinananatili ng “kinuha siya” ang maingat at maikling pananalita ng Hebreo nang hindi tahasang idinaragdag na dinala siya sa langit o na hindi siya namatay.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Sa konteksto ng salaysay, tumutukoy ito sa iisang Diyos, kaya “Diyos” ang angkop na salin.
theological_decisions:
- issue: Kung tahasang sasabihing hindi namatay si Enoc o dinala siya sa langit
  choice: 'Panatilihin ang maingat na pananalita: “wala na siya, sapagkat kinuha siya ng Diyos.”'
  alternative: “Hindi siya namatay,” “dinala siya ng Diyos sa langit,” o “inilipat siya ng Diyos.”
  rationale: Ipinahihiwatig ng talata ang di-pangkaraniwang pagkilos ng Diyos, ngunit hindi tahasang sinasabi ng Hebreo na dinala si Enoc sa langit o na hindi siya namatay. Pinananatili ng salin ang tunay na pagpipigil at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “namuhay” sa halip na literal na “lumakad” upang malinaw na maipahayag ang patuloy na paraan ng buhay, habang pinananatili ng “kasama ng Diyos” ang Hebreong idyoma. Ang footnote marker [a] ay nakalagay kaagad pagkatapos ng pariralang tinutukoy nito.
