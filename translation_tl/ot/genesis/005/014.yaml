  text: So all the days of Kenan were nine hundred and ten years[b][a], and he died.
translation:
  language: tl
  text: At ang lahat ng araw[a] ni Kenan[b] ay siyam na raan at sampung taon, at namatay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang mga araw ni Kenan,” isang paulit-ulit na pormula sa talaangkanan na tumutukoy sa kabuuang haba ng kanyang buhay.
    reason: lexical_alternative
  - marker: b
