lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Kaya ... ay
  rationale: Ipinahahayag ang pagpapatuloy at pagbubuod sa talaangkanan nang natural sa Tagalog, habang pinananatili ang sunod-sunod na daloy ng Hebreo.
- source_word: כָּל יְמֵי
  choice: ang lahat ng araw ni
  rationale: Pinananatili ang literal at paulit-ulit na pormula ng Genesis 5; sa kontekstong ito, tumutukoy ito sa buong haba ng buhay.
- source_word: קֵינָן
  choice: Kenan
  rationale: Tuwirang transliterasyon ng anyong Hebreo, sa halip na tradisyonal na anyong ‘Cainan’ na naiimpluwensiyahan ng Griyego.
- source_word: עֶשֶׂר שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: siyam na raan at sampung taon
  rationale: Isinaayos ang bilang ayon sa likas na pagkakasunod sa Tagalog, nang hindi binabago ang kabuuang 910 taon.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: Tuwiran at payak na salin ng karaniwang pangwakas na pormula sa talaangkanan.
