  text: After he fathered Seth[a], Adam lived eight hundred years and fathered sons and daughters.
translation:
  language: tl
  text: Matapos niyang maging ama ni Set[a], nabuhay si Adan nang walong daang taon at nagkaanak siya ng mga lalaki at babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “ang mga araw ni Adan … ay walong daang taon” matapos niyang maging ama ni Set.
    reason: Ipinakikita ang literal na anyo ng Hebreong idyoma na likas na isinaling “nabuhay si Adan.”
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי אָדָם
  choice: nabuhay si Adan
  rationale: Ang literal na Hebreong idyoma ay “ang mga araw ni Adan ay”; likas na ipinahahayag sa makabagong Tagalog ang haba ng buhay sa pamamagitan ng “nabuhay si Adan.”
- source_word: אַחֲרֵי
  choice: Matapos
  rationale: Malinaw at likas na panandang temporal para sa panahong sumunod sa pangyayari.
- source_word: הוֹלִידוֹ אֶת שֵׁת
  choice: niyang maging ama ni Set
  rationale: Ang Hiphil ng ילד ay tumutukoy sa pag-aanak ng lalaki o pagiging ama; iniiwasan ng saling ito ang makalumang “ipinanganak” na maaaring magpalabo kung sino ang nanganak.
- source_word: שְׁמֹנֶה מֵאֹת שָׁנָה
  choice: nang walong daang taon
  rationale: Tuwirang pagpapahayag ng haba ng buhay sa natural na Tagalog.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: at nagkaanak pa ng mga lalaki at babae
  rationale: Pinananatili ang tahasang pagtukoy ng Hebreo sa mga anak na lalaki at babae; ipinahihiwatig ng “pa” na ang mga anak na ito ay sumunod kay Set sa loob ng natitirang mga taon.
theological_decisions:
- issue: Kahulugan ng אָדָם
  choice: Adan bilang personal na pangalan
  alternative: tao o sangkatauhan
  rationale: Sa talaangkanang ito, ang tinutukoy ay ang pinangalanang indibidwal na si Adan, hindi ang sangkatauhan sa pangkalahatan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maging ama” upang mapanatili ang panlalaking pananaw ng pandiwang Hebreo, at “nagkaanak pa ng mga lalaki at babae” upang maging natural habang hindi pinapantay sa pangkalahatang “mga anak.”
