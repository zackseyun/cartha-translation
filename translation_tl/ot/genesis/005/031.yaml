  text: So all the days of Lamech were seven hundred seventy-seven years[a], and he died.
translation:
  language: tl
  text: At ang lahat ng araw ni Lamec ay pitong daan at pitumpu’t pitong taon[a], at namatay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang pagkakasunod ng bilang ay “pito at pitumpung taon, at pitong daang taon,” na ang kabuuan ay 777 taon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Kaya ... ay
  rationale: Ipinapahayag ng waw-consecutive ng היה ang kasunod na pangwakas na buod ng buhay ni Lamec. Likas sa modernong Tagalog ang “Kaya” upang mapanatili ang daloy ng salaysay.
- source_word: כָּל יְמֵי
  choice: ang kabuuang bilang ng mga araw ni
  rationale: Pinananatili nito ang Hebreong idyomang tumutukoy sa buong haba ng buhay, habang malinaw at natural sa Tagalog.
- source_word: לֶמֶךְ
  choice: Lamec
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Tagalog na salin ng Bibliya.
- source_word: שֶׁבַע וְשִׁבְעִים ... וּשְׁבַע מֵאוֹת
  choice: pitong daan at pitumpu't pito
  rationale: Ang Hebreo ay naglilista muna ng yunit at sampuan, saka daanan; isinaayos ito ayon sa natural na pagbibilang sa Tagalog nang hindi binabago ang kabuuang 777.
- source_word: שָׁנָה
  choice: taon
  rationale: Ang “taon” ay hindi nagbabago ng anyo pagkatapos ng bilang sa Tagalog.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: Tuwirang pinananatili ang paulit-ulit na pangwakas na pormula ng Genesis 5 at ang bigat ng pahayag tungkol sa kamatayan.
theological_decisions:
- issue: Pormula ng haba ng buhay sa talaangkanan ng Genesis 5
  choice: Inilahad nang tuwiran ang 777 taon bilang buod ng haba ng buhay ni Lamec.
  alternative: Ipahiwatig sa salin na simboliko ang bilang.
  rationale: Tuwirang bilang ng haba ng buhay at pahayag ng kamatayan ang anyo ng tekstong Hebreo; hindi dapat magpasok ang salin ng simbolikong pagbasa o pag-aalinlangan na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa paulit-ulit na ritmo ng talaangkanan. Ginamit ang “kabuuang bilang ng mga araw” upang mapanatili ang larawan ng Hebreo nang hindi maging malabo.
