  yaml_path: translation/ot/genesis/005/032.yaml
  text: When Noah was five hundred years old[a], he fathered Shem, Ham[b], and Japheth.
translation:
  language: tl
  text: Nang limandaang taong gulang na si Noe, naging ama siya nina Sem, Ham, at Jafet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang ayos na “Sem, Ham, at Jafet” ay ayon sa tekstong Hebreo. Hindi nito kinakailangang ipahiwatig ang pagkakasunod-sunod ng kanilang kapanganakan o na silang tatlo ay ipinanganak sa iisang taon.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang ... na
  rationale: Ipinakikita rito ng anyong pasalaysay ang kalagayang temporal. Likas sa modernong Tagalog ang “Nang ... na” at hindi kailangang gayahin nang mekanikal ang “At nangyari.”
- source_word: בֶּן חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: limandaang taong gulang
  rationale: Ang idyomang Hebreo na בן + bilang + שנה ay tumutukoy sa edad; ito ang malinaw at natural na katumbas sa Tagalog.
- source_word: וַיּוֹלֶד
  choice: naging anak niya
  rationale: Ang Hiphil ng ילד na may lalaking simuno ay nangangahulugang nagkaanak o naging ama. Pinili ang likas at dignified na pariralang Tagalog na malinaw na si Noe ang ama, nang hindi gumagamit ng makaluma o teknikal na pananalita.
- source_word: נֹחַ
  choice: Noe
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Bibliyang Tagalog.
- source_word: שֵׁם
  choice: Sem
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Bibliyang Tagalog.
- source_word: חָם
  choice: Ham
  rationale: Tuwirang transliterasyon na pamilyar sa mga mambabasang Tagalog.
- source_word: יָפֶת
  choice: Jafet
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Bibliyang Tagalog.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: sina Sem, Ham, at Jafet
  rationale: Hindi isinasalin ang mga panandang tuwirang layon; ang “sina” at karaniwang bantas ay natural na naghaharap ng talaan ng mga pangalang pantao sa Tagalog.
theological_decisions:
- issue: Posibleng pahiwatig ng pagkakasunod-sunod ng kapanganakan at ng iisang taon ng pagsilang
  choice: Pinanatili ang ayos na “Sem, Ham, at Jafet” nang hindi sinasabing ito ang tiyak na ayos ng kanilang kapanganakan o na silang tatlo ay isinilang nang limandaang taong gulang si Noe.
  alternative: Ayusin ang mga pangalan ayon sa ipinapalagay na edad, o ipahiwatig na ipinanganak silang tatlo sa iisang taon.
  rationale: Inililista ng Hebreo ang tatlong anak matapos banggitin ang edad ni Noe, ngunit hindi nito kinakailangang itakda ang eksaktong ayos ng kapanganakan o sabay-sabay na pagsilang. Pinananatili ng salin ang tunay na puwang ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Ginamit ang “Noe,” “Sem,” at “Jafet” bilang mga anyong nakaugaliang gamitin sa Tagalog; iniwasan ang makalumang “nagkaanak” construction only? The selected wording is colloquial-neutral and preserves the paternal sense in context.
