  yaml_path: translation/ot/genesis/005/030.yaml
  text: And Lamech lived five hundred and ninety-five years after he fathered Noah[a], and he fathered sons and daughters.
translation:
  language: tl
  text: Matapos maging ama si Lamec ni Noe, nabuhay pa siya nang 595 taon at naging ama siya ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: nabuhay pa siya
  rationale: Sa pormula ng talaangkanan, tumutukoy ito sa haba ng panahong ipinagpatuloy ni Lamec ang buhay matapos ang kapanganakan ni Noe. Likas sa Tagalog ang “nabuhay pa” sa ganitong konteksto.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־נֹחַ
  choice: Matapos maging ama ni Lamec si Noe
  rationale: Ang Hiphil ng ילד ay nagpapahayag ng pagiging ama o pag-aanak ng lalaking paksa. Ginawang tahasan ang pangalang Lamec upang maging malinaw at natural ang sugnay sa Tagalog.
- source_word: נֹחַ
  choice: Noe
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Tagalog na Bibliya.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וַחֲמֵשׁ מֵאֹת שָׁנָה
  choice: 595 taon
  rationale: Ang Hebreo ay literal na 95 at 500 taon; pinagsama ito sa karaniwang ayos ng bilang sa modernong Tagalog nang hindi binabago ang kabuuan.
- source_word: וַיּוֹלֶד
  choice: nagkaroon
  rationale: Sa pariralang sinusundan ng “mga anak na lalaki at babae,” ang “nagkaroon” ay natural na Tagalog at malinaw pa ring tumutukoy sa mga anak ni Lamec, bagaman hindi nito inuulit nang mekanikal ang naunang pandiwa.
- source_word: בָּנִים וּבָנוֹת
  choice: mga anak na lalaki at babae
  rationale: Pinananatili ang tahasang pagbanggit ng Hebreo sa kapwa mga anak na lalaki at babae sa halip na paikliin bilang “mga anak.”
