  text: And Lamech lived one hundred and eighty-two years, and fathered a son.
translation:
  language: tl
  text: Nabuhay si Lamec nang 182 taon, at naging ama siya ng isang anak na lalaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Nang mabuhay
  rationale: Sa pormulang talaangkanan, ipinahihiwatig ng pandiwa ang haba ng panahong nabuhay ang tao bago ang sumunod na pangyayari; natural itong ipinapahayag sa Filipino bilang sugnay na “Nang mabuhay … nang … taon.”
- source_word: לֶמֶךְ
  choice: Lamec
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal.
- source_word: שְׁתַּיִם וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: 182 taon
  rationale: Inayos ang Hebreong bilang sa karaniwang ayos ng Filipino at ginamitan ng numerong madaling basahin sa talaangkanan.
- source_word: וַיּוֹלֶד
  choice: nagkaanak
  rationale: Ang Hiphil ng ילד na may lalaking simuno ay tumutukoy sa pagiging ama o pagkakaroon ng anak. Ang “nagkaanak” ay natural at kasalukuyang Filipino, samantalang nililinaw ng kasunod na parirala na lalaki ang anak.
- source_word: בֵּן
  choice: isang lalaki
  rationale: Sa kontekstong ito, ang בֵּן ay anak na lalaki. Ang “isang lalaki” matapos ang “nagkaanak” ay natural na paraan upang sabihing nagkaroon siya ng anak na lalaki bago ito pangalanan.
