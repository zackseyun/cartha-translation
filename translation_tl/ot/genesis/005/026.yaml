  text: After he fathered Lamech, Methuselah lived 782 years and fathered sons and daughters.
translation:
  language: tl
  text: Matapos maging ama ni Lamec si Matusalem, nabuhay pa siya nang 782 taon at naging ama pa ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: nabuhay
  rationale: Sa pormulang talaangkanan, natural na ipinapahayag nito ang haba ng panahong nabuhay pa ang tao matapos maipanganak ang pinangalanang anak.
- source_word: מְתוּשֶׁלַח
  choice: Matusalem
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa modernong saling Tagalog.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־לֶמֶךְ
  choice: Matapos niyang maging ama ni Lamec
  rationale: Pinananatili nito ang panahong kahulugan ng אַחֲרֵי at ang tiyak na papel ng lalaki sa Hiphil ng ילד, sa natural at marangal na Tagalog.
- source_word: שְׁתַּיִם וּשְׁמוֹנִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה
  choice: 782 taon
  rationale: Ang Hebreong pagkakasunod ay literal na dalawa at walumpu, at pitong daan; malinaw at walang nawawalang diwa ang karaniwang bilang na 782.
- source_word: וַיּוֹלֶד
  choice: nagkaroon
  rationale: Sa kontekstong kasunod ng pahayag na naging ama siya ni Lamec, ang 'nagkaroon' ay likas na Tagalog para sa pagkakaroon pa niya ng ibang mga anak, nang hindi ipinahihiwatig na siya ang nanganak.
- source_word: בָּנִים וּבָנוֹת
  choice: mga anak na lalaki at babae
  rationale: Pinananatili ang tahasang pagbanggit ng Hebreo sa kapwa mga anak na lalaki at mga anak na babae sa halip na gawing pangkalahatang 'mga anak' lamang.
