  verdict: revise
  source_fidelity: Ang diwa, pagkakasunod, at bilang na 782 taon ay wastong naihahatid. Gayunman, ang ikalawang וַיּוֹלֶד ay mas tiyak na pagpapahayag na si Matusalem ay naging ama; ang “nagkaroon” ay maaaring maging mas pangkalahatan kaysa sa pandiwang Hebreo.
  naturalness: Natural ang rehistro ng draft, ngunit ang paunang “Matapos niyang…” ay may panghalip na nauuna sa malinaw na pinagtutukuyan. Mas malinaw at natural ang pagbanggit muna kay Matusalem sa sugnay na panahon, saka ang “siya” sa pangunahing sugnay.
  terminology: Ang “Matusalem” at “Lamec” ay katanggap-tanggap na mga anyong Tagalog ng mga pangalan. Ang “mga anak na lalaki at babae” ay tumpak na pinananatili ang tahasang pagkakaiba ng Hebreo.
  issues:
