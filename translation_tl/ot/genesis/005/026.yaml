translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa karaniwang mambabasa. Pinili ang 'maging ama' sa unang ילד upang panatilihin ang tiyak na panlalaking papel, at ang mas natural na 'nagkaroon' sa ikalawang gamit upang maiwasan ang mabigat na pag-uulit.
