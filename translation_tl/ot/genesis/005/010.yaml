base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/010.yaml
  text: And Enosh lived eight hundred and fifteen years after he fathered Kenan[c][b][a], and he fathered sons and daughters.
translation:
  language: tl
  text: Matapos maging ama si Enosh ni Kenan[a], nabuhay pa siya nang walong daan at labinlimang taon, at nagkaroon siya ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Kenan”; sa ilang tradisyon, “Cainan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחִי
  choice: nabuhay pa siya
  rationale: Sa pormula ng talaangkanan, ipinahihiwatig ng pandiwa at ng pariralang אַחֲרֵי ang haba ng panahong ipinagpatuloy ng tao ang kanyang buhay matapos ang panganganak; natural itong ipinahahayag sa Filipino sa pamamagitan ng “nabuhay pa.”
- source_word: אֱנוֹשׁ
  choice: Enosh
  rationale: Direktang sinasalamin ng “Enosh” ang anyong Hebreo kaysa sa tradisyonal na “Enos.”
- source_word: הוֹלִידוֹ אֶת־קֵינָן
  choice: maging ama ni Enosh kay Kenan
  rationale: Ang Hiphil ng ילד sa talaangkanan ay tumutukoy sa pagiging ama o pag-aanak. Ang “maging ama … kay Kenan” ay malinaw at kasalukuyang Filipino, nang hindi gumagamit ng makalumang pananalita.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: walong daan at labinlimang taon
  rationale: Inayos sa likas na pagkakasunod sa Filipino ang Hebreong kabuuang 15 + 800 taon, nang hindi binabago ang bilang.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: at nagkaanak siya ng mga anak na lalaki at babae
  rationale: Natural sa Filipino ang “nagkaanak,” at pinananatili ng “mga anak na lalaki at babae” ang tahasang pagbanggit ng Hebreo sa parehong mga anak na lalaki at mga anak na babae.
