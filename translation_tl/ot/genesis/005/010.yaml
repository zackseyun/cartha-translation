    rationale: Mas malinaw sa modernong Filipino ang ayos na “maging ama si Enosh ni Kenan,” na tahasang ipinakikilalang si Enosh ang ama at si Kenan ang anak.
  - severity: low
    issue: Paulit ang “nagkaanak siya ng mga anak.”
    rationale: Bagaman nauunawaan, hindi ito kasinglinis ng “nagkaroon siya ng mga anak na lalaki at babae,” na pinananatili ang saklaw ng Hebreo.
