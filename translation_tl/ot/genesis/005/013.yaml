base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/013.yaml
  text: And Kenan lived eight hundred and forty years after he fathered Mahalalel[b][a], and he fathered sons and daughters.
translation:
  language: tl
  text: At nabuhay si Kenan nang walong daan at apatnapung taon pagkatapos niyang maging ama ni Mahalalel, at naging ama rin siya ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: nabuhay
  rationale: Sa pormula ng mga talaangkanan sa Genesis, natural na ipinapahayag nito ang haba ng panahong nabuhay ang isang tao.
- source_word: קֵינָן
  choice: Kenan
  rationale: Tuwirang transliterasyon ng pangalang Hebreo, sa baybay na madaling basahin sa modernong Filipino.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מַהֲלַלְאֵל
  choice: matapos niyang maging ama ni Mahalalel
  rationale: Ipinapakita ng Hiphil ng ילד na si Kenan ang naging ama; malinaw at likas sa Filipino ang pariralang ito nang hindi gumagamit ng makalumang pananalita.
- source_word: אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: walong daan at apatnapung taon
  rationale: Pinagsama ang bilang at inayos ayon sa likas na pagkakasunod sa Filipino, habang pinananatili ang kabuuang 840 taon.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: at nagkaroon siya ng mga anak na lalaki at babae
  rationale: Natural itong Filipino at pinananatili ang tahasang pagtukoy ng Hebreo sa kapwa mga anak na lalaki at babae.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “maging ama” sa unang paglitaw upang ihayag ang male-specific causative sense ng ילד, at “nagkaroon” sa ikalawa bilang mas likas na Filipino; hindi nito ipinahihiwatig na ito lamang ang naging mga anak niya.
