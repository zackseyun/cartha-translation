id: GEN.5.1
reference: Genesis 5:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: זֶ֣ה סֵ֔פֶר תּוֹלְדֹ֖ת אָדָ֑ם בְּ/י֗וֹם בְּרֹ֤א אֱלֹהִים֙ אָדָ֔ם בִּ/דְמ֥וּת אֱלֹהִ֖ים עָשָׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/001.yaml
  text: This is the book of the generations of Adam[a]. In the day God created man[b], he made him in the likeness of God.
translation:
  language: tl
  text: Ito ang talaan ng mga salinlahi ni Adan.[a] Nang[b] likhain ng Diyos ang tao,[c] ginawa niya ang tao ayon sa wangis ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong pangalan na Adan ay kaugnay rin ng salitang nangangahulugang “tao.” Dito, dahil pambungad ito sa talaangkanan, pantanging pangalan ang pinakamalamang na diwa.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Sa araw na likhain.” Ang idyomang Hebreo ay maaari ring mangahulugang “nang” o “noong.”
    reason: lexical_alternative
  - marker: c
    text: O “sangkatauhan.” Ang Hebreong adam dito ay maaaring tumukoy sa tao bilang kinatawan ng buong sangkatauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה סֵפֶר
  choice: Ito ang talaan
  rationale: Ang demonstratibong זֶה ay likas na isinasaling “ito,” at ang סֵפֶר dito ay isang nakasulat na tala o kasulatan. Mas natural sa makabagong Tagalog ang “talaan” sa pambungad ng isang talaangkanan kaysa sa literal na “aklat.”
- source_word: תּוֹלְדֹת
  choice: mga salinlahi
  rationale: Maaari itong tumukoy sa mga henerasyon, mga inapo, o salaysay tungkol sa kanila. Pinananatili ng “mga salinlahi” ang mahalagang panandang pangkayarian sa Genesis nang hindi ito nililimitahan sa listahan lamang ng mga pangalan.
- source_word: אָדָם
  choice: Adan
  rationale: Sa unang gamit, nagsisilbi itong pangalan ng ninunong paksa ng kasunod na talaangkanan.
- source_word: בְּיוֹם בְּרֹא
  choice: Nang likhain
  rationale: Ang pariralang Hebreo na literal na “sa araw ng paglikha” ay karaniwang gumaganap bilang temporal na idyomang nangangahulugang “nang” o “noong.” Ito ang natural na anyo sa kasalukuyang Tagalog.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: May isahang diwa ang katawagan sa kontekstong ito, kaya “Diyos” ang karaniwang salin.
- source_word: אָדָם
  choice: ang tao
  rationale: Sa ikalawang gamit, ang salita ay karaniwang pangngalan na tumutukoy sa tao o sangkatauhan sa salaysay ng paglikha, hindi lamang sa pangalang Adan.
- source_word: בִּדְמוּת אֱלֹהִים
  choice: ayon sa wangis ng Diyos
  rationale: Ang דְּמוּת ay “wangis” o “pagkakahawig.” Hindi ito pinalitan ng “larawan,” sapagkat ibang salitang Hebreo iyon.
- source_word: עָשָׂה אֹתוֹ
  choice: ginawa niya ang tao
  rationale: Ang עשה ay wastong isinasaling “ginawa.” Inulit ang “ang tao” sa halip na gumamit ng malabong panghalip upang maging malinaw at natural sa Tagalog.
theological_decisions:
- issue: Magkaibang diwa ng אָדָם sa dalawang paglitaw nito
  choice: “Adan” bilang pantanging pangalan sa pamagat; “ang tao” bilang karaniwang pangngalan sa sugnay tungkol sa paglikha
  alternative: “Adan” sa dalawang paglitaw, o “sangkatauhan” sa ikalawa
  rationale: Ang una ay pamagat ng talaangkanan ng isang tiyak na ninuno. Ang ikalawa ay umaalingawngaw sa salaysay ng paglikha at maaaring kumatawan sa tao o buong sangkatauhan; pinananatili sa talababa ang lawak na ito.
- issue: Ugnayan ng “wangis ng Diyos” sa ibang pananalita sa salaysay ng paglikha
  choice: Panatilihin ang “wangis”
  alternative: “larawan ng Diyos”
  rationale: דְּמוּת ang ginamit dito, hindi צֶלֶם. Ang “wangis” ay nagpapanatili sa natatanging salita at hindi sapilitang itinutulad ang talata sa ibang pahayag.
- issue: Temporal na diwa ng בְּיוֹם
  choice: Isalin sa pangunahing teksto bilang “Nang”
  alternative: “Sa araw na”
  rationale: Karaniwang temporal na idyoma ang Hebreong parirala at hindi kinakailangang tumukoy sa isang espesipikong araw na dalawampu't apat na oras. Ipinapakita sa talababa ang mas literal na anyo nang hindi nilulutas nang labis ang saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “talaan” para sa natural na pambungad ng talaangkanan, samantalang pinanatili ang “mga salinlahi” at “wangis” upang maingatan ang mahahalagang ugnayang leksikal sa Genesis. Hindi ginamitan ng denominasyonal o teknikal na pananalita.
