translation:
  language: tl
  text: At ang kabuuang bilang ng mga araw ni Enoc ay tatlong daan at animnapu't limang taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Kaya ... ay
  rationale: Ipinahihiwatig ng waw-consecutive kasama ng היה ang pangwakas na buod sa talaangkanan. Ang “Kaya” ay likas na naghahatid ng pagkakasunod at pagbubuod sa modernong Tagalog.
- source_word: כָּל
  choice: lahat ng
  rationale: Tumutukoy sa kabuuan ng mga araw o buong haba ng buhay ni Enoc.
- source_word: יְמֵי
  choice: mga araw ni
  rationale: Pinananatili ang konkretong idyomang Hebreo na “mga araw ni,” na nauunawaan dito bilang kabuuang haba ng buhay.
- source_word: חֲנוֹךְ
  choice: Enoc
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Tagalog ng Bibliya.
- source_word: חָמֵשׁ וְשִׁשִּׁים
  choice: animnapu't lima
  rationale: Inayos sa karaniwang ayos ng bilang sa Tagalog sa halip na sundin nang mekanikal ang Hebreong “lima at animnapu.”
- source_word: וּשְׁלֹשׁ מֵאוֹת
  choice: tatlong daan
  rationale: Tuwirang katumbas ng bilang sa natural na Tagalog.
- source_word: שָׁנָה ... שָׁנָה
  choice: taon
  rationale: Bagaman dalawang ulit lumilitaw ang “taon” sa estrukturang Hebreo, likas sa Tagalog na pagsamahin ang buong bilang bilang “tatlong daan at animnapu't limang taon.”
