translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Pinanatili ang Hebreong larawang “lahat ng araw” sa halip na palitan ng mas malayang “buong buhay,” habang ginawang natural ang ayos ng bilang.
