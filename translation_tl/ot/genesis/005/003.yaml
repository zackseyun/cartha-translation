  rationale: 'Ginawang mas natural ang ayos ng parirala tungkol sa pagiging ama ni Adan at isinulat ang bilang sa mga salita para sa mas marangal na daloy. Pinanatili ang lahat ng mahahalagang katangiang Hebreo: ang bilang ng taon, ang pagiging ama ni Adan, ang magkaibang katawagang ''kawangis'' at ''larawan,'' at ang pagpapangalan kay Set. Bahagyang nilinaw ang footnote a upang tumugma sa alternatibong salin.'
