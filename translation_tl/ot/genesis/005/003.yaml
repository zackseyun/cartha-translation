base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/003.yaml
  text: Adam lived one hundred thirty years and fathered a son in his likeness[a], according to his image[c][b], and called his name Seth.
translation:
  language: tl
  text: Nabuhay si Adan nang isang daan at tatlumpung taon, at naging ama siya[a] ng isang anak na lalaki na kawangis niya, ayon sa kanyang larawan[b]. Pinangalanan niya itong Set.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagkaanak siya”; ang pandiwang Hebreo ay ginagamit para sa pagiging ama kapag lalaki ang simuno.
    reason: lexical_alternative
  - marker: b
    text: Ang pananalitang “kawangis niya, ayon sa kanyang larawan” ay umaalingawngaw sa Genesis 1:26–27.
    reason: cross_reference
  - marker: c
    text: Mas literal, “tinawag niya ang pangalan nito na Set.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: Nabuhay
  rationale: Sa pormulang pangkanununuan, ang חיה ay tumutukoy sa bilang ng mga taon ng buhay hanggang sa sumunod na pangyayari. Ang “nabuhay” ay tuwiran at likas sa Filipino.
- source_word: אָדָם
  choice: Adan
  rationale: Ginagamit dito ang אָדָם bilang pangalang pantangi sa talaangkanan; “Adan” ang nakaugaliang anyo sa Filipino.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 130 taon
  rationale: Tumpak at madaling basahing modernong pagsulat ng bilang; hayagang pinananatili ang “taon” na nasa Hebreo.
- source_word: וַיּוֹלֶד
  choice: naging ama ng isang anak na lalaki
  rationale: Ang Hiphil ng ילד na may lalaking simuno ay nangangahulugang magkaanak o maging ama. Nililinaw ng parirala ang papel ni Adan bilang ama; ang “anak na lalaki” ay ipinahihiwatig ng pagpapangalan kay Set.
- source_word: בִּדְמוּתוֹ
  choice: na kawangis niya
  rationale: Ang דְּמוּת ay nagsasaad ng pagkakahawig. Natural sa Filipino ang “kawangis niya” at pinananatili nito ang alingawngaw ng Genesis 1:26.
- source_word: כְּצַלְמוֹ
  choice: ayon sa kanyang larawan
  rationale: Pinananatili ng “larawan” ang karaniwang kahulugan ng צֶלֶם, samantalang ipinapakita ng “ayon sa” ang prefiks na כ at hindi pinag-iisa ang dalawang salitang “kawangis” at “larawan.”
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ שֵׁת
  choice: Pinangalanan niya itong Set
  rationale: Ito ang natural na Filipino para sa Hebreong idyomang literal na “tinawag niya ang pangalan nito na Set,” nang hindi binabago ang diwa.
- source_word: שֵׁת
  choice: Set
  rationale: Ginamit ang nakaugaliang transliterasyon ng pangalan sa Filipino.
theological_decisions:
- issue: Ang kaugnayan ng anak ni Adan sa wangis at larawan ni Adan
  choice: Isinalin nang tuwiran bilang pagkakahawig kay Adan at pinanatili ang magkahiwalay na “kawangis” at “larawan.”
  alternative: Ipahiwatig na nabawasan o nawala ang larawan ng Diyos matapos ang pagkakasala, o ituring ang dalawang parirala bilang estilistikong pag-uulit lamang.
  rationale: Sinasadya ng talata ang alingawngaw ng Genesis 1:26–27, ngunit hindi nito ipinaliliwanag ang buong teolohikal na kabuluhan. Kaya pinananatili ng salin ang pagkakatulad at tensiyon nang hindi nagpapataw ng isang doktrinal na konklusyon.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Ginamit ang “naging ama” sa halip na ang lipas na “ipinanganak/begat” na pormula, at hinati sa dalawang pangungusap upang maging natural ang daloy nang hindi binabago ang pagkakasunod ng mga pangyayari.
