  text: And Abraham was ninety-nine years old when the flesh of his foreskin was circumcised.
translation:
  language: tl
  text: Siyamnapu’t siyam na taong gulang si Abraham nang tuliin ang laman ng kaniyang dulong-balat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: si Abraham
  rationale: Ipinagpapatuloy ng ו ang salaysay; hindi na kailangang isalin nang tahasan sa Filipino dahil natural ang pagpapatuloy kahit walang “at.”
- source_word: בֶּן תִּשְׁעִים וָתֵשַׁע שָׁנָה
  choice: Siyamnapu’t siyam na taong gulang
  rationale: Likas na katumbas sa Filipino ng Hebreong idyomang literal na “anak ng siyamnapu’t siyam na taon.”
- source_word: בְּ/הִמֹּלוֹ
  choice: nang tuliin
  rationale: Ang ב na may infinitive construct at hulaping panghalip ay nagsasaad ng panahon. Ang pasibong diwa ng Hebreo ay likas na naipahahayag sa Filipino sa pamamagitan ng “nang tuliin.”
- source_word: בְּשַׂר
  choice: ang laman
  rationale: Pinananatili ang kongkretong salitang “laman” sa pormula ng pagtutuli.
- source_word: עָרְלָתוֹ
  choice: ng kaniyang dulong-balat
  rationale: Ang “dulong-balat” ay malinaw at dignipikadong makabagong Filipino para sa foreskin, at pinananatili ang ugnayang paari ng Hebreo.
