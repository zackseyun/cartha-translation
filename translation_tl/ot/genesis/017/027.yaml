  yaml_path: translation/ot/genesis/017/027.yaml
  text: And all the men of his household[a], those born in the house and those bought with money from a foreigner, were circumcised with him.
translation:
  language: tl
  text: At ang lahat ng lalaki sa kanyang sambahayan—ang mga isinilang doon at ang mga binili sa salapi mula sa isang dayuhan[a]—ay tinuli kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “anak ng dayuhan,” isang idyomang nangangahulugang “dayuhan” o “tagalabas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: At ang lahat
  rationale: Pinananatili ng “At” ang kaugnayan sa naunang salaysay, at malinaw na ipinahahayag ng “ang lahat” ang kabuuang saklaw ng כָּל.
- source_word: אַנְשֵׁי בֵיתוֹ
  choice: ang lahat ng lalaki sa kanyang sambahayan
  rationale: Ang אַנְשֵׁי ay tumutukoy sa mga lalaki, at ang בֵיתוֹ ay sa kanyang bahay bilang sambahayan. Likas at malinaw sa modernong Tagalog ang “mga lalaki sa kanyang sambahayan.”
- source_word: יְלִיד בָּיִת
  choice: ang mga isinilang doon
  rationale: Tumutukoy ito sa mga ipinanganak sa loob ng sambahayan. Ginamit ang “doon” upang maiwasan ang mabigat na pag-uulit ng “sambahayan” nang hindi nawawala ang tinutukoy.
- source_word: וּמִקְנַת כֶּסֶף
  choice: ang mga binili sa salapi
  rationale: Ipinapakita ng parirala ang mga taong nakuha sa pamamagitan ng pagbili. Pinananatili ng “binili sa salapi” ang tuwirang transaksiyonal na diwa ng Hebreo.
- source_word: מֵאֵת בֶּן נֵכָר
  choice: mula sa isang dayuhan
  rationale: Ang בֶּן נֵכָר, literal na “anak ng dayuhan/banyagang lupain,” ay isang idyomang tumutukoy sa dayuhan o tagalabas. Ang “isang dayuhan” ang likas na katumbas sa Tagalog.
- source_word: נִמֹּלוּ
  choice: ay tinuli
  rationale: Ang Niphal ay angkop na unawaing balintiyak dito; hindi nito ipinahihiwatig na sila mismo ang nagsagawa ng pagtutuli sa kanilang sarili.
- source_word: אִתּוֹ
  choice: kasama niya
  rationale: Pinananatili nito ang ideya ng pakikisama kay Abraham sa pangyayari nang hindi nililimitahan ang kahulugan sa eksaktong pagsabay lamang sa oras.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “sambahayan” upang ipahayag ang mas malawak na panlipunang kahulugan ng בַּיִת, hindi lamang ang gusaling bahay. Inilagay ang panandang [a] pagkatapos ng “dayuhan,” ang mismong salitang nililinaw ng talababa.
