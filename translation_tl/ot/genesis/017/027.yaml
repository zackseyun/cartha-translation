  source_fidelity: Tumpak na naipapahayag ng salin ang kabuuang saklaw ng וְכָל, ang mga lalaking kabilang sa sambahayan, ang dalawang pangkat na ‘isinilang sa sambahayan’ at ‘binili sa salapi mula sa dayuhan,’ ang balintiyak na ‘tinuli,’ at ang pakikisama kay Abraham sa pangyayari. Ang ‘doon’ ay malinaw na tumutukoy sa naunang ‘kanyang sambahayan’ at napapanatili ang kahulugang house-born.
