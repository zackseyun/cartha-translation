  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י אַבְרָ֔ם בֶּן תִּשְׁעִ֥ים שָׁנָ֖ה וְ/תֵ֣שַׁע שָׁנִ֑ים וַ/יֵּרָ֨א יְהוָ֜ה אֶל אַבְרָ֗ם וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲנִי אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְ/פָנַ֖/י וֶ/הְיֵ֥ה תָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/001.yaml
  text: When Abram was ninety-nine years old[a], Yahweh appeared to Abram and said to him, “I am God Almighty. Walk before me, and be blameless.”
translation:
  language: tl
  text: Nang siyamnapu't siyam na taong gulang si Abram, nagpakita sa kanya si Yahweh at sinabi, “Ako ang Diyos na Makapangyarihan sa Lahat.[a] Mamuhay ka sa harapan ko at maging walang kapintasan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: El Shaddai. Karaniwang isinasatitik ito sa halip na isalin; pinagtatalunan ang eksaktong kahulugan ng Shaddai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַבְרָם בֶּן תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים
  choice: Nang siyamnapu't siyam na taong gulang si Abram
  rationale: Likas na ipinapahayag sa modernong Tagalog ang Hebreong panandang pampanahon at karaniwang pormula ng edad, nang hindi ginagamit ang lipas na literal na “at nangyari.”
- source_word: וַיֵּרָא
  choice: nagpakita
  rationale: Sa Niphal na salaysay na si Yahweh ang simuno at si Abram ang tumatanggap, ang likas na diwa ay “nagpakita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng transliterasyon sa halip na palitan ito ng isang titulo.
- source_word: אֵל שַׁדַּי
  choice: Diyos na Makapangyarihan sa Lahat
  rationale: Isinasalin ang banal na titulo sa malinaw at karaniwang modernong Tagalog; inilalagay sa talababa ang anyong El Shaddai at ang kawalang-katiyakan ng eksaktong diwa ng Shaddai.
- source_word: הִתְהַלֵּךְ לְפָנַי
  choice: Mamuhay ka sa harapan ko
  rationale: Ang Hitpael ng הלך ay tumutukoy sa patuloy na asal o paraan ng pamumuhay. Mas natural sa Tagalog ang “mamuhay,” habang pinananatili ng “sa harapan ko” ang talinghaga at tipanang himig.
- source_word: וֶהְיֵה תָמִים
  choice: at maging walang kapintasan
  rationale: Ipinahahayag nito ang integridad at kabuuang katapatan sa halip na igiit ang ganap na kawalan ng kasalanan; nananatili ang lakas ng utos.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton, kaya pinananatili ang personal na pangalan sa halip na palitan ng titulo.
- issue: Paglalarawan sa אֵל שַׁדַּי
  choice: Diyos na Makapangyarihan sa Lahat
  alternative: El Shaddai
  rationale: Ang pangunahing teksto ay nagbibigay ng malinaw na salin ng titulo, ngunit kinikilala sa talababa na pinagtatalunan ang eksaktong kahulugan ng Shaddai.
- issue: Saklaw ng תָמִים
  choice: walang kapintasan
  alternative: buo ang katapatan; ganap
  rationale: Iniiwasang ipakahulugan ang salita bilang metapisikal o lubos na kasakdalan; pinananatili nito ang tipanang panawagan sa integridad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “mamuhay” upang natural na maipahayag ang Hebreong talinghaga ng paglakad bilang paraan ng pamumuhay, at pinanatili ang “sa harapan ko” para sa tipanang himig.
