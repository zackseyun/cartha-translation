  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת יִשְׁמָעֵ֣אל בְּנ֗/וֹ וְ/אֵ֨ת כָּל יְלִידֵ֤י בֵית/וֹ֙ וְ/אֵת֙ כָּל מִקְנַ֣ת כַּסְפּ֔/וֹ כָּל זָכָ֕ר בְּ/אַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַ/יָּ֜מָל אֶת בְּשַׂ֣ר עָרְלָתָ֗/ם בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖/וֹ אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/023.yaml
  text: So Abraham took Ishmael his son[a], and all those born in his house, and all those bought with his money, every male among the men of Abraham’s household, and circumcised the flesh of their foreskin on that very day[d][c][b], just as God had spoken to him.
translation:
  language: tl
  text: Pagkatapos, kinuha ni Abraham ang anak niyang si Ismael, ang lahat ng ipinanganak sa kaniyang sambahayan, at ang lahat ng taong binili sa pamamagitan ng kaniyang salapi—bawat lalaki sa sambahayan ni Abraham—at tinuli niya ang laman ng kanilang dulong-balat nang araw na iyon mismo[a], gaya ng sinabi sa kaniya ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa mismong araw na ito,” isang pahayag na nagdidiin na kumilos si Abraham agad nang araw ding iyon.
    reason: lexical_alternative
  - marker: b
    text: O, “gaya ng nakipag-usap ang Diyos sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: isinama
  rationale: Sa konteksto, kinuha ni Abraham ang mga lalaking saklaw ng utos upang tuliin sila. Mas natural sa Tagalog ang “isinama” kaysa literal na “kinuha,” nang hindi dinaragdagan ang kilos.
- source_word: יְלִידֵי בֵיתוֹ
  choice: mga ipinanganak sa sambahayan niya
  rationale: Pinananatili nito ang larawan ng mga taong ipinanganak sa loob ng sambahayan nang hindi labis na tinutukoy ang kanilang katayuan.
- source_word: מִקְנַת כַּסְפּוֹ
  choice: mga binili niya sa salapi
  rationale: Malinaw na ipinahahayag ang pagkuha sa pamamagitan ng pagbili at pinananatili ang konkretong pagtukoy sa salapi.
- source_word: כָּל זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם
  choice: bawat lalaki sa sambahayan ni Abraham
  rationale: Likas at hindi paulit-ulit sa Tagalog, habang pinananatili ang tahasang panlalaking saklaw ng Hebreo.
- source_word: וַיָּמָל
  choice: tinuli niya
  rationale: Ito ang karaniwan at tiyak na pandiwang Tagalog para sa pagsasagawa ng pagtutuli.
- source_word: בְּשַׂר עָרְלָתָם
  choice: ang laman ng kanilang dulong-balat
  rationale: Pinananatili ang konkreto at pisikal na pananalita ng Hebreo; ang “dulong-balat” ay malinaw na katawagang Tagalog para sa foreskin.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: nang araw na iyon mismo
  rationale: Ipinahahayag ang diin ng idyomang Hebreo sa mismong araw at agarang pagsunod.
- source_word: כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים
  choice: gaya ng sinabi sa kanya ng Diyos
  rationale: Natural sa makabagong Tagalog at angkop sa utos na naunang ibinigay, habang kinikilala sa talababa ang mas literal na posibilidad na “nakipag-usap.”
theological_decisions:
- issue: Pagpapakahulugan sa אֱלֹהִים
  choice: Diyos
  alternative: ang Diyos
  rationale: Malinaw na tumutukoy ito sa Diyos na nakipagtipan kay Abraham; ang walang pantukoy na “Diyos” ang natural na pantanging pagtukoy sa Tagalog.
- issue: Panlalaking saklaw ng sambahayan
  choice: bawat lalaki sa sambahayan ni Abraham
  alternative: lahat ng kabilang sa sambahayan ni Abraham
  rationale: Pinananatili ang tahasang זָכָר (“lalaki”) at hindi ginagawang neutral ang saklaw ng pagtutuli.
- issue: Ugnayan ng דִּבֶּר אִתּוֹ
  choice: sinabi sa kanya
  alternative: nakipag-usap sa kanya
  rationale: Ang konteksto ay tumutukoy sa sinabi o iniutos ng Diyos, ngunit maaaring magpahiwatig ang pariralang Hebreo ng pakikipag-usap; pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” upang saklawin ang pinalawak na household ni Abraham, at pinanatili ang konkretong pananalita tungkol sa pagtutuli nang hindi nagiging klinikal o malabo.
