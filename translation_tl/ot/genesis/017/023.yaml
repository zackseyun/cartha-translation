revisions:
- from: Kaya isinama ni Abraham ang anak niyang si Ismael, ang lahat ng ipinanganak sa sambahayan niya, at ang lahat ng binili niya sa salapi—bawat lalaki sa sambahayan ni Abraham—at tinuli niya ang laman ng kanilang dulong-balat nang araw na iyon mismo[a], gaya ng sinabi sa kanya ng Diyos.[b]
  to: Pagkatapos, kinuha ni Abraham ang anak niyang si Ismael, ang lahat ng ipinanganak sa kaniyang sambahayan, at ang lahat ng taong binili sa pamamagitan ng kaniyang salapi—bawat lalaki sa sambahayan ni Abraham—at tinuli niya ang laman ng kanilang dulong-balat nang araw na iyon mismo[a], gaya ng sinabi sa kaniya ng Diyos.[b]
  rationale: Pinalitan ang “isinama” ng “kinuha” upang masunod ang pangunahing kahulugan ng וַיִּקַּח nang hindi nagdaragdag ng patutunguhan o paraan ng pagdadala. Idinagdag ang “taong” upang maging malinaw na ang mga binili sa pamamagitan ng salapi ay mga miyembro ng sambahayan, gaya ng hinihingi ng konteksto at ng Hebreo. Inayos ang alternatibong talababa para sa דִּבֶּר אִתּוֹ upang maging likas at gramatikal na Tagalog, habang pinananatili ang pangunahing saling kontekstuwal na “sinabi sa kanya.”
