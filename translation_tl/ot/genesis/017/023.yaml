  source_fidelity: Malapit ang diwa sa Hebreo, ngunit ang “isinama” ay mas tiyak na nangangahulugang dinala o isinabay at hindi tuwirang katumbas ng וַיִּקַּח (“kinuha”). Ang “lahat ng binili niya sa salapi” ay maaari ring mabasa bilang mga bagay na binili, samantalang tumutukoy ang Hebreo sa mga taong binili para sa sambahayan.
  naturalness: Malinaw at angkop ang rehistro, kabilang ang “sambahayan,” “tinuli,” at “dulong-balat.” Gayunman, mas natural at mas tumpak ang “kinuha” sa pambungad, at dapat ayusin ang talababa b upang maging wastong alternatibong pagsasalin sa Tagalog.
  terminology: Ang “Diyos,” “sambahayan,” “lalaki,” “tinuli,” at “dulong-balat” ay angkop at nagpapanatili ng kongkretong at panlalaking saklaw ng Hebreo. Pinananatili ng “gaya ng sinabi sa kanya ng Diyos” ang kahulugan sa konteksto; ang alternatibong “nakipag-usap” ay maaaring ilagay nang maayos sa talababa.
