base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/016.yaml
  text: I will bless her[a], and moreover I will give you a son by her. I will bless her, and she will become nations[b]; kings of peoples will come from her.
translation:
  language: tl
  text: Pagpapalain ko siya, at bibigyan din kita ng isang anak na lalaki sa pamamagitan niya. Pagpapalain ko siya, at siya ang magiging pinagmulan ng mga bansa[a]; magmumula sa kanya ang mga hari ng mga bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “siya ay magiging mga bansa.” Maaari ring unawain: “magiging ina siya ng mga bansa.”'
    reason: Pinananatili ang kapansin-pansing Hebreong pahayag וְהָיְתָה לְגוֹיִם at ang lehitimong alternatibong pagpapakahulugan nito.
lexical_decisions:
- source_word: וּבֵרַכְתִּי אֹתָהּ / וּבֵרַכְתִּיהָ
  choice: Pagpapalain ko siya / Pagpapalain ko siya
  rationale: Pinananatili ng “pagpapalain” ang bigat ng ברך sa konteksto ng tipan, pati ang pag-uulit nito para sa diin.
- source_word: וְגַם
  choice: at ... din
  rationale: Likas na ipinahahayag sa modernong Tagalog ang pandagdag at madiing diwa ng partikula sa pamamagitan ng “din.”
- source_word: נָתַתִּי מִמֶּנָּה לְךָ בֵּן
  choice: bibigyan din kita ng isang anak na lalaki sa pamamagitan niya
  rationale: Bagaman qatal ang anyo ng pandiwa, tumutukoy ito sa hinaharap sa konteksto ng pangako. Malinaw na ipinahahayag ng “sa pamamagitan niya” na kay Sara manggagaling ang anak nang hindi ipinapalit ang mas malabong “mula sa kanya.”
- source_word: וְהָיְתָה לְגוֹיִם
  choice: magmumula sa kanya ang mga bansa
  rationale: Natural ito sa Tagalog at inihahatid ang korporatibong diwa na mga bansa ang lilitaw mula kay Sara. Hindi idinaragdag sa pangunahing teksto ang salitang “ina,” na ipinahihiwatig ngunit hindi tahasang nasa Hebreo.
- source_word: גוֹיִם
  choice: mga bansa
  rationale: Karaniwan at tuwirang katumbas ito sa konteksto ng pangako sa mga patriarka.
- source_word: מַלְכֵי עַמִּים
  choice: mga hari ng mga bayan
  rationale: Pinananatili ng “mga bayan” ang pagkakaiba ng עַמִּים sa naunang גוֹיִם na isinaling “mga bansa.”
- source_word: מִמֶּנָּה יִהְיוּ
  choice: magmumula sa kanya
  rationale: Likas na Tagalog ito para sa pinagmulang angkan at tapat sa literal na diwang “magiging mula sa kanya.”
theological_decisions:
- issue: Paglalarawan sa pangako tungkol sa mga inapo ni Sara
  choice: magmumula sa kanya ang mga bansa; magmumula sa kanya ang mga hari ng mga bayan
  alternative: magiging ina siya ng mga bansa; magmumula sa kanya ang mga hari ng mga bayan
  rationale: Ipinahahayag nito ang lawak ng pangako sa mga bansa at maharlikang angkan nang hindi idinaragdag sa pangunahing teksto ang “ina,” na interpretatibong malinaw ngunit hindi tahasang nasa Hebreo. Inilalagay sa talababa ang mas pormal na anyo upang mapanatili ang kakaibang pananalita ng pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “anak na lalaki” upang hayagang katawanin ang בֵּן, at pinanatili ang pag-uulit ng “Pagpapalain ko siya.” Ang “magmumula sa kanya” ay piniling natural na pangunahing salin, samantalang ang mas literal at sadyang kakaibang “magiging mga bansa” ay nasa talababa.
