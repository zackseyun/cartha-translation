base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/009.yaml
  text: And God said to Abraham[a], “As for you, you shall keep my covenant, you and your offspring after you throughout their generations.”
translation:
  language: tl
  text: Sinabi ng Diyos kay Abraham, “Ikaw naman ay tuparin mo ang aking tipan—ikaw at ang iyong lahi[a] na susunod sa iyo, sa lahat ng kanilang salinlahi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “binhi”; ang salitang Hebreo ay nasa anyong isahan ngunit kolektibong tumutukoy sa mga magmumula kay Abraham.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng anyong pandiwa ang salaysay. Likas sa makabagong Tagalog ang “Sinabi” nang hindi kailangang isalin nang hiwalay ang pang-ugnay na waw.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ito ang tuwirang karaniwang salin para sa Diyos na nakikipagtipan kay Abraham sa kontekstong ito.
- source_word: אֶל־אַבְרָהָם
  choice: kay Abraham
  rationale: Tuwirang ipinahihiwatig ng pariralang Hebreo ang kinausap, at “Abraham” ang pangalang nasa teksto.
- source_word: וְאַתָּה
  choice: Ikaw naman
  rationale: Pinananatili nito ang diin ng nakaharap na panghalip at ang paglipat mula sa pangako ng Diyos tungo sa pananagutan ni Abraham.
- source_word: אֶת־בְּרִיתִי
  choice: ang aking tipan
  rationale: Tuwirang salin ito na nagpapanatili sa mahalagang terminong pangtipan.
- source_word: תִשְׁמֹר
  choice: dapat mong tuparin
  rationale: Sa konteksto ng tipan, ang שׁמר ay nangangahulugang panatilihin o sundin ang mga pananagutan ng tipan. Ang “dapat mong tuparin” ay malinaw at likas na nagpapahayag ng obligasyon sa Tagalog.
- source_word: אַתָּה וְזַרְעֲךָ
  choice: ikaw at ang iyong lahi
  rationale: Ang זֶרַע ay pang-isahang katawagang kolektibo na literal na “binhi” at tumutukoy rito sa mga magmumula kay Abraham. Ang “lahi” ay natural at hindi sapilitang ginagawang maramihan ang anyo.
- source_word: אַחֲרֶיךָ
  choice: pagkatapos mo
  rationale: Ipinahihiwatig nito ang pagsunod kay Abraham sa linya ng salinlahi.
- source_word: לְדֹרֹתָם
  choice: sa lahat ng kanilang salinlahi
  rationale: Ipinapahayag nito ang pagpapatuloy ng pananagutan sa sunod-sunod na mga salinlahi.
theological_decisions:
- issue: Pagpapahayag ng pananagutan sa tipan nang walang idinadagdag na natatanging legal o sakramental na pakahulugan
  choice: dapat mong tuparin ang aking tipan
  alternative: ingatan mo ang aking tipan
  rationale: Malinaw na iniuutos ng talata kay Abraham at sa kanyang lahi ang katapatan sa tipan. Ang “tuparin” ay likas sa Tagalog para sa pagsunod sa tipan at hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Kolektibong saklaw ng זֶרַע
  choice: lahi
  alternative: binhi
  rationale: Pinananatili ng “lahi” ang kolektibong pagtukoy sa mga magmumula kay Abraham, samantalang itinatala sa talababa ang literal na metapora upang hindi mawala ang anyong Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang pag-uulit ng “ikaw” upang maipakita ang diin ng tekstong Hebreo, kahit bahagya itong mas pormal kaysa sa karaniwang usapan.
