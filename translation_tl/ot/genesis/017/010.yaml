base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/010.yaml
  text: 'This is my covenant[a], which you shall keep, between me and you and your offspring after you: every male among you shall be circumcised.'
translation:
  language: tl
  text: 'Ito ang aking tipan na dapat ninyong tuparin, sa pagitan ko at ninyo at ng iyong mga salinlahi[a] pagkatapos mo: dapat tuliin ang bawat lalaki sa inyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iyong supling.” Ang Hebreong זֶרַע ay isang kolektibong katawagan na maaaring tumukoy sa supling o sa mga salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת בְּרִיתִי
  choice: Ito ang aking tipan
  rationale: Likas sa Filipino ang sugnay na may “ang” upang ipakilala ang tipan; ang “tipan” ang malinaw at kinikilalang katumbas ng בְּרִית sa kontekstong biblikal.
- source_word: אֲשֶׁר תִּשְׁמְרוּ
  choice: na dapat ninyong tuparin
  rationale: Ipinahahayag ng imperfect ang obligasyong kaugnay ng tipan. Mas angkop sa Filipino ang “tuparin” para sa pagpapanatili at pagsunod sa tipan kaysa sa literal na “ingatan.”
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ
  choice: sa pagitan ko at ninyo at ng iyong mga salinlahi pagkatapos mo
  rationale: Pinananatili ang paglipat ng Hebreo mula sa maramihang “ninyo” tungo sa isahang “iyong…mo,” na muling tumutukoy kay Abraham. Isinalin ang kolektibong זֶרַע bilang “mga salinlahi” upang maging malinaw at natural sa modernong Filipino.
- source_word: הִמּוֹל
  choice: dapat tuliin
  rationale: Ang infinitive absolute ay nagsasaad dito ng hinihinging gawain. Ang “dapat tuliin” ay malinaw na naghahatid ng obligasyon nang hindi ginagawang tahasang aktibo ang anyong hindi tumutukoy kung sino ang magsasagawa.
- source_word: לָכֶם כָּל זָכָר
  choice: ang bawat lalaki sa inyo
  rationale: Ang “sa inyo” ay natural na nagpapahayag ng saklaw ng kautusan, at pinananatili ng “bawat lalaki” ang tahasang pagtukoy ng Hebreo sa lahat ng lalaki.
theological_decisions:
- issue: Saklaw ng utos tungkol sa pagtutuli
  choice: dapat tuliin ang bawat lalaki sa inyo
  alternative: dapat tuliin ang bawat isa sa inyo
  rationale: Tahasang sinasabi ng כָּל זָכָר na ang hinihinging tanda ay para sa bawat lalaki; hindi ito ginawang pangkalahatan sa lahat ng tao.
- issue: Paglipat mula sa maramihan tungo sa isahang kausap
  choice: ninyo … iyong mga salinlahi … mo
  alternative: ninyo … inyong mga salinlahi … ninyo
  rationale: 'Pinananatili nito ang tunay na pagbabago ng bilang sa tekstong Hebreo: maramihan sa בֵינֵיכֶם ngunit isahan sa זַרְעֲךָ at אַחֲרֶיךָ. Hindi ito pinantay upang hindi mawala ang pagtukoy kay Abraham.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tipan” bilang nakaugaliang terminong biblikal, ngunit iniwasan ang lipas na ayos ng pangungusap. Sadyang pinanatili ang salit-salitang paglipat mula “ninyo” tungo sa “iyong…mo” dahil naroon ito sa Hebreo.
