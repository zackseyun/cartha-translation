  terminology: Ang “tipan” ay angkop at pare-pareho para sa בְּרִית. Ang “mga salinlahi” ay natural na kolektibong salin ng זֶרַע sa kontekstong ito, at ang talababa ay wastong nagbibigay ng “iyong supling” bilang alternatibo. Tumpak ang “bawat lalaki” para sa כָּל זָכָר at ang “tuliin” para sa hinihinging pagtutuli.
