  text: When he finished speaking with him[a], God went up from Abraham.
translation:
  language: tl
  text: Nang matapos makipag-usap ang Diyos kay Abraham, umakyat ang Diyos mula kay Abraham.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “pumanhik ang Diyos mula kay Abraham.” Ginagamit sa Hebreo ang pandiwang “umakyat/pumanhik,” na naglalarawan sa pagtatapos ng pagpapakita ng Diyos sa paraang panlunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: Nang matapos siya
  rationale: Ang wayyiqtol ng כלה ay nagsasaad ng natapos na kilos. Ginamit ang “Nang matapos” upang natural na ipakita ang temporal na kaugnayan nito sa kasunod na pangunahing kilos.
- source_word: לְדַבֵּר
  choice: makipag-usap
  rationale: Kasunod ng כלה, bumubuo ito ng idyomang “matapos magsalita.” Ang “makipag-usap” ay angkop dito dahil ang אִתּוֹ ay nagpapahiwatig ng pakikipag-ugnayan, hindi lamang pagsasalita tungo sa isang tao.
- source_word: אִתּוֹ
  choice: kay Abraham
  rationale: Literal itong “sa/kasama niya.” Tinukoy si Abraham ayon sa malinaw na konteksto upang maiwasan ang malabong sunod-sunod na panghalip sa Tagalog.
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Pinananatili ng “umakyat” ang kongkretong patayong larawan ng עלה at hindi ito pinapaliit tungo lamang sa abstraktong “umalis.”
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman anyong maramihan ang pangngalan, isahan ang pandiwa at iisang Diyos ang tinutukoy sa konteksto.
- source_word: מֵעַל
  choice: mula sa piling ni Abraham
  rationale: Ang מֵעַל ay literal na “mula sa ibabaw/patong.” Sa konteksto ng pagtatapos ng pagpapakita ng Diyos, natural sa Tagalog ang “mula sa piling,” habang ang pandiwang “umakyat” ay nagpapanatili sa spatial na larawan.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa Filipino.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pag-alis ng Diyos
  choice: Pinanatili ang spatial na pananalitang “umakyat ang Diyos.”
  alternative: “umalis ang Diyos” o “lumisan ang Diyos”
  rationale: Kongkretong pag-akyat ang inilalarawan ng Hebreo. Pinananatili nito ang paraan ng salaysay sa pagtatapos ng pagpapakita ng Diyos nang hindi ipinapaliwanag o nilulutas ang teolohikal na tensiyon tungkol sa presensiya ng Diyos.
translation_notes:
  register: Makabago at marangal na Filipino. Pinili ang natural na “makipag-usap” at “mula sa piling,” habang pinanatili sa “umakyat” ang mahalagang kongkretong larawan ng tekstong Hebreo.
