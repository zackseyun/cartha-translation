  source_fidelity: Ang “umakyat ang Diyos” ay wastong tumutugon sa וַיַּעַל at napapanatili ang larawang patayo ng Hebreo. Gayunman, ang “mula sa piling ni Abraham” ay mas malambot at mas interpretatibo kaysa מֵעַל (“mula sa/sa ibabaw ni Abraham”). Ang “mula kay Abraham” ay mas tuwiran at kasabay nito'y natural pa rin sa salaysay.
  naturalness: Makabago at malinaw ang pangkalahatang Tagalog. Ngunit ang “Nang matapos siyang makipag-usap” ay may panghalip na nauuna sa malinaw na pangngalang tinutukoy nito at maaaring panandaliang makalabo. Mas malinaw ang tahasang pagtukoy sa Diyos bilang paksa ng unang sugnay.
  terminology: Ang “Diyos,” “Abraham,” at “umakyat” ay angkop at marangal. Ang “makipag-usap” ay katanggap-tanggap para sa pakikipag-usap na may kausap, bagaman ang teksto ay partikular na nagsasabing nagtapos siyang magsalita kasama si Abraham.
  issues:
