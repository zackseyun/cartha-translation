    issue: Mas interpretatibo ang “mula sa piling ni Abraham” kaysa sa Hebreong מֵעַל.
    rationale: Ang “piling” ay nagpapahiwatig ng presensiyang kasama o malapit, samantalang ang Hebreo ay gumagamit ng panlunang “mula sa ibabaw/mula kay.” Ang “mula kay Abraham” ay mas malapit sa pinagmulan nang hindi nagiging di-natural.
  - severity: low
    issue: Hindi agad malinaw ang tinutukoy ng “siyang” sa unang sugnay.
    rationale: Lumilitaw lamang ang “Diyos” sa kasunod na sugnay. Ang pagbanggit sa Diyos sa unang sugnay ay nagpapalinaw sa sintaks nang hindi nagdaragdag ng kahulugan.
