  text: The one born in your house and the one bought with your money must surely be circumcised[c][b][a], and my covenant shall be in your flesh as an everlasting covenant.
translation:
  language: tl
  text: Ang ipinanganak sa iyong sambahayan at ang binili mo sa pamamagitan ng iyong salapi ay dapat ngang tuliin[a][b][c]. At ang aking tipan ay magiging nasa inyong laman bilang isang walang-hanggang tipan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tiyak na dapat tuliin.” Gumagamit ang Hebreo ng infinitive absolute kasama ng pandiwang nasa imperfect upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: Ang mga Hebreong pananalitang “ipinanganak sa sambahayan” at “binili sa pamamagitan ng salapi” ay tumutukoy sa mga kasapi ng sambahayan ni Abraham, kabilang ang mga ipinanganak doon at ang mga nakuha sa pamamagitan ng pagbili.
    reason: cultural_note
  - marker: c
    text: 'Maaari ring isalin: “Ang lalaking ipinanganak sa iyong sambahayan at ang lalaking binili mo sa pamamagitan ng iyong salapi.”'
    reason: previous_rendering
lexical_decisions:
- source_word: הִמּוֹל יִמּוֹל
  choice: tiyak na dapat tuliin
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa utos. Likas sa modernong Tagalog ang “tiyak na dapat tuliin” at naipapahayag nito kapwa ang obligasyon at ang diin.
- source_word: יְלִיד בֵּיתְךָ
  choice: ang ipinanganak sa iyong sambahayan
  rationale: Ang literal na diwa ay “ipinanganak sa bahay/sambahayan.” Pinananatili ng salin ang pagtukoy sa kasapi ng sambahayan nang hindi nagdaragdag sa mismong parirala ng katayuang alipin.
- source_word: וּמִקְנַת כַּסְפֶּךָ
  choice: ang binili mo ng iyong salapi
  rationale: Tumutukoy ito sa isang taong nakuha sa pamamagitan ng pagbili. Ang “salapi” ay malinaw at likas sa marangal na modernong Tagalog.
- source_word: בְרִיתִי
  choice: ang aking tipan
  rationale: Karaniwang katumbas ng בְּרִית ang “tipan,” at mahalagang panatilihing hayag ang wikang pangtipan.
- source_word: בִּבְשַׂרְכֶם
  choice: mapapasa inyong laman
  rationale: Ipinahahayag ng pariralang ito na ang tipan ay nasa katawan sa pamamagitan ng tanda ng pagtutuli. Pinananatili ng “sa inyong laman” ang tuwirang ugnayan ng tipan at katawan.
- source_word: לִבְרִית עוֹלָם
  choice: bilang isang walang-hanggang tipan
  rationale: Ang לְ ay nagpapakita rito ng tungkulin o kinalabasan; malinaw itong naihahatid ng “bilang.” Ang “walang-hanggang tipan” ay tumpak at nauunawaang salin ng בְּרִית עוֹלָם.
theological_decisions:
- issue: Ang kaugnayan ng tanda ng tipan sa katawan
  choice: Tahasang sinasabi na ang tipan ay mapapasa kanilang laman bilang walang-hanggang tipan, nang hindi ipinaliliwanag kung ang tanda ay sagisag lamang o may mas matibay na pagkakaugnay sa tipan.
  alternative: Ipaliwanag ang pagtutuli bilang sagisag lamang ng pagiging kabilang sa tipan, o kilalanin ang tanda at ang tipan sa mas malakas na paraang sakramental.
  rationale: Pinananatili nito ang tuwirang pananalita at teolohikal na tensiyon ng Hebreo nang hindi nag-aangkat ng sistemang doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” upang maipakita ang mas malawak na diwa ng Hebreong “bahay,” at pinanatili ang “laman” at “tipan” dahil mahalaga ang mga ito sa konkretong at teolohikal na pananalita ng talata.
