  naturalness: Mas natural sa modernong Filipino ang “dapat ngang tuliin” para sa mariing obligasyon at “ay magiging nasa inyong laman” para sa direktang diwa ng Hebreo. Ang “mapapasa inyong laman” ay hindi karaniwang anyo sa ganitong kahulugan.
