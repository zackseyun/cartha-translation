revisions:
- from: Ang ipinanganak sa iyong sambahayan at ang binili mo ng iyong salapi ay tiyak na dapat tuliin[a][b][c]. Sa gayon, ang aking tipan ay mapapasa inyong laman bilang isang walang-hanggang tipan.
  to: Ang ipinanganak sa iyong sambahayan at ang binili mo sa pamamagitan ng iyong salapi ay dapat ngang tuliin[a][b][c]. At ang aking tipan ay magiging nasa inyong laman bilang isang walang-hanggang tipan.
  rationale: Pinalitan ang di-likas na “mapapasa inyong laman” ng tuwirang “magiging nasa inyong laman,” at ang “Sa gayon” ng “At,” upang mapanatili ang syntax at diwa ng Hebreo. Inayos ang mariing pasibong pahayag tungkol sa pagtutuli at ang kaugnay na talababa upang hindi maging aktibo ang pandiwa. Pinanatili ang mga pangunahing terminong pangtipan at ang di-pagpapataw ng paliwanag na doktrinal.
