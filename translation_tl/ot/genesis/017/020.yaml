    rationale: May layong “siya” ang pandiwang Hebreo. Bagaman mahihinuha ito sa draft, mas malinaw at mas natural sa modernong Tagalog ang “lubhang pararamihin ko siya.”
  - severity: low
    issue: “Dakilang bansa” ay bahagyang mas malawak kaysa sa pangunahing diwa ng גָּדוֹל.
    rationale: Sa kontekstong ito, ang “malaking bansa” ay mas tuwiran para sa laki at dami ng sambayanan, nang hindi nagdaragdag ng konotasyong moral o seremonyal.
