base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/020.yaml
  text: And as for Ishmael, I have heard you. Look, I have blessed him, and will make him fruitful, and will multiply him exceedingly. He will father twelve princes, and I will make him into a great nation.
translation:
  language: tl
  text: Tungkol naman kay Ismael, dininig kita. Tingnan mo, pinagpala ko siya; gagawin ko siyang mabunga at lubhang pararamihin ko siya. Magiging ama siya ng labindalawang pinuno, at gagawin ko siyang isang malaking bansa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתִּיךָ
  choice: dininig kita
  rationale: Ipinapahayag ng pandiwa ang pakikinig na may pagtugon sa kahilingan ni Abraham; pinananatili ng “dininig” ang dignidad at likas na idyomang biblikal nang hindi dinaragdagan ang sinabi.
- source_word: הִנֵּה
  choice: Masdan mo
  rationale: Isang pantawag-pansin na akma sa marangal na salaysay; mas natural sa kontekstong ito kaysa sa literal ngunit impormal na “tingnan mo.”
- source_word: וְהִפְרֵיתִי אֹתוֹ
  choice: gagawin ko siyang mabunga
  rationale: Pinananatili ang metaporang Hebreo tungkol sa pagkamabunga, na sa konteksto ay tumutukoy sa pagdami ng mga inapo.
- source_word: בִּמְאֹד מְאֹד
  choice: lubhang
  rationale: Inihahatid ang matinding pag-uulit na Hebreo sa natural at mariing Tagalog.
- source_word: נְשִׂיאִם
  choice: mga pinuno
  rationale: Ang salita ay tumutukoy sa mga pinuno o pangulo ng mga lipi; “pinuno” ang malinaw at hindi labis na tiyak na katumbas sa modernong Tagalog.
- source_word: יוֹלִיד
  choice: Magiging ama siya ng
  rationale: Literal itong “mag-aanak/magkakaanak,” ngunit ang panlalaking simuno at kasunod na mga pinuno ay natural na naihahayag sa Tagalog bilang “magiging ama siya ng.”
- source_word: לְגוֹי גָּדוֹל
  choice: isang dakilang bansa
  rationale: Pinananatili ang saklaw ng גּוֹי bilang isang malaking sambayanan o bansa at ang marangal na diin ng גָּדוֹל.
theological_decisions:
- issue: Ugnayan ng pagpapala kay Ismael sa tipan kay Isaac
  choice: Isinalin lamang ang tahasang pagpapala at pangakong pagdami kay Ismael.
  alternative: Ipahiwatig sa talata na hiwalay o mababa ang pagpapalang ito kaysa sa tipan kay Isaac.
  rationale: Hindi dapat ipasok sa mismong talata ang paghahambing na nililinaw sa nakapaligid na konteksto; pinananatili rito ang positibo at tuwirang pangako ng tekstong Hebreo.
- issue: Panahunan ng הִנֵּה בֵּרַכְתִּי
  choice: “pinagpala ko siya”
  alternative: “pagpapalain ko siya”
  rationale: Ang anyong perfect na may הִנֵּה ay naghahayag ng pagpapala bilang tiyak at ipinagkaloob na, samantalang ang kasunod na mga pandiwa ay naglalarawan ng magiging katuparan nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Tungkol naman kay Ismael” upang natural na katawanin ang paglipat ng paksa, at “Masdan mo” bilang dignified na pantawag-pansin. Walang footnote dahil hindi kailangan para sa malinaw na paglathala ng talata.
