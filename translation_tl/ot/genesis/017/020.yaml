  terminology: Ang “Ismael,” “mabunga,” “labindalawang pinuno,” at “malaking bansa” ay angkop. Ang “malaking bansa” ay mas tuwirang naghahatid ng גּוֹי גָּדוֹל kaysa “dakilang bansa,” na maaari ring magpahiwatig ng moral o maringal na kadakilaan.
  issues:
