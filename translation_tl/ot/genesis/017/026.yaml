  text: On that very day Abraham and his son Ishmael were circumcised.
translation:
  language: tl
  text: Noong mismong araw na iyon, tinuli sina Abraham at ang anak niyang si Ismael.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Nang araw ding iyon
  rationale: Ipinahahayag ng buong idyoma ang mariing pagtukoy sa mismong araw na iyon. Ang “araw ding iyon” ay natural sa modernong Tagalog at pinananatili ang diin ng Hebreo.
- source_word: נִמּוֹל
  choice: tinuli
  rationale: Ang anyong Hebreo ay pasibo at isahan, bagaman sinusundan ng tambalang simuno. Sa Tagalog, hindi nagbabago ang anyo ng pandiwa ayon sa bilang; natural na ipinahihiwatig ng “tinuli” na kapwa sumailalim sa pagtutuli sina Abraham at Ismael.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Karaniwang anyo ng pangalang Hebreo sa Tagalog.
- source_word: וְיִשְׁמָעֵאל
  choice: at ... Ismael
  rationale: Tuwirang isinalin ang pangatnig, at ginamit ang karaniwang anyo ng pangalan sa Tagalog.
- source_word: בְּנוֹ
  choice: ang anak niyang
  rationale: Tinutukoy ng hulaping panghalip na si Ismael ay anak ni Abraham. Natural sa Tagalog ang “ang anak niyang si Ismael” at malinaw nitong pinananatili ang ugnayan.
