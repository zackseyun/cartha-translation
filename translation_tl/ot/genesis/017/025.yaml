  text: And Ishmael his son was thirteen years old when the flesh of his foreskin was circumcised[a].
translation:
  language: tl
  text: At si Ismael, na kanyang anak, ay labintatlong taong gulang nang tuliin siya sa balat na tumatakip sa dulo ng kanyang ari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “nang tuliin ang laman ng kanyang dulong-balat.”
    reason: Pinananatili ang mas literal na kongkretong pananalita ng בְּשַׂר עָרְלָתוֹ, samantalang ang pangunahing teksto ay gumagamit ng mas malinaw na modernong Filipino.
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  choice: At ... si Ismael
  rationale: Isinalin ang ו bilang “At” upang mapanatili ang tuloy-tuloy na daloy ng salaysay; ginamit ang karaniwang anyong Filipino ng pangalang Ismael.
- source_word: בְּנ֔/וֹ
  choice: na kanyang anak
  rationale: Tuwirang ipinakikilala si Ismael bilang anak niya, ayon sa construct noun na may panlaping 3ms.
- source_word: בֶּן שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: labintatlong taong gulang
  rationale: Ito ang likas na modernong Filipino para sa karaniwang Hebreong pahayag ng edad.
- source_word: בְּ/הִמֹּל/וֹ
  choice: nang tuliin siya
  rationale: Ang ב na may infinitive construct ay temporal (“nang”), at ang Niphal ng מול ay ipinahayag bilang pasibong diwa habang pinananatiling si Ismael ang taong tinuli.
- source_word: אֵת
  choice: '[hindi bukod na isinalin]'
  rationale: Ang pananda ng tiyak na layon sa Hebreo ay walang hiwalay na katumbas sa Filipino at naipapakita na ng ayos ng pangungusap.
- source_word: בְּשַׂר עָרְלָת/וֹ
  choice: sa balat na tumatakip sa dulo ng kanyang ari
  rationale: Inihahayag sa malinaw at karaniwang Filipino ang anatomikal na tinutukoy ng עָרְלָה, habang ang mas literal na “laman ng kanyang dulong-balat” ay inilagay sa talababa upang mapanatili ang kongkretong anyo ng Hebreo.
