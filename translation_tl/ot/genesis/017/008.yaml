revisions:
- from: At ibibigay ko sa iyo at sa iyong lahi pagkamatay mo ang lupaing pinanirahan mo bilang dayuhan[a]—ang buong lupain ng Canaan—bilang pag-aaring walang hanggan.[b] At ako ang magiging Diyos nila.
  to: At ibibigay ko sa iyo at sa iyong mga supling pagkaraan mo ang lupain ng iyong paninirahan bilang dayuhan[a]—ang buong lupain ng Canaan—bilang pag-aaring walang hanggan.[b] At ako ang magiging Diyos nila.
  rationale: Pinalitan ang “pagkamatay mo” ng “pagkaraan mo” upang mapanatili ang bukas at hindi espesipikong temporal na kahulugan ng אַחֲרֶיךָ. Pinalitan din ang nakaraang “pinanirahan mo” ng “iyong paninirahan bilang dayuhan” upang mas tapat na maihatid ang מְגוּרִים bilang katayuan ng paninirahan ng isang dayuhan. Pinanatili ang apposition na “ang buong lupain ng Canaan,” ang pangmatagalang pag-aari, at ang pormula ng tipan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:54:18Z'
