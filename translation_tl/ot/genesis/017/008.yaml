base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/008.yaml
  text: And I will give to you and to your offspring after you the land of your sojournings—all the land of Canaan—as an everlasting possession[b][a], and I will be their God.
translation:
  language: tl
  text: At ibibigay ko sa iyo at sa iyong mga supling pagkaraan mo ang lupain ng iyong paninirahan bilang dayuhan[a]—ang buong lupain ng Canaan—bilang pag-aaring walang hanggan.[b] At ako ang magiging Diyos nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lupain kung saan ka naninirahan bilang dayuhan.”
    reason: lexical_alternative
  - marker: b
    text: O “upang maging pag-aaring walang hanggan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: At ibibigay ko
  rationale: Ang Qal perfect na may waw sa konteksto ng tipan ay nagpapahayag ng pangakong gagawin sa hinaharap; natural itong isalin sa Filipino bilang “ibibigay ko.”
- source_word: לְךָ
  choice: sa iyo
  rationale: Tuwirang tumutukoy kay Abraham bilang unang tatanggap ng ipinangakong lupain.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: at sa iyong lahi pagkamatay mo
  rationale: Ang זֶרַע ay pangngalang kolektibo, kaya pinili ang “lahi” upang saklawin ang mga magmumula kay Abraham. Sa kontekstong ito, ang אַחֲרֶיךָ ay nagpapahiwatig ng mga susunod sa kanya; ang “pagkamatay mo” ay likas na Filipino at malinaw na naghahayag ng paghalili ng mga salinlahi.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: ang lupaing pinanirahan mo bilang dayuhan
  rationale: Ang מְגוּרִים ay paninirahan ng isang taong hindi taal na mamamayan o permanenteng may-ari. Nililinaw ng salin ang katayuan ni Abraham bilang dayuhang naninirahan, hindi lamang bilang taong nagpapalipat-lipat.
- source_word: אֵת כָּל אֶרֶץ כְּנַעַן
  choice: ang buong lupain ng Canaan
  rationale: Ang ikalawang parirala ay appositive na tumutukoy at nagpapaliwanag sa naunang “lupain”; pinananatili ng “buong” ang saklaw ng כָּל.
- source_word: לַאֲחֻזַּת עוֹלָם
  choice: bilang pag-aaring walang hanggan
  rationale: Ang אֲחֻזָּה ay lupain o ari-ariang hawak bilang pag-aari, at ang עוֹלָם ay nagpapahayag ng patuloy o walang-hanggang bisa sa konteksto ng tipan.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: At ako ang magiging Diyos nila
  rationale: Natural na Filipino ito para sa pormula ng ugnayang tipan. Hindi nito ipinahihiwatig na saka lamang magiging Diyos ang Diyos sa ontolohikal na diwa.
theological_decisions:
- issue: Paglalahad sa pormula ng tipan nang hindi nagdaragdag ng doktrinang wala sa talata
  choice: At ako ang magiging Diyos nila
  alternative: At magiging Diyos ako para sa kanila
  rationale: Ang Hebreo ay nagpapahayag ng natatanging ugnayan sa tipan, hindi ng pagbabago sa pagka-Diyos ng Diyos. Ang piniling anyo ay natural, marangal, at tapat sa pormula.
- issue: Saklaw ng עוֹלָם sa pangakong lupain
  choice: walang hanggan
  alternative: panghabang-panahon
  rationale: Pinananatili ng “walang hanggan” ang matibay at bukas na temporal na puwersa ng salita sa halip na limitahan ito ayon sa isang partikular na sistemang teolohikal.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “lahi” bilang kolektibong katawagan sa mga magmumula kay Abraham, at tahasang ipinahayag ang katayuan niyang dayuhan upang maihatid ang diwa ng מְגוּרִים. Ang mga gitling ay nagpapakita na ang “buong lupain ng Canaan” ay paliwanag sa naunang parirala.
