  - severity: medium
    issue: Ang “lupaing pinanirahan mo” ay masyadong nakatuon sa nakaraang paninirahan.
    rationale: Ang אֶרֶץ מְגֻרֶיךָ ay “lupain ng iyong paninirahan/sojournings,” na naglalarawan sa katayuan ni Abraham bilang dayuhang naninirahan at hindi lamang sa isang natapos na paninirahan.
