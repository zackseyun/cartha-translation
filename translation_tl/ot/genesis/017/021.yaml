  text: וְ/אֶת בְּרִיתִ֖/י אָקִ֣ים אֶת יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְ/ךָ֤ שָׂרָה֙ לַ/מּוֹעֵ֣ד הַ/זֶּ֔ה בַּ/שָּׁנָ֖ה הָ/אַחֶֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/021.yaml
  text: But I will establish my covenant with Isaac[a], whom Sarah will bear to you at this time next year.
translation:
  language: tl
  text: Ngunit itatatag ko ang tipan ko kay Isaac[a], na ipanganganak ni Sara para sa iyo sa takdang panahong ito sa susunod na taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At itatatag ko ang tipan ko kay Isaac.” Maaari ring isaling payak na “at” ang pang-ugnay na Hebreo, ngunit ipinahihiwatig ng konteksto ang pagkakaiba nito sa pangako tungkol kay Ismael sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Ngunit ang
  rationale: Ang waw ay payak na pang-ugnay na maaari ring isaling “At,” ngunit sa konteksto ay minamarkahan nito ang pagtutol o pagkakaiba sa pangako tungkol kay Ismael sa naunang talata.
- source_word: בְּרִיתִי
  choice: ang tipan ko
  rationale: Karaniwan at malinaw na katumbas ng בְּרִיתִי sa konteksto ng tipan sa Genesis.
- source_word: אָקִים
  choice: pagtitibayin ko
  rationale: Ang Hiphil ng קום sa konteksto ng tipan ay tumutukoy sa pagtatatag o matibay na pagpapatibay; natural sa Filipino ang “pagtitibayin ko” at hindi nito ipinahihiwatig na pansamantala lamang ang tipan.
- source_word: אֶת יִצְחָק
  choice: kay Isaac
  rationale: Bagaman pananda ng tuwirang layon ang אֶת, hinihingi ng natural na Filipino ang “kay” upang tukuyin si Isaac bilang kaugnay na panig ng tipan.
- source_word: אֲשֶׁר תֵּלֵד לְךָ שָׂרָה
  choice: na isisilang sa iyo ni Sara
  rationale: Pinananatili ang pagkakakilanlan kay Isaac bilang anak na ipanganganak ni Sara para kay Abraham, sa natural at dignified na Filipino.
- source_word: לַמּוֹעֵד הַזֶּה
  choice: sa takdang panahong ito
  rationale: Ang מוֹעֵד ay isang itinakda o tiyak na panahon, kaya mas ganap na naipapahayag ng “takdang panahon” kaysa ng payak na “panahon.”
- source_word: בַּשָּׁנָה הָאַחֶרֶת
  choice: sa susunod na taon
  rationale: Natural na Filipino para sa literal na diwang “sa kasunod na taon.”
theological_decisions:
- issue: Ang linya ng tipan ay kay Isaac, hindi kay Ismael
  choice: Malinaw na sinasabi ng talata na pagtitibayin ng Diyos ang kanyang tipan kay Isaac.
  alternative: Maaaring gawing malabo kung ang tipan ay kay Isaac o basta may kaugnayan lamang sa kanya.
  rationale: Tuwirang tinutukoy ng Hebreo si Isaac bilang kaugnay na panig ng tipan, ngunit hindi nagdaragdag ang salin ng mga teolohikong konklusyon na lampas sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tipan” bilang pamilyar na terminong biblikal at ang bahagyang minarkahang ayos na “ang tipan ko ay pagtitibayin ko” upang mapanatili ang diin ng Hebreo sa tipan.
