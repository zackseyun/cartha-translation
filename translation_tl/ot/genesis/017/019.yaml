base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/019.yaml
  text: And God said[a], “No, but Sarah your wife shall bear you a son, and you shall call his name Isaac. And I will establish my covenant with him as an everlasting covenant for his offspring after him.”
translation:
  language: tl
  text: At sinabi ng Diyos, “Hindi, kundi ang asawa mong si Sara ang magsisilang para sa iyo ng isang anak na lalaki, at tatawagin mo siyang Isaac.[a] Itatatag ko ang aking tipan sa kanya bilang tipang walang hanggan para sa kanyang mga supling pagkaraan niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Isaac ay kahawig ng pandiwang Hebreo na nangangahulugang “tumatawa siya” o “tatawa siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Hindi. Ang
  rationale: Sa konteksto, itinatama ng Diyos ang naunang pakiusap ni Abraham tungkol kay Ismael. Ang “Hindi” ay naghahatid ng pagtanggi, at ang kasunod na pangungusap ay natural na nagpapahayag ng pagtatama sa modernong Tagalog.
- source_word: יֹלֶדֶת לְךָ בֵּן
  choice: magsisilang ng isang anak na lalaki para sa iyo
  rationale: Ang participle ay may panghinaharap na diwa sa konteksto ng pangako. Nililinaw ng “anak na lalaki” ang בֵּן, at pinananatili ng “para sa iyo” ang לְךָ.
- source_word: וְקָרָאתָ אֶת־שְׁמוֹ
  choice: tatawagin mo siyang
  rationale: Natural na pormula ng pagpapangalan sa modernong Tagalog, habang pinananatili ang tuwirang utos/pahayag sa ikalawang panauhan.
- source_word: יִצְחָק
  choice: Isaac
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa Filipino; ipinaliliwanag sa talababa ang kaugnayan nito sa pandiwang Hebreo para sa pagtawa.
- source_word: וַהֲקִמֹתִי אֶת־בְּרִיתִי אִתּוֹ
  choice: Itatatag ko ang aking tipan sa kanya
  rationale: Ang “itatatag” ay angkop sa idyomang pangtipan at pinananatili ng “sa kanya” ang pakikipag-ugnayan ng tipan kay Isaac.
- source_word: לִבְרִית עוֹלָם
  choice: bilang isang walang-hanggang tipan
  rationale: Ang “bilang” ay nagpapahayag ng pagtatalaga o resulta, at ang “walang-hanggan” ay naghahatid ng patuloy na katangian ng עוֹלָם nang magdagdag ng pilosopikal na pakahulugan.
- source_word: לְזַרְעוֹ אַחֲרָיו
  choice: para sa kanyang mga supling na susunod sa kanya
  rationale: Ang “mga supling” ay natural sa Tagalog at kumakatawan sa kolektibong kahulugan ng זֶרַע; ang “na susunod sa kanya” ay nagpapanatili sa temporal at salinlahing diwa ng אַחֲרָיו.
theological_decisions:
- issue: Saklaw at pagpapatuloy ng pangako ng tipan
  choice: Tuwirang ihayag na itatatag ng Diyos ang kanyang tipan kay Isaac at para sa mga supling nito na susunod sa kanya.
  alternative: Limitahan ito sa isang etniko o pambansang pangako lamang, o ipakahulugan agad ayon sa isang mas huling sistemang teolohikal.
  rationale: Ganito ang tahasang sinasabi ng Hebreo. Hindi dapat paliitin o palawakin ng salin ang saklaw nito lampas sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tipan,” “mga supling,” at “walang-hanggan” bilang malinaw at angkop na mga terminong biblikal. Inilagay ang talababa pagkatapos ng “Isaac,” kung saan pinakamalinaw ang kaugnayan nito sa pangalan.
