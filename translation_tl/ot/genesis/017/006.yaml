base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/006.yaml
  text: And I will make you exceedingly fruitful[a], and I will make nations from you[b], and kings will come from you.
translation:
  language: tl
  text: At lubha kitang pararamihin[a], at gagawin kitang pinagmumulan ng mga bansa; magmumula sa iyo ang mga hari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Gagawin kitang mabunga nang lubhang-lubha.”'
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “Lalabas mula sa iyo ang mga hari.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְרֵתִי
  choice: At ... kitang pararamihin
  rationale: 'Ang Hiphil ng פרה ay causative: gagawin ng Diyos na maging mabunga at dumami si Abraham. Sa pangako tungkol sa mga inapo, natural sa modernong Tagalog ang “pararamihin” at malinaw nitong naipahihiwatig ang pagdami ng lahi.'
- source_word: בִּמְאֹד מְאֹד
  choice: lubha
  rationale: Ang pag-uulit ng מְאֹד ay matinding pagpapalakas. Ang “lubha” ay marangal at likas na Tagalog na nagpapahayag ng napakalaking antas; inilalahad sa talababa ang higit na literal na anyo.
- source_word: וּנְתַתִּיךָ לְגוֹיִם
  choice: magmumula sa iyo ang mga bansa
  rationale: 'Sa konteksto ng tipan at mga inapo, ipinahihiwatig ng נתן + ל ang bunga o kalalabasan: si Abraham ang pagmumulan ng maraming bansa. Iniiwasan nito ang di-likas na literal na “ibibigay kita bilang mga bansa.”'
- source_word: לְגוֹיִם
  choice: mga bansa
  rationale: Ang גּוֹיִם dito ay mga bansa o sambayanan na magmumula kay Abraham, hindi partikular na mga Hentil. “Mga bansa” ang tuwiran at karaniwang katumbas.
- source_word: וּמְלָכִים
  choice: at ... ang mga hari
  rationale: Tiyak na tumutukoy ang מְלָכִים sa mga hari; mas eksakto ito kaysa sa mas malawak na “mga pinuno.”
- source_word: מִמְּךָ יֵצֵאוּ
  choice: magmumula sa iyo
  rationale: Literal na “lalabas mula sa iyo,” ngunit sa kontekstong genealogical, natural na ipinapahayag sa Tagalog bilang “magmumula sa iyo.”
theological_decisions:
- issue: Saklaw ng ipinangakong mga inapo ni Abraham
  choice: Ipinapangako ng talata na si Abraham ang pagmumulan ng maraming bansa at mga hari.
  alternative: Maaaring unawain nang mas abstrakto na bibigyan siya ng katayuan kaugnay ng mga bansa.
  rationale: Ang malapit na konteksto ng tipan ay nakatuon sa pagdami ng mga inapo at sa kanilang linya. Pinananatili ng salin ang genealogical na diwa nang hindi nagdaragdag ng anumang sistemang teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pararamihin” para maging natural sa konteksto ng pagdami ng lahi, samantalang ang mga talababa ay nagpapanatili ng higit na literal na mga anyo ng dalawang matitinding o idiomatikong parirala.
