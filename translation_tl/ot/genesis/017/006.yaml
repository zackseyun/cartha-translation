  naturalness: Malinaw at marangal ang register. Ang “lubha kitang pararamihin” at “magmumula sa iyo ang mga hari” ay natural sa modernong Filipino Tagalog. Ang inayos na ikalawang sugnay ay nagpapanatili ng parehong daloy habang nililinaw ang ugnayan ng Diyos bilang kumikilos.
  terminology: Ang “mga bansa” para sa גּוֹיִם at “mga hari” para sa מְלָכִים ay wasto. Ang “pinagmumulan” ay angkop sa kontekstong ang mga bansa ay nagmumula sa lahi ni Abraham. Itinutuwid din ang talababa a upang ang sinasabing mas literal ay tumukoy sa pagiging “mabunga,” hindi lamang sa pagpaparami.
