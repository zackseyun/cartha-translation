id: GEN.17.5
reference: Genesis 17:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לֹא יִקָּרֵ֥א ע֛וֹד אֶת שִׁמְ/ךָ֖ אַבְרָ֑ם וְ/הָיָ֤ה שִׁמְ/ךָ֙ אַבְרָהָ֔ם כִּ֛י אַב הֲמ֥וֹן גּוֹיִ֖ם נְתַתִּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/005.yaml
  text: Your name shall no longer be called Abram[a], but your name shall be Abraham, for I have made you the father of a multitude of nations.
translation:
  language: tl
  text: Hindi ka na tatawaging Abram, kundi Abraham na ang magiging pangalan mo, sapagkat ginawa kitang ama ng napakaraming bansa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “ibinigay kita bilang ama ng napakaraming bansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקָּרֵא
  choice: tatawaging
  rationale: Ang nifal ng קרא sa pormula ng pagpapangalan ay pasibo; natural sa Filipino ang “tatawaging.”
- source_word: עוֹד
  choice: hindi na
  rationale: 'Kasama ng לֹא, ipinahihiwatig nito ang pagtigil mula sa puntong ito: “hindi na.”'
- source_word: שִׁמְךָ
  choice: pangalan mo
  rationale: Tuwiran at natural na salin ng pangngalan na may hulaping pangalawang panauhang panlalaki.
- source_word: אַבְרָם
  choice: Abram
  rationale: Isinalin sa karaniwang transliterasyong Filipino ng pangalang pantangi.
- source_word: וְהָיָה
  choice: kundi ... ang magiging
  rationale: Ipinakikita ng “kundi” ang malinaw na pagsalungat ng dating pangalan at bagong pangalan, habang pinananatili ng “magiging” ang pormula ng pagpapalit ng pangalan.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Isinalin sa karaniwang transliterasyong Filipino ng pangalang pantangi.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng bagong pangalan sa isang dignified ngunit madaling maunawaang rehistro.
- source_word: אַב
  choice: ama
  rationale: Ang karaniwang kahulugang “ama” ang angkop sa paliwanag sa pangalan at sa konteksto ng tipan.
- source_word: הֲמוֹן
  choice: napakaraming
  rationale: Natural na naipahahayag sa Filipino ang diwa ng malaking karamihan, bagaman ginagawang pang-uri ang nominal na anyo ng Hebreo.
- source_word: גּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy ito sa mga bansa o bayan sa malawak na diwa; iniiwasan ng “mga bansa” ang anakronistikong “mga Hentil.”
- source_word: נְתַתִּיךָ
  choice: ginawa kita
  rationale: Bagaman literal na “ibinigay kita,” ang predikatibong gamit ay natural na “ginawa kita.” Pinananatili ng aspektong naganap ang deklarasyong inihahayag bilang natupad na.
theological_decisions:
- issue: Aspekto ng deklarasyon ng Diyos sa pagkakahirang kay Abraham bilang ama ng maraming bansa
  choice: ginawa kitang ama
  alternative: gagawin kitang ama
  rationale: Perpekto ang נְתַתִּיךָ, kaya pinananatili ang kilos bilang ipinahayag nang ganap sa salita ng Diyos sa halip na gawing payak na panghinaharap. Nananatili rito ang tensiyon sa pagitan ng kasalukuyang kalagayan at ng pangakong tiyak nang itinakda.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “Hindi ka na tatawaging ... kundi ...” bilang natural na pormula ng pagpapalit ng pangalan. Inilagay ang talababa pagkatapos ng buong paliwanag upang ituro ang mas literal na anyo ng נְתַתִּיךָ.
