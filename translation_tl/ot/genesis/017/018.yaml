  text: וַ/יֹּ֥אמֶר אַבְרָהָ֖ם אֶל הָֽ/אֱלֹהִ֑ים ל֥וּ יִשְׁמָעֵ֖אל יִחְיֶ֥ה לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/018.yaml
  text: And Abraham said to God[a], “Oh, that Ishmael might live before you!”
translation:
  language: tl
  text: At sinabi ni Abraham sa Diyos, “Sana’y mabuhay si Ismael sa iyong harapan![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa iyong presensiya” o “sa ilalim ng iyong pabor.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “At sinabi” bilang pagpapatuloy ng tagpo.
- source_word: אֶל הָאֱלֹהִים
  choice: sa Diyos
  rationale: Karaniwang gamit sa Tagalog ang “sinabi ... sa Diyos” para sa pagsasalita na nakatuon sa Diyos; hindi kailangang tumbasan nang hiwalay ang artikulong Hebreo.
- source_word: לוּ
  choice: Sana’y
  rationale: Nagpapahayag dito ang לוּ ng taimtim na hangarin, hindi ng kondisyon. Likas at malinaw sa Tagalog ang “Sana’y.”
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog.
- source_word: יִחְיֶה
  choice: mabuhay
  rationale: Ang imperfect kasunod ng optative particle ay nagpapahayag ng hinihiling na buhay o patuloy na pamumuhay.
- source_word: לְפָנֶיךָ
  choice: sa iyong harapan
  rationale: Malapit ito sa literal na “sa harap ng iyong mukha/presensiya” at pinananatili ang posibleng relasyonal at tipanang pahiwatig nang hindi ito nililinaw nang labis bilang pagpapala o pabor.
theological_decisions:
- issue: Ang saklaw ng kahilingan ni Abraham tungkol kay Ismael sa harap ng Diyos
  choice: sa iyong harapan
  alternative: sa iyong presensiya; sa ilalim ng iyong pabor
  rationale: Maaaring magpahiwatig ang Hebreo ng pamumuhay sa presensiya o pabor ng Diyos, ngunit hindi tahasang tinutukoy ng talata ang buong teolohikal na kahulugan nito. Pinananatili ng pangunahing salin ang maikli at sadyang maluwag na pananalita.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ang “Sana’y” ay malinaw na naghahatid ng marubdob na hangarin nang hindi nagiging lipas o labis na pormal.
