  yaml_path: translation/ot/genesis/017/011.yaml
  text: You shall circumcise the flesh of your foreskin[a], and it shall be a sign of the covenant between me and you.
translation:
  language: tl
  text: Tuliin ninyo ang balat na bumabalot sa dulo ng inyong ari[a], at ito ay magiging tanda ng tipan sa pagitan ko at ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang laman ng inyong dulong-balat.”
    reason: Ipinakikita ang mas literal na anyo ng pariralang Hebreo; ang pangunahing teksto ay gumagamit ng malinaw at likas na anatomikong pananalita sa modernong Filipino.
lexical_decisions:
- source_word: וּנְמַלְתֶּם
  choice: Tutuliin ninyo
  rationale: Ang Qal perfect na may prefixed conjunction ay may puwersang pautos o panghinaharap sa konteksto ng tagubilin sa tipan. Ang aktibong anyo ay malinaw at likas sa modernong Filipino.
- source_word: בְּשַׂר עָרְלַתְכֶם
  choice: ang balat sa dulo ng inyong ari
  rationale: Ang parirala ay literal na tumutukoy sa “laman ng inyong dulong-balat.” Ginawang malinaw at natural ang anatomikong kahulugan sa Filipino nang hindi binabago ang tinutukoy na bahagi.
- source_word: וְהָיָה
  choice: at iyon ay magiging
  rationale: Ang “iyon” ay tumutukoy sa pagtutuling iniutos, at pinananatili ng “magiging” ang panghinaharap na diwa ng Hebreo.
- source_word: לְאוֹת
  choice: tanda
  rationale: Karaniwang kahulugan ng אוֹת ang tanda o palatandaan. Ang “tanda” ay maikli, malinaw, at angkop sa konteksto ng tipan.
- source_word: בְּרִית
  choice: ang tipan
  rationale: Tumutukoy ito sa tiyak na tipang itinatatag ng Diyos kay Abraham, kaya likas ang tiyak na anyong “ang tipan.”
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: sa pagitan ko at ninyo
  rationale: Pinananatili nito ang tuwirang ugnayan ng unang panauhang isahan at ikalawang panauhang maramihan sa Hebreo.
theological_decisions:
- issue: Ang pagtutuli bilang tanda ng tipan
  choice: tanda ng tipan
  alternative: palatandaan ng tipan
  rationale: Tapat itong naghahayag sa pagtutuli bilang covenantal sign nang hindi ipinapasok kung ito ba ay sakramento lamang, simbolo lamang, o may iba pang doktrinal na bisa na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang “ari” bilang malinaw ngunit hindi bulgar na katawagang anatomiko; ipinaaalam sa talababa ang mas literal na pahayag ng Hebreo.
