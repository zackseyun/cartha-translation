  to: Nagpatirapa si Abraham at tumawa, at sinabi niya sa kanyang sarili, “Maisisilang ba ang isang anak[a] sa isang lalaking isandaang taong gulang? At manganganak ba si Sara, na siyamnapung taong gulang?”
