base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/017.yaml
  text: Then Abraham fell on his face and laughed[a], and said in his heart, “Will a child be born to a man a hundred years old? And will Sarah, who is ninety years old, give birth?”
translation:
  language: tl
  text: Nagpatirapa si Abraham at tumawa, at sinabi niya sa kanyang sarili, “Maisisilang ba ang isang anak[a] sa isang lalaking isandaang taong gulang? At manganganak ba si Sara, na siyamnapung taong gulang?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anak na lalaki.” Ang salitang Hebreo ay בֵּן (ben), na maaaring tumukoy sa “anak” o, nang mas tiyak, “anak na lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל אַבְרָהָם עַל־פָּנָיו
  choice: Nagpatirapa si Abraham
  rationale: Ipinahahayag ng parirala ang pagdapa nang nakaharap sa lupa. Ang “nagpatirapa” ay likas at marangal na Tagalog na malinaw na nagsasaad ng buong tindig, nang hindi na kailangang gawing salitang-salita ang idyomang Hebreo.
- source_word: וַיִּצְחָק
  choice: at tumawa
  rationale: Ang צחק ay tuwirang nangangahulugang “tumawa.” Hindi nilagyan ng paglalarawan ang uri o dahilan ng pagtawa upang mapanatili ang kaugnayan nito sa pangalang Isaac at ang pagiging bukas ng salaysay sa interpretasyon.
- source_word: וַיֹּאמֶר בְּלִבּוֹ
  choice: Sinabi niya sa kanyang sarili
  rationale: Literal na “sinabi niya sa kanyang puso,” ngunit ang kasalukuyang natural na katumbas sa Filipino para sa hindi binigkas na pananalita ay “sinabi niya sa kanyang sarili.” Pinananatili nito na panloob at hindi narinig ang sinabi.
- source_word: הַלְּבֶן ... יִוָּלֵד
  choice: May isisilang pa bang anak
  rationale: Pinagsasama ng parirala ang בן, “anak/anak na lalaki,” at ang Niphal ng ילד, “isilang.” Ang “anak” ay natural sa tanong tungkol sa pagkakaroon ng supling; ang posibleng mas tiyak na “anak na lalaki” ay inilagay sa talababa. Ang “pa” ay likas na naghahayag ng retorikal na pagtataka dahil sa katandaan, nang hindi binabago ang tanong tungo sa tahasang pagtanggi.
- source_word: לְבֶן מֵאָה שָׁנָה
  choice: sa isang lalaking isandaang taong gulang
  rationale: Ang literal na idyomang “sa isang anak ng isandaang taon” ay tumutukoy sa lalaking nasa gayong edad. Isinalin ito sa malinaw at likas na anyong Filipino.
- source_word: וְאִם שָׂרָה הֲבַת תִּשְׁעִים שָׁנָה תֵּלֵד
  choice: At manganganak pa ba si Sara na siyamnapung taong gulang?
  rationale: Sa magkatambal na retorikal na mga tanong, ang וְאִם ay natural na inililipat bilang “At ... ba.” Ang “anak na babae ng siyamnapung taon” ay idyomang Hebreo para sa edad, kaya ginawang “na siyamnapung taong gulang.” Ang Qal ng ילד na may babaeng simuno ay “manganak.”
theological_decisions:
- issue: Kahulugan ng pagtawa ni Abraham
  choice: Isinalin lamang bilang “tumawa,” nang walang idinagdag na motibo o moral na hatol.
  alternative: “tumawa dahil sa hindi paniniwala” o “tumawa sa tuwa”
  rationale: Iniulat ng talata ang pagtawa at panloob na mga tanong ni Abraham ngunit hindi nito tahasang sinasabing ang pagtawa ay mapangutya, walang pananampalataya, o bunga ng galak. Dapat manatili sa salin ang tensiyong ito.
- issue: Lakas ng mga retorikal na tanong
  choice: Pinanatili bilang mga tanong na may “pa ba.”
  alternative: Gawing tahasang pahayag na imposible ang panganganak sa gayong edad.
  rationale: Ang Hebreo ay gumagamit ng mga tanong at hindi tuwirang nagpapahayag na imposible ang pangako. Ang anyong tanong ay nagpapanatili sa pagtataka ni Abraham nang hindi dinaragdagan ang teksto ng isang tiyak na hatol.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nagpatirapa” para sa biblikal na kilos ng pagdapa, samantalang ang panloob na pananalita ay ginawang natural na “sinabi niya sa kanyang sarili.” Ang talababa [a] ay inilagay mismo pagkatapos ng “anak,” na siyang salitang tinutukoy nito.
