base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/015.yaml
  text: Then God said to Abraham[a], “As for Sarai your wife, you shall not call her name Sarai, for Sarah is her name.”
translation:
  language: tl
  text: Sinabi ng Diyos kay Abraham, “Tungkol sa asawa mong si Sarai, huwag mo na siyang tawaging Sarai, sapagkat Sarah ang pangalan niya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Huwag mong tawaging Sarai ang pangalan niya, sapagkat Sarah ang pangalan niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa modernong Tagalog ang “Sinabi” sa kontekstong ito nang hindi kailangang gawing tahasan ang “at” o “pagkatapos.”
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang salin sa kontekstong tumutukoy sa iisang Diyos.
- source_word: אֶל־אַבְרָהָם
  choice: kay Abraham
  rationale: Likas na Tagalog para tukuyin ang pinagsabihan.
- source_word: שָׂרַי אִשְׁתְּךָ
  choice: Tungkol sa asawa mong si Sarai
  rationale: Pinananatili ang pagkakauna ng paksa sa Hebreo at ipinahahayag ito sa natural na ayos ng Tagalog.
- source_word: לֹא תִקְרָא אֶת־שְׁמָהּ שָׂרָי
  choice: huwag mo na siyang tawaging Sarai
  rationale: Ang imperfect na may לֹא ay gumaganap bilang banal na pagbabawal o tagubilin. Natural na ipinahihiwatig ng “na” na titigil na ang dating pagtawag, ayon sa konteksto ng pagpapalit ng pangalan.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan o paliwanag sa pagbabawal at nagpapanatili ng marangal na himig.
- source_word: שָׂרָה שְׁמָהּ
  choice: Sarah ang pangalan niya
  rationale: Pinananatili ang diin at ang walang-pandiwang pagpapahayag sa Hebreo, nang hindi tahasang nagdaragdag ng panghinaharap na “magiging.”
theological_decisions:
- issue: Pormula ng pagpapalit ng pangalan
  choice: “huwag mo na siyang tawaging Sarai, sapagkat Sarah ang pangalan niya”
  alternative: “huwag mong tawaging Sarai ang pangalan niya, sapagkat Sarah ang pangalan niya”
  rationale: Pinananatili ang tuwirang pagbabawal at ang deklarasyon ng bagong pangalan, ngunit ginagawang natural sa Tagalog ang Hebreong idyomang “tawagin ang pangalan niya.” Hindi idinaragdag sa pangunahing teksto ang tahasang “magiging,” na wala sa sugnay na Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “asawa mong si Sarai” sa halip na mas matigas na “Sarai na asawa mo,” at pinanatili ang magkaibang anyo ng mga pangalang Sarai at Sarah dahil sentro sa talata ang pagpapalit ng pangalan.
