base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/014.yaml
  text: And an uncircumcised male who is not circumcised in the flesh of his foreskin—that person shall be cut off from his people[b][a]; he has broken my covenant.
translation:
  language: tl
  text: At ang lalaking hindi tuli, na hindi natuli sa laman ng kanyang dulong-balat—ang taong iyon[a] ay puputulin[b] mula sa kanyang sambayanan; sinira niya ang aking tipan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kaluluwang iyon.” Ginagamit ng Hebreo ang salitang maaaring mangahulugang “kaluluwa,” “buhay,” o “tao”; dito ay ang mismong taong saklaw ng hatol ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Ang “puputulin” ay salin ng isang idyomang pangtipan para sa matinding paghatol. Maaaring kabilang dito ang pag-aalis sa sambayanan o kamatayan, ngunit hindi higit na tinutukoy ng talatang ito ang eksaktong anyo ng hatol.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָרֵל זָכָר
  choice: ang lalaking hindi tuli
  rationale: Tuwirang ipinapahayag ng עָרֵל זָכָר ang isang lalaking hindi tuli. Likas at malinaw ito sa makabagong Tagalog at pinananatili ang tanda ng tipan.
- source_word: אֲשֶׁר לֹא יִמּוֹל
  choice: na hindi natuli
  rationale: Ang Niphal ng מול ay may pasibo o refleksibong diwa. Ang pasibong “hindi natuli” ang pinakanatural na katumbas sa Tagalog sa pangkalahatang kondisyong legal na ito.
- source_word: אֶת בְּשַׂר עָרְלָתוֹ
  choice: sa laman ng kanyang dulong-balat
  rationale: Pinananatili nito ang tiyak at konkretong pananalita ng Hebreo sa halip na paikliin lamang bilang “hindi tuli.” Ang “dulong-balat” ay isang mahinahon ngunit anatomikong malinaw na katawagan sa foreskin.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: ang taong iyon ay ihihiwalay
  rationale: Sa kontekstong legal ng tipan, ang נֶפֶשׁ ay tumutukoy sa tao mismo, hindi kinakailangang sa isang hiwalay na di-materyal na kaluluwa. Ang “ihihiwalay” ay nagpapanatili sa mabigat na hatol ng כרת nang hindi tahasang nililimitahan ito sa pagtitiwalag o kamatayan.
- source_word: מֵעַמֶּיהָ
  choice: sa kanyang sambayanan
  rationale: Ang עַם ay ang bayang o pamayanang kinabibilangan niya. Ang “sambayanan” ay malinaw na tumutukoy sa mga tao ng tipan at hindi lamang sa isang teritoryo o bansa.
- source_word: אֶת בְּרִיתִי
  choice: ang aking tipan
  rationale: Ang “tipan” ang kinikilalang salin ng בְּרִית at pinananatili ang mahalagang temang teolohikal ng Genesis 17.
- source_word: הֵפַר
  choice: sinira niya
  rationale: Ang הפר ay nangangahulugang sirain, labagin, o pawalang-bisa ang isang tipan. Ang “sinira niya” ay malinaw, natural, at nagpapanatili sa lakas ng pandiwa.
theological_decisions:
- issue: Kahulugan ng parusang pangtipan na כרת (“ihiwalay/putulin”)
  choice: ihihiwalay
  alternative: ititiwalag sa sambayanan; papatayin
  rationale: Hindi tahasang nililinaw ng talata kung ang hatol ay eksklusyon sa sambayanan, kamatayan, o mas malawak na matinding paghatol ng tipan. Pinananatili ng salin at talababa ang hindi tinutukoy na saklaw nito.
- issue: Pagbibigay-kahulugan sa נֶפֶשׁ
  choice: tao
  alternative: kaluluwa
  rationale: Dito ay ang buong indibidwal na sumasailalim sa parusa ng tipan ang tinutukoy. Iniiwasan ng “tao” ang pagpasok ng mas makitid na pananaw tungkol sa mga sangkap ng pagkatao.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang legal at pangtipang bigat ng pangungusap, pati ang anatomikong katiyakan ng Hebreo, habang ipinaliliwanag sa mga talababa ang tunay na leksikal at teolohikal na kalabuan.
