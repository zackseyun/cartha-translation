  text: וַ/יִּפֹּ֥ל אַבְרָ֖ם עַל פָּנָ֑י/ו וַ/יְדַבֵּ֥ר אִתּ֛/וֹ אֱלֹהִ֖ים לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/003.yaml
  text: Then Abram fell on his face, and God spoke with him, saying,
translation:
  language: tl
  text: 'At nagpatirapa si Abram, at nagsalita ang Diyos kay Abram at sinabi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל ... עַל־פָּנָיו
  choice: nagpatirapa
  rationale: Ang literal na larawan ay ‘bumagsak sa kanyang mukha,’ ngunit sa konteksto ito ay sinasadyang pagpapatirapa bilang paggalang. Likas at malinaw sa modernong Tagalog ang ‘nagpatirapa.’
- source_word: אַבְרָם
  choice: Abram
  rationale: Pinanatili ang pangalang Abram sapagkat hindi pa ito pinapalitan ng Abraham sa bahaging ito ng salaysay.
- source_word: וַיְדַבֵּר אִתּוֹ
  choice: nakipag-usap sa kanya
  rationale: Ang אִתּוֹ ay literal na ‘kasama niya’; ipinahihiwatig ng ‘nakipag-usap sa kanya’ ang pakikipag-usap na nakatuon kay Abram nang hindi ginagawang mekanikal ang Tagalog.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman maramihan ang anyo ng salita, isahan ang pandiwa at tumutukoy ito rito sa iisang Diyos.
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Pormula itong nagpapakilala sa tuwirang pananalitang kasunod. Mas natural sa Tagalog ang hiwalay na ‘Sinabi niya,’ kaysa ‘na sinasabi,’ habang pinananatili ang tungkulin ng Hebreong pormula.
- source_word: וַ
  choice: Kaya
  rationale: Ipinapakita rito ang tugon ni Abram sa naunang pagpapahayag ng Diyos; ang ‘Kaya’ ay natural na nag-uugnay sa bunga at pagpapatuloy ng salaysay.
theological_decisions:
- issue: Bilang at tinutukoy ng אֱלֹהִים
  choice: ang Diyos (isahan)
  alternative: mga diyos
  rationale: Isahan ang pandiwang Hebreo at ang konteksto ay tumutukoy sa Diyos na nakikipagtipan kay Abram; mali sa gramatika at konteksto ang maramihang salin.
- issue: Diwa ng pakikipag-usap sa וַיְדַבֵּר אִתּוֹ
  choice: nakipag-usap sa kanya
  alternative: nagsalita sa kanya
  rationale: Pinananatili ng pinili ang diwa ng אִתּוֹ (‘kasama niya’) nang hindi ipinahihiwatig na kapantay ang mga kalahok o dinaragdagan ang nilalamang teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘nagpatirapa’ bilang likas na katumbas ng idyomang Hebreo, at hinati ang pormula ng pagsasalita upang maging malinaw na pambungad sa susunod na talata.
