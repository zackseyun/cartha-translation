  text: And I will make my covenant between me and you[a], and I will multiply you exceedingly.
translation:
  language: tl
  text: At itatatag ko ang aking tipan sa pagitan natin[a], at pararamihin kita nang labis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “At ibibigay/ilalagay ko ang aking tipan sa pagitan ko at iyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנָה
  choice: At itatatag ko
  rationale: Ang נָתַן ay literal na “ibigay/ilagay,” ngunit kasama ng בְּרִית ay tumutukoy sa pagtatakda o pagtatatag ng tipan. Likas sa modernong Tagalog ang “itatatag,” habang inilalahad sa talababa ang mas literal na anyo.
- source_word: בְרִיתִי
  choice: ang aking tipan
  rationale: Pinananatili ng “tipan” ang pormal at teolohikal na bigat ng בְּרִית, at malinaw na kinakatawan ng “aking” ang hulaping unang panauhan.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: sa pagitan natin
  rationale: Natural na katumbas sa Tagalog ng “sa pagitan ko at mo,” at hindi binabago ang ugnayang tinutukoy ng parirala.
- source_word: וְאַרְבֶּה
  choice: at pararamihin
  rationale: Ang Hiphil ng רבה ay nagsasaad ng pagpaparami o malaking pagdami; ang “pararamihin” ay tuwiran at angkop sa pangako kay Abram.
- source_word: אֹתְךָ
  choice: kita
  rationale: Pinananatili ang ikalawang panauhang isahan na tuwirang tumutukoy kay Abram, sa halip na tahasang palitan ito ng “iyong mga lahi.”
- source_word: בִּמְאֹד מְאֹד
  choice: nang napakarami
  rationale: Ipinahahayag nito ang matinding diin ng inuulit na מְאֹד sa natural na Tagalog at inuugnay ito sa dami ng ipinangakong pagdami.
theological_decisions:
- issue: Idyoma ng tipan na נתן + ברית
  choice: itatatag ko ang aking tipan
  alternative: ibibigay/ilalagay ko ang aking tipan
  rationale: Sa kontekstong ito, ang “itatatag” ay malinaw na nagpapahayag ng pagkilos ng Diyos hinggil sa tipan nang hindi ipinahihiwatig na ang tipan ay isa lamang bagay na inililipat. Gayunman, pinananatili sa talababa ang literal na saklaw ng pandiwa.
- issue: Saklaw ng pangakong “pararamihin kita”
  choice: pinanatili ang tuwirang pagtukoy kay Abram
  alternative: pararamihin ko ang iyong mga lahi
  rationale: Bagaman ipinahihiwatig ng konteksto ang mga magiging inapo, si Abram mismo ang tuwirang layon sa Hebreo. Hindi tahasang idinaragdag sa pangunahing teksto ang interpretasyong “mga lahi.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sa pagitan natin” bilang likas na Tagalog; iniwasan ang mas luma o mabigat na “sa pagitan ko at mo.”
