revisions:
- from: Pagtitibayin ko ang aking tipan sa pagitan ko at mo, at sa iyong lahi[a] na susunod sa iyo, sa lahat ng kanilang salinlahi, bilang isang tipang walang hanggan. Sa gayon, ako ang magiging Diyos mo[b] at ng iyong lahi na susunod sa iyo.
  to: Itatatag ko ang aking tipan sa pagitan ko at mo, at ng iyong lahi[a] na magmumula sa iyo, sa lahat ng kanilang salinlahi, bilang tipang walang hanggan, upang ako'y maging Diyos mo[b] at ng iyong lahing magmumula sa iyo.
  rationale: Inalis ang di-sinasabing "Sa gayon," nilinaw ang saklaw ng mga partido ng tipan, at ginawang mas tapat at likas ang pagpapahayag ng layuning covenant formula. Hindi binabago ng rebisyon ang kolektibong kalabuan ng זרע o nagdaragdag ng teolohikal na pagpapakahulugan.
