source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֜/י בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֨ין זַרְעֲ/ךָ֧ אַחֲרֶ֛י/ךָ לְ/דֹרֹתָ֖/ם לִ/בְרִ֣ית עוֹלָ֑ם לִ/הְי֤וֹת לְ/ךָ֙ לֵֽ/אלֹהִ֔ים וּֽ/לְ/זַרְעֲ/ךָ֖ אַחֲרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/007.yaml
  text: And I will establish my covenant between me and you and your offspring after you throughout their generations as an everlasting covenant[b][a], to be God to you and to your offspring after you.
translation:
  language: tl
  text: Itatatag ko ang aking tipan sa pagitan ko at mo, at ng iyong lahi[a] na magmumula sa iyo, sa lahat ng kanilang salinlahi, bilang tipang walang hanggan, upang ako'y maging Diyos mo[b] at ng iyong lahing magmumula sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “lahi” ay salin ng isang pangkaisahang pangkatang salita sa Hebreo na maaari ring isaling “binhi” o “mga inapo.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa mas literal na ayos: “upang maging Diyos para sa iyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Pagtitibayin ko
  rationale: Ang הֵקִים kasama ng בְּרִית ay maaaring mangahulugang itatag o pagtibayin ang isang tipan. Sa daloy ng salaysay, natural sa Filipino ang “pagtitibayin” at hindi nito ipinahihiwatig na simpleng pananatilihin lamang ang tipan.
- source_word: בְּרִיתִי
  choice: ang aking tipan
  rationale: Tuwirang pinananatili ang karaniwang salin ng בְּרִית at ang hulaping paari.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין
  choice: sa pagitan ko at mo, at sa
  rationale: Pinananatili ang ugnayang ipinahahayag ng “sa pagitan,” habang bahagyang pinadadaloy ang inuulit na Hebreong kayarian para maging malinaw sa modernong Filipino.
- source_word: זַרְעֲךָ
  choice: iyong lahi
  rationale: Ang זֶרַע ay pangkaisahang pangkatang katawagan. Ang “lahi” ay natural sa Filipino at maaaring tumukoy sa kabuuan ng mga nagmula kay Abraham nang hindi sapilitang nilulutas kung iisa o marami ang tinutukoy.
- source_word: אַחֲרֶיךָ
  choice: na susunod sa iyo
  rationale: Ipinahahayag nito ang genealogical at temporal na pagsunod, nang hindi nililimitahan ang kahulugan sa panahon lamang pagkamatay ni Abraham.
- source_word: לְדֹרֹתָם
  choice: sa lahat ng kanilang salinlahi
  rationale: Malinaw nitong ipinahahayag ang pagpapatuloy ng tipan sa magkakasunod na henerasyon.
- source_word: לִבְרִית עוֹלָם
  choice: bilang isang tipang walang hanggan
  rationale: Ang “walang hanggan” ay madaling maunawaan at pinananatili ang matibay at patuloy na diwa ng עוֹלָם sa konteksto ng tipan.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: ako ang magiging Diyos mo
  rationale: Ito ang natural na Filipino para sa Hebreong pormula ng pakikipagtipan, “maging Diyos para sa iyo,” nang hindi nagdaragdag ng ibang teolohikal na paliwanag.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: at ng iyong lahi na susunod sa iyo
  rationale: Pare-parehong isinasalin ang inuulit na זֶרַע at אַחֲרֶיךָ, at malinaw na saklaw din ng pangako ang mga susunod na salinlahi.
theological_decisions:
- issue: Ang pangkaisahang pangkatang זֶרַע sa pangako kay Abraham
  choice: iyong lahi
  alternative: iyong binhi; iyong mga inapo
  rationale: Pinananatili ng “lahi” ang kolektibong lawak ng salita nang hindi ito tahasang ginagawang maramihan lamang o nililimitahan sa isang indibiduwal na pagbasa.
- issue: Ang pormula ng tipan na לִהְיוֹת לְךָ לֵאלֹהִים
  choice: ako ang magiging Diyos mo
  alternative: ako ay magiging Diyos para sa iyo
  rationale: Ang piniling anyo ay likas sa Filipino ngunit nananatiling malapit sa ugnayang ipinahahayag ng Hebreo; hindi ito nagdaragdag ng denominasyonal na paliwanag.
- issue: Ang puwersa ng הֵקִים kaugnay ng tipan
  choice: Pagtitibayin ko
  alternative: Itatatag ko; Paiiralin ko
  rationale: Maaaring saklawin ng pandiwa ang pagtatatag o pagpapatibay. Ang “pagtitibayin” ay angkop sa konteksto ng naipahayag nang pangako at hindi lumulutas ng higit sa pinahihintulutan ng salitang Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tipan,” “salinlahi,” at “Diyos” bilang pamilyar ngunit dignipikadong bokabularyo. Bahagyang inayos ang Hebreong pag-uulit upang maging natural sa Filipino, habang pinananatili ang kolektibong kalabuan ng זֶרַע at ang pormula ng pakikipagtipan.
