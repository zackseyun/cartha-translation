base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/004.yaml
  text: As for me[a], behold, my covenant is with you[b], and you will become the father of a multitude of nations.
translation:
  language: tl
  text: Kung tungkol sa akin[a], narito, ang tipan ko ay kasama mo, at magiging ama ka ng napakaraming bansa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ako—narito, ang tipan ko ay kasama mo.” Mariin sa Hebreo ang pambungad na panghalip at ang kasunod na katagang pantawag-pansin.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Kung tungkol sa akin
  rationale: Ang hiwalay na panghalip ay mariin at nagbubukas ng pahayag ng Diyos. Likas na naihahayag sa Tagalog ng “Kung tungkol sa akin” ang diin sa diskurso.
- source_word: הִנֵּה
  choice: narito
  rationale: Itinutuon ng pantukoy na kataga ang pansin sa kasunod na pahayag. Pinananatili ng “narito” ang tuwiran at maringal na himig nang hindi nagiging lipas ang wika.
- source_word: בְרִיתִי
  choice: ang tipan ko
  rationale: Ang “tipan” ang karaniwan at angkop na salin ng בְּרִית sa salaysay tungkol kay Abraham at pinananatili nito ang bigat ng ugnayang ipinahahayag.
- source_word: אִתָּךְ
  choice: ay sa iyo
  rationale: Tuwirang pinananatili nito ang “with you” ng Hebreo nang hindi pinalalawak bilang “sa pagitan natin” o ginagawang tahasang kilos na “nakikipagtipan ako.”
- source_word: וְהָיִיתָ
  choice: at magiging
  rationale: Sa konteksto ng pangako, ang anyo ay may puwersang panghinaharap at resultativo. Ang “magiging” ay natural na naghahayag ng pagpasok ni Abram sa ipinangakong papel.
- source_word: לְאָב
  choice: ama ka ng
  rationale: Natural sa Tagalog ang panaguring “magiging ama ka ng.” Hindi sapilitang nilalagyan ng tiyak na pantukoy ang Hebreo, kaya binabanggit sa talababa ang posibleng “isang ama.”
- source_word: הֲמוֹן
  choice: napakaraming
  rationale: Ipinahahayag nito sa payak at kasalukuyang Tagalog ang malaking bilang na tinutukoy ng הֲמוֹן. Bagaman maaari ring isaling “isang malaking kalipunan,” mas natural dito ang “napakaraming.”
- source_word: גּוֹיִם
  choice: mga bansa
  rationale: Malawak na tumutukoy ang גּוֹיִם sa mga bansa o sambayanan, hindi partikular sa teknikal at mas huling diwa ng “mga Hentil.”
theological_decisions:
- issue: Pormulasyon ng tipan at papel ni Abraham
  choice: Pinanatili ang pahayag bilang “ang tipan ko ay sa iyo” at ang pangako na “magiging ama ka ng napakaraming bansa.”
  alternative: “Nakikipagtipan ako sa iyo” o “magiging ninuno ka ng maraming bansa.”
  rationale: Hindi tahasang sinasabi ng Hebreo rito ang kilos na paggawa ng tipan, at “ama” ang mismong larawang ginamit. Kaya iniiwasang dagdagan o ipaliwanag nang teolohikal ang payak na deklarasyon at pangako.
translation_notes:
  register: Makabago at dignified na Filipino; pinanatili ang bahagyang pormal na “narito” at “tipan” dahil angkop ang mga ito sa maringal na pahayag ng Diyos. Iniwasan ang mas interpretibong “ninuno” at ang pagpapalawak na “nakikipagtipan ako.”
