base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/012.yaml
  text: And at eight days old, every male among you throughout your generations shall be circumcised—whether born in the house or bought with silver from any foreigner who is not from your offspring.
translation:
  language: tl
  text: At sa ikawalong araw, tutuliin ang bawat lalaki sa inyo sa lahat ng inyong salinlahi[a]—maging ang ipinanganak sa sambahayan o ang binili sa pilak[b] mula sa sinumang dayuhan na hindi mula sa iyong binhi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “anak ng walong araw.”
    reason: lexical_alternative
  - marker: b
    text: O “binili sa salapi.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “mula sa bawat anak ng isang dayuhan na hindi mula sa iyong binhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן שְׁמֹנַת יָמִים
  choice: pagsapit ng walong araw
  rationale: Likas na salin sa Filipino ng idyomang literal na “anak ng walong araw”; malinaw nitong pinananatili ang takdang edad.
- source_word: יִמּוֹל
  choice: tutuliin
  rationale: Pinananatili ang pasibong diwa at ang lakas ng utos sa konteksto ng tipan.
- source_word: לָכֶם כָּל זָכָר
  choice: ang bawat lalaki sa inyo
  rationale: Natural na Filipino para sa lahat ng lalaking kabilang sa sambayanang kinakausap.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng inyong salinlahi
  rationale: Ipinahahayag ang patuloy na bisa ng utos sa magkakasunod na salinlahi.
- source_word: יְלִיד בָּיִת
  choice: ipinanganak sa sambahayan
  rationale: Ang “sambahayan” ay mas malinaw kaysa literal na “bahay” para sa taong isinilang sa loob ng household ni Abraham.
- source_word: וּמִקְנַת כֶּסֶף
  choice: o binili sa pilak
  rationale: Pinananatili ang kongkretong salitang כֶּסֶף, “pilak,” at ang kahulugan ng pagkuha sa pamamagitan ng pagbili.
- source_word: מִכֹּל בֶּן נֵכָר
  choice: mula sa sinumang dayuhan
  rationale: Natural na salin ng idyomang literal na “mula sa bawat anak ng dayuhan,” nang hindi ipinapasok ang di-kinakailangang literalismo.
- source_word: אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: na hindi ninyo kaanak
  rationale: Ipinahahayag sa karaniwang Filipino na ang tinutukoy ay hindi kabilang sa sariling angkan o supling; iniiwasan ang alanganing literal na “mula sa inyong binhi.”
theological_decisions:
- issue: Saklaw ng utos ng pagtutuli sa sambahayan ng tipan
  choice: Kasama ang bawat lalaki sa sambahayan, kapuwa ang ipinanganak doon at ang binili mula sa mga dayuhan, hindi lamang ang likas na supling.
  alternative: Iukol ang utos pangunahin o tangi lamang sa mga pisikal na inapo ni Abraham.
  rationale: Tahasang pinalalawak ng Hebreo ang saklaw sa mga ipinanganak sa sambahayan at sa mga binili, kabilang ang hindi mula sa sariling angkan; hindi nagdaragdag ang salin ng anumang doktrinal na konklusyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sambahayan” upang malinaw na tukuyin ang household, at “tutuliin” upang mapanatili ang pasibong legal na himig. Ang mga panghalip na maramihan ay tumutugma sa unang bahagi ng Hebreo, bagaman ang hulíng “iyong binhi” ay isahan at nakatuon kay Abraham; inililinaw ito ng literal na talababa.
