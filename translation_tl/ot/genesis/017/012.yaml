- from: At pagsapit ng walong araw, tutuliin ang bawat lalaki sa inyo sa lahat ng inyong salinlahi[a]—maging ipinanganak sa sambahayan o binili sa pilak[b] mula sa sinumang dayuhan na hindi ninyo kaanak.[c]
  to: At sa ikawalong araw, tutuliin ang bawat lalaki sa inyo sa lahat ng inyong salinlahi[a]—maging ang ipinanganak sa sambahayan o ang binili sa pilak[b] mula sa sinumang dayuhan na hindi mula sa iyong binhi.[c]
  rationale: Pinalitan ang temporal na parirala ng “sa ikawalong araw” para sa malinaw na itinakdang panahon. Pinalitan ang “hindi ninyo kaanak” ng “hindi mula sa iyong binhi” upang mapanatili ang saklaw ng זֶרַע at ang isahang panghalip ng Hebreo, nang walang pagpapalawak sa kahulugang “kamag-anak.” Pinanatili ang natural na “sinumang dayuhan,” alinsunod sa English POB audit trail, at ang literal na talababa ay nagpapanatili ng mas malapit na anyong “anak ng isang dayuhan.”
