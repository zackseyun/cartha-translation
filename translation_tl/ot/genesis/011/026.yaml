  text: וַֽ/יְחִי תֶ֖רַח שִׁבְעִ֣ים שָׁנָ֑ה וַ/יּ֨וֹלֶד֙ אֶת אַבְרָ֔ם אֶת נָח֖וֹר וְ/אֶת הָרָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/026.yaml
  text: Terah lived seventy years and fathered Abram[a], Nahor, and Haran.
translation:
  language: tl
  text: Nang pitumpung taóng gulang na si Terah, naging ama siya[a] nina Abram, Nahor, at Haran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagkaanak siya.” Hindi hinihingi ng pandiwang Hebreo sa talaangkanan na ang mga anak ay ipinanganak sa eksaktong pagkakasunod-sunod ng pagkakalista sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: Nang ... gulang na si Terah
  rationale: Sa kontekstong talaangkanan, ipinahihiwatig ng חיה kasama ng bilang ng mga taon na umabot si Terah sa nasabing edad. Ang hulma na “Nang pitumpung taóng gulang na” ay likas sa modernong Tagalog at malinaw na naghahanda sa sumunod na pahayag.
- source_word: שִׁבְעִים שָׁנָה
  choice: pitumpung taóng gulang
  rationale: Bagaman literal na “pitumpung taon,” kailangan sa natural na Tagalog ang “taóng gulang” upang malinaw na tumukoy sa edad.
- source_word: וַיּוֹלֶד
  choice: naging ama siya
  rationale: Sa mga talaangkanan, ang causative na anyo ng ילד ay nangangahulugang “naging ama” o “nagkaanak,” hindi na si Terah ang nanganak. Pinananatili ng “naging ama” ang ugnayang genealogical nang hindi gumagamit ng lipas na pananalita.
- source_word: אֶת ... אֶת ... וְאֶת
  choice: nina Abram, Nahor, at Haran
  rationale: Ang paulit-ulit na panandang tuwirang layon ay natural na ipinapahayag sa Tagalog bilang isang listahan, gamit ang “nina” para sa mga pangalang pantangi.
- source_word: אַבְרָם
  choice: Abram
  rationale: Pinanatili ang karaniwang anyo ng pangalang biblikal bago ito palitan ng Abraham sa salaysay.
- source_word: נָחוֹר
  choice: Nahor
  rationale: Ginamit ang nakaugaliang transliterasyon sa Tagalog ng pangalang pantangi.
- source_word: הָרָן
  choice: Haran
  rationale: Ginamit ang nakaugaliang transliterasyon sa Tagalog; ang anyo ng Hebreo rito ay pangalan at hindi nangangailangan ng hiwalay na pantukoy.
theological_decisions:
- issue: Pagkakasunod-sunod ng mga anak at pahiwatig ng edad
  choice: Inilalahad na sa edad na pitumpu ay naging ama si Terah nina Abram, Nahor, at Haran, nang hindi sinasabing ang pagkakalista ang eksaktong pagkakasunod-sunod ng kanilang kapanganakan.
  alternative: Maaaring unawain na nagsimulang magkaanak si Terah sa edad na pitumpu at ang tatlo ay mga pangunahing anak na binanggit, o na mahigpit na pagkakasunod-sunod ng kapanganakan ang listahan.
  rationale: Hindi nilulutas ng mismong talata kung sabay-sabay silang ipinanganak, kung lahat ay ipinanganak noong eksaktong pitumpu si Terah, o kung ang pagkakalista ay ayon sa edad. Kaya hindi nagpasok ang salin ng harmonisasyon mula sa mga sumunod na talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “naging ama” bilang likas at tumpak na katumbas sa kontekstong talaangkanan; iniwasan ang makaluma at hindi karaniwang “naging anak niya” o “ipinanganak niya.”
