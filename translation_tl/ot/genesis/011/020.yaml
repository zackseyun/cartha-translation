  text: And Reu lived thirty-two years and fathered Serug.
translation:
  language: tl
  text: Nabuhay si Reu nang tatlumpu't dalawang taon at naging ama ni Serug.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Nabuhay
  rationale: Likas na salin ng חיה sa pormulang pangangkanan; tumutukoy ito sa edad ni Reu bago ang kapanganakan ng anak na binanggit.
- source_word: רְעוּ
  choice: Reu
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: שְׁתַּיִם וּשְׁלֹשִׁים שָׁנָה
  choice: nang tatlumpu't dalawang taon
  rationale: Pinananatili ang eksaktong bilang na 32 sa likas na ayos ng makabagong Tagalog.
- source_word: וַיּוֹלֶד
  choice: naging anak niya
  rationale: Sa pormulang pangangkanan, ipinahahayag ng causative na anyo ng ילד na naging ama siya ng taong pinangalanan; ang pariralang ito ay natural at malinaw sa Tagalog.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang tuwirang katumbas na kailangang ilahad sa Tagalog.
- source_word: שְׂרוּג
  choice: Serug
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo.
