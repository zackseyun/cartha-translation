base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/005.yaml
  text: Then Yahweh came down to see the city and the tower that the sons of man had built[a].
translation:
  language: tl
  text: Pagkatapos ay bumaba si Yahweh upang tingnan ang lungsod at ang tore na itinayo ng mga tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit., “mga anak ng tao.” Ang pariralang Hebreo ay kolektibong tumutukoy sa mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Pagkatapos ay bumaba
  rationale: Ang bumaba ang tuwirang diwa ng ירד at pinananatili ang kongkretong kilos sa salaysay. Ipinahahayag ng “Pagkatapos ay” ang pagsulong ng salaysay na dala ng waw-consecutive nang natural sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: לִרְאֹת
  choice: upang tingnan
  rationale: Tuwirang ipinahahayag nito ang layunin ng paglusong. Mas natural sa kasalukuyang Tagalog ang “tingnan” kaysa “makita” sa konstruksiyong ito, nang hindi dinaragdagan ang kahulugan tungo sa “siyasatin.”
- source_word: הָעִיר
  choice: ang lungsod
  rationale: Karaniwan at malinaw na katumbas ng עִיר sa dignified modern Filipino.
- source_word: הַמִּגְדָּל
  choice: ang tore
  rationale: Likas at karaniwang salin ng מִגְדָּל sa kontekstong ito.
- source_word: בָּנוּ
  choice: itinayo
  rationale: Ang aspektong ganap sa sugnay na panuring ay natural na naipapahayag sa Tagalog sa “itinayo,” nang hindi ipinipilit ang isang tahasang pluperfect na wala sa anyong Hebreo.
- source_word: בְּנֵי הָאָדָם
  choice: mga anak ng tao
  rationale: Pinananatili nito ang konkretong anyong Hebreo, “mga anak ng tao,” habang nililinaw sa talababa na kolektibong tumutukoy ang idyoma sa sangkatauhan.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pagbaba ni Yahweh
  choice: Panatilihin ang kongkretong “bumaba”
  alternative: tumingin mula sa itaas; ibinaling ang pansin
  rationale: Tahasan sa Hebreo ang pagbaba ni Yahweh. Hindi ito pinapahina o ipinapaliwanag palayo, kaya nananatili ang retorikal at teolohikal na tensiyon ng salaysay.
- issue: Kahulugan at anyo ng בְּנֵי הָאָדָם
  choice: mga anak ng tao
  alternative: sangkatauhan; mga tao
  rationale: Ang parirala ay panlalaki sa anyo ngunit kolektibo ang saklaw. Pinananatili ng pangunahing teksto ang hugis ng Hebreo, at ipinaliliwanag ng talababa ang inklusibong reperensiya nito nang hindi nag-aangkat ng natatanging doktrinal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “lungsod” at “tore” bilang karaniwang bokabularyo; pinanatili ang “mga anak ng tao” upang maingatan ang anyo at paghahambing ng Hebreo, kalakip ang paliwanag sa talababa.
