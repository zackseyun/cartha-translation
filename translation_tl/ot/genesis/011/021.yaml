  yaml_path: translation/ot/genesis/011/021.yaml
  text: And Reu lived after he fathered Serug two hundred and seven years[a], and he fathered sons and daughters.
translation:
  language: tl
  text: Nabuhay pa si Reu nang dalawang daan at pitong taon matapos niyang maging ama ni Serug, at nagkaroon siya ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Nabuhay pa
  rationale: Sa pormulang talaangkanan, ipinahihiwatig ng pandiwa kasama ng pariralang “matapos” na nagpatuloy ang buhay ni Reu pagkasilang kay Serug. Likas sa modernong Tagalog ang “nabuhay pa.”
- source_word: רְעוּ
  choice: Reu
  rationale: Pinanatili ang nakaugaliang anyo ng pangalang Hebreo sa salin.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שְׂרוּג
  choice: matapos niyang maging ama ni Serug
  rationale: Tumpak na ipinahahayag ang panlalaking pananahilan ng Hiphil ng ילד nang hindi gumagamit ng makalumang pananalita.
- source_word: שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: dalawang daan at pitong taon
  rationale: Inayos ang pagkakasunod ng bilang ayon sa likas na gamit sa Tagalog habang pinananatili ang eksaktong bilang na 207.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: at nagkaroon siya ng mga anak na lalaki at babae
  rationale: Likas at malinaw sa Tagalog, at pinananatili ang tahasang pagbanggit ng Hebreo sa mga anak na lalaki at babae.
