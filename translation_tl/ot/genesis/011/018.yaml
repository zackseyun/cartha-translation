    issue: Ang “naging anak niya si Reu” ay hindi tuwirang nagsasaad na si Peleg ang naging ama ni Reu.
    rationale: Bagaman mauunawaan ang relasyon, ang Hebreo ay aktibong nagsasaad na si Peleg ay nagkaanak/fathered Reu. Ang “naging ama siya ni Reu” ay mas tumpak at idiomatiko.
  revised_text: Nang tatlumpung taong gulang si Peleg, naging ama siya ni Reu.
