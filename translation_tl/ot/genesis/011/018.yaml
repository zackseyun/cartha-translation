  text: Peleg lived thirty years and fathered Reu.
translation:
  language: tl
  text: Nang tatlumpung taong gulang si Peleg, naging ama siya ni Reu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Nang ... taon na si
  rationale: Sa pormulang talaangkanan, ang חיה kasama ng bilang ng mga taon ay nagsasaad ng edad bago ang kasunod na pangyayari. Likas sa modernong Tagalog ang hulma na “Nang tatlumpung taon na si Peleg.”
- source_word: פֶלֶג
  choice: Peleg
  rationale: Pinanatili ang nakasanayang anyo ng pangalang pantangi.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: tatlumpung taon
  rationale: Tuwirang ipinapahayag ang bilang ng taon; sa pangungusap, malinaw na tumutukoy ito sa edad ni Peleg.
- source_word: וַיּוֹלֶד
  choice: naging anak niya si
  rationale: Ang hiphil ng ילד sa talaangkanan ay nangangahulugang nagkaanak o naging ama. Ang “naging anak niya si” ay natural, malinaw, at hindi lipas sa Tagalog habang pinananatili ang ugnayang ama-anak.
- source_word: אֶת
  choice: '[hindi isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang hiwalay na katumbas sa Tagalog.
- source_word: רְעוּ
  choice: Reu
  rationale: Pinanatili ang nakasanayang anyo ng pangalang pantangi.
