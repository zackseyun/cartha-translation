  verdict: revise
  source_fidelity: Ang draft ay wastong naghahatid ng edad ni Peleg at ng ugnayang ama-anak kay Reu. Gayunman, ang “naging anak niya si Reu” ay nakatuon sa pagiging anak ni Reu at maaaring bahagyang lumabo ang pandiwang sanhi ng Hebreong וַיּוֹלֶד (“nagkaanak/naging ama”).
  naturalness: Likas ang hulmang “Nang tatlumpung taong gulang si Peleg,” ngunit mas malinaw at mas natural sa modernong Tagalog ang “naging ama siya ni Reu” kaysa “naging anak niya si Reu.”
  terminology: Wasto ang mga pangalang Peleg at Reu. Ang “naging ama” ay angkop na makabagong katumbas ng genealogical na hiphil ng ילד nang hindi gumagamit ng lipas na “nagkaanak/begat.”
  issues:
