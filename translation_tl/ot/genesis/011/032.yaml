  yaml_path: translation/ot/genesis/011/032.yaml
  text: The days of Terah were two hundred and five years, and Terah died in Haran.
translation:
  language: tl
  text: Umabot sa dalawang daan at limang taon ang buhay ni Terah. At namatay si Terah sa Haran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי תֶרַח
  choice: Umabot ... ang buhay ni Terah
  rationale: Ang pariralang Hebreo na literal na ‘ang mga araw ni Terah ay’ ay isang idyoma para sa kabuuang haba ng kanyang buhay. Ang ‘umabot ... ang buhay’ ay natural sa modernong Tagalog at malinaw na naghahayag ng buod ng kanyang edad.
- source_word: חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה
  choice: dalawang daan at limang taon
  rationale: Isinaayos ang bilang ayon sa karaniwang ayos sa Tagalog, sa halip na sundin ang literal na ayos na ‘limang taon at dalawang daang taon.’
- source_word: תֶרַח
  choice: Terah
  rationale: Ginamit ang nakasanayang anyo ng pangalang pantangi sa mga saling Filipino.
- source_word: וַיָּמָת
  choice: namatay
  rationale: Tuwiran nitong isinasalin ang pandiwang מות nang hindi gumagamit ng eupemismo.
- source_word: בְּחָרָן
  choice: sa Haran
  rationale: Ang pang-ukol na בְּ ay nagsasaad dito ng lugar kung saan namatay si Terah; natural itong isalin na ‘sa’ sa Tagalog.
