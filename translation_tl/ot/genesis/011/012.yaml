  terminology: Ang “naging ama” ay angkop para sa pandiwang Hebreo sa talaangkanan. Dapat lamang baguhin ang “isinasalin” sa talababa, sapagkat ang Salah ay alternatibong anyo/pagbaybay ng pangalan, hindi salin nito.
