lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: At ... si Arpacsad
  rationale: Pinananatili ng “At” ang ugnayan at pagkakasunod-sunod sa talaangkanan. Isinatinig ang pangalang Hebreo sa anyong madaling basahin sa Filipino.
- source_word: חַי
  choice: nabuhay
  rationale: Sa pormulang pangtalaangkanan, tumutukoy ito sa pag-abot sa tinukoy na edad; natural sa Filipino ang “nabuhay ... nang ... taon.”
- source_word: חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  choice: tatlumpu't limang taon
  rationale: Ipinapahayag sa karaniwang ayos ng modernong Filipino ang literal na Hebreong “lima at tatlumpung taon.”
- source_word: וַ/יּוֹלֶד
  choice: naging ama siya ni
  rationale: Tumpak at natural itong katumbas ng causative na anyo ng ילד sa talaangkanan, nang hindi gumagamit ng lipas o teknikal na pananalita.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at naipahahayag na ng estruktura ng pangungusap sa Filipino.
- source_word: שָׁלַח
  choice: Selah
  rationale: Isinatinig ang pangalan batay sa Hebreong שָׁלַח; binabanggit sa talababa ang alternatibong tradisyunal na anyo.
