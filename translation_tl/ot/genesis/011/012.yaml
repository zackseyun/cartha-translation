  source_fidelity: 'Tumpak ang pangunahing nilalaman: si Arpacsad ay nagkaroon ng anak na si Selah sa edad na tatlumpu''t lima. Gayunman, ang “nabuhay ... nang tatlumpu''t limang taon, at naging ama” ay mas madaling basahing magkasunod na mga pangyayari kaysa bilang edad niya nang maging ama siya. Ang pagbabalangkas na “tatlumpu''t limang taong gulang ... nang maging ama” ay mas malinaw na naghahatid ng pormulang Hebreo.'
