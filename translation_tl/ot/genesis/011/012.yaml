translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “naging ama” sa halip na mas lumang “ipinanganak” o “nagkaanak,” upang malinaw na ipahayag ang papel ng ama sa pormulang pangtalaangkanan. Hindi na nilagyan ng talababa ang literal na ayos ng bilang o ang alternatibong pandiwa sapagkat tuwiran at walang mahalagang ambiguwidad ang Hebreo sa kontekstong ito.
