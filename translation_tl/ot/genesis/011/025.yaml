base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/025.yaml
  text: Nahor lived one hundred nineteen years after he fathered Terah, and he fathered sons and daughters.
translation:
  language: tl
  text: Nabuhay pa si Nahor nang isandaan at labinsiyam na taon matapos niyang maging ama ni Terah, at nagkaroon siya ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Nabuhay pa
  rationale: Sa pormulang pang-talaan ng angkan, tumutukoy ito sa patuloy na haba ng buhay matapos ang kapanganakan ng pinangalanang anak; natural itong ipinahahayag sa Tagalog bilang “nabuhay pa.”
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־תֶּרַח
  choice: matapos niyang maging ama ni Terah
  rationale: Pinananatili nito ang aktibong diwa ng ילד at malinaw na minamarkahan ang panahong kasunod ng pagsilang ni Terah, nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
- source_word: תֶּרַח
  choice: Terah
  rationale: Ginamit ang karaniwang anyo ng pangalan sa modernong saling Filipino.
- source_word: תְּשַׁע עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה
  choice: isandaan at labinsiyam na taon
  rationale: Ang Hebreo ay literal na nag-aayos bilang labinsiyam at isang daan; inayos ayon sa natural na pagkakasunod ng bilang sa Filipino habang pinananatili ang eksaktong kabuuang 119 taon.
- source_word: וַיּוֹלֶד
  choice: nagkaroon siya ng iba pang mga anak
  rationale: Natural sa modernong Filipino ang “nagkaroon ng mga anak.” Idinagdag ang “iba pang” upang malinaw na ang mga anak na ito ay bukod kay Terah, isang implikasyong likas sa pormula at konteksto.
- source_word: בָּנִים וּבָנוֹת
  choice: mga anak na lalaki at babae
  rationale: Pinananatili ang tahasang pagbanggit ng Hebreo sa kapwa mga anak na lalaki at mga anak na babae sa halip na gawing pangkalahatang “mga anak” lamang.
