translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Pinanatili ang paulit-ulit na pormulang panggenealohiya nang hindi gumagamit ng arkaitikong “nagkaanak” o “naging anak niya.”
