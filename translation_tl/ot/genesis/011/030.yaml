  yaml_path: translation/ot/genesis/011/030.yaml
  text: Sarai was barren[a]; she had no child.
translation:
  language: tl
  text: Baog si Sarai[a]; wala siyang anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At baog si Sarai; wala siyang supling.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: si Sarai ay / Baog si Sarai
  rationale: Ang waw-consecutive na kasama ng היה ay nagpapatuloy sa salaysay. Hindi kailangan ng tahasang “Ngayon”; natural sa Tagalog na ihayag nang tuwiran ang kalagayan.
- source_word: שָׂרַי
  choice: Sarai
  rationale: Pinanatili ang karaniwang transliterasyon ng pangalang pantangi.
- source_word: עֲקָרָה
  choice: baog
  rationale: Tuwiran at karaniwang salitang Tagalog para sa kawalan ng kakayahang magkaanak; naiiba ito sa kasunod na paglilinaw na wala siyang anak.
- source_word: אֵין לָהּ
  choice: wala siyang
  rationale: Natural na katumbas sa Tagalog ng negatibong eksistensiyal na nagpapahayag ng kawalan ng pag-aari o taglay.
- source_word: וָלָד
  choice: anak
  rationale: Sa kontekstong ito, ang tumutukoy sa isinilang o supling ay pinakanatural na isalin bilang “anak.”
theological_decisions: []
translation_notes:
  register: Makabago, maikli, at marangal na Tagalog. Ginamit ang “baog” bilang malinaw at karaniwang katumbas ng עֲקָרָה, habang pinanatili ng ikalawang sugnay ang diin ng Hebreo.
