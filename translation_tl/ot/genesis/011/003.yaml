revisions:
- from: At sinabi nila sa isa’t isa, “Halikayo, gumawa tayo ng mga ladrilyo at lutuing mabuti ang mga ito.” Ginamit nilang pamalit sa bato ang ladrilyo, at pamalit sa argamasa ang bitumen.[a]
  to: At sinabi nila sa isa’t isa, “Halikayo, gumawa tayo ng mga ladrilyo at sunugin natin ang mga ito nang husto.” Ginamit nilang pamalit sa bato ang mga ladrilyo, at pamalit sa argamasa ang bitumen.[a]
  rationale: Pinalitan ang “lutuing mabuti” ng “sunugin natin ang mga ito nang husto” upang maipahayag ang masidhing pagpapaputok na nasa Hebreo at maging natural ang pangungusap sa modernong Tagalog. Ginawang maramihan ang huling “mga ladrilyo” para sa malinaw na pagtukoy sa mga ladrilyong ginawa. Nilinaw ang talababa upang itugma ang partikular na gampanin ng bitumen sa talata.
