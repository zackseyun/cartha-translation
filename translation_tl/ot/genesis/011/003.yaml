    issue: “Lutuing mabuti”
    rationale: Ang וְנִשְׂרְפָה לִשְׂרֵפָה ay nagpapahiwatig ng masidhing pagsunog o pagpapaputok. Ang “sunugin ... nang husto” ay mas tuwiran, natural, at malinaw sa paggawa ng ladrilyo; ang kasalukuyang parirala ay mas madaling unawain bilang ordinaryong pagluluto at kulang ang pang-abay na “nang.”
  - severity: low
    issue: Talababa sa bitumen
    rationale: Kapaki-pakinabang ang paliwanag, ngunit mas magiging tumpak sa mismong talata kung sasabihing dito ay ginamit ang bitumen bilang pamalit sa argamasa, sa halip na ilarawan lamang ang pangkalahatang mga gamit nito.
