base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/003.yaml
  text: And each man said to his neighbor[a], “Come, let us make bricks and burn them thoroughly.” And the brick served them for stone[b], and the bitumen served them for mortar.
translation:
  language: tl
  text: At sinabi nila sa isa’t isa, “Halikayo, gumawa tayo ng mga ladrilyo at sunugin natin ang mga ito nang husto.” Ginamit nilang pamalit sa bato ang mga ladrilyo, at pamalit sa argamasa ang bitumen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang bitumen ay likas na malagkit na sangkap, tulad ng alkitran o aspalto; dito ay ginamit ito bilang pamalit sa argamasa.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: sinabi nila sa isa’t isa
  rationale: Ang idyomang distributibo ay likas na naipapahayag sa modernong Tagalog bilang “sa isa’t isa,” nang hindi ipinipilit ang panlalaking anyo ng Hebreong isahan.
- source_word: הָבָה
  choice: Halikayo
  rationale: Nagpapakilala ito ng sama-samang paghihikayat; natural at malinaw ang “Halikayo” bago ang inklusibong “tayo.”
- source_word: נִלְבְנָה לְבֵנִים
  choice: gumawa tayo ng mga ladrilyo
  rationale: Ang pandiwa ay denominatibong “gumawa ng ladrilyo”; ito ang malinaw at karaniwang pahayag sa Tagalog.
- source_word: וְנִשְׂרְפָה לִשְׂרֵפָה
  choice: at lutuing mabuti ang mga ito
  rationale: Ang magkaugnay na pandiwa at pangngalan ay nagpapasidhi sa pagkakasunog. Sa paggawa ng ladrilyo, natural sa Tagalog ang “lutuin” para sa pagpapaputok sa hurno, at ipinahahayag ng “mabuti” ang diin.
- source_word: וַתְּהִי לָהֶם הַלְּבֵנָה לְאָבֶן
  choice: Ginamit nilang pamalit sa bato ang ladrilyo
  rationale: Ipinahahayag ng היה + ל ang gamit o materyal na pamalit, hindi literal na pagbabago ng ladrilyo tungo sa bato.
- source_word: הַחֵמָר
  choice: bitumen
  rationale: Tumutukoy ang חֵמָר sa likas na alkitran o asphalt-like na sangkap sa pagtatayo; “bitumen” ang pinakatumpak na terminong materyal.
- source_word: לַחֹמֶר
  choice: pamalit sa argamasa
  rationale: Sa konteksto, ang חֹמֶר ay materyal na nagbibigkis sa mga ladrilyo. Ang “argamasa” ay tumpak na katawagang Filipino para sa mortar.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw sa karaniwang mambabasa. Pinanatili ang paralelismo ng dalawang materyal na pamalit, habang ginawang natural ang idyomang Hebreo. Ang “argamasa” ay mas tiyak kaysa “semento,” at ipinaliliwanag sa talababa ang hindi gaanong pamilyar na “bitumen.”
