  text: וַֽ/יְחִי פֶ֗לֶג אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת רְע֔וּ תֵּ֥שַׁע שָׁנִ֖ים וּ/מָאתַ֣יִם שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/019.yaml
  text: And Peleg lived two hundred and nine years after he fathered Reu, and he fathered sons and daughters.
translation:
  language: tl
  text: At nabuhay pa si Peleg nang dalawang daan at siyam na taon matapos niyang maging ama ni Reu, at nagkaanak siya ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: nabuhay pa
  rationale: Sa pormulang talaangkanan, ipinahihiwatig ng חיה ang patuloy na buhay matapos ang binanggit na pangyayari; natural itong ipinapahayag sa Tagalog bilang “nabuhay pa.”
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת רְעוּ
  choice: matapos niyang maging ama ni Reu
  rationale: Ang Hiphil ng ילד ay tumutukoy sa pagiging ama o pag-aanak ng lalaki. Ang “maging ama” ay malinaw, dignified, at hindi lipas na salin sa modernong Tagalog.
- source_word: תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: dalawang daan at siyam na taon
  rationale: Isinaayos ang bilang ayon sa natural na ayos sa Tagalog habang pinananatili ang eksaktong kabuuang 209 taon.
- source_word: וַיּוֹלֶד
  choice: nagkaroon siya
  rationale: Sa konteksto ng talaangkanan, natural na ipinapahayag nito na nagkaanak pa si Peleg; ang kasunod na “mga anak na lalaki at babae” ay nagpapanatili sa tiyak na nilalaman ng Hebreo nang hindi gumagamit ng alanganing “inamaan.”
- source_word: בָּנִים וּבָנוֹת
  choice: mga anak na lalaki at babae
  rationale: Tahasang binabanggit ng Hebreo ang kapwa mga anak na lalaki at babae, kaya hindi ito pinasimple bilang “mga anak” lamang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinili ang “nabuhay pa” upang luminaw na ang 209 taon ay kasunod ng pagiging ama niya kay Reu, at “maging ama” upang mapanatili ang panlalaking pananaw ng pormulang talaangkanan nang hindi gumagamit ng makalumang pananalita.
