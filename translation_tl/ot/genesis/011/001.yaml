  source_fidelity: Tumpak na naihahatid ng draft ang saklaw ng כָּל־הָאָרֶץ, ang iisang wika (שָׂפָה אֶחָת), at ang karagdagang diin sa magkakatulad o magkakasamang mga salita (וּדְבָרִים אֲחָדִים). Gayunman, ang ayos na “Ang buong daigdig ay iisa ang wika” ay hindi gaanong maayos na Tagalog; ang “may iisang wika” ay naghahatid ng parehong stative na diwa nang walang pagbabago ng kahulugan.
  naturalness: Mas natural at malinaw sa makabagong Tagalog ang “Ang buong daigdig ay may iisang wika at pare-parehong mga salita.” Nananatili rito ang dalawang magkahiwalay ngunit magkaugnay na parirala ng Hebreo.
  terminology: Ang “buong daigdig” ay angkop sa malawak na saklaw ng salaysay. Ang “wika” ay wastong idyomatikong katumbas ng שָׂפָה sa talatang ito. Ang “pare-parehong mga salita” ay pinananatili ang lexical na “mga salita” at hindi ipinagpapalagay ang isang higit na tiyak na kahulugan kaysa sa pinahihintulutan ng Hebreo.
