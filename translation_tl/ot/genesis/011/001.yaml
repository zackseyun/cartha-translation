translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “daigdig” para sa malawak na saklaw at “magkakapareho ang mga salita” upang mapanatili ang bahagyang kalabuan at pag-uulit ng Hebreo.
