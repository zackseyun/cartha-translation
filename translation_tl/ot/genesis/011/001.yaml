  text: The whole earth had one language and the same words[a].
translation:
  language: tl
  text: Ang buong daigdig ay may iisang wika at pare-parehong mga salita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “at iisa ang paraan ng pagsasalita” o “at iisang kalipunan ng mga salita.” Literal sa Hebreo: “at mga salitang iisa/magkakapareho.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ay
  rationale: Ipinakikilala ng anyong pasalaysay ng היה ang kalagayan sa simula ng salaysay. Likas sa makabagong Tagalog ang payak na hulmahang may “ay,” sa halip na ang mas mabigat na “at nangyari.”
- source_word: כָל הָאָרֶץ
  choice: ang buong daigdig
  rationale: Maaaring mangahulugan ang אֶרֶץ ng “lupa” o “daigdig.” Sa konteksto ng Babel, malawak na sangkatauhan ang tinutukoy, kaya ang “buong daigdig” ang pinakamalinaw.
- source_word: שָׂפָה אֶחָת
  choice: iisa ang wika
  rationale: Literal na “isang labi,” ngunit idyoma ito para sa iisang wika o pananalita. Ang “iisa ang wika” ay malinaw at likas sa Tagalog.
- source_word: וּדְבָרִים אֲחָדִים
  choice: at magkakapareho ang mga salita
  rationale: Pinananatili ng “mga salita” ang karaniwang diwa ng דְּבָרִים, habang ipinahahayag ng “magkakapareho” ang pagkakaisang tinutukoy ng אֲחָדִים nang hindi ito basta inuulit bilang “wika.”
