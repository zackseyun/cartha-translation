translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa payak na istilo ng talaangkanan. Inilapit ang pariralang 'apat na raan at tatlumpung taon' sa pandiwang 'nabuhay' upang malinaw na ito ang tagal ng buhay ni Eber pagkatapos niyang maging ama ni Peleg.
