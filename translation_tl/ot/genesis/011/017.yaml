base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/017.yaml
  text: And Eber lived after he fathered Peleg four hundred and thirty years[a], and he fathered sons and daughters.
translation:
  language: tl
  text: At nabuhay si Eber nang apat na raan at tatlumpung taon matapos siyang maging ama ni Peleg, at naging ama pa siya ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: nabuhay
  rationale: Karaniwang salin ng חיה sa pormulang talaangkanan; ang kasunod na parirala ang naglilinaw na ito ang mga taon ng buhay matapos isilang si Peleg.
- source_word: עֵבֶר
  choice: Eber
  rationale: Malinaw at karaniwang transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג
  choice: matapos niyang maging ama ni Peleg
  rationale: Likas sa modernong Filipino at pinananatili ang tiyak na papel ng lalaking magulang na ipinahihiwatig ng causative form ng ילד.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: apat na raan at tatlumpung taon
  rationale: Natural na ayos ng bilang sa Filipino habang tumpak na pinananatili ang kabuuang 430 taon.
- source_word: וַיּוֹלֶד
  choice: nagkaroon siya
  rationale: Sa konteksto ng talaangkanan, natural itong pagpapahayag sa Filipino ng pagkakaroon niya ng iba pang supling; iniiwasan ang alanganing pag-uulit ng 'naging ama'.
- source_word: בָּנִים וּבָנוֹת
  choice: mga anak na lalaki at babae
  rationale: Pinananatili ang tahasang pagbanggit ng tekstong Hebreo sa kapwa mga anak na lalaki at babae sa halip na gawing pangkalahatang 'mga anak' lamang.
