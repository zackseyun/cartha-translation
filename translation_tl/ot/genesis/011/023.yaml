revisions:
- from: Nabuhay si Serug nang dalawang daang taon matapos niyang maging ama ni Nahor, at nagkaroon pa siya ng mga anak na lalaki at babae.
  to: Pagkatapos niyang maging ama ni Nahor, nabuhay si Serug nang dalawang daang taon, at naging ama siya ng mga anak na lalaki at babae.
  rationale: Inayos ang pagkakasunod ng mga sugnay upang luminaw ang temporal na saklaw ng dalawang daang taon. Pinalitan ang “nagkaroon pa siya” ng “naging ama siya” upang mas eksaktong maipahayag ang pandiwang genealogical na ילד nang hindi nagdaragdag ng aspektong wala sa pinagmulan. Pinanatili ang modernong Filipino at ang tahasang pagbanggit sa mga anak na lalaki at babae.
