  yaml_path: translation/ot/genesis/011/023.yaml
  text: And Serug lived two hundred years after he fathered Nahor, and he fathered sons and daughters.
translation:
  language: tl
  text: Pagkatapos niyang maging ama ni Nahor, nabuhay si Serug nang dalawang daang taon, at naging ama siya ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Nabuhay
  rationale: Sa pormulang talaangkanan, ang חיה ay tumutukoy sa haba ng panahong nabuhay ang isang tao; natural sa Filipino ang “nabuhay nang … taon.”
- source_word: שְׂרוּג
  choice: Serug
  rationale: Ginamit ang karaniwang anyo ng pangalang pantangi sa mga saling Filipino.
- source_word: אַחֲרֵי
  choice: matapos
  rationale: Malinaw at natural na panandang temporal para sa panahong kasunod ng kapanganakan ni Nahor.
- source_word: הוֹלִידוֹ אֶת־נָחוֹר
  choice: niyang maging ama ni Nahor
  rationale: Ang Hiphil ng ילד sa talaangkanan ay nagpapahayag ng pagiging ama. Iniiwasan nito ang lipas na “ipinanganak” na maaaring magmukhang ang ama mismo ang nagsilang.
- source_word: מָאתַיִם שָׁנָה
  choice: dalawang daang taon
  rationale: Tumpak at likas na katumbas ng tagal na dalawang daang taon.
- source_word: וַיּוֹלֶד
  choice: nagkaroon pa siya
  rationale: Sa ikalawang sugnay, natural sa Filipino ang “nagkaroon pa siya” upang ipahayag na nagkaanak pa si Serug pagkatapos ni Nahor; ang “pa” ay ipinahihiwatig ng konteksto ng talaangkanan.
- source_word: בָּנִים וּבָנוֹת
  choice: mga anak na lalaki at babae
  rationale: Pinananatili ang tahasang pagbanggit sa kapwa mga anak na lalaki at babae, sa halip na gawing pangkalahatang “mga anak.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa estilong talaangkanan. Pinili ang natural na pariralang “maging ama” at “nagkaroon pa” sa halip na arkaikong “nagkaanak/ipaluwal” o teknikal na “nagluwal,” habang pinananatili ang eksaktong tagal at pagkilala sa mga anak na lalaki at babae.
