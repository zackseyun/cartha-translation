  text: וַ/יָּ֨פֶץ יְהוָ֥ה אֹתָ֛/ם מִ/שָּׁ֖ם עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַֽ/יַּחְדְּל֖וּ לִ/בְנֹ֥ת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/008.yaml
  text: So Yahweh scattered them from there over the face of all the earth[a], and they stopped building the city.
translation:
  language: tl
  text: Kaya pinangalat sila ni Yahweh mula roon sa buong daigdig[a], at tumigil sila sa pagtatayo ng lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa buong lupa” o “sa lahat ng dako ng lupa”; literal sa Hebreo, “sa ibabaw ng mukha ng buong lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: pinangalat
  rationale: Ang pandiwang פוץ sa anyong causative ay tumutukoy sa pagpapangalat sa mga tao; likas sa Tagalog ang “pinangalat” at angkop sa konteksto ng hatol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: מִשָּׁם
  choice: mula roon
  rationale: Payak at natural na panandang pook na tumutukoy pabalik sa Babel.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: sa buong ibabaw ng lupa
  rationale: Pinananatili nito ang larawan ng Hebreong idyomang “sa ibabaw/mukha ng buong lupa,” habang malinaw pa rin sa modernong Tagalog.
- source_word: וַיַּחְדְּלוּ
  choice: tumigil sila
  rationale: Malinaw at pangkaraniwang katumbas ng חדל na nagsasaad ng paghinto sa isang gawain.
- source_word: לִבְנֹת
  choice: sa pagtatayo
  rationale: Natural na anyong Tagalog pagkatapos ng “tumigil,” bagaman infinitive construct ang anyong Hebreo.
- source_word: הָעִיר
  choice: ng lungsod
  rationale: Tumutukoy sa tiyak na lungsod na itinatayo sa naunang konteksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang Hebreong larawang “ibabaw ng lupa,” ngunit ginawang natural ang ayos ng pangungusap.
