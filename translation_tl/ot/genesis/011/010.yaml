base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/010.yaml
  text: These are the generations of Shem. Shem was one hundred years old[a], and he fathered Arpachshad two years after the flood.
translation:
  language: tl
  text: Ito ang salinlahi ni Sem. Isang daang taong gulang si Sem nang maging ama siya ni Arpakshad[a], dalawang taon pagkatapos ng baha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Arpakshad ay tuwirang sumusunod sa anyong Hebreo; tinatawag din siyang Arfaksad sa ilang salin batay sa anyong Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת שֵׁם
  choice: Ito ang salinlahi ni Sem
  rationale: Ang pormulang toledot sa Genesis ay pamagat ng tala tungkol sa linyang nagmula sa isang tao. Likas sa modernong Tagalog ang isahang kolektibong “salinlahi,” kaya “Ito ang” ang kaayon nito.
- source_word: שֵׁם בֶּן מְאַת שָׁנָה
  choice: Isang daang taong gulang si Sem
  rationale: Isinalin nang idiomatiko ang Hebreong pananalita sa edad, na literal na “anak ng isang daang taon.”
- source_word: וַיּוֹלֶד אֶת אַרְפַּכְשָׁד
  choice: nang maging anak niya si Arpaksad
  rationale: Ipinahahayag ng Hiphil ng ילד ang pagiging ama o pag-aanak sa talaangkanan. Ang “maging anak niya” ay natural at malinaw sa Tagalog nang hindi gumagamit ng makaluma o teknikal na pananalita.
- source_word: שְׁנָתַיִם אַחַר הַמַּבּוּל
  choice: dalawang taon matapos ang baha
  rationale: Tuwirang pinananatili ang pagitan ng dalawang taon at ang tiyak na pagtukoy sa bahang nauna nang isinalaysay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple at marangal. Ginamit ang “salinlahi” para sa pormulang pangkayarian ng Genesis at “baha” bilang karaniwang tawag sa bahang isinalaysay sa naunang mga kabanata.
