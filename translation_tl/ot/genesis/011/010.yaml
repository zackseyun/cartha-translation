  - severity: low
    issue: Kulang ang transliterasyon ng pangalang Arpaksad sa tunog na sh ng Hebreo.
    rationale: Ang אַרְפַּכְשָׁד ay may כְשׁ (ksh). Ang “Arpakshad” ay mas tapat na paglilipat ng anyong Hebreo, samantalang ang “Arfaksad” ay maaaring itala bilang anyong Griyego/tradisyonal.
