source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה הֵ֣ן עַ֤ם אֶחָד֙ וְ/שָׂפָ֤ה אַחַת֙ לְ/כֻלָּ֔/ם וְ/זֶ֖ה הַחִלָּ֣/ם לַ/עֲשׂ֑וֹת וְ/עַתָּה֙ לֹֽא יִבָּצֵ֣ר מֵ/הֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/006.yaml
  text: And Yahweh said[a], "Behold, they are one people, and they all have one language, and this is what they have begun to do. And now nothing that they plan to do will be withheld from them."
translation:
  language: tl
  text: Sinabi ni Yahweh, “Narito, iisang bayan sila, at iisa ang wika nilang lahat. Ito ang sinimulan nilang gawin. Ngayon, walang anumang binabalak nilang gawin ang hindi nila makakaya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “walang anumang binabalak nilang gawin ang maipagkakait sa kanila.”'
    reason: Ipinakikita ang alternatibong kahulugan ng לֹא יִבָּצֵר מֵהֶם, na maaaring tumukoy sa pagiging imposible o hindi maaabot, o sa pagiging ipinagkait.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הֵן
  choice: Narito
  rationale: Pinananatili ang pansing panawag ng Hebreo sa paraang marangal at likas sa makabagong Tagalog.
- source_word: עַם אֶחָד
  choice: iisang bayan sila
  rationale: Ang עַם ay tumutukoy sa isang pangkat ng mga tao, hindi kinakailangang sa isang estadong pampolitika; malinaw itong naihahayag ng “iisang bayan.”
- source_word: וְשָׂפָה אַחַת לְכֻלָּם
  choice: iisa ang wika nilang lahat
  rationale: Ang literal na “isang labi” ay idyomang Hebreo para sa iisang wika o pananalita; pinananatili rin ng salin ang diin sa kanilang lahat.
- source_word: וְזֶה הַחִלָּם לַעֲשׂוֹת
  choice: Ito ang sinimulan nilang gawin
  rationale: Tuwirang inilalarawan ng Hiphil ng חלל ang pagsisimula, nang hindi idinaragdag na “pasimula pa lamang,” na mas tahasang interpretatibo.
- source_word: לֹא יִבָּצֵר מֵהֶם
  choice: hindi nila makakaya
  rationale: Sa konteksto, ipinahihiwatig ng Niphal ng בצר na walang planong hindi nila maaabot o magagawa; natural itong naipapahayag sa Tagalog bilang kawalan ng hindi nila makakaya.
- source_word: כֹּל אֲשֶׁר יָזְמוּ לַעֲשׂוֹת
  choice: anumang binabalak nilang gawin
  rationale: Ang יזם ay nangangahulugang magbalak o magpanukala; malinaw at pangkasalukuyan ang “binabalak.”
theological_decisions:
- issue: Saklaw ng pahayag tungkol sa kakayahan ng nagkakaisang sangkatauhan
  choice: Inilalahad ang lakas ng kanilang nagkakaisang pagkilos sa loob ng salaysay, nang hindi ito ginagawang pahayag na lubos ang kanilang kapangyarihan.
  alternative: Maaari rin itong unawain bilang pagsasabing walang maipagkakait o maipagbabawal sa kanila.
  rationale: Ang Hebreo ay may tensiyon sa pagitan ng pagiging hindi maaabot o imposible at ng pagiging ipinagkait. Pinananatili ng pangunahing salin ang natural na diwa sa konteksto, at itinatala sa talababa ang tunay na alternatibong leksikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Narito” bilang pormal ngunit nauunawaang pansing panawag, at iniwasan ang sobrang literal na “isang labi.”
