base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/015.yaml
  text: And Shelah lived 403 years after he fathered Eber[a], and he fathered sons and daughters.
translation:
  language: tl
  text: At nabuhay si Sela nang 403 taon matapos niyang maging ama ni Eber[a], at nagkaroon siya ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Matapos niyang maging ama ni Eber, nabuhay si Sela nang 403 taon.”
    reason: Ipinapakita ang alternatibong ayos ng pangungusap na mas malapit sa pagkakasunod-sunod ng mga parirala sa Hebreo, nang walang pagbabago sa kahulugan.
lexical_decisions:
- source_word: וַיְחִי
  choice: nabuhay
  rationale: Sa pormulang talaangkanan, likas na katumbas nito ang “nabuhay,” na tumutukoy sa haba ng panahong ipinagpatuloy ng tao ang kanyang buhay.
- source_word: שֶׁלַח
  choice: Sela
  rationale: Tuwirang transliterasyon sa baybay na angkop sa Filipino; hindi na ipinapakita ang di-binibigkas na panghuling h ng anyong Ingles na “Shelah.”
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת עֵבֶר
  choice: matapos niyang maging ama ni Eber
  rationale: Pinananatili nito ang panlalaking diwa ng causative na anyo ng ילד sa talaangkanan, habang natural at malinaw sa modernong Filipino.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 taon
  rationale: Ang literal na ayos na “tatlong taon at apat na raang taon” ay karaniwang Hebreong paraan ng pagsasabi ng bilang na 403; ginamit ang karaniwang anyong Filipino.
- source_word: וַיּוֹלֶד
  choice: nagkaroon siya
  rationale: Sa buod ng talaangkanan, natural nitong ipinahahayag na nagkaanak pa si Sela, nang hindi gumagamit ng makalumang pananalita.
- source_word: בָּנִים וּבָנוֹת
  choice: mga anak na lalaki at babae
  rationale: Tahasan nitong pinananatili ang dalawang pangkat na binanggit sa Hebreo sa halip na gawing pangkalahatang “mga anak” lamang.
