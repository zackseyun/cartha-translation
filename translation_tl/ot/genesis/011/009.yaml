  text: עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ בָּבֶ֔ל כִּי שָׁ֛ם בָּלַ֥ל יְהוָ֖ה שְׂפַ֣ת כָּל הָ/אָ֑רֶץ וּ/מִ/שָּׁם֙ הֱפִיצָ֣/ם יְהוָ֔ה עַל פְּנֵ֖י כָּל הָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/009.yaml
  text: Therefore its name was called Babel[a], because there Yahweh confused the language of all the earth, and from there Yahweh scattered them over the face of all the earth.
translation:
  language: tl
  text: Kaya tinawag na Babel[a] ang lugar na iyon, sapagkat doon ginulo ni Yahweh ang wika ng buong daigdig, at mula roon ay ikinalat sila ni Yahweh sa buong daigdig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Babel” ay kahawig sa tunog ng pandiwang Hebreo na balal, na nangangahulugang “guluhin” o “paghaluin.” Ito ang larong-salitang nagpapaliwanag sa pangalan sa talatang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Likas at maikli itong panandang naghahayag ng bunga o dahilan sa makabagong Tagalog.
- source_word: קָרָא שְׁמָהּ
  choice: tinawag na ... ang lugar na iyon
  rationale: Ang Hebreo ay literal na 'tinawag ang pangalan nito.' Ipinahihiwatig ng pambabaeng hulapi ang lungsod o lugar; iniiwasan ng natural na pasibong Tagalog ang pagdaragdag ng di-tiyak na tagaganap.
- source_word: בָּבֶל
  choice: Babel
  rationale: Pinananatili ang pangalang pantangi at ipinapaliwanag sa talababa ang larong-salita nito sa pandiwang balal.
- source_word: כִּי שָׁם
  choice: sapagkat doon
  rationale: Pinananatili ang paliwanag sa dahilan ng pagpapangalan at ang pagtukoy sa lugar.
- source_word: בָּלַל
  choice: ginulo
  rationale: Sa konteksto, tumutukoy ito sa paggulong o paghahalo ng pananalita kaya hindi na magkaunawaan ang mga tao; natural ang 'ginulo' nang hindi labis na nagpapaliwanag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: שְׂפַת כָּל הָאָרֶץ
  choice: ang wika ng buong daigdig
  rationale: Ang שָׂפָה ay literal na 'labi' ngunit idyomatikong nangangahulugang wika o pananalita; 'wika' ang malinaw at natural dito.
- source_word: וּמִשָּׁם
  choice: at mula roon
  rationale: Pinananatili ang ugnayang heograpikal sa lugar na kababanggit lamang.
- source_word: הֱפִיצָם
  choice: ikinalat sila
  rationale: Ipinahahayag ng Hiphil na anyo ang pagpapangalat sa mga tao sa iba't ibang lugar; malinaw at karaniwan ang 'ikinalat.'
- source_word: עַל פְּנֵי כָּל הָאָרֶץ
  choice: sa buong daigdig
  rationale: Natural na katumbas sa Tagalog ng Hebreong idyomang 'sa ibabaw ng mukha ng buong lupa,' habang pinananatili ang lawak at pag-uulit ng 'buong daigdig.'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; PANGINOON
  rationale: Pangalang pantangi ang Tetragrammaton sa teksto. Pinananatili ng 'Yahweh' ang pangalan sa halip na palitan ito ng titulo; hindi naman iginiit ng talata ang isang denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'lugar na iyon' upang maging natural ang pormula ng pagpapangalan at malinaw ang pambabaeng reperente ng hulapi sa שְׁמָהּ, nang hindi nagdaragdag ng tiyak na tagaganap. Pinanatili ang pag-uulit ng 'Yahweh' at 'buong daigdig' mula sa Hebreo.
