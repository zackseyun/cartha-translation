translation_notes:
  register: Modernong Filipino na simple, dignified, at angkop sa maikling pormula ng talaangkanan. Ginamit ang “naging ama” sa halip na mas luma o teknikal na “nagkaanak” o “ipinanganak,” upang malinaw na si Eber ang ama ni Peleg.
