  yaml_path: translation/ot/genesis/011/016.yaml
  text: Eber lived thirty-four years and fathered Peleg.
translation:
  language: tl
  text: Nabuhay si Eber nang tatlumpu't apat na taon, at naging ama siya ni Peleg.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Nabuhay
  rationale: Sa pormulang talaangkanan, ipinapahayag nito ang bilang ng mga taon ng buhay bago ang kasunod na pangyayari; natural at tumpak dito ang “Nabuhay … nang … taon.”
- source_word: עֵבֶר
  choice: Eber
  rationale: Direktang transliterasyon ng pangalang Hebreo sa anyong karaniwang ginagamit sa makabagong Filipino.
- source_word: אַרְבַּע וּשְׁלֹשִׁים שָׁנָה
  choice: tatlumpu't apat na taon
  rationale: Iniaayos sa likas na pagkakasunod sa Filipino ang literal na “apat at tatlumpung taon,” habang pinananatili ang eksaktong bilang.
- source_word: וַיּוֹלֶד
  choice: naging ama siya ni
  rationale: Sa konteksto ng talaangkanan at may lalaking simuno, tumutukoy ito sa pagiging ama o pag-aanak; malinaw at marangal sa kasalukuyang Filipino ang pariralang ito.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang hiwalay na katumbas sa Filipino; naipapakita ang tungkulin nito sa normal na balangkas ng pangungusap.
- source_word: פָּלֶג
  choice: Peleg
  rationale: Direktang transliterasyon ng personal na pangalan mula sa Hebreo, sa anyong nakikilala sa Filipino.
