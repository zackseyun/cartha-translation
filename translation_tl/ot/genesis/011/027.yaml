  yaml_path: translation/ot/genesis/011/027.yaml
  text: 'These are the generations of Terah: Terah fathered Abram, Nahor, and Haran; and Haran fathered Lot.'
translation:
  language: tl
  text: 'Ito ang mga salinlahi ni Terah: Si Terah ang naging ama nina Abram, Nahor, at Haran; at si Haran ang naging ama ni Lot.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Ipinakikilala ng parirala ang isang bagong bahagi ng salaysay. Hindi na ginamitan ng hiwalay na “at” sapagkat sapat at mas natural sa modernong Tagalog ang “Ito ang” para sa ganitong pambungad.
- source_word: תּוֹלְדֹת
  choice: salaysay tungkol sa lahi ni
  rationale: Ang תּוֹלְדֹת ay pormulang pansalaysay sa Genesis na maaaring tumukoy sa nagmula sa isang tao at sa kasaysayan ng kaniyang linya. Pinananatili ng “salaysay tungkol sa lahi” ang malawak na saklaw nito nang hindi nililimitahan sa listahan lamang ng mga inapo.
- source_word: תֶּרַח
  choice: Terah
  rationale: Ginamit ang karaniwang transliterasyon ng pangalang pantangi sa Filipino.
- source_word: הוֹלִיד
  choice: naging ama
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay nangangahulugang nagkaanak o naging ama. Likas at marangal sa kasalukuyang Tagalog ang “naging ama,” at iniiwasan nito ang makaluma o masyadong teknikal na pananalita.
- source_word: אֶת אַבְרָם אֶת נָחוֹר וְאֶת הָרָן
  choice: nina Abram, Nahor, at Haran
  rationale: Ang mga pananda ng tuwirang layon ay hindi isinasalin nang hiwalay. Ginamit ang “nina” para sa maramihang pangalang tumutukoy sa mga anak.
- source_word: וְהָרָן הוֹלִיד אֶת לוֹט
  choice: at si Haran ang naging ama ni Lot
  rationale: Tuwirang pinanatili ng “at” ang pag-uugnay ng ikalawang sugnay, at pareho ang salin ng inuulit na pandiwang הוֹלִיד.
