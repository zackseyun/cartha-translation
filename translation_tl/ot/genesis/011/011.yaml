  text: And Shem lived five hundred years after he fathered Arpachshad, and he fathered sons and daughters.
translation:
  language: tl
  text: Nabuhay pa si Sem nang limang daang taon matapos niyang maging ama ni Arpacsad, at naging ama rin siya ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Nabuhay pa
  rationale: Ipinahahayag ng pandiwa sa kontekstong talaangkanan ang pagpapatuloy ng buhay ni Sem sa itinakdang panahon matapos ang kapanganakan ni Arpacsad.
- source_word: שֵׁם
  choice: Sem
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa modernong saling Tagalog.
- source_word: אַחֲרֵי
  choice: matapos
  rationale: Malinaw at likas na panandang temporal para sa panahong sumunod sa pagiging ama ni Sem kay Arpacsad.
- source_word: הוֹלִידוֹ
  choice: niyang maging ama
  rationale: Ang Hiphil ng ילד ay tumutukoy sa pag-aanak o pagiging ama; natural itong pakinggan sa Tagalog habang pinananatili ang papel ng lalaking magulang.
- source_word: אַרְפַּכְשָׁד
  choice: Arpacsad
  rationale: Transliterasyong umaayon sa baybay at bigkas na madaling gamitin ng karaniwang mambabasang Tagalog.
- source_word: חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: limang daang taon
  rationale: Tuwirang modernong Tagalog para sa tagal na limang daang taon.
- source_word: וַיּוֹלֶד
  choice: nagkaroon siya ng iba pang mga anak
  rationale: Sa natural na Tagalog, ipinahahayag nito ang karagdagang mga anak na isinilang kay Sem; idinagdag ang 'iba pang' dahil nauna nang tahasang binanggit si Arpacsad.
- source_word: בָּנִים וּבָנוֹת
  choice: mga anak na lalaki at babae
  rationale: Pinananatili ang tahasang pagbanggit ng Hebreo sa kapwa mga anak na lalaki at mga anak na babae.
