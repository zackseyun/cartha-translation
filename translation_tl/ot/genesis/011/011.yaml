- from: Nabuhay pa si Sem nang limang daang taon matapos niyang maging ama ni Arpacsad, at nagkaroon siya ng iba pang mga anak na lalaki at babae.
  to: Nabuhay pa si Sem nang limang daang taon matapos niyang maging ama ni Arpacsad, at naging ama rin siya ng mga anak na lalaki at babae.
  rationale: Inalis ang dagdag na “iba pang” upang hindi lumampas sa sinabi ng pinagmulan. Pinalitan ang “nagkaroon siya” ng “naging ama rin siya” upang mas malinaw na maipahayag ang inuulit na pandiwang genealogical na tumutukoy sa pagiging ama, habang pinananatili ang modernong Filipino Tagalog at ang tahasang “mga anak na lalaki at babae.”
