  text: Nahor lived twenty-nine years and fathered Terah.
translation:
  language: tl
  text: Dalawampu't siyam na taong gulang si Nahor nang maging ama siya ni Terah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Nang … taong gulang si Nahor
  rationale: Sa pormulang talaangkanan, tumutukoy ito sa edad ni Nahor bago ang kasunod na pangyayari; likas itong ipinahayag sa modernong Tagalog sa ganitong ayos.
- source_word: נָחוֹר
  choice: Nahor
  rationale: Isinalin sa karaniwang anyo ng pangalang ito sa Filipino.
- source_word: תֵּשַׁע וְעֶשְׂרִים שָׁנָה
  choice: dalawampu't siyam na taong gulang
  rationale: Isinaayos ang literal na ‘siyam at dalawampung taon’ ayon sa likas na bilang at pagpapahayag ng edad sa modernong Tagalog.
- source_word: וַיּוֹלֶד
  choice: naging anak niya
  rationale: Ang Hiphil ng ילד sa talaangkanan ay nangangahulugang naging ama siya ng isang anak; ang pariralang ito ay natural at malinaw sa karaniwang Tagalog.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at wala itong hiwalay na katumbas sa Tagalog.
- source_word: תָּרַח
  choice: Terah
  rationale: Isinalin sa karaniwang anyo ng pangalang ito sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at madaling maunawaan. Ginamit ang likas na pormulang ‘naging anak niya’ sa halip na ang makaluma o mas teknikal na ‘ipinanganak niya’ o ‘naging ama siya ni.’
