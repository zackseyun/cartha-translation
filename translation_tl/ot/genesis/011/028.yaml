base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/028.yaml
  text: And Haran died in the presence of Terah his father[a], in the land of his birth, in Ur of the Chaldeans.
translation:
  language: tl
  text: At namatay si Haran sa harap ng kanyang amang si Terah[a], sa lupaing sinilangan niya, sa Ur ng mga Caldeo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “bago mamatay ang kanyang amang si Terah,” ibig sabihin, habang buhay pa ang kanyang ama. Literal sa Hebreo: “sa ibabaw ng mukha ng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: At namatay
  rationale: Ang wayyiqtol ng מות ay tuwirang nagsasalaysay ng pangyayaring naganap; natural sa salaysay na Tagalog ang “At namatay.”
- source_word: עַל־פְּנֵי
  choice: sa harap ng
  rationale: Pinananatili nito ang kongkretong larawan ng idyomang Hebreo at ang likas na kalabuan kung ito ay nangangahulugang nasa presensiya/paningin ng ama o namatay habang buhay pa ang ama.
- source_word: תֶּרַח אָבִיו
  choice: kanyang amang si Terah
  rationale: Malinaw at natural nitong ipinakikilalang si Terah ang ama ni Haran.
- source_word: בְּאֶרֶץ מוֹלַדְתּוֹ
  choice: sa lupaing sinilangan niya
  rationale: Likas na modernong Tagalog ito para sa lupa o bayang pinagmulan at kapanganakan, nang hindi ginagawang mas tiyak kaysa sa Hebreo.
- source_word: בְּאוּר כַּשְׂדִּים
  choice: sa Ur ng mga Caldeo
  rationale: Pinananatili ang pangalang pook na Ur at isinasalin ang etnonimong כַּשְׂדִּים sa nakaugaliang Tagalog na “mga Caldeo.”
theological_decisions:
- issue: Kahulugan ng עַל־פְּנֵי kaugnay ng pagkamatay ni Haran
  choice: sa harap ng kanyang amang si Terah
  alternative: bago namatay ang kanyang amang si Terah / habang buhay pa ang kanyang ama
  rationale: Hindi dapat tahimik na lutasin bilang pawang temporal ang idyoma; ang pangunahing salin ay nagpapanatili sa konkretong pahayag, samantalang inilalahad sa talababa ang posibleng temporal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “amang si Terah” para sa natural na ayos ng Filipino at “sa harap ng” upang mapanatili ang idyomatikong tensiyon ng Hebreo; ipinaliwanag ang alternatibong temporal na kahulugan sa talababa.
