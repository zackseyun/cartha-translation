    issue: Hindi sapat na tiyak ang “nagkaanak ng mga lalaki at babae.”
    rationale: Maaari itong basahin bilang pangkalahatang “nagkaanak ng male at female,” samantalang malinaw na tinutukoy ng Hebreo ang mga anak na lalaki at mga anak na babae. Idinaragdag ng “mga anak na” ang kinakailangang ugnayan nang hindi nagdaragdag ng kahulugan.
  - severity: low
    issue: Bahagyang bitin ang paksa sa “Matapos maging ama ni Sela.”
    rationale: Bagaman nauunawaan mula sa pangunahing sugnay na si Arpacsad ang ama, ang “Matapos niyang maging ama ni Sela” ay mas malinaw at likas na modernong Filipino.
  revised_text: Matapos niyang maging ama ni Sela, nabuhay pa si Arpacsad nang 403 taon, at nagkaroon siya ng mga anak na lalaki at babae.
