  text: Arpachshad lived 403 years after he fathered Shelah[a], and he fathered sons and daughters.
translation:
  language: tl
  text: Matapos niyang maging ama ni Sela, nabuhay pa si Arpacsad nang 403 taon, at nagkaroon siya ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: nabuhay pa
  rationale: Sa pormulang talaangkanan, ipinapahayag nito ang ipinagpatuloy na haba ng buhay matapos isilang ang pinangalanang anak; likas sa Tagalog ang “nabuhay pa.”
- source_word: אַרְפַּכְשַׁד
  choice: Arpacsad
  rationale: Transliterasyong angkop sa ortograpiyang Filipino na malapit sa anyong Hebreo.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: Matapos maging ama ni
  rationale: Malinaw nitong ipinahahayag ang panahong kasunod ng pag-aanak at pinananatili ang panlalaking pananaw ng Hebreong pandiwa nang hindi gumagamit ng makalumang pananalita.
- source_word: שֶׁלַח
  choice: Sela
  rationale: Payak na transliterasyong Filipino ng pangalang Hebreo.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 taon
  rationale: Pinananatili ang eksaktong bilang habang inaayos sa karaniwang ayos at anyo ng bilang sa modernong Filipino.
- source_word: וַיּוֹלֶד
  choice: nagkaanak
  rationale: Natural at malinaw sa modernong Filipino; ipinahihiwatig ng paksa na si Arpacsad ang ama nang hindi gumagamit ng mabigat o makalumang kataga.
- source_word: בָּנִים וּבָנוֹת
  choice: mga lalaki at babae
  rationale: Pinananatili ang tahasang pagbanggit ng Hebreo sa kapwa mga anak na lalaki at mga anak na babae, sa halip na gawing pangkalahatang “mga anak” lamang.
