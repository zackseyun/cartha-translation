  source_fidelity: 'Kailangang iwasto ang pangunahing panaguri: ang “naging anak niya si Eber” ay nagsasabing si Eber ang naging anak ni Shela, sa halip na ipahayag na si Shela ang naging ama ni Eber. Hindi nito wastong isinasalin ang Hiphil ng ילד sa pormulang talaangkanan. Ang “Nang tatlumpung taong gulang si Shelah, naging ama siya ni Eber” ay tumpak na naghahayag ng edad at pagiging ama.'
  naturalness: Ang binagong pangungusap ay payak, natural, at angkop sa makabagong Filipino at sa marangal na rehistro ng talaangkanan. Mas malinaw ito kaysa sa kasalukuyang ayos at hindi gumagamit ng makalumang “nagkaanak” o “inanak.”
  terminology: Ginamit ang “Shelah,” na mas malinaw na tumutugma sa שֶׁלַח kaysa “Shela”; iniiwan sa talababa ang “Sala” bilang tradisyonal na alternatibo. Pinanatili ang “Eber,” na mas tuwirang kumakatawan sa עֵבֶר kaysa “Heber.”
