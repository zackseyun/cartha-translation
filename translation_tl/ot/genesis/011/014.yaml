translation:
  language: tl
  text: Nang tatlumpung taong gulang si Shelah[a], naging ama siya ni Eber[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sala”; “Shelah” ang mas tuwirang kumakatawan sa pangalang Hebreo rito.
