lexical_decisions:
- source_word: וְ/שֶׁלַח
  choice: Shela
  rationale: Direktang inililipat sa modernong baybay-Filipino ang pangalang Hebreo na שֶׁלַח; pinanatili ang tunog na “sh” upang maipakita ang anyong nasa tekstong Hebreo.
- source_word: חַי שְׁלֹשִׁים שָׁנָה
  choice: Nang tatlumpung taong gulang na
  rationale: Sa pormulang talaangkanan, ipinahahayag nito ang edad ni Shela nang mangyari ang kasunod na pangyayari. Mas natural at malinaw ito sa Filipino kaysa sa literal na “nabuhay nang tatlumpung taon,” na maaaring magpahiwatig na iyon ang kabuuang haba ng kanyang buhay.
- source_word: וַ/יּוֹלֶד
  choice: naging anak niya
  rationale: Natural na paraan ito sa Filipino upang sabihing siya ang ama sa pormulang talaangkanan, nang hindi gumagamit ng makaluma o mabigat na pananalita.
- source_word: אֶת
  choice: '[hindi isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at wala itong hiwalay na katumbas sa Filipino.
- source_word: עֵבֶר
  choice: Eber
  rationale: Direktang transliterasyon ito ng pangalang Hebreo na עֵבֶר; ang tradisyonal na “Heber” ay hindi kasinglapit sa anyong Hebreo rito.
