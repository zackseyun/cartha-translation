  yaml_path: translation/ot/genesis/011/007.yaml
  text: Come, let us go down there and confuse their language, so that one man will not understand the language of his neighbor.
translation:
  language: tl
  text: Halikayo, bumaba tayo roon at guluhin natin ang kanilang wika, upang hindi nila maunawaan ang wika ng isa't isa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: Halikayo
  rationale: Isang panawagang naghihikayat sa maramihan; natural nitong naihahatid ang diwang hortatory ng Hebreo.
- source_word: נֵרְדָה
  choice: bumaba tayo
  rationale: Pinananatili ang first-person plural cohortative na anyong paanyaya sa sama-samang pagkilos.
- source_word: וְנָבְלָה
  choice: at guluhin natin
  rationale: Ipinapahayag ang sinadyang paglikha ng kalituhan nang hindi labis na tinutukoy ang eksaktong paraan nito.
- source_word: שְׂפָתָם
  choice: ang kanilang wika
  rationale: Bagaman literal na 'labi,' ang salita rito ay metonimiya para sa wika.
- source_word: אִישׁ שְׂפַת רֵעֵהוּ
  choice: ang wika ng isa't isa
  rationale: Natural na modernong Tagalog para sa distributibong idyomang 'bawat tao ... ng kaniyang kapwa,' at hindi nililimitahan ang tinutukoy sa mga lalaking adulto.
theological_decisions:
- issue: Maramihang pananalita ng Diyos
  choice: bumaba tayo ... guluhin natin
  alternative: bababa ako ... guguluhin ko
  rationale: Pinananatili ang gramatikal na maramihan at ang tunay na teolohikal na tensiyon ng pinagmulan nang hindi ipinapaliwanag kung sino ang kausap.
- issue: Layunin ng paggulo sa wika
  choice: upang hindi nila maunawaan
  alternative: kaya hindi nila mauunawaan
  rationale: Pinananatili ang malinaw na layuning ipinahihiwatig ng אֲשֶׁר לֹא sa kontekstong ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “isa't isa” sa halip na literal na “isang lalaki ... ng kaniyang kapwa” upang maipahayag ang Hebreong distributibong kahulugan nang hindi maging matigas o mapanlinlang sa kasarian.
