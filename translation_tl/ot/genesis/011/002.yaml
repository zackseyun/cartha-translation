translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “sila’y” upang maging maayos ang daloy, habang iniwasan ang makalumang pormulang “at nangyari.” Pinanatili sa talababa ang tunay na heograpikong kalabuan ng Hebreo.
