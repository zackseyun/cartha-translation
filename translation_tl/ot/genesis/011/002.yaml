  text: And as they journeyed from the east[a], they found a plain in the land of Shinar and settled there.
translation:
  language: tl
  text: Habang naglalakbay sila mula sa silangan[a], nakatagpo sila ng isang kapatagan sa lupain ng Shinar at doon sila nanirahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habang naglalakbay sila pasilangan.” Maaaring tumukoy ang pariralang Hebreo na מִקֶּדֶם sa pinagmulan (“mula sa silangan”) o sa direksiyon (“pasilangan”).
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בְּנָסְעָם
  choice: At nang sila'y maglakbay
  rationale: Ang וַיְהִי ay likas na isinama sa sugnay na panahunan, at ang נסע ay isinaling “maglakbay” upang ipahayag ang sama-samang pag-alis at pagpapatuloy ng paglalakbay nang hindi labis na ipinapalagay ang teknikal na diwa ng migrasyon.
- source_word: מִקֶּדֶם
  choice: mula sa silangan
  rationale: Pinapanatili ng “mula sa” ang pinakakaraniwang diwa ng מִן bilang pinagmulan; ang posibleng kahulugang direksiyon na “pasilangan” ay inilagay sa talababa.
- source_word: וַיִּמְצְאוּ
  choice: nakatagpo sila
  rationale: Likas na katumbas ito ng מצא sa konteksto ng mga manlalakbay na nakarating sa isang heograpikong pook.
- source_word: בִקְעָה
  choice: isang kapatagan
  rationale: Ang בִקְעָה ay malawak at patag na mababang lupain o lambak; “kapatagan” ang malinaw at natural na salin sa konteksto.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: sa lupain ng Shinar
  rationale: Napananatili ang אֶרֶץ bilang “lupain” at ang pangalang heograpiko bilang transliterasyong “Shinar.”
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: at doon sila nanirahan
  rationale: Sa konteksto ng pagtatapos ng kanilang paglalakbay, ipinahihiwatig ng ישב ang paninirahan o pananatili sa lugar; natural sa modernong Filipino ang “nanirahan.”
