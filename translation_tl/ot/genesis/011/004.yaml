base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/004.yaml
  text: And they said[a], “Come, let us build for ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves[b], lest we be scattered over the face of the whole earth.”
translation:
  language: tl
  text: At sinabi nila, “Halika, magtayo tayo ng isang lungsod at isang tore para sa ating sarili, na ang tuktok nito ay nasa kalangitan[a], at gumawa tayo ng pangalan para sa ating sarili, para hindi tayo magkahiwa-hiwalay[b] sa buong daigdig.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “na ang tuktok nito ay umaabot sa kalangitan.” Literal sa Hebreo: “na ang tuktok nito ay nasa kalangitan.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “baka tayo'y mangalat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Halikayo
  rationale: Isang likas at marangal na paanyaya sa sama-samang pagkilos; pinananatili nito ang puwersang panghikayat ng Hebreo.
- source_word: נִבְנֶה לָּנוּ
  choice: magtayo tayo para sa ating sarili
  rationale: Ang anyong kohortatibo ay hinihimok ang sama-samang pagkilos, kaya “magtayo tayo”; tahasang ipinahahayag ng “para sa ating sarili” ang לָּנוּ.
- source_word: עִיר וּמִגְדָּל
  choice: isang lungsod at isang tore
  rationale: Ito ang tuwiran at karaniwang kahulugan ng dalawang pangngalan, nang hindi nagdaragdag ng di-tiyak na tungkuling militar sa tore.
- source_word: וְרֹאשׁוֹ בַשָּׁמַיִם
  choice: na ang tuktok ay nasa kalangitan
  rationale: Pinananatili ang literal at matingkad na pahayag na ang tuktok nito ay “nasa kalangitan,” sa halip na tahasang idagdag ang di-nakasulat na pandiwang “umaabot.”
- source_word: וְנַעֲשֶׂה לָּנוּ שֵׁם
  choice: Gumawa rin tayo ng pangalan para sa ating sarili
  rationale: Pinananatili ang Hebreong idyomang “gumawa ng pangalan” at ang layuning magkaroon ng pagkakakilanlan o katanyagan, nang hindi nililimitahan ito sa iisang paliwanag.
- source_word: פֶּן נָפוּץ
  choice: upang hindi tayo mangalat
  rationale: Ipinapahayag ang negatibong layunin o kinatatakutang bunga ng פֶּן sa natural na modernong Tagalog; ang “mangalat” ay nagpapanatili sa posibilidad ng pagkalat o pagkakawatak-watak.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: sa buong ibabaw ng daigdig
  rationale: Inililipat ang larawang “sa ibabaw/mukha ng buong lupa” sa malinaw na Tagalog; ang “daigdig” ay angkop sa pandaigdig na saklaw ng salaysay.
theological_decisions:
- issue: Saklaw ng הָאָרֶץ sa salaysay tungkol sa Babel
  choice: daigdig
  alternative: lupain
  rationale: Sa konteksto ng sinaunang kasaysayan sa Genesis 11, ang paksa ay ang pagkalat ng sangkatauhan sa buong tinatahanang mundo, hindi lamang sa isang lokal na lupain.
- issue: Kahulugan ng “gumawa ng pangalan”
  choice: Pinanatili ang idyoma nang hindi ito pinalitan ng isang tiyak na paliwanag
  alternative: magkamit ng katanyagan
  rationale: Maaaring saklawin ng parirala ang katanyagan, pagkakakilanlan, at pangmatagalang alaala; pinananatili ng salin ang lawak at tensiyon ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “Halikayo” bilang natural na sama-samang paanyaya, at iniwasan ang labis na kolokyal o sektaryong pananalita.
