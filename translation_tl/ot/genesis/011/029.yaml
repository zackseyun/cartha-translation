  text: וַ/יִּקַּ֨ח אַבְרָ֧ם וְ/נָח֛וֹר לָ/הֶ֖ם נָשִׁ֑ים שֵׁ֤ם אֵֽשֶׁת אַבְרָם֙ שָׂרָ֔י וְ/שֵׁ֤ם אֵֽשֶׁת נָחוֹר֙ מִלְכָּ֔ה בַּת הָרָ֥ן אֲבִֽי מִלְכָּ֖ה וַֽ/אֲבִ֥י יִסְכָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/029.yaml
  text: Abram and Nahor took wives for themselves. The name of Abram’s wife was Sarai[a], and the name of Nahor’s wife was Milcah, the daughter of Haran, the father of Milcah and of Iscah.
translation:
  language: tl
  text: Kumuha sina Abram at Nahor ng kani-kanilang asawa.[a] Ang pangalan ng asawa ni Abram ay Sarai, at ang pangalan ng asawa ni Nahor ay Milca, na anak ni Haran, na ama nina Milca at Isca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas karaniwang pananalita, “Nag-asawa sina Abram at Nahor.” Literal na sinasabi ng Hebreo na “kumuha sila para sa kanilang sarili ng mga asawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kumuha
  rationale: Pinananatili nito ang karaniwang kahulugan ng לקח at ang Hebreong idyomang pagkuha ng asawa, sa halip na agad itong gawing mas interpretatibong “nag-asawa.”
- source_word: לָהֶם
  choice: ng kani-kanilang
  rationale: Likas sa modernong Tagalog ang “kani-kanilang” upang ipahayag na bawat isa kina Abram at Nahor ay kumuha ng asawa para sa sarili.
- source_word: נָשִׁים
  choice: asawa
  rationale: Bagaman maaari itong mangahulugang “mga babae,” malinaw na “asawa” ang kahulugan sa konteksto ng pag-aasawa; katanggap-tanggap sa Tagalog ang pang-isahang anyo kasunod ng “kani-kanilang.”
- source_word: שֵׁם
  choice: Ang pangalan ng
  rationale: Pinananatili ang inuulit na pormal na kayarian ng Hebreo at ang indayog ng talata.
- source_word: אֵשֶׁת
  choice: asawa
  rationale: Sa construct na sinusundan ng pangalan ng lalaki, malinaw na tumutukoy ito sa asawa.
- source_word: שָׂרָי
  choice: Sarai
  rationale: Transliterasyon ng pangalang pantangi ayon sa nakagawiang anyong Filipino.
- source_word: מִלְכָּה
  choice: Milca
  rationale: Ginamit ang nakagawiang anyong Filipino ng pangalang pantangi.
- source_word: בַּת
  choice: anak
  rationale: Sa Tagalog, natural na “anak ni” ang katumbas sa genealogical na konteksto; babae ang tinutukoy na si Milca.
- source_word: הָרָן
  choice: Haran
  rationale: Transliterasyon ng pangalang pantangi.
- source_word: אֲבִי
  choice: ama
  rationale: Ang tuwirang kahulugan na “ama” ang pinakaangkop sa agarang talaangkanang konteksto.
- source_word: יִסְכָּה
  choice: Isca
  rationale: Ginamit ang nakagawiang anyong Filipino ng pangalang pantangi.
