  text: וַ/יִּקַּ֨ח תֶּ֜רַח אֶת אַבְרָ֣ם בְּנ֗/וֹ וְ/אֶת ל֤וֹט בֶּן הָרָן֙ בֶּן בְּנ֔/וֹ וְ/אֵת֙ שָׂרַ֣י כַּלָּת֔/וֹ אֵ֖שֶׁת אַבְרָ֣ם בְּנ֑/וֹ וַ/יֵּצְא֨וּ אִתָּ֜/ם מֵ/א֣וּר כַּשְׂדִּ֗ים לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֥אוּ עַד חָרָ֖ן וַ/יֵּ֥שְׁבוּ שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/031.yaml
  text: Terah took Abram his son[a], Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they set out together from Ur of the Chaldeans to go to the land of Canaan[c][b]. But when they came as far as Haran, they settled there.
translation:
  language: tl
  text: Isinama ni Terah ang anak niyang si Abram, ang apo niyang si Lot—na anak ni Haran[a]—at ang manugang niyang si Sarai, na asawa ng anak niyang si Abram. Umalis silang magkakasama[b] mula sa Ur ng mga Caldeo upang pumunta sa lupain ng Canaan. Dumating sila hanggang sa Haran at doon nanirahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, literal: “si Lot na anak ni Haran, na anak ng kanyang anak”; ibig sabihin, apo ni Terah si Lot.'
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, literal: “umalis sila kasama nila.” Alanganin ang pagtukoy ng pangmaramihang “sila” at “nila”; maaari itong tumukoy sa magkakasamang pangkat ng pamilya.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Isinama
  rationale: Bagaman pangunahing kahulugan ng לקח ang “kunin,” sa konteksto ng paglalakbay, likas sa Tagalog ang “isinama” at malinaw na ipinapakitang dinala ni Terah ang mga kapamilya niya.
- source_word: לוֹט בֶּן־הָרָן בֶּן־בְּנוֹ
  choice: ang apo niyang si Lot—na anak ni Haran
  rationale: Malinaw nitong ipinapahayag ang ugnayan kay Terah habang pinananatili ang pagkakakilanlan kay Lot bilang anak ni Haran. Ipinaliliwanag sa talababa ang mas literal na anyo.
- source_word: כַּלָּתוֹ
  choice: ang manugang niyang si Sarai
  rationale: Ang כַּלָּה rito ay tumutukoy sa babaeng manugang ni Terah. Sa Tagalog, sapat at natural ang “manugang,” at nililinaw ng kasunod na parirala na asawa siya ni Abram.
- source_word: וַיֵּצְאוּ אִתָּם
  choice: Umalis silang magkakasama
  rationale: Ang tekstong Masoretiko ay may pangmaramihang pandiwa at pangmaramihang layon na literal na lumalabas na “umalis sila kasama nila,” isang alanganing pagtukoy na maaaring magmukhang magkakapatong ang mga pangkat. Inihahatid ng “magkakasama” ang diwa nang hindi nagpapasok ng tiyak na paglutas; nasa talababa ang literal na anyo.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: mula sa Ur ng mga Caldeo
  rationale: Ito ang natural at kinikilalang Tagalog na anyo ng pangalang lugar at ng katawagan sa mga Caldeo.
- source_word: לָלֶכֶת אַרְצָה כְּנַעַן
  choice: upang pumunta sa lupain ng Canaan
  rationale: Ipinahahayag ng pawatas at hulaping paturol ang layunin at destinasyon ng paglalakbay.
- source_word: וַיָּבֹאוּ עַד־חָרָן
  choice: Dumating sila hanggang sa Haran
  rationale: Pinananatili ng “hanggang sa” ang puwersa ng עַד, sa halip na gawing karaniwang “dumating sa” lamang.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: at doon nanirahan
  rationale: Sa konteksto ng pandarayuhan at paninirahan, mas angkop ang “nanirahan” kaysa sa pansamantalang “nanatili.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “isinama” at “magkakasama” bilang likas na salin sa konteksto ng paglalakbay, habang pinanatili sa mga talababa ang di-pangkaraniwang anyo at tunay na kalabuan ng Hebreo.
