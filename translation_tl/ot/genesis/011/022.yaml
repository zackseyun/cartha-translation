  yaml_path: translation/ot/genesis/011/022.yaml
  text: Serug lived thirty years and fathered Nahor.
translation:
  language: tl
  text: Nang tatlumpung taon na si Serug, naging ama siya ni Nahor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Nang ... taon na si Serug
  rationale: Sa pormulang talaangkanan, ipinapahayag ng וַיְחִי kasama ng bilang ng mga taon ang edad ni Serug. Ang ganitong ayos ay likas at malinaw sa modernong Tagalog.
- source_word: שְׂרוּג
  choice: Serug
  rationale: Pangalang pantangi na isinalin sa karaniwang transliterasyong ginagamit sa Tagalog.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: tatlumpung taon
  rationale: Ang literal na anyong Hebreo ay idyomatikong tumutukoy sa edad; pinananatili ang bilang at yunit sa natural na Tagalog.
- source_word: וַיּוֹלֶד
  choice: naging anak niya
  rationale: Ang Hiphil ng ילד sa talaangkanan ay nagsasaad na naging ama si Serug ni Nahor. Ang pariralang ito ay natural sa Tagalog at hindi nagpapahiwatig na si Serug mismo ang nanganak.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at wala itong hiwalay na katumbas sa Tagalog.
- source_word: נָחוֹר
  choice: Nahor
  rationale: Pangalang pantangi na isinalin sa karaniwang transliterasyong ginagamit sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at angkop sa paulit-ulit na pormula ng talaangkanan. Iniwasan ang arkaikong “nagkaanak” na maaaring kulang sa tuwirang pagtukoy sa ugnayang ama-anak, gayundin ang “ipinanganak,” na maaaring maling magpahiwatig na si Serug ang nagsilang.
