    issue: “Pinasakan” para sa וַיְסַתְּמוּם
    rationale: Bagaman maaaring maunawaan bilang pagsasara o pagpupuno, hindi ito ang karaniwang likas na paglalarawan sa pagharang sa mga balon at maaaring magpahiwatig ng partikular na paraan. Ang “binara” ay mas tuwiran at masaklaw.
  - severity: low
    issue: Ang huling sugnay ay maaaring gawing mas malapit sa pandiwang Hebreo na “tumawag/magbigay ng pangalan.”
    rationale: Ang “Pinangalanan ... ayon sa mga pangalang” ay katanggap-tanggap, ngunit ang “tinawag niya ... sa mga pangalang ibinigay ng kanyang ama” ay mas malinaw na nagpapakita na ginamit niya ang mga naunang pangalan.
  revised_text: Muling hinukay ni Isaac[a] ang mga balon ng tubig na hinukay noong panahon ng kanyang amang si Abraham at binara ng mga Filisteo pagkamatay ni Abraham. Tinawag niya ang mga ito sa mga pangalang ibinigay ng kanyang ama.
