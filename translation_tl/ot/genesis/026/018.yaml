revisions:
- from: Muling hinukay ni Isaac[a] ang mga balon ng tubig na hinukay noong panahon ng kanyang amang si Abraham. Pinasakan ng mga Filisteo ang mga iyon pagkamatay ni Abraham. Pinangalanan ni Isaac ang mga iyon ayon sa mga pangalang ibinigay ng kanyang ama.
  to: Muling hinukay ni Isaac[a] ang mga balon ng tubig na hinukay noong panahon ng kanyang amang si Abraham at binara ng mga Filisteo pagkamatay ni Abraham. Tinawag niya ang mga ito sa mga pangalang ibinigay ng kanyang ama.
  rationale: Pinalitan ang hindi gaanong likas na “pinasakan” ng “binara,” na wastong sumasaklaw sa Hebreong pandiwang para sa pagsasara o pagharang sa mga balon. Inayos din ang pangwakas na sugnay upang natural na maipahayag na ginamit ni Isaac ang mga pangalang ibinigay ng kanyang ama. Pinanatili ang ambiguity at ang footnote tungkol sa resumptibong gamit ng וַיָּשָׁב.
