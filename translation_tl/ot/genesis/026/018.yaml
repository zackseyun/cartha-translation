base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/018.yaml
  text: Then Isaac dug again the wells of water that had been dug in the days of Abraham his father[a], which the Philistines had stopped up after Abraham's death, and he called them by the names that his father had given them.
translation:
  language: tl
  text: Muling hinukay ni Isaac[a] ang mga balon ng tubig na hinukay noong panahon ng kanyang amang si Abraham at binara ng mga Filisteo pagkamatay ni Abraham. Tinawag niya ang mga ito sa mga pangalang ibinigay ng kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas literal na pagkakasalin, “Bumalik si Isaac at hinukay.” Maaaring tahasang mangahulugan ng “bumalik” ang pandiwang Hebreo, ngunit sa ganitong gamit ay malamang na ipinahahayag nito ang muling paggawa ng kilos: “muling hinukay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב ... וַיַּחְפֹּר
  choice: Muling hinukay ni Isaac
  rationale: Ang שׁוב bago ang kasunod na pandiwa ay maaaring magpahayag ng muling paggawa ng kilos. Likas sa Tagalog ang “muling hinukay” at hindi nito ipinahihiwatig na ang diin ay sa paglalakbay o pisikal na pagbabalik.
- source_word: בְּאֵרֹת הַמַּיִם
  choice: mga balon ng tubig
  rationale: Pinananatili nito ang tahasang pagbanggit sa tubig sa Hebreo habang nananatiling malinaw at natural sa Tagalog.
- source_word: אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו
  choice: na hinukay noong panahon ng kanyang amang si Abraham
  rationale: Ang di-tiyak na maramihang gumagawa sa Hebreo ay likas na naipahahayag sa Tagalog sa anyong nakatuon sa bagay. Ang “noong panahon” ay malinaw na katumbas ng temporal na idyomang בימי.
- source_word: וַיְסַתְּמוּם
  choice: Pinasakan ... ang mga iyon
  rationale: Ipinahahayag ng סתם ang pagbabara o pagsasara sa bukana. Ang “pinasakan” ay natural para sa mga balon at hindi tahasang nagtatakda kung anong materyal ang ginamit.
- source_word: וַיִּקְרָא לָהֶן שֵׁמוֹת כַּשֵּמֹת אֲשֶׁר קָרָא לָהֶן אָבִיו
  choice: Pinangalanan ni Isaac ang mga iyon ayon sa mga pangalang ibinigay ng kanyang ama
  rationale: Malinaw na ipinahahayag ng “pinangalanan” ang pagbibigay ng pangalan, at pinananatili ng “ayon sa” ang diwa ng pagtutugma sa mga pangalang naunang ibinigay ng kanyang ama.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Ito ang karaniwang makabagong anyong Tagalog para sa pangalan ng bayang ito.
