  text: וַ/יֹּאמְר֗וּ רָא֣וֹ רָאִינוּ֮ כִּֽי הָיָ֣ה יְהוָ֣ה עִמָּ/ךְ֒ וַ/נֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖י/נוּ בֵּינֵ֣י/נוּ וּ/בֵינֶ֑/ךָ וְ/נִכְרְתָ֥ה בְרִ֖ית עִמָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/028.yaml
  text: And they said[a], “We have clearly seen that Yahweh has been with you. So we said, ‘Please let there be an oath between us, between you and us[b], and let us make a covenant with you.’”
translation:
  language: tl
  text: At sinabi nila, “Malinaw naming nakita na si Yahweh ay kasama mo. Kaya sinabi namin, ‘Mangyaring magkaroon ng isang panunumpa[a] sa pagitan natin—sa pagitan namin at sa iyo[b]—at makipagtipan kami sa iyo.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panunumpang may kaakibat na sumpa,” sapagkat ang salitang Hebreo ay maaari ring tumukoy sa panunumpang may ipinapataw na sumpa kapag nilabag.
    reason: lexical_alternative
  - marker: b
    text: O “sa pagitan namin, sa pagitan namin at sa iyo.” Pormal at bahagyang paulit-ulit ang Hebreo.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: At sinabi nila
  rationale: Pinananatili ang karaniwang pagsulong ng salaysay na ipinahihiwatig ng waw-consecutive nang hindi labis na tinutukoy ang pagkakasunod sa panahon.
- source_word: רָאוֹ רָאִינוּ
  choice: Malinaw naming nakita
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa katiyakan ng kanilang pagkakita; natural itong naihahayag sa modernong Tagalog sa pamamagitan ng “malinaw.”
- source_word: כִּי הָיָה יְהוָה עִמָּךְ
  choice: na kasama mo si Yahweh
  rationale: Ipinahahayag ang kalagayang nakita nilang totoo kay Isaac at may patuloy na kabuluhan; mas natural sa Tagalog ang walang tahasang pandiwang panahunan dito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: וַנֹּאמֶר
  choice: Kaya sinabi namin
  rationale: Ipinakikita ng “kaya” na ang kanilang panukala ay bunga ng pagkilala nilang kasama ni Isaac si Yahweh.
- source_word: תְּהִי נָא
  choice: Mangyaring magkaroon
  rationale: Inililipat ang magalang na pakiusap ng jussive at ng particle na נָא sa natural na modernong Tagalog.
- source_word: אָלָה
  choice: isang panunumpa
  rationale: Ang “panunumpa” ang malinaw na pangunahing katumbas sa konteksto ng kasunduan, bagaman maaaring kalakip nito ang sumpang ipapataw kapag nilabag ang pangako.
- source_word: בֵּינוֹתֵינוּ בֵּינֵינוּ וּבֵינֶךָ
  choice: sa pagitan natin—sa pagitan namin at mo
  rationale: Pinananatili ang pormal at bahagyang paulit-ulit na anyo ng Hebreo habang nililinaw sa Tagalog ang kapwa-saklaw na “natin” at ang dalawang panig na “kami” at “ikaw.”
- source_word: וְנִכְרְתָה בְרִית
  choice: at makipagtipan kami
  rationale: Natural na Tagalog na katumbas ng idyomang literal na “pumutol ng tipan,” na hindi inililipat nang literal dahil magiging malabo.
- source_word: עִמָּךְ
  choice: sa iyo
  rationale: Tuwirang isinasalin ang pang-ukol at ang panghalip na isahan na tumutukoy kay Isaac.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Saklaw ng אָלָה
  choice: panunumpa sa pangunahing teksto
  alternative: panunumpang may kaakibat na sumpa
  rationale: Hindi dapat piliting gawing tahasang sumpa ang salita, ngunit kailangang mapanatili sa talababa ang posibilidad ng sariling isinumpang kaparusahan kapag nilabag ang pangako.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “natin” para sa inklusibong unang parirala at “namin” para malinaw na itangi ang mga nagsasalita kay Isaac. Ang “makipagtipan” ay pormal ngunit karaniwang salitang biblikal at likas sa kontekstong ito.
