  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa ng Hebreo: mariing nakita ng mga nagsasalita na kasama ni Yahweh si Isaac, at dahil dito ay humihiling sila ng isang panunumpa at tipan. Gayunman, ang leksikal na posibilidad na ang אָלָה ay isang panunumpang may kaakibat na sumpa ay hindi naisama sa talababa, bagaman kinikilala ito ng sariling tala ng draft. Nilinaw rin ang pag-aankla ng mga talababa.'
  naturalness: Natural at marangal ang rebisyong Tagalog. Ang “si Yahweh ay kasama mo” ay mas tuwiran at mas malinaw kaysa sa baligtad na ayos na “kasama mo si Yahweh.” Ang “makipagtipan kami sa iyo” ay angkop sa panukalang cohortative ng mga nagsasalita sa kausap na si Isaac.
  terminology: Pinanatili ang “Yahweh,” “panunumpa,” at “tipan.” Ang “panunumpa” ang wastong pangunahing salin ng אָלָה sa kontekstong ito; itinatala ng talababa ang posibleng mas matinding kahulugang may kasamang sumpa.
  issues:
  - severity: medium
    issue: Walang talababa para sa posibleng kahulugang “panunumpang may kaakibat na sumpa” ng אָלָה.
    rationale: Kapwa sa pinagmulang audit trail at sa theological decision ng draft ay kinikilalang maaaring tumukoy ang אָלָה sa oath na may ipinapataw na sumpa kapag nilabag. Dapat itong mapanatili sa talababa nang hindi pinipilit sa pangunahing teksto.
  - severity: low
    issue: Ang talababa ng alternatibong ayos ay nakaangkla lamang sa “mo” at ang alternatibo nitong “sa pagitan natin, sa pagitan natin at sa iyo” ay hindi sapat na malinaw sa pagkakaiba ng mga panig.
    rationale: Mas malinaw na iangkla ang tala sa buong pangalawang parirala at gamitin ang “namin ... at sa iyo” para maipakita ang pormal na pag-uulit at ang pagkakaiba ng nagsasalita at kausap.
