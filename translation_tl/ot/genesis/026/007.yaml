revisions:
- from: Nang tanungin siya ng mga lalaki roon tungkol sa kanyang asawa, sinabi niya, “Kapatid ko siya.” Natakot kasi siyang sabihing, “Asawa ko siya,” dahil inisip niya, “Baka patayin ako ng mga lalaki rito dahil kay Rebeca, sapagkat maganda siya.”
  to: Nang tanungin siya ng mga lalaki roon tungkol sa kanyang asawa, sinabi niya, “Kapatid ko siya,” sapagkat natatakot siyang sabihing, “Asawa ko siya,” dahil baka siya patayin ng mga lalaki roon dahil kay Rebeca, sapagkat maganda ang kanyang anyo.
  rationale: Inalis ang idinagdag na “dahil inisip niya” upang huwag lumikha ng kilos na hindi tahasang nasa pinagmulan. Pinanatili ang tuwirang pananalita na “Asawa ko siya” para maipakita ang unang panauhang anyo ng Hebreo, habang ang “baka siya patayin” ay natural na Tagalog na nagsasaad ng kinatatakutang bunga. Nilinaw rin ang pisikal na kahulugan ng “maganda sa anyo.”
