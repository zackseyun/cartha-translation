base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/007.yaml
  text: When the men of the place asked about his wife[a], he said, “She is my sister,” because he was afraid to say, “She is my wife,” lest the men of the place kill me because of Rebekah, because she was beautiful in appearance.
translation:
  language: tl
  text: Nang tanungin siya ng mga lalaki roon tungkol sa kanyang asawa, sinabi niya, “Kapatid ko siya,” sapagkat natatakot siyang sabihing, “Asawa ko siya,” dahil baka siya patayin ng mga lalaki roon dahil kay Rebeca, sapagkat maganda ang kanyang anyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: tanungin
  rationale: Ang Qal wayyiqtol ng שׁאל ay tumutukoy sa payak na pagtatanong; natural sa modernong Tagalog ang “tanungin.”
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: mga lalaki roon / mga lalaki rito
  rationale: Pinananatili ng “mga lalaki” ang tiyak na panlalaking sanggunian ng אַנְשֵׁי; inaangkop ang deictic na “roon/rito” sa salaysay at sa isiniping pag-iisip.
- source_word: לְאִשְׁתּוֹ
  choice: tungkol sa kanyang asawa
  rationale: Ang לְ kasunod ng שׁאל ay nagsasaad ng paksa ng tanong; malinaw at likas ang “tungkol sa.”
- source_word: אֲחֹתִי הִוא
  choice: Kapatid ko siya
  rationale: Natural na predikatibong pagkakakilanlan sa Tagalog; hindi tinutukoy ng salitang Tagalog na “kapatid” ang kasarian, ngunit malinaw sa panghalip at konteksto na babae si Rebeca.
- source_word: כִּי יָרֵא
  choice: Natakot kasi siya
  rationale: Ipinapahayag ng כִּי ang dahilan ng sinabi ni Isaac; ang “kasi” ay natural sa salaysay at nagpapanatili ng ugnayang sanhi.
- source_word: לֵאמֹר
  choice: sabihing
  rationale: Ang infinitive ng אמר pagkatapos ng ירא ay nagpapahayag ng bagay na kinatatakutang sabihin.
- source_word: אִשְׁתִּי
  choice: Asawa ko siya
  rationale: Idinagdag ang ipinahihiwatig na “siya” upang maging buo at natural ang tuwirang pananalita sa Tagalog.
- source_word: פֶּן
  choice: Baka
  rationale: Ang פֶּן ay nagpapakilala ng kinatatakutang maaaring mangyari; mahusay itong naipapahayag ng karaniwang Tagalog na “baka.”
- source_word: יַהַרְגֻנִי
  choice: patayin ako
  rationale: Ang הרג ay karaniwang pandiwang “pumatay”; hindi dinaragdagan ng legal o moral na espesipikasyon gaya ng “paslangin.”
- source_word: עַל רִבְקָה
  choice: dahil kay Rebeca
  rationale: Ang עַל dito ay sanhi o dahilan; idiomatiko at malinaw ang “dahil kay.”
- source_word: טוֹבַת מַרְאֶה
  choice: maganda siya
  rationale: Ang parirala ay literal na nagsasaad ng kaaya-ayang anyo. Sa Tagalog, natural at sapat ang “maganda siya,” na malinaw na tumutukoy sa panlabas na anyo sa konteksto.
- source_word: רִבְקָה
  choice: Rebeca
  rationale: Ginamit ang nakagawiang anyo ng pangalang biblikal sa Filipino, na malapit sa Hebreong רִבְקָה.
theological_decisions:
- issue: Paglalahad ng kinatatakutang bunga bilang iniisip ni Isaac
  choice: dahil inisip niya, “Baka patayin ako…”
  alternative: nang baka patayin siya ng mga lalaki roon
  rationale: Ang unang panauhang suffix sa יַהַרְגֻנִי (“patayin ako”) ay lumilipat mula sa ikatlong-panauhang salaysay tungo sa pananaw ni Isaac. Ang ipinahiwatig na panloob na sipi ay nagpapanatili sa mismong unang panauhan nang malinaw sa Tagalog, nang hindi binabago ang teolohikal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang lipas na “lest” equivalent at pinili ang “baka.” Pinanatili ang pag-uulit ng dahilan sa hulihan, ayon sa Hebreo, ngunit inayos ang pananaw sa loob ng sipi upang maging malinaw ang “ako.”
