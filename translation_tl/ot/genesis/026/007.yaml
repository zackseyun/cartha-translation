  naturalness: Natural ang karamihan ng Tagalog, ngunit mas maayos ang daloy kung hindi ipapasok ang isang bagong panloob na sipi. Ang “maganda ang kanyang anyo” ay mas malinaw na nagsasaad ng pagtukoy sa hitsura kaysa “maganda siya.”
  terminology: Ang “mga lalaki,” “asawa,” “kapatid,” “patayin,” at “Rebeca” ay angkop. Hindi kailangang magdagdag ng talababa para sa talatang ito.
