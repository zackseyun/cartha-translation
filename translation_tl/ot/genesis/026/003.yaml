- from: Manatili ka sa lupaing ito[a]. Sasamahan kita at pagpapalain, sapagkat ibibigay ko sa iyo at sa iyong lahi[b] ang lahat ng mga lupaing ito. Pagtitibayin ko[c] ang sumpang isinumpa ko kay Abraham na iyong ama.
  to: Manatili ka sa lupaing ito[a]. Makakasama mo ako at pagpapalain kita, sapagkat ibibigay ko sa iyo at sa iyong lahi[b] ang lahat ng lupaing ito. Pagtitibayin ko[c] ang panatang isinumpa ko kay Abraham na iyong ama.
  rationale: Inayos ang nawawalang layon ng “pagpapalain,” nilinaw ang pangako ng presensya ng Diyos, at pinalitan ang “sumpa” ng “panata” upang maiwasan ang karaniwang modernong kahulugang “curse.” Pinanatili ang lahat ng pangunahing elemento ng Hebreo, kabilang ang kolektibong saklaw ng “binhi/lahi,” ang pangmaramihang “mga lupain,” at ang maingat na ambigwidad ng וַהֲקִמֹתִי sa talababa.
