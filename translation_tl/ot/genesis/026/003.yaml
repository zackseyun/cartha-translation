source:
  edition: WLC
  text: גּ֚וּר בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/אֶֽהְיֶ֥ה עִמְּ/ךָ֖ וַ/אֲבָרְכֶ֑/ךָּ כִּֽי לְ/ךָ֣ וּֽ/לְ/זַרְעֲ/ךָ֗ אֶתֵּן֙ אֶת כָּל הָֽ/אֲרָצֹ֣ת הָ/אֵ֔ל וַ/הֲקִֽמֹתִי֙ אֶת הַ/שְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְ/אַבְרָהָ֥ם אָבִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/003.yaml
  text: Stay in this land[a], and I will be with you and bless you, for to you and to your offspring I will give all these lands[c][b], and I will establish the oath that I swore to Abraham your father.
translation:
  language: tl
  text: Manatili ka sa lupaing ito[a]. Makakasama mo ako at pagpapalain kita, sapagkat ibibigay ko sa iyo at sa iyong lahi[b] ang lahat ng lupaing ito. Pagtitibayin ko[c] ang panatang isinumpa ko kay Abraham na iyong ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Manirahan ka bilang dayuhan sa lupaing ito.” Ang pandiwang Hebreo ay maaaring tumukoy sa paninirahan bilang dayuhan o pansamantalang naninirahan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “binhi”; kolektibo ang kahulugan nito rito, kaya isinaling “lahi.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “itatatag ko” o “tutuparin ko” ang panata.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּר
  choice: Manatili
  rationale: Sa konteksto, inuutusan si Isaac na huwag umalis patungong Ehipto kundi manatili sa lupaing ito. Likas sa modernong Filipino ang “manatili,” habang inilalahad sa talababa ang diwang paninirahan bilang dayuhan o pansamantalang naninirahan.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: sa lupaing ito
  rationale: Ang אֶרֶץ ay tumutukoy rito sa heograpikong lupain na kaugnay ng pangako; pinananatili ng “lupain” ang angkop na diwang iyon.
- source_word: וְאֶהְיֶה עִמְּךָ
  choice: Sasamahan kita
  rationale: Natural na Filipino ito para sa pormulang nangangakong ang Diyos ay makakasama ni Isaac, nang hindi dinaragdagan ang kahulugan.
- source_word: וַאֲבָרְכֶךָ
  choice: at pagpapalain
  rationale: Ipinagpapatuloy nito ang pangako ng Diyos; nauunawaan mula sa “kita” na si Isaac ang layon ng parehong pandiwa.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan ng utos at ng pangakong nauna rito sa isang marangal ngunit malinaw na paraan.
- source_word: לְךָ וּלְזַרְעֲךָ
  choice: sa iyo at sa iyong lahi
  rationale: Ang זֶרַע ay kolektibong tumutukoy sa mga magmumula kay Isaac. Ang “lahi” ay natural at kolektibo sa Filipino; inilalagay sa talababa ang literal na “binhi.”
- source_word: אֶתֵּן
  choice: ibibigay ko
  rationale: Tuwirang ipinapahayag ang pangako sa hinaharap.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: ang lahat ng mga lupaing ito
  rationale: Pinananatili ang pangmaramihang anyo ng אֲרָצוֹת at ang leksikal na kaugnayan nito sa naunang “lupain.”
- source_word: וַהֲקִמֹתִי
  choice: Pagtitibayin ko
  rationale: Sa Hiphil, maaaring mangahulugan ang קום ng pagtatatag o pagpapatibay sa naunang sinumpaang pangako. Ang “pagtitibayin” ay natural at hindi paunang nagpapasya kung ang diin ay pagkumpirma o pagsasakatuparan.
- source_word: הַשְּׁבֻעָה אֲשֶׁר נִשְׁבַּעְתִּי
  choice: ang sumpang isinumpa ko
  rationale: Pinananatili nito ang tahasang pag-uulit ng salitang-ugat sa Hebreo at ang solemne at legal na bigat ng panunumpa.
- source_word: לְאַבְרָהָם אָבִיךָ
  choice: kay Abraham na iyong ama
  rationale: Malinaw nitong kinikilala si Abraham bilang ama ni Isaac at ipinakikita ang pagpapatuloy ng pangako.
theological_decisions:
- issue: Pagpapahayag ng panunumpang kaugnay ng pangako nang hindi labis na binibigyang-kahulugan
  choice: Pagtitibayin ko ang sumpang isinumpa ko kay Abraham na iyong ama
  alternative: Itatatag ko / tutuparin ko ang sumpang isinumpa ko kay Abraham na iyong ama
  rationale: Ang Hebreo ay gumagamit ng pandiwang maaaring mangahulugang itatag o pagtibayin ang naunang panunumpa. Hindi tahasang ginagamit ng talata ang teknikal na wika ng pagpapanibago ng tipan, kaya hindi iyon idinagdag.
- issue: Kolektibong diwa ng זֶרַע
  choice: lahi
  alternative: binhi / mga salinlahi
  rationale: Sa agarang konteksto, tumutukoy ito nang kolektibo sa mga magmumula kay Isaac. Pinananatili sa talababa ang literal na larawan ng “binhi” upang hindi lubusang mawala ang tunay na lawak ng terminong Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang tuwirang pakikipag-usap ng Diyos kay Isaac at maiikling pangungusap upang maging malinaw, habang pinananatili sa mga talababa ang mahahalagang leksikal na alternatibo at ang saklaw ng mga salitang Hebreo.
