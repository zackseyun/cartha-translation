base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
translation:
  language: tl
  text: Kaya ipinatawag ni Abimelec si Isaac at sinabi, “Tiyak ngang asawa mo siya! Bakit mo sinabi, ‘Kapatid ko siya’?” Sumagot si Isaac, “Sapagkat sinabi ko, ‘Baka mamatay ako dahil sa kanya.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas tahasan, “Baka patayin nila ako dahil sa kanya.”
    reason: Ipinahihiwatig ng konteksto na natakot si Isaac na patayin siya ng mga lalaki upang makuha ang kanyang asawa, ngunit hindi tahasang binabanggit sa Hebreo ang gagawa ng pagpatay.
lexical_decisions:
- source_word: וַיִּקְרָא ... לְיִצְחָק
  choice: ipinatawag ... si Isaac
  rationale: Ang קרא na may לְ at tumutukoy sa isang tao ay maaaring mangahulugang tawagin o ipatawag. Likas sa konteksto ng hari ang “ipinatawag,” at malinaw ito sa makabagong Tagalog.
- source_word: אַךְ הִנֵּה
  choice: Tiyak ngang
  rationale: Pinagsasama nito sa natural na Tagalog ang mariing pagpapatunay ng אַךְ at ang pantawag-pansing diin ng הִנֵּה, nang hindi ginagawang patanong ang pahayag.
- source_word: אִשְׁתְּךָ הִוא
  choice: asawa mo siya
  rationale: Direkta nitong pinananatili ang pahayag na ang babae ay asawa ni Isaac; ang diin ay naipahahayag na ng “Tiyak ngang.”
- source_word: וְאֵיךְ אָמַרְתָּ
  choice: Bakit mo sinabi
  rationale: Bagaman literal na “at paano mo sinabi,” ang tanong ay isang pagsaway na likas ipahayag sa Tagalog bilang “Bakit mo sinabi.”
- source_word: אֲחֹתִי הִוא
  choice: Kapatid ko siya
  rationale: Ang אחות ay karaniwang nangangahulugang babaeng kapatid. Sa Tagalog, hindi kailangang tukuyin ang kasarian sapagkat malinaw sa panghalip na “siya” at sa konteksto.
- source_word: כִּי אָמַרְתִּי
  choice: Sapagkat naisip ko
  rationale: Maaaring gamitin ang אמר sa panloob na pagsasalita o pag-iisip. Ang “naisip ko” ay natural sa Tagalog at malinaw na nagpapakilala sa dahilan ni Isaac.
- source_word: פֶּן אָמוּת
  choice: Baka mamatay ako
  rationale: Ipinahahayag ng פן ang kinatatakutang posibleng mangyari. Ang “baka” ay natural at tumpak sa kasalukuyang Tagalog.
- source_word: עָלֶיהָ
  choice: dahil sa kanya
  rationale: Sa idyomang ito, ang עַל ay nagpapahayag ng sanhi o dahilan. Pinananatili ng salin ang pagiging di-tahas ng Hebreo kung natural na pagkamatay o pagpatay ang nasa isip, habang nililinaw ng talababa ang ipinahihiwatig ng konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “Tiyak ngang” upang mapanatili ang mariing deklarasyon ng Hebreo, at “baka” sa halip na isang makalumang katumbas ng ‘lest.’
