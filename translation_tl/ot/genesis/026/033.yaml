  yaml_path: translation/ot/genesis/026/033.yaml
  text: And he called it Shibah[a]; therefore the name of the city is Beersheba to this day.
translation:
  language: tl
  text: Tinawag niya itong Shiba[a]; kaya Beer-seba ang pangalan ng lungsod hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Shiba ay katunog ng salitang Hebreo para sa “pito” at kaugnay ng larong-salita sa pangalang Beer-seba, na maaaring unawaing “Balon ng Pito” o “Balon ng Panunumpa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֹתָהּ
  choice: Tinawag niya itong
  rationale: Sa konteksto ng pagbibigay ng pangalan, ang קרא ay nangangahulugang “tawagin” o “pangalanan.” Ang “itong” ay likas sa Tagalog at tumutukoy sa balon na binanggit sa naunang talata.
- source_word: שִׁבְעָה
  choice: Shiba
  rationale: Pinanatili bilang transliteradong pangalan upang hindi mawala ang larong-salita sa Hebreo na kaugnay ng “pito” at “panunumpa.”
- source_word: עַל כֵּן
  choice: kaya
  rationale: Natural at malinaw na panandang nagpapakilala sa bunga o paliwanag ng pagbibigay ng pangalan.
- source_word: שֵׁם הָעִיר
  choice: ang pangalan ng lungsod
  rationale: Tuwirang salin ng pariralang Hebreo sa natural at marangal na modernong Tagalog.
- source_word: בְּאֵר שֶׁבַע
  choice: Beer-seba
  rationale: Pinanatili bilang pantanging pangalan. Ang gitling ay tumutulong na makita ang dalawang sangkap ng pangalang Hebreo nang hindi isinasalin at pinapasimple ang tunay na dobleng pahiwatig nito.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Karaniwang katumbas sa Tagalog ng pormulang temporal sa salaysay na Hebreo.
