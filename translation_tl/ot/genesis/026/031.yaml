  yaml_path: translation/ot/genesis/026/031.yaml
  text: And they rose early in the morning and swore an oath, each man to his brother; then Isaac sent them away[a], and they departed from him in peace.
translation:
  language: tl
  text: Maaga silang bumangon kinabukasan at nanumpa sa isa’t isa. Pagkatapos, pinaalis sila ni Isaac, at umalis sila sa kanya nang payapa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Maaga silang bumangon kinabukasan
  rationale: Ang Hiphil ng שׁכם ay tumutukoy sa maagang pagbangon. Sa daloy ng salaysay, natural sa Tagalog ang “kinabukasan” para sa umagang kasunod ng naunang mga pangyayari.
- source_word: וַיִּשָּׁבְעוּ
  choice: nanumpa
  rationale: Ang Niphal ng שׁבע ay nangangahulugang manumpa o gumawa ng sumpa; sapat nang pormal at malinaw ang “nanumpa” sa konteksto ng kasunduan.
- source_word: אִישׁ לְאָחִיו
  choice: sa isa't isa
  rationale: Literal itong “bawat lalaki sa kanyang kapatid,” ngunit idiomatikong ipinahihiwatig dito ang kapwa o mutuwal na panunumpa. Ang “sa isa't isa” ang natural at tumpak na katumbas sa modernong Tagalog.
- source_word: וַיְשַׁלְּחֵם
  choice: pinahayo sila
  rationale: Ang Piel ng שׁלח na may hulaping layon ay nangangahulugang pinaalis o pinayaong may pahintulot. Ang “pinahayo” ay marangal at hindi nagpapahiwatig ng marahas na pagtataboy.
- source_word: וַיֵּלְכוּ מֵאִתּוֹ
  choice: umalis sila sa kanya
  rationale: Tuwirang ipinahahayag nito ang paglayo nila kay Isaac at natural sa kasalukuyang Tagalog.
- source_word: בְּשָׁלוֹם
  choice: nang payapa
  rationale: Saklaw ng שָׁלוֹם dito ang mapayapang ugnayan at ligtas na pag-alis. Ang “nang payapa” ay natural sa Tagalog at hindi nililimitahan ang diwa sa pisikal na kaligtasan lamang.
