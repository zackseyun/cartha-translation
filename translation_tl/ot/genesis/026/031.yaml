  source_fidelity: 'Ang pangkalahatang pagkakasunod at kahulugan ay tapat sa Hebreo: maagang pagbangon, kapwaang panunumpa, pagpapayaon ni Isaac, at mapayapang pag-alis. Ang “sa isa’t isa” ay wastong idiomatikong pagsasalin ng אִישׁ לְאָחִיו sa kontekstong ito. Gayunman, ang “pinahayo” ay hindi ang angkop na anyo o karaniwang modernong salita para sa וַיְשַׁלְּחֵם (“ipinadala/pinaalis sila”).'
