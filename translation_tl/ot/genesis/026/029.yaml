base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/029.yaml
  text: that you will do us no harm[a], just as we have not touched you and just as we have done to you only good and sent you away in peace[c][b]. You are now blessed by Yahweh.”
translation:
  language: tl
  text: na hindi mo kami gagawan ng masama[a], kung paanong hindi ka namin ginalaw[b] at kung paanong mabuti lamang ang ginawa namin sa iyo at pinaalis ka namin nang payapa[c]. Ngayon, pinagpala ka ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung gagawan mo kami ng masama.” Maaaring literal na mangahulugang “kung” ang salitang Hebreo, ngunit dito ay malamang na ipinakikilala nito ang nilalaman ng sumpang hinihingi nila kay Isaac.
    reason: lexical_alternative
  - marker: b
    text: Ang “ginalaw” ay maaari ring mangahulugang “sinaktan” sa kontekstong ito.
    reason: lexical_alternative
  - marker: c
    text: O “at pinayaon ka namin nang payapa.”
    reason: previous_rendering
lexical_decisions:
- source_word: אִם
  choice: na hindi
  rationale: Sa konteksto ng hinihinging sumpa sa naunang talata, ipinakikilala ng אִם ang nilalaman ng panunumpa. Likas sa Tagalog ang “na hindi,” habang itinatala sa talababa ang literal na kondisyunal na pagbasa.
- source_word: תַּעֲשֵׂה עִמָּנוּ רָעָה
  choice: hindi mo kami gagawan ng masama
  rationale: Tuwirang ipinahahayag ang pagbabawal sa anumang masamang gawa o pinsala sa konteksto ng kasunduang hindi magsasalakayan.
- source_word: נְגַעֲנוּךָ
  choice: hindi ka namin ginalaw
  rationale: Pinananatili ang konkretong diwa ng נגע na “humipo/gumalaw,” ngunit ang “ginalaw” sa Tagalog ay maaari ring magpahiwatig ng pananakit o panghihimasok.
- source_word: עָשִׂינוּ עִמְּךָ רַק טוֹב
  choice: pawang mabuti lamang ang ginawa namin sa iyo
  rationale: Pinananatili ng “pawang…lamang” ang mariing eksklusibong diwa ng רַק טוֹב.
- source_word: וַנְּשַׁלֵּחֲךָ בְּשָׁלוֹם
  choice: pinayaon ka namin nang payapa
  rationale: Ang “pinayaon” ay dignified ngunit malinaw na pagsasalin ng pagpapalakad o pagpapaalis, at ang “nang payapa” ay sumasaklaw sa ligtas at mapayapang pag-alis.
- source_word: בְּרוּךְ יְהוָה
  choice: pinagpala ka ni Yahweh
  rationale: Natural na Tagalog para sa pasibong participle בָּרוּךְ, habang tahasang pinananatili ang pangalang tipan na יְהוָה bilang Yahweh.
theological_decisions:
- issue: Paglalapat ng אִם sa pormula ng sumpa
  choice: na hindi mo kami gagawan ng masama
  alternative: kung gagawan mo kami ng masama
  rationale: Malamang na ipinagpapatuloy nito ang nilalaman ng hinihinging sumpa sa talata 28; gayunman, hindi inaalis ang literal na kondisyunal na posibilidad at inilalagay iyon sa talababa.
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang banal sa halip na palitan ito ng titulo.
- issue: Pahayag ng mga tauhan na pawang mabuti ang ginawa nila kay Isaac
  choice: pinanatili bilang kanilang tuwirang pahayag
  alternative: palambutin o ipaliwanag bilang bahagyang totoo lamang
  rationale: Hindi hinahatulan o itinutuwid ng salin ang mapagtanggol-sa-sariling pahayag ng mga nagsasalita; pinananatili ang tensiyon nito sa naunang salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na may dignified na himig. Ginamit ang “pinayaon” upang mapanatili ang pormal na tono nang hindi nagiging lipas, at “ginalaw” upang mapanatili ang konkretong larawan at posibleng diwa ng pananakit. Ang lahat ng marker [a]–[c] ay nasa pangunahing teksto.
