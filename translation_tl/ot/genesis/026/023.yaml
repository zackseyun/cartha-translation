lexical_decisions:
- source_word: וַיַּעַל
  choice: umakyat siya
  rationale: Karaniwang nangangahulugan ang עלה na ‘umakyat’ o ‘pumaitaas.’ Sa salaysay ng paglalakbay, maaari rin itong tumukoy sa pagpunta sa isang lugar na mas mataas o sa pagpapatuloy ng paglalakbay. Pinananatili ng ‘umakyat siya’ ang larawang direksiyon ng Hebreo.
- source_word: מִשָּׁם
  choice: mula roon
  rationale: Likas at malinaw na modernong Tagalog ito para sa pag-alis mula sa naunang lugar.
- source_word: בְּאֵר שָׁבַע
  choice: Beer-seba
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng transliterasyon, ayon sa nakasanayang anyo sa mga Bibliyang Tagalog.
