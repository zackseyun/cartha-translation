  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang ‘mula roon’ para sa natural na daloy, at pinanatili ang ‘umakyat’ upang hindi mawala ang direksiyonal na pahiwatig ng orihinal.
