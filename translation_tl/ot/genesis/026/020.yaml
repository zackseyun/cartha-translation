  text: וַ/יָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם רֹעֵ֥י יִצְחָ֛ק לֵ/אמֹ֖ר לָ֣/נוּ הַ/מָּ֑יִם וַ/יִּקְרָ֤א שֵֽׁם הַ/בְּאֵר֙ עֵ֔שֶׂק כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/020.yaml
  text: Then the shepherds of Gerar quarreled with Isaac’s shepherds[a], saying, “The water is ours.” So he named the well Esek, because they had quarreled with him.
translation:
  language: tl
  text: Nakipagtalo ang mga pastol ng Gerar sa mga pastol ni Isaac. Sinabi nila, “Amin ang tubig.” Kaya pinangalanan niya ang balon na Esek[a], sapagkat nakipagtalo sila sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Esek ay kaugnay ng salitang Hebreo na nangangahulugang “alitan” o “pagtatalo.”
    reason: Pinananatili at ipinapaliwanag ang paglalaro ng salita sa pagitan ng pangalan ng balon at ng pandiwang ginamit sa huling bahagi ng talata.
lexical_decisions:
- source_word: וַיָּרִיבוּ
  choice: Nakipagtalo
  rationale: Ang ריב ay tumutukoy sa pakikipagtalo o alitan. Likas at malinaw sa makabagong Tagalog ang “nakipagtalo” para sa hidwaan tungkol sa tubig.
- source_word: רֹעֵי גְרָר ... רֹעֵי יִצְחָק
  choice: mga pastol ng Gerar ... mga pastol ni Isaac
  rationale: Maaaring tumukoy ang רֹעִים sa mga tagapag-alaga ng kawan o hayop. Maikli, karaniwan, at angkop sa kontekstong patriyarkal ang “mga pastol,” habang pinananatili ang paralelismo ng Hebreo.
- source_word: לָנוּ הַמָּיִם
  choice: Amin ang tubig
  rationale: Elliptical ang Hebreo, na literal na “sa amin ang tubig.” Tuwirang ipinahahayag ng “Amin ang tubig” ang pag-angkin nang hindi nagdaragdag ng paliwanag.
- source_word: וַיִּקְרָא שֵׁם הַבְּאֵר
  choice: pinangalanan niya ang balon
  rationale: Natural na Tagalog ito para sa idyomang Hebreo na “tinawag ang pangalan ng balon.” Pinananatili ng “niya” ang di-tahasang tinukoy na simuno sa Hebreo, na si Isaac ayon sa konteksto.
- source_word: עֵשֶׂק
  choice: Esek
  rationale: Isinalin sa baybay na “Esek” bilang pangalan ng balon. Ipinaliliwanag sa talababa ang ugnayan nito sa salitang Hebreo para sa alitan o pagtatalo.
- source_word: כִּי הִתְעַשְּׂקוּ עִמּוֹ
  choice: sapagkat nakipagtalo sila sa kanya
  rationale: Ipinahihiwatig ng pandiwang kaugnay ng עֵשֶׂק ang pakikipagtalo o pakikipag-alitan. Ang “sa kanya” ay nagpapanatili sa panlalaking pang-isahang panghalip ng Hebreo at natural na tumutukoy kay Isaac.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pastol,” “nakipagtalo,” at “Amin ang tubig” bilang mga karaniwang salitang madaling maunawaan. Inilagay ang pananda ng talababa pagkatapos ng “Esek,” ang mismong salitang ipinapaliwanag nito.
