  source_fidelity: 'Tumpak ang pagsasalin sa Hebreong teksto: naipapahayag ang pagkaroon ng taggutom, ang paghahambing sa naunang taggutom noong panahon ni Abraham, at ang pagpunta ni Isaac kay Abimelec, hari ng mga Filisteo, sa Gerar. Ang “Kaya” ay katanggap-tanggap na pagsulong ng salaysay sa kontekstong ito at hindi nagdaragdag ng doktrinal o historikal na pahayag.'
