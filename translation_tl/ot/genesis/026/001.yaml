id: GEN.26.1
reference: Genesis 26:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֤י רָעָב֙ בָּ/אָ֔רֶץ מִ/לְּ/בַד֙ הָ/רָעָ֣ב הָ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיָ֖ה בִּ/ימֵ֣י אַבְרָהָ֑ם וַ/יֵּ֧לֶךְ יִצְחָ֛ק אֶל אֲבִימֶּ֥לֶךְ מֶֽלֶךְ פְּלִשְׁתִּ֖ים גְּרָֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/001.yaml
  text: There was a famine in the land[a], besides the first famine that had been in the days of Abraham. So Isaac went to Abimelech king of the Philistines at Gerar.
translation:
  language: tl
  text: Nagkaroon ng taggutom sa lupain, bukod pa sa unang taggutom na nangyari noong panahon ni Abraham. Kaya pumunta si Isaac kay Abimelec, hari ng mga Filisteo, sa Gerar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patungong Gerar.” Ang anyong Hebreo ng Gerar ay may hulaping direksiyonal na maaaring tahasang magpahiwatig ng pagkilos papunta roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nagkaroon
  rationale: Likas na panimulang pagsasalaysay sa Tagalog para sa paglitaw ng isang kalagayan, nang hindi nagdaragdag ng tahasang salitang temporal na wala sa Hebreo.
- source_word: רָעָב
  choice: taggutom
  rationale: Karaniwang salitang Tagalog para sa malawakang kakulangan ng pagkain.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Tumutukoy sa lokal na lupain o rehiyon, hindi sa buong daigdig.
- source_word: מִלְּבַד
  choice: bukod pa sa
  rationale: Malinaw na ipinahihiwatig na ang taggutom na ito ay iba at karagdagan sa naunang taggutom.
- source_word: הָרָעָב הָרִאשׁוֹן
  choice: unang taggutom
  rationale: Pinananatili ang ordinal na kahulugan ng רִאשׁוֹן.
- source_word: אֲשֶׁר הָיָה בִּימֵי אַבְרָהָם
  choice: na nangyari noong panahon ni Abraham
  rationale: Natural na Tagalog na tumutukoy sa naunang pangyayari sa loob ng buhay o panahon ni Abraham.
- source_word: וַיֵּלֶךְ
  choice: Kaya pumunta si Isaac
  rationale: Isinusulong ang salaysay at ipinapakita ang likas na kaugnayan ng pagpunta ni Isaac sa kalagayan ng taggutom, nang hindi labis na pinatitibay ang sanhi.
- source_word: אֲבִימֶּלֶךְ
  choice: Abimelec
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: מֶלֶךְ פְּלִשְׁתִּים
  choice: hari ng mga Filisteo
  rationale: Tuwirang inilalahad ang ugnayang construct at ginagamit ang kinagawiang tawag sa pangkat-etniko.
- source_word: גְּרָרָה
  choice: sa Gerar
  rationale: Natural na tinutukoy ang Gerar bilang kinaroroonan o patutunguhan sa pangungusap; ipinaliliwanag sa talababa ang tahasang direksiyonal na anyo ng Hebreo.
theological_decisions:
- issue: Makasaysayan at etnikong katawagang פְּלִשְׁתִּים
  choice: mga Filisteo
  alternative: bayan ng mga Filisteo
  rationale: Isa itong tuwirang katawagang etniko at pampolitika, hindi isang teolohikal na titulo.
- issue: Ugnayan ng taggutom at pagpunta ni Isaac
  choice: Kaya pumunta
  alternative: At pumunta
  rationale: Ipinahihiwatig ng daloy ng salaysay ang kaugnayan ng kilos sa taggutom, ngunit hindi nito sinasabing ito lamang ang tahasang sanhi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; iniwasan ang lumang pananalita at pinanatili ang maikling anyo ng salaysay.
