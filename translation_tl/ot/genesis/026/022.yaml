base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/022.yaml
  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
translation:
  language: tl
  text: Lumipat siya mula roon at humukay ng isa pang balon. Hindi nila iyon pinagtalunan. Kaya pinangalanan niya itong Rehobot[a] at sinabi, “Ngayon ay binigyan tayo ni Yahweh ng maluwang na lugar, at magiging mabunga tayo sa lupain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang Rehobot ay kaugnay ng salitang Hebreo para sa “maluluwang na lugar.” Pinaglalaruan ng paliwanag ni Isaac ang kahulugang ito: “binigyan tayo ni Yahweh ng maluwang na lugar.”'
    reason: Ipinaliliwanag ang paglalaro ng salita sa pagitan ng pangalang רְחֹבוֹת at ng pandiwang הִרְחִיב.
lexical_decisions:
- source_word: וַיַּעְתֵּק מִשָּׁם
  choice: Lumipat siya mula roon
  rationale: Ang pandiwang עתק sa konteksto ay tumutukoy sa paglipat ni Isaac sa ibang lugar. Likas at malinaw sa makabagong Tagalog ang “lumipat siya mula roon.”
- source_word: בְּאֵר אַחֶרֶת
  choice: isa pang balon
  rationale: Direkta at natural na katumbas ito ng pariralang tumutukoy sa karagdagang balon.
- source_word: וְלֹא רָבוּ עָלֶיהָ
  choice: Hindi nila iyon pinagtalunan
  rationale: Ang ריב ay tumutukoy sa pakikipagtalo o pag-aagawan. Ipinahahayag ng salin na ang balon ang paksa ng alitan nang hindi dinaragdagan ang detalye.
- source_word: וַיִּקְרָא שְׁמָהּ רְחֹבוֹת
  choice: pinangalanan niya itong Rehobot
  rationale: Natural sa Tagalog ang pormulang ito sa pagbibigay ng pangalan. Isinatinig ang pangalang pantangi sa halip na isalin, habang ipinaliliwanag ang kahulugan nito sa talababa.
- source_word: רְחֹבוֹת
  choice: Rehobot
  rationale: Pinanatili bilang pangalang pantangi. Ang literal na diwa nitong “maluluwang na lugar” ay mahalaga sa paglalaro ng salita sa kasunod na pahayag.
- source_word: כִּי עַתָּה הִרְחִיב יְהוָה לָנוּ
  choice: Ngayon ay binigyan tayo ni Yahweh ng maluwang na lugar
  rationale: Ipinahahayag ng hiphil ng רחב ang pagbibigay o paglalaan ng sapat at maluwang na puwang. Pinananatili ng “maluwang na lugar” ang ugnayang leksikal sa pangalang Rehobot.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinatinig ang personal na banal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וּפָרִינוּ בָאָרֶץ
  choice: at magiging mabunga tayo sa lupain
  rationale: Pinananatili ng “magiging mabunga” ang pangunahing diwa ng פרה at ang posibleng alingawngaw ng pagpapala at pagdami. Ang “sa lupain” ay nagpapanatili sa kongkretong panlupaing diwa ng אָרֶץ.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Ang “Yahweh” ay tuwirang pagsasatinig at hindi pinapalitan ang pangalan ng titulong “PANGINOON.”
- issue: Saklaw ng וּפָרִינוּ
  choice: magiging mabunga tayo
  alternative: dadami tayo; uunlad tayo
  rationale: Maaaring saklawin ng פרה ang pagdami at paglago. Ang “magiging mabunga” ay nagpapanatili sa sadyang malawak na talinghaga at sa posibleng kaugnayan nito sa mga pangako ng pagpapala, sa halip na limitahan ito sa kasaganaan o dami lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lumipat,” “pinagtalunan,” at “pinangalanan” bilang karaniwang pananalita, habang pinanatili ang bahagyang matalinghagang “magiging mabunga” upang huwag paliitin ang kahulugan ng Hebreo.
