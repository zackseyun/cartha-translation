  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: nagtayo si Isaac ng altar, tumawag siya sa pangalan ni Yahweh, itinayo niya ang kaniyang tolda, at naghukay ang kaniyang mga lingkod ng balon. Gayunman, ang “Kaya” ay nagpapahiwatig ng ugnayang sanhi-bunga na wala sa simpleng sunod-sunod na salaysay ng Hebreo, at ang “rin” ay nagdaragdag ng diin na hindi ipinahahayag ng teksto.'
