- from: Kaya nagtayo siya roon ng isang altar at tumawag sa pangalan ni Yahweh[a]. Itinayo rin niya roon ang kaniyang tolda, at naghukay roon ng isang balon ang mga lingkod ni Isaac.
  to: At nagtayo siya roon ng isang altar at tumawag sa pangalan ni Yahweh[a]. Itinayo niya roon ang kaniyang tolda, at naghukay roon ng isang balon ang mga lingkod ni Isaac.
  rationale: Pinalitan ang pang-ugnay na may pahiwatig na sanhi-bunga ng neutral na “At” at inalis ang hindi sinusuportahang “rin.” Pinanatili ang lahat ng pangunahing termino, ang tatlong pagbanggit ng “roon,” at ang talababa para sa pinagtatalunang saklaw ng “tumawag sa pangalan ni Yahweh.”
