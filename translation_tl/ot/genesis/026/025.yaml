  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּ֧בֶן שָׁ֣ם מִזְבֵּ֗חַ וַ/יִּקְרָא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וַ/יֶּט שָׁ֖ם אָהֳל֑/וֹ וַ/יִּכְרוּ שָׁ֥ם עַבְדֵי יִצְחָ֖ק בְּאֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/025.yaml
  text: So he built an altar there and called on the name of Yahweh[a], and he pitched his tent there[b]. And Isaac’s servants dug a well there.
translation:
  language: tl
  text: At nagtayo siya roon ng isang altar at tumawag sa pangalan ni Yahweh[a]. Itinayo niya roon ang kaniyang tolda, at naghukay roon ng isang balon ang mga lingkod ni Isaac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinahayag ang pangalan ni Yahweh.” Ang idyomang Hebreo ay maaaring tumukoy sa pagtawag sa Diyos o sa pagpapahayag ng kaniyang pangalan; sa konteksto ng altar, mas malamang ang pagtawag sa kaniya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  choice: nagtayo
  rationale: Karaniwang salin ng בנה sa konteksto ng pagtatayo ng altar; natural at marangal sa makabagong Filipino.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Karaniwang terminong Filipino para sa estrukturang ginagamit sa paghahandog at pagsamba.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: tumawag sa pangalan ni Yahweh
  rationale: Pinananatili ang idyomang Hebreo at ang pangunahing diwa ng mapanalanging pagtawag sa konteksto ng altar, nang hindi isinasara ang posibilidad ng pagpapahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וַיֶּט שָׁם אָהֳלוֹ
  choice: Itinayo rin niya roon ang kaniyang tolda
  rationale: Sa tolda, ang נטה ay nangangahulugang ilatag o itayo; 'itinayo ang tolda' ang pinakanatural na kasalukuyang Filipino.
- source_word: וַיִּכְרוּ
  choice: naghukay
  rationale: Payak at tumpak na pandiwa para sa paghuhukay ng balon.
- source_word: עַבְדֵי יִצְחָק
  choice: mga lingkod ni Isaac
  rationale: Sa kontekstong ito, tumutukoy sa mga tauhan ng sambahayan na gumagawa ng gawain; hindi tiyak na binibigyang-diin ng talata ang legal na kalagayang pagkaalipin.
- source_word: בְּאֵר
  choice: isang balon
  rationale: Karaniwang kahulugan ng באר sa mga salaysay tungkol sa mga patriyarka.
- source_word: שָׁם
  choice: roon
  rationale: Iningatan ang tatlong paglitaw upang mapanatili ang diin ng Hebreo sa lugar.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang 'Yahweh' ang malapit na transliterasyon at hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: tumawag sa pangalan ni Yahweh
  alternative: ipinahayag ang pangalan ni Yahweh
  rationale: Maaaring tumukoy ang idyoma sa pagtawag o pagpapahayag. Dahil sa konteksto ng altar, mas malamang ang mapanalanging pagtawag, ngunit itinatala sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tolda” bilang karaniwang salitang nauunawaan ng ordinaryong mambabasa. Pinanatili ang pag-uulit ng “roon” upang katawanin ang diin ng Hebreo sa lugar, habang hinati ang unang serye ng kilos upang maging natural ang daloy sa Filipino.
