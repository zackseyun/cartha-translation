base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/015.yaml
  text: All the wells that his father's servants had dug in the days of Abraham his father[c][b][a], the Philistines stopped up and filled them with earth.
translation:
  language: tl
  text: At ang lahat ng balon na hinukay ng mga lingkod[a] ng kanyang ama noong panahon ng kanyang amang si Abraham ay binarahan ng mga Filisteo at pinuno nila ng lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga alipin.” Ang salitang Hebreo ay maaaring tumukoy sa lingkod o alipin.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring isaling “alikabok” o “maluwag na lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: At ang lahat
  rationale: Pinananatili ng “At” ang pang-ugnay na וְ sa naunang salaysay, at ipinahahayag ng “lahat” ang kabuuang diwa ng כָל.
- source_word: הַבְּאֵרֹת
  choice: ang lahat ng balon
  rationale: Ang בְּאֵרֹת ay tuwirang tumutukoy sa mga balon; hindi kailangang idagdag ang “tubig” sa Filipino.
- source_word: אֲשֶׁר חָפְרוּ
  choice: na hinukay
  rationale: Likas na Filipino ito para sa paggawa ng mga balon at malinaw na inilalarawan ang naunang kilos.
- source_word: עַבְדֵי אָבִיו
  choice: mga lingkod ng kanyang ama
  rationale: Maaaring mangahulugan ang עֶבֶד ng lingkod o alipin. Hindi itinatampok ng konteksto ang kalagayang pagkaalipin, kaya “mga lingkod” ang mas likas na pangunahing salin habang inilalagay sa talababa ang alternatibo.
- source_word: בִּימֵי אַבְרָהָם אָבִיו
  choice: noong panahon ng kanyang amang si Abraham
  rationale: Natural na ipinahahayag sa modernong Filipino ang Hebreong idyomang “sa mga araw ni,” habang pinananatili ang pagkakakilanlan kay Abraham bilang kanyang ama.
- source_word: סִתְּמוּם
  choice: binarahan
  rationale: Ang pandiwa ay nangangahulugang barahan o takpan upang hindi magamit, lalo na ang isang balon.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Ito ang karaniwang anyong Filipino para sa pangkat na tinutukoy.
- source_word: וַיְמַלְאוּם עָפָר
  choice: at pinuno nila ng lupa
  rationale: Pinananatili ang tahasang layon na mga balon at ang hiwalay na kilos ng pagpuno. Ang “lupa” ay angkop sa konteksto para sa עָפָר, na maaari ring mangahulugang alikabok o maluwag na lupa.
