- from: At ang lalaking iyon ay naging dakila[a]; patuloy siyang lumaki sa kadakilaan hanggang sa siya ay naging napakadakila.
  to: At ang lalaking iyon ay naging dakila[a], at patuloy siyang lumaki nang lumaki hanggang sa siya ay naging napakadakila.
