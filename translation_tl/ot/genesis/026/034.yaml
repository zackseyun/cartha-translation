base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/034.yaml
  text: When Esau was forty years old[a], he took as wives Judith daughter of Beeri the Hittite, and Basemath daughter of Elon the Hittite.
translation:
  language: tl
  text: Nang apatnapung taong gulang na si Esau, pinakasalan niya[a] si Judit na anak ni Beeri na Heteo, at si Basemat na anak ni Elon na Heteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal, “kumuha siya ng isang asawa: si Judit ... at si Basemat ....” Singular ang “asawa/babae” sa Hebreo bago banggitin ang dalawang babae.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... בֶּן אַרְבָּעִים שָׁנָה
  choice: Nang apatnapung taong gulang na si Esau
  rationale: Likas na salin sa modernong Tagalog ng Hebreong panandang pansalaysay at karaniwang pahayag ng edad.
- source_word: וַיִּקַּח אִשָּׁה
  choice: pinakasalan niya
  rationale: Ipinahahayag ng parirala ang pagkuha sa mga babaeng binanggit bilang asawa. Natural sa Tagalog ang “pinakasalan,” habang itinatala sa talababa ang singular na anyo ng Hebreo.
- source_word: יְהוּדִית
  choice: Judit
  rationale: Karaniwang anyong Tagalog ng pangalang biblikal.
- source_word: בַּת
  choice: anak ni
  rationale: Natural na Tagalog para sa construct na tumutukoy sa anak na babae; malinaw na babae na ang tinutukoy dahil sa mga pangalan at konteksto ng pag-aasawa.
- source_word: הַחִתִּי
  choice: na Heteo
  rationale: Karaniwang katawagang Tagalog sa etnikong pagkakakilanlan ng Hittite, na inilalapat kina Beeri at Elon.
- source_word: בָּשְׂמַת
  choice: Basemat
  rationale: Malapit na transliterasyon sa Hebreong pangalan at angkop sa baybay-Tagalog.
- source_word: אֵילֹן
  choice: Elon
  rationale: Tuwirang transliterasyon ng pangalang Hebreo.
