  text: וְ/הִרְבֵּיתִ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/נָתַתִּ֣י לְ/זַרְעֲ/ךָ֔ אֵ֥ת כָּל הָ/אֲרָצֹ֖ת הָ/אֵ֑ל וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/004.yaml
  text: And I will multiply your offspring like the stars of the heavens[a], and I will give to your offspring all these lands, and in your offspring all the nations of the earth will be blessed.
translation:
  language: tl
  text: Pararamihin ko ang iyong lahi gaya ng mga bituin sa langit, at ibibigay ko sa iyong lahi ang lahat ng lupaing ito. Sa iyong lahi, pagpapalain ang lahat ng bansa sa daigdig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pagpapalain ng lahat ng bansa sa daigdig ang kanilang sarili sa pamamagitan ng iyong lahi.” Maaaring unawain nang reflexive ang pandiwang Hebreo, bagaman ang pasibong diwa ay angkop sa konteksto ng pangakong tipan.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: Pararamihin ko
  rationale: Ang Hiphil ng רבה ay nagsasaad na ang Diyos ang magpaparami; tuwiran at likas sa Filipino ang “pararamihin ko.”
- source_word: זַרְעֲךָ
  choice: ang iyong lahi
  rationale: Ang זֶרַע ay kolektibong pangngalan para sa mga nagmula sa isang tao. Ang “lahi” ay natural at dignidadong Filipino at hindi tahasang ginagawang maramihan ang kolektibong diwa.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: gaya ng mga bituin sa langit
  rationale: Pinananatili nito ang hayag na paghahambing at gumagamit ng karaniwang Filipino para sa Hebreong הַשָּׁמַיִם.
- source_word: וְנָתַתִּי
  choice: at ibibigay ko
  rationale: Tuwirang katumbas ito ng karaniwang pandiwang נתן at malinaw na nagpapanatili sa pangakong mula sa Diyos.
- source_word: לְזַרְעֲךָ
  choice: sa iyong lahi
  rationale: Pinananatili ang pare-parehong salin ng זֶרַע sa buong talata.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: ang lahat ng lupaing ito
  rationale: Ang “mga lupain” ay angkop sa pangakong panteritoryo, at ang “ito” ay kumakatawan sa deiktikong הָאֵל.
- source_word: וְהִתְבָּרֲכוּ
  choice: pagpapalain
  rationale: Ang pasibong diwa ay mahusay na umaangkop sa konteksto ng pangakong tipan, ngunit hindi inaalis ang posibleng reflexive na pagbasa, na inilagay sa talababa.
- source_word: בְזַרְעֲךָ
  choice: sa iyong lahi
  rationale: Pinananatili ng “sa” ang payak at malawak na diwa ng בְּ nang hindi agad nililimitahan ito sa instrumental na “sa pamamagitan ng.”
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: ang lahat ng bansa sa daigdig
  rationale: Karaniwang katumbas ng גּוֹיִם ang “mga bansa,” at malinaw na ipinahahayag ng “sa daigdig” ang pandaigdig na saklaw.
theological_decisions:
- issue: Diwa ng pormulang וְהִתְבָּרֲכוּ בְזַרְעֲךָ
  choice: Sa iyong lahi, pagpapalain ang lahat ng bansa sa daigdig
  alternative: Sa iyong lahi, pagpapalain ng lahat ng bansa sa daigdig ang kanilang sarili
  rationale: Ang pasibong pagbasa ay natural sa konteksto ng pangakong tipan at nagpapanatili sa Diyos bilang di-hayag na pinagmumulan ng pagpapala. Gayunman, maaaring unawain nang reflexive ang anyong Hebreo, kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lahi” bilang natural na kolektibong katumbas ng זֶרַע, at ang “sa” upang mapanatili ang lawak at tensiyong teolohikal ng pariralang Hebreo.
