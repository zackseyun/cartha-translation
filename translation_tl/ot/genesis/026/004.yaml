  verdict: revise
  source_fidelity: Tapat ang pangunahing salin sa mga pandiwang pangako, sa paghahambing sa mga bituin, sa plural na 'mga lupain,' at sa saklaw na 'lahat ng bansa sa daigdig.' Ang 'sa iyong lahi' ay maingat na pinananatili ang malawak na ugnayang ipinahihiwatig ng בְּ nang hindi ito ginagawang tahasang instrumental.
  naturalness: 'Maalwan at marangal ang pangunahing teksto sa modernong Filipino. Gayunman, ang kasalukuyang talababa ay hindi malinaw at hindi ganap na naihahayag ang reflexive na alternatibo: ang ''pagpapalain ... ang kanilang sarili'' ay maaaring mabasa bilang isang di-likas na pasibong konstruksyon. Kailangan itong gawing malinaw na ang mga bansa ang magpapala sa kanilang sarili, kaugnay ng lahi ni Isaac.'
  terminology: Ang 'lahi' ay katanggap-tanggap na kolektibong salin ng זַרְעֲךָ sa kontekstong ito at angkop sa mataas na rehistro. Ang 'pagpapalain' para sa disputed na וְהִתְבָּרֲכוּ ay wastong pangunahing pagbasa, habang ang alternatibong reflexive ay dapat panatilihin sa talababa.
