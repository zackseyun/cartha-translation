    issue: Hindi malinaw ang pagkakalahad ng reflexive na alternatibo sa talababa.
    rationale: Ang Hebreong alternatibo ay 'all the nations ... will bless themselves by your offspring,' hindi lamang isang pasibong 'pagpapalain' na may layong 'ang kanilang sarili.' Ang binagong aktibong reflexive na pangungusap ay mas natural at mas tumpak na naghihiwalay sa alternatibong pagbasa mula sa pangunahing pasibong salin.
  revised_text: Pararamihin ko ang iyong lahi gaya ng mga bituin sa langit, at ibibigay ko sa iyong lahi ang lahat ng lupaing ito. Sa iyong lahi, pagpapalain ang lahat ng bansa sa daigdig.[a]
