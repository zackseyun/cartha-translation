  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל יִצְחָ֑ק לֵ֚ךְ מֵֽ/עִמָּ֔/נוּ כִּֽי עָצַֽמְתָּ מִמֶּ֖/נּוּ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/016.yaml
  text: Then Abimelech said to Isaac[a], “Go away from us, because you have become much stronger than we are.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Abimelec kay Isaac, “Lumayo ka sa amin, sapagkat naging lubhang mas makapangyarihan ka kaysa sa amin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod sa makabagong Filipino.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelec
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang pantangi.
- source_word: אֶל יִצְחָק
  choice: kay Isaac
  rationale: Ang “kay” ang natural na panandang Filipino para sa taong pinatutungkulan ng sinabi.
- source_word: לֵךְ מֵעִמָּנוּ
  choice: Lumayo ka sa amin
  rationale: Pinagsama ang pautos na “humayo” at ang pariralang naghahayag ng paghiwalay upang maging natural at tumpak sa Filipino.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng utos habang pinananatili ang marangal ngunit kasalukuyang himig.
- source_word: עָצַמְתָּ
  choice: naging higit na makapangyarihan ka
  rationale: Ipinahahayag ng pandiwa ang paglakas o pagiging makapangyarihan; ang “naging” ay nagpapanatili sa aspektong naganap.
- source_word: מִמֶּנּוּ מְאֹד
  choice: higit ... kaysa sa amin
  rationale: Ang מִן ay komparatibo at pinalalakas ng מְאֹד. Sa Filipino, sapat at natural ang “higit ... kaysa sa amin”; ang antas ng paghahambing ay nasa “higit,” habang ang konteksto ay nagpapakita ng malaking agwat.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tuwirang utos at ang paghahambing nang hindi dinaragdagan ng ideyang “labis” o “masyado,” na hindi tahasang nasa pandiwa.
