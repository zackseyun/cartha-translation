base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/021.yaml
  text: Then they dug another well[a], and they also quarreled over it, so he called its name Sitnah.
translation:
  language: tl
  text: Pagkatapos, humukay sila ng isa pang balon. Pinag-awayan din nila iyon, kaya tinawag niyang Sitna[a] ang balon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Sitna ay kaugnay ng salitang Hebreo na tumutukoy sa pagkapoot o pagsalungat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: humukay sila
  rationale: Ang Qal wayyiqtol na maramihan ng חפר ay karaniwang tumutukoy sa paghuhukay; natural at tuwiran sa modernong Tagalog ang “humukay sila.”
- source_word: בְּאֵר אַחֶרֶת
  choice: isa pang balon
  rationale: Ang בְּאֵר ay “balon,” at ang אַחֶרֶת ay nagsasaad ng isa pang balon na kasunod at naiiba sa nauna.
- source_word: וַיָּרִיבוּ גַּם עָלֶיהָ
  choice: pinag-awayan din nila iyon
  rationale: Ang ריב ay nagpapahayag ng pakikipagtalo o pakikipag-alitan. Ipinakikita ng “pinag-awayan” na ang balon ang sanhi o paksa ng alitan, habang tinutumbasan ng “din” ang גַּם.
- source_word: וַיִּקְרָא שְׁמָהּ
  choice: tinawag niyang … ang balon
  rationale: Natural na pormula ito ng pagbibigay-pangalan sa Tagalog at malinaw nitong pinananatili ang diwa ng literal na “tinawag niya ang pangalan nito.”
- source_word: שִׂטְנָה
  choice: Sitna
  rationale: Isinalin ito bilang transliteradong pantanging pangalan ng balon. Ang anyong “Sitna” ay angkop sa baybay at bigkas sa Filipino; ipinaliliwanag sa talababa ang kaugnayan nito sa pagkapoot o pagsalungat.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinag-awayan” upang maipahayag ang tunay na alitan nang hindi nagiging sobrang teknikal, at inilagay ang talababa sa pangalang Sitna na siyang ipinaliliwanag nito.
