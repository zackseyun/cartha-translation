translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang nakaugaliang anyo ng pangalang “Abimelec.” Iniwasang ipakahulugan ang “humipo” bilang “saktan” o “galawin nang masama,” sapagkat mas malawak at sadyang hindi ganoon katiyak ang Hebreo.
