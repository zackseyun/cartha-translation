  text: Then Abimelech commanded all the people[a], saying, “Whoever touches this man or his wife shall surely be put to death.”
translation:
  language: tl
  text: 'Pagkatapos, inutusan ni Abimelec ang buong bayan: “Ang sinumang humipo[a] sa lalaking ito o sa asawa niya ay tiyak na papatayin.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “Ang humihipo sa lalaking ito o sa asawa niya.”
    reason: Ipinapakita nito ang literal na anyo ng Hebreong participle na ginamit bilang pangkalahatang pagtukoy sa sinumang gagawa ng kilos.
lexical_decisions:
- source_word: וַיְצַו
  choice: inutusan
  rationale: Ipinapahayag ng anyong piel ng צוה ang makapangyarihang pagbibigay ng utos; malinaw at natural sa Filipino ang “inutusan.”
- source_word: כָּל הָעָם
  choice: ang buong bayan
  rationale: Tumutukoy ang עם sa lahat ng mga taong nasa ilalim ng pamamahala ni Abimelec, hindi kinakailangang sa isang etnikong bansa. Natural na ipinahahayag ng “buong bayan” ang saklaw nito.
- source_word: לֵאמֹר
  choice: (ipinakilala sa pamamagitan ng tuwirang sipi)
  rationale: Ang infinitibong ito ay naghuhudyat ng nilalaman ng utos. Sa natural na Filipino, sapat nang ipakilala ang mismong tuwirang sipi pagkatapos ng pandiwang “inutusan,” kaya hindi na idinagdag ang alanganing “na sinasabi.”
- source_word: הַנֹּגֵעַ
  choice: ang sinumang humipo
  rationale: 'Ang participleng may pantukoy ay ginagamit sa pangkalahatang diwa: sinumang gagawa ng kilos. Pinananatili ng “humipo” ang payak na kahulugan ng נגע nang hindi ito pinalalakas bilang pananakit.'
- source_word: בָּאִישׁ הַזֶּה
  choice: sa lalaking ito
  rationale: Minamarkahan ng ב ang taong hinihipo; ang “sa lalaking ito” ang likas at tuwirang katumbas sa Filipino.
- source_word: וּבְאִשְׁתּוֹ
  choice: o sa asawa niya
  rationale: Bagaman karaniwang “at” ang ו, ang dalawang protektadong tao ay mga alternatibong layon ng ipinagbabawal na kilos, kaya natural ang “o” sa Filipino. Tiyak sa konteksto na asawa ang אשה.
- source_word: מוֹת יוּמָת
  choice: ay tiyak na papatayin
  rationale: Ang infinitive absolute na sinusundan ng pasibong pandiwa ay nagbibigay-diin sa katiyakan ng parusa. Pinananatili ng “papatayin” ang pasibong diwa ng hatol, hindi lamang na mamamatay ang lumabag.
