  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּרָ֨א אֵלָ֤י/ו יְהוָה֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֕אמֶר אָנֹכִ֕י אֱלֹהֵ֖י אַבְרָהָ֣ם אָבִ֑י/ךָ אַל תִּירָא֙ כִּֽי אִתְּ/ךָ֣ אָנֹ֔כִי וּ/בֵֽרַכְתִּ֨י/ךָ֙ וְ/הִרְבֵּיתִ֣י אֶֽת זַרְעֲ/ךָ֔ בַּ/עֲב֖וּר אַבְרָהָ֥ם עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/024.yaml
  text: And Yahweh appeared to him that night and said[a], “I am the God of Abraham your father. Do not fear, for I am with you[b], and I will bless you and multiply your offspring for the sake of Abraham my servant.”
translation:
  language: tl
  text: Nang gabing iyon, nagpakita sa kanya si Yahweh at sinabi, “Ako ang Diyos ng iyong amang si Abraham. Huwag kang matakot[a], sapagkat kasama mo ako. Pagpapalain kita at pararamihin ko ang iyong mga supling[b] alang-alang kay Abraham na aking lingkod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Huwag kang mangamba.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang iyong binhi”; kolektibo ang gamit ng salitang Hebreo at tumutukoy sa mga supling o inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng titulong “Panginoon.”
- source_word: וַיֵּרָא אֵלָיו
  choice: nagpakita sa kanya
  rationale: Likas na salin sa Filipino ng anyong Niphal ng ראה, na tumutukoy rito sa tuwirang pagpapakita o pagpapahayag ng presensiya.
- source_word: בַּלַּיְלָה הַהוּא
  choice: nang gabing iyon
  rationale: Natural na temporal na parirala sa Filipino na nagpapanatili sa demonstratibong diwa ng הַהוּא.
- source_word: אָנֹכִי אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: Ako ang Diyos ng iyong amang si Abraham
  rationale: Malinaw at natural na ipinahahayag sa Filipino ang pagkakakilanlan ng Diyos at ang kaugnayan ni Abraham kay Isaac.
- source_word: אַל תִּירָא
  choice: Huwag kang matakot
  rationale: Karaniwan, malinaw, at marangal na pananalita para sa pagbabawal at banal na pagpapalakas ng loob.
- source_word: כִּי אִתְּךָ אָנֹכִי
  choice: sapagkat kasama mo ako
  rationale: Ipinapakita ng “sapagkat” na ang presensiya ng Diyos ang dahilan upang huwag matakot.
- source_word: וּבֵרַכְתִּיךָ
  choice: Pagpapalain kita
  rationale: Ang anyo ng pandiwa sa konteksto ng pangako ay angkop na isalin sa hinaharap.
- source_word: וְהִרְבֵּיתִי אֶת זַרְעֲךָ
  choice: at pararamihin ko ang iyong mga supling
  rationale: Inihahatid ng “pararamihin” ang causative na diwa ng Hiphil, at ng “mga supling” ang kolektibong kahulugan ng זֶרַע sa likas na modernong Filipino.
- source_word: בַּעֲבוּר
  choice: alang-alang kay
  rationale: Pinananatili nito ang diwa ng batayan o kapakanan nang hindi dinaragdagan ang teolohikal na paliwanag ng teksto.
- source_word: עַבְדִּי
  choice: aking lingkod
  rationale: Sa kontekstong tipan, ang “lingkod” ang angkop na tawag sa ugnayan at katayuan ni Abraham, sa halip na “alipin.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Batayan ng pangako sa pariralang בַּעֲבוּר אַבְרָהָם עַבְדִּי
  choice: alang-alang kay Abraham na aking lingkod
  alternative: dahil kay Abraham na aking lingkod; dahil sa aking lingkod na si Abraham
  rationale: Pinananatili ang tahasang pag-uugnay ng pagpapala kay Isaac at kay Abraham nang hindi tinutukoy nang higit sa sinasabi ng talata kung paano gumagana ang ugnayang iyon.
- issue: Kolektibong diwa ng זֶרַע
  choice: mga supling
  alternative: binhi; mga inapo
  rationale: Ipinahihiwatig ng konteksto ang mga magiging anak at inapo bilang isang kolektibong lahi; ang “mga supling” ay malinaw ngunit hindi inilalayo sa saklaw ng salitang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang natural na ayos ng pangungusap at karaniwang bokabularyo, habang pinananatili ang tuwirang banal na pananalita, ang pangakong tipan, at ang personal na pangalang Yahweh.
