  yaml_path: translation/ot/genesis/026/030.yaml
  text: And he prepared a feast for them[a], and they ate and drank.
translation:
  language: tl
  text: Naghanda siya ng isang handaan para sa kanila[a], at sila ay kumain at uminom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “piging”; ang salitang Hebreo ay tumutukoy sa isang handaan kung saan kapansin-pansing bahagi ang pag-inom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Naghanda
  rationale: Bagaman literal na “gumawa” ang עשה, kapag ang layon nito ay מִשְׁתֶּה, likas sa modernong Tagalog ang “naghanda,” na nagpapahayag ng paglalaan o pagsasaayos ng handaan.
- source_word: לָהֶם
  choice: para sa kanila
  rationale: Ang ל ay tumutukoy rito sa mga nakikinabang sa ginawa; malinaw at natural ang “para sa kanila.”
- source_word: מִשְׁתֶּה
  choice: handaan
  rationale: Tumutukoy ang salita sa isang piging o salusalo kung saan mahalagang bahagi ang pag-inom. Likas at madaling maunawaan ang “handaan,” habang tahasang binabanggit sa kasunod na sugnay ang pag-inom.
- source_word: וַיֹּאכְלוּ
  choice: sila ay kumain
  rationale: Tuwirang isinasalin ang kilos at pinananatili ang marangal at malinaw na daloy ng salaysay.
- source_word: וַיִּשְׁתּוּ
  choice: at uminom
  rationale: Tuwirang salin ng שתה; hindi na kailangang ulitin ang simuno dahil iisa ang gumagawa ng magkaugnay na mga kilos.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “handaan” bilang karaniwang salitang madaling maunawaan, habang pinanatili sa talababa ang mas pormal na alternatibong “piging” at ang diwa ng pag-inom sa terminong Hebreo.
