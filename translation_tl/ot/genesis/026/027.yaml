  text: Isaac said to them[a], “Why have you come to me, since you hated me and sent me away from among you?”
translation:
  language: tl
  text: Sinabi ni Isaac sa kanila[a], “Bakit kayo pumunta sa akin, gayong kinapootan ninyo ako at pinaalis ninyo ako mula sa piling ninyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at kinapootan ninyo ako at pinaalis ninyo ako mula sa piling ninyo.” Maaaring isalin nang mas literal na “at” ang pang-ugnay sa Hebreo, ngunit dito ay malamang na nagpapahayag ito ng pagsalungat o kasamang kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang salin ng אמר sa panimulang pangkasaysayan; natural itong gamitin bago ang tuwirang pananalita.
- source_word: אֲלֵהֶם
  choice: sa kanila
  rationale: Tuwirang ipinakikilala ang mga kausap ni Isaac.
- source_word: יִצְחָק
  choice: Isaac
  rationale: Ginamit ang kinagawiang anyo ng pangalan sa makabagong Bibliyang Filipino.
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Natural at tuwirang tanong sa sanhi sa modernong Tagalog.
- source_word: בָּאתֶם אֵלַי
  choice: kayo pumunta sa akin
  rationale: Malinaw at likas na ipinahahayag ang katatapos na pagdating na siyang dahilan ng tanong.
- source_word: וְאַתֶּם
  choice: gayong
  rationale: 'Ipinakikita ang kontrast o sirkumstansiya: nakapagtataka ang pagpunta nila dahil sa dati nilang pagkapoot at pagpapaalis sa kanya. Nananatili sa talababa ang mas literal na posibilidad na “at.”'
- source_word: שְׂנֵאתֶם אֹתִי
  choice: kinapootan ninyo ako
  rationale: Pinananatili ang lakas ng שנא na “kapootan,” sa halip na palambutin bilang simpleng pagkontra.
- source_word: וַתְּשַׁלְּחוּנִי
  choice: pinaalis
  rationale: Sa kontekstong ito, ang שׁלח na may taong layon ay nangangahulugang paalisin o papuntahin palayo; hindi nito kailangang ipahiwatig ang mas marahas na “itaboy.”
- source_word: מֵאִתְּכֶם
  choice: mula sa piling ninyo
  rationale: Ipinahahayag ang paghiwalay sa kanilang kinaroroonan at samahan, hindi lamang ang payak na “mula sa inyo.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “gayong” upang natural na maipakita ang lohikal na tensiyon ng tanong, habang inilalahad sa talababa ang mas literal na “at.”
