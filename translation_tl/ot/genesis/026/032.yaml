translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “Nang araw ding iyon” upang maging natural ang daloy at maipahiwatig ang parehong araw ng naunang mga pangyayari. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
