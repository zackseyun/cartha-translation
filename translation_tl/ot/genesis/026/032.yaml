base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/032.yaml
  text: And it happened on that day that Isaac’s servants came and told him about the well that they had dug[a], and they said to him[b], “We have found water.”
translation:
  language: tl
  text: Noong araw na iyon, dumating ang mga lingkod[a] ni Isaac at iniulat sa kanya ang tungkol sa balon na kanilang hinukay. Sinabi nila sa kanya, “Nakakita kami ng tubig.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “mga lingkod” ay maaari ring mangahulugang “mga alipin,” sapagkat maaaring tumukoy ang terminong Hebreo sa mga nakataling manggagawa ng sambahayan; hindi binibigyang-diin dito ang kanilang katayuang panlipunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: Nang araw ding iyon
  rationale: Likas na panandang temporal sa modernong Tagalog; pinananatili ng “ding” ang kaugnayan sa mga pangyayari noong araw na iyon nang hindi gumagamit ng makalumang pormula.
- source_word: עַבְדֵי יִצְחָק
  choice: mga lingkod ni Isaac
  rationale: Maaaring tumukoy ang עֶבֶד sa lingkod o alipin. Sa kontekstong ito, ang mga manggagawa ng sambahayan ni Isaac ang tampok, kaya malinaw at hindi labis na tiyak ang “mga lingkod.”
- source_word: וַיַּגִּדוּ לוֹ
  choice: ibinalita sa kanya
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi o mag-ulat; ang “ibinalita” ay natural sa ulat tungkol sa matagumpay na pagkakita ng tubig.
- source_word: עַל אֹדוֹת הַבְּאֵר אֲשֶׁר חָפָרוּ
  choice: ang tungkol sa balon na hinukay nila
  rationale: Tuwirang pinananatili ang paksa ng ulat at ang sugnay na tumutukoy kung aling balon iyon.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Sinabi nila sa kanya
  rationale: Pinananatili ang hiwalay at tahasang pambungad sa direktang pananalita na nasa Hebreo.
- source_word: מָצָאנוּ מָיִם
  choice: Nakakita kami ng tubig
  rationale: Karaniwang paraan sa Tagalog upang ipahayag na matagumpay nilang natagpuan ang tubig; hindi nagdaragdag ng di-tiyak na dami.
