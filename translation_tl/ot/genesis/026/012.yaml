base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/012.yaml
  text: Isaac sowed in that land[a], and in that year he found a hundredfold, and Yahweh blessed him.
translation:
  language: tl
  text: Naghasik si Isaac sa lupaing iyon, at noong taon ding iyon ay umani siya nang sandaang ulit[a], at pinagpala siya ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nakasumpong siya ng sandaang se'arim.” Maaari rin itong isaling “nakakuha siya ng sandaang takal”; idyoma ito para sa pambihirang saganang ani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַע
  choice: Naghasik
  rationale: Ang זרע sa kontekstong pansaka ay tumutukoy sa paghahasik ng binhi; tuwiran at likas itong ipinahahayag ng “naghasik.”
- source_word: בָּאָרֶץ הַהִוא
  choice: sa lupaing iyon
  rationale: Ang אֶרֶץ ay maaaring mangahulugang lupa o lupain; ang “lupaing iyon” ay angkop sa teritoryal na konteksto at hindi nagpapahiwatig ng makabagong estadong politikal.
- source_word: וַיִּמְצָא
  choice: umani siya
  rationale: Bagaman “makasumpong” ang karaniwang kahulugan ng מצא, sa kontekstong ito ng pagsasaka ay tumutukoy ito sa nakuhang ani. Ang “umani” ay malinaw at likas sa modernong Tagalog.
- source_word: בַּשָּׁנָה הַהִוא
  choice: nang taon ding iyon
  rationale: Ipinahahayag nito nang natural ang temporal na parirala at binibigyang-diin na sa mismong taon ng paghahasik nakuha ang ani.
- source_word: מֵאָה שְׁעָרִים
  choice: nang sandaang ulit
  rationale: Isa itong idyomang pansaka para sa pambihirang dami ng ani. Ang “sandaang ulit” ay malinaw nang hindi nagpapalagay ng isang tiyak na sinaunang yunit ng sukat.
- source_word: וַיְבָרֲכֵהוּ
  choice: Pinagpala siya
  rationale: Pinananatili nito ang karaniwang teolohikal na diwa ng ברך at tahasang iniuugnay kay Yahweh ang kabutihang tinanggap ni Isaac.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “Panginoon.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Pagpapahayag sa naging bunga ng paghahasik ni Isaac
  choice: umani siya nang sandaang ulit
  alternative: nakasumpong siya ng sandaang takal; nagkaroon siya ng sandaang ulit na ani
  rationale: Ang pandiwang “makasumpong” ay magiging malabo at di-likas sa Tagalog na kontekstong pansaka. Ipinahahayag ng “umani” ang kontekstuwal na diwa, samantalang itinatala sa talababa ang literal at posibleng alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “naghasik” at “umani” bilang likas na bokabularyong pansaka. Hinati sa dalawang pangungusap upang luminaw ang hiwalay ngunit kaugnay na pahayag tungkol sa pagpapala ni Yahweh.
