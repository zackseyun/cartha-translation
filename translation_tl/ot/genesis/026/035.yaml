  verdict: revise
  source_fidelity: 'Ang diwang pangkalahatan ay tama: ang pambabaeng maramihang paksa ay ang mga asawa ni Esau, at inilalarawan sila bilang sanhi ng malalim na paghihirap kina Isaac at Rebekah. Gayunman, ang “matinding sama ng loob” ay madaling mangahulugang hinanakit o sama ng loob na itinutok ng mga magulang sa mga babae, samantalang ang Hebreong idyoma ay mas malawak na tumutukoy sa matinding pagkayamot o dalamhati.'
  naturalness: Likas ang balangkas ng pangungusap, ngunit mas malinaw at mas neutral sa modernong Tagalog ang “nagdulot sila ng matinding dalamhati at pagkayamot” kaysa “naging sanhi ng matinding sama ng loob.”
  terminology: Pinanatili ang mga pangalang Isaac at Rebekah. Ang “kalooban” sa talababa ay mas likas na Tagalog na katapat sa idyomatikong gamit ng רוּחַ, nang hindi ipinipilit na ang literal na “espiritu” ay siyang natural na Tagalog na idyoma.
  issues:
