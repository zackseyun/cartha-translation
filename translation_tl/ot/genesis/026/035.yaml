  text: And they were a bitterness of spirit to Isaac and Rebekah[a][b][c].
translation:
  language: tl
  text: At nagdulot sila ng matinding dalamhati at pagkayamot kina Isaac at Rebekah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kapaitan ng kalooban kina Isaac at Rebekah.” Ang idyomang Hebreo ay tumutukoy sa matinding pagkayamot o dalamhati.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּהְיֶיןָ
  choice: At sila ay naging
  rationale: Ang Qal wayyiqtol na pambabaeng maramihan ay tumutukoy sa mga asawa ni Esau sa naunang talata at nagpapatuloy sa salaysay. Ang “naging” ay likas sa Tagalog at pinananatili ang posibleng diwang pagbabago ng kalagayan.
- source_word: מֹרַת רוּחַ
  choice: sanhi ng matinding sama ng loob
  rationale: Ang literal na idyomang “kapaitan ng espiritu” ay tumutukoy sa matinding pagkayamot o dalamhati. Ang saling ito ay natural sa modernong Tagalog at ipinahihiwatig ng konstruksiyon na ang mga babae ang pinagmulan ng gayong paghihirap.
- source_word: לְיִצְחָק וּלְרִבְקָה
  choice: nina Isaac at Rebekah
  rationale: Minamarkahan ng ל ang mga taong apektado. Dahil sa pariralang “sama ng loob,” natural sa Tagalog ang “nina” para tukuyin ang mga nakaranas nito, habang pinananatili ang parehong pangalan.
