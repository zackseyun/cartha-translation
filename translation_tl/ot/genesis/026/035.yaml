    rationale: Ang מֹרַת רוּחַ ay idyoma para sa malalim na pagkayamot o dalamhati; hindi nito tiyak na sinasabing nagkimkim ng sama ng loob sina Isaac at Rebekah laban sa kanila.
  - severity: low
    issue: Hindi likas ang “kapaitan ng espiritu para kay Isaac at para kay Rebekah” sa talababa.
    rationale: Mas malinaw na ilahad ang idyomatikong literal na anyo gamit ang “kalooban” at ang natural na “kina Isaac at Rebekah.”
