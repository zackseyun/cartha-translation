  terminology: Ang mga anyong Abimelec, Filisteo, Isaac, at Rebeca ay angkop sa modernong Filipino Tagalog. Ginawang “asawa ni Isaac” ang huling parirala upang lubusang alisin ang anumang posibleng kalabuan ng panghalip.
