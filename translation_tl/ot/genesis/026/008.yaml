base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/008.yaml
  text: And it happened[a], when he had been there a long time, that Abimelech king of the Philistines looked out through the window and saw, and behold, Isaac was laughing with Rebekah his wife.
translation:
  language: tl
  text: Nang matagal na siyang nananatili roon, dumungaw sa bintana si Abimelec, na hari ng mga Filisteo, at nakita niya—si Isaac ay nakikipagharutan[a] kay Rebeca, na asawa ni Isaac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakikipaglaro,” “nakikipagtawanan,” o “magiliw na humahaplos.” Ang pandiwang Hebreo ay kaugnay ng pangalan ni Isaac at maaaring tumukoy sa mapaglaro o matalik na kilos. Sa kontekstong ito, ang nakita ni Abimelec ay sapat upang makilala niyang asawa ni Isaac si Rebeca.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי אָרְכוּ לוֹ שָׁם הַיָּמִים
  choice: Nang matagal na siyang naninirahan doon
  rationale: Likas na Filipino para sa temporal na panimulang pahayag at sa idyomang Hebreo na nagsasaad ng matagal na pananatili; hindi kailangang isalin nang hiwalay ang pormulang וַיְהִי.
- source_word: וַיַּשְׁקֵף ... בְּעַד הַחַלּוֹן
  choice: dumungaw sa bintana
  rationale: Karaniwang modernong Filipino para sa pagtingin palabas mula sa isang bintana; pinananatili ang pananaw mula sa loob.
- source_word: וַיַּרְא וְהִנֵּה
  choice: Nakita niyang
  rationale: Ipinahahayag nang natural sa Filipino ang biglang natuklasan ni Abimelec. Ang hiwalay na literal na katumbas ng הִנֵּה gaya ng 'narito' ay magiging pilit sa kontekstong ito.
- source_word: מְצַחֵק
  choice: nakikipagbiruan
  rationale: Pinananatili ang lawak ng pandiwang mula sa צחק—mapaglaro o matalik na kilos—nang hindi tiyakang ginagawang paghaplos o seksuwal na gawain. Ang talababa ay nagsasaad ng leksikal na kalabuan at ng implikasyon sa salaysay.
- source_word: אֵת רִבְקָה אִשְׁתּוֹ
  choice: kay Rebeca na asawa nito
  rationale: Nililinaw ng 'nito' na si Rebeca ay asawa ni Isaac, habang iniiwasan ang posibleng saglit na kalabuan ng 'kanyang asawa' sa sunod-sunod na pagbanggit sa mga tauhan.
theological_decisions:
- issue: Antas ng pagiging matalik ng kilos ni Isaac kay Rebeca
  choice: nakikipagbiruan
  alternative: hinahaplos / nakikipagharutan
  rationale: Hindi tiyak na inilalarawan ng tekstong Hebreo ang eksaktong kilos. Pinananatili ng salin ang kalabuan ngunit ipinababatid sa talababa na sapat ang kilos upang mahalata ni Abimelec ang tunay nilang ugnayan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang karaniwang anyong Tagalog ng mga pangalang Abimelec, Filisteo, Isaac, at Rebeca. Iniwasan ang arkaikong 'at nangyari' sapagkat sapat na naihahatid ng temporal na 'Nang' ang daloy ng salaysay.
