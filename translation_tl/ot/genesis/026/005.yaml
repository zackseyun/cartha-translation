  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עֵ֕קֶב אֲשֶׁר שָׁמַ֥ע אַבְרָהָ֖ם בְּ/קֹלִ֑/י וַ/יִּשְׁמֹר֙ מִשְׁמַרְתִּ֔/י מִצְוֺתַ֖/י חֻקּוֹתַ֥/י וְ/תוֹרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/005.yaml
  text: because Abraham obeyed my voice and kept my charge[a], my commandments, my statutes[b], and my laws.
translation:
  language: tl
  text: sapagkat nakinig si Abraham sa aking tinig[a] at tinupad niya ang aking ipinagbilin, ang aking mga utos, ang aking mga tuntunin, at ang aking mga kautusan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumunod sa akin.” Ang idyomang Hebreo na literal na “nakinig sa aking tinig” ay karaniwang nangangahulugan ng masunuring pakikinig.
    reason: lexical_alternative
  - marker: b
    text: O “mga tagubilin.” Ang Hebreong torah ay maaaring mangahulugang “kautusan,” “tagubilin,” o “turo,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵקֶב
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagpapalang binanggit sa konteksto; likas at malinaw sa makabagong Tagalog ang “sapagkat.”
- source_word: שָׁמַע ... בְּקֹלִי
  choice: nakinig ... sa aking tinig
  rationale: Pinananatili nito ang larawang pandinig ng idyomang Hebreo habang ipinahihiwatig sa konteksto ang masunuring pakikinig.
- source_word: וַיִּשְׁמֹר
  choice: tinupad
  rationale: Sa piling ng mga tungkulin at kautusan, natural na ipinahahayag ng “tinupad” ang aktibong pag-iingat at pagsunod, hindi lamang pasibong pag-alala.
- source_word: מִשְׁמַרְתִּי
  choice: ang aking ipinagbilin
  rationale: Ipinakikita nito ang isang bagay o tungkuling iniatas na dapat tuparin at pinananatili itong naiiba sa mga karaniwang salitang legal na kasunod.
- source_word: מִצְוֺתַי
  choice: ang aking mga utos
  rationale: Tuwiran, malinaw, at karaniwang katumbas ito ng mga tiyak na ipinag-uutos.
- source_word: חֻקּוֹתַי
  choice: ang aking mga tuntunin
  rationale: Pinananatili nito ang pagkakaiba sa “mga utos” at “mga kautusan” habang nananatiling madaling maunawaan.
- source_word: וְתוֹרֹתָי
  choice: at ang aking mga kautusan
  rationale: Sa listahang legal at tipanan ang konteksto, ipinahahayag ng “mga kautusan” ang ganitong diwa ng torah; inilalahad sa talababa ang mas malawak na kahulugang “mga tagubilin.”
theological_decisions:
- issue: Ang magkakasunod na katawagang legal at pangtipan bago ang Sinai
  choice: Panatilihing magkakahiwalay ang “ipinagbilin,” “mga utos,” “mga tuntunin,” at “mga kautusan.”
  alternative: Pagsamahin ang mga ito sa isang mas maikling parirala gaya ng “lahat ng aking mga utos at tuntunin.”
  rationale: Sadyang pinagsasama ng Hebreo ang magkakalapit ngunit hindi lubos na magkaparehong mga salita upang idiin ang malawak na pagsunod ni Abraham. Hindi nilulutas ng salin ang tensiyon tungkol sa kaugnayan nito sa Torah na ibinigay kalaunan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Inulit ang “ang aking” upang mapanatili ang diin at maindayog na pagkakahanay ng tekstong Hebreo.
