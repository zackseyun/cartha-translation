base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/002.yaml
  text: Then Yahweh appeared to him and said[a], “Do not go down to Egypt. Dwell in the land that I will tell you.”
translation:
  language: tl
  text: Nagpakita sa kanya si Yahweh at sinabi, “Huwag kang bumaba sa Ehipto. Manirahan ka sa lupaing sasabihin ko sa iyo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Manirahan ka sa lupaing sinasabi ko sa iyo,” na mas literal na nagpapanatili sa anyo ng Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: Nagpakita
  rationale: Ang Niphal ng ראה ay tumutukoy rito sa pagpapakita o pagpapahayag ng presensiya. Natural sa Tagalog ang “nagpakita” at hindi nito tinutukoy kung paano naganap ang pagpapakita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אַל תֵּרֵד
  choice: Huwag kang bumaba
  rationale: Ang אַל na may imperfect ay isang pagbabawal. Pinananatili ng “bumaba” ang karaniwang idyoma sa paglalakbay patungong Ehipto.
- source_word: מִצְרָיְמָה
  choice: sa Ehipto
  rationale: Ipinapahiwatig ng hulaping directional ang pagkilos patungong Ehipto; “sa Ehipto” ang natural na katumbas sa Tagalog kasunod ng pandiwang “bumaba.”
- source_word: שְׁכֹן
  choice: Manirahan
  rationale: Ang pautos na anyo ng שכן ay nangangahulugang tumira o manatili sa isang lugar. Ang “manirahan” ay malinaw na nagpapahiwatig ng paninirahan nang hindi dinaragdagan ang diwa ng permanenteng paninirahan.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Ang אֶרֶץ ay tumutukoy dito sa isang lupain o teritoryo, hindi sa buong daigdig.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: na sasabihin ko sa iyo
  rationale: Pinananatili nito ang bukas na aspektong Hebreo at, sa konteksto, ang ideya ng tagubiling ibibigay pa ng Diyos. Natural din ito sa makabagong Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng titulo.
- issue: Panahunan ng אֹמַר sa pariralang אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: na sasabihin ko sa iyo
  alternative: na sinasabi ko sa iyo
  rationale: Maaaring hindi tiyak ang panahunan ng imperfect, ngunit mas malamang sa konteksto ang darating pang pagtukoy o paggabay. Inilalagay sa talababa ang mas literal na alternatibo upang hindi maitago ang posibleng pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “manirahan” sa halip na mas arkaikong “manahan,” habang pinanatili ang idyomang “bumaba sa Ehipto” at ang pangalang Yahweh.
