base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/010.yaml
  text: And Abimelech said[a], “What is this you have done to us? One of the people might easily have lain with your wife, and you would have brought guilt upon us.”
translation:
  language: tl
  text: At sinabi ni Abimelec, “Ano itong ginawa mo sa amin? Muntik nang[a] sumiping sa asawa mo ang isa sa mga tao, at nagdulot ka sana sa amin ng sala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Halos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: Ano itong ginawa mo sa amin?
  rationale: Pinananatili ang mariing tanong na מַה זֹּאת at ang panlahatang layon na לָּנוּ, habang natural sa modernong Tagalog.
- source_word: כִּמְעַט
  choice: Madali sanang
  rationale: Sa konteksto, nagsasaad ito ng pangyayaring muntik o madaling mangyari. Ipinahihiwatig ng “madali sanang” kapuwa ang panganib at ang hindi natuloy na pangyayari; inilalahad sa talababa ang mas literal na alternatibo.
- source_word: שָׁכַב ... אֶת אִשְׁתֶּךָ
  choice: sumiping sa asawa mo
  rationale: Ang “sumiping” ay marangal at malinaw na katumbas ng Hebreong idyoma para sa pakikipagtalik, nang hindi nagiging tahasan o kolokyal.
- source_word: אַחַד הָעָם
  choice: may isa sa bayan
  rationale: Pinananatili ang di-tiyak na isang kasapi ng kolektibong הָעָם at hindi ito tahasang nililimitahan sa salitang “lalaki,” bagaman ipinahihiwatig iyon ng konteksto.
- source_word: וְהֵבֵאתָ עָלֵינוּ אָשָׁם
  choice: at dahil sa iyo ay nagkasala sana kami
  rationale: Natural nitong ipinapahayag sa Tagalog na ang pagkakasala o pananagutang moral ay mapapasan ng buong pamayanan dahil sa ginawa ni Isaac. Ang “dahil sa iyo” ang idiomatikong pagpapahayag ng sanhi na nasa Hebreong larawan ng pagdadala ng guilt sa kanila.
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  choice: At sinabi ni Abimelec
  rationale: Karaniwang salaysay na katumbas ng wayyiqtol at nagpapanatili sa daloy ng Hebreong naratibo.
theological_decisions:
- issue: Kalikasan ng אָשָׁם sa kontekstong ito
  choice: nagkasala sana kami
  alternative: napasaatin sana ang pananagutan / nagkaroon sana kami ng sala
  rationale: Ang אָשָׁם ay tumutukoy sa tunay na pagkakasala at pananagutang moral, hindi lamang sa kahihiyan o paninisi. Iniwasang gamitin ang bokabularyong maaaring magpahiwatig dito ng teknikal na handog para sa kasalanan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sumiping” bilang dignified na idyoma at “bayan” para sa kolektibong הָעָם. Inilagay ang talababa sa dulo ng pangungusap upang maipakita ang alternatibong pagbasa sa buong sugnay na nakasalalay sa כִּמְעַט.
