  yaml_path: translation/ot/genesis/026/019.yaml
  text: Then Isaac’s servants dug in the wadi and found there a well of living water[a][b].
translation:
  language: tl
  text: Pagkatapos, naghukay ang mga lingkod ni Isaac sa wadi[a], at nakasumpong sila roon ng isang balon ng tubig na buhay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lambak” o “tuyong sapang.” Ang salitang Hebreo ay madalas tumukoy sa wadi, isang daluyan ng tubig na karaniwang may agos lamang sa ilang panahon.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “tubig na buhay,” ibig sabihin, sariwa o umaagos na tubig mula sa bukal, sa halip na nakatiwangwang na tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: naghukay
  rationale: Karaniwan at tuwirang katumbas ng Qal na pandiwang חפר, at likas sa salaysay.
- source_word: עַבְדֵי יִצְחָק
  choice: mga lingkod ni Isaac
  rationale: Tumutukoy sa mga taong naglilingkod kay Isaac; hindi tiyak sa kontekstong ito kung dapat idiin ang katayuang alipin, kaya pinanatili ang mas malawak at likas na “mga lingkod.”
- source_word: בַּנָּחַל
  choice: sa wadi
  rationale: Ang נחל ay madalas tumukoy sa isang pana-panahong daluyan ng tubig o tuyong sapang, hindi lamang sa pangkalahatang lambak. Pinananatili ng “wadi” ang heograpikong diwa, na ipinaliliwanag sa talababa.
- source_word: וַיִּמְצְאוּ שָׁם
  choice: nakakita sila roon
  rationale: Tuwirang pinananatili ang sunod na kilos sa salaysay at ang diin ng שָׁם sa lokasyon.
- source_word: בְּאֵר
  choice: isang balon
  rationale: Ang pangngalan ay tumutukoy sa balon; inilalarawan ng kasunod na parirala ang uri ng tubig na naroon.
- source_word: מַיִם חַיִּים
  choice: buhay na tubig
  rationale: Pinananatili ang literal na idyomang Hebreo at ang mga alingawngaw nito sa ibang bahagi ng Kasulatan; nililinaw sa talababa na tumutukoy ito sa sariwa o umaagos na tubig mula sa bukal.
theological_decisions:
- issue: Pagpapanatili sa idyomang “buhay na tubig”
  choice: Isinalin nang literal bilang “buhay na tubig.”
  alternative: “sariwang tubig,” “umaagos na tubig,” o “tubig-bukal”
  rationale: Hindi dapat bawasan ang Hebreong larawan o ang posibleng ugnayan nito sa paggamit ng parirala sa ibang teksto. Ipinaliliwanag ng talababa ang kahulugan nito sa agarang konteksto nang hindi ginagawang interpretasyon ang pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “wadi” upang mapanatili ang tiyak na heograpikong kahulugan, kalakip ang paliwanag sa talababa. Pinanatili ang Hebreong idyomang “buhay na tubig” sa pangunahing teksto.
