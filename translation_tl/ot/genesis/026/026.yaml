  yaml_path: translation/ot/genesis/026/026.yaml
  text: Then Abimelech went to him from Gerar[a], with Ahuzzath his friend and Phicol the commander of his army.
translation:
  language: tl
  text: Pagkatapos, pumunta si Abimelec sa kanya mula sa Gerar, kasama si Ahuzat, na kaibigan niya[a], at si Picol, ang pinuno ng kanyang hukbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasamahan niya.” Ang salitang Hebreo ay maaaring tumukoy sa isang kaibigan o kasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲבִימֶלֶךְ
  choice: Pagkatapos, pumunta si Abimelec
  rationale: Likas sa makabagong salaysay ang “Pagkatapos” bilang pagtutumbas sa waw na nagpapatuloy ng pangyayari. Ginamit ang karaniwang anyong Filipino ng pangalan.
- source_word: הָלַךְ אֵלָי/ו
  choice: pumunta ... sa kanya
  rationale: Pinananatili ang karaniwang kahulugan ng הלך at ang panghalip ng Hebreo; malinaw sa konteksto na si Isaac ang tinutukoy.
- source_word: מִ/גְּרָר
  choice: mula sa Gerar
  rationale: Tuwirang ipinahahayag ng מִן ang pinanggalingan; pinanatili ang pangalang Gerar.
- source_word: וַ/אֲחֻזַּת
  choice: kasama si Ahuzat
  rationale: Ipinakikita ng “kasama” na kabilang si Ahuzat sa mga sumama kay Abimelec, sa natural na ayos ng Filipino.
- source_word: מֵֽרֵעֵ/הוּ
  choice: na kaibigan niya[a]
  rationale: Ang רֵעַ ay pangunahing tumutukoy sa kaibigan, kasama, o malapit na kaugnay. Pinili ang malinaw at hindi labis na tiyak na “kaibigan,” habang inilalahad sa talababa ang posibleng tungkuling panghukuman.
- source_word: וּ/פִיכֹל
  choice: at si Picol
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan at ang natural na pang-ugnay sa listahan.
- source_word: שַׂר צְבָא/וֹ
  choice: ang pinuno ng kanyang hukbo
  rationale: Ang שַׂר ay pinuno o kumandante, at ang צָבָא rito ay hukbong militar. Malinaw at marangal sa Filipino ang “pinuno ng kanyang hukbo.”
