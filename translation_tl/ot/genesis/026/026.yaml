translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang panghalip na “sa kanya” sa halip na ipalit ang pangalang Isaac, at inilagay ang talababa sa salitang talagang may leksikal na kalabuan.
