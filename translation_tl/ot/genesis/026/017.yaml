base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/017.yaml
  text: So Isaac went away from there and camped in the Valley of Gerar[a], and settled there.
translation:
  language: tl
  text: Kaya umalis doon si Isaac, nagkampo sa Lambak ng Gerar[a], at doon nanirahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa wadi ng Gerar.” Ang salitang Hebreo ay maaaring tumukoy sa daluyan ng pana-panahong batis, bangin, o lambak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: umalis doon
  rationale: Ipinapahayag ng parirala ang pag-alis ni Isaac mula sa naunang lugar; natural at tuwiran ang “umalis doon” sa makabagong Tagalog.
- source_word: וַיִּחַן
  choice: nagkampo
  rationale: Karaniwang tumutukoy ang חנה sa pagtatayo o pananatili sa kampo. Malinaw at kasalukuyang gamit ang “nagkampo.”
- source_word: בְּנַחַל גְּרָר
  choice: sa Lambak ng Gerar
  rationale: Maaaring tumukoy ang נַחַל sa lambak, bangin, o tuyong daluyan ng pana-panahong batis. Pinili ang “Lambak ng Gerar” bilang madaling maunawaang pangalan ng pook, habang inilalahad sa talababa ang saklaw ng salitang Hebreo.
- source_word: וַיֵּשֶׁב שָׁם
  choice: doon nanirahan
  rationale: Ang ישב ay maaaring mangahulugang tumira o manirahan. Kasunod ng “nagkampo,” ipinahihiwatig ng “nanirahan” ang pananatili niya sa lugar nang hindi dinaragdagan ang detalye ng teksto.
