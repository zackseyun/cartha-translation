  text: He had flocks[a], herds, and a large household[b], and the Philistines envied him.
translation:
  language: tl
  text: Mayroon siyang mga kawan, mga kawan ng baka, at maraming tagapaglingkod[a], at nainggit sa kanya ang mga Filisteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “masaganang paglilingkod/paggawa”; malamang tumutukoy ang parirala sa malaking pangkat ng mga tagapaglingkod, manggagawa, o iba pang tauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Mayroon siyang
  rationale: Ang konstruksiyong היה + ל ay nagpapahayag ng pagmamay-ari; natural itong isalin sa modernong Tagalog bilang “Mayroon siyang.”
- source_word: מִקְנֵה צֹאן
  choice: mga kawan
  rationale: Tumutukoy ang parirala sa maliliit na alagang hayop, lalo na sa mga tupa at kambing; pinananatili ng “mga kawan” ang kolektibong diwa nang hindi ito nililimitahan sa tupa lamang.
- source_word: וּמִקְנֵה בָקָר
  choice: mga bakahan
  rationale: Tumutukoy ito sa mga alagang baka bilang kolektibong pag-aari; likas at maikli sa Tagalog ang “mga bakahan.”
- source_word: וַעֲבֻדָּה רַבָּה
  choice: napakaraming manggagawa
  rationale: Maaaring mangahulugan ang עֲבֻדָּה ng paglilingkod, paggawa, o puwersa ng mga tagapaglingkod/manggagawa. Sa talaan ng kayamanan ni Isaac, malamang na konkretong lakas-paggawa ang tinutukoy, ngunit nililinaw sa talababa ang literal at mas malawak na saklaw.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: nainggit sa kanya
  rationale: Sa konteksto ng kasaganaan ni Isaac, ipinahahayag ng קנא ang inggit na nakatuon sa kanya; “nainggit sa kanya” ang natural na katumbas sa Tagalog.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Ito ang karaniwang modernong Tagalog na pangalan para sa pangkat na פלשתים.
