base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/016.yaml
  text: When Joseph saw Benjamin with them[a], he said to the one over his household, “Bring the men into the house, slaughter an animal, and prepare it[c][b], because the men will eat with me at noon.”
translation:
  language: tl
  text: Nang makita ni Jose na kasama nila si Benjamin, sinabi niya sa namamahala sa kanyang sambahayan[a], “Dalhin mo ang mga lalaki sa bahay, magkatay ka ng hayop[b] at ihanda iyon, sapagkat kakain silang kasama ko sa tanghali[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa tagapangasiwa ng kanyang bahay.” Literal sa Hebreo: “sa taong namamahala sa kanyang sambahayan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Idyoma sa Hebreo: inuulit ang salitang may diwang “magkatay,” na tumutukoy sa pagkatay ng hayop para sa isang pagkain o handaan.'
    reason: cultural_note
  - marker: c
    text: O “sa kalagitnaan ng araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita
  rationale: Tuwirang ipinapahayag ng Qal na anyo ng ראה na napansin ni Jose ang presensiya ni Benjamin.
- source_word: אִתָּם
  choice: kasama nila
  rationale: Ipinahihiwatig ng pang-ukol na si Benjamin ay kabilang sa pangkat ng kanyang mga kapatid.
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  choice: sa namamahala sa kanyang sambahayan
  rationale: Pinananatili nito ang diwa ng taong inilagay na mamahala sa bahay o sambahayan ni Jose nang hindi nagdaragdag ng mas tiyak na titulo.
- source_word: הָבֵא ... הַבָּיְתָה
  choice: Dalhin mo ang mga lalaki sa bahay
  rationale: Ang hulaping paturol sa direksiyon sa הַבָּיְתָה ay nagsasaad ng pagpasok o pagdadala patungo sa loob ng bahay; likas sa Filipino ang pariralang “sa bahay” sa kontekstong ito.
- source_word: וּטְבֹחַ טֶבַח
  choice: magkatay ka ng hayop
  rationale: Ang magkaugnay na pandiwa at pangngalan ay idyomang Hebreo para sa pagkatay ng hayop na ihahanda bilang pagkain; hindi tinutukoy ng teksto ang uri ng hayop.
- source_word: וְהָכֵן
  choice: at ihanda iyon
  rationale: Ang Hiphil na pautos ng כון ay nangangahulugang ihanda o gawing handa. Ang “iyon” ay likas na tumutukoy sa kinatay na hayop o pagkaing mula rito, habang hindi labis na nililinaw ang hindi tahasang layon sa Hebreo.
- source_word: כִּי אִתִּי יֹאכְלוּ הָאֲנָשִׁים
  choice: sapagkat kakain silang kasama ko
  rationale: Ibinibigay ng כִּי ang dahilan ng mga utos, at tuwirang pinananatili ng salin ang ideya ng pagkain na kasama si Jose.
- source_word: בַּצָּהֳרָיִם
  choice: sa tanghali
  rationale: Ang salita ay tumutukoy sa oras ng tanghali o kalagitnaan ng araw; “sa tanghali” ang karaniwan at malinaw na katumbas sa modernong Filipino.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaki / sila
  rationale: Tumutukoy ito sa mga lalaking dumating kay Jose. Sa ikalawang banggit, ginamit ang panghalip na “sila” upang maging natural sa Filipino nang hindi binabago ang tinutukoy.
