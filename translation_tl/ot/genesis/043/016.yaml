translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” upang masaklaw ang bahay at mga taong pinamamahalaan, at pinanatiling payak ang mga utos ni Jose. Inilagay ang bawat talababa sa salitang o pariralang tunay nitong nililinaw.
