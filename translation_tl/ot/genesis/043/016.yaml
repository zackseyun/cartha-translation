  naturalness: Likas at malinaw ang pangunahing salin sa makabagong Filipino. Gayunman, hindi natural o malinaw ang literal na pananalita sa talababa a na “sa taong nasa ibabaw ng kanyang sambahayan,” at ang “magkatay ng katayan” sa talababa b ay hindi angkop na Filipino.
  terminology: Ang “namamahala sa kanyang sambahayan,” “magkatay,” “ihanda,” at “sa tanghali” ay angkop sa konteksto at rehistro. Pinananatili ng “hayop” ang di-pagtukoy ng Hebreo sa espesye.
