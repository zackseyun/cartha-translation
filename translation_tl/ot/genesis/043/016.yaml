  to: Nang makita ni Jose na kasama nila si Benjamin, sinabi niya sa namamahala sa kanyang sambahayan[a], “Dalhin mo ang mga lalaki sa bahay, magkatay ka ng hayop[b] at ihanda iyon, sapagkat kakain silang kasama ko sa tanghali[c].”
