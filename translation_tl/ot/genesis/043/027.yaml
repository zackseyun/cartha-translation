lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Tinanong niya
  rationale: Tuwiran at natural na katumbas ng pandiwang שׁאל sa kontekstong ipinakikilala ang pagtatanong ni Jose.
- source_word: לְשָׁלוֹם
  choice: kung mabuti ang kanilang kalagayan
  rationale: Ang שָׁלוֹם sa idyomang ito ay tumutukoy sa pangkalahatang kabutihan o kapakanan, hindi lamang sa kawalan ng alitan.
- source_word: הֲשָׁלוֹם
  choice: Mabuti ba ang kalagayan
  rationale: Pinananatili nito ang malawak na diwa ng שָׁלוֹם; ang “malusog ba” ay magiging mas makitid dahil kalusugan lamang ang tutukuyin.
- source_word: אֲבִיכֶם הַזָּקֵן
  choice: inyong matandang ama
  rationale: Malapit sa Hebreo at natural sa Filipino; malinaw nitong pinananatili ang pagtukoy sa katandaan ng ama.
- source_word: אֲשֶׁר אֲמַרְתֶּם
  choice: na binanggit ninyo
  rationale: Natural na Filipino para sa kamag-anak na sugnay na tumutukoy sa amang dati nilang sinabi o binanggit.
- source_word: הַעוֹדֶנּוּ חָי
  choice: Buhay pa ba siya?
  rationale: Ang “pa” ay likas na naghahatid ng diwa ng עוֹד, at ang “buhay” ang tuwirang katumbas ng חָי.
