translation:
  language: tl
  text: Kaya ginawa ng lalaki ang ayon sa sinabi ni Jose, at ipinasok niya ang mga lalaki sa bahay ni Jose.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ginawa
  rationale: Ang עשה sa pariralang ito ay nagsasaad ng pagsunod sa isang utos; natural sa Tagalog ang “ginawa ... ang sinabi.”
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: “Ang lalaki” lamang ang tahasang sinasabi ng Hebreo. Bagaman ipinahihiwatig ng konteksto na siya ang namamahala sa bahay ni Jose, hindi iyon tinutukoy sa talatang ito.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: ang sinabi ni Jose
  rationale: Natural at tuwirang ipinapahayag nito na kumilos ang lalaki ayon sa iniutos ni Jose.
- source_word: וַיָּבֵא
  choice: dinala
  rationale: Ang causative na anyo ng בוא ay nangangahulugang magdala o papasukin; “dinala” ang pinakadirektang katumbas dito.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaki
  rationale: Pinananatili nito ang pangkalahatang katawagan ng Hebreo sa halip na tukuyin sila bilang mga kapatid ni Jose.
- source_word: בֵּיתָה יוֹסֵף
  choice: sa bahay ni Jose
  rationale: Ipinahihiwatig ng directional ה ang paggalaw patungo sa bahay. Sa konteksto, ang “dinala ... sa bahay” ay natural na nagpapahiwatig ng pagpasok nang hindi pinabibigat ang pangungusap.
