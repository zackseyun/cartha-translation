    issue: Hindi ganap na naipapakita ng “sa bahay ni Jose” ang pagpasok sa bahay.
    rationale: Ang בֵּיתָה ay may direksiyonal na anyo, at ang וַיָּבֵא ay causative na “dinala/ipinasok.” Ang “ipinasok ... sa bahay” ay nagpapanatili ng aspektong ito nang natural sa Filipino.
  - severity: low
    issue: Ang “ginawa ... ang sinabi ni Jose” ay bahagyang mas malabo kaysa sa pariralang pagsunod sa Hebreo.
    rationale: Ang כַּאֲשֶׁר אָמַר יוֹסֵף ay “ayon sa gaya ng sinabi ni Jose.” Ang “ayon sa sinabi ni Jose” ay mas malinaw na naghahayag ng pagsunod nang hindi nagpapalawak ng kahulugan.
  revised_text: Kaya ginawa ng lalaki ang ayon sa sinabi ni Jose, at ipinasok niya ang mga lalaki sa bahay ni Jose.
