  text: Then Israel said[a], “Why did you do me harm by telling the man that you still had another brother?”
translation:
  language: tl
  text: Sinabi ni Israel, “Bakit ninyo ako ipinahamak sa pagsasabi ninyo sa lalaking iyon na mayroon pa kayong kapatid?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Tagalog ang simpleng “Sinabi” sa ganitong pagkakasunod-sunod.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: “Israel” ang pangalang ginamit sa tekstong Hebreo, kaya hindi ito pinalitan ng “Jacob.”
- source_word: לָמָה
  choice: Bakit
  rationale: Tuwiran at likas na katumbas ng tanong na humihingi ng dahilan.
- source_word: הֲרֵעֹתֶם לִי
  choice: ninyo ako ipinahamak
  rationale: Ipinahahayag ng Hiphil ng רעע ang pagdudulot ng pinsala o masamang kalagayan. Ang “ipinahamak” ay natural sa Tagalog at naipakikita ang idinulot na kapinsalaan nang hindi kinakailangang ipakahulugang moral na kasamaan.
- source_word: לְהַגִּיד
  choice: nang sabihin ninyo
  rationale: Ipinakikita ng pawatas ang paraan o pangyayaring naging sanhi ng kapinsalaan.
- source_word: לָאִישׁ
  choice: sa lalaking iyon
  rationale: Tumutukoy ito sa opisyal na kilala na sa salaysay; natural sa Tagalog ang “lalaking iyon” sa ganitong pagtukoy.
- source_word: הַעוֹד לָכֶם אָח
  choice: na mayroon pa kayong kapatid
  rationale: Pinananatili ng “mayroon pa” ang diwa ng patuloy o natitirang pag-iral. Hindi idinagdag ang “isa pang” sa pangunahing teksto sapagkat hindi iyon tahasang nasa pariralang Hebreo.
