  yaml_path: translation/ot/genesis/043/028.yaml
  text: They said[a], “Your servant our father is well; he is still alive.” Then they bowed down and prostrated themselves.
translation:
  language: tl
  text: Sinabi nila, “Mabuti ang kalagayan[a] ng aming ama, na iyong lingkod; buhay pa siya.” Pagkatapos, yumukod sila at nagpatirapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kapayapaan” (shalom), na ginagamit dito bilang pagtukoy sa mabuting kalagayan o kapakanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Mabuti ang kalagayan
  rationale: Idyomatikong tumutukoy rito sa mabuting kalagayan o kapakanan bilang tugon sa pangungumusta; mas natural ito sa modernong Tagalog kaysa sa literal na “kapayapaan.”
- source_word: לְעַבְדְּךָ
  choice: iyong lingkod
  rationale: Magalang at mapagpakumbabang pagtukoy kay Jacob sa harap ng isang nakatataas; hindi kailangang ipakahulugang alipin sa kontekstong ito.
- source_word: לְאָבִינוּ
  choice: aming ama
  rationale: Tuwirang pinananatili ang pagmamay-aring anyo at ang ugnayan ng mga nagsasalita kay Jacob.
- source_word: עוֹדֶנּוּ חָי
  choice: buhay pa siya
  rationale: Natural na Tagalog na nagpapanatili sa diwang patuloy pa siyang nabubuhay.
- source_word: וַיִּקְּדוּ
  choice: yumukod sila
  rationale: Malinaw na inilalarawan ang pagyuko o pagbaba ng katawan.
- source_word: וישתחו
  choice: nagpatirapa
  rationale: Ipinahahayag ang mas malalim na pisikal na pagpapatirapa bilang paggalang kay Jose, nang hindi ipinahihiwatig ang pagsamba sa Diyos.
theological_decisions:
- issue: Kahulugan ng kilos na וישתחו
  choice: nagpatirapa
  alternative: sumamba; yumukod
  rationale: Ang konteksto ay pagpupugay sa isang nakatataas, hindi relihiyosong pagsamba. Pinananatili rin ng “nagpatirapa” ang kaibhan nito sa naunang kilos na pagyuko.
translation_notes:
  register: 'Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “iyong lingkod na aming ama” upang malinaw na ang ama nila ang tinatawag nilang lingkod ng kausap, at pinanatili ang dalawang magkaugnay ngunit magkaibang kilos: pagyuko at pagpapatirapa.'
