base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/030.yaml
  text: Then Joseph hurried[a], because his compassion for his brother was stirred, and he sought a place to weep[b]. He entered the room and wept there.
translation:
  language: tl
  text: Nagmamadali si Jose, sapagkat labis na naantig ang kanyang damdamin para sa kanyang kapatid[a], at humanap siya ng lugar upang umiyak[b]. Pumasok siya sa silid at doon umiyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na tumutukoy ang idyomang Hebreo sa kanyang mga “habag” na lubhang naantig o nag-alab; nagpapahayag ito ng matinding damdamin para sa kanyang kapatid.
    reason: lexical_alternative
  - marker: b
    text: O, “ninais niyang umiyak.” Mas literal na sinasabi ng Hebreo, “hinanap niyang umiyak”; ang paghahanap ng lugar ay ipinahihiwatig ng konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: Nagmamadaling umalis
  rationale: Ang pandiwa ay nangangahulugang magmadali. Ipinahihiwatig ng kasunod na pagpasok niya sa silid na mabilis siyang umalis sa harap ng iba, bagaman hindi tahasang nakasaad sa Hebreo ang 'umalis'; kaya minarkahan ang pagpapalinaw.
- source_word: נִכְמְרוּ רַחֲמָיו
  choice: nag-umapaw ang kanyang habag
  rationale: Ang idyoma ay literal na tumutukoy sa matinding pagkilos o pag-init ng mga habag. Ang 'nag-umapaw ang kanyang habag' ay natural sa Filipino at nagpapanatili sa tindi ng damdamin.
- source_word: אֶל אָחִיו
  choice: sa kanyang kapatid
  rationale: Tinutukoy ng parirala ang taong pinatutungkulan ng habag ni Jose nang hindi idinaragdag ang pangalang Benjamin.
- source_word: וַיְבַקֵּשׁ לִבְכּוֹת
  choice: Humanap siya ng lugar na maiiyakan
  rationale: Mas literal na 'hinangad niyang umiyak,' ngunit sa konteksto ay naghahanap siya ng pribadong lugar upang umiyak. Ginagawang malinaw ng salin ang ipinahihiwatig na lugar at minarkahan ito sa talababa.
- source_word: הַחַדְרָה
  choice: sa silid
  rationale: Ang חֶדֶר ay silid o panloob na kuwarto. Ang 'silid' ay malinaw, dignificado, at likas sa modernong Filipino.
- source_word: וַיֵּבְךְּ שָׁמָּה
  choice: at doon umiyak
  rationale: Pinananatili ng 'doon' ang lokatibong diin ng שָׁמָּה, at ang 'umiyak' ang karaniwang katumbas ng pandiwa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang 'Jose,' 'habag,' at 'silid' bilang mga salitang madaling maunawaan ngunit angkop sa salaysay ng Kasulatan; iniwasan ang arkaikong idyomang nakabatay sa mga panloob na bahagi ng katawan.
