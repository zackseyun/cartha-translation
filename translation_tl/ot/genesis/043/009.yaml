    issue: Posibleng maling unawa sa “Sa akin mo siya hahanapin.”
    rationale: Sa modernong Filipino, maaari itong unawain bilang ‘hanapin mo siya sa kinaroroonan ko’ kaysa ‘hingin o panagutin mo siya mula sa akin.’ Ang Hebreong idyoma ay tumutukoy sa paghingi ng pananagutan kay Juda.
  revised_text: Ako mismo ang mananagot para sa kanya. Sa akin mo siya hihingin. Kung hindi ko siya maihatid sa iyo at maiharap sa iyo, magkakasala ako sa iyo habang-buhay.[a]
