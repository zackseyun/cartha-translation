base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/009.yaml
  text: I myself will guarantee him. From my hand you may require him. If I do not bring him to you and set him before you[a], then I will bear the blame to you all my days.
translation:
  language: tl
  text: Ako mismo ang mananagot para sa kanya. Sa akin mo siya hihingin. Kung hindi ko siya maihatid sa iyo at maiharap sa iyo, magkakasala ako sa iyo habang-buhay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Mananagot ako sa iyo habang-buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Ako mismo
  rationale: Ang hiwalay na panghalip ay nagbibigay-diin na personal na inaako ni Juda ang pananagutan.
- source_word: אֶֽעֶרְבֶ֔נּוּ
  choice: ang mananagot para sa kanya
  rationale: Ipinahihiwatig ng ערב ang pagiging panagot o garantiya para sa isang tao; natural at malinaw ito sa modernong Filipino.
- source_word: מִיָּדִי תְּבַקְשֶׁנּוּ
  choice: Sa akin mo siya hahanapin
  rationale: Pinananatili nito ang konkretong idyoma ng pananagutan, habang natural pa rin sa Filipino ang diwang si Juda ang sisingilin tungkol kay Benjamin.
- source_word: הֲבִיאֹתִיו אֵלֶיךָ
  choice: maihatid sa iyo
  rationale: Ang hiphil ng בוא ay ‘dalhin’; ang ‘maihatid’ ay natural sa konteksto at hindi tahasang nagdaragdag ng ‘pabalik.’
- source_word: וְהִצַּגְתִּיו לְפָנֶיךָ
  choice: at maiharap sa iyo
  rationale: Tumpak na ipinapahayag ang pagdadala at personal na paghaharap kay Benjamin sa kanyang ama.
- source_word: וְחָטָאתִי לְךָ
  choice: magkakasala ako sa iyo
  rationale: Pinananatili ang karaniwang moral na lakas ng חטא at ang tuwirang kaugnayan ng pagkakasala kay Jacob, sa halip na paliitin ito sa simpleng ‘masisisi.’
- source_word: כָּל הַיָּמִים
  choice: habang-buhay
  rationale: Natural na katumbas sa Filipino ng panghabambuhay na tagal na tinutukoy ng parirala.
theological_decisions:
- issue: Kahulugan ng וְחָטָאתִי לְךָ sa isang personal na pangako ng pananagutan
  choice: magkakasala ako sa iyo
  alternative: habambuhay akong mananagot sa iyo
  rationale: Bagaman may legal at relasyonal na diwa ang pahayag, חטא ang karaniwang pandiwa para sa pagkakasala. Pinananatili ng salin ang moral na bigat at tensiyon ng Hebreo; inilalagay sa talababa ang mas kontekstuwal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mananagot” para sa pagiging garantiya at pinanatili ang “magkakasala” sa huling sugnay upang huwag mapawi ang moral na lakas ng Hebreo.
