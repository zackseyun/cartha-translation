base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/029.yaml
  text: He lifted up his eyes and saw Benjamin[a], his brother, his mother's son, and said, “Is this your youngest brother, of whom you spoke to me?” Then he said, “May God be gracious to you, my son.”
translation:
  language: tl
  text: Tumingala siya at nakita niya si Benjamin, ang kapatid niya na anak din ng kanyang ina.[a] Sinabi niya, “Ito ba ang bunso ninyong kapatid na binanggit ninyo sa akin?” Pagkatapos ay sinabi niya, “Nawa’y pagpakitaan ka ng Diyos ng kagandahang-loob, anak ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang literal na paglalarawang “ang kapatid niya na anak din ng kanyang ina” ay nagdiriin na iisa ang ina nina Jose at Benjamin.
    reason: Paglilinaw sa diin ng pariralang Hebreo at sa ugnayan ng magkapatid.
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Tumingala siya
  rationale: Natural na katumbas sa modernong Tagalog ng Hebreong idyomang literal na ‘itinaas niya ang kanyang mga mata’; pinananatili ang kilos nang hindi nagiging alanganin ang pananalita.
- source_word: וַיַּרְא
  choice: at nakita
  rationale: Tuwirang isinasalin ang ראה bilang aktuwal na pagkakita kay Benjamin.
- source_word: אֶת בִּנְיָמִין
  choice: si Benjamin
  rationale: Ginagamit ang karaniwang anyo ng pangalan sa Tagalog at ang angkop na pantukoy para sa pangalan ng tao.
- source_word: אָחִיו בֶּן אִמּוֹ
  choice: ang kapatid niyang anak ng kanyang ina
  rationale: Pinananatili ang appositional na paglalarawan sa Hebreo upang idiin na pareho ang ina nina Joseph at Benjamin, sa halip na paikliin ito bilang ‘buong kapatid.’
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: ang bunso ninyong kapatid
  rationale: Sa konteksto, ang הַקָּטֹן ay tumutukoy sa pinakabata sa magkakapatid, hindi lamang sa mas bata o maliit.
- source_word: אֲשֶׁר אֲמַרְתֶּם אֵלָי
  choice: na binanggit ninyo sa akin
  rationale: Natural sa Tagalog at malinaw na tumutukoy sa naunang pagsasalaysay ng magkakapatid tungkol kay Benjamin, habang nananatiling malapit sa payak na pandiwang ‘sinabi’ sa Hebreo.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang salin ng pangkalahatang katawagan sa Diyos sa kontekstong ito.
- source_word: יָחְנְךָ
  choice: pagpakitaan ka ng Diyos ng kagandahang-loob
  rationale: Inihahayag ang diwa ng חנן na magpakita ng mapagbiyayang pabor. Mas tiyak ito kaysa sa pangkalahatang ‘pagpalain’ at hindi ito nililimitahan sa awa lamang.
- source_word: בְּנִי
  choice: anak ko
  rationale: Pinananatili ang magiliw na panawag; malinaw na lalaki si Benjamin sa konteksto kahit natural sa Tagalog ang anyong ‘anak ko.’
theological_decisions:
- issue: Pormula ng pagpapala na gumagamit ng אֱלֹהִים
  choice: Nawa’y pagpakitaan ka ng Diyos ng kagandahang-loob, anak ko.
  alternative: Pagpakitaan ka ng Diyos ng kagandahang-loob, anak ko.
  rationale: Ipinahahayag ng ‘Nawa’y’ ang jussive o panalanging-hiling ng Hebreo nang hindi nagdaragdag ng doktrinal na nilalaman.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang sobrang literal na ‘itinaas ang mga mata’ at ang mas malawak na ‘pagpalain,’ habang pinanatili ang natatanging diin ng Hebreong paglalarawan kay Benjamin.
