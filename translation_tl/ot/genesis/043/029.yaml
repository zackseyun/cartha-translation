  to: Tumingala siya at nakita niya si Benjamin, ang kapatid niya na anak din ng kanyang ina.[a] Sinabi niya, “Ito ba ang bunso ninyong kapatid na binanggit ninyo sa akin?” Pagkatapos ay sinabi niya, “Nawa’y pagpakitaan ka ng Diyos ng kagandahang-loob, anak ko.”
