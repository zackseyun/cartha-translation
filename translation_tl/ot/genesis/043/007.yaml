base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/007.yaml
  text: They said, “The man questioned us closely about us and about our family, saying, ‘Is your father still alive? Do you have another brother?’ So we told him according to these words. How could we possibly know that he would say, ‘Bring your brother down’?”
translation:
  language: tl
  text: Sumagot sila, “Masusi kaming tinanong ng lalaki tungkol sa amin at sa aming pamilya. Sinabi niya, ‘Buhay pa ba ang inyong ama? May kapatid pa ba kayong lalaki?’ Kaya sinagot namin siya ayon sa mga tanong na iyon. Paano namin malalaman na sasabihin niya, ‘Dalhin ninyo rito ang inyong kapatid’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁאוֹל שָׁאַל
  choice: Masusi kaming tinanong
  rationale: Ang pag-uulit ng pandiwa sa Hebreo ay nagpapalakas sa diwa ng pagtatanong; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “masusi.”
- source_word: מוֹלַדְתֵּנוּ
  choice: aming pamilya
  rationale: Sa konteksto, tumutukoy ito sa angkan o mga kamag-anak na pinagmulan nila; “pamilya” ang pinakanatural at madaling maunawaang katumbas.
- source_word: עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: ayon sa mga tanong na iyon
  rationale: Literal itong “ayon sa mga salitang/bagay na ito,” ngunit sa konteksto ay ang mga tanong na kababanggit lamang ang kanilang sinagot.
- source_word: הוֹרִידוּ
  choice: Isama ninyo rito
  rationale: Literal na “pababain ninyo,” dahil ang paglalakbay patungong Ehipto ay inilalarawang pagbaba. Inihahatid ng “isama ninyo rito” ang nilalayong kilos sa natural na Tagalog nang hindi nagmumungkahi ng pisikal na pagpapababa.
