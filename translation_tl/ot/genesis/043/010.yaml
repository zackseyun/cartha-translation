  language: tl
  text: Sapagkat kung hindi tayo nag-antala[a], sa ngayon ay nakabalik na sana tayo nang dalawang beses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagtagal” o “nag-atubili.” Ang pandiwang Hebreo ay maaaring mangahulugang magtagal, mag-antala, o mag-atubili.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bumalik kami nang dalawang ulit.” Idyoma ito na nangangahulugang “nakabalik na sana tayo nang dalawang beses.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala ng unang כִּי ang paliwanag ni Juda sa kaniyang ama; natural at malinaw itong ipinahahayag ng “Sapagkat.”
- source_word: לוּלֵא
  choice: kung hindi
  rationale: Nagsasaad ito ng kondisyong salungat sa nangyari; ang “kung hindi” kasama ng “sana” sa kasunod na sugnay ang natural na anyo nito sa Tagalog.
- source_word: הִתְמַהְמָהְנוּ
  choice: tayo nagtagal
  rationale: Maaaring tumukoy ang pandiwa sa pag-antala, pananatili nang matagal, o pag-aatubili. Ang “nagtagal” ay natural sa konteksto at hindi labis na nililinaw kung sinadya ang pagkaantala.
- source_word: כִּי עַתָּה
  choice: na sana
  rationale: Sa loob ng kondisyong salungat sa nangyari, ipinahihiwatig ng parirala na natapos na sana ang pagbabalik bago ang kasalukuyang sandali. Natural itong naipapahayag sa “nakabalik na sana” nang hindi inuulit nang pilit ang כִּי.
- source_word: שַׁבְנוּ
  choice: nakabalik na sana tayo
  rationale: Bagaman ganap na anyo ang pandiwang Hebreo, ang kontrapaktuwal na balangkas ay nangangailangan sa Tagalog ng “sana” upang ipahayag ang resultang maaari sanang natapos.
- source_word: זֶה פַעֲמָיִם
  choice: nang dalawang ulit
  rationale: Idyoma itong nangangahulugang “dalawang beses” o “makalawang ulit.” Pinananatili ng “dalawang ulit” ang bilang habang nananatiling natural sa makabagong Tagalog.
