  text: Then he washed his face[a], came out, controlled himself, and said, “Serve the food.”
translation:
  language: tl
  text: Pagkatapos, naghilamos siya, lumabas, nagtimpi, at sinabi, “Ihain ninyo ang pagkain[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tinapay”; dito, malamang na tumutukoy ito sa pagkain o sa buong handang ihahain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְחַץ פָּנָיו
  choice: naghugas siya ng mukha
  rationale: Ang רָחַץ ay karaniwang nangangahulugang ‘maghugas.’ Natural sa Filipino ang ‘naghugas ng mukha’ at angkop ito sa konteksto matapos siyang umiyak nang sarilinan.
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Tuwirang ipinapahayag ng ‘lumabas’ ang pag-alis ni Jose sa silid na pinuntahan niya upang umiyak.
- source_word: וַיִּתְאַפַּק
  choice: pinigil niya ang sarili niya
  rationale: Ipinapakita ng anyong hitpael ng אפק ang pagpipigil sa sarili matapos ang matinding damdamin. Pinananatili ng salin ang diin sa kusang pagpipigil nang hindi tinutukoy nang higit sa teksto kung aling damdamin ang pinigil.
- source_word: שִׂימוּ
  choice: Ihain ninyo
  rationale: Literal itong ‘ilagay,’ ngunit sa konteksto ng pagkain, ang utos ay ihain o ilapag ang pagkain sa harap ng mga kakain. Ang ‘ihain ninyo’ ang natural na katumbas sa Filipino.
- source_word: לָחֶם
  choice: pagkain
  rationale: Bagaman pangunahing nangangahulugang ‘tinapay,’ malimit gamitin ang לֶחֶם para sa pagkain o kainan sa mas malawak na diwa. Sa kontekstong ito, ang ‘pagkain’ ay malinaw at natural.
