revisions:
- from: Nang makarating kami sa lugar na tinutuluyan at buksan namin ang aming mga sako, naroon ang pilak ng bawat isa sa bunganga ng kani-kaniyang sako—ang aming pilak ayon sa eksaktong timbang nito. Kaya dinala namin itong muli rito sa aming mga kamay.
  to: Nang makarating kami sa lugar na tinutuluyan at binuksan namin ang aming mga sako, naroon ang pilak ng bawat isa sa bunganga ng kani-kaniyang sako—ang aming pilak ayon sa eksaktong timbang nito. Ibinalik namin ito, na dala namin sa aming kamay.
  rationale: Inayos ang pandiwang pasalaysay, inalis ang hindi nakasaad na “Kaya” at “rito,” at pinanatili ang idyomang “sa aming kamay.” Nanatili ang mga pangunahing leksikal na pagpili ng draft at ang diin na ang natagpuang pilak ay ang buong eksaktong natimbang na halaga.
