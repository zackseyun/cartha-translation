  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
translation:
  language: tl
  text: Nang makarating kami sa lugar na tinutuluyan at binuksan namin ang aming mga sako, naroon ang pilak ng bawat isa sa bunganga ng kani-kaniyang sako—ang aming pilak ayon sa eksaktong timbang nito. Ibinalik namin ito, na dala namin sa aming kamay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמָּלוֹן
  choice: lugar na tinutuluyan
  rationale: Tumutukoy ito sa isang lugar na pinagpapahingahan sa magdamag habang naglalakbay, hindi kinakailangang isang komersiyal na πανuluyan.
- source_word: אַמְתְּחֹתֵינוּ / אַמְתַּחְתּוֹ
  choice: mga sako / kani-kaniyang sako
  rationale: Ang salita ay tumutukoy sa sako para sa butil o paglalakbay; ang distributibong 'kani-kaniyang' ay malinaw at natural sa Filipino.
- source_word: וְהִנֵּה
  choice: naroon
  rationale: Ipinahahayag ang bigla at kapansin-pansing pagkakatuklas sa natural na salaysay sa Filipino.
- source_word: כֶּסֶף אִישׁ
  choice: ang pilak ng bawat isa
  rationale: Pinananatili ang tahasang 'pilak' at ang distributibong kahulugan ng אִישׁ.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: sa bunganga ng kani-kaniyang sako
  rationale: Pinananatili ang malinaw at nauunawaang larawang Hebreo na gumagamit ng 'bunganga' para sa bukana ng sisidlan.
- source_word: בְּמִשְׁקָלוֹ
  choice: ayon sa eksaktong timbang nito
  rationale: Ipinakikita na ang ibinalik na pilak ay ang mismong halagang tinimbang, nang walang kulang.
- source_word: וַנָּשֶׁב אֹתוֹ בְּיָדֵנוּ
  choice: dinala namin itong muli rito sa aming mga kamay
  rationale: Isinasalin ang pagbabalik ng pilak sa kasalukuyang lugar ng pag-uusap at pinananatili ang idyomang 'sa aming mga kamay.'
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang konkretong 'pilak,' 'bunganga ng sako,' at 'mga kamay,' ngunit inayos ang pangungusap ayon sa likas na daloy ng Tagalog.
