- source_word: וְהָרָעָב
  choice: At ... ang taggutom
  rationale: Ang רָעָב ay tumutukoy sa taggutom sa kontekstong ito. Pinanatili ang וְ bilang “At” upang ipakita ang pagpapatuloy ng salaysay nang hindi nagdaragdag ng di-hayag na panandang temporal.
- source_word: כָּבֵד
  choice: matindi
  rationale: Literal itong “mabigat,” ngunit kapag inilalarawan ang taggutom, natural na ipinapahayag ng “matindi” ang tindi o kalubhaan nito sa makabagong Tagalog.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Ang אֶרֶץ dito ay ang lupain o rehiyong apektado, hindi ang buong daigdig. Ang “sa lupain” ay likas at angkop sa konteksto.
