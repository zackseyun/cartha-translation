  text: If you will send our brother with us[a], we will go down and buy food for you.
translation:
  language: tl
  text: Kung pasasamahin mo sa amin ang kapatid namin[a], bababa kami at bibili ng pagkain para sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung handa mong pasamahin sa amin ang kapatid namin.” Ang idyomang Hebreo na gumagamit ng יֵשׁ at participle ay maaaring tumukoy sa kahandaang gawin ang isang bagay, gayundin sa mismong paggawa nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Karaniwang panandang kondisyon ito at hindi nagdaragdag ng diin na wala sa Hebreo.
- source_word: יֶשְׁךָ מְשַׁלֵּחַ
  choice: isasama mo sa amin
  rationale: Natural sa modernong Tagalog ang pariralang ito para sa pagpapahintulot at pagpapadala sa kapatid na sumama sa kanila; pinananatili sa talababa ang posibleng diin sa kahandaan o kagustuhan.
- source_word: אֶת אָחִינוּ אִתָּנוּ
  choice: ang kapatid namin ... sa amin
  rationale: Tuwirang ipinapahayag ang ugnayang pampamilya at ang kinakailangang pagsama niya sa kanila.
- source_word: נֵרְדָה
  choice: bababa kami
  rationale: Ipinahahayag ng cohortative sa kondisyunal na pangungusap ang pasiya o nilalayong pagkilos; ang hinaharap na anyo ay natural sa Tagalog.
- source_word: וְנִשְׁבְּרָה
  choice: at bibili
  rationale: Sa konteksto ng pagkuha ng panustos, ang pandiwa ay nangangahulugang bumili.
- source_word: לְךָ
  choice: para sa iyo
  rationale: Pinananatili ang diwa ng pakinabang o pagkilos alang-alang sa kausap.
- source_word: אֹכֶל
  choice: pagkain
  rationale: Mas malawak ito kaysa 'butil' at tumutugma sa pangkalahatang pangngalang Hebreo.
