lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: lumapit sila
  rationale: Likas sa makabagong Filipino at malinaw na ipinapahayag ang pagkilos papunta sa isang tao.
- source_word: הָאִישׁ
  choice: lalaki
  rationale: Pinananatili ang payak na katawagan ng Hebreo sa halip na idagdag ang mas tiyak na tungkuling gaya ng katiwala.
- source_word: אֲשֶׁר עַל בֵּית יוֹסֵף
  choice: namamahala sa sambahayan ni Jose
  rationale: Ipinahihiwatig ng עַל ang awtoridad o pangangasiwa; ang “sambahayan” ay tumutukoy sa buong kaayusang pantahanan, hindi lamang sa gusali.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: kinausap siya
  rationale: Natural na salaysay sa Filipino na naghahanda sa tuwirang sinabi nila sa kasunod na talata.
- source_word: פֶּתַח הַבָּיִת
  choice: sa pasukan ng bahay
  rationale: Saklaw ng פֶּתַח ang pasukan o pintuan; malinaw ang “pasukan” at hindi nito labis na tinutukoy kung nasa mismong bungad o pintuan sila.
