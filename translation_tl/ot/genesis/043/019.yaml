  text: So they approached the man who was over Joseph’s household and spoke to him at the entrance of the house,[a]
translation:
  language: tl
  text: Kaya lumapit sila sa lalaking namamahala sa sambahayan ni Jose at kinausap siya sa pasukan ng bahay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pintuan ng bahay.”
