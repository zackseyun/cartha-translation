base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/032.yaml
  text: So they served him by himself[a], and them by themselves, and the Egyptians who ate with him by themselves, because the Egyptians could not eat bread with the Hebrews, for that is an abomination to the Egyptians.
translation:
  language: tl
  text: Kaya naghain sila para sa kanya nang hiwalay, para sa kanila nang hiwalay, at para sa mga Ehipsiyong kumakain kasama niya nang hiwalay. Sapagkat hindi maaaring kumain ng tinapay kasama ng mga Hebreo[a] ang mga Ehipsiyo, sapagkat kasuklam-suklam iyon sa mga Ehipsiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kumain ng tinapay kasama ng” ay idyomang Hebreo para sa pagsasalo sa pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: inihain nila ang pagkain
  rationale: Literal itong “inilagay nila,” ngunit sa konteksto ng hapag ay tumutukoy sa paghahain o paglalagay ng pagkain. Likas at malinaw sa Tagalog ang “inihain nila ang pagkain.”
- source_word: לְבַדּוֹ / לְבַדָּם
  choice: nang bukod
  rationale: Pinananatili nito ang tatlong ulit na diin sa magkakahiwalay na paghahain at pagkain.
- source_word: הָאֹכְלִים אִתּוֹ
  choice: kumakain kasama niya
  rationale: Isinasalin ang Hebreong participle sa likas na kasalukuyang paglalarawan sa loob ng salaysay.
- source_word: לֹא יוּכְלוּן
  choice: hindi maaaring
  rationale: Maaaring tumukoy ang anyo sa praktikal o panlipunang imposibilidad, hindi lamang sa pisikal na kawalan ng kakayahan.
- source_word: לֶאֱכֹל אֶת הָעִבְרִים לֶחֶם
  choice: kumain ng tinapay kasama ng mga Hebreo
  rationale: Pinananatili ang kongkretong Hebreong pananalita habang ipinaliliwanag sa talababa na idyoma ito para sa pagsasalo sa pagkain.
- source_word: תוֹעֵבָה
  choice: kasuklam-suklam
  rationale: Malakas ngunit natural na katumbas ito para sa isang bagay na itinuturing na lubhang di-katanggap-tanggap o nakaririmarim sa kulturang tinutukoy.
- source_word: הַמִּצְרִים / הָעִבְרִים
  choice: mga Egipcio / mga Hebreo
  rationale: Karaniwang modernong katawagan ang mga ito at malinaw na pinananatili ang etnikong paghihiwalay na sentro ng talata.
