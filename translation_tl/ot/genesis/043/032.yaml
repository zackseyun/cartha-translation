    rationale: Tahasang inuulit ng Hebreo ang 'mga Ehipsiyo'; ang pag-uulit nito sa Filipino ay nagpapalinaw sa saklaw ng kasuklam-suklam na kaugalian.
  - severity: low
    issue: '''Egipcio'' ang baybay ng etnonym.'
    rationale: '''Ehipsiyo'' ang mas karaniwan at mas angkop na modernong Filipino baybay.'
