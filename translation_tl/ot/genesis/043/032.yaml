translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “nang bukod” upang maihatid ang diin ng Hebreo sa panlipunang paghihiwalay, habang iniwasang tukuyin sa pangalan ang mga panghalip na sadyang panghalip din sa pinagmulang teksto.
