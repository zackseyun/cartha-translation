    issue: Hindi gaanong natural ang paulit-ulit na 'nang bukod.'
    rationale: Bagaman nauunawaan, mas idiomatiko ang 'nang hiwalay' para sa magkakahiwalay na paghahain o pagkain.
  - severity: low
