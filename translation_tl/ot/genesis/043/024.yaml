base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/024.yaml
  text: The man brought the men into Joseph’s house and gave them water[a], and they washed their feet[c][b]; then he gave fodder to their donkeys.
translation:
  language: tl
  text: Dinala ng lalaki[a] ang mga lalaki papasok sa bahay ni Jose, at binigyan niya sila ng tubig; naghugas sila ng kanilang mga paa. Pagkatapos, binigyan niya ng pakain ang kanilang mga asno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang lalaki” at “ang mga lalaki.” Hindi tahasang tinutukoy sa talatang ito ang lalaki bilang katiwala ni Jose o ang mga lalaki bilang mga kapatid ni Jose, bagaman malinaw ito sa konteksto.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Dinala
  rationale: Ang Hifil ng בוא ay nagpapahayag na pinapasok o dinala ng lalaki ang iba; natural sa Filipino ang “dinala” at napananatili nito ang diwang causative.
- source_word: הָאִישׁ / הָאֲנָשִׁים
  choice: ang lalaki / ang mga lalaki
  rationale: Pinananatili ang karaniwang katawagan ng Hebreo sa halip na tahasang tukuyin sila bilang katiwala at mga kapatid, kahit malinaw ang mga pagkakakilanlang iyon sa konteksto.
- source_word: בֵּיתָה יוֹסֵף
  choice: sa loob ng bahay ni Jose
  rationale: Ipinahihiwatig ng directional he sa בֵּיתָה ang pagpasok sa bahay, hindi lamang pagpunta rito.
- source_word: וַיִּתֶּן מַיִם וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: binigyan sila ng tubig upang maghugas ng kanilang mga paa
  rationale: 'Aktibong maramihan ang וַיִּרְחֲצוּ: ang mga lalaki mismo ang naghugas. Ang “upang” ay natural na nag-uugnay sa pagbibigay ng tubig at sa layon nito nang hindi ginagawang tagapaghugas ang lalaki.'
- source_word: מִסְפּוֹא
  choice: pagkain
  rationale: Sa konteksto ng mga asno, malinaw na tumutukoy ito sa pakain ng hayop; ang “pagkain” ay mas karaniwan at natural kaysa “pakain” o teknikal na “kumpay.”
- source_word: לַחֲמֹרֵיהֶם
  choice: ang kanilang mga asno
  rationale: Sa Filipino, natural na ipahayag ang hayop bilang tumatanggap sa konstruksyong “binigyan ... ng pagkain,” habang pinananatili ang pag-aari ng mga lalaki.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Pinanatili ang paulit-ulit na “lalaki/mga lalaki” upang hindi magdagdag ng mga pagkakakilanlang hindi tahasang binanggit sa Hebreo. Ginamit ang “sa loob” upang maipakita ang direksiyong ipinahihiwatig ng anyong Hebreo.
