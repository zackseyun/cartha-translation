revisions:
- from: Dinala ng lalaki ang mga lalaki sa loob ng bahay ni Jose at binigyan sila ng tubig upang maghugas ng kanilang mga paa.[a] Pagkatapos, binigyan niya ng pagkain ang kanilang mga asno.[b]
  to: Dinala ng lalaki[a] ang mga lalaki papasok sa bahay ni Jose, at binigyan niya sila ng tubig; naghugas sila ng kanilang mga paa. Pagkatapos, binigyan niya ng pakain ang kanilang mga asno.
  rationale: Inalis ang “upang” upang mapanatili ang payak na pagkakasunod ng mga kilos sa Hebreo at ang aktibong pagligo/paghuhugas ng mga lalaki mismo. Pinalitan ang “pagkain” ng “pakain” upang malinaw na tumukoy sa pagkain ng mga asno. Iningatan ang generic na “lalaki” at “mga lalaki,” at pinanatili ang tala upang hindi ipagkamaling tahasang tinukoy ng talata ang kanilang mga papel o pagkakakilanlan.
