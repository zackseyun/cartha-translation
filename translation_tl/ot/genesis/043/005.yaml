  text: וְ/אִם אֵינְ/ךָ֥ מְשַׁלֵּ֖חַ לֹ֣א נֵרֵ֑ד כִּֽי הָ/אִ֞ישׁ אָמַ֤ר אֵלֵ֨י/נוּ֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/005.yaml
  text: But if you will not send him[a], we will not go down, because the man said to us, ‘You will not see my face unless your brother is with you.’
translation:
  language: tl
  text: Ngunit kung hindi mo siya ipadadala, hindi kami bababa, sapagkat sinabi sa amin ng lalaki, “Hindi ninyo makikita ang aking mukha[a] malibang kasama ninyo ang inyong kapatid.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “makikita ang aking mukha” ay isang idyomang Hebreo na nangangahulugang humarap sa isang tao o pumaroon sa presensya niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ng pang-ugnay ang pagsalungat sa naunang kondisyon sa talata 4; natural itong ipinahahayag sa makabagong Tagalog bilang “Ngunit kung.”
- source_word: אֵינְךָ מְשַׁלֵּחַ
  choice: hindi mo siya ipadadala
  rationale: Ang negatibong konstruksyon na may participle ay tumutukoy sa balak o pagtangging magpadala. Idinagdag ang “siya” ayon sa konteksto, na tumutukoy kay Benjamin, bagaman walang tahasang layon sa Hebreo.
- source_word: לֹא נֵרֵד
  choice: hindi kami bababa
  rationale: Pinananatili ng “bababa” ang karaniwang heograpikong paglalarawan sa paglalakbay mula Canaan patungong Ehipto.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ito ng dahilan kung bakit hindi sila bababa; ang “sapagkat” ay malinaw at marangal sa salaysay.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Ganito tinutukoy ni Juda si Jose, na hindi pa nila nakikilala bilang kanilang kapatid. Hindi idinaragdag sa salin ang impormasyong wala sa pananaw ng nagsasalita.
- source_word: אָמַר אֵלֵינוּ
  choice: sinabi sa amin
  rationale: Tuwirang katumbas ito ng pariralang Hebreo at maayos na nagpapakilala sa tuwirang pagsasalita.
- source_word: לֹא תִרְאוּ פָנַי
  choice: Hindi ninyo makikita ang aking mukha
  rationale: Pinananatili ang larawan ng orihinal na idyoma, na nangangahulugang humarap o pumaroon sa presensya ng isang tao; nililinaw ito sa talababa.
- source_word: בִּלְתִּי
  choice: malibang
  rationale: Ipinahahayag nito ang kinakailangang kondisyon at natural na katumbas ng “unless” sa pormal ngunit madaling maunawaang Tagalog.
- source_word: אֲחִיכֶם
  choice: ang inyong kapatid
  rationale: Hindi pinapangalanan ng Hebreo si Benjamin; pinananatili ng salin ang gayong pagtukoy at hinahayaang ang konteksto ang kumilala sa kaniya.
- source_word: אִתְּכֶם
  choice: kasama ninyo
  rationale: Natural nitong ipinahahayag sa Tagalog ang panaguring walang pandiwa sa Hebreo.
theological_decisions: []
