    issue: Hindi idiomatiko at hindi ganap na malinaw ang “Isama mo sa akin ang binata.”
    rationale: Ang karaniwang “isama” ay nangangailangan ng mas malinaw na ayos kapag ang kahulugan ay ‘ipadalang kasama ng isang tao.’ Maaaring mabasa ang kasalukuyang anyo bilang di-likas na ‘include [him] to me.’ Ang “Ipasama mo sa akin ang binata” ay natural na nagpapahayag na ipadadala ng ama ang binata upang samahan si Juda.
