  text: וַ/יֹּ֨אמֶר יְהוּדָ֜ה אֶל יִשְׂרָאֵ֣ל אָבִ֗י/ו שִׁלְחָ֥/ה הַ/נַּ֛עַר אִתִּ֖/י וְ/נָק֣וּמָה וְ/נֵלֵ֑כָה וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת גַּם אֲנַ֥חְנוּ גַם אַתָּ֖ה גַּם טַפֵּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/008.yaml
  text: And Judah said to Israel his father[a], “Send the boy with me, and let us arise and go, so that we may live and not die—both we and you and our little ones.”
translation:
  language: tl
  text: At sinabi ni Juda kay Israel na kanyang ama, “Ipasama mo sa akin ang binata[a]. Tayo na at umalis, upang mabuhay tayo at hindi mamatay—kami, ikaw, at ang aming maliliit na anak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kabataang lalaki.” Ang Hebreong נַעַר (na‘ar) ay maaaring tumukoy sa isang kabataan o binata, hindi lamang sa isang batang paslit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Ipinagpapatuloy ng waw-consecutive ang salaysay; natural sa Tagalog ang “At sinabi” at hindi nito labis na binibigyang-kahulugan ang ugnayan.
- source_word: יִשְׂרָאֵל אָבִיו
  choice: kay Israel na kanyang ama
  rationale: Pinananatili ang pangalang Israel na nasa Hebreo at malinaw na ipinakikitang siya ang ama ni Juda.
- source_word: שִׁלְחָה הַנַּעַר אִתִּי
  choice: Isama mo sa akin ang binata
  rationale: Sa konteksto, ang utos na “ipadala ... kasama ko” ay likas na naipahahayag sa Tagalog bilang “isama mo sa akin,” habang nananatiling malinaw na sasamahan ni Juda si Benjamin. Ang נער ay maaaring tumukoy sa isang binata, hindi lamang sa batang paslit.
- source_word: וְנָקוּמָה וְנֵלֵכָה
  choice: Tayo na at umalis
  rationale: Ang dalawang cohortative ay panawagan sa sama-samang agarang pagkilos. Ang “Tayo na at umalis” ay likas at kasalukuyang Tagalog, at naihahatid ang diwa ng pagtindig at paglakad nang hindi tunog-salin.
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: upang mabuhay tayo at hindi mamatay
  rationale: Ipinahahayag ng pagkakasunod ang layunin o inaasahang bunga ng pag-alis; pinananatili ang mariing pagtutunggali ng buhay at kamatayan.
- source_word: גַּם אֲנַחְנוּ גַם אַתָּה גַּם טַפֵּנוּ
  choice: kami, ikaw, at ang aming maliliit na anak
  rationale: Pinananatili ang tatlong saklaw na binibigyang-diin ng inuulit na גם. “Kami” ang angkop dahil kinakausap ni Juda ang amang hindi kabilang sa grupong tinutukoy niya bilang “kami.”
- source_word: טַפֵּנוּ
  choice: ang aming maliliit na anak
  rationale: Ang טף ay tumutukoy sa maliliit at umaasang mga anak ng sambahayan; ipinananatili ng salin ang kanilang pagiging mahina at nangangailangan ng pag-iingat.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “binata” sa pangunahing teksto upang maiwasang magmukhang maliit na bata si Benjamin, habang inilagay sa talababa ang saklaw ng salitang Hebreo. Ang “Tayo na at umalis” ay idiomatikong naghahatid sa panawagang agarang kumilos.
