base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/014.yaml
  text: May God Almighty grant you mercy before the man[a], so that he may send back your other brother and Benjamin. And as for me, if I am bereaved[c][b], I am bereaved.
translation:
  language: tl
  text: Ipagkaloob nawa sa inyo ng Diyos na Makapangyarihan sa Lahat na kaawaan kayo ng taong iyon, upang pauwiin niya sa inyo ang isa pa ninyong kapatid[b] at si Benjamin. At ako—kung mawalan ako ng mga anak, mawalan ako.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang “isa pa ninyong kapatid” ay si Simeon, na pinigil sa Ehipto.
    reason: cross_reference
  - marker: c
    text: Maaari ring “kung mawalan ako, mawalan ako.” Inuulit sa Hebreo ang iisang pandiwa upang idiin ang pagtanggap ni Jacob sa maaaring pagkawala ng kanyang mga anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: Diyos na Makapangyarihan sa Lahat
  rationale: Isinasalin ang titulong banal sa malinaw at kinagawiang modernong Tagalog sa halip na transliterasyong maaaring maging malabo.
- source_word: יִתֵּן לָכֶם רַחֲמִים לִפְנֵי הָאִישׁ
  choice: Ipagkaloob nawa sa inyo ... ang habag ng taong iyon
  rationale: Ang רַחֲמִים ay habag o awa; ipinahahayag ng buong parirala ang dalanging kahabagan sila ng opisyal. Ang 'taong iyon' ay natural na tumutukoy sa lalaking nabanggit na sa salaysay.
- source_word: וְשִׁלַּח לָכֶם
  choice: upang payagan niyang makabalik sa inyo
  rationale: Ipinagpapatuloy nito ang hangarin o panalangin at ipinahihiwatig sa konteksto ang pagpapalaya at pagbabalik ng mga kapatid.
- source_word: אֶת אֲחִיכֶם אַחֵר
  choice: ang isa pa ninyong kapatid
  rationale: Pinananatili ang di-tahasang pagkakakilanlan sa pangunahing teksto; ayon sa konteksto, ito ay si Simeon.
- source_word: וַאֲנִי
  choice: At ako—
  rationale: Ipinakikita ng nakahiwalay na panghalip ang mariing paglipat tungo sa personal na pagtanggap ni Jacob sa maaaring mangyari.
- source_word: כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי
  choice: kung mawalan man ako ng mga anak, mawalan na ako
  rationale: Ang pag-uulit ng pandiwang שׁכל ay pinananatili sa natural na Tagalog at nagpapahayag ng masakit ngunit matatag na pagtanggap sa posibleng pagkawala.
theological_decisions:
- issue: Pagsasalin sa banal na titulong אֵל שַׁדַּי
  choice: Diyos na Makapangyarihan sa Lahat
  alternative: El Shaddai
  rationale: Ang makabuluhang pagsasalin ng titulo ay mas madaling maunawaan at hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Lakas ng pahayag ni Jacob tungkol sa pagkawala
  choice: kung mawalan man ako ng mga anak, mawalan na ako
  alternative: yamang nawalan na ako, nawalan na ako
  rationale: Pinananatili ang karaniwang pagkaunawa rito bilang pagtanggap sa posibleng mangyayari, habang ang pag-uulit ay nagpapanatili ng tensiyon at diin ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'nawa' para sa panalangin at ang 'mawalan na ako' upang maipahayag ang matinding pagtanggap nang hindi nagiging lipas o labis na pormal.
