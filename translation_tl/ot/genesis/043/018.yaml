translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal, na may natural na salaysay at tuwirang pananalita. Ginamit ang ‘alipin’ sa halip na ‘lingkod’ upang mapanatili ang sapilitang kalagayang tinutukoy. Ang [a] ay inilagay kaagad pagkatapos ng mahirap na idyomatikong parirala.
