source:
  edition: WLC
  text: וַ/יִּֽירְא֣וּ הָֽ/אֲנָשִׁ֗ים כִּ֣י הֽוּבְאוּ֮ בֵּ֣ית יוֹסֵף֒ וַ/יֹּאמְר֗וּ עַל דְּבַ֤ר הַ/כֶּ֨סֶף֙ הַ/שָּׁ֤ב בְּ/אַמְתְּחֹתֵ֨י/נוּ֙ בַּ/תְּחִלָּ֔ה אֲנַ֖חְנוּ מֽוּבָאִ֑ים לְ/הִתְגֹּלֵ֤ל עָלֵ֨י/נוּ֙ וּ/לְ/הִתְנַפֵּ֣ל עָלֵ֔י/נוּ וְ/לָ/קַ֧חַת אֹתָ֛/נוּ לַ/עֲבָדִ֖ים וְ/אֶת חֲמֹרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/018.yaml
  text: The men were afraid because they had been brought into Joseph’s house[a], and they said, “It is because of the money that was returned in our sacks the first time that we are being brought in, so that he may make a pretext against us and fall upon us and take us as servants, along with our donkeys.”
translation:
  language: tl
  text: Natakot ang mga lalaki dahil dinala sila sa bahay ni Jose. Sinabi nila, “Dinala tayo rito dahil sa perang ibinalik sa ating mga sako sa unang pagkakataon, upang maghanap ng maidadahilan laban sa atin[a], salakayin tayo, at kunin tayo bilang mga alipin, pati ang ating mga asno.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang maghanap ng pagkakataon laban sa atin.” Ang Hebreong idyoma ay mahirap tiyakin at maaaring tumukoy sa paghahanap o paglikha ng dahilan laban sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: Natakot
  rationale: Likas na modernong Tagalog para sa salaysay na tugon ng takot; malinaw na ipinapahayag ang damdaming bunga ng pagdadala sa kanila sa bahay.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaki
  rationale: Tiyak na tumutukoy sa mga lalaking nasa pangkat, lalo na sa mga kapatid ni Jose.
- source_word: כִּי הוּבְאוּ בֵּית יוֹסֵף
  choice: nang dalhin sila sa bahay ni Jose
  rationale: Ang Hophal ng בוא ay pasibong sanhi, ‘ipinasok/dinala’; ang ‘nang’ ay natural sa Tagalog at maaaring magpahiwatig ng kalagayan o dahilan nang hindi nagpapabigat sa pangungusap.
- source_word: עַל דְּבַר הַכֶּסֶף
  choice: dahil sa perang
  rationale: Sa konteksto, ang parirala ay nagsasaad ng dahilan o sanhi ng kanilang hinala.
- source_word: הַשָּׁב בְּאַמְתְּחֹתֵינוּ
  choice: ibinalik sa ating mga sako
  rationale: Pinananatili ang resultative/passive na diwa ng שוב at ang kahulugang sisidlan ng butil o panlakbay ng אַמְתַּחַת.
- source_word: בַּתְּחִלָּה
  choice: noong una
  rationale: Natural na tumutukoy sa naunang paglalakbay o unang pagkakataon sa salaysay.
- source_word: אֲנַחְנוּ מוּבָאִים
  choice: Dinala tayo rito
  rationale: Inihahayag ang pasibong pagdadala at nililinaw ng ‘rito’ na sa bahay ni Jose ang patutunguhan, gaya ng agarang konteksto.
- source_word: לְהִתְגֹּלֵל עָלֵינוּ
  choice: upang humanap siya ng maidadahilan laban sa atin
  rationale: Ang mahirap na idyoma ay nagpapahiwatig ng paghahanap o paglikha ng pagkakataon o paratang laban sa kanila; iniiwasan ang di-natural na literal na ‘gumulong sa ibabaw natin.’
- source_word: וּלְהִתְנַפֵּל עָלֵינוּ
  choice: salakayin tayo
  rationale: Malinaw at kasalukuyang Tagalog para sa mapanlabang pagkilos na ipinahihiwatig ng נפל hitpael na may עַל.
- source_word: וְלָקַחַת אֹתָנוּ לַעֲבָדִים
  choice: kunin tayo bilang mga alipin
  rationale: Tumpak na ipinapakita ang sapilitang kalagayan ng pagkaalipin, hindi lamang karaniwang paglilingkod.
- source_word: וְאֶת חֲמֹרֵינוּ
  choice: pati ang ating mga asno
  rationale: Ang ‘pati’ ay natural na nagdurugtong sa karagdagang bagay na kinatatakutan nilang kukunin.
