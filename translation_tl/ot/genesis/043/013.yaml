translation:
  language: tl
  text: Isama rin ninyo ang inyong kapatid[a]. Bumangon kayo at bumalik sa lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “inyong kapatid”; si Benjamin ang tinutukoy sa konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/אֶת
  choice: isama
  rationale: Hindi isinasalin nang hiwalay ang pantukoy sa tuwirang layon; ang prefiks na וְ ay may dagdag na diwa rito. Likas na naipahahayag ito sa Filipino sa pandiwang “isama.”
- source_word: אֲחִי/כֶם
  choice: ang inyong kapatid
  rationale: Pinananatili ang literal na “inyong kapatid” at hindi idinaragdag sa pangunahing teksto ang pangalang Benjamin, bagaman siya ang tinutukoy sa konteksto.
- source_word: קָחוּ
  choice: isama ninyo
  rationale: Ang pautos na maramihan ng לקח ay “kunin/dalhin.” Sa konteksto ng paglalakbay kasama ang kapatid, “isama ninyo” ang pinakanatural na Filipino habang pinananatili ang diwa ng pagkuha sa kaniya upang sumama.
- source_word: וְ/ק֖וּמוּ
  choice: humayo kayo
  rationale: Literal na “bumangon kayo,” ngunit sa ganitong sunod-sunod na utos ang קום ay panandang naghihikayat na kumilos at umalis. Ang “humayo kayo” ay marangal at natural, nang hindi ito lubusang inaalis.
- source_word: שׁ֥וּבוּ
  choice: bumalik
  rationale: 'Tuwirang ipinahahayag ang kahulugan ng שוב sa paglalakbay: bumalik sa dati nang pinuntahan.'
- source_word: אֶל הָ/אִישׁ
  choice: sa lalaki
  rationale: Pinananatili ang karaniwang kahulugan ng אֶל bilang “sa” at ang tiyak ngunit hindi pinangalanang הָאִישׁ bilang “ang lalaki.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang maramihang “ninyo/kayo” ayon sa mga pandiwang pautos na maramihan sa Hebreo. Hinati sa dalawang pangungusap upang maging natural ang daloy, samantalang inilalahad sa talababa ang mas literal na pagkakasunod ng mga pautos.
