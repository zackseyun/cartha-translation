  text: And they said[a], “Please, my lord[b], we came down the first time to buy food.”
translation:
  language: tl
  text: At sinabi nila, “Pakiusap po, panginoon[a], talagang[b] bumaba kami noong una upang bumili ng pagkain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “panginoon” dito ay magalang na tawag sa isang taong nakatataas, hindi titulo para sa Diyos.
    reason: cultural_note
  - marker: b
    text: 'Idiniriin ng anyong Hebreo ang kanilang pagbaba: “talagang bumaba kami.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: At sinabi nila
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng waw-consecutive nang hindi dinaragdagan ang pagkakasunod-sunod.
- source_word: בִּי
  choice: Nakikiusap po kami
  rationale: Magalang na pakiusap ang gamit dito; ang “po” at anyong maramihan ay natural na nagpapahayag ng pagpapakumbaba sa modernong Tagalog.
- source_word: אֲדֹנִי
  choice: panginoon
  rationale: Magalang na tawag ito sa isang nakatataas na tao. Pinananatili nito ang mataas na antas ng paggalang, habang nililinaw sa talababa na hindi ito banal na titulo.
- source_word: יָרֹד יָרַדְנוּ
  choice: talagang bumaba kami rito
  rationale: Ang infinitive absolute na kasunod ng pandiwang may panahunan ay nagbibigay-diin sa kilos; likas na naihahatid ito ng “talagang” sa Tagalog.
- source_word: בַּתְּחִלָּה
  choice: noong una
  rationale: Sa konteksto, tumutukoy ito sa una nilang paglalakbay, hindi sa isang abstraktong pasimula.
- source_word: לִשְׁבָּר
  choice: upang bumili
  rationale: Ang pandiwa ay tumutukoy sa pagkuha ng panustos, karaniwan sa pamamagitan ng pagbili; ang “bumili” ang pinakamaikli at likas na katumbas.
- source_word: אֹכֶל
  choice: pagkain
  rationale: Mas pangkalahatan ang pangngalan kaysa “butil,” kaya hindi ito pinakikitid nang lampas sa mismong sinabi ng talata.
theological_decisions:
- issue: Kung ang אֲדֹנִי ay banal o pantao na titulo
  choice: Isinalin bilang “panginoon” at ipinaliwanag na magalang na tawag sa taong nakatataas.
  alternative: “ginoo” o “amo ko”
  rationale: Ang konteksto ay pakikipag-usap sa katiwala ng sambahayan, hindi pagtukoy sa Diyos; gayunman, pinananatili ng “panginoon” ang antas ng paggalang ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “po” upang likas na maipahayag ang magalang at mapagpakumbabang tono; pinanatili ang diin ng Hebreo sa pamamagitan ng “talagang.”
