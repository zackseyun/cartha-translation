  naturalness: Mas likas at tuwirang magalang ang “Pakiusap po, panginoon” kaysa “Nakikiusap po kami.” Ang huli ay ginagawang tahasang maramihang pahayag ang idiomatikong pakiusap na בִּי. Ang binagong pangungusap ay nananatiling makabago at marangal ang rehistro.
