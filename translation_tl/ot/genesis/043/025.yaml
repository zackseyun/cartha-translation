  yaml_path: translation/ot/genesis/043/025.yaml
  text: And they prepared the gift until Yosef came at noon[a], because they had heard that they would eat bread there.
translation:
  language: tl
  text: At inihanda nila ang regalo hanggang sa dumating si Yosef nang tanghali, sapagkat nabalitaan nilang kakain sila ng tinapay doon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kakain ng tinapay,” isang idyoma para sa pagsasalo sa pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: inihanda nila
  rationale: Ang Hiphil ng כון ay nangangahulugang ihanda o gawing handa ang isang bagay; tuwiran at natural ang “inihanda nila.”
- source_word: הַמִּנְחָה
  choice: ang regalo
  rationale: Sa kontekstong ito, ang מִנְחָה ay regalong dala para kay Yosef, hindi handog na panrelihiyon.
- source_word: עַד בּוֹא יוֹסֵף
  choice: hanggang sa dumating si Yosef
  rationale: Ipinapahayag ng עַד kasama ng infinitive construct ang pagpapatuloy hanggang sa pagdating ni Yosef.
- source_word: בַּצָּהֳרָיִם
  choice: nang tanghali
  rationale: Karaniwang modernong Tagalog para sa oras na nasa kalagitnaan ng araw.
- source_word: כִּי שָׁמְעוּ
  choice: sapagkat nabalitaan nila
  rationale: Sanhi ang unang כִּי, at ipinahihiwatig ng pandiwa na ang impormasyong ito ay natanggap na nila bago sila naghanda.
- source_word: כִּי שָׁם
  choice: na ... doon
  rationale: Ipinakikilala ng ikalawang כִּי ang nilalaman ng kanilang nabalitaan, habang lokasyon ang שָׁם.
- source_word: יֹאכְלוּ לָחֶם
  choice: kakain sila ng tinapay
  rationale: Pinananatili ang literal na larawang Hebreo, habang nililinaw sa talababa na maaari itong maging idyoma para sa pagsasalo sa pagkain.
- source_word: יוֹסֵף
  choice: Yosef
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa halip na gamitin ang tradisyonal na anyong hango sa ibang wika.
