  text: And they sat before him[a], the firstborn according to his birthright and the youngest according to his youth[b], and the men looked at one another in astonishment.
translation:
  language: tl
  text: Umupo sila sa harap niya, ayon sa pagkakasunod-sunod ng kanilang kapanganakan, mula sa panganay hanggang sa bunso; at nagtinginan ang mga lalaki sa pagtataka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Umupo sila
  rationale: Aktibo ang anyong Hebreo at payak na nagsasalaysay na umupo ang mga lalaki; hindi ginawang pasibo kahit ipinahihiwatig ng konteksto na inayos ang kanilang mga puwesto.
- source_word: לְפָנָיו
  choice: sa harap niya
  rationale: Likas at tuwirang katumbas ng panandang panlunan, na tumutukoy kay Jose.
- source_word: הַבְּכֹר כִּבְכֹרָתוֹ
  choice: mula sa panganay ayon sa pagkapanganay nito
  rationale: Pinananatili ng “panganay” at “pagkapanganay” ang ugnayang leksikal sa Hebreo; sa kontekstong ito, ang diwa ay pagkakaayos ayon sa pagkakasunod-sunod ng kapanganakan.
- source_word: וְהַצָּעִיר כִּצְעִרָתוֹ
  choice: hanggang sa bunso ayon sa pagkabunso nito
  rationale: Ang “bunso” ang likas na Filipino para sa pinakabata sa magkakapatid, at ang “pagkabunso” ay kaagapay ng naunang “pagkapanganay” habang inilalarawan ang hanay ayon sa edad.
- source_word: וַיִּתְמְהוּ
  choice: nagtinginan ... sa labis na pagtataka
  rationale: Ipinahahayag ng pandiwa ang matinding pagtataka; isinama sa pandiwang “nagtinginan” ang tumbasang kilos na ipinahihiwatig ng kasunod na idyoma.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaki
  rationale: Pinananatili ang tahasang katawagan sa Hebreo sa halip na palitan ito ng interpretatibong “magkakapatid.”
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: nagtinginan
  rationale: Likas na ipinapahayag sa Filipino ng anyong magka-/nag- ang tumbasang diwa ng “bawat isa sa kaniyang kasama.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na natural ngunit marangal. Ginamit ang “panganay” at “bunso,” na karaniwang katawagan sa pagkakasunod ng magkakapatid, at pinanatili sa “ayon sa pagkapanganay/pagkabunso” ang magkatambal na anyo ng Hebreo nang hindi ipinapasok ang mas makitid na teolohikal o legal na pakahulugan ng “karapatan ng panganay.”
