- from: Kaya kinuha ng mga lalaki ang regalong ito at nagdala sila ng dobleng halaga ng salapi, pati si Benjamin. Pagkatapos, tumindig sila, bumaba patungong Ehipto,[a] at humarap kay Jose.
  to: Kaya kinuha ng mga lalaki ang regalong ito, ang dobleng halaga ng salapi, at si Benjamin. Pagkatapos ay bumangon sila, bumaba sa Ehipto,[a] at humarap kay Jose.
  rationale: Inihanay ang regalo, dobleng salapi, at si Benjamin bilang mga tahasang layon ng “kinuha,” alinsunod sa estruktura at saklaw ng Hebreo. Pinalitan ang “tumindig” ng mas natural na “bumangon,” habang pinanatili ang “bumaba” at ang talababa upang maipakita ang heograpikong idyoma.
