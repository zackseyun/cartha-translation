base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/015.yaml
  text: So the men took this gift[a], and they took double the money in their hand, and Benjamin[d][c][b]. Then they arose and went down to Egypt and stood before Joseph.
translation:
  language: tl
  text: Kaya kinuha ng mga lalaki ang regalong ito, ang dobleng halaga ng salapi, at si Benjamin. Pagkatapos ay bumangon sila, bumaba sa Ehipto,[a] at humarap kay Jose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “bumaba sa Ehipto,” isang karaniwang heograpikong pananalita para sa paglalakbay mula Canaan patungong Ehipto.
    reason: cultural_note
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: regalo
  rationale: Sa salaysay na ito, tumutukoy ito sa mga produktong dinadala bilang handog na pampalubag-loob sa isang nakatataas, hindi sa handog na panrelihiyon. Likas at malinaw sa modernong Tagalog ang “regalo.”
- source_word: מִשְׁנֶה כֶּסֶף
  choice: dobleng halaga ng salapi
  rationale: Ipinahihiwatig ng parirala ang halagang dalawang ulit ng naunang salapi; nililinaw ng “halaga” na dami ng pera ang tinutukoy.
- source_word: כֶּסֶף
  choice: salapi
  rationale: Literal itong “pilak,” ngunit sa kontekstong transaksiyonal ay ginagamit bilang pera o pambayad.
- source_word: בְיָדָם
  choice: nagdala sila
  rationale: Ang literal na “sa kanilang kamay” ay idyomang Hebreo para sa bagay na taglay o dala. Ang pandiwang “nagdala” ay natural sa Tagalog at naipapahayag ang tungkulin ng idyoma.
- source_word: וְאֶת בִּנְיָמִן
  choice: pati si Benjamin
  rationale: Isinasama ng pang-ugnay at pananda sa layon si Benjamin sa mga dinala nila. Ang “pati” ay malinaw at natural, at iniiwasang ituring siyang isang bagay.
- source_word: וַיָּקֻמוּ
  choice: tumindig sila
  rationale: Pinananatili nito ang literal na kilos ng pagbangon bago ang paglalakbay, bagaman maaari rin itong magpahiwatig ng paghahandang umalis.
- source_word: וַיֵּרְדוּ מִצְרַיִם
  choice: bumaba patungong Ehipto
  rationale: Pinananatili ang karaniwang heograpikong idyoma ng Hebreo para sa paglalakbay mula Canaan patungong Ehipto.
- source_word: וַיַּעַמְדוּ לִפְנֵי יוֹסֵף
  choice: humarap kay Jose
  rationale: Ang literal na “tumayo sa harap ni Jose” ay karaniwang pahayag para sa pagharap o pagharap sa presensiya ng isang pinuno; mas natural sa Tagalog ang “humarap kay Jose.”
- source_word: הָאֲנָשִׁים
  choice: mga lalaki
  rationale: Ito ang tahasang tawag ng tekstong Hebreo; hindi ito pinalitan ng kontekstuwal na “magkakapatid.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginawang natural ang idyomang “sa kanilang kamay” bilang “nagdala,” habang pinanatili sa pangunahing teksto ang heograpikong larawang “bumaba.”
