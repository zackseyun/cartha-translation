  naturalness: Hindi likas ang sunod na "nagdala ... na dala namin," sapagkat inuulit nito ang parehong ideya sa loob ng isang parirala. Mas malinaw at natural ang tuwirang "nagdala rin kami rito ng karagdagang pilak."
