  text: And we have brought down other silver in our hands to buy food[c][b][a]. We do not know who put our silver in our sacks.
translation:
  language: tl
  text: At nagdala rin kami rito ng karagdagang pilak[a] upang ipambili ng pagkain.[b] Hindi namin alam kung sino ang naglagay ng aming pilak sa aming mga sako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “salapi” sa dalawang paglitaw ng “pilak”; ang Hebreong כֶּסֶף ay maaaring tumukoy sa metal na pilak o sa salaping ginagamit na pambayad.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “upang ipambili ng butil.” Sa kontekstong ito, maaaring tumukoy ang pananalita sa pagbili ng butil, bagaman mas malawak ang pangngalang “pagkain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֶסֶף אַחֵר
  choice: At ... karagdagang pilak
  rationale: Ang כֶּסֶף ay maaaring tumukoy sa pilak bilang metal o sa salaping pilak. Pinanatili ang “pilak” upang makita ang kongkretong salita at ang pag-uulit nito sa talata; ang אַחֵר ay natural na “karagdagang” sa kontekstong may naunang halagang pinag-uusapan.
- source_word: הוֹרַדְנוּ
  choice: nagdala ... rito
  rationale: Ang Hiphil ng ירד ay literal na “magpababa/magdala pababa,” at ang paglalakbay patungong Ehipto ay inilalarawang pagbaba sa Genesis. Mas natural sa modernong Tagalog ang “nagdala rito”; inililinaw ng “rito” ang pagdadala sa kasalukuyang lugar.
- source_word: בְ/יָדֵ/נוּ
  choice: na dala namin
  rationale: Literal itong “sa aming kamay,” isang idyomang Hebreo para sa bagay na nasa pag-iingat o pag-aari. Ang “dala namin” ay likas na katumbas sa Tagalog at hindi nagpapahiwatig na iisang pisikal na kamay lamang ang tinutukoy.
- source_word: לִ/שְׁבָּר אֹכֶל
  choice: para ipambili ng pagkain
  rationale: Sa kontekstong ito, ang שׁבר ay pagbili ng panustos o butil, samantalang ang אֹכֶל ay mas malawak na “pagkain.” Ang “ipambili ng pagkain” ay malinaw at natural.
- source_word: לֹא יָדַעְנוּ
  choice: Hindi namin alam
  rationale: Ang Hebreong perfect dito ay maaaring magpahayag ng kasalukuyang kalagayan ng hindi pagkaalam. Ang pangkasalukuyang anyo ang natural sa tuwirang pahayag.
- source_word: מִי שָׂם
  choice: kung sino ang naglagay
  rationale: Natural nitong inililipat sa Tagalog ang di-tuwirang tanong at ang karaniwang kahulugan ng שׂים na “ilagay.”
- source_word: כַּסְפֵּ/נוּ
  choice: aming pilak
  rationale: Pinanatili ang “pilak” upang tumugma sa unang כֶּסֶף at maipakita ang pag-uulit sa Hebreo.
- source_word: בְּ/אַמְתְּחֹתֵי/נוּ
  choice: sa aming mga sako
  rationale: Ang אַמְתַּחַת ay sako o sisidlang ginagamit sa pagdadala ng butil at panustos; ang “mga sako” ang pinakanaaangkop sa tagpo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “karagdagang” at “ipambili” para sa likas na daloy, habang pinanatili sa pangunahing teksto ang “pilak” at ipinaliwanag sa talababa ang posibilidad na “salapi.”
