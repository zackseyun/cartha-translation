translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kami” upang mapanatili ang eksklusibong unang panauhan at ang “ninyo” para sa maramihang kausap sa siniping babala. Pinanatili sa pangunahing teksto ang idyomang “makikita ang aking mukha,” na may paliwanag sa talababa.
