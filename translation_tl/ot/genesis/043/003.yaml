  text: Then Judah said to him[a], “The man solemnly warned us, saying[b], ‘You shall not see my face unless your brother is with you.’”
translation:
  language: tl
  text: At sinabi ni Juda sa kanya, “Mahigpit[a] kaming binalaan ng lalaking iyon, ‘Hindi ninyo makikita ang aking mukha[b] malibang kasama ninyo ang inyong kapatid.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Mariin kaming binalaan” o “Mahigpit niyang iginiit sa amin.” Inuulit sa Hebreo ang anyo ng pandiwa upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: Ang “makikita ang aking mukha” ay maaari ring mangahulugang “makakaharap ako” o “makapapakita sa harapan ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Ipinagpapatuloy ng waw-consecutive ang salaysay, ngunit sa konteksto ay sumasalungat ang tugon ni Juda sa naunang pakiusap ni Jacob; natural sa Filipino ang “Ngunit sinabi.”
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Tumutukoy kay Jacob, na siyang kinakausap ni Juda.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyo ng pangalang Judah sa makabagong saling Tagalog ng Bibliya.
- source_word: הָעֵד הֵעִד
  choice: Mahigpit kaming binalaan
  rationale: Ang infinitive absolute na kasama ng finite verb ay nagbibigay-diin sa babala; malinaw at natural na ipinahahayag ito ng “mahigpit ... binalaan.”
- source_word: בָּנוּ
  choice: kami
  rationale: Ang unang panauhang maramihan ay tumutukoy kay Juda at sa kanyang mga kapatid; sa Filipino, “kami” ang angkop dahil hindi kabilang ang kausap na si Jacob.
- source_word: הָאִישׁ
  choice: ang lalaking iyon
  rationale: Tumutukoy sa opisyal na Ehipsiyo na dati nilang nakaharap; pinananatili ang payak na katawagang “lalaki,” habang nililinaw ng “iyon” na partikular siyang tinutukoy.
- source_word: לֹא תִרְאוּ פָנַי
  choice: Hindi ninyo makikita ang aking mukha
  rationale: Pinananatili ang matingkad at literal na idyomang Hebreo, na maaari ring mangahulugang hindi sila maaaring humarap sa kanya.
- source_word: בִּלְתִּי
  choice: malibang
  rationale: Likas at dignified na Filipino para sa kundisyong “unless.”
- source_word: אֲחִיכֶם
  choice: ang inyong kapatid
  rationale: Isahan ang pangngalan na may hulaping maramihan at tumutukoy kay Benjamin.
- source_word: אִתְּכֶם
  choice: kasama ninyo
  rationale: Natural na Filipino para sa pariralang kondisyonal na “with you”; nauunawaan na ang pandiwang “ay” kahit hindi tahasang ilagay.
