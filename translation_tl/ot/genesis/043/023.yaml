  to: Sinabi niya, “Kapayapaan sa inyo. Huwag kayong matakot. Ang Diyos ninyo at ang Diyos ng inyong ama ang nagbigay sa inyo ng kayamanan[a] sa inyong mga sako. Dumating sa akin ang inyong pilak[b].” Pagkatapos, inilabas niya si Simeon at dinala siya sa kanila.
