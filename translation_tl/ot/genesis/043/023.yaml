base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/023.yaml
  text: He said[a], “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks[b]. Your silver came to me.” Then he brought Simeon out to them.
translation:
  language: tl
  text: Sinabi niya, “Kapayapaan sa inyo. Huwag kayong matakot. Ang Diyos ninyo at ang Diyos ng inyong ama ang nagbigay sa inyo ng kayamanan[a] sa inyong mga sako. Dumating sa akin ang inyong pilak[b].” Pagkatapos, inilabas niya si Simeon at dinala siya sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakatagong kayamanan.”
    reason: lexical_alternative
  - marker: b
    text: O “salapi.” Ang salitang Hebreo para sa “pilak” ay madalas ding tumukoy sa salapi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם לָכֶם
  choice: Kapayapaan sa inyo
  rationale: Pinananatili nito ang pangunahing diwa ng שָׁלוֹם at ang maikli ngunit marangal na pagpapalakas-loob sa Hebreo.
- source_word: אַל תִּירָאוּ
  choice: Huwag kayong matakot
  rationale: Likas at tuwirang salin ito ng maramihang negatibong utos.
- source_word: אֱלֹהֵיכֶם וֵאלֹהֵי אֲבִיכֶם
  choice: Ang Diyos ninyo at ang Diyos ng inyong ama
  rationale: Tumutukoy ang אֱלֹהִים dito sa iisang Diyos, at isahan ang ‘ama’ sa Hebreo; kapuwa pinanatili sa salin.
- source_word: נָתַן לָכֶם
  choice: ang nagbigay sa inyo
  rationale: Ang hulma ng pangungusap ay malinaw na iniuugnay sa Diyos ang pagbibigay, habang natural ang aspektong ganap sa Filipino.
- source_word: מַטְמוֹן
  choice: kayamanan
  rationale: Ipinahihiwatig ng salita ang isang bagay na mahalaga at nakatago o nakalagak. Ang ‘kayamanan’ ay maikli at natural, samantalang inilalagay sa talababa ang tahasang diwa ng pagkakatago.
- source_word: בְּאַמְתְּחֹתֵיכֶם
  choice: sa inyong mga sako
  rationale: Ang tinutukoy ay mga sisidlang sako para sa butil; ang ‘mga sako’ ay angkop sa sinaunang tagpo at madaling maunawaan.
- source_word: כַּסְפְּכֶם בָּא אֵלָי
  choice: Dumating sa akin ang inyong pilak
  rationale: Pinananatili ang kongkretong ‘pilak’ at ang di-karaniwang ngunit malinaw na pahayag na ‘dumating sa akin,’ sa halip na gawing ‘natanggap ko’ at bawasan ang anyo ng Hebreo.
- source_word: וַיּוֹצֵא אֲלֵהֶם אֶת שִׁמְעוֹן
  choice: Pagkatapos, inilabas niya si Simeon at dinala sa kanila
  rationale: Ipinahahayag ng Hiphil ng יצא ang pagpapalabas o pagdadala palabas. Ang buong parirala ay isinalin nang natural upang mapanatili kapuwa ang direksiyon palabas at ang paglapit sa mga kapatid.
theological_decisions:
- issue: Ang pagtukoy ng katiwala sa Diyos
  choice: Tuwirang tumutukoy ang pananalita sa Diyos ng magkakapatid at sa Diyos ng kanilang ama, nang walang pahayag tungkol sa sariling pananampalataya ng katiwala.
  alternative: Ituring ang sinabi bilang pakikibagay lamang sa kanila, o bilang tiyak na katibayan ng ganap na personal na pananampalataya ng katiwala.
  rationale: Iniulat ng Hebreo ang sinabi ng katiwala ngunit hindi ipinaliwanag ang kaniyang panloob na paniniwala. Kaya pinananatili ng salin ang teolohikal na pag-igting nang hindi nagpapasya nang higit sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang ‘kayo/ninyo’ ayon sa kausap, pinanatili ang isahang ‘ama,’ at iniwasan ang labis na pagpapaliwanag sa pangunahing teksto. Inayos ang mga pananda ng talababa upang ang [a] ay tumukoy sa ‘kayamanan’ at ang [b] sa ‘pilak,’ alinsunod sa nilalaman ng mga talababa.
