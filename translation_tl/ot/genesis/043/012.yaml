base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/012.yaml
  text: Take double money in your hand[a], and take back in your hand the money that was returned in the mouth of your sacks[b]; perhaps it was a mistake.
translation:
  language: tl
  text: Magdala kayo ng dobleng halaga ng salapi, at dalhin din ninyo pabalik ang salaping ibinalik sa bunganga ng inyong mga sako[a]. Marahil ay pagkakamali iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, sa bukana ng inyong mga sako.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶסֶף מִשְׁנֶה
  choice: dobleng halaga ng salapi
  rationale: Ipinahahayag ng מִשְׁנֶה kasama ng כֶסֶף ang dalawang ulit na halaga. Mas natural sa modernong Tagalog ang “dobleng halaga ng salapi” kaysa “dobleng salapi,” nang hindi ipinapasiya kung ito ay eksaktong dalawang ulit ng unang bayad o unang halaga kasama ang kapantay na dagdag.
- source_word: קְחוּ בְיֶדְכֶם
  choice: magdala kayo
  rationale: Ang literal na “kunin ninyo sa inyong kamay” ay isang Hebreong idyoma ng pagdadala. Ang “magdala kayo” ang malinaw at likas na katumbas sa Tagalog; hindi kailangang ulitin ang “kamay,” na magiging alanganin dito.
- source_word: הַכֶּסֶף הַמּוּשָׁב
  choice: ang salaping ibinalik
  rationale: 'Ang Hophal participle ay pasibo: ang salapi ay naibalik o naipabalik. Pinananatili ng “ibinalik” ang pasibong diwa at hindi tinutukoy kung sino ang gumawa nito.'
- source_word: בְּפִי אַמְתְּחֹתֵיכֶם
  choice: sa bunganga ng inyong mga sako
  rationale: Ang פִּי ay literal na “bibig/bunganga” at tumutukoy sa bukana ng sisidlan. Pinananatili ng “bunganga” ang kongkretong larawan ng Hebreo; nililinaw sa talababa ang kahulugan.
- source_word: תָּשִׁיבוּ בְיֶדְכֶם
  choice: dalhin din ninyo pabalik
  rationale: Ang Hiphil ng שוב ay “ibalik/dalhin pabalik.” Ang “dalhin ... pabalik” ay likas sa Tagalog at nagpapakita na isasama nila ang salapi sa kanilang paglalakbay; ang “din” ay nagpapalinaw na ito ay karagdagan sa dobleng halaga.
- source_word: אוּלַי
  choice: marahil
  rationale: Tumpak na ipinahahayag ng “marahil” ang kawalang-katiyakan at angkop ito sa marangal ngunit madaling maunawaang rehistro.
- source_word: מִשְׁגֶּה
  choice: pagkakamali
  rationale: Ang salita ay tumutukoy sa kamalian o di-sinasadyang pagkukulang. Ang “pagkakamali” ay malinaw sa konteksto at hindi nagpapahiwatig ng pandaraya o moral na sala.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “salapi” sa halip na mas kolokyal na “pera” upang umangkop sa salaysay. Isinalin nang idyomatiko ang dalawang pagbanggit sa “kamay,” ngunit pinanatili ang matingkad na “bunganga ng mga sako” at nilinaw ito sa talababa.
