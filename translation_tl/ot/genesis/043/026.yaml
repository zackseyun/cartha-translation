  text: וַ/יָּבֹ֤א יוֹסֵף֙ הַ/בַּ֔יְתָ/ה וַ/יָּבִ֥יאּוּ ל֛/וֹ אֶת הַ/מִּנְחָ֥ה אֲשֶׁר בְּ/יָדָ֖/ם הַ/בָּ֑יְתָ/ה וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/026.yaml
  text: When Joseph came into the house[a], they brought to him the gift that was in their hands into the house[c][b], and they bowed down to the ground before him.
translation:
  language: tl
  text: Nang pumasok si Jose sa bahay, dinala nila sa kanya sa loob ng bahay[b] ang regalong[a] hawak nila, at nagpatirapa sila sa lupa sa harap niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog” o “kaloob”; maaari ring mangahulugang “tributo” ang salitang Hebreo ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: 'Dalawang ulit binanggit sa Hebreo ang pagpasok “sa bahay”: una tungkol kay Jose at ikalawa tungkol sa pagdadala ng regalo.'
    reason: source_repetition
lexical_decisions:
- source_word: וַיָּבֹא ... הַבַּיְתָה
  choice: pumasok ... sa bahay
  rationale: Ang pandiwang בוא at ang pangngalang may panandang patungo ay nagsasaad ng pagpasok o pagdating sa bahay; natural sa Tagalog ang “pumasok sa bahay.”
- source_word: וַיָּבִיאוּ לוֹ
  choice: dinala nila sa kanya
  rationale: Ang Hiphil ng בוא ay “dalhin,” at malinaw na si Jose ang pinagdadalhan.
- source_word: הַמִּנְחָה
  choice: regalo
  rationale: Sa kontekstong ito, ang מִנְחָה ay regalong pandiplomasya, hindi handog na panrelihiyon. Ang “regalo” ang pinakakaraniwan at malinaw na salitang Tagalog.
- source_word: אֲשֶׁר בְּיָדָם
  choice: hawak nila
  rationale: Literal itong “nasa kanilang mga kamay.” Ang “hawak nila” ay natural sa Tagalog at nananatili ang kongkretong larawan ng Hebreo.
- source_word: הַבָּיְתָה
  choice: sa loob ng bahay
  rationale: Ipinahihiwatig ng hulaping patungo ang pagdadala paloob sa bahay. Pinanatili rin ang ikalawang pagbanggit sa bahay sa talata.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: nagpatirapa sila sa lupa sa harap niya
  rationale: Ipinapahayag nito ang malalim na pagyukod bilang pagpupugay hanggang sa lupa, nang hindi ipinapalagay na pagsambang panrelihiyon ang kilos.
theological_decisions:
- issue: Kung ang pagpapatirapa kay Jose ay dapat ilarawang pagsamba
  choice: pagpupugay sa pamamagitan ng pagpapatirapa
  alternative: pagsamba
  rationale: Maaaring tumukoy ang שחה sa pagsamba o pagpupugay ayon sa konteksto. Dito, ang kilos ay paggalang sa isang makapangyarihang pinuno, kaya hindi idinagdag ang teolohikal na kahulugang “sumamba.”
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal na himig. Pinanatili ang pag-uulit ng “bahay” mula sa Hebreo, habang ginawang natural ang ayos ng pangungusap.
