  source_fidelity: 'Tumpak ang salin sa mga pangunahing bahagi ng Hebreo: ang pagpasok ni Jose sa bahay, ang pagdadala ng mga kapatid ng regalo sa kanya paloob sa bahay, at ang pagpapatirapa nila sa lupa sa harap niya. Napanatili rin ang dalawang pagbanggit ng direksiyonal na ‘bahay.’'
