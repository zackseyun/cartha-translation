source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יִשְׂרָאֵ֣ל אֲבִי/הֶ֗ם אִם כֵּ֣ן אֵפוֹא֮ זֹ֣את עֲשׂוּ֒ קְח֞וּ מִ/זִּמְרַ֤ת הָ/אָ֨רֶץ֙ בִּ/כְלֵי/כֶ֔ם וְ/הוֹרִ֥ידוּ לָ/אִ֖ישׁ מִנְחָ֑ה מְעַ֤ט צֳרִי֙ וּ/מְעַ֣ט דְּבַ֔שׁ נְכֹ֣את וָ/לֹ֔ט בָּטְנִ֖ים וּ/שְׁקֵדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/011.yaml
  text: 'Then Israel their father said to them[a], “If it must be so, then do this: take some of the choice products of the land in your containers, and carry down to the man a gift—a little balm and a little honey, gum and myrrh[c][b], pistachio nuts and almonds.”'
translation:
  language: tl
  text: 'Sinabi sa kanila ng kanilang amang si Israel, “Kung talagang kailangan, ito ang gawin ninyo: maglagay kayo sa inyong mga sisidlan ng ilan sa pinakamainam na ani ng lupain[a], at dalhin ninyo iyon sa lalaki bilang regalo—kaunting balsamo, kaunting pulot[b], mabangong dagta at mira[c], mga pistachio at almendras.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ilan sa mga piling produkto ng lupain.” Malawak ang saklaw ng pananalitang Hebreo at hindi lamang prutas ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Sa ilang konteksto, ang “pulot” ay maaaring tumukoy sa matamis na arnibal sa halip na pulot-pukyutan.
    reason: lexical_alternative
  - marker: c
    text: Hindi tiyak kung anong mga sangkap ang tinutukoy ng mga salitang Hebreo na isinaling “mabangong dagta” at “mira.” Maaaring kabilang sa mga ito ang iba’t ibang mabangong dagta, gaya ng dagta ng tragacanth o ladanum.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל אֲבִיהֶם
  choice: kanilang amang si Israel
  rationale: Pinananatili ang pangalang Israel sa salaysay at likas sa Tagalog ang ayos na “kanilang amang si Israel.”
- source_word: אִם כֵּן אֵפוֹא
  choice: Kung talagang kailangan
  rationale: Ipinahihiwatig ng parirala ang atubiling pagsang-ayon ni Israel sa hinihingi ng kalagayan, hindi lamang ang payak na “kung gayon.”
- source_word: זֹאת עֲשׂוּ
  choice: ito ang gawin ninyo
  rationale: Tuwiran at natural na pautos sa modernong Tagalog.
- source_word: מִזִּמְרַת הָאָרֶץ
  choice: ilan sa pinakamainam na ani ng lupain
  rationale: Sinasaklaw ng “ani” ang mga piling produktong nagmumula sa lupain at hindi ito nililimitahan sa prutas lamang.
- source_word: בִּכְלֵיכֶם
  choice: sa inyong mga sisidlan
  rationale: Ang salitang Hebreo ay pangkalahatang katawagan sa mga lalagyan; hindi nito tiyak na sinasabing mga supot ang mga iyon.
- source_word: וְהוֹרִידוּ
  choice: dalhin ninyo
  rationale: Malinaw sa konteksto ang pagdadala patungong Ehipto; iniwasan ang hindi likas na “dalhin pababa” sa Tagalog.
- source_word: לָאִישׁ
  choice: sa lalaki
  rationale: Tumutukoy ito sa opisyal na nabanggit na sa salaysay, habang pinananatili ang payak na katawagan ng Hebreo.
- source_word: מִנְחָה
  choice: bilang regalo
  rationale: Sa diplomatikong kontekstong ito, ang “regalo” ay mas natural kaysa “handog,” na maaaring magpahiwatig ng ritwal na gamit.
- source_word: מְעַט צֳרִי
  choice: kaunting balsamo
  rationale: Ang צֳרִי ay karaniwang tumutukoy sa balsamo o nakapagpapagaling na dagta; malinaw at kinikilalang salin ang “balsamo.”
- source_word: וּמְעַט דְּבַשׁ
  choice: kaunting pulot
  rationale: “Pulot” ang karaniwan at malamang na kahulugan, ngunit pinananatili sa talababa ang posibilidad na matamis na arnibal ang tinutukoy.
- source_word: נְכֹאת
  choice: mabangong dagta
  rationale: Hindi tiyak ang halamang pinagmulan; ang pangkalahatang “mabangong dagta” ay malinaw nang hindi nagpapanggap ng botanikong katiyakan.
- source_word: לֹט
  choice: mira
  rationale: Pamilyar na tradisyonal na tawag ang “mira,” ngunit ipinababatid sa talababa na maaaring ibang mabangong dagta, gaya ng ladanum, ang tinutukoy.
- source_word: בָּטְנִים וּשְׁקֵדִים
  choice: mga pistachio at almendras
  rationale: Tumpak at karaniwang modernong katawagan sa dalawang uri ng mani.
