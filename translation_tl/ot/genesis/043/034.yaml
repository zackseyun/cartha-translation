base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/034.yaml
  text: He sent portions to them from before him[a], but Benjamin’s portion was five times as much as all of theirs[c][b]. So they drank and became drunk with him.
translation:
  language: tl
  text: Nagpadala siya sa kanila ng mga bahagi ng pagkain mula sa harap niya[a], ngunit ang bahagi ni Benjamin ay limang beses na mas malaki kaysa sa bahagi ng bawat isa sa kanila[b]. Kaya uminom sila at nalasing kasama niya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa harap niya,” na malamang ay nangangahulugang mula sa sariling puwesto ni Jose sa hapag.
    reason: cultural_note
  - marker: b
    text: Sa literal, “limang kamay,” isang idyomang Hebreo na nangangahulugang limang ulit ang dami.
    reason: lexical_alternative
  - marker: c
    text: Maaari itong isalin nang mas banayad na “nagsaya,” ngunit mas tuwirang nangangahulugang “nalasing” ang pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מַשְׂאֹת
  choice: Nagpadala siya ... ng mga bahagi ng pagkain
  rationale: Sa konteksto ng handaan, ang tambalang pananalita ay tumutukoy sa pagpapadala o pagpapahain ng mga takdang bahagi ng pagkain, hindi sa literal na pagbuhat.
- source_word: מֵאֵת פָּנָיו
  choice: mula sa harap niya
  rationale: Pinananatili ang konkretong larawan ng Hebreo na ‘mula sa harap ng kaniyang mukha,’ habang ipinahihiwatig ng konteksto na galing ang pagkain sa lugar ni Jose sa hapag.
- source_word: מַשְׂאַת בִּנְיָמִן
  choice: ang bahagi ni Benjamin
  rationale: Ang pangngalan ay tumutukoy sa bahagi o takdang hain ng pagkain na ibinigay kay Benjamin.
- source_word: מִמַּשְׂאֹת כֻּלָּם חָמֵשׁ יָדוֹת
  choice: limang ulit ng bahagi ng bawat isa sa kanila
  rationale: Ang literal na ‘limang kamay’ ay idyomang nagsasaad ng limang ulit na dami; ang ‘bawat isa’ ay malinaw na naghahambing sa bahagi ni Benjamin at sa kani-kaniyang bahagi ng iba.
- source_word: וַיִּשְׁתּוּ
  choice: uminom sila
  rationale: Tuwirang salin ng pandiwang nagsasaad ng pag-inom sa handaan.
- source_word: וַיִּשְׁכְּרוּ
  choice: nalasing
  rationale: Karaniwang tuwirang kahulugan ng pandiwa ang pagkalasing; hindi ito pinalalambot bilang simpleng pagsasaya.
- source_word: עִמּוֹ
  choice: kasama niya
  rationale: Pinananatili ang panghalip ng Hebreo; malinaw sa konteksto na tumutukoy ito kay Jose.
theological_decisions: []
