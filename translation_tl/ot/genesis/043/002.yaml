translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “butil” para sa tiyak na panustos na binili sa panahon ng taggutom, samantalang pinanatili ang mas malawak na “pagkain” sa huling parirala. Walang talababa dahil walang mahalagang kalabuan na hindi kayang ipakita ng pangunahing teksto.
