translation:
  language: tl
  text: Nang maubos na nila ang butil na dinala nila mula sa Ehipto, sinabi sa kanila ng kanilang ama, “Bumalik kayo at bumili ng kaunting pagkain para sa atin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Likas na panandang pasalaysay sa modernong Tagalog para sa paglipat sa sumunod na pangyayari, nang hindi mekanikal na isinasalin ang pormulang Hebreo.
- source_word: כִּלּוּ לֶאֱכֹל
  choice: maubos na nilang kainin
  rationale: Ipinahahayag ang pagkakumpleto ng pagkain sa natural na Tagalog at pinananatili ang kaugnayan nito sa butil bilang tuwirang layon.
- source_word: הַשֶּׁבֶר
  choice: ang butil
  rationale: Sa salaysay tungkol kay Jose at sa taggutom, tumutukoy ito sa biniling butil, hindi lamang sa pangkalahatang pagkain.
- source_word: הֵבִיאוּ מִמִּצְרָיִם
  choice: na dinala nila mula sa Ehipto
  rationale: Malinaw na nauna ang pagdadala mula sa Ehipto bago naubos ang butil; natural itong naipakikita ng sugnay na may “na.”
- source_word: אֲבִיהֶם
  choice: kanilang ama
  rationale: Pinananatili ang relasyonal na katawagang ginamit ng Hebreo sa halip na ipalit ang pangalang Jacob.
- source_word: שֻׁבוּ
  choice: Bumalik kayo
  rationale: Tuwirang pautos na nagpapahiwatig ng muling pagpunta sa Ehipto at likas sa modernong Tagalog.
- source_word: שִׁבְרוּ
  choice: bumili
  rationale: Sa kontekstong ito, ang pandiwa ay nangangahulugang bumili ng butil o panustos; hindi na kailangang ulitin ang “butil” dahil kasunod ang layong “pagkain.”
- source_word: לָנוּ
  choice: para sa atin
  rationale: Malinaw at natural na inilalahad ang datibong kahulugang ‘para sa atin,’ kasama ang mga anak na kinakausap ng ama.
- source_word: מְעַט אֹכֶל
  choice: kaunting pagkain
  rationale: Pinananatili ang pangkalahatang salitang “pagkain” at ang maliit na dami na ipinahahayag ng מְעַט.
