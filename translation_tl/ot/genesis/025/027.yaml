base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/027.yaml
  text: When the boys grew up[a], Esau became a skillful hunter, a man of the field, but Jacob was a quiet man[b], dwelling in tents.
translation:
  language: tl
  text: Nang lumaki ang mga batang lalaki, si Esau ay naging mahusay na mangangaso, isang taong namumuhay sa parang[a]. Ngunit si Jacob ay isang taong payapa[b] na naninirahan sa mga tolda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang tao ng parang,” na tumutukoy sa taong namumuhay sa bukas na lupain o bukirin.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring mangahulugang “buo,” “may integridad,” “walang kapintasan,” o “payak,” depende sa konteksto.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּגְדְּלוּ הַנְּעָרִים
  choice: Nang lumaki ang mga batang lalaki
  rationale: Sa konteksto, tumutukoy ito sa paglaki ng kambal tungo sa hustong gulang. Ang “mga batang lalaki” ay tuwirang katumbas at natural sa makabagong Filipino.
- source_word: אִישׁ יֹדֵעַ צַיִד
  choice: mahusay na mangangaso
  rationale: Ang literal na “taong nakaaalam ng pangangaso” ay nagpapahiwatig ng kasanayan; malinaw at likas sa Filipino ang “mahusay na mangangaso.”
- source_word: אִישׁ שָׂדֶה
  choice: isang taong laging nasa parang
  rationale: Literal itong “tao ng parang.” Ipinakikita rito ang nakagawiang buhay ni Esau sa bukas na lupain at pinananatili ang kaibahan sa paninirahan ni Jacob sa mga tolda.
- source_word: אִישׁ תָּם
  choice: isang tahimik na tao
  rationale: Malawak ang saklaw ng תָּם—maaaring tumukoy sa pagiging buo, matuwid, walang kapintasan, payak, o mahinahon. Sa agarang paghahambing sa masiglang buhay ni Esau sa parang, natural ang “tahimik,” habang inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: יֹשֵׁב אֹהָלִים
  choice: naninirahan sa mga tolda
  rationale: Ipinahihiwatig ng participle ang nakagawiang tirahan o pamumuhay. Pinananatili ng “naninirahan sa mga tolda” ang maramihang anyo at ang kaibahan sa buhay ni Esau sa parang.
theological_decisions:
- issue: Kahulugan ng תָּם bilang paglalarawan kay Jacob
  choice: “tahimik,” bilang paglalarawan sa asal o paraan ng pamumuhay
  alternative: “matuwid,” “walang kapintasan,” “payak,” o “buo”
  rationale: Hindi tiyak kung moral na paghatol o paglalarawan sa ugali ang nilalayon. Dahil inihahambing sa konteksto ang buhay ni Esau sa parang at ang buhay ni Jacob sa mga tolda, hindi ginawang tahasang moral na papuri ang pangunahing salin. Gayunman, pinananatili sa talababa ang iba pang lehitimong kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “parang” para sa bukas na lupain at “mga tolda” para sa tuwirang larawan ng tekstong Hebreo. Ang dalawang pananda ng talababa ay kapuwa nakalagay sa pangunahing teksto.
