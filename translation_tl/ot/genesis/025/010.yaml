translation:
  language: tl
  text: ang bukid na binili ni Abraham mula sa mga anak ni Het[a][c]—doon inilibing si Abraham at ang asawa niyang si Sara.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Heteo” sa halip na “mga anak ni Het.” Ang Hebreong pananalita ay literal na nagpapahayag ng ugnayang pampamilya o etniko at maaaring tumukoy sa pangkat ng mga Heteo.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Doon inilibing si Abraham at si Sara na kanyang asawa.”'
    reason: translation_alternative
  - marker: c
    text: 'Maaari ring lagyan ng tuldok pagkatapos ng “mga anak ni Het”: “ang bukid na binili ni Abraham mula sa mga anak ni Het. Doon inilibing…”'
    reason: punctuation_alternative
lexical_decisions:
- source_word: הַשָּׂדֶה
  choice: ang bukid
  rationale: Tiyak na pangngalang tumutukoy sa naunang nabanggit na lupang libingan; ang “bukid” ay tuwiran at likas na katumbas sa konteksto.
- source_word: אֲשֶׁר
  choice: na
  rationale: Likas na pang-ugnay sa modernong Tagalog para sa sugnay na naglalarawan sa “bukid.”
- source_word: קָנָה
  choice: binili
  rationale: Sa konteksto ng transaksiyon sa lupa, malinaw nitong ipinahahayag ang kongkretong kahulugan ng pagbili.
- source_word: מֵאֵת
  choice: mula sa
  rationale: Ipinakikita nito kung kanino binili ang lupa nang hindi ginagawang labis na literal ang Hebreong idyoma.
- source_word: בְּנֵי חֵת
  choice: mga anak ni Het
  rationale: Pinananatili ang literal na anyong pampamilya o pangkat-etniko ng Hebreo at ang kaugnayan sa pangalang Het.
- source_word: שָׁמָּה
  choice: doon
  rationale: Tumutukoy ito pabalik sa bukid bilang lugar ng libingan.
- source_word: קֻבַּר
  choice: inilibing
  rationale: Karaniwan at tuwirang salin ng pasibong pandiwa; sa Tagalog, natural itong magamit para sa tambalang paksa nang walang pagbabago sa bilang.
- source_word: וְשָׂרָה אִשְׁתּוֹ
  choice: at ang asawa niyang si Sara
  rationale: Natural sa modernong Tagalog at malinaw na ipinakikilalang asawa ni Abraham si Sara, bagaman bahagyang inaangkop ang ayos ng mga salita.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang em dash upang iugnay ang paunang paksang “ang bukid…” sa kasunod na sugnay at maiwasan ang putol na pangungusap. Pinanatili ang “mga anak ni Het” sa pangunahing teksto, habang inilagay sa talababa ang mas pangkat-etnikong “mga Heteo.”
