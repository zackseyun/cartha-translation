  yaml_path: translation/ot/genesis/025/032.yaml
  text: Esau said[a], “Look, I am about to die; so what use is this birthright to me?”
translation:
  language: tl
  text: Sinabi ni Esau, “Tingnan mo, mamamatay na ako; kaya ano ang silbi sa akin ng karapatan bilang panganay?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang anyo ito ng pagsasalaysay sa Hebreo. Likas sa makabagong Filipino ang “Sinabi” nang hindi na tahasang isinasalin ang pang-ugnay.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Panawag-pansin ito sa kasunod na pahayag. Pinananatili ng “Tingnan mo” ang puwersa nito sa natural at makabagong Filipino.
- source_word: אָנֹכִי
  choice: ako
  rationale: May diin ang malayang panghalip sa Hebreo, na likas na naipahahayag sa konteksto at sa ayos na “mamamatay na ako.”
- source_word: הוֹלֵךְ לָמוּת
  choice: mamamatay na ako
  rationale: Ipinahihiwatig ng parirala ang paglapit sa kamatayan, hindi kinakailangang literal na paglalakad. Ang “mamamatay na ako” ay likas at pinananatili ang pahayag ng nalalapit na kamatayan.
- source_word: וְלָמָּה זֶּה לִי
  choice: Kaya ano ang kabuluhan sa akin
  rationale: Retorikal na tanong ito tungkol sa pakinabang o halaga ng bagay para kay Esau. Ipinakikita ng “Kaya” ang lohikal na kaugnayan nang hindi dinaragdagan ang kahulugan.
- source_word: בְּכֹרָה
  choice: karapatan bilang panganay
  rationale: Tumutukoy ito sa katayuan at mga pribilehiyong nauukol sa panganay. Mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa payak na “pagkapanganay.”
theological_decisions:
- issue: Kung literal o eksaherado ang pahayag ni Esau na mamamatay siya
  choice: Pinanatili bilang pahayag ng nalalapit na kamatayan nang hindi tinutukoy kung literal o eksaherado ito.
  alternative: Isalin bilang tahasang eksaherasyon dahil sa matinding gutom, o bilang katiyakang nasa bingit talaga siya ng kamatayan.
  rationale: Sinasabi lamang ng Hebreo na siya ay “patungo sa pagkamatay” o “mamamatay na.” Hindi nilulutas ng salin ang tensiyong pangkuwento o moral na hindi nilulutas ng mismong talata.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang malinaw na “karapatan bilang panganay” at iniwasan ang lipas o labis na teknikal na pananalita.
