base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
translation:
  language: tl
  text: Nagtutulakan ang mga anak sa loob niya, at sinabi niya, “Kung ganoon, bakit ako nagkakaganito?[a]” Kaya pumunta siya upang sumangguni kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bakit ako ganito?” Mas literal, “bakit ako?” Bitin ang pahayag sa Hebreo at maaari ring unawain bilang “bakit ako ganito?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
  choice: Nag-agawan
  rationale: Ang hitpael ay nagpapahiwatig ng matindi at gantihang pagkilos ng dalawang batang nasa sinapupunan. Ang “nag-agawan” ay likas sa Tagalog at nagpapanatili ng diwa ng tunggalian nang hindi idinaragdag kung ano mismo ang kanilang pinag-aagawan.
- source_word: הַבָּנִים
  choice: ang mga anak
  rationale: Bagaman maaari itong mangahulugang “mga anak na lalaki,” ang “mga anak” ang mas likas habang nasa sinapupunan pa sila; nililinaw sa kasunod na talata na sila ay mga lalaki.
- source_word: בְּקִרְבָּהּ
  choice: sa loob niya
  rationale: Pinananatili nito ang literal na diwa ng “sa kanyang kaloob-looban” nang hindi tahasang idinaragdag ang “sinapupunan,” na ipinahihiwatig lamang ng konteksto.
- source_word: אִם כֵּן
  choice: Kung ganito
  rationale: Likas itong panimula sa balisang tanong ni Rebekah at malinaw na tumutukoy sa kalagayang nararanasan niya.
- source_word: לָמָּה זֶּה אָנֹכִי
  choice: bakit ako nagkakaganito?
  rationale: Ang Hebreo ay bitin at maaaring unawain sa higit sa isang paraan. Ang saling ito ay natural sa modernong Tagalog at inuugnay ang tanong sa masakit o magulong pagbubuntis, habang itinatala sa talababa ang mas literal na posibilidad.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: upang sumangguni kay Yahweh
  rationale: Sa ganitong konteksto, ang דרש na may personal na layon ay tumutukoy sa paghingi ng banal na paliwanag o patnubay; mas tiyak dito ang “sumangguni” kaysa “hanapin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito sa transliterasyong “Yahweh” sa halip na gawing titulo.
- issue: Kahulugan ng bitin na tanong na לָמָּה זֶּה אָנֹכִי
  choice: bakit ako nagkakaganito?
  alternative: bakit ako? / bakit pa ako nabubuhay?
  rationale: Hindi tiyak ang sintaks. Pinipili ng pangunahing teksto ang kontekstuwal at likas na pagbasa, ngunit hindi nito itinatanggi ang mas literal o mas matinding pagbasa, na inilalahad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nag-agawan” upang ipakita ang gantihang tunggalian, at ang “sumangguni” upang ipahayag ang paghingi ng paliwanag o patnubay mula sa Diyos.
