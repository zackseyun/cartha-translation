  text: And she bore him Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah.
translation:
  language: tl
  text: At ipinanganak niya kay Abraham sina Zimran, Joksan, Medan, Midian, Isbak, at Sua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: At ipinanganak niya
  rationale: Ang Qal wayyiqtol na pambabaeng isahan mula sa ילד ay nagsasalaysay ng panganganak sa nakaraan. Likas at malinaw sa modernong Tagalog ang “ipinanganak niya” sa ganitong talaangkanan.
- source_word: לוֹ
  choice: para kay Abraham
  rationale: Ang ל na may hulaping panghalip ay tumutukoy sa ama. Ginawang tahasan ang reperenteng si Abraham upang maging natural at malinaw sa Tagalog nang hindi nagdaragdag ng bagong ugnayan.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tuwirang layon bago ang bawat pangalan at walang hiwalay na katumbas sa Tagalog; kinakatawan ito ng panandang maramihang pantangi na “sina.”
- source_word: זִמְרָן
  choice: Zimran
  rationale: Pangalan ng tao; tinumbasan ayon sa anyong madaling bigkasin at kinagawiang baybay sa Tagalog.
- source_word: יָקְשָׁן
  choice: Joksan
  rationale: Pangalan ng tao; ang yod ay isinaayos sa kinagawiang biblikal na anyong J, at pinanatili ang mga pangunahing katinig ng Hebreo.
- source_word: מְדָן
  choice: Medan
  rationale: Pangalan ng tao; tuwirang transliterasyon na angkop sa palabaybayang Tagalog.
- source_word: מִדְיָן
  choice: Midian
  rationale: Pangalan ng tao at pangalang kilala rin sa heograpiyang biblikal; pinanatili ang pamilyar na anyong “Midian.”
- source_word: יִשְׁבָּק
  choice: Isbak
  rationale: Pangalan ng tao; ang Hebreong shin ay kinakatawan ng “s” sa natural na palabaybayang Tagalog, at hindi na pinanatili ang paunang malapatinig na yod bilang hiwalay na “Y.”
- source_word: שׁוּחַ
  choice: Sua
  rationale: Pangalan ng tao; ang huling ח ay hindi likas na kinakatawan sa karaniwang Tagalog, kaya ginamit ang madaling basahin at bigkasing “Sua.”
