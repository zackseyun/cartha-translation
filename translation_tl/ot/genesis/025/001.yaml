  naturalness: Natural at marangal sa modernong Tagalog ang “Nag-asawa pa si Abraham.” Sa orihinal na draft, malabo ang “ang pangalan niya,” sapagkat maaari itong iugnay kay Abraham sa halip na sa babae. Nilulutas ito ng “Ketura ang pangalan ng kanyang asawa.”
