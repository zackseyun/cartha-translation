  text: Abraham took another wife[a], and her name was Keturah.
translation:
  language: tl
  text: Nag-asawa pa si Abraham[a], at Ketura ang pangalan ng kanyang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na, “Muli ay nag-asawa si Abraham.” Sa Hebreo ay may pandagdag na pananalita; literal, “Nagdagdag si Abraham at kumuha ng asawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: Muling
  rationale: Ipinahahayag nito ang pandagdag o pag-uulit na diwa ng pandiwang יסף sa natural na modernong Tagalog, nang hindi ginagamit ang asiwa at labis na literal na ‘nagdagdag siya at.’
- source_word: וַיִּקַּח אִשָּׁה
  choice: nag-asawa
  rationale: Ang literal na ‘kumuha ng asawa’ ay isang Hebreong idyoma para sa pag-aasawa. Ang ‘nag-asawa’ ang malinaw at likas na katumbas sa Tagalog.
- source_word: וּשְׁמָהּ
  choice: at ang pangalan niya ay
  rationale: Pinananatili nito ang payak at tahasang pormula ng pagpapakilala sa pangalan sa Hebreo.
- source_word: קְטוּרָה
  choice: Ketura
  rationale: Isinalin sa baybay na karaniwan at madaling bigkasin sa Tagalog.
theological_decisions:
- issue: Kung paano ipahahayag ang pandagdag o pag-uulit na diwa ng וַיֹּסֶף kaugnay ng pag-aasawa ni Abraham
  choice: Muling nag-asawa si Abraham
  alternative: Nag-asawa si Abraham ng isa pang babae
  rationale: Ang ‘muling nag-asawa’ ay natural sa Tagalog at pinananatili ang tunay na posibilidad ng Hebreo na tumukoy sa paggawa nito muli. Hindi nito higit na tinutukoy kaysa sa teksto kung kailan o sa anong eksaktong kalagayan nangyari ang pag-aasawa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang ‘nag-asawa’ sa halip na literal na ‘kumuha ng asawa,’ habang pinanatili sa talababa ang pandagdag na anyo at alternatibong pagbasa ng Hebreo.
