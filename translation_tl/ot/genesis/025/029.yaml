  text: Jacob was cooking a stew[a], and Esau came in from the field[c][b], and he was exhausted.
translation:
  language: tl
  text: Nagluluto si Jacob ng nilaga[a] nang dumating si Esau mula sa bukid. Pagod na pagod siya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nagpapakulo si Jacob ng isang putahe.” Ang pandiwang Hebreo ay tiyak na tumutukoy sa pagluluto sa pamamagitan ng pagpapakulo.
    reason: lexical_alternative
  - marker: b
    text: O, “lubhang nanghihina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּזֶד
  choice: nagluluto
  rationale: Ang pandiwang זיד ay tumutukoy rito sa paghahanda ng pagkain sa pamamagitan ng pagpapakulo. Likas sa makabagong Tagalog ang aspektong nagaganap na “nagluluto” habang inilalahad ang pagdating ni Esau.
- source_word: נָזִיד
  choice: nilaga
  rationale: Tumutukoy ang נָזִיד sa pagkaing niluto sa likido, gaya ng stew. Ang “nilaga” ay maikli, karaniwan, at pinananatili ang konkretong paraan ng pagluluto.
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Ang בוא ay maaaring mangahulugang pumunta, dumating, o pumasok. Sa kontekstong nagmula si Esau sa bukid, natural na ipinapahayag ng “dumating” ang kaniyang pagbalik sa kinaroroonan ni Jacob nang hindi nagdaragdag ng tahasang gusali o tahanan.
- source_word: מִן הַשָּׂדֶה
  choice: mula sa bukid
  rationale: Karaniwang kahulugan ng שָׂדֶה ang bukid o hayag na lupain. Malinaw at natural sa Tagalog ang “mula sa bukid,” habang nananatiling bukas kung ito ay sinasakang lupain o mas malawak na kaparangan.
- source_word: וְהוּא עָיֵף
  choice: Pagod na pagod siya
  rationale: Ang עָיֵף ay nagsasaad ng matinding pagod o panghihina. Naihahatid ng “pagod na pagod” ang tindi nito sa likas at madaling maunawaang Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nang dumating” upang natural na ipakita na nagaganap ang pagluluto sa oras ng pagdating ni Esau; hindi nagdagdag ng panimulang katumbas ng “now” na wala sa Hebreo.
