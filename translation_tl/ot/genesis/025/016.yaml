base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/016.yaml
  text: 'These are the sons of Ishmael[a], and these are their names[c][b], by their settlements and by their encampments: twelve princes according to their peoples.'
translation:
  language: tl
  text: 'Ito ang mga anak ni Ismael, at ito ang kanilang mga pangalan ayon sa kanilang mga pamayanan at mga kampo: labindalawang pinuno ayon sa kani-kanilang mga bayan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa kanilang mga pamayanan at mga kampo: labindalawang prinsipe ayon sa kani-kanilang mga bayan.”'
    reason: Pinananatili ang posibleng lokatibong kahulugan ng בְּ at ang mas mataas na titulong “prinsipe” para sa נְשִׂיאִם.
lexical_decisions:
- source_word: אֵלֶּה הֵם בְּנֵי יִשְׁמָעֵאל
  choice: Ito ang mga anak ni Ismael
  rationale: Tuwirang ipinakikilala ng parirala ang mga aktuwal na anak ni Ismael na kababanggit lamang; natural sa Tagalog ang isahan na demonstratibong “Ito” bago ang panaguring maramihan.
- source_word: וְאֵלֶּה שְׁמֹתָם
  choice: at ito ang kanilang mga pangalan
  rationale: Pinananatili ang inuulit na demonstratibo at ang tahasang pagtukoy sa kanilang mga pangalan.
- source_word: בְּחַצְרֵיהֶם וּבְטִירֹתָם
  choice: ayon sa kanilang mga pamayanan at mga kampo
  rationale: Maaaring locative o pangkategorya ang בְּ; ang “ayon sa” ay angkop sa konteksto ng talaan. Sinasaklaw ng “mga pamayanan” ang mga nayon o nakapirming tirahan, samantalang pinananatili ng “mga kampo” ang posibleng pansamantala o napapaderang tirahan.
- source_word: שְׁנֵים עָשָׂר נְשִׂיאִם
  choice: labindalawang pinuno
  rationale: Ang נָשִׂיא ay maaaring pinuno, pangulo ng angkan, o prinsipe. Mas natural at hindi labis na monarkikal sa modernong Tagalog ang “pinuno.”
- source_word: לְאֻמֹּתָם
  choice: ayon sa kani-kanilang mga bayan
  rationale: Ang אֻמָּה ay tumutukoy sa mga pangkat ng tao o bayan; ipinahahayag ng “kani-kanilang” ang distributibong ugnayan nang hindi ipinapalagay na modernong bansa ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Iniwasan ang arkaikong “lipi” bilang awtomatikong salin ng אֻמָּה at ang monarkikal na implikasyon ng “prinsipe” sa pangunahing teksto; inilagay ang mga tunay na alternatibo sa talababa.
