base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/013.yaml
  text: 'And these are the names of the sons of Ishmael[a], by their names according to their generations: the firstborn of Ishmael was Nebaioth, and Kedar, and Adbeel, and Mibsam.'
translation:
  language: tl
  text: At ito ang mga pangalan ng mga anak ni Ismael, ayon sa kanilang mga pangalan at salinlahi:[a] Ang panganay ni Ismael ay si Nebayot; sina Kedar, Adbeel, at Mibsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa kani-kanilang angkan.” Ang salitang Hebreo ay maaaring tumukoy sa mga linya ng angkan sa isang talaangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito ang
  rationale: Pinananatili ang pang-ugnay na וְ at likas na ipinakikilala sa Tagalog ang talaan.
- source_word: שְׁמוֹת בְּנֵי יִשְׁמָעֵאל
  choice: mga pangalan ng mga anak ni Ismael
  rationale: Tuwirang isinasalin ang pariralang konstrukto at pinananatili ang estilong pangangkanan.
- source_word: בִּשְׁמֹתָם
  choice: ayon sa kanilang mga pangalan
  rationale: Pinananatili ang pormal at paulit-ulit na pananalita ng Hebreo sa halip na alisin bilang kalabisan.
- source_word: לְתוֹלְדֹתָם
  choice: at salinlahi
  rationale: Ang תוֹלְדוֹת ay tumutukoy sa pagkakasunod o linya ng angkan; ang “salinlahi” ay pormal ngunit malinaw at hindi ito labis na nililimitahan sa mga lipi o tribo.
- source_word: בְּכֹר יִשְׁמָעֵאל
  choice: Ang panganay ni Ismael
  rationale: Likas na Tagalog para sa pariralang konstrukto at malinaw na si Nebayot ang tinutukoy na panganay.
- source_word: נְבָיֹת
  choice: Nebayot
  rationale: Transliterasyong angkop sa tunog at baybay ng modernong Filipino.
- source_word: קֵדָר
  choice: Kedar
  rationale: Tuwirang transliterasyon ng pangalang Hebreo.
- source_word: אַדְבְּאֵל
  choice: Adbeel
  rationale: Tuwirang transliterasyon ng pangalang Hebreo.
- source_word: מִבְשָׂם
  choice: Mibsam
  rationale: Tuwirang transliterasyon ng pangalang Hebreo.
