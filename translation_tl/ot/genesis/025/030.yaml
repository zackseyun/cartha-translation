translation_notes:
  register: Makabago at marangal na Tagalog na may pasalitang bigat sa sinabi ni Esau. Sadyang pinanatili ang kakaibang pag-uulit at hindi pinunan ng “nilaga” ang bagay na hindi pinangalanan sa Hebreo.
