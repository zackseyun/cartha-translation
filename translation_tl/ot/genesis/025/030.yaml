base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/030.yaml
  text: Esau said to Jacob[a], “Please let me gulp down some of that red stuff, that red stuff there[c][b], because I am exhausted.” Therefore his name was called Edom.
translation:
  language: tl
  text: Sinabi ni Esau kay Jacob, “Pakiusap, hayaan mong lumunok ako ng kaunti sa mapula—sa mapulang iyan—dahil pagod na pagod ako.” Kaya tinawag siyang Edom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Edom ay kaugnay ng salitang Hebreo para sa “mapula.” Inuulit ng Hebreo ang “pula” nang hindi tahasang pinapangalanan ang pagkain; maaaring mabanaag dito ang padalos-dalos na pananalita ni Esau. Isinasalin ito ng ilan bilang “mapulang nilaga.”
    reason: cross_reference
lexical_decisions:
- source_word: הַלְעִיטֵנִי
  choice: palunukin mo ako
  rationale: Ang Hiphil imperative ng לעט na may unang-panauhang hulapi ay literal na pagpapalunok o matakaw na pagpapatuka. Pinananatili ng “palunukin mo ako” ang magaspang at mapusok na pananalita ni Esau nang hindi ipinapalagay sa pangunahing teksto kung anong pagkain iyon.
- source_word: נָא
  choice: Pakiusap
  rationale: Pakiusap na pananda ito, hindi kinakailangang temporal na “ngayon.” Ang “Pakiusap” ay malinaw at natural sa makabagong Tagalog.
- source_word: מִן הָאָדֹם הָאָדֹם הַזֶּה
  choice: ng kaunti sa mapulang iyan—sa mapulang iyan
  rationale: Inuulit ng Hebreo ang “mapula” at hindi tahasang pinapangalanan ang pagkain. Pinananatili ng salin ang elipsis, pag-uulit, at panturong הַזֶּה sa halip na idagdag ang “nilaga.”
- source_word: כִּי עָיֵף אָנֹכִי
  choice: dahil pagod na pagod ako
  rationale: Ang עָיֵף ay tumutukoy sa matinding pagod. Ang “pagod na pagod” ay likas sa Tagalog at naghahatid ng diin ng pangungusap.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Natural at maikli itong panandang naghahayag ng bunga at nagpapakilala sa paliwanag tungkol sa pangalan.
- source_word: קָרָא שְׁמוֹ אֱדוֹם
  choice: tinawag siyang Edom
  rationale: Bagaman literal na tumutukoy ang Hebreong idyoma sa pagtawag sa kaniyang pangalan, ang “tinawag siyang Edom” ang natural na pormula ng pagpapangalan sa Tagalog. Hindi tiyak sa anyong pandiwa kung sino ang tumawag, kaya hindi nagdagdag ng tahasang tagaganap.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Isinasatitik ang pangalang pantangi; ipinaliliwanag sa talababa ang tunog-kaugnayan nito sa salitang Hebreo para sa “mapula.”
