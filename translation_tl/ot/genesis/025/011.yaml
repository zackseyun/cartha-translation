  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת אַבְרָהָ֔ם וַ/יְבָ֥רֶךְ אֱלֹהִ֖ים אֶת יִצְחָ֣ק בְּנ֑/וֹ וַ/יֵּ֣שֶׁב יִצְחָ֔ק עִם בְּאֵ֥ר לַחַ֖י רֹאִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/011.yaml
  text: And it happened after Abraham’s death that God blessed Isaac his son[a], and Isaac lived by Beer-lahai-roi.
translation:
  language: tl
  text: Pagkamatay ni Abraham, pinagpala ng Diyos ang anak niyang si Isaac. At nanirahan si Isaac malapit sa Beer-lahai-roi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Beer-lahai-roi ay pangalan ng isang balon; unang binanggit ang pangalang Hebreo sa Genesis 16:14.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת אַבְרָהָם
  choice: Pagkamatay ni Abraham
  rationale: Natural itong panandang temporal sa modernong Tagalog at tumpak na naghahayag na ang sumunod na pangyayari ay naganap matapos mamatay si Abraham. Hindi na isinalin nang hiwalay ang pormulang וַיְהִי upang maiwasan ang mabigat at di-likas na pananalita.
- source_word: וַיְבָרֶךְ אֱלֹהִים
  choice: pinagpala ng Diyos
  rationale: Tuwirang katumbas ng pandiwang ברך ang “pinagpala,” at ang “Diyos” ang malinaw at karaniwang salin ng אֱלֹהִים sa kontekstong ito.
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: ang anak niyang si Isaac
  rationale: Malinaw na ang panghalip sa “anak niya” ay tumutukoy kay Abraham. Ang ayos na ito ay likas sa Tagalog at pinananatili ang pagkakakilanlan ni Isaac bilang anak ni Abraham.
- source_word: וַיֵּשֶׁב יִצְחָק
  choice: At nanirahan si Isaac
  rationale: Sa buod na pasalaysay na ito, ipinahihiwatig ng ישב ang patuloy na paninirahan. Ang “nanirahan” ay makabago, marangal, at mas angkop kaysa literal na “umupo.”
- source_word: עִם
  choice: malapit sa
  rationale: Bagaman karaniwang nangangahulugang “kasama,” locative ang gamit nito rito bago ang pangalan ng isang lugar. Nililinaw ng “malapit sa” ang ideya ng paninirahan sa tabi o paligid ng balon.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Beer-lahai-roi
  rationale: Pinanatili bilang transliteradong pantanging pangalan ng balon/lugar na naipakilala na sa Genesis 16:14.
theological_decisions:
- issue: Paglalarawan sa pagpapala ng Diyos kay Isaac pagkamatay ni Abraham
  choice: pinagpala ng Diyos ang anak niyang si Isaac
  alternative: ibinigay ng Diyos ang pagpapala kay Isaac na anak niya
  rationale: Tuwirang pinananatili ang Diyos bilang gumagawa ng pagpapala at si Isaac bilang tumatanggap nito, nang hindi dinaragdagan ang teksto ng paliwanag tungkol sa mana, tipan, o paraan ng pagpapala.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinili ang maikli at natural na “Pagkamatay ni Abraham” sa halip na literal ngunit mabigat na “At nangyari pagkatapos ng pagkamatay ni Abraham.” Inilipat ang talababa sa pangalan ng Beer-lahai-roi, ang mismong tinutukoy ng paliwanag.
