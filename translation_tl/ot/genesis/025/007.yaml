  yaml_path: translation/ot/genesis/025/007.yaml
  text: 'These are the days of the years of Abraham’s life that he lived: one hundred seventy-five years[a].'
translation:
  language: tl
  text: Ang kabuuang bilang ng mga taon na nabuhay si Abraham ay 175 taon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Ito ang mga araw ng mga taon ng buhay ni Abraham na kanyang nabuhay.”'
    reason: Ipinakikita ang buong idyomatikong pahayag sa Hebreo, na pinadulas sa pangunahing teksto bilang kabuuang bilang ng mga taong nabuhay siya.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ang kabuuang bilang
  rationale: Ipinakikilala nito ang buod ng haba ng buhay ni Abraham. Hindi na hiwalay na isinalin ang panimulang וְ dahil hindi ito kailangan sa natural na daloy ng Filipino.
- source_word: יְמֵי שְׁנֵי חַיֵּי אַבְרָהָם
  choice: ng mga taon na nabuhay si Abraham
  rationale: Ang literal na magkakaugnay na pariralang “mga araw ng mga taon ng buhay ni Abraham” ay isang idyoma para sa kabuuang haba ng buhay. Isinalin ito nang natural habang inilalahad sa talababa ang literal na anyo.
- source_word: אֲשֶׁר חָי
  choice: na nabuhay si Abraham
  rationale: Pinananatili ang sugnay na nagbibigay-diin sa aktuwal na haba ng kanyang buhay, ngunit isinama ito sa natural na pangungusap sa Filipino.
- source_word: מְאַת שָׁנָה וְשִׁבְעִים שָׁנָה וְחָמֵשׁ שָׁנִים
  choice: 175 taon
  rationale: Ang Hebreo ay naglalahad ng bilang bilang 100 + 70 + 5. Ang numerong “175” ay malinaw at eksaktong katumbas sa makabagong Filipino.
