revisions:
- from: 'Sinabi ni Yahweh sa kanya, “Dalawang bansa ang nasa sinapupunan mo,

    at dalawang sambayanan ang mahihiwalay mula sa loob mo.

    Ang isang sambayanan ay magiging mas malakas kaysa sa isa,

