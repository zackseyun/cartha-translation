base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/023.yaml
  text: And Yahweh said to her[a], “Two nations are in your womb, and two peoples will be separated from within you; and one people will be stronger than the other[b], and the older will serve the younger.”
translation:
  language: tl
  text: 'Sinabi ni Yahweh sa kanya,


    “Dalawang bansa ang nasa iyong sinapupunan,


    at dalawang bayan ang magiging magkahiwalay mula sa iyong sinapupunan.


    Ang isang bayan ay magiging mas malakas kaysa sa isa,


    at ang nakatatanda ay maglilingkod sa nakababata.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang mas dakila ay maglilingkod sa mas bata.”
    reason: Pinananatili ang alternatibong, mas literal na kontrast ng רַב at צָעִיר, na maaaring magpahiwatig ng kadakilaan at kabataan sa halip na edad lamang.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: שְׁנֵי גיים
  choice: dalawang bansa
  rationale: Ang גוי ay tumutukoy sa bansa o pangkat ng mga tao; ang “bansa” ay angkop sa etniko at pampolitikang diwa rito.
- source_word: בְּבִטְנֵךְ
  choice: nasa sinapupunan mo
  rationale: Sa konteksto ng pagdadalang-tao, malinaw at likas na katumbas ng בטן ang “sinapupunan.”
- source_word: שְׁנֵי לְאֻמִּים
  choice: dalawang sambayanan
  rationale: Ang “sambayanan” ay tumutukoy sa dalawang pangkat ng mga tao at pinananatili ang paralelismo nang hindi inuulit ang “bansa.”
- source_word: מִמֵּעַיִךְ יִפָּרֵדוּ
  choice: mahihiwalay mula sa loob mo
  rationale: Ang מֵעַיִם ay literal na mga panloob na bahagi, ngunit sa kontekstong ito ay tumutukoy sa loob ng ina; ipinahahayag ng “mahihiwalay” ang inchoative/passive na diwa ng Niphal.
- source_word: וּלְאֹם מִלְאֹם יֶאֱמָץ
  choice: ang isang sambayanan ay magiging mas malakas kaysa sa isa
  rationale: Ipinahahayag nito ang paghahambing ng lakas ng dalawang sambayanan habang pinananatili ang posibilidad na manaig ang isa sa isa.
- source_word: וְרַב יַעֲבֹד צָעִיר
  choice: ang nakatatanda ay maglilingkod sa nakababata
  rationale: Sa konteksto ng kambal, likas na tumutukoy ang magkatambal na רַב at צָעִיר sa nakatatanda at nakababata, ngunit inilalahad sa talababa ang mas literal na paghahambing ng katayuan.
theological_decisions:
- issue: Kahulugan ng וְרַב יַעֲבֹד צָעִיר
  choice: ang nakatatanda ay maglilingkod sa nakababata
  alternative: ang nakahihigit ay maglilingkod sa nakabababa
  rationale: Sinusuportahan ng konteksto ng kambal ang pagbasa batay sa pagkakasunod ng kapanganakan, ngunit maaari ring mangahulugan ang mga pang-uri na “mas dakila/nakahihigit” at “mas maliit/nakabababa.” Pinanatili sa talababa ang tunay na lawak ng Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sinapupunan” at “sambayanan” bilang malinaw ngunit hindi kolokyal na mga salita; pinanatili ang anyong patula sa pamamagitan ng paghahati sa magkakatumbas na linya.
