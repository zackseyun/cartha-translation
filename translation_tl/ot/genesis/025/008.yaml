  yaml_path: translation/ot/genesis/025/008.yaml
  text: And Abraham breathed his last and died in a good old age[a], old and full[b], and he was gathered to his people.
translation:
  language: tl
  text: Nalagutan ng hininga si Abraham at namatay sa mabuting katandaan, matanda at puspos[a]; at natipon siya sa kanyang mga kaanak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “matanda at puspos.” Maaari rin itong isaling “matanda at nasiyahan.” Sa konteksto ng kamatayan, maaari itong magpahiwatig ng buhay na ganap o ganap na nasiyahan; walang tahasang salitang “mga araw” sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang “natipon sa kanyang mga kaanak” ay isang tradisyonal na pormulang Hebreo tungkol sa kamatayan. Maaaring ipahiwatig nito ang pakikipisan sa mga kaanak na yumao, ngunit hindi tinutukoy ng mismong pananalita ang eksaktong paraan nito.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: nalagutan ng hininga
  rationale: Ipinahahayag ng גוע sa mga ulat ng kamatayan ang pagpanaw o paghinga ng huli. Pinananatili ng parirala ang pagkakaiba nito sa kasunod na tahasang pandiwang “namatay.”
- source_word: וַיָּמָת
  choice: namatay
  rationale: Ang מות ang karaniwang tuwirang pandiwa para sa pagkamatay; hindi ito pinalalambot sa isang eupemismo.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: sa mabuting katandaan
  rationale: Pinananatili nito kapwa ang kalagayan ng katandaan at ang positibong paglalarawan dito.
- source_word: זָקֵן
  choice: matanda na
  rationale: Isinasalin ito nang hiwalay upang mapanatili ang sunod-sunod na paglalarawan sa Hebreo.
- source_word: וְשָׂבֵעַ
  choice: at lubos na nasiyahan
  rationale: Ang שׂבע ay nangangahulugang busog, puspos, o nasiyahan. Sa konteksto ng mahabang buhay, natural sa Tagalog ang “lubos na nasiyahan,” habang ipinapaliwanag sa talababa na walang tahasang salitang “mga araw” o “buhay” sa Hebreo.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: at napisan siya sa kanyang mga kaanak
  rationale: Ang “napisan” ay nagpapanatili sa larawang siya ay idinagdag o tinipon sa isang pangkat. Ang “mga kaanak” ay natural sa Tagalog at naghahayag ng ugnayang pampamilya nang hindi tahasang nilulutas kung libing, pakikipag-isa sa mga yumao, o iba pang aspekto ng kamatayan ang tinutukoy.
- source_word: עַמָּיו
  choice: kanyang mga kaanak
  rationale: Bagaman literal na “kanyang bayan/mga tao,” sa pormulang ito ng kamatayan ay tumutukoy ang עַמָּיו sa sariling kamag-anakan o sambahayan. Iniiwasan ng “mga kaanak” ang makabagong diwang pambansa ng “bayan.”
theological_decisions:
- issue: Kahulugan ng “napisan siya sa kanyang mga kaanak”
  choice: Panatilihin bilang tradisyonal na pormula ng kamatayan nang hindi tinutukoy ang eksaktong paraan ng pagkakapisang ito.
  alternative: Ipaliwanag ito bilang paglilibing sa libingan ng pamilya, o bilang mulat na pakikipagtagpo sa mga yumaong ninuno.
  rationale: May pahiwatig ang pormulang Hebreo ng pakikipisan sa sariling mga kaanak sa kamatayan, ngunit hindi tinutukoy ng talata kung ito ay tungkol lamang sa libing o sa kalagayan pagkamatay.
- issue: Kahulugan ng וְשָׂבֵעַ
  choice: “lubos na nasiyahan,” nang hindi idinaragdag sa teksto ang “sa buhay” o “sa mga araw.”
  alternative: “puspos ng mga araw” o “nasiyahan sa buhay.”
  rationale: Walang tahasang “mga araw” o “buhay” sa Hebreo. Pinananatili ng salin ang kalidad ng pagiging ganap o nasiyahan at inilalagay sa talababa ang posibleng mga pagbasa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng “nalagutan ng hininga” at “namatay” dahil magkaibang pandiwa ang magkasunod sa Hebreo. Ginamit ang semicolon upang malinaw na iugnay ngunit bahagyang ihiwalay ang pangwakas na pormula ng kamatayan.
