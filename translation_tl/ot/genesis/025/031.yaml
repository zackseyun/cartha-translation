  text: Jacob said[a], “Sell me your birthright today.”
translation:
  language: tl
  text: Sinabi ni Jacob[a], “Ipagbili mo sa akin ngayon ang karapatan mo bilang panganay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “ngayon” bilang “sa araw na ito” o “mula sa araw na ito,” na nagdiriin sa isang agarang transaksiyong may bisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Ang wayyiqtol na may waw ay nagpapatuloy sa salaysay; natural sa makabagong Tagalog ang payak na “Sinabi” kaysa mekanikal na “At sinabi.”
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: מִכְרָה
  choice: Ipagbili mo
  rationale: Pautos na anyo ng מכר, “magbili/magpabili”; malinaw at tuwiran sa Tagalog ang “Ipagbili mo sa akin.”
- source_word: כַיּוֹם
  choice: ngayon
  rationale: Maaaring mangahulugang “ngayon,” “sa araw na ito,” o “mula sa araw na ito”; ipinahihiwatig sa konteksto ang isang agarang transaksiyong may bisa.
- source_word: אֶת
  choice: '[pananda ng tiyak na tuwirang layon; hindi isinalin]'
  rationale: Ang אֶת ay panandang gramatikal at karaniwang walang hiwalay na katumbas sa Tagalog.
- source_word: בְּכֹרָתְךָ
  choice: ang karapatan mo bilang panganay
  rationale: Ang בְּכֹרָה ay tumutukoy sa katayuan at mga karapatan o pribilehiyo ng panganay; mas malinaw ito sa ordinaryong Tagalog kaysa sa “pagkapanganay.”
- source_word: לִי
  choice: sa akin
  rationale: Ang pang-ukol na לְ na may unang panauhang hulapi ay natural na isinasaling “sa akin” kasama ng pandiwang “ipagbili.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “karapatan mo bilang panganay” upang madaling maunawaan habang pinananatili ang saklaw ng Hebreong בְּכֹרָה. Ang talababa ay nagpapanatili sa posibleng pormal na diwa ng כַיּוֹם.
