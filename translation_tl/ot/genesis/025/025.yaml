  text: וַ/יֵּצֵ֤א הָ/רִאשׁוֹן֙ אַדְמוֹנִ֔י כֻּלּ֖/וֹ כְּ/אַדֶּ֣רֶת שֵׂעָ֑ר וַ/יִּקְרְא֥וּ שְׁמ֖/וֹ עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/025.yaml
  text: The first came out reddish[a], all of him like a hairy cloak[c][b], and they called his name Esau.
translation:
  language: tl
  text: Ang unang lumabas ay mapula-pula[a]; ang buong katawan niya ay parang balabal na gawa sa balahibo[b]. Tinawag nila siyang Esau[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapula” o “mamula-mula.” Inilalarawan ng pang-uring Hebreo ang mapulang anyo o kutis.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “parang balabal na mabalahibo” o “parang manta na gawa sa balahibo.” Gumagamit ang Hebreo ng paghahambing na may mga salitang “balabal/manta” at “balahibo.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “tinawag nila ang pangalan niya na Esau,” isang karaniwang pormula ng pagbibigay ng pangalan; ibig sabihin, “pinangalanan nila siyang Esau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הָרִאשׁוֹן
  choice: Ang unang lumabas
  rationale: Tumutukoy ito sa unang kambal ayon sa pagkakasunod ng pagsilang. Likas sa modernong Tagalog ang pariralang ito at pinananatili nito ang konkretong larawan ng paglabas sa sinapupunan.
- source_word: אַדְמוֹנִי
  choice: mapula-pula
  rationale: Inilalarawan ng pang-uri ang mapulang anyo o kutis. Ang “mapula-pula” ay natural sa Tagalog at hindi nito pinalalabis ang ugnayan sa pangalang Edom na makikita sa kasunod na salaysay.
- source_word: כֻּלּוֹ
  choice: ang buong katawan niya
  rationale: Idinidiin na ang paglalarawan ay tumutukoy sa kabuuan ng kanyang katawan. Ginagawang malinaw ng “katawan” ang reperensiyang pisikal.
- source_word: כְּאַדֶּרֶת שֵׂעָר
  choice: parang balabal na balahibo
  rationale: Pinananatili ang tahasang paghahambing sa isang balabal o manta na yari o nababalutan ng balahibo, sa halip na gawing payak lamang na “balot ng balahibo.”
- source_word: וַיִּקְרְאוּ שְׁמוֹ
  choice: Tinawag nila siyang
  rationale: Natural na katumbas sa Tagalog ng karaniwang Hebreong pormula ng pagbibigay ng pangalan, habang nananatiling malapit sa pandiwang “tinawag.”
- source_word: עֵשָׂו
  choice: Esau
  rationale: Ginamit ang nakasanayang anyo ng pangalang pantangi sa Tagalog.
