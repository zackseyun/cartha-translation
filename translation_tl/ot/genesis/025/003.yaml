base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/003.yaml
  text: Jokshan fathered Sheba and Dedan. The sons of Dedan were Asshurim[a], Letushim, and Leummim.
translation:
  language: tl
  text: Nagkaanak si Jocsan kina Seba at Dedan. Ang mga anak ni Dedan ay sina Asurim[a], Letusim, at Leumim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring mga pangalan ito ng mga lipi: “Asurim,” “Letusim,” at “Leumim.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְשָׁן
  choice: Jocsan
  rationale: Pangngalang pantangi; ginamit ang anyong transliterasyon na pamilyar sa tradisyong Tagalog/Filipino habang nananatiling malapit sa pangalang Hebreo.
- source_word: יָלַד
  choice: Naging anak ni
  rationale: Sa talaangkanan, likas at malinaw itong modernong Filipino para sa pagiging ama nang hindi gumagamit ng makaluma o masyadong teknikal na pananalita.
- source_word: שְׁבָא
  choice: Seba
  rationale: Pangngalang pantangi; transliterasyon sa anyong natural sa Filipino.
- source_word: דְּדָן
  choice: Dedan
  rationale: Pangngalang pantangi; tuwirang transliterasyon.
- source_word: בְנֵי
  choice: mga anak ni
  rationale: Tumutugma sa panlalaking maramihang anyo ng Hebreo, ngunit ang natural na Filipino na “mga anak” ay hindi kailangang ulitin ang kasarian; maaaring tumukoy ang konteksto sa mga anak o sa mga liping nagmula sa kanila.
- source_word: הָיוּ
  choice: ay
  rationale: Payak na panandang kopula na natural na nagpapakilala sa talaan ng mga pangalan.
- source_word: אַשּׁוּרִם
  choice: Asurim
  rationale: Malamang na pangalan ng lipi o pangkat; transliterasyon ang ginamit upang hindi ito ipakahulugan nang lampas sa katiyakan ng teksto.
- source_word: לְטוּשִׁים
  choice: Letusim
  rationale: Pangalan ng lipi o pangkat; transliterasyon sa baybay na angkop sa Filipino.
- source_word: לְאֻמִּים
  choice: Leumim
  rationale: Itinuring na pangalang pantangi ng isang lipi sa kontekstong ito at hindi isinalin bilang karaniwang pangngalan.
theological_decisions:
- issue: Kung ang huling tatlong pangalan ay indibidwal na mga anak o mga pangalan ng lipi
  choice: Pinanatili sa pangunahing teksto ang literal na “mga anak,” na may talababa tungkol sa posibleng mga pangalan ng lipi.
  alternative: Isalin nang tahasan bilang “mga liping Asurim, Letusim, at Leumim.”
  rationale: Ang Hebreo ay literal na nagsasabing “mga anak ni Dedan,” ngunit ang mga anyong maramihan ng mga pangalan ay maaaring tumukoy sa mga pangkat o lipi. Pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na simple, marangal, at angkop sa talaangkanan. Iniwasan ang makalumang “ipinanganak ni” sa kahulugang “naging ama,” dahil maaari itong maging malabo sa kasalukuyang gamit.
