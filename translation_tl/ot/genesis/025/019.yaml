  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/019.yaml
  text: 'These are the generations of Isaac[a], son of Abraham: Abraham fathered Isaac.'
translation:
  language: tl
  text: 'Ito ang salaysay tungkol kay Isaac[a], na anak ni Abraham: Si Abraham ang naging ama ni Isaac.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na toledot ay maaari ding isaling “mga salinlahi,” “kasaysayan ng angkan,” o “talaan ng lahi.” Paulit-ulit itong ginagamit bilang panimula ng mga pangunahing bahagi ng Genesis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Ipinakikilala ng parirala ang isang bagong seksiyon. Hindi na kailangang isalin nang tahasan ang pang-ugnay na וְ bilang “at” dahil likas sa modernong Tagalog ang tuwirang panimulang “Ito ang.”
- source_word: תּוֹלְדֹת
  choice: salaysay tungkol kay
  rationale: Ang תּוֹלְדֹת ay paulit-ulit na panandang pampanitikan sa Genesis at maaaring tumukoy sa salaysay o kasaysayang nagmumula sa isang tao at sa kaniyang angkan. Ang “salaysay tungkol kay” ay malinaw at natural, habang iniiwasang limitahan ang kahulugan sa talaangkanan lamang.
- source_word: יִצְחָק
  choice: Isaac
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa modernong Bibliyang Tagalog.
- source_word: בֶּן אַבְרָהָם
  choice: na anak ni Abraham
  rationale: Tuwirang ipinapahayag ang ugnayang pampamilya, at ang “na” ay nagbibigay ng natural na apposition sa Tagalog.
- source_word: הוֹלִיד
  choice: naging ama ni
  rationale: Sa anyong Hiphil, ang ילד dito ay nangangahulugang magkaanak o maging ama. Malinaw at dignified ang “naging ama ni,” at hindi nito ipinahihiwatig ang mas malawak na kahulugan ng modernong pandiwang “inalagaan” o “pinalaki.”
- source_word: אֶת יִצְחָק
  choice: Isaac
  rationale: Hindi isinasalin nang hiwalay ang panandang tuwirang layon na אֶת; ang pangalang Isaac ang layon ng pandiwa.
theological_decisions:
- issue: Pagbibigay-kahulugan sa pormulang תּוֹלְדֹת sa Genesis
  choice: salaysay tungkol kay
  alternative: mga salinlahi ni; kasaysayan ng angkan ni; talaangkanan ni
  rationale: Ang talata ay heading sa paulit-ulit na balangkas ng Genesis. Pinananatili ng “salaysay tungkol kay” ang malawak na saklaw nito at hindi ipinapalagay na ang kasunod ay talaan lamang ng mga inapo. Inilalahad sa talababa ang mas pormal na mga alternatibo upang manatiling nakikita ang saklaw ng salitang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang natural na pormulang pamagat na “Ito ang salaysay tungkol kay” sa halip na ang mas literal ngunit hindi gaanong likas na “Ito ang mga salinlahi ni.”
