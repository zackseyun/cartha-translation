base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/004.yaml
  text: And the sons of Midian were Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.
translation:
  language: tl
  text: At ang mga anak na lalaki ni Midian ay sina Efa, Efer, Hanok[a], Abida, at Eldaa. Lahat ng ito ay mga anak na lalaki ni Ketura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Hanok”; sa ilang salin, “Enoc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: At ang mga anak na lalaki ni Midian
  rationale: Tahasang pinananatili ang panlalaking anyo ng בְּנֵי at ang ugnayang pangangkan; ang וּ ay isinaling “At.”
- source_word: עֵיפָה
  choice: Efa
  rationale: Likas na transliterasyon sa baybay-Filipino ng pangalang Hebreo.
- source_word: וָעֵפֶר
  choice: Efer
  rationale: Inangkop sa makabagong ortograpiyang Filipino habang pinananatili ang tunog ng pangalang Hebreo.
- source_word: וַחֲנֹךְ
  choice: Hanok[a]
  rationale: Malapit sa Hebreong חֲנֹךְ at hindi ito awtomatikong itinutulad sa nakaugaliang anyong “Enoc.”
- source_word: וַאֲבִידָע
  choice: Abida
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa anyong madaling basahin sa Filipino.
- source_word: וְאֶלְדָּעָה
  choice: Eldaa
  rationale: Tuwirang transliterasyon na pinananatili ang hulíng patinig ng Hebreo.
- source_word: כָּל אֵלֶּה
  choice: Lahat ng ito
  rationale: Natural at tumpak na pananalitang Filipino para sa pariralang nagbubuod sa mga pangalang binanggit.
- source_word: בְּנֵי קְטוּרָה
  choice: mga anak na lalaki ni Ketura
  rationale: Inuulit ang pormulang pangangkan ng Hebreo at pinananatili ang tiyak na kahulugang “mga anak na lalaki.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at tuwiran. Inangkop sa ortograpiyang Filipino ang mga pangalan nang hindi nilalayo sa anyong Hebreo. Inilipat ang talababa sa “Hanok,” ang pangalang aktuwal na tinutukoy ng paliwanag; ang pagkakalagay nito sa “Ephah” sa English consultation layer ay hindi tumutugma sa nilalaman ng talababa.
