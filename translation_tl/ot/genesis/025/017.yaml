  naturalness: Marangal at madaling maunawaan ang kabuuang pangungusap. Mas likas at malinaw sa modernong Filipino ang “natipon sa kanyang mga kaanak” kaysa “napisan sa kanyang mga kaangkan.” Ang “kaangkan” ay hindi karaniwang gamit sa ganitong konteksto, at ang “napisan” ay maaaring umugnay sa ibang pandiwang “pumisan” at hindi agad magpahiwatig ng pagkatipon.
  terminology: Ang pangalang “Ismael” ay ang karaniwang anyong Filipino. Ang “mga kaanak” ay mas natural na katumbas ng עַמָּיו sa idyomang ito at hindi nito ipinapasya kung ang tinutukoy ay libing kasama ng angkan, pakikipagtipon sa mga yumao, o kapuwa.
