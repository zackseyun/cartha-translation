base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/017.yaml
  text: 'These were the years of Ishmael’s life: one hundred and thirty-seven years[a]. And he breathed his last and died[b], and was gathered to his people.'
translation:
  language: tl
  text: 'Ito ang mga taon ng buhay ni Ismael: isang daan at tatlumpu''t pitong taon. At nalagutan siya ng hininga at namatay[a], at natipon siya sa kanyang mga kaanak[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalawang magkaibang pandiwa ang ginamit sa Hebreo: una, ang pagkalagot ng hininga; pagkatapos, ang pagkamatay. Kaya kapuwa pinanatili sa salin.'
    reason: lexical_note
  - marker: b
    text: Ang “natipon sa kanyang mga kaanak” ay isang Hebreong pormula sa mga ulat ng kamatayan. Maaaring tumukoy ito sa pagsama sa mga ninuno, sa pagkalibing na kaugnay ng sariling angkan, o sa kapuwa.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Ipinakikilala nito ang pangwakas na buod ng haba ng buhay ni Ismael. Likas sa modernong Tagalog ang “Ito ang” sa ganitong pormula.
- source_word: שְׁנֵי חַיֵּי יִשְׁמָעֵאל
  choice: mga taon ng buhay ni Ismael
  rationale: Pinananatili ang Hebreong paraan ng pagbilang sa buong haba ng buhay, nang hindi ginagawang mas malaya ang pahayag kaysa kailangan.
- source_word: מְאַת שָׁנָה וּשְׁלֹשִׁים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: isandaan at tatlumpu't pitong taon
  rationale: Ibinibigay ang eksaktong kabuuan sa natural na anyo ng bilang sa Filipino.
- source_word: וַיִּגְוַע
  choice: nalagutan siya ng hininga
  rationale: Ipinahahayag ang pagpanaw o paghinga ng huli at pinananatiling naiiba sa kasunod na tahasang pandiwang “namatay.”
- source_word: וַיָּמָת
  choice: at namatay
  rationale: Pinananatili ang ikalawang pandiwa tungkol sa kamatayan sa halip na pagsamahin ang dalawang magkaugnay ngunit magkaibang pandiwa ng Hebreo.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: at napisan sa kanyang mga kaangkan
  rationale: Ang “napisan” ay angkop sa larawan ng pagsama o pagkatipon, samantalang ang “mga kaangkan” ay nagpapahiwatig ng sariling lipi nang hindi tiyak na nililimitahan ang pahayag sa libing o sa muling pakikipagtagpo pagkamatay.
theological_decisions:
- issue: Kahulugan ng pormulang “napisan sa kanyang mga kaangkan”
  choice: Pinanatili ang pormulang maaaring tumukoy sa pagkakaugnay niya sa kanyang angkan sa kamatayan, nang hindi nililinaw kung ito ay libing, pakikipagtagpo sa mga ninuno pagkamatay, o kapuwa.
  alternative: Isalin nang tuwiran bilang pagkalibing kasama ng mga ninuno, o bilang pakikipagtagpo sa kanila sa kabilang-buhay.
  rationale: Hindi nilulutas ng Hebreong pahayag ang saklaw nito. Ang mas malawak na salin ay nagpapanatili sa tunay na teolohikal at kultural na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Sinasadyang pinanatili ang bahagyang pag-uulit sa “nalagutan siya ng hininga at namatay” dahil dalawang magkaibang pandiwa ang nasa Hebreo. Iniwasan ang “mga kababayan,” na maaaring magpahiwatig ng modernong nasyonalidad, at ang “mga ninuno,” na maaaring labis na magtakda sa kahulugan ng idyoma.
