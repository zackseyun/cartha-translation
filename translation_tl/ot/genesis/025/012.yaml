  text: וְ/אֵ֛לֶּה תֹּלְדֹ֥ת יִשְׁמָעֵ֖אל בֶּן אַבְרָהָ֑ם אֲשֶׁ֨ר יָלְדָ֜ה הָגָ֧ר הַ/מִּצְרִ֛ית שִׁפְחַ֥ת שָׂרָ֖ה לְ/אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/012.yaml
  text: These are the generations of Ishmael[a], Abraham’s son, whom Hagar the Egyptian, Sarah’s servant woman[b], bore to Abraham.
translation:
  language: tl
  text: Ito ang mga salinlahi ni Ismael[a], anak ni Abraham, na isinilang ni Hagar, ang Ehipsiyang aliping babae ni Sara[b], kay Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “At ito ang mga salinlahi ni Ismael,” “Ito ang mga inapo ni Ismael,” o “Ito ang salaysay ng lahi ni Ismael.” Ang salitang Hebreo na תּוֹלְדוֹת (toledot) ay paulit-ulit na pormula ng pamagat sa Genesis at maaaring tumukoy sa mga inapo, linya ng angkan, o salaysay ng isang lahi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “babaeng lingkod ni Sara.” Ang Hebreong שִׁפְחָה ay tumutukoy sa isang babaeng alipin o lingkod; ginamit ang “aliping babae” upang malinaw na maipakita ang kaniyang kalagayang alipin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Ito ang
  rationale: Likas na panimula ito sa Filipino para sa isang bagong talaangkanang seksiyon. Hindi na tahasang isinalin ang וְ bilang “At” sapagkat sapat na sa konteksto ang ugnayang pandiskurso.
- source_word: תֹּלְדֹת
  choice: lahi
  rationale: Sa kontekstong genealogical, malinaw at natural na ipinahihiwatig ng “lahi” ang mga inapo o linya ng angkan, habang itinatala sa talababa ang mas malawak na saklaw ng paulit-ulit na pormulang Hebreo sa Genesis.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa modernong saling Filipino.
- source_word: בֶּן אַבְרָהָם
  choice: anak ni Abraham
  rationale: Tuwiran at natural na Filipino para sa ugnayang construct sa Hebreo.
- source_word: אֲשֶׁר יָלְדָה
  choice: ipinanganak ni
  rationale: Pinananatili nitong malinaw na si Hagar ang ina, sa isang natural na kayariang Filipino.
- source_word: הָגָר
  choice: Hagar
  rationale: Karaniwang transliterasyon ng personal na pangalan sa Filipino.
- source_word: הַמִּצְרִית
  choice: na Ehipsiyô
  rationale: Tinutukoy ang pambansa o etnikong pagkakakilanlan ni Hagar sa isang maikli at natural na parirala.
- source_word: שִׁפְחַת שָׂרָה
  choice: ang aliping babae ni Sara
  rationale: Pinananatili ng “aliping babae” ang sapilitang mababang katayuan na ipinahihiwatig ng שִׁפְחָה, sa halip na palambutin lamang bilang katulong.
- source_word: לְ/אַבְרָהָם
  choice: para kay Abraham
  rationale: Ipinahahayag nito ang ugnayan ng panganganak kay Abraham bilang ama, bagaman mas idiomatiko ang ganitong ayos sa Filipino kaysa sa literal na “ipinanganak kay Abraham.”
