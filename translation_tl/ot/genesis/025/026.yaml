base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/026.yaml
  text: Afterward his brother came out[a], and his hand was grasping Esau’s heel, so his name was called Jacob. And Isaac was sixty years old when they were born.
translation:
  language: tl
  text: Pagkatapos nito, lumabas ang kapatid niya, at nakahawak ang kamay niya sa sakong ni Esau. Kaya tinawag siyang Jacob.[a] Animnapung taong gulang si Isaac nang ipanganak sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang pangalang Jacob (Ya‘aqov) ay may kaugnayan sa salitang “sakong” at kalaunan ay iniuugnay rin sa diwa ng pag-agaw ng puwesto o panlalamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Malinaw at likas na ipinahihiwatig ang pagkakasunod ng pagsilang.
- source_word: יָצָא
  choice: lumabas
  rationale: Pinananatili ang kongkretong larawan ng paglabas mula sa sinapupunan sa halip na gawing simpleng “ipinanganak.”
- source_word: אָחִיו
  choice: ang kapatid niya
  rationale: “Kapatid” lamang ang tahasang sinasabi ng Hebreo; hindi idinagdag dito ang “kambal.”
- source_word: וְיָדוֹ אֹחֶזֶת
  choice: at nakahawak ang kamay nito
  rationale: Isinasalin ang kasabay at nagpapatuloy na kilos ng kamay sa natural na Tagalog. Ginamit ang “nito” upang malinaw na ang kamay ay sa kapatid na kalalabas lamang.
- source_word: בַּעֲקֵב עֵשָׂו
  choice: sa sakong ni Esau
  rationale: Tuwirang katumbas ng pariralang Hebreo at pinananatili ang larawang pinagmumulan ng paglalaro sa pangalan.
- source_word: וַיִּקְרָא שְׁמוֹ יַעֲקֹב
  choice: Kaya tinawag siyang Jacob
  rationale: Natural na pormula ng pagpapangalan sa Tagalog; ipinakikita ng “kaya” ang ugnayan ng paghawak sa sakong at ng pangalan nang hindi labis na ipinapaliwanag ito sa teksto.
- source_word: וְיִצְחָק בֶּן שִׁשִּׁים שָׁנָה
  choice: Animnapung taong gulang si Isaac
  rationale: Karaniwang paraan sa Tagalog ng pagsasabi ng edad.
- source_word: בְּלֶדֶת אֹתָם
  choice: nang ipanganak sila
  rationale: Natural na temporal na salin na hindi nagdaragdag ng tahasang paksa na wala sa pariralang Hebreo.
theological_decisions:
- issue: Ugnayan ng pangalang Jacob sa sakong at sa kalaunang ideya ng pang-aagaw o panlalamang
  choice: Pinanatili sa pangunahing teksto ang pangalang “Jacob” at ipinaliwanag sa talababa ang paglalaro ng mga salitang Hebreo.
  alternative: Isalin o ipakahulugan ang pangalan sa mismong talata bilang “Tagahawak sa Sakong” o “Mang-aagaw.”
  rationale: Hindi ganap na katumbas ng iisang kahulugan ang pangalan; ang salaysay ay gumagamit ng tunog at kalaunang paglalaro sa magkakaugnay na salitang Hebreo. Iniiwasan nitong gawing tiyak ang isang etimolohiyang may tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong larawan ng pagsilang at ang karaniwang anyo sa Filipino ng mga pangalang Esau, Jacob, at Isaac. Ang talababa ay nagpapaliwanag ng paglalaro sa mga salitang Hebreo nang hindi ipinipilit ang iisang tiyak na etimolohiya.
