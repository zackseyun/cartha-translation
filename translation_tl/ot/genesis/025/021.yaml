base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/021.yaml
  text: And Isaac prayed to Yahweh for his wife[a], because she was barren. And Yahweh answered him[b], and Rebekah his wife conceived.
translation:
  language: tl
  text: Nanalangin si Isaac kay Yahweh para sa kanyang asawa[a], sapagkat hindi siya magkaanak. Dininig siya ni Yahweh[b], at naglihi ang kanyang asawang si Rebeca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa tapat ng kanyang asawa.” Maaari ring maunawaan ang parirala bilang pananalangin tungkol sa o alang-alang sa kanya.
    reason: lexical_alternative
  - marker: b
    text: 'Iisang salitang-ugat ang ginamit sa Hebreo para sa pananalangin ni Isaac at sa pagtugon ni Yahweh: maaaring isalin na si Isaac ay “nakiusap,” at si Yahweh ay “pinakinggan ang kanyang pakiusap.”'
    reason: lexical_wordplay
lexical_decisions:
- source_word: וַיֶּעְתַּר / וַיֵּעָתֶר (עתר)
  choice: nanalangin / dininig siya
  rationale: 'Iisang salitang-ugat ang sadyang inuulit sa Hebreo: nanalangin si Isaac at hinayaan naman ni Yahweh na mapakiusapan siya. Ang magkaibang ngunit magkaugnay na pariralang Filipino ay natural at malinaw; ipinaliliwanag ng talababa ang pag-uulit sa orihinal.'
- source_word: לַיהוָה / יְהוָה
  choice: kay Yahweh / ni Yahweh
  rationale: Tuwirang tinutukoy ng tekstong Hebreo ang banal na pangalang יהוה; pinanatili itong Yahweh sa halip na palitan ng isang titulo.
- source_word: לְנֹכַח אִשְׁתּוֹ
  choice: para sa kanyang asawa
  rationale: Bagaman ang לְנֹכַח ay maaaring mangahulugang “sa tapat ng,” sa konteksto ng panalangin ay natural itong maunawaan bilang pananalangin tungkol sa o alang-alang sa asawa. Pinananatili sa talababa ang literal na posibilidad.
- source_word: עֲקָרָה
  choice: hindi magkaanak
  rationale: Malinaw at magalang na ipinahahayag nito sa kasalukuyang Filipino ang kawalan ng kakayahang magkaanak nang hindi gumagamit ng salitang maaaring marinig bilang mapanlait.
- source_word: וַתַּהַר
  choice: naglihi
  rationale: Maikli at likas na salin sa estilong pasalaysay para sa pagkakaroon ng ipinagbubuntis.
- source_word: רִבְקָה
  choice: Rebeca
  rationale: Ginamit ang nakagawiang anyo ng pangalang ito sa Filipino, na madaling makilala ng karaniwang mambabasa.
theological_decisions:
- issue: Ang tugon ni Yahweh sa panalangin at ang paulit-ulit na salitang-ugat na עתר
  choice: Dininig siya ni Yahweh
  alternative: Hinayaan ni Yahweh na mapakiusapan siya ni Isaac
  rationale: Natural na ipinapahayag ng “dininig” na tumugon ang Diyos sa panalangin, nang hindi ipinahihiwatig na sapilitan o mekanikal ang naging bunga nito. Inilalahad sa talababa ang mas pormal na ugnayan ng dalawang anyo ng iisang pandiwang Hebreo.
- issue: Paglalarawan sa kalagayan ng asawa ni Isaac
  choice: hindi ito magkaanak
  alternative: baog ito
  rationale: Tumpak na ipinahahayag ang kalagayan sa salaysay habang gumagamit ng dignified at di-mapanghusgang pananalita.
- issue: Paglilipat sa יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo at hindi ito tahimik na pinapalitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinili ang “hindi magkaanak” sa halip na “baog” upang maging magalang ngunit tumpak, at “dininig” upang maging natural sa karaniwang wikang panrelihiyon. Ang mga tunay na alternatibo sa לְנֹכַח at ang salitang-laro sa עתר ay pinanatili sa mga talababa.
