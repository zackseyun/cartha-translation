    rationale: Ang panghalip na “siya” ang karaniwang at magalang na pantukoy sa isang tao sa Filipino.
  - severity: low
    issue: Medyo alanganin ang ayos na “naglihi si Rebeca na kanyang asawa.”
    rationale: Mas natural ang “naglihi ang kanyang asawang si Rebeca,” habang pinananatili ang pagpapakilala sa kanya bilang asawa ni Isaac.
  - severity: low
    issue: Maaaring maging di-gaanong tumpak ang paliwanag na “nagpahintulot na mapakiusapan.”
    rationale: Ang Niphal ng עתר ay nagpapahayag na si Yahweh ay nakiusapan at tumugon; mas malinaw ang “pinakinggan ang pakiusap” o “nagpaunlak sa pakiusap,” kasabay ng paliwanag na iisang ugat ang inuulit.
