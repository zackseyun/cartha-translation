id: GEN.25.28
reference: Genesis 25:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֶּאֱהַ֥ב יִצְחָ֛ק אֶת עֵשָׂ֖ו כִּי צַ֣יִד בְּ/פִ֑י/ו וְ/רִבְקָ֖ה אֹהֶ֥בֶת אֶֽת יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/028.yaml
  text: Isaac loved Esau because game was in his mouth[a], but Rebekah loved Jacob.
translation:
  language: tl
  text: Mahal ni Isaac si Esau sapagkat nasa bibig niya ang nahuling hayop[a], ngunit mahal ni Rebeca si Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sapagkat nasa bibig niya ang nahuling hayop.” Malamang na ang ibig sabihin ay mahal ni Isaac si Esau dahil nasisiyahan siya sa mga hayop na nahuhuli ni Esau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: Mahal
  rationale: Ipinapahayag ng anyong Tagalog na ito ang patuloy o kinagawiang pagmamahal sa salaysay nang hindi pilit na nilalagyan ng panandang pangnagdaan na hindi kailangan sa pangungusap na nominal.
- source_word: אֶת עֵשָׂו
  choice: si Esau
  rationale: Hindi isinasalin ang panandang tuwirang layon na אֶת; ginagamit ang karaniwang anyong Filipino ng pangalan kasama ang pantukoy na si.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng pagmamahal ni Isaac kay Esau at angkop sa marangal ngunit likas na rehistro.
- source_word: צַיִד
  choice: nahuling hayop
  rationale: Tumutukoy ang צַיִד sa hayop o pagkaing nakuha sa pangangaso. Hindi ito pinakikitid sa usa lamang, gaya ng maaaring ipahiwatig ng 'karne ng usa.'
- source_word: בְּפִיו
  choice: nasa bibig niya
  rationale: Pinananatili ang kongkretong idyomang Hebreo na literal na 'nasa bibig niya' sa halip na tahasang ipaliwanag sa pangunahing teksto kung sino ang kumain o nasiyahan sa nahuling hayop.
- source_word: וְרִבְקָה
  choice: ngunit mahal ni Rebeca
  rationale: Bagaman karaniwang 'at' ang וְ, malinaw na magkasalungat ang pagkiling ng dalawang magulang; likas na ipinahahayag ng 'ngunit' ang ugnayang ito.
- source_word: אֹהֶבֶת
  choice: mahal
  rationale: Ang participle ay nagpapahiwatig ng patuloy o kinagawiang saloobin; natural itong ipinahahayag sa Tagalog sa pamamagitan ng 'mahal ni Rebeca.'
- source_word: אֶת יַעֲקֹב
  choice: si Jacob
  rationale: Hindi isinasalin ang panandang tuwirang layon na אֶת; ginagamit ang nakagawiang anyo ng pangalan sa Filipino kasama ang si.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili sa pangunahing teksto ang kapansin-pansing idyomang Hebreo at ipinaliwanag lamang sa talababa ang malamang na kahulugan nito. Ang panghalip na “niya” ay hindi rin tahasang nilinaw upang hindi lampasan ang anyo ng pinagmulan.
