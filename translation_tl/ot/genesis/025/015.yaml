translation_notes:
  register: Maikli at marangal na talaan ng mga pangalan, gamit ang makabagong ortograpiyang Filipino. Walang talababa sapagkat hindi makabuluhang hiwalay na alternatibo sa Tagalog ang English na “Temah”; ang Hebreong anyo ay sapat na kinakatawan ng “Tema.”
