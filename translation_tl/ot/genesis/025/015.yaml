  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲדַד
  choice: Hadad
  rationale: Pangngalang pantangi sa talaan ng mga anak ni Ismael; tuwirang transliterasyon ng mga katinig sa Hebreo.
- source_word: תֵימָא
  choice: Tema
  rationale: Pangngalang pantangi; ang “Tema” ay malinaw at malapit sa anyong Hebreo, at hindi kailangang katawanin ng h ang pangwakas na aleph.
- source_word: יְטוּר
  choice: Jetur
  rationale: Pangngalang pantangi; pinanatili ang nakaugaliang biblikal na anyo na Jetur para sa Hebreong pangalan.
- source_word: נָפִישׁ
  choice: Nafis
  rationale: Pangngalang pantangi; ginamit ang baybay na likas sa makabagong Filipino, kung saan ang Hebreong pe na may tunog /f/ ay “f” at ang shin ay “s.”
- source_word: קֵדְמָה
  choice: Kedema
  rationale: Pangngalang pantangi; transliterasyong angkop sa bigkas at ortograpiyang Filipino, nang walang di-kailangang pangwakas na h.
- source_word: וְ / וָ
  choice: at
  rationale: Ang mga unlaping pang-ugnay ay nagdurugtong sa mga pangalan sa payak na talaan; sa natural na Filipino, mga kuwit at isang “at” bago ang huling pangalan ang ginamit.
