  yaml_path: translation/ot/genesis/025/033.yaml
  text: And Jacob said[b][a], “Swear to me today.” So he swore to him and sold his birthright to Jacob.
translation:
  language: tl
  text: Sinabi ni Jacob, “Sumumpa ka sa akin ngayon[a].” Kaya sumumpa si Esau kay Jacob at ipinagbili niya rito ang kanyang karapatan bilang panganay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa araw ding ito” o “mula sa araw na ito.”
    reason: lexical_alternative
  - marker: b
    text: Ang “karapatan bilang panganay” ay tumutukoy sa mga karapatan at katayuang nauukol sa panganay na anak na lalaki.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁבְעָה
  choice: Sumumpa ka
  rationale: Tuwirang pautos ito sa pormulang ginagamit sa panunumpa; likas at malinaw sa modernong Tagalog ang “Sumumpa ka.”
- source_word: לִּי
  choice: sa akin
  rationale: Tinutukoy ng ל na may hulaping unang panauhan ang taong pinatutungkulan ng sumpa.
- source_word: כַּיּוֹם
  choice: muna sa akin ngayon
  rationale: Ang pangunahing diwa ay panunumpa “ngayon” o “sa araw na ito.” Ginamit ang “muna” upang likas na maipahayag sa Tagalog ang agarang kundisyon sa konteksto, habang inilalagay sa talababa ang mas literal na mga posibilidad.
- source_word: וַיִּשָּׁבַע
  choice: sumumpa siya kay Jacob
  rationale: Pinananatili nito ang leksikal na ugnayan sa naunang utos at nililinaw sa Tagalog ang tinutukoy ng panghalip.
- source_word: וַיִּמְכֹּר
  choice: ipinagbili
  rationale: Tuwirang tumutukoy ang מכר sa pagbebenta at pinananatili ang katangiang transaksiyonal ng ginawa.
- source_word: בְּכֹרָתוֹ
  choice: ang karapatan niya bilang panganay
  rationale: Mas madaling maunawaan ng ordinaryong mambabasa kaysa sa teknikal o di-likas na “pagkapanganay,” at saklaw nito ang mga karapatan at katayuang kaugnay ng panganay.
- source_word: לְיַעֲקֹב
  choice: kay Jacob / rito
  rationale: Si Jacob ang tumanggap sa ipinagbiling karapatan; ginagamit ang “rito” sa ikalawang sugnay upang maiwasan ang mabigat na pag-uulit.
theological_decisions:
- issue: Kalikasan ng paglilipat ng בְּכֹרָה ni Esau
  choice: ipinagbili ang karapatan niya bilang panganay
  alternative: ipinagbili ang kanyang pagkapanganay
  rationale: Inilalarawan ng talata ang kongkretong pagbebenta ng karapatan at katayuang pampamilya ng panganay, nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Nilinaw ang mga reperente ng panghalip kung kailangan, ngunit pinanatili ang maigsi at mabilis na daloy ng salaysay.
