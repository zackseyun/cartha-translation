  text: וַ/יְהִ֤י יִצְחָק֙ בֶּן אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/קַחְתּ֣/וֹ אֶת רִבְקָ֗ה בַּת בְּתוּאֵל֙ הָֽ/אֲרַמִּ֔י מִ/פַּדַּ֖ן אֲרָ֑ם אֲח֛וֹת לָבָ֥ן הָ/אֲרַמִּ֖י ל֥/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/020.yaml
  text: Isaac was forty years old when he took Rebekah[a], the daughter of Bethuel the Aramean from Paddan-aram, the sister of Laban the Aramean[b], to be his wife.
translation:
  language: tl
  text: Apatnapung taong gulang si Isaac nang kunin niyang asawa si Rebeca[a], na anak ni Betuel na Arameo mula sa Padan-Aram at kapatid ni Laban na Arameo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na anyo: “nang kunin niya si Rebeca … upang maging asawa niya.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “Arameo” ay mas eksakto kaysa sa mas lumang tradisyonal na saling “Sirio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יִצְחָק בֶּן אַרְבָּעִים שָׁנָה
  choice: Apatnapung taong gulang si Isaac
  rationale: Ang pariralang Hebreo ay karaniwang idyoma sa pagsasaad ng edad; likas at malinaw sa modernong Tagalog ang napiling anyo.
- source_word: בְּקַחְתּוֹ ... לוֹ לְאִשָּׁה
  choice: nang kunin niyang asawa
  rationale: Pinananatili nito ang larawang ‘kumuha’ ng Hebreo habang malinaw na ipinahahayag ang konteksto ng pag-aasawa.
- source_word: רִבְקָה
  choice: Rebeca
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog.
- source_word: בַּת בְּתוּאֵל
  choice: anak ni Betuel
  rationale: Likas itong pahayag ng ugnayang pampamilya sa Tagalog at hindi nangangailangang tukuying ‘babaeng anak’ dahil kilala na si Rebeca bilang babae.
- source_word: הָאֲרַמִּי
  choice: Arameo
  rationale: Tumpak nitong tinutukoy ang pangkat-etnikong Aramean at iniiwasan ang mas luma ngunit di-gaanong eksaktong ‘Sirio.’
- source_word: מִפַּדַּן אֲרָם
  choice: mula sa Padan-Aram
  rationale: Pangalan ito ng lugar, kaya isinalin sa pamamagitan ng transliterasyon at pinanatili ang pinagmulan na ipinahahayag ng מִן.
- source_word: אֲחוֹת לָבָן
  choice: kapatid ni Laban
  rationale: Natural sa Tagalog ang ‘kapatid’; malinaw sa tinutukoy na si Rebeca na kapatid siyang babae ni Laban.
