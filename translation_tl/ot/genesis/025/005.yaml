  text: Abraham gave all that he had to Isaac[a].
translation:
  language: tl
  text: Ibinigay ni Abraham kay Isaac ang lahat ng kanyang pag-aari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na salin, “ang lahat ng sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ibinigay
  rationale: Ang נתן ay karaniwang nangangahulugang “magbigay.” Ang anyong wayyiqtol sa salaysay ay natural na isinalin sa naganap na aspekto bilang “Ibinigay.”
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Karaniwang anyo ng pangalang Hebreo sa modernong saling Tagalog.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tuwirang layon at wala itong hiwalay na katumbas sa Tagalog; naipapakita ang tungkulin nito sa ayos ng pangungusap.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: ang lahat ng kanyang pag-aari
  rationale: Saklaw nito ang lahat ng nauukol o pag-aari ni Abraham. Likas at malinaw ang “lahat ng kanyang pag-aari,” habang inilalahad sa talababa ang mas pormal na anyo.
- source_word: לְיִצְחָק
  choice: kay Isaac
  rationale: Ang לְ ay tumutukoy rito sa tumanggap; “kay Isaac” ang likas na gamit sa Tagalog para sa taong pinagbigyan.
