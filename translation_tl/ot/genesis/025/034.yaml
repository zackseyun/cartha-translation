base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/034.yaml
  text: And Jacob gave Esau bread and lentil stew[a], and he ate and drank and rose and went away[b]. Thus Esau despised the birthright.
translation:
  language: tl
  text: Binigyan ni Jacob si Esau ng tinapay at nilagang lentehas. Kumain siya at uminom, tumayo at umalis. Sa gayon, hinamak ni Esau ang karapatan bilang panganay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָתַן
  choice: binigyan
  rationale: Ito ang tuwiran at karaniwang katumbas ng pandiwang ‘nagbigay’ sa konstruksiyong may tumatanggap.
- source_word: לֶחֶם
  choice: tinapay
  rationale: Bagaman maaari rin itong tumukoy sa pagkain sa pangkalahatan, ang pagkakatabi nito sa nilaga ay pumapabor sa kongkretong kahulugang ‘tinapay.’
- source_word: נְזִיד עֲדָשִׁים
  choice: nilagang lentehas
  rationale: Likas sa modernong Filipino ang pariralang ito para sa lutong pagkaing gawa sa mga lentehas, nang hindi ito nililimitahan sa mas malabnaw na ‘sopas.’
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ וַיָּקָם וַיֵּלַךְ
  choice: Kumain siya at uminom, tumayo at umalis
  rationale: Pinananatili nito ang mabilis at sunod-sunod na kilos sa Hebreo, habang nananatiling natural at malinaw sa Filipino.
- source_word: וַיִּבֶז
  choice: hinamak
  rationale: Ipinahahayag nito ang matinding paghamak o pagwawalang-halaga nang hindi dinaragdagan ang moral na hatol ng teksto.
- source_word: הַבְּכֹרָה
  choice: ang karapatan bilang panganay
  rationale: Malinaw nitong tinutukoy ang natatanging karapatan at kalagayang kaugnay ng pagiging panganay, sa paraang madaling maunawaan ng modernong mambabasa.
theological_decisions:
- issue: Pangwakas na pagtataya sa pagpapahalaga ni Esau sa karapatan ng panganay
  choice: Sa gayon, hinamak ni Esau ang karapatan bilang panganay
  alternative: At hinamak ni Esau ang karapatan bilang panganay
  rationale: Ang ‘Sa gayon’ ay natural na naghahayag na ang pangwakas na pangungusap ay pagbubuod at pagtataya sa naunang mga kilos, ngunit hindi ipinapaliwanag nang higit sa sinasabi ng Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit payak. Pinanatili ang mabilis na ritmo ng magkakasunod na pandiwa, at iniwasan ang arkaikong pananalita o katawagang may denominasyonal na pahiwatig.
