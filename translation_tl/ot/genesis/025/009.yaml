base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/009.yaml
  text: His sons Isaac and Ishmael buried him in the cave of Machpelah[a], in the field of Ephron son of Zohar the Hittite, which is opposite Mamre.
translation:
  language: tl
  text: Inilibing siya ng mga anak niyang sina Isaac at Ismael sa kuweba ng Macpela, na nasa bukid ni Efron na Heteo, na anak ni Zohar. Ang bukid na ito ay nasa tapat ng Mamre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nasa harap ng Mamre” o “nakaharap sa Mamre.” Ang pananalitang Hebreo ay maaaring tumukoy sa isang lugar na nasa harap o nasa tapat ng isang palatandaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Inilibing siya
  rationale: Ang wayyiqtol ng קבר ay nagsasalaysay ng sumunod na pangyayari. Likas sa modernong Tagalog ang payak na pandiwang naganap; ang panghalip ay tumutukoy kay Abraham sa naunang talata.
- source_word: יִצְחָק וְיִשְׁמָעֵאל בָּנָיו
  choice: ng mga anak niyang sina Isaac at Ismael
  rationale: Pinananatili ang appositional na diwa at malinaw na ipinakikitang kapwa anak ni Abraham ang dalawang pinangalanan.
- source_word: אֶל מְעָרַת הַמַּכְפֵּלָה
  choice: sa kuweba ng Macpela
  rationale: Bagaman karaniwang may direksiyonal na diwa ang אֶל, hinihingi ng idyomang Tagalog sa konteksto ng paglilibing ang lokatibong “sa.” Isinalin ang pangalan ayon sa karaniwang baybay-Filipino.
- source_word: אֶל שְׂדֵה עֶפְרֹן
  choice: sa bukid ni Efron
  rationale: Tinutukoy ng ikalawang אֶל ang mas malawak na kinaroroonan ng kuweba. Natural sa Tagalog ang “bukid ni Efron” para sa construct na nagsasaad ng pagmamay-ari o kaugnayan.
- source_word: בֶּן צֹחַר הַחִתִּי
  choice: na anak ni Zohar na Heteo
  rationale: Tuwirang inililipat ang ugnayang angkan at ang katawagang etniko; ang “Heteo” ang nakasanayang anyong Filipino.
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: na nasa tapat ng Mamre
  rationale: Ang עַל־פְּנֵי sa paglalarawan ng lugar ay maaaring mangahulugang nasa harap, nakaharap, o nasa tapat. Ang “nasa tapat” ay malinaw ngunit hindi nagdaragdag ng direksiyong hindi tahasang nasa Hebreo.
