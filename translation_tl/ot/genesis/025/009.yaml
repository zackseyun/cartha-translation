translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “kuweba” at “bukid” bilang karaniwang salitang madaling maunawaan, habang pinanatili ang mga pangalang pantangi sa anyong angkop sa Filipino.
