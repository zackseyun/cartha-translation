  - severity: medium
    issue: Hindi ganap na malinaw ang tinutukoy ng “na nasa tapat ng Mamre.”
    rationale: Sa Hebreo, ang pangwakas na relative clause ay tumutukoy sa bukid ni Efron. Dahil sa sunod-sunod na panuring sa Tagalog, maaari itong maiugnay sa Efron o Zohar. Ang tahasang “Ang bukid na ito” ay nag-aalis ng kalabuan.
