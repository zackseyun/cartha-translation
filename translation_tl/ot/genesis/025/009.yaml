  source_fidelity: 'Tumpak ang pangunahing nilalaman: si Abraham ang inilibing nina Isaac at Ismael sa kuweba ng Macpela, sa bukid ni Efron, na nasa tapat ng Mamre. Gayunman, sa kasalukuyang ayos ng mga panuring, maaaring mabasa na si Zohar, sa halip na si Efron, ang tinutukoy ng “na Heteo,” at maaaring hindi rin malinaw na ang bukid ang nasa tapat ng Mamre.'
  naturalness: Likas at angkop sa modernong Tagalog ang karamihan ng salin. Mas magiging malinaw at natural ang pangungusap kung paghihiwalayin ang pangwakas na paglalarawan ng bukid upang maiwasan ang magkakapatong na mga sugnay na “na.”
  terminology: Ang “kuweba,” “bukid,” “Heteo,” at “nasa tapat” ay angkop. Pinanatili ang mga pangalang Isaac, Ismael, Macpela, Efron, Zohar, at Mamre nang walang di-kinakailangang interpretasyon.
