translation:
  language: tl
  text: Nang sumapit ang panahon ng panganganak niya, naroon nga ang kambal sa kanyang sinapupunan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת
  choice: Nang sumapit ang panahon ng panganganak niya
  rationale: Ang literal na idyomang Hebreo ay ‘napuno/naganap ang kanyang mga araw upang manganak.’ Isinalin ito sa likas na modernong Tagalog bilang pagsapit ng takdang panahon ng panganganak, habang pinananatili ang diwang lubos na natapos ang panahon.
- source_word: וְהִנֵּה
  choice: naroon nga
  rationale: Ipinahahayag ng וְהִנֵּה ang biglaang pagtawag-pansin sa makabuluhang natuklasan. Ang ‘nga’ ay nagbibigay-diin nang hindi gumagamit ng di-likas na ‘masdan.’
- source_word: תוֹמִם
  choice: ang kambal
  rationale: Tuwirang katumbas sa Tagalog ng pangmaramihang pangngalang tumutukoy sa dalawang sanggol na kambal.
- source_word: בְּבִטְנָהּ
  choice: sa kanyang sinapupunan
  rationale: Bagaman maaaring tumukoy ang בטן sa tiyan, sa konteksto ng panganganak ay mas tiyak at marangal ang ‘sinapupunan.’
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginawang likas ang Hebreong idyoma tungkol sa pagkapuno ng mga araw, at pinanatili ang diin ng וְהִנֵּה sa pamamagitan ng ‘nga.’
