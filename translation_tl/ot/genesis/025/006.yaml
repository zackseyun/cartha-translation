  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay wastong naipapahayag: binigyan ni Abraham ng mga kaloob ang mga anak ng kaniyang mga kalunya at ipinadala sila sa silangan habang siya ay buhay pa. Gayunman, ang “upang lumayo sa” ay nagdaragdag ng layuning hindi tahasang isinasaad ng מֵעַל (“palayo mula sa/mula sa piling ni”), at ang “pinaalis” ay maaaring magpahiwatig ng pagpapaalis o pagtataboy nang masidhi kaysa sa karaniwang “ipinadala palayo.”'
  naturalness: Marangal at modernong Filipino ang rehistro. Mas magiging likas at mas malapit sa source ang “ipinadala niya silang palayo sa anak niyang si Isaac” kaysa sa paghahating “pinaalis niya sila upang lumayo ... at pinapunta.”
  terminology: Ang “mga kalunya” ay angkop na maikli at teknikal na katumbas ng פִּילַגְשִׁים sa kontekstong ito. Ang “mga kaloob” ay angkop para sa מַתָּנֹת. Pinananatili ng “patungong silangan, sa lupain sa silangan” ang parehong direksiyon at destinasyon sa Hebreo.
  issues:
