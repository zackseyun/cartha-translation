  - severity: low
    issue: Ang “pinaalis” ay maaaring mas malakas kaysa sa source.
    rationale: Maaaring umugnay ang “pinaalis” sa pagtataboy o pagpapalayas, samantalang וַיְשַׁלְּחֵם ay “ipinadala/sinent away.” Ang “ipinadala ... palayo” ay tumpak at hindi labis.
