revisions:
- from: Ngunit binigyan ni Abraham ng mga kaloob ang mga anak ng kanyang mga kalunya[a]. Habang nabubuhay pa siya, pinaalis niya sila upang lumayo sa anak niyang si Isaac at pinapunta sa silangan, sa lupain sa silangan.[b]
  to: Ngunit binigyan ni Abraham ng mga kaloob ang mga anak ng kanyang mga kalunya[a]. Habang nabubuhay pa siya, ipinadala niya silang palayo sa anak niyang si Isaac, patungong silangan, sa lupain sa silangan.[b]
  rationale: Inayos ang pandiwa at pariralang naghahayag ng paghihiwalay upang maipakita ang simpleng pagpapadala palayo mula kay Isaac, nang walang idinagdag na layunin o masidhing pahiwatig ng pagtataboy. Iningatan ang pag-uulit ng “silangan” upang tumbasan ang direksiyong קֵדְמָה at ang destinasyong אֶל־אֶרֶץ קֶדֶם.
