  text: וְ/לִ/בְנֵ֤י הַ/פִּֽילַגְשִׁים֙ אֲשֶׁ֣ר לְ/אַבְרָהָ֔ם נָתַ֥ן אַבְרָהָ֖ם מַתָּנֹ֑ת וַֽ/יְשַׁלְּחֵ֞/ם מֵ/עַ֨ל יִצְחָ֤ק בְּנ/וֹ֙ בְּ/עוֹדֶ֣/נּוּ חַ֔י קֵ֖דְמָ/ה אֶל אֶ֥רֶץ קֶֽדֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/006.yaml
  text: But to the sons of his concubines[a], Abraham gave gifts, and while he was still alive he sent them away from his son Isaac[b], eastward to the land of the east.
translation:
  language: tl
  text: Ngunit binigyan ni Abraham ng mga kaloob ang mga anak ng kanyang mga kalunya[a]. Habang nabubuhay pa siya, ipinadala niya silang palayo sa anak niyang si Isaac, patungong silangan, sa lupain sa silangan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak ng mga kalunya ni Abraham.”
    reason: Pinananatili ng alternatibo ang tahasang pag-uugnay kay Abraham sa pariralang Hebreo.
  - marker: b
    text: Ang “lupain sa silangan” ay maaari ring isaling “silanganing lupain.”
    reason: Ang pariralang Hebreo ay maaaring tumukoy nang pangkalahatan sa rehiyong nasa silangan.
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Ngunit ... ang mga anak
  rationale: Ipinahahayag ng pangatnig ang paghahambing sa naunang talata, kung saan si Isaac ang tumanggap ng buong ari-arian; likas sa Tagalog ang “Ngunit” para sa ganitong pagsalungat.
- source_word: הַפִּילַגְשִׁים אֲשֶׁר לְאַבְרָהָם
  choice: ng kanyang mga kalunya
  rationale: Ang “kalunya” ay maikli at kinikilalang terminong Filipino para sa babaeng may kinikilalang ngunit nakabababang katayuang pangmag-asawa; tinutukoy ng “kanyang” si Abraham.
- source_word: נָתַן ... מַתָּנֹת
  choice: binigyan ... ng mga kaloob
  rationale: Natural na salin sa Filipino ng pandiwa at layon, at ang “kaloob” ay angkop sa marangal na rehistro at sa konteksto ng pamana.
- source_word: וַיְשַׁלְּחֵם
  choice: pinaalis niya sila
  rationale: Ipinakikita ng anyo sa Filipino na si Abraham ang nagpadala o nagpaalis sa kanila; nahuhuli ng “pinaalis” ang diwa ng pagpapalayo.
- source_word: מֵעַל יִצְחָק בְּנוֹ
  choice: upang lumayo sa anak niyang si Isaac
  rationale: Ipinapanatili ang malinaw na paghihiwalay kay Isaac, ang anak na sentro ng naunang pahayag tungkol sa pamana.
- source_word: בְּעוֹדֶנּוּ חַי
  choice: Habang nabubuhay pa siya
  rationale: Malinaw at likas na modernong Filipino para sa pagkilos ni Abraham bago siya mamatay.
- source_word: קֵדְמָה
  choice: sa silangan
  rationale: Ipinahahayag ang direksiyon ng paglalakbay na taglay ng Hebrew directional form.
- source_word: אֶל אֶרֶץ קֶדֶם
  choice: sa lupain sa silangan
  rationale: Malapit sa pormang Hebrew at pinananatili ang posibleng pagtukoy sa isang silanganing rehiyon nang hindi ito labis na tinutukoy.
theological_decisions:
- issue: Katayuan ng mga babaeng tinutukoy ng הַפִּילַגְשִׁים
  choice: mga kalunya
  alternative: mga pangalawahing asawa
  rationale: Pinananatili ng “kalunya” ang natatanging kategoryang panlipunan sa teksto nang hindi ipinapantay nang lubos sa pangunahing asawa o hinahatulan bilang lihim na relasyon.
translation_notes:
  register: 'Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kalunya” bilang maikli at teknikal na katawagan sa sinaunang kaayusang panlipunan; iniwasan ang mas kolokyal o mapanghusgang pananalita. Ang pag-uulit ng “silangan” ay sadyang nagpapanatili sa dalawang magkaugnay ngunit magkahiwalay na ekspresyong Hebrew: direksiyon at destinasyon.'
