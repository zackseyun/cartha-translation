base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/018.yaml
  text: They settled from Havilah to Shur[a], which is opposite Egypt as you go toward Asshur[b]. He settled opposite all his brothers.
translation:
  language: tl
  text: Nanirahan sila mula sa Havila hanggang sa Shur, na nasa tapat ng Ehipto sa daang patungong Ashur.[a] Nanirahan siya sa tapat ng lahat ng kapatid niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Ashur ay maaari ring isaling “Asirya.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring ipahiwatig ng idyomang Hebreo ang paninirahan sa tapat o sa harap ng lahat ng kapatid niya, o ang pamumuhay na salungat sa kanila. Literal na “bumagsak siya sa tapat ng lahat ng kapatid niya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכְּנוּ
  choice: Nanirahan sila
  rationale: Ang Qal wayyiqtol na maramihan ng שׁכן ay tumutukoy sa paninirahan o pagtira; likas at malinaw ang “nanirahan” sa makabagong Tagalog.
- source_word: מֵחֲוִילָה עַד שׁוּר
  choice: mula sa Havila hanggang sa Shur
  rationale: Pinananatili ang payak na pormulang heograpikal na nagsasaad ng saklaw ng kanilang tirahan.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: na nasa tapat ng Ehipto
  rationale: Ang עַל־פְּנֵי ay maaaring mangahulugang nasa harap o katapat; hindi tinutukoy ng salin ang isang tiyak na direksiyon na hindi tahasang nasa Hebreo.
- source_word: בֹּאֲכָה אַשּׁוּרָה
  choice: sa daang patungong Ashur
  rationale: Ipinahahayag nito ang pagkilos patungo sa Ashur. Pinanatili ang pangalang Ashur, habang inilagay sa talababa ang posibleng anyong Asirya.
- source_word: עַל־פְּנֵי כָּל־אֶחָיו נָפָל
  choice: Nanirahan siya sa tapat ng lahat ng kapatid niya
  rationale: Ang נפל ay literal na “bumagsak,” ngunit sa idyomang ito ay nauunawaang tumutukoy sa paglagak o paninirahan. Pinananatili ng “sa tapat” ang maaaring heograpikal o mapagsalungat na diwa ng עַל־פְּנֵי nang hindi ito labis na binibigyang-kahulugan.
theological_decisions:
- issue: Kahulugan ng idyomang עַל־פְּנֵי כָּל־אֶחָיו נָפָל
  choice: Nanirahan siya sa tapat ng lahat ng kapatid niya
  alternative: Namuhay siya na salungat sa lahat ng kapatid niya; o, literal, bumagsak siya sa harap ng lahat ng kapatid niya
  rationale: Malabo at pinagtatalunan ang idyoma. Maaaring ilarawan nito ang lokasyon ng mga inapo ni Ismael o ang kanilang mapagsalungat na ugnayan sa mga kamag-anak, lalo na sa liwanag ng Genesis 16:12. Ang pangunahing salin ay hindi tahasang nagpapasya sa pagitan ng mga diwang ito, at nililinaw sa talababa ang ambiguwidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nanirahan” sa halip na mas lumang “tumahan,” at pinanatili ang mga pangalang Havila, Shur, at Ashur sa anyong transliterado.
