translation_notes:
  register: Makabago at madaling maunawaang Filipino, ngunit marangal ang himig. Pinanatili sa pangunahing teksto ang literal na metaporang “kahubaran ng lupain” at ang payak na pandiwang “tingnan,” habang inilagay sa mga talababa ang kahulugang ipinahihiwatig ng konteksto.
