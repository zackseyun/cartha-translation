  text: But he said to them[a], “No[b], but you have come to see the nakedness of the land.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila, “Hindi! Kundi naparito kayo upang tingnan[a] ang kahubaran ng lupain[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “manmanan.” Literal na “tingnan” ang pandiwang Hebreo, ngunit sa konteksto ay pinararatangan sila ni Jose na nagsasagawa ng pagmamatyag bilang mga espiya.
    reason: lexical_alternative
  - marker: b
    text: O “ang mga lantad o walang depensang bahagi ng lupain.” Literal na “ang kahubaran ng lupain” ang Hebreo—isang metapora para sa mahihinang lugar na maaaring samantalahin ng mga mananalakay o espiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Ngunit sinabi niya sa kanila
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit ang tugon ay sumasalungat sa pagtanggi ng mga kapatid sa naunang talata; kaya likas dito ang “Ngunit.”
- source_word: לֹא
  choice: Hindi!
  rationale: Isang mariin at biglang pagtanggi ito sa sinabi nila. Pinananatili ng tandang padamdam ang puwersa ng maikling sagot nang hindi nagdaragdag ng paliwanag.
- source_word: כִּי
  choice: ipinahiwatig sa kasunod na tuwirang paratang
  rationale: Dito, ipinakikilala ng כִּי ang pagtutuwid sa kanilang pahayag. Sa Filipino, sapat at natural ang paghinto pagkatapos ng “Hindi!” at ang kasunod na paratang; ang tahasang “sapagkat” ay magiging mas mekanikal at maaaring magpalabo sa puwersang pasalungat.
- source_word: בָּאתֶם
  choice: Naparito kayo
  rationale: Ipinahihiwatig nito ang pagdating nila sa kinaroroonan ni Jose at ang kasalukuyang kabuluhan ng layunin ng kanilang pagpunta.
- source_word: לִרְאוֹת
  choice: upang tingnan
  rationale: Ang pandiwa ay literal na “makita/tingnan,” hindi ang karaniwang pandiwa para sa “manmanan.” Pinananatili nito ang sadyang payak na salita ng Hebreo habang naipapaliwanag sa talababa ang diwang paniniktik sa konteksto.
- source_word: עֶרְוַת הָאָרֶץ
  choice: ang kahubaran ng lupain
  rationale: Pinananatili ang matingkad na literal na metapora ng Hebreo. Tumutukoy ito sa lantad, mahina, o walang depensang mga bahagi ng lupain, ngunit hindi tahasang nilulutas sa pangunahing teksto ang talinghaga.
