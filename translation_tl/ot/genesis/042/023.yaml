  text: But they did not know that Joseph was listening[a], because the interpreter was between them.
translation:
  language: tl
  text: Ngunit hindi nila alam na nauunawaan ni Jose ang sinasabi nila[a], sapagkat nasa pagitan nila ang tagapagsalin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakikinig si Jose,” sa diwang nauunawaan niya ang sinasabi nila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Ngunit … nila
  rationale: Ipinahihiwatig ng pangatnig at tahasang panghalip ang pagsalungat sa naunang tagpo; natural itong naipapahayag sa Tagalog sa pamamagitan ng “Ngunit,” habang ang paksa ay makikita sa “nila.”
- source_word: לֹא יָדְעוּ
  choice: hindi nila alam
  rationale: Tuwirang ipinapahayag ng anyong qatal ng ידע ang kawalan nila ng kaalaman.
- source_word: כִּי
  choice: na
  rationale: Ang unang כִּי ay nagpapakilala sa nilalaman ng hindi nila alam.
- source_word: שֹׁמֵעַ
  choice: nauunawaan sila
  rationale: Pangunahing kahulugan ng שמע ang makarinig o makinig, ngunit sa konteksto ng usapang gumagamit ng tagapagsalin, ang punto ay nauunawaan ni Jose ang sinasabi nila. Pinananatili sa talababa ang mas literal na posibilidad.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa modernong Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Ang ikalawang כִּי ay nagbibigay ng dahilan kung bakit hindi nila alam na nauunawaan sila ni Jose.
- source_word: הַמֵּלִיץ
  choice: tagapagsalin
  rationale: Sa kontekstong ito, tumutukoy ang salita sa taong namamagitan upang maisalin ang sinasabi ng magkabilang panig.
- source_word: בֵּינֹתָם
  choice: sa pagitan nila
  rationale: Pinananatili nito ang larawan ng tagapagsaling namamagitan kay Jose at sa kanyang mga kapatid.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “tagapagsalin” bilang malinaw na katawagan sa interpreter at “nauunawaan sila” upang ihayag ang kontekstuwal na diwa ng pandiwang שמע nang hindi itinatago ang literal na pagbasa, na nasa talababa.
