  text: Lahat kami ay mga anak na lalaki ng iisang ama. Tapat kami[a]; ang mga lingkod mo ay hindi naging mga espiya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matapat” o “nagsasabi ng totoo.” Inilalarawan sila ng Hebreo bilang mapagkakatiwalaan o taimtim, salungat sa paratang na sila ay mga espiya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi mga espiya ang mga lingkod mo” o “hindi mga espiya ang mga lingkod mo noon.” Maaaring likas na katawanin sa iba’t ibang paraan ang pagkakabuo ng parirala sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: kaming lahat
  rationale: Malinaw na ipinahahayag ang kabuuan ng pangkat at pinananatili ang diin ng Hebreo.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: mga anak na lalaki ng iisang ama
  rationale: Tumutukoy ito sa magkakapatid na lalaki. Ginamit ang “ama” bilang likas na salin sa kontekstong pampamilya, bagaman literal na “isang lalaki” ang Hebreo.
- source_word: כֵּנִים
  choice: tapat
  rationale: Ipinahihiwatig na sila ay mapagkakatiwalaan at nagsasabi ng totoo, bilang pagsalungat sa paratang na sila ay mga espiya.
- source_word: עֲבָדֶיךָ
  choice: kaming mga lingkod mo
  rationale: Magalang na pagtukoy nila sa sarili sa harap ng isang pinuno; hindi binibigyang-diin dito ang kalagayan ng pagkaalipin.
- source_word: מְרַגְּלִים
  choice: mga espiya
  rationale: Ito ang malinaw at karaniwang katawagan sa mga taong lihim na nagmamanman sa kontekstong ito.
- source_word: לֹא הָיוּ ... מְרַגְּלִים
  choice: hindi naging mga espiya
  rationale: Pinananatili ang anyong may הָיוּ (“naging/ay”) at ang pagtanggi sa ipinaparatang na katayuan o gawain, nang hindi labis na nililinaw ang aspektong maaaring isaling pangkasalukuyan o pangnagdaan.
