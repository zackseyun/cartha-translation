  text: On the third day Joseph said to them[a], “Do this and live, for I fear God.
translation:
  language: tl
  text: Noong ikatlong araw, sinabi ni Jose sa kanila, “Gawin ninyo ito at mabubuhay kayo[a], sapagkat may takot ako sa Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Gawin ninyo ito upang mabuhay kayo.” Maaaring ipahayag ng Hebreo ang isang utos na sinusundan ng bunga, o isang ipinahihiwatig na layunin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  choice: sinabi sa kanila ni Jose
  rationale: Likas na ayos sa modernong Tagalog para sa pagsasalita ni Jose sa kanila; pinananatili ang tahasang di-tuwirang layon.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Nang ikatlong araw
  rationale: Karaniwang Tagalog na panandang temporal para sa Hebreong pariralang tumutukoy sa ikatlong araw.
- source_word: זֹאת עֲשׂוּ
  choice: Gawin ninyo ito
  rationale: Tuwirang salin ng demonstratibo at pangmaramihang pautos.
- source_word: וִחְיוּ
  choice: at mabubuhay kayo
  rationale: Ipinapahayag nang natural sa Tagalog ang bunga ng pagsunod habang pinananatili sa talababa ang posibilidad ng layuning ‘upang mabuhay kayo.’
- source_word: אֶת הָאֱלֹהִים
  choice: sa Diyos
  rationale: Sa konteksto ng salaysay, ang may artikulong אֱלֹהִים ay tumutukoy sa Diyos; hinihingi rin ng idyomang Tagalog na ‘may takot’ ang pang-ukol na ‘sa.’
- source_word: אֲנִי יָרֵא
  choice: May takot ako
  rationale: Natural at marangal na Tagalog para sa predikatibong participle na nagsasaad ng palagian o katangiang paggalang at pagkatakot.
theological_decisions:
- issue: Kahulugan ng אֶת הָאֱלֹהִים אֲנִי יָרֵא
  choice: May takot ako sa Diyos
  alternative: Natatakot ako sa Diyos
  rationale: Ang ‘may takot ako sa Diyos’ ay mas malinaw na nagpapahiwatig ng mapitagang pagkilala bilang katangian ni Jose, hindi lamang panandaliang pangamba, nang hindi nagdaragdag ng paliwanag sa teksto.
- issue: Ugnayan ng וִחְיוּ sa naunang pautos
  choice: at mabubuhay kayo
  alternative: upang mabuhay kayo
  rationale: Maaaring ipahayag ng pagkakasunod ng mga pautos ang bunga o layunin. Pinili sa pangunahing teksto ang bungang pagbasa at inilagay ang alternatibo sa talababa upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang ‘Jose,’ ang karaniwang anyo ng pangalan sa tradisyong Tagalog. Ang tutuldok bago ang talababa ay nag-uugnay sa kasunod na dahilan ng utos.
