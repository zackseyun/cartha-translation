base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/025.yaml
  text: Then Joseph gave orders to fill their containers with grain[a], to return each man's silver to his sack, and to give them provisions for the journey[d][c][b]. And so it was done for them.
translation:
  language: tl
  text: Pagkatapos, iniutos ni Jose na punuin ng butil ang kanilang mga sisidlan[a], ibalik ang pilak[b] ng bawat isa sa kani-kaniyang sako, at bigyan sila ng baon para sa paglalakbay. At gayon nga ang ginawa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang mga lalagyan.” Mas malawak ang salitang Hebreo rito kaysa sa “sako,” na ibang salita ang ginamit sa bandang huli ng talata.
    reason: lexical_alternative
  - marker: b
    text: Ang “pilak” ay maaari ring mangahulugang “salapi” sa kontekstong ito.
    reason: lexical_alternative
  - marker: c
    text: O “At ginawa niya iyon.” Hindi tahasang tinutukoy sa Hebreo kung sino ang nagsagawa ng utos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: iniutos
  rationale: Ang צוה ay tumutukoy sa pagbibigay ng utos. Likas sa modernong Tagalog ang “iniutos” sa di-tuwirang utos na sinusundan ng “na.”
- source_word: כְּלֵיהֶם
  choice: kanilang mga sisidlan
  rationale: Malawak ang kahulugan ng כְּלִי bilang sisidlan o kagamitan. Pinananatili ng “mga sisidlan” ang pagkakaiba nito sa שַׂק, na espesipikong “sako” sa kasunod na parirala.
- source_word: בָּר
  choice: butil
  rationale: Sa konteksto ng taggutom at pagbili ng pagkain, tumutukoy ang בָּר sa inaning butil. Hindi ito nililimitahan sa isang uri gaya ng trigo.
- source_word: וּלְהָשִׁיב כַּסְפֵּיהֶם
  choice: ibalik ang pilak
  rationale: Ang כֶּסֶף ay literal na “pilak” at maaari ring tumukoy sa salapi. Ang “pilak” ay nagpapanatili sa kongkretong pananalita ng salaysay.
- source_word: אִישׁ אֶל שַׂקּוֹ
  choice: ng bawat isa sa kani-kaniyang sako
  rationale: Ginagamit ang אִישׁ nang pamahagi, kaya ang “bawat isa” ay natural at tumpak. Ang שַׂק ay isinaling “sako,” na naiiba sa mas malawak na כְּלִי.
- source_word: וְלָתֵת לָהֶם צֵדָה לַדָּרֶךְ
  choice: at bigyan sila ng baon para sa paglalakbay
  rationale: Ang צֵדָה ay pagkaing o panustos na dinadala sa paglalakbay. Karaniwan at malinaw sa Tagalog ang “baon” sa ganitong konteksto.
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: At gayon nga ang ginawa para sa kanila
  rationale: Isahan ang pandiwa ngunit hindi tahasang tinutukoy ang gumagawa. Ang anyong ito ay pinananatili ang diin sa pagtupad sa utos nang hindi nagpapakilala ng tiyak na tagaganap.
