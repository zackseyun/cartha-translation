  to: Pagkatapos, iniutos ni Jose na punuin ng butil ang kanilang mga sisidlan[a], ibalik ang pilak[b] ng bawat isa sa kani-kaniyang sako, at bigyan sila ng baon para sa paglalakbay. At gayon nga ang ginawa.[c]
