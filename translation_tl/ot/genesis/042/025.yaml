translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Jose” bilang karaniwang anyong Tagalog ng pangalan. Pinanatili ang leksikal na pagkakaiba ng “mga sisidlan” at “sako,” at hindi nilutas ang kalabuan tungkol sa tagaganap ng huling sugnay.
