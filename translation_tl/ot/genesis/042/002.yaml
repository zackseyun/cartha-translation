  text: He said[a], “Look, I have heard that there is grain in Egypt. Go down there and buy some for us from there[b], so that we may live and not die.”
translation:
  language: tl
  text: Sinabi niya, “Narinig kong may butil sa Ehipto. Bumaba kayo roon at bumili kayo roon ng butil para sa atin, upang mabuhay tayo at hindi mamatay.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Hindi isinalin nang hiwalay
  rationale: Ang pantawag-pansing gamit nito ay likas nang naipahihiwatig ng tuwirang pahayag na “Narinig kong…”; ang literal na “Tingnan ninyo” ay hindi natural sa modernong Tagalog sa kontekstong ito.
- source_word: שָׁמַעְתִּי
  choice: Narinig kong
  rationale: Likas at kasalukuyang Tagalog para sa impormasyong natanggap at may kabuluhan pa sa kasalukuyan.
- source_word: שֶׁבֶר
  choice: mabibiling butil
  rationale: Sa konteksto ng taggutom, tumutukoy ito sa butil na ipinagbibili; nililinaw ng “mabibili” ang komersiyal na diwa na kaugnay ng kasunod na pandiwa.
- source_word: רְדוּ
  choice: Bumaba kayo
  rationale: Pinananatili ang direksiyonal na diwa ng paglalakbay mula Canaan patungong Ehipto.
- source_word: שָׁמָּה
  choice: roon
  rationale: Natural na direksiyonal na pang-abay sa Tagalog.
- source_word: וְשִׁבְרוּ
  choice: bumili ng butil
  rationale: Ang pandiwa sa kontekstong ito ay partikular na nangangahulugang bumili ng butil; ang pag-uulit ng “butil” ay malinaw at hindi mabigat sa Tagalog.
- source_word: לָנוּ
  choice: para sa atin
  rationale: Ipinapahayag ang dative of advantage at kasama rito ang nagsasalita at ang kanyang sambahayan.
- source_word: מִשָּׁם
  choice: Hindi inulit nang hiwalay
  rationale: Ang “roon” sa “Bumaba kayo roon” ay malinaw nang tumutukoy sa Ehipto; ang “mula roon” pagkatapos ng “bumili” ay magiging mabigat at kalabisan sa natural na Tagalog.
- source_word: וְנִחְיֶה
  choice: nang mabuhay tayo
  rationale: Ipinapakita ng “nang” ang layunin o inaasahang bunga ng pagbili.
- source_word: וְלֹא נָמוּת
  choice: at hindi mamatay
  rationale: Pinananatili ang magkatimbang na positibo at negatibong pahayag ng Hebreo.
