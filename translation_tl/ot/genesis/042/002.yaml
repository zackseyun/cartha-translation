translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “butil” sa halip na mas malawak na “pagkain,” at pinanatili ang “bumaba” upang maipakita ang heograpikong pananaw ng tekstong Hebreo.
