  yaml_path: translation/ot/genesis/042/030.yaml
  text: The man, the lord of the land, spoke harshly with us and treated us as spies of the land.
translation:
  language: tl
  text: Ang lalaking iyon, ang panginoon ng lupain, ay nagsalita sa amin nang mabagsik at itinuring niya kaming mga espiya sa lupain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנֵי הָאָרֶץ
  choice: ang panginoon ng lupain
  rationale: Pinananatili ang karaniwang titulong tumutukoy sa taong may kapangyarihan sa lupain, hindi ang banal na pangalang PANGINOON.
- source_word: דִּבֶּר ... אִתָּנוּ קָשׁוֹת
  choice: nagsalita sa amin nang mabagsik
  rationale: Likas sa modernong Tagalog at tapat sa diwang marahas o mahigpit ang paraan ng pagsasalita.
- source_word: וַיִּתֵּן אֹתָנוּ כִּמְרַגְּלִים
  choice: itinuring niya kaming mga espiya
  rationale: Ang idyomang Hebreo ay nangangahulugang itinakda o ibinilang sila bilang mga espiya; malinaw itong naihahayag ng “itinuring.”
- source_word: מְרַגְּלִים אֶת הָאָרֶץ
  choice: mga espiya sa lupain
  rationale: Pinananatili ang kaugnayan ng pag-eespiya sa lupain nang hindi nagdaragdag ng paliwanag na wala sa talata.
