  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kani-kaniyang” upang likas na katawanin ang distributibong anyo ng Hebreo, at iniwasan ang masyadong literal ngunit alanganing panimulang “At nangyari.”
