  yaml_path: translation/ot/genesis/042/035.yaml
  text: And as they were emptying their sacks[a], behold, each man’s bundle of silver was in his sack; and they saw their bundles of silver, they and their father[b], and they were afraid.
translation:
  language: tl
  text: At habang iniuubos nila ang laman ng kanilang mga sako, bigla nilang nakita na ang balot ng pilak ng bawat isa ay nasa kani-kaniyang sako.[a] Nang makita nila at ng kanilang ama ang mga balot ng kanilang pilak, natakot sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “supot ng salapi ng bawat isa.” Ang salitang Hebreo ay tumutukoy sa isang bagay na itinali o ibinalot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵם מְרִיקִים
  choice: Habang iniuubos nila ang laman
  rationale: Ginagawang natural sa modernong Tagalog ang Hebreong panimulang salaysay at kasabay na kilos, nang hindi gumagamit ng mabigat na literal na pariralang “at nangyari.”
- source_word: שַׂקֵּיהֶם
  choice: kanilang mga sako
  rationale: Ang “sako” ay tuwiran at angkop sa sisidlan ng butil o mga kalakal sa konteksto.
- source_word: וְהִנֵּה
  choice: nakita nilang
  rationale: Ipinahahayag sa natural na Tagalog ang biglaang pagkatuklas na minamarkahan ng הִנֵּה; ang sorpresa ay malinaw mula sa pagkakatagpo sa pilak.
- source_word: אִישׁ ... בְּשַׂקּוֹ
  choice: nasa kani-kaniyang sako
  rationale: Ang distributibong אִישׁ ay likas na naipahahayag ng “kani-kaniya,” na nagpapakitang bawat isa ay may balot sa sariling sako.
- source_word: צְרוֹר כַּסְפּוֹ
  choice: balot ng kanilang pilak
  rationale: Ang צְרוֹר ay bagay na itinali o ibinalot; pinananatili ng “balot” ang konkretong larawan, habang ang “pilak” ay tumutukoy sa pilak na ginamit bilang salapi.
- source_word: הֵמָּה וַאֲבִיהֶם
  choice: nila at ng kanilang ama
  rationale: Tahasang pinananatili ang dalawang pangkat na nakakita—ang magkakapatid at ang kanilang ama—sa natural na ayos ng Tagalog.
- source_word: וַיִּירָאוּ
  choice: natakot sila
  rationale: Karaniwang makabagong Tagalog para sa biglang reaksiyon ng takot sa kanilang nakita.
