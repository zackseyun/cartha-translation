  text: וְ֠/הָבִיאוּ אֶת אֲחִי/כֶ֣ם הַ/קָּטֹן֮ אֵלַ/י֒ וְ/אֵֽדְעָ֗ה כִּ֣י לֹ֤א מְרַגְּלִים֙ אַתֶּ֔ם כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֶת אֲחִי/כֶם֙ אֶתֵּ֣ן לָ/כֶ֔ם וְ/אֶת הָ/אָ֖רֶץ תִּסְחָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/034.yaml
  text: Bring your youngest brother to me[a], so that I may know that you are not spies, but honest men. Then I will give your brother back to you, and you may trade in the land.”
translation:
  language: tl
  text: “Dalhin ninyo sa akin ang bunso ninyong kapatid, upang malaman kong hindi kayo mga espiya kundi mga tapat na tao. Pagkatapos, ibabalik ko sa inyo ang kapatid ninyo, at maaari kayong mangalakal sa lupain[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at maaari kayong maglakbay sa buong lupain.” Maaari ring tumukoy nang mas malawak ang pandiwang Hebreo sa malayang paglalakbay o pag-ikot, bagaman higit na angkop sa konteksto rito ang kahulugang pangangalakal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָבִיאוּ
  choice: Dalhin ninyo
  rationale: Ang Hiphil imperative ng בוא ay isang tuwirang utos; likas sa modernong Tagalog ang “Dalhin ninyo.”
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: ang bunso ninyong kapatid
  rationale: Sa konteksto ng magkakapatid, ang הַקָּטֹן ay tumutukoy sa pinakabata; malinaw at natural itong ipinahahayag ng “bunso.”
- source_word: אֵלַי
  choice: sa akin
  rationale: Tuwirang katumbas ng pariralang nagsasaad ng patutunguhan.
- source_word: וְאֵדְעָה
  choice: upang malaman ko
  rationale: Ang cohortative ay nagpapahayag ng layunin o nilalayong bunga ng utos.
- source_word: כִּי לֹא מְרַגְּלִים אַתֶּם
  choice: hindi kayo mga espiya
  rationale: Ang מְרַגְּלִים ay tumutukoy sa mga espiya; pinananatili ng salin ang tahasang paratang at maramihang anyo.
- source_word: כִּי כֵנִים אַתֶּם
  choice: kundi mga tapat na tao
  rationale: Ang כֵנִים ay nagsasaad ng pagiging mapagkakatiwalaan o tapat; natural sa Tagalog ang kaibahan ng “mga espiya” at “mga tapat na tao.”
- source_word: אֶת אֲחִיכֶם אֶתֵּן לָכֶם
  choice: ibabalik ko sa inyo ang kapatid ninyo
  rationale: Literal na “ibibigay ko sa inyo,” ngunit malinaw sa konteksto na ang kapatid na nakapiit ay ibabalik sa kanila.
- source_word: וְאֶת הָאָרֶץ תִּסְחָרוּ
  choice: at maaari kayong mangalakal sa lupain[a]
  rationale: Karaniwang may komersiyal na kahulugan ang סחר, at ang “mangalakal” ay angkop sa konteksto ng pagbili ng pagkain; minarkahan ang mas malawak na posibleng kahulugan sa talababa.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinili ang “bunso” bilang likas na katawagan sa pinakabatang kapatid at “mangalakal” upang mapanatili ang pangunahing komersiyal na diwa ng pandiwang Hebreo.
