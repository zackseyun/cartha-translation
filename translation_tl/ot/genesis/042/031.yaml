  text: And we said to him[a], ‘We are honest men[b]; we have not been spies.’
translation:
  language: tl
  text: At sinabi namin sa kanya, “Mga tapat na tao[a] kami; hindi kami mga espiya.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga matuwid na tao” o “mga taong mapagkakatiwalaan.”
    reason: lexical_alternative
  - marker: b
    text: 'May anyong nakaraan sa Hebreo: “hindi kami noon mga espiya”; maaari ring unawain na “hindi kami naniniktik.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: At sinabi namin
  rationale: Ang wayyiqtol ng אמר ay nagsasalaysay ng sumunod na pangyayari; natural na ipinapahayag ito sa Tagalog bilang “At sinabi namin.”
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Ang אֶל na may hulaping ikatlong panauhang panlalaki ay tuwirang nangangahulugang “sa kanya.”
- source_word: כֵּנִים
  choice: mga tapat na tao
  rationale: Sa kontekstong ito, inilalarawan ng כֵּנִים ang magkakapatid bilang mapagkakatiwalaan at hindi mapanlinlang, salungat sa paratang na sila ay mga espiya. Likas at malinaw sa modernong Tagalog ang “mga tapat na tao.”
- source_word: אֲנָחְנוּ
  choice: kami
  rationale: Ang nakahiwalay na panghalip ay nagbibigay-diin sa nagsasalita. Ang “kami” ang wastong eksklusibong panghalip dahil kausap nila ang isang taong hindi kabilang sa kanilang pangkat.
- source_word: לֹא הָיִינוּ
  choice: hindi kami
  rationale: Ang negatibong anyo ng היה kasama ng participle ay tumatanggi sa kanilang kalagayan o gawain bilang mga espiya. Sa natural na Tagalog, sapat ang “hindi kami” bago ang panaguring pangngalan; ipinaliliwanag sa talababa ang mas literal na aspektong nakaraan.
- source_word: מְרַגְּלִים
  choice: mga espiya
  rationale: Ang participle ng רגל ay tumutukoy rito sa mga taong nagsisilbing espiya. Ang “mga espiya” ang karaniwan at tuwirang katumbas sa Tagalog.
