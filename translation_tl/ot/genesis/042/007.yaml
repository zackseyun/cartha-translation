base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/007.yaml
  text: When Joseph saw his brothers[a], he recognized them, but he acted like a stranger toward them and spoke harshly with them. He said to them, “Where have you come from?” And they said, “From the land of Canaan[b], to buy food.”
translation:
  language: tl
  text: Nang makita ni Jose ang kanyang mga kapatid, nakilala niya sila, ngunit nagkunwari siyang hindi sila kilala[a] at mabagsik siyang nagsalita sa kanila. Sinabi niya sa kanila, “Saan kayo nanggaling?” Sumagot sila, “Mula sa lupain ng Canaan, para bumili ng pagkain[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagkunwari siyang estranghero sa kanila” o “ginawa niyang hindi siya makilala.” Maaaring tumukoy ang Hebreo sa pagpapakitang banyaga o hindi kakilala sa kanila, hindi kinakailangang sa pisikal na pagbabalatkayo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para bumili ng butil.” Sa konteksto ng taggutom, ang pandiwang Hebreo ay madalas tumukoy sa pagbili ng butil, bagaman ang pangngalan dito ay ang mas malawak na “pagkain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יוֹסֵף אֶת־אֶחָיו
  choice: Nang makita ni Jose ang kanyang mga kapatid
  rationale: Ginagamit ang “Nang” upang natural na maiugnay sa Filipino ang pagkakita sa kasunod na pagkilala, habang pinananatili ang takbo ng salaysay.
- source_word: וַיַּכִּרֵם
  choice: nakilala niya sila
  rationale: Ang Hiphil ng נכר ay tumutukoy sa pagkilala o pagtukoy sa pagkakakilanlan ng mga tao.
- source_word: וַיִּתְנַכֵּר אֲלֵיהֶם
  choice: nagkunwari siyang hindi sila kilala
  rationale: Likas sa modernong Filipino at ipinahahayag ang pagpapanggap ni Jose na banyaga o hindi kakilala sa pakikitungo sa kanila, nang hindi ipinapalagay na pisikal siyang nagbalatkayo.
- source_word: וַיְדַבֵּר אִתָּם קָשׁוֹת
  choice: marahas siyang nagsalita sa kanila
  rationale: Inilalarawan ng קָשׁוֹת ang matindi at mabagsik na paraan ng pagsasalita; ang “marahas” ay dignified at malinaw sa konteksto.
- source_word: מֵאַיִן בָּאתֶם
  choice: Saan kayo nanggaling?
  rationale: Ito ang natural at tuwirang paraan sa Filipino ng pagtatanong tungkol sa pinanggalingan.
- source_word: מֵאֶרֶץ כְּנַעַן
  choice: Mula sa lupain ng Canaan
  rationale: Pinananatili ang tahasang heograpikong pariralang “lupain ng Canaan” ng Hebreo.
- source_word: לִשְׁבָּר אֹכֶל
  choice: para bumili ng pagkain
  rationale: Ang שבר ay pagbili ng panustos, madalas ay butil sa salaysay ng taggutom, samantalang ang אֹכֶל ay mas malawak na “pagkain.”
