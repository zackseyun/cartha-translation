translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nagkunwari siyang hindi sila kilala” upang maipahayag ang relasyonal na diwa ng Hitpael nang hindi tahasang nagdaragdag ng pisikal na pagbabalatkayo. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
