base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/037.yaml
  text: Then Reuben said to his father[a], “You may put my two sons to death if I do not bring him back to you. Put him in my hand, and I myself will bring him back to you.”
translation:
  language: tl
  text: Sinabi ni Ruben sa kanyang ama, “Maaari mong patayin ang dalawa kong anak kung hindi ko siya maibabalik sa iyo. Ipagkatiwala mo siya sa akin[a], at ako mismo ang magbabalik sa kanya sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Ilagay mo siya sa aking kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר רְאוּבֵן אֶל אָבִיו
  choice: Sinabi ni Ruben sa kanyang ama
  rationale: Likas na salaysay sa makabagong Tagalog; sapat nang ipinahihiwatig ng ayos ng pangungusap ang pagsulong ng pangyayari.
- source_word: אֶת שְׁנֵי בָנַי תָּמִית
  choice: Maaari mong patayin ang dalawa kong anak
  rationale: Ipinapahayag ang matinding panagot na iniaalok ni Ruben; ang Hiphil ng מות ay causative, at natural itong maipahayag bilang “patayin” sa Tagalog.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: kung hindi ko siya maibabalik sa iyo
  rationale: Pinananatili ang kondisyong may pagtanggi, habang nililinaw ng “maibabalik” ang kontekstong iuuwi muli si Benjamin sa ama.
- source_word: תְּנָה אֹתוֹ עַל יָדִי
  choice: Ipagkatiwala mo siya sa akin
  rationale: Natural na salin ng Hebreong idyomang literal na “ilagay mo siya sa aking kamay”; ang konkretong larawan ay inilagay sa talababa.
- source_word: וַאֲנִי
  choice: at ako mismo
  rationale: Ipinananatili ang diin ng hayag na panghalip na אֲנִי.
- source_word: אֲשִׁיבֶנּוּ אֵלֶיךָ
  choice: ang magbabalik sa kanya sa iyo
  rationale: Ang Hiphil ng שוב ay nangangahulugang magpabalik o magdala pabalik; natural sa Tagalog ang “magbabalik sa kanya.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ruben,” ang karaniwang anyong Filipino ng pangalan. Pinanatili ang tindi ng mapanganib na pangako ni Ruben nang hindi ito pinapaliwanag o pinahihina.
