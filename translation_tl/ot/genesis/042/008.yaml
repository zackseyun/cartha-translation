base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/008.yaml
  text: Joseph recognized his brothers[a], but they did not recognize him.
translation:
  language: tl
  text: Nakilala ni Jose ang mga kapatid niyang lalaki, ngunit hindi nila siya nakilala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: Nakilala
  rationale: Ang Hifil ng נכר sa kontekstong ito ay nangangahulugang makilala ang isang taong dati nang kilala. Likas sa makabagong Tagalog ang “nakilala” at pinananatili nito ang paghahambing sa ikalawang sugnay.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: אֶת־אֶחָיו
  choice: ang kanyang mga kapatid
  rationale: Tumutukoy ang panlalaking maramihan ng אָח na may hulaping ikatlong panauhang panlalaki sa mga kapatid na lalaki ni Jose; sa konteksto, malinaw na sila ang kanyang mga kapatid na lalaki, at natural sa Tagalog ang “mga kapatid.”
- source_word: וְהֵם
  choice: ngunit ... nila
  rationale: Bagaman karaniwang nangangahulugang “at” ang ו, pasalungat ang ugnayan dito. Ipinahahayag ng “ngunit” ang malinaw na paghahambing sa pagkilala ni Jose at sa hindi pagkilala sa kanya ng kanyang mga kapatid.
- source_word: לֹא
  choice: hindi
  rationale: Direkta at likas na paraan ito ng pagpapahayag ng pagtanggi sa Tagalog.
- source_word: הִכִּרֻהוּ
  choice: siya nakilala
  rationale: Mula ito sa parehong pandiwang נכר na ginamit sa unang sugnay. Ang pag-uulit ng “nakilala” ay nagpapanatili sa leksikal na pag-uulit at kabalintunaan ng salaysay; ang “siya” ay tumutukoy kay Jose.
theological_decisions: []
