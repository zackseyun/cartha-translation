  source_fidelity: 'Tumpak na naihahatid ng salin ang sunod-sunod na kilos: dumating ang magkakapatid kay Jacob, ipinaalam nila ang lahat ng nangyari sa kanila, at ipinakilala ang kasunod na tuwirang pananalita. Ang “sa lupain ng Canaan” ay idiomatikong inilalagay ang pagdating kay Jacob sa Canaan at tumutugon nang sapat sa Hebreong directional na parirala.'
