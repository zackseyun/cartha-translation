  text: וַ/יָּבֹ֛אוּ אֶל יַעֲקֹ֥ב אֲבִי/הֶ֖ם אַ֣רְצָ/ה כְּנָ֑עַן וַ/יַּגִּ֣ידוּ ל֔/וֹ אֵ֛ת כָּל הַ/קֹּרֹ֥ת אֹתָ֖/ם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/029.yaml
  text: Then they came to Jacob their father in the land of Canaan and told him all that had happened to them[a], saying,
translation:
  language: tl
  text: Pagkatapos, dumating sila sa kanilang amang si Jacob sa lupain ng Canaan at isinalaysay nila sa kanya ang lahat ng nangyari sa kanila. Sinabi nila,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Pagkatapos, dumating sila
  rationale: Ang wayyiqtol ng בוא ay nagsusulong sa pagkakasunod-sunod ng salaysay; likas sa modernong Tagalog ang “Pagkatapos, dumating sila.”
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: sa kanilang amang si Jacob
  rationale: Pinananatili ang direksiyong ipinahihiwatig ng אֶל at ang ugnayang pampamilya ng אֲבִיהֶם, habang ginagamit ang likas na ayos ng parirala sa Tagalog.
- source_word: אַרְצָה כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Ang hulaping paturol sa direksiyon ay nagpapahiwatig ng pagpunta sa Canaan. Kasunod ng “dumating ... sa kanilang amang si Jacob,” ang “sa lupain ng Canaan” ay natural na tumutukoy sa kinaroroonan ng pagdating nang hindi inuulit nang alanganin ang destinasyon.
- source_word: וַיַּגִּידוּ לוֹ
  choice: at isinalaysay nila sa kanya
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi o mag-ulat. Ang “isinalaysay” ay angkop dahil iniulat nila ang kabuuan ng kanilang mga naranasan.
- source_word: אֵת כָּל הַקֹּרֹת אֹתָם
  choice: ang lahat ng nangyari sa kanila
  rationale: Tuwirang ipinapahayag ang kabuuan ng mga pangyayaring sumapit sa kanila at natural itong pakinggan sa modernong Tagalog.
- source_word: לֵאמֹר
  choice: Sinabi nila,
  rationale: Ipinakikilala nito ang tuwirang pananalitang sumusunod. Mas natural sa Tagalog ang isang bagong pangungusap kaysa sa literal na “na sinasabi.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tuloy-tuloy na salaysay. Ginamit ang “amang si Jacob” bilang natural na anyo ng appositive at iniwasan ang labis na literal na dobleng pariralang patunguhan.
