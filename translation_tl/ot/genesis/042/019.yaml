  - severity: medium
    issue: Ang “ikulong ang isa” ay hindi malinaw na nagpapakita sa pasibong anyo ng יֵאָסֵר.
    rationale: Bagaman katanggap-tanggap ang utos sa antas ng diwa, mas matapat ang “ang isa ... ay manatiling nakakulong” o “ay makulong,” na pinananatili ang kapatid bilang paksa ng pasibong pagkakabilanggo.
  - severity: low
    issue: Mabigat ang “para sa taggutom ng inyong mga sambahayan.”
