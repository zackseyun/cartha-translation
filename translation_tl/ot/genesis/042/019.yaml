base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/019.yaml
  text: If you are honest[a], let one of your brothers be confined in your place of custody, and you[c][b], go and bring grain for the famine of your households.
translation:
  language: tl
  text: Kung tapat kayo,[a] ang isa sa inyong mga kapatid ay manatiling nakakulong sa bilangguan kung saan kayo nakakulong.[b] At kayo naman, humayo at magdala ng butil para sa taggutom na nararanasan ng inyong mga sambahayan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Kung nagsasabi kayo ng totoo.” Mas literal, ang pang-uri sa Hebreo ay “tapat” o “totoo.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa bahay ng inyong pagkakabilanggo” o “sa bahay ng inyong kustodiya.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “magdala ng butil para sa taggutom ng inyong mga sambahayan.” Maaari ring unawain na “magdala ng butil para sa nagugutom ninyong mga sambahayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּנִים
  choice: nagsasabi kayo ng totoo
  rationale: Sa konteksto ng pagsisiyasat ni Jose, tumutukoy ito sa pagiging tapat sa sinasabi. Natural ito sa modernong Tagalog at hindi nito ipinapasok ang mas malawak na diwang moral ng “matuwid.”
- source_word: אֲחִיכֶם אֶחָד
  choice: ang isa sa inyong magkakapatid
  rationale: Malinaw na ipinahihiwatig ng Hebreo ang isang tao mula sa pangkat ng magkakapatid.
- source_word: יֵאָסֵר
  choice: ikulong
  rationale: Ang Niphal ng אסר ay maaaring mangahulugang gapusin o ipiit. Dahil kasunod ang lugar ng pagbabantay, ang “ikulong” ay malinaw at angkop sa konteksto nang hindi iginigiit na pisikal siyang iginapos.
- source_word: בְּבֵית מִשְׁמַרְכֶם
  choice: sa lugar na pinagbabantayan sa inyo
  rationale: Tinutukoy nito ang lugar ng kustodiya o pagbabantay kung saan sila nakakulong. Iniiwasan ng salin ang pag-aakalang isang pormal na bilangguan ito.
- source_word: וְאַתֶּם לְכוּ
  choice: At kayo naman, humayo kayo
  rationale: Pinananatili ng “kayo naman” ang diin at paghahambing sa isang kapatid na maiiwan, samantalang ang “humayo kayo” ay marangal at malinaw na utos.
- source_word: הָבִיאוּ
  choice: magdala
  rationale: 'Karaniwang causative na diwa ng Hiphil ng בוא: dadalhin nila ang suplay pauwi.'
- source_word: שֶׁבֶר
  choice: butil
  rationale: Sa salaysay tungkol kay Jose, karaniwang tumutukoy ang salita sa binibiling butil sa panahon ng taggutom.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: para sa taggutom ng inyong mga sambahayan
  rationale: Pinananatili nito ang siksik at bahagyang di-tiyak na ugnayan ng mga pangngalan sa Hebreo, sa halip na ipakahulugang “nagugutom na mga sambahayan.”
- source_word: בָּתֵּיכֶם
  choice: inyong mga sambahayan
  rationale: 'Higit sa pisikal na mga bahay ang tinutukoy: kabilang ang mga taong umaasa sa kanila sa tahanan.'
