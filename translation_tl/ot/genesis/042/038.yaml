source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹֽא יֵרֵ֥ד בְּנִ֖/י עִמָּ/כֶ֑ם כִּֽי אָחִ֨י/ו מֵ֜ת וְ/ה֧וּא לְ/בַדּ֣/וֹ נִשְׁאָ֗ר וּ/קְרָאָ֤/הוּ אָסוֹן֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וְ/הוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/יָג֖וֹן שְׁאֽוֹלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/038.yaml
  text: But he said[a], “My son will not go down with you, because his brother is dead, and he alone is left. If harm should happen to him on the journey on which you go[b], then you would bring my gray hair down to Sheol in sorrow.”
translation:
  language: tl
  text: Ngunit sinabi niya, “Hindi sasama sa inyo ang anak kong lalaki sa pagbaba, sapagkat patay na ang kapatid niya, at siya na lamang ang natitira. Kung may mangyaring kapahamakan[a] sa kanya sa daang inyong lalakaran, ibababa ninyo ang aking uban sa Sheol[b] nang may dalamhati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung sapitin siya ng sakuna sa daang inyong lalakaran.”
    reason: lexical_alternative
  - marker: b
    text: Ang Sheol ay terminong Hebreo para sa kinaroroonan o daigdig ng mga patay; maaari ring isaling “libingan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: bababa
  rationale: Pinananatili ang literal na kilos na ‘bumaba,’ sapagkat ang paglalakbay mula Canaan patungong Ehipto ay karaniwang inilalarawang pagbaba sa Genesis.
- source_word: בְּנִי
  choice: ang anak ko
  rationale: Tuwirang katumbas ng ‘aking anak na lalaki’; sa konteksto, malinaw na si Benjamin ang tinutukoy, kaya natural sa Filipino ang ‘anak ko.’
- source_word: מֵת
  choice: patay na
  rationale: Ipinahahayag ang kasalukuyang kalagayan ni Jose ayon sa paniniwala ni Jacob, hindi lamang ang pangyayaring namatay siya.
- source_word: לְבַדּוֹ נִשְׁאָר
  choice: siya na lamang ang natitira
  rationale: Pinananatili ang diin na si Benjamin na lamang ang natitirang anak ni Raquel ayon sa pananaw ni Jacob.
- source_word: אָסוֹן
  choice: kapahamakan
  rationale: Saklaw nito ang malubhang pinsala, sakuna, o kasawiang maaaring mangyari, nang hindi nililimitahan sa isang tiyak na uri ng panganib.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: sa daang inyong lalakaran
  rationale: Pinananatili ang kongkretong larawan ng daan at ang literal na diwa ng ‘na inyong paroroonan/lalakaran,’ sa natural na modernong Filipino.
- source_word: וְהוֹרַדְתֶּם
  choice: ibababa ninyo
  rationale: Tuwirang ipinapakita ang causative na anyo ng ירד, ‘magpababa’ o ‘ibaba,’ bilang bunga ng ipinapalagay na kapahamakan.
- source_word: שֵׂיבָתִי
  choice: ang aking uban
  rationale: Pinananatili ang kongkretong larawang Hebreo ng uban bilang sagisag ng matandang si Jacob, sa halip na gawing abstraktong ‘katandaan.’
- source_word: בְּיָגוֹן
  choice: nang may dalamhati
  rationale: Natural na ipinahahayag ang kalagayan ng matinding lungkot o dalamhati habang ibinababa siya sa Sheol.
- source_word: שְׁאֹלָה
  choice: sa Sheol
  rationale: Pinananatili ang terminong Hebreo upang hindi ito paliitin sa pisikal na libingan lamang o labis na tukuyin bilang isang ganap na sistematikong konsepto ng kabilang-buhay.
theological_decisions:
- issue: Pagsasalin ng שְׁאוֹל bilang ‘Sheol’ o ‘libingan’
  choice: sa Sheol
  alternative: sa libingan; sa daigdig ng mga patay
  rationale: Maaaring tumukoy ang שְׁאוֹל sa kinaroroonan o daigdig ng mga patay at hindi ito laging katumbas lamang ng isang pisikal na libingan. Pinananatili ng ‘Sheol’ ang lawak at tensiyong nasa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘ninyo/inyong’ para sa maramihang kausap. Pinanatili ang heograpikong ‘bababa,’ ang konkretong larawan ng ‘uban,’ at ang terminong ‘Sheol,’ habang ginawang natural sa Filipino ang kondisyunal na babala.
