base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/005.yaml
  text: So the sons of Israel came to buy grain among those who were coming[b][a], because the famine was in the land of Canaan.
translation:
  language: tl
  text: Kaya dumating ang mga anak na lalaki ni Israel upang bumili ng butil[a], kasama ng iba pang dumarating, sapagkat may taggutom sa lupain ng Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang bumili.” Maaaring walang tahasang layon ang pandiwang Hebreo, ngunit sa konteksto ng taggutom ay tumutukoy ito sa pagbili ng butil o pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kaya dumating
  rationale: Isinasalaysay ng wayyiqtol ang kasunod na pangyayari. Ang “dumating” ay angkop sa pananaw ng kanilang pagdating sa Ehipto, at likas na iniuugnay ng “kaya” ang talata sa naunang konteksto.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak na lalaki ni Israel
  rationale: Tuwirang tumutukoy rito ang parirala sa mga lalaking anak ni Jacob, hindi sa bansang Israel sa pangkalahatan; pinananatili ng salin ang kasarian at agarang konteksto.
- source_word: לִשְׁבֹּר
  choice: upang bumili ng butil
  rationale: Bagaman pangunahing nangangahulugang “bumili” ang pandiwa, ginagamit ito sa salaysay ni Jose para sa pagbili ng butil o pagkain sa panahon ng taggutom. Nililinaw ng “butil” ang ipinahihiwatig na layon.
- source_word: בְּתוֹךְ הַבָּאִים
  choice: kasama ng iba pang dumarating
  rationale: Ipinapahayag ng בְּתוֹךְ na kabilang sila sa isang pangkat, samantalang ang participle na הַבָּאִים ay “mga dumarating.” Ang “iba pang” ay natural na nagpapakitang bahagi sila ng mas malaking daloy ng mga taong dumarating.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng kanilang pagdating; malinaw at marangal ang “sapagkat” sa makabagong Filipino.
- source_word: הָיָה הָרָעָב
  choice: may taggutom
  rationale: Natural sa Filipino ang eksistensiyal na pariralang “may taggutom,” habang malinaw na tumutukoy sa taggutom na kilala na sa salaysay.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili nito ang kongkreto at mahalagang heograpikong pariralang Hebreo na “lupain ng Canaan.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “mga anak na lalaki” upang hindi maging malabo ang tiyak na pagtukoy sa mga anak na lalaki ni Jacob, at ang “kasama ng iba pang dumarating” upang mapanatili ang larawan ng pagdating nila bilang bahagi ng mas malaking pangkat.
