base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/027.yaml
  text: Then one of them opened his sack to give fodder to his donkey at the lodging place[a], and he saw his silver—and behold[b], it was in the mouth of his bag.
translation:
  language: tl
  text: Binuksan ng isa sa kanila ang kanyang sako upang bigyan ng pakain ang kanyang asno sa kanilang tinuluyan. At nakita niya ang kanyang pilak[a]—naroon nga iyon sa bunganga[b] ng kanyang supot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pilak” dito ay ang salaping ibinayad niya.
    reason: cultural_note
  - marker: b
    text: O “sa bukana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: Binuksan
  rationale: Tuwirang katumbas ng karaniwang pandiwang פתח at angkop sa daloy ng salaysay.
- source_word: הָאֶחָד
  choice: ng isa sa kanila
  rationale: Literal na “ang isa,” ngunit malinaw sa konteksto na isa ito sa magkakapatid; likas sa Tagalog ang “isa sa kanila.”
- source_word: שַׂקּוֹ
  choice: ang kanyang sako
  rationale: Pinananatili ang kongkretong kahulugan ng שַׂק at inihihiwalay ito sa ibang tawag sa lalagyan sa hulihan ng talata.
- source_word: לָתֵת מִסְפּוֹא לַחֲמֹרוֹ
  choice: upang pakainin ang kanyang asno
  rationale: Likas na Tagalog para sa layuning “magbigay ng pakain sa kanyang asno,” nang hindi gumagamit ng di-karaniwang salitang “pakain” bilang pangngalan.
- source_word: בַּמָּלוֹן
  choice: sa lugar na tinutuluyan nila
  rationale: Ipinahahayag ang pansamantalang hintuan o tuluyan nang hindi ipinapalagay na isa itong komersiyal na bahay-tuluyan.
- source_word: כַּסְפּוֹ
  choice: ang kanyang pilak
  rationale: Pinananatili ang literal na “pilak,” samantalang nililinaw sa talababa na ito ang salaping ibinayad niya.
- source_word: וְהִנֵּה
  choice: naroon nga
  rationale: Inihahatid ng “nga” ang bigla at kapansin-pansing pagkatuklas na ipinahihiwatig ng הִנֵּה, sa natural na salaysay sa Tagalog.
- source_word: בְּפִי
  choice: sa bunganga
  rationale: Pinananatili ang larawang Hebreo na “bibig” ng isang lalagyan; nilalagyan ng alternatibong “bukana” sa talababa.
- source_word: אַמְתַּחְתּוֹ
  choice: ng kanyang lalagyan
  rationale: Isinasalin sa mas malawak na “lalagyan” upang mapanatili ang pagkakaiba nito sa שַׂק na isinaling “sako,” nang hindi tiyakang ipinapalagay ang eksaktong anyo nito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “asno” bilang karaniwang katawagang biblikal ngunit madaling maunawaan; iniwasan ang “inn” o “bahay-tuluyan” upang hindi magdagdag ng ideya ng komersiyal na tuluyan. Inilagay ang mga pananda ng talababa sa mismong mga salitang nililinaw ng mga ito.
