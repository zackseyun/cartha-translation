  text: So Joseph’s ten brothers went down to buy grain from Egypt[a].
translation:
  language: tl
  text: Kaya bumaba ang sampung kapatid na lalaki ni Jose upang bumili ng butil mula sa Ehipto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang bumili ng butil sa Ehipto.” Mas literal sa Hebreo ang “mula sa Ehipto,” na nagpapahayag sa pinagmulan ng butil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: bumaba
  rationale: Pinananatili ang karaniwang heograpikong idyoma ng Hebreo para sa paglalakbay patungong Ehipto at natural din ito sa Tagalog.
- source_word: אֲחֵי יוֹסֵף
  choice: mga kapatid ni Jose
  rationale: Likas at tuwirang salin ng construct phrase na ‘mga kapatid ni Jose.’
- source_word: עֲשָׂרָה
  choice: sampung
  rationale: Tinutukoy ang bilang ng mga kapatid na bumaba; natural itong ilagay bago ang pangngalan sa Tagalog.
- source_word: לִשְׁבֹּר
  choice: upang bumili
  rationale: Sa salaysay ng taggutom, ang pandiwa ay tumutukoy sa pagbili o pagkuha ng butil; malinaw at pangkaraniwan ang ‘bumili.’
- source_word: בָּר
  choice: butil
  rationale: Tumutukoy ito sa ani ng cereal o grain; malinaw at hindi anakronistiko ang ‘butil.’
- source_word: מִמִּצְרָיִם
  choice: mula sa Ehipto
  rationale: Pinananatili ang karaniwang kahulugan ng pang-ukol na מן bilang pinagmulan, bagaman maaaring idiomatikong unawain na doon sila bumili.
