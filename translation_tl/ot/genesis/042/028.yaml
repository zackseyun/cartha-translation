revisions:
- from: Sinabi niya sa kanyang mga kapatid, “Ibinalik ang pilak ko, at tingnan ninyo, narito nga ito sa aking sako!” Nanghina ang loob nila[a] at nanginig sila. Sinabi ng bawat isa sa kanyang kapatid[b], “Ano itong ginawa sa atin ng Diyos?”
  to: Sinabi niya sa kanyang mga kapatid, “Ibinalik ang pilak ko, at tingnan ninyo, narito nga ito sa aking sako!” Nanghina ang loob nila[a] at nanginig sila, at ang bawat isa’y nagsabi sa kanyang kapatid[b], “Ano itong ginawa ng Diyos sa atin?”
  rationale: Inayos ang huling tanong upang maging likas at sintaktikong malinaw sa modernong Filipino, nang pinananatili ang direktang tanong ng Hebreo at ang Diyos bilang gumaganap. Inayos din ang pagkakaugnay ng “bawat isa” sa pandiwang “nagsabi” upang mas malinaw na maipakita ang distributibong parirala ng pinagmulan. Walang binagong kahulugan o teolohikal na pagpapakahulugan.
