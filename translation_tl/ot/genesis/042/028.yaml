base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/028.yaml
  text: He said to his brothers[a], “My silver has been returned, and look, it is even in my sack!” Then their hearts failed them, and they trembled, each man to his brother, saying[b], “What is this that God has done to us?”
translation:
  language: tl
  text: Sinabi niya sa kanyang mga kapatid, “Ibinalik ang pilak ko, at tingnan ninyo, narito nga ito sa aking sako!” Nanghina ang loob nila[a] at nanginig sila, at ang bawat isa’y nagsabi sa kanyang kapatid[b], “Ano itong ginawa ng Diyos sa atin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lumabas ang kanilang puso”; maaari ring “nawala ang kanilang tapang.”
    reason: lexical_alternative
  - marker: b
    text: O “sa isa’t isa.” Sa literal, “bawat lalaki sa kanyang kapatid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּשַׁב
  choice: Ibinalik
  rationale: Ang Hophal ng שוב ay nagsasaad na ang pilak ay ‘ipinabalik’ o ‘ibinalik.’ Ang payak na aspektong naganap ay natural sa direktang pananalita sa Filipino at nakatuon sa natuklasang kalagayan.
- source_word: כַּסְפִּי
  choice: ang pilak ko
  rationale: Pinananatili ng ‘pilak’ ang kongkretong kahulugan at sinaunang konteksto, habang malinaw pa ring tumutukoy sa salaping ipinambayad.
- source_word: אַמְתַּחַת
  choice: sako
  rationale: Tumutukoy ito sa sisidlan ng butil o panustos; ang ‘sako’ ang natural na katumbas sa konteksto ng pagdadala ng trigo.
- source_word: וְגַם הִנֵּה
  choice: at tingnan ninyo, narito nga ito
  rationale: Ipinahahayag ng parirala ang pagkagulat at pagbibigay-diin. Ginagawang malinaw ng ‘tingnan ninyo’ ang deiktikong puwersa ng הִנֵּה, at ng ‘nga’ ang diin ng גַם.
- source_word: וַיֵּצֵא לִבָּם
  choice: Nanghina ang loob nila
  rationale: Literal itong ‘lumabas ang kanilang puso,’ isang idyoma para sa pagkawala ng tapang o matinding panghihina dahil sa takot. Ang ‘nanghina ang loob’ ay likas na idyomang Filipino na nagpapanatili sa panloob na damdamin ng larawan.
- source_word: וַיֶּחֶרְדוּ
  choice: nanginig sila
  rationale: Ang חרד ay nagsasaad ng panginginig dahil sa takot o pagkabalisa. Hindi na idinagdag ang ‘sa takot’ upang hindi lampasan ang tahasang anyo ng teksto, bagaman malinaw ito sa konteksto.
- source_word: אִישׁ אֶל אָחִיו
  choice: Sinabi ng bawat isa sa kanyang kapatid
  rationale: Pinananatili nito ang distribusyon at panlalaking ugnayang magkakapatid ng Hebreo, sa halip na gawing ganap na neutral na ‘sa isa’t isa.’
- source_word: מַה זֹּאת
  choice: Ano itong
  rationale: Direkta nitong pinananatili ang padamdam na tanong na ‘Ano ito?’ at hindi ito binabago tungo sa paliwanag na ‘Bakit nangyari ito?’
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman maramihan ang anyong morpolohikal, isahan ang tinutukoy ayon sa sintaks at salaysay.
theological_decisions:
- issue: Pagpapakahulugan sa אֱלֹהִים sa takot na tanong ng magkakapatid
  choice: Diyos
  alternative: isang diyos; mga diyos
  rationale: Sinusuportahan ng sintaks at konteksto ang iisang Diyos. Kinikilala ng salin ang banal na pagkilos na ipinapahiwatig ng magkakapatid nang hindi nagpapasok ng karagdagang paliwanag hinggil sa kanilang pagkaunawa.
- issue: Panlalaking pariralang אִישׁ אֶל אָחִיו
  choice: bawat isa sa kanyang kapatid
  alternative: sa isa’t isa
  rationale: Ang mga tauhan ay mga lalaking magkakapatid at panlalaking isahan ang anyo ng pinagmulan. Pinananatili ng pangunahing teksto ang ugnayang ito, habang inilalagay sa talababa ang mas idyomatikong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘pilak’ at ‘sako’ upang mapanatili ang kongkretong sinaunang tagpuan; ginamit naman ang likas na idyomang ‘nanghina ang loob’ para sa Hebreong idyoma, na ipinaliwanag sa talababa.
