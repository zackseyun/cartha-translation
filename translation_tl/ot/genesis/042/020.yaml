translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘bunso’ bilang karaniwang katawagan sa pinakabatang kapatid at ang ‘mapatunayang totoo’ upang maipakita ang konteksto ng pagsisiyasat, habang inilalahad sa talababa ang tunay na lawak ng pandiwang Hebreo.
