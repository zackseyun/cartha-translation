  text: Then bring your youngest brother to me[a], so that your words may be verified and you will not die.” And they did so.
translation:
  language: tl
  text: At dalhin ninyo sa akin ang bunso ninyong kapatid, upang mapatunayang totoo[a] ang inyong mga sinabi at hindi kayo mamamatay.” At ginawa nila iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapagtibay” o “paniwalaan.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagpapatunay na totoo ang isang pahayag o sa pagtanggap dito bilang mapagkakatiwalaan; mas angkop sa konteksto rito ang pagpapatunay.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: ang bunso ninyong kapatid
  rationale: Sa konteksto ng magkakapatid, ang literal na ‘maliit/bata’ ay tumutukoy kay Benjamin bilang pinakabata; natural itong ipinahahayag sa Tagalog bilang ‘bunso.’
- source_word: תָּבִיאוּ אֵלַי
  choice: dalhin ninyo sa akin
  rationale: Tuwirang ipinapahayag ang Hiphil ng בוא (‘dalhin’) at ang direksiyong אֵלַי (‘sa akin’).
- source_word: וְיֵאָמְנוּ
  choice: upang mapatunayang totoo
  rationale: Ang Niphal ng אמן ay maaaring mangahulugang mapagtibay bilang totoo o tanggapin bilang mapagkakatiwalaan. Ang ‘mapatunayang totoo’ ay angkop sa pagsisiyasat ni Jose sa pahayag ng magkakapatid nang hindi itinatago ang alternatibong kahulugan sa talababa.
- source_word: דִבְרֵיכֶם
  choice: ang inyong mga sinabi
  rationale: Natural sa modernong Tagalog at malinaw na tumutukoy sa nauna nilang pahayag, habang pinananatili ang maramihang diwa ng דְּבָרִים.
- source_word: וְלֹא תָמֻתוּ
  choice: at hindi kayo mamatay
  rationale: Pinananatili ang Hebreong koordinasyon at ang lakas ng pangako o banta ni Jose bilang bunga ng pagsunod.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: At ginawa nga nila iyon
  rationale: Natural na salin ng pormulang pasalaysay; ang ‘nga’ ay nagpapahiwatig na isinagawa nila ang iniutos.
