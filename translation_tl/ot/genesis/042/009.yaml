base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/009.yaml
  text: Then Joseph remembered the dreams that he had dreamed about them[a], and he said to them, “You are spies; you have come to see the nakedness of the land.”
translation:
  language: tl
  text: At naalala ni Jose ang mga panaginip na napanaginipan niya tungkol sa kanila. Sinabi niya sa kanila, “Mga espiya kayo! Naparito kayo upang tingnan ang kahubaran ng lupain.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga lantad o mahinang bahagi ng lupain.” Literal na sinasabi sa Hebreo, “ang kahubaran ng lupain,” isang idyoma para sa mga lugar na madaling salakayin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: at naalala
  rationale: Tuwirang isinasalaysay ng anyong wayyiqtol ng זכר ang pag-alala ni Jose sa sandaling iyon. Likas sa salaysay na Tagalog ang “at naalala.”
- source_word: הַחֲלֹמוֹת אֲשֶׁר חָלַם
  choice: ang mga panaginip na napanaginipan niya
  rationale: Pinananatili nito ang magkaugnay na pangngalan at pandiwa sa Hebreo (חלומות + חלם) nang hindi nagiging di-likas sa Tagalog.
- source_word: לָהֶם
  choice: tungkol sa kanila
  rationale: Sa konteksto, ang mga panaginip ay may kinalaman sa mga kapatid ni Jose; malinaw na ipinahahayag ng “tungkol sa kanila” ang diwa ng parirala.
- source_word: מְרַגְּלִים
  choice: mga espiya
  rationale: Sa kontekstong ito, tumutukoy ang salita sa mga taong nangangalap ng lihim na impormasyon tungkol sa isang lupain. Karaniwan at malinaw sa modernong Filipino ang “mga espiya.”
- source_word: לִרְאוֹת
  choice: upang tingnan
  rationale: Pinananatili ng “tingnan” ang payak na kahulugan ng infinitibong “makita/tingnan,” habang ipinahihiwatig ng paratang na pag-iispeksiyon para sa paniniktik ang layunin.
- source_word: עֶרְוַת הָאָרֶץ
  choice: ang kahubaran ng lupain
  rationale: Pinananatili sa pangunahing teksto ang matingkad na larawang literal sa Hebreo. Ipinaliliwanag sa talababa ang idyomatikong kahulugan nitong mga bahaging lantad o madaling salakayin.
- source_word: בָּאתֶם
  choice: naparito kayo
  rationale: Natural sa tuwirang paratang sa Tagalog ang “naparito kayo” at ipinakikitang dumating sila roon na may sinasabing layunin.
