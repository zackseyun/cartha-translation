translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang Hebreong larawang “nasa inyo ang katotohanan” at ang pormula ng panunumpa, habang nilinaw sa mga talababa ang mga posibleng leksikal na pagbasa.
