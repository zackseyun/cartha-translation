base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/016.yaml
  text: Send one of you[a], and let him bring your brother, while you remain confined, so that your words may be tested, whether the truth is with you. But if not, as Pharaoh lives[d][c][b], surely you are spies.
translation:
  language: tl
  text: Ipadala ninyo ang isa sa inyo, at kunin niya ang inyong kapatid[a], samantalang mananatili kayong nakapiit[b]. Sa gayon, masusubok ang inyong mga sinabi—kung nasa inyo ang katotohanan[c]. Ngunit kung hindi, sa buhay ng Faraon[d], tiyak na mga espiya kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at sunduin niya ang inyong kapatid.” Karaniwang nangangahulugang “kunin” ang pandiwang Hebreo, ngunit dito ay tumutukoy ito sa pagkuha sa kapatid at pagdadala sa kanya kay Jose.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “habang nakagapos kayo” o “habang nasa ilalim kayo ng pagbabantay.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagkagapos o pagpigil sa kustodiya.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “kung ang katotohanan ay nasa inyo,” ibig sabihin, kung nagsasabi kayo ng totoo.
    reason: lexical_alternative
  - marker: d
    text: Ang “sa buhay ng Faraon” ay isang pormula ng panunumpa na nananawagan sa buhay ng Faraon.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ מִכֶּם אֶחָד
  choice: Ipadala ninyo ang isa sa inyo
  rationale: Tuwirang utos ang pandiwang שִׁלְחוּ, at ang מִכֶּם אֶחָד ay pumipili ng isang tao mula sa grupo. Likas at malinaw sa Filipino ang ganitong ayos.
- source_word: וְיִקַּח אֶת אֲחִיכֶם
  choice: at kunin niya ang inyong kapatid
  rationale: Pinananatili ng “kunin” ang karaniwang kahulugan ng לקח. Sa konteksto, ang layunin ay sunduin ang kapatid at dalhin siya kay Jose; nililinaw ito sa talababa nang hindi isinasara ang leksikal na saklaw sa pangunahing teksto.
- source_word: וְאַתֶּם הֵאָסְרוּ
  choice: samantalang mananatili kayong nakapiit
  rationale: Ang Niphal ng אסר ay tumutukoy sa pagkagapos o pagkakulong. Ipinahahayag ng “samantalang” ang pangyayaring kasabay ng pagpapadala sa isang kapatid, at ng “nakapiit” ang kustodiyal na kalagayan.
- source_word: וְיִבָּחֲנוּ דִּבְרֵיכֶם
  choice: Sa gayon, masusubok ang inyong mga sinabi
  rationale: Ang בחן sa Niphal ay nangangahulugang subukin o siyasatin. Pinananatili ng “mga sinabi” ang konkretong diwa ng דִּבְרֵיכֶם sa halip na gawing mas interpretatibong “salaysay.”
- source_word: הַאֱמֶת אִתְּכֶם
  choice: kung nasa inyo nga ang katotohanan
  rationale: Pinananatili nito ang Hebreong idyomang “ang katotohanan ay kasama/nasa inyo,” habang nauunawaan sa Filipino bilang pagsubok kung nagsasabi sila ng totoo.
- source_word: חֵי פַרְעֹה
  choice: isinusumpa ko sa buhay ng Faraon
  rationale: Isa itong pormula ng panunumpa na gumagamit sa buhay ng Faraon bilang panangga sa katiyakan ng pahayag. Ang pandiwang “isinusumpa ko” ay likas na paraan sa Filipino upang ihayag ang tungkulin ng pormula.
- source_word: כִּי מְרַגְּלִים אַתֶּם
  choice: na tiyak na mga espiya kayo
  rationale: Sa konteksto ng panunumpa, may mariin o asseverative na puwersa ang כִּי. Ipinahahayag ng “tiyak” ang diin nang hindi nagdaragdag ng paliwanag sa paratang.
