- from: Nang malaman ni Jacob na may mabibiling butil sa Ehipto, sinabi niya sa kanyang mga anak na lalaki, “Bakit patuloy lang kayong nagkakatinginan?”[a]
  to: Nang makita ni Jacob na may butil sa Ehipto, sinabi niya sa mga anak niyang lalaki, “Bakit patuloy kayong nagkakatinginan?”[a]
  rationale: Inalis ang di-tahasang ideya ng pagbili, ibinalik ang pangunahing kahulugan ng pandiwang Hebreo na “nakita,” at pinasimple ang pagtukoy sa mga anak ni Jacob. Binago rin ang talababa upang maging malinaw, natural, at maingat sa leksikal na kalabuan ng pandiwang Hebreo.
