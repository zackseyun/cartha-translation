  yaml_path: translation/ot/genesis/042/001.yaml
  text: When Jacob saw that there was grain in Egypt[a], Jacob said to his sons, “Why do you keep looking at one another?”
translation:
  language: tl
  text: Nang makita ni Jacob na may butil sa Ehipto, sinabi niya sa mga anak niyang lalaki, “Bakit patuloy kayong nagkakatinginan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Bakit ninyo ipinakikita ang inyong sarili?” Maaaring unawain sa ibang paraan ang pandiwang Hebreo, ngunit sa kontekstong ito ay malamang na tumutukoy ito sa pag-aatubili ng magkakapatid habang nagkakatinginan sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang malaman
  rationale: Ang pandiwa ay literal na tumutukoy sa pagkakita, ngunit maaari rin itong mangahulugang pagkaalam o pagkatanto. Dahil balita tungkol sa butil sa Ehipto ang nalaman ni Jacob, mas natural sa Filipino ang “nang malaman” kaysa “nang makita.”
- source_word: כִּי יֶשׁ שֶׁבֶר
  choice: na may mabibiling butil
  rationale: Sa salaysay ng taggutom, ang שֶׁבֶר ay butil na makukuha sa pamamagitan ng pagbili. Nililinaw ng “mabibiling butil” ang diwa sa konteksto nang hindi ito ginagawang pangkalahatang “pagkain.”
- source_word: בְּמִצְרָיִם
  choice: sa Ehipto
  rationale: Karaniwang panandang panlunan sa Filipino ang “sa” para sa lokasyong tinutukoy.
- source_word: לְבָנָיו
  choice: sa kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ni Jacob ang tinutukoy ng בָּנִים sa kontekstong ito.
- source_word: לָמָּה
  choice: Bakit
  rationale: Tuwirang pinananatili ang tanong ng tekstong Hebreo.
- source_word: תִּתְרָאוּ
  choice: patuloy lang kayong nagkakatinginan
  rationale: 'Malamang na katumbasan at nagpapatuloy na kilos ang ipinahihiwatig ng anyong hitpael sa konteksto: nagkakatinginan ang magkakapatid sa pag-aatubili sa halip na kumilos. Ipinahihiwatig ng “lang” ang pagsaway ni Jacob nang hindi labis na pinatitindi ang sinabi.'
