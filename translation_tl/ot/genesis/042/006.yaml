  to: Si Jose ang pinuno ng lupain; siya ang nagbebenta ng butil sa lahat ng tao sa lupain. Dumating ang mga kapatid ni Jose at yumukod[a] sa harap niya nang nakasubsob ang mukha sa lupa.
  rationale: Pinananatili ng rebisyon ang saklaw at diin ng Hebreo at ang maingat na pagbasa ng English POB audit trail. Nililinaw nito na ang pinaglilingkuran ni Jose ay “lahat ng tao sa lupain,” hindi lamang mga mamamayan, at gumagamit ng mas neutral na “nagbebenta” para sa pagbebenta ng butil. Hindi nito ipinapasok ang kahulugang pagsambang panrelihiyon; ang pisikal na lalim ng pagpupugay ay nananatiling malinaw sa “nang nakasubsob ang mukha sa lupa” at sa talababa.
