base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/006.yaml
  text: Joseph was the ruler over the land; he was the one who sold grain to all the people of the land[a]. And Joseph’s brothers came and bowed down to him with their faces to the ground.
translation:
  language: tl
  text: Si Jose ang pinuno ng lupain; siya ang nagbebenta ng butil sa lahat ng tao sa lupain. Dumating ang mga kapatid ni Jose at yumukod[a] sa harap niya nang nakasubsob ang mukha sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagpatirapa sa harap niya.” Maaaring tumukoy ang pandiwang Hebreo sa malalim na pagyukod o pagpapatirapa bilang pagpaparangal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׁלִּיט
  choice: ang pinuno
  rationale: Tumutukoy ito sa taong may kapangyarihang mamahala. Likas sa modernong Tagalog ang “pinuno” at hindi nito labis na tinutukoy ang eksaktong titulo ng katungkulan ni Jose.
- source_word: עַל הָאָרֶץ
  choice: ng lupain
  rationale: Ang אֶרֶץ dito ay ang lupaing nasasakupan ni Jose, samakatuwid ay Ehipto sa konteksto, at hindi ang buong daigdig.
- source_word: הַמַּשְׁבִּיר
  choice: ang nagtitinda ng butil
  rationale: Sa salaysay tungkol sa taggutom, ang Hifil participle ng שׁבר ay tumutukoy sa pagbebenta ng butil. Ginawang tahasan ang bagay na ipinagbibili dahil malinaw ito sa konteksto.
- source_word: לְכָל עַם הָאָרֶץ
  choice: sa lahat ng mamamayan ng lupain
  rationale: Ang עַם ay kolektibong tumutukoy sa mga tao ng bansang iyon. Pinananatili ng “ng lupain” ang lokal na saklaw ng parirala.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: yumukod sa harap niya
  rationale: Maaaring tumukoy ang pandiwa sa malalim na pagyukod o pagpapatirapa bilang pagpaparangal at pagpapasakop. Ang “yumukod” ay natural at hindi nag-aangkat ng diwa ng pagsambang panrelihiyon.
- source_word: אַפַּיִם אָרְצָה
  choice: na ang mga mukha ay nakasubsob sa lupa
  rationale: Idyoma ito para sa napakalalim na pagyukod o pagpapatirapa. Malinaw na inilalarawan ng salin ang aktuwal na tindig nang hindi gumagamit ng di-likas na literal na pagtukoy sa mga butas ng ilong.
- source_word: וְ
  choice: at / walang hiwalay na panandang temporal
  rationale: Ang pang-ugnay ay nagdurugtong at nagsusulong sa salaysay; hindi ito nangangailangan ng idinagdag na “ngayon.” Sa ikalawang sugnay, natural na sinimulan ang bagong pangungusap sa “Dumating” sa Tagalog.
theological_decisions:
- issue: Ang kilos ng mga kapatid ni Jose sa harap niya
  choice: yumukod sa harap niya
  alternative: nagpatirapa sa harap niya; sumamba sa kanya
  rationale: Inilalarawan ng tagpo ang pisikal na pagpapasakop at paggalang, na kaugnay ng naunang mga panaginip ni Jose. Hindi ipinahihiwatig ng konteksto ang pagsambang ukol sa Diyos, kaya iniwasan ang “sumamba,” habang pinanatili sa talababa ang mas matinding pisikal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “butil” bilang natural na katawagan sa pagkaing butil sa konteksto ng taggutom, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
