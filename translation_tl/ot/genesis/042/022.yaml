revisions:
- from: Sumagot si Ruben sa kanila, “Hindi ba sinabi ko sa inyo, ‘Huwag kayong magkasala laban sa bata’? Ngunit hindi kayo nakinig. At ngayon, narito, sinisingil ang kanyang dugo.”
  to: Sumagot si Ruben sa kanila, “Hindi ba sinabi ko sa inyo, ‘Huwag kayong magkasala laban sa bata’? Ngunit hindi kayo nakinig. At ngayon, narito, hinihingi ang kanyang dugo.”
  rationale: Pinalitan lamang ang pandiwang "sinisingil" ng "hinihingi" upang maging mas natural ang Tagalog at mas malapit sa saklaw ng Hebreong נִדְרָשׁ. Pinanatili ang pasibong pahayag upang hindi tukuyin ang ahente ng paghingi ng dugo, at pinanatili ang "narito" bilang katumbas ng הִנֵּה.
