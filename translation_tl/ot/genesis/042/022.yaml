base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/022.yaml
  text: Then Reuben answered them, saying, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now, look, his blood is being required.”
translation:
  language: tl
  text: Sumagot si Ruben sa kanila, “Hindi ba sinabi ko sa inyo, ‘Huwag kayong magkasala laban sa bata’? Ngunit hindi kayo nakinig. At ngayon, narito, hinihingi ang kanyang dugo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּחֶטְאוּ בַיֶּלֶד
  choice: magkasala laban sa bata
  rationale: Pinananatili ang tuwirang moral na diwa ng pandiwang חטא na may ב, sa halip na paliitin ito sa isang tiyak na uri ng pananakit.
- source_word: דָּמוֹ ... נִדְרָשׁ
  choice: sinisingil ang kanyang dugo
  rationale: Inililipat ang Hebreong idyoma tungkol sa pananagutan sa dugong dumanak habang pinananatili ang matinding larawang 'dugo' at ang pasibong anyo, na hindi tahasang nagsasaad kung sino ang naniningil.
- source_word: הִנֵּה
  choice: narito
  rationale: Naghahatid ng biglang pagtawag-pansin sa kasalukuyang bunga ng kanilang ginawa sa isang marangal at likas na paraang Tagalog.
theological_decisions:
- issue: Ang ahente ng pagsingil sa dugo
  choice: Pinanatiling di-tiyak sa pasibong 'sinisingil ang kanyang dugo.'
  alternative: “Sinisingil tayo ng Diyos dahil sa kanyang dugo.”
  rationale: Hindi tahasang pinapangalanan ng Hebreo ang Diyos o ang taong pinananagot; iniiwasang dagdagan ang teksto at pinananatili ang teolohikal na pahiwatig.
- issue: Kalagayan ni Jose ayon sa pananalita ng mga kapatid
  choice: Pinanatili ang idyomang tumutukoy sa 'kanyang dugo' nang hindi ipinapahayag na tiyak na patay siya.
  alternative: “Pinagbabayaran natin ang kanyang kamatayan.”
  rationale: Sa tagpong ito, ipinapalagay ng mga kapatid ang mabigat na pananagutan ngunit hindi dapat lutasin ng salin ang dramatikong tensiyon sa pamamagitan ng tahasang pagsasabing namatay si Jose.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Inalis ang paulit-ulit na pormulang Hebreo na 'sumagot ... na nagsasabi' dahil sapat at natural ang 'Sumagot ...' sa Tagalog, habang pinanatili ang diin ng הִנֵּה sa 'narito.'
