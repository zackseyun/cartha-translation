translation:
  language: tl
  text: At inilagay niya sila sa kustodiya nang tatlong araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “At ikinulong niya sila nang tatlong araw.” Literal na nangangahulugang “tinipon” ang pandiwang Hebreo, ngunit sa pariralang ito ay idyomatikong tumutukoy ito sa paglalagay sa kustodiya o sa ilalim ng pagbabantay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: ipinasailalim
  rationale: Ang אסף ay literal na “tipunin,” ngunit kasama ng אֶל מִשְׁמָר ay idyomatikong tumutukoy sa paglalagay o pagkukulong sa ilalim ng pagbabantay. Ang “ipinasailalim” ay natural sa Filipino at nagpapakita ng pagpasok nila sa kalagayang iyon.
- source_word: אֹתָם
  choice: sila
  rationale: Tuwirang layon na panlalaking maramihan, na tumutukoy sa mga kapatid ni Jose.
- source_word: אֶל מִשְׁמָר
  choice: sa pagbabantay
  rationale: Ang parirala ay tumutukoy sa paglalagay sa isang kalagayan o lugar na binabantayan. Hindi ito isinaling “bilangguan” upang hindi gawing mas tiyak kaysa sa hinihingi ng Hebreo.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: nang tatlong araw
  rationale: Natural na pagpapahayag sa Filipino ng tagal na tatlong araw.
