base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/024.yaml
  text: He turned away from them and wept[a]. Then he returned to them and spoke to them[b], and he took Simeon from among them and bound him before their eyes.
translation:
  language: tl
  text: Tumalikod siya sa kanila at umiyak. Pagkatapos, bumalik siya sa kanila at kinausap sila. Kinuha niya si Simeon mula sa kanilang hanay at iginapos siya sa harap mismo nila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסֹּב מֵעֲלֵיהֶם
  choice: Tumalikod siya sa kanila
  rationale: Ipinahahayag ng parirala ang pagtalikod o paglayo ni Jose mula sa presensiya ng kanyang mga kapatid. Likas sa modernong Tagalog ang “tumalikod sa kanila” at hindi nito dinaragdagan ang dahilan ng pagkilos.
- source_word: וַיֵּבְךְּ
  choice: umiyak
  rationale: Karaniwang kahulugan ng בכה ang pag-iyak; tuwiran at natural ito sa salaysay.
- source_word: וַיָּשָׁב אֲלֵהֶם
  choice: bumalik siya sa kanila
  rationale: Ang שוב ay nagsasaad ng pagbabalik, at pinananatili ng salin ang malinaw na pagkakasunod-sunod ng mga kilos.
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: kinausap sila
  rationale: Natural na katumbas ito ng “nagsalita sa kanila” sa kasalukuyang Tagalog, nang hindi nagpapahiwatig ng anumang tiyak na nilalaman ng sinabi.
- source_word: וַיִּקַּח מֵאִתָּם אֶת־שִׁמְעוֹן
  choice: Kinuha niya si Simeon mula sa kanilang hanay
  rationale: Ipinakikita ng מֵאִתָּם na ibinukod si Simeon mula sa pangkat ng magkakapatid. Nililinaw ito ng “mula sa kanilang hanay” nang hindi labis na nagpapakahulugan.
- source_word: וַיֶּאֱסֹר אֹתוֹ
  choice: iginapos ito
  rationale: Ang אסר ay tumutukoy sa kongkretong paggapos, hindi kinakailangang sa pagpapabilanggo. Ginamit ang “ito” upang natural na tukuyin si Simeon at maiwasan ang magkasunod na “niya.”
- source_word: לְעֵינֵיהֶם
  choice: sa harap mismo nila
  rationale: Ang literal na diwang “sa kanilang mga mata” ay nagsasaad na nakita nila ang paggapos. Ang “sa harap mismo nila” ay natural at matingkad sa Tagalog.
