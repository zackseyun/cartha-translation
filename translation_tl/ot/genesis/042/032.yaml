  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
translation:
  language: tl
  text: Labindalawa kaming magkakapatid na lalaki, mga anak ng aming ama. Wala na ang isa[a], at ang bunso ay kasama ng aming ama ngayon sa lupain ng Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “ang isa ay wala.” Maaaring tumukoy ang idyomang Hebreo sa isang taong nawawala, wala na, o ipinapalagay na patay.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר אֲנַחְנוּ אַחִים
  choice: Labindalawa kaming magkakapatid
  rationale: Likas na salin sa modernong Tagalog ng sugnay na walang tahasang pandiwa; malinaw na lalaking magkakapatid ang tinutukoy sa konteksto nang hindi kailangang ulitin ang kasarian.
- source_word: בְּנֵי אָבִינוּ
  choice: mga anak ng aming ama
  rationale: Pinananatili ang appositional na paglilinaw sa ugnayang pampamilya. Bagaman literal na 'mga anak na lalaki,' sapat at mas natural dito ang 'mga anak' kasunod ng 'magkakapatid.'
- source_word: הָאֶחָד אֵינֶנּוּ
  choice: Wala na ang isa
  rationale: Inililipat nang natural sa Tagalog ang idyomang Hebreo nang hindi tiyakang sinasabing patay siya; maaari itong magpahiwatig na nawawala, wala roon, o ipinapalagay na patay.
- source_word: וְהַקָּטֹן
  choice: at ang bunso
  rationale: Sa talaan ng magkakapatid, ang literal na 'maliit/bata' ay tumutukoy sa pinakabata, kaya 'bunso' ang pinakanatural at tumpak.
- source_word: הַיּוֹם אֶת אָבִינוּ
  choice: ay kasama ngayon ng aming ama
  rationale: Ang אֶת ay nagpapahayag dito ng pakikisama, at ang הַיּוֹם ay pinanatiling 'ngayon' upang maipakita ang kasalukuyang kalagayan.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili ang tahasang salitang 'lupain' sa Hebreo at ang pangalang Canaan.
theological_decisions:
- issue: Kalagayan ng kapatid na tinutukoy ng אֵינֶנּוּ
  choice: Wala na ang isa
  alternative: Patay na ang isa
  rationale: Hindi tahasang sinasabi ng idyomang Hebreo na patay siya. Pinananatili ng salin ang pananaw ng mga nagsasalita at ang likas na kalabuan kung siya ay nawawala, wala na sa kanila, o ipinapalagay na patay.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “magkakapatid” at “bunso” bilang karaniwang pananalita, habang pinanatili ang pag-uulit na “aming ama” at ang pariralang “lupain ng Canaan” upang manatiling malapit sa estruktura at diin ng Hebreo.
