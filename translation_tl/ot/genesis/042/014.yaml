  rationale: Natural na katumbas sa Filipino ng pagsasalita sa isang pangkat na may kasunod na tuwirang sipi.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang tutuldok ay natural na nagpapakilala sa nilalaman ng sinabi; iniiwasan nito ang mabigat na ‘sinabi ... na sinasabi’ habang pinananatili ang tungkulin ng Hebreong pormula.
- source_word: מְרַגְּלִים אַתֶּם
  choice: Mga espiya kayo
  rationale: Malinaw at kasalukuyang Filipino; pinananatili ang diin ng pangngalang panaguri at hiwalay na panghalip.
