- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na salaysay sa Filipino para sa wayyiqtol ng אמר; hindi kailangang hiwalay na isalin ang pang-ugnay na וַ.
- source_word: אֲלֵהֶם
  choice: sa kanila
  rationale: Tuwirang ipinapakita ang mga kinausap ni Jose.
- source_word: יוֹסֵף
