  text: וְ/אֶת בִּנְיָמִין֙ אֲחִ֣י יוֹסֵ֔ף לֹא שָׁלַ֥ח יַעֲקֹ֖ב אֶת אֶחָ֑י/ו כִּ֣י אָמַ֔ר פֶּן יִקְרָאֶ֖/נּוּ אָסֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/004.yaml
  text: But Jacob did not send Benjamin[a], Joseph’s brother, with his brothers, for he said, “Lest harm happen to him.”
translation:
  language: tl
  text: Ngunit hindi isinama ni Jacob si Benjamin, na kapatid ni Jose, sa kanyang mga kapatid, sapagkat sinabi niya, “Baka may masamang mangyari sa kanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: Ngunit
  rationale: 'Ipinapakita ng pangatnig ang pagsalungat sa naunang talata: pumunta ang ibang mga anak, ngunit hindi isinama si Benjamin; hindi isinasalin ang pananda ng tuwirang layon.'
- source_word: בִּנְיָמִין
  choice: Benjamin
  rationale: Karaniwang anyo ng pangalang ito sa modernong salin sa Filipino.
- source_word: אֲחִי יוֹסֵף
  choice: na kapatid ni Jose
  rationale: Likas na Filipino ang pariralang ito at pinananatili ang tiyak na pagkakaugnay ni Benjamin kay Jose.
- source_word: לֹא שָׁלַח ... אֶת אֶחָיו
  choice: hindi isinama ... sa kanyang mga kapatid
  rationale: Bagaman literal na 'hindi ipinadala,' malinaw sa konteksto na hindi pinasama ni Jacob si Benjamin sa paglalakbay ng kanyang mga kapatid; ang 'isinama ... sa' ay natural at tumpak sa Filipino.
- source_word: כִּי אָמַר
  choice: sapagkat sinabi niya
  rationale: Tuwirang ipinapahayag ang dahilan at pinananatili ang tahasang pandiwang 'sinabi,' sa halip na ipakahulugang 'inisip.'
- source_word: פֶּן
  choice: Baka
  rationale: Natural na modernong Filipino para sa isang posibilidad na kinatatakutan o iniiwasan.
- source_word: יִקְרָאֶנּוּ אָסוֹן
  choice: may masamang mangyari sa kanya
  rationale: Likas na katumbas ng Hebreong idyoma; pinananatiling malawak ang אָסוֹן bilang malubhang kapahamakan o pinsala nang hindi tinutukoy ang eksaktong uri nito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang 'Jose' bilang karaniwang anyong Filipino ng Joseph at iniwasan ang makalumang 'sakaling sapitin siya ng kapahamakan.'
