  yaml_path: translation/ot/genesis/042/026.yaml
  text: Then they loaded their grain onto their donkeys and went from there[a].
translation:
  language: tl
  text: Pagkatapos, ikinarga nila sa kanilang mga asno ang kanilang butil[a] at umalis sila roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanilang mga panustos” o “kanilang biniling butil.” Ang salitang Hebreo ay maaaring tumukoy sa mga panustos na pagkain, ngunit sa kontekstong ito ay malamang na tumutukoy ito sa butil na nakuha nila sa Ehipto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: ikinarga nila
  rationale: Bagaman ang literal na diwa ng נשׂא ay “buhatin/dalhin,” sa konteksto ng paglalagay ng mga kalakal sa mga hayop na panlakbay, likas at tumpak ang “ikinarga.”
- source_word: שִׁבְרָם
  choice: ang kanilang butil
  rationale: Sa salaysay tungkol kay Jose, karaniwang tumutukoy ang שֶׁבֶר sa butil na nakuha o binili sa panahon ng taggutom. Pinananatili ng “butil” ang tiyak na kahulugan sa konteksto.
- source_word: עַל חֲמֹרֵיהֶם
  choice: sa kanilang mga asno
  rationale: Kasama ng pandiwang “ikinarga,” malinaw na ipinahihiwatig ng “sa” ang paglalagay ng kargamento sa ibabaw ng kanilang mga asno, sa likas na modernong Tagalog.
- source_word: וַיֵּלְכוּ מִשָּׁם
  choice: at umalis sila roon
  rationale: Ang הלך kasunod ng מִשָּׁם ay nagsasaad ng pag-alis mula sa lugar na iyon. Ang “umalis sila roon” ay malinaw, maikli, at natural sa Tagalog.
