  source_fidelity: 'Tumpak ang salin sa mga pangunahing elemento ng Hebreo: ang pagkakarga ng kanilang butil sa kanilang mga asno at ang pag-alis nila mula roon. Ang “ikinarga” ay angkop na kontekstuwal na salin ng וַיִּשְׂאוּ, at ang “umalis sila roon” ay natural na naghahatid ng וַיֵּלְכוּ מִשָּׁם.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang ayos na “ikinarga nila sa kanilang mga asno ang kanilang butil” ay maayos at hindi mabigat; ang “Pagkatapos” ay angkop na pang-ugnay sa daloy ng salaysay.
  terminology: Ang “butil” ay angkop para sa שִׁבְרָם sa konteksto ng salaysay tungkol sa pagbili ng pagkain sa Ehipto. Ang “mga asno” ay tumpak at pangkaraniwang salin ng חֲמֹרִים. Maayos ding naipapahayag ng talababa ang mas malalawak na posibleng kahulugan nang hindi inaalis ang pangunahing kontekstuwal na salin.
