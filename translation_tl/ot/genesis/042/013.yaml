  text: וַ/יֹּאמְר֗וּ שְׁנֵ֣ים עָשָׂר֩ עֲבָדֶ֨י/ךָ אַחִ֧ים אֲנַ֛חְנוּ בְּנֵ֥י אִישׁ אֶחָ֖ד בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנֵּ֨ה הַ/קָּטֹ֤ן אֶת אָבִ֨י/נוּ֙ הַ/יּ֔וֹם וְ/הָ/אֶחָ֖ד אֵינֶֽ/נּוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/013.yaml
  text: And they said[a], “We, your servants, are twelve brothers, sons of one man in the land of Canaan. And behold, the youngest is with our father today, and one is no more.”
translation:
  language: tl
  text: At sinabi nila, “Kaming mga lingkod mo ay labindalawang magkakapatid, mga anak na lalaki ng iisang ama sa lupain ng Canaan. Narito, ang bunso ay kasama ng aming ama ngayon, at wala na ang isa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “ang isa ay wala.” Isa itong eupemistikong pahayag na maaaring mangahulugang “nawala na” o magpahiwatig na patay na siya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: At sinabi nila
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi dinaragdagan ng mas tiyak na ugnayang temporal.
- source_word: עֲבָדֶיךָ
  choice: mga lingkod mo
  rationale: Magalang at mapagpakumbabang tawag ito sa sarili sa harap ng isang pinuno, hindi paglalarawan sa kanila bilang mga literal na alipin.
- source_word: שְׁנֵים עָשָׂר ... אַחִים אֲנַחְנוּ
  choice: Kaming ... ay labindalawang magkakapatid
  rationale: Likas sa modernong Tagalog at malinaw na ipinapahayag kapuwa ang bilang at ang kanilang ugnayan bilang magkakapatid.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: mga anak na lalaki ng iisang ama
  rationale: Pinananatili ang panlalaking pagtukoy ng בְּנֵי at natural na ipinapahayag sa Tagalog ang kanilang pinagmulan sa iisang lalaki bilang ama.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Pinananatili ang tahasang salitang אֶרֶץ, 'lupain.'
- source_word: וְהִנֵּה
  choice: Narito
  rationale: Dignified at kasalukuyang panandang presentasyonal na naghaharap ng kasunod na kalagayan nang hindi ito ginagawang literal na utos na tumingin.
- source_word: הַקָּטֹן
  choice: ang bunso
  rationale: Sa konteksto ng magkakapatid, tumutukoy ito sa pinakabatang kapatid; 'bunso' ang likas at tiyak na katumbas sa Tagalog.
- source_word: אֶת אָבִינוּ
  choice: kasama ... ng aming ama
  rationale: Ang אֶת dito ay nagpapahayag ng pagsama, hindi pananda ng tuwirang layon.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Sa pahayag na ito, natural na inihahatid ng 'ngayon' ang kasalukuyang kalagayang tinutukoy ng Hebrew na 'sa araw na ito/today.'
- source_word: וְהָאֶחָד אֵינֶנּוּ
  choice: at wala na ang isa
  rationale: Pinananatili ang eupemistikong kalabuan ng literal na 'ang isa ay wala,' na maaaring tumukoy sa pagkawala o magpahiwatig ng kamatayan nang hindi tahasang pinipili ang alinman.
theological_decisions:
- issue: Panlalaking wika ng pagkakamag-anak
  choice: mga anak na lalaki ng iisang ama
  alternative: mga anak ng iisang ama
  rationale: Tiyak na panlalaki ang Hebrew at ang tinutukoy ay mga lalaking anak ni Jacob, kaya hindi ginawang neutral ang kasarian.
- issue: Kalagayan ni Jose sa pariralang אֵינֶנּוּ
  choice: wala na ang isa
  alternative: patay na ang isa
  rationale: Hindi tahasang sinasabi ng mga kapatid na patay na si Jose. Pinananatili ng salin ang tensiyon sa pagitan ng pagkawala at ipinahihiwatig na kamatayan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Ginamit ang “lingkod” bilang magalang na pagpapakumbaba sa harap ng pinuno, “bunso” para sa malinaw na ugnayang pampamilya, at “wala na” upang mapanatili ang tunay na kalabuan ng Hebrew.
