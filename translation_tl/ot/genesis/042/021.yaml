base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/021.yaml
  text: Then they said to one another[a], “Indeed, we are guilty concerning our brother, because we saw the distress of his soul when he pleaded with us, and we did not listen[b]. Therefore this distress has come upon us.”
translation:
  language: tl
  text: Pagkatapos, sinabi nila sa isa’t isa, “Tunay ngang may kasalanan tayo sa ating kapatid. Nakita natin ang matindi niyang paghihirap[a] nang magmakaawa siya sa atin, at hindi tayo nakinig. Kaya dumating sa atin ang paghihirap na ito[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “ang paghihirap ng kanyang kaluluwa,” isang Hebreong pahayag para sa malalim at personal na paghihirap.'
    reason: lexical_alternative
  - marker: b
    text: Magkakaugnay na anyo ng iisang salitang Hebreo ang ginamit para sa “paghihirap” ni Jose at sa “paghihirap” na dinaranas ngayon ng kanyang mga kapatid. Sa ganitong paraan, iniuugnay ng pananalita ang dati nilang kalupitan sa kasalukuyan nilang pagdurusa.
    reason: wordplay
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: Pagkatapos, sinabi nila sa isa’t isa
  rationale: Likas sa makabagong Tagalog ang “sa isa’t isa” para sa Hebreong idyomang nagpapahayag na nag-usap-usap ang magkakapatid; ipinahihiwatig ng “Pagkatapos” ang pagsulong ng salaysay.
- source_word: אֲבָל אֲשֵׁמִים אֲנַחְנוּ
  choice: Tunay ngang nagkasala tayo
  rationale: Ang אֲבָל ay mariing pagkilala rito, hindi panandang pagsalungat. Ipinapahayag ng “Tunay nga” ang taimtim na pag-amin, at ng “nagkasala tayo” ang kanilang pagkakasala at pananagutan sa natural na Tagalog.
- source_word: עַל־אָחִינוּ
  choice: tungkol sa ating kapatid
  rationale: Tinutukoy ng עַל ang bagay na pinagmulan o saklaw ng kanilang pagkakasala. Pinananatili ng “tungkol sa” ang lawak ng parirala nang hindi ipinapasok ang mas tiyak na “laban sa.”
- source_word: צָרַת נַפְשׁוֹ
  choice: ang matindi niyang paghihirap
  rationale: Ang literal na “paghihirap ng kanyang kaluluwa/buhay” ay isang Hebreong pahayag para sa matinding personal na dalamhati. Mas malinaw at likas sa Tagalog ang “matindi niyang paghihirap,” habang inilalagay sa talababa ang literal na anyo.
- source_word: בְּהִתְחַנְנוֹ אֵלֵינוּ
  choice: nang magmakaawa siya sa atin
  rationale: Ipinahahayag ng anyong hitpael ng חנן ang taimtim na pagsusumamo. Tumpak ang “magmakaawa” nang hindi idinaragdag kung ano mismo ang hinihingi.
- source_word: וְלֹא שָׁמָעְנוּ
  choice: ngunit hindi tayo nakinig
  rationale: Sa konteksto, ang שׁמע ay hindi lamang pagkarinig kundi pakikinig at pagtugon. Ang “ngunit” ay natural na nagpapakita ng salungat nilang tugon sa kanyang pagmamakaawa.
- source_word: עַל־כֵּן בָּאָה אֵלֵינוּ הַצָּרָה הַזֹּאת
  choice: Kaya dumating sa atin ang paghihirap na ito
  rationale: Malinaw na ipinapahayag ng “Kaya” ang bunga o kinahinatnan. Inuulit ang “paghihirap” upang mapanatili ang ugnayang leksikal ng צָרַת at הַצָּרָה sa Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang inklusibong “tayo/ating/atin” sapagkat nag-uusap ang magkakapatid at kasama sa pag-amin ang bawat nagsasalita. Iniwasan ang sobrang literal na “paghihirap ng kanyang kaluluwa” sa pangunahing teksto dahil hindi ito likas sa karaniwang Tagalog, ngunit pinanatili ang pahiwatig nito sa talababa at ang pag-uulit ng “paghihirap” sa talata.
