  to: Pagkatapos, sinabi nila sa isa’t isa, “Tunay ngang may kasalanan tayo sa ating kapatid. Nakita natin ang matindi niyang paghihirap[a] nang magmakaawa siya sa atin, at hindi tayo nakinig. Kaya dumating sa atin ang paghihirap na ito[b].”
