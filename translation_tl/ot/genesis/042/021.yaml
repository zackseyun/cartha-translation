  source_fidelity: Tumpak na naipapahayag ng draft ang sama-samang pag-amin ng magkakapatid, ang pagkakita nila sa paghihirap ni Jose habang nagsusumamo siya, ang hindi nila pakikinig, at ang bunga nito. Napananatili rin ang pag-uulit ng salitang tumutumbas sa צָרָה. Gayunman, ang “nagkasala tayo tungkol sa ating kapatid” ay hindi likas at hindi malinaw sa Tagalog bilang pagtukoy sa pagkakasala nila laban sa kapatid.
  naturalness: Mas natural at malinaw sa modernong Tagalog ang “May kasalanan tayo sa ating kapatid.” Ang simpleng “at hindi tayo nakinig” ay mas malapit din sa payak na Hebreong waw kaysa “ngunit,” na nagdaragdag ng mas mariing pagsalungat. Inilapit ang talababa b sa “paghihirap na ito,” ang bahaging tinutukoy nito.
  terminology: Ang “paghihirap” ay angkop para sa parehong צָרַת at צָרָה at pinananatili ang ugnayang leksikal. Ang “kaluluwa” sa talababa ay wastong literal na katumbas, habang ang paliwanag na ito ay idyoma para sa malalim na personal na paghihirap ay hindi nagpapataw ng teolohikal na pakahulugan.
