  yaml_path: translation/ot/genesis/042/015.yaml
  text: 'By this you will be tested: as Pharaoh lives[a], you shall not leave this place unless your youngest brother comes here.'
translation:
  language: tl
  text: 'Sa ganitong paraan kayo susubukin: Buhay ang Faraon! Hindi kayo makaaalis dito[a] malibang pumarito ang bunso ninyong kapatid.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, literal na “kung aalis kayo rito.” Sa ganitong pormula ng panunumpa, ang “kung” ay nagpapahayag ng mariing pagtanggi: “hindi kayo makaaalis dito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: Sa ganitong paraan
  rationale: Ipinahahayag ng instrumental na בְּ kasama ng demonstratibo ang paraan o batayan ng pagsubok; malinaw at natural ito sa modernong Tagalog.
- source_word: תִּבָּחֵנוּ
  choice: kayo susubukin
  rationale: Ang Niphal ng בחן ay nangangahulugang isailalim sa pagsubok o pagsusuri upang mapatunayan ang isang pahayag.
- source_word: חֵי פַרְעֹה
  choice: Kung paanong buhay ang Faraon
  rationale: Pinananatili nito ang sinaunang pormula ng panunumpa na tumatawag sa buhay ng Faraon bilang katiyakan, nang hindi nagdaragdag ng tahasang pandiwang wala sa Hebreo.
- source_word: אִם תֵּצְאוּ מִזֶּה
  choice: hindi kayo makaaalis dito
  rationale: Pagkatapos ng pormula ng panunumpa, ang אִם ay ginagamit bilang mariing pagtanggi, hindi bilang karaniwang pasubali. Ang makaaalis ay angkop sa ipinagkakait na pahintulot o posibilidad.
- source_word: כִּי אִם
  choice: malibang
  rationale: Ipinakikilala ng magkaugnay na mga kataga ang tanging kundisyon o eksepsiyon sa mariing pagtanggi.
- source_word: בְּבוֹא
  choice: pumarito
  rationale: Ang infinitive construct na may בְּ ay nagsasaad ng pangyayaring kailangang maganap; isinama sa pumarito ang direksiyong ipinahahayag ng הֵנָּה.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: ang bunso ninyong kapatid
  rationale: Sa konteksto ng magkakapatid, ang הַקָּטֹן ay tumutukoy sa pinakabata, kaya natural at tiyak ang bunso sa Tagalog.
- source_word: הֵנָּה
  choice: pumarito
  rationale: Ang adberbyong pandireksiyon ay nangangahulugang papunta rito; likas itong naipapaloob sa pandiwang pumarito.
theological_decisions:
- issue: Lakas at anyo ng panunumpa sa buhay ng Faraon
  choice: Kung paanong buhay ang Faraon
  alternative: Isinusumpa ko sa buhay ng Faraon
  rationale: Pinananatili ng napiling anyo ang pormulang Hebreo at ang bigat ng panunumpa nang hindi ipinapasok ang tahasang unang panauhang “isinusumpa ko,” na ipinahihiwatig lamang sa pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Iniwasan ang lipas na pananalita at pinanatili ang kakaibang pormula ng panunumpa sa halip na lubusang gawing karaniwang pahayag.
