  text: But they said to him[a], “No, my lord; your servants have come to buy food.”
translation:
  language: tl
  text: Ngunit sinabi nila sa kanya, “Hindi po, panginoon ko. Naparito ang inyong mga lingkod upang bumili ng pagkain.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “butil.” “Pagkain” ang mas malawak na kahulugan ng salitang Hebreo, bagaman sa konteksto ng taggutom ay malamang na butil ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Ngunit sinabi nila sa kanya
  rationale: Isinusulong ng waw-consecutive ang salaysay, at ang “ngunit” ay natural na nagpapakita ng pagsalungat nila sa paratang ni Jose. Tinutukoy ng אֵלָיו na kay Jose nakatuon ang sagot.
- source_word: לֹא
  choice: Hindi po
  rationale: Mariing pagtanggi ito sa tuwirang pananalita. Idinagdag ang “po” bilang likas na panandang-galang sa modernong Tagalog, ayon sa mapagpakumbabang tono ng pakikipag-usap nila sa isang mataas na opisyal.
- source_word: אֲדֹנִי
  choice: panginoon ko
  rationale: Pinananatili nito ang magalang at mapagpasakop na katawagan sa isang nakatataas, nang hindi ipinahihiwatig na siya ay Diyos.
- source_word: וַעֲבָדֶיךָ
  choice: ang inyong mga lingkod
  rationale: Bagaman maaaring tumukoy ang עֶבֶד sa alipin, magalang na pagtukoy ito rito ng mga nagsasalita sa kanilang sarili, hindi pahayag tungkol sa kanilang legal na katayuan.
- source_word: בָּאוּ
  choice: Naparito
  rationale: Likas itong paraan sa Tagalog upang ipahayag na dumating sila sa kinaroroonan ni Jose para sa layuning kasunod na binanggit.
- source_word: לִשְׁבָּר אֹכֶל
  choice: upang bumili ng pagkain
  rationale: Ang לִשְׁבָּר ay tumutukoy rito sa pagbili ng panustos, at ang אֹכֶל ay literal na mas malawak na “pagkain.” Hindi tinukoy sa pangunahing teksto na butil lamang ito, bagaman iyon ang malamang na tinutukoy sa konteksto ng taggutom.
