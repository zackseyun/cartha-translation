translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ngunit madaling maunawaan. Ginamit ang “po,” “panginoon ko,” at “inyong mga lingkod” upang maipakita ang deferensiya ng magkakapatid sa opisyal nang hindi nagiging labis na makaluma.
