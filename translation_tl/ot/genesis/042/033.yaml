  to: 'At sinabi sa amin ng lalaki—ang panginoon ng lupain—“Sa ganitong paraan ko malalaman na mga taong tapat kayo: iwan ninyo sa akin ang isa sa inyong mga kapatid, kumuha kayo ng butil para sa taggutom na dinaranas ng inyong mga sambahayan[a], at umalis kayo.”'
