base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/033.yaml
  text: 'Then the man[a], the lord of the land, said to us, ‘By this I will know that you are honest: leave one of your brothers with me, take grain for the famine of your households, and go.’'
translation:
  language: tl
  text: 'At sinabi sa amin ng lalaki—ang panginoon ng lupain—“Sa ganitong paraan ko malalaman na mga taong tapat kayo: iwan ninyo sa akin ang isa sa inyong mga kapatid, kumuha kayo ng butil para sa taggutom na dinaranas ng inyong mga sambahayan[a], at umalis kayo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “kunin ninyo ang taggutom ng inyong mga sambahayan.” Ang diwa ay kumuha sila ng butil o panustos dahil sa taggutom na dinaranas ng kanilang mga sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: ang lalaki, ang panginoon ng lupain
  rationale: Pinananatili ang karaniwang kahulugan ng הָאִישׁ at ang kasunod na pariralang naglalarawan sa kaniyang mataas na kapangyarihan sa lupain.
- source_word: בְּזֹאת
  choice: Sa ganitong paraan
  rationale: Tumutukoy ito sa paraan o pagsubok na magiging batayan upang makilala ang kanilang pagkatao.
- source_word: אֵדַע
  choice: ko malalaman
  rationale: Ipinahihiwatig ng anyong pandiwa ang resultang mangyayari kapag tinupad ng magkakapatid ang iniutos.
- source_word: כֵנִים
  choice: tapat
  rationale: Sa salaysay, inilalarawan nito ang mga taong nagsasabi ng totoo at hindi mga espiya; likas at malinaw ang “tapat” sa makabagong Filipino.
- source_word: אֲחִיכֶם הָאֶחָד
  choice: ang isa sa inyong mga kapatid
  rationale: Likas na ipinapahayag sa Filipino ang pagtukoy sa isang kapatid mula sa buong pangkat.
- source_word: הַנִּיחוּ אִתִּי
  choice: iwan ninyo sa akin
  rationale: Ang Hiphil ng נוח dito ay nangangahulugang iwan o hayaang manatili sa piling ng nagsasalita.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: butil para sa taggutom na dinaranas ng inyong mga sambahayan
  rationale: Eliptiko ang Hebreo, na literal na nagsasabing kunin ang “taggutom” ng kanilang mga sambahayan. Ginawang tahasan ang “butil” dahil iyon ang binibili at dinadala sa konteksto, habang pinananatili ang ugnayan sa taggutom.
- source_word: קְחוּ וָלֵכוּ
  choice: kumuha kayo ... at umalis kayo
  rationale: Pinananatili ang tuwiran at sunod-sunod na puwersa ng dalawang pautos.
