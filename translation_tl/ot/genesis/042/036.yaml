base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/036.yaml
  text: 'And Jacob their father said to them[a], “You have bereaved me: Joseph is no more, and Simeon is no more, and you would take Benjamin[b]. All these things have come against me.”'
translation:
  language: tl
  text: At sinabi sa kanila ng kanilang amang si Jacob, “Pinagkaitan ninyo ako ng mga anak[a]. Wala na si Jose, wala na rin si Simeon, at kukunin pa ninyo si Benjamin. Lahat ng ito ay laban sa akin[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ginawa ninyo akong walang anak.”
    reason: lexical_alternative
  - marker: b
    text: O, “Ang lahat ng mga ito ay sumapit sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכַּלְתֶּם
  choice: Inulila ninyo ako
  rationale: 'Ipinananatili nito ang tuwirang causative na diwa ng Piel: sinisisi ni Jacob ang mga anak niya sa pagkawala ng kaniyang mga anak. Maikli rin ito at taglay ang bigat ng kaniyang dalamhati.'
- source_word: אֵינֶנּוּ
  choice: Wala na
  rationale: Likas na idyomang Filipino ito para sa pagkawala o hindi na pagkapiling, at hindi lamang sa payak na pagtanggi sa pag-iral. Hindi nito tiyakang sinasabing patay na si Simeon.
- source_word: תִּקָּחוּ
  choice: kukunin pa ninyo
  rationale: Ang anyong imperfect ay tumutukoy sa balak na pagkuha kay Benjamin. Ipinahahayag ng “pa” ang protesta ni Jacob sa panibagong pagkawala nang hindi binabago ang pangunahing diwa.
- source_word: עָלַי הָיוּ כֻלָּנָה
  choice: Lahat ng ito ay laban sa akin
  rationale: Pinananatili nito ang kolektibong “lahat” at ang masamang epekto ng עָלַי sa pananaw ni Jacob, habang iniiwan ang likas na pag-igting kung ang tinutukoy ay mga pangyayari o mga taong sangkot.
- source_word: אֹתִי
  choice: ako
  rationale: Tahasan itong pinanatili upang maipakita ang diin ng Hebreo kay Jacob bilang dumaranas ng pagkawala.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: kanilang amang si Jacob
  rationale: Ito ang natural at marangal na ayos sa modernong Filipino para sa appositional na parirala.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Wala na” upang mapanatili ang hindi tiyak na katangian ng pagkawala, at ang mga talababa upang ilahad ang mahahalagang alternatibong leksikal nang hindi nilulutas nang sapilitan ang ambiguwidad ng Hebreo.
