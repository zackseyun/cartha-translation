  to: At sinabi sa kanila ng kanilang amang si Jacob, “Pinagkaitan ninyo ako ng mga anak[a]. Wala na si Jose, wala na rin si Simeon, at kukunin pa ninyo si Benjamin. Lahat ng ito ay laban sa akin[b].”
