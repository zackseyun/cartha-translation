base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/019.yaml
  text: And it happened that when his master heard the words of his wife that she spoke to him[a], saying[b], “According to these words your servant did to me,” his anger burned.
translation:
  language: tl
  text: 'Nang marinig ng amo ni Jose ang sinabi ng kanyang asawa sa kanya: “Ganito ang ginawa sa akin ng alipin mo,” nag-alab ang kanyang galit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Nang marinig
  rationale: Ang וַיְהִי ay bahagi ng karaniwang daloy ng salaysay, at ang כִשְׁמֹעַ ay temporal. Sa modernong Tagalog, likas na naihahatid ng “Nang marinig” ang ugnayang ito nang hindi gumagamit ng mabigat na “At nangyari na.”
- source_word: אֲדֹנָיו
  choice: amo ni Jose
  rationale: Tumutukoy ito kay Potifar bilang may-ari at nakatataas kay Jose. Nilinaw ang reperente sa Tagalog upang maiwasan ang malabong sunod-sunod na panghalip.
- source_word: דִּבְרֵי אִשְׁתּוֹ אֲשֶׁר דִּבְּרָה אֵלָיו
  choice: ang sinabi ng kanyang asawa sa kanya
  rationale: Natural na Tagalog para sa literal na “mga salita ng kanyang asawa na sinabi nito sa kanya,” habang pinananatili ang pagkilos ng pagsasalita at ang tumanggap nito.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang tutuldok ay likas na panandang Tagalog sa tuwirang sipi at ginagampanan ang quotative function ng לֵאמֹר nang hindi nagdaragdag ng paulit-ulit na “na sinasabi.”
- source_word: כַּדְּבָרִים הָאֵלֶּה עָשָׂה לִי
  choice: Ganito ang ginawa sa akin
  rationale: Ang כַּדְּבָרִים הָאֵלֶּה ay maaaring tumukoy sa gayong mga bagay o sa paraang inilarawan. Ang “Ganito” ay natural at sadyang hindi tinutukoy nang higit sa Hebreo ang diumano’y ginawa.
- source_word: עַבְדֶּךָ
  choice: alipin mo
  rationale: Bagaman maaaring mangahulugang lingkod ang עבד, malinaw sa konteksto ng sambahayan ni Potifar na si Jose ay isang taong binili at pag-aari; kaya mas tumpak ang “alipin.”
- source_word: וַיִּחַר אַפּוֹ
  choice: nag-alab ang kanyang galit
  rationale: Pinananatili nito ang Hebreong metapora ng nag-aapoy na galit sa natural at marangal na Tagalog.
theological_decisions:
- issue: Hindi tahasang sinasabi kung kanino o sa ano nakatuon ang galit ng amo.
  choice: nag-alab ang kanyang galit
  alternative: galit na galit siya kay Jose
  rationale: Hindi tinutukoy ng Hebreo ang target ng galit. Ang salin ay hindi nagdaragdag na kay Jose iyon nakatuon, kaya napapanatili ang tunay na kalabuan ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “amo” at “alipin” upang malinaw na maipakita ang ugnayang panlipunan sa konteksto. Walang talababa dahil ang mahalagang kalabuan ng כַּדְּבָרִים הָאֵלֶּה ay maihahatid ng “Ganito,” at walang kailangang marker sa pangunahing teksto.
