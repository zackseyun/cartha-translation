  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יְהִ֖י אִ֣ישׁ מַצְלִ֑יחַ וַ/יְהִ֕י בְּ/בֵ֥ית אֲדֹנָ֖י/ו הַ/מִּצְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/002.yaml
  text: Yahweh was with Joseph[a], and he became a successful man; and he was in the house of his Egyptian master.
translation:
  language: tl
  text: Si Yahweh ay kasama ni Jose, at siya ay naging isang matagumpay na tao[a]. Siya ay nasa bahay ng kanyang among Ehipsiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “taong umuunlad.” Ang participle sa Hebreo ay maaaring tumukoy sa isang taong nagtatagumpay o umuunlad.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶת יוֹסֵף
  choice: kasama ni Jose
  rationale: Likas sa modernong Tagalog at tumpak na ipinahahayag ang presensiya at pagsang-ayon ng Diyos kay Jose.
- source_word: אִישׁ מַצְלִיחַ
  choice: matagumpay na tao
  rationale: Ang participle na מַצְלִיחַ ay tumutukoy sa taong nagtatagumpay o umuunlad; mas malawak ang 'matagumpay' kaysa sa salapi lamang.
- source_word: בְּבֵית
  choice: sa bahay
  rationale: Pinananatili ang kongkretong diwa ng parirala at ang tagpuan ng salaysay.
- source_word: אֲדֹנָיו
  choice: kanyang amo
  rationale: Sa konteksto ng kalagayan ni Jose bilang alipin, natural na tawag sa Tagalog ang 'amo' para sa taong may kapangyarihan sa kanya.
- source_word: הַמִּצְרִי
  choice: Ehipsiyo
  rationale: Tinutukoy nito ang lahi o bansang pinagmulan ng amo ni Jose.
- source_word: וַיְהִי ... וַיְהִי ... וַיְהִי
  choice: kasama ... naging ... nanirahan
  rationale: Isinalin nang natural ang sunod-sunod na sugnay habang pinananatili ang kalagayan, naging bunga, at tagpuan. Ang huling היה kasama ng בְּבֵית ay ipinahayag bilang 'nanirahan' upang maging malinaw na nasa bahay siya.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Direktang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulong 'Panginoon'.
- issue: Ugnayan ng presensiya ni Yahweh at tagumpay ni Jose
  choice: kaya naging matagumpay siyang tao
  alternative: at naging matagumpay siyang tao
  rationale: Ipinakikita ng konteksto na kaugnay ng presensiya ni Yahweh ang tagumpay ni Jose. Gayunman, hindi pinalalawak ang tagumpay tungo sa isang tiyak na doktrina ng materyal na kasaganaan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'Jose' at 'Ehipsiyo' bilang karaniwang anyong Tagalog, at 'amo' bilang natural na katawagan sa kontekstong ito.
