base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/023.yaml
  text: The chief of the prison paid attention to nothing that was in his hand[a], because Yahweh was with him; and whatever he did[c][b], Yahweh made prosper.
translation:
  language: tl
  text: Hindi na inasikaso ng pinuno ng bilangguan ang anumang nasa pangangasiwa ni Jose[a], sapagkat kasama niya si Yahweh; at si Yahweh ang nagbibigay ng tagumpay sa anumang ginagawa niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang anumang nasa kanyang kamay,” isang idyomang Hebreo para sa anumang nasa pangangasiwa o pananagutan ni Jose.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “Pinagiging matagumpay ni Yahweh ang anumang ginagawa niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: pinuno ng bilangguan
  rationale: Ipinahihiwatig ng שַׂר ang isang namamahalang opisyal, hindi lamang isang bantay; malinaw at natural sa makabagong Tagalog ang “pinuno ng bilangguan.”
- source_word: אֵין ... רֹאֶה אֶת כָּל מְאוּמָה
  choice: Hindi na pinakialaman ... ang anumang
  rationale: Sa konteksto, ang literal na “hindi tumitingin sa anuman” ay nangangahulugang hindi na sinusuri o inaasikaso ng pinuno ang mga bagay na ipinamahala kay Jose. Ang “hindi na pinakialaman” ay natural na naghahatid ng pagtitiwala niya kay Jose.
- source_word: בְּיָדוֹ
  choice: ipinagkatiwala kay Jose
  rationale: Ang “nasa kanyang kamay” ay idyomang Hebreo para sa nasa pangangasiwa o kontrol ng isang tao. Ginawang tahasan si Jose upang maging malinaw ang tinutukoy ng panghalip sa Tagalog.
- source_word: בַּאֲשֶׁר יְהוָה אִתּוֹ
  choice: sapagkat kasama niya si Yahweh
  rationale: 'May diwang sanhi ang parirala rito: ang presensiya ni Yahweh kay Jose ang dahilan ng pagtitiwala at tagumpay.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וַאֲשֶׁר הוּא עֹשֶׂה
  choice: ang anumang ginagawa niya
  rationale: Inihahatid nito ang malawak na saklaw ng konstruksiyong Hebreo at ang aspektong nagpapatuloy ng pandiwari עֹשֶׂה.
- source_word: מַצְלִיחַ
  choice: pinagtatagumpay
  rationale: 'Ang anyong Hiphil ay causative: si Yahweh ang sanhi ng pagtatagumpay ng ginagawa ni Jose.'
theological_decisions:
- issue: Paglalarawan sa pagkilos ni Yahweh sa tagumpay ni Jose
  choice: pinagtatagumpay ni Yahweh
  alternative: binibigyan ni Yahweh ng tagumpay
  rationale: Kapuwa pinananatili ng mga pagbasa ang causative na lakas ng מַצְלִיחַ; ang napili ay maikli at malinaw na si Yahweh ang nagpapangyari ng tagumpay.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalang pantangi ang nasa tekstong Hebreo, kaya isinalin ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pinakialaman” sa neutral na diwang hindi na sinuri o inasikaso ng pinuno ang gawaing ipinamahala kay Jose; hindi ito nagpapahiwatig ng masamang pakikialam.
