revisions:
- from: Dinala si Jose pababa sa Ehipto, at binili siya mula sa mga Ismaelita na nagdala sa kaniya roon ni Potifar, isang opisyal[a] ng Faraon, pinuno ng mga bantay, at isang Ehipsiyo.[b]
  to: Si Jose ay dinala na sa Ehipto, at binili siya ni Potifar, isang opisyal[a] ng Faraon, pinuno ng mga bantay, at isang Ehipsiyo,[b] mula sa mga Ismaelita na nagdala sa kaniya roon.
  rationale: Inayos ang pagkakasunod-sunod upang agad na makilala si Potifar bilang bumili kay Jose at upang ang magkakasunod na titulo ay walang alinlangang tumukoy sa kaniya. Ang “dinala na” ay angkop na nagpapahiwatig ng naunang pagdadala bago ang pagbili, habang pinananatili ang motibo ng “pagbaba” sa kontekstong patungo sa Ehipto. Hindi binago ang kahulugan, mga pangalan, titulo, o mga talababa.
