  terminology: Ang “opisyal ng Faraon,” “pinuno ng mga bantay,” “Ehipsiyo,” at “mga Ismaelita” ay angkop. Pinananatili ng talababa ang leksikal na posibilidad na “eunuko” para sa סָרִיס.
