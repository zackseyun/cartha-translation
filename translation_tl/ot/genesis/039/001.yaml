  text: וְ/יוֹסֵ֖ף הוּרַ֣ד מִצְרָ֑יְמָ/ה וַ/יִּקְנֵ֡/הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַ/טַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִ/יַּד֙ הַ/יִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖/הוּ שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/001.yaml
  text: Joseph had been brought down to Egypt[a], and Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian[b], bought him from the Ishmaelites who had brought him down there.
translation:
  language: tl
  text: Si Jose ay dinala na sa Ehipto, at binili siya ni Potifar, isang opisyal[a] ng Faraon, pinuno ng mga bantay, at isang Ehipsiyo,[b] mula sa mga Ismaelita na nagdala sa kaniya roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring mangahulugang “opisyal ng palasyo” o “eunuko.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “isang lalaking Ehipsiyo.”
    reason: previous_rendering
lexical_decisions:
- source_word: הוּרַד
  choice: Dinala ... pababa
  rationale: Ang Hophal ng ירד ay pasibo at nagpapahiwatig na si Jose ay pinapangyaring bumaba; malinaw at natural sa Tagalog ang “dinala ... pababa,” at pinananatili nito ang paulit-ulit na motibo ng pagbaba.
- source_word: מִצְרָיְמָה
  choice: sa Ehipto
  rationale: Ipinahihiwatig ng hulaping paturol ang paggalaw patungong Ehipto; sa Tagalog, natural na ipinapahayag ito ng “sa Ehipto” kasunod ng pandiwang “dinala.”
- source_word: וַיִּקְנֵהוּ
  choice: binili siya
  rationale: Sa konteksto ng pagbebenta kay Jose, ang קנה ay tuwirang nangangahulugang bumili; pinananatili ng salin ang puwersa ng transaksiyon.
- source_word: סְרִיס פַּרְעֹה
  choice: isang opisyal ng Faraon
  rationale: Maaaring tumukoy ang סְרִיס sa opisyal ng palasyo o sa isang eunuko. Ang “opisyal” ang pinakaligtas at pinakanatural sa pangunahing teksto, habang nasa talababa ang tunay na alternatibo.
- source_word: שַׂר הַטַּבָּחִים
  choice: pinuno ng mga bantay
  rationale: Ang titulo ay maaaring tumukoy sa pinuno ng maharlikang bantay o ng mga tagapagpatupad ng hatol. Ang “pinuno ng mga bantay” ay malinaw at hindi labis na nagtatakda sa pinagtatalunang tungkulin.
- source_word: אִישׁ מִצְרִי
  choice: isang Ehipsiyo
  rationale: Natural sa modernong Tagalog ang “isang Ehipsiyo”; sapat nitong ipinahahayag ang pagkamamamayan o lahi ni Potifar nang hindi ginagamit ang paulit at mabigat na “isang lalaking Ehipsiyo.”
- source_word: מִיַּד
  choice: mula sa
  rationale: Bagaman literal na “mula sa kamay,” sa konteksto ng pagbili ay natural at sapat ang “mula sa.”
- source_word: הַיִּשְׁמְעֵאלִים
  choice: mga Ismaelita
  rationale: Tuwirang pinananatili ang katawagang etniko; hindi idinaragdag ang “mangangalakal,” na hinuha lamang mula sa konteksto.
- source_word: אֲשֶׁר הוֹרִדֻהוּ שָׁמָּה
  choice: na nagdala sa kaniya roon
  rationale: Malinaw na tumutukoy ang sugnay sa mga Ismaelita. Pinananatili ng “nagdala” ang pag-uulit ng ugat ירד, at ng “roon” ang שָׁמָּה.
theological_decisions:
- issue: Kahulugan ng סְרִיס sa titulo ni Potifar
  choice: “opisyal ng Faraon” sa pangunahing teksto
  alternative: “eunuko ng Faraon”
  rationale: 'May tunay na leksikal na kalabuan ang salitang Hebreo: maaari itong tumukoy sa opisyal ng korte o sa lalaking kinapon. Hindi hinihingi ng salaysay ang biyolohikal na kahulugan, kaya ginamit ang mas malawak na “opisyal” at pinanatili sa talababa ang alternatibo.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Inayos ang pagkakasunod ng mga parirala upang hindi mapagkamalang si Jose ang opisyal ng Faraon. Ang mga titulong tumutukoy kay Potifar ay pinanatiling magkakasunod, at iniwasan ang dagdag na panandang diskurso na walang tahasang katumbas sa Hebreo.
