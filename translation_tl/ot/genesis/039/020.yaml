base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/020.yaml
  text: So Joseph’s master took him and put him into the prison[a], the place where the king’s prisoners were confined[b]. And he was there in the prison.
translation:
  language: tl
  text: Kaya, kinuha ng panginoon ni Jose si Jose at ipinasok siya sa bilangguan[a], sa lugar kung saan ikinukulong ang mga bilanggo ng hari[b]. At naroon siya sa bilangguan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “bahay ng sohar”; ang sohar ay terminong Ehipsiyo para sa bilangguan o bahay na piitan.
    reason: cultural_note
  - marker: b
    text: 'Inuulit ng Hebreo ang salitang-ugat na nangangahulugang “itali/ikulong”: literal, “kung saan nakakulong ang mga bilanggo ng hari.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֵי יוֹסֵף
  choice: panginoon ni Jose
  rationale: Sa kontekstong ito, ang אֲדֹנֵי ay tumutukoy sa taong may kapangyarihan kay Jose bilang kanyang amo, hindi sa Diyos. Ang “panginoon” ay marangal at likas sa salaysay ng pagkaalipin, at hindi ito ginawang “Panginoon” upang maiwasan ang banal na titulo.
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Karaniwang kahulugan ng לקח ang “kumuha.” Hindi kinakailangang palakasin ito bilang “sinunggaban,” sapagkat walang tahasang pagpapatindi sa Hebreo.
- source_word: וַיִּתְּנֵהוּ אֶל
  choice: ipinasok
  rationale: Sa kontekstong ito, ang נתן na may אֶל ay nagsasaad ng paglalagay sa loob ng isang lugar. Ang “ipinasok” ay natural sa Filipino para sa pagpapakulong at pinananatili ang kilos patungo sa bilangguan.
- source_word: בֵּית הַסֹּהַר
  choice: bilangguan
  rationale: Literal itong “bahay ng sohar,” na gumagamit ng terminong Ehipsiyo para sa piitan o bahay-pigil. Malinaw sa konteksto na bilangguan ang tinutukoy, kaya ito ang natural at malinaw na katumbas.
- source_word: מְקוֹם אֲשֶׁר
  choice: sa lugar kung saan
  rationale: Pinananatili nito ang tahasang paliwanag ng Hebreo na ang bilangguan ang lugar kung saan ikinukulong ang mga bilanggo ng hari.
- source_word: אֲסוּרֵי הַמֶּלֶךְ אֲסוּרִים
  choice: ikinukulong ang mga bilanggo ng hari
  rationale: Magkaugnay na anyo ng ugat אסר ang inuulit sa Hebreo. Ang “ikinukulong ang mga bilanggo” ay nagpapanatili ng kapansin-pansing pag-uulit nang nananatiling nauunawaan sa modernong Filipino.
- source_word: וַיְהִי שָׁם
  choice: At naroon siya
  rationale: Payak nitong ipinahahayag ang kinalalagyan ni Jose. Hindi idinagdag ang di-tahasang aspektong “nanatili.”
- source_word: בְּבֵית הַסֹּהַר
  choice: sa bilangguan
  rationale: Inuulit ng Hebreo ang lokasyon sa hulihan para sa diin; pinananatili rin ito sa salin.
theological_decisions:
- issue: Ang katawagang אֲדֹנֵי para sa may-ari ni Jose
  choice: panginoon ni Jose
  alternative: amo ni Jose
  rationale: Tumutukoy ito sa taong may awtoridad kay Jose, hindi sa Diyos. Ang maliit na titik at malinaw na konteksto ay nag-iingat laban sa pag-unawa rito bilang banal na titulo, habang pinananatili ang bigat ng relasyong panginoon-alipin.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang karaniwang anyong “Jose.” Pinanatili ang pag-uulit ng “bilangguan” at, hangga't natural, ang pag-uulit na kaugnay ng pagkakakulong sa orihinal.
