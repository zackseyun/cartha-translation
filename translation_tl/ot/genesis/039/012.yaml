  yaml_path: translation/ot/genesis/039/012.yaml
  text: Then she grabbed him by his garment[a], saying[b], “Lie with me!” But he left his garment in her hand and fled and went outside.
translation:
  language: tl
  text: Sinunggaban siya ng babae sa damit ni Jose[a] at sinabi, “Sumiping ka sa akin!”[b] Ngunit iniwan ni Jose ang kanyang damit sa kamay ng babae; tumakas siya at lumabas sa labas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “balabal” o “kasuotan.” Pangkalahatang tawag ang salitang Hebreo sa isang piraso ng damit.
    reason: lexical_alternative
  - marker: b
    text: Literal na “Humiga ka kasama ko!” Isa itong pahiwatig na seksuwal sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפְּשֵׂהוּ
  choice: Sinunggaban siya ng babae
  rationale: Ang תפשׂ ay tumutukoy sa mahigpit at biglaang paghawak. Likas at matingkad sa makabagong Tagalog ang “sinunggaban,” at nililinaw ng “ng babae” ang gumagawa ng kilos.
- source_word: בְּבִגְדוֹ / בִּגְדוֹ
  choice: sa kanyang damit / ang kanyang damit
  rationale: Pangkalahatang katawagan ang בגד para sa isang kasuotan, kaya hindi ito nilimitahan sa balabal o roba. Ang “damit” ang pinakanatural at may sapat na lawak sa Tagalog.
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Ipinapakilala ng anyong Hebreo ang tuwirang pananalita. Mas natural sa salaysay na Tagalog ang “at sinabi” kaysa sa literal na “na nagsasabi.”
- source_word: שִׁכְבָה עִמִּי
  choice: Sumiping ka sa akin!
  rationale: Ang parirala ay isang pahiwatig na seksuwal. Pinananatili ng “sumiping” ang eupemistikong anyo at marangal na himig nang hindi ginagawang tahasang “makipagtalik.”
- source_word: וַיַּעֲזֹב
  choice: iniwan
  rationale: Sa konteksto, iniwan ni Jose ang damit na hawak ng babae. Tumpak at natural ang “iniwan.”
- source_word: בְּיָדָהּ
  choice: sa kamay ng babae
  rationale: Literal na “sa kanyang kamay” ang Hebreo. Inulit ang “ng babae” upang maiwasan ang kalituhan sa kasarian na maaaring idulot ng panghalip sa Tagalog.
- source_word: וַיָּנָס
  choice: tumakas siya
  rationale: Ipinahihiwatig ng נוס ang apurahang pagtakas; tuwiran at natural itong naihahayag ng “tumakas.”
- source_word: וַיֵּצֵא הַחוּצָה
  choice: at lumabas
  rationale: Pinananatili nito ang hiwalay na kilos ng paglabas kasunod ng pagtakas, gaya ng sunod-sunod na pandiwa sa Hebreo.
