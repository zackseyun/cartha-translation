  source_fidelity: 'Tumpak ang pangunahing daloy: hinawakan ng babae si Jose sa damit, inanyayahan siyang sumiping, iniwan niya ang damit sa kamay nito, tumakas, at lumabas. Gayunman, ang pangwakas na “lumabas” ay hindi gaanong malinaw na naihahayag ang explicit na הַחוּצָה (“sa labas/outside”).'
  naturalness: Makabago at marangal ang rehistro. Ang “Sumiping ka sa akin!” ay likas na eupemismo para sa seksuwal na paanyaya. Mas malinaw ang pagtukoy sa damit kung gagamitin ang “ni Jose,” dahil maaaring lumabo ang saklaw ng “kanyang” sa kasalukuyang ayos.
  terminology: Ang “damit” ay angkop para sa malawak na בֶּגֶד, at “sumiping” ay angkop na di-tahas ngunit malinaw-sa-kontekstong salin ng שִׁכְבָה עִמִּי. Walang usaping teolohikal na nangangailangan ng pagbabago.
