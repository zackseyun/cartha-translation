base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/006.yaml
  text: So he left all that he had in Joseph’s hand[a], and he knew nothing with him except the food that he ate[b]. Now Joseph was handsome in form and handsome in appearance.
translation:
  language: tl
  text: Kaya iniwan niya sa pangangalaga ni Jose[a] ang lahat ng pag-aari niya, at wala na siyang inaalam tungkol sa mga iyon maliban sa pagkaing kinakain niya.[b] Si Jose naman ay maganda ang pangangatawan at kaaya-aya ang hitsura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa kamay ni Jose,” isang idyoma para sa pagpapasailalim sa kanyang pamamahala o pangangalaga.
    reason: hebrew_idiom
  - marker: b
    text: Sa Hebreo, “tinapay na kinakain niya”; ang “tinapay” dito ay malamang na tumutukoy sa pagkain sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב כָּל אֲשֶׁר לוֹ בְּיַד יוֹסֵף
  choice: iniwan niya sa pangangalaga ni Jose ang lahat ng pag-aari niya
  rationale: Pinananatili ng “iniwan” ang karaniwang diwa ng עזב, samantalang likas na ipinahahayag ng “sa pangangalaga” ang idyomang Hebreo na “sa kamay,” na tumutukoy sa pamamahala o pananagutan.
- source_word: וְלֹא יָדַע אִתּוֹ מְאוּמָה
  choice: wala na siyang inaalam tungkol sa mga iyon
  rationale: Ang literal na kayarian ay “wala siyang nalalamang anuman kasama niya.” Sa konteksto, hindi na sinusubaybayan ni Potifar ang mga bagay na ipinamahala kay Jose. Inihahatid ng salin ang diwang ito nang hindi ipinapahiwatig na talagang wala siyang kaalaman sa mga iyon.
- source_word: כִּי אִם הַלֶּחֶם אֲשֶׁר הוּא אֹכֵל
  choice: maliban sa pagkaing kinakain niya
  rationale: Ang לֶחֶם ay literal na “tinapay” ngunit maaari ring tumukoy sa pagkain sa pangkalahatan. Ang “pagkain” ang mas natural dito, habang itinatala sa talababa ang literal na salita.
- source_word: יְפֵה תֹאַר
  choice: maganda ang pangangatawan
  rationale: Tumutukoy ang תֹאַר sa hubog o anyo ng katawan. Pinananatili nito ang pagkakaiba sa kasunod na paglalarawan ng nakikitang hitsura.
- source_word: וִיפֵה מַרְאֶה
  choice: kaaya-aya ang hitsura
  rationale: Tumutukoy ang מַרְאֶה sa nakikitang anyo o hitsura. Natural ito sa modernong Tagalog at pinananatili ang paralelismo nang hindi inuulit lamang ang parehong pang-uri.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pangangalaga” at “inaalam” upang natural na maipahayag ang mga idyomang Hebreo, habang pinanatili sa mga talababa ang literal na larawan at alternatibong leksikal.
