  naturalness: Mas malinaw at likas sa modernong Filipino ang “pinagkalooban niya si Jose ng lingap sa paningin ng pinuno ng bilangguan.” Nananatili ang marangal na rehistro at ang Hebreong idyoma nang hindi nagiging malabo ang panghalip.
