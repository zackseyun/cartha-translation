base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/021.yaml
  text: But Yahweh was with Joseph and extended covenant faithfulness to him[b][a], and he gave him favor in the eyes of the chief of the prison.
translation:
  language: tl
  text: Ngunit si Yahweh ay kasama ni Jose. Ipinakita niya kay Jose ang tapat na pag-ibig[a] at pinagkalooban niya si Jose ng lingap sa paningin ng pinuno ng bilangguan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “matapat na kagandahang-loob,” “tapat na kabutihan,” o “katapatan sa tipan.” Malawak ang kahulugan ng Hebreong חֶסֶד (hesed).
    reason: lexical_alternative
  - marker: b
    text: O, “tagapangasiwa ng bilangguan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיְהִי יְהוָה אֶת־יוֹסֵף
  choice: kasama ni Jose si Yahweh
  rationale: Likas na katumbas sa Tagalog ng Hebreong idyomang nagsasaad ng presensiya at pagsama.
- source_word: וַיֵּט אֵלָיו חָסֶד
  choice: Ipinakita niya kay Jose ang tapat na pag-ibig
  rationale: Ang parirala ay idyomatikong nangangahulugang magpakita o magkaloob ng matapat at nananatiling kabutihan. Iniiwasan nitong magpahiwatig ng isang tahasang tipan na hindi binabanggit sa talata.
- source_word: חִנּוֹ בְּעֵינֵי
  choice: niloob niyang kalugdan ito ng
  rationale: Natural na Filipino para sa literal na ideyang ‘ibinigay ang kaniyang lingap sa paningin ng’; ipinahahayag nitong si Yahweh ang nagpangyaring kalugdan si Jose.
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: pinuno ng bilangguan
  rationale: Tapat sa ranggong שַׂר at natural na tawag sa taong namamahala sa bilangguan.
- source_word: וַ
  choice: Ngunit
  rationale: 'Ang panandang pasalungat ay angkop sa konteksto: kahit nabilanggo si Jose, kasama niya si Yahweh.'
theological_decisions:
- issue: Kahulugan ng חָסֶד
  choice: tapat na pag-ibig
  alternative: katapatan sa tipan; matapat na kagandahang-loob; kabutihan
  rationale: Saklaw ng חָסֶד ang tapat, mapagmahal, at nananatiling kabutihan. Hindi ginawang pangunahing salin ang ‘katapatan sa tipan’ sapagkat walang tahasang binanggit na tipan sa mismong talata; pinananatili sa talababa ang lawak ng salita.
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo at hindi ito pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Hinati sa dalawang pangungusap upang maging natural ang daloy, at ginamit ang “ito” para kay Jose upang maiwasan ang sunod-sunod na malabong panghalip na “siya.”
