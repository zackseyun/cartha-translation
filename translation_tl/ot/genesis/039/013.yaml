  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Pinananatili ang pormulang pasalaysay na naghuhudyat ng kasunod na pangyayari, bagaman maaari rin itong paikliin sa simpleng “At.”
- source_word: כִּרְאוֹתָהּ
  choice: nang makita niya
  rationale: Ang כְּ na kasama ng infinitive construct at hulaping 3fs ay nagpapahayag ng panahong “nang makita niya.”
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng nakita ng babae.
- source_word: עָזַב
  choice: iniwan
  rationale: Tuwirang ipinahahayag ang kilos na pag-iwan; malinaw na nauna ito sa pagkakita niya ayon sa daloy ng pangungusap.
- source_word: בִּגְדוֹ
  choice: damit nito
  rationale: Ang בֶּגֶד ay pangkalahatang tawag sa damit o kasuotan at hindi kinakailangang mangahulugang balabal.
- source_word: בְּיָדָהּ
  choice: sa kamay niya
  rationale: Pinananatili ang kongkreto at likas na larawan ng Hebreong parirala.
- source_word: וַיָּנָס
  choice: tumakas
  rationale: Mas eksaktong naghahayag ng mabilis na paglayo upang makatakas kaysa sa payak na “umalis” o “tumakbo.”
- source_word: הַחוּצָה
  choice: palabas
  rationale: Ipinahahayag ng anyong may panlaping patungo ang kilos na papunta sa labas.
