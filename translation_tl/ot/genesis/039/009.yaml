  terminology: Ang “ipinagkait,” “kasamaan,” at “magkasala laban sa Diyos” ay angkop, malinaw, at wasto sa register. Ang “Diyos” ay nararapat para sa אֱלֹהִים sa kontekstong ito. Walang kailangang idagdag na interpretasyon hinggil sa partikular na uri ng kasalanan.
