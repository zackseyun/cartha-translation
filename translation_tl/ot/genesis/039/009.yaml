  text: אֵינֶ֨/נּוּ גָד֜וֹל בַּ/בַּ֣יִת הַ/זֶּה֮ מִמֶּ/נִּי֒ וְ/לֹֽא חָשַׂ֤ךְ מִמֶּ֨/נִּי֙ מְא֔וּמָה כִּ֥י אִם אוֹתָ֖/ךְ בַּ/אֲשֶׁ֣ר אַתְּ אִשְׁתּ֑/וֹ וְ/אֵ֨יךְ אֶֽעֱשֶׂ֜ה הָ/רָעָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/חָטָ֖אתִי לֵֽ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/009.yaml
  text: There is no one greater in this house than I am[a], and he has withheld nothing from me except you, because you are his wife[b]. So how could I do this great evil and sin against God?
translation:
  language: tl
  text: Walang sinumang higit sa akin sa bahay na ito[a], at wala siyang ipinagkait sa akin maliban sa iyo, sapagkat asawa ka niya. Kaya paano ko magagawa ang malaking kasamaang ito[b] at magkasala laban sa Diyos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Walang sinuman sa bahay na ito ang higit sa akin.” Sa Hebreo, itinatanggi ng pahayag na may sinumang nakahihigit kay Jose sa sambahayan.
    reason: lexical_alternative
  - marker: b
    text: O, “malaking kabuktutang ito” o “malaking maling gawaing ito.” Ang salitang Hebreo na רָעָה ay maaaring mangahulugang kasamaan, kabuktutan, o maling gawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵינֶנּוּ גָדוֹל ... מִמֶּנִּי
  choice: Walang sinumang mas mataas ... sa akin
  rationale: Ang konstruksiyong אֵין kasama ang pang-uri ay nagpapahayag na walang umiiral na higit o mas dakila. Sa konteksto, ranggo at awtoridad ni Jose sa sambahayan ang tinutukoy, kaya mas natural sa modernong Tagalog ang “mas mataas” kaysa “mas dakila.”
- source_word: בַּבַּיִת הַזֶּה
  choice: sa bahay na ito
  rationale: Maaaring tumukoy ang בַּיִת sa bahay o buong sambahayan. Pinananatili ng “bahay” ang larawan ng Hebreo at likas din itong maunawaan bilang saklaw ng sambahayan ni Potifar.
- source_word: חָשַׂךְ מִמֶּנִּי מְאוּמָה
  choice: wala siyang ipinagkait sa akin
  rationale: Ang חָשַׂךְ ay nangangahulugang magpigil o magkait, at dahil sa negasyon, ang מְאוּמָה ay “anuman.” Ang parirala ay tumpak at natural sa Tagalog.
- source_word: כִּי אִם אוֹתָךְ
  choice: maliban sa iyo
  rationale: Pagkatapos ng negasyon, ang כִּי אִם ay nagpapakilala ng tanging eksepsiyon.
- source_word: בַּאֲשֶׁר אַתְּ אִשְׁתּוֹ
  choice: sapagkat asawa ka niya
  rationale: Ipinahahayag ng parirala ang dahilan kung bakit ang babae ang tanging ipinagkait; ang “sapagkat” ay dignified ngunit malinaw sa modernong Tagalog.
- source_word: וְאֵיךְ אֶעֱשֶׂה
  choice: Kaya paano ko magagawa
  rationale: Ipinakikita ng וְאֵיךְ ang moral na konklusyon mula sa naunang sinabi. Ang “Kaya” ay naghahatid ng inferensiya, at ang “magagawa” ay malapit sa karaniwang pandiwang עשה.
- source_word: הָרָעָה הַגְּדֹלָה הַזֹּאת
  choice: ang malaking kasamaang ito
  rationale: Ang רָעָה ay maaaring mangahulugang kasamaan, kabuktutan, o maling gawa. Pinananatili ng “kasamaan” ang bigat na moral at ng ayos na “ang malaking kasamaang ito” ang demonstratibong estruktura.
- source_word: וְחָטָאתִי לֵאלֹהִים
  choice: at magkasala laban sa Diyos
  rationale: Sa konstruksiyong ito, ang חטא na may ל ay tumutukoy sa pagkakasala laban sa isang persona. Ang “laban sa Diyos” ang likas na katumbas sa Tagalog.
theological_decisions:
- issue: Ang tinutukoy ng אֱלֹהִים sa pananalita ni Jose
  choice: Diyos
  alternative: isang diyos
  rationale: Sa salaysay ng Genesis, ang pananalita ni Jose ay tumutukoy sa Diyos na kanyang sinasamba, at inilalarawan niya ang gawain hindi lamang bilang paglabag kay Potifar kundi bilang kasalanan laban sa Diyos.
- issue: Ang kasalanan bilang kapuwa paglabag sa amo at laban sa Diyos
  choice: Pinanatili ang tuwirang “magkasala laban sa Diyos”
  alternative: Ipaliwanag ang kasalanan bilang pangangalunya o pagtataksil sa amo
  rationale: Hindi tahasang pinapangalanan ng talata ang uri ng kasalanan sa huling sugnay. Pinananatili ng salin ang moral at teolohikal na bigat nang hindi nagdaragdag ng interpretatibong katawagan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang “mas mataas” para sa ranggo sa sambahayan, “sapagkat” para sa dignified na ugnayang sanhi, at “kasamaan” upang mapanatili ang moral na bigat ng Hebreo.
