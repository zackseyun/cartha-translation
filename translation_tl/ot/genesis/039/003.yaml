  yaml_path: translation/ot/genesis/039/003.yaml
  text: His master saw that Yahweh was with him[a], and that Yahweh made prosper in his hand all that he did.
translation:
  language: tl
  text: Nakita ng kanyang amo na kasama ni Jose si Yahweh, at na pinagtatagumpay ni Yahweh sa kamay ni Jose ang lahat ng ginagawa ni Jose.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan ni Jose” o “sa ilalim ng kanyang pamamahala”; literal sa Hebreo, “sa kamay ni Jose.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nakita
  rationale: Pinananatili nito ang payak na salaysay ng ראה; sa konteksto, tumutukoy rin ito sa pagkilalang batay sa napansin niyang mga resulta.
- source_word: אֲדֹנָיו
  choice: kanyang panginoon
  rationale: Tumutukoy kay Potifar bilang amo o nakatataas kay Jose. Ang “panginoon” ay marangal at angkop sa sinaunang ugnayan ng alipin at amo, nang hindi ginagamit bilang banal na titulo rito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: אִתּוֹ
  choice: kasama niya
  rationale: Likas na Filipino para sa banal na presensiya kay Jose at pinananatili ang panghalip ng Hebreo.
- source_word: וְכֹל אֲשֶׁר הוּא עֹשֶׂה
  choice: ang lahat ng ginagawa niya
  rationale: Sinasalamin ang malawak na saklaw at ang aspektong nagpapatuloy ng Hebreong participle עֹשֶׂה.
- source_word: מַצְלִיחַ
  choice: pinagtatagumpay
  rationale: Ipinahahayag ng anyong Hiphil ng צלח na si Yahweh ang sanhi ng pagtatagumpay ng ginagawa ni Jose.
- source_word: בְּיָדוֹ
  choice: sa kanyang kamay
  rationale: Pinananatili ang kongkretong idyomang Hebreo at ang posibleng mga diwa nito—pamamagitan, pamamahala, o saklaw ng gawain—sa halip na pumili agad ng iisang paliwanag.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng בְּיָדוֹ
  choice: Panatilihin sa pangunahing teksto ang “sa kanyang kamay”
  alternative: sa pamamagitan niya; sa ilalim ng kanyang pamamahala
  rationale: Hindi ganap na nilulutas ng konteksto kung ang diin ay nasa pagiging kasangkapan ni Jose, sa kanyang pamamahala, o sa gawaing ipinagkatiwala sa kanya; pinananatili ng literal na larawan ang saklaw na ito.
translation_notes:
  register: Makabago at marangal na Filipino, na may bahagyang anyong hango sa Hebreo sa pariralang “sa kanyang kamay” upang mapanatili ang tunay na kalabuan ng pinagmulan.
