revisions:
- from: Nakita ng kanyang panginoon na kasama niya si Yahweh, at pinagtatagumpay ni Yahweh sa kanyang kamay[a] ang lahat ng ginagawa niya.
  to: Nakita ng kanyang amo na kasama ni Jose si Yahweh, at na pinagtatagumpay ni Yahweh sa kamay ni Jose ang lahat ng ginagawa ni Jose.[a]
  rationale: Nilinaw ang reperente ng mga panghalip bilang si Jose, pinalitan ang mas di-karaniwang “panginoon” ng “amo,” at inayos ang huling sugnay para sa mas malinaw na Filipino. Nananatili sa pangunahing teksto ang “sa kamay ni Jose,” kaya hindi inaalis ang saklaw ng literal na Hebreong בְּיָדוֹ.
