  text: And when he heard that I had raised my voice and cried out[b][a], he left his garment beside me and fled and went outside.
translation:
  language: tl
  text: At nang marinig niyang itinaas ko ang tinig ko at sumigaw[a], iniwan niya ang damit niya sa tabi ko[b], tumakas, at lumabas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “itinaas ko ang tinig ko at tumawag.”
    reason: lexical_alternative
  - marker: b
    text: O, “sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְשָׁמְעוֹ
  choice: At nang marinig niya
  rationale: Likas na temporal na sugnay ito sa Tagalog at pinananatili ang pagkakasunod-sunod ng salaysay nang hindi pilit na isinasalin ang pormulang וַיְהִי.
- source_word: כִּי
  choice: -ng
  rationale: Ikinakabit ng pang-angkop ang nilalaman ng narinig niya; katumbas ito ng gamit ng כִּי bilang panandang nagpapakilala sa nilalaman.
- source_word: הֲרִימֹתִי קוֹלִי
  choice: itinaas ko ang tinig ko
  rationale: Pinananatili nito ang Hebreong idyoma sa paraang malinaw at marangal sa modernong Tagalog.
- source_word: וָאֶקְרָא
  choice: at sumigaw
  rationale: Sa tagpong ito, ang קרא ay tumutukoy sa malakas na pagsigaw o pagtawag. Ang “sumigaw” ay natural at naghahatid ng pagkaapurahan nang hindi nagdaragdag ng tiyak na mga salita.
- source_word: וַיַּעֲזֹב בִּגְדוֹ
  choice: iniwan niya ang damit niya
  rationale: Ang “damit” ay natural na katumbas ng isahang בגד at tumutukoy sa kasuotang naiwan sa tagpo.
- source_word: אֶצְלִי
  choice: sa tabi ko
  rationale: Malinaw nitong ipinapahayag ang pisikal na pagkalapit, habang inilalagay sa talababa ang mas malawak na posibleng kahulugang “sa akin.”
- source_word: וַיָּנָס
  choice: tumakas
  rationale: Tumpak at maigsi nitong pinananatili ang biglaan at mabilis na pagtakas na ipinahihiwatig ng נוס.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: at lumabas
  rationale: Natural itong Tagalog para sa paggalaw patungo sa labas at pinananatili bilang hiwalay na kilos kasunod ng pagtakas.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang Hebreong idyomang “itinaas ko ang tinig ko,” at hindi nilinaw nang higit sa teksto kung para saan o kanino siya sumigaw. Ang magkakasunod na “tumakas, at lumabas” ay sadyang nagpapanatili sa dalawang hiwalay na pandiwa ng Hebreo.
