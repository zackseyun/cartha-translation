- from: Ngunit tumanggi siya at sinabi sa asawa ng kanyang amo, “Tingnan ninyo, hindi na inaalam ng aking amo ang anumang nasa bahay dahil ako ang namamahala,[a] at ipinagkatiwala niya sa akin ang lahat ng kanyang ari-arian.[b]”
  to: Ngunit tumanggi siya at sinabi sa asawa ng kanyang amo, “Tingnan ninyo, hindi nakikialam ang aking amo sa mga bagay-bagay sa bahay,[a] at ipinagkatiwala niya sa akin ang lahat ng kanyang ari-arian.[b]”
  rationale: Inalis ang tahasang sanhi na “dahil ako ang namamahala” at ang dagdag na “na,” upang manatiling malapit sa saklaw ng Hebreong idyoma. Ang idyomatikong kahulugan—na iniwan ng amo ang mga gawaing pambahay sa pangangasiwa ni Jose—ay malinaw na ipinaliwanag sa talababa at higit pang pinatutunayan ng kasunod na sugnay.
