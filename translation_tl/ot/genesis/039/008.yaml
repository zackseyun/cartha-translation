translation_notes:
  register: Modernong Filipino na magalang at marangal ngunit madaling maunawaan. Ginamit ang “ninyo” bilang paggalang sa asawa ng amo. Isinalin ang dalawang Hebreong idyoma ayon sa diwa sa pangunahing teksto at pinanatili ang literal na anyo sa mga talababa.
