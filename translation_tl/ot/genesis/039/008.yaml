  text: But he refused and said to his master's wife[a], "Look, my master does not concern himself with what is in the house[c][b], and everything that belongs to him he has put into my hand."
translation:
  language: tl
  text: Ngunit tumanggi siya at sinabi sa asawa ng kanyang amo, “Tingnan ninyo, hindi nakikialam ang aking amo sa mga bagay-bagay sa bahay,[a] at ipinagkatiwala niya sa akin ang lahat ng kanyang ari-arian.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “hindi alam ng aking amo, kasama ko, kung ano ang nasa bahay.” Ibig sabihin, ipinauubaya ng amo kay Jose ang mga gawain sa sambahayan at hindi niya ito pinakikialaman.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “inilagay niya sa aking kamay,” isang idyoma para sa ipinagkatiwalang pangangasiwa o kapamahalaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: Ngunit tumanggi siya
  rationale: Ang pandiwa ay nangangahulugang tumanggi; ang “Ngunit” ay angkop sa pagsalungat ni Jose sa alok sa naunang talata.
- source_word: וַיֹּאמֶר אֶל־אֵשֶׁת אֲדֹנָיו
  choice: at sinabi sa asawa ng kanyang amo
  rationale: Natural na Tagalog na nagpapanatili sa ugnayan ng babae sa amo ni Jose.
- source_word: הֵן
  choice: Tingnan ninyo
  rationale: Panawag-pansin ito sa kasunod na paliwanag. Ginamit ang magalang na anyo dahil kausap ni Jose ang asawa ng kanyang amo.
- source_word: אֲדֹנִי
  choice: aking amo
  rationale: Sa konteksto ng sambahayan at paglilingkod, mas tiyak ang “amo” kaysa “panginoon.”
- source_word: לֹא יָדַע אִתִּי מַה בַּבָּיִת
  choice: hindi na inaalam ng aking amo ang anumang nasa bahay dahil ako ang namamahala
  rationale: Ipinahahayag sa natural na Tagalog ang diwang idyomatiko ng literal na “hindi niya nalalaman kasama ko,” habang malinaw na ang pangangasiwa ni Jose ang dahilan ng hindi na pakikialam ng amo.
- source_word: וְכֹל אֲשֶׁר יֶשׁ־לוֹ
  choice: ang lahat ng kanyang ari-arian
  rationale: Saklaw nito ang lahat ng pag-aari ng amo at natural sa konteksto.
- source_word: נָתַן בְּיָדִי
  choice: ipinagkatiwala niya sa akin
  rationale: Ang literal na “inilagay sa aking kamay” ay idyoma para sa pagbibigay ng pananagutan o kapamahalaan; malinaw itong naihahatid ng “ipinagkatiwala.”
