  yaml_path: translation/ot/genesis/039/018.yaml
  text: And when I raised my voice and cried out[a], he left his garment beside me and fled outside.
translation:
  language: tl
  text: At nang lakasan ko ang aking tinig at sumigaw, iniwan niya sa tabi ko ang kanyang damit[a] at tumakas palabas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “balabal.” Ang Hebreong בֶּגֶד ay pangkalahatang salita para sa kasuotan at hindi tinutukoy ang eksaktong uri ng damit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּהֲרִימִי
  choice: At nang lakasan ko
  rationale: Ipinakikilala ng וַיְהִי ang kasunod na sugnay na panahunan, at ang Hiphil na כַּהֲרִימִי ay tumutukoy sa pagtataas o pagpapalakas. Ang “nang lakasan ko” ay likas na Filipino kapag tinutukoy ang tinig.
- source_word: קוֹלִי
  choice: ang aking tinig
  rationale: Ang קוֹל ay “tinig” sa kontekstong ito. Pinananatili ng “aking tinig” ang tahasang pagbanggit ng Hebreo sa tinig ng nagsasalita.
- source_word: וָאֶקְרָא
  choice: at sumigaw
  rationale: Maaaring mangahulugan ang קרא na tumawag o sumigaw. Sa salaysay ng pagbibintang at paghingi ng saklolo, natural na ipinahahayag ng “sumigaw” ang apurahang pagtawag nang hindi nagdaragdag ng tiyak na sinabi.
- source_word: וַיַּעֲזֹב
  choice: iniwan niya
  rationale: Ang עזב ay nagsasaad na iniwan ang damit. Ang “iniwan niya” ang pinakanatural at tuwirang katumbas sa Filipino.
- source_word: בִּגְדוֹ
  choice: ang kanyang damit
  rationale: Ang בֶּגֶד ay pangkalahatang katawagan sa damit o kasuotan at hindi tumutukoy sa isang tiyak na uri. Karaniwan at malinaw sa modernong Filipino ang “damit.”
- source_word: אֶצְלִי
  choice: sa tabi ko
  rationale: Ipinahihiwatig ng אֵצֶל ang pagiging malapit o katabi. Pinananatili ng “sa tabi ko” ang lokasyonal na diwa nang hindi awtomatikong ipinahihiwatig ang pagmamay-ari.
- source_word: וַיָּנָס
  choice: at tumakas
  rationale: Ang נוס ay nangangahulugang tumakas. Ipinahahayag ng “tumakas” ang biglaan at apurahang paglayo.
- source_word: הַחוּצָה
  choice: palabas
  rationale: Ang hulaping direksiyonal sa הַחוּצָה ay nagpapahiwatig ng pagkilos patungo sa labas. Natural itong ipinahahayag ng “palabas.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “lakasan ko ang aking tinig” sa halip na ang mas literal ngunit hindi gaanong likas na “itaas ko ang aking tinig.” Inilipat ang panandang [a] sa “damit,” sapagkat iyon ang salitang tinatalakay ng talibaba.
