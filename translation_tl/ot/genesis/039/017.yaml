  yaml_path: translation/ot/genesis/039/017.yaml
  text: Then she spoke to him with words like these[a], saying, “The Hebrew servant whom you brought to us came to me to mock me.”
translation:
  language: tl
  text: 'Pagkatapos, ganito ang sinabi niya sa kanya: “Ang aliping Hebreo na dinala mo sa atin ay lumapit sa akin upang paglaruan ako.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gawin akong katatawanan.” Sa kontekstong ito, maaari ring magpahiwatig ang pananalita ng seksuwal o mapang-abusong pakikitungo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר אֵלָיו כַּדְּבָרִים הָאֵלֶּה לֵאמֹר
  choice: Pagkatapos, ganito ang sinabi niya sa kanya
  rationale: Natural na inilalahad sa Tagalog ang sunod na kilos at ang pormulang nagpapakilala sa tuwirang sipi, habang pinananatili ang panghalip na tumutukoy sa asawa niya.
- source_word: הָעֶבֶד הָעִבְרִי
  choice: ang aliping Hebreo
  rationale: Ang “alipin” ay malinaw na nagpapahayag ng nakagapos at mababang katayuan ni Jose sa sambahayan; ang “Hebreo” ay pinananatiling katawagang etniko.
- source_word: אֲשֶׁר הֵבֵאתָ לָּנוּ
  choice: na dinala mo sa atin
  rationale: Pinananatili ang mapanumbat na ikalawang panauhan at ang maramihang panghalip na tumutukoy sa kanilang sambahayan.
- source_word: בָּא אֵלַי
  choice: lumapit sa akin
  rationale: Ipinapahayag ang pagkilos patungo sa babae nang hindi dinaragdagan ng tahasang seksuwal na pahiwatig na wala sa pariralang ito mismo.
- source_word: לְצַחֶק בִּי
  choice: upang paglaruan ako
  rationale: Ang “paglaruan” ay nagpapanatili sa saklaw ng pandiwa—panunuya, masamang pakikitungo, o mapang-abusong kilos—nang hindi tiyak na nilulutas ang seksuwal na pahiwatig ng konteksto.
