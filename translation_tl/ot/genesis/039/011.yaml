base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/011.yaml
  text: And it happened on such a day that he went into the house to do his work[b][a], and none of the men of the house was there in the house.
translation:
  language: tl
  text: Isang araw[a], pumasok siya sa bahay upang gawin ang kanyang trabaho, at wala roon sa loob ng bahay ni isa man sa mga lalaking kabilang sa sambahayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “sa araw na ito.” Idyomatiko ang pananalita sa Hebreo at maaaring tumukoy sa “isang araw” o sa isang di-tiyak na pagkakataon.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “wala roon sa bahay ni isa man sa mga lalaki ng bahay.”
    reason: literal_rendering
lexical_decisions:
- source_word: וַיְהִי
  choice: Isang araw
  rationale: Sa daloy ng salaysay, ipinakikilala ng pormulang ito ang sumunod na pangyayari. Hindi na kailangang isalin nang hiwalay bilang “at nangyari” dahil likas at malinaw sa modernong Tagalog ang pambungad na “Isang araw.”
- source_word: כְּהַיּוֹם הַזֶּה
  choice: Isang araw[a]
  rationale: Idyomatiko ang parirala at tumutukoy sa isang partikular na pagkakataon. Pinili ang natural na “Isang araw,” habang inilalagay sa talababa ang mas literal at sadyang malabong anyo.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: pumasok siya sa bahay
  rationale: Ipinahihiwatig ng pandiwa at ng hulaping patungo ang pagpasok sa bahay. Ang “pumasok” ang pinakanatural na katumbas sa Tagalog.
- source_word: לַעֲשׂוֹת מְלַאכְתּוֹ
  choice: upang gawin ang kanyang trabaho
  rationale: Ang מְלָאכָה ay tumutukoy sa gawain o trabaho; naaangkop dito ang karaniwang salitang “trabaho” sa konteksto ng tungkulin ni Jose sa sambahayan.
- source_word: וְאֵין אִישׁ מֵאַנְשֵׁי הַבַּיִת
  choice: at wala ... ni isa man sa mga lalaking kabilang sa sambahayan
  rationale: Pinananatili ng “ni isa man” ang mariing diwa ng kawalan, at ng “mga lalaki” ang tahasang panlalaking katawagan sa Hebreo. Nililinaw ng “kabilang sa sambahayan” ang kaugnayan nila sa bahay.
- source_word: שָׁם בַּבָּיִת
  choice: roon sa loob ng bahay
  rationale: Kapuwa kinakatawan ang שָׁם (“roon”) at ang tiyak na lokasyong בַּבָּיִת (“sa bahay”) nang hindi nagiging asiwa sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Iniwasan ang mekanikal na pag-uulit ng “bahay” sa pangunahing teksto, ngunit pinanatili sa talababa ang mas literal na anyo. Tahasang pinanatili ang kasarian ng אַנְשֵׁי bilang “mga lalaki.”
