translation:
  language: tl
  text: Kaya iniwan niya sa tabi niya ang damit ni Jose hanggang sa umuwi ang amo ni Jose.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּנַּח
  choice: itinabi niya
  rationale: Ipinahihiwatig ng pandiwa na pinanatili o inilagay niya roon ang damit; natural sa Tagalog ang “itinabi niya” sa kontekstong ito.
- source_word: בִּגְדוֹ
  choice: ang damit ni Jose
  rationale: Literal na “ang damit niya.” Ginawang tahasan si Jose upang maiwasan ang malabong sunod-sunod na panghalip sa Tagalog, nang hindi binabago ang tinutukoy.
- source_word: אֶצְלָהּ
  choice: sa tabi niya
  rationale: Pinananatili ang lokatibong diwa na nasa piling o tabi niya ang damit.
- source_word: עַד בּוֹא אֲדֹנָיו אֶל בֵּיתוֹ
  choice: hanggang sa umuwi ang amo nito
  rationale: Ang pariralang “dumating ang kanyang amo sa kanyang bahay” ay idiomatikong “umuwi ang amo niya.” Ginamit ang “nito” upang malinaw na si Jose ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “amo” bilang karaniwang katumbas ng אֲדֹנָיו sa ugnayan ni Jose at ng kanyang panginoon; walang idinagdag na paliwanag o denominasyonal na pagbasa.
