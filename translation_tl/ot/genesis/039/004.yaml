  yaml_path: translation/ot/genesis/039/004.yaml
  text: And Joseph found favor in his eyes and served him[c][b][a], and he appointed him over his house and put all that he had into his hand.
translation:
  language: tl
  text: At nakasumpong si Jose ng lingap sa paningin ng kanyang panginoon at pinaglingkuran niya ito. Itinalaga siya ng kanyang panginoon na mamahala sa sambahayan nito at ipinagkatiwala sa kanya ang lahat ng pag-aari nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ibinigay sa kanyang kamay,” isang idyomang nangangahulugang ipinailalim sa kapamahalaan o pangangalaga ni Jose.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְצָא יוֹסֵף חֵן בְּעֵינָיו
  choice: kinalugdan ni Jose ang kanyang panginoon
  rationale: Likas na salin sa modernong Tagalog ng idyomang Hebreo na literal na ‘nakasumpong si Jose ng lingap sa kanyang mga mata.’ Malinaw nitong ipinahahayag ang positibong pagtingin ng panginoon kay Jose nang hindi binibigyan ng di-kailangang teolohikal na kulay ang חֵן.
- source_word: וַיְשָׁרֶת אֹתוֹ
  choice: pinaglingkuran niya ito
  rationale: Tumutukoy ang שׁרת dito sa personal na paglilingkod ni Jose sa kanyang panginoon; natural at tuwiran ang ‘pinaglingkuran.’
- source_word: וַיַּפְקִדֵהוּ עַל בֵּיתוֹ
  choice: Inatasan siya nito na mamahala sa sambahayan nito
  rationale: Ipinahihiwatig ng causative-administrative na gamit ng פקד ang pagtatalaga sa pamamahala. Sinasaklaw ng ‘sambahayan’ ang bahay, mga tauhan, at kaayusang nasa ilalim ng panginoon.
- source_word: וְכָל יֶשׁ־לוֹ
  choice: ang lahat ng pag-aari nito
  rationale: Komprehensibong tumutukoy ang parirala sa lahat ng nasa pag-aari ng panginoon ni Jose.
- source_word: נָתַן בְּיָדוֹ
  choice: ipinagkatiwala sa kanyang mga kamay
  rationale: Pinananatili ang larawang ‘kamay’ ng Hebreo habang malinaw na ipinahahayag ang ipinagkatiwalang pangangalaga at kapangyarihan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Gumamit ng ‘nito’ para luminaw na ang panginoon ni Jose ang nagtatalaga at upang maiwasan ang malabong sunod-sunod na panghalip. Ginamit ang ‘kanyang panginoon’ ayon sa agarang konteksto ng talata 3; hindi pinangalanan si Potifar sa mismong talata.
