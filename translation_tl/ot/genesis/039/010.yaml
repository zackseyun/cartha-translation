  yaml_path: translation/ot/genesis/039/010.yaml
  text: And it happened[a], as she spoke to Yosef day after day, that he did not listen to her, to lie beside her or to be with her.
translation:
  language: tl
  text: At nangyari, tuwing kinakausap ng babae si Jose araw-araw, hindi siya pinakinggan ni Jose, upang hindi siya sumiping sa tabi niya ni makasama siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “makipagtalik sa kanya.” Maaaring seksuwal ang diwa ng salitang Hebreo; pinananatili ng “sumiping sa tabi niya” ang pananalita ng teksto, habang nananatiling may sariling puwersa ang kasunod na pariralang “makasama siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Ipinakikita ang karugtong na pangyayari sa salaysay nang hindi gumagamit ng makalumang pananalita.
- source_word: כְּדַבְּרָהּ אֶל־יוֹסֵף
  choice: habang kinakausap siya ng babae
  rationale: Ang temporal na כְּ at pandiwang דּבר ay likas na naipapahayag sa Filipino bilang patuloy na pakikipag-usap; nilinaw ng “babae” ang babaeng paksa na nakasaad sa pambabaeng anyo at sa konteksto.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginamit ang nakasanayan at madaling makilalang anyo ng pangalang biblikal sa modernong Filipino.
- source_word: יוֹם יוֹם
  choice: araw-araw
  rationale: Natural na ipinapahayag sa Filipino ang paulit-ulit at patuloy na pagkilos.
- source_word: וְלֹא שָׁמַע אֵלֶיהָ
  choice: hindi nakinig si Jose sa kanya
  rationale: Pinananatili ng “nakinig” ang malawak na diwa ng שׁמע אֶל—makinig o tumalima—samantalang malinaw sa konteksto ang pagtanggi.
- source_word: לִשְׁכַּב אֶצְלָהּ
  choice: hindi siya sumiping sa tabi nito
  rationale: Ang “sumiping” ay may diwang humiga nang malapit at maaari ring magpahiwatig ng seksuwal na pakikipagtalik; ang “sa tabi nito” ay nagpapanatili sa puwersang panlunan ng אֵצֶל.
- source_word: לִהְיוֹת עִמָּהּ
  choice: ni manatiling kasama nito
  rationale: Ang “manatiling kasama” ay natural sa Filipino at pinananatili ang hiwalay at mas malawak na pagtangging mapalapit o makasama ang babae.
theological_decisions:
- issue: Saklaw ng pagtanggi ni Jose
  choice: Pinanatiling magkahiwalay ang pagsiping sa tabi niya at ang pananatiling kasama niya.
  alternative: Isalin lamang bilang pagtangging makipagtalik sa kanya.
  rationale: May dalawang magkakaugnay ngunit magkaibang pariralang layunin sa Hebreo; hindi dapat pag-isahin ang mga ito at alisin ang posibleng mas malawak na pagtanggi sa mapanganib na pakikisama.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Jose” ayon sa nakasanayang pangalang biblikal sa Filipino; ang “sa kanya” at “nito” ay nag-iiba upang maiwasan ang kalituhan ng mga panghalip. Nasa pangunahing teksto ang panandang talababa [a].
