base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/014.yaml
  text: Then she called the men of her household and said to them[a], “Look, he has brought a Hebrew man to us to mock us. He came in to me to lie with me[b], and I cried out with a loud voice.”
translation:
  language: tl
  text: Pagkatapos, tinawag niya ang mga lalaki sa kanyang sambahayan at sinabi sa kanila, “Tingnan ninyo! Nagpasok siya sa atin ng isang lalaking Hebreo upang libakin tayo.[a] Lumapit siya sa akin upang sumiping sa akin, at sumigaw ako nang malakas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang gawin tayong katatawanan” o “upang paglaruan tayo.” Ang pandiwang Hebreo ay maaaring tumukoy sa panlilibak o mapang-abusong paglalaro; sa paratang ng asawa ni Potifar, may pahiwatig ito ng seksuwal na panghihiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לְאַנְשֵׁי בֵיתָהּ
  choice: tinawag niya ang mga lalaki sa kanilang sambahayan
  rationale: Pinananatili ng “mga lalaki” ang tiyak na panlalaking anyo ng אַנְשֵׁי, habang natural na ipinahahayag ng “sambahayan” ang saklaw ng בֵיתָהּ.
- source_word: רְאוּ
  choice: Tingnan ninyo!
  rationale: Likas na makabagong Tagalog na pautos na tumatawag ng pansin; ipinakikita rin ng “ninyo” na maramihan ang kausap.
- source_word: הֵבִיא לָנוּ אִישׁ עִבְרִי
  choice: Dinalhan niya tayo ng isang lalaking Hebreo
  rationale: Ang “dinalhan ... tayo” ay natural na Tagalog para sa causative na “nagdala ... sa atin” at pinananatili ang pakikiisa ng babae sa sambahayan. Tahasang pinananatili ng “lalaking Hebreo” ang אִישׁ at עִבְרִי.
- source_word: לְצַחֶק בָּנוּ
  choice: upang gawin tayong katatawanan
  rationale: Sinasaklaw nito ang diwang panlilibak o kahiya-hiyang paglalaro sa kapwa nang hindi labis na nililinaw ang posibleng seksuwal na pahiwatig ng pandiwa sa konteksto.
- source_word: בָּא אֵלַי
  choice: Lumapit siya sa akin
  rationale: Natural na Tagalog para sa paglapit o pagpunta niya sa babae; hindi nito idinaragdag ang hindi tiyak na ideya ng pagpasok sa silid.
- source_word: לִשְׁכַּב עִמִּי
  choice: upang sipingan ako
  rationale: Ang “sipinan” ay dignidad ngunit malinaw na idyomang Tagalog para sa pakikipagtalik, katumbas ng Hebreong “humiga na kasama.”
- source_word: וָאֶקְרָא בְּקוֹל גָּדוֹל
  choice: kaya sumigaw ako nang malakas
  rationale: Ang “sumigaw ... nang malakas” ay natural at tumpak sa sitwasyon. Ang “kaya” ay nagpapahayag ng malinaw na pagkakasunod at tugon sa salaysay, bagaman payak na waw ang pang-ugnay sa Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, dignidad, at madaling maunawaang Filipino. Ginamit ang “sambahayan” sa halip na literal na “bahay” upang ipakita na mga taong kabilang sa tahanan ang tinawag. Ang tuwirang pananalita ay masigla ngunit hindi kolokyal.
