revisions:
- from: Pagkatapos, tinawag niya ang mga lalaki sa kanilang sambahayan at sinabi sa kanila, “Tingnan ninyo! Dinalhan niya tayo ng isang lalaking Hebreo upang gawin tayong katatawanan.[a] Lumapit siya sa akin upang sipingan ako, kaya sumigaw ako nang malakas.”
  to: Pagkatapos, tinawag niya ang mga lalaki sa kanyang sambahayan at sinabi sa kanila, “Tingnan ninyo! Nagpasok siya sa atin ng isang lalaking Hebreo upang libakin tayo.[a] Lumapit siya sa akin upang sumiping sa akin, at sumigaw ako nang malakas.”
  rationale: Inayos ang panghalip upang tumukoy sa sambahayan ng babae, ginawang mas tapat ang causative na “nagpasok,” pinalitan ng karaniwang idyomang Tagalog ang seksuwal na parirala, at inalis ang idinagdag na ugnayang sanhi sa huling sugnay. Napanatili ng talababa ang mas malawak at pinagtatalunang saklaw ng לצחק.
