  yaml_path: translation/ot/genesis/039/022.yaml
  text: And the chief of the prison put into Yosef’s hand all the prisoners who were in the prison[a], and whatever was done there[c][b], he was the one doing it.
translation:
  language: tl
  text: Ipinagkatiwala ng pinuno ng bilangguan kay Jose ang lahat ng bilanggo na nasa bilangguan, at anuman ang ginagawa roon, si Jose ang gumagawa nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “si Jose ang namamahala rito.” Ang Hebreong pananalita ay mariing nagsasabing si Jose ang siyang gumagawa ng anumang ginagawa roon; sa konteksto, maaari itong tumukoy sa kaniyang aktibong pangangasiwa at pananagutan sa mga ito.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: pinuno ng bilangguan
  rationale: Tumutukoy ang שַׂר sa opisyal na nangangasiwa sa bilangguan; natural at malinaw sa modernong Tagalog ang “pinuno ng bilangguan.”
- source_word: בְּיַד יוֹסֵף
  choice: ipinagkatiwala ... kay Jose
  rationale: Ang literal na “sa kamay ni Jose” ay idyomang nangangahulugang inilagay sa kaniyang pangangasiwa o kapangyarihan. Isinalin ang diwa upang maging natural sa Tagalog.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang biblikal na יוֹסֵף.
- source_word: כָּל הָאֲסִירִם
  choice: lahat ng bilanggo
  rationale: Sa konteksto ng bilangguan, malinaw at karaniwan ang “mga bilanggo” para sa אֲסִירִים.
- source_word: וְאֵת כָּל אֲשֶׁר עֹשִׂים שָׁם
  choice: Anumang gawain ang ginagawa roon
  rationale: Ang maramihang aktibong participle ay walang tiyak na paksa at sumasaklaw sa lahat ng gawaing isinasagawa roon; hindi pinilit ang isang tahasang gumagawa.
- source_word: הוּא הָיָה עֹשֶׂה
  choice: si Jose ang namamahala rito
  rationale: Pinananatili ng “si Jose ang” ang diin ng הוּא, samantalang ipinahahayag ng “namamahala” ang patuloy at pananagutang pagganap na ipinahihiwatig ng היה + participle sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Isinalin ayon sa diwa ang idyomang “sa kamay ni Jose,” ngunit pinanatili sa talababa ang tunay na saklaw ng huling parirala at ang diin sa pananagutan ni Jose.
