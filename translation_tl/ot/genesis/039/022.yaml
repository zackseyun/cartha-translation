  to: Ipinagkatiwala ng pinuno ng bilangguan kay Jose ang lahat ng bilanggo na nasa bilangguan, at anuman ang ginagawa roon, si Jose ang gumagawa nito.[a]
  rationale: Pinalitan ang interpretibong “namamahala” sa pangunahing teksto ng “gumagawa,” upang maipakita ang inuulit at mariing pandiwang Hebreo. Pinanatili ng talababa ang natural na pangkontekstong pagkaunawa na si Jose ang may aktibong pangangasiwa at pananagutan, nang hindi isinasara ang saklaw ng orihinal.
