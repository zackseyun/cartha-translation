  text: וַ/יְהִ֡י מֵ/אָז֩ הִפְקִ֨יד אֹת֜/וֹ בְּ/בֵית֗/וֹ וְ/עַל֙ כָּל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית הַ/מִּצְרִ֖י בִּ/גְלַ֣ל יוֹסֵ֑ף וַ/יְהִ֞י בִּרְכַּ֤ת יְהוָה֙ בְּ/כָל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ בַּ/בַּ֖יִת וּ/בַ/שָּׂדֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/005.yaml
  text: And from the time he appointed him over his house and over all that he had[a], Yahweh blessed the Egyptian’s house because of Joseph, and Yahweh’s blessing was on all that he had[b], in the house and in the field.
translation:
  language: tl
  text: Mula nang italaga niya si Jose na mamahala sa kanyang sambahayan at sa lahat ng kanyang pag-aari, pinagpala ni Yahweh ang sambahayan ng Ehipsiyo dahil kay Jose. Ang pagpapala ni Yahweh ay nasa lahat ng kanyang pag-aari, sa bahay at sa bukid.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאָז
  choice: Mula nang
  rationale: Likas na panandang temporal sa Tagalog na tumutukoy sa pasimula ng patuloy na kalagayang inilalarawan.
- source_word: הִפְקִיד אֹתוֹ בְּבֵיתוֹ וְעַל כָּל אֲשֶׁר יֶשׁ־לוֹ
  choice: italaga niya si Jose na mamahala sa kanyang sambahayan at sa lahat ng kanyang pag-aari
  rationale: Ipinahahayag ng Hiphil na הִפְקִיד ang pagtatalaga sa tungkuling mangasiwa; nilinaw ang panghalip bilang si Jose ayon sa konteksto, at ang 'sambahayan' ay sumasaklaw sa bahay at mga taong sakop nito.
- source_word: וַיְבָרֶךְ
  choice: pinagpala
  rationale: Pinananatili ang tuwirang kahulugan ng ברך at ang malinaw na pagkilos ng Diyos, sa halip na paliitin ito sa materyal na pagpapaunlad lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: בֵּית הַמִּצְרִי
  choice: ang sambahayan ng Ehipsiyo
  rationale: Ang בֵּית dito ay tumutukoy sa kabahayan o buong sambahayan ni Potifar; pinananatili rin ang paglalarawan sa kanya bilang 'ang Ehipsiyo.'
- source_word: בִּגְלַל יוֹסֵף
  choice: dahil kay Jose
  rationale: Tuwirang ipinahahayag ang sanhi o dahilan na tinutukoy ng בִּגְלַל.
- source_word: בִּרְכַּת יְהוָה
  choice: ang pagpapala ni Yahweh
  rationale: Natural na konstruksiyong Tagalog na nagpapanatili sa tahasang pinagmulan ng pagpapala.
- source_word: בְּכָל אֲשֶׁר יֶשׁ־לוֹ
  choice: nasa lahat ng kanyang pag-aari
  rationale: Ipinahahayag ang saklaw ng pagpapala sa kabuuan ng pag-aari ng Ehipsiyo nang hindi nagdaragdag ng uri ng pagpapala.
- source_word: בַּבַּיִת וּבַשָּׂדֶה
  choice: sa bahay at sa bukid
  rationale: Pinananatili ang kongkretong merismo ng domestiko at agrikultural na saklaw.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng talata ang Tetragrammaton bilang personal na pangalan; pinananatili ito bilang Yahweh sa halip na palitan ng titulong PANGINOON.
- issue: Kalikasan ng pagpapala
  choice: pinagpala / pagpapala
  alternative: pinaunlad / kasaganaan
  rationale: Hindi nililimitahan ng salin ang ברך sa materyal na kasaganaan lamang, kahit kasama iyon sa konteksto; pinananatili ang mas malawak na teolohikal na pahayag ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'sambahayan' para sa mas malawak na diwa ng בַּיִת kapag tumutukoy sa nasasakupan ni Potifar, ngunit 'bahay' sa pangwakas na merismo upang mapanatili ang konkretong kaibahan sa 'bukid.'
