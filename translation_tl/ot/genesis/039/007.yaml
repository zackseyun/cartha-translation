translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “amo” bilang likas na katumbas ng אדון sa ugnayang panlipunan ng salaysay, at tahasang inulit ang “Jose” upang maiwasan ang kalabuan. Nasa mismong teksto ang marker na [a].
