  text: And after these things[a], his master's wife cast her eyes on Yosef and said, “Lie with me.”
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito, itinuon ng asawa ng amo ni Jose ang kaniyang tingin kay Jose[a] at sinabi, “Sumiping ka sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “itinaas niya ang kaniyang mga mata kay Jose,” isang idyomang nagpapahayag dito ng nakatuon at mapagnasang pagtingin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Pagkatapos ng mga pangyayaring ito
  rationale: Ipinahahayag ng idyoma ang sumunod na pangyayari sa salaysay. Likas sa makabagong Tagalog ang “mga pangyayaring ito” habang pinananatili ang diwa ng Hebreong parirala.
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ אֶל
  choice: pinagnasaan ... si
  rationale: Literal itong “itinaas ang kaniyang mga mata kay,” ngunit sa konteksto ay tumutukoy sa nakatuon at mapagnasang pagtingin, hindi sa karaniwang pagsulyap. Malinaw at likas na naihahatid ng “pinagnasaan” ang puwersa ng idyoma; inilalagay sa talababa ang literal na larawan.
- source_word: אֵשֶׁת אֲדֹנָיו
  choice: asawa ng amo ni Jose
  rationale: Malinaw na tinutukoy ng construct chain ang babae ayon sa kaugnayan niya sa amo ni Jose. Iniiwasan ng anyong ito ang posibleng kalabuan ng panghalip sa Tagalog.
- source_word: יוֹסֵף
  choice: Jose
  rationale: “Jose” ang matatag, madaling makilalang anyo ng pangalan sa tradisyong Tagalog at karaniwang gamit ng mga mambabasang Filipino.
- source_word: שִׁכְבָה עִמִּי
  choice: Sipingan mo ako
  rationale: Tahasang seksuwal na paanyaya ang pautos na pandiwa at pang-ukol. Dignified ngunit malinaw sa Tagalog ang “Sipingan mo ako,” at hindi nito pinahihina ang sinabi tungo sa simpleng pagtulog.
