  text: At the end of forty days[b][a], Noah opened the window of the ark that he had made.
translation:
  language: tl
  text: Pagkalipas ng apatnapung araw[a], binuksan ni Noe ang bintana ng arkang ginawa niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa katapusan ng apatnapung araw.” Maaaring tumukoy ang Hebreong parirala sa puntong narating matapos lumipas ang panahong iyon.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “At nangyari, sa katapusan ng apatnapung araw, na binuksan ni Noe ang bintana ng arkang ginawa niya.”'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי
  choice: Hindi isinalin nang hiwalay; isinama sa maayos na daloy ng salaysay
  rationale: Ang anyong ito ay nagsusulong sa kasunod na pangyayari. Sa modernong Tagalog, sapat na itong ipahiwatig sa temporal na panimulang “Pagkalipas...” nang hindi gumagamit ng mabigat na “At nangyari.”
- source_word: מִקֵּץ
  choice: Pagkalipas ng
  rationale: Tinutukoy ng parirala ang pagdating sa dulo ng isang takdang panahon. Natural sa Tagalog ang “pagkalipas ng,” habang pinananatili sa talababa ang mas literal na alternatibo.
- source_word: אַרְבָּעִים יוֹם
  choice: apatnapung araw
  rationale: Ito ang tuwiran at likas na katumbas ng bilang at pangngalan.
- source_word: וַיִּפְתַּח
  choice: binuksan
  rationale: Ang pandiwang פתח ay nangangahulugang magbukas sa kontekstong ito.
- source_word: חַלּוֹן
  choice: bintana
  rationale: Karaniwang tumutukoy ang salita sa bintana o bukasang tulad ng bintana; “bintana” ang pinakakaraniwan at malamang na kahulugan dito.
- source_word: הַתֵּבָה
  choice: arka
  rationale: Sa salaysay tungkol kay Noe, ang תֵּבָה ay tradisyonal at malinaw na tinutukoy bilang “arka” sa Tagalog.
- source_word: אֲשֶׁר עָשָׂה
  choice: ginawa niya
  rationale: Tumutukoy ang sugnay sa arka. Malinaw na sa daloy ng salaysay na nauna ang paggawa rito, kaya hindi kailangang dagdagan ng pantulong na aspektong wala sa Hebreo.
