base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/011.yaml
  text: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
translation:
  language: tl
  text: Dumating sa kanya ang kalapati nang dapit-hapon[a], at naroon sa tuka nito ang isang bagong pitas na dahon ng olibo[b]. Kaya nalaman ni Noe na humupa na ang tubig mula sa ibabaw ng lupa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Bumalik sa kanya.” Ang pandiwang Hebreo ay literal na “dumating,” bagaman ipinahihiwatig ng konteksto ang pagbabalik.
    reason: lexical_alternative
  - marker: b
    text: Ang “bagong pitas” ay salin ng salitang Hebreo na nangangahulugang pinunit o pinitas, kaya ipinahihiwatig na bagong kuha ang dahon mula sa isang buhay na puno ng olibo.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “kumonti na ang tubig mula sa ibabaw ng lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֵלָיו
  choice: Dumating sa kanya
  rationale: Ang Qal na וַתָּבֹא ay tuwirang nangangahulugang “dumating” o “pumarito,” at ang אֵלָיו ay “sa kanya.” Ipinahihiwatig ng konteksto ang pagbabalik, ngunit hindi iyon tahasang nasa pandiwa.
- source_word: לְעֵת עֶרֶב
  choice: nang dapit-hapon
  rationale: Natural na makabagong Tagalog para sa panahong papasok o sumasapit ang gabi, habang pinananatili ang temporal na diwa ng Hebreo.
- source_word: וְהִנֵּה
  choice: at naroon
  rationale: Itinatampok ng הִנֵּה ang biglang napansing bagay. Ang “at naroon” ay likas sa Tagalog at nagpapanatili ng buhay na salaysay nang hindi gumagamit ng lipas na ekspresyon.
- source_word: עֲלֵה זַיִת
  choice: isang ... dahon ng olibo
  rationale: Tuwirang katumbas ng pariralang “dahon ng olibo”; hindi ito ginawang “sanga” sapagkat dahon ang tahasang tinutukoy.
- source_word: טָרָף
  choice: bagong pitas
  rationale: Ang salita ay tumutukoy sa bagay na pinunit o pinitas. Ipinahahayag ng “bagong pitas” kapwa ang pisikal na kilos at ang pagiging sariwa mula sa buhay na puno.
- source_word: בְּפִיהָ
  choice: sa tuka nito
  rationale: Literal na “sa bibig niya/nito,” ngunit “tuka” ang natural at tiyak na tawag sa bibig ng ibon sa Tagalog. Ang “nito” ay hindi nagpapataw ng likas na kasarian na wala namang kailangang tukuyin sa Tagalog.
- source_word: וַיֵּדַע נֹחַ
  choice: Kaya nalaman ni Noe
  rationale: Ipinakikita ng “kaya” na ang dahon ang batayan ng konklusyon ni Noe, ayon sa daloy ng salaysay.
- source_word: קַלּוּ הַמַּיִם
  choice: humupa na ang tubig
  rationale: Ang קלל sa kontekstong ito ay nangangahulugang kumonti o humina ang baha. Ang “humupa” ang pinakanatural na katumbas para sa tubig-baha.
- source_word: מֵעַל הָאָרֶץ
  choice: sa ibabaw ng lupa
  rationale: Pinananatili nito ang tiyak na spatial na larawan ng tubig na nasa ibabaw ng lupa, bagaman ang ideya ng paglayo ay naipapahayag na ng “humupa.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dapit-hapon,” “tuka,” at “humupa” bilang natural na mga salitang madaling maunawaan, habang ang mga talababa ay nagpapanatili sa tunay na leksikal na mga posibilidad ng Hebreo.
