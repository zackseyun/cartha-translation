base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/009.yaml
  text: But the dove found no resting place for the sole of her foot[a], so she returned to him, to the ark, because the waters were on the surface of all the earth[d][c][b]. Then he stretched out his hand and took her and brought her to himself into the ark.
translation:
  language: tl
  text: Ngunit walang natagpuang pahingahan ang kalapati para sa talampakan nito, kaya bumalik ito sa kanya, sa arka, sapagkat nasa ibabaw ng buong lupain[a] ang tubig. Iniunat niya ang kanyang kamay, kinuha ang kalapati, at dinala niya ito sa kanya, sa loob ng arka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “buong daigdig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָנוֹחַ
  choice: pahingahan
  rationale: Tumutukoy ang pangngalan sa isang lugar o kalagayan ng pamamahinga; sa konteksto, isang lugar na malalapagan ng kalapati ang tinutukoy.
- source_word: לְכַף רַגְלָהּ
  choice: para sa talampakan nito
  rationale: Pinananatili nito ang konkretong larawan ng Hebreo, kung saan ang כַּף kasama ng רֶגֶל ay tumutukoy sa talampakan.
- source_word: וַתָּשָׁב אֵלָיו אֶל־הַתֵּבָה
  choice: kaya bumalik ito sa kanya, sa daong
  rationale: 'Ang ''bumalik'' ang tuwirang diwa ng שׁוב, at pinananatili ang dalawang ugnayan: pabalik sa lalaki at patungo sa daong.'
- source_word: מַיִם עַל־פְּנֵי כָל־הָאָרֶץ
  choice: nasa ibabaw pa ng buong lupain ang tubig
  rationale: Pinananatili ng 'nasa ibabaw' ang larawang ipinahahayag ng עַל־פְּנֵי sa halip na ipakahulugang tahasang 'tinatakpan.' Ang 'pa' ay likas sa daloy ng salaysay at nagpapahiwatig na nananatili ang tubig.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: iniunat niya ang kanyang kamay
  rationale: Ito ang natural na salin sa Filipino ng idyomang Hebreo na literal na 'ipinadala/inilabas ang kanyang kamay.'
- source_word: וַיִּקָּחֶהָ
  choice: kinuha ang kalapati
  rationale: Ang לקח ay karaniwang nangangahulugang 'kunin.' Inulit ang 'kalapati' upang maging malinaw ang tinutukoy ng panghalip sa natural na Filipino.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו אֶל־הַתֵּבָה
  choice: dinala ito sa kanyang piling sa loob ng daong
  rationale: Naipahahayag nito kapwa ang אֵלָיו, 'sa kanya/sa kanyang piling,' at ang אֶל־הַתֵּבָה, na sa kontekstong ito ay humahantong sa pagpasok sa daong.
theological_decisions:
- issue: Saklaw ng כָל־הָאָרֶץ
  choice: buong lupain
  alternative: buong daigdig / buong mundo
  rationale: Maaaring tumukoy ang אֶרֶץ sa lupain o sa daigdig depende sa konteksto. Hindi nilulutas ng salin ang usapin tungkol sa heograpikong saklaw; itinatala sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na daloy ng salaysay. Ginamit ang panghalip na walang kasarian ayon sa likas na gamit sa Tagalog, habang pinanatili ang konkretong larawan ng talampakan, ibabaw ng lupain, at pagdadala sa kalapati sa loob ng daong.
