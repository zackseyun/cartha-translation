revisions:
- from: Ngunit walang natagpuang pahingahan ang kalapati para sa talampakan nito, kaya bumalik ito sa kanya, sa daong, sapagkat nasa ibabaw pa ng buong lupain ang tubig.[a] Iniunat niya ang kanyang kamay, kinuha ang kalapati, at dinala ito sa kanyang piling sa loob ng daong.
  to: Ngunit walang natagpuang pahingahan ang kalapati para sa talampakan nito, kaya bumalik ito sa kanya, sa arka, sapagkat nasa ibabaw ng buong lupain[a] ang tubig. Iniunat niya ang kanyang kamay, kinuha ang kalapati, at dinala niya ito sa kanya, sa loob ng arka.
  rationale: Pinalitan ang “daong” ng “arka” upang maging malinaw at tumpak ang terminong tumutukoy sa tebah. Inalis ang di-tahasang “pa.” Pinanatili ang magkahiwalay na ‘sa kanya’ at ‘sa arka/sa loob ng arka’ upang katawanin ang parehong אֵלָיו at אֶל־הַתֵּבָה nang natural sa Filipino.
