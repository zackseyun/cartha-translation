    rationale: Sa modernong Filipino, ang “daong” ay mas karaniwang ‘pantalan/daungan’; maaari nitong ilihis ang mambabasa mula sa sasakyang-dagat na tinutukoy ng תֵּבָה.
  - severity: low
    issue: Ang “pa” sa “nasa ibabaw pa” ay hindi hayag sa Hebreo.
    rationale: Bagaman katanggap-tanggap sa konteksto, nagdaragdag ito ng temporal na diin na hindi kailangang isalin.
