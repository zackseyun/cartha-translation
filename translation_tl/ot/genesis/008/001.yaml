  source_fidelity: 'Tumpak na naisasalin ng draft ang pangunahing diwa at mga pares na Hebreo: inalala ng Diyos si Noe, ang mababangis at alagang hayop na kasama niya sa arka, at humupa ang tubig. Gayunman, ang “pinaraan ... ang isang hangin” ay hindi gaanong likas sa modernong Tagalog para sa sanhiang gamit ng וַיַּעֲבֵר; ang “pinaihip ... ang hangin” ay mas malinaw at idiomatiko, habang pinananatili ang kahulugang sanhi ng Diyos.'
  naturalness: Marangal at malinaw ang kabuuan. Ang pag-alis ng “pati” at “isang” ay nagbibigay ng mas maayos na daloy at mas angkop na rehistro para sa salaysay. Ang binagong talababa b ay mas maingat na inilalarawan ang posibleng alingawngaw ng Genesis 1:2 nang hindi ipinapakahulugang iyon ang tiyak na pangunahing pagbasa.
  terminology: Ang “Diyos,” “Noe,” “arka,” “mababangis na hayop,” at “alagang hayop” ay angkop at pare-pareho. Ang “hangin” ang pinakamahusay na pangunahing salin ng רוּחַ sa agarang konteksto; ang “Espiritu” ay wastong panatilihin bilang posibleng pagbasa sa talababa.
