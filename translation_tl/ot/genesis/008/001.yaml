    rationale: Bagaman sinusubukan nitong tularan ang sanhiang anyo ng Hebreo, mas natural sa modernong Tagalog ang “pinaihip ng Diyos ang hangin,” na malinaw ring naghahayag na Diyos ang sanhi ng pag-ihip nito.
  - severity: low
