base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/001.yaml
  text: But God remembered Noah[a], and all the wild animals, and all the livestock that were with him in the ark. And God caused a wind to pass over the earth[b], and the waters subsided.
translation:
  language: tl
  text: Ngunit inalala ng Diyos si Noe[a], at ang lahat ng mababangis na hayop at lahat ng alagang hayop na kasama niya sa arka. Pinaihip ng Diyos ang hangin[b] sa ibabaw ng lupa, at humupa ang tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binigyang-pansin ng Diyos si Noe.” Sa Hebreo, ang “inalala” ay madalas na nagpapahiwatig ng tapat na pagkilos, hindi lamang ng paggunita.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na רוּחַ ay maaaring mangahulugang “hangin,” “hininga,” o “espiritu.” “Hangin” ang pinakaangkop dito, bagaman may nakakikitang alingawngaw ang ilan sa Espiritu o hangin na kumikilos sa ibabaw ng mga tubig sa Genesis 1:2.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: inalala
  rationale: Pinananatili nito ang idyomang Hebreo at ang diwang kumilos ang Diyos nang may malasakit at katapatan para kay Noe, hindi lamang na bigla niya itong naisip.
- source_word: כָּל הַחַיָּה
  choice: lahat ng mababangis na hayop
  rationale: Kapag katambal ng בְּהֵמָה, karaniwang tumutukoy ang חַיָּה sa mga hayop na hindi inaalagaan; pinananatili ng salin ang pagkakaiba ng dalawang uri.
- source_word: כָּל הַבְּהֵמָה
  choice: lahat ng alagang hayop
  rationale: Sa kontekstong ito, tumutukoy ang בְּהֵמָה sa mga domestikadong hayop, bilang kaibahan sa mababangis na hayop.
- source_word: בַּתֵּבָה
  choice: sa arka
  rationale: Ang “arka” ang malinaw at nakaugaliang tawag sa sasakyang-dagat ni Noe sa salaysay na ito.
- source_word: וַיַּעֲבֵר ... רוּחַ
  choice: pinaraan ... ang isang hangin
  rationale: Ipinapakita ng “pinaraan” ang causative na anyo ng pandiwa, samantalang “hangin” ang pinakaangkop na kahulugan ng רוּחַ dahil humupa ang tubig bilang bunga nito.
- source_word: עַל הָאָרֶץ
  choice: sa ibabaw ng lupa
  rationale: Likas sa modernong Tagalog ang pariralang ito at maaari nitong saklawin ang lupa o ang daigdig ayon sa malawak na konteksto ng baha.
- source_word: וַיָּשֹׁכּוּ הַמָּיִם
  choice: humupa ang tubig
  rationale: Ang “humupa” ay natural na salitang Tagalog para sa pagluwag o pagbaba ng tubig-baha.
- source_word: וַ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang malaking pagliko ng salaysay mula sa paghuhukom tungo sa pagliligtas, nang hindi nagdaragdag ng bagong pangyayari.
theological_decisions:
- issue: Antropomorpikong pananalitang “inalala ng Diyos si Noe”
  choice: Panatilihin ang idyoma bilang “inalala ng Diyos si Noe”
  alternative: “Binigyang-pansin ng Diyos si Noe” o “hindi kinalimutan ng Diyos si Noe”
  rationale: Hindi dapat alisin ang lakas at tensiyon ng idyomang Hebreo. Sa konteksto, hindi ito nangangahulugang dati siyang nakalimutan ng Diyos, kundi na ang pag-alaala ng Diyos ay nahayag sa tapat na pagkilos.
- issue: Kahulugan ng רוּחַ sa salaysay ng baha
  choice: “hangin” sa pangunahing teksto
  alternative: “espiritu”
  rationale: 'Bagaman maaaring mangahulugan ang רוּחַ ng hangin, hininga, o espiritu, meteorolohikal ang agarang gamit dito: pinaraan ito ng Diyos at humupa ang tubig. Nananatili sa talababa ang posibleng alusyon sa Genesis 1:2.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “mababangis na hayop” at “alagang hayop” upang mapanatili ang pagkakaiba ng dalawang terminong Hebreo. Ang “arka” ay pinanatili bilang pamilyar na terminong biblikal.
