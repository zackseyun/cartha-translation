  text: So Noah went out[b][a], and his sons and his wife and his sons’ wives with him.
translation:
  language: tl
  text: Kaya lumabas[a] si Noe, kasama ang kanyang mga anak na lalaki, ang kanyang asawa, at ang mga asawa ng kanyang mga anak na lalaki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Pagkatapos ay lumabas si Noe” o “At lumabas si Noe.” Ang anyo ng salaysay sa Hebreo ay maaaring katawanin ng ilang payak na pang-ugnay sa Tagalog.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga asawa ng kanyang mga anak na lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Kaya lumabas
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay at, sa konteksto, ipinakikitang tumugon si Noe sa naunang utos. Likas sa modernong Tagalog ang “Kaya lumabas,” habang maaari ring katawanin ang payak na Hebreong pang-ugnay ng “Pagkatapos” o “At.”
- source_word: נֹחַ
  choice: Noe
  rationale: Ito ang nakasanayang anyo ng pangalang Noah sa mga saling Tagalog ng Bibliya.
- source_word: וּבָנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng בָּנִים dito, hindi pangkalahatang “mga anak.”
- source_word: וְאִשְׁתּוֹ
  choice: ang kanyang asawa
  rationale: Tuwirang ipinapahayag ng pangngalang isahan na may hulaping ikatlong panauhang panlalaki ang “kanyang asawa.”
- source_word: וּנְשֵׁי בָנָיו
  choice: ang mga asawa ng kanyang mga anak na lalaki
  rationale: Malapit ito sa literal na Hebreong parirala at malinaw sa Tagalog; hindi ginamit ang mas interpretatibong “mga manugang na babae.”
- source_word: אִתּוֹ
  choice: kasama
  rationale: Ang אִתּוֹ ay “kasama niya.” Sa natural na ayos ng Tagalog, inilagay ang “kasama” bago ang buong talaan, kaya malinaw na ang lahat ng binanggit ay lumabas na kasama ni Noe.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang tiyak na kasarian ng “mga anak na lalaki” at ang literal na ugnayan sa pariralang “mga asawa ng kanyang mga anak na lalaki.” Ang unang “kasama” ay ginamit upang maiwasan ang mabigat at di-likas na pagtatapos na “kasama niya,” nang hindi binabago ang kahulugan.
