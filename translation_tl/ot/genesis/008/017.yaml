base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/017.yaml
  text: Bring out with you every living thing that is with you[a], from all flesh—birds and livestock and every creeping thing that creeps on the earth—so that they may swarm on the earth and be fruitful and multiply on the earth.
translation:
  language: tl
  text: 'Ilabas mong kasama mo ang bawat nilalang na buhay na kapiling mo—mula sa lahat ng may laman: mga ibon, mga alagang hayop, at bawat gumagapang na nilalang na gumagapang sa lupa—upang maglipana sila sa lupa, maging mabunga at dumami sa lupa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: bawat nilalang na may buhay
  rationale: Saklaw nito ang lahat ng nabubuhay na hayop sa kasunod na talaan at hindi ito nililimitahan sa maiilap na hayop.
- source_word: אֲשֶׁר אִתְּךָ
  choice: na kasama mo
  rationale: Tuwirang isinasalin ang sugnay na naglalarawan sa mga nilalang na nasa loob ng arka kasama ni Noe.
- source_word: מִכָּל בָּשָׂר
  choice: mula sa lahat ng may laman
  rationale: Pinananatili ang kongkretong idyomang Hebreo kung saan ang ‘laman’ ay kolektibong tumutukoy sa mga nilalang na may katawan.
- source_word: בָּעוֹף
  choice: mga ibon
  rationale: Ito ang likas at malinaw na tawag sa mga lumilipad na nilalang sa kontekstong ito.
- source_word: וּבַבְּהֵמָה
  choice: mga alagang hayop
  rationale: Sa talaang ito, ang בְּהֵמָה ay karaniwang tumutukoy sa malalaking hayop, lalo na sa mga domestikado; iniiwasan ng salin ang mas makitid na ‘mga baka.’
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ
  choice: at bawat gumagapang na nilalang na gumagapang
  rationale: Inuulit ang salitang-ugat na ‘gumagapang’ upang mapanatili ang pag-uugnay at pag-uulit sa Hebreo.
- source_word: הוֹצֵא אִתָּךְ
  choice: Ilabas mong kasama mo
  rationale: 'Ipinahahayag nito ang pasaklaw na utos: si Noe ang magpapalabas sa mga hayop habang lumalabas din siya.'
- source_word: וְשָׁרְצוּ
  choice: upang managana sila
  rationale: Natural na ipinahahayag sa Filipino ang saganang pagdami na taglay ng pandiwang Hebreo, habang ipinakikita ng ‘upang’ ang layunin o inaasahang bunga ng utos.
- source_word: בָאָרֶץ
  choice: sa lupa
  rationale: Ang ‘lupa’ ay angkop sa malawak na daigdig na muling titirhan pagkatapos ng baha.
- source_word: וּפָרוּ וְרָבוּ
  choice: maging mabunga, at dumami
  rationale: Pinananatili ang natatanging pananalita ng pagpapala sa paglikha at ang malinaw na alingawngaw nito mula sa Genesis 1.
theological_decisions:
- issue: Alingawngaw ng pagpapala sa paglikha pagkatapos ng baha
  choice: Panatilihin ang ‘maging mabunga, at dumami’ at ang ideya ng saganang pagdami sa ‘managana.’
  alternative: Isalin nang pangkalahatan bilang ‘lalo silang dumami.’
  rationale: Sinasadyang ulitin ng talata ang bokabularyo ng paglikha upang ipakita ang panibagong pagsisimula pagkatapos ng paghuhukom, nang hindi nagdaragdag ng paliwanag sa mismong teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang Hebreong idyomang ‘lahat ng may laman,’ ang pag-uulit sa ‘gumagapang,’ at ang bokabularyo ng pagpapala sa paglikha.
