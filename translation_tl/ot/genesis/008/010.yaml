  source_fidelity: 'Tumpak ang pangunahing diwa: naghintay si Noe ng isa pang yugto ng pitong araw at muling pinadala/pinalabas ang kalapati mula sa arka. Ang pag-unawa sa וַיָּחֶל bilang idyomatikong “naghintay” ay angkop sa konteksto.'
  naturalness: Nauunawaan ang kasalukuyang teksto, ngunit mas likas sa makabagong Filipino ang “naghintay siya ng isa pang pitong araw” kaysa “naghintay pa siya nang panibagong pitong araw.” Kailangan ding ayusin ang balarila ng alternatibong salin sa talababa.
  terminology: Ang “kalapati” at “arka” ay wasto, malinaw, at angkop sa salaysay. Ang “pinalabas” ay katanggap-tanggap na pagsasalin ng pagpapadala ng kalapati palabas.
