  text: Then he waited another seven days[a], and again sent out the dove from the ark.
translation:
  language: tl
  text: Pagkatapos ay naghintay siya ng isa pang pitong araw[a], at muli niyang pinalabas ang kalapati mula sa arka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagkatapos ay sinimulan niyang maghintay ng isa pang pitong araw.” Mas literal na maaaring mangahulugang “nagsimula” ang pandiwang Hebreo, ngunit sa kontekstong ito ay idyomatikong nangangahulugang “naghintay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: naghintay
  rationale: Sa konteksto ng salaysay at ng kasunod na yugto ng pitong araw, ang pandiwa ay idyomatikong tumutukoy sa paghihintay bago kumilos muli.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: pa … nang panibagong pitong araw
  rationale: Likas nitong ipinahihiwatig ang isa pang karagdagang yugto ng pitong araw; pinananatili ng “pa” at “panibagong” ang diin ng עוֹד at אֲחֵרִים.
- source_word: וַיֹּסֶף שַׁלַּח
  choice: muli niyang pinalabas
  rationale: Ang וַיֹּסֶף kasama ng kasunod na pandiwa ay nangangahulugang inulit ang kilos, at malinaw na ipinahihiwatig ng “pinalabas” ang pagpapadala sa kalapati palabas ng arka.
- source_word: הַיּוֹנָה
  choice: ang kalapati
  rationale: Tumutukoy ito sa tiyak na kalapating nauna nang binanggit sa salaysay.
- source_word: מִן הַתֵּבָה
  choice: mula sa arka
  rationale: Ang תֵּבָה sa salaysay tungkol kay Noe ay ang arka, at tuwirang ipinahahayag ng מִן ang pinagmulan ng paglabas.
