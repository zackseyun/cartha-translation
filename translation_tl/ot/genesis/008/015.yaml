  text: Then God spoke to Noah, saying,
translation:
  language: tl
  text: 'Pagkatapos ay nagsalita ang Diyos kay Noe:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos ay nagsalita
  rationale: Ang waw-consecutive kasama ng דִּבֵּר ay nagpapatuloy sa salaysay. Likas na ipinahahayag ng “Pagkatapos ay” ang pagkakasunod-sunod, at mas tuwirang katumbas ng pandiwa ang “nagsalita” kaysa “sinabi.”
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Sa kontekstong ito, tumutukoy ang אֱלֹהִים sa nag-iisang Diyos; ang “Diyos” ang karaniwan at angkop na salin.
- source_word: אֶל
  choice: kay
  rationale: Tinutukoy ng pang-ukol ang taong kinakausap. Ang “kay” ang likas na anyo sa Tagalog bago ang pangalang pantangi.
- source_word: נֹחַ
  choice: Noe
  rationale: Ginamit ang nakagawiang anyo ng pangalang biblikal sa Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Ipinakikilala ng infinitive construct ang nilalaman ng kasunod na pahayag. Pinananatili ng “na sinasabi” ang pormal na ugnayan sa siping sumusunod.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang pormal na pormula ng Hebreo sa pagpapakilala ng tuwirang pahayag, kahit bahagyang mas pampanitikan ang “na sinasabi” kaysa sa payak na “sinabi.”
