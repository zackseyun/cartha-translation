  yaml_path: translation/ot/genesis/008/005.yaml
  text: And the waters continued to recede until the tenth month. In the tenth month[a], on the first day of the month, the tops of the mountains became visible.
translation:
  language: tl
  text: Patuloy na bumaba ang tubig hanggang sa ikasampung buwan. Sa unang araw ng ikasampung buwan, lumitaw ang mga tuktok ng mga bundok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging tanaw” o “nakita.” Maaaring isalin nang mas pasibo ang pandiwang Hebreo; ang “lumitaw” ay nagpapahiwatig na naging tanaw ang mga tuktok habang bumababa ang tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּיִם
  choice: ang tubig
  rationale: Bagaman maramihan ang anyo ng Hebreo, likas sa modernong Tagalog ang pang-isahang pangngalang di-mabilang na “tubig” para sa baha.
- source_word: הָיוּ הָלוֹךְ וְחָסוֹר
  choice: patuloy na humupa
  rationale: Ipinahahayag ng konstruksiyon ang nagpapatuloy at unti-unting pagbaba ng tubig; natural itong naihahatid ng “patuloy na humupa.”
- source_word: עַד הַחֹדֶשׁ הָעֲשִׂירִי
  choice: hanggang sa ikasampung buwan
  rationale: Tuwirang temporal na pagtukoy ito; ang חֹדֶשׁ ay karaniwang nangangahulugang “buwan” sa ganitong salaysay.
- source_word: בָּעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ
  choice: Sa unang araw ng ikasampung buwan
  rationale: Nililinaw nito sa natural na ayos ng Tagalog ang eksaktong petsang ipinahahayag ng eliptikong Hebreo, nang hindi inuulit nang mabigat ang “buwan.”
- source_word: נִרְאוּ
  choice: lumitaw
  rationale: 'Maaaring pasibo o inkoatibo ang Niphal: nakita, naging tanaw, o lumitaw. Ang “lumitaw” ay natural at ipinahihiwatig na naging nakikita ang mga tuktok habang humuhupa ang tubig, nang hindi nagtatakda ng partikular na tumitingin.'
- source_word: רָאשֵׁי הֶהָרִים
  choice: ang mga tuktok ng mga bundok
  rationale: Ang literal na “mga ulo” ay di-likas sa Tagalog; pinananatili ng “mga tuktok” ang topograpikong diwa nang hindi nililimitahan sa matutulis na taluktok lamang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at angkop sa salaysay. Ginamit ang “humupa” bilang likas na pandiwa para sa pagbaba ng baha at “tuktok” bilang malinaw na katumbas ng topograpikong רֹאשׁ. Inilagay ang pananda ng talababa sa mismong sugnay na may kaugnayan sa lexical na alternatibo.
