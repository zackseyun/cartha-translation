- from: Patuloy na humupa ang tubig hanggang sa ikasampung buwan. Sa unang araw ng ikasampung buwan, lumitaw ang mga tuktok ng mga bundok.[a]
  to: Patuloy na bumaba ang tubig hanggang sa ikasampung buwan. Sa unang araw ng ikasampung buwan, lumitaw ang mga tuktok ng mga bundok.[a]
  rationale: Pinalitan ang “humupa” ng “bumaba” upang malinaw na maipahayag ang nagpapatuloy na pagliit o pagbaba ng tubig. Inayos ang talababa upang mapanatili ang mga leksikal na alternatibo at ang ambiguity ng Niphal nang hindi nagdaragdag ng isang ipinapalagay na tagamasid.
