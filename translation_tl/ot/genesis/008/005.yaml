  terminology: Ang “tubig,” “ikasampung buwan,” at “mga tuktok ng mga bundok” ay angkop sa modernong Filipino Tagalog. Pinananatili ang “lumitaw” bilang likas na inkoatibong katumbas ng Niphal na נִרְאוּ, nang hindi nagpapalagay ng isang tiyak na nakakita.
