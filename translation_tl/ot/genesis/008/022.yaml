  text: עֹ֖ד כָּל יְמֵ֣י הָ/אָ֑רֶץ זֶ֡רַע וְ֠/קָצִיר וְ/קֹ֨ר וָ/חֹ֜ם וְ/קַ֧יִץ וָ/חֹ֛רֶף וְ/י֥וֹם וָ/לַ֖יְלָה לֹ֥א יִשְׁבֹּֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/022.yaml
  text: For as long as the earth endures[a], seedtime and harvest, cold and heat, summer and winter[b], and day and night shall not cease.
translation:
  language: tl
  text: Habang nananatili ang lupa[a], ang panahon ng paghahasik at pag-aani, ang lamig at init, ang tag-araw at taglamig, at ang araw at gabi ay hindi titigil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa lahat ng araw ng lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹד כָּל יְמֵי הָאָרֶץ
  choice: Habang nananatili ang lupa
  rationale: Likas na ipinapahayag sa modernong Tagalog ang saklaw ng panahong tinutukoy ng Hebreo, nang hindi sinasabing walang hanggan ang pangako. Inilalagay sa talababa ang literal na larawan na ‘lahat ng araw ng lupa.’
- source_word: זֶרַע וְקָצִיר
  choice: ang panahon ng paghahasik at pag-aani
  rationale: Sa pagkakapares, tumutukoy ang זֶרַע sa gawain o panahon ng paghahasik, hindi lamang sa binhi; malinaw at karaniwan ang kaparis na ‘pag-aani.’
- source_word: קֹר וָחֹם
  choice: ang lamig at init
  rationale: Tuwirang pinananatili ang magkasalungat na kalagayan ng panahon.
- source_word: קַיִץ וָחֹרֶף
  choice: ang tag-araw at taglamig
  rationale: Ito ang karaniwang katumbas ng magkapares na terminong Hebreo; hindi ipinapalit ang mas interpretatibong ‘tagtuyot at tag-ulan.’
- source_word: יוֹם וָלַיְלָה
  choice: ang araw at gabi
  rationale: Pinananatili ang nakagawiang pares na nagsasaad ng tuloy-tuloy na ikot ng panahon.
- source_word: לֹא יִשְׁבֹּתוּ
  choice: ay hindi titigil
  rationale: Sa konteksto, ang ugat na שׁבת ay nangangahulugang huminto o tumigil; natural itong tumutukoy sa lahat ng naunang binanggit na siklo.
theological_decisions:
- issue: Saklaw at tagal ng pangako tungkol sa mga regular na siklo ng sangnilikha
  choice: Ang mga siklo ay hindi titigil habang nananatili ang lupa.
  alternative: Ang mga siklong ito ay magpapatuloy nang walang hanggan at walang anumang pasubali.
  rationale: Nililimitahan ng כָּל יְמֵי הָאָרֶץ ang pahayag sa tagal ng mga ‘araw ng lupa.’ Pinananatili ng salin ang hangganang ito at hindi ginagawang tahasang pahayag tungkol sa kawalang-hanggan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘panahon ng paghahasik’ upang maging malinaw ang agrikultural na kahulugan, at pinanatili ang maindayog na mga pares sa Hebreo.
