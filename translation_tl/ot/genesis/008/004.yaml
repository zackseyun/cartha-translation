  text: וַ/תָּ֤נַח הַ/תֵּבָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י בְּ/שִׁבְעָה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ עַ֖ל הָרֵ֥י אֲרָרָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/004.yaml
  text: And in the seventh month[a], on the seventeenth day of the month, the ark came to rest on the mountains of Ararat.
translation:
  language: tl
  text: At noong ikapitong buwan, sa ikalabimpitong araw ng buwan, humimpil ang arka sa mga bundok ng Ararat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay “mga bundok ng Ararat.” Tumutukoy ito sa isang mabundok na rehiyon, hindi tiyak na sa iisang taluktok na tinatawag na Bundok Ararat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּנַח
  choice: humimpil
  rationale: Ipinahihiwatig ng pandiwang נוח sa anyong wayyiqtol na ang arka ay dumating sa isang lugar at nanatili roon. Likas sa modernong Tagalog ang “humimpil” at hindi nito idinaragdag ang di-tiyak na ideya ng marahas na pagsadsad.
- source_word: הַתֵּבָה
  choice: ang arka
  rationale: Ang “arka” ang kinikilalang tawag sa sasakyang ginawa ni Noe at malinaw ito sa karaniwang mambabasang Tagalog.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: noong ikapitong buwan
  rationale: Likas na panandang temporal sa Tagalog ang “noong” para sa tinutukoy na buwan.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: sa ikalabimpitong araw ng buwan
  rationale: Tumpak at likas na katumbas ng pormulang Hebreo sa pagtukoy ng petsa.
- source_word: עַל
  choice: sa
  rationale: Ang “sa” ang likas na panandang lokatibo sa Tagalog sa pariralang ito.
- source_word: הָרֵי אֲרָרָט
  choice: mga bundok ng Ararat
  rationale: Maramihan ang הָרֵי, kaya pinananatili ng “mga bundok” ang bilang at iniiwasang tukuyin ang iisang taluktok lamang.
theological_decisions:
- issue: Heograpikong pahayag na הָרֵי אֲרָרָט
  choice: mga bundok ng Ararat
  alternative: Bundok Ararat
  rationale: Malinaw na maramihan ang salitang Hebreo. Hindi ito dapat gawing pang-isahang tradisyonal na katawagang “Bundok Ararat,” na magiging mas tiyak kaysa sa mismong teksto.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Pinili ang “humimpil” upang maipahayag ang pagdating ng arka sa pahingahang lugar nang hindi nagdaragdag ng ideya ng banggaan o marahas na pagsadsad.
