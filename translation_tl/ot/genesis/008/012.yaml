  source_fidelity: 'Tumpak ang pangunahing diwa: naghintay si Noe ng karagdagang pitong araw, ipinadala ang kalapati, at hindi na ito bumalik sa kanya. Gayunman, ang “muli niyang pinalipad” ay mas tiyak kaysa sa Hebreong וַיְשַׁלַּח, na tuwirang nagsasabing ipinadala niya ang kalapati. Ang pag-uulit ay malinaw sa mas malawak na salaysay, ngunit hindi kailangang idagdag sa pandiwang ito.'
