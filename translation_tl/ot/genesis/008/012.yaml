  terminology: Ang “kalapati” at “sa kanya” ay angkop sa modernong Filipino. Napananatili ng “hindi na ito bumalik” ang wastong puwersa ng negadong konstruksyong יסף + שוב; ang alternatibong “hindi na ito muling bumalik” ay dapat itala bilang posibleng paglalapat.
