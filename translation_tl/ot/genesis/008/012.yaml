translation:
  language: tl
  text: Pagkatapos, naghintay pa siya ng pitong araw at ipinadala niya ang kalapati. Hindi na ito bumalik sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at hindi na ito muling bumalik sa kanya.” Ang Hebreong pananalitang may pagkakaila na יָסְפָה + שׁוּב ay maaaring mangahulugang “hindi na bumalik” o “hindi muling bumalik.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיָּחֶל
  choice: Pagkatapos, naghintay
  rationale: Ang יחל sa kontekstong ito ay nangangahulugang maghintay o magtagal. Ipinahahayag ng “Pagkatapos” ang pagsulong ng salaysay na dala ng waw-consecutive.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: pa siya ng pitong araw
  rationale: Likas na ipinahahayag sa Filipino ng “pa ... ng pitong araw” ang isa pang karagdagang yugto ng pitong araw nang hindi inuulit ang parehong diwa.
- source_word: וַיְשַׁלַּח אֶת־הַיּוֹנָה
  choice: Muli niyang pinalipad ang kalapati
  rationale: Ang שׁלח ay “ipadala.” Sa kalagayan ng pagpapalabas ng ibon mula sa arka, natural ang “pinalipad”; ipinahihiwatig ng pagkakasunod ng salaysay ang muling pagpapadala rito.
- source_word: וְלֹא יָסְפָה שׁוּב
  choice: at hindi na ito bumalik
  rationale: Ang negadong יסף na sinusundan ng שׁוּב ay maaaring idiomatikong mangahulugang “hindi na bumalik” o “hindi muling bumalik.” Pinili ang una bilang natural na Filipino habang pinananatili sa talababa ang alternatibong pagbasa.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Tuwirang ipinahahayag nito ang direksiyon pabalik kay Noe; sapat na ang “sa kanya” dahil nasa pandiwang “bumalik” na ang ideya ng pagbabalik.
- source_word: עוֹד
  choice: na
  rationale: Sa hulihang negadong konstruksyon, ang עוֹד ay natural na ipinahahayag ng Filipino na “hindi na,” bagaman maaari rin itong unawain bilang “hindi ... muli.”
