  yaml_path: translation/ot/genesis/008/002.yaml
  text: The springs of the deep and the windows of the heavens were shut[b][a], and the rain from the heavens was restrained.
translation:
  language: tl
  text: Nasarhan ang mga bukal ng kalaliman at ang mga bintana ng langit[a], at napigil ang ulan mula sa langit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lagusan ng tubig-baha sa langit.” Literal na tumutukoy ang Hebreo sa mga bukasan o bintana sa langit.
    reason: lexical_alternative
  - marker: b
    text: O “at tumigil ang ulan mula sa langit.” Maaaring idiin ng pandiwang Hebreo na pinigil ang ulan, kaya tumigil ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּכְרוּ
  choice: nagsara
  rationale: Ipinahahayag nito na nagsara o nasarhan ang dalawang pinagmumulan ng tubig nang hindi nagdaragdag ng tahasang gumaganap, gaya ng Hebreong anyong Nifal.
- source_word: מַעְיְנֹת תְּהוֹם
  choice: mga bukal ng kalaliman
  rationale: Ang “mga bukal” ay likas na katumbas ng mga pinagmumulan ng tubig, at pinananatili ng “kalaliman” ang kosmikong larawan ng תְּהוֹם at ang ugnay nito sa Genesis 1:2 at 7:11.
- source_word: אֲרֻבֹּת הַשָּׁמָיִם
  choice: mga bintana ng langit
  rationale: Pinananatili ng “mga bintana” ang literal na larawan ng mga bukasan sa langit; mas mapagpaliwanag at mas tiyak kaysa sa salitang Hebreo ang “mga pintuan ng baha.”
- source_word: וַיִּכָּלֵא
  choice: napigil
  rationale: Ipinahahayag ng “napigil” ang diwang ang ulan ay pinigil o hindi na pinatuloy, sa halip na ilahad lamang ang bunga na tumigil ito.
- source_word: הַגֶּשֶׁם
  choice: ulan
  rationale: Ito ang tuwiran at karaniwang katumbas sa makabagong Tagalog.
- source_word: מִן הַשָּׁמָיִם
  choice: mula sa langit
  rationale: Pinananatili nito ang pag-uulit ng “langit” sa Hebreo at ang larawan ng ulan na nagmumula roon.
