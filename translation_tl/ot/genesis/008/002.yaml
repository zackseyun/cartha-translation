  source_fidelity: 'Ang pangunahing diwa at lahat ng mahahalagang larawan ay tapat sa Hebreo: ang mga bukal ng kalaliman, mga bintana ng langit, at ang ulan na napigil. Gayunman, ang “Nagsara” ay karaniwang intransitibo at maaaring magpahiwatig na ang mga bukal at bintana mismo ang nagsara. Ang Nifal na וַיִּסָּכְרוּ ay mas wastong naihahayag sa “Nasarhan,” nang walang pagdaragdag ng gumaganap.'
