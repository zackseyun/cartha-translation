base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/019.yaml
  text: Every beast[a], every creeping thing, and every bird—everything that moves on the earth—went out from the ark by their families.
translation:
  language: tl
  text: Ang bawat hayop, bawat gumagapang na nilalang, at bawat ibon—ang lahat ng gumagalaw sa ibabaw ng lupa—ay lumabas sa arka ayon sa kani-kanilang pamilya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang pangkat-pangkat ayon sa kanilang mga pamilya.” Pinananatili ng Hebreo ang ideya ng magkakaugnay na angkan o mga pangkat sa hanay ng mga hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: Ang bawat hayop
  rationale: Sa talaang ito, tumutukoy ang חַיָּה sa kategorya ng mga hayop na ibinubukod sa mga gumagapang na nilalang at mga ibon. Ipinapahayag ng “bawat” ang distributibong gamit ng כָּל nang hindi nililimitahan sa mailap o maaamong hayop.
- source_word: כָּל הָרֶמֶשׂ
  choice: bawat gumagapang na nilalang
  rationale: Tumutukoy ang רֶמֶשׂ sa maliliit na nilalang na kumikilos nang malapit sa lupa. Likas at malinaw sa makabagong Tagalog ang “gumagapang na nilalang.”
- source_word: וְכָל הָעוֹף
  choice: at bawat ibon
  rationale: Bagaman maaaring masaklaw ng עוֹף ang mga lumilipad na nilalang, “ibon” ang pinakanatural na salin sa kontekstong ito.
- source_word: כֹּל רוֹמֵשׂ עַל הָאָרֶץ
  choice: ang lahat ng gumagalaw sa ibabaw ng lupa
  rationale: Mas malawak ang pandiwaring רוֹמֵשׂ kaysa sa naunang pangngalang רֶמֶשׂ. Pinananatili ng “gumagalaw” ang malawak na kahulugan at iniiwasan ang alanganing pag-uulit ng “gumagapang.”
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: ayon sa kani-kanilang pamilya
  rationale: Karaniwang nangangahulugang “pamilya” o “angkan” ang מִשְׁפָּחָה. Sa mga hayop, inilalarawan nito ang paglabas nila sa magkakaugnay na pangkat, nang hindi ito ipinapantay agad sa teknikal na “uri.”
- source_word: יָצְאוּ מִן הַתֵּבָה
  choice: ay lumabas sa arka
  rationale: Direktang ipinapahayag ng יָצְאוּ ang paglabas, at “arka” ang nakagawiang katawagan sa תֵּבָה sa salaysay tungkol kay Noe.
