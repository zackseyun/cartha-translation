translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang Hebreong pag-uuri at ang ideya ng mga hayop na lumalabas ayon sa kanilang mga pamilya, habang iniwasan ang labis na teknikal o denominasyonal na pagpapakahulugan.
