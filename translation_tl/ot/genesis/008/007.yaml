  yaml_path: translation/ot/genesis/008/007.yaml
  text: Then he sent out the raven[a], and it went out, going out and returning[b], until the waters had dried up from upon the earth.
translation:
  language: tl
  text: Pagkatapos, pinakawalan niya ang uwak. Lumabas iyon at patuloy na nagpabalik-balik[a] hanggang sa matuyo ang tubig sa ibabaw ng lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na salin: “lumabas iyon, na patuloy na lumalabas at bumabalik.” Ang pananalita sa Hebreo ay nagpapahiwatig ng paulit-ulit o tuloy-tuloy na pagkilos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: pinakawalan niya
  rationale: Sa konteksto ng pagpapalabas ng ibon mula sa arka, likas sa modernong Tagalog ang “pinakawalan”; ipinahahayag nito ang pagpapalabas nang hindi nagdaragdag ng tiyak na paraan ng paggalaw.
- source_word: הָעֹרֵב
  choice: ang uwak
  rationale: Karaniwan at tiyak na katawagan sa Tagalog para sa עֹרֵב.
- source_word: וַיֵּצֵא
  choice: Lumabas iyon
  rationale: Tuwirang sinasalamin ang Qal na anyo ng יצא at iniiwasang idagdag ang “lumipad,” na hindi tahasang sinabi sa Hebreo.
- source_word: יָצוֹא וָשׁוֹב
  choice: patuloy na nagpabalik-balik
  rationale: Ipinahahayag ang paulit-ulit o nagpapatuloy na pagkilos ng konstruksiyong may mga infinitive absolute, sa natural na modernong Tagalog.
- source_word: עַד
  choice: hanggang sa
  rationale: Karaniwang panandang temporal para sa hangganan ng nagpapatuloy na kilos.
- source_word: יְבֹשֶׁת הַמַּיִם
  choice: matuyo ang tubig
  rationale: Pinananatili ang larawan ng pagkatuyo ng tubig at ang temporal na ugnayan pagkatapos ng עַד.
- source_word: מֵעַל הָאָרֶץ
  choice: sa ibabaw ng lupa
  rationale: Pinananatili ang tahasang spatial na larawan ng tubig na nasa ibabaw ng lupa; sa Tagalog, ang pagkatuyo ay likas nang nagpapahiwatig ng pagkawala nito mula roon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pagkatapos” upang natural na ipagpatuloy ang salaysay. Hinati sa dalawang pangungusap para luminaw ang sunod-sunod na kilos, habang pinananatili sa talababa ang mas pormal na anyo ng Hebreong pag-uulit.
