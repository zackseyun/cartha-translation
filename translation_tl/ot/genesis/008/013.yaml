source:
  edition: WLC
  text: וַֽ֠/יְהִי בְּ/אַחַ֨ת וְ/שֵׁשׁ מֵא֜וֹת שָׁנָ֗ה בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ חָֽרְב֥וּ הַ/מַּ֖יִם מֵ/עַ֣ל הָ/אָ֑רֶץ וַ/יָּ֤סַר נֹ֨חַ֙ אֶת מִכְסֵ֣ה הַ/תֵּבָ֔ה וַ/יַּ֕רְא וְ/הִנֵּ֥ה חָֽרְב֖וּ פְּנֵ֥י הָֽ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/013.yaml
  text: And it came about in the six hundred and first year[a], in the first month, on the first day of the month, that the waters had dried up from upon the earth. Then Noah removed the covering of the ark and looked, and behold[c][b], the surface of the ground was dry.
translation:
  language: tl
  text: Noong ika-601 taon,[a] sa unang buwan, sa unang araw ng buwan, natuyo na ang tubig sa ibabaw ng lupa. Inalis ni Noe ang takip[b] ng arka at tumingin siya; narito, tuyo na ang ibabaw ng lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang ayos ng mga salita ay literal na “sa isa at animnaraan, taon.”
    reason: lexical_alternative
  - marker: b
    text: O “bubong.” Ang salitang Hebreo ay pangkalahatang nangangahulugang “takip” at hindi tumutukoy nang tiyak sa anyo ng bahaging ito ng arka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Noong
  rationale: Sa temporal na pormulang ito, likas na ipinahihiwatig ng “Noong” ang pagsulong ng salaysay nang hindi gumagamit ng makalumang pariralang gaya ng “at nangyari.”
- source_word: בְּאַחַת וְשֵׁשׁ מֵאוֹת שָׁנָה
  choice: ika-601 taon
  rationale: Natural itong paraan sa modernong Filipino upang ipahayag ang ordinal na taon. Hindi idinagdag sa pangunahing teksto na ito ay taon ng buhay ni Noe sapagkat hindi iyon tahasang sinasabi sa talata.
- source_word: בָּרִאשׁוֹן
  choice: sa unang buwan
  rationale: Elliptical sa Hebreo ang “sa una”; nililinaw ng konteksto ng petsa na buwan ang tinutukoy.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: sa unang araw ng buwan
  rationale: Malinaw at natural na katumbas ng Hebreong idyoma para sa petsa.
- source_word: חָרְבוּ הַמַּיִם מֵעַל הָאָרֶץ
  choice: natuyo na ang tubig sa ibabaw ng lupa
  rationale: Ipinahahayag ng “natuyo na” ang natapos nang kalagayan sa puntong iyon ng salaysay, samantalang pinananatili ng “sa ibabaw ng lupa” ang diwa ng מֵעַל.
- source_word: וַיָּסַר
  choice: inalis
  rationale: Tuwirang katumbas ng Hiphil na nangangahulugang alisin o tanggalin.
- source_word: מִכְסֵה
  choice: takip
  rationale: Pinananatili nito ang pangkalahatang kahulugan ng salitang Hebreo at hindi ipinapalagay na isang tiyak na uri ng bubong ang tinutukoy.
- source_word: הַתֵּבָה
  choice: arka
  rationale: Ito ang nakasanayan at madaling maunawaang katawagan sa sasakyang-dagat ni Noe sa salaysay ng Genesis.
- source_word: וַיַּרְא
  choice: tumingin siya
  rationale: Sa pagkakasunod ng mga kilos, inilalarawan nito ang sadyang pagmamasid ni Noe matapos niyang alisin ang takip.
- source_word: וְהִנֵּה
  choice: at narito
  rationale: Pinananatili ang pantawag-pansing lakas ng Hebreong particle habang angkop sa marangal na salaysay.
- source_word: חָרְבוּ פְּנֵי הָאֲדָמָה
  choice: tuyo na ang ibabaw ng lupa
  rationale: Natural na katumbas ang “ibabaw” ng literal na “mukha,” at malinaw na inilalarawan ang nakikitang kalupaan.
theological_decisions:
- issue: Kung ang ika-601 taon ay tahasang tatawaging taon ng buhay ni Noe
  choice: Iniwan itong hindi tinukoy sa pangunahing teksto.
  alternative: “Noong ika-601 taon ng buhay ni Noe”
  rationale: Malakas na ipinahihiwatig ng konteksto na edad o bilang ng taon ni Noe ang tinutukoy, ngunit hindi tahasang binabanggit iyon sa mismong Hebreo ng talata; kaya pinanatili ang pagiging implicit nito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang himig. Ginamit ang “arka,” “Noe,” at “narito” bilang pamilyar na wikang biblikal, ngunit iniwasan ang labis na makaluma o teknikal na pananalita. Ang mga numerong digit ay ginamit para madaling mabasa ang mahabang ordinal.
