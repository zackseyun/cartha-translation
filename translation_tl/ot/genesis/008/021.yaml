  text: וַ/יָּ֣רַח יְהוָה֮ אֶת רֵ֣יחַ הַ/נִּיחֹחַ֒ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל לִבּ֗/וֹ לֹֽא אֹ֠סִף לְ/קַלֵּ֨ל ע֤וֹד אֶת הָֽ/אֲדָמָה֙ בַּ/עֲב֣וּר הָֽ/אָדָ֔ם כִּ֠י יֵ֣צֶר לֵ֧ב הָ/אָדָ֛ם רַ֖ע מִ/נְּעֻרָ֑י/ו וְ/לֹֽא אֹסִ֥ף ע֛וֹד לְ/הַכּ֥וֹת אֶת כָּל חַ֖י כַּֽ/אֲשֶׁ֥ר עָשִֽׂיתִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/021.yaml
  text: And the LORD smelled the pleasing aroma, and the LORD said to himself, “I will never again curse the ground because of man, for the intention of man’s heart is evil from his youth. And I will never again strike down every living thing as I have done.”
translation:
  language: tl
  text: At naamoy ni Yahweh ang kalugod-lugod na samyo. Sinabi ni Yahweh sa kanyang sarili, “Hindi ko na muling susumpain ang lupa dahil sa tao, sapagkat masama ang hilig ng puso ng tao mula pa sa kanyang kabataan. At hindi ko na muling lilipulin ang lahat ng may buhay gaya ng ginawa ko.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos upang tuwirang katawanin ang tetragrammaton sa tekstong Hebreo.
- source_word: רֵיחַ הַנִּיחֹחַ
  choice: kalugod-lugod na samyo
  rationale: Pinananatili ang ideya ng samyong nagbibigay-lugod o pagtanggap, sa natural at marangal na Tagalog.
- source_word: אֶל־לִבּוֹ
  choice: sa kanyang sarili
  rationale: Idyomatikong katumbas ng literal na ‘sa kanyang puso’; ipinahihiwatig nito ang panloob na pagsasalita nang hindi nagdaragdag ng kausap.
- source_word: יֵצֶר לֵב הָאָדָם
  choice: hilig ng puso ng tao
  rationale: Ang יֵצֶר ay tumutukoy sa pagkahubog, hilig, o panloob na tunguhin; ang ‘hilig’ ay nagpapanatili ng lawak nito nang hindi ito nililimitahan sa isang sadyang balak lamang.
- source_word: מִנְּעֻרָיו
  choice: mula pa sa kanyang kabataan
  rationale: Tuwirang inililipat ang temporal na parirala at pinananatili ang pagtukoy sa tao bilang pangkalahatang uri.
- source_word: לְהַכּוֹת אֶת־כָּל־חַי
  choice: lilipulin ang lahat ng may buhay
  rationale: Sa konteksto ng baha, ang ‘lilipulin’ ay natural na naghahatid ng nakamamatay na diwa ng ‘hampasin,’ habang ang ‘lahat ng may buhay’ ay malapit sa saklaw ng Hebreo.
theological_decisions:
- issue: Dahilan ng hindi na muling pagsumpa sa lupa
  choice: Pinanatili ang ‘sapagkat’ na nag-uugnay sa kasamaan ng puso ng tao sa pangako ng Diyos.
  alternative: Unawain ang parirala bilang dahilan upang sumpain ang lupa o isalin nang mas maluwag upang alisin ang tensiyon.
  rationale: Ang כִּי ay likas na sanhi rito, at mahalagang huwag alisin ang teolohikal na tensiyon na ang parehong kalagayan ng tao ay kaugnay ng banal na pagtitimpi pagkatapos ng baha.
- issue: Saklaw ng pangakong ‘hindi na muli’
  choice: 'Pinanatili ang dalawang magkatulad na pahayag: hindi na muling susumpain ang lupa at hindi na muling lilipulin ang lahat ng may buhay gaya ng ginawa noon.'
  alternative: Palawakin ito bilang pangakong hindi na magkakaroon ng anumang paghatol o pagkawasak.
  rationale: Hindi dapat palawakin ang pangako lampas sa tahasang saklaw at paghahambing ng tekstong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang ‘Yahweh’ bilang malinaw na transliterasyon ng banal na pangalan; pinili ang ‘sa kanyang sarili’ para sa natural na idyoma at ‘hilig ng puso’ upang mapanatili ang lawak ng יֵצֶר.
