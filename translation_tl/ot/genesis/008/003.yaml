base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/003.yaml
  text: And the waters receded from upon the earth[a], going and returning[b], and the waters diminished at the end of a hundred and fifty days.
translation:
  language: tl
  text: At patuloy na[a] umurong ang tubig mula sa ibabaw ng lupa, at nabawasan ang tubig sa pagtatapos ng isandaan at limampung araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “papunta at pabalik,” isang paraan ng pagsasabing patuloy o unti-unting umurong ang tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: umurong
  rationale: Ang שוב ay literal na ‘bumalik,’ ngunit kapag tubig ang paksa at sinusundan ng מֵעַל הָאָרֶץ, inilalarawan nito ang pag-atras o pag-urong ng tubig mula sa lupang natatakpan nito.
- source_word: מֵעַל הָאָרֶץ
  choice: mula sa ibabaw ng lupa
  rationale: 'Pinananatili nito ang tiyak na larawang spatial ng מֵעַל: ang tubig ay umaalis mula sa ibabaw ng lupang dating natatakpan.'
- source_word: הָלוֹךְ וָשׁוֹב
  choice: patuloy na
  rationale: Ang tambalang anyong ito ay nagsasaad ng nagpapatuloy o pasulong na proseso. Likas sa modernong Tagalog ang ‘patuloy na’ at hindi nito ipinahihiwatig na salit-salitang umaabante at umaatras ang tubig.
- source_word: וַיַּחְסְרוּ
  choice: nabawasan
  rationale: Ang חסר ay nagsasaad na naging mas kaunti ang tubig. Naiiba ang ‘nabawasan’ sa naunang ‘umurong,’ kaya napapanatili ang dalawang magkaibang pandiwa ng Hebreo.
- source_word: מִקְצֵה
  choice: sa pagtatapos ng
  rationale: Sa gamit na temporal, tumutukoy ito sa dulo o pagkakumpleto ng itinakdang panahon.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: isandaan at limampung araw
  rationale: Tuwiran at likas na pagpapahayag sa Tagalog ng bilang na 150 araw.
