  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘umurong’ para sa galaw ng tubig at ‘nabawasan’ para sa pagliit ng dami nito; iniwasan ang sobrang literal na pariralang maaaring magpahiwatig ng pabagu-bagong direksiyon.
