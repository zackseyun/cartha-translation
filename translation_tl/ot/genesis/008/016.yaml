  - severity: medium
    issue: Masyadong makitid ang saklaw ng “na kasama mo” sa kasalukuyang ayos.
    rationale: Sa Tagalog, malamang na iugnay ang pariralang ito sa “mga asawa ng iyong mga anak na lalaki” lamang. Mas mainam itong ilagay bago ang talaan upang saklawin ang lahat ng kasama.
