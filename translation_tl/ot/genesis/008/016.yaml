translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang tahasang “ikaw” at ang literal na ugnayang “mga asawa ng iyong mga anak na lalaki.” Ginamit ang “arka,” ang nakagawiang terminong biblikal sa Tagalog.
