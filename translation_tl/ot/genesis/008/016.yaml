translation:
  language: tl
  text: “Lumabas ka sa arka kasama ang iyong asawa, ang iyong mga anak na lalaki, at ang mga asawa ng iyong mga anak na lalaki.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֵא
  choice: Lumabas ka
  rationale: Ang panlalaking isahang pautos ng יצא ay tuwirang nag-uutos kay Noe na umalis mula sa loob. Likas at malinaw sa modernong Tagalog ang “Lumabas ka.”
- source_word: מִן הַתֵּבָה
  choice: sa arka
  rationale: Ipinahihiwatig ng מִן ang pagkilos palabas mula sa arka. Sa Tagalog, ang tambalang “lumabas sa arka” ang natural na paraan upang ipahayag ito; ang תֵּבָה ay ang sasakyang-dagat na kinaroroonan ni Noe at ng kanyang pamilya.
- source_word: אַתָּה
  choice: ikaw
  rationale: Ang hiwalay na panghalip ay tahasang naglalagay kay Noe sa unahan ng talaan at maaaring may bahagyang diin. Pinananatili ito bilang “ikaw.”
- source_word: וְאִשְׁתְּךָ
  choice: ang iyong asawa
  rationale: Sa kontekstong ito, ang אִשָּׁה na may hulaping paari ay malinaw na tumutukoy sa asawa ni Noe.
- source_word: וּבָנֶיךָ
  choice: ang iyong mga anak na lalaki
  rationale: Partikular na tumutukoy ang בָּנִים sa mga anak na lalaki rito, gaya ng pinatutunayan ng kasunod na pagbanggit sa kanilang mga asawa.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: ang mga asawa ng iyong mga anak na lalaki
  rationale: Ito ang tuwiran at natural na salin ng literal na pariralang “mga asawa ng iyong mga anak na lalaki.” Hindi ginamit ang mas maikling “mga manugang na babae” upang mapanatili ang pagkakabuo ng Hebreo.
- source_word: אִתָּךְ
  choice: na kasama mo
  rationale: Ipinahahayag ng אֵת/אִתָּךְ ang pagsama ng buong pangkat kay Noe. Ang “na kasama mo” ay malinaw na inuugnay sa mga taong nakatalang lalabas.
