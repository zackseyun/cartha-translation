  text: Then he sent out the dove from him to see whether the waters had subsided from the surface of the ground[a][b].
translation:
  language: tl
  text: Pagkatapos, pinakawalan niya ang kalapati mula sa piling niya upang tingnan kung humupa na ang tubig mula sa ibabaw ng lupa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nabawasan na.” Ipinahihiwatig ng pandiwang Hebreo na umunti ang tubig-baha.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa ibabaw ng mukha ng lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Pagkatapos, pinakawalan niya
  rationale: Ang wayyiqtol ay nagpapatuloy sa pagkakasunod-sunod ng salaysay. Likas sa konteksto ang “pinakawalan” dahil isang ibon ang pinalabas, samantalang ipinahihiwatig ng “Pagkatapos” ang kasunod na pangyayari.
- source_word: הַיּוֹנָה
  choice: ang kalapati
  rationale: Ang יוֹנָה ay tumutukoy sa kalapati o batu-bato; “kalapati” ang karaniwan at angkop na katawagan sa salaysay ng baha.
- source_word: מֵאִתּוֹ
  choice: mula sa piling niya
  rationale: Pinananatili nito ang diwa ng paglayo mula sa kinaroroonan o presensiya ni Noe, nang hindi ipinapalit ang mas interpretatibong “mula sa arka.”
- source_word: לִרְאוֹת
  choice: upang tingnan
  rationale: Ang infinitive ng ראה ay nagpapahayag ng layunin. Ang “upang tingnan” ay tuwiran at natural sa modernong Tagalog.
- source_word: הֲקַלּוּ
  choice: humupa na
  rationale: Sa kontekstong ito, ang קלל ay nagsasaad na nabawasan o humina ang tubig-baha. Ang “humupa” ang natural na salita sa Tagalog para sa pagbaba o pag-unti ng baha.
- source_word: הַמַּיִם
  choice: ang tubig
  rationale: Bagaman anyong maramihan sa Hebreo, ang “tubig” ay mass noun sa natural na Tagalog at malinaw na tumutukoy sa tubig-baha.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: sa ibabaw ng lupa
  rationale: Malinaw at likas nitong inilalarawan ang tubig na nasa ibabaw ng lupain; ang אֲדָמָה rito ay lupa o lupain, hindi ang planetang daigdig.
