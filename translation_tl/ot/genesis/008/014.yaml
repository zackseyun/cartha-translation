base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/014.yaml
  text: And in the second month[a], on the twenty-seventh day of the month, the earth was dry.
translation:
  language: tl
  text: At noong ika-dalawampu't pitong araw ng ikalawang buwan, tuyo na ang lupa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang daigdig” o “ang lupain.” Ang salitang Hebreo na אֶרֶץ ay maaaring tumukoy sa daigdig, lupain, o lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשֵּׁנִי
  choice: At ... ng ikalawang buwan
  rationale: Ang וּבַ ay nag-uugnay sa kasunod na pahayag ng panahon, at ang הַשֵּׁנִי ay tumutukoy sa ikalawang buwan. Likas sa modernong Tagalog ang ayos na ginamit sa buong petsa.
- source_word: בְּשִׁבְעָה וְעֶשְׂרִים יוֹם לַחֹדֶשׁ
  choice: nang ikadalawampu't pitong araw
  rationale: Karaniwang pormula ito ng petsa sa Hebreo. Ang ordinal na anyo ay natural at malinaw sa Tagalog; naipahihiwatig na ng pariralang “ng ikalawang buwan” kung aling buwan ang tinutukoy.
- source_word: יָבְשָׁה
  choice: tuyo na
  rationale: Ang Qal perfect na pambabaeng isahan ay naglalarawan sa kalagayang naabot sa puntong ito ng salaysay. Ipinahahayag ng “tuyo na” ang resultang kalagayan nang hindi labis na binibigyang-diin ang proseso.
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Maaaring mangahulugan ang אֶרֶץ ng buong daigdig, lupain, o lupa. Ang “lupa” ay natural sa Tagalog at naaangkop sa bagay na natuyo, habang pinananatili sa talababa ang mas malawak na posibleng kahulugan.
theological_decisions:
- issue: Saklaw ng הָאָרֶץ sa salaysay ng baha
  choice: ang lupa
  alternative: ang daigdig / ang lupain
  rationale: Hindi tiyak sa mismong salita kung ang tinutukoy ay buong daigdig, isang lupain, o ibabaw ng lupa. Hindi ito dapat gawing tiyak sa salin; kaya ginamit ang natural na “lupa” at inilagay sa talababa ang tunay na leksikal na saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Pinanatili ang ugnayang pasalaysay sa “At,” at iniwasan ang lipas na ayos ng pagbibilang.
