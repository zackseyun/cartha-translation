base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/020.yaml
  text: Then Noah built an altar to Yahweh[a], and took some of every clean animal and of every clean bird[b], and offered burnt offerings on the altar.
translation:
  language: tl
  text: Pagkatapos, nagtayo si Noe ng isang altar para kay Yahweh. Kumuha siya ng ilan mula sa bawat uri ng malinis na hayop at mula sa bawat uri ng malinis na ibon, at naghandog siya ng mga handog na sinusunog nang buo sa altar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: nagtayo
  rationale: Likas at tuwirang salin ng בנה sa konteksto ng pagtatayo ng altar.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Karaniwang makabagong terminong Filipino para sa dakong pinaghahandugan.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang personal na pangalang יהוה; ipinahihiwatig ng para kay ang pag-aalay at pagtatalaga ng altar kay Yahweh.
- source_word: מִכֹּל
  choice: mula sa bawat uri ng
  rationale: Pinananatili ang partitive na diwa ng Hebrew at nililinaw na kumuha si Noe ng mga kinatawan mula sa bawat malinis na kategorya, hindi ang bawat indibidwal.
- source_word: הַבְּהֵמָה הַטְּהוֹרָה
  choice: malinis na hayop
  rationale: Ang malinis ay maikli at nakaugaliang katawagan para sa ritwal na katanggap-tanggap; ang hayop ay hindi labis na naglilimita sa kategorya.
- source_word: הָעוֹף הַטָּהֹר
  choice: malinis na ibon
  rationale: Sa konteksto ng paghahandog, ibon ang natural at sapat na tiyak na salin ng עוף.
- source_word: וַיַּעַל עֹלֹת
  choice: naghandog siya ng mga handog na sinusunog
  rationale: Ang Hiphil ng עלה kasama ng עֹלֹת ay idyomang pangsakripisyo; ipinahahayag ng salin ang paghahandog at ang uri ng handog nang malinaw.
- source_word: בַּמִּזְבֵּחַ
  choice: sa altar
  rationale: Natural na lokatibong parirala sa Filipino para sa paghahandog sa ibabaw ng altar.
theological_decisions:
- issue: Pagbibigay-salin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng Yahweh ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Partitive na diwa ng pagpili ni Noe
  choice: mula sa bawat uri ng malinis na hayop at ... ibon
  alternative: mula sa bawat malinis na hayop at ... ibon
  rationale: Ang Hebrew ay literal na 'mula sa bawat,' ngunit sa konteksto ay mga kinatawan mula sa bawat kategorya ang kinuha. Ang pagdaragdag ng uri ay natural sa Filipino at umiiwas sa maling pahiwatig na inihandog ang lahat ng malilinis na nilalang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pagkatapos” bilang likas na pang-ugnay sa salaysay. Hindi nilagyan ng talababa sapagkat ang mga kinakailangang paglilinaw ay naipahayag nang maikli sa pangunahing teksto.
