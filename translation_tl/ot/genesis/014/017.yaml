base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/017.yaml
  text: Then the king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him[a], to the Valley of Shaveh (that is[b], the King's Valley).
translation:
  language: tl
  text: Pagkabalik ni Abram matapos niyang talunin si Kedorlaomer at ang mga haring kasama nito, lumabas ang hari ng Sodoma upang salubungin siya sa Lambak ng Shawe (iyon ang Lambak ng Hari).
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Isinasalaysay nito ang sumunod na pangyayari; natural sa Filipino ang pandiwang “lumabas” nang hindi na kailangang tumbasan nang hiwalay ang waw-consecutive.
- source_word: מֶלֶךְ סְדֹם
  choice: ang hari ng Sodoma
  rationale: Tuwirang isinasalin ang construct chain, at ginagamit ang karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: לִקְרָאתוֹ
  choice: upang salubungin siya
  rationale: Ang “salubungin” ang likas na katumbas kapag may lumalabas upang makipagtagpo sa isang dumarating.
- source_word: אַחֲרֵי שׁוּבוֹ מֵהַכּוֹת
  choice: Pagkabalik ni Abram matapos niyang talunin
  rationale: Ipinahahayag ang pagbabalik kasunod ng tagumpay sa digmaan sa natural na Filipino. Tinukoy si Abram ayon sa malinaw na konteksto ng naunang talata upang maiwasang mapagkamalang hari ng Sodoma ang gumawa ng pagtalo.
- source_word: כְּדָרלָעֹמֶר
  choice: Kedorlaomer
  rationale: Malapit na transliterasyon ito ng pangalang Hebreo at hindi umaasa sa tradisyonal na baybay sa Ingles.
- source_word: וְאֶת הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: at ang mga haring kasama nito
  rationale: Ang panghalip ay tumutukoy kay Kedorlaomer; ginagamit ang “nito” upang malinaw na maiba siya kay Abram sa pangungusap.
- source_word: אֶל עֵמֶק שָׁוֵה
  choice: sa Lambak ng Shawe
  rationale: Sa Filipino, ang “sa” ay natural na nagpapahayag ng patutunguhan o lugar ng pagsalubong, habang ang Shawe ay pinananatiling pangalan ng pook.
- source_word: הוּא עֵמֶק הַמֶּלֶךְ
  choice: na tinatawag ding Lambak ng Hari
  rationale: Natural na ipinahahayag nito ang pagkakakilanlan ng Lambak ng Shawe at ng Lambak ng Hari nang hindi ipinapalagay na literal na kahulugan ng pangalang Shawe ang kasunod na katawagan.
