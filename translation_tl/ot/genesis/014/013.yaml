  register: Makabago, malinaw, at marangal na Tagalog ang ginamit. Iniwasan ang sobrang teknikal na katawagan sa pangunahing teksto, ngunit pinanatili sa mga talababa ang kawalang-katiyakan tungkol sa uri ng punongkahoy, ang lawak ng kahulugang pampamilya, at ang literal na larawang pangtipan.
