base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/013.yaml
  text: Then a fugitive came and told Abram the Hebrew[a]. Now he was dwelling by the oaks of Mamre the Amorite, brother of Eshcol and brother of Aner[c][b]; these were allies of Abram.
translation:
  language: tl
  text: Pagkatapos, dumating ang isang taong nakatakas at nagbalita kay Abram na Hebreo. Si Abram ay naninirahan noon sa tabi ng malalaking punongkahoy[a] ni Mamre na Amoreo, na kapatid[b] nina Escol at Aner. Sina Mamre, Escol, at Aner ay mga kapanalig[c] ni Abram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga encina” o “mga terebinto.” Ang salitang Hebreo ay tumutukoy sa malalaking punongkahoy, ngunit hindi tiyak ang eksaktong uri.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kamag-anak nina Escol at Aner.” Ang salitang Hebreo para sa “kapatid” ay maaari ring tumukoy sa mas malawak na ugnayang pampamilya.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “mga may-ari ng isang tipan” kay Abram—mga lalaking nakatali sa kaniya sa pamamagitan ng kasunduan o alyansa.
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּלִיט
  choice: isang taong nakatakas
  rationale: Tumutukoy ito sa isang taong nakaligtas sa panganib o labanan sa pamamagitan ng pagtakas. Likas at malinaw sa modernong Tagalog ang pariralang ito, at hindi nito nililimitahan ang kahulugan sa basta nakaligtas lamang.
- source_word: וַיַּגֵּד
  choice: nagbalita
  rationale: Ipinahihiwatig ng pandiwa ang pagsasabi o pag-uulat ng nangyari. Ang “nagbalita kay Abram” ay natural sa salaysay kahit hindi tahasang binabanggit sa Hebreo ang layon ng ibinalita.
- source_word: הָעִבְרִי
  choice: na Hebreo
  rationale: Pinananatili nito ang etniko o panlipunang katawagan kay Abram nang hindi ito binibigyan ng dagdag na paliwanag na wala sa talata.
- source_word: שֹׁכֵן
  choice: naninirahan
  rationale: Ang participle ay nagpapakita ng nagpapatuloy na paninirahan ni Abram nang panahong iyon. Nilinaw ang pangalang “si Abram” sa ikalawang pangungusap upang maiwasan ang malabong reperensiya ng panghalip sa Tagalog.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: sa tabi ng malalaking punongkahoy ni Mamre
  rationale: Hindi tiyak ang eksaktong uri ng punong tinutukoy ng אֵלוֹן. Ang pangkalahatang salin ay likas sa Tagalog at pinananatili ang leksikal na kalabuan; nasa talababa ang karaniwang mga espesipikong pagbasa.
- source_word: הָאֱמֹרִי
  choice: na Amoreo
  rationale: Direktang pinananatili ang etnikong katawagang naglalarawan kay Mamre.
- source_word: אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר
  choice: na kapatid nina Escol at Aner
  rationale: Ang “kapatid” ang tuwirang katumbas ng אָח, habang ang posibleng mas malawak na kahulugang kamag-anak ay pinananatili sa talababa. Ang “nina” ay natural na pinagsasama ang dalawang pangalan sa Tagalog.
- source_word: בַּעֲלֵי בְרִית
  choice: mga kapanalig
  rationale: Ang idyoma ay literal na tumutukoy sa mga taong may tipan kay Abram, ibig sabihin, nakatali sa kaniya sa isang kasunduan o alyansa. Malinaw at natural itong ipinahahayag ng “mga kapanalig,” habang nasa talababa ang literal at kultural na diwa.
