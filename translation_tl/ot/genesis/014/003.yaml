lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: silang lahat
  rationale: Natural na kolektibong pahayag sa Tagalog na hindi nagdaragdag ng pangngalang “mga hari,” bagaman malinaw iyon sa konteksto.
- source_word: חָבְרוּ
  choice: Nagsama-sama
  rationale: Ipinapahayag ang batayang diwa ng pagsasama o pagtitipon nang hindi ipinapalagay ang mas tiyak na kahulugang “nakipag-alyansa.”
- source_word: אֶל
  choice: sa
  rationale: Sa konteksto ng pandiwa ng pagtitipon, natural na ipinakikita ng “sa” ang lugar kung saan sila nagsama-sama.
- source_word: עֵמֶק הַשִּׂדִּים
  choice: Lambak ng Sidim
  rationale: Ang עֵמֶק ay “lambak,” at ang Sidim ay pinanatili bilang transliteradong pangalan ng lugar.
- source_word: הוּא
  choice: iyon ay
  rationale: Malinaw na naghahatid ng paliwanag o pagkakakilanlan sa naunang pangalan ng lugar.
- source_word: יָם הַמֶּלַח
  choice: ang Dagat na Maalat
  rationale: Tuwirang pinananatili ang kahulugan ng Hebreong pangalan habang gumagamit ng likas na ayos ng salita sa Tagalog.
