  text: וַ/יָּ֕שֶׁב אֵ֖ת כָּל הָ/רְכֻ֑שׁ וְ/גַם֩ אֶת ל֨וֹט אָחִ֤י/ו וּ/רְכֻשׁ/וֹ֙ הֵשִׁ֔יב וְ/גַ֥ם אֶת הַ/נָּשִׁ֖ים וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/016.yaml
  text: He brought back all the possessions[a]; he also brought back Lot his kinsman, and his possessions[d][c][b], and also the women and the people.
translation:
  language: tl
  text: Ibinalik niya ang lahat ng ari-arian; ibinalik din niya ang kamag-anak niyang si Lot[a] at ang mga ari-arian nito, gayundin ang mga babae at ang mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kapatid niya.” Maaari ring gamitin ang “kapatid” sa mas malawak na diwa para sa isang malapit na kamag-anak; pamangkin ni Abram si Lot ayon sa salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב / הֵשִׁיב
  choice: ibinalik
  rationale: Ang dalawang anyo ng שוב sa Hiphil ay nangangahulugang pinabalik o dinalang muli ang mga nabawing tao at ari-arian. Ang “ibinalik” ay natural sa Filipino at pinananatili ang pag-uulit ng pandiwa sa Hebreo.
- source_word: כָּל הָרְכֻשׁ / וּרְכֻשׁוֹ
  choice: lahat ng ari-arian / mga ari-arian nito
  rationale: Ang רְכוּשׁ ay tumutukoy sa mga pag-aari o kayamanang maaaring dalhin. Malawak at karaniwang salin ang “ari-arian,” at iniuugnay ng hulaping panghalip sa ikalawang paglitaw ang mga iyon kay Lot.
- source_word: וְגַם
  choice: din / gayundin
  rationale: Pinananatili ng dalawang pananalita ang paulit-ulit na diwang pandagdag ng וְגַם nang hindi nagiging mabigat sa modernong Filipino.
- source_word: לוֹט אָחִיו
  choice: ang kamag-anak niyang si Lot
  rationale: Bagaman ang אָח ay literal na “kapatid,” maaari itong tumukoy sa mas malawak na ugnayang pampamilya. Ayon sa salaysay, pamangkin ni Abram si Lot, kaya tumpak at natural ang “kamag-anak.”
- source_word: הַנָּשִׁים
  choice: ang mga babae
  rationale: Mas malawak ang kahulugan ng נָשִׁים kaysa “mga asawa”; hindi ito dapat paliitin nang walang tahasang batayan sa talata.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Ang עָם ay kolektibong tumutukoy sa mga taong nabawi at hindi lamang sa mga lalaki.
