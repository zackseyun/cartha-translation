  text: וּ/מַלְכִּי צֶ֨דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָ/יָ֑יִן וְ/ה֥וּא כֹהֵ֖ן לְ/אֵ֥ל עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/018.yaml
  text: And Melchizedek king of Salem brought out bread and wine[b][a]. He was a priest of God Most High.
translation:
  language: tl
  text: At si Melkisedek, na hari ng Salem, ay naglabas ng tinapay at alak.[a] Siya ay pari ng Diyos na Kataas-taasan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagdala ng tinapay at alak.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, El Elyon, ibig sabihin, “Diyos na Kataas-taasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִּי צֶדֶק
  choice: Melkisedek
  rationale: Itinumbas bilang pangalan sa paraang malapit sa anyong Hebreo, sa halip na isalin ang posibleng kahulugan ng pangalan.
- source_word: מֶלֶךְ שָׁלֵם
  choice: hari ng Salem
  rationale: Tuwirang isinasalin ang titulong מֶלֶךְ at pinananatiling pangalan ng lugar ang שָׁלֵם.
- source_word: הוֹצִיא
  choice: naglabas
  rationale: Ipinahahayag nito ang causative na diwa ng pandiwa—ang pagpapalabas o paglalabas ng isang bagay—habang nananatiling natural sa Filipino sa konteksto ng paglalabas ng pagkain at inumin.
- source_word: לֶחֶם וָיָיִן
  choice: tinapay at alak
  rationale: Tuwiran at karaniwang katumbas ng dalawang pangngalan; walang idinagdag na sakramental na pagpapakahulugan.
- source_word: כֹהֵן
  choice: pari
  rationale: Karaniwang katawagan sa isang tagapangasiwa ng gawaing panrelihiyon, nang hindi ipinapalagay ang mas huling kaayusang pari ng Israel.
- source_word: אֵל עֶלְיוֹן
  choice: Kataas-taasang Diyos
  rationale: Isinasalin ang banal na katawagan upang maging malinaw sa mambabasang Filipino; ipinahahayag ng “Kataas-taasan” ang superlatibong diwa ng עֶלְיוֹן.
- source_word: וְהוּא
  choice: Siya ay
  rationale: Ginawang bagong pangungusap upang malinaw at natural na ipakilala ang tungkulin ni Melkisedek bilang pari.
theological_decisions:
- issue: Kung dapat bang ipahiwatig ng tinapay at alak ang isang mas huling sakramental na kahulugan
  choice: Pinanatili ang payak na salaysay na naglabas siya ng tinapay at alak.
  alternative: Gumamit ng pananalitang hayagang nagpapahiwatig ng Eukaristiya o Banal na Hapunan.
  rationale: Hindi tahasang ibinibigay ng Genesis 14:18 ang gayong paliwanag; kaya hindi ito idinagdag sa salin.
- issue: Kung ituturing na di-isinaling pangalan ang אֵל עֶלְיוֹן o isasalin bilang banal na titulo
  choice: Kataas-taasang Diyos
  alternative: El Elyon
  rationale: Maaaring maunawaan ang parirala bilang banal na katawagan o titulo. Ang pagsasalin nito ay nagpapanatili ng kahulugan at mas malinaw sa karaniwang mambabasa, habang itinatala sa talababa ang anyong Hebreo.
- issue: Kung ang כֹהֵן ay dapat tukuying “isang pari” o payak na “pari”
  choice: Siya ay pari ng Kataas-taasang Diyos.
  alternative: Siya ay isang pari ng Kataas-taasang Diyos.
  rationale: Walang tiyak na pantukoy sa pariralang Hebreo, at natural sa Filipino ang panaguring “pari” nang hindi nilulutas kung isa lamang siya sa maraming pari.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na ayos ng salaysay at iniwasan ang lumang pananalita at ang pagdaragdag ng doktrinang hindi tahasang nasa talata.
