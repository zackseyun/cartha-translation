base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/004.yaml
  text: For twelve years they had served Kedorlaomer[a], but in the thirteenth year they rebelled.
translation:
  language: tl
  text: Sa loob ng labindalawang taon ay naglingkod sila kay Kedorlaomer, ngunit sa ikalabintatlong taon ay naghimagsik sila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Sa loob ng labindalawang taon
  rationale: Ipinahahayag ng parirala ang haba ng panahon. Likas sa makabagong Tagalog ang “sa loob ng” upang malinaw na ipakita ang tagal.
- source_word: עָבְדוּ
  choice: naglingkod sila
  rationale: Ang pandiwang עבד ay nangangahulugang “maglingkod.” Sa konteksto, tumutukoy ito sa paglilingkod o pagpapasakop ng mga nasasakupang hari sa isang makapangyarihang hari; pinananatili ng “naglingkod” ang lawak ng orihinal na salita.
- source_word: כְּדָרְלָעֹמֶר
  choice: Kedorlaomer
  rationale: Tuwirang transliterasyon ito ng pangalang Hebreo sa baybay na madaling basahin sa Filipino.
- source_word: וּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: ngunit nang ikalabintatlong taon
  rationale: Bagaman anyong kardinal ang Hebreo, ipinakikita ng pagkakasunod ng salaysay na sa ika-13 taon naganap ang paghihimagsik. Ipinahahayag ng “ngunit” ang malinaw na pagbaligtad mula sa paglilingkod tungo sa paghihimagsik.
- source_word: מָרָדוּ
  choice: naghimagsik sila
  rationale: Ang מרד ay tumutukoy sa pagrerebelde laban sa namumuno. Ang “naghimagsik” ay natural at angkop sa pampolitika at pangmilitar na konteksto.
