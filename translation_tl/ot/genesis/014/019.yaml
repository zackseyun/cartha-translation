  source_fidelity: Tapat ang salin sa Hebreo. Naipapahayag ng “At binasbasan niya siya at sinabi” ang magkakasunod na wayyiqtol, at ang “Pagpalain nawa si Abram ng Diyos na Kataas-taasan” ay angkop na pormula ng pagpapala para sa בָּרוּךְ at לְאֵל. Ang “May-ari ng langit at lupa” ay wastong pangunahing pagsasalin ng קֹנֵה nang hindi pinipilit ang kahulugang “Maylikha.”
  naturalness: Natural at marangal ang modernong Tagalog. Ang “binasbasan” para sa kilos ng tagapagsalita at “Pagpalain nawa” sa tuwirang pormula ay malinaw at idiomatiko. Ang pag-uugnay ng “ang May-ari” sa “Diyos na Kataas-taasan” ay maayos.
  terminology: Wasto at pare-pareho ang “Abram,” “Diyos na Kataas-taasan,” at “langit at lupa.” Ang kapitalisadong “May-ari” ay gumaganap nang angkop bilang bahagi ng banal na titulo. Nananatiling bukas sa talababa ang posibleng “Maylikha,” kaya hindi nilulutas nang lampas sa ebidensiya ang saklaw ng קֹנֵה.
