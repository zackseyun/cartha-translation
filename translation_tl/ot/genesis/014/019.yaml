base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/019.yaml
  text: And he blessed him and said[a], “Blessed be Abram by God Most High[b], possessor of heaven and earth.”
translation:
  language: tl
  text: At binasbasan niya siya at sinabi, “Pagpalain nawa si Abram ng Diyos na Kataas-taasan, ang May-ari[a] ng langit at lupa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Maylikha.” Maaaring mangahulugan ang Hebreong participle na “may-ari,” “nagmamay-ari,” o, ayon sa konteksto, “maylikha.”
    reason: lexical_alternative
  - marker: b
    text: O “ng mga langit at ng lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: At binasbasan niya siya
  rationale: Ang wayyiqtol na may hulaping tumutukoy sa ikatlong panauhang panlalaki ay nagsasaad ng kasunod na kilos sa salaysay. Pinananatili ng “At” ang daloy ng Hebreo, at malinaw na ipinahahayag ng “binasbasan niya siya” ang kilos at layon nito.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Karaniwang pambungad ito sa tuwirang pananalita at pinananatili ang pagkakaugnay ng dalawang kilos sa Hebreo.
- source_word: בָּרוּךְ
  choice: Pagpalain nawa
  rationale: Ang passive participle ay ginagamit bilang pormula ng pagpapala. Likas at marangal sa modernong Tagalog ang “Pagpalain nawa,” at naipapakita nito ang lakas ng isang pagpapahayag ng basbas.
- source_word: אַבְרָם
  choice: Abram
  rationale: Pinananatili ang pangalang Abram dahil hindi pa ito napapalitan ng Abraham sa bahaging ito ng Genesis.
- source_word: לְאֵל
  choice: ng Diyos
  rationale: Sa pormula ng pagpapala, maaaring ipakita ng לְ ang kaugnayan sa pinagmumulan ng pagpapala. Ang “ng Diyos” ay natural sa Tagalog at nagpapakitang ang Diyos ang nagpapala kay Abram.
- source_word: אֵל עֶלְיוֹן
  choice: Diyos na Kataas-taasan
  rationale: Pinananatili nito ang banal na titulong binubuo ng pangngalan at panuring, sa paraang natural at pamilyar sa Tagalog.
- source_word: קֹנֵה
  choice: May-ari
  rationale: Maaaring mangahulugan ang participle ng קנה na nagmamay-ari, nagtatamo, o—sa ilang konteksto—lumilikha. Ang “May-ari” ay nagpapanatili sa pangunahing diwa ng pag-aari nang hindi isinasara ang posibilidad na “Maylikha,” na inilalagay sa talababa.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: langit at lupa
  rationale: Ito ang natural na Tagalog na merismo para sa kabuuan ng sangnilikha. Nasa anyong maramihan ang salitang Hebreo para sa langit, kaya itinatala sa talababa ang mas literal na alternatibo.
theological_decisions:
- issue: Saklaw ng kahulugan ng קֹנֵה sa banal na titulo
  choice: ang May-ari ng langit at lupa
  alternative: ang Maylikha ng langit at lupa
  rationale: Maaaring tumukoy ang קנה sa pag-aari o pagtatamo at, sa ilang konteksto, sa paglikha. Pinipili ng pangunahing teksto ang “May-ari” upang mapanatili ang leksikal na lawak ng salita, habang inilalahad sa talababa ang karaniwang pagbasa na “Maylikha” sa halip na tahimik na lutasin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “binasbasan” para sa kilos ng pagbibigay ng basbas at ang “Pagpalain nawa” para sa pormula ng pagpapala. Inilagay ang mga pananda ng talababa sa mismong mga pariralang tinutukoy ng mga ito.
