  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ֠/יָּשֻׁבוּ וַ/יָּבֹ֜אוּ אֶל עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַ/יַּכּ֕וּ אֶֽת כָּל שְׂדֵ֖ה הָ/עֲמָלֵקִ֑י וְ/גַם֙ אֶת הָ֣/אֱמֹרִ֔י הַ/יֹּשֵׁ֖ב בְּ/חַֽצְצֹ֥ן תָּמָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/007.yaml
  text: Then they turned back and came to En-mishpat (that is[a], Kadesh), and struck all the country of the Amalekites[c][b], and also the Amorites who were living in Hazazon-tamar.
translation:
  language: tl
  text: Pagkatapos, bumalik sila at dumating sa En-mispat[a] (na siyang Kades), at sinalakay nila ang buong lupain ng mga Amalekita[b], pati ang mga Amoreo na naninirahan sa Hazazon-tamar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang En-mispat ay nangangahulugang “bukal ng paghatol.”
    reason: cultural_note
  - marker: b
    text: O “ang buong parang ng Amalekita.” Literal na ganito ang Hebreo, ngunit malamang na tinutukoy nito ang rehiyong tinitirhan ng mga Amalekita.
    reason: lexical_alternative
  - marker: c
    text: Ang Hazazon-tamar ay tinutukoy bilang En-gedi sa 2 Cronica 20:2.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Pagkatapos, bumalik sila
  rationale: Ipinahihiwatig ng anyong pasalaysay ang kasunod na kilos; likas sa modernong Tagalog ang “Pagkatapos,” at pinananatili ng “bumalik” ang diwa ng שוב.
- source_word: וַיָּבֹאוּ אֶל
  choice: at dumating sa
  rationale: Ang בוא na may אֶל ay tumutukoy sa pagdating sa isang pook; mas malinaw dito ang “dumating sa” kaysa “pumunta sa.”
- source_word: עֵין מִשְׁפָּט
  choice: En-mispat
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa baybay na madaling basahin sa Filipino sa halip na isalin sa pangunahing teksto.
- source_word: הִוא קָדֵשׁ
  choice: (na siyang Kades)
  rationale: Ipinakikilala ng parirala ang En-mispat bilang Kades; pinananatili ng panaklong ang paliwanag na nasa Hebreo.
- source_word: וַיַּכּוּ
  choice: at sinalakay nila
  rationale: Malawak ang saklaw ng נכה—humampas, sumalakay, o lumupig. Ang “sinalakay” ay natural at hindi tiyak na nagpapahiwatig ng ganap na pagkalupig.
- source_word: כָּל שְׂדֵה הָעֲמָלֵקִי
  choice: ang buong lupain ng mga Amalekita
  rationale: Bagaman literal na “buong parang/bukid ng Amalekita,” tumutukoy rito ang שׂדה sa rehiyon o lupaing inuugnay sa pangkat; natural sa Filipino ang kolektibong “mga Amalekita.”
- source_word: וְגַם אֶת הָאֱמֹרִי
  choice: pati ang mga Amoreo
  rationale: Ang “pati” ay malinaw na nagdadagdag ng isa pang pangkat na sinalakay; ang pang-uring gentiliko na isahan sa Hebreo ay kolektibo at likas na maramihan sa Filipino.
- source_word: הַיֹּשֵׁב בְּחַצְצֹן תָּמָר
  choice: na naninirahan sa Hazazon-tamar
  rationale: Ang participle ay naglalarawan sa mga Amoreo bilang mga naninirahan doon; ang “naninirahan” ay kasalukuyan, natural, at marangal na Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may dignidad at madaling maunawaan. Ginamit ang mga anyong pangalang En-mispat, Kades, Amalekita, at Amoreo na angkop sa bigkas at baybay sa Filipino. Inilagay ang mga pananda ng talababa sa mismong bahaging kanilang nililinaw.
