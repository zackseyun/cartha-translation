  text: Then they took all the possessions of Sodom and Gomorrah[a], and all their food, and went away.
translation:
  language: tl
  text: Kinuha nila ang lahat ng ari-arian ng Sodoma at Gomorra, at ang lahat ng kanilang pagkain[a], at umalis sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kanilang mga panustos.” Ang salitang Hebreo ay maaaring tumukoy sa pagkain sa pangkalahatan o sa mga panustos para sa paglalakbay o pakikidigma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Kinuha nila
  rationale: Karaniwang pasalaysay na anyo ng לָקַח; tuwirang ipinapahayag ang pagkuha ng mga ari-arian at pagkain nang hindi dinaragdagan ang diwang tulad ng “sinamsam.”
- source_word: כָּל רְכֻשׁ
  choice: lahat ng ari-arian
  rationale: Ang רְכוּשׁ ay tumutukoy sa mga pag-aari o kayamanang maaaring tangayin; malawak at natural sa Filipino ang “ari-arian.”
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sodoma at Gomorra
  rationale: Ginamit ang nakaugaliang anyo ng mga pangalang ito sa modernong Filipino.
- source_word: וְאֶת כָּל אָכְלָם
  choice: pati ang lahat ng kanilang pagkain[a]
  rationale: Pinananatili ng “lahat” ang inuulit na כָּל, at tuwirang isinasalin ng “kanilang pagkain” ang pangngalan na may hulaping pangmaramihang tagapagmay-ari. Inilagay ang talababa sa salitang may leksikal na alternatibo.
- source_word: וַיֵּלֵכוּ
  choice: at saka sila umalis
  rationale: Sa konteksto, ang הָלַךְ ay nagsasaad na umalis sila matapos kunin ang samsam; natural na daloy sa Filipino ang “at saka sila umalis.”
