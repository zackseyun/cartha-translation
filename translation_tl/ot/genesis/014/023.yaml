base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/023.yaml
  text: that I would not take from a thread to a sandal strap[a], or anything that is yours, lest you say, ‘I have made Abram rich.’
translation:
  language: tl
  text: na hindi ako kukuha ng anuman, mula sa isang sinulid hanggang sa tali ng sandalyas[a], ni ng anumang pag-aari mo, upang hindi mo masabi, ‘Ako ang nagpayaman kay Abram.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gumagamit ang Hebreo ng eliptikong pormula ng panunumpa; literal: “kung mula sa isang sinulid hanggang sa tali ng sandalyas, at kung kukuha ako ng anumang pag-aari mo...” Ang diwa nito ay isang sinumpaang pagtanggi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: na hindi ako kukuha ... ni
  rationale: Sa konteksto ng panunumpa sa talata 22, ang אִם ay bahagi ng eliptikong pormula ng panunumpa at nagpapahayag ng mariing pagtanggi, hindi karaniwang kondisyon.
- source_word: מִחוּט
  choice: kahit isang sinulid
  rationale: Ang חוּט ay sinulid o pisi; ipinahahayag ng “kahit isang” ang pinakamaliit na bagay na ayaw kunin ni Abram.
- source_word: וְעַד שְׂרֹוךְ נַעַל
  choice: o tali ng sandalyas
  rationale: Ang שְׂרוֹךְ נַעַל ay tali o panali ng sinaunang sandalyas. Likas sa modernong Filipino ang “tali ng sandalyas.”
- source_word: אֶקַּח
  choice: ako kukuha
  rationale: Ang pandiwa ay nasa unang panauhan; sa pormula ng panunumpa, ang hinaharap na anyo kasama ng tahasang pagtanggi ang likas na salin sa Filipino.
- source_word: מִכָּל אֲשֶׁר לָךְ
  choice: anumang pag-aari mo
  rationale: Pinananatili nito ang malawak na saklaw ng כָּל at ang diwa ng pagmamay-ari.
- source_word: וְלֹא תֹאמַר
  choice: upang hindi mo masabi
  rationale: Malinaw nitong ipinahahayag ang negatibong layunin o bunga ng pagtanggi ni Abram.
- source_word: הֶעֱשַׁרְתִּי
  choice: nagpayaman
  rationale: Ang Hiphil ng עשר ay nangangahulugang gawing mayaman o payamanin.
- source_word: אַבְרָם
  choice: Abram
  rationale: Ginamit ang nakaugaliang transliterasyon ng personal na pangalan.
theological_decisions:
- issue: Eliptikong pormula ng panunumpa
  choice: 'Isinalin bilang tahasang sinumpaang pagtanggi: “na hindi ako kukuha...”'
  alternative: 'Literal na kondisyon: “kung mula sa isang sinulid ... at kung kukuha ako...”'
  rationale: Kasunod ito ng pagtataas ni Abram ng kamay sa talata 22. Sa Hebreo, hindi binibigkas ang kapahamakang kaakibat ng panunumpa; ang diwa ay mariing hindi siya kukuha ng anuman. Nililinaw ito ng salin nang hindi nagdaragdag ng tiyak na sumpang wala sa teksto.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang “kahit isang sinulid o tali ng sandalyas” bilang likas na pagpapahayag ng saklaw ng maliliit at mumunting bagay, habang pinanatili sa talababa ang literal at sadyang eliptikong anyo ng Hebreo.
