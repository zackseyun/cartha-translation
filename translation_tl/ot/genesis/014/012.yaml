  yaml_path: translation/ot/genesis/014/012.yaml
  text: They took Lot[a], Abram’s nephew, and his possessions, and went away[b]. Now he was dwelling in Sodom.
translation:
  language: tl
  text: Kinuha nila si Lot[a], na pamangkin ni Abram, pati ang mga ari-arian niya, at umalis sila.[b] Noon ay naninirahan si Lot sa Sodoma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “anak ng kapatid ni Abram”; ibig sabihin, pamangkin ni Abram si Lot.
    reason: lexical_alternative
  - marker: b
    text: 'Literal na ayos sa Hebreo: “Kinuha nila si Lot at ang mga ari-arian niya—si Lot ay anak ng kapatid ni Abram—at umalis sila.”'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Kinuha nila
  rationale: Karaniwang kahulugan ng Qal wayyiqtol ng לקח ang “kinuha.” Bagaman binihag si Lot sa konteksto ng digmaan, hindi pinalakas ang salin tungo sa “binihag,” sapagkat hindi iyon tahasang ipinahahayag ng pandiwa.
- source_word: רְכֻשׁוֹ
  choice: ang mga ari-arian niya
  rationale: Ang רְכוּשׁ ay tumutukoy sa mga pag-aari o ari-ariang maaaring dalhin. Likas at malinaw sa makabagong Filipino ang “mga ari-arian niya.”
- source_word: בֶּן אֲחִי אַבְרָם
  choice: na pamangkin ni Abram
  rationale: Literal itong “anak ng kapatid ni Abram.” Ang “pamangkin ni Abram” ang natural na katumbas sa Filipino, habang pinananatili sa talababa ang eksaktong anyo ng ugnayang pampamilya sa Hebreo.
- source_word: וַיֵּלֵכוּ
  choice: at umalis sila
  rationale: Ang הלך ay karaniwang “pumunta” o “lumakad,” ngunit sa kontekstong dinala na nila ang tao at mga ari-arian mula sa lugar, malinaw at natural ang “umalis sila.”
- source_word: וְהוּא יֹשֵׁב בִּסְדֹם
  choice: Noon ay naninirahan si Lot sa Sodoma
  rationale: Nagbibigay ang sugnay ng impormasyong pangkaligiran tungkol sa tinitirhan ni Lot. Inulit ang pangalang “Lot” sa halip na gumamit ng “siya” upang maging malinaw ang tinutukoy nang walang pagbabago sa diwa.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, payak, at marangal na Filipino. Pinanatili ang karaniwang anyong “Sodoma.” Ang appositive na tumutukoy kay Lot ay inilapit sa pangalan niya para maiwasan ang kalituhan, habang itinala sa talababa ang mas literal na ayos ng Hebreo.
