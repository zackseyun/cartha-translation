  yaml_path: translation/ot/genesis/014/020.yaml
  text: And blessed be God Most High[a], who delivered your enemies into your hand[b]. And he gave him a tenth of everything.
translation:
  language: tl
  text: At purihin ang Diyos na Kataas-taasan, na ipinasakamay ang iyong mga kaaway sa iyo. At nagbigay siya sa kanya ng ikasampung bahagi ng lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi muling binabanggit sa Hebreo kung sino ang nagbigay. Ayon sa konteksto, pinakanatural na unawa na si Abram ang nagbigay kay Melquizedek ng ikasampung bahagi ng lahat. Tradisyonal na tinatawag itong “ikapu.”
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: At purihin
  rationale: Ang pasibong participle ay bahagi ng pormula ng pagpapala. Likas at marangal sa makabagong Tagalog ang hortatoryong “purihin,” habang pinananatili ng “At” ang pang-ugnay.
- source_word: אֵל עֶלְיוֹן
  choice: Kataas-taasang Diyos
  rationale: Isinasalin ang banal na titulo sa malinaw at karaniwang Tagalog; ipinahahayag ng “Kataas-taasan” ang superlatibong diwa ng עֶלְיוֹן.
- source_word: אֲשֶׁר
  choice: na
  rationale: Natural na panghalip na pantukoy sa Tagalog para sa sugnay na naglalarawan sa Diyos.
- source_word: מִגֵּן
  choice: nagbigay
  rationale: Ang pandiwa rito ay nangangahulugang ibigay o ipaubaya sa kapangyarihan ng iba, hindi “ipagsanggalang.” Kasama ng “sa iyong kamay,” malinaw ang diwang militar.
- source_word: צָרֶיךָ
  choice: iyong mga kaaway
  rationale: Tuwirang modernong katumbas ng pangmaramihang salita para sa mga kalaban o kaaway.
- source_word: בְּיָדֶךָ
  choice: sa iyong kamay
  rationale: Pinananatili ang kongkretong idyomang Hebreo para sa pagpapasailalim sa kapangyarihan ng isang tao; nauunawaan din ito sa Tagalog.
- source_word: וַיִּתֶּן
  choice: At ibinigay niya
  rationale: Pinananatili ang payak na pagkakasunod ng salaysay at ang di-tahasang paksa sa Hebreo sa pamamagitan ng panghalip.
- source_word: לוֹ
  choice: sa kanya
  rationale: Pinananatili ang di-tahasang reperente ng panghalip; ayon sa konteksto, natural itong tumutukoy kay Melquisedec.
- source_word: מַעֲשֵׂר
  choice: ikasampung bahagi
  rationale: Tuwirang ipinapahayag ang literal na halaga at iniiwasang awtomatikong magpasok ng mga institusyonal na pakahulugan ng “ikapu.”
- source_word: מִכֹּל
  choice: ng lahat
  rationale: Natural at komprehensibong Tagalog para sa bahaging kinuha mula sa kabuuan ng mga ari-arian o samsam.
theological_decisions:
- issue: Ang di-tahasang paksa ng וַיִּתֶּן
  choice: Pinanatili ang “ibinigay niya sa kanya,” na sa konteksto ay pinakanatural na nangangahulugang nagbigay si Abram kay Melquisedec.
  alternative: Maaaring basahin na si Melquisedec ang nagbigay, sapagkat hindi inuulit ng Hebreo ang pangalan ng paksa.
  rationale: Malakas na ipinahihiwatig ng konteksto na si Abram ang nagbigay, ngunit hindi ito tahasang sinasabi sa mismong sugnay. Kaya hindi idinagdag ang pangalan ni Abram sa pangunahing teksto, at ipinaliliwanag ang reperente sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang biblikal na idyomang “sa iyong kamay” at ang tunay na kalabuan ng mga panghalip sa huling sugnay.
