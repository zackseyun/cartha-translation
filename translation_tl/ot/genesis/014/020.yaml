revisions:
- from: At purihin ang Kataas-taasang Diyos, na nagbigay ng iyong mga kaaway sa iyong kamay. At ibinigay niya sa kanya ang ikasampung bahagi ng lahat.[a]
  to: At purihin ang Diyos na Kataas-taasan, na ipinasakamay ang iyong mga kaaway sa iyo. At nagbigay siya sa kanya ng ikasampung bahagi ng lahat.[a]
  rationale: Pinalitan ang hindi gaanong idiomatikong paglalarawan ng pagpapasakamay ng mga kaaway ng “ipinasakamay ... sa iyo,” na maayos na naghahatid ng Hebreong idyoma. Pinahusay din ang ayos ng banal na titulo at ang daloy ng huling sugnay. Pinanatili ang mga panghalip sa pangunahing teksto upang hindi alisin ang kalabuang nasa Hebreo; ipinaliwanag lamang sa talababa ang kontekstuwal na pinakamalamang na pagbasa.
