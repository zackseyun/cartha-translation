  text: they made war against Bera king of Sodom[a], Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela (that is[c][b], Zoar).
translation:
  language: tl
  text: nakipagdigma sila[a] laban kay Bera, hari ng Sodoma; kay Birsa, hari ng Gomorra; kay Sinab, hari ng Adma; kay Semeber, hari ng Zeboiim; at sa hari ng Bela (iyon ay, Zoar).
  philosophy: optimal-equivalence
  footnotes:
