    text: Maaari ring isalin na “nagdigma sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשׂוּ מִלְחָמָה
  choice: nakipagdigma sila
  rationale: Likas at malinaw na katumbas sa modernong Tagalog ng idyomang Hebreo na literal na ‘gumawa ng digmaan’; pinananatili nito ang aktibong pakikipaglaban nang hindi nagiging asiwa.
- source_word: אֶת ... וְאֶת
  choice: laban kay ... kay ...
  rationale: Sa kontekstong ito, ipinakikilala ng אֶת ang mga haring kinalaban. Inulit ang ‘kay’ sa talaan upang malinaw na lahat ng limang hari ang mga katunggali.
- source_word: בֶּרַע
  choice: Bera
  rationale: Tuwirang transliterasyon ng pangalan ng tao.
- source_word: סְדֹם
  choice: Sodoma
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng lugar.
- source_word: בִּרְשַׁע
  choice: Birsa
  rationale: Transliterasyong angkop sa tunog at baybay ng Filipino.
- source_word: עֲמֹרָה
  choice: Gomorra
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng lugar.
- source_word: שִׁנְאָב
  choice: Sinab
  rationale: Transliterasyong angkop sa ortograpiyang Filipino.
- source_word: אַדְמָה
  choice: Adma
  rationale: Tuwirang transliterasyon ng pangalan ng lugar.
- source_word: שֶׁמְאֵבֶר
  choice: Semeber
  rationale: Transliterasyong angkop sa ortograpiyang Filipino.
- source_word: צביים
  choice: Zeboiim
  rationale: Pinananatili ang mas buong transliterasyon ng Hebreong pangalan upang katawanin ang anyo ng WLC.
- source_word: מֶלֶךְ בֶּלַע
  choice: ang hari ng Bela
  rationale: Walang ibinigay na personal na pangalan para sa huling hari, kaya pinanatili ang pagkakakilanlan niya sa pamamagitan ng lungsod.
- source_word: הִיא צֹעַר
  choice: iyon ay ang Zoar
  rationale: Pinananatili ang tahasang parentetikong pagkakakilanlan ng Bela bilang Zoar, sa halip na gawing malayang paliwanag.
