language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדָרְלָעֹ֗מֶר וְ/הַ/מְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּכּ֤וּ אֶת רְפָאִים֙ בְּ/עַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְ/אֶת הַ/זּוּזִ֖ים בְּ/הָ֑ם וְ/אֵת֙ הָֽ/אֵימִ֔ים בְּ/שָׁוֵ֖ה קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
translation:
  language: tl
  text: Noong ika-labing-apat na taon, dumating si Kedorlaomer kasama ang mga haring kasama niya, at tinalo nila ang mga Refaim sa Asterot-karnaim, ang mga Zuzim sa Ham, at ang mga Emim sa Save-kiriataim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Save-kiriataim ay maaari ring unawain na “kapatagan ng Kiriataim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: Nang ikalabing-apat na taon
  rationale: Likas na panandang temporal sa Tagalog; hindi kailangang tahasang isalin ang panimulang waw dahil naipahihiwatig na ng daloy ng salaysay.
- source_word: בָּא
  choice: dumating
  rationale: Pinananatili ang pangkalahatang kahulugan ng Qal na 'dumating' at hindi dinaragdagan ng mas tiyak na ideyang militar gaya ng 'nagmartsa.'
- source_word: כְדָרְלָעֹמֶר
  choice: Kedorlaomer
  rationale: Tuwirang transliterasyon ng pangalang Hebreo, na angkop sa makabagong baybay sa Filipino.
- source_word: וְהַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: kasama ang mga haring kakampi niya
  rationale: Ipinahahayag nang natural sa Tagalog ang pagsama ng mga hari kay Kedorlaomer sa kontekstong militar.
- source_word: וַיַּכּוּ
  choice: Tinalo nila
  rationale: Sa talaan ng mga bayang dinaig sa digmaan, malinaw at idiomatiko ang 'tinalo' habang pinananatili ang puwersa ng נכה.
- source_word: רְפָאִים
  choice: mga Refaim
  rationale: Pinananatili bilang pangalan ng isang pangkat ng mga tao sa halip na ipakahulugang 'mga higante,' na higit na interpretatibo.
- source_word: בְּעַשְׁתְּרֹת קַרְנַיִם
  choice: sa Asterot-karnaim
  rationale: Ang בְּ ay lokatibo rito; isinasalin bilang 'sa,' at ang pangalan ng lugar ay tinutumbasan sa baybay na madaling basahin sa Filipino.
- source_word: הַזּוּזִים
  choice: mga Zuzim
  rationale: Transliterasyon ng pangalan ng pangkat; ang 'mga' ang likas na pananda ng maramihan sa Tagalog.
- source_word: בְּהָם
  choice: sa Ham
  rationale: Itinuturing na pangalan ng lugar at hindi isinasalin ang anyo nito.
- source_word: הָאֵימִים
  choice: mga Emim
  rationale: Pinananatili ang etnonimo at nilalagyan ng natural na panandang maramihan sa Tagalog.
- source_word: בְּשָׁוֵה קִרְיָתָיִם
  choice: sa Save-kiriataim
  rationale: Pinananatili bilang tambalang pangalan ng lugar upang hindi magpasya nang lampas sa teksto kung ang שָׁוֵה ay karaniwang pangngalang 'kapatagan.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'kakampi' upang likas na ipahayag ang mga haring kasama niya sa kampanyang militar. Pinanatiling transliterado ang mga pangalan ng mga tao at lugar; iniwasang tawaging 'mga higante' ang mga Refaim dahil hindi iyon tahasang hinihingi ng talata.
