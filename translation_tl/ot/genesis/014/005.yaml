revisions:
- from: Nang ikalabing-apat na taon, dumating si Kedorlaomer kasama ang mga haring kakampi niya. Tinalo nila ang mga Refaim sa Asterot-karnaim, ang mga Zuzim sa Ham, at ang mga Emim sa Save-kiriataim.[a]
  to: Noong ika-labing-apat na taon, dumating si Kedorlaomer kasama ang mga haring kasama niya, at tinalo nila ang mga Refaim sa Asterot-karnaim, ang mga Zuzim sa Ham, at ang mga Emim sa Save-kiriataim.[a]
  rationale: Inalis ang interpretatibong "kakampi" upang mapanatili ang mas malawak na kahulugan ng Hebreo na "kasama niya," at inayos ang pambungad na pananda ng panahon para sa likas na modernong Filipino. Walang binago sa mga pangalan o sa maingat na pag-iwas sa interpretatibong "mga higante."
