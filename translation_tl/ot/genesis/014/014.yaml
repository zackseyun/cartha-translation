  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑י/ו וַ/יָּ֨רֶק אֶת חֲנִיכָ֜י/ו יְלִידֵ֣י בֵית֗/וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּ/שְׁלֹ֣שׁ מֵא֔וֹת וַ/יִּרְדֹּ֖ף עַד דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/014.yaml
  text: When Abram heard that his kinsman had been taken captive[a], he led out his trained men, born in his household, three hundred and eighteen[b], and pursued them as far as Dan.
translation:
  language: tl
  text: Nang marinig ni Abram na nabihag ang kaniyang kapatid[a], tinipon niya ang kaniyang mga sinanay na tauhan[b] na ipinanganak sa kaniyang sambahayan—tatlong daan at labingwalo—at hinabol niya sila hanggang sa Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kapatid.” Maaari rin itong tumukoy sa isang malapit na lalaking kamag-anak, gaya ng pamangkin.
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang isinaling “tinipon” ay maaari ring unawaing “inilabas,” “pinapunta,” o posibleng “sinandatahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבָּה
  choice: nabihag
  rationale: Ang Niphal ng שׁבה ay tumutukoy sa pagkabihag sa digmaan. Likas at malinaw sa makabagong Tagalog ang “nabihag” at napananatili nito ang kontekstong militar.
- source_word: אָחִיו
  choice: ang kaniyang kapatid
  rationale: Pormal na pinananatili ang salitang Hebreo na “kapatid.” Yamang si Lot ay pamangkin ni Abram at maaaring mas malawak ang saklaw ng אָח, nililinaw sa talababa ang kahulugang kamag-anak nang hindi pinapawi ang anyo ng pinagmulang teksto.
- source_word: וַיָּרֶק
  choice: tinipon niya
  rationale: Mahirap tiyakin ang eksaktong diwa ng pandiwa. Sa kontekstong militar, ipinahihiwatig nito ang paghahanda o pagpapakilos sa mga tauhan. Ang “tinipon” ay natural sa Tagalog at hindi gaanong nagtatakda kung sila ay inilabas o sinandatahan.
- source_word: חֲנִיכָיו
  choice: ang kaniyang mga sinanay na tauhan
  rationale: Tumutukoy ito sa mga taong sinanay o inihanda sa ilalim ng awtoridad ni Abram. Malinaw ang “mga sinanay na tauhan” at angkop sa kontekstong militar.
- source_word: יְלִידֵי בֵיתוֹ
  choice: na ipinanganak sa kaniyang sambahayan
  rationale: Tinutukoy ng parirala ang mga taong ipinanganak sa sambahayan ni Abram. Napananatili ng salin ang sinaunang kaayusang panlipunan nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
- source_word: שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת
  choice: tatlong daan at labingwalo
  rationale: Isinusulat nang buo ang bilang gaya ng pormal na estilo ng salaysay at malinaw itong mababasa sa Tagalog.
- source_word: וַיִּרְדֹּף
  choice: hinabol niya sila
  rationale: Sa konteksto, ang רדף ay militar na pagtugis. Likas sa Tagalog ang “hinabol,” at ang “sila” ay tahasang idinagdag mula sa malinaw na konteksto bilang layon ng pandiwa.
- source_word: עַד דָּן
  choice: hanggang sa Dan
  rationale: Ang עַד ay nagsasaad ng hangganan o lawak ng pagtugis; malinaw itong ipinahahayag ng “hanggang sa Dan.”
theological_decisions:
- issue: Tawag sa kaugnayan ni Lot kay Abram
  choice: Panatilihin sa pangunahing teksto ang “kapatid”
  alternative: kamag-anak
  rationale: Bagaman pamangkin ni Abram si Lot, ginagamit ng Hebreo ang אָחִיו, na maaaring tumukoy sa mas malawak na malapit na lalaking kamag-anak. Pinananatili ng pangunahing teksto ang mismong katawagan ng Hebreo, samantalang inilalahad sa talababa ang mas malawak na kahulugan.
- issue: Di-tiyak na kahulugan ng וַיָּרֶק
  choice: tinipon niya
  alternative: inilabas niya; pinapunta niya; sinandatahan niya
  rationale: Pinagtatalunan kung ang pandiwa ay tumutukoy sa pagtitipon, paglalabas, pagpapakilos, o pagsasandata. Pinili ang “tinipon” bilang maingat at likas na saling angkop sa paghahanda para sa pagtugis, at inilagay sa talababa ang ibang posibleng diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na daloy ng salaysay, ang Hebreong katawagang “kapatid,” at ang di-tiyak na kahulugan ng pandiwang וַיָּרֶק sa pamamagitan ng talababa.
