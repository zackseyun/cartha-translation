base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/010.yaml
  text: The Valley of Siddim was full of bitumen pits[a], and the kings of Sodom and Gomorrah fled and fell there[c][b], while the rest fled to the hill country.
translation:
  language: tl
  text: Ang Lambak ng Sidim ay punô ng mga hukay ng aspalto[a]. Tumakas ang mga hari ng Sodoma at Gomorra at nahulog doon[b], samantalang tumakas naman sa kabundukan[c] ang mga natira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga hukay ng bitumen” o “mga hukay ng alkitran”; tumutukoy ang Hebreo sa mga hukay ng likas na aspalto o bitumen.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, nahulog sila roon sa Lambak ng Sidim, malamang sa mga hukay ng aspalto. Hindi tahasang binabanggit sa Hebreo kung saan sila nahulog.
    reason: ambiguity_preservation
  - marker: c
    text: O “sa mga bundok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵמֶק הַשִּׂדִּים
  choice: Ang Lambak ng Sidim
  rationale: Ginawang pantanging pangalan ang pariralang tumutukoy sa tiyak na lambak; ang “lambak” ang tuwirang katumbas ng עֵמֶק.
- source_word: בֶּאֱרֹת בֶּאֱרֹת חֵמָר
  choice: ay punô ng mga hukay ng aspalto
  rationale: Ang pag-uulit ng בֶּאֱרֹת ay nagpapahiwatig ng napakaraming hukay. Ang חֵמָר ay likas na bitumen o aspalto; “aspalto” ang mas madaling maunawaan sa karaniwang Filipino.
- source_word: וַיָּנֻסוּ ... נָסוּ
  choice: tumakas ... tumakas
  rationale: Pinanatili ang pag-uulit ng iisang ugat na nangangahulugang tumakas o lumikas mula sa panganib.
- source_word: מֶלֶךְ סְדֹם וַעֲמֹרָה
  choice: ang mga hari ng Sodoma at Gomorra
  rationale: Bagaman isahan ang anyong מֶלֶךְ, maramihan ang kaugnay na mga pandiwa at malinaw sa salaysay na may tig-isang hari ang dalawang lungsod.
- source_word: וַיִּפְּלוּ שָׁמָּה
  choice: at nahulog doon
  rationale: Tuwirang pinananatili ang kahulugan ng נפל na “mahulog” nang hindi tahasang idinaragdag na sa mga hukay sila nahulog, sapagkat walang ipinahayag na layon sa Hebreo.
- source_word: וְהַנִּשְׁאָרִים
  choice: ang mga natira
  rationale: Natural na Filipino para sa mga taong naiwan o nalabi matapos mahulog ang iba.
- source_word: הֶרָה
  choice: sa kabundukan
  rationale: Ipinapahayag ng hulaping paturol ang pagkilos papunta sa lugar na bulubundukin; natural sa Filipino ang “sa kabundukan.”
