  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging natural ang daloy nang hindi binabago ang ugnayan ng mga pangyayari. Pinanatili ang posibilidad na literal na nahulog ang mga hari, sa halip na ipakahulugang natalo o napatay sila.
