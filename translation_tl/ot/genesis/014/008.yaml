  to: Pagkatapos, lumabas ang hari ng Sodoma, ang hari ng Gomorra, ang hari ng Adma, ang hari ng Zeboim, at ang hari ng Bela (na siyang Zoar). Pumuwesto sila para sa labanan kasama nila[a] sa Lambak ng Siddim.
