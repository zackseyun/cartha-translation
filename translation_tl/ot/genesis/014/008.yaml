base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/008.yaml
  text: Then the king of Sodom[a], the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out, and they drew up for battle with them in the Valley of Siddim.
translation:
  language: tl
  text: Pagkatapos, lumabas ang hari ng Sodoma, ang hari ng Gomorra, ang hari ng Adma, ang hari ng Zeboim, at ang hari ng Bela (na siyang Zoar). Pumuwesto sila para sa labanan kasama nila[a] sa Lambak ng Siddim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “laban sa kanila.” Sa Hebreo, literal na “kasama nila [sa] labanan”; sa kontekstong ito, maaari itong tumukoy sa pakikipaglaban laban sa kanila.
    reason: Pinananatili ng pangunahing teksto ang mas malapit na anyo ng אִתָּם, habang itinatala ang adversatibong pakahulugang sinusuportahan ng konteksto.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Pagkatapos, lumabas
  rationale: Isinusulong ng waw-consecutive ang salaysay. Bagaman isahan ang anyo ng pandiwa, sinusundan ito ng tambalang simuno na binubuo ng limang hari; likas sa Filipino na unawain itong kilos nilang lahat.
- source_word: מֶלֶךְ
  choice: hari
  rationale: Karaniwang katumbas ng titulo, at inulit upang mapanatili ang diin at indayog ng Hebreo.
- source_word: סְדֹם
  choice: Sodoma
  rationale: Nakapirming anyong Filipino ng pangalan ng lugar.
- source_word: עֲמֹרָה
  choice: Gomorra
  rationale: Nakapirming anyong Filipino ng pangalan ng lugar.
- source_word: אַדְמָה
  choice: Adma
  rationale: Malapit na transliterasyon na likas basahin sa Filipino.
- source_word: צביים
  choice: Zeboim
  rationale: Transliterasyong nagpapanatili sa pagkakakilanlan ng pangalang Hebreo nang hindi nagpapabigat sa baybay.
- source_word: בֶּלַע הִוא צֹעַר
  choice: Bela (na siyang Zoar)
  rationale: Malinaw na ipinakikilala ng sugnay na ang Bela ay ang lugar ding tinatawag na Zoar; pinananatili ng panaklong ang katangian nitong paliwanag.
- source_word: וַיַּעַרְכוּ
  choice: Inihanay nila ang kanilang mga hukbo
  rationale: Sa kontekstong militar, ang ערך ay tumutukoy sa pag-aayos o paghahanay ng mga puwersa para sa labanan. Ang 'mga hukbo' ay ipinahihiwatig ng konteksto at ginagawang malinaw at natural ang pahayag sa Filipino.
- source_word: אִתָּם מִלְחָמָה
  choice: upang makipaglaban sa kanila
  rationale: Natural na Filipino para sa paghahanda ng labanan kasama o kaharap ang tinutukoy na pangkat. Hindi tahasang ginamit ang 'laban sa kanila' sa pangunahing teksto upang hindi lampasan ang bahagyang di-tiyak na anyo ng pariralang Hebreo.
- source_word: בְּעֵמֶק הַשִּׂדִּים
  choice: sa Lambak ng Sidim
  rationale: Ang עֵמֶק ay 'lambak,' at ang Sidim ay pinanatili bilang pangalan ng lugar.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Inulit ang “ang hari ng” upang mapanatili ang pormal na talaan ng Hebreo, samantalang hinati sa dalawang pangungusap ang mahabang sugnay para sa malinaw na pagbasa.
