  yaml_path: translation/ot/genesis/014/021.yaml
  text: Then the king of Sodom said to Abram[a], “Give me the people[b], and take the possessions for yourself.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng hari ng Sodoma kay Abram, “Ibigay mo sa akin ang mga tao[a], at kunin mo para sa iyong sarili ang mga pag-aari[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang kaluluwa” o “ang buhay” (isahan), na ginamit dito bilang kolektibong tawag sa mga taong nabawi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga ari-arian” o “mga kagamitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang “Pagkatapos, sinabi” at naipapakita nito ang pagkakasunod-sunod ng mga pangyayari.
- source_word: מֶלֶךְ סְדֹם
  choice: ang hari ng Sodoma
  rationale: Tuwirang isinalin ang construct chain; ginamit ang karaniwang anyong Tagalog na “Sodoma” para sa pangalan ng lugar.
- source_word: אֶל אַבְרָם
  choice: kay Abram
  rationale: Ang אֶל ay likas na ipinahahayag ng “kay” kapag tao ang tinutukoy; pinanatili ang karaniwang pangalang “Abram.”
- source_word: תֶּן לִי
  choice: Ibigay mo sa akin
  rationale: Malinaw at likas na salin ito ng pautos na pandiwa at ng panghalip na tumutukoy sa tatanggap.
- source_word: הַנֶּפֶשׁ
  choice: ang mga tao
  rationale: Bagaman nasa anyong isahan ang נֶפֶשׁ, kolektibo ang gamit nito rito para sa mga taong nabawi. Mas natural at tumpak sa konteksto ang “mga tao” kaysa literal na “kaluluwa.”
- source_word: וְהָרְכֻשׁ
  choice: at ... ang mga ari-arian
  rationale: Ang רְכוּשׁ ay tumutukoy sa mga pag-aari o kagamitan; ang “mga ari-arian” ay malawak, malinaw, at mahusay na katapat ng mga taong binanggit sa unang sugnay.
- source_word: קַח לָךְ
  choice: kunin mo para sa iyong sarili
  rationale: Naipapahayag ng “para sa iyong sarili” ang personal na pakinabang o pag-angkin na ipinahihiwatig ng לָךְ nang hindi nagdaragdag ng di-hayag na panghalip na layon.
