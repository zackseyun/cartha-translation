  text: וַ/יֹּ֥אמֶר אַבְרָ֖ם אֶל מֶ֣לֶךְ סְדֹ֑ם הֲרִימֹ֨תִי יָדִ֤/י אֶל יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/022.yaml
  text: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
translation:
  language: tl
  text: Ngunit sinabi ni Abram sa hari ng Sodoma, “Itinaas ko ang aking kamay[a] kay Yahweh, ang Kataas-taasang Diyos, na nagmamay-ari ng langit at lupa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pagtataas ng kamay ay kilos ng panunumpa sa kulturang Hebreo; ibig sabihin, nanunumpa si Abram.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “na lumikha ng langit at lupa.” Ang salitang Hebreo ay maaaring mangahulugang nagmamay-ari o nagtataglay, at sa kontekstong ito ay maaari ring unawaing lumikha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit ang ‘Ngunit’ ay likas na nagpapakita rito ng pagsalungat ng tugon ni Abram sa alok ng hari ng Sodoma.
- source_word: הֲרִימֹתִי יָדִי
  choice: Itinaas ko ang aking kamay
  rationale: Pinananatili ang kongkretong idyomang Hebreo at ipinapaliwanag sa talababa ang kahulugan nitong panunumpa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֵל עֶלְיוֹן
  choice: ang Kataas-taasang Diyos
  rationale: Natural at marangal na salin ng titulong tumutukoy sa Diyos bilang pinakamataas.
- source_word: קֹנֵה
  choice: na nagmamay-ari ng
  rationale: Pinananatili ang pangunahing diwa ng pagtataglay o pagmamay-ari nang hindi ipinapasya sa pangunahing teksto kung ang salita ay dapat unawain bilang ‘lumikha.’
- source_word: שָׁמַיִם וָאָרֶץ
  choice: langit at lupa
  rationale: Karaniwang pariralang Tagalog para sa Hebreong merismo na sumasaklaw sa kabuuan ng sangnilikha.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Ginagamit mismo ng talata ang banal na pangalan; pinananatili itong pangalan sa halip na palitan ng titulo.
- issue: Kahulugan ng קֹנֵה שָׁמַיִם וָאָרֶץ
  choice: na nagmamay-ari ng langit at lupa
  alternative: na lumikha ng langit at lupa
  rationale: Maaaring tumukoy ang Hebreong participle sa pagmamay-ari o, ayon sa konteksto, sa paglikha. Pinananatili ng pangunahing salin ang diwa ng pagtataglay, habang inilalahad sa talababa ang mahalagang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang kongkretong idyoma ng panunumpa at ang hindi tiyak na saklaw ng קֹנֵה sa pamamagitan ng talababa.
