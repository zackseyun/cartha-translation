  naturalness: Likas, malinaw, at angkop ang rehistro sa makabagong Filipino Tagalog. Ang “kabundukan” ay idiomatikong salin para sa maramihang kabundukang sakop ng mga Horeo, at ang daloy ng pangungusap ay malinaw kahit nakasalalay ang pandiwang “nilupig” sa naunang talata.
