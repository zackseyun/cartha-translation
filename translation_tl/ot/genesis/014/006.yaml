  text: וְ/אֶת הַ/חֹרִ֖י בְּ/הַרְרָ֣/ם שֵׂעִ֑יר עַ֚ד אֵ֣יל פָּארָ֔ן אֲשֶׁ֖ר עַל הַ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/006.yaml
  text: and the Horites in their hill country of Seir[a], as far as El-paran, which is by the wilderness.
translation:
  language: tl
  text: at nilupig din nila ang mga Horeo sa kanilang kabundukan sa Seir, hanggang sa El-paran[a], na nasa tabi ng ilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “El Paran”; maaari ring “punong ensina/terebinto ng Paran” kung inuunawa ang pangalan ayon sa pinagmulan ng mga salita nito at hindi bilang isang nakapirming pangalan ng lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַחֹרִי
  choice: at nilupig din nila ang mga Horeo
  rationale: Ipinagpapatuloy ng pangatnig at pananda sa layon ang talaan ng mga taong nilupig sa naunang talata. Likas sa Tagalog na ulitin ang ipinahihiwatig na pandiwang “nilupig” upang maging malinaw ang pangungusap.
- source_word: בְּהַרְרָם
  choice: sa kanilang kabundukan
  rationale: Pinananatili nito ang maramihang diwa at hulaping tumutukoy sa mga Horeo, habang natural na inilalarawan ang bulubunduking lupaing tinitirhan nila.
- source_word: שֵׂעִיר
  choice: sa Seir
  rationale: Ang Seir ay pangalang heograpiko; ang “sa kanilang kabundukan sa Seir” ay natural sa Tagalog at hindi labis na nagpapasya sa eksaktong ugnayang sintaktiko.
- source_word: עַד
  choice: hanggang sa
  rationale: Malinaw nitong ipinahahayag ang hangganang heograpiko ng pagsalakay.
- source_word: אֵיל פָּארָן
  choice: El-paran
  rationale: Itinuturing sa pangunahing teksto bilang nakapirming pangalan ng lugar upang hindi ipilit ang posibleng etimolohikong kahulugang “punong ensina/terebinto ng Paran.”
- source_word: אֲשֶׁר עַל הַמִּדְבָּר
  choice: na nasa tabi ng ilang
  rationale: Natural na Tagalog ito para sa malawak na relasyong panlugar ng עַל at malinaw na itinatakda ang El-paran kaugnay ng ilang.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga Horeo” bilang karaniwang anyong Filipino ng pangalan ng bayan, “kabundukan” para sa rehiyong mabundok, at “ilang” para sa wilderness.
