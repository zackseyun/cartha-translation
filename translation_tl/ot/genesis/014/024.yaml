  text: בִּלְעָדַ֗/י רַ֚ק אֲשֶׁ֣ר אָֽכְל֣וּ הַ/נְּעָרִ֔ים וְ/חֵ֨לֶק֙ הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הָלְכ֖וּ אִתִּ֑/י עָנֵר֙ אֶשְׁכֹּ֣ל וּ/מַמְרֵ֔א הֵ֖ם יִקְח֥וּ חֶלְקָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/024.yaml
  text: I will take nothing except only what the young men have eaten[a], and the share of the men who went with me—Aner, Eshcol, and Mamre[c][b]. Let them take their share.
translation:
  language: tl
  text: Wala akong kukunin, maliban lamang sa kinain ng mga tauhan[a] at sa bahagi ng mga lalaking sumama sa akin—sina Aner, Escol, at Mamre. Kunin nila ang kanilang bahagi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kabataang lalaki.” Maaaring tumukoy ang salitang Hebreo sa mga kabataan o sa mga tauhan/tagapaglingkod, depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “Kukunin nila ang kanilang bahagi.” Maaari ring unawain ang anyong Hebreo bilang payak na hinaharap, bagaman mas angkop sa konteksto ang pahintulot na “Kunin nila.”
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעָדַי רַק
  choice: Wala akong kukunin, maliban lamang sa
  rationale: Ang parirala ay nakasalalay sa pagtanggi ni Abram sa naunang talata. Isinasaad sa Filipino ang ipinahihiwatig na pandiwa upang maging buo at malinaw ang pangungusap, habang pinananatili ng “maliban lamang” ang pinagsamang diwa ng pagbubukod at pagbibigay-diin.
- source_word: אֲשֶׁר אָכְלוּ הַנְּעָרִים
  choice: sa kinain ng mga tauhan
  rationale: Sa konteksto ng pangkat na sumama sa digmaan, natural ang “mga tauhan.” Gayunman, maaaring tumukoy ang נְּעָרִים sa mga kabataang lalaki, kaya pinananatili sa talababa ang leksikal na kalabuan.
- source_word: וְחֵלֶק הָאֲנָשִׁים אֲשֶׁר הָלְכוּ אִתִּי
  choice: at sa bahagi ng mga lalaking sumama sa akin
  rationale: Ang “bahagi” ay likas na katumbas ng חֵלֶק sa paghahati ng samsam, at ang “sumama sa akin” ay tuwirang nagpapahayag sa הָלְכוּ אִתִּי.
- source_word: עָנֵר אֶשְׁכֹּל וּמַמְרֵא
  choice: Aner, Escol, at Mamre
  rationale: Isinatinig ang mga pangalang pantangi ayon sa karaniwang anyong madaling basahin sa Filipino.
- source_word: הֵם יִקְחוּ חֶלְקָם
  choice: Kunin nila ang kanilang bahagi
  rationale: Sa konteksto, ang imperfect ay pinakamalamang na nagpapahintulot sa mga kaalyado ni Abram na kunin ang nararapat sa kanila, hindi lamang naghuhula ng mangyayari.
theological_decisions:
- issue: Ipinahihiwatig na pagpapatuloy ng pagtanggi ni Abram mula sa naunang talata
  choice: Idinagdag ang ipinahihiwatig na “Wala akong kukunin” upang maging buo ang pangungusap sa Filipino.
  alternative: Panatilihin bilang putol na pariralang “Maliban lamang sa kinain...”
  rationale: Walang tahasang pandiwa sa simula ng Hebreo dahil umaasa ito sa naunang pahayag. Ang paglalantad sa ipinahihiwatig na pagtanggi ay paglilinaw sa balarila, hindi pagdaragdag ng doktrina.
- issue: Pahintulot o payak na hinaharap sa יִקְחוּ
  choice: 'Pahintulot: “Kunin nila ang kanilang bahagi.”'
  alternative: 'Payak na hinaharap: “Kukunin nila ang kanilang bahagi.”'
  rationale: Ang kaibhan ni Abram sa sarili niyang pagtanggi at sa karapatan ng kanyang mga kaalyado ay pumapabor sa diwang nagpapahintulot, ngunit inilalahad sa talababa ang posibleng pagbasa bilang hinaharap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maliban lamang” upang likas na maipahayag ang dalawang salitang nagbibigay-diin sa pagbubukod, at nilagyan ng talababa ang tunay na kalabuan sa katawagan sa mga tauhan at sa anyo ng pandiwa sa huling pangungusap.
