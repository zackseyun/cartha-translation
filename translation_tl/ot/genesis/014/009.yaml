base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/009.yaml
  text: Chedorlaomer king of Elam[a], Tidal king of Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against the five.
translation:
  language: tl
  text: Si Kedorlaomer na hari ng Elam, si Tidal na hari ng Goiim[a], si Amrafel na hari ng Sinar, at si Arioc na hari ng Elasar—apat na hari laban sa lima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Tidal na hari ng mga bansa.” Ang Hebreong גּוֹיִם (goyim) ay maaaring isang karaniwang pangngalan na nangangahulugang “mga bansa,” ngunit maaari rin itong pangalan ng lugar dito (“Goiim”).
    reason: alternative_reading
lexical_decisions:
- source_word: אֵת ... אֶת
  choice: laban sa
  rationale: Sa konteksto ng talaan ng mga haring naglalaban, ipinahihiwatig ng hulíng אֶת ang pagsasalungatan sa digmaan; natural itong ipinapahayag sa Filipino bilang “laban sa.”
- source_word: כְּדָרְלָעֹמֶר
  choice: Kedorlaomer
  rationale: Isinatinig ang pangalang pantangi ayon sa anyong Hebreo at sa madaling basahing baybay sa Filipino.
- source_word: מֶלֶךְ עֵילָם
  choice: hari ng Elam
  rationale: Tuwirang salin ng construct chain na tumutukoy sa nasasakupang lupain ng hari.
- source_word: תִדְעָל
  choice: Tidal
  rationale: Isinatinig ang pangalang pantangi sa natural na baybay sa Filipino.
- source_word: גּוֹיִם
  choice: Goiim
  rationale: Sa titulong ito ng hari, maaaring pangalan ito ng lugar; pinanatili ang toponimikong pagbasa sa pangunahing teksto habang inilalahad sa talababa ang posibleng pagbasa bilang karaniwang pangngalan.
- source_word: אַמְרָפֶל
  choice: Amrafel
  rationale: Isinatinig ang pangalang pantangi, gamit ang “f” para sa tunog ng pe na walang dagesh.
- source_word: שִׁנְעָר
  choice: Sinar
  rationale: Pinanatili ang pangalang nasa Hebreo sa halip na palitan ng isang historikal na pagkakakilanlan gaya ng Babilonia.
- source_word: אַרְיוֹךְ
  choice: Arioc
  rationale: Isinatinig ang pangalang pantangi sa madaling basahing anyong Filipino.
- source_word: אֶלָּסָר
  choice: Elasar
  rationale: Isinatinig ang pangalan ng lugar nang hindi ito ipinapalagay na ibang rehiyon.
- source_word: אַרְבָּעָה מְלָכִים
  choice: apat na hari
  rationale: Tuwirang salin ng pariralang binubuo ng bilang at pangngalan.
- source_word: הַחֲמִשָּׁה
  choice: ang lima
  rationale: Pinananatili ang maikling anyo ng Hebreo; nauunawaan mula sa naunang parirala at konteksto na limang hari ang tinutukoy.
