  source_fidelity: Tumpak na naihahatid ng teksto ang apat na hari, kani-kanilang kaharian, at ang idiomatikong pagsalungat ng apat sa lima. Ang “laban sa” ay wastong pagpapahayag ng tunggaliang ipinahihiwatig sa konstruksyong Hebreo. Napananatili rin ng “lima” ang pinaikling anyo ng Hebreo, kung saan ipinahihiwatig ang ‘mga hari.’
  naturalness: Natural at malinaw ang talaan sa makabagong Filipino. Ang paggamit ng “Si” sa mga personal na pangalan at ang maikling pangwakas na “apat na hari laban sa lima” ay angkop sa marangal na rehistro.
  terminology: Magkakatugma at angkop ang mga anyong pangalang Kedorlaomer, Tidal, Amrafel, Sinar, Arioc, at Elasar. Wastong pinananatili ang Goiim bilang posibleng pangalan ng lugar, habang ang alternatibong pagbasa bilang karaniwang pangngalan ay nasa talababa.
