base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/015.yaml
  text: By night he and his servants divided themselves against them, struck them down, and pursued them as far as Hobah, which is north of Damascus.
translation:
  language: tl
  text: Sa gabi, hinati niya ang kanyang mga tauhan sa mga pangkat upang lusubin sila. Siya at ang kanyang mga tauhan ay lumusob sa kanila at tinalo sila, at hinabol sila hanggang sa Hoba, na nasa hilaga ng Damasco.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּחָלֵק עֲלֵיהֶם
  choice: hinati niya ang kanyang mga tauhan upang salakayin sila
  rationale: Ang pandiwang חָלַק dito ay nagpapahiwatig ng paghahati ng puwersa, at ang עֲלֵיהֶם ay may diwang paglusob laban sa kanila. Ginawang tahasan ang likas na layon upang maging malinaw at natural sa Tagalog.
- source_word: עֲבָדָיו
  choice: kanyang mga tauhan
  rationale: Bagaman literal na ‘kanyang mga lingkod,’ sa kontekstong militar ay tumutukoy ito sa mga kasamang tauhan o mandirigma ni Abram; mas natural ang ‘mga tauhan’ nang hindi nagdaragdag ng ranggo.
- source_word: וַיַּכֵּם
  choice: Tinalo niya sila
  rationale: Ang נכה ay maaaring mangahulugang hampasin, pabagsakin, o talunin sa labanan. Ang ‘tinalo’ ay angkop sa buod ng matagumpay na paglusob at hindi kinakailangang magpahiwatig na pinatay silang lahat.
- source_word: מִשְּׂמֹאל לְדַמָּשֶׂק
  choice: nasa hilaga ng Damasco
  rationale: Ang literal na ‘sa kaliwa ng Damasco’ ay isang sinaunang oryentasyong nakaharap sa silangan, kaya tumutukoy sa hilaga; isinalin ayon sa heograpikong kahulugan para sa modernong mambabasa.
