  naturalness: Natural ang makabagong Tagalog ng draft. Ang rebisyon ay nagpapanatili ng malinaw na daloy habang nililinaw ang taktikang paghahati sa mga pangkat at ang magkatuwang na pagkilos ni Abram at ng kanyang mga tauhan.
