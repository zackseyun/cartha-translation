id: GEN.14.1
reference: Genesis 14:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/ימֵי֙ אַמְרָפֶ֣ל מֶֽלֶךְ שִׁנְעָ֔ר אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר כְּדָרְלָעֹ֨מֶר֙ מֶ֣לֶךְ עֵילָ֔ם וְ/תִדְעָ֖ל מֶ֥לֶךְ גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/001.yaml
  text: 'And it happened in the days of Amraphel king of Shinar[a], Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations:'
translation:
  language: tl
  text: At nangyari noong panahon nina Amrafel na hari ng Sinar, Arioc na hari ng Elasar, Kedorlaomer na hari ng Elam, at Tidal na hari ng mga bansa[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hari ng Goyim.” Karaniwang nangangahulugang “mga bansa” ang salitang Hebreo, ngunit maaaring ginagamit ito rito bilang pangalan ng isang lugar o pangkat, kaayon ng iba pang mga titulong maharlika sa talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Pinananatili ang panandang pasalaysay at ang pang-ugnay ng Hebreo sa natural at di-makalumang Tagalog.
- source_word: בִּימֵי
  choice: noong panahon nina
  rationale: Ang literal na “sa mga araw ni” ay isang pormulang panahunan; mas natural sa modernong Tagalog ang “noong panahon nina,” at ang “nina” ay angkop sa kasunod na talaan ng mga hari.
- source_word: אַמְרָפֶל מֶלֶךְ שִׁנְעָר
  choice: Amrafel na hari ng Sinar
  rationale: Isinalin nang tuwiran ang titulo at tinumbasan sa baybay-Tagalog ang mga pangalang pantangi.
- source_word: אַרְיוֹךְ מֶלֶךְ אֶלָּסָר
  choice: Arioc na hari ng Elasar
  rationale: Pinananatili ang magkakatulad na kayarian ng apat na titulong maharlika.
- source_word: כְּדָרְלָעֹמֶר מֶלֶךְ עֵילָם
  choice: Kedorlaomer na hari ng Elam
  rationale: Transliterasyon ng personal na pangalan at tuwirang salin ng titulong Hebreo.
- source_word: וְתִדְעָל מֶלֶךְ גּוֹיִם
  choice: at Tidal na hari ng mga bansa[a]
  rationale: Ang גּוֹיִם ay karaniwang nangangahulugang “mga bansa”; pinanatili ito sa teksto habang itinatala sa talababa ang posibilidad na pangalan ito ng isang lugar o pangkat.
