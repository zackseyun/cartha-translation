base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/020.yaml
  text: Then Jacob made a vow[a], saying, “If God will be with me and will keep me on this way that I am going[d][c][b], and will give me bread to eat and clothing to wear,”
translation:
  language: tl
  text: Pagkatapos, nanata si Jacob at sinabi, “Kung sasamahan ako ng Diyos at iingatan niya ako sa paglalakbay kong ito,[a] at bibigyan niya ako ng tinapay na kakainin at damit na isusuot,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa daang ito na aking nilalakaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר יַעֲקֹב נֶדֶר
  choice: nanata si Jacob
  rationale: Ang pandiwa at kaugnay na pangngalan ay bumubuo ng idyomang nangangahulugang gumawa ng isang taimtim na panata. Likas at malinaw sa Tagalog ang “nanata.”
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Likas na panimula sa nilalaman ng panata sa makabagong Tagalog.
- source_word: אִם
  choice: Kung
  rationale: Pinananatili ang tuwirang kondisyunal na anyo at ang tensiyong nasa teksto, nang hindi ginagawang “kapag” o “yamang.”
- source_word: אֱלֹהִים עִמָּדִי
  choice: sasamahan ako ng Diyos
  rationale: Natural na Tagalog para sa presensiya ng Diyos na “kasama ko,” habang pinananatili ang personal na ugnayan.
- source_word: וּשְׁמָרַנִי
  choice: at iingatan niya ako
  rationale: Saklaw ng שׁמר ang pag-iingat, pagbabantay, at pagprotekta; “iingatan” ang pinakanatural at sapat na malawak dito.
- source_word: בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ
  choice: sa paglalakbay kong ito
  rationale: Ang literal na “sa daang ito na aking nilalakaran/pinupuntahan” ay tumutukoy sa paglalakbay ni Jacob. Ang salin ay natural ngunit pinananatili ang demonstratibong “ito.”
- source_word: וְנָתַן לִי
  choice: at bibigyan niya ako
  rationale: Ipinahahayag ang kasunod na kilos sa loob ng kondisyunal na sugnay.
- source_word: לֶחֶם לֶאֱכֹל
  choice: tinapay na makakain
  rationale: Pinananatili ang kongkretong “tinapay,” bagaman maaari rin itong tumukoy nang mas malawak sa pagkain.
- source_word: וּבֶגֶד לִלְבֹּשׁ
  choice: at damit na maisusuot
  rationale: Direkta at natural na katumbas ng damit para isuot.
theological_decisions:
- issue: Ang kalikasan ng kondisyunal na panata ni Jacob
  choice: Isinalin ang אִם bilang “Kung.”
  alternative: “Kapag” o “Yamang” sasamahan ako ng Diyos
  rationale: Hindi nilulutas ng salin kung ang pananalita ni Jacob ay nagpapahayag ng pag-aalinlangan o pagtitiwala; pinananatili nito ang kondisyunal na anyo ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nanata” sa halip na mas mabigat na “gumawa ng panata,” at “paglalakbay” upang likas na ipahayag ang דרך sa kontekstong ito. Nananatiling bukas ang pangungusap dahil nagpapatuloy ang panata sa kasunod na talata.
