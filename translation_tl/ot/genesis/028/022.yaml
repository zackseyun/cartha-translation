  yaml_path: translation/ot/genesis/028/022.yaml
  text: And this stone[a], which I have set up as a pillar, will be God’s house[b], and of all that you give me I will surely give a tenth to you.
translation:
  language: tl
  text: At ang batong ito na itinayo ko bilang haligi ay magiging bahay ng Diyos. At sa lahat ng ibibigay mo sa akin, tiyak na ibibigay ko sa iyo ang ikasampung bahagi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַצֵּבָה
  choice: haligi
  rationale: Tumutukoy ito sa isang batong itinayo bilang tanda o bantayog. Pinananatili ng “haligi” ang konkretong larawan nang hindi idinaragdag na ito ay tiyak na isang alaala.
- source_word: יִהְיֶה בֵּית אֱלֹהִים
  choice: ay magiging bahay ng Diyos
  rationale: Tuwirang inililipat ang konstruktong Hebreo at natural sa Tagalog. Hindi nito ipinapasok ang mas huling teolohiya tungkol sa templo.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Sa konteksto ng panata ni Jacob, ang tinutukoy ay ang Diyos na nagpakita at nangako sa kaniya sa naunang mga talata.
- source_word: תִּתֶּן לִי
  choice: ibibigay mo sa akin
  rationale: Ang payak na aspektong panghinaharap ay angkop sa panata at sa kondisyong sinimulan sa naunang konteksto.
- source_word: עַשֵּׂר אֲעַשְּׂרֶנּוּ
  choice: tiyak na ibibigay ko ... ang ikasampung bahagi
  rationale: Ipinahahayag ng infinitive absolute na kasunod ng pandiwa ang mariing katiyakan. Ang “ikasampung bahagi” ay malinaw sa karaniwang mambabasa at hindi agad nagpapasok ng mas huling institusyonal na kahulugan ng ikapu.
- source_word: לָךְ
  choice: sa iyo
  rationale: Tuwirang ipinakikita kung kanino ilalaan ang ikasampung bahagi.
- source_word: הָאֶבֶן הַזֹּאת אֲשֶׁר שַׂמְתִּי
  choice: ang batong ito na itinayo ko
  rationale: Ang “itinayo” ay natural na paglalarawan sa pagtatayo ng bato nang patayo bilang isang haligi.
theological_decisions:
- issue: Ang kahulugan ng pagiging “bahay ng Diyos” ng bato
  choice: Pinanatili ang pahayag na ang bato ay “magiging bahay ng Diyos,” bilang banal na lugar o tanda ng pakikipagtagpo sa Diyos, nang walang dagdag na paliwanag sa mismong talata.
  alternative: Ipaliwanag na ang bato mismo ay magiging dambana, o na tuwiran nitong hinuhulaan ang isang templo sa hinaharap.
  rationale: Ganito ang mariing pahayag ng Hebreo, ngunit hindi tinutukoy ng talata kung paano eksaktong magiging “bahay ng Diyos” ang bato. Pinananatili ng salin ang tensiyon at hindi ito nilulutas sa pamamagitan ng dagdag na doktrina.
- issue: Ang ipinangakong ikasampung bahagi
  choice: Isinalin bilang tiyak na pagbibigay sa Diyos ng ikasampung bahagi ng lahat ng ibibigay niya kay Jacob.
  alternative: Gamitin ang teknikal na katawagang “mag-iikapu” na maaaring magpahiwatig ng mas huling sistemang panrelihiyon.
  rationale: Ipinahahayag ng teksto ang isang mariing personal na panata. Iniiwasan ng salin na ipasok dito ang mas huling mga tuntunin tungkol sa ikapu.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “batong ... bilang haligi” upang mapanatili ang konkretong larawan, at “ikasampung bahagi” upang maging madaling maunawaan nang hindi nawawala ang diin ng Hebreo.
