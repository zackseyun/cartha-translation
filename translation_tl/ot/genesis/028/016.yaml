base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/016.yaml
  text: Then Jacob awoke from his sleep and said[a], “Surely Yahweh is in this place, and I did not know it.”
translation:
  language: tl
  text: Nagising si Jacob mula sa kanyang pagkakatulog at sinabi niya, “Tunay ngang nasa lugar na ito si Yahweh, at hindi ko iyon alam.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּיקַץ
  choice: Pagkagising
  rationale: Likas na salaysay sa modernong Filipino para sa paggising mula sa tulog; malinaw na si Jacob ang paksa sa kasunod na parirala.
- source_word: מִשְּׁנָתוֹ
  choice: Pagkagising
  rationale: Ang ideyang ‘mula sa kanyang pagkakatulog’ ay likas na naipapaloob sa pariralang Filipino na ‘pagkagising,’ nang hindi nawawala ang kahulugan.
- source_word: וַיֹּאמֶר
  choice: sinabi niya
  rationale: Karaniwan at dignified na salin ng pandiwang pambungad sa tuwirang sinabi.
- source_word: אָכֵן
  choice: Talagang
  rationale: Ipinahahayag nito ang bigla at mariing pagkabatid ni Jacob; mas natural sa kasalukuyang Filipino kaysa ‘tunay nga.’
- source_word: יֵשׁ
  choice: narito
  rationale: Ang existential na pahayag ay tumutukoy sa presensiya ni Yahweh sa mismong lugar; ‘narito’ ang natural na katumbas sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: sa lugar na ito
  rationale: Tuwirang tumutukoy sa tiyak na pook kung saan natulog at nanaginip si Jacob.
- source_word: וְאָנֹכִי לֹא יָדָעְתִּי
  choice: at hindi ko iyon alam
  rationale: Pinananatili ang payak na pang-ugnay at ang kaibhan sa pagitan ng tunay na presensiya ni Yahweh at ng dating kawalang-malay ni Jacob; ang ‘iyon’ ay tumutukoy sa presensiyang kababanggit lamang.
theological_decisions:
- issue: Pagbibigay-kahulugan sa presensiya ni Yahweh sa lugar
  choice: “narito si Yahweh sa lugar na ito”
  alternative: “naninirahan si Yahweh sa lugar na ito”
  rationale: Existential ang יֵשׁ at pinatutunayan ang presensiya, ngunit hindi nito tahasang sinasabing permanente o limitado sa lugar na iyon ang paninirahan ni Yahweh.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan ang tahasang nakasulat sa Hebreo; pinananatili ng ‘Yahweh’ ang pagkakaiba nito sa titulong ‘Panginoon.’
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang lipas na ‘pagkagising mula sa kaniyang pagkakatulog’ at pinili ang mas idiomatikong ‘Pagkagising ni Jacob.’
