  - severity: low
    issue: Ang “Pagkagising ni Jacob” ay mas nominal kaysa sa tuwirang salaysay ng Hebreo.
    rationale: Nauunawaan ito at hindi mali, ngunit ang “Nagising si Jacob mula sa kanyang pagkakatulog” ay mas tahasang tumutugma sa sunod-sunod na pandiwang salaysay at sa מִשְּׁנָתוֹ.
