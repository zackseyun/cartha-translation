  yaml_path: translation/ot/genesis/028/019.yaml
  text: And he called the name of that place Bethel[a], but formerly the name of the city was Luz.
translation:
  language: tl
  text: At tinawag niyang Bethel[a] ang lugar na iyon, ngunit Luz ang dating pangalan ng lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Bethel ay nangangahulugang “bahay ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם
  choice: tinawag niyang ... ang
  rationale: Ang pariralang Hebreo ay literal na “tinawag niya ang pangalan,” ngunit sa natural na makabagong Tagalog, ang pagpapangalan ay malinaw at matapat na ipinahahayag ng “tinawag niyang ... ang.”
- source_word: הַמָּקוֹם הַהוּא
  choice: ang lugar na iyon
  rationale: Pinananatili nito ang karaniwang kahulugan ng מָקוֹם at ang demonstratibong הַהוּא sa malinaw na Tagalog.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Isinalin bilang kinikilalang anyo ng pangalang pantangi sa Tagalog; ipinaliliwanag sa talababa ang kahulugan ng pangalang Hebreo.
- source_word: וְאוּלָם
  choice: ngunit
  rationale: Ipinahahayag nito ang contrastive clarification ng Hebreo sa marangal at natural na Tagalog.
- source_word: לוּז
  choice: Luz
  rationale: Pangalang pantangi ng lungsod, kaya pinanatili sa transliteradong anyo.
- source_word: שֵׁם הָעִיר לָרִאשֹׁנָה
  choice: ang dating pangalan ng lungsod
  rationale: Natural na inililipat sa Tagalog ang genitibong kayarian at ang temporal na diwa ng לָרִאשֹׁנָה bilang naunang pangalan.
