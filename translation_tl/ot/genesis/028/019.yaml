  source_fidelity: 'Tumpak na naihahatid ng salin ang Hebreong diwa: pinangalanan niya ang lugar na iyon na Bethel, samantalang Luz ang dating pangalan ng lungsod. Napananatili ang pagtutol/paglilinaw ng וְאוּלָם sa “ngunit” at ang dating-panahong diwa ng לָרִאשֹׁנָה sa “dating.”'
  naturalness: Natural, malinaw, at angkop sa makabagong Filipino Tagalog ang “At tinawag niyang Bethel ang lugar na iyon, ngunit Luz ang dating pangalan ng lungsod.” Hindi kailangang piliting ulitin ang “pangalan” sa unang sugnay, dahil likas na ipinahihiwatig ito ng pandiwang “tinawag.”
  terminology: Wasto at pare-pareho ang paggamit ng Bethel at Luz bilang mga pangalang pantangi. Ang talababa ay wastong nagpapaliwanag ng leksikal na kahulugan ng Bethel nang hindi isinasalin ang pangalan sa pangunahing teksto. Ang “Diyos” ay angkop na anyo sa Tagalog.
