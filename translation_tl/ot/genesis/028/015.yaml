    rationale: Mas idiomatiko sa modernong Filipino ang "Narito" bilang pangmarka ng biglaang diin o pagtawag-pansin sa pambungad ng banal na pananalita. Naiiwasan nito ang hindi kinakailangang utos na literal na "pagmasdan" ang nagsasalita.
