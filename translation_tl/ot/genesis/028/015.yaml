source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֜י עִמָּ֗/ךְ וּ/שְׁמַרְתִּ֨י/ךָ֙ בְּ/כֹ֣ל אֲשֶׁר תֵּלֵ֔ךְ וַ/הֲשִׁ֣בֹתִ֔י/ךָ אֶל הָ/אֲדָמָ֖ה הַ/זֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְ/ךָ֔ עַ֚ד אֲשֶׁ֣ר אִם עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר דִּבַּ֖רְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/015.yaml
  text: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
translation:
  language: tl
  text: Narito, ako ay kasama mo. Iingatan kita saan ka man pumunta, at ibabalik kita sa lupaing ito. Sapagkat hindi kita iiwan hanggang sa magawa ko ang sinabi ko sa iyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At masdan mo
  rationale: Pinananatili ang biglang pagtawag-pansin at diin ng Hebreong panandang diskurso sa paraang marangal at nauunawaan sa modernong Filipino.
- source_word: אָנֹכִי עִמָּךְ
  choice: kasama mo ako
  rationale: Likas sa Filipino ang ayos na ito at tuwirang pinananatili ang pangako ng personal na presensiya ng Diyos.
- source_word: וּשְׁמַרְתִּיךָ
  choice: Iingatan kita
  rationale: Sinasaklaw ng 'iingatan' ang pagprotekta at pagbabantay na maaaring ipahiwatig ng שׁמר nang hindi pinakikitid ang kahulugan.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: saan ka man pumunta
  rationale: Natural na katumbas sa Filipino ng idyomang Hebreo na tumutukoy sa alinmang lugar na paroroonan ni Jacob.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: ibabalik kita
  rationale: 'Pinananatili ang causative na puwersa ng Hiphil: ang Diyos ang magpapabalik kay Jacob.'
- source_word: אֶל הָאֲדָמָה הַזֹּאת
  choice: sa lupaing ito
  rationale: Bagaman maaaring mangahulugang lupa o ground ang אֲדָמָה, heograpikal na lupain ang malinaw na diwa sa pangako kay Jacob.
- source_word: כִּי
  choice: Sapagkat
  rationale: Malinaw na ipinakikita ang paliwanag o batayan ng naunang katiyakan.
- source_word: לֹא אֶעֱזָבְךָ
  choice: hindi kita iiwan
  rationale: Tuwiran, natural, at malawak ang 'iiwan'; hindi nito dinaragdagan ang tindi tungo sa mas interpretibong 'pababayaan' o 'tatalikuran.'
- source_word: עַד אֲשֶׁר אִם עָשִׂיתִי
  choice: hanggang sa magawa ko
  rationale: Natural na Filipino para sa hangganang nakatuon sa ganap na pagtupad sa hinaharap; hindi nito ipinahihiwatig na pagkatapos ay iiwan na ng Diyos si Jacob.
- source_word: אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  choice: ang sinabi ko sa iyo
  rationale: Nanatiling malapit sa literal na 'sinalita/sinabi' sa halip na gawing 'ipinangako,' bagaman pangako ang nilalaman ng sinabi.
theological_decisions:
- issue: Presensiya, pag-iingat, at katapatan ng Diyos kay Jacob
  choice: Isinalin nang tuwiran ang presensiya, pag-iingat, pagbabalik, at pagtupad sa sinabi ng Diyos.
  alternative: Gumamit ng mas pinatinding pananalitang gaya ng 'hinding-hindi kita pababayaan' o gawing tahasang 'pangako' ang 'sinabi.'
  rationale: Pinananatili nito ang teolohikal na bigat ng talata nang hindi nagdaragdag ng diin o doktrinal na pagpapakahulugang hindi tahasang nasa Hebreo.
- issue: Saklaw ng 'hanggang sa'
  choice: Pinanatili ang 'hanggang sa' bilang hangganan ng ipinangakong katuparan.
  alternative: Muling bumuo bilang 'hindi kita iiwan; tiyak na tutuparin ko...' upang iwasan ang posibleng maling pagkaunawa.
  rationale: Ang anyong Hebreo ay dapat panatilihin. Sa konteksto, ang 'hanggang sa' ay nagbibigay-katiyakan sa patuloy na presensiya hanggang sa katuparan at hindi nagsasabing matatapos ang presensiya pagkatapos noon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'masdan mo' upang mapanatili ang vivid discourse marker; iniwasan ang mas lumang 'narito' dahil maaari itong mapagkamalang pahayag ng lokasyon. Walang footnote dahil malinaw na naisasalin sa pangunahing teksto ang mahahalagang lexical na posibilidad.
