  text: וַ/יַּשְׁכֵּ֨ם יַעֲקֹ֜ב בַּ/בֹּ֗קֶר וַ/יִּקַּ֤ח אֶת הָ/אֶ֨בֶן֙ אֲשֶׁר שָׂ֣ם מְרַֽאֲשֹׁתָ֔י/ו וַ/יָּ֥שֶׂם אֹתָ֖/הּ מַצֵּבָ֑ה וַ/יִּצֹ֥ק שֶׁ֖מֶן עַל רֹאשָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/018.yaml
  text: Jacob rose early in the morning[a], took the stone that he had placed at his head, set it up as a pillar[c][b], and poured oil on its top.
translation:
  language: tl
  text: Maagang bumangon si Jacob kinaumagahan. Kinuha niya ang batong inilagay niya sa ulunan niya, itinayo iyon bilang isang haliging bato,[a] at binuhusan ng langis ang tuktok nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “batong itinayong patayo.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang ulo nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם יַעֲקֹב בַּבֹּקֶר
  choice: Maagang bumangon si Jacob kinaumagahan
  rationale: Ipinapahayag ng pandiwa ang maagang pagbangon, at natural sa modernong Tagalog ang “kinaumagahan” bilang tagpuan ng pangyayari.
- source_word: הָאֶבֶן
  choice: ang bato
  rationale: Tiyak at isahang pangngalan ito; pinanatili ang payak na kahulugan.
- source_word: אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו
  choice: na inilagay niya sa ulunan niya
  rationale: Ang מְרַאֲשֹׁתָיו ay tumutukoy sa dakong ulunan. Hindi ginawang “sa ilalim ng ulo” upang hindi lumampas sa tahasang sinasabi ng Hebreo.
- source_word: וַיָּשֶׂם אֹתָהּ מַצֵּבָה
  choice: itinayo iyon bilang isang haliging bato
  rationale: Ipinakikita ng “itinayo” ang pagpapatayo nang patayo, samantalang nililinaw ng “haliging bato” na ang מַצֵּבָה ay isang nakatayong bato, hindi karaniwang haligi lamang.
- source_word: וַיִּצֹק שֶׁמֶן
  choice: binuhusan ng langis
  rationale: Tuwirang inilalarawan ang pagbubuhos ng langis; hindi ginamit ang “pinahiran” upang maiwasan ang interpretasyong hindi tahasang nasa pandiwa.
- source_word: עַל רֹאשָׁהּ
  choice: ang tuktok nito
  rationale: Literal itong “sa ulo nito,” ngunit “tuktok” ang natural na Tagalog para sa itaas na bahagi ng isang bato o haligi.
theological_decisions:
- issue: Posibleng kultikong kahulugan ng מַצֵּבָה at ng pagbubuhos ng langis
  choice: Ilarawan lamang ang ginawa ni Jacob nang walang positibo o negatibong teolohikal na pagpapakahulugan
  alternative: Isaling “batong alaala” o “pinahiran niya ito ng langis”
  rationale: Isinasalaysay ng talata ang pagtatayo ng bato at pagbubuhos ng langis. Hindi nito tahasang tinatawag ang bagay na alaala ni inilalarawan ang kilos sa teknikal na wika ng pagpapahid, kaya pinanatili ang tensiyon at pagiging deskriptibo ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang magkakaugnay ngunit maiikling pangungusap upang mapanatili ang mabilis na daloy ng sunod-sunod na pandiwang Hebreo nang hindi nagiging mabigat o paulit-ulit.
