  yaml_path: translation/ot/genesis/028/010.yaml
  text: Jacob departed from Beersheba and went to Haran[a].
translation:
  language: tl
  text: Umalis si Jacob sa Beer-seba at pumunta sa Haran[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “patungong Haran”; ang pangalang “Haran” ay may hulaping nagsasaad ng direksiyon.
    reason: Pinananatili ang diwang direksiyonal ng חָרָנָה nang hindi ginagawang pilit ang pangunahing pangungusap sa Tagalog.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Umalis
  rationale: Ang יָצָא ay tumutukoy sa paglabas o pag-alis mula sa isang lugar. Ang “umalis” ang pinakanatural at tuwirang katumbas sa modernong Tagalog.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa mga saling Tagalog.
- source_word: מִבְּאֵר שָׁבַע
  choice: sa Beer-seba
  rationale: Ipinapahayag ng מִן ang pinagmulan. Sa pandiwang “umalis,” natural na ipinakikita sa Tagalog ng “sa” ang lugar na nilisan.
- source_word: וַיֵּלֶךְ
  choice: pumunta
  rationale: Ang הָלַךְ ay karaniwang pandiwa para sa pagpunta o paglakad. Ang “pumunta” ay tuwiran at hindi nagdaragdag ng di-hayag na diwa gaya ng “naglakbay.”
- source_word: חָרָנָה
  choice: sa Haran
  rationale: Ang hulaping ה־ ay nagsasaad ng kilos patungo sa isang lugar. Natural itong ipinahahayag sa pangunahing teksto bilang “pumunta sa Haran,” habang nililinaw sa talababa ang mas lantad na “patungong Haran.”
