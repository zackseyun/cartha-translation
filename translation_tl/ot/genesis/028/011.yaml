base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/011.yaml
  text: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
translation:
  language: tl
  text: Nakarating siya sa isang lugar[a] at doon nagpalipas ng gabi, sapagkat lumubog na ang araw. Kumuha siya ng isa sa mga bato roon[b], inilagay niya iyon sa may ulo niya[c], at nahiga sa lugar na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa lugar,” na may pantukoy. Isinaling “sa isang lugar” sapagkat unang binabanggit dito ang pook, bagaman magiging mahalaga ito sa kasunod na salaysay.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “Kumuha siya ng ilan sa mga bato roon.” Maaaring maunawaan ang pariralang Hebreo bilang partitivo mula sa pangmaramihang “mga bato,” bagaman karaniwang inuunawa na isang bato ang kinuha.'
    reason: alternative_reading
  - marker: c
    text: O “bilang ulunan niya.” Ang salitang Hebreo ay tumutukoy sa dako ng ulo o sa isang ulunan at hindi tiyak na nagsasabing nasa ilalim mismo ng ulo ang bato.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגַּע בַּמָּקוֹם
  choice: Nakarating siya sa isang lugar
  rationale: Sa konteksto ng paglalakbay, ang פגע na may בַּמָּקוֹם ay tumutukoy sa pagdating sa isang pook. Natural sa modernong Tagalog ang “nakarating” at hindi nito ipinahihiwatig na nagkataon lamang ang pagdating.
- source_word: וַיָּלֶן שָׁם
  choice: doon nagpalipas ng gabi
  rationale: Ang לון ay pananatili nang magdamag; malinaw at karaniwan sa Tagalog ang “nagpalipas ng gabi.”
- source_word: כִּי בָא הַשֶּׁמֶשׁ
  choice: sapagkat lumubog na ang araw
  rationale: Ang בוא kapag araw ang simuno ay idyoma para sa paglubog nito. Ipinakikita ng “na” na ito ang dahilan ng paghinto niya.
- source_word: וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם
  choice: Kumuha siya ng isa sa mga bato roon
  rationale: Maaaring partitivo ang מִן na sinusundan ng pangmaramihang “mga bato.” Pinili ang karaniwang pag-unawang iisang bato ang kinuha, habang inilalahad sa talababa ang posibleng pangmaramihang pagbasa.
- source_word: מְרַאֲשֹׁתָיו
  choice: sa ulunan niya
  rationale: Tumutukoy ang salita sa dako ng ulo o sa ulunan, at hindi nito tiyak na sinasabing nasa ilalim mismo ng ulo ang bato. Pinananatili ng “sa ulunan niya” ang lawak ng kahulugan.
- source_word: וַיִּשְׁכַּב
  choice: nahiga
  rationale: Ipinahahayag nito ang paghiga o pagdapa upang magpahinga, hindi pa tahasang ang pagtulog.
- source_word: בַּמָּקוֹם הַהוּא
  choice: sa lugar na iyon
  rationale: Pinananatili ang pag-uulit ng “lugar,” na mahalaga sa daloy ng salaysay.
