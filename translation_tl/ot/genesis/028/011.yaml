translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “sapagkat” para sa dignidad ng salaysay, “roon” upang maiwasan ang mabigat na pag-uulit sa gitna ng talata, at muling ginamit ang “lugar” sa hulihan upang mapanatili ang diin ng tekstong Hebreo.
