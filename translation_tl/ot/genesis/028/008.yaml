    rationale: Bagaman saklaw ito ng רָעוֹת, ang “sa paningin ni Isaac” sa kontekstong ito ay tumutukoy sa hindi niya pagsang-ayon sa mga babaeng ito bilang mapapangasawa. Ang mas idiomatikong salin ay dapat magpanatili ng ganitong kontekstuwal na pagtataya nang hindi ginagawang mas tiyak ang moral na hatol.
