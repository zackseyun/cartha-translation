  verdict: revise
  source_fidelity: Ang רָעוֹת ay literal na maaaring “masama/hindi mabuti,” ngunit ang konstruksiyong “sa paningin ni Isaac” ay nagpapahayag ng hindi kanais-nais na pagtataya ni Isaac, hindi kinakailangang paghatol na moral na masama ang mga babae. Ang “nakita ni Esau na” ay tapat sa וַיַּרְא ... כִּי.
  naturalness: Likas ang ayos ng pangungusap at ang “sa paningin ng kanyang amang si Isaac.” Gayunman, ang payak na “masama” sa modernong Tagalog ay madaling mabasa bilang tahasang moral na kasamaan. Ang “hindi kanais-nais” ay mas malinaw na naghahatid ng kontekstuwal na idiom nang hindi nagdaragdag ng kahulugan.
  terminology: Pinanatili ang “Esau,” “Isaac,” at “mga anak na babae ng Canaan.” Ang huling parirala ay malapit sa Hebreo at angkop sa pormal na rehistro. Ang talababa ay nag-iingat ng literal na alternatibong “masama/hindi mabuti.”
  issues:
