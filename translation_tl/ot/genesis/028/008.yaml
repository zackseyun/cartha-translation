  text: And Esau saw that the daughters of Canaan were evil in the eyes of Isaac his father[a].
translation:
  language: tl
  text: At nakita ni Esau na hindi kanais-nais sa paningin ng kanyang amang si Isaac ang mga anak na babae ng Canaan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “masama” o “hindi mabuti.” Ang pang-uri sa Hebreo ay maaaring mangahulugang “masama” o “hindi mabuti,” ngunit dito, sa pariralang “sa paningin ni Isaac,” malamang na tumutukoy ito sa hindi niya pagsang-ayon sa mga babaeng Canaanita bilang mapapangasawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: At nakita
  rationale: Pinananatili ang karaniwang kahulugan ng ראה na “makita” at ang pagpapatuloy ng salaysay na ipinahihiwatig ng waw-consecutive, sa halip na tahasang gawing “naunawaan.”
- source_word: עֵשָׂו
  choice: Esau
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa makabagong saling Tagalog.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng nakita o napagtanto ni Esau, hindi ang dahilan nito.
- source_word: רָעוֹת
  choice: masama
  rationale: Tuwirang sinasalamin ng “masama” ang saklaw na “bad/evil” ng pang-uri, habang ang pariralang “sa paningin” ay nagpapakitang ito ay pagtataya ni Isaac sa kanila, lalo na bilang mapapangasawa.
- source_word: בְּנוֹת כְּנָעַן
  choice: ang mga anak na babae ng Canaan
  rationale: Pinananatili ang pampamilya at etnikong paglalarawan ng Hebreo sa halip na palitan agad ng mas interpretatibong “mga babaeng taga-Canaan.”
- source_word: בְּעֵינֵי
  choice: sa paningin ng
  rationale: Ito ay malinaw at likas na katumbas sa Tagalog ng idyomang Hebreo para sa pagtataya o pagtingin ng isang tao.
- source_word: יִצְחָק אָבִיו
  choice: kanyang amang si Isaac
  rationale: Natural sa Tagalog at malinaw na tinutukoy si Isaac bilang ama ni Esau.
