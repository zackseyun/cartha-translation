translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang idyomang “sa paningin” at ang literal na “mga anak na babae ng Canaan,” habang nilinaw ng ayos ng pangungusap kung sino ang tumitingin at sino ang itinuturing na masama.
