revisions:
- from: Bumangon ka at pumunta sa Padan-Aram, sa sambahayan ni Betuel na ama ng iyong ina. Mula roon, kumuha ka para sa iyong sarili ng mapapangasawa mula sa mga anak na babae ni Laban na kapatid ng iyong ina.[a]
  to: Bumangon ka at pumunta sa Padan-Aram, sa bahay ni Betuel, ang ama ng iyong ina, at mula roon ay kumuha ka para sa iyong sarili ng asawa mula sa mga anak na babae ni Laban, ang kapatid ng iyong ina.[a]
  rationale: Pinalitan ang “sambahayan” ng “bahay” upang mas tapat na maipahayag ang בֵּיתָה, at ang “mapapangasawa” ng “asawa” upang tumugma sa אִשָּׁה sa kontekstong ito. Inayos ang bantas at pagkakasunod upang malinaw na ang Betuel ang ama ng ina ni Jacob at si Laban ang kapatid ng ina niya, habang pinananatili ang daloy, mga utos, at tahasang pangkamag-anak na pananalita ng Hebreo.
  reviewer_model: gpt-5.6-terra
