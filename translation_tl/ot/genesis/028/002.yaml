base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/002.yaml
  text: Arise[a], go to Paddan-aram, to the house of Bethuel, your mother's father, and take for yourself from there a wife from the daughters of Laban, your mother's brother.
translation:
  language: tl
  text: Bumangon ka at pumunta sa Padan-Aram, sa bahay ni Betuel, ang ama ng iyong ina, at mula roon ay kumuha ka para sa iyong sarili ng asawa mula sa mga anak na babae ni Laban, ang kapatid ng iyong ina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas maikli at mas idyomatiko ang “iyong lolo sa ina” at “iyong tiyo.” Pinananatili sa pangunahing teksto ang mas tahasang mga katawagang pampamilya sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וּם
  choice: Bumangon ka
  rationale: Ang pautos na anyo ng קום ay nangangahulugang bumangon o tumindig. Natural at tuwiran sa modernong Tagalog ang “Bumangon ka” bago ang kasunod na utos na pumunta.
- source_word: לֵךְ֙
  choice: pumunta
  rationale: Karaniwang pautos ng הלך. Ang “pumunta” ay malinaw na nagpapahayag ng pagkilos patungo sa tinukoy na lugar.
- source_word: פַּדֶּ֣נָֽה אֲרָ֔ם
  choice: sa Padan-Aram
  rationale: Pangalan ng lugar na tinumbasan sa transliterasyong madaling basahin sa Tagalog; ang hulaping paturol ng direksiyon ay ipinahayag ng “sa.”
- source_word: בֵּ֥יתָה בְתוּאֵ֖ל
  choice: sa sambahayan ni Betuel
  rationale: Ang בַּיִת ay maaaring tumukoy sa bahay o sambahayan. Sa konteksto ng pagpunta sa angkan ni Betuel upang humanap ng mapapangasawa, natural ang “sambahayan” at napapanatili ang diwang pampamilya.
- source_word: אֲבִ֣י אִמֶּ֑ךָ
  choice: ama ng iyong ina
  rationale: Malapit sa literal na Hebreong “ama ng iyong ina,” at hindi tahimik na pinapalitan ng mas maikling katawagang “lolo.”
- source_word: וְקַח לְךָ֤
  choice: kumuha ka para sa iyong sarili
  rationale: Pinananatili ng “kumuha” ang pangunahing diwa ng לקח at ng “para sa iyong sarili” ang personal na pakinabang o layon na ipinahihiwatig ng לְךָ.
- source_word: מִשָּׁם֙
  choice: Mula roon
  rationale: Tahasang pinananatili ang pang-ukol na מִן at ang pagtukoy sa lugar.
- source_word: אִשָּׁ֔ה
  choice: mapapangasawa
  rationale: Sa konteksto ng paghahanap ng babaeng pakakasalan, natural at tiyak sa Tagalog ang “mapapangasawa,” sa halip na pangkalahatang “babae.”
- source_word: מִבְּנ֥וֹת לָבָ֖ן
  choice: mula sa mga anak na babae ni Laban
  rationale: 'Pinananatili ang partitive na diwa: pipili siya mula sa mga anak na babae ni Laban.'
- source_word: אֲחִ֥י אִמֶּֽךָ
  choice: kapatid ng iyong ina
  rationale: Malapit sa literal na Hebreong pagpapahayag at hindi agad pinaiikli bilang “tiyuhin.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” upang maipahayag ang bahay bilang angkan o sambahayan, at pinanatili ang tahasang Hebreong mga ugnayang pampamilya. Inilagay ang pananda ng talababa sa dulo ng pangungusap sapagkat kapuwa nitong nililinaw ang dalawang pariralang pangkamag-anakan.
