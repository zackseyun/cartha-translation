base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/009.yaml
  text: So Esau went to Ishmael and took Mahalath[a], the daughter of Ishmael son of Abraham, the sister of Nebaioth, as a wife for himself in addition to his wives.
translation:
  language: tl
  text: Kaya pumunta si Esau kay Ismael at kinuha niya si Mahalat, na anak ni Ismael, na anak ni Abraham, at kapatid na babae ni Nebayot, upang maging asawa niya, bukod pa sa mga asawa niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang karagdagan sa mga asawa niya.” Ipinahihiwatig ng pariralang Hebreo na si Mahalat ay isa pang asawa, hindi kapalit ng mga dati nang asawa ni Esau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ עֵשָׂו אֶל יִשְׁמָעֵאל
  choice: pumunta si Esau kay Ismael
  rationale: Ang wayyiqtol ng הלך ay nagsasalaysay ng kasunod na kilos; natural sa Tagalog ang “pumunta,” at ang אֶל na tumutukoy sa tao ay angkop na isinalin na “kay.”
- source_word: וַיִּקַּח
  choice: kinuha niya
  rationale: Pinananatili nito ang karaniwang kahulugan ng לקח at ang Hebreong idyoma; nililinaw ng kasunod na “upang maging asawa niya” ang diwang pag-aasawa.
- source_word: מָחֲלַת
  choice: Mahalat
  rationale: Isina-Filipino ang transliterasyon ng pangalang Hebreo nang hindi isinasalin ang kahulugan nito.
- source_word: בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם
  choice: anak ni Ismael na anak ni Abraham
  rationale: Tapat ito sa magkakaugnay na pariralang pangangkanan at malinaw sa modernong Tagalog.
- source_word: אֲחוֹת נְבָיוֹת
  choice: kapatid ni Nebayot
  rationale: Direkta at natural na paglalarawan kay Mahalat; hindi tinutukoy ng anyong Tagalog ang kasarian ng kapatid, ngunit malinaw na babae si Mahalat sa konteksto.
- source_word: עַל נָשָׁיו
  choice: bukod pa sa mga asawa niya
  rationale: 'Sa kontekstong ito, ang עַל ay nagpapahayag ng pagdaragdag: naging isa pang asawa si Mahalat kasama ng mga dati nang asawa ni Esau.'
- source_word: לוֹ לְאִשָּׁה
  choice: upang maging asawa niya
  rationale: Natural na Tagalog ito para sa layon o kinalabasan ng pagkuha sa kaniya bilang asawa, at naipahihiwatig ang reflexive na לוֹ.
theological_decisions:
- issue: Kung ang pagkuha kay Mahalat ay kapalit o dagdag sa mga dati nang asawa
  choice: dagdag sa mga dati nang asawa
  alternative: kapalit ng mga asawa niya
  rationale: Ang עַל נָשָׁיו ay pinakaangkop unawain dito bilang pagdaragdag, hindi pagpapalit; hindi rin nagbibigay ang talata ng teolohikal na paghatol sa kilos.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinanatili ang Hebreong idyomang “kinuha” ngunit nilinaw ang layong pag-aasawa. Ginamit ang mga anyong pangalang Ismael, Mahalat, at Nebayot na angkop sa bigkas at baybay sa Filipino.
