base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/004.yaml
  text: May he give you the blessing of Abraham[a], to you and to your offspring with you, so that you may possess the land of your sojournings[b], which God gave to Abraham.
translation:
  language: tl
  text: Ipagkaloob nawa niya sa iyo ang pagpapala ni Abraham—sa iyo at sa iyong lahi[a] na kasama mo—upang maangkin[b] mo ang lupaing tinatahanan mo bilang dayuhan, na ibinigay ng Diyos kay Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “binhi”; iisa ang anyo ng pangngalan sa Hebreo ngunit kolektibo ang kahulugan.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “upang manahin mo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Ipagkaloob nawa niya
  rationale: Ang anyong jussive sa konteksto ng pagbabasbas ay likas na ipinahahayag bilang hangarin o panalangin sa pamamagitan ng “nawa.”
- source_word: בִּרְכַּת אַבְרָהָם
  choice: ang pagpapala ni Abraham
  rationale: Pinananatili ang payak na ugnayang construct sa Hebreo at ang malinaw na pagtukoy sa pagpapalang kaugnay ng tipan kay Abraham, nang hindi ito ginagawang pangkalahatang kasaganaan.
- source_word: לְךָ וּלְזַרְעֲךָ אִתָּךְ
  choice: sa iyo at sa iyong lahi na kasama mo
  rationale: Ang “lahi” ay natural na kolektibong katumbas ng זֶרַע sa Filipino. Pinanatili ang “na kasama mo” dahil hayag ito sa Hebreo at iniuugnay ang magiging lahi ni Jacob sa kaniya.
- source_word: לְרִשְׁתְּךָ
  choice: upang maangkin mo
  rationale: Ang infinitive na may לְ ay nagpapahayag ng layunin o bunga. Ang “maangkin” ay angkop sa pagpasok sa pag-aari ng lupain, habang ang diwang “manahin” ay inilagay bilang leksikal na alternatibo sa talababa.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: ang lupaing pinanirahan mo bilang dayuhan
  rationale: Malinaw at natural nitong ipinahahayag ang pamumuhay bilang pansamantalang naninirahan o residenteng dayuhan, sa halip na ipakahulugang basta paglalakbay o paglalagalag.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם
  choice: na ibinigay ng Diyos kay Abraham
  rationale: Tuwirang salin ng sugnay na panuring; ang אֱלֹהִים ay wastong isinaling “Diyos.”
theological_decisions:
- issue: Diwa ng tipang Abrahamiko
  choice: Pinanatili ang “pagpapala ni Abraham” at ang pag-angkin sa lupain.
  alternative: “Ang pagpapalang ipinangako kay Abraham” at “upang manahin mo ang lupain.”
  rationale: Tahasang iniuugnay ng talata ang basbas ni Isaac sa pangako kay Abraham. Hindi pinalawak ang “pagpapala” tungo sa isang tiyak na uri ng materyal na kasaganaan, at hindi rin pinili sa pangunahing teksto ang “manahin,” sapagkat ang pandiwa ay maaari ring tumukoy nang mas tuwiran sa pag-angkin o pag-aari.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nawa” para sa pormal na pagbabasbas, “lahi” para sa natural na kolektibong diwa, at “pinanirahan bilang dayuhan” upang malinaw na maihatid ang patriyarkal na kalagayan ng pansamantalang paninirahan. Ang mga gatlang ay naghihiwalay sa inuulit na tatanggap ng pagpapala nang hindi binabago ang ugnayang sintaktiko.
