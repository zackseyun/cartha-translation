id: GEN.28.13
reference: Genesis 28:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָי/ו֮ וַ/יֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔י/ךָ וֵ/אלֹהֵ֖י יִצְחָ֑ק הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔י/הָ לְ/ךָ֥ אֶתְּנֶ֖/נָּה וּ/לְ/זַרְעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/013.yaml
  text: And behold[a], Yahweh was standing above it, and he said, “I am Yahweh, the God of Abraham your father and the God of Isaac[b]. The land on which you are lying I will give to you and to your offspring.”
translation:
  language: tl
  text: At naroon si Yahweh, nakatayo sa ibabaw nito[a], at sinabi niya, “Ako si Yahweh, ang Diyos ni Abraham na iyong ama at ang Diyos ni Isaac. Ang lupaing hinihigaan mo ay ibibigay ko sa iyo at sa iyong lahi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa tabi niya” o “sa ibabaw niya” kung si Jacob, at hindi ang hagdanan, ang tinutukoy ng panghalip.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “binhi”; isang pangngalang isahan na may kolektibong diwang tumutukoy sa mga inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At naroon
  rationale: Pinananatili ang biglang presentatibo at masiglang puwersa ng Hebreo nang hindi gumagamit ng lipas o di-likas na panawagang “masdan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: נִצָּב
  choice: nakatayo
  rationale: Ipinapakita ng participle ang nagpapatuloy na kalagayan sa loob ng pangitain.
- source_word: עָלָיו
  choice: sa ibabaw nito
  rationale: Ang pinakamalapit na posibleng tinutukoy sa konteksto ay ang hagdanan, bagaman maaaring si Jacob ang tinutukoy; pinananatili sa talababa ang kalabuan.
- source_word: אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: ang Diyos ni Abraham na iyong ama
  rationale: Malapit ito sa ayos ng Hebreo at hindi nilulutas nang labis kung paanong ginagamit ang “ama” para sa ninuno.
- source_word: הָאָרֶץ
  choice: Ang lupain
  rationale: Ang “lupain” ang angkop na kahulugan sa konteksto ng pangako, hindi lamang ang mismong lupa sa ilalim ni Jacob.
- source_word: שֹׁכֵב עָלֶיהָ
  choice: hinihigaan mo
  rationale: Natural sa makabagong Tagalog at ipinahihiwatig ang kasalukuyan at nagpapatuloy na kilos.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: ay ibibigay ko sa iyo
  rationale: Ang imperfect ay inuunawa bilang hinaharap sa konteksto ng banal na pangako.
- source_word: וּלְזַרְעֶךָ
  choice: at sa iyong lahi
  rationale: Ang “lahi” ay natural na kolektibong pangngalan sa Tagalog at pinananatili ang kolektibong diwa ng singular na זֶרַע.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ay nagpapanatili rito sa halip na palitan ng titulo.
- issue: Tinutukoy ng עָלָיו sa tagpo ng pangitain
  choice: sa ibabaw nito, na tumutukoy sa hagdanan
  alternative: sa tabi niya o sa ibabaw niya, na tumutukoy kay Jacob
  rationale: Ang hagdanan ang pinakamalapit na antecedent sa konteksto, ngunit tunay na malabo ang panghalip kaya inilalahad ang ibang pagbasa sa talababa.
- issue: Kahulugan ng אָבִיךָ kaugnay ni Abraham
  choice: Abraham na iyong ama
  alternative: Abraham na iyong ninuno
  rationale: Pinananatili ang mismong katawagang “ama” ng Hebreo at ang malawak nitong pangninunong gamit nang hindi ito tahasang pinapalitan ng interpretasyong “ninuno.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “At naroon” bilang natural na presentatibong katumbas ng וְהִנֵּה; iniwasan ang labis na makaluma o denominasyonal na pananalita.
