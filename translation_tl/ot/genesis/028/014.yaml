  source_fidelity: 'Ang pangunahing salin ay tapat sa pangako: ang supling ay inihahambing sa alabok ng lupa, si Jacob ay lalaganap sa apat na direksiyon, at ang lahat ng angkan sa lupa ay pagpapalain sa kanya at sa kanyang supling. Gayunman, ang talababa ay nagdaragdag ng ideyang wala sa Hebreo—ang paggamit ng mga pangalan sa pagbigkas ng pagpapala. Dapat nitong ipakita lamang ang posibleng reflexive/middle na pagbasa ng וְנִבְרֲכוּ.'
