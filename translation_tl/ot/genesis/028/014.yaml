  terminology: Ang “supling,” “alabok ng lupa,” “lalaganap,” at “angkan” ay angkop. Pinananatili ng “sa iyo ... sa iyong supling” ang pormula ng Hebreong pang-ukol nang hindi ipinapasok ang interpretibong “sa pamamagitan.”
  issues:
