base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/014.yaml
  text: Your offspring will be like the dust of the earth[a], and you will spread out to the west and to the east and to the north and to the south; and in you and in your offspring all the families of the earth will be blessed.
translation:
  language: tl
  text: Ang iyong supling ay magiging tulad ng alabok ng lupa, at lalaganap ka sa kanluran at sa silangan, sa hilaga at sa timog. At sa iyo at sa iyong supling ay pagpapalain ang lahat ng angkan sa lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “At pagpapalain ng lahat ng angkan sa lupa ang kanilang sarili sa iyo at sa iyong supling.” Maaaring unawain ang pandiwang Hebreo sa reflexive o middle na diwa.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה זַרְעֲךָ
  choice: Ang iyong lahi ay magiging
  rationale: Ang זֶרַע ay kolektibong tumutukoy sa mga supling o inapo. Likas sa modernong Tagalog ang “lahi” at napananatili nito ang kolektibong diwa nang hindi ginagawang tahasang maramihan.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: tulad ng alabok ng lupa
  rationale: Pinananatili ang paghahambing na nagpapahiwatig ng di-mabilang na dami; natural at malinaw sa Tagalog ang “alabok ng lupa.”
- source_word: וּפָרַצְתָּ
  choice: lalaganap ka
  rationale: Ang pandiwa ay may diwang pagputok o paglaganap palabas. Sa konteksto ng pagdami at heograpikong paglawak, malinaw na naihahayag ito ng “lalaganap.”
- source_word: יָמָּה וָקֵדְמָה וְצָפֹנָה וָנֶגְבָּה
  choice: sa kanluran at sa silangan, sa hilaga at sa timog
  rationale: Ipinahihiwatig ng mga anyong Hebreo ang direksiyon. Ang apat na karaniwang direksiyon ang natural na salin; sa seryeng ito, ang נֶגֶב ay “timog,” hindi ang pangalang Negeb.
- source_word: וְנִבְרֲכוּ
  choice: ay pagpapalain
  rationale: Ang Niphal ng ברך ay makatuwirang basahing pasibo sa pormula ng pangakong patriyarkal. Inilalahad sa talababa ang tunay na posibleng reflexive o middle na pagbasa.
- source_word: בְךָ ... וּבְזַרְעֶךָ
  choice: sa iyo at sa iyong lahi
  rationale: Pinananatili ng “sa” ang Hebreong ב at iniiwasang ipasok sa pangunahing teksto ang mas interpretibong “sa pamamagitan ng.”
- source_word: כָּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: ang lahat ng angkan sa lupa
  rationale: Ang מִשְׁפָּחוֹת ay mga pangkat na magkakamag-anak o angkan. Mas angkop ang “angkan” kaysa “pamilya” para sa malalawak na grupong tinutukoy, at unibersal ang saklaw ng “lupa” rito.
theological_decisions:
- issue: Kahulugan ng Niphal na וְנִבְרֲכוּ sa pormula ng pagpapalang patriyarkal
  choice: 'Pasibo: “pagpapalain ang lahat ng angkan sa lupa”'
  alternative: 'Reflexive/middle: “gagamitin ng lahat ng angkan sa lupa ang iyong pangalan at ang pangalan ng iyong lahi sa pagbigkas ng pagpapala para sa kanilang sarili”'
  rationale: Tuwiran at matibay na pagbasa sa konteksto ng pangako ang pasibo, ngunit maaaring taglayin ng anyong Hebreo ang reflexive o middle na diwa. Pinananatili sa talababa ang alternatibo upang hindi tahimik na lutasin ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lahi” bilang kolektibong katawagan sa mga supling, “lalaganap” para sa masiglang paglawak, at “angkan” para sa malalawak na grupong magkakamag-anak. Inilagay ang bantas upang maging natural ang daloy nang hindi binabago ang pagkakasunod ng mga ideya.
