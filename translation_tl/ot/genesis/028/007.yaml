  text: and that Jacob listened to his father and his mother[a], and went to Paddan-aram.
translation:
  language: tl
  text: at nakinig si Jacob sa kanyang ama at sa kanyang ina[a], at pumunta siya sa Padan-Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumunod si Jacob sa kanyang ama at sa kanyang ina.” Ang pandiwang Hebreo ay maaaring mangahulugang kapwa pakikinig at pagtalima sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: nakinig
  rationale: Ang שׁמע na may אֶל ay maaaring mangahulugang makinig o tumalima. Sa konteksto, tumugon si Jacob sa tagubilin ng kanyang mga magulang; pinananatili ng “nakinig” ang parehong diwang pakikinig at pagsunod nang hindi nililimitahan ang kahulugan sa tahasang “sumunod.”
- source_word: אֶל אָבִיו וְאֶל אִמּוֹ
  choice: sa kanyang ama at sa kanyang ina
  rationale: Pinananatili ang inulit na pang-ukol at ang dalawang hulaping paari ng Hebreo, habang nananatiling natural sa modernong Tagalog.
- source_word: וַיֵּלֶךְ
  choice: pumunta siya
  rationale: Tuwirang at likas na salin ng karaniwang pandiwang הלך sa kontekstong nagsasalaysay.
- source_word: פַּדֶּנָה אֲרָם
  choice: sa Padan-Aram
  rationale: Itinuturing itong pangalan ng lugar at tinutumbasan ng “sa” ang hulaping patungo sa Hebreo. Ginamit ang anyong Padan-Aram na madaling basahin sa Tagalog.
- source_word: וַ
  choice: at
  rationale: Ipinagpapatuloy ng waw ang naunang pangungusap at pagkakasunod-sunod ng salaysay; pinananatili ng “at” ang sintaktikong ugnayan ng talata sa konteksto.
