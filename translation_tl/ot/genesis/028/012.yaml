base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/012.yaml
  text: And he dreamed[a], and behold, a ladder was set up on the earth, and its top reached to heaven; and behold[b], the angels of God were ascending and descending on it.
translation:
  language: tl
  text: 'At nanaginip siya, at narito: may isang hagdanan[a] na nakatayo sa lupa, at ang tuktok nito ay umaabot sa langit; at narito, ang mga anghel ng Diyos ay umaakyat at bumababa rito.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “hagdan.” Maaaring tumukoy ang salitang Hebreo nang mas pangkalahatan sa isang kayariang paakyatan.'
    reason: lexical_alternative
  - marker: b
    text: O marahil, “sa kanya,” bagaman ang hagdanan ang pinakamalapit at pinakanatural na tinutukoy sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּחֲלֹם
  choice: At nanaginip siya
  rationale: Pinananatili ng “At” ang pagsulong ng salaysay na ipinahihiwatig ng wayyiqtol, habang natural sa makabagong Tagalog ang “nanaginip siya.”
- source_word: וְהִנֵּה
  choice: naroon / Naroon din
  rationale: Ipinahahayag nito ang biglang, matingkad na paglitaw ng tanawin sa panaginip nang hindi gumagamit ng lipas o pilit na padamdam.
- source_word: סֻלָּם
  choice: hagdanan
  rationale: Ang salitang Hebreo ay tumutukoy sa isang kayariang ginagamit sa pag-akyat at pagbaba ngunit hindi tiyak kung hagdang may baytang, hagdanang pahilis, o ibang katulad na kayarian. Mas malawak ang “hagdanan” kaysa sa “hagdan.”
- source_word: מֻצָּב אַרְצָה
  choice: nakatayo sa lupa
  rationale: Ipinakikita ang kayariang nakapuwesto at matatag na nakatindig sa lupa, kasalungat ng tuktok nitong umaabot sa langit.
- source_word: וְרֹאשׁוֹ מַגִּיעַ הַשָּׁמָיְמָה
  choice: at ang tuktok nito ay umaabot sa langit
  rationale: Ang “tuktok” ang likas na katumbas ng רֹאשׁ para sa pinakamataas na bahagi ng isang bagay; ang “umaabot” ay nagpapanatili sa diwang patuloy na inilalarawan ng participle.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: mga anghel ng Diyos
  rationale: Sa pangitaing ito, mga makalangit na nilalang ang tinutukoy, kaya mas angkop ang “mga anghel” kaysa sa pangkalahatang “mga mensahero.”
- source_word: עֹלִים וְיֹרְדִים
  choice: umaakyat at bumababa
  rationale: Natural na inilalarawan sa Tagalog ng mga pandiwang ito ang nagpapatuloy na galaw sa pangitain.
- source_word: בּוֹ
  choice: rito
  rationale: Ang pinakamalapit at pinakanatural na pinatutungkulan ay ang hagdanan. Pinananatili ng “rito” ang maikling panghalip na pahayag, habang inilalahad sa talababa ang posibleng ibang pagbasa.
theological_decisions:
- issue: Larawan ng סֻלָּם
  choice: hagdanan
  alternative: hagdan
  rationale: Hindi tinutukoy nang eksakto ng salitang Hebreo ang anyo ng kayarian. Ang “hagdanan” ay hindi naggigiit na isa itong makitid na hagdang may mga tuntungan, samantalang nananatiling malinaw ang pag-akyat at pagbaba.
- issue: Tinutukoy ng בּוֹ
  choice: rito, na tumutukoy sa hagdanan
  alternative: sa kanya, na maaaring tumukoy kay Jacob
  rationale: Panlalaking isahan ang hulaping panghalip sa Hebreo, kaya posible sa gramatika ang “sa kanya.” Gayunman, ang hagdanan ang pinakamalapit at pinakanatural na pinatutungkulan sa konteksto. Inilalagay sa talababa ang tunay na kalabuan sa halip na ipasok sa pangunahing teksto ang isang teolohikong pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “naroon” upang maipakita ang matingkad na pagpapakilala ng וְהִנֵּה nang hindi gumagamit ng arkaikong “masdan.” Ang “hagdanan” ay madaling maunawaan ngunit sapat na malawak upang huwag labis na tukuyin ang anyo ng סֻלָּם.
