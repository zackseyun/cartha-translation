translation_notes:
  register: Modernong Filipino na may dignidad at malinaw sa karaniwang mambabasa. Hinati sa dalawang pangungusap ang mahabang hanay ng mga pariralang naglalarawan upang maging natural at madaling sundan, nang hindi binabago ang mga ugnayang pampamilya sa Hebreo.
