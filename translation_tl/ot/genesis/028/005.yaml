- from: Kaya pinayaon ni Isaac si Jacob, at pumunta siya sa Padan-Aram, kay Laban na anak ni Betuel na Arameo[a]. Si Laban ay kapatid ni Rebeca, na ina nina Jacob at Esau.
  to: Kaya ipinadala ni Isaac si Jacob, at nagtungo siya sa Padan-Aram, kay Laban na anak ni Betuel na Arameo[a], ang kapatid ni Rebeca, ang ina nina Jacob at Esau.
  rationale: Pinalitan ang pandiwang maaaring magpahiwatig ng simpleng pagpapahintulot ng mas tuwirang “ipinadala,” at pinahusay ang daloy ng pangungusap nang pinananatili ang buong hanay ng pagkakakilanlan sa Hebreo. Nilinaw din ang saklaw ng alternatibong salin sa talababa.
