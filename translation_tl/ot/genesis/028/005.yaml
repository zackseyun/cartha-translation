base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/005.yaml
  text: So Isaac sent Jacob away[a], and he went to Paddan-aram, to Laban son of Bethuel the Aramean, the brother of Rebekah, the mother of Jacob and Esau.
translation:
  language: tl
  text: Kaya ipinadala ni Isaac si Jacob, at nagtungo siya sa Padan-Aram, kay Laban na anak ni Betuel na Arameo[a], ang kapatid ni Rebeca, ang ina nina Jacob at Esau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang mas lumang saling Ingles, “Siryo.” Mas tiyak na tumutukoy ang Hebreo sa isang Arameo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: pinayaon
  rationale: Sa kontekstong ito, ang שׁלח ay pagpapalis o pagpapaalis upang maglakbay. Ang “pinayaon” ay likas at marangal na Filipino at malinaw na nagpapahiwatig na pinapunta ni Isaac si Jacob.
- source_word: וַיֵּלֶךְ
  choice: pumunta siya
  rationale: Ang הלך ay karaniwang pandiwang “pumunta” o “lumakad.” Dito, “pumunta siya” ang natural na paglalarawan ng paglalakbay patungo sa isang tiyak na lugar.
- source_word: פַּדֶּנָה אֲרָם
  choice: sa Padan-Aram
  rationale: Pangalan ito ng lugar; ang hulaping paturol sa direksiyon ay likas na naipapahayag ng “sa” kasunod ng pandiwang “pumunta.”
- source_word: בֶּן בְּתוּאֵל
  choice: anak ni Betuel
  rationale: Ito ang natural na modernong Filipino para sa karaniwang ugnayang “son of Bethuel”; hindi kailangang idagdag ang “lalaking” sapagkat malinaw ang tinutukoy.
- source_word: הָאֲרַמִּי
  choice: na Arameo
  rationale: Mas tiyak sa kasaysayan at etnisidad ang “Arameo” kaysa sa tradisyonal na “Siryo,” at tuwirang kumakatawan sa אֲרַמִּי.
- source_word: אֲחִי רִבְקָה
  choice: kapatid ni Rebeca
  rationale: Natural at tapat na Filipino para sa konstruksiyong nagsasaad na si Laban ang kapatid ni Rebeca.
- source_word: אֵם יַעֲקֹב וְעֵשָׂו
  choice: ina nina Jacob at Esau
  rationale: Pinananatili nito ang tahasang pagkakakilanlan kay Rebeca at ginagamit ang wastong pangmaramihang pantukoy na “nina.”
