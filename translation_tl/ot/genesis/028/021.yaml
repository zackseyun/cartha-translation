  text: וְ/שַׁבְתִּ֥י בְ/שָׁל֖וֹם אֶל בֵּ֣ית אָבִ֑/י וְ/הָיָ֧ה יְהוָ֛ה לִ֖/י לֵ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/021.yaml
  text: and I return in peace to my father's house[a], and Yahweh will be my God.
translation:
  language: tl
  text: at makabalik ako nang payapa sa bahay ng aking ama[a], at si Yahweh ang magiging Diyos ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at makabalik ako nang ligtas sa bahay ng aking ama.” Ang Hebreong pariralang isinaling “nang payapa” ay maaari ring magdiin sa ligtas na pagbabalik o mabuting kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: at makabalik ako
  rationale: Ang pandiwang mula sa שׁוב ay nangangahulugang “bumalik.” Ang anyong “makabalik” ay natural sa Filipino bilang pagpapatuloy ng kondisyon sa panata ni Jacob sa mga naunang talata, nang hindi ginagawang tahasang hiwalay na pangungusap ang sugnay.
- source_word: בְשָׁלוֹם
  choice: nang payapa
  rationale: Saklaw ng שָׁלוֹם ang kapayapaan, kaligtasan, at mabuting kalagayan. Pinananatili ng “nang payapa” ang malawak na diwa, samantalang inilalahad sa talababa ang mas tiyak na posibilidad na “nang ligtas.”
- source_word: אֶל בֵּית אָבִי
  choice: sa bahay ng aking ama
  rationale: Tuwirang ipinapahayag nito ang bahay o sambahayan ng ama at malinaw ito sa karaniwang modernong Filipino.
- source_word: וְהָיָה
  choice: at ... ang magiging
  rationale: Pinananatili ang Hebreong pang-ugnay na “at” at ang hinaharap na resulta sa pamamagitan ng “magiging,” nang hindi nagdaragdag ng tahasang “kung gayon” na wala bilang hiwalay na salita sa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יהוה bilang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: לִי לֵאלֹהִים
  choice: ang magiging Diyos ko
  rationale: Ang literal na “magiging Diyos para sa akin” ay likas na ipinapahayag sa Filipino bilang “magiging Diyos ko,” na pinananatili ang ugnayang ipinahihiwatig ng Hebreo.
theological_decisions:
- issue: Kung ang pahayag ni Jacob ay kondisyunal na pagtanggap kay Yahweh o simpleng panatang kumikilala sa kanya
  choice: Panatilihin ang pahayag bilang pagpapatuloy ng kondisyunal na panata, ngunit gamitin ang tuwirang pang-ugnay na “at.”
  alternative: 'Gawing tahasang resulta: “kung gayon, si Yahweh ang magiging Diyos ko,” o gawing ganap na walang kondisyon ang pahayag.'
  rationale: Ang sugnay ay nagpapatuloy sa kondisyunal na pagkakasunod mula sa mga naunang talata, ngunit וְ ay tuwirang “at.” Ang “makabalik” ay nagpapanatili sa pagkakaugnay sa kondisyon, habang ang “at” ay umiiwas sa pagdaragdag ng mas tahasang lohikal na panandang wala sa mismong teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahay ng aking ama” sa halip na mas pormal o arkaikong ayos, at pinanatili ang pangalang “Yahweh.”
