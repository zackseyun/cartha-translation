base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/006.yaml
  text: Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to take a wife for himself from there[a], and that when he blessed him, he commanded him, saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: tl
  text: Nakita ni Esau na binasbasan ni Isaac si Jacob at ipinadala siya sa Padan-Aram upang kumuha roon ng mapapangasawa para sa sarili niya. Nakita rin niya na nang basbasan ni Isaac si Jacob, iniutos niya sa kanya, “Huwag kang kumuha ng mapapangasawa mula sa mga babaeng taga-Canaan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “mula sa mga anak na babae ng Canaan.”
    reason: Ipinapakita ang literal na anyo ng idyomang Hebreo sa likod ng mas natural na saling “mga babaeng taga-Canaan.”
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nakita ni Esau / Nalaman din niya
  rationale: Ang ראה ay literal na “makita” ngunit sa konstruksiyong “nakita na” ay tumutukoy rin sa pagkaalam o pagkabatid. Hinati sa dalawang likas na pangungusap sa Filipino at inulit bilang “Nalaman din niya” upang malinaw na parehong saklaw ng napagtanto ni Esau ang mga kasunod na pangyayari.
- source_word: בֵרַךְ
  choice: binasbasan
  rationale: Karaniwan at marangal na salin ng pandiwang tumutukoy sa pagbibigay ng basbas; malinaw na nauna ito sa pagkakita o pagkaalam ni Esau.
- source_word: וְשִׁלַּח אֹתוֹ
  choice: at pinapunta ito
  rationale: Ipinahihiwatig ng konteksto ang pagpapadala kay Jacob patungo sa isang lugar; natural sa modernong Filipino ang “pinapunta” at malinaw ang tinutukoy ng “ito.”
- source_word: פַּדֶּנָה אֲרָם
  choice: sa Padan-Aram
  rationale: Tinumbasan bilang transliteradong pangalan ng lugar, gamit ang baybay na madaling basahin sa Filipino.
- source_word: לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  choice: upang kumuha roon ng mapapangasawa para sa sarili
  rationale: Pinananatili ang layuning ipinapahayag ng infinitibo, ang kahulugang “mula roon,” at ang reflexive na לוֹ. Mas natural sa Filipino ang “mapapangasawa” kaysa sa literal na “asawa” sa ganitong konteksto.
- source_word: בְּבָרֲכוֹ אֹתוֹ
  choice: nang basbasan ni Isaac si Jacob
  rationale: Isinasalin ang ב bilang panahong kalagayan. Inulit ang mga pangalan upang maiwasan ang kalituhan ng magkakasunod na panghalip.
- source_word: וַיְצַו עָלָיו לֵאמֹר
  choice: iniutos niya rito
  rationale: Ang צוה ay may malinaw na puwersa ng pag-uutos. Hindi na isinalin nang hiwalay ang quotative na “sinasabi” sapagkat sapat at mas natural sa Filipino ang kasunod na tuwirang sipi.
- source_word: לֹא תִקַּח
  choice: Huwag kang kumuha
  rationale: Likas na anyo ng tahasang pagbabawal sa Filipino at pinananatili ang puwersa ng utos.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: mula sa mga babaeng Cananeo
  rationale: Natural na Filipino para sa mga babaeng kabilang sa Canaan; inilalagay sa talababa ang literal na idyomang Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Hinati ang mahabang Hebreong pangungusap upang maging madaling maunawaan, ngunit pinanatili sa ikalawang pangungusap na bahagi rin ng nalaman ni Esau ang utos ni Isaac. Ginamit ang “ito/rito” para sa taong nabanggit na, alinsunod sa pormal ngunit natural na gamit sa Filipino.
