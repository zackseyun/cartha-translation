  - severity: low
    issue: Ang “ito/rito” ay hindi ang pinakanatural na panghalip para kina Jacob sa naratibong ito.
    rationale: Para sa taong tinutukoy, mas karaniwang modernong gamit ang “siya” at “sa kanya”; iniiwasan din ng pagbanggit muli sa mga pangalan ang kalituhan.
