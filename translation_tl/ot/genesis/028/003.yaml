  to: Pagpalain ka nawa ng Makapangyarihang Diyos[a], gawin ka niyang mabunga at paramihin, upang ikaw ay maging isang kalipunan ng mga bayan.
  rationale: Inayos ang huling sugnay para sa higit na likas na modernong Filipino at idinagdag ang “isang” upang maging maayos ang pangngalang panaguri. Ang “niya” sa magkakaugnay na pandiwa ay nagpapalinaw na ang Makapangyarihang Diyos ang gumagawa, nang hindi binabago ang jussive na basbas o ang kahulugan ng pinagmulan.
