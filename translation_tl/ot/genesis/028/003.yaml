  yaml_path: translation/ot/genesis/028/003.yaml
  text: And may God Almighty bless you[a], and make you fruitful, and multiply you[b], so that you may become an assembly of peoples.
translation:
  language: tl
  text: Pagpalain ka nawa ng Makapangyarihang Diyos[a], gawin ka niyang mabunga at paramihin, upang ikaw ay maging isang kalipunan ng mga bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “El Shaddai.” Tradisyonal na isinasaling “Makapangyarihang Diyos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: Makapangyarihang Diyos
  rationale: Isinalin ang banal na titulo sa likas at kinikilalang Filipino; pinananatili ng “Diyos” ang אֵל at ipinapahayag ng “Makapangyarihan” ang tradisyonal na pagkaunawa sa שַׁדַּי.
- source_word: יְבָרֵךְ
  choice: Pagpalain ... nawa
  rationale: Ang anyong imperfect ay jussive sa konteksto ng basbas; malinaw na ipinahahayag ng “nawa” ang dalangin o hangarin, hindi isang payak na hula.
- source_word: וְיַפְרְךָ
  choice: gawin kang mabunga
  rationale: Pinananatili nito ang causative na diwa ng Hiphil ng פרה at likas itong pahayag sa Filipino, lalo na sa konteksto ng pagdami ng lahi.
- source_word: וְיַרְבֶּךָ
  choice: paramihin ka
  rationale: Tuwirang ipinapahayag nito ang causative na pagdami at hindi tahasang nililimitahan ang tinutukoy sa mga anak lamang.
- source_word: וְהָיִיתָ
  choice: upang maging ... ka
  rationale: Inihahayag ng “upang” ang kinalabasan o layuning kaugnay ng naunang mga basbas, habang pinananatili ang posibleng ugnayang semantiko ng sugnay.
- source_word: לִקְהַל עַמִּים
  choice: kalipunan ng mga bayan
  rationale: Ang “kalipunan” ay isang likas at malawak na katumbas ng קהל bilang pangkat o kapisanan; pinananatili ng “mga bayan” ang maramihang עַמִּים at ang diwang higit sa isang pangkat ng mga tao.
theological_decisions:
- issue: Paglalahad sa banal na titulong אֵל שַׁדַּי
  choice: Makapangyarihang Diyos
  alternative: El Shaddai
  rationale: Isinalin ang titulo sa pangunahing teksto upang agad itong maunawaan ng karaniwang mambabasa, samantalang inilagay sa talababa ang anyong Hebreo upang mapanatili ang leksikal na impormasyon nang hindi nagtatakda ng mas tiyak na kahulugan kaysa sa tradisyonal na salin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nawa” upang maging malinaw na ito ay basbas o dalangin. Iniwasan ang mas eklesiyastikong “kongregasyon” at pinili ang “kalipunan” para sa pangkalahatang kahulugan ng קהל.
