  naturalness: May bahagyang kabigatan sa “upang maging kalipunan ka ng mga bayan.” Mas likas sa makabagong Filipino ang tahasang panghalip na “upang ikaw ay maging isang kalipunan ng mga bayan.” Mainam ding ilahad ang Diyos bilang di-tahasang paksa ng magkakaugnay na pandiwa upang luminaw ang daloy.
  terminology: Ang “Makapangyarihang Diyos,” “mabunga,” “paramihin,” at “kalipunan ng mga bayan” ay angkop sa marangal ngunit madaling maunawaang rehistro. Hindi ipinapasok ng mga ito ang isang mas tiyak o sektaryang pagbasa.
