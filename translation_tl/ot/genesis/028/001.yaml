base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/001.yaml
  text: Then Isaac called Jacob and blessed him and commanded him[a], saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: tl
  text: 'Pagkatapos ay tinawag ni Isaac si Jacob, binasbasan niya ito, at inutusan niya ito: “Huwag kang kumuha ng asawa mula sa mga anak na babae ng Canaan.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa mga anak na babae ng Canaan,” isang idyomang tumutukoy sa mga babaeng Canaanita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Ang קרא na may אֶל at tumutukoy sa isang tao ay nangangahulugang tumawag o magpatawag; natural at sapat ang “tinawag” sa salaysay.
- source_word: וַיְבָרֶךְ
  choice: binasbasan
  rationale: Karaniwang katumbas ng ברך ang “binasbasan,” na malinaw at marangal sa modernong Filipino.
- source_word: וַיְצַוֵּהוּ
  choice: iniutos sa kanya
  rationale: Ipinahahayag ng צוה ang makapangyarihang pag-uutos, hindi lamang payo o tagubilin.
- source_word: וַיֹּאמֶר לוֹ
  choice: '[ipinakilala sa tuwirang pananalita nang walang hiwalay na pag-uulit ng “sinabi”]'
  rationale: Sa Filipino, mas natural na direktang sundan ng sipi ang “iniutos sa kanya”; nananatili ang tungkuling ipakilala ang mismong sinabi nang hindi nagiging paulit-ulit.
- source_word: לֹא תִקַּח
  choice: Huwag kang kumuha
  rationale: Natural na anyo ito ng mariing pagbabawal sa Filipino at tapat sa negatibong utos ng Hebreo.
- source_word: אִשָּׁה
  choice: asawa
  rationale: Sa konteksto ng pag-aasawa, ang אִשָּׁה ay tumutukoy sa asawang babae, hindi lamang sa isang babae.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: mula sa mga anak na babae ng Canaan
  rationale: Pinananatili ang literal na idyomang Hebreo at ang tekstura ng pinagmulan; ipinapaliwanag sa talababa na tumutukoy ito sa mga babaeng Canaanita.
- source_word: וַ
  choice: Pagkatapos
  rationale: Ipinahahayag nito nang natural ang sunod-sunod na kilos sa salaysay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “binasbasan” bilang karaniwang biblikal ngunit buhay na salita, at pinanatili ang Hebreong idyoma sa pangunahing teksto na may maikling paliwanag sa talababa.
