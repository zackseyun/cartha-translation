base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/017.yaml
  text: And he was afraid and said[a], “How awesome this place is! This is none other than the house of God[b], and this is the gate of heaven.”
translation:
  language: tl
  text: Natakot siya at sinabi, “Kaysindak-sindak[a] ng lugar na ito! Ito ay walang iba kundi ang bahay ng Diyos, at ito ang pintuan ng langit[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “nakapangingilabot” o “kakila-kilabot.” Ang salitang Hebreo ay maaaring magpahayag ng takot, pangamba, o mapitagang pagkamangha.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “pintuan ng mga langit.” Karaniwang ginagamit sa Tagalog ang “langit” para sa makalangit na dako.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: Natakot siya
  rationale: Tuwirang inilalahad ang naging reaksiyon ni Jacob at pinananatili ang tunay na takot na ipinahihiwatig ng pandiwang ירא.
- source_word: מַה נּוֹרָא
  choice: Talagang nakapangingilabot
  rationale: Ipinahahayag ng מַה ang matinding bulalas, samantalang ang נוֹרָא ay maaaring tumukoy sa takot, pangamba, o mapitagang pagkamangha. Ang “nakapangingilabot” ay likas sa modernong Tagalog at hindi pinapahina ang bigat ng banal na presensiya.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ang lugar na ito
  rationale: Likas at tuwirang salin ng pariralang may pantukoy.
- source_word: אֵין זֶה כִּי אִם
  choice: Ito ay walang iba kundi
  rationale: Pinananatili ang mariin at eksklusibong pagkakakilanlan sa idyomang Hebreo.
- source_word: בֵּית אֱלֹהִים
  choice: ang bahay ng Diyos
  rationale: Ang “bahay” ang tuwirang katumbas ng בַּיִת at malinaw sa karaniwang mambabasa, nang hindi ipinapalagay na mayroon nang itinayong santuwaryo sa lugar.
- source_word: שַׁעַר הַשָּׁמָיִם
  choice: ang pintuan ng langit
  rationale: Ang “pintuan” ay natural na naghahatid ng larawan ng daanan o pasukan, at ang “langit” ang karaniwang Tagalog para sa makalangit na dako sa kontekstong ito.
theological_decisions:
- issue: Kahulugan ng אֱלֹהִים sa kontekstong may iisang tinutukoy
  choice: Diyos
  alternative: mga diyos
  rationale: Bagaman anyong maramihan ang אֱלֹהִים, malinaw sa pangitain at tipan sa konteksto na ang iisang Diyos ang tinutukoy.
- issue: Saklaw ng kahulugan ng נוֹרָא sa banal na tagpo
  choice: nakapangingilabot
  alternative: kamangha-mangha
  rationale: Pinananatili ng “nakapangingilabot” ang tensiyon ng takot at mapitagang pagkamangha sa presensiya ng Diyos; ang “kamangha-mangha” ay maaaring maging labis na positibo at mawala ang diwa ng pangamba.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang emosyonal na takot ni Jacob at ang banal na pagkamangha nang hindi ginagawang kaswal o tahasang negatibo ang pahayag.
