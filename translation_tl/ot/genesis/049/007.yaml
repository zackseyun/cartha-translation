base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/007.yaml
  text: Cursed be their anger[a], for it is fierce, and their wrath, for it is harsh. I will divide them in Jacob and scatter them in Israel.
translation:
  language: tl
  text: Sumpain ang kanilang galit[a], sapagkat ito'y mabangis, at ang kanilang poot, sapagkat ito'y malupit. Hahatiin ko sila sa Jacob, at pangangalatin ko sila sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sumpa ang kanilang galit … at ang kanilang poot, sapagkat ito’y malupit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Sumpain
  rationale: Pinananatili ang lakas ng pasibong pahayag ng sumpa at likas itong pakinggan sa marangal na makabagong Tagalog.
- source_word: אַפָּם
  choice: ang kanilang galit
  rationale: Bagaman kaugnay sa literal na 'ilong/butas ng ilong,' galit ang idyomatikong kahulugan dito.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng sumpa at angkop sa patulang rehistro.
- source_word: עָז
  choice: mabangis
  rationale: Sa paglalarawan ng galit, ipinahahayag nito ang matindi at mapaminsalang lakas, hindi lamang simpleng katatagan.
- source_word: וְעֶבְרָתָם
  choice: at ang kanilang poot
  rationale: Ang עֶבְרָה ay matinding nag-uumapaw na galit; ang 'poot' ay natural at marangal na katumbas.
- source_word: קָשָׁתָה
  choice: malupit
  rationale: Sa konteksto ng marahas na poot, malinaw na ipinahahayag ng 'malupit' ang matigas at mabagsik na katangian nito.
- source_word: אֲחַלְּקֵם
  choice: Paghahati-hatiin ko sila
  rationale: Pinananatili ang ideya ng paghahati o pamamahagi at ang pagkakaiba nito sa kasunod na pandiwang 'pangangalatin.'
- source_word: בְּיַעֲקֹב
  choice: sa Jacob
  rationale: Tumutukoy ang Jacob sa sambayanang nagmula kay Jacob; pinananatili rin nito ang Hebreong paralelismo.
- source_word: וַאֲפִיצֵם
  choice: at pangangalatin ko sila
  rationale: Ipinahahayag ang sanhi ng pagkakawatak-watak at natural itong gamitin para sa pagpapakalat ng mga tao.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Pinananatili ang ikalawang pangalan ng bayan at ang paralelismo sa 'sa Jacob.'
theological_decisions:
- issue: Layon ng sumpa
  choice: Ang galit at poot nina Simeon at Levi ang tuwirang sinusumpa, hindi ang kanilang mga pagkatao.
  alternative: Ang magkapatid mismo ang sinusumpa.
  rationale: Tahasang pinagtutuunan ng Hebreo ang 'kanilang galit' at 'kanilang poot'; pinananatili ng salin ang mahalagang pagkakaibang ito.
translation_notes:
  register: Makabago ngunit marangal at patula. Pinanatili ang Jacob/Israel na paralelismo at ang pagkakaiba ng paghahati sa pangangalat.
