  naturalness: Likas at marangal ang pangkalahatang daloy. Mas tuwiran at natural sa modernong Filipino ang “mga piling pagkaing panghari” kaysa “mga pagkaing karapat-dapat sa hari.”
  terminology: Ang “saganang pagkain” ay angkop para sa שְׁמֵנָה לַחְמוֹ. Ang “mga piling pagkaing panghari” ay mas malinaw na katumbas ng “royal delicacies” at pinananatili ang maharlikang kaugnayan nang hindi tinutukoy ang isang partikular na hari.
