  text: Asher's food will be rich[a], and he will provide royal delicacies.
translation:
  language: tl
  text: Mula kay Asher ay manggagaling ang saganang pagkain,[a] at maglalaan siya ng mga piling pagkaing panghari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mataba ang tinapay ni Asher, at magbibigay siya ng mga piling pagkain ng hari.”
    reason: Pinananatili ang mas literal na mga kahulugan ng שְׁמֵנָה (“mataba”), לַחְמוֹ (“tinapay niya”), at מַעֲדַנֵּי מֶלֶךְ (“mga piling pagkain ng hari”).
lexical_decisions:
- source_word: מֵאָשֵׁר
  choice: Mula kay Asher ay manggagaling
  rationale: Pinananatili ang pang-ukol na מִן bilang pahiwatig ng pinagmumulan—ang lipi o lupain ni Asher—at idinagdag ang “manggagaling” upang maging likas sa Filipino ang sugnay na walang pandiwa sa Hebreo.
- source_word: שְׁמֵנָה
  choice: sagana
  rationale: Literal itong tumutukoy sa pagiging mataba o mayaman. Sa kaugnayan ng pagkain, malinaw at likas na ipinahahayag ng “sagana” ang kasaganaan at mainam na ani.
- source_word: לַחְמוֹ
  choice: ang ... pagkain
  rationale: Bagaman “tinapay” ang literal na kahulugan ng לֶחֶם, maaari rin itong tumukoy sa pagkain o panustos sa pangkalahatan. Ang “pagkain” ay angkop sa parallel na pagbanggit sa piling pagkain.
- source_word: וְהוּא
  choice: at ... siya
  rationale: Pinananatili ang tahasang panghalip at ang pagtukoy kay Asher bilang personipikasyon ng lipi o lupain.
- source_word: יִתֵּן
  choice: maglalaan
  rationale: Ang literal na “magbibigay” ay maaaring gamitin, ngunit ang “maglalaan” ay likas sa konteksto ng paggawa o pagtustos ng pagkain habang pinananatili ang diwa ng נָתַן.
- source_word: מַעֲדַנֵּי
  choice: mga pagkain
  rationale: Sa kontekstong ito, tumutukoy ang salita sa masasarap, piling pagkain o delicacy; nilinaw ang katangiang iyon sa pariralang “karapat-dapat sa hari.”
- source_word: מֶלֶךְ
  choice: karapat-dapat sa hari
  rationale: Likas na salin ito ng construct na “mga piling pagkain ng isang hari,” at ipinahihiwatig ang pagkaing angkop sa maharlikang hapag nang hindi ginagawang tiyak ang hari.
