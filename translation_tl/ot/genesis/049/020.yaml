translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “Mula kay Asher” upang sundan ang aktuwal na pang-ukol sa Hebreo, at iniwasan ang mas teknikal o di-karaniwang “mga delikasiya.”
