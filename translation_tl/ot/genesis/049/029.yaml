  yaml_path: translation/ot/genesis/049/029.yaml
  text: Then he commanded them and said to them[a], “I am about to be gathered to my people. Bury me with my fathers in the cave that is in the field of Ephron the Hittite,”
translation:
  language: tl
  text: Pagkatapos, iniutos niya sa kanila at sinabi, “Malapit na akong tipunin sa piling ng aking mga kaangkan.[a] Ilibing ninyo ako kasama ng aking mga ninuno sa yungib na nasa bukid ni Efron na Heteo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Tinitipon na ako sa piling ng aking mga kaangkan.” Ang idyomang Hebreo ay tumutukoy sa nalalapit na kamatayan at sa pagkapisan sa sariling mga kaangkan o ninuno sa kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו אֹותָם וַיֹּאמֶר אֲלֵהֶם
  choice: Pagkatapos, iniutos niya sa kanila
  rationale: Pinananatili ng “iniutos” ang bigat ng צוה bilang isang taimtim na utos. Hindi na inuulit ang literal na “at sinabi sa kanila” sapagkat magiging mabigat at di-likas iyon sa makabagong Tagalog, samantalang malinaw nang ipinakikilala ng panipi ang sinabi.
- source_word: נֶאֱסָף אֶל־עַמִּי
  choice: Malapit na akong tipunin sa piling ng aking mga kababayan
  rationale: Pinananatili ang pasibong talinghaga ng Hebreo at ang diwa ng nalalapit na kamatayan, sa halip na payakin bilang “mamamatay na ako.” Ang “sa piling” ay likas na Tagalog para sa pagkapisan sa kanila nang hindi nagtatakda ng higit sa sinasabi ng teksto.
- source_word: עַמִּי
  choice: aking mga kababayan
  rationale: Ang עַם ay “bayan/mga kababayan.” Sa idyomang ito, tumutukoy ito sa sariling sambayanan o angkan ng nagsasalita; inililinaw ng talababa ang kaugnayan nito sa mga ninuno at kamatayan.
- source_word: קִבְרוּ אֹתִי אֶל־אֲבֹתָי
  choice: Ilibing ninyo ako kasama ng aking mga ninuno
  rationale: Tuwirang utos ang “ilibing ninyo ako.” Ang “mga ninuno” ay mas natural at tumpak sa modernong Tagalog kaysa sa literal na “mga ama” sa konteksto ng libingan ng mga patriyarka.
- source_word: הַמְּעָרָה אֲשֶׁר בִּשְׂדֵה עֶפְרוֹן
  choice: yungib na nasa bukid ni Efron
  rationale: Ang מְעָרָה ay payak na “yungib”; hindi idinagdag ang “libingan” dahil ipinahihiwatig na iyon ng konteksto. Likas na pagmamay-ari sa Tagalog ang “bukid ni Efron.”
- source_word: הַחִתִּי
  choice: na Heteo
  rationale: Karaniwang anyong Tagalog ng pangkat-etnikong Hittite; inilalapat kay Efron bilang pagkakakilanlan ng kanyang bayan.
theological_decisions:
- issue: Kahulugan ng “titipunin sa aking mga kababayan”
  choice: Panatilihin ang idyoma at pasibong talinghaga ng pagkatipon sa sariling bayan sa nalalapit na kamatayan.
  alternative: “Malapit na akong mamatay.”
  rationale: Mas malawak ang pahiwatig ng Hebreo kaysa sa biyolohikal na kamatayan lamang at may kaugnayan sa pagkapisan sa mga ninuno. Hindi ito dapat gawing tahasang doktrina tungkol sa kabilang buhay na hindi naman lubos na ipinaliliwanag ng talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “ninuno” sa halip na literal na “ama,” at pinanatili ang idyoma ng Hebreo upang hindi mawala ang teolohikal at pampamilyang pahiwatig nito.
