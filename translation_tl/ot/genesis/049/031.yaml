base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/031.yaml
  text: There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah.
translation:
  language: tl
  text: Doon nila inilibing si Abraham at ang asawa niyang si Sara; doon nila inilibing si Isaac at ang asawa niyang si Rebeca; at doon ko inilibing si Lea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: doon
  rationale: Tumutukoy ito sa yungib o libingang binanggit sa naunang konteksto. Ang “doon” ang natural at malinaw na katumbas sa modernong Tagalog.
- source_word: קָבְרוּ
  choice: nila inilibing
  rationale: Ang Qal perfect na ikatlong panauhang maramihan ay aktibong anyo na may di-tiyak na pangkat bilang tagaganap. Pinananatili ng “nila inilibing” ang aktibong kayarian.
- source_word: אִשְׁתּוֹ
  choice: ang asawa niyang
  rationale: Natural itong salin ng pangngalang may hulaping ikatlong panauhang panlalaki. Inulit para kina Sara at Rebeca gaya ng kayarian sa Hebreo.
- source_word: קָבַרְתִּי
  choice: ko inilibing
  rationale: Ang Qal perfect na unang panauhang isahan ay tumutukoy sa nakaraang ginawa ni Jacob kay Lea.
- source_word: קָבְרוּ ... קָבְרוּ ... קָבַרְתִּי
  choice: inilibing ... inilibing ... inilibing
  rationale: Pinananatili ang pag-uulit ng pandiwang קבר at ang payak, sunod-sunod na himig ng pananalita.
- source_word: לֵאָה
  choice: Lea
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa tradisyong biblikal na Tagalog.
