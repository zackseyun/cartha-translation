  yaml_path: translation/ot/genesis/049/016.yaml
  text: Dan will judge his people as one of the tribes of Israel[a].
translation:
  language: tl
  text: Hahatulan ni Dan ang kanyang bayan bilang isa sa mga lipi ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ipagtatanggol ni Dan ang kanyang bayan” o “Bibigyan ni Dan ng katarungan ang kanyang bayan.” Maaaring tumukoy ang pandiwang Hebreo sa pagtatanggol o pagtiyak na maigagawad ang katarungan, hindi lamang sa paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן
  choice: Dan
  rationale: Pangalan ng anak ni Jacob at ng liping nagmula sa kanya. Pinananatili ang karaniwang anyong “Dan”; may paglalaro ng salita sa kasunod na pandiwang יָדִין (“hahatulan”).
- source_word: יָדִין
  choice: hahatulan
  rationale: Qal imperfect na may likas na hinaharap o mapanghulang diwa sa basbas ni Jacob. Pinananatili nito ang pangunahing diwa ng paghatol o pamamahala at, hangga't maaari sa Tagalog, ang ugnayan sa pangalang Dan.
- source_word: עַמּוֹ
  choice: ang kanyang bayan
  rationale: Tuwirang katumbas ng “kanyang bayan.” Malamang na tumutukoy ito sa mga taong sakop ng lipi ni Dan, ngunit hindi iyon nililinaw nang higit sa Hebreo.
- source_word: כְּאַחַד
  choice: bilang isa
  rationale: Ipinahahayag ang katayuan ni Dan bilang isa sa mga lipi ng Israel, hindi lamang pagkakatulad na walang ganap na pagkabilang.
- source_word: שִׁבְטֵי
  choice: mga lipi
  rationale: Sa kontekstong ito, ang construct plural ng שֵׁבֶט ay malinaw na tumutukoy sa mga lipi ng Israel, hindi sa mga setro.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Ginagamit ang nakaugaliang makabagong anyo ng pangalan sa Filipino.
theological_decisions:
- issue: Diwa ng papel ni Dan sa basbas
  choice: Inilalarawan si Dan na humahatol o namamahala sa kanyang bayan bilang ganap na kabilang sa mga lipi ng Israel.
  alternative: Ipagtatanggol o bibigyan ng katarungan ni Dan ang kanyang bayan.
  rationale: Maaaring saklawin ng דין ang paghatol, pamamahala, pagtatanggol, o pagbibigay-katarungan. Mas tuwirang pinananatili ng “hahatulan” ang pangunahing kahulugan at ang paglalaro ng salita sa pangalang Dan, habang inilalagay sa talababa ang tunay na alternatibong diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lipi” bilang karaniwang katawagan sa mga tribo ng Israel at pinanatili ang maikling, patulang anyo ng Hebreo.
