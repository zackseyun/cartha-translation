  yaml_path: translation/ot/genesis/049/019.yaml
  text: Gad—a raiding band will raid him[b][a], but he will raid at their heels.
translation:
  language: tl
  text: Si Gad—lulusubin siya ng isang pangkat ng mga manlulusob,[a] ngunit lulusubin niya sila sa kanilang hulihan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, may paglalaro sa magkatunog at magkakaugnay na mga salitang Gad, pangkat ng mga manlulusob, at lulusob.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “lulusob siya sa sakong.” Maaaring ang ibig sabihin ay sasalakay siya mula sa likuran o tutugisin niya sila sa hulihan.
    reason: alternative_reading
lexical_decisions:
- source_word: גָּד
  choice: Gad
  rationale: Pangalan ng anak ni Jacob at ng liping nagmula sa kaniya; pinanatili sa karaniwang anyong Filipino.
- source_word: גְּדוּד
  choice: isang pangkat ng mga manlulusob
  rationale: Tumutukoy sa isang pangkat na nagsasagawa ng mga paglusob o pandarambong. Hindi ganap na matutumbasan sa Tagalog ang tunog-laro ng Hebreo, kaya nilinaw ang diwa at ipinaliwanag ito sa talababa.
- source_word: יְגוּדֶנּוּ
  choice: lulusubin siya
  rationale: Ang pandiwa ay tumutukoy rito sa marahas na paglusob; inuulit ang parehong salitang-ugat sa kasunod na sugnay upang mapanatili ang gantihang kilos.
- source_word: וְהוּא
  choice: ngunit
  rationale: 'Bagaman maaari itong maging simpleng pang-ugnay na ''at,'' ipinahihiwatig ng baligtad na kilos ang pagsalungat: siya muna ang nilusob, pagkatapos ay siya naman ang lulusob.'
- source_word: יָגֻד
  choice: lulusubin
  rationale: Isinalin nang pareho sa naunang anyo ng pandiwa upang maipakita ang pag-uulit at pagbabaligtad sa Hebreo.
- source_word: עָקֵב
  choice: mula sa likuran
  rationale: Literal na 'sakong,' ngunit sa konteksto ay maaaring tumukoy sa pag-atake mula sa hulihan o sa pagtugis sa umaatras na kaaway. Pinili ang natural na pariralang Filipino habang pinananatili sa talababa ang literal na larawan at kalabuan.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na may marangal at malinaw na himig. Ginamit ang “lulusubin” sa dalawang sugnay upang maipakita ang gantihang kilos, habang ipinaliwanag sa talababa ang Hebreong paglalaro sa salita na hindi likas na matutumbasan sa Tagalog.
