base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/028.yaml
  text: 'All these are the twelve tribes of Israel[a], and this is what their father spoke to them when he blessed them: he blessed each one with the blessing appropriate to him.'
translation:
  language: tl
  text: 'Lahat ng ito ay ang labindalawang lipi ng Israel, at ito ang sinabi sa kanila ng kanilang ama nang pagpalain niya sila: pinagpala niya ang bawat isa ayon sa kani-kaniyang pagpapala.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Ang lahat ng ito
  rationale: Likas na modernong Tagalog na nagpapanatili sa kolektibo at demonstratibong diwa ng parirala.
- source_word: שִׁבְטֵי יִשְׂרָאֵל שְׁנֵים עָשָׂר
  choice: ang labindalawang lipi ng Israel
  rationale: Tuwirang isinasalin ang bilang at ang construct chain sa malinaw at karaniwang anyong Tagalog.
- source_word: וְזֹאת אֲשֶׁר דִּבֶּר לָהֶם אֲבִיהֶם
  choice: Ito ang sinabi sa kanila ng kanilang ama
  rationale: Ang “sinabi” ay natural na katumbas ng דִּבֶּר sa kontekstong nagbubuod sa naunang pahayag, habang malinaw na pinananatili ang tagapagsalita at mga kinausap.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: nang pagpalain niya sila
  rationale: Iniuugnay nang natural sa Tagalog ang kilos ng pagpapala sa pahayag na kababanggit, gaya ng syntaktikong pag-unawa sa konteksto.
- source_word: אִישׁ
  choice: ang bawat isa
  rationale: Ginagamit dito ang singular na אִישׁ sa distributibong diwa; malinaw itong naipapahayag ng “bawat isa.”
- source_word: כְּבִרְכָתוֹ
  choice: ayon sa pagpapalang para sa kanya
  rationale: Pinananatili ng “ayon sa” ang puwersa ng כְּ, habang ipinahihiwatig ng “para sa kanya” ang kani-kaniyang pagpapala nang hindi higit na tinutukoy kung ito ay angkop, nakalaan, o natatangi.
- source_word: בֵּרַךְ אֹתָם
  choice: pinagpala niya
  rationale: Inuulit ang ugat ng “pagpalain/pinagpala” upang mapanatili ang pag-uulit ng ברך sa Hebreo.
theological_decisions:
- issue: Kahulugan ng כְּבִרְכָתוֹ
  choice: ayon sa pagpapalang para sa kanya
  alternative: ayon sa pagpapalang angkop sa kanya
  rationale: Hindi tahasang sinasabi ng Hebreo ang “angkop.” Ang napiling anyo ay natural ngunit higit na nagpapanatili sa lawak at bahagyang kalabuan ng “ayon sa kanyang pagpapala.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng salitang-ugat na “pagpala” at iniwasan ang sobrang literal na ayos na magiging asiwa sa Tagalog.
