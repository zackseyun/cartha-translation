  source_fidelity: 'Ang pangunahing salin ay wastong kumukuha sa magkakatugmang kilos ng Hebreo: mapait na pagtrato/paglusob, pagpapana, at pagkapoot. Gayunman, ang “Mapait nila siyang sinalakay” ay hindi likas na Filipino at lumalabo ang ugnayan ng “mapait” sa pagsalakay. Ang paggamit ng tinig na balintiyak at ng pangwakas na “ng mga mamamana” ay malinaw na nagpapakitang sila ang mga gumagawa ng lahat ng kilos.'
  naturalness: Mas natural at marangal sa makabagong Filipino ang “Sinalakay siya nang buong kapaitan, pinana, at kinapootan ng mga mamamana.” Naiiwasan nito ang pilit na ayos ng salita sa draft at nananatiling maigsi at patula.
  terminology: Ang “mga mamamana” ay angkop na pagsasalin ng idiomang בַּעֲלֵי חִצִּים. Ang “pinana” ay katanggap-tanggap bilang pangunahing pagbasa, habang dapat panatilihin sa talababa ang kawalang-katiyakan ng gitnang pandiwa. Ang dating talababa ay may dagdag na “buhay niya,” na wala sa Hebreo at dapat alisin.
  issues:
