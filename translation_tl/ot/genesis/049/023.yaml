  text: They bitterly attacked him[a], and shot at him, and hated him—the archers.
translation:
  language: tl
  text: Sinalakay siya nang buong kapaitan, pinana, at kinapootan ng mga mamamana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pinakitunguhan siya nang may kapaitan, sinalakay, at kinapootan ng mga mamamana.” Mahirap tiyakin ang kahulugan ng gitnang pandiwang Hebreo; maaari rin itong mangahulugang “nakipaglaban sa kaniya” o, sa mas pangkalahatang diwa, “sumalakay sa kaniya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרֲרֻהוּ
  choice: Mapait nila siyang sinalakay
  rationale: Ang piel ng מרר na may hulaping tumutukoy sa kaniya ay maaaring mangahulugang ‘pinapait siya’ o ‘pinakitunguhan siya nang may kapaitan.’ Sa konteksto ng sunod-sunod na pagkilos ng mga kaaway, ang ‘mapait na sinalakay’ ay likas sa Filipino at pinananatili ang diwa ng kapaitan at paglusob.
- source_word: וָרֹבּוּ
  choice: pinana
  rationale: Mahirap ang anyong Hebreo at maaari itong unawain bilang ‘nakipagtalo/nakipaglaban’ o mas pangkalahatang ‘sumalakay.’ Gayunman, ang kasunod na בַּעֲלֵי חִצִּים, ‘mga mamamana,’ ay malakas na sumusuporta sa larawan ng pagpana.
- source_word: וַיִּשְׂטְמֻהוּ
  choice: kinapootan
  rationale: Ang שטם ay nagpapahayag ng matinding poot o pagkamapootin. Ang ‘kinapootan’ ay maikli, malinaw, at angkop sa marangal na rehistro.
- source_word: בַּעֲלֵי חִצִּים
  choice: ang mga mamamana
  rationale: Literal itong ‘mga may-ari/panginoon ng mga palaso,’ isang idyoma para sa mga mamamana. Direktang isinalin ang kahulugan ng idyoma sa natural na Filipino.
