    issue: Hindi likas ang “Mapait nila siyang sinalakay.”
    rationale: Bagaman sinusubukan nitong ilipat ang nuance ng מרר, hindi karaniwang pang-abay sa Filipino ang “mapait” para sa ganitong pagkilos. Ang “nang buong kapaitan” ay mas malinaw at likas.
  - severity: medium
    issue: May dagdag na kahulugang “buhay niya” sa talababa.
    rationale: Walang salitang “buhay” sa Hebreo. Ang alternatibong pagpapakahulugan sa unang pandiwa ay dapat manatili sa pagtrato sa kaniya nang may kapaitan, hindi magdagdag ng isang bagay na pinagpapaitan.
