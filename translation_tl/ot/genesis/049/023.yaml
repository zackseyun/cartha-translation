translation_notes:
  register: Makabagong Filipino na marangal at patula ngunit madaling maunawaan. Ginamit ang gitling bago ang ‘ang mga mamamana’ upang ipakitang sila ang gumagawa ng tatlong naunang kilos. Napanatili sa talababa ang tunay na kawalang-katiyakan ng dalawang pandiwang Hebreo.
