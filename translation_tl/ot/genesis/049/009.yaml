base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/009.yaml
  text: Judah is a lion’s cub[a]; from the prey, my son, you have gone up. He crouched, he lay down like a lion[b], and like a lioness—who will rouse him?
translation:
  language: tl
  text: 'Ang Juda ay batang leon;


    mula sa nasila ay umahon ka, anak ko.


    Dumapa siya at humimlay na gaya ng leon,


    at gaya ng leona[a]—


    sino ang gigising sa kanya?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malaking leon” o “malakas na leon.” Iba ang salitang Hebreo rito sa naunang salita para sa “leon,” at maaaring tumukoy sa isang ganap na malaki at makapangyarihang leon, lalaki man o babae.
    reason: lexical_alternative
  - marker: b
    text: Ang larawan ni Juda bilang leon ay iniuugnay kung minsan sa kalaunang maharlika at mesiyanikong pag-asa. Gayunman, sa talatang ito, tuwirang si Juda ang tinutukoy sa pagpapala ni Jacob.
    reason: cross_reference
lexical_decisions:
- source_word: גּוּר אַרְיֵה
  choice: batang leon
  rationale: Ang pariralang konstruktong Hebreo ay tumutukoy sa batang anak ng leon. Likas at malinaw sa modernong Filipino ang “batang leon,” habang pinananatili ang talinghaga.
- source_word: מִטֶּרֶף
  choice: mula sa nasila
  rationale: Ang טֶרֶף ay biktimang sinila o nilapa ng mabangis na hayop. Pinananatili ng “nasila” ang larawan ng mandaragit nang hindi nagdaragdag kung kaninong biktima iyon.
- source_word: בְּנִי
  choice: anak ko
  rationale: Tuwirang tawag ito ni Jacob kay Juda. Natural sa Filipino ang ayos na “anak ko” sa loob ng patulang pangungusap.
- source_word: עָלִיתָ
  choice: umahon ka
  rationale: Pinananatili ang literal na pataas na kilos at ang ikalawang panauhan. Hindi ipinapaliwanag sa salin kung saan siya umahon, yamang hindi iyon tahasang sinabi ng Hebreo.
- source_word: כָּרַע
  choice: dumapa siya
  rationale: Sa larawang-hayop, inilalarawan ng pandiwa ang pagbaba o pagyuko ng katawan. Ang “dumapa” ay mas angkop dito kaysa salitang maaaring magpahiwatig ng pagsamba.
- source_word: רָבַץ
  choice: humimlay
  rationale: Karaniwang inilalarawan ng pandiwa ang hayop na nakahiga o nagpapahinga. Ang “humimlay” ay maikli, marangal, at akma sa patulang rehistro.
- source_word: כְּאַרְיֵה
  choice: gaya ng leon
  rationale: Tuwirang paghahambing ito sa karaniwang salitang Hebreo para sa leon.
- source_word: וּכְלָבִיא
  choice: at gaya ng leonang babae
  rationale: Pinananatili nito ang pagkakaiba ng לָבִיא sa naunang אַרְיֵה at ang posibleng diwang “lioness,” habang inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: מִי יְקִימֶנּוּ
  choice: sino ang gigising sa kanya?
  rationale: Sa konteksto, ang causative na anyo ng קום ay nangangahulugang gisingin o pukawin upang bumangon. Ang “gigising” ay natural at hindi nagdaragdag ng ideyang “mangangahas,” na ipinahihiwatig lamang ng larawan.
theological_decisions:
- issue: Kung tahasang mesiyaniko o pangunahing tumutukoy kay Juda ang larawan ng leon
  choice: Pinanatili sa pangunahing diwa ng pagpapala ni Jacob kay Juda ang larawan, nang walang tahasang mesiyanikong pahayag sa salin.
  alternative: Basahin ang larawan bilang tipolohikal na tumuturo sa kalaunang maharlika at mesiyanikong pag-asa.
  rationale: Tuwirang si Juda ang kinakausap ng talata. Maaaring paunlarin ng mga susunod na teksto ang larawang ito, ngunit hindi dapat ipasok sa pangunahing salin ang konklusyong hindi tahasang sinasabi rito.
translation_notes:
  register: Makabagong Filipino na may marangal at patulang himig. Pinanatili ang maikling magkakatabing sugnay, ang pagpapalit mula sa ikalawang panauhan tungo sa ikatlong panauhan, at ang larawan ng leong payapang nakahimlay ngunit mapanganib gisingin. Hindi nilinaw nang lampas sa Hebreo kung ano ang “nasila” o kung saan umahon si Juda.
