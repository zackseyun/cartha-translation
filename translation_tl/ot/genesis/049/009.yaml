  to: 'Ang Juda ay batang leon;


    mula sa nasila ay umahon ka, anak ko.


    Dumapa siya at humimlay na gaya ng leon,


    at gaya ng leona[a]—


    sino ang gigising sa kanya?[b]'
  rationale: Tanging mga ligtas na pagbabago sa linaw at likas na gamit ang ginawa. Inayos ang ikalawang linya upang hindi magmukhang utos ang perpektong pandiwang Hebreo, at pinalitan ang di-likas na “leonang babae” ng “leona.” Walang idinagdag na pagbasa tungkol sa lugar na pinanggalingan ni Juda, sa uri ng nasila, o sa mesiyanikong pagpapakahulugan.
