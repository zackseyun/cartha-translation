    issue: Maaaring mabasa bilang pautos ang “umahon ka” sa kasalukuyang ayos.
    rationale: Ang עָלִיתָ ay perpektong pahayag (“umaahon/umahon ka” sa naganap na diwa), hindi utos. Kapag kasunod agad ng “anak ko,” ang anyong “umahon ka” ay likas na nababasa bilang imperatibo sa Filipino. Ang pagbabagong pang-ayos ay nagpapalinaw sa pahayag.
  - severity: low
    issue: Hindi likas ang “leonang babae.”
    rationale: Nauunawaan ito ngunit hindi ito ang karaniwang modernong Filipino. Ang “leona” ay maikli, malinaw, at angkop sa patulang rehistro.
