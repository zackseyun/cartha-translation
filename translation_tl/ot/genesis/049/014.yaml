  text: Issachar is a strong-boned donkey[a], lying down between the sheepfolds.
translation:
  language: tl
  text: Si Isacar ay isang asnong matitibay ang buto, na nakahiga sa pagitan ng mga kulungan ng tupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pagitan ng mga supot na nakasabit sa magkabilang tagiliran.” Bihira ang salitang Hebreo at pinagtatalunan ang kahulugan nito; ang “mga kulungan ng tupa” ang tradisyonal at malamang na kahulugan ayon sa pastoral na larawan ng talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂשכָר
  choice: Isacar
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa modernong saling Tagalog.
- source_word: חֲמֹר
  choice: asno
  rationale: Tuwirang katumbas ito ng hayop na tinutukoy at angkop sa marangal na rehistro ng tulang pagpapala.
- source_word: גָּרֶם
  choice: matibay ang mga buto
  rationale: Pinananatili nito ang konkretong larawan ng “buto” habang ipinahihiwatig ang matipuno at matatag na pangangatawan ng asno, hindi ang pagiging payat o buto't balat.
- source_word: רֹבֵץ
  choice: nakahiga
  rationale: Likas na paglalarawan ito sa isang hayop na nakababa at nagpapahinga, nang hindi ipinapalagay na natutulog ito.
- source_word: בֵּין
  choice: sa pagitan ng
  rationale: Tuwirang pinananatili ang kahulugan ng preposisyon at ang larawan ng kinalalagyan ng hayop.
- source_word: הַמִּשְׁפְּתָיִם
  choice: mga kulungan ng tupa
  rationale: Ito ang tradisyonal at malamang na kahulugang angkop sa pastoral na larawan, ngunit dahil bihira at pinagtatalunan ang salitang Hebreo, inilalahad sa talababa ang pangunahing alternatibo.
