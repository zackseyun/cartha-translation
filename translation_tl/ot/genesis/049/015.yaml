base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/015.yaml
  text: He saw that the resting place was good[a], and that the land was pleasant, so he bent his shoulder to bear[c][b], and became a servant for forced labor.
translation:
  language: tl
  text: Nakita niyang mabuti ang pahingahan[a], at kaaya-aya ang lupain; kaya iniyuko niya ang kanyang balikat upang magpasan[b], at siya'y naging lingkod sa sapilitang paggawa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mabuti ang pahinga.” Ang salitang Hebreo ay maaaring mangahulugang “pahinga” o “pahingahan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “iniyuko niya ang kanyang balikat upang magdala.” Larawan ito ng pagtanggap ng pasanin o pagpapasakop sa paggawa.
    reason: idiom_clarification
  - marker: c
    text: O “naging lingkod na nagbabayad ng tributo” o “naging alipin sa sapilitang paggawa.” Pinagtatalunan ang eksaktong kalagayang tinutukoy ng pariralang Hebreo; madalas itong tumukoy sa ipinataw na sapilitang paggawa.
    reason: alternative_reading
lexical_decisions:
- source_word: מְנֻחָה
  choice: pahingahan
  rationale: Maaaring tumukoy ang pangngalan sa pahinga o sa isang lugar na pahingahan. Dahil kapantay nito sa tula ang “lupain,” mas angkop dito ang kongkretong “pahingahan,” habang inilalahad sa talababa ang tunay na alternatibo.
- source_word: טוֹב
  choice: mabuti
  rationale: Pinananatili nito ang payak at malawak na positibong kahulugan ng Hebreo.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Sa konteksto ng pagpapala sa mga lipi, tumutukoy ito sa teritoryo, kaya mas angkop ang “lupain” kaysa “daigdig” o pangkalahatang “lupa.”
- source_word: נָעֵמָה
  choice: kaaya-aya
  rationale: Natural at marangal itong paglalarawan sa isang kanais-nais at kaakit-akit na lupain nang hindi pinalalabis ang diwa.
- source_word: וַיֵּט שִׁכְמוֹ
  choice: iniyuko niya ang kanyang balikat
  rationale: Pinananatili ang matalinghagang larawan ng kusang paglalagay ng balikat sa ilalim ng pasan at ang pahiwatig ng pagpapasakop.
- source_word: לִסְבֹּל
  choice: upang magpasan
  rationale: Likas na katambal ng “balikat” sa Filipino at malinaw na nagpapahayag ng pagdadala ng pasanin.
- source_word: לְמַס עֹבֵד
  choice: naging alipin sa sapilitang paggawa
  rationale: Ang מַס ay karaniwang tumutukoy sa sapilitang paggawa o corvée, at ang עֹבֵד ay isang taong naglilingkod o gumagawa. Malinaw at natural ang salin, ngunit inilalahad sa talababa ang ibang posibleng panlipunang kahulugan.
theological_decisions:
- issue: Anyo ng pagpapasakop ni Isacar sa huling sugnay
  choice: naging alipin sa sapilitang paggawa
  alternative: naging lingkod na nagbabayad ng tributo
  rationale: Pinakamalamang na tumutukoy ang מַס sa ipinataw na sapilitang paggawa, ngunit hindi ganap na tiyak kung corvée, tributaryong paglilingkod, o mas matinding pagkaalipin ang eksaktong kalagayan. Pinanatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang anyong patula at ang larawan ng balikat at pasan. Ginamit ang “siya'y” upang maging maindayog nang hindi nagiging lipas ang pangkalahatang himig.
