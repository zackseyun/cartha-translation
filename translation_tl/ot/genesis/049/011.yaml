base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/011.yaml
  text: Binding his donkey to the vine[a], and his donkey’s colt to the choice vine, he washes his garments in wine[c][b], and his robe in the blood of grapes.
translation:
  language: tl
  text: Itinatali niya ang kanyang batang asno[a] sa punong ubas, at ang anak ng kanyang inahing asno sa piling punong ubas[b]. Nilalabhan niya ang kanyang kasuotan sa alak, at ang kanyang balabal sa dugo ng mga ubas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring tumukoy sa batang asno o bisirong asno.
    reason: lexical_alternative
  - marker: b
    text: O “mahal na punong ubas”; tumutukoy ang salitang Hebreo sa pinili o mataas na uring punong ubas.
    reason: lexical_alternative
  - marker: c
    text: Ang “dugo ng mga ubas” ay makatang pananalita para sa katas ng ubas o alak; pinanatili rito ang larawan ng Hebreo.
    reason: cultural_note
lexical_decisions:
- source_word: אֹסְרִי
  choice: Itinatali niya
  rationale: Ang Qal participle ay inilalarawan bilang nagpapatuloy o katangiang kilos; natural sa modernong Tagalog ang pangkasalukuyang anyong ito.
- source_word: לַגֶּפֶן
  choice: sa punong ubas
  rationale: Ang גפן ay puno o baging ng ubas. Pinili ang “punong ubas” bilang malinaw at karaniwang katawagan, habang nananatili ang isahang larawan.
- source_word: עירֹה
  choice: ang kanyang batang asno
  rationale: Ang עַיִר ay batang asno o bisirong asno; tahasang pinanatili ang kabataan ng hayop at ang hulaping paari.
- source_word: וְלַשֹּׂרֵקָה
  choice: at ... sa piling punong ubas
  rationale: Ang שֹׂרֵקָה ay isang pinili o mataas na uring punong ubas. Ang “piling” ay likas at dignified na Filipino.
- source_word: בְּנִי אֲתֹנוֹ
  choice: ang anak ng kanyang inahing asno
  rationale: Pinananatili nito ang literal na ugnayang “anak” at ang tiyak na kasarian ng אֲתוֹן, nang hindi ipinapalagay na lalaki ang anak.
- source_word: כִּבֵּס
  choice: Nilalabhan niya
  rationale: Ang perfect sa makatang orakulo ay maaaring maglarawan ng matingkad na eksena o katangiang kilos. Ang pangkasalukuyang Filipino ay tumutugma sa participial na simula nang hindi ipinipilit ang panahon.
- source_word: בַּיַּיִן
  choice: sa alak
  rationale: Pinananatili ang kongkretong larawan ng paglalaba sa alak, hindi lamang paggamit nito bilang kasangkapan.
- source_word: לְבֻשׁוֹ
  choice: ang kanyang kasuotan
  rationale: Ang pangngalan ay maaaring kolektibong tumukoy sa damit; ang “kasuotan” ay natural at sapat na malawak.
- source_word: וּבְדַם עֲנָבִים
  choice: at sa dugo ng mga ubas
  rationale: Pinananatili ang matingkad na Hebreong metapora sa halip na palitan agad ng “katas” o “alak.”
- source_word: סוּתוֹ
  choice: ang kanyang balabal
  rationale: Ang “balabal” ay natural at marangal na katumbas para sa panlabas o pantakip na kasuotan at nagpapanatili ng paralelismo.
theological_decisions:
- issue: Mesiyanikong o pantribong larawan sa pagpapala ni Jacob kay Juda
  choice: Pinanatili bilang makatang larawan ng pambihirang kasaganaan at karangalan, nang walang tahasang mesiyanikong paliwanag sa pangunahing teksto.
  alternative: Basahin bilang tuwirang mesiyanikong hula o bilang paglalarawan lamang ng makasaysayang kasaganaan ng lipi ni Juda.
  rationale: Ang mismong Hebreo ay nagbibigay ng larawan ng saganang ubas at alak ngunit hindi tahasang tinutukoy rito ang Mesiyas; kaya hindi nilutas sa salin ang mas malawak na teolohikal na pag-uugnay.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang paralelismo, kongkretong larawan, at makatang pagmamalabis ng Hebreo. Iniwasan ang sobrang teknikal o makalumang bokabularyo at hindi nagdagdag ng denominasyonal na interpretasyon.
