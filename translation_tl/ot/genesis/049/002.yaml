  yaml_path: translation/ot/genesis/049/002.yaml
  text: Gather yourselves and listen[a], sons of Jacob; listen to Israel your father.
translation:
  language: tl
  text: Magtipon kayo at makinig, mga anak na lalaki ni Jacob; makinig kayo kay Israel, na inyong ama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקָּבְצוּ
  choice: Magtipon kayo
  rationale: Ang Niphal na pautos na maramihan ng קבץ ay panawagan sa mga anak na magsama-sama. Likas sa makabagong Tagalog ang “magtipon kayo” at naihahatid nito ang kusang pagtitipon ng pangkat.
- source_word: שִׁמְעוּ
  choice: makinig
  rationale: Sa kontekstong pautos, hinihingi ng pandiwa ang masusing pakikinig, hindi lamang ang pagkarinig; kaya mas angkop at natural ang “makinig.”
- source_word: בְּנֵי יַעֲקֹב
  choice: mga anak ni Jacob
  rationale: Tumutukoy ang panlalaking maramihan sa mga lalaking anak ni Jacob. Sa Tagalog, ang “mga anak ni Jacob” ang natural na katawagan sa kaniyang mga anak na lalaki sa kontekstong ito.
- source_word: שִׁמְעוּ אֶל
  choice: makinig kayo kay
  rationale: Ang ikalawang pautos na may אֶל ay tuwirang nag-uutos na pakinggan ang nagsasalita. Pinananatili ng “makinig kayo kay” ang pag-uulit at ang diwang pagtalima.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinanatili ang pangalang Israel bilang kaagapay ng Jacob upang hindi mawala ang sinadyang paralelismo ng Hebreo.
- source_word: אֲבִיכֶם
  choice: na inyong ama
  rationale: Malinaw nitong ipinakikilalang si Israel ang ama ng mga tinatawag. Ang “na inyong ama” ay natural na appositional na ayos sa Tagalog.
theological_decisions:
- issue: Pagpapanatili sa magkatulad ngunit magkahiwalay na pangalang Jacob at Israel
  choice: 'Pinanatili ang dalawa: “mga anak ni Jacob ... Israel na inyong ama.”'
  alternative: Gamitin lamang ang Jacob o Israel sa dalawang bahagi upang maging mas makinis.
  rationale: Sadyang ginagamit ng Hebreo ang dalawang pangalan sa paralelismong patula at maaaring may kaakibat na tipanang pahiwatig. Hindi dapat burahin ng salin ang pagkakaibang ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang pag-uulit ng “makinig” bilang retorikal na diin ng Hebreo; walang talababa dahil malinaw at natural sa pangunahing teksto ang leksikal na diwa.
