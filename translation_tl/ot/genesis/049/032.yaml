  text: The field and the cave that is in it were purchased from the sons of Heth[a][b].
translation:
  language: tl
  text: Ang bukid at ang yungib na nasa loob nito ay binili mula sa mga anak ni Het[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa mga Heteo.” Sa Hebreo, “mula sa mga anak ni Het.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Ang pagkakabili ng bukid at ng yungib na nasa loob nito ay mula sa mga anak ni Het.”'
    reason: previous_rendering
lexical_decisions:
- source_word: מִקְנֵה
  choice: ay binili
  rationale: Ang pangngalang Hebreo ay tumutukoy sa ari-ariang nakuha sa pamamagitan ng pagbili. Ginawang sugnay na pasibo sa Filipino upang maging natural at malinaw, habang pinananatili ang diwa ng pagkakabili.
- source_word: הַשָּׂדֶה
  choice: ang bukid
  rationale: Karaniwan at angkop na salin ng שָׂדֶה sa konteksto ng pagmamay-ari ng lupa.
- source_word: וְהַמְּעָרָה
  choice: at ang yungib
  rationale: 'Tuwirang salin na pinananatiling magkahiwalay ang dalawang biniling bagay: ang bukid at ang yungib.'
- source_word: אֲשֶׁר בּוֹ
  choice: na naroon
  rationale: Likas na Filipino para sa kamag-anak na sugnay na nagsasaad na ang yungib ay nasa loob o sakop ng bukid.
- source_word: מֵאֵת
  choice: mula sa
  rationale: Ipinapakita nito kung kanino nagmula ang biniling ari-arian nang hindi labis na isinasalin ang Hebreong idyoma.
- source_word: בְּנֵי חֵת
  choice: mga anak ni Het
  rationale: Pinananatili ang lantad na anyong pampamilya at ang pangalang Het sa Hebreo; ibinibigay sa talababa ang kontekstuwal na katumbas na “mga Heteo.”
