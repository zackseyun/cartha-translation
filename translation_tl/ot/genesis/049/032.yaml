translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “yungib” bilang karaniwang salitang biblikal ngunit nauunawaan pa rin sa kasalukuyan; ang pasibong “ay binili” ay natural na nagpapahayag ng eliptikong sugnay nominal sa Hebreo.
