base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/027.yaml
  text: Benjamin is a ravenous wolf[a]; in the morning he devours the prey[d][c][b], and in the evening he divides the spoil.
translation:
  language: tl
  text: Si Benjamin ay isang lobong nanlalapa; sa umaga ay nilalamon niya ang biktima, at sa gabi ay hinahati niya ang samsam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְיָמִין
  choice: Benjamin
  rationale: Pangngalang pantangi; ginamit ang nakaugaliang anyo sa modernong Tagalog.
- source_word: זְאֵב יִטְרָף
  choice: lobong nanlalapa
  rationale: Pinagsama sa likas at matalinghagang pariralang Tagalog ang 'lobo' at ang pandiwang tumutukoy sa pagpunit o paglapang ginagawa sa biktima.
- source_word: בַּבֹּקֶר
  choice: sa umaga
  rationale: Tuwirang temporal na katumbas na nagpapanatili sa pagtutulad ng umaga at gabi.
- source_word: יֹאכַל
  choice: nilalamon niya
  rationale: Bagaman karaniwang nangangahulugang 'kumakain,' ang 'nilalamon' ay angkop sa marahas na larawan ng lobo.
- source_word: עַד
  choice: ang nasila
  rationale: Sa larawan ng lobo, tumutukoy ito sa biktima o nasila; pinili ang 'nasila' upang maging natural kasunod ng 'nilalamon' at hindi agad ilipat ang unang taludtod sa larawang pandigma.
- source_word: וְלָעֶרֶב
  choice: at sa gabi
  rationale: Pinananatili ang pangatnig at ang balanseng temporal na paralelismo sa 'sa umaga.'
- source_word: יְחַלֵּק
  choice: hinahati niya
  rationale: Tumpak at karaniwang Tagalog para sa paghahati o pamamahagi.
- source_word: שָׁלָל
  choice: ang samsam
  rationale: '''Samsam'' ang likas at malinaw na salitang Tagalog para sa mga nakuhang ari-arian matapos ang labanan.'
theological_decisions:
- issue: Matalinghagang diwa ng pagpapala ni Jacob kay Benjamin
  choice: Panatilihin ang matingkad na larawan ng mabangis na lobo at ng paghahati ng samsam nang walang pagtukoy sa isang tiyak na katuparang pangkasaysayan.
  alternative: Ipaliwanag ito bilang tuwirang paglalarawan sa kasaysayang pandigma ng lipi ni Benjamin.
  rationale: Makatula at matalinghaga ang Hebreo at hindi nito tahasang pinapangalanan ang isang pangyayari o katuparan; hindi dapat ipasok sa salin ang isang partikular na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at balanseng anyong patula ng Hebreo; iniwasan ang arkaikong pananalita at labis na pagpapaliwanag.
