translation:
  language: tl
  text: Mapula ang kanyang mga mata dahil sa alak, at maputi ang kanyang mga ngipin dahil sa gatas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Mas matingkad kaysa alak ang kanyang mga mata, at mas maputi kaysa gatas ang kanyang mga ngipin.” Bihira at pinagtatalunan ang Hebreong pang-uri para sa kulay ng mga mata, at ang pang-ukol ay maaaring mangahulugang “dahil sa/mula sa” o magpahayag ng paghahambing.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַכְלִילִי
  choice: namumula
  rationale: Ang bihira at pinagtatalunang pang-uri ay malamang na tumutukoy sa pamumula o matingkad na kulay ng mga mata. Kaayon ito ng kaugnay na gamit tungkol sa pamumula ng mata dahil sa alak sa Kawikaan 23:29.
- source_word: עֵינַיִם
  choice: mga mata
  rationale: Tuwirang salin ng pangngalang dalawahan na tumutukoy sa dalawang mata.
- source_word: מִיָּיִן
  choice: sa alak
  rationale: 'Binasa ang מִן bilang sanhi o pinagmulan: namumula ang mga mata dahil sa alak. Sinusuportahan ito ng kasaganaan ng alak sa naunang talata, bagaman posible rin ang paghahambing.'
- source_word: וּלְבֶן
  choice: at namumuti
  rationale: Ang anyong pang-uri na 'maputi' ay isinaling 'namumuti' upang natural na maipahayag sa Filipino ang kalagayang dulot ng sumusunod na pariralang may מִן at mapanatili ang paralelismo sa 'namumula.'
- source_word: שִׁנַּיִם
  choice: mga ngipin
  rationale: Tuwirang salin ng pangngalang dalawahan para sa mga ngipin.
- source_word: מֵחָלָב
  choice: sa gatas
  rationale: Binasa ang מִן bilang sanhi o pinagmulan, kaayon ng 'sa alak' sa unang hati at ng larawan ng saganang alak at gatas.
