- from: Maninirahan si Zebulun sa baybayin ng mga dagat[a]; siya ay nasa baybayin ng mga barko, at ang kanyang tagiliran[b] ay nakaharap sa Sidon.
  to: Maninirahan si Zebulun sa baybayin ng mga dagat[a]; siya ay maninirahan sa baybaying dinaraungan ng mga barko[b], at ang kanyang tagiliran[c] ay patungo sa Sidon.
  rationale: Inayos ang di-likas na konstruksyong “baybayin ng mga barko” sa isang malinaw na Tagalog na katumbas, at idinagdag ang literal na alternatibo sa talababa upang mapanatili ang lapit sa Hebreo. Inilipat ang umiiral na talababa ng “tagiliran” sa marker c at ginawang “patungo sa Sidon” ang pangwakas na parirala upang mapanatili ang maingat na direksiyonal na kahulugan.
