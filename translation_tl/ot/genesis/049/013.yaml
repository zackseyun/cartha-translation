  text: זְבוּלֻ֕ן לְ/ח֥וֹף יַמִּ֖ים יִשְׁכֹּ֑ן וְ/הוּא֙ לְ/ח֣וֹף אֳנִיּ֔וֹת וְ/יַרְכָת֖/וֹ עַל צִידֹֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/013.yaml
  text: Zebulun will dwell by the shore of the seas[a]; he will be by the shore of ships[c][b], and his flank will be toward Sidon.
translation:
  language: tl
  text: Maninirahan si Zebulun sa baybayin ng mga dagat[a]; siya ay maninirahan sa baybaying dinaraungan ng mga barko[b], at ang kanyang tagiliran[c] ay patungo sa Sidon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring “dagat.” Maramihan ang anyong Hebreo, ngunit maaari itong gamitin nang idyomatiko bilang isahan.
    reason: lexical_alternative
  - marker: b
    text: O “sa baybayin para sa mga barko.” Mas literal, “sa baybayin ng mga barko.”
    reason: lexical_alternative
  - marker: c
    text: O “gilid,” “hangganan,” o “pinakamalayong bahagi.” Ang salitang Hebreo ay maaaring tumukoy sa tagiliran, gilid, o dulo sa heograpikong diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּלֻן
  choice: Zebulun
  rationale: Isina-Filipino ang baybay ng pangalan ayon sa karaniwang anyong ginagamit sa mga saling Tagalog.
- source_word: לְחוֹף
  choice: sa baybayin ng
  rationale: Ipinahahayag nito ang lokasyon sa tabi ng baybayin at natural sa makabagong Tagalog.
- source_word: יַמִּים
  choice: mga dagat
  rationale: Pinanatili ang tahasang anyong maramihan ng Hebreo, bagaman maaari itong unawain bilang idyomatikong isahan.
- source_word: יִשְׁכֹּן
  choice: maninirahan
  rationale: Ang qal imperfect ay tumutukoy sa paninirahan o pagtira; ang panghinaharap ay angkop sa anyo ng pagpapala.
- source_word: וְהוּא
  choice: siya
  rationale: Pinanatili ang tahasang panghalip upang maipakita ang diin at paralelismo ng tula.
- source_word: לְחוֹף אֳנִיּוֹת
  choice: nasa baybayin ng mga barko
  rationale: Malapit ito sa literal na larawan ng Hebreo at hindi ipinapasok ang mas interpretatibong diwang 'daungan.'
- source_word: וְיַרְכָתוֹ
  choice: ang kanyang tagiliran
  rationale: Pinananatili ang konkretong metapora ng gilid o flank, habang kinikilala sa talababa ang posibleng heograpikong diwa.
- source_word: עַל
  choice: nakaharap sa
  rationale: Sa heograpikong pahayag, maingat nitong ipinahahayag ang pagkakahilig o direksiyon patungo sa isang lugar.
- source_word: צִידֹן
  choice: Sidon
  rationale: Ginamit ang nakaugaliang anyo ng pangalan ng lugar sa Tagalog.
