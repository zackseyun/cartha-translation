  yaml_path: translation/ot/genesis/049/022.yaml
  text: Joseph is a fruitful son[a], a fruitful son by a spring[b]; daughters step over the wall.
translation:
  language: tl
  text: 'Si Jose ay mabungang anak[a],

    mabungang anak sa tabi ng bukal;

    ang mga anak na babae[b] ay humahakbang sa ibabaw ng pader.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Si Jose ay sangang mabunga, sangang mabunga sa tabi ng bukal.” Masinsin ang Hebreong tula; mas tahasang binibigyang-kahulugan ng tradisyonal na saling “sanga” ang larawan.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga anak na babae.” Maaaring metaporikong tumukoy ito sa mga sanga o usbong na umaabot sa ibabaw ng pader.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן פֹּרָת
  choice: anak na mabunga
  rationale: Pinananatili nito ang karaniwang kahulugan ng בֵּן na “anak” at ang diwa ng פֹּרָת mula sa ugat na “mamunga.” Sadyang masinsin at bahagyang palaisipan ang Hebreong tula, kaya hindi tahasang ginawang “sanga” sa pangunahing teksto.
- source_word: עֲלֵי עָיִן
  choice: sa tabi ng bukal
  rationale: Bagaman maaari ring mangahulugang “mata” ang עַיִן, ang “bukal” ang likas na kahulugan sa konteksto ng pagkamabunga. Ipinahahayag ng “sa tabi ng” ang lokasyong tinutukoy ng parirala.
- source_word: בָּנוֹת
  choice: mga anak na babae
  rationale: Ito ang tuwirang leksikal na kahulugan. Hindi agad nilulutas ang posibleng metapora ng mga sanga o supling, kaya napapanatili ang kakaibang larawan ng Hebreong tula.
- source_word: צָעֲדָה
  choice: humahakbang
  rationale: Ipinahahayag nito ang pagkilos na humakbang o humakbang nang pasulong, nang hindi pinatitindi bilang “umakyat” o “tumakbo.”
- source_word: עֲלֵי שׁוּר
  choice: sa ibabaw ng pader
  rationale: Ang שׁוּר ay inuunawang “pader,” at ang parirala ay naglalarawan ng pag-abot o paghakbang lampas sa hangganan nito.
