base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/030.yaml
  text: in the cave that is in the field of Machpelah[a], which is opposite Mamre, in the land of Canaan[d][c][b], which Abraham bought with the field from Ephron the Hittite as a burial property.
translation:
  language: tl
  text: sa yungib na nasa bukid ng Macpela, sa tapat ng Mamre[a], sa lupain ng Canaan—ang bukid na binili ni Abraham mula kay Efron na Heteo[b] bilang ari-ariang paglilibingan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na nakaharap sa Mamre” o “sa harap ng Mamre.” Ang Hebreo ay nagsasaad ng lokasyon kaugnay ng Mamre.
    reason: lexical_alternative
  - marker: b
    text: 'Literal na ayos: “na binili ni Abraham ang bukid mula kay Efron na Heteo.” Ang bukid, kasama ang yungib na naroon, ang tinutukoy na biniling ari-arian.'
    reason: source_syntax
  - marker: c
    text: Maaari ring “bilang ari-ariang para sa libingan.” Binibigyang-diin ng Hebreo na legal na pag-aari ito na itinalaga para sa paglilibing.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמְּעָרָה
  choice: sa yungib
  rationale: Ang בְּ ay tumutukoy sa kinaroroonan. Karaniwan at malinaw sa modernong Tagalog ang “yungib” para sa isang natural na cave.
- source_word: אֲשֶׁר בִּשְׂדֵה הַמַּכְפֵּלָה
  choice: na nasa bukid ng Macpela
  rationale: Pinananatili nito ang sugnay na naglalarawan sa lokasyon ng yungib. Isinalin ang שָׂדֶה na “bukid” at tinumbasan ang pangalang pantangi ayon sa tunog na Macpela.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: sa tapat ng Mamre
  rationale: Ang idyoma ay nagsasaad ng lokasyon kaugnay ng Mamre; natural sa Tagalog ang “sa tapat ng” at hindi nito pinapakahulugan ang parirala bilang simpleng “malapit sa.”
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: sa lupain ng Canaan
  rationale: Tuwirang katumbas ito ng heograpikong parirala at karaniwang anyo sa Filipino para sa pangalan ng rehiyon.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: ang bukid na binili ni Abraham
  rationale: Malinaw na ang הַשָּׂדֶה ang tuwirang layon ng “binili.” Ang paglalagay nito bilang paliwanag pagkatapos ng gatlang ay likas sa Tagalog at iniiwasang gawing “kasama ng bukid,” na hindi tuwirang sinasabi ng gramatika.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: kay Efron na Heteo
  rationale: Ipinahihiwatig ng מֵאֵת ang taong pinagbilan o pinagmulan ng binili. Ang “Heteo” ay panandang-etniko kay Efron.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: bilang pag-aaring libingan
  rationale: Pinananatili ng “pag-aari” ang legal na diwa ng אֲחֻזָּה, samantalang ipinapahayag ng “libingan” ang layunin ng ari-arian.
theological_decisions:
- issue: Kung ang huling sugnay ay tumutukoy sa yungib o sa bukid
  choice: Iniharap ang “ang bukid na binili ni Abraham” bilang paliwanag sa bukid ng Macpela.
  alternative: “na binili ni Abraham kasama ng bukid”
  rationale: Ang אֶת ay pananda ng tuwirang layon, kaya ang bukid ang tahasang bagay na binili. Hindi ginawang pang-ukol na “kasama ng,” bagaman ipinakikita ng mas malawak na salaysay na kabilang sa ari-arian ang yungib.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang anyong parirala sapagkat karugtong ang talata sa naunang utos ni Jacob. Ginamit ang gatlang upang luminaw ang mahabang hanay ng mga pariralang panlunan at ang paliwanag tungkol sa biniling bukid.
