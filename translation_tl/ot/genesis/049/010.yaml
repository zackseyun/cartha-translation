  naturalness: May bahagyang di-natural na ayos ang ‘Hindi lilisan sa Juda ang setro.’ Sa makabagong Filipino, mas malinaw at idiomatiko ang ‘Hindi aalis mula sa Juda ang setro.’
  terminology: Ang ‘setro,’ ‘tungkod ng pinuno,’ ‘Juda,’ ‘Shilo,’ at ‘mga bayan’ ay angkop sa marangal ngunit modernong rehistro. Ang talababa a ay dapat iwasang magdagdag ng ‘handog,’ na hindi nasa English audit trail, at dapat gawing hindi gaanong malabo ang alternatibong ‘may karapatan.’
