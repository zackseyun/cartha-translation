  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֹֽא יָס֥וּר שֵׁ֨בֶט֙ מִֽ/יהוּדָ֔ה וּ/מְחֹקֵ֖ק מִ/בֵּ֣ין רַגְלָ֑י/ו עַ֚ד כִּֽי יָבֹ֣א שילה וְ/ל֖/וֹ יִקְּהַ֥ת עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/010.yaml
  text: The scepter will not depart from Judah[a], nor the ruler’s staff from between his feet, until Shiloh comes[b]; and to him will be the obedience of the peoples.
translation:
  language: tl
  text: Hindi aalis mula sa Juda ang setro, ni ang tungkod ng pinuno mula sa pagitan ng kanyang mga paa, hanggang sa dumating si Shilo[a]; at sa kanya tatalima ang mga bayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang sa dumating ang may karapatan.” Mahirap unawain ang Hebreong שילה; ipinalalagay rin itong isang titulo, pangalan ng isang lugar, o pahiwatig sa tributo.
    reason: alternative_reading
  - marker: b
    text: O “at sa kanya magtitipon ang mga bayan,” o “at sa kanya magpapasakop ang mga bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: setro
  rationale: Sa kontekstong maharlika at patula, at bilang katambal ng מְחֹקֵק, tumutukoy ito sa sagisag ng paghahari, hindi lamang sa isang tungkod o sa isang lipi.
- source_word: מִיהוּדָה
  choice: sa Juda
  rationale: Ipinahihiwatig ng pariralang kasama ng pandiwang 'lilisan' na hindi mawawala o aalis ang setro mula kay Juda; natural sa Filipino ang 'lilisan sa Juda.'
- source_word: מְחֹקֵק
  choice: tungkod ng pinuno
  rationale: Maaaring tumukoy ang salita sa tagapag-utos o sa sagisag ng kanyang pamamahala. Ang konkretong 'tungkod ng pinuno' ay umaayon sa 'setro' at sa pariralang 'mula sa pagitan ng kanyang mga paa.'
- source_word: מִבֵּין רַגְלָיו
  choice: mula sa pagitan ng kanyang mga paa
  rationale: Pinananatili ang konkretong larawan ng Hebreo sa halip na ipakahulugan agad bilang mga inapo o salinlahi.
- source_word: עַד כִּי
  choice: hanggang sa
  rationale: Natural at tuwirang ipinakikita nito ang hangganan ng naunang pahayag.
- source_word: שילה
  choice: Shilo
  rationale: Napakahirap at pinagtatalunan ang anyong Hebreo. Pinananatili ito sa pangunahing teksto bilang pangalang isinalin sa baybay-Filipino, habang inilalahad sa talababa ang mahahalagang alternatibo.
- source_word: וְלוֹ
  choice: sa kanya
  rationale: Kapag ang שילה ay binasang personal na pangalan, natural na personal din ang panghalip, nang hindi tiyakang ipinapakilala kung sino ang tinutukoy.
- source_word: יִקְּהַת
  choice: tatalima
  rationale: Bihira at pinagtatalunan ang salita. Sa konteksto ng paghahari, malinaw at natural na ipinahahayag ng 'tatalima' ang pagsunod o pagpapasakop ng mga bayan, habang nasa talababa ang ibang posibleng diwa.
- source_word: עַמִּים
  choice: mga bayan
  rationale: Tuwirang pinananatili nito ang maramihang saklaw ng salita at hindi ito nililimitahan sa makabagong konsepto ng mga bansang-estado.
theological_decisions:
- issue: Pagkakakilanlan at salin ng שילה sa talatang matagal nang binabasa sa paraang mesiyaniko
  choice: Panatilihin ang 'Shilo' sa pangunahing teksto bilang personal na pangalan, nang hindi tahasang tinutukoy na ito ang Mesiyas.
  alternative: Isalin bilang 'ang siyang may karapatan dito,' bilang handog o tributo, o bilang pook na Shilo.
  rationale: Iginagalang nito ang mahirap at tunay na malabong anyo ng Hebreo at iniiwasang magpasok sa salin ng pagkakakilanlang higit sa tahasang sinasabi ng talata.
- issue: Maharlika at posibleng mesiyanikong puwersa ng talata
  choice: Gumamit ng wikang maharlika—'setro,' 'tungkod ng pinuno,' at pagtalima ng mga bayan—nang walang tahasang doktrinal na pagpapalawak.
  alternative: Isang purong dinastiko-politikal na pagbasa o isang tahasang mesiyanikong paraphrase.
  rationale: Malinaw sa Hebreo ang larawan ng paghahari na kaugnay ng Juda, ngunit hindi nararapat na lutasin ng salin ang lahat ng implikasyong teolohikal nito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang konkretong larawang patula ng setro, tungkod, at mga paa; ginamit ang 'tatalima' bilang maikli at dignified na pandiwa para sa pagsunod ng mga bayan. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
