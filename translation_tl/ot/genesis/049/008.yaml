  text: Judah[a], your brothers will praise you; your hand will be on the neck of your enemies[b]; the sons of your father will bow down to you.
translation:
  language: tl
  text: Juda, pupurihin ka ng mga kapatid mo[a]; ang kamay mo’y nasa batok ng mga kaaway mo; yuyukod sa iyo ang mga anak na lalaki ng iyong ama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pasasalamatan ka” o “marangal kang kikilalanin.” Malawak ang saklaw ng pandiwang Hebreo, at may kaugnayan ito sa pangalan ni Juda.
    reason: lexical_alternative
  - marker: b
    text: O “ang mga kapatid mo sa panig ng iyong ama.” Literal na “ang mga anak na lalaki ng iyong ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Juda
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa makabagong saling Filipino.
- source_word: יוֹדוּךָ
  choice: pupurihin ka
  rationale: Sa konteksto ng pagpapala, ipinahihiwatig ng pandiwa ang pagpuri o marangal na pagkilala. Pinananatili rin nito hangga’t maaari ang paglalaro sa pangalang Juda, na kaugnay ng salitang Hebreo para sa pagpuri o pasasalamat.
- source_word: אַחֶיךָ
  choice: mga kapatid mo
  rationale: Tumutukoy ito sa mga lalaking kapatid ni Juda sa agarang konteksto; natural sa Filipino ang “mga kapatid” nang hindi kailangang ulitin ang kasarian.
- source_word: יָדְךָ בְּעֹרֶף אֹיְבֶיךָ
  choice: ang kamay mo’y nasa batok ng mga kaaway mo
  rationale: Pinananatili ang konkretong larawan ng kamay sa batok bilang sagisag ng pagtatagumpay at paghahari, sa halip na palitan ito ng tahasang pagpapaliwanag.
- source_word: יִשְׁתַּחֲווּ לְךָ
  choice: yuyukod sa iyo
  rationale: Ipinahahayag nito ang pagyukod bilang pagkilala at pagpapasakop, nang hindi awtomatikong ipakahulugang pagsamba sa Diyos.
- source_word: בְּנֵי אָבִיךָ
  choice: ang mga anak ng iyong ama
  rationale: Pinananatili ang literal at marangal na pariralang Hebreo, na tumutukoy sa mga kapatid ni Juda.
theological_decisions:
- issue: Kahulugan ng יִשְׁתַּחֲווּ bilang pagyukod kay Juda
  choice: pagyukod bilang pagpaparangal o pagpapasakop
  alternative: pagsamba
  rationale: Si Juda ang kausap sa pagpapala ni Jacob. Maaaring gamitin ang pandiwa sa pagsamba o sa pagpupugay, ngunit sa kontekstong ito ay hindi kailangang magpasok ng ideya ng banal na pagsamba.
translation_notes:
  register: Makabago ngunit marangal at bahagyang patula ang rehistro. Ginamit ang karaniwang “mo” para sa natural na daloy, habang pinanatili ang mas pormal na “iyong ama” sa pangwakas na pariralang malapit sa anyo ng Hebreo.
