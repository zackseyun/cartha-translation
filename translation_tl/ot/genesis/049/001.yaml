  text: וַ/יִּקְרָ֥א יַעֲקֹ֖ב אֶל בָּנָ֑י/ו וַ/יֹּ֗אמֶר הֵאָֽסְפוּ֙ וְ/אַגִּ֣ידָה לָ/כֶ֔ם אֵ֛ת אֲשֶׁר יִקְרָ֥א אֶתְ/כֶ֖ם בְּ/אַחֲרִ֥ית הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/001.yaml
  text: Then Jacob called his sons and said[a], “Gather yourselves, and I will tell you what will happen to you in the latter days.”
translation:
  language: tl
  text: Pagkatapos, tinawag ni Jacob ang kanyang mga anak na lalaki at sinabi, “Magtipon kayo, at sasabihin ko sa inyo kung ano ang mangyayari sa inyo sa mga darating na araw.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga huling araw.” Sa ilang konteksto, ang pariralang Hebreo ay maaari ring magkaroon ng diwang tumutukoy sa mga pangyayari sa wakas ng panahon.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Sa kontekstong pasalaysay, ang קרא ay nangangahulugang tumawag o magpatawag. Likas at malinaw sa modernong Tagalog ang “tinawag.”
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na tumutukoy ito sa mga lalaking anak ni Jacob, na siyang mga pangkatribu na tinutukoy sa kasunod na konteksto.
- source_word: הֵאָסְפוּ
  choice: Magtipon kayo
  rationale: Ipinahahayag ng Niphal imperative ng אסף ang utos na magsama-sama. Natural sa Tagalog ang “Magtipon kayo” at napapanatili nito ang maringal na himig.
- source_word: וְאַגִּידָה לָכֶם
  choice: at sasabihin ko sa inyo
  rationale: Ang cohortative ay nagpapahayag ng layunin ni Jacob kasunod ng utos; malinaw at idiomatiko ang pagkakasunod na ito sa Tagalog.
- source_word: אֵת אֲשֶׁר יִקְרָא אֶתְכֶם
  choice: kung ano ang mangyayari sa inyo
  rationale: Ang idyoma ay tumutukoy sa isang bagay na sasapit o mangyayari sa kanila, hindi sa literal na pagtawag.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: sa mga darating na araw
  rationale: Naipahahayag nito ang pangkalahatang pagtukoy sa hinaharap nang hindi ipinagpapalagay na teknikal na eskatolohikal ang parirala.
theological_decisions:
- issue: Kung ang בְּאַחֲרִית הַיָּמִים ay dapat isaling may tahasang eskatolohikal na diwa
  choice: sa mga darating na araw
  alternative: sa mga huling araw
  rationale: Maaaring tumukoy ang pariralang Hebreo sa panahong darating sa pangkalahatan o magkaroon ng mas matinding eskatolohikal na diwa sa ilang konteksto. Dito, ang agarang paksa ay ang kinabukasan ng mga anak at mga tribo ni Jacob, kaya pinili sa pangunahing teksto ang mas malawak na diwang panghinaharap at inilagay sa talababa ang mas literal at posibleng eskatolohikal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “mga anak na lalaki” para sa tiyak na kasarian sa konteksto at “sa mga darating na araw” upang mapanatili ang tunay na lawak ng kahulugan ng pariralang Hebreo.
