base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/024.yaml
  text: Yet his bow remained steady, and his arms were made agile by the hands of the Mighty One of Jacob; from there is the Shepherd, the Stone of Israel.
translation:
  language: tl
  text: 'Ngunit nanatiling matatag ang kaniyang busog,


    at naging maliksi ang kaniyang mga bisig


    sa pamamagitan ng mga kamay ng Makapangyarihan ni Jacob;


    mula roon ay nagmula ang Pastol, ang Bato ng Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malabo ang Hebreo sa huling linya. Maaari rin itong unawain bilang “mula sa kaniya nagmula ang Pastol, ang Bato ng Israel,” o iugnay ang “Pastol, ang Bato ng Israel” sa Makapangyarihan ni Jacob.
    reason: Kailangang ipaalam ang tunay na sintaktikong kalabuan ng מִשָּׁם at ng kasunod na mga titulo nang hindi ito nilulutas sa pangunahing teksto.
lexical_decisions:
- source_word: וַתֵּשֶׁב בְּאֵיתָן קַשְׁתּוֹ
  choice: nanatiling matatag ang kaniyang busog
  rationale: Ang idiomang Hebreo ay literal na nagsasaad na ang busog ay nanatili sa katatagan; natural at tapat sa konteksto ang 'nanatiling matatag.'
- source_word: וַיָּפֹזּוּ זְרֹעֵי יָדָיו
  choice: naging maliksi ang kaniyang mga bisig
  rationale: Ang bihirang pandiwang ויפזו ay maaaring magpahiwatig ng liksi o kalakasan. Pinili ang 'naging maliksi' ayon sa larawang pandigma at sa pangunahing tekstuwal na pagbasa, habang iniiwasan ang hindi natural na literal na 'mga bisig ng kaniyang mga kamay.'
- source_word: אֲבִיר יַעֲקֹב
  choice: Makapangyarihan ni Jacob
  rationale: Pinananatili ang tradisyonal at kontekstuwal na banal na titulo; ang 'ni Jacob' ay sadyang nagpapanatili sa ugnayang ipinahahayag ng Hebreo.
- source_word: רֹעֶה אֶבֶן יִשְׂרָאֵל
  choice: ang Pastol, ang Bato ng Israel
  rationale: Pinananatili bilang dalawang magkatabing titulo/metapora ang 'Pastol' at 'Bato,' nang hindi tahimik na ipinapaliwanag ang malabong sintaks.
theological_decisions:
- issue: Ang reperente at sintaktikong tungkulin ng מִשָּׁם ('mula roon')
  choice: mula roon ang Pastol, ang Bato ng Israel
  alternative: sa pamamagitan ng Pastol, ang Bato ng Israel / mula sa kaniya na Pastol at Bato ng Israel
  rationale: Malabo at mahirap ang Hebreong parirala. Pinananatili ng salin ang 'mula roon' at ang tensiyon ng teksto sa halip na tukuyin nang tiyak kung lugar, pinagmulan, o persona ang tinutukoy.
- issue: Kung iisa o dalawang titulo ang רֹעֶה אֶבֶן יִשְׂרָאֵל
  choice: ang Pastol, ang Bato ng Israel
  alternative: ang Pastol ng Bato ng Israel / ang Pastol at Bato ng Israel
  rationale: Ang dalawang magkahanay na titulo ay pinakamalinaw na pagbasa sa konteksto, ngunit hindi idinagdag ang 'at,' upang hindi lampasan ang anyo ng Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang anyong patula upang sundan ang paralelismo. Pinanatili ang 'kaniyang' para sa pormal na rehistro at ginawang malaking titik ang mga banal na titulong 'Makapangyarihan,' 'Pastol,' at 'Bato.'
