  text: Si Neftali ay isang babaeng usang pinakawalan; nagbibigay siya ng magagandang salita.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang inahing usang pinakawalan.” Ang larawan sa Hebreo ay isang babaeng usa na kinalagan upang malayang tumakbo.
    reason: lexical_alternative
  - marker: b
    text: Iba-iba rin ang pagkaunawa sa huling sugnay. Maaari itong mangahulugang “nagbibigay siya ng magagandang pahayag”; ayon naman sa ibang pagbasa sa mga huling salita, “nagsisilang siya ng magagandang anak ng usa.”
    reason: alternative_reading
lexical_decisions:
- source_word: נַפְתָּלִי
  choice: Neftali
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo at malinaw na tumutukoy sa anak at lipi ni Jacob.
- source_word: אַיָּלָה
  choice: babaeng usa
  rationale: Tiyak na pambabae ang pangngalang Hebreo. Likas at madaling maunawaan ang “babaeng usa,” samantalang maaaring ipakahulugan sa ibang hayop ang “inahing usa.”
- source_word: שְׁלֻחָה
  choice: pinakawalan
  rationale: Ipinahihiwatig ng anyong balintiyak mula sa שלח ang isang usang kinalagan o pinalayang tumakbo; pinananatili ng “pinakawalan” ang maikli at makatang larawan.
- source_word: הַנֹּתֵן
  choice: na nagbibigay
  rationale: Tinutumbasan nito ang kasalukuyang kilos ng participle at pinananatili ang siksik na daloy ng tula. Maaaring bumalik ang panlalaking anyo kay Neftali sa halip na sa babaeng usa.
- source_word: אִמְרֵי
  choice: mga salita
  rationale: Malawak at natural na katumbas ng construct plural, na maaari ring isaling “mga kasabihan” o “mga pahayag.”
- source_word: שָׁפֶר
  choice: magaganda
  rationale: Malinaw na ipinapahayag ang diwa ng kagandahan o kaaya-ayang katangian nang hindi ginagawang mas tiyak ang uri ng mga salita.
theological_decisions:
- issue: Paksa at kahulugan ng huling sugnay
  choice: Iniuugnay ang “na nagbibigay ng magagandang salita” kay Neftali sa loob ng talinghaga ng babaeng usa.
  alternative: Maaaring ituring ang huling sugnay na paglalarawan sa usa, o unawain ang mga huling salita bilang pagtukoy sa panganganak ng magagandang anak ng usa.
  rationale: Maikli at malabo ang sintaks ng tulang Hebreo. Sinusuportahan ng pagbigkas ng tekstong Masoretiko ang “nagbibigay ng magagandang salita,” ngunit hindi dapat itago ang ibang sinauna at makabagong pagbasa; kaya inilalahad ang mga iyon sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at makatang paghahambing, habang inilagay sa mga talababa ang tunay na kalabuan sa bokabularyo at sintaks.
