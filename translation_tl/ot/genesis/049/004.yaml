  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang maiikling linya at paghinto sa gitna ng talata ay angkop sa patulang pagpapahayag ni Jacob. Nauunawaan ang “umakyat siya roon” bilang sadyang bigla at hindi pangkaraniwang paglipat, gaya sa Hebreo.
