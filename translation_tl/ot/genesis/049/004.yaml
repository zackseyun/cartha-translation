base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/004.yaml
  text: Unstable as water[a], you shall not excel, because you went up to your father’s bed; then you defiled it—he went up to my couch.
translation:
  language: tl
  text: 'Padalos-dalos na gaya ng tubig,

    hindi ka mangingibabaw,

    sapagkat umakyat ka sa higaan ng iyong ama;

    noon ay nilapastangan mo ang aking higaan—

    umakyat siya roon.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, upang maging mas natural ang daloy: “noon ay nilapastangan mo ang aking higaan—umakyat ka roon.” Biglang lumilipat sa ikatlong panauhan ang huling sugnay sa Hebreo: “umakyat siya,” na maaaring isang mariing pag-uulit na tumutukoy kay Ruben.'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּחַז
  choice: Padalos-dalos
  rationale: Ipinahahayag ng salita ang kawalan ng pagpipigil, pabigla-biglang pagkilos, at pagiging hindi matatag. Ang “padalos-dalos” ay likas sa modernong Tagalog at malinaw na naglalarawan sa asal ni Ruben.
- source_word: כַּמַּיִם
  choice: na gaya ng tubig
  rationale: Pinananatili ang tuwirang paghahambing sa tubig at ang larawan ng kilos na mahirap pigilin o ikulong.
- source_word: אַל תּוֹתַר
  choice: hindi ka mangingibabaw
  rationale: Sa konteksto ng pagkawala ng karapatan at karangalan ng panganay, tumutukoy ito sa hindi pagtataglay o pagpapanatili ng kataasan. Ang “mangingibabaw” ay maikli at natural nang hindi labis na ipinapaliwanag ang kahulugan.
- source_word: כִּי עָלִיתָ
  choice: sapagkat umakyat ka
  rationale: Pinananatili ang sanhi na ipinahihiwatig ng כִּי at ang eupemistikong pandiwang “umakyat,” sa halip na gawing tahasang seksuwal ang pananalita.
- source_word: מִשְׁכְּבֵי אָבִיךָ
  choice: sa higaan ng iyong ama
  rationale: Bagaman maramihan ang anyong Hebreo, ang isahang “higaan” ang natural sa Tagalog at malinaw na tumutukoy sa higaan ng ama.
- source_word: אָז
  choice: noon
  rationale: Likas na ipinahahayag sa Tagalog ang panahong kasunod ng tinukoy na pagkilos at maaari ring magpahiwatig ng naging bunga nito.
- source_word: חִלַּלְתָּ
  choice: nilapastangan mo
  rationale: Ipinapakita nito ang mabigat na moral na diwa ng paglapastangan o pagdungis, at angkop sa paglabag sa dangal ng higaan ng ama.
- source_word: יְצוּעִי
  choice: aking higaan
  rationale: Pinananatili ang unang panauhang “aking” at ginagamit ang karaniwang salitang “higaan,” na natural at marangal sa Tagalog.
- source_word: עָלָה
  choice: umakyat siya roon
  rationale: Pinananatili ang biglaang paglipat ng tekstong Masoretiko sa ikatlong panauhan. Idinagdag ang “roon” upang maging buo sa Tagalog ang direksiyon ng pandiwa, na tumutukoy pabalik sa higaan.
theological_decisions:
- issue: Eupemismong seksuwal at hatol sa ginawa ni Ruben
  choice: Panatilihin ang “umakyat ka sa higaan ng iyong ama” at isalin ang חִלַּלְתָּ bilang “nilapastangan mo.”
  alternative: Gawing tahasan bilang “sinipingan mo ang kinakasama ng iyong ama,” o gumamit ng mas ritwal na “nilapastangan bilang banal.”
  rationale: Eupemistiko ngunit nauunawaan ang Hebreo. Pinananatili ng salin ang antas ng pahayag at bigat ng hatol nang hindi ipinapasok sa talata ang mga detalyeng mula sa Genesis 35:22.
- issue: Biglaang ikatlong panauhan sa huling sugnay (עָלָה)
  choice: Panatilihin sa pangunahing teksto ang “umakyat siya roon.”
  alternative: “Umakyat ka roon,” bilang mas makinis na pagpapatuloy ng tuwirang pakikipag-usap kay Ruben.
  rationale: Ikatlong panauhang panlalaki na isahan ang anyong Hebreo at sadyang biglaan ang pagbabago. Hindi ito tahimik na pinapakinis; inilalahad sa talababa ang karaniwang alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang anyong patula sa maiikling linya, ang seksuwal na eupemismo ng pinagmulan, at ang sintaktikong pagkabigla ng huling sugnay.
