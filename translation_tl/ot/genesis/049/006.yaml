id: GEN.49.6
reference: Genesis 49:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בְּ/סֹדָ/ם֙ אַל תָּבֹ֣א נַפְשִׁ֔/י בִּ/קְהָלָ֖/ם אַל תֵּחַ֣ד כְּבֹדִ֑/י כִּ֤י בְ/אַפָּ/ם֙ הָ֣רְגוּ אִ֔ישׁ וּ/בִ/רְצֹנָ֖/ם עִקְּרוּ שֽׁוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/006.yaml
  text: Let my soul not enter their council[a]; let my honor not be joined to their assembly. For in their anger they killed a man[c][b], and in their self-will they hamstrung an ox.
translation:
  language: tl
  text: 'Huwag sanang pumasok ang aking kaluluwa sa kanilang kapulungan[a];

    huwag sanang makiisa ang aking karangalan[b] sa kanilang pagtitipon.

    Sapagkat sa kanilang galit ay pumatay sila ng isang lalaki,

    at ayon sa sarili nilang kagustuhan ay pinutol nila ang litid ng isang baka.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kanilang lihim na kapulungan.” Ang salitang Hebreo ay maaaring tumukoy sa isang kompidensiyal o malapit na sanggunian.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “huwag sanang makiisa ang aking kaluwalhatian sa kanilang pagtitipon.”
    reason: lexical_alternative
  - marker: c
    text: Ayon sa tradisyonal na pagbasa, ang Hebreong שׁוֹר ay “baka.” Iba ang pagbasa ng ilan sa mga katinig at isinasalin nila ang linyang ito bilang “giniba nila ang isang pader.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּסֹדָם
  choice: sa kanilang kapulungan
  rationale: Ang סוֹד ay maaaring tumukoy sa isang sangguniang lupon o malapit at kompidensiyal na pangkat. Pinananatili ng “kapulungan” ang kaugnayan nito sa pagtitipon nang hindi ipinapalagay na tiyak na lihim iyon.
- source_word: תָּבֹא נַפְשִׁי
  choice: pumasok ang aking kaluluwa
  rationale: Pinananatili ang Hebreong idyomang “aking kaluluwa” at ang patulang larawan ng pagpasok; ipinahahayag ng “huwag sana” ang pakiusap o matinding hangarin ng jussive na may אַל.
- source_word: בִּקְהָלָם
  choice: sa kanilang pagtitipon
  rationale: Ang קָהָל ay isang nagkakatipong pangkat o kapulungan. Ang “pagtitipon” ay natural sa modernong Tagalog at malinaw na katambal ng “kapulungan.”
- source_word: תֵּחַד כְּבֹדִי
  choice: huwag sanang makiisa ang aking karangalan
  rationale: Ipinahihiwatig ng יחד ang pakikiisa o pagkakaugnay, samantalang ang כָּבוֹד dito ay maaaring tumukoy sa karangalan o dangal. Pinananatili ng salin ang personipikasyon at ang paglayo ni Jacob sa kanilang ginawa.
- source_word: בְאַפָּם
  choice: sa kanilang galit
  rationale: Ito ang tuwiran at likas na katumbas ng idyomatikong gamit ng אַף bilang galit o poot.
- source_word: הָרְגוּ אִישׁ
  choice: pumatay sila ng isang lalaki
  rationale: Pinananatili ang isahang אִישׁ at hindi ito ginagawang maramihan, upang huwag alisin ang patulang anyo at posibleng pagtukoy sa pangyayari sa Shekem.
- source_word: וּבִרְצֹנָם
  choice: ayon sa sarili nilang kagustuhan
  rationale: Sa negatibong konteksto, ipinahihiwatig ng רָצוֹן ang kusang loob na pinaghaharian ng sariling kagustuhan. Natural ito sa Tagalog at hindi nagdaragdag ng higit na tiyak na motibo.
- source_word: עִקְּרוּ
  choice: pinutol nila ang litid
  rationale: Sa konteksto ng hayop, ang עקר ay tumutukoy sa pagputol ng litid sa hulihang paa o paghamstring. Ang parirala ay mas malinaw sa ordinaryong mambabasang Tagalog kaysa sa teknikal na hiram na salita.
- source_word: שׁוֹר
  choice: isang baka
  rationale: Ang שׁוֹר ay katawagan sa hayop na kabilang sa baka at maaaring mangahulugang toro o bakang pantrabaho. Ang “baka” ay sapat na malawak at hindi nagtatakda ng kasarian o gamit na hindi tiyak sa talata.
theological_decisions:
- issue: Kahulugan ng כְּבֹדִי sa patulang pahayag ng paglayo sa karahasan
  choice: aking karangalan
  alternative: aking kaluwalhatian
  rationale: Ang “karangalan” ay likas na nagpapahayag ng personal na dangal o reputasyon ni Jacob at umiiwas sa di-kinakailangang teolohikal na pahiwatig na maaaring idulot ng “kaluwalhatian.”
- issue: Pagbasa sa שׁוֹר sa huling linya
  choice: isang baka
  alternative: isang pader
  rationale: Ang patinig ng Masoretikong teksto ay שׁוֹר, “baka,” at ang pandiwang עקר ay angkop sa pagputol ng litid ng hayop. Gayunman, pinananatili sa talababa ang kilalang alternatibong pagbasa na “pader” upang hindi ikubli ang tekstuwal na interpretasyon.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang patulang paralelismo ng “kapulungan / pagtitipon,” ang Hebreong idyomang “aking kaluluwa,” at ang personipikasyon ng “aking karangalan.” Ginawang tahasan ang kilos na paghamstring bilang “pinutol ang litid” upang maging malinaw sa karaniwang mambabasa.
