  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בִּרְכֹ֣ת אָבִ֗י/ךָ גָּֽבְרוּ֙ עַל בִּרְכֹ֣ת הוֹרַ֔/י עַֽד תַּאֲוַ֖ת גִּבְעֹ֣ת עוֹלָ֑ם תִּֽהְיֶ֨ין֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/026.yaml
  text: The blessings of your father have prevailed beyond the blessings of my parents[a], to the utmost bounds of the ancient hills. May they be on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: tl
  text: Ang mga pagpapala ng iyong ama ay nanaig kaysa sa mga pagpapala ng aking mga magulang, hanggang sa pinakadulo ng mga burol na mula pa noong unang panahon.[a] Mapasa ulo ni Jose nawa ang mga ito, at sa tuktok ng kanyang ulo—siya na ibinukod mula sa kanyang mga kapatid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga burol na walang hanggan.”
    reason: Pinananatili ang leksikal na alternatibo para sa עוֹלָם sa patulang parirala.
  - marker: b
    text: O “ang prinsipe sa gitna ng kanyang mga kapatid”; Hebreo, “ang ibinukod/itinalaga mula sa kanyang mga kapatid.”
    reason: Ipinakikita ang posibleng interpretasyong “prinsipe” habang pinananatili ang pangunahing kahulugan ng נְזִיר na pagiging ibinukod o itinalaga.
lexical_decisions:
- source_word: בִּרְכֹת
  choice: mga pagpapala
  rationale: Pinananatili ang anyong maramihan at ang diwa ng pinagsama-samang mga biyayang ipinagkakaloob sa patulang pagpapala.
- source_word: אָבִיךָ
  choice: iyong ama
  rationale: Tumutugma sa ikalawang panauhang hulapi sa tekstong Hebreo at sa tuwirang pakikipag-usap ni Jacob kay Jose.
- source_word: גָּבְרוּ עַל
  choice: ay higit sa
  rationale: Natural na Filipino para sa paghahambing na nagsasaad ng paglampas o pagiging mas makapangyarihan, nang hindi pinabibigat ang patulang linya.
- source_word: הוֹרַי
  choice: aking mga magulang
  rationale: Tuwirang salin ng maramihang anyong tumutukoy sa mga nagluwal o naging magulang ni Jacob; hindi pinalalawak nang walang katiyakan tungo sa lahat ng ninuno.
- source_word: עַד תַּאֲוַת
  choice: hanggang sa hangganan
  rationale: Ang mahirap na patulang parirala ay ipinapahayag bilang saklaw o dulong naaabot; pinananatiling maunawaan habang hindi ginagawang labis na tiyak ang isang di-tiyak na idyoma.
- source_word: גִּבְעֹת עוֹלָם
  choice: mga burol na mula pa noong unang panahon
  rationale: Ipinahahayag ang diwa ng napakatanda o sinaunang mga burol; iniiwasan ang salitang 'walang hanggan' bilang tanging interpretasyon.
- source_word: תִּהְיֶיןָ
  choice: Mapasa ... nawa
  rationale: Ipinakikita ang jussive o mapagpalang hangarin ng pandiwa sa konteksto ng basbas.
- source_word: לְרֹאשׁ
  choice: mapasa ulo
  rationale: Natural na pormula sa Filipino para sa mga pagpapalang inilalagay o nananahan sa ulo ng pinagpapala.
- source_word: קָדְקֹד
  choice: tuktok ng ulo
  rationale: Malinaw na tumutukoy sa pinakaitaas o korona ng ulo at pinananatili ang paralelismo sa 'ulo.'
- source_word: נְזִיר אֶחָיו
  choice: ibinukod sa kanyang mga kapatid
  rationale: Pinananatili ang pangunahing diwa ng pagiging nakatalaga o hiwalay, nang hindi ipinapalagay ang teknikal na institusyon ng Nazireo o nililimitahan ito sa politikal na titulong prinsipe.
theological_decisions:
- issue: Kahulugan ng bansag kay Jose na נְזִיר אֶחָיו
  choice: ibinukod sa kanyang mga kapatid
  alternative: prinsipe sa kanyang mga kapatid; itinalaga sa kanyang mga kapatid; Nazireo sa kanyang mga kapatid
  rationale: Pinananatili ng 'ibinukod' ang tensiyon sa pagitan ng pagkakahiwalay, natatanging katayuan, at posibleng pagtatalaga kay Jose, nang hindi ipinapasok ang mas huling teknikal na konsepto ng Nazireo o ginagawang tiyak na politikal ang salita.
translation_notes:
  register: Makabago ngunit marangal na Filipino; patula ang ritmo ngunit madaling maunawaan. Ginamit ang 'mapasa ... nawa' upang mapanatili ang himig ng pormal na pagpapala. Ang mga talababa ay minarkahan sa pangunahing teksto bilang [a] at [b].
