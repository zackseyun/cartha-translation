  yaml_path: translation/ot/genesis/049/003.yaml
  text: Reuben[a], you are my firstborn, my strength and the firstfruits of my vigor[b], excelling in honor and excelling in power.
translation:
  language: tl
  text: Ruben, ikaw ang panganay ko, ang aking lakas at unang bunga ng aking kalakasan[a], nangingibabaw sa dangal at nangingibabaw sa kapangyarihan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pasimula ng aking lakas.” Ang pariralang Hebreo ay tumutukoy sa unang bunga ng lakas ng isang ama sa pag-aanak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nangunguna sa karangalan at nangunguna sa lakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרִי
  choice: panganay ko
  rationale: Ipinahahayag ng בְּכוֹר ang pagiging unang anak na lalaki at ang kaakibat nitong katayuan; likas at malinaw sa modernong Tagalog ang “panganay ko.”
- source_word: כֹּחִי
  choice: aking lakas
  rationale: Karaniwang kahulugan ng כֹּחַ ang lakas o kapangyarihan. Pinananatili ng “aking lakas” ang tuwirang metapora at ang himig ng tula.
- source_word: רֵאשִׁית אוֹנִי
  choice: unang bunga ng aking sigla
  rationale: Tumutukoy ang parirala sa unang pagpapahayag ng lakas na nagbibigay-buhay ng ama. Ipinahihiwatig ng “unang bunga” ang pagkauna at pinananatili ng “sigla” ang saklaw ng אוֹן nang hindi nagiging klinikal o magaspang.
- source_word: יֶתֶר שְׂאֵת
  choice: nakahihigit sa dangal
  rationale: Ipinahahayag ng יֶתֶר ang kahigitan o kasaganaan, samantalang maaaring tumukoy ang שְׂאֵת sa kataasan, karangalan, o dangal. Malinaw at patula ang “nakahihigit sa dangal.”
- source_word: יֶתֶר עָז
  choice: nakahihigit sa kapangyarihan
  rationale: Ang עָז ay lakas, bagsik, o kapangyarihan. Inuulit ang “nakahihigit” upang mapanatili ang mahigpit na paralelismo ng dalawang parirala.
- source_word: אַתָּה
  choice: ikaw ang
  rationale: Ang tahasang panghalip ay may diin sa direktang pagtawag kay Ruben; natural itong naipahahayag sa Tagalog bilang “ikaw ang.”
