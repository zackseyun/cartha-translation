  naturalness: Marangal at natural sa makabagong Tagalog ang kabuuan. Ang "nangingibabaw sa dangal" ay mas likas kaysa "nakahihigit sa dangal," na maaaring magpahiwatig na may tiyak na bagay na nilalampasan sa dangal sa halip na katayuang namumukod sa dangal.
  terminology: Ang "panganay," "lakas," "kalakasan," "dangal," at "kapangyarihan" ay angkop. Pinananatili ng "kalakasan" ang pagkakaiba ng כֹּחִי at אוֹנִי nang hindi ginagawang klinikal ang huli.
