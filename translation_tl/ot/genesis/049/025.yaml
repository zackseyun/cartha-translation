  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מֵ/אֵ֨ל אָבִ֜י/ךָ וְ/יַעְזְרֶ֗/ךָּ וְ/אֵ֤ת שַׁדַּי֙ וִ/יבָ֣רְכֶ֔/ךָּ בִּרְכֹ֤ת שָׁמַ֨יִם֙ מֵ/עָ֔ל בִּרְכֹ֥ת תְּה֖וֹם רֹבֶ֣צֶת תָּ֑חַת בִּרְכֹ֥ת שָׁדַ֖יִם וָ/רָֽחַם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/025.yaml
  text: by the God of your father[a], who will help you, and by the Almighty, who will bless you with blessings of heaven above, blessings of the deep lying beneath[b], blessings of breasts and womb.
translation:
  language: tl
  text: 'mula sa Diyos ng iyong ama[a], na tutulong sa iyo,

    at mula sa Makapangyarihan, na magpapala sa iyo

    ng mga pagpapala ng langit sa itaas,

    ng mga pagpapala ng kalalimang nakahimlay sa ibaba[b],

    ng mga pagpapala ng mga dibdib at sinapupunan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan ng Diyos ng iyong ama … at kasama ng Makapangyarihan.” Siksik ang pagkakaugnay ng mga pang-ukol at ng kataga bago ang “Makapangyarihan” sa Hebreo; maaaring ipahiwatig ng mga ito ang pinagmumulan, ang gumagawa, o ang malapit na pagtutumbas ng dalawang titulo.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “kalalimang nakayukyok sa ibaba.” Ang pandiwang Hebreo ay maaaring mangahulugang “nakahimlay” o “nakayukyok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵל אָבִיךָ
  choice: mula sa Diyos ng iyong ama
  rationale: Pinananatili ng “mula sa” ang karaniwang diwa ng מִן bilang pinagmumulan, habang ang “Diyos ng iyong ama” ang tuwirang kahulugan ng parirala. Dahil siksik at mahirap ang sintaks sa Hebreo, nililinaw sa talababa ang iba pang posibleng ugnayan.
- source_word: יַעְזְרֶךָ
  choice: na tutulong sa iyo
  rationale: Ang sugnay na may “na” ay natural sa Tagalog at malinaw na iniuugnay ang Diyos bilang simuno ng pandiwa nang hindi dinaragdagan ang kahulugan.
- source_word: וְאֵת שַׁדַּי
  choice: at mula sa Makapangyarihan
  rationale: Ang אֵת dito ay di-karaniwan at maaaring magpahiwatig ng koordinasyon o apposition. Ang “at mula sa” ay maayos na kaagapay ng unang parirala at pinananatili ang Diyos bilang pinagmumulan ng tulong at pagpapala.
- source_word: שַׁדַּי
  choice: ang Makapangyarihan
  rationale: Isinalin ang banal na titulo sa natural at dignified na Tagalog sa halip na itransliterado.
- source_word: וִיבָרְכֶךָ
  choice: na magpapala sa iyo
  rationale: Ang anyong ito ay malinaw at natural sa konteksto ng isang propetikong basbas.
- source_word: בִּרְכֹת שָׁמַיִם מֵעָל
  choice: mga pagpapala ng langit sa itaas
  rationale: Pinananatili nito ang patulang larawan at ang pagtutumbas ng itaas at ibaba.
- source_word: תְּהוֹם רֹבֶצֶת תָּחַת
  choice: kalalimang nakahimlay sa ibaba
  rationale: Ang תְּהוֹם ay tumutukoy sa malalim na katubigan o kailaliman; “kalaliman” ay malinaw at patula. Ang רֹבֶצֶת ay maaaring “nakahimlay” o “nakakubli/nakayukyok”; pinili ang una bilang mas natural para sa tubig sa ilalim.
- source_word: שָׁדַיִם וָרָחַם
  choice: mga dibdib at sinapupunan
  rationale: Tuwirang pinananatili ang mga larawang tumutukoy sa pagpapasuso, pagkamayabong, at pag-aanak. Natural sa Tagalog ang pangkalahatang “sinapupunan” kahit pang-isahan ang anyo sa Hebreo.
theological_decisions:
- issue: Paglalarawan sa banal na titulong שַׁדַּי
  choice: ang Makapangyarihan
  alternative: Shaddai
  rationale: Ang pagsasalin sa titulo ay naghahatid ng kinikilalang diwa nito sa karaniwang mambabasa nang hindi nagdaragdag ng partikular na doktrinal na paliwanag.
- issue: Ugnayan ng מֵאֵל at וְאֵת שַׁדַּי sa mga pandiwa
  choice: mula sa Diyos ... at mula sa Makapangyarihan
  alternative: sa pamamagitan ng Diyos ... at kasama ng Makapangyarihan / samakatuwid, ang Makapangyarihan
  rationale: Sadyang siksik at hindi tiyak ang sintaks. Pinili sa teksto ang pagbasa sa mga parirala bilang pinagmumulan ng tulong at pagpapala, habang pinananatili sa talababa ang tunay na alternatibo tungkol sa agency at apposition.
translation_notes:
  register: Makabagong Filipino Tagalog na patula at marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit ng “mga pagpapala” at ang paralelismong “sa itaas/sa ibaba.” Ang “dibdib at sinapupunan” ay tuwiran ngunit angkop sa dignidad ng sinaunang basbas.
