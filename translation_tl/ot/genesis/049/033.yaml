base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/033.yaml
  text: When Jacob finished commanding his sons[a], he drew his feet up into the bed, breathed his last[b], and was gathered to his people.
translation:
  language: tl
  text: Nang matapos nang tagubilinan ni Jacob ang kanyang mga anak na lalaki, iniakyat niya sa higaan ang kanyang mga paa,[a] nalagutan siya ng hininga, at natipon siya sa kanyang mga kaanak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tinipon niya ang kanyang mga paa sa higaan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “natipon sa kanyang mga kaanak” ay isang Hebreong pananalitang kaugnay ng kamatayan at ng pagsama sa sariling mga tao. Higit ito sa simpleng pahayag na inilibing ang isang tao.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכַל
  choice: nang matapos
  rationale: Ipinapahayag ng pandiwa ang pagkakumpleto sa ginawa ni Jacob at pinananatili ang sunod-sunod na daloy ng salaysay.
- source_word: לְצַוֹּת
  choice: na tagubilinan
  rationale: Ang צוה ay maaaring mangahulugang mag-utos o magbilin. Ang “tagubilinan” ay angkop sa marangal na konteksto ng mga huling bilin ni Jacob nang hindi pinahihina ang awtoritatibong himig.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng Hebreo at ng agarang konteksto.
- source_word: וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה
  choice: iniakyat niya sa higaan ang kanyang mga paa
  rationale: Literal na “tinipon” ang mga paa, ngunit likas sa modernong Tagalog ang “iniakyat ... sa higaan” para sa pagkilos ng paghila o pag-urong ng mga paa pabalik sa higaan.
- source_word: וַיִּגְוַע
  choice: nalagutan siya ng hininga
  rationale: Pinananatili nito ang diwa ng pagpanaw o paghinga ng huli at hindi ito basta inuulit bilang “namatay” bago ang kasunod na idyoma.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: natipon siya sa kanyang mga kaangkan
  rationale: Pinananatili ang larawang “natipon” at ang kaugnayan sa sariling mga tao o angkan, nang hindi ito ginagawang simpleng pahayag tungkol sa paglilibing.
theological_decisions:
- issue: Kahulugan ng “natipon siya sa kanyang mga kaangkan”
  choice: Panatilihin ang Hebreong idyoma at huwag ipakahulugang paglilibing lamang.
  alternative: inilibing siyang kasama ng kanyang mga ninuno; namatay siya at sumama sa kanyang mga ninuno
  rationale: Naganap ang paglilibing kay Jacob sa sumunod na kabanata, kaya hindi maaaring itumbas lamang ang parirala sa paglilibing. Pinananatili ng salin ang pahiwatig tungkol sa kamatayan at pagkakaugnay sa mga naunang kaangkan nang hindi nilulutas ang lahat ng maaaring teolohikal na kahulugan nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tagubilinan” para sa solemne at awtoritatibong huling bilin, at pinanatili ang idyomatikong “natipon” upang huwag patagin ang pahiwatig ng orihinal.
