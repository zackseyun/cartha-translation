  text: For your salvation I wait[a], O Yahweh.
translation:
  language: tl
  text: Ang pagliligtas mo ang hinihintay ko[a], Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang pagliligtas mo ang hinintay ko,” o “Inasam ko ang pagliligtas mo.”'
    reason: Ipinakikita ang posibleng aspektong ganap ng קִוִּיתִי at ang kahulugan nitong paghihintay na may pag-asa.
lexical_decisions:
- source_word: לִישׁוּעָתְךָ
  choice: ang pagliligtas mo
  rationale: Ang יְשׁוּעָה ay maaaring tumukoy sa kaligtasan, pagliligtas, o tagumpay. Pinili ang “pagliligtas” dahil natural ito sa kasalukuyang Tagalog at pinananatili ang diwa ng aktuwal na pagsagip nang hindi ito nililimitahan sa tagumpay sa digmaan. Ang paglalagay nito sa unahan ay sumasalamin sa diin ng Hebreo.
- source_word: קִוִּיתִי
  choice: ang hinihintay ko
  rationale: Ang קוה ay paghihintay na may pag-asa at pananabik. Ang “hinihintay ko” ay likas sa Tagalog at naipapahayag ang patuloy na paghihintay, bagaman maaari ring unawain ang anyong Hebreo bilang “hinintay ko” o “inaasam ko.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang “Yahweh” upang katawanin ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Saklaw ng יְשׁוּעָה
  choice: pagliligtas
  alternative: kaligtasan; tagumpay
  rationale: Hindi nilimitahan ang salita sa espirituwal na kaligtasan o sa tagumpay sa digmaan lamang; ang “pagliligtas” ay nagpapanatili sa malawak at agarang diwa ng pahayag.
- issue: Pagpapahayag sa aspektong pandiwa ng קִוִּיתִי
  choice: hinihintay ko
  alternative: hinintay ko; inasam ko
  rationale: Maaaring ipahiwatig ng Hebreong perfect ang isang paghihintay na naganap o nananatiling matatag. Pinili ang aspektong nagaganap upang maipakita ang patuloy na pagtitiwala, habang inilalahad sa talababa ang ibang posibleng pagbasa.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: YHWH; ang PANGINOON
  rationale: Pinananatili ang banal na pangalan bilang pangalan, hindi bilang pamalit na titulo.
translation_notes:
  register: Maikli, patula, at marangal ang pananalita. Inuna ang “Ang pagliligtas mo” upang mapanatili ang diin ng Hebreo, ngunit ginamit ang natural na hulma ng makabagong Tagalog.
