  register: Makabagong Filipino na may marangal at patulang himig. Ginamit ang magkatambal na “daan” at “landas” upang mapanatili ang paralelismo ng Hebreo, at inayos sa maiikling taludtod ang pangungusap upang maipakita ang anyong patula.
