  text: יְהִי דָן֙ נָחָ֣שׁ עֲלֵי דֶ֔רֶךְ שְׁפִיפֹ֖ן עֲלֵי אֹ֑רַח הַ/נֹּשֵׁךְ֙ עִקְּבֵי ס֔וּס וַ/יִּפֹּ֥ל רֹכְב֖/וֹ אָחֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/017.yaml
  text: Let Dan be a serpent by the road[a], a viper by the path, that bites the horse’s heels so that its rider falls backward.
translation:
  language: tl
  text: 'Maging ahas nawa si Dan sa tabi ng daan,

    isang ulupong[a] sa tabi ng landas,

    na kumakagat sa mga sakong ng kabayo,

    kaya nahuhulog nang patalikod ang sakay nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang uri ng makamandag na ahas.” Bihira ang salitang Hebreo na שְׁפִיפֹן, at hindi tiyak ang eksaktong uri ng ahas na tinutukoy nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Maging ... nawa
  rationale: Pinananatili nito ang volitibo o mapagpahayag na diwa ng Qal jussive sa konteksto ng pagpapala, sa halip na gawin lamang itong payak na pahayag tungkol sa hinaharap.
- source_word: דָן
  choice: Dan
  rationale: Pangalan ito ng anak at lipi; pinananatili ang nakasanayang transliterasyon sa Filipino.
- source_word: נָחָשׁ
  choice: ahas
  rationale: Pangkalahatang tawag ito sa snake o serpent at likas, malinaw, at marangal pakinggan sa makabagong Filipino.
- source_word: עֲלֵי דֶרֶךְ
  choice: sa tabi ng daan
  rationale: Ipinapahiwatig ng parirala ang kinaroroonan ng ahas kaugnay ng daan at malinaw nitong naihahatid ang larawang nag-aabang upang manambang.
- source_word: שְׁפִיפֹן
  choice: ulupong
  rationale: Bihira at hindi tiyak ang eksaktong uri ng ahas na tinutukoy ng salitang Hebreo. Ang “ulupong” ay natural na salitang Filipino para sa isang mapanganib at makamandag na ahas nang hindi nagtatakda ng tiyak na espesye.
- source_word: עֲלֵי אֹרַח
  choice: sa tabi ng landas
  rationale: Pinananatili ng “landas” ang patulang paralelismo at pagkakaiba nito sa naunang “daan.”
- source_word: הַנֹּשֵׁךְ
  choice: na kumakagat
  rationale: Tuwirang inilalarawan ng participle ang kilos ng ahas. Pinananatili ng “kumakagat” ang karaniwang kahulugan ng pandiwang Hebreo nang hindi dinaragdagan ang teksto ng tahasang pagtukoy sa kamandag.
- source_word: עִקְּבֵי סוּס
  choice: mga sakong ng kabayo
  rationale: Tinutukoy ng construct phrase ang hulihang bahagi o mga sakong ng kabayo; pangkalahatan ang gamit sa isahan ng “kabayo.”
- source_word: וַיִּפֹּל
  choice: kaya nahuhulog
  rationale: Inihahatid ng “kaya” ang likas na resultang sumusunod sa pagkagat, samantalang ang “nahuhulog” ay nagpapanatili sa masiglang larawan ng tula.
- source_word: רֹכְבוֹ
  choice: ang sakay nito
  rationale: Ang hulaping panghalip ay pinakamalapit na tumutukoy sa kabayo. Malinaw at natural sa Filipino ang “sakay nito.”
- source_word: אָחוֹר
  choice: nang patalikod
  rationale: Likas nitong ipinapahayag sa Filipino ang direksiyon ng pagkahulog ng sakay.
