base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/005.yaml
  text: Simeon and Levi are brothers[a]; weapons of violence are their swords.
translation:
  language: tl
  text: Magkapatid sina Simeon at Levi; mga sandata ng karahasan ang kanilang mga tabak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan ng pambihirang salitang Hebreo na isinaling “kanilang mga tabak.” Maaari rin itong tumukoy sa “kanilang mga kagamitan”; sa ilang matatandang salin, “kanilang mga tirahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוֹן וְלֵוִי
  choice: Simeon at Levi
  rationale: Ginamit ang karaniwang anyo ng mga pangalang pantangi sa modernong saling Tagalog, at tuwirang isinalin ang pang-ugnay.
- source_word: אַחִים
  choice: Magkapatid
  rationale: Tumutukoy ito rito sa literal na pagiging magkapatid at kasabay na nag-uugnay sa dalawa sa iisang marahas na pagkilos. Ang “magkapatid” ang pinakanatural na katumbas sa Tagalog.
- source_word: כְּלֵי
  choice: mga sandata
  rationale: Malawak ang kahulugan ng salita—mga kagamitan, kasangkapan, o sandata—ngunit dahil idinugtong ito sa “karahasan,” malinaw na naihahayag ng “mga sandata” ang mapanirang gamit sa konteksto.
- source_word: חָמָס
  choice: karahasan
  rationale: Tuwirang ipinahahayag nito ang marahas na paggawa o marahas na kasamaan; natural at sapat ang “karahasan” sa kontekstong ito.
- source_word: מְכֵרֹתֵיהֶם
  choice: kanilang mga tabak
  rationale: Napakabihira at hindi tiyak ang salitang Hebreo. Ang “mga tabak” ay isang kongkreto at madaling maunawaang pagbasa na akma sa pagbanggit ng mga sandata, habang inilalahad sa talababa ang tunay na kawalang-katiyakan ng salita.
