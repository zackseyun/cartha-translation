base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/028.yaml
  text: Jacob lived in the land of Egypt seventeen years[a], and the days of Jacob, the years of his life, were one hundred forty-seven years.
translation:
  language: tl
  text: Nabuhay si Jacob sa lupain ng Ehipto nang labimpitong taon. Ang mga araw ni Jacob, ang mga taon ng kanyang buhay,[a] ay umabot sa isandaan at apatnapu’t pitong taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang mga araw ni Jacob, ang mga taon ng kanyang buhay,” isang paraan ng pagsasabi ng kabuuang haba ng kanyang buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: Nabuhay
  rationale: Tuwirang ipinapahayag ng anyong pasalaysay ng חיה na patuloy na nabuhay si Jacob sa loob ng tinukoy na panahon; mas tapat ito kaysa “nanirahan,” na pangunahing tumutukoy sa paninirahan.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang אֶרֶץ (“lupain”) sa Hebreo, at likas pa rin itong pakinggan sa makabagong Tagalog.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: nang labimpitong taon
  rationale: Ang “nang” ay natural na nagmamarka sa haba ng panahong ipinagpatuloy niyang mabuhay roon.
- source_word: יְמֵי יַעֲקֹב
  choice: Ang mga araw ni Jacob
  rationale: Pinananatili ang Hebreong idyomang “mga araw ni Jacob” sa halip na agad itong gawing “buhay ni Jacob.”
- source_word: שְׁנֵי חַיָּיו
  choice: ang mga taon ng kanyang buhay
  rationale: Pinananatili ang kasunod na pariralang nagpapaliwanag sa “mga araw ni Jacob” at likas itong maunawaan sa Tagalog.
- source_word: וַיְהִי
  choice: ay umabot sa
  rationale: Sa pangungusap na nagbubuod ng kabuuang haba ng buhay, malinaw at natural sa Tagalog ang “umabot sa,” nang hindi binabago ang bilang.
- source_word: שֶׁבַע שָׁנִים וְאַרְבָּעִים וּמְאַת שָׁנָה
  choice: isandaan at apatnapu’t pitong taon
  rationale: Inaayos ang pagkakasunod ng mga bilang ayon sa karaniwang ayos sa Tagalog habang eksaktong pinananatili ang kabuuang 147 taon.
