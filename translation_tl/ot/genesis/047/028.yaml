  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang Hebreong pag-uulit na nagpapaliwanag sa haba ng buhay ni Jacob, ngunit hinati sa dalawang pangungusap upang maging malinaw at natural ang daloy.
