id: GEN.47.27
reference: Genesis 47:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּ֧שֶׁב יִשְׂרָאֵ֛ל בְּ/אֶ֥רֶץ מִצְרַ֖יִם בְּ/אֶ֣רֶץ גֹּ֑שֶׁן וַ/יֵּאָחֲז֣וּ בָ֔/הּ וַ/יִּפְר֥וּ וַ/יִּרְבּ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/027.yaml
  text: So Israel settled in the land of Egypt[a], in the land of Goshen, and they gained possessions in it and were fruitful and multiplied greatly.
translation:
  language: tl
  text: Nanirahan si Israel sa lupain ng Ehipto, sa lupain ng Gosen. Nagkaroon sila roon ng mga ari-arian[a], at naging mabunga sila at lubhang dumami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagtamo sila roon ng mga pag-aari” o “matatag silang nanirahan doon.” Mas literal, ipinahihiwatig ng pandiwang Hebreo na nagkaroon sila ng hawak o paninirahan sa lupain. Maaari itong tumukoy sa pagtatamo ng pag-aari o sa pagiging matatag na nakapamayan doon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Nanirahan
  rationale: Ipinahihiwatig ng ישׁב ang paninirahan o pagtira nang matatag; natural sa Filipino ang “nanirahan” at hindi nito ipinapalagay na pansamantala lamang ang kanilang paglagi.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Israel ang tahasang pangalang ginamit sa Hebreo. Pinananatili ito sa halip na gawing “Jacob” o “mga Israelita,” upang mapanatili ang paglipat mula sa isahang kinatawan patungo sa maramihang sambahayan.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang “lupain” ng Hebreo at ang diin sa teritoryo.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: sa lupain ng Gosen
  rationale: Pinananatili ang magkatulad na Hebreong parirala at ipinakikitang ang Gosen ay isang natatanging rehiyon sa Ehipto.
- source_word: וַיֵּאָחֲזוּ בָהּ
  choice: Nagkaroon sila roon ng mga ari-arian[a]
  rationale: Sa konteksto, maaaring tumukoy ang Niphal ng אחז sa pagkakaroon ng hawak o pag-aari at sa matatag na pagkakatatag sa lupain. Ang pangunahing salin ay natural at kongkreto, habang inilalahad sa talababa ang tunay na lawak ng kahulugan.
- source_word: וַיִּפְרוּ
  choice: naging mabunga sila
  rationale: Pinananatili ng “naging mabunga” ang mahalagang temang פרה sa Genesis at ang ugnayan nito sa pagpapala at pagdami.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: lubhang dumami
  rationale: Ang “dumami” ay tuwirang nagsasaad ng רבה, at ang “lubha” ay naghahatid ng matinding diin ng מְאֹד sa marangal ngunit kasalukuyang Filipino.
theological_decisions:
- issue: Ang kinatawang diwa ng “Israel” at ang paglipat mula isahan tungo sa maramihan
  choice: Panatilihin ang “Israel” bilang isahang paksa sa unang pangungusap, saka panatilihin ang maramihang “sila” sa mga sumunod na kilos.
  alternative: Isalin ang buong talata bilang tumutukoy sa “mga Israelita,” o palitan ang “Israel” ng “Jacob.”
  rationale: Isahan ang pandiwa sa simula ng Hebreo ngunit maramihan ang kasunod na mga pandiwa. Pinananatili ng salin ang gramatikal at teolohikal na tensiyon kung saan si Israel na patriyarka ay kumakatawan sa kanyang sambahayan o mga inapo, nang hindi ito tahasang nilulutas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “lupain” sa parehong heograpikong parirala, ang temang “maging mabunga at dumami,” at ang biglang paglipat mula sa isahang “Israel” tungo sa maramihang “sila.”
