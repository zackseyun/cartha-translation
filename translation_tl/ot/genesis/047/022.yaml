  text: רַ֛ק אַדְמַ֥ת הַ/כֹּהֲנִ֖ים לֹ֣א קָנָ֑ה כִּי֩ חֹ֨ק לַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת פַּרְעֹ֗ה וְ/אָֽכְל֤וּ אֶת חֻקָּ/ם֙ אֲשֶׁ֨ר נָתַ֤ן לָ/הֶם֙ פַּרְעֹ֔ה עַל כֵּ֕ן לֹ֥א מָכְר֖וּ אֶת אַדְמָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/022.yaml
  text: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
translation:
  language: tl
  text: Tanging ang lupain ng mga pari ang hindi binili ni Jose, sapagkat may takdang bahagi[a] silang mula sa Faraon. Kinakain nila ang takdang bahaging ibinigay sa kanila ng Faraon, kaya hindi nila ipinagbili ang kanilang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “takdang panustos,” “bahagi,” o “rasyon.” Ang Hebreong חֹק / חֻקָּם dito ay tumutukoy sa panustos na opisyal na inilaan sa kanila, hindi pangunahin sa isang batas o tuntunin.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Tanging
  rationale: Ipinakikita nito na ang lupain ng mga pari ang eksepsiyon sa naunang pangkalahatang pahayag.
- source_word: אַדְמַת הַכֹּהֲנִים
  choice: ang lupain ng mga pari
  rationale: Tumutukoy ito sa lupaing pag-aari ng mga pari at malinaw sa likas na modernong Tagalog.
- source_word: לֹא קָנָה
  choice: hindi binili ni Jose
  rationale: Ang קָנָה ay tumutukoy sa pagbili sa kontekstong pangkabuhayan; nilinaw ang ipinahihiwatig na simuno mula sa konteksto upang maging natural sa Tagalog.
- source_word: חֹק / חֻקָּם
  choice: takdang bahagi / takdang bahagi nila
  rationale: Dito, ang salita ay tumutukoy sa opisyal na inilaan na panustos o rasyon, hindi pangunahin sa isang batas o tuntunin.
- source_word: מֵאֵת פַּרְעֹה
  choice: mula sa Faraon
  rationale: Ipinahahayag ng parirala ang pinagmulan ng takdang bahagi.
- source_word: וְאָכְלוּ אֶת חֻקָּם
  choice: Kinakain nila ang takdang bahagi
  rationale: Pinananatili ang kongkretong pandiwang 'kumain' sa Hebreo sa halip na palitan ito ng mas interpretatibong 'namumuhay sila mula sa kanilang panustos.'
- source_word: אֲשֶׁר נָתַן לָהֶם פַּרְעֹה
  choice: na ibinibigay sa kanila ng Faraon
  rationale: Ang aspektong di-ganap ay angkop sa paulit-ulit o patuloy na panustos sa konteksto, bagaman ang Hebreo ay gumagamit ng anyong salaysay na maaaring literal na isaling 'ibinigay.'
- source_word: עַל כֵּן
  choice: kaya
  rationale: Likas at malinaw na naghuhudyat ng bunga o konklusyon.
- source_word: לֹא מָכְרוּ אֶת אַדְמָתָם
  choice: hindi nila ipinagbili ang kanilang lupain
  rationale: Tuwirang inilalarawan ang hindi nila pagbebenta ng kanilang pag-aari.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “Faraon,” ang karaniwang anyong biblikal sa Tagalog, at pinanatili ang kongkretong larawan ng pagkain mula sa panustos.
