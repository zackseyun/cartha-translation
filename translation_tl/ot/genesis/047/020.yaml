  source_fidelity: Tumpak ang salin sa Hebreo. Naipapahayag nito ang pagbili ni Jose ng lahat ng lupain ng Ehipto para kay Paraon, ang pamamahaging pagbebenta ng mga Ehipsiyo ng kani-kanilang bukid, ang tindi ng taggutom na dumagan sa kanila, at ang kinahinatnang pagmamay-ari ni Paraon sa lupain.
