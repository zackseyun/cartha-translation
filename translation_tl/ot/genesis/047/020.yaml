  text: וַ/יִּ֨קֶן יוֹסֵ֜ף אֶת כָּל אַדְמַ֤ת מִצְרַ֨יִם֙ לְ/פַרְעֹ֔ה כִּֽי מָכְר֤וּ מִצְרַ֨יִם֙ אִ֣ישׁ שָׂדֵ֔/הוּ כִּֽי חָזַ֥ק עֲלֵ/הֶ֖ם הָ/רָעָ֑ב וַ/תְּהִ֥י הָ/אָ֖רֶץ לְ/פַרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/020.yaml
  text: So Joseph bought all the land of Egypt for Pharaoh[a], because every Egyptian sold his field, for the famine was severe upon them[b]; and the land became Pharaoh’s.
translation:
  language: tl
  text: Kaya binili ni Jose para sa Paraon ang lahat ng lupain sa Ehipto[a], sapagkat ipinagbili ng bawat Ehipsiyo ang kaniyang bukid dahil napakatindi ng taggutom na dumagan sa kanila[b]. Sa gayon, ang lupain ay naging pag-aari ng Paraon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakuha ni Jose para sa Paraon ang lahat ng lupain sa Ehipto.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “naging malakas sa kanila ang taggutom.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: binili
  rationale: Ang Qal na anyo ng קנה ay tumutukoy rito sa komersiyal na pagkuha, yamang ipinagbibili ng mga Ehipsiyo ang kanilang mga bukid.
- source_word: אַדְמַת מִצְרַיִם
  choice: lupain sa Ehipto
  rationale: Sa konteksto ng pagbebenta at pagmamay-ari, ang אַדְמָה ay lupain bilang ari-ariang pansakahan, hindi lamang lupa o soil.
- source_word: לְפַרְעֹה
  choice: para sa Paraon
  rationale: Ipinakikita ng לְ na si Paraon ang makikinabang at tatanggap ng pagmamay-ari, habang si Jose ang nagsasagawa ng pagbili.
- source_word: מָכְרוּ מִצְרַיִם אִישׁ שָׂדֵהוּ
  choice: ipinagbili ng bawat Ehipsiyo ang kaniyang bukid
  rationale: Inilalahad nang likas sa Tagalog ang kolektibong ‘mga Ehipsiyo’ at ang pamamahaging אִישׁ, na nangangahulugang bawat isa ay nagbenta ng sarili niyang bukid.
- source_word: חָזַק עֲלֵהֶם הָרָעָב
  choice: napakatindi ng taggutom na dumagan sa kanila
  rationale: Ang חזק ay literal na ‘lumakas/naging malakas,’ ngunit sa taggutom ay likas na nangangahulugang naging napakatindi; pinananatili ng ‘dumagan sa kanila’ ang larawan ng עֲלֵהֶם na isang kapahamakang mabigat na nasa ibabaw nila.
- source_word: וַתְּהִי הָאָרֶץ לְפַרְעֹה
  choice: ang lupain ay naging pag-aari ng Paraon
  rationale: 'Malinaw nitong ipinahahayag ang bunga ng transaksiyon: napunta kay Paraon ang legal na pagmamay-ari ng lupain.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaniyang” upang malinaw na tumukoy sa bawat Ehipsiyo, at ang “pag-aari ng Paraon” upang natural na maipahayag ang paglilipat ng pagmamay-ari.
