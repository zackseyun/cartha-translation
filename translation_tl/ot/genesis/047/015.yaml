base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/015.yaml
  text: When the money from the land of Egypt and from the land of Canaan was gone[a], all the Egyptians came to Joseph, saying, "Give us bread[c][b]. Why should we die before you? For the money is gone."
translation:
  language: tl
  text: Nang maubos na ang salapi[a] sa lupain ng Ehipto at sa lupain ng Canaan, pumunta kay Jose ang lahat ng taga-Ehipto[b] at sinabi, “Bigyan mo kami ng tinapay.[c] Bakit kami mamamatay sa harapan mo? Ubos na ang salapi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pilak”; ang Hebreong כֶּסֶף ay maaaring mangahulugang “pilak” o “salapi.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pumunta kay Jose ang buong Ehipto.”
    reason: lexical_alternative
  - marker: c
    text: Ang “tinapay” dito ay maaari ring tumukoy nang mas malawak sa pagkain dahil sa taggutom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֹּם
  choice: maubos na
  rationale: Ipinahihiwatig ng תמם ang pagkaubos o pagsapit sa wakas; natural sa Filipino ang “maubos na” sa konteksto ng salaping nagamit nang lahat.
- source_word: הַכֶּסֶף
  choice: ang salapi
  rationale: Maaaring mangahulugan ang כֶּסֶף ng pilak o salapi. Sa konteksto ng pagbili ng pagkain, salapi ang malinaw na tinutukoy, habang itinatala sa talababa ang literal na alternatibo.
- source_word: מֵאֶרֶץ מִצְרַיִם וּמֵאֶרֶץ כְּנַעַן
  choice: sa lupain ng Ehipto at sa lupain ng Canaan
  rationale: Bagaman may pang-ukol na מן, ang diwa rito ay pagkaubos ng salaping nasa dalawang lupain; “sa lupain” ang natural at tumpak na pagpapahayag sa Filipino.
- source_word: וַיָּבֹאוּ כָל מִצְרַיִם
  choice: pumunta kay Jose ang lahat ng taga-Ehipto
  rationale: Literal na “buong Ehipto,” ngunit metonimiya ito para sa mga mamamayan; malinaw itong naipapahayag ng “lahat ng taga-Ehipto.”
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Natural na Filipino na panimula sa tuwirang pananalita, katumbas ng Hebreong infinitive na nagpapakilala sa sinabi.
- source_word: הָבָה לָּנוּ לֶחֶם
  choice: Bigyan mo kami ng tinapay
  rationale: Pinananatili ang kongkretong לֶחֶם bilang “tinapay,” bagaman maaari rin itong tumukoy nang mas malawak sa pagkain.
- source_word: וְלָמָּה נָמוּת
  choice: Bakit kami mamamatay
  rationale: Pinananatili ang apurahang retorikal na tanong nang natural sa modernong Filipino.
- source_word: נֶגְדֶּךָ
  choice: sa harapan mo
  rationale: Ang נֶגֶד ay tumutukoy sa pagiging nasa harap o presensiya ng isang tao. Ang “sa harapan mo” ay malapit sa anyo ng Hebreo at natural sa Filipino.
- source_word: כִּי אָפֵס כָּסֶף
  choice: Ubos na ang salapi
  rationale: Ang אָפֵס ay nagsasaad na wala nang natitira. Ang maikli at mariing “Ubos na ang salapi” ay angkop sa pagsusumamo at inuulit ang lohika ng pambungad.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong “tinapay” at ang Hebreong larawan na “sa harapan mo,” habang ginawang likas sa Filipino ang metonimikong “buong Ehipto.”
