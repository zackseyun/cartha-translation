revisions:
- from: Tinipon ni Jose ang lahat ng pilak[a] na nasa lupain ng Ehipto at sa lupain ng Canaan bilang bayad sa butil na binibili ng mga tao. Pagkatapos, dinala ni Jose ang pilak sa sambahayan ni Faraon.[b]
  to: Tinipon ni Jose ang lahat ng pilak[a] na naroon sa lupain ng Ehipto at sa lupain ng Canaan bilang bayad sa butil na kanilang binibili, at dinala ni Jose ang pilak sa bahay ni Faraon.[b]
  rationale: Pinalitan ang idinagdag na “mga tao” ng “kanilang” upang mapanatili ang di-tahasang panghalip ng Hebreo. Ginawang “bahay ni Faraon” ang pangunahing teksto upang panatilihin ang leksikal na ambiguity ng בֵּיתָה פַרְעֹה, at inilagay ang mga posibleng institusyonal na kahulugan sa talababa. Pinanatili ang “pilak” at ang transaksiyonal na “bilang bayad sa butil.”
