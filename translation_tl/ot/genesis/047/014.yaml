  naturalness: Natural ang karamihan ng Filipino, ngunit mas direkta at mas malapit sa estruktura ng pinagmulan ang isang pangungusap na walang idinagdag na “Pagkatapos.” Ang “bahay ni Faraon” ay natural at mas literal kaysa “sambahayan,” habang pinananatili ng talababa ang mas malawak na institusyonal na saklaw.
  terminology: Ang “pilak,” “butil,” “Ehipto,” “Canaan,” at “Faraon” ay angkop. Pinanatili ang “pilak” sa pangunahing teksto at ang “salapi” bilang alternatibong leksikal sa talababa.
