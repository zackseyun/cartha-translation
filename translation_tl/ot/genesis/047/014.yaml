base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/014.yaml
  text: And Joseph gathered up all the silver found in the land of Egypt and in the land of Canaan for the grain that they were buying[b][a], and Joseph brought the silver into Pharaoh’s house.
translation:
  language: tl
  text: Tinipon ni Jose ang lahat ng pilak[a] na naroon sa lupain ng Ehipto at sa lupain ng Canaan bilang bayad sa butil na kanilang binibili, at dinala ni Jose ang pilak sa bahay ni Faraon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng salapi.” Literal na “pilak” ang Hebreo; ginagamit ang metal bilang pambayad.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ni Faraon” ay maaaring tumukoy hindi lamang sa tirahan ng hari kundi pati sa kaniyang maharlikang sambahayan o kabang-yaman.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְלַקֵּט
  choice: Tinipon
  rationale: Ipinahihiwatig ng לקט ang pagtitipon o pagkolekta mula sa maraming transaksiyon; natural at malinaw ang “tinipon” sa Filipino.
- source_word: כָּל הַכֶּסֶף
  choice: lahat ng pilak
  rationale: Ang כֶּסֶף ay literal na “pilak” at maaari ring mangahulugang salapi. Pinanatili sa teksto ang kongkretong katawagan ng Hebreo, na may paliwanag sa talababa.
- source_word: הַנִּמְצָא
  choice: na nasa
  rationale: Ang participle ay tumutukoy sa pilak na naroon o makikita sa mga lupaing iyon. Mas natural sa Filipino ang “na nasa” kaysa literal na “na natagpuan.”
- source_word: בְאֶרֶץ מִצְרַיִם וּבְאֶרֶץ כְּנַעַן
  choice: sa lupain ng Ehipto at sa lupain ng Canaan
  rationale: Pinananatili nito ang heograpikong diin at ang inuulit na “lupain” sa Hebreo.
- source_word: בַּשֶּׁבֶר
  choice: bilang bayad sa butil
  rationale: Sa salaysay tungkol kay Jose, ang שֶׁבֶר ay butil na ipinagbibili sa panahon ng taggutom. Nililinaw ng “bilang bayad” ang gamit ng pang-ukol ב sa transaksiyon.
- source_word: אֲשֶׁר הֵם שֹׁבְרִים
  choice: na binibili ng mga tao
  rationale: Ang שבר ay idyomatikong nangangahulugang bumili ng butil, at ipinakikita ng participle ang nagpapatuloy na pagbili. Ginawang tahasang “mga tao” ang implicit na sila upang maging natural at hindi malabo sa Filipino.
- source_word: וַיָּבֵא ... בֵּיתָה פַרְעֹה
  choice: dinala ... sa sambahayan ni Faraon
  rationale: Ipinapakita ng hulaping patungo na ang pilak ay dinala sa loob o sa institusyon ng bahay ni Faraon. Saklaw ng “sambahayan” ang tirahan, administrasyon, at kabang-yaman nang hindi pinipilit ang iisang kahulugan.
theological_decisions:
- issue: Saklaw ng בֵּיתָה פַרְעֹה
  choice: sambahayan ni Faraon
  alternative: palasyo ni Faraon / kabang-yaman ni Faraon
  rationale: Ang “bahay ni Faraon” ay maaaring tumukoy sa tirahan, maharlikang sambahayan, o kabang-yaman. Hindi ito nilimitahan sa palasyo o ingatang-yaman lamang; ipinaliwanag ang saklaw sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “butil” para sa grain at ang tradisyonal ngunit karaniwang “Faraon.” Ang “Pagkatapos” ay natural na nag-uugnay sa magkakasunod na pandiwang Hebreo nang baguhin ang pangyayari.
