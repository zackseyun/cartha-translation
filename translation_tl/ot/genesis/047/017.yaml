  terminology: Ang "mga alagang hayop," "tinapay," "mga kabayo," "mga kawan ng tupa at kambing," at "mga asno" ay angkop. Ang "tinustusan" ay isang ligtas na kontekstuwal na salin ng וַיְנַהֲלֵם, habang pinananatili ng talababa ang literal na posibilidad.
  issues:
