base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/017.yaml
  text: So they brought their livestock to Joseph[a], and Joseph gave them bread in exchange for the horses, the flocks, the herds, and the donkeys[b]; and he provided for them with bread in exchange for all their livestock during that year.
translation:
  language: tl
  text: Kaya dinala nila kay Jose ang kanilang mga alagang hayop, at binigyan sila ni Jose ng tinapay kapalit ng mga kabayo, mga kawan ng tupa at kambing, mga kawan ng baka, at mga asno; at tinustusan[a] niya sila ng tinapay kapalit ng lahat nilang alagang hayop noong taóng iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo ay maaari ring isaling mas literal na “pinatnubayan niya sila sa pamamagitan ng tinapay.” Dito, malamang na tumutukoy ito sa pagtustos o pagtaguyod sa kanila sa panahon ng taggutom.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵיהֶם / מִקְנֵהֶם
  choice: kanilang mga alagang hayop / lahat nilang alagang hayop
  rationale: Malawak ang saklaw ng מִקְנֶה at tumutukoy sa mga domestikadong hayop bilang ari-arian, hindi lamang sa baka.
- source_word: לֶחֶם
  choice: tinapay
  rationale: Maaaring mas malawak na mangahulugang pagkain, ngunit pinananatili ng “tinapay” ang kongkretong salita at ang pag-uulit nito sa Hebreo.
- source_word: בַּסּוּסִים
  choice: kapalit ng mga kabayo
  rationale: Sa kontekstong ito, minamarkahan ng ב ang ibinigay bilang kapalit sa transaksiyon.
- source_word: מִקְנֵה הַצֹּאן
  choice: mga kawan ng tupa at kambing
  rationale: Ang צֹאן ay kolektibong katawagan sa maliliit na alagang hayop at maaaring sumaklaw sa tupa at kambing; mas malinaw ito kaysa “mga kawan” lamang.
- source_word: מִקְנֵה הַבָּקָר
  choice: mga bakahan
  rationale: Tumutukoy ito sa mga kawan ng bakang alaga; natural at kolektibo ang “mga bakahan” sa Filipino.
- source_word: חֲמֹרִים
  choice: mga asno
  rationale: Karaniwan at marangal na modernong katumbas ng salitang Hebreo.
- source_word: וַיְנַהֲלֵם
  choice: tinustusan niya sila
  rationale: Bagaman pangunahing maaaring mangahulugang akayin o pamahalaan, ipinahihiwatig ng konteksto at ng בַּלֶּחֶם na itinaguyod o tinustusan sila ni Jose sa pamamagitan ng tinapay.
- source_word: בְּכָל מִקְנֵהֶם
  choice: kapalit ng lahat nilang alagang hayop
  rationale: Ipinapahayag nito ang kabuuang transaksiyong pagpapalit; nililinaw ng “kapalit ng” ang ugnayan at iniiwasang magmukhang para sa pagpapakain ng mga hayop ang tinapay.
- source_word: בַּשָּׁנָה הַהִוא
  choice: sa buong taóng iyon
  rationale: Natural na Filipino para sa panahong saklaw ng kaayusang ito, bagaman ang literal ay “sa taóng iyon.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “alagang hayop” bilang malawak na katawagan sa livestock, at tahasang pinangalanan ang tupa at kambing upang maipakita ang saklaw ng צֹאן. Inilipat sa ikalawang pangungusap ang pangwakas na sugnay para sa likas na daloy nang hindi binabago ang pagkakasunod ng mga pangyayari.
