revisions:
- from: Kaya dinala nila kay Jose ang kanilang mga alagang hayop, at binigyan sila ni Jose ng tinapay kapalit ng mga kabayo, mga kawan ng tupa at kambing, mga bakahan, at mga asno. Sa buong taóng iyon, tinustusan niya sila ng tinapay kapalit ng lahat nilang alagang hayop.[a]
  to: Kaya dinala nila kay Jose ang kanilang mga alagang hayop, at binigyan sila ni Jose ng tinapay kapalit ng mga kabayo, mga kawan ng tupa at kambing, mga kawan ng baka, at mga asno; at tinustusan[a] niya sila ng tinapay kapalit ng lahat nilang alagang hayop noong taóng iyon.
  rationale: Pinalitan ang panahong "sa buong taóng iyon" ng "noong taóng iyon" upang huwag magdagdag ng saklaw na wala sa Hebreo; ginawang "mga kawan ng baka" ang mas natural na kolektibong katawagan; at inilipat ang footnote marker upang nakaangkla ito mismo sa "tinustusan," ang kontekstuwal na salin ng וַיְנַהֲלֵם. Hindi binago ang kahulugan ng transaksiyong pagpapalit.
