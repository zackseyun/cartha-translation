base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/006.yaml
  text: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
translation:
  language: tl
  text: Nasa harap mo ang lupain ng Ehipto.[a] Patirahin mo ang iyong ama at mga kapatid sa pinakamainam na bahagi ng lupain; manirahan sila sa lupain ng Gosen. At kung alam mong may mga lalaking may kakayahan sa kanila,[b] italaga mo silang mga tagapangasiwa ng mga alagang hayop ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nasa harap mo” ay isang idyomang Hebreo na maaaring magpahiwatig na malaya kang pumili ng lugar sa Ehipto.
    reason: cultural_note
  - marker: b
    text: Maaari ring “mga may kakayahang lalaki” o “mga karapat-dapat na lalaki.” Sa literal, “mga lalaki ng lakas/kakayahan”; hindi ito kinakailangang tumukoy sa kagitingang militar dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ מִצְרַיִם לְפָנֶיךָ הִוא
  choice: Nasa harap mo ang lupain ng Ehipto
  rationale: Pinananatili ang larawang Hebreo na “nasa harap mo,” na sa konteksto ay nagpapahiwatig na malaya si Jose na pumili ng matitirhan ng kaniyang pamilya.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: sa pinakamainam na bahagi ng lupain
  rationale: Ipinahahayag ng מֵיטַב ang pinakamabuti o pinakapiling bahagi; nililinaw ng “bahagi” na isang pook sa loob ng lupain ang tinutukoy.
- source_word: הוֹשֵׁב
  choice: Patirahin mo
  rationale: Ang Hiphil imperative ay causative; likas sa Tagalog ang “patirahin” para sa pagpapapanirahan sa isang lugar.
- source_word: יֵשְׁבוּ
  choice: manirahan sila
  rationale: Tumutukoy ang pandiwa sa permanenteng o patuloy na paninirahan, hindi lamang pansamantalang pagtigil.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: sa lupain ng Gosen
  rationale: Pinananatili ang tahasang “lupain” ng tekstong Hebreo.
- source_word: וְאִם יָדַעְתָּ וְיֶשׁ בָּם
  choice: At kung may kilala kang ... sa kanila
  rationale: Natural na pinagsasama sa Tagalog ang kondisyon at kaalaman ni Jose habang nananatili ang diwa ng Hebreo.
- source_word: אַנְשֵׁי חַיִל
  choice: mahuhusay na lalaki
  rationale: Sa kontekstong pastoral at administratibo, tumutukoy ito sa mga lalaking may kakayahan at husay, hindi kinakailangang sa mga mandirigma.
- source_word: וְשַׂמְתָּם
  choice: italaga mo sila
  rationale: Sa konteksto ng pagbibigay ng tungkulin, malinaw na naihahatid ng “italaga” ang gamit ng שׂים.
- source_word: שָׂרֵי מִקְנֶה
  choice: mga tagapangasiwa ng mga alagang hayop
  rationale: Ipinahahayag ng שָׂרֵי ang pamumuno o pangangasiwa, at ng מִקְנֶה ang mga hayop na pag-aari o inaalagaan.
- source_word: עַל אֲשֶׁר לִי
  choice: ng mga alagang hayop ko
  rationale: 'Ginagawang tahasan ang natural na referent ng “kung ano ang akin” sa konteksto: ang mga alagang hayop ng Faraon.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong larawan sa unang pangungusap at ipinaliwanag sa talababa. Ginamit ang “mahuhusay” upang idiin ang kakayahang angkop sa pangangasiwa, nang hindi ipinapasok ang kahulugang militar.
