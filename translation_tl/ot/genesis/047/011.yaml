base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/011.yaml
  text: So Joseph settled his father and his brothers[a], and gave them a possession in the land of Egypt, in the best part of the land, in the land of Rameses, just as Pharaoh had commanded.
translation:
  language: tl
  text: Kaya pinatira ni Jose ang kanyang ama at mga kapatid, at binigyan niya sila ng isang lupain bilang pag-aari sa lupain ng Ehipto, sa pinakamainam na bahagi ng lupain[a], sa lupain ng Rameses, ayon sa iniutos ng Paraon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pinakapiling bahagi ng lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשֵׁב
  choice: pinatira
  rationale: 'Ang Hiphil ng יָשַׁב ay may diwang sanhi: si Jose ang nagtakda upang doon manirahan ang kanyang pamilya. Likas at tuwiran sa modernong Tagalog ang “pinatira.”'
- source_word: אָבִיו וְאֶת־אֶחָיו
  choice: ang kanyang ama at mga kapatid
  rationale: Tahasang binabanggit ng Hebreo ang ama at mga kapatid, kaya hindi ito pinalawak bilang “pamilya.”
- source_word: וַיִּתֵּן לָהֶם אֲחֻזָּה
  choice: binigyan niya sila ng lupaing pag-aari
  rationale: Ang אֲחֻזָּה ay isang lupa o ari-ariang maaaring hawakan bilang pag-aari. Pinananatili ng “lupaing pag-aari” ang kongkretong diwa nang hindi ipinapasok ang mas teolohikal na salitang “mana.”
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa Egipto
  rationale: Mas natural sa Tagalog ang “sa Egipto”; malinaw na sa lupain ang tinutukoy dahil agad itong sinusundan ng “bahagi ng lupain.”
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: sa pinakamainam na bahagi ng lupain
  rationale: Ipinahihiwatig ng מֵיטַב ang pinakamahusay o pinakapiling bahagi. Ang saling ito ay malinaw at natural sa Tagalog.
- source_word: בְּאֶרֶץ רַעְמְסֵס
  choice: sa lupain ng Rameses
  rationale: Pinananatili ang אֶרֶץ bilang “lupain” at ang pangalang pantangi bilang Rameses; maaaring tumukoy ito sa isang pook o distrito.
- source_word: כַּאֲשֶׁר צִוָּה פַרְעֹה
  choice: ayon sa iniutos ng Paraon
  rationale: Ipinakikita ng parirala na ang ginawa ni Jose ay alinsunod sa naunang utos ng Paraon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pinatira” upang mapanatili ang sanhiang anyo ng pandiwang Hebreo, at “lupaing pag-aari” upang ihayag ang kahulugan ng paghawak sa lupa nang hindi ito awtomatikong tinatawag na mana.
