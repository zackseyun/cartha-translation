  text: And Pharaoh said to Jacob[b][a], “How many are the days of the years of your life?”
translation:
  language: tl
  text: Sinabi ng Paraon kay Jacob, “Ilang taon ka na?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “Ilan ang mga araw ng mga taon ng iyong buhay?” Isa itong pormal na paraan ng pagtatanong sa edad ni Jacob.'
