lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Natural sa makabagong Tagalog ang payak na “Sinabi” nang hindi na kailangang tahasang isalin ang pang-ugnay.
- source_word: פַּרְעֹה
  choice: Paraon
  rationale: Ito ang nakaugaliang anyo sa Tagalog para sa titulong maharlika ng Ehipto.
- source_word: אֶל יַעֲקֹב
  choice: kay Jacob
  rationale: Ang אֶל ay tumutukoy sa kinausap; ang “kay Jacob” ang natural na anyo sa Tagalog.
- source_word: כַּמָּה יְמֵי שְׁנֵי חַיֶּיךָ
  choice: Ilang taon ka na?
  rationale: Ito ang natural at malinaw na katumbas sa makabagong Tagalog ng pormal na idyomang Hebreo na nagtatanong tungkol sa edad. Inilalahad sa talababa ang mas literal na anyo upang mapanatili ang katangiang pampanitikan ng pinagmulan.
