  to: “Kapag ako'y mahimlay na kasama ng aking mga ninuno[a], dalhin mo ako mula sa Ehipto at ilibing mo ako sa kanilang paglilibingan[b].” At sinabi niya, “Gagawin ko ayon sa sinabi mo.”
