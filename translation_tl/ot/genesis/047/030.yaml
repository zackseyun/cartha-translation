  yaml_path: translation/ot/genesis/047/030.yaml
  text: When I lie down with my fathers[a], carry me out of Egypt and bury me in their burial place.” And he said[c][b], “I will do as you have said.”
translation:
  language: tl
  text: “Kapag ako'y mahimlay na kasama ng aking mga ninuno[a], dalhin mo ako mula sa Ehipto at ilibing mo ako sa kanilang paglilibingan[b].” At sinabi niya, “Gagawin ko ayon sa sinabi mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “at mahihiga ako kasama ng aking mga ama.” Isa itong Hebreong idyoma na kaugnay ng kamatayan at paglilibing.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa kanilang pinaglibingan” o “sa kanilang puntod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַבְתִּי
  choice: Kapag mahimlay na ako
  rationale: Ang שׁכב ay literal na ‘humiga’ ngunit ginagamit dito bilang idyoma kaugnay ng kamatayan. Pinananatili ng ‘mahimlay’ ang larawan at ang marangal na tono, habang likas na ipinahihiwatig ng ‘kapag’ ang temporal na ugnayan sa kasunod na kahilingan.
- source_word: עִם אֲבֹתַי
  choice: kasama ng aking mga ninuno
  rationale: Sa kontekstong ito, ang אָבוֹת ay tumutukoy sa mga προγονο/kanunuan, hindi lamang sa literal na mga ama. Ang ‘mga ninuno’ ay malinaw at natural sa modernong Tagalog.
- source_word: וּנְשָׂאתַנִי
  choice: ilabas mo ako
  rationale: Ang נשׂא ay nangangahulugang buhatin o dalhin. Kasama ng מִמִּצְרַיִם, likas sa Tagalog ang ‘ilabas mo ako sa Ehipto,’ na nagpapahayag ng pagdadala sa katawan palabas ng lupain.
- source_word: מִמִּצְרַיִם
  choice: sa Ehipto
  rationale: Kasunod ng pandiwang ‘ilabas,’ sapat at natural ang ‘sa Ehipto’ upang katawanin ang Hebreong ‘mula/labas ng Ehipto.’
- source_word: וּקְבַרְתַּנִי
  choice: ilibing
  rationale: Tuwirang katumbas ng קבר ang ‘ilibing.’
- source_word: בִּקְבֻרָתָם
  choice: sa kanilang libingan
  rationale: Ang קְבֻרָה ay maaaring tumukoy sa libingan o pook na pinaglibingan. Ang ‘kanilang libingan’ ay maikli at hindi nagpapasya kung ito ay hukay, puntod, o yungib na libingan.
- source_word: וַיֹּאמַר
  choice: Sinabi niya
  rationale: Pinananatili nito ang payak na daloy ng salaysay at ang panghalip ng Hebreo nang hindi tahasang idinaragdag ang pangalan ng nagsasalita.
- source_word: אָנֹכִי אֶעֱשֶׂה
  choice: Gagawin ko
  rationale: Ipinahahayag nito ang tiyak na pangako. Bagaman may bahagyang diin ang hiwalay na panghalip na אָנֹכִי, ang ‘Gagawin ko’ ay natural at sapat sa tugon.
- source_word: כִדְבָרֶךָ
  choice: ang sinabi mo
  rationale: Ang literal na ‘ayon sa iyong salita’ ay natural na naipapahayag sa Tagalog bilang ‘ang sinabi mo,’ na tumutukoy sa pagsunod sa kahilingan.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Tagalog. Pinanatili ng ‘mahimlay’ ang larawan ng Hebreong idyoma nang hindi ito tahasang pinapalitan ng ‘mamatay,’ at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
