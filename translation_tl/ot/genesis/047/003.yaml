translation:
  language: tl
  text: Sinabi ng Paraon sa mga kapatid ni Jose, “Ano ang hanapbuhay ninyo?” Sumagot sila sa Paraon, “Ang inyong mga lingkod ay mga pastol ng kawan[b]—kami at ang aming mga ama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang “kawan” dito ay tumutukoy lalo na sa maliliit na alagang hayop, gaya ng mga tupa at kambing.
    reason: lexical_clarification
lexical_decisions:
- source_word: אֶל אֶחָיו
  choice: sa mga kapatid niya
  rationale: Pinananatili ang panghalip ng Hebreo. Sa konteksto, tumutukoy ito sa mga kapatid ni Jose, gaya ng nililinaw sa talababa.
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Ano ang hanapbuhay ninyo?
  rationale: Ang מַעֲשֶׂה ay maaaring tumukoy sa gawain o trabaho; sa pag-uusap sa korte, itinatanong ng Paraon ang kanilang ikinabubuhay. Ang “hanapbuhay” ay likas at malinaw sa makabagong Filipino.
- source_word: רֹעֵה צֹאן
  choice: mga tagapag-alaga ng kawan
  rationale: Ipinapahayag ng pariralang Hebreo ang gawaing pag-aalaga ng maliliit na hayop sa kawan, lalo na ng mga tupa at kambing. Sinasalamin ng salin ang parehong pag-aalaga at kawan nang hindi nililimitahan ito sa tupa lamang.
- source_word: עֲבָדֶיךָ
  choice: ang inyong mga lingkod
  rationale: Bagaman maaaring mangahulugan ang עבד na alipin o lingkod, dito ay magalang na pagtukoy nila sa kanilang sarili sa harap ng Paraon; hindi pangunahing diwa ang pagkaalipin.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבוֹתֵינוּ
  choice: kami at ang aming mga ninuno
  rationale: Pinananatili ang diin sa pagpapatuloy ng hanapbuhay sa mga salinlahi. Ang “mga ninuno” ay mas natural sa Filipino kaysa literal na “mga ama” sa ganitong pahayag.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hanapbuhay” para sa bokasyonal na diwa at “mga lingkod” bilang magalang na pananalita sa hari. Iniwasan ang labis na pormal o makalumang mga salita.
