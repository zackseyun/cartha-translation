  to: Sinabi ng Paraon sa mga kapatid ni Jose, “Ano ang hanapbuhay ninyo?” Sumagot sila sa Paraon, “Ang inyong mga lingkod ay mga pastol ng kawan[b]—kami at ang aming mga ama.”
  rationale: Inalis ang hindi kailangang talababa tungkol sa reperent at pinangalanan si Jose sa pangunahing teksto upang maiwasan ang maling pagbasa sa Filipino. Pinalitan ang “mga ninuno” ng “mga ama” upang mapanatili ang tiyak na saklaw ng Hebreo. Ang talababa sa “kawan” ay pinanatili upang linawin ang צֹאן nang hindi nililimitahan ang pangunahing teksto sa mga tupa lamang.
