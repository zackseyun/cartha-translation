  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְרְב֣וּ יְמֵֽי יִשְׂרָאֵ֘ל לָ/מוּת֒ וַ/יִּקְרָ֣א לִ/בְנ֣/וֹ לְ/יוֹסֵ֗ף וַ/יֹּ֤אמֶר ל/וֹ֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֣חַת יְרֵכִ֑/י וְ/עָשִׂ֤יתָ עִמָּדִ/י֙ חֶ֣סֶד וֶ/אֱמֶ֔ת אַל נָ֥א תִקְבְּרֵ֖/נִי בְּ/מִצְרָֽיִם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/029.yaml
  text: When the days of Israel drew near for him to die[a], he called his son Yosef and said to him, “If now I have found favor in your eyes, please put your hand under my thigh, and deal with me in steadfast love and faithfulness[b]. Please do not bury me in Egypt.”
translation:
  language: tl
  text: Nang malapit nang mamatay si Israel, ipinatawag niya ang anak niyang si Jose at sinabi sa kanya, “Kung ako’y kinalulugdan mo, pakilagay ang kamay mo sa ilalim ng aking hita[a], at pakitunguhan mo ako nang may kabutihang-loob at katapatan[b]. Huwag mo sana akong ilibing sa Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang paglalagay ng kamay sa ilalim ng hita ay isang taimtim na kilos ng panunumpa sa mga salaysay tungkol sa mga patriyarka; ihambing ang Genesis 24:2.
    reason: cultural_note
  - marker: b
    text: Ang Hebreong pares na חֶסֶד וֶאֱמֶת ay maaari ring isaling “matibay na pag-ibig at katapatan.” Ipinahihiwatig nito ang mabuti, tapat, at maaasahang pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי יִשְׂרָאֵל לָמוּת
  choice: Nang malapit nang mamatay si Israel
  rationale: Natural na isinasalin sa modernong Tagalog ang Hebreong idyoma na literal na nagsasabing lumapit ang mga araw ni Israel upang mamatay; napapanatili ang kahulugan nang hindi nagiging alanganin ang pangungusap.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinananatili ang pangalang ginamit mismo ng tekstong Hebreo, sa halip na palitan ito ng Jacob.
- source_word: לִבְנוֹ לְיוֹסֵף
  choice: ang anak niyang si Jose
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Joseph/Yosef, at malinaw na pinanatili ang ugnayang ama-anak.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Kung kinalulugdan mo ako
  rationale: Ito ang natural na Tagalog para sa Hebreong pormula ng magalang na pakiusap, habang iniiwasan ang masyadong literal ngunit di-likas na 'kung nakatagpo ako ng biyaya sa iyong mga mata.'
- source_word: שִׂים נָא יָדְךָ תַּחַת יְרֵכִי
  choice: pakilagay ang kamay mo sa ilalim ng aking hita
  rationale: Pinananatili ang kongkretong kilos ng panunumpa sa salaysay; ipinaliliwanag sa talababa ang kabuluhang pangkultura nito.
- source_word: וְעָשִׂיתָ עִמָּדִי חֶסֶד וֶאֱמֶת
  choice: pakitunguhan mo ako nang may tapat na pag-ibig at katapatan
  rationale: Ang 'pakitunguhan' ay natural para sa idyomang 'gumawa sa akin,' at ang pares na 'tapat na pag-ibig at katapatan' ay nagpapahayag ng matibay, maaasahan, at mapagkalingang katapatan nang hindi labis na nililinaw bilang teknikal na terminong tipan.
- source_word: אַל נָא תִקְבְּרֵנִי בְּמִצְרָיִם
  choice: Huwag mo sana akong ilibing sa Ehipto
  rationale: Ang 'sana' ay naghahatid ng magalang at taimtim na pakiusap ng נָא; 'Ehipto' ang karaniwang pangalang Tagalog.
theological_decisions:
- issue: Kahulugan ng חֶסֶד וֶאֱמֶת sa konteksto ng taimtim na pangako
  choice: tapat na pag-ibig at katapatan
  alternative: matibay na pag-ibig at katapatan; kabutihang-loob at katapatan; katapatan sa tipan at katotohanan
  rationale: Pinananatili ng napiling parirala ang parehong mapagmahal at maaasahang dimensiyon ng Hebreong pares. Hindi nito ipinipilit na ang 'tipan' ay tahasang nasa mga salita, ngunit hindi rin nito binabawasan ang obligasyonal na bigat ng pakiusap.
- issue: Kilos na 'kamay sa ilalim ng hita'
  choice: Literal na panatilihin sa pangunahing teksto at ipaliwanag sa talababa
  alternative: Isalin lamang bilang 'manumpa ka sa akin'
  rationale: Ang literal na kilos ay mahalagang bahagi ng pagiging kongkreto at pangkultura ng salaysay. Ang talababa ang nagbibigay-linaw nang hindi pinapatag ang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'Jose' at 'Ehipto' bilang karaniwang anyong Tagalog ng mga pangalan. Iniwasan ang sobrang literal na Hebreong idyoma kung magiging di-likas sa Tagalog, ngunit pinanatili ang natatanging kilos ng panunumpa at nilagyan ng talababa.
