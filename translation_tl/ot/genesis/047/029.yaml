  naturalness: Marangal at modernong Tagalog ang kabuuan. Ang “sinabi sa kanya” ay mas likas kaysa “sinabi rito” sa ganitong salaysay. Ang “kabutihang-loob at katapatan” ay mas idiomatiko at hindi paulit-ulit ang tunog kumpara sa “tapat na pag-ibig at katapatan.”
  terminology: Ang Israel, Jose, at Ehipto ay angkop na karaniwang anyong Tagalog. Para sa חֶסֶד וֶאֱמֶת, ang “kabutihang-loob at katapatan” ay pinananatili ang kapwa mabuting-loob/loyal na pagkilos at pagiging maaasahan, nang hindi nagdaragdag ng teknikal na kahulugang wala sa mismong parirala.
