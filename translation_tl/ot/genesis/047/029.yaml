    rationale: Ang חֶסֶד ay maaaring tumukoy sa kabutihang-loob o matapat na pagkalingang ipinakikita sa kilos; ang “kabutihang-loob at katapatan” ay natural na pares sa Tagalog at sapat na malawak.
