translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Faraon,” ang karaniwang anyong biblikal sa Tagalog. Ang pandiwang “binili” ay pinanatili upang huwag pahinain ang matinding legal at panlipunang pahayag ng Hebreo; walang talababa dahil hindi kailangan ng alternatibo upang maunawaan ang talata.
