  text: Then Joseph said to the people[a], “Look, today I have bought you and your land for Pharaoh. Here is seed for you, and you shall sow the land.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Jose sa mga tao[a], “Tingnan ninyo, sa araw na ito ay binili ko kayo at ang inyong lupain para sa Faraon. Narito ang binhi para sa inyo; ihasik ninyo sa lupain.”
