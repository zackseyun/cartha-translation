  text: וַ/תִּתֹּם֮ הַ/שָּׁנָ֣ה הַ/הִוא֒ וַ/יָּבֹ֨אוּ אֵלָ֜י/ו בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹֽא נְכַחֵ֣ד מֵֽ/אֲדֹנִ֔/י כִּ֚י אִם תַּ֣ם הַ/כֶּ֔סֶף וּ/מִקְנֵ֥ה הַ/בְּהֵמָ֖ה אֶל אֲדֹנִ֑/י לֹ֤א נִשְׁאַר֙ לִ/פְנֵ֣י אֲדֹנִ֔/י בִּלְתִּ֥י אִם גְּוִיָּתֵ֖/נוּ וְ/אַדְמָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/018.yaml
  text: 'When that year ended[a], they came to him in the second year and said to him, “We will not hide it from my lord: the money is gone, and the livestock of the herds belongs to my lord[b]. Nothing is left before my lord except our bodies and our land.”'
translation:
  language: tl
  text: 'Nang matapos ang taong iyon, pumunta sila sa kanya sa ikalawang taon at sinabi, “Hindi namin ililihim sa panginoon ko: ubos na ang salapi[a], at napunta na sa panginoon ko ang mga alagang hayop. Wala nang natitira sa harap ng panginoon ko maliban sa aming mga katawan[b] at aming lupain.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ubos na ang pilak.” Madalas gamitin sa Hebreo ang “pilak” bilang tawag sa salapi.
    reason: lexical_alternative
  - marker: b
    text: O “aming mga sarili at aming lupain.” Literal sa Hebreo, “aming mga katawan at aming lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֹּם הַשָּׁנָה הַהִוא
  choice: Nang matapos ang taong iyon
  rationale: Ipinahahayag ng תמם ang pagtatapos o pagkaubos; ang “matapos” ay likas na Filipino para sa isang yugto ng panahon.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: sa ikalawang taon
  rationale: Pinananatili ang pormal na bilang ng Hebreo sa halip na ipakahulugang “nang sumunod na taon.”
- source_word: לֹא נְכַחֵד מֵאֲדֹנִי
  choice: Hindi namin ililihim sa panginoon ko
  rationale: Ang כחד sa piel ay “itago” o “ilihim.” Pinananatili ng “panginoon ko” ang isahang hulaping paari sa magalang na tuwirang pakikipag-usap.
- source_word: תַּם הַכֶּסֶף
  choice: ubos na ang salapi
  rationale: Sa konteksto, ang תם ay nangangahulugang naubos, at ang כֶּסֶף ay salaping ginagamit sa pagbabayad, bagaman literal din itong “pilak.”
- source_word: וּמִקְנֵה הַבְּהֵמָה אֶל אֲדֹנִי
  choice: at napunta na sa panginoon ko ang mga alagang hayop
  rationale: Ang pariralang אֶל אֲדֹנִי ay nagsasaad na nailipat na kay Jose ang pag-aari ng kanilang mga hayop. Ang “napunta na” ay malinaw at likas nang hindi dinaragdagan ang diwa.
- source_word: לֹא נִשְׁאַר לִפְנֵי אֲדֹנִי
  choice: Wala nang natitira sa harap ng panginoon ko
  rationale: Pinananatili ang larawang Hebreo ng לִפְנֵי, “sa harap ng,” na sa konteksto ay tumutukoy sa anumang maihaharap o maibibigay pa sa panginoon.
- source_word: בִּלְתִּי אִם
  choice: maliban sa
  rationale: 'Gumaganap ang kombinasyon bilang pariralang nagtatangi: “maliban sa.”'
- source_word: גְּוִיָּתֵנוּ
  choice: aming mga katawan
  rationale: Ang גְּוִיָּה ay maaaring tumukoy sa katawan o pisikal na pagkatao. Ang “mga katawan” ang pinakatuwirang katumbas sa kontekstong buhay pa ang mga nagsasalita.
- source_word: וְאַדְמָתֵנוּ
  choice: at aming lupain
  rationale: Ang אֲדָמָה rito ay lupang pag-aari at ikinabubuhay nila; ang “lupain” ay angkop sa kontekstong pangkabuhayan.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang “sa ikalawang taon” at ang paulit-ulit na “panginoon ko” upang maipakita ang anyo at magalang na pananalita ng Hebreo, habang ginawang likas ang paglalarawan sa paglipat ng mga alagang hayop.
