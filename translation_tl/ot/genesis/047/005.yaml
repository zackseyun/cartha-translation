translation:
  language: tl
  text: Pagkatapos, sinabi ng Faraon kay Jose[a], “Dumating sa iyo ang iyong ama at mga kapatid mong lalaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na anyo: “At sinabi ng Faraon kay Jose, na ganito: ‘Dumating sa iyo ang iyong ama at mga kapatid mong lalaki.’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Filipino ang “Pagkatapos, sinabi” at pinananatili nito ang sunod-sunod na kilos.
- source_word: פַּרְעֹה
  choice: Faraon
  rationale: Ito ang karaniwang anyo sa Filipino para sa titulo ng hari ng Ehipto.
- source_word: אֶל יוֹסֵף
  choice: kay Jose
  rationale: Tinutukoy ng אֶל ang kinakausap; ang “kay Jose” ang natural na katumbas sa Filipino.
- source_word: לֵאמֹר
  choice: hindi hiwalay na isinalin
  rationale: Karaniwang pormula ito sa Hebreo para ipakilala ang tuwirang sinabi. Kalabisan sa natural na Filipino ang “na sinasabi” matapos ang “sinabi.”
- source_word: אָבִיךָ
  choice: ang iyong ama
  rationale: Tuwirang ikalawang panauhang pag-aari na nakatuon kay Jose.
- source_word: וְאַחֶיךָ
  choice: at mga kapatid
  rationale: Ang literal na kahulugan ay mga kapatid na lalaki; sa kontekstong ito, ang mga anak na lalaki ni Jacob ang tinutukoy. Natural sa Filipino ang “mga kapatid” nang hindi ginagawang mas malawak na “pamilya.”
- source_word: בָּאוּ
  choice: Dumating
  rationale: Naglalahad ang perfect verb ng natapos na pagdating na mahalaga sa kasalukuyang pag-uusap. Ang simpleng aspektong Filipino na “dumating” ay natural at hindi ipinipilit ang pagkakaibang Ingles na “came/have come.”
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Ipinapahayag nito ang paglapit o pagdating patungo kay Jose; hindi idinaragdag ang “dito,” na wala sa Hebreo.
