  yaml_path: translation/ot/genesis/047/012.yaml
  text: And Joseph provided his father[a], his brothers, and all his father's household with food[b], according to the number of their little ones.
translation:
  language: tl
  text: At tinustusan ni Jose ng pagkain[a] ang kanyang ama, ang kanyang mga kapatid, at ang buong sambahayan ng kanyang ama, ayon sa dami ng mga bata.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinapay.” Madalas na literal na nangangahulugang “tinapay” ang salitang Hebreo, ngunit malamang na tumutukoy ito rito sa pagkain sa mas malawak na diwa.
    reason: lexical_alternative
  - marker: b
    text: Literal, “ayon sa bibig ng mga bata,” isang idyomang tumutukoy sa paglalaan ayon sa bilang o pangangailangan ng mga bata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלְכֵּל
  choice: tinustusan
  rationale: Ang pandiwang כלכל sa piel ay tumutukoy sa patuloy na paglalaan ng materyal na pangangailangan. Ang “tinustusan” ay natural sa makabagong Tagalog at angkop sa konteksto ng taggutom.
- source_word: לֶחֶם
  choice: pagkain
  rationale: Bagaman karaniwang literal na “tinapay,” mas malawak ang gamit nito rito bilang pagkain o panustos sa panahon ng taggutom.
- source_word: כָּל בֵּית אָבִיו
  choice: ang buong sambahayan ng kanyang ama
  rationale: Ang “bahay” ay tumutukoy rito sa buong yunit ng pamilya at mga kasama nito, hindi lamang sa gusali. Malinaw itong naipahahayag ng “sambahayan.”
- source_word: לְפִי
  choice: ayon sa dami ng
  rationale: Literal itong “ayon sa bibig ng,” ngunit isang idyoma ito ng sukat o paglalaan. Sa kontekstong ito, ipinahihiwatig nito ang paglalaan batay sa bilang ng mga bata.
- source_word: הַטָּף
  choice: mga bata
  rationale: Tumutukoy ang טַף sa maliliit na bata o mga batang umaasa sa sambahayan. Ang “mga bata” ay natural at malinaw sa modernong Tagalog.
- source_word: אָבִיו ... אֶחָיו
  choice: kanyang ama ... kanyang mga kapatid
  rationale: Tuwirang isinasalin ang mga katawagang pampamilya. Sa salaysay, ang “mga kapatid” ay tumutukoy sa mga lalaking kapatid ni Jose.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pag-uulit ng “kanyang ama” upang malinaw na ang tinutukoy ay ang sambahayan ng ama ni Jose, at ipinaliwanag sa talababa ang literal na Hebreong idyoma.
