translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at natural. Ginamit ang “Faraon” bilang kinikilalang titulong biblikal. Isinama ang pangalan ni Jose, bagaman panghalip ang nasa Hebreo, upang maging malinaw sa Tagalog ayon sa agarang konteksto.
