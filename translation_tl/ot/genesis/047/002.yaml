    issue: Hindi likas ang unang alternatibong salin sa talababa.
    rationale: Ang “mula sa nasa dulo ng kanyang mga kapatid” ay malabo sa Tagalog at parang tumutukoy sa pisikal na puwesto ng ilang kapatid. Mas mabuting panatilihin ang literal na “mula sa dulo ng kanyang mga kapatid,” habang ipinapaliwanag na hindi tiyak ang idyomatikong puwersa nito.
  - severity: low
    issue: Masyadong tiyak ang “pinakamagagaling” bilang interpretibong alternatibo.
    rationale: May tradisyong nagpapakahulugan sa parirala bilang pagpili ng ilan sa pinakamainam o pinakapili, ngunit hindi ito hinihingi ng Hebreo. Ang “pinakapili” ay mas malapit sa interpretibong saklaw nang hindi labis na inuugnay sa husay.
