translation:
  language: tl
  text: Pumili si Jose ng lima sa kanyang mga kapatid at iniharap sila sa Faraon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “mula sa dulo ng kanyang mga kapatid” o “mula sa mga pinakapili sa kanyang mga kapatid.” Literal na may diwang “mula sa dulo/gilid” ang pananalitang Hebreo, ngunit malamang na ginagamit ito rito sa partitibong diwa: pumili si Jose ng lima mula sa kanyang mga kapatid.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְצֵה
  choice: Pumili ... sa
  rationale: 'Ang pariralang literal na tumutukoy sa “dulo” o “gilid” ay malamang na ginagamit dito sa diwang partitibo: kumuha o pumili si Jose ng ilan mula sa kabuuang pangkat. Likas sa modernong Tagalog ang “pumili ... sa” at malinaw nitong naihahatid ang kilos na ipinahihiwatig ng kasunod na לָקַח.'
- source_word: אֶחָיו
  choice: kanyang mga kapatid
  rationale: Tuwirang tumutukoy ito sa sariling mga kapatid na lalaki ni Jose sa konteksto, kaya hindi kailangan ang mas malawak na “mga kamag-anak.”
- source_word: לָקַח
  choice: Pumili
  rationale: Karaniwang nangangahulugang “kumuha” ang pandiwa, ngunit sa konstruksiyong partitibo at sa kontekstong lima ang kinuha mula sa mga kapatid, mas natural at malinaw sa Tagalog ang “pumili.”
- source_word: חֲמִשָּׁה אֲנָשִׁים
  choice: lima
  rationale: Dahil hayag nang ang tinutukoy ay mga kapatid ni Jose, sapat at natural ang “lima”; hindi kailangang ulitin ang “lalaki.”
- source_word: וַיַּצִּגֵם
  choice: iniharap sila
  rationale: Ang Hiphil ng יָצַג ay nangangahulugang ilagay o iharap ang isang tao sa harap ng iba. Ang “iniharap” ay angkop sa tagpong maharlika at natural sa Tagalog.
- source_word: לִפְנֵי פַרְעֹה
  choice: sa Faraon
  rationale: Kasunod ng pandiwang “iniharap,” likas sa Tagalog ang “iniharap sila sa Faraon,” na nagpapahayag ng pagdadala sa kanyang presensiya.
