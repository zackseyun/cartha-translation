base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/024.yaml
  text: And at the harvest[a], you shall give a fifth to Pharaoh, and four-fifths shall be yours for seed for the field, for your food, for those in your households, and for food for your little ones.
translation:
  language: tl
  text: Kapag dumating ang ani, ibibigay ninyo kay Paraon ang ikalimang bahagi. Ang natitirang apat na bahagi[a] ay mapapasainyo bilang binhi para sa bukid, pagkain para sa inyo at sa mga nasa inyong sambahayan, at para ipakain sa inyong maliliit na anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “apat na kamay,” isang idyoma para sa natitirang apat na bahagi—samakatuwid, apat na ikalima ng ani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּתְּבוּאֹת
  choice: Kapag dumating ang ani
  rationale: Ang תְּבוּאָה ay ani o bunga ng pananim; sa kontekstong pang-administratibo, likas na ipinahahayag ng pariralang ito ang panahon ng pag-aani.
- source_word: וּנְתַתֶּם חֲמִישִׁית לְפַרְעֹה
  choice: ibibigay ninyo kay Paraon ang ikalimang bahagi
  rationale: Tuwirang ipinahahayag ng חֲמִישִׁית ang isang bahagi sa lima; malinaw at marangal sa modernong Tagalog ang “ikalimang bahagi.”
- source_word: וְאַרְבַּע הַיָּדֹת
  choice: Ang natitirang apat na bahagi
  rationale: Ang literal na “apat na kamay” ay idyomang tumutukoy sa apat na bahagi mula sa limang bahagi. Idinagdag ang “natitirang” upang luminaw ang ugnayan nito sa naunang ikalimang bahagi nang hindi ginagawang di-likas ang Tagalog.
- source_word: יִהְיֶה לָכֶם
  choice: ay mapapasainyo
  rationale: Ipinahahayag nito ang paglalaan o pag-aari ng natitirang ani; natural at maikli ang “mapapasainyo.”
- source_word: לְזֶרַע הַשָּׂדֶה
  choice: bilang binhi para sa bukid
  rationale: 'Ang lamed ay nagpapahayag ng layunin: ang bahagi ng ani ay itatabi upang maihasik sa bukid.'
- source_word: וּלְאָכְלְכֶם
  choice: pagkain ninyo
  rationale: Ang anyo mula sa אכל ay tumutukoy sa kakainin nila; ang “pagkain ninyo” ay maikli at idiomatiko.
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  choice: at ng mga nasa sambahayan ninyo
  rationale: Ang parirala ay malamang na tumutukoy sa mga taong nasa kanilang mga bahay, hindi sa mga bagay roon. Pinananatili ng “mga nasa sambahayan” ang malawak na saklaw nito.
- source_word: וְלֶאֱכֹל לְטַפְּכֶם
  choice: at pagkain ng inyong maliliit na anak
  rationale: Ang טַף ay karaniwang tumutukoy sa maliliit na anak o mga musmos na umaasa sa sambahayan. Ang salin ay nagpapanatili sa pamilyal na diwa ng salita.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang “Paraon,” “sambahayan,” at “binhi” bilang pormal ngunit pamilyar na bokabularyo; iniwasan ang labis na literal na “apat na kamay” sa pangunahing teksto at ipinaliwanag ito sa talababa.
