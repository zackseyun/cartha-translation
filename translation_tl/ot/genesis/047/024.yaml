  to: Kapag dumating ang ani, ibibigay ninyo kay Paraon ang ikalimang bahagi. Ang natitirang apat na bahagi[a] ay mapapasainyo bilang binhi para sa bukid, pagkain para sa inyo at sa mga nasa inyong sambahayan, at para ipakain sa inyong maliliit na anak.
