base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/004.yaml
  text: They said to Pharaoh[a], “We have come to sojourn in the land, because there is no pasture for the flocks that belong to your servants, for the famine is severe in the land of Canaan. And now, please let your servants dwell in the land of Goshen.”
translation:
  language: tl
  text: Sinabi nila sa Paraon, “Naparito kami upang pansamantalang manirahan[a] sa lupain, sapagkat wala nang pastulan para sa mga kawan ng iyong mga lingkod, sapagkat matindi ang taggutom sa lupain ng Canaan. At ngayon, ipahintulot mo po na manirahan ang iyong mga lingkod sa lupain ng Goshen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, manirahan bilang mga dayuhan.
    reason: 'Pinananatili ang alternatibong diwa ng לָגוּר: ang paninirahan bilang dayuhan o pansamantalang residente.'
lexical_decisions:
- source_word: לָגוּר
  choice: pansamantalang manirahan
  rationale: Ipinahahayag ng גור ang paninirahan bilang dayuhan o pansamantalang residente, hindi ang permanenteng paninirahan. Likas at malinaw sa makabagong Tagalog ang “pansamantalang manirahan.”
- source_word: בָּאָרֶץ
  choice: sa lupaing ito
  rationale: Tumutukoy ang אֶרֶץ sa teritoryo ng Ehipto na kinaroroonan nila. Ginagawang natural ng “ito” ang kontekstuwal na pagtukoy nang hindi binabago ang heograpikong diwa.
- source_word: מִרְעֶה
  choice: pastulan
  rationale: Ang מִרְעֶה ay lugar na pinanginginainan ng mga hayop; “pastulan” ang maikli at karaniwang katumbas sa Tagalog.
- source_word: לַצֹּאן
  choice: para sa mga kawan
  rationale: Ang צֹאן ay kolektibong katawagan sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Hindi labis na tinutukoy ng “mga kawan” ang uri ng hayop.
- source_word: אֲשֶׁר לַעֲבָדֶיךָ
  choice: ng iyong mga lingkod
  rationale: Ipinakikita ng parirala ang pagmamay-ari sa mga kawan at pinananatili ang magalang na pagtukoy nila sa sarili sa harap ng Paraon.
- source_word: כָבֵד הָרָעָב
  choice: matindi ang taggutom
  rationale: Bagaman literal na “mabigat” ang כָבֵד, idiomatiko nitong inilalarawan dito ang tindi ng taggutom.
- source_word: יֵשְׁבוּ נָא
  choice: ipahintulot mo po na manirahan
  rationale: Ang jussive na may נָא ay isang magalang na pakiusap. Natural na ipinahahayag ito sa Tagalog sa pamamagitan ng “ipahintulot mo po.”
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Sa kontekstong panghukuman, isa itong mapagpakumbabang pagtukoy sa sarili sa harap ng hari; “mga lingkod” ang angkop kaysa “mga alipin.”
- source_word: אֶרֶץ גֹּשֶׁן
  choice: lupain ng Goshen
  rationale: Pinananatili nito ang tahasang heograpikong katawagan at ang ugnayang construct ng Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “po” upang likas na maipahayag ang magalang na pakiusap sa Paraon, habang pinanatili ang paulit-ulit na “iyong mga lingkod” bilang mahalagang wikang panghukuman.
