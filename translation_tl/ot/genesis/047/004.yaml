  to: Sinabi nila sa Paraon, “Naparito kami upang pansamantalang manirahan[a] sa lupain, sapagkat wala nang pastulan para sa mga kawan ng iyong mga lingkod, sapagkat matindi ang taggutom sa lupain ng Canaan. At ngayon, ipahintulot mo po na manirahan ang iyong mga lingkod sa lupain ng Goshen.”
