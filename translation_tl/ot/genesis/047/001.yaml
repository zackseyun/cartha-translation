base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/001.yaml
  text: Then Joseph went in and told Pharaoh[a], “My father and my brothers, with their flocks and their herds and all that they have, have come from the land of Canaan; and behold[c][b], they are in the land of Goshen.”
translation:
  language: tl
  text: Pagkatapos, pumasok si Jose sa harapan ng Faraon at sinabi, “Dumating na mula sa lupain ng Canaan ang aking ama at mga kapatid, kasama ang kanilang mga kawan, mga baka, at lahat ng kanilang ari-arian. At narito[a] sila sa lupain ng Gosen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “at sila’y nasa lupain ng Gosen.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumasok ... sa harapan ng Faraon
  rationale: Sa konteksto ng korte, ang בוא ay tumutukoy sa pagpasok ni Jose upang humarap sa Faraon; nilinaw ito sa natural na Tagalog nang hindi nagdaragdag ng bagong pangyayari.
- source_word: וַיַּגֵּד לְפַרְעֹה וַיֹּאמֶר
  choice: at sinabi
  rationale: Ang dalawang pandiwang Hebreo ay karaniwang pormula sa pagpapakilala ng tuwirang pananalita. Ang iisang “sinabi” ay natural sa Tagalog at naihahatid ang buong tungkulin ng pormula.
- source_word: אָבִי וְאַחַי
  choice: ang aking ama at mga kapatid
  rationale: Tuwirang ipinapahayag ang kaugnayang pampamilya; ang konteksto ay tumutukoy sa mga lalaking kapatid ni Jose, ngunit sapat at natural dito ang “mga kapatid.”
- source_word: וְצֹאנָם וּבְקָרָם
  choice: kasama ang kanilang mga kawan, mga bakahan
  rationale: Ang צאן ay maliliit na alagang hayop na sama-samang inaalagaan, samantalang ang בקר ay malalaking hayop, lalo na mga baka. Pinananatili ng “mga kawan, mga bakahan” ang pagkakaibang ito nang hindi labis na tinutukoy ang uri ng hayop.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: at lahat ng kanilang ari-arian
  rationale: Likas na buod sa Tagalog ng lahat ng pag-aari nila at katumbas ng malawak na saklaw ng parirala.
- source_word: בָּאוּ מֵאֶרֶץ כְּנָעַן
  choice: Dumating na mula sa lupain ng Canaan
  rationale: Ipinahihiwatig ng “dumating na” ang natapos na pagdating na may kasalukuyang resulta, habang nananatiling posible sa Hebreo ang payak na nakaraang anyo.
- source_word: וְהִנָּם
  choice: Narito
  rationale: Pinananatili ang pantawag-pansing at deiktikong puwersa ng הִנֵּה sa isang maikli at dignified na anyong Tagalog.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: nasa lupain sila ng Gosen
  rationale: Pinananatili ang tahasang “lupain” ng tekstong Hebreo at ginagamit ang nakaugaliang anyong Tagalog na “Gosen.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang salitang “masdan,” na higit na mataas ang antas kaysa kailangan, ngunit pinanatili sa “Narito” ang pantawag-pansing diin ng Hebreo. Inilipat sa unahan ang panaguri na “Dumating na” upang maiwasan ang mabigat na simuno at maging likas ang daloy sa Tagalog.
