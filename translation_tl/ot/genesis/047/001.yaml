    issue: Ang “mga bakahan” ay hindi angkop na salin ng בקר.
    rationale: Sa karaniwang Filipino, ang bakahan ay mas malamang na tumukoy sa kulungan, pastulan, o lugar ng pag-aalaga ng baka. Ang בקר ay tumutukoy sa mga baka o kawan ng baka.
  - severity: low
    issue: Bahagyang putol ang deiktikong parirala na “Narito, nasa lupain sila ng Gosen.”
    rationale: Ang “narito sila” ay mas likas na Tagalog at mas malapit sa konstruksiyong “behold, they are,” habang pinananatili ang pantawag-pansing diin.
