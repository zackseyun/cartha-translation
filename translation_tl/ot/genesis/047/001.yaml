  to: Pagkatapos, pumasok si Jose sa harapan ng Faraon at sinabi, “Dumating na mula sa lupain ng Canaan ang aking ama at mga kapatid, kasama ang kanilang mga kawan, mga baka, at lahat ng kanilang ari-arian. At narito[a] sila sa lupain ng Gosen.”
