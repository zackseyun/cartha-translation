  yaml_path: translation/ot/genesis/047/007.yaml
  text: Then Joseph brought in Jacob his father and presented him before Pharaoh[b][a], and Jacob blessed Pharaoh.
translation:
  language: tl
  text: Pagkatapos, dinala ni Jose ang kanyang amang si Jacob at iniharap siya sa Faraon[a]. At binasbasan ni Jacob ang Faraon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pinatayo siya sa harap ng Faraon.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring kabilang sa “binasbasan” ang pormal na pagbigkas ng basbas, hindi lamang isang magalang na pagbati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: dinala
  rationale: 'Ang Hiphil ng בוא ay may diwang sanhi: ipinasok ni Jose si Jacob sa presensiya ng Faraon. Likas sa Filipino ang “dinala” sa ganitong tagpo.'
- source_word: אָבִיו
  choice: ang kanyang amang si Jacob
  rationale: Tumutukoy ang hulaping panghalip kay Jose. Ang ayos na ito ay malinaw at likas sa modernong Filipino.
- source_word: וַיַּעֲמִדֵהוּ לִפְנֵי
  choice: iniharap ito sa
  rationale: Literal itong “pinatayo siya sa harap ng,” ngunit sa konteksto ng pagharap sa hari, ang “iniharap” ang natural na katumbas habang napapanatili ang pormal na diwa.
- source_word: וַיְבָרֶךְ
  choice: binasbasan
  rationale: Karaniwang kahulugan ng ברך ang pagbibigay o pagbigkas ng basbas. Hindi ito pinahina tungo sa simpleng magalang na pagbati.
- source_word: פַרְעֹה
  choice: Faraon
  rationale: Ito ang kinagawiang anyong Filipino ng titulong maharlika sa Ehipto.
- source_word: וַ
  choice: Pagkatapos / At
  rationale: Inilalarawan ng magkakasunod na waw ang pag-usad ng salaysay. Ang “Pagkatapos” at “At” ay natural na naghahayag ng pagkakasunod-sunod sa Filipino.
theological_decisions:
- issue: Kahulugan ng ginawa ni Jacob sa Faraon
  choice: Talagang binasbasan ni Jacob ang Faraon
  alternative: Magalang lamang na binati ni Jacob ang Faraon
  rationale: Pinakamainam panatilihin ang karaniwang kahulugan ng ברך na “basbasan.” Sa gayon, nananatili ang kapansin-pansing tensiyon na ang patriyarka ay nagbabasbas sa makapangyarihang hari.
translation_notes:
  register: Modernong Filipino na dignipikado at madaling maunawaan. Ginamit ang “iniharap” para sa natural na wika ng isang pormal na pagharap sa hari, at pinanatili ang “binasbasan” upang huwag alisin ang lakas at teolohikal na tensiyon ng pandiwang Hebreo.
