  text: לָ֧/מָּה נָמ֣וּת לְ/עֵינֶ֗י/ךָ גַּם אֲנַ֨חְנוּ֙ גַּ֣ם אַדְמָתֵ֔/נוּ קְנֵֽה אֹתָ֥/נוּ וְ/אֶת אַדְמָתֵ֖/נוּ בַּ/לָּ֑חֶם וְ/נִֽהְיֶ֞ה אֲנַ֤חְנוּ וְ/אַדְמָתֵ֨/נוּ֙ עֲבָדִ֣ים לְ/פַרְעֹ֔ה וְ/תֶן זֶ֗רַע וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת וְ/הָ/אֲדָמָ֖ה לֹ֥א תֵשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/019.yaml
  text: Why should we die before your eyes[a], both we and our land? Buy us and our land for bread, and we and our land will be servants to Pharaoh. Give seed, so that we may live and not die[e][d][c][b], and the land may not become desolate.
translation:
  language: tl
  text: Bakit kami mamamatay sa iyong harapan[a]—kami pati ang aming lupain? Bilhin mo kami at ang aming lupain kapalit ng pagkain[b], at kami at ang aming lupain ay magiging mga alipin[c] ni Paraon. Bigyan mo kami ng binhing itatanim upang mabuhay kami at hindi mamatay, at upang hindi maging tiwangwang[d] ang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa iyong paningin.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kapalit ng tinapay”; dito, ang “tinapay” ay tumutukoy sa pagkain sa pangkalahatan.
    reason: lexical_alternative
  - marker: c
    text: O “mga lingkod.” Maaaring tumukoy ang salitang Hebreo sa iba’t ibang uri ng paglilingkod o pagkaalipin; dito, nangingibabaw ang ekonomikong pagkakabigkis.
    reason: lexical_alternative
  - marker: d
    text: O “mawasak” o “maiwanang walang laman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה נָמוּת
  choice: Bakit kami mamamatay
  rationale: Likas na modernong Tagalog para sa retorikal na pakiusap na nagtatanong kung bakit sila hahayaang mamatay.
- source_word: לְעֵינֶיךָ
  choice: sa harap ng iyong mga mata
  rationale: Pinananatili ang matingkad na idyomang Hebreo; ang diwa ay sa mismong paningin o harapan ni Jose.
- source_word: גַּם אֲנַחְנוּ גַּם אַדְמָתֵנוּ
  choice: kami pati ang aming lupain
  rationale: 'Malinaw na inuugnay ang dalawang nanganganib: ang mga tao at ang kanilang lupain.'
- source_word: קְנֵה אֹתָנוּ וְאֶת אַדְמָתֵנוּ
  choice: Bilhin mo kami at ang aming lupain
  rationale: Tuwirang inilalarawan ng קנה ang komersiyal na pagkuha sa kanila at sa lupa sa gitna ng taggutom.
- source_word: בַּלָּחֶם
  choice: kapalit ng pagkain
  rationale: Ang beth ay nagsasaad ng kapalit o halaga. Sa kontekstong ito, ang לֶחֶם ay tumutukoy sa pagkaing ikabubuhay, hindi lamang sa lutong tinapay.
- source_word: וְנִהְיֶה
  choice: ay magiging
  rationale: 'Ipinapahayag ang magiging bunga ng pagbili: mapapasailalim sila sa katayuang paglilingkod kay Paraon.'
- source_word: עֲבָדִים
  choice: mga alipin
  rationale: Sa ekonomikong-legal na konteksto, nangingibabaw ang pagkawala ng kalayaan at pagkakabigkis sa paglilingkod, kaya mas tumpak kaysa sa pangkalahatang 'mga lingkod.'
- source_word: לְפַרְעֹה
  choice: ni Paraon
  rationale: Natural na Tagalog na nagpapahayag kung kanino sila mapapabilang bilang mga alipin.
- source_word: וְתֶן זֶרַע
  choice: Bigyan mo kami ng binhing itatanim
  rationale: Bagaman hindi tahasang nakasulat ang 'kami,' malinaw ito sa konteksto; nililinaw ng 'binhing itatanim' ang agrikultural na kahulugan ng זֶרַע.
- source_word: וְהָאֲדָמָה לֹא תֵשָׁם
  choice: upang hindi maging tiwangwang ang lupain
  rationale: Ipinapahayag ang layuning huwag maiwang walang tanim, walang naninirahan, o wasak ang lupain; pinananatili ng 'tiwangwang' ang lawak ng kahulugan.
theological_decisions:
- issue: Katayuan ng עֲבָדִים sa ilalim ni Paraon
  choice: mga alipin
  alternative: mga lingkod
  rationale: Hindi ito paglalapat ng isang doktrinal na pananaw kundi pagkilala sa ekonomikong pagkakabigkis at pagkawala ng kalayaan sa salaysay; nakatala rin ang mas malawak na alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'iyong' at mga anyong pautos na 'Bilhin mo' at 'Bigyan mo' upang mapanatili ang tuwirang pakiusap. Nilinaw ang 'seed' bilang 'binhing itatanim' at ang idiomatikong 'bread' bilang 'pagkain,' habang inilagay sa talababa ang literal na anyo.
