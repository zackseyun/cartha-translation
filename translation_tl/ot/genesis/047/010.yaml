  yaml_path: translation/ot/genesis/047/010.yaml
  text: Then Jacob blessed Pharaoh and went out from Pharaoh’s presence[a].
translation:
  language: tl
  text: Pagkatapos, binasbasan ni Jacob ang Faraon[a] at umalis mula sa harapan ng Faraon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binati ang Faraon” o “nagpaalam sa Faraon.” Karaniwang nangangahulugang “binasbasan” ang pandiwang Hebreo, ngunit sa konteksto ng pakikipagharap sa isang hari, maaari rin itong tumukoy sa pormal na pagbati o pamamaalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: binasbasan
  rationale: Karaniwang nangangahulugang “magbasbas” ang pandiwang ברך. Pinananatili nito ang payak na diwa at ang pagkakatulad sa naunang ginawa ni Jacob sa talata 7, habang kinikilala sa talababa na maaari rin itong tumukoy sa pormal na pagbati o pamamaalam sa haring kaharap.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Karaniwang anyo ng pangalang יעקב sa modernong saling Filipino.
- source_word: אֶת
  choice: '[pananda ng tuwirang layon, hindi isinalin]'
  rationale: Walang tuwirang katumbas sa Filipino ang Hebreong pananda ng tiyak na tuwirang layon.
- source_word: פַּרְעֹה
  choice: Faraon
  rationale: Karaniwang anyo sa Filipino ng titulong maharlika na פרעה.
- source_word: וַיֵּצֵא
  choice: umalis
  rationale: Ang יצא ay karaniwang “lumabas” o “umalis.” Sa konteksto ng pagtatapos ng pakikipagharap sa hari, natural at malinaw ang “umalis.”
- source_word: מִלִּפְנֵי
  choice: mula sa harapan nito
  rationale: Ang idyomang מלפני ay literal na “mula sa harapan ni.” Ipinahahayag ng salin ang pag-alis ni Jacob mula sa pakikipagharap sa Faraon nang hindi inuulit nang alanganin ang titulo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “binasbasan” upang panatilihin ang pangunahing diwa ng Hebreo at ang ugnayan nito sa talata 7; inilagay sa talababa ang posibleng gamit nito bilang pormal na pagbati o pamamaalam.
