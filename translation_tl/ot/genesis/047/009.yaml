base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/009.yaml
  text: And Jacob said to Pharaoh[a], “The days of the years of my sojourning are one hundred thirty years. Few and evil have been the days of the years of my life[b], and they have not attained to the days of the years of the lives of my fathers in the days of their sojourning.”
translation:
  language: tl
  text: At sinabi ni Jacob sa Paraon, “Ang mga araw ng mga taon ng paninirahan ko bilang dayuhan[a] ay isandaan at tatlumpung taon. Kaunti at mahirap ang mga araw ng mga taon ng buhay ko[b], at hindi umabot ang mga ito sa mga araw ng mga taon ng buhay ng mga ninuno ko noong naninirahan sila bilang mga dayuhan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “paglalakbay bilang dayuhan.” Ang salitang Hebreo ay tumutukoy sa paninirahan bilang pansamantalang residente o dayuhan.
    reason: lexical_alternative
  - marker: b
    text: 'Sa mas literal na ayos: “Kaunti at masasama ang mga araw ng mga taon ng buhay ko.” Dito, ang “masasama” ay maaaring tumukoy sa mahihirap o masasaklap na araw.'
    reason: literal_rendering
lexical_decisions:
- source_word: מְגוּרַי / מְגוּרֵיהֶם
  choice: paninirahan ko bilang dayuhan / naninirahan sila bilang mga dayuhan
  rationale: Tumutukoy ang mga anyo ng מָגוּר sa paninirahan bilang pansamantalang residente o dayuhan. Likas sa makabagong Tagalog ang pariralang ito at pinananatili nito ang kalagayan ng mga patriyarka bilang mga dayuhang naninirahan sa lupain, nang hindi ito ginagawang espirituwal na ‘paglalakbay.’
- source_word: יְמֵי שְׁנֵי
  choice: mga araw ng mga taon ng
  rationale: Pinananatili ang sadyang magkapatong na ‘mga araw’ at ‘mga taon,’ na nagbibigay sa pananalita ni Jacob ng marangal at taimtim na himig.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: isandaan at tatlumpung taon
  rationale: Karaniwan at malinaw na paraan ng pagsasabi ng bilang sa makabagong Tagalog.
- source_word: מְעַט
  choice: kaunti
  rationale: Tuwirang inilalarawan ang haba ng buhay ni Jacob bilang kakaunti kung ihahambing sa haba ng buhay ng kanyang mga ama.
- source_word: רָעִים
  choice: puno ng hirap
  rationale: Sa konteksto, inilalarawan ng רָעִים ang mga paghihirap at kapighatian sa buhay ni Jacob, hindi ang moral na kasamaan ng mga araw. Ang ‘puno ng hirap’ ay malinaw at natural habang nililinaw sa talababa ang mas literal na anyo.
- source_word: חַיַּי / חַיֵּי אֲבֹתַי
  choice: buhay ko / buhay ng aking mga ama
  rationale: Natural na Tagalog para sa haba o panahon ng buhay, habang pinananatili ng ‘aking mga ama’ ang tuwirang ugnayang pampamilya sa tekstong Hebreo.
- source_word: הִשִּׂיגוּ
  choice: hindi umabot
  rationale: Saklaw ng pandiwa ang pag-abot o pagtatamo. Malinaw na ipinahihiwatig ng ‘hindi umabot’ na mas maikli ang buhay ni Jacob kaysa sa buhay ng kanyang mga ama.
theological_decisions:
- issue: Paglalarawan ng patriyarka sa sarili bilang dayuhang naninirahan
  choice: paninirahan bilang dayuhan
  alternative: paglalakbay bilang dayuhan / peregrinasyon
  rationale: Ipinahahayag ng talata ang makasaysayang kalagayan ng mga patriyarka bilang mga dayuhang residente. Hindi ipinapasok sa pangunahing teksto ang mas espirituwalisadong diwa ng ‘peregrinasyon,’ ngunit binabanggit sa talababa ang posibleng salin.
- issue: Kahulugan ng רָעִים sa paglalarawan ng buhay ni Jacob
  choice: puno ng hirap
  alternative: masasama
  rationale: Hindi sinasabing imoral ang mga araw; binubuod ni Jacob ang kapighatian ng kanyang buhay. Gayunman, pinananatili sa talababa ang literal na ‘masasama’ upang hindi maitago ang lakas at lawak ng salitang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang taimtim na pag-uulit ng Hebreong ‘mga araw ng mga taon,’ ngunit gumamit ng natural na mga parirala para sa katayuan bilang dayuhan at sa hirap ng buhay.
