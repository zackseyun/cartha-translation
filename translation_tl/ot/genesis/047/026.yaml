base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/026.yaml
  text: 'So Joseph made it a statute that stands to this day concerning the land of Egypt: the fifth is for Pharaoh[d][c][b][a]. Only the land of the priests alone did not become Pharaoh’s.'
translation:
  language: tl
  text: 'Kaya itinakda ni Jose bilang batas na nananatili hanggang sa araw na ito ukol sa lupain ng Ehipto: ang ikalimang bahagi ay para kay Paraon.[a] Tanging ang lupain lamang ng mga pari ang hindi naging pag-aari ni Paraon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang ikalimang bahagi para kay Paraon.” Ang “ikalimang bahagi” ay katumbas ng 20 porsiyento.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָהּ לְחֹק
  choice: ginawa ni Jose itong batas
  rationale: Sa legal at administratibong konteksto, ang שׂוּם kasama ng לְחֹק ay nangangahulugang magtakda o magtatag bilang batas. Ang “itong” ay natural na tumutukoy sa patakarang inilarawan sa naunang talata.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: na nananatili hanggang sa araw na ito
  rationale: Ipinahihiwatig ng idyoma na patuloy na umiiral ang batas hanggang sa panahon ng tagapagsalaysay; nililinaw ng sugnay ang natural na ugnayan nito sa “batas.”
- source_word: עַל אַדְמַת מִצְרַיִם
  choice: para sa lupain ng Ehipto
  rationale: Dito, ang עַל ay tumutukoy sa saklaw ng batas. Ang “para sa” ay natural sa Filipino at malinaw na ang batas ay ukol sa lupain ng Ehipto.
- source_word: לְפַרְעֹה לַחֹמֶשׁ
  choice: ang ikalimang bahagi ay para kay Paraon
  rationale: Ang חֹמֶשׁ ay ikalimang bahagi, o 20 porsiyento. Pinananatili ng “ang ikalimang bahagi” ang tiyak na anyo ng pariralang Hebreo, at ipinapahayag ng “para kay Paraon” ang tatanggap ng bahagi.
- source_word: רַק אַדְמַת הַכֹּהֲנִים לְבַדָּם
  choice: Tanging ang lupain ng mga pari
  rationale: Magkasamang nagbibigay-diin ang רַק at לְבַדָּם sa natatanging eksepsiyon. Sapat at natural sa Filipino ang “Tanging” upang maihatid ang diin nang hindi paulit-ulit.
- source_word: לֹא הָיְתָה לְפַרְעֹה
  choice: ang hindi naging pag-aari ni Paraon
  rationale: Ang היה + ל ay maaaring magpahayag ng pagmamay-ari o kalagayang bunga ng paglilipat. Sa konteksto ng pagbili at paglilipat ng lupa, malinaw na ipinahahayag ng saling ito na hindi napunta sa pagmamay-ari ni Paraon ang lupa ng mga pari.
