translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “batas” sa halip na mas teknikal na “kautusan” o “estatuto,” at iniwasan ang labis na literal na pag-uulit sa pariralang tumutukoy sa lupain ng mga pari.
