  yaml_path: translation/ot/genesis/047/016.yaml
  text: And Joseph said[a], “Bring your livestock, and I will give to you in exchange for your livestock[b], if the money is gone.”
translation:
  language: tl
  text: Sinabi ni Jose, “Ibigay ninyo ang inyong mga alagang hayop, at bibigyan ko kayo ng pagkain[a] kapalit ng inyong mga alagang hayop, kung ubos na ang pera.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang binabanggit sa Hebreo ang ibibigay ni Jose; isiningit ang “pagkain” mula sa agarang konteksto ng taggutom at pagbibigay ng tinapay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Ibigay ninyo
  rationale: Ang pautos na anyong maramihan ay humihiling na ibigay o iabot nila ang kanilang ari-arian. Sa Filipino, natural ang “Ibigay ninyo” at malapit sa payak na diwa ng pandiwa.
- source_word: מִקְנֵיכֶם
  choice: inyong mga alagang hayop
  rationale: Ang מִקְנֶה ay tumutukoy sa mga hayop na pag-aari o kawan. Mas malawak at mas madaling maunawaan ang “mga alagang hayop” kaysa sa “mga baka,” na maaaring maging masyadong makitid.
- source_word: וְאֶתְּנָה לָכֶם
  choice: at bibigyan ko kayo ng pagkain
  rationale: Walang tahasang layon ang pandiwa sa Hebreo, ngunit malinaw sa kagyat na konteksto ng taggutom at pagbili ng pagkain na pagkain ang ibibigay. Isinisingit ito upang maging natural at malinaw sa Filipino nang hindi binabago ang transaksiyon.
- source_word: בְּמִקְנֵיכֶם
  choice: kapalit ng inyong mga alagang hayop
  rationale: 'Dito, ang בְּ ay nagpapahayag ng palitan: magbibigay si Jose ng pagkain bilang kapalit ng kanilang mga hayop.'
- source_word: אִם
  choice: yamang
  rationale: Bagaman karaniwang nangangahulugang “kung” ang אִם, ipinapaliwanag nito rito ang umiiral nang dahilan ng pakikipagpalitan—ubos na ang pera—kaya natural ang “yamang.”
- source_word: אָפֵס כָּסֶף
  choice: ubos na ang pera
  rationale: Ipinahihiwatig ng אָפֵס na naubos o wala nang natira. Ang “ubos na ang pera” ay maikli, natural, at malinaw sa makabagong Filipino.
