base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/013.yaml
  text: There was no food in all the land[a], because the famine was very severe[b]; and the land of Egypt and the land of Canaan languished because of the famine.
translation:
  language: tl
  text: Walang pagkain sa buong lupain[a], sapagkat napakatindi ng taggutom; at nanghina[b] ang lupain ng Ehipto at ang lupain ng Canaan dahil sa taggutom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tinapay”; malamang na tumutukoy rito sa pagkain sa pangkalahatan.
    reason: lexical_alternative
  - marker: b
    text: O “nanlupaypay” o “halos mawalan ng lakas.” Inilalarawan ng pandiwang Hebreo ang matinding panghihinang idinulot ng taggutom sa Ehipto at Canaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: pagkain
  rationale: Bagaman literal na “tinapay,” tumutukoy ito rito sa pagkain sa pangkalahatan sa konteksto ng taggutom.
- source_word: אֵין
  choice: walang
  rationale: Likas at maikling paraan sa Tagalog upang ipahayag ang kawalan sa salaysay.
- source_word: בְּכָל הָאָרֶץ
  choice: sa buong lupain
  rationale: Pinananatili ang heograpikong diwa ng אֶרֶץ nang hindi ipinahihiwatig na buong daigdig ang tinutukoy.
- source_word: כָבֵד ... מְאֹד
  choice: napakatindi
  rationale: Ang literal na “napakabigat” ay idyomatikong tumutukoy sa sukdulang tindi ng taggutom.
- source_word: הָרָעָב
  choice: taggutom
  rationale: Karaniwang salin sa Filipino para sa malawakang kakulangan ng pagkain sa kontekstong ito.
- source_word: וַתֵּלַהּ
  choice: nanghina
  rationale: Ipinahahayag ang matinding panghihina o pagkaubos ng lakas na dulot ng taggutom, habang pinananatili ang personipikasyon ng mga lupain.
- source_word: אֶרֶץ מִצְרַיִם וְאֶרֶץ כְּנַעַן
  choice: ang lupain ng Ehipto at ang lupain ng Canaan
  rationale: Pinananatili ang inuulit na “lupain ng” at ang heograpikong diin ng Hebreo.
- source_word: מִפְּנֵי הָרָעָב
  choice: dahil sa taggutom
  rationale: Natural na panumbas sa Filipino ng sanhi na ipinahahayag ng parirala.
