base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/025.yaml
  text: And they said[a], “You have kept us alive. May we find favor in the eyes of my lord, and we will be servants to Pharaoh.”
translation:
  language: tl
  text: At sinabi nila, “Iningatan mo kaming buhay. Nawa’y kalugdan kami ng aking panginoon, at magiging mga alipin kami ng Faraon.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: At sinabi nila
  rationale: Likas na salaysay na katumbas ng waw-consecutive at nagpapanatili sa daloy ng tuwirang pananalita.
- source_word: הֶחֱיִתָנוּ
  choice: Iningatan mo kaming buhay
  rationale: Ipinapahayag ang causative na diwa ng Hiphil ng חיה—pinanatiling buhay—nang hindi dinaragdagan ng espirituwal o militar na kahulugan ng pagliligtas.
- source_word: נִמְצָא חֵן בְּעֵינֵי אֲדֹנִי
  choice: Nawa’y kalugdan kami ng aking panginoon
  rationale: Natural na modernong Tagalog para sa magalang at volitibong pakiusap na literal na ‘makasumpong nawa kami ng biyaya sa mga mata ng aking panginoon’; pinananatili rin ang isahang ‘aking panginoon,’ na tumutukoy kay Jose.
- source_word: וְהָיִינוּ
  choice: at magiging
  rationale: Ipinakikita ang resultang pangako o kalagayang susunod sa pag-iingat sa kanilang buhay.
- source_word: עֲבָדִים לְפַרְעֹה
  choice: mga alipin kami ng Faraon
  rationale: Sa kontekstong pangkabuhayan, ang עֲבָדִים ay tumutukoy sa nakatali at pag-aaring paglilingkod, kaya mas tiyak ang ‘mga alipin’ kaysa ‘mga lingkod.’
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Nawa’y kalugdan” bilang likas na katumbas ng Hebreong idyoma ng paghingi ng pabor, sa halip na piliting panatilihin ang hindi natural na “sa mga mata.”
