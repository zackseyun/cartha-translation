  yaml_path: translation/ot/genesis/047/031.yaml
  text: He said[a], “Swear to me,” and he swore to him. Then Israel bowed himself on the head of the bed.
translation:
  language: tl
  text: Sinabi niya, “Manumpa ka sa akin.” At sumumpa siya sa kanya. Pagkatapos ay yumukod si Israel sa ulunan ng kama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa ulunan ng tungkod.” Maaaring basahin sa ganitong paraan ang mga katinig na Hebreo; ito ang diwang makikita sa Septuagint at sa Hebreo 11:21.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁבְעָה
  choice: Sumumpa ka
  rationale: Tuwirang pautos sa pormulang panunumpa; natural at maikli sa modernong Tagalog.
- source_word: וַיִּשָּׁבַע
  choice: sumumpa siya
  rationale: Pinananatili ang pag-uulit ng parehong pandiwang Hebreo at ang malinaw na daloy ng salaysay.
- source_word: וַיִּשְׁתַּחוּ
  choice: yumukod
  rationale: Maaaring tumukoy sa pagyukod o pagsamba. Dahil walang tahasang layon na Diyos sa sugnay, inilalarawan nito ang kilos nang hindi ipinapasok ang mas tiyak na teolohikal na pakahulugan.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinananatili ang pangalang ginamit mismo ng tekstong Hebreo sa halip na palitan ito ng Jacob.
- source_word: עַל רֹאשׁ הַמִּטָּה
  choice: sa ulunan ng kama
  rationale: Natural na ekspresyon sa Tagalog para sa dako sa may ulo ng kama at angkop sa agarang konteksto.
- source_word: הַמִּטָּה
  choice: kama
  rationale: Ito ang pagbasa ng Masoretikong pagbigkas, mittah, at akma sa konteksto ng kalagayan ni Israel.
theological_decisions:
- issue: Ang Hebreo 11:21, kasunod ng Septuagint, ay nagpapakita ng pagbasa na “tungkod” sa halip na “kama.”
  choice: kama
  alternative: tungkod
  rationale: Sinusunod ng pangunahing teksto ang Masoretikong pagbigkas ng Hebreo. Gayunman, kayang suportahan ng mga katinig ang ibang pagbasa, kaya pinananatili sa talababa ang mahalagang tekstuwal at kanonikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ulunan” bilang likas at maikling katumbas ng dakong nasa may ulo ng kama; iniwasang gawing tahasang “sumamba” ang kilos.
