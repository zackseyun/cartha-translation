  yaml_path: translation/ot/genesis/047/021.yaml
  text: As for the people[a], he moved them to the cities, from one end of the territory of Egypt to the other.
translation:
  language: tl
  text: Ang mga tao naman[a] ay inilipat niya sa mga lungsod, mula sa isang dulo ng Ehipto hanggang sa kabilang dulo nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dinala niya sa mga lungsod.” Ayon sa ibang pagkaunawa sa teksto, sinasabi ng ilang salin na ginawa ni Jose na mga alipin o lingkod ang mga tao; ngunit mas tuwirang tumutukoy ang Hebreo rito sa paglilipat sa kanila.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: ang mga tao
  rationale: Tumutukoy ito nang pangkatan sa mamamayan ng Ehipto na naapektuhan ng patakaran ni Jose. Likas sa modernong Tagalog ang “mga tao” para sa kolektibong kahulugang ito.
- source_word: הֶעֱבִיר אֹתוֹ
  choice: inilipat niya
  rationale: Ang Hiphil ng עבר ay nangangahulugang magpadaan, maglipat, o magdala sa ibang lugar. Malinaw na ipinahihiwatig ng “inilipat” ang paglipat ng kinaroroonan nang hindi nagdaragdag ng ideya ng pagkaalipin.
- source_word: לֶעָרִים
  choice: sa mga lungsod
  rationale: Ang ל ay nauunawaan dito bilang patutunguhan. Sa Tagalog, sapat at likas ang “sa mga lungsod” kasunod ng pandiwang “inilipat.”
- source_word: מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ
  choice: mula sa isang dulo ng nasasakupan ng Ehipto hanggang sa kabilang dulo nito
  rationale: Ang גְבוּל ay tumutukoy rito sa sakop o teritoryo, hindi lamang sa guhit-hangganan. Pinananatili ng parirala ang merismong nagsasaad ng buong lawak ng Ehipto.
theological_decisions:
- issue: Ang ginawa ni Jose sa mamamayan ng Ehipto
  choice: inilipat niya sa mga lungsod
  alternative: ginawa niyang mga alipin o lingkod ang mga tao
  rationale: Mas tuwirang inilalarawan ng Masoretic Hebrew ang paglipat ng mga tao. Ang pagkaalipin ay nagmumula sa ibang pagkaunawa o tradisyong tekstuwal at hindi tahasang sinasabi ng WLC sa talatang ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nasasakupan” upang ipahayag ang buong teritoryo ng Ehipto, at ang “naman” upang likas na maipakita ang paglipat ng paksa sa mga tao.
