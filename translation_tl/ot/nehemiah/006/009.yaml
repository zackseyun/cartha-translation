base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/009.yaml
  text: For all of them were trying to frighten us[a], saying, “Their hands will grow weak from the work, and it will not be done.” But now[b], strengthen my hands.
translation:
  language: tl
  text: Sapagkat sinisikap nilang lahat na takutin kami sa pagsasabing, “Manghihina ang kanilang mga kamay[a] sa gawain, at hindi ito matatapos.” Ngunit ngayon[b], palakasin mo ang aking mga kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na larawan ito ng mga kamay na nanghihina o lumalaylay—isang idyoma para sa pagkawala ng lakas o loob na ipagpatuloy ang gawain.
    reason: lexical_alternative
  - marker: b
    text: 'Ang pangwakas na sugnay ay isang maikling panalangin: “Ngunit ngayon, palakasin mo ang aking mga kamay.” May ibang pagbasa rito, ngunit sinusuportahan ng pagbigkas ng tekstong Hebreo ang tuwirang pakiusap sa Diyos.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְיָרְאִים
  choice: sinisikap ... na takutin
  rationale: Ang Hiphil participle ay nagpapahayag ng patuloy at sadyang pagpap恐; natural na ipinahahayag ito sa Filipino bilang pagtatangkang manakot.
- source_word: אוֹתָנוּ
  choice: kami
  rationale: Unang panauhang maramihan ang nasa tekstong Hebreo; kabilang ni Nehemias ang sarili niya sa pamayanan at mga manggagawa.
- source_word: לֵאמֹר
  choice: sa pagsasabing
  rationale: Karaniwang panandang Hebreo ito na nagpapakilala sa nilalaman ng sinabi o layunin; pinananatili ng salin ang anyong pagsasalita nang hindi nagpapasya kung binigkas ito nang hayagan o ipinagpalagay lamang.
- source_word: יִרְפּוּ יְדֵיהֶם
  choice: Manghihina ang kanilang mga kamay
  rationale: Pinananatili ang larawan ng mga kamay na nawawalan ng lakas o sigla, habang nananatiling nauunawaan sa modernong Filipino. Tinutukoy ng idyoma ang pagkawala ng lakas ng loob o kakayahang ipagpatuloy ang gawain.
- source_word: מִן הַמְּלָאכָה
  choice: sa gawain
  rationale: Ang מְלָאכָה ay tumutukoy sa proyekto ng muling pagtatayo; ang “gawain” ay natural at sapat na tiyak sa konteksto.
- source_word: וְלֹא תֵעָשֶׂה
  choice: at hindi ito matatapos
  rationale: Bagaman literal na “at hindi ito magagawa,” ang tinutukoy ay ang proyektong hindi maisasakatuparan o matatapos. Ang “matatapos” ang pinakanatural sa konteksto ng muling pagtatayo.
- source_word: וְעַתָּה
  choice: Ngunit ngayon
  rationale: Ipinakikita ang pagliko mula sa balak ng mga kaaway tungo sa maikling panalangin ni Nehemias.
- source_word: חַזֵּק אֶת יָדַי
  choice: palakasin mo ang aking mga kamay
  rationale: Pinananatili ang larawan ng mga kamay sapagkat sinasagot nito ang hangarin ng mga kaaway na manghina ang mga kamay ng mga manggagawa. Isa rin itong idyoma para sa pagbibigay-lakas upang magpatuloy.
theological_decisions:
- issue: Paglipat mula sa salaysay tungo sa tuwirang panalangin
  choice: 'Isinalin ang pangwakas na sugnay bilang tuwirang pakiusap ni Nehemias: “palakasin mo ang aking mga kamay.”'
  alternative: 'Basahin ito bilang pagpapatatag ni Nehemias sa sarili: “pinalakas ko ang aking mga kamay.”'
  rationale: Ang pagbigkas ng Masoretic Text ay nagpapakita ng pautos na pandiwa sa ikalawang panauhang panlalaki, kaya likas itong maunawaan bilang maikling panalangin sa Diyos. Hindi tahasang idinagdag ang pangalang “Diyos” sa pangunahing teksto dahil hindi ito nakasulat sa Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang magkatugmang larawan ng “mga kamay” sa banta ng mga kaaway at sa panalangin ni Nehemias. Ginamit ang “kanilang” at “aking” sa halip na mas kolokyal na anyo upang mapanatili ang dignidad at linaw ng tekstong biblikal.
