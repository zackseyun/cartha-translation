  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר שָֽׁמְעוּ֙ כָּל א֣וֹיְבֵ֔י/נוּ וַ/יִּֽרְא֗וּ כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתֵ֔י/נוּ וַ/יִּפְּל֥וּ מְאֹ֖ד בְּ/עֵינֵי/הֶ֑ם וַ/יֵּ֣דְע֔וּ כִּ֚י מֵ/אֵ֣ת אֱלֹהֵ֔י/נוּ נֶעֶשְׂתָ֖ה הַ/מְּלָאכָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/016.yaml
  text: And it happened that when all our enemies heard[a], and all the nations around us saw, they fell greatly in their own eyes, and they knew that this work had been done by our God.
translation:
  language: tl
  text: At nang marinig ito ng lahat ng aming mga kaaway at makita ito ng lahat ng bansang nasa paligid namin, lubha silang nanliit sa sarili nilang paningin[a]. Nalaman nila na naisakatuparan ang gawaing ito sa pamamagitan ng aming Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “labis silang nawalan ng tiwala sa sarili” o “lubha silang pinanghinaan ng loob.” Sa Hebreo, literal na inilalarawan silang “lubhang bumagsak sa sarili nilang mga mata.”
    reason: Pinananatili sa pangunahing teksto ang larawang Hebreo habang nililinaw rito ang posibleng idyomatikong kahulugan.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: At nang
  rationale: Likas na panandang pasalaysay at temporal sa modernong Tagalog; pinananatili nito ang paglipat ng salaysay nang hindi gumagamit ng makalumang pormula.
- source_word: שָׁמְעוּ
  choice: marinig ito
  rationale: Ang layon ng pandiwa ay ipinahihiwatig ng konteksto—ang pagkakatapos ng pader. Ginagawang malinaw ng “ito” ang pangungusap sa Tagalog nang hindi pinapangalanan nang higit sa sinasabi ng teksto.
- source_word: כָּל אֹיְבֵינוּ
  choice: lahat ng aming kaaway
  rationale: Tuwirang salin ng parirala at natural sa marangal na modernong Tagalog.
- source_word: וַיִּרְאוּ כָּל הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: makita ito ng lahat ng bansang nasa paligid namin
  rationale: Pinananatili ang karaniwang kahulugan ng ראה na “makita” at isinasalin ang גּוֹיִם bilang “mga bansa,” nang walang paglalagay ng mas huling teolohikal na diwa ng “mga Hentil.”
- source_word: וַיִּפְּלוּ מְאֹד בְּעֵינֵיהֶם
  choice: lubha silang nanliit sa sarili nilang paningin
  rationale: Pinananatili ang larawan ng pagbaba ng sarili sa sariling paningin, ngunit ginagamit ang natural na idyomang Tagalog. Inilalahad sa talababa ang posibleng diwang pagkawala ng tiwala sa sarili o matinding panghihina ng loob.
- source_word: וַיֵּדְעוּ
  choice: Nalaman nila
  rationale: Tuwirang ipinahahayag ang pagkilala o pagkaunawa ng mga nakapaligid na bansa.
- source_word: מֵאֵת אֱלֹהֵינוּ
  choice: sa pamamagitan ng aming Diyos
  rationale: Ipinahahayag ang Diyos bilang pinagmulan o ahente ng pagkakagawa. Mas natural ito sa Tagalog kaysa sa literal na “mula sa aming Diyos,” habang hindi ipinapakahulugang ang Diyos mismo ang pisikal na nagtayo.
- source_word: נֶעֶשְׂתָה הַמְּלָאכָה הַזֹּאת
  choice: naisakatuparan ang gawaing ito
  rationale: Ang “naisakatuparan” ay natural na pasibo para sa natapos na gawain at akma sa proyektong pagtatayo nang hindi ito labis na pinakikitid.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagkakumpleto ng gawain
  choice: sa pamamagitan ng aming Diyos
  alternative: mula sa aming Diyos / dahil sa aming Diyos
  rationale: Maaaring magpahiwatig ang מֵאֵת ng pinagmulan o ahensiya. Pinananatili ng napiling salin na ang pagkakumpleto ay iniuugnay sa Diyos, ngunit hindi nito tinutukoy ang eksaktong paraan ng kanyang pagkilos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang makalumang “at nangyari” bilang hiwalay na pormula at ang denominasyonal na terminong “mga Hentil.”
