base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/002.yaml
  text: So Sanballat and Geshem sent to me[a], saying, “Come[b], and let us meet together in the villages in the plain of Ono.” But they were planning to do me harm.
translation:
  language: tl
  text: Kaya nagpasabi sa akin sina Sanbalat at Gesem, “Halika, magtagpo tayo sa mga nayon[a] sa kapatagan[b] ng Ono.” Ngunit balak nila akong saktan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “sa Kefirim,” kung ituturing ang salitang Hebreo bilang pangalan ng lugar sa halip na “sa mga nayon.”
    reason: alternative_reading
  - marker: b
    text: Ang “kapatagan” ay maaari ding isaling “lambak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagpasabi
  rationale: Ang mensahe ay ipinahiwatig ng kasunod na לֵאמֹר. Likas sa Filipino ang “nagpasabi” para sa pagpapadala ng paanyaya nang hindi tinutukoy ang sugo.
- source_word: סַנְבַלַּט וְגֶשֶׁם
  choice: sina Sanbalat at Gesem
  rationale: Isinalin sa karaniwang baybay-Filipino ang mga pangalang pantangi, at ginamit ang “sina” bilang pananda sa tambalang simuno.
- source_word: לְכָה
  choice: Halika
  rationale: Bagaman mula sa pandiwang may diwang “lumakad/pumunta,” isa itong idyomatikong paanyaya rito, kaya natural ang “Halika.”
- source_word: וְנִוָּעֲדָה יַחְדָּו
  choice: magtagpo tayo
  rationale: Ipinahahayag ng Niphal ng יעד ang pagtatagpo ayon sa usapan; likas at sapat sa Filipino ang “magtagpo tayo,” na taglay na ang diwang magkakasama.
- source_word: בַּכְּפִירִים
  choice: sa isa sa mga nayon
  rationale: Malamang na karaniwang pangngalang maramihan itong tumutukoy sa mga nayon. Ang “isa sa” ay likas sa konteksto ng pagpili ng lugar na pagtatagpuan; pinanatili sa talababa ang posibleng pagbasa rito bilang pangalang-lugar.
- source_word: בְּבִקְעַת אוֹנוֹ
  choice: sa kapatagan ng Ono
  rationale: Ang בִּקְעָה ay malawak na lambak o kapatagan. Ang “kapatagan” ay malinaw at angkop sa topograpiya, habang inilalahad sa talababa ang “lambak.”
- source_word: וְהֵמָּה חֹשְׁבִים
  choice: Ngunit balak nila
  rationale: Sa konteksto, ang חֹשְׁבִים ay pagbalak o pagbabalak, at ang “Ngunit” ay nagpapakita ng pagsalungat ng tunay nilang layunin sa paanyaya.
- source_word: לַעֲשׂוֹת לִי רָעָה
  choice: akong saktan
  rationale: Natural na modernong Filipino ito para sa layuning gumawa ng masama o pinsala kay Nehemias, nang hindi tinutukoy kung anong uri ng pananakit.
