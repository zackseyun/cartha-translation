  source_fidelity: Tumpak na naipapahayag ng draft ang paanyaya at ang lihim na balak na saktan si Nehemias. Gayunman, ang “isa sa mga nayon” ay nagdaragdag ng diwang isahan/pagpili na wala sa Hebreong pangmaramihang בַּכְּפִירִים, na mas maingat na isalin bilang “sa mga nayon.”
  naturalness: Natural at malinaw ang modernong Filipino ng talata. Ang “nagpasabi sa akin” at “magtagpo tayo” ay angkop sa salaysay; magiging higit na tapat sa pinagmulan ang pag-alis ng “isa sa.”
  terminology: Ang mga pangalang “Sanbalat,” “Gesem,” at “Ono” ay pare-pareho at katanggap-tanggap. Ang “kapatagan” para sa בִּקְעָה at “saktan” para sa paggawa ng masama/pinsala ay angkop; napapanatili rin sa talababa ang mga leksikal na alternatibo.
  issues:
