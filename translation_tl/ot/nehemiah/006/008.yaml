translation:
  language: tl
  text: 'Kaya nagpadala ako sa kanya ng mensahe: “Hindi nangyari ang mga bagay na ito na sinasabi mo, sapagkat iniimbento[a] mo lamang ang mga iyon sa sarili mong isip.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ginagawa-gawa mo lamang ang mga iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלְחָה אֵלָיו לֵאמֹר
  choice: Kaya nagpasabi ako sa kanya
  rationale: Likas na ipinapahayag sa modernong Tagalog ang pagpapadala ng mensahe at ang pagpasok sa tuwirang sipi, habang pinananatili ang sunod na kilos sa salaysay.
- source_word: לֹא נִהְיָה כַּדְּבָרִים הָאֵלֶּה
  choice: Hindi nangyari ang mga bagay na ito
  rationale: Itinatanggi nito ang pagiging tunay o ang pangyayari ng mga paratang. Pinananatili ng “mga bagay na ito” ang demonstratibong הָאֵלֶּה at ang malawak na kahulugan ng דְּבָרִים bilang mga bagay o usapin.
- source_word: אֲשֶׁר אַתָּה אוֹמֵר
  choice: na sinasabi mo
  rationale: Ipinahihiwatig ng participle ang patuloy o kasalukuyang pagsasabi ng kausap.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala rito ang dahilan ng pagtanggi ni Nehemias; hindi kailangang gawing tahasang adversatibo ang ugnayan.
- source_word: מִלִּבְּךָ
  choice: mula sa sarili mong puso
  rationale: Pinananatili ang larawang Hebreo ng puso bilang sentro ng pag-iisip at hangarin, sa halip na paliitin ito sa “isip” lamang.
- source_word: בּוֹדָאם
  choice: ginagawa-gawa mo lamang ang mga iyon
  rationale: Malinaw at natural na modernong Tagalog para sa paglikha o pagkatha ng mga huwad na paratang; ipinahihiwatig ng “lamang” na walang batayan ang mga ito.
