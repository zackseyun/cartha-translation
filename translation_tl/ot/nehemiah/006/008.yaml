  naturalness: Mas malinaw at natural ang “nagpadala ako sa kanya ng mensahe” at “iniimbento mo lamang ang mga iyon sa sarili mong isip.” Pinananatili nito ang marangal ngunit modernong rehistro.
  terminology: Walang terminong teolohikal na nangangailangan ng partikular na pagmamarka. Ang “sarili mong isip” ay isang kontekstuwal na salin ng “puso” bilang sentro ng pag-iisip at pagpaplano, hindi isang pagbabagong doktrinal.
