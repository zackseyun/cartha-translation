- from: Kaya nagpasabi ako sa kanya, “Hindi nangyari ang mga bagay na ito na sinasabi mo, sapagkat ginagawa-gawa mo lamang ang mga iyon mula sa sarili mong puso.”
  to: 'Kaya nagpadala ako sa kanya ng mensahe: “Hindi nangyari ang mga bagay na ito na sinasabi mo, sapagkat iniimbento[a] mo lamang ang mga iyon sa sarili mong isip.”'
