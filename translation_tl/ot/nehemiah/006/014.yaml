  text: זָכְרָ֧/ה אֱלֹהַ֛/י לְ/טוֹבִיָּ֥ה וּ/לְ/סַנְבַלַּ֖ט כְּ/מַעֲשָׂ֣י/ו אֵ֑לֶּה וְ/גַ֨ם לְ/נוֹעַדְיָ֤ה הַ/נְּבִיאָה֙ וּ/לְ/יֶ֣תֶר הַ/נְּבִיאִ֔ים אֲשֶׁ֥ר הָי֖וּ מְיָֽרְאִ֥ים אוֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/014.yaml
  text: Remember Tobiah and Sanballat[a], my God, according to these deeds of theirs, and also Noadiah the prophetess and the rest of the prophets who were trying to make me afraid.
translation:
  language: tl
  text: Alalahanin mo, Diyos ko, sina Tobia at Sanbalat ayon sa mga ginawa nilang ito, pati na rin si Noadia na propetisa at ang iba pang mga propeta na nagsisikap na takutin ako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nagtatangkang sindakin ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה אֱלֹהַי
  choice: Alalahanin mo, O Diyos ko
  rationale: Pinananatili ang tuwirang panalanging nakikiusap sa Diyos. Likas at marangal sa modernong Tagalog ang bokatibong “O Diyos ko.”
- source_word: לְטוֹבִיָּה וּלְסַנְבַלַּט
  choice: sina Tobias at Sanbalat
  rationale: Ginamit ang “sina” dahil mga taong pantanging pinangalanan ang layon ng pandiwa. Ang mga pangalan ay isina-Tagalog sa kinagawiang anyong biblikal.
- source_word: כְּמַעֲשָׂיו אֵלֶּה
  choice: ayon sa mga ginawa nilang ito
  rationale: 'Ipinapahayag ng כְּ ang pagtutugma o pamantayan: alalahanin sila ayon sa kanilang mga gawa. Ang “nilang” ay natural na kolektibong pagtukoy sa dalawang naunang pangalan.'
- source_word: וְגַם לְנוֹעַדְיָה הַנְּבִיאָה
  choice: pati na rin si Noadias na propetisa
  rationale: Ang “pati na rin” ay malinaw na nagpapanatili sa dagdag na puwersa ng וְגַם. Ang pambabaeng anyo ng נְבִיאָה ay tuwirang naipapakita ng “propetisa.”
- source_word: וּלְיֶתֶר הַנְּבִיאִים
  choice: at ang iba pang mga propeta
  rationale: Natural na Tagalog para sa natitirang pangkat ng mga propeta bukod kay Noadias.
- source_word: אֲשֶׁר הָיוּ מְיָרְאִים אוֹתִי
  choice: na nagsisikap na takutin ako
  rationale: Ipinapakita ng “nagsisikap” ang nagpapatuloy at sinasadyang pagkilos sa nakaraang salaysay, at ng “takutin” ang causative na diwa ng pagpapadama ng takot.
theological_decisions:
- issue: Tono ng panalanging humihiling na alalahanin ng Diyos ang mga kalaban
  choice: “Alalahanin ... ayon sa mga ginawa nilang ito”
  alternative: “Parusahan” o “panagutin ... dahil sa kanilang ginawa”
  rationale: Pinananatili ang bigat ng panalangin ngunit hindi tahasang idinaragdag ang paghatol o kaparusahan, sapagkat ang Hebreo ay humihiling lamang na alalahanin sila ng Diyos ayon sa kanilang mga gawa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa panalangin. Pinanatili ang tuwirang panawagan sa Diyos at iniwasang palawakin ang di-tahasang kahulugan tungo sa lantad na kahilingan ng kaparusahan.
