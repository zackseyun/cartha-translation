    issue: Hindi eksakto ang anyo ng mga pangalang “Tobias” at “Noadias.”
    rationale: Ang Hebreong טוֹבִיָּה at נוֹעַדְיָה ay walang pangwakas na -s. Ang “Tobia” at “Noadia” ay mas tuwirang transliterasyon at umaayon sa English POB audit trail na Tobiah at Noadiah.
  - severity: low
    issue: Hindi ganap na katumbas ang talababa na “na patuloy na nananakot sa akin.”
    rationale: Ang participial na pahayag ay tumutukoy sa kanilang patuloy na layuning magdulot ng takot; hindi nito tahasang sinasabing matagumpay silang nananakot. Mas tumpak ang “na nagtatangkang sindakin ako.”
