  to: 'At nagtalaga ka pa nga ng mga propeta upang magpahayag tungkol sa iyo sa Jerusalem: “May hari sa Juda!”[a] At ngayon, maririnig ng hari ang mga balitang ito.[b] Kaya halika, at magsanggunian tayo.'
  rationale: Inayos ang pagpapakilala sa sipi sa pamamagitan ng tutuldok upang alisin ang malabong ugnayan ng “na nagsasabi.” Pinalitan ang “ganitong mga balita” ng “mga balitang ito” upang mas malinaw na maipakita ang demonstrative ng Hebrew. Walang binagong kahulugan o dagdag na interpretasyon.
