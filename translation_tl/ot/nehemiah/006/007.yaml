base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/007.yaml
  text: And you have even appointed prophets to proclaim concerning you in Jerusalem[a], saying, ‘There is a king in Judah!’ And now these reports will be heard by the king. So now, come[b], and let us consult together.
translation:
  language: tl
  text: 'At nagtalaga ka pa nga ng mga propeta upang magpahayag tungkol sa iyo sa Jerusalem: “May hari sa Juda!”[a] At ngayon, maririnig ng hari ang mga balitang ito.[b] Kaya halika, at magsanggunian tayo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hari sa Juda.” Maikli at walang pandiwa ang pahayag sa Hebreo; ipinahihiwatig nito ang pag-aangkin ng pagkahari ngunit hindi tahasang pinangalanan si Nehemias sa mismong sipi.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “mga salitang ito” o “mga bagay na ito.” Malawak ang kahulugan ng salitang Hebreo at maaaring tumukoy sa mga salita, usapin, o ulat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: At ... pa nga
  rationale: Ipinahahayag nito ang dagdag at mariing tono ng paratang.
- source_word: נְבִיאִים
  choice: mga propeta
  rationale: Ito ang karaniwan at tuwirang kahulugan; walang sapat na batayan upang gawing pangkalahatang ‘mga tagapagsalita.’
- source_word: הֶעֱמַדְתָּ
  choice: nagtalaga ka
  rationale: Ang Hiphil ay tumutukoy sa paglalagay sa mga tao sa isang itinakdang tungkulin.
- source_word: לִקְרֹא עָלֶיךָ
  choice: upang magpahayag tungkol sa iyo
  rationale: Pinananatili nito ang diwa ng pampublikong pagpapahayag na may kinalaman kay Nehemias nang hindi ipinapalagay na siya mismo ang tuwirang paksa sa maikling sipi.
- source_word: מֶלֶךְ בִּיהוּדָה
  choice: May hari sa Juda!
  rationale: Pinananatili ang maikli at walang-pandiwang anyo ng ulat sa Hebreo, nang hindi idinaragdag ang pangalan ni Nehemias sa mismong sipi.
- source_word: יִשָּׁמַע לַמֶּלֶךְ
  choice: maririnig ng hari
  rationale: Likas na Filipino para sa pasibong diwa na ang balita ay makakarating sa pandinig ng hari.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ang ganitong mga balita
  rationale: Sa kontekstong pampolitika, ang ‘mga balita’ ay malinaw na naghahatid ng diwa ng mga salitang o ulat na makararating sa hari, habang kinikilala na mas malawak ang saklaw ng דְּבָרִים.
- source_word: וְעַתָּה לְכָה
  choice: Kaya halika
  rationale: Natural na inililipat nito ang pahayag mula sa banta tungo sa paanyayang makipagkita.
- source_word: וְנִוָּעֲצָה יַחְדָּו
  choice: at magsanggunian tayo
  rationale: Ipinahahayag ng anyong bolisyonal ang kapuwa o sama-samang pag-uusap at pagpapayo; likas na nakapaloob sa ‘tayo’ ang diwa ng ‘magkasama.’
theological_decisions:
- issue: Ang uri ng paratang tungkol sa paghahari
  choice: “May hari sa Juda!”
  alternative: “Ikaw ang hari sa Juda!” o “Si Nehemias ang hari sa Juda!”
  rationale: 'Maikli at walang pandiwa ang Hebreong sipi: ‘hari sa Juda.’ Bagaman malinaw sa konteksto na si Nehemias ang pinatatamaan, hindi siya tahasang pinangalanan sa mismong siniping pahayag.'
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘magsanggunian’ upang mapanatili ang diwa ng kapuwa pag-uusap o pagpapayo, at inilagay ang mga talababa sa mismong mga pariralang nililinaw ng mga ito.
