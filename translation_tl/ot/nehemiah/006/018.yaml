translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakatali ... sa pamamagitan ng panunumpa” upang mapanatili ang lakas ng obligasyong ipinahihiwatig ng Hebreong idyoma. Ang mga pangalan ay isina-Tagalog ayon sa karaniwang anyong biblikal.
