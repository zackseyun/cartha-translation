base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/018.yaml
  text: For many in Judah were bound by oath to him[a], because he was the son-in-law of Shecaniah son of Arah[b], and Jehohanan his son had taken the daughter of Meshullam son of Berechiah as his wife.
translation:
  language: tl
  text: Sapagkat marami sa Juda ang nakatali sa kanya sa pamamagitan ng panunumpa[a], dahil manugang na lalaki siya ni Secanias na anak ni Ara, at napangasawa ng anak niyang si Jehohanan ang anak na babae ni Mesulam na anak ni Berequias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “marami sa Juda ang mga may panunumpa sa kanya”; ibig sabihin, may pananagutan sila sa kanya dahil sa kanilang panunumpa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים בִּיהוּדָה
  choice: marami sa Juda
  rationale: Likas na ipinahahayag nito ang maraming taong kabilang sa pamayanan o lalawigan ng Juda.
- source_word: בַּעֲלֵי שְׁבוּעָה לוֹ
  choice: nakatali sa kanya sa pamamagitan ng panunumpa
  rationale: Ipinahahayag ng idyoma ang obligasyon o katapatang pinagtibay ng panunumpa, hindi lamang ang simpleng paggawa ng sumpa.
- source_word: כִּי ... כִּי
  choice: Sapagkat ... dahil
  rationale: Ang una ay nagpapaliwanag sa naunang pahayag, samantalang ang ikalawa ay nagbibigay ng dahilan sa loob ng talata.
- source_word: חָתָן הוּא לִשְׁכַנְיָה
  choice: manugang siya ni Secanias
  rationale: Sa kontekstong pampamilya, ang חָתָן ay tumutukoy sa lalaking kaugnay sa pamamagitan ng pag-aasawa, at pinakamalinaw dito ang “manugang.”
- source_word: וִיהוֹחָנָן בְּנוֹ
  choice: ang anak niyang si Jehohanan
  rationale: Pinananatili nitong si Jehohanan ang anak ng pinakamalapit na tinutukoy, si Secanias, ayon sa estruktura ng Hebreo.
- source_word: לָקַח אֶת בַּת
  choice: napangasawa ... ang anak na babae
  rationale: Karaniwang idyoma ito sa Hebreo para sa pagkuha sa isang babae bilang asawa; natural at malinaw sa modernong Tagalog ang “napangasawa.”
- source_word: בַּת מְשֻׁלָּם בֶּן בֶּרֶכְיָה
  choice: ang anak na babae ni Mesulam na anak ni Berequias
  rationale: Malinaw nitong pinananatili ang sunod-sunod na ugnayang pampamilya sa tekstong Hebreo.
