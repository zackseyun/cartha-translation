base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/015.yaml
  text: So the wall was finished on the twenty-fifth day of Elul[b][a], in fifty-two days.
translation:
  language: tl
  text: Kaya natapos ang pader noong ikadalawampu't limang araw ng Elul[a], sa loob ng limampu't dalawang araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Elul ang ikaanim na buwan sa kalendaryong Hebreo.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: natapos
  rationale: Ang qal wayyiqtol ng שלם, na ang simuno ay הַחוֹמָה, ay nagsasaad na sumapit sa pagkakumpleto ang pader. Likas at tuwiran sa modernong Tagalog ang “natapos.”
- source_word: הַחוֹמָה
  choice: ang pader
  rationale: Tiyak na tumutukoy sa pader ng Jerusalem sa konteksto; “pader” ang karaniwang tuwirang katumbas.
- source_word: בְּעֶשְׂרִים וַחֲמִשָּׁה
  choice: noong ikadalawampu't limang araw
  rationale: Ang pang-ukol at mga bilang ay gumaganap bilang pahayag ng petsa. Nilinaw sa Tagalog sa pamamagitan ng “araw,” at ang “noong” ay natural para sa tiyak na petsang nakaraan.
- source_word: לֶאֱלוּל
  choice: ng Elul
  rationale: Pangalan ito ng buwan at kaya'y tinumbasan sa pamamagitan ng transliterasyong “Elul,” hindi isinalin.
- source_word: לַחֲמִשִּׁים וּשְׁנַיִם יוֹם
  choice: sa loob ng limampu't dalawang araw
  rationale: Ang lamed dito ay nagpapahayag ng kabuuang tagal. Ang “sa loob ng” ay natural na nagsasaad na natapos ang gawain sa gayong haba ng panahon, nang hindi ito ginagawang simpleng pagkakasunod lamang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang pangalang Hebreo ng buwan at nilinaw sa talababa. Hindi na nilagyan ng talababa ang “natapos/nakumpleto” sapagkat walang mahalagang pagkakaibang semantiko sa Tagalog na kailangang itala.
