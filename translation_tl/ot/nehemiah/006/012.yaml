base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/012.yaml
  text: Then I recognized, and behold, God had not sent him; rather, he had spoken the prophecy against me because Tobiah and Sanballat had hired him.
translation:
  language: tl
  text: At napagtanto ko na hindi pala siya isinugo ng Diyos; sa halip, sinabi niya ang propesiya laban sa akin dahil inupahan siya nina Tobias at Sanbalat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַכִּירָה
  choice: At napagtanto ko
  rationale: Ipinapahayag ang pagkilala o pagkaunawa ni Nehemias sa tunay na kalagayan; natural ito sa makabagong Tagalog.
- source_word: וְהִנֵּה
  choice: pala
  rationale: Sa kontekstong ito, ipinahihiwatig ng Hebreo ang biglang pagkakatuklas; natural na naihahatid iyon ng “pala” kaysa literal na “narito.”
- source_word: הַנְּבוּאָה דִּבֶּר עָלַי
  choice: sinabi niya ang propesiyang iyon laban sa akin
  rationale: Pinananatili ang tahasang “propesiya” at ang salungat na puwersa ng עָלַי, habang gumagamit ng likas na ayos sa Tagalog.
- source_word: שְׂכָרוֹ
  choice: inupahan siya
  rationale: Tuwirang katumbas ng pandiwang tumutukoy sa pagkuha sa kaniya kapalit ng bayad.
theological_decisions:
- issue: Ang pinagmulan ng ipinahayag na propesiya
  choice: hindi pala siya isinugo ng Diyos
  alternative: hindi siya sinugo ng Diyos
  rationale: Malinaw na itinatanggi ng teksto ang banal na pagsusugo, habang ang “pala” ay naghahatid ng sandali ng pagkakatuklas nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Ugnayan ng maling propesiya at pag-upa
  choice: dahil inupahan siya nina Tobias at Sanbalat
  alternative: at inupahan siya nina Tobias at Sanbalat
  rationale: Ang כִּי ay likas na binabasa rito bilang sanhi o paliwanag kung bakit nagsalita siya laban kay Nehemias.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong Filipino ng mga pangalang Tobias at Sanbalat. Walang footnote dahil walang mahalagang tekstuwal o leksikal na kalabuan na kailangang ilahad sa mambabasa.
