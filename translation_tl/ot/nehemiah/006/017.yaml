translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga maharlika” para sa prominenteng uring namumuno at ang “Tobias” bilang nakaugaliang anyong Filipino ng pangalan. Nilinaw sa teksto ang ellipsis sa ikalawang sugnay, habang pinanatili sa talababa ang literal na estruktura at likas na kalabuan nito.
