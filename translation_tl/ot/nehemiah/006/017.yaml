  yaml_path: translation/ot/nehemiah/006/017.yaml
  text: Also[a], in those days the nobles of Judah were sending many letters to Tobiah, and those from Tobiah were coming to them.
translation:
  language: tl
  text: Bukod dito,[a] noong mga araw na iyon, ang mga maharlika ng Juda ay nagpapadala ng maraming liham kay Tobias, at ang mga liham mula kay Tobias ay dumarating sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “ang kanilang mga liham ay pumupunta kay Tobias, at ang mga kay Tobias ay dumarating sa kanila.” Malamang na ipinahihiwatig sa ikalawang bahagi ang salitang “mga liham” mula sa unang bahagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Bukod dito
  rationale: Ipinakikita ang karagdagang pangyayari na kaugnay ng naunang salaysay; natural at malinaw ang panandang pandugtong na ito sa makabagong Filipino.
- source_word: בַּיָּמִים הָהֵם
  choice: nang mga araw na iyon
  rationale: Pinananatili ang karaniwang Hebreong pahayag para sa panahon sa isang natural at marangal na anyong Filipino.
- source_word: מַרְבִּים
  choice: ay nagpapadala ng maraming
  rationale: Ang participle at ang kasunod na 'mga liham' ay nagpapahiwatig ng paulit-ulit at patuloy na pagpapadala, hindi lamang ng dami.
- source_word: חֹרֵי יְהוּדָה
  choice: ang mga maharlika ng Juda
  rationale: Tumutukoy sa mga prominenteng pinuno o aristokrata ng Juda; ang 'mga maharlika' ay angkop sa katayuang panlipunan at pampolitika.
- source_word: אִגְּרֹתֵיהֶם
  choice: maraming liham
  rationale: Natural na katawagan ang 'liham' para sa nakasulat na pakikipag-ugnayan; hindi na kailangang ulitin ang panghalip na paari dahil malinaw ang mga nagpapadala.
- source_word: הוֹלְכוֹת עַל טוֹבִיָּה
  choice: kay Tobias
  rationale: Ang literal na 'pumupunta kay Tobias' ay idyoma para sa pagpapadala ng liham sa kaniya; inilalahad nang natural ang patutunguhan.
- source_word: וַאֲשֶׁר לְטוֹבִיָּה
  choice: ang mga liham mula kay Tobias
  rationale: Elliptical ang Hebreo, literal na 'yaong kay Tobias'; inuulit ang ipinahihiwatig na 'mga liham' upang maging malinaw sa Filipino habang itinatala sa talababa ang literal na anyo.
- source_word: בָּאוֹת אֲלֵיהֶם
  choice: ay dumarating sa kanila
  rationale: Pinananatili ng aspektong di-ganap ang patuloy o paulit-ulit na pagdating at ang katumbasang ayos ng palitan ng liham.
