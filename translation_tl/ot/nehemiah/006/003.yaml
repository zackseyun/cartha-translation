base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/003.yaml
  text: So I sent messengers to them[a], saying, “I am doing a great work, and I cannot come down. Why should the work stop while I leave it and come down to you?”
translation:
  language: tl
  text: 'Kaya nagpadala ako sa kanila ng mga mensahero na may mensaheng ito: “May ginagawa akong dakilang gawain at hindi ako makababa. Bakit hihinto ang gawain habang[a] iniiwan ko ito at bumababa sa inyo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Bakit hihinto ang gawain kapag iniwan ko ito at bumaba sa inyo?”
    reason: Ipinapakita ang posibleng pag-unawa sa כַּאֲשֶׁר bilang “kapag” sa halip na “habang,” alinsunod sa English POB audit trail.
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: Kaya nagpadala ako
  rationale: Ang wayyiqtol ng שׁלח ay nagsasaad ng kasunod na kilos sa salaysay; natural na ipinahihiwatig ng “Kaya” ang pag-usad at kaugnayan nito sa naunang pangyayari.
- source_word: עֲלֵיהֶם
  choice: sa kanila
  rationale: Kasama ng pandiwang שׁלח at ng “mga mensahero,” ang עַל ay tumutukoy sa patutunguhan, hindi sa pagkilos laban sa kanila.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Sa kontekstong pampolitika at pasalaysay, mga taong naghahatid ng mensahe ang tinutukoy, hindi mga anghel.
- source_word: לֵאמֹר
  choice: upang sabihin
  rationale: Ipinakikilala nito ang nilalaman ng mensaheng ipinadala at natural ito sa modernong Filipino.
- source_word: מְלָאכָה גְדוֹלָה
  choice: isang dakilang gawain
  rationale: Pinananatili ng “gawain” ang malawak na kahulugan ng מְלָאכָה, at ng “dakila” ang diin ng גְדוֹלָה sa laki o kahalagahan ng proyekto nang hindi ito nililimitahan sa isa lamang sa dalawang diwa.
- source_word: אֲנִי עֹשֶׂה
  choice: ang ginagawa ko
  rationale: Ang panghalip kasama ng participle ay nagpapahayag ng nagpapatuloy na gawain; malinaw ito sa ayos na “ang ginagawa ko.”
- source_word: וְלֹא אוּכַל לָרֶדֶת
  choice: kaya hindi ako makababa
  rationale: Literal na pinananatili ng “makababa” ang direksiyong ירד mula sa mataas na lokasyon ng Jerusalem. Ang “kaya” ay natural na naghahayag ng praktikal na bunga ng kanyang pagiging abala.
- source_word: לָמָּה תִשְׁבַּת הַמְּלָאכָה
  choice: Bakit titigil ang gawain
  rationale: Ang שׁבת dito ay “tumigil” o “huminto,” hindi tumutukoy sa pangingilin ng Sabbath; ang tanong ay retorikal.
- source_word: כַּאֲשֶׁר אַרְפֶּהָ
  choice: kung iiwan ko ito
  rationale: Ang רפה sa Hiphil ay may diwang bitawan, pabayaan, o itigil ang pag-asikaso; ang hulaping pambabae ay tumutukoy sa מְלָאכָה. Ang temporal o kondisyunal na ugnayan ng כַּאֲשֶׁר ay natural na naipapahayag dito ng “kung.”
- source_word: וְיָרַדְתִּי אֲלֵיכֶם
  choice: upang bumaba riyan sa inyo
  rationale: Pinananatili ng “bumaba” ang heograpikong direksiyon mula sa Jerusalem, at ng “riyan sa inyo” ang pananaw ng nagsasalita patungo sa kinaroroonan ng mga kausap.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “dakilang gawain” upang mapanatili ang lakas at saklaw ng Hebreong parirala, samantalang ang “mensahero” ay malinaw na tumutukoy sa mga taong sugo. Walang talababa sapagkat walang alternatibong pagbasa na kailangang ilahad para sa talatang ito; ang ibinigay na English footnote ay lumilitaw na hindi tugma ang marker sa nilalaman nito.
