  naturalness: Nauunawaan ang draft, ngunit mas natural at mas tuwiran sa modernong Filipino ang “Dahil dito siya inupahan” kaysa “Inupahan siya para sa layuning ito.” Mas maayos din ang karaniwang ayos na “upang hamakin nila ako.”
  terminology: Ang “inupahan,” “magkasala,” “maipaninira,” at “hamakin” ay angkop sa marangal ngunit modernong rehistro. Pinananatili ang “inupahan” sa pangunahing teksto at ang “sinuhulan” bilang alternatibo lamang sa talababa.
