base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/013.yaml
  text: 'He was hired for this purpose: that I should become afraid and act that way and sin[a], so that they would have grounds for an evil report[b], in order that they might reproach me.'
translation:
  language: tl
  text: 'Dahil dito siya inupahan: upang matakot ako at gawin ko iyon, at sa gayon ay magkasala ako[a]. Magkakaroon sila noon ng maipaninira laban sa akin[b], upang hamakin nila ako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “inupahan siya” bilang “binayaran siya” o “sinuhulan siya.” Ang salitang Hebreo ay tuwirang nangangahulugang “inupahan” o “binayaran”; mas tahasang ipinakikita ng “sinuhulan” ang masamang layunin.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at iyon ay magiging sa kanila bilang masamang pangalan.” Malamang na ang ibig sabihin ay magkakaroon ang mga kaaway ni Nehemias ng maipaninira laban sa kanya, o ng batayan upang bigyan siya ng masamang reputasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שָׂכוּר הוּא
  choice: Inupahan siya para sa layuning ito
  rationale: Pinananatili ang payak na diwa ng passive participle na שָׂכוּר bilang ‘inupahan’ at ang diin ng tahasang panghalip na הוּא, habang malinaw na ipinakikita ng parirala ang layunin ng pag-upa.
- source_word: לְמַעַן אִירָא
  choice: upang matakot ako
  rationale: 'Ipinahahayag ng imperfect kasunod ng לְמַעַן ang nilalayong bunga: ang takutin si Nehemias hanggang siya ay kumilos ayon sa balak ng mga kaaway.'
- source_word: וְאֶעֱשֶׂה כֵּן וְחָטָאתִי
  choice: gawin iyon, at magkasala
  rationale: Ang כֵּן ay tumutukoy sa iminungkahing kilos sa naunang konteksto. Ang magkakasunod na pandiwa ay inilalahad bilang nilalayong kilos at bunga nang hindi dinaragdagan ang teksto.
- source_word: וְהָיָה לָהֶם לְשֵׁם רָע
  choice: magkakaroon sila ng maipaninira sa akin
  rationale: Ang literal na ‘magiging sa kanila bilang masamang pangalan’ ay isang idyomatikong pahayag. Sa konteksto, ang kasalanan ni Nehemias ang magiging materyal o batayan ng mga kaaway upang sirain ang kanyang reputasyon. Isinama ang ‘sa akin’ upang maging malinaw sa Tagalog ang implicit na tudlaan.
- source_word: יְחָרְפוּנִי
  choice: upang ako'y hamakin nila
  rationale: Ang חרף ay maaaring mangahulugang manlibak, dumusta, o humamak. Ang ‘hamakin’ ay dignified at natural, at angkop sa pampublikong paglapastangan sa reputasyon.
