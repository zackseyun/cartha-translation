translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘inupahan’ sa halip na ang mas interpretatibong ‘sinuhulan,’ at ang idyomatikong parirala tungkol sa ‘masamang pangalan’ ay isinaling ayon sa gamit nito sa konteksto, na may literal na anyo sa talababa.
