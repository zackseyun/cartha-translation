  text: They sent to me four times in this way[a], and I answered them in the same way.
translation:
  language: tl
  text: Apat na beses silang nagpadala sa akin ng gayong mensahe,[a] at gayon din ang isinagot ko sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ayon sa salitang ito” sa dalawang sugnay; tumutukoy ang parirala sa magkaparehong ipinadalang mensahe at sa magkaparehong tugon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אֵלַי
  choice: nagpadala sa akin
  rationale: Tuwirang ipinapahayag ng שלח ang pagpapadala, samantalang nananatiling di-binanggit ang ipinadalang tao o bagay gaya sa Hebreo.
- source_word: כַּדָּבָר הַזֶּה
  choice: ng gayong mensahe
  rationale: Ang דָּבָר ay maaaring tumukoy sa salita, bagay, o mensahe; sa konteksto ng paulit-ulit na pakikipag-ugnayan, natural na tumutukoy ito sa mensaheng nauna nang ipinadala.
- source_word: אַרְבַּע פְּעָמִים
  choice: Apat na beses
  rationale: Karaniwang katumbas sa Tagalog ng idyomang tumutukoy sa apat na magkakahiwalay na pag-uulit.
- source_word: וָאָשִׁיב אוֹתָם
  choice: isinagot ko sa kanila
  rationale: Sa konteksto ng pakikipagpalitan ng mensahe, ang Hiphil ng שוב ay nangangahulugang magbalik ng sagot; natural sa Tagalog ang 'isinagot ko sa kanila.'
- source_word: כַּדָּבָר הַזֶּה
  choice: gayon din
  rationale: Pinananatili ang pag-uulit ng parehong pariralang Hebreo at ipinahihiwatig na pareho rin ang tugon ni Nehemias sa bawat pagkakataon, nang hindi ginagawang mabigat ang pangungusap.
