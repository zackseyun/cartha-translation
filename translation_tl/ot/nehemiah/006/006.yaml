  text: כָּת֣וּב בָּ֗/הּ בַּ/גּוֹיִ֤ם נִשְׁמָע֙ וְ/גַשְׁמ֣וּ אֹמֵ֔ר אַתָּ֤ה וְ/הַ/יְּהוּדִים֙ חֹשְׁבִ֣ים לִ/מְר֔וֹד עַל כֵּ֛ן אַתָּ֥ה בוֹנֶ֖ה הַ/חוֹמָ֑ה וְ/אַתָּ֗ה הֹוֶ֤ה לָ/הֶם֙ לְ/מֶ֔לֶךְ כַּ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/006.yaml
  text: It was written in it[a], “It is being reported among the nations—and Geshem also says it—that you and the Jews are planning to rebel. Therefore you are rebuilding the wall, and according to these reports you are to become their king.”
translation:
  language: tl
  text: Nakasulat doon, “Kumakalat sa mga bansa ang balita—at sinasabi rin ito ni Gashmu[a]—na ikaw at ang mga Judio ay nagbabalak maghimagsik. Kaya muli mong itinatayo ang pader, at ayon sa mga balitang ito, magiging hari ka nila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Gashmu”; sa maraming salin, ang pangalang ito ay “Geshem.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּתוּב בָּהּ
  choice: Nakasulat doon
  rationale: Ipinakikilala ng pasibong participle ang nilalaman ng liham. Ang “doon” ay natural na tumutukoy sa liham na binanggit sa naunang konteksto.
- source_word: בַּגּוֹיִם נִשְׁמָע
  choice: Kumakalat sa mga bansa ang balita
  rationale: Ipinahihiwatig ng Niphal ng שׁמע na ang balita ay naririnig o naiuulat. Natural sa Tagalog ang “kumakalat ang balita” at malinaw na tsismis o ulat ang umiikot sa iba't ibang bayan.
- source_word: וְגַשְׁמוּ אֹמֵר
  choice: at sinasabi rin ito ni Gashmu
  rationale: Ipinakikita ng “rin” na idinadagdag si Gashmu bilang nagpapatibay sa kumakalat na ulat; nililinaw ng “ito” ang tinutukoy ng kaniyang sinasabi.
- source_word: חֹשְׁבִים לִמְרוֹד
  choice: nagbabalak maghimagsik
  rationale: Ang חשב na may infinitive ay nagpapahayag dito ng binabalak o nilalayong gawin. Hindi pinatindi ang paratang sa pamamagitan ng salitang gaya ng “nakikipagsabwatan.”
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Maikli at natural na ipinahahayag ang ibinibintang na kaugnayan ng paghihimagsik sa pagtatayo ng pader.
- source_word: בּוֹנֶה הַחוֹמָה
  choice: muli mong itinatayo ang pader
  rationale: Bagaman pangunahing nangangahulugang “itinatayo,” ipinakikita ng konteksto ng Nehemias na dating pader ang ibinabangon o itinatayong muli.
- source_word: וְאַתָּה הֹוֶה לָהֶם לְמֶלֶךְ
  choice: magiging hari ka nila
  rationale: Ang הוה na may לְ ay maaaring tumukoy sa pagiging o pagkakaroon ng isang katayuan. Ang hinaharap na anyo ay angkop sa paratang tungkol sa diumano'y layunin o bunga ng gawain, nang hindi idinaragdag na tiyak itong mangyayari.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ayon sa mga balitang ito
  rationale: Bagaman literal na “ayon sa mga salitang/bagay na ito,” ang דברים ay tumutukoy sa mga paratang na kumakalat; malinaw at angkop sa konteksto ang “mga balitang ito.”
