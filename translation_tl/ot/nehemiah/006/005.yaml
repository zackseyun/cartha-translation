  rationale: Nilinaw ang pagtukoy sa lingkod at pinasimple ang idyomatikong Tagalog nang hindi binabago ang pagkakasunod, pag-uulit, o konkretong detalye na ang liham ay hawak ng sugo. Ang “bukás na liham” ay pinanatili, kasama ang alternatibong “hindi selyado.”
