  text: Then Sanballat sent his servant to me a fifth time in this manner[a], with an open letter in his hand.
translation:
  language: tl
  text: Pagkatapos, sa ikalimang pagkakataon, isinugo ni Sanbalat sa akin ang kanyang lingkod sa gayon ding paraan, at may hawak siyang bukás na liham.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “liham na hindi selyado.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Pagkatapos, ... isinugo
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: אֵלַי
  choice: sa akin
  rationale: Ipinahihiwatig ng אֶל na ang nagsasalita ang pinadalhan ng sugo.
- source_word: סַנְבַלַּט
  choice: Sanbalat
  rationale: Isinalin sa karaniwang anyong Tagalog ang pangalang pantangi.
- source_word: כַּדָּבָר הַזֶּה
  choice: sa gayunding paraan
  rationale: Tumutukoy ang idyoma sa paraang paulit-ulit na ginawa sa naunang konteksto; pinananatili ng “gayunding paraan” ang anaporikong diwa.
- source_word: פַּעַם חֲמִישִׁית
  choice: sa ikalimang pagkakataon
  rationale: Malinaw at natural na ipinahahayag nito ang bilang ng pag-uulit.
- source_word: אֶת נַעֲרוֹ
  choice: ang kanyang lingkod
  rationale: Bagaman maaaring mangahulugang “binata” ang נַעַר, sa konteksto ng paghahatid ng mensahe ay tungkulin bilang lingkod o utusan ang nangingibabaw.
- source_word: וְאִגֶּרֶת פְּתוּחָה
  choice: bukás na liham
  rationale: Pinananatili ang literal na kahulugang “bukas,” na sa konteksto ay maaaring mangahulugang hindi selyado at mababasa ng iba.
- source_word: בְּיָדוֹ
  choice: May hawak itong
  rationale: Natural na Tagalog ito para sa konkretong larawang nasa kamay ng lingkod ang liham; malinaw na ang panghalip ay tumutukoy sa lingkod.
