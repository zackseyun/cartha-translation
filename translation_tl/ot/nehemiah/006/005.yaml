  source_fidelity: 'Tumpak ang pangunahing diwa: si Sanbalat ay muling nagsugo ng kanyang lingkod kay Nehemias, sa kaparehong paraan, sa ikalimang pagkakataon, na may dalang bukás na liham. Gayunman, ang panghalip na “itong” sa ikalawang pangungusap ay maaaring pansamantalang malabo; mas malinaw na panatilihin sa iisang pangungusap ang lingkod bilang tinutukoy ng panghalip.'
