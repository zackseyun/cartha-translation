id: NEH.6.11
reference: Nehemiah 6:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וָ/אֹמְרָ֗/ה הַ/אִ֤ישׁ כָּמ֨וֹ/נִי֙ יִבְרָ֔ח וּ/מִ֥י כָמ֛וֹ/נִי אֲשֶׁר יָב֥וֹא אֶל הַ/הֵיכָ֖ל וָ/חָ֑י לֹ֖א אָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/011.yaml
  text: But I said[a], “Should a man like me flee? And who is like me, who could go into the temple and live? I will not go in.”
translation:
  language: tl
  text: Ngunit sinabi ko, “Dapat bang tumakas ang isang lalaking tulad ko? At sinong tulad ko ang makapapasok sa templo[a] at mabubuhay? Hindi ako papasok.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “santuwaryo.” Malamang na hindi lamang pagtatago sa loob ang tinutukoy, kundi ang pagpasok ni Nehemias sa isang bahagi ng templo na hindi niya nararapat pasukin. Ito ang maaaring nagpapaliwanag sa diin ng “at mabubuhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Ngunit sinabi ko
  rationale: Isinusulong ng waw-consecutive ang salaysay, at ang “ngunit” ay angkop sa konteksto dahil tinatanggihan ni Nehemias ang mungkahing ibinigay sa kaniya.
- source_word: הָאִישׁ כָּמוֹנִי
  choice: isang lalaking tulad ko
  rationale: Ginagamit ang “lalaki” sa pangkalahatang diwa sa retorikal na tanong; pinananatili rin nito ang marangal na pagtukoy ni Nehemias sa kaniyang katayuan at pananagutan.
- source_word: יִבְרָח
  choice: tumakas
  rationale: Ipinahihiwatig ng pandiwa ang pagtakas dahil sa takot o panganib; malinaw at natural ang “tumakas” sa makabagong Tagalog.
- source_word: וּמִי כָמוֹנִי אֲשֶׁר יָבוֹא
  choice: At sinong tulad ko ang makapapasok
  rationale: Pinananatili ang retorikal at bahagyang eliptikong anyo ng Hebreo nang hindi ginagawang payak na pahayag tungkol sa hinaharap.
- source_word: הַהֵיכָל
  choice: templo
  rationale: Tumutukoy ito sa gusali o banal na bahagi ng templo. “Templo” ang pinakamalinaw na pangunahing salin, samantalang inilalahad sa talababa ang posibleng “santuwaryo” at ang pahiwatig na may limitadong lugar.
- source_word: וָחָי
  choice: at mabubuhay
  rationale: Malapit ito sa anyo ng Hebreo at pinananatili ang tensiyon kung ang ibig sabihin ay manatiling buhay sa pagtatago o makaligtas sa ipinagbabawal na pagpasok.
- source_word: לֹא אָבוֹא
  choice: Hindi ako papasok
  rationale: Likas na inuulit sa Tagalog ang diwa ng pagpasok na nasa naunang sugnay at mariing ipinapahayag ang pagtanggi ni Nehemias.
theological_decisions:
- issue: Pahiwatig ng pagpasok sa templo
  choice: Ipinapakita ng salin na tinatanggihan ni Nehemias ang pagpasok sa templo, habang hindi tahasang dinaragdagan ang talata ng paliwanag kung bakit ito magiging mali para sa kaniya.
  alternative: Unawain lamang ito bilang pagtanggi niyang magtago sa loob, nang walang pahiwatig na labag sa mga tuntunin ng templo ang pagpasok.
  rationale: Ipinakikita ng konteksto ng Nehemias 6:10–13 na ang mungkahi ay isang bitag upang magkasala at mapahiya siya. Pinananatiling malawak ng “templo” ang pangunahing teksto, at inilalagay sa talababa ang malamang na kahulugang may kinalaman sa ipinagbabawal o di-wastong pagpasok.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkahanay na mga retorikal na tanong at ang mariing pangwakas na pagtanggi, habang iniwasang lutasin sa pangunahing teksto ang tunay na kalabuan ng “at mabubuhay.”
