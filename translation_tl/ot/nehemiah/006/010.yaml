revisions:
- from: Pagkatapos, pumunta ako sa bahay ni Semaias na anak ni Delaias, na anak ni Mehetabel. Nakakulong siya roon, at sinabi niya, “Magtagpo tayo sa bahay ng Diyos, sa loob ng templo[a], at isara natin ang mga pinto ng templo, sapagkat may mga taong paparito upang patayin ka—oo, sa gabi sila paparito upang patayin ka.”
  to: Pagkatapos, pumunta ako sa bahay ni Semaias na anak ni Delaias, na anak ni Mehetabel, na nakabukod. Sinabi niya, “Magtagpo tayo sa bahay ng Diyos, sa loob ng templo[a], at isara natin ang mga pinto ng templo, sapagkat may mga taong darating upang patayin ka—oo, sa gabi sila darating upang patayin ka.”
  rationale: Inalis ang dagdag na “roon” at pinalitan ang mas tiyak na “nakakulong” ng neutral na “nakabukod” upang mapanatili ang kalabuan ng עָצוּר. Pinalitan din ang “paparito” ng “darating” upang iwasan ang di-ipinahihiwatig na direksiyong deiktiko. Hindi binago ang kahulugan, pag-uulit, rehistro, mga pangalan, o footnote anchor.
