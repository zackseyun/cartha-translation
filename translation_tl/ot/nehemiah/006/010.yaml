source:
  edition: WLC
  text: וַ/אֲנִי בָ֗אתִי בֵּ֣ית שְֽׁמַֽעְיָ֧ה בֶן דְּלָיָ֛ה בֶּן מְהֵֽיטַבְאֵ֖ל וְ/ה֣וּא עָצ֑וּר וַ/יֹּ֡אמֶר נִוָּעֵד֩ אֶל בֵּ֨ית הָ/אֱלֹהִ֜ים אֶל תּ֣וֹךְ הַֽ/הֵיכָ֗ל וְ/נִסְגְּרָה֙ דַּלְת֣וֹת הַ/הֵיכָ֔ל כִּ֚י בָּאִ֣ים לְ/הָרְגֶ֔/ךָ וְ/לַ֖יְלָה בָּאִ֥ים לְ/הָרְגֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/010.yaml
  text: Then I went to the house of Shemaiah son of Delaiah[a], son of Mehetabel, who was confined, and he said, “Let us meet at the house of God, inside the temple, and let us shut the doors of the temple, for they are coming to kill you—yes, at night they are coming to kill you.”
translation:
  language: tl
  text: Pagkatapos, pumunta ako sa bahay ni Semaias na anak ni Delaias, na anak ni Mehetabel, na nakabukod. Sinabi niya, “Magtagpo tayo sa bahay ng Diyos, sa loob ng templo[a], at isara natin ang mga pinto ng templo, sapagkat may mga taong darating upang patayin ka—oo, sa gabi sila darating upang patayin ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “santuwaryo.” Ang salitang Hebreo na heikhal ay maaaring tumukoy sa mismong gusali ng templo o sa santuwaryo, hindi lamang sa mas malawak na bakuran ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי בָאתִי
  choice: Pagkatapos, pumunta ako
  rationale: Ipinahahayag ang pagpapatuloy ng salaysay at ang bahagyang pagdidiin sa nagsasalita, habang likas sa Filipino ang pananaw na ‘pumunta’ sa bahay ng iba.
- source_word: בֵּית שְׁמַעְיָה
  choice: bahay ni Semaias
  rationale: Ang construct form ay tumutukoy sa tirahan ni Semaias; mas natural sa modernong Filipino ang ‘bahay ni’ kaysa literal na ‘bahay ng.’
- source_word: שְׁמַעְיָה ... דְּלָיָה ... מְהֵיטַבְאֵל
  choice: Semaias na anak ni Delaias, na anak ni Mehetabel
  rationale: Ginamit ang kinaugaliang anyong Filipino ng mga pangalang biblikal at pinanatili ang dalawang sunod na ugnayang pampamilya ng Hebreo.
- source_word: וְהוּא עָצוּר
  choice: Nakakulong siya roon
  rationale: Pinananatili ng ‘nakakulong’ ang di-tiyak na kalagayan ng pagiging nakakulong, nakakupkop, o hindi makalabas, nang hindi ipinapasiya kung ito ay detensiyon, kusang pag-iisa, o rituwal na pagkakabukod.
- source_word: נִוָּעֵד
  choice: Magtagpo tayo
  rationale: Likas na panukala sa Filipino at naipahahayag ang hortatory/cohortative na diwa ng pandiwa.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pinananatili ang karaniwang katawagan sa Hebreo para sa kabuuang kompleks ng templo.
- source_word: אֶל תּוֹךְ הַהֵיכָל
  choice: sa loob ng templo
  rationale: Malinaw na ipinahihiwatig ang pagpasok sa mismong gusaling sagrado, ngunit hindi labis na tinutukoy ang eksaktong sonang kultiko.
- source_word: וְנִסְגְּרָה דַּלְתוֹת הַהֵיכָל
  choice: at isara natin ang mga pinto ng templo
  rationale: Pinananatili ang pagpapatuloy ng panukala at ang kongkretong larawan ng pagsasara ng mga pinto.
- source_word: כִּי בָּאִים לְהָרְגֶךָ
  choice: sapagkat may mga taong paparito upang patayin ka
  rationale: Ang ‘may mga taong’ ay likas na paraan upang katawanin ang di-tiyak na maramihang simuno; ang ‘paparito’ ay naghahatid ng nalalapit na pagdating at layunin.
- source_word: וְלַיְלָה ... בָּאִים לְהָרְגֶךָ
  choice: oo, sa gabi sila paparito upang patayin ka
  rationale: Pinananatili ang pag-uulit para sa diin at pangamba, pati ang tahasang panahong ‘sa gabi,’ nang hindi ito ginagawang mas tiyak na ‘ngayong gabi.’
theological_decisions:
- issue: Kahulugan ng הֵיכָל sa konteksto ng banal na lugar na may limitadong pagpasok
  choice: templo
  alternative: santuwaryo
  rationale: Maaaring tukuyin ng salita ang mismong gusali o santuwaryo, at ipinahihiwatig ng kasunod na talata na bawal kay Nehemias ang gayong pagpasok. Ginamit sa pangunahing teksto ang mas madaling maunawaang ‘templo,’ habang pinananatili sa talababa ang mas tiyak at mahalagang alternatibong ‘santuwaryo.’
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang agarang banta at ang retorikal na pag-uulit ng Hebreo. Ang ‘Nakakulong’ ay sadyang hindi nagpapasiya kung bakit hindi makalabas si Semaias.
