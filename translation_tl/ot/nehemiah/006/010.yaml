  naturalness: Marangal at malinaw ang Filipino. Mas natural at mas neutral ang “na nakabukod” kaysa sa hiwalay na pangungusap na “Nakakulong siya roon.” Ang “darating” ay mas walang deiktikong dagdag kaysa “paparito.”
  terminology: Ang “bahay ng Diyos,” “templo,” at talababa para sa “santuwaryo” ay angkop. Pinananatili ang mga pangalan at ang alternatibong leksikal ng הֵיכָל.
