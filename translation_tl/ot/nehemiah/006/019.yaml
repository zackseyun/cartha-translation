  source_fidelity: 'Tumpak ang salin sa daloy ng Hebreo: ang גַּם ay additive, ang טוֹבֹתָיו ay wastong naipahayag bilang mga kapuri-puring katangian nang hindi ikinakahon sa gawa lamang, at kapwa napanatili ang nagpapatuloy/paulit-ulit na aspekto ng הָיוּ na may participle. Wasto rin ang pagpapakahulugan sa pag-uulat ng mga salita ni Nehemias kay Tobia at sa layuning takutin siya sa pamamagitan ng mga liham.'
  naturalness: Likas, malinaw, at angkop sa makabagong Filipino Tagalog ang pangungusap. Ang “Bukod dito,” “sa harap ko,” “ibinabalita sa kanya,” at “upang takutin ako” ay marangal ngunit hindi lipas na gamit.
  terminology: Pare-pareho ang pangalan na “Tobia,” at ang “mga liham” ay angkop para sa אִגְּרוֹת. Ang “mabubuting katangian” ay isang ligtas na pangunahing salin para sa malawak na טוֹבֹתָיו; maayos na inilalahad ng talababa ang iba pang posibleng saklaw.
