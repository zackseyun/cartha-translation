id: NEH.6.19
reference: Nehemiah 6:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: גַּ֣ם טוֹבֹתָ֗י/ו הָי֤וּ אֹמְרִים֙ לְ/פָנַ֔/י וּ/דְבָרַ֕/י הָי֥וּ מוֹצִיאִ֖ים ל֑/וֹ אִגְּר֛וֹת שָׁלַ֥ח טוֹבִיָּ֖ה לְ/יָֽרְאֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/019.yaml
  text: Also they kept speaking of his good deeds in my presence[a], and they kept reporting my words to him[b]. Tobiah sent letters to frighten me.
translation:
  language: tl
  text: Bukod dito, patuloy nilang pinupuri sa harap ko ang mabubuting katangian ni Tobia[a], at patuloy naman nilang ibinabalita sa kanya ang mga sinabi ko[b]. Nagpadala si Tobia ng mga liham upang takutin ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mabubuting gawa niya” o “ang mabubuting bagay tungkol sa kanya.” Mas malawak ang pariralang Hebreo kaysa sa mga gawa lamang; dito, tumutukoy ito sa paborableng pagpuri kay Tobia sa harap ni Nehemias.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “inilalabas nila sa kanya ang mga salita ko,” isang idyoma para sa pagpaparating o pag-uulat kay Tobia ng mga sinabi ni Nehemias.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Bukod dito
  rationale: Ipinapakita ang karagdagang hakbang sa salaysay at likas pakinggan sa makabagong Filipino.
- source_word: טוֹבֹתָיו
  choice: ang mabubuting katangian ni Tobia
  rationale: Ang pangmaramihang anyo ng 'mabuti' ay malawak at maaaring tumukoy sa mabubuting gawa, katangian, o mga bagay na kapuri-puri tungkol kay Tobia; hindi ito nilimitahan sa mga gawa lamang.
- source_word: הָיוּ אֹמְרִים
  choice: patuloy nilang pinupuri
  rationale: Ang היה na may participle ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na kilos; sa konteksto, ang pagsasalita tungkol sa 'mabubuting katangian' ay papuri o paborableng pagtatanghal.
- source_word: לְפָנַי
  choice: sa harap ko
  rationale: Tuwirang katumbas ng literal na 'sa harap ko' at natural sa Filipino para sa pagsasalitang ginawa sa presensiya ni Nehemias.
- source_word: וּדְבָרַי
  choice: ang mga sinabi ko
  rationale: Bagaman literal na 'mga salita ko,' malinaw sa konteksto na ang tinutukoy ay mga sinabi ni Nehemias na ipinasa kay Tobia.
- source_word: הָיוּ מוֹצִיאִים לוֹ
  choice: patuloy naman nilang ibinabalita sa kanya
  rationale: Pinananatili ang nagpapatuloy o paulit-ulit na aspekto at inilalahad nang natural ang idyomang literal na 'inilalabas ... sa kanya,' ibig sabihin ay ipinaparating o iniuulat.
- source_word: אִגְּרוֹת
  choice: mga liham
  rationale: Karaniwan at marangal na katumbas sa Filipino para sa nakasulat na korespondensiya.
- source_word: שָׁלַח
  choice: Nagpadala
  rationale: Payak at natural na salin ng pandiwang nagsasaad na ipinadala ni Tobia ang mga liham.
- source_word: לְיָרְאֵנִי
  choice: upang takutin ako
  rationale: 'Malinaw na ipinahahayag ang layunin ng pagpapadala ng mga liham: magdulot ng takot kay Nehemias.'
