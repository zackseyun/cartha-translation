  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר נִשְׁמַ֣ע לְ/סַנְבַלַּ֣ט וְ֠/טוֹבִיָּה וּ/לְ/גֶ֨שֶׁם הָֽ/עַרְבִ֜י וּ/לְ/יֶ֣תֶר אֹֽיְבֵ֗י/נוּ כִּ֤י בָנִ֨יתִי֙ אֶת הַ֣/חוֹמָ֔ה וְ/לֹא נ֥וֹתַר בָּ֖/הּ פָּ֑רֶץ גַּ֚ם עַד הָ/עֵ֣ת הַ/הִ֔יא דְּלָת֖וֹת לֹא הֶעֱמַ֥דְתִּי בַ/שְּׁעָרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/001.yaml
  text: When Sanballat[a], Tobiah, Geshem the Arab[b], and the rest of our enemies heard that I had rebuilt the wall and that no breach was left in it—though up to that time I had not set up the doors in the gates—
translation:
  language: tl
  text: Nang mabalitaan nina Sanbalat, Tobias, Gesem na Arabe[b], at ng iba pa naming mga kaaway na muli kong itinayo ang pader[a] at wala nang natitirang puwang dito—bagaman hanggang sa panahong iyon ay hindi ko pa nailalagay ang mga pinto sa mga tarangkahan—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinayo ko ang pader.” Payak na “itinayo” ang pandiwang Hebreo; ginamit dito ang “muling itinayo” dahil ang konteksto ay ang pagpapanumbalik ng dati nang pader.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Gesem na taga-Arabia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר נִשְׁמַע
  choice: Nang mabalitaan
  rationale: Likas na salaysay sa Tagalog ito para sa Hebreong panimulang sugnay at Niphal na pandiwa; malinaw nitong ginagawang tagatanggap ng balita ang mga kasunod na pangalan nang hindi nagdaragdag ng tahasang salitang ‘ngayon.’
- source_word: סַנְבַלַּט ... טוֹבִיָּה ... גֶשֶׁם הָעַרְבִי
  choice: Sanbalat, Tobias, Gesem na Arabe
  rationale: Isinalin sa nakikilalang anyong Tagalog ang mga pangalan; ang הָעַרְבִי ay tuwirang katawagang etniko, kaya ‘na Arabe.’
- source_word: יֶתֶר אֹיְבֵינוּ
  choice: ang iba pa naming mga kaaway
  rationale: Natural na katumbas ng ‘nalalabi’ o ‘iba pa’ sa pangkat ng mga kaaway, habang pinananatili ang unang panauhang maramihan.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng kanilang nabalitaan, hindi ang sanhi.
- source_word: בָנִיתִי אֶת־הַחוֹמָה
  choice: muli kong itinayo ang pader
  rationale: Bagaman payak na ‘itinayo’ ang pandiwang Hebreo, ipinahihiwatig ng konteksto ang pagpapanumbalik sa dati nang pader; pinananatili sa talababa ang literal na alternatibo.
- source_word: לֹא נוֹתַר בָּהּ פָּרֶץ
  choice: wala nang natitirang siwang dito
  rationale: Ang פָּרֶץ ay puwang o sirang bukas na bahagi ng pader. Ang ‘siwang’ ay malinaw at natural sa konteksto ng pagkukumpuni.
- source_word: גַּם עַד הָעֵת הַהִיא
  choice: bagaman hanggang panahong iyon
  rationale: 'Concessive ang tungkulin ng parirala: nililimitahan nito ang naunang pahayag sa pamamagitan ng pagbanggit na hindi pa nakakabit ang mga pinto.'
- source_word: דְּלָתוֹת לֹא הֶעֱמַדְתִּי בַשְּׁעָרִים
  choice: hindi ko pa nailalagay ang mga pinto sa mga tarangkahan
  rationale: Pinananatili ang pagkakaiba ng mga pinto (דְּלָתוֹת) at ng mga tarangkahang kinalalagyan ng mga ito (שְׁעָרִים). Ang ‘nailalagay’ ay hindi labis na nagtatakda kung paano ikinabit ang mga iyon.
