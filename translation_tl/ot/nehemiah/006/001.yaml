  source_fidelity: 'Tumpak na naihahatid ang pagkakasunod at nilalaman ng Hebreo: ang mga kaaway ay nakabalita, ang pader ay itinayo muli sa konteksto, wala nang natitirang butas o puwang, at hindi pa nailalagay ang mga pinto sa mga tarangkahan. Gayunman, ang “siwang” ay karaniwang tumutukoy sa makitid na lamat o pagitan at maaaring paliitin ang פָּרֶץ, na isang puwang o butas sa pader.'
  naturalness: Likas at marangal ang kabuuang salaysay. Mas natural ang “hanggang sa panahong iyon,” at mas angkop ang “puwang” kaysa “siwang” para sa nasirang bukas na bahagi ng pader.
  terminology: Ang “pader,” “mga pinto,” at “mga tarangkahan” ay wastong pinananatiling magkakaiba. Katanggap-tanggap at nakikilala sa Filipino ang Sanbalat, Tobias, at Gesem; tuwiran din ang “na Arabe.”
