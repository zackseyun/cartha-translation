revisions:
- from: Nang mabalitaan nina Sanbalat, Tobias, Gesem na Arabe[b], at ng iba pa naming mga kaaway na muli kong itinayo ang pader[a] at wala nang natitirang siwang dito—bagaman hanggang panahong iyon ay hindi ko pa nailalagay ang mga pinto sa mga tarangkahan—
  to: Nang mabalitaan nina Sanbalat, Tobias, Gesem na Arabe[b], at ng iba pa naming mga kaaway na muli kong itinayo ang pader[a] at wala nang natitirang puwang dito—bagaman hanggang sa panahong iyon ay hindi ko pa nailalagay ang mga pinto sa mga tarangkahan—
  rationale: Pinalitan ang “siwang” ng “puwang” upang masaklaw ang kahulugan ng פָּרֶץ bilang natitirang butas o puwang sa pader. Idinagdag ang “sa” sa idyomatikong pariralang “hanggang sa panahong iyon.” Hindi binago ang kahulugan, mga pangalan, mga talababa, o ang sinadyang nakabiting sintaks na nagpapatuloy sa susunod na talata.
