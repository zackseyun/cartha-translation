  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong di-tapos ng pangungusap sa dulo dahil nagpapatuloy ang sugnay sa kasunod na talata. Inilagay ang talababa [a] sa pariralang aktuwal nitong nililinaw.
