base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/005.yaml
  text: Ezra opened the book in the sight of all the people[a], for he was above all the people; and when he opened it, all the people stood.
translation:
  language: tl
  text: Binuksan ni Ezra ang aklat sa harap ng buong bayan[a], sapagkat mas mataas ang kaniyang kinaroroonan kaysa sa buong bayan. Nang buksan niya ito, tumayo ang buong bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “balumbon.” Ang Hebreong סֵפֶר ay maaaring tumukoy sa isang nakasulat na dokumentong nasa anyong balumbon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: Binuksan
  rationale: Tuwirang ipinapahayag ng פתח ang pagbubukas. Hindi ginamit ang mas tiyak na “iniladlad” upang hindi ipasok sa pangunahing teksto ang pisikal na anyo ng dokumento.
- source_word: הַסֵּפֶר
  choice: ang aklat
  rationale: Ang סֵפֶר ay maaaring tumukoy sa aklat, kasulatan, o balumbon. Natural at tradisyonal sa Filipino ang “aklat,” habang inilalagay sa talababa ang posibleng “balumbon.”
- source_word: לְעֵינֵי כָל הָעָם
  choice: sa harap ng buong bayan
  rationale: Ang literal na idyomang “sa mga mata ng” ay nangangahulugang hayag at nakikita ng lahat. Ang “sa harap ng” ay natural sa Filipino at pinananatili ang pampublikong aspekto.
- source_word: כִּי מֵעַל כָּל הָעָם הָיָה
  choice: sapagkat nakatayo siya sa lugar na mas mataas kaysa sa kanila
  rationale: Pisikal na kinalalagyan ang tinutukoy ng מֵעַל, hindi ranggo o pagiging nakahihigit. Nilinaw ng “sa lugar” ang kahulugan nang hindi nagpapahiwatig ng panlipunang kataasan.
- source_word: וּכְפִתְחוֹ
  choice: Nang buksan niya iyon
  rationale: Ang כְּ ay temporal dito, “nang” o “habang.” Pinili ang “nang” bilang natural na pagsasalaysay, at ang “iyon” ay tumutukoy sa naunang aklat.
- source_word: עָמְדוּ כָל הָעָם
  choice: tumayo ang buong bayan
  rationale: Ang עמד ay tuwirang “tumayo” o “nakatayo.” Sa konteksto, ipinahihiwatig ng ayos ng pangyayari na tumayo sila nang buksan ang aklat, kaya natural ang aspektong Filipino na “tumayo.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong bayan” para sa paulit-ulit na כָל הָעָם at upang tukuyin ang nagkakatipong sambayanan. Iniwasan ang salitang maaaring magpahiwatig na nakahihigit sa katayuan si Ezra; pisikal na taas lamang ang tinutukoy.
