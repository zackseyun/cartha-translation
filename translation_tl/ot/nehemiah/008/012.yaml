base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/012.yaml
  text: And all the people went away to eat and drink[a], to send portions, and to celebrate with great joy[b], because they had understood the words that had been made known to them.
translation:
  language: tl
  text: At umalis ang buong bayan upang kumain at uminom, magpadala ng mga bahagi[a], at magdiwang nang may malaking kagalakan, sapagkat naunawaan nila ang mga salitang ipinaalam sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpadala ng mga bahagi ng pagkain”—samakatuwid, mga bahaging ipamamahagi sa iba bilang bahagi ng pagdiriwang.
    reason: lexical_alternative
  - marker: b
    text: O “mga bagay na ipinaliwanag sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: umalis
  rationale: Ipinahihiwatig ng pandiwa sa salaysay na iniwan ng bayan ang pagtitipon upang gawin ang mga kasunod na gawain.
- source_word: כָל הָעָם
  choice: ang buong bayan
  rationale: Natural na kolektibong tawag sa lahat ng taong naroon, habang pinananatili ang saklaw ng Hebreo.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: upang kumain at uminom
  rationale: Tuwirang isinasalin ang magkatuwang na mga pawatas na nagpapahayag ng layunin.
- source_word: וּלְשַׁלַּח מָנוֹת
  choice: magpadala ng mga bahagi ng pagkain
  rationale: Ang מָנוֹת ay tumutukoy sa mga takdang bahagi, malamang na pagkain sa konteksto ng pagdiriwang; nililinaw ito sa teksto nang hindi tinutukoy kung sino ang tatanggap.
- source_word: וְלַעֲשׂוֹת שִׂמְחָה גְדוֹלָה
  choice: magdiwang nang may malaking kagalakan
  rationale: Idyomatikong Filipino para sa literal na ‘gumawa ng malaking kagalakan,’ at pinananatili ang tindi ng גְדוֹלָה.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng kanilang pagdiriwang.
- source_word: הֵבִינוּ
  choice: naunawaan nila
  rationale: Isinasaad ang natamo nang pagkaunawa na naging dahilan ng kanilang tugon.
- source_word: בַּדְּבָרִים
  choice: ang mga salita
  rationale: Sa konteksto ng pagbasa at pagpapaliwanag ng Kautusan, ang ‘mga salita’ ang pangunahing diwa, bagaman maaari ring mangahulugang ‘mga bagay’ o ‘mga usapin.’
- source_word: אֲשֶׁר הוֹדִיעוּ לָהֶם
  choice: ipinaalam sa kanila
  rationale: Ang Hiphil ng ידע ay ‘ipaalam’ o ‘magbigay-kaalaman.’ Ang pasibong anyo sa Filipino ay nagpapanatili ng pokus sa mensaheng tinanggap at hindi nagdaragdag ng tahasang simuno.
theological_decisions:
- issue: Batayan ng kagalakan ng bayan sa pagtugon sa Kautusan
  choice: Ang kanilang malaking kagalakan ay tuwirang iniuugnay sa pagkaunawa nila sa mga salitang ipinaalam sa kanila.
  alternative: Ipaliwanag ang kagalakan bilang teknikal na pagpapanibago ng tipan o bilang pagsisising napalitan ng pagdiriwang.
  rationale: Pagkaunawa sa mga ipinaalam na salita lamang ang tahasang ibinibigay ng talata bilang dahilan; hindi dapat idagdag sa salin ang mas malawak na teolohikal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong bayan” bilang natural na kolektibong katawagan, at ang “magdiwang nang may malaking kagalakan” upang maipahayag nang idiomatiko ang Hebreong pariralang literal na tumutukoy sa paggawa ng malaking kagalakan.
