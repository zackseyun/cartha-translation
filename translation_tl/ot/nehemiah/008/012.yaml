- from: At umalis ang buong bayan upang kumain at uminom, magpadala ng mga bahagi ng pagkain[a], at magdiwang nang may malaking kagalakan, sapagkat naunawaan nila ang mga salitang[b] ipinaalam sa kanila.
  to: At umalis ang buong bayan upang kumain at uminom, magpadala ng mga bahagi[a], at magdiwang nang may malaking kagalakan, sapagkat naunawaan nila ang mga salitang ipinaalam sa kanila.[b]
  rationale: Inalis ang “ng pagkain” sa pangunahing salin upang hindi higit na tukuyin ang מָנוֹת kaysa sa Hebreo. Iningatan ang paglilinaw na ang mga bahagi ay pagkain sa talababa. Inilipat ang ikalawang panandang talababa sa dulo ng buong pariralang may alternatibong pagbasa at pinasimple ang alternatibo upang maging natural na Filipino.
