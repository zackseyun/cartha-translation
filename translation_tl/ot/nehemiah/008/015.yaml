base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/015.yaml
  text: and that they should proclaim and spread the message through all their cities and in Jerusalem[a], saying, “Go out to the hill country and bring branches of olive, oil tree, myrtle, palm, and other leafy trees, to make booths[b], as it is written.”
translation:
  language: tl
  text: 'at dapat nilang ipahayag at ipalaganap ang pahayag sa lahat ng kanilang mga lungsod at sa Jerusalem: “Pumunta kayo sa kabundukan at magdala ng madahong mga sanga[b] mula sa olibo, puno ng langis[a], mirto, palma, at iba pang punong may makakapal na dahon, upang gumawa ng mga kubol, gaya ng nasusulat.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ligaw na olibo” o “oleaster.” Hindi tiyak ang eksaktong uri ng halamang tinutukoy ng Hebreong עֵץ שֶׁמֶן, na literal na “puno ng langis.”
    reason: lexical_alternative
  - marker: b
    text: Literal sa Hebreo, “mga dahon ng olibo ... mga dahon ng mirto ...” Ginamit ang “madahong mga sanga” sapagkat ang mga ito ang tinitipong materyales para sa mga kubol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: at ... nila
  rationale: Ipinagpapatuloy nito ang nilalaman ng natuklasang nakasulat sa Kautusan sa naunang talata; pinananatili ng “at” ang ugnayan sa konteksto.
- source_word: יַשְׁמִיעוּ וְיַעֲבִירוּ קוֹל
  choice: ipahayag nila at ipalaganap ang balita
  rationale: Ang unang pandiwa ay may diwang ‘iparinig/ipahayag,’ at ang kasunod na idyoma ay tumutukoy sa pagpapalaganap ng isang pampublikong pabatid.
- source_word: בְּכָל עָרֵיהֶם וּבִירוּשָׁלַם
  choice: sa lahat ng kanilang lungsod at sa Jerusalem
  rationale: Tuwirang pinananatili ang saklaw ng lahat ng kanilang mga pamayanan at ang tahasang pagbanggit sa Jerusalem.
- source_word: צְאוּ הָהָר
  choice: Pumunta kayo sa kabundukan
  rationale: Ang הָהָר ay maaaring ‘bundok’ o ‘bulubunduking lupain’; ang “kabundukan” ay natural sa konteksto ng pangangalap ng mga sanga.
- source_word: עֲלֵי
  choice: madahong mga sanga
  rationale: Literal itong ‘mga dahon ng,’ ngunit ang tinutukoy ay materyales na kukunin mula sa mga puno upang gumawa ng mga kubol. Ang “madahong mga sanga” ay natural at hindi nawawala ang pagbanggit sa mga dahon.
- source_word: זַיִת
  choice: olibo
  rationale: Karaniwang modernong katawagan sa punong olive.
- source_word: עֵץ שֶׁמֶן
  choice: punong-langis
  rationale: Malapit ito sa literal na ‘oil tree’ at hindi nito tiyak na ipinapako ang hindi tiyak na uri ng halaman; inilalahad sa talababa ang mga posibleng pagkakakilanlan.
- source_word: הֲדַס
  choice: mirto
  rationale: Karaniwang katawagang Filipino para sa myrtle.
- source_word: תְמָרִים
  choice: palma
  rationale: Tumutukoy sa palm/date-palm sa listahan ng mga punong pagkukunan ng madahong sanga.
- source_word: עֵץ עָבֹת
  choice: iba pang punong makapal ang mga dahon
  rationale: Ipinahahayag nito ang diwa ng makapal o masinsing mga dahon, habang natural na binubuo ang listahan sa Filipino.
- source_word: לַעֲשׂוֹת סֻכּוֹת
  choice: upang gumawa ng mga kubol
  rationale: Ang סֻכּוֹת ay mga pansamantalang kubol na kaugnay ng kapistahan; malinaw at dignified ang “mga kubol” sa Filipino.
- source_word: כַּכָּתוּב
  choice: gaya ng nasusulat
  rationale: Pinananatili ang pormulang tumutukoy sa nakasulat na Kautusan.
