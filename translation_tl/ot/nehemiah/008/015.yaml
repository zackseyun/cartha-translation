translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “kabundukan,” “madahong mga sanga,” at “mga kubol” upang maging natural sa karaniwang mambabasa habang nananatiling malapit sa Hebreo. Inilagay ang mga marker sa mismong salitang ipinapaliwanag ng bawat talababa.
