base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/007.yaml
  text: And Jeshua[a], Bani, Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah, Kelita, Azariah, Jozabad, Hanan[b], Pelaiah, and the Levites explained the law to the people, while the people remained in their places.
translation:
  language: tl
  text: At sina Jesua, Bani, Serebias, Jamin, Akub, Sabetai, Hodias, Maasias, Kelita, Azarias, Jozabad, Hanan, Pelaias, at ang mga Levita ay nagpaliwanag[a] ng Kautusan sa bayan, habang ang bayan ay nananatili sa kani-kanilang puwesto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ay tumulong sa bayan na maunawaan ang Kautusan.” Ang pandiwang Hebreo ay nasa anyong causative at nagpapahiwatig na ipinaunawa ng mga Levita ang Kautusan sa bayan.
    reason: lexical_alternative
  - marker: b
    text: O, “habang ang bayan ay nakatayo sa kani-kanilang puwesto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁוּעַ ... פְּלָאיָה
  choice: Jesua, Bani, Serebias, Jamin, Akub, Sabetai, Hodias, Maasias, Kelita, Azarias, Jozabad, Hanan, Pelaias
  rationale: Isinalin sa karaniwang anyong Filipino ang mga pangalang pantangi sa pamamagitan ng transliterasyon, nang hindi binibigyan ng kahulugang wala sa teksto.
- source_word: וְהַלְוִיִּם
  choice: at ang mga Levita
  rationale: Pinanatili ang payak na pang-ugnay at pangngalan. Hindi nilutas kung ang mga nakalistang lalaki ay siya ring mga Levita o kung may mas malawak pang pangkat na tinutukoy.
- source_word: מְבִינִים
  choice: nagpaliwanag
  rationale: Ang Hiphil participle ng בין ay nagpapahayag ng pagsasanhi na maunawaan. Ang “nagpaliwanag” ay likas sa makabagong Filipino at malinaw na naghahatid ng causative sense sa kontekstong ito.
- source_word: אֶת־הָעָם לַתּוֹרָה
  choice: ng Kautusan sa bayan
  rationale: 'Iniangkop ang ayos sa likas na balarilang Filipino: ipinaliliwanag ang Kautusan sa bayan. Ang תּוֹרָה rito ay tumutukoy sa Kautusang binabasa sa pagtitipon.'
- source_word: וְהָעָם עַל עָמְדָם
  choice: habang ang bayan ay nananatili sa kani-kanilang puwesto
  rationale: Ipinahahayag nito na hindi umalis ang mga tao sa kanilang kinatatayuan o itinakdang lugar habang isinasagawa ang pagpapaliwanag.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong הָעָם at “Kautusan” para sa תּוֹרָה sa kontekstong tipanan. Inilagay ang mga talababa sa mismong mga pariralang tinatalakay ng mga ito.
