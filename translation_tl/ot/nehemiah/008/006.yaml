  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ עֶזְרָ֔א אֶת יְהוָ֥ה הָ/אֱלֹהִ֖ים הַ/גָּד֑וֹל וַ/יַּֽעֲנ֨וּ כָל הָ/עָ֜ם אָמֵ֤ן אָמֵן֙ בְּ/מֹ֣עַל יְדֵי/הֶ֔ם וַ/יִּקְּד֧וּ וַ/יִּשְׁתַּחֲוֻּ֛ לַ/יהוָ֖ה אַפַּ֥יִם אָֽרְצָ/ה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/006.yaml
  text: And Ezra blessed Yahweh[a], the great God, and all the people answered, “Amen, Amen,” while lifting up their hands. Then they bowed down and worshiped Yahweh with their faces to the ground.
translation:
  language: tl
  text: At pinuri ni Ezra si Yahweh, ang dakilang Diyos. Sumagot ang buong bayan, “Amen, Amen,”[a] habang itinataas nila ang kanilang mga kamay. Pagkatapos, yumuko sila at sumamba kay Yahweh habang nakasubsob ang mukha nila sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Amen, Amen” ay inuulit na tugong liturhikal na nagpapahayag ng pagsang-ayon.
    reason: cultural_note; inilagay ang anchor sa mismong pariralang ipinaliliwanag, sa halip na sa “Yahweh.”
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: pinuri
  rationale: Kapag Diyos ang layon ng piel na ברך, tumutukoy ito sa pagpapahayag ng papuri o pagpapala sa Diyos. Mas natural at malinaw sa modernong Tagalog ang “pinuri” kaysa “binasbasan,” na maaaring magpahiwatig na nagbibigay ang tao ng biyaya sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: הָאֱלֹהִים הַגָּדוֹל
  choice: ang dakilang Diyos
  rationale: Likas na katumbas sa Tagalog na pinananatili ang pagbibigay-diin ng גָּדוֹל at ang pagkakakilanlan kay Yahweh bilang Diyos.
- source_word: וַיַּעֲנוּ
  choice: Sumagot
  rationale: Tuwirang inilalarawan ang pasalitang tugon ng buong bayan.
- source_word: אָמֵן אָמֵן
  choice: Amen! Amen!
  rationale: Pinananatili ang liturhikal na salitang hiram at ang pag-uulit na nagpapahayag ng mariing pagsang-ayon.
- source_word: בְּמֹעַל יְדֵיהֶם
  choice: habang itinataas nila ang kanilang mga kamay
  rationale: Natural na ipinapahayag sa Tagalog ang kasabay na kilos at pinananatili ang larawan ng nakataas na mga kamay.
- source_word: וַיִּקְּדוּ
  choice: yumuko sila
  rationale: Inilalarawan ng קדד ang pagyukod o pagyuko nang mababa; pinananatili itong hiwalay sa kasunod na kilos ng pagsamba.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: sumamba
  rationale: Ipinahahayag ang debosyonal na kahulugan ng pagpapatirapa bilang pagsamba, nang hindi inuulit lamang ang naunang pandiwa ng pagyuko.
- source_word: אַפַּיִם אָרְצָה
  choice: nakasubsob ang kanilang mga mukha sa lupa
  rationale: Natural na Tagalog para sa idyomang literal na “mga mukha patungo sa lupa,” at malinaw na inilalarawan ang ganap na pagpapatirapa.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng titulo; hindi pinipili ang “Jehova,” na nakabatay sa mas huling pinagsamang anyo.
- issue: Kahulugan ng ברך kapag Diyos ang layon
  choice: pinuri
  alternative: binasbasan / pinagpala
  rationale: Bagaman maaaring pormal na tumbasan ng “binasbasan,” sa kontekstong ito ang kilos ni Ezra ay pagpuri o pagbibigay-pugay sa Diyos. Iniiwasan ng “pinuri” ang maling pahiwatig na si Ezra ang pinagmumulan ng biyaya para sa Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nakasubsob” upang malinaw na ipakita ang pisikal na postura, at pinanatili ang “Amen” bilang pamilyar na tugong liturhikal. Walang talababa dahil walang marker na kailangan sa teksto; ang ibinigay na English footnote ay tila tumutukoy sa “Amen, Amen” ngunit ang marker nito ay nakalagay pagkatapos ng “Yahweh,” kaya hindi ito sinunod nang may maling pagkakaugnay.
