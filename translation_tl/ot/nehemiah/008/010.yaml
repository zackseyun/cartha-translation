id: NEH.8.10
reference: Nehemiah 8:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֡ם לְכוּ֩ אִכְל֨וּ מַשְׁמַנִּ֜ים וּ/שְׁת֣וּ מַֽמְתַקִּ֗ים וְ/שִׁלְח֤וּ מָנוֹת֙ לְ/אֵ֣ין נָכ֣וֹן ל֔/וֹ כִּֽי קָד֥וֹשׁ הַ/יּ֖וֹם לַ/אֲדֹנֵ֑י/נוּ וְ/אַל תֵּ֣עָצֵ֔בוּ כִּֽי חֶדְוַ֥ת יְהוָ֖ה הִ֥יא מָֽעֻזְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/010.yaml
  text: Then he said to them[a], “Go, eat rich food and drink sweet drinks, and send portions to anyone for whom nothing is prepared, for this day is holy to our Lord. And do not be grieved[c][b], for the joy of Yahweh is your stronghold.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Humayo kayo, kumain kayo ng masasarap na pagkain at uminom ng matatamis na inumin. Magpadala rin kayo ng mga bahagi ng pagkain sa sinumang walang naihandang pagkain[a], sapagkat ang araw na ito ay banal para sa ating Panginoon. Huwag kayong malungkot, sapagkat ang kagalakan ni Yahweh[b] ang inyong tanggulan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa sinumang walang nakahandang pagkain para sa kanya.”
    reason: 'Pinananatili ng alternatibo ang mas literal na pasibong diwa ng pariralang Hebreo: walang bagay na naihanda para sa taong iyon.'
  - marker: b
    text: Ang “kagalakan ni Yahweh” ay maaari ring unawain bilang “kagalakan kay Yahweh.”
    reason: Maaaring magpahiwatig ang konstruksiyong Hebreo ng higit sa isang ugnayan, kaya hindi dapat tahimik na lutasin ang teolohikong kalabuan.
lexical_decisions:
- source_word: מַשְׁמַנִּים
  choice: masasarap at masaganang pagkain
  rationale: Literal itong tumutukoy sa matataba o masaganang bagay; sa konteksto ng pagdiriwang, natural na ipinahahayag nito ang masarap at saganang pagkain.
- source_word: מַמְתַקִּים
  choice: matatamis na inumin
  rationale: Bagaman maaaring mangahulugan ng matatamis na bagay, nililinaw ng pandiwang 'uminom' na mga inumin ang tinutukoy, nang hindi ito pinakikitid sa alak.
- source_word: מָנוֹת
  choice: mga bahagi
  rationale: Tumutukoy sa mga bahaging ipinamamahagi mula sa handaan, malamang na mga bahagi ng pagkain.
- source_word: לְאֵין נָכוֹן לוֹ
  choice: sa sinumang walang naihanda
  rationale: Pinananatili ang di-tiyak na tumatanggap at ang diwa ng kawalan ng nakahandang panustos para sa pagdiriwang.
- source_word: קָדוֹשׁ
  choice: banal
  rationale: Karaniwan at teolohikong makabuluhang salin para sa araw na itinalaga sa Diyos.
- source_word: לַאֲדֹנֵינוּ
  choice: sa ating Panginoon
  rationale: Ang אֲדֹנֵינוּ ay titulong tumutukoy sa Diyos; natural at magalang ang 'ating Panginoon.'
- source_word: תֵּעָצֵבוּ
  choice: Huwag kayong malungkot
  rationale: Likas sa modernong Tagalog at malinaw na ipinahahayag ang emosyonal na sakit o dalamhati ng pandiwa.
- source_word: חֶדְוַת יְהוָה
  choice: ang kagalakan ni Yahweh
  rationale: Pinananatili ang anyong genitibo ng Hebreo at ang tunay na kalabuan kung ito ay kagalakang mula kay Yahweh, kagalakan ni Yahweh, o kagalakan kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: מָעֻזְּכֶם
  choice: inyong tanggulan
  rationale: Pinananatili ang konkretong metapora ng isang matibay na lugar ng kanlungan at lakas.
theological_decisions:
- issue: Kahulugan ng חֶדְוַת יְהוָה
  choice: ang kagalakan ni Yahweh
  alternative: ang kagalakan kay Yahweh; ang kagalakang mula kay Yahweh
  rationale: Hindi tahasang tinutukoy ng konstruksiyong Hebreo ang ugnayan ng 'kagalakan' at 'Yahweh.' Pinananatili ng pangunahing salin ang pormal na kalabuan, at inilalahad sa talababa ang mahahalagang posibleng diwa.
- issue: Paglalahad ng pangalang יְהוָה
  choice: Yahweh
  alternative: ANG PANGINOON; Jehovah
  rationale: Dahil personal na pangalang YHWH ang nasa pinagmulang teksto, ginagamit ang transliterasyong 'Yahweh' upang maiba ito sa titulong אֲדֹנֵינוּ na isinaling 'ating Panginoon.'
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'Humayo kayo' bilang angkop na utos sa isang pampublikong at banal na tagpo; pinili ang 'tanggulan' upang mapanatili ang matibay na metapora ng Hebreo. Ang lahat ng talababa ay may katugmang marker sa pangunahing teksto.
