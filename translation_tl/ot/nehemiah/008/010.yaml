    issue: “mga bahagi”
    rationale: Hindi sapat na malinaw sa modernong Tagalog na ang מָנוֹת ay mga bahaging pagkain na ipinamamahagi.
  - severity: medium
    issue: “banal sa ating Panginoon”
    rationale: Mas malinaw at mas tapat ang “banal para sa ating Panginoon,” yamang ang araw ay itinalaga para sa kanya.
