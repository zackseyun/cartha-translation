  - severity: medium
    issue: “masasarap at masaganang pagkain”
    rationale: Ang מַשְׁמַנִּים ay mga matataba/rich o piling pagkain. Ang “masaganang” ay maaaring magpahiwatig ng dami, hindi kalidad, at nadaragdagan ang diwa.
