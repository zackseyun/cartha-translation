revisions:
- from: Pagkatapos, sinabi niya sa kanila, “Humayo kayo, kumain ng masasarap at masaganang pagkain at uminom ng matatamis na inumin. Magpadala rin kayo ng mga bahagi sa sinumang walang naihanda[a], sapagkat ang araw na ito ay banal sa ating Panginoon. Huwag kayong malungkot, sapagkat ang kagalakan ni Yahweh[b] ang inyong tanggulan.”
  to: Sinabi niya sa kanila, “Humayo kayo, kumain kayo ng masasarap na pagkain at uminom ng matatamis na inumin. Magpadala rin kayo ng mga bahagi ng pagkain sa sinumang walang naihandang pagkain[a], sapagkat ang araw na ito ay banal para sa ating Panginoon. Huwag kayong malungkot, sapagkat ang kagalakan ni Yahweh[b] ang inyong tanggulan.”
  rationale: Inalis ang di-kailangang “Pagkatapos”; ginawang “masasarap na pagkain” ang mas tumpak at hindi pinalawak na salin ng mga pagkaing mayaman/pili; nilinaw na mga bahagi ng pagkain ang ipapadala; at ginawang “banal para sa ating Panginoon” ang kaugnayan ng banal na araw sa Diyos. Pinanatili ang dignified na modernong Tagalog, ang pagkakaiba ng “Panginoon” at “Yahweh,” at ang kalabuan ng “kagalakan ni Yahweh.”
