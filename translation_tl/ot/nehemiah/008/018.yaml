  to: Araw-araw siyang bumasa mula sa Aklat[a] ng Kautusan ng Diyos, mula sa unang araw hanggang sa huling araw. Ipinagdiwang nila ang kapistahan nang pitong araw,[b] at sa ikawalong araw ay nagkaroon ng isang solemneng pagtitipon, ayon sa itinakda.[c]
