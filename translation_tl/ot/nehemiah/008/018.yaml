base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/018.yaml
  text: And he read from the Book of the Law of God day by day[a], from the first day to the last day. And they kept the feast seven days, and on the eighth day there was a solemn assembly[c][b], according to the ordinance.
translation:
  language: tl
  text: Araw-araw siyang bumasa mula sa Aklat[a] ng Kautusan ng Diyos, mula sa unang araw hanggang sa huling araw. Ipinagdiwang nila ang kapistahan nang pitong araw,[b] at sa ikawalong araw ay nagkaroon ng isang solemneng pagtitipon, ayon sa itinakda.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Balumbon.” Ang salitang Hebreo ay maaaring tumukoy sa isang nakasulat na dokumento, kabilang ang balumbon.
    reason: lexical_alternative
  - marker: b
    text: O “Idinaos nila ang kapistahan nang pitong araw.”
    reason: lexical_alternative
  - marker: c
    text: O “ayon sa tuntunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: bumasa siya
  rationale: Ang קרא na may kasunod na reperensiya sa isang nakasulat na teksto ay nangangahulugang pagbasa, malamang nang malakas. Pinanatili ang isahang simuno ng pandiwang Hebreo.
- source_word: בְּסֵפֶר תּוֹרַת הָאֱלֹהִים
  choice: mula sa Aklat ng Kautusan ng Diyos
  rationale: Likas sa Tagalog ang “bumasa mula sa” para sa בְּ sa ganitong gamit. Tumpak na inilalarawan ng “Aklat” ang סֵפֶר nang hindi ipinipilit ang pisikal na anyo nito bilang balumbon.
- source_word: יוֹם בְּיוֹם
  choice: araw-araw
  rationale: Natural at malinaw na ipinahahayag ng pariralang Tagalog ang paulit-ulit na pagkilos sa bawat araw.
- source_word: מִן הַיּוֹם הָרִאשׁוֹן עַד הַיּוֹם הָאַחֲרוֹן
  choice: mula sa unang araw hanggang sa huling araw
  rationale: Tuwirang pinananatili ang buong saklaw ng panahon sa tekstong Hebreo.
- source_word: וַיַּעֲשׂוּ חָג
  choice: ipinagdiwang nila ang kapistahan
  rationale: Sa pariralang ito, ang עשה kasama ng חג ay tumutukoy sa pagdaraos o pagdiriwang ng kapistahan. Ang “ipinagdiwang” ay natural sa modernong Tagalog.
- source_word: שִׁבְעַת יָמִים
  choice: nang pitong araw
  rationale: Ang “nang” ay malinaw na nagmamarka sa tagal ng pagdiriwang.
- source_word: עֲצֶרֶת
  choice: banal na pagtitipon
  rationale: Tumutukoy ito sa natatanging itinakdang kapulungan sa pagtatapos ng kapistahan. Ipinahihiwatig ng “banal na pagtitipon” ang panrelihiyong katangian nito nang hindi nagdaragdag ng isang partikular na doktrinal na paliwanag.
- source_word: כַּמִּשְׁפָּט
  choice: ayon sa itinakda
  rationale: Sa kontekstong ito, ang מִשְׁפָּט ay ang umiiral na tuntunin o itinakdang paraan ng pagdiriwang, hindi lamang isang kaugalian.
theological_decisions:
- issue: Isahang simuno ng pagbasa at maramihang simuno ng pagdiriwang
  choice: Pinanatili ang “bumasa siya” at “ipinagdiwang nila.”
  alternative: Gawing maramihan o di-tiyak ang bumasa, gaya ng “bumasa sila.”
  rationale: Magkaiba ang anyong isahan at maramihan ng mga pandiwa sa Hebreo. Pinananatili nito ang pagkakaiba ng tagabasa at ng buong pamayanang nagdiwang.
- issue: Kahulugan ng kultikong terminong עֲצֶרֶת
  choice: banal na pagtitipon
  alternative: pangwakas na pagtitipon; natatanging kapulungan
  rationale: Pinananatili ng salin ang sagrado at itinakdang katangian ng pagtitipon, ngunit hindi nito nilulutas nang labis kung ang pangunahing diin ay nasa kabanalan, pagpigil sa karaniwang gawain, o pagiging pangwakas nito.
translation_notes:
  register: Gumamit ng natural at marangal na modernong Tagalog. Iniwasan ang mas lumang “aklat ng kautusan” na walang malinaw na proper-title styling at ang mas teknikal na “solemneng kapulungan.” Ang ayos na “Araw-araw ay bumasa siya” ay nagpapanatili sa diin ng Hebreong יוֹם בְּיוֹם habang malinaw pa rin ang isahang tagabasa.
