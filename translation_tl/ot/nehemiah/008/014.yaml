  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יִּמְצְא֖וּ כָּת֣וּב בַּ/תּוֹרָ֑ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה אֲשֶׁר֩ יֵשְׁב֨וּ בְנֵֽי יִשְׂרָאֵ֧ל בַּ/סֻּכּ֛וֹת בֶּ/חָ֖ג בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/014.yaml
  text: And they found it written in the Law that Yahweh had commanded through Moses that the sons of Israel should dwell in booths during the feast[a], in the seventh month.
translation:
  language: tl
  text: At natagpuan nilang nakasulat sa Kautusan na iniutos ni Yahweh sa pamamagitan ni Moises na ang mga anak ni Israel[a] ay manirahan sa mga kubol sa panahon ng kapistahan sa ikapitong buwan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga Israelita” o “ang sambayanang Israel”; literal sa Hebreo, “ang mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ כָּתוּב
  choice: natagpuan nilang nakasulat
  rationale: Pinananatili nito ang Hebreong konstruksiyong ‘natagpuan ... na nakasulat’ habang natural ang daloy sa modernong Tagalog.
- source_word: בַּתּוֹרָה
  choice: sa Kautusan
  rationale: Tumutukoy ito rito sa nakasulat na Kautusan na ibinigay sa pamamagitan ni Moises; malinaw at pamilyar ang ‘Kautusan’ sa kontekstong biblikal.
- source_word: צִוָּה יְהוָה
  choice: iniutos ni Yahweh
  rationale: Tuwirang isinasalin ang pandiwang צוה at pinananatili ang tipanang pangalan na יהוה bilang ‘Yahweh.’
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Ang idyomang literal na ‘sa kamay ni Moises’ ay nagpapahayag ng pagkilos sa pamamagitan ng isang tagapamagitan.
- source_word: יֵשְׁבוּ
  choice: manirahan
  rationale: Sa konteksto ng kapistahan, tumutukoy ang ישב sa pansamantalang paninirahan sa mga kubol, hindi lamang sa pag-upo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang kongkretong anyo ng Hebreo, bagaman pangkalahatang tumutukoy ito sa sambayanang Israel.
- source_word: בַּסֻּכּוֹת
  choice: sa mga kubol
  rationale: Ang סֻכּוֹת ay mga pansamantalang silungang karaniwang yari sa mga sanga; ang ‘kubol’ ay maikli, kongkreto, at angkop sa kapistahan.
- source_word: בֶּחָג
  choice: sa panahon ng kapistahan
  rationale: Ipinahahayag ng parirala ang paninirahan sa mga kubol habang ginaganap ang kilalang kapistahan.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: sa ikapitong buwan
  rationale: Tuwiran at natural na katumbas ng Hebreong pariralang panahunan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasan ang tetragrammaton sa tekstong Hebreo; pinananatili ng ‘Yahweh’ ang natatanging tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili ang pormal na larawan ng Hebreo nang hindi ipinahihiwatig na mga lalaking anak lamang ang saklaw; nililinaw sa talababa ang kolektibong kahulugan.
translation_notes:
  register: Makabago at marangal na Filipino, na may pamilyar na bokabularyong biblikal. Ginamit ang ‘kubol’ para sa pansamantalang silungan at iniwasan ang mas arkahiko o posibleng mapanlinlang na ‘tabernakulo.’
