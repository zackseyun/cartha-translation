base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/016.yaml
  text: So the people went out and brought them[a], and made booths for themselves, each on his roof, and in their courtyards, and in the courtyards of the house of God, and in the square of the Water Gate[b], and in the square of the Gate of Ephraim.
translation:
  language: tl
  text: Kaya lumabas ang mga tao at dinala nila ang mga iyon, at gumawa sila ng mga kubol[a] para sa kanilang sarili—bawat isa sa bubong nito, sa kanilang mga looban, sa mga looban ng bahay ng Diyos, sa liwasan[b] ng Pintuan ng Tubig, at sa liwasan ng Pintuan ng Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga silungan.” Pinili ang “mga kubol” upang mapanatili ang kaugnayan sa Kapistahan ng mga Kubol.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay tumutukoy sa isang bukas at maluwang na pampublikong lugar o plasa, karaniwan malapit sa isang pintuang-bayan; sa mga tradisyonal na salin, “maluwang na lugar.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ הָעָם
  choice: lumabas ang mga tao
  rationale: Tuwirang inilalarawan ng karaniwang salaysay na anyo ng יָצָא ang paglabas ng buong kapulungan upang kumuha ng mga sangay at dahon.
- source_word: וַיָּבִיאוּ
  choice: dinala nila ang mga iyon
  rationale: Ang Hiphil ng בוא ay nangangahulugang ‘dalhin.’ Ang ‘mga iyon’ ay tumutukoy sa mga sangay at dahong binanggit sa naunang talata nang hindi inuulit ang mga ito.
- source_word: וַיַּעֲשׂוּ לָהֶם סֻכּוֹת
  choice: gumawa sila ng mga kubol para sa kanilang sarili
  rationale: Ang ‘kubol’ ay angkop sa pansamantalang estrukturang ginagamit sa kapistahan at pinananatili ang kaugnayan sa Kapistahan ng mga Kubol; ang ‘para sa kanilang sarili’ ay kumakatawan sa לָהֶם.
- source_word: אִישׁ עַל גַּגּוֹ
  choice: bawat isa ay gumawa sa kani-kanyang bubong
  rationale: Distributibo ang אִישׁ dito. Likas sa Filipino ang ‘bawat isa’ at ‘kani-kanyang bubong,’ at pinananatili nito ang indibiduwal na diwa nang hindi nagdaragdag ng kasarian.
- source_word: וּבְחַצְרֹתֵיהֶם
  choice: sa kanilang mga looban
  rationale: Ang חָצֵר ay isang nakapaloob na looban o courtyard; malinaw at likas sa makabagong Filipino ang ‘looban.’
- source_word: וּבְחַצְרוֹת בֵּית הָאֱלֹהִים
  choice: sa mga looban ng bahay ng Diyos
  rationale: Pinananatili ng ‘bahay ng Diyos’ ang pormal na larawan ng parirala habang malinaw na tumutukoy sa nasasakupan ng templo.
- source_word: וּבִרְחוֹב
  choice: sa liwasan
  rationale: Ang רְחוֹב ay maluwang at bukás na pampublikong lugar, madalas na malapit sa isang pintuang-bayan. Ang ‘liwasan’ ang likas at tumpak na katumbas.
- source_word: שַׁעַר הַמַּיִם
  choice: Pintuang Tubig
  rationale: Pangalan ito ng isang pintuang-bayan; ang anyo at malaking titik ay nagpapakitang pantanging pangalan.
- source_word: שַׁעַר אֶפְרָיִם
  choice: Pintuan ng Efraim
  rationale: Malinaw na pinananatili nito ang Hebreong ugnayang genitibo at ang katangian nito bilang pangalan ng lugar.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘kani-kanyang’ upang natural na maipahayag ang distributibong אִישׁ at ang isahang hulaping paari sa גַּגּוֹ. Hinati sa dalawang pangungusap ang mahabang Hebreong koordinasyon para sa mas madaling pagbasa, nang hindi binabago ang pagkakasunod ng mga kilos at lugar.
