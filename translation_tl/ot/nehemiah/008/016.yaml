revisions:
- from: Kaya lumabas ang mga tao at dinala nila ang mga iyon. Gumawa sila ng mga kubol[a] para sa kanilang sarili—bawat isa ay gumawa sa kani-kanyang bubong, sa kanilang mga looban, sa mga looban ng bahay ng Diyos, sa liwasan[b] ng Pintuang Tubig, at sa liwasan ng Pintuan ng Efraim.
  to: Kaya lumabas ang mga tao at dinala nila ang mga iyon, at gumawa sila ng mga kubol[a] para sa kanilang sarili—bawat isa sa bubong nito, sa kanilang mga looban, sa mga looban ng bahay ng Diyos, sa liwasan[b] ng Pintuan ng Tubig, at sa liwasan ng Pintuan ng Efraim.
  rationale: 'Inayos ang sintaks upang masundan ang Hebreong pagkakasunod: ang bayan ay lumabas, nagdala ng mga materyales, at gumawa ng mga kubol para sa sarili sa mga nakatalang lugar. Hindi binago ang ipinahihiwatig na bagay ng “dinala,” ang distributibong diwa ng אִישׁ, o ang mga pangalan at kahulugan ng mga lugar.'
