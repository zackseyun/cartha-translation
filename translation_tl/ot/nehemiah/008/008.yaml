  text: They read from the book[a], from the law of God, clearly, and they gave the sense, so that they understood the reading.
translation:
  language: tl
  text: Binasa nila nang malinaw[a] mula sa aklat ng Kautusan ng Diyos, at ipinaliwanag nila ang kahulugan para maunawaan nila ang pagbasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang bukod-tangi.” Ang salitang Hebreo ay maaaring tumukoy sa malinaw na paraan ng pagbasa, sa pagpapalinaw ng teksto sa pamamagitan ng paliwanag, o posibleng sa pagsasalin nito para sa mga nakikinig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: Binasa nila
  rationale: Ang קרא, kapag ang layon ay isang nakasulat na aklat, ay karaniwang tumutukoy sa pagbasa; ang anyong ito ay natural at tuwiran sa modernong Tagalog.
- source_word: בַּסֵּפֶר
  choice: mula sa aklat
  rationale: Sa konteksto ng pampublikong pagbasa, ipinahihiwatig ng ב ang tekstong pinagmumulan ng binabasa.
- source_word: בְּתוֹרַת הָאֱלֹהִים
  choice: mula sa Kautusan ng Diyos
  rationale: Dito, ang תּוֹרָה ay tumutukoy sa kongkretong banal na tekstong binabasa. Pinananatili ng “Kautusan” ang legal at tipanang diwa, at ng inuulit na “mula sa” ang pag-uugnay nito sa “aklat.”
- source_word: מְפֹרָשׁ
  choice: nang malinaw[a]
  rationale: Maaaring tumukoy ang salita sa malinaw o bukod-tanging pagbasa, pagpapalinaw sa pamamagitan ng paliwanag, o posibleng pagsasalin. Hindi nililimitahan ng “nang malinaw” ang kahulugan sa iisang paraan lamang.
- source_word: וְשׂוֹם שֶׂכֶל
  choice: ipinaliwanag nila ang kahulugan
  rationale: Ang idyomang literal na may diwang “paglalagay ng pagkaunawa” ay natural na ipinahahayag sa Tagalog bilang pagpapaliwanag ng kahulugan.
- source_word: וַיָּבִינוּ
  choice: upang maunawaan
  rationale: Ipinakikita nito ang layon o bunga ng pagbasa at pagpapaliwanag. Ang balangkas na walang tahasang simuno ay hindi sapilitang nagpapasya kung ang diin ay nasa pagkaunawa ng mga tagapakinig o sa pagpapaintindi ng mga tagapagturo.
- source_word: בַּמִּקְרָא
  choice: ang binasa
  rationale: Ang מִקְרָא ay maaaring tumukoy sa pagbasa nang malakas o sa nilalaman ng binasa; ang “ang binasa” ay natural at sapat na malawak sa Tagalog.
