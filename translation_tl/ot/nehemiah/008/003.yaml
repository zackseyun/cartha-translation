base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/003.yaml
  text: And he read from it before the square that was in front of the Water Gate[a], from daybreak until midday, in the presence of the men and the women and those who could understand[c][b]; and the ears of all the people were attentive to the Book of the Law.
translation:
  language: tl
  text: Binasa niya iyon sa harap ng liwasang nasa tapat ng Tarangkahan ng Tubig, mula sa pagbubukang-liwayway[a] hanggang tanghali, sa harap ng mga lalaki, mga babae, at mga nakauunawa[b]. At nakinig nang buong pansin ang buong bayan sa Aklat[c] ng Kautusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “mula sa liwanag”; maaari ring isaling “mula sa bukang-liwayway.”
    reason: lexical_alternative
  - marker: b
    text: O “mga may pang-unawa,” malamang ay kabilang ang lahat ng nasa sapat na gulang upang maunawaan ang pagbasa.
    reason: lexical_alternative
  - marker: c
    text: Ang “Aklat” ay maaari ring isaling “balumbon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא בּוֹ
  choice: Binasa niya iyon
  rationale: Sa konteksto ng nakasulat na kautusan, ang קרא ay nangangahulugang bumasa; likas sa Tagalog ang tuwirang layong “iyon” para sa tekstong tinutukoy.
- source_word: לִפְנֵי הָרְחוֹב אֲשֶׁר לִפְנֵי שַׁעַר הַמַּיִם
  choice: sa harap ng liwasang nasa tapat ng Tarangkahan ng Tubig
  rationale: Ang רְחוֹב ay bukás na pampublikong liwasan. Ginamit ang “nasa tapat” sa ikalawang לִפְנֵי upang maging malinaw at natural ang lokasyon nang hindi inuulit nang alanganin ang “sa harap.”
- source_word: מִן הָאוֹר
  choice: mula sa pagbubukang-liwayway
  rationale: Literal itong “mula sa liwanag,” ngunit bilang pananda ng oras ay tumutukoy sa unang liwanag ng araw.
- source_word: עַד מַחֲצִית הַיּוֹם
  choice: hanggang tanghali
  rationale: Ang parirala ay tumutukoy sa kalagitnaan ng araw; “tanghali” ang malinaw at natural na katumbas.
- source_word: נֶגֶד הָאֲנָשִׁים וְהַנָּשִׁים וְהַמְּבִינִים
  choice: sa harap ng mga lalaki, mga babae, at mga nakauunawa
  rationale: Pinananatili ang tahasang pagbanggit sa mga lalaki at babae at ang hiwalay na pangkat na inilalarawan ayon sa kakayahang makaunawa.
- source_word: וְאָזְנֵי כָל הָעָם אֶל
  choice: At buong-pansing nakinig ang buong bayan sa
  rationale: Ang Hebreo ay literal na nagsasabing nakatuon ang mga tainga ng bayan sa teksto. Isinalin ang idyoma sa natural na Tagalog habang pinananatili ang diin sa masusing pakikinig.
- source_word: סֵפֶר הַתּוֹרָה
  choice: Aklat ng Kautusan
  rationale: Maaaring mangahulugan ang סֵפֶר ng aklat o balumbon. Sa kontekstong ito, ang תּוֹרָה ay ang nakasulat at may-awtoridad na kautusang binabasa sa bayan.
theological_decisions:
- issue: Paglilipat ng תּוֹרָה sa konteksto ng pampublikong pagbasa ng tipan
  choice: Kautusan
  alternative: tagubilin; Torah
  rationale: Bagaman maaari ring mangahulugan ang תּוֹרָה ng “tagubilin,” tumutukoy rito ang parirala sa kinikilalang nakasulat na kalipunan ng kautusan. Malinaw sa karaniwang mambabasang Tagalog ang “Kautusan” nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Paglalarawan sa kasarian at kakayahang umunawa ng mga tagapakinig
  choice: mga lalaki, mga babae, at mga nakauunawa
  alternative: lahat ng nakauunawa, lalaki man o babae
  rationale: Pinananatili ang tatlong magkakaugnay ngunit magkakaibang paglalarawan sa Hebreo, sa halip na pagsamahin ang mga ito at alisin ang estruktura ng pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “liwasan,” “Tarangkahan ng Tubig,” at “Aklat ng Kautusan” bilang malinaw na mga katawagang pampubliko at pangkasulatan. Isinalin nang idyomatiko ang Hebreong larawan ng mga taingang nakatuon bilang “buong-pansing nakinig,” upang maiwasan ang di-likas na Tagalog habang napapanatili ang diin.
