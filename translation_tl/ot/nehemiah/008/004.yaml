  to: Tumayo si Ezra, ang eskriba, sa isang entabladong yari sa kahoy[a] na ginawa nila para sa layuning iyon.[b] Kasama niyang tumayo sina Matitias, Sema, Anaias, Urias, Hilkias, at Maasias sa kanyang kanan, at sina Pedaias, Misael, Malquias, Hasum, Hasbadana, Zacarias, at Mesulam sa kanyang kaliwa.
