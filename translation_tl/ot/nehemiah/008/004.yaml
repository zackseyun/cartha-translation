base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/004.yaml
  text: Ezra the scribe stood on a wooden platform that they had made for the purpose[a], and beside him stood Mattithiah, Shema, Anaiah, Uriah, Hilkiah, and Maaseiah on his right hand, and Pedaiah, Mishael, Malchijah, Hashum, Hashbaddanah, Zechariah[b], and Meshullam on his left hand.
translation:
  language: tl
  text: Tumayo si Ezra, ang eskriba, sa isang entabladong yari sa kahoy[a] na ginawa nila para sa layuning iyon.[b] Kasama niyang tumayo sina Matitias, Sema, Anaias, Urias, Hilkias, at Maasias sa kanyang kanan, at sina Pedaias, Misael, Malquias, Hasum, Hasbadana, Zacarias, at Mesulam sa kanyang kaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “isang tore na yari sa kahoy”; ibig sabihin, isang nakataas na estruktura o tuntungang yari sa kahoy.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para sa bagay na iyon” o “para sa okasyong iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֵץ
  choice: isang entabladong kahoy
  rationale: Literal itong “tore na kahoy,” ngunit sa konteksto ng pampublikong pagbasa ay tumutukoy sa isang nakataas na estrukturang kahoy na tinatayuan. Likas at malinaw sa Filipino ang “entabladong kahoy,” habang pinananatili sa talababa ang literal na larawan.
- source_word: לַדָּבָר
  choice: para sa layuning iyon
  rationale: Maaaring mangahulugan ang דָּבָר ng “salita,” “bagay,” “usapin,” o “pangyayari.” Sa konteksto, ginawa ang entablado para sa partikular na layunin ng pagtitipon; hindi nililimitahan ng salin ang parirala nang higit sa hinihingi ng teksto.
- source_word: אֶצְלוֹ
  choice: sa tabi niya
  rationale: Tuwirang ipinahihiwatig ng parirala ang pisikal na kalapitan ng mga lalaking nakapuwesto sa magkabilang panig ni Ezra.
- source_word: עַל יְמִינוֹ
  choice: sa kanyang kanan
  rationale: Natural na modernong Filipino para sa direksiyong literal na “sa kanyang kanan,” nang hindi nagdaragdag ng di-kailangang salita.
- source_word: וּמִשְּׂמֹאלוֹ
  choice: sa kanyang kaliwa
  rationale: Pinananatili ang paralelismo sa “sa kanyang kanan” at malinaw na inilalarawan ang puwesto ng ikalawang pangkat.
- source_word: הַסֹּפֵר
  choice: ang eskriba
  rationale: Ang סֹפֵר dito ay titulong tumutukoy sa taong bihasa sa mga kasulatan at kautusan. Ang “eskriba” ay maikli, kinikilalang terminong biblikal, at mas tiyak kaysa pangkalahatang “tagapagsulat.”
- source_word: וַיַּעֲמֹד
  choice: tumayo / nakatayo
  rationale: Ang unang anyo ay isinaling “Tumayo” bilang pasulong na kilos sa salaysay; sa kasunod na talaan, “ay nakatayo” ang natural na Filipino para sa mga lalaking nasa tabi niya, habang nananatili ang pag-uulit ng ideya ng עמד.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “eskriba” bilang tiyak at nakikilalang titulong biblikal, at “entablado” bilang natural na paglalarawan sa gamit ng estruktura. Isinulat sa anyong Filipino ang mga pangalang Hebreo nang hindi inaangkop sa isang denominasyonal na tradisyon.
