  to: Pagkatapos, dinala ng paring si Ezra ang Kautusan sa harap ng kapulungan, kapuwa mga lalaki at mga babae[a], at lahat ng may sapat na pang-unawa upang makinig[b], noong unang araw ng ikapitong buwan.
