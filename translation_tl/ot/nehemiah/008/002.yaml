base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/002.yaml
  text: Then Ezra the priest brought the law before the assembly[a], both men and women, and all who could understand what they heard[b], on the first day of the seventh month.
translation:
  language: tl
  text: Pagkatapos, dinala ng paring si Ezra ang Kautusan sa harap ng kapulungan, kapuwa mga lalaki at mga babae[a], at lahat ng may sapat na pang-unawa upang makinig[b], noong unang araw ng ikapitong buwan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “mula sa lalaki hanggang sa babae,” isang paraan ng pagpapahayag sa buong saklaw ng kapulungan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “lahat ng nakauunawa sa pamamagitan ng pakikinig,” samakatuwid, lahat ng may kakayahang maunawaan ang binabasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיא
  choice: Pagkatapos, dinala
  rationale: Ipinahahayag ng waw-consecutive ang pagsulong ng salaysay; natural na ipinakikita ng “Pagkatapos” ang pagkakasunod-sunod ng mga pangyayari.
- source_word: עֶזְרָא הַכֹּהֵן
  choice: ng paring si Ezra
  rationale: Pinananatili ang tahasang titulo ni Ezra at gumagamit ng natural na ayos ng salita sa modernong Tagalog.
- source_word: הַתּוֹרָה
  choice: ang Kautusan
  rationale: Sa kontekstong ito, tumutukoy ito sa Kautusan ni Moises na babasahin sa madla. Ang “Kautusan” ay malinaw sa pangkalahatang mambabasa at pinananatili ang bigat ng terminong Torah.
- source_word: לִפְנֵי הַקָּהָל
  choice: sa harap ng kapulungan
  rationale: Pinananatili nito ang pampubliko at pormal na tagpo nang hindi nagdaragdag ng natatanging eklesiyastikong kahulugan.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: mga lalaki at mga babae
  rationale: Natural nitong ipinahahayag sa Tagalog ang buong saklaw na tinutukoy ng literal na Hebreong “mula sa lalaki hanggang sa babae,” habang pinananatili ang tahasang pagbanggit sa dalawang pangkat.
- source_word: וְכֹל מֵבִין לִשְׁמֹעַ
  choice: at lahat ng may kakayahang umunawa sa kanilang naririnig
  rationale: Ipinakikita na ang tinutukoy ay kakayahang maunawaan ang binabasa at naririnig, hindi lamang pisikal na kakayahang makarinig.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: noong unang araw ng ikapitong buwan
  rationale: Ito ang natural at karaniwang anyo ng petsang Hebreo sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa kasarian ng mga nakikinig
  choice: mga lalaki at mga babae
  alternative: mula sa lalaki hanggang sa babae
  rationale: Tahasan sa Hebreo ang mga salitang panlalaki at pambabae upang ipahayag ang buong saklaw ng kapulungan. Pinananatili ng salin ang dalawang kasarian, ngunit gumagamit ng mas natural na parirala sa Tagalog; inilalagay sa talababa ang literal na anyo.
- issue: Pagsasalin ng תּוֹרָה
  choice: Kautusan
  alternative: Torah; tagubilin
  rationale: Ang konteksto ay pampublikong pagbasa ng Kautusan ni Moises. Ang “Kautusan” ang pinakamalinaw at angkop na katumbas dito, habang hindi nililimitahan ang termino sa isang denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “kapulungan” sa halip na terminong maaaring magpahiwatig ng partikular na tradisyong pansimbahan; pinanatili ang “Kautusan” bilang pormal ngunit madaling maunawaang tawag sa Torah sa kontekstong ito.
