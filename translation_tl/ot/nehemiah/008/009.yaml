  text: וַ/יֹּ֣אמֶר נְחֶמְיָ֣ה ה֣וּא הַ/תִּרְשָׁ֡תָא וְ/עֶזְרָ֣א הַ/כֹּהֵ֣ן הַ/סֹּפֵ֡ר וְ/הַ/לְוִיִּם֩ הַ/מְּבִינִ֨ים אֶת הָ/עָ֜ם לְ/כָל הָ/עָ֗ם הַ/יּ֤וֹם קָדֹֽשׁ הוּא֙ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֔ם אַל תִּֽתְאַבְּל֖וּ וְ/אַל תִּבְכּ֑וּ כִּ֤י בוֹכִים֙ כָּל הָ/עָ֔ם כְּ/שָׁמְעָ֖/ם אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/009.yaml
  text: Then Nehemiah the governor[a], Ezra the priest and scribe, and the Levites who were instructing the people said to all the people, “This day is holy to Yahweh your God[b]. Do not mourn or weep.” For all the people were weeping as they heard the words of the law.
translation:
  language: tl
  text: 'Sina Nehemias, na siyang gobernador[a], Ezra na pari at eskriba, at ang mga Levitang nagtuturo sa bayan ay nagsabi sa buong bayan: “Ang araw na ito ay banal kay Yahweh na inyong Diyos. Huwag kayong magluksa o umiyak.” Sapagkat umiiyak ang buong bayan habang nakikinig sila sa mga salita ng Kautusan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tirshata,” isang titulong administratibo noong panahon ng Persia.
    reason: lexical_alternative
  - marker: b
    text: O “mga salita ng Torah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: gobernador
  rationale: Isang titulong administratibo noong panahon ng Persia; malinaw na ipinahahayag ng “gobernador” ang tungkulin nito sa modernong Filipino. Pinananatili sa talababa ang mismong titulo bilang alternatibo.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: pari at tagapagturo ng Kautusan
  rationale: Parehong titulo ni Ezra ang dalawang pangngalan. Ang “tagapagturo ng Kautusan” ay mas malinaw sa karaniwang mambabasa kaysa “eskriba” at angkop sa gawain ng סֹפֵר sa kontekstong ito.
- source_word: הַלְוִיִּם הַמְּבִינִים אֶת־הָעָם
  choice: mga Levitang nagpapaliwanag sa bayan
  rationale: Ang Hiphil participle ng בין ay tumutukoy sa pagbibigay-unawa o pagtuturo; natural na ipinahahayag ito ng “nagpapaliwanag” nang hindi ipinapalagay na lubos nang naunawaan ng bayan.
- source_word: הַיּוֹם קָדֹשׁ הוּא
  choice: Ang araw na ito ay banal
  rationale: Tuwirang pinananatili ang predikasyon at ang panrelihiyong diwa ng קָדֹשׁ.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang pang-ukol na ל ay likas na maisasalin bilang “kay” sa Filipino, at pinananatili ang personal na pangalang tipan na Yahweh.
- source_word: תִּתְאַבְּלוּ
  choice: magluksa
  rationale: Ipinahahayag ang pagluluksa, kabilang ang panlabas na pagpapakita ng dalamhati, at naiiba sa kasunod na pag-iyak.
- source_word: תִּבְכּוּ / בוֹכִים
  choice: umiyak / umiiyak
  rationale: Natural at marangal na Filipino na nagpapanatili sa aspektuwal na pagkakaiba ng utos at patuloy na kilos.
- source_word: כְּשָׁמְעָם
  choice: habang pinakikinggan nila
  rationale: Ipinakikita ng כְּ ang magkasabay at nagpapatuloy na pakikinig at pag-iyak; ang “pinakikinggan” ay angkop sa pampublikong pagbasa.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: mga salita ng Kautusan
  rationale: Sa konteksto ng pampublikong pagbasa ng tipan, malinaw ang “Kautusan”; binibigyang-daan sa talababa ang “Torah” bilang lehitimong alternatibo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Saklaw ng תּוֹרָה
  choice: Kautusan
  alternative: Torah; tagubilin
  rationale: Ang konteksto ay pampublikong pagbasa ng tekstong tipan, kaya ang “Kautusan” ay malinaw at nakaugat sa konteksto; pinananatili sa talababa ang “Torah” upang hindi ikubli ang saklaw ng terminong Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “gobernador” at “nagpapaliwanag” para sa kalinawan; iniwasan ang mas teknikal at di-gaanong malinaw na “Tirshata” at “eskriba” sa pangunahing teksto. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto.
