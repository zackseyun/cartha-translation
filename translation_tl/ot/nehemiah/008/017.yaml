reference: Nehemiah 8:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֣וּ כָֽל הַ֠/קָּהָל הַ/שָּׁבִ֨ים מִן הַ/שְּׁבִ֥י סֻכּוֹת֮ וַ/יֵּשְׁב֣וּ בַ/סֻּכּוֹת֒ כִּ֣י לֹֽא עָשׂ֡וּ מִ/ימֵי֩ יֵשׁ֨וּעַ בִּן נ֥וּן כֵּן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/ה֑וּא וַ/תְּהִ֥י שִׂמְחָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/017.yaml
  text: And all the assembly of those who had returned from the captivity made booths and lived in the booths[a], for the sons of Israel had not done so from the days of Jeshua son of Nun until that day. And there was very great rejoicing.
translation:
  language: tl
  text: Ang buong kapulungan ng mga bumalik mula sa pagkabihag ay gumawa ng mga kubol at nanirahan sa mga kubol. Sapagkat hindi ito ginawa nang ganito ng mga anak ng Israel mula pa noong panahon ni Jesua na anak ni Nun[a] hanggang sa araw na iyon. At nagkaroon ng napakalaking kagalakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Si Jesua na anak ni Nun ay ang mas kilala bilang Josue na anak ni Nun.
    reason: Nililinaw ang identidad ng taong tinutukoy habang pinananatili sa pangunahing teksto ang anyong pangalang יֵשׁוּעַ na nasa Hebreo.
lexical_decisions:
- source_word: הַקָּהָל
  choice: kapulungan
  rationale: Tumutukoy ito sa sama-samang pamayanang nagtipon. Ang “kapulungan” ay likas at marangal sa modernong Tagalog nang hindi nagkakaroon ng labis na espesipikong kahulugang pansimbahan.
- source_word: הַשָּׁבִים מִן הַשְּׁבִי
  choice: mga bumalik mula sa pagkabihag
  rationale: Pinananatili nito ang larawan ng pagbabalik mula sa kalagayan ng pagkabihag; mas malapit ito sa Hebreo kaysa sa mas interpretatibong “mga bumalik mula sa pagkatapon.”
- source_word: סֻכּוֹת
  choice: mga kubol
  rationale: Ang salita ay tumutukoy sa mga pansamantalang silungang tinitirhan sa kapistahan. Ang “kubol” ay maikli, malinaw, at hindi nalilito sa santuwaryo o tabernakulo.
- source_word: וַיֵּשְׁבוּ בַסֻּכּוֹת
  choice: tumira sa mga iyon
  rationale: Sa konteksto ng kapistahan, ang יָשַׁב ay tumutukoy sa paninirahan, hindi lamang sa pag-upo. Ang panghalip ay umiiwas sa hindi kailangang pag-uulit ng “mga kubol.”
- source_word: כִּי לֹא עָשׂוּ ... כֵּן
  choice: Sapagkat hindi ito ginawa nang ganito
  rationale: Pinananatili ang ugnayang sanhi ng כִּי at ang anaporikong puwersa ng כֵּן. Hindi nito ipinahihiwatig na hindi kailanman ipinagdiwang ang kapistahan, kundi na hindi ito isinagawa sa paraang kalalarawan lamang.
- source_word: מִימֵי יֵשׁוּעַ בִּן נוּן
  choice: mula pa noong panahon ni Jesua na anak ni Nun
  rationale: Ang “Jesua” ay kumakatawan sa anyong יֵשׁוּעַ na aktuwal na nasa talata; inilalagay sa talababa ang mas pamilyar na pangalang “Josue.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  rationale: Malapit itong katumbas ng Hebreong covenantal ethnonym at pinananatili ang anyong “mga anak” sa halip na agad itong gawing “mga Israelita” o “bayan ng Israel.”
- source_word: וַתְּהִי שִׂמְחָה גְּדוֹלָה מְאֹד
  choice: At nagkaroon ng napakalaking kagalakan
  rationale: Likas na ipinapahayag nito ang napakatinding sama-samang galak at tuwirang sinasalamin ang גְּדוֹלָה מְאֹד.
theological_decisions:
- issue: Pagpapahayag sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  alternative: mga Israelita; bayan ng Israel
  rationale: Ang parirala ay anyong panlalaki sa gramatika at isang nakaugaliang katawagan sa tipang Israel. Pinananatili ng salin ang pormal na larawan nang hindi dinaragdagan o nililimitahan ang saklaw nito.
- issue: Pagkakakilanlan ni יֵשׁוּעַ בִּן נוּן
  choice: Jesua na anak ni Nun
  alternative: Josue na anak ni Nun
  rationale: Ang tekstong Hebreo sa talatang ito ay gumagamit ng יֵשׁוּעַ. Kaya “Jesua” ang nasa pangunahing teksto, habang nililinaw sa talababa na siya ang mas kilala sa Tagalog bilang Josue.
- issue: Saklaw ng pahayag na “hindi ito ginawa nang ganito”
  choice: Tumutukoy sa pagsasagawa sa paraang inilarawan, lalo na sa paggawa at pagtira sa mga kubol
  alternative: Ganap na hindi ipinagdiwang ng Israel ang kapistahan mula noong panahon ni Josue
  rationale: Ang כֵּן ay bumabalik sa naunang kilos at hindi kinakailangang magpahayag ng lubusang kawalan ng anumang pagdiriwang sa buong panahong iyon. Pinananatili ng salin ang pagkakaiba nang hindi nagpapataw ng mas malawak na historikal na konklusyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kapulungan,” “pagkabihag,” at “kubol” bilang malinaw na mga salitang hindi labis na teknikal. Ang talababa [a] ay inilagay kaagad pagkatapos ng pangalang “Nun,” kung saan nararapat ang paliwanag tungkol sa pangalan.
