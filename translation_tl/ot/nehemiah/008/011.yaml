base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/011.yaml
  text: And the Levites were quieting all the people[a], saying, “Be still, for the day is holy[b]; do not be grieved.”
translation:
  language: tl
  text: At pinatatahimik[a] ng mga Levita ang buong bayan habang sinasabi nila, “Tumahimik kayo, sapagkat banal ang araw na ito; huwag kayong malungkot[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinatigil sa pag-iingay” o “pinakakalma.”
    reason: lexical_alternative
  - marker: b
    text: O “huwag kayong magdalamhati” o “huwag kayong mamighati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: At ... ng mga Levita
  rationale: Ginamit ang nakaugaliang katawagang Filipino na “mga Levita” para sa pangkat na naglilingkod sa mga gawaing kaugnay ng templo.
- source_word: מַחְשִׁים
  choice: pinatatahimik
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na pagkilos ng mga Levita upang patahimikin ang nagkakatipong bayan.
- source_word: לְכָל הָעָם
  choice: ang buong bayan
  rationale: Likas na Filipino ito para sa lahat ng nagkakatipong mamamayan at pinananatili ang saklaw ng כָל.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Ipinakikilala nito ang tuwirang sinabi ng mga Levita habang pinatatahimik nila ang bayan.
- source_word: הַסּוּ
  choice: Tumahimik kayo
  rationale: Direktang ipinahahayag nito ang maramihang utos na huwag nang mag-ingay o managhoy; natural at malinaw ito sa modernong Filipino.
- source_word: כִּי הַיּוֹם קָדֹשׁ
  choice: sapagkat banal ang araw na ito
  rationale: Ang “sapagkat” ay naghahayag ng dahilan, at ang “araw na ito” ay likas na tumutukoy sa kasalukuyang okasyon nang hindi nagdaragdag ng diwa.
- source_word: וְאַל תֵּעָצֵבוּ
  choice: huwag kayong malungkot
  rationale: Pinananatili nito ang emosyonal na diwa ng Niphal ng עצב nang hindi ito nililimitahan sa pormal o ritwal na pagluluksa.
theological_decisions:
- issue: Paglalarawan sa araw bilang קָדֹשׁ
  choice: banal
  alternative: sagrado
  rationale: Ang “banal” ay karaniwang salitang biblikal sa Filipino at pinananatili ang bigat ng araw na itinalaga para sa Diyos, samantalang maaaring maging mas pangkalahatan ang “sagrado.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “buong bayan” sa halip na mas teknikal na “kapulungan,” at pinanatili ang payak ngunit teolohikal na mabigat na “banal.”
