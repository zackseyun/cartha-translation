  terminology: Ang “mga Levita” at “banal” ay angkop at matatag na mga katawagang Filipino. Ang “huwag kayong malungkot” ay natural na salin ng utos na huwag maghinagpis, nang hindi ipinipilit na pormal na pagluluksa lamang ang tinutukoy.
