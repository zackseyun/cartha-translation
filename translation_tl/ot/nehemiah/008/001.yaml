  text: וַ/יֵּאָסְפ֤וּ כָל הָ/עָם֙ כְּ/אִ֣ישׁ אֶחָ֔ד אֶל הָ֣/רְח֔וֹב אֲשֶׁ֖ר לִ/פְנֵ֣י שַֽׁעַר הַ/מָּ֑יִם וַ/יֹּֽאמְרוּ֙ לְ/עֶזְרָ֣א הַ/סֹּפֵ֔ר לְ/הָבִ֗יא אֶת סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/001.yaml
  text: And all the people gathered as one man at the square that was before the Water Gate[a], and they told Ezra the scribe to bring the Book of the Law of Moses, which Yahweh had commanded Israel.
translation:
  language: tl
  text: Nagtipon ang buong bayan na parang iisang tao[a] sa liwasang nasa harap ng Pintuan ng Tubig. Sinabi nila kay Ezra, na eskriba, na dalhin ang Aklat ng Kautusan ni Moises, na iniutos ni Yahweh sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “parang iisang lalaki,” isang idyomang nangangahulugang “bilang isa” o “may iisang kalooban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: Nagtipon
  rationale: Ang Niphal na anyo ng אסף ay tumutukoy sa sama-samang pagdating ng bayan; natural at tuwiran ang “nagtipon” sa modernong Tagalog.
- source_word: כָל הָעָם
  choice: ang buong bayan
  rationale: Ipinapahayag nito ang pamayanan bilang isang kabuuan; mas natural dito ang “buong bayan” kaysa “lahat ng mga tao.”
- source_word: כְּאִישׁ אֶחָד
  choice: na parang iisang tao
  rationale: Pinananatili ang kongkretong larawang Hebreo at ang diwa ng kanilang pagkakaisa nang hindi ginagawang isang abstraktong paliwanag lamang.
- source_word: הָרְחוֹב
  choice: liwasan
  rationale: Tumutukoy ito sa isang maluwang at pampublikong lugar sa lungsod, hindi sa karaniwang makabagong kahulugan ng kalye.
- source_word: לִפְנֵי שַׁעַר הַמָּיִם
  choice: nasa harap ng Pintuan ng Tubig
  rationale: Tuwirang inilalarawan ang kinaroroonan ng liwasan kaugnay ng pintuang-bayan.
- source_word: וַיֹּאמְרוּ לְעֶזְרָא
  choice: Sinabi nila kay Ezra
  rationale: Pinananatili ang payak na kahulugan ng אמר; ang kasunod na “na dalhin” ay malinaw na nagpapahayag ng ipinagawa nila.
- source_word: הַסֹּפֵר
  choice: eskriba
  rationale: Karaniwang terminong biblikal para sa kinikilalang tagakopya at dalubhasa sa kautusan; hindi nito ipinapasok ang mas malawak na kahulugan ng “iskolar.”
- source_word: לְהָבִיא
  choice: na dalhin
  rationale: Tumpak at natural na katumbas ng Hiphil infinitive ng בוא sa kontekstong ito.
- source_word: סֵפֶר תּוֹרַת מֹשֶׁה
  choice: ang Aklat ng Kautusan ni Moises
  rationale: Ang סֵפֶר ay maaaring aklat o balumbon; “Aklat” ang malinaw at nakaugaliang katawagan, habang pinananatili ng parirala ang ugnayang ipinahahayag ng Hebreo nang hindi dinaragdagan ang pahayag tungkol sa pagkakasulat nito.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת יִשְׂרָאֵל
  choice: na iniutos ni Yahweh sa Israel
  rationale: Pinananatili ang Israel bilang tuwirang tumanggap ng utos at iniiwasang idagdag ang “para sa Israel,” na hindi tahasang nasa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapakahulugan sa idyomang כְּאִישׁ אֶחָד
  choice: na parang iisang tao
  alternative: bilang isa / may iisang kalooban
  rationale: Pinananatili sa pangunahing teksto ang literal na larawan ng Hebreo at inililinaw sa talababa ang idyomatikong diwa ng nagkakaisang pagkilos.
- issue: Paglalahad sa kaugnayan ng utos, kautusan, at Israel
  choice: na iniutos ni Yahweh sa Israel
  alternative: na iniutos ni Yahweh para sa Israel
  rationale: Mas malapit ito sa sintaks na may pantukoy sa tuwirang layon bago ang Israel at hindi tahimik na nilulutas ang masiksik na pagkakaugnay ng panghalip na “na” sa naunang parirala.
- issue: Pag-render sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ng titulo o ibang tradisyonal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “liwasan” para sa pampublikong bukás na lugar at ang kinikilalang terminong biblikal na “eskriba.”
