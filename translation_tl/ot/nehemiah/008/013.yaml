translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan” upang natural na maipahayag ang sinaunang kaayusang pampamilya, at “mas malalim na pagkaunawa” upang maipakita ang lakas ng pandiwang Hebreo nang hindi nagdaragdag ng tiyak na interpretasyong teolohikal.
