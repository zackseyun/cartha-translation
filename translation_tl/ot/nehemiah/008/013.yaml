base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/013.yaml
  text: And on the second day[a], the heads of the fathers’ houses of all the people, the priests, and the Levites gathered to Ezra the scribe to gain insight into the words of the law.
translation:
  language: tl
  text: At sa ikalawang araw, nagtipon kay Ezra na eskriba ang mga pinuno ng mga angkan ng buong bayan,[a] ang mga pari, at ang mga Levita upang magkamit ng unawa sa mga salita ng Kautusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga pinuno ng mga ama”; idyomang Hebreo ito para sa mga pinuno ng mga angkan o malalawak na sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: At nang ikalawang araw
  rationale: Pinananatili ng “At” ang ugnayan sa naunang salaysay, at likas sa Tagalog ang “nang ikalawang araw” bilang panandang panahon.
- source_word: נֶאֶסְפוּ
  choice: nagtipon
  rationale: Ang Niphal na anyo ay may likas na intransitibong diwang sama-samang pagtipon.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Tumutukoy ang idyomang Hebreo sa mga lider ng mga angkan o malalawak na sambahayan. Mas malinaw at natural ito kaysa sa literal na “mga ulo ng mga ama.”
- source_word: לְכָל הָעָם
  choice: ng buong bayan
  rationale: Ipinakikitang ang mga pinuno ng angkan ay kumakatawan sa kabuuan ng bayan; pinananatili rin ang saklaw ng כָּל.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: ang mga pari, at ang mga Levita
  rationale: Pinananatiling magkahiwalay sa talaan ang dalawang kinikilalang pangkat.
- source_word: אֶל עֶזְרָא הַסֹּפֵר
  choice: kay Ezra na eskriba
  rationale: Ang אֶל ay nagsasaad ng pagtungo kay Ezra. Ang “eskriba” ay ang nakagawiang katawagan sa kaniyang tungkulin bilang tagakopya at dalubhasa sa Kautusan.
- source_word: וּלְהַשְׂכִּיל
  choice: upang magkaroon ng mas malalim na pagkaunawa
  rationale: Inihahayag ng Hiphil infinitive ang layuning magkamit ng unawa o kabatiran, hindi lamang ang payak na pag-alam.
- source_word: אֶל דִּבְרֵי הַתּוֹרָה
  choice: sa mga salita ng Kautusan
  rationale: Pinananatili ang tiyak na pagtukoy sa nilalaman o mga salita ng Torah. Ang “Kautusan” ay angkop sa kontekstong tipanan at pagtuturo.
