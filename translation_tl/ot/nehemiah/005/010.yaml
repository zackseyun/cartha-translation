translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “salapi” at “butil” para sa malinaw ngunit dignified na rehistro. Iniwasan ang sobrang teknikal na terminong pinansiyal, at inilagay sa mga talababa ang tunay na kalabuan ng נְעָרִים, נשׁה, at מַשָּׂא.
