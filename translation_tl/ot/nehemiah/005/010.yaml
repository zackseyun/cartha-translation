  yaml_path: translation/ot/nehemiah/005/010.yaml
  text: And I also[a], my brothers and my young men, are lending them money and grain. Please[c][b], let us stop this burden.
translation:
  language: tl
  text: Pati ako, ang mga kapatid ko, at ang mga tauhan ko[a] ay naniningil sa kanila ng salapi at butil.[b] Pakiusap, itigil natin ang pasaning ito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga tauhan” ay maaari ring isaling “mga kabataang lalaki,” “mga lingkod,” o “mga tagapaglingkod.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagpapautang sa kanila.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagpapautang o sa pagkilos bilang pinagkakautangan, kabilang ang paniningil.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang singiling ito” o “ang utang na ito.” Literal na “ang pasaning ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Pati ako
  rationale: Ipinahahayag ang pandagdag at mariing puwersa ng וְגַם, na iniuugnay ang ginagawa ni Nehemias sa usaping kasalukuyang tinutuligsa.
- source_word: אַחַי
  choice: ang mga kapatid ko
  rationale: Pinananatili ang literal na katawagang pampamilya at ang diwa ng pakikiisa; maaaring tumukoy sa mga kamag-anak o malalapit na kasamahan sa konteksto.
- source_word: וּנְעָרַי
  choice: ang mga tauhan ko
  rationale: Maaaring mangahulugan ang נְעָרִים ng mga kabataang lalaki, lingkod, o tagapaglingkod. Mas natural sa kontekstong pangkat ni Nehemias ang “mga tauhan,” habang itinatala sa talababa ang ibang posibilidad.
- source_word: נֹשִׁים בָּהֶם
  choice: ay nagpapautang sa kanila
  rationale: Ang pandiwa ay tumutukoy sa pagpapautang o pagkilos bilang nagpapautang. Malinaw at natural ang “nagpapautang,” ngunit maaaring may mas negatibong diwa ng paniningil o pagpapataw ng pautang.
- source_word: כֶּסֶף וְדָגָן
  choice: ng salapi at butil
  rationale: Sa konteksto ng pautang, tumutukoy ang כֶּסֶף sa salapi, bagaman literal din itong “pilak.” Ang דָגָן ay butil bilang pangunahing pagkain o ani.
- source_word: נַעַזְבָה נָּא
  choice: Nakikiusap ako, tigilan na natin
  rationale: Inihahatid ng cohortative at נָא ang magalang ngunit mariing panawagan na sama-samang ihinto ang gawain.
- source_word: הַמַּשָּׁא הַזֶּה
  choice: ang pagpapataw na ito
  rationale: Maaaring literal na “pasanin” ang מַשָּׁא, ngunit sa kontekstong pinansiyal maaari itong tumukoy sa ipinapataw na utang o singil. Pinananatili ng “pagpapataw” ang aktibong pang-aapi nang hindi lubusang nilulutas ang leksikal na kalabuan.
