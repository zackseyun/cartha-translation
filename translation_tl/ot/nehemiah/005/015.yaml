  source_fidelity: Tumpak ang pangunahing kahulugan ng talata, kabilang ang mga naunang gobernador, mabibigat na pasanin, tinapay at alak na bukod sa apatnapung siklong pilak, mga nasasakupan, at ang motibong takot sa Diyos. Gayunman, ang “Kumuha sila sa mga ito” ay hindi likas at hindi malinaw ang tinutukoy ng “mga ito”; dapat itong tuwirang iugnay sa mga tao. Ang “naghari sa mga tao” ay maaaring magpahiwatig ng paghahari bilang hari, samantalang ang Hebreo ay tumutukoy sa paggamit ng awtoridad o pamumuno ng mga tauhan.
  naturalness: Makabago at angkop ang pangkalahatang rehistro. Mas natural ang “kinuha nila mula sa mga tao” kaysa “Kumuha sila sa mga ito,” at ang “namuno sa mga tao” ay mas idiomatiko at mas malapit sa saklaw ng pandiwang Hebreo kaysa “naghari sa mga tao.”
