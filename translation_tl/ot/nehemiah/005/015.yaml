  to: Ngunit ang mga dating gobernador na nauna sa akin ay nagpataw ng mabigat na pasanin sa mga tao. Kinuha nila mula sa mga tao ang tinapay at alak, bukod pa sa apatnapung siklong pilak.[a] Maging ang kanilang mga tauhan[b] ay namuno sa mga tao. Ngunit hindi ko ginawa ang ganoon dahil sa takot sa Diyos.[c]
  rationale: Inayos ang malabong panghalip at hindi likas na ayos ng pangungusap upang malinaw na ang mga tao ang pinagmulan ng mga kinuhang pagkain at alak. Pinalitan ang “naghari” ng “namuno” upang maipahayag ang paggamit ng awtoridad nang hindi nagdaragdag ng monarkikong kahulugan. Ginawang mas maingat ang talababa a (“maaaring”) upang hindi lampasan ang ambiguwedad ng pariralang Hebreo.
