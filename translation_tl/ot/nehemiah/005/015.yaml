base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/015.yaml
  text: But the former governors who were before me laid heavy burdens on the people[a], and took from them bread and wine, besides forty shekels of silver. Even their servants ruled over the people. But I did not do so[c][b], because of the fear of God.
translation:
  language: tl
  text: Ngunit ang mga dating gobernador na nauna sa akin ay nagpataw ng mabigat na pasanin sa mga tao. Kinuha nila mula sa mga tao ang tinapay at alak, bukod pa sa apatnapung siklong pilak.[a] Maging ang kanilang mga tauhan[b] ay namuno sa mga tao. Ngunit hindi ko ginawa ang ganoon dahil sa takot sa Diyos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “karagdagan sa apatnapung siklong pilak.” Hindi pangkaraniwan ang pagkakabuo ng pariralang Hebreo, ngunit maaaring ipinahihiwatig nito na ang tinapay at alak ay kinukuha bukod pa sa singil na pilak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga tagapaglingkod,” “mga katulong,” o “mga binata.” Sa kontekstong ito, maaaring mga nakabababang opisyal ng mga gobernador ang tinutukoy.
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring “dahil sa pagpipitagan sa Diyos.” Literal sa Hebreo: “dahil sa takot sa Diyos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפַּחוֹת הָרִאשֹׁנִים אֲשֶׁר לְפָנַי
  choice: ang mga dating gobernador na nauna sa akin
  rationale: Ang פֶּחָה ay gobernador o panlalawigang tagapangasiwa noong panahon ng Persia. Nililinaw ng buong parirala na mga naunang humawak ng tungkulin ang tinutukoy.
- source_word: הִכְבִּידוּ עַל הָעָם
  choice: nagpataw ng mabigat na pasanin sa mga tao
  rationale: Pinananatili nito ang larawang mula sa ugat na כבד, ‘magpabigat,’ habang malinaw na tumutukoy sa mapaniil na mga singil o pananagutan.
- source_word: וַיִּקְחוּ מֵהֶם בְּלֶחֶם וָיַיִן
  choice: Kumuha sila sa mga ito ng tinapay at alak
  rationale: Tuwirang pinananatili ang karaniwang diwa ng לקח, ‘kumuha,’ at ang kongkretong mga bagay na tinapay at alak.
- source_word: אַחַר כֶּסֶף שְׁקָלִים אַרְבָּעִים
  choice: bukod pa sa apatnapung siklong pilak
  rationale: Sa kontekstong ito, malamang na ipinahihiwatig ng אַחַר ang karagdagang singil, bagaman hindi ganap na karaniwan ang pagkakabuo ng parirala; kaya binanggit sa talababa ang alternatibo.
- source_word: נַעֲרֵיהֶם
  choice: kanilang mga tauhan
  rationale: Bagaman maaaring mangahulugang ‘mga binata’ ang נַעַר, sa kontekstong administratibo ay malamang na tumutukoy ito sa mga tagapaglingkod o nakabababang opisyal ng mga gobernador.
- source_word: שָׁלְטוּ עַל הָעָם
  choice: naghari sa mga tao
  rationale: Ipinahahayag ng שׁלט ang paggamit ng pamamahala o kapangyarihan. Ang ‘naghari’ ay maikli at matindi nang hindi tahasang nagdaragdag ng salitang ‘nang-api.’
- source_word: וַאֲנִי לֹא עָשִׂיתִי כֵן
  choice: Ngunit hindi ko ginawa ang ganoon
  rationale: Malinaw nitong pinananatili ang tuwirang paghahambing ni Nehemias sa ginawa ng mga naunang gobernador.
- source_word: מִפְּנֵי יִרְאַת אֱלֹהִים
  choice: dahil sa takot sa Diyos
  rationale: Pinananatili nito ang literal at teolohikal na mahalagang idyomang ‘takot sa Diyos,’ habang ang posibleng diwang pagpipitagan ay inilalagay sa talababa.
theological_decisions:
- issue: Kahulugan ng יִרְאַת אֱלֹהִים
  choice: dahil sa takot sa Diyos
  alternative: dahil sa pagpipitagan sa Diyos; dahil natatakot ako sa Diyos
  rationale: Ang parirala ay maaaring saklawin ang takot, pagpipitagan, at pagkilalang mananagot ang tao sa Diyos. Pinananatili ng saling ito ang tradisyonal na biblikal na tensiyon sa halip na paliitin ito sa takot lamang o paggalang lamang.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang konkretong ‘tinapay at alak,’ ang makasaysayang titulong ‘gobernador,’ at ang biblikal na idyomang ‘takot sa Diyos.’ Ang ‘siklo’ ay ginagamit bilang pangalan ng sinaunang yunit ng timbang at salapi.
