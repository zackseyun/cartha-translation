base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/011.yaml
  text: Please restore to them this very day their fields[a], their vineyards, their olive orchards, and their houses, and the hundredth part of the money, the grain, the new wine[b], and the oil that you have been exacting from them.
translation:
  language: tl
  text: Ibalik ninyo sa kanila ngayong araw din ang kanilang mga bukid, ubasan, taniman ng olibo, at mga bahay, pati ang ikasandaang bahagi[a] ng salapi, butil, bagong alak, at langis na sinisingil ninyo sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang porsiyento.” Malamang na tumutukoy ang Hebreo sa bahaging sinisingil sa kanila mula sa salapi, butil, bagong alak, at langis.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “ipinapataw ninyo sa kanila” o “ipinauutang ninyo sa kanila nang may tubo.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָשִׁיבוּ נָא
  choice: Pakibalik
  rationale: Ang causative imperative ng שׁוב ay nangangahulugang ipabalik o isauli; ipinahahayag ng “paki-” ang pakiusap na lakas ng נָא nang natural sa modernong Tagalog.
- source_word: כְּהַיּוֹם
  choice: ngayong araw din
  rationale: Pinananatili nito ang diin at agarang pagkilos na hinihingi ng parirala.
- source_word: שְׂדֹתֵיהֶם כַּרְמֵיהֶם זֵיתֵיהֶם וּבָתֵּיהֶם
  choice: ang kanilang mga bukid, ubasan, taniman ng olibo, at mga bahay
  rationale: Tuwirang inilalarawan ang magkakatulad na uri ng ari-ariang ibabalik; ang “taniman ng olibo” ay malinaw na tumutukoy sa lupang tinatamnan, hindi lamang sa mga punong olibo.
- source_word: וּמְאַת
  choice: pati ang ikasandaang bahagi
  rationale: Literal itong “isang ikasandaan.” Hindi ito ginawang “isang porsiyento” sa pangunahing teksto upang mapanatili ang anyo at posibleng saklaw ng sinaunang pananalitang pinansiyal.
- source_word: הַכֶּסֶף
  choice: salapi
  rationale: Bagaman maaari ring mangahulugang pilak, ang konteksto ng pagpapautang at paniningil ay tumutukoy sa gamit nito bilang salapi.
- source_word: הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: butil, bagong alak, at langis
  rationale: Pinananatili ng “bagong alak” ang leksikal na pagkakaiba ng תִּירוֹשׁ, samantalang sapat ang “langis” para sa יִצְהָר sa kontekstong agrikultural.
- source_word: נֹשִׁים בָּהֶם
  choice: sinisingil ninyo sa kanila
  rationale: Ipinahahayag nito ang pagkilos ng mga nagpapautang nang hindi labis na nililimitahan ang pandiwa sa teknikal na konsepto lamang ng interes.
theological_decisions:
- issue: Saklaw ng נֹשִׁים sa konteksto ng mapaniil na pagkakautang
  choice: sinisingil ninyo sa kanila
  alternative: ipinapataw ninyong interes sa kanila / ipinauutang ninyo sa kanila nang may tubo
  rationale: Maaaring tumukoy ang pandiwa sa kilos ng isang nagpapautang o sa paniningil. Ang mas malawak na “sinisingil” ay nagpapanatili sa bigat ng pagsaway ngunit hindi tahimik na nagpapasiya na teknikal na interes lamang ang tinutukoy.
- issue: Ugnayan ng “ikasandaang bahagi” sa salapi at mga produktong agrikultural
  choice: Iniuugnay ito sa salapi, butil, bagong alak, at langis, ayon sa ayos ng Hebreo.
  alternative: Maaaring unawain bilang pangkalahatang bahagi o patong na kinukuha sa kanila.
  rationale: Hindi ganap na nililinaw ng maikling konstruksiyon ang mekanismong pinansiyal. Pinananatili ng teksto at talababa ang tunay na kalabuan sa halip na tukuyin ito bilang isang partikular na sistemang pautang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Pakibalik” upang pagsamahin ang mariing utos at magalang na pakiusap, at iniwasan ang makalumang “isinasamo ko.”
