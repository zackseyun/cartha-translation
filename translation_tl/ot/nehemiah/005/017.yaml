translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hapag” bilang likas at dignified na katawagan sa mesang kainan. Inayos ang mahabang simuno gamit ang mga gitling upang maging madaling sundan nang hindi binabago ang ugnayan ng mga parirala.
