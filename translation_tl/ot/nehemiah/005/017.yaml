base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/017.yaml
  text: The Jews and the officials[a], a hundred and fifty men, and those who came to us from the nations that were around us[b], were at my table.
translation:
  language: tl
  text: Ang mga Judio[a] at ang mga opisyal—isang daan at limampung lalaki—pati ang mga pumupunta sa amin mula sa mga bansang nakapaligid sa amin, ay kumakain sa aking hapag[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taga-Juda.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kumakain sa aking hapag” ay nagpapahiwatig na si Nehemias ang naglalaan ng kanilang pagkain bilang bahagi ng kaniyang pagtanggap sa mga panauhin at pangangasiwa.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  choice: ang mga Judio
  rationale: Maaaring tumukoy ang termino sa mga Judio sa pangkalahatan, hindi lamang sa mga naninirahan sa Juda. Ang “mga Judio” ang pinakanatural na salin, habang nananatiling posibleng kahulugan ang “mga taga-Juda.”
- source_word: וְהַסְּגָנִים
  choice: at ang mga pinuno
  rationale: Tumutukoy ito sa mga nakabababang pinunong sibil o tagapangasiwa. Ang “mga pinuno” ay malinaw sa karaniwang Filipino at hindi labis na nagtatakda ng isang tiyak na titulong Persiano.
- source_word: מֵאָה וַחֲמִשִּׁים אִישׁ
  choice: isang daan at limampung lalaki
  rationale: Tuwirang pinananatili ang bilang at ang panlalaking katawagang אִישׁ.
- source_word: וְהַבָּאִים אֵלֵינוּ
  choice: pati ang mga pumupunta sa amin
  rationale: Ang participle ay literal na “ang mga pumupunta/dumarating.” Pinananatili ng aspektong di-ganap na “pumupunta” ang maaaring paulit-ulit o patuloy na pagdating sa kontekstong naglalarawan ng nakagawiang pagtutustos.
- source_word: מִן הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: mula sa mga bansang nasa palibot namin
  rationale: Ang גּוֹיִם ay isinaling “mga bansa,” isang malawak at malapit-sa-pinagmulan na katawagan; iniiwasan nitong ipasok sa teksto ang mas interpretatibo at teolohikal na “mga Hentil.”
- source_word: עַל שֻׁלְחָנִי
  choice: ay kumakain sa aking hapag
  rationale: Literal itong “sa ibabaw/sa aking hapag,” ngunit sa konteksto ay idyoma para sa mga taong pinakakain at tinutustusan ni Nehemias. Ang “kumakain sa aking hapag” ay natural sa Filipino at pinananatili ang larawan ng hapag.
