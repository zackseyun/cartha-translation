revisions:
- from: Pagkatapos kong pag-isipan itong mabuti, iniharap ko ang paratang laban sa mga maharlika at mga pinuno. Sinabi ko sa kanila, “Bawat isa sa inyo ay naniningil ng patubo sa sarili niyang kapatid!”[a] Kaya nagpatawag ako ng isang malaking kapulungan laban sa kanila.[b]
  to: Pagkatapos kong pag-isipan itong mabuti, iniharap ko ang mga paratang laban sa mga maharlika at mga opisyal. Sinabi ko sa kanila, “Bawat isa sa inyo ay naniningil ng patubo mula sa kapuwa niyang kapatid!”[a] At nagpatawag ako ng isang malaking kapulungan laban sa kanila.[b]
  rationale: Inayos ang mga katagang maaaring magpahiwatig ng literal na magkapatid at pinalapit ang katawagan sa mga administratibong opisyal. Pinalitan din ang pangatnig na nagdaragdag ng hindi tahasang relasyong sanhi. Hindi binago ang kahulugan o ang pampublikong-panghukuman na tono ng talata.
