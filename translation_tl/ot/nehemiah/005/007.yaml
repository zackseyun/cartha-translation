base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/007.yaml
  text: Then I took counsel with myself[a], and I brought charges against the nobles and the officials, and I said to them, “You are exacting interest[c][b], each from his brother.” And I assembled a great assembly against them.
translation:
  language: tl
  text: Pagkatapos kong pag-isipan itong mabuti, iniharap ko ang mga paratang laban sa mga maharlika at mga opisyal. Sinabi ko sa kanila, “Bawat isa sa inyo ay naniningil ng patubo mula sa kapuwa niyang kapatid!”[a] At nagpatawag ako ng isang malaking kapulungan laban sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Bawat isa sa inyo ay nagpapataw ng patubo sa kapuwa niyang kapatid.” Literal na gumagamit ang Hebreo ng “kapatid,” na nagbibigay-diin sa pagsingil sa kapuwa Israelita.
    reason: lexical_alternative
  - marker: b
    text: Literal, “naglagay ako laban sa kanila ng isang malaking kapulungan,” isang idyoma para sa pagpapatawag ng malaking pampublikong pagtitipon upang harapin sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵךְ לִבִּי עָלַי
  choice: Pagkatapos kong pag-isipan itong mabuti
  rationale: Ipinahahayag ng idyomang Hebreo ang panloob at maingat na pagdidilidili bago kumilos; natural itong naipapahayag sa makabagong Tagalog nang hindi ginagawang simpleng damdamin ng galit.
- source_word: וָאָרִיבָה
  choice: iniharap ko ang paratang laban sa
  rationale: Ang ריב ay maaaring tumukoy sa pakikipagtalo o paghaharap ng kaso. Ang napiling parirala ay nagpapanatili sa mapanumbat at bahagyang panghukuman na puwersa ng konteksto.
- source_word: הַחֹרִים
  choice: mga maharlika
  rationale: Karaniwang katawagan sa mga kabilang sa mataas na antas ng lipunan sa Juda; malinaw at marangal sa Tagalog.
- source_word: הַסְּגָנִים
  choice: mga pinuno
  rationale: Tumutukoy sa mga opisyal o tagapangasiwang nasa pamahalaan. Ang “mga pinuno” ay natural at hindi labis na nagtatakda ng isang tiyak na katungkulan.
- source_word: מַשָּׁא ... נשאים
  choice: naniningil ng patubo
  rationale: Sa kontekstong pangkabuhayan, tumutukoy ito sa pagpapataw o pagsingil ng dagdag sa pautang. Mas madaling maunawaan ang “patubo” kaysa sa teknikal o posibleng mapanlinlang na “usura.”
- source_word: אִישׁ בְּאָחִיו
  choice: Bawat isa sa inyo ... sa sarili niyang kapatid
  rationale: Pinananatili nito ang distributibong diwa at ang mahalagang wikang pampamilya tungkol sa kapuwa Israelita.
- source_word: וָאֶתֵּן עֲלֵיהֶם קְהִלָּה גְדוֹלָה
  choice: nagpatawag ako ng isang malaking kapulungan laban sa kanila
  rationale: Ang literal na “naglagay/nagbigay laban sa kanila ng malaking kapulungan” ay isang idyoma para sa pagtitipon ng malaking publikong pagpupulong upang harapin sila.
