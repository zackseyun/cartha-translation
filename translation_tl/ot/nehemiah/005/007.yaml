  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maharlika,” “mga pinuno,” at “kapulungan” upang mapanatili ang pampublikong at pormal na tagpo, habang ang ayos ng pangungusap ay nananatiling madaling maunawaan ng karaniwang mambabasa.
