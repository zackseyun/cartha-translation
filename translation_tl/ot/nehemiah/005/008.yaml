  source_fidelity: 'Tumpak sa kabuuan ang salin: naipahahayag nito ang pagbili/pagpapalaya sa mga kapatid na Judio, ang lawak na ayon sa kakayahan, ang mariing pagsaway sa mga kausap, at ang pananahimik nila. Ang huling sugnay ay nananatiling mahirap at elliptikal sa Hebreo; ang pahayag na pagbasa sa pangunahing teksto, kasama ng retorikal na alternatibo sa talababa, ay angkop. Gayunman, ang “mauuwi sa muling pagbili ng sarili nilang bayan” sa talababa ay hindi malinaw at bahagyang naililihis ang relasyong ipinahihiwatig ng לָנוּ (“sa atin”).'
  naturalness: Natural at marangal ang pangunahing teksto. Ang “mga kapatid” ay likas at hindi sapilitang panlalaki sa modernong Tagalog. Pinakinis ang “binili nating pabalik” tungo sa mas natural na “muli nating binili,” nang pinananatili ang diwa ng pagbili pabalik.
  terminology: Ang “mga kapatid nating Judio,” “mga bansa,” at “ipinagbibili” ay angkop. Hindi kinakailangang palitan ng “tinubos,” yamang ang kongkretong transaksiyon ng pagbili ang nasa kontekstong ito. Inayos ang talababa upang malinaw na ang balintunang bunga ay ang pagbebenta ng kanilang mga kapatid pabalik sa sariling pamayanan.
