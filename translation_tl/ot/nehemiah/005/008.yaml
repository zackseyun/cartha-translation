base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/008.yaml
  text: And I said to them[a], “We have bought back our Jewish brothers who were sold to the nations, as much as we were able. But now you yourselves are even selling your brothers[b], and they must be sold to us!” Then they were silent and found nothing to say.
translation:
  language: tl
  text: At sinabi ko sa kanila, “Muli nating binili ang mga kapatid nating Judio[a] na ipinagbili sa mga bansa, hanggang sa abot ng ating makakaya. Ngunit kayo mismo ay ipinagbibili rin ang inyong mga kapatid, at ipagbibili naman sila sa atin!”[b] Kaya tumahimik sila at wala silang masabing anuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga kapwa nating Judio.” Ang Hebreo ay literal na “ating mga kapatid, ang mga Judio,” isang katawagang pampamilya para sa mga kasapi ng kanilang pamayanan.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring unawain bilang retorikal na tanong: “at ipagbibili ba naman sila sa atin?” Maikli ang sugnay sa Hebreo at maaaring tumukoy sa balintunang bunga na ang kanilang mga kapatid ay mauuwi sa muling pagbili sa kanila ng sarili nilang kababayan.'
    reason: alternative_reading
lexical_decisions:
- source_word: קָנִינוּ
  choice: binili nating pabalik
  rationale: Ipinahahayag nito ang pagbili upang mapalaya ang mga kapwa Judio mula sa pagkakaalipin, nang hindi agad inilalagay rito ang mas malawak na teolohikal na kahulugan ng “tinubos.”
- source_word: אַחֵינוּ הַיְּהוּדִים
  choice: mga kapatid nating Judio
  rationale: Pinananatili ang katawagang pampamilya at ang tuwirang pagtukoy sa mga Judio; likas din ito sa makabagong Tagalog.
- source_word: הַנִּמְכָּרִים לַגּוֹיִם
  choice: na ipinagbili sa mga bansa
  rationale: Tuwirang isinasalin ang pasibong anyo at ang גּוֹיִם bilang “mga bansa,” sa halip na gumamit ng katawagang mas nakaugnay sa Bagong Tipan.
- source_word: כְּדֵי בָנוּ
  choice: hanggang sa abot ng ating makakaya
  rationale: Likas na idyomang Tagalog ito para sa lawak na pinahihintulutan ng kanilang kakayahan at yaman.
- source_word: וְגַם אַתֶּם
  choice: Ngunit kayo mismo ... rin
  rationale: Ipinakikita ng “kayo mismo” at “rin” ang mariing paghahambing at pagsaway sa mga kausap.
- source_word: תִּמְכְּרוּ
  choice: ipinagbibili
  rationale: Ang aspektong imperpektibo/progresibo sa Tagalog ay angkop sa kasalukuyang gawaing isinusumbat ni Nehemias.
- source_word: וְנִמְכְּרוּ לָנוּ
  choice: at ipagbibili naman sila sa atin
  rationale: 'Pinananatili ang maikli at matalim na bunga ng kanilang ginagawa: ang mga kapatid nila ay mauuwi sa muling pagbili ng sarili nilang pamayanan. Ang posibleng pagbasa bilang tanong ay inilagay sa talababa.'
- source_word: וַיַּחֲרִישׁוּ
  choice: tumahimik sila
  rationale: Maikli, tuwiran, at natural na katumbas ng pandiwa sa kontekstong ito.
- source_word: וְלֹא מָצְאוּ דָּבָר
  choice: wala silang masabing anuman
  rationale: Natural na Tagalog para sa idyomang Hebreo na literal na nagsasabing wala silang natagpuang salita o sagot.
theological_decisions:
- issue: Ang panlalaking katawagang pampamilya na אַחֵינוּ / אַחֵיכֶם
  choice: mga kapatid
  alternative: mga kapwa Judio
  rationale: Sa Tagalog, ang “kapatid” ay hindi kinakailangang may tiyak na kasarian, kaya napapanatili ang larawan ng ugnayang pampamilya nang hindi nagdaragdag ng kasariang hindi hayag sa salin.
- issue: Ang di-tiyak na puwersa ng וְנִמְכְּרוּ לָנוּ
  choice: 'pahayag ng bunga: “at ipagbibili naman sila sa atin”'
  alternative: 'retorikal na tanong: “at ipagbibili ba naman sila sa atin?”'
  rationale: Napapanatili sa pangunahing teksto ang mariing, halos balintunang bunga ng paratang, habang kinikilala sa talababa na maaaring unawain ang maikling sugnay bilang retorikal na tanong.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “binili pabalik” sa halip na “tinubos” upang unahin ang kongkretong transaksiyon ng pagpapalaya sa kontekstong ito. Pinanatili ang mariing pagsaway at ang tunay na kalabuan ng huling sugnay sa pamamagitan ng talababa.
