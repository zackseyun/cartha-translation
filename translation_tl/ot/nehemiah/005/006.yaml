  yaml_path: translation/ot/nehemiah/005/006.yaml
  text: I became very angry when I heard their outcry and these words[a].
translation:
  language: tl
  text: Galit na galit ako nang marinig ko ang kanilang daing at ang mga salitang ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at ang mga usaping ito.” Maaaring tumukoy ang salitang Hebreo sa mga salitang binigkas o sa mga bagay na iniulat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לִי מְאֹד
  choice: Galit na galit ako
  rationale: Ang idyomang חרה + ל ay nagsasaad ng matinding pag-alab ng galit. Likas at malinaw sa modernong Tagalog ang “galit na galit ako,” at naipapahayag nito ang diin ng מְאֹד nang hindi gumagamit ng di-likas na literal na larawan.
- source_word: כַּאֲשֶׁר שָׁמַעְתִּי
  choice: nang marinig ko
  rationale: Ipinakikilala ng כַּאֲשֶׁר dito ang pagkakataon o pangyayaring nagbunsod ng galit, at tuwirang isinasalin ng “nang marinig ko” ang temporal na diwa.
- source_word: זַעֲקָתָם
  choice: kanilang daing
  rationale: Ang זְעָקָה ay sigaw mula sa matinding paghihirap o kawalang-katarungan. Ang “daing” ay dignificado at likas na Tagalog na nagpapahiwatig kapwa ng paghihirap at paghiling ng katarungan.
- source_word: וְאֵת הַדְּבָרִים הָאֵלֶּה
  choice: at ang mga salitang ito
  rationale: Maaaring tumukoy ang דְּבָרִים sa mga sinabi o sa mga bagay/usaping iniulat. Pinananatili ng “mga salitang ito” ang pinakadirektang kahulugan sa konteksto ng narinig ni Nehemias, habang inilalahad sa talababa ang tunay na alternatibo.
