  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naglaan ng sarili” upang maging natural ngunit mapanatili ang diin sa personal na pakikibahagi; pinanatili sa talababa ang kongkretong larawang “humawak.”
