base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/016.yaml
  text: And I also applied myself to the work on this wall[a], and we did not buy any field[b], and all my young men were gathered there for the work.
translation:
  language: tl
  text: At nagsikap din ako sa gawain sa pader na ito[a], at hindi kami bumili ng anumang bukid, at lahat ng tauhan ko[b] ay nagkatipon doon para sa gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “humawak ako sa gawain sa pader na ito,” ibig sabihin, personal akong nagsikap dito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga kabataang lalaki ko,” “mga lingkod ko,” o “mga tagapaglingkod ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: At ... din ako
  rationale: Pinananatili ang pang-ugnay at panandang pandagdag na nagdurugtong sa naunang konteksto.
- source_word: בִּמְלֶאכֶת הַחוֹמָה הַזֹּאת
  choice: sa gawain sa pader na ito
  rationale: Likas na Filipino para sa paggawa o trabahong isinasagawa sa tinutukoy na pader, nang hindi idinaragdag ang 'lungsod' na hindi tahasang nasa Hebreo.
- source_word: הֶחֱזַקְתִּי
  choice: naglaan ... ng sarili
  rationale: Ipinahahayag ang aktibong personal na pag-uukol ng sarili sa gawain; ang literal na larawan ay 'humawak/nanghawakan' at inilalagay sa talababa.
- source_word: וְשָׂדֶה לֹא קָנִינוּ
  choice: Hindi kami bumili ng anumang bukid
  rationale: Pinananatili ang unang panauhang maramihan ng pandiwa at ang di-tiyak na diwa ng pangngalang isahan.
- source_word: נְעָרַי
  choice: mga tauhan ko
  rationale: Sa konteksto, tumutukoy ito sa mga lalaking nasa paglilingkod o pangkat ni Nehemias; iniiwasan ng 'tauhan' ang di-tiyak na pagpapasya kung sila ay mga kabataan, lingkod, o tagapaglingkod.
- source_word: קְבוּצִים שָׁם עַל הַמְּלָאכָה
  choice: nagkatipon doon para sa gawain
  rationale: Inihahatid ang kalagayang sama-samang naroon at nakatalaga sa gawain sa natural na Filipino.
