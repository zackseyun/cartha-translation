  text: וַ/תְּהִ֨י צַעֲקַ֥ת הָ/עָ֛ם וּ/נְשֵׁי/הֶ֖ם גְּדוֹלָ֑ה אֶל אֲחֵי/הֶ֖ם הַ/יְּהוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/001.yaml
  text: There arose a great outcry from the people and their wives against their Jewish brothers[a].
translation:
  language: tl
  text: Nagkaroon ng matinding daing ang mga tao at ang kanilang mga asawa laban sa kanilang mga kapatid na Judio[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang mga kapatid na taga-Juda.” Maaaring tumukoy ang salitang Hebreo sa mga Judio o sa mga taga-Juda, depende kung etniko o panrehiyong pagkakakilanlan ang binibigyang-diin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: Nagkaroon
  rationale: Ipinakikilala ng anyong pasalaysay ang paglitaw ng isang bagong pangyayari. Likas sa modernong Tagalog ang “Nagkaroon” at hindi ito nagdaragdag ng tahasang panandang temporal na wala naman sa Hebreo.
- source_word: צַעֲקַת
  choice: daing
  rationale: Ipinahihiwatig ng salita ang sigaw dahil sa matinding hirap o protesta. Ang “daing” ay angkop sa konteksto ng karaingan at pang-aapi, at hindi kasing-hina ng simpleng “reklamo.”
- source_word: הָעָם
  choice: ang mga tao
  rationale: Malawak ang kahulugan ng terminong Hebreo. Hindi nito tahasang tinutukoy ang isang partikular na uring panlipunan, kaya hindi iyon idinagdag sa salin.
- source_word: וּנְשֵׁיהֶם
  choice: at ang kanilang mga asawa
  rationale: Sa anyong ito, ang נָשִׁים ay likas na tumutukoy sa kanilang mga asawang babae. Pinananatili ng salin ang hayagang pagbanggit sa mga babaeng kasama sa pagdaing.
- source_word: גְּדוֹלָה
  choice: matinding
  rationale: Tinutukoy ng pang-uri ang tindi o laki ng daing. Mas natural sa Tagalog ang “matinding daing” kaysa sa literal ngunit hindi gaanong likas na “malaking daing.”
- source_word: אֶל
  choice: laban sa
  rationale: Bagaman maaari itong literal na mangahulugang “sa” o “patungo sa,” ipinakikita ng konteksto ng karaingan na ang kasunod ang pinatutungkulan ng protesta.
- source_word: אֲחֵיהֶם
  choice: kanilang mga kapatid
  rationale: Pinananatili ang larawan ng magkakapatid at ang diwa ng pagkakaisa at pananagutan sa loob ng komunidad, sa halip na gawing “mga kababayan” lamang.
- source_word: הַיְּהוּדִים
  choice: na Judio
  rationale: Likas itong panuring sa “mga kapatid” at malinaw na nagpapahayag ng pagkakakilanlan ng pangkat. Posible rin ang panrehiyong kahulugang “taga-Juda,” kaya inilagay iyon sa talababa.
theological_decisions:
- issue: Saklaw ng katawagang יְהוּדִים
  choice: Judio
  alternative: taga-Juda
  rationale: Maaaring idiin ng termino ang pagkakakilanlang etniko at panrelihiyon o ang kaugnayan sa rehiyon ng Juda. Sa konteksto, malinaw na ipinakikita ng “Judio” ang kawalang-katarungang nagaganap sa loob mismo ng kanilang komunidad, habang pinananatili sa talababa ang posibleng panrehiyong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matinding daing” upang likas na maipahayag ang tindi ng צְעָקָה, at pinanatili ang “mga kapatid” upang hindi mawala ang diin sa pagkakaisa ng komunidad at sa bigat ng paglabag laban sa sariling mga kababayan.
