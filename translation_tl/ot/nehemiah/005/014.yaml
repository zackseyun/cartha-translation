source:
  edition: WLC
  text: גַּ֞ם מִ/יּ֣וֹם אֲשֶׁר צִוָּ֣ה אֹתִ֗/י לִ/הְי֣וֹת פֶּחָ/ם֮ בְּ/אֶ֣רֶץ יְהוּדָה֒ מִ/שְּׁנַ֣ת עֶשְׂרִ֗ים וְ֠/עַד שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁתַּ֨יִם֙ לְ/אַרְתַּחְשַׁ֣סְתְּא הַ/מֶּ֔לֶךְ שָׁנִ֖ים שְׁתֵּ֣ים עֶשְׂרֵ֑ה אֲנִ֣י וְ/אַחַ֔/י לֶ֥חֶם הַ/פֶּ֖חָה לֹ֥א אָכַֽלְתִּי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/014.yaml
  text: Also[a], from the day that he appointed me to be governor in the land of Judah, from the twentieth year until the thirty-second year of King Artaxerxes—twelve years—I and my brothers did not eat the governor’s food allowance.
translation:
  language: tl
  text: Bukod dito, mula noong araw na italaga niya ako bilang gobernador nila sa lupain ng Juda—mula sa ikadalawampung taon hanggang sa ikatatlumpu’t dalawang taon ni Haring Artajerjes, labindalawang taon—ako at ang mga kapatid ko ay hindi kumain ng laang pagkain ng gobernador.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tinapay ng gobernador”; tumutukoy ito sa mga pagkain o probisyong nakalaan para sa gobernador.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Bukod dito
  rationale: Ipinakikilala nito ang karagdagang punto sa pagtatanggol ni Nehemias at pinananatili ang pandagdag na diwa ng salitang Hebreo.
- source_word: מִיּוֹם אֲשֶׁר
  choice: mula nang araw na
  rationale: Likas na pariralang Tagalog ito para sa panimulang punto ng isang panahong nagpapatuloy.
- source_word: צִוָּה אֹתִי לִהְיוֹת
  choice: italaga niya akong maging
  rationale: Bagaman karaniwang nangangahulugang “mag-utos” ang pandiwa, sa kontekstong administratibo ay tumutukoy ito sa opisyal na paghirang sa isang tungkulin.
- source_word: פֶּחָם
  choice: gobernador nila
  rationale: Ang פֶּחָה ay gobernador ng isang lalawigan sa ilalim ng Persia, at pinananatili ng “nila” ang panlalaking maramihang hulapi sa anyong Hebreo.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: sa lupain ng Juda
  rationale: Tuwirang pinananatili ang heograpikong pananalita ng Hebreo nang hindi ipinapalit ang mas interpretibong “lalawigan.”
- source_word: מִשְּׁנַת עֶשְׂרִים וְעַד שְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: mula sa ikadalawampung taon hanggang sa ikatatlumpu't dalawang taon ni Haring Artajerjes
  rationale: Malinaw nitong ipinapahayag ang pormula ng pagbilang ayon sa mga taon ng paghahari habang pinananatili ang eksaktong kronolohiya.
- source_word: שָׁנִים שְׁתֵּים עֶשְׂרֵה
  choice: sa loob ng labindalawang taon
  rationale: Nililinaw nito sa natural na Tagalog ang buod ng saklaw ng mga taong binanggit.
- source_word: אֲנִי וְאַחַי
  choice: ako at ang mga kapatid ko
  rationale: Pinananatili ang literal at panlalaking katawagang “mga kapatid,” bagaman maaaring kasama sa konteksto ang malalapit na kasamahan.
- source_word: לֶחֶם הַפֶּחָה
  choice: pagkaing laan sa gobernador
  rationale: Ang לֶחֶם ay literal na “tinapay” ngunit dito ay tumutukoy sa pagkain o probisyong nakalaan sa gobernador; malinaw ang idyomatikong salin habang pinananatili ang literal na alternatibo sa talababa.
- source_word: לֹא אָכַלְתִּי
  choice: hindi kumain
  rationale: Pinananatili ang kongkretong pandiwang “kumain” at inilalahad ang nakagawiang kilos sa loob ng tinukoy na panahon.
theological_decisions:
- issue: Saklaw ng אַחַי
  choice: mga kapatid ko
  alternative: mga kababayan ko; mga kasamahan ko
  rationale: Tahasang panlalaking maramihan ang Hebreo. Hindi pinalalawak o nililimitahan ng salin ang posibleng panlipunang saklaw nito.
- issue: Literal o idyomatikong salin ng לֶחֶם הַפֶּחָה
  choice: pagkaing laan sa gobernador
  alternative: tinapay ng gobernador; mga probisyon ng gobernador
  rationale: Sa konteksto, tumutukoy ang parirala sa nakaugaliang materyal na suporta ng gobernador, hindi lamang sa tinapay. Pinananatili sa talababa ang literal na anyo upang hindi maitago ang metapora.
- issue: Hulapi sa פֶּחָם
  choice: gobernador nila
  alternative: gobernador
  rationale: Pinananatili ang hulaping ikatlong panauhang panlalaking maramihan sa tekstong Masoretiko sa halip na tahimik itong alisin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Artajerjes,” ang nakaugaliang anyong Filipino ng pangalan, at inayos ang mahabang pangungusap sa pamamagitan ng mga gatlang upang madaling masundan ang kronolohiya.
