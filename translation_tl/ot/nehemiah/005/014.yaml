revisions:
- from: Bukod dito, mula nang araw na italaga niya akong maging gobernador nila sa lupain ng Juda—mula sa ikadalawampung taon hanggang sa ikatatlumpu't dalawang taon ni Haring Artajerjes, sa loob ng labindalawang taon—ako at ang mga kapatid ko ay hindi kumain ng pagkaing laan sa gobernador.[a]
  to: Bukod dito, mula noong araw na italaga niya ako bilang gobernador nila sa lupain ng Juda—mula sa ikadalawampung taon hanggang sa ikatatlumpu’t dalawang taon ni Haring Artajerjes, labindalawang taon—ako at ang mga kapatid ko ay hindi kumain ng laang pagkain ng gobernador.[a]
  rationale: Inayos ang di-likas na “mula nang araw na” tungo sa “mula noong araw na.” Pinalitan ang “maging” ng mas natural na “bilang” sa pagtukoy sa tungkulin, at nilinaw ang לֶחֶם הַפֶּחָה bilang “laang pagkain ng gobernador,” habang pinananatili ang literal na “tinapay ng gobernador” sa talababa. Walang binagong kahulugan o idinagdag na interpretasyong doktrinal.
