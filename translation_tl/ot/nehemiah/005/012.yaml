id: NEH.5.12
reference: Nehemiah 5:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ נָשִׁ֗יב וּ/מֵ/הֶם֙ לֹ֣א נְבַקֵּ֔שׁ כֵּ֣ן נַעֲשֶׂ֔ה כַּ/אֲשֶׁ֖ר אַתָּ֣ה אוֹמֵ֑ר וָ/אֶקְרָא֙ אֶת הַ/כֹּ֣הֲנִ֔ים וָֽ/אַשְׁבִּיעֵ֔/ם לַ/עֲשׂ֖וֹת כַּ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/012.yaml
  text: And they said[a], “We will restore it, and from them we will require nothing; we will do as you say.” Then I called the priests and made them swear to do according to this word.
translation:
  language: tl
  text: Sinabi nila, “Ibabalik namin ang mga iyon, at wala na kaming hihingin sa kanila. Gagawin namin ang sinasabi mo.” Pagkatapos, ipinatawag ko ang mga pari at ipinanumpa ko sila na gawin ayon sa salitang ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bagay na ito” o “pangakong ito.” Ang Hebreong דָּבָר (davar) ay maaaring mangahulugang “salita,” “bagay,” o, sa kontekstong ito, isang pangakong pinagtibay.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁיב
  choice: Ibabalik namin ang mga iyon
  rationale: Ang Hiphil ng שׁוב ay tumutukoy rito sa pagsasauli ng mga ari-arian at halagang binanggit sa naunang talata. Hindi tahasang nakasaad ang layon sa Hebreo, kaya ginamit ang “mga iyon” upang tumukoy sa mga naunang nabanggit nang hindi inuulit ang buong talaan.
- source_word: וּמֵהֶם לֹא נְבַקֵּשׁ
  choice: wala na kaming hihingin sa kanila
  rationale: Maaaring mangahulugan ang בקש ng paghahanap, paghingi, o pagsingil. Sa kontekstong pangkabuhayan, ipinahihiwatig nito ang pagtalikod sa anumang karagdagang paghahabol; pinananatili ng “hihingin” ang lawak ng pandiwa nang hindi ito nililimitahan sa interes lamang.
- source_word: כֵּן נַעֲשֶׂה כַּאֲשֶׁר אַתָּה אוֹמֵר
  choice: Gagawin namin ang sinasabi mo
  rationale: Likas sa modernong Tagalog ang pariralang ito at malinaw nitong ipinapahayag ang pagsang-ayon at pagsunod na taglay ng כֵּן at כַּאֲשֶׁר.
- source_word: וָאֶקְרָא אֶת־הַכֹּהֲנִים
  choice: Pagkatapos, ipinatawag ko ang mga pari
  rationale: Ang קרא na may tuwirang layon ay nangangahulugang tawagin o ipatawag. Ipinakikita ng “Pagkatapos” ang sunod-sunod na kilos sa salaysay.
- source_word: וָאַשְׁבִּיעֵם
  choice: pinanumpa ko sila
  rationale: Ang Hiphil ng שׁבע ay nangangahulugang pasumpain ang isang tao. Pinananatili ng “sila” ang panghalip ng Hebreo at hindi tahasang nilulutas kung sino ang tinutukoy nito.
- source_word: לַעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: na tuparin ang salitang ito
  rationale: Bagaman literal na “gawin ayon sa salitang ito,” mas natural sa Tagalog ang “tuparin ang salitang ito” para sa isang pahayag na pinagtitibay sa panunumpa. Pinananatili ang “salita” bilang pangunahing salin ng דָּבָר, habang inilalahad sa talababa ang iba pang posibleng kahulugan.
theological_decisions:
- issue: Ang tinutukoy ng panghalip sa וָאַשְׁבִּיעֵם
  choice: Panatilihin ang payak na “sila”
  alternative: Tukuying tahasan na ang mga pinuno at opisyal ang pinanumpa, o na ang mga pari ang pinanumpa
  rationale: Maaaring iugnay ng mambabasa ang panghalip sa pinakamalapit na “mga pari,” ngunit ipinahihiwatig ng daloy ng tagpo na maaaring ang mga nagpautang na nangako ang pinanumpa sa harap ng mga pari. Hindi nilulutas ng salin ang tunay na kalabuan ng reperente.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ipinatawag,” “pinanumpa,” at “tuparin” bilang likas ngunit dignidad na mga salitang angkop sa isang pampublikong kasunduan at panunumpa.
