source:
  edition: WLC
  text: וַ/אֲשֶׁר֩ הָיָ֨ה נַעֲשֶׂ֜ה לְ/י֣וֹם אֶחָ֗ד שׁ֣וֹר אֶחָ֞ד צֹ֠אן שֵׁשׁ בְּרֻר֤וֹת וְ/צִפֳּרִים֙ נַֽעֲשׂוּ לִ֔/י וּ/בֵ֨ין עֲשֶׂ֧רֶת יָמִ֛ים בְּ/כָל יַ֖יִן לְ/הַרְבֵּ֑ה וְ/עִם זֶ֗ה לֶ֤חֶם הַ/פֶּחָה֙ לֹ֣א בִקַּ֔שְׁתִּי כִּֽי כָֽבְדָ֥ה הָ/עֲבֹדָ֖ה עַל הָ/עָ֥ם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/018.yaml
  text: What was prepared for each day was one ox and six choice sheep[a]; also birds were prepared for me, and every ten days an abundance of all kinds of wine. Yet even with this, I did not demand the governor’s food allowance[b], because the service was heavy on this people.
translation:
  language: tl
  text: Ang inihahanda para sa bawat araw ay isang baka at anim na piling tupa[a]. Inihahanda rin para sa akin ang mga ibon, at bawat sampung araw ay may saganang alak ng lahat ng uri. Gayunman, sa kabila ng lahat ng ito, hindi ko hiningi ang panustos na nauukol sa gobernador[b], sapagkat mabigat ang pasaning nakaatang sa bayang ito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring tumukoy nang mas malawak sa maliliit na alagang hayop mula sa kawan, kabilang ang mga tupa at kambing.
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “tinapay ng gobernador”; maaari ring isalin na “pagkain ng gobernador” o “panustos ng gobernador.” Malamang na tumutukoy ito sa opisyal na panustos na nauukol sa katungkulan ng gobernador.'
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin: “mabigat ang gawain” o “napakahirap ng paglilingkod.” Binibigyang-diin ng Hebreo ang bigat ng dinaranas ng bayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר הָיָה נַעֲשֶׂה לְיוֹם אֶחָד
  choice: Ang inihahanda para sa bawat araw
  rationale: Ang pasibong נַעֲשֶׂה ay tumutukoy sa paghahanda ng pagkain. Ang לְיוֹם אֶחָד ay dami para sa isang karaniwang araw, kaya likas sa Tagalog ang “para sa bawat araw.”
- source_word: שׁוֹר אֶחָד
  choice: isang baka
  rationale: Ang שׁוֹר ay hayop na bovine; ang “baka” ay malinaw at hindi labis na nagtatakda ng kasarian gaya ng “toro.”
- source_word: צֹאן שֵׁשׁ בְּרֻרוֹת
  choice: anim na piling tupa
  rationale: Ipinahihiwatig ng בְּרֻרוֹת na pinili o mataas ang uri ng mga hayop. Ginamit ang “tupa” bilang likas na salin sa konteksto ng pagkaing inihahanda, habang inilalahad sa talababa ang mas malawak na saklaw ng צֹאן.
- source_word: וְצִפֳּרִים נַעֲשׂוּ לִי
  choice: Inihahanda rin para sa akin ang mga ibon
  rationale: Malawak ang kahulugan ng צִפֳּרִים na “mga ibon.” Pinananatili ng “inihahanda” ang pasibong anyo at kontekstong panghandaang pagkain.
- source_word: וּבֵין עֲשֶׂרֶת יָמִים
  choice: tuwing ikasampung araw
  rationale: Ang parirala ay nagsasaad ng paulit-ulit na pagitan ng sampung araw, hindi lamang ng isang di-tiyak na panahon.
- source_word: בְּכָל יַיִן לְהַרְבֵּה
  choice: sagana ang lahat ng uri ng alak
  rationale: Pinananatili nito kapwa ang dami na ipinahihiwatig ng לְהַרְבֵּה at ang lawak o pagkakaiba-iba na ipinahihiwatig ng בְּכָל.
- source_word: וְעִם זֶה
  choice: Gayunman, sa kabila ng lahat ng ito
  rationale: 'Ipinakikita ng parirala ang malinaw na pagsalungat: sa kabila ng malalaking gastusin sa pagkain, hindi ginamit ni Nehemias ang opisyal na laang pagkain.'
- source_word: לֶחֶם הַפֶּחָה
  choice: laang pagkain para sa gobernador
  rationale: Literal itong “tinapay ng gobernador,” ngunit ang לֶחֶם ay maaaring tumukoy sa pagkain o panustos sa kabuuan. Ipinahihiwatig ng konteksto ang opisyal na rasyong kalakip ng katungkulan.
- source_word: לֹא בִקַּשְׁתִּי
  choice: hindi ko hiningi
  rationale: Ang בקשׁ ay maaaring mangahulugang humingi, maghanap, o igiit. Ang “hindi ko hiningi” ay nananatiling malapit sa Hebreo at hindi labis na pinatitindi bilang sapilitang paniningil.
- source_word: כִּי כָבְדָה הָעֲבֹדָה עַל הָעָם הַזֶּה
  choice: sapagkat mabigat ang pasaning nakaatang sa bayang ito
  rationale: Ang כבד ay nagpapahayag ng bigat, at ang עֲבֹדָה ay maaaring trabaho, paglilingkod, o pasanin. Ang salin ay likas sa Tagalog at pinananatili ang larawan ng bigat na dinaranas ng bayan.
theological_decisions:
- issue: Ang sosyo-ekonomikong diwa ng hindi pagkuha ni Nehemias ng opisyal na panustos
  choice: Hindi hiningi ni Nehemias ang laang pagkain para sa gobernador dahil mabigat na ang pasanin ng bayan.
  alternative: Hindi lamang siya humingi ng literal na tinapay, o tumanggi siya sa isang tiyak na buwis na hindi tahasang pinangalanan sa talata.
  rationale: Ipinakikita ng konteksto na kusang hindi ginamit ni Nehemias ang panustos na nauukol sa kanyang katungkulan dahil sa kalagayan ng bayan. Hindi tinutukoy ng salin kung anong tiyak na buwis o mekanismo ang ginamit upang tustusan iyon, sapagkat hindi iyon nililinaw ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang sobrang literal na mga pariralang hindi likas sa Tagalog, ngunit pinanatili ang pasibong paghahanda, ang sampung-araw na pagitan, ang opisyal na katangian ng laang pagkain, at ang larawan ng mabigat na pasanin.
