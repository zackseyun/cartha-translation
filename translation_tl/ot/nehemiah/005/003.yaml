  yaml_path: translation/ot/nehemiah/005/003.yaml
  text: And there were others who said[a], “We are mortgaging our fields, our vineyards, and our houses to get grain during the famine.”
translation:
  language: tl
  text: May iba rin na nagsabi, “Isinasangla[a] namin ang aming mga bukid, ubasan, at mga bahay upang makakuha ng butil sa panahon ng taggutom.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ibinibigay naming panagot ang aming mga bukid, ubasan, at mga bahay.” Ang pandiwang Hebreo ay tumutukoy sa pagbibigay ng ari-arian bilang panagot sa utang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: May iba rin na nagsabi
  rationale: Ipinakikilala ng idyomang Hebreo ang isa pang pangkat sa sunod-sunod na pagrereklamo. Likas sa modernong Tagalog ang “May iba rin na nagsabi” at malinaw ang tungkulin nito sa daloy.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ וּבָתֵּינוּ
  choice: ang aming mga bukid, ubasan, at bahay
  rationale: Tuwiran at kongkreto ang mga katawagan sa ari-arian. Ang “bukid,” “ubasan,” at “bahay” ang karaniwang modernong katumbas.
- source_word: אֲנַחְנוּ עֹרְבִים
  choice: Isinasangla namin
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa pagbibigay ng ari-arian bilang panagot sa utang. Malinaw at natural na ipinahahayag ito ng “isinasangla,” habang ipinaliliwanag sa talababa ang mas literal na diwa.
- source_word: וְנִקְחָה
  choice: upang makakuha
  rationale: Ipinahahayag ng anyo ang layunin ng pagsasangla. Pinananatili ng “makakuha” ang payak na kahulugan ng pandiwang ‘kumuha/magtamo’ nang hindi ipinapalagay na tahasang sinasabi ng Hebreo ang pagbili.
- source_word: דָגָן
  choice: butil
  rationale: Tumutukoy ang salita sa ani o pagkaing butil. Mas tiyak ang “butil” kaysa sa malawak na “pagkain.”
- source_word: בָּרָעָב
  choice: sa panahon ng taggutom
  rationale: Inilalarawan ng parirala ang kalagayang pinagdaraanan nila. Natural itong Tagalog at hindi nito labis na tinutukoy kung panahon o sanhi lamang ang diin ng pang-ukol.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “isinasangla” bilang madaling maunawaang terminong pangkabuhayan; inilagay pagkatapos ng buong sipi ang marker [a] upang malinaw na tumukoy ito sa pahayag tungkol sa pagsasangla.
