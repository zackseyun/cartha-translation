  text: Remember me[a], my God, for good, for all that I have done for this people.
translation:
  language: tl
  text: Alalahanin mo ako, Diyos ko, nang may kabutihang-loob, dahil sa lahat ng ginawa ko para sa bayang ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “alalahanin mo ako nang may pabor.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: Alalahanin mo ako
  rationale: Ang pakiusap na mula sa זכר kasama ng לִי ay likas na naipapahayag sa Tagalog bilang “alalahanin mo ako,” at pinananatili ang tuwirang panalangin sa Diyos.
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: Ipinapahayag ng hulaping unang panauhan ang personal at tuwirang pagtawag sa Diyos; hindi kailangan ang makalumang pantawag upang maging marangal.
- source_word: לְטוֹבָה
  choice: para sa ikabubuti
  rationale: Pinananatili nito ang ideya ng mabuting bunga o kanais-nais na pag-alaala nang hindi tiyak na nilulutas kung ito ay para sa kapakanan ni Nehemias o pagtingin sa kaniya nang may pabor.
- source_word: כֹּל אֲשֶׁר עָשִׂיתִי
  choice: lahat ng ginawa ko
  rationale: Natural at tapat na katumbas ng pangkalahatang pariralang tumutukoy sa kabuuan ng nagawa ng nagsasalita.
- source_word: עַל הָעָם הַזֶּה
  choice: para sa bayang ito
  rationale: Sa konteksto, ang עַל ay tumutukoy sa pagkilos alang-alang sa kapakanan ng bayan; ang “bayang ito” ay nagpapanatili sa kolektibong isahan ng עָם.
theological_decisions:
- issue: Katangian ng panalangin ni Nehemias na alalahanin siya ng Diyos
  choice: Isang pakiusap na alalahanin siya ng Diyos sa paraang hahantong sa mabuti, dahil sa ginawa niya para sa bayan
  alternative: Isang tahasang pag-angkin ng gantimpalang nararapat sa kaniya o isang pakiusap para sa hayagang pagbibigay-katarungan
  rationale: Humihingi ang teksto ng mabuting pag-alaala ng Diyos batay sa mga ginawa ni Nehemias, ngunit hindi nito nililinaw kung ito ay pag-angkin ng merito, gantimpala, o pampublikong pagbibigay-katarungan. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “alalahanin” bilang natural na wika ng panalangin at “bayang ito” upang mapanatili ang kolektibong diwa ng Hebreong עָם.
