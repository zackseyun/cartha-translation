  text: And there were those who said[a], “We have many sons and daughters. Let us get grain, so that we may eat and live.”
translation:
  language: tl
  text: At may mga nagsabi, “Kami at ang aming mga anak na lalaki at babae ay marami.[a] Kumuha tayo ng butil upang makakain tayo at mabuhay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas likas na pananalita, “Marami kaming anak na lalaki at babae.” Sa Hebreo, sunod-sunod na binabanggit ang “aming mga anak na lalaki,” “aming mga anak na babae,” at “kami,” bago sabihing “marami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: At may mga nagsabi
  rationale: Pinananatili nito ang eksistensiyal na anyo ng Hebreo at ipinakikitang isang pangkat ito sa loob ng mas malawak na hinaing.
- source_word: בָּנֵינוּ וּבְנֹתֵינוּ אֲנַחְנוּ רַבִּים
  choice: Kami, ang aming mga anak na lalaki at babae, ay marami
  rationale: Sinasalamin nito ang siksik at appositional na ayos ng Hebreo, kasama ang tahasang אֲנַחְנוּ, at pinananatili ang diin sa buong pamilya sa halip na pakinisin agad bilang pagmamay-ari lamang ng maraming anak.
- source_word: וְנִקְחָה
  choice: Kumuha tayo
  rationale: Ang Qal cohortative na unang panauhang maramihan ay nagpapahayag ng panawagan o determinasyong kumuha/magtamo; natural sa Filipino ang “Kumuha tayo” at hindi nito tinutukoy nang higit sa teksto kung paano makukuha ang butil.
- source_word: דָגָן
  choice: butil
  rationale: Tumutukoy ito sa aning cereal o grain, hindi sa pagkain sa pangkalahatan. Ang “butil” ay maikli at likas sa kontekstong agrikultural.
- source_word: וְנֹאכְלָה וְנִחְיֶה
  choice: upang may makain tayo at mabuhay
  rationale: Ipinahahayag ng magkakasunod na cohortative ang layunin ng pagkuha ng butil—ang makakain at manatiling buhay—habang pinananatiling magkahiwalay ang dalawang pandiwa.
