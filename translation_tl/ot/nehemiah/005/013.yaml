  source_fidelity: Tumpak na naihahatid ng salin ang sagisag na pagpapagpag, ang anyong sumpa na ipinakikilala ng כָּכָה, ang pagkawala mula sa tahanan at sa bunga ng pagpapagal, ang pagiging walang laman, ang tugon ng kapulungan, at ang pagsasagawa ng mga tao ng ipinangako. Napananatili rin ang pag-uulit ng larawang “ipagpag.”
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang ayos na “ipagpag ng Diyos mula sa kanyang tahanan … ang bawat lalaking” ay bahagyang matalinghaga ngunit angkop sa sinasadyang sagisag ng Hebreo at malinaw sa kasunod na “maiwan nang walang anuman.”
