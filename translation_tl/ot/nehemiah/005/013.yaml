source:
  edition: WLC
  text: גַּם חָצְנִ֣/י נָעַ֗רְתִּי וָֽ/אֹמְרָ֡/ה כָּ֣כָה יְנַעֵ֪ר הָֽ/אֱלֹהִ֟ים אֶת כָּל הָ/אִישׁ֩ אֲשֶׁ֨ר לֹֽא יָקִ֜ים אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה מִ/בֵּית/וֹ֙ וּ/מִ֣/יגִיע֔/וֹ וְ/כָ֛כָה יִהְיֶ֥ה נָע֖וּר וָ/רֵ֑ק וַ/יֹּאמְר֨וּ כָֽל הַ/קָּהָ֜ל אָמֵ֗ן וַֽ/יְהַלְלוּ֙ אֶת יְהוָ֔ה וַ/יַּ֥עַשׂ הָ/עָ֖ם כַּ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/013.yaml
  text: I also shook out the fold of my garment and said[a], “So may God shake out every man who does not fulfill this promise, from his house and from his labor; so may he be shaken out and emptied.” And all the assembly said, “Amen,” and praised Yahweh[c][b]. And the people did according to this promise.
translation:
  language: tl
  text: Ipinagpag ko rin ang tupi ng aking kasuutan[a] at sinabi, “Gayon nawa ipagpag ng Diyos mula sa kanyang tahanan at sa bunga ng kanyang pinaghirapan[c] ang bawat lalaking hindi tutupad sa pangakong ito[b]. Gayon nawa siya maipagpag at maiwang walang anuman.” Sinabi ng buong kapulungan, “Amen!” at pinuri nila si Yahweh. At tinupad ng mga tao ang pangakong ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kandungan ko” o “ang tupi sa harap ng aking kasuutan.” Ang salitang Hebreo ay tumutukoy sa tupi ng kasuutang maaaring paglagyan ng mga bagay. Ang pagpag ni Nehemias dito ay isang sagisag na kilos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi magsasakatuparan ng bagay na ito” o “hindi tutupad sa salitang ito.” Sa konteksto, ang tinutukoy ay ang pananagutang ipinangako at sinumpaang gagawin.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mula sa kanyang paggawa” o “mula sa kanyang napagpaguran.” Maaaring tumukoy ang Hebreo sa pagpapagal mismo o sa bungang napala mula rito.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: חָצְנִי
  choice: ang tupi ng aking kasuutan
  rationale: Tumutukoy ang חָצֶן sa tupi o bahaging nasa harap ng kasuutan na maaaring paglagyan ng mga bagay. Malinaw ang “tupi ng aking kasuutan” bilang kongkretong kilos na sagisag ng lubusang pag-aalis.
- source_word: נָעַרְתִּי / יְנַעֵר / נָעוּר
  choice: ipinagpag / ipagpag / maipagpag
  rationale: 'Pinananatili ng magkakaugnay na anyo ng “pagpag” ang pag-uulit at larawang nasa Hebreo: ang simbolikong pagpag ni Nehemias at ang sumpang maalis at mawalan ng pag-aari ang hindi tutupad.'
- source_word: כָּכָה
  choice: Gayon nawa
  rationale: Sa konteksto ng sumpang sinasabayan ng sagisag na kilos, likas na ipinahahayag ng “Gayon nawa” ang kahilingang mangyari sa lumalabag ang ipinakitang kilos.
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Karaniwang pagtukoy ito sa Diyos ng Israel; natural sa Tagalog ang “Diyos” nang walang pantukoy.
- source_word: כָּל הָאִישׁ
  choice: ang bawat lalaking
  rationale: Pinananatili nito ang panlalaking isahan ng Hebreo at ang pangkalahatang saklaw nito sa mga lalaking nanumpa sa konteksto.
- source_word: יָקִים אֶת הַדָּבָר הַזֶּה
  choice: tutupad sa pangakong ito
  rationale: Sa konteksto ng sinumpaang pananagutan, ang הֵקִים דָּבָר ay tumutukoy sa pagtupad o pagsasakatuparan ng ipinangako, hindi lamang sa pagsasalita tungkol sa isang bagay.
- source_word: מִבֵּיתוֹ וּמִיגִיעוֹ
  choice: mula sa kanyang tahanan at sa bunga ng kanyang pinaghirapan
  rationale: Ang “tahanan” ay natural na katumbas ng בַּיִת dito. Maaaring tumukoy ang יְגִיעַ sa paggawa o sa napala mula rito; pinili sa teksto ang “bunga ng kanyang pinaghirapan” dahil ang larawan ay tungkol sa pagkawala ng tinatangkilik, habang inilalahad sa talababa ang tunay na ambiguwidad.
- source_word: וָרֵק
  choice: maiwan nang walang anuman
  rationale: Ipinahahayag nito ang pagiging walang laman o walang natira sa paraang natural kapag tao ang tinutukoy, at iniuugnay ang sumpa sa pagkawala ng tahanan at napagpaguran.
- source_word: הַקָּהָל
  choice: ang buong kapulungan
  rationale: Ang קָהָל ay ang nagkakatipong pamayanan. Dignified at hindi nakatali sa katawagang denominasyonal ang “kapulungan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: כַדָּבָר הַזֶּה
  choice: tinupad ... ang pangakong ito
  rationale: Tumutukoy ang parirala sa sinumpaang pananagutang kababanggit lamang. Nililinaw ng “pangako” ang referent at natural na naipapahayag sa Tagalog ang ginawang pagtupad.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON,” nang hindi nagdaragdag ng paliwanag na teolohikal.
- issue: Panlalaking anyo ng כָּל־הָאִישׁ
  choice: bawat lalaking
  alternative: bawat tao; sinuman
  rationale: Pinananatili ang tahasang panlalaking anyo ng pinagmulang teksto. Ang saklaw nito ay pangkalahatan sa grupong kinakausap, ngunit hindi ito tahimik na ginawang walang kasarian.
- issue: Lakas ng sumpang may sagisag na kilos
  choice: Gayon nawa ipagpag ng Diyos ... Gayon nawa siya maipagpag
  alternative: Itataboy ng Diyos ...
  rationale: Pinananatili ang anyong paghiling o sumpa at ang pag-uulit ng ugat na נער, sa halip na gawing payak na pahayag o ipakahulugang tiyak na “pagtataboy.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kasuutan,” “kapulungan,” at “Gayon nawa” upang mapanatili ang bigat ng pampublikong panunumpa nang hindi nagiging lipas o labis na pormal. Ang tatlong talababa ay minarkahan sa mismong teksto bilang [a], [b], at [c].
