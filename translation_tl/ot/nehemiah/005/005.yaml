source:
  edition: WLC
  text: וְ/עַתָּ֗ה כִּ/בְשַׂ֤ר אַחֵ֨י/נוּ֙ בְּשָׂרֵ֔/נוּ כִּ/בְנֵי/הֶ֖ם בָּנֵ֑י/נוּ וְ/הִנֵּ֣ה אֲנַ֣חְנוּ כֹ֠בְשִׁים אֶת בָּנֵ֨י/נוּ וְ/אֶת בְּנֹתֵ֜י/נוּ לַ/עֲבָדִ֗ים וְ/יֵ֨שׁ מִ/בְּנֹתֵ֤י/נוּ נִכְבָּשׁוֹת֙ וְ/אֵ֣ין לְ/אֵ֣ל יָדֵ֔/נוּ וּ/שְׂדֹתֵ֥י/נוּ וּ/כְרָמֵ֖י/נוּ לַ/אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/005.yaml
  text: And now[a], our flesh is like the flesh of our brothers, our children like their children; yet here we are, forcing our sons and our daughters into slavery, and some of our daughters have already been enslaved. But it is not in our power to help[b], and our fields and our vineyards belong to others.
translation:
  language: tl
  text: At ngayon, ang laman namin ay gaya ng laman ng aming mga kapatid[a], at ang aming mga anak ay gaya ng kanilang mga anak. Ngunit heto kami, ipinapaalipin namin ang aming mga anak na lalaki at babae, at ilan sa aming mga anak na babae ay naalipin na. Wala kaming kapangyarihang pigilan ito[b], sapagkat ang aming mga bukid at ubasan ay pag-aari na ng iba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “iisa ang aming laman at ang laman ng aming mga kapatid.” Binibigyang-diin ng kongkretong larawan sa Hebreo ang kanilang iisang pagkatao at pagkakamag-anak.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “walang lakas sa aming kamay.” Idyoma ito para sa kawalan ng paraan o kapangyarihang kumilos, lalo na dahil nasa iba na ang kanilang mga bukid at ubasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּבְשַׂר אַחֵינוּ בְּשָׂרֵנוּ
  choice: ang laman namin ay gaya ng laman ng aming mga kapatid
  rationale: Pinananatili ng “laman” ang kongkretong larawan ng בשר, samantalang ipinahihiwatig ng buong parirala ang magkapantay na pagkatao at pagkakamag-anak sa loob ng bayan.
- source_word: אַחֵינוּ
  choice: aming mga kapatid
  rationale: Ang “mga kapatid” ang tuwirang katumbas at likas ding maaaring tumukoy sa mga kasapi ng iisang sambayanan, nang hindi nagdaragdag ng tahasang etnikong katawagan.
- source_word: כִּבְנֵיהֶם בָּנֵינוּ
  choice: ang aming mga anak ay gaya ng kanilang mga anak
  rationale: Bagaman maaaring mangahulugang “mga anak na lalaki” ang בנים, kolektibo ang paghahambing dito; pagkatapos ay tahasang binabanggit kapwa ang mga anak na lalaki at babae.
- source_word: כֹבְשִׁים ... לַעֲבָדִים
  choice: napipilitang ipaalipin
  rationale: Ipinapakita ng כבשׁ kasama ng לַעֲבָדִים ang sapilitang pagpapasailalim sa pagkaalipin. Ang “napipilitang ipaalipin” ay natural sa Filipino at ipinapakita ring ang mga magulang ay napasailalim sa panggigipit ng utang.
- source_word: מִבְּנֹתֵינוּ נִכְבָּשׁוֹת
  choice: ang ilan sa aming mga anak na babae ay naalipin na
  rationale: Ipinahahayag ng pasibong anyo ang kalagayang bunga ng naunang pagpapasailalim; ang “naalipin na” ay malinaw at hindi pinapalambot ang realidad ng pagkaalipin.
- source_word: וְאֵין לְאֵל יָדֵנוּ
  choice: Wala kaming kapangyarihang pigilan ito
  rationale: Idyoma ito ng kawalan ng lakas o kakayahan. Inililinaw ng “pigilan ito” ang tinutukoy na patuloy na pagkaalipin, habang may talababa para sa mas literal na saklaw.
- source_word: וּשְׂדֹתֵינוּ וּכְרָמֵינוּ לַאֲחֵרִים
  choice: sapagkat ang aming mga bukid at ubasan ay pag-aari na ng iba
  rationale: Ang sugnay na walang pandiwa ay nagsasaad na ang kanilang lupang pinagmumulan ng kabuhayan ay nasa pag-aari o kontrol na ng iba at kaya wala silang kakayahang kumilos.
theological_decisions:
- issue: Wikang pangkamag-anakan sa reklamo tungkol sa kawalang-katarungan
  choice: Panatilihin ang “mga kapatid” at gamitin ang kolektibong “mga anak” sa paghahambing
  alternative: “mga kamag-anak” at “mga anak,” o “mga kapatid” at “mga anak na lalaki” sa buong talata
  rationale: Pinananatili nito ang kongkretong ugnayang ipinahahayag ng Hebreo, ngunit hindi nililimitahan sa mga anak na lalaki ang kolektibong paghahambing bago tahasang banggitin ang dalawang kasarian.
- issue: Tindi ng katawagan sa pagkaalipin
  choice: Gamitin ang “ipaalipin/naalipin”
  alternative: “ipaglingkod/pagsisilbihan” o “ipasailalim”
  rationale: Utang na pagkaalipin ng mga anak ang sitwasyon; ang mas banayad na wika ay magtatago sa tindi ng pagsasamantala.
- issue: Ugnayan ng kawalan ng kapangyarihan at pagkawala ng lupa
  choice: Isalin ang ו bilang paliwanag na “sapagkat”
  alternative: Panatilihin bilang payak na “at”
  rationale: Sa daloy ng reklamo, ang pagkakaroon ng iba sa mga bukid at ubasan ang nagpapaliwanag kung bakit wala silang kakayahang pigilan ang pagkaalipin. Hindi nito binabago ang teolohikal na pahayag kundi ginagawang hayag ang lohikal na kaugnayang likas sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kongkretong “laman” at ang tahasang wika ng pagkaalipin; iniwasan ang makalumang “alipinin” bilang pangngalan at ang malabong “paglilingkod.”
