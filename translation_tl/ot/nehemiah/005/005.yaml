  source_fidelity: Ang “napipilitang ipaalipin” ay nagdaragdag na ang mga magulang mismo ay pinilit, samantalang ang aktibong participle na כֹבְשִׁים ay tuwirang nagsasabing sila ay naglalagay ng kanilang mga anak sa pagkaalipin. Ang iba pang pangunahing kahulugan—magkakatulad na laman, mga anak, mga anak na lalaki at babae, mga anak na babaeng naalipin na, kawalan ng kakayahan, at mga lupang nasa iba—ay naipahahayag nang tapat.
  naturalness: Makabago at malinaw ang Filipino. Mas tuwiran at mas likas sa kontekstong ito ang “ipinapaalipin namin” kaysa “napipilitang ipaalipin,” dahil iniiwasan nito ang hindi ipinahayag na sapilitang kalagayan ng mga magulang.
  terminology: Ang “laman,” “mga kapatid,” “mga anak,” “pagkaalipin,” “naalipin,” “bukid,” at “ubasan” ay angkop. Pinananatili ng “pagkaalipin” ang tindi ng עֲבָדִים at ng kaugnay na pandiwa nang hindi ito pinapalambot.
