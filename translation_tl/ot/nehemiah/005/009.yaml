base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/009.yaml
  text: So I said[a], “What you are doing is not good. Should you not walk in the fear of our God because of the reproach of the nations, our enemies?”
translation:
  language: tl
  text: Kaya sinabi ko, “Hindi mabuti ang ginagawa ninyo. Hindi ba dapat kayong mamuhay nang may takot sa ating Diyos dahil sa paghamak ng mga bansang kaaway natin?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang maiwasan ang paghamak ng mga bansang kaaway natin.” Maaaring unawain ang pang-ukol sa Hebreo bilang nagpapahayag ng dahilan o ng nilalayong pag-iwas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kaya sinabi ko
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Tagalog ang “Kaya sinabi ko” at ipinakikita ang kaugnayan sa naunang pangyayari.
- source_word: לֹא טוֹב
  choice: Hindi mabuti
  rationale: Tuwirang pinananatili ang pagtatayang moral ng Hebreo nang hindi ito labis na binibigyang-kahulugan.
- source_word: הַדָּבָר אֲשֶׁר אַתֶּם עֹשִׂים
  choice: ang ginagawa ninyo
  rationale: Likas at maikli sa Tagalog habang malinaw na tumutukoy sa kasalukuyan nilang asal.
- source_word: הֲלוֹא
  choice: Hindi ba dapat
  rationale: Naghahatid ng retorikal na tanong na may puwersa ng moral na panawagan.
- source_word: בְּיִרְאַת אֱלֹהֵינוּ
  choice: nang may takot sa ating Diyos
  rationale: Pinananatili ang mahalagang biblikal na diwa ng יִרְאָה bilang takot na may pagpipitagan, sa halip na paliitin ito sa simpleng paggalang.
- source_word: תֵּלֵכוּ
  choice: mamuhay
  rationale: Ang literal na “lumakad” ay metapora para sa asal o paraan ng pamumuhay. Ang “mamuhay” ang likas at malinaw na katumbas nito sa modernong Tagalog.
- source_word: מֵחֶרְפַּת
  choice: dahil sa paghamak ng
  rationale: Ang מִן ay maaaring magpahayag ng dahilan o ng nilalayong pag-iwas. Pinananatili sa pangunahing teksto ang pagbasa bilang dahilan at itinatala sa talababa ang alternatibo.
- source_word: הַגּוֹיִם אֹיְבֵינוּ
  choice: mga bansang kaaway natin
  rationale: Tumutukoy ang גּוֹיִם sa mga nakapaligid na banyagang bayan; malinaw na naihahayag sa Tagalog ang apposition sa pamamagitan ng pariralang ito.
theological_decisions:
- issue: Metaporang etikal ng הלך sa konteksto ng tipan
  choice: Isalin bilang “mamuhay”
  alternative: “lumakad”
  rationale: Nananawagan ang talata sa asal na may takot sa Diyos. Naipahahayag ng “mamuhay” ang etikal na metapora nang mas natural sa Tagalog, nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Kahulugan ng “takot” sa Diyos
  choice: Panatilihin ang “takot sa ating Diyos”
  alternative: “pagpipitagan sa ating Diyos”
  rationale: Ang “takot” ay nagpapanatili sa bigat at tensiyong teolohikal ng יִרְאָה; ang pagpipitagan ay kasama sa diwa ngunit hindi dapat ipalit na para bang iyon lamang ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mamuhay” bilang natural na pagpapahayag ng Hebreong metapora ng paglakad, at pinanatili ang “takot sa ating Diyos” dahil sa teolohikal nitong bigat. Inilagay ang talababa sa dulo ng sugnay na saklaw ng alternatibong pagbasa.
