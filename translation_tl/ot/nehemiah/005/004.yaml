  source_fidelity: 'Tapat ang salin sa Hebreo: ipinakikilala nito ang isa pang pangkat ng nagsasalita, malinaw na isinasalin ang לָוִינוּ bilang “Nangutang kami,” at wastong inuunawa ang כֶסֶף bilang “salapi.” Ang “para sa buwis ng hari na ipinataw sa aming mga bukid at ubasan” ay isang natural at makatwirang pagpapahayag ng bayaring hari na kaugnay ng kanilang mga lupain at ubasan.'
