  text: And there were those who said[b][a], “We have borrowed money for the king’s tax on our fields and our vineyards.”
translation:
  language: tl
  text: May iba namang nagsabi, “Nangutang kami ng salapi[b] para sa buwis[a] ng hari na ipinataw sa aming mga bukid at ubasan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tributo.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “pilak”; ibig sabihin, salapi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: May iba namang nagsabi
  rationale: Ipinakikilala nito ang isa pang pangkat na naglahad ng hinaing. Ang “may iba namang” ay likas sa makabagong Filipino at ang “nagsabi” ay angkop sa konteksto ng salaysay.
- source_word: לָוִינוּ
  choice: Nangutang kami
  rationale: Tuwirang ipinahahayag ng pandiwa ang paghiram ng salapi; malinaw at natural sa Filipino ang “nangutang.”
- source_word: כֶסֶף
  choice: salapi
  rationale: Bagaman literal na “pilak,” karaniwan itong tumutukoy sa salapi sa kontekstong pangkabuhayan. Pinananatili ng “salapi” ang dignidad ng rehistro.
- source_word: לְמִדַּת הַמֶּלֶךְ
  choice: para sa buwis ng hari
  rationale: Tumutukoy ang parirala sa takdang bayaring nararapat sa hari. “Buwis” ang pinakamalinaw na makabagong katumbas, habang inilalagay sa talababa ang posibleng “tributo.”
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ
  choice: na ipinataw sa aming mga bukid at ubasan
  rationale: Malamang na tinutukoy ng mga pangngalan ang mga ari-ariang pinagbabatayan ng buwis. Nililinaw ng “ipinataw sa” ang ugnayang ito nang hindi ipinahihiwatig na isinangla ang lupa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ubasan” sa halip na mas teknikal na parirala, at pinanatili sa mga talababa ang mahahalagang leksikal na alternatibo ng Hebreo.
