revisions:
- from: Gumawa siya para rito ng isang malaking silid[a]. Dati, doon nila inilalagay ang handog na butil, ang insenso, ang mga kagamitan, at ang ikasampung bahagi ng butil, bagong alak, at langis—ang bahaging itinakda para sa mga Levita, mga mang-aawit, at mga bantay ng pintuang-bayan[b]—pati ang handog na inilaan para sa mga pari.[c]
  to: Naghanda siya para sa kanya ng isang malaking silid[a]. Dati, doon nila inilalagay ang handog na butil, ang kamangyan, ang mga kagamitan, at ang ikasampung bahagi ng butil, bagong alak, at langis—ang bahaging itinakda para sa mga Levita, mga mang-aawit, at mga bantay-pinto[b]—pati ang handog na inilaan para sa mga pari.[c]
  rationale: Inayos ang personal na reperensiya ng לוֹ, inalis ang hindi tahasang “bayan” mula sa mga bantay-pinto, at ginawang mas tiyak ang לְבוֹנָה bilang “kamangyan.” Pinanatili ang kontekstuwal ngunit maingat na pagsasalin ng מִצְוַת bilang “bahaging itinakda,” na may talababa para sa literal na “utos.”
