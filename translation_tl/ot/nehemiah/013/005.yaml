  text: וַ/יַּ֨עַשׂ ל֜/וֹ לִשְׁכָּ֣ה גְדוֹלָ֗ה וְ/שָׁ֣ם הָי֪וּ לְ/פָנִ֟ים נֹ֠תְנִים אֶת הַ/מִּנְחָ֨ה הַ/לְּבוֹנָ֜ה וְ/הַ/כֵּלִ֗ים וּ/מַעְשַׂ֤ר הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר מִצְוַת֙ הַ/לְוִיִּ֔ם וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים וּ/תְרוּמַ֖ת הַ/כֹּהֲנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/005.yaml
  text: He made for him a large chamber[a], where formerly they had put the grain offering, the frankincense, the vessels, and the tithe of grain, new wine, and oil—the portion commanded for the Levites, the singers[d][c][b], and the gatekeepers—and the contribution for the priests.
translation:
  language: tl
  text: Naghanda siya para sa kanya ng isang malaking silid[a]. Dati, doon nila inilalagay ang handog na butil, ang kamangyan, ang mga kagamitan, at ang ikasampung bahagi ng butil, bagong alak, at langis—ang bahaging itinakda para sa mga Levita, mga mang-aawit, at mga bantay-pinto[b]—pati ang handog na inilaan para sa mga pari.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malaking silid-imbakan.” Ang salitang Hebreo ay tumutukoy sa isang silid sa loob ng kompleks ng templo na maaari ring gamitin bilang imbakan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang utos para sa mga Levita, mga mang-aawit, at mga bantay-pinto”; sa konteksto, tumutukoy ito sa bahaging itinakda para sa kanila.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang ambag para sa mga pari.” Ang salitang Hebreo ay tumutukoy sa handog o ambag na ibinukod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: Gumawa siya para rito
  rationale: Tuwirang inililipat ang עשה + ל; ginamit ang “rito” sapagkat ang tinutukoy ay si Tobias mula sa naunang talata, nang hindi inuulit ang pangalan na wala sa talata.
- source_word: לִשְׁכָּה גְדוֹלָה
  choice: isang malaking silid
  rationale: Ang לִשְׁכָּה ay silid sa loob ng kompleks ng templo at maaaring imbakan; “silid” ang natural at hindi labis na nagpapakitid sa gamit nito.
- source_word: וְשָׁם הָיוּ לְפָנִים נֹתְנִים
  choice: Dati, doon nila inilalagay
  rationale: Ipinahahayag ng היה + participle ang nakaugaliang gawain noong nakaraan, at ng לְפָנִים ang “dati/noong una.”
- source_word: הַמִּנְחָה
  choice: handog na butil
  rationale: Sa kontekstong pangtemplo, tumutukoy ang מִנְחָה sa handog na mula sa butil.
- source_word: הַלְּבוֹנָה
  choice: insenso
  rationale: Ang לְבוֹנָה ay frankincense; “insenso” ang malinaw at karaniwang katawagan sa modernong Filipino.
- source_word: הַכֵּלִים
  choice: mga kagamitan
  rationale: Sa konteksto, tumutukoy ito sa mga kagamitang ginagamit sa paglilingkod sa templo; mas natural sa Filipino kaysa “mga sisidlan.”
- source_word: מַעְשַׂר הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: ikasampung bahagi ng butil, bagong alak, at langis
  rationale: Pinananatili ang kahulugan ng מַעְשֵׂר bilang ikasampung bahagi at ang tradisyonal na triad na butil, bagong alak, at langis.
- source_word: מִצְוַת הַלְוִיִּם וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: ang bahaging itinakda para sa mga Levita, mga mang-aawit, at mga bantay ng pintuang-bayan
  rationale: Elliptical ang “utos” sa Hebreo; sa listahan ng mga nakaimbak na ikapu, ang diwa ay bahaging itinakda para sa mga grupong ito. Isinasama sa talababa ang mas literal na anyo.
- source_word: תְרוּמַת הַכֹּהֲנִים
  choice: handog na inilaan para sa mga pari
  rationale: Ang תְּרוּמָה ay ambag o handog na ibinukod; pinananatili ng “inilaan” ang ideya ng isang bahaging itinangi nang hindi gumagamit ng malabong teknikal na termino.
theological_decisions:
- issue: Kahulugan ng מִצְוַת kaugnay ng mga Levita, mang-aawit, at bantay
  choice: bahaging itinakda para sa kanila
  alternative: utos tungkol sa kanila
  rationale: Hinihingi ng konteksto ng mga ikapu at nakaimbak na panustos ang kongkretong bahaging iniutos, ngunit itinatala sa talababa ang literal na anyo upang hindi maitago ang sintaktikong tensiyon.
- issue: Rituwal na diwa ng תְּרוּמָה
  choice: handog na inilaan para sa mga pari
  alternative: handog na itinataas para sa mga pari
  rationale: Hindi tiyak na kailangang ipahiwatig rito ang partikular na galaw na rituwal; ang pangunahing diwa ay handog o ambag na ibinukod para sa mga pari.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pintuang-bayan” para sa mga tarangkahan ng templo, hindi ng isang lungsod. Iniwasan ang sobrang teknikal na “heave offering,” habang pinanatili sa talababa ang saklaw ng mga salitang Hebreo.
