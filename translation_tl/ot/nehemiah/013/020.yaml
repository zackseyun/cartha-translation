  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpalipas ng gabi” sa halip na mas pormal na “tumuloy” upang idiin ang magdamag na pananatili; pinanatili naman ang bahagyang pagkakaiba ng mga mangangalakal at mga nagtitinda.
