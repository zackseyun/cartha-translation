  text: Then the merchants and sellers of every kind of goods spent the night outside Jerusalem once or twice[a][b].
translation:
  language: tl
  text: At ang mga mangangalakal at ang mga nagtitinda ng lahat ng uri ng paninda ay nagpalipas ng gabi sa labas ng Jerusalem nang minsan o makalawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “minsan at makalawa,” isang idyomang nangangahulugang “minsan o makalawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלִינוּ
  choice: nagpalipas ng gabi
  rationale: Tumutukoy ang pandiwang לון sa pananatili o pagtuloy sa isang lugar sa magdamag. Likas sa makabagong Tagalog ang “nagpalipas ng gabi” at malinaw na pansamantalang pananatili ang tinutukoy.
- source_word: הָרֹכְלִים
  choice: ang mga mangangalakal
  rationale: Ang רֹכֵל ay tumutukoy sa mangangalakal o naglalako. Ang “mga mangangalakal” ay angkop sa kontekstong pangkalakalan at naiiba ngunit kaugnay ng kasunod na “mga nagtitinda.”
- source_word: וּמֹכְרֵי כָל מִמְכָּר
  choice: at mga nagtitinda ng lahat ng uri ng paninda
  rationale: Saklaw ng parirala ang mga nagbebenta ng anumang maipagbibili. Pinananatili ng saling ito ang lawak ng כָל מִמְכָּר sa natural at malinaw na Tagalog.
- source_word: מִחוּץ לִירוּשָׁלָם
  choice: sa labas ng Jerusalem
  rationale: Ang מִחוּץ ay nagsasaad ng lokasyong nasa labas ng lungsod; tuwiran at natural ang saling ito.
- source_word: פַּעַם וּשְׁתָּיִם
  choice: nang minsan o makalawa
  rationale: Literal na “minsan at makalawa,” ngunit isa itong idyomang nagsasaad na nangyari iyon sa isa o dalawang pagkakataon. Natural sa Tagalog ang “nang minsan o makalawa” at hindi nito pinalalabis ang dalas.
theological_decisions: []
