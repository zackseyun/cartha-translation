- from: Ngunit habang nangyayari ang lahat ng ito, wala ako sa Jerusalem, sapagkat noong ika-tatlumpu’t dalawang taon ng paghahari ni Artajerjes, hari ng Babilonia[a], pumunta ako sa hari. Pagkalipas ng ilang panahon[b], humingi ako ng pahintulot sa hari.
  to: Ngunit sa buong panahong ito, wala ako sa Jerusalem, sapagkat noong ika-tatlumpu’t dalawang taon ng paghahari ni Artajerjes, hari ng Babilonia[a], pumunta ako sa hari. Pagkalipas ng ilang panahon[b], humingi ako ng pahintulot sa hari.
