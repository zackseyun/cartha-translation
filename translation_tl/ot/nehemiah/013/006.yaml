base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/006.yaml
  text: But during all this I was not in Jerusalem[a], for in the thirty-second year of Artaxerxes king of Babylon I went to the king[b], and after some time I asked leave from the king.
translation:
  language: tl
  text: Ngunit sa buong panahong ito, wala ako sa Jerusalem, sapagkat noong ika-tatlumpu’t dalawang taon ng paghahari ni Artajerjes, hari ng Babilonia[a], pumunta ako sa hari. Pagkalipas ng ilang panahon[b], humingi ako ng pahintulot sa hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “hari ng Babilonia.” Isinalin dito ang teksto ayon sa pagkakasulat sa halip na itugma ito sa mas malawak na konteksto ng Imperyong Persiano.'
    reason: textual_variant
  - marker: b
    text: O “sa katapusan ng mga araw” o “pagkaraan ng isang panahon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֶה
  choice: Ngunit habang nangyayari ang lahat ng ito
  rationale: Ipinahahayag ng parirala ang panahong saklaw ng mga naunang pangyayari at ang pagsalungat na wala noon si Nehemias sa Jerusalem.
- source_word: לֹא הָיִיתִי בִּירוּשָׁלִָם
  choice: wala ako sa Jerusalem
  rationale: Likas at tuwirang pahayag sa Filipino tungkol sa nakaraang pagliban; malinaw sa konteksto ang panahong tinutukoy.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא
  choice: noong ika-tatlumpu’t dalawang taon ng paghahari ni Artajerjes
  rationale: Nililinaw ng ‘ng paghahari’ ang karaniwang pormula ng Hebreo para sa taon ng paghahari nang hindi binabago ang kahulugan.
- source_word: מֶלֶךְ בָּבֶל
  choice: hari ng Babilonia
  rationale: Sinusunod ang mismong nakasulat sa tekstong Hebreo sa halip na itugma ito sa mas malawak na kontekstong Persiano.
- source_word: בָּאתִי אֶל הַמֶּלֶךְ
  choice: pumunta ako sa hari
  rationale: Maaaring mangahulugan ang בוא ng pagpunta o pagdating; natural sa pananaw ng nagsasalaysay ang ‘pumunta.’
- source_word: וּלְקֵץ יָמִים
  choice: Pagkalipas ng ilang panahon
  rationale: Ipinapahayag nito sa natural na Filipino ang di-tiyak na haba ng panahong nasa idyomang literal na ‘sa katapusan ng mga araw.’
- source_word: נִשְׁאַלְתִּי מִן הַמֶּלֶךְ
  choice: humingi ako ng pahintulot sa hari
  rationale: Ipinapakita ang kahilingan ni Nehemias nang hindi ipinapalagay sa mismong salin na ipinagkaloob na ang pahintulot.
