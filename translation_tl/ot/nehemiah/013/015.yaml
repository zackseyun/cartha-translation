base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/015.yaml
  text: In those days I saw in Judah people treading winepresses on the Sabbath, and bringing in heaps of grain and loading them on donkeys—and also wine, grapes, figs, and every kind of load—and bringing them into Jerusalem on the Sabbath day. So I testified against them on the day they sold food.
translation:
  language: tl
  text: Nang mga araw na iyon, nakita ko sa Juda ang mga taong yumuyurak ng ubas sa mga pisaan ng alak sa araw ng Sabbath. May mga nagdadala rin ng mga bunton ng butil at nagkakarga ng mga iyon sa mga asno. Nagdadala sila ng alak, mga ubas, mga igos, at sari-saring kargamento papasok sa Jerusalem sa araw ng Sabbath. At pinagsabihan ko sila noong araw na nagbenta sila ng pagkain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּרְכִים גִּתּוֹת
  choice: yumuyurak ng ubas sa mga pisaan ng alak
  rationale: Ang parirala ay literal na tumutukoy sa pagyurak sa mga pisaan ng alak; idinagdag ang “ng ubas” upang maging malinaw sa likas na Filipino ang gawaing inilalarawan nang hindi binabago ang diwa.
- source_word: הָעֲרֵמוֹת
  choice: mga bunton ng butil
  rationale: Ang עֲרֵמוֹת ay “mga bunton” o “mga tambak”; sa konteksto ng ani at pagkakarga, malamang na butil ang tinutukoy, gaya ng sinusuportahan ng konsultasyong Ingles.
- source_word: כָל־מַשָּׂא
  choice: sari-saring kargamento
  rationale: Pinananatili ang malawak na saklaw ng Hebreong “bawat/lahat ng karga” sa isang natural na ekspresyong Filipino.
- source_word: וָאָעִיד
  choice: binalaan ko sila
  rationale: Ang pandiwa ay maaaring mangahulugang taimtim na magpatotoo o magbabala laban sa isang gawain. Sa konteksto ng pagsaway sa paglabag sa Sabbath, “binalaan” ang natural at malinaw na salin.
- source_word: צָיִד
  choice: pagkain
  rationale: Maaari itong tumukoy sa pagkain o mga panustos. Ang “pagkain” ay simple, malawak, at akma sa mga produktong ipinagbibili sa talata.
theological_decisions:
- issue: Paglalarawan sa ginawa ni Nehemias laban sa pangangalakal sa Sabbath
  choice: binalaan ko sila
  alternative: nagpatotoo ako laban sa kanila
  rationale: Hindi ginawang mas tiyak kaysa sa teksto ang uri ng parusa o pagbabawal. Ipinahahayag ng “binalaan” ang taimtim na pagsaway, samantalang ang literal na “nagpatotoo laban” ay hindi gaanong natural at maaaring maging malabo sa karaniwang mambabasang Filipino.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pangalang “Sabbath” bilang kinikilalang terminong biblikal. Hinati ang mahabang Hebreong pangungusap sa ilang pangungusap para sa malinaw at natural na daloy, nang hindi inaalis ang pag-uulit na ang mga bagay ay dinadala sa Jerusalem sa araw ng Sabbath.
