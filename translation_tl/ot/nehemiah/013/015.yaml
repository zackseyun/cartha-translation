    issue: Hindi likas at hindi sapat na tiyak ang huling pariralang “Kaya binalaan ko sila nang araw na nagtitinda sila ng pagkain.”
    rationale: Ang “nang araw na” ay mali ang daloy sa Filipino sa kontekstong ito, at ang Hebreo ay tumutukoy sa araw ng aktuwal na pagbebenta nila. Ang “At pinagsabihan ko sila noong araw na nagbenta sila ng pagkain” ay nililinaw ang oras at nananatiling tapat sa diwa ng וָאָעִיד.
  revised_text: Nang mga araw na iyon, nakita ko sa Juda ang mga taong yumuyurak ng ubas sa mga pisaan ng alak sa araw ng Sabbath. May mga nagdadala rin ng mga bunton ng butil at nagkakarga ng mga iyon sa mga asno. Nagdadala sila ng alak, mga ubas, mga igos, at sari-saring kargamento papasok sa Jerusalem sa araw ng Sabbath. At pinagsabihan ko sila noong araw na nagbenta sila ng pagkain.
