  to: Nang mga araw na iyon, nakita ko sa Juda ang mga taong yumuyurak ng ubas sa mga pisaan ng alak sa araw ng Sabbath. May mga nagdadala rin ng mga bunton ng butil at nagkakarga ng mga iyon sa mga asno. Nagdadala sila ng alak, mga ubas, mga igos, at sari-saring kargamento papasok sa Jerusalem sa araw ng Sabbath. At pinagsabihan ko sila noong araw na nagbenta sila ng pagkain.
