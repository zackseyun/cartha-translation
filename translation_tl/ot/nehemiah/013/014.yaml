  text: זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י עַל זֹ֑את וְ/אַל תֶּ֣מַח חֲסָדַ֗/י אֲשֶׁ֥ר עָשִׂ֛יתִי בְּ/בֵ֥ית אֱלֹהַ֖/י וּ/בְ/מִשְׁמָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/014.yaml
  text: Remember me for this[a], my God[b], and do not wipe out my deeds of covenant faithfulness that I have done for the house of my God and for its services.
translation:
  language: tl
  text: Alalahanin mo ako dahil dito, Diyos ko, at huwag mong burahin ang mga gawa ng katapatan na ginawa ko[a] para sa bahay ng aking Diyos at para sa mga tungkulin nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga tapat kong ginawa,” “ang mga kabutihang ginawa ko,” o “ang mga gawa ng tapat na pag-ibig ko.” Ang salitang Hebreo ay maaaring mangahulugang kabutihan, katapatan, o matibay na pag-ibig na kaugnay ng tipan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga pananagutan nito” o “mga atas nito,” na tumutukoy sa mga gawaing kaugnay ng bahay ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: Alalahanin mo ako
  rationale: Likas na pakiusap sa modernong Tagalog at malinaw na pinananatili ang tuwirang panalangin sa Diyos.
- source_word: עַל זֹאת
  choice: dahil dito
  rationale: Tumutukoy sa bagay na kababanggit at naipahahayag ang posibleng batayang dahilan ng pakiusap.
- source_word: וְאַל תֶּמַח
  choice: at huwag mong burahin
  rationale: Pinananatili ang metapora ng Hebreo na maaaring tumukoy sa pagbura mula sa tala o alaala.
- source_word: חֲסָדַי
  choice: ang mga gawa ng katapatan ko
  rationale: Ipinahihiwatig ng maramihang anyo at ng kasunod na sugnay ang mga gawang nagpapakita ng katapatan; hindi nito ikinukulong ang חֶסֶד sa simpleng kabutihan lamang.
- source_word: בְּבֵית אֱלֹהַי
  choice: para sa bahay ng aking Diyos
  rationale: Sa konteksto, ang mga ginawa ay alang-alang sa templo, bagaman ang pang-ukol ay maaari ring unawaing 'sa loob ng' o 'kaugnay ng.'
- source_word: וּבְמִשְׁמָרָיו
  choice: at sa mga tungkulin nito
  rationale: Ang מִשְׁמָר ay tumutukoy sa mga pananagutan, atas, o gawaing kaugnay ng bahay ng Diyos.
theological_decisions:
- issue: Kahulugan ng חֲסָדַי sa panalangin ni Nehemias
  choice: mga gawa ng katapatan ko
  alternative: mga kabutihan ko; mga gawa ng tapat na pag-ibig ko; mga tapat kong ginawa
  rationale: Pinananatili nito ang saklaw ng katapatan, kabutihan, at matibay na paglingap nang hindi ipinipilit ang isang tiyak na sistematikong pakahulugan sa tipan.
- issue: Tono ng paghiling na alalahanin ng Diyos ang kanyang ginawa
  choice: Pinanatili ang tuwirang pakiusap at unang panauhan
  alternative: Palambutin o ipakahulugan ang pakiusap upang hindi magmukhang umaasa sa sariling gawa
  rationale: Tahasang hinihiling ng tekstong Hebreo na alalahanin siya ng Diyos at huwag burahin ang kanyang mga gawa; dapat manatili ang teolohikal na tensiyong iyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bahay ng aking Diyos” upang mapanatili ang konkretong katawagan ng Hebreo sa templo; iniwasan ang wikang makadenominasyon.
