  yaml_path: translation/ot/nehemiah/013/028.yaml
  text: And one of the sons of Joiada son of Eliashib the high priest was a son-in-law of Sanballat the Horonite[b][a], so I drove him away from me.
translation:
  language: tl
  text: At isa sa mga anak ni Joiada, na anak ni Eliasib na punong pari, ay manugang ni Sanbalat na Horonita.[a] Kaya itinaboy ko siya palayo sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas malawak na diwa, “kamag-anak ni Sanbalat sa pamamagitan ng pag-aasawa.” Maaaring tumukoy ang salitang Hebreo sa isang kaugnayan dahil sa pag-aasawa, ngunit sa kontekstong ito, “manugang” ang pinakanatural na tiyak na pagkaunawa.
    reason: lexical_alternative
  - marker: b
    text: O “hinabol ko siya palayo” o “pinalayas ko siya.” Binibigyang-diin ng pandiwang Hebreo ang sapilitang pagpapaalis, ngunit hindi tinutukoy ang eksaktong opisyal o administratibong anyo ng ginawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: At isa sa mga anak ni
  rationale: 'Ang may pang-ukol na anyo ay partitive: tumutukoy ito sa isa mula sa mga anak, hindi sa literal na paggalaw mula sa kanila.'
- source_word: יוֹיָדָע
  choice: Joiada
  rationale: Makabagong transliterasyon sa Filipino na malapit sa anyong Hebreo at tumutugma sa pangalang ginagamit sa ibinigay na consultation text.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: na anak ni Eliasib
  rationale: Pinananatili ang malinaw na ugnayang ama-anak; ginamit ang sugnay na may “na” upang maging natural sa Filipino sa loob ng mas mahabang talaangkanan.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: na punong pari
  rationale: Ang “punong pari” ang natural at nakaugaliang katumbas sa Filipino ng titulong Hebreo, sa halip na literal ngunit di-likas na “dakilang pari.”
- source_word: חָתָן לְסַנְבַלַּט
  choice: ay manugang ni Sanbalat
  rationale: Ipinapahayag ng חָתָן ang kaugnayan sa pag-aasawa. Dahil lalaki ang tinutukoy na anak ni Joiada, natural na nauunawaan ang “manugang” bilang lalaking manugang, habang ang talababa ay nagpapanatili sa mas malawak na posibleng kahulugan.
- source_word: הַחֹרֹנִי
  choice: na Horonita
  rationale: Isinalin ang katawagang batay sa lugar sa natural na anyong Filipino na may hulaping “-ita.”
- source_word: וָאַבְרִיחֵהוּ
  choice: Kaya itinaboy ko siya
  rationale: Ipinahihiwatig ng Hiphil na pandiwa ang sapilitang pagpapaalis o pagpapalayo. Ang “itinaboy” ay nagpapanatili ng lakas ng kilos nang hindi ipinapalagay na isa itong pormal na legal na pagpapatapon.
- source_word: מֵעָלָי
  choice: palayo sa akin
  rationale: Idyomatikong tumutukoy ito sa pag-alis mula sa presensiya o nasasakupan ni Nehemias; natural itong ipinapahayag sa Filipino bilang “palayo sa akin.”
