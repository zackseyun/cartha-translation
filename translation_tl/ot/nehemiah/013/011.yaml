base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/011.yaml
  text: So I contended with the officials and said[b][a], “Why has the house of God been neglected?” Then I gathered them and stationed them at their posts.
translation:
  language: tl
  text: Kaya nakipagtalo ako sa mga opisyal at sinabi, “Bakit pinabayaan ang bahay ng Diyos?[a]” Pagkatapos, tinipon ko sila at inilagay sa kani-kanilang puwesto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Bakit iniwan ang bahay ng Diyos?” Ang pasibong pandiwang Hebreo ay maaaring tumukoy sa pag-iwan o pagpapabaya; sa kontekstong ito, ang bahay ng Diyos at ang paglilingkod dito ay hindi naaasikaso at nasusuportahan.
    reason: lexical_alternative
  - marker: b
    text: O “ibinalik ko sila sa kanilang mga tungkulin.” Ang parirala ay tumutukoy sa paglalagay muli sa mga Levita at iba pang tauhan sa mga gawaing nakatalaga sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: nakipagtalo ako
  rationale: Ang pandiwang ריב ay tumutukoy sa pakikipagtalo o pakikipagtunggali. Pinananatili ng “nakipagtalo” ang mariing pagharap ni Nehemias nang hindi ito nililimitahan sa simpleng pagsaway.
- source_word: הַסְּגָנִים
  choice: mga opisyal
  rationale: Tumutukoy ang סְגָנִים sa mga nakabababang pinunong sibil o tagapangasiwa. Ang “mga opisyal” ay malinaw at likas sa modernong Filipino.
- source_word: נֶעֱזַב
  choice: pinabayaan
  rationale: Ang pasibong anyo ng עזב ay maaaring mangahulugang iniwan o pinabayaan. Sa konteksto, hindi naaasikaso at nasusuportahan ang paglilingkod sa bahay ng Diyos, kaya ang “pinabayaan” ay angkop habang pinananatili ang saklaw ng Hebreo.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Malapit ito sa literal na pahayag ng Hebreo at pinananatili ang bigat ng relihiyosong katawagan, sa halip na gawing tahasang “templo.”
- source_word: וָאֶקְבְּצֵם
  choice: tinipon ko sila
  rationale: Tuwirang ipinapahayag ng קבץ ang pagtitipon sa mga tao. Pinananatili rin ng panghalip na “sila” ang reperensiyang hindi tahasang tinutukoy sa mismong talata.
- source_word: וָאַעֲמִדֵם עַל עָמְדָם
  choice: inilagay sa kani-kanilang puwesto
  rationale: Ang parirala ay literal na nagpapahiwatig ng pagpapakatayo sa nakatalagang lugar at, sa konteksto, ng pagpapanumbalik sa mga tungkulin. Ang salin ay natural ngunit hindi labis na nagpapaliwanag.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Pinanatili ang “bahay ng Diyos” bilang malapit na katumbas ng Hebreo at ang panghalip na “sila” upang hindi piliting tukuyin sa pangunahing teksto ang reperensiyang ipinauunawa lamang ng konteksto.
