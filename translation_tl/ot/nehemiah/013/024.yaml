base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/024.yaml
  text: And half of their children spoke Ashdodite[a], and they were not able to speak Judean, but only the language of one people or another.
translation:
  language: tl
  text: At kalahati ng kanilang mga anak ay nagsasalita ng wikang Asdodita[a], at hindi marunong magsalita ng wikang Judeano, kundi ayon sa wika ng bawat bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya: “At kalahati ng kanilang mga anak ay nagsasalita ng wikang Asdodita, at hindi sila marunong magsalita ng wikang Judeano, kundi ng wika ng bawat bayan.”'
    reason: Ipinakikita ang alternatibong paraan ng pagkakaugnay ng mga parirala, lalo na ang saklaw ng “hindi sila marunong” at ang distributibong huling parirala.
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: At ... ng kanilang mga anak
  rationale: Ang בנים ay maaaring tumukoy sa mga anak sa pangkalahatan; sa konteksto ng mga pamilyang may haluang pinagmulan, mas natural at hindi nalilimitahan sa mga lalaki ang “mga anak.”
- source_word: חֲצִי
  choice: kalahati
  rationale: Tumutukoy ito sa isang bahagi ng kabuuang bilang ng kanilang mga anak.
- source_word: מְדַבֵּר
  choice: nagsasalita
  rationale: Ang participle ay naglalarawan ng karaniwang ginagamit o kakayahang pangwika, kaya ang pangkasalukuyang anyo ay natural sa Filipino kahit nasa salaysay ang talata.
- source_word: אַשְׁדּוֹדִית
  choice: wikang Asdodita
  rationale: Ang anyong pambabaeng gentilic ay tumutukoy sa wikang kaugnay ng Asdod; tahasang idinagdag ang “wikang” upang maging malinaw sa karaniwang mambabasa.
- source_word: וְאֵינָם מַכִּירִים
  choice: at hindi marunong
  rationale: Sa pagkakaugnay nito sa infinitive na “magsalita,” ipinahihiwatig ng הכיר ang kawalan ng kaalaman o praktikal na kakayahan, hindi lamang ang hindi pagkilala.
- source_word: לְדַבֵּר יְהוּדִית
  choice: magsalita ng wikang Judeano
  rationale: Ang יְהוּדִית ay wikang kaugnay ng Juda o ng mga Judeano. Hindi ito isinaling “Hebreo” upang hindi tukuyin nang higit sa tahasang sinasabi ng teksto.
- source_word: וְכִלְשׁוֹן עַם וָעָם
  choice: kundi ng wika ng sari-saring bayan
  rationale: Inihahatid nito sa natural na Filipino ang distributibong diwa ng “wika ng bayan at bayan,” nang hindi idinaragdag ang “lamang,” na hindi tahasang nasa Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “wikang Judeano” sa halip na “Hebreo” upang mapanatili ang tiyak ngunit hindi lubhang nilutas na katawagan ng pinagmulang teksto; iniwasan din ang “lamang” dahil hindi ito tahasang nakasaad.
