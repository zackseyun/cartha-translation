source:
  edition: WLC
  text: וְ/טִֽהַרְתִּ֖י/ם מִ/כָּל נֵכָ֑ר וָ/אַעֲמִ֧ידָ/ה מִשְׁמָר֛וֹת לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם אִ֥ישׁ בִּ/מְלַאכְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/030.yaml
  text: So I cleansed them from everything foreign[a], and I assigned duties for the priests and for the Levites, each in his work,
translation:
  language: tl
  text: Kaya nilinis ko sila mula sa lahat ng bagay na banyaga, at nagtakda ako ng mga tungkulin[a] para sa mga pari at mga Levita, bawat isa sa kanyang gawain,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pagbabantay” o “mga takdang paglilingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: Kaya nilinis ko sila
  rationale: Ang piel ng טהר ay nangangahulugang maglinis o magpadalisay. Likas sa modernong Tagalog ang “nilinis,” at ipinahihiwatig ng “Kaya” ang bunga o pagpapatuloy ng mga repormang binanggit sa naunang konteksto. Pinananatili ng “sila” ang hindi tiyak na saklaw ng hulaping 3mp.
- source_word: מִכָּל נֵכָר
  choice: mula sa lahat ng bagay na banyaga
  rationale: Maaaring tumukoy ang נֵכָר sa anumang banyaga o dayuhang elemento, hindi lamang sa mga taong dayuhan. Iniiwasan ng “lahat ng bagay na banyaga” ang di-makatwirang pagpapakitid sa kahulugan.
- source_word: וָאַעֲמִידָה
  choice: at nagtakda ako
  rationale: 'Ang hiphil ng עמד dito ay may diwang administratibo: maglagay, magtalaga, o magtatag. Ang “nagtakda” ay natural na kaakibat ng mga tungkulin.'
- source_word: מִשְׁמָרוֹת
  choice: mga tungkulin[a]
  rationale: Saklaw ng salita ang mga pagbabantay, pangkat, pananagutan, o takdang paglilingkod. Malinaw sa karaniwang mambabasa ang “mga tungkulin,” habang inilalagay sa talababa ang mga leksikal na alternatibo.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: para sa mga pari at mga Levita
  rationale: Malinaw na pinananatili ang dalawang magkahiwalay na pangkat at ang layon ng mga itinakdang tungkulin.
- source_word: אִישׁ
  choice: bawat isa
  rationale: Ginagamit ang אִישׁ nang pamahagi rito para tukuyin ang bawat kabilang sa mga pangkat. Tumpak at likas sa Tagalog ang “bawat isa.”
- source_word: בִּמְלַאכְתּוֹ
  choice: sa kanyang gawain
  rationale: Ang מְלָאכָה ay gawain, trabaho, tungkulin, o paglilingkod. Malapit sa anyo ng Hebreo ang “sa kanyang gawain” at hindi nito labis na nililinaw ang uri ng gawain.
theological_decisions:
- issue: Saklaw ng “sila” at ng “lahat ng bagay na banyaga”
  choice: Pinanatiling malawak ang pagtukoy sa komunidad na nilinis at sa mga banyagang elemento.
  alternative: Tukuyin ito bilang paglilinis sa kanila mula sa lahat ng dayuhan o mula sa mga asawang banyaga.
  rationale: Bagaman kaugnay ang talata sa mga pag-aasawang halo at sa pagkakasala ng mga pari, mas malawak ang mismong pananalita ng Hebreo. Hindi nararapat ipasok sa salin ang isang mas makitid na interpretasyon.
- issue: Pamahaging אִישׁ
  choice: bawat isa sa kanyang gawain
  alternative: bawat lalaki sa kanyang gawain
  rationale: Pamahagi ang pangunahing tungkulin ng אִישׁ sa parirala. Naipapahayag ito nang eksakto ng “bawat isa,” at walang kasariang gramatikal ang panghalip na Tagalog na “kanya.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Inilipat ang talababa sa “mga tungkulin,” sapagkat ang mga alternatibo nito ay tumutukoy sa מִשְׁמָרוֹת, hindi sa “banyaga.” Pinanatili ang kuwit sa hulihan upang tumugma sa pagpapatuloy ng pangungusap sa ibinigay na anyo ng talata.
