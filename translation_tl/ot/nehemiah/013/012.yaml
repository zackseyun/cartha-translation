translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “buong Juda” para sa kolektibong sambayanan at “mga imbakan” para sa kontekstong materyal ng mga ani. Walang talababa dahil walang kailangang ambiguwidad na ipaliwanag sa publikasyong teksto.
