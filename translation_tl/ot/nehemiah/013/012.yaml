translation:
  language: tl
  text: Buong Juda ay nagdala sa mga imbakan ng ikapu mula sa butil, bagong alak, at langis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל יְהוּדָה
  choice: At ... ang buong Juda
  rationale: Ang כָּל kasama ng pangalang יְהוּדָה ay tumutukoy sa buong sambayanan ng Juda. Pinananatili ng “buong Juda” ang kolektibong diwa nang hindi nililimitahan kung lupain o mga tao ang tinutukoy.
- source_word: הֵבִיאוּ
  choice: dinala
  rationale: Ang Hiphil ng בוא ay nangangahulugang “dalhin” o “ipasok.” Natural ang “dinala,” at malinaw na ang patutunguhan sa pariralang “sa mga imbakan.”
- source_word: מַעְשַׂר
  choice: ikasampung bahagi
  rationale: Ito ang tuwirang kahulugan ng מַעְשַׂר at malinaw sa karaniwang mambabasa bilang bahaging inihahandog, nang hindi umaasa sa teknikal na salitang “ikapu.”
- source_word: הַ/דָּגָן
  choice: trigo
  rationale: Ang דָּגָן ay pangkalahatang tumutukoy sa butil na ani. Sa modernong Filipino, natural ang “trigo” sa tradisyonal na tatluhang listahan, bagaman mas malawak ang saklaw ng Hebreo kaysa trigo lamang.
- source_word: וְ/הַ/תִּירוֹשׁ
  choice: bagong alak
  rationale: Ang תִּירוֹשׁ ay karaniwang sariwa o bagong alak at naiiba sa mas pangkalahatang יַיִן. Pinananatili ng “bagong alak” ang pagkakaibang leksikal.
- source_word: וְ/הַ/יִּצְהָר
  choice: langis
  rationale: Ang יִצְהָר ay karaniwang langis mula sa ani, kadalasa’y langis ng olibo. Sapat at natural ang “langis” sa konteksto nang hindi nagdaragdag ng espesipikasyong hindi tahasang nasa teksto.
- source_word: לָ/אוֹצָרוֹת
  choice: sa mga imbakan
  rationale: Ang אוֹצָרוֹת ay mga silid o lugar na pinaglalagyan ng mga panustos. Dahil trigo, alak, at langis ang inilalagay rito, mas angkop ang “mga imbakan” kaysa “mga kabang-yaman.”
