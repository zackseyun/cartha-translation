  text: וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר צָֽלֲלוּ֩ שַׁעֲרֵ֨י יְרוּשָׁלִַ֜ם לִ/פְנֵ֣י הַ/שַּׁבָּ֗ת וָ/אֹֽמְרָ/ה֙ וַ/יִּסָּגְר֣וּ הַ/דְּלָת֔וֹת וָ/אֹ֣מְרָ֔/ה אֲשֶׁר֙ לֹ֣א יִפְתָּח֔וּ/ם עַ֖ד אַחַ֣ר הַ/שַּׁבָּ֑ת וּ/מִ/נְּעָרַ֗/י הֶֽעֱמַ֨דְתִּי֙ עַל הַ/שְּׁעָרִ֔ים לֹא יָב֥וֹא מַשָּׂ֖א בְּ/י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/019.yaml
  text: When the gates of Jerusalem began to grow dark[a] before the Sabbath, I ordered the doors shut and commanded that they not be opened until after the Sabbath. I stationed some of my servants[b] at the gates so that no load[c] would be brought in on the Sabbath day.
translation:
  language: tl
  text: Nang magsimula nang dumilim[a] sa mga pintuang-daan ng Jerusalem bago ang Sabbath, iniutos kong isara ang mga pinto at huwag buksan ang mga iyon hanggang sa matapos ang Sabbath. Nagtalaga ako ng ilan sa aking mga tauhan[b] sa mga pintuang-daan upang walang anumang karga[c] ang maipasok sa araw ng Sabbath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang magsimulang lumilim sa mga pintuang-daan ng Jerusalem.”
    reason: lexical_alternative
  - marker: b
    text: O “ilan sa aking mga tagapaglingkod.” Maaaring tumukoy ang salita sa mga kasapi ng personal na pangkat na naglilingkod kay Nehemias.
    reason: lexical_alternative
  - marker: c
    text: Maaaring kabilang sa karga ang mga panindang ipinapasok upang ipagbili, sapagkat ang nakapaligid na konteksto ay tungkol sa pangangalakal sa Sabbath.
    reason: cultural_note
lexical_decisions:
- source_word: צָלֲלוּ
  choice: nagsisimula nang dumilim
  rationale: Ipinahihiwatig ng pandiwa ang pagdating ng dilim o paglilim sa papalapit na gabi. Likas sa modernong Tagalog ang pariralang ito at malinaw nitong minamarkahan ang oras bago magsimula ang Sabbath.
- source_word: שַׁעֲרֵי יְרוּשָׁלִַם
  choice: mga pintuang-daan ng Jerusalem
  rationale: Tuwirang salin ng construct phrase; nililinaw ng “pintuang-daan” na mga pasukan ng lungsod ang tinutukoy, hindi karaniwang pinto ng gusali.
- source_word: לִפְנֵי הַשַּׁבָּת
  choice: bago ang Sabbath
  rationale: Pinananatili ang payak at malinaw na temporal na kahulugan ng Hebreo.
- source_word: וָאֹמְרָה
  choice: iniutos ko
  rationale: Bagaman literal na “sinabi ko,” utos ng gobernador ang pragmatikong puwersa nito sa konteksto.
- source_word: וַיִּסָּגְרוּ הַדְּלָתוֹת
  choice: isara ang mga pinto
  rationale: Ang “mga pinto” ay mga dahon o panara ng mga pintuang-daan. Ang anyong pautos matapos ang “iniutos ko” ay natural sa Tagalog.
- source_word: אֲשֶׁר לֹא יִפְתָּחוּם
  choice: huwag buksan ang mga iyon
  rationale: Malinaw na ang mga pinto ang hindi dapat buksan, nang hindi nagdaragdag ng di-tiyak na tagaganap.
- source_word: עַד אַחַר הַשַּׁבָּת
  choice: hanggang sa matapos ang Sabbath
  rationale: Natural na Tagalog para sa “hanggang makalipas ang Sabbath” at hindi nito tinutukoy ang eksaktong oras na lampas sa pagtatapos nito.
- source_word: וּמִנְּעָרַי
  choice: ilan sa aking mga tauhan
  rationale: Sa sambahayan o pangkat ng gobernador, maaaring tumukoy ang נַעַר sa mga tagapaglingkod o attendant, hindi kinakailangang mga kabataang lalaki. Sapat na malawak at natural ang “mga tauhan.”
- source_word: הֶעֱמַדְתִּי עַל הַשְּׁעָרִים
  choice: Pumuwesto ako ng … sa mga pintuang-daan
  rationale: Ipinahahayag nito ang pagtalaga at paglalagay ng mga tauhan sa tungkulin sa mga pasukan ng lungsod.
- source_word: לֹא יָבוֹא מַשָּׂא
  choice: upang walang anumang karga na maipasok
  rationale: Pinananatili ang konkretong “karga” at nililinaw mula sa konteksto ng mga pintuang-daan na dinadala ito papasok.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: sa araw ng Sabbath
  rationale: Pinananatili ang tahasang “araw” sa Hebreo sa natural na anyong Tagalog.
theological_decisions:
- issue: Salin ng שַׁבָּת
  choice: Sabbath
  alternative: araw ng pamamahinga
  rationale: Ang salita ay tumutukoy sa tiyak na lingguhang Sabbath ng tipan at pamumuhay ng Israel, hindi lamang sa pangkalahatang araw ng pahinga. Pinananatili ng “Sabbath” ang historikal at teolohikal na katiyakan nito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mga pintuang-daan” para sa mga pasukan ng lungsod at “mga pinto” para sa mga panara nito. Pinanatili ang terminong “Sabbath” dahil tiyak ang historikal at pangtipang tinutukoy.
