  to: Nang magsimula nang dumilim[a] sa mga pintuang-daan ng Jerusalem bago ang Sabbath, iniutos kong isara ang mga pinto at huwag buksan ang mga iyon hanggang sa matapos ang Sabbath. Nagtalaga ako ng ilan sa aking mga tauhan[b] sa mga pintuang-daan upang walang anumang karga[c] ang maipasok sa araw ng Sabbath.
