base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/009.yaml
  text: Then I gave the order[a], and they cleansed the chambers; and I brought back there the vessels of the house of God[b], with the grain offering and the frankincense.
translation:
  language: tl
  text: Pagkatapos, nag-utos ako[a], at nilinis nila[b] ang mga silid. Ibinalik ko roon ang mga kagamitan sa bahay ng Diyos, pati ang handog na butil at ang kamanyang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinabi ko” o “nagbigay ako ng utos.” Literal na “sinabi ko” ang pandiwang Hebreo, ngunit sa konteksto ay isang utos ang sinabi at isinagawa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dinalisay nila.” Ang pandiwang Hebreo ay maaaring tumukoy kapuwa sa pisikal at sa ritwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Pagkatapos, nag-utos ako
  rationale: Ang pandiwa ay literal na “sinabi ko,” ngunit sa konteksto ay nagpapahayag ito ng utos na agad isinagawa. Ipinahihiwatig ng “Pagkatapos” ang pagkakasunod-sunod ng salaysay.
- source_word: וַיְטַהֲרוּ
  choice: nilinis nila
  rationale: Ang טהר ay maaaring tumukoy sa paglilinis o ritwal na pagdadalisay. Natural sa modernong Tagalog ang “nilinis,” habang pinananatili sa talababa ang ritwal na posibilidad.
- source_word: הַלְּשָׁכוֹת
  choice: ang mga silid
  rationale: Ang לשכה ay mga silid sa nasasakupan ng templo. Hindi ito isinaling “mga imbakan” upang hindi gawing mas tiyak kaysa sa mismong salitang Hebreo.
- source_word: וָאָשִׁיבָה שָּׁם
  choice: Ibinalik ko roon
  rationale: Ang causative na diwa ng שוב ay “ibalik,” at malinaw na tinutukoy ng שׁם ang lugar na iyon.
- source_word: כְּלֵי בֵּית הָאֱלֹהִים
  choice: ang mga kagamitan sa bahay ng Diyos
  rationale: Malawak ang kahulugan ng כְּלִי at maaaring tumukoy sa mga kasangkapan, sisidlan, o iba pang gamit. Ang “mga kagamitan” ay natural at hindi labis na tiyak; pinananatili rin ang Hebreong “bahay ng Diyos.”
- source_word: אֶת הַמִּנְחָה
  choice: pati ang handog na butil
  rationale: Sa kontekstong pangkulto, ang מִנְחָה ay handog na mula sa butil. Ang “pati” ay nagpapakitang ibinalik ito kasama ng mga kagamitan.
- source_word: וְהַלְּבוֹנָה
  choice: at ang kamanyang
  rationale: Ang לְבוֹנָה ay partikular na frankincense, na karaniwang tinatawag na “kamanyang” sa Tagalog.
theological_decisions:
- issue: Pisikal o ritwal na paglilinis ng mga silid
  choice: nilinis
  alternative: dinalisay
  rationale: Maaaring saklawin ng Hebreong טהר ang parehong pisikal at ritwal na paglilinis. Pinili ang mas natural na “nilinis” sa teksto at itinabi sa talababa ang ritwal na alternatibo upang hindi mawala ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga silid” at “mga kagamitan” upang maging natural sa karaniwang mambabasa nang hindi ginagawang mas tiyak kaysa sa Hebreo ang mga terminong tumutukoy sa templo.
