base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/017.yaml
  text: So I contended with the nobles of Judah and said to them[a], “What is this evil thing that you are doing, profaning the Sabbath day?”
translation:
  language: tl
  text: Kaya nakipagtalo ako sa mga maharlika ng Juda at sinabi sa kanila, “Ano itong masamang bagay na ginagawa ninyo—nilalapastangan ninyo ang araw ng Sabbath[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nilalabag” o “dinudungisan ang kabanalan ng araw ng Sabbath.” Ang pandiwang Hebreo ay may diwang pagtrato sa isang banal na bagay na para bang pangkaraniwan lamang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: Kaya nakipagtalo ako
  rationale: Ang ריב ay maaaring mangahulugang makipagtalo, sumaway, o magharap ng paratang. Pinananatili ng “nakipagtalo” ang matinding pagharap ni Nehemias nang hindi ipinapalagay na isang pormal na paglilitis ito; ipinapahayag ng “kaya” ang pagpapatuloy at bunga sa salaysay.
- source_word: חֹרֵי יְהוּדָה
  choice: mga maharlika ng Juda
  rationale: Tumutukoy ang חֹרִים sa mga taong kabilang sa mataas at makapangyarihang uri ng lipunan. Ang “mga maharlika” ay nagpapanatili sa katayuang panlipunan nila, sa halip na gawing tiyak na mga opisyal lamang.
- source_word: מָה הַדָּבָר הָרָע הַזֶּה
  choice: Ano itong masamang bagay
  rationale: Pinananatili nito ang anyong patanong at ang malinaw na moral na paghatol ng רָע, sa natural na modernong Tagalog.
- source_word: אֲשֶׁר אַתֶּם עֹשִׂים
  choice: na ginagawa ninyo
  rationale: Tuwirang ipinapahayag ang patuloy na kilos na nasa pandiwaring Hebreo at ang mariing pangmaramihang “kayo.”
- source_word: וּמְחַלְּלִים
  choice: nilalapastangan ninyo
  rationale: Ang חלל sa anyong ito ay nangangahulugang ituring na pangkaraniwan o di-banal ang isang banal na bagay. Naipapahayag ng “nilalapastangan” ang bigat ng paglapastangan sa kabanalan, hindi lamang ang paglabag sa isang tuntunin.
- source_word: אֶת יוֹם הַשַּׁבָּת
  choice: ang araw ng Sabbath
  rationale: Pinananatili nito kapuwa ang יוֹם at שַׁבָּת habang gumagamit ng karaniwang katawagang madaling makilala ng mga mambabasang Filipino.
theological_decisions:
- issue: Paglalarawan sa paglabag sa Sabbath
  choice: nilalapastangan ninyo ang araw ng Sabbath
  alternative: nilalabag ninyo ang araw ng Sabbath
  rationale: Binibigyang-diin ng pandiwang Hebreo ang pagtrato sa banal bilang pangkaraniwan o di-banal. Pinananatili ng “nilalapastangan” ang teolohikal na diin sa kabanalan ng Sabbath, samantalang maaaring magpahiwatig lamang ng pagsuway sa tuntunin ang “nilalabag.”
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “mga maharlika” ay nagpapanatili sa sinaunang katayuang panlipunan ng חֹרֵי nang hindi ito ginagawang tiyak na tungkuling pampamahalaan. Ginamit ang gitling na mahaba upang likas na iugnay ang masamang gawa sa mismong paglapastangan sa Sabbath, habang pinananatili ang retorikal na tanong.
