base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/007.yaml
  text: When I came to Jerusalem[b][a], I understood the evil that Eliashib had done for Tobiah by making a chamber for him in the courts of the house of God.
translation:
  language: tl
  text: Nang dumating ako sa Jerusalem, naunawaan ko ang kasamaang ginawa ni Eliasib para kay Tobias sa paggawa para sa kanya ng isang silid[a] sa mga patyo ng bahay ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang silid-tanggapan” o “isang silid sa templo”; ang salitang Hebreo ay tumutukoy sa isang silid sa loob ng kompleks ng templo, ngunit hindi nito tiyak na sinasabi rito kung para saan iyon ginagamit.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ng Diyos” ay tumutukoy sa templo.
    reason: cultural_note
lexical_decisions:
- source_word: וָאָבוֹא לִירוּשָׁלִָם
  choice: Nang dumating ako sa Jerusalem
  rationale: Ang wayyiqtol ng בוא ay nagpapatuloy sa salaysay; ang “nang” ay natural na naghahayag na sa pagdating niya naganap ang pagkaunawa.
- source_word: וָאָבִינָה
  choice: naunawaan ko
  rationale: Pinananatili nito ang kognitibong diwa ng בין, na maaaring tumukoy sa pagkaunawa o pagkabatid.
- source_word: בָרָעָה
  choice: ang kasamaan
  rationale: Ipinananatili ang malinaw na moral na bigat ng רָעָה, sa halip na palambutin bilang simpleng pagkakamali o pinsala.
- source_word: אֲשֶׁר עָשָׂה אֶלְיָשִׁיב לְטוֹבִיָּה
  choice: na ginawa ni Eliasib para kay Tobias
  rationale: 'Ang לְ sa pangalan ni Tobias ay likas na nagpapahayag ng pakinabang o pabor: ginawa ni Eliasib ang bagay na ito para sa kanya.'
- source_word: לַעֲשׂוֹת לוֹ נִשְׁכָּה
  choice: ipinagawa niya para rito ang isang silid
  rationale: Ang infinitive construct ay naglilinaw kung ano ang masamang ginawa. Ang “ipinagawa” ay angkop dahil si Eliasib ang may pananagutan sa pagpapagawa, nang hindi kinakailangang sabihing siya mismo ang nagtayo.
- source_word: נִשְׁכָּה
  choice: silid
  rationale: Malinaw at makabagong katumbas ito ng silid o chamber sa loob ng kompleks ng templo; hindi ipinapalagay ang mas tiyak na gamit na “bodega.”
- source_word: בְּחַצְרֵי
  choice: sa mga looban
  rationale: Ang maramihang חַצְרֵי ay tumutukoy sa mga court o courtyard ng kompleks ng templo; natural sa Filipino ang “mga looban.”
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pinananatili ang literal na Hebreong idyoma, habang nililinaw sa talababa na tumutukoy ito sa templo.
theological_decisions:
- issue: Moral na paglalarawan sa ginawa ni Eliasib
  choice: ang kasamaan
  alternative: ang maling ginawa
  rationale: Tuwirang hinahatulan ng teksto ang ginawa bilang רָעָה. Ang “kasamaan” ay nagpapanatili sa etikal at panrelihiyong bigat nito nang hindi nagdaragdag ng paliwanag.
- issue: Pagkilala sa bahay ng Diyos
  choice: bahay ng Diyos
  alternative: templo ng Diyos
  rationale: Pinananatili ang pahayag ng Hebreo at ang teolohikal na larawan ng templo bilang bahay ng Diyos; ang kahulugang pangkultura ay ibinibigay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga anyong pangalang Eliasib at Tobias na natural sa tradisyong Filipino. Iniwasan ang labis na pormal na “bulwagan” at ang masyadong tiyak na “bodega.”
