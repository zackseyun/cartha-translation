revisions:
- from: 'Nang dumating ako sa Jerusalem, naunawaan ko ang kasamaang ginawa ni Eliasib para kay Tobias: ipinagawa niya para rito ang isang silid[a] sa mga looban ng bahay ng Diyos.[b]'
  to: Nang dumating ako sa Jerusalem, naunawaan ko ang kasamaang ginawa ni Eliasib para kay Tobias sa paggawa para sa kanya ng isang silid[a] sa mga patyo ng bahay ng Diyos.[b]
  rationale: Inalis ang causative na “ipinagawa” upang hindi magdagdag ng detalye tungkol sa paraan o tauhang gumawa ng silid. Pinalitan ang “mga looban” ng “mga patyo” upang mas malinaw na maipahayag ang mga court ng templo. Pinanatili ang moral na bigat ng “kasamaan,” ang literal na “bahay ng Diyos,” at ang maingat na lexical na talababa para sa “silid.”
