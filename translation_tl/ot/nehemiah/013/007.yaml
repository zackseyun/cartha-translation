  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: dumating si Nehemias sa Jerusalem, nabatid niya ang masamang ginawa ni Eliasib para kay Tobias, at may silid na ginawa para rito sa mga patyo ng bahay ng Diyos. Gayunman, ang “ipinagawa niya” ay causative at nagpapahiwatig na nagpagawa si Eliasib sa iba, samantalang ang לַעֲשׂוֹת ay simpleng “gumawa/paggawa” at hindi nagsasaad kung siya mismo o iba ang gumawa. Ang “mga looban” ay maaari ring tumukoy sa loob na bahagi ng isang gusali at hindi gaanong tiyak na katumbas ng mga patyo ng kompleks ng templo.'
  naturalness: Mas natural at malinaw sa modernong Filipino ang “mga patyo” para sa mga court ng templo. Ang “sa paggawa para sa kanya ng isang silid” ay nananatiling maayos na Filipino at iniiwasan ang di-sinasadyang pahiwatig ng pagpapakontrata o pagpapagawa sa iba.
  terminology: Ang “kasamaan,” “bahay ng Diyos,” Eliasib, at Tobias ay angkop. Ang “silid” ay wastong malawak na katumbas ng נִשְׁכָּה; ang talababa ay wastong naglilinaw na hindi tiyak ang gamit ng silid. Ang “mga patyo” ay mas angkop kaysa “mga looban” para sa חַצְרֵי sa konteksto ng templo.
