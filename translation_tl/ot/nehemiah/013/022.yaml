base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/022.yaml
  text: And I told the Levites that they should purify themselves and come to guard the gates[a], to keep the Sabbath day holy. Remember this also in my favor, my God[b], and spare me according to the greatness of your steadfast love.
translation:
  language: tl
  text: At sinabi ko sa mga Levita na magpakadalisay sila at pumunta upang bantayan ang mga pintuang-bayan, para panatilihing banal ang araw ng Sabat. Alalahanin mo rin ito para sa ikabubuti ko, O Diyos ko,[a] at kahabagan mo ako ayon sa kasaganaan ng iyong tapat na pag-ibig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Alalahanin mo rin ako dahil dito, O Diyos ko.” Maaaring tumukoy ang idyomang Hebreo sa pag-alaala sa gawa para sa ikabubuti ni Nehemias o sa pag-alaala mismo kay Nehemias dahil sa gawa.
    reason: lexical_alternative
  - marker: b
    text: Ang “tapat na pag-ibig” ay salin ng Hebreong hesed, na madalas tumukoy sa matatag na pag-ibig, katapatan, at awa ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לַלְוִיִּם
  choice: At sinabi ko sa mga Levita
  rationale: Pinananatili ng “sinabi ko” ang karaniwang diwa ng Qal ng אמר nang hindi pinalalakas bilang “inutusan,” bagaman may awtoridad ang tagubilin sa konteksto.
- source_word: אֲשֶׁר יִהְיוּ מִטַּהֲרִים
  choice: na maglinis sila ng kanilang sarili
  rationale: Ang היה na may Hitpael participle ay nagpapahayag ng inaasahang pagkilos; malinaw na naihahatid ng parirala ang reflexive o middle na diwa ng טהר.
- source_word: וּבָאִים שֹׁמְרִים הַשְּׁעָרִים
  choice: at pumunta upang bantayan ang mga pintuang-bayan
  rationale: Likas sa modernong Tagalog ang “pumunta upang bantayan.” Isinasalin ang הַשְּׁעָרִים bilang “mga pintuang-bayan” upang linawin na mga tarangkahan ng lunsod ang tinutukoy sa konteksto.
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: para panatilihing banal ang araw ng Sabat
  rationale: Ipinapahayag ng קדשׁ ang paglalaan bilang banal. Ang “panatilihing banal” ay natural at ipinakikitang layunin ng pagbabantay sa mga pintuang-bayan.
- source_word: גַּם זֹאת זָכְרָה לִּי
  choice: Alalahanin mo rin ito para sa ikabubuti ko
  rationale: Pinananatili ang dagdag na diin ng גַּם זֹאת at inilalahad ang benefactive na puwersa ng לִי. Dahil maaari ring iugnay ang pag-alaala kay Nehemias mismo, itinatala ang alternatibo sa talababa.
- source_word: וְחוּסָה עָלַי
  choice: at kahabagan mo ako
  rationale: Ang חוס ay maaaring mangahulugang maawa, mahabag, o magligtas sa kaparusahan. Ang “kahabagan” ay dignified at natural sa panalangin at hindi labis na nililimitahan ang saklaw nito.
- source_word: כְּרֹב חַסְדֶּךָ
  choice: ayon sa kasaganaan ng iyong tapat na pag-ibig
  rationale: Ipinahihiwatig ng רֹב ang kasaganaan, samantalang inilalarawan ng חֶסֶד ang matatag at tapat na pag-ibig at awa ng Diyos. Nananatiling malinaw at may bigat ang “tapat na pag-ibig” sa modernong Tagalog.
theological_decisions:
- issue: Ang saklaw ng חֶסֶד sa panalangin para sa awa
  choice: tapat na pag-ibig
  alternative: awa; pag-ibig na tapat sa tipan
  rationale: Pinananatili ng “tapat na pag-ibig” ang parehong pag-ibig at matatag na katapatan ng Diyos nang hindi nililimitahan ang salita sa awa lamang o nagdaragdag sa teksto ng hayagang salitang “tipan.”
- issue: Kung ang hinihiling na alalahanin ng Diyos ay ang gawa o si Nehemias
  choice: Alalahanin mo rin ito para sa ikabubuti ko
  alternative: Alalahanin mo rin ako dahil dito
  rationale: Maaaring ipakahulugan ang Hebrew idiom na ang “ito” ang alalahanin para sa kapakinabangan ni Nehemias, o na si Nehemias ang alalahanin dahil sa gawa. Pinili sa teksto ang unang pagbasa at pinanatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa panalangin. Ginamit ang “Sabat” bilang karaniwang anyong Filipino at “mga pintuang-bayan” upang maging malinaw ang konteksto. Inilagay ang bawat pananda ng talababa sa mismong pariralang tinatalakay nito.
