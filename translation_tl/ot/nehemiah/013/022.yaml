  terminology: Ang “mga Levita,” “araw ng Sabat,” “pintuang-bayan,” “kahabagan,” at “tapat na pag-ibig” ay angkop. Ang “tapat na pag-ibig” para sa hesed ay pinananatili nang hindi isinasara ang saklaw nitong awa at katapatan.
