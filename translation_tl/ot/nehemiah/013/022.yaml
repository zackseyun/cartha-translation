revisions:
- from: At sinabi ko sa mga Levita na maglinis sila ng kanilang sarili at pumunta upang bantayan ang mga pintuang-bayan, para panatilihing banal ang araw ng Sabat. Alalahanin mo rin ito para sa ikabubuti ko, O Diyos ko,[a] at kahabagan mo ako ayon sa kasaganaan ng iyong tapat na pag-ibig.[b]
  to: At sinabi ko sa mga Levita na magpakadalisay sila at pumunta upang bantayan ang mga pintuang-bayan, para panatilihing banal ang araw ng Sabat. Alalahanin mo rin ito para sa ikabubuti ko, O Diyos ko,[a] at kahabagan mo ako ayon sa kasaganaan ng iyong tapat na pag-ibig.[b]
  rationale: Pinalitan lamang ang hindi idiomatikong “maglinis sila ng kanilang sarili” ng “magpakadalisay sila,” na mas natural sa modernong Filipino at mas tapat sa ritwal na reflexive/middle na puwersa ng Hebreo. Pinanatili ang iba pang salin, ang maingat na ambiguity ng panalangin sa talababa, at ang mga umiiral na pananda ng talababa.
