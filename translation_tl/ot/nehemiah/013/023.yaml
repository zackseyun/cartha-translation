base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/023.yaml
  text: Also in those days I saw the Jews who had married women of Ashdod[a], Ammonite women[b], and Moabite women.
translation:
  language: tl
  text: Noong mga araw na iyon, nakita ko rin ang mga Judio[a] na nag-asawa[b] ng mga babaeng taga-Asdod, taga-Ammon, at taga-Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Judeano.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pinatira ang mga babae”; sa kontekstong ito, ang idyomang Hebreo ay nangangahulugang kinuha nila ang mga babaeng ito bilang asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בַּיָּמִים הָהֵם
  choice: Nang mga araw ding iyon
  rationale: Pinagsasama nito ang panandang pandagdag na גַּם at ang pariralang pangpanahon sa natural na Filipino, habang pinananatili ang diwang “sa mga araw ding iyon.”
- source_word: רָאִיתִי
  choice: nakita ko
  rationale: Pinananatili ang karaniwang kahulugan ng pandiwa at ang tono ng personal na pagsaksi ni Nehemias.
- source_word: הַיְּהוּדִים
  choice: mga Judio
  rationale: Ito ang pinakakilala at natural na tawag sa pamayanang etniko at panrelihiyon sa konteksto ng Ezra-Nehemias; inilalagay sa talababa ang posibleng mas heograpikong “mga Judeano.”
- source_word: הֹשִׁיבוּ נָשִׁים
  choice: nag-asawa ng mga babae
  rationale: Bagaman literal na may diwang “pinatira” ang Hiphil ng ישׁב, ang buong parirala sa kontekstong ito ay idyoma para sa pagkuha sa mga babae bilang asawa. Malinaw na naihahayag ng “nag-asawa” ang kahulugan nang hindi dinaragdagan ang teolohikal na interpretasyon.
- source_word: אשדודיות עמוניות מוֹאֲבִיּוֹת
  choice: mga babaeng taga-Asdod, taga-Ammon, at taga-Moab
  rationale: Ang magkakatulad na anyong “taga-” ay natural sa modernong Filipino at malinaw na naghahayag ng pinagmulan ng mga babae.
theological_decisions:
- issue: Saklaw ng katawagang הַיְּהוּדִים
  choice: mga Judio
  alternative: mga Judeano
  rationale: Sa konteksto ng pamayanang bumalik mula sa pagkakatapon, maaaring tumukoy ang salita kapwa sa etniko-panrelihiyong pagkakakilanlan at sa kaugnayan sa Juda. Pinili ang mas karaniwang “mga Judio,” ngunit pinanatili sa talababa ang tunay na alternatibo.
- issue: Idyomatikong kahulugan ng הֹשִׁיבוּ נָשִׁים
  choice: nag-asawa ng mga babae
  alternative: pinatira ang mga babae; kumuha ng mga babae bilang asawa
  rationale: Ipinakikita ng konteksto na pag-aasawa ang tinutukoy. Iniiwasan ng saling ito ang malabong literalismo habang hindi nagpapasok ng denominasyonal o pribadong pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Nang mga araw ding iyon” para sa maayos na daloy ng salaysay at ang magkakatulad na “taga-Asdod, taga-Ammon, at taga-Moab” para sa madaling pag-unawa.
