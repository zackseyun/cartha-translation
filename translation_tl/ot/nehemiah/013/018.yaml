base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/018.yaml
  text: Did not your fathers do this[a], and our God brought all this evil on us and on this city? Yet you are adding wrath against Israel by profaning the Sabbath.
translation:
  language: tl
  text: Hindi ba ganito ang ginawa ng inyong mga ninuno, at dinala ng ating Diyos ang lahat ng kapahamakang ito sa atin at sa lungsod na ito[a]? Ngunit dinaragdagan pa ninyo ang poot laban sa Israel sa pamamagitan ng paglapastangan ninyo sa Sabbath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng kasamaang ito” o “lahat ng kalamidad na ito.” Sa konteksto ng paghatol ng Diyos, ang salitang Hebreo na רָעָה ay maaaring tumukoy sa kapahamakang dumarating bilang parusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא כֹה עָשׂוּ
  choice: Hindi ba ganito ang ginawa
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap; natural sa modernong Tagalog ang “Hindi ba ganito ang ginawa.”
- source_word: אֲבֹתֵיכֶם
  choice: inyong mga ninuno
  rationale: Ang “mga ninuno” ang natural at malinaw na kolektibong katawagan sa naunang salinlahi sa modernong Tagalog, habang tapat sa kontekstuwal na diwa ng Hebrew na “mga ama.”
- source_word: וַיָּבֵא אֱלֹהֵינוּ
  choice: kaya dinala ng ating Diyos
  rationale: Tuwirang pinananatili ang Diyos bilang gumagawa at ang sanhi-bungang ugnayan sa naunang kasalanan; ang hiphil ng בוא ay nangangahulugang “dinala” sa kontekstong ito.
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: ang lahat ng kasamaang ito
  rationale: Pinananatili ng “kasamaan” ang malawak na saklaw ng רָעָה at ang tensiyon ng teksto, habang nililinaw sa talababa na maaari itong tumukoy sa kapahamakan bilang hatol.
- source_word: מוֹסִיפִים חָרוֹן עַל יִשְׂרָאֵל
  choice: dinaragdagan pa ninyo ang poot laban sa Israel
  rationale: Ang kasalukuyang kilos ng participle ay ipinahahayag ng “dinaragdagan,” at pinananatili ng “poot” ang bigat ng חָרוֹן nang hindi tahasang nagdaragdag ng isang di-nakasulat na taglay na “ng Diyos.”
- source_word: לְחַלֵּל אֶת הַשַּׁבָּת
  choice: sa paglapastangan ninyo sa Sabbath
  rationale: Ang “paglapastangan” ay angkop sa ideya ng pagtrato bilang di-banal, at pinananatili ang kinikilalang katawagang “Sabbath” para sa institusyong tipan.
theological_decisions:
- issue: Ang kahulugan ng רָעָה na dinala ng Diyos
  choice: kasamaan
  alternative: kapahamakan; kalamidad
  rationale: Maaaring mangahulugan ang רָעָה ng masama o ng kapahamakang bunga ng paghatol. Pinananatili sa pangunahing teksto ang leksikal at teolohikal na tensiyon, at inilalahad sa talababa ang kontekstuwal na alternatibo nang hindi ipinahihiwatig na gumagawa ang Diyos ng moral na kasamaan.
- issue: Kung tutukuyin nang tahasan na poot ng Diyos ang חָרוֹן
  choice: poot
  alternative: poot ng Diyos; nag-aalab na galit
  rationale: Malinaw sa konteksto na banal na paghatol ang tinutukoy, ngunit walang tahasang taglay na “ng Diyos” sa parirala. Kaya hindi ito idinagdag upang mapanatili ang porma at bahagyang implicit na katangian ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga ninuno” sa halip na mas literal ngunit maaaring makitid na “mga ama,” at pinanatili ang “Sabbath” bilang pamilyar na katawagan sa institusyong panrelihiyon.
