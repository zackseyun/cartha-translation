base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/010.yaml
  text: And I learned that the portions of the Levites had not been given[b][a], so the Levites and the singers who did the work had each fled to his field.
translation:
  language: tl
  text: At nalaman kong hindi naibigay sa mga Levita ang kanilang mga takdang bahagi[a]. Kaya nagsialis ang mga Levita at ang mga mang-aawit, na gumaganap ng gawain, patungo sa kani-kanilang bukid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bahaging inilaan” para sa mga Levita.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bawat isa sa kaniyang bukid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵדְעָה
  choice: At nalaman ko
  rationale: Ipinahihiwatig ng pandiwa sa konteksto na natuklasan ni Nehemias ang isang kalagayan, hindi lamang na dati na niya itong alam.
- source_word: מְנָיוֹת הַלְוִיִּם
  choice: ang kanilang mga takdang bahagi
  rationale: Tumutukoy ang מְנָיוֹת sa mga bahaging inilaan bilang panustos sa mga Levita. Nililinaw ng “kanilang” ang ugnayang ipinahahayag ng pariralang Hebreo, samantalang pinananatili ng “takdang bahagi” ang diwa ng nakalaang bahagi.
- source_word: לֹא נִתָּנָה
  choice: hindi naibigay
  rationale: Pinananatili ang balintiyak na anyo ng Hebreo at ang kalagayang natuklasan ni Nehemias.
- source_word: וַיִּבְרְחוּ
  choice: nagsitakas
  rationale: Ang ברח ay “tumakas.” Ang “nagsitakas” ay natural na nagpapahayag ng kilos ng maraming tao, habang ang kasunod na parirala ang tahasang naglalahad ng paisa-isang pagkilos.
- source_word: אִישׁ לְשָׂדֵהוּ
  choice: bawat isa sa sarili niyang bukid
  rationale: Inilalahad nang malinaw ang distributibong diwa ng literal na “isang lalaki patungo sa kaniyang bukid,” nang hindi inaalis ang pagtukoy sa bukid.
- source_word: וְהַמְשֹׁרְרִים
  choice: at ang mga mang-aawit
  rationale: Tuwirang salin ito ng katawagan sa mga mang-aawit na kaugnay ng paglilingkod sa templo; hindi na idinagdag sa pangunahing teksto ang salitang “templo” dahil hindi ito tahasang nasa parirala.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: na gumaganap sa gawain
  rationale: Pinananatili ang participial na paglalarawan sa mga Levita at mga mang-aawit nang hindi labis na tinutukoy kung ano ang gawain.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Levita” at “mga mang-aawit” bilang karaniwang katawagang biblikal, at pinanatili ang payak na paglalarawan sa kanilang gawain nang walang idinagdag na denominasyonal na pagpapakahulugan.
