revisions:
- from: At nalaman kong hindi naibigay sa mga Levita ang kanilang mga takdang bahagi[a]. Kaya ang mga Levita at ang mga mang-aawit na gumaganap sa gawain ay nagsitakas, bawat isa sa sarili niyang bukid.[b]
  to: At nalaman kong hindi naibigay sa mga Levita ang kanilang mga takdang bahagi[a]. Kaya nagsialis ang mga Levita at ang mga mang-aawit, na gumaganap ng gawain, patungo sa kani-kanilang bukid.[b]
  rationale: Pinalitan ang “nagsitakas, bawat isa sa sarili niyang bukid” ng “nagsialis ... patungo sa kani-kanilang bukid” upang maging natural sa Filipino at akma sa kontekstong pangkabuhayan, habang pinananatili ang distributibong puwersa ng Hebreo. Inayos din ang ayos ng pariralang participial upang malinaw na inilalarawan nito ang kapuwa mga Levita at mga mang-aawit.
