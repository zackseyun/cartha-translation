id: NEH.13.2
reference: Nehemiah 13:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י לֹ֧א קִדְּמ֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/לֶּ֣חֶם וּ/בַ/מָּ֑יִם וַ/יִּשְׂכֹּ֨ר עָלָ֤י/ו אֶת בִּלְעָם֙ לְ/קַֽלְל֔/וֹ וַ/יַּהֲפֹ֧ךְ אֱלֹהֵ֛י/נוּ הַ/קְּלָלָ֖ה לִ/בְרָכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/002.yaml
  text: because they did not meet the sons of Israel with bread and water[a], and hired Balaam against them to curse them, but our God turned the curse into a blessing.
translation:
  language: tl
  text: sapagkat hindi nila sinalubong ang mga anak ni Israel na may dalang tinapay at tubig, at umupa siya kay Balaam laban sa kanila upang sumpain sila[a]. Ngunit ginawang pagpapala ng ating Diyos ang sumpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “upang sumpain siya,” na itinuturing ang Israel bilang isang kolektibong isahan.
    reason: Pinananatili nito ang isahang anyo ng hulaping Hebreo na likas na isinasalin bilang maramihan sa pangunahing teksto.
lexical_decisions:
- source_word: קִדְּמוּ
  choice: sinalubong
  rationale: Ipinapahayag nito ang kongkretong paglabas upang salubungin o tanggapin ang mga naglalakbay, nang hindi pa ipinapasok ang mas malawak na pagpapakahulugang “tinulungan” o “pinaglaanan.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang tahasang pananalitang pangkaanak sa Hebreo, at likas pa rin itong nauunawaan sa marangal na modernong Tagalog.
- source_word: בַּלֶּחֶם וּבַמָּיִם
  choice: na may dalang tinapay at tubig
  rationale: Pinananatili ang tiyak na mga pangunahing panustos na binanggit sa Hebreo. Nililinaw ng “may dalang” na ito ang dala nila sa pagsalubong, hindi lamang ang kasabay na kalagayan.
- source_word: וַיִּשְׂכֹּר עָלָיו אֶת־בִּלְעָם
  choice: at inupahan si Balaam laban sa kanila
  rationale: Ang pokus-sa-layon na pandiwang “inupahan” ay nagpapahintulot na huwag tahasang tukuyin kung isahan o maramihan ang kumilos, kaya hindi sapilitang nilulutas ang paglipat ng bilang sa Hebreo. Ang “laban sa kanila” ay malinaw na tumutukoy sa bayang Israel.
- source_word: לְקַלְלוֹ
  choice: upang sumpain sila
  rationale: Likas sa Tagalog ang maramihang panghalip kapag ang tinutukoy ay ang mga anak ni Israel; ang pormal na isahang hulapi sa Hebreo ay itinatala sa talababa.
- source_word: וַיַּהֲפֹךְ אֱלֹהֵינוּ הַקְּלָלָה לִבְרָכָה
  choice: Ngunit ginawang pagpapala ng ating Diyos ang sumpa
  rationale: Direkta at natural na ipinahahayag ang pagbabago mula sumpa tungo sa pagpapala, habang pinananatili ang tahasang “ating Diyos.”
theological_decisions:
- issue: Panlahing katawagang nasa anyong pangkaanak
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita / ang bayan ng Israel
  rationale: Tahasan sa Hebreo ang “mga anak ni Israel.” Pinananatili ito nang hindi ginagawang mas abstrakto ang katawagan.
- issue: Kolektibong isahan sa layon ng pagsumpa
  choice: upang sumpain sila
  alternative: upang sumpain siya
  rationale: Ang isahang hulapi sa Hebreo ay tumuturing sa Israel bilang isang kolektibong kabuuan. Mas malinaw at natural sa Tagalog ang “sila” para sa “mga anak ni Israel,” ngunit pinananatili sa talababa ang anyong isahan upang hindi maitago ang gramatikal na tensiyon.
- issue: Bilang ng umupa kay Balaam
  choice: at inupahan si Balaam
  alternative: at inupahan nila si Balaam / at inupahan niya si Balaam
  rationale: Isahan ang pandiwa sa Hebreo, ngunit nasa konteksto ito ng kolektibong pagkakasala ng mga bayan. Ang pag-aalis ng tahasang panghalip na simuno sa Tagalog ay nagpapanatili sa kalabuan nang hindi nagiging di-likas.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sinalubong” at “may dalang” upang maging kongkreto ang tagpo; iniwasan ang tahasang panghalip na simuno sa sugnay tungkol kay Balaam upang hindi sapilitang lutasin ang pagbabago ng bilang sa Hebreo.
