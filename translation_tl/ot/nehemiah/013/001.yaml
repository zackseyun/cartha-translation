source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נִקְרָ֛א בְּ/סֵ֥פֶר מֹשֶׁ֖ה בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/נִמְצָא֙ כָּת֣וּב בּ֔/וֹ אֲ֠שֶׁר לֹא יָב֨וֹא עַמֹּנִ֧י וּ/מֹאָבִ֛י בִּ/קְהַ֥ל הָ/אֱלֹהִ֖ים עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/001.yaml
  text: On that day the Book of Moses was read in the hearing of the people[c][b][a], and it was found written in it that no Ammonite or Moabite should ever enter the assembly of God.
translation:
  language: tl
  text: Nang araw na iyon, binasa sa pandinig ng mga tao ang Aklat ni Moises[a], at natuklasang nakasulat sa aklat na walang Ammonita o Moabita ang dapat pumasok kailanman[c] sa kapulungan[b] ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Balumbon ni Moises.” Ang salitang Hebreo ay maaaring tumukoy sa isang aklat o balumbon.
    reason: lexical_alternative
  - marker: b
    text: O “kongregasyon ng Diyos.”
    reason: lexical_alternative
  - marker: c
    text: Ang diwa ay “sa lahat ng panahon” o “magpakailanman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Nang araw na iyon
  rationale: Likas na salin sa modernong Tagalog para sa tiyak na panahong tinutukoy ng parirala.
- source_word: נִקְרָא
  choice: binasa
  rationale: Pinananatili ang pasibong diwa ng Hebreo. Ipinahihiwatig na ng “sa pandinig ng mga tao” ang pampublikong pagbasa kaya hindi na idinagdag ang “nang malakas.”
- source_word: בְּסֵפֶר מֹשֶׁה
  choice: ang Aklat ni Moises
  rationale: Malinaw at kinikilalang katawagan sa kasulatang iniuugnay kay Moises, habang inilalahad sa talababa ang posibleng pisikal na kahulugang “balumbon.”
- source_word: בְּאָזְנֵי הָעָם
  choice: sa pandinig ng mga tao
  rationale: Pinananatili ang pandinig na larawan ng Hebreong idyoma sa paraang nauunawaan sa Tagalog.
- source_word: וְנִמְצָא כָּתוּב בּוֹ
  choice: at natuklasang nakasulat doon
  rationale: Natural na Tagalog na nagpapanatili sa di-tiyak na tagatuklas at tumutukoy pabalik sa Aklat ni Moises.
- source_word: אֲשֶׁר לֹא יָבוֹא
  choice: na walang ... ang dapat ... pumasok
  rationale: Ipinapahayag ang nilalaman ng nakasulat bilang pagbabawal nang hindi ginagawang utos na higit sa anyo ng pinagmulan.
- source_word: עַמֹּנִי וּמֹאָבִי
  choice: Ammonita o Moabita
  rationale: Sa ilalim ng pagtanggi, ang “o” ang natural na Tagalog upang ipakitang saklaw ang alinman sa dalawang pangkat.
- source_word: בִּקְהַל הָאֱלֹהִים
  choice: sa kapulungan ng Diyos
  rationale: Ang “kapulungan” ay tumutukoy sa nagkakatipong pamayanan at hindi kusang nag-aangkat ng mas huling terminolohiyang pang-iglesia.
- source_word: עַד עוֹלָם
  choice: kailanman
  rationale: Sa negatibong pangungusap, natural na ipinahahayag ng “kailanman” ang pangmatagalang bisa ng pagbabawal.
theological_decisions:
- issue: Kahulugan ng בִּקְהַל הָאֱלֹהִים
  choice: sa kapulungan ng Diyos
  alternative: sa kongregasyon ng Diyos
  rationale: Pinananatili ng “kapulungan” ang malawak na kahulugan ng nagkakatipong pamayanang tipan nang hindi ito awtomatikong tinutumbasan sa isang partikular na institusyong panrelihiyon.
- issue: Lakas ng עַד עוֹלָם sa pormulang legal ng pagbubukod
  choice: dapat kailanman pumasok
  alternative: dapat pumasok magpakailanman
  rationale: Kasama ng “walang,” malinaw na ipinahahayag ng “kailanman” ang patuloy na pagbabawal, samantalang iniiwasan ang alanganing ayos sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pampublikong konteksto ng pagbasa at ang legal na tindi ng pangungusap, nang hindi nagdaragdag ng “nang malakas,” na hindi tahasang nasa Hebreo.
