base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/029.yaml
  text: Remember them[a], my God, because they have defiled the priesthood and the covenant of the priesthood and the Levites.
translation:
  language: tl
  text: Alalahanin mo sila, Diyos ko, dahil nilapastangan nila ang pagkapari at ang tipan ng pagkapari at ng mga Levita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O mas literal: “Alalahanin mo sila, Diyos ko, tungkol sa mga lumapastangan sa pagkapari at sa tipan ng pagkapari at ng mga Levita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לָהֶם
  choice: Alalahanin mo sila
  rationale: Pinananatili ang tuwirang pakiusap sa Diyos at ang pandiwang “alalahanin,” habang hinahayaang ipahiwatig ng kasunod na paratang na hindi kanais-nais ang pag-alalang hinihingi.
- source_word: אֱלֹהָי
  choice: Diyos ko
  rationale: Tuwirang inililipat ang unang panauhang pang-isahang hulapi sa katawagang ginagamit ni Nehemias sa panalangin.
- source_word: עַל
  choice: dahil
  rationale: Ipinahahayag ang sanhi o batayan ng pakiusap sa natural na modernong Tagalog.
- source_word: גָּאֳלֵי
  choice: nilapastangan nila
  rationale: Ang pandiwang-ugat dito ay nangangahulugang dumungis o lumapastangan, hindi “tumubos.” Ginawang sugnay ang substantibong participle upang maging malinaw at natural.
- source_word: הַכְּהֻנָּה
  choice: ang pagkapari
  rationale: Tumutukoy sa katayuan o institusyon ng pagiging pari, hindi lamang sa mga indibidwal na pari.
- source_word: וּבְרִית הַכְּהֻנָּה וְהַלְוִיִּם
  choice: ang tipan ng pagkapari at ng mga Levita
  rationale: Pinananatili ang siksik na ugnayang genitibo at ang koordinasyon sa Hebreo nang hindi tiyakang ipinapakahulugang ito ay tipan “sa” o “para sa” mga pari at Levita.
theological_decisions:
- issue: Kung kanais-nais o mapanghatol ang pag-alala ng Diyos sa kanila
  choice: Pinanatili ang payak na “Alalahanin mo sila,” ngunit ipinakita ng sugnay na “dahil nilapastangan nila” ang mapanghatol na diwa.
  alternative: “Alalahanin mo laban sa kanila” o isang neutral na pag-alala.
  rationale: Maaaring maging mabuti o masama ang “pag-alala” ng Diyos ayon sa konteksto. Dito, ang paratang na paglapastangan ang nagbibigay ng negatibong diwa, kaya hindi ito idinagdag sa mismong pandiwa.
- issue: Saklaw ng tipan kaugnay ng pagkapari at mga Levita
  choice: “ang tipan ng pagkapari at ng mga Levita”
  alternative: “ang tipan ng pagkapari, at ang mga Levita” o “ang tipan sa mga pari at Levita”
  rationale: Malamang na kapuwa kaugnay ng tipan ang pagkapari at mga Levita, ngunit siksik at hindi ganap na tahasan ang sintaks. Pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pagkapari” para sa abstraktong institusyon at “nilapastangan” para sa matinding pagdungis sa sagradong tungkulin at tipan.
