  text: And it displeased me greatly[b][a], and I threw all the household goods of Tobiah out of the chamber.
translation:
  language: tl
  text: Labis akong nasamaan ng loob, kaya itinapon ko sa labas ng silid[a] ang lahat ng gamit ni Tobias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “silid” ay tumutukoy sa isang kuwarto sa loob ng kompleks ng templo.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “lahat ng kagamitan sa bahay ni Tobias.” Malawak ang kahulugan ng salitang Hebreo at maaari itong tumukoy sa mga kagamitan, lalagyan, kasangkapan, o iba pang ari-arian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע לִי מְאֹד
  choice: Labis akong nagalit
  rationale: Ang idyomang Hebreo ay nagsasaad na napakasama o lubhang hindi kalugod-lugod kay Nehemias ang nangyari. Ang “labis akong nagalit” ay natural sa makabagong Tagalog at angkop sa kasunod niyang mariing pagkilos, bagaman maaari ring tumukoy ang parirala sa matinding pagkayamot o sama ng loob.
- source_word: וָאַשְׁלִיכָה
  choice: itinapon ko
  rationale: Tuwirang ipinahahayag nito ang marahas at mapagpasiyang kilos ng pandiwang Hebreo na ‘ihagis/itapon,’ nang hindi gumagamit ng lipas na pananalita.
- source_word: כָּל
  choice: lahat
  rationale: Pinananatili nito ang saklaw na komprehensibo ng salitang Hebreo.
- source_word: כְּלֵי בֵית טוֹבִיָּה
  choice: lahat ng gamit sa sambahayan ni Tobias
  rationale: Malawak ang kahulugan ng כְּלִי at maaaring tumukoy sa mga kagamitan, lalagyan, kasangkapan, o ari-arian. Ang “gamit sa sambahayan” ay kongkreto ngunit sapat na malawak para sa konteksto.
- source_word: הַחוּץ מִן הַלִּשְׁכָּה
  choice: sa labas ng silid
  rationale: Natural nitong ipinahahayag sa Tagalog ang paggalaw mula sa loob ng silid patungo sa labas. Ang לִשְׁכָּה ay isang silid sa loob ng kompleks ng templo.
