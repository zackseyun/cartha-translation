base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/021.yaml
  text: So I warned them and said to them[a], “Why are you spending the night in front of the wall? If you do it again, I will lay hands on you.” From that time on they did not come on the Sabbath.
translation:
  language: tl
  text: Kaya binalaan ko sila at sinabi sa kanila, “Bakit kayo nagpapalipas ng gabi sa tapat ng pader? Kung uulitin pa ninyo ito, pagbubuhatan ko kayo ng kamay.[a]” Mula noon, hindi na sila dumarating tuwing Sabbath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “gagamitan ko kayo ng puwersa.” Literal sa Hebreo, “magpapadala ako ng kamay laban sa inyo.”
    reason: Nililinaw ang kahulugan ng idyomang Hebreo habang inilalaan ang mas literal na anyo nito.
lexical_decisions:
- source_word: וָאָעִידָה
  choice: binalaan ko
  rationale: Ang Hifil ng עוד sa kontekstong ito ay isang mariing babala o pagtutol sa ginagawa ng mga mangangalakal. Natural at malinaw sa modernong Tagalog ang “binalaan ko.”
- source_word: וָאֹמְרָה אֲלֵיהֶם
  choice: at sinabi sa kanila
  rationale: Pinananatili ang karaniwang pagkakasunod-sunod ng salaysay at ang tahasang pinag-uukulan ng sinabi.
- source_word: לֵנִים
  choice: nagpapalipas ng gabi
  rationale: Tuwirang ipinapahayag ang panunuluyan o pananatili sa magdamag nang hindi ipinapalagay ang layunin nila.
- source_word: נֶגֶד הַחוֹמָה
  choice: sa tapat ng pader
  rationale: Ang “sa tapat” ay natural na katumbas ng נֶגֶד, na maaaring tumukoy sa lokasyong kaharap o nasa harapan ng pader; hindi nito tahasang idinaragdag ang “sa labas,” bagaman ipinahihiwatig iyon ng konteksto.
- source_word: אִם תִּשְׁנוּ
  choice: Kapag ginawa pa ninyo ito
  rationale: Ipinahahayag ng שנה ang pag-uulit. Ang “ito” ay likas na tumutukoy sa pagpapalipas nila ng gabi roon.
- source_word: יָד אֶשְׁלַח בָּכֶם
  choice: pagbubuhatan ko kayo ng kamay
  rationale: Pinananatili nito ang larawang ‘kamay’ at ang malinaw na banta ng sapilitang pagkilos, nang hindi tinutukoy ang eksaktong uri ng kaparusahan.
- source_word: מִן הָעֵת הַהִיא
  choice: Mula noon
  rationale: Natural at maikling panandang temporal na nagpapakita ng naging bunga ng babala.
- source_word: לֹא בָאוּ
  choice: hindi na sila pumunta roon
  rationale: Ang “hindi na” ay likas na naghahayag ng pagtigil mula sa panahong iyon; idinagdag ang “roon” upang maging malinaw sa Tagalog ang pagbabalik sa lugar sa tabi ng pader.
- source_word: בַּשַּׁבָּת
  choice: kapag Sabbath
  rationale: Malinaw at maikli itong tumutukoy sa pagdating nila sa panahon ng Sabbath, habang pinananatili ang kinikilalang katawagan.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Ang “sa tapat ng pader” ay nagpapanatili sa lokasyonal na saklaw ng Hebreo, at ang banta ay isinalin bilang idyomang Tagalog na may talab ngunit hindi labis na nagpapakahulugan.
