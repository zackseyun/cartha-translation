base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/025.yaml
  text: 'So I contended with them and cursed them[a], and I struck some of the men and pulled out their hair, and I made them swear by God: “You shall not give your daughters to their sons[b], nor take any of their daughters for your sons or for yourselves.”'
translation:
  language: tl
  text: 'Kaya nakipagtalo ako sa kanila at sinumpa ko sila[a]. Sinaktan ko ang ilan sa mga lalaki at binunot ko ang kanilang buhok. Pagkatapos, pinanumpa ko sila sa Diyos: “Huwag ninyong ibibigay ang inyong mga anak na babae sa kanilang mga anak na lalaki[b], at huwag kayong kukuha ng alinman sa kanilang mga anak na babae para sa inyong mga anak na lalaki o para sa inyong mga sarili.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “binigkas ko ang sumpa laban sa kanila.”'
    reason: Nililinaw na ang pandiwa ay tumutukoy sa pagbigkas ng sumpa, hindi lamang sa pang-iinsulto.
  - marker: b
    text: 'Sa Hebreo, “kung ibibigay ninyo ... at kung kukuha kayo ...”; sa konteksto ng panunumpa, mariing pagbabawal ang diwa: “huwag ninyong ibibigay ... at huwag kayong kukuha.”'
    reason: Pinananatili sa tala ang literal na porma ng Hebreo at ipinaliliwanag kung bakit isinalin itong pagbabawal.
lexical_decisions:
- source_word: וָאָרִיב
  choice: nakipagtalo ako
  rationale: Ang ריב ay tumutukoy sa matinding pakikipagtalo o pakikipagtunggali. Pinananatili ng “nakipagtalo” ang tahasang komprontasyon nang hindi ito pinahihina tungo sa simpleng pagsaway o dinaragdagan ng tiyak na legal na kahulugang hindi kailangang ipahiwatig ng konteksto.
- source_word: וָאֲקַלְלֵם
  choice: sinumpa ko sila
  rationale: Karaniwang ipinahihiwatig dito ng קלל ang pagbigkas ng sumpa laban sa kanila, hindi lamang pang-iinsulto. Tuwiran at likas sa Filipino ang “sinumpa ko sila.”
- source_word: וָאַכֶּה מֵהֶם אֲנָשִׁים
  choice: pinalo ko ang ilan sa mga lalaki
  rationale: Ipinakikita ng מֵהֶם na isang bahagi lamang ng pangkat ang sinaktan. Malinaw na ipinahahayag ng “pinalo” ang pisikal na pananakit, samantalang hindi nito tinutukoy ang tindi o gamit na hindi sinasabi ng Hebreo.
- source_word: וָאֶמְרְטֵם
  choice: binunot ko ang kanilang buhok
  rationale: Ang מרט ay tumutukoy sa pagbunot o pagkal拔 ng buhok. Ginagawang tahas sa Filipino ang ipinahihiwatig na buhok bilang layon ng kilos.
- source_word: וָאַשְׁבִּיעֵם בֵּאלֹהִים
  choice: pinanumpa ko sila sa Diyos
  rationale: Ang causative na anyo ng שבע ay nangangahulugang papagpanumpain ang isang tao. Pinananatili ng “sa Diyos” ang lakas ng בֵּאלֹהִים sa pananalita ng panunumpa nang hindi nagdaragdag ng paliwanag sa mismong teksto.
- source_word: אִם תִּתְּנוּ ... וְאִם תִּשְׂאוּ
  choice: Huwag ninyong ibibigay ... at huwag kayong kukuha
  rationale: Sa konteksto ng panunumpa, ang אִם ay nagpapakilala ng mariing ipinagbabawal na nilalaman ng sumpa, hindi ng karaniwang kondisyon. Ang “huwag” ang likas na paraan sa Filipino upang ipahayag ang puwersang ito.
- source_word: בְּנֹתֵיכֶם לִבְנֵיהֶם
  choice: ang inyong mga anak na babae sa kanilang mga anak na lalaki
  rationale: 'Pinananatili nito ang direksiyon ng pag-aasawang isinasaayos: ibinibigay ang mga anak na babae upang mapangasawa ng kanilang mga anak na lalaki.'
- source_word: וְאִם תִּשְׂאוּ מִבְּנֹתֵיהֶם
  choice: at huwag kayong kukuha ng sinuman sa kanilang mga anak na babae
  rationale: Sa konteksto ng pag-aasawa, ang נשא ay nangangahulugang kumuha bilang asawa. Pinananatili ng salin ang larawan ng Hebreo habang nililinaw ng buong pangungusap ang usapin ng pag-aasawa.
- source_word: לִבְנֵיכֶם וְלָכֶם
  choice: para sa inyong mga anak na lalaki o para sa inyong sarili
  rationale: Saklaw ng pagbabawal kapuwa ang pagkuha ng mapapangasawa para sa mga anak na lalaki at ang sariling pag-aasawa ng mga kausap. Ang “o” ay likas sa Filipino sa loob ng isang pagbabawal na sumasaklaw sa dalawang posibilidad.
theological_decisions:
- issue: Paglalahad sa mararahas na hakbang ni Nehemias
  choice: Tuwirang isinalaysay ang pagsumpa, pagpalo, at pagbunot ng buhok.
  alternative: Palambutin bilang pasalitang pagsaway lamang, o palalain bilang matinding pambubugbog.
  rationale: Malupit ang disiplinang isinasalaysay ng teksto. Hindi ito dapat pagaanin, palubhain, o samahan ng moral na komentaryo sa loob ng salin.
- issue: Puwersa ng pormulang panunumpa na may אִם
  choice: 'Isinalin bilang mariing pagbabawal: “Huwag ninyong...”'
  alternative: Panatilihin bilang literal na kondisyong “Kung ibibigay ninyo...”
  rationale: Sa ganitong pormula ng panunumpa, elliptikal na ipinahahayag ng אִם ang ipinagbabawal na gagawin. Ang tahasang pagbabawal ang pinakamalinaw na modernong Filipino habang pinananatili ang solemneng puwersa ng panunumpa.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang karaniwang bokabularyo at malinaw na ayos ng pangungusap; hindi pinalambot ang mararahas na kilos at hindi rin dinagdagan ng denominasyonal o moral na interpretasyon.
