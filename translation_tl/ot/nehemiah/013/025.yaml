  verdict: revise
  source_fidelity: 'Ang salin ay tapat sa pangunahing daloy ng Hebreo: pakikipagtalo, pagsumpa, pananakit sa ilan, pagbunot ng buhok, at pagpapapanumpa sa Diyos. Gayunman, ang “pinalo” ay karaniwang nagpapahiwatig ng mas matindi o paulit-ulit na pambubugbog kaysa sa di-tiyak na “sinaktan/struck” ng וָאַכֶּה; mas maingat ang “sinaktan.” Ang pangwakas na “inyong sarili” ay kailangang gawing pangmaramihan upang tumugma sa kausap at sa לָכֶם.'
  naturalness: Likas at malinaw ang kabuuang rehistro. Mas natural at eksakto ang “alinman sa kanilang mga anak na babae” kaysa “sinuman sa kanilang mga anak na babae,” sapagkat babae ang tinutukoy na maaaring kunin bilang asawa. Ang “inyong mga sarili” ay ang wastong anyong pangmaramihan.
  terminology: Ang “sinumpa,” “binunot ang kanilang buhok,” at “pinanumpa ... sa Diyos” ay angkop at hindi nagpapasok ng doktrinal na interpretasyon. Napananatili ang pagpapahayag ng pagbabawal sa loob ng panunumpa at ang direksiyon ng mga pagsasaayos sa pag-aasawa.
  issues:
  - severity: medium
    issue: Ang “pinalo” ay maaaring magpahiwatig ng pambubugbog na higit sa tahasang sinasabi ng Hebreo.
    rationale: Ang וָאַכֶּה ay nagsasaad na sinaktan o hinampas niya ang ilan sa mga lalaki, ngunit hindi nito tinutukoy ang tindi o pag-uulit ng kilos. Ang “sinaktan” ay mas malapit sa antas ng katiyakan ng pinagmulan.
  - severity: low
    issue: Hindi tugma ang “inyong sarili” sa pangmaramihang kausap.
    rationale: Ang לָכֶם ay pangmaramihan; “inyong mga sarili” ang likas at wastong Filipino.
  - severity: low
    issue: Hindi pinakamalinaw ang “sinuman sa kanilang mga anak na babae.”
    rationale: Ang “sinuman” ay karaniwang tumutukoy sa tao nang di-tiyak; “alinman sa kanilang mga anak na babae” ang mas natural sa pagpili mula sa isang pangkat.
