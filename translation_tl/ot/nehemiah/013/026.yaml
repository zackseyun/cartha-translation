base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/026.yaml
  text: Was it not because of these things that Solomon king of Israel sinned? Yet among the many nations there was no king like him[a], and he was loved by his God, and God made him king over all Israel. Even him foreign women caused to sin.
translation:
  language: tl
  text: Hindi ba dahil sa mga bagay na ito nagkasala si Solomon, na hari ng Israel? Gayunman, sa maraming bansa ay walang haring tulad niya. Minahal siya ng kanyang Diyos, at ginawa siyang hari ng Diyos sa buong Israel. Maging siya ay inakay sa pagkakasala ng mga babaeng banyaga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga asawang banyaga.” Ang literal na sinabi ng Hebreo ay “mga babaeng banyaga”; ang “mga asawa” ay maaaring maunawaan mula sa salaysay tungkol kay Solomon ngunit hindi tahasang sinabi sa talatang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא עַל אֵלֶּה
  choice: Hindi ba dahil sa mga bagay na ito
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang nakikinig, at ang עַל ay inuunawang nagsasaad ng sanhi.
- source_word: חָטָא
  choice: nagkasala
  rationale: Karaniwan at malinaw na katumbas ng pandiwa sa kontekstong moral at panrelihiyon.
- source_word: וּבַגּוֹיִם הָרַבִּים לֹא הָיָה מֶלֶךְ כָּמֹהוּ
  choice: Gayunman, sa maraming bansa ay walang haring tulad niya
  rationale: Ipinapahayag ang paghahambing sa gitna ng maraming bansa at ang kontras sa kabila ng kasalanan ni Solomon.
- source_word: וְאָהוּב לֵאלֹהָיו הָיָה
  choice: Minahal siya ng kanyang Diyos
  rationale: Natural na aktibong pangungusap sa Tagalog na tapat sa kahulugang siya ay minamahal ng sarili niyang Diyos.
- source_word: וַיִּתְּנֵהוּ אֱלֹהִים מֶלֶךְ
  choice: ginawa siya ng Diyos na hari
  rationale: Sa konstruksiyong ito, ang נתן ay tumutukoy sa paglalagay o pagtatalaga sa tungkulin bilang hari.
- source_word: גַּם אוֹתוֹ
  choice: Maging siya
  rationale: Pinananatili ang diin at pagkabigla na kahit ang natatanging si Solomon ay naapektuhan.
- source_word: הֶחֱטִיאוּ הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: inakay sa pagkakasala ng mga babaeng banyaga
  rationale: Ipinahahayag ang causative na anyo ng pandiwa nang natural sa Tagalog, habang ang 'mga babaeng banyaga' ay tuwirang kumakatawan sa tahasang sinabi ng Hebreo.
theological_decisions:
- issue: Ang papel ng mga babaeng banyaga sa pagkakasala ni Solomon
  choice: inakay sa pagkakasala ng mga babaeng banyaga
  alternative: tinukso ng mga babaeng banyaga; nakompromiso ng kanyang mga pag-aasawa ang kanyang katapatan sa tipan
  rationale: Tahasang iniuugnay ng causative na pandiwa ang mga babae sa pagkakasala ni Solomon, ngunit hindi ipinapasok sa salin ang mekanismo o paliwanag mula sa 1 Hari 11 na hindi binabanggit sa talatang ito.
- issue: Pagkakaiba ng לֵאלֹהָיו at אֱלֹהִים
  choice: kanyang Diyos; Diyos
  alternative: Panginoon
  rationale: Pinananatili muna ang hulaping paari sa 'kanyang Diyos' at pagkatapos ang walang-hulaping 'Diyos.' Walang pangalang YHWH sa talata, kaya hindi nararapat ang 'Panginoon' bilang pantanging salin nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na ayos ng pangungusap habang pinananatili ang retorikal na tanong, ang diin sa 'maging siya,' at ang tahasang causative na ugnayan sa huling sugnay.
