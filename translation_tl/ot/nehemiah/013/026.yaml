revisions:
- from: Hindi ba dahil sa mga bagay na ito kaya nagkasala si Solomon na hari ng Israel? Gayunman, sa maraming bansa ay walang haring tulad niya. Minahal siya ng kanyang Diyos, at ginawa siya ng Diyos na hari sa buong Israel. Maging siya ay inakay sa pagkakasala ng mga babaeng banyaga.[a]
  to: Hindi ba dahil sa mga bagay na ito nagkasala si Solomon, na hari ng Israel? Gayunman, sa maraming bansa ay walang haring tulad niya. Minahal siya ng kanyang Diyos, at ginawa siyang hari ng Diyos sa buong Israel. Maging siya ay inakay sa pagkakasala ng mga babaeng banyaga.[a]
