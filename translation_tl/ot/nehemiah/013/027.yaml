  yaml_path: translation/ot/nehemiah/013/027.yaml
  text: Should we then listen to you and do all this great evil[b][a], acting unfaithfully against our God by marrying foreign women?
translation:
  language: tl
  text: At dapat ba naming marinig tungkol sa inyo na ginagawa ninyo ang lahat ng malaking kasamaang ito—na nagtataksil kayo sa ating Diyos sa pag-aasawa[b] ng mga dayuhang babae?
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Sa literal, “pagpapatahan sa mga dayuhang babae.” Sa kontekstong ito, tumutukoy ito sa pagkuha sa kanila bilang mga asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִשְׁמַע ... וְלָכֶם
  choice: dapat ba namin kayong pakinggan
  rationale: Ang Niphal ng שׁמע kasama ng לָכֶם ay isang retorikal na tanong tungkol sa pakikinig o pagsunod sa kausap. Pinananatili ng “pakinggan” ang pangunahing larawan ng pandiwa, habang inilalagay sa talababa ang mas matalas na diwang “sundin.”
- source_word: לַעֲשֹׂת אֵת כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: gawin ang lahat ng malaking kasamaang ito
  rationale: Tuwirang pinananatili ang karaniwang diwa ng עשה na “gawin,” ang kabuuang puwersa ng כָּל, at ang matinding moral na bigat ng “malaking kasamaan.”
- source_word: לִמְעֹל בֵּאלֹהֵינוּ
  choice: ang pagtataksil sa ating Diyos
  rationale: Ang מעל ay tumutukoy sa pagsira ng katapatan, kadalasa'y may bigat na tipan. Ang “pagtataksil” ay likas at malinaw sa Filipino at hindi ito nililimitahan sa ritwal na paglabag lamang.
- source_word: לְהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: sa pamamagitan ng pag-aasawa ng mga babaeng dayuhan
  rationale: Ang לְהֹשִׁיב ay literal na “patirahin,” ngunit sa konteksto ay tumutukoy sa pagkuha sa mga babaeng dayuhan bilang asawa. Inihahayag ng salin ang kontekstuwal na kahulugan, habang pinananatili sa talababa ang literal na anyo.
theological_decisions:
- issue: Uri ng kasalanan sa לִמְעֹל בֵּאלֹהֵינוּ
  choice: pagtataksil sa ating Diyos
  alternative: paggawa ng kasalanan laban sa ating Diyos; ritwal na paglabag laban sa ating Diyos
  rationale: May relasyonal at tipanang bigat ang מעל. Pinananatili ng “pagtataksil” ang paglabag sa katapatan nang hindi ipinapalagay na ritwal lamang ang usapin.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kayo” bilang pangmaramihang tuwirang kausap at ang “ating Diyos” upang panatilihin ang inklusibong unang panauhan ng Hebreo. Ang gitling-pahaba ay nag-uugnay sa “malaking kasamaan” at sa paliwanag kung ano ito.
