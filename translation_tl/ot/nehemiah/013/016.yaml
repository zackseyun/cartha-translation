  text: Also Tyrians lived in it[a], bringing in fish and every kind of merchandise[b], and selling them on the Sabbath to the sons of Judah, and in Jerusalem.
translation:
  language: tl
  text: Nanirahan din doon ang mga taga-Tiro. Nagdadala sila ng isda at lahat ng uri ng paninda, at ipinagbibili ang mga iyon sa mga taga-Juda sa araw ng Sabat, at sa Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “mga taga-Juda” ay literal na “mga anak ng Juda” sa Hebreo. Ang huling pariralang “at sa Jerusalem” ay maaari ring unawain nang may diin: “maging sa Jerusalem” o “sa Jerusalem mismo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצֹּרִים
  choice: May mga taga-Tiro rin
  rationale: Ang צֹרִים ay tumutukoy sa mga taong mula sa Tiro. Ipinahahayag ng “rin” ang pagpapatuloy ng tala ng mga paglabag sa Sabbath, at likas sa modernong Tagalog ang “mga taga-Tiro.”
- source_word: יָשְׁבוּ בָהּ
  choice: naninirahan doon
  rationale: Ang יָשְׁבוּ ay nangangahulugang nanirahan o tumira. Ang hulaping pambabae sa בָהּ ay tumutukoy sa lungsod ng Jerusalem; malinaw at natural itong naipahahayag ng “doon” sa konteksto.
- source_word: מְבִיאִים
  choice: Nagdadala sila
  rationale: Ang Hiphil participle ng בוא ay naglalarawan ng patuloy na pagdadala ng mga kalakal papasok sa lungsod. Ginawang hayag ang simuno sa Tagalog upang maging malinaw ang daloy.
- source_word: דָּאג
  choice: isda
  rationale: Karaniwang katawagan ito sa isda at angkop sa konteksto ng pamilihan.
- source_word: וְכָל מֶכֶר
  choice: at lahat ng uri ng paninda
  rationale: Ang מֶכֶר ay mga bagay na ipinagbibili o kalakal. Ang “lahat ng uri ng paninda” ay natural at malinaw sa makabagong Tagalog.
- source_word: וּמֹכְרִים
  choice: at ipinagbibili nila ang mga iyon
  rationale: Ipinagpapatuloy ng participle ang paglalarawan sa nakagawiang gawain. Ang “mga iyon” ay tumutukoy sa isda at iba pang paninda at idinagdag para sa likas na Tagalog.
- source_word: בַּשַּׁבָּת
  choice: sa araw ng Sabbath
  rationale: Pinananatili ang tiyak na banal na araw at malinaw na ipinahahayag na doon naganap ang pangangalakal.
- source_word: לִבְנֵי יְהוּדָה
  choice: sa mga anak ng Juda
  rationale: Pinananatili ang literal na larawang “mga anak ng Juda” sa tekstong pangunahing salin, habang inilalahad sa talababa ang mga natural na kolektibong alternatibo.
- source_word: וּבִירוּשָׁלִָם
  choice: at sa Jerusalem
  rationale: Pinananatili ang payak na koordinasyon ng Hebreo at hindi tahasang nilulutas kung ang parirala ay simpleng lokasyon o may diin na “maging sa Jerusalem.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang “Sabbath” bilang kinikilalang tawag sa banal na araw, ang literal na “mga anak ng Juda” na may paliwanag sa talababa, at ang bahagyang alanganing koordinasyon sa hulihan upang hindi alisin ang tunay na sintaktikong kalabuan ng Hebreo.
