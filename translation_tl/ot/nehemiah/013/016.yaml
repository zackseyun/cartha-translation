revisions:
- from: May mga taga-Tiro ring naninirahan doon. Nagdadala sila ng isda at lahat ng uri ng paninda, at ipinagbibili nila ang mga iyon sa araw ng Sabbath sa mga anak ng Juda[a], at sa Jerusalem[b].
  to: Nanirahan din doon ang mga taga-Tiro. Nagdadala sila ng isda at lahat ng uri ng paninda, at ipinagbibili ang mga iyon sa mga taga-Juda sa araw ng Sabat, at sa Jerusalem.[a]
  rationale: Ginawang mas natural ang Tagalog at mas angkop ang aspektong naratibo, habang pinanatili ang lahat ng elemento ng Hebreo. Inilipat sa talababa ang literal na “mga anak ng Juda,” at pinagsama ang dalawang paliwanag dahil kapwa tumutukoy ang mga ito sa iisang pangwakas na sugnay at walang kinakailangang hiwalay na pang-angkla sa rebisadong pangungusap.
