  source_fidelity: Tumpak ang pagtukoy sa apat na itinalaga, sa kani-kanilang mga titulo/pangkat, sa kalabuan ng וְעַל־יָדָם, at sa dahilan na sila ay kinilalang maaasahan. Gayunman, ang “ang mga bahagi” ay walang hayag na katumbas sa Hebreo sa talatang ito; ang pandiwang לַחֲלֹק ay “mamamahagi/maghahati,” at ang ipinamamahagi ay iniiwan nitong di-tiyak, bagaman maliwanag sa mas malawak na konteksto.
  naturalness: Natural at angkop ang pangkalahatang rehistro. Ang “tungkulin nilang mamahagi” ay mas tuwiran at mas magaan sa modernong Filipino kaysa “pananagutan nilang ipamahagi ang mga bahagi,” habang iniiwasan ang pagdaragdag ng isang hayag na layon na wala sa pinagmulan.
  terminology: Maayos ang “silid-imbakan,” “pari,” “eskriba,” “Levita,” at “mga kapatid.” Ang “mapagkakatiwalaan” ay mahusay na katumbas ng נֶאֱמָנִים נֶחְשָׁבוּ. Napananatili rin ng “kasama nila” ang hindi tiyak na ugnayang ipinahihiwatig ng וְעַל־יָדָם.
