base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/013.yaml
  text: And I appointed over the storerooms Shelemiah the priest[a], Zadok the scribe, and Pedaiah from the Levites, and Hanan son of Zaccur, son of Mattaniah, at their side, because they were considered faithful[c][b]; and it was upon them to distribute to their brothers.
translation:
  language: tl
  text: At inatasan kong mamahala sa mga silid-imbakan si Selemias na pari, si Zadok na eskriba, at si Pedaias na mula sa mga Levita; kasama nila[a] si Hanan na anak ni Zacur na anak ni Matanias. Itinuring silang mapagkakatiwalaan[b], at tungkulin nilang mamahagi sa kanilang mga kapatid[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nasa ilalim ng kanilang pamamahala” o “nasa tabi nila.” Maaaring magpahiwatig ang idyomang Hebreo ng malapit na pakikipagtulungan o paglilingkod bilang katulong.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “itinuring silang tapat” o “maaasahan.”
    reason: lexical_alternative
  - marker: c
    text: Ang “mga kapatid” ay salin ng panlalaking katawagan sa Hebreo; dito ay tumutukoy ito sa kanilang mga kasamahan sa komunidad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹצְרָה עַל אֹצָרוֹת
  choice: inatasan kong mamahala sa mga silid-imbakan
  rationale: Ipinahihiwatig ng pandiwa at ng pariralang kasunod nito na nagtalaga si Nehemias ng mga mamamahala. Ang “mga silid-imbakan” ay angkop sa konteksto ng pag-iingat at pamamahagi ng mga handog at panustos.
- source_word: שֶׁלֶמְיָה הַכֹּהֵן
  choice: Selemias na pari
  rationale: Isinalin ang titulo at ginamit ang likas na anyong Filipino ng pangalan.
- source_word: צָדוֹק הַסֹּפֵר
  choice: Zadok na eskriba
  rationale: Maaaring tumukoy ang סֹפֵר sa eskriba o kalihim na opisyal. Pinananatili ng “eskriba” ang malawak at tradisyonal na kahulugan ng titulo nang hindi nililimitahan ang tungkulin.
- source_word: וּפְדָיָה מִן הַלְוִיִּם
  choice: Pedaias na mula sa mga Levita
  rationale: Malapit ito sa tahasang pananalita ng Hebreo at malinaw na tinutukoy ang pangkat na kinabibilangan niya.
- source_word: וְעַל יָדָם
  choice: kasama nila
  rationale: Ang idyoma ay maaaring mangahulugang nasa tabi, kaugnay, o nasa ilalim ng pamamahala ng iba. Ang “kasama nila” ay natural at hindi labis na nagpapasya sa eksaktong antas ng awtoridad; inilalahad sa talababa ang ibang posibilidad.
- source_word: כִּי נֶאֱמָנִים נֶחְשָׁבוּ
  choice: Itinuring silang mapagkakatiwalaan
  rationale: Pinananatili nito kapuwa ang ideya ng pagiging maaasahan at ang paghatol o pagkilala ng iba sa kanilang katangian.
- source_word: וַעֲלֵיהֶם לַחֲלֹק
  choice: pananagutan nilang ipamahagi ang mga bahagi
  rationale: Ang parirala ay nagtatalaga ng responsibilidad, at ang חלק sa kontekstong ito ay tumutukoy sa paghahati at pamamahagi ng nakalaang bahagi.
- source_word: לַאֲחֵיהֶם
  choice: sa kanilang mga kapatid
  rationale: Pinananatili ang panlalaking katawagang pangkamag-anak sa Hebreo, habang nililinaw sa talababa na tumutukoy ito sa kanilang mga kasamahan sa komunidad.
theological_decisions:
- issue: Saklaw ng אֲחֵיהֶם
  choice: kanilang mga kapatid
  alternative: kanilang mga kapwa Levita / kanilang mga kasamahan
  rationale: Tahasan ang panlalaking pangmaramihang katawagang “mga kapatid” sa Hebreo. Hindi espesipikong sinasabi ng talata na mga Levita lamang ang tinutukoy, kaya pinanatili ang anyo ng pinagmulan at ipinaliwanag ang konteksto sa talababa.
- issue: Ugnayan ni Hanan sa ibang mga itinalaga
  choice: kasama nila
  alternative: nasa ilalim ng kanilang pamamahala / nasa tabi nila
  rationale: May tunay na kalabuan ang idyomang וְעַל יָדָם kung si Hanan ay kapantay na kasama o katulong na nasa ilalim ng kanilang pangangasiwa. Hindi ito tahasang nilutas sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang malinaw na wikang administratibo (“inatasang mamahala,” “pananagutan”) at pinanatili sa mga talababa ang mga tunay na kalabuan ng Hebreo.
