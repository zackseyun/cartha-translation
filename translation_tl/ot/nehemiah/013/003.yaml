  naturalness: Likas at marangal ang pangkalahatang rehistro. Mas malinaw at mas natural sa modernong Filipino ang ayos na “inihiwalay nila mula sa Israel ang buong haluang pangkat.”
  terminology: Ang “Kautusan” ay angkop para sa הַתּוֹרָה sa kontekstong ito, at dapat panatilihin ang “Israel.” Ang “haluang pangkat” ay maingat na salin ng kolektibong עֵרֶב at hindi nito ipinipilit na lahi lamang ang tinutukoy.
