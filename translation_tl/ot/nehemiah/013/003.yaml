  text: And when they heard the law[a], they separated from Israel all the mixed multitude.
translation:
  language: tl
  text: Nang marinig nila ang Kautusan, inihiwalay nila mula sa Israel ang buong haluang pangkat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang lahat ng may haluang pinagmulan” o “ang halo-halong pangkat.” Ang salitang Hebreo na עֵרֶב ay kolektibong katawagan para sa isang haluang grupo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעָם
  choice: Nang marinig nila
  rationale: Ang וַיְהִי ay nag-uugnay sa kasunod na pangyayari, at ang כְּ na may infinitive construct at hulapi ay bumubuo ng temporal na sugnay. Likas sa Tagalog ang payak na “Nang marinig nila.”
- source_word: הַתּוֹרָה
  choice: ang Kautusan
  rationale: Sa kontekstong ito, tumutukoy ito sa makapangyarihang Kautusang Mosaic na binasa sa bayan. Ang “Kautusan” ay malinaw, marangal, at karaniwang salin sa Tagalog.
- source_word: וַיַּבְדִּילוּ
  choice: inihiwalay nila
  rationale: Ang בדל ay nangangahulugang magbukod o maghiwalay. Pinananatili ng “inihiwalay” ang kilos nang hindi ipinapasok ang mas interpretibong “pinaalis” o “itinakwil.”
- source_word: כָל עֵרֶב
  choice: ang lahat ng kabilang sa haluang pangkat
  rationale: Ang עֵרֶב ay isang kolektibong katawagan para sa isang halo-halong grupo. Ipinahahayag ng salin ang kolektibong diwa habang iniiwasang tiyaking lahi lamang ang tinutukoy.
- source_word: מִיִּשְׂרָאֵל
  choice: sa Israel
  rationale: Ang מִן ay nagpapahiwatig ng pagkakahiwalay mula sa Israel bilang pamayanang tipan. Sa pariralang Tagalog na “inihiwalay ... sa Israel,” natural na naipahahayag ang relasyong ito.
theological_decisions:
- issue: Ang tinutukoy ng “Israel” sa konteksto ng pamayanan pagkatapos ng pagkakatapon
  choice: Panatilihin ang “Israel” bilang pangalan ng pamayanang tipan.
  alternative: “sa mga Israelita” o “sa kapulungan ng Israel”
  rationale: Tuwirang ginagamit ng Hebreo ang pangalang יִשְׂרָאֵל. Ang pagpapanatili rito ay hindi nagpapaliit sa kahulugang pangkatawan lamang at hindi rin nagdaragdag ng paliwanag na wala sa teksto.
- issue: Ang kahulugan ng עֵרֶב
  choice: “haluang pangkat,” na may talababa para sa tunay na kalabuan
  alternative: “mga may haluang lahi” o “halo-halong karamihan”
  rationale: Maaaring tumukoy ang kolektibong termino sa mga taong may haluang pinagmulan o sa isang halu-halong kasamang pangkat. Hindi tiyak na nilulutas ng mismong talata ang saklaw nito, kaya pinananatili ang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Kautusan” para sa תּוֹרָה at pinanatili ang “Israel” bilang pangalang pangkomunidad. Ang talababa ay sadyang nagpapanatili sa leksikal na kalabuan ng עֵרֶב.
