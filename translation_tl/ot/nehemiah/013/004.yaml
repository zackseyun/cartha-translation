base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/004.yaml
  text: Before this[a], Eliashib the priest, who had been appointed over the chamber of the house of our God, was related to Tobiah—
translation:
  language: tl
  text: Bago nito, ang paring si Eliasib, na inatasang mamahala sa silid ng bahay ng ating Diyos, ay may malapit na kaugnayan kay Tobias[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ay kamag-anak ni Tobias” o “ay malapit na kasamahan ni Tobias.” Maaaring tumukoy ang pananalitang Hebreo sa malapit na ugnayang pampamilya o panlipunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְנֵי מִזֶּה
  choice: Bago nito
  rationale: Likas na salin ng temporal na pariralang tumutukoy sa naunang pangyayari; hindi na kailangang gawing tahasang “At bago nito” sa Filipino.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן
  choice: si Eliasib na pari
  rationale: Isinalin ang tiyak na titulo sa natural na kayariang Filipino habang pinananatili ang pangalan at tungkulin.
- source_word: נָתוּן בְּלִשְׁכַּת בֵּית אֱלֹהֵינוּ
  choice: na itinalaga sa silid ng bahay ng ating Diyos
  rationale: Ang נָתוּן ay nagsasaad ng pagkakatalaga, at ang לִשְׁכָּה ay silid o silid-imbakan sa templo. Pinananatili ng “sa silid” ang anyo ng Hebreo nang hindi tiyak na ipinapasok ang ideya ng pamamahala na hindi tahasang minarkahan.
- source_word: קָרוֹב לְטוֹבִיָּה
  choice: ay kamag-anak ni Tobias
  rationale: Maaaring magpahiwatig ang parirala ng ugnayang pampamilya o malapit na pakikisalamuha. Ang “kamag-anak” ay angkop sa konteksto, habang inilalagay sa talababa ang tunay na alternatibong panlipunang kaugnayan.
theological_decisions:
- issue: Uri ng kaugnayan nina Eliasib at Tobias
  choice: kamag-anak ni Tobias
  alternative: malapit na kasamahan ni Tobias
  rationale: Hindi lubos na tinutukoy ng קָרוֹב לְ ang eksaktong uri ng pagiging malapit. Ginamit sa teksto ang malamang na ugnayang pampamilya ngunit hindi inalis ang leksikal na posibilidad ng malapit na pakikisalamuha.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahay ng ating Diyos” upang mapanatili ang konkretong larawan at unang panauhang maramihan ng Hebreo. Ang gitling sa hulihan ay nagpapakitang nagpapatuloy ang pangungusap sa susunod na talata.
