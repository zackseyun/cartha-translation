base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/031.yaml
  text: And for the offering of wood at appointed times[a], and for the firstfruits—remember me, my God, for good.
translation:
  language: tl
  text: At para sa handog ng kahoy sa mga takdang panahon[a], at para sa mga unang bunga—alalahanin mo ako, Diyos ko, para sa ikabubuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paglalaan ng kahoy.” Tumutukoy ang Hebreo sa nakatakdang paglalaan ng kahoy para gamitin sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֻרְבַּן הָעֵצִים
  choice: handog na kahoy
  rationale: Tumutukoy ito sa kahoy na itinakdang ihandog o ilaan para sa paggamit sa templo. Likas at maikli sa makabagong Filipino ang “handog na kahoy,” habang nananatili ang kontekstong pangkulto.
- source_word: בְּעִתִּים מְזֻמָּנוֹת
  choice: sa mga takdang panahon
  rationale: Ipinahihiwatig ng parirala ang mga pormal na itinakdang pagkakataon; malinaw at natural ang “mga takdang panahon.”
- source_word: בִּכּוּרִים
  choice: mga unang bunga
  rationale: Karaniwang katawagan ito sa mga unang ani o bunga na inihahandog sa Diyos, nang hindi nililimitahan ang salita sa isang uri lamang ng ani.
- source_word: זָכְרָה לִּי
  choice: alalahanin mo ako
  rationale: Tuwirang pinananatili ang paulit-ulit na pormula ng panalangin ni Nehemias na humihiling na siya ay alalahanin ng Diyos.
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: Tuwirang katumbas ng personal na pagtawag sa Diyos.
- source_word: לְטוֹבָה
  choice: para sa ikabubuti
  rationale: Pinananatili nito ang maikli at hindi ganap na tinutukoy na pakiusap para sa mabuting resulta o kanais-nais na pag-alaala, nang hindi ito tahasang ginagawang gantimpala o pagpapala.
theological_decisions:
- issue: Kahulugan ng קֻרְבַּן הָעֵצִים
  choice: handog na kahoy
  alternative: paglalaan ng kahoy
  rationale: Pinananatili ng “handog” ang panrelihiyon at pangtemplong diwa ng קֻרְבַּן, samantalang nililinaw ng talababa na ang tinutukoy ay ang nakaiskedyul na paglalaan ng kahoy para sa templo.
- issue: Pangwakas na pakiusap na לְטוֹבָה
  choice: para sa ikabubuti
  alternative: nang may lingap
  rationale: Hindi tinutukoy ng Hebreo kung ang hinihinging mabuti ay pagsang-ayon, pagpapala, o kapaki-pakinabang na bunga. Iniiwasan ng salin na lutasin ang sadyang kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling daloy ng pangwakas na tala at panalangin ni Nehemias, pati ang bahagyang kalabuan ng huling parirala.
