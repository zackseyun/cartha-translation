  source_fidelity: Ang mga pangalang Sallai, Kallai, Amok, at Eber ay tapat sa Hebreo. Gayunman, ang “sambahayan” ay hindi tahasang nasa teksto; ang לְ ay isang maigsi at malawak na panandang kaugnayan sa talaan. Mas mainam na huwag itong palawakin sa pangunahing teksto.
  naturalness: Mas natural at maigsi sa modernong Tagalog na gamitin ang “Para kay ...” sa estilong talaan. Ang pagdaragdag ng “si” bago sa mga pangalang inililista ay nagbibigay ng malinaw na estruktura nang hindi dinaragdagan ang nilalaman.
