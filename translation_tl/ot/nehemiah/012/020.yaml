lexical_decisions:
- source_word: לְ/סַלַּי
  choice: para sa sambahayan ni Sallai
  rationale: Sa talaang ito, ang prefiks na לְ ay nag-uugnay sa kasunod na tao sa pinangalanang angkan o sambahayan ng mga pari. Nilinaw ang ipinahihiwatig na ugnayan upang maging natural sa Tagalog.
- source_word: קַלָּי
  choice: Kallai
  rationale: Tuwirang transliterasyon ng pangalang Hebreo, na pinananatili ang dobleng katinig at hulíng tunog na -ai.
- source_word: לְ/עָמוֹק
  choice: para sa sambahayan ni Amok
  rationale: Katulad ng unang sugnay, ipinakikilala ng לְ ang sambahayan ng mga pari na kinakatawan ng kasunod na pangalan.
- source_word: עֵבֶר
  choice: Eber
  rationale: Transliterasyong malapit sa mga katinig ng Hebreong עֵבֶר. Hindi idinagdag ang tradisyonal na H na matatagpuan sa ilang salin.
