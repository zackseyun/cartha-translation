revisions:
- from: Pagkatapos, inakyat ko sa ibabaw ng pader ang mga pinuno ng Juda. Inilagay ko roon ang dalawang malaking pangkat ng mga nagpapasalamat na magprusisyon.[a] Ang isa ay pumunta sa kanan sa ibabaw ng pader, patungo sa Tarangkahan ng Basura.[b]
  to: Pagkatapos, pinaakyat ko sa ibabaw ng pader ang mga pinuno ng Juda, at itinalaga ko ang dalawang malalaking pangkat ng pasasalamat at mga prusisyon.[a] Ang isa ay lumakad pakanan sa ibabaw ng pader, patungo sa Tarangkahan ng Basura.[b]
  rationale: Nilinaw ang causative na pandiwa sa “pinaakyat ko,” pinalitan ang malabong “roon” ng seremonyal na “itinalaga ko,” at pinanatiling hiwalay ang “mga prusisyon” upang hindi magdagdag ng isang mas tiyak na ugnayang sintaktiko kaysa sa ipinahihiwatig ng Hebreo. Itinama rin ang bilang sa literal na talababa.
