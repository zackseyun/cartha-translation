base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/031.yaml
  text: Then I brought the leaders of Judah up onto the wall[a], and I appointed two great thanksgiving choirs and processions[b], one going to the right on the wall toward the Dung Gate.
translation:
  language: tl
  text: Pagkatapos, pinaakyat ko sa ibabaw ng pader ang mga pinuno ng Juda, at itinalaga ko ang dalawang malalaking pangkat ng pasasalamat at mga prusisyon.[a] Ang isa ay lumakad pakanan sa ibabaw ng pader, patungo sa Tarangkahan ng Basura.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “dalawang malalaking pasasalamat at mga prusisyon.” Sa kontekstong ito, malamang na ang “mga pasasalamat” ay tumutukoy sa organisadong mga pangkat, marahil mga koro, na nagbibigay-pasalamat habang nagpuprusisyon.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “hanggang sa Tarangkahan ng Basura.” Sa kontekstong ito ng paglalakbay, ang pang-ukol ay maaaring mangahulugang “hanggang sa” o “patungo sa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וָאַעֲלֶה
  choice: inakyat ko
  rationale: Ang Hiphil ng עלה ay may causative na diwang ‘paakyatin’ o ‘dalhin paitaas.’ Natural sa Tagalog ang ‘inakyat ko ... ang mga pinuno’ sa kahulugang isinama o dinala sila pataas.
- source_word: שָׂרֵי יְהוּדָה
  choice: mga pinuno ng Juda
  rationale: Maaaring tumukoy ang שָׂרִים sa mga prinsipe, opisyal, o pinuno. Ang ‘mga pinuno’ ay malinaw at hindi nagpapahiwatig na mga anak sila ng hari.
- source_word: מֵעַל לַחוֹמָה
  choice: sa ibabaw ng pader
  rationale: Ipinahihiwatig ng parirala ang pag-akyat hanggang sa ibabaw ng pader, kung saan ginanap ang prusisyon.
- source_word: וָאַעֲמִידָה
  choice: inilagay ko roon
  rationale: Ang Hiphil ng עמד ay ‘patayuin, ilagay, italaga sa puwesto.’ Ang ‘inilagay ko roon’ ay natural at pinananatili ang sinadyang pagsasaayos ng mga pangkat.
- source_word: תֹודֹת גְּדוֹלֹת
  choice: dalawang malaking pangkat ng mga nagpapasalamat
  rationale: Literal itong ‘dalawang malaking pasasalamat,’ ngunit sa konteksto ay metonimikong tumutukoy sa organisadong mga pangkat na nagpapasalamat, malamang na mga mang-aawit.
- source_word: וְתַהֲלֻכֹת
  choice: na magprusisyon
  rationale: Ang pangngalang mula sa הלך ay tumutukoy sa paglakad o prusisyon. Isinama ito sa paglalarawan sa mga pangkat upang maging natural sa Tagalog at maiwasan ang maling pagbasa na may hiwalay pang dalawang uri ng grupo.
- source_word: לַיָּמִין
  choice: sa kanan
  rationale: Pinanatili ang literal na direksiyon na ‘sa kanan’ sa halip na ipalit ang ipinapalagay na ‘patimog.’
- source_word: לְשַׁעַר הָאַשְׁפֹּת
  choice: patungo sa Tarangkahan ng Basura
  rationale: Ang אַשְׁפֹּת ay dumi o basurang itinatapon. Malinaw sa modernong Tagalog ang ‘Tarangkahan ng Basura,’ at ang ‘patungo sa’ ay angkop sa direksiyonal na לְ.
