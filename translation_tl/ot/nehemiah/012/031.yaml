translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘pader’ at ‘tarangkahan’ bilang malinaw na katawagan, at pinanatili ang ‘sa kanan’ upang huwag magdagdag ng direksiyong hindi tahasang binanggit sa Hebreo.
