  naturalness: Natural ang karamihan ng bokabularyo, ngunit mas malinaw at mas marangal ang “pinaakyat ko” kaysa “inakyat ko” upang litaw ang pagpapagawa/pagpapapunta, at ang “itinakda ko” ay mas angkop sa seremonyal na pagsasaayos kaysa “inilagay ko roon.”
