base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/025.yaml
  text: Mattaniah, Bakbukiah, Obadiah, Meshullam, Talmon, and Akkub were guards, gatekeepers, keeping watch at the storehouses of the gates.
translation:
  language: tl
  text: Sina Matanias, Bakbukias, Obadias, Mesulam, Talmon, at Akub ay mga bantay, mga tagapagbantay ng pintuan, na nagbabantay sa mga silid-imbakan ng mga pintuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga tipunan sa mga pintuan.” Hindi tiyak ang kahulugan ng salitang Hebreo na isinaling “mga silid-imbakan.”
    reason: Pinananatili ang leksikal na kawalang-katiyakan ng bihirang salitang Hebreo אֲסֻפִּים nang hindi inaalis ang pangunahing pagbasa.
lexical_decisions:
- source_word: שֹׁמְרִים שֹׁעֲרִים
  choice: mga bantay at mga tagapagbantay ng pintuan
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na katawagan sa Hebreo: pangkalahatang ‘mga bantay’ at tiyak na tungkuling ‘mga tagapagbantay ng pintuan.’'
- source_word: מִשְׁמָר
  choice: Nagbabantay sila
  rationale: Inihahayag sa natural na Filipino ang ideya ng pagtupad ng takdang pagbabantay o pagbabantay bilang tungkulin.
- source_word: בַּאֲסֻפֵּי הַשְּׁעָרִים
  choice: sa mga silid-imbakan sa mga pintuan
  rationale: Ang אֲסֻפִּים ay malamang na tumutukoy sa mga imbakan o silid na kaugnay ng mga pintuan; ginamit ang malinaw ngunit hindi labis na espesipikong ‘mga silid-imbakan.’
