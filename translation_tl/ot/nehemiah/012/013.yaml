    text: O “Kay Ezra … kay Amarias.” Sa Hebreo, ang pang-ukol ay maaari ring isaling “ng”; sa talaang ito, malamang na ipinahihiwatig nito ang sambahayan ng mga pari na kinakatawan ng bawat pangalan.
