lexical_decisions:
- source_word: לְ/עֶזְרָא
  choice: para kay Ezra
  rationale: 'Sa talaang ito, ang לְ ay nagpapahiwatig ng kaugnayan o pagkatawan: si Mesulam ang katapat na kinatawan ng sambahayan ni Ezra. Pinananatili ng “para kay” ang kayarian ng Hebreo nang natural sa Filipino.'
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Pangalang pantangi; isinalin-titik sa anyong madaling basahin sa modernong Filipino, kung saan ang Hebreong sh ay karaniwang kinakatawan ng s.
- source_word: לַ/אֲמַרְיָה
  choice: para kay Amarias
  rationale: Tulad ng unang parirala, ipinahihiwatig ng לַ ang sambahayan o pangkat na kinakatawan. Ginamit ang nakaugaliang anyong Filipino na “Amarias.”
- source_word: יְהוֹחָנָן
  choice: Jehohanan
  rationale: Pinanatili ang buong hugis ng pangalang Hebreo, kabilang ang bahaging Yeho-, sa halip na paikliin ito bilang Johanan.
