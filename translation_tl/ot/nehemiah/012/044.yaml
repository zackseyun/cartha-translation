  text: וַ/יִּפָּקְד֣וּ בַ/יּוֹם֩ הַ/ה֨וּא אֲנָשִׁ֜ים עַל הַ/נְּשָׁכ֗וֹת לָ/א֨וֹצָר֥וֹת לַ/תְּרוּמוֹת֮ לָ/רֵאשִׁ֣ית וְ/לַ/מַּֽעַשְׂרוֹת֒ לִ/כְנ֨וֹס בָּ/הֶ֜ם לִ/שְׂדֵ֤י הֶ/עָרִים֙ מְנָא֣וֹת הַ/תּוֹרָ֔ה לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם כִּ֚י שִׂמְחַ֣ת יְהוּדָ֔ה עַל הַ/כֹּהֲנִ֥ים וְ/עַל הַ/לְוִיִּ֖ם הָ/עֹמְדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/044.yaml
  text: On that day men were appointed over the storerooms for the contributions[a], for the firstfruits, and for the tithes, to gather into them from the fields of the cities the portions required by the law for the priests and for the Levites[c][b], for Judah rejoiced over the priests and over the Levites who were serving.
translation:
  language: tl
  text: Noong araw na iyon, itinalaga ang mga lalaki upang mamahala sa mga silid-imbakan[a] para sa mga ambag, mga unang bunga, at mga ikasampung bahagi. Titipunin nila roon, mula sa mga bukirin ng mga lunsod, ang mga bahaging itinakda ng Kautusan[b] para sa mga pari at sa mga Levita, sapagkat ikinagalak ng Juda ang mga pari at ang mga Levitang naglilingkod[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga silid.” Ang salitang Hebreo ay tumutukoy sa mga silid o kuwarto, ngunit dito ay malinaw ang gamit ng mga ito bilang imbakan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga bahagi ng Kautusan,” samakatuwid ay ang mga bahaging itinakda ng Torah para sa mga pari at mga Levita.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “mga nakatayo.” Sa konteksto ng templo, tumutukoy ito sa pagtayo upang tumupad ng tungkulin, samakatuwid ay sa paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפָּקְדוּ
  choice: nagtalaga
  rationale: Ipinahihiwatig ng anyong Hebreo na ang mga lalaki ay pormal na itinalaga upang mamahala; ang aktibong di-tiyak na konstruksyon ay likas sa modernong Tagalog.
- source_word: אֲנָשִׁים
  choice: mga lalaki
  rationale: Pinananatili ang tahasang panlalaking pangngalan ng Hebreo sa halip na gawing pangkalahatang “mga tao.”
- source_word: הַנְּשָׁכוֹת לָאֹצָרוֹת
  choice: mga silid-imbakan
  rationale: Ang mga silid na tinutukoy ay ginagamit na imbakan ng mga banal na handog; pinagsasama ng salin ang lokasyon at tungkulin nang hindi nagdaragdag ng hiwalay na mga kabang-yaman.
- source_word: לַתְּרוּמוֹת
  choice: mga handog
  rationale: Tumutukoy sa mga ambag na ibinukod para sa banal na gamit. Mas natural sa Tagalog ang “mga handog” kaysa teknikal na katawagan.
- source_word: לָרֵאשִׁית
  choice: mga unang bunga
  rationale: Karaniwang katawagan sa unang ani o bunga na inihahandog sa Diyos.
- source_word: וְלַמַּעַשְׂרוֹת
  choice: mga ikasampung bahagi
  rationale: Maliwanag at tuwirang katumbas ng mga ikasampung bahaging ibinibigay ayon sa Kautusan.
- source_word: לִכְנוֹס בָּהֶם
  choice: Titipunin nila roon
  rationale: Ipinahahayag ang paglikom at paglalagay sa mga nabanggit na silid sa likas na ayos ng Tagalog.
- source_word: לִשְׂדֵי הֶעָרִים
  choice: mula sa mga bukirin ng mga lunsod
  rationale: Pinananatili ang ugnayan ng mga bukirin sa kani-kanilang lunsod o pamayanang sakop.
- source_word: מְנָאוֹת הַתּוֹרָה
  choice: mga bahaging itinakda ng Kautusan
  rationale: Nililinaw na ang mga bahaging ito ay yaong iniatas o itinakda sa Torah, habang ang literal na anyo ay ibinibigay sa talababa.
- source_word: הָעֹמְדִים
  choice: naglilingkod
  rationale: Sa konteksto ng templo, ang literal na “nakatayo” ay tumutukoy sa pagharap at pagtupad ng tungkulin; “naglilingkod” ang likas na kahulugan sa Tagalog.
theological_decisions:
- issue: Ang kahulugan ng “Juda” sa כִּי שִׂמְחַת יְהוּדָה
  choice: ikinagalak ng Juda
  alternative: ikinagalak ng mga taga-Juda
  rationale: Pinananatili ang metonimikong pangalan ng pamayanan ayon sa anyo ng Hebreo, nang hindi nililimitahan o pinalalawak ang saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Kautusan” bilang likas na katumbas ng Torah sa kontekstong ito. Hinati sa dalawang pangungusap ang mahabang sugnay upang luminaw ang administratibong gawain nang hindi binabago ang ugnayang sanhi sa hulihan.
