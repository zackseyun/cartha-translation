  - severity: medium
    issue: '"Mga handog" para sa תרומות'
    rationale: Maaaring umabot ang "handog" sa iba’t ibang uri ng alay, samantalang tumutukoy rito ang תרומות sa mga ambag na ibinukod para sa banal na gamit. Mas tumpak ang "mga ambag."
