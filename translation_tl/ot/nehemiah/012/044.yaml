  verdict: revise
  source_fidelity: Tumpak sa kabuuan ang administratibong pagtatalaga, paglikom mula sa mga bukirin ng mga lunsod, mga bahaging itinakda ng Kautusan, at kagalakan ng Juda. Gayunman, ang וַיִּפָּקְדוּ ay pasibo sa Hebreo; ang "nagtalaga" ay maaaring maging katanggap-tanggap na di-tiyak na aktibo sa Tagalog, ngunit mas malapit at mas malinaw ang "itinalaga ang mga lalaki." Ang "mga ambag" ay mas eksaktong katumbas ng תרומות kaysa sa mas malawak na "mga handog."
  naturalness: Natural at marangal ang rebisyon. Ang "Noong araw na iyon" at ang pasibong "itinalaga" ay malinaw na modernong Tagalog. Ang paglalagay ng talababa c mismo kasunod ng "naglilingkod" ay mas malinaw na pag-angkla kaysa paglalagay nito pagkatapos ng tuldok.
  terminology: Pinananatili ang "Kautusan," "unang bunga," "ikasampung bahagi," "mga pari," at "mga Levita." Pinalitan ang "mga handog" ng "mga ambag" upang maipakita ang תרומות bilang mga kaloob o kontribusyong ibinukod, nang hindi ito ipinagpapalagay na lahat ay mga handog na sakripisyo.
