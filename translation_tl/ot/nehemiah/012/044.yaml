revisions:
- from: Nang araw na iyon, nagtalaga ng mga lalaki na mamamahala sa mga silid-imbakan[a] para sa mga handog, mga unang bunga, at mga ikasampung bahagi. Titipunin nila roon, mula sa mga bukirin ng mga lunsod, ang mga bahaging itinakda ng Kautusan[b] para sa mga pari at sa mga Levita, sapagkat ikinagalak ng Juda ang mga pari at mga Levitang naglilingkod.[c]
  to: Noong araw na iyon, itinalaga ang mga lalaki upang mamahala sa mga silid-imbakan[a] para sa mga ambag, mga unang bunga, at mga ikasampung bahagi. Titipunin nila roon, mula sa mga bukirin ng mga lunsod, ang mga bahaging itinakda ng Kautusan[b] para sa mga pari at sa mga Levita, sapagkat ikinagalak ng Juda ang mga pari at ang mga Levitang naglilingkod[c].
  rationale: Ginawa ang maliliit na pagbabago upang higit na mailapit ang salin sa pasibong pagtatalaga sa Hebreo at upang ihiwalay ang mga sagradong ambag (תרומות) mula sa mas pangkalahatang kahulugan ng “mga handog.” Hindi binago ang saklaw ng mga silid-imbakan o ang metonimikong “Juda,” at pinanatili ang umiiral na mga paliwanag sa talababa.
