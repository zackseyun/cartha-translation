  text: וּ/מִ/בְּנֵ֥י הַ/כֹּהֲנִ֖ים בַּ/חֲצֹצְר֑וֹת זְכַרְיָ֨ה בֶן יֽוֹנָתָ֜ן בֶּן שְׁמַֽעְיָ֗ה בֶּן מַתַּנְיָה֙ בֶּן מִ֣יכָיָ֔ה בֶּן זַכּ֖וּר בֶּן אָסָֽף־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/035.yaml
  text: 'and from the sons of the priests[a], with trumpets: Zechariah son of Jonathan, son of Shemaiah, son of Mattaniah, son of Micaiah, son of Zaccur, son of Asaph.'
translation:
  language: tl
  text: 'at mula sa mga anak ng mga pari na may mga trumpeta: si Zacarias na anak ni Jonatan, na anak ni Semaias, na anak ni Matanias, na anak ni Micaías, na anak ni Zacur, na anak ni Asaf.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי הַ/כֹּהֲנִים
  choice: at mula sa mga anak ng mga pari
  rationale: Pinananatili ang partitive na diwa ng מן bilang “mula sa,” nang hindi tahasang nagdaragdag ng “ilan” na wala sa Hebreo. Ang “mga anak” ay angkop din sa pormang pangangkanan ng talata.
- source_word: בַּ/חֲצֹצְרוֹת
  choice: na may mga trumpeta
  rationale: Instrumental o associational ang בְּ dito; natural sa Filipino ang “may mga trumpeta” para ilarawan ang mga paring kalahok sa prusisyon.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Ginamit ang kinikilalang anyong Filipino ng pangalang biblikal.
- source_word: בֶן
  choice: anak ni
  rationale: Pare-parehong isinalin ang paulit-ulit na panandang pangangkanan upang mapanatili ang estruktura ng talaangkanan.
- source_word: יֽוֹנָתָן
  choice: Jonatan
  rationale: Karaniwang anyong Filipino ng pangalan.
- source_word: שְׁמַֽעְיָה
  choice: Semaias
  rationale: Anyong Filipino na malinaw na kumakatawan sa pangalang Hebreo.
- source_word: מַתַּנְיָה
  choice: Matanias
  rationale: Anyong Filipino ng pangalan, alinsunod sa kumbensiyong ginagamit sa mga pangalang biblikal.
- source_word: מִיכָיָה
  choice: Micaías
  rationale: Pinanatili ang mas mahabang anyo ng pangalan upang hindi ito ipagkamali sa mas maikling pangalang Mikas.
- source_word: זַכּוּר
  choice: Zacur
  rationale: Malapit na transliterasyong Filipino ng pangalang Hebreo.
- source_word: אָסָף
  choice: Asaf
  rationale: Karaniwang anyong Filipino ng pangalan; walang idinagdag na paliwanag tungkol sa pagkakabilang sa angkan o pangkat ni Asaf.
theological_decisions:
- issue: Ugnayang pangangkanan kay Asaf
  choice: Tuwirang panatilihin ang sunod-sunod na “anak ni”
  alternative: Unawain ang huling “anak ni Asaf” bilang mas malawak na “inapo ni Asaf”
  rationale: Paulit-ulit na בֶן ang gamit ng Hebreo. Pinananatili ng salin ang pahayag ng teksto nang hindi nagpapasiya kung ang bawat ugnayan ay agarang ama-anak o isang pinaikling talaangkanan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong listahan ng Hebreo at ang pagkakaugnay nito sa naunang talata. Walang talababa dahil ang partitive na “mula sa” ay naipahayag nang sapat sa pangunahing teksto.
