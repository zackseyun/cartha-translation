  text: וְֽ/אֶחָ֡י/ו שְֽׁמַעְיָ֡ה וַ/עֲזַרְאֵ֡ל מִֽלֲלַ֡י גִּֽלֲלַ֡י מָעַ֞י נְתַנְאֵ֤ל וִֽ/יהוּדָה֙ חֲנָ֔נִי בִּ/כְלֵי שִׁ֥יר דָּוִ֖יד אִ֣ישׁ הָ/אֱלֹהִ֑ים וְ/עֶזְרָ֥א הַ/סּוֹפֵ֖ר לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/036.yaml
  text: and his brothers—Shemaiah[a], Azarel, Milalai, Gilalai, Maai, Nethanel, Judah, and Hanani—with the musical instruments of David the man of God, and Ezra the scribe before them.
translation:
  language: tl
  text: at ang mga kapatid niyang sina Semaya, Azarel, Milalai, Gilalai, Maai, Netanel, Juda, at Hanani, kasama ang mga instrumentong pangmusika[a] ni David, ang tao ng Diyos; at si Ezra na eskriba ay nasa unahan nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga instrumento ng awit.”
    reason: Ipinakikita ang mas literal na posibleng paglilipat ng בִּכְלֵי שִׁיר.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: at ang mga kapatid niya
  rationale: Pinananatili ang pangunahing kahulugan ng אֶחָיו na “mga kapatid niya,” kahit maaari itong tumukoy sa malalapit na kasamahan sa pangkat ng mga Levita.
- source_word: שְׁמַעְיָה ... חֲנָנִי
  choice: Semaya, Azarel, Milalai, Gilalai, Maai, Netanel, Juda, at Hanani
  rationale: Isinalin sa baybay na madaling bigkasin sa modernong Filipino habang nananatiling malapit sa mga pangalang Hebreo.
- source_word: בִּכְלֵי שִׁיר
  choice: na may dalang mga instrumentong pangmusika
  rationale: Ang כְּלֵי ay mga kagamitan o instrumento at ang שִׁיר ay awit o musika. Likas sa konteksto ng prusisyon ang “may dalang,” samantalang malinaw at karaniwan ang “mga instrumentong pangmusika.”
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: ni David, ang tao ng Diyos
  rationale: Ipinahahayag ng parirala ang kaugnayan ng mga instrumento kay David at pinananatili ang biblikal na panturing na “tao ng Diyos” nang hindi dinaragdagan ang kahulugan.
- source_word: וְעֶזְרָא הַסּוֹפֵר
  choice: si Ezra na eskriba
  rationale: Ang “eskriba” ay maikli at kinikilalang katumbas ng הַסּוֹפֵר bilang tungkulin ni Ezra.
- source_word: לִפְנֵיהֶם
  choice: nasa unahan nila
  rationale: Malinaw na inilalarawan nito ang puwesto ni Ezra sa unahan ng pangkat sa prusisyon.
theological_decisions:
- issue: Paglilipat ng panturing na אִישׁ הָאֱלֹהִים
  choice: ang tao ng Diyos
  alternative: ang lingkod ng Diyos
  rationale: Mas tuwirang pinananatili ng “tao ng Diyos” ang tradisyonal at intertekstuwal na panturing. Ang “lingkod” ay maaaring magdagdag ng kahulugang wala sa mismong parirala.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “kapatid,” “tao ng Diyos,” at “eskriba” upang mapanatili ang mahahalagang terminong biblikal; hinati sa dalawang pangungusap ang mahabang talaan upang maging natural basahin.
