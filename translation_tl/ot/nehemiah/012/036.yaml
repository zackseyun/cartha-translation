    rationale: Ang “Nasa unahan nila si Ezra” bilang hiwalay na pangungusap ay maaaring magmukhang hiwalay na pangyayari, samantalang ang waw sa Hebreo ay nag-uugnay kay Ezra sa parehong prosisyonal na paglalarawan.
