translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pangkat ng pasasalamat” upang mapanatili ang lawak ng Hebreong termino nang hindi ipinapalagay na koro lamang ang grupo; inilagay sa talababa ang mas tiyak na mga alternatibo.
