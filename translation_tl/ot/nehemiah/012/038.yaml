base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/038.yaml
  text: And the second thanksgiving choir was going to the left[a], and I followed behind it, with half of the people on the wall, from above the Tower of the Ovens as far as the Broad Wall.
translation:
  language: tl
  text: At ang ikalawang pangkat ng pasasalamat ay naglakad pakaliwa[a]. Sumunod ako sa likuran nito, kasama ang kalahati ng mga tao sa ibabaw ng pader, mula sa ibabaw ng Tore ng mga Hurno hanggang sa Malapad na Pader.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ikalawang koro ng pasasalamat” o “ikalawang prusisyon ng pasasalamat.” Ang salitang Hebreo ay maaaring tumukoy sa pangkat na nagpapahayag ng pasasalamat sa isang seremonyal na prusisyon, hindi lamang sa pag-awit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתּוֹדָה
  choice: pangkat ng pasasalamat
  rationale: Sa konteksto ng pagtatalaga at dalawang organisadong prusisyon sa pader, tumutukoy ito sa pangkat na nagpapahayag ng pasasalamat, hindi lamang sa abstraktong pasasalamat o sa pag-awit lamang.
- source_word: הַשֵּׁנִית
  choice: ikalawang
  rationale: Tuwirang ordinal na naglalarawan sa pangkat ng pasasalamat.
- source_word: הַהוֹלֶכֶת
  choice: naglakad
  rationale: Natural itong naglalarawan sa pagkilos ng pangkat sa salaysay; ipinahihiwatig ng Hebreong participle ang nagpapatuloy na paglakad.
- source_word: לְמוֹאל
  choice: pakaliwa
  rationale: Ang מוֹאל ay tumutukoy sa kaliwang panig o direksiyon; malinaw at natural ang “pakaliwa” sa Tagalog.
- source_word: אַחֲרֶיהָ
  choice: sa likuran nito
  rationale: Puwesto sa prusisyon ang tinutukoy, at ang hulaping pambabae ay bumabalik sa pangkat ng pasasalamat.
- source_word: חֲצִי הָעָם
  choice: kalahati ng mga tao
  rationale: Payak na pariralang tumutukoy sa isang hati ng nagkakatipong sambayanan.
- source_word: מֵעַל לְהַחוֹמָה
  choice: sa ibabaw ng pader
  rationale: Ipinahihiwatig ng konteksto na ang mga tao at prusisyon ay nasa ibabaw o tuktok ng pader.
- source_word: מֵעַל לְמִגְדַּל הַתַּנּוּרִים
  choice: mula sa tapat ng Tore ng mga Hurno
  rationale: Ang מֵעַל dito ay may diwang lokasyonal na “sa ibabaw/tapat ng” palatandaang tore; “mula sa tapat ng” ay natural sa paglalarawan ng rutang nasa pader.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: Tore ng mga Hurno
  rationale: Pinananatili ang anyong pangalan ng lugar at ang literal na diwa ng mga hurno o pugon.
- source_word: הַחוֹמָה הָרְחָבָה
  choice: Malapad na Pader
  rationale: Malamang na kilalang bahagi ito ng pader ng Jerusalem, kaya isinalin bilang pangalang pantangi.
