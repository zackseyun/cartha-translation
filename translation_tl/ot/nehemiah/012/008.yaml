base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/008.yaml
  text: And the Levites were Jeshua[a], Binnui, Kadmiel, Sherebiah, Judah, and Mattaniah, who, with his brothers[b], was over the thanksgiving songs.
translation:
  language: tl
  text: At ang mga Levita ay sina Jesua, Binui, Kadmiel, Serebias, Juda, at Matanias.[a] Si Matanias, kasama ng kanyang mga kapatid, ang namamahala sa mga awit ng pasasalamat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O maaaring unawain ang parirala nang mas kolektibo: ang mga Levitang nabanggit, kasama ng kanilang mga kapatid, ang namamahala. Gayunman, ang panghalip na Hebreo ay isahan at pinakanatural na tumutukoy kay Matanias.'
    reason: alternative_reading
  - marker: b
    text: Sa literal, “mga pasasalamat.” Malamang na tumutukoy ito sa mga awit o liturhikal na pagpapahayag ng papuri at pasasalamat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: At ang mga Levita ay sina
  rationale: Ipinakikilala ng parirala ang kasunod na pangkat sa talaan. Ang “ay sina” ay likas sa Filipino bago ang listahan ng mga pangalan at pinupunan ang walang pandiwang sugnay sa Hebreo.
- source_word: יֵשׁוּעַ בִּנּוּי קַדְמִיאֵל שֵׁרֵבְיָה יְהוּדָה מַתַּנְיָה
  choice: Jesua, Binui, Kadmiel, Serebias, Juda, at Matanias
  rationale: Isinalin sa karaniwang anyong Filipino ang mga pangalang Hebreo sa halip na bigyan ang mga ito ng kahulugang leksikal.
- source_word: עַל
  choice: ang namamahala
  rationale: Sa kontekstong ito, ipinahihiwatig ng pang-ukol ang pananagutan o pangangasiwa. Natural at malinaw sa Filipino ang “namamahala.”
- source_word: הֻיְּדוֹת
  choice: mga awit ng pasasalamat
  rationale: Ang pangngalan ay tumutukoy sa mga liturhikal na pagpapahayag ng pasasalamat o papuri. Sa konteksto ng tungkulin ng mga Levita, malinaw na naipahahayag ng “mga awit ng pasasalamat” ang malamang na musikal na gamit nito nang hindi ikinukubli ang mas malawak na literal na diwa.
- source_word: הוּא
  choice: Si Matanias
  rationale: Isinasaad nang tuwiran ang pinakamalamang na tinutukoy ng panghalip na isahan—si Matanias, ang huling pangalang binanggit—upang maging natural ang Filipino. Itinatala sa talababa ang posibleng kolektibong pagkaunawa.
- source_word: וְאֶחָיו
  choice: kasama ng kanyang mga kapatid
  rationale: Pinananatili nito ang panlalaking katawagang pampamilya ng Hebreo at malinaw na ipinakikitang kasama ni Matanias ang iba pang kaugnay na Levita sa tungkulin.
theological_decisions:
- issue: Ang tinutukoy ng panghalip na isahan na הוּא pagkatapos ng listahan ng mga Levita
  choice: Tumutukoy ito kay Matanias, na kasama ng kanyang mga kapatid ay namamahala sa mga awit ng pasasalamat.
  alternative: Maaaring unawain ang parirala bilang kolektibong pagtukoy sa mga Levitang nakalista at sa kanilang mga kapatid.
  rationale: Ang panghalip na isahan ay pinakanatural na tumutukoy sa huling pangalang si Matanias. Gayunman, dahil sumusunod ito sa isang listahang maramihan, pinananatili sa talababa ang posibleng kolektibong pagbasa sa halip na tuluyang alisin ang ambiguwidad.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mga Levita,” “namamahala,” at “mga awit ng pasasalamat” bilang natural na mga parirala para sa karaniwang mambabasa. Hinati sa dalawang pangungusap upang maging malinaw ang pagtukoy ng panghalip nang hindi binabago ang ugnayang sintaktiko ng talata.
