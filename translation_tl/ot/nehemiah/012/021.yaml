translation:
  language: tl
  text: Para kay Hilkias[a] ay si Hasabias; para kay Jedaias ay si Netanel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ni Hilkias … ni Jedaias.” Ang pang-ukol na Hebreo na ל ay maaaring magpahiwatig ng kaugnayan o pagkatawan sa listahang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/חִלְקִיָּה
  choice: para kay Hilkias
  rationale: Sa talaang ito, ang לְ ay nagpapahiwatig ng kaugnayan o pagkatawan sa sambahayan ni Hilkias. Ang “para kay” ay natural sa Filipino at pinananatili ang maikling anyo ng listahan.
- source_word: חֲשַׁבְיָה
  choice: Hasabias
  rationale: Pangalang pantangi; tinumbasan sa anyong madaling bigkasin sa Filipino, alinsunod sa karaniwang pag-aangkop ng mga pangalang Hebreo.
- source_word: לִ/ידַעְיָה
  choice: para kay Jedaias
  rationale: Gaya ng unang parirala, ang לִ ay tumutukoy sa sambahayan o pangkat na kinakatawan. Pinananatili ng “para kay” ang ugnayang sadyang hindi ganap na tinutukoy ng Hebreo.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Pangalang pantangi; malapit na transliterasyon mula sa Hebreo at natural basahin sa Filipino.
