  text: ל/עדיא זְכַרְיָ֖ה לְ/גִנְּת֥וֹן מְשֻׁלָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/016.yaml
  text: for Iddo[a], Zechariah; for Ginnethon, Meshullam.
translation:
  language: tl
  text: para kay Adaya[a], si Zacarias; para kay Gineton, si Mesulam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, may pang-ukol na ל (“sa/para kay/ukol kay”) bago ang mga pangalang Adaya at Gineton. Dito, ang “para kay” ay nagpapahiwatig na sina Zacarias at Mesulam ang mga kinatawan ng kani-kanilang angkan o sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל/עדיא
  choice: para kay Adaya
  rationale: Ang pang-ukol na ל sa talaang ito ay nagpapahiwatig ng kaugnayan o pagkatawan. Isinalin itong “para kay” nang hindi tahasang idinaragdag sa teksto ang “angkan” o “sambahayan.” Ang Hebreong pangalan ay Adaya, hindi Iddo.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo; siya ang indibidwal na nakaugnay sa naunang pangalan sa pares.
- source_word: לְ/גִנְּתוֹן
  choice: para kay Gineton
  rationale: Katulad ng unang ל, ipinahihiwatig nito ang kaugnayan o pagkatawan sa loob ng talaan; pinanatili ang pangalan bilang transliterasyon.
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Makabagong transliterasyong Filipino ng personal na pangalang Hebreo, na pinasimple ang dobleng katinig na hindi likas sa baybay-Filipino.
theological_decisions: []
translation_notes:
  register: Maikli at dignified ang anyo upang mapanatili ang estilo ng talaan. Ginamit ang natural na Filipino na “para kay …, si …” at mga baybay na Adaya, Zacarias, Gineton, at Mesulam. Sinunod ang WLC na ל/עדיא (“Adaya”); ang “Iddo” sa English consultation text ay hindi tugma sa ibinigay na Hebreong pinagmulan.
