  text: and Maaseiah[a], Shemaiah, Eleazar, Uzzi, Jehohanan, Malkijah, Elam, and Ezer. And the singers made their voices heard[b], with Izrahiah the overseer.
translation:
  language: tl
  text: at sina Maaseya, Semaya, Eleazar, Uzi, Jehohanan, Malkiya, Elam, at Ezer. Ipinarinig ng mga mang-aawit ang kanilang tinig[a], at si Izrahia ang tagapangasiwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “umaawit nang malakas.” Causative ang pandiwang Hebreo: “ipinarinig” o “ginawang marinig.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “opisyal” o “superbisor.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂיָה, שְׁמַעְיָה, אֶלְעָזָר, עֻזִּי, יְהוֹחָנָן, מַלְכִּיָּה, עֵילָם, עָזֶר, יִזְרַחְיָה
  choice: Maaseya, Semaya, Eleazar, Uzi, Jehohanan, Malkiya, Elam, Ezer, Izrahia
  rationale: Isinalin-baybay ang mga pangalang pantangi sa paraang malapit sa anyong Hebreo at madaling basahin sa makabagong Filipino.
- source_word: וַיַּשְׁמִיעוּ
  choice: Ipinarinig ... ang kanilang tinig
  rationale: Pinananatili nito ang causative na diwa ng Hiphil ng שמע, habang natural na ipinahihiwatig sa konteksto na malinaw o malakas ang pag-awit.
- source_word: הַמְשֹׁרְרִים
  choice: mga mang-aawit
  rationale: Tuwirang tawag sa mga taong umaawit sa konteksto ng prusisyon at pagsamba.
- source_word: הַפָּקִיד
  choice: tagapangasiwa
  rationale: Tumutukoy sa taong itinalaga upang mamahala o mangasiwa; hindi nito pinalalabis ang ranggo ni Izrahia.
