  source_fidelity: 'Tapat ang salin sa Hebreo: kumpleto ang talaan ng mga pangalan, naipahahayag ng “Ipinarinig ... ang kanilang tinig” ang causative na diwa ng וַיַּשְׁמִיעוּ, at wastong isinasalin ang הַמְשֹׁרְרִים bilang “mga mang-aawit” at הַפָּקִיד bilang “tagapangasiwa.” Ang “at si Izrahia ang tagapangasiwa” ay isang natural na Tagalog na paraan upang ilahad ang huling nominal na parirala.'
