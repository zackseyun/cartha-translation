lexical_decisions:
- source_word: עִדּוֹא
  choice: Ido
  rationale: Tuwirang transliterasyon sa makabagong ortograpiyang Filipino; ang dobleng katinig ng Hebreo ay hindi kailangang katawanin sa baybay-Filipino, at hindi binibigkas bilang hiwalay na patinig ang panghuling aleph.
- source_word: גִנְּתוֹי
  choice: Ginetoi
  rationale: Sinusunod ang anyong Masoretiko sa talatang ito at inaangkop sa likas na baybay at bigkas sa Filipino; hindi ito pinapalitan ng kaugnay na anyong Gineton na matatagpuan sa ibang tradisyon o konteksto.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Tuwirang inililipat ang pangalang Hebreo sa Filipino. Pinananatili ang tunog na -ya sa halip na gumamit ng anyong Ingles na Abijah o ng anyong nahubog sa ibang tradisyong pangwika.
