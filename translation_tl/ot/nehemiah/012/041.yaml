  yaml_path: translation/ot/nehemiah/012/041.yaml
  text: 'and the priests: Eliakim[a], Maaseiah, Miniamin, Micaiah, Elioenai, Zechariah, and Hananiah, with trumpets.'
translation:
  language: tl
  text: 'at ang mga pari: sina Eliakim, Maaseias, Miniamin, Micaias, Elioenai, Zacarias, at Hananias, na may mga trumpeta[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasama ang mga trumpeta.” Maaaring ipinahihiwatig ng Hebreo na ang mga paring ito ay may dalang mga trumpeta o nakatalaga sa mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/כֹּהֲנִים
  choice: at ang mga pari
  rationale: Pinananatili ng “at” ang ugnayan sa naunang talaan, at ang “mga pari” ang tuwiran at likas na salin ng הַכֹּהֲנִים.
- source_word: אֶלְיָקִים מַעֲשֵׂיָה מִנְיָמִין מִיכָיָה אֶלְיוֹעֵינַי זְכַרְיָה חֲנַנְיָה
  choice: sina Eliakim, Maaseias, Miniamin, Micaias, Elioenai, Zacarias, at Hananias
  rationale: Isinalin sa karaniwang anyong Filipino ang mga pangalang may nakaugaliang baybay sa Bibliyang Tagalog, habang malapit pa rin sa mga anyong Hebreo; ginamit ang “sina” bilang likas na pananda sa magkakasunod na pangalan ng mga tao.
- source_word: בַּ/חֲצֹצְרֽוֹת
  choice: na may mga trumpeta
  rationale: Maaaring magpahiwatig ang בְּ ng pagdadala, pagtatalaga, o paggamit ng mga trumpeta. Ang “na may mga trumpeta” ay natural sa Filipino at hindi labis na nagpapasya kung hawak lamang o tinutugtog ang mga ito.
