base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/024.yaml
  text: And the heads of the Levites were Hashabiah[a], Sherebiah, and Jeshua son of Kadmiel, with their brothers opposite them, to praise and to give thanks according to the command of David the man of God[b], watch corresponding to watch.
translation:
  language: tl
  text: Ang mga pinuno ng mga Levita ay sina Hasabias, Serebias, at Jesua na anak ni Kadmiel, kasama ang kanilang mga kapatid na lalaki na nakaharap sa kanila[a], upang magpuri at magpasalamat ayon sa utos ni David, ang tao ng Diyos—isang pangkat ng paglilingkod na katapat ng isa pang pangkat ng paglilingkod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nasa tapat nila” o “katugma nila.” Malamang na inilalarawan nito ang magkaharap o magkatugmang mga pangkat ng mga Levita sa pagsamba.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “takdang paglilingkod na katapat ng takdang paglilingkod.” Malamang na tumutukoy ito sa magkatugmang mga pangkat o puwesto na nakatalaga sa paglilingkod.
    reason: cultural_note
lexical_decisions:
- source_word: רָאשֵׁי הַלְוִיִּם
  choice: mga pinuno ng mga Levita
  rationale: Ang רָאשֵׁי ay tumutukoy sa mga nangunguna. Mas natural sa modernong Tagalog ang “mga pinuno” kaysa sa literal na “mga ulo,” samantalang pinananatili ang tiyak na katawagang “mga Levita.”
- source_word: חֲשַׁבְיָה שֵׁרֵבְיָה וְיֵשׁוּעַ בֶּן קַדְמִיאֵל
  choice: Hasabias, Serebias, at Jesua na anak ni Kadmiel
  rationale: Isinulat ang mga pangalang Hebreo sa anyong madaling basahin sa Tagalog at tahasang pinanatili ang ugnayang ama-anak.
- source_word: וַאֲחֵיהֶם
  choice: ang kanilang mga kapatid na lalaki
  rationale: Pinananatili ang panlalaking pangmaramihang katawagang kinship ng Hebreo, na sa konteksto ay tumutukoy sa iba pang lalaking Levita.
- source_word: לְנֶגְדָּם
  choice: nakaharap sa kanila
  rationale: Ipinahahayag nito ang posisyong katapat o kaharap ng isa pang grupo nang hindi ipinapalagay nang tahasan ang eksaktong paraan ng pag-awit.
- source_word: לְהַלֵּל לְהוֹדוֹת
  choice: upang magpuri at magpasalamat
  rationale: Pinananatiling magkahiwalay ang dalawang gawaing panliturhiya at ipinahahayag ang layunin ng mga pawatas.
- source_word: בְּמִצְוַת דָּוִיד אִישׁ הָאֱלֹהִים
  choice: ayon sa utos ni David na tao ng Diyos
  rationale: Ang בְּמִצְוַת ay nagsasaad ng pagsunod sa isang utos; pinanatili ang tradisyonal at teolohikal na titulong “tao ng Diyos.”
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: pangkat ng paglilingkod na katapat ng pangkat
  rationale: Ang מִשְׁמָר ay maaaring tumukoy sa takdang pagbabantay o pangkat na nakatalaga sa tungkulin. Sa kontekstong Levitico, nililinaw ng “pangkat ng paglilingkod” ang gamit, habang pinananatili ng inuulit na “pangkat” at “katapat” ang eliptiko at magkatugmang kayarian ng Hebreo.
theological_decisions:
- issue: Panlalaking katawagang אֲחֵיהֶם
  choice: mga kapatid na lalaki
  alternative: mga kapwa Levita
  rationale: Tahasan ang panlalaking anyo ng Hebreo at mga lalaking Levita ang tinutukoy sa gawaing pangtemplo; hindi ito ginawang neutral nang walang batayan sa teksto.
- issue: Eliptikong pariralang panliturhiya na מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: pangkat ng paglilingkod na katapat ng pangkat
  alternative: bawat pangkat ay salit-salitang umaawit sa katapat na pangkat
  rationale: Ipinakikita ng teksto ang maayos at magkatapat na mga pangkat, ngunit hindi nito tahasang sinasabing salit-salitan ang kanilang pag-awit. Kaya hindi idinagdag ang mas tiyak na interpretasyong antiphonal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Gumamit ng “mga pinuno” sa halip na literal na “mga ulo,” at pinanatili ang maikli at eliptikong hulíng parirala upang hindi labis na ipaliwanag ang ayos ng paglilingkod.
