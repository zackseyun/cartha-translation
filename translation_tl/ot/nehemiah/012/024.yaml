revisions:
- from: Ang mga pinuno ng mga Levita ay sina Hasabias, Serebias, at Jesua na anak ni Kadmiel. Ang kanilang mga kapatid na lalaki ay nakaharap sa kanila[a] upang magpuri at magpasalamat ayon sa utos ni David na tao ng Diyos—pangkat ng paglilingkod na katapat ng pangkat.[b]
  to: Ang mga pinuno ng mga Levita ay sina Hasabias, Serebias, at Jesua na anak ni Kadmiel, kasama ang kanilang mga kapatid na lalaki na nakaharap sa kanila[a], upang magpuri at magpasalamat ayon sa utos ni David, ang tao ng Diyos—isang pangkat ng paglilingkod na katapat ng isa pang pangkat ng paglilingkod.[b]
  rationale: Pinagsama ang mga pinuno at ang kanilang mga kapatid sa iisang pangungusap upang hindi mabago ang saklaw ng layuning “magpuri at magpasalamat.” Inayos din ang huling parirala upang maipakita ang inuulit na eliptikong kayarian ng Hebreo nang hindi ipinagpapalagay na salit-salitan ang pag-awit o ang eksaktong ayos ng paglilingkod.
