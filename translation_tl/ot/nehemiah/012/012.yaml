  text: וּ/בִ/ימֵי֙ יֽוֹיָקִ֔ים הָי֥וּ כֹהֲנִ֖ים רָאשֵׁ֣י הָ/אָב֑וֹת לִ/שְׂרָיָ֣ה מְרָיָ֔ה לְ/יִרְמְיָ֖ה חֲנַנְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/012.yaml
  text: 'And in the days of Joiakim, there were priests, heads of the fathers’ houses: for Seraiah, Meraiah; for Jeremiah, Hananiah.'
translation:
  language: tl
  text: 'Noong panahon ni Joiakim, ang mga pari na pinuno ng mga angkan ay ang mga sumusunod: para sa angkan ni Seraias, si Meraias; para sa angkan ni Jeremias, si Hananias.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִימֵי יוֹיָקִים
  choice: Noong panahon ni Joyakim
  rationale: Likas na salin ng Hebreong panandang temporal; pinananatili ang pangalan ayon sa anyong madaling basahin sa Tagalog.
- source_word: כֹהֲנִים רָאשֵׁי הָאָבוֹת
  choice: ang mga pari na pinuno ng mga angkan
  rationale: Ang רָאשֵׁי ay tumutukoy sa mga pinuno, at ang הָאָבוֹת sa kontekstong talaangkanan ay mga angkan o sambahayan ng mga ninuno, hindi lamang literal na mga ama.
- source_word: לִשְׂרָיָה מְרָיָה
  choice: para sa angkan ni Seraias, si Meraias
  rationale: Ang לְ ay nag-uugnay sa bawat naunang angkan o sambahayang makapari sa kinatawan nitong pinuno; idinagdag ang 'angkan' para luminaw ang eliptikong Hebreo nang hindi binabago ang diwa.
- source_word: לְיִרְמְיָה חֲנַנְיָה
  choice: para sa angkan ni Jeremias, si Hananias
  rationale: 'Kaparehong eliptikong kayarian: ang pangalan ng angkan ay sinusundan ng pangalan ng pinuno nito.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'angkan' upang natural na maipahayag ang institusyong pampamilya at makapari na tinutukoy ng Hebreo; iniwasan ang salitang 'angkan ng mga ama' na maaaring maging malamya o malabo sa karaniwang mambabasa.
