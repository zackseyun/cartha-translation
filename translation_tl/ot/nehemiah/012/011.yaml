  text: And Joiada fathered Jonathan[a], and Jonathan fathered Jaddua.
translation:
  language: tl
  text: At si Joiada ang naging ama ni Jonatan[a], at si Jonatan ang naging ama ni Jadua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Johanan” ang mababasa sa ilang manuskrito at salin sa halip na “Jonatan.” “Jonatan” ang mababasa sa tekstong Hebreo na ginamit dito.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ
  choice: At
  rationale: Payak na nag-uugnay sa talaangkanang pahayag na ito sa naunang talata.
- source_word: יוֹיָדָע
  choice: Joiada
  rationale: Isinatinig ang pangalang pantangi ayon sa anyong Hebreo at sa karaniwang anyo nito sa Filipino.
- source_word: הוֹלִיד
  choice: ang naging ama ni
  rationale: Sa konteksto ng talaangkanan, ang Hiphil ng ילד ay tumutukoy sa pagiging ama o pag-aanak. Ang pariralang ito ay malinaw, natural, at marangal sa modernong Filipino.
- source_word: אֶת
  choice: '[hindi tuwirang isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo; naipahahayag ang tungkulin nito sa balangkas ng pangungusap sa Filipino.
- source_word: יוֹנָתָן
  choice: Jonatan
  rationale: Ito ang tuwirang pagsasatinig ng anyong יוֹנָתָן sa tekstong Hebreo. Inilagay sa talababa ang alternatibong pagbasa na “Johanan.”
- source_word: וְ
  choice: at
  rationale: Ipinagpapatuloy nito ang payak na pagkakasunod-sunod ng talaangkanan.
- source_word: יַדּוּעַ
  choice: Jadua
  rationale: Isinatinig ang pangalang pantangi mula sa anyong Hebreo sa paraang natural basahin sa Filipino.
