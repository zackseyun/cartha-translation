  text: וַֽ/יִּשְׁמְר֞וּ מִשְׁמֶ֤רֶת אֱלֹֽהֵי/הֶם֙ וּ/מִשְׁמֶ֣רֶת הַֽ/טָּהֳרָ֔ה וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים כְּ/מִצְוַ֥ת דָּוִ֖יד שְׁלֹמֹ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/045.yaml
  text: And they kept the charge of their God and the charge of purification[a], and so did the singers and the gatekeepers[b], according to the command of David and Solomon his son.
translation:
  language: tl
  text: Tinupad nila ang tungkuling iniatas ng kanilang Diyos at ang tungkulin sa paglilinis[a]. Tinupad din ng mga mang-aawit at mga tagapagbantay ng mga pintuan[b] ang kanilang mga tungkulin, ayon sa utos ni David at ng anak niyang si Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tungkulin tungkol sa kadalisayan” o “tungkulin sa ritwal na paglilinis.”
    reason: lexical_alternative
  - marker: b
    text: Eliptikal ang pariralang Hebreo tungkol sa mga mang-aawit at mga tagapagbantay ng mga pintuan; malamang na ibig sabihin ay ginampanan din ng mga pangkat na ito ang kani-kanilang tungkulin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְרוּ מִשְׁמֶרֶת
  choice: Tinupad nila ang tungkuling iniatas
  rationale: Ang tambalang שׁמר + מִשְׁמֶרֶת ay idyomang tumutukoy sa tapat na pagganap ng isang ipinagkatiwalang tungkulin. Mas natural ito sa modernong Tagalog kaysa sa literal na “iningatan ang pagbabantay.”
- source_word: אֱלֹהֵיהֶם
  choice: ng kanilang Diyos
  rationale: Pinananatili ang tahasang panghalip na hulapi ng Hebreo at ang ugnayang tipan na ipinahihiwatig nito.
- source_word: וּמִשְׁמֶרֶת הַטָּהֳרָה
  choice: at ang tungkulin sa paglilinis
  rationale: Ang הַטָּהֳרָה ay tumutukoy sa ritwal na paglilinis o kadalisayan sa konteksto ng paglilingkod sa templo. Ang “paglilinis” ay malinaw sa karaniwang mambabasa at hindi nilulutas nang labis ang saklaw ng salita.
- source_word: וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: gayundin ang mga mang-aawit at mga bantay ng pintuang-bayan
  rationale: Walang pandiwa ang pariralang Hebreo at eliptikal ito. Ang “gayundin” ay nagpapahiwatig na ginampanan din ng dalawang pangkat ang kani-kanilang tungkulin nang hindi nagdaragdag ng tiyak na bagay na hindi hayag sa teksto.
- source_word: שֹׁעֲרִים
  choice: mga bantay ng pintuang-bayan
  rationale: Sa konteksto ng templo, sila ang mga nakatalagang magbantay sa mga pasukan. Ang parirala ay mas tiyak kaysa sa pangkalahatang “mga bantay.”
- source_word: כְּמִצְוַת
  choice: ayon sa utos
  rationale: Ipinapahayag ng מִצְוָה rito ang may-awtoridad na tagubilin tungkol sa paglilingkod sa templo; tuwiran at natural ang “utos.”
- source_word: דָּוִיד שְׁלֹמֹה בְנוֹ
  choice: ni David at ng anak niyang si Solomon
  rationale: Nililinaw ng natural na ayos sa Tagalog na si Solomon ang anak ni David habang pinananatili ang parehong pangalan at relasyon.
theological_decisions:
- issue: Kahulugan ng הַטָּהֳרָה sa konteksto ng templo
  choice: paglilinis
  alternative: kadalisayan; ritwal na paglilinis
  rationale: Ang konteksto ay mga tungkuling Levitiko at pangtemplo, kaya malamang na ritwal ang diwa. Gayunman, hindi idinagdag sa pangunahing teksto ang salitang “ritwal,” upang hindi paliitin nang higit sa kailangan ang tunay na saklaw ng Hebreo.
- issue: Ugnayan ng mga mang-aawit at mga bantay sa naunang sugnay
  choice: Ituring silang mga karagdagang gumaganap ng kani-kanilang tungkulin
  alternative: Iugnay lamang sila sa naunang tala nang hindi nagsusuplay ng eliptikal na pandiwa
  rationale: Pinakamalamang na ipinagpapatuloy ng eliptikal na parirala ang ideya ng pagtupad sa mga iniatas na tungkulin. Minarkahan sa talababa ang sintaktikong kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tungkuling iniatas” upang natural na maipahayag ang idyomang Hebreo, at pinanatili sa mga talababa ang leksikal at sintaktikong kalabuan.
