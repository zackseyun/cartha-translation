revisions:
- from: At ang buong Israel, noong mga araw ni Zerubbabel at noong mga araw ni Nehemias, ay nagbibigay ng mga bahagi para sa mga mang-aawit at sa mga bantay-pinto, ayon sa kailangan sa bawat araw.[a] Ibinubukod nila bilang banal ang para sa mga Levita, at ibinubukod naman ng mga Levita bilang banal ang para sa mga anak ni Aaron.[b]
  to: At noong mga araw ni Zerubbabel at noong mga araw ni Nehemias, nagbigay ang buong Israel ng mga takdang bahagi para sa mga mang-aawit at mga bantay-pinto, ayon sa pangangailangan sa bawat araw.[a] At naglaan sila ng mga bahagi bilang banal para sa mga Levita, at ang mga Levita naman ay naglaan ng mga bahagi bilang banal para sa mga anak ni Aaron.[b]
  rationale: Inayos ang daloy at idiomatikong Tagalog, at nilinaw ang ipinahihiwatig na mga bahaging inilaan sa dalawang huling sugnay. Hindi binago ang historikal na saklaw, ang mga tatanggap, o ang sagradong diwa ng pandiwang מקדישים. Nanatili ang pormal na “mga anak ni Aaron” sa pangunahing teksto at ang pagpapaliwanag nito sa talababa.
