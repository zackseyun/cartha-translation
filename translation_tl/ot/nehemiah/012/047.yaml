base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/047.yaml
  text: And all Israel[a], in the days of Zerubbabel and in the days of Nehemiah, gave the portions for the singers and the gatekeepers, as each day required; and they set apart the consecrated portions for the Levites[c][b], and the Levites set apart the consecrated portions for the sons of Aaron.
translation:
  language: tl
  text: At noong mga araw ni Zerubbabel at noong mga araw ni Nehemias, nagbigay ang buong Israel ng mga takdang bahagi para sa mga mang-aawit at mga bantay-pinto, ayon sa pangangailangan sa bawat araw.[a] At naglaan sila ng mga bahagi bilang banal para sa mga Levita, at ang mga Levita naman ay naglaan ng mga bahagi bilang banal para sa mga anak ni Aaron.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “ang bagay ng isang araw sa araw nito,” ibig sabihin, ang kailangan o takdang bahagi para sa bawat araw.'
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ni Aaron” ay tumutukoy sa mga paring nagmula sa angkan ni Aaron.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: At ang buong Israel
  rationale: Pinananatili ang kolektibong katawagan sa bayan sa halip na palawakin bilang “lahat ng Israelita.”
- source_word: בִּימֵי זְרֻבָּבֶל וּבִימֵי נְחֶמְיָה
  choice: noong mga araw ni Zerubbabel at noong mga araw ni Nehemias
  rationale: Pinananatili ang inuulit na pariralang pangkasaysayan ng Hebreo sa natural at marangal na Tagalog.
- source_word: נֹתְנִים
  choice: ay nagbibigay
  rationale: Ang participle ay nagpapahiwatig ng nakagawiang patuloy na gawain sa panahong tinutukoy; likas itong naipapahayag sa Tagalog sa aspektong imperpektibo.
- source_word: מְנָיוֹת
  choice: mga bahagi
  rationale: Tumutukoy sa mga bahaging itinakda o panustos na nauukol sa mga naglilingkod sa templo; maikli at malinaw ang “mga bahagi.”
- source_word: הַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: mga mang-aawit at mga bantay-pinto
  rationale: Mga kinikilalang tungkulin ito sa paglilingkod sa templo; malinaw sa karaniwang mambabasa ang “bantay-pinto.”
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ayon sa kailangan sa bawat araw
  rationale: Natural na ipinahahayag ang idyomang Hebreo bilang araw-araw na takdang pangangailangan, habang inilalagay sa talababa ang mas literal na anyo.
- source_word: וּמַקְדִּשִׁים ... מַקְדִּשִׁים
  choice: Ibinubukod nila bilang banal ... ibinubukod ... bilang banal
  rationale: Pinananatili ang diwa ng קדשׁ na paghihiwalay o pagtatalaga bilang banal. Ang “ang para sa” ay isang likas na Tagalog na paraan upang tukuyin ang nauunawaang bahagi nang tahasang ulitin ang salitang wala sa sugnay na Hebreo.
- source_word: לַלְוִיִּם
  choice: para sa mga Levita
  rationale: Ipinahahayag ang mga Levita bilang tatanggap ng ibinukod na bahagi.
- source_word: בְנֵי אַהֲרֹן
  choice: mga anak ni Aaron
  rationale: Pinananatili ang pormal na katawagang Hebreo at hindi agad pinapalitan ng interpretibong “mga paring mula sa angkan ni Aaron.”
theological_decisions:
- issue: Kahulugan ng מַקְדִּשִׁים sa konteksto ng panustos sa templo
  choice: ibinubukod ... bilang banal
  alternative: inilalaan / ibinibigay
  rationale: Hindi ginagawang karaniwang pagbibigay lamang ang pandiwa; pinananatili ang sagradong diwa ng pagtatalaga, ngunit hindi ipinapasok sa pangunahing teksto ang isang tahasang bagay na wala sa Hebreo.
- issue: Pagkakakilanlan ng בְנֵי אַהֲרֹן
  choice: mga anak ni Aaron
  alternative: mga paring mula sa angkan ni Aaron
  rationale: Ang pangunahing teksto ay sumusunod sa anyong Hebreo; nililinaw lamang sa talababa ang tungkuling makasaserdote ng katawagan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang historikal na pag-uulit, ang kolektibong “buong Israel,” at ang sagradong diwa ng pagbubukod bilang banal. Ginamit ang “Nehemias,” ang karaniwang anyong Filipino ng pangalan.
