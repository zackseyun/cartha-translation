  text: And Bakbukiah and Unno[a], their brothers, stood opposite them in the divisions of service.
translation:
  language: tl
  text: At sina Bakbukias at Unno[a], ang kanilang mga kapatid, ay nasa tapat nila ayon sa mga pangkat ng paglilingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring, “at sumagot sa kanila ang kanilang mga kapatid ayon sa mga pangkat,” kung babasahin ang וענו bilang pandiwa sa halip na pangalang Unno.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַקְבֻּקְיָה
  choice: At sina Bakbukias
  rationale: Isinalin ang pang-ugnay na וּ bilang “At” at isinatagalog ang anyo ng pangalang Bakbukiah bilang “Bakbukias,” alinsunod sa karaniwang anyo ng mga pangalang biblikal sa Filipino.
- source_word: ו/ענו
  choice: at Unno[a]
  rationale: Itinuring na pangalang pantangi ang anyo, gaya ng ipinahihiwatig ng talaan ng mga pangalan sa konteksto. Pinanatili sa talababa ang posibleng pagbasa rito bilang pandiwa.
- source_word: אֲחֵיהֶם
  choice: na kanilang mga kapatid
  rationale: Pinanatili ang tuwirang katawagang pangkamag-anakan na “mga kapatid”; sa konteksto, maaari rin itong tumukoy sa mga kasamahan nilang Levita.
- source_word: לְנֶגְדָּם
  choice: ay nasa tapat nila
  rationale: Ang parirala ay nangangahulugang nasa tapat, kaharap, o katapat nila. Ang “nasa tapat nila” ay natural sa Filipino at hindi nagdaragdag ng tiyak na kilos na wala sa Hebreo.
- source_word: לְמִשְׁמָרוֹת
  choice: ayon sa mga pangkat ng paglilingkod
  rationale: Ang מִשְׁמָרוֹת ay maaaring tumukoy sa mga pangkat, takdang turno, o tungkulin. Sa konteksto ng paglilingkod sa templo, malinaw ngunit hindi labis na espesipiko ang “mga pangkat ng paglilingkod.”
