  source_fidelity: Kailangang baguhin ang pagkakaugnay ng mga parirala. Sa Hebreo, ang mga Levita ang mga taong itinala bilang “mga pinuno ng mga sambahayan ng mga ninuno”; sa draft, ang “mga pinuno ng mga angkan ng mga Levita” ang nagiging tuwirang layon ng pagtatala. Ibinabalik ng rebisyon ang mga Levita bilang paksa at pinananatili ang eliptikong pagsasama ng mga pari.
  naturalness: Likas at marangal ang rebisyong Filipino. Ang “bilang mga pinuno ng mga sambahayan ng mga ninuno” ay bahagyang teknikal, ngunit angkop ito sa pormal na talaang pangangkanan at nililinaw ng tala sa ibaba.
  terminology: Ang “mga Levita,” “mga pari,” “itinala,” “Johanan,” at “Dario na Persiano” ay angkop. Pinanatili ang “mga sambahayan ng mga ninuno” upang katawanin ang teknikal na Hebreong idiom sa halip na gawing malabong “mga angkan” lamang.
