base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/022.yaml
  text: In the days of Eliashib[a], Joiada, Johanan, and Jaddua, the Levites were recorded as heads of fathers’ houses, and the priests also[c][b], during the reign of Darius the Persian.
translation:
  language: tl
  text: Noong panahon nina Eliashib, Joiada, Johanan[c], at Jaddua, ang mga Levita ay itinala[b] bilang mga pinuno ng mga sambahayan ng mga ninuno[a], gayundin ang mga pari, noong paghahari ni Dario na Persiano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga pinuno ng mga sambahayan ng mga ninuno,” isang katawagang tumutukoy sa mga angkan o malalaking sambahayang nagmula sa iisang ninuno.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “isinulat” o “ipinarehistro.”
    reason: lexical_alternative
  - marker: c
    text: Johanan ang mababasa sa tekstong Hebreo; Jonathan ang nasa ilang tradisyon ng pagsasalin.
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Karaniwang katawagan sa Filipino para sa mga kabilang sa lipi at tungkuling Levitico.
- source_word: בִּימֵי
  choice: Noong panahon nina
  rationale: Likas na salin ng Hebreong idyomang tumutukoy sa panahong saklaw ng buhay o pamumuno ng mga binanggit na tao.
- source_word: אֶלְיָשִׁיב יוֹיָדָע וְיוֹחָנָן וְיַדּוּעַ
  choice: Eliashib, Joiada, Johanan, at Jaddua
  rationale: Tuwirang transliterasyon ng mga pangalan; pinananatili ang Johanan sapagkat iyon ang nasa tekstong Hebreo.
- source_word: כְּתוּבִים
  choice: itinala
  rationale: Ipinahihiwatig ng pasibong anyo ng כתב ang pagkakasulat o pagpaparehistro sa isang talaan; natural sa kontekstong pangangkanan at pampangasiwaan ang 'itinala.'
- source_word: רָאשֵׁי אָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Inihahatid nito sa malinaw na modernong Filipino ang teknikal na katawagang Hebreo para sa mga pinuno ng mga sambahayang nagmula sa iisang ninuno.
- source_word: וְהַכֹּהֲנִים
  choice: gayundin ang mga pari
  rationale: Pinananatili ang elipsis ng Hebreo habang ipinakikitang kasama rin sa pagtatala ang mga pari.
- source_word: עַל מַלְכוּת
  choice: sa panahon ng paghahari ni
  rationale: Likas na katumbas sa Filipino ng kronolohikal na pahayag tungkol sa paghahari.
- source_word: דָּרְיָוֶשׁ הַפָּרְסִי
  choice: Dario na Persiano
  rationale: Ginagamit ang pamilyar na anyong Filipino ng pangalan at pinananatili ang katawagang etniko bilang paglalarawan.
