base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/026.yaml
  text: These were in the days of Joiakim son of Jeshua[a], son of Jozadak, and in the days of Nehemiah the governor and Ezra the priest, the scribe.
translation:
  language: tl
  text: Ang mga taong ito ay nabuhay noong panahon ni Joiakim na anak ni Jeshua, na anak ni Jozadak, at noong panahon ni Nehemias, ang gobernador, at ni Ezra, ang pari, ang eskriba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “si Ezra na paring eskriba.” Sa Hebreo, dalawang magkatabing titulo ang ibinigay kay Ezra: “ang pari” at “ang eskriba.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ang mga ito ay nabuhay
  rationale: Tumutukoy ang pangmaramihang demonstratibo sa mga taong naunang itinala. Idinagdag ang pandiwang “nabuhay” upang maging likas sa Filipino ang sugnay na walang tahasang pandiwa sa Hebreo.
- source_word: בִּימֵי
  choice: noong panahon ni
  rationale: Likas na salin sa modernong Filipino ng idyomang Hebreo na naglalagay sa mga tao sa isang yugto ng kasaysayan.
- source_word: יוֹיָקִים
  choice: Joiakim
  rationale: Transliterasyon ng pangalan ng postexilic na pinunong pari, na pinananatiling naiiba sa haring Jehoiakim.
- source_word: בֶּן יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: anak ni Jeshua, na anak ni Jozadak
  rationale: Karaniwang nangangahulugang “anak” ang בֶּן sa ganitong talaangkanan; nililinaw ng “na” na si Jeshua ang anak ni Jozadak.
- source_word: וּבִימֵי
  choice: at noong panahon ni
  rationale: Pinananatili ang inulit na pariralang pangpanahon upang masalamin ang estruktura at karagdagang pagtukoy sa panahon sa Hebreo.
- source_word: נְחֶמְיָה הַפֶּחָה
  choice: Nehemias na gobernador
  rationale: Ang פֶּחָה ay gobernador ng isang lalawigan sa ilalim ng pamamahalang imperyal; “gobernador” ang malinaw at karaniwang katumbas sa Filipino.
- source_word: וְעֶזְרָא הַכֹּהֵן הַסֹּפֵר
  choice: at ni Ezra na pari at tagapagturo ng Kautusan
  rationale: Pinananatili ang dalawang paglalarawan kay Ezra. Sa kontekstong biblikal, ang הַסּוֹפֵר ay hindi lamang tagakopya kundi dalubhasa at tagapagturo ng Kautusan; nililinaw ito sa karaniwang modernong Filipino.
theological_decisions:
- issue: Ugnayan ng dalawang titulo ni Ezra
  choice: pari at tagapagturo ng Kautusan
  alternative: paring tagapagturo ng Kautusan
  rationale: Maaaring unawain ang dalawang tiyak na katawagang Hebreo bilang magkatabing titulo o bilang isang pinagsamang paglalarawan. Pinananatili sa pangunahing teksto ang dalawang natatanging tungkulin at inilalahad sa talababa ang alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “noong panahon ni” sa halip na literal na “sa mga araw ni,” at “tagapagturo ng Kautusan” upang maipahayag sa ordinaryong mambabasa ang papel ng סֹפֵר sa kontekstong ito.
