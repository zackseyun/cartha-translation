  naturalness: Natural at marangal ang “Ang mga taong ito ay nabuhay noong panahon ni …” at ang pag-uulit ng “noong panahon.” Ang kuwit sa mga titulo ay nagpapakitang si Nehemias ang gobernador at si Ezra ang pari at eskriba.
  terminology: Panatilihin ang Joiakim, Jeshua, Jozadak, Nehemias, at Ezra. Gamitin ang “gobernador” para sa פֶּחָה at “eskriba” para sa סֹפֵר. Mas tapat ang “eskriba” kaysa “tagapagturo ng Kautusan,” na isang posibleng paglalarawan ng tungkulin ngunit hindi ang mismong titulo sa tekstong ito.
