base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/010.yaml
  text: Jeshua fathered Joiakim[a], and Joiakim fathered Eliashib[b], and Eliashib fathered Joiada.
translation:
  language: tl
  text: Si Jeshua ang naging ama ni Joiakim, si Joiakim ang naging ama ni Eliashib, at si Eliashib ang naging ama ni Joiada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵשׁוּעַ
  choice: Jeshua
  rationale: Pangngalang pantangi na tinumbasan sa karaniwang transliterasyong biblikal; napapanatili rin nitong naiiba ang taong ito kay Josue na anak ni Nun.
- source_word: הוֹלִיד
  choice: ang naging ama ni
  rationale: Ang Hiphil ng ילד sa pormulang talaangkanan ay literal na nagsasaad ng pagpapanganak ngunit idyomatikong tumutukoy sa pagiging ama; natural at marangal ito sa modernong Filipino.
- source_word: אֶת
  choice: '[hindi tuwirang isinalin]'
  rationale: Pananda ito ng tiyak na layon at walang hiwalay na katumbas na salita sa Filipino.
- source_word: יוֹיָקִים
  choice: Joiakim
  rationale: Direktang transliterasyon ng anyong Hebreo sa talata, sa halip na gamitin ang mas mahabang tradisyonal na anyong Jehoiakim.
- source_word: אֶלְיָשִׁיב
  choice: Eliashib
  rationale: Karaniwang transliterasyon ng pangalang Hebreo.
- source_word: יוֹיָדָע
  choice: Joiada
  rationale: Direktang transliterasyon ng anyong Hebreo sa talata at kaayon ng anyong Joiakim.
theological_decisions: []
translation_notes:
  register: Gumamit ng payak ngunit marangal na modernong Filipino. Inulit ang “ang naging ama ni” upang mapanatili ang malinaw na sunod-sunod na pormula ng talaangkanan sa Hebreo nang hindi gumagamit ng makalumang “ipinanganak si.”
