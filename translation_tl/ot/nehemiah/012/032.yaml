  text: Hoshaiah and half of the officials of Judah went behind them[a].
translation:
  language: tl
  text: Sumunod sa kanila si Hosaias at ang kalahati ng mga pinuno ng Juda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Naglakad sa likuran nila.” Maaaring tumukoy ang Hebreo sa pagsunod ayon sa pagkakasunod-sunod; mas tahasang inilalarawan ng alternatibo ang puwesto sa prusisyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Sumunod
  rationale: Sa konteksto ng prusisyon, ang pandiwang הלך kasama ng אַחֲרֵיהֶם ay likas na maisasalin bilang “sumunod,” na nagpapahayag ng paglakad sa hulihan ng naunang pangkat.
- source_word: אַחֲרֵיהֶם
  choice: sa kanila
  rationale: Kasama ng “Sumunod,” malinaw nitong ipinahahayag na ang pangkat ay nasa likuran o kasunod ng mga nauna; inilalagay sa talababa ang mas tahasang panandang puwesto.
- source_word: הוֹשַׁעְיָה
  choice: Hosaias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng personal na pangalang Hebreo.
- source_word: וַחֲצִי
  choice: at ang kalahati ng
  rationale: Tuwirang pinananatili ang koordinasyon ni Hosaias at ng kalahati ng isa pang pangkat.
- source_word: שָׂרֵי
  choice: mga pinuno
  rationale: Ang שַׂר ay maaaring tumukoy sa pinuno o opisyal. Ang “mga pinuno” ay natural at malawak sa Filipino, nang hindi nagpapahiwatig na mga anak sila ng hari.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Ito ang nakaugaliang anyong Filipino ng pangalan ng lupain at lipi.
