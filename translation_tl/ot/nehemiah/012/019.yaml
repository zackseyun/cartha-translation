  register: Maikli at pormal na estilong pantalaan, ngunit natural sa modernong Filipino. Idinagdag ang “si” bago sa pangalan ng kinatawan upang luminaw ang ugnayan ng mga pangalan nang hindi dinaragdagan ang kahulugan.
