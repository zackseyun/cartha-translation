  text: for Joiarib[a], Mattenai; for Jedaiah, Uzzi.
translation:
  language: tl
  text: Kay Joiarib[a], si Matenai; kay Jedaias, si Uzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at kay Joiarib, si Matenai; kay Jedaias, si Uzi.” May pangatnig na “at” sa simula ng pariralang Hebreo, ngunit maaari itong hindi na ipahayag sa isang talaan sa Filipino.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/יוֹיָרִיב
  choice: para kay Joyarib
  rationale: Ang pinagsamang pangatnig at pang-ukol (וּ + לְ) ay nagdaragdag ng kasunod na bahagi sa talaan. Likas sa Filipino na hindi na ipahayag ang pangatnig sa ganitong listahan; ang “para kay” ay nagpapakita ng kaugnayan o pagkatawan.
- source_word: מַתְּנַי
  choice: Matenai
  rationale: Pangalan ng tao; isinalin sa baybay na angkop sa bigkas at ortograpiyang Filipino.
- source_word: לִֽ/ידַֽעְיָה
  choice: para kay Jedaias
  rationale: Ang לְ ay nagpapahiwatig ng kaugnayan sa sambahayan o pangkat ni Jedaias sa talaan ng mga pari. Maikli at natural sa Filipino ang “para kay.”
- source_word: עֻזִּי
  choice: Uzi
  rationale: Pangalan ng tao; tinumbasan ayon sa karaniwang baybay sa Filipino.
