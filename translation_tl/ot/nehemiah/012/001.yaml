  text: וְ/אֵ֨לֶּה֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם אֲשֶׁ֥ר עָל֛וּ עִם זְרֻבָּבֶ֥ל בֶּן שְׁאַלְתִּיאֵ֖ל וְ/יֵשׁ֑וּעַ שְׂרָיָ֥ה יִרְמְיָ֖ה עֶזְרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/001.yaml
  text: 'These were the priests and the Levites who came up with Zerubbabel son of Shealtiel[a], and Jeshua: Seraiah, Jeremiah, Ezra.'
translation:
  language: tl
  text: 'Ito ang mga pari at mga Levita na umahon kasama nina Zerubabel, anak ni Sealtiel, at Jeshua[a]: Seraias, Jeremias, Ezra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Jeshua”; maaari ring “Josue” kung iaangkop ang pangalan sa mas kilalang anyo nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Natural na pambungad sa isang talaan sa Filipino; hindi na dinagdagan ng temporal na “ngayon,” na wala naman sa Hebreo.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: mga pari at mga Levita
  rationale: Tuwirang salin ng dalawang pangkat; inulit ang “mga” para sa malinaw at natural na Filipino.
- source_word: אֲשֶׁר עָלוּ
  choice: na umahon
  rationale: Pinananatili ang larawan ng Hebreong עלה, ang pag-ahon patungo sa Juda/Jerusalem mula sa pagkatapon.
- source_word: עִם זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל וְיֵשׁוּעַ
  choice: kasama nina Zerubabel na anak ni Sealtiel at Jeshua
  rationale: Ang “nina” ay natural kapag dalawang taong kasama ang tinutukoy; tuwirang pinananatili ang ugnayang ama-anak.
- source_word: יֵשׁוּעַ
  choice: Jeshua
  rationale: Transliterasyon ng partikular na anyong Hebreo na יֵשׁוּעַ sa halip na gawing Josue.
- source_word: שְׂרָיָה יִרְמְיָה עֶזְרָא
  choice: Seraias, Jeremias, Ezra
  rationale: Mga pangalang pantangi na bumubuo sa simula ng talaan; ginamit ang mga anyong madaling makilala sa tradisyong Filipino, habang pinanatili ang Ezra.
