lexical_decisions:
- source_word: ל/מלוכי
  choice: para kay Maluki
  rationale: 'Sa balangkas ng talaan, ang unlaping ל ay pinakamalinaw na nagpapahiwatig ng kinakatawang angkan o sambahayan: “para kay Maluki.” Ang “Maluki” ay tuwirang transliterasyon ng pangalang Hebreo ayon sa pagkakabigkas ng WLC.'
- source_word: יֽוֹנָתָ֔ן
  choice: Jonatan
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo na יוֹנָתָן.
- source_word: לִ/שְׁבַנְיָ֖ה
  choice: para kay Sebanias
  rationale: Tulad sa unang parirala, ipinahihiwatig ng ל ang pagiging kinatawan sa talaan. Ginamit ang “Sebanias,” isang likas at nakaugaliang anyong Filipino ng pangalan.
- source_word: יוֹסֵֽף
  choice: Jose
  rationale: Ginamit ang karaniwan at madaling makilalang anyong Filipino ng pangalang יוֹסֵף.
