id: NEH.12.7
reference: Nehemiah 12:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: סַלּ֣וּ עָמ֔וֹק חִלְקִיָּ֖ה יְדַֽעְיָ֑ה אֵ֣לֶּה רָאשֵׁ֧י הַ/כֹּהֲנִ֛ים וַ/אֲחֵי/הֶ֖ם בִּ/ימֵ֥י יֵשֽׁוּעַ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/007.yaml
  text: Sallu[a], Amok, Hilkiah[c][b], Jedaiah—these were the heads of the priests and their brothers in the days of Jeshua.
translation:
  language: tl
  text: Salu, Amok, Hilkias, at Jedaias—sila ang mga pinuno ng mga pari at ng kanilang mga kapatid[a] noong panahon ni Jesua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga kaanak nila” o “mga kapwa nila pari.” Literal sa Hebreo: “kanilang mga kapatid.”'
    reason: lexical_alternative
  - marker: b
    text: Ang Jesua ay mas maikling anyo ng pangalang kaugnay ng Josue.
    reason: cultural_note
lexical_decisions:
- source_word: סַלּוּ
  choice: Salu
  rationale: Pangalan ng tao; tinumbasan sa anyong madaling basahin at bigkasin sa modernong Filipino.
- source_word: עָמוֹק
  choice: Amok
  rationale: Pangalan ng tao; tuwirang transliterasyon na likas sa Filipino.
- source_word: חִלְקִיָּה
  choice: Hilkias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal.
- source_word: יְדַעְיָה
  choice: Jedaias
  rationale: Ginamit ang malinaw at nakaugaliang anyong Filipino ng pangalan.
- source_word: רָאשֵׁי הַכֹּהֲנִים
  choice: mga pinuno ng mga pari
  rationale: Ang רָאשֵׁי ay literal na 'mga ulo,' ngunit idyomatikong tumutukoy sa mga namumuno. Iniiwasan ng 'mga pinuno' ang posibleng teknikal na kahulugan ng 'mga punong pari.'
- source_word: וַאֲחֵיהֶם
  choice: at ng kanilang mga kapatid
  rationale: Pinananatili ang literal na katawagang 'mga kapatid,' bagaman maaaring tumukoy sa mga kaanak o kapwa pari.
- source_word: בִּימֵי יֵשׁוּעַ
  choice: noong panahon ni Jesua
  rationale: Likas na salin sa Filipino ng Hebreong temporal na idyomang 'sa mga araw ni'; pinanatili ang mas maikling postexilic na anyo ng pangalan.
theological_decisions:
- issue: Saklaw ng pariralang 'mga pinuno ng mga pari at ng kanilang mga kapatid'
  choice: Pinanatili ang koordinasyon ng 'mga pari' at 'kanilang mga kapatid' nang hindi tahasang nililinaw kung ang mga kapatid mismo ay kapwa pari.
  alternative: sila ang mga pinuno ng mga pari, kasama ang kanilang mga kapatid
  rationale: Maaaring unawain ang Hebreo bilang pagtukoy sa mga pinuno at sa kanilang mga kapatid, ngunit ang sintaks ay maigsi at hindi dapat tahasang lutasin sa salin.
- issue: Kahulugan ng רָאשֵׁי sa kontekstong makasaserdote
  choice: mga pinuno ng mga pari
  alternative: mga punong pari
  rationale: Ipinapahayag nito ang pamumuno nang hindi ipinapasok ang posibleng mas huling teknikal na katungkulan ng 'punong pari.'
- issue: Kahulugan ng אֲחֵיהֶם
  choice: kanilang mga kapatid
  alternative: kanilang mga kaanak o kapwa pari
  rationale: Pinananatili ang konkretong pananalita ng Hebreo at ang tunay na kalabuan nito sa konteksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'noong panahon ni' sa halip na ang mas literal ngunit di-gaanong likas na 'sa mga araw ni.' Ang mga pangalan ay inilapit sa nakaugaliang anyong Filipino; iniwasan ang teknikal na 'mga punong pari.'
