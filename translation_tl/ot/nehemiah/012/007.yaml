  verdict: approve
  source_fidelity: 'Tapat ang salin sa Hebreo: wastong naipanatili ang apat na pangalan, ang tungkuling pamumuno ng רָאשֵׁי, ang literal na “kanilang mga kapatid” para sa וַאֲחֵיהֶם, at ang panahong tinutukoy ng בִּימֵי יֵשׁוּעַ. Hindi nito ipinapasok ang mas huling teknikal na kahulugan na maaaring idulot ng “mga punong pari.”'
  naturalness: 'Natural at malinaw ang modernong Filipino: “sila ang mga pinuno ng mga pari at ng kanilang mga kapatid noong panahon ni Jesua.” Ang antas ng wika ay marangal ngunit madaling basahin, at naaangkop sa isang talaan ng mga pangalan.'
  terminology: Ang “mga pinuno ng mga pari” ay maingat na katumbas ng “heads of the priests.” Ang “mga kapatid” ay wastong literal na salin at ang talababa ay sapat na naglalahad ng mga posibleng kontekstuwal na pakahulugan. Magkakatugma ang mga anyong pangalan na Salu, Amok, Hilkias, Jedaias, at Jesua sa nakaugaliang Filipino-biblikal na paggamit.
