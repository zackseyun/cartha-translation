id: NEH.12.23
reference: Nehemiah 12:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בְּנֵ֤י לֵוִי֙ רָאשֵׁ֣י הָֽ/אָב֔וֹת כְּתוּבִ֕ים עַל סֵ֖פֶר דִּבְרֵ֣י הַ/יָּמִ֑ים וְ/עַד יְמֵ֖י יֽוֹחָנָ֥ן בֶּן אֶלְיָשִֽׁיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/023.yaml
  text: The sons of Levi[a], heads of fathers’ houses, were recorded in the book of the chronicles[b], up to the days of Yohanan son of Eliashib.
translation:
  language: tl
  text: Ang mga anak ni Levi, na mga pinuno ng mga angkan, ay nakatala sa aklat ng mga kasaysayan[a] hanggang sa panahon ni Johanan na anak ni Eliasib.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “aklat ng mga kasaysayan” ay tumutukoy sa isang opisyal na talaang pangkasaysayan o mga annal, at hindi kinakailangang sa biblikal na mga aklat ng Mga Cronica.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי לֵוִי
  choice: ang mga anak ni Levi
  rationale: Pinananatili ang pormal na anyong “mga anak ni Levi” sa halip na gawing “mga Levita,” sapagkat agad na tinutukoy ng talata ang isang pangkat sa kanila.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Ang idyoma ay tumutukoy sa mga pinuno ng mga sambahayan o angkang nagmula sa iisang ninuno; mas natural at malinaw sa modernong Tagalog ang “mga angkan.”
- source_word: כְּתוּבִים
  choice: nakatala
  rationale: Ipinahihiwatig ng pasibong anyo na isinulat ang kanilang mga pangalan bilang bahagi ng isang opisyal na talaan.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: sa aklat ng mga kasaysayan
  rationale: Ang parirala ay tumutukoy sa isang nakasulat na rekord o mga annal; ang “sa” ang likas na gamit sa Tagalog para sa bagay na nakapaloob sa isang aklat.
- source_word: וְעַד יְמֵי
  choice: hanggang sa panahon ni
  rationale: Natural na Tagalog ito para sa hangganang kronolohikal na ipinahahayag ng Hebreo.
- source_word: יֽוֹחָנָן
  choice: Johanan
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo; pinananatili bilang pangalang pantangi nang hindi isinasalin ang kahulugan.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: anak ni Eliasib
  rationale: Tuwirang salin ng patronimikong konstruksiyon; ang “Eliasib” ay natural na anyong Filipino ng pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mga angkan” upang natural na maipahayag ang Hebreong idyoma ng mga sambahayan ng mga ninuno. Walang talababa para sa alternatibong anyo ng Johanan sapagkat ang usapin sa English na Yohanan/Johanan ay hindi kaparehong leksikal na suliranin sa Filipino.
