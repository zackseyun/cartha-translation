  text: וַ/יֵּאָ֣סְפ֔וּ בְּנֵ֖י הַ/מְשֹׁרְרִ֑ים וּ/מִן הַ/כִּכָּר֙ סְבִיב֣וֹת יְרוּשָׁלִַ֔ם וּ/מִן חַצְרֵ֖י נְטֹפָתִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/028.yaml
  text: And the sons of the singers were gathered from the district around Jerusalem and from the settlements of the Netophathites[a][b].
translation:
  language: tl
  text: At nagkatipon ang mga anak ng mga mang-aawit mula sa lupain sa palibot ng Jerusalem[a] at mula sa mga pamayanan ng mga Netofatita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kapatagan sa palibot ng Jerusalem.” Ang Hebreong כִּכָּר ay maaaring mangahulugang kapatagan, paikot na pook, o distrito depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga nayon ng mga Netofatita.” Ang Hebreong חַצְרֵי ay madalas tumukoy sa maliliit na pamayanan o mga nayong walang pader.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: nagkatipon
  rationale: Ang Niphal na anyo ng אסף ay maaaring passive o reflexive. Likas sa Tagalog ang “nagkatipon” at hindi nito tahasang ipinapalagay kung sila ay tinipon ng iba o kusang nagtipon.
- source_word: בְּנֵי הַמְשֹׁרְרִים
  choice: mga anak ng mga mang-aawit
  rationale: Pinananatili nito ang pormal na Hebreong pariralang “mga anak ng,” na sa konteksto ay maaari ring tumukoy sa mga kabilang sa pangkat o angkan ng mga mang-aawit.
- source_word: הַמְשֹׁרְרִים
  choice: mga mang-aawit
  rationale: Partisipyal na pangngalan ito na tiyak na tumutukoy sa mga umaawit, hindi sa mga musikero sa pangkalahatan.
- source_word: הַכִּכָּר סְבִיבוֹת יְרוּשָׁלִַם
  choice: lupain sa palibot ng Jerusalem
  rationale: Maaaring mangahulugan ang כִּכָּר ng kapatagan, paikot na pook, o distrito. Ang “lupain sa palibot” ay natural at hindi labis na nagtatakda sa topograpiya.
- source_word: חַצְרֵי
  choice: mga pamayanan
  rationale: Sa heograpikong konteksto, ang חָצֵר ay karaniwang tumutukoy sa maliliit o di-napapaderang pamayanan, sa halip na literal na mga looban.
- source_word: נְטֹפָתִי
  choice: mga Netofatita
  rationale: Ang anyong gentiliko ay tumutukoy sa mga taong kaugnay ng Netofa, kaya pinananatili ang etniko-heograpikong diwa sa halip na gamitin lamang ang pangalan ng lugar.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “mga anak ng mga mang-aawit” upang katawanin ang Hebreong konstruksiyon, samantalang ginamit ang natural na “nagkatipon” at “mga pamayanan” para sa madaling pag-unawa.
