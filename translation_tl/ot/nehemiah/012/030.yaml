  yaml_path: translation/ot/nehemiah/012/030.yaml
  text: And the priests and the Levites purified themselves[a], and they purified the people, the gates, and the wall.
translation:
  language: tl
  text: At dinalisay ng mga pari at mga Levita ang kanilang sarili[a], at dinalisay nila ang bayan, ang mga tarangkahan, at ang pader.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “nilinis nila ang kanilang sarili ... nilinis nila ang bayan, ang mga tarangkahan, at ang pader.” Iisang salitang-ugat sa Hebreo ang ginamit sa dalawang kilos: una, reflexive (“ang kanilang sarili”), at pagkatapos ay transitive (“ang bayan, ang mga tarangkahan, at ang pader”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּהֲרוּ
  choice: nilinis ... ang kanilang sarili
  rationale: Ang hitpael ay reflexive at tumutukoy sa ritwal na paglilinis ng mga pari at mga Levita. Likas sa modernong Filipino ang pariralang ito at naiuugnay ito sa kaparehong ugat ng kasunod na pandiwa.
- source_word: הַכֹּהֲנִים
  choice: mga pari
  rationale: Karaniwang salin ng כֹּהֲנִים sa kontekstong panrelihiyon.
- source_word: וְהַלְוִיִּם
  choice: at mga Levita
  rationale: Nakaugaliang katawagan sa Filipino para sa mga kabilang sa lipi at paglilingkod ni Levi.
- source_word: וַיְטַהֲרוּ
  choice: nilinis nila
  rationale: Ang piel ay transitive dito. Ang pag-uulit ng “nilinis” ay pinananatili ang iisang Hebreong ugat sa reflexive at transitive na mga kilos.
- source_word: הָעָם
  choice: ang bayan
  rationale: Tumutukoy ito sa sambayanang naroon sa pagtatalaga; ang “bayan” ay maikli, marangal, at natural sa biblikal na Filipino.
- source_word: הַשְּׁעָרִים
  choice: ang mga pintuang-bayan
  rationale: Mas malinaw kaysa simpleng “mga pintuan” na ang tinutukoy ay mga tarangkahan ng lungsod at mga bahagi ng pader.
- source_word: הַחוֹמָה
  choice: ang pader
  rationale: Tuwirang katumbas ng singular na הַחוֹמָה; malinaw sa konteksto na ito ang pader ng Jerusalem.
theological_decisions:
- issue: Kalikasan ng paglilinis
  choice: ritwal na paglilinis
  alternative: pangkalahatang seremonyal na paglilinis o pisikal na paglilinis
  rationale: Sa konteksto ng pagtatalaga at paglilingkod sa templo, ang טהר ay tumutukoy sa ritwal o seremonyal na pagiging malinis. Hindi tinukoy sa salin ang eksaktong ritwal upang hindi lumampas sa sinabi ng teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nilinis” sa ritwal na diwa at iningatan ang pag-uulit ng Hebreo. Idinagdag ang “pagkatapos” upang natural na maipakita ang pagkakasunod ng dalawang wayyiqtol nang hindi binabago ang diwa.
