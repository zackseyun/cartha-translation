- from: At nilinis ng mga pari at mga Levita ang kanilang sarili[a]; pagkatapos, nilinis nila ang bayan, ang mga pintuang-bayan, at ang pader.
  to: At dinalisay ng mga pari at mga Levita ang kanilang sarili[a], at dinalisay nila ang bayan, ang mga tarangkahan, at ang pader.
  rationale: Pinalitan ang “nilinis” ng “dinalisay” upang maipahayag ang ritwal na diwa ng טהר at mapanatili ang parehong ugat sa reflexive at transitive na gamit. Inalis ang di-kinakailangang “pagkatapos,” ginawang “mga tarangkahan” ang “mga pintuang-bayan,” at itinama ang paliwanag sa talababa upang masaklaw ang lahat ng layon ng ikalawang pandiwa.
