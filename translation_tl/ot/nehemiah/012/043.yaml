base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/043.yaml
  text: On that day they offered great sacrifices and rejoiced[a], because God had made them rejoice with great joy. Also the women and the children rejoiced[d][c][b], and the joy of Jerusalem was heard from far away.
translation:
  language: tl
  text: Noong araw na iyon, naghandog sila ng mga dakilang hain[a] at nagalak, sapagkat pinasaya sila ng Diyos nang may malaking kagalakan[b]. Nagalak din ang mga babae[c] at mga bata, at ang kagalakan ng Jerusalem ay narinig mula sa malayo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nag-alay sila ng malalaking hain.”
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “pinasaya sila ng Diyos nang may malaking kagalakan.” Maaari ring isalin na “binigyan sila ng Diyos ng malaking kagalakan.”'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga asawa,” sapagkat ang salitang Hebreo ay maaaring mangahulugang “mga babae” o “mga asawa,” depende sa konteksto.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “narinig hanggang sa malayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ ... זְבָחִים גְּדוֹלִים
  choice: naghandog sila ng malalaking hain
  rationale: Likas sa modernong Tagalog ang “naghandog ... ng mga hain” at malinaw na pinananatili ang kontekstong pansamba. Ang “malalaki” ay hindi nililimitahan sa dami lamang, kaya naiiwan ang lawak ng kahulugan ng גְּדוֹלִים.
- source_word: וַיִּשְׂמָחוּ / שָׂמֵחוּ
  choice: nagalak
  rationale: Pinananatili ng “nagalak” ang pag-uulit ng ugat na שׂמח at ang marangal ngunit madaling maunawaang tono.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinapahayag na ang kasunod na sugnay ang dahilan ng kanilang kagalakan.
- source_word: שִׂמְּחָם שִׂמְחָה גְדוֹלָה
  choice: pinuspos sila ng Diyos ng malaking kagalakan
  rationale: Natural itong Tagalog na nagpapanatili sa Diyos bilang tahasang sanhi ng kanilang matinding kagalakan, bagaman ang mas literal na anyo ay “pinasaya sila ... nang may malaking kagalakan.”
- source_word: הַנָּשִׁים וְהַיְלָדִים
  choice: ang mga babae at mga bata
  rationale: Ang נָשִׁים ay maaaring mangahulugang mga babae o mga asawa; “mga babae” ang mas malawak at hindi labis na nagpapasiya ayon sa konteksto.
- source_word: וַתִּשָּׁמַע שִׂמְחַת יְרוּשָׁלִַם מֵרָחוֹק
  choice: ang kagalakan ng Jerusalem ay narinig mula sa malayo
  rationale: Tuwirang pinananatili ang pasibong pandiwa, ang tambalang “kagalakan ng Jerusalem,” at ang pahiwatig ng distansiya.
theological_decisions:
- issue: Ang Diyos bilang sanhi ng kagalakan
  choice: Tahasang ipinapakitang ang Diyos ang pumuspos sa kanila ng malaking kagalakan.
  alternative: Pinasaya sila ng Diyos nang may malaking kagalakan.
  rationale: Causative ang anyong שִׂמְּחָם. Hindi dapat pahinain ang malinaw na pagkilos ng Diyos, ngunit maaaring ihayag iyon sa likas na Tagalog.
- issue: Saklaw ng pamayanang nagalak
  choice: Tahasang isinama ang mga babae at mga bata.
  alternative: Ang mga asawa at mga bata.
  rationale: Binibigyang-diin ng teksto ang lawak ng pakikibahagi sa pagdiriwang, habang nananatiling bukas ang kahulugan ng נָשִׁים sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “hain,” “nagalak,” at “sapagkat” bilang pormal ngunit karaniwang bokabularyong biblikal. Inayos ang mga talababa ayon sa pagkakasunod ng mga pananda sa pangunahing teksto.
