  to: Noong araw na iyon, naghandog sila ng mga dakilang hain[a] at nagalak, sapagkat pinasaya sila ng Diyos nang may malaking kagalakan[b]. Nagalak din ang mga babae[c] at mga bata, at ang kagalakan ng Jerusalem ay narinig mula sa malayo[d].
