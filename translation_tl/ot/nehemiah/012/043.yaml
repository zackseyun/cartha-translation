  terminology: Ang “hain” ay angkop sa kontekstong sakripisyal. Ang “mga dakilang hain” ay mas malawak kaysa “malalaking hain,” na maaaring magpahiwatig lamang ng pisikal na sukat. Nananatiling walang kinikilingang salin ang “mga babae,” na may talababa para sa posibleng “mga asawa.”
