  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: mga hain, sama-samang pagdiriwang, ang Diyos bilang sanhi ng kagalakan, ang tahasang pagbanggit sa mga babae at mga bata, at ang kagalakang narinig sa malayo. Gayunman, ang “pinuspos sila ... ng malaking kagalakan” ay bahagyang inililihis ang causative na שִׂמְּחָם (“pinasaya/pinagalak sila”) tungo sa pagpupuno; mas mabuting panatilihin ang tuwirang sanhi ng pagkagalak.'
