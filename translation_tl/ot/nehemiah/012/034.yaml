  text: Juda[a], Benjamin, Semaias, at Jeremias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Judea” kung heograpikong pangalan ang יְהוּדָה sa ibang konteksto; dito, mas angkop ang personal o pantribong pangalang “Juda” dahil kabilang ito sa isang talaan ng mga pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Juda
  rationale: Sa kontekstong ito, bahagi ito ng talaan ng mga pangalan, kaya ang personal o pantribong pangalang “Juda” ang angkop, hindi ang heograpikong “Judea.”
- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Pangngalang pantangi sa magkakaugnay na talaan; ginamit ang kinikilalang anyo sa modernong salin ng Bibliya sa Tagalog.
- source_word: שְׁמַעְיָה
  choice: Semaias
  rationale: Pangngalang pantangi; ginamit ang pamilyar na anyong biblikal sa Tagalog upang maging madaling makilala ng karaniwang mambabasa.
- source_word: יִרְמְיָה
  choice: Jeremias
  rationale: Pangngalang pantangi; ginamit ang nakaugaliang anyong biblikal sa Tagalog.
- source_word: וְ / וּ
  choice: at
  rationale: Paulit-ulit na pangatnig ang nag-uugnay sa mga pangalan. Sa natural na Tagalog, mga kuwit at isang “at” bago ang huling pangalan ang malinaw at hindi mekanikal na katumbas.
