  yaml_path: translation/ot/nehemiah/012/040.yaml
  text: So the two thanksgiving choirs took their stand in the house of God[a], and I, and half of the officials with me,
translation:
  language: tl
  text: Kaya pumuwesto sa bahay ng Diyos ang dalawang pangkat ng pasasalamat[a], at ako at kalahati ng mga opisyal na kasama ko,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang dalawang pasasalamat.” Sa kontekstong ito, tumutukoy ito sa dalawang pangkat o koro ng pasasalamat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: pumuwesto
  rationale: Ipinahahayag ng עמד sa anyong ito ang pagtayo o paglagay sa itinakdang puwesto sa seremonya; natural sa modernong Tagalog ang “pumuwesto.”
- source_word: שְׁתֵּי הַתּוֹדֹת
  choice: ang dalawang pangkat ng pasasalamat
  rationale: Literal itong “ang dalawang pasasalamat,” ngunit sa konteksto ay metonimya para sa dalawang organisadong pangkat na nagpapasalamat. Hindi nililimitahan ng “pangkat” ang mga ito sa pagiging koro lamang.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: sa bahay ng Diyos
  rationale: Pinananatili ang Hebreong idyomang “bahay ng Diyos,” na tumutukoy sa templo; ang “sa” ang natural na panandang lokatibo sa Tagalog.
- source_word: וַאֲנִי
  choice: Naroon din ako
  rationale: Natural na ipinapahayag sa Tagalog ang pagkakaugnay ni Nehemias sa naunang pangyayari, habang pinananatili ang unang panauhan.
- source_word: וַחֲצִי הַסְּגָנִים
  choice: kasama ang kalahati ng mga pinuno
  rationale: Ang סגנים ay mga opisyal o tagapamahala. Ang “mga pinuno” ay malinaw, malawak, at angkop sa dignidad ng salaysay.
- source_word: עִמִּי
  choice: kasama
  rationale: Natural na katumbas ng ideya ng pakikisama kay Nehemias; naipahihiwatig na ng “ako” ang hulaping unang panauhan.
