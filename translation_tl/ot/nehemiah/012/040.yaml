translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “pangkat ng pasasalamat” upang linawin ang metonimya nang hindi sapilitang tukuyin ang mga pangkat bilang mga koro lamang. Pinanatili ang pangungusap na bukas sa hulihan dahil nagpapatuloy ang talaan sa kasunod na talata.
