  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang mga pangalang pantangi bilang Beth-gilgal, Geba, Azmavet, at Jerusalem; ginamit ang “mang-aawit” para sa tiyak na tungkulin at “mga nayon” bilang natural na katumbas sa konteksto.
