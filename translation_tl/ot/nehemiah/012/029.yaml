  verdict: revise
  source_fidelity: Tumpak na naihahatid ng salin ang magkakaugnay na pariralang “at mula sa,” ang mga pangalan ng lugar, ang mga “bukid”/lupain ng Geba at Azmavet, ang nagpapaliwanag na כִּי (“sapagkat”), at ang pahayag na nagtayo ang mga mang-aawit ng mga nayon para sa kanilang sarili sa paligid ng Jerusalem. Ang payak na nagdaang-panahong “nagtayo” ay katanggap-tanggap na katumbas ng Hebreong qatal; hindi kailangang piliting isalin bilang past perfect sa Filipino.
  naturalness: Natural at marangal ang pangunahing teksto sa makabagong Filipino. Gayunman, hindi natural at medyo nakalilito ang “mga nakukulong na pook na tirahan” sa talababa, sapagkat ang “nakukulong” ay karaniwang nauugnay sa pagkabilanggo, hindi sa kahulugang ‘enclosed’ ng terminong Hebreo.
  terminology: Ang “mga mang-aawit” ay tumpak para sa הַמְשֹׁרֲרִים. Ang “mga nayon” ay isang angkop na kontekstuwal na salin ng חֲצֵרִים, at ang alternatibong “mga pamayanan” ay wastong inilagay sa talababa. Napanatili nang maayos ang mga pangalang Beth-gilgal, Geba, Azmavet, at Jerusalem.
