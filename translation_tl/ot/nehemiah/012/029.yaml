base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/029.yaml
  text: and from Beth-gilgal[a], and from the fields of Geba and Azmaveth, for the singers had built villages for themselves around Jerusalem.
translation:
  language: tl
  text: at mula sa Beth-gilgal, at mula sa mga bukid ng Geba at Azmavet, sapagkat ang mga mang-aawit ay nagtayo ng mga nayon[a] para sa kanilang sarili sa paligid ng Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pamayanan.” Ang salitang Hebreo ay maaaring tumukoy sa mga napalilibutang pook na tinitirhan; sa kontekstong ito, tumutukoy ito sa mga lugar na tinitirhan ng mga mang-aawit sa paligid ng Jerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֵּית הַגִּלְגָּל
  choice: at mula sa Beth-gilgal
  rationale: Ang mga unlaping Hebreo ay nangangahulugang “at mula sa.” Itinuring ang Beth-gilgal bilang pangalan ng lugar, hindi bilang literal na “bahay ng Gilgal.”
- source_word: וּמִשְּׂדוֹת גֶּבַע וְעַזְמָוֶת
  choice: at mula sa mga bukid ng Geba at Azmavet
  rationale: Tuwirang isinasalin ng “mga bukid” ang pangmaramihang שָׂדוֹת at maaari ring tumukoy sa mga lupaing nakapalibot sa dalawang bayang binanggit.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala rito ng כִּי ang paliwanag kung bakit nagmula roon ang mga mang-aawit.
- source_word: חֲצֵרִים
  choice: mga nayon
  rationale: Bagaman maaari itong tumukoy sa mga bakuran o nakukulong na tirahan, sa heograpikong konteksto ay tumutukoy ito sa maliliit na pamayanan kung saan nanirahan ang mga mang-aawit.
- source_word: בָּנוּ לָהֶם
  choice: nagtayo ... para sa kanilang sarili
  rationale: Pinananatili ng “nagtayo” ang pangunahing kahulugan ng pandiwa, at ipinahahayag ng parirala ang reflexive na diwa ng לָהֶם.
- source_word: הַמְשֹׁרֲרִים
  choice: ang mga mang-aawit
  rationale: Ang anyong participle mula sa ugat na “umawit” ay partikular na tumutukoy sa mga umaawit, lalo na sa konteksto ng paglilingkod sa templo.
- source_word: סְבִיבוֹת יְרוּשָׁלִָם
  choice: sa paligid ng Jerusalem
  rationale: Natural at malinaw itong paglalahad ng lokasyong nakapalibot sa lungsod.
