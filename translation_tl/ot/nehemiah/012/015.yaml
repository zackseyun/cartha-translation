- source_word: עַדְנָא
  choice: Adna
  rationale: Pangalang pantangi na tinumbasan sa paraang malapit sa bigkas ng Hebreo.
- source_word: לִ/מְרָיוֹת
  choice: para sa sambahayan ni Merayot
  rationale: Katulad ng naunang parirala, ipinakikilala ng לִ ang sambahayan ng pari na kinakatawan ng kasunod na pangalan.
- source_word: חֶלְקָי
  choice: Helkai
  rationale: Pangalang pantangi na transliterado ayon sa anyong Hebreo.
