base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/039.yaml
  text: and above the Gate of Ephraim[a], and above the Old Gate, and above the Fish Gate, and the Tower of Hananel, and the Tower of the Hundred, and as far as the Sheep Gate[b]; and they stood at the Gate of the Guard.
translation:
  language: tl
  text: at mula sa ibabaw ng Pintuang Efraim, at sa ibabaw ng Lumang Pintuan, at sa ibabaw ng Pintuan ng mga Isda, at sa Tore ni Hananel at sa Tore ng Sandaan, hanggang sa Pintuan ng mga Tupa; at huminto[a] sila sa Pintuang Bantay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tumayo sila” o “pumuwesto sila.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Pintuang Bilangguan” o “Pintuang Bantayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעַל ... וְעַל ... וְעַל
  choice: at sa ibabaw ng ... sa ibabaw ng ... sa ibabaw ng
  rationale: Pinananatili ang paulit-ulit na panandang panlunan na עַל at ang larawang ang prusisyon ay dumaraan sa ibabaw o kahabaan ng pader sa may mga pintuang ito.
- source_word: לְשַׁעַר אֶפְרַיִם
  choice: Pintuang Efraim
  rationale: Likas na anyong Tagalog para sa pangalan ng pintuang inuugnay sa Efraim.
- source_word: שַׁעַר הַיְשָׁנָה
  choice: Lumang Pintuan
  rationale: Tuwirang salin ng karaniwang pagkaunawa sa parirala, nang hindi pinalalawak bilang pintuan ng lumang lungsod.
- source_word: שַׁעַר הַדָּגִים
  choice: Pintuan ng mga Isda
  rationale: Inihahayag ang konstruktong Hebreo at natural na tumutukoy sa mga isda bilang uri o kalakal.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: Tore ni Hananel
  rationale: Natural na Tagalog para sa toreng may pangalang Hananel, habang pinananatili ang pangalang pantangi.
- source_word: מִגְדַּל הַמֵּאָה
  choice: Tore ng Sandaan
  rationale: Pinananatili ang literal at sadyang hindi tiyak na pagtukoy sa 'sandaan' sa halip na magdagdag ng paliwanag na wala sa teksto.
- source_word: וְעַד שַׁעַר הַצֹּאן
  choice: hanggang sa Pintuan ng mga Tupa
  rationale: Malinaw na ipinapakita ng 'hanggang sa' ang hangganan o dulo ng rutang tinutukoy ng עַד.
- source_word: וְעָמְדוּ
  choice: huminto sila
  rationale: Bagaman literal na 'tumayo,' sa konteksto ng gumagalaw na prusisyon ay natural itong mangahulugang huminto o pumuwesto sa isang lugar.
- source_word: בְּשַׁעַר הַמַּטָּרָה
  choice: sa Pintuan ng Bantay
  rationale: Maingat na pinananatili ang diwang may kaugnayan sa pagbabantay ng מַטָּרָה nang hindi tiyakang ipinapalagay na bilangguan ang tinutukoy.
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino na marangal at madaling maunawaan. Ginamit ang pare-parehong anyong “Pintuan” at pinanatili ang mga sinaunang pangalan ng lugar. Isinama sa talababa ang dalawang tunay na leksikal na kalabuan: ang kilos na עמד at ang kahulugan ng מטרה.'
