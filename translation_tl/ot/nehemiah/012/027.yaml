translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'pag-aalay' para sa seremonyal na dedikasyon at 'awitan' para sa kolektibong pag-awit. Ang mga marker na [a], [b], at [c] ay nakalagay mismo sa pangunahing teksto.
