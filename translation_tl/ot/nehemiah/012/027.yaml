base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/027.yaml
  text: At the dedication of the wall of Jerusalem[a], they sought the Levites from all their places, to bring them to Jerusalem to celebrate the dedication with gladness, with thanksgivings, and with song, with cymbals, harps[c][b], and lyres.
translation:
  language: tl
  text: Sa pagtatalaga ng pader ng Jerusalem, hinanap nila ang mga Levita[a] mula sa lahat ng kanilang tinitirhang lugar upang dalhin sila sa Jerusalem upang idaos ang pagtatalaga nang may kagalakan, mga pasasalamat, at pag-awit, na may mga pompiyang, alpa, at lira.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinaghanap nila ang mga Levita” o, ayon sa konteksto, “ipinatawag nila ang mga Levita.” Ang pangunahing kahulugan ng pandiwang Hebreo ay “hinanap.”
    reason: lexical_alternative
  - marker: c
    text: Hindi tiyak ang eksaktong pagkakaiba ng mga instrumentong isinaling “alpa” at “lira.” Dalawang magkaibang instrumentong de-kuwerdas ang tinutukoy sa Hebreo.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲנֻכַּת חוֹמַת יְרוּשָׁלִַם
  choice: Nang ialay ang pader ng Jerusalem
  rationale: Ginawang natural na temporal na sugnay sa Tagalog ang pariralang may בְּ. Ang 'ialay' ay nagpapahayag dito ng seremonyal na pagtatalaga o dedikasyon ng natapos na pader, hindi ng handog na sinusunog.
- source_word: בִּקְשׁוּ אֶת הַלְוִיִּם
  choice: hinanap nila ang mga Levita
  rationale: Pinananatili ng 'hinanap' ang pangunahing diwa ng בקשׁ at hindi ito tahasang ginagawang opisyal na pagpapatawag.
- source_word: מִכָּל מְקוֹמֹתָם
  choice: mula sa lahat ng lugar na kanilang tinitirhan
  rationale: Nililinaw sa natural na Tagalog na ang 'kanilang mga lugar' ay ang iba't ibang lugar na tinitirhan ng mga Levita, nang hindi ito nililimitahan sa mga bayan o pamayanan.
- source_word: לַהֲבִיאָם לִירוּשָׁלִָם
  choice: upang dalhin sila sa Jerusalem
  rationale: Pinananatili ang causative na diwa ng Hiphil ng בוא.
- source_word: לַעֲשֹׂת חֲנֻכָּה
  choice: Gaganapin nila ang pag-aalay
  rationale: Ang literal na 'gawin ang pag-aalay/dedikasyon' ay likas na ipinahahayag bilang 'gaganapin' sa modernong Tagalog; inilalagay sa talababa ang literal na anyo.
- source_word: וְשִׂמְחָה וּבְתוֹדוֹת וּבְשִׁיר
  choice: nang may kagalakan, pagpapasalamat, at awitan
  rationale: 'Pinananatili ang tatlong magkakaugnay ngunit magkakaibang sangkap: tuwa, pagpapahayag ng pasasalamat, at pag-awit.'
- source_word: מְצִלְתַּיִם נְבָלִים וּבְכִנֹּרוֹת
  choice: mga pompiyang, alpa, at lira
  rationale: '''Pompiyang'' ang karaniwang katawagan sa cymbals; pinag-iba bilang ''alpa'' at ''lira'' ang dalawang instrumentong de-kuwerdas, habang kinikilala sa talababa na hindi tiyak ang eksaktong modernong katumbas.'
