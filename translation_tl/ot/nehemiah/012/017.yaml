  text: for Abijah[a], Zichri; for Miniamin, for Moadiah, Piltai.
translation:
  language: tl
  text: Para kay Abias, si Zikri; para kay Miniamin, para kay Moadias[a], si Piltai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang salin, Maadias; alternatibong baybay ito ng parehong pangalan sa kaugnay na mga tradisyon ng teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַ/אֲבִיָּה
  choice: para kay Abias
  rationale: Ang unlaping לְ ay nagsasaad ng kaugnayan sa sambahayan o pangkat ng pari sa pinaikling talaan. Likas sa Filipino ang “para kay” sa ganitong pagtatapat, at ginamit ang nakaugaliang anyong Filipino na “Abias.”
- source_word: זִכְרִי
  choice: Zikri
  rationale: Pangalang pantangi ito; ang “Zikri” ay tuwirang transliterasyon na malinaw at madaling basahin sa modernong Filipino.
- source_word: לְ/מִנְיָמִין
  choice: para kay Miniamin
  rationale: Pinananatili ang parehong gamit ng לְ at ang kapansin-pansing pinaikling ayos ng Hebreong talaan, kahit walang kasunod na kinatawang tahasang pinangalanan para kay Miniamin sa talatang ito.
- source_word: לְ/מוֹעַדְיָה
  choice: para kay Moadias
  rationale: Ang anyong katinig ng tekstong Hebreo ay tumutukoy sa Moadiah; ginawang “Moadias” ayon sa likas at nakaugaliang anyo ng ganitong pangalan sa Filipino.
- source_word: פִּלְטָי
  choice: Piltai
  rationale: Pangalang pantangi na tuwirang tinranslitera; sa ayos ng talaan, siya ang iniuugnay kay Moadias.
