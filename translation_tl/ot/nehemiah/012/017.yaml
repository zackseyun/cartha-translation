translation_notes:
  register: Maikli at pormal ang pananalita upang mapanatili ang anyo ng talaan sa Hebreo. Gumamit ng mga tuldok-kuwit upang luminaw ang magkakahiwalay na pagtatapat nang hindi pinupunan ang pangalang wala sa pinagkunang teksto. Inilipat ang talababa sa “Moadias,” ang pangalang aktuwal na tinutukoy nito.
