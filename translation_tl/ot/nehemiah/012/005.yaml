lexical_decisions:
- source_word: מִיָּמִין
  choice: Mijamin
  rationale: Pangalan ng tao sa talaan ng mga pari. Isinatinig ito ayon sa anyong Hebreo at sa nakasanayang baybay sa mga saling Tagalog; posibleng baybay rin ang “Miamin.”
- source_word: מַעַדְיָה
  choice: Maadias
  rationale: Pangalan ng tao na isinalin sa karaniwang anyong Tagalog. Pinananatili ng “Maadias” ang nakikilalang anyo ng pangalang nagtatapos sa elementong Hebreo na -yāh; mas tuwirang transliterasyon ang “Maadya.”
- source_word: בִּלְגָּה
  choice: Bilga
  rationale: Pangalan ng tao o angkan ng mga pari. Ang hulíng ה ay hindi kailangang katawanin ng titik h sa baybay Tagalog, kaya natural ang “Bilga”; maaari ring gamitin ang “Bilgah” bilang mas pormal na transliterasyon.
