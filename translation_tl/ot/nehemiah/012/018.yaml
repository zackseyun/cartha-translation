base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/018.yaml
  text: for Bilgah[a], Shammua; for Shemaiah[b], Jehonathan.
translation:
  language: tl
  text: para kay Bilga[a], si Shammua; para kay Shemaya, si Jehonatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa angkan ni Bilga … mula sa angkan ni Shemaya.” Sa ganitong talaan, maaaring ipahayag ng pang-ukol sa Hebreo ang kaugnayan sa isang angkan o ang pagiging kinatawan nito.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Jehonatan”; sa ilang salin, pinaikli ang pangalan bilang “Jonatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: para kay Bilga
  rationale: Sa talaang ito ng mga angkan at kinatawang pari, ipinapahiwatig ng לְ ang kaugnayan o pagiging kinatawan; natural itong maisalin sa Filipino bilang “para kay.” Isinalin ang pangalang בִלְגָּה ayon sa anyong Hebreo bilang “Bilga.”
- source_word: שַׁמּוּעַ
  choice: Shammua
  rationale: Pangalan ito ng kinatawang kaugnay ng naunang angkan; pinanatili ang transliterasyong malapit sa Hebreo.
- source_word: לִֽ/שְׁמַעְיָה
  choice: para kay Shemaya
  rationale: Katulad ng unang parirala, ginagamit ang לְ upang tukuyin ang angkan o taong kinakatawan. Ang “para kay” ay natural ngunit hindi nag-aalis sa posibilidad na unawain itong “mula sa angkan ni.”
- source_word: יְהוֹנָתָן
  choice: Jehonatan
  rationale: Pinanatili ang buong anyo ng pangalang Hebreo na יְהוֹנָתָן sa halip na paikliin bilang Jonatan.
theological_decisions: []
translation_notes:
  register: Maikli at dignified na anyo ng talaan. Ginamit ang “para kay” bilang natural na Filipino para sa paulit-ulit na pang-ukol, habang inilagay sa talababa ang mas pormal na pagbasa tungkol sa kaugnayan sa angkan. Ang mga pangalan ay tinumbasan nang malapit sa anyong Hebreo.
