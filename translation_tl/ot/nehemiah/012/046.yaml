  text: כִּֽי בִ/ימֵ֥י דָוִ֛יד וְ/אָסָ֖ף מִ/קֶּ֑דֶם ראש הַ/מְשֹׁ֣רְרִ֔ים וְ/שִׁיר תְּהִלָּ֥ה וְ/הֹד֖וֹת לֵֽ/אלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/046.yaml
  text: For in the days of David and Asaph[a], of old, there were heads of the singers[b], and songs of praise and thanksgiving to God.
translation:
  language: tl
  text: Sapagkat noong panahon nina David at Asaf, noong unang panahon[a], may mga pinuno ng mga mang-aawit[b], at may mga awit ng papuri at pasasalamat sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mula pa noong unang panahon” o “noong araw.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “pinuno ng mga mang-aawit”; maaari rin itong isalin na “mga tagapanguna ng mga mang-aawit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang pahayag; likas sa Filipino ang “Sapagkat” sa ganitong ugnayang pandiskurso.
- source_word: בִימֵי דָוִיד וְאָסָף
  choice: noong panahon nina David at Asaf
  rationale: Natural na salin ng Hebreong idyomang temporal; ang “nina” ay angkop sa dalawang pangalang pantangi.
- source_word: מִקֶּדֶם
  choice: noong unang panahon
  rationale: Ipinahahayag ang sinauna o dating panahon at pinananatili ang kaugnayan nito sa panahon nina David at Asaf nang hindi ipinipilit ang isang tiyak na sintaktikong pagbasa.
- source_word: רֹאשׁ הַמְשֹׁרְרִים
  choice: mga pinuno ng mga mang-aawit
  rationale: Bagaman isahan ang רֹאשׁ, maaari itong gumana nang kolektibo; malinaw at natural ang “mga pinuno” sa modernong Filipino.
- source_word: וְשִׁיר תְּהִלָּה
  choice: at may mga awit ng papuri
  rationale: Ang isahang שִׁיר ay likas na maisasalin bilang kolektibong maramihan; malinaw na inuugnay ang תְּהִלָּה sa mga awit.
- source_word: וְהֹדוֹת לֵאלֹהִים
  choice: at pasasalamat sa Diyos
  rationale: Sa konteksto ng pagsamba, ang הֹדוֹת ay tumutukoy sa mga pagpapahayag ng pasasalamat, at ang לְ ay nagpapakita ng pinag-uukulan.
theological_decisions: []
