lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: at sina Azarias
  rationale: Isinalin ang pang-ugnay na וַ bilang “at.” Ginamit ang “sina” upang likas na ipakilala sa Tagalog ang magkakasunod na pangalan. Isinalin ang personal na pangalang עֲזַרְיָה ayon sa karaniwang anyong Tagalog na “Azarias.”
- source_word: עֶזְרָא
  choice: Ezra
  rationale: Personal na pangalan ito; pinanatili ang nakasanayang anyong “Ezra.” Walang pang-ugnay bago nito sa Hebreo, kaya bahagi ito ng listahang ipinakilala ng “sina.”
- source_word: וּ/מְשֻׁלָּם
  choice: at Mesulam
  rationale: Isinalin ang וּ bilang “at” upang markahan ang huling pangalan sa listahan, at tinumbasan ang מְשֻׁלָּם ng karaniwang anyong Tagalog na “Mesulam.”
