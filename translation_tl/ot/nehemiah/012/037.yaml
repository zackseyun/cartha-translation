translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pintuan” at “Lungsod” bilang karaniwang anyo sa mga pangalang heograpikal. Hinati sa dalawang pangungusap ang mahabang paglalarawan ng ruta upang maging madaling maunawaan nang hindi binabago ang pagkakasunod-sunod ng mga palatandaan.
