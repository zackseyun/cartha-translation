revisions:
- from: Sa may Pintuan ng Bukal[a], dumiretso silang paakyat sa mga hagdan[b] ng Lungsod ni David, sa ahunang patungo sa pader. Dumaan sila sa itaas ng bahay ni David at nagpatuloy hanggang sa Pintuan ng Tubig sa silangan.
  to: Sa may Pintuan ng Bukal[a], sa tapat nila, umakyat sila sa mga hagdan[b] ng Lungsod ni David, sa ahunan sa pader, sa itaas ng bahay ni David, hanggang sa Pintuan ng Tubig sa silangan.
  rationale: Ibinalik ang tahasang diwa ng וְנֶגְדָּם bilang “sa tapat nila,” nang hindi tinutukoy kung sino ang eksaktong tinutukoy ng “nila,” sapagkat konteksto ang nagbibigay nito. Inayos din ang paglalarawan ng ahunan upang hindi gawing mas tiyak kaysa sa Hebreo ang direksiyon nito. Pinanatili ang mga pangalan ng pook, pangunahing terminolohiya, at mga talababa.
