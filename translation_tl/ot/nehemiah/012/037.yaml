  text: וְ/עַל֩ שַׁ֨עַר הָ/עַ֜יִן וְ/נֶגְדָּ֗/ם עָלוּ֙ עַֽל מַעֲלוֹת֙ עִ֣יר דָּוִ֔יד בַּֽ/מַּעֲלֶ֖ה לַ/חוֹמָ֑ה מֵ/עַל֙ לְ/בֵ֣ית דָּוִ֔יד וְ/עַ֛ד שַׁ֥עַר הַ/מַּ֖יִם מִזְרָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/037.yaml
  text: And by the Fountain Gate[a], in front of them, they went up by the stairs of the city of David, at the ascent of the wall, above the house of David[b], and as far as the Water Gate on the east.
translation:
  language: tl
  text: Sa may Pintuan ng Bukal[a], sa tapat nila, umakyat sila sa mga hagdan[b] ng Lungsod ni David, sa ahunan sa pader, sa itaas ng bahay ni David, hanggang sa Pintuan ng Tubig sa silangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Pintuan ng Sibol ng Tubig.” Ang salitang Hebreo ay tumutukoy sa bukal o pinagmumulan ng tubig.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga ahunan.” Maaaring tumukoy ang salitang Hebreo sa mga baitang o hagdan, o sa mas pangkalahatang mga daang paakyat.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: Pintuan ng Bukal
  rationale: Ang עַיִן ay maaaring tumukoy sa bukal o pinagmumulan ng tubig. Ang “Pintuan ng Bukal” ay likas na pangalan ng pook sa modernong Tagalog at angkop sa topograpiya ng Jerusalem.
- source_word: וְנֶגְדָּם
  choice: dumiretso silang
  rationale: Ang נֶגֶד na may hulaping panghalip ay literal na “sa harap nila.” Sa paglalarawan ng ruta, ipinahihiwatig nito ang pagpapatuloy nang tuwid sa direksiyong nasa harapan nila; iniiwasan ng saling ito ang nakalilitong literal na “sa harap nila ay umakyat sila.”
- source_word: עָלוּ
  choice: paakyat
  rationale: Ang qal ng עלה ay nangangahulugang umakyat. Ang “dumiretso silang paakyat” ay natural na nagsasaad kapuwa ng direksiyon at kilos.
- source_word: מַעֲלוֹת עִיר דָּוִיד
  choice: mga hagdan ng Lungsod ni David
  rationale: Ang maramihang מַעֲלוֹת ay maaaring mangahulugang mga baitang, hagdan, o mga ahunan. Sa kontekstong urban, malamang na isang hagdanang estruktura ang tinutukoy.
- source_word: בַּמַּעֲלֶה לַחוֹמָה
  choice: sa ahunang patungo sa pader
  rationale: Ang isahang מַעֲלֶה ay “ahunan” o “daang paakyat,” at ang לַחוֹמָה ay natural na tumutukoy sa direksiyong patungo sa pader.
- source_word: מֵעַל לְבֵית דָּוִיד
  choice: sa itaas ng bahay ni David
  rationale: 'Pinananatili nito ang topograpikal na diwa ng מֵעַל: dumaan sila sa mas mataas na bahagi kung ihahambing sa bahay ni David.'
- source_word: שַׁעַר הַמַּיִם מִזְרָח
  choice: Pintuan ng Tubig sa silangan
  rationale: Ang מִזְרָח ay nagsasaad ng silangan o direksiyong pasilangan. Malinaw at natural sa Tagalog ang “sa silangan.”
- source_word: וְעַל
  choice: Sa may
  rationale: Sa topograpikal na salaysay, maaaring magpahiwatig ang עַל ng lokasyong nasa, ibabaw, o malapit sa isang palatandaan. Ang “sa may” ay natural ngunit hindi labis na tumitiyak sa eksaktong ugnayang heograpikal.
