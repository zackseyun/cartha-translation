  footnotes:
  - marker: a
    text: Ang Anatot ay pangalan din ng isang bayan; dito, pinanatili ito bilang pangngalang pantangi o katawagan sa talaan ng mga lumagda sa tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרִיף
  choice: Harif
  rationale: Pangngalang pantangi sa talaan ng mga lumagda sa tipan; isinalin sa baybay na natural sa Filipino, kung saan ang tunog na /f/ ay karaniwang kinakatawan ng “f.”
- source_word: עֲנָתוֹת
  choice: Anatot
  rationale: Bagaman pangalan din ito ng isang bayan sa ibang konteksto, dito ay bahagi ito ng talaan ng mga lumagda at pinanatili bilang pangngalang pantangi. Ang “Anatot” ay tuwirang pagbaybay sa Filipino ng anyong Hebreo.
- source_word: נובי
  choice: Nobai
  rationale: Pangngalang pantangi sa talaan; pinanatili sa transliterasyon. Ang “Nobai” ay kumakatawan sa pangwakas na yod ng anyong Hebreo nang hindi ito ipinapakahulugan bilang karaniwang salita.
theological_decisions: []
translation_notes:
  register: Maikli at marangal na anyo na angkop sa isang talaan ng mga pangalan. Ginamit ang makabagong baybay-Filipino sa mga pangalang Hebreo at pinanatili ang posibleng pagkalabo kung tao o katawagang kaugnay ng lugar ang “Anatot.”
