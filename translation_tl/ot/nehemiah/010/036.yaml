id: NEH.10.36
reference: Nehemiah 10:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/לְ/הָבִ֞יא אֶת בִּכּוּרֵ֣י אַדְמָתֵ֗/נוּ וּ/בִכּוּרֵ֛י כָּל פְּרִ֥י כָל עֵ֖ץ שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בֵ֖ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/036.yaml
  text: and to bring the firstfruits of our land and the firstfruits of all the fruit of every tree[a], year by year, to the house of Yahweh[b],
translation:
  language: tl
  text: at taun-taon ay dalhin sa bahay ni Yahweh[b] ang mga unang bunga ng aming lupa[a] at ang mga unang bunga ng lahat ng bunga ng bawat punongkahoy,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aming lupain” o “lupang sinasaka namin.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ni Yahweh” ay tumutukoy rito sa templo.
    reason: clarification
lexical_decisions:
- source_word: וּ/לְ/הָבִיא
  choice: at ... ay dalhin
  rationale: Ipinagpapatuloy ng waw at infinitive construct ang talaan ng mga pananagutan sa tipan; natural sa Filipino ang “dalhin” para sa paghahatid ng handog.
- source_word: בִּכּוּרֵי
  choice: mga unang bunga
  rationale: Tumutukoy ito sa unang bahagi ng ani o bunga na inihahandog sa Diyos; pinananatili ng “mga unang bunga” ang rituwal na diwa nang hindi nagiging teknikal o malabo.
- source_word: אַדְמָתֵנוּ
  choice: aming lupa
  rationale: Ang אֲדָמָה ay lupa o lupang sinasaka. Ang “aming lupa” ay likas sa Filipino at nananatiling bukás sa kahulugang lupa bilang ground o lupain.
- source_word: וּ/בִכּוּרֵי כָּל פְּרִי כָל עֵץ
  choice: at ang mga unang bunga ng lahat ng bunga ng bawat punongkahoy
  rationale: Pinananatili ang masinsing at komprehensibong ayos ng Hebreo—lahat ng bunga ng bawat puno—habang malinaw pa rin sa Filipino.
- source_word: שָׁנָה בְ/שָׁנָה
  choice: taun-taon
  rationale: Ito ang natural na modernong Filipino para sa taunang pag-uulit na ipinahihiwatig ng idyomang Hebreo.
- source_word: לְ/בֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang literal na בֵּית, at isinasalin ang banal na pangalang יהוה bilang “Yahweh”; sa konteksto, ang tinutukoy na bahay ay ang templo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasan sa tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng isang titulo.
- issue: Kahulugan ng “bahay ni Yahweh”
  choice: Panatilihin sa pangunahing teksto ang literal na “bahay ni Yahweh”
  alternative: templo ni Yahweh
  rationale: Ang “templo” ang malinaw na tinutukoy sa konteksto, ngunit ang “bahay” ang mismong larawan at salita ng Hebreo; inililinaw ang kontekstwalisadong kahulugan sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong nagpapatuloy sa naunang talaan sa pamamagitan ng panimulang “at,” gayundin ang pangwakas na kuwit. Iniwasan ang sobrang teknikal na “mga unang ani” upang magamit ang iisang salitang tumutugma sa בִּכּוּרֵי para sa ani ng lupa at bunga ng puno.
