- source_word: רְחוּם
  choice: Rehum
  rationale: Pangalang pantangi sa talaan ng mga lumagda; ginamit ang anyong madaling basahin sa modernong Tagalog habang pinananatili ang karaniwang biblikal na transliterasyon.
- source_word: חֲשַׁבְנָה
  choice: Hasabna
  rationale: Pangalang pantangi; tinumbasan ayon sa bigkas na angkop sa ortograpiyang Filipino, kung saan ang Hebreong shin ay kinakatawan ng “s” at hindi isinasama ang tahimik na pangwakas na he bilang “h.”
- source_word: מַעֲשֵׂיָה
  choice: Maaseias
  rationale: Pangalang pantangi na may elementong tumutukoy sa banal na pangalan; isinalin sa nakagawiang anyong biblikal sa Filipino sa halip na isalin ang kahulugan ng pangalan.
