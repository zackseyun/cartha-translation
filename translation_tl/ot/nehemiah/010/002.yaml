lexical_decisions:
- source_word: וְעַל
  choice: At ang mga nakatala sa
  rationale: Ipinagpapatuloy ng וְ ang naunang salaysay, samantalang ang עַל ay nagpapakilala sa mga pangalang kaugnay ng tinatakang dokumento. Ang pariralang ito ay natural sa modernong Tagalog at malinaw na ipinahihiwatig ang kontekstong administratibo.
- source_word: הַחֲתוּמִים
  choice: dokumentong tinatakan
  rationale: Bagaman anyong maramihang pasibong participle ang Hebreo, malamang na tumutukoy ito sa mga taong nakatala sa tinatakang kasulatan o, sa paraang metonimiko, sa mismong tinatakang dokumento. Pinanatili sa talababa ang mas literal na anyo.
- source_word: נְחֶמְיָה
  choice: Nehemias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Tagalog ng Bibliya.
- source_word: הַתִּרְשָׁתָא
  choice: gobernador
  rationale: Isa itong titulong administratibo noong panahon ng Persia. Malinaw na naihahatid ng “gobernador” ang tungkulin sa modernong mambabasa; nasa talababa ang transliterasyon ng orihinal na titulo.
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang natural at tumpak na katumbas sa Tagalog ng karaniwang panandang panggenealohiya.
- source_word: חֲכַלְיָה
  choice: Hacalias
  rationale: Ginamit ang tradisyonal at madaling makilalang anyo ng pangalan sa Tagalog.
- source_word: וְצִדְקִיָּה
  choice: at Zedekias
  rationale: Pinagdurugtong ng pangatnig ang ikalawang pangalan sa talaan; ginamit ang karaniwang anyo ng pangalan sa Tagalog.
