  yaml_path: translation/ot/nehemiah/010/031.yaml
  text: and that we will not give our daughters to the peoples of the land[b][a], nor take their daughters for our sons.
translation:
  language: tl
  text: At hindi namin ibibigay ang aming mga anak na babae sa mga sambayanan ng lupain[a], ni hindi rin namin kukunin[b] ang kanilang mga anak na babae para sa aming mga anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga mamamayan ng lupain.” Maramihan ang salitang Hebreo na isinaling “mga sambayanan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kukunin”; sa kontekstong ito, tumutukoy ito sa pagkuha sa kanila bilang mga asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: At
  rationale: Ipinagpapatuloy nito ang talaan ng mga pananagutang sinumpaan sa naunang konteksto. Natural sa Tagalog ang payak na “At” bilang pang-ugnay, nang hindi na inuulit ang pormulang nasa naunang talata.
- source_word: לֹא נִתֵּן
  choice: hindi namin ibibigay
  rationale: Ang anyong yiqtol ay nagpapahayag dito ng ipinangakong gagawin sa hinaharap; ang aspektong magaganap na “ibibigay” ay angkop sa panata ng pamayanan.
- source_word: בְּנֹתֵינוּ
  choice: aming mga anak na babae
  rationale: Tuwirang pinananatili ang maramihan at tiyak na kasarian ng salitang Hebreo.
- source_word: לְעַמֵּי הָאָרֶץ
  choice: sa mga sambayanan ng lupain
  rationale: Pinananatili ng “mga sambayanan” ang maramihang עַמֵּי at iniiwasang gawing iisang pangkat lamang ang tinutukoy. Ang “ng lupain” ay hindi nagdaragdag ng pakahulugang “pagano” o “dayuhan.”
- source_word: נִקַּח
  choice: kukunin
  rationale: Pinananatili nito ang pangunahing kahulugan ng לָקַח at ang paralelismo ng “ibibigay” at “kukunin.” Nililinaw sa talababa ang kahulugang pag-aasawa sa kontekstong ito.
- source_word: לְבָנֵינוּ
  choice: para sa aming mga anak na lalaki
  rationale: Tumpak nitong pinananatili ang tiyak na kasarian at maramihang anyo ng Hebreong בָּנִים.
theological_decisions:
- issue: Paglalahad sa pagbabawal sa pag-aasawa nang hindi nagdaragdag ng ideolohiyang etniko o panlahi
  choice: mga sambayanan ng lupain
  alternative: mga paganong bayan; mga dayuhang bayan; mga naninirahan sa lupain
  rationale: Ang mismong talata ay tumutukoy sa mga sambayanan ng lupain sa konteksto ng katapatan sa tipan. Hindi idinaragdag ang “pagano” o “dayuhan,” sapagkat higit iyon sa tahasang sinasabi ng Hebreo; pinananatili rin ang maramihan.
translation_notes:
  register: Makabago at marangal na Tagalog na angkop sa pampublikong pagbasa. Ginamit ang “mga sambayanan” upang malinaw na tumukoy sa mga pangkat ng tao, hindi sa mga bayan bilang mga pook. Pinanatili ang balanseng paralelismo ng pagbibigay ng mga anak na babae at pagkuha ng mga anak na babae para sa mga anak na lalaki.
