lexical_decisions:
- source_word: מַגְפִּיעָשׁ
  choice: Magpias
  rationale: Pangalang pantangi na isinulat ayon sa bigkas na angkop sa makabagong Tagalog. Ang huling titik na שׁ ay kinakatawan ng “s” sa halip na ng Ingles na “sh.”
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Pangalang pantangi na tuwirang isinulat ayon sa bigkas ng Hebreo at sa likas na baybay sa Tagalog; ang שׁ ay “s,” at hindi ipinananatili ang dobleng katinig ng anyong Ingles.
- source_word: חֵזִיר
  choice: Hezir
  rationale: Pangalang pantangi na isinulat nang malapit sa anyong Hebreo. Pinanatili ang “z” upang katawanin ang ז at maiba ito sa tunog na “s.”
