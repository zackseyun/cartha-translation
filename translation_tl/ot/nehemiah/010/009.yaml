  text: Maazias, Bilgai, at Semaias—sila ang mga pari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַֽעַזְיָה
  choice: Maazias
  rationale: Pangalan ng tao; ginamit ang anyong matagal nang pamilyar sa tradisyong biblikal sa Filipino habang pinananatili ang pagkakakilanlan ng pangalang Hebreo.
- source_word: בִלְגַּי
  choice: Bilgai
  rationale: Pangalan ng tao; tuwirang transliterasyon na malinaw at natural basahin sa Filipino.
- source_word: שְׁמַֽעְיָה
  choice: Semaias
  rationale: Pangalan ng tao; ginamit ang pamilyar na anyong Filipino ng pangalan, nang hindi isinasalin ang kahulugan nito.
- source_word: אֵלֶּה
  choice: sila
  rationale: Ang panghalip na maramihan ay natural na tumutukoy pabalik sa tatlong nakalistang pangalan at naghahatid ng diwa ng Hebreong demonstratibo.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Tuwirang ipinapahayag ang tiyak at maramihang anyo ng Hebreo; ang “pari” ang karaniwang modernong terminong Filipino.
theological_decisions: []
translation_notes:
  register: Maikli at marangal na modernong Filipino, na angkop sa listahan ng mga pangalan. Ginamit ang gitling na em dash upang malinaw na ihiwalay ang mga pangalan sa pagkakakilanlan sa kanila bilang mga pari.
