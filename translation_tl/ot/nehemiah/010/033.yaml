base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/033.yaml
  text: We also laid on ourselves the obligation to give yearly a third of a shekel for the service of the house of our God[a].
translation:
  language: tl
  text: Ipinataw rin namin sa aming sarili ang tungkuling magbigay bawat taon ng ikatlong bahagi ng isang siklo para sa paglilingkod sa bahay ng aming Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Itinakda rin namin para sa aming sarili ang mga obligasyong magbigay bawat taon ng ikatlong bahagi ng isang siklo.”
    reason: Ipinakikita ang maaaring kolektibo o maramihang pagbasa sa מִצְוֺת at ang alternatibong diwa ng וְהֶעֱמַדְנוּ.
lexical_decisions:
- source_word: וְהֶעֱמַדְנוּ עָלֵינוּ
  choice: Ipinataw rin namin sa aming sarili
  rationale: Ang Hiphil ng עמד kasama ng עַל ay tumutukoy rito sa pagtatakda o pagpapataw ng isang bagay sa sarili. Likas sa modernong Tagalog ang “ipinataw ... sa aming sarili,” at ipinahihiwatig ng “rin” ang pang-ugnay na וְ sa konteksto.
- source_word: מִצְוֺת
  choice: ang tungkulin
  rationale: Bagaman anyong maramihan ang salita, maaari itong maging kolektibo o abstrakto. Dito ay tumutukoy ito sa isang tiyak at nagbubuklod na pananagutan, kaya ang “tungkulin” ay natural at hindi kasing-labo ng literal na “mga utos.”
- source_word: לָתֵת
  choice: magbigay
  rationale: Tuwirang katumbas ito ng נתן at hindi ipinapalagay na buwis o sapilitang bayad ang ambag.
- source_word: שְׁלִשִׁית הַשֶּׁקֶל
  choice: ikatlong bahagi ng isang siklo
  rationale: Pinananatili ang tiyak na bahagdan at ang sinaunang yunit ng timbang o salapi. Ginamit ang karaniwang anyong Tagalog na “siklo” para sa shekel.
- source_word: בַּשָּׁנָה
  choice: bawat taon
  rationale: Malinaw at natural na ipinapahayag ang taunang pag-uulit.
- source_word: לַעֲבֹדַת
  choice: para sa paglilingkod
  rationale: Sa konteksto ng bahay ng Diyos, saklaw ng עֲבֹדָה ang gawaing nauukol sa pagsamba at pagpapanatili; pinananatili ng “paglilingkod” ang malawak na kahulugan nito.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: bahay ng aming Diyos
  rationale: Malapit ito sa literal na Hebreo at pinananatili ang tipanang himig; ang “templo” ay tama sa konteksto ngunit mas interpretatibo.
theological_decisions:
- issue: Kalikasan ng מִצְוֺת bilang pananagutang itinakda ng pamayanan sa sarili
  choice: tungkuling ipinataw nila sa kanilang sarili
  alternative: utos o mga obligasyong itinakda nila sa kanilang sarili
  rationale: Inilalarawan ng talata ang pamayanang nagtatakda sa sarili ng isang nagbubuklod na taunang ambag. Hindi ito pinalalambot bilang simpleng kaugalian, ngunit hindi rin ipinahahayag na bagong utos ito na tuwirang ibinigay ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang “bahay ng aming Diyos” sa halip na “templo” upang sundan ang larawan ng Hebreo, at ginamit ang “tungkulin” upang maging natural habang nananatiling nagbubuklod ang diwa.
