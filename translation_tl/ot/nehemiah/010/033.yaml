  terminology: Ang “tungkulin” ay isang angkop na kolektibo at nagbubuklod na katumbas sa kontekstong ito, nang hindi maling ipinapakitang tuwirang utos ng Diyos ang sariling itinakda ng pamayanan. Ang “siklo” ay wastong anyo para sa sinaunang shekel, at ang literal na “bahay ng aming Diyos” ay pinanatili nang hindi kinakailangang ipalit ang mas interpretatibong “templo.”
