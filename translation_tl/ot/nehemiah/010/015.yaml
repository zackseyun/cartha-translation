translation:
  language: tl
  text: ang mga pinuno ng bayan:[a] Paros, Pahat-Moab, Elam, Zatu, at Bani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga ulo ng bayan”; maaari ring isaling “mga pangulo ng bayan” o “mga lider ng bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי
  choice: mga pinuno ng
  rationale: Ang construct plural ng רֹאשׁ ay idyomatikong tumutukoy sa mga taong nasa pamumuno. Mas natural sa makabagong Filipino ang “mga pinuno” kaysa sa literal na “mga ulo,” habang nililinaw ng talababa ang metapora ng Hebreo.
- source_word: הָעָם
  choice: bayan
  rationale: Tumutukoy ito sa pamayanan ng Juda/Jerusalem na kinakatawan sa talaan ng tipan. Ang “bayan” ay natural at marangal sa kontekstong ito.
- source_word: פַּרְעֹשׁ
  choice: Paros
  rationale: Pangalang pantangi ng tao o angkan; tinumbasan ayon sa natural na transliterasyong Filipino.
- source_word: פַּחַת מוֹאָב
  choice: Pahat-Moab
  rationale: Tambalang pangalang pantangi; pinanatili ang gitling upang makita ang dalawang bahagi ng pangalan.
- source_word: עֵילָם
  choice: Elam
  rationale: Sa talaang ito, pangalan ito ng tao o angkan, hindi pangalan ng rehiyon.
- source_word: זַתּוּא
  choice: Zatu
  rationale: Pangalang pantangi; transliterasyon sa baybay na madaling basahin sa Filipino.
- source_word: בָּנִי
  choice: Bani
  rationale: Direktang sinasalamin ang anyong Masoretiko sa talatang ito at hindi iniharmonisa sa kahawig na pangalang Binnui sa ibang talaan.
