base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/010.yaml
  text: 'and the Levites: Jeshua son of Azaniah[a], Binnui from the sons of Henadad[b], Kadmiel.'
translation:
  language: tl
  text: 'at ang mga Levita: si Jesua na anak ni Azanias, si Binui, mula sa angkan ni Henadad, at si Kadmiel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: at ang mga Levita
  rationale: Pinananatili ng “at” ang kaugnayan sa naunang talaan. Walang pandiwang tahasan sa Hebreo, kaya hindi nagdagdag ng “ay.”
- source_word: וְיֵשׁוּעַ
  choice: si Jesua
  rationale: Isinalin ang pangalang Hebreo sa anyong madaling basahin sa Filipino; hindi na inulit ang pang-ugnay sapagkat saklaw na ito ng pambungad sa talaan.
- source_word: בֶּן אֲזַנְיָה
  choice: na anak ni Azanias
  rationale: Likas na anyong Filipino para sa ugnayang genealogical na “anak ni.”
- source_word: בִּנּוּי
  choice: si Binui
  rationale: Transliterasyon ng personal na pangalan sa paraang natural basahin sa Filipino.
- source_word: מִבְּנֵי חֵנָדָד
  choice: na mula sa mga anak ni Henadad
  rationale: Pinananatili ang diwa ng pang-ukol מִן bilang “mula sa” at ang literal na pormang “mga anak,” na maaari ring tumukoy sa angkan o mga inapo.
- source_word: קַדְמִיאֵל
  choice: si Kadmiel
  rationale: Tuwirang transliterasyon ng personal na pangalan; idinagdag ang pantukoy na “si” para sa natural na talaan sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan at hindi nagdagdag ng pandiwa na wala sa Hebreo.
