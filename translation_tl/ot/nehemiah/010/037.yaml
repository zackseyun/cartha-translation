base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/037.yaml
  text: and the firstborn of our sons and of our livestock[a], as it is written in the Law, and the firstborn of our herds and of our flocks, to bring to the house of our God[b], to the priests who minister in the house of our God.
translation:
  language: tl
  text: at ang mga panganay sa aming mga anak at sa aming mga alagang hayop, gaya ng nasusulat sa Kautusan,[a] at ang mga panganay sa aming mga baka at sa aming mga tupa at kambing, upang dalhin namin sa bahay ng aming Diyos, sa mga paring naglilingkod sa bahay ng aming Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, alinsunod sa mga utos ng Kautusan tungkol sa mga panganay na tao at hayop.
    reason: cross_reference
lexical_decisions:
- source_word: בְּכֹרוֹת בָּנֵינוּ
  choice: mga panganay sa aming mga anak
  rationale: Likas sa modernong Tagalog ang “mga panganay sa aming mga anak” at ipinahihiwatig nitong mga panganay mula sa kanilang mga anak ang tinutukoy, nang hindi nagdaragdag ng detalyeng wala sa Hebreo.
- source_word: וּבְהֶמְתֵּינוּ
  choice: at mga alagang hayop
  rationale: Ang בְּהֵמָה ay malawak na tumutukoy sa domestikadong hayop; malinaw at karaniwan ang “mga alagang hayop” sa Tagalog.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: gaya ng nasusulat sa Kautusan
  rationale: Pinananatili nito ang pormulang tumutukoy sa nakasulat na Torah; ang malaking titik sa “Kautusan” ay nagpapakitang tiyak na Kautusan ng Diyos ang tinutukoy.
- source_word: בְּכוֹרֵי בְקָרֵינוּ וְצֹאנֵינוּ
  choice: mga panganay sa aming mga bakahan at kawan
  rationale: Ang “bakahan at kawan” ay nagpapanatili sa pagkakaiba ng malalaking hayop, lalo na ng baka, at maliliit na hayop gaya ng tupa at kambing.
- source_word: לְהָבִיא
  choice: ay dadalhin namin
  rationale: Ang pawatas na layunin ay ginawang tahasang pandiwa upang maging malinaw at natural ang pagpapatuloy ng pangakong tipan sa Tagalog.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: sa bahay ng aming Diyos
  rationale: Pinananatili ang literal at paulit-ulit na katawagang “bahay ng aming Diyos” sa halip na ipalit ang interpretatibong “templo.”
- source_word: לַכֹּהֲנִים הַמְשָׁרְתִים
  choice: sa mga paring naglilingkod
  rationale: Malinaw nitong inilalarawan ang patuloy na paglilingkod ng mga pari at pinananatili ang kontekstong panrelihiyon.
theological_decisions:
- issue: Kung isasalin ang בֵּית אֱלֹהֵינוּ bilang “bahay ng aming Diyos” o “templo ng aming Diyos”
  choice: bahay ng aming Diyos
  alternative: templo ng aming Diyos
  rationale: Bagaman templo ang tinutukoy, literal na “bahay ng aming Diyos” ang Hebreo; pinananatili ito upang maiwasan ang di-kailangang pagpapakahulugan.
- issue: Kung tahasang sasabihin sa pangunahing teksto na tutubusin o ihahandog ang mga panganay
  choice: panatilihin lamang ang “mga panganay”
  alternative: mga panganay na tutubusin o ihahandog
  rationale: Tinutukoy ng talata ang mga utos ng Kautusan ngunit hindi nito mismo nililinaw rito ang pagkakaiba ng pagtubos at paghahandog; hindi dapat dagdagan ang teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tipanang himig at ang pag-uulit ng “bahay ng aming Diyos,” habang inayos ang infinitive bilang “ay dadalhin namin” para sa likas na daloy ng pangungusap.
