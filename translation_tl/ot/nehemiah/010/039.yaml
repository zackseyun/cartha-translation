base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/039.yaml
  text: And the priest[a], a son of Aaron, shall be with the Levites when the Levites collect the tithe, and the Levites shall bring up the tithe of the tithe to the house of our God[b], to the chambers of the storehouse.
translation:
  language: tl
  text: At ang pari, na isang anak ni Aaron, ay dapat kasama ng mga Levita kapag tumatanggap sila ng ikapu. Iaakyat naman ng mga Levita ang ikapu ng ikapu[a] sa bahay ng ating Diyos, sa mga silid ng imbakan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ikasampung bahagi ng ikapu.” Literal sa Hebreo ang “ikapu ng ikapu,” na tumutukoy sa bahaging ibinibigay ng mga Levita mula sa ikapung tinatanggap nila.
    reason: lexical_alternative
  - marker: b
    text: O, “kabang-yaman.” Malamang na tumutukoy ito rito sa lugar na imbakan ng mga ikapu at handog, hindi lamang sa imbakan ng salapi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ay dapat sumama
  rationale: Sa kontekstong tipan at tuntunin, ang anyo ng pandiwa ay nagsasaad ng itinakdang kaayusan. Likas sa modernong Tagalog ang “dapat sumama” at naipahahayag nito ang preskriptibong diwa.
- source_word: הַכֹּהֵן בֶּן־אַהֲרֹן
  choice: ang pari, na isang anak ni Aaron
  rationale: Pinananatili nito ang tahasang pananalita ng Hebreo tungkol sa paring kabilang sa angkan ni Aaron nang hindi gumagamit ng mas teknikal na katawagang denominasyonal.
- source_word: עִם
  choice: sumama sa
  rationale: Ipinahihiwatig nito ang presensiya at pakikibahagi ng pari kasama ng mga Levita sa pangongolekta ng ikapu.
- source_word: בַּעְשֵׂר הַלְוִיִּם
  choice: kapag kinokolekta ng mga Levita ang ikapu
  rationale: Ang infinitive construct ay tumutukoy sa gawain ng pagtanggap o pangongolekta ng ikapu; malinaw at natural itong naipahahayag sa isang sugnay na pamanahon.
- source_word: יַעֲלוּ
  choice: dadalhin
  rationale: Ang Hiphil ng עלה ay literal na “iaakyat,” ngunit sa Tagalog ang “dadalhin” ang mas natural dito. Nananatili ang pangunahing diwa ng pagdadala patungo sa templo nang hindi naggigiit na pisikal na pag-akyat ang tinutukoy.
- source_word: מַעֲשַׂר הַמַּעֲשֵׂר
  choice: ang ikapu ng ikapu
  rationale: Pinananatili ang pormal at teknikal na parirala ng Hebreo, na tumutukoy sa bahaging ibinibigay ng mga Levita mula sa ikapung tinanggap nila.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: sa bahay ng ating Diyos
  rationale: Tuwirang pinananatili ang Hebreong katawagan sa templo at ang pangtipang pananalitang “ating Diyos.”
- source_word: הַלְּשָׁכוֹת
  choice: mga silid
  rationale: Karaniwang tumutukoy ang salita sa mga silid sa templo, kabilang ang mga ginagamit na imbakan.
- source_word: לְבֵית הָאוֹצָר
  choice: ng imbakan
  rationale: Mas angkop ang “imbakan” sa konteksto ng mga ikapu at handog na ani kaysa “kabang-yaman,” na maaaring ipalagay na salapi lamang ang inilalagay roon.
theological_decisions:
- issue: Katawagan sa mga imbakan sa templo
  choice: imbakan
  alternative: kabang-yaman
  rationale: Mga ikapu, kabilang ang mga produktong agrikultural, ang konteksto. Hindi nililimitahan ng “imbakan” ang laman sa salapi at hindi rin nagdaragdag ng ibang institusyonal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal ang himig. Ginamit ang “pari,” “mga Levita,” at “ikapu” bilang pamilyar na terminolohiyang biblikal. Inilagay ang mga pananda ng talababa sa mismong mga pariralang tinatalakay ng mga ito.
