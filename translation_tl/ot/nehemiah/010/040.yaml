base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/040.yaml
  text: For the sons of Israel and the sons of Levi will bring the contribution of the grain[a], the new wine, and the oil to the chambers, where the vessels of the sanctuary are, and the priests who minister, and the gatekeepers, and the singers[b]. And we will not neglect the house of our God.
translation:
  language: tl
  text: Sapagkat dadalhin ng mga Israelita at ng mga Levita[a] sa mga silid ang handog mula sa butil, bagong alak, at langis. Doon naroroon ang mga kagamitan ng santuwaryo, gayundin ang mga paring naglilingkod, mga bantay ng pintuan, at mga mang-aawit. At hindi namin pababayaan ang bahay ng aming Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “mga anak ng Israel at mga anak ni Levi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “At hindi namin iiwan ang bahay ng aming Diyos.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לְּשָׁכוֹת
  choice: mga silid
  rationale: Tumutukoy sa mga silid sa templo na ginagamit din sa pag-iimbak; pinananatili ng “mga silid” ang kahulugang pang-arkitektura nang hindi labis na nililimitahan ang gamit.
- source_word: בְנֵי יִשְׂרָאֵל וּבְנֵי הַלֵּוִי
  choice: mga Israelita at mga Levita
  rationale: Ito ang likas at malinaw na modernong Tagalog para sa literal na “mga anak ng Israel at mga anak ni Levi,” habang pinananatili ang magkatambal na pagtukoy sa dalawang pangkat.
- source_word: תְּרוּמַת
  choice: handog
  rationale: Tumutukoy sa ambag na ibinukod para sa banal na paggamit. Ang “handog” ay natural sa Tagalog at angkop sa konteksto ng templo.
- source_word: דָּגָן
  choice: butil
  rationale: Pangkalahatang katawagan sa ani ng mga halamang butil at hindi nililimitahan sa isang uri.
- source_word: תִּירוֹשׁ
  choice: bagong alak
  rationale: Pinananatili ang agrikultural na diwa ng alak na bagong ani o bagong gawa.
- source_word: יִצְהָר
  choice: langis
  rationale: Sa karaniwang tatluhang pormulang butil, alak, at langis, tumutukoy ito sa langis ng olibo; sapat at natural dito ang “langis.”
- source_word: כְּלֵי הַמִּקְדָּשׁ
  choice: mga kagamitan ng santuwaryo
  rationale: Malinaw na tumutukoy sa mga kasangkapan o kagamitang ginagamit sa banal na lugar; ang “santuwaryo” ay dignified at pamilyar na terminong panrelihiyon.
- source_word: הַכֹּהֲנִים הַמְשָׁרְתִים
  choice: mga paring naglilingkod
  rationale: Ipinapahayag ang aktibong tungkulin ng mga pari nang natural sa modernong Tagalog.
- source_word: הַשּׁוֹעֲרִים
  choice: mga bantay ng pintuan
  rationale: Inilalarawan nang malinaw ang mga tauhan ng templo na nangangasiwa at nagbabantay sa mga pasukan.
- source_word: לֹא נַעֲזֹב
  choice: hindi namin pababayaan
  rationale: Sa konteksto ng pangakong susuportahan ang paglilingkod sa templo, ipinahihiwatig nito ang hindi pagpapabaya, bagaman maaari rin itong mangahulugang hindi pagtalikod o pag-iwan.
theological_decisions:
- issue: Mga katawagan sa mga pangkat ng tipan
  choice: mga Israelita at mga Levita
  alternative: mga anak ng Israel at mga anak ni Levi
  rationale: Ang idyomatikong anyo ay mas malinaw sa ordinaryong mambabasang Tagalog, habang ang literal na Hebreong anyo ay itinatala sa talababa upang mapanatili ang pormal na pagkakatulad.
- issue: Kahulugan ng hindi pag-iwan sa bahay ng Diyos
  choice: hindi namin pababayaan ang bahay ng aming Diyos
  alternative: hindi namin iiwan ang bahay ng aming Diyos
  rationale: Ang konteksto ay tungkol sa patuloy na paglalaan at pagsuporta sa pagsamba sa templo. Ang “pababayaan” ay nagpapanatili sa praktikal na diwa nang hindi ikinakaila ang mas literal na posibilidad na “iiwan.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “santuwaryo” bilang pamilyar na terminong panrelihiyon, ngunit iniwasan ang masyadong teknikal o makalumang pananalita.
