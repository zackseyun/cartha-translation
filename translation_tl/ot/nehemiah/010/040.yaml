- from: Sapagkat dadalhin ng mga Israelita at ng mga Levita[a] sa mga silid ang handog na butil, bagong alak, at langis. Naroon ang mga kagamitan ng santuwaryo, gayundin ang mga paring naglilingkod, mga bantay ng pintuan, at mga mang-aawit. At hindi namin pababayaan ang bahay ng aming Diyos.[b]
  to: Sapagkat dadalhin ng mga Israelita at ng mga Levita[a] sa mga silid ang handog mula sa butil, bagong alak, at langis. Doon naroroon ang mga kagamitan ng santuwaryo, gayundin ang mga paring naglilingkod, mga bantay ng pintuan, at mga mang-aawit. At hindi namin pababayaan ang bahay ng aming Diyos.[b]
