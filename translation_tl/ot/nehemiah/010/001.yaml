  rationale: Inalis ang tahasang pagdaragdag ng “mga pangalan,” ngunit ginamit ang “nakatala” upang maging natural ang pangungusap sa Filipino at maipahayag ang kaugnayan ng mga pangkat sa pormal na dokumento. Inilipat ang pananda ng talababa b sa “tinatakan na dokumento” at inayos ang talababa a upang malinaw na ang “pumuputol” ang literal na covenant-making idiom.
