base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/001.yaml
  text: And because of all this[a], we are making a binding agreement in writing, and on the sealed document are our officials, our Levites[b], and our priests.
translation:
  language: tl
  text: At dahil sa lahat ng ito,[a] gumagawa kami ng isang matibay na kasunduan at isinusulat ito. At sa tinatakan na dokumento[b] ay nakatala ang aming mga pinuno, mga Levita, at mga pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “At sa lahat ng ito, gumagawa kami ng isang matibay na kasunduan at isinusulat ito.” Literal na ginagamit ng Hebreo ang idyomang “pumuputol ng isang kasunduan”; ang salitang isinaling “matibay” ay maaari ring mangahulugang “mapagkakatiwalaan” o “may-bisang panata.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring mas literal: “At sa tinatakan.” Malamang na tumutukoy ito sa pormal na kasulatang tinatakan; ang maikling Hebreong parirala ay hindi tahasang nagsasabing mga pangalan ang nakatala rito.'
    reason: textual_clarity
lexical_decisions:
- source_word: וּבְכָל זֹאת
  choice: At dahil sa lahat ng ito
  rationale: Sa konteksto, ang בְּ ay likas na inuunawang nagpapahayag ng dahilan at tumutukoy pabalik sa naunang pagtatapat at salaysay.
- source_word: כֹּרְתִים אֲמָנָה
  choice: gumagawa kami ng isang matibay na kasunduan
  rationale: Ang כרת ay idyoma ng paggawa ng tipan o kasunduan, samantalang ang אֲמָנָה ay isang matatag at mapanagutang pangako. Iniiwasan ng salin ang di-likas na literal na “pumuputol” ngunit pinananatili ang pormal at may-bisang diwa.
- source_word: וְכֹתְבִים
  choice: at isinusulat ito
  rationale: Tuwirang pinananatili ang hiwalay na kilos ng pagtatala sa kasunduan sa halip na ipaloob lamang sa pariralang “nakasulat na kasunduan.”
- source_word: וְעַל הֶחָתוּם
  choice: Sa dokumentong nilagyan ng tatak
  rationale: Ang substantibong anyo ay malamang na tumutukoy sa nakasulat na kasulatang pormal na tinatakan. Ang “nilagyan ng tatak” ay mas malinaw sa modernong Filipino kaysa “selyado,” na maaari ring mangahulugang isinara lamang.
- source_word: שָׂרֵינוּ
  choice: aming mga pinuno
  rationale: Ang שׂרים ay mga kinikilalang pinunong sibiko o opisyal. Natural at hindi nagpapahiwatig ng pagkahari ang “mga pinuno.”
- source_word: לְוִיֵּינוּ
  choice: mga Levita
  rationale: Karaniwang katawagan sa Filipino para sa pangkat na Levitico.
- source_word: כֹּהֲנֵינוּ
  choice: mga pari
  rationale: Tuwirang modernong katumbas ng pangkat ng mga saserdote sa Israel.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “matibay na kasunduan” upang panatilihin ang diin ng אֲמָנָה sa katatagan at pananagutan. Nilinaw sa pangunahing teksto ang ipinahihiwatig na mga pangalan sa tinatakan, habang inilagay sa talababa ang mas literal at mas malabong anyo.
