id: NEH.10.34
reference: Nehemiah 10:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לְ/לֶ֣חֶם הַֽ/מַּעֲרֶ֡כֶת וּ/מִנְחַ֣ת הַ/תָּמִ֣יד וּ/לְ/עוֹלַ֣ת הַ֠/תָּמִיד הַ/שַּׁבָּת֨וֹת הֶ/חֳדָשִׁ֜ים לַ/מּוֹעֲדִ֗ים וְ/לַ/קֳּדָשִׁים֙ וְ/לַ֣/חַטָּא֔וֹת לְ/כַפֵּ֖ר עַל יִשְׂרָאֵ֑ל וְ/כֹ֖ל מְלֶ֥אכֶת בֵּית אֱלֹהֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/034.yaml
  text: for the bread of the arrangement[a], and for the regular grain offering, and for the regular burnt offering, for the Sabbaths, the new moons, the appointed times, and the holy things, and for the sin offerings to make atonement for Israel[e][d][c][b], and for all the work of the house of our God.
translation:
  language: tl
  text: para sa tinapay na nakalatag[a], sa regular na handog na mula sa butil, sa regular na handog na sinusunog[b], para sa mga Sabbath, mga bagong buwan, mga takdang panahon[c], mga banal na bagay[d], at mga handog para sa kasalanan[e] upang magbayad-sala para sa Israel, at para sa lahat ng gawain sa bahay ng aming Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinapay na inayos”; tradisyonal na tinatawag na “tinapay na handog.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “patuloy na handog na mula sa butil” at “patuloy na handog na sinusunog.”
    reason: lexical_alternative
  - marker: c
    text: Maaaring kabilang sa “mga takdang panahon” ang itinakdang mga kapistahan.
    reason: lexical_alternative
  - marker: d
    text: O “mga banal na handog” o “mga bagay na itinalaga.”
    reason: lexical_alternative
  - marker: e
    text: Sa ilang konteksto, ang “mga handog para sa kasalanan” ay maaari ring unawain bilang “mga handog para sa paglilinis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: tinapay na inayos
  rationale: Malapit ito sa literal na diwang 'tinapay ng pagkakaayos/pagkakalatag' at nauunawaan sa modernong Tagalog nang hindi gumagamit ng di-karaniwang tradisyonal na katawagan.
- source_word: מִנְחַת הַתָּמִיד
  choice: palagiang handog na pagkaing butil
  rationale: Sa kontekstong pangritwal, ang מִנְחָה ay handog na mula sa butil, at ang תָּמִיד ay nagpapahiwatig ng regular o patuloy na pag-aalay.
- source_word: עֹלַת הַתָּמִיד
  choice: palagiang handog na sinusunog
  rationale: Pinananatili nito ang kinikilalang kategorya ng handog na sinusunog at ang paulit-ulit o palagiang katangian nito.
- source_word: הַשַּׁבָּתוֹת הֶחֳדָשִׁים לַמּוֹעֲדִים
  choice: mga Sabbath, mga bagong buwan, mga takdang panahon
  rationale: Pinananatili ang magkakahiwalay na okasyong binabanggit ng Hebreo; mas malawak ang 'mga takdang panahon' kaysa 'mga kapistahan' at maaari nitong saklawin ang mga itinakdang kapistahan.
- source_word: וְלַקֳּדָשִׁים
  choice: mga banal na bagay
  rationale: Sinasalamin nito ang malawak at hindi tiyak na saklaw ng pangmaramihang קֹדֶשׁ nang hindi nililimitahan sa mga handog lamang.
- source_word: וְלַחַטָּאוֹת
  choice: mga handog para sa kasalanan
  rationale: Ito ang malinaw at nakikilalang katumbas ng katawagang pansakripisyo, habang ang posibleng diwang paglilinis ay inilalagay sa talababa.
- source_word: לְכַפֵּר עַל יִשְׂרָאֵל
  choice: upang magbayad-sala para sa Israel
  rationale: Pinananatili ng 'magbayad-sala' ang ritwal at teolohikal na bigat ng כפר nang hindi ipinapaliwanag nang mas makitid kaysa sa teksto.
- source_word: וְכֹל מְלֶאכֶת בֵּית אֱלֹהֵינוּ
  choice: lahat ng gawain sa bahay ng aming Diyos
  rationale: Malawak ang מְלָאכָה at tumutukoy sa lahat ng gawaing kaugnay ng templo, hindi lamang sa serbisyong panliturhiya.
theological_decisions:
- issue: Pagsasalin ng mga katawagang pansakripisyo nang walang labis na pagpapakahulugan
  choice: Panatilihin ang malinaw na mga katawagang 'handog na pagkaing butil,' 'handog na sinusunog,' 'handog para sa kasalanan,' at 'magbayad-sala.'
  alternative: Gumamit ng mas interpretatibong mga katawagang gaya ng 'kaloob,' 'buong handog,' o 'handog para sa paglilinis.'
  rationale: Ang talata ay talaan ng mga pangangailangan at pananagutan sa templo. Pinananatili ng mga piniling katawagan ang mga kategorya ng Hebreo nang hindi nagdaragdag ng mas huling doktrinal na pagpapakahulugan.
- issue: Saklaw ng קֳּדָשִׁים
  choice: Isalin nang malawak bilang 'mga banal na bagay.'
  alternative: mga banal na handog; mga bagay na itinalaga
  rationale: Hindi sapat ang pagiging tiyak ng Hebreo upang limitahan ito sa mga handog o kaloob lamang; pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang 'bahay ng aming Diyos' upang panatilihin ang konkretong larawan ng Hebreo, at pinanatili ang 'Sabbath' bilang pamilyar na katawagang biblikal. Ang mga pariralang pansakripisyo ay teknikal ngunit madaling maunawaan, at ang mga tunay na alternatibong kahulugan ay inilagay sa mga talababa.
