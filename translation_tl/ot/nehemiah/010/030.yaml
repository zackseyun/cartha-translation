  source_fidelity: Kailangang ayusin ang pagsasalin ng mga infinitive na לָלֶכֶת at וְלִשְׁמוֹר וְלַעֲשׂוֹת. Ang kasalukuyang “mamumuhay sila ... susundin at isasagawa nila” ay nagiging magkakahiwalay na pahayag sa hinaharap, samantalang ang Hebreo ay nagpapahayag ng layunin/obligasyong pinasok sa sumpa at panunumpa. Ang “pumapasok sa isang sumpa at isang panunumpa” ay mas tuwirang tumutugon sa וּבָאִים בְּאָלָה וּבִשְׁבוּעָה kaysa “nagbubuklod ... sa pamamagitan ng.”
  naturalness: Natural at marangal ang “nakikiisa,” “Kautusan ng Diyos,” at “lingkod ng Diyos.” Mas malinaw at mas likas ang pangungusap kapag ginamitan ng “upang” para iugnay ang panunumpang pangtipan at ang obligasyong mamuhay ayon sa Kautusan. Ang “aming Panginoon” ay pinananatili upang tumpak na maipakita ang unang panauhang pangmaramihan sa אֲדֹנֵינוּ.
  terminology: Ang “Yahweh” ay wastong pinanatili para sa יהוה, samantalang ang אֲדֹנֵינוּ ay “aming Panginoon.” Ang “Kautusan,” “utos,” “mga tuntunin,” at “mga batas” ay nagpapanatili ng pormal na rehistro at ng magkakahiwalay na kategoryang legal sa teksto.
