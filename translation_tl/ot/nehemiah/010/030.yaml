    rationale: 'Ang “mamumuhay sila” at “susundin at isasagawa nila” ay finite future clauses sa Tagalog. Dapat silang iugnay bilang layunin o nilalaman ng pinasok nilang panata: “upang mamuhay ... at sundin at isagawa.”'
  - severity: medium
    issue: Hindi sapat na tuwiran ang “nagbubuklod ng kanilang sarili sa pamamagitan ng sumpa at panunumpa.”
    rationale: Ang וּבָאִים בְּ ay “pumapasok sa” isang umiiral na obligasyon/panata. Ang rebisyon ay pinananatili ang parehong “sumpa” at “panunumpa” at ang diwang pagpasok sa tipang may pananagutan.
