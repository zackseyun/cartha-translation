source:
  edition: WLC
  text: מַחֲזִיקִ֣ים עַל אֲחֵי/הֶם֮ אַדִּירֵי/הֶם֒ וּ/בָאִ֞ים בְּ/אָלָ֣ה וּ/בִ/שְׁבוּעָ֗ה לָ/לֶ֨כֶת֙ בְּ/תוֹרַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר נִתְּנָ֔ה בְּ/יַ֖ד מֹשֶׁ֣ה עֶֽבֶד הָֽ/אֱלֹהִ֑ים וְ/לִ/שְׁמ֣וֹר וְ/לַ/עֲשׂ֗וֹת אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֲדֹנֵ֔י/נוּ וּ/מִשְׁפָּטָ֖י/ו וְ/חֻקָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/030.yaml
  text: They join with their brothers[a], their nobles, and enter into a curse and an oath, to walk in the law of God, which was given by the hand of Moses the servant of God, and to keep and to do all the commandments of Yahweh our Lord[d][c][b], and his judgments and his statutes.
translation:
  language: tl
  text: Nakikiisa sila sa kanilang mga kapatid at sa kanilang mga pinuno[a], at pumapasok sila sa isang sumpa at isang panunumpa[b], upang mamuhay ayon sa Kautusan ng Diyos, na ibinigay sa pamamagitan ni Moises[c], na lingkod ng Diyos, at upang sundin at isagawa ang lahat ng utos ni Yahweh na aming Panginoon, pati ang kanyang mga tuntunin at mga batas[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mahigpit na nagbubuklod ng kanilang sarili sa kanilang mga kapatid at mga pinuno.” Ipinahihiwatig ng idyomang Hebreo ang matatag na pakikiisa sa mga nangunguna sa pamayanan bilang magkakatuwang sa tipan.
    reason: lexical_alternative
  - marker: b
    text: 'Ang “sumpa at panunumpa” ay isang taimtim na pangakong pangtipan: nanunumpa silang susunod at tinatanggap nila ang kaparusahang nakasaad sa sumpa kung lalabag sila.'
    reason: cultural_note
  - marker: c
    text: 'Literal: “na ibinigay sa kamay ni Moises.”'
    reason: lexical_alternative
  - marker: d
    text: Ang “mga tuntunin” ay maaari ring isaling “mga kahatulan” o “mga alituntunin”; ang “mga batas” ay maaari ring isaling “mga tuntuning itinakda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיקִים עַל
  choice: Nakikiisa
  rationale: Ipinahahayag ng idyoma ang matibay na pakikiugnay at pakikiisa sa mga kasapi ng pamayanan sa tipan, hindi lamang ang pisikal na paghawak o pagpapalakas.
- source_word: אֲחֵיהֶם
  choice: kanilang mga kapatid
  rationale: Pinananatili ang literal na panlalaking katawagang pampamilya ng Hebreo; sa konteksto, tumutukoy ito sa mga kapwa kabilang sa pamayanan ng tipan.
- source_word: אַדִּירֵיהֶם
  choice: kanilang mga pinuno
  rationale: Sa kontekstong panlipunan at pampamayanan, tumutukoy ito sa mga prominenteng taong may katayuan at pamumuno. Mas natural sa modernong Tagalog ang 'mga pinuno' kaysa 'mga maharlika.'
- source_word: וּבָאִים בְּאָלָה וּבִשְׁבוּעָה
  choice: nagbubuklod ng kanilang sarili sa pamamagitan ng sumpa at panunumpa
  rationale: Inilalarawan nito ang kusang pagpasok sa isang obligasyong pinagtibay ng panunumpa at may kaakibat na sumpa kapag nilabag.
- source_word: לָלֶכֶת בְּתוֹרַת הָאֱלֹהִים
  choice: mamumuhay sila ayon sa Kautusan ng Diyos
  rationale: Likas na ipinahahayag sa Tagalog ang Hebreong talinghaga ng 'paglakad' bilang pamumuhay o asal; ang 'Kautusan' ay angkop sa kontekstong legal at pangtipan.
- source_word: אֲשֶׁר נִתְּנָה בְּיַד מֹשֶׁה
  choice: na ibinigay sa pamamagitan ni Moises
  rationale: Ang 'sa pamamagitan ni Moises' ang natural na katumbas ng Hebreong idyomang 'sa kamay ni Moises' at pinananatili ang diwa ng pagkakaloob sa pamamagitan ng isang tagapamagitan.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Dito, ang עֶבֶד ay marangal na titulong inilalapat kay Moises; 'lingkod' ang angkop at likas na salin.
- source_word: וְלִשְׁמוֹר וְלַעֲשׂוֹת
  choice: susundin at isasagawa
  rationale: 'Pinananatili ang dalawang pandiwa ng pormulang pangtipan: maingat na pagsunod at aktuwal na pagtupad.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang 'Yahweh' sa halip na palitan ito ng isang titulo.
- source_word: מִשְׁפָּטָיו וְחֻקָּיו
  choice: kanyang mga tuntunin at mga batas
  rationale: Inihihiwalay ang dalawang magkaugnay na kategorya ng mga atas, habang gumagamit ng malinaw at kasalukuyang bokabularyong Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng 'Yahweh' ang pagkakaiba nito sa titulong אֲדֹנֵינוּ, na isinaling 'aming Panginoon.'
- issue: Panlalaking katawagang אֲחֵיהֶם
  choice: kanilang mga kapatid
  alternative: kanilang mga kamag-anak; kanilang mga kababayang Israelita
  rationale: Pinananatili ang anyo at larawang pampamilya ng pinagmulan nang hindi pinaliliit o pinalalawak nang tahasan ang saklaw nito.
- issue: Kahulugan ng עֶבֶד bilang titulo ni Moises
  choice: lingkod ng Diyos
  alternative: alipin ng Diyos
  rationale: Bagaman maaaring mangahulugang 'alipin' ang salita sa ibang konteksto, dito ay marangal at kinikilalang titulo ito ni Moises; 'lingkod' ang mas angkop na Filipino.
- issue: Relasyon ng sumpa at panunumpa
  choice: nagbubuklod ng kanilang sarili sa pamamagitan ng sumpa at panunumpa
  alternative: pumapasok sa sumpa at panunumpa
  rationale: Pinananatili ang dalawang elementong pangtipan at ang kusang pananagutan, nang hindi ipinapaliwanag sa mismong talata ang eksaktong parusang maaaring idulot ng paglabag.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'nakikiisa,' 'mamumuhay ayon,' at 'sa pamamagitan ni Moises' upang maging natural ang mga Hebreong idyoma. Pinanatili ang pormal na bokabularyong pangtipan—Kautusan, sumpa, panunumpa, utos—at ang pagkakaiba ng personal na pangalang 'Yahweh' sa titulong 'Panginoon.'
