  text: 'at ang kanilang mga kapatid: sina Sebanias, Hodias, Kelita, Pelaias, at Hanan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחֵי/הֶם
  choice: at ang kanilang mga kapatid
  rationale: Tuwirang inililipat ang pang-ugnay at ang pangngalang may hulaping panghalip. Sa konteksto ng talaan ng mga lalaking lumagda sa tipan, likas sa Filipino ang “mga kapatid” at hindi kailangang gawing mas malawak na “mga kamag-anak.”
- source_word: שְׁבַנְיָה
  choice: Sebanias
  rationale: Pangalang pantangi na isina-Filipino ang baybay; pinananatili ang tunog ng Hebreo habang ginagamit ang hulma ng mga pangalang biblikal na pamilyar sa Filipino.
- source_word: הוֹדִיָּה
  choice: Hodias
  rationale: Pangalang pantangi na isina-Filipino ang anyo, kasama ang hulaping -as na karaniwang ginagamit sa mga pangalang biblikal na may hulaping -iah.
- source_word: קְלִיטָא
  choice: Kelita
  rationale: Tuwirang transliterasyon na malinaw at likas bigkasin sa Filipino.
- source_word: פְּלָאיָה
  choice: Pelaias
  rationale: Pangalang pantangi na isina-Filipino ang baybay at pinananatiling nakikilala ang Hebreong anyo.
- source_word: חָנָן
  choice: Hanan
  rationale: Tuwirang transliterasyon ng pangalang pantangi; malinaw at madaling bigkasin sa Filipino.
