source:
  edition: WLC
  text: וְ/אֶת רֵאשִׁ֣ית עֲרִיסֹתֵ֣י/נוּ וּ֠/תְרוּמֹתֵי/נוּ וּ/פְרִ֨י כָל עֵ֜ץ תִּיר֣וֹשׁ וְ/יִצְהָ֗ר נָבִ֤יא לַ/כֹּהֲנִים֙ אֶל לִשְׁכ֣וֹת בֵּית אֱלֹהֵ֔י/נוּ וּ/מַעְשַׂ֥ר אַדְמָתֵ֖/נוּ לַ/לְוִיִּ֑ם וְ/הֵם֙ הַ/לְוִיִּ֔ם הַֽ/מְעַשְּׂרִ֔ים בְּ/כֹ֖ל עָרֵ֥י עֲבֹדָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/038.yaml
  text: And we will bring the first of our dough[a], our contributions, the fruit of every tree, the new wine, and the oil to the priests, to the chambers of the house of our God, and the tithe of our land to the Levites; for they, the Levites[c][b], are the ones who collect the tithes in all the cities where we labor.
translation:
  language: tl
  text: Dadalhin din namin sa mga pari, sa mga silid[a] ng bahay ng aming Diyos, ang unang bahagi ng aming minasa[b], ang aming mga handog na ibinukod, ang bunga ng bawat puno, ang bagong alak, at ang langis. Dadalhin namin sa mga Levita ang ikasampung bahagi mula sa aming lupain; sapagkat sila, ang mga Levita, ang kumokolekta ng ikasampung bahagi sa lahat ng bayan kung saan kami gumagawa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga imbakan.” Tumutukoy ang Hebreo sa mga silid sa kompleks ng templo, na madalas ding ginagamit na imbakan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang unang bahagi ng aming masa/minasa,” samakatuwid ay ang unang bahagi ng minasa nilang harina na ibinukod bilang handog.
    reason: lexical_clarification
  - marker: c
    text: Sa literal, “sa lahat ng bayan ng aming gawain/paglilingkod.” Siksik ang pariralang Hebreo at maaaring tumukoy sa mga bayang kaugnay ng kanilang paggawa o pagsasaka.
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית עֲרִיסֹתֵינוּ
  choice: ang unang bahagi ng aming minasa
  rationale: Ang רֵאשִׁית ay unang bahaging inihahandog, at ang עֲרִיסָה ay minasa o masa ng harina. Pinananatili ng salin ang kongkretong larawan nang hindi gumagamit ng malabong pangkalahatang terminong “unang bunga.”
- source_word: תְרוּמֹתֵינוּ
  choice: ang aming mga handog na ibinukod
  rationale: Ang תְּרוּמָה ay handog o ambag na itinalaga para sa banal na gamit. Mas malinaw sa karaniwang mambabasa ang “handog na ibinukod” kaysa sa teknikal o makalumang katawagan.
- source_word: פְרִי כָל עֵץ
  choice: ang bunga ng bawat puno
  rationale: Tuwirang ipinahahayag nito ang distributibong lakas ng כָל at pinananatili ang anyo ng pariralang Hebreo.
- source_word: תִּירוֹשׁ
  choice: ang bagong alak
  rationale: Karaniwang tumutukoy ang תִּירוֹשׁ sa bagong naprosesong alak bilang produktong agrikultural, hindi lamang sa alak sa pangkalahatan.
- source_word: יִצְהָר
  choice: ang langis
  rationale: Tumutukoy ito sa langis, karaniwang langis ng olibo sa ganitong talaan, ngunit hindi na idinagdag ang “olibo” sapagkat hindi iyon tahasang sinabi sa teksto.
- source_word: נָבִיא
  choice: dadalhin namin
  rationale: Ang unang panauhang maramihan na Hiphil ng בוא ay nagpapahayag ng pangako ng pamayanan na magdala.
- source_word: לִשְׁכוֹת
  choice: mga silid
  rationale: Ang לִשְׁכוֹת ay mga silid sa loob ng kompleks ng templo. Hindi agad nilimitahan sa “mga imbakan,” bagaman maaari ring gamitin ang mga ito sa pag-iimbak.
- source_word: מַעְשַׂר אַדְמָתֵנוּ
  choice: ang ikasampung bahagi mula sa aming lupain
  rationale: Ipinahihiwatig ng parirala ang ikasampung bahagi ng ibinubunga ng lupain. Ang “mula sa” ay natural sa Filipino at hindi ginagawang pagmamay-ari ng lupain mismo ang ikasampung bahagi.
- source_word: הַמְעַשְּׂרִים
  choice: kumokolekta ng ikasampung bahagi
  rationale: Sa kontekstong administratibo, ang participle ay tumutukoy sa pagtanggap o pangongolekta ng mga ikasampung bahagi ng mga Levita.
- source_word: בְּכֹל עָרֵי עֲבֹדָתֵנוּ
  choice: sa lahat ng bayan kung saan kami gumagawa
  rationale: Maaaring mangahulugan ang עֲבֹדָה ng gawain, paggawa, o paglilingkod. Ang salin ay nagpapanatili ng malawak na diwa ng paggawa, habang ipinapaliwanag sa talababa ang siksik at bahagyang malabong ugnayan ng parirala.
theological_decisions:
- issue: Ang tumatanggap at kumokolekta ng mga ikasampung bahagi
  choice: Malinaw na ang mga Levita ang tumatanggap ng ikasampung bahagi mula sa lupain at sila rin ang kumokolekta nito sa mga bayan.
  alternative: Iugnay ang lahat ng handog, pati ang ikasampung bahagi, nang walang pagkakaiba sa mga pari.
  rationale: Tahasang pinag-iiba ng sintaks ng Hebreo ang mga bagay na dinadala sa mga pari sa mga silid ng templo at ang ikasampung bahagi na dinadala sa mga Levita. Pinananatili ang kaibhang ito nang hindi nagdaragdag ng sistemang teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ikasampung bahagi” sa halip na mas teknikal na “ikapu” upang agad maunawaan ang dami, at “mga Levita” bilang karaniwang anyong Filipino. Hinati sa dalawang pangungusap ang mahabang Hebreong sugnay upang luminaw ang pagkakaiba ng mga handog para sa mga pari at ng ikasampung bahagi para sa mga Levita, nang hindi binabago ang ugnayang sintaktiko.
