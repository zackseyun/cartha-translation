  text: וְ/הַ/גּוֹרָל֨וֹת הִפַּ֜לְנוּ עַל קֻרְבַּ֣ן הָ/עֵצִ֗ים הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ וְ/הָ/עָם֒ לְ֠/הָבִיא לְ/בֵ֨ית אֱלֹהֵ֧י/נוּ לְ/בֵית אֲבֹתֵ֛י/נוּ לְ/עִתִּ֥ים מְזֻמָּנִ֖ים שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בַעֵ֗ר עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/035.yaml
  text: We cast lots concerning the wood offering—the priests[a], the Levites, and the people—to bring it to the house of our God, according to our fathers’ houses, at appointed times year by year, to burn on the altar of Yahweh our God, as it is written in the Law.
translation:
  language: tl
  text: Nagpalabunutan kami tungkol sa handog na kahoy[a]—ang mga pari, mga Levita, at ang bayan—upang dalhin ito sa bahay ng aming Diyos ayon sa aming mga angkan, sa mga takdang panahon taun-taon, upang sunugin ang kahoy sa altar ni Yahweh na aming Diyos, gaya ng nasusulat sa Kautusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “para sa handog na kahoy.” Maaaring mangahulugan ang Hebreong pang-ukol ng “tungkol sa” o “para sa”; ang diwa ay nagpalabunutan sila upang italaga kung sino ang may pananagutang magdala ng kahoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַגּוֹרָלוֹת הִפַּלְנוּ
  choice: Nagpalabunutan din kami
  rationale: Ang Hiphil ng נפל kasama ng גּוֹרָלוֹת ay idyoma para sa pagpapasya sa pamamagitan ng palabunutan. Likas sa modernong Tagalog ang “nagpalabunutan,” at ipinapakita ng “din” ang pagpapatuloy mula sa naunang mga pananagutan.
- source_word: עַל קֻרְבַּן הָעֵצִים
  choice: tungkol sa paghahandog ng kahoy
  rationale: Ipinakikilala ng עַל ang bagay na pinagpasiyahan sa palabunutan, samantalang ang קֻרְבַּן הָעֵצִים ay tumutukoy sa kahoy na ihahandog o ilalaan para sa altar. Pinananatili sa talababa ang posibleng pagbasa na “para sa.”
- source_word: הַכֹּהֲנִים הַלְוִיִּם וְהָעָם
  choice: ang mga pari, mga Levita, at ang bayan
  rationale: Pinananatili ang tatlong tahasang binanggit na pangkat na kasama sa palabunutan.
- source_word: לְהָבִיא
  choice: upang dalhin ito
  rationale: Ipinahahayag ng pawatas ang layunin ng palabunutan. Ang “ito” ay natural na tumutukoy sa kahoy na ihahandog.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: sa bahay ng aming Diyos
  rationale: Pinananatili ang Hebreong larawan ng “bahay,” na sa konteksto ay tumutukoy sa templo, nang hindi pinapalitan ng mas interpretatibong katawagan.
- source_word: לְבֵית אֲבֹתֵינוּ
  choice: ayon sa aming mga angkan
  rationale: Ang “bahay ng mga ama” ay tumutukoy sa mga pangkat ng pamilya o angkan. Ang “mga angkan” ay malinaw at likas sa modernong Tagalog.
- source_word: לְעִתִּים מְזֻמָּנִים
  choice: sa mga takdang panahon
  rationale: Tumutukoy ang parirala sa mga itinakdang pagkakataon sa iskedyul.
- source_word: שָׁנָה בְשָׁנָה
  choice: taun-taon
  rationale: Natural na ipinahahayag nito sa Tagalog ang regular na pag-uulit bawat taon.
- source_word: לְבַעֵר עַל מִזְבַּח
  choice: para sunugin sa altar
  rationale: Sa kontekstong ito, ang בער ay tumutukoy sa pagsunog ng kahoy sa altar. Hindi idinagdag ang mas interpretatibong diwang “panatilihing nagliliyab.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: gaya ng nasusulat sa Kautusan
  rationale: Pinananatili nito ang pormulang tumutukoy sa nasusulat na Torah bilang kinikilalang kalipunan ng tagubilin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalang iyon sa halip na palitan ng titulong “PANGINOON.”
- issue: Layunin ng pagsunog ng kahoy sa altar
  choice: para sunugin sa altar
  alternative: para panatilihing nagliliyab ang altar
  rationale: Ang mas payak na salin ay sumusunod sa agarang anyo ng teksto at hindi nagpapasok ng dagdag na paliwanag tungkol sa pagpapanatili ng apoy, bagaman iyon ang praktikal na gamit ng kahoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nagpalabunutan,” “mga angkan,” at “takdang panahon” bilang mga likas na pahayag; pinanatili ang “bahay ng aming Diyos,” “Yahweh,” at “Kautusan” upang maingatan ang mahahalagang anyo at sanggunian ng tekstong Hebreo.
