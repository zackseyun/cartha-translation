lexical_decisions:
- source_word: מְשֵׁיזַבְאֵל
  choice: Meshezabel
  rationale: Pangalan ng tao; isinalin sa pamamagitan ng transliterasyon. Pinananatili ng “Meshezabel” ang pagkakasunod ng mga pangunahing tunog ng pangalang Hebreo habang madali itong basahin sa modernong Filipino.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Pangalan ng tao; ang “Zadok” ay malapit sa anyong Hebreo at malinaw sa modernong Filipino. Hindi ginamit ang tradisyonal na anyong “Sadok” upang mapanatili ang tunog ng unang katinig na tsadi.
- source_word: יַדּוּעַ
  choice: Jadua
  rationale: Pangalan ng tao; ang “Jadua” ay likas basahin sa Filipino. Hindi na ipinakita sa baybay ang pagdoble ng katinig na dalet, sapagkat hindi karaniwang minamarkahan sa praktikal na transliterasyong Filipino ang ganitong pagdodoble.
