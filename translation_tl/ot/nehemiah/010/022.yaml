  footnotes:
  - marker: a
    text: 'Tatlong pangalan lamang ng mga tao ang nasa tekstong Hebreo: Meshezabel, Zadok, Jadua. Idinagdag ang mga kuwit at ang salitang “at” upang maging natural at malinaw ang talaan sa Filipino.'
