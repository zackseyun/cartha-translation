id: NEH.10.29
reference: Nehemiah 10:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/שְׁאָ֣ר הָ/עָ֡ם הַ/כֹּהֲנִ֣ים הַ֠/לְוִיִּם הַ/שּׁוֹעֲרִ֨ים הַ/מְשֹׁרְרִ֜ים הַ/נְּתִינִ֗ים וְֽ/כָל הַ/נִּבְדָּ֞ל מֵ/עַמֵּ֤י הָ/אֲרָצוֹת֙ אֶל תּוֹרַ֣ת הָ/אֱלֹהִ֔ים נְשֵׁי/הֶ֖ם בְּנֵי/הֶ֣ם וּ/בְנֹתֵי/הֶ֑ם כֹּ֖ל יוֹדֵ֥עַ מֵבִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/029.yaml
  text: and the rest of the people—the priests[a], the Levites, the gatekeepers, the singers, the temple servants, and all who had separated themselves from the peoples of the lands to the law of God—their wives, their sons, and their daughters[b], everyone who knew and understood—
translation:
  language: tl
  text: At ang natitira sa bayan—ang mga pari, mga Levita, mga bantay-pinto, mga mang-aawit, mga lingkod sa templo[a], at lahat ng humiwalay mula sa mga mamamayan ng mga lupain upang sumunod sa Kautusan ng Diyos—pati ang kanilang mga asawa, mga anak na lalaki, at mga anak na babae, bawat isa na nakaaalam at nakauunawa[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Netinim,” ang tradisyonal na transliterasyon ng pangalan ng isang pangkat ng mga lingkod sa templo.
    reason: lexical_alternative
  - marker: b
    text: 'Gumagamit ang Hebreo ng mga anyong panlalaking isahan na may kolektibong diwa: “bawat humiwalay … bawat nakaaalam at nakauunawa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הָעָם
  choice: At ang iba pa sa bayan
  rationale: Likas sa modernong Tagalog ang “iba pa” bilang katumbas ng nalalabi o natitirang bahagi; pinananatili ng “bayan” ang diwang pangkomunidad ng עָם.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: ang mga pari, mga Levita
  rationale: Ito ang malinaw at nakaugaliang mga katawagan sa Tagalog para sa mga pari at sa uring Levitico.
- source_word: הַשּׁוֹעֲרִים
  choice: mga bantay-pinto
  rationale: Tiyak nitong ipinahihiwatig ang tungkulin ng mga tauhang nagbabantay sa mga pasukan, nang hindi pinalalawak sa pangkalahatang pagbabantay.
- source_word: הַמְשֹׁרְרִים
  choice: mga mang-aawit
  rationale: Ang salitang Hebreo ay partikular na tumutukoy sa mga umaawit, hindi sa lahat ng uri ng musikero.
- source_word: הַנְּתִינִים
  choice: mga lingkod sa templo
  rationale: Isinasalin ang tungkulin ng natatanging pangkat na ito sa halip na gumamit lamang ng transliterasyong hindi mauunawaan ng karaniwang mambabasa.
- source_word: וְכָל הַנִּבְדָּל מֵעַמֵּי הָאֲרָצוֹת אֶל תּוֹרַת הָאֱלֹהִים
  choice: at lahat ng humiwalay sa mga bayan ng ibang lupain upang sumunod sa Kautusan ng Diyos
  rationale: Ipinapahayag ng “humiwalay” ang kusang paglayo, samantalang ginagawang likas sa Tagalog ng “upang sumunod” ang direksiyong ipinahihiwatig ng אֶל tungo sa Kautusan. Ang “ibang lupain” ay nilinaw mula sa kontekstuwal na kaibahan ng mga bayang tinutukoy.
- source_word: נְשֵׁיהֶם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: pati ang kanilang mga asawa, mga anak na lalaki, at mga anak na babae
  rationale: Pinananatili ang tahasang tatlong pangkat sa Hebreo sa halip na paikliin bilang “mga pamilya” o “mga anak.”
- source_word: כֹּל יוֹדֵעַ מֵבִין
  choice: bawat isang may kaalaman at pang-unawa
  rationale: Natural na inilalarawan sa Tagalog ang bawat taong may kakayahang makaalam at makaunawa; pinananatili rin ang kolektibong gamit ng anyong isahan.
theological_decisions:
- issue: Ang ugnayan ng paghihiwalay sa mga bayan at ng Kautusan ng Diyos
  choice: “humiwalay ... upang sumunod sa Kautusan ng Diyos”
  alternative: “humiwalay ... tungo sa Kautusan ng Diyos”
  rationale: Ang literal na “tungo sa Kautusan” ay malabo at di-likas sa Tagalog. Ipinakikita ng piniling anyo ang direksiyon o pagpanig sa Kautusan nang hindi nagdaragdag ng partikular na denominasyonal na paliwanag.
- issue: Masculinong isahan na may kolektibong bisa
  choice: Gamitin ang walang-kasariang likas na anyong Tagalog na “lahat ng humiwalay” at “bawat isang may kaalaman at pang-unawa.”
  alternative: Ipilit ang panlalaking panghalip upang tumbasan ang gramatikal na kasarian ng Hebreo.
  rationale: Walang gramatikal na kasarian ang mga kaugnay na anyo sa Tagalog. Ang konteksto mismo ay tahasang sumasaklaw sa mga asawa, anak na lalaki, at anak na babae, kaya hindi dapat magdagdag ng panlalaking panghalip na wala namang likas na katumbas sa target na wika.
- issue: Pagpapakahulugan sa נְתִינִים
  choice: “mga lingkod sa templo” sa pangunahing teksto, na may transliterasyon sa talababa
  alternative: “mga Netinim” lamang
  rationale: Mas nauunawaan ng karaniwang mambabasa ang tungkulin kapag isinalin, habang pinananatili sa talababa ang natatanging tradisyonal na pangalan ng pangkat.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Napanatili ang anyong talaan at ang nakabiting gitling sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata. Ginamit ang “Kautusan” na may malaking titik bilang katawagan sa Torah ng Diyos, hindi bilang dagdag na interpretasyong denominasyonal.
