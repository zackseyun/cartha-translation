revisions:
- from: At ang iba pa sa bayan—ang mga pari, mga Levita, mga bantay-pinto, mga mang-aawit, mga lingkod sa templo[a], at lahat ng humiwalay sa mga bayan ng ibang lupain upang sumunod sa Kautusan ng Diyos—pati ang kanilang mga asawa, mga anak na lalaki, at mga anak na babae, bawat isang may kaalaman at pang-unawa[b]—
  to: At ang natitira sa bayan—ang mga pari, mga Levita, mga bantay-pinto, mga mang-aawit, mga lingkod sa templo[a], at lahat ng humiwalay mula sa mga mamamayan ng mga lupain upang sumunod sa Kautusan ng Diyos—pati ang kanilang mga asawa, mga anak na lalaki, at mga anak na babae, bawat isa na nakaaalam at nakauunawa[b]—
