base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/032.yaml
  text: As for the peoples of the land who bring goods and any grain on the Sabbath day to sell[a], we will not buy from them on the Sabbath or on a holy day; and we will forego the seventh year and every debt.
translation:
  language: tl
  text: Kung tungkol naman sa mga mamamayan ng lupain na nagdadala ng mga paninda at anumang butil sa araw ng Sabbath upang ipagbili, hindi kami bibili sa kanila sa Sabbath o sa isang banal na araw. Hahayaan din naming mamahinga ang lupain sa ikapitong taon, at patatawarin namin ang bawat utang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang huling parirala na “bawat paghahabol” o “bawat paniningil.” Sa literal, ang Hebreo ay “ang pasan/panininingil ng bawat kamay.”
    reason: Pinananatili ang tunay na kalabuan ng idyomang מַשָּׁא כָל יָד.
lexical_decisions:
- source_word: עַמֵּי הָאָרֶץ
  choice: mga bayan ng lupain
  rationale: Pinananatili ang anyong maramihan at ang karaniwang katawagan sa mga nakapaligid na populasyon, sa halip na gawing iisang kolektibong ‘mga tao.’
- source_word: הַמַּקָּחוֹת
  choice: mga paninda
  rationale: Natural na modernong Tagalog para sa mga kalakal o bagay na inilalako.
- source_word: שֶׁבֶר
  choice: butil
  rationale: Sa konteksto ng kalakalan, karaniwang tumutukoy ito sa butil bilang pangunahing produktong pagkain.
- source_word: לֹא נִקַּח מֵהֶם
  choice: hindi kami bibili sa kanila
  rationale: Bagaman malawak ang kahulugang ‘kumuha’ ng pandiwa, malinaw sa konteksto ng mga panindang dinala upang ipagbili na pagbili ang tinutukoy.
- source_word: וּבְיוֹם קֹדֶשׁ
  choice: o sa isang banal na araw
  rationale: Ang ‘o’ ay natural sa Filipino sa loob ng negatibong pagbabawal at ipinapakitang saklaw din nito ang ibang banal na araw.
- source_word: וְנִטֹּשׁ אֶת הַשָּׁנָה הַשְּׁבִיעִית
  choice: Hahayaan din naming mamahinga ang lupa sa ikapitong taon
  rationale: Ipinahahayag ang ipinahihiwatig na gawaing pansakahan sa batas ng ikapitong taon; mas malinaw at natural ito kaysa sa literal ngunit malabong ‘pababayaan ang ikapitong taon.’
- source_word: מַשָּׁא כָל יָד
  choice: hindi kami maniningil ng anumang utang
  rationale: Ibinibigay ang malamang na legal at pangkabuhayang diwa ng masiksik na idyomang Hebreo, habang inilalagay sa talababa ang tunay na leksikal na kalabuan.
theological_decisions:
- issue: Saklaw ng tungkulin sa ikapitong taon
  choice: Kasama rito ang pagpapahinga sa lupang sinasaka at ang hindi paniningil ng mga utang.
  alternative: ‘Pababayaan namin ang ikapitong taon at ang bawat paghahabol/panininingil.’
  rationale: Umaalingawngaw ang talata sa mga batas tungkol sa taon ng Sabbath at sa pagpapatawad o pagpapaliban ng mga utang. Nililinaw ng salin ang malamang na diwa nang hindi ginagawang doktrinal na pahayag ang isang masiksik at pinagtatalunang idyoma.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang ‘Sabbath’ bilang pamilyar na katawagang biblikal; iniwasan ang labis na teknikal o makalumang pananalita.
