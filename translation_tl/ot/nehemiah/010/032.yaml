revisions:
- from: Kung tungkol naman sa mga bayan ng lupain na nagdadala ng mga paninda at anumang butil sa araw ng Sabbath upang ipagbili, hindi kami bibili sa kanila sa Sabbath o sa isang banal na araw. Hahayaan din naming mamahinga ang lupa sa ikapitong taon at hindi kami maniningil ng anumang utang.[a]
  to: Kung tungkol naman sa mga mamamayan ng lupain na nagdadala ng mga paninda at anumang butil sa araw ng Sabbath upang ipagbili, hindi kami bibili sa kanila sa Sabbath o sa isang banal na araw. Hahayaan din naming mamahinga ang lupain sa ikapitong taon, at patatawarin namin ang bawat utang.[a]
  rationale: Inayos ang katawagan para sa עַמֵּי הָאָרֶץ upang malinaw na mga tao ang tinutukoy. Pinalitan ang “hindi kami maniningil” ng “patatawarin namin” upang ihayag ang malamang na diwa ng pagpapawalang-bisa sa loob ng sabbatical-year na konteksto, nang hindi inaalis ang leksikal na kalabuan na nasa talababa. Ang “lupain” bilang ipinahihiwatig na bagay ng pagpapahinga ay nananatiling ligtas na paglilinaw sa kontekstong agrikultural.
