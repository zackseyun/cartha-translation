base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/005.yaml
  text: Then I said to the king[a], "If it pleases the king, and if your servant has found favor before you, that you would send me to Judah, to the city of my fathers' graves[c][b], so that I may rebuild it."
translation:
  language: tl
  text: At sinabi ko sa hari, “Kung mamarapatin ng hari, at kung kinalulugdan mo ang iyong lingkod, isugo mo sana ako sa Juda, sa lungsod na kinaroroonan ng mga libingan ng aking mga ninuno,[a] upang maitayo kong muli ang lungsod.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa lungsod ng mga libingan ng aking mga ama.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Hebreo ay “itayo”; ginagawang hayag ng “itayo…muli” na wasak ang lungsod at kailangan itong muling itayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: At sinabi ko
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa Tagalog ang “At sinabi ko” bilang pagpapatuloy ng naunang pangyayari.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Kung mamarapatin ng hari
  rationale: Magalang na idyoma ito para sa pagsang-ayon o ikalulugod ng hari. Pinananatili ng “mamarapatin” ang pormal at mapagpakumbabang himig ng pakikiusap.
- source_word: וְאִם יִיטַב עַבְדְּךָ לְפָנֶיךָ
  choice: at kung kinalulugdan mo ang iyong lingkod
  rationale: Ipinahihiwatig ng idyoma ang mabuting katayuan ng lingkod sa paningin ng hari. Natural sa makabagong Tagalog ang “kinalulugdan mo” at hindi nito ipinapalagay na unang pagkakataon pa lamang siyang nakatagpo ng pabor.
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Karaniwang mapagpakumbabang pantukoy sa sarili sa pakikipag-usap sa hari; mas angkop dito ang “lingkod” kaysa “alipin.”
- source_word: תִּשְׁלָחֵנִי
  choice: isugo mo sana ako
  rationale: Ang “isugo” ay angkop sa pagpapadala ng hari para sa isang atas, habang ipinahahayag ng “sana” ang magalang na pakiusap sa halip na isang tuwirang utos.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyong Tagalog ng pangalan ng lugar.
- source_word: אֶל־עִיר קִבְרוֹת אֲבֹתַי
  choice: sa lungsod na kinaroroonan ng mga libingan ng aking mga ninuno
  rationale: Ipinapahayag nang natural ang literal na “lungsod ng mga libingan ng aking mga ama.” Ang “mga ninuno” ang malinaw na kahulugan ng אֲבֹתַי sa kontekstong ito.
- source_word: וְאֶבְנֶנָּה
  choice: upang maitayo kong muli ang lungsod
  rationale: May layuning diwa ang anyong pandiwa, at tumutukoy sa lungsod ang hulaping pambabae. Ang “muli” ay ginagawang hayag ang kontekstong wasak ang lungsod, bagaman “itayo” lamang ang batayang kahulugan ng pandiwa.
