  register: Makabago ngunit marangal na Tagalog, na pinananatili ang magalang na pananalita sa hari. Ginamit ang “mamarapatin” dahil pormal ito ngunit nauunawaan pa rin, at ang “isugo mo sana ako” upang maipakita ang anyo ng magalang na kahilingan.
