base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/018.yaml
  text: So I told them that the hand of my God was good upon me[a], and also the words of the king that he had spoken to me. And they said[c][b], “Let us rise up and build.” So they strengthened their hands for the good work.
translation:
  language: tl
  text: Kaya sinabi ko sa kanila kung paanong nasa akin ang mabuting kamay ng aking Diyos[a], at gayundin ang mga salitang sinabi sa akin ng hari. Sinabi nila, “Bumangon tayo at magtayo!”[b] Kaya pinalakas nila ang kanilang mga kamay para sa mabuting gawain.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang kamay ng aking Diyos ay naging mabuti sa akin” o “kumalinga sa akin ang aking Diyos.” Literal sa Hebreo, “ang kamay ng aking Diyos na mabuti sa akin.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “Tumindig tayo at magtayo.”
    reason: lexical_alternative
  - marker: c
    text: Literal sa Hebreo, “pinalakas nila ang kanilang mga kamay para sa mabuti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַגִּיד
  choice: Kaya sinabi ko
  rationale: Isinusulong ng waw-consecutive ang salaysay at iniuugnay ang pagsasabi ni Nehemias sa naunang pangyayari; natural sa modernong Tagalog ang “Kaya sinabi ko.”
- source_word: יַד אֱלֹהַי
  choice: ang kamay ng aking Diyos
  rationale: Pinananatili ang Hebreong metapora para sa aktibong pagkilos, kapangyarihan, o paglingap ng Diyos sa halip na paliitin ito sa iisang interpretasyon.
- source_word: אֲשֶׁר הִיא טוֹבָה עָלַי
  choice: ay naging mabuti sa akin
  rationale: Malapit ito sa literal na idyomang Hebreo habang mas nauunawaan sa Tagalog kaysa “mabuti sa ibabaw ko.” Ipinapahiwatig ng “naging” ang kabutihang naranasan ni Nehemias sa mga naunang pangyayari.
- source_word: וְאַף דִּבְרֵי הַמֶּלֶךְ אֲשֶׁר אָמַר לִי
  choice: at gayundin ang mga sinabi sa akin ng hari
  rationale: Natural na inilalahad ang ikalawang bagay na ibinalita ni Nehemias, habang pinananatili ang pagtukoy sa sinabi ng hari.
- source_word: נָקוּם וּבָנִינוּ
  choice: Bumangon tayo at magtayo!
  rationale: Kinakatawan ng unang panauhang maramihan ang sama-samang panawagan at matibay na pasiya. Ang tandang padamdam ay angkop sa masiglang tugon.
- source_word: וַיְחַזְּקוּ יְדֵיהֶם
  choice: Kaya pinalakas nila ang kanilang mga kamay
  rationale: Pinananatili ang konkretong idyoma ng Hebreo at ang pag-uulit ng larawan ng “kamay” sa talata, sa halip na isalin lamang bilang “nagkaroon sila ng lakas ng loob.”
- source_word: לַטּוֹבָה
  choice: para sa mabuting gawain
  rationale: Ang “mabuting gawain” ay natural na tumutukoy sa planong pagtatayo, bagaman literal na “para sa mabuti” ang Hebreo; minamarkahan sa talababa ang pagpapalinaw.
theological_decisions:
- issue: Ang idyoma tungkol sa kamay ng Diyos na mabuti kay Nehemias
  choice: Panatilihin ang metapora bilang “ang kamay ng aking Diyos ay naging mabuti sa akin.”
  alternative: “Nilakasan ako ng aking Diyos” o “naging mapagbiyaya sa akin ang aking Diyos.”
  rationale: Pinananatili nito ang aktibong banal na pagkilos at ang tunay na lawak ng idyoma nang hindi ito nililimitahan sa biyaya, pabor, o kapangyarihan lamang.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Pinanatili ang magkaugnay na larawan ng kamay ng Diyos at ng mga kamay ng mga tao. Ginamit ang “magtayo” dahil malinaw sa konteksto ang muling pagtatayo, nang hindi idinaragdag sa mismong pandiwa ang salitang “muli.”
