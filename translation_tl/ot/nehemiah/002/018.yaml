revisions:
- from: Kaya sinabi ko sa kanila kung paanong ang kamay ng aking Diyos ay naging mabuti sa akin[a], at gayundin ang mga sinabi sa akin ng hari. Sinabi nila, “Bumangon tayo at magtayo!”[b] Kaya pinalakas nila ang kanilang mga kamay para sa mabuting gawain.[c]
  to: Kaya sinabi ko sa kanila kung paanong nasa akin ang mabuting kamay ng aking Diyos[a], at gayundin ang mga salitang sinabi sa akin ng hari. Sinabi nila, “Bumangon tayo at magtayo!”[b] Kaya pinalakas nila ang kanilang mga kamay para sa mabuting gawain.[c]
  rationale: Inayos ang unang idyoma upang manatili ang metapora ng kamay ng Diyos habang maiwasan ang hindi sinasadyang pahiwatig na nagbago ang Diyos o ang kaniyang kamay. Ibinigay rin nang mas ganap ang “mga salita ng hari,” at itinama ang talababa upang hindi ipakahulugan ang idyoma bilang pagiging mapagbigay lamang.
