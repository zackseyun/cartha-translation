  source_fidelity: 'Tumpak sa kabuuan ang pagsasalin ng mga kahilingan: liham kay Asaf, kahoy mula sa maharlikang pardes, mga pintuan ng tanggulan na kaugnay ng templo, pader ng lungsod, at bahay na titirhan. Wasto ring pinananatili ang metapora ng mabuting kamay ng Diyos. Gayunman, ang “kahoy na gagamiting mga biga” ay kulang sa malinaw na panandang nagsasaad na ang kahoy ay gagawing biga; mas tumpak at natural ang “kahoy upang gawing mga biga.”'
