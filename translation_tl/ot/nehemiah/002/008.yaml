  terminology: Ang “liham,” “tagapangalaga,” “kagubatan,” “tanggulan,” “templo,” “pader ng lungsod,” at “mga biga” ay angkop. Maingat na pinananatili ng “kaugnay ng templo” ang hindi ganap na tiyak na relasyon sa Hebreong parirala, at maayos ang talababa sa pagpapaliwanag nito.
