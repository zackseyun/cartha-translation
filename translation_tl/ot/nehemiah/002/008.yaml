source:
  edition: WLC
  text: וְ/אִגֶּ֡רֶת אֶל אָסָף֩ שֹׁמֵ֨ר הַ/פַּרְדֵּ֜ס אֲשֶׁ֣ר לַ/מֶּ֗לֶךְ אֲשֶׁ֣ר יִתֶּן לִ֣/י עֵצִ֡ים לְ֠/קָרוֹת אֶת שַׁעֲרֵ֨י הַ/בִּירָ֤ה אֲשֶׁר לַ/בַּ֨יִת֙ וּ/לְ/חוֹמַ֣ת הָ/עִ֔יר וְ/לַ/בַּ֖יִת אֲשֶׁר אָב֣וֹא אֵלָ֑י/ו וַ/יִּתֶּן לִ֣/י הַ/מֶּ֔לֶךְ כְּ/יַד אֱלֹהַ֖/י הַ/טּוֹבָ֥ה עָלָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/008.yaml
  text: and a letter to Asaph[a], the keeper of the king’s forest, that he should give me timber to make beams for the gates of the fortress by the temple, and for the wall of the city, and for the house that I will occupy. And the king gave them to me[d][c][b], according to the good hand of my God upon me.
translation:
  language: tl
  text: at isang liham para kay Asaf, na tagapangalaga ng kagubatan ng hari,[a] upang bigyan niya ako ng kahoy upang gawing mga biga para sa mga pintuan ng tanggulang kaugnay ng templo,[b] para sa pader ng lungsod, at para sa bahay na titirhan ko. Ipinagkaloob sa akin ng hari ang mga iyon, ayon sa mabuting kamay ng aking Diyos na nasa akin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “parke ng hari” o “taniman ng hari.” Ang salitang Hebreo ay tumutukoy sa isang maharlikang lupain o pinamamahalaang kakahuyan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “tanggulang kaugnay ng bahay.” Malamang na ang “bahay” ay ang templo; maaari ring unawain ang kaugnayan bilang “tanggulang pag-aari ng templo” o “tanggulang nasa tabi ng templo.”
    reason: lexical_and_relational_ambiguity
  - marker: c
    text: Ang “mabuting kamay ng aking Diyos na nasa akin” ay isang idyoma para sa mabuting pagkalinga at tulong ng Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: אִגֶּרֶת
  choice: isang liham
  rationale: Ang salita ay tumutukoy sa isang liham o opisyal na kasulatan; natural at sapat sa konteksto ang “liham.”
- source_word: שֹׁמֵר הַפַּרְדֵּס
  choice: tagapangalaga ng kagubatan ng hari
  rationale: Ang פַּרְדֵּס ay isang pinamamahalaang maharlikang lupain na maaaring parke, taniman, o kakahuyan. Dahil kahoy na pansamantala sa pagtatayo ang hinihingi, malinaw sa konteksto ang “kagubatan,” habang inilalahad sa talababa ang ibang posibilidad.
- source_word: יִתֶּן לִי עֵצִים
  choice: bigyan niya ako ng kahoy
  rationale: Ang עֵצִים ay literal na mga puno o kahoy; sa konteksto ng pagtatayo, natural sa Tagalog ang pangmaramihang di-mabilang na “kahoy.”
- source_word: לְקָרוֹת
  choice: gagamiting mga biga
  rationale: Ang pandiwa ay kaugnay ng paglalagay ng mga biga o pag-atip. Ipinahahayag ng salin ang layuning pangkonstruksiyon nang hindi nililimitahan ito sa pag-atip lamang.
- source_word: שַׁעֲרֵי הַבִּירָה אֲשֶׁר לַבָּיִת
  choice: mga pintuan ng tanggulang kaugnay ng templo
  rationale: Ang בִּירָה ay isang tanggulan o kuta. Hindi tiyak kung eksaktong pagmamay-ari, pagkakaugnay, o lokasyon ang ipinahihiwatig ng לַבַּיִת, kaya pinananatili ng “kaugnay” ang lawak ng relasyon; ang “templo” ang malamang na tinutukoy ng “bahay” sa konteksto.
- source_word: חוֹמַת הָעִיר
  choice: pader ng lungsod
  rationale: Tumpak, natural, at malapit sa kayariang Hebreo.
- source_word: הַבַּיִת אֲשֶׁר אָבוֹא אֵלָיו
  choice: bahay na titirhan ko
  rationale: Literal itong “bahay na papasukan ko,” ngunit sa konteksto ay bahay na tutuluyan o titirhan ni Nehemias. Ang salin ay natural at hindi nagpapahiwatig ng pagmamay-ari.
- source_word: וַיִּתֶּן לִי הַמֶּלֶךְ
  choice: Ipinagkaloob sa akin ng hari ang mga iyon
  rationale: Walang tahasang layon sa Hebreo, ngunit pinahihintulutan ng Tagalog na ihayag ang ipinahihiwatig na mga kahilingan sa pamamagitan ng “ang mga iyon.”
- source_word: כְּיַד אֱלֹהַי הַטּוֹבָה עָלָי
  choice: ayon sa mabuting kamay ng aking Diyos na nasa akin
  rationale: Pinananatili nito ang mahalagang larawan ng “kamay” bilang aktibong pagkalinga at tulong ng Diyos, sa halip na palitan ito ng abstraktong paliwanag.
theological_decisions:
- issue: Ang mabuting kamay ng Diyos bilang larawan ng banal na pagkalinga
  choice: Panatilihin ang idyomang “mabuting kamay ng aking Diyos na nasa akin.”
  alternative: “sapagkat kinalugdan at tinulungan ako ng Diyos”
  rationale: Mahalagang larawan sa Ezra–Nehemias ang kamay ng Diyos. Ang pagpapanatili rito ay naghahayag ng aktibong pagkalinga ng Diyos nang hindi dinaragdagan ng isang partikular na sistematikong paliwanag.
- issue: Pagkilala sa הַבַּיִת bilang templo
  choice: Gamitin ang “templo” sa pangunahing teksto ngunit ilahad sa talababa ang literal na “bahay.”
  alternative: “bahay” lamang
  rationale: Sa kontekstong ito, malamang na templo ang tinutukoy, ngunit hindi dapat itago na karaniwang “bahay” ang anyong Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “lungsod,” “tanggulan,” at “biga” bilang malinaw na mga salitang pangkasaysayan at pangkonstruksiyon. Pinanatili ang larawang “kamay ng Diyos,” at minarkahan sa talababa ang leksikal at sintaktikong kalabuan.
