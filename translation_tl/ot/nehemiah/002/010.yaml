source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע סַנְבַלַּ֣ט הַ/חֹרֹנִ֗י וְ/טֽוֹבִיָּה֙ הָ/עֶ֣בֶד הָֽ/עַמֹּנִ֔י וַ/יֵּ֥רַע לָ/הֶ֖ם רָעָ֣ה גְדֹלָ֑ה אֲשֶׁר בָּ֥א אָדָ֔ם לְ/בַקֵּ֥שׁ טוֹבָ֖ה לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/010.yaml
  text: When Sanballat the Horonite and Tobiah the Ammonite servant heard this[b][a], it was very displeasing to them that a man had come to seek the welfare of the children of Israel.
translation:
  language: tl
  text: Nang marinig ito nina Sanbalat na Horonita at Tobias na aliping[a] Ammonita, labis nilang ikinasama ng loob[b] na may isang lalaking dumating upang hangarin ang kapakanan ng mga anak ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lingkod na Ammonita.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “masama ito sa kanila—isang malaking kasamaan.” Inuulit ng Hebreo ang salitang-ugat na nangangahulugang “masama” upang idiin ang tindi ng kanilang pagkayamot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Nang mabalitaan ito
  rationale: Ang pandiwa ay ‘nakarinig/nabalitaan.’ Likas sa Tagalog ang paglalagay ng ‘ito,’ na tumutukoy sa pagdating at atas ni Nehemias sa naunang konteksto.
- source_word: הַחֹרֹנִי
  choice: na Horonita
  rationale: Panuring na nagpapakilala kay Sanbalat ayon sa kaniyang pinagmulang lugar; pinanatili bilang katawagang pantao.
- source_word: הָעֶבֶד
  choice: lingkod
  rationale: Maaaring mangahulugang ‘lingkod’ o ‘alipin.’ Sa talatang ito, panlipunang katawagan ito kay Tobias, ngunit hindi sapat ang konteksto upang tiyak na idiin ang pagkakaalipin; inilagay sa talababa ang mas literal at mas mabigat na alternatibo.
- source_word: הָעַמֹּנִי
  choice: na Ammonita
  rationale: Panuring na tumutukoy sa pambansa o etnikong pagkakakilanlan ni Tobias.
- source_word: וַיֵּרַע לָהֶם רָעָה גְדֹלָה
  choice: labis nilang ikinasama ng loob
  rationale: Likas na idyomang Tagalog para sa matinding pagkayamot o sama ng loob. Naipahihiwatig nito ang pag-uulit ng salitang-ugat na ‘masama’ sa Hebreo nang hindi nagiging pilit.
- source_word: אָדָם
  choice: isang lalaking
  rationale: Tumutukoy sa isang indibidwal—si Nehemias—at ang anyo at konteksto ay angkop sa tahasang ‘lalaki,’ sa halip na gawing walang kasarian ang pahayag.
- source_word: לְבַקֵּשׁ טוֹבָה
  choice: upang hangarin ang kapakanan
  rationale: Ipinapahayag ng parirala ang aktibong paghahangad ng kabutihan o kapakanan para sa iba; natural sa modernong Tagalog ang ‘hangarin ang kapakanan.’
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ng mga anak ni Israel
  rationale: Pinananatili ang nakaugaliang pambansa at tipanang katawagang ‘mga anak ni Israel’ nang hindi nililimitahan sa mga anak na lalaki.
theological_decisions:
- issue: Paglalarawan kay Tobias sa pamamagitan ng הָעֶבֶד
  choice: lingkod
  alternative: alipin
  rationale: Saklaw ng salitang Hebreo ang parehong ‘lingkod’ at ‘alipin.’ Dahil maaari rin itong magsilbing katayuan o katawagan at hindi malinaw rito ang eksaktong antas ng pagkakabihag, hindi ginawang tiyak sa pangunahing teksto ang ‘alipin’; malinaw na inilalahad ang alternatibo sa talababa.
- issue: Pag-render sa אָדָם
  choice: isang lalaki
  alternative: isang tao / may isang dumating
  rationale: Ang tinutukoy ay ang partikular na lalaking si Nehemias. Pinananatili ng salin ang kasariang ipinahihiwatig ng konteksto nang hindi nagdaragdag ng doktrinal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang likas na idyomang “ikinasama ng loob” para sa matinding negatibong reaksiyon, habang pinanatili sa talababa ang mas literal na anyo at ang tunay na kalabuan ng הָעֶבֶד.
