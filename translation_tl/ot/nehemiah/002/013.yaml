base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/013.yaml
  text: So I went out by night through the Valley Gate[a], toward the Dragon Spring and toward the Dung Gate[b], and I inspected the walls of Jerusalem that had been broken down and its gates that had been consumed by fire.
translation:
  language: tl
  text: Kaya lumabas ako nang gabi sa Pintuan ng Lambak, patungo sa Bukal ng Dragon[a] at sa Pintuan ng Dumi, at sinuri[b] ko ang mga pader ng Jerusalem na nawasak at ang mga pintuan nitong tinupok ng apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Bukal ng Ahas” o “Bukal ng Tsakal.” Ang salitang Hebreo na tannin ay maaaring tumukoy sa dragon, ahas, tsakal, o kahawig na nilalang.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na isinaling “sinuri” ay karaniwang nangangahulugang “bumasag,” ngunit sa kontekstong ito ay nauunawaan bilang maingat na pagtingin o pagsusuri sa mga sirang pader.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵצְאָה
  choice: Kaya lumabas ako
  rationale: Ang wayyiqtol na unang panauhan ng יצא ay nagsasaad ng kasunod na kilos sa salaysay; natural na ipinapahayag ito sa Filipino bilang “Kaya lumabas ako.”
- source_word: בְּשַׁעַר הַגַּיְא
  choice: sa Pintuan ng Lambak
  rationale: Sa konteksto ng paglalakbay, maaaring ipahiwatig ng ב ang pagdaan sa pintuan. Ang “Pintuan ng Lambak” ay malinaw at angkop na pangalan ng pook sa Filipino.
- source_word: לַיְלָה
  choice: nang gabi
  rationale: Ginagamit ito bilang pananda ng oras; ang “nang gabi” ay natural sa makabagong Filipino.
- source_word: וְאֶל־פְּנֵי עֵין הַתַּנִּין
  choice: patungo sa Bukal ng Dragon
  rationale: Ang עַיִן ay bukal dito, at ang אֶל־פְּנֵי ay tumutukoy sa direksiyon ng ruta. Pinananatili ng “Dragon” ang kakaiba at malawak na kahulugan ng תַּנִּין nang hindi ito nililimitahan sa ahas o chakal.
- source_word: שַׁעַר הָאַשְׁפֹּת
  choice: Pintuan ng Dumi
  rationale: Ang אַשְׁפֹּת ay tumutukoy sa dumi, basura, o bunton ng itinapon. Ang “Pintuan ng Dumi” ay maikli at malapit sa tradisyonal na pangalan.
- source_word: וָאֱהִי שֹׂבֵר
  choice: at sinuri ko
  rationale: Bagaman karaniwang nangangahulugang “bumasag” ang שבר, hinihingi ng konteksto ng lihim na pag-iinspeksiyon ang diwang “sinuri.” Isinasalin ang progresibong konstruksiyon sa natural na aspektong Filipino.
- source_word: בְּחוֹמֹת יְרוּשָׁלַםִ
  choice: ang mga pader ng Jerusalem
  rationale: Ito ang bagay na sinusuri; tuwiran at natural ang pariralang Filipino.
- source_word: אֲשֶׁר הַמְּפֹרָצִים
  choice: na gumuho
  rationale: Ang anyong pasibo mula sa פרץ ay nagsasaad na ang mga pader ay nabutas, nalabag, o nawasak. Ang “gumuho” ay malinaw sa ordinaryong mambabasa, bagaman ang mas tiyak na “nabutas” ay posible rin.
- source_word: וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  choice: at ang mga pintuan nitong tinupok ng apoy
  rationale: Pinananatili ng “tinupok ng apoy” ang matalinghagang puwersa ng אכל, literal na “kinain,” at natural itong pahayag sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga pangalan ng pook bilang malinaw na pariralang Filipino at inilagay sa talababa ang tunay na leksikal na kalabuan. Ang marker [b] ay inilagay sa hulihan ng pangungusap dahil tumutukoy ito sa pandiwang “sinuri,” hindi sa Pintuan ng Dumi.
