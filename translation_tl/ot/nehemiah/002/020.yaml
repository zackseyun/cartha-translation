  text: וָ/אָשִׁ֨יב אוֹתָ֜/ם דָּבָ֗ר וָ/אוֹמַ֤ר לָ/הֶם֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם ה֚וּא יַצְלִ֣יחַֽ לָ֔/נוּ וַ/אֲנַ֥חְנוּ עֲבָדָ֖י/ו נָק֣וּם וּ/בָנִ֑ינוּ וְ/לָ/כֶ֗ם אֵֽין חֵ֧לֶק וּ/צְדָקָ֛ה וְ/זִכָּר֖וֹן בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/020.yaml
  text: Then I answered them and said[a], “The God of heaven, he will make us prosper, and we his servants will arise and build[b]. But you have no share or right or memorial in Jerusalem.”
translation:
  language: tl
  text: At sumagot ako sa kanila at sinabi ko, “Ang Diyos ng langit—siya ang magpapagtagumpay sa amin[a]. Kami, na kanyang mga lingkod, ay babangon at magtatayo. Ngunit wala kayong bahagi, karapatan[b], o alaala sa Jerusalem.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bibigyan niya kami ng tagumpay.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “makatarungang paghahabol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׁיב אוֹתָם דָּבָר וָאוֹמַר לָהֶם
  choice: Kaya sumagot ako sa kanila at sinabi
  rationale: Ang idyomang שׁוּב + דָּבָר ay nangangahulugang sumagot, hindi literal na ‘ibinalik ang isang salita.’ Pinananatili ng parirala ang dalawang pandiwang nasa Hebreo nang natural sa Tagalog.
- source_word: אֱלֹהֵי הַשָּׁמַיִם הוּא
  choice: Ang Diyos ng langit—siya ang
  rationale: Ang gitling at ‘siya ang’ ay nagpapahayag ng diin ng hiwalay na panghalip na הוּא nang hindi nagiging mabigat o di-likas.
- source_word: יַצְלִיחַ לָנוּ
  choice: magtatagumpay sa amin
  rationale: Ang causative na anyo ng צלח ay tumutukoy sa Diyos bilang siyang magbibigay ng tagumpay sa gawain. Ang ‘magtatagumpay sa amin’ ay maikli, natural, at pinananatili ang causative na diwa.
- source_word: עֲבָדָיו
  choice: mga lingkod niya
  rationale: Sa konteksto, ang salita ay nagbibigay-diin sa paglilingkod at katapatan sa Diyos, hindi sa katayuang panlipunan ng isang alipin.
- source_word: נָקוּם וּבָנִינוּ
  choice: babangon at magtatayo
  rationale: Pinananatili ang determinadong pagkilos ng קום at ang payak na ‘magtayo’ ng בנה; hindi idinagdag ang mas interpretibong ‘muling magtatayo,’ bagaman malinaw iyon sa konteksto.
- source_word: אֵין חֵלֶק
  choice: walang bahagi
  rationale: Ang חֵלֶק ay isang bahagi o nakalaang kaparte; malinaw at natural ang ‘bahagi’ sa Tagalog.
- source_word: וּצְדָקָה
  choice: karapatan
  rationale: Dito, ang צְדָקָה ay tumutukoy sa lehitimong karapatan o makatarungang paghahabol sa Jerusalem, hindi sa moral na katuwiran.
- source_word: וְזִכָּרוֹן
  choice: o alaala
  rationale: Pinananatili ng ‘alaala’ ang pangunahing diwa ng זִכָּרוֹן at ang maaaring pampubliko o pangkasaysayang pagkakaugnay nito, sa halip na paliitin ito sa isang tiyak na legal na kahulugan.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Karaniwang locative na salin sa modernong Tagalog.
theological_decisions:
- issue: Katawagan para sa mga naglilingkod sa Diyos
  choice: mga lingkod niya
  alternative: mga alipin niya
  rationale: Ang punto rito ay ang pagkilala, katapatan, at awtorisadong paglilingkod sa Diyos sa harap ng mga kalaban. Ang ‘mga lingkod’ ang mas angkop nang hindi nagdaragdag ng diin sa legal na pagkaalipin.
- issue: Kahulugan ng צְדָקָה sa pormula ng pagtanggi
  choice: karapatan
  alternative: katuwiran; makatarungang paghahabol
  rationale: Itinatanggi ng talata na may lehitimong katayuan ang mga kalaban sa Jerusalem. Ang ‘katuwiran’ ay maaaring magpasok ng moral o doktrinal na kahulugang hindi hinihingi ng legal at pampolitikang konteksto.
- issue: Saklaw ng זִכָּרוֹן
  choice: alaala
  alternative: pagkilala; kinikilalang kaugnayan
  rationale: Ang literal at malawak na ‘alaala’ ay nagpapanatili sa posibleng kahulugang pampubliko, pangkasaysayan, o pangkomunidad nang hindi tiyak na ginagawang legal na karapatan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘siya ang’ upang dalhin ang diin ng Hebreo, at pinanatili ang tatluhang pormula na ‘bahagi, karapatan, o alaala.’
