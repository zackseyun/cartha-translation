base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/015.yaml
  text: So I went up by the wadi at night and inspected the wall[a]. Then I turned back and entered by the Valley Gate[b], and returned.
translation:
  language: tl
  text: Kaya umahon ako sa tabi ng bangin nang gabi at sinuri ang pader[a]. Pagkatapos ay bumalik ako, pumasok sa pamamagitan ng Pintuan ng Lambak[b], at bumalik ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinusuri” o “tinitingnan.” Karaniwang nangangahulugang “bumabasag” ang pandiwang Hebreo rito, ngunit sa kontekstong ito ay karaniwang inuunawa bilang pagtukoy sa pagsusuri ni Nehemias sa nasirang pader.
    reason: lexical_alternative
  - marker: b
    text: Ang “bangin” ay salin ng salitang maaaring tumukoy sa isang bangin o sa pana-panahong daluyan ng tubig; isinasalin din itong “lambak” o “batis.”
    reason: cultural_note
lexical_decisions:
- source_word: עֹלֶה
  choice: umahon ako
  rationale: Ang עלה kasama ng היה ay naglalarawan ng nagpapatuloy na pag-ahon sa salaysay; natural sa Tagalog ang payak na aspektong naganap na “umahon ako.”
- source_word: בַנַּחַל
  choice: sa bangin
  rationale: Ang נחל ay maaaring tumukoy sa bangin o daluyan ng tubig na pana-panahon lamang may agos. Sa topograpiya ng Jerusalem, malinaw at likas sa karaniwang mambabasa ang “bangin,” nang hindi ito ginagawang malawak na lambak.
- source_word: לַיְלָה
  choice: nang gabing iyon
  rationale: Likas na modernong Tagalog para sa panggabing tagpuan; ang demonstratibong “iyon” ay umaayon sa partikular na gabing isinasalaysay sa konteksto.
- source_word: שֹׂבֵר
  choice: sinuri
  rationale: Bagaman karaniwang nangangahulugang “bumabasag” ang שבר, ipinakikita ng konteksto na tinitingnan ni Nehemias ang nasirang pader. Pinananatili sa talababa ang pambihirang leksikal na anyo at tunay na kahirapan ng parirala.
- source_word: בַּחוֹמָה
  choice: ang pader
  rationale: Pinananatili ang isahan at tiyak na anyo ng Hebreo; malinaw sa konteksto na ito ang pader ng Jerusalem.
- source_word: וָאָשׁוּב
  choice: bumalik ako
  rationale: Sa unang paglitaw, ipinahihiwatig ng שוב ang pagbaligtad ng direksiyon matapos ang pagsusuri.
- source_word: וָאָבֹוא
  choice: pumasok
  rationale: Sa pariralang may pintuan, likas na ipinahihiwatig ng בוא ang pagpasok sa lungsod sa pamamagitan nito.
- source_word: בְּשַׁעַר הַגַּיְא
  choice: sa Pintuan ng Lambak
  rationale: Isang pangalan ng pintuan ng lungsod ang שער הגיא. Ang “Pintuan ng Lambak” ay malinaw at tuwirang salin ng pangalan.
- source_word: וָאָשׁוּב
  choice: sa gayon ay nakabalik
  rationale: Ang huling שוב ay nagsasara sa salaysay ng pag-iikot. Ang “nakabalik” ay iniiwasang maging ganap na inuulit lamang ang naunang “bumalik” habang pinananatili ang diwa.
