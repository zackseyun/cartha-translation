translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “bangin” sa halip na hiram na “wadi” upang madaling maunawaan, habang pinanatiling magkaiba ang karaniwang heograpikong katawagang “bangin” at ang pangalang pantanging “Pintuan ng Lambak.”
