base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/003.yaml
  text: I said to the king[a], “May the king live forever! Why should my face not be sad, when the city, the place of my fathers’ tombs, lies in ruins and its gates have been consumed by fire?”
translation:
  language: tl
  text: Sinabi ko sa hari, “Mabuhay nawa ang hari magpakailanman! Bakit hindi magmumukhang malungkot ang aking mukha, gayong wasak ang lungsod na kinaroroonan ng mga libingan ng aking mga ninuno[a], at ang mga pintuang-bayan nito ay tinupok ng apoy?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “bahay ng mga libingan ng aking mga ama,” isang pananalitang tumutukoy sa lugar na kinaroroonan ng mga libingan ng aking mga ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Sinabi ko
  rationale: Likas na salaysay sa nakaraang panahon para sa wayyiqtol ng אמר; hindi kailangang idagdag ang “Pagkatapos” upang maihatid ang pagkakasunod ng salaysay.
- source_word: לַמֶּלֶךְ / הַמֶּלֶךְ
  choice: sa hari / ang hari
  rationale: Ang una ay di-tuwirang layon, samantalang ang ikalawa ay inuulit sa magalang na pormula ng pakikipag-usap sa hari.
- source_word: לְעוֹלָם יִחְיֶה
  choice: Mabuhay nawa ang hari magpakailanman!
  rationale: Karaniwan at marangal na pormula ng pagbati at paghiling para sa hari; pinananatili ang mapitagang tono.
- source_word: מַדּוּעַ לֹא יֵרְעוּ פָנַי
  choice: Bakit hindi ako malulungkot
  rationale: Ang literal na pagbanggit sa mukha ay isang idyoma para sa nakikitang kalungkutan. Ang saling ito ay natural sa modernong Tagalog at malinaw na naghahayag ng damdamin.
- source_word: אֲשֶׁר
  choice: gayong
  rationale: Ipinakikilala nito ang kalagayang nagpapaliwanag sa kalungkutan ni Nehemias nang hindi labis na pinipilit ang ugnayan bilang tahasang “dahil.”
- source_word: הָעִיר
  choice: ang lungsod
  rationale: Hindi pinangalanan ng Hebreo ang Jerusalem sa talatang ito, kaya pinanatili ang pangkalahatang ngunit tiyak na pagtukoy.
- source_word: בֵּית קִבְרוֹת אֲבֹתַי
  choice: na kinaroroonan ng mga libingan ng aking mga ninuno
  rationale: Ang literal na “bahay ng mga libingan ng aking mga ama” ay tumutukoy sa lugar na kaugnay ng paglilibing sa mga ninuno. Inihahatid ng salin ang kahulugan sa natural na Tagalog habang ipinaliliwanag sa talababa ang literal na anyo.
- source_word: חֲרֵבָה
  choice: wasak
  rationale: Maikli at malinaw na panumbas sa pang-uring naglalarawan sa lungsod bilang guho o winasak.
- source_word: וּשְׁעָרֶיהָ
  choice: at ... ang mga pintuang-bayan nito
  rationale: Tumutukoy sa mga tarangkahan ng lungsod; ang “pintuang-bayan” ay malinaw sa konteksto ng isang napapaderang sinaunang lungsod.
- source_word: אֻכְּלוּ בָאֵשׁ
  choice: tinupok ng apoy
  rationale: Pinananatili ang larawang ang apoy ay lumalamon o lubusang sumisira, sa natural at matatag na idyomang Tagalog.
