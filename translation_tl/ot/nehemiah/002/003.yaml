  to: Sinabi ko sa hari, “Mabuhay nawa ang hari magpakailanman! Bakit hindi magmumukhang malungkot ang aking mukha, gayong wasak ang lungsod na kinaroroonan ng mga libingan ng aking mga ninuno[a], at ang mga pintuang-bayan nito ay tinupok ng apoy?”
