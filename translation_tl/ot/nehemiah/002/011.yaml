  text: So I came to Jerusalem and was there three days.
translation:
  language: tl
  text: Dumating ako sa Jerusalem at naroon ako nang tatlong araw.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָבוֹא
  choice: Kaya dumating ako
  rationale: Ang waw-consecutive kasama ng בוא ay nagsasalaysay ng kasunod na pangyayari. Likas sa modernong Tagalog ang “Kaya dumating ako” at malinaw nitong ipinahihiwatig ang pagdating ng nagsasalita.
- source_word: אֶל יְרוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Ang אֶל kasunod ng pandiwa ng pagkilos ay tumutukoy sa patutunguhan; ang “sa Jerusalem” ang natural na anyo sa Tagalog.
- source_word: וָאֱהִי שָׁם
  choice: at nanatili roon
  rationale: Bagaman pangunahing nangangahulugang “maging/naroon” ang היה, sa kontekstong may lugar at haba ng panahon ay natural nitong ipinahihiwatig ang pananatili. Iniiwasan ng “nanatili roon” ang di-likas na “naroon ako roon.”
- source_word: יָמִים שְׁלֹשָׁה
  choice: nang tatlong araw
  rationale: Ito ay panandang accusative ng tagal. Sa Tagalog, ang “nang tatlong araw” ay malinaw at likas na nagpapahayag ng haba ng pananatili.
