  text: Then the king said to me, “What is it that you are seeking?” So I prayed to the God of heaven.
translation:
  language: tl
  text: Sinabi sa akin ng hari, “Ano ang hinihiling mo?” Kaya nanalangin ako sa Diyos ng langit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְבַקֵּשׁ
  choice: hinihiling
  rationale: Sa konteksto ng pakikipag-usap sa hari, natural na ipinahihiwatig ng pandiwa ang kahilingang nais iharap ni Nehemias; malinaw at karaniwan ang “hinihiling” sa modernong Tagalog.
- source_word: וָאֶתְפַּלֵּל
  choice: Kaya nanalangin ako
  rationale: Pinananatili ang sunod-sunod na kilos at ang tuwirang kahulugan ng pandiwa, na malamang ay tumutukoy sa isang mabilis at tahimik na panalangin nang hindi iyon idinaragdag sa teksto.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: Diyos ng langit
  rationale: Tuwirang isinasalin ang Hebreong titulo at pinananatili ang dignidad at teolohikal na diin nito.
theological_decisions:
- issue: Paraan at haba ng panalangin
  choice: Hindi tinukoy; “nanalangin ako” lamang
  alternative: “tahimik akong nanalangin” o “mabilis akong nanalangin”
  rationale: Hindi tahasang sinasabi ng Hebreo kung tahimik o gaano kaikli ang panalangin; hindi dapat idagdag ang hinuha mula sa tagpo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang “hinihiling” sa halip na mas pormal na “isinasamo” o mas transaksiyonal na “hinihingi.”
