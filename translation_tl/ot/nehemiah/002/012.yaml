  to: Kaya bumangon ako sa gabi, kasama ko ang ilang lalaki. Hindi ko sinabi kaninuman kung ano ang inilalagay ng Diyos ko sa puso ko na gawin para sa Jerusalem.[a] Wala akong kasamang hayop maliban sa sinasakyan ko.
