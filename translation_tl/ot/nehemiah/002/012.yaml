  text: וָ/אָק֣וּם לַ֗יְלָה אֲנִי֮ וַ/אֲנָשִׁ֣ים מְעַט֮ עִמִּ/י֒ וְ/לֹא הִגַּ֣דְתִּי לְ/אָדָ֔ם מָ֗ה אֱלֹהַ/י֙ נֹתֵ֣ן אֶל לִבִּ֔/י לַ/עֲשׂ֖וֹת לִ/ירוּשָׁלִָ֑ם וּ/בְהֵמָה֙ אֵ֣ין עִמִּ֔/י כִּ֚י אִם הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אֲנִ֖י רֹכֵ֥ב בָּֽ/הּ׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/012.yaml
  text: So I arose in the night[a], I and a few men with me, and I had not told anyone what my God was putting into my heart to do for Jerusalem[c][b]. And there was no animal with me except the animal on which I was riding.
translation:
  language: tl
  text: Kaya bumangon ako sa gabi, kasama ko ang ilang lalaki. Hindi ko sinabi kaninuman kung ano ang inilalagay ng Diyos ko sa puso ko na gawin para sa Jerusalem.[a] Wala akong kasamang hayop maliban sa sinasakyan ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “kung ano ang inilagay ng Diyos ko sa puso ko.”'
    reason: Pinahihintulutan ng participle na נֹתֵן sa kontekstong pasalaysay ang mas patuloy na “inilalagay” o ang kontekstuwal na nakaraang “inilagay.”
lexical_decisions:
- source_word: וָאָקוּם לַיְלָה
  choice: Kaya bumangon ako nang gabing iyon
  rationale: Ang wayyiqtol ng קום ay nagsusulong ng salaysay, at ang לַיְלָה ay tumutukoy sa oras ng pagkilos. Natural sa modernong Tagalog ang “nang gabing iyon” sa kontekstong ito.
- source_word: אֲנִי וַאֲנָשִׁים מְעַט עִמִּי
  choice: kasama ang ilang lalaki
  rationale: Pinananatili ng “ilang lalaki” ang tiyak na panlalaking pangkat ng אֲנָשִׁים, samantalang natural na naipapahiwatig ng “kasama” ang tahasang אֲנִי at עִמִּי.
- source_word: וְלֹא הִגַּדְתִּי לְאָדָם
  choice: Hindi ko sinabi kaninuman
  rationale: Ang לְאָדָם ay indefinitong “sa sinumang tao.” Ang “kaninuman” ang natural at tumpak na Filipino, nang hindi ipinahihiwatig na mga lalaki lamang ang saklaw.
- source_word: מָה אֱלֹהַי נֹתֵן אֶל לִבִּי
  choice: kung ano ang inilalagay ng Diyos ko sa puso ko
  rationale: Ang participle na נֹתֵן ay pinananatiling aspektuwal na bukás sa pamamagitan ng kasalukuyang anyong “inilalagay.” Iniiwasan nitong gawing tahasang verbal revelation ang banal na pagkukusa.
- source_word: לַעֲשׂוֹת לִירוּשָׁלִָם
  choice: na gawin para sa Jerusalem
  rationale: Pinananatili ng “gawin para sa Jerusalem” ang malawak at hindi pa tinutukoy na layon ng Hebreo; hindi nito inuunahan ang konteksto sa pagsasabing muling pagtatayo.
- source_word: וּבְהֵמָה אֵין עִמִּי כִּי אִם הַבְּהֵמָה
  choice: Wala akong kasamang hayop maliban sa sinasakyan ko
  rationale: Ang בְּהֵמָה ay pangkalahatang katawagan sa hayop. Ang pag-iwas sa ikalawang pagbanggit ng “hayop” ay natural sa Tagalog at hindi nagbabago sa kahulugan.
- source_word: אֲשֶׁר אֲנִי רֹכֵב בָּהּ
  choice: sinasakyan ko
  rationale: Ang aspektong nagpapatuloy ng participle na רֹכֵב ay natural na ipinahahayag ng “sinasakyan,” at malinaw sa konteksto na ito ang hayop na kaniyang kinauupuan.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa panloob na pasiya ni Nehemias
  choice: “kung ano ang inilalagay ng Diyos ko sa puso ko”
  alternative: “kung ano ang inilagay ng Diyos ko sa puso ko” o “kung ano ang inuudyok sa akin ng Diyos ko na gawin”
  rationale: Iniuugnay ng teksto sa Diyos ang layunin ni Nehemias ngunit hindi nito tinutukoy kung ito ay verbal revelation. Pinananatili ng napiling salin ang tensiyon sa pagitan ng banal na pagkukusa at pagkilos ng tao.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Diyos ko” bilang natural na possessive, at iniwasan ang mas lumang “sumapit ako” o mas mabigat na literalismong makahahadlang sa daloy.
