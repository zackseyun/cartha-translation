    issue: May dagdag na pantukoy na “iyon” sa “nang gabing iyon.”
    rationale: Ang Hebreong לַיְלָה ay “sa gabi” o “nang gabi”; wala itong demonstrative na tumutugma sa “iyon.” Bagaman maaaring ipahiwatig ito ng malawak na konteksto, hindi ito dapat idagdag sa optimal-equivalence na salin.
