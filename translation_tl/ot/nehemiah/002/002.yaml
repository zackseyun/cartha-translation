  text: וַ/יֹּאמֶר֩ לִ֨/י הַ/מֶּ֜לֶךְ מַדּ֣וּעַ פָּנֶ֣י/ךָ רָעִ֗ים וְ/אַתָּה֙ אֵֽינְ/ךָ֣ חוֹלֶ֔ה אֵ֣ין זֶ֔ה כִּי אִ֖ם רֹ֣עַֽ לֵ֑ב וָ/אִירָ֖א הַרְבֵּ֥ה מְאֹֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/002.yaml
  text: And the king said to me[a], “Why is your face sad[b], though you are not sick? This is nothing but sadness of heart.” Then I was very much afraid.
translation:
  language: tl
  text: Sinabi sa akin ng hari, “Bakit malungkot ang mukha mo[a], gayong hindi ka naman maysakit? Wala itong iba kundi kalungkutan ng puso[b].” At lubha akong natakot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “masama ang mukha mo”—isang idyoma para sa malungkot o nababagabag na anyo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dalamhati ng puso” o “pagkabagabag ng puso.” Sa Hebreo, literal na “kasamaan ng puso”; dito ay tumutukoy ito sa panloob na paghihirap, hindi sa moral na kasamaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Likas at tuwirang modernong Tagalog para sa tanong tungkol sa dahilan.
- source_word: פָּנֶיךָ רָעִים
  choice: malungkot ang mukha mo
  rationale: Idyoma ito na literal na nagsasabing “masama ang iyong mukha,” ngunit tumutukoy sa malungkot o nababagabag na anyo. Pinananatili ng salin ang larawan ng mukha habang malinaw ang kahulugan.
- source_word: חוֹלֶה
  choice: maysakit
  rationale: Karaniwan at malinaw na katumbas ng pagiging may karamdaman; ang “naman” ay likas na nagpapahayag ng pagsalungat sa konteksto.
- source_word: אֵין זֶה כִּי אִם
  choice: Wala itong ibang dahilan kundi
  rationale: Ipinahahayag ang eksklusibong konklusyon ng hari sa natural na Tagalog, kahit ipinapahiwatig ang salitang “dahilan” upang maging malinaw ang tinutukoy.
- source_word: רֹעַ לֵב
  choice: kalungkutan ng puso
  rationale: Literal na “kasamaan/kasagwaan ng puso,” ngunit sa konteksto ay panloob na lungkot o pagkabagabag, hindi moral na kasamaan. Ang “puso” ay pinanatili upang mapanatili ang larawang Hebreo.
- source_word: וָאִירָא הַרְבֵּה מְאֹד
  choice: Kaya labis akong natakot
  rationale: Ipinagpapatuloy ng pandiwa ang salaysay, at inilalahad ng “labis” ang matinding takot na binibigyang-diin ng dalawang Hebreong paningit.
theological_decisions:
- issue: Kahulugan ng רֹעַ לֵב
  choice: Panloob na kalungkutan, na may talababa tungkol sa literal at mas malawak na saklaw
  alternative: Kasamaan ng puso
  rationale: Ang paghahambing sa pisikal na karamdaman ay nagpapakitang ang tinutukoy ay panloob na paghihirap. Gayunman, kinikilala sa talababa na maaari rin itong unawain bilang dalamhati o pagkabagabag, kaya hindi pinatitigas ang kahulugan nang higit sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “gayong hindi ka naman maysakit” para sa malinaw na pagsalungat, at pinanatili ang larawang “mukha” at “puso” mula sa Hebreo. Inilagay ang bawat marker kaagad pagkatapos ng pariralang ipinapaliwanag nito.
