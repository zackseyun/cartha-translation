base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/009.yaml
  text: So I came to the governors Beyond the River and gave them the king’s letters[b][a]. Now the king had sent with me army officers and horsemen.
translation:
  language: tl
  text: Kaya dumating ako sa mga gobernador ng Kabilang-Ilog[a] at ibinigay ko sa kanila ang mga sulat ng hari. Nagpadala na ang hari ng mga pinuno ng hukbo at mga mangangabayo upang samahan ako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Kabilang-Ilog” ay katawagang administratibo ng Persia para sa rehiyon sa kanluran ng Ilog Eufrates, na tinatawag ding Trans-Eufrates.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “mga opisyal ng militar at kabalyerya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחֲווֹת
  choice: mga gobernador
  rationale: Tumutukoy sa mga opisyal ng Imperyong Persia na namamahala sa mga nasasakupang distrito; malinaw at likas sa makabagong Filipino ang “mga gobernador.”
- source_word: עֵבֶר הַנָּהָר
  choice: Kabilang-Ilog
  rationale: Opisyal na katawagan sa rehiyong Persian sa kanluran ng Eufrates. Pinananatili ng may gitling at malaking titik ang anyong pangalang panrehiyon nang hindi idinaragdag sa pangunahing teksto ang salitang “lalawigan,” na wala rito sa Hebreo.
- source_word: אִגְּרוֹת
  choice: mga sulat
  rationale: Karaniwang tumutukoy sa nakasulat na liham; sa konteksto, ang mga ito ay mga sulat ng hari na nagbibigay ng pahintulot.
- source_word: שָׂרֵי חַיִל
  choice: mga pinuno ng hukbo
  rationale: Ang parirala ay tumutukoy sa mga lider o opisyal ng sandatahang lakas. Malinaw ito at malapit sa anyo ng Hebreo.
- source_word: פָרָשִׁים
  choice: mga mangangabayo
  rationale: Literal na mga nakasakay sa kabayo; mas malapit sa Hebreo kaysa sa kolektibo at teknikal na “kabalyerya.”
- source_word: וַיִּשְׁלַח עִמִּי הַמֶּלֶךְ
  choice: Nagpadala rin ang hari kasama ko
  rationale: Ang sugnay ay nagbibigay ng karagdagang impormasyon tungkol sa eskortang ipinadala ng hari. Ang “rin” ay likas na nag-uugnay rito sa naunang salaysay nang hindi kinakailangang gawing tahasang pluperfect.
- source_word: וָאָבוֹא
  choice: Kaya pumunta ako
  rationale: Ipinagpapatuloy ng waw ang daloy ng salaysay at inuugnay ang pagdating sa naunang paghahanda; natural sa Filipino ang “Kaya.”
