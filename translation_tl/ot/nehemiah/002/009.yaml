revisions:
- from: Kaya pumunta ako sa mga gobernador sa Kabilang-Ilog[a] at ibinigay ko sa kanila ang mga sulat ng hari. Nagpadala rin ang hari kasama ko ng mga pinuno ng hukbo at mga mangangabayo.[b]
  to: Kaya dumating ako sa mga gobernador ng Kabilang-Ilog[a] at ibinigay ko sa kanila ang mga sulat ng hari. Nagpadala na ang hari ng mga pinuno ng hukbo at mga mangangabayo upang samahan ako.[b]
  rationale: Nilinaw ang administratibong ugnayan ng mga gobernador sa Kabilang-Ilog, inalis ang hindi kailangang “rin,” at inayos ang ikalawang pangungusap para sa mas likas na Filipino. Ang “upang samahan ako” ay maingat na paglalahad ng likas na tungkulin ng mga pinuno ng hukbo at mangangabayong ipinadala ng hari “kasama” ni Nehemias, nang hindi binabago ang diwa ng teksto.
