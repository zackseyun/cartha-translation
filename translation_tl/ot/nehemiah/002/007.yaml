base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/007.yaml
  text: Then I said to the king[a], “If it pleases the king, let letters be given to me for the governors Beyond the River[c][b], so that they may let me pass through until I come to Judah.”
translation:
  language: tl
  text: Pagkatapos, sinabi ko sa hari, “Kung minamabuti ng hari, bigyan sana ako ng mga liham para sa mga gobernador ng Lalawigan sa Kabilang Ilog[a], upang pahintulutan nila akong makadaan hanggang sa makarating ako sa Juda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Lalawigan sa Kabilang Ilog” ay katawagang administratibo ng Persia para sa rehiyon sa kanluran ng Ilog Eufrates.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹמַר
  choice: Pagkatapos, sinabi ko
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Tagalog ang “Pagkatapos” habang pinananatili ang payak na diwa ng pandiwa.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Kung minamabuti ng hari
  rationale: Magalang na pormula ito sa korte. Ang “minamabuti” ay likas at marangal sa Tagalog at hindi labis na nagpapakahulugan.
- source_word: אִגְּרוֹת יִתְּנוּ לִי
  choice: bigyan sana ako ng mga liham
  rationale: Ipinahahayag ng ikatlong panauhang maramihan ang isang magalang na kahilingan sa hari. Nililinaw ng “sana” ang pakiusap nang hindi dinaragdagan ang nilalaman.
- source_word: פַּחֲוֹת
  choice: mga gobernador
  rationale: Tumutukoy ang salita sa mga tagapangasiwang panlalawigan ng Persia; “mga gobernador” ang tuwiran at karaniwang katumbas.
- source_word: עֵבֶר הַנָּהָר
  choice: Lalawigan sa Kabilang Ilog
  rationale: Isa itong katawagang administratibo ng Persia para sa rehiyon sa kanluran ng Eufrates. Idinagdag ang “Lalawigan” upang malinaw na titulo ng rehiyon ito, hindi simpleng direksiyon.
- source_word: אֲשֶׁר יַעֲבִירוּנִי
  choice: upang pahintulutan nila akong makadaan
  rationale: Sa konteksto ng mga liham para sa paglalakbay, ipinahihiwatig ng Hiphil ng עבר ang pagbibigay ng pahintulot o ligtas na pagdaan.
- source_word: עַד אֲשֶׁר אָבוֹא
  choice: hanggang sa makarating ako
  rationale: Natural na katumbas sa Tagalog ng temporal na sugnay at tumpak na nagpapahayag ng pagdating sa hantungan.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyong Tagalog ng pangalang Judah at hindi nagdaragdag ng salitang “lalawigan,” na wala rito sa Hebreo.
