base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/019.yaml
  text: But when Sanballat the Horonite[a], Tobiah the Ammonite servant, and Geshem the Arab heard, they mocked us and despised us, and said, “What is this thing that you are doing? Are you rebelling against the king?”
translation:
  language: tl
  text: Ngunit nang marinig nina Sanbalat na Horonita, Tobias na lingkod na Ammonita[a], at Gesem na Arabe, kinutya nila kami at hinamak. Sinabi nila, “Ano itong ginagawa ninyo? Naghihimagsik ba kayo laban sa hari?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aliping Ammonita.” Maaari ring unawain ng ilan ang “lingkod” bilang katawagan sa isang opisyal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: nang mabalitaan ito
  rationale: Iniuugnay ng waw-consecutive ang balita sa kasunod na pagtuya. Ang “ito” ay likas na tumutukoy sa naunang pangyayari, bagaman walang tahasang layon sa Hebreo.
- source_word: הַחֹרֹנִי
  choice: na Horonita
  rationale: Pinananatili ang katawagang heograpiko o pangkat na nakakabit sa pangalan ni Sanbalat.
- source_word: הָעֶבֶד הָעַמּוֹנִי
  choice: na lingkod na Ammonita
  rationale: Ang עֶבֶד ay maaaring mangahulugang alipin o lingkod at maaari ring gamiting katawagan sa isang nasa paglilingkod o tungkulin. Ang “lingkod” ay natural sa konteksto at hindi labis na nagpapasya sa tiyak na katayuan ni Tobias; inilalahad sa talababa ang ibang posibilidad.
- source_word: הָעַרְבִי
  choice: na Arabe
  rationale: Tuwirang isinasalin ang katawagang etniko o panrehiyon sa natural na anyong Filipino.
- source_word: וַיַּלְעִגוּ לָנוּ
  choice: kinutya nila kami
  rationale: Ipinahahayag ng “kinutya” ang mapanlibak na paghamak ng pandiwa.
- source_word: וַיִּבְזוּ עָלֵינוּ
  choice: at hinamak
  rationale: Pinananatili ang ikalawang, masidhing pahayag ng paglapastangan nang hindi inuulit nang di-likas ang panghalip na “kami.”
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים
  choice: Ano itong ginagawa ninyo?
  rationale: Natural na modernong Filipino na pinananatili ang tuwirang tanong at ang kasalukuyang kilos.
- source_word: הַעַל הַמֶּלֶךְ אַתֶּם מֹרְדִים
  choice: Naghihimagsik ba kayo laban sa hari?
  rationale: Pinananatili ang anyong maparatang na tanong, ang patuloy na kilos ng participle, at ang hari bilang pinatutungkulan ng paghihimagsik.
theological_decisions:
- issue: Kahulugan ng עֶבֶד sa katawagan kay Tobias
  choice: lingkod
  alternative: alipin; o katawagan sa isang opisyal
  rationale: Hindi tiyak sa parirala kung ang diin ay nasa pagkakaalipin, pangkalahatang paglilingkod, o isang opisyal na katungkulan. Ginagamit sa pangunahing teksto ang natural na “lingkod” at pinananatili sa talababa ang leksikal at kontekstuwal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga anyong pangalang Sanbalat, Tobias, at Gesem at ang mga katawagang Horonita, Ammonita, at Arabe upang maging madaling basahin habang nananatiling malapit sa Hebreo.
