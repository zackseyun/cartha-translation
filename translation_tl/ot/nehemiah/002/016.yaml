  to: Ngunit hindi alam ng mga opisyal kung saan ako pumunta o kung ano ang ginagawa ko, at hanggang noon ay hindi ko pa ipinaalam sa mga Judio[a], sa mga pari, sa mga maharlika, sa mga opisyal, o sa iba pang gumagawa ng gawain.
  rationale: Pinalitan ang hindi natural at diangkop na “hindi ko pa sinasabi” ng “hindi ko pa ipinaalam,” na mas mahusay na naghahayag ng hindi pa pagbubunyag hanggang noon. Pinasimple rin ang panandang panahon at nilinaw nang bahagya ang talababa, nang hindi binabago ang kahulugan o ang sinadyang ambigwidad ng יְהוּדִים.
