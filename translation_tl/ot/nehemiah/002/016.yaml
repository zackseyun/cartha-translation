base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/016.yaml
  text: But the officials did not know where I had gone or what I was doing[a], and until then I had not told the Jews, the priests, the nobles, the officials, or the rest who were doing the work.
translation:
  language: tl
  text: Ngunit hindi alam ng mga opisyal kung saan ako pumunta o kung ano ang ginagawa ko, at hanggang noon ay hindi ko pa ipinaalam sa mga Judio[a], sa mga pari, sa mga maharlika, sa mga opisyal, o sa iba pang gumagawa ng gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taga-Juda.” Maaaring tumukoy ang Hebreong יְהוּדִים sa mga naninirahan sa Juda o, sa mas malawak na diwa, sa pamayanang Judio.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּגָנִים
  choice: mga opisyal
  rationale: Tumutukoy ang salita sa mga pinunong nasa ilalim ng mas mataas na awtoridad o mga opisyal; malinaw ang “mga opisyal” sa makabagong Tagalog at hindi nito labis na tinutukoy ang isang tiyak na titulong Persiano.
- source_word: יָדְעוּ
  choice: hindi alam
  rationale: Ang qal ng ידע ay karaniwang nangangahulugang “malaman”; natural sa salaysay ang “hindi alam.”
- source_word: אָנה הָלַכְתִּי
  choice: kung saan ako pumunta
  rationale: Ipinahihiwatig ng אָנה ang patutunguhan. Natural at malinaw sa Tagalog ang “kung saan ako pumunta.”
- source_word: וּמָה אֲנִי עֹשֶׂה
  choice: o kung ano ang ginagawa ko
  rationale: Pinananatili ng “ginagawa ko” ang nagpapatuloy na diwa ng participle; ginawang “o” ang waw ayon sa natural na ayos ng magkaugnay na bagay na hindi nila alam.
- source_word: לַיְּהוּדִים
  choice: mga Judio
  rationale: Maaaring tumukoy ang יְהוּדִים sa mga Judio bilang sambayanan o sa mga taga-Juda; “mga Judio” ang karaniwan at malawak na nauunawaang tawag, habang itinatala sa talababa ang tunay na alternatibo.
- source_word: לַכֹּהֲנִים
  choice: mga pari
  rationale: Tuwirang katumbas ng כֹּהֲנִים sa kontekstong Israelita.
- source_word: לַחֹרִים
  choice: mga maharlika
  rationale: Sa panlipunan at administratibong kontekstong ito, tumutukoy ang חֹרִים sa mga taong marangal ang katayuan o kabilang sa namumunong uri.
- source_word: וּלְיֶתֶר עֹשֵׂה הַמְּלָאכָה
  choice: sa iba pang gumagawa ng gawain
  rationale: Ipinahahayag ng יֶתֶר ang mga nalalabi o iba pa, at pinananatili ng “gumagawa ng gawain” ang pandiwang diwa ng participle na may kolektibong saklaw.
- source_word: עַד כֵּן לֹא הִגַּדְתִּי
  choice: hanggang sa panahong iyon ay hindi ko pa sinasabi
  rationale: Ang עַד כֵּן ay temporal na “hanggang noon,” at ang hiphil ng נגד ay “sabihin” o “ipaalam.” Ang “hindi ko pa sinasabi” ay natural na Tagalog para sa impormasyong hindi pa ibinubunyag hanggang sa puntong iyon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Pinanatili ang listahan ng mga pangkat at ang pag-uulit ng “mga opisyal.” Ginamit ang “gawain” sa halip na “trabaho” upang tumugma sa dignidad ng salaysay nang hindi nagiging makaluma.
