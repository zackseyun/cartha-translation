    rationale: Maaaring resulta ng pagtatakda ang pagsasabi, ngunit ang pandiwa ay “nagbigay/nagtakda.” Ang “nagtakda ako ng panahon para sa kanya” ay mas malapit nang nananatiling likas sa Tagalog.
