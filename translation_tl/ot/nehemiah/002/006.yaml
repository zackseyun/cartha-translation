  source_fidelity: Karamihan ay tapat sa Hebreo. Gayunman, ang “payagan akong umalis” ay nagpapaliit sa וַיִּשְׁלָחֵנִי (“ipadala/isugo ako”) tungo sa pahintulot lamang. Ang pangwakas na sugnay ay mas wastong ihayag bilang pagtatakda ni Nehemias ng isang panahon para sa hari, sa halip na simpleng pagsasabi nito.
  naturalness: Natural at marangal ang daloy ng Tagalog. Ang “ipadala ako” ay natural sa kontekstong opisyal at mas malapit sa pandiwa ng pinagmulan. Ang “nagtakda ako ng panahon para sa kanya” ay malinaw at idiomatiko.
  terminology: Ang “reyna” ay angkop na pangunahing salin ng הַשֵּׁגַל; sapat na pinananatili ng talababa ang saklaw na “maharlikang kabiyak/asawa ng hari.”
