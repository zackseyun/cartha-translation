translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “reyna” bilang natural na katawagan, na may talababa para sa mas tiyak na leksikal na saklaw. Pinanatili ang tuwirang tanong at ang pormal na himig ng tagpo sa korte.
