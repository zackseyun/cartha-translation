base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/006.yaml
  text: Then the king said to me[a], while the queen was sitting beside him, “How long will your journey be, and when will you return?” So it pleased the king to send me, and I gave him a time.
translation:
  language: tl
  text: Sinabi sa akin ng hari, habang nakaupo sa tabi niya ang reyna[a], “Gaano katagal ang paglalakbay mo, at kailan ka babalik?” Minabuti ng hari na ipadala ako, at nagtakda ako ng panahon para sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maharlikang kabiyak” o “asawa ng hari.” Ang salitang Hebreo ay tumutukoy sa maharlikang kabiyak ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Karaniwan at tuwirang salin ng מֶלֶךְ sa konteksto ng salaysay.
- source_word: הַשֵּׁגַל
  choice: ang reyna
  rationale: Tumutukoy ang bihirang terminong ito sa maharlikang kabiyak ng hari. Pinakanatural sa modernong Tagalog ang “reyna,” habang inilalahad sa talababa ang mas tiyak na kahulugan.
- source_word: יוֹשֶׁבֶת אֶצְלוֹ
  choice: habang nakaupo sa tabi niya
  rationale: Pinananatili nito ang kasabay na pangyayaring ipinahihiwatig ng participle at ang kalapitan sa hari.
- source_word: עַד מָתַי יִהְיֶה מַהֲלָכֲךָ
  choice: Gaano katagal ang paglalakbay mo
  rationale: Natural na tanong sa Tagalog tungkol sa haba ng panahong gugugulin sa paglalakbay.
- source_word: וּמָתַי תָּשׁוּב
  choice: at kailan ka babalik
  rationale: Tuwirang ipinahahayag ang tanong tungkol sa pagbabalik.
- source_word: וַיִּיטַב לִפְנֵי הַמֶּלֶךְ
  choice: Minabuti ng hari
  rationale: Natural na katumbas ng Hebreong idyoma na nagsasaad ng pagsang-ayon o pagpayag ng hari.
- source_word: וַיִּשְׁלָחֵנִי
  choice: na payagan akong umalis
  rationale: Sa konteksto, ang ‘pagpapadala’ ay pahintulot ng hari sa pag-alis ni Nehemias para sa kaniyang misyon; malinaw at natural ito sa Tagalog nang hindi dinaragdagan ang layunin ng biyahe.
- source_word: וָאֶתְּנָה לוֹ זְמָן
  choice: sinabi ko sa kanya ang takdang panahon
  rationale: Ang literal na ‘nagbigay ako sa kaniya ng panahon’ ay di-likas sa Tagalog; ipinahihiwatig ng parirala na ipinaalam ni Nehemias ang tiyak o itinakdang haba ng panahon.
