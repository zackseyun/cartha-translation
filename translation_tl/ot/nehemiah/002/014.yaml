  naturalness: Natural at marangal ang “Tarangkahan ng Bukal” at “Tipunan ng Tubig ng Hari.” Mas malinaw at mas malapit sa pinagmulan ang “Ngunit walang lugar upang makaraan ang hayop na nasa ilalim ko.”
