  text: Then I went on to the Fountain Gate and to the King’s Pool[b][a], but there was no place for the animal under me to pass.
translation:
  language: tl
  text: Pagkatapos, nagpatuloy ako sa Tarangkahan ng Bukal at sa Tipunan ng Tubig ng Hari. Ngunit walang lugar upang makaraan ang hayop na nasa ilalim ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Sa literal, “ang hayop na nasa ilalim ko.” Tinutukoy nito ang hayop na sinasakyan ni Nehemias.
    reason: literal_wording
lexical_decisions:
- source_word: וָאֶעֱבֹר
  choice: Pagkatapos, nagpatuloy ako
  rationale: Ipinahihiwatig ng עבר ang pagpapatuloy ng paglalakbay sa inspeksiyon; natural sa makabagong Tagalog ang “nagpatuloy ako” nang hindi nagpapahiwatig ng tiyak na pagtawid.
- source_word: שַׁעַר הָעַיִן
  choice: Tarangkahan ng Bukal
  rationale: Sa kontekstong topograpikal, ang עַיִן ay bukal o fountain, hindi mata. Malinaw at dignified ang “Tarangkahan ng Bukal.”
- source_word: בְּרֵכַת הַמֶּלֶךְ
  choice: Tipunan ng Tubig ng Hari
  rationale: Ang בְּרֵכָה ay pool o reservoir. Iniiwasan ng “tipunan ng tubig” ang posibleng modernong kahulugan ng swimming pool at malinaw na tumutukoy sa imbakan o lawaang-gawa ng tubig.
- source_word: וְאֵין מָקוֹם
  choice: Ngunit walang madaanan
  rationale: Ang literal na kawalan ng lugar ay, sa konteksto, kawalan ng sapat na daanan. Ipinakikita ng “ngunit” ang hadlang sa patuloy na pagkilos.
- source_word: לַבְּהֵמָה
  choice: ang hayop
  rationale: Pangkalahatan ang בְּהֵמָה at hindi tinutukoy ang uri ng hayop; kaya pinananatili ang “hayop” sa halip na tukuying kabayo o asno.
- source_word: לַעֲבֹר תַּחְתָּי
  choice: na sinasakyan ko
  rationale: Literal itong “upang makaraan ang hayop na nasa ilalim ko.” Ang “na sinasakyan ko” ay natural sa Tagalog at tahasang naghahatid ng kahulugang ipinahihiwatig ng Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tarangkahan” para sa pinangalanang pasukan ng lungsod at “tipunan ng tubig” upang maging malinaw ang sinaunang kahulugan ng pool/reservoir. Pinanatili ang pangkalahatang “hayop” dahil hindi tinutukoy ng Hebreo ang uri nito.
