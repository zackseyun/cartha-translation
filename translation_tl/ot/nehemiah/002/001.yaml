base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/001.yaml
  text: And it happened in the month of Nisan[a], in the twentieth year of King Artaxerxes, when wine was before him, that I took up the wine and gave it to the king. Now I had not been sad in his presence.
translation:
  language: tl
  text: Nangyari ito noong buwan ng Nisan[a], sa ikadalawampung taon ni Haring Artaxerxes. Habang nasa harap niya ang alak, kinuha ko ang alak at ibinigay ko ito sa hari. Hindi pa ako naging malungkot sa harap niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Nisan ay buwan sa kalendaryong Babilonyo na karaniwang pumapatak bandang Marso–Abril.
    reason: historical_context
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Pinananatili ang karaniwang panimulang anyo ng salaysay sa Hebreo nang hindi gumagamit ng makalumang pananalita.
- source_word: בְּחֹדֶשׁ נִיסָן
  choice: nang buwan ng Nisan
  rationale: Pinananatili ang pormal na pagtukoy sa buwan at ang transliterasyon ng pantanging pangalan nito.
- source_word: שְׁנַת עֶשְׂרִים לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: sa ikadalawampung taon ni Haring Artaxerxes
  rationale: Likas na Filipino para sa pagtatakda ng petsa ayon sa taon ng paghahari.
- source_word: יַיִן לְפָנָיו
  choice: habang nasa harap niya ang alak
  rationale: Pinananatili ang tagpo sa palasyo at ang literal na 'nasa harap niya' nang hindi nagdaragdag ng kopang hindi binanggit sa Hebreo.
- source_word: וָאֶשָּׂא אֶת־הַיַּיִן
  choice: kinuha ko ang alak
  rationale: Ipinahahayag ang pagkuha o pagbuhat ng alak para ihain, ngunit hindi labis na tinutukoy ang sisidlan.
- source_word: וָאֶתְּנָה לַמֶּלֶךְ
  choice: at ibinigay iyon sa hari
  rationale: Tuwirang salin ng נתן, na ang tinutukoy ng panghalip ay ang alak sa naunang sugnay.
- source_word: וְלֹא הָיִיתִי רַע לְפָנָיו
  choice: Hindi pa ako dating mukhang malungkot sa harap niya
  rationale: Ang literal na 'hindi ako masama sa harap niya' ay idyomatikong tumutukoy sa malungkot o mabigat na anyo. Ang 'mukhang' ay nililinaw na panlabas na anyo sa presensiya ng hari ang usapan, at ang 'hindi pa... dating' ay naghahatid ng naunang kalagayan sa daloy ng salaysay.
