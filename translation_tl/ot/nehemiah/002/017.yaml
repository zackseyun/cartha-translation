  text: וָ/אוֹמַ֣ר אֲלֵ/הֶ֗ם אַתֶּ֤ם רֹאִים֙ הָ/רָעָה֙ אֲשֶׁ֣ר אֲנַ֣חְנוּ בָ֔/הּ אֲשֶׁ֤ר יְרוּשָׁלִַ֨ם֙ חֲרֵבָ֔ה וּ/שְׁעָרֶ֖י/הָ נִצְּת֣וּ בָ/אֵ֑שׁ לְכ֗וּ וְ/נִבְנֶה֙ אֶת חוֹמַ֣ת יְרוּשָׁלִַ֔ם וְ/לֹא נִהְיֶ֥ה ע֖וֹד חֶרְפָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/017.yaml
  text: 'Then I said to them[a], “You see the trouble we are in: Jerusalem lies in ruins, and its gates have been burned with fire. Come, let us rebuild the wall of Jerusalem[c][b], so that we may no longer be a reproach.”'
translation:
  language: tl
  text: 'Pagkatapos, sinabi ko sa kanila, “Nakikita ninyo ang kapighatiang[a] kinasasadlakan natin: wasak[b] ang Jerusalem, at tinupok ng apoy ang mga pintuan nito. Halikayo, muli nating itayo ang pader ng Jerusalem upang hindi na tayo maging tudlaan ng paghamak.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kagipitan,” “kapahamakan,” o “masaklap na kalagayan.” Ang salitang Hebreo ay maaaring tumukoy sa sakuna o paghihirap, hindi sa moral na kasamaan sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “guho” o “tiwangwang.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “upang hindi na tayo maging kahiya-hiya” o “maging isang kahihiyan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָה
  choice: ang kapighatian
  rationale: Sa kontekstong ito, tumutukoy ang רָעָה sa dinaranas na sakuna o mahirap na kalagayan ng pamayanan, hindi sa moral na kasamaan. Likas sa Filipino ang “kapighatian” at naipahahayag nito ang bigat ng kanilang kalagayan.
- source_word: אֲשֶׁר אֲנַחְנוּ בָהּ
  choice: kinasasadlakan natin
  rationale: Ipinahahayag ng idyoma ang kalagayang kasalukuyang dinaranas nila. Ang “kinasasadlakan natin” ay natural at nagpapanatili sa larawan ng pagiging nasa loob ng kapighatian.
- source_word: חֲרֵבָה
  choice: wasak
  rationale: Inilalarawan ng salita ang Jerusalem bilang winasak at iniwang guho. Ang “wasak” ay malinaw, tuwiran, at angkop sa pisikal na kalagayan ng lungsod.
- source_word: נִצְּתוּ בָאֵשׁ
  choice: tinupok ng apoy
  rationale: Pinananatili ng parirala ang tahasang pagbanggit sa apoy at natural na ipinahahayag sa Filipino ang pagkasunog at pagkawasak ng mga pintuan.
- source_word: לְכוּ
  choice: Halikayo
  rationale: Bagaman literal na maaaring mangahulugang “humayo,” ginagamit ito rito bilang panawagan sa sama-samang pagkilos. Ang “Halikayo” ay likas na paanyaya sa Filipino.
- source_word: וְנִבְנֶה
  choice: muli nating itayo
  rationale: 'Ang anyong cohortative ay nagpapahayag ng magkakasamang pagpapasya. Ang “muli” ay naaayon sa konteksto: dati nang naroon ang pader at kailangan itong ibalik.'
- source_word: חוֹמַת יְרוּשָׁלִַם
  choice: ang pader ng Jerusalem
  rationale: Tuwirang pinananatili nito ang ugnayang construct sa Hebreo at malinaw na tumutukoy sa muog na nakapalibot sa lungsod.
- source_word: וְלֹא נִהְיֶה עוֹד חֶרְפָּה
  choice: upang hindi na tayo maging tudlaan ng paghamak
  rationale: Ang חֶרְפָּה ay tumutukoy sa pampublikong kahihiyan, paghamak, o paglapastangan. Ipinakikita ng “tudlaan ng paghamak” na sila ang pinagtutuunan ng pangungutya, habang likas na ipinahahayag ng “upang” ang layunin o inaasahang bunga.
