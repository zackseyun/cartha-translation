translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang sama-samang panawagan ni Nehemias sa “Halikayo” at “nating,” gayundin ang pampublikong dimensiyon ng חֶרְפָּה sa “tudlaan ng paghamak.”
