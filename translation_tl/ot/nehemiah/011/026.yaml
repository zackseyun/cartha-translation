  yaml_path: translation/ot/nehemiah/011/026.yaml
  text: and in Jeshua[a], and in Moladah, and in Beth-pelet;
translation:
  language: tl
  text: at sa Jesua, at sa Molada, at sa Bet-pelet[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Bet-pelet ay literal na “bahay ni Pelet,” o maaaring “bahay ng pagtakas”; ngunit dahil pangalan ito ng lugar, isinalin ito sa pamamagitan ng transliterasyon sa halip na isalin ang kahulugan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ
  choice: at sa
  rationale: Ang inuulit na pangatnig na וּ at pang-ukol na בְ ay nagpapahayag ng magkakaugnay na talaan ng mga lugar at ng lokatibong diwa na “sa.” Inulit ang “at sa” upang mapanatili ang estruktura ng Hebreo.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Pangalan ito ng lugar sa kontekstong ito, kaya tinumbasan sa paraang transliterasyon at hindi isinalin ang kahulugan.
- source_word: מוֹלָדָה
  choice: Molada
  rationale: Pangalan ito ng lugar; ang “Molada” ay natural na transliterasyon sa Filipino ng anyong Hebreo.
- source_word: בֵית פָּלֶט
  choice: Bet-pelet
  rationale: Tambalang pangalan ito ng lugar. Pinanatili ito bilang transliterasyon sa halip na isalin, at ginamit ang gitling upang maging malinaw ang tambalang anyo.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na maikli at marangal, ayon sa anyo ng talaan. Inilipat ang marker [a] sa Bet-pelet, ang salitang aktuwal na ipinaliliwanag ng talababa; ang pagkakalagay nito pagkatapos ng Jeshua sa English consultation layer ay hindi tumutugma sa nilalaman ng talababa.
