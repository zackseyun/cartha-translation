translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang paulit-ulit na hulma ng talaangkanan upang tapat na maipakita ang estruktura ng Hebreo. Inilagay ang talababa sa “Silonita,” ang salitang aktuwal na may leksikal na alternatibo.
