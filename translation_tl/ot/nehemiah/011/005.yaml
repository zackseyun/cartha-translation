base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/005.yaml
  text: and Maaseiah son of Baruch[a], son of Col-hozeh, son of Hazaiah, son of Adaiah, son of Joiarib, son of Zechariah, son of the Shilonite.
translation:
  language: tl
  text: at si Maaseias, anak ni Baruc, anak ni Col-hoze, anak ni Hazaias, anak ni Adaias, anak ni Joiarib, anak ni Zacarias na Silonita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Selonita.” Ang katawagang Hebreo ay maaaring tumukoy sa kaugnayan sa Shilo o sa angkan ni Sela/Shilon ayon sa tradisyong pangangkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַעֲשֵׂיָה
  choice: at si Maaseias
  rationale: Pinanatili ang pang-ugnay na ו bilang “at” dahil nagpapatuloy ito sa talaan sa naunang talata. Isinalin sa baybay na madaling basahin sa Filipino ang pangalang Maaseias.
- source_word: בֶן
  choice: anak ni / anak ng
  rationale: Paulit-ulit na isinalin bilang “anak” upang mapanatili ang anyo ng hanay ng salinlahi. Ginamit ang “ni” bago ang mga personal na pangalan at “ng” bago ang katawagang Silonita.
- source_word: בָּרוּךְ
  choice: Baruc
  rationale: Ginamit ang nakasanayang anyong Filipino ng personal na pangalan.
- source_word: כָּל חֹזֶה
  choice: Col-hoze
  rationale: Itinuring itong tambalang personal na pangalan at hindi literal na parirala; ang baybay ay malapit sa anyong Hebreo habang nananatiling mababasa sa Filipino.
- source_word: חֲזָיָה
  choice: Hazaias
  rationale: Transliterasyon ng personal na pangalan sa anyong angkop sa Filipino.
- source_word: עֲדָיָה
  choice: Adaias
  rationale: Transliterasyon ng personal na pangalan sa anyong angkop sa Filipino.
- source_word: יוֹיָרִיב
  choice: Joiarib
  rationale: Pinanatili ang maikling anyong tumutugma sa baybay ng pangalang Hebreo sa talata, sa halip na palawakin ito bilang Jehoiarib.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Ginamit ang nakasanayang anyong Filipino ng pangalang biblikal.
- source_word: הַ/שִּׁלֹנִי
  choice: ang Silonita
  rationale: Ang anyong nisbe na may pantukoy ay tumutukoy sa kaugnayan sa isang lugar o angkan. Pinanatili ang katawagang “Silonita” sa pangunahing teksto upang hindi paglasyahan kung Shilo o angkan ni Sela/Shilon ang tinutukoy.
