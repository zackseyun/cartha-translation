  yaml_path: translation/ot/nehemiah/011/036.yaml
  text: And from the Levites[a], divisions in Judah belonged to Benjamin.
translation:
  language: tl
  text: At mula sa mga Levita[a], ang mga pangkat sa Juda ay para sa Benjamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “At mula sa mga Levita, ang mga pangkat ng Juda ay para sa Benjamin.” Napakasiksik ng Hebreo, at hindi tahasang sinasabi ang eksaktong ugnayan ng “Juda” at “Benjamin.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן
  choice: At mula sa
  rationale: Pinananatili ang pang-ugnay at ang diwang pinagmulan o pagkakaugnay ng pang-ukol, habang iniuugnay ang talata sa naunang talaan.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Tuwirang tawag ito sa mga kabilang sa lipi ni Levi at natural sa makabagong Tagalog.
- source_word: מַחְלְקוֹת
  choice: mga pangkat
  rationale: Ipinahihiwatig ng salita ang mga dibisyon o nakatalagang pangkat; mas madaling maunawaan sa Tagalog ang “mga pangkat” nang hindi labis na tinutukoy ang uri ng organisasyon.
- source_word: יְהוּדָה
  choice: sa Juda
  rationale: Pinananatili ang posibleng lokatibong ugnayan—mga pangkat na nasa Juda—ngunit hindi itinatago na siksik at eliptikal ang Hebreo.
- source_word: לְבִנְיָמִין
  choice: ay para sa Benjamin
  rationale: Ang לְ ay nagpapahayag ng ugnayan o pagtatalaga. Ang “para sa Benjamin” ay mas malapit sa anyo ng Hebreo at hindi tiyak na nagpapasya kung pag-aari, pagkakatalaga, o pagkakaugnay ang tinutukoy.
