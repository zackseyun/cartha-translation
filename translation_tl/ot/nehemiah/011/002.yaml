  text: And the people blessed all the men who willingly offered themselves to live in Jerusalem[a].
translation:
  language: tl
  text: At pinagpala ng bayan ang lahat ng lalaking kusang-loob na nag-alok ng sarili upang manirahan sa Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lahat ng lalaking nagboluntaryong manirahan sa Jerusalem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: pinagpala
  rationale: Pinananatili nito ang karaniwang kahulugan ng piel ng ברך na ‘pagpalain.’ Yamang mga tao ang layon, tumutukoy ito sa pagpapahayag ng pagpapala o pagsang-ayon sa kanila, hindi lamang sa pagpuri.
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang עם ay kolektibong tawag sa sambayanan. Ang ‘bayan’ ay natural at marangal sa kontekstong ito.
- source_word: לְכֹל הָאֲנָשִׁים
  choice: ang lahat ng lalaking
  rationale: Ang אֲנָשִׁים ay tahasang panlalaking pangngalan dito. Pinananatili ng ‘mga lalaki’ ang kasariang ipinahahayag ng Hebreo sa halip na gawing pangkalahatan.
- source_word: הַמִּתְנַדְּבִים
  choice: kusang-loob na naghandog ng kanilang sarili
  rationale: Ipinahahayag ng hitpael ng נדב ang malayang pagkukusa at ang pagbibigay ng sarili. Mas lubos itong naihahatid ng pariralang ito kaysa sa payak na ‘nagboluntaryo.’
- source_word: לָשֶׁבֶת
  choice: upang manirahan
  rationale: Sa konteksto ng paninirahan sa Jerusalem, natural na katumbas ng ישב ang ‘manirahan’; ipinahahayag din ng ‘upang’ ang layunin ng infinitive.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Karaniwang lokatibong salin ng pangalan ng lugar.
theological_decisions:
- issue: Kasariang ipinahahayag ng הָאֲנָשִׁים
  choice: lahat ng lalaking
  alternative: lahat ng tao / lahat
  rationale: Gumagamit ang Hebreo ng panlalaking pangngalang אֲנָשִׁים, kaya pinanatili ang tiyak na panlalaking pagtukoy nang hindi ito ginagawang pangkalahatan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘kusang-loob na naghandog ng kanilang sarili’ upang mapanatili ang reflexive at boluntaryong diwa ng Hebreo; ang talababa ay nagbibigay ng mas maikli at karaniwang alternatibo.
