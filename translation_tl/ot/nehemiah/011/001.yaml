base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/001.yaml
  text: The officials of the people lived in Jerusalem[a], and the rest of the people cast lots to bring one out of ten to live in Jerusalem, the holy city, while nine parts remained in the towns.
translation:
  language: tl
  text: Nanirahan sa Jerusalem ang mga pinuno ng bayan, at nagpalabunutan ang iba pang mga mamamayan upang pumili ng isa sa bawat sampu na maninirahan sa Jerusalem, ang banal na lungsod, samantalang ang siyam na bahagi ay nanatili sa ibang mga bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, literal na “at ang siyam na kamay sa mga bayan.” Ang “kamay” dito ay isang idyoma para sa bahagi: ang natitirang siyam na bahagi sa bawat sampu ay nanatili sa ibang mga bayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הָעָם
  choice: mga pinuno ng bayan
  rationale: Saklaw ng שָׂרִים ang mga pinuno o opisyal. Natural at marangal sa Filipino ang “mga pinuno,” at hindi ito nag-aangkat ng monarkikal na diwa ng “mga prinsipe.”
- source_word: וַיֵּשְׁבוּ
  choice: nanirahan
  rationale: Ang ישׁב dito ay tumutukoy sa paninirahan, hindi sa literal na pag-upo. Ang “nanirahan” ay malinaw at angkop sa konteksto.
- source_word: וּשְׁאָר הָעָם
  choice: ang iba pang mga mamamayan
  rationale: Ipinahahayag nito ang natitirang bahagi ng bayan sa natural na modernong Filipino; iniiwasan din nito ang maaaring malabong pag-uulit ng “bayan” bilang lugar.
- source_word: הִפִּילוּ גוֹרָלוֹת
  choice: nagpalabunutan
  rationale: Ito ang natural na idyomang Filipino para sa pagpili sa pamamagitan ng lots, nang hindi tinutukoy ang eksaktong pisikal na anyo ng mga ito.
- source_word: לְהָבִיא
  choice: upang dalhin
  rationale: Ang Hiphil ng בוא ay causative, kaya pinananatili ng “dalhin” ang ideyang papuntahin o ipasok sa Jerusalem ang mga napili.
- source_word: אֶחָד מִן הָעֲשָׂרָה
  choice: ang isa sa bawat sampu
  rationale: Malinaw nitong ipinapakita ang proporsiyonal at distributibong pagpili.
- source_word: לָשֶׁבֶת
  choice: manirahan
  rationale: Muling tumutukoy ang ישׁב sa paninirahan. Ang anyong “manirahan” ay kasalukuyan at madaling maunawaan.
- source_word: עִיר הַקֹּדֶשׁ
  choice: ang banal na lungsod
  rationale: Tuwirang katumbas ito ng construct phrase at nagpapanatili sa tradisyonal ngunit kasalukuyang wikang biblikal.
- source_word: וְתֵשַׁע הַיָּדוֹת
  choice: samantalang ang siyam na bahagi ay manatili
  rationale: Ang literal na “siyam na kamay” ay isang idyoma para sa siyam na bahagi. Ang “siyam na bahagi” ay nagpapanatili sa larawan ng paghahati nang hindi labis na nagpapaliwanag sa pangunahing teksto.
- source_word: בֶּעָרִים
  choice: sa ibang mga bayan
  rationale: Maaaring tumukoy ang עָרִים sa mga lungsod o bayan. Ang “mga bayan” ay natural sa konteksto ng ibang pamayanan ng Juda, at idinagdag ang “ibang” upang luminaw ang pagsalungat sa Jerusalem.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga pinuno” sa halip na arkaikong “mga prinsipe,” at “nagpalabunutan” bilang natural na katumbas ng Hebreong idyoma. Inilipat ang pananda ng talababa sa hulihan ng pangungusap dahil ipinaliliwanag nito ang “siyam na bahagi,” hindi ang unang pagbanggit sa Jerusalem.
