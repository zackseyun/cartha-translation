  verdict: revise
  source_fidelity: Tumpak ang pangunahing kahulugan, kabilang ang paninirahan ng mga pinuno, palabunutan ng natitirang mamamayan, at ang proporsiyong isa sa sampu. Gayunman, ang kasalukuyang “upang dalhin ... ang isa” ay hindi natural ang ayos at hindi malinaw na ang napili ay maninirahan sa Jerusalem. Ang “ay manatili” ay hindi rin wastong anyong pandiwa para sa natapos na kilos na inilalarawan ng talata.
  naturalness: Marangal at modernong Filipino ang karamihan ng mga salita. Ang “nagpalabunutan” at “mga pinuno ng bayan” ay natural. Kailangan lamang ayusin ang sugnay ng layunin at gawing ganap ang pandiwa sa huling sugnay.
  terminology: Ang “banal na lungsod,” “mga pinuno,” “mga mamamayan,” at “mga bayan” ay angkop. Ang talababa ay wastong nagpapaliwanag sa Hebreong idyoma at nakatali sa “siyam na bahagi.”
  issues:
