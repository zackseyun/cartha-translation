    rationale: Ang לְהָבִיא ay causative (“upang dalhin/papuntahin”), at ang לָשֶׁבֶת ay nagsasaad ng layuning manirahan. Dapat malinaw na ang isa sa bawat sampu ay siyang pinili upang manirahan sa Jerusalem.
  - severity: medium
    issue: Hindi angkop ang “samantalang ang siyam na bahagi ay manatili.”
    rationale: Ang pangunahing pandiwa ay nakaraang pangyayari; kailangan ang “nanatili” upang maging kumpleto at idiomatiko ang sugnay.
