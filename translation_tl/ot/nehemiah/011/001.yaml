revisions:
- from: Nanirahan sa Jerusalem ang mga pinuno ng bayan. Nagpalabunutan naman ang iba pang mga mamamayan upang dalhin sa Jerusalem, ang banal na lungsod, ang isa sa bawat sampu, samantalang ang siyam na bahagi ay manatili sa ibang mga bayan.[a]
  to: Nanirahan sa Jerusalem ang mga pinuno ng bayan, at nagpalabunutan ang iba pang mga mamamayan upang pumili ng isa sa bawat sampu na maninirahan sa Jerusalem, ang banal na lungsod, samantalang ang siyam na bahagi ay nanatili sa ibang mga bayan.[a]
  rationale: Inayos ang ayos ng pangungusap upang malinaw na ang palabunutan ay pagpili ng isa sa bawat sampu para manirahan sa Jerusalem. Pinalitan ang infinitive na “manatili” ng “nanatili,” alinsunod sa aspekto ng salaysay. Napanatili ang proporsiyonal na idyoma sa pangunahing teksto at ang literal na larawan nito sa talababa.
