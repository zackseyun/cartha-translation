translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang genealogical na “mga anak” sa halip na gawing “mga mamamayan,” at ginamit ang paulit-ulit na “anak ni” upang sundan ang estruktura ng Hebreo.
