  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: paninirahan sa Jerusalem ng mga kabilang sa Juda at Benjamin, kasunod ang talaangkanan ni Ataias. Gayunman, ang pangwakas na "mula sa mga anak ni Perez" ay hindi likas na pagkakabit sa Tagalog at maaaring magmukhang literal na pinagmulan mula sa mga anak ni Perez, sa halip na pagtukoy sa angkan o lipi ni Perez.'
  naturalness: Mas natural sa modernong Filipino ang "mga inapo" para sa pantribong gamit ng בני, at ang "na mula sa angkan ni Perez" upang malinaw na ikabit ang pangwakas na parirala sa talaangkanan. Ang paulit-ulit na "anak ni" ay pinanatili para sa genealogical na anyo.
  terminology: 'Pinanatili ang Jerusalem at ang mga nakagawiang anyong Filipino ng mga pangalan: Ataias, Uzias, Zacarias, Amarias, Sefatias, Mahalalel, at Perez. Ang "angkan" ay angkop para sa בני־פרץ sa kontekstong ito.'
