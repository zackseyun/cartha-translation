base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/004.yaml
  text: 'And in Jerusalem there lived some of the sons of Judah and some of the sons of Benjamin[a]. Of the sons of Judah: Athaiah son of Uzziah, son of Zechariah, son of Amariah, son of Shephatiah, son of Mahalalel[b], of the sons of Perez.'
translation:
  language: tl
  text: At sa Jerusalem ay nanirahan ang ilan sa mga inapo ni Juda at ilan sa mga inapo ni Benjamin.[a] Sa mga inapo ni Juda ay si Ataias, anak ni Uzias, anak ni Zacarias, anak ni Amarias, anak ni Sefatias, anak ni Mahalalel,[b] na mula sa angkan ni Perez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga inapo ni Juda” at “mga inapo ni Benjamin” ay tumutukoy rito sa mga kabilang sa o nagmula sa mga angkan ng dalawang tribo.
    reason: cultural_note
  - marker: b
    text: Maaaring tumukoy ang “anak ni” sa tuwirang anak o sa isang inapo sa talaangkanan.
    reason: genealogical_ambiguity
lexical_decisions:
- source_word: וּבִירוּשָׁלַם
  choice: At sa Jerusalem
  rationale: Pinananatili ng “At” ang ugnayan sa naunang konteksto, habang likas sa Tagalog ang pariralang panlunan.
- source_word: יָשְׁבוּ
  choice: ay nanirahan
  rationale: Ipinahahayag nito ang paninirahan o pagtahan nang natural at hindi makaluma; hindi nito ipinipilit ang mas tiyak na diwang “namalagi” o “nanatili.”
- source_word: מִבְּנֵי יְהוּדָה וּמִבְּנֵי בִנְיָמִן
  choice: ang ilan sa mga anak ni Juda at ang ilan sa mga anak ni Benjamin
  rationale: Ang “ilan sa” ay naghahayag ng partitive na מִן, at pinananatili ng “mga anak” ang anyong pangangkan at pantribo ng בְּנֵי.
- source_word: עֲתָיָה
  choice: Ataias
  rationale: Ginamit ang anyong pangalan na angkop sa nakagawiang Filipino biblical transliteration.
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang tuwirang at likas na salin sa talaangkanan; hindi nilulutas kung may nilaktawang salinlahi ang genealogical na hanay.
- source_word: עֻזִּיָּה / זְכַרְיָה / אֲמַרְיָה / שְׁפַטְיָה / מַהֲלַלְאֵל / פָרֶץ
  choice: Uzias / Zacarias / Amarias / Sefatias / Mahalalel / Perez
  rationale: Mga anyong transliterasyon na pamilyar at madaling basahin sa modernong Filipino habang kinikilala ang mga pangalang Hebreo.
