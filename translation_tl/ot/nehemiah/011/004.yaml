revisions:
- from: 'At sa Jerusalem ay nanirahan ang ilan sa mga anak ni Juda at ang ilan sa mga anak ni Benjamin.[a] Sa mga anak ni Juda: si Ataias na anak ni Uzias, na anak ni Zacarias, na anak ni Amarias, na anak ni Sefatias, na anak ni Mahalalel, mula sa mga anak ni Perez.[b]'
  to: At sa Jerusalem ay nanirahan ang ilan sa mga inapo ni Juda at ilan sa mga inapo ni Benjamin.[a] Sa mga inapo ni Juda ay si Ataias, anak ni Uzias, anak ni Zacarias, anak ni Amarias, anak ni Sefatias, anak ni Mahalalel,[b] na mula sa angkan ni Perez.
  rationale: Inayos ang pantribong pananalita at ang pagkakabit ng pangwakas na pariralang Hebreo upang maging malinaw at likas sa modernong Filipino. Pinanatili ang partitive na "ilan," ang ugnayang "At," ang genealogical na pag-uulit ng "anak ni," at ang hindi pagtukoy nang lampas sa teksto kung tuwirang ama-anak ang bawat ugnayan.
