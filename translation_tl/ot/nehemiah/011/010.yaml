  text: 'Mula sa mga pari: si Jedaias na anak ni Joiarib, si Jakin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן הַכֹּהֲנִים
  choice: Mula sa mga pari
  rationale: Tuwirang inililipat ang pambungad na pariralang nagpapakilala sa mga kabilang sa pangkat ng mga pari.
- source_word: יְדַעְיָה
  choice: Jedaias
  rationale: Karaniwang anyong Tagalog ng pangalang Jedaiah, na umaayon sa bigkas ng Hebreo.
- source_word: בֶן יוֹיָרִיב
  choice: na anak ni Joiarib
  rationale: Natural na Tagalog para sa ugnayang ipinahahayag ng Hebreong ben.
- source_word: יָכִין
  choice: Jakin
  rationale: Transliterasyong malapit sa Hebreong Yakhin at naaayon sa pinakahuling adjudikasyong ibinigay.
theological_decisions:
- issue: Ugnayan ni Jakin sa naunang pangalan
  choice: Tinukoy si Jakin bilang hiwalay na pangalan sa talaan sa pamamagitan ng “at si.”
  alternative: Basahin ang “Jakin” bilang karagdagang pangalan o katawagan ni Jedaias.
  rationale: Walang tahasang pang-ugnay sa Hebreo, gaya ng karaniwan sa maiikling talaan ng mga pangalan; pinananatili ng salin ang pinaka-natural na pagbasa sa konteksto nang hindi nagdaragdag ng teolohikal na interpretasyon.
translation_notes:
  register: Maikli, marangal, at natural na modernong Tagalog. Ginamit ang “si” at “ni” upang luminaw ang mga pangalang pantangi at ang ugnayang mag-ama.
