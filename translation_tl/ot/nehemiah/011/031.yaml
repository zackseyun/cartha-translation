  yaml_path: translation/ot/nehemiah/011/031.yaml
  text: And the sons of Benjamin were from Geba[a], Michmash, Aijah, and Bethel and its villages.
translation:
  language: tl
  text: 'At ang mga anak ni Benjamin ay mula sa Geba: Micmas, Aya[a], Bethel, at mga nayon nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ai” sa halip na “Aya.” Ang anyong Hebreo rito ay עַיָּה, na maaaring tumukoy sa lugar ding iyon o sa isang malapit na kaugnay na pangalan ng lugar ayon sa tradisyon ng pagsasalin.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: At ang mga anak ni Benjamin
  rationale: Pinananatili ang literal na anyong “mga anak ni Benjamin,” na sa konteksto ng talaan ng mga pamayanan ay tumutukoy sa mga kabilang o mga inapo ng lipi ni Benjamin.
- source_word: מִגָּבַע
  choice: ay mula sa Geba
  rationale: Ang מִן ay nagpapahiwatig ng pinagmulan o panimulang lugar sa talaan; idinagdag ang “ay” upang maging likas ang pangungusap sa Tagalog.
- source_word: מִכְמָשׂ
  choice: Micmas
  rationale: Transliterasyon ng pangalan ng lugar sa paraang madaling basahin sa modernong Filipino.
- source_word: וְעַיָּה
  choice: Aya[a]
  rationale: Kinakatawan ng “Aya” ang anyong Hebreo na עַיָּה; inilalagay sa talababa ang posibleng alternatibong “Ai” upang mapanatili ang pagkakaiba sa tradisyon ng pagsasalin.
- source_word: וּבֵית אֵל
  choice: Bethel
  rationale: Karaniwang anyo sa Filipino ng pangalan ng lugar na בֵּית אֵל.
- source_word: וּבְנֹתֶיהָ
  choice: at sa mga nayon nito
  rationale: Literal itong “at ang mga anak na babae nito,” ngunit isang idyoma para sa mga nakapaligid o nasasakupang pamayanan. Nililinaw ng “mga nayon nito” ang kahulugan sa natural na Tagalog.
