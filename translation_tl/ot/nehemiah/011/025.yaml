language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶל הַ/חֲצֵרִ֖ים בִּ/שְׂדֹתָ֑/ם מִ/בְּנֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ בְּ/קִרְיַ֤ת הָֽאַרְבַּע֙ וּ/בְנֹתֶ֔י/הָ וּ/בְ/דִיבֹן֙ וּ/בְנֹתֶ֔י/הָ וּ/בִֽ/יקַּבְצְאֵ֖ל וַ/חֲצֵרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/025.yaml
  text: As for the villages in their fields[a], some of the sons of Judah lived in Kiriath-arba and its villages, and in Dibon and its villages[c][b], and in Jekabzeel and its settlements.
translation:
  language: tl
  text: Tungkol naman sa mga nayon sa kanilang mga bukirin, ang ilan sa mga anak ni Juda ay nanirahan sa Kiriat-arba[a] at sa mga nayong sakop nito[b], sa Dibon at sa mga nayong sakop nito, at sa Jekabzeel[c] at sa mga pamayanang sakop nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Kiriat-arba ay dating pangalan ng Hebron; ihambing sa Josue 14:15.
    reason: cross_reference
  - marker: b
    text: Sa Hebreo, “mga anak na babae nito,” isang idyoma para sa mga nayon na nakapaligid o sakop ng isang bayan.
    reason: lexical_alternative
  - marker: c
    text: Ang Jekabzeel ay tinatawag ding “Kabzeel” sa ilang kaugnay na tradisyon at talata.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶל הַחֲצֵרִים בִּשְׂדֹתָם
  choice: Tungkol naman sa mga nayon sa kanilang mga bukirin
  rationale: Ang וְאֶל ay nagsisilbing paglipat sa bagong bahagi ng talaan, kaya natural ang “Tungkol naman sa.” Sa kontekstong heograpikal, ang חֲצֵרִים ay maliliit na pamayanang rural, at pinananatili ng “sa kanilang mga bukirin” ang agraryong diwa ng בִּשְׂדֹתָם.
- source_word: מִבְּנֵי יְהוּדָה
  choice: ang ilan sa mga anak ni Juda
  rationale: Ipinahahayag ng “ang ilan sa” ang partitive na puwersa ng מִן, habang pinananatili ng “mga anak ni Juda” ang pormang pantribo ng Hebreo.
- source_word: יָשְׁבוּ
  choice: ay nanirahan
  rationale: Natural at kasalukuyang Tagalog ito para sa paninirahan, nang hindi ipinahihiwatig na sila ang unang nagtatag ng mga lugar.
- source_word: בְּקִרְיַת הָאַרְבַּע
  choice: sa Kiriat-arba
  rationale: Isinalin sa baybay-Tagalog ang pangalang-pook; ang pagkakakilanlan nito bilang Hebron ay inilagay sa talababa sa halip na idagdag sa talata.
- source_word: וּבְנֹתֶיהָ
  choice: at sa mga nayong sakop nito
  rationale: Ang literal na “mga anak na babae nito” ay isang idyoma para sa mga nakapaligid o nakadependeng nayon. Ang “mga nayong sakop nito” ay malinaw at natural habang pinananatili ang ugnayang administratibo.
- source_word: וּבְדִיבוֹן
  choice: sa Dibon
  rationale: Pangalang-pook na isinalin sa karaniwang transliterasyong Filipino.
- source_word: וּבִיקַּבְצְאֵל
  choice: sa Jekabzeel
  rationale: Sinusunod ng anyong Jekabzeel ang tekstong Masoretiko; ang kaugnay na anyong Kabzeel ay itinala bilang alternatibo.
- source_word: וַחֲצֵרֶיהָ
  choice: at sa mga pamayanang sakop nito
  rationale: Tumutukoy muli ang חֲצֵרִים sa mga nakadependeng rural na tirahan; ang “mga pamayanang sakop nito” ay inihihiwalay ito sa idyomang “mga nayon” na ginamit para sa בְּנֹתֶיהָ.
theological_decisions:
- issue: May kasariang katawagang pantribo sa מִבְּנֵי יְהוּדָה
  choice: ang ilan sa mga anak ni Juda
  alternative: ang ilan sa mga mamamayan ng Juda
  rationale: Pinananatili ang Hebreong katawagang “mga anak ni Juda” bilang tradisyonal na pagtukoy sa lipi, nang hindi nagpapasya na mga lalaki lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Tungkol naman sa” upang markahan ang paglipat ng paksa, at “sakop nito” upang natural na ipahayag ang ugnayan ng pangunahing bayan at ng mga nakadependeng nayon o pamayanan. Ang lahat ng marker na [a], [b], at [c] ay nasa pangunahing teksto.
