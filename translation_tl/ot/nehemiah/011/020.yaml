  text: וּ/שְׁאָ֨ר יִשְׂרָאֵ֜ל הַ/כֹּהֲנִ֤ים הַ/לְוִיִּם֙ בְּ/כָל עָרֵ֣י יְהוּדָ֔ה אִ֖ישׁ בְּ/נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/020.yaml
  text: And the rest of Israel[a], the priests, and the Levites were in all the cities of Judah, each in his inheritance.
translation:
  language: tl
  text: At ang iba pang mga Israelita, ang mga pari, at ang mga Levita ay nasa lahat ng lunsod ng Juda, bawat isa sa kanyang minanang lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na nasa isahan at distributibo ang Hebreo: “bawat lalaki sa kanyang minanang lupain.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר יִשְׂרָאֵל
  choice: At ang iba pang mga Israelita
  rationale: Ang שְׁאָר ay tumutukoy sa mga natitira o iba pa. Sa konteksto, likas sa modernong Tagalog ang “iba pang mga Israelita” at malinaw na tumutukoy sa mga hindi kabilang sa mga naunang itinalang nanirahan sa Jerusalem.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwang salin ng כֹּהֲנִים para sa pangkat na may tungkuling pangpari.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang tawag sa Tagalog sa mga kabilang sa lipi o pangkat ni Levi.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: sa lahat ng lunsod ng Juda
  rationale: Lokasyonal ang בְּ; tuwirang ipinahahayag ng parirala na sila ay nasa iba't ibang lunsod sa buong Juda. Pinili ang “lunsod” bilang dignified at madaling maunawaang katumbas ng עָרִים.
- source_word: אִישׁ
  choice: bawat isa
  rationale: Bagaman literal na “lalaki” ang אִישׁ, distributibo ang gamit nito rito. Ang “bawat isa” ay natural sa Tagalog at pinananatili ang indibiduwal na diwa nang hindi dinaragdagan ang tahasang pagtukoy sa kasarian.
- source_word: בְּנַחֲלָתוֹ
  choice: sa sarili niyang minanang lupain
  rationale: Ang נַחֲלָה ay minanang pag-aari o bahaging lupa na inilaan. Pinananatili ng “minanang lupain” ang mahalagang diwa ng pamana at lupain, samantalang ipinahahayag ng “sarili niyang” ang panlalaking isahang hulapi at ang distributibong pagkakaugnay nito sa אִישׁ.
theological_decisions:
- issue: Distributibong panlalaking isahan sa אִישׁ בְּנַחֲלָתוֹ
  choice: bawat isa sa sarili niyang minanang lupain
  alternative: bawat lalaki sa kanyang mana
  rationale: Pinananatili ng salin ang distributibong isahan at ang panlalaking panghalip ng Hebreo, ngunit ginagamit ang mas likas na “bawat isa” sa halip na ang mas literal at mas mabigat na “bawat lalaki.” Hindi nito ginagawang maramihan o neutral ang isahang hulapi.
- issue: Saklaw ng “Israel” kaugnay ng mga pari at Levita
  choice: ang iba pang mga Israelita, ang mga pari, at ang mga Levita
  alternative: ang nalabi sa Israel—ang mga pari at ang mga Levita
  rationale: Ang pagkakasunod at apposition sa Hebreo ay maaaring basahin bilang magkakaugnay na pangkat, ngunit pinaka-natural na ipinapakita ng listahan ang iba pang Israelita kasama ng mga pari at Levita. Hindi ginamit ang gatlang na maaaring magpahiwatig na ang mga pari at Levita lamang ang paliwanag sa “iba pang Israelita.”
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “nanirahan” upang maging ganap at natural ang sugnay na walang tahasang pandiwa sa Hebreo; ipinahihiwatig ng konteksto ang paninirahan. Pinanatili ang “Juda,” “Israelita,” at “Levita” bilang karaniwang katawagang biblikal.
