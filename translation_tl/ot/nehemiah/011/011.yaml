  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שְׂרָיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖ד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/011.yaml
  text: Seraiah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub[b], leader of the house of God.
translation:
  language: tl
  text: Si Seraias na anak ni Hilkias, na anak ni Mesulam, na anak ni Zadok, na anak ni Meraiot, na anak ni Ahitub, ang pinuno[a] ng bahay ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “punong tagapangasiwa” o “tagapangasiwa.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang templo.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂרָיָה
  choice: Seraias
  rationale: Pangalan ng tao; ginamit ang karaniwang anyong Filipino sa mga salin ng Bibliya.
- source_word: בֶן
  choice: anak ni
  rationale: Ito ang natural na katumbas ng paulit-ulit na pormulang pangangkanan. Bagaman maaaring tumukoy kung minsan sa isang inapo, walang sapat na dahilan dito upang palawakin ang kahulugan.
- source_word: נְגִיד
  choice: pinuno
  rationale: Tumutukoy sa taong inilagay sa pamamahala. Malinaw at likas sa modernong Filipino ang “pinuno” at hindi nito ipinahihiwatig ang maharlikang kapangyarihang maaaring ikabit sa “tagapamahala” o “hari.”
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pinananatili ang literal at malinaw na larawang “bahay ng Diyos,” habang ipinapaliwanag sa talababa na ang tinutukoy ay ang templo.
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Sa pariralang ito, tumutukoy ang אֱלֹהִים sa Diyos ng Israel, kaya ang pang-isahang “Diyos” ang angkop.
theological_decisions: []
translation_notes:
  register: 'Makabago, dignidad, at madaling maunawaang Filipino. Pinanatili ang sunod-sunod na “anak ni” upang maipakita ang anyo ng talaangkanan sa Hebreo. Inilagay ang mga talababa sa mga salitang talagang tinutukoy ng mga ito: [a] pagkatapos ng “pinuno” at [b] pagkatapos ng “bahay ng Diyos.”'
