  source_fidelity: 'Tumpak na isinalin ang talaangkanan: ang bawat בֶן ay napanatiling “anak ni,” at ang pangwakas na נְגִיד בֵּית הָאֱלֹהִים ay wastong “ang pinuno ng bahay ng Diyos.” Hindi pinalawak ang “anak” tungo sa “inapo,” at napanatili ang literal na “bahay ng Diyos,” na may angkop na paliwanag tungkol sa templo.'
