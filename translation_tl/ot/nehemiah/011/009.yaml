  source_fidelity: 'Tumpak ang pangunahing diwa ng salin: si Joel ay may tungkuling mangasiwa sa isang pangkat, at si Juda ay nasa ikalawang ranggo ng pamamahala sa lungsod. Gayunman, ang “tagapangasiwa nila” ay maaaring basahing tagapangasiwang pag-aari nila sa halip na tagapangasiwa na may awtoridad sa kanila. Mas tuwirang tinutumbasan ng “tagapangasiwa sa kanila” ang עֲלֵיהֶם.'
  naturalness: Natural at angkop ang register ng “tagapangasiwa” at “lungsod.” Ang “ikalawang namamahala” ay mas idiomatiko at malinaw na ranggo kaysa “pangalawang namamahala,” habang hindi ipinipilit ang mas tiyak na katungkulang gaya ng alkalde o opisyal-militar.
  terminology: Ang “tagapangasiwa” ay angkop para sa פָּקִיד. Ang “ikalawang namamahala” ay pinananatiling bukás ang saklaw ng מִשְׁנֶה (maaaring deputy o second in command). Ang mga pangalang “Joel,” “Zicri,” “Juda,” at “Hasenua” ay katanggap-tanggap na mga anyong Tagalog ng mga pangalan.
