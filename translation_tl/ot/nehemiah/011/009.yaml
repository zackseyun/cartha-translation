base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/009.yaml
  text: And Joel son of Zichri was overseer over them[a], and Judah son of Hassenuah was second over the city.
translation:
  language: tl
  text: Si Joel na anak ni Zicri ay tagapangasiwa sa kanila, at si Juda na anak ni Hasenua ay ikalawang namamahala[a] sa lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kinatawang namamahala sa lungsod” o “ikalawa sa pamamahala ng lungsod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקִיד
  choice: tagapangasiwa
  rationale: Tumutukoy ang salita sa isang taong itinalaga upang mangasiwa o mamahala; natural sa modernong Filipino ang “tagapangasiwa” at hindi nito labis na nililimitahan ang tungkulin bilang militar o maharlikang opisyal.
- source_word: עֲלֵיהֶם
  choice: nila
  rationale: Ipinahihiwatig ng pariralang Hebreo ang awtoridad o pangangasiwa sa kanila. Sa pariralang “tagapangasiwa nila,” malinaw at natural sa Filipino ang ugnayang ito.
- source_word: מִשְׁנֶה
  choice: pangalawang namamahala
  rationale: Nagsasaad ito ng ikalawang ranggo o kinatawang opisyal. Nililinaw ng “pangalawang namamahala” ang ranggo habang hindi tinutukoy nang higit sa pinagmulan ang eksaktong uri ng katungkulan.
- source_word: עַל הָעִיר
  choice: sa lungsod
  rationale: Sa kontekstong administratibo, tumutukoy ito sa saklaw ng pananagutan. Kasama ng “namamahala,” natural na ipinapahayag ng “sa lungsod” ang hurisdiksiyon.
- source_word: הַסְּנוּאָה
  choice: Hasenua
  rationale: Isinatinig ang pangalang pantangi mula sa Hebreo, kasama ang paunang pantukoy na naging bahagi ng anyo ng pangalan.
- source_word: וְ
  choice: at
  rationale: Pinananatili ang pang-ugnay upang ipakita ang pagpapatuloy ng talaan at ang ugnayan ng dalawang sugnay.
theological_decisions: []
translation_notes:
  register: Gumamit ng dignidad ngunit karaniwang modernong Filipino. Ang “tagapangasiwa” at “pangalawang namamahala” ay malinaw na mga katawagang administratibo at pinananatili ang pagkakaiba ng dalawang tungkulin nang hindi nagdaragdag ng tiyak na estrukturang pampamahalaan na wala sa Hebreo.
