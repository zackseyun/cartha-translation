  text: and in Ziklag[a], and in Mekonah and its daughter villages.
translation:
  language: tl
  text: at sa Ziklag, at sa Mekona at sa mga nayong sakop nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “at sa mga anak na babae nito,” isang idyoma para sa maliliit o nakadependeng pamayanang sakop ng Mekona.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/צִֽקְלַ֥ג
  choice: at sa Ziklag
  rationale: Likas na isinasalin ang pinagsamang pang-ugnay at pang-ukol bilang “at sa.” Ang Ziklag ay pangalan ng lugar kaya tinumbasan ito sa paraang transliterasyon.
- source_word: וּ/בִ/מְכֹנָ֖ה
  choice: at sa Mekona
  rationale: Ang pang-ugnay at pang-ukol ay isinaling “at sa.” Ang Mekona ay transliterasyon ng pangalan ng lugar ayon sa bigkas ng Hebreo.
- source_word: וּ/בִ/בְנֹתֶֽי/הָ
  choice: at sa mga sakop nitong nayon
  rationale: Literal itong “at sa mga anak na babae nito,” ngunit idyoma ito para sa maliliit o nakabababang pamayanang sakop ng isang pangunahing bayan. Nililinaw ng “mga sakop nitong nayon” ang kahulugan at pinananatili ang pagtukoy ng hulaping pambabae sa Mekona.
theological_decisions: []
translation_notes:
  register: Makabago, payak, at marangal na Filipino. Ginamit ang “sakop nitong nayon” upang maging malinaw sa karaniwang mambabasa ang Hebreong idyoma nang hindi nagdaragdag ng di-tiyak na detalye.
