base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/012.yaml
  text: And their brothers[a], doers of the work for the house, were eight hundred twenty-two; and Adaiah son of Jeroham, son of Pelaliah, son of Amzi, son of Zechariah, son of Pashhur, son of Malchijah.
translation:
  language: tl
  text: At ang kanilang mga kapatid na gumagawa ng gawain para sa bahay[a] ay walong daan at dalawampu't dalawa; at si Adaiah na anak ni Jeroham, anak ni Pelaliah, anak ni Amzi, anak ni Zechariah, anak ni Pashhur, anak ni Malchijah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga manggagawa para sa templo.” Sa literal na Hebreo, “mga gumagawa ng gawain para sa bahay.” Sa kontekstong ito, ang “bahay” ay tumutukoy sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: At ang kanilang mga kapatid
  rationale: Pinananatili ang literal na terminong pangkamag-anakan na “mga kapatid.” Bagaman maaaring tumukoy ito sa mga kapwa pari sa konteksto, hindi tahasang sinasabi iyon ng talata.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: na gumagawa ng gawain
  rationale: Malapit itong sumusunod sa participial na anyo ng Hebreo at malinaw pa rin sa makabagong Tagalog.
- source_word: לַבַּיִת
  choice: para sa templo
  rationale: Literal na “para sa bahay,” ngunit sa konteksto ang “bahay” ay ang templo. Ginamit ang kontekstuwal na kahulugan sa pangunahing teksto para sa natural at malinaw na Tagalog, habang itinala sa talababa ang literal na salita.
- source_word: שְׁמֹנֶה מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: walong daan at dalawampu't dalawa
  rationale: Tuwirang katumbas ng bilang at natural na anyo nito sa Tagalog.
- source_word: וַעֲדָיָה
  choice: Kasama rin si Adaya
  rationale: Ipinagpapatuloy ng prefixed conjunction ang talaan. Ang “Kasama rin” ay likas na Tagalog at ipinapakita ang pagdaragdag ng susunod na pangalan nang hindi binabago ang ugnayan.
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang karaniwang katumbas ng pormulang panggenealohiya. Hindi ginawang “inapo ni” sapagkat hindi kailangan ng konteksto na gawing mas malawak ang ugnayan.
- source_word: יְרֹחָם / פְּלַלְיָה / אַמְצִי / זְכַרְיָה / פַּשְׁחוּר / מַלְכִּיָּה
  choice: Jeroham / Pelalia / Amzi / Zacarias / Pashur / Malquias
  rationale: Ginamit ang malinaw at kinikilalang mga anyo ng pangalang pantangi sa Filipino, habang malapit na sinusundan ang mga pangalang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Pinanatili ang terminong “mga kapatid” upang hindi tahasang gawing “mga kapwa pari” ang ipinahihiwatig lamang ng konteksto. Isinalin namang “templo” ang “bahay” sa pangunahing teksto para sa kalinawan, at inilagay ang literal na anyo sa talababa.
