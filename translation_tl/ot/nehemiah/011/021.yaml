  text: And the temple servants were living on the Ophel[a], and Ziha and Gishpa were over the temple servants.
translation:
  language: tl
  text: Ang mga lingkod sa templo[a] ay naninirahan sa Ofel, at sina Ziha at Gispa ang namamahala sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, נְתִינִים (Netinim), isang teknikal na tawag sa pangkat na itinalaga sa paglilingkod sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: mga lingkod sa templo
  rationale: Teknikal na tawag ito sa isang pangkat na itinalaga sa paglilingkod sa templo. Isinasalin ang tungkulin upang maging malinaw sa karaniwang mambabasa, sa halip na basta hiramin ang terminong Hebreo.
- source_word: יֹשְׁבִים
  choice: ay naninirahan
  rationale: Ang participle ng ישב ay nagpapahiwatig ng nagpapatuloy na paninirahan; likas at marangal sa modernong Tagalog ang “naninirahan.”
- source_word: בָּעֹפֶל
  choice: sa Ofel
  rationale: Ang עֹפֶל ay pangalang pantangi o topograpikong katawagan para sa lugar. Ang “sa” ang likas na katumbas ng preposisyon sa Tagalog nang hindi ipinipilit ang tiyak na topograpikong pakahulugan.
- source_word: צִיחָא
  choice: Ziha
  rationale: Pangalang pantangi na tinumbasan ayon sa bigkas na mas angkop sa Tagalog.
- source_word: גִשְׁפָּא
  choice: Gispa
  rationale: Pangalang pantangi na tinumbasan ayon sa bigkas na mas angkop sa Tagalog.
- source_word: עַל הַנְּתִינִים
  choice: ang namamahala sa kanila
  rationale: Sa kontekstong administratibo, ang עַל ay nagpapahayag ng pamamahala o pangangasiwa. Iniiwasan ng “namamahala” ang di-likas na literalismong “nasa ibabaw.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga lingkod sa templo” para maipahayag ang institusyonal na tungkulin, at pinanatili sa talababa ang katawagang Hebreo. Ang panghalip na “kanila” ay natural na tumutukoy sa mga lingkod sa templo at umiiwas sa mabigat na pag-uulit.
