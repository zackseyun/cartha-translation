base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/030.yaml
  text: Zanoah[a], Adullam and their villages, Lachish and its fields, Azekah and its daughter towns[b]. So they camped from Beer-sheba as far as the Valley of Hinnom.
translation:
  language: tl
  text: Zanoa, Adulam, at ang mga nayon ng mga iyon; Lakis at ang mga bukid nito; at Azeka at ang mga bayang sakop nito.[a] At nagkampo[b] sila mula Beer-seba hanggang sa Lambak ng Hinom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “mga anak na babae nito,” isang idyoma para sa mga bayang sakop o nakaugnay na pamayanan; maaari ring “mga nayon nito.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “humimpil”; sa kontekstong ito, maaaring ipinahihiwatig na “nanirahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנֹחַ
  choice: Zanoa
  rationale: Pangalan ng lugar; isina-Tagalog ang transliterasyon upang maging natural sa modernong Filipino.
- source_word: עֲדֻלָּם
  choice: Adulam
  rationale: Pangalan ng lugar; pinanatili bilang transliterasyon.
- source_word: חַצְרֵיהֶם
  choice: mga nayon ng mga ito
  rationale: Sa talaan ng mga pamayanan, tumutukoy ang חָצֵר sa maliliit o nakaugnay na pamayanang nasa paligid ng mas malaking bayan. Ipinahihiwatig ng hulaping maramihan ang kaugnayan ng mga nayon sa Zanoa at Adulam.
- source_word: לָכִישׁ
  choice: Lakis
  rationale: Pangalan ng lugar; ginamit ang karaniwang anyong angkop sa baybay at bigkas ng Filipino.
- source_word: שְׂדֹתֶיהָ
  choice: mga bukid nito
  rationale: Pinananatili ang kongkretong kahulugan ng שָׂדֶה bilang bukid o lupang pansakahan na kaugnay ng lungsod.
- source_word: עֲזֵקָה
  choice: Azeka
  rationale: Pangalan ng lugar; pinanatili bilang transliterasyon.
- source_word: בְנֹתֶיהָ
  choice: mga bayang sakop nito
  rationale: Ang literal na metaporang 'mga anak na babae nito' ay tumutukoy sa mga nakapailalim o nakaugnay na bayan. Ang 'mga bayang sakop nito' ay malinaw at natural sa Filipino, habang inilalahad sa talababa ang literal na larawan.
- source_word: וַיַּחֲנוּ
  choice: Nagkampo
  rationale: Pinananatili ang pangunahing kahulugan ng חנה na magkampo o humimpil, nang hindi tahasang ipinapalit ang kontekstuwal na posibilidad na permanenteng paninirahan.
- source_word: מִבְּאֵר שֶׁבַע
  choice: mula Beer-seba
  rationale: Ipinapahayag ng מִן ang pasimula ng saklaw na heograpiko; ang pangalan ay isinalin sa anyong transliterado.
- source_word: עַד
  choice: hanggang sa
  rationale: Natural na Filipino para sa hangganan ng saklaw na heograpiko.
- source_word: גֵּיא הִנֹּם
  choice: Lambak ng Hinom
  rationale: Tuwirang isinasalin ang construct phrase habang pinananatili ang pangalang Hinom.
