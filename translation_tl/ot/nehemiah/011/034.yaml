lexical_decisions:
- source_word: חָדִיד
  choice: Hadid
  rationale: Pangalan ito ng isang lugar sa talaan ng mga pamayanan; tinumbasan sa pamamagitan ng transliterasyon ayon sa Hebreong anyo.
- source_word: צְבֹעִים
  choice: Zeboim
  rationale: Pangalan ito ng lugar. Pinili ang maikli at madaling basahing transliterasyong “Zeboim,” habang inilagay sa talababa ang alternatibong “Zeboiim” na mas lantad na kumakatawan sa pagkakasunod ng mga patinig sa Hebreo.
- source_word: נְבַלָּט
  choice: Neballat
  rationale: Pangalan ito ng lugar. Pinanatili ang dobleng “l” upang katawanin ang pinatinding katinig sa tinuldikang tekstong Hebreo; binanggit sa talababa ang pinasimpleng anyo.
