  text: Ang lahat ng Levita sa banal na lungsod ay 284.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל
  choice: Ang lahat ng
  rationale: Tuwirang ipinahahayag ng pang-uring pamilang ang kabuuang bilang ng pangkat at natural ito sa modernong Tagalog.
- source_word: הַלְוִיִּם
  choice: Levita
  rationale: Karaniwan at tiyak na katawagan sa Tagalog para sa mga kabilang sa pangkat ni Levi; malinaw na maramihan sa pariralang “ang lahat ng Levita.”
- source_word: בְּעִיר
  choice: sa ... lungsod
  rationale: Ang בְּ ay panandang panlunan; ang “sa” ang natural na katumbas sa Tagalog.
- source_word: הַקֹּדֶשׁ
  choice: banal na
  rationale: Sa pariralang genitibo na “lungsod ng kabanalan,” gumaganap itong paglalarawan sa lungsod. Pinananatili ng “banal” ang sakral at tipanang diwa.
- source_word: מָאתַיִם שְׁמֹנִים וְאַרְבָּעָה
  choice: '284'
  rationale: Eksaktong kabuuang bilang ang ipinahahayag ng Hebreo. Mas madaling basahin ang numerong 284 sa talaan ng mga bilang, habang ang “ay” ay likas na idinagdag sa sugnay na walang pandiwa sa Hebreo.
