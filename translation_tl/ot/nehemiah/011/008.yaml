lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: At kasunod niya
  rationale: Ang parirala ay literal na tumutukoy sa pagiging “pagkatapos/kasunod niya.” Sa talaang ito, pinakamalamang na pagkakasunod-sunod ng mga nakatala ang tinutukoy, habang nananatiling maikli at natural sa Tagalog.
- source_word: גַּבַּי
  choice: Gabai
  rationale: Isinalin sa baybay-Tagalog ang pangalang pantangi batay sa anyong Hebreo.
- source_word: סַלָּי
  choice: Salai
  rationale: Isinalin sa baybay-Tagalog ang pangalang pantangi batay sa anyong Hebreo.
- source_word: תְּשַׁע מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  choice: siyam na raan at dalawampu't walo
  rationale: Tuwirang kabuuan ito ng 9 na daan, 20, at 8, o 928; isinulat sa salita para sa marangal at madaling basahing teksto.
