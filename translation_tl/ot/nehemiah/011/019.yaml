  text: 'And the gatekeepers: Akkub[a], Talmon, and their brothers who kept watch at the gates, were one hundred seventy-two.'
translation:
  language: tl
  text: 'At ang mga tagapagbantay ng mga pintuan: sina Akub, Talmon, at ang kanilang mga kapatid[a], na nagbabantay sa mga pintuan—172 lahat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kamag-anak nila”; ang Hebreong “mga kapatid” ay maaari ring tumukoy sa malalapit na kamag-anak na lalaki o sa mga kapwa kasapi ng iisang pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשּׁוֹעֲרִים
  choice: mga bantay ng pintuang-bayan
  rationale: Tumutukoy ito sa mga taong nakatalagang magbantay o mangasiwa sa mga pintuang-bayan. Likas at malinaw ang parirala sa makabagong Filipino at pinananatili nito ang kanilang opisyal na tungkulin.
- source_word: עַקּוּב
  choice: Akub
  rationale: Pangngalang pantangi; isinalin sa anyong transliterasyon na angkop sa bigkas at baybay sa Filipino.
- source_word: טַלְמוֹן
  choice: Talmon
  rationale: Pangngalang pantangi; pinanatili sa karaniwang anyong transliterasyon.
- source_word: וַאֲחֵיהֶם
  choice: at ang kanilang mga kapatid
  rationale: Ang pangunahing kahulugan ng אָח ay kapatid na lalaki, ngunit maaari rin itong tumukoy sa mga kamag-anak o kapwa kasapi ng isang pangkat. Pinanatili sa teksto ang tuwirang salitang 'mga kapatid' at inilagay sa talababa ang saklaw ng kahulugan.
- source_word: הַשֹּׁמְרִים
  choice: na nagbabantay
  rationale: Ang participle ng שׁמר ay nagpapahiwatig ng patuloy o nakatalagang gawain. Natural sa Filipino ang 'nagbabantay' at malinaw na inilalarawan ang kanilang tungkulin.
- source_word: בַּשְּׁעָרִים
  choice: sa mga pintuang-bayan
  rationale: Ipinapakita ng parirala ang lugar ng kanilang paglilingkod. Nililinaw ng 'pintuang-bayan' na mga gate ng lungsod o nasasakupang lugar ang tinutukoy, hindi karaniwang pinto.
- source_word: מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: 172 silang lahat
  rationale: Ibinibigay nito ang kabuuang bilang. Ang numerong 172 at pariralang 'silang lahat' ay maikli, malinaw, at natural sa listahang administratibo.
theological_decisions: []
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Ginamit ang 'pintuang-bayan' upang maiwasan ang di-likas at malabong 'tagapagbantay ng pinto,' habang pinananatili ang tungkuling institusyonal. Pinanatili sa talababa ang tunay na lawak ng kahulugan ng 'mga kapatid.'
