  naturalness: Nauunawaan at marangal ang draft, ngunit mas likas at mas malapit sa tekstong pinagmulan ang “mga tagapagbantay ng mga pintuan.” Ang “172 silang lahat” ay katanggap-tanggap, subalit “172 lahat” ay mas tuwirang katumbas ng inilalahad na kabuuang bilang sa listahan.
  terminology: Ang “mga tagapagbantay ng mga pintuan” ay malinaw na modernong Filipino para sa הַשּׁוֹעֲרִים at hindi ipinagpapalagay na mga pintuang-bayan ang tinutukoy. Pinanatili ang “mga kapatid,” kasama ang talababa para sa posibleng mas malawak na kahulugan nito.
