base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/016.yaml
  text: And Shabbethai and Jozabad[a], from the heads of the Levites, were over the outside work of the house of God.
translation:
  language: tl
  text: At sina Shabetai at Jozabad, na kabilang sa mga pinuno ng mga Levita, ay namamahala sa gawaing panlabas para sa bahay ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain na “gawaing nasa labas para sa bahay ng Diyos.” Maaaring tumukoy ang pariralang Hebreo sa gawaing isinasagawa sa labas ng mismong templo, bilang kaiba sa mga tungkulin sa loob.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְּתַי וְיוֹזָבָד
  choice: At sina Shabetai at Jozabad
  rationale: Isinalin ang pang-ugnay upang mapanatili ang daloy ng talaan, at tinumbasan ang mga pangalang pantangi ayon sa karaniwang anyong Filipino.
- source_word: עַל
  choice: ang namamahala sa
  rationale: Sa kontekstong administratibo, ipinahihiwatig ng parirala ang pananagutan o pangangasiwa, hindi lamang pisikal na pagiging nasa ibabaw.
- source_word: הַמְּלָאכָה הַחִיצֹנָה
  choice: gawaing panlabas
  rationale: Pinananatili nito ang malawak na kahulugan ng מְלָאכָה bilang gawain at ang di-tiyak na pagtukoy ng הַחִיצֹנָה sa gawaing panlabas o hindi panloob.
- source_word: לְבֵית הָאֱלֹהִים
  choice: para sa bahay ng Diyos
  rationale: Ang לְ ay natural na nagsasaad dito ng kaugnayan o layon ng gawain. Ang 'bahay ng Diyos' ay pormal at malinaw na katumbas ng pariralang Hebreo.
- source_word: מֵרָאשֵׁי הַלְוִיִּם
  choice: na kabilang sa mga pinuno ng mga Levita
  rationale: Ipinapahayag nito nang natural sa Filipino na ang dalawang lalaki ay mula sa pangkat ng mga nangungunang Levita, habang pinananatili ang diwa ng prefiks na מִן.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Filipino. Pinili ang “gawaing panlabas” upang hindi labis na tukuyin kung ito ay pisikal na gawain sa labas ng templo o mas malawak na mga tungkuling hindi panloob.
