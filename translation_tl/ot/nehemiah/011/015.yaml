base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/015.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, son of Bunni.'
translation:
  language: tl
  text: 'At mula sa mga Levita: si Semaias na anak ni Hasub[a], na anak ni Azricam, na anak ni Hasabias, na anak ni Buni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga talaangkanan, ang Hebreong בֶן (ben), “anak,” ay maaari ring tumukoy sa isang mas malayong inapo, hindi lamang sa tuwirang anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: At mula sa
  rationale: Pinananatili ng “At” ang ugnayan sa naunang talaan, at likas sa Filipino ang pariralang “mula sa” sa ganitong pagpapakilala.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Karaniwan at malinaw na katawagan sa Filipino para sa mga kabilang sa pangkat o lipi ni Levi.
- source_word: שְׁמַעְיָה
  choice: Semaias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal.
- source_word: בֶן
  choice: anak ni
  rationale: Ito ang karaniwang tuwirang salin sa talaangkanan at pinananatili ang estruktura ng Hebreo, bagaman maaari rin itong tumukoy sa mas malayong inapo.
- source_word: חַשּׁוּב
  choice: Hasub
  rationale: Isina-Filipino ang transliterasyon nang hindi gumagamit ng dobleng katinig na hindi likas sa ortograpiyang Filipino.
- source_word: עַזְרִיקָם
  choice: Azricam
  rationale: Malapit na transliterasyon sa Hebreo na inangkop sa pagbabaybay sa Filipino.
- source_word: חֲשַׁבְיָה
  choice: Hasabias
  rationale: Ginamit ang likas at nakaugaliang anyong Filipino ng pangalang biblikal.
- source_word: בּוּנִּי
  choice: Buni
  rationale: Malapit na transliterasyon sa Hebreo na inangkop sa ortograpiyang Filipino.
