  source_fidelity: 'Tumpak ang pangunahing diwa: ang mga kapatid/kaugnay na lalaki, na mga magigiting na mandirigma, ay 128, at si Zabdiel ang itinalagang tagapangasiwa sa kanila. Gayunman, ang transliterasyon ng הַגְּדוֹלִים ay dapat magpanatili ng dobleng g na sinasagisag ng dagesh: Haggedolim.'
  naturalness: Likas at angkop sa modernong Filipino ang “mga magigiting na mandirigma” at “tagapangasiwa.” Mas malinaw at mas maayos ang “ay may bilang na 128” kaysa gawing tuwirang panaguri ang numeral.
