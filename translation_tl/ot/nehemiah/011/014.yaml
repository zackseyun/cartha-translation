  yaml_path: translation/ot/nehemiah/011/014.yaml
  text: And their brothers[a], mighty men of valor, were one hundred twenty-eight; and the overseer over them was Zabdiel son of Haggedolim.
translation:
  language: tl
  text: At ang kanilang mga kapatid na magigiting na mandirigma ay may bilang na 128. Ang tagapangasiwa sa kanila ay si Zabdiel na anak ni Haggedolim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anak ng mga dakilang tao” o “anak ng mga maharlika.” Maaaring mapaglarawang parirala ang Hebreo sa halip na isang pangalang pantangi.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: At ang kanilang mga kapatid
  rationale: Pinananatili ng “mga kapatid” ang literal na panlalaking katawagan, na sa konteksto ng talaan ay tumutukoy sa mga lalaking kabilang sa kaugnay na pangkat.
- source_word: גִּבּוֹרֵי חַיִל
  choice: mga magigiting na mandirigma
  rationale: Likas itong parirala sa makabagong Filipino at ipinahahayag ang lakas, tapang, at posibleng kakayahang militar ng Hebreong idyoma.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: '128'
  rationale: Tuwirang katumbas ng bilang na isang daan at dalawampu't walo; malinaw at natural ang paggamit ng numerals sa ganitong talaan.
- source_word: וּפָקִיד עֲלֵיהֶם
  choice: Ang tagapangasiwa nila ay
  rationale: Ipinakikita ng “tagapangasiwa” ang itinalagang tungkuling mamahala nang hindi ipinapalagay na tiyak na militar ang katungkulan.
- source_word: זַבְדִּיאֵל
  choice: Zabdiel
  rationale: Isinatinig ang personal na pangalan ayon sa karaniwang anyo nito sa mga saling Filipino.
- source_word: בֶּן הַגְּדוֹלִים
  choice: anak ni Hagedolim
  rationale: Tinatrato sa pangunahing teksto ang הַגְּדוֹלִים bilang pangalan o katawagan ng angkan, habang pinananatili sa talababa ang posibilidad na isa itong mapaglarawang parirala.
