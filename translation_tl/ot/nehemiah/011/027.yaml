  yaml_path: translation/ot/nehemiah/011/027.yaml
  text: and in Hazar-shual[a], and in Beer-sheba and its villages.
translation:
  language: tl
  text: at sa Hazar-sual, at sa Beer-seba at sa mga nayon nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga anak na babae nito,” isang idyoma para sa mga nayon o pamayanang nasasakupan ng isang bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲצַר שׁוּעָל
  choice: at sa Hazar-sual
  rationale: Tuwirang isinalin ang pang-ugnay at pang-ukol bilang “at sa,” habang tinumbasan sa karaniwang anyong Filipino ang pangalan ng lugar sa halip na isalin ang etimolohiya nitong “Nayon ng Soro.”
- source_word: וּ/בִ/בְאֵר שֶׁבַע
  choice: at sa Beer-seba
  rationale: Pinanatili bilang pangalan ng kilalang lugar at ginamit ang anyong madaling bigkasin at makilala sa Filipino; hindi isinalin ang posibleng etimolohiyang “Balon ng Pito” o “Balon ng Panunumpa.”
- source_word: וּ/בְנֹתֶיהָ
  choice: at sa mga nayon nito
  rationale: Ang literal na “mga anak na babae nito” ay isang heograpikong idyoma para sa mga nakaugnay o nasasakupang pamayanan. Likas at malinaw sa modernong Filipino ang “mga nayon nito,” at ang “nito” ay tumutukoy sa Beer-seba.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Pinanatili ang mga pangalang pantangi sa transliteradong anyo at isinalin nang natural ang heograpikong idyoma.
