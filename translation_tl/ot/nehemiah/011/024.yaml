source:
  edition: WLC
  text: וּ/פְתַֽחְיָ֨ה בֶּן מְשֵֽׁיזַבְאֵ֜ל מִ/בְּנֵי זֶ֤רַח בֶּן יְהוּדָה֙ לְ/יַ֣ד הַ/מֶּ֔לֶךְ לְ/כָל דָּבָ֖ר לָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/024.yaml
  text: And Pethahiah son of Meshezabel[a], from the sons of Zerah son of Judah[b], was at the king’s side for every matter concerning the people.
translation:
  language: tl
  text: At si Petahias na anak ni Meshezabel, mula sa mga inapo ni Zera na anak ni Juda, ay nasa tabi ng hari[a] para sa bawat usaping may kinalaman sa bayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kinatawan ng hari” o “naglilingkod sa ilalim ng hari.” Sa literal, “nasa kamay ng hari.”
    reason: lexical_alternative
  - marker: b
    text: O “para sa bayan.” Maaaring tumukoy ang Hebreo sa mga usaping may kinalaman sa bayan o sa mga usaping pinangangasiwaan para sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְתַֽחְיָה
  choice: At si Petahias
  rationale: Isinalin ang pang-ugnay upang mapanatili ang kaugnayan sa naunang talaan; ginamit ang anyong Tagalog ng pangalang Hebreo.
- source_word: בֶּן מְשֵֽׁיזַבְאֵל
  choice: na anak ni Meshezabel
  rationale: Natural at malinaw na pagpapahayag sa Tagalog ng karaniwang pormulang pangangkanan.
- source_word: מִ/בְּנֵי זֶרַח בֶּן יְהוּדָה
  choice: mula sa mga inapo ni Zera na anak ni Juda
  rationale: Ang מִן ay nagpapahiwatig ng pinagmulan o angkan. Mas natural sa Tagalog ang “mga inapo” kaysa literal na “mga anak” kapag tumutukoy sa mas malayong salinlahi, habang pinananatili ang malinaw na ugnayan nina Zera at Juda.
- source_word: לְ/יַד הַ/מֶּלֶךְ
  choice: ay nasa tabi ng hari
  rationale: Pinananatili ang kongkretong larawan ng Hebreong idyoma ngunit natural sa Tagalog. Maaaring tumukoy ito sa pagiging malapit na opisyal, kinatawan, o lingkod sa ilalim ng awtoridad ng hari; inilalahad sa talababa ang saklaw na ito.
- source_word: לְ/כָל דָּבָר
  choice: para sa bawat usapin
  rationale: Sa kontekstong administratibo, ang דָּבָר ay “usapin” o “gawain,” hindi lamang “salita.” Ang “bawat usapin” ay malawak at dignified na katumbas.
- source_word: לָ/עָם
  choice: may kinalaman sa bayan
  rationale: Pinananatili ang malamang na relasyonal na diwa ng lamed—mga usaping nauukol sa bayan—nang hindi inaalis ang posibilidad na ang mga iyon ay pinangangasiwaan para sa kapakanan o sa ngalan ng bayan.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw at marangal. Ginamit ang “bayan” para sa עָם sa kontekstong pampamahalaan, at “mga inapo” upang natural na ipahayag ang pangangkanan. Pinanatili sa pangunahing teksto ang bahagyang di-tiyak na idyomang tumutukoy sa kaugnayan ni Petahias sa hari, na may mga posibleng pakahulugan sa talababa.
