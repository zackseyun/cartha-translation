  text: and his brothers[a], heads of fathers’ houses, 242; and Amashsai son of Azarel, son of Ahzai, son of Meshillemoth[c][b], son of Immer.
translation:
  language: tl
  text: at ang kanyang mga kapatid[a], na mga pinuno ng mga sambahayan ng kanilang mga ninuno—242[b]; at si Amashsai[c], na anak ni Azarel, na anak ni Ahzai, na anak ni Meshillemoth, na anak ni Immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mga kamag-anak.” Ang salitang Hebreo ay maaari ring tumukoy sa mga lalaking kamag-anak o kasapi ng iisang angkan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “dalawang daan at apatnapu't dalawa.”
    reason: lexical_alternative
  - marker: c
    text: Ang pangalang “Amashsai” ay isinasatitik din kung minsan bilang “Amasai.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶחָיו
  choice: at ang mga kapatid niya
  rationale: Pinananatili ng “mga kapatid” ang tuwirang kahulugan ng אָח sa maramihan, habang ang talababa ay nagsasaad na maaari rin itong tumukoy sa mga lalaking kamag-anak o kasapi ng angkan.
- source_word: רָאשִׁים לְאָבוֹת
  choice: mga pinuno ng mga sambahayan ng mga ninuno
  rationale: Ipinahahayag nito ang mga pinuno ng mga yunit ng angkan o sambahayang nagmula sa isang ninuno, nang hindi pinapantay lamang sa makabagong nuklear na pamilya.
- source_word: מָאתַיִם אַרְבָּעִים וּשְׁנָיִם
  choice: 242 lahat
  rationale: Eksaktong inililipat ang bilang at ginagamit ang mga digit para madaling mabasa sa talaang administratibo.
- source_word: וַעֲמַשְׁסַי
  choice: at si Amashsai
  rationale: Ang “Amashsai” ay malapit na transliterasyon ng natatanging anyong Masoretiko sa talatang ito at hindi ito tahimik na itinutugma sa mas pamilyar na “Amasai.”
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang karaniwang tuwirang salin sa sunod-sunod na talaangkanan; bagaman maaari itong tumukoy kung minsan sa mas malayong inapo, walang dahilan dito upang talikuran ang literal na ugnayan.
- source_word: עֲזַרְאֵל / אַחְזַי / מְשִׁלֵּמוֹת / אִמֵּר
  choice: Azarel / Ahzai / Meshillemoth / Immer
  rationale: Malalapit na transliterasyon ng mga pangalang Hebreo, na pinananatili ang mga anyong nasa tekstong Masoretiko.
