    issue: Hindi sapat na malinaw ang apposition sa “mga kapatid niyang pinuno.”
    rationale: Ang רָאשִׁים לְאָבוֹת ay paglalarawan sa “kanyang mga kapatid,” hindi kinakailangang isang nakadikit na pariralang maaaring maging malabo sa Filipino.
  - severity: low
    issue: Di-gaanong natural ang “mga sambahayan ng mga ninuno.”
    rationale: Maaaring magmukhang mga bahay na pag-aari ng maraming ninuno. Ang “mga sambahayan ng kanilang mga ninuno” ay mas malinaw na nagpapahiwatig ng mga grupong pampamilya/angkan.
  - severity: low
    issue: Ang talababa c ay gumagamit ng “isinasalin” para sa ibang anyo ng pangalan.
    rationale: Ang Amasai ay alternatibong transliterasyon/anyong Ingles ng pangalan, hindi salin ng kahulugan nito.
