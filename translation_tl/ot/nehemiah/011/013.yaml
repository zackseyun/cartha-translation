translation_notes:
  register: Makabago ngunit marangal na Filipino; malinaw ang ayos ng talaan at pinanatili ang teknikal na ideya ng sambahayang nagmula sa ninuno. Ginamit ang “anak ni” sa paulit-ulit na pormulang talaangkanan at malalapit na transliterasyon para sa mga pangalan.
