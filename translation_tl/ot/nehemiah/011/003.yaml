source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ רָאשֵׁ֣י הַ/מְּדִינָ֔ה אֲשֶׁ֥ר יָשְׁב֖וּ בִּ/ירוּשָׁלִָ֑ם וּ/בְ/עָרֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ אִ֤ישׁ בַּ/אֲחֻזָּת/וֹ֙ בְּ/עָ֣רֵי/הֶ֔ם יִשְׂרָאֵ֤ל הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֣ם וְ/הַ/נְּתִינִ֔ים וּ/בְנֵ֖י עַבְדֵ֥י שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/003.yaml
  text: 'These are the heads of the province who lived in Jerusalem[a]. But in the cities of Judah, each man lived in his own possession in their cities: Israel, the priests, the Levites, the temple servants[b], and the descendants of Solomon’s servants.'
translation:
  language: tl
  text: 'Ito ang mga pinuno ng lalawigan na nanirahan sa Jerusalem. Sa mga lungsod naman ng Juda, ang bawat isa ay nanirahan sa sarili niyang lupang pag-aari, sa kani-kanilang mga lungsod: ang Israel[a], ang mga pari, ang mga Levita, ang mga lingkod sa templo[b], at ang mga inapo ng mga lingkod ni Solomon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga Israelita.” Payak na “Israel” ang nasa Hebreo, malamang bilang kolektibong katawagan sa listahang ito.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga Netinim,” isang pangkat na itinalaga sa paglilingkod sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַמְּדִינָה
  choice: mga pinuno ng lalawigan
  rationale: Ang רָאשֵׁי ay idyomang tumutukoy sa mga nangunguna o pinuno, at ang הַמְּדִינָה sa kontekstong Persiano ay isang administratibong lalawigan.
- source_word: אֲשֶׁר יָשְׁבוּ בִּירוּשָׁלִָם
  choice: na nanirahan sa Jerusalem
  rationale: Karaniwang kahulugan ng יָשַׁב ang manirahan; ang anyong ito ay natural sa makabagong Tagalog at angkop sa talaan ng paninirahan.
- source_word: וּבְעָרֵי יְהוּדָה יָשְׁבוּ
  choice: Sa mga lungsod naman ng Juda ... ay nanirahan
  rationale: Ipinahihiwatig ng waw ang paglipat mula sa Jerusalem patungo sa ibang mga lungsod ng Juda; natural na ipinakikita sa Tagalog ng “naman.”
- source_word: אִישׁ
  choice: ang bawat isa
  rationale: Distributibo ang isahang אִישׁ. Ang “bawat isa” ay malinaw at likas sa Tagalog nang hindi ipinapalagay na pawang lalaki lamang ang tinutukoy na mga sambahayan o taong kabilang sa pangkat.
- source_word: בַּאֲחֻזָּתוֹ
  choice: sa sarili niyang ari-arian
  rationale: Ang אֲחֻזָּה ay tumutukoy sa pag-aaring lupa o minanang pag-aari; malinaw na naihahatid ng “ari-arian” ang kongkretong diwa rito.
- source_word: בְּעָרֵיהֶם
  choice: sa kani-kanilang mga lungsod
  rationale: Ang “kani-kanilang” ay natural na Tagalog para sa pamamahaging diwa ng pangmaramihang panghalip at umiiwas sa alanganing literal na “kanilang mga lungsod” pagkatapos ng “bawat isa.”
- source_word: יִשְׂרָאֵל
  choice: ang Israel
  rationale: Pinananatili ang payak na pangalang Israel bilang kolektibong katawagan sa listahan, sa halip na tahimik na bigyang-kahulugang “mga Israelita.”
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwan at malinaw na salin ng כֹּהֲנִים.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagan sa Tagalog para sa pangkat na mula sa lipi ni Levi.
- source_word: הַנְּתִינִים
  choice: ang mga lingkod sa templo
  rationale: Tumutukoy ang נְתִינִים sa kinikilalang pangkat na itinalaga sa paglilingkod sa templo; mas nauunawaan ito kaysa transliterasyong “Netineo.”
- source_word: בְּנֵי עַבְדֵי שְׁלֹמֹה
  choice: ang mga inapo ng mga lingkod ni Solomon
  rationale: Sa talaang pangkomunidad, masaklaw na ang בְּנֵי ay tumukoy sa mga inapo, hindi lamang sa tuwirang mga anak na lalaki.
