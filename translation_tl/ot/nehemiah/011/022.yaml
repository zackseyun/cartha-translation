revisions:
- from: Ang tagapangasiwa ng mga Levita sa Jerusalem ay si Uzi na anak ni Bani, na anak ni Hasabias, na anak ni Matanias, na anak ni Mica. Kabilang siya sa mga anak ni Asaf, ang mga mang-aawit na namamahala sa gawain sa bahay ng Diyos.[a]
  to: Ang tagapangasiwa ng mga Levita sa Jerusalem ay si Uzi na anak ni Bani, na anak ni Hasabias, na anak ni Matanias, na anak ni Mica, mula sa mga anak ni Asaf, na mga mang-aawit, na namamahala sa gawain sa bahay ng Diyos.[a]
  rationale: Inayos ang sintaks upang si Uzi, hindi ang mga mang-aawit bilang pangkat, ang malinaw na maging tagapangasiwa na kaugnay ng gawain sa bahay ng Diyos. Pinanatili ang lahat ng pangalan, ang talaangkanan, ang Asafitang pagkakakilanlan, at ang maingat na alternatibong pakahulugan ng לְנֶגֶד sa talababa.
