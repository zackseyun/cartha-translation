  text: וּ/פְקִ֤יד הַ/לְוִיִּם֙ בִּ/יר֣וּשָׁלִַ֔ם עֻזִּ֤י בֶן בָּנִי֙ בֶּן חֲשַׁבְיָ֔ה בֶּן מַתַּנְיָ֖ה בֶּן מִיכָ֑א מִ/בְּנֵ֤י אָסָף֙ הַ/מְשֹׁ֣רְרִ֔ים לְ/נֶ֖גֶד מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/022.yaml
  text: And the overseer of the Levites in Jerusalem was Uzzi son of Bani[a], son of Hashabiah, son of Mattaniah, son of Mica, from the sons of Asaph, the singers, over the work of the house of God.
translation:
  language: tl
  text: Ang tagapangasiwa ng mga Levita sa Jerusalem ay si Uzi na anak ni Bani, na anak ni Hasabias, na anak ni Matanias, na anak ni Mica, mula sa mga anak ni Asaf, na mga mang-aawit, na namamahala sa gawain sa bahay ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “na may pananagutan kaugnay ng gawain sa bahay ng Diyos.” Ang pariralang Hebreo na may לְנֶגֶד ay maaaring magpahiwatig ng pangangasiwa o pananagutan kaugnay ng gawain sa templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקִיד הַלְוִיִּם
  choice: Ang tagapangasiwa ng mga Levita
  rationale: Ang פְקִיד ay tumutukoy sa isang taong itinalaga sa pangangasiwa o pamamahala. Likas sa modernong Tagalog ang “tagapangasiwa,” at malinaw nitong ipinahihiwatig ang opisyal na tungkulin nang hindi labis na tinutukoy ang uri nito.
- source_word: בִּירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong gamit ng בְּ.
- source_word: עֻזִּי בֶן בָּנִי בֶּן חֲשַׁבְיָה בֶּן מַתַּנְיָה בֶּן מִיכָא
  choice: si Uzi na anak ni Bani, na anak ni Hasabias, na anak ni Matanias, na anak ni Mica
  rationale: Inulit ang ugnayang “anak ni” upang mapanatili ang malinaw na hanay ng angkan. Ginamit ang mga anyo ng pangalan na natural at pamilyar sa tradisyong Tagalog.
- source_word: מִבְּנֵי אָסָף
  choice: Kabilang siya sa mga anak ni Asaf
  rationale: Pinananatili ng “mga anak ni Asaf” ang pormal na anyo ng Hebreo, habang nililinaw ng “kabilang siya” ang ugnayan nito kay Uzi sa natural na Tagalog.
- source_word: הַמְשֹׁרְרִים
  choice: ang mga mang-aawit
  rationale: Tumpak nitong inilalarawan ang papel ng mga Asafita sa templo bilang mga umaawit; hindi ito pinalalawak tungo sa mas pangkalahatang “mga musikero.”
- source_word: לְנֶגֶד מְלֶאכֶת
  choice: na namamahala sa gawain
  rationale: Sa kontekstong administratibo, ang לְנֶגֶד ay maaaring magpahiwatig ng pananagutan o pangangasiwa kaugnay ng gawain. Ipinahahayag iyon ng “namamahala sa gawain” sa malinaw na Tagalog, habang itinatala sa talababa ang maaaring mas maluwag na pagbasa.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pinananatili ang literal at malinaw na metaporang Hebreo sa halip na gawing mas interpretatibong “templo ng Diyos.”
theological_decisions:
- issue: Saklaw ng pariralang הַמְשֹׁרְרִים לְנֶגֶד מְלֶאכֶת
  choice: 'Iniuugnay ang responsibilidad sa mga mang-aawit bilang pangkat: “ang mga mang-aawit na namamahala sa gawain.”'
  alternative: Maaaring unawain na si Uzi mismo ang direktang namamahala sa gawain sa bahay ng Diyos.
  rationale: Dahil sa ayos ng Hebreo, maaaring pagtalunan kung ang pariralang tumutukoy sa pangangasiwa ay pangunahing naglalarawan sa mga mang-aawit o sa tungkulin ni Uzi. Hindi ginagawang doktrinal ang pagkakaibang ito; ipinakikita sa talababa ang kahalili.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Hinati sa dalawang pangungusap ang mahabang talaangkanan upang maging natural ang daloy, habang pinananatili ang lahat ng impormasyong nasa Hebreo.
