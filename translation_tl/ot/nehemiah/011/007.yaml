  source_fidelity: 'Tapat ang salin sa tekstong Masoretiko: naipapahayag nito ang panimulang “at ito,” ang kolektibong “mga anak ni Benjamin,” at ang buong sunod-sunod na talaangkanan mula kay Salu hanggang kay Jesaias. Hindi nito pinipilit na lutasin ang mas malawak na posibleng kahulugan ng בני, at ang alternatibong pagbasa para sa Joed ay wastong inilaan sa talababa.'
