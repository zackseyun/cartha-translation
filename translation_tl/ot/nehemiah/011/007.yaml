source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י בִנְיָמִ֑ן סַלֻּ֡א בֶּן מְשֻׁלָּ֡ם בֶּן יוֹעֵ֡ד בֶּן פְּדָיָה֩ בֶן ק֨וֹלָיָ֧ה בֶן מַעֲשֵׂיָ֛ה בֶּן אִֽיתִיאֵ֖ל בֶּן יְשַֽׁעְיָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/007.yaml
  text: 'And these were the sons of Benjamin: Sallu son of Meshullam[a], son of Joed, son of Pedaiah, son of Kolaiah, son of Maaseiah, son of Ithiel[b], son of Jeshaiah.'
translation:
  language: tl
  text: At ito ang mga anak ni Benjamin:[a] si Salu na anak ni Mesulam, na anak ni Joed,[b] na anak ni Pedaias, na anak ni Kolaias, na anak ni Maaseias, na anak ni Itiel, na anak ni Jesaias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pariralang Hebreo na “mga anak ni Benjamin” ay maaari ring unawain nang mas malawak bilang “mga inapo ni Benjamin” o “mga Benjaminita.”
    reason: lexical_alternative
  - marker: b
    text: Ang pangalang “Joed” ay ayon sa Masoretic Text dito. Sa katulad na talaangkanan sa 1 Cronica 9:7, “Hodavias” ang mababasa.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito ang mga
  rationale: Likas na panimula sa Filipino para sa kasunod na pangkat sa talaan; hindi kailangang lagyan ng pandiwang katumbas ang nominal na sugnay sa Hebreo.
- source_word: בְּנֵי בִנְיָמִן
  choice: mga anak ni Benjamin
  rationale: Pinananatili ang literal na anyo at diin sa angkan, habang kinikilala sa talababa na maaari itong tumukoy nang mas malawak sa mga inapo o kaanib ng lipi.
- source_word: סַלֻּא
  choice: Salu
  rationale: Malinaw at karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang natural at malinaw na pormulang Filipino sa isang talaangkanan; pinananatili ang posibleng tuwirang ugnayang ama-anak nang hindi ginagawang mas tiyak kaysa sa Hebreo.
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Anyong transliterasyon na madaling basahin sa Filipino.
- source_word: יוֹעֵד
  choice: Joed
  rationale: Sinusunod ang anyo ng Masoretic Text sa talatang ito.
- source_word: פְּדָיָה
  choice: Pedaias
  rationale: Tradisyonal at madaling makilalang anyong Filipino na kumakatawan sa pangalang Hebreo.
- source_word: קוֹלָיָה
  choice: Kolaias
  rationale: Anyong Filipino na nagpapanatili sa tunog at kayarian ng pangalang Hebreo.
- source_word: מַעֲשֵׂיָה
  choice: Maaseias
  rationale: Anyong Filipino na malapit sa bokalisasyon ng Hebreo.
- source_word: אִיתִיאֵל
  choice: Itiel
  rationale: Direkta at madaling basahing transliterasyon sa Filipino.
- source_word: יְשַׁעְיָה
  choice: Jesaias
  rationale: Pinananatiling naiiba sa karaniwang pangalang Isaias ng propeta, habang malapit sa anyong Hebreo sa kontekstong talaangkanan.
