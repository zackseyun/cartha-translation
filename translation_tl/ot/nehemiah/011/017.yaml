base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/017.yaml
  text: And Mattaniah son of Micah[a], son of Zabdi, son of Asaph, was the head, who began the thanksgiving in prayer; and Bakbukiah was second among his brothers; and Abda son of Shammua, son of Galal, son of Jeduthun.
translation:
  language: tl
  text: Si Matanias na anak ni Mica, na anak ni Zabdi, na anak ni Asaf, ang pinuno sa pagsisimula ng pasasalamat sa panalangin[a]. Si Bakbukias ang pangalawa sa kanyang mga kapatid. Si Abda ay anak ni Samua, na anak ni Galal, na anak ni Jedutun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin, “ang pinuno, na siyang nagpasimula ng pasasalamat sa panalangin.” Mas literal: “pinuno ng pasimula, nagpapasalamat sa panalangin.” Ipinahihiwatig ng Hebreo na si Matanias ang nanguna o nagpasimula ng pasasalamat, ngunit siksik ang pagkakabuo ng parirala.'
    reason: Pinananatili ang sintaktikong siksik at bahagyang malabong ugnayan ng “pinuno,” “pasimula,” at “nagpapasalamat” sa Hebreo.
lexical_decisions:
- source_word: רֹאשׁ
  choice: pinuno
  rationale: Tumutukoy ito sa nangungunang tungkulin ni Matanias; mas likas sa makabagong Filipino ang “pinuno” kaysa sa literal na metaporang “ulo.”
- source_word: הַתְּחִלָּה
  choice: nagpapasimula
  rationale: Ang pangngalang “pasimula” ay kaugnay ng רֹאשׁ at ng kasunod na gawaing liturhiko. Ginawang pandiwa upang malinaw at natural na ipahayag ang kanyang tungkuling manguna o magpasimula.
- source_word: יְהוֹדֶה
  choice: ng pasasalamat
  rationale: Sa konteksto ng pagsamba, ang Hiphil ng ידה ay tumutukoy sa pagpapasalamat o pagpuri. Ang “pasasalamat” ay angkop dito nang hindi ipinapasok ang di-gaanong malamang na kahulugang “pag-amin.”
- source_word: לַתְּפִלָּה
  choice: sa panalangin
  rationale: Likas nitong ipinahahayag sa Filipino ang kaugnayan ng pasasalamat sa gawaing panalangin, habang hindi labis na tinutukoy ang eksaktong ritwal na anyo.
- source_word: מִשְׁנֶה
  choice: pangalawa
  rationale: Pinananatili nito ang posisyong ikalawa o sekundaryong ranggo nang hindi nagpapasya kung pormal siyang kinatawan o kahalili.
- source_word: מֵאֶחָיו
  choice: sa kanyang mga kapatid
  rationale: Pinananatili ang literal na wikang pampangkat o pampamilya ng Hebreo; maaaring mga kamag-anak o kapwa Levita ang tinutukoy, ngunit hindi iyon tahasang nililinaw sa salin.
- source_word: יְדִיתוּן
  choice: Jedutun
  rationale: Transliterasyong angkop sa bigkas at baybay sa Filipino ng pangalang Hebreo.
theological_decisions:
- issue: Kahulugan ng ידה sa konteksto ng pagsamba
  choice: pasasalamat
  alternative: pagpuri o pag-amin
  rationale: Pinapaboran ng konteksto ng paglilingkod sa templo at ng angkan ni Asaf ang pasasalamat o pagpuri. Pinili ang “pasasalamat” ngunit kinikilala sa talababa ang posibleng mas pandiwang pagbasa.
- issue: Eksaktong tungkulin ni Matanias sa panalangin
  choice: pinunong nagpapasimula ng pasasalamat
  alternative: pinuno ng pasimula, na nagpapasalamat sa panalangin
  rationale: Malabo at siksik ang pariralang Hebreo. Inihahayag ng pangunahing salin ang malamang na tungkulin niyang manguna sa pagsisimula, samantalang pinananatili sa talababa ang mas literal na anyo at ang posibilidad na siya mismo ang nagpapasalamat.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “na anak ni” sa magkakasunod na talaangkanan upang maiwasan ang malabong pagtukoy, at hinati sa maiikling pangungusap para sa likas na daloy nang hindi inaalis ang alinmang pangalan o tungkulin.
