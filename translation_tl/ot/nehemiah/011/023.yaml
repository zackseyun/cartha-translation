translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “mga mang-aawit,” ang karaniwang katawagan sa pangkat na may tungkuling umawit sa paglilingkod sa templo. Inilapit sa natural na Filipino ang mga idyomang Hebreo, habang inilagay sa mga talababa ang tunay na mga alternatibong kahulugan.
