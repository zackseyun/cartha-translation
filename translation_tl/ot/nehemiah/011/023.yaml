base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/023.yaml
  text: For the king’s command was upon them[a], and a fixed provision for the singers[b], each day’s matter on its day.
translation:
  language: tl
  text: Sapagkat may utos ang hari para sa kanila, at may nakatakdang laan[a] para sa mga mang-aawit, para sa pangangailangan ng bawat araw[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “nakatakdang laan” ay maaari ring mangahulugang “tiyak na kaayusan” o “itinatag na pananagutan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang bagay ng isang araw sa araw nito”; maaari ding isaling “ang takdang bahagi para sa bawat araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag kaugnay ng naunang pahayag at natural na naghahatid ng ugnayang sanhi o batayan sa Filipino.
- source_word: מִצְוַת הַמֶּלֶךְ עֲלֵיהֶם
  choice: may utos ang hari tungkol sa kanila
  rationale: Ipinahahayag nito ang awtoritatibong tagubilin ng hari na sumasaklaw sa kanila, nang hindi pinipilit ang literal ngunit di-likas na larawang 'nasa ibabaw nila.'
- source_word: וַאֲמָנָה
  choice: may nakatakdang laan
  rationale: Sa kontekstong administratibo, malamang na tumutukoy ito sa matatag o opisyal na kaayusan ng paglalaan; pinananatili sa talababa ang mas malawak na posibilidad na 'tiyak na kaayusan' o 'itinatag na pananagutan.'
- source_word: עַל הַמְשֹׁרְרִים
  choice: para sa mga mang-aawit
  rationale: Sa konteksto, ang עַל ay nagpapahiwatig kung para kanino o tungkol kanino ang laan; ito ang pinakanatural na Filipino.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ayon sa pangangailangan sa bawat araw
  rationale: Ang idyoma ay tumutukoy sa bagay, takdang bahagi, o pangangailangan ng bawat araw; malinaw at natural ang salin habang pinananatili ang araw-araw na ritmo ng paglalaan.
