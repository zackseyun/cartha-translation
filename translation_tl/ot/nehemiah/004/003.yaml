  text: So we prayed to our God and stationed a guard against them day and night because of them[a][b].
translation:
  language: tl
  text: Kaya nanalangin kami sa aming Diyos at nagtalaga kami ng bantay[a] laban sa kanila araw at gabi dahil sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagtalaga kami ng pagbabantay laban sa kanila.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa harap nila”; maaari ring “dahil sa kanila” o “dahil sa presensiya nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּתְפַּלֵּל
  choice: nanalangin kami
  rationale: Ang Hitpael ng פלל ay karaniwang nangangahulugang manalangin. Hindi dinaragdagan ng tinding wala naman sa pandiwa.
- source_word: אֶל אֱלֹהֵינוּ
  choice: sa aming Diyos
  rationale: Likas sa modernong Tagalog ang “manalangin sa,” at pinananatili ng “aming” ang panlaping unang panauhang maramihan.
- source_word: וַנַּעֲמִיד מִשְׁמָר
  choice: naglagay ng mga bantay
  rationale: Ipinahihiwatig ng Hiphil ng עמד ang pagtatalaga o paglalagay sa puwesto; ang מִשְׁמָר ay maaaring tumukoy sa bantay o pagbabantay. Ang maramihang “mga bantay” ay natural sa Tagalog para sa kolektibong puwersang nagbabantay.
- source_word: עֲלֵיהֶם
  choice: laban sa kanila
  rationale: Bagaman malawak ang saklaw ng עַל, ipinakikita ng konteksto ng paghadlang ng mga kaaway ang diwang pagsalungat o pag-iingat laban sa kanila.
- source_word: יוֹמָם וָלַיְלָה
  choice: araw at gabi
  rationale: Karaniwang parirala ito para sa tuloy-tuloy na pagbabantay at natural na katumbas sa Tagalog.
- source_word: מִפְּנֵיהֶם
  choice: dahil sa kanila
  rationale: Literal itong “mula sa harap nila/presensiya nila,” ngunit dito ay nagbibigay ng dahilan. Hindi nito ipinapasok ang takot bilang motibong hindi tahasang sinabi.
theological_decisions:
- issue: Ang tugon sa pagsalungat
  choice: Magkatambal na inilahad ang pananalangin sa Diyos at ang praktikal na pagbabantay.
  alternative: Idiing tanging panalangin lamang o tanging paghahandang pandepensa lamang ang tugon.
  rationale: 'Dalawang magkaugnay na kilos ang nasa Hebreo: nanalangin sila at nagtalaga sila ng bantay. Pinananatili ng salin ang tensiyong ito nang hindi pinapaboran ang isa.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Kaya” upang ikabit ang tugon sa naunang banta. Ang “mga bantay” ay mas likas kaysa sa abstraktong “isang pagbabantay,” habang nililinaw sa talababa ang kolektibong diwa.
