base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/010.yaml
  text: And from that day on[a], half of my young men were doing the work, and half of them were holding the spears, the shields, the bows, and the armor[c][b]; and the officers were behind all the house of Judah.
translation:
  language: tl
  text: Mula sa araw na iyon, kalahati ng aking mga tauhan[a] ay gumagawa ng gawain, at kalahati naman ay may hawak na mga sibat, mga kalasag, mga pana, at mga baluti[b]. Ang mga pinuno ay nasa likuran ng buong sambahayan ng Juda.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking mga kabataang lalaki,” “aking mga lingkod,” o “aking mga kasama.” Malawak ang saklaw ng salitang Hebreo at nakasalalay sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga baluti” ay mga baluting isinusuot sa katawan; maaari itong tumukoy sa kutamaya o baluti sa dibdib, ngunit hindi tiyak dito ang anyo nito.
    reason: lexical_alternative
  - marker: c
    text: Ang mga pinuno na “nasa likuran” ng buong sambahayan ng Juda ay maaaring nakapuwesto roon upang magbigay ng suportang militar o mangasiwa sa mga manggagawa.
    reason: cultural_note
lexical_decisions:
- source_word: נְעָרַי
  choice: aking mga tauhan
  rationale: Maaaring tumukoy ang נַעַר sa mga kabataang lalaki, lingkod, tagapaglingkod, o mga tauhan ng isang pinuno. Sa kontekstong paggawa at pagtatanggol, likas at sapat na malawak ang “mga tauhan,” habang pinananatili sa talababa ang ibang posibleng diwa.
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: ang gumagawa
  rationale: Tumutukoy ang parirala sa aktuwal na pagsasagawa ng gawaing pagtatayo; malinaw ito sa konteksto at natural sa modernong Tagalog.
- source_word: מַחֲזִיקִים
  choice: ang may hawak
  rationale: Tuwirang ipinapahayag ang paghawak o pagdadala ng mga sandata nang hindi dinaragdagan ang Hebreo ng ideyang “nasasandatahan.”
- source_word: הָרְמָחִים
  choice: mga sibat
  rationale: Karaniwan at malinaw na katumbas ng רֹמַח sa kontekstong militar.
- source_word: הַמָּגִנִּים
  choice: kalasag
  rationale: Ang “kalasag” ang natural at pangkalahatang salin ng מָגֵן.
- source_word: הַקְּשָׁתוֹת
  choice: pana
  rationale: Tuwirang katumbas ng קֶשֶׁת at nauunawaan sa modernong Filipino.
- source_word: הַשִּׁרְיֹנִים
  choice: baluting panangga
  rationale: Tinutukoy ng שִׁרְיוֹן ang baluting isinusuot sa katawan. Iniiwasan ng pangkalahatang saling ito ang labis na pagtukoy kung ito ay kutamaya o baluti sa dibdib.
- source_word: הַשָּׂרִים
  choice: mga pinuno
  rationale: Maaaring mangahulugan ang שַׂר ng pinuno, opisyal, o kumander. Ang “mga pinuno” ay dignified at hindi labis na nagpapasiya sa tiyak nilang tungkuling militar.
- source_word: אַחֲרֵי כָּל בֵּית יְהוּדָה
  choice: nasa likuran ng buong sambahayan ng Juda
  rationale: Pinananatili ang spatial na kahulugan ng אַחֲרֵי at ang korporatibong larawan ng בֵּית יְהוּדָה, sa halip na tahasang ipakahulugang “sumusuporta,” na posible ngunit hindi hayag.
theological_decisions:
- issue: Kahulugan ng pagiging nasa likuran ng mga pinuno
  choice: 'Pinanatili ang literal na posisyon: “nasa likuran.”'
  alternative: “sumusuporta sa” o “nagbabantay sa likuran ng”
  rationale: Hindi tahasang sinasabi ng Hebreo kung ang posisyon ay para sa suporta, pangangasiwa, o proteksiyong militar; kaya hindi nilutas sa pangunahing teksto ang ganitong tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling basahin. Ginamit ang “mga tauhan” sa halip na mas makitid na “mga kabataang lalaki” o domestikadong “mga lingkod.” Pinanatili ang “sambahayan ng Juda” bilang korporatibong ekspresyon at ang “nasa likuran” upang huwag magdagdag ng kilos na wala sa Hebreo.
