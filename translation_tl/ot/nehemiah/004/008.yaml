  verdict: revise
  source_fidelity: Ang dagdag na “ang kalagayan” sa pambungad ay walang tahasang katapat sa Hebreo. Bagaman mahihinuha ito sa konteksto, hindi kailangan ang pagpapalawak; mas tapat ang pagpapanatili ng di-tiyak na layon ng וָאֵרֶא. Ang iba pang mahahalagang elemento—mga maharlika, mga opisyal, utos na huwag matakot, Adonai bilang Panginoon, at ang sunod-sunod na talaan ng mga ipagtatanggol—ay wastong naipapahayag.
  naturalness: Natural at marangal ang pangunahing rehistro. Ang “Nang makita ko, tumayo ako” ay katanggap-tanggap na Tagalog na may kontekstuwal na ipinahihiwatig na layon at iniiwasan ang di-kailangang pagdaragdag. Ang “natitirang mga tao” ay mas eksaktong katumbas ng “ang nalalabi/iba pang bahagi ng bayan” kaysa “iba pang mga tao.”
  terminology: Ang “Panginoon” ay angkop para sa אֲדֹנָי. Ang “dakila at kasindak-sindak” ay mahusay na naghahatid ng matindi at mapitagang puwersa ng הַנּוֹרָא. Ang “mga kapatid na lalaki” ay isang lehitimong tahasang pagsasalin ng panlalaking maramihang anyo, at ang “mga anak na lalaki/mga anak na babae” ay pinananatiling magkahiwalay ayon sa Hebreo.
  issues:
