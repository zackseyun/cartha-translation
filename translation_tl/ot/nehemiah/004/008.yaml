base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/008.yaml
  text: Then I looked[a], rose up, and said to the nobles, to the officials, and to the rest of the people, “Do not be afraid of them. Remember the Lord, who is great and fearsome, and fight for your brothers, your sons, your daughters, your wives[b], and your houses.”
translation:
  language: tl
  text: Nang makita ko, tumayo ako at sinabi sa mga maharlika, sa mga opisyal, at sa natitirang mga tao, “Huwag kayong matakot sa kanila. Alalahanin ninyo ang Panginoon, na dakila at kasindak-sindak[a], at ipaglaban ninyo ang inyong mga kapatid na lalaki[b], mga anak na lalaki, mga anak na babae, mga asawa, at mga bahay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kakila-kilabot” o “pumupukaw ng matinding paggalang at takot.” Ang salitang Hebreo ay maaaring tumukoy sa nagdudulot ng sindak o pagpipitagan.
    reason: lexical_alternative
  - marker: b
    text: Panlalaking maramihan ang salitang Hebreo; kaya nilinaw rito na mga kapatid na lalaki ang tinutukoy.
    reason: gender_accuracy
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Pagkatapos kong masdan ang kalagayan
  rationale: Ang ראה ay maaaring mangahulugang ‘nakita’ o ‘tumingin.’ Walang tahasang layon sa Hebreo; idinagdag ang ‘ang kalagayan’ bilang likas na pahiwatig ng konteksto, habang itinatala sa talababa ang mas literal na anyo.
- source_word: וָאָקוּם
  choice: tumayo ako
  rationale: Ipinapahayag ng קום ang tiyak at mapagpasiyang pagkilos ni Nehemias; natural at tuwiran sa modernong Tagalog ang ‘tumayo ako.’
- source_word: הַחֹרִים
  choice: mga maharlika
  rationale: Tumutukoy ang חֹרִים sa mga taong may mataas na katayuan sa lipunan. Pinananatili ng ‘mga maharlika’ ang pagkakaiba nila sa kasunod na mga opisyal.
- source_word: הַסְּגָנִים
  choice: mga opisyal
  rationale: Ang סְגָנִים ay mga tagapangasiwa o nakabababang pinuno; malinaw at kasalukuyang gamit ang ‘mga opisyal.’
- source_word: יֶתֶר הָעָם
  choice: iba pang mga tao
  rationale: Likas itong salin ng pangkat na natitira matapos pangalanan ang mga maharlika at opisyal.
- source_word: אַל תִּירְאוּ מִפְּנֵיהֶם
  choice: Huwag kayong matakot sa kanila
  rationale: Tuwirang ipinahahayag ang pagbabawal na matakot sa harap ng mga kalaban.
- source_word: אֶת אֲדֹנָי
  choice: ang Panginoon
  rationale: Ang אֲדֹנָי ay banal na titulong ‘Panginoon,’ hindi ang pangalang יהוה.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: na dakila at kasindak-sindak
  rationale: Ang נוֹרָא ay naglalarawan sa isang pumupukaw ng matinding paggalang at takot. Pinananatili ng ‘kasindak-sindak’ ang masidhing puwersa nito.
- source_word: זְכֹרוּ
  choice: Alalahanin ninyo
  rationale: Tuwiran at mabigat na utos ang זכר; natural sa Tagalog ang ‘alalahanin ninyo.’
- source_word: וְהִלָּחֲמוּ עַל
  choice: at ipaglaban ninyo
  rationale: Sa kontekstong ito, ang utos kasama ng עַל ay pakikipaglaban upang ipagtanggol ang mga binanggit.
- source_word: אֲחֵיכֶם
  choice: inyong mga kapatid na lalaki
  rationale: Panlalaking maramihan ang terminong Hebreo. Nililinaw ng ‘na lalaki’ ang kasariang tahasang ipinahahayag sa pinagmulan.
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם נְשֵׁיכֶם וּבָתֵּיכֶם
  choice: mga anak na lalaki, mga anak na babae, mga asawa, at mga bahay
  rationale: Pinananatili ang kongkreto at sunud-sunod na talaan, pati ang pagkakaiba ng mga anak na lalaki at babae. Ang ‘mga bahay’ ay maaari ring magpahiwatig ng sambahayan o tirahan.
theological_decisions:
- issue: Pagsasalin sa banal na titulong אֲדֹנָי
  choice: ang Panginoon
  alternative: ang Panginoong Diyos / ang Amo
  rationale: Titulong pantukoy sa Diyos ang אֲדֹנָי, ngunit hindi ito ang Tetragrammaton. Ang ‘Panginoon’ ang malinaw at tradisyonal na katumbas nang hindi ipinagkakamali sa יהוה.
- issue: Lakas ng kahulugan ng הַנּוֹרָא
  choice: kasindak-sindak
  alternative: kamangha-mangha / kahanga-hanga
  rationale: Pinag-iiba ng talata ang takot sa mga kalaban at ang pagkilala sa Diyos na pumupukaw ng banal na sindak. Hindi nilalabnaw ng ‘kasindak-sindak’ ang tensiyong iyon.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang maramihang ‘kayo/ninyo’ ayon sa mga kausap. Iniwasan ang sobrang arkaikong pananalita, ngunit pinanatili ang bigat ng utos at ang matinding kahulugan ng paglalarawan sa Panginoon.
