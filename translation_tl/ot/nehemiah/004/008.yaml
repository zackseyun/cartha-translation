    issue: Idinagdag ang “ang kalagayan” bilang layon ng “masdan.”
    rationale: Walang ipinahahayag na layon ang וָאֵרֶא sa Hebreo. Ang konteksto ay nagpapahintulot ng isang ipinahihiwatig na layon, ngunit ang tahasang “kalagayan” ay interpretatibong pagpapalawak at hindi kailangan para maging malinaw ang Tagalog.
  - severity: low
    issue: Ang “iba pang mga tao” ay hindi gaanong tiyak na katumbas ng יֶתֶר הָעָם.
    rationale: Ang parirala ay tumutukoy sa natitirang bahagi ng bayan matapos banggitin ang mga pinuno. Mas tumpak ang “natitirang mga tao.”}],
