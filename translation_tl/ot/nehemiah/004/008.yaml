revisions:
- from: Pagkatapos kong masdan[a] ang kalagayan, tumayo ako at sinabi sa mga maharlika, sa mga opisyal, at sa iba pang mga tao, “Huwag kayong matakot sa kanila. Alalahanin ninyo ang Panginoon, na dakila at kasindak-sindak[b], at ipaglaban ninyo ang inyong mga kapatid na lalaki[c], mga anak na lalaki, mga anak na babae, mga asawa, at mga bahay.”
  to: Nang makita ko, tumayo ako at sinabi sa mga maharlika, sa mga opisyal, at sa natitirang mga tao, “Huwag kayong matakot sa kanila. Alalahanin ninyo ang Panginoon, na dakila at kasindak-sindak[a], at ipaglaban ninyo ang inyong mga kapatid na lalaki[b], mga anak na lalaki, mga anak na babae, mga asawa, at mga bahay.”
  rationale: Inalis ang tahasang “ang kalagayan” upang hindi magdagdag ng layon na wala sa Hebreo, at pinalitan ang “iba pang mga tao” ng “natitirang mga tao” upang mas maipakita ang pagkakaiba ng natitirang bayan mula sa mga maharlika at opisyal. Inilipat ang marka ng talababa tungkol sa “kasindak-sindak” sa mismong salitang ipinapaliwanag at inalis ang talababa na nakatali lamang sa dating pagpapalawak.
