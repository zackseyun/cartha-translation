base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/007.yaml
  text: Then I stationed men in the lowest parts of the place[a], behind the wall, in the exposed areas; and I stationed the people by families, with their swords, their spears, and their bows.
translation:
  language: tl
  text: Kaya nagtalaga ako ng mga tao sa pinakamababang bahagi ng lugar, sa likod ng pader, sa mga lantad na bahagi[a]. Itinalaga ko ang mga tao ayon sa kani-kanilang pamilya, kasama ang kanilang mga espada, sibat, at pana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga bukás o walang-takip na lugar.” Bihira ang salitang Hebreo at maaaring tumukoy sa mga lantad na bahaging madaling salakayin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעֲמִיד
  choice: nagtalaga ako
  rationale: Ang Hiphil ng עמד ay nagpapahiwatig ng pagpapuwesto sa mga tao. Likas sa modernong Filipino ang “nagtalaga” sa konteksto ng organisadong depensa.
- source_word: מִתַּחְתִּיּוֹת לַמָּקוֹם
  choice: sa pinakamababang bahagi ng lugar
  rationale: Pinananatili nito ang pangunahing diwang heograpiko ng תחת bilang mababa o pinakamababang bahagi nang hindi tiyak na ipinapakahulugang mahina o bulnerableng seksiyon.
- source_word: מֵאַחֲרֵי לַחוֹמָה
  choice: sa likod ng pader
  rationale: Tuwiran at natural na katumbas ng posisyong nasa likuran ng pader.
- source_word: בצחחיים
  choice: sa mga lantad na bahagi
  rationale: Ang bihirang salitang ito ay malamang na tumutukoy sa hubad, bukás, o walang-takip na mga lugar. Ang “lantad” ay angkop sa kontekstong militar ngunit pinananatili sa talababa ang kawalang-katiyakan.
- source_word: וָאַעֲמִיד אֶת־הָעָם
  choice: Itinalaga ko ang mga tao
  rationale: Pinananatili ang pag-uulit ng pandiwa sa Hebreo upang maipakita ang sinadyang pag-aayos ng depensa.
- source_word: לְמִשְׁפָּחוֹת
  choice: ayon sa kani-kanilang pamilya
  rationale: Malinaw na ipinahihiwatig ang pagbuo ng mga pangkat batay sa pamilya; hindi nito ipinipilit ang mas teknikal na “angkan.”
- source_word: עִם חַרְבֹתֵיהֶם רָמְחֵיהֶם וְקַשְּׁתֹתֵיהֶם
  choice: na may mga espada, sibat, at pana
  rationale: Natural at madaling maunawaang talaan ng tatlong uri ng sandata; sapat na sa Filipino ang kolektibong pagmamay-ari sa konteksto.
