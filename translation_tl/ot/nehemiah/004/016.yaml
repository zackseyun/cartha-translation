  text: Also at that time I said to the people[a], “Let each man and his servant spend the night within Jerusalem[b], and let them be a guard for us by night and workers by day.”
translation:
  language: tl
  text: Noon ding panahong iyon, sinabi ko sa mga tao, “Bawat lalaki at ang kanyang katulong[a] ay magpalipas ng gabi sa loob ng Jerusalem, upang magbantay sila para sa atin sa gabi at magtrabaho sa araw.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring mangahulugang “kabataang lalaki,” “lingkod,” “tagapaglingkod,” o “tauhan,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בָּעֵת הַהִיא
  choice: Nang panahong iyon ... rin
  rationale: Pinananatili ng “rin” ang pandagdag na diwa ng גַּם, samantalang natural sa modernong Tagalog ang temporal na pariralang “Nang panahong iyon.”
- source_word: אָמַרְתִּי לָעָם
  choice: sinabi ko ... sa mga tao
  rationale: Tuwirang katumbas ito ng Hebreong pandiwa at malinaw na ipinakikilala ang utos ni Nehemias.
- source_word: אִישׁ וְנַעֲרוֹ
  choice: ang bawat lalaki at ang kanyang katulong
  rationale: Distributibo ang אִישׁ dito. Sa konteksto ng pagbabantay at paggawa, ipinahahayag ng “katulong” ang nakababatang tauhan, lingkod, o tagapaglingkod nang hindi sapilitang itinatakda ang edad.
- source_word: יָלִינוּ
  choice: magpalipas ng gabi
  rationale: Natural na Tagalog para sa pananatili o pagtulog sa isang lugar nang magdamag.
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: sa loob ng Jerusalem
  rationale: Malinaw na pinananatili ang lokasyong nasa loob ng lungsod.
- source_word: וְהָיוּ לָנוּ
  choice: upang sila ay maging ... natin
  rationale: Ipinahahayag ang layunin o bungang inaasahan mula sa naunang utos; ang Hebreong pagkakaugnay ay maaari ring unawaing payak na koordinasyon.
- source_word: הַלַּיְלָה מִשְׁמָר
  choice: bantay natin sa gabi
  rationale: Ang מִשְׁמָר ay tumutukoy sa pagbabantay o tungkuling magbantay; malinaw ang proteksiyong tungkulin sa konteksto.
- source_word: וְהַיּוֹם מְלָאכָה
  choice: magtrabaho sa araw
  rationale: Pinananatili ang abstraktong diwa ng מְלָאכָה bilang paggawa, habang natural sa Tagalog ang pandiwang anyo at malinaw ang kaagapay na gabi/araw.
