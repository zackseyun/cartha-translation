  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang bahagyang makatang larawan ng bukang-liwayway at paglitaw ng mga bituin, habang ginawang natural ang paglalarawan sa nagpapatuloy at magkasabay na mga kilos.
