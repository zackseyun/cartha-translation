  text: So we kept doing the work[a], while half of them held the spears from the rising of the dawn until the coming out of the stars.
translation:
  language: tl
  text: Kaya nagpatuloy kami sa gawain, samantalang ang kalahati sa kanila ay may hawak na mga sibat mula sa pagsikat ng bukang-liwayway hanggang sa paglitaw ng mga bituin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas natural na pananalita, “mula madaling-araw hanggang sa paglabas ng mga bituin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: nagpatuloy kami sa gawain
  rationale: Ang participle na עֹשִׂים sa daloy ng salaysay ay nagpapahayag ng nagpapatuloy na kilos. Likas sa modernong Tagalog ang “nagpatuloy kami sa gawain” at hindi nito labis na nililimitahan ang gawain sa isang partikular na uri ng konstruksiyon.
- source_word: וְחֶצְיָם
  choice: samantalang kalahati sa kanila
  rationale: Pinananatili ng “kanila” ang ikatlong panauhang hulapi ng Hebreo, sa halip na baguhin ito bilang “kalahati sa amin.” Ipinakikita ng “samantalang” na magkasabay ang dalawang kilos.
- source_word: מַחֲזִיקִים בָּרְמָחִים
  choice: may hawak na mga sibat
  rationale: Ipinahihiwatig ng participle ang patuloy na paghawak o pagdadala. Ang “may hawak na mga sibat” ay natural at malinaw sa Tagalog habang pinananatili ang larawang militar.
- source_word: מֵעֲלוֹת הַשַּׁחַר
  choice: mula sa pagsikat ng bukang-liwayway
  rationale: Pinananatili nito ang kongkretong larawan ng pag-ahon o pagsikat ng bukang-liwayway, sa halip na paikliin agad bilang “mula madaling-araw.”
- source_word: עַד צֵאת הַכּוֹכָבִים
  choice: hanggang sa paglitaw ng mga bituin
  rationale: Ang צֵאת ay literal na paglabas o paglitaw. Malinaw na naihahatid ng “paglitaw” ang paglabas ng mga bituin nang hindi ito pinapalitan ng mas interpretatibong “hanggang gabi.”
