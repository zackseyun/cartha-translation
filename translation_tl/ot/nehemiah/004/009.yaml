source:
  edition: WLC
  text: וַ/יְהִ֞י כַּֽ/אֲשֶׁר שָׁמְע֤וּ אוֹיְבֵ֨י/נוּ֙ כִּי נ֣וֹדַֽע לָ֔/נוּ וַ/יָּ֥פֶר הָ/אֱלֹהִ֖ים אֶת עֲצָתָ֑/ם ו/נשוב כֻּלָּ֨/נוּ֙ אֶל הַ֣/חוֹמָ֔ה אִ֖ישׁ אֶל מְלַאכְתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/009.yaml
  text: And it happened that when our enemies heard that it had become known to us[a], and that God had frustrated their plan, we all returned to the wall[c][b], each man to his work.
translation:
  language: tl
  text: Nang marinig ng aming mga kaaway na nalaman na namin ang kanilang balak[a] at binigo ng Diyos ang kanilang plano[b], bumalik kaming lahat sa pader, bawat isa sa kani-kaniyang gawain[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na ito ay nalaman na namin” o “na ito ay naging alam sa amin.” Ang “kanilang balak” ay ipinahihiwatig ng konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “pinigilan ng Diyos ang kanilang balak” o “pinawalang-bisa ng Diyos ang kanilang payo.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “bawat isa sa kanyang gawain,” isang distributibong pananalita para sa mga manggagawa nang isa-isa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Ang pinagsamang pormulang pasalaysay at pang-ugnay na temporal ay likas na naipapahayag sa modernong Tagalog sa pamamagitan ng “Nang,” nang hindi gumagamit ng mabigat o makalumang pambungad.
- source_word: אוֹיְבֵינוּ
  choice: aming mga kaaway
  rationale: Tuwirang katumbas ng pangngalang may hulaping unang panauhang maramihan.
- source_word: כִּי נוֹדַע לָנוּ
  choice: na nalaman na namin ang kanilang balak
  rationale: Ipinahahayag nang natural sa Tagalog ang diwa na ang lihim na balak ay naging alam ng pangkat. Ginawang tahasan ang ipinahihiwatig na layon ayon sa konteksto, habang itinatala sa talababa ang mas literal na anyo.
- source_word: וַיָּפֶר
  choice: binigo
  rationale: Sa konteksto ng עֵצָה, nangangahulugan itong pawalang-bisa o hadlangan ang bisa ng isang plano; ang “binigo” ay malinaw at natural.
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Tumutukoy sa Diyos ng Israel; hindi kailangan ang pantukoy sa karaniwang gamit ng Tagalog sa pangalang “Diyos.”
- source_word: עֲצָתָם
  choice: kanilang plano
  rationale: Ang עֵצָה ay maaaring “payo,” “panukala,” o “plano”; “plano” ang pinakanababagay sa balak na paglusob sa konteksto.
- source_word: וְנָשׁוּב כֻּלָּנוּ
  choice: bumalik kaming lahat
  rationale: Natural na Tagalog para sa pagbabalik ng buong pangkat sa dati nilang gawain.
- source_word: אֶל הַחוֹמָה
  choice: sa pader
  rationale: Tumutukoy sa pader ng Jerusalem na kanilang muling itinatayo.
- source_word: אִישׁ אֶל מְלַאכְתּוֹ
  choice: bawat isa sa kani-kaniyang gawain
  rationale: Pinananatili ang distributibong diwa ng Hebreo sa natural at inklusibong Tagalog; hindi kailangang gawing “bawat lalaki” sapagkat ang אִישׁ dito ay gumaganap bilang distributibong pananalita.
theological_decisions:
- issue: Tuwirang pagkilos ng Diyos
  choice: binigo ng Diyos ang kanilang plano
  alternative: napigilan ang kanilang plano dahil sa mga pangyayari
  rationale: Tahasang iniuugnay ng tekstong Hebreo sa Diyos ang pagpapawalang-bisa sa plano ng mga kaaway; hindi ito pinalalabnaw bilang di-tiyak na pagkakataon o pangyayari.
- issue: Distributibong אִישׁ
  choice: bawat isa
  alternative: bawat lalaki
  rationale: Sa pariralang ito, ang panlalaking isahan ay distributibo at tumutukoy sa bawat manggagawa. Ang “bawat isa” ay tumpak sa gamit at mas natural sa modernong Tagalog nang hindi binabago ang saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at likas basahin. Iniwasan ang makalumang “at nangyari” dahil sapat na ang temporal na “Nang” sa daloy ng salaysay. Pinanatili ang tuwirang pagkilos ng Diyos at ang kolektibo ngunit distributibong pagbabalik ng mga manggagawa.
