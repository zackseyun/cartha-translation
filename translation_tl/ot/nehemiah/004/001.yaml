  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר שָׁמַ֣ע סַנְבַלַּ֡ט וְ֠/טוֹבִיָּה וְ/הָ/עַרְבִ֨ים וְ/הָ/עַמֹּנִ֜ים וְ/הָ/אַשְׁדּוֹדִ֗ים כִּֽי עָלְתָ֤ה אֲרוּכָה֙ לְ/חֹמ֣וֹת יְרוּשָׁלִַ֔ם כִּי הֵחֵ֥לּוּ הַ/פְּרֻצִ֖ים לְ/הִסָּתֵ֑ם וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/001.yaml
  text: When Sanballat and Tobiah and the Arabs and the Ammonites and the Ashdodites heard that the repair of Jerusalem’s walls had gone up[a], that the breaches had begun to be closed[b], they became very angry.
translation:
  language: tl
  text: Nang mabalitaan nina Sanbalat at Tobias at ng mga Arabo, mga Ammonita, at mga taga-Asdod na umuusad na ang pagkukumpuni sa mga pader ng Jerusalem[a] at nagsimula nang maisara ang mga puwang sa mga ito[b], labis silang nagalit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umuusad ang pagpapanumbalik ng mga pader ng Jerusalem.” Ang salitang Hebreo ay karaniwang nauugnay sa paggaling o pagpapanumbalik at ginamit dito bilang paglalarawan sa pagkukumpuni.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga sirang bahagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Nang
  rationale: Likas na panandang temporal sa modernong Tagalog para sa pagbubukas ng bagong tagpo; hindi na kailangang isalin nang kahoy bilang “At nangyari nang.”
- source_word: שָׁמַע
  choice: mabalitaan
  rationale: Sa konteksto, tumutukoy ito sa pagtanggap ng balita. Mas natural dito ang “mabalitaan” kaysa sa literal na “marinig,” nang hindi binabago ang diwa.
- source_word: סַנְבַלַּט וְטוֹבִיָּה
  choice: Sanbalat at Tobias
  rationale: Ginamit ang mga anyo ng pangalang madaling makilala at karaniwan sa tradisyong Filipino.
- source_word: הָעַרְבִים
  choice: mga Arabo
  rationale: Ito ang malinaw at kasalukuyang katawagan sa pangkat ng mga Arab.
- source_word: הָעַמֹּנִים
  choice: mga Ammonita
  rationale: Karaniwang katawagang Filipino para sa mga mamamayan ng Ammon.
- source_word: הָאַשְׁדּוֹדִים
  choice: mga taga-Asdod
  rationale: Natural na Filipino ang “mga taga-Asdod” at malinaw nitong ipinahihiwatig ang mga taong kaugnay ng lungsod ng Asdod.
- source_word: עָלְתָה אֲרוּכָה
  choice: umuusad ang pagkukumpuni
  rationale: Ipinahahayag nito kapuwa ang pag-abante na nasa עָלְתָה at ang metaporikal na pagkukumpuni o pagpapanumbalik na nasa אֲרוּכָה, sa natural na Tagalog.
- source_word: לְחֹמוֹת יְרוּשָׁלִַם
  choice: sa mga pader ng Jerusalem
  rationale: Natural na pagpapahayag ng kaugnayan ng pagkukumpuni sa mga pader.
- source_word: הַפְּרֻצִים
  choice: mga puwang
  rationale: Tumutukoy sa mga bahaging nabutas o nabuksan sa pader. Madaling maunawaan ang “mga puwang,” habang itinatala sa talababa ang mas teknikal na alternatibo.
- source_word: לְהִסָּתֵם
  choice: maisara
  rationale: Pinananatili ang pasibong diwa ng Niphal at natural na naglalarawan sa pagsasara ng mga puwang sa pader.
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: labis silang nagalit
  rationale: Direkta at natural na salin ng idyomang Hebreo na nagsasaad ng matinding galit.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mabalitaan” at “mga taga-Asdod” para sa likas na daloy, habang pinanatili sa mga talababa ang metapora ng paggaling/pagpapanumbalik at ang saklaw ng kahulugan ng mga puwang sa pader.
