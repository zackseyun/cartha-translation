  text: And the builders each had his sword strapped at his side while they built[a], and the one blowing the trumpet was beside me.
translation:
  language: tl
  text: Ang bawat isa sa mga nagtatayo ay may espadang nakatali sa kanyang baywang habang sila'y nagtatayo, at ang umiihip ng trumpeta[a] ay nasa tabi ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “shofar,” isang sungay ng lalaking tupa na hinihipan bilang trumpeta.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים / וּבוֹנִים
  choice: mga nagtatayo / habang sila'y nagtatayo
  rationale: Ang unang participle ay tumutukoy sa mga taong gumagawa, samantalang ang ikalawa ay naglalarawan sa nagpapatuloy nilang gawain. Pinananatili ng salin ang pag-uulit ng ugat na בנה sa natural na Tagalog.
- source_word: אִישׁ
  choice: ang bawat isa
  rationale: 'Distributibo ang gamit dito: bawat indibidwal sa pangkat ng mga nagtatayo.'
- source_word: חַרְבּוֹ
  choice: may espadang
  rationale: Ang חֶרֶב ay karaniwang nangangahulugang “espada,” at ipinahihiwatig ng hulaping panghalip na pag-aari ito ng bawat manggagawa.
- source_word: אֲסוּרִים עַל מָתְנָיו
  choice: nakatali sa kanyang baywang
  rationale: Ang אסר ay nangangahulugang itali o ikabit, at ang מָתְנַיִם ay tumutukoy sa baywang. Malinaw at likas sa Tagalog ang paglalarawan sa espadang nakahanda roon.
- source_word: וְהַתּוֹקֵעַ בַּשּׁוֹפָר
  choice: at ang umiihip ng trumpeta
  rationale: Pinananatili ang pandiwang anyo ng participle na תקע. Ginamit ang mas madaling maunawaang “trumpeta” sa teksto, habang nililinaw sa talababa na shofar ang partikular na instrumento.
- source_word: אֶצְלִי
  choice: ay nasa tabi ko
  rationale: Ipinahahayag nito ang malapit na kinaroroonan ng tagaihip kaugnay ng nagsasalita.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “baywang” sa halip na mas literal ngunit di-likas na “mga balakang,” at pinanatili ang pag-uulit ng “nagtatayo” upang maipakita ang pag-uulit sa Hebreo.
