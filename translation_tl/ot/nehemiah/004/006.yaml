  text: וַֽ/יְהִי֙ כַּ/אֲשֶׁר בָּ֣אוּ הַ/יְּהוּדִ֔ים הַ/יֹּשְׁבִ֖ים אֶצְלָ֑/ם וַ/יֹּ֤אמְרוּ לָ֨/נוּ֙ עֶ֣שֶׂר פְּעָמִ֔ים מִ/כָּל הַ/מְּקֹמ֖וֹת אֲשֶׁר תָּשׁ֥וּבוּ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/006.yaml
  text: And when the Jews who lived near them came and told us ten times[a], “From all the places where you turn[b], they will come up against us,”
translation:
  language: tl
  text: Nang dumating ang mga Judiong nakatira malapit sa kanila, sampung ulit nilang sinabi sa amin, “Mula sa lahat ng dakong inyong balingan[a], lulusob sila sa atin[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “inyong balikan.” Ang pandiwang Hebreo ay maaaring mangahulugang “bumalik” o “bumaling.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “laban sa atin” o “sa ibabaw natin.” Ang “lulusob sila” ay ipinahiwatig ng konteksto at idinagdag upang luminaw ang babala.
    reason: supplied_for_clarity
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר בָּאוּ
  choice: Nang dumating
  rationale: Ang pormulang pasalaysay at temporal ay likas na naipahahayag sa modernong Tagalog sa pamamagitan ng “Nang dumating,” nang hindi dinaragdagan ng matigas na “at nangyari.”
- source_word: הַיְּהוּדִים
  choice: ang mga Judio
  rationale: Tumutukoy ito sa mga kabilang sa pamayanang Judio, hindi lamang sa mga naninirahan sa heograpikong Juda.
- source_word: הַיֹּשְׁבִים אֶצְלָם
  choice: na nakatira malapit sa kanila
  rationale: Ipinahahayag ng אֵצֶל ang kalapitan sa mga kaaway na binabanggit sa konteksto.
- source_word: וַיֹּאמְרוּ לָנוּ עֶשֶׂר פְּעָמִים
  choice: sampung ulit nilang sinabi sa amin
  rationale: Pinananatili ang tiyak na bilang sa Hebreo, na nagpapahiwatig ng paulit-ulit at mariing babala.
- source_word: מִכָּל הַמְּקֹמוֹת
  choice: Mula sa lahat ng dakong
  rationale: Pinananatili ang larawan ng panganib na nagmumula sa bawat lugar o direksiyon.
- source_word: אֲשֶׁר תָּשׁוּבוּ
  choice: inyong balingan
  rationale: Ang שוב ay karaniwang “bumalik” ngunit maaari ring magpahiwatig ng paglingon o pagbaling; ang “balingan” ay angkop sa babalang may panganib mula sa bawat direksiyon habang kinikilala sa talababa ang tunay na leksikal na kalabuan.
- source_word: עָלֵינוּ
  choice: lulusob sila sa atin
  rationale: Sa kontekstong militar, ang עַל ay may diwang laban o pagsalakay. Idinagdag ang pandiwa at paksa sa salin upang mabuo sa Tagalog ang ipinahihiwatig ngunit eliptikong babala.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Pinanatili ang “sampung ulit” at ang direksiyonal na larawan ng Hebreo, habang ginawang malinaw sa pangkaraniwang mambabasa ang eliptikong huling sugnay.
