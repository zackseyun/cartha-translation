base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/011.yaml
  text: The builders on the wall[a], and those who carried burdens, loaded themselves so that with one hand each did the work[b], and with the other held his weapon.
translation:
  language: tl
  text: Ang mga nagtatayo ng pader at ang mga tagapasan ay may pasan[a]; bawat isa ay gumagawa gamit ang isang kamay, at hawak ng isa pa niyang kamay ang sandata.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bihira ang salitang Hebreo na עֹמְשִׂים, at hindi tiyak ang eksaktong diwa nito. Maaari ring isalin ang bahaging ito na “ang mga tagapasan ay kinakargahan.” Sa konteksto, ang mga manggagawa ay humahawak o nagdadala ng mga materyales habang nananatiling armado.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na הַשָּׁלַח ay maaaring mas tiyak na tumukoy sa sibat, suligi, o iba pang sandata.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים בַּחוֹמָה
  choice: ang mga nagtatayo ng pader
  rationale: Ang participle na הַבּוֹנִים ay tumutukoy sa mga aktuwal na nagtatayo. Sa natural na Filipino, ang בַּחוֹמָה ay maayos na naipapahayag bilang layon ng pagtatayo—“ng pader”—nang hindi binabago ang tagpo ng paggawa sa pader.
- source_word: וְהַנֹּשְׂאִים בַּסֶּבֶל
  choice: at ang mga tagapasan
  rationale: Ang parirala ay tumutukoy sa mga nagdadala ng mabibigat na materyales. Ang “mga tagapasan” ay maikli, malinaw, at angkop sa konteksto ng konstruksiyon.
- source_word: עֹמְשִׂים
  choice: ay may pasan
  rationale: Bihira at hindi tiyak ang eksaktong diwa ng participle. Pinananatili ng “may pasan” ang konkretong larawan ng mga manggagawang may dalang materyales nang hindi labis na tinutukoy kung sila ay nagpapakarga o kinakargahan.
- source_word: בְּאַחַת יָדוֹ עֹשֶׂה בַמְּלָאכָה
  choice: bawat isa ay gumagawa gamit ang isang kamay
  rationale: 'Distributibo ang pang-isahang anyo: bawat manggagawa ang tinutukoy. Ang “gumagawa” ay natural na katumbas ng paggawa ng itinakdang gawain.'
- source_word: וְאַחַת מַחֲזֶקֶת הַשָּׁלַח
  choice: at hawak naman ng isa pa ang kaniyang sandata
  rationale: Ang pambabaeng anyo ng participle ay umaayon sa ipinahihiwatig na “kamay.” Ang הַשָּׁלַח ay maaaring tumukoy sa sibat, suligi, o ibang sandata; “sandata” ang nagpapanatili sa lawak ng kahulugan.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “bawat isa” upang ihayag ang distributibong pang-isahan sa Hebreo, at pinanatili ang di-katiyakan ng bihirang עֹמְשִׂים sa pamamagitan ng pangunahing salin at talababa.
