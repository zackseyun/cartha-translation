base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/014.yaml
  text: At the place where you hear the sound of the trumpet[a], gather there to us. Our God will fight for us.
translation:
  language: tl
  text: Sa lugar kung saan ninyo marinig ang tunog ng trumpeta[a], magtipon kayo roon sa amin. Ipaglalaban tayo ng ating Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tunog ng sungay ng lalaking tupa.” Ang Hebreong shofar ay tumutukoy partikular sa trumpetang sungay.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: Sa lugar kung saan
  rationale: Pinananatili nito ang tiyak na diwang panlunan ng parirala habang natural sa modernong Tagalog.
- source_word: תִּשְׁמְעוּ
  choice: ninyo marinig
  rationale: Ang Qal ng שׁמע ay payak na tumutukoy sa pagkarinig; ang anyong ito ay natural sa pangungusap na nagbibigay ng tagubilin.
- source_word: קוֹל הַשּׁוֹפָר
  choice: ang tunog ng trumpeta
  rationale: Hayagang pinananatili ang קוֹל bilang “tunog.” Ang שׁוֹפָר ay isang trumpetang sungay, kaya inilalahad sa talababa ang mas tiyak na kahulugan.
- source_word: שָׁמָּה תִּקָּבְצוּ
  choice: magtipon kayo roon
  rationale: Ipinahahayag ng “roon” ang tinutukoy na lugar at ng “magtipon” ang pautos at intransitibong diwa ng Niphal.
- source_word: אֵלֵינוּ
  choice: sa amin
  rationale: Pinananatili ang malinaw na unang panauhang maramihan sa Hebreo sa halip na gawing “sa akin.”
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Pinananatili ang mahalagang hulaping paari na nagsasaad ng “ating Diyos.”
- source_word: יִלָּחֶם לָנוּ
  choice: Ipaglalaban tayo
  rationale: Natural at tuwirang ipinahahayag nito na ang Diyos mismo ang kikilos sa pakikipaglaban alang-alang sa bayan.
theological_decisions:
- issue: Wika tungkol sa pakikidigma ng Diyos
  choice: Ipaglalaban tayo ng ating Diyos
  alternative: Tutulungan tayo ng ating Diyos na lumaban
  rationale: Ang pandiwang Hebreo ay nag-uukol sa Diyos mismo ng pagkilos sa pakikipaglaban, hindi lamang ng pagtulong sa mga tao na lumaban.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang konkretong lugar, ang maramihang “sa amin,” at ang tuwirang pahayag na ang Diyos ang makikipaglaban para sa bayan.
