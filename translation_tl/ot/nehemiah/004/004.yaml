base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/004.yaml
  text: And Judah said[a], “The strength of the burden-bearers has failed, and there is much rubble[b], and we are not able to build the wall.”
translation:
  language: tl
  text: At sinabi ng Juda[a], “Nawalan na ng lakas ang mga tagapasan, at napakaraming guho[b]. Hindi namin kayang itayo ang pader.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga taga-Juda.” Ang pangalang “Juda” na nasa anyong isahan ay malamang na kumakatawan dito sa buong sambayanan ng Juda.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “alikabok” o “lupa”; sa kontekstong ito, tumutukoy sa mga labi o bunton mula sa mga gumuhong gusali at pader.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Juda
  rationale: Pinanatili ang pangalang pantangi, gaya ng nasa Hebreo. Sa konteksto, malamang na kumakatawan ito sa sambayanan ng Juda; nilinaw ang posibilidad na ito sa talababa.
- source_word: כָּשַׁל כֹּחַ
  choice: Nanghihina na
  rationale: Ang literal na larawan ay ang lakas na natitisod o bumibigay. Ang “nanghihina na” ay likas na Filipino at malinaw na naghahatid ng pagkaubos ng lakas sa paggawa.
- source_word: הַסַּבָּל
  choice: ang mga tagapasan
  rationale: Tumutukoy ang pangngalan sa nagdadala ng mabibigat na pasan. Bagaman isahan ang anyong Hebreo, kolektibo ang diwa nito rito, kaya ginamit ang likas na maramihang anyo sa Filipino.
- source_word: הֶעָפָר
  choice: guho
  rationale: Karaniwang nangangahulugang “alikabok” o “lupa,” ngunit sa konteksto ng wasak na lungsod ay tumutukoy sa nagkalat na labi o bunton mula sa pagkaguho. Pinanatili sa talababa ang literal na kahulugan.
- source_word: הַרְבֵּה
  choice: napakarami pang
  rationale: Ipinahahayag ang kasaganaan ng guho; ang “pang” ay natural sa reklamo at nagpapahiwatig na marami pa ang kailangang alisin, ayon sa konteksto.
- source_word: לֹא נוּכַל
  choice: Hindi namin kayang
  rationale: Malinaw na nagsasaad ng kawalan ng kakayahan, hindi ng pagtanggi o kawalan ng kalooban.
- source_word: לִבְנוֹת
  choice: itayo
  rationale: Ang pandiwa ay “magtayo/magtayo ng gusali.” Hindi ginamit ang “muling itayo” upang hindi magdagdag ng aspektong hindi tahasang nasa pandiwang Hebreo.
- source_word: בַּחוֹמָה
  choice: ang pader
  rationale: Bagaman may pang-ukol na ב, natural at tumpak sa Filipino ang tuwirang “itayo ang pader”; ang literal na “magtayo sa pader” ay maaaring magpahiwatig ng ibang bagay.
