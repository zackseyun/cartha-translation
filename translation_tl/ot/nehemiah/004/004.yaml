translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapasan” upang mapanatili ang kongkretong gawain ng mga manggagawa, at hinati sa dalawang pangungusap ang kanilang pahayag upang maging natural ang daloy nang hindi binabago ang ugnayan ng mga ideya.
