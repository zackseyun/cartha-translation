    rationale: Ang “na nagsabwatan” pagkatapos ng “sabay-sabay silang lahat” ay medyo mabigat sa modernong Filipino. Ang paglalagay ng pang-abay bago ang pandiwa ay mas tuwiran.
  - severity: low
    issue: Ang talababang alternatibong “kaguluhan at problema” ay hindi kasing-tiyak ng mga mas malalapit na kahulugan ng תּוֹעָה.
    rationale: Ang termino ay maaaring mangahulugang kalituhan, pagkagambala, o kawalan ng kaayusan. Ang “problema” ay posibleng resulta ngunit hindi ang pinakamalapit na lexical alternative.
