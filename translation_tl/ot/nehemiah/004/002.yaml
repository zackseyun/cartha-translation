- from: At sabay-sabay silang lahat na nagsabwatan upang lumusob at makipaglaban sa Jerusalem at magdulot doon ng kaguluhan.[a]
  to: At sama-samang nagsabwatan silang lahat upang lumusob at makipaglaban sa Jerusalem at magdulot doon ng kaguluhan.[a]
