  source_fidelity: Tumpak na naihahatid ng draft ang sama-samang pagsasabwatan, ang paglusob at pakikipaglaban na nakatuon sa Jerusalem, at ang layuning magdulot ng תּוֹעָה. Ang “sa Jerusalem” ay likas na Filipino para sa target ng mga pandiwang ito at katanggap-tanggap sa kontekstong militar.
  naturalness: May bahagyang di-likas na ayos ang “sabay-sabay silang lahat na nagsabwatan.” Mas malinaw at mas natural ang “Sama-samang nagsabwatan silang lahat,” habang pinananatili ang diin ng כֻלָּם יַחְדָּו.
  terminology: Ang “nagsabwatan,” “lumusob,” “makipaglaban,” at “kaguluhan” ay angkop sa modernong Filipino at sa antas ng salaysay. Sa talababa, mas mabuting manatili sa mga malalapit na semantikong alternatibo kaysa idagdag ang “problema,” na mas maluwag at hindi kinakailangan.
