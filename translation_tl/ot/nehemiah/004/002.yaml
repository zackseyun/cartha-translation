translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “nagsabwatan” para sa koordinadong masamang balak at “kaguluhan” upang hindi paliitin ang sadyang malawak na kahulugan ng pangngalang Hebreo.
