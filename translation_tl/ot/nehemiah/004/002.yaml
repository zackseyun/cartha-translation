  text: And all of them conspired together to come and fight against Jerusalem and to cause confusion in it[a].
translation:
  language: tl
  text: At sama-samang nagsabwatan silang lahat upang lumusob at makipaglaban sa Jerusalem at magdulot doon ng kaguluhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magdulot doon ng kalituhan,” “pagkagambala,” o “kawalan ng kaayusan.” Ang salitang Hebreo ay maaaring tumukoy sa kalituhan, pagkagambala, o kawalan ng kaayusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: nagsabwatan
  rationale: Ang qal ng קשר ay tumutukoy rito sa lihim at magkakasamang pagbabalak laban sa Jerusalem; likas at malinaw sa modernong Filipino ang “nagsabwatan.”
- source_word: כֻלָּם יַחְדָּו
  choice: sabay-sabay silang lahat
  rationale: Pinananatili nito ang diin kapuwa sa kabuuan ng pangkat at sa kanilang nagkakaisang pagkilos, nang hindi nagiging mabigat ang pangungusap.
- source_word: לָבוֹא לְהִלָּחֵם
  choice: upang lumusob at makipaglaban
  rationale: Ang “lumusob” ay likas na pagsasalin ng paglapit na may masamang layunin sa kontekstong militar, habang tahasang pinananatili ng “makipaglaban” ang hiwalay na pandiwang לחם.
- source_word: בִּירוּשָׁלָם
  choice: sa Jerusalem
  rationale: Sa Filipino, malinaw na target ng “lumusob at makipaglaban” ang Jerusalem kahit “sa” ang gamit; mas natural ito kaysa “laban sa Jerusalem” kasunod ng dalawang pandiwa.
- source_word: וְלַעֲשׂוֹת לוֹ תּוֹעָה
  choice: at magdulot doon ng kaguluhan
  rationale: Ipinahahayag ng “magdulot” ang paglikha ng isang kalagayan, ang “doon” ay likas na tumutukoy sa Jerusalem, at pinananatili ng “kaguluhan” ang lawak ng תּוֹעָה.
