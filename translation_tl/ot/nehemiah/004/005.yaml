translation_notes:
  register: Makabagong Filipino na tuwiran at marangal. Pinanatili ang tambalang “malalaman ni makikita” upang katawanin ang paralelismo ng Hebreo. Idinagdag ang “ang anuman” bilang likas na katuwang ng dalawang pandiwa sa Filipino, nang hindi tinutukoy kung ano mismo ang hindi nila malalaman o makikita.
