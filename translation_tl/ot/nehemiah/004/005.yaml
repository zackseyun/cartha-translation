  source_fidelity: 'Kailangang gawing malinaw ang aktibong mga pandiwang may unang panauhang maramihan: ang mga kaaway ang nagsasabing sila ang papatay at magpapahinto sa gawain. Ang dagdag na “ang anuman” ay wala sa Hebreo at hindi kailangan upang maging malinaw ang Tagalog.'
  naturalness: Natural at marangal ang panimulang ayos. Mas malinaw at mas tuwiran sa modernong Filipino ang “patayin namin sila at patigilin ang gawain” kaysa sa mga anyong balintiyak na “mapatay sila” at “mapatigil ang gawain.”
  terminology: Ang “aming mga kaaway,” “malalaman ni makikita,” at “gawain” ay angkop at tumutugma sa rehistro at kahulugan ng pinagmulan. Pinanatili ang “gitna nila” at ang alternatibong “piling nila” sa talababa.
