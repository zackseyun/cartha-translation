lexical_decisions:
- source_word: צָרֵינוּ
  choice: aming mga kaaway
  rationale: Ang צַר ay tumutukoy sa kaaway o kalabang may masamang hangarin. Ang “mga kaaway” ay tuwiran, natural, at angkop sa banta sa konteksto.
- source_word: יֵדְעוּ
  choice: malalaman
  rationale: Ang יָדַע dito ay tumutukoy sa pagkakaalam o kamalayan. Pinananatili ng “malalaman” ang payak na salita ng Hebreo.
- source_word: יִרְאוּ
  choice: makikita
  rationale: Literal na “makikita” ang רָאָה. Pinananatili nito ang paralelismo sa “malalaman,” habang ipinahihiwatig ng konteksto ang diwa ng pagpansin.
- source_word: עַד אֲשֶׁר
  choice: hanggang sa
  rationale: Ipinakikita ng parirala ang hangganan ng panahong hindi pa namamalayan ng mga manggagawa ang pagdating ng mga kaaway.
- source_word: נָבוֹא אֶל תּוֹכָם
  choice: makapasok kami sa gitna nila
  rationale: Ang בּוֹא ay maaaring mangahulugang pumasok o dumating, at ang תּוֹךְ ay “gitna” o “kaloob-looban.” Ipinahahayag ng salin ang palihim na pagpasok sa kanilang hanay.
- source_word: וַהֲרַגְנוּם
  choice: mapatay sila
  rationale: Ang הָרַג ay karaniwang pandiwa para sa pagpatay. Ang anyong Filipino ay likas sa sunod-sunod na layunin ng mga nagsasalita at hindi pinahihina ang tahasang banta.
- source_word: וְהִשְׁבַּתְנוּ
  choice: mapatigil
  rationale: Ang Hiphil ng שׁבת ay nangangahulugang magpangyaring tumigil. Malinaw na naihahatid ng “mapatigil” ang causative na diwa.
- source_word: הַמְּלָאכָה
  choice: ang gawain
  rationale: Tumutukoy ang מְלָאכָה sa gawaing muling pagtatayo. Ang “gawain” ay malawak, natural, at akma sa konteksto.
