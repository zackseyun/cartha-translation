base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/017.yaml
  text: And neither I[a], nor my brothers, nor my young men, nor the men of the guard who were behind me, took off our clothes; each kept his weapon in his right hand, even for water.
translation:
  language: tl
  text: Hindi kami naghubad ng aming mga damit—ako, ang mga kapatid ko, ang mga kabataang kasama ko, at ang mga bantay na nasa likuran ko. Bawat isa ay may dalang sandata, kahit kapag kumukuha ng tubig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang hulíng parirala sa Hebreo; literal itong “bawat isa, ang kanyang sandata, ang tubig.” Maaaring ibig sabihin nito na ang bawat isa ay nananatiling may sandata kahit kapag kumukuha ng tubig, o na ang bawat isa ay pumupunta sa tubig na dala ang kanyang sandata.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... אֵין
  choice: Hindi kami naghubad
  rationale: Ang אֵין na may participle ay nagpapahayag ng patuloy na hindi paggawa. Ang payak na anyong Filipino ay natural at malinaw, samantalang inilalahad ng kasunod na parirala kung sinu-sino ang saklaw ng “kami.”
- source_word: אַחַי
  choice: ang mga kapatid ko
  rationale: Pinananatili ang literal na katawagang pampamilya, bagaman maaari rin itong tumukoy sa malalapit na kasama o kamag-anak ayon sa konteksto.
- source_word: נְעָרַי
  choice: ang mga kabataang tauhan ko
  rationale: Maaaring mangahulugan ang נַעַר ng binata, lingkod, o tagapaglingkod. Ipinahihiwatig ng “kabataang tauhan” ang edad at tungkulin nang hindi labis na tinutukoy ang kanilang katayuan.
- source_word: אַנְשֵׁי הַמִּשְׁמָר
  choice: ang mga bantay
  rationale: Likas at malinaw itong salin para sa mga lalaking nakatalaga sa pagbabantay.
- source_word: אֲשֶׁר אַחֲרַי
  choice: na nasa likuran ko
  rationale: Pinananatili ang pinakapayak na diwang panlunan ng parirala at umaangkop ito sa konteksto ng mga bantay.
- source_word: פֹשְׁטִים בְּגָדֵינוּ
  choice: naghubad ng aming mga damit
  rationale: Ang פשט na kasama ang בגדים ay nangangahulugang mag-alis o maghubad ng damit. Karaniwan at tuwiran ang pananalitang Filipino.
- source_word: אִישׁ
  choice: bawat isa
  rationale: Ginagamit dito ang אִישׁ sa diwang pamahagi; mas likas sa Filipino ang “bawat isa” kaysa “bawat lalaki.”
- source_word: שִׁלְחוֹ
  choice: dala ang kanyang sandata
  rationale: Ang שֶׁלַח ay maaaring tumukoy sa sandata, lalo na sa sandatang inihahagis o tulad ng sibat. Hindi tinutukoy ang isang partikular na uri ng sandata.
- source_word: הַמָּיִם
  choice: kahit sa pagkuha ng tubig
  rationale: Napakaikli at mahirap unawain ang hulíng pariralang Hebreo. Ang salin ay nagpapahayag ng malamang na diwa na nanatili silang armado maging sa pagkuha ng tubig, ngunit itinatala sa talababa ang kawalang-katiyakan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na tuwiran at marangal. Ginamit ang “kabataang tauhan” upang mapanatili ang lawak ng kahulugan ng נְעָרַי, at inilagay ang panandang [a] sa mismong mahirap na hulíng sugnay.
