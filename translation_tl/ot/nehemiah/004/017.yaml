  terminology: Ang “mga kapatid ko,” “mga bantay,” “mga damit,” at “sandata” ay angkop. Hindi tinutukoy ng “sandata” ang uri ng שֶׁלַח nang lampas sa ipinahihiwatig ng Hebreo.
