base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/013.yaml
  text: And I said to the nobles[a], to the officials, and to the rest of the people, “The work is great and spread out, and we are separated along the wall, far from one another.”
translation:
  language: tl
  text: At sinabi ko sa mga maharlika, sa mga opisyal, at sa natitirang mga tao, “Malaki at malawak ang gawain, at magkakahiwalay tayo sa kahabaan ng pader, malayo sa isa’t isa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bawat lalaki mula sa kanyang kapatid,” isang idyomang Hebreo na nangangahulugang “isa mula sa isa pa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: mga maharlika
  rationale: Sa Nehemias, tumutukoy ito sa mga nakatataas sa lipunan o mga pangunahing tao, hindi lamang sa mga taong malaya.
- source_word: הַסְּגָנִים
  choice: mga opisyal
  rationale: Tumutukoy ito sa mga pinunong tagapangasiwa na may tungkuling sibiko; malinaw at hindi labis na tiyak ang “mga opisyal.”
- source_word: יֶתֶר הָעָם
  choice: iba pang mga tao
  rationale: Likas na Filipino para sa nalalabing bahagi ng bayan bukod sa mga pinunong nabanggit.
- source_word: הַמְּלָאכָה הַרְבֵּה וּרְחָבָה
  choice: Malaki at malawak ang gawain
  rationale: Pinananatili ang dalawang paglalarawan sa laki at lawak ng gawaing muling pagtatayo.
- source_word: נִפְרָדִים
  choice: magkakahiwalay
  rationale: Ipinahihiwatig ang pisikal na pagkakalayo ng mga manggagawa, hindi alitan o pagkakahati-hati.
- source_word: עַל הַחוֹמָה
  choice: sa kahabaan ng pader
  rationale: Ipinapahayag ang pagkakapuwesto ng mga manggagawa sa iba’t ibang bahagi ng mahabang pader habang nananatiling tapat sa lokatibong gamit ng parirala.
- source_word: רְחוֹקִים אִישׁ מֵאָחִיו
  choice: malayo sa isa’t isa
  rationale: Natural na katumbas ng idyomang Hebreo na nagsasaad ng pagkakalayo ng bawat isa sa kapwa niya.
