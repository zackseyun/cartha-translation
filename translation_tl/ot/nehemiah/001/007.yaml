base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/007.yaml
  text: We have acted very corruptly against you and have not kept the commandments[a], the statutes[b], and the judgments that you commanded your servant Moses.
translation:
  language: tl
  text: Lubha kaming gumawa ng masama laban sa iyo[a] at hindi namin sinunod ang mga utos, mga tuntunin, at mga batas[b] na iniutos mo sa iyong lingkod na si Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Lubha kaming naging tiwali sa pakikitungo sa iyo.” Inuulit sa Hebreo ang diwa ng pandiwa upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ding tumukoy sa “mga pasiyang legal,” “mga tuntuning panghukuman,” o “mga kahatulan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל חָבַלְנוּ
  choice: Lubha kaming gumawa ng masama
  rationale: Ang infinitive absolute na kasunod ng pandiwang may takdang anyo ay nagbibigay-diin sa tindi ng masamang asal. Likas sa modernong Tagalog ang “lubha kaming gumawa ng masama” at hindi nito ginagawang pisikal na pagkawasak ang diwa ng ugat.
- source_word: לָךְ
  choice: laban sa iyo
  rationale: Sa panalanging nagpapahayag ng kasalanan, ipinakikita ng parirala na ang pagkakasala ay nakatuon laban sa Diyos; mas malinaw ito kaysa sa literal na “sa iyo.”
- source_word: וְלֹא שָׁמַרְנוּ
  choice: at hindi namin sinunod
  rationale: Kapag mga kautusan ang layon, ang שׁמר ay nangangahulugang tumupad o sumunod. Ang “sinunod” ang pinakanatural na pagpapahayag sa kasalukuyang Tagalog.
- source_word: הַמִּצְוֺת
  choice: mga utos
  rationale: Tumutukoy ito sa mga obligasyong tahasang iniutos at pinananatili ang legal at tipanang himig.
- source_word: הַחֻקִּים
  choice: mga tuntunin
  rationale: Ang חֻקִּים ay mga itinakda o pirming alituntunin. Naiiba ang “mga tuntunin” sa “mga utos” at “mga batas” nang hindi nagiging labis na teknikal.
- source_word: הַמִּשְׁפָּטִים
  choice: mga batas
  rationale: Maaaring tumukoy ang מִשְׁפָּטִים sa mga legal na pasiya, tuntuning panghukuman, o mga batas. Natural sa karaniwang Tagalog ang “mga batas,” habang nililinaw ng talababa ang mas tiyak na saklaw.
- source_word: אֲשֶׁר צִוִּיתָ
  choice: na iniutos mo
  rationale: Tuwirang pinananatili nito ang banal na awtoridad na ipinahahayag ng pandiwang “mag-utos.”
- source_word: עַבְדֶּךָ
  choice: iyong lingkod
  rationale: Para kay Moises sa kaugnayan niya sa Diyos, ang “lingkod” ay angkop na titulong nagpapahiwatig ng paglilingkod at atas, nang hindi ipinipilit ang larawan ng sapilitang pagkaalipin.
theological_decisions:
- issue: Pagpapanatiling magkakaiba sa tatlong katawagan para sa kautusan
  choice: mga utos, mga tuntunin, at mga batas
  alternative: mga kautusan, mga palatuntunan, at mga kahatulan
  rationale: Tatlong magkakaibang terminong legal ang ginamit sa Hebreo. Pinananatili ng salin ang pagkakaibang iyon sa natural na Tagalog, ngunit hindi ito ginagawang tatlong mahigpit na kategoryang doktrinal na hindi naman ipinaliliwanag ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog para sa isang panalanging nagsisisi. Ginamit ang “lubha” upang dalhin ang diin ng Hebreo, at pinanatiling magkakaiba ngunit madaling maunawaan ang tatlong terminong legal.
