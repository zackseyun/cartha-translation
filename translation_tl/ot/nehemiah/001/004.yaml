source:
  edition: WLC
  text: וַ/יְהִ֞י כְּ/שָׁמְעִ֣/י אֶת הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה יָשַׁ֨בְתִּי֙ וָֽ/אֶבְכֶּ֔ה וָ/אֶתְאַבְּלָ֖/ה יָמִ֑ים וָֽ/אֱהִ֥י צָם֙ וּ/מִתְפַּלֵּ֔ל לִ/פְנֵ֖י אֱלֹהֵ֥י הַ/שָּׁמָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/004.yaml
  text: And when I heard these words[a], I sat down and wept and mourned for days[b], and I was fasting and praying before the God of heaven.
translation:
  language: tl
  text: Nang marinig ko ang mga salitang ito[a], naupo ako at umiyak, at nagluksa nang ilang araw. Patuloy akong nag-ayuno at nanalangin[b] sa harap ng Diyos ng langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bagay na ito” o “mga pangyayaring ito.” Ang salitang Hebreo na דְּבָרִים ay maaaring mangahulugang “mga salita,” “mga bagay,” o “mga usapin.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ako ay nag-aayuno at nananalangin.” Ipinahihiwatig ng anyong Hebreo na nagpapatuloy ang mga gawaing ito.
    reason: aspectual_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעִי
  choice: Nang marinig ko
  rationale: Ang konstruksiyong Hebreo ay nagpapakilala ng kasunod na pangyayari sa salaysay. Ang “Nang marinig ko” ay natural sa modernong Tagalog at hindi na nangangailangan ng literal ngunit mabigat na “At nangyari.”
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ang mga salitang ito
  rationale: Maaaring tumukoy ang דְּבָרִים sa mga salita, bagay, o pangyayari. Sa konteksto, tumutugon si Nehemias sa ulat na kanyang narinig; pinananatili ng “mga salitang ito” ang leksikal na anyo habang nililinaw sa talababa ang saklaw ng kahulugan.
- source_word: יָשַׁבְתִּי
  choice: naupo ako
  rationale: Ang ישׁב ay nangangahulugang umupo, manirahan, o manatili. Dito, ang “naupo ako” ay natural na paglalarawan ng agarang pisikal na tugon sa masamang balita.
- source_word: וָאֶבְכֶּה
  choice: at umiyak
  rationale: Tuwirang ipinahahayag ng בכה ang pag-iyak; ang karaniwang salitang “umiyak” ay malinaw, natural, at angkop sa marangal na salaysay.
- source_word: וָאֶתְאַבְּלָה יָמִים
  choice: at nagluksa nang ilang araw
  rationale: Ang אבל ay tumutukoy sa pagdadalamhati o pagluluksa, at ang יָמִים ay nagsasaad ng tagal. Kailangan sa natural na Tagalog ang “ilang” upang maipahayag ang di-tiyak na maramihang “mga araw.”
- source_word: וָאֱהִי צָם וּמִתְפַּלֵּל
  choice: Patuloy akong nag-ayuno at nanalangin
  rationale: Ang היה na sinusundan ng mga participle ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na kilos. Tahasang naipapakita ng “patuloy” ang aspektong ito sa natural na Tagalog.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Ang לִפְנֵי ay literal na “sa harap ng” o “sa presensya ng.” Ang “sa harap ng” ay maikli, natural, at nagpapanatili sa relasyonal na larawan ng pananalangin.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: Diyos ng langit
  rationale: Ito ay isang titulong madalas gamitin sa Ezra–Nehemias. Ang “Diyos ng langit” ay tuwiran, malinaw, at natural sa modernong Tagalog.
theological_decisions:
- issue: Pagsasalin sa titulong אֱלֹהֵי הַשָּׁמָיִם
  choice: Diyos ng langit
  alternative: Diyos ng kalangitan
  rationale: Titulo ito para sa Diyos at hindi ang pangalang YHWH. Pinananatili ng salin ang titulong nasa teksto nang hindi ipinapasok ang pangalang tipan na wala sa talata; mas karaniwan at madaling maunawaan ang “langit” kaysa “kalangitan.”
- issue: Aspekto ng pag-aayuno at pananalangin
  choice: Patuloy akong nag-ayuno at nanalangin
  alternative: Nag-ayuno ako at nanalangin
  rationale: Ipinahihiwatig ng היה kasama ng mga participle ang nagpapatuloy na gawain. Pinananatili ang aspektong ito nang hindi tinutukoy kung eksaktong gaano katagal o kung tuluy-tuloy itong ginawa sa bawat sandali.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na tugon ni Nehemias at ang pormal ngunit madaling maunawaang titulong “Diyos ng langit.”
