  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֮ לִ/י֒ הַֽ/נִּשְׁאָרִ֞ים אֲשֶֽׁר נִשְׁאֲר֤וּ מִן הַ/שְּׁבִי֙ שָׁ֣ם בַּ/מְּדִינָ֔ה בְּ/רָעָ֥ה גְדֹלָ֖ה וּ/בְ/חֶרְפָּ֑ה וְ/חוֹמַ֤ת יְרוּשָׁלִַ֨ם֙ מְפֹרָ֔צֶת וּ/שְׁעָרֶ֖י/הָ נִצְּת֥וּ בָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/003.yaml
  text: And they said to me[a], “The remnant there in the province who survived the captivity are in great trouble and disgrace, and the wall of Jerusalem is broken down[b], and its gates have been burned with fire.”
translation:
  language: tl
  text: Sinabi nila sa akin, “Ang mga natira roon sa lalawigan—ang mga nakaligtas sa pagkabihag[a]—ay nasa matinding kagipitan at kahihiyan. Wasak ang pader ng Jerusalem, at tinupok ng apoy ang mga pintuang-bayan nito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagpapatapon.” Maaaring isalin ang pariralang Hebreo na “mula sa pagkabihag” o “mula sa pagpapatapon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ
  choice: ang mga natira ... ang mga nakaligtas
  rationale: 'Pinananatili ang pag-uulit ng ugat na שׁאר sa natural na Filipino: isang pangkat na natira matapos ang kapahamakan at nakaligtas dito.'
- source_word: מִן הַשְּׁבִי
  choice: sa pagkabihag
  rationale: Maaaring tumukoy sa pagkabihag o pagpapatapon. Ang “pagkabihag” ay malapit sa anyong pangngalan at akma sa konteksto ng sapilitang pagdadala sa ibang lupain.
- source_word: בַּמְּדִינָה
  choice: sa lalawigan
  rationale: Sa konteksto ng panahon ng Persia, tumutukoy ito sa isang administratibong nasasakupan; “lalawigan” ang malinaw at natural na katumbas.
- source_word: בְּרָעָה גְדֹלָה
  choice: nasa matinding kagipitan
  rationale: Ang רָעָה rito ay matinding paghihirap o masamang kalagayan, hindi kasamaan sa moral na diwa.
- source_word: וּבְחֶרְפָּה
  choice: at kahihiyan
  rationale: Ipinahahayag ng חֶרְפָּה ang pampublikong dungis, paghamak, o kahihiyan; malinaw sa kasalukuyang Filipino ang “kahihiyan.”
- source_word: חוֹמַת יְרוּשָׁלִַם מְפֹרָצֶת
  choice: Wasak ang pader ng Jerusalem
  rationale: Ang participle mula sa פרץ ay nagsasaad na ang pader ay nabutas, nasira, o nagiba. Ang “wasak” ay maikli at natural, at inilalarawan ang kasalukuyang kalagayan nito.
- source_word: וּשְׁעָרֶיהָ נִצְּתוּ בָאֵשׁ
  choice: tinupok ng apoy ang mga pintuang-bayan nito
  rationale: Natural na Filipino ito para sa pagkawasak sa pamamagitan ng pagsunog at pinananatili ang malinaw na pagbanggit sa apoy.
- source_word: וַיֹּאמְרוּ לִי
  choice: Sinabi nila sa akin
  rationale: Tuwirang salaysay ito na natural sa Filipino; hindi kailangang isalin nang hiwalay ang panimulang waw bilang “at.”
theological_decisions: []
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “pintuang-bayan” upang malinaw na tumukoy sa mga tarangkahan ng lungsod, hindi sa karaniwang pinto. Hindi sinunod ang tila napagpalit na mga marker sa English consultation layer: ang talang tungkol sa captivity/exile ay inilagay sa “pagkabihag,” samantalang walang footnote sa “wasak” dahil hindi tumutugma rito ang ibinigay na English footnote b.'
