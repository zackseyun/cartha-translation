base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/002.yaml
  text: Hanani[a], one of my brothers, came—he and some men from Judah—and I asked them about the Jews who had escaped, who were left from the captivity[c][b], and about Jerusalem.
translation:
  language: tl
  text: Dumating si Hanani, isa sa aking mga kapatid, kasama ang ilang lalaking mula sa Juda. Tinanong ko sila tungkol sa mga Judio[a] na nakaligtas[b], na nalabi mula sa pagkabihag[c], at tungkol sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taga-Juda.” Ang salitang Hebreo ay maaaring tumukoy sa mga mamamayan ng Juda o, sa mas malawak na diwa, sa mga Judio.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga nakatakas,” “mga nakaligtas,” o “nalabi.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mula sa pagkatapon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dumating
  rationale: Ang wayyiqtol ng בוא ay nagsasalaysay ng payak na nakaraang pagdating; natural sa modernong Filipino ang “dumating.”
- source_word: חֲנָנִי
  choice: Hanani
  rationale: Isinalin sa karaniwang transliterasyon ang pangalang pantangi.
- source_word: אֶחָד מֵאַחַי הוּא
  choice: na isa sa aking mga kapatid
  rationale: Pinananatili nito ang literal na ugnayang panlalaking pampamilya nang hindi ito pinalalawak agad sa “kamag-anak.”
- source_word: וַאֲנָשִׁים מִיהוּדָה
  choice: kasama ang ilang lalaking mula sa Juda
  rationale: Ipinahihiwatig ng parirala na may kasamang mga lalaki si Hanani; ang “ilang” ay natural sa Filipino at hindi nagtatakda ng tiyak na bilang.
- source_word: וָאֶשְׁאָלֵם
  choice: Tinanong ko sila
  rationale: Malinaw at natural na katumbas ng שׁאל sa kontekstong ito.
- source_word: הַיְּהוּדִים
  choice: mga Judio
  rationale: Karaniwang katawagan sa Filipino para sa mga taong Judio, habang kinikilala sa talababa ang posibleng mas heograpikong diwang “mga taga-Juda.”
- source_word: הַפְּלֵיטָה
  choice: na nakaligtas
  rationale: Bagaman pangngalan sa Hebreo, likas itong ipahayag bilang sugnay na naglalarawan sa mga Judio; pinananatili ang ideya ng pagtakas o pagkaligtas.
- source_word: אֲשֶׁר נִשְׁאֲרוּ
  choice: at naiwan
  rationale: Pinananatili ang resultative o pasibong diwa ng נִשְׁאֲרוּ at ang hiwalay na paglalarawan kasunod ng הַפְּלֵיטָה.
- source_word: מִן הַשֶּׁבִי
  choice: mula sa pagkabihag
  rationale: Malapit sa anyong pangngalan at saklaw ng שׁבי; maaaring tumukoy rin sa pagkatapon, kaya inilagay ang alternatibo sa talababa.
- source_word: וְעַל יְרוּשָׁלִָם
  choice: at tungkol sa Jerusalem
  rationale: Pinananatili ang Jerusalem bilang ikalawang paksa ng pagtatanong, kaagapay ng naunang pariralang עַל.
