translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang anyong pamagat na “Ang mga salita ni” at ang hindi tiyak na pagtukoy sa “ikadalawampung taon.” Ginamit ang “kuta” bilang madaling maunawaang katumbas ng pinatibay na maharlikang kompleks.
