  text: דִּבְרֵ֥י נְחֶמְיָ֖ה בֶּן חֲכַלְיָ֑ה וַ/יְהִ֤י בְ/חֹֽדֶשׁ כסלו שְׁנַ֣ת עֶשְׂרִ֔ים וַ/אֲנִ֥י הָיִ֖יתִי בְּ/שׁוּשַׁ֥ן הַ/בִּירָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/001.yaml
  text: The words of Nehemiah son of Hacaliah[a]. Now it happened in the month of Kislev, in the twentieth year, while I was in Susa the citadel[c][b],
translation:
  language: tl
  text: Ang mga salita ni Nehemias na anak ni Hacalias.[a] Nangyari ito noong buwan ng Kislev, sa ikadalawampung taon,[b] habang ako ay nasa Susa, ang tanggulan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ang salaysay ni Nehemias na anak ni Hacalias.” Ang pariralang Hebreo na “Ang mga salita ni” ay maaaring magpakilala ng isang talaarawan o salaysay.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa ikadalawampung taon.” Hindi tahasang sinasabi sa talatang ito kung kaninong taon ng paghahari ang tinutukoy, bagaman ipinakikilala sa kasunod na konteksto si Artaxerxes.
    reason: cultural_note
  - marker: c
    text: Maaari ring “Susa, ang kuta.” Ang salitang Hebreo ay tumutukoy sa isang pinatibay na maharlikang kompleks.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Ang mga salita ni
  rationale: Pinananatili ang anyong Hebreo ng pamagat, na maaaring tumukoy sa mga salita o sa nakasulat na salaysay ng isang tao, nang hindi agad nililimitahan sa kahulugang “salaysay.”
- source_word: נְחֶמְיָה
  choice: Nehemias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong saling Filipino.
- source_word: בֶּן חֲכַלְיָה
  choice: na anak ni Hacalias
  rationale: Likas na pagpapahayag sa Filipino ng ugnayang genealogical; ang pangalan ay isina-Filipinong transliterasyon.
- source_word: וַיְהִי
  choice: Nangyari ito
  rationale: Likas at dignified na panimulang pormula sa salaysay, na hindi gumagamit ng makalumang pananalita.
- source_word: בְחֹדֶשׁ כסלו
  choice: noong buwan ng Kislev
  rationale: Pinananatili ang pangalan ng buwang Hebreo at malinaw na ipinapahayag ang panahong tinutukoy.
- source_word: שְׁנַת עֶשְׂרִים
  choice: sa ikadalawampung taon
  rationale: Hindi idinagdag sa pangunahing teksto kung kaninong paghahari ang tinutukoy, sapagkat hindi iyon tahasang sinasabi sa talata.
- source_word: וַאֲנִי הָיִיתִי
  choice: habang ako ay nasa
  rationale: Ipinakikita nang natural sa Filipino ang kalagayan ng tagapagsalaysay sa panahong iyon.
- source_word: בְשׁוּשַׁן
  choice: ng Susa
  rationale: Ginamit ang karaniwang modernong anyo ng pangalan ng lugar.
- source_word: הַבִּירָה
  choice: kuta
  rationale: Ipinahahayag ang pinatibay na maharlikang kompleks; mas madaling maunawaan sa Filipino kaysa sa hiram na “sitadel.”
