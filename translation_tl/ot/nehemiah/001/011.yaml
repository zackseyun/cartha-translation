  text: אָנָּ֣א אֲדֹנָ֗/י תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַ֠שֶּׁבֶת אֶל תְּפִלַּ֨ת עַבְדְּ/ךָ֜ וְ/אֶל תְּפִלַּ֣ת עֲבָדֶ֗י/ךָ הַֽ/חֲפֵצִים֙ לְ/יִרְאָ֣ה אֶת שְׁמֶ֔/ךָ וְ/הַצְלִֽיחָ/ה נָּ֤א לְ/עַבְדְּ/ךָ֙ הַ/יּ֔וֹם וּ/תְנֵ֣/הוּ לְ/רַחֲמִ֔ים לִ/פְנֵ֖י הָ/אִ֣ישׁ הַ/זֶּ֑ה וַ/אֲנִ֛י הָיִ֥יתִי מַשְׁקֶ֖ה לַ/מֶּֽלֶךְ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/011.yaml
  text: Please[a], Lord, let your ear be attentive to the prayer of your servant and to the prayer of your servants who delight to fear your name, and please give success to your servant today and grant him compassion before this man[c][b]. Now I was cupbearer to the king.
translation:
  language: tl
  text: O Panginoon, pakinggan mo sana ang panalangin ng iyong lingkod at ang panalangin ng iyong mga lingkod na nalulugod na matakot sa iyong pangalan[a]. Pagtagumpayin mo sana ngayon ang iyong lingkod, at ipagkaloob mong makasumpong siya ng habag sa harap ng taong ito[b][c]. Ako noon ang tagapag-abot ng kopa ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagnanais na magpitagan sa iyong pangalan” o “nalulugod na magkaroon ng pagpipitagan sa iyong pangalan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “ipagkaloob mong lingapin siya ng taong ito.” Sa literal na Hebreong idyoma, hinihiling na siya ay ibigay “sa habag” o “sa mga awa” sa harap ng taong iyon.
    reason: lexical_alternative
  - marker: c
    text: Ang “taong ito” ay ang hari, na tinukoy ni Nehemias sa kasunod na pangungusap bilang ang pinaglilingkuran niya bilang tagapag-abot ng kopa.
    reason: cross_reference
lexical_decisions:
- source_word: אָנָּא אֲדֹנָי
  choice: O Panginoon ... sana
  rationale: Ang אָנָּא ay pakiusap na may matinding pagsusumamo. Likas sa makabagong Tagalog ang paggamit ng “sana” sa mismong kahilingan, habang ang “O Panginoon” ay marangal na tuwirang pagtawag sa Diyos.
- source_word: תְּהִי נָא אָזְנְךָ קַשֶּׁבֶת
  choice: pakinggan mo sana
  rationale: Ang literal na larawan ng taingang nakatuon ay isang idyomang humihiling na makinig ang Diyos nang may pagsang-ayon. Mas natural at malinaw sa Tagalog ang “pakinggan mo sana” kaysa sa literal ngunit mabigat na “maging matamang nakikinig ang iyong tainga.”
- source_word: תְּפִלַּת עַבְדְּךָ ... עֲבָדֶיךָ
  choice: panalangin ng iyong lingkod ... panalangin ng iyong mga lingkod
  rationale: Pinananatili ang singular at plural at ang mapagpakumbabang pagtukoy sa sarili at sa kapwa sumasamba bilang mga lingkod ng Diyos.
- source_word: הַחֲפֵצִים לְיִרְאָה אֶת שְׁמֶךָ
  choice: na nalulugod na matakot sa iyong pangalan
  rationale: Pinananatili ng “nalulugod” ang diwa ng kusang kasiyahan o pagnanais, at ng “matakot” ang saklaw ng ירא na may kasamang banal na takot at pagpipitagan. Ang “pangalan” ay hindi pinalitan ng paliwanag.
- source_word: וְהַצְלִיחָה נָּא לְעַבְדְּךָ הַיּוֹם
  choice: Pagtagumpayin mo sana ngayon ang iyong lingkod
  rationale: Ang pandiwang Hiphil ay humihiling na ang Diyos ang magsanhi ng tagumpay. Ang “pagtagumpayin” ay tuwiran, likas, at pinananatili ang Diyos bilang nagbibigay ng matagumpay na kinalabasan.
- source_word: וּתְנֵהוּ לְרַחֲמִים לִפְנֵי הָאִישׁ הַזֶּה
  choice: ipagkaloob mong kahabagan siya ng taong ito
  rationale: Isinasalin nang natural ang Hebreong idyoma bilang paghiling na tumanggap si Nehemias ng mahabaging pakikitungo mula sa tinutukoy na lalaki. Pinananatili ng “siya” ang biglang ikatlong-panauhang pagtukoy sa lingkod.
- source_word: וַאֲנִי הָיִיתִי מַשְׁקֶה לַמֶּלֶךְ
  choice: Ako noon ang tagapagdala ng kopa ng hari
  rationale: Ipinakikilala nito ang tungkulin ni Nehemias sa palasyo. Ang “tagapagdala ng kopa” ay malinaw na katawagan sa karaniwang mambabasa at hindi nagdaragdag ng tungkuling hindi tahasang binanggit sa talata.
theological_decisions:
- issue: Kahulugan ng עבד sa panalangin
  choice: lingkod
  alternative: alipin
  rationale: Sa panalanging ito, ang salita ay mapagpakumbabang pagtukoy sa sarili at sa mga taong nakatalaga sa Diyos; hindi pangunahing itinatampok ang legal na kalagayan ng pagkaalipin.
- issue: Kahulugan ng ירא kaugnay ng pangalan ng Diyos
  choice: matakot sa iyong pangalan
  alternative: magpitagan sa iyong pangalan / mamangha sa iyong pangalan
  rationale: Pinananatili ng “matakot” ang tunay na tensiyon ng salitang Hebreo, na maaaring sumaklaw sa takot, pagpipitagan, at banal na panggigilalas, sa halip na paliitin ito sa isa lamang sa mga diwang iyon.
- issue: Pinagmumulan ng habag sa pariralang לְרַחֲמִים לִפְנֵי
  choice: kahabagan siya ng taong ito
  alternative: magkaroon siya ng lingap sa harap ng taong ito
  rationale: Ipinahahayag ng pangunahing salin ang hinihiling na mahabaging pakikitungo nang hindi ginagawang pangkalahatang “pabor” lamang ang רַחֲמִים. Inilalahad sa talababa ang mas malapit na anyo ng idyoma.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit, na may natural na anyo ng pagsusumamo. Pinanatili ang mga biblikal na pariralang “matakot sa iyong pangalan” at “iyong lingkod” dahil mahalaga ang kanilang teolohikal na bigat, habang ang Hebreong idyoma tungkol sa pakikinig at pagtanggap ng habag ay isinalin nang malinaw sa karaniwang mambabasa.
