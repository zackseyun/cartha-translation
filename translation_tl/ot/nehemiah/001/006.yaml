  to: Nawa’y nakatuon ang iyong tainga at nakabukas ang iyong mga mata upang dinggin ang panalangin ng iyong lingkod, na idinadalangin ko ngayon sa harap mo araw at gabi para sa mga anak ni Israel[a], na iyong mga lingkod, habang ipinagtatapat ko ang mga kasalanan ng mga anak ni Israel—ang mga kasalanang nagawa namin laban sa iyo. Ako at ang sambahayan ng aking ama ay nagkasala.
