  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַשֶּׁ֣בֶת וְֽ/עֵינֶ֪י/ךָ פְתֻוּח֟וֹת לִ/שְׁמֹ֣עַ אֶל תְּפִלַּ֣ת עַבְדְּ/ךָ֡ אֲשֶׁ֣ר אָנֹכִי֩ מִתְפַּלֵּ֨ל לְ/פָנֶ֤י/ךָ הַ/יּוֹם֙ יוֹמָ֣ם וָ/לַ֔יְלָה עַל בְּנֵ֥י יִשְׂרָאֵ֖ל עֲבָדֶ֑י/ךָ וּ/מִתְוַדֶּ֗ה עַל חַטֹּ֤אות בְּנֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֣ר חָטָ֣אנוּ לָ֔/ךְ וַ/אֲנִ֥י וּ/בֵית אָבִ֖/י חָטָֽאנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/006.yaml
  text: Please let your ear be attentive and your eyes open to hear the prayer of your servant that I am now praying before you day and night, for the sons of Israel, your servants, while confessing the sins of the sons of Israel that we have sinned against you. I and my father's house have sinned.
translation:
  language: tl
  text: Nawa’y nakatuon ang iyong tainga at nakabukas ang iyong mga mata upang dinggin ang panalangin ng iyong lingkod, na idinadalangin ko ngayon sa harap mo araw at gabi para sa mga anak ni Israel[a], na iyong mga lingkod, habang ipinagtatapat ko ang mga kasalanan ng mga anak ni Israel—ang mga kasalanang nagawa namin laban sa iyo. Ako at ang sambahayan ng aking ama ay nagkasala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “bayan ng Israel” o “mga Israelita.” Sa Hebreo, “mga anak ni Israel,” isang pahayag na nagpapanatili sa ugnayang pampamilya at pangtipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִי נָא
  choice: Nawa’y
  rationale: Ipinahahayag nito ang magalang at taimtim na pakiusap ng jussive na may נָא sa natural at marangal na Tagalog.
- source_word: אָזְנְךָ קַשֶּׁבֶת
  choice: nakatuon ang iyong tainga
  rationale: Pinananatili ang isahang ‘tainga’ at ang antropomorpikong larawan, habang ipinahahayag ng ‘nakatuon’ ang pagiging handang makinig.
- source_word: וְעֵינֶיךָ פְתֻוּחוֹת
  choice: at nakabukas ang iyong mga mata
  rationale: Tuwirang pinananatili ang maramihang ‘mga mata,’ ang kalagayang ‘nakabukas,’ at ang paralelismo sa ‘tainga.’
- source_word: לִשְׁמֹעַ אֶל
  choice: upang dinggin
  rationale: Ang ‘dinggin’ ay natural sa panalangin at higit na nagpapahiwatig ng masusing pakikinig kaysa simpleng pandinig.
- source_word: תְּפִלַּת עַבְדְּךָ
  choice: ang panalangin ng iyong lingkod
  rationale: Pinananatili ang marangal na anyong genitibo at ang ‘lingkod’ na angkop sa mapitagang pagtawag sa Diyos.
- source_word: אֲשֶׁר אָנֹכִי מִתְפַּלֵּל לְפָנֶיךָ
  choice: na idinadalangin ko ngayon sa harap mo
  rationale: Ipinahahayag ng progresibong ‘idinadalangin’ ang nagpapatuloy na kilos; pinananatili ng ‘sa harap mo’ ang לְפָנֶיךָ, at ng ‘ngayon’ ang kasalukuyang temporal na diin.
- source_word: הַיּוֹם יוֹמָם וָלַיְלָה
  choice: ngayon ... araw at gabi
  rationale: Parehong naisasama ang הַיּוֹם at ang idyomang יוֹמָם וָלַיְלָה nang hindi nagiging mabigat o malabo ang Tagalog.
- source_word: עַל בְּנֵי יִשְׂרָאֵל עֲבָדֶיךָ
  choice: para sa mga anak ni Israel, na iyong mga lingkod
  rationale: Ang ‘para sa’ ay angkop sa panalanging iniaalay alang-alang sa iba; pinananatili ng ‘mga anak ni Israel’ ang pampamilya at pangtipang pahayag, at malinaw na appositive ang ‘iyong mga lingkod.’
- source_word: וּמִתְוַדֶּה
  choice: habang ipinagtatapat ko
  rationale: Ipinakikita ng ‘habang’ na kasabay ng pananalangin ang nagpapatuloy na pagtatapat.
- source_word: חַטֹּאות
  choice: mga kasalanan
  rationale: Ito ang karaniwan at teolohikal na mabigat na katumbas sa konteksto ng pagsisisi.
- source_word: אֲשֶׁר חָטָאנוּ לָךְ
  choice: na ginawa namin laban sa iyo
  rationale: Natural sa Tagalog ang pagkakaugnay nito sa ‘mga kasalanan,’ at malinaw na pinananatili ang sama-samang pananagutan at ang Diyos bilang pinagkasalahan.
- source_word: וַאֲנִי וּבֵית אָבִי
  choice: Ako at ang sambahayan ng aking ama
  rationale: Hindi dinaragdagan ng di-tiyak na diin ang וַאֲנִי; ang ‘sambahayan ng aking ama’ ay nagpapanatili sa biblikal na larawan ng pamilya o angkan.
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa Diyos (‘tainga,’ ‘mga mata’)
  choice: Tuwirang pinanatili ang mga larawang ‘tainga’ at ‘mga mata.’
  alternative: Ipakahulugan lamang bilang ‘bigyang-pansin mo.’
  rationale: Sinasadya ng Hebreong panalangin ang kongkretong larawang ito upang ipahayag ang banal na pakikinig at pagtingin; hindi ito dapat payapain sa isang abstraktong paraphrase.
- issue: Paglilipat ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: bayan ng Israel / mga Israelita
  rationale: Pinananatili nito ang pampamilya at pangtipang anyo ng pinagmulan nang hindi ipinapalit ang isang payak na kolektibong katawagan.
- issue: Sama-samang pagtatapat ni Nehemias
  choice: Pinanatili ang ‘ginawa namin’ at ang hiwalay na ‘Ako at ang sambahayan ng aking ama ay nagkasala.’
  alternative: Ibuod bilang pangkalahatang kasalanan lamang ng Israel.
  rationale: Mahalaga sa teksto ang kusang pagsama ni Nehemias sa pananagutan ng bayan at ang tahasang pagkilala sa kasalanan ng sarili niyang sambahayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa panalangin. Pinanatili ang mga kongkretong larawan at paulit-ulit na pahayag ng Hebreo, ngunit inayos ang sintaks upang maging malinaw at natural sa karaniwang mambabasa.
