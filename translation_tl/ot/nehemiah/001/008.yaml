base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/008.yaml
  text: Please remember the word that you commanded your servant Moses[a], saying, ‘If you act unfaithfully[b], I will scatter you among the peoples.’
translation:
  language: tl
  text: '“Alalahanin mo po ang salitang iniutos mo sa lingkod mong si Moises: ‘Kung magtataksil kayo[a], ipapangalat ko kayo sa mga bayan[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kung hindi kayo magiging tapat” o “Kung sisirain ninyo ang katapatan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga bansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: Alalahanin mo po
  rationale: Ang pautos na זְכָר ay ‘alalahanin,’ at ang נָא ay magalang na pakiusap; likas na ipinahahayag ito sa modernong Tagalog sa pamamagitan ng ‘po.’
- source_word: הַדָּבָר
  choice: ang salita
  rationale: Tumutukoy ito sa tiyak na pahayag na ibinigay ng Diyos kay Moises; pinananatili ng ‘salita’ ang anyong leksikal nang hindi ito nililimitahan sa ‘pangako.’
- source_word: צִוִּיתָ
  choice: iniutos mo
  rationale: Tuwirang ipinahahayag ng צוה ang pag-uutos, kahit babala ng tipan ang nilalaman ng siniping pahayag.
- source_word: עַבְדְּךָ
  choice: lingkod mo
  rationale: Sa pagtukoy kay Moises, ang עבד ay nagpapahiwatig ng kinikilalang paglilingkod sa Diyos, kaya mas angkop ang ‘lingkod’ kaysa ‘alipin.’
- source_word: לֵאמֹר
  choice: ':'
  rationale: Sa natural na Tagalog, sapat na ang tutuldok upang ipakilala ang tuwirang sipi; hindi kailangang idagdag ang mabigat na ‘na sinasabi.’
- source_word: תִּמְעָלוּ
  choice: magtaksil kayo
  rationale: Ipinahahayag ng מעל ang aktibong paglabag sa katapatan, lalo na sa konteksto ng tipan. Ang ‘magtaksil’ ay maikli, likas, at nagpapanatili sa diwa ng pagsira ng katapatan.
- source_word: אָפִיץ
  choice: pangangalatin ko
  rationale: Ang Hiphil ng פוץ ay causative na ‘ikalat’ o ‘pang-alatin.’ Ang ‘pangangalatin ko’ ay malinaw at natural sa konteksto ng hatol.
- source_word: בָּעַמִּים
  choice: sa gitna ng mga bayan
  rationale: Ang עַמִּים ay maramihang ‘mga bayan/peoples.’ Pinananatili ng salin ang etnikong maramihan at ang diwa ng pagkakalat sa iba’t ibang pangkat.
theological_decisions:
- issue: Diwa ng tipan sa מעל
  choice: Kapag nagtaksil kayo
  alternative: Kapag hindi kayo naging tapat / Kapag sumira kayo sa katapatan
  rationale: Pinananatili ng ‘magtaksil’ ang aktibong paglabag sa katapatan ng tipan nang hindi tinutukoy nang labis ang isang partikular na uri ng kasalanan.
- issue: Lakas ng kondisyong אַתֶּם תִּמְעָלוּ
  choice: Kapag nagtaksil kayo
  alternative: Kung magtataksil kayo
  rationale: Walang hiwalay na salitang Hebreo para sa ‘kung’; ang sugnay ay maaaring unawain bilang kondisyong babala. Ang ‘kapag’ ay natural sa konteksto ngunit hindi nag-aalis sa pananagutang ipinahahayag ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal. Ginamit ang ‘po’ upang maipakita ang pakiusap na nasa נָא, at pinanatili ang ikalawang panauhang maramihan sa ‘kayo.’ Ang mga marker na [a] at [b] ay inilagay mismo sa pangunahing teksto.
