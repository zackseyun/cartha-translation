  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אָֽנָּ֤א יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם הָ/אֵ֥ל הַ/גָּד֖וֹל וְ/הַ/נּוֹרָ֑א שֹׁמֵ֤ר הַ/בְּרִית֙ וָ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/005.yaml
  text: And I said[a], “Please, O Yahweh, God of heaven, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: tl
  text: At sinabi ko, “Nakikiusap ako, O Yahweh, Diyos ng langit, ang dakila at kasindak-sindak na Diyos[a], na tumutupad sa tipan at nagpapakita ng matapat na pag-ibig[b] sa mga umiibig sa kanya at tumutupad sa kanyang mga utos,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dakila at kahanga-hangang Diyos.”
    reason: lexical_alternative
  - marker: b
    text: O “katapatan sa tipan”; maaari ring “matatag na pag-ibig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: At sinabi ko
  rationale: Pinananatili ang sunod-sunod na daloy ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi dinaragdagan ang ugnayang lohikal.
- source_word: אָֽנָּא
  choice: Nakikiusap ako
  rationale: Likas at magalang na pahayag ng pagsusumamo sa makabagong Filipino; angkop sa panalangin nang hindi gumagamit ng makalumang pananalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Diyos ng langit
  rationale: Natural na katumbas sa Filipino ng pariralang Hebreo at hindi kailangang gawing maramihan ang ‘langit.’
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: dakila at kahanga-hangang Diyos
  rationale: Ipinahahayag ang kadakilaan at pagkamangha na may kasamang mapitagang takot; inilalahad sa talababa ang mas tahasang aspektong ‘katakutan.’
- source_word: שֹׁמֵר הַבְּרִית
  choice: na tumutupad sa tipan
  rationale: Ang ‘tumutupad’ ay natural na wikang Filipino para sa matapat na pag-iingat at pagsasakatuparan ng tipan.
- source_word: וָחֶסֶד
  choice: at nagpapakita ng tapat na pag-ibig
  rationale: Dahil kapantay ito ng ‘tipan’ sa saklaw ng participle, idinagdag ang likas na pandiwang ‘nagpapakita’ upang maiwasan ang alanganing parirala, habang pinananatili ng ‘tapat na pag-ibig’ ang diwa ng matatag na katapatan sa tipan.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: sa mga umiibig sa kanya at tumutupad sa kanyang mga utos
  rationale: Pinananatili ang magkatimbang na mga participial phrase at ang ugnayan ng pag-ibig at pagsunod, sa natural na Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang ‘Yahweh’ ay mas tuwirang transliterasyon at hindi ito pinapalitan ng titulong ‘PANGINOON.’
- issue: Kahulugan ng חֶסֶד sa konteksto ng tipan
  choice: tapat na pag-ibig
  alternative: matatag na pag-ibig; katapatan sa tipan; kagandahang-loob
  rationale: Magkatabi ang חֶסֶד at ‘tipan,’ kaya kailangang marinig kapwa ang pag-ibig at matatag na katapatan nang hindi ginagawang sobrang teknikal ang salin.
- issue: Saklaw ng נוֹרָא
  choice: kahanga-hanga
  alternative: kasindak-sindak; karapat-dapat katakutan
  rationale: Pinananatili sa pangunahing teksto ang marangal at mapitagang pagkamangha, habang kinikilala sa talababa na likas sa salitang Hebreo ang pagkapukaw ng takot.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa panalangin. Ginamit ang ‘Nakikiusap ako’ bilang magalang ngunit hindi makalumang pagsusumamo. Pinanatili ang kuwit sa hulihan sapagkat nagpapatuloy ang panalangin sa kasunod na talata.
