base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/009.yaml
  text: but if you return to me and keep my commandments and do them[a], though your outcasts are at the end of the heavens, from there I will gather them and bring them to the place that I have chosen[c][b], to make my name dwell there.
translation:
  language: tl
  text: Ngunit kung manunumbalik kayo sa akin at iingatan ninyo ang aking mga utos at isasagawa ninyo ang mga ito, kahit ang mga kabilang sa inyo na naitaboy ay nasa dulo ng kalangitan,[a] titipunin ko sila mula roon at dadalhin sila sa lugar na pinili ko upang doon ko patirahin ang aking pangalan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga ipinatapon na kabilang sa inyo” o “mga nangalat na kabilang sa inyo.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “upang ilagay ko roon ang aking pangalan.” Pinananatili ng pangunahing salin ang larawan sa Hebreo na ang pangalan ng Diyos ay nananahan sa piniling lugar.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתֶּם אֵלַי
  choice: Ngunit kung manunumbalik kayo sa akin
  rationale: Ang שׁוּב na may אֶל ay nangangahulugang manumbalik o bumalik sa isang tao. Ipinagpapatuloy ng talata ang pasubaling pahayag sa naunang talata, kaya likas sa Filipino ang “kung”; ipinahihiwatig ng “ngunit” ang paglipat mula sa babala tungo sa pangako.
- source_word: וּשְׁמַרְתֶּם מִצְוֺתַי
  choice: iingatan ang aking mga utos
  rationale: Pinananatili ng “iingatan” ang tipanang diwa ng שׁמר at inihihiwalay ito sa kasunod na tahasang pagsasagawa ng mga utos.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: at isasagawa ang mga iyon
  rationale: Tahasan sa Hebreo ang parehong pag-iingat at paggawa. Ang “isasagawa” ay natural sa Filipino at hindi pinagsasanib ang dalawang sugnay.
- source_word: נִדַּחֲכֶם
  choice: ang mga itinaboy na kabilang sa inyo
  rationale: Ipinahihiwatig ng anyo mula sa נדח ang mga taong sapilitang napalayo o nangalat. Nililinaw ng “kabilang sa inyo” ang panghalip na hulapi nang hindi sinasabing ang kausap mismo ang nagtulak sa kanila.
- source_word: בִּקְצֵה הַשָּׁמַיִם
  choice: nasa dulo ng kalangitan
  rationale: Pinananatili nito ang matingkad na Hebreong idyoma para sa pinakamalayong maiisip na dako, sa halip na agad itong gawing paliwanag lamang.
- source_word: מִשָּׁם אֲקַבְּצֵם
  choice: titipunin ko sila mula roon
  rationale: Ang קבץ ang karaniwang pandiwa para sa muling pagtitipon ng mga nangalat; natural at angkop dito ang “titipunin.”
- source_word: וַהֲבֹאתִים
  choice: at dadalhin sila
  rationale: Ang Hiphil ng בוא ay causative; likas itong ipinapahayag sa Filipino sa pamamagitan ng “dadalhin.”
- source_word: הַמָּקוֹם אֲשֶׁר בָּחַרְתִּי
  choice: sa lugar na pinili ko
  rationale: Tuwirang pinananatili nito ang pagpili ng Diyos sa lugar ng santuwaryo at ang patuloy na bisa ng pagpiling iyon.
- source_word: לְשַׁכֵּן אֶת שְׁמִי שָׁם
  choice: upang doon ko patirahin ang aking pangalan
  rationale: Pinananatili ng “patirahin” ang causative na larawan ng pangalan ng Diyos na nananahan sa piniling lugar, nang hindi ito pinapantay sa pagkakulong ng buong pagkatao ng Diyos sa isang lokasyon.
theological_decisions:
- issue: Pormula ng presensiya ng Diyos sa sugnay tungkol sa santuwaryo
  choice: upang doon ko patirahin ang aking pangalan
  alternative: upang ilagay ko roon ang aking pangalan
  rationale: 'Ginagamit ng Hebreo ang kilalang pormulang tipanan-santuwaryo tungkol sa pangalan ng Diyos na nananahan sa piniling lugar. Pinananatili ng salin ang teolohikal na tensiyon: tunay na iniuugnay ng Diyos ang kanyang pangalan sa lugar, ngunit hindi sinasabing nalilimitahan doon ang kanyang buong presensiya.'
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “manunumbalik,” “iingatan,” at “isasagawa” upang mapanatili ang tipanang himig at ang magkahiwalay na kilos sa Hebreo. Pinanatili ang di-pangkaraniwang larawang “dulo ng kalangitan” at “patirahin ang aking pangalan,” na may maiikling talababa upang maging malinaw sa karaniwang mambabasa.
