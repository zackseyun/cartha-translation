  yaml_path: translation/ot/nehemiah/001/010.yaml
  text: But they are your servants and your people[b][a], whom you redeemed by your great power and by your strong hand.
translation:
  language: tl
  text: Ngunit sila ay iyong mga lingkod at iyong bayan, na tinubos mo[a] sa pamamagitan ng iyong dakilang kapangyarihan at ng iyong malakas na kamay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinalaya sa pamamagitan ng pantubos” o “iniligtas.” Ang pandiwang Hebreo ay tumutukoy sa pagtiyak ng paglaya sa pamamagitan ng isang gawa ng pagliligtas.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “makapangyarihang kamay.” Sa Hebreo, literal itong “malakas na kamay,” isang karaniwang pananalita para sa makapangyarihang pagkilos ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Ngunit sila ay
  rationale: 'Sa daloy ng panalangin, ipinagpapatuloy nito ang pakiusap na may bahagyang pagsalungat: sa kabila ng kasalanan at pagkakatapon, sila pa rin ay kabilang sa Diyos.'
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Maaaring mangahulugang alipin o lingkod ang עבד, ngunit dito ay nangingibabaw ang kaugnayan ng bayan sa Diyos; natural at angkop ang “mga lingkod.”
- source_word: וְעַמֶּךָ
  choice: at iyong bayan
  rationale: Ang עם ay tumutukoy sa sambayanang kabilang sa Diyos; malinaw na pinananatili ang panghalip na paari.
- source_word: פָּדִיתָ
  choice: tinubos mo
  rationale: Ang פדה ay pagtiyak ng paglaya sa pamamagitan ng makapangyarihang pagliligtas. Pinananatili ng “tinubos” ang bigat ng wikang tipan at ang pahiwatig sa exodo.
- source_word: בְּכֹחֲךָ הַגָּדוֹל
  choice: sa pamamagitan ng iyong dakilang kapangyarihan
  rationale: Ipinahahayag ng parirala ang kapangyarihan bilang paraan ng pagtubos; dignificado at malinaw ang salin.
- source_word: וּבְיָדְךָ הַחֲזָקָה
  choice: at ng iyong malakas na kamay
  rationale: Tuwirang pinananatili ang karaniwang Hebreong larawan ng kamay bilang makapangyarihang pagkilos ng Diyos.
theological_decisions:
- issue: Wika ng pagtubos sa panalangin ni Nehemias
  choice: tinubos
  alternative: iniligtas; pinalaya sa pamamagitan ng pantubos
  rationale: Malamang na inaalaala ng talata ang makasaysayang pagliligtas ng Diyos sa kanyang bayan, lalo na ang exodo. Pinananatili ng “tinubos” ang teolohikal na bigat nang hindi nagdaragdag ng doktrinang hindi tahasang sinabi rito.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Pinanatili ang larawang “malakas na kamay” at ang terminong “tinubos,” habang ipinaliliwanag sa mga talababa ang mahahalagang alternatibo.
