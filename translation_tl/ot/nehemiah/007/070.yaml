base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/070.yaml
  text: 'And some of the heads of the fathers’ houses gave to the treasury for the work: twenty thousand gold darics and two thousand two hundred minas of silver[a][b][c].'
translation:
  language: tl
  text: 'At ang ilan sa mga pinuno ng mga angkan ay nagbigay sa kabang-yaman para sa gawain: dalawampung libong darik na ginto[a][b] at dalawang libo at dalawang daang mina na pilak[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang darik ay isang baryang ginto ng Persia.
    reason: cultural_note
  - marker: b
    text: 'Mas literal: “At mula sa mga pinuno ng mga angkan.”'
    reason: lexical_alternative
  - marker: c
    text: Ang mina ay isang sinaunang yunit ng timbang at, kaugnay nito, ng halagang salapi.
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: At ang ilan sa mga pinuno ng mga angkan
  rationale: Ang מִן ay may diwang “mula sa” o “mula sa ilan sa,” kaya natural na ipinahihiwatig na ilan sa mga pinuno ang nagbigay. Sa kontekstong pangangkan at pang-administratibo, malinaw at likas sa modernong Filipino ang “mga pinuno ng mga angkan.”
- source_word: נָתְנוּ
  choice: ay nagbigay
  rationale: Tuwirang katumbas ito ng qal perfect at hindi nagdaragdag ng diwang wala sa teksto gaya ng maaaring ipahiwatig ng “nag-abuloy.”
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: sa kabang-yaman para sa gawain
  rationale: Ang אוֹצָר ay imbakan ng kayamanan o pondo, at ang “para sa gawain” ay natural na nagpapahayag ng layunin ng pondong iyon.
- source_word: זָהָב דַּרְכְּמוֹנִים שְׁתֵּי רִבּוֹת
  choice: dalawampung libong darik na ginto
  rationale: Pinananatili ng “darik” ang tiyak na makasaysayang tawag sa baryang ginto ng Persia, at ang bilang ay ipinahayag sa karaniwang anyong Filipino.
- source_word: וְכֶסֶף מָנִים אַלְפַּיִם וּמָאתָיִם
  choice: at dalawang libo at dalawang daang mina na pilak
  rationale: Pinananatili ng “mina” ang sinaunang yunit ng timbang o halaga sa halip na palitan ito ng di-eksaktong modernong katumbas.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan” upang likas na maipahayag ang sambahayang nagmula sa iisang ninuno nang hindi lubusang pinapantay sa makabagong nukleyar na pamilya. Pinanatili ang makasaysayang mga yunit na “darik” at “mina,” na ipinaliwanag sa mga talababa.
