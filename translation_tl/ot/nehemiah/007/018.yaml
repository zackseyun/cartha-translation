lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaan ng mga bumalik, ipinakikilala ng בְּנֵי ang pangkat ng pamilya o angkan na nagmula sa pinangalanang ninuno. Pinananatili ng “mga anak ni” ang anyong Hebreo at likas itong nauunawaan sa Filipino bilang mga inapo sa talaangkanan.
- source_word: אֲדֹנִיקָם
  choice: Adonikam
  rationale: Isinatinig ang pangalang pantangi sa halip na isalin ang kahulugan nito, alinsunod sa karaniwang anyo ng pangalan sa Filipino.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וְשִׁבְעָה
  choice: '667'
  rationale: Tumpak na katumbas ng bilang na animnaraan at animnapu't pito; ang numerong anyo ay malinaw at natural sa isang mahabang talaan.
