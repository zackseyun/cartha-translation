base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/006.yaml
  text: 'These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away, and who returned to Jerusalem and to Judah[c][b], each man to his city:'
translation:
  language: tl
  text: Ito ang mga kabilang sa lalawigan na umahon mula sa pagkabihag ng mga ipinatapon[a]—yaong ipinatapon ni Nebucadnezar na hari ng Babilonia—at bumalik sa Jerusalem at sa Juda, bawat isa sa kanyang lungsod:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “mula sa pagkabihag ng mga ipinatapon.” Maaari ring mas payak na isalin, “mula sa pagkakatapon.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “bawat lalaki sa kanyang lungsod,” isang distributibong pahayag na tumutukoy sa mga nagbalik ayon sa kani-kanilang sambahayan o angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: mga anak ng lalawigan
  rationale: Pinananatili ang Hebreong idyomang “mga anak ng” para sa mga kabilang sa lalawigan; ang “lalawigan” ay angkop sa administratibong konteksto ng panahong Persiano.
- source_word: הָעֹלִים
  choice: na umahon
  rationale: Pinananatili ang nakaugaliang wika ng pag-ahon patungo sa lupain at sa Jerusalem.
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: mula sa pagkabihag ng mga ipinatapon
  rationale: Isinasalin ang dalawang magkaugnay na pangngalan upang mapanatili ang diin ng Hebreo, kahit mas makinis sana ang simpleng “mula sa pagkakatapon.”
- source_word: אֲשֶׁר הֶגְלָה
  choice: na ipinatapon ni
  rationale: Malinaw at tuwirang ipinapahayag ang sapilitang pagpapaalis na ginawa ng hari.
- source_word: נְבוּכַדְנֶצַּר
  choice: Nebucadnezar
  rationale: Ginagamit ang pamilyar na anyong biblikal sa makabagong Tagalog.
- source_word: וַיָּשׁוּבוּ
  choice: at bumalik
  rationale: Likas na salin ng pandiwang שׁוּב at maayos na nag-uugnay sa mga bumalik sa naunang paksa.
- source_word: לִירוּשָׁלַם וְלִיהוּדָה
  choice: sa Jerusalem at sa Juda
  rationale: Pinananatili ang inuulit na pang-ukol; ang Juda ay tumutukoy sa mas malawak na rehiyon.
- source_word: אִישׁ לְעִירוֹ
  choice: bawat isa sa sarili niyang lungsod
  rationale: Inihahayag ang distributibong diwa nang natural sa Tagalog; ipinaliliwanag sa talababa na tumutukoy ito sa mga umuwi ayon sa kani-kanilang sambahayan o angkan.
theological_decisions:
- issue: Masculine representative language sa אִישׁ
  choice: bawat isa sa sarili niyang lungsod
  alternative: bawat lalaki sa kanyang lungsod
  rationale: Ang אִישׁ ay panlalaking isahan sa anyo, ngunit dito ay distributibong tumutukoy sa mga nagbalik at sa kani-kanilang sambahayan. Iniiwasan ng salin ang maling pahiwatig na mga lalaking indibidwal lamang ang saklaw, habang hindi binubura ang kontekstong pampamilya.
translation_notes:
  register: Makabago at marangal na Tagalog para sa isang pormal na talaan. Pinanatili ang “mga anak ng lalawigan” at “umahon” upang maipakita ang anyo at larawang Hebreo, samantalang ginawang natural ang hulíng distributibong parirala.
