  naturalness: Ang “mga anak ng lalawigan” ay hindi natural sa makabagong Filipino Tagalog at maaaring maling unawain bilang literal na mga anak ng isang lugar. Ang binagong “mga kabilang sa lalawigan” ay malinaw, marangal, at nagpapanatili ng saklaw ng idyoma. Nililinaw rin ng gitling na pariralang appositive ang tinutukoy ng “na ipinatapon” nang hindi binabago ang kahulugan.
  terminology: Ang “lalawigan,” “pagkabihag,” “ipinatapon,” “Nebucadnezar,” “Babilonia,” “Jerusalem,” at “Juda” ay angkop. Pinanatili ang “umahon” bilang salin ng conventional na pandiwang Hebreo para sa pag-ahon/pagpunta pabalik sa lupain.
