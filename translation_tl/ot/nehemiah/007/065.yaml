base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/065.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b].
translation:
  language: tl
  text: At sinabi ng gobernador[a] sa kanila na huwag silang kumain ng mga pinakabanal na handog[b] hanggang sa lumitaw ang isang paring may Urim at Tummim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tirshata,” isang titulong Persiano para sa isang opisyal na tagapamahala.
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa mga sagradong bahagi ng handog na itinuturing na “pinakabanal” at maaaring kainin ng mga pari, hindi sa Pinakabanal na Lugar ng santuwaryo.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: gobernador
  rationale: Ang salitang Aramaiko na hiram sa Persiano ay isang titulong administratibo. Isinalin itong “gobernador” upang malinaw ang tungkulin sa makabagong mambabasa; inilagay sa talababa ang transliterasyong “Tirshata.”
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: na huwag silang kumain
  rationale: Likas sa Filipino ang konstruksiyong ito para sa iniulat na pagbabawal at hindi nito dinaragdagan ang tindi ng pahayag.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: mula sa mga pinakabanal na handog
  rationale: Superlatibong idyoma ang parirala at, sa konteksto ng karapatan ng mga pari na kumain, tumutukoy ito sa mga sagradong bahaging pagkain o handog, hindi sa Pinakabanal na Lugar.
- source_word: עַד עֲמֹד הַכֹּהֵן
  choice: hanggang sa magkaroon ng paring
  rationale: Ipinahihiwatig ng עַד at infinitive ang panahong magtatapos sa hinaharap ang pagbabawal. Ang artikulo sa “pari” ay maaaring generiko, kaya hindi ito ginawang isang dati nang tinukoy na indibidwal.
- source_word: לְאוּרִים וְתוּמִּים
  choice: makapagsangguni sa Urim at Tummim
  rationale: Pinanatili ang nakaugaliang mga pangalang Urim at Tummim. Sa konteksto, ipinapahayag ng parirala ang paghingi ng pasiya sa pamamagitan ng mga ito; ang “makapagsangguni” ay natural sa Filipino habang pinananatili ang gamit ng mga kasangkapang ito sa pagpapasya.
theological_decisions:
- issue: Tinutukoy ng “pinakabanal”
  choice: mga sagradong bahagi ng handog na maaaring kainin ng mga pari
  alternative: ang Pinakabanal na Lugar sa santuwaryo
  rationale: Ang usapin sa konteksto ay ang karapatang kumain ng mga lalaking hindi mapatunayan ang talaangkanang makapari, hindi ang pagpasok sa panloob na santuwaryo.
- issue: Pagbibigay-kahulugan sa titulong Persiano
  choice: gobernador
  alternative: Tirshata
  rationale: Titulo sa pamamahala, hindi personal na pangalan, ang salita. Mas tuwirang naihahatid ng “gobernador” ang kahulugan, habang pinananatili sa talababa ang anyong transliterado.
- issue: Gamit ng Urim at Tummim
  choice: isang pari na makapagsangguni sa Urim at Tummim
  alternative: isang paring may Urim at Tummim
  rationale: Ang לְ ay maaaring ipahayag nang malawak bilang kaugnayan, pag-aari, o paggamit. Nililinaw ng napiling natural na Filipino ang kontekstuwal na gamit sa paghingi ng pasiya nang hindi ipinapaliwanag kung paano gumana ang mga ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “gobernador” bilang madaling maunawaang titulo at “mga pinakabanal na handog” upang maiwasang mapagkamalan ang tinutukoy na pagkain bilang isang lugar sa templo. Ang “makapagsangguni” ay idiomatikong pagpapahayag ng paghingi ng pasiya sa pamamagitan ng Urim at Tummim.
