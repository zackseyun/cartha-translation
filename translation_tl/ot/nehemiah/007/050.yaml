  yaml_path: translation/ot/nehemiah/007/050.yaml
  text: the sons of Reaiah[a], the sons of Rezin, the sons of Nekoda.
translation:
  language: tl
  text: ang mga anak ni Reaya[a], ang mga anak ni Rezin, ang mga anak ni Nekoda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni” o “mga kabilang sa angkan ni” sa bawat paglitaw ng “mga anak ni” sa talaang ito ng mga angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Pinananatili nito ang paulit-ulit na pormang pangangkanan ng Hebreo. Sa konteksto ng talaan, maaari rin itong tumukoy sa mga inapo o mga kabilang sa angkan.
- source_word: רְאָיָה
  choice: Reaya
  rationale: Isinatitik sa paraang natural sa Filipino ang pangalang Hebreo; ang huling ה ay kumakatawan sa katinig na yod at patinig na a, kaya ang Reaya ay malapit sa bigkas na Hebreo.
- source_word: רְצִין
  choice: Rezin
  rationale: Isinatitik ang pangalang pantangi ayon sa anyong Hebreo at sa kinagawiang anyo sa Filipino.
- source_word: נְקוֹדָא
  choice: Nekoda
  rationale: Isinatitik sa Filipino ang pangalang pantangi, na malapit sa masoretikong pagbigkas ng anyong Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at paulit-ulit na estruktura ng talaang Hebreo, pati ang posibleng mas malawak na kahulugan ng בְּנֵי sa talababa.
