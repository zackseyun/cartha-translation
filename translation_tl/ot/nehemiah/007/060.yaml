  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: tl
  text: Ang kabuuang bilang ng mga lingkod sa templo at ng mga anak ng mga lingkod ni Solomon ay tatlong daan at siyamnapu't dalawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Netinim,” ang tradisyonal na transliterasyon ng tawag sa isang pangkat ng mga lingkod sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Ang lahat ng
  rationale: Ipinakikilala ng כָּל ang kabuuang bilang ng dalawang pangkat; natural at malinaw ang “Ang lahat ng” sa konteksto ng talaan.
- source_word: הַנְּתִינִים
  choice: mga lingkod sa templo
  rationale: Tumutukoy ito sa isang kinikilalang pangkat na nakatalaga sa paglilingkod sa templo. Mas malinaw sa karaniwang mambabasa ang salin ayon sa tungkulin kaysa transliterasyong “Netinim,” na inilagay bilang alternatibo sa talababa.
- source_word: וּבְנֵי
  choice: at mga anak ng
  rationale: Pinananatili nito ang pormal na kahulugan ng בְּנֵי at ang anyo ng kinikilalang pangalan ng pangkat, bagaman maaari rin itong tumukoy sa mga inapo.
- source_word: עַבְדֵי
  choice: mga lingkod
  rationale: Maaaring mangahulugan ang עֶבֶד ng lingkod o alipin; sa pormulang ito na pangalan ng isang pangkat na kaugnay ni Solomon, hindi ipinagpapalagay ng teksto na binibigyang-diin ang kalagayan ng pagkaalipin.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Ginamit ang karaniwang anyo ng pangalan sa modernong saling Tagalog.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: tatlong daan at siyamnapu't dalawa
  rationale: Isinulat sa salita ang kardinal na bilang para sa natural at marangal na daloy ng tekstong biblikal.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang “mga anak ng mga lingkod ni Solomon” bilang pormal na katawagan sa pangkat, sa halip na tahimik na gawing “mga inapo,” at ipinaliwanag sa talababa ang tradisyonal na terminong Netinim.
