  - marker: b
    text: Maaari ring baybaying Hashufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: ang mga lingkod sa templo
  rationale: Ang נְתִינִים ay teknikal na katawagan sa isang pangkat na itinalaga sa paglilingkod sa templo. Isinalin ang tungkulin nito upang maging malinaw sa makabagong mambabasa, habang inilagay sa talababa ang tradisyonal na transliterasyon.
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Pinananatili nito ang literal at paulit-ulit na anyo ng talaangkanan. Sa kontekstong ito, maaari rin itong tumukoy sa mga inapo o angkan.
- source_word: צִחָא
  choice: Ziha
  rationale: Transliterasyon ng pangalang Hebreo ayon sa karaniwang baybay at bigkas sa Filipino.
- source_word: חֲשֻׂפָא
  choice: Hasufa
  rationale: Transliterasyon ng pangalang Hebreo gamit ang likas na baybay sa Filipino; ang שׂ ay kinakatawan ng s at ang φ-tunog na ipinahihiwatig ng ilang tradisyong Ingles ay hindi nasa Hebreo.
- source_word: טַבָּעוֹת
  choice: Tabbaot
  rationale: Transliterasyon na pinananatili ang dobleng katinig ng anyong Hebreo at iniaangkop ang hulíng tunog sa baybay ng Filipino.
