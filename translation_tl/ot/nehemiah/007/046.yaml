  yaml_path: translation/ot/nehemiah/007/046.yaml
  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[b], the sons of Tabbaoth.'
translation:
  language: tl
  text: 'Ang mga lingkod sa templo[a]: ang mga anak ni Ziha, ang mga anak ni Hasufa[b], at ang mga anak ni Tabbaot.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, Netinim, isang teknikal na katawagan sa pangkat na itinalaga sa paglilingkod sa templo.
