  text: 'ang mga lalaki ng Kiriat-Jearim, Kefira, at Beerot: 743.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ang mga lalaki ng
  rationale: Tuwirang pinananatili ang panlalaking anyo ng Hebreong construct plural sa talaan ng mga bumalik, sa halip na gawing mas pangkalahatang “mga tao” o “mga naninirahan.”
- source_word: קִרְיַת יְעָרִים
  choice: Kiriat-Jearim
  rationale: Isinalin sa karaniwang transliterasyong madaling basahin sa modernong Filipino, habang pinananatiling pangalan ng lugar at hindi isinasalin ang kahulugan nito.
- source_word: כְּפִירָה
  choice: Kefira
  rationale: Transliterasyon ng pangalan ng lugar ayon sa tunog at ortograpiyang natural sa Filipino; hindi kailangan ang alternatibong anyong Ingles na “Chephirah.”
- source_word: וּבְאֵרוֹת
  choice: at Beerot
  rationale: Pinananatili ang pangatnig at tinutumbasan ang pangalan ng lugar sa malinaw na transliterasyong Filipino.
- source_word: שְׁבַע מֵאוֹת אַרְבָּעִים וּשְׁלֹשָׁה
  choice: '743'
  rationale: Eksaktong kabuuan ng bilang sa Hebreo; ginamit ang mga numero para sa madaling pagbasa sa konteksto ng talaan.
