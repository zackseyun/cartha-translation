base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/043.yaml
  text: 'The Levites: the sons of Jeshua[a], of Kadmiel, of the sons of Hodvah, seventy-four.'
translation:
  language: tl
  text: 'Ang mga Levita: ang mga anak ni Jeshua, ni Kadmiel, at ng mga anak ni Hodva[a]—pitumpu’t apat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Hodva.” Ang literal na mababasa sa Hebreo ay “mga anak ni Hodva,” isang pananalitang pang-talaangkanan na maaaring tumukoy sa mas malawak na angkan at hindi lamang sa tuwirang mga anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Ang mga Levita
  rationale: Tiyak na pangngalang maramihan na nagpapakilala sa kasunod na pangkat sa talaan; pinanatili ang anyong parang pamagat nang hindi nagdaragdag ng pandiwa.
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaangkanan at sensus, maaari itong tumukoy sa mga kasapi o inapo ng isang angkan. Pinanatili sa pangunahing teksto ang pormal na larawang ‘mga anak,’ na likas ding nauunawaan sa Filipino bilang lahi o angkan ayon sa konteksto.
- source_word: יֵשׁוּעַ
  choice: Jeshua
  rationale: Transliterasyon ng pangalang Hebreo na יֵשׁוּעַ, na pinananatiling naiiba sa mas mahabang anyong karaniwang isinasaling Josue.
- source_word: לְקַדְמִיאֵל
  choice: ni Kadmiel
  rationale: Ipinahahayag ng unlaping ל ang kaugnayang pampamilya sa talaan. Ang ‘ni Kadmiel’ ang maikli at likas na paraan sa Filipino nang hindi tahasang nilulutas ang eksaktong antas ng ugnayan.
- source_word: לִבְנֵי לְהוֹדְוָה
  choice: mula sa mga anak ni Hodva
  rationale: Pinananatili ang patong-patong na pahayag ng lahi sa Hebreo. Ginamit ang ‘mula sa’ upang malinaw na ipakita ang pinanggalingang angkan, habang ang ‘mga anak’ ay nananatiling malapit sa anyo ng orihinal.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: pitumpu’t apat
  rationale: Likas na modernong Filipino para sa bilang ng mga nakatala.
