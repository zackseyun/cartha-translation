  terminology: Ang “mga Levita,” “mga bantay-pinto,” “mga mang-aawit,” at “mga lingkod sa templo” ay wasto at angkop sa rehistro. Wastong nakaangkla ang talababa [a] sa “mga lingkod sa templo” at [b] sa “mga anak ni Israel”; ang mga alternatibo ay hindi ipinipilit sa pangunahing teksto.
