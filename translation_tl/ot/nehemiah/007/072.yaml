language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֡ם וְ/הַ/שּׁוֹעֲרִים֩ וְ/הַ/מְשֹׁרְרִ֨ים וּ/מִן הָ/עָ֧ם וְ/הַ/נְּתִינִ֛ים וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶ֑ם וַ/יִּגַּע֙ הַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י וּ/בְנֵ֥י יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/072.yaml
  text: So the priests[a], the Levites, the gatekeepers, the singers, some of the people, the temple servants, and all Israel lived in their cities. And when the seventh month arrived[b], the sons of Israel were in their cities.
translation:
  language: tl
  text: Kaya nanirahan sa kani-kanilang mga lungsod ang mga pari, mga Levita, mga bantay-pinto, mga mang-aawit, ilan sa mga mamamayan, mga lingkod sa templo[a], at ang buong Israel. At nang dumating ang ikapitong buwan, ang mga anak ni Israel[b] ay nasa kani-kanilang mga lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Netinim,” ang tradisyonal na transliterasyon ng pangalan ng pangkat na ito ng mga lingkod sa templo.
    reason: lexical_alternative
  - marker: b
    text: 'O “ang mga Israelita” o “ang bayang Israel.” Literal sa Hebreo: “ang mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: nanirahan
  rationale: Sa konteksto ng muling paninirahan, likas na ipinapahayag ng “nanirahan” ang diwa ng paglagi o pagtira sa isang lugar.
- source_word: הַכֹּהֲנִים
  choice: mga pari
  rationale: Karaniwan at tuwirang salin ng katawagang Hebreo para sa mga pari.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Kinikilalang katawagan sa Filipino para sa mga kabilang sa lipi at paglilingkod ni Levi.
- source_word: הַשּׁוֹעֲרִים
  choice: mga bantay-pinto
  rationale: Malinaw na tumutukoy sa mga inatasang magbantay sa mga pintuang-bayan o pintuan ng templo.
- source_word: הַמְשֹׁרְרִים
  choice: mga mang-aawit
  rationale: Tuwirang inilalarawan ang mga umaawit, lalo na sa paglilingkod sa templo.
- source_word: וּמִן הָעָם
  choice: ilan sa mga mamamayan
  rationale: Pinananatili ang partitive na diwa ng parirala—isang bahagi ng karaniwang bayan bukod sa mga grupong naglilingkod sa templo.
- source_word: הַנְּתִינִים
  choice: mga lingkod sa templo
  rationale: Isinasalin ang tungkulin ng natatanging pangkat upang agad itong maunawaan; inilalagay sa talababa ang tradisyonal na transliterasyon.
- source_word: וְכָל יִשְׂרָאֵל
  choice: at ang buong Israel
  rationale: Pinananatili ang kolektibong katawagan sa buong bayang Israel.
- source_word: בְּעָרֵיהֶם
  choice: sa kani-kanilang mga lungsod
  rationale: Ang “kani-kanilang” ay natural na Filipino para sa pamamahagi ng mga pangkat sa sarili nilang mga lungsod.
- source_word: וַיִּגַּע
  choice: dumating
  rationale: Kapag panahon o buwan ang paksa, ang pandiwa ay idyomatikong nangangahulugang sumapit o dumating.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ang ikapitong buwan
  rationale: Tuwirang salin ng panandang pangkalendaryo.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang literal na anyong “mga anak ni Israel,” habang nililinaw sa talababa ang kolektibong kahulugan nito.
theological_decisions:
- issue: Kolektibong ekspresyong may kasariang gramatikal na בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita / ang bayang Israel
  rationale: Literal na “mga anak ni Israel” ang Hebreo, ngunit ginagamit din itong kolektibong katawagan sa mga Israelita. Pinananatili sa teksto ang anyo ng pinagmulan at inilalahad sa talababa ang natural na kolektibong kahulugan.
- issue: Pagbibigay-kahulugan sa נְתִינִים
  choice: mga lingkod sa templo
  alternative: mga Netinim
  rationale: Mas malinaw sa karaniwang mambabasa ang saling ayon sa tungkulin, samantalang pinananatili sa talababa ang tradisyonal na pangalan ng pangkat.
translation_notes:
  register: 'Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kani-kanilang” upang maging likas ang pamamahaging diwa ng paninirahan. Inilagay ang mga talababa sa mismong mga terminong tinutukoy: [a] pagkatapos ng “mga lingkod sa templo” at [b] pagkatapos ng “mga anak ni Israel.”'
