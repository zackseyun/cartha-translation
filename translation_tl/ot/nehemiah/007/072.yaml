  source_fidelity: 'Tumpak na naipapahayag ng salin ang dalawang sugnay ng Hebreo: ang mga nakalistang pangkat ay nanirahan sa kani-kanilang mga lungsod, at pagsapit ng ikapitong buwan ay nasa kani-kanilang mga lungsod ang mga anak ni Israel. Napanatili ang partitive na diwa ng וּמִן־הָעָם sa “ilan sa mga mamamayan” at ang pagkakaiba ng “buong Israel” sa unang sugnay at “mga anak ni Israel” sa ikalawa.'
