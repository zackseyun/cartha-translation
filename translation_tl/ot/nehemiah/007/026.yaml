translation:
  language: tl
  text: Ang mga lalaki ng Betlehem at Netofa[a] ay 188.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga tao ng Betlehem at Netofa.” Literal sa Hebreo, “ang mga lalaki ng,” isang karaniwang pananalita sa mga talaan ng populasyon at ng mga bumalik.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ang mga lalaki ng
  rationale: Ang construct plural ng אִישׁ ay karaniwang panimula sa mga talaan ng mga tao ayon sa bayan. Pinananatili ng “mga lalaki ng” ang anyong panlalaki at ang estilo ng talaan sa Hebreo.
- source_word: בֵית לֶחֶם
  choice: Betlehem
  rationale: Pangalan ito ng lugar; ginamit ang nakaugaliang modernong baybay sa Filipino sa halip na isalin nang literal.
- source_word: וּנְטֹפָה
  choice: at Netofa
  rationale: Pinag-uugnay ng waw ang dalawang pangalan ng lugar, at iisang kabuuang bilang ang ibinibigay para sa mga ito.
- source_word: מֵאָה שְׁמֹנִים וּשְׁמֹנָה
  choice: '188'
  rationale: Ang bilang sa Hebreo ay isang daan at walumpu't walo. Ang numerong “188” ay malinaw at natural sa isang maikling talaan.
