base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/001.yaml
  text: When the wall had been built and I had set up the doors[a], the gatekeepers, the singers[b], and the Levites were appointed.
translation:
  language: tl
  text: Nang maitayo na ang pader at mailagay ko na ang mga pinto, itinalaga[a] ang mga tagapagbantay ng mga tarangkahan, ang mga mang-aawit, at ang mga Levita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inatasan” o “itinala”; ang pandiwang Hebreo ay may mas malawak na diwang administratibo kaysa sa pormal na paghirang lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Likas na panandang temporal sa Filipino para sa Hebreong pambungad na nagtatakda ng kalagayan ng kasunod na pangyayari; hindi na idinagdag ang literal ngunit mabigat na “at nangyari.”
- source_word: נִבְנְתָה הַחוֹמָה
  choice: maitayo na ang pader
  rationale: Pinananatili ang pasibong diwa ng Niphal at ang naunang pagkaganap kaugnay ng pangunahing kilos. Hindi ginamit ang “muling maitayo” sapagkat hindi tahasang nasa pandiwa ang ideya ng muling pagtatayo.
- source_word: וָאַעֲמִיד הַדְּלָתוֹת
  choice: maikabit ko na ang mga pinto
  rationale: Sa konteksto ng mga pinto ng tarangkahan, ang Hiphil ng עמד ay tumutukoy sa pagpapalagay o paglalagay ng mga ito sa puwesto. Mas natural dito ang “maikabit” kaysa sa literal na “maitayo,” habang hindi idinaragdag sa pangunahing teksto ang salitang “tarangkahan.”
- source_word: וַיִּפָּקְדוּ
  choice: inatasan
  rationale: Ipinapahayag ang administratibong diwa ng Niphal ng פקד. Maaari rin itong mangahulugang itinalaga o itinala, kaya inilalahad ang lawak nito sa talababa.
- source_word: הַשּׁוֹעֲרִים
  choice: mga bantay sa pintuan
  rationale: Malinaw at likas na katumbas sa modernong Filipino ng mga tagapagbantay ng mga pintuan o tarangkahan.
- source_word: הַמְשֹׁרְרִים
  choice: mga mang-aawit
  rationale: Tuwirang salin ng katawagang tumutukoy sa mga mang-aawit, karaniwang may tungkuling panliturhiya.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Karaniwang anyong Filipino ng pangalan ng pangkat na mula sa lipi ni Levi.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “maitayo na” at “maikabit ko na” upang natural na ipakita ang mga kilos na natapos bago ang pag-aatas. Ang “pader” at “mga pinto” ay nananatiling payak, gaya ng Hebreo, nang hindi tahasang dinaragdagan ng “ng lungsod” o “ng mga tarangkahan.”
