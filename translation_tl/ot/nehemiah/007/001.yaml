  naturalness: Likas ang pangungusap, ngunit mas malinaw at mas marangal sa modernong Filipino ang “mailagay ko na ang mga pinto” para sa paglalagay ng mga pinto sa puwesto at “mga tagapagbantay ng mga tarangkahan” para sa tungkulin ng mga שׁוֹעֲרִים.
