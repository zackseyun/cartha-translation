translation:
  language: tl
  text: ang mga anak ni Pahat-moab[a], na kabilang sa mga anak nina Jeshua at Joab, 2,818.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga inapo ni Pahat-moab … mga inapo nina Jeshua at Joab.” Ang Hebreong “mga anak ni” ay madalas tumukoy sa mas malawak na linya ng angkan, hindi lamang sa mismong mga anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Sa talaang pangangkan, tumutukoy ito sa isang angkan o pangkat ng mga inapo, ngunit pinananatili ng “mga anak ni” ang konkretong idyomang Hebreo; nililinaw sa talababa ang mas malawak na diwa.
- source_word: פַחַת מוֹאָב
  choice: Pahat-moab
  rationale: Pangngalang pantangi ito kaya tinumbasan sa transliterasyong madaling basahin sa Filipino, sa halip na isalin ang mga bahagi ng pangalan.
- source_word: לִבְנֵי
  choice: mula sa mga anak nina
  rationale: Ang prefiks na לְ ay nagpapakita rito ng kaugnayan o subgrupo sa loob ng angkan ni Pahat-moab. Ang “mula sa” ay natural sa Filipino at hindi labis na nilulutas ang tiyak na estruktura ng ugnayang pangangkan.
- source_word: יֵשׁוּעַ
  choice: Jeshua
  rationale: Pinananatili ang anyong posteksilikong Jeshua na kumakatawan sa mismong anyong Hebreo, sa halip na palitan ito ng Joshua.
- source_word: וְיוֹאָב
  choice: at Joab
  rationale: Tuwirang tinutumbasan ang pangatnig at pinananatili ang kinagawiang transliterasyon ng pangalan.
- source_word: אַלְפַּיִם וּשְׁמֹנֶה מֵאוֹת שְׁמֹנָה עָשָׂר
  choice: 2,818
  rationale: Eksaktong bilang itong dalawang libo walong daan at labingwalo; ang numerals ay mas madaling makita at basahin sa isang talaan ng sensus.
