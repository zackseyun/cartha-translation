translation:
  language: tl
  text: ang mga anak ni Gazzam[a], ang mga anak ni Uzza, ang mga anak ni Paseah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni” sa bawat paglitaw ng “mga anak ni”; ang Hebreong pormula sa talaangkanan ay maaaring tumukoy sa mas malawak na angkan, hindi lamang sa tuwirang mga anak na lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Ang pangmaramihang construct ng בֵּן ay literal na “mga anak ni,” ngunit sa talaangkanan o listahan maaari rin itong tumukoy sa mas malawak na mga inapo o angkan. Pinanatili ang malinaw at pormal na katumbas, na may talababa upang ipakita ang saklaw ng kahulugan.
- source_word: גַזָּם
  choice: Gazam
  rationale: Pangngalang pantangi; isinalin sa baybay na madaling bigkasin sa modernong Filipino at malapit sa Hebreong anyo.
- source_word: עֻזָּא
  choice: Uza
  rationale: Pangngalang pantangi; ang “Uza” ay tuwirang transliterasyon na natural sa ortograpiyang Filipino.
- source_word: פָסֵחַ
  choice: Paseah
  rationale: Pangngalang pantangi; pinanatili ang anyong “Paseah,” na kumakatawan sa mga katinig at patinig ng Hebreo at nakikilala rin sa tradisyon ng mga salin.
