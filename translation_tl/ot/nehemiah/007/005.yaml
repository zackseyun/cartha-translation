base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/005.yaml
  text: 'Then my God put it into my heart to assemble the nobles[a], the officials, and the people to be enrolled by genealogy. And I found the book of the genealogy of those who came up first[b], and I found written in it:'
translation:
  language: tl
  text: 'Pagkatapos, inilagay ng aking Diyos sa puso ko na tipunin ang mga maharlika, ang mga opisyal, at ang mga tao upang maitala sila ayon sa kanilang mga angkan.[a] Natagpuan ko ang aklat ng talaangkanan ng mga unang umakyat,[b] at natagpuan kong nakasulat dito:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang magpatala sila ayon sa kanilang talaangkanan.” Tumutukoy ang Hebreo sa opisyal na pagtatala batay sa angkan o pinagmulang pamilya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang aklat ng talaangkanan ng mga umakyat noong una.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֱלֹהַי אֶל לִבִּי
  choice: inilagay ng aking Diyos sa puso ko
  rationale: Likas na idyomang Filipino ito na nagpapanatili sa pagkilos ng Diyos at sa panloob na pag-uudyok, nang hindi tinutukoy kung paano ito ipinahayag.
- source_word: וָאֶקְבְּצָה
  choice: na tipunin
  rationale: Inilalahad nito bilang nilalaman o layunin ng pag-uudyok ng Diyos, gaya ng ipinahihiwatig ng anyong Hebreo sa konteksto.
- source_word: הַחֹרִים
  choice: mga maharlika
  rationale: Sa Nehemias, tumutukoy ito sa mga nakatataas sa lipunan o mga prominenteng pinuno, hindi lamang sa mga taong malaya.
- source_word: הַסְּגָנִים
  choice: mga pinuno
  rationale: Malinaw at pangkaraniwang katawagan ito para sa mga tagapangasiwa o opisyal na may kapangyarihang pansibiko.
- source_word: הָעָם
  choice: mga tao
  rationale: Karaniwang salin na malinaw na ibinubukod sa mga maharlika at pinuno.
- source_word: לְהִתְיַחֵשׂ
  choice: upang maitala sila ayon sa kanilang mga angkan
  rationale: Ipinahahayag nito ang opisyal na pagtatala batay sa pinagmulang pamilya, habang pinananatili ang diwang reflexive/passive ng hitpael sa natural na Filipino.
- source_word: סֵפֶר הַיַּחַשׂ
  choice: aklat ng talaangkanan
  rationale: Malapit ito sa pormal na anyo ng Hebreo at malinaw na tumutukoy sa isang nakasulat na tala ng mga angkan.
- source_word: הָעוֹלִים בָּרִאשׁוֹנָה
  choice: mga unang umahon
  rationale: Pinananatili ng “umahon” ang biblikal na paglalarawan sa pagpunta sa Juda/Jerusalem, at ipinahihiwatig ng “unang” ang naunang pangkat nang hindi ginagawang tahasang “mga nagsibalik.”
- source_word: וָאֶמְצָא כָּתוּב בּוֹ
  choice: 'at nakita kong nakasulat dito:'
  rationale: Pinananatili nito ang pag-uulit ng pandiwang “natagpuan/nakita” at natural na ipinakikilala ang talaang kasunod.
theological_decisions:
- issue: Pananalita tungkol sa pag-uudyok ng Diyos sa pamumuno ni Nehemias
  choice: inilagay ng aking Diyos sa puso ko
  alternative: kinasihan ako ng aking Diyos
  rationale: Ipinakikita ng Hebreo ang pagkilos ng Diyos sa kalooban ni Nehemias ngunit hindi tinutukoy ang paraan ng paghahayag. Iniiwasan ng salin na gawing mas tiyak itong pormal na pagkasi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maharlika” at “pinuno” bilang madaling maunawaang mga katawagang pansibiko; pinanatili ang “umahon” upang hindi mawala ang talinghagang Hebreo ng pag-akyat patungo sa lupain o sa Jerusalem.
