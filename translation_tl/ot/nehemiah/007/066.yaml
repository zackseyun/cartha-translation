  text: The whole assembly together was forty-two thousand three hundred sixty,[a]
translation:
  language: tl
  text: Ang buong kapulungan, sa kabuuan, ay 42,360.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bilang iisa.” Ipinahihiwatig nito na ang kapulungan ay itinuring bilang iisang kabuuang bilang.
