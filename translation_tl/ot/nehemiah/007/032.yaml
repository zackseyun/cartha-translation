  rationale: Karaniwang transliterasyon sa Filipino ng pangalang-lugar; hindi isinasalin ang literal na kahulugang “bahay ng Diyos.”
- source_word: וְהָעָי
  choice: at Ai
  rationale: Isinasalin ang pang-ugnay at tina-transliterate ang pangalang-lugar; hindi inililipat ang artikulong Hebreo dahil hindi ito likas sa Filipino bago ang ganitong pangalan.
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
