    issue: Hindi ganap na likas ang pariralang "mga lalaki ng Bethel at Ai."
    rationale: Bagaman malapit sa anyong Hebreo, ang "ng" sa Filipino ay madaling basahing pagmamay-ari. Ang "mula sa" ay idiomatikong paraan upang tukuyin ang mga taong kinilala ayon sa kanilang bayan.
  - severity: low
    issue: Maliit na pagkukulang sa ortograpiya at pahayag ng talababa.
    rationale: Dapat malaking titik ang unang salita ng teksto. Mas maayos ang "Sa literal na Hebreo" kaysa "Literal sa Hebreo."
