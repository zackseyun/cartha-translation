  naturalness: Natural at marangal ang paulit-ulit na “ang mga anak ni” para sa isang talaangkanan. Ang pagdaragdag ng “at” bago ang huling pangkat ay katanggap-tanggap sa modernong Filipino at hindi nagpapabago sa kahulugan. Inayos ang pananalita ng ikalawang talababa upang maging idiomatiko.
  terminology: Ang “mga anak ni” ay angkop na tuwirang katumbas sa anyong-listahan, habang nililinaw ng talababa na maaari itong mangahulugan ng linya ng angkan. Ang mga pangalan ay pinanatiling mga pangalang pantangi at hindi isinalin.
