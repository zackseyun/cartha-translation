  text: ang mga anak ni Sefatias[a], ang mga anak ni Hatil, ang mga anak ni Poqueret-hasebaim[b], at ang mga anak ni Amon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga inapo ni” sa buong talata; sa mga talaangkanan, ang Hebreong “mga anak ni” ay madalas tumukoy sa isang linya ng angkan.
