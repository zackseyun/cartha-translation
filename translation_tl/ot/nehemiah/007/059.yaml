lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Tuwirang inililipat ang konstruktong maramihan ng בֵּן at pinananatili ang paulit-ulit na anyo ng talaangkanan. Sa ganitong listahan, maaari rin itong tumukoy sa mga inapo o angkan, hindi lamang sa mismong mga anak.
- source_word: שְׁפַטְיָה
  choice: Sefatias
  rationale: Isinalin bilang pangalang pantangi ayon sa nakaugaliang anyong Filipino/Biblikal, sa halip na isalin ang kahulugan ng pangalan.
- source_word: חַטִּיל
  choice: Hatil
  rationale: Tuwirang transliterasyon ng pangalang pantangi, na iniangkop sa baybay na madaling basahin sa Filipino.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: Poqueret-hazebaim
  rationale: Pinanatili bilang tambalang pangalan ng angkan. Ginamit ang gitling upang ipakitang magkakaugnay ang dalawang sangkap, habang hindi ipinipilit ang isang tiyak na pagsusuri sa ugnayan ng mga ito.
- source_word: אָמֽוֹן
  choice: Amon
  rationale: Pinanatili bilang pangalang pantangi ng isang angkan; hindi ito itinuring na karaniwang pangngalan o terminong teolohikal.
