  text: the sons of Jaala[a], the sons of Darkon, the sons of Giddel.
translation:
  language: tl
  text: ang mga anak ni Jaala[a], ang mga anak ni Darkon, at ang mga anak ni Giddel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ibang tradisyon ng pagbaybay, “Jaalah” ang pangalan; ihambing sa kaparehong tala sa Ezra 2:56.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaang ito ng mga angkan, literal na nangangahulugang “mga anak ni” ang בְּנֵי at maaari rin itong tumukoy sa mga inapo o kasapi ng angkan. Pinananatili ng salin ang konkretong pananalita ng Hebreo nang hindi nililimitahan ito sa mga tuwirang anak lamang.
- source_word: יַעְלָא
  choice: Jaala
  rationale: Pangalan itong pantangi kaya tinumbasan sa pamamagitan ng transliterasyon. Ang “Jaala” ay sumusunod sa anyo ng pangalang nasa tekstong Hebreo ng talatang ito.
- source_word: דַרְקוֹן
  choice: Darkon
  rationale: Pangalan itong pantangi at direktang isinalin sa titik bilang “Darkon.”
- source_word: גִדֵּל
  choice: Giddel
  rationale: Pangalan itong pantangi at direktang isinalin sa titik bilang “Giddel,” na pinananatili ang dobleng katinig na ipinahihiwatig ng Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang paulit-ulit na “ang mga anak ni” upang mapanatili ang pormula at ritmo ng talaang Hebreo; idinagdag ang “at” bago ang huling pangkat para sa likas na daloy sa Filipino.
