  text: the men of the other Nebo[a], fifty-two.
translation:
  language: tl
  text: Ang mga lalaki mula sa ibang Nebo[a]—limampu't dalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isa pang Nebo.” Ang salitang Hebreo ay maaaring mangahulugang “iba” o “isa pa”; malamang na ipinag-iiba rito ang pook na ito sa Nebo na binanggit sa ibang bahagi ng talaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ang mga lalaki mula sa
  rationale: Ang construct plural ng אִישׁ ay tuwirang tumutukoy sa mga lalaki o mga lalaking kinatawan ng mga sambahayan na nagmula sa isang lugar. Ginamit ang “mula sa” upang maging natural sa Filipino habang pinananatili ang ugnayan sa pook.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Pangalan ito ng pook, kaya tinumbasan sa pamamagitan ng transliterasyon.
- source_word: אַחֵר
  choice: kabilang
  rationale: Maaaring mangahulugang “iba” o “isa pang” ang Hebreo. Ang “kabilang Nebo” ay natural na nagpapahiwatig na ibinubukod ang pook na ito mula sa isa pang Nebo nang hindi lubusang inaalis ang likas na kalabuan.
- source_word: חֲמִשִּׁים וּ/שְׁנָיִם
  choice: limampu't dalawa
  rationale: Karaniwang modernong Filipino na pagpapahayag ng bilang na 52.
