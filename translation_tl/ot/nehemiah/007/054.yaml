  text: the sons of Bazlith, the sons of Mehida, the sons of Harsha—
translation:
  language: tl
  text: ang mga anak ni Bazlit, ang mga anak ni Mehida, ang mga anak ni Harsa—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaang ito ng mga angkan, ipinakikilala ng בְּנֵי ang mga kabilang sa lahi o sambahayan ng isang pinagmulan. Ang “mga anak ni” ay pormal na malinaw, natural sa Tagalog, at hindi nililimitahan ang diwa sa mga literal na anak lamang.
- source_word: בַצְלִית
  choice: Bazlit
  rationale: Pangngalang pantangi ito kaya tinumbasan sa paraang transliterasyon. Ang “Bazlit” ay sumusunod sa tunog ng Hebreo at hindi ginagawang “th” ang huling ת, na mas angkop sa makabagong ortograpiyang Filipino.
- source_word: מְחִידָא
  choice: Mehida
  rationale: Pangngalang pantangi ito kaya isinalin sa pamamagitan ng transliterasyon. Ginamit ang “h” para sa ח bilang isang madaling basahin at karaniwang pag-aangkop sa Filipino.
- source_word: חַרְשָׁא
  choice: Harsa
  rationale: Pangngalang pantangi ito kaya transliterasyon ang ginamit sa halip na isalin ang posibleng kahulugang leksikal. Ang “Harsa” ay likas basahin sa Filipino at kinakatawan ang mga pangunahing tunog ng pangalan.
theological_decisions: []
translation_notes:
  register: Payak ngunit marangal na anyo para sa isang talaan ng mga angkan. Inulit ang “ang mga anak ni” upang mapanatili ang estruktura at ritmo ng Hebreo. Pinanatili ang gitling sa dulo dahil nagpapatuloy ang listahan sa kasunod na talata.
