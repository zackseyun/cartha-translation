translation_notes:
  register: Maikli at dignidad na pormulasyon para sa talaang pangangkan. Ginamit ang “mga anak ni” upang mapanatili ang estruktura ng Hebreo, habang nauunawaan sa konteksto bilang mga kabilang sa angkan o mga inapo.
