lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Ang construct plural ng בֵּן ay nagpapakilala sa isang angkan sa talaan. Ang “mga anak ni” ay malapit sa anyong Hebreo at maaari ring tumukoy sa mga kaapu-apong kabilang sa angkan.
- source_word: זַכָּי
  choice: Zacai
  rationale: Isinalin sa karaniwang anyong transliterasyon sa Filipino ang pangalang Hebreo, sa halip na isalin ang kahulugan nito.
- source_word: שְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: pitong daan at animnapu
  rationale: Likas na paglalahad sa Filipino ng bilang na 760, na pinananatiling nakasulat sa salita ayon sa estilo ng talaan.
