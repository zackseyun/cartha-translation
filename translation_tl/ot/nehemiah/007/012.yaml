lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaangkanan at listahan ng mga bumalik, ang construct plural ng בֵּן ay tumutukoy sa mga kabilang sa angkan o sambahayan ng isang ninuno. Pinananatili ng “mga anak ni” ang Hebreong anyo at likas itong pakinggan sa Filipino.
- source_word: עֵילָם
  choice: Elam
  rationale: Pangalan itong isinalin sa pamamagitan ng transliterasyon. Sa kontekstong ito, tumutukoy ito sa pangalan ng angkan sa talaan ng mga bumalik, hindi pangunahin sa rehiyong heograpikal.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254
  rationale: Ang kabuuan ng Hebreong bilang ay 1,254. Ginamit ang mga digit para sa malinaw at natural na pagbasa sa isang talaan; hindi idinagdag ang “katao” sapagkat wala itong tahasang katumbas sa Hebreo.
