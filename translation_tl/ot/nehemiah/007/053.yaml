  text: the sons of Bakbuk[a], the sons of Hakupha, the sons of Harhur—
translation:
  language: tl
  text: ang mga anak ni Bakbuk[a], ang mga anak ni Hakufa, ang mga anak ni Harhur—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa talaang ito, ang Hebreong “mga anak ni” ay maaari ring mangahulugang mga inapo o mga kabilang sa isang angkan, hindi lamang mga tuwirang anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Pinananatili nito ang paulit-ulit na pormal na hulma ng listahan sa Hebreo. Sa ganitong talaangkanan, maaari rin itong tumukoy sa mga inapo o sa isang pangkat ng angkan, hindi lamang sa mga tuwirang anak.
- source_word: בַקְבּוּק
  choice: Bakbuk
  rationale: Pangalan ito kaya tinumbasan sa pamamagitan ng transliterasyon sa halip na isalin ang posibleng kahulugan nito.
- source_word: חֲקוּפָא
  choice: Hakufa
  rationale: Isinulat ang pangalang Hebreo sa anyong likas basahin sa Filipino; ginamit ang “f” para sa tunog ng titik pe na walang dagesh.
- source_word: חַרְחוּר
  choice: Harhur
  rationale: Pangalan ito na transliterado; hindi tiyak o hindi mahalaga sa konteksto ang posibleng leksikal na kahulugan nito.
