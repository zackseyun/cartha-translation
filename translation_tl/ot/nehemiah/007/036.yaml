lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ng
  rationale: Ang בְּנֵי ay anyong construct plural ng “mga anak.” Sa konteksto ng talaan, maaari itong tumukoy sa mga inapo o mga kabilang sa isang pangkat, ngunit pinananatili ng “mga anak ng” ang anyo ng Hebreo at natural ito sa ganitong rehistro.
- source_word: יְרֵחוֹ
  choice: Jerico
  rationale: Pangalan ng lugar; ginamit ang karaniwang anyong Tagalog na “Jerico.”
- source_word: שְׁלֹשׁ מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: tatlong daan at apatnapu't lima
  rationale: Ang sunod-sunod na mga bilang sa Hebreo ay tuwirang nangangahulugang 345; isinalin ito sa natural at makabagong paraan ng pagsulat ng bilang sa Filipino.
