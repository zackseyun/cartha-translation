base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/055.yaml
  text: the sons of Barkos[a], the sons of Sisera, the sons of Temah.
translation:
  language: tl
  text: ang mga anak ni Barkos, ang mga anak ni Sisera, at ang mga anak ni Temah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tamah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Tuwirang pinananatili ang pormulang Hebreo sa talaan ng mga angkan. Sa kontekstong ito, maaari itong tumukoy sa mga inapo o kasapi ng angkan, ngunit ang “mga anak ni” ang pinakamalapit at likas na pormal na katumbas.
- source_word: בַרְקוֹס
  choice: Barkos
  rationale: Pangngalang pantangi na tinumbasan sa pamamagitan ng transliterasyon ayon sa anyong Hebreo.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Pangngalang pantangi; ginamit ang kinagawiang anyong Filipino na “Sisera.” Dito, pangalan ito ng pinagmulan ng isang angkan sa talaan.
- source_word: תָמַח
  choice: Temah
  rationale: Pangngalang pantangi na transliterado mula sa tekstong Hebreo. Ang “Tamah” ay maaari ring gamiting anyo kaya inilagay sa talababa.
theological_decisions: []
translation_notes:
  register: Maikli at pormal ang pagkakasalin upang mapanatili ang anyo ng talaang pangangkan. Idinagdag ang “at” bago ang huling pangkat para sa likas na daloy sa modernong Filipino nang hindi binabago ang nilalaman.
