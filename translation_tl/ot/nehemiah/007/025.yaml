- source_word: גִבְעוֹן
  choice: Gibeon
  rationale: Pangalan ng lugar; ginamit ang nakaugaliang anyo sa Filipino Bible tradition.
- source_word: תִּשְׁעִים וַחֲמִשָּׁה
