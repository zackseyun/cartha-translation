base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/069.yaml
  text: And some of the heads of the fathers’ houses gave to the work[a]. The governor gave to the treasury one thousand gold darics, fifty basins[c][b], and five hundred thirty-five priests’ tunics.
translation:
  language: tl
  text: At ang ilan sa mga pinuno ng mga angkan ay nagbigay para sa gawain. Ang gobernador[a] ay nagbigay sa kabang-yaman ng 1,000 darik na ginto[b], 50 mangkok, at 535 tunika para sa mga pari.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Tirshata,” isang Persiyanong titulong administratibo.
    reason: lexical_alternative
  - marker: b
    text: Ang darik ay isang gintong barya ng Persia.
    reason: cultural_note
  - marker: c
    text: 'Ganito sa tekstong Hebreo ng Nehemias: “535 tunika para sa mga pari.” Sa katumbas na tala sa Ezra 2:69 ay “100 tunika para sa mga pari.”'
    reason: textual_parallel
lexical_decisions:
- source_word: וּמִקְצָת רָאשֵׁי הָאָבוֹת
  choice: At ang ilan sa mga pinuno ng mga angkan
  rationale: Ipinahahayag ng וּמִקְצָת ang isang bahagi ng pangkat. Ang “mga pinuno ng mga angkan” ay likas na modernong Tagalog para sa postexilic na katawagang רָאשֵׁי הָאָבוֹת nang hindi pilit na ginagaya ang idyomang Hebreo na “mga sambahayan ng mga ama.”
- source_word: לַמְּלָאכָה
  choice: para sa gawain
  rationale: Tumutukoy ang מְלָאכָה sa isinasagawang proyekto; malinaw at natural ang “para sa gawain.”
- source_word: הַתִּרְשָׁתָא
  choice: ang gobernador
  rationale: Isinalin ang Persiyanong titulong administratibo ayon sa tungkulin nito para madaling maunawaan, habang inilalagay sa talababa ang transliterasyon.
- source_word: לָאוֹצָר
  choice: sa kabang-yaman
  rationale: Sa konteksto ng paglalagak ng mahahalagang handog, ang “kabang-yaman” ang angkop na kahulugan ng אוֹצָר.
- source_word: זָהָב דַּרְכְּמֹנִים אֶלֶף
  choice: 1,000 darik na ginto
  rationale: Pinananatili ang tiyak na Persiyanong katawagan sa barya at ang tahasang pagbanggit ng ginto sa Hebreo.
- source_word: מִזְרָקוֹת
  choice: mangkok
  rationale: Tumutukoy ang salita sa mga sisidlang ginagamit sa gawaing panrelihiyon. Hindi hinihingi ng talata ang mas tiyak ngunit maaaring sobrang interpretibong “mangkok na pangwisik.”
- source_word: כָּתְנוֹת כֹּהֲנִים
  choice: tunika para sa mga pari
  rationale: Ang כָּתְנוֹת ay mga kasuotang tulad ng tunika; nililinaw ng “para sa mga pari” ang ugnayan ng dalawang pangngalan.
- source_word: שְׁלֹשִׁים וַחֲמֵשׁ מֵאוֹת
  choice: '530'
  rationale: Ang Hebreo ay literal na “tatlumpu at limang daan,” kaya 530 ang kabuuan. Hindi sinunod ang 535 sa English consultation layer sapagkat hindi iyon tumutugma sa WLC.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “angkan” sa halip na literal na “sambahayan ng mga ama,” at pinanatili ang teknikal na “darik” at “tunika” na may sapat na konteksto. Itinama ayon sa WLC ang bilang na 530 sa halip na 535 sa English consultation layer.
