  yaml_path: translation/ot/nehemiah/007/052.yaml
  text: the sons of Besai[a], the sons of Meunim[c][b], the sons of Nephushesim.
translation:
  language: tl
  text: ang mga anak ni Besai[a], ang mga anak ni Meunim[b], ang mga anak ni Nefushesim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybaying “Bessai.” Nagkakaiba ang mga baybay dahil sa iba't ibang paraan ng transliterasyon at sa paghahambing sa mga kaagapay na tradisyon ng teksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga Meunita” kung ituturing itong katawagan sa isang lahi o pangkat sa halip na pangalan lamang ng angkan.
    reason: lexical_alternative
  - marker: c
    text: Sa ilang tradisyon, “Nefusim.” Mas tuwirang kinakatawan ng “Nefushesim” ang baybay ng Hebreo rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Pinananatili nito ang paulit-ulit na pormula ng talaangkanan sa Hebreo. Sa kontekstong ito, maaari nitong tukuyin ang mga inapo o kasapi ng angkan, ngunit hindi kailangang tahasang lutasin iyon sa pangunahing teksto.
- source_word: בֵסַי
  choice: Besai
  rationale: Pangngalang pantangi ito, kaya tinumbasan sa pamamagitan ng transliterasyon na malapit sa anyong Hebreo.
- source_word: מְעוּנִים
  choice: Meunim
  rationale: Ginamit ang transliterasyon sapagkat ang anyo ay maaaring pangalan ng angkan o katawagan sa isang pangkat; iniiwasan nitong sapilitang piliin ang mas interpretatibong kahulugang etniko.
- source_word: נפושסים
  choice: Nefushesim
  rationale: Ang transliterasyong ito ay tuwirang kumakatawan sa mga katinig ng tekstong Masoretiko habang gumagamit ng likas na baybay-Filipino, kung saan ang פ ay kinakatawan ng f.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na may marangal at payak na himig. Pinanatili ang ritmo ng listahan at ang pormulang “ang mga anak ni,” samantalang ang mga pangalang Hebreo ay binaybay ayon sa karaniwang ponolohiya at ortograpiyang Filipino.
