  rationale: Sa talaang ito ng mga bumalik mula sa pagkabihag, ang בְּנֵי ay nagpapakilala sa isang angkan o pangkat ng mga inapo. Pinananatili ng “mga anak ni” ang karaniwang anyo ng mga talaangkanan sa Bibliya, bagaman hindi nito kailangang tukuyin lamang ang mga tuwirang anak.
- source_word: שְׁפַטְיָה
  choice: Sefatias
  rationale: Isinatinig ang pangalang Hebreo sa anyong natural at nakasanayan sa makabagong saling Tagalog, sa halip na isalin ang kahulugan ng pangalan.
- source_word: שְׁלֹשׁ מֵאוֹת שִׁבְעִים וּשְׁנָיִם
  choice: '372'
  rationale: Tumpak at madaling basahin ang tambilang sa isang maikling talaan ng sensus; katumbas ito ng “tatlong daan at pitumpu't dalawa.”
