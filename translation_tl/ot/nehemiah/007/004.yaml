  text: The city was wide and large[a], but the people within it were few, and no houses had been built.
translation:
  language: tl
  text: Maluwang at malaki ang lungsod[a], ngunit kakaunti ang mga tao rito, at walang mga bahay na naitayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At ang lungsod ay maluwang at malaki, at kakaunti ang mga tao rito, at walang mga bahay na naitayo.” Mas magkakaugnay sa pamamagitan ng “at” ang anyo ng Hebreo; ginawang mas likas sa Filipino ang pangunahing teksto habang pinananatili ang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעִיר
  choice: ang lungsod
  rationale: Ang הָעִיר ay tuwirang nangangahulugang “ang lungsod.” Hindi kailangang ilantad ang וְ bilang “at” sa simula; natural sa Filipino na ihayag ang paglalarawan nang walang panimulang pang-ugnay.
- source_word: רַחֲבַת יָדַיִם
  choice: maluwang
  rationale: Ang idyomang literal na “malapad sa mga kamay/panig” ay tumutukoy sa malawak o maluwang na saklaw. Ang “maluwang” ay likas at malinaw sa modernong Filipino.
- source_word: וּגְדוֹלָה
  choice: at malaki
  rationale: Tumutukoy ang גְדוֹלָה sa pisikal na laki ng lungsod, kaya “malaki” ang payak at wastong katumbas.
- source_word: וְהָעָם מְעַט בְּתוֹכָהּ
  choice: ngunit kakaunti ang mga taong naninirahan dito
  rationale: Ang מְעַט ay nagsasaad ng kakaunting bilang. Ipinahahayag ng “ngunit” ang likas na paghahambing sa malaki at maluwang na lungsod; nililinaw ng “naninirahan dito” ang בְּתוֹכָהּ sa natural na Filipino.
- source_word: וְאֵין בָּתִּים בְּנוּיִם
  choice: at wala pang mga bahay na naitayo
  rationale: Ang אֵין ay nagsasaad ng kawalan, at ang בְּנוּיִם ay passive participle na “nakatayo/naitayo.” Hindi idinagdag ang di-tahasang diwa ng “muling itinayo”; ang “pa” ay angkop sa konteksto at sa kalagayang hindi pa natatapos.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Inuna ang panaguri sa unang sugnay para sa natural na daloy. Pinanatili ang paghahambing sa laki ng lungsod at kakaunting naninirahan, at iniwasan ang “muling itinayo” dahil walang tahasang unlaping katumbas ng “muli” sa Hebreo.
