  text: ang mga anak ni Hanan[a], ang mga anak ni Giddel, ang mga anak ni Gahar—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni” sa bawat pag-uulit ng “mga anak ni”; ang pormulang Hebreo sa talaangkanan ay maaaring tumukoy sa isang angkan o linya ng pamilya, hindi lamang sa tuwirang mga anak na lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Pinananatili nito ang paulit-ulit na pormulang pangtalaan sa Hebreo. Sa kontekstong ito, maaari itong tumukoy hindi lamang sa tuwirang mga anak na lalaki kundi sa mga inapo o pangkat ng angkan.
- source_word: חָנָן
  choice: Hanan
  rationale: Pangalan ng tao o angkan; tinumbasan sa paraang malapit sa anyong Hebreo.
- source_word: גִדֵּל
  choice: Gidel
  rationale: Pangalan sa talaan ng mga nagbalik o mga lingkod sa templo; ang isang l sa Filipino ay sapat upang kumatawan sa katinig na Hebreo, sapagkat hindi ipinakikita ng karaniwang ortograpiyang Filipino ang dobleng katinig.
- source_word: גָחַר
  choice: Gahar
  rationale: Pangalan sa talaan; ang baybay ay tuwirang kumakatawan sa mga katinig at patinig ng Hebreo sa natural na ortograpiyang Filipino.
