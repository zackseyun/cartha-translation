  language: tl
  text: ang mga anak ni Delaias, ang mga anak ni Tobias, at ang mga anak ni Nekoda—642 lahat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa konteksto ng talaangkanan at sensus, ipinakikilala nito ang mga pangkat ng angkan. Pinananatili ng “mga anak ni” ang paulit-ulit na anyo ng Hebreo at likas din ito sa makabagong Tagalog.
- source_word: דְלָיָה
  choice: Delaias
  rationale: Pangalang pantangi; ginamit ang anyong karaniwan at madaling bigkasin sa tradisyong Tagalog sa Bibliya.
- source_word: טוֹבִיָּה
  choice: Tobias
  rationale: Pangalang pantangi; ang “Tobias” ay natural at kilalang anyo sa Tagalog, habang kinakatawan ang Hebreong pangalan.
- source_word: נְקוֹדָא
  choice: Nekoda
  rationale: Pangalang pantangi; tuwirang transliterasyon na malinaw at madaling basahin sa Tagalog.
- source_word: שֵׁשׁ מֵאוֹת וְאַרְבָּעִים וּשְׁנָיִם
  choice: 642 lahat
  rationale: Malinaw na ipinapahayag ang kabuuang bilang sa maikli at natural na paraan; nililinaw ng “lahat” na ito ang suma ng magkakasamang pangkat.
