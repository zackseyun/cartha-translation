  text: 'the sons of Ater[a], of Hezekiah: ninety-eight.'
translation:
  language: tl
  text: 'ang mga anak ni Ater[a], ni Hezekias: siyamnapu''t walo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “ang mga inapo ni Ater, ni Hezekias,” na tumutukoy sa isang partikular na sangay ng angkan ni Ater.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Ang construct plural ng בֵּן ay literal na “mga anak ni,” ngunit sa talaang genealogical o sensus maaari rin itong tumukoy sa mga inapo o kasapi ng isang angkan. Pinananatili ng salin ang pormal na anyo habang nililinaw sa talababa ang mas malawak na diwa.
- source_word: אָטֵר
  choice: Ater
  rationale: Pangalan ng tao o angkan; tinumbasan sa transliterasyong karaniwang ginagamit sa Filipino.
- source_word: לְחִזְקִיָּה
  choice: mula kay Hezekias
  rationale: Ang לְ ay malamang na nagpapakita ng kaugnayan o sangay sa loob ng angkan ni Ater. Ang “mula kay Hezekias” ay natural sa Filipino at nagpapanatili sa posibleng kahulugang genealogical nang hindi tiyakang nilulutas ang estruktura.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: siyamnapu't walo
  rationale: Karaniwang makabagong anyo sa Filipino ng bilang na 98.
