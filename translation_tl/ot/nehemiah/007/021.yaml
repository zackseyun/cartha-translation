  register: Maikli at pormal ang pagkakasulat, gaya ng isang talaan ng sensus. Ginamit ang “mga anak” upang mapanatili ang anyo ng Hebreo, habang ipinapaliwanag sa talababa na maaari itong mangahulugang mga inapo o kasapi ng angkan.
