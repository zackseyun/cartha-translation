lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Tuwirang pinananatili ang paulit-ulit na pormulang Hebreo sa talaangkanan. Sa ganitong listahan, maaari rin itong tumukoy sa mga inapo o kasapi ng isang angkan, hindi lamang sa agarang mga anak na lalaki.
- source_word: לְבָנָה
  choice: Lebana
  rationale: Isinatinig ang pangalang pantangi ayon sa bigkas ng Hebreo, gamit ang likas na anyo sa modernong Filipino at hindi na isinusulat ang di-binibigkas na pangwakas na h ng kombensiyong Ingles.
- source_word: חֲגָבָה
  choice: Hagaba
  rationale: Isinatinig nang tuwiran mula sa Hebreo sa paraang natural sa Filipino; ang ח ay kinakatawan ng H at ang pangwakas na ה ay patinig na a.
- source_word: שַׁלְמָי
  choice: Salmai
  rationale: Ang שׁ ay karaniwang isinasatinig bilang s sa modernong Filipino, at pinananatili ng Salmai ang Masoretikong anyo at hulaping -ai.
