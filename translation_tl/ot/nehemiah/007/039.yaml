  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], nine hundred seventy-three.'
translation:
  language: tl
  text: 'Ang mga pari: ang mga anak[a] ni Jedaias, sa sambahayan ni Jesua[b], 973.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak” sa Hebreo ay maaari ring mangahulugang mga inapo o mga kasapi ng isang angkan, hindi lamang mga tuwirang anak.
    reason: lexical_alternative
  - marker: b
    text: Ang “Jesua” ay maaari ring isaling “Josue,” ngunit mas malapit ang “Jesua” sa anyo ng pangalang Hebreo na ginamit sa panahong ito pagkatapos ng pagkakatapon.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Ang mga pari
  rationale: Tiyak na pangngalang maramihan ito na nagpapakilala sa pangkat ng mga pari sa talaan; hindi kailangang magdagdag ng pandiwa.
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Pinananatili nito ang anyong pangangkanan ng Hebreo, habang nililinaw sa talababa na maaari itong tumukoy sa mga inapo o kasapi ng angkan, hindi lamang sa tuwirang mga anak.
- source_word: יְדַעְיָה
  choice: Jedaias
  rationale: Isinalin sa karaniwang anyong Filipino ang pangalang Hebreo na Yeda‘yah, na kaayon ng nakagawiang pagbabaybay ng mga pangalang biblikal.
- source_word: לְבֵית יֵשׁוּעַ
  choice: mula sa sambahayan ni Jesua
  rationale: Ang בַּיִת na kaugnay ng pangalan ng tao ay tumutukoy sa sambahayan o linya ng angkan; ipinahahayag ng “mula sa” ang pagkakabilang sa pangkat sa natural na Filipino.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Pinananatili ang natatanging anyo ng pangalang post-exilic na Yeshua, sa halip na ipantay agad sa Josue.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: '973'
  rationale: Eksaktong kabuuang bilang ito; ang numerong anyo ay malinaw at angkop sa mahabang talaan ng sensus.
