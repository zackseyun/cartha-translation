  text: the sons of Keros[a], the sons of Sia, the sons of Padon.
translation:
  language: tl
  text: ang mga anak ni Keros[a], ang mga anak ni Sia, ang mga anak ni Padon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni” sa bawat paglitaw ng “mga anak ni”; ang pormulang Hebreo sa talaangkanan ay maaaring tumukoy sa mas malawak na angkan, hindi lamang sa mismong mga anak na lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaangkanan at listahang ito, ang construct plural ng בֵּן ay maaaring tumukoy sa mga inapo o kasapi ng angkan. Pinananatili ng “mga anak ni” ang pormal na hulma ng Hebreo at likas din ito sa ganitong uri ng listahan sa Tagalog.
- source_word: קֵירֹס
  choice: Keros
  rationale: Pangalan itong isinalin sa pamamagitan ng transliterasyon; ang “Keros” ay malinaw at tuwirang anyong Tagalog batay sa Hebreo.
- source_word: סִיעָא
  choice: Sia
  rationale: Pangalan itong isinalin sa pamamagitan ng transliterasyon; ang “Sia” ay payak at madaling basahing anyo ng pangalang Hebreo.
- source_word: פָדוֹן
  choice: Padon
  rationale: Pangalan itong isinalin sa pamamagitan ng transliterasyon; tuwirang ipinapakita ng “Padon” ang mga katinig at patinig ng Hebreo.
