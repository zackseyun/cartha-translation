  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Ang construct plural ng בֵּן ay karaniwang tumutukoy sa mga kabilang sa angkan o sambahayan sa mga talaan ng lipi at sensus. Pinananatili ng “mga anak ni” ang pormal na anyo ng Hebreo at likas itong nauunawaan sa ganitong listahan.
- source_word: אִמֵּר
  choice: Immer
  rationale: Pangalang pantangi ito, kaya tinumbasan sa pamamagitan ng transliterasyong angkop sa Filipino.
- source_word: אֶלֶף חֲמִשִּׁים וּשְׁנָיִם
  choice: 1,052
  rationale: Eksaktong bilang itong literal na ‘isang libo, limampu, at dalawa.’ Ang paggamit ng numerals ay malinaw at natural sa isang talaan ng sensus.
theological_decisions: []
translation_notes:
  register: Maikli, pormal, at malinaw na modernong Filipino, na angkop sa estilong talaan. Pinanatili ang tradisyonal na katawagang “mga anak ni” nang hindi ipinapakahulugang pawang tuwirang anak ang lahat ng nakabilang.
