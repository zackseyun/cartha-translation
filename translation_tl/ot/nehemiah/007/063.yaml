base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/063.yaml
  text: 'And from the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: tl
  text: 'At mula sa mga pari: ang mga anak ni Hobaias, ang mga anak ni Hakkoz, at ang mga anak ni Barzilai, na kumuha bilang asawa ng isa sa mga anak na babae ni Barzilai na taga-Gilead at pinangalanan ayon sa kanilang pangalan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַכֹּהֲנִים
  choice: At mula sa mga pari
  rationale: Pinananatili ang partitive na diwa ng מִן at ipinakikilalang ang sumusunod ay mga angkan mula sa pangkat ng mga pari.
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Ang literal at pormal na anyo ay angkop sa talaangkanan; sa kontekstong ito maaari rin itong tumukoy sa mga inapo o angkan.
- source_word: חֳבַיָּה
  choice: Hobaias
  rationale: Transliterasyong Tagalog na kumakatawan sa Hebreong pangalang חֳבַיָּה.
- source_word: הַקּוֹץ
  choice: Hakkoz
  rationale: Pinananatili ang nakasanayang anyo ng pangalang angkan, kasama ang artikulong nakapaloob sa pangalan.
- source_word: בַרְזִלַּי
  choice: Barzilai
  rationale: Pare-parehong transliterasyon para sa pangalan ng angkan at sa Gileaditang pinagmulan nito.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: siya na kumuha bilang asawa ng isa sa mga anak na babae ni
  rationale: Likas sa modernong Tagalog at malinaw na ipinahahayag ang pag-aasawa sa isang babae mula sa pamilyang binanggit.
- source_word: הַגִּלְעָדִי
  choice: na Gileadita
  rationale: Maikling katawagang naglalarawan sa pinagmulan ni Barzilai sa Gilead.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: at tinawag ayon sa kanilang pangalan
  rationale: Pinananatili ang pasibong diwa ng Niphal at ang bahagyang pormal na Hebreong pahayag nang hindi ipinapalagay kung ang tinutukoy ay simpleng pagtawag o pormal na pagkuha ng pangalan.
