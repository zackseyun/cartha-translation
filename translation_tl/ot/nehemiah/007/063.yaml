translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw, habang pinananatili ang paulit-ulit na estruktura ng talaan at ang tunay na kalabuan ng panghalip na maramihan sa hulihan. Walang footnote dahil ang ibinigay na English footnote ay tila pinagsama ang buong kasunod na sugnay sa alternatibo para sa pangalang Hobaias; hindi ito sinunod sapagkat hindi iyon sinusuportahan ng pagkakahati ng Hebreong teksto.
