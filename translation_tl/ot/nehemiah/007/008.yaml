lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang construct plural ng בֵּן ay tumutukoy rito sa isang angkan o sambahayan sa talaan. Pinananatili ng “mga anak ni” ang kongkretong anyo ng Hebreo, habang nililinaw sa talababa na maaari itong mangahulugang mga inapo.
- source_word: פַרְעֹשׁ
  choice: Paros
  rationale: Pangngalang pantangi na isinalin sa karaniwang anyong Tagalog na “Paros,” sa halip na bigyan ng kahulugang leksikal.
- source_word: אַלְפַּיִם מֵאָה וְשִׁבְעִים וּשְׁנָיִם
  choice: 2,172
  rationale: Ang pagkakasunod-sunod ng mga bilang sa Hebreo ay may kabuuang 2,172. Ginamit ang mga digit para madaling basahin sa isang talaang pansenso.
