base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/045.yaml
  text: 'The gatekeepers: the sons of Shallum[a], the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, 138.'
translation:
  language: tl
  text: 'Ang mga bantay ng pintuan: ang mga anak ni Shallum[a], ang mga anak ni Ater, ang mga anak ni Talmon, ang mga anak ni Akkub, ang mga anak ni Hatita, at ang mga anak ni Shobai—138.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “mga anak ni” ay maaari ring tumukoy sa mga inapo o sa isang angkan, hindi lamang sa tuwirang mga anak na lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: Ang mga bantay ng pintuan
  rationale: Tumutukoy ito sa mga taong inatasang magbantay at mangasiwa sa mga pintuan, lalo na sa konteksto ng paglilingkod sa templo. Likas at malinaw ito sa modernong Tagalog.
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Pinananatili nito ang pormal at paulit-ulit na ayos ng talaang Hebreo, habang nililinaw sa talababa na maaari itong tumukoy sa mas malawak na angkan at hindi lamang sa tuwirang mga anak na lalaki.
- source_word: שַׁלּוּם
  choice: Shallum
  rationale: Isinalin sa titik bilang pangalang pantangi, na pinananatili ang karaniwang anyong biblikal.
- source_word: אָטֵר
  choice: Ater
  rationale: Isinalin sa titik bilang pangalang pantangi.
- source_word: טַלְמֹן
  choice: Talmon
  rationale: Isinalin sa titik bilang pangalang pantangi.
- source_word: עַקּוּב
  choice: Akkub
  rationale: Pinili ang nakagawiang anyong biblikal na malapit sa tunog ng Hebreo.
- source_word: חֲטִיטָא
  choice: Hatita
  rationale: Isinalin sa titik ayon sa nakagawiang maikling anyo ng pangalan.
- source_word: שֹׁבָי
  choice: Shobai
  rationale: Isinalin sa titik upang katawanin ang hulihang tunog-patinig ng pangalang Hebreo.
- source_word: מֵאָה שְׁלֹשִׁים וּשְׁמֹנָה
  choice: '138'
  rationale: Ang bilang sa Hebreo ay isang daan at tatlumpu't walo; ang numerong 138 ay malinaw at natural sa isang talaan ng sensus.
