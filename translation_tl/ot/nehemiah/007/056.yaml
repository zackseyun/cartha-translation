  footnotes:
  - marker: a
    text: O “mga inapo ni Nezias … mga inapo ni Hatifa.” Sa mga talaangkanan, ang Hebreong idyomang “mga anak ni” ay madalas tumukoy sa isang linya ng lahi o angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Literal itong tumutugma sa pormula ng Hebreo at pinananatili ang maikli at paulit-ulit na anyo ng talaan. Sa ganitong talaangkanan, maaari rin itong tumukoy sa mga inapo o kaanak ng isang angkan.
- source_word: נְצִיחַ
  choice: Nezias
  rationale: Pangngalang pantangi ito kaya tinumbasan sa anyong transliterado na angkop sa makabagong Filipino; ginamit ang “s” upang katawanin ang tunog ng Hebreong tsade.
- source_word: חֲטִיפָא
  choice: Hatifa
  rationale: Pangngalang pantangi ito kaya tinumbasan sa anyong transliterado; ang “f” ay natural na kumakatawan sa spirantisadong pe ng Hebreo.
