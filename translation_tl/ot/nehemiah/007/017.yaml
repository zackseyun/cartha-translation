  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Ang בְּנֵי ay construct plural ng “mga anak na lalaki,” ngunit sa konteksto ng talaangkanan at sensus maaari itong tumukoy sa mga inapo o angkan. Pinananatili ng “mga anak ni” ang pormal na anyo at likas itong maunawaan sa Filipino bilang pangkat na nagmula kay Azgad.
- source_word: עַזְגָּד
  choice: Azgad
  rationale: Pangalan ng tao o angkan; tinumbasan sa pamamagitan ng karaniwang transliterasyong “Azgad.”
- source_word: אַלְפַּיִם שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: 2,322
  rationale: Ang pagkakasunod-sunod ng bilang sa Hebreo ay dalawang libo, tatlong daan, dalawampu at dalawa. Ginamit ang numerong 2,322 upang malinaw at maikli itong maipahayag bilang kabuuang bilang sa sensus.
