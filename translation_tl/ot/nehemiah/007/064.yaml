base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/064.yaml
  text: These sought their record among those enrolled by genealogy[a], but it was not found[b], so they were excluded from the priesthood.
translation:
  language: tl
  text: Hinanap ng mga ito ang kanilang kasulatan sa talaan ng mga nakatala ayon sa talaangkanan[a], ngunit hindi ito natagpuan. Kaya hindi sila itinuring na kabilang sa pagkapari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang kanilang talaang talaangkanan.” Tumutukoy ang Hebreo sa isang nakasulat na dokumentong nagpapatunay ng angkan.
    reason: lexical_alternative
  - marker: b
    text: O, “itinuring silang marumi at ibinukod mula sa pagkapari.” Ang pandiwang Hebreo ay maaaring magpahiwatig ng pagdungis o pag-aalis sa katayuang pangpari dahil hindi mapatunayan ang kanilang angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ang mga ito
  rationale: Pangmaramihang pantukoy ito sa grupong kababanggit lamang; hindi na nagdaragdag ng pangngalang wala sa Hebreo.
- source_word: בִּקְשׁוּ
  choice: hinanap
  rationale: Likas at tuwirang katumbas ng pandiwang nangangahulugang humanap o magsikap na matagpuan.
- source_word: כְתָבָם
  choice: ang kanilang kasulatan
  rationale: Ang כְּתָב ay isang nakasulat na dokumento o rekord. Pinananatili ng “kasulatan” ang konkretong diwa ng katibayang nakasulat nang hindi ipinapalagay ang eksaktong anyo nito.
- source_word: הַמִּתְיַחְשִׂים
  choice: sa talaan ng mga angkan
  rationale: Sa kontekstong administratibo, tumutukoy ito sa pagtatala o pagpapatunay ng pinagmulang angkan. Natural sa Filipino ang “talaan ng mga angkan,” habang ipinapaliwanag sa talababa ang posibleng ugnayan nito sa mismong dokumento.
- source_word: וְלֹא נִמְצָא
  choice: ngunit hindi ito natagpuan
  rationale: Isahan ang pandiwa sa Hebreo, kaya ang kasulatan o rekord ang natural na simuno, hindi ang mga tao.
- source_word: וַיְגֹאֲלוּ
  choice: inalis sila
  rationale: Sa konteksto, ang pandiwa ay nagpapahiwatig na itinuring silang hindi maaaring tanggapin sa tungkuling pari. Ang “inalis” ay malinaw na naghahayag ng praktikal na bunga, samantalang pinananatili sa talababa ang mas literal na larawang may kaugnayan sa pagiging marumi o nadungisan.
- source_word: מִן הַכְּהֻנָּה
  choice: sa pagkapari
  rationale: Tuwirang ipinahahayag nito ang institusyon o katayuan ng pagiging pari.
theological_decisions:
- issue: Kung ang וַיְגֹאֲלוּ ay isasaling ritwal na “nadungisan” o praktikal na “inalis”
  choice: inalis sila sa pagkapari
  alternative: itinuring silang marumi para sa pagkapari
  rationale: Ang konteksto ay ang kawalan ng mapatunayang angkan at ang ibinungang hindi pagtanggap sa katayuang pari. Iniiwasan ng pangunahing salin ang impresyong nakagawa sila ng isang tiyak na ritwal na karumihan, ngunit inilalahad ng talababa ang mas literal na pahiwatig ng Hebreo.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal ang himig. Ginamit ang “kasulatan” at “pagkapari” upang mapanatili ang pormal at administratibong katangian ng talata, habang ang mga talababa ay nag-iingat sa leksikal na ambiguwidad ng tekstong Hebreo.
