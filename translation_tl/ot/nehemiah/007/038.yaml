  choice: mga anak ni
  rationale: Sa talaang ito, ang בְּנֵי ay tumutukoy sa mga kabilang sa isang angkan o sambahayan. Pinananatili ng “mga anak ni” ang pormal na larawan ng Hebreo at likas din itong mababasa nang pangkatan sa Filipino.
- source_word: סְנָאָה
  choice: Senaa
  rationale: Pangngalang pantangi ito, kaya tinumbasan sa pamamagitan ng transliterasyon. Ang “Senaa” ay malinaw at likas basahin sa modernong Filipino.
- source_word: שְׁלֹשֶׁת אֲלָפִים תְּשַׁע מֵאוֹת וּשְׁלֹשִׁים
