id: NEH.7.61
reference: Nehemiah 7:61
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה הָֽ/עוֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדּ֖וֹן וְ/אִמֵּ֑ר וְ/לֹ֣א יָכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/061.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addon, and Immer, but they were not able to declare their fathers’ houses or their offspring[c][b], whether they were from Israel.
translation:
  language: tl
  text: At ito ang mga umahon mula sa Tel-melah, Tel-harsha, Kerub, Addon[a], at Immer, ngunit hindi nila matukoy ang sambahayan ng kanilang mga ninuno[b] at ang kanilang lahi, kung sila ay mula sa Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Addan” ang mababasa sa Ezra 2:59, sa halip na “Addon” na narito sa Nehemias.
    reason: textual_variant
  - marker: b
    text: Sa literal, “sambahayan ng kanilang mga ama,” isang Hebreong idyoma para sa sambahayan o angkan ng mga ninuno.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “kung sila ay mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה הָעוֹלִים
  choice: Ito ang mga umahon
  rationale: Pinananatili ng “umahon” ang karaniwang larawan ng Hebreong עלה para sa pagpunta o pagbabalik sa lupain, habang nananatiling natural sa Filipino.
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדּוֹן וְאִמֵּר
  choice: mula sa Tel-melah, Tel-harsha, Kerub, Addon, at Immer
  rationale: Isinalin sa baybay-Filipino ang Kerub ngunit itinumbas sa transliterasyon ang iba pang pangalang pantangi; “Addon” ang sinusunod ayon sa tekstong Hebreo ng Nehemias.
- source_word: לְהַגִּיד
  choice: masabi
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam o sabihin. Ang “masabi” ay malinaw at hindi nagdaragdag ng legal na diwang tahasang “mapatunayan.”
- source_word: בֵּית אֲבוֹתָם
  choice: sambahayan ng kanilang mga ninuno
  rationale: Inihahatid nito ang Hebreong idyoma ng sambahayan o angkan batay sa mga ama nang hindi gumagamit ng di-likas na literalismong Filipino.
- source_word: וְזַרְעָם
  choice: at ang kanilang lahi
  rationale: Sa kontekstong talaangkanan, ang זֶרַע ay tumutukoy sa lahi o salinlahi; mas natural dito ang “lahi” kaysa literal na “binhi.”
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: kung sila ay mula sa Israel
  rationale: Pinananatili nito ang anyo at kalabuan ng Hebreo tungkol sa kanilang pinagmulang Israelita, sa halip na gawing mas tahasang pahayag tungkol sa nasyonalidad.
theological_decisions:
- issue: Kung ang parirala ay tumutukoy sa bansang pinagmulan o sa lahing Israelita
  choice: kung sila ay mula sa Israel
  alternative: kung sila ay mga Israelita
  rationale: Ang pangunahing salin ay nananatiling malapit sa מִיִּשְׂרָאֵל at hindi nilulutas nang higit sa teksto kung ang diin ay heograpiko, pambansa, o talaangkanan.
translation_notes:
  register: Makabago at marangal na Filipino, na gumagamit ng payak na “masabi” at “lahi” para madaling maunawaan. Pinanatili ang “umahon” bilang mahalagang larawan ng tekstong Hebreo at iniwasan ang mas interpretibong “mapatunayan.”
