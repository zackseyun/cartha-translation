  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וָ/אֲצַוֶּ֞ה אֶת חֲנָ֣נִי אָחִ֗/י וְ/אֶת חֲנַנְיָ֛ה שַׂ֥ר הַ/בִּירָ֖ה עַל יְרוּשָׁלִָ֑ם כִּי הוּא֙ כְּ/אִ֣ישׁ אֱמֶ֔ת וְ/יָרֵ֥א אֶת הָ/אֱלֹהִ֖ים מֵ/רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/002.yaml
  text: Then I appointed my brother Hanani and Hananiah[a], the commander of the fortress, over Jerusalem[b], because he was a faithful man and feared God more than many.
translation:
  language: tl
  text: Pagkatapos, itinalaga ko ang kapatid kong si Hanani at si Hananias, ang pinuno ng kuta, upang mamahala sa Jerusalem, sapagkat siya[b] ay isang taong tapat[a] at may takot sa Diyos nang higit kaysa sa marami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang taong may katotohanan” o “isang taong mapagkakatiwalaan.”
    reason: lexical_alternative
  - marker: b
    text: Ang isahang “siya” ay pinakamalikas na tumutukoy kay Hananias, bagaman nauunawaan ng ilan na ang papuri ay mas pangkalahatang sumusuporta sa pagtatalaga sa dalawang lalaki.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: itinalaga ko ... upang mamahala
  rationale: Bagaman karaniwang nangangahulugang “nag-utos” ang צוה, ang tuwirang layon at ang kasunod na עַל יְרוּשָׁלָ͏ִם ay nagpapahiwatig dito ng opisyal na pagtatalaga at pagbibigay ng pananagutan.
- source_word: חֲנָנִי אָחִי
  choice: ang kapatid kong si Hanani
  rationale: Likas na ayos sa modernong Tagalog at malinaw na ipinakikitang kapatid ni Nehemias si Hanani.
- source_word: חֲנַנְיָה
  choice: Hananias
  rationale: Ginamit ang nakasanayang anyong Tagalog ng pangalang Hebreo.
- source_word: שַׂר הַבִּירָה
  choice: ang pinuno ng kuta
  rationale: Ang שַׂר ay pinuno o opisyal, at ang בִּירָה ay isang pinatibay na kuta o kompleks. Ang “pinuno ng kuta” ay malinaw at hindi labis na tumutukoy sa eksaktong uri ng tungkuling militar o sibil.
- source_word: עַל יְרוּשָׁלַ͏ִם
  choice: upang mamahala sa Jerusalem
  rationale: Sa konteksto ng pagtatalaga, ipinahihiwatig ng עַל ang awtoridad at pananagutan sa lungsod.
- source_word: כִּי הוּא
  choice: sapagkat siya
  rationale: Ipinakikilala ng כִּי ang dahilan ng pagtatalaga. Pinanatili ang isahang panghalip ng Hebreo at hindi ito ginawang maramihan.
- source_word: כְּאִישׁ אֱמֶת
  choice: isang taong tapat
  rationale: Maaaring tumukoy ang אֱמֶת sa katotohanan, pagiging maaasahan, o katapatan. Sa paglalarawan ng nararapat pagkatiwalaan sa tungkulin, natural ang “taong tapat,” habang inilalahad sa talababa ang iba pang posibleng diwa.
- source_word: וְיָרֵא אֶת־הָאֱלֹהִים
  choice: at may takot sa Diyos
  rationale: Pinananatili nito ang biblikal na diwa ng mapitagang pagkatakot sa Diyos sa natural na Tagalog.
- source_word: מֵרַבִּים
  choice: nang higit kaysa sa marami
  rationale: Tuwirang pinananatili ang paghahambing sa “marami” at hindi ito pinahihigpit tungo sa “karamihan.”
theological_decisions:
- issue: Ang tinutukoy ng isahang panghalip sa sugnay ng papuri
  choice: Pinanatili ang isahang “siya,” na pinakamalikas na tumutukoy kay Hananias bilang pinakamalapit na naunang pangngalang isahan.
  alternative: Maaaring unawain na ang papuri ay sumusuporta sa magkatuwang na pagtatalaga kina Hanani at Hananias sa mas pangkalahatang paraan.
  rationale: Isahan ang panghalip at mga panaguri sa Hebreo. Hindi ito ginawang “sila,” upang mapanatili ang anyo at tunay na tensiyon ng pinagmulan nang hindi isinasara ang mas malawak na konteksto ng pagtatalaga.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kuta” sa halip na mas teknikal na “citadel,” at pinanatili ang biblikal ngunit natural na pariralang “may takot sa Diyos.”
