translation:
  language: tl
  text: 'Ang mga mang-aawit: ang mga anak ni Asaf[a], 148.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Asaf.” Ang Hebreong “mga anak ni” ay maaaring tumukoy sa isang angkan o sa mga kasapi ng isang pangkat, hindi lamang sa mga tuwirang anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: ang mga mang-aawit
  rationale: Ang anyong participle mula sa שׁיר ay tumutukoy sa mga taong umaawit. Ang “mga mang-aawit” ay natural at tiyak sa modernong Filipino, lalo na sa talaang ito.
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Pinananatili nito ang pormal na pananalitang pangangkanan ng Hebreo, habang nililinaw sa talababa na maaari rin itong tumukoy sa mga inapo o kasapi ng pangkat.
- source_word: אָסָף
  choice: Asaf
  rationale: Isinalin sa karaniwang anyong transliterado sa Filipino ang pangalang pantangi.
- source_word: מֵאָה אַרְבָּעִים וּשְׁמֹנָה
  choice: '148'
  rationale: Tuwiran at malinaw na ipinapahayag ng numerong Filipino ang kabuuan sa talaan.
