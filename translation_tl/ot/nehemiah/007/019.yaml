lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa konteksto ng talaangkanan at listahan, tumutukoy ang construct plural ng בֵּן sa mga kabilang sa angkan o sambahayan ni Bigvai. Pinananatili ng “mga anak ni” ang pormal na anyo ng Hebreo at likas din itong maunawaan sa Filipino.
- source_word: בִגְוָי
  choice: Bigvai
  rationale: Pangngalang pantangi ng tao o angkan; tinumbasan ito sa pamamagitan ng transliterasyon.
- source_word: אַלְפַּיִם שִׁשִּׁים וְשִׁבְעָה
  choice: 2,067
  rationale: Ang literal na bilang ay “dalawang libo, animnapu, at pito.” Ginamit ang mga numero para sa malinaw at madaling basahing anyo sa mahabang listahan, habang eksaktong pinananatili ang bilang.
