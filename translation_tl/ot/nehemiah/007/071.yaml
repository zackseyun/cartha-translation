  - severity: low
    issue: Medyo hindi likas ang pariralang “gintong salaping Persiano” sa talababa.
    rationale: Ang “baryang ginto ng Persia” ay mas karaniwang modernong Filipino at pinananatili ang impormasyong pangkasaysayan.
