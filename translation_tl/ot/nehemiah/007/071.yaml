  source_fidelity: Tumpak ang mga halaga, yunit, at mga tunika ng mga pari. Gayunman, ang “iba pang mga tao” ay maaaring mangahulugang ibang mga tao, samantalang שְׁאֵרִית הָעָם ay tumutukoy sa natitirang bahagi ng mamamayan na naiiba sa mga naunang pangkat ng nagbigay.
  naturalness: Malinaw at likas ang pangungusap. Mas tiyak at natural sa kontekstong talaan ang “natitirang mamamayan” kaysa “iba pang mga tao.”
  terminology: Ang “darikong ginto,” “mina ng pilak,” at “tunika ng mga pari” ay angkop. Mas likas ang “baryang ginto ng Persia” sa talababa kaysa “gintong salaping Persiano.”
