base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/071.yaml
  text: And what the rest of the people gave was twenty thousand gold darics[a], two thousand minas of silver[c][b], and sixty-seven priests’ tunics.
translation:
  language: tl
  text: Ang ibinigay naman ng natitirang mamamayan ay dalawampung libong darikong ginto[a], dalawang libong mina ng pilak[b], at animnapu't pitong tunika ng mga pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang dariko ay isang baryang ginto ng Persia.
    reason: cultural_note
  - marker: b
    text: Ang mina ay isang sinaunang yunit ng timbang at, kaugnay nito, ng halagang salapi.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲשֶׁר נָתְנוּ
  choice: Ang ibinigay naman
  rationale: Likas na panimulang Filipino para sa resumptive relative construction; pinananatili ang diwa ng ‘at tungkol sa ibinigay’ nang hindi nagiging mabigat.
- source_word: שְׁאֵרִית הָעָם
  choice: ng iba pang mga tao
  rationale: Sa konteksto ng talaan ng mga nag-ambag, tumutukoy ito sa natitirang bahagi ng sambayanan, hindi kinakailangang sa teolohikal na ‘nalabi.’
- source_word: זָהָב דַּרְכְּמוֹנִים שְׁתֵּי רִבּוֹא
  choice: dalawampung libong darikong ginto
  rationale: Pinananatili ang tiyak na makasaysayang pangalan ng salaping Persiano at isinasalin ang Hebreong bilang sa karaniwang anyong Filipino.
- source_word: וְכֶסֶף מָנִים אַלְפָּיִם
  choice: dalawang libong mina ng pilak
  rationale: Pinananatili ang sinaunang yunit na mina sa halip na magbigay ng di-tiyak na modernong katumbas.
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: tunika ng mga pari
  rationale: Ang כָּתְנֹת ay mga tunika o mahabang panloob na kasuotan; malinaw ang ugnayang genitibo nang hindi dinaragdagan ang liturhikong kahulugan.
- source_word: שִׁשִּׁים וְשִׁבְעָה
  choice: animnapu't pito
  rationale: Karaniwang modernong Filipino para sa bilang na 67.
theological_decisions:
- issue: Kahulugan ng שְׁאֵרִית sa talaan ng mga handog
  choice: iba pang mga tao
  alternative: nalabi sa bayan
  rationale: Ang agarang konteksto ay administratibong paghahati ng mga pangkat ng nagbigay; hindi nito hinihingi ang teolohikal na diwa ng isang tapat na ‘nalabi.’
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘tunika’ bilang maikli at tumpak na katawagan sa kasuotan; pinanatili ang ‘dariko’ at ‘mina’ para sa makasaysayang katiyakan, na may maiikling talababa.
