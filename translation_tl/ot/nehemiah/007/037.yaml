  text: the sons of Lod[a], Hadid, and Ono, seven hundred twenty-one.
translation:
  language: tl
  text: ang mga anak ng Lod[a], Hadid, at Ono—pitong daan at dalawampu't isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ng Lod, Hadid, at Ono.” Sa mga talaang pangangkanan, ang “mga anak ng” ay maaari ring tumukoy sa mas malawak na angkan o pangkat ng mga taong kaugnay ng mga lugar na ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ng
  rationale: Pinananatili nito ang pormal na anyong pangangkanan ng Hebreo, habang ipinapaliwanag sa talababa na maaari itong tumukoy nang mas malawak sa mga inapo o pangkat na kaugnay ng mga bayang ito.
- source_word: לֹד
  choice: Lod
  rationale: Pangalan ito ng lugar; ang transliterasyong “Lod” ay tuwirang sumusunod sa anyong Hebreo.
- source_word: חָדִיד
  choice: Hadid
  rationale: Pangalan ng lugar na isinalin sa pamamagitan ng tuwirang transliterasyon mula sa Hebreo.
- source_word: וְאוֹנוֹ
  choice: at Ono
  rationale: Isinalin ang pangatnig na וְ bilang “at” at pinanatili ang pangalan ng lugar bilang “Ono.”
- source_word: שְׁבַע מֵאוֹת וְעֶשְׂרִים וְאֶחָד
  choice: pitong daan at dalawampu't isa
  rationale: Natural at malinaw na pagsulat sa mga salita ng bilang na 721, angkop sa estilo ng talaan.
