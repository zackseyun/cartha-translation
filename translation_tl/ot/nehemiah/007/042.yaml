lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Ang construct plural ng בֵּן ay karaniwang tumutukoy sa mga kabilang sa angkan o sambahayan sa mga talaan ng angkan at sensus. Pinananatili ng “mga anak ni” ang anyong Hebreo at likas itong basahin sa Filipino.
- source_word: חָרִם
  choice: Harim
  rationale: Pangalan ng tao o angkan; isinasatitik ito bilang “Harim” sa halip na isalin ang posibleng kahulugan ng pangalan.
- source_word: אֶלֶף שִׁבְעָה עָשָׂר
  choice: 1,017
  rationale: Ang pariralang Hebreo ay nangangahulugang isang libo at labimpito. Ginamit ang numerong “1,017” para sa malinaw at madaling basahing anyo ng talaan ng sensus.
