lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaang ito ng mga bumalik mula sa pagkakatapon, ipinakikilala ng בְּנֵי ang isang pangkat na nakaugnay sa ninunong pinangalanan. Pinananatili ng “mga anak ni” ang pormal na pananalitang pangangkanan ng Hebreo at likas din ito sa Filipino, bagaman maaari nitong saklawin dito ang mas malalayong inapo.
- source_word: זַתּוּא
  choice: Zatu
  rationale: Isinatinig ang pangalang Hebreo sa baybay na madaling basahin sa Filipino; ang dobleng katinig ng karaniwang anyong Ingles na “Zattu” ay hindi kailangan upang katawanin ang bigkas sa modernong Tagalog.
- source_word: שְׁמֹנֶה מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: walong daan at apatnapu't lima
  rationale: Tumpak na inilalahad ang bilang na 845 sa karaniwan at natural na anyong Filipino.
