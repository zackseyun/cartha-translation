  rationale: Tuwirang pinananatili ang anyong genealogical ng Hebreo. Sa talaang ito, maaari itong tumukoy sa mga inapo o mga kabilang sa angkan ni Hashum, ngunit natural at pormal sa Filipino ang “mga anak ni.”
- source_word: חָשֻׁם
