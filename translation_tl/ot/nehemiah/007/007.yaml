id: NEH.7.7
reference: Nehemiah 7:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הַ/בָּאִ֣ים עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְחֶמְיָ֡ה עֲ֠זַרְיָה רַֽעַמְיָ֨ה נַחֲמָ֜נִי מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפֶּ֥רֶת בִּגְוַ֖י נְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/007.yaml
  text: 'those who came with Zerubbabel were Jeshua[a], Nehemiah, Azariah, Raamiah, Nahamani, Mordecai, Bilshan, Mispereth, Bigvai, Nehum, and Baanah[c][b]. The number of the men of the people of Israel:'
translation:
  language: tl
  text: Ang mga dumating na kasama ni Zerubabel ay sina Jesua, Nehemias, Azarias, Raamias[a], Nahamani, Mardokeo, Bilsan, Misperet, Bigvai, Nehum[b], at Baana. Ang bilang ng mga lalaki ng bayang Israel ay ang sumusunod:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katulad na talaan sa Ezra 2:2, Reelaias ang anyo ng pangalang ito.
    reason: alternative_reading
  - marker: b
    text: Sa katulad na talaan sa Ezra 2:2, Rehum ang anyo ng pangalang ito.
    reason: alternative_reading
  - marker: c
    text: Ipinakikilala ng pariralang ito ang talaan ng bilang na nagpapatuloy sa susunod na talata.
    reason: cross_reference
lexical_decisions:
- source_word: הַבָּאִים עִם
  choice: ang mga dumating na kasama ni
  rationale: Ang may artikulong participle ay tumutukoy sa isang tiyak na pangkat, at natural sa Tagalog ang pariralang “ang mga dumating.” Ang עִם ay tuwirang ipinahayag bilang pagsama.
- source_word: זְרֻבָּבֶל
  choice: Zerubabel
  rationale: Ginamit ang nakikilalang anyong Filipino ng pangalan habang malapit sa Hebreong anyo.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Pinanatili ang postexilic na anyo ng pangalang Yeshua bilang Jesua, sa halip na awtomatikong gawing Josue.
- source_word: רַעַמְיָה
  choice: Raamias
  rationale: Sinusunod ng pangunahing teksto ang anyo sa WLC ng Nehemias; ang naiibang anyo sa Ezra 2:2 ay inilagay sa talababa.
- source_word: נַחֲמָנִי
  choice: Nahamani
  rationale: Malapit na transliterasyon ng personal na pangalan ayon sa Masoretic vocalization.
- source_word: מָרְדֳּכַי
  choice: Mardokeo
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan; hindi ipinapalagay na siya rin ang tauhan sa aklat ni Ester.
- source_word: מִסְפֶּרֶת
  choice: Misperet
  rationale: Tapat na transliterasyon ng pangngalang pantangi, na may likas na representasyon ng hulíng katinig sa Filipino.
- source_word: אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: mga lalaki ng bayang Israel
  rationale: Pinanatili ang tahasang panlalaking אַנְשֵׁי at ang kaugnayan nito sa “bayang Israel,” nang hindi ito ginagawang mas malawak o mas makitid kaysa sa Hebreo.
theological_decisions:
- issue: Kasariang tahasang ipinahahayag sa wikang ginagamit sa sensus
  choice: mga lalaki ng bayang Israel
  alternative: mga mamamayan ng Israel
  rationale: Tahasan ang panlalaking pangngalan sa Hebreo. Pinananatili ito bilang usaping leksikal at hindi ginagawang doktrinal na pahayag tungkol sa sinumang hindi kabilang sa talaan.
- issue: Magkakaibang anyo ng mga pangalan sa katulad na talaan sa Ezra 2:2
  choice: Sinunod sa pangunahing teksto ang Raamias at Nehum ng Nehemias 7:7
  alternative: Reelaias at Rehum
  rationale: Hindi pinag-isa ang dalawang tala. Ang teksto ng Nehemias ang sinusunod, habang itinatala sa mga talababa ang mahahalagang pagkakaiba sa kaparis na talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa likas na paglalahad ng sunod-sunod na pangalan. Ang hulíng sugnay ay ginawang kumpletong panimulang pangungusap sa Filipino, ngunit pinanatili ang tungkulin nitong magbukas sa kasunod na mga bilang. Inilipat ang marker [a] sa Raamias dahil iyon ang pangalang tinutukoy ng talababa, sa halip na sa Jesua.
