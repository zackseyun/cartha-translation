  text: ו/יאמר לָ/הֶ֗ם לֹ֣א יִפָּֽתְח֞וּ שַׁעֲרֵ֤י יְרוּשָׁלִַ֨ם֙ עַד חֹ֣ם הַ/שֶּׁ֔מֶשׁ וְ/עַ֨ד הֵ֥ם עֹמְדִ֛ים יָגִ֥יפוּ הַ/דְּלָת֖וֹת וֶ/אֱחֹ֑זוּ וְ/הַעֲמֵ֗יד מִשְׁמְרוֹת֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם אִ֚ישׁ בְּ/מִשְׁמָר֔/וֹ וְ/אִ֖ישׁ נֶ֥גֶד בֵּיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/003.yaml
  text: And I said to them[a], “The gates of Jerusalem must not be opened until the sun is hot. While they are still standing guard, let them shut the doors and fasten them. And appoint guards from the inhabitants of Jerusalem[c][b], each at his watch and each opposite his own house.”
translation:
  language: tl
  text: At sinabi ko sa kanila, “Huwag buksan ang mga tarangkahan ng Jerusalem hanggang sa uminit ang araw.[a] Habang nakabantay pa sila, isara nila ang mga pinto at ipirmi ang mga ito.[b] Magtalaga rin kayo ng mga bantay mula sa mga naninirahan sa Jerusalem,[c] ang bawat isa sa kaniyang himpilan at ang bawat isa sa tapat ng sarili niyang bahay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang sa maging mainit ang araw,” samakatuwid, hindi lamang sa pagsikat ng araw kundi sa mas huling bahagi ng umaga.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “hawakan ang mga ito”; sa konteksto, nangangahulugan itong ipirmi o tiyaking nakasara nang mahigpit ang mga pinto.
    reason: lexical_alternative
  - marker: c
    text: O “magtalaga ng mga takdang pagbabantay mula sa mga naninirahan sa Jerusalem.” Ang salitang Hebreo ay maaaring tumukoy sa mga bantay o sa mga tungkulin at oras ng pagbabantay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפָּתְחוּ
  choice: Huwag buksan
  rationale: Ang Niphal ay pasibo sa Hebreo, ngunit ang karaniwang Tagalog na pagbabawal na “Huwag buksan” ay natural at nagpapanatili sa mariing utos nang hindi nagiging mabigat ang pangungusap.
- source_word: שַׁעֲרֵי יְרוּשָׁלִַם
  choice: ang mga pintuang-bayan ng Jerusalem
  rationale: Tumutukoy ito sa malalaking tarangkahan ng lungsod, hindi sa karaniwang pinto; malinaw at natural ang “pintuang-bayan” sa konteksto.
- source_word: עַד חֹם הַשֶּׁמֶשׁ
  choice: hanggang sa uminit ang araw
  rationale: Pinananatili nito ang kongkretong larawan ng Hebreo at ipinahihiwatig na hindi bubuksan ang mga pintuang-bayan sa pagsikat pa lamang ng araw.
- source_word: וְעַד הֵם עֹמְדִים
  choice: Habang nakabantay pa sila
  rationale: Literal na “habang nakatayo pa sila,” ngunit sa konteksto ng seguridad ang pagtayo ay pagtupad sa tungkulin bilang bantay.
- source_word: יָגִיפוּ הַדְּלָתוֹת
  choice: ipasara nila ang mga pinto
  rationale: Ang pandiwa ay nangangahulugang isara; ang “mga pinto” ay ang mga dahon o pinto ng mga pintuang-bayan.
- source_word: וֶאֱחֹזוּ
  choice: ipatrangka ang mga iyon
  rationale: Literal itong “hawakan/pigilan,” ngunit kasunod ng pagsasara ng mga pinto ay tumutukoy sa pagpirmi o pagseguro sa mga iyon. Ang “ipatrangka” ay malinaw sa konteksto, bagaman hindi tahasang tinutukoy ng Hebreo ang mekanismo.
- source_word: וְהַעֲמֵיד מִשְׁמְרוֹת
  choice: Magtalaga rin kayo ng mga bantay
  rationale: Ang Hiphil ng עמד ay “itayo/italaga,” at ang מִשְׁמְרוֹת ay maaaring tumukoy sa mga bantay o mga takdang pagbabantay. Ang napiling salin ay natural at akma sa mga taong kukunin mula sa mga naninirahan.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: mula sa mga naninirahan sa Jerusalem
  rationale: 'Ipinahahayag ang partitive na diwa: ang mga bantay ay pipiliin mula sa mga residente ng lungsod.'
- source_word: אִישׁ בְּמִשְׁמָרוֹ
  choice: ang bawat isa sa kaniyang himpilan
  rationale: Distributibo ang אִישׁ, at ang מִשְׁמָר ay maaaring tungkulin, pagbabantay, o puwesto. Ang “himpilan” ay natural para sa nakatalagang puwesto ng bantay.
- source_word: וְאִישׁ נֶגֶד בֵּיתוֹ
  choice: at ang bawat isa sa tapat ng sarili niyang bahay
  rationale: Pinananatili ng “sa tapat” ang posibleng lokasyonal na diwa ng נֶגֶד nang hindi ito nilalabo bilang “malapit sa.”
