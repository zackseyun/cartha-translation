  to: At sinabi ko sa kanila, “Huwag buksan ang mga tarangkahan ng Jerusalem hanggang sa uminit ang araw.[a] Habang nakabantay pa sila, isara nila ang mga pinto at ipirmi ang mga ito.[b] Magtalaga rin kayo ng mga bantay mula sa mga naninirahan sa Jerusalem,[c] ang bawat isa sa kaniyang himpilan at ang bawat isa sa tapat ng sarili niyang bahay.”
