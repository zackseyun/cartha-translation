translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pintuang-bayan” upang maiba sa mga “pinto” na mismong isinasara. Pinanatili ang kongkretong larawan ng pag-init ng araw at ang lokasyonal na “sa tapat ng sarili niyang bahay.”
