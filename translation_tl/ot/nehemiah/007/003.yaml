  verdict: revise
  source_fidelity: Tumpak sa kabuuan ang pagsasalin ng utos tungkol sa pagbubukas ng mga tarangkahan, sa pagbabantay, at sa pagtalaga ng mga bantay. Gayunman, ang “ipatrangka” ay nagsasaad ng isang tiyak na paraan ng pagseseguro (paglalagay ng trangka) na hindi tahasang tinutukoy ng וֶאֱחֹזוּ, na literal na “hawakan” at sa konteksto ay “ipirmi/seguruhin.”
  naturalness: Natural at malinaw ang modernong Tagalog sa pangkalahatan. Mas tuwiran at natural ang “isara nila” kaysa “ipasara nila,” sapagkat ang Hebreo ay nag-uutos na gawin nila mismo ang pagsasara. Ang “tarangkahan” ay mas karaniwang modernong katawagan para sa mga gate ng lungsod at malinaw na naiiba sa mga pintong isinasara.
  terminology: Pinanatili ang “Jerusalem,” “bantay,” at ang diwang lokasyonal ng “sa tapat ng sarili niyang bahay.” Ang “himpilan” ay katanggap-tanggap para sa משמר, bagaman maaaring mangahulugan din ang salita ng tungkulin o oras ng pagbabantay; naipapaliwanag ito sa tala.
  issues:
  - severity: medium
    issue: Ang “ipatrangka ang mga iyon” ay masyadong tiyak.
    rationale: Hindi binabanggit ng Hebreong אחז ang trangka o anumang partikular na mekanismo. Mas ligtas ang “ipirmi ang mga ito,” na naghahatid ng diwang pagseguro nang hindi nagdaragdag ng paraan.
