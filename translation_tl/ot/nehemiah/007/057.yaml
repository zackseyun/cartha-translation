translation:
  language: tl
  text: 'Ang mga anak[a] ng mga lingkod ni Solomon: ang mga anak ni Sotai, ang mga anak ni Soferet, at ang mga anak ni Perida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga talaangkanan, ang “mga anak ng/ni” ay maaari ring mangahulugang “mga inapo ng/ni” o mga kabilang sa angkan, hindi lamang mga tuwirang anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי עַבְדֵי שְׁלֹמֹה
  choice: Ang mga lingkod ni Solomon
  rationale: Sa pamagat ng pangkat, ang literal na ‘mga anak ng mga lingkod ni Solomon’ ay tumutukoy sa namamanang pangkat o mga inapo. Ang pinaikling anyo ay natural sa Filipino at kaayon ng gamit sa konteksto, samantalang nililinaw ng kasunod na tala ang lawak ng בְּנֵי.
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Pinananatili ang paulit-ulit na pormula ng talaangkanan. Sa ganitong listahan, maaari rin itong tumukoy sa mga inapo o angkan, hindi lamang sa tuwirang mga anak.
- source_word: עַבְדֵי
  choice: mga lingkod
  rationale: Ang pariralang ito ay katawagan sa isang namamanang pangkat. Ang ‘mga lingkod’ ay natural at hindi ipinagpapalagay nang higit sa konteksto ang tiyak na antas ng pagkaalipin.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: סוֹטַי
  choice: Sotai
  rationale: Malapit na transliterasyon ng pangalang Hebreo sa baybay na madaling basahin sa Filipino.
- source_word: סוֹפֶרֶת
  choice: Soferet
  rationale: Tinumbasan bilang pangalang pantangi, hindi bilang karaniwang salitang kaugnay ng pagsusulat o pagbibilang; ang baybay ay malapit sa bigkas ng Hebreo at natural sa Filipino.
- source_word: פְרִידָא
  choice: Perida
  rationale: Malapit at payak na transliterasyon ng pangalang Hebreo para sa mambabasang Filipino.
