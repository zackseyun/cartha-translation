translation_notes:
  register: Maikli at dignified ang rehistro, angkop sa isang talaan ng sambahayan o angkan. Pinanatili ang “mga anak ni” sa halip na gawing “mga inapo ni” upang mapanatili ang pormal na hulma ng Hebreo habang nauunawaan pa rin bilang katawagan sa angkan.
