lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Sa konteksto ng talaan, literal itong “mga anak ni” at tumutukoy rin sa angkan o mga inapo. Pinananatili ng salin ang anyong genealogical na natural sa Filipino.
- source_word: עָדִין
  choice: Adin
  rationale: Pangalan ng tao o angkan; tinumbasan sa karaniwang transliterasyong Filipino.
- source_word: שֵׁשׁ מֵאוֹת
  choice: '600'
  rationale: Tuwirang katumbas ng bilang na “anim na raan”; ginamit ang numerong anyo dahil maikli at malinaw ito sa isang listahan.
- source_word: חֲמִשִּׁים וַחֲמִשָּׁה
  choice: '55'
  rationale: Ang literal na “limampu at lima” ay natural na ipinapahayag bilang 55 sa modernong Filipino, nang hindi binabago ang eksaktong bilang.
