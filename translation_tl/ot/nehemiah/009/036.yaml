revisions:
- from: Narito, mga alipin[a] kami ngayon. At sa lupaing ibinigay mo sa aming mga ninuno upang kainin ang bunga nito at ang mabubuting bagay[b] nito—narito, mga alipin kami rito[c].
  to: Narito, ngayon ay mga alipin[a] kami. Sa lupaing ibinigay mo sa aming mga ninuno upang kainin ang bunga nito at ang kasaganaan[b] nito—narito, mga alipin kami sa lupain ding ito[c].
  rationale: Inayos ang pangwakas na lokatibong parirala upang malinaw na matumbok ang mismong lupain at mapanatili ang retorikal na kabalintunaan ng Hebreo. Pinalitan ang medyo hindi idiomatikong “mabubuting bagay nito” ng “kasaganaan nito,” habang ibinibigay ang dating pananalita bilang alternatibo sa talababa. Pinanatili ang mga panandang talababa at ang tuwirang pagtukoy sa Diyos.
