  text: הִנֵּ֛ה אֲנַ֥חְנוּ הַ/יּ֖וֹם עֲבָדִ֑ים וְ/הָ/אָ֜רֶץ אֲשֶׁר נָתַ֣תָּה לַ/אֲבֹתֵ֗י/נוּ לֶ/אֱכֹ֤ל אֶת פִּרְיָ/הּ֙ וְ/אֶת טוּבָ֔/הּ הִנֵּ֛ה אֲנַ֥חְנוּ עֲבָדִ֖ים עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/036.yaml
  text: Look[a], today we are servants; and in the land that you gave to our fathers to eat its fruit and its good things, look[c][b], we are servants on it.
translation:
  language: tl
  text: Narito, ngayon ay mga alipin[a] kami. Sa lupaing ibinigay mo sa aming mga ninuno upang kainin ang bunga nito at ang kasaganaan[b] nito—narito, mga alipin kami sa lupain ding ito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lingkod.” Ang salitang Hebreo ay maaaring tumukoy sa mga lingkod o alipin, ngunit dito ay binibigyang-diin ang kanilang pagkasakop sa kapangyarihang dayuhan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mabubuting bagay nito.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “mga alipin sa ibabaw nito,” ibig sabihin, sa mismong lupaing ibinigay ng Diyos sa kanilang mga ninuno.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang pansin at mariing himig ng panaghoy, pati ang pag-uulit nito sa Hebreo.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Likas sa modernong Tagalog at malinaw na itinatambis ang kasalukuyang kalagayan sa dating pagkakaloob ng lupain.
- source_word: עֲבָדִים
  choice: mga alipin
  rationale: Mas malinaw kaysa “mga lingkod” na ang tinutukoy ay kawalan ng kalayaan at pagkasakop sa kapangyarihang dayuhan.
- source_word: וְהָאָרֶץ
  choice: At sa lupain
  rationale: May elipsis ang Hebreo; ang lokatibong “sa” ay nilinaw batay sa pangwakas na עָלֶיהָ, nang hindi inaalis ang retorikal na kabalintunaan.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: ibinigay mo sa aming mga ninuno
  rationale: Pinananatili ang tuwirang pakikipag-usap sa Diyos; natural at marangal sa Tagalog ang “mga ninuno” bilang pagtukoy sa mga naunang ama ng bayan.
- source_word: לֶאֱכֹל
  choice: upang kainin
  rationale: Tuwirang ipinapahayag ang layunin ng pagkakaloob ng lupain.
- source_word: פִּרְיָהּ
  choice: ang bunga nito
  rationale: Pinananatili ang konkretong larawang pang-agrikultura at ang wika tungkol sa lupang ipinangako.
- source_word: טוּבָהּ
  choice: ang mabubuting bagay nito
  rationale: Pinananatili ang malawak na kahulugan ng kabutihan o kasaganaan ng lupain nang hindi ito nililimitahan sa ani lamang.
- source_word: עָלֶיהָ
  choice: rito
  rationale: Natural na lokatibong Tagalog na tumutukoy sa mismong lupaing kababanggit; pinananatili ang diin na alipin sila sa lupaing ibinigay sa kanila.
theological_decisions:
- issue: Paglalarawan sa עֲבָדִים sa panaghoy tungkol sa tipan at lupain
  choice: mga alipin
  alternative: mga lingkod
  rationale: Ang konteksto ay panaghoy sa pampolitikang pagkasakop at kawalan ng kalayaan sa loob mismo ng lupang ipinagkaloob ng Diyos. Mas tumpak na naipadarama ng “mga alipin” ang tensiyong ito.
- issue: Pagtukoy sa לַאֲבֹתֵינוּ
  choice: sa aming mga ninuno
  alternative: sa aming mga ama
  rationale: Ang “mga ninuno” ay malinaw at likas na modernong Tagalog para sa kolektibong mga ama ng Israel, samantalang maaaring mapagkamalang agarang mga magulang ang literal na “mga ama.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang dalawang ulit na “Narito” at ang matinding kabalintunaan ng pagiging alipin sa mismong lupaing kaloob ng Diyos. Ginamit ang “lupain” sa halip na “lupa” upang malinaw na tumukoy sa teritoryo, at “rito” upang maging natural ang lokatibong pangwakas na parirala.
