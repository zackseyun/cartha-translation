base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/012.yaml
  text: By a pillar of cloud you led them by day[a], and by a pillar of fire by night to give them light on the way in which they should go.
translation:
  language: tl
  text: Sa pamamagitan ng haliging ulap, pinatnubayan mo sila sa araw, at sa pamamagitan ng haliging apoy sa gabi upang bigyan sila ng liwanag sa daang dapat nilang lakaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “upang liwanagan ang daan para sa kanila, ang daang dapat nilang lakaran.” Sa literal, sinasabi ng Hebreo, “upang magbigay-liwanag para sa kanila sa daan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעַמּוּד עָנָן
  choice: Sa pamamagitan ng haliging ulap
  rationale: Maaaring instrumento o kinalalagyan ang בְּ, ngunit malinaw sa konteksto na ang haliging ulap ang ginamit ng Diyos sa paggabay. Likas sa modernong Tagalog ang “sa pamamagitan ng” at hindi nito ipinipilit ang isang tiyak na paliwanag tungkol sa kinalalagyan.
- source_word: הִנְחִיתָם
  choice: pinatnubayan mo sila
  rationale: Ang Hiphil ng נחה ay tumutukoy rito sa paggabay o pangunguna. Ang “pinatnubayan” ay marangal at malinaw, at akma sa paggabay sa kanilang paglalakbay.
- source_word: יוֹמָם
  choice: sa araw
  rationale: Pang-abay ito na tumutukoy sa maghapon at likas na katambal sa Tagalog ng “sa gabi.”
- source_word: וּבְעַמּוּד אֵשׁ
  choice: at sa pamamagitan ng haliging apoy
  rationale: Pinananatili nito ang paralelismo sa “haliging ulap” at ang instrumental na diwa ng pang-ukol.
- source_word: לַיְלָה
  choice: sa gabi
  rationale: Ito ang natural na temporal na katumbas ng “sa araw” sa modernong Tagalog.
- source_word: לְהָאִיר לָהֶם
  choice: upang bigyan sila ng liwanag
  rationale: Ipinahahayag ng Hiphil infinitive ang layunin, at ng לָהֶם ang kapakinabangan para sa kanila. Natural sa Tagalog ang pariralang ito at pinananatili ang larawan ng pagbibigay-liwanag.
- source_word: אֶת הַדֶּרֶךְ
  choice: sa daan
  rationale: Bagaman tuwirang layon sa Hebreo ang “daan,” hinihingi ng idyomatikong Tagalog na sabihin na binigyan sila ng liwanag “sa daan.”
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: na dapat nilang lakaran
  rationale: Tinutukoy ng sugnay ang rutang itinakdang tahakin nila. Ang “dapat” ay nagpapahayag ng nilalayong direksiyon, at ang “lakaran” ay nagpapanatili sa konkretong diwa ng הלך.
theological_decisions:
- issue: Larawan ng paggabay ng Diyos sa ilang
  choice: Isinalin bilang makasaysayang paggabay ng Diyos sa Israel sa pamamagitan ng ulap at apoy.
  alternative: Isang mas interpretatibong salin na tahasang magbibigay-diin sa ulap at apoy bilang sagisag ng presensiya ng Diyos.
  rationale: Ang talata mismo ay nakatuon sa paggabay at pagbibigay-liwanag sa daraanan. Hindi idinagdag sa pangunahing teksto ang tipolohiya o anumang partikular na doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw sa karaniwang mambabasa. Ginamit ang “pinatnubayan” upang mapanatili ang marangal na himig nang hindi nagiging lipas, at pinanatili ang balanseng paralelismo ng “haliging ulap” at “haliging apoy,” gayundin ng “sa araw” at “sa gabi.”
