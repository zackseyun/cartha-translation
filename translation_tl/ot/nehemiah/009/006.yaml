id: NEH.9.6
reference: Nehemiah 9:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַתָּה ה֣וּא יְהוָה֮ לְ/בַדֶּ/ךָ֒ את עָשִׂ֡יתָ אֶֽת הַ/שָּׁמַיִם֩ שְׁמֵ֨י הַ/שָּׁמַ֜יִם וְ/כָל צְבָאָ֗/ם הָ/אָ֜רֶץ וְ/כָל אֲשֶׁ֤ר עָלֶ֨י/הָ֙ הַ/יַּמִּים֙ וְ/כָל אֲשֶׁ֣ר בָּ/הֶ֔ם וְ/אַתָּ֖ה מְחַיֶּ֣ה אֶת כֻּלָּ֑/ם וּ/צְבָ֥א הַ/שָּׁמַ֖יִם לְ/ךָ֥ מִשְׁתַּחֲוִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/006.yaml
  text: You alone are Yahweh[a]. You made the heavens, the highest heavens and all their host, the earth and all that is on it, the seas and all that is in them; and you preserve all of them alive[c][b], and the host of heaven bows down to you.
translation:
  language: tl
  text: Ikaw lamang ang Yahweh. Ikaw ang gumawa ng langit, ng kataas-taasang langit[a] at ng lahat ng hukbo ng mga langit, ng lupa at ng lahat ng nasa ibabaw nito, at ng mga dagat at ng lahat ng nasa mga ito. Ikaw ang nagpapanatiling buhay sa lahat ng ito,[b] at ang hukbo ng langit[c] ay nagpapatirapa sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “langit ng mga langit,” isang paraan ng pagsasabing “kataas-taasang langit.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nagbibigay-buhay sa lahat ng ito” o “pinananatiling buháy ang lahat ng ito.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring isalin na “makalangit na hukbo.” Maaaring saklaw ng parirala ang mga nilalang sa langit at/o ang mga bagay sa kalangitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אַתָּה הוּא ... לְבַדֶּךָ
  choice: Ikaw lamang ang
  rationale: Natural na ipinahahayag sa modernong Tagalog ang mariing pagbubukod na nasa Hebreo.
- source_word: עָשִׂיתָ
  choice: gumawa
  rationale: Tuwirang katumbas ito ng karaniwang pandiwang עשה at hindi nito ipinapalit ang mas tiyak na pandiwang 'lumikha.'
- source_word: הַשָּׁמַיִם
  choice: langit
  rationale: Sa Tagalog, karaniwang pangngalang panlahatan ang 'langit' kahit malawak ang saklaw ng anyong maramihan sa Hebreo.
- source_word: שְׁמֵי הַשָּׁמַיִם
  choice: kataas-taasang langit
  rationale: Ipinahahayag nito ang diwang pasukdol ng literal na pariralang 'langit ng mga langit' sa natural na Tagalog.
- source_word: צְבָאָם
  choice: lahat ng hukbo ng mga ito
  rationale: Pinananatili ng 'hukbo' ang malawak na saklaw ng salita, na maaaring tumukoy sa mga bagay sa kalangitan at/o mga nilalang sa langit.
- source_word: הָאָרֶץ וְכָל אֲשֶׁר עָלֶיהָ
  choice: lupa at lahat ng nasa ibabaw nito
  rationale: Ang 'lupa' rito ay ang buong daigdig sa talaan ng sangnilikha; malinaw ring naipapakita ang עָלֶיהָ na 'nasa ibabaw nito.'
- source_word: הַיַּמִּים וְכָל אֲשֶׁר בָּהֶם
  choice: mga dagat at lahat ng naroon sa mga iyon
  rationale: Tuwiran at natural na salin ito ng mga dagat at ng lahat ng nasa loob ng mga ito.
- source_word: מְחַיֶּה
  choice: nagpapanatiling buhay
  rationale: Ipinahahayag nito ang nagpapatuloy na pagkilos ng Diyos sa pagpapanatili ng buhay habang hindi itinatanggi ang posibleng diwang 'nagbibigay-buhay.'
- source_word: אֶת כֻּלָּם
  choice: lahat ng ito
  rationale: Malinaw na tinutukoy nito ang kabuuan ng sangnilikha na katatapos lamang ilista.
- source_word: מִשְׁתַּחֲוִים
  choice: nagpapatirapa sa harap mo
  rationale: Pinananatili nito ang konkretong kilos ng pagyukod o pagpapatirapa bilang pagpapasakop at pagsamba.
theological_decisions:
- issue: Natatanging pagkakakilanlan ni Yahweh
  choice: Ikaw lamang ang Yahweh
  alternative: Ikaw ang Yahweh, ikaw lamang
  rationale: Pinananatili ang mariing eksklusibong pahayag ng Hebreo nang natural sa Tagalog.
- issue: Patuloy na pagkilos ng Diyos sa sangnilikha sa מְחַיֶּה
  choice: Ikaw ang nagpapanatiling buhay sa lahat ng ito
  alternative: Ikaw ang nagbibigay-buhay sa lahat ng ito
  rationale: Ang konteksto ay lumilipat mula sa paggawa ng lahat ng bagay tungo sa patuloy na pag-iingat ng kanilang buhay, ngunit itinatala sa talababa ang tunay na leksikal na alternatibo.
- issue: Saklaw ng צְבָא הַשָּׁמַיִם
  choice: hukbo ng langit
  alternative: makalangit na hukbo
  rationale: Hindi nililimitahan ang parirala sa mga bituin lamang o sa mga anghel lamang, kaya nananatili ang likas na lawak at posibleng pag-uugnay nito sa naunang 'hukbo.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang makaluma o labis na teknikal na pananalita. Pinanatili ang pangalang Yahweh, ang konkretong larawan ng pagpapatirapa, at ang leksikal na kalabuan ng 'hukbo ng langit.'
