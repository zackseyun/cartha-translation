id: NEH.9.26
reference: Nehemiah 9:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּמְר֨וּ וַֽ/יִּמְרְד֜וּ בָּ֗/ךְ וַ/יַּשְׁלִ֤כוּ אֶת תּוֹרָֽתְ/ךָ֙ אַחֲרֵ֣י גַוָּ֔/ם וְ/אֶת נְבִיאֶ֣י/ךָ הָרָ֔גוּ אֲשֶׁר הֵעִ֥ידוּ בָ֖/ם לַ/הֲשִׁיבָ֣/ם אֵלֶ֑י/ךָ וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדוֹלֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/026.yaml
  text: But they acted presumptuously and rebelled against you[a], and they cast your law behind their backs. They killed your prophets, who had warned them in order to bring them back to you[d][c][b], and they committed great blasphemies.
translation:
  language: tl
  text: Ngunit nagmatigas sila at naghimagsik laban sa iyo.[a] Itinapon nila sa likuran nila ang iyong kautusan.[b] Pinatay nila ang iyong mga propeta, na taimtim na nagbabala sa kanila[c] upang ibalik sila sa iyo. At gumawa sila ng napakalalaking paglapastangan.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naging mapanghamong masuwayin” o “kumilos nang may kapalaluan.” Ang pandiwang Hebreo ay nagpapahiwatig ng sadyang paglaban.
    reason: lexical_alternative
  - marker: b
    text: O “tagubilin” sa halip na “kautusan.”
    reason: lexical_alternative
  - marker: c
    text: O “taimtim na nagpatotoo laban sa kanila.” Maaaring ipahiwatig ng Hebreo ang pormal na pagpapatotoo o mariing pagbababala.
    reason: lexical_alternative
  - marker: d
    text: O “napakalalaking paghamak,” “pang-iinsulto,” o “paghamon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ
  choice: nagmatigas sila
  rationale: Ipinahahayag ng pandiwa ang sadyang pagsuway at mapanghamong paglaban. Naiiba ito sa kasunod na tahasang 'naghimagsik' nang hindi ginagawang di-likas ang Filipino.
- source_word: וַיִּמְרְדוּ בָּךְ
  choice: naghimagsik laban sa iyo
  rationale: Tuwirang ipinahahayag ng מרד ang paghihimagsik, at pinananatili ng 'laban sa iyo' ang personal na tunguhin ng Hebreo.
- source_word: וַיַּשְׁלִכוּ ... אַחֲרֵי גַוָּם
  choice: itinapon nila sa likuran nila
  rationale: Pinananatili ang matingkad na larawang Hebreo ng tahasang pagtanggi at paghamak, sa halip na palabuin bilang simpleng hindi pagpansin.
- source_word: תּוֹרָתְךָ
  choice: iyong kautusan
  rationale: Sa konteksto ng tipan at kasaysayan ng Israel, ang 'kautusan' ay natural at madaling makilala, bagaman maaari ring mangahulugang 'tagubilin' ang תּוֹרָה.
- source_word: נְבִיאֶיךָ
  choice: iyong mga propeta
  rationale: Karaniwan at tumpak na katumbas sa modernong Filipino.
- source_word: הֵעִידוּ בָם
  choice: taimtim na nagbabala sa kanila
  rationale: Maaaring tumukoy ang Hiphil ng עוּד sa pagpapatotoo laban sa isang tao o sa mariing pagbababala. Ipinakikita ng 'taimtim' ang pormal at mabigat na katangian nito.
- source_word: לַהֲשִׁיבָם אֵלֶיךָ
  choice: upang ibalik sila sa iyo
  rationale: Pinananatili ang causative na diwa ng שוב at ang layuning maibalik ang bayan sa Diyos.
- source_word: נֶאָצוֹת גְּדוֹלֹת
  choice: napakalalaking paglapastangan
  rationale: Ang pangngalan ay tumutukoy sa mabibigat na gawa ng paghamak o pag-insulto, lalo na laban sa Diyos. Ang 'paglapastangan' ay hindi nililimitahan ang diwa sa sinambit na pamumusong lamang.
theological_decisions:
- issue: Pagkakaiba ng magkasunod na וַיַּמְרוּ at וַיִּמְרְדוּ
  choice: nagmatigas sila at naghimagsik
  alternative: sumuway sila at naghimagsik; nagmataas sila at naghimagsik
  rationale: Pinananatili ang retorikal na pag-igting ng dalawang magkaugnay ngunit magkaibang pandiwa. Ang una ay sadyang mapanghamong pagsuway; ang ikalawa ay tahasang paghihimagsik.
- issue: Saklaw ng נֶאָצוֹת
  choice: mga paglapastangan
  alternative: mga pamumusong; mga paghamak; mga pang-iinsulto
  rationale: Ipinakikita ng 'paglapastangan' ang bigat at tuwirang paghamak sa Diyos nang hindi ipinapalagay na puro pananalita lamang ang tinutukoy.
- issue: Diwa ng הֵעִידוּ בָם
  choice: taimtim na nagbabala sa kanila
  alternative: nagpatotoo laban sa kanila; mahigpit na nagpaalaala sa kanila
  rationale: Natural nitong ipinahahayag sa Filipino ang makahulang babala, habang kinikilala sa talababa ang posibleng legal o tipanang diwa ng pagpapatotoo laban sa kanila.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang konkretong idyomang 'sa likuran nila' at ang panalanging tuwirang nakatuon sa Diyos. Gumamit ng 'nagmatigas' upang natural na maiba ang unang pandiwa sa tahasang 'naghimagsik.'
