source:
  edition: WLC
  text: וּ/כְ/נ֣וֹחַ לָ/הֶ֔ם יָשׁ֕וּבוּ לַ/עֲשׂ֥וֹת רַ֖ע לְ/פָנֶ֑י/ךָ וַ/תַּֽעַזְבֵ֞/ם בְּ/יַ֤ד אֹֽיְבֵי/הֶם֙ וַ/יִּרְדּ֣וּ בָ/הֶ֔ם וַ/יָּשׁ֨וּבוּ֙ וַ/יִּזְעָק֔וּ/ךָ וְ/אַתָּ֞ה מִ/שָּׁמַ֧יִם תִּשְׁמַ֛ע וְ/תַצִּילֵ֥/ם כְּֽ/רַחֲמֶ֖י/ךָ רַבּ֥וֹת עִתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/028.yaml
  text: But when they had rest, they again did evil before you; so you left them in the power of their enemies[a], who ruled over them. Then they returned and cried out to you, and from heaven you heard and delivered them many times according to your mercies.
translation:
  language: tl
  text: Ngunit nang magkaroon sila ng kapahingahan, muli silang gumawa ng masama sa harap mo. Kaya pinabayaan mo sila sa kapangyarihan ng kanilang mga kaaway[a], na namuno sa kanila. Pagkatapos, nanumbalik sila at dumaing sa iyo. Mula sa langit ay dininig mo sila at iniligtas mo sila nang maraming ulit, ayon sa iyong habag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa kamay ng kanilang mga kaaway,” isang idyomang Hebreo na nangangahulugang nasa kapangyarihan o kontrol ng kanilang mga kaaway.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְנוֹחַ לָהֶם
  choice: Ngunit nang magkaroon sila ng kapahingahan
  rationale: Ipinahahayag ng pariralang temporal ang kalagayan nang muli silang magkasala, ngunit hindi nito sinasabing agad iyon nangyari; kaya hindi idinagdag ang “kaagad.”
- source_word: יָשׁוּבוּ לַעֲשׂוֹת רַע
  choice: muli silang gumawa ng masama
  rationale: Kasama ng pawatas, ang pandiwa ay nagsasaad ng pag-uulit ng masamang gawain. Mas natural ito sa Tagalog kaysa sa literal na “bumalik sila upang gumawa.”
- source_word: לְפָנֶיךָ
  choice: sa harap mo
  rationale: Pinananatili nito ang larawan ng pagkilos sa presensiya ng Diyos nang hindi nililimitahan ang kahulugan sa simpleng pagkakita o pinalalakas bilang tahasang “laban sa iyo.”
- source_word: וַתַּעַזְבֵם
  choice: pinabayaan mo sila
  rationale: Ipinakikita nito ang pag-aalis ng proteksiyon sa konteksto ng paghatol, nang hindi ipinahihiwatig na permanente o lubos silang itinakwil.
- source_word: בְּיַד אֹיְבֵיהֶם
  choice: sa kapangyarihan ng kanilang mga kaaway
  rationale: Ang literal na “sa kamay” ay idyomang Hebreo para sa kapangyarihan o kontrol; isinalin nang malinaw at pinanatili ang larawan sa talababa.
- source_word: וַיִּרְדּוּ בָהֶם
  choice: na namuno sa kanila
  rationale: Ang pandiwa ay tumutukoy sa paggamit ng kapangyarihan o pamamahala sa kanila. Hindi idinagdag ang “inapi,” bagaman malupit ang ipinahihiwatig ng konteksto.
- source_word: וַיָּשׁוּבוּ
  choice: nanumbalik sila
  rationale: Dito tunay na tumutukoy ang pandiwa sa kanilang pagbaling o pagbabalik sa Diyos, taliwas sa naunang gamit nito para sa pag-uulit ng kasamaan.
- source_word: וַיִּזְעָקוּךָ
  choice: dumaing sa iyo
  rationale: Ang “dumaing” ay natural na nagpapahayag ng matinding paghingi ng saklolo nang hindi tahasang nagdaragdag ng mga salitang wala sa teksto.
- source_word: מִשָּׁמַיִם תִּשְׁמַע
  choice: Mula sa langit ay dininig mo sila
  rationale: Pinananatili ang nauunang pariralang “mula sa langit” at ang diwa ng pagtugon ng Diyos sa kanilang daing.
- source_word: וְתַצִּילֵם
  choice: at iniligtas
  rationale: Sa konteksto, tumutukoy ito sa pagliligtas mula sa mga kaaway; karaniwan at malinaw ang “iniligtas” sa modernong Tagalog.
- source_word: כְּרַחֲמֶיךָ רַבּוֹת עִתִּים
  choice: nang maraming ulit, ayon sa iyong habag
  rationale: Ang pambabaeng pangmaramihang רַבּוֹת ay kaugnay ng עִתִּים (“mga ulit/panahon”), hindi ng רַחֲמֶיךָ. Kaya ang dami ay inilapat sa mga pagkakataon ng pagliligtas, hindi ginawang “masaganang habag.”
theological_decisions:
- issue: Ang pagpapabaya ng Diyos sa kanila
  choice: pinabayaan mo sila sa kapangyarihan ng kanilang mga kaaway
  alternative: lubusan mo silang tinalikuran at ibinigay sa kanilang mga kaaway
  rationale: Inilalarawan ng talata ang paghatol sa pamamagitan ng pag-aalis ng proteksiyon, ngunit ipinakikita rin ng kasunod na pagliligtas na hindi ito isang ganap at permanenteng pagtatakwil.
- issue: Paulit-ulit na kilos sa huling sugnay
  choice: dininig mo sila at iniligtas nang maraming ulit
  alternative: dinirinig mo sila at inililigtas nang maraming ulit
  rationale: Sa buod na pangkasaysayan, ang mga anyong Hebreo ay maaaring magpahayag ng paulit-ulit na kilos sa nakaraan. Nililinaw ito ng “nang maraming ulit” habang pinananatili ang salaysay sa aspektong naganap.
- issue: Bilang ng רַחֲמֶיךָ at pagkakaugnay ng רַבּוֹת
  choice: ayon sa iyong habag
  alternative: ayon sa iyong maraming habag
  rationale: Bagaman maramihan ang anyong Hebreo ng “habag,” ang “iyong habag” ang likas na kolektibong pagpapahayag sa Tagalog. Ang “maraming” ay gramatikal na tumutukoy sa “mga ulit,” kaya hindi ito ikinakabit sa habag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapahingahan,” “nanumbalik,” at “dumaing” bilang pormal ngunit madaling maunawaang mga salitang angkop sa panalangin at salaysay. Iniwasan ang “kaagad” dahil wala ito sa Hebreo, at pinanatiling magkaiba ang naunang pag-uulit ng kasamaan at ang kasunod na pagbabalik sa Diyos.
