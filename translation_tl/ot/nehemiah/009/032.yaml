source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱ֠לֹהֵי/נוּ הָ/אֵ֨ל הַ/גָּד֜וֹל הַ/גִּבּ֣וֹר וְ/הַ/נּוֹרָא֮ שׁוֹמֵ֣ר הַ/בְּרִ֣ית וְ/הַ/חֶסֶד֒ אַל יִמְעַ֣ט לְ/פָנֶ֡י/ךָ אֵ֣ת כָּל הַ/תְּלָאָ֣ה אֲֽשֶׁר מְ֠צָאַתְ/נוּ לִ/מְלָכֵ֨י/נוּ לְ/שָׂרֵ֧י/נוּ וּ/לְ/כֹהֲנֵ֛י/נוּ וְ/לִ/נְבִיאֵ֥/נוּ וְ/לַ/אֲבֹתֵ֖י/נוּ וּ/לְ/כָל עַמֶּ֑/ךָ מִ/ימֵי֙ מַלְכֵ֣י אַשּׁ֔וּר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/032.yaml
  text: 'And now[a], our God—the great, mighty, and fearsome God, who keeps the covenant and steadfast love—do not let all the hardship that has come upon us seem small before you: upon our kings, our officials, our priests, our prophets, our fathers[b], and all your people, from the days of the kings of Assyria until this day.'
translation:
  language: tl
  text: At ngayon, O aming Diyos—ang dakila, makapangyarihan, at kakila-kilabot[a] na Diyos, na tapat sa tipan at may tapat na pag-ibig—huwag mong ituring na maliit sa iyong paningin ang lahat ng paghihirap na dumating sa amin, sa aming mga hari, mga pinuno, mga pari, mga propeta, mga ninuno[b], at sa buong bayan mo, mula sa panahon ng mga hari ng Asiria hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kakila-kilabot” ay nangangahulugang pumupukaw ng banal na takot at pagpipitagan; maaari ring isaling “kasindak-sindak.”
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “mga ama namin”; tumutukoy ito sa mga ninuno ng bayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Diyos
  rationale: Nakatayong paglalarawan ito kasunod ng “aming Diyos.” Ang payak na “Diyos” ay natural sa Tagalog at hindi nangangailangan ng artipisyal na pag-uulit.
- source_word: הַגָּדוֹל הַגִּבּוֹר וְהַנּוֹרָא
  choice: ang dakila, makapangyarihan, at kakila-kilabot
  rationale: Pinananatili ng magkakaugnay na mga titulong ito ang kadakilaan, kapangyarihan, at banal na pagkatakot na pinupukaw ng Diyos. Ang “kakila-kilabot” dito ay marangal at hindi nangangahulugang masama.
- source_word: שׁוֹמֵר
  choice: na tumutupad
  rationale: Sa kaugnayan ng tipan, ipinahihiwatig ng participle ang patuloy na pag-iingat at matapat na pagtupad. Mas natural sa modernong Tagalog ang “tumutupad sa tipan.”
- source_word: הַבְּרִית וְהַחֶסֶד
  choice: sa tipan at tapat na pag-ibig
  rationale: Ang חֶסֶד sa kontekstong tipan ay pag-ibig na matatag at tapat. Iniiwasan ng saling ito ang makitid na “awa” habang pinananatili ang bigat ng ugnayang tipan.
- source_word: אַל יִמְעַט לְפָנֶיךָ
  choice: huwag mong ituring na maliit
  rationale: Ipinapahayag ng idyoma ang pakiusap na huwag maliitin o ituring na walang halaga ng Diyos ang kanilang dinanas. Natural ito sa Tagalog nang hindi labis na nilulutas ang talinghaga.
- source_word: כָּל הַתְּלָאָה
  choice: lahat ng paghihirap
  rationale: Saklaw ng תְּלָאָה ang hirap, pagdurusa, at mabigat na pagsubok. Ang “paghihirap” ay malinaw at angkop sa kolektibong kasaysayang tinutukoy.
- source_word: אֲשֶׁר מְצָאַתְנוּ
  choice: na dumating sa amin
  rationale: Literal na “nakasumpong sa amin,” ngunit idyoma ito para sa kapahamakang sumapit. Ang “dumating sa amin” ay malinaw at hindi nagpapalabis.
- source_word: לִמְלָכֵינוּ לְשָׂרֵינוּ וּלְכֹהֲנֵינוּ וְלִנְבִיאֵינוּ וְלַאֲבֹתֵינוּ
  choice: sa aming mga hari, mga pinuno, mga pari, mga propeta, mga ninuno
  rationale: Minamarkahan ng ל ang mga dumanas ng paghihirap. Ang שָׂרִים ay “mga pinuno,” at ang אָבוֹת sa konteksto ay mga ninuno o mga ama ng bayan.
- source_word: וּלְכָל עַמֶּךָ
  choice: at sa buong bayan mo
  rationale: Pinalalawak nito ang talaan mula sa mga pinuno at ninuno tungo sa kabuuan ng bayang nakikipagtipan sa Diyos.
- source_word: מִימֵי מַלְכֵי אַשּׁוּר
  choice: mula sa panahon ng mga hari ng Asiria
  rationale: Tuwirang ipinapakita nito ang simula ng mahabang yugto ng paghihirap na binabanggit sa panalangin.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Karaniwang temporal na pahayag ito para sa tuloy-tuloy na saklaw mula noong panahon ng Asiria hanggang sa kasalukuyan ng nagsasalita.
theological_decisions:
- issue: Paglalarawan sa Diyos sa pamamagitan ng נוֹרָא
  choice: kakila-kilabot
  alternative: kahanga-hanga; kasindak-sindak
  rationale: Ang salita ay tumutukoy sa Diyos bilang pumupukaw ng takot at pagpipitagan. Ang “kakila-kilabot” ay nagpapanatili ng banal na pangamba, habang nililinaw ng talababa na hindi ito negatibong paghatol sa Diyos.
- issue: Kahulugan ng חֶסֶד sa tipan
  choice: tapat na pag-ibig
  alternative: wagas na pag-ibig; awa
  rationale: Pinananatili nito ang ugnayan ng pag-ibig at katapatan nang hindi ikinukulong ang termino sa awa lamang o ikinakabit sa natatanging pormulasyon ng isang denominasyon.
- issue: Paglalarawan sa אֲבֹתֵינוּ
  choice: mga ninuno
  alternative: mga ama
  rationale: Bagaman panlalaki ang anyong Hebreo, tumutukoy ito sa mga naunang salinlahi o mga ninunong lalaki ng bayan. Ang “mga ninuno” ay natural at malinaw sa Tagalog; inilalahad sa talababa ang mas literal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa panalangin. Ginamit ang “O” upang malinaw ang tuwirang pagtawag sa Diyos; pinanatili ang mahabang serye at solemneng indayog ng Hebreo, ngunit inayos ang mga parirala upang maging likas at madaling maunawaan.
