    rationale: Ang 'huwag mong ituring na maliit' ay nakukuha ang pangunahing kahilingan, ngunit hindi nito tuwirang naihahatid ang idyomatikong 'sa harap mo/sa iyong paningin.' Ang 'sa iyong paningin' ay likas na Tagalog at pinananatili ang pananaw ng Diyos na nasa Hebreo.
  - severity: medium
    issue: Hindi likas ang saklaw ng 'tumutupad' sa 'tipan at tapat na pag-ibig.'
    rationale: Sa Tagalog, ang 'tumutupad sa ... tapat na pag-ibig' ay maaaring magmukhang tinutupad ang isang abstraktong pag-ibig. Ang Hebreong participle ay naglalarawan sa Diyos bilang tapat sa tipan at nagpapanatili ng kaniyang tapat na pag-ibig.
