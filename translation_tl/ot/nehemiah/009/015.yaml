base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/015.yaml
  text: You gave them bread from heaven for their hunger[a], and you brought out water from the rock for their thirst, and you told them to go in to possess the land that you had sworn to give them.
translation:
  language: tl
  text: Binigyan mo sila ng tinapay mula sa langit para sa kanilang gutom, at nagpalabas ka ng tubig mula sa bato para sa kanilang uhaw. Sinabi mo sa kanila na pumasok at angkinin ang lupa na ipinangako mo nang may panunumpa[a] na ibibigay sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “itinaas mo ang iyong kamay.” Isa itong pahayag sa Hebreo para sa panunumpa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם מִשָּׁמַיִם
  choice: tinapay mula sa langit
  rationale: Pinananatili ang konkretong larawan ng Hebreo at ang pahiwatig sa manna; hindi ito ginawang mas pangkalahatang “pagkain.”
- source_word: לִרְעָבָם
  choice: para sa kanilang gutom
  rationale: Malapit sa anyo ng Hebreo at katanggap-tanggap sa makabagong Tagalog, habang pinananatili ang parallelismo sa “para sa kanilang uhaw.”
- source_word: מַיִם מִסֶּלַע
  choice: tubig mula sa bato
  rationale: Natural sa Tagalog at hindi ipinipilit ang katiyakan ng artikulo na wala sa Hebreo.
- source_word: הוֹצֵאתָ
  choice: nagpalabas ka
  rationale: Ipinahahayag ang causative na diwa ng Hiphil ng יצא nang natural at tuwiran.
- source_word: לִצְמָאָם
  choice: para sa kanilang uhaw
  rationale: Pinananatili ang estruktural at makatang pagtutugma sa “para sa kanilang gutom.”
- source_word: וַתֹּאמֶר לָהֶם
  choice: Sinabi mo sa kanila
  rationale: Tapat sa payak na pandiwang “sinabi” at hindi dinaragdagan tungo sa mas malakas na “inutusan.”
- source_word: לָבוֹא
  choice: pumasok
  rationale: Natural na katumbas ng kilos ng pagpasok sa lupain.
- source_word: לָרֶשֶׁת
  choice: angkinin
  rationale: Ipinahahayag ang pagkuha at paghawak sa lupain; mas aktibo at natural dito kaysa “manahin.”
- source_word: נָשָׂאתָ אֶת יָדְךָ
  choice: ipinangako mo nang may panunumpa
  rationale: Ipinahahayag sa natural na Tagalog ang kahulugan ng Hebreong idyoma ng pagtataas ng kamay bilang panunumpa, habang inilalagay sa talababa ang literal na larawan.
- source_word: לָתֵת לָהֶם
  choice: na ibibigay sa kanila
  rationale: Natural na Tagalog para sa infinitive phrase at malinaw ang tatanggap ng lupa.
theological_decisions:
- issue: Idyoma ng panunumpa kaugnay ng pangako ng Diyos sa lupain
  choice: ipinangako mo nang may panunumpa
  alternative: itinaas mo ang iyong kamay upang ibigay sa kanila
  rationale: Ang literal na larawan ay tunay na Hebreong pormula ng panunumpa. Sa Tagalog, ang tuwirang paglilipat nito ay maaaring mapagkamalang simpleng kilos, kaya inilalahad sa teksto ang kahulugan ng idyoma at pinananatili sa talababa ang konkretong larawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang parallelismo ng “para sa kanilang gutom / para sa kanilang uhaw,” ngunit hinati sa dalawang pangungusap upang maging madaling basahin. Ang idyoma ng panunumpa ay isinalin ayon sa kahulugan at nilinaw ang literal na anyo sa talababa.
