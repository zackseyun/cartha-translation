  yaml_path: translation/ot/nehemiah/009/031.yaml
  text: But in your abundant mercies you did not make an end of them or abandon them[a], for you are a gracious and compassionate God.
translation:
  language: tl
  text: Ngunit sa iyong saganang habag, hindi mo sila lubusang nilipol[a] ni pinabayaan man, sapagkat ikaw ay Diyos na mapagbiyaya at mahabagin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ngunit dahil sa iyong dakilang habag, hindi mo sila tuluyang inubos ni pinabayaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרַחֲמֶיךָ הָרַבִּים
  choice: Ngunit dahil sa iyong saganang habag
  rationale: 'Ginawang panalungat ang waw ayon sa daloy ng panalangin: sa kabila ng paghihimagsik ng bayan, nanaig ang habag ng Diyos. Ang “saganang habag” ay natural sa modernong Tagalog at naihahayag ang pinatinding diwa ng pangmaramihang רַחֲמִים kasama ng הָרַבִּים.'
- source_word: לֹא עֲשִׂיתָם כָּלָה
  choice: hindi mo sila tuluyang inubos
  rationale: Ang idyomang עשה כלה ay nangangahulugang lubusang tapusin, ubusin, o lipulin. Pinananatili ng “tuluyang inubos” ang diwa ng ganap na pagwawakas nang hindi tinutukoy ang isang partikular na paraan ng paglipol.
- source_word: וְלֹא עֲזַבְתָּם
  choice: ni pinabayaan
  rationale: Ang עזב ay maaaring mangahulugang iwan o pabayaan. Ang “pinabayaan” ay malinaw at kasalukuyang gamit, at ang “ni” ay natural na nag-uugnay sa dalawang sugnay na negatibo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng hindi lubusang pag-ubos at hindi pagpapabaya ng Diyos sa bayan.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang titulo ito para sa Diyos sa kontekstong ito; hindi kailangang idagdag ang ideya ng kapangyarihan na wala namang tahasang diin sa parirala.
- source_word: חַנּוּן
  choice: mapagbigay-loob
  rationale: Ipinapahayag nito ang pagiging gracious ng Diyos sa malinaw na modernong Tagalog at inihihiwalay ang kahulugan sa kasunod na “mahabagin.”
- source_word: וְרַחוּם
  choice: at mahabagin
  rationale: Ang רַחוּם ay tumutukoy sa malalim na habag. Ang “mahabagin” ay natural at pinananatili ang pagkakaiba nito sa חַנּוּן.
- source_word: אָתָּה
  choice: ikaw ay
  rationale: Ang hiwalay na panghalip ay may bahagyang diin. Ang “ikaw ay” ay maayos at marangal na anyo ng sugnay sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa katangian ng Diyos sa חַנּוּן וְרַחוּם
  choice: mapagbigay-loob at mahabagin
  alternative: mapagbiyaya at maawain
  rationale: Pinananatili nito ang pagkakaiba ng dalawang magkaugnay ngunit hindi magkaparehong katangian, nang hindi nagdaragdag ng natatanging doktrinal na pakahulugan.
- issue: Lakas ng pambungad na waw
  choice: panalungat na “Ngunit”
  alternative: payak na pang-ugnay na “At”
  rationale: Sa daloy ng kabanata, itinatambis ang saganang habag ng Diyos sa paulit-ulit na paghihimagsik ng bayan; malinaw na ipinahahayag ng “Ngunit” ang ugnayang ito.
- issue: Saklaw ng עשה כלה
  choice: tuluyang inubos
  alternative: lubusang nilipol
  rationale: Maaaring tumukoy ang idyoma sa ganap na pag-ubos o paglipol. Ang pangunahing salin ay hindi nagpapalagay ng tiyak na paraan, habang itinatala sa talababa ang mas tahasang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Iniwasan ang masyadong makaluma o eksklusibong panrelihiyong bokabularyo; pinanatili ang diin at pagtutumbas ng mga pariralang Hebreo.
