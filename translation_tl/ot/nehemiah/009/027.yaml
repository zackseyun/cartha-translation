  text: וַֽ/תִּתְּנֵ/ם֙ בְּ/יַ֣ד צָֽרֵי/הֶ֔ם וַ/יָּצֵ֖רוּ לָ/הֶ֑ם וּ/בְ/עֵ֤ת צָֽרָתָ/ם֙ יִצְעֲק֣וּ אֵלֶ֔י/ךָ וְ/אַתָּה֙ מִ/שָּׁמַ֣יִם תִּשְׁמָ֔ע וּֽ/כְ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֗ים תִּתֵּ֤ן לָ/הֶם֙ מֽוֹשִׁיעִ֔ים וְ/יוֹשִׁיע֖וּ/ם מִ/יַּ֥ד צָרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/027.yaml
  text: So you gave them into the hand of their adversaries[a], who oppressed them. But in the time of their distress they cried out to you, and you heard from heaven; and according to your abundant mercies you gave them deliverers, who saved them from the hand of their adversaries.
translation:
  language: tl
  text: Kaya ibinigay mo sila sa kamay ng kanilang mga kalaban, at inapi sila ng mga ito. Ngunit nang sila ay nasa kagipitan, sumigaw sila sa iyo. Mula sa langit ay dininig mo sila, at ayon sa sagana mong habag, binigyan mo sila ng mga tagapagsagip[a] na nagligtas sa kanila mula sa kamay ng kanilang mga kalaban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga tagapagligtas.” Ang salitang Hebreo ay mula sa pandiwang “magligtas” at tumutukoy rito sa mga taong ibinigay ng Diyos upang sagipin ang bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְּנֵם בְּיַד
  choice: ibinigay mo sila sa kamay
  rationale: Pinananatili ang konkretong idyomang Hebreo tungkol sa pagpapasailalim sa kapangyarihan ng iba; malinaw rin ito sa natural na Tagalog.
- source_word: צָרֵיהֶם
  choice: kanilang mga kalaban
  rationale: Ang “mga kalaban” ay likas at malawak na katumbas ng mga taong laban sa kanila, nang hindi ito ipinapareho agad sa kasunod na pagkilos ng pang-aapi.
- source_word: וַיָּצֵרוּ לָהֶם
  choice: inapi sila ng mga ito
  rationale: Ipinahahayag ng pandiwa ang paggipit o pagdudulot ng matinding hirap; ang “inapi” ay maikli, malinaw, at angkop sa konteksto ng pananakop.
- source_word: וּבְעֵת צָרָתָם
  choice: nang sila ay nasa kagipitan
  rationale: Natural na temporal na pahayag ito sa Tagalog at ipinakikita ang malubhang kalagayang nagtulak sa kanila na humingi ng tulong.
- source_word: יִצְעֲקוּ אֵלֶיךָ
  choice: sumigaw sila sa iyo
  rationale: Pinananatili ng “sumigaw” ang tindi at pagmamadali ng pagdaing, sa halip na gamitin ang mas neutral na “tumawag.”
- source_word: מִשָּׁמַיִם תִּשְׁמָע
  choice: Mula sa langit ay dininig mo sila
  rationale: Pinananatili ang lokasyong “mula sa langit” at ginagawang natural sa Tagalog ang makasaysayang pagkakasunod-sunod ng mga kilos.
- source_word: וּכְרַחֲמֶיךָ הָרַבִּים
  choice: ayon sa sagana mong habag
  rationale: Ang “saganang habag” ay natural na Tagalog para sa masidhi at masaganang awa na ipinahihiwatig ng pangmaramihang Hebreo at ng panuring na “marami.”
- source_word: מֹשִׁיעִים
  choice: mga tagapagsagip
  rationale: Tumutukoy ito sa mga taong ginamit ng Diyos upang iligtas ang bayan. Nililinaw ng “mga tagapagsagip” ang kanilang papel bilang mga instrumentong tao habang iniiwan sa talababa ang mas literal na “mga tagapagligtas.”
- source_word: וְיוֹשִׁיעוּם
  choice: na nagligtas sa kanila
  rationale: Ipinakikita ang malinaw na ugnayan sa mga tagapagsagip at pinananatili ang kahulugan ng ugat na ישׁע, “magligtas.”
- source_word: מִיַּד צָרֵיהֶם
  choice: mula sa kamay ng kanilang mga kalaban
  rationale: Inuulit ang naunang idyoma at bokabularyo gaya ng nasa Hebreo, kaya napapanatili ang balangkas at diin ng talata.
theological_decisions:
- issue: Ang pagtukoy sa mga taong tinatawag na מֹשִׁיעִים
  choice: mga tagapagsagip
  alternative: mga tagapagligtas
  rationale: Sa kontekstong ito, mga taong ibinigay ng Diyos upang iligtas ang bayan ang tinutukoy. Iniiwasan ng “mga tagapagsagip” ang hindi kinakailangang pagkalito sa Diyos bilang sukdulang Tagapagligtas, ngunit pinananatili sa talababa ang literal at lehitimong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga konkretong idyomang “sa kamay” at “mula sa langit,” habang ginawang natural ang daloy ng salaysay.
