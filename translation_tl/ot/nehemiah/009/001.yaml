base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/001.yaml
  text: On the twenty-fourth day of this month[a], the sons of Israel assembled with fasting, in sackcloth[b], and with dirt on them.
translation:
  language: tl
  text: Noong ikadalawampu’t apat na araw ng buwang ito, nagtipon ang mga anak ni Israel[a] habang nag-aayuno, nakasuot ng sako, at may lupa sa kanilang katawan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga Israelita”; sa literal, “ang mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ang pagsusuot ng sako at paglalagay ng lupa sa katawan ay mga tanda ng pagluluksa at pagsisisi.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ הַזֶּה
  choice: Nang ikadalawampu’t apat na araw ng buwang ito
  rationale: Ginamit ang likas na pormula ng petsa sa Filipino. Hindi na isinalin nang hiwalay ang panimulang ו bilang “at,” sapagkat sapat na ang “Nang” upang iugnay ang pangyayari sa salaysay.
- source_word: נֶאֶסְפוּ
  choice: nagtipon
  rationale: Ang Niphal ay maaaring magpahiwatig ng pasibo o kusang sama-samang pagkilos. Sa kontekstong ito, natural na ipinapahayag ng “nagtipon” na nagsama-sama ang bayan nang hindi nagpapasya kung may panlabas na nagtipon sa kanila.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pampamilyang larawan ng Hebreo. Ang “mga Israelita” ay mas maikli at natural na alternatibo ngunit hindi kasingliteral.
- source_word: בְּצוֹם
  choice: na nag-aayuno
  rationale: Malinaw at natural nitong ipinapahayag ang pag-aayuno bilang kalagayang kasabay ng kanilang pagtitipon.
- source_word: וּבְשַׂקִּים
  choice: nakadamit-sako
  rationale: Ipinahihiwatig ng pangmaramihang שַׂקִּים ang magaspang na kasuotang ginagamit sa pagluluksa o pagsisisi. Ang “nakadamit-sako” ay maikli at madaling maunawaan sa Filipino.
- source_word: וַאֲדָמָה עֲלֵיהֶם
  choice: at may lupa sa kanilang katawan
  rationale: Ang אֲדָמָה ay “lupa” o “soil,” hindi ang karaniwang salita para sa pinong “alikabok.” Hindi tinukoy ng Hebreo na sa ulo ito inilagay, kaya hindi iyon idinagdag sa salin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling basahin. Pinanatili ang “mga anak ni Israel” upang maipakita ang anyong pampamilya ng orihinal, at ginamit ang “lupa” sa halip na “alikabok” upang sundan ang tiyak na salitang Hebreo. Inilagay ang mga pananda ng talababa sa mga pariralang aktuwal nilang ipinapaliwanag.
