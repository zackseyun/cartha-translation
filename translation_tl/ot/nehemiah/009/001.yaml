  - severity: low
    issue: Medyo di-likas ang “Nang” bilang panimula ng petsa.
    rationale: Sa ganitong salaysay, mas pangkaraniwan at malinaw ang “Noong ikadalawampu’t apat na araw ng buwang ito.”
