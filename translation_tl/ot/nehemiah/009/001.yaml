  source_fidelity: 'Tumpak sa kabuuan ang salin: naipapahayag nito ang petsa, pagtitipon ng mga anak ni Israel, pag-aayuno, telang sako, at lupang nasa kanila. Hindi nito idinadagdag na sa ulo inilagay ang lupa. Gayunman, ang “nakadamit-sako” ay hindi likas at maaaring hindi agad malinaw na tumutukoy sa kasuotang sako ng pagluluksa.'
  naturalness: Ang “Noong” ay mas likas na panimula ng pangungusap sa modernong Filipino kaysa “Nang” sa ganitong pormula ng petsa. Ang “nakasuot ng sako” ay malinaw, maikli, at natural na katumbas ng “in sackcloth.”
  terminology: Ang “mga anak ni Israel” ay katanggap-tanggap at pinananatili ang pampamilyang anyo ng בני ישראל; ang talababa ay wastong nagbibigay ng “mga Israelita” bilang alternatibo. Ang “lupa” ay angkop para sa אֲדָמָה at hindi ipinagpapalit sa mas tiyak na “alikabok.”
