    issue: Hindi inuulit ang ‘laban sa’ para sa mga lingkod at mamamayan ni Faraon.
    rationale: Ang ב ay inuulit sa Hebreo sa bawat isa sa tatlong pangkat. Bagaman maaaring maunawaan ang draft, ang pag-uulit ay nagpapalinaw na ang mga tanda ay laban din sa lahat ng mga pangkat na ito.
  - severity: low
