  source_fidelity: 'Ang salin ay tapat sa pangkalahatang kahulugan ng Hebreo: mga tanda at kababalaghan, ang saklaw na Faraon–mga lingkod–mamamayan, ang mapangahas na pagkilos laban sa hindi pinangalanang ‘kanila,’ at ang namamalaging katanyagan ng pangalan ng Diyos. Gayunman, ang magkakatugmang pang-ukol na ב sa tatlong layon ay mas malinaw na maipapakita sa pag-uulit ng ‘laban sa.’'
  naturalness: Makabago at marangal ang rehistro. Mas natural at mas malinaw ang ‘lahat ng mamamayan ng kanyang lupain’ kaysa ‘buong bayan ng kanyang lupain’ sa kontekstong ito. Ang ‘ginawa mong tanyag ang iyong pangalan’ ay idiomatikong Filipino at mas tuwirang ipinahahayag ang aktibong Hebreong idyoma.
  terminology: Ang ‘Faraon,’ ‘mga tanda at kababalaghan,’ at ‘kapalaluan’ ay angkop. Pinanatili ang mga panghalip na ‘sila’ at ‘kanila’ upang hindi lutasin nang lampas sa teksto ang reperente ng Hebreo. Nananatiling nakatali ang talababa sa salitang isinaling ‘kapalaluan.’
  issues:
