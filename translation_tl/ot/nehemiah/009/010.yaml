base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/010.yaml
  text: You performed signs and wonders against Pharaoh[a], against all his servants, and against all the people of his land, for you knew that they acted presumptuously against them. So you made a name for yourself, as it is to this day.
translation:
  language: tl
  text: Nagpakita ka ng mga tanda at kababalaghan laban sa Faraon, laban sa lahat ng kanyang mga lingkod, at laban sa lahat ng mamamayan ng kanyang lupain, sapagkat alam mong kumilos sila nang may kapalaluan[a] laban sa kanila. Kaya ginawa mong tanyag ang iyong pangalan, at gayon pa rin hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘kumilos sila nang may kayabangan’ o ‘naging mapangahas sila.’ Ang pandiwang Hebreo ay maaaring tumukoy sa pagkilos nang palalo, walang-galang, o pangahas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Nagpakita ka
  rationale: Literal itong ‘nagbigay ka,’ ngunit kasama ng ‘mga tanda at kababalaghan,’ likas sa Tagalog ang ‘nagpakita ka’ at malinaw nitong ipinahahayag ang pagsasagawa ng Diyos.
- source_word: אֹתֹת וּמֹפְתִים
  choice: mga tanda at kababalaghan
  rationale: 'Pinananatili ang nakagawiang tambalang pananalita: ang mga gawa ay kapuwa may kahulugang tanda at nakapanggigilalas na pangyayari.'
- source_word: בְּפַרְעֹה
  choice: laban sa Faraon
  rationale: Sa konteksto, ang pang-ukol ay nagpapahiwatig na ang mga tanda ay inilapat bilang hatol laban sa Faraon.
- source_word: וּבְכָל עֲבָדָיו
  choice: sa lahat ng kanyang mga lingkod
  rationale: Malawak ang saklaw ng עֲבָדִים at maaaring tumukoy sa mga lingkod o opisyal; hindi labis na tinutukoy ng ‘mga lingkod’ ang kanilang ranggo.
- source_word: וּבְכָל עַם אַרְצוֹ
  choice: sa buong bayan ng kanyang lupain
  rationale: Pinananatili ang kolektibong ‘bayan’ at ang tuwirang ugnayang paari ng Hebreo.
- source_word: הֵזִידוּ
  choice: kumilos sila nang may kapalaluan
  rationale: Ipinahahayag nito ang mapagmataas, walang-pakundangang pagkilos ng Hiphil ng זוּד nang hindi nililimitahan ang diwa sa iisang Filipino na termino.
- source_word: עֲלֵיהֶם
  choice: laban sa kanila
  rationale: Pinananatili ang panghalip at ang mapanlabang diwa, sa halip na tahasang palitan ito ng ‘iyong bayan.’
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: Kaya naging tanyag ang iyong pangalan
  rationale: Natural na Filipino para sa idyomang ‘gumawa ka ng pangalan para sa iyong sarili’; ipinahahayag nito ang pagtatamo ng pagkilala nang hindi gumagamit ng pilit na hulma.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: at gayon pa rin hanggang sa araw na ito
  rationale: Malinaw na ipinahahayag ang nagpapatuloy na bunga hanggang sa kasalukuyan ng nagsasalita.
theological_decisions:
- issue: Ang tinutukoy ng ‘sila’ at ‘kanila’
  choice: Ang Faraon at mga Ehipsiyo ang kumilos nang may kapalaluan laban sa Israel, ngunit pinanatili sa teksto ang mga panghalip.
  alternative: Tahasang isalin na ‘kumilos ang mga Ehipsiyo nang may kapalaluan laban sa iyong bayan,’ o unawain ang kapalaluan bilang laban sa Diyos.
  rationale: Sa alaala ng Exodo, Israel ang pinakamalamang na tinutukoy ng ‘kanila.’ Gayunman, hindi pinapangalanan ng Hebreo ang reperente rito, kaya pinananatili ng salin ang likas na kalabuan ng mga panghalip.
- issue: Ang idyomang ‘gumawa ng pangalan para sa sarili’
  choice: Kaya naging tanyag ang iyong pangalan.
  alternative: Kaya gumawa ka ng pangalan para sa iyong sarili.
  rationale: Ang piniling anyo ay likas sa makabagong Tagalog at naghahatid ng diwang nagtatag ang Diyos ng namamalaging pagkakilala sa kanyang pangalan, nang hindi nagmumungkahi ng makataong pagmamapuri.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Faraon,’ ‘mga tanda at kababalaghan,’ at ‘hanggang sa araw na ito’ bilang pamilyar ngunit hindi lipas na pananalitang biblikal. Inilagay ang talababa sa pariralang aktuwal nitong ipinaliliwanag.
