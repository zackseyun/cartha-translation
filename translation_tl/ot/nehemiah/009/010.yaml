    rationale: Ang ‘lahat ng mamamayan ng kanyang lupain’ ay mas tuwirang sumasalamin sa ‘all the people of his land’ at natural sa modernong Filipino.
  - severity: low
    issue: ‘Naging tanyag ang iyong pangalan’ ay nagpapahina sa aktibong pandiwang ‘gumawa ka’ sa Hebreo.
    rationale: Ang ‘ginawa mong tanyag ang iyong pangalan’ ay nananatiling natural habang mas malinaw na inilalahad na ang Diyos ang gumawa upang maging tanyag ang kanyang pangalan.
  revised_text: Nagpakita ka ng mga tanda at kababalaghan laban sa Faraon, laban sa lahat ng kanyang mga lingkod, at laban sa lahat ng mamamayan ng kanyang lupain, sapagkat alam mong kumilos sila nang may kapalaluan[a] laban sa kanila. Kaya ginawa mong tanyag ang iyong pangalan, at gayon pa rin hanggang sa araw na ito.
