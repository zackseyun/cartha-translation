revisions:
- from: Nagpakita ka ng mga tanda at kababalaghan laban sa Faraon, sa lahat ng kanyang mga lingkod, at sa buong bayan ng kanyang lupain, sapagkat alam mong kumilos sila nang may kapalaluan[a] laban sa kanila. Kaya naging tanyag ang iyong pangalan, at gayon pa rin hanggang sa araw na ito.
  to: Nagpakita ka ng mga tanda at kababalaghan laban sa Faraon, laban sa lahat ng kanyang mga lingkod, at laban sa lahat ng mamamayan ng kanyang lupain, sapagkat alam mong kumilos sila nang may kapalaluan[a] laban sa kanila. Kaya ginawa mong tanyag ang iyong pangalan, at gayon pa rin hanggang sa araw na ito.
  rationale: Inulit ang ‘laban sa’ upang maipakita ang istruktura at adversatibong puwersa ng Hebreo para sa bawat pangkat. Pinalitan ang ‘buong bayan’ ng ‘lahat ng mamamayan’ para sa mas eksaktong saklaw. Inayos ang huling sugnay upang ipahayag ang aktibong pagkilos ng Diyos sa idyomang ‘gumawa ng pangalan para sa sarili,’ nang hindi pinipilit ang literal na hulma. Walang binagong kahulugan at pinanatili ang kalabuan ng mga panghalip.
