base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/020.yaml
  text: You gave your good Spirit to instruct them[a], and you did not withhold your manna from their mouth, and you gave them water for their thirst.
translation:
  language: tl
  text: Ibinigay mo ang iyong mabuting Espiritu upang bigyan sila ng pagkaunawa[a]. Hindi mo ipinagkait ang iyong manna mula sa kanilang mga bibig, at binigyan mo sila ng tubig para sa kanilang uhaw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iyong mabuting espiritu.” Maaaring isalin sa alinman sa dalawa ang Hebreong רוּחַ; dito, malamang na tumutukoy ito sa Espiritu ng Diyos na ibinigay upang gabayan at turuan ang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחֲךָ הַטּוֹבָה
  choice: iyong mabuting Espiritu
  rationale: Maaaring mangahulugan ang רוּחַ ng espiritu, hangin, o hininga. Sa konteksto ng paggabay at pagbibigay-unawa ng Diyos, malamang na tumutukoy ito sa Espiritu ng Diyos; pinananatili rin nang tuwiran ang pang-uring 'mabuti.'
- source_word: לְהַשְׂכִּילָם
  choice: upang bigyan sila ng pagkaunawa
  rationale: Ang Hiphil ng שׂכל ay nagpapahayag ng pagsasanhi na makaunawa o magkaroon ng kabatiran. Likas sa modernong Tagalog ang pariralang ito at napapanatili ang causative na diwa.
- source_word: מַנְךָ
  choice: iyong manna
  rationale: Tumutukoy ito sa natatanging pagkaing ipinagkaloob sa ilang; malinaw at nakaugaliang salin ang 'manna.'
- source_word: מָנַעְתָּ מִפִּיהֶם
  choice: Hindi mo ipinagkait sa kanilang bibig
  rationale: Ang מנע ay 'ipagkait' o 'pigilan.' Pinananatili ang kongkretong Hebreong larawan na 'mula sa kanilang bibig' sa likas na anyong Tagalog.
- source_word: מַיִם
  choice: tubig
  rationale: Tuwirang katumbas sa Tagalog.
- source_word: לִצְמָאָם
  choice: para sa kanilang pagkauhaw
  rationale: Ipinahahayag nito na ang tubig ay ipinagkaloob upang tugunan ang kanilang uhaw; natural ito sa modernong Tagalog.
theological_decisions:
- issue: Kung ang רוּחֲךָ הַטּוֹבָה ay dapat unawaing tumutukoy sa Espiritu ng Diyos
  choice: iyong mabuting Espiritu
  alternative: iyong mabuting espiritu
  rationale: Ang konteksto ay tungkol sa presensiya ng Diyos na ibinigay upang akayin at bigyan ng pagkaunawa ang Israel, kaya malamang na Espiritu ng Diyos ang tinutukoy. Gayunman, walang pagkakaiba ng malaking titik at maliit na titik sa Hebreo, kaya pinananatili sa talababa ang tunay na posibilidad ng pangkalahatang pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang konkretong larawang 'sa kanilang bibig' at ang teolohikal na kalabuan ng רוּחַ sa pamamagitan ng talababa.
