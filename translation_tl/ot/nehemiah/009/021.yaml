base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/021.yaml
  text: For forty years you sustained them in the wilderness[a]; they lacked nothing. Their clothes did not wear out[b], and their feet did not swell.
translation:
  language: tl
  text: Sa loob ng apatnapung taon, itinaguyod mo sila sa ilang; hindi sila nagkulang ng anuman. Hindi naluma ang kanilang mga damit, at hindi namaga ang kanilang mga paa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּלְכַּלְתָּם
  choice: itinaguyod mo sila
  rationale: Ipinahahayag ng pandiwa ang patuloy na paglalaan at pagsuporta ng Diyos sa kanila, hindi lamang ang pagpapakain.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay natural at dignified na salin para sa ilang o tigang na lupa na pinaglagalag ng Israel.
- source_word: לֹא חָסֵרוּ
  choice: hindi sila nagkulang ng anuman
  rationale: Malinaw nitong ipinahahayag ang ganap na kasapatan ng paglalaan sa kanila.
- source_word: שַׂלְמֹתֵיהֶם
  choice: kanilang mga damit
  rationale: Ang “mga damit” ay malinaw at makabagong panumbas sa pangkalahatang katawagan para sa mga kasuutan.
- source_word: לֹא בָלוּ
  choice: hindi naluma
  rationale: Natural itong paglalarawan sa mga damit na hindi nasira o naupod dahil sa matagal na paggamit.
- source_word: וְרַגְלֵיהֶם לֹא בָצֵקוּ
  choice: at hindi namaga ang kanilang mga paa
  rationale: Tuwirang pinananatili nito ang pisikal na kahulugan ng pandiwang tumutukoy sa pamamaga.
- source_word: וְאַרְבָּעִים שָׁנָה
  choice: Sa loob ng apatnapung taon
  rationale: Natural na panandang temporal ito sa Filipino at ipinahahayag ang buong tagal ng patuloy na pagtaguyod.
