  text: You saw the affliction of our fathers in Egypt[a], and you heard their cry at the Red Sea.
translation:
  language: tl
  text: Nakita mo ang paghihirap ng aming mga ninuno sa Ehipto, at dininig mo ang kanilang pagdaing sa Dagat na Pula.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Dagat ng mga Tambo.” Kinagisnang isalin na “Dagat na Pula.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Nakita mo
  rationale: Tuwirang ipinahahayag ng ראה ang pagkakita ng Diyos sa kalagayan ng Israel, na sa konteksto ay nagpapahiwatig din ng pagkilala at malasakit nang hindi iyon idinaragdag sa teksto.
- source_word: עֳנִי
  choice: paghihirap
  rationale: Likas at malinaw na salitang Filipino para sa pagdurusa o kaapihang naranasan sa Ehipto, nang hindi labis na tinutukoy ang sanhi.
- source_word: אֲבֹתֵינוּ
  choice: aming mga ninuno
  rationale: Sa konteksto, tumutukoy ito sa mga naunang salinlahi ng sambayanan. Ang 'mga ninuno' ang natural at dignified na modernong Tagalog, bagaman literal na panlalaki ang anyong Hebreo.
- source_word: בְּמִצְרָיִם
  choice: sa Ehipto
  rationale: Tuwirang lokatibong salin.
- source_word: זַעֲקָתָם
  choice: kanilang pagdaing
  rationale: Ang זעקה ay isang sigaw o daing dahil sa matinding pangangailangan; ipinahahayag ng 'pagdaing' ang bigat at paghingi ng tulong sa natural na Filipino.
- source_word: שָׁמַעְתָּ
  choice: dininig mo
  rationale: 'Higit sa simpleng pandinig ang ipinahihiwatig sa konteksto: pinakinggan ng Diyos ang kanilang daing. Ang ''dininig'' ay natural sa panalangin at hindi tahasang nagdaragdag na kumilos na siya.'
- source_word: עַל
  choice: sa
  rationale: Sa pariralang may pook, ipinakikita ng עַל ang kinaroroonan ng pangyayari, kaya natural ang 'sa' sa Filipino.
- source_word: יַם סוּף
  choice: Dagat na Pula
  rationale: Ito ang kinagisnang heograpikong tawag sa Filipino at madaling makilala ng mga mambabasa; inilalagay sa talababa ang mas literal na 'Dagat ng mga Tambo.'
