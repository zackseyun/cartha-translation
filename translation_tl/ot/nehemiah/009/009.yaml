  source_fidelity: 'Tapat ang salin sa Hebreo: pinananatili nito ang tuwirang pagtukoy sa Diyos sa ikalawang panauhan, ang pagtingin niya sa paghihirap ng bayan sa Ehipto, at ang pagdinig niya sa kanilang daing sa Dagat na Pula. Ang “mga ninuno” ay likas na modernong Filipino para sa kolektibong pagtukoy sa mga naunang salinlahi at angkop sa kontekstong ito, bagaman ang Hebreo ay literal na “aming mga ama.”'
