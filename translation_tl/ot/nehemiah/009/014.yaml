base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/014.yaml
  text: You made your holy Sabbath known to them[b][a], and you commanded them commandments and statutes and a law by the hand of Moses your servant.
translation:
  language: tl
  text: Ipinaalam mo sa kanila ang iyong banal na Sabbath, at iniatas mo sa kanila ang mga utos, mga tuntunin, at kautusan[a] sa pamamagitan ni Moises na iyong lingkod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagubilin” para sa “kautusan” (תוֹרָה), na nagbibigay-diin sa pagtuturo gayundin sa legal na pananagutan.
    reason: lexical_alternative
  - marker: b
    text: Literal, “sa pamamagitan ng kamay ni Moises na iyong lingkod,” isang idyomang nangangahulugang “sa pamamagitan ni Moises na iyong lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת קָדְשְׁךָ
  choice: iyong banal na Sabbath
  rationale: Pinananatili ng “Sabbath” ang tiyak na kahulugang tipanan at pangsamba ng שַׁבָּת, samantalang natural na ipinahahayag ng “banal” ang attributibong gamit ng קָדְשְׁךָ.
- source_word: הוֹדַעַתָ
  choice: Ipinaalam mo
  rationale: Tumpak at natural na ipinapahayag ng causative na “ipinaalam” ang Hiphil na ‘ginawang malaman.’
- source_word: מִצְוֹת
  choice: mga utos
  rationale: Karaniwang salin ito para sa mga ipinag-uutos at pinananatili ang legal at tipanang himig.
- source_word: חֻקִּים
  choice: mga tuntunin
  rationale: Ipinahahayag nito ang mga itinakdang alituntunin o batas nang hindi ito ipinagkakapareho sa naunang מִצְוֹת.
- source_word: תוֹרָה
  choice: kautusan
  rationale: Sa hanay ng mga terminong legal, “kautusan” ang pinakamalakas na kahulugan sa konteksto, habang itinatala sa talababa ang mas malawak na diwang ‘tagubilin.’
- source_word: צִוִּיתָ
  choice: iniutos mo sa kanila
  rationale: Pinananatili nito ang tuwirang puwersa ng pandiwang צוה at hindi ito pinahihinang maging ‘ibinigay.’
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: sa pamamagitan ni Moises na iyong lingkod
  rationale: Natural na Filipino ito para sa Hebreong idyoma ng ahensiya na literal na ‘sa pamamagitan ng kamay ni Moises.’
theological_decisions:
- issue: Pagpapahayag sa legal na tatluhan na מִצְוֹת וְחֻקִּים וְתוֹרָה
  choice: mga utos, mga tuntunin, at kautusan
  alternative: mga utos, mga batas, at tagubilin
  rationale: Pinananatiling magkakahiwalay ang tatlong katawagang legal at ang diin sa pahayag at pag-uutos ng Diyos sa pamamagitan ni Moises, nang hindi ipinapalagay na lubos na magkasingkahulugan ang mga ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “Sabbath” bilang kinikilalang tiyak na katawagang biblikal, at ginawang natural ang Hebreong idyoma ng ahensiya sa pangunahing teksto.
