  text: וַ/יְמָאֲנ֣וּ לִ/שְׁמֹ֗עַ וְ/לֹא זָכְר֤וּ נִפְלְאֹתֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ עִמָּ/הֶ֔ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וַ/יִּתְּנוּ רֹ֛אשׁ לָ/שׁ֥וּב לְ/עַבְדֻתָ֖/ם בְּ/מִרְיָ֑/ם וְ/אַתָּה֩ אֱל֨וֹהַּ סְלִיח֜וֹת חַנּ֧וּן וְ/רַח֛וּם אֶֽרֶךְ אַפַּ֥יִם וְ/רַב ו/חסד וְ/לֹ֥א עֲזַבְתָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/017.yaml
  text: But they refused to listen and did not remember your wonders that you had done among them. They stiffened their necks and, in their rebellion, appointed a leader to return to their slavery. But you are a forgiving God[a], gracious and compassionate, slow to anger and abundant in steadfast love, and you did not forsake them.
translation:
  language: tl
  text: Ngunit tumanggi silang makinig at hindi nila inalala ang mga kamangha-manghang bagay na ginawa mo sa gitna nila. Nagmatigas sila at, sa kanilang paghihimagsik, nagtalaga sila ng isang pinuno upang bumalik sa pagkaalipin nila. Ngunit ikaw ay Diyos na mapagpatawad[a], mapagbigay-loob at mahabagin, hindi madaling magalit at sagana sa tapat na pag-ibig, at hindi mo sila pinabayaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Diyos ng mga kapatawaran.” Ang maramihang anyo sa Hebreo ay nagbibigay-diin sa sagana niyang pagpapatawad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ לִשְׁמֹעַ
  choice: tumanggi silang makinig
  rationale: Tuwirang ipinahahayag ang kusang pagtanggi; pinananatili ng “makinig” ang anyo ng Hebreo habang ipinahihiwatig ng konteksto ang pagsuway.
- source_word: נִפְלְאֹתֶיךָ
  choice: ang mga kamangha-manghang bagay
  rationale: Natural sa modernong Filipino at tumutukoy sa pambihirang mga gawa ng Diyos na pumupukaw ng paghanga.
- source_word: עָשִׂיתָ עִמָּהֶם
  choice: na ginawa mo sa gitna nila
  rationale: Ang עִם ay maaaring mangahulugang “kasama” o “sa gitna”; ang parirala ay angkop sa sama-samang karanasan ng Israel sa mga gawa ng Diyos.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: nagmatigas sila
  rationale: Inihahatid nito ang kahulugan ng idyomang Hebreo—matigas na pagtutol—nang hindi gumagamit ng di-natural na literal na larawan sa Filipino.
- source_word: וַיִּתְּנוּ רֹאשׁ
  choice: nagtalaga sila ng isang pinuno
  rationale: Ang literal na “naglagay/nagbigay ng ulo” ay idyoma para sa paghirang ng mamumuno.
- source_word: לָשׁוּב לְעַבְדֻתָם
  choice: upang bumalik sa pagkaalipin nila
  rationale: Malinaw na ipinapahayag ang pagbabalik sa kalagayan ng sapilitang paglilingkod sa konteksto ng Exodo.
- source_word: בְּמִרְיָם
  choice: sa kanilang paghihimagsik
  rationale: Pinananatili ang pangyayaring kalagayan ng pagtatalaga nila ng pinuno, nang hindi nililimitahan kung ito ay paraan o dahilan.
- source_word: אֱלוֹהַּ סְלִיחוֹת
  choice: Diyos na mapagpatawad
  rationale: Natural na inilalarawan sa Filipino ang sagana at palagiang pagpapatawad ng Diyos; ipinaliliwanag sa talababa ang masinsing anyong maramihan sa Hebreo.
- source_word: חַנּוּן וְרַחוּם
  choice: mapagbigay-loob at mahabagin
  rationale: Pinag-iiba ang kusang pagbibigay ng kagandahang-loob at ang mahabaging pagkalinga.
- source_word: אֶרֶךְ אַפַּיִם
  choice: hindi madaling magalit
  rationale: Karaniwan at malinaw na katumbas sa Filipino ng idyomang “mahaba ang mga butas ng ilong,” na nangangahulugang mabagal magalit.
- source_word: רַב־חֶסֶד
  choice: sagana sa tapat na pag-ibig
  rationale: Pinananatili ang kasaganaan, katapatan, at relasyonal na pag-ibig na saklaw ng חֶסֶד nang hindi ito ikinukulong sa isang sistematikong pakahulugan.
- source_word: וְלֹא עֲזַבְתָּם
  choice: at hindi mo sila pinabayaan
  rationale: Natural at marangal na Filipino para sa hindi pag-iwan o pagtalikod sa kanila.
theological_decisions:
- issue: Paglalarawan sa Diyos bilang אֱלוֹהַּ סְלִיחוֹת
  choice: Diyos na mapagpatawad
  alternative: Diyos ng mga kapatawaran
  rationale: Ang piniling anyo ay natural sa Filipino at ipinahahayag ang saganang pagpapatawad bilang katangian ng Diyos; pinananatili sa talababa ang diin ng maramihang anyo sa Hebreo.
- issue: Paglilipat ng חֶסֶד sa pormulang naglalarawan sa Diyos
  choice: tapat na pag-ibig
  alternative: matapat na kagandahang-loob
  rationale: Pinananatili nito kapwa ang pag-ibig at matibay na katapatan ng salita, nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Ugnayan ng בְּמִרְיָם sa pagtatalaga ng pinuno
  choice: at, sa kanilang paghihimagsik, nagtalaga sila ng isang pinuno
  alternative: dahil sa kanilang paghihimagsik, nagtalaga sila ng isang pinuno
  rationale: Ang “sa” ay nagpapanatili sa circumstantial na lawak ng Hebreo at hindi tahasang nagpapasya na sanhi lamang ang paghihimagsik.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nagmatigas” bilang natural na katumbas ng idyomang tungkol sa matigas na leeg, at iniwasan ang sobrang literal ngunit alanganing mga parirala. Ang mga salitang naglalarawan sa Diyos ay pinanatiling magkakaiba ang diwa at hindi pinasan ng denominasyonal na terminolohiya.
