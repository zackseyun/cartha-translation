base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/002.yaml
  text: Then the offspring of Israel separated themselves from all foreigners[b][a], and they stood and confessed their sins and the iniquities of their fathers.
translation:
  language: tl
  text: At humiwalay ang mga inapo ni Israel sa lahat ng dayuhan, at tumayo sila at ipinagtapat ang kanilang mga kasalanan at ang mga kasamaan ng kanilang mga ninuno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “ang mga kasamaan ng kanilang mga ama.” Maaaring tumukoy ito sa mga maling gawa ng kanilang mga ninuno na kinilala nila sa sama-samang pagkumpisal.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבָּדְלוּ
  choice: humiwalay
  rationale: Ang Niphal ng בדל ay maaaring reflexive o passive; sa kontekstong ito, likas na ipinahihiwatig ng “humiwalay” ang kusang paghiwalay ng pangkat nang hindi labis na tinutukoy ang paraan.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: ang mga inapo ni Israel
  rationale: Literal na “binhi ni Israel,” ngunit ang kolektibong kahulugang genealogical ay malinaw at natural na naihahatid ng “mga inapo.”
- source_word: מִכֹּל בְּנֵי נֵכָר
  choice: sa lahat ng dayuhan
  rationale: Ang בְּנֵי נֵכָר ay idyoma para sa mga taong banyaga o mula sa ibang bayan, hindi lamang mga lalaking anak; “mga dayuhan” ang maikli at likas na katumbas.
- source_word: וַיַּעַמְדוּ
  choice: Tumayo sila
  rationale: Tuwirang pinananatili ang pisikal na tindig na kaakibat ng pagpapahayag ng kasalanan.
- source_word: וַיִּתְוַדּוּ
  choice: ipinahayag
  rationale: Sa Hitpael, ang ידה rito ay nangangahulugang umamin o magpahayag ng kasalanan. Ang “ipinahayag ang kanilang mga kasalanan” ay malinaw, dignified, at natural sa modernong Filipino.
- source_word: חַטֹּאתֵיהֶם
  choice: kanilang mga kasalanan
  rationale: Ang חטאת sa maramihan ay tuwirang tumutukoy sa mga kasalanan.
- source_word: עֲוֺנוֹת אֲבֹתֵיהֶם
  choice: mga kasamaan ng kanilang mga ninuno
  rationale: Maaaring tumukoy ang עון sa kasamaan, pagkakasala, o pananagutan. Pinananatili ng “kasamaan” ang kaibhan nito sa חטאת, samantalang mas angkop ang “mga ninuno” kaysa literal na “mga ama” para sa ancestral na saklaw.
theological_decisions:
- issue: Sama-samang pagpapahayag ng kasamaan ng mga ninuno
  choice: Ipinahayag ng bayan kapwa ang sarili nilang mga kasalanan at ang mga kasamaan ng kanilang mga ninuno.
  alternative: Maaaring unawain ang parirala bilang pagkilala lamang sa bunga o pananagutan ng kasalanan ng kanilang mga ninuno.
  rationale: Pinag-uugnay ng sintaks ang dalawang bagay sa ilalim ng iisang pandiwang “ipinahayag.” Pinananatili nito ang sama-samang pagkilala sa ancestral na pagsuway nang hindi ipinapasya na minana nila ang personal na pagkakasala ng kanilang mga ninuno.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga inapo” at “mga ninuno” upang natural na ipahayag ang kolektibo at genealogical na diwa ng Hebreo; iniwasan ang labis na teknikal o denominasyonal na pananalita.
