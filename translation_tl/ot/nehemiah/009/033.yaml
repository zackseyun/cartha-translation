  text: Yet you are righteous in all that has come upon us[a], for you have acted faithfully, but we have acted wickedly.
translation:
  language: tl
  text: Ngunit ikaw ay matuwid sa lahat ng sumapit sa amin, sapagkat kumilos ka nang tapat, ngunit kami ay kumilos nang masama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ginawa mo ang katotohanan,” ibig sabihin, “kumilos ka nang may katapatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Ngunit ikaw
  rationale: Ipinahahayag ng pangatnig at tahasang panghalip ang pagsalungat sa kasamaan ng Israel; likas itong naipapakita ng “Ngunit ikaw.”
- source_word: צַדִּיק
  choice: matuwid
  rationale: Pinananatili ng “matuwid” ang moral at teolohikal na bigat ng salita tungkol sa Diyos, nang hindi ito nililimitahan sa makitid na diwa ng legal na katarungan.
- source_word: עַל כָּל הַ/בָּא עָלֵי/נוּ
  choice: sa lahat ng nangyari sa amin
  rationale: Likas sa makabagong Tagalog at ipinahahayag ang kaugnayan ng pagiging matuwid ng Diyos sa lahat ng sinapit ng bayan.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan ng naunang pahayag tungkol sa pagiging matuwid ng Diyos.
- source_word: אֱמֶת עָשִׂיתָ
  choice: kumilos ka nang tapat
  rationale: Sa pagsasamang ito, ang אֱמֶת ay tumutukoy sa katapatan o pagiging mapagkakatiwalaan ng pagkilos; natural itong maipahayag sa Tagalog bilang “kumilos nang tapat.”
- source_word: וַ/אֲנַחְנוּ
  choice: ngunit kami
  rationale: Ginagawang malinaw ang kontekstuwal na pagsalungat ng kilos ng bayan sa tapat na kilos ng Diyos.
- source_word: הִרְשָׁעְנוּ
  choice: kumilos nang masama
  rationale: Ipinapahayag ang aktibong paggawa ng kasamaan at pinananatili ang paralelismo sa “kumilos ka nang tapat.”
theological_decisions:
- issue: Ang pagiging matuwid ng Diyos kaugnay ng mga kapahamakang sinapit ng Israel
  choice: Ipinahahayag na matuwid ang Diyos sa lahat ng nangyari sa bayan, habang inihahambing ang kanyang katapatan sa kanilang kasamaan.
  alternative: “Matuwid ka sa pagpaparusa sa amin” o “Tama ka tungkol sa lahat ng nangyari sa amin.”
  rationale: Hindi tahasang tinutukoy ng Hebreo ang mekanismo ng pagpaparusa. Pinananatili ng salin ang pag-amin sa pagiging matuwid ng Diyos at pananagutan ng bayan nang hindi dinaragdagan o pinapahina ang pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “matuwid” upang mapanatili ang teolohikal na bigat, at ang magkatimbang na “kumilos ka nang tapat” / “kumilos nang masama” upang maipakita ang contrast ng Hebreo.
