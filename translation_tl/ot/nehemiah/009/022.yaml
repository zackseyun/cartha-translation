revisions:
- from: Ibinigay mo sa kanila ang mga kaharian at mga bayan, at ibinahagi mo ang mga iyon sa bawat dako. Kaya inangkin nila ang lupain ni Sihon—ang lupain ng hari ng Hesbon—at ang lupain ni Og na hari ng Basan.
  to: Ibinigay mo sa kanila ang mga kaharian at mga bayan, at hinati-hati mo sila sa mga bahagi. Kaya naging pag-aari nila ang lupain ni Sihon—ang lupain ng hari ng Hesbon—at ang lupain ni Og na hari ng Basan.
  rationale: Pinalitan ang pagpapahayag ng pamamahagi upang maingatan ang mahirap at marahil ay idiomatikong לְפֵאָה nang walang pagpapalawak na “bawat dako.” Pinalitan din ang “inangkin” ng katumbas na tahasang nagpapahayag ng pagtatamo ng lupain. Iniwan ang magkadugtong na parirala tungkol kay Sihon at sa hari ng Hesbon sa pamamagitan ng mga gitling, upang hindi piliting lutasin sa salin ang appositional na ugnayang ipinahihiwatig ng Hebreo.
