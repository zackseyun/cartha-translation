base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/022.yaml
  text: You gave them kingdoms and peoples, and allotted them to every corner. So they took possession of the land of Sihon, that is, the land of the king of Heshbon, and the land of Og king of Bashan.
translation:
  language: tl
  text: Ibinigay mo sa kanila ang mga kaharian at mga bayan, at hinati-hati mo sila sa mga bahagi. Kaya naging pag-aari nila ang lupain ni Sihon—ang lupain ng hari ng Hesbon—at ang lupain ni Og na hari ng Basan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַמְלָכוֹת וַעֲמָמִים
  choice: mga kaharian at mga bayan
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit magkaibang bagay: ang mga kahariang pampolitika at ang mga bayang nasasakupan.'
- source_word: וַתַּחְלְקֵם לְפֵאָה
  choice: ibinahagi mo ang mga iyon sa bawat dako
  rationale: Ang לְפֵאָה ay literal na tumutukoy sa gilid o sulok at dito ay malamang na nagpapahayag ng pamamahagi sa iba't ibang dako. Ang 'sa bawat dako' ay natural sa Filipino habang pinananatili ang diwa ng Hebreo.
- source_word: וַיִּירְשׁוּ
  choice: inangkin nila
  rationale: Sa konteksto ng lupain, ipinahihiwatig ng pandiwa ang pagkuha at pagtataglay bilang pag-aari; maikli at natural ang 'inangkin'.
- source_word: אֶרֶץ סִיחוֹן ... אֶרֶץ מֶלֶךְ חֶשְׁבּוֹן
  choice: ang lupain ni Sihon—ang lupain ng hari ng Hesbon—
  rationale: Pinananatili ang magkakasunod na parirala ng tekstong Masoretiko nang hindi ipinipilit kung ang ikalawa ay tahasang pagpapaliwanag o apposisyon.
theological_decisions:
- issue: Ugnayan ng 'lupain ni Sihon' at 'lupain ng hari ng Hesbon'
  choice: Ginamit ang mga gitling upang ipakitang magkaugnay o appositional ang mga parirala nang hindi nagdaragdag ng 'samakatuwid.'
  alternative: ang lupain ni Sihon, samakatuwid ay ang lupain ng hari ng Hesbon
  rationale: Walang katumbas na salitang Hebreo para sa 'samakatuwid'; ang bantas ay nagpapanatili ng tunay na sintaktikong pag-igting at hindi labis na nagpapaliwanag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang tradisyonal at karaniwang anyong Filipino ng mga pangalang Hesbon at Basan; pinanatili ang tuwirang pakikipag-usap sa Diyos sa panghalip na 'mo'.
