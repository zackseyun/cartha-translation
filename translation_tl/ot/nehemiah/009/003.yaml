id: NEH.9.3
reference: Nehemiah 9:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּק֨וּמוּ֙ עַל עָמְדָ֔/ם וַֽ/יִּקְרְא֗וּ בְּ/סֵ֨פֶר תּוֹרַ֧ת יְהוָ֛ה אֱלֹהֵי/הֶ֖ם רְבִעִ֣ית הַ/יּ֑וֹם וּ/רְבִעִית֙ מִתְוַדִּ֣ים וּ/מִֽשְׁתַּחֲוִ֔ים לַ/יהוָ֖ה אֱלֹהֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/003.yaml
  text: And they stood in their place[a], and they read from the Book of the Law of Yahweh their God for a fourth of the day[b]; and for another fourth they were confessing and bowing down to Yahweh their God.
translation:
  language: tl
  text: Tumayo sila sa kani-kanilang puwesto[a] at bumasa mula sa Aklat ng Kautusan ni Yahweh na kanilang Diyos sa loob ng sangkapat ng araw.[b] Sa isa pang sangkapat ng araw, nagtapat sila at yumukod kay Yahweh na kanilang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa lugar na kanilang tinatayuan,” o marahil ay “sa kanilang plataporma.” Siksik at bahagyang hindi tiyak ang pariralang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sangkapat ng araw ... at sangkapat.” Isang sangkapat ng araw ang ginugol nila sa pagbabasa, at isa pang sangkapat sa pagtatapat at pagyukod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֨וּמוּ עַל עָמְדָם
  choice: Tumayo sila sa kani-kanilang puwesto
  rationale: Ipinahahayag ng קום ang pagtayo, habang ang siksik na pariralang עַל עָמְדָם ay natural na maisasalin bilang kinaroroonan o puwestong tinatayuan nila. Hindi tinutukoy sa pangunahing teksto na may entabladong pisikal.
- source_word: וַיִּקְרְאוּ בְּסֵפֶר תּוֹרַת
  choice: bumasa mula sa Aklat ng Kautusan
  rationale: Kapag may kasamang סֵפֶר, ang קרא ay tumutukoy sa pagbasa; ang ב ay natural na nagpapahiwatig ng pinagmulan ng binabasang teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיהֶם
  choice: kanilang Diyos
  rationale: Tuwirang ipinapahayag ang panghalip na hulapi ng anyong Hebreo.
- source_word: רְבִעִית הַיּוֹם ... וּרְבִעִית
  choice: sa loob ng sangkapat ng araw ... Sa isa pang sangkapat ng araw
  rationale: Pinananatili ang dalawang magkatumbas na yugto ng panahon at nililinaw sa natural na Tagalog ang elipsis sa ikalawang pagbanggit.
- source_word: מִתְוַדִּים
  choice: nagtapat sila
  rationale: Ang Hitpael na anyo ay tumutukoy sa patuloy na pagtatapat. Hindi idinagdag sa pangunahing teksto ang tahasang layon na 'mga kasalanan' sapagkat wala itong nakasaad na layon sa Hebreo.
- source_word: וּמִשְׁתַּחֲוִים
  choice: yumukod
  rationale: Pinananatili ang kongkretong kilos ng pagyukod sa pagsamba sa halip na gawing abstraktong 'sumamba' lamang.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang orihinal ay tahasang gumagamit ng Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan at hindi ito pinapalitan ng titulo.
- issue: Kung gagawing tahasang 'sumamba' ang וּמִשְׁתַּחֲוִים
  choice: yumukod
  alternative: sumamba
  rationale: Kasama sa pandiwa ang pisikal na kilos ng pagyukod o pagpapatirapa. Ipinakikita na ng pariralang 'kay Yahweh na kanilang Diyos' ang konteksto ng pagsamba nang hindi inaalis ang kongkretong larawan.
- issue: Kung idaragdag ang layon na 'mga kasalanan' sa מִתְוַדִּים
  choice: nagtapat sila
  alternative: ipinagtapat nila ang kanilang mga kasalanan
  rationale: Malamang na pagtatapat ng kasalanan ang tinutukoy ng konteksto, ngunit walang tahasang layon ang pandiwang Hebreo. Pinananatili ng salin ang kakulangan ng layon sa pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kani-kanilang puwesto” bilang likas na katumbas nang hindi labis na tinutukoy ang posibleng estruktura; ipinaliwanag sa talababa ang tunay na leksikal na kalabuan. Pinanatili ang pangalang Yahweh at ang pisikal na kilos ng pagyukod.
