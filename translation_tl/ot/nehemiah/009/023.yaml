  text: וּ/בְנֵי/הֶ֣ם הִרְבִּ֔יתָ כְּ/כֹכְבֵ֖י הַ/שָּׁמָ֑יִם וַ/תְּבִיאֵ/ם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר אָמַ֥רְתָּ לַ/אֲבֹתֵי/הֶ֖ם לָ/ב֥וֹא לָ/רָֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/023.yaml
  text: You multiplied their children like the stars of the heavens[c][b][a], and you brought them into the land that you had told their fathers to enter and possess.
translation:
  language: tl
  text: Ginawa mong kasingdami ng mga bituin sa langit[a] ang kanilang mga anak, at dinala mo sila sa lupain na sinabi mo sa kanilang mga ninuno na pasukin at ariin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “gaya ng mga bituin ng langit,” pananalitang umaalingawngaw sa pangako ng Diyos sa mga ninuno.
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin na “angkinin” o “manahin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: ang kanilang mga anak
  rationale: Sa konteksto ng pagdami ng buong bayan, ang בנים ay tumutukoy sa mga anak o salinlahi, hindi lamang sa mga anak na lalaki. Pinananatili ng “mga anak” ang ugnayang pampamilya.
- source_word: הִרְבִּיתָ
  choice: pinarami mo
  rationale: Ang Hiphil ng רבה ay nagpapahayag na pinangyari ng Diyos na maging marami sila; tuwiran at natural sa Tagalog ang “pinarami mo.”
- source_word: כְּכֹכְבֵי הַשָּׁמָיִם
  choice: na gaya ng mga bituin sa langit
  rationale: Malapit ito sa larawang Hebreo at pinananatili ang alusyon sa pangako sa mga ninuno, habang likas sa modernong Tagalog.
- source_word: וַתְּבִיאֵם
  choice: at dinala mo sila
  rationale: Ang Hiphil ng בוא ay nangangahulugang magdala o magpapasok; ang “dinala mo sila” ay malinaw at pinananatili ang tuwirang pagkilos ng Diyos.
- source_word: אֶל הָאָרֶץ
  choice: sa lupain
  rationale: Sa Tagalog, sapat na ipinahihiwatig ng “dinala ... sa lupain” ang pagpasok sa lupain; iniiwasan nito ang di-likas na literalismo.
- source_word: אֲשֶׁר אָמַרְתָּ לַאֲבֹתֵיהֶם
  choice: na sinabi mo sa kanilang mga ninuno
  rationale: Inilalarawan nito ang lupaing naging paksa ng naunang salita ng Diyos. Mas malawak at natural dito ang “mga ninuno” kaysa “mga ama,” nang hindi nawawala ang pagtukoy sa mga patriyarka.
- source_word: לָבוֹא
  choice: na pasukin
  rationale: Ipinahahayag ng infinitive ang nilalaman o layunin ng sinabi tungkol sa lupain; tuwirang tinutumbasan ito ng “pasukin.”
- source_word: לָרָשֶׁת
  choice: at ariin
  rationale: Sa kontekstong ito, ang ירשׁ ay tumutukoy sa pag-angkin at pagtataglay sa lupang ipinangako. Maikli at malinaw ang “ariin,” habang inilalagay sa talababa ang posibleng “manahin.”
theological_decisions:
- issue: Alusyon sa pangako ng Diyos sa mga patriyarka
  choice: Pinanatili ang larawang “mga bituin sa langit” at ang pagtukoy sa “kanilang mga ninuno.”
  alternative: Gumamit ng mas malayang pananalita gaya ng “di-mabilang na mga bituin” o tahasang pangalanan si Abraham at ang ibang patriyarka.
  rationale: Ang Hebreo ay umaalingawngaw sa pangako sa mga patriyarka ngunit hindi ito tahasang ipinapaliwanag. Pinananatili ng salin ang alusyon nang hindi nagdaragdag ng interpretasyon.
- issue: Kahulugan ng לָרָשֶׁת
  choice: ariin
  alternative: manahin; angkinin
  rationale: Maaaring tumukoy ang pandiwa sa pagmamay-ari, pag-angkin, o pagmamana. Sa agarang konteksto, nangingibabaw ang pagpasok at pagtataglay sa lupain, ngunit kinikilala sa talababa ang “manahin” bilang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” dahil malinaw nitong tinutukoy ang naunang salinlahi sa kasalukuyang gamit; pinanatili naman ang pangakong-larawan ng mga bituin sa langit.
