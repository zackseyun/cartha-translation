  text: וַ/יָּ֜קָם עַֽל מַֽעֲלֵ֣ה הַ/לְוִיִּ֗ם יֵשׁ֨וּעַ וּ/בָנִ֜י קַדְמִיאֵ֧ל שְׁבַנְיָ֛ה בֻּנִּ֥י שֵׁרֵבְיָ֖ה בָּנִ֣י כְנָ֑נִי וַֽ/יִּזְעֲקוּ֙ בְּ/ק֣וֹל גָּד֔וֹל אֶל יְהוָ֖ה אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/004.yaml
  text: Then Jeshua[a], Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, and Kenani stood on the platform of the Levites, and they cried out with a loud voice to Yahweh their God.
translation:
  language: tl
  text: Tumayo sa hagdanan ng mga Levita[a] sina Jeshua, Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, at Kenani. Sumigaw sila nang malakas kay Yahweh na kanilang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ahunan” o “mga baitang ng mga Levita”; maaaring tumukoy ang parirala sa isang mataas na dako o hagdanang kaugnay ng mga Levita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Tumayo
  rationale: Ang קום sa anyong ito ay nagsasaad ng pagtayo; tuwiran at natural ang “tumayo” sa Filipino.
- source_word: עַל מַעֲלֵה הַלְוִיִּם
  choice: sa hagdanan ng mga Levita[a]
  rationale: Ang מַעֲלֵה ay pangunahing tumutukoy sa ahunan o hagdan. Pinanatili ng “hagdanan” ang kongkretong diwa at nilinaw sa talababa na maaari rin itong tumukoy sa isang mataas na dakong kaugnay ng mga Levita.
- source_word: יֵשׁוּעַ וּבָנִי קַדְמִיאֵל שְׁבַנְיָה בֻּנִּי שֵׁרֵבְיָה בָּנִי כְנָנִי
  choice: Jeshua, Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, at Kenani
  rationale: Isinalin sa titik-Latin ang mga pangalang pantangi at pinanatili ang dalawang paglitaw ng Bani ayon sa tekstong Hebreo.
- source_word: וַיִּזְעֲקוּ
  choice: Sumigaw sila
  rationale: Ang זעק ay isang malakas at masidhing pagdaing o pagtawag, lalo na kapag nakatuon sa Diyos; naipahahayag ng “sumigaw” ang tindi nito.
- source_word: בְּקוֹל גָּדוֹל
  choice: nang malakas
  rationale: Natural na katumbas sa modernong Filipino ng idyomang Hebreo na literal na “sa pamamagitan ng malakas na tinig.”
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Ginamit ang personal na pangalang Yahweh upang katawanin nang tuwiran ang יהוה.
- source_word: אֱלֹהֵיהֶם
  choice: na kanilang Diyos
  rationale: Tapat nitong ipinahahayag ang hulaping paari sa Hebreo at maayos na nakakabit sa pangalang Yahweh sa Filipino.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging madaling basahin nang hindi binabago ang ugnayan ng mga kilos. Pinanatili ang listahan at pagkakasunod-sunod ng mga pangalan sa tekstong Hebreo.
