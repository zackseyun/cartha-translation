  - severity: low
    issue: “sa kalaliman”
    rationale: Nauunawaan ito, ngunit ang “sa kailaliman” ay mas idiomatiko at mas mahusay na naghahatid ng מְצוֹלוֹת, ang malalalim na bahagi ng tubig.
