base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/011.yaml
  text: You split the sea before them[a], and they passed through the midst of the sea on dry ground[b]; and you threw their pursuers into the depths like a stone in mighty waters.
translation:
  language: tl
  text: Hinati mo ang dagat sa harap nila[a], at tumawid sila sa gitna ng dagat sa tuyong lupa; at inihagis mo ang mga humahabol sa kanila sa kailaliman, gaya ng isang bato sa malalakas na tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Biniyak mo ang dagat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַעְתָּ
  choice: Hinati mo
  rationale: Tuwirang ipinapahayag ang pagbiyak o paghahati sa dagat sa natural na makabagong Tagalog; ang mas literal na “biniyak” ay nasa talababa.
- source_word: לִפְנֵיהֶם
  choice: sa harap nila
  rationale: Natural at eksaktong katumbas ng lokatibong idyomang Hebreo.
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: tumawid sila sa gitna ng dagat
  rationale: Pinananatili ang kilos ng pagtawid at ang kongkretong larawan ng pagdaan sa loob o gitna ng dagat.
- source_word: בַּיַּבָּשָׁה
  choice: sa tuyong lupa
  rationale: Karaniwang malinaw na Tagalog para sa tuyong lupang dinaanan sa ilalim ng dagat.
- source_word: רֹדְפֵיהֶם
  choice: ang mga humahabol sa kanila
  rationale: Mas madaling maunawaan ng ordinaryong mambabasa kaysa sa pangngalang “mga tagahabol,” at tumpak na naghahayag ng patuloy na paghabol.
- source_word: הִשְׁלַכְתָּ
  choice: inihagis mo
  rationale: Direkta at masiglang katumbas ng causative verb na nangangahulugang ihagis o itapon.
- source_word: בִמְצוֹלֹת
  choice: sa kalaliman
  rationale: Inilalarawan ang malalalim na bahagi ng dagat nang hindi nagdaragdag ng paliwanag.
- source_word: כְּמוֹ אֶבֶן
  choice: gaya ng isang bato
  rationale: Pinananatili ang payak at mariing paghahambing ng Hebreo.
- source_word: בְּמַיִם עַזִּים
  choice: sa malalakas na tubig
  rationale: Pinananatili ang karaniwang kahulugan ng עַזִּים na “malalakas” at ang preposisyong “sa,” nang hindi dinaragdagan ng ideyang “nagngangalit.”
theological_decisions:
- issue: Tuwirang pagkilos ng Diyos sa salaysay ng Exodo
  choice: Pinanatili ang ikalawang panauhang “Hinati mo” at “inihagis mo.”
  alternative: Isang impersonal na pagsasalin na hindi tahasang tumutukoy sa Diyos bilang gumagawa.
  rationale: Bahagi ito ng panalanging tuwirang kumakausap sa Diyos at nagpapahayag ng kanyang makasaysayang pagliligtas at paghatol.
- issue: Ugnayan ng dalawang gawa ng Diyos
  choice: Ginamit ang “ngunit” upang ihambing ang ligtas na pagtawid ng bayan at ang pagbagsak ng mga humahabol.
  alternative: “At,” na mas pormal na tumutugma sa payak na pang-ugnay na Hebreo.
  rationale: Sa konteksto, may malinaw na paghahambing sa magkaibang kinalabasan; ipinahihiwatig ito ng Hebreo kahit iisang pang-ugnay ang gamit.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa pampublikong pagbasa at panalangin. Iniwasan ang lipas o labis na teknikal na pananalita habang pinananatili ang matitingkad na larawan ng Hebreo.
