revisions:
- from: Hinati mo ang dagat sa harap nila[a], at tumawid sila sa gitna ng dagat sa tuyong lupa; ngunit inihagis mo ang mga humahabol sa kanila sa kalaliman, gaya ng isang bato sa malalakas na tubig.
  to: Hinati mo ang dagat sa harap nila[a], at tumawid sila sa gitna ng dagat sa tuyong lupa; at inihagis mo ang mga humahabol sa kanila sa kailaliman, gaya ng isang bato sa malalakas na tubig.
  rationale: Pinalitan ang “ngunit” ng “at” upang mapanatili ang payak na pagkakaugnay ng Hebreo nang hindi nagdaragdag ng kontrastibong interpretasyon. Pinalitan ang “sa kalaliman” ng “sa kailaliman” para sa mas likas na modernong Tagalog habang pinananatili ang larawan ng malalalim na tubig. Napanatili ang umiiral na talababa at ang direktang ikalawang-panauhang pananalita ng panalangin.
