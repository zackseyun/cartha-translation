base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/013.yaml
  text: You came down on Mount Sinai and spoke with them from heaven[a], and you gave them upright judgments, true laws[c][b], good statutes and commandments.
translation:
  language: tl
  text: Bumaba ka sa Bundok Sinai at nakipag-usap sa kanila mula sa langit[a]. Binigyan mo sila ng mga makatarungang tuntunin[b], mga tunay na kautusan[c], at mabubuting batas at utos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagsalita sa kanila mula sa langit.” Literal na “kasama nila” ang pang-ukol sa Hebreo; maaari itong ipahayag sa Filipino bilang “nakipag-usap sa kanila” o “nagsalita sa kanila.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga matuwid na pasiya” o “mga wastong tuntunin.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga batas ng katotohanan” o “mga tunay na tagubilin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַר סִינַי יָרַדְתָּ
  choice: Bumaba ka sa Bundok Sinai
  rationale: Likas at tuwirang ipinapahayag ng “bumaba” ang ירד sa panalanging tuwirang nakikipag-usap sa Diyos; karaniwang anyo sa Filipino ang “Bundok Sinai.”
- source_word: וְדַבֵּר עִמָּהֶם מִשָּׁמָיִם
  choice: at nakipag-usap sa kanila mula sa langit
  rationale: Ipinapakita ng “nakipag-usap sa kanila” ang עִם, na literal na “kasama/kasabay nila,” nang hindi nagiging asiwa sa modernong Filipino; tuwirang isinasalin ng “mula sa langit” ang מִשָּׁמָיִם.
- source_word: וַתִּתֵּן לָהֶם
  choice: Binigyan mo sila
  rationale: Natural na Filipino para sa נתן + ל at pinananatili ang ikalawang panauhang pagtukoy sa Diyos.
- source_word: מִשְׁפָּטִים יְשָׁרִים
  choice: matuwid na mga tuntuning legal
  rationale: Ang “tuntuning legal” ay nagpapanatili sa legal na diwa ng מִשְׁפָּטִים at nakatutulong na maiba ito sa iba pang terminong pambatas sa talata; ang “matuwid” ay tumutugma sa יְשָׁרִים.
- source_word: וְתוֹרוֹת אֱמֶת
  choice: mga tunay na tagubilin
  rationale: Maaaring mangahulugan ang maramihang תוֹרוֹת ng mga kautusan o tagubilin. Pinananatili ng “tagubilin” ang mas malawak na diwa ng Torah at iniiwasang ipantay ito nang lubos sa חֻקִּים; ang “tunay” ay likas na panuring para sa אֱמֶת.
- source_word: חֻקִּים
  choice: mga batas
  rationale: Malinaw sa karaniwang mambabasa ang “mga batas” bilang mga itinakdang alituntunin at pinananatiling hiwalay sa “mga utos.”
- source_word: וּמִצְוֺת טוֹבִים
  choice: at mabubuting ... utos
  rationale: Ang “utos” ang tuwiran at karaniwang salin ng מִצְוָה; ang pangmaramihang טוֹבִים ay likas na inilapat sa magkatambal na “mga batas at utos” sa pamamagitan ng “mabubuting.”
theological_decisions:
- issue: Pagpapanatili sa magkakaibang terminong pambatas
  choice: Ihiwalay bilang “mga tuntuning legal,” “mga tagubilin,” “mga batas,” at “mga utos.”
  alternative: Pagsamahin o gawing magkakapareho ang mga ito bilang “mga batas at utos.”
  rationale: Sunod-sunod na gumagamit ang Hebreo ng apat na magkakaugnay ngunit hindi magkaparehong pangngalan. Ang magkakaibang salin ay nagpapanatili sa retorikal at legal na kayamanan ng pahayag nang hindi naglalagay ng natatanging sistemang doktrinal.
- issue: Kahulugan ng תוֹרוֹת אֱמֶת
  choice: “mga tunay na tagubilin”
  alternative: “mga batas ng katotohanan” o “mga tunay na kautusan”
  rationale: Ang תוֹרָה ay maaaring tumukoy sa batas o tagubilin. Sa kontekstong legal, kapwa posible, kaya pinili ang natural na “tagubilin” at iniulat sa talababa ang mga alternatibo upang hindi ikubli ang saklaw ng salita.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nakipag-usap” upang katawanin ang Hebreong pang-ukol na עִם, at pinanatiling magkakaiba ang apat na terminong legal hangga't pinahihintulutan ng natural na Filipino.
