source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ הַ/בָּנִים֙ וַ/יִּֽירְשׁ֣וּ אֶת הָ/אָ֔רֶץ וַ/תַּכְנַ֨ע לִ/פְנֵי/הֶ֜ם אֶת יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ הַ/כְּנַ֣עֲנִ֔ים וַֽ/תִּתְּנֵ֖/ם בְּ/יָדָ֑/ם וְ/אֶת מַלְכֵי/הֶם֙ וְ/אֶת עַֽמְמֵ֣י הָ/אָ֔רֶץ לַ/עֲשׂ֥וֹת בָּ/הֶ֖ם כִּ/רְצוֹנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/024.yaml
  text: So the sons came in and took possession of the land[a], and you subdued before them the inhabitants of the land, the Canaanites, and gave them into their hand, both their kings and the peoples of the land[c][b], to do with them according to their will.
translation:
  language: tl
  text: Kaya pumasok ang mga anak[a] at inangkin ang lupain. Pinasuko mo sa harap nila ang mga naninirahan sa lupain—ang mga Cananeo. Ibinigay mo sa kanilang kamay[b] ang mga ito, pati ang kanilang mga hari at ang mga mamamayan ng lupain, upang gawin nila sa mga ito ang anumang naisin nila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “ang mga anak”; sa konteksto, ito ang mga inapo ng Israel na pumasok sa Canaan.
    reason: lexical_alternative
  - marker: b
    text: Ang “ibinigay sa kanilang kamay” ay idyomang nangangahulugang inilagay sa ilalim ng kanilang kapangyarihan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “upang pakitunguhan nila ang mga ito ayon sa gusto nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּנִים
  choice: ang mga anak
  rationale: Literal itong “ang mga anak” at tumutukoy sa mga inapo ng Israel na pumasok sa Canaan. Pinananatili nito ang pampamilyang ugnayan sa naunang pagbanggit sa mga ninuno.
- source_word: וַיִּירְשׁוּ אֶת הָאָרֶץ
  choice: inangkin ang lupain
  rationale: Sa konteksto ng lupain, ang ירשׁ ay pagkuha at paghawak nito bilang pag-aari. Ang “inangkin” ay likas sa modernong Tagalog at mas aktibo kaysa “minana.”
- source_word: וַתַּכְנַע
  choice: pinasuko mo
  rationale: Ipinahihiwatig ng כנע ang pagpapailalim sa kapangyarihan ng iba; ang “pinasuko” ay angkop sa kontekstong militar at pampolitika.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: mga naninirahan sa lupain
  rationale: Natural at tuwirang salin ng participial na pariralang tumutukoy sa mga taong nakatira roon.
- source_word: הַכְּנַעֲנִים
  choice: mga Cananeo
  rationale: Pinananatili ang tahasang katawagang etniko sa anyong karaniwan sa Tagalog na salin ng Bibliya.
- source_word: וַתִּתְּנֵם בְּיָדָם
  choice: ibinigay mo sa kanilang kamay
  rationale: Pinananatili ang Hebreong larawan ng “kamay” bilang kapangyarihan o kontrol, habang malinaw pa rin sa Tagalog.
- source_word: מַלְכֵיהֶם
  choice: kanilang mga hari
  rationale: Ang panghalip ay likas na tumutukoy sa mga naninirahan sa lupain, lalo na sa mga Cananeo.
- source_word: עַמְמֵי הָאָרֶץ
  choice: mga bayan ng lupain
  rationale: Ipinakikita ng “mga bayan” ang maramihang עַמְמֵי bilang magkakaibang pangkat ng mga tao, hindi mga pisikal na pamayanan.
- source_word: לַעֲשׂוֹת בָּהֶם כִּרְצוֹנָם
  choice: upang gawin nila sa mga ito ang anumang naisin nila
  rationale: Malapit ito sa anyo at lakas ng Hebreo at hindi pinahihina ang malawak na kapangyarihang ipinagkaloob sa kanila.
theological_decisions:
- issue: Tinutukoy ng “mga anak”
  choice: Panatilihin ang “mga anak” bilang mga inapo ng Israel na pumasok sa Canaan.
  alternative: “Mga Israelita,” na mas tahasang nagpapaliwanag sa tinutukoy.
  rationale: Ang Hebreo ay gumagamit ng wikang pampamilya, na nag-uugnay sa salinlahing ito sa mga ninunong binanggit sa panalangin; hindi dapat alisin ang ugnayang iyon sa pamamagitan ng tahimik na pagpapakahulugan.
- issue: Lakas ng wikang pananakop
  choice: Panatilihin ang tuwirang pananalitang “pinasuko” at “ibinigay ... sa kanilang kamay.”
  alternative: Palambutin bilang “tinulungan mo silang manaig.”
  rationale: Tahasang iniuugnay ng talata sa Diyos ang pagpapailalim ng mga Cananeo at ang paglalagay sa kanila sa kapangyarihan ng Israel; hindi ito dapat pahinain.
- issue: Saklaw ng kapangyarihang ipinahihiwatig ng כִּרְצוֹנָם
  choice: “ang anumang naisin nila”
  alternative: “ayon sa kanilang kagustuhan” o “pakitunguhan ayon sa gusto nila”
  rationale: Pinananatili ng piniling salin ang malawak at mabigat na pahayag ng Hebreo nang hindi nililimitahan o binibigyang-katwirang teolohikal ang ginawa nila.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pampamilyang katawagang “mga anak,” ang matibay na wikang pananakop, at ang Hebreong larawang “sa kanilang kamay.” Gumamit ng em dash upang malinaw na ipakitang ang mga naninirahan sa lupain ay ang mga Cananeo.
