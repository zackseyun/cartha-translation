  source_fidelity: Tumpak sa kabuuan ang pagsasalin ng pagkakabihag ng mga napapaderang lungsod, pag-aangkin ng matabang lupain at mga nakahandang yaman, at ng pagkain, pagkabusog, at pagtaba bilang larawan ng kasaganaan. Gayunman, ang “nagpakasasa” ay karaniwang nagpapahiwatig sa makabagong Filipino ng labis o mapanuring pagpapalayaw. Ang וַיִּתְעַדְּנוּ ay maaaring tumukoy sa marangyang pagtamasa, ngunit hindi ito tahasang humahatol sa talatang ito; kaya ang mas di-mapanghatol na katumbas ay mas tapat sa antas ng ipinahihiwatig ng Hebreo.
  naturalness: Natural at malinaw ang karamihan ng teksto. Ang “mga imbakan ng tubig na hinukay sa bato” ay isang mauunawaang paglalarawan ng mga sisternang tinibag. Mas natural at mas walang idinagdag na mapanuring himig ang “lubos silang nasiyahan” kaysa “nagpakasasa sila.”
  terminology: Ang “napapaderang lungsod,” “matabang lupain,” “ubasan,” “punong olibo,” at “dakilang kabutihan” ay angkop. Napananatili ng “tumaba” ang matingkad na larawang Hebreo, at wastong ipinapaliwanag ito ng talababa bilang larawan ng kasaganaan.
