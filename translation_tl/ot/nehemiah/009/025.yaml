reference: Nehemiah 9:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יִּלְכְּד֞וּ עָרִ֣ים בְּצֻרוֹת֮ וַ/אֲדָמָ֣ה שְׁמֵנָה֒ וַ/יִּֽירְשׁ֡וּ בָּתִּ֣ים מְלֵֽאִים כָּל ט֠וּב בֹּר֨וֹת חֲצוּבִ֜ים כְּרָמִ֧ים וְ/זֵיתִ֛ים וְ/עֵ֥ץ מַאֲכָ֖ל לָ/רֹ֑ב וַ/יֹּאכְל֤וּ וַֽ/יִּשְׂבְּעוּ֙ וַ/יַּשְׁמִ֔ינוּ וַ/יִּֽתְעַדְּנ֖וּ בְּ/טוּבְ/ךָ֥ הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/025.yaml
  text: They captured fortified cities and fertile land[a], and took possession of houses full of every good thing, hewn cisterns, vineyards, olive trees, and fruit trees in abundance. So they ate and were filled and grew fat[c][b], and they delighted themselves in your great goodness.
translation:
  language: tl
  text: Sinakop nila ang mga napapaderang lungsod at matabang lupain[a]. Inangkin nila ang mga bahay na punô ng lahat ng mabubuting bagay, mga imbakan ng tubig na hinukay sa bato, mga ubasan, mga punong olibo, at napakaraming punong namumunga. Kaya kumain sila, nabusog, at tumaba[b]; lubos silang nasiyahan sa iyong dakilang kabutihan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mayamang lupain”; literal na “matabang lupain.”
    reason: lexical_alternative
  - marker: b
    text: O “naging sagana.” Literal na larawan ng Hebreo ang “tumaba.”
    reason: lexical_alternative
  - marker: c
    text: O “lubos nilang tinamasa ang iyong dakilang kasaganaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּ
  choice: Sinakop nila
  rationale: Ang לכד ay tumutukoy sa pagsakop o pag-agaw, lalo na ng mga lungsod; likas at malinaw sa kontekstong militar ang “sinakop.”
- source_word: עָרִים בְּצֻרוֹת
  choice: mga napapaderang lungsod
  rationale: Ipinahihiwatig ng בְּצֻרוֹת na protektado ang mga lungsod ng mga tanggulan; ipinapahayag ito nang kongkreto at madaling maunawaan ng “napapaderang.”
- source_word: אֲדָמָה שְׁמֵנָה
  choice: matabang lupain
  rationale: Literal itong “matabang lupa,” isang larawang Hebreo para sa lupaing mayaman at mabunga. Gumagana rin nang natural sa Filipino ang parehong larawan.
- source_word: וַיִּירְשׁוּ
  choice: Inangkin nila
  rationale: Maaaring mangahulugan ang ירשׁ ng magmana, magmay-ari, o angkinin matapos paalisin ang dating naninirahan. Sa konteksto ng pagsakop, ang “inangkin” ay hindi nagpapasiya na karaniwang pagmamana lamang ang tinutukoy.
- source_word: בָּתִּים מְלֵאִים כָּל טוּב
  choice: mga bahay na punô ng lahat ng mabubuting bagay
  rationale: Pinananatili nito ang malawak at masaklaw na diwa ng כָּל טוּב nang hindi nililimitahan sa isang uri ng ari-arian.
- source_word: בֹּרוֹת חֲצוּבִים
  choice: mga imbakan ng tubig na hinukay sa bato
  rationale: Ang בּוֹר dito ay sisterna o hukay na imbakan ng tubig, at ang חצוב ay tinibag o hinukay. Mas tiyak ito kaysa “balon,” na maaaring ipakahulugang bukal ng tubig sa ilalim ng lupa.
- source_word: כְּרָמִים וְזֵיתִים וְעֵץ מַאֲכָל לָרֹב
  choice: mga ubasan, mga punong olibo, at napakaraming punong namumunga
  rationale: Natural na mga katumbas ang “ubasan” at “punong olibo.” Ang עֵץ מַאֲכָל ay punong nagbibigay ng makakain, at ang לָרֹב ay malinaw na ipinapahayag ng “napakarami.”
- source_word: וַיֹּאכְלוּ וַיִּשְׂבְּעוּ
  choice: kumain sila, nabusog
  rationale: Ang שׂבע ay pagkabusog o pagkasapat ng kinain; tuwiran at natural ang “nabusog.”
- source_word: וַיַּשְׁמִינוּ
  choice: tumaba
  rationale: Pinananatili nito ang matingkad at literal na larawan ng Hebreo. Sa talata, bunga ito ng kasaganaan, bagaman maaaring may pahiwatig ng pagpapalayaw sa mas malawak na konteksto.
- source_word: וַיִּתְעַדְּנוּ
  choice: nagpakasasa sila
  rationale: Ipinahihiwatig ng pandiwa ang marangyang pagpapakasaya o lubos na pagtamasa. Ang “nagpakasasa” ay nagpapanatili sa tindi at posibleng tensiyong moral ng salita.
theological_decisions:
- issue: Diwa ng בְּטוּבְךָ הַגָּדוֹל
  choice: sa iyong dakilang kabutihan
  alternative: dahil sa iyong dakilang kasaganaan
  rationale: Ang טוּב ay maaaring tumukoy kapuwa sa kabutihan ng Diyos at sa saganang biyayang ibinibigay niya. Pinananatili ng “kabutihan” ang mas malawak na saklaw, samantalang hindi nilulutas nang tahasan kung ang בְּ ay lokatibo o instrumental.
- issue: Posibleng moral na pahiwatig ng וַיִּתְעַדְּנוּ
  choice: nagpakasasa sila
  alternative: lubos silang nasiyahan
  rationale: Maaaring ilarawan ng pandiwa ang masaganang pagtamasa nang walang tahasang paghatol, ngunit sa konteksto maaari rin itong magpahiwatig ng pagpapalayaw. Pinananatili ng napiling salita ang tensiyong iyon sa halip na gawing ganap na positibo.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “punô” upang malinaw na maiba sa “puno,” at pinili ang mga kongkretong salitang “napapaderang,” “imbakan ng tubig,” at “punong namumunga” upang maging malinaw sa karaniwang mambabasa nang hindi inaalis ang mga larawang Hebreo.
