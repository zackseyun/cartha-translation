source:
  edition: WLC
  text: וַ/תָּ֨עַד בָּ/הֶ֜ם לַ/הֲשִׁיבָ֣/ם אֶל תּוֹרָתֶ֗/ךָ וְ/הֵ֨מָּה הֵזִ֜ידוּ וְ/לֹא שָׁמְע֤וּ לְ/מִצְוֺתֶ֨י/ךָ֙ וּ/בְ/מִשְׁפָּטֶ֣י/ךָ חָֽטְאוּ בָ֔/ם אֲשֶׁר יַעֲשֶׂ֥ה אָדָ֖ם וְ/חָיָ֣ה בָ/הֶ֑ם וַ/יִּתְּנ֤וּ כָתֵף֙ סוֹרֶ֔רֶת וְ/עָרְפָּ֥/ם הִקְשׁ֖וּ וְ/לֹ֥א שָׁמֵֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/029.yaml
  text: You warned them in order to bring them back to your law[a], but they acted presumptuously and did not listen to your commandments; they sinned against your judgments, by which a man shall live if he does them. They gave a stubborn shoulder, stiffened their neck[b], and would not listen.
translation:
  language: tl
  text: Nagbabala ka sa kanila upang ibalik sila sa iyong Kautusan, ngunit mapangahas silang kumilos at hindi nakinig sa iyong mga utos. Nagkasala sila laban sa iyong mga tuntunin—na kapag ginawa ng isang tao, mabubuhay siya sa pamamagitan ng mga ito.[a] Tinalikuran ka nila nang may pagsuway,[b] pinatigas nila ang kanilang batok, at ayaw makinig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tumutukoy ito sa Levitico 18:5. Maaari ring isalin: “na kapag ginawa ng isang tao, mabubuhay siya sa pamamagitan ng mga iyon.”'
    reason: cross_reference_and_lexical_alternative
  - marker: b
    text: Sa Hebreo, “nagbigay sila ng suwail na balikat,” isang idyoma para sa sadyang pagtanggi o pagtalikod.
    reason: literal_idiom
lexical_decisions:
- source_word: וַתָּעַד בָּהֶם
  choice: Nagbabala ka sa kanila
  rationale: Ang Hifil ng עוד ay tumutukoy sa taimtim na pagbababala o pagpapatotoo laban sa kanila; malinaw at natural sa makabagong Tagalog ang “nagbabala.”
- source_word: לַהֲשִׁיבָם אֶל תּוֹרָתֶךָ
  choice: upang ibalik sila sa iyong Kautusan
  rationale: Pinananatili ng “ibalik” ang causative na diwa ng שׁוב, at ang “Kautusan” ay angkop sa konteksto ng tipan.
- source_word: הֵזִידוּ
  choice: buong kayabangan silang naghimagsik
  rationale: Ipinahahayag ng זיד ang mapangahas at mapagmataas na pagsuway, hindi lamang panloob na pagmamataas.
- source_word: לֹא שָׁמְעוּ לְמִצְוֺתֶיךָ
  choice: hindi nakinig sa iyong mga utos
  rationale: Pinananatili ang Hebreong larawan ng pakikinig na may kaakibat na pagsunod.
- source_word: וּבְמִשְׁפָּטֶיךָ חָטְאוּ בָם
  choice: Nagkasala sila laban sa iyong mga tuntunin
  rationale: Ang מִשְׁפָּטִים ay mga tuntunin o pasiya ng Diyos; natural sa Tagalog ang “mga tuntunin” at nananatili ang legal na diwa.
- source_word: אֲשֶׁר יַעֲשֶׂה אָדָם וְחָיָה בָהֶם
  choice: na kapag sinusunod ng isang tao ay ikabubuhay niya
  rationale: Ang אָדָם ay pangkalahatang tumutukoy sa sinumang tao. Ang “ikabubuhay niya” ay nagpapanatili sa ugnayan ng paggawa at pamumuhay nang hindi nilulutas kung pisikal, tipan, o mas malawak na buhay ang tinutukoy.
- source_word: וַיִּתְּנוּ כָתֵף סוֹרֶרֶת
  choice: Matigas ang ulong tumanggi sila
  rationale: Ang literal na “nagbigay sila ng suwail na balikat” ay hindi likas sa Tagalog; ang piniling idyoma ay nagpapahayag ng sadyang matigas na pagtutol. Ipinaliliwanag sa talababa ang orihinal na larawan.
- source_word: וְעָרְפָּם הִקְשׁוּ
  choice: nagmatigas sila
  rationale: Natural na katumbas ito ng idyomang “pinatigas ang kanilang batok,” na nangangahulugang nagpakasuwail o nagmatigas.
- source_word: וְלֹא שָׁמֵעוּ
  choice: ayaw makinig
  rationale: Ipinakikita ng “ayaw” ang sinasadya at nagpapatuloy na pagtanggi sa huling sugnay.
theological_decisions:
- issue: Ang buhay na kaugnay ng pagsunod sa mga tuntunin
  choice: na kapag sinusunod ng isang tao ay ikabubuhay niya
  alternative: na dapat gawin ng isang tao upang mabuhay siya sa pamamagitan ng mga iyon
  rationale: Pinananatili ang pahayag at tensiyon ng Hebreo at ang alusyon sa Levitico 18:5, nang hindi ipinapakahulugan kung ito ay gantimpala, buhay sa tipan, o paraan ng kaligtasan.
- issue: Pangkalahatang kahulugan ng אָדָם
  choice: isang tao
  alternative: isang lalaki
  rationale: Dito ang אָדָם ay generic at tumutukoy sa sinumang tao; ang “isang tao” ang tumpak at likas na salin sa Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang malaking titik sa “Kautusan” bilang pantukoy sa Kautusan ng Diyos sa konteksto, habang iniwasan ang sobrang literal na mga idyomang hindi mauunawaan nang likas sa Tagalog.
