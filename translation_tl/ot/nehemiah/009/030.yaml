revisions:
- from: Sa loob ng maraming taon, naging matiisin ka sa kanila at nagbabala ka sa kanila sa pamamagitan ng iyong Espiritu, sa pamamagitan ng iyong mga propeta.[a] Ngunit ayaw nilang makinig, kaya ibinigay mo sila sa kamay ng mga bayan ng ibang mga lupain.
  to: Sa loob ng maraming taon, naging matiisin ka sa kanila at nagbabala ka sa kanila sa pamamagitan ng iyong Espiritu, sa pamamagitan ng iyong mga propeta[a]. Ngunit ayaw nilang makinig, kaya ibinigay mo sila sa kamay ng mga mamamayan ng mga lupain.
  rationale: Inalis ang interpretatibong “ibang” at pinalitan ang “mga bayan” ng “mga mamamayan” upang mas tumpak na maipahayag ang עַמֵּי הָאֲרָצוֹת bilang mga tao ng mga lupain. Inayos din ang puwesto ng pananda ng talababa. Hindi binago ang kahulugan ng ibang bahagi ng talata.
