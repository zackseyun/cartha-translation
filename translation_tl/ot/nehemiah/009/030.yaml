id: NEH.9.30
reference: Nehemiah 9:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תִּמְשֹׁ֤ךְ עֲלֵי/הֶם֙ שָׁנִ֣ים רַבּ֔וֹת וַ/תָּ֨עַד בָּ֧/ם בְּ/רוּחֲ/ךָ֛ בְּ/יַד נְבִיאֶ֖י/ךָ וְ/לֹ֣א הֶאֱזִ֑ינוּ וַֽ/תִּתְּנֵ֔/ם בְּ/יַ֖ד עַמֵּ֥י הָ/אֲרָצֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/030.yaml
  text: For many years you were patient with them and testified against them by your Spirit through your prophets[a], but they would not listen. So you gave them into the hand of the peoples of the lands.
translation:
  language: tl
  text: Sa loob ng maraming taon, naging matiisin ka sa kanila at nagbabala ka sa kanila sa pamamagitan ng iyong Espiritu, sa pamamagitan ng iyong mga propeta[a]. Ngunit ayaw nilang makinig, kaya ibinigay mo sila sa kamay ng mga mamamayan ng mga lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpatotoo ka laban sa kanila sa pamamagitan ng iyong Espiritu, sa pamamagitan ng iyong mga propeta.”
    reason: Pinananatili ang mas pormal at hudisyal na kahulugan ng וַתָּעַד בָּם bilang leksikal na alternatibo.
lexical_decisions:
- source_word: וַתִּמְשֹׁךְ עֲלֵיהֶם שָׁנִים רַבּוֹת
  choice: Sa loob ng maraming taon, naging matiisin ka sa kanila
  rationale: Ang idyomang משׁך על ay nagpapahiwatig ng pagpapalawig ng panahon o pagpipigil ng hatol. Likas sa modernong Tagalog ang “naging matiisin ka sa kanila” at napananatili nito ang diwa ng matagal na pagtitiis.
- source_word: וַתָּעַד בָּם
  choice: at nagbabala ka sa kanila
  rationale: Ang Hifil ng עוד ay maaaring mangahulugang magpatotoo laban, magbigay-babala, o magpaalaala. Sa konteksto ng paulit-ulit na panawagan ng mga propeta, malinaw at natural ang “nagbabala”; inilalahad sa talababa ang mas pormal at hudisyal na alternatibo.
- source_word: בְּרוּחֲךָ
  choice: sa pamamagitan ng iyong Espiritu
  rationale: Sa konteksto ng pagsasalita sa pamamagitan ng mga propeta, tumutukoy ang רוּחַ sa Espiritu ng Diyos bilang pinagmumulan o tagapamagitan ng babala.
- source_word: בְּיַד נְבִיאֶיךָ
  choice: sa pamamagitan ng iyong mga propeta
  rationale: Ang literal na “sa kamay ng” ay karaniwang idyoma ng ahensiya; natural na katumbas nito sa Tagalog ang “sa pamamagitan ng.”
- source_word: וְלֹא הֶאֱזִינוּ
  choice: Ngunit ayaw nilang makinig
  rationale: Ang האזין ay masusing pakikinig o pagbibigay-pansin. Ipinahihiwatig ng konteksto ang sadyang pagtanggi, kaya ang “ayaw nilang makinig” ay angkop.
- source_word: וַתִּתְּנֵם בְּיַד
  choice: kaya ibinigay mo sila sa kamay
  rationale: Ipinakikita ng “kaya” ang bunga ng kanilang hindi pakikinig, samantalang pinananatili ng “sa kamay” ang Hebreong larawan ng pagpapasailalim sa kapangyarihan ng iba.
- source_word: עַמֵּי הָאֲרָצוֹת
  choice: mga bayan ng ibang mga lupain
  rationale: Pinananatili ang maramihang “mga bayan” at “mga lupain,” habang nililinaw ng “ibang” na ang tinutukoy ay mga bansang nasa labas ng Israel, hindi ang buong sangkatauhan.
theological_decisions:
- issue: Ang tinutukoy ng “iyong Espiritu”
  choice: Espiritu ng Diyos bilang kumikilos sa pamamagitan ng mga propeta
  alternative: espiritu bilang disposisyon o hininga
  rationale: Ang pagkakaugnay ng “iyong Espiritu” at “iyong mga propeta” ay pinakamalinaw na tumutukoy sa banal na ahensiya sa mensahe ng mga propeta, nang hindi nagdaragdag ng doktrinang lampas sa talata.
- issue: Saklaw ng וַתָּעַד בָּם
  choice: nagbabala ka sa kanila
  alternative: nagpatotoo ka laban sa kanila
  rationale: Parehong sinusuportahan ng pandiwa ang babala at hudisyal na patotoo. Pinili sa teksto ang mas madaling maunawaan sa konteksto, at pinanatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: 'Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Iniwasan ang sobrang literal na “iniunat mo sa kanila ang maraming taon,” ngunit pinanatili ang biblikal na larawang “sa kamay.” Ang pag-uulit ng “sa pamamagitan ng” ay sadyang nagpapanatili sa dalawang magkaugnay na pariralang Hebreo: sa pamamagitan ng Espiritu at sa pamamagitan ng mga propeta.'
