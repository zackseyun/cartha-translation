  to: Ngunit ikaw, sa iyong saganang habag[a], ay hindi sila iniwan sa ilang. Hindi umalis mula sa ibabaw nila ang haliging ulap sa araw upang patnubayan sila sa daan, ni ang haliging apoy sa gabi upang liwanagan sila at ang daang dapat nilang lakaran.[b]
