  text: וְ/אַתָּה֙ בְּ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֔ים לֹ֥א עֲזַבְתָּ֖/ם בַּ/מִּדְבָּ֑ר אֶת עַמּ֣וּד הֶ֠/עָנָן לֹא סָ֨ר מֵ/עֲלֵי/הֶ֤ם בְּ/יוֹמָם֙ לְ/הַנְחֹתָ֣/ם בְּ/הַ/דֶּ֔רֶךְ וְ/אֶת עַמּ֨וּד הָ/אֵ֤שׁ בְּ/לַ֨יְלָה֙ לְ/הָאִ֣יר לָ/הֶ֔ם וְ/אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/019.yaml
  text: But you[a], in your abundant mercies, did not abandon them in the wilderness. The pillar of cloud did not depart from above them by day, to lead them on the way, nor the pillar of fire by night, to give them light and the way in which they should go.
translation:
  language: tl
  text: Ngunit ikaw, sa iyong saganang habag[a], ay hindi sila iniwan sa ilang. Hindi umalis mula sa ibabaw nila ang haliging ulap sa araw upang patnubayan sila sa daan, ni ang haliging apoy sa gabi upang liwanagan sila at ang daang dapat nilang lakaran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa iyong dakilang awa.” Maramihan ang pangngalang Hebreo; literal, “sa marami mong habag.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin ang hulihan: “upang bigyan sila ng liwanag sa daang dapat nilang lakaran.” Maaaring unawain ang “daan” bilang isa pang nililiwanagan o bilang lugar na nilalakaran nila sa liwanag.'
    reason: source_ambiguity
lexical_decisions:
- source_word: בְּרַחֲמֶיךָ הָרַבִּים
  choice: dahil sa iyong saganang habag
  rationale: Ang רַחֲמִים ay tumutukoy sa habag o awa at nasa anyong maramihan; ipinahahayag ng “saganang habag” ang kasaganaan ng habag sa natural na modernong Tagalog, habang nililinaw sa talababa ang literal na anyo.
- source_word: עֲזַבְתָּם
  choice: hindi nagpabaya sa kanila
  rationale: Ang עזב ay maaaring mangahulugang iwan, talikuran, o pabayaan. Ang “hindi nagpabaya sa kanila” ay malinaw at likas sa konteksto ng patuloy na pangangalaga sa ilang.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ang maikli at nakaugaliang salin ng מִדְבָּר sa salaysay ng paglalakbay ng Israel, nang hindi ito nililimitahan sa purong disyerto.
- source_word: עַמּוּד הֶעָנָן
  choice: haliging ulap
  rationale: Pinananatili nito ang kongkretong larawan at ang ugnayan sa salaysay ng Exodo.
- source_word: לֹא סָר מֵעֲלֵיהֶם
  choice: hindi lumayo sa ibabaw nila
  rationale: Ipinapahayag ng “lumayo” ang diwa ng סור at pinananatili ng “sa ibabaw nila” ang tiyak na puwestong isinasaad ng מֵעֲלֵיהֶם.
- source_word: לְהַנְחֹתָם בְּהַדֶּרֶךְ
  choice: upang patnubayan sila sa daan
  rationale: Ang Hiphil ng נחה ay “pumatnubay” o “umakay”; natural na tinutumbasan ng “sa daan” ang בְּהַדֶּרֶךְ.
- source_word: עַמּוּד הָאֵשׁ
  choice: haliging apoy
  rationale: Tuwirang salin na nagpapanatili sa paralelismo sa “haliging ulap.”
- source_word: לְהָאִיר לָהֶם
  choice: upang liwanagan sila
  rationale: Ang Hiphil ng אור ay nangangahulugang magbigay-liwanag o magliwanag para sa iba; ang “liwanagan sila” ay maikli at malinaw.
- source_word: וְאֶת הַדֶּרֶךְ אֲשֶׁר יֵלְכוּ בָהּ
  choice: at ang daang dapat nilang lakaran
  rationale: Pinananatili ang וְאֶת bilang koordinadong layon ng “liwanagan,” pati ang modal na diwa ng landas na itinakdang lakaran, nang hindi tahimik na ginagawang pariralang panlunan ang “daan.”
theological_decisions:
- issue: Wika tungkol sa habag ng Diyos
  choice: saganang habag
  alternative: napakarami mong mga habag; dakila mong awa
  rationale: Hindi natural sa Tagalog ang literal na maramihang “mga habag.” Ang “saganang habag” ay nagpapanatili sa diin sa kasaganaan ng banal na habag, at inilalahad sa talababa ang maramihang anyo ng Hebreo.
- issue: Kaugnayan ng “ang daan” sa pagbibigay-liwanag
  choice: liwanagan sila at ang daang dapat nilang lakaran
  alternative: bigyan sila ng liwanag sa daang dapat nilang lakaran
  rationale: May אֵת bago ang “daan,” kaya maaaring unawain itong ikalawang layon na iniuugnay ng וְ sa parirala tungkol sa pagbibigay-liwanag. Pinananatili ng pangunahing salin ang anyong ito; kinikilala sa talababa ang mas idiomatikong panlunang pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ilang,” “haliging ulap,” at “haliging apoy” upang mapanatili ang pamilyar na larawang biblikal. Iniwasan ang arkaikong ayos maliban sa bahagyang pormal na balangkas na angkop sa panalangin at salaysay.
