  text: וְ/הֵ֥ם וַ/אֲבֹתֵ֖י/נוּ הֵזִ֑ידוּ וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וְ/לֹ֥א שָׁמְע֖וּ אֶל מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/016.yaml
  text: But they[a], our fathers, acted presumptuously and stiffened their neck[c][b], and did not listen to your commandments.
translation:
  language: tl
  text: Ngunit sila—ang aming mga ninuno—ay kumilos nang may kapalaluan[a], nagmatigas[b], at hindi nakinig[c] sa iyong mga utos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kumilos nang pangahas” o “kumilos nang palalo.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “pinatigas nila ang kanilang leeg,” isang idyomang nangangahulugang naging matigas ang ulo o mapaghimagsik sila.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin na “hindi tumalima” o “hindi sumunod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם וַאֲבֹתֵינוּ
  choice: Ngunit sila—ang aming mga ninuno—
  rationale: Ipinahahayag ng וְ ang pagsalungat sa naunang paglalahad ng kabutihan ng Diyos. Ang “mga ninuno” ay likas sa modernong Filipino at pinananatili ang sama-samang pagkakaugnay ng kasalukuyang bayan sa mga naunang salinlahi.
- source_word: הֵזִידוּ
  choice: kumilos nang may kapalaluan
  rationale: Ipinakikita ng pandiwa ang mapagmataas, pangahas, o palalong pagkilos, hindi lamang isang panloob na ugali.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: nagmatigas
  rationale: Natural na salin sa Filipino ng idyomang Hebreo tungkol sa pagpapatigas ng leeg; malinaw nitong ipinahahayag ang sutil at mapaghimagsik na pagtanggi.
- source_word: וְלֹא שָׁמְעוּ אֶל
  choice: at hindi nakinig
  rationale: Pinananatili ang pangunahing diwa ng שׁמע na “makinig,” habang ipinahihiwatig ng layong “mga utos” ang hindi pagsunod.
- source_word: מִצְוֺתֶיךָ
  choice: sa iyong mga utos
  rationale: Ang “mga utos” ay malinaw at dignified na katumbas ng pangngalang tumutukoy sa mga ipinag-uutos ng Diyos.
theological_decisions:
- issue: Sama-samang pagkakakilanlan sa makasalanang naunang salinlahi
  choice: ang aming mga ninuno
  alternative: ang aming mga ama
  rationale: Pinananatili ng “aming mga ninuno” ang hayagang pagkakaugnay ng nananalangin at ng kasalukuyang pamayanan sa mga naunang salinlahi, nang hindi nililimitahan ang tinutukoy sa agarang mga ama lamang.
- issue: Pakikinig bilang pagsunod
  choice: hindi nakinig
  alternative: hindi sumunod
  rationale: Pinananatili ang pandinig na larawan ng Hebreo at hindi tahasang pinapalitan ito ng interpretatibong resulta na “sumunod,” bagaman likas na kasama sa konteksto ang pagsuway.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “nagmatigas” upang maging natural ang idyomang Hebreo, habang inilagay sa talababa ang literal na larawan. Ang mga gitling na em dash ay nililinaw na ang “aming mga ninuno” ang tinutukoy ng “sila.”
