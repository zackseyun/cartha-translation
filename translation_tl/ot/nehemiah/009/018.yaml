base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/018.yaml
  text: Even when they made for themselves a cast metal calf and said[a], ‘This is your god who brought you up out of Egypt,’ and committed great blasphemies[b],
translation:
  language: tl
  text: Kahit na gumawa sila para sa kanilang sarili ng isang guyang hinulma mula sa tunaw na metal[a] at sinabi, “Ito ang diyos mo na nag-ahon sa iyo mula sa Ehipto,” at gumawa sila ng matitinding paglapastangan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang guyang hinulma.”
    reason: lexical_alternative
  - marker: b
    text: O “matitinding pang-uudyok sa galit” o “matitinding gawang mapanghamak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: Kahit
  rationale: 'Ipinahahayag nito ang konsesibong diwa ng sugnay: nagpatuloy ang awa ng Diyos sa kabila ng paghihimagsik ng bayan. Likas at malinaw ang “Kahit” sa makabagong Tagalog.'
- source_word: עָשׂוּ לָהֶם
  choice: gumawa sila para sa kanilang sarili
  rationale: 'Pinananatili nito ang reflexive na diwa ng לָהֶם: gumawa sila ng diyus-diyosan para sa sarili nilang paggamit at pagsamba.'
- source_word: עֵגֶל מַסֵּכָה
  choice: isang guyang hinulma sa metal
  rationale: Ang מַסֵּכָה ay tumutukoy sa imaheng ginawa sa pamamagitan ng paghuhulma o pagbubuhos ng metal. Malinaw sa karaniwang mambabasa ang salin nang hindi gumagamit ng lipas na pananalita.
- source_word: זֶה אֱלֹהֶיךָ
  choice: Ito ang diyos mo
  rationale: Sinusunod ng pang-isahang “diyos mo” ang pang-isahang demonstratibo at hulaping nasa Hebreo. Maliit ang titik sa “diyos” sapagkat ang tinutukoy ay ang guyang diyus-diyosan.
- source_word: אֲשֶׁר הֶעֶלְךָ מִמִּצְרָיִם
  choice: na nag-ahon sa iyo mula sa Ehipto
  rationale: Pinananatili ng “nag-ahon” ang larawang nasa pandiwang עלה at ang pormulang tumutukoy sa paglabas mula sa Ehipto.
- source_word: וַיַּעֲשׂוּ נֶאָצוֹת גְּדֹלוֹת
  choice: gumawa pa rin sila ng matitinding paglapastangan
  rationale: Natural na ipinahahayag ng “gumawa … ng” ang kilos, samantalang ipinakikita ng “matitinding paglapastangan” ang mabibigat na gawang humahamak sa Diyos. Ang “pa rin” ay nililinaw ang nagpapatuloy na konsesibong ugnayan ng sugnay.
theological_decisions:
- issue: Ang tinutukoy ng אֱלֹהֶיךָ sa pahayag tungkol sa guyang ginto
  choice: diyos mo
  alternative: Diyos mo
  rationale: Ang tinutukoy ay ang ginawang guya, kaya iniiwasan ng maliit na titik ang pagpapahiwatig na lehitimong kinikilala ng teksto ang diyus-diyosan bilang ang tunay na Diyos, habang pinananatili ang mismong pag-aangkin ng mga tao.
- issue: Diwa ng נֶאָצוֹת bilang pagkakasalang laban sa Diyos
  choice: matitinding paglapastangan
  alternative: matitinding pang-uudyok sa galit; matitinding gawang mapanghamak
  rationale: Saklaw ng salita ang mga gawang humahamak at lumalait sa Diyos. Ang “paglapastangan” ay angkop sa konteksto ng pagsamba sa diyus-diyosan ngunit hindi ikinakaila na maaari ring idiin ng Hebreo ang pang-uudyok sa galit o mapanghamak na pagkilos.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “guya” at “hinulma sa metal” para madaling maunawaan ang anyo at paraan ng paggawa sa diyus-diyosan. Inilagay ang panandang [a] kaagad pagkatapos ng pariralang tinutukoy nito, sa halip na pagkatapos ng pandiwang “nagsabi.”
