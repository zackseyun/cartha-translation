id: NEH.9.7
reference: Nehemiah 9:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַתָּה הוּא֙ יְהוָ֣ה הָ/אֱלֹהִ֔ים אֲשֶׁ֤ר בָּחַ֨רְתָּ֙ בְּ/אַבְרָ֔ם וְ/הוֹצֵאת֖/וֹ מֵ/א֣וּר כַּשְׂדִּ֑ים וְ/שַׂ֥מְתָּ שְּׁמ֖/וֹ אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/007.yaml
  text: You are Yahweh God[a], who chose Abram, brought him out from Ur of the Chaldeans, and gave him the name Abraham.
translation:
  language: tl
  text: Ikaw ang Yahweh[a] na Diyos na pumili kay Abram, naglabas sa kanya mula sa Ur ng mga Caldeo, at nagbigay sa kanya ng pangalang Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay gumagamit dito ng banal na pangalang YHWH.
    reason: Nililinaw na ang “Yahweh” ay pagsasalin-titik ng personal na banal na pangalan.
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: Ikaw ang
  rationale: Ipinahahayag nito sa natural na Tagalog ang mariing pagkakakilanlan sa Hebreo nang hindi gumagamit ng alanganing literal na anyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: הָאֱלֹהִים
  choice: na Diyos
  rationale: Binibigyang-kahulugan nito ang Yahweh bilang Diyos at pinananatili ang dalawang sangkap ng pariralang Hebreo sa natural na ayos ng Tagalog.
- source_word: בָּחַרְתָּ בְּאַבְרָם
  choice: pumili kay Abram
  rationale: Ang “pumili” ay payak at tumpak; ang pang-ukol sa Hebreo ay likas na ipinahahayag sa Tagalog sa pamamagitan ng “kay.”
- source_word: וְהוֹצֵאתוֹ
  choice: naglabas sa kanya
  rationale: Tuwirang ipinahahayag ang Hiphil ng יצא, na ang Diyos ang nagpalabas o nagdala kay Abram palabas.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: mula sa Ur ng mga Caldeo
  rationale: Pinananatili ang heograpikong katawagang “Ur of the Chaldeans” sa karaniwang anyong Filipino.
- source_word: וְשַׂמְתָּ שְׁמוֹ אַבְרָהָם
  choice: nagbigay sa kanya ng pangalang Abraham
  rationale: Natural na Filipino ito para sa literal na “itinalaga mo ang pangalan niya,” at malinaw na ipinakikita ang pagpapalit ng pangalan mula Abram tungong Abraham.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang YHWH
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasan sa Hebreo ang Tetragrammaton יְהוָה. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkaibang pangalang Abram at Abraham at iniwasan ang teknikal o denominasyonal na pananalita.
