revisions:
- from: Pagkatapos ay sinabi ng mga Levita—sina Jesua, Kadmiel, Bani, Hasabneias, Serebias, Hodias, Sebanias, at Petahias—“Tumayo kayo at purihin ninyo si Yahweh na inyong Diyos, mula sa walang hanggan hanggang sa walang hanggan. At purihin nila[a] ang maluwalhati mong pangalan[b], na nakakataas sa lahat ng pagpapala at papuri.”
  to: Pagkatapos ay sinabi ng mga Levita—sina Jesua, Kadmiel, Bani, Hasabnias, Serebias, Hodias, Sebanias, at Petahias—“Tumayo kayo at purihin ninyo si Yahweh na inyong Diyos, mula sa walang hanggan hanggang sa walang hanggan. Purihin nawa nila[a] ang maluwalhati mong pangalan[b], na higit sa lahat ng pagpapala at papuri.”
  rationale: Inayos ang panghuling sugnay upang ipahayag na ang pangalan ng Diyos ay mataas o higit sa lahat ng pagpapala at papuri, sa halip na tila ito ang aktibong nagtataas. Isinaayos din ang baybay ng Hasabnias ayon sa Hebreo at ginawang “Purihin nawa nila” ang jussive upang mapanatili ang ikatlong panauhang maramihan at ang volitive na puwersa nang walang pagpapakahulugan sa di-tiyak na paksa.
