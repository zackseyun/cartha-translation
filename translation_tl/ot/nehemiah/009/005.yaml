source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ הַ/לְוִיִּ֡ם יֵשׁ֣וּעַ וְ֠/קַדְמִיאֵל בָּנִ֨י חֲשַׁבְנְיָ֜ה שֵׁרֵֽבְיָ֤ה הֽוֹדִיָּה֙ שְׁבַנְיָ֣ה פְתַֽחְיָ֔ה ק֗וּמוּ בָּרֲכוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם מִן הָ/עוֹלָ֖ם עַד הָ/עוֹלָ֑ם וִ/יבָֽרְכוּ֙ שֵׁ֣ם כְּבוֹדֶ֔/ךָ וּ/מְרוֹמַ֥ם עַל כָּל בְּרָכָ֖ה וּ/תְהִלָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/005.yaml
  text: Then the Levites—Jeshua[a], Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah—said, “Stand up; bless Yahweh your God from everlasting to everlasting. Blessed be your glorious name[b], which is exalted above all blessing and praise.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ng mga Levita—sina Jesua, Kadmiel, Bani, Hasabnias, Serebias, Hodias, Sebanias, at Petahias—“Tumayo kayo at purihin ninyo si Yahweh na inyong Diyos, mula sa walang hanggan hanggang sa walang hanggan. Purihin nawa nila[a] ang maluwalhati mong pangalan[b], na higit sa lahat ng pagpapala at papuri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At purihin nila.” Ang pandiwang Hebreo ay nasa ikatlong panauhang maramihan at may diwang paghiling o pag-uutos; hindi tahasang tinutukoy kung sino ang “nila.”
    reason: alternative_reading
  - marker: b
    text: Sa literal, “ang pangalan ng iyong kaluwalhatian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הַלְוִיִּם
  choice: Pagkatapos ay sinabi ng mga Levita
  rationale: Ipinahahayag ng “Pagkatapos” ang pagsulong ng salaysay na dala ng waw-consecutive, habang pinananatili ang tahasang paksa.
- source_word: יֵשׁוּעַ וְקַדְמִיאֵל בָּנִי חֲשַׁבְנְיָה שֵׁרֵבְיָה הוֹדִיָּה שְׁבַנְיָה פְתַחְיָה
  choice: sina Jesua, Kadmiel, Bani, Hasabneias, Serebias, Hodias, Sebanias, at Petahias
  rationale: Isina-Filipino ang baybay ng mga pangalang Hebreo para sa natural na pagbasa, nang hindi pinapalitan ang kanilang pagkakakilanlan.
- source_word: קוּמוּ
  choice: Tumayo kayo
  rationale: Tuwirang maramihang pautos ito sa kapulungan at likas sa modernong Filipino.
- source_word: בָּרֲכוּ
  choice: purihin ninyo
  rationale: Kapag Diyos ang layon, likas na ipinahahayag ng “purihin” sa Filipino ang pagpupuri o pagdakila na saklaw ng piel ng ברך; iniiwasan nito ang karaniwang diwang tila nagbibigay ang tao ng biyaya sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan na tahasang nasa tekstong Hebreo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Pinananatili ang ikalawang panauhang maramihang pag-aari at ang tuwirang pakikipag-usap sa bayan.
- source_word: מִן הָעוֹלָם עַד הָעוֹלָם
  choice: mula sa walang hanggan hanggang sa walang hanggan
  rationale: Inihahatid nito ang idyomang Hebreo para sa panahong walang hanggan sa marangal at pamilyar na Filipino.
- source_word: וִיבָרְכוּ
  choice: At purihin nila
  rationale: Ang anyong Hebreo ay ikatlong panauhang maramihan na may volitive/jussive na puwersa. Pinananatili ang pagbabago mula sa “ninyo” tungo sa “nila” sa halip na tahimik na gawing pang-isahang pasibo.
- source_word: שֵׁם כְּבוֹדֶךָ
  choice: ang maluwalhati mong pangalan
  rationale: Natural na Filipino ito para sa literal na “pangalan ng iyong kaluwalhatian,” habang pinananatili ang ugnayan ng pangalan at kaluwalhatian.
- source_word: וּמְרוֹמַם עַל כָּל בְּרָכָה וּתְהִלָּה
  choice: na nakakataas sa lahat ng pagpapala at papuri
  rationale: Ipinahahayag nito na ang pangalan ng Diyos ay higit sa anumang pagpapala at papuring maihahandog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan mismo ang nasa Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Pagbabago ng panauhan sa וִיבָרְכוּ
  choice: At purihin nila
  alternative: Purihin ang iyong maluwalhating pangalan / Pagpalain nawa ang iyong maluwalhating pangalan
  rationale: Malinaw na ikatlong panauhang maramihan ang anyong Masoretiko. Hindi ito ginawang pang-isahan upang hindi alisin ang tunay na tensiyon sa gramatika at di-tiyak na tinutukoy ng “nila.”
- issue: ברך kapag Diyos ang layon
  choice: purihin
  alternative: pagpalain
  rationale: Ang “purihin” ang likas na Filipino para sa pagkilala at pagdakila sa Diyos sa kontekstong liturhikal; hindi nito ipinahihiwatig na ang tao ang pinagmumulan ng biyayang ibinibigay sa Diyos.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa pampublikong pagsamba. Ginamit ang “sina” upang malinaw na ipakilala ang talaan ng mga Levita. Pinanatili ang pagbabago ng panauhan sa Hebreo at nilinaw ito sa talababa sa halip na pakinisin ang tensiyong gramatikal.
