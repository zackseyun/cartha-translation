id: NEH.9.37
reference: Nehemiah 9:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/תְבוּאָתָ֣/הּ מַרְבָּ֗ה לַ/מְּלָכִ֛ים אֲשֶׁר נָתַ֥תָּה עָלֵ֖י/נוּ בְּ/חַטֹּאותֵ֑י/נוּ וְ/עַ֣ל גְּ֠וִיֹּתֵי/נוּ מֹשְׁלִ֤ים וּ/בִ/בְהֶמְתֵּ֨/נוּ֙ כִּ/רְצוֹנָ֔/ם וּ/בְ/צָרָ֥ה גְדוֹלָ֖ה אֲנָֽחְנוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/037.yaml
  text: Its abundant produce goes to the kings whom you have set over us because of our sins[a]. They rule over our bodies and over our livestock as they please[b], and we are in great distress.
translation:
  language: tl
  text: Ang masaganang ani nito[a] ay napupunta sa mga haring inilagay mong mamuno sa amin dahil sa aming mga kasalanan. Pinaghaharian nila ang aming mga katawan[b] at ang aming mga alagang hayop ayon sa kanilang kagustuhan, at nasa matinding kagipitan kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bunga nito” o “ani ng lupa”; ang “nito” ay tumutukoy sa lupaing binanggit sa naunang talata.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “aming buong pagkatao”; literal na “aming mga katawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְבוּאָתָהּ
  choice: ang masaganang ani nito
  rationale: Ang תְּבוּאָה ay ani o bunga ng lupain, at ang hulaping pambabae ay tumutukoy sa lupaing binanggit sa naunang talata. Likas sa Filipino ang “ani nito” at malinaw ang kaugnayan nito sa lupain.
- source_word: מַרְבָּה
  choice: masaganang
  rationale: Ipinahihiwatig ng anyo ang pagdami o kasaganaan. Ang “masaganang” ay natural na panuring sa “ani” at pinananatili ang diwa ng malaking pakinabang mula sa lupa.
- source_word: לַמְּלָכִים
  choice: ay napupunta sa mga hari
  rationale: Ang לְ ay nagsasaad ng patutunguhan o nakikinabang. Malinaw na ipinahahayag ng “napupunta sa” na ang ani ay napapakinabangan ng mga hari.
- source_word: אֲשֶׁר נָתַתָּה עָלֵינוּ
  choice: inilagay mong mamuno sa amin
  rationale: Ang נתן na may עַל ay maaaring mangahulugang maglagay o magtalaga ng isang tao sa ibabaw ng iba. Natural sa modernong Filipino ang pariralang ito at pinananatili nito ang tuwirang pagkilos ng Diyos.
- source_word: בְּחַטֹּאותֵינוּ
  choice: dahil sa aming mga kasalanan
  rationale: Sanhi ang gamit ng בְּ sa kontekstong ito. Tuwirang ipinapakita ng “dahil sa” ang ugnayan ng kanilang mga kasalanan at ng pagpapasakop sa kanila.
- source_word: גְּוִיֹּתֵינוּ
  choice: aming mga katawan
  rationale: Ang גְּוִיָּה ay maaaring tumukoy sa katawan. Dito ay tumutukoy ito sa pisikal na pagkatao ng mga mamamayan na nasa ilalim ng kapangyarihan ng mga hari, hindi sa mga bangkay.
- source_word: מֹשְׁלִים
  choice: Pinaghaharian nila
  rationale: Nagsasaad ang participle ng nagpapatuloy na pamamahala. Pinananatili ng “pinaghaharian” ang lakas ng pahayag at ang mapaniil na konteksto nang hindi dinaragdagan ang kahulugan.
- source_word: וּבִבְהֶמְתֵּנוּ
  choice: at ang aming mga alagang hayop
  rationale: Ang בְּהֵמָה ay kolektibong tumutukoy sa mga domestikadong hayop. Karaniwan at malawak ang “mga alagang hayop,” bagaman maaari ring sabihing “mga hayop na pag-aari namin.”
- source_word: כִּרְצוֹנָם
  choice: ayon sa kanilang kagustuhan
  rationale: Ipinapakita ng parirala na ginagamit ng mga hari ang kapangyarihan alinsunod sa sarili nilang kalooban. Dignified at tuwiran ang “ayon sa kanilang kagustuhan.”
- source_word: וּבְצָרָה גְדוֹלָה אֲנָחְנוּ
  choice: at nasa matinding kagipitan kami
  rationale: Ang צָרָה ay kagipitan, kapighatian, o matinding suliranin. Ang “matinding kagipitan” ay natural at angkop sa bigat ng panaghoy ng buong bayan.
theological_decisions:
- issue: Pagkilos ng Diyos sa pamamahala ng mga dayuhang hari
  choice: Tuwirang sinasabi na inilagay ng Diyos ang mga hari upang mamuno sa bayan dahil sa kanilang mga kasalanan.
  alternative: Pinahintulutan lamang ng Diyos ang mga hari; o sinasang-ayunan ng Diyos ang lahat ng kanilang mapaniil na ginagawa.
  rationale: Tuwirang iniuugnay ng נָתַתָּה עָלֵינוּ sa Diyos ang pagpapasakop ng bayan bilang bunga ng kanilang mga kasalanan. Pinananatili ito ng salin ngunit hindi nito ipinahihiwatig na sinasang-ayunan ng Diyos ang lahat ng pang-aabuso ng mga hari.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “pinaghaharian” upang maipakita ang aktuwal at mabigat na kapangyarihan ng mga hari, samantalang ang “matinding kagipitan” ay nagpapanatili sa tono ng panaghoy. Parehong nakalagay sa pangunahing teksto ang mga panandang [a] at [b].
