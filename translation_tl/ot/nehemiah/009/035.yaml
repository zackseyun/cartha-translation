id: NEH.9.35
reference: Nehemiah 9:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הֵ֣ם בְּ/מַלְכוּתָ/ם֩ וּ/בְ/טוּבְ/ךָ֨ הָ/רָ֜ב אֲשֶׁר נָתַ֣תָּ לָ/הֶ֗ם וּ/בְ/אֶ֨רֶץ הָ/רְחָבָ֧ה וְ/הַ/שְּׁמֵנָ֛ה אֲשֶׁר נָתַ֥תָּ לִ/פְנֵי/הֶ֖ם לֹ֣א עֲבָד֑וּ/ךָ וְֽ/לֹא שָׁ֔בוּ מִ/מַּֽעַלְלֵי/הֶ֖ם הָ/רָעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/035.yaml
  text: Even in their kingdom[a], and amid your great goodness that you gave them, and in the broad and fertile land that you set before them[d][c][b], they did not serve you and did not turn from their evil deeds.
translation:
  language: tl
  text: Sa sarili nilang kaharian, sa gitna ng dakila mong kabutihang ibinigay mo sa kanila, at sa malawak at matabang lupaing inilagay mo sa harapan nila[a], hindi sila naglingkod sa iyo[b] ni tinalikuran ang kanilang masasamang gawa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “malawak at matabang lupain”; ang “mataba” ay karaniwang larawan para sa lupaing mayaman at mabunga.
    reason: cultural_note
  - marker: b
    text: Maaari ring “sumamba sa iyo”; saklaw ng salitang Hebreo ang pagsamba at paglilingkod.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “hindi nagsisi at tumalikod mula sa kanilang masasamang gawa”; literal, “hindi tumalikod mula sa kanilang masasamang gawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַלְכוּתָם
  choice: nasa sarili na silang kaharian
  rationale: Ipinahahayag ng מַלְכוּת ang kanilang kalagayan bilang isang bayang may sariling kaharian o paghahari. Nililinaw ng “sarili” ang hulaping panghalip na “kanila” nang hindi nililimitahan ang salita sa pagkahari lamang.
- source_word: וּבְטוּבְךָ הָרָב
  choice: tinatamasa ang dakila mong kabutihan
  rationale: Maaaring tumukoy ang טוּב sa kabutihan at sa masaganang biyayang bunga nito. Ang “tinatamasa” ay likas na Filipino para sa pamumuhay sa gitna ng kabutihang ipinagkaloob ng Diyos.
- source_word: אֲשֶׁר נָתַתָּ לָהֶם
  choice: ipinagkaloob mo sa kanila
  rationale: Tapat itong nagpapahayag ng pagbibigay ng Diyos at ang “ipinagkaloob” ay angkop sa marangal na rehistro ng panalangin.
- source_word: אֶרֶץ הָרְחָבָה וְהַשְּׁמֵנָה
  choice: malawak at matabang lupain
  rationale: Ang רְחָבָה ay “malawak,” samantalang ang שְׁמֵנָה ay literal na “mataba” at karaniwang tumutukoy sa lupaing mataba o mabunga. Likas din sa Filipino ang “matabang lupain.”
- source_word: אֲשֶׁר נָתַתָּ לִפְנֵיהֶם
  choice: na inilagay mo sa harapan nila
  rationale: Pinananatili nito ang konkretong larawan ng לִפְנֵי, “sa harapan nila,” at ang diwa na inihanda o iniharap sa kanila ang lupain.
- source_word: לֹא עֲבָדוּךָ
  choice: hindi sila naglingkod sa iyo
  rationale: Saklaw ng עבד ang paglilingkod na may kasamang pagsamba at pagsunod. Ang “naglingkod” ang pinakamalawak at pinakadirektang katumbas.
- source_word: וְלֹא שָׁבוּ
  choice: hindi tumalikod
  rationale: Ang שׁוב na sinusundan ng מִן ay literal na pagtalikod o paglayo mula sa isang bagay. Pinananatili ng salin ang kongkretong larawan sa halip na agad itong gawing terminong teolohikal na “magsisi.”
- source_word: מִמַּעַלְלֵיהֶם הָרָעִים
  choice: sa kanilang masasamang gawa
  rationale: Ang מַעֲלָלִים ay mga gawa, kilos, o gawi. Ang “masasamang gawa” ay malinaw, natural, at tapat sa moral na pagtataya ng הָרָעִים.
theological_decisions:
- issue: Saklaw ng עבד kapag Diyos ang pinaglilingkuran
  choice: naglingkod sa iyo
  alternative: sumamba sa iyo
  rationale: Kasama sa pandiwa ang pagsamba ngunit hindi lamang ritwal na pagsamba; maaari rin itong tumukoy sa mas malawak na katapatan at pagsunod sa tipan. Pinananatili ng “naglingkod” ang lawak na ito.
- issue: Moral na diwa ng שׁוב מִן
  choice: hindi tumalikod sa kanilang masasamang gawa
  alternative: hindi nagsisi sa kanilang masasamang gawa
  rationale: Ang “tumalikod” ay malapit sa konkretong wika ng Hebreo at hindi tahimik na pinapalitan iyon ng mas teknikal na konsepto ng pagsisisi, bagaman kabilang ang pagsisisi sa diwa nito.
- issue: Kabutihan bilang banal na katangian o masaganang kaloob
  choice: dakila mong kabutihang ipinagkaloob mo sa kanila
  alternative: sagana mong biyaya na ibinigay mo sa kanila
  rationale: Maaaring saklawin ng טוּב ang kabutihan ng Diyos at ang kasaganaang ipinagkakaloob niya. Pinananatili ng “kabutihan” ang dalawang posibilidad sa halip na ituon lamang sa materyal na biyaya.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panalanging pampubliko. Gumamit ng natural na ayos at bokabularyong madaling maunawaan, habang pinananatili ang paralelismo ng talata at ang mga larawang “matabang lupain,” “sa harapan nila,” at “tumalikod.”
