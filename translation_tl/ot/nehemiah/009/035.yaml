revisions:
- from: Kahit nasa sarili na silang kaharian, at tinatamasa ang dakila mong kabutihang ipinagkaloob mo sa kanila, at naninirahan sa malawak at matabang lupain[a] na inilagay mo sa harapan nila, hindi sila naglingkod sa iyo[b] at hindi tumalikod sa kanilang masasamang gawa.[c]
  to: Sa sarili nilang kaharian, sa gitna ng dakila mong kabutihang ibinigay mo sa kanila, at sa malawak at matabang lupaing inilagay mo sa harapan nila[a], hindi sila naglingkod sa iyo[b] ni tinalikuran ang kanilang masasamang gawa.[c]
  rationale: Inalis ang mga pandiwang nagdaragdag ng diwa at inayos ang pangungusap upang maipakita ang tatlong magkakahanay na kalagayan sa Hebreo. Pinalitan ang “hindi tumalikod sa” ng “ni tinalikuran ang” para sa mas natural na daloy sa Filipino, nang hindi binabago ang kahulugan. Nilinaw rin ang talababa tungkol sa pagsisisi upang hindi ito mabasang simpleng kawalan ng pagsisisi o panghihinayang.
