base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/034.yaml
  text: Even our kings[a], our officials, our priests, and our fathers did not keep your law[c][b], and they did not listen to your commandments and your testimonies with which you warned them.
translation:
  language: tl
  text: Maging ang aming mga hari, mga pinuno, mga pari, at mga ninuno[a] ay hindi tumupad sa iyong kautusan at hindi nakinig sa iyong mga utos at sa iyong mga patotoo[b] na sa pamamagitan ng mga ito ay binalaan mo sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “aming mga ama.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ang “mga patotoo” ay tumutukoy sa tipanang pagsaksi at taimtim na mga babala o tagubilin ng Diyos. Maaari ring isalin ang parirala: “na ipinatotoo mo laban sa kanila.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Maging
  rationale: 'Ipinahahayag nito sa natural na Tagalog ang pandagdag at bahagyang pagdidiing ng parirala: maging ang mga pangunahing pinuno ay nagkasala rin.'
- source_word: מְלָכֵינוּ
  choice: aming mga hari
  rationale: Tuwirang salin ng pangngalang maramihan na may hulaping unang panauhang maramihan.
- source_word: שָׂרֵינוּ
  choice: mga pinuno
  rationale: Saklaw ng שׂרים ang mga namumuno at mataas na opisyal; mas natural at malawak sa modernong Tagalog ang “mga pinuno” kaysa “mga prinsipe.”
- source_word: כֹּהֲנֵינוּ
  choice: mga pari
  rationale: Karaniwang salin ng כֹּהֵן sa konteksto ng Israel.
- source_word: וַאֲבֹתֵינוּ
  choice: mga ninuno
  rationale: Bagaman literal na “aming mga ama,” tumutukoy rito ang אָבוֹת sa mga naunang salinlahi; malinaw at natural sa modernong Tagalog ang “mga ninuno,” habang inilalagay sa talababa ang literal na anyo.
- source_word: לֹא עָשׂוּ תּוֹרָתֶךָ
  choice: hindi tumupad sa iyong kautusan
  rationale: Ang עשה kasama ng תּוֹרָה ay nangangahulugang isagawa o sundin; ang “tumupad sa” ay idiomatiko at pinananatili ang tipanang diwa ng kautusan.
- source_word: הִקְשִׁיבוּ
  choice: hindi nakinig sa
  rationale: Ang Hiphil ng קשׁב ay tumutukoy sa masusing pakikinig o pagbibigay-pansin; ang “nakinig sa” ay tuwiran, natural, at maaari ring magpahiwatig ng pagsunod.
- source_word: מִצְוֺתֶיךָ
  choice: iyong mga utos
  rationale: Malinaw at karaniwang salin ng מִצְוֹת, at naiiba pa rin sa mas malawak na “kautusan.”
- source_word: וּלְעֵדְוֺתֶיךָ
  choice: at sa iyong mga patotoo
  rationale: Pinananatili ng “mga patotoo” ang tipanang saksi o taimtim na pahayag ng עֵדוֹת at ang kaugnayan nito sa kasunod na pandiwa mula sa parehong salitang-ugat.
- source_word: אֲשֶׁר הַעִידֹתָ בָהֶם
  choice: na ipinangbabala mo sa kanila
  rationale: Sa kontekstong ito, ang Hiphil ng עוד ay may diwang taimtim na pagbababala o pagpapatotoo laban sa kanila. Pinananatili ng “ipinangbabala” ang instrumental na ugnayan sa mga patotoo nang hindi pinipilit ang alanganing literal na ayos.
theological_decisions:
- issue: Kahulugan ng תּוֹרָה
  choice: iyong kautusan
  alternative: iyong aral
  rationale: Sa pambansang pagtatapat na ito, tumutukoy ang תּוֹרָה sa tipanang kautusan ng Diyos, hindi lamang sa pangkalahatang pagtuturo.
- issue: Kahulugan ng אָבוֹת
  choice: mga ninuno
  alternative: mga ama
  rationale: Ang literal na anyo ay panlalaking “mga ama,” ngunit ang tinutukoy ay ang mga naunang salinlahi ng Israel. Ang “mga ninuno” ang natural na katumbas sa konteksto, at pinananatili sa talababa ang literal na pagbasa.
- issue: Ugnayan ng עֵדוֹת at הַעִידֹתָ
  choice: mga patotoo na ipinangbabala mo sa kanila
  alternative: mga patotoo na ipinatotoo mo laban sa kanila
  rationale: Pinananatili ng pangunahing salin ang tipanang babala at ang kaugnayan ng dalawang salitang mula sa iisang ugat, habang kinikilala sa talababa ang posibleng forensic o laban-sa-kanila na himig.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “maging” upang ihayag ang diin ng pambungad, “mga pinuno” para sa sibikong שׂרים, at “mga ninuno” para sa kontekstuwal na diwa ng אָבוֹת. Iniwasan ang makaluma o teknikal na pananalita, ngunit pinanatili ang mga tipanang katawagang “kautusan,” “mga utos,” at “mga patotoo.”
