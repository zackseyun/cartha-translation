  source_fidelity: 'Tumpak na naihahatid ng salin ang mga pangunahing elemento ng Hebreo: natagpuan/nakita ng Diyos na tapat ang puso ni Abraham sa kanyang harapan, nakipagtipan siya sa kanya, ipinangakong ibibigay ang lupain ng anim na bayang nakatala sa kanyang lahi, at tinupad niya ang kanyang mga salita sapagkat siya ay matuwid. Napanatili rin ang pag-uulit ng ''ibigay'' at ang pangmaramihang ''mga salita.'''
