source:
  edition: WLC
  text: וּ/מָצָ֣אתָ אֶת לְבָב/וֹ֮ נֶאֱמָ֣ן לְ/פָנֶי/ךָ֒ וְ/כָר֨וֹת עִמּ֜/וֹ הַ/בְּרִ֗ית לָ/תֵ֡ת אֶת אֶרֶץ֩ הַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הָ/אֱמֹרִ֧י וְ/הַ/פְּרִזִּ֛י וְ/הַ/יְבוּסִ֥י וְ/הַ/גִּרְגָּשִׁ֖י לָ/תֵ֣ת לְ/זַרְע֑/וֹ וַ/תָּ֨קֶם֙ אֶת דְּבָרֶ֔י/ךָ כִּ֥י צַדִּ֖יק אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/008.yaml
  text: You found his heart faithful before you[a], and made a covenant with him to give the land of the Canaanite, the Hittite, the Amorite, the Perizzite, the Jebusite, and the Girgashite—to give it to his offspring. And you have fulfilled your words[c][b], for you are righteous.
translation:
  language: tl
  text: Nakita mong tapat sa harap mo ang kanyang puso, at nakipagtipan ka sa kanya na ibigay ang lupain ng mga Cananeo, Heteo, Amoreo, Perezeo, Jebuseo, at Gergeseo—ibigay iyon sa kanyang lahi.[a] Tinupad mo ang iyong mga salita,[b] sapagkat matuwid ka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanyang mga inapo.” Ang salitang Hebreo ay literal na “binhi” at isang kolektibong pangngalan.
    reason: lexical_alternative
  - marker: b
    text: O “Pinagtibay mo ang iyong mga salita.”
    reason: lexical_alternative
  - marker: c
    text: O “sapagkat makatarungan ka.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָצָאתָ
  choice: Nakita mo
  rationale: Bagaman karaniwang nangangahulugang “natagpuan” ang מצא, ang “nakita” ay mas likas sa Filipino sa idyomang tumutukoy sa pagkilala ng Diyos sa panloob na kalagayan ni Abraham, nang hindi dinaragdagan ang kahulugan.
- source_word: לְבָבוֹ
  choice: ang kanyang puso
  rationale: Ang לֵבָב ay tumutukoy sa kalooban at buong panloob na pagkatao; pinananatili ng “puso” ang malinaw at nakaugaliang larawang biblikal.
- source_word: נֶאֱמָן לְפָנֶיךָ
  choice: tapat sa harap mo
  rationale: Pinananatili ng “tapat” ang diwa ng pagiging maaasahan o matatag, at ng “sa harap mo” ang relational at evaluative na pahiwatig ng literal na “sa iyong presensya.”
- source_word: וְכָרוֹת עִמּוֹ הַבְּרִית
  choice: at nakipagtipan ka sa kanya
  rationale: Ang כרת ברית ay nakaugaliang Hebreong idyoma para sa paggawa ng tipan; natural at tiyak sa Filipino ang “nakipagtipan.”
- source_word: לָתֵת ... לָתֵת
  choice: na ibigay ... ibigay iyon
  rationale: Pinananatili ang kapansin-pansing pag-uulit ng pandiwang “ibigay” sa Hebreo, habang idinaragdag lamang ang panghalip na “iyon” para sa malinaw na Filipino.
- source_word: אֶרֶץ הַכְּנַעֲנִי ... הַגִּרְגָּשִׁי
  choice: ang lupain ng mga Cananeo, Heteo, Amoreo, Perezeo, Jebuseo, at Gergeseo
  rationale: Ang mga pangalang pambansa ay kolektibong nasa isahan sa Hebreo. Ang “mga” sa Filipino ay natural na naghahayag na mga bayan ang tinutukoy, hindi anim na indibidwal.
- source_word: לְזַרְעוֹ
  choice: sa kanyang lahi
  rationale: Ang זֶרַע ay kolektibong isahan na maaaring tumukoy sa supling o mga inapo. Ang “lahi” ay maikli, natural, at naipahihiwatig ang kolektibong pagpapatuloy ng angkan.
- source_word: וַתָּקֶם אֶת דְּבָרֶיךָ
  choice: Tinupad mo ang iyong mga salita
  rationale: Sa kontekstong ito, ang קום na may “mga salita” ay tumutukoy sa pagpapatibay sa pamamagitan ng pagsasakatuparan. Ang “tinupad” ay natural at pinananatili ng “mga salita” ang pangmaramihang anyo ng Hebreo.
- source_word: כִּי צַדִּיק אָתָּה
  choice: sapagkat matuwid ka
  rationale: Ang “sapagkat” ay naghahayag ng paliwanag na diwa ng כִּי. Ang “matuwid” ay nagpapanatili sa malawak na moral at pangtipang diwa ng צַדִּיק, sa halip na paliitin ito sa kahulugang panghukuman lamang.
theological_decisions:
- issue: Kahulugan ng צַדִּיק bilang paglalarawan sa Diyos
  choice: matuwid
  alternative: makatarungan
  rationale: Parehong posible ang moral na “matuwid” at panghukumang “makatarungan.” Pinili ang “matuwid” dahil mas malawak ang saklaw nito at umaangkop sa pagpuri sa Diyos dahil sa tapat niyang pagtupad sa tipan; inilagay sa talababa ang alternatibo upang mapanatili ang leksikal na tensiyon.
- issue: Kolektibong kahulugan ng זֶרַע
  choice: lahi
  alternative: mga inapo
  rationale: Hindi tahasang nilulutas ng kolektibong isahan sa Hebreo kung bibigyang-diin ang isang supling o ang buong hanay ng mga inapo. Ang “lahi” ay nagpapanatili ng kolektibong diwa, at inilalahad sa talababa ang mas tahasang alternatibo.
- issue: Lakas ng וַתָּקֶם kaugnay ng mga salita ng Diyos
  choice: Tinupad mo
  alternative: Pinagtibay mo
  rationale: Ipinakikita ng konteksto ang pagsasakatuparan ng ipinangako, kaya natural ang “tinupad.” Gayunman, maaari ring idiin ng pandiwa ang pagtatatag o pagpapatibay, kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang “puso,” “tipan,” at “matuwid” bilang malinaw na bokabularyong biblikal. Ginamit ang karaniwang Filipino na anyo ng mga etnonimo at iniwasan ang labis na teknikal o denominasyonal na pananalita.
