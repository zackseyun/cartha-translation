  text: אחרי הֶחֱזִ֗יק מַלְכִּיָּה֙ בֶּן הַ/צֹּ֣רְפִ֔י עַד בֵּ֥ית הַ/נְּתִינִ֖ים וְ/הָ/רֹכְלִ֑ים נֶ֚גֶד שַׁ֣עַר הַ/מִּפְקָ֔ד וְ/עַ֖ד עֲלִיַּ֥ת הַ/פִּנָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/031.yaml
  text: After him Malkijah son of the goldsmith repaired as far as the house of the temple servants and the merchants, opposite the Inspection Gate, and as far as the upper room of the corner.
translation:
  language: tl
  text: Pagkatapos niya, nagkumpuni si Malkias na anak ng panday-ginto hanggang sa bahay ng mga lingkod sa templo at ng mga mangangalakal, sa tapat ng Pintuan ng Pagsisiyasat, at hanggang sa silid sa itaas na nasa panulukan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכִּיָּה
  choice: Malkias
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo na Malkiyyah.
- source_word: בֶּן הַצֹּרְפִי
  choice: anak ng panday-ginto
  rationale: Ang צֹרֵף ay tagapagdalisay o panday ng mahalagang metal; ayon sa konteksto at tradisyon ng salin, pinili ang natural na 'panday-ginto'.
- source_word: הַנְּתִינִים
  choice: mga lingkod sa templo
  rationale: Tumutukoy sa pangkat na itinalaga sa paglilingkod sa templo; mas malinaw ito sa karaniwang mambabasa kaysa transliterasyon.
- source_word: הָרֹכְלִים
  choice: mga mangangalakal
  rationale: Ang רכל ay tumutukoy sa mga naglalako o nakikipagkalakalan; 'mga mangangalakal' ang dignified at malawak na katumbas.
- source_word: שַׁעַר הַמִּפְקָד
  choice: Pintuan ng Pagsisiyasat
  rationale: Pinananatili ang diwa ng מִפְקָד bilang pag-iinspeksiyon, pagtitipon, o pagtatala nang hindi tiyak na nilulutas ang eksaktong gamit ng pangalan.
- source_word: עֲלִיַּת הַפִּנָּה
  choice: silid sa itaas na nasa panulukan
  rationale: Ang עֲלִיָּה ay silid o bahagi sa itaas, at הַפִּנָּה ay panulukan; ginawang natural ang ugnayan sa Filipino.
theological_decisions: []
