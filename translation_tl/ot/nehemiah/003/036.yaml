base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/036.yaml
  text: Hear[a], our God, for we are despised. Turn their reproach back on their own heads[c][b], and give them over as plunder in a land of captivity.
translation:
  language: tl
  text: Dinggin mo, aming Diyos, sapagkat hinahamak kami.[a] Ibalik mo sa sarili nilang ulo ang paghamak nila, at ibigay mo sila bilang samsam[b] sa isang lupain ng pagkabihag.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sapagkat kami ay naging paghamak”; maaari ring “sapagkat naging tampulan kami ng paghamak.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “upang samsamin” o “bilang masasamsam.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa lupain ng pagkabihag.” Maaaring unawain ang Hebreo bilang di-tiyak o mas tiyak ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע אֱלֹהֵינוּ
  choice: Dinggin mo kami, aming Diyos
  rationale: Ang שְׁמַע ay pautos na nakatuon sa Diyos. Bagaman walang tahasang layon sa Hebreo, likas sa makabagong Tagalog na panalangin ang “Dinggin mo kami”; malinaw na ipinahihiwatig ng konteksto ang “kami.”
- source_word: כִּי הָיִינוּ בוּזָה
  choice: sapagkat hinahamak kami
  rationale: Ang parirala ay literal na nagsasaad na sila ay naging paghamak o tampulan ng paghamak. Ang “hinahamak kami” ay natural at marangal sa Tagalog at pinananatili ang kasalukuyang kalagayang bunga ng naganap na panghahamak.
- source_word: וְהָשֵׁב חֶרְפָּתָם אֶל רֹאשָׁם
  choice: Ibalik mo sa sarili nilang ulo ang paghamak nila
  rationale: Pinananatili ang Hebreong larawan ng pagbabalik ng kanilang חֶרְפָּה sa kanilang ulo. Ang “paghamak” ay sumasaklaw sa insulto, kadustaan, at kahihiyang idinulot nila.
- source_word: וּתְנֵם לְבִזָּה
  choice: at ibigay mo sila bilang samsam
  rationale: Ang לְבִזָּה ay tumutukoy sa samsam o bagay na sinamsam. Ang “bilang samsam” ay nagpapahayag ng predikatibong diwa nang hindi pinahihina ang tuwirang panalangin para sa pagganti.
- source_word: בְּאֶרֶץ שִׁבְיָה
  choice: sa isang lupain ng pagkabihag
  rationale: Walang tiyak na pantukoy ang אֶרֶץ sa Hebreo, kaya pinanatili ang di-tiyak na “isang lupain.” Ang “pagkabihag” ay malapit sa konkretong diwa ng שִׁבְיָה at hindi ito niluluwagan tungo sa “pagkatapon.”
theological_decisions:
- issue: Tuwirang panalanging humihingi ng pagganti laban sa mga kaaway
  choice: Pinanatili ang tahasang kahilingang ibalik sa kanila ang kanilang paghamak at gawin silang samsam
  alternative: Palambutin bilang pangkalahatang kahilingan para sa katarungan o ituring lamang na talinghaga
  rationale: Tuwirang humihiling ang tekstong Hebreo ng mapagbalik na katarungan. Hindi ito dapat palambutin o bigyan ng paliwanag na wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa panalangin. Pinanatili ang matinding larawan at panawagan para sa mapagbalik na katarungan, habang iniwasan ang lipas o labis na teknikal na pananalita.
