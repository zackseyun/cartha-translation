  text: Next to them[a], Rephaiah son of Hur, ruler of half the district of Jerusalem, made repairs.
translation:
  language: tl
  text: Sa tabi nila, nagkumpuni[a] si Refaias na anak ni Hur, ang pinuno ng kalahati ng distrito ng Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpatibay.” Literal na “nagpalakas” ang pandiwang Hebreo, ngunit sa kabanatang ito ay ginagamit ito para sa pagkukumpuni ng pader.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדָם
  choice: Sa tabi nila
  rationale: Ang idyomang Hebreo ay tumutukoy sa kasunod na pangkat na gumagawa sa katabing bahagi ng pader; natural at malinaw ito sa modernong Tagalog.
- source_word: הֶחֱזִיק
  choice: nagkumpuni
  rationale: Bagaman literal na nangangahulugang “nagpalakas” ang pandiwa, ginagamit ito sa Nehemias 3 para sa pagkukumpuni o pagpapatibay ng pader.
- source_word: רְפָיָה
  choice: Refaias
  rationale: Isinalin sa baybay-Tagalog ang personal na pangalang Hebreo habang pinananatili ang pagkakakilanlan nito.
- source_word: בֶן־חוּר
  choice: anak ni Hur
  rationale: Karaniwang paraan sa Tagalog ng pagpapahayag ng patronimiko.
- source_word: שַׂר
  choice: pinuno
  rationale: Tumutukoy sa isang opisyal o tagapangasiwang may awtoridad; ang “pinuno” ay dignificado at likas sa kontekstong administratibo.
- source_word: חֲצִי פֶּלֶךְ
  choice: kalahati ng nasasakupang distrito
  rationale: Ang פֶּלֶךְ ay isang administratibong distrito, at ipinahihiwatig ng parirala na pinamamahalaan niya ang isang hati nito.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Ginamit ang nakaugaliang modernong anyo ng pangalan ng lugar sa Filipino.
