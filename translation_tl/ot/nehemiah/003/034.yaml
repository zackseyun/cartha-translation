  to: Sinabi niya sa harap ng kanyang mga kapatid at ng hukbo ng Samaria, “Ano ang ginagawa ng mga Judiong mahihina? Itatayo ba nila itong muli para sa kanilang sarili?[a] Mag-aalay ba sila ng mga hain? Matatapos ba nila ito sa loob ng isang araw? Bibigyang-buhay ba nila ang mga bato mula sa mga bunton ng alabok, kahit nasunog na ang mga ito?”
