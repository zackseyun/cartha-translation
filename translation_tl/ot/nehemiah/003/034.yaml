base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/034.yaml
  text: And he said before his brothers and the army of Samaria[a], and said, “What are these feeble Jews doing? Will they restore it for themselves? Will they sacrifice? Will they finish in a day? Will they revive the stones from the heaps of dust, though they are burned?”
translation:
  language: tl
  text: Sinabi niya sa harap ng kanyang mga kapatid at ng hukbo ng Samaria, “Ano ang ginagawa ng mga Judiong mahihina? Itatayo ba nila itong muli para sa kanilang sarili?[a] Mag-aalay ba sila ng mga hain? Matatapos ba nila ito sa loob ng isang araw? Bibigyang-buhay ba nila ang mga bato mula sa mga bunton ng alabok, kahit nasunog na ang mga ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang pariralang Hebreo. Maaari rin itong isalin na “Muli ba nila itong itatayo nang sila-sila lamang?” o, nang mas literal, “Iiwan ba nila ito para sa kanilang sarili?”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי אֶחָיו
  choice: sa harap ng kanyang mga kapatid
  rationale: Pinananatili ang literal na ‘mga kapatid,’ na maaaring tumukoy sa mga kasamahan, habang malinaw na ipinahahayag ng ‘sa harap ng’ na nagsalita siya sa kanilang presensya.
- source_word: וְחֵיל שֹׁמְרוֹן
  choice: at ng hukbo ng Samaria
  rationale: Ang חֵיל ay likas na tumutukoy rito sa hukbo o puwersang militar; ‘hukbo’ ang dignified at karaniwang salitang Filipino.
- source_word: הָאֲמֵלָלִים
  choice: mahihinang
  rationale: Ipinapanatili nito ang mapanlibak na pagtukoy sa kawalan nila ng lakas nang hindi nagdaragdag ng emosyonal na kahulugang wala sa konteksto.
- source_word: הֲיַעַזְבוּ לָהֶם
  choice: Itatayo ba nila itong muli para sa kanilang sarili?
  rationale: Mahirap at pinagtatalunang parirala ito. Ang salin ay sumusunod sa malamang na kontekstuwal na diwa ng pagpapanumbalik ng pader para sa kanilang sarili, habang inilalahad sa talababa ang mas literal at iba pang posibleng pagbasa.
- source_word: הֲיִזְבָּחוּ
  choice: Maghahandog ba sila?
  rationale: Sa kontekstong panrelihiyon, ang זבח ay paghahandog ng hain. Natural sa Filipino ang ‘maghahandog’ at napapanatili nito ang mabilis na sunod-sunod na panunuya.
- source_word: הַיְכַלּוּ בַיּוֹם
  choice: Matatapos ba nila ito sa loob ng isang araw?
  rationale: Malinaw na ipinahahayag ang diwa ng pagkumpleto at ang napakaikling panahong kinukutya ng nagsasalita.
- source_word: הַיְחַיּוּ אֶת הָאֲבָנִים
  choice: Bibigyang-buhay ba nila ang mga bato
  rationale: Pinananatili ang matingkad na metapora ng Hebrew na para bang maibabalik sa buhay ang mga nasirang bato.
- source_word: מֵעֲרֵמוֹת הֶעָפָר
  choice: mula sa mga bunton ng alabok
  rationale: Malapit sa literal na larawan ng mga bunton o tambak ng alabok, nang hindi tahasang pinapalitan ang ‘alabok’ ng interpretatibong ‘guho.’
- source_word: וְהֵמָּה שְׂרוּפוֹת
  choice: gayong sunog na ang mga iyon
  rationale: 'Ang ‘gayong’ ay natural na naghahayag ng adversatibong puwersa ng panunuya: inaasahan nilang buhayin ang mga bato kahit napinsala na ng apoy.'
