    issue: “sunog na ang mga iyon”
    rationale: Sa modernong Filipino, maaari itong unawain bilang kasalukuyang nasusunog. Ang pandiwang Hebreo ay naglalarawan sa mga batong naging sunog na o napinsala ng apoy; “nasunog na” ang mas tumpak.
