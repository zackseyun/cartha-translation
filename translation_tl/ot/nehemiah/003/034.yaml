    issue: “mahihinang Judiong ito”
    rationale: Nauunawaan ito, ngunit mas maayos ang ayos na “mga Judiong mahihina” para sa pangmaramihang pangngalan at pang-uri sa natural na Filipino.
  - severity: low
    issue: “Maghahandog ba sila?”
    rationale: Posible ang walang layon, ngunit ang “Mag-aalay ba sila ng mga hain?” ay mas malinaw na tumutukoy sa sakripisyong nasa Hebreo.
