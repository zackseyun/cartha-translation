  naturalness: Natural sa pangkalahatan ang rehistro. Mas malinaw at mas likas ang “mga Judiong mahihina” kaysa “mahihinang Judiong ito,” at ang “mga hain” ay ginagawang tahasan ang sakripisyong ipinahihiwatig ng זבח.
  terminology: Pinanatili ang “Samaria,” “mga kapatid,” at “mga bato.” Isinalin ang זבח bilang pag-aalay ng “mga hain,” isang malinaw at angkop na terminong panrelihiyon nang walang idinagdag na doktrinal na kahulugan.
  issues:
