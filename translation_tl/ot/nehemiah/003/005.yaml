  yaml_path: translation/ot/nehemiah/003/005.yaml
  text: And next to them the Tekoites made repairs[b][a], but their nobles would not put their necks to the work of their lords.
translation:
  language: tl
  text: Sa tabi nila, nagkumpuni ang mga taga-Tekoa. Ngunit ayaw pasanin ng kanilang mga pinuno[a] ang gawain ng kanilang mga panginoon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga maharlika” o “mga pangunahing tao.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi nila dinala ang kanilang leeg sa gawain ng kanilang mga panginoon”—isang idyoma para sa pagtangging magpasakop o makibahagi sa paggawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Kasunod nila
  rationale: Sa talaan ng pagkukumpuni sa Nehemias 3, ang idyomang ito ay tumutukoy sa katabing bahagi sa pagkakasunod-sunod ng gawain. Natural sa Filipino ang “Kasunod nila.”
- source_word: הֶחֱזִיקוּ
  choice: nagkumpuni
  rationale: Bagaman ang ugat ay maaaring mangahulugang “palakasin” o “hawakan,” sa kontekstong ito tumutukoy ito sa pagkukumpuni ng pader.
- source_word: הַתְּקוֹעִים
  choice: ang mga taga-Tekoa
  rationale: Ang anyong gentiliko ay tumutukoy sa mga naninirahan o nagmula sa Tekoa; ito ang malinaw at karaniwang paraan sa Filipino.
- source_word: וְאַדִּירֵיהֶם
  choice: kanilang mga pinuno
  rationale: Ang salita ay maaaring tumukoy sa mga maharlika, makapangyarihan, o pangunahing tao. Ang “mga pinuno” ay natural at hindi labis na nagtatakda ng uri ng katayuang panlipunan; inilalahad sa talababa ang “mga maharlika” bilang alternatibo.
- source_word: לֹא הֵבִיאוּ צַוָּרָם
  choice: ayaw pasanin
  rationale: Literal na “hindi nila dinala ang kanilang leeg,” isang larawang kaugnay ng pagpapasakop sa pamatok at pagtanggap ng paggawa. Ang “ayaw pasanin” ay naghahatid ng sinasadyang pagtanggi at ng larawang paggawa nang hindi nagiging malabo sa modernong Filipino.
- source_word: בַּעֲבֹדַת
  choice: ang gawaing iniatas
  rationale: Ang עֲבֹדָה ay tumutukoy rito sa gawaing pagkukumpuni. Idinagdag ang “iniatas” upang natural na maiugnay ang paggawa sa mga taong nangangasiwa, nang hindi binabago ang diwang panlipunan ng parirala.
- source_word: אֲדֹנֵיהֶם
  choice: kanilang mga panginoon
  rationale: Pinananatili ang maramihang anyo at ang pahiwatig ng mga taong may awtoridad. Hindi ito pinapantay sa isahang banal na titulong “Panginoon.”
theological_decisions:
- issue: Tinutukoy ng “kanilang mga panginoon”
  choice: mga taong nakatataas o nangangasiwa sa gawaing muling pagtatayo
  alternative: ang gawain ng Panginoon, na bunga ng interpretatibong pagpapakinis sa isahang banal na kahulugan
  rationale: Maramihan ang Hebreo, kaya pinanatili ang “mga panginoon” at hindi ito ginawang pagtukoy sa Diyos. Gayunman, hindi tinutukoy ng talata ang eksaktong opisina ng mga nakatataas na ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang puna sa kusang pagtanggi ng mga pinuno at ang maramihang “mga panginoon,” habang inilagay sa talababa ang literal na idyoma tungkol sa leeg.
