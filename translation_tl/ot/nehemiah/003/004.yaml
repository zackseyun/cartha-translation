- from: Kasunod nila, nagkumpuni[a] si Meremot na anak ni Uriya at apo ni Hakoz. Kasunod nila[b], nagkumpuni si Mesulam na anak ni Berekya at apo ni Mesezabel. Kasunod nila, nagkumpuni si Zadok na anak ni Baana.
  to: Kasunod nila[b], nagkumpuni[a] si Meremot na anak ni Uriya na anak ni Hakoz. Kasunod nila, nagkumpuni si Mesulam na anak ni Berekya na anak ni Mesezabel. Kasunod nila, nagkumpuni si Zadok na anak ni Baana.
