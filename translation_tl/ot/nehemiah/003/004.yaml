base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/004.yaml
  text: And next to them Meremoth son of Uriah[a], son of Hakkoz, made repairs; and next to them Meshullam son of Berechiah, son of Meshezabel, made repairs[c][b]; and next to them Zadok son of Baana made repairs.
translation:
  language: tl
  text: Kasunod nila[b], nagkumpuni[a] si Meremot na anak ni Uriya na anak ni Hakoz. Kasunod nila, nagkumpuni si Mesulam na anak ni Berekya na anak ni Mesezabel. Kasunod nila, nagkumpuni si Zadok na anak ni Baana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpatibay.” Ang pandiwang Hebreo ay paulit-ulit na ginagamit sa kabanatang ito bilang takdang katawagan sa pagkukumpuni ng isang bahagi ng pader.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa tabi ng kanilang kamay,” isang idyomang nangangahulugang “katabi nila” o “kasunod nila” sa hanay ng mga gumagawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Kasunod nila
  rationale: Idyoma itong literal na tumutukoy sa tabi ng kanilang kamay, ngunit sa talaan ng Nehemias 3 ay nagpapahiwatig ng pagkakasunod at pagkakatabi ng mga pangkat na gumagawa sa pader. Likas sa Filipino ang “Kasunod nila” at napananatili nito ang ayos ng pagkukumpuni.
- source_word: הֶחֱזִיק
  choice: nagkumpuni
  rationale: Sa konstruksiyong ito, ang pandiwa ay may diwang pagpapatibay o pagkukumpuni. Sa konteksto ng kabanata, tumutukoy ito sa paggawa sa isang bahagi ng pader; maikli at natural ang “nagkumpuni.”
- source_word: בֶּן
  choice: anak ni / apo ni
  rationale: Ang unang בֶּן ay isinaling “anak ni.” Sa sunod-sunod na pormulang “X anak ni Y anak ni Z,” ginawang “anak ni Y at apo ni Z” upang maging malinaw at natural sa Filipino nang hindi binabago ang ugnayang talaangkanan.
- source_word: מְרֵמוֹת
  choice: Meremot
  rationale: Isinatinig ang personal na pangalan ayon sa anyong Hebreo at sa likas na baybay sa Filipino.
- source_word: אוּרִיָּה
  choice: Uriya
  rationale: Malapit na pagsasatinig sa Hebreong pangalan at madaling bigkasin sa Filipino.
- source_word: הַקּוֹץ
  choice: Hakoz
  rationale: Pinanatili sa pangalan ang unang pantig na tumutugma sa artikulong nakalakip sa anyong Hebreo.
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Pagsasatinig sa Filipino ng personal na pangalang Hebreo.
- source_word: בֶּרֶכְיָה
  choice: Berekya
  rationale: Pagsasatinig na malapit sa mga katinig at patinig ng Hebreo.
- source_word: מְשֵׁיזַבְאֵל
  choice: Mesezabel
  rationale: Pagsasatinig sa Filipino ng personal na pangalang Hebreo.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Pinanatili ang karaniwang nakikilalang anyo ng pangalan habang malapit sa Hebreo.
- source_word: בַּעֲנָא
  choice: Baana
  rationale: Malapit na pagsasatinig sa nakasulat na anyong Hebreo.
