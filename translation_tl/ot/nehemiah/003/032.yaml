  text: And between the upper room of the corner and the Sheep Gate[a], the goldsmiths and the merchants made repairs.
translation:
  language: tl
  text: At sa pagitan ng silid sa itaas sa sulok[a] at ng Tarangkahan ng mga Tupa, nagkumpuni ang mga panday-ginto at ang mga mangangalakal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “paahon na daan sa sulok” o “silid sa itaas sa sulok.” Maaaring tumukoy ang salitang Hebreo sa isang silid o bahagi ng gusali sa itaas, o sa isang paahon na daan; hindi matiyak kung anong bahagi ng estruktura ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵין
  choice: At sa pagitan ng
  rationale: Pinananatili ang pang-ugnay na nagpapatuloy sa talaan at ang malinaw na kahulugang panlunan.
- source_word: עֲלִיַּת
  choice: silid sa itaas
  rationale: Karaniwang kahulugan nito ang silid o bahagi ng gusali sa itaas; natural ito sa Filipino habang iniiwan sa talababa ang tunay na posibilidad na tumukoy ito sa paahon na daan.
- source_word: הַפִּנָּה
  choice: sulok
  rationale: Tuwirang katumbas ng karaniwang pangngalang Hebreo at hindi labis na tinutukoy bilang isang tore o pormal na pangalan ng lugar.
- source_word: לְשַׁעַר הַצֹּאן
  choice: at ng Tarangkahan ng mga Tupa
  rationale: Ang לְ ay nagtatakda ng kabilang hangganan ng bahaging nasa pagitan; ang 'Tarangkahan ng mga Tupa' ay malinaw na pangalan ng pintuang-bayan sa salaysay.
- source_word: הֶחֱזִיקוּ
  choice: nagkumpuni
  rationale: Sa Nehemias 3, ginagamit ang pandiwa para sa pagkukumpuni ng mga bahagi ng pader at mga tarangkahan, hindi lamang sa pangkalahatang pagpapalakas.
- source_word: הַצֹּרְפִים
  choice: mga panday-ginto
  rationale: Tumutukoy sa mga tagapagdalisay o manggagawa ng mamahaling metal; ang 'mga panday-ginto' ay likas at tiyak na katawagang Filipino sa kontekstong ito.
- source_word: וְהָרֹכְלִים
  choice: at ang mga mangangalakal
  rationale: Malawak at dignified na salin para sa mga naglalako o nakikipagkalakalan.
