  text: וְ/הַ֨/נְּתִינִ֔ים הָי֥וּ יֹשְׁבִ֖ים בָּ/עֹ֑פֶל עַ֠ד נֶ֜גֶד שַׁ֤עַר הַ/מַּ֨יִם֙ לַ/מִּזְרָ֔ח וְ/הַ/מִּגְדָּ֖ל הַ/יּוֹצֵֽא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/026.yaml
  text: The temple servants were living on the Ophel[a], as far as opposite the Water Gate toward the east and the projecting tower.
translation:
  language: tl
  text: Ang mga lingkod sa templo[a] ay naninirahan sa Ofel, hanggang sa tapat ng Tarangkahan ng Tubig sa gawing silangan at ng toreng nakausli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Nethinim, isang kinikilalang pangkat ng mga lingkod sa templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: mga lingkod sa templo
  rationale: Tumutukoy ang נְתִינִים sa isang kinikilalang pangkat ng mga tauhang nakatalaga sa mababang uri ng paglilingkod sa templo. Isinalin ang tungkulin para malinaw sa makabagong mambabasa, habang inilagay sa talababa ang tradisyonal na katawagang Nethinim.
- source_word: הָיוּ יֹשְׁבִים
  choice: ay naninirahan
  rationale: Ang היה kasama ng participle ay nagpapahayag ng nagpapatuloy na kalagayan o paninirahan; natural itong naihahatid ng “naninirahan.”
- source_word: בָּעֹפֶל
  choice: sa Ofel
  rationale: Ang עֹפֶל dito ay pangalan ng mataas at pinatibay na bahagi ng Jerusalem. Pinanatili bilang pangalang pantangi sa anyong “Ofel”; ang “sa” ay likas sa Filipino at hindi nagpapasya nang higit sa kailangan kung nasa ibabaw o nasa loob ng nasabing pook.
- source_word: עַד נֶגֶד
  choice: hanggang sa tapat ng
  rationale: Pinananatili ng “hanggang” ang hangganan o lawak na ipinahahayag ng עַד, at ng “sa tapat ng” ang ugnayang pangkalagayan ng נֶגֶד.
- source_word: שַׁעַר הַמַּיִם
  choice: Tarangkahan ng Tubig
  rationale: Tuwirang salin ng pangalan ng tarangkahan, na may dignidad at malinaw na anyong Filipino.
- source_word: לַמִּזְרָח
  choice: sa gawing silangan
  rationale: Malinaw na naghahatid ng direksiyon o lokasyon nang hindi labis na nililimitahan kung eksaktong silangan o patungong silangan ang tinutukoy.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: toreng nakausli
  rationale: Sa kontekstong pang-arkitektura, inilalarawan ng יֹצֵא ang toreng nakaungos o lumalabas mula sa linya ng pader. Ang “nakausli” ay natural at malinaw sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalang Ofel at ginamit ang karaniwang bokabularyong pangheograpiya at pang-arkitektura. Inilagay ang talababa sa “mga lingkod sa templo,” na siyang katumbas ng terminong Hebreo na ipinaliliwanag nito.
