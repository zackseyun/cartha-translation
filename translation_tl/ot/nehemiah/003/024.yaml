base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/024.yaml
  text: After him[a], Binnui son of Henadad repaired another section[b], from the house of Azariah as far as the angle and as far as the corner.
translation:
  language: tl
  text: Kasunod niya, kinumpuni ni Binui na anak ni Henadad ang isa pang bahagi[a], mula sa bahay ni Azarias hanggang sa liko at hanggang sa sulok.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang ikalawang bahagi.” Maaaring tumukoy ang pariralang Hebreo sa karagdagang bahaging kinumpuni ni Binui o sa isang ikalawang bahaging may takdang sukat.
    reason: lexical_alternative
  - marker: b
    text: Magkaugnay ngunit hindi magkapareho ang dalawang salitang Hebreo na isinaling “liko” at “sulok”; malamang na tumutukoy ang mga ito sa dalawang magkalapit na katangiang pang-arkitektura.
    reason: cultural_note
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Kasunod niya
  rationale: Ipinahihiwatig nito ang pagkakasunod-sunod sa talaan ng mga gumagawa, nang hindi labis na iginigiit na magkatabing-magkatabi ang kanilang mga bahagi.
- source_word: הֶחֱזִיק
  choice: inayos
  rationale: Bagaman pangunahing may diwang 'pinatatag' ang pandiwa, tumutukoy ito sa konteksto ng Nehemias 3 sa pagkukumpuni o pagsasaayos ng pader.
- source_word: בִּנּוּי בֶּן־חֵנָדָד
  choice: Binui na anak ni Henadad
  rationale: Isinalin nang tuwiran ang patronimiko at tinumbasan sa baybay-Filipino ang pangalang Binnui bilang Binui.
- source_word: מִדָּה שֵׁנִית
  choice: isa pang bahagi
  rationale: Natural nitong ipinapahayag na karagdagang seksiyon ng gawain ang tinutukoy, habang inilalagay sa talababa ang posibleng mas literal na 'ikalawang bahagi.'
- source_word: מִבֵּית עֲזַרְיָה
  choice: mula sa bahay ni Azarias
  rationale: Natural na anyong Filipino para sa panimulang hangganan ng bahaging inayos; ginamit ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: עַד הַמִּקְצוֹעַ
  choice: hanggang sa liko
  rationale: Ang salita ay tumutukoy sa anggulo o pagliko ng pader; pinananatili ng 'liko' ang pagkakaiba nito sa kasunod na terminong nangangahulugang 'sulok.'
- source_word: וְעַד הַפִּנָּה
  choice: at hanggang sa sulok
  rationale: Tuwirang inilalarawan ang ikalawang katangiang pang-arkitektura at pinananatili ang pag-uulit ng 'hanggang sa.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “inayos” bilang likas na katawagan sa gawaing pagkukumpuni sa konteksto, at pinanatiling magkaiba ang dalawang terminong pang-arkitektura bilang “liko” at “sulok.” Inilagay ang mga pananda ng talababa sa mismong mga pariralang kanilang ipinapaliwanag.
