- from: Pagkatapos niya, nagkumpuni[a] ang mga Levita—si Rehum na anak ni Bani. Sa tabi niya[b], nagkumpuni si Hasabias, na pinuno ng kalahati ng distrito ng Keila, para sa kanyang nasasakupan.[c]
  to: 'Kasunod niya, nagkumpuni[a] ang mga Levita: si Rehum na anak ni Bani. Sa tabi niya[b], nagkumpuni si Hasabias, na pinuno ng kalahati ng distrito ng Keila, para sa kanyang distrito.[c]'
