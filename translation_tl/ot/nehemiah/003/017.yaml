  text: אַחֲרָ֛י/ו הֶחֱזִ֥יקוּ הַ/לְוִיִּ֖ם רְח֣וּם בֶּן בָּנִ֑י עַל יָד֣/וֹ הֶחֱזִ֗יק חֲשַׁבְיָ֛ה שַׂר חֲצִי פֶ֥לֶךְ קְעִילָ֖ה לְ/פִלְכּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/017.yaml
  text: 'After him the Levites carried out repairs: Rehum son of Bani[a]. Next to him Hashabiah, ruler of half the district of Keilah[c][b], carried out repairs for his district.'
translation:
  language: tl
  text: 'Kasunod niya, nagkumpuni[a] ang mga Levita: si Rehum na anak ni Bani. Sa tabi niya[b], nagkumpuni si Hasabias, na pinuno ng kalahati ng distrito ng Keila, para sa kanyang distrito.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpalakas.” Literal na nangangahulugang “ginawang matibay” ang pandiwang Hebreo, ngunit sa Nehemias 3 tumutukoy ito sa pagkukumpuni ng pader.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa kanyang kamay,” isang idyomang nangangahulugang “sa tabi niya” sa kontekstong ito.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “para sa bahaging nakatalaga sa kanya.” Maaaring tumukoy ang Hebreo sa distritong nasa ilalim ng pamamahala ni Hasabias o sa bahagi ng pader na iniatas sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Pagkatapos niya
  rationale: Sa talaan ng pagkukumpuni, ipinahihiwatig ng parirala ang pagkakasunod at maaari ring tumukoy sa kasunod na puwesto sa pader. Likas sa Tagalog ang “Pagkatapos niya” at hindi nito labis na nililimitahan ang diwa.
- source_word: הֶחֱזִיקוּ / הֶחֱזִיק
  choice: nagkumpuni
  rationale: Ang hiphil ng חזק ay literal na may diwang “palakasin,” ngunit sa Nehemias 3 isa itong paulit-ulit na pormula para sa pagkukumpuni ng pader. Malinaw at likas sa konteksto ang “nagkumpuni.”
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Pinananatili nito ang karaniwang katawagan sa pangkat na tinutukoy ng tekstong Hebreo nang walang dagdag na pagpapakahulugan sa kanilang tungkulin dito.
- source_word: רְחוּם בֶּן־בָּנִי
  choice: si Rehum na anak ni Bani
  rationale: Ginamit ang mga pangalang isina-Filipino ang baybay at ang likas na anyong Tagalog para sa ugnayang pampamilya.
- source_word: עַל יָדוֹ
  choice: Sa tabi niya
  rationale: Literal itong “sa kanyang kamay,” ngunit sa konteksto ng magkakatabing bahagi ng pader, tumutukoy ito sa katabing puwesto ng paggawa.
- source_word: חֲשַׁבְיָה
  choice: Hasabias
  rationale: Isina-Filipino ang transliterasyon ng pangalang Hebreo upang maging natural sa modernong Tagalog.
- source_word: שַׂר חֲצִי פֶלֶךְ קְעִילָה
  choice: pinuno ng kalahati ng distrito ng Keila
  rationale: Ang שַׂר ay isang pinuno o opisyal, at ang פֶלֶךְ ay isang administratibong distrito sa kontekstong ito. Tuwirang pinananatili ang saklaw na “kalahati.”
- source_word: לְפִלְכּוֹ
  choice: para sa kanyang nasasakupan
  rationale: Ipinahihiwatig ng לְ ang pananagutan o saklaw ng gawain. Ipinapanatili ng “para sa kanyang nasasakupan” ang administratibong diwa, habang kinikilala sa talababa na maaari rin itong tumukoy sa bahaging nakatalaga sa kanya.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang rehistro. Ginamit ang maikling “nagkumpuni” para sa paulit-ulit na pormula ng kabanata. Pinanatili ang bahagyang alanganing paglipat mula sa maramihang “mga Levita” tungo sa pangalang “Rehum” sa pamamagitan ng gatlang panuring, sa halip na magdagdag ng hindi tahasang ideyang siya ang namuno sa kanila.
