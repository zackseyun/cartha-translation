  text: וְ/עַל יָדָ֨/ם הֶחֱזִ֜יק מְלַטְיָ֣ה הַ/גִּבְעֹנִ֗י וְ/יָדוֹן֙ הַ/מֵּרֹ֣נֹתִ֔י אַנְשֵׁ֥י גִבְע֖וֹן וְ/הַ/מִּצְפָּ֑ה לְ/כִסֵּ֕א פַּחַ֖ת עֵ֥בֶר הַ/נָּהָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/007.yaml
  text: And next to them Melatiah the Gibeonite and Jadon the Meronothite made repairs[a], along with the men of Gibeon and Mizpah, for the seat of the governor of the province Beyond the River.
translation:
  language: tl
  text: Katabi nila, nagkumpuni sina Melatias na taga-Gibeon at Jadon na taga-Meronot, kasama ang mga lalaki ng Gibeon at Mizpa, para sa luklukan[a] ng gobernador ng lalawigang Kabila ng Ilog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “para sa luklukan ng gobernador ng Kabila ng Ilog.” Maaaring tumukoy ang “luklukan” sa opisyal na himpilan o tirahan ng gobernador, o marahil sa nasasakupan ng kaniyang kapangyarihan sa lugar na iyon.
    reason: Pinananatili ang tunay na kalabuan ng administratibong parirala sa Hebreo.
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Kasunod nila
  rationale: Sa talaan ng pagtatayo sa Nehemias 3, ang idyomang ito ay tumutukoy sa mga gumagawa sa katabing bahagi; natural na naipahihiwatig ng “Kasunod nila” ang ayos ng gawain.
- source_word: הֶחֱזִיק
  choice: nagkumpuni
  rationale: Sa konteksto ng kabanata, tumutukoy ang pandiwa sa pagkukumpuni o muling pagtatayo ng pader.
- source_word: מְלַטְיָה הַגִּבְעֹנִי
  choice: Melatias na taga-Gibeon
  rationale: Isinalin ang pangalang pantangi sa anyong angkop sa Filipino at ang katawagang heograpiko bilang “taga-Gibeon.”
- source_word: יָדוֹן הַמֵּרֹנֹתִי
  choice: Jadon na taga-Meronot
  rationale: Pinanatili ang pangalang pantangi at malinaw na ipinahayag ang pinagmulan niyang lugar.
- source_word: אַנְשֵׁי גִבְעוֹן וְהַמִּצְפָּה
  choice: kasama ang mga lalaki ng Gibeon at Mizpa
  rationale: Ang parirala ay tumutukoy sa mga lalaking kabilang sa dalawang bayang ito; nililinaw ng “kasama” na nakibahagi sila sa gawain.
- source_word: לְכִסֵּא
  choice: para sa luklukan
  rationale: Pinananatili ng “luklukan” ang konkretong larawan ng כִּסֵּא at ang posibleng administratibong diwa nito, habang ang “para sa” ay hindi nagpapasok ng tiyak na hangganang heograpiko na wala nang malinaw sa Hebreo.
- source_word: פַּחַת
  choice: gobernador
  rationale: Ito ang malinaw at kasalukuyang katumbas sa Filipino ng titulong administratibo noong panahon ng Persia.
- source_word: עֵבֶר הַנָּהָר
  choice: lalawigang Kabila ng Ilog
  rationale: Kilala itong katawagang administratibo ng Persia para sa rehiyon sa kanluran ng Eufrates; ipinakikita ng malaking titik na opisyal na pangalan ito.
