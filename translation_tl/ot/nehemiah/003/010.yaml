  verdict: revise
  source_fidelity: Ang “nagkumpuni” ay wastong pagsasalin sa teknikal na gamit ng הֶחֱזִיק sa Nehemias 3. Gayunman, ang “Kasunod nila/niya” ay maaaring mangahulugang sumunod lamang sa talaan o sa panahon, samantalang ang עַל־יָד ay tumutukoy sa pisikal na pagkakatabi ng bahaging kinumpuni. Ang “sa tabi nila/niya” ay mas tiyak na tumutugma sa Hebreo.
  naturalness: Likas at malinaw sa modernong Filipino ang “Sa tabi nila” at “sa tabi niya.” Mas maayos ding iwasan ang “sarili niyang,” dahil hindi ito kailangang diin sa Hebreo; sapat at natural ang “kanyang bahay.”
  terminology: Napananatili ang pare-parehong terminong “nagkumpuni.” Ang mga pangalang nasa draft ay hindi binago sa rebisyong ito; ang kinakailangang pagwawasto ay ang panlunang idyoma.
  issues:
