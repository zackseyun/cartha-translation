base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/010.yaml
  text: Next to them Jedaiah son of Harumaph made repairs opposite his house[a], and next to him Hattush son of Hashabneiah made repairs.
translation:
  language: tl
  text: Sa tabi nila, nagkumpuni si Jedaias na anak ni Harumaf sa tapat ng kanyang bahay[a], at sa tabi niya, nagkumpuni si Hatus na anak ni Hasabnias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa harap ng kanyang bahay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Kasunod nila
  rationale: Ang idyomang עַל יָד sa talaan ng Nehemias 3 ay nagpapahiwatig ng magkatabing puwesto sa gawain. Likas sa Filipino ang “Kasunod nila” at napananatili nito ang sunod-sunod na ayos ng mga nagkukumpuni.
- source_word: הֶחֱזִיק
  choice: nagkumpuni
  rationale: Sa konteksto ng Nehemias 3, ang Hiphil ng חזק ay tumutukoy sa pagkukumpuni o muling pagtatayo ng pader. Ang “nagkumpuni” ay malinaw, maikli, at angkop sa paulit-ulit na pormula ng kabanata.
- source_word: יְדָיָה
  choice: Jedaias
  rationale: Isinalin sa karaniwang anyong Filipino ng pangalang biblikal.
- source_word: בֶן חֲרוּמַף
  choice: anak ni Harumaf
  rationale: Tuwirang pagsasalin ng karaniwang konstruksiyong pangangkan; isinalin sa baybay-Filipino ang pangalan.
- source_word: וְנֶגֶד בֵּיתוֹ
  choice: sa tapat ng sarili niyang bahay
  rationale: Ang נֶגֶד ay maaaring mangahulugang “sa tapat” o “sa harap.” Nililinaw ng “sarili niyang” ang reperensiya ng hulaping panghalip nang hindi binabago ang ugnayang panlunan.
- source_word: וְעַל יָדוֹ
  choice: Kasunod niya
  rationale: Kaparehong idyoma ng naunang עַל יָדָם, ngayon ay isahan. Pinananatili ng salin ang paralelismo at ang pagkakasunod-sunod ng mga manggagawa.
- source_word: חַטּוּשׁ
  choice: Hatus
  rationale: Isinalin sa baybay na madaling basahin sa modernong Filipino.
- source_word: בֶן חֲשַׁבְנְיָה
  choice: anak ni Hasabnias
  rationale: Tuwirang isinalin ang ugnayang pangangkan at ginamit ang baybay-Filipino para sa pangalan.
