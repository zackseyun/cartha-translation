lexical_decisions:
- source_word: מֵעַל
  choice: Sa itaas ng
  rationale: Ipinahihiwatig ng pang-ukol ang kinalalagyan ng bahaging kinukumpuni kaugnay ng naunang seksiyon; natural dito ang “sa itaas ng.”
- source_word: שַׁעַר הַסּוּסִים
  choice: Tarangkahan ng mga Kabayo
  rationale: Pinananatili nito ang anyong construct ng Hebreo at malinaw na tumutukoy sa pangalan ng isang tarangkahan.
- source_word: הֶחֱזִיקוּ
  choice: nagkumpuni
  rationale: Sa konteksto ng Nehemias 3, tumutukoy ang pandiwa sa pagkukumpuni ng pader o mga tarangkahan, hindi lamang sa pangkalahatang pagpapalakas.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Tuwirang salin ng pangngalang may tiyak na pantukoy.
- source_word: אִישׁ
  choice: bawat isa
  rationale: 'Distributibo ang gamit ng isahang panlalaking pangngalan: isa-isa sa pangkat ng mga pari.'
- source_word: לְנֶגֶד
  choice: sa tapat ng
  rationale: Natural na Filipino para sa posisyong kaharap o katapat ng isang lugar.
- source_word: בֵּיתוֹ
  choice: sarili niyang bahay
  rationale: Ang ikatlong panauhang isahang hulapi ay umaayon sa distributibong “bawat isa”; nililinaw ng “sarili” ang ugnayan nang hindi binabago ang kahulugan.
