  text: Above the Horse Gate[a], the priests made repairs, each one opposite his own house.
translation:
  language: tl
  text: Sa itaas ng Tarangkahan ng mga Kabayo[a], nagkumpuni ang mga pari, bawat isa sa tapat ng sarili niyang bahay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang tarangkahan ng mga kabayo.”
