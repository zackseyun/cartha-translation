base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/027.yaml
  text: After him the Tekoites repaired another section[a], opposite the great projecting tower, as far as the wall of Ophel.
translation:
  language: tl
  text: Kasunod niya, kinumpuni ng mga taga-Tekoa ang isa pang bahagi[a], sa tapat ng malaking toreng nakausli, hanggang sa pader ng Ofel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang ikalawang bahagi.” Maaaring idiin ng pariralang Hebreo na karagdagang bahagi ito bukod sa nauna nilang atas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Kasunod niya
  rationale: Sa talaan ng mga gumagawa sa Nehemias 3, ipinahihiwatig nito ang pagkakasunod-sunod ng mga atas sa paggawa; likas sa Filipino ang “Kasunod niya.”
- source_word: הֶחֱזִיקוּ
  choice: inayos
  rationale: Bagaman pangunahing diwa ng pandiwa ang “pinalakas,” ginagamit ito rito bilang terminong tumutukoy sa pagkukumpuni o muling pagtatayo ng pader. Malinaw at natural ang “inayos” sa konteksto.
- source_word: הַתְּקֹעִים
  choice: mga taga-Tekoa
  rationale: Tumutukoy ang gentiliko sa mga naninirahan sa Tekoa; ito ang karaniwang likas na anyo sa modernong Filipino.
- source_word: מִדָּה שֵׁנִית
  choice: isa pang bahagi
  rationale: Tumutukoy ito sa karagdagang takdang bahagi na ginawa ng pangkat, na maaaring unawaing kanilang ikalawang bahagi. Pinananatili sa talababa ang leksikal na alternatibo.
- source_word: מִנֶּגֶד
  choice: sa tapat ng
  rationale: Ipinakikita ng parirala na ang seksiyon ay kaharap o katapat ng nasabing palatandaan.
- source_word: הַמִּגְדָּל הַגָּדוֹל
  choice: malaking tore
  rationale: Tuwirang isinasalin ang pangngalan at pang-uri sa natural na pariralang Filipino.
- source_word: הַיּוֹצֵא
  choice: nakausli
  rationale: Sa kontekstong arkitektural, inilalarawan ng participle ang toreng lumalabas o nakausli mula sa linya ng pader.
- source_word: וְעַד
  choice: hanggang sa
  rationale: Malinaw nitong ipinakikita ang hangganan o huling dulo ng bahaging inayos.
- source_word: חוֹמַת הָעֹפֶל
  choice: pader ng Ofel
  rationale: Pinananatili ang ugnayang konstruktong “pader ng” at isinasatitik sa Filipino ang pangalang pantanging Ophel bilang “Ofel.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga taga-Tekoa” sa halip na isang di-likas na gentiliko, at “toreng nakausli” upang maipahayag nang payak ang paglalarawang arkitektural.
