  text: וְ/אַחֲרָ֛י/ו הֶחֱזִ֥יקוּ הַ/כֹּהֲנִ֖ים אַנְשֵׁ֥י הַ/כִּכָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/022.yaml
  text: After him the priests[a], the men of the plain, made repairs.
translation:
  language: tl
  text: Kasunod niya, nagkumpuni ang mga pari, ang mga lalaking mula sa kapatagan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “distrito” o “palibot na rehiyon.” Ang Hebreong כִּכָּר ay maaaring tumukoy sa isang kapatagan o pabilog na distrito; hindi tiyak kung aling pook ang tinutukoy rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Kasunod niya
  rationale: Ipinahahayag nito ang pagkakasunod-sunod sa talaan nang natural sa Filipino, habang nananatili ang diwa ng literal na “at pagkatapos niya.”
- source_word: הֶחֱזִיקוּ
  choice: nagkumpuni
  rationale: Sa konteksto ng Nehemias 3, tumutukoy ang pandiwa sa pakikibahagi sa pagkukumpuni ng pader, hindi lamang sa literal na “pagpapalakas” o “pagkapit.”
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Tuwirang salin ng tiyakang pangngalang maramihan.
- source_word: אַנְשֵׁי
  choice: ang mga lalaking mula sa
  rationale: Pinananatili nito ang tahasang panlalaki at maramihang anyo ng Hebreo at ang kaugnayan nila sa isang pook.
- source_word: הַכִּכָּר
  choice: kapatagan
  rationale: Maaaring tumukoy ang כִּכָּר sa isang kapatagan o pabilog na distrito. Pinananatili ng “kapatagan” ang pangunahing heograpikong kahulugan nang hindi tiyakang kinikilala ang lokasyong hindi malinaw sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang appositional na anyo ng Hebreo—“ang mga pari, ang mga lalaking…”—at ang kawalang-katiyakan sa heograpikong katawagang כִּכָּר.
