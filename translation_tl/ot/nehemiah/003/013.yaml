base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/013.yaml
  text: Hanun and the inhabitants of Zanoah repaired the Valley Gate[a]. They built it and set up its doors, its bolts, and its bars, and repaired a thousand cubits of the wall[c][b], as far as the Dung Gate.
translation:
  language: tl
  text: Ang Pintuang-Lambak ay kinumpuni[a] ni Hanun at ng mga naninirahan sa Zanoa. Sila ang nagtayo nito at nagkabit ng mga pinto nito, mga trangka nito, at mga halang nito. Kinumpuni rin nila ang isang libong siko[b] ng pader, hanggang sa Pintuang-Tambakan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinatibay.” Ang pandiwang Hebreo ay maaaring mangahulugang ginawang matatag o kinumpuni; sa kabanatang ito, ginagamit ito sa gawain ng muling pagtatayo at pagkukumpuni.
    reason: lexical_alternative
  - marker: b
    text: Ang isang libong siko ay humigit-kumulang 457 metro.
    reason: cultural_note
  - marker: c
    text: Maaari ring “Pintuan ng Dumi” o “Pintuan ng Basura.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: kinumpuni
  rationale: Sa konteksto ng muling pagtatayo sa Nehemias 3, tumutukoy ang pandiwa sa pagsasaayos o pagpapatibay ng isang bahagi. Likas sa Filipino ang “kinumpuni,” habang inilalahad sa talababa ang mas literal na diwang “pinatibay.”
- source_word: שַׁעַר הַגַּיְא
  choice: Pintuang-Lambak
  rationale: Pangalan ito ng isang pintuan ng lungsod. Pinananatili ng anyong ito ang ugnayang konstrakto ng Hebreo at malinaw itong nauunawaan bilang pantanging pangalan.
- source_word: יֹשְׁבֵי זָנוֹחַ
  choice: mga naninirahan sa Zanoa
  rationale: Tuwirang ipinahahayag ng participyo ang mga taong nakatira sa bayang Zanoa; natural at kasalukuyang Filipino ang “mga naninirahan.”
- source_word: הֵמָּה בָנוּהוּ
  choice: Sila ang nagtayo nito
  rationale: Pinananatili nito ang tahasang pandiwang “nagtayo” at ang pagbibigay-diin ng panghalip na הֵמָּה. Hindi idinagdag ang diwang “muling” kahit ipinahihiwatig iyon ng mas malawak na konteksto.
- source_word: וַיַּעֲמִידוּ
  choice: nagkabit
  rationale: Ang literal na diwa ay “pinatayo” o “inilagay sa puwesto.” Para sa mga pinto at kagamitang pansara, ang “nagkabit” ang natural at tiyak na salin sa Filipino.
- source_word: דַּלְתֹתָיו
  choice: mga pinto nito
  rationale: Tumutukoy ang maramihang anyo sa mga dahon o panel ng malaking pintuan; malinaw at karaniwan ang “mga pinto.”
- source_word: מַנְעֻלָיו
  choice: mga trangka nito
  rationale: Sa kontekstong pang-arkitektura, tumutukoy ito sa kagamitang pangsara. Mas angkop sa sinaunang pintuan ang “trangka” kaysa sa makabagong “kandado.”
- source_word: בְרִיחָיו
  choice: mga halang nito
  rationale: Tumutukoy ito sa mahahabang baras na inilalagay na pahalang upang tiyaking nakasara ang pintuan. Naiiba nang sapat ang “halang” sa “trangka.”
- source_word: אֶלֶף אַמָּה
  choice: isang libong siko
  rationale: Pinananatili ang sinaunang yunit ng sukat at ang tiyak na bilang ng tekstong Hebreo; ibinibigay sa talababa ang tinatayang katumbas sa makabagong sukat.
- source_word: בַּחוֹמָה
  choice: ng pader
  rationale: Sa pariralang nagsasaad ng lawak ng kinumpuni, natural sa Filipino ang “isang libong siko ng pader.”
- source_word: שַׁעַר הָשֲׁפוֹת
  choice: Pintuang-Tambakan
  rationale: Malamang na pinangalanan ang pintuan ayon sa lugar na tapunan ng dumi o basura. Ang “Tambakan” ay marangal at natural sa modernong Filipino, at hindi ito madaling mapagkamalang karaniwang lupa o alikabok na gaya ng salitang “dumi.”
