translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Pinanatili ang maikling sunod-sunod na mga sugnay ng Hebreo, ngunit inayos ang mga ito sa likas na ayos ng pangungusap sa Filipino. Ginamit ang magkahiwalay na “trangka” at “halang” upang mapanatili ang dalawang magkaibang kagamitang pansara sa tekstong pinagmulan.
