base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/012.yaml
  text: Next to him Shallum son of Hallohesh[a], ruler of half the district of Jerusalem, made repairs—he and his daughters.
translation:
  language: tl
  text: Sa tabi niya, nagkumpuni si Shallum na anak ni Hallohesh, pinuno ng kalahati ng distrito ng Jerusalem—siya at ang kanyang mga anak na babae.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At sa tabi niya … ay nagkumpuni.” Literal na tumutukoy ang idyomang Hebreo sa gawaing ginawa “sa tabi ng kanyang kamay,” ibig sabihin, katabi ng seksiyon ng naunang manggagawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Sa tabi niya
  rationale: Ang idyomang Hebreo ay tumutukoy sa seksiyong katabi ng ginawa ng naunang manggagawa; natural at malinaw ito sa modernong Tagalog.
- source_word: הֶחֱזִיק
  choice: nagkumpuni
  rationale: Sa konteksto ng Nehemias 3, ang hiphil ng חזק ay tumutukoy sa pagkukumpuni o muling pagpapatibay ng bahagi ng pader.
- source_word: שַׁלּוּם
  choice: Shallum
  rationale: Isinalin sa pamamagitan ng transliterasyon ang personal na pangalan.
- source_word: בֶּן הַלּוֹחֵשׁ
  choice: anak ni Hallohesh
  rationale: Pinanatili sa transliterasyon ang pangalang Hebreo at natural na ipinahayag ang patronimiko sa Tagalog.
- source_word: שַׂר חֲצִי פֶּלֶךְ יְרוּשָׁלִָם
  choice: pinuno ng kalahati ng distrito ng Jerusalem
  rationale: Ang שַׂר ay pinuno o opisyal, at ang פֶּלֶךְ dito ay isang administratibong distrito; iniiwasan ng “distrito” ang pagpapalabis na maaaring ipahiwatig ng “lalawigan.”
- source_word: הוּא וּבְנוֹתָיו
  choice: siya at ang kanyang mga anak na babae
  rationale: Pinananatili ang tahasang pagbanggit na kasama sa gawain ang mga anak niyang babae.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nagkumpuni” para sa gawa sa pader at “distrito” para sa administratibong yunit. Pinanatili ang diin ng Hebreo sa paglahok ni Shallum at ng kanyang mga anak na babae.
