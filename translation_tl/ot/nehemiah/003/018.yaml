base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/018.yaml
  text: 'After him their brothers repaired: Bavvai son of Henadad[a], ruler of half the district of Keilah.'
translation:
  language: tl
  text: 'Kasunod niya, nagkumpuni ang kanilang mga kapatid: si Bavvai na anak ni Henadad,[a] pinuno ng kalahati ng distrito ng Keila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang tradisyon ng teksto, “Binnui” ang pangalan sa halip na “Bavvai.”
    reason: textual_variant
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Kasunod niya
  rationale: Likas na ipinahahayag sa Filipino ang pagkakasunod-sunod ng mga bahagi ng pader at malapit na sumusunod sa Hebreong panandang pansunod/panlunan.
- source_word: הֶחֱזִיקוּ
  choice: nagkumpuni
  rationale: Bagaman literal na may diwang ‘nagpalakas,’ ginagamit ang pandiwa sa Nehemias 3 para sa pagkukumpuni ng pader.
- source_word: אֲחֵיהֶם
  choice: kanilang mga kapatid
  rationale: Pinananatili ang literal na katawagan ng Hebreo, kahit maaaring tumukoy rito sa mga kaanak o kasamahan sa pangkat.
- source_word: בַּוַּי
  choice: Bavai
  rationale: Sinusunod ang anyong Bavvai ng WLC at iniangkop ang baybay sa madaling pagbigkas sa Filipino; inilalagay sa talababa ang variant na Binnui.
- source_word: בֶּן חֵנָדָד
  choice: anak ni Henadad
  rationale: Likas at malinaw na salin sa Filipino ng patronimikong Hebreo.
- source_word: שַׂר
  choice: pinuno
  rationale: Ang konteksto ay tungkuling sibil o administratibo, hindi militar.
- source_word: חֲצִי פֶּלֶךְ
  choice: kalahati ng distrito
  rationale: Tumutukoy sa kalahati ng isang administratibong nasasakupan; malinaw sa modernong Filipino ang ‘distrito.’
- source_word: קְעִילָה
  choice: Keila
  rationale: Transliterasyon ng pangalan ng lugar na iniangkop sa Filipino.
