translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang ‘sa pangunguna ni’ upang maging natural ang relasyon ng maramihang pandiwang ‘nagkumpuni’ sa nag-iisang opisyal na pinangalanan, nang hindi ipinapalagay na siya lamang ang gumawa.
