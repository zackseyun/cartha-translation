  text: And next to him the men of Jericho built[a], and next to them Zaccur the son of Imri built.
translation:
  language: tl
  text: Sa tabi niya ay nagtayo ang mga lalaki ng Jerico; at sa tabi niya[a] ay nagtayo si Zacur na anak ni Imri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa tabi niya,” gaya rin sa unang sugnay. Bagaman isahan ang “niya,” maaaring tumukoy ang ikalawang pahayag sa puwestong katabi ng naunang pangkat, ang mga lalaki ng Jerico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Kasunod niya
  rationale: Ang idyomang עַל־יָד na may hulaping panghalip ay tumutukoy sa katabing puwesto sa magkakasunod na gawain sa pader. Likas sa Filipino ang “kasunod niya” at napananatili nito ang ugnayang panlunan.
- source_word: בָנוּ / בָנָה
  choice: nagtayo
  rationale: Ang payak na pandiwang בנה ay nangangahulugang “magtayo” o “bumuo.” Hindi tahasang sinasabi sa talata ang “muling pagtatayo,” kaya pinanatili ang mas maingat na “nagtayo.”
- source_word: אַנְשֵׁי יְרֵחוֹ
  choice: ang mga lalaki ng Jerico
  rationale: Tahasang panlalaki ang anyong אַנְשֵׁי at kinikilala ang pangkat ayon sa Jerico. Ang “mga lalaki ng Jerico” ay tapat sa anyo at malinaw sa modernong Filipino.
- source_word: זַכּוּר בֶּן אִמְרִי
  choice: Zacur na anak ni Imri
  rationale: Isinalin ang patronimikong בֶּן sa likas na Filipino na “anak ni,” at tinumbasan sa baybay-Filipino ang pangalang Zacur.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Pinanatili ang pag-uulit ng Hebreong singular na “niya” sa dalawang sugnay upang hindi tahimik na palitan ang gramatikal na anyo ng pinagmulan; ipinaliwanag sa talababa ang posibleng ugnayan nito sa naunang pangkat.
