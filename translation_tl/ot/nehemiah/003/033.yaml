  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר שָׁמַ֣ע סַנְבַלַּ֗ט כִּֽי אֲנַ֤חְנוּ בוֹנִים֙ אֶת הַ֣/חוֹמָ֔ה וַ/יִּ֣חַר ל֔/וֹ וַ/יִּכְעַ֖ס הַרְבֵּ֑ה וַ/יַּלְעֵ֖ג עַל הַ/יְּהוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/033.yaml
  text: When Sanballat heard that we were rebuilding the wall[a], he became angry and very enraged, and he mocked the Jews.
translation:
  language: tl
  text: Nang marinig ni Sanbalat na itinatayo naming muli ang pader, nagalit siya at labis na nagngitngit, at nilibak niya ang mga Judio[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga taga-Juda.” Maaaring tumukoy ang salitang Hebreo sa mga mamamayan ng Juda bilang isang rehiyon, gayundin sa mga Judio sa mas malawak na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Likas na ipinakikilala ng “Nang” ang kasunod na pangyayari nang hindi nagdaragdag ng tahasang salitang katumbas ng “ngayon,” na wala sa Hebreo.
- source_word: שָׁמַע
  choice: marinig
  rationale: Tuwirang katumbas ito ng pandiwang “makarinig” at natural din sa konteksto ng pagtanggap ng balita.
- source_word: סַנְבַלַּט
  choice: Sanbalat
  rationale: Isinalin sa karaniwang anyong Filipino ang pangalan.
- source_word: כִּי אֲנַחְנוּ בוֹנִים
  choice: na itinatayo naming muli
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na gawain; ang “muli” ay angkop sa konteksto ng pagpapanumbalik sa nasirang pader ng Jerusalem.
- source_word: הַחוֹמָה
  choice: ang pader
  rationale: Tumpak at sapat sa konteksto ang “pader,” yamang malinaw na pader ng Jerusalem ang tinutukoy.
- source_word: וַיִּחַר לוֹ
  choice: nagalit siya
  rationale: Natural na Filipino ito para sa idyomang Hebreo na literal na naglalarawan ng nag-aapoy na galit.
- source_word: וַיִּכְעַס הַרְבֵּה
  choice: at labis na nagngitngit
  rationale: Pinananatili nito ang pag-igting mula sa unang pahayag ng galit tungo sa mas matinding poot, nang hindi inuulit lamang ang parehong salita.
- source_word: וַיַּלְעֵג
  choice: nilibak niya
  rationale: Ipinahahayag ng “libakin” ang mapanlait at mapangutyang pananalita ng pandiwang Hebreo.
- source_word: עַל הַיְּהוּדִים
  choice: ang mga Judio
  rationale: Pinakakilala at angkop sa konteksto ang “mga Judio,” habang pinananatili sa talababa ang posibleng panrehiyong kahulugang “mga taga-Juda.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkasunod at tumitinding paglalarawan sa galit ni Sanbalat, at inilagay ang talababa pagkatapos ng “mga Judio,” na siyang salitang may alternatibong pagbasa.
