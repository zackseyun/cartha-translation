  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַחֲרָ֧י/ו הֶחֱזִ֛יק צָד֥וֹק בֶּן אִמֵּ֖ר נֶ֣גֶד בֵּית֑/וֹ וְ/אַחֲרָ֤י/ו הֶחֱזִיק֙ שְׁמַֽעְיָ֣ה בֶן שְׁכַנְיָ֔ה שֹׁמֵ֖ר שַׁ֥עַר הַ/מִּזְרָֽח־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/029.yaml
  text: After him Zadok son of Immer made repairs opposite his house[a], and after him Shemaiah son of Shecaniah, keeper of the East Gate[c][b], made repairs.
translation:
  language: tl
  text: Kasunod niya, nagkumpuni si Zadok na anak ni Immer sa tapat ng kanyang bahay.[a] At kasunod niya, nagkumpuni si Shemaya na anak ni Shecanias, ang tagapagbantay ng Tarangkahan sa Silangan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa harap ng kanyang bahay.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang bantay ng Tarangkahan sa Silangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Kasunod niya
  rationale: Sa talaan ng Nehemias 3, ipinahihiwatig ng parirala ang pagkakasunod-sunod ng mga gumagawa at ng mga bahaging kinukumpuni; natural ito sa modernong Tagalog.
- source_word: הֶחֱזִיק
  choice: nagkumpuni
  rationale: Bagaman literal na may diwang ‘nagpalakas,’ ang Hiphil ng חזק sa kabanatang ito ay idyoma para sa pagkukumpuni ng pader at mga tarangkahan.
- source_word: צָדוֹק בֶּן אִמֵּר
  choice: Zadok na anak ni Immer
  rationale: Pinanatili ang mga pangalang pantangi sa transliterasyon at isinalin nang tuwiran ang karaniwang pormulang pangangkan.
- source_word: נֶגֶד בֵּיתוֹ
  choice: sa tapat ng kanyang bahay
  rationale: Ang נֶגֶד ay maaaring mangahulugang ‘sa tapat’ o ‘sa harap’; ang ‘sa tapat’ ay natural at angkop sa paglalarawang topograpiko.
- source_word: שְׁמַעְיָה בֶן שְׁכַנְיָה
  choice: Shemaya na anak ni Shecanias
  rationale: Gumamit ng mga anyong madaling bigkasin sa Tagalog habang malinaw na pinananatili ang pagkakakilanlan ng mga pangalang Hebreo.
- source_word: שֹׁמֵר
  choice: tagapagbantay
  rationale: Ang participle ay tumutukoy sa tungkulin ni Shemaya; hindi tiyak kung opisyal na tagapamahala o bantay ang diin, kaya pinili ang malawak at natural na ‘tagapagbantay.’
- source_word: שַׁעַר הַמִּזְרָח
  choice: Tarangkahan sa Silangan
  rationale: Tinutukoy nito ang isang partikular na tarangkahan na nakikilala ayon sa direksiyon; ang malaking titik ay nagpapakitang katawagan ito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang ‘nagkumpuni’ bilang natural na katumbas ng idyomang Hebreo sa konteksto, at ‘tarangkahan’ para sa malaking pasukan ng lungsod. Ang bawat talababa ay may katumbas na pananda sa pangunahing teksto.
