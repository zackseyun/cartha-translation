base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/008.yaml
  text: Next to him Uzziel son of Harhaiah[a], one of the goldsmiths, made repairs; and next to him Hananiah, one of the perfumers, made repairs. And they restored Jerusalem as far as the Broad Wall.
translation:
  language: tl
  text: Sa tabi niya, nagkumpuni si Uziel na anak ni Harhaya, isa sa mga panday-ginto. Sa tabi naman niya, nagkumpuni si Hanania, isa sa mga gumagawa ng pabango. Inayos nila[a] ang Jerusalem hanggang sa Malapad na Pader.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, iniwan nila ang Jerusalem hanggang sa Malapad na Pader. Karaniwang nangangahulugang “iniwan” ang pandiwang Hebreo, ngunit sa kontekstong ito ng muling pagtatayo ay madalas itong inuunawang “inayos” o “kinumpuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָדוֹ
  choice: Sa tabi niya
  rationale: Sa talaan ng pagkukumpuni sa Nehemias 3, ang idyomang ito ay tumutukoy sa kasunod o katabing bahagi at manggagawa. Natural sa Tagalog ang “sa tabi niya” at pinananatili nito ang diwang panlugar.
- source_word: הֶחֱזִיק
  choice: nagkumpuni
  rationale: Bagaman pangunahing may diwang “magpalakas” o “humawak nang mahigpit,” ginagamit ito sa kabanatang ito para sa pagsasagawa ng pagkukumpuni sa pader. Malinaw at maikli ang “nagkumpuni” sa konteksto.
- source_word: צֹרְפִים
  choice: isa sa mga panday-ginto
  rationale: Ang pangmaramihang anyo ay tumutukoy sa pangkat ng mga bihasang manggagawa kung saan kabilang si Uziel. Ang “panday-ginto” ay madaling maunawaang katawagan sa gumagawa o nagpapanday ng mahahalagang metal, lalo na ng ginto.
- source_word: הָרַקָּחִים
  choice: isa sa mga gumagawa ng pabango
  rationale: Tumutukoy ito sa mga naghahalo o gumagawa ng pabango at mababangong pamahid. Mas malinaw sa karaniwang mambabasa ang pariralang ito kaysa sa teknikal o makalumang katawagan.
- source_word: וַיַּעַזְבוּ
  choice: Isinaayos nila
  rationale: Karaniwang nangangahulugang “iniwan” ang pandiwa, ngunit sa konteksto ng muling pagtatayo ay maaari itong unawain bilang pagsasaayos o pagpapanumbalik. Ginamit sa pangunahing teksto ang kontekstuwal na kahulugan, habang inilalahad sa talababa ang tunay na leksikal na alternatibo.
- source_word: יְרוּשָׁלַםִ
  choice: ang Jerusalem
  rationale: Lungsod mismo ang tahasang binabanggit ng Hebreo, marahil bilang metonimiya para sa mga tanggulan nito. Hindi idinagdag ang “pader ng” sa pangunahing teksto.
- source_word: עַד הַחוֹמָה הָרְחָבָה
  choice: hanggang sa Malapad na Pader
  rationale: Malamang na pangalan o kilalang katawagan ito sa isang bahagi ng tanggulan ng Jerusalem. Ang malaking titik ay nagpapakitang tiyak na pook ang tinutukoy.
