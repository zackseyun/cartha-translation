translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na hulma ng talaan, ngunit idinagdag ang “naman” sa ikalawang pangungusap para sa natural na daloy. Inilagay ang pananda ng talababa pagkaraan ng pinagtatalunang pandiwa upang malinaw kung aling salita ang may alternatibong pagbasa.
