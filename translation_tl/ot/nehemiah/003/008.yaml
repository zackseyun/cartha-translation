- from: Sa tabi niya, nagkumpuni si Uziel na anak ni Harhaya, isa sa mga panday-ginto. Sa tabi naman niya, nagkumpuni si Hananias, isa sa mga gumagawa ng pabango. Isinaayos nila[a] ang Jerusalem hanggang sa Malapad na Pader.
  to: Sa tabi niya, nagkumpuni si Uziel na anak ni Harhaya, isa sa mga panday-ginto. Sa tabi naman niya, nagkumpuni si Hanania, isa sa mga gumagawa ng pabango. Inayos nila[a] ang Jerusalem hanggang sa Malapad na Pader.
  rationale: Itinama ang pangalan ayon sa Hebreong teksto at pinakinis ang dalawang parirala para sa natural na modernong Filipino. Hindi binago ang saklaw ng pandiwa, ang metonimiyang “Jerusalem,” o ang maingat na talababa hinggil sa pinagtatalunang kahulugan ng וַיַּעַזְבוּ.
