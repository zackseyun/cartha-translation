  source_fidelity: 'Kailangang itama ang pandiwa sa pariralang tungkol sa paglalagay ng mga pinto at mga pangharang: ang tekstong Hebreo ng WLC ay may anyong maramihan, וַיַּעֲמִידוּ, kaya ang “ikinabit nila” ang tuwirang salin. Walang nakatalang qere sa ibinigay na WLC na magpapahintulot na gawing isahan ang pangunahing teksto. Tapat naman ang iba pang pangunahing detalye, kabilang ang Bukal, distrito ng Mizpa, Tipunan ng Tubig ng Shelah, hardin ng hari, at mga hagdan mula sa Lungsod ni David.'
  naturalness: Ang “nagbubong nito” ay hindi likas na kolokasyon sa modernong Tagalog. Mas malinaw at natural ang “nilagyan niya ito ng bubong.” Ang “mga hagdang bumababa” ay mas maayos ding daloy kaysa “mga hagdang pababa.”
  terminology: Ang “Tarangkahan ng Bukal,” “pinuno ng distrito,” at “Tipunan ng Tubig ng Shelah” ay angkop. Ginawang “mga pansara” ang מַנְעֻלִים upang hindi magpahiwatig nang masyado ng mga modernong padlock ang “mga kandado”; nananatiling “mga halang” ang בְּרִיחִים.
