  - severity: low
    issue: Hindi natural ang “nagbubong nito.”
    rationale: Mas idiomatiko sa modernong Filipino ang “nilagyan niya ito ng bubong,” na tapat ding naghahayag ng pagtatakip o paglalagay ng bubong sa tarangkahan.
