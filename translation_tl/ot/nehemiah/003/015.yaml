revisions:
- from: At inayos ni Shallun na anak ni Col-Hozeh, pinuno ng distrito ng Mizpa, ang Tarangkahan ng Bukal. Siya mismo ang muling nagtayo at nagbubong nito, at ikinabit niya[a] ang mga pinto, mga kandado, at mga halang nito. Inayos din niya ang pader ng Tipunan ng Tubig ng Shelah[b], sa tabi ng hardin ng hari, hanggang sa mga hagdang pababa mula sa Lungsod ni David.
  to: At inayos ni Shallun na anak ni Col-Hozeh, pinuno ng distrito ng Mizpa, ang Tarangkahan ng Bukal. Siya mismo ang muling nagtayo nito at nilagyan ng bubong; ikinabit naman nila ang mga pinto, mga pansara, at mga halang nito. Inayos din niya ang pader ng Tipunan ng Tubig ng Shelah[a], sa tabi ng hardin ng hari, hanggang sa mga hagdang bumababa mula sa Lungsod ni David.
