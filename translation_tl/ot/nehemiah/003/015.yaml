  text: וְ/אֵת֩ שַׁ֨עַר הָ/עַ֜יִן הֶ֠חֱזִיק שַׁלּ֣וּן בֶּן כָּל חֹזֶה֮ שַׂ֣ר פֶּ֣לֶךְ הַ/מִּצְפָּה֒ ה֤וּא יִבְנֶ֨/נּוּ֙ וִ/יטַֽלְלֶ֔/נּוּ ו/יעמידו דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ֠/אֵת חוֹמַ֞ת בְּרֵכַ֤ת הַ/שֶּׁ֨לַח֙ לְ/גַן הַ/מֶּ֔לֶךְ וְ/עַד הַֽ/מַּעֲל֔וֹת הַ/יּוֹרְד֖וֹת מֵ/עִ֥יר דָּוִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/015.yaml
  text: And Shallun son of Col-hozeh[a], official of the district of Mizpah, repaired the Fountain Gate. He rebuilt it and roofed it, and set up its doors, its bolts, and its bars, and repaired the wall of the Pool of Shelah by the king’s garden, as far as the stairs that go down from the City of David.
translation:
  language: tl
  text: At inayos ni Shallun na anak ni Col-Hozeh, pinuno ng distrito ng Mizpa, ang Tarangkahan ng Bukal. Siya mismo ang muling nagtayo nito at nilagyan ng bubong; ikinabit naman nila ang mga pinto, mga pansara, at mga halang nito. Inayos din niya ang pader ng Tipunan ng Tubig ng Shelah[a], sa tabi ng hardin ng hari, hanggang sa mga hagdang bumababa mula sa Lungsod ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tipunan ng Tubig ng Siloah,” na tradisyonal na iniuugnay sa Siloam. Shelah ang anyo ng pangalang Hebreo rito.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: Tarangkahan ng Bukal
  rationale: Ang עַיִן ay maaaring tumukoy sa bukal bilang pinagmumulan ng tubig. Likas at malinaw sa modernong Tagalog ang “Tarangkahan ng Bukal,” at angkop ito sa konteksto ng mga daluyan at tipunan ng tubig sa Jerusalem.
- source_word: הֶחֱזִיק
  choice: inayos
  rationale: Sa Nehemias 3, ginagamit ang pandiwa para sa pagkukumpuni ng isang bahagi ng pader o tarangkahan. Mas natural dito ang “inayos” kaysa sa literal na “pinatibay.”
- source_word: שַׂר פֶּלֶךְ הַמִּצְפָּה
  choice: pinuno ng distrito ng Mizpa
  rationale: Ang שַׂר ay isang pinuno o opisyal, at ang פֶּלֶךְ ay isang administratibong distrito. Hindi pinalalabis ng “pinuno ng distrito” ang tiyak na ranggo ng tungkulin.
- source_word: הוּא יִבְנֶנּוּ
  choice: Siya mismo ang muling nagtayo
  rationale: Binibigyang-diin ng hiwalay na panghalip na הוּא ang taong gumawa. Sa konteksto ng pagpapanumbalik, mas angkop ang “muling nagtayo” kaysa sa payak na “nagtayo.”
- source_word: וִיטַלְלֶנּוּ
  choice: nagbubong nito
  rationale: Ang pandiwang mula sa טלל ay tumutukoy sa pagtatakip o paglalagay ng bubong sa estruktura ng tarangkahan. Maikli at natural ang “nagbubong nito.”
- source_word: ויעמידו דַּלְתֹתָיו מַנְעֻלָיו וּבְרִיחָיו
  choice: ikinabit niya ang mga pinto, mga kandado, at mga halang nito
  rationale: Inilalarawan ng parirala ang paglalagay ng mahahalagang bahagi ng tarangkahan. Ang “ikinabit” ay likas sa Tagalog; ang מַנְעֻלִים ay mga pansara o kandado, samantalang ang בְּרִיחִים ay mga halang. Pinili sa pangunahing teksto ang isahang paksa ayon sa tradisyonal na pagbasa at konteksto, habang itinala sa talababa ang maramihang anyong nakasulat.
- source_word: חוֹמַת בְּרֵכַת הַשֶּׁלַח
  choice: pader ng Tipunan ng Tubig ng Shelah
  rationale: Ang בְּרֵכָה ay isang pool o imbakan ng tubig, hindi kinakailangang palanguyan. Pinananatili ng “Shelah” ang anyo ng pangalang Hebreo sa talata; nasa talababa ang tradisyonal na alternatibo.
- source_word: לְגַן הַמֶּלֶךְ
  choice: sa tabi ng hardin ng hari
  rationale: Sa topograpikong paglalarawan, maaaring ipahiwatig ng לְ ang kaugnayan o lokasyong katabi. Malinaw at natural sa Tagalog ang “sa tabi ng.”
- source_word: וְעַד הַמַּעֲלוֹת הַיּוֹרְדֹות
  choice: hanggang sa mga hagdang pababa
  rationale: Bagaman maaaring literal na mangahulugan ng mga “akyatan” o “hakbang” ang מַעֲלוֹת, nililinaw ng kasunod na participle na pababa ang mga hagdan. Pinananatili ng salin ang topograpikong detalye.
- source_word: מֵעִיר דָּוִיד
  choice: mula sa Lungsod ni David
  rationale: Tuwirang ipinapahayag ng מִן ang pinagmulan. Karaniwan at malinaw sa Tagalog ang “mula sa Lungsod ni David.”
