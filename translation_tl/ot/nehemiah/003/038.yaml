  text: So we rebuilt the wall[a], and the whole wall was joined together up to half its height, for the people had a heart to work.
translation:
  language: tl
  text: Kaya itinayo naming muli ang pader, at nagkadugtong-dugtong ang buong pader hanggang sa kalahati ng taas nito, sapagkat buong pusong nagtrabaho ang mga tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “may puso ang mga tao upang gumawa.” Ibig sabihin, determinado at kusang-loob silang magtrabaho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּבְנֶה
  choice: Kaya itinayo naming muli
  rationale: Ang Qal wayyiqtol na unang panauhang maramihan ay nagpapatuloy sa salaysay. Ipinahihiwatig ng “muli” ang pagpapanumbalik sa umiiral nang pader ng Jerusalem, at natural na ipinahahayag ng “kaya” ang ugnayan sa naunang konteksto.
- source_word: הַחוֹמָה
  choice: ang pader
  rationale: Tumutukoy ang חוֹמָה sa pader na nakapalibot sa isang lunsod; malinaw at natural sa Filipino ang “ang pader.”
- source_word: וַתִּקָּשֵׁר
  choice: napagdugtong-dugtong
  rationale: Ang Niphal ng קשר ay naglalarawan sa mga bahagi ng pader na naging magkakaugnay na kabuuan. Pinananatili ng “napagdugtong-dugtong” ang resultative at di-tahasang balintiyak na diwa.
- source_word: כָּל הַחוֹמָה
  choice: ang buong pader
  rationale: Ang כָּל kasama ng tiyak na pangngalan ay nagpapahayag ng kabuuan; “ang buong pader” ang likas na katumbas.
- source_word: עַד חֶצְיָהּ
  choice: hanggang sa kalahati ng taas nito
  rationale: Literal itong “hanggang sa kalahati nito.” Sa konteksto ng pagtatayo, malamang na taas ng pader ang tinutukoy, kaya nilinaw ito sa salin nang hindi dinaragdagan ang sukat.
- source_word: וַיְהִי לֵב לָעָם
  choice: sapagkat taos-puso ang mga tao
  rationale: Ang idyomang Hebreo ay nagpapahayag ng panloob na determinasyon at kusang-loob na hangaring gumawa. Likas sa modernong Filipino ang “taos-puso,” at ipinahahayag ng “sapagkat” na ang saloobing ito ang dahilan ng mabilis na pagsulong.
- source_word: לַעֲשׂוֹת
  choice: sa paggawa
  rationale: Bagaman malawak ang kahulugan ng עשה na “gumawa,” tumutukoy ito rito sa pagsasagawa ng gawaing pagtatayo.
