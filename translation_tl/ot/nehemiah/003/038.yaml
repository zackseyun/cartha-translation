translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Isinalin nang natural ang idyomang Hebreo sa pangunahing teksto, habang inilagay sa talababa ang literal na larawan nito. Iningatan ang maramihang tinig ng tagapagsalaysay at ang pagkakaugnay-ugnay ng mga bahagi ng pader.
