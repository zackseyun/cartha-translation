revisions:
- from: Ang mga anak ni Hasenaa ang nagtayo ng Pintuan ng mga Isda; nilagyan nila iyon ng mga biga[a] at ikinabit ang mga pinto, mga pangkandado, at mga halang nito.
  to: Ang mga anak ni Hasenaa ang nagtayo ng Pintuan ng mga Isda; binubungan nila ito at ikinabit ang mga pinto nito, mga kandado, at mga halang nito.[a]
  rationale: Pinalitan ang pangunahing salin ng pandiwang Hebreo ng “binubungan” upang maipahayag ang kahulugang pangkonstruksiyon nang hindi ipinagpapalagay na tiyak na mga biga ang tinutukoy. Inilipat ang alternatibong iyon sa talababa. Pinalitan din ang “mga pangkandado” ng mas likas na “mga kandado.” Ang salin ay nagpapanatili sa pokus na ayos na nagbibigay-diin sa mga anak ni Hasenaa bilang mga nagtayo, nang hindi nagpapataw ng di-natural na “sila mismo.”
