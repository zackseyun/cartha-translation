base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/003.yaml
  text: The sons of Hassenaah built the Fish Gate[a]; they roofed it and set up its doors, its bolts[b], and its bars.
translation:
  language: tl
  text: Ang mga anak ni Hasenaa ang nagtayo ng Pintuan ng mga Isda; binubungan nila ito at ikinabit ang mga pinto nito, mga kandado, at mga halang nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinakpan nila ito” o “nilagyan nila ito ng mga biga.” Sa konteksto ng pagtatayo, tumutukoy ang pandiwang Hebreo sa pagtatakip o pagbububong ng isang kayarian; maaari rin itong tumukoy sa paglalagay ng mga biga nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הַדָּגִים
  choice: Pintuan ng mga Isda
  rationale: Tumutukoy ang pariralang konstruktibo sa isang tiyak na pintuan ng lungsod na kaugnay ng mga isda; natural itong pangalan ng pook sa Filipino.
- source_word: בָּנוּ
  choice: nagtayo
  rationale: Karaniwang nangangahulugang ‘magtayo’ ang בנה. Bagaman pagpapanumbalik ang mas malawak na konteksto, hindi tahasang sinasabi rito ng pandiwa na ‘kumpunihin’ o ‘muling itayo.’
- source_word: בְּנֵי הַסְּנָאָה
  choice: mga anak ni Hasenaa
  rationale: Pinananatili ang anyong Hebreo, na maaaring tumukoy sa literal na mga anak o sa mga inapo at kaanib ng isang angkan.
- source_word: הֵמָּה
  choice: ang … ang / nila
  rationale: Naipahihiwatig ang nakahiwalay na panghalip at bahagyang diin nito sa pokus na ayos na ‘Ang mga anak ni Hasenaa ang nagtayo,’ nang hindi gumagamit ng mabigat at di-natural na ‘sila mismo.’
- source_word: קֵרֻהוּ
  choice: nilagyan nila iyon ng mga biga
  rationale: Sa konteksto ng pagtatayo, maaaring mangahulugan ang קרה na takpan, lagyan ng bubong, o ilatag ang mga biga. Ang paglalagay ng mga biga ay angkop sa kayarian ng pintuan at pinananatili ang tiyak na larawang pangkonstruksiyon.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: ikinabit ang mga pinto
  rationale: Literal na ‘pinatayo’ ang mga pinto; sa Filipino, malinaw at natural ang ‘ikinabit’ para sa paglalagay ng mga pinto sa isang pintuang-bayan.
- source_word: מַנְעוּלָיו
  choice: mga pangkandado
  rationale: Tumutukoy sa kagamitang pansara o pansiguro ng pintuan. Iniiwasan ng ‘pangkandado’ ang pagpapakahulugang modernong susian lamang.
- source_word: וּבְרִיחָיו
  choice: mga halang
  rationale: Ang בריח ay baras na ipinapahalang upang tiyaking nakasara ang pinto; ‘halang’ ang tuwiran at natural na katumbas.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang ‘mga anak ni Hasenaa’ upang huwag alisin ang posibilidad na literal na mga anak ang tinutukoy, bagaman maaari rin itong mangahulugang mga inapo o isang pangkat ng angkan. Inayos ang mga talababa upang tumugma ang marker sa mismong salitang may leksikal na alternatibo; hindi sinunod ang hindi tugmang paglalagay ng markers sa English consultation layer.
