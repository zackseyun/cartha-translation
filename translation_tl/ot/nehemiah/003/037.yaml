base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/037.yaml
  text: And do not cover over their guilt[a], and do not let their sin be blotted out from before you[b], for they have provoked anger in the presence of the builders.
translation:
  language: tl
  text: At huwag mong takpan ang kanilang pagkakasala[a], at huwag mong hayaang mabura ang kanilang kasalanan mula sa iyong harapan, sapagkat pumukaw sila ng galit sa harap ng mga nagtatayo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huwag mong patawarin ang kanilang kasamaan.” Ang larawan sa Hebreo ay “huwag mong takpan ang kanilang pagkakasala.”
    reason: lexical_alternative
  - marker: b
    text: O “sapagkat ginalit ka nila sa harap ng mga nagtatayo.” Hindi tahasang binabanggit sa Hebreo kung sino ang ginalit; ipinahihiwatig lamang ng pandiwa na pumukaw sila ng galit sa harap ng mga nagtatayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכַס ... עַל עֲוֺנָם
  choice: takpan ang kanilang pagkakasala
  rationale: Pinananatili ng “takpan” ang larawang Hebreo ng pagtatakip sa kasalanan, na sa kontekstong ito ay maaaring mangahulugang pagpapatawad o hindi pagpapansin dito. Ang “pagkakasala” ay likas sa modernong Tagalog at naihahatid kapuwa ang maling gawa at pananagutan.
- source_word: חַטָּאתָם
  choice: kanilang kasalanan
  rationale: Tuwirang katumbas ito ng karaniwang kahulugan ng חַטָּאת at pinananatili ang pagkakatulad ngunit hindi ganap na pag-uulit sa naunang עָוֹן.
- source_word: מִלְּפָנֶיךָ ... תִּמָּחֶה
  choice: huwag mong pawiin sa harapan mo
  rationale: Ang “pawiin” ay naghahatid ng larawan ng pagbura o pag-aalis, samantalang ang “sa harapan mo” ay nagpapanatili sa malinaw na pananalitang tumutukoy sa presensiya ng Diyos.
- source_word: הִכְעִיסוּ
  choice: pumukaw sila ng galit
  rationale: Hindi tahasang binabanggit sa Hebreo kung sino ang ginalit. Iniiwasan ng saling ito ang pagdaragdag ng di-binanggit na layon habang pinananatili ang sanhiang diwa ng pandiwa.
- source_word: לְנֶגֶד הַבּוֹנִים
  choice: sa harap ng mga nagtatayo
  rationale: Ang לְנֶגֶד ay pangunahing tumutukoy sa pagiging nasa harap o presensiya ng iba. Ang “mga nagtatayo” ay malapit sa participle na Hebreo at malinaw sa konteksto ng muling pagtatayo.
theological_decisions:
- issue: Mapanumpang panalangin laban sa kasalanan ng mga kaaway
  choice: Pinanatili ang tahasang pakiusap na huwag takpan o pawiin ng Diyos ang kanilang kasalanan.
  alternative: Palambutin bilang “huwag mong ipagwalang-bahala ang kanilang masamang ginawa.”
  rationale: Matindi at tahasan ang panalangin sa Hebreo. Hindi ito nilambutan upang mapanatili ang tunay na teolohikal at moral na tensiyon ng teksto.
- issue: Hindi tahasang layon ng הִכְעִיסוּ
  choice: “pumukaw sila ng galit”
  alternative: “ginalit ka nila”
  rationale: Bagaman malamang na Diyos ang ipinahihiwatig na ginalit, hindi ito tahasang sinasabi ng Hebreo; kaya pinanatili ang kalabuan sa pangunahing teksto at inilagay ang mas tiyak na pagbasa sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matinding himig ng panalangin, ang larawang “takpan,” at ang hindi tahasang layon ng pandiwang “pumukaw ng galit,” nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
