  text: וְ/אֵת֩ שַׁ֨עַר הַיְשָׁנָ֜ה הֶחֱזִ֗יקוּ יֽוֹיָדָע֙ בֶּן פָּסֵ֔חַ וּ/מְשֻׁלָּ֖ם בֶּן בְּסֽוֹדְיָ֑ה הֵ֣מָּה קֵר֔וּ/הוּ וַֽ/יַּעֲמִ֨ידוּ֙ דַּלְתֹתָ֔י/ו וּ/מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/006.yaml
  text: And Joiada son of Paseah and Meshullam son of Besodeiah repaired the Old Gate. They laid its beams and set up its doors[a], its bolts, and its bars.
translation:
  language: tl
  text: Inayos nina Joiada na anak ni Paseah at Meshulam na anak ni Besodeias ang Lumang Pintuan[a]. Nilagyan nila iyon ng mga biga at ikinabit ang mga pinto nito, pati ang mga trangka at mga halang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Posible ring “Pintuan ng Jeshana,” kung ang ikalawang salita ay pangalang-pook sa halip na pang-uring “luma.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחֱזִיקוּ
  choice: inayos
  rationale: Sa talaan ng pagtatayo sa Nehemias 3, tumutukoy ang pandiwa sa pagkukumpuni o pagsasaayos ng isang bahagi ng pader o pintuan. Natural at malinaw sa modernong Tagalog ang “inayos.”
- source_word: שַׁעַר הַיְשָׁנָה
  choice: ang Lumang Pintuan
  rationale: Pinakanatural na basahin ang parirala bilang pangalan ng pintuan na nangangahulugang “Lumang Pintuan.” Pinanatili sa talababa ang posibilidad na ang ikalawang salita ay pangalang-pook.
- source_word: קֵרֻהוּ
  choice: nilagyan nila iyon ng mga biga
  rationale: Ang pandiwa ay tumutukoy sa paglalagay ng mga bigang pantakip o pansuporta. Inilalarawan nito ang gawaing pagkakarpintero sa estruktura ng pintuan nang hindi ipinapalagay na bubong ng bahay ang tinutukoy.
- source_word: וַיַּעֲמִידוּ
  choice: ikinabit
  rationale: Literal itong tumutukoy sa pagpapatayo o paglalagay sa tamang puwesto. Sa konteksto ng mga bahagi ng pintuan, natural sa Tagalog ang “ikinabit.”
- source_word: דַּלְתֹתָיו
  choice: ang mga pinto nito
  rationale: Ang anyong maramihan ay malamang na tumutukoy sa magkapares na pinto o dahon ng malaking pintuang-bayan.
- source_word: מַנְעֻלָיו
  choice: mga trangka
  rationale: Tumutukoy ito sa mga pangkandado o pangsara ng pintuan. Mas kongkreto at hindi anachronistic ang “trangka” kaysa modernong mekanikal na “kandado.”
- source_word: בְרִיחָיו
  choice: mga halang
  rationale: Tumutukoy ito sa mahahabang baras na inihahalang upang patibayin ang pagkakasara ng mga pinto. Pinananatili nitong naiiba ang terminong ito sa “mga trangka.”
- source_word: הֵמָּה
  choice: nila
  rationale: Binibigyang-diin ng panghalip na ang dalawang lalaking pinangalanan ang gumawa ng mga sumunod na gawain. Naipahihiwatig ito nang natural sa Tagalog sa panghalip na “nila.”
- source_word: יוֹיָדָע ... וּמְשֻׁלָּם / פָּסֵחַ / בְּסוֹדְיָה
  choice: Joiada ... Meshulam / Paseah / Besodeias
  rationale: Isinalin sa baybay na madaling basahin sa Filipino ang mga personal na pangalan, sa halip na bigyan ang mga ito ng kahulugang salin.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Pinanatili ang maikling estilong pang-ulat ng Hebreo, ngunit hinati sa dalawang pangungusap para sa malinaw na pagbasa. Ang “mga trangka” at “mga halang” ay sadyang pinag-iba upang katawanin ang dalawang magkaibang terminong Hebreo.
