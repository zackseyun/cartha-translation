translation_notes:
  register: 'Gumamit ng natural ngunit marangal na modernong Filipino. Inilagay ang mga talababa sa mga pariralang aktuwal na tinutukoy ng mga ito: [a] pagkatapos ng “Kasunod niya” at [b] pagkatapos ng “bahay ng mga mandirigma.”'
