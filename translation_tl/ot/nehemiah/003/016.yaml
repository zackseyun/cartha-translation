id: NEH.3.16
reference: Nehemiah 3:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַחֲרָ֤י/ו הֶחֱזִיק֙ נְחֶמְיָ֣ה בֶן עַזְבּ֔וּק שַׂ֕ר חֲצִ֖י פֶּ֣לֶךְ בֵּֽית צ֑וּר עַד נֶ֨גֶד֙ קִבְרֵ֣י דָוִ֔יד וְ/עַד הַ/בְּרֵכָה֙ הָ/עֲשׂוּיָ֔ה וְ/עַ֖ד בֵּ֥ית הַ/גִּבֹּרִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/016.yaml
  text: After him Nehemiah son of Azbuk[a], ruler of half the district of Beth-zur, made repairs as far as opposite the tombs of David, and as far as the pool that was made[b], and as far as the house of the mighty men.
translation:
  language: tl
  text: Kasunod niya[a], nagkumpuni si Nehemias na anak ni Azbuk, pinuno ng kalahati ng distrito ng Bet-zur, hanggang sa tapat ng mga libingan ni David, hanggang sa imbakan ng tubig na ginawa, at hanggang sa bahay ng mga mandirigma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Katabi niya,” kung panlugar sa halip na sunod-sunod ang diwa ng parirala sa talaan ng pagkukumpuni.
    reason: lexical_alternative
  - marker: b
    text: O “bahay ng mga magigiting.” Maaaring tumukoy ang Hebreong parirala sa isang gusaling militar, ngunit hindi tiyak kung anong gusali ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Kasunod niya
  rationale: Karaniwang ipinakikita ng pariralang ito sa talaan ng pagkukumpuni ang pagkakasunod ng mga manggagawa o bahagi ng pader. Pinananatili sa talababa ang posibleng kahulugang panlugar.
- source_word: הֶחֱזִיק
  choice: nagkumpuni
  rationale: Sa Nehemias 3, ang Hiphil ng חזק ay idyomatikong tumutukoy sa pagkukumpuni o pagpapanumbalik ng isang bahagi ng pader.
- source_word: שַׂר חֲצִי פֶּלֶךְ
  choice: pinuno ng kalahati ng distrito
  rationale: Ang שַׂר ay isang pinunong opisyal, at ang פֶּלֶךְ sa kontekstong administratibo ng panahong Persiano ay isang distrito, hindi isang buong lalawigan.
- source_word: בֵּית צוּר
  choice: Bet-zur
  rationale: Pangalan ito ng lugar kaya isinalin sa anyong transliterado na angkop sa modernong Filipino.
- source_word: עַד נֶגֶד קִבְרֵי דָוִיד
  choice: hanggang sa tapat ng mga libingan ni David
  rationale: Ipinahihiwatig ng נֶגֶד ang lokasyong kaharap o katapat, nang hindi sinasabing umabot mismo sa loob ng pook-libingan.
- source_word: הַבְּרֵכָה הָעֲשׂוּיָה
  choice: ang imbakan ng tubig na ginawa
  rationale: Pinananatili nito ang pasibo o resultang diwa ng literal na 'ginawang tipunan ng tubig' nang hindi tinutukoy ang hindi tiyak na paraang ginamit sa pagtatayo nito.
- source_word: בֵּית הַגִּבֹּרִים
  choice: bahay ng mga mandirigma
  rationale: Maaaring tumukoy ang גִּבֹּרִים sa magigiting na lalaki o mga mandirigma. Natural sa Filipino ang 'mga mandirigma' at hindi nito ipinapalagay na tiyak na kuwartel ang gusali.
