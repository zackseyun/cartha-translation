id: NEH.3.14
reference: Nehemiah 3:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵ֣ת שַׁ֣עַר הָ/אַשְׁפּ֗וֹת הֶחֱזִיק֙ מַלְכִּיָּ֣ה בֶן רֵכָ֔ב שַׂ֖ר פֶּ֣לֶךְ בֵּית הַכָּ֑רֶם ה֣וּא יִבְנֶ֔/נּוּ וְ/יַעֲמִיד֙ דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/014.yaml
  text: And Malchijah son of Rechab[a], ruler of the district of Beth-haccherem, repaired the Dung Gate. He built it and set up its doors, its bolts, and its bars.
translation:
  language: tl
  text: Kinumpuni ni Malkias na anak ni Recab, na pinuno ng distrito ng Bet-haquerem, ang Tarangkahan ng Dumi[a]. Siya ang nagtayo nito at naglagay ng mga pinto, mga trangka, at mga halang nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tarangkahan ng Basura.” Ang pangalang Hebreo ay tumutukoy sa dumi o basurang itinatapon.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: kinumpuni
  rationale: Sa talaan ng pagtatayo sa Nehemias 3, tumutukoy ang pandiwa sa pagkukumpuni o pagpapatibay ng isang bahagi ng pader o tarangkahan. Likas at malinaw sa Filipino ang “kinumpuni” sa kontekstong ito.
- source_word: שַׁעַר הָאַשְׁפּוֹת
  choice: Tarangkahan ng Dumi
  rationale: Ang אַשְׁפּוֹת ay tumutukoy sa dumi o basurang itinatapon. Pinananatili ng salin ang kongkretong kahulugan ng pangalan ng tarangkahan, habang inilalahad sa talababa ang alternatibong “Tarangkahan ng Basura.”
- source_word: שַׂר פֶּלֶךְ
  choice: pinuno ng distrito
  rationale: Ang שַׂר ay pinuno o opisyal, at ang פֶּלֶךְ ay isang administratibong distrito. Tumpak at natural sa modernong Filipino ang pariralang ito.
- source_word: בֵּית הַכָּרֶם
  choice: Bet-haquerem
  rationale: Pangalan ito ng isang lugar, kaya tinumbasan sa pamamagitan ng transliterasyon sa halip na isalin bilang “bahay ng ubasan.”
- source_word: הוּא יִבְנֶנּוּ
  choice: Siya ang nagtayo nito
  rationale: Ang בנה ay payak na “magtayo” o “bumuo.” Iniiwasan ng “nagtayo” ang pagdaragdag ng tahasang ideya ng “muling” wala sa mismong pandiwa, samantalang ang “Siya ang” ay nagpapakita ng diin ng הוּא.
- source_word: וְיַעֲמִיד
  choice: naglagay
  rationale: Ang hiphil ng עמד dito ay nangangahulugang ilagay o ikabit sa kinalalagyan ang mga bahagi ng tarangkahan. Natural at madaling maunawaan ang “naglagay.”
- source_word: דַּלְתֹתָיו
  choice: mga pinto nito
  rationale: Tumutukoy ang maramihang anyo sa mga dahon o panel ng tarangkahan; malinaw sa karaniwang mambabasa ang “mga pinto.”
- source_word: מַנְעֻלָיו
  choice: mga trangka nito
  rationale: Tumutukoy ang salita sa kagamitang pansara o pangkandado. Ang “mga trangka” ay angkop sa malalaking pinto ng tarangkahan at naihihiwalay sa kasunod na mga halang.
- source_word: וּבְרִיחָיו
  choice: mga halang nito
  rationale: Ang בְּרִיחַ ay isang pahalang na baras na pansara ng pinto o tarangkahan. Maikli at angkop ang “mga halang” sa konteksto.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, marangal, at madaling maunawaang Filipino. Tinranslitera ang mga pangalang pantangi bilang Malkias, Recab, at Bet-haquerem. Inilagay ang talababa pagkatapos ng “Tarangkahan ng Dumi,” sapagkat ang paliwanag ay tungkol sa pangalan ng tarangkahan.
