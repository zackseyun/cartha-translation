base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/019.yaml
  text: Next to him Ezer son of Jeshua[a], official of Mizpah[c][b], repaired another section opposite the ascent to the armory at the angle.
translation:
  language: tl
  text: Kasunod niya, nag-ayos si Ezer na anak ni Jeshua, na pinuno ng Mizpa, ng isa pang bahagi[a] sa tapat ng daang paakyat patungo sa imbakan ng mga sandata[b], sa panulukan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang ikalawang bahagi.” Maaaring idiin ng pariralang Hebreo na isa pa itong bahagi ng pader na inayos ni Ezer.
    reason: lexical_alternative
  - marker: b
    text: O “mga sandata.” Malamang na tumutukoy rito ang Hebreo sa isang lugar na pinaglalagyan ng mga sandata.
    reason: lexical_alternative
  - marker: c
    text: O “sa kanto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: inayos
  rationale: Sa konteksto ng Nehemias 3, tumutukoy ang pandiwa sa pagkukumpuni at muling pagpapatibay ng pader. Natural sa Filipino ang “inayos” at hindi nito nililimitahan ang gawain sa simpleng pagpapalakas lamang.
- source_word: עַל יָדוֹ
  choice: Kasunod niya
  rationale: Ipinapakita ng paulit-ulit na pariralang ito ang pagkakasunod o pagkakatabi ng mga gumagawa sa pader; malinaw at natural dito ang “Kasunod niya.”
- source_word: שַׂר הַמִּצְפָּה
  choice: ang pinuno ng Mizpa
  rationale: Ang שַׂר ay pinunong may tungkuling administratibo. Ang “pinuno” ay marangal at malawak na katawagang hindi nagpapahiwatig ng pagiging hari.
- source_word: מִדָּה שֵׁנִית
  choice: ang isa pang bahagi
  rationale: Malamang na tumutukoy ito sa karagdagang seksiyon ng pader na kanyang inayos. Mas natural sa Filipino ang “isa pang bahagi,” habang pinananatili sa talababa ang literal na posibilidad na “ikalawang bahagi.”
- source_word: מִנֶּגֶד
  choice: sa tapat ng
  rationale: Tumpak nitong ipinapahayag ang lokasyong kaharap o katapat ng isang palatandaan.
- source_word: עֲלֹת
  choice: daang paakyat sa
  rationale: Ang anyo mula sa עלה ay tumutukoy sa isang paakyat na lapit o daan. Nililinaw ng “daang paakyat sa” ang topograpiya sa natural na Filipino.
- source_word: הַנֶּשֶׁק
  choice: imbakan ng mga sandata
  rationale: Bagaman maaari itong mangahulugang “mga sandata,” malamang na tumutukoy ito rito sa isang lugar na kaugnay ng pag-iimbak ng mga sandata. Nauunawaan agad sa modernong Filipino ang “imbakan ng mga sandata.”
- source_word: הַמִּקְצֹעַ
  choice: panulukan
  rationale: Tumutukoy ang salita sa kanto o pagliko ng pader. Ang “panulukan” ay natural na terminong pang-arkitektura at pinananatili ang heometrikong diwa.
