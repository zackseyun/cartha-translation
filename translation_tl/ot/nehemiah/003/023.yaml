base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/023.yaml
  text: After him Benjamin and Hasshub made repairs opposite their house. After him Azariah son of Maaseiah[a], son of Ananiah, made repairs beside his house.
translation:
  language: tl
  text: Kasunod niya, nagkumpuni sina Benjamin at Hasub sa tapat ng kanilang bahay. Kasunod niya, nagkumpuni si Azarias na anak ni Maaseias, na anak ni Ananias, sa tabi ng kanyang bahay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Kasunod niya
  rationale: Sa talaan ng pagkukumpuni sa Nehemias 3, ipinahihiwatig nito ang pagkakasunod-sunod ng mga gumagawa sa kahabaan ng pader, hindi lamang ang pagkakasunod sa panahon.
- source_word: הֶחֱזִיק
  choice: nagkumpuni
  rationale: Ang Hiphil ng חזק ay ginagamit sa kabanatang ito bilang katawagan sa paggawa o pagkukumpuni ng pader; natural at malinaw itong ipinapahayag ng “nagkumpuni.”
- source_word: בִּנְיָמִן וְחַשּׁוּב
  choice: sina Benjamin at Hasub
  rationale: Isinalin sa karaniwang anyong Filipino ang mga pangalang pantangi; ginamit ang “sina” dahil dalawang tao ang simuno.
- source_word: נֶגֶד בֵּיתָם
  choice: sa tapat ng kanilang bahay
  rationale: Pinananatili ng “sa tapat” ang topograpikong ugnayan, at ng isahang “bahay” ang bilang ng pangngalang Hebreo na may hulaping maramihan.
- source_word: עֲזַרְיָה בֶן מַעֲשֵׂיָה בֶּן עֲנָנְיָה
  choice: si Azarias na anak ni Maaseias, na anak ni Ananias
  rationale: Pinananatili ang sunod-sunod na talaangkanan at nililinaw ng kuwit na si Maaseias ang anak ni Ananias.
- source_word: אֵצֶל בֵּיתוֹ
  choice: sa tabi ng kanyang bahay
  rationale: Ipinahahayag ng “sa tabi” ang lapit na tinutukoy ng אֵצֶל at pinananatili ang konkretong pagtukoy sa bahay.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kasunod niya” upang maging natural ang paulit-ulit na pormula ng talaan habang pinananatili ang heograpikong pagkakasunod ng mga bahagi ng pader.
