base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/001.yaml
  text: Then Eliashib the high priest rose up with his brothers the priests[a], and they built the Sheep Gate. They consecrated it and set up its doors; they consecrated it as far as the Tower of the Hundred, as far as the Tower of Hananel.
translation:
  language: tl
  text: Pagkatapos, tumindig si Eliasib na punong pari kasama ang mga kapatid niyang pari, at itinayo nila ang Tarangkahan ng mga Tupa. Sila mismo ang nagtalaga nito bilang banal[a] at nagkabit ng mga pinto nito. Itinalaga nila ito bilang banal hanggang sa Tore ng Sandaan, hanggang sa Tore ni Hananel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinalaga ito.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagbubukod ng isang bagay bilang banal o sa natatanging pagtatalaga nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Pinananatili nito ang idyomang Hebreo na naghuhudyat sa pagsisimula ng pagkilos, nang hindi dinaragdagan ng mas tiyak na interpretasyong “nagsimulang gumawa.”
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: punong pari
  rationale: Ito ang likas at karaniwang katawagan sa modernong Tagalog para sa opisyal na titulong Hebreo.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: kasama ang mga kapatid niyang pari
  rationale: Pinananatili ang salitang tumutukoy sa mga kapatid at ang pagkakakilanlan nila bilang mga pari, sa halip na gawing “mga kapwa pari” lamang.
- source_word: שַׁעַר הַצֹּאן
  choice: Tarangkahan ng mga Tupa
  rationale: Malinaw itong pangalan ng isang tarangkahan at pinananatili ang konkretong larawan ng mga tupa.
- source_word: הֵמָּה
  choice: Sila mismo
  rationale: Ipinahahayag nito ang diin ng hiwalay na panghalip sa Hebreo.
- source_word: קִדְּשׁוּהוּ
  choice: nagtalaga nito bilang banal
  rationale: Naipapakita nito ang sagradong pagbubukod o pagtatalaga na ipinahihiwatig ng ugat na קדשׁ, habang nananatiling natural sa Tagalog.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: nagkabit ng mga pinto nito
  rationale: Natural na ipinahahayag sa Tagalog ang paglalagay ng mga pinto sa kanilang kinalalagyan nang hindi tinutukoy ang eksaktong mekanismo.
- source_word: מִגְדַּל הַמֵּאָה
  choice: Tore ng Sandaan
  rationale: Tuwirang isinasalin ang anyong construct at tinatrato ito bilang pangalan ng pook.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: Tore ni Hananel
  rationale: Isinasalin ang katawagang “tore” at tinutumbasan nang natural sa Tagalog ang pangalang pantangi.
- source_word: וְעַד ... עַד
  choice: hanggang sa ... hanggang sa
  rationale: Pinananatili ang pag-uulit na nagmamarka sa saklaw ng pagtatalaga.
theological_decisions:
- issue: Sagradong diwa ng קדשׁ kaugnay ng tarangkahan
  choice: nagtalaga nito bilang banal
  alternative: inialay o itinalaga ito
  rationale: Pinananatili ng salin ang relihiyosong diwa ng pagbubukod bilang banal, ngunit hindi nito pinalalawak ang gawaing inilalarawan nang higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang diin ng “Sila mismo,” ang pag-uulit ng “hanggang sa,” at ang literal na ugnayang pampamilya sa “mga kapatid niyang pari.” Inilagay ang talababa sa pariralang talagang tinutukoy nito, ang salin ng קִדְּשׁוּהוּ.
