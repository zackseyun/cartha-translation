  naturalness: Natural at angkop sa modernong Filipino ang “Kasunod niya” at “nagkumpuni.” Mas tuwiran at hindi labis na mariin ang “kanyang silid” kaysa “sarili niyang silid”; sapat na ang hulaping panghalip sa Hebreo upang iugnay ang silid kay Mesulam.
  terminology: Ang “isa pang bahagi” ay angkop para sa מִדָּה שֵׁנִי, na may talababa para sa literal na kahulugan. Ang mga anyong Filipino ng mga pangalan ay pare-pareho at makikilala. Ang “ang ikaanim na anak ni Zalaf” ay isang makatwirang paglilinaw ng elliptikong ordinal sa Hebreo.
