base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/030.yaml
  text: After him Hananiah son of Shelemiah and Hanun the sixth son of Zalaph repaired another section[b][a]. After him Meshullam son of Berechiah repaired opposite his chamber.
translation:
  language: tl
  text: Kasunod niya[b], nagkumpuni ng isa pang bahagi[a] sina Hananias na anak ni Selemias at Hanun, ang ikaanim na anak ni Zalaf. Kasunod niya, nagkumpuni si Mesulam na anak ni Berequias sa tapat ng kanyang silid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ikalawang sukat”; sa Nehemias 3, tumutukoy ang pariralang ito sa isa pang bahaging ipinagkumpuni.
    reason: lexical_alternative
  - marker: b
    text: Ang unang parirala ay literal na may anyong “Kasunod ko,” ngunit sa konteksto ay karaniwang inuunawa bilang “Kasunod niya,” alinsunod sa paulit-ulit na pormula sa kabanatang ito.
    reason: textual_variant
lexical_decisions:
- source_word: אַחֲרַי / אַחֲרָיו
  choice: Kasunod niya
  rationale: Sa talaan ng mga nagkukumpuni sa Nehemias 3, ito ang paulit-ulit na pormulang nagsasaad ng pagkakasunod o kinalalagyan kaugnay ng naunang manggagawa. Pinananatili ng salin ang kontekstuwal na diwang 'kasunod niya' sa halip na ang literal ngunit nakagugulong na 'kasunod ko' sa unang anyo.
- source_word: הֶחֱזִיק
  choice: nagkumpuni
  rationale: Sa kabanatang ito, tumutukoy ang pandiwa sa pagkukumpuni o pagpapanumbalik ng pader at mga pintuang-bayan. Natural at tiyak sa modernong Filipino ang 'nagkumpuni.'
- source_word: הַשִּׁשִּׁי
  choice: ang ikaanim na anak
  rationale: Ang ordinal ay pinakamalamang na tumutukoy sa puwesto ni Hanun sa mga anak ni Zalaf. Idinagdag ang 'anak' upang maipahayag nang malinaw sa Filipino ang elipsis sa Hebreo.
- source_word: מִדָּה שֵׁנִי
  choice: isa pang bahagi
  rationale: Literal itong 'ikalawang sukat,' ngunit sa konteksto ng Nehemias 3 ay tumutukoy sa karagdagang seksiyon ng pader na ipinagkumpuni.
- source_word: נֶגֶד
  choice: sa tapat ng
  rationale: Ipinahihiwatig ng pang-ukol ang lokasyong kaharap o nasa harapan ng tinutukoy na silid.
- source_word: נִשְׁכָּתוֹ
  choice: sarili niyang silid
  rationale: Ang pangngalan ay isang silid o kuwarto, maaaring pantahanan o opisyal. Ang 'silid' ay natural at hindi labis na tumutukoy sa gamit nito; nililinaw ng 'sarili niyang' ang hulaping panghalip.
- source_word: חֲנַנְיָה / שֶׁלֶמְיָה / חָנוּן / צָלָף / מְשֻׁלָּם / בֶּרֶכְיָה
  choice: Hananias / Selemias / Hanun / Zalaf / Mesulam / Berequias
  rationale: Ginamit ang mga anyong madaling basahin sa Filipino at naaayon sa nakaugaliang pag-angkop ng mga pangalang biblikal, habang nananatiling makikilala ang mga pangalang Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'nagkumpuni' at 'silid' sa halip na mas arkaiko o labis na teknikal na mga salita. Pinanatili ang maikli at paulit-ulit na ayos ng talaan sa Hebreo.
