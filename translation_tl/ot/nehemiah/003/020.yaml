  text: אַחֲרָ֨י/ו הֶחֱרָ֧ה הֶחֱזִ֛יק בָּר֥וּךְ בֶּן זבי מִדָּ֣ה שֵׁנִ֑ית מִן הַ֨/מִּקְצ֔וֹעַ עַד פֶּ֨תַח֙ בֵּ֣ית אֶלְיָשִׁ֔יב הַ/כֹּהֵ֖ן הַ/גָּדֽוֹל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/020.yaml
  text: After him[a], Baruch son of Zabbai zealously repaired a second section[b], from the angle to the entrance of the house of Eliashib the high priest.
translation:
  language: tl
  text: Pagkatapos niya, buong sigasig na kinumpuni[b] ni Baruc na anak ni Zabai[a] ang ikalawang bahagi ng pader, mula sa panulukan hanggang sa pasukan ng bahay ni Eliasib na punong pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Zacai,” ayon sa ibang tradisyon ng pangalan na makikita sa ilang salin.
    reason: alternative_reading
  - marker: b
    text: Pambihira ang pananalitang Hebreo rito at malamang na nagdiriin sa matinding sigasig o pambihirang pagsisikap ni Baruc sa gawain.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Pagkatapos niya
  rationale: Sa talaan ng pagkukumpuni, ipinahihiwatig nito kapwa ang pagkakasunod ng mga manggagawa at ang pagkakadugtong ng bahaging ginawa nila.
- source_word: הֶחֱרָה הֶחֱזִיק
  choice: buong sigasig na kinumpuni
  rationale: Karaniwang tumutukoy ang הֶחֱזִיק sa pagkukumpuni o pagpapatibay sa kabanatang ito, samantalang ang pambihirang הֶחֱרָה ay nagbibigay-diin sa matinding sigasig ni Baruc.
- source_word: בָּרוּךְ בֶּן זבי
  choice: Baruc na anak ni Zabai
  rationale: Isinalin sa baybay-Filipino ang mga pangalang Hebreo; pinananatili sa talababa ang alternatibong tradisyon ng pangalan.
- source_word: מִדָּה שֵׁנִית
  choice: ikalawang bahagi ng pader
  rationale: Sa konteksto, ito ay isa pang nakatalagang seksiyon ng pader na kinumpuni ni Baruc, hindi isang literal na sukat.
- source_word: מִן הַמִּקְצוֹעַ
  choice: mula sa panulukan
  rationale: Tumutukoy ang pangngalan sa sulok o likuan ng pader; likas at angkop sa arkitektura ang “panulukan.”
- source_word: עַד פֶּתַח בֵּית
  choice: hanggang sa pasukan ng bahay ni
  rationale: Malamang na pisikal na pasukan ng tirahan o bakuran ang tinutukoy, kaya malinaw ang “pasukan ng bahay.”
- source_word: אֶלְיָשִׁיב הַכֹּהֵן הַגָּדוֹל
  choice: Eliasib na punong pari
  rationale: Ang “punong pari” ang natural at kinikilalang salin sa Filipino ng pamagat na הַכֹּהֵן הַגָּדוֹל.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong sigasig na kinumpuni” upang natural na maipahayag ang diin ng pambihirang pariralang Hebreo, at idinagdag ang “ng pader” bilang kontekstuwal na paglilinaw sa tinutukoy na bahagi.
