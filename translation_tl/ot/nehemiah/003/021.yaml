base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/021.yaml
  text: After him[a], Meremoth son of Uriah, son of Hakkoz, repaired another section, from the entrance of the house of Eliashib to the end of the house of Eliashib.
translation:
  language: tl
  text: Kasunod niya, kinumpuni ni Meremot na anak ni Urias, na anak ni Hakoz, ang isa pang bahagi[a], mula sa pasukan ng bahay ni Eliasib hanggang sa dulo ng bahay ni Eliasib.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “ikalawang bahagi.” Maaaring tumukoy ang pariralang Hebreo sa isa pang bahaging iniatas kay Meremot o, sa mas literal na pananalita, sa “ikalawang sukat” o “ikalawang haba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Kasunod niya
  rationale: Sa talaan ng mga gumagawa sa Nehemias 3, ipinapakita ng parirala ang pagkakasunod-sunod ng mga bahagi ng gawain; pinananatili rin nito ang posibleng kaugnayang panlunan nang hindi ginagawang tahasang 'katabi.'
- source_word: הֶחֱזִיק
  choice: kinumpuni
  rationale: Bagaman pangunahing may diwang 'pinatibay,' ginagamit ang pandiwa sa kabanatang ito para sa pagkukumpuni ng pader at ng mga kaugnay na gusali.
- source_word: מְרֵמוֹת בֶּן אוּרִיָּה בֶּן הַקּוֹץ
  choice: Meremot na anak ni Urias at apo ni Hakoz
  rationale: Natural sa modernong Tagalog ang 'apo' para sa ikalawang antas ng patronimiko, habang malinaw na napapanatili ang talaangkanan.
- source_word: מִדָּה שֵׁנִית
  choice: isa pang bahagi
  rationale: Malamang na tumutukoy ito sa karagdagang bahaging ipinagawa kay Meremot, na nauna nang binanggit sa talata 4. Inilalagay sa talababa ang mas pormal na alternatibong 'ikalawang sukat o haba.'
- source_word: מִפֶּתַח בֵּית אֶלְיָשִׁיב
  choice: mula sa pasukan ng bahay ni Eliasib
  rationale: Ang פֶּתַח ay bukana, pintuan, o pasukan; malinaw at natural ang 'pasukan' sa paglalarawan ng gusali.
- source_word: וְעַד תַּכְלִית בֵּית אֶלְיָשִׁיב
  choice: hanggang sa dulo ng bahay nito
  rationale: Ang תַּכְלִית ay tumutukoy rito sa hangganan o dulong bahagi. Ginamit ang 'nito' upang maiwasan ang mabigat na pag-uulit ngunit malinaw pa ring bahay ni Eliasib ang tinutukoy.
