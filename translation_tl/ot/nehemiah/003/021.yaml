    issue: Ang “apo ni Hakoz” ay interpretatibong pagpapaliit ng patronimikong “anak ni Urias, anak ni Hakoz.”
    rationale: Bagaman posibleng tama sa karaniwang genealogical na pagbasa, mas ligtas at mas transparent na panatilihin ang ayos ng pinagmulan, lalo na dahil maaaring mas malawak ang gamit ng בן sa mga talaan ng angkan.
  - severity: low
    issue: Pinalitan ng “bahay nito” ang inuulit na “bahay ni Eliasib.”
    rationale: Hindi mali ang panghalip, ngunit ang pag-uulit ng pangalan ay mas malinaw at ginagaya ang saklaw na itinakda ng Hebreo sa magkabilang dulo ng parirala.
