    rationale: Ang “looban ng mga guwardiya” ay mas malinaw na katumbas ng ‘court of the guard’ at mas karaniwang modernong gamit, nang hindi ipinapasok sa pangunahing teksto ang mas tiyak na ‘bilangguan.’
