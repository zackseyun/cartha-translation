base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/025.yaml
  text: Palal son of Uzai repaired opposite the angle and the tower projecting from the upper house of the king[a], which is by the court of the guard[c][b]. After him Pedaiah son of Parosh repaired.
translation:
  language: tl
  text: Nagkumpuni si Palal na anak ni Uzai sa tapat ng sulok[a] at ng toreng nakausli mula sa itaas na bahay ng hari[b], na nasa tabi ng looban ng mga guwardiya[c]. Kasunod niya, nagkumpuni si Pedaya na anak ni Paros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anggulo.”
    reason: lexical_alternative
  - marker: b
    text: O “mula sa palasyo sa itaas.” Sa Hebreo, literal na “mula sa itaas na bahay ng hari.”
    reason: lexical_alternative
  - marker: c
    text: O “looban ng bilangguan.” Malamang na tumutukoy ang salita sa isang binabantayang looban na ginagamit din sa detensiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: sa tapat ng
  rationale: Likas na nagpapahayag ng ugnayang panlunan sa listahan ng mga kinukumpuning bahagi, nang hindi tinutukoy nang labis ang eksaktong agwat.
- source_word: הַמִּקְצוֹעַ
  choice: anggulo
  rationale: Tumutukoy sa liko o sulok ng pader o gusali. Pinananatili ng “anggulo” ang arkitektural na diwa; inilagay sa talababa ang “sulok” bilang tunay na alternatibo.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: toreng nakausli
  rationale: Ipinahihiwatig ng participle na ang tore ay nakaungos o nakausli mula sa gusali o pader.
- source_word: מִבֵּית הַמֶּלֶךְ הָעֶלְיוֹן
  choice: mula sa itaas na bahay ng hari
  rationale: Malapit ito sa anyong Hebreo at hindi agad ipinapalagay na ang בֵּית ay tiyak na nangangahulugang buong palasyo. Maaaring tumukoy ang “itaas” sa kinalalagyan o sa isang mataas na bahagi ng gusaling maharlika.
- source_word: אֲשֶׁר לַחֲצַר הַמַּטָּרָה
  choice: na nasa tabi ng looban ng mga bantay
  rationale: Ang מַטָּרָה ay tumutukoy rito sa isang binabantayang looban, na maaari ring kaugnay ng detensiyon. Hindi ipinapasok sa pangunahing teksto ang mas tiyak na diwang “bilangguan.”
- source_word: אַחֲרָיו
  choice: Kasunod niya
  rationale: Ito ang likas na Filipino para sa pormulang nagpapakilala sa susunod na manggagawa sa magkakasunod na talaan.
- source_word: פָּלָל / אוּזַי / פְּדָיָה / פַּרְעֹשׁ
  choice: Palal / Uzai / Pedaya / Paros
  rationale: Isinulat ang mga pangalang Hebreo sa paraang madaling basahin at bigkasin sa modernong Filipino.
- source_word: '[elliptical repair verb]'
  choice: nagkumpuni
  rationale: Walang hayag na pandiwa sa talata, ngunit hinihingi ito ng sintaks ng Filipino at malinaw itong nauunawaan mula sa paulit-ulit na padron ng Nehemias 3.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “nagkumpuni” upang punan ang pandiwang ipinapalagay sa Hebreo mula sa konteksto. Pinanatili sa pangunahing teksto ang literal ngunit malinaw na “bahay ng hari,” habang nasa talababa ang mas interpretibong “palasyo.”
