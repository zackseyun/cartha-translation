translation_notes:
  register: Gumamit ng natural, malinaw, at marangal na modernong Tagalog. Ang “nina” ay angkop sa tambalang simuno, at ang mga pangalan ay binaybay sa paraang madaling basahin sa Filipino ngunit malapit sa Hebreo.
