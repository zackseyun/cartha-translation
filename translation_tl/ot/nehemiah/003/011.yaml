id: NEH.3.11
reference: Nehemiah 3:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִדָּ֣ה שֵׁנִ֗ית הֶחֱזִיק֙ מַלְכִּיָּ֣ה בֶן חָרִ֔ם וְ/חַשּׁ֖וּב בֶּן פַּחַ֣ת מוֹאָ֑ב וְ/אֵ֖ת מִגְדַּ֥ל הַ/תַּנּוּרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/011.yaml
  text: Malchijah son of Harim and Hasshub son of Pahath-moab repaired another section[b][a], and also the Tower of the Ovens.
translation:
  language: tl
  text: Kinumpuni nina Malkias na anak ni Harim at Hasub na anak ni Pahat-Moab ang isa pang bahagi[a], gayundin ang Tore ng mga Hurno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang ikalawang bahagi.” Maaari itong isalin nang mas literal mula sa Hebreo; sa kontekstong ito, tumutukoy ito sa isa pang bahaging iniatas na kumpunihin.
    reason: lexical_alternative
  - marker: b
    text: O “Tore ng mga Pugon.” Ang salitang Hebreo ay maaaring tumukoy sa mga hurno o mga pugon.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּה שֵׁנִית
  choice: isa pang bahagi
  rationale: Sa talaan ng pagkukumpuni sa Nehemias 3, tumutukoy ang parirala sa karagdagang bahagi ng pader. Likas sa modernong Tagalog ang “isa pang bahagi,” habang pinananatili sa talababa ang mas pormal na “ikalawang bahagi.”
- source_word: הֶחֱזִיק
  choice: kinumpuni
  rationale: Bagaman pangunahing nangangahulugan ang pandiwa na humawak o magpalakas, sa konteksto ng muling pagtatayo ng pader ay tumutukoy ito sa pagkukumpuni o pagpapatibay; “kinumpuni” ang pinakamalinaw dito.
- source_word: מַלְכִּיָּה
  choice: Malkias
  rationale: Isinalin sa baybay na madaling bigkasin sa Filipino habang malapit sa anyong Hebreo ng pangalang pantangi.
- source_word: בֶן חָרִם
  choice: anak ni Harim
  rationale: Direkta at likas na salin ng ugnayang pampamilya.
- source_word: וְחַשּׁוּב
  choice: at Hasub
  rationale: Pinanatili ang pangatnig at isinalin sa baybay-Filipino ang pangalang pantangi.
- source_word: בֶן פַּחַת מוֹאָב
  choice: anak ni Pahat-Moab
  rationale: Pinanatili bilang tambalang pangalan ng angkan o pamilya, sa baybay na malapit sa Hebreo.
- source_word: וְאֵת
  choice: gayundin ang
  rationale: Ipinakikita nito na bukod sa bahaging nabanggit ay kabilang din sa kanilang kinumpuni ang tore.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: Tore ng mga Hurno
  rationale: Ang מִגְדָּל ay “tore,” at ang תַּנּוּרִים ay maaaring tumukoy sa mga hurno o pugon. Pinananatili ng salin ang konkretong anyo ng pangalan ng lugar nang hindi tinitiyak ang eksaktong gamit ng mga ito.
