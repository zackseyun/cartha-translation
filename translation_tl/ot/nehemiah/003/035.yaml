base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/035.yaml
  text: And Tobiah the Ammonite was beside him[a], and he said, “Even what they are building—if a fox climbs up on it[b], he will break through their stone wall!”
translation:
  language: tl
  text: At nasa tabi niya si Tobias na Ammonita. Sinabi nito, “Kahit ang itinatayo nila—kapag inakyatan iyon ng isang soro[a], gigibain nito ang kanilang batong pader!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo para sa “soro” ay maaari ring tumukoy, sa ilang konteksto, sa isang hayop na kauri ng soro, gaya ng chakal.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “gigibain nito” bilang “bubutasin nito” o “wawasakin nito.” Ipinahihiwatig ng pandiwang Hebreo ang pagbretsa o paggiba, bilang bahagi ng panunuya ni Tobias sa kahinaan ng pader.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְלוֹ
  choice: nasa tabi niya
  rationale: Tuwirang ipinahahayag ang pisikal na pagkalapit ni Tobias sa taong binabanggit sa naunang konteksto, nang hindi dinaragdagan ang diwa ng Hebreo.
- source_word: גַּם אֲשֶׁר הֵם בּוֹנִים
  choice: Kahit ang itinatayo nila
  rationale: 'Ipinakikita ng “kahit” ang mapanuyang diin ng גַּם: minamaliit ni Tobias maging ang kasalukuyan nilang itinatayo.'
- source_word: אִם יַעֲלֶה
  choice: kapag inakyatan iyon
  rationale: Ang kondisyon ay inihayag sa natural na Filipino. Ang “iyon” ay tumutukoy sa pader na ipinahihiwatig sa Hebreo.
- source_word: שׁוּעָל
  choice: soro
  rationale: Ang “soro” ang karaniwang katumbas ng salitang Hebreo rito, habang kinikilala sa talababa ang posibleng mas malawak na saklaw nito.
- source_word: וּפָרַץ
  choice: gigibain nito
  rationale: Ipinahahayag nito ang pagwasak o pagbaklas sa pader na nilalait bilang napakahina. Ang panghalip na “nito” ay natural na tumutukoy sa soro, gaya ng panlalaking pang-isahang pandiwa sa Hebreo.
- source_word: חוֹמַת אַבְנֵיהֶם
  choice: kanilang batong pader
  rationale: Natural na Filipino ito para sa konstruktong literal na “pader ng kanilang mga bato” at pinananatili ang pagtukoy sa materyales.
