base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/005.yaml
  text: And behold[a], Saul was coming from the field behind the cattle, and Saul said, “What is wrong with the people[b], that they are weeping?” And they told him the words of the men of Jabesh.
translation:
  language: tl
  text: At narito, dumarating si Saul mula sa bukid, kasunod ng mga baka.[a] Sinabi ni Saul, “Ano ang nangyayari sa mga tao, at bakit sila umiiyak?” At isinalaysay nila sa kanya ang sinabi ng mga lalaki ng Jabes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa likuran ng mga baka.” Ang pariralang Hebreo ay naglalarawan kay Saul na dumarating mula sa bukid kasunod ng mga baka.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang mga salita ng mga lalaki ng Jabes”; maaari ring “ang mensahe ng mga lalaki ng Jabes.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang panandang naglilipat ng tagpo at ang masiglang himig ng salaysay, sa likas ngunit marangal na Tagalog.
- source_word: בָּא
  choice: pauwi
  rationale: Ipinahihiwatig ng participle ang kilos na nagaganap. Sa konteksto ng pagbabalik mula sa bukid kasama ng mga baka, likas sa Tagalog ang “pauwi,” bagaman ang payak na diwa ay “dumarating.”
- source_word: אַחֲרֵי הַבָּקָר
  choice: kasunod ng mga baka
  rationale: Pinananatili ang kongkretong larawang nasa likuran o sumusunod si Saul sa mga baka; hindi nililimitahan ang בָּקָר sa mga kapong baka lamang.
- source_word: מִן הַשָּׂדֶה
  choice: mula sa bukid
  rationale: Tuwirang ipinapahayag ang pinanggalingan ni Saul.
- source_word: מַה לָעָם
  choice: Ano ang nangyari sa mga tao
  rationale: Likas na katumbas sa modernong Tagalog ng idyomang nagtatanong kung ano ang suliranin o dahilan ng kalagayan nila.
- source_word: כִּי יִבְכּוּ
  choice: at umiiyak sila
  rationale: Ipinapakita ang patuloy na pag-iyak bilang kalagayang nag-udyok sa tanong ni Saul.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: At isinalaysay nila sa kanya
  rationale: Tumutugma sa pagkukuwento o pag-uulat nila kay Saul at angkop sa marangal na salaysay.
- source_word: דִּבְרֵי אַנְשֵׁי יָבֵישׁ
  choice: ang sinabi ng mga lalaki ng Jabes
  rationale: Natural na inililipat ang literal na “mga salita ng mga lalaki ng Jabes” nang hindi nawawala ang ugnay nito sa naunang mensahe o pahayag nila.
