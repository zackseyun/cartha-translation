  naturalness: Likas at malinaw ang salaysay sa modernong Filipino Tagalog sa “dumarating” at sa tanong na “bakit sila umiiyak?”
  terminology: Ang “Saul,” “Jabes,” “mga baka,” at “mga lalaki ng Jabes” ay angkop. Ang “mga lalaki” ay pinananatili para sa אַנְשֵׁי nang hindi pinalalawak sa lahat ng mamamayan.
