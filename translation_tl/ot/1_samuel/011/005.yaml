translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Jabes,” ang karaniwang anyong Tagalog ng pangalan. Inilagay ang [a] pagkatapos ng pariralang tinutukoy nito at ang [b] pagkatapos ng buong pariralang may lexical na alternatibo.
