  text: וַ/יֹּאמְר֞וּ לַ/מַּלְאָכִ֣ים הַ/בָּאִ֗ים כֹּ֤ה תֹֽאמְרוּ/ן֙ לְ/אִישׁ֙ יָבֵ֣ישׁ גִּלְעָ֔ד מָחָ֛ר תִּהְיֶֽה לָ/כֶ֥ם תְּשׁוּעָ֖ה ב/חם הַ/שָּׁ֑מֶשׁ וַ/יָּבֹ֣אוּ הַ/מַּלְאָכִ֗ים וַ/יַּגִּ֛ידוּ לְ/אַנְשֵׁ֥י יָבֵ֖ישׁ וַ/יִּשְׂמָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/009.yaml
  text: 'They said to the messengers who were coming[a], “Thus you shall say to the men of Jabesh-gilead: Tomorrow, by the heat of the sun, you will have deliverance.” So the messengers came and told the men of Jabesh[b], and they rejoiced.'
translation:
  language: tl
  text: 'Sinabi nila sa mga mensaherong dumating, “Ito ang sabihin ninyo sa mga taga-Jabes-Gilead[a]: ‘Bukas, kapag mainit na ang araw[b], darating sa inyo ang pagliligtas.’” Kaya pumunta ang mga mensahero at ibinalita iyon sa mga taga-Jabes, at nagalak sila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa lalaki ng Jabes-Gilead”; malamang na kolektibo ang isahang anyo at tumutukoy sa mga naninirahan sa lungsod.
    reason: lexical_alternative
  - marker: b
    text: O “sa init ng araw,” malamang na tumutukoy sa oras na mainit na ang araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: mga mensahero
  rationale: Sa konteksto, mga taong naghahatid sila ng balita, hindi mga anghel.
- source_word: הַבָּאִים
  choice: dumating
  rationale: Ang participle ay tumutukoy sa mga mensaherong dumating at naroon na sa harap ng kausap; natural itong ipinahahayag sa Tagalog bilang “dumating.”
- source_word: כֹּה תֹאמְרוּן
  choice: Ito ang sabihin ninyo
  rationale: Natural at malinaw na Tagalog para sa pormulang Hebreo na nagpapakilala ng tuwirang mensahe.
- source_word: לְאִישׁ יָבֵישׁ גִּלְעָד
  choice: sa mga taga-Jabes-Gilead
  rationale: Bagaman isahan ang אִישׁ, kolektibo ang gamit nito para sa mga mamamayan ng lungsod. Ang “mga taga-” ay natural at hindi mapanlinlang sa Tagalog.
- source_word: תִּהְיֶה לָכֶם תְּשׁוּעָה
  choice: darating sa inyo ang pagliligtas
  rationale: Pinananatili nito ang pangngalang “pagliligtas” at ang kawalan ng tahasang binanggit na tagapagligtas, habang malinaw na tumutukoy sa pagsagip mula sa banta ng kaaway.
- source_word: בְּחֹם הַשָּׁמֶשׁ
  choice: kapag mainit na ang araw
  rationale: Natural na panandang-panahon sa Tagalog na pinananatili ang larawan ng init ng araw nang hindi ipinapalagay ang eksaktong oras gaya ng tanghali.
- source_word: וַיַּגִּידוּ
  choice: ibinalita iyon
  rationale: Ang pandiwa ay nagsasaad ng pagpapabatid ng mensahe; malinaw sa Tagalog ang “ibinalita iyon” sa kontekstong ito.
- source_word: לְאַנְשֵׁי יָבֵישׁ
  choice: sa mga taga-Jabes
  rationale: Natural na salin ng pariralang tumutukoy sa mga mamamayan o naninirahan sa Jabes.
- source_word: וַיִּשְׂמָחוּ
  choice: nagalak sila
  rationale: Pinananatili ng “nagalak” ang lakas at marangal na himig ng salaysay.
theological_decisions:
- issue: Hindi tahasang pinangalanan ang tagapagligtas sa sugnay na תִּהְיֶה לָכֶם תְּשׁוּעָה.
  choice: darating sa inyo ang pagliligtas
  alternative: ililigtas kayo ng Diyos
  rationale: Hindi idinaragdag sa salin ang isang tahasang tagaganap na wala sa mismong sugnay, kaya napapanatili ang anyo at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga taga-” para sa kolektibong mga mamamayan at “pagliligtas” para sa kongkretong pagsagip sa konteksto ng digmaan, nang hindi nagdaragdag ng hindi tahasang tagaganap.
