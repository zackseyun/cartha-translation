base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/006.yaml
  text: And the Spirit of God rushed upon Saul when he heard these words[b][a], and his anger burned greatly.
translation:
  language: tl
  text: At nang marinig ni Saul ang mga salitang ito, makapangyarihang sumapit kay Saul ang Espiritu ng Diyos[a], at nag-alab nang matindi ang kanyang galit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “makapangyarihang dumating kay Saul.” Ipinahihiwatig ng pandiwang Hebreo ang biglaan at malakas na pagdating o pagkilos ng Espiritu sa isang tao.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nag-alab nang matindi ang kanyang ilong,” isang idyomang Hebreo para sa matinding galit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח
  choice: makapangyarihang bumuhos
  rationale: Sa mga salaysay tungkol sa Espiritu at isang tao, ang צלח ay nagpapahiwatig ng biglaan at makapangyarihang pagdating o pagkilos. Likas sa modernong Filipino ang “makapangyarihang bumuhos” at napananatili nito ang lakas ng pandiwa.
- source_word: רוּחַ אֱלֹהִים
  choice: ang Espiritu ng Diyos
  rationale: Tuwirang isinasalin ang pariralang konstrukto bilang banal na Espiritu ng Diyos at pinananatili ang bigat nito sa salaysay nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: עַל שָׁאוּל
  choice: sa kanya
  rationale: Ang עַל ay bahagi ng Hebreong paglalarawan sa pagdating ng Espiritu sa isang tao. Ginamit ang “sa kanya” kasunod ng pandiwang “bumuhos” upang maging natural sa Filipino at maiwasan ang di-kinakailangang pag-uulit sa pangalan ni Saul.
- source_word: בְּשָׁמְעוֹ
  choice: nang marinig ni Saul
  rationale: Ang ב na may infinitive construct at hulaping panghalip ay temporal. Malinaw at natural na ipinahahayag ng “nang marinig” ang kaugnayan ng pangyayari.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ang mga salitang iyon
  rationale: Bagaman maaaring tumukoy ang דְּבָרִים sa mga bagay o pangyayari, ang konteksto ay isang iniulat na pahayag; kaya ang “mga salitang iyon” ang pinakamalapit at malinaw na salin.
- source_word: וַיִּחַר אַפּוֹ
  choice: nag-alab ... ang kanyang galit
  rationale: Pinananatili ng “nag-alab ang kanyang galit” ang metapora ng Hebreong idyoma habang likas at madaling maunawaan sa Filipino.
- source_word: מְאֹד
  choice: nang matindi
  rationale: Malakas nitong pinatitingkad ang galit ni Saul. Ang “nang matindi” ay natural na kaakibat ng “nag-alab” sa modernong Filipino.
theological_decisions:
- issue: Ang kalikasan ng רוּחַ אֱלֹהִים sa salaysay
  choice: Ang Espiritu ng Diyos na makapangyarihang kumilos kay Saul
  alternative: isang espiritung mula sa Diyos
  rationale: Sa konteksto ng pagkakaloob ng lakas sa pinuno at ng kasunod na pagkilos para sa pagliligtas, natural na tumutukoy ang parirala sa sariling Espiritu ng Diyos. Hindi na tinukoy pa ng salin ang paraan o saklaw ng pagkilos upang hindi lumampas sa sinasabi ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Inuna ang temporal na sugnay upang maging natural ang daloy. Pinanatili ang metapora ng nag-aalab na galit, samantalang ipinaliwanag sa talababa ang literal na Hebreong idyoma. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
