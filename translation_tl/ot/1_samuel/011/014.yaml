id: 1SA.11.14
reference: 1 Samuel 11:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל הָ/עָ֔ם לְכ֖וּ וְ/נֵלְכָ֣ה הַ/גִּלְגָּ֑ל וּ/נְחַדֵּ֥שׁ שָׁ֖ם הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/014.yaml
  text: Then Samuel said to the people[a], “Come, let us go to Gilgal, and there renew the kingship.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Samuel sa mga tao, “Halikayo, pumunta tayo sa Gilgal, at doon ay panibaguhin natin ang paghahari.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patibayin natin ang paghahari” o “panibaguhin natin ang kaharian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Filipino ang “Pagkatapos, sinabi” upang ipakita ang pagkakasunod-sunod.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Karaniwang anyo ng pangalang Hebreo sa Filipino.
- source_word: אֶל הָעָם
  choice: sa mga tao
  rationale: Ang עָם ay tumutukoy rito sa nagkatipong sambayanan ng Israel; “mga tao” ang payak at natural na katumbas.
- source_word: לְכוּ וְנֵלְכָה
  choice: Halikayo, pumunta tayo
  rationale: Pinagsasama nito ang paanyayang pautos at ang cohortative na nagpapahayag ng sama-samang pagkilos, nang hindi nagiging asiwa ang literal na “Humayo kayo at humayo tayo.”
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Karaniwang transliterasyon ng pangalan ng lugar; hindi inililipat sa Filipino ang pantukoy na Hebreo.
- source_word: וּנְחַדֵּשׁ
  choice: panibaguhin natin
  rationale: Ang piel ng חדש ay nangangahulugang gawing bago muli o panibaguhin; pinananatili nito ang ideya ng muling pagpapatibay nang hindi labis na tinutukoy ang ritwal.
- source_word: שָׁם
  choice: doon
  rationale: Tuwirang tumutukoy sa Gilgal bilang lugar ng gagawing pagkilos.
- source_word: הַמְּלוּכָה
  choice: ang paghahari
  rationale: Mas malinaw na tumutukoy sa katayuan at pamumuno ng hari kaysa sa nasasakupang lupain na maaaring ipahiwatig ng “kaharian.”
theological_decisions:
- issue: Kahulugan ng pagpapanibago sa הַמְּלוּכָה
  choice: “panibaguhin natin ang paghahari,” na nagpapahiwatig ng muling pagpapatibay sa paghahari ni Saul
  alternative: “patibayin natin ang paghahari” o “panibaguhin natin ang kaharian”
  rationale: Kasunod ito ng pagliligtas ni Saul sa Jabes-Gilead at ng panibagong pagkilala sa kanya ng bayan. Pinananatili ng salin ang lawak ng Hebreo at hindi ipinapalagay ang isang tiyak na seremonya ng koronasyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Halikayo” bilang natural na sama-samang paanyaya at “paghahari” upang ituon ang diwa sa royal rule o kingship, hindi lamang sa teritoryo. Inilagay ang talababa pagkatapos ng pangungusap sapagkat nililinaw nito ang pariralang “panibaguhin natin ang paghahari.”
