  source_fidelity: Tapat ang salin sa Hebreo. Ang “Halikayo, pumunta tayo” ay angkop na idiomatikong paglalapat ng pangmaramihang paanyayang לְכוּ at ng cohortative na וְנֵלְכָה. Wasto ang “doon” para sa שָׁם at “paghahari” para sa הַמְּלוּכָה, na tumutukoy sa kingship/royal rule kaysa pangunahing sa teritoryo ng isang kaharian.
