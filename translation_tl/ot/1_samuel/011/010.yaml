translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang idyomang “mabuti sa inyong paningin” at ang hindi tahasang pagbanggit ng pagsuko. Inilagay ang talababa sa “Jabes” bilang pahiwatig sa mahalagang leksikal na linaw ng kasunod na pahayag.
