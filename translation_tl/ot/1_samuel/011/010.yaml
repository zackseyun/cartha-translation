  text: So the men of Jabesh said[a], “Tomorrow we will come out to you, and you may do to us whatever seems good in your eyes.”
translation:
  language: tl
  text: Kaya sinabi ng mga lalaki ng Jabes, “Bukas ay lalabas kami patungo sa inyo[a], at maaari ninyong gawin sa amin ang anuman ang mabuti sa inyong paningin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lalabas kami patungo sa inyo.” Hindi tahasang sinasabi sa Hebreo na “susuko kami,” bagaman ipinahihiwatig ng konteksto ang pagpapasakop.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Kaya sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay at ipinahihiwatig dito ang bunga ng naunang pangyayari; natural sa Tagalog ang “Kaya sinabi.”
- source_word: אַנְשֵׁי יָבֵישׁ
  choice: mga lalaki ng Jabes
  rationale: Tiyak na “mga lalaki” ang אַנְשֵׁי, at “Jabes” lamang ang nakasulat sa talatang ito, hindi ang mas buong pangalang Jabes-Gilead.
- source_word: מָחָר
  choice: Bukas
  rationale: Tuwirang katumbas ng pang-abay na tumutukoy sa kasunod na araw.
- source_word: נֵצֵא אֲלֵיכֶם
  choice: lalabas kami patungo sa inyo
  rationale: Ang יצא ay literal na “lumabas.” Pinananatili ng salin ang kilos at hindi tahasang isinasalin na “susuko,” sapagkat pahiwatig lamang iyon ng konteksto.
- source_word: וַעֲשִׂיתֶם לָּנוּ
  choice: at maaari ninyong gawin sa amin
  rationale: Ipinahihiwatig ng anyo sa konteksto ang pagpapahintulot sa gagawin ng mga kinakausap, nang hindi ito pinatitindi bilang tahasang utos.
- source_word: כְּכָל הַטּוֹב בְּעֵינֵיכֶם
  choice: ang anumang mabuti sa inyong paningin
  rationale: Pinananatili ang Hebreong idyoma tungkol sa anumang inaakala nilang mabuti o tama, sa halip na gawing mas malayang “anumang gusto ninyo.”
