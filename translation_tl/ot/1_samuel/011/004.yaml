base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/004.yaml
  text: When the messengers came to Gibeah of Saul and spoke these words in the hearing of the people[a], all the people lifted up their voices and wept.
translation:
  language: tl
  text: Nang dumating ang mga mensahero sa Gibea ni Saul, sinabi nila ang mga salitang iyon sa pandinig ng bayan. Nagtaas ng tinig[a] ang buong bayan at umiyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsimulang umiyak nang malakas.” Sa literal, “itinaas nila ang kanilang mga tinig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: mga mensahero
  rationale: Tumutukoy ito sa mga taong isinugo mula sa Jabes, hindi sa mga anghel; ang “mga mensahero” ang malinaw at likas na katumbas sa konteksto.
- source_word: גִּבְעַת שָׁאוּל
  choice: Gibea ni Saul
  rationale: Pinananatili nito ang ugnayan ng bayan kay Saul na ipinahahayag ng pariralang Hebreo, sa likas na anyong Tagalog.
- source_word: וַיְדַבְּרוּ הַדְּבָרִים
  choice: sinabi nila ang mga salitang iyon
  rationale: Pinananatili ang kongkretong “mga salita” ng Hebreo; ang “iyon” ay likas na tumutukoy sa naunang mensahe.
- source_word: בְּאָזְנֵי הָעָם
  choice: sa pandinig ng mga tao
  rationale: Isinasalin ang idyomang “sa mga tainga ng bayan” bilang hayagang pagsasalita na naririnig ng mga tao, nang hindi ito ginagawang labis na literal.
- source_word: כָל הָעָם
  choice: ang buong bayan
  rationale: Ang “bayan” ay natural na kolektibong tawag sa lahat ng taong naroon at pinananatili ang saklaw ng כָל.
- source_word: וַיִּשְׂאוּ ... אֶת קוֹלָם
  choice: nagtaas ng tinig
  rationale: Malapit itong sumusunod sa Hebreong idyoma at pinananatili ang kolektibong anyong isahan ng “tinig,” habang ipinapaliwanag sa talababa ang diwa nito.
- source_word: וַיִּבְכּוּ
  choice: at umiyak
  rationale: Tuwirang ipinahahayag nito ang pag-iyak dahil sa matinding dalamhati at pinananatili itong hiwalay na kilos kasunod ng pagtataas ng tinig.
