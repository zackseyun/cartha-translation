base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/001.yaml
  text: Then Nahash the Ammonite went up and encamped against Jabesh-gilead. And all the men of Jabesh said to Nahash[a], “Make a covenant with us, and we will serve you.”
translation:
  language: tl
  text: Pagkatapos, umahon si Nahas na Ammonita at nagkampo laban sa Jabes-Gilead. Sinabi ng lahat ng lalaki sa Jabes kay Nahas, “Makipagtipan ka sa amin[a], at maglilingkod kami sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “Pumutol ka ng tipan sa amin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: umahon
  rationale: Pinananatili ang karaniwang diwa ng עלה na pag-ahon o paglusob paitaas sa salaysay, nang hindi dinaragdagan ng mas tiyak na interpretasyong heograpikal.
- source_word: נָחָשׁ הָעַמּוֹנִי
  choice: Nahas na Ammonita
  rationale: Isinasatitik ang pangalang pantangi at likas na isinasalin ang katawagang tumutukoy sa kaniyang lahi.
- source_word: וַיִּחַן עַל
  choice: nagkampo laban sa
  rationale: Tuwirang inilalarawan ang pagtatayo ng kampo laban sa isang lugar sa kontekstong militar; hindi nito ipinapalagay ang mas matinding kahulugang 'kinubkob.'
- source_word: יָבֵשׁ גִּלְעָד
  choice: Jabes-Gilead
  rationale: Malinaw at maikling transliterasyon ng tambalang pangalan ng lugar sa anyong madaling makilala ng mambabasang Tagalog.
- source_word: כָּל אַנְשֵׁי יָבֵישׁ
  choice: lahat ng lalaki sa Jabes
  rationale: Pinananatili ang tahasang panlalaking anyo ng אַנְשֵׁי, na angkop din sa konteksto ng pampamahalaan at militar na pakikipagkasundo.
- source_word: כְּרָת לָנוּ בְרִית
  choice: Makipagtipan ka sa amin
  rationale: Natural na Tagalog para sa paggawa ng tipan sa isa't isa, habang pinananatili ang salitang 'tipan' para sa בְרִית; inilalagay sa talababa ang literal na idyomang Hebreo.
- source_word: וְנַעַבְדֶךָּ
  choice: at maglilingkod kami sa iyo
  rationale: Tuwirang katumbas ng pandiwang עבד na may personal na layon at hindi dinaragdagan ng diwang 'magiging mga alipin' o ng interpretasyong 'susuko.'
theological_decisions: []
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “nagkampo laban sa” sa halip na “kinubkob” upang hindi lumampas sa ipinahihiwatig ng Hebreo, at “makipagtipan” upang maging likas sa Tagalog habang napapanatili ang konsepto ng tipan.
