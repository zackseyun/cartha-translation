  text: וַ/יֹּ֣אמֶר שָׁא֔וּל לֹֽא יוּמַ֥ת אִ֖ישׁ בַּ/יּ֣וֹם הַ/זֶּ֑ה כִּ֥י הַ/יּ֛וֹם עָשָֽׂה יְהוָ֥ה תְּשׁוּעָ֖ה בְּ/יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/013.yaml
  text: But Saul said[a], “Not a man shall be put to death on this day, for today Yahweh has brought salvation in Israel.”
translation:
  language: tl
  text: Ngunit sinabi ni Saul, “Walang sinumang papatayin sa araw na ito, sapagkat ngayon ay isinagawa ni Yahweh ang pagliligtas[a] sa Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ginawa ni Yahweh ang pagliligtas” o “nagkaloob si Yahweh ng tagumpay sa Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi ni Saul
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit ang “Ngunit” ay angkop sa pagsalungat ni Saul sa mungkahi ng mga tao sa naunang talata.
- source_word: לֹא יוּמַת אִישׁ
  choice: Walang sinumang papatayin
  rationale: Ang יוּמַת ay pasibo at may legal na diwang “papatayin,” hindi lamang “mamamatay.” Ang אִישׁ ay pangkalahatan at distributibo, kaya likas sa modernong Tagalog ang “walang sinuman.”
- source_word: בַּיּוֹם הַזֶּה
  choice: sa araw na ito
  rationale: Pinananatili nito ang buong temporal na parirala at ibinubukod ito sa kasunod na הַיּוֹם, na isinaling “ngayon.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ni Saul sa hindi pagpatay sa sinuman; dignified at malinaw ang “sapagkat.”
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Natural na katumbas sa Tagalog at bahagyang naiiba sa naunang “sa araw na ito” nang hindi binabago ang kahulugan.
- source_word: עָשָׂה יְהוָה תְּשׁוּעָה
  choice: naghatid si Yahweh ng pagliligtas
  rationale: Ipinahahayag ng idyoma ang pagsasakatuparan ng pagliligtas. Pinananatili ng “naghatid … ng pagliligtas” ang pagkilos ng Diyos at ang mas malawak na saklaw ng תְּשׁוּעָה, habang ang “tagumpay” ay posible sa kontekstong militar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Ang “sa Israel” ay natural at pinananatili ang lawak ng pang-ukol ב, na maaaring tumukoy sa lugar o sa bayang nakinabang sa pagliligtas.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na isang pamagat.
- issue: Kahulugan ng תְּשׁוּעָה sa konteksto ng pagliligtas na militar
  choice: pagliligtas
  alternative: katubusan o tagumpay
  rationale: Ang “tagumpay” ay akma sa agarang kontekstong militar, ngunit mas napapanatili ng “pagliligtas” ang lawak ng salitang Hebreo at ang diin sa pagkilos ni Yahweh.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang legal na diwa ng utos, ang pag-uulit ng dalawang temporal na pahayag, at ang posibleng lawak ng “sa Israel.”
