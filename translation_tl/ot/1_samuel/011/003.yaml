  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו זִקְנֵ֣י יָבֵ֗ישׁ הֶ֤רֶף לָ֨/נוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/נִשְׁלְחָה֙ מַלְאָכִ֔ים בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/אִם אֵ֥ין מוֹשִׁ֛יעַ אֹתָ֖/נוּ וְ/יָצָ֥אנוּ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/003.yaml
  text: The elders of Jabesh said to him, “Leave us alone for seven days, and we will send messengers throughout all the territory of Israel. Then, if there is no one to save us, we will come out to you.”
translation:
  language: tl
  text: Sinabi sa kanya ng mga nakatatanda ng Jabes, “Hayaan mo muna kami sa loob ng pitong araw, at magsusugo kami ng mga mensahero sa buong nasasakupan ng Israel. Kung walang magliligtas sa amin, lalabas kami patungo sa iyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זִקְנֵי יָבֵישׁ
  choice: matatandang pinuno ng Jabes
  rationale: Ang זקנים ay tumutukoy sa mga nakatatandang may tungkuling mamuno sa pamayanan; nilinaw ng “pinuno” ang gamit nito rito nang hindi nawawala ang literal na diwa.
- source_word: הֶרֶף לָנוּ שִׁבְעַת יָמִים
  choice: Bigyan mo kami ng pitong araw
  rationale: Sa konteksto, ang idiomang הֶרֶף לָנוּ ay kahilingang pagbigyan o huwag muna silang galawin sa loob ng takdang panahon; natural itong ipinahayag sa Tagalog.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Dito ang salita ay tumutukoy sa mga taong ipinadadala upang humingi ng tulong, hindi sa mga anghel.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: sa buong nasasakupan ng Israel
  rationale: Ang גְּבוּל ay maaaring tumukoy sa hangganan o teritoryo; ang “nasasakupan” ay likas sa Tagalog at angkop sa paglalakbay ng mga mensahero sa buong lupain.
- source_word: מוֹשִׁיעַ
  choice: magliligtas
  rationale: Pinananatili ang pangkalahatang diwa ng isang taong sasagip sa kanila, nang hindi nagdaragdag ng tiyak na teolohikal na titulo.
- source_word: וְיָצָאנוּ אֵלֶיךָ
  choice: lalabas kami at susuko sa iyo
  rationale: Literal na “lalabas kami sa iyo,” ngunit sa konteksto ng pagkubkob ay nangangahulugang lalabas sila upang magpasakop; isinama ang “susuko” upang maging malinaw sa modernong mambabasa.
theological_decisions:
- issue: Kahulugan ng מוֹשִׁיעַ sa konteksto
  choice: walang magliligtas sa amin
  alternative: walang tagapagligtas sa amin
  rationale: Ginamit ang pandiwa upang hindi magmukhang pormal na titulo o tiyak na pagtukoy sa Diyos; ang talata ay nagsasalita muna tungkol sa sinumang maaaring sumagip sa Jabes.
- issue: Pahiwatig ng וְיָצָאנוּ אֵלֶיךָ
  choice: lalabas kami at susuko sa iyo
  alternative: lalabas kami patungo sa iyo
  rationale: Ang konteksto ay nagpapahiwatig ng pagsuko kay Nahas kapag walang dumating na saklolo. Nilinaw ito nang hindi dinaragdagan ang mga kondisyong wala sa teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “matatandang pinuno” upang maging malinaw ang pampamayanang tungkulin ng mga elder, at “Jabes” bilang karaniwang anyong Tagalog ng pangalan. Walang footnote na kailangan.
