  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּ֨שֶׂם שָׁא֣וּל אֶת הָ/עָם֮ שְׁלֹשָׁ֣ה רָאשִׁים֒ וַ/יָּבֹ֤אוּ בְ/תוֹךְ הַֽ/מַּחֲנֶה֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּכּ֥וּ אֶת עַמּ֖וֹן עַד חֹ֣ם הַ/יּ֑וֹם וַ/יְהִ֤י הַ/נִּשְׁאָרִים֙ וַ/יָּפֻ֔צוּ וְ/לֹ֥א נִשְׁאֲרוּ בָ֖/ם שְׁנַ֥יִם יָֽחַד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/011.yaml
  text: And it happened on the next day that Saul set the people in three groups[a], and they came into the midst of the camp during the morning watch and struck Ammon until the heat of the day. And it happened that the survivors were scattered[c][b], so that no two of them were left together.
translation:
  language: tl
  text: Nang sumunod na araw, hinati ni Saul ang mga tauhan sa tatlong pangkat.[a] Pumasok sila sa gitna ng kampo sa oras ng pagbabantay sa madaling-araw[b] at tinalo ang mga Ammonita hanggang sa uminit ang araw.[c] Nagkawatak-watak ang mga nakaligtas, kaya wala ni dalawa sa kanila ang naiwang magkasama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tatlong ulo,” isang idyoma para sa tatlong dibisyon o pangkat.
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa yugto ng pagbabantay sa kampo bago o malapit sa bukang-liwayway.
    reason: cultural_note
  - marker: c
    text: O “hanggang sa kainitan ng araw,” malamang na patungong tanghali.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: nang sumunod na araw
  rationale: Likas na modernong Tagalog para sa araw na kasunod ng mga naunang pangyayari, at malinaw na ipinagpapatuloy ang salaysay.
- source_word: וַיָּשֶׂם ... שְׁלֹשָׁה רָאשִׁים
  choice: hinati ni Saul ang mga tauhan sa tatlong pangkat
  rationale: Ang literal na “tatlong ulo” ay idyomang militar para sa tatlong dibisyon o pangkat; malinaw itong naipahahayag ng “tatlong pangkat.”
- source_word: בְתוֹךְ הַמַּחֲנֶה
  choice: pumasok sila sa gitna ng kampo
  rationale: Ipinakikita ng parirala ang pagpasok sa loob ng kampo, hindi lamang ang paglapit dito.
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: sa oras ng pagbabantay sa madaling-araw
  rationale: Tumutukoy ito sa takdang yugto ng pagbabantay sa kampo bago o malapit sa bukang-liwayway; pinananatili ang larawang militar sa paraang mauunawaan ngayon.
- source_word: וַיַּכּוּ אֶת עַמּוֹן
  choice: tinalo ang mga Ammonita
  rationale: Ang “Ammon” ay kolektibong tumutukoy sa hukbo o mga taga-Ammon. Ang “tinalo” ay natural sa Tagalog at ipinahahayag ang mapaminsalang pagsalakay nang hindi nagpapahiwatig na walang nakaligtas.
- source_word: עַד חֹם הַיּוֹם
  choice: hanggang sa uminit ang araw
  rationale: Pinananatili nito ang konkretong larawan ng Hebreo sa halip na gawing tiyak na “tanghali,” bagaman malamang na huling bahagi ng umaga ang tinutukoy.
- source_word: הַנִּשְׁאָרִים
  choice: ang mga nakaligtas
  rationale: Sa konteksto ng labanan, malinaw na tumutukoy ito sa mga nabuhay o natira matapos ang pagkatalo.
- source_word: וַיָּפֻצוּ
  choice: nagkawatak-watak
  rationale: Likas na Tagalog para sa ganap na pagkakahiwa-hiwalay ng isang natalong hukbo, habang hindi tinutukoy kung sila ay kusang tumakas o ikinalat ng mga sumalakay.
- source_word: וְלֹא נִשְׁאֲרוּ בָם שְׁנַיִם יָחַד
  choice: wala ni dalawa sa kanila ang naiwang magkasama
  rationale: Pinananatili ang matingkad na idiomatikong larawan ng lubos na pagkakawatak-watak.
- source_word: וַיְהִי ... וַיְהִי
  choice: Nang ... Nagkawatak-watak
  rationale: Isinama sa natural na daloy ng salaysay sa Tagalog ang paulit-ulit na pormulang Hebreo, sa halip na ulitin ang mabigat na “at nangyari.”
