  text: Then the people said to Samuel[a], “Who is it that said, ‘Shall Saul reign over us?’ Hand over the men, and we will put them to death.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng mga tao kay Samuel, “Sino ang nagsabing, ‘Maghahari ba sa amin si Saul?’[a] Ibigay ninyo sa amin ang mga lalaking iyon, at papatayin namin sila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Maghahari sa amin si Saul.” Ang di-ganap na anyong Hebreo ay maaaring basahin bilang tanong na tumutukoy sa hinaharap o, bagaman hindi gaanong malamang dito, bilang pahayag.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay; natural sa modernong Tagalog ang “Pagkatapos” sa ganitong daloy.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Karaniwang kolektibong katawagan sa mga Israelitang naroon.
- source_word: אֶל שְׁמוּאֵל
  choice: kay Samuel
  rationale: Ipinahihiwatig ng אֶל ang pinatutungkulan ng pagsasalita; ginamit ang kinagawiang anyong Tagalog ng pangalan.
- source_word: מִי הָאֹמֵר
  choice: Sino ang nagsabi
  rationale: Ang pantukoy at participle ay tumutukoy sa taong nagsalita; ang payak na tanong ay natural sa Tagalog at akma sa paghingi ng pagkakakilanlan.
- source_word: שָׁאוּל יִמְלֹךְ עָלֵינוּ
  choice: Maghahari ba sa amin si Saul?
  rationale: Pinananatili ng “maghahari” ang maharlikang diwa ng מלך. Ang tanong ang pinakamalamang ayon sa konteksto, bagaman maaaring unawain ang imperfect bilang pahayag.
- source_word: תְּנוּ הָאֲנָשִׁים
  choice: Ibigay ninyo sa amin ang mga lalaking iyon
  rationale: Ang pautos ay humihiling na iharap o ibigay ang mga tumutol. Idinagdag ang “sa amin” bilang likas na ipinahihiwatig na tumatanggap sa Tagalog, at ang “iyon” ay nililinaw na sila ang mga nabanggit na tumutol.
- source_word: וּנְמִיתֵם
  choice: at papatayin namin sila
  rationale: Tuwirang ipinapahayag ng Hiphil ng מות ang pagpapapatay o paglalagay sa kamatayan; natural at malinaw sa karaniwang Tagalog ang “papatayin.”
