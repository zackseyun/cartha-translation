  yaml_path: translation/ot/1_samuel/011/008.yaml
  text: He mustered them at Bezek[a], and the sons of Israel were three hundred thousand, and the men of Judah thirty thousand.
translation:
  language: tl
  text: Tinipon niya sila sa Bezek, at ang mga anak ng Israel[a] ay tatlong daang libo, at ang mga lalaki ng Juda ay tatlumpung libo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga Israelita.” Sa Hebreo, “ang mga anak ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקְדֵם
  choice: Tinipon niya sila … at binilang
  rationale: Sa kontekstong militar, ang פקד ay tumutukoy sa pagtitipon at pagtatala o pagbilang sa mga kawal. Pinagsama ang dalawang likas na pandiwang Tagalog upang maipahayag ang diwa ng military muster, hindi lamang isang abstraktong pagbilang.
- source_word: בְּבָזֶק
  choice: sa Bezek
  rationale: Ang Bezek ay pangalan ng lugar, at likas sa Tagalog ang pang-ukol na “sa” para sa pook na pinagtipunan.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ng Israel
  rationale: Pinananatili ang literal na larawang pampamilya ng Hebreo at ang pagkakaiba nito sa sumunod na pangkat mula sa Juda. Nililinaw sa talababa ang likas na alternatibong “mga Israelita.”
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: tatlong daang libo
  rationale: Tuwirang salin ng bilang na 300,000.
- source_word: וְאִישׁ יְהוּדָה
  choice: ang mga lalaki ng Juda
  rationale: Bagaman isahan ang anyong אִישׁ, kolektibo ang gamit nito rito at tumutukoy sa mga lalaking kabilang sa Juda.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: tatlumpung libo
  rationale: Tuwirang salin ng bilang na 30,000.
theological_decisions:
- issue: Pagpapahayag sa pantribo at kolektibong katawagang בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ng Israel
  alternative: ang mga Israelita
  rationale: Walang natatanging doktrinang ipinapasok. Pinananatili ng pangunahing teksto ang panlalaking katawagang pampamilya sa Hebreo at ang pampanitikang pagkakaiba ng Israel at Juda, habang ibinibigay sa talababa ang mas karaniwang katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tinipon … at binilang” upang madaling maunawaan ng karaniwang mambabasa ang military muster nang hindi gumagamit ng teknikal o lipas na salita.
