id: 1SA.11.15
reference: 1 Samuel 11:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּלְכ֨וּ כָל הָ/עָ֜ם הַ/גִּלְגָּ֗ל וַ/יַּמְלִכוּ֩ שָׁ֨ם אֶת שָׁא֜וּל לִ/פְנֵ֤י יְהוָה֙ בַּ/גִּלְגָּ֔ל וַ/יִּזְבְּחוּ שָׁ֛ם זְבָחִ֥ים שְׁלָמִ֖ים לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּשְׂמַ֨ח שָׁ֥ם שָׁא֛וּל וְ/כָל אַנְשֵׁ֥י יִשְׂרָאֵ֖ל עַד מְאֹֽד־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/015.yaml
  text: So all the people went to Gilgal[a], and there they made Saul king before Yahweh at Gilgal. There they sacrificed peace offerings before Yahweh, and there Saul and all the men of Israel rejoiced greatly.
translation:
  language: tl
  text: Kaya pumunta ang buong bayan sa Gilgal, at doon, sa harap ni Yahweh sa Gilgal, ginawa nilang hari si Saul. Doon ay naghandog sila ng mga handog pangkapayapaan[a] sa harap ni Yahweh. At doon ay labis na nagalak si Saul at ang lahat ng kalalakihan ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog ng pakikisalo” o “mga handog para sa kagalingan at kabuuan.” Ang terminong Hebreo ay tumutukoy sa isang uri ng sama-samang paghahandog na kaugnay ng kapayapaan, kabuuan, at pinagsasaluhang pagdiriwang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: pumunta
  rationale: Karaniwang pandiwa ito ng paggalaw sa sunod-sunod na salaysay; natural sa makabagong Tagalog ang “pumunta” sa kontekstong ito.
- source_word: כָל הָעָם
  choice: ang buong bayan
  rationale: Tumutukoy ang עָם sa sama-samang mamamayan, hindi lamang sa mga kawal. Ang “buong bayan” ay natural na kolektibong pananalita sa Tagalog.
- source_word: הַגִּלְגָּל / בַּגִּלְגָּל
  choice: Gilgal / sa Gilgal
  rationale: Pangalan ito ng lugar at pinanatili sa transliterasyon.
- source_word: וַיַּמְלִכוּ ... אֶת שָׁאוּל
  choice: ginawa nilang hari si Saul
  rationale: Ang Hiphil ng מלך ay nangangahulugang maging sanhi upang maghari o gawing hari. Hindi ginamit ang “pinahiran” sapagkat walang gayong pandiwa sa talata.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang diwa ng pagkilos sa presensiya ng Diyos sa isang hayag at panrelihiyong pagtitipon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וַיִּזְבְּחוּ
  choice: naghandog sila
  rationale: Sa kontekstong pansakripisyo, malinaw at natural sa Tagalog ang “naghandog,” lalo na dahil kasunod na tinutukoy ang uri ng handog.
- source_word: זְבָחִים שְׁלָמִים
  choice: mga handog pangkapayapaan
  rationale: Maikli at pamilyar itong salin para sa kategorya ng handog na kaugnay ng kapayapaan, kabuuan, pakikisalo, at pagdiriwang; inilagay sa talababa ang iba pang posibleng pagpapahayag.
- source_word: וַיִּשְׂמַח
  choice: nagpakagalak
  rationale: Ang “nagpakagalak” ay nagpapahayag ng matinding kagalakang ipinahihiwatig ng pandiwa at ng kasunod na paningit na עַד מְאֹד.
- source_word: וְכָל אַנְשֵׁי יִשְׂרָאֵל
  choice: at ang lahat ng kalalakihan ng Israel
  rationale: Tahasang panlalaki ang אַנְשֵׁי (“mga lalaki ng”), kaya pinanatili ang anyong may kasarian sa halip na gawing neutral na kolektibo.
- source_word: עַד מְאֹד
  choice: labis
  rationale: Natural na paningit ito sa Tagalog na nagpapanatili sa matinding antas ng kanilang kagalakan.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinanatili ang personal na pangalang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Ang panlalaking pananalitang אַנְשֵׁי יִשְׂרָאֵל
  choice: ang lahat ng kalalakihan ng Israel
  alternative: ang lahat ng mga Israelita; ang buong bayan ng Israel
  rationale: Lexically masculine ang parirala. Pinanatili ito nang hindi ipinapalagay kung saklaw o hindi saklaw sa konteksto ang iba pang naroon.
- issue: Kahulugan ng זְבָחִים שְׁלָמִים
  choice: mga handog pangkapayapaan
  alternative: mga handog ng pakikisalo; mga handog para sa kagalingan at kabuuan
  rationale: May malawak na saklaw ang שְׁלָמִים na maaaring magpahiwatig ng kapayapaan, kabuuan, kagalingan, at sama-samang pakikisalo. Pinili ang maikli at kilalang katawagan ngunit pinanatili sa talababa ang saklaw ng termino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “Gilgal” at “doon” dahil kapansin-pansin ang mga ito sa Hebreong salaysay. Ginamit ang “buong bayan” para sa kolektibong כָל הָעָם, ngunit “lahat ng kalalakihan ng Israel” para sa tahasang panlalaking אַנְשֵׁי יִשְׂרָאֵל.
