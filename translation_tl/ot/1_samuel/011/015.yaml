  source_fidelity: 'Tapat ang salin sa daloy at mahahalagang elemento ng Hebreo: ang buong bayan ay nagtungo sa Gilgal, ginawa nilang hari si Saul sa harap ni Yahweh, naghandog ng mga handog pangkapayapaan, at labis na nagalak si Saul kasama ng lahat ng kalalakihan ng Israel. Napananatili rin ang makabuluhang pag-uulit ng “doon” at “Gilgal.”'
