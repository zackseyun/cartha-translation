  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם נָחָשׁ֙ הָ/עַמּוֹנִ֔י בְּ/זֹאת֙ אֶכְרֹ֣ת לָ/כֶ֔ם בִּ/נְק֥וֹר לָ/כֶ֖ם כָּל עֵ֣ין יָמִ֑ין וְ/שַׂמְתִּ֥י/הָ חֶרְפָּ֖ה עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/002.yaml
  text: 'Nahash the Ammonite said to them, “On this condition I will make a treaty with you: that every right eye of yours be gouged out, and I will make it a disgrace upon all Israel.”'
translation:
  language: tl
  text: 'Sinabi sa kanila ni Nahas na Ammonita, “Sa kondisyong ito ako makikipagtipan sa inyo: dudukitin ko ang kanang mata ng bawat isa sa inyo at sa gayon ay ilalagay ko sa kahihiyan ang buong Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶכְרֹת לָכֶם
  choice: makikipagtipan sa inyo
  rationale: Ang idiomang Hebreo na literal na ‘puputol para sa inyo’ ay tumutukoy sa paggawa ng isang tipan; natural at tumpak sa Filipino ang ‘makikipagtipan.’
- source_word: בִּנְקוֹר
  choice: dudukitin ko
  rationale: Ipinapahayag ng pandiwa ang marahas na pag-alis o pagbutas sa mata; malinaw at karaniwan sa modernong Filipino ang ‘dukutin.’
- source_word: כָּל עֵין יָמִין
  choice: ang kanang mata ng bawat isa sa inyo
  rationale: 'Pinananatili ang distributibong diwa ng Hebreo: ang kanang mata ng bawat taong kausap, hindi lamang isang kolektibong ‘lahat ng kanang mata.’'
- source_word: חֶרְפָּה
  choice: kahihiyan
  rationale: Saklaw nito ang pampublikong paghamak at disgrace na balak ipataw ni Nahas sa buong Israel.
theological_decisions: []
translation_notes:
  register: 'Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang dalawang magkakaugnay na kilos sa Hebreo: ang pagdukot sa mga mata at ang pagpapahiya sa buong Israel. Isinalin ang pangalan bilang ‘Nahas,’ ayon sa karaniwang baybay-Filipino, at ang gentiliko bilang ‘Ammonita.’'
