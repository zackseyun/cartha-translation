id: 1SA.2.10
reference: 1 Samuel 2:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יְהוָ֞ה יֵחַ֣תּוּ מריב/ו על/ו בַּ/שָּׁמַ֣יִם יַרְעֵ֔ם יְהוָ֖ה יָדִ֣ין אַפְסֵי אָ֑רֶץ וְ/יִתֶּן עֹ֣ז לְ/מַלְכּ֔/וֹ וְ/יָרֵ֖ם קֶ֥רֶן מְשִׁיחֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/010.yaml
  text: Yahweh’s adversaries will be shattered[a]; he will thunder against them from heaven. Yahweh will judge the ends of the earth[c][b]; he will give strength to his king and lift up the horn of his anointed.
translation:
  language: tl
  text: Ang mga lumalaban kay Yahweh ay madudurog[a]; kukulog siya laban sa kanila mula sa langit[b]. Hahatulan ni Yahweh ang mga dulo ng daigdig; bibigyan niya ng lakas ang kanyang hari at itataas ang sungay ng kanyang pinahiran[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga nakikipagtunggali sa kanya ay madudurog.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa langit”; ang “mula sa langit” ay nagpapahayag ng pinagmumulan ng pagkulog.
    reason: lexical_alternative
  - marker: c
    text: O “kanyang Mesiyas.” Ang Hebreong מְשִׁיחוֹ (meshikho) ay nangangahulugang “kanyang pinahiran” at maaaring tumukoy sa haring pinahiran ni Yahweh, na may mesiyanikong kabuluhan din.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos ayon sa tekstong Hebreo at sa pamantayan ng proyekto.
- source_word: יֵחַתּוּ
  choice: ay madudurog
  rationale: Ipinahahayag ng Niphal ng חתת ang marahas na pagkawasak o pagkatalo, hindi lamang pagkatakot.
- source_word: מריב/ו על/ו
  choice: ang mga lumalaban kay Yahweh
  rationale: Natural na Filipino ito para sa ketiv/qere na tumutukoy sa mga nakikipagtunggali laban sa kanya; ginawang tahasan ang tinutukoy ng panghalip upang maiwasan ang kalabuan sa Filipino.
- source_word: בַּשָּׁמַיִם
  choice: mula sa langit
  rationale: Bagaman literal na maaaring 'sa langit,' ipinakikita rito ng konteksto ang pinagmumulan ng pagkulog.
- source_word: יַרְעֵם
  choice: kukulog siya laban sa kanila
  rationale: Pinananatili ang konkretong larawan ng banal na pagkulog na nakatuon laban sa mga kaaway.
- source_word: יָדִין
  choice: hahatulan
  rationale: Ang pandiwa ay tumutukoy sa paglalapat ng pandaigdig na paghatol o pamamahalang panghukuman.
- source_word: אַפְסֵי אָרֶץ
  choice: ang mga dulo ng daigdig
  rationale: Pinananatili ang Hebreong idyoma para sa pinakamalalayong saklaw ng buong mundo.
- source_word: וְיִתֶּן עֹז
  choice: bibigyan niya ng lakas
  rationale: Direkta at natural na salin ng pagbibigay ng עֹז, lakas o kapangyarihan.
- source_word: לְמַלְכּוֹ
  choice: ang kanyang hari
  rationale: Pinananatili ang tahasang maharlikang katawagan kahit wala pang naitatatag na monarkiya sa puntong ito ng salaysay.
- source_word: וְיָרֵם קֶרֶן
  choice: itataas ang sungay
  rationale: Pinananatili ang mahalagang Hebreong metapora ng lakas, dangal, at tagumpay, na kaugnay rin ng simula ng awit ni Hana.
- source_word: מְשִׁיחוֹ
  choice: kanyang pinahiran
  rationale: Ang literal at angkop-sa-kontekstong kahulugan ay ang haring pinahiran ni Yahweh. Hindi nito isinasara ang mesiyanikong kabuluhan, ngunit iniiwasang gawing pantanging pangalan ang isang terminong nananatiling may agarang maharlikang sanggunian.
theological_decisions:
- issue: Ang agarang maharlikang at mas malawak na mesiyanikong kabuluhan ng מְשִׁיחוֹ
  choice: kanyang pinahiran
  alternative: kanyang Mesiyas
  rationale: Ang 'pinahiran' ay tuwirang kumakatawan sa kahulugan ng salitang Hebreo at natural na katambal ng 'kanyang hari.' Pinananatili nito ang posibleng mas malawak na mesiyanikong alingawngaw nang hindi ipinipilit na pantanging titulong 'Mesiyas' lamang ang kahulugan sa agarang konteksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pangalang Yahweh at ang matitingkad na larawang patula na “kumulog” at “itataas ang sungay.” Inayos ang mga talababa sa mismong pariralang tinutukoy ng bawat isa.
