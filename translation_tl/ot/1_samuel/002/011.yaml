  text: וַ/יֵּ֧לֶךְ אֶלְקָנָ֛ה הָ/רָמָ֖תָ/ה עַל בֵּית֑/וֹ וְ/הַ/נַּ֗עַר הָיָ֤ה מְשָׁרֵת֙ אֶת יְהוָ֔ה אֶת פְּנֵ֖י עֵלִ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/011.yaml
  text: Then Elkanah went to Ramah[a], to his house; and the boy was ministering to Yahweh before Eli the priest.
translation:
  language: tl
  text: Pagkatapos, pumunta si Elkana sa Rama, sa kanyang tahanan. Ang bata naman ay patuloy na naglilingkod kay Yahweh sa harapan ni Eli na pari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa mukha/presensiya ni Eli na pari”; maaari rin itong magpahiwatig na naglilingkod ang bata sa ilalim ng pangangasiwa ni Eli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pumunta
  rationale: Karaniwang isinusulong ng wayyiqtol ng הלך ang salaysay sa diwang “pumunta.” Bagaman maaaring ipahiwatig ng konteksto ang pag-uwi, hindi iyon tahasang nakapaloob sa pandiwa.
- source_word: הָרָמָתָה
  choice: sa Rama
  rationale: Ang directional he ay nagsasaad ng patutunguhan; likas sa Tagalog ang “pumunta ... sa Rama.”
- source_word: עַל בֵּיתוֹ
  choice: sa kanyang tahanan
  rationale: Sa idyomang ito, ang עַל ay tumutukoy sa patutunguhang bahay o tahanan, hindi sa literal na ibabaw ng bahay.
- source_word: וְהַנַּעַר
  choice: Ang bata naman
  rationale: Malawak ang saklaw ng נַעַר mula bata hanggang binata, ngunit sa yugtong ito ng salaysay ay inilalarawan si Samuel bilang batang naglilingkod sa santuwaryo. Ipinahihiwatig ng “naman” ang pagbabago ng paksa nang hindi nagdaragdag ng bagong kahulugan.
- source_word: הָיָה מְשָׁרֵת
  choice: ay patuloy na naglilingkod
  rationale: Ang היה na sinusundan ng participle ay nagpapahayag ng nagpapatuloy o namamalaging gawain; malinaw itong naihahatid ng “patuloy na naglilingkod.”
- source_word: אֶת יְהוָה
  choice: kay Yahweh
  rationale: Sa pandiwang שׁרת, ang banal na pangalan ang tumutukoy sa pinaglilingkuran. Pinananatili ang pangalang tipan na Yahweh.
- source_word: אֶת פְּנֵי עֵלִי הַכֹּהֵן
  choice: sa harapan ni Eli na pari
  rationale: Malapit itong sumusunod sa larawang “mukha/presensiya” ng Hebreo at hindi tahasang nagpapasya kung pisikal na presensiya lamang o pangangasiwa ang ibig sabihin.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa banal na pangalan sa halip na palitan ito ng titulo.
- issue: Ugnayan ng paglilingkod ng bata kay Eli
  choice: sa harapan ni Eli na pari
  alternative: sa ilalim ng pangangasiwa ni Eli na pari
  rationale: Ang Hebreo ay literal na tumutukoy sa mukha o presensiya ni Eli. Maaaring sangkot ang pangangasiwa, ngunit hindi ito dapat gawing tanging kahulugan sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tahanan” sa halip na mas kolokyal na “bahay” upang maging angkop sa salaysay, at pinanatili ang nagpapatuloy na aspekto ng paglilingkod.
