  to: At makikita mo ang kagipitan ng tahanan sa lahat ng kabutihang ginagawa niya para sa Israel;[a] at walang lalaking aabot sa katandaan sa sambahayan mo sa lahat ng araw.
  rationale: Inayos ang pangunahing mahirap na parirala upang huwag ipilit ang lokatibong relasyon na wala sa malinaw na anyo ng Hebreo. Ginawang mas tuwiran ang katumbas ng “sa lahat ng,” at nilinaw ang hatol tungkol sa kawalan ng lalaking aabot sa katandaan, nang hindi nagdaragdag ng doktrinal o historikal na pagpapakahulugan. Inayos din ang talababa upang mapanatili ang parehong kalabuan sa alternatibong pagbasa.
