base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/032.yaml
  text: You will look on the distress of the dwelling in all the good that he does for Israel[a], and there will not be an old man in your house all the days.
translation:
  language: tl
  text: At makikita mo ang kagipitan ng tahanan sa lahat ng kabutihang ginagawa niya para sa Israel;[a] at walang lalaking aabot sa katandaan sa sambahayan mo sa lahat ng araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin bilang “isang kaaway ng tahanan,” “kagipitan sa santuwaryo,” o katulad nito; mahirap bigyang-kahulugan ang pariralang Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִבַּטְתָּ
  choice: at makikita mo
  rationale: Ang Hiphil ng נבט ay nangangahulugang tumingin o makita. Natural sa modernong Tagalog ang “makikita mo” at hindi nito dinaragdagan ang teksto ng damdaming gaya ng inggit.
- source_word: צַר
  choice: kagipitan
  rationale: Maaaring tumukoy ang salita sa kaaway o sa kagipitan/pighati. Pinananatili ng “kagipitan” ang napiling di-personal na pagbasa nang hindi labis na nililinaw ang mahirap na parirala.
- source_word: מָעוֹן
  choice: tahanan
  rationale: Pangunahing kahulugan nito ang tirahan o tahanan. Hinahayaan ng “tahanan” na marinig ang posibleng pagtukoy sa santuwaryo nang hindi ito tahasang ipinapasok sa pangunahing teksto.
- source_word: בְּכֹל אֲשֶׁר יֵיטִיב אֶת־יִשְׂרָאֵל
  choice: sa gitna ng lahat ng kabutihang ginagawa niya para sa Israel
  rationale: Malapit ito sa sintaks ng Hebreo at pinananatiling di-tahas ang simuno ng pandiwa, bagaman ang Diyos ang pinakamalamang na tinutukoy sa konteksto.
- source_word: זָקֵן
  choice: lalaking tatanda
  rationale: Tumutukoy ito sa isang lalaking aabot sa katandaan, hindi sa katungkulan ng isang matanda. Mas natural sa Tagalog ang pandiwang pahayag kaysa “matandang lalaki” sa negatibong hulang ito.
- source_word: בְּבֵיתְךָ
  choice: sa sambahayan mo
  rationale: Dito ang “bahay” ay tumutukoy sa pamilya o angkan ni Eli. Malinaw na naihahayag ng “sambahayan” ang kolektibong kahulugan.
- source_word: כָּל הַיָּמִים
  choice: sa lahat ng panahon
  rationale: Pinananatili nito ang malawak at patuloy na temporal na puwersa ng literal na “lahat ng mga araw” sa natural na Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa mahirap na pariralang צַר מָעוֹן
  choice: kagipitan sa tahanan
  alternative: isang kaaway sa tahanan; kagipitan sa santuwaryo
  rationale: Tunay na mahirap at malabo ang pariralang Hebreo. Ang pangunahing salin ay nananatiling medyo pormal at hindi nagpapasya kung personal na kaaway o partikular na kapighatian sa santuwaryo ang tinutukoy; inilalahad sa talababa ang mahahalagang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sambahayan” para sa angkan ni Eli, samantalang pinanatili ang mas literal na “tahanan” sa malabong parirala. Inilagay ang talababa kaagad pagkatapos ng sugnay na saklaw nito.
