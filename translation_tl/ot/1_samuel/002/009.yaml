  text: רַגְלֵ֤י חסיד/ו יִשְׁמֹ֔ר וּ/רְשָׁעִ֖ים בַּ/חֹ֣שֶׁךְ יִדָּ֑מּוּ כִּֽי לֹ֥א בְ/כֹ֖חַ יִגְבַּר אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/009.yaml
  text: He guards the feet of his faithful ones[a], but the wicked are silenced in darkness[c][b], for not by strength does a man prevail.
translation:
  language: tl
  text: 'Iniingatan niya ang mga paa ng mga tapat sa kanya[a],

    ngunit ang masasama ay pinatatahimik sa kadiliman[b],

    sapagkat hindi sa lakas nananaig ang tao[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa tradisyong tekstuwal na Hebreo, maaari rin itong basahin sa isahan: “ang tapat sa kanya.” Pinili rito ang maramihang pagbasa dahil umaayon ito sa paralelismong makata at sa malamang na kolektibong diwa.'
    reason: textual_variant
  - marker: b
    text: Maaari ring isalin na “tumatahimik,” “napapatahimik,” o “napapahinto”; ang pandiwang Hebreo ay maaaring tumukoy sa pagiging tahimik o napahinto.
    reason: lexical_alternative
  - marker: c
    text: Panlalaking isahan ang salitang Hebreo, ngunit ginagamit dito sa pangkalahatang diwa para sa tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵי
  choice: ang mga paa ng
  rationale: Pinananatili ang kongkretong larawang Hebreo na “mga paa”; bagaman maaaring ipakahulugang “mga hakbang,” hindi kailangang alisin ang orihinal na talinghaga.
- source_word: חסיד/ו
  choice: mga tapat sa kanya
  rationale: Ipinapahayag nito ang katapatan at matibay na kaugnayan sa Diyos nang hindi nagdadala ng mas huling panrelihiyong pahiwatig ng “mga santo.” Sinusunod sa pangunahing teksto ang kolektibo o maramihang pagbasa.
- source_word: יִשְׁמֹר
  choice: Iniingatan niya
  rationale: Likas sa modernong Tagalog at malinaw na naghahayag ng pag-iingat at proteksiyon.
- source_word: וּרְשָׁעִים
  choice: ngunit ang masasama
  rationale: Ang “ngunit” ay nagpapakita ng malinaw na pagsalungat sa kapalaran ng mga tapat.
- source_word: בַּחֹשֶׁךְ
  choice: sa kadiliman
  rationale: Pinananatili ang ποιetikong larawan ng dilim bilang kalagayan ng paghatol at kawalan ng kakayahang kumilos.
- source_word: יִדָּמּוּ
  choice: ay pinatatahimik
  rationale: Sinasalamin ang pasibong anyo at ang diwa ng pagpapatahimik o pagpapatigil; inilalahad sa talababa ang leksikal na lawak.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan o batayan ng naunang paghahambing.
- source_word: לֹא בְכֹחַ
  choice: hindi sa lakas
  rationale: Direkta at likas na salin na nagpapanatili sa diin ng Hebreo na ang tagumpay ay hindi nagmumula sa sariling lakas.
- source_word: יִגְבַּר
  choice: nagtatagumpay
  rationale: Ipinahahayag ang pagiging makapangyarihan hanggang sa manaig, hindi lamang ang pagkakaroon ng lakas.
- source_word: אִישׁ
  choice: ang tao
  rationale: Ang panlalaking isahan sa Hebreo ay ginagamit dito sa pangkalahatan. Ang “ang tao” ay natural at kawikaang Filipino para sa sinumang tao, habang ipinapaliwanag sa talababa ang anyong Hebreo.
theological_decisions:
- issue: Bilang at diwa ng חסיד/ו
  choice: 'Kolektibo o maramihan: “mga tapat sa kanya”'
  alternative: 'Isahan: “ang tapat sa kanya”'
  rationale: Maaaring basahin ang tradisyong tekstuwal bilang isahan, ngunit ang maramihang diwa ay umaayon sa ποιetikong pagtutulad sa “masasama” at may suporta mula sa sinaunang tradisyon ng teksto. Hindi nito ginagawang pangako ng kaligtasan mula sa bawat pisikal na panganib ang taludtod; pinananatili lamang ang pangkalahatang pahayag ng awit tungkol sa pag-iingat ng Diyos.
- issue: Pangkalahatang gamit ng אִישׁ
  choice: “ang tao” bilang pangkalahatang kinatawan
  alternative: “ang isang lalaki” o “sinuman”
  rationale: Panlalaking isahan ang gramatikal na anyo, ngunit pangkalahatan at kawikaan ang gamit sa konteksto. Ang “ang tao” ang pinakanatural na Tagalog nang hindi nililimitahan ang pahayag sa kalalakihan lamang.
- issue: Saklaw ng יִדָּמּוּ
  choice: “pinatatahimik”
  alternative: “pinatitigil,” “natatahimik,” o “nililipol”
  rationale: Pinananatili ng salin ang pangunahing diwa ng pagiging tahimik o napahinto sa ilalim ng paghatol, nang hindi tiyak na ipinapakahulugan itong kamatayan o pagkalipol.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang tatlong linyang ποιetikong ayos, ang kongkretong larawan ng “mga paa,” at ang maikling kawikaang anyo ng huling sugnay. Iniwasan ang “mga banal” o “mga santo” upang hindi magpasok ng denominasyonal na kahulugan.
