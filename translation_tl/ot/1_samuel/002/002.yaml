id: 1SA.2.2
reference: 1 Samuel 2:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵין קָד֥וֹשׁ כַּ/יהוָ֖ה כִּ֣י אֵ֣ין בִּלְתֶּ֑/ךָ וְ/אֵ֥ין צ֖וּר כֵּ/אלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/002.yaml
  text: There is none holy like Yahweh[a], for there is none besides you, and there is no rock like our God.
translation:
  language: tl
  text: 'Walang banal na gaya ni Yahweh[a],

    sapagkat walang iba maliban sa iyo;

    walang batong gaya ng aming Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Yahweh,” ang personal na pangalan ng Diyos, na madalas isalin sa ibang salin bilang “PANGINOON.”'
    reason: Pagpapaliwanag sa banal na pangalan at sa karaniwang alternatibong salin nito.
lexical_decisions:
- source_word: אֵין
  choice: walang
  rationale: Ang eksistensiyal na “walang” ay likas sa modernong Tagalog at, sa pag-uulit nito, napapanatili ang diin at paralelismo ng Hebreo.
- source_word: קָדוֹשׁ
  choice: banal
  rationale: Karaniwang katumbas ito ng salitang tumutukoy sa natatanging kabanalan at pagkahiwalay ng Diyos.
- source_word: כַּיהוָה
  choice: gaya ni Yahweh
  rationale: Ang prefiks na כ־ ay paghahambing. Ginamit ang “ni” sapagkat pangalang pantangi ang Yahweh sa pangungusap.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan ng naunang pahayag at angkop sa marangal na tulang panalangin.
- source_word: בִּלְתֶּךָ
  choice: iba maliban sa iyo
  rationale: Pinananatili nito ang diwa ng pagbubukod at ang tuwirang ikalawang panauhang pakikipag-usap sa Diyos.
- source_word: צוּר
  choice: bato
  rationale: Pinananatili ang literal at malawak na metapora ng katatagan, lakas, at kanlungan sa halip na paliitin ito sa isang interpretasyon lamang.
- source_word: כֵּאלֹהֵינוּ
  choice: gaya ng aming Diyos
  rationale: Ang כ־ ay paghahambing, at ang אֱלֹהִים dito ay tumutukoy nang isahan sa Diyos ng Israel, na may hulaping unang panauhang maramihan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Metaporang צוּר para sa Diyos
  choice: bato
  alternative: kanlungan; tanggulan
  rationale: Ang “bato” ay nagpapanatili sa bukás na lawak ng metapora at hindi tahimik na nilulutas ito bilang isang katangiang gaya lamang ng proteksiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang tatlong magkakatulad na pahayag na may “walang” at ang tuwirang pagharap sa Diyos sa “iyo.” Ginamit ang “batong gaya” upang manatiling malinaw na paghahambing at hindi magmukhang panawagan.
