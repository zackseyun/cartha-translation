  source_fidelity: 'Tumpak na naipapahayag ang tatlong magkaparalelong pahayag ng Hebreo: walang banal na gaya ni Yahweh, walang iba maliban sa tuwirang kausap na “iyo,” at walang bato na gaya ng “aming Diyos.” Napanatili ang metaporang “bato” at ang pagbabago mula sa isahang “iyo” tungo sa pangmaramihang “aming Diyos.”'
