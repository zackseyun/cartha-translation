base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/026.yaml
  text: The boy Samuel continued to grow, and he was good in the sight of both Yahweh and men[a][b].
translation:
  language: tl
  text: Ang batang si Samuel ay patuloy na lumalaki at kinalulugdan kapwa ni Yahweh at ng mga tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, maaari ring isalin: “patuloy na lumalaki at kalugod-lugod, kapwa kay Yahweh at sa mga tao.”'
    reason: Pinananatili nito nang mas tahasan ang pagkakasunod-sunod ng Hebreong “nagpapatuloy at lumalaki at mabuti/kalugod-lugod,” habang iniiwan ang saklaw ng ugnayang ipinahihiwatig ng “mabuti kasama/kay” na hindi labis na tinutukoy.
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: Ang batang
  rationale: Ang נַעַר ay tumutukoy rito kay Samuel bilang isang bata o batang naglilingkod. Hindi na isinalin nang hiwalay ang panimulang וְ upang maging likas ang daloy sa Filipino.
- source_word: שְׁמוּאֵל
  choice: si Samuel
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa Filipino, kasama ang pantukoy na “si.”
- source_word: הֹלֵךְ וְגָדֵל
  choice: patuloy na lumalaki
  rationale: Ang הֹלֵךְ na sinusundan ng וְגָדֵל ay nagpapahayag ng nagpapatuloy o pasulong na paglaki; malinaw at likas itong naipapahayag ng “patuloy na lumalaki.”
- source_word: וָטוֹב
  choice: at lalong kinalulugdan
  rationale: Sa pariralang טוֹב עִם, ang טוֹב ay nagpapahiwatig ng pagiging mabuti, kalugod-lugod, o katanggap-tanggap sa kaugnayan sa iba. Ipinahihiwatig ng “lalong” ang kasabay na pag-unlad nang hindi ito ginagawang tiyak na pabor na ipinagkaloob.
- source_word: גַּם עִם יְהוָה וְגַם עִם אֲנָשִׁים
  choice: kapwa ni Yahweh at ng mga tao
  rationale: Pinananatili ng “kapwa … at …” ang balanseng גַּם … וְגַם. Sa kontekstong ito, ang אֲנָשִׁים ay tumutukoy sa mga tao sa pangkalahatan, kaya mas likas at saklaw ang “mga tao” kaysa “mga lalaki.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang pamagat.
theological_decisions:
- issue: Paglalarawan sa pagtanggap kay Samuel ng Diyos at ng mga tao
  choice: kinalulugdan kapwa ni Yahweh at ng mga tao
  alternative: mabuti kapwa kay Yahweh at sa mga tao
  rationale: Ang “kinalulugdan” ay natural na Filipino para sa idyomang טוֹב עִם at naaangkop kapwa sa kaugnayan kay Yahweh at sa mga tao, nang hindi nilulutas nang lampas sa teksto kung ito ay tumutukoy sa pagsang-ayon, pagkalugod, o pabor.
- issue: Pangalan ng Diyos
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang pangalang יהוה, kaya pinanatili itong personal na pangalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “batang si Samuel” at “mga tao” bilang karaniwang pananalita, habang pinanatili ang pangalang “Yahweh” at ang balanseng “kapwa … at …” ng Hebreo.
