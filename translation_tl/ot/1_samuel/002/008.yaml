  text: מֵקִ֨ים מֵ/עָפָ֜ר דָּ֗ל מֵֽ/אַשְׁפֹּת֙ יָרִ֣ים אֶבְי֔וֹן לְ/הוֹשִׁיב֙ עִם נְדִיבִ֔ים וְ/כִסֵּ֥א כָב֖וֹד יַנְחִלֵ֑/ם כִּ֤י לַֽ/יהוָה֙ מְצֻ֣קֵי אֶ֔רֶץ וַ/יָּ֥שֶׁת עֲלֵי/הֶ֖ם תֵּבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/008.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap, to seat them with nobles and make them inherit a seat of honor. For the pillars of the earth belong to Yahweh[b], and on them he has set the world.
translation:
  language: tl
  text: 'Itinataas niya mula sa alabok ang dukha;

    inaahon niya mula sa tambakan ng basura ang nangangailangan,

    upang paupuin sila kasama ng mga maharlika

    at ipagkaloob sa kanila bilang mana ang luklukan ng karangalan.[a]


    Sapagkat kay Yahweh ang mga haligi ng lupa,[b]

    at sa ibabaw ng mga iyon niya inilagay ang daigdig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “trono ng karangalan.”
    reason: lexical_alternative
  - marker: b
    text: O “mga saligan ng lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים מֵעָפָר דָּל
  choice: Itinataas niya mula sa alabok ang dukha
  rationale: Pinananatili ang konkretong larawan ng pag-aangat mula sa matinding kababaan; ang “dukha” ay likas na katumbas ng taong mababa ang kalagayang panlipunan at pangkabuhayan.
- source_word: מֵאַשְׁפֹּת יָרִים אֶבְיוֹן
  choice: inaahon niya mula sa tambakan ng basura ang nangangailangan
  rationale: Ang אַשְׁפֹּת ay tambakan ng itinapong bagay o dumi, hindi lamang literal na abo. Ipinakikita ng “inaahon” ang pag-angat mula sa kahiya-hiyang kalagayan, samantalang pinag-iiba ng “nangangailangan” ang אֶבְיוֹן mula sa naunang דָּל.
- source_word: לְהוֹשִׁיב עִם נְדִיבִים
  choice: upang paupuin silang kasama ng mga maharlika
  rationale: Ipinahahayag ng pawatas ang layunin o bunga. Ang “mga maharlika” ay naghahatid ng mataas na katayuang panlipunan ng נְדִיבִים nang hindi nililimitahan ito sa isang tiyak na katungkulang pampamahalaan.
- source_word: וְכִסֵּא כָבוֹד יַנְחִלֵם
  choice: at ipagkaloob sa kanila bilang mana ang luklukan ng karangalan
  rationale: Pinananatili ng “bilang mana” ang causative inheritance sense ng יַנְחִלֵם. Ang “luklukan” ay sadyang maluwag upang katawanin ang כִּסֵּא bilang upuan o trono, at ang “karangalan” ay natural na salin ng כָבוֹד sa konteksto.
- source_word: מְצֻקֵי אֶרֶץ
  choice: mga haligi ng lupa
  rationale: Pinananatili ang matingkad na makatang larawan ng mga sanghay o haliging sumusuporta sa lupa; inilalagay sa talababa ang posibleng “mga saligan.”
- source_word: תֵּבֵל
  choice: daigdig
  rationale: Likas at marangal na salin para sa maayos o tinatahanang mundo.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang pangalang banal na יהוה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Larawang kosmolohikal sa מְצֻקֵי אֶרֶץ
  choice: Panatilihin sa pangunahing teksto ang “mga haligi ng lupa.”
  alternative: “mga saligan ng lupa”
  rationale: Makatang larawan ito ng kapangyarihan at paghahari ni Yahweh. Hindi ito dapat gawing abstraktong pahayag o ipaliwanag nang lampas sa sinasabi ng Hebreo.
- issue: Saklaw ng כִסֵּא כָבוֹד
  choice: “luklukan ng karangalan”
  alternative: “trono ng karangalan”
  rationale: Maaaring mangahulugan ang כִּסֵּא ng upuan o trono. Pinananatili ng “luklukan” ang mataas na katayuan nang hindi tiyak na ipinahihiwatig na ginagawang hari ang bawat dukha; inilalagay sa talababa ang mas espesipikong alternatibo.
- issue: Pagmamana sa יַנְחִלֵם
  choice: 'Panatilihin ang diwa ng mana: “ipagkaloob sa kanila bilang mana.”'
  alternative: “ibigay sa kanila”
  rationale: Ang pandiwa ay causative at tahasang may diwa ng pagpapamana o pagpapariwara bilang pag-aari; hindi ito dapat paliitin sa pangkalahatang pagbibigay lamang.
translation_notes:
  register: Makabagong Filipino na marangal at patula, na may malinaw na paralelismo. Ginamit ang “tambakan ng basura” sa halip na tradisyonal ngunit maaaring mapanlinlang na “bunton ng abo,” at pinanatili ang konkretong mga larawan ng alabok, luklukan, haligi, at mana.
