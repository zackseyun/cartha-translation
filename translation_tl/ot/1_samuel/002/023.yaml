translation:
  language: tl
  text: At sinabi niya sa kanila, “Bakit ninyo ginagawa ang ganitong mga bagay? Naririnig ko mula sa buong bayang ito ang masasamang ginagawa ninyo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, maaaring literal na isalin: “Naririnig ko mula sa buong bayang ito ang masasama ninyong mga bagay/salita.” Sa konteksto, ang tinutukoy ay ang mga ulat tungkol sa masamang asal ng mga anak ni Eli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: At sinabi niya sa kanila
  rationale: Pinananatili nito ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol at ang tahasang patutunguhan ng pananalita.
- source_word: לָמָּה תַעֲשׂוּן כַּדְּבָרִים הָאֵלֶּה
  choice: Bakit ninyo ginagawa ang ganitong mga bagay?
  rationale: Ang imperfect ay tumutukoy sa nagpapatuloy o nakaugaliang asal. Ang “ganitong mga bagay” ay natural sa Filipino at pinananatili ang malawak na saklaw ng דְּבָרִים bilang mga bagay, gawain, o usapin.
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: Naririnig ko
  rationale: Ang participle kasama ng tahasang panghalip ay nagpapahiwatig ng kasalukuyan at nagpapatuloy na pagkarinig ng mga ulat.
- source_word: אֶת דִּבְרֵיכֶם רָעִים
  choice: ang masasamang bagay tungkol sa inyo
  rationale: Pinananatili nito ang lexical na lawak at bahagyang kalabuan ng דְּבָרִים sa halip na agad itong gawing “masasamang gawa”; sa konteksto, tumutukoy ito sa masasamang asal na iniuulat tungkol sa mga anak ni Eli.
- source_word: מֵאֵת כָּל הָעָם אֵלֶּה
  choice: mula sa buong bayang ito
  rationale: Ang “buong bayan” ay natural na kolektibong salin ng כָּל הָעָם, habang pinananatili ng “ito” ang deiktikong diin ng אֵלֶּה.
