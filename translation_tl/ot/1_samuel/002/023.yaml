translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” para sa maramihang kausap at ang “buong bayang ito” bilang natural na kolektibong pahayag. Inilagay ang talababa sa pangungusap na nagpapaliwanag sa lexical na kalabuan ng דְּבָרִים.
