translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Filipino. Ang mga pandiwang “pumupunta” at “sinasabi” ay nagpapakita ng nakagawiang paulit-ulit na gawain sa konteksto, hindi lamang ng isang pangyayari. Ang “sunugin bilang handog” ay nagpapanatili sa ritwal na kahulugan nang hindi gumagamit ng labis na teknikal na pananalita.
