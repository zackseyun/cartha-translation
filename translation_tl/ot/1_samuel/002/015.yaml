base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/015.yaml
  text: Even before they burned the fat[a], the priest’s servant would come and say to the man who was sacrificing, “Give meat for the priest to roast, for he will not take boiled meat from you, but only raw.”
translation:
  language: tl
  text: Bago pa man nila sunugin bilang handog ang taba, pumupunta ang utusan[a] ng pari sa taong naghahandog at sinasabi, “Bigyan mo ang pari ng karneng iihawin, sapagkat hindi siya tatanggap mula sa iyo ng pinakuluang karne, kundi hilaw lamang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kabataang tauhan” o “tagapaglingkod.” Ang salitang Hebreo na נַעַר ay maaaring tumukoy sa isang kabataan o utusan; dito, malamang na tauhan itong kumikilos para sa pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בְּטֶרֶם
  choice: Bago pa man
  rationale: Ipinahihiwatig ng גַּם ang nagpapabigat na diin, at ng בְּטֶרֶם ang pangyayaring nauna sa wastong hakbang ng ritwal. Likas na naihahatid ng “bago pa man” ang dalawang diwang ito sa Tagalog.
- source_word: יַקְטִרוּן אֶת־הַחֵלֶב
  choice: sunugin bilang handog ang taba
  rationale: Tumutukoy ito sa ritwal na pagsusunog ng mga bahaging taba sa altar. Nililinaw ng “bilang handog” na hindi ito karaniwang pagluluto lamang.
- source_word: נַעַר הַכֹּהֵן
  choice: utusan ng pari
  rationale: Maaaring tumukoy ang נַעַר sa isang kabataan, utusan, o tagapaglingkod. Sa konteksto, kumikilos siya bilang tauhan ng pari; pinanatili sa talababa ang tunay na lawak ng salita.
- source_word: לָאִישׁ הַזֹּבֵחַ
  choice: sa taong naghahandog
  rationale: Ang participle ay tumutukoy sa taong kasalukuyang naghahandog ng hain. Natural at malinaw ito sa modernong Tagalog.
- source_word: תְּנָה
  choice: Bigyan mo
  rationale: Tuwirang pautos ang anyo sa Hebreo. Pinananatili ng “Bigyan mo” ang mariing kahilingan nang walang dagdag na pagpapakahulugan.
- source_word: בָשָׂר לִצְלוֹת לַכֹּהֵן
  choice: ang pari ng karneng iihawin
  rationale: Ang בָשָׂר ay karne sa kontekstong pagkain, at ang לִצְלוֹת ay nagsasaad ng layuning ihawin ito. Ang passive na “iihawin” ay hindi nagpapasok ng tiyak na tagagawa na hindi naman tahasang binanggit sa Hebreo.
- source_word: וְלֹא יִקַּח מִמְּךָ
  choice: sapagkat hindi siya tatanggap mula sa iyo
  rationale: Sa tuwirang pananalita, ipinahahayag nito ang pagtanggi ng pari na kumuha o tumanggap. Mas natural sa Tagalog ang “tatanggap mula sa iyo” at pinananatili nito ang ugnayan sa naghahandog.
- source_word: מְבֻשָּׁל
  choice: pinakuluang karne
  rationale: Partikular na tumutukoy ang salita sa karneng niluto sa pamamagitan ng pagpapakulo, hindi lamang sa anumang lutong karne.
- source_word: כִּי אִם חָי
  choice: kundi hilaw lamang
  rationale: 'Pinananatili nito ang mariing pagtatambis: hindi pinakuluan kundi hilaw.'
