  text: וְ/אִ֗ישׁ לֹֽא אַכְרִ֤ית לְ/ךָ֙ מֵ/עִ֣ם מִזְבְּחִ֔/י לְ/כַלּ֥וֹת אֶת עֵינֶ֖י/ךָ וְ/לַ/אֲדִ֣יב אֶת נַפְשֶׁ֑/ךָ וְ/כָל מַרְבִּ֥ית בֵּיתְ/ךָ֖ יָמ֥וּתוּ אֲנָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/033.yaml
  text: But I will not cut off every man of yours from beside my altar[a], to make your eyes fail and your soul grieve; and all the increase of your house will die by the sword of men.
translation:
  language: tl
  text: Ngunit hindi ko aalisin sa tabi ng aking altar ang bawat lalaki sa angkan mo, upang manghina ang iyong mga mata at magdalamhati ang iyong kalooban. At ang lahat ng magiging supling ng iyong sambahayan ay mamamatay bilang mga lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mamamatay bilang mga lalaki.” Maaaring ang ibig sabihin ay mamamatay sila sa kasibulan ng buhay, bago umabot sa katandaan.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ לֹא אַכְרִית לְךָ מֵעִם מִזְבְּחִי
  choice: hindi ko aalisin sa tabi ng aking altar ang bawat lalaki sa angkan mo
  rationale: 'Pinananatili ng “hindi ... ang bawat lalaki” ang saklaw ng pagtanggi sa Hebreo: hindi aalisin ang bawat isa sa angkan ni Eli. Ang “sa tabi ng aking altar” ay sumasalamin sa מֵעִם at hindi nagpapasiya kung pisikal na paglapit lamang o patuloy na paglilingkod bilang pari ang tinutukoy.'
- source_word: לְכַלּוֹת אֶת־עֵינֶיךָ
  choice: upang manghina ang iyong mga mata
  rationale: Likas na ipinahahayag sa Tagalog ang larawang Hebreo ng mga matang nauubos o nanghihina dahil sa dalamhati.
- source_word: וְלַאֲדִיב אֶת־נַפְשֶׁךָ
  choice: at magdalamhati ang iyong kalooban
  rationale: Ang “kalooban” ay natural na katumbas dito ng נֶפֶשׁ bilang panloob na sarili, habang pinananatili ng “magdalamhati” ang diwa ng bihirang pandiwang tumutukoy sa sakit at lungkot.
- source_word: וְכָל מַרְבִּית בֵּיתְךָ
  choice: ang lahat ng magiging supling ng iyong sambahayan
  rationale: Ang מַרְבִּית ay literal na pagdami o paglago, ngunit sa konteksto ay tumutukoy sa mga daragdag na salinlahi ng sambahayan; malinaw at natural sa modernong Tagalog ang “magiging supling.”
- source_word: יָמוּתוּ אֲנָשִׁים
  choice: mamamatay bilang mga lalaki
  rationale: Sadyang malapit ito sa maikli at hindi tiyak na pariralang Hebreo. Hindi nito ipinapasok ang “sa pamamagitan ng tabak,” na wala sa tekstong WLC, at inilalagay sa talababa ang malamang na diwang mamamatay sila sa kasibulan ng buhay.
theological_decisions:
- issue: Saklaw ng hatol sa angkan ni Eli
  choice: Hindi aalisin ang bawat lalaki sa angkan mula sa tabi ng altar; may maiiwan sa ilalim ng patuloy na dalamhati at hatol.
  alternative: Lubusang aalisin ang buong angkan sa paglilingkod sa altar, o ang pahayag ay tumutukoy lamang sa pisikal na pananatiling buhay malapit sa altar.
  rationale: 'Pinananatili ng ayos na “hindi ... ang bawat lalaki” ang tensiyon ng Hebreo: hindi agad lubusang nawawala ang angkan, ngunit ang mga nalalabi ay kaugnay pa rin ng pagdurusa at paghatol.'
- issue: Kahulugan ng אֲנָשִׁים sa hulihan
  choice: Panatilihin sa teksto ang literal na “bilang mga lalaki,” at ipaliwanag sa talababa ang posibleng diwang pagkamatay sa kasibulan ng buhay.
  alternative: Mamamatay sa kasibulan ng buhay; mamamatay sa kamay o tabak ng mga tao.
  rationale: Hindi malinaw na binabanggit ng Hebreo ang tabak o marahas na pagpatay. Ang literal na salin at paliwanag sa talababa ay nagpapanatili sa tunay na kalabuan nang hindi ipinipilit ang isang interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “angkan,” “kalooban,” at “sambahayan” upang mapanatili ang pampamilyang at panloob na mga larawang Hebreo nang hindi nagiging lipas o teknikal. Inilagay ang [a] sa mismong pariralang ipinapaliwanag nito.
