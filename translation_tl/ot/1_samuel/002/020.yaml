  to: Tuwing binabasbasan ni Eli si Elkana at ang asawa nito, sinasabi niya, “Nawa’y pagkalooban ka ni Yahweh ng mga anak sa pamamagitan ng babaeng ito bilang kapalit ng kahilingan[a] na inihiling[b] para kay Yahweh.” Pagkatapos ay bumabalik sila sa lugar ni Elkana.
