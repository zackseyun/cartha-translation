base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/020.yaml
  text: And Eli would bless Elkanah and his wife and say[b][a], “May Yahweh give you offspring by this woman in place of the petition that was asked for Yahweh.” Then they would go to his place.
translation:
  language: tl
  text: Tuwing binabasbasan ni Eli si Elkana at ang asawa nito, sinasabi niya, “Nawa’y pagkalooban ka ni Yahweh ng mga anak sa pamamagitan ng babaeng ito bilang kapalit ng kahilingan[a] na inihiling[b] para kay Yahweh.” Pagkatapos ay bumabalik sila sa lugar ni Elkana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “kahilingan” ay kaugnay ng salitang Hebreo na maaari ring mangahulugang “ipinahiram.” Inuulit nito ang larong-salita sa salaysay tungkol sa kapanganakan ni Samuel: siya ay hiniling, at pagkatapos ay ibinigay o itinalaga kay Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: Panlalaking isahan ang anyo ng pandiwang Hebreo na isinaling “inihiling,” ngunit ipinakikita ng konteksto na si Ana ang humiling ng anak (1 Samuel 1:20, 27–28). Ang parirala ay maaari ring unawaing tumutukoy sa hiniling mula kay Yahweh o sa batang inilaan para kay Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֵרַךְ
  choice: Tuwing binabasbasan
  rationale: Ipinahihiwatig ng konteksto ng taunang pagdalaw na paulit-ulit o nakagawian ang pagbabasbas, kaya malinaw na ipinahayag ang aspektong iteratibo.
- source_word: אֶת אֶלְקָנָה וְאֶת אִשְׁתּוֹ
  choice: si Elkana at ang asawa nito
  rationale: Pinananatili ang tahasang ‘asawa niya’ ng Hebreo sa halip na ipalit ang pangalang Ana.
- source_word: יָשֵׂם יְהוָה לְךָ
  choice: Nawa’y pagkalooban ka ni Yahweh
  rationale: Bagaman ang literal na diwa ng שׂים ay ‘ilagay’ o ‘italaga,’ ang ‘pagkalooban’ ang likas na Filipino para sa isang basbas na humihiling ng supling.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulong ‘PANGINOON.’
- source_word: זֶרַע
  choice: mga anak
  rationale: Ang זֶרַע ay kolektibong tumutukoy sa supling; sa kontekstong pampamilya, malinaw at natural sa Filipino ang ‘mga anak.’
- source_word: מִן הָאִשָּׁה הַזֹּאת
  choice: sa babaeng ito
  rationale: Likas itong paraan sa Filipino upang tukuyin ang babaeng magiging ina ng ipinapanalanging mga anak.
- source_word: תַּחַת הַשְּׁאֵלָה
  choice: bilang kapalit ng hiniling
  rationale: Pinananatili ng ‘kapalit’ ang diwa ng תַּחַת, samantalang ang ‘hiniling’ ay nagpapanatili sa pag-uulit ng ugat na שׁאל sa salaysay.
- source_word: אֲשֶׁר שָׁאַל לַיהוָה
  choice: para kay Yahweh
  rationale: Hindi tinukoy ng saling Filipino ang kasarian ng humiling, kaya hindi nito sapilitang nilulutas ang pagkakaiba ng anyong panlalaki ng pandiwa at ng kontekstong tumuturo kay Ana. Ang ‘para kay Yahweh’ ay nagpapanatili sa posibleng diwa ng batang hiniling at pagkatapos ay itinalaga sa kanya.
- source_word: וְהָלְכוּ לִמְקֹמוֹ
  choice: Pagkatapos ay umuuwi sila
  rationale: Ang pandiwa ay maramihan at tumutukoy sa mag-asawa. Ang ‘umuuwi’ ay natural na katumbas sa konteksto ng pagbalik nila sa lugar o tahanan ng sambahayan at umaayon sa nakagawiang kilos.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pinananatili ang personal na pangalang nasa pinagmulang teksto nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
- issue: Paksa ng שָׁאַל at kahulugan ng לַיהוָה
  choice: Hindi tahasang tinukoy ang kasarian sa ‘hiniling para kay Yahweh’
  alternative: ‘hiniling niya kay Yahweh,’ na maaaring unawaing si Ana ang paksa; o ‘hiniling niya mula kay Yahweh,’ na mas tahasang tumutukoy sa pinagmulan ng kahilingan
  rationale: Panlalaking isahan ang anyo ng pandiwang Hebreo, ngunit si Ana ang humiling ng anak ayon sa konteksto. Pinahihintulutan ng Filipino na manatili ang tensiyong ito, habang ang talababa ay nagpapaliwanag ng mga posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘nito’ upang maiwasan ang malabong pagtukoy ng ‘niya,’ at ang ‘Tuwing … sinasabi niya’ upang natural na maipahayag ang paulit-ulit na kilos.
