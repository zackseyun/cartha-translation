    issue: Ang “umuuwi sila” ay nagpapakahulugang tahanan ang “kanyang lugar.”
    rationale: Ang Hebreo ay literal na “pumunta sila sa kanyang lugar”; ang “umuuwi” ay posibleng tama sa konteksto ngunit hindi tahasang sinasabi ng talata. Ang pagtukoy kay Elkana ay mas malinaw na naipapahayag sa Filipino.
  - severity: medium
    issue: Hindi sapat na naihahayag ng “hiniling” ang pangngalang הַשְּׁאֵלָה.
    rationale: Ang Hebreo ay gumagamit ng pangngalang may kahulugang “kahilingan” at may kaugnayan din sa “ipinahiram,” kasunod ng kaugnay na pandiwa. Ang “kahilingang inihiling” ay mas malapit dito at pinananatili ang pag-uulit ng ugat.
