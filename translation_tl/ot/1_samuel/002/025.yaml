id: 1SA.2.25
reference: 1 Samuel 2:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִם יֶחֱטָ֨א אִ֤ישׁ לְ/אִישׁ֙ וּ/פִֽלְל֣/וֹ אֱלֹהִ֔ים וְ/אִ֤ם לַֽ/יהוָה֙ יֶֽחֱטָא אִ֔ישׁ מִ֖י יִתְפַּלֶּל ל֑/וֹ וְ/לֹ֤א יִשְׁמְעוּ֙ לְ/ק֣וֹל אֲבִי/הֶ֔ם כִּֽי חָפֵ֥ץ יְהוָ֖ה לַ/הֲמִיתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/025.yaml
  text: If a man sins against another man[a], God will mediate for him; but if a man sins against Yahweh, who will pray for him? But they would not listen to the voice of their father[b], because Yahweh desired to put them to death.
translation:
  language: tl
  text: “Kung magkasala ang isang tao laban sa kapwa niya, mamamagitan ang Diyos para sa kanya[a]; ngunit kung magkasala ang isang tao laban kay Yahweh, sino ang mananalangin para sa kanya[b]?” Ngunit ayaw nilang makinig sa tinig ng kanilang ama, sapagkat ninais ni Yahweh na patayin sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hahatulan siya ng mga hukom.” Ang אֱלֹהִים (’elohim) ay maaari ring tumukoy sa mga taong hukom; “Diyos” ang nasa pangunahing teksto dahil mas pinapaboran ito ng paghahambing sa kasunod na “Yahweh.”
    reason: alternative_reading
  - marker: b
    text: O “sino ang mamamagitan para sa kanya?” Maaaring mangahulugan ang pandiwang Hebreo ng pananalangin o pamamagitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ לְאִישׁ
  choice: isang tao laban sa kapwa niya
  rationale: Sa kontekstong ito, ang אִישׁ ... אִישׁ ay tumutukoy sa isang tao at sa kapwa niya. Likas sa modernong Tagalog ang pariralang ito at malinaw nitong ipinapakita na ang unang kasalanan ay laban sa kapwa-tao.
- source_word: וּפִלְלוֹ
  choice: mamamagitan ... para sa kanya
  rationale: Ang piel ng פלל dito ay may hudisyal na diwa ng paghatol, pag-aayos, o pamamagitan sa isang alitan. Pinananatili ng “mamamagitan” ang ugnayan nito sa kasunod na יִתְפַּלֶּל nang hindi nililimitahan ang kilos sa pagpaparusa lamang.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman maaari itong tumukoy sa mga hukom sa ilang konteksto, higit na angkop dito ang “Diyos” dahil sa paghahambing sa pagkakasala laban kay Yahweh. Inilalagay sa talababa ang alternatibong pagbasa.
- source_word: לַיהוָה
  choice: laban kay Yahweh
  rationale: Ang לְ ay nagmamarka sa nilalabanan o pinagkakasalahan, at ang banal na pangalang יהוה ay isinalin bilang “Yahweh” upang katawanin ang pangalang nasa Hebreo.
- source_word: מִי יִתְפַּלֶּל לוֹ
  choice: sino ang mananalangin para sa kanya?
  rationale: Ang hitpael ng פלל ay karaniwang nangangahulugang manalangin o mamagitan. Natural sa Tagalog ang “mananalangin para sa kanya,” samantalang itinatala sa talababa ang mas tiyak na “mamamagitan.”
- source_word: וְלֹא יִשְׁמְעוּ לְקוֹל אֲבִיהֶם
  choice: Ngunit ayaw nilang makinig sa tinig ng kanilang ama
  rationale: Ipinapahayag ng “ayaw nilang makinig” ang sadyang pagtanggi, at pinananatili ng “tinig ng kanilang ama” ang malinaw at dignified na idyomang Hebreo.
- source_word: כִּי חָפֵץ יְהוָה
  choice: sapagkat ninais ni Yahweh
  rationale: Ang חָפֵץ ay nagpapahayag ng pagnanais o pagkukusa. Hindi ito pinalambot tungo sa simpleng pahintulot o ipinalit sa interpretatibong “itinakda.”
- source_word: לַהֲמִיתָם
  choice: na patayin sila
  rationale: Ang hiphil infinitive ng מות ay causative. Ang “patayin sila” ay tuwiran, mabigat, at likas sa Tagalog.
theological_decisions:
- issue: Ang kahulugan ng אֱלֹהִים sa unang sugnay
  choice: ang Diyos
  alternative: ang mga hukom
  rationale: Sinusuportahan ng paghahambing sa kasalanan laban kay Yahweh ang pagtukoy sa Diyos bilang tagapamagitan sa usapin ng dalawang tao. Gayunman, tunay na posible sa leksikon at kasaysayan ng pagsasalin ang “mga hukom,” kaya hindi ito ikinubli at inilagay sa talababa.
- issue: Ang banal na layunin sa כִּי חָפֵץ יְהוָה לַהֲמִיתָם
  choice: sapagkat ninais ni Yahweh na patayin sila
  alternative: sapagkat ipinasiya ni Yahweh na patayin sila
  rationale: Tuwirang sinasabi ng Hebreo ang pagkukusa ni Yahweh. Pinananatili ng “ninais” ang matinding pahayag at ang tensiyon sa pagitan ng banal na paghatol at ng pagtanggi ng mga anak na makinig, nang hindi ito pinapalambot o sistematikong ipinapaliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Yahweh” para sa יהוה, “kapwa niya” para sa likas na interpersonal na diwa, at “ayaw nilang makinig” upang ipahayag ang patuloy at kusang pagtanggi. Ang matinding pangwakas na pahayag ay sadyang hindi pinalambot.
