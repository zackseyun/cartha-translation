  text: וּ/מִשְׁפַּ֥ט הַ/כֹּהֲנִ֖ים אֶת הָ/עָ֑ם כָּל אִ֞ישׁ זֹבֵ֣חַ זֶ֗בַח וּ/בָ֨א נַ֤עַר הַ/כֹּהֵן֙ כְּ/בַשֵּׁ֣ל הַ/בָּשָׂ֔ר וְ/הַ/מַּזְלֵ֛ג שְׁלֹ֥שׁ הַ/שִּׁנַּ֖יִם בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/013.yaml
  text: 'The custom of the priests with the people was this: whenever any man was sacrificing a sacrifice[a], the priest’s servant would come while the meat was boiling, with the three-pronged fork in his hand.'
translation:
  language: tl
  text: 'Ganito ang kaugalian ng mga pari sa pakikitungo nila sa mga tao: tuwing may lalaking naghahandog ng isang handog, dumarating ang lingkod ng pari habang niluluto ang karne, hawak ang tinidor na may tatlong tulis[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pangsungkit ng karne”; ang salitang Hebreo ay tumutukoy sa kasangkapang tulad ng tinidor na ginagamit sa pagkuha ng karne mula sa palayok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפַּט
  choice: Ganito ang kaugalian
  rationale: Ang מִשְׁפָּט ay maaaring tumukoy sa tuntunin, karapatan, o nakagawiang gawain. Sa salaysay na ito, ipinakikilala nito ang paulit-ulit na paraan ng pakikitungo ng mga pari, kaya malinaw at natural ang “kaugalian.” Isinama sa “Ganito” ang panimulang gamit ng pangungusap nang hindi nagdaragdag ng tahasang panandang pamanahon.
- source_word: הַכֹּהֲנִים אֶת־הָעָם
  choice: ng mga pari sa pakikitungo nila sa mga tao
  rationale: Ipinahahayag nito ang kaugalian ng mga pari kaugnay ng kanilang pakikitungo sa bayan. Ginagawang malinaw ng salin ang relasyonal na diwa nang hindi ipinapalagay kung mabuti o masama ang pakikitungo.
- source_word: כָּל־אִישׁ
  choice: tuwing may lalaking
  rationale: Panlalaking isahan ang אִישׁ at distributibo ang כָּל sa konteksto ng paulit-ulit na pangyayari. Pinananatili ng “lalaking” ang espesipikong anyo ng Hebreo, at ipinapahayag ng “tuwing may” ang habitual na diwa.
- source_word: זֹבֵחַ זֶבַח
  choice: naghahandog ng isang handog
  rationale: Pinananatili ang magkaugnay na pandiwa at pangngalan ng Hebreo, bagaman bahagyang paulit-ulit sa Tagalog, upang maipakita ang diin sa gawaing paghahandog.
- source_word: וּבָא
  choice: dumarating
  rationale: Ang kasalukuyang pangnagdaan sa Tagalog ay angkop sa isang nakagawiang at paulit-ulit na kilos sa salaysay.
- source_word: נַעַר הַכֹּהֵן
  choice: ang lingkod ng pari
  rationale: Maaaring mangahulugan ang נַעַר ng binata, kabataan, o tagapaglingkod. Dito, ang tungkulin niya bilang naglilingkod sa pari ang mahalaga, kaya “lingkod” ang pinakamalinaw nang hindi nagpapasya sa eksaktong edad.
- source_word: כְּבַשֵּׁל הַבָּשָׂר
  choice: habang pinakukuluan ang karne
  rationale: Temporal ang gamit ng כְּ, at ang pandiwa ay tumutukoy sa pagpapakulo o pagluluto. Mas tiyak sa kontekstong ito ang “pinakukuluan,” at natural ang “karne” para sa laman ng hayop na inihandog.
- source_word: הַמַּזְלֵג שְׁלֹשׁ הַשִּׁנַּיִם
  choice: ang tinidor na may tatlong tulis
  rationale: Literal na inilalarawan ng Hebreo ang kasangkapan bilang may “tatlong ngipin.” Ang “tinidor na may tatlong tulis” ay malinaw at likas sa modernong Tagalog; inilalagay sa talababa ang alternatibong paglalarawan sa gamit nito.
- source_word: בְּיָדוֹ
  choice: hawak
  rationale: Natural na ipinahahayag ng “hawak” sa Tagalog ang literal na “nasa kanyang kamay” at malinaw na ang lingkod ang may dala ng kasangkapan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang ginamit. Pinanatili ang bahagyang pag-uulit sa “naghahandog ng isang handog” dahil sumasalamin ito sa magkaugnay na pandiwa at pangngalan sa Hebreo. Inilagay ang talababa pagkatapos ng “tinidor na may tatlong tulis,” sapagkat doon talaga nauukol ang leksikal na paliwanag.
