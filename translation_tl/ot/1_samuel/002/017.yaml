base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/017.yaml
  text: So the sin of the young men was very great before Yahweh[c][b][a], because the men despised Yahweh’s offering.
translation:
  language: tl
  text: Kaya napakalaki ng kasalanan ng mga kabataang lalaki sa harap ni Yahweh[a], sapagkat hinamak ng mga lalaki ang handog ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa mukha ni Yahweh,” isang idyomang nangangahulugang “sa harap ni Yahweh” o “sa presensya ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo para sa “handog” (minḥah) ay maaaring tumukoy sa handog sa pangkalahatan at, sa ilang konteksto, mas tiyak na sa handog na butil.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: kasalanan
  rationale: Tumutukoy ito sa masamang ginawa ng mga anak ni Eli, hindi sa handog para sa kasalanan.
- source_word: הַנְּעָרִים
  choice: mga kabataang lalaki
  rationale: Saklaw ng נַעַר ang binata o kabataang naglilingkod. Ipinakikita ng pariralang ito na mga lalaki na sila nang hindi ipinahihiwatig na mga bata pa sila.
- source_word: גְּדוֹלָה מְאֹד
  choice: napakalaki
  rationale: Natural na Filipino itong nagpapahayag ng matinding pagpapalakas sa pariralang Hebreo na literal na 'lubhang malaki.'
- source_word: אֶת־פְּנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang Hebreong idyoma tungkol sa mukha o presensya ni Yahweh nang hindi ito tahimik na binabago tungo sa 'laban kay Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit napakalaki ng kanilang kasalanan.
- source_word: נִאֲצוּ
  choice: hinamak
  rationale: Tuwiran at natural nitong ipinahahayag ang pagtrato nang may paghamak o paglapastangan.
- source_word: הָאֲנָשִׁים
  choice: mga lalaking iyon
  rationale: Tumutukoy ito pabalik sa nabanggit na mga kabataang lalaki habang pinananatili ang karaniwang kahulugan ng אִישׁ bilang lalaki.
- source_word: מִנְחַת יְהוָה
  choice: handog kay Yahweh
  rationale: Ang מִנְחָה ay maaaring tumukoy sa handog sa pangkalahatan at, sa ilang konteksto, sa handog na butil; hindi ito labis na tinutukoy ng saling 'handog.'
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong Yahweh sa halip na palitan ng titulong 'PANGINOON.'
- issue: Kahulugan ng אֶת־פְּנֵי יְהוָה
  choice: sa harap ni Yahweh
  alternative: laban kay Yahweh
  rationale: Ang pangunahing anyo ay idyomang tumutukoy sa mukha o presensya ni Yahweh. Pinananatili ng salin ang anyong ito at hindi nilulutas nang sapilitan bilang 'laban kay Yahweh.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapagkat” para sa bahagyang pormal na himig na angkop sa salin ng Kasulatan, ngunit iniwasan ang mga lipas o labis na teknikal na salita.
