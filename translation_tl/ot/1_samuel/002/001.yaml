  text: וַ/תִּתְפַּלֵּ֤ל חַנָּה֙ וַ/תֹּאמַ֔ר עָלַ֤ץ לִבִּ/י֙ בַּֽ/יהוָ֔ה רָ֥מָה קַרְנִ֖/י בַּֽ/יהוָ֑ה רָ֤חַב פִּ/י֙ עַל א֣וֹיְבַ֔/י כִּ֥י שָׂמַ֖חְתִּי בִּ/ישׁוּעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/001.yaml
  text: 'And Hannah prayed and said: “My heart exults in Yahweh[a]; my horn is lifted high in Yahweh. My mouth is opened wide against my enemies[c][b], because I rejoice in your salvation.”'
translation:
  language: tl
  text: 'At nanalangin si Hana at sinabi:


    “Kay Yahweh nagbubunyi ang puso ko;

    dahil kay Yahweh, naitaas ang aking sungay[a].

    Nabuka nang maluwang ang bibig ko laban sa aking mga kaaway[b],

    sapagkat nagagalak ako sa pagliligtas mo[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sungay” ay larawang Hebreo para sa lakas, dangal, o mataas na kalagayan.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring unawain: “Matapang akong nagsasalita laban sa aking mga kaaway.” Sa literal, “lumuwang ang bibig ko laban sa aking mga kaaway.”'
    reason: lexical_alternative
  - marker: c
    text: O “kaligtasan.” Maaaring tumukoy ang salitang Hebreo sa kaligtasan sa malawak na diwa o sa kongkretong pagliligtas mula sa kagipitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפַּלֵּל
  choice: nanalangin
  rationale: Ang hitpael ng פלל ay karaniwang nangangahulugang manalangin. Bagaman patulang papuri ang kasunod, malinaw na inilalarawan ng salaysay ang sinabi ni Hana bilang panalangin.
- source_word: וַתֹּאמַר
  choice: sinabi
  rationale: Karaniwang pandiwa ito para sa pagsasalita. Hindi ginawang “umawit” sapagkat walang tiyak na pandiwa para sa pag-awit sa Hebreo.
- source_word: עָלַץ לִבִּי
  choice: nagbubunyi ang puso ko
  rationale: Ipinahahayag ng עלץ ang masigla at matinding kagalakan. Pinananatili ng “nagbubunyi” ang mataas na himig ng tula at ng “puso ko” ang tahasang larawan ng Hebreo.
- source_word: בַּיהוָה
  choice: kay Yahweh / dahil kay Yahweh
  rationale: Maaaring ipahiwatig ng ב ang kinaroroonan o batayan ng pagbubunyi at pagtataas. Ang dalawang likas na pariralang Filipino ay naghahatid ng ugnayan kay Yahweh nang hindi ginagawang tahasang simuno si Yahweh sa ikalawang linya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng titulong “PANGINOON.”
- source_word: רָמָה קַרְנִי
  choice: mataas ang aking sungay
  rationale: Pinananatili ang Hebreong larawan ng sungay bilang sagisag ng lakas, dangal, o mataas na kalagayan. Hindi dinagdagan ng tahasang gumagawa ang pandiwa, kaya hindi labis na nilulutas ang anyong patula.
- source_word: רָחַב פִּי עַל אֹיְבַי
  choice: Nabuka nang maluwang ang bibig ko laban sa aking mga kaaway
  rationale: Pinananatili ang kongkretong larawan ng bibig na nakabukang maluwang, na nagpapahiwatig ng matapang at matagumpay na pagsasalita laban sa mga kaaway.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala rito ng כִּי ang dahilan ng matapang na pagbubunyi ni Hana.
- source_word: שָׂמַחְתִּי
  choice: nagagalak ako
  rationale: Maaaring ipahayag ng perfect ang kasalukuyang kalagayang bunga ng naganap na pagliligtas. Likas ang kasalukuyang anyo sa tuloy-tuloy na papuri.
- source_word: בִּישׁוּעָתֶךָ
  choice: sa pagliligtas mo
  rationale: Ang ישועה ay maaaring tumukoy sa malawak na kaligtasan o sa kongkretong pagliligtas mula sa kagipitan. Ang “pagliligtas mo” ay natural sa konteksto ni Hana habang nananatiling bukas sa mas malawak na diwa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng ישועה
  choice: pagliligtas
  alternative: kaligtasan
  rationale: Ang konteksto ay nagpapahintulot sa kongkretong pagliligtas at sa mas malawak na diwa ng kaligtasan. Ginamit sa teksto ang natural na “pagliligtas,” habang inilalahad sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago at marangal na Filipino na angkop sa panalanging patula. Ginamit ang “nagbubunyi” upang mapanatili ang masidhing himig, at pinanatili ang mga larawang “puso,” “sungay,” at “bibig” mula sa Hebreo. Ang ayos ng mga linya ay patula ngunit malinaw sa karaniwang mambabasa.
