base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/005.yaml
  text: Those who were full have hired themselves out for bread[a], but those who were hungry have ceased. Even the barren woman has borne seven[c][b], but she who had many sons has withered away.
translation:
  language: tl
  text: 'Ang mga dating busog ay nagpaupa ng kanilang sarili kapalit ng tinapay,

    ngunit ang mga dating gutom ay tumigil na.[a]

    Maging ang baog na babae ay nagsilang ng pito,[b]

    ngunit ang may maraming anak na lalaki ay nanglupaypay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring unawain na “tumigil nang magutom” o “hindi na nagkulang.” Walang binanggit na layon ang pandiwang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang “pito” ay maaaring literal na bilang o makatang bilang na nagpapahiwatig ng kaganapan o kapuspusan.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂבֵעִים
  choice: ang mga dating busog
  rationale: Ginamit bilang pangngalang tumutukoy sa mga taong dating sagana; ipinahihiwatig ng “dating” ang pagbabaligtad ng kanilang kalagayan.
- source_word: בַּלֶּחֶם
  choice: kapalit ng tinapay
  rationale: Pinananatili ang kongkretong larawan ng tinapay at nililinaw na ito ang kabayaran o layunin ng kanilang pagpapaupa bilang manggagawa.
- source_word: נִשְׂכָּרוּ
  choice: nagpaupa ng sarili
  rationale: Ipinahahayag ang diwang Nifal ng pagpasok sa upahang paggawa, habang pinananatili ang matinding pagbagsak mula sa kasaganaan tungo sa pag-asa sa sahod.
- source_word: וּרְעֵבִים
  choice: ang mga dating gutom
  rationale: Kaagapay ng “mga dating busog” at malinaw na ipinapakita ang kabaligtarang pagbabago ng kalagayan.
- source_word: חָדֵלּוּ
  choice: tumigil na
  rationale: Pinananatiling hindi binabanggit ang layon, gaya ng Hebreo, sa halip na tahasang idagdag ang “magutom” o “magkulang.”
- source_word: עַד
  choice: maging
  rationale: Dito ay nagpapakilala ito ng sukdulang halimbawa ng pagbabaligtad; natural itong naipahahayag sa Filipino sa pamamagitan ng “maging.”
- source_word: עֲקָרָה
  choice: ang baog
  rationale: Ang pang-uring pambabae ay ginagamit bilang pangngalan; sa konteksto ng panganganak, malinaw at matipid sa tula ang “ang baog.”
- source_word: יָלְדָה שִׁבְעָה
  choice: nagsilang ng pito
  rationale: Malapit sa maikli at makatang anyo ng Hebreo, at hindi ipinapasok sa pangunahing teksto kung literal o sagisag ang bilang.
- source_word: וְרַבַּת בָּנִים
  choice: ang may maraming anak na lalaki
  rationale: Pinananatili ang tiyak na panlalaking kahulugan ng בָּנִים sa halip na gawing pangkalahatang “mga anak.”
- source_word: אֻמְלָלָה
  choice: nanghina
  rationale: Tumutukoy sa pagkaparalisa, panghihina, o pagkalugmok; ang “nanghina” ay likas at marangal na Filipino nang hindi nagdaragdag ng tiyak na larawang wala sa salita.
theological_decisions:
- issue: Kung ang “pito” ay literal na bilang o makatang sagisag ng kaganapan
  choice: Panatilihin ang “pito” nang walang interpretasyon sa pangunahing teksto
  alternative: Ipaliwanag ito bilang ganap o lubos na pagkamabunga
  rationale: Tuwirang nagbibigay ng bilang ang Hebreo at maaaring sinasadyang taglayin ng tula ang literal at sagisag na bisa nito.
- issue: Kung gagawing pangkalahatan ang בָּנִים bilang “mga anak”
  choice: Isalin bilang “anak na lalaki”
  alternative: mga anak
  rationale: Tiyak na panlalaking maramihan ang salitang Hebreo, at walang sapat na dahilan sa konteksto upang alisin ang pagkakaibang iyon.
- issue: Kung pupunan ang hindi binanggit na layon ng חָדֵלּוּ
  choice: Panatilihin ang elipsis sa “tumigil na”
  alternative: tumigil nang magutom / hindi na nagkulang
  rationale: Hindi sinasabi ng Hebreo kung ano ang itinigil; nauunawaan ito mula sa “mga gutom,” kaya pinananatili ng salin at talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paralelismo at maikling anyong patula, pati ang elipsis sa ikalawang linya at ang tiyak na “anak na lalaki.”
