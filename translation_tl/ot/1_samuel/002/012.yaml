base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/012.yaml
  text: Eli’s sons were worthless men[b][a]; they did not know Yahweh.
translation:
  language: tl
  text: Ang mga anak ni Eli ay masasamang tao[a]; hindi nila kilala ang PANGINOON.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ng kawalang-halaga”; ayon sa tradisyon, “mga anak ni Belial.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi nila kinilala ang PANGINOON” o “wala silang paggalang sa PANGINOON.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי עֵלִי
  choice: Ang mga anak ni Eli
  rationale: Ang וּ ay payak na pang-ugnay na hindi kailangang isalin nang tahasan sa simula ng bagong pahayag; ang בְנֵי עֵלִי ay likas na isinasaling “mga anak ni Eli.”
- source_word: בְּנֵי בְלִיָּעַל
  choice: mga taong ubod ng sama
  rationale: Ang idyomang Hebreo ay tumutukoy sa mga taong mababa at tiwali ang asal. Ang “ubod ng sama” ay malinaw at natural sa makabagong Tagalog, habang ang literal na anyo ay inilagay sa talababa upang hindi ipakahulugan ang Belial bilang tiyak na pangalang pantangi sa kontekstong ito.
- source_word: לֹא יָדְעוּ
  choice: hindi nila kilala
  rationale: Pinananatili nito ang pangunahing kahulugan ng יָדַע na “makilala/makilala nang personal,” pati ang posibleng pahiwatig ng ugnayan, pagkilala, at paggalang, nang hindi nilulutas ang saklaw nito sa pangunahing teksto.
- source_word: אֶת יְהוָה
  choice: ang PANGINOON
  rationale: Hindi isinasalin ang pantukoy sa tuwirang layon na אֶת. Ang tipograpiyang PANGINOON ang malinaw at nakaugaliang Tagalog na kinatawan ng banal na pangalang יהוה.
theological_decisions:
- issue: Kung ang בְּלִיָּעַל ay karaniwang pangngalan o pangalang pantangi na Belial
  choice: Ituring itong idyomang naglalarawan sa sukdulang kasamaan ng mga anak ni Eli.
  alternative: “mga anak ni Belial” o literal na “mga anak ng kawalang-kabuluhan”
  rationale: Sa kontekstong ito, inilalarawan ng parirala ang kanilang tiwaling pagkatao at hindi malinaw na tumutukoy sa isang pinangalanang espirituwal na nilalang. Iniiwasan ng salin ang pagpasok ng mas huling personipikasyon kay Belial.
- issue: Kung ang לֹא יָדְעוּ אֶת יְהוָה ay dapat ipaliwanag bilang kawalan ng pagkilala o paggalang
  choice: Panatilihin ang “hindi nila kilala ang PANGINOON.”
  alternative: “hindi nila kinilala ang PANGINOON” o “wala silang paggalang sa PANGINOON”
  rationale: Ang “kilala” ay nagpapanatili sa talinghaga at teolohikal na bigat ng Hebreong “alam/kilala,” kasama ang tensiyon sa pagitan ng kaalaman at tapat na pakikipag-ugnayan. Ang mas tiyak na mga pagbasa ay ibinibigay lamang bilang mga alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “ubod ng sama” ay madaling maunawaan ngunit hindi magaspang; ang mga literal at tradisyonal na anyo ng idyomang Hebreo ay pinanatili sa talababa. Ginamit ang “PANGINOON” para sa יהוה at iniwasan ang di-kinakailangang panandang diskurso gaya ng “Ngayon.”
