  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עֵלִ֖י זָקֵ֣ן מְאֹ֑ד וְ/שָׁמַ֗ע אֵת֩ כָּל אֲשֶׁ֨ר יַעֲשׂ֤וּ/ן בָּנָי/ו֙ לְ/כָל יִשְׂרָאֵ֔ל וְ/אֵ֤ת אֲשֶֽׁר יִשְׁכְּבוּ/ן֙ אֶת הַ/נָּשִׁ֔ים הַ/צֹּ֣בְא֔וֹת פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/022.yaml
  text: Eli was very old[a], and he heard all that his sons were doing to all Israel, and that they were lying with the women who served at the entrance to the tent of meeting.
translation:
  language: tl
  text: Napakatanda na ni Eli. Narinig niya ang lahat ng ginagawa ng kanyang mga anak na lalaki sa buong Israel, pati na ang pagsiping nila sa mga babaeng naglilingkod[a] sa pasukan ng tolda ng tipanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga babaeng nagtitipon.” Ang salitang Hebreo ay maaaring tumukoy sa pagtitipon o sa organisadong paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: Napakatanda na
  rationale: Likas at mariing Filipino para sa panaguring may intensifier na מְאֹד; ipinahihiwatig din ng “na” ang kalagayan ni Eli sa puntong ito ng salaysay nang hindi nagdaragdag ng hiwalay na panandang temporal.
- source_word: וְשָׁמַע
  choice: Narinig niya
  rationale: Ang qatal sa salaysay ay nagsasaad na nalaman o narinig ni Eli ang mga ulat; simple at natural ang aspektong ganap sa Filipino.
- source_word: כָּל אֲשֶׁר יַעֲשׂוּן
  choice: ang lahat ng ginagawa
  rationale: Inilalarawan ng anyong pandiwa ang nagpapatuloy o nakagawiang masamang asal ng mga anak ni Eli.
- source_word: לְכָל יִשְׂרָאֵל
  choice: sa buong Israel
  rationale: Pinananatili nito ang kaugnayan ng kanilang ginagawa sa lahat ng Israel nang hindi tahasang ginagawang “laban sa,” na mas interpretatibo.
- source_word: יִשְׁכְּבוּן אֶת־הַנָּשִׁים
  choice: ang pakikipagtalik nila sa mga babae
  rationale: Malinaw na ipinahahayag sa kasalukuyang Filipino ang seksuwal na diwa ng Hebreong eupemismo. Ang literal na “humihiga kasama” ay maaaring maging malabo o hindi likas sa Filipino.
- source_word: הַצֹּבְאוֹת
  choice: mga babaeng naglilingkod
  rationale: Sa konteksto ng santuwaryo at sa kahawig na gamit sa Exodo 38:8, malamang na tumutukoy ito sa organisadong paglilingkod, ngunit nananatiling posible ang diwang pagtitipon at inilalagay iyon sa talababa.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng tolda ng tipanan
  rationale: Likas na Filipino at pinananatili ang teknikal na pagtukoy sa santuwaryo bilang lugar ng itinakdang pakikipagtagpo.
theological_decisions:
- issue: Gampanin ng mga babae sa santuwaryo
  choice: mga babaeng naglilingkod sa pasukan
  alternative: mga babaeng nagtitipon sa pasukan
  rationale: Maaaring mangahulugan ang participle ng organisadong paglilingkod o pagtitipon. Mas angkop sa konteksto ang “naglilingkod,” ngunit hindi sila tinatawag na mga saserdote o binibigyan ng mas tiyak na tungkuling hindi sinasabi ng teksto.
- issue: Antas ng pagiging tahasan sa seksuwal na kasalanan
  choice: pakikipagtalik nila sa mga babae
  alternative: paghiga nila kasama ng mga babae
  rationale: Ang literal na eupemismo ay madaling mapagkamalang di-seksuwal sa modernong Filipino. Ang piniling parirala ay malinaw ngunit hindi masagwa o detalyado.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “tolda ng tipanan” para sa אֹהֶל מוֹעֵד at iniwasan ang mga terminong nagpapasok ng tiyak na institusyonal o denominasyonal na papel para sa mga babae.
