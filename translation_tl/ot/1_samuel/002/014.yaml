  to: at isinusundot niya ang tinidor sa palanggana, o sa palayok, o sa takure, o sa kawali.[a] Anumang maiahon ng tinidor ay kinukuha ng pari gamit ang tinidor. Ganito ang ginagawa nila sa lahat ng Israelitang pumupunta roon sa Shilo.
