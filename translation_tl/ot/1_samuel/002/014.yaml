  text: and he would thrust it into the basin[a], or the pot, or the kettle, or the cooking pan; all that the fork brought up, the priest would take with it[b]. Thus they did to all Israel who came there to Shiloh.
translation:
  language: tl
  text: at isinusundot niya ang tinidor sa palanggana, o sa palayok, o sa takure, o sa kawali.[a] Anumang maiahon ng tinidor ay kinukuha ng pari gamit ang tinidor. Ganito ang ginagawa nila sa lahat ng Israelitang pumupunta roon sa Shilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakaiba ng apat na katawagang Hebreo para sa mga sisidlang panluto.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכָּה
  choice: at isinusundot niya iyon
  rationale: Ipinahihiwatig ng Hiphil ng נכה sa konteksto ang paulit-ulit na pagtusok ng tinidor sa sisidlan, hindi lamang pangkalahatang paghampas.
- source_word: בַכִּיּוֹר א֣וֹ בַדּוּד א֤וֹ בַקַּלַּחַת֙ א֣וֹ בַפָּרוּר
  choice: sa palanggana, o sa kaldero, o sa takure, o sa lutuan
  rationale: Pinananatili ang talaan ng apat na sisidlan habang gumagamit ng mga pangkaraniwang katawagang Filipino; hindi tiyak ang eksaktong pagkakaiba ng mga katawagang Hebreo.
- source_word: כֹּל אֲשֶׁר יַעֲלֶה הַמַּזְלֵג
  choice: Anumang maiahon ng tinidor
  rationale: Malapit ito sa larawan ng karne na nasasabit at naiaangat mula sa sisidlan.
- source_word: הַמַּזְלֵג
  choice: tinidor
  rationale: Likas at malinaw sa modernong Filipino; ipinakilala sa naunang talata na tatlo ang tulis nito.
- source_word: יִקַּח הַכֹּהֵן בּוֹ
  choice: iyon ang kinukuha ng pari sa pamamagitan nito
  rationale: Pinananatili ang isahang 'pari' at ang instrumental na kahulugan ng בּוֹ, na tumutukoy sa tinidor.
- source_word: כָּכָה יַעֲשׂוּ
  choice: Ganito ang ginagawa nila
  rationale: Pinananatili ang paglipat ng Hebreo mula sa isahang kilos tungo sa maramihang buod at ang diwa ng nakagawiang gawain.
- source_word: לְכָל יִשְׂרָאֵל הַבָּאִים שָׁם בְּשִׁלֹה
  choice: sa lahat ng Israelitang pumupunta roon sa Shilo
  rationale: Natural sa Filipino ang distributibong 'lahat ng Israelita' at malinaw nitong tinutukoy ang mga sumasamba mula sa Israel na pumupunta sa Shilo.
theological_decisions:
- issue: Paglipat ng bilang sa pangungusap
  choice: Panatilihin ang isahang 'pari' sa pangunahing kilos ngunit maramihang 'nila' sa buod.
  alternative: Ipantay ang lahat sa isahan, gaya ng 'ganito ang ginagawa ng pari.'
  rationale: Sadyang lumilipat ang tekstong Hebreo mula sa isahan tungo sa maramihan. Ang pagpapanatili rito ay hindi nagpapakinis sa maaaring tumukoy sa mas malawak na gawain ng mga pari o kanilang mga lingkod.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang aspektong nagaganap o nakagawian ('isinusundot,' 'kinukuha,' 'ginagawa,' 'pumupunta') upang ipakita ang paulit-ulit na gawain. Ang 'lutuan' ay sadyang pangkalahatan dahil hindi tiyak ang anyo ng huling sisidlan.
