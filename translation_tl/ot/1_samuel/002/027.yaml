  to: 'May isang tao ng Diyos na pumunta kay Eli at nagsabi sa kanya, “Ganito ang sabi ni Yahweh: Hindi ba’t inihayag ko nga ang aking sarili sa sambahayan ng iyong ama nang sila ay nasa Ehipto, sa sambahayan ni Paraon?”'
