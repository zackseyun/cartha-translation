    issue: “isang lingkod ng Diyos” para sa אִישׁ אֱלֹהִים
    rationale: Ang “lingkod” ay hindi nakasaad sa pinagmulan at binabago ang itinatag na katawagang tumutukoy sa isang taong kinatawan ng Diyos.
  - severity: low
    issue: “malinaw kong” para sa pagpapadiin ng הֲנִגְלֹה נִגְלֵיתִי
    rationale: Ang “malinaw” ay maaaring magpahiwatig ng antas o paraan ng kaliwanagan, samantalang ang dobleng anyo sa Hebreo ay pangunahing pagpapadiin. Ang “nga” ay mas payak at mas maingat.
  - severity: medium
    issue: “sa ilalim ng sambahayan ng Paraon” para sa לְבֵית פַּרְעֹה
    rationale: Nagdaragdag ito ng partikular na relasyong pampolitika o panlipunan. Ang simpleng “sa sambahayan ni Paraon” ay hindi nagsasara sa pinagtatalunang lokatibo/asosyatibong gamit.
