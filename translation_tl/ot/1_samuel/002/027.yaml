base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/027.yaml
  text: 'And a man of God came to Eli and said to him, “Thus says the LORD: Did I indeed reveal myself to your father''s house when they were in Egypt, belonging to Pharaoh''s house?”'
translation:
  language: tl
  text: 'May isang tao ng Diyos na pumunta kay Eli at nagsabi sa kanya, “Ganito ang sabi ni Yahweh: Hindi ba’t inihayag ko nga ang aking sarili sa sambahayan ng iyong ama nang sila ay nasa Ehipto, sa sambahayan ni Paraon?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: isang lingkod ng Diyos
  rationale: Ang literal na “tao ng Diyos” ay maaaring maging alanganin sa makabagong Tagalog; ipinahahayag ng “lingkod ng Diyos” ang kinikilalang katayuan niya bilang mensahero ng Diyos nang natural at marangal.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili ang pormulang pangpropeta at isinasalin ang tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: הֲנִגְלֹה נִגְלֵיתִי
  choice: Hindi ba’t malinaw kong inihayag ang aking sarili
  rationale: Ipinahahayag ang retorikal na tanong at ang diin ng magkaugnay na infinitive at finite verb; ang “malinaw” ay kumakatawan sa Hebreong pagpapadiin nang hindi dinaragdagan ang diwa.
- source_word: בֵּית אָבִיךָ
  choice: sambahayan ng iyong ninuno
  rationale: Dito ang “bahay” ay tumutukoy sa angkan o sambahayan, at ang isahang “ama” ay tumutukoy sa ninunong pinagmulan ng angkan ni Eli.
- source_word: לְבֵית פַּרְעֹה
  choice: sa ilalim ng sambahayan ng Paraon
  rationale: Pinananatili ang ugnayan ng mga ninuno ni Eli sa sambahayan ng Paraon habang nasa Ehipto, nang hindi labis na tinutukoy kung ito ay lugar, pag-aari, o paglilingkod.
theological_decisions:
- issue: Ang anyo ng pagpapahayag ng Diyos sa angkan ni Eli
  choice: inihayag ang aking sarili
  alternative: nagpakita ako
  rationale: Ang Niphal ng גלה ay maaaring tumukoy sa pagpapakita o pagpapahayag; pinananatili ng napiling salin ang banal na sariling pagpapahayag nang hindi tinutukoy ang pisikal na anyo nito.
- issue: Ang retorikal na puwersa ng tanong
  choice: Hindi ba’t malinaw kong…?
  alternative: Talaga bang inihayag ko…?
  rationale: Sa konteksto ng mensahe ng pagsaway, ipinapalagay ng tanong ang isang positibong sagot at ipinapaalala ang dating biyaya ng Diyos; hindi ito tunay na pag-aalinlangan.
- issue: Kahulugan ng לְבֵית פַּרְעֹה
  choice: sa ilalim ng sambahayan ng Paraon
  alternative: kabilang sa sambahayan ng Paraon
  rationale: May sintaktikong kalabuan kung ang parirala ay lokatibo o nagpapahiwatig ng kaugnayan/paglilingkod. Ang “sa ilalim” ay nagpapanatili ng kaugnayan sa kapangyarihan at sambahayan ng Paraon nang hindi tahasang nagsasabing pag-aari sila nito.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Ginamit ang “sambahayan” para sa kolektibong בֵּית at “ninuno” para sa pang-angkang diwa ng אָב. Iniwasan ang sobrang literal ngunit di-natural na “tao ng Diyos,” habang pinanatili ang propetikong tono at ang retorikal na tanong.
