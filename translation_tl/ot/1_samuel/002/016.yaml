base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/016.yaml
  text: And the man would say to him[a], “Let them first burn the fat today, and then take for yourself whatever your soul desires.” But he would say to him, “No, you must give it now; and if not, I will take it by force.”
translation:
  language: tl
  text: At sasabihin ng lalaking naghahandog sa kanya, “Sunugin muna nila ngayon ang taba; pagkatapos, kunin mo para sa sarili mo ang anumang maibigan mo.” Ngunit sasabihin ng lingkod, “Hindi! Ibigay mo iyon ngayon din; kung hindi, kukunin ko iyon sa pamamagitan ng puwersa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Tiyak na sunugin nila ngayon ang taba; saka kunin mo para sa sarili mo ang anumang nais mo.” Gumagamit ang Hebreo ng mariing anyo ng pandiwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: ang lalaking naghahandog
  rationale: Ang tiyak na pangngalang panlalaki ay tumutukoy sa taong nagdadala ng handog. Nilinaw ang papel niya mula sa konteksto upang maiwasang mapagkamalan siyang lingkod.
- source_word: קַטֵּר יַקְטִירוּן
  choice: sunugin muna nila
  rationale: Ang infinitive absolute na kasunod ng imperfect ay nagbibigay-diin sa pagsunog. Ipinahahayag ng “muna” ang hinihinging wastong pagkakasunod ng mga kilos sa konteksto.
- source_word: כַּיּוֹם
  choice: ngayon
  rationale: Natural na modernong katumbas ng temporal na pananalita sa kontekstong ito.
- source_word: הַחֵלֶב
  choice: ang taba
  rationale: Tumutukoy sa mga bahaging taba ng handog na sinusunog; tuwiran at malinaw ang “taba” sa Filipino.
- source_word: וְקַח לְךָ
  choice: pagkatapos, kunin mo para sa sarili mo
  rationale: Pinananatili ang utos at ginagawang malinaw ang pagkakasunod na ipinahihiwatig ng usapan.
- source_word: כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: ang anumang maibigan mo
  rationale: Natural na Filipino para sa Hebreong idyomang literal na “ayon sa ninanasa ng iyong kaluluwa.” Hindi ginamit ang literal na “kaluluwa” dahil sa Filipino maaari itong magpahiwatig ng espirituwal na bahagi ng tao sa halip na sariling kagustuhan.
- source_word: וְאָמַר לוֹ
  choice: Ngunit sasabihin ng lingkod
  rationale: Ang anyo ay bahagi ng paglalarawan ng nakaugaliang palitan. Ang “ngunit” ay naghahayag ng pagsalungat; tinukoy ang lingkod upang luminaw ang nagpapalit na tagapagsalita.
- source_word: כִּי עַתָּה תִתֵּן
  choice: Hindi! Ibigay mo iyon ngayon din
  rationale: Ang כִּי ay may mariing/sumasalungat na puwersa rito. Ang “Hindi!” ay kontekstuwal na paglilinaw, at ang pautos ay naghahatid ng mapilit na demand.
- source_word: וְאִם לֹא
  choice: kung hindi
  rationale: Tuwirang kondisyunal na pariralang nagpapakilala sa banta.
- source_word: לָקַחְתִּי
  choice: kukunin ko iyon
  rationale: Bagaman perfect ang anyo, banta ang gamit nito at may hinaharap na puwersa sa Filipino.
- source_word: בְחָזְקָה
  choice: nang sapilitan
  rationale: Malinaw at likas na Filipino para sa pagkuha sa pamamagitan ng lakas o pamimilit.
theological_decisions:
- issue: Kaayusan ng paghahandog na ipinahihiwatig ng pagtutol ng naghahandog
  choice: Ipinakita sa salin na kailangang sunugin muna ang taba bago kumuha ng karne ang lingkod.
  alternative: Isalin nang mas literal nang hindi tahasang ipinakikita ang pagkakasunod.
  rationale: Mahalaga sa salaysay ang pagsalungat ng wastong gawaing panghandog at ng pang-aabuso ng lingkod. Nililinaw ng “muna” at “pagkatapos” ang ipinahihiwatig ng Hebreo nang hindi nagdaragdag ng paliwanag na teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lalaking naghahandog” at “lingkod” upang maging malinaw ang mga tagapagsalita. Iniwasan ang sobrang literal na “ninanais ng iyong kaluluwa,” na hindi likas sa kasalukuyang Filipino, ngunit itinabi sa salin ang diin at tensiyon ng sapilitang pagkuha.
