base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/003.yaml
  text: Do not keep speaking so very proudly; do not let arrogance come out of your mouth[a], for Yahweh is a God of knowledge, and by him actions are weighed.
translation:
  language: tl
  text: Huwag kayong patuloy na magsalita nang napakayabang; huwag lumabas sa inyong bibig ang kahambugan, sapagkat si Yahweh ay Diyos na nakaaalam, at sa pamamagitan niya ay tinitimbang ang mga gawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, kung mas mahigpit na susundin ang tekstong katinig: “at hindi tinitimbang ang mga gawa.” Sinusunod ng pangunahing teksto ang tradisyonal na pagbasa na sinusuri ni Yahweh ang mga gawa ng tao.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּרְבּוּ תְדַבְּרוּ
  choice: Huwag kayong patuloy na magsalita
  rationale: Ang רבה na sinusundan ng isa pang pandiwa ay nagpapahiwatig ng pagpapatuloy o pag-uulit ng kilos. Likas sa modernong Tagalog ang “patuloy na magsalita” at napananatili nito ang lakas ng pagbabawal.
- source_word: גְּבֹהָה גְבֹהָה
  choice: nang napakayabang
  rationale: Ang pag-uulit ay nagbibigay-diin sa mataas at palalong paraan ng pagsasalita. Ipinahahayag ng “napakayabang” ang diin at moral na diwa nang hindi pilit ang anyo sa Tagalog.
- source_word: יֵצֵא עָתָק מִפִּיכֶם
  choice: huwag lumabas sa inyong bibig ang kahambugan
  rationale: Ang עָתָק ay tumutukoy sa mapagmataas, pangahas, o palalong pananalita. Dinala sa ikalawang sugnay ang ipinahihiwatig na pagbabawal upang maging malinaw at natural sa Tagalog, habang pinananatili ang larawang lumalabas ito sa bibig.
- source_word: אֵל דֵּעוֹת יְהוָה
  choice: si Yahweh ay Diyos na nakaaalam
  rationale: Ang literal na “Diyos ng mga kaalaman” ay nagpapahiwatig ng ganap o malawak na kaalaman. Mas natural sa Tagalog ang “Diyos na nakaaalam,” nang hindi idinaragdag ang salitang “lahat,” na hindi tahasang nasa teksto.
- source_word: וְלֹא נִתְכְּנוּ עֲלִלוֹת
  choice: at sa pamamagitan niya ay tinitimbang ang mga gawa
  rationale: Sinusunod ng pangunahing teksto ang tradisyonal na pagbasa na ang mga gawa ay sinusukat o sinusuri ng Diyos. Pinananatili ng “tinitimbang” ang metapora ng Hebreo; inilalahad sa talababa ang makabuluhang pagbasa ng tekstong katinig.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ang pangalang tipan bilang “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Pagbasa sa וְלֹא נִתְכְּנוּ עֲלִלוֹת
  choice: at sa pamamagitan niya ay tinitimbang ang mga gawa
  alternative: at hindi tinitimbang ang mga gawa
  rationale: Maaaring basahin ang tekstong katinig na may לֹא bilang pagtanggi, ngunit sinusuportahan ng tradisyonal na pagbasa at ng konteksto ang diwang sinusuri ni Yahweh ang mga gawa. Hindi inaalis ang tunay na tekstuwal na tensiyon; itinatala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang pangmaramihang “kayo/inyong” ayon sa mga anyong Hebreo. Iniwasan ang sobrang literal na pag-uulit na magiging asiwa sa Tagalog, ngunit pinanatili ang diin, larawang “lumabas sa bibig,” at metapora ng pagtitimbang.
