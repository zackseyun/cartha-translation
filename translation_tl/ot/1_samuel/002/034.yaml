reference: 1 Samuel 2:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֣ הָ/א֗וֹת אֲשֶׁ֤ר יָבֹא֙ אֶל שְׁנֵ֣י בָנֶ֔י/ךָ אֶל חָפְנִ֖י וּ/פִֽינְחָ֑ס בְּ/י֥וֹם אֶחָ֖ד יָמ֥וּתוּ שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/034.yaml
  text: 'And this will be the sign to you that will come upon your two sons[b][a], Hophni and Phinehas: both of them will die on one day.'
translation:
  language: tl
  text: 'At ito ang magiging tanda para sa iyo na sasapit sa dalawa mong anak, kina Hofni at Finehas: sa iisang araw ay mamamatay silang dalawa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאוֹת
  choice: tanda
  rationale: Karaniwang tumutukoy ang אוֹת sa isang tanda na nagpapatunay sa ipinahayag na mensahe; natural at malawak ang “tanda” sa Filipino.
- source_word: אֲשֶׁר יָבֹא אֶל
  choice: na sasapit sa
  rationale: Pinananatili ng “sasapit sa” ang larawan ng pangyayaring darating sa mga anak ni Eli, habang natural itong pakinggan bilang pagdating ng kapahamakan o hatol.
- source_word: שְׁנֵי בָנֶיךָ
  choice: dalawa mong anak
  rationale: Tuwirang inilalarawan nito ang dalawang anak ni Eli at natural ang ayos sa modernong Filipino.
- source_word: אֶל חָפְנִי וּפִינְחָס
  choice: kina Hofni at Finehas
  rationale: Ang ikalawang אֶל ay nagpapakilala kung sino ang dalawang anak; likas sa Filipino ang “kina” bago ang dalawang pangalan.
- source_word: בְּיוֹם אֶחָד
  choice: sa iisang araw
  rationale: Malapit ito sa literal na “sa isang araw” ngunit malinaw na ipinahihiwatig na pareho silang mamamatay sa araw ding iyon.
- source_word: יָמוּתוּ שְׁנֵיהֶם
  choice: mamamatay silang dalawa
  rationale: Natural sa Filipino at pinananatili ang diin na kapwa mamamatay ang dalawang anak.
theological_decisions:
- issue: Kalikasan ng “tanda”
  choice: Isang nagpapatunay na tanda ng ipinahayag na hatol sa sambahayan ni Eli
  alternative: Isang hulang palatandaan lamang na walang tungkuling magpatunay
  rationale: Sa konteksto, ang pagkamatay ng dalawang anak sa iisang araw ang magpapatunay na matutupad ang salita laban sa sambahayan ni Eli. Hindi nililimitahan ng salin ang kahulugan nang higit sa salitang “tanda.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sasapit sa” upang mapanatili ang idiomatikong diwa ng pagdating ng pangyayari o hatol, at “sa iisang araw” upang malinaw ngunit hindi labis na paliwanagin ang temporal na pahayag.
