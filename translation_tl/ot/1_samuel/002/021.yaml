reference: 1 Samuel 2:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי פָקַ֤ד יְהוָה֙ אֶת חַנָּ֔ה וַ/תַּ֛הַר וַ/תֵּ֥לֶד שְׁלֹשָֽׁה בָנִ֖ים וּ/שְׁתֵּ֣י בָנ֑וֹת וַ/יִּגְדַּ֛ל הַ/נַּ֥עַר שְׁמוּאֵ֖ל עִם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/021.yaml
  text: For Yahweh visited Hannah[a], and she conceived and bore three sons and two daughters[b]. And the boy Samuel grew before Yahweh.
translation:
  language: tl
  text: Sapagkat dinalaw ni Yahweh si Hana[a], at naglihi siya at nagsilang ng tatlong anak na lalaki at dalawang anak na babae. At lumaki ang batang si Samuel na kasama ni Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “inalala ni Yahweh si Hana,” “pinagtuunan siya ng pansin,” o “inalagaan siya.” Ang pandiwang Hebreo ay maaaring tumukoy sa mapagpalang pagkilos ng Diyos para sa isang tao.
    reason: lexical_alternative
  - marker: b
    text: Literal na “kasama ni Yahweh.” Sa konteksto, maaaring ibig sabihin nito na lumaki si Samuel sa presensiya ni Yahweh sa santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o sanhi na nag-uugnay sa talata sa naunang pahayag.
- source_word: פָקַד
  choice: dinalaw
  rationale: Pinananatili ang biblikal na idyoma ng mapagpalang pagkilos ni Yahweh para kay Hana, habang ipinapaliwanag sa talababa ang saklaw ng kahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulo.
- source_word: וַתַּהַר וַתֵּלֶד
  choice: naglihi siya at nagsilang
  rationale: Likas at malinaw na salin ng magkasunod na paglilihi at panganganak.
- source_word: שְׁלֹשָׁה בָנִים וּשְׁתֵּי בָנוֹת
  choice: tatlong anak na lalaki at dalawang anak na babae
  rationale: Tuwirang ipinahahayag ang bilang at kasarian ng mga anak.
- source_word: הַנַּעַר שְׁמוּאֵל
  choice: ang batang si Samuel
  rationale: Natural na modernong Tagalog na nagpapanatili sa pagtukoy kay Samuel bilang bata.
- source_word: וַיִּגְדַּל
  choice: lumaki
  rationale: Ang konteksto ay tumutukoy sa paglaki at pag-unlad ni Samuel.
- source_word: עִם יְהוָה
  choice: na kasama ni Yahweh
  rationale: Pinananatili ang literal at tunay na malabong diwa ng עִם, ‘kasama,’ sa halip na tahimik itong gawing ‘sa harapan’ o ‘sa presensiya’; nililinaw sa talababa ang posibleng kontekstong santuwaryo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa Hebreo; pinananatili ito bilang Yahweh nang hindi pinapalitan ng isang titulo.
- issue: Diwa ng עִם יְהוָה sa paglaki ni Samuel
  choice: kasama ni Yahweh
  alternative: sa presensiya ni Yahweh / sa harapan ni Yahweh
  rationale: Ang Hebreo ay literal na ‘kasama ni Yahweh.’ Maaaring tumukoy ito sa paglaki ni Samuel sa santuwaryo sa presensiya ni Yahweh, ngunit hindi ito dapat lubusang ipasya sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang “dinalaw” upang mapanatili ang biblikal na idyoma, at ang “kasama ni Yahweh” upang hindi alisin ang tunay na kalabuan ng pariralang Hebreo.
