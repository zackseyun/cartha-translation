  source_fidelity: Tumpak ang retorikal na tanong, ang pagpili mula sa mga lipi ng Israel, ang tungkuling makapari, ang pag-akyat sa altar, pagsusunog ng insenso, at pagsusuot ng epod. Gayunman, ang “pinaraan sa apoy” ay hindi ang pinakamalinaw na paglalarawan ng אִשֵּׁי at maaari pang magpahiwatig ng ibang ritwal. Mas tumpak ang “inihahandog sa pamamagitan ng apoy.”
  naturalness: Marangal at likas sa modernong Filipino ang kabuuang salin. Ang rebisyon sa huling parirala ay higit na malinaw at maiiwasan ang hindi sinasadyang konotasyon ng “pinaraan sa apoy.”
