base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/028.yaml
  text: And did I not choose him from all the tribes of Israel to be my priest[a], to go up to my altar, to burn incense, to wear an ephod before me? And I gave to your father's house all the food offerings of the sons of Israel.
translation:
  language: tl
  text: At hindi ba’t pinili ko siya mula sa lahat ng lipi ng Israel upang maging pari ko, umakyat sa aking altar, magsunog ng insenso, at magsuot ng epod sa harapan ko? At ibinigay ko sa sambahayan ng iyong ama ang lahat ng handog na inihahandog sa pamamagitan ng apoy[a] ng mga anak ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lahat ng handog na pagkain.” Ang salitang Hebreo ay tumutukoy sa mga handog na inihahandog sa altar sa pamamagitan ng apoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָחֹר אֹתוֹ
  choice: At hindi ba’t pinili ko siya
  rationale: Ang anyong infinitive at ang nagpapatuloy na tanong mula sa naunang talata ay may lakas ng retorikal na tanong. Likas itong naipahahayag sa Tagalog bilang “hindi ba’t pinili ko siya.”
- source_word: מִכָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: mula sa lahat ng lipi ng Israel
  rationale: Pinananatili nito ang diwang pumili mula sa kabuuan ng mga lipi.
- source_word: לִי לְכֹהֵן
  choice: upang maging pari ko
  rationale: Ipinahahayag ang layunin ng pagpili at ang kaugnayan ng pari sa Diyos nang maikli at natural.
- source_word: לַעֲלוֹת עַל מִזְבְּחִי
  choice: umakyat sa aking altar
  rationale: Pinananatili ang kongkretong pandiwang עלה, “umakyat,” nang hindi ito agad ipinapakahulugang paghahandog.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: magsunog ng insenso
  rationale: Karaniwan at malinaw na katawagan sa ritwal na pagpapausok ng insenso.
- source_word: לָשֵׂאת אֵפוֹד לְפָנַי
  choice: magsuot ng epod sa harapan ko
  rationale: Bagaman literal na “dalhin/pasanin,” sa tungkuling makapari ay tumutukoy ito sa pagsusuot ng epod. Ang “epod” ay transliterasyon ng natatanging kasuotang panrelihiyon.
- source_word: לְבֵית אָבִיךָ
  choice: sa sambahayan ng iyong ama
  rationale: Ang “sambahayan” ay natural na tumutukoy sa angkan o linya ng ninuno, hindi lamang sa gusali.
- source_word: אֶת כָּל אִשֵּׁי בְּנֵי יִשְׂרָאֵל
  choice: ang lahat ng handog na pinaraan sa apoy ng mga anak ni Israel
  rationale: Malawak ang saklaw ng אִשֵּׁי at hindi lamang ito tumutukoy sa handog na sinusunog nang buo. Pinananatili ng salin ang kaugnayan nito sa apoy at ang pormal na pambansang katawagang “mga anak ni Israel.”
theological_decisions:
- issue: Saklaw ng katawagang pansakripisyo na אִשֵּׁי
  choice: mga handog na pinaraan sa apoy
  alternative: mga handog na pagkain
  rationale: Ang pangunahing salin ay lantad na nagpapanatili sa elementong apoy at hindi nagpapaliit sa saklaw nito tungo lamang sa handog na sinusunog nang buo. Itinatala sa talababa ang alternatibong “mga handog na pagkain,” na nagpapakita sa mga handog bilang pagkaing inihahain sa altar.
- issue: Kahulugan ng לָשֵׂאת אֵפוֹד sa kontekstong makapari
  choice: magsuot ng epod
  alternative: magdala ng epod
  rationale: Maaaring literal na mangahulugan ang pandiwa ng pagdadala o pagpasan, ngunit sa kontekstong ito ang epod ay kasuotang ginagamit ng pari. Ang “magsuot” ang mas natural at malamang na kahulugan nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pari,” “altar,” at “insenso” bilang mga karaniwang terminong biblikal; pinanatili ang “epod” bilang teknikal na katawagan. Inilagay ang panandang [a] sa mismong katawagang pansakripisyo na ipinaliliwanag nito.
