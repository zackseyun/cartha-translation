revisions:
- from: 'Kaya nga, ipinahayag ni Yahweh, ang Diyos ng Israel: “Talagang sinabi ko na ang sambahayan mo at ang sambahayan ng iyong ninuno ay lalakad sa harapan ko magpakailanman.” Ngunit ngayon, ipinahayag ni Yahweh: “Hinding-hindi ko na pahihintulutan iyon! Sapagkat pararangalan ko ang mga nagpaparangal sa akin, ngunit ang mga humahamak sa akin ay ituturing na walang halaga.”[a]'
  to: 'Kaya nga, ipinahayag ni Yahweh, ang Diyos ng Israel: “Talagang sinabi ko na ang sambahayan mo at ang sambahayan ng iyong ama ay lalakad sa harapan ko magpakailanman.” Ngunit ngayon, ipinahayag ni Yahweh: “Malayong mangyari sa akin! Sapagkat pararangalan ko ang mga nagpaparangal sa akin, ngunit ang mga humahamak sa akin ay ituturing na walang halaga.”[a]'
  rationale: Pinalitan ang nagpapaliwanag na salin ng mariing pormula ng pagtanggi ng mas malapit at likas na Filipino; ibinalik ang tiyak na “ama”; at itinuwid ang alternatibong talababa upang maipakita ang diwang “maging magaan/hamak” nang walang pagbabago ng tinig o kahulugan.
