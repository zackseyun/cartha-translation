base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/030.yaml
  text: 'Therefore[a], declares Yahweh, the God of Israel: I indeed said that your house and your father’s house would walk before me forever. But now, declares Yahweh: far be it from me! For those who honor me I will honor, but those who despise me will be lightly esteemed.'
translation:
  language: tl
  text: 'Kaya nga, ipinahayag ni Yahweh, ang Diyos ng Israel: “Talagang sinabi ko na ang sambahayan mo at ang sambahayan ng iyong ama ay lalakad sa harapan ko magpakailanman.” Ngunit ngayon, ipinahayag ni Yahweh: “Malayong mangyari sa akin! Sapagkat pararangalan ko ang mga nagpaparangal sa akin, ngunit ang mga humahamak sa akin ay ituturing na walang halaga.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ituturing na hamak” o “ituturing na di-mahalaga.” Ang pandiwang Hebreo ay may diwang pagiging magaan, hamak, o kakaunti ang halaga, bilang kabaligtaran ng “pararangalan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya nga
  rationale: Likas na makabagong Tagalog para sa pangangatwirang naglalagom at humahatol batay sa naunang paratang.
- source_word: נְאֻם יְהוָה
  choice: ipinahayag ni Yahweh
  rationale: Dignified at malinaw na salin ng pormulang propetiko; pinananatili ang pangalang Yahweh.
- source_word: אָמֹר אָמַרְתִּי
  choice: Talagang sinabi ko
  rationale: Ipinapakita ang diin ng infinitive absolute at finite verb nang hindi nagiging matigas o lipas ang Tagalog.
- source_word: בֵּיתְךָ וּבֵית אָבִיךָ
  choice: ang sambahayan mo at ang sambahayan ng iyong ninuno
  rationale: Ipinahahayag ang pampamilya at dinastikong diwa ng ‘bahay’ habang pinananatili ang pag-uulit sa Hebreo.
- source_word: יִתְהַלְּכוּ לְפָנַי
  choice: lalakad sa harapan ko
  rationale: Pinananatili ang malawak na idyomang tipan tungkol sa patuloy na pamumuhay o paglilingkod sa presensya ng Diyos, sa halip na limitahan ito sa gawaing pari.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Tuwirang salin ng pangmatagalang pananalita; hindi paunang nilulutas ang tensiyon sa kasunod na pagbawi.
- source_word: חָלִילָה לִּי
  choice: Hinding-hindi ko na pahihintulutan iyon!
  rationale: Natural na matinding pagtanggi sa Tagalog na malinaw na tumutukoy sa pagpapatuloy ng naunang pribilehiyo.
- source_word: מְכַבְּדַי אֲכַבֵּד
  choice: pararangalan ko ang mga nagpaparangal sa akin
  rationale: Pinananatili ang pag-uulit at pagsasalungatan ng ugat na כבד, gamit ang natural na ayos sa Tagalog.
- source_word: וּבֹזַי יֵקָלּוּ
  choice: ang mga humahamak sa akin ay ituturing na walang halaga
  rationale: Inilalahad ang paghamak ng בזה at ang pagiging magaan, hamak, o walang kabuluhan ng קלל bilang tuwirang kaibahan ng pagpaparangal.
theological_decisions:
- issue: Kalikasan ng naunang pangako sa sambahayan ni Eli
  choice: Inilalarawan ito bilang tunay na naunang pahayag ng Diyos na ngayo’y tahasang hindi na pahihintulutang magpatuloy dahil sa kawalang-katapatan.
  alternative: Ituring agad ang “magpakailanman” bilang pagmamalabis, o palambutin ang kasunod bilang simpleng pagbawas lamang ng pribilehiyo.
  rationale: Ang mismong talata ay mariing pinagtatapat ang naunang pahayag at ang kasalukuyang pagtanggi. Pinananatili ng salin ang teolohikal na tensiyon nang hindi ito nilulutas sa pamamagitan ng sistematikong palagay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” upang maipahiwatig ang pamilya o angkan, at pinanatili ang “lalakad sa harapan ko” upang hindi paliitin ang sadyang malawak na idyomang Hebreo.
