id: 1SA.2.18
reference: 1 Samuel 2:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/שְׁמוּאֵ֕ל מְשָׁרֵ֖ת אֶת פְּנֵ֣י יְהוָ֑ה נַ֕עַר חָג֖וּר אֵפ֥וֹד בָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/018.yaml
  text: Samuel was ministering before Yahweh[a], a boy clothed with a linen ephod.
translation:
  language: tl
  text: Si Samuel ay naglilingkod sa harap ni Yahweh[a]. Bata pa siya at nakasuot ng efod na lino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “sa harap ng mukha/presensiya ni Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמוּאֵל
  choice: Si Samuel
  rationale: Pinanatili ang pangalang Samuel sa karaniwang anyong Filipino. Hindi tahasang isinalin ang pang-ugnay na ו dahil likas na naipahihiwatig ng pagkakasunod ng salaysay ang koneksiyon nito sa naunang talata.
- source_word: מְשָׁרֵת
  choice: ay naglilingkod
  rationale: Ang participle ay nagpapahayag ng nagpapatuloy na gawain. Ang “naglilingkod” ay natural sa Filipino at angkop sa paglilingkod na may kaugnayan sa santuwaryo.
- source_word: אֶת פְּנֵי יְהוָה
  choice: sa harap ni Yahweh[a]
  rationale: Pinananatili nito ang karaniwang Hebreong idyoma ng paglilingkod sa harap o presensiya ng Diyos, nang hindi nililinaw nang higit sa isinasaad ng teksto.
- source_word: נַעַר
  choice: Bata pa siya
  rationale: Ipinakikita nito na bata pa si Samuel nang hindi idinaragdag na siya ay isang lingkod, sapagkat naipahayag na iyon ng pandiwang “naglilingkod.” Hiniwalay sa ikalawang pangungusap upang maging malinaw at natural sa modernong Filipino.
- source_word: חָגוּר
  choice: nakasuot
  rationale: Bagaman literal na “nabibigkisan,” malinaw at likas na ipinahahayag ng “nakasuot” ang kalagayan ni Samuel kaugnay ng kasuotang binanggit.
- source_word: אֵפוֹד
  choice: efod
  rationale: Isinalin sa baybay-Filipinong transliterasyon sapagkat isa itong natatanging kasuotang ginagamit sa pagsamba ng Israel at walang ganap na katumbas sa Filipino.
- source_word: בָּד
  choice: lino
  rationale: Tuwirang tumutukoy sa materyal na lino; hindi idinagdag ang di-tahasang katangiang “pino.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng paglilingkod “sa harap” ng Diyos
  choice: sa harap ni Yahweh
  alternative: sa presensiya ni Yahweh
  rationale: Pinananatili ang konkreto at tradisyonal na idyoma ng Hebreo. Ipinaliliwanag ng talababa ang posibleng kahulugang “sa presensiya” nang hindi pinipili lamang ang isang pagbasa sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginawang dalawang maikling pangungusap ang Hebreong sugnay at apposition upang maiwasan ang alanganing pagkakabit sa Filipino, habang pinananatili ang lahat ng impormasyong nasa pinagmulan. Ginamit ang “efod” bilang teknikal na terminong transliterado.
