  text: וְ/הָיָ֗ה כָּל הַ/נּוֹתָר֙ בְּ/בֵ֣יתְ/ךָ֔ יָבוֹא֙ לְ/הִשְׁתַּחֲוֺ֣ת ל֔/וֹ לַ/אֲג֥וֹרַת כֶּ֖סֶף וְ/כִכַּר לָ֑חֶם וְ/אָמַ֗ר סְפָחֵ֥/נִי נָ֛א אֶל אַחַ֥ת הַ/כְּהֻנּ֖וֹת לֶ/אֱכֹ֥ל פַּת לָֽחֶם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/036.yaml
  text: And everyone left in your house will come to bow down to him for a piece of silver and a loaf of bread[a], and will say, ‘Please attach me to one of the priestly offices[b], so that I may eat a morsel of bread.’
translation:
  language: tl
  text: At ang bawat isa na matitira sa iyong sambahayan ay lalapit upang yumukod sa kanya para sa isang maliit na piraso ng pilak[a] at isang tinapay. At sasabihin, ‘Pakiusap, isama mo ako sa isa sa mga tungkuling makapari[b], upang makakain ako ng kapirasong tinapay.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang maliit na salaping pilak”; ang salitang Hebreo ay tumutukoy sa maliit na yunit ng pilak.
    reason: lexical_alternative
  - marker: b
    text: O “sa isa sa mga paglilingkod ng pari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר
  choice: matitira
  rationale: Ipinahihiwatig ng anyong participle ang sinumang mananatili mula sa sambahayan ni Eli pagkatapos ng hatol; likas at malinaw sa Filipino ang “matitira.”
- source_word: בְּבֵיתְךָ
  choice: sa iyong sambahayan
  rationale: Ang בַּיִת dito ay tumutukoy sa pamilya o angkan ni Eli, hindi lamang sa gusali; kaya mas malinaw ang “sambahayan.”
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: upang yumukod sa kanya
  rationale: Pinananatili nito ang pisikal na kilos at ang diwa ng pagpapakumbaba o pagsusumamo, nang hindi tinutukoy kung sino ang tinutukoy ng panghalip.
- source_word: לַאֲגֹרַת כֶּסֶף
  choice: kapalit ng isang maliit na piraso ng pilak
  rationale: Ang אֲגוֹרָה ay isang maliit na yunit o piraso ng pilak; iniiwasan ng salin ang hindi tiyak na modernong denominasyon.
- source_word: וְכִכַּר לָחֶם
  choice: at isang bilog na tinapay
  rationale: Sa kontekstong ito, ang כִּכָּר ay tumutukoy sa isang bilog na tinapay; pinananatili ang konkretong larawan ng Hebreo.
- source_word: סְפָחֵנִי נָא
  choice: Isama mo sana ako
  rationale: Ang ספח ay may diwang ikabit o isama sa isang pangkat o gawain, at ang נָא ay magalang na pakiusap; natural sa modernong Filipino ang pariralang ito.
- source_word: אַחַת הַכְּהֻנּוֹת
  choice: sa isa sa mga tungkuling makapari
  rationale: Maaaring tumukoy ang pambihirang maramihang anyo sa mga katungkulan o gawain ng mga pari; hindi nito ipinapalagay na maraming magkakaibang pagkapari.
- source_word: לֶאֱכֹל פַּת לָחֶם
  choice: upang makakain ako ng kapirasong tinapay
  rationale: Ang פַּת ay isang piraso o subo; ipinakikita ng “kapirasong tinapay” ang abang pagsusumamo para sa pagkain.
theological_decisions:
- issue: Ang tinutukoy ng panghalip sa לְהִשְׁתַּחֲוֺת לוֹ
  choice: Pinanatili ang panlalaking isahan na “sa kanya” nang hindi pinapangalanan ang tinutukoy.
  alternative: Maaaring ipaliwanag na ito ang paring may kapangyarihan sa panahong iyon o ang tapat na paring binanggit sa naunang talata.
  rationale: Hindi tahasang pinapangalanan ng tekstong Hebreo ang reperente. Ang pagpapanatili sa panghalip ay nag-iingat sa tunay na kalabuan at sa tema ng pagbabaligtad ng kalagayan ng angkan ni Eli.
- issue: Kahulugan ng אַחַת הַכְּהֻנּוֹת
  choice: “isa sa mga tungkuling makapari”
  alternative: “isa sa mga paglilingkod ng pari” o mas literal na “isa sa mga pagkapari”
  rationale: Iniiwasan ng salin ang teolohikal na pagpapalagay na may maraming hiwalay na pagkapari, habang kinikilala sa talababa na maaaring tungkulin o uri ng paglilingkod ang tinutukoy.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sambahayan” para sa angkan ni Eli, “makapari” para sa tungkuling kaugnay ng mga pari, at likas na pakiusap na “sana.” Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
