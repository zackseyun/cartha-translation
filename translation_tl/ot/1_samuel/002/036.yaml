revisions:
- from: At ang bawat matitira sa iyong sambahayan ay lalapit upang yumukod sa kanya kapalit ng isang maliit na piraso ng pilak[a] at isang bilog na tinapay. Sasabihin niya, ‘Isama mo sana ako sa isa sa mga tungkuling makapari[b] upang makakain ako ng kapirasong tinapay.’”
  to: At ang bawat isa na matitira sa iyong sambahayan ay lalapit upang yumukod sa kanya para sa isang maliit na piraso ng pilak[a] at isang tinapay. At sasabihin, ‘Pakiusap, isama mo ako sa isa sa mga tungkuling makapari[b], upang makakain ako ng kapirasong tinapay.’
  rationale: Inayos ang kolektibong sintaks, ginawang mas natural ang paglalarawan sa tinapay, pinalinaw ang pakiusap na may “Pakiusap,” at inalis ang sobrang panipi. Hindi binago ang kalabuan tungkol sa taong tinutukoy ng “sa kanya,” ni ang kahulugang ang natitirang angkan ay nagsusumamo para sa kabuhayan sa isang tungkuling makapari.
