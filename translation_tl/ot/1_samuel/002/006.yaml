  text: יְהוָ֖ה מֵמִ֣ית וּ/מְחַיֶּ֑ה מוֹרִ֥יד שְׁא֖וֹל וַ/יָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/006.yaml
  text: Yahweh puts to death and makes alive[a]; he brings down to Sheol and raises up.
translation:
  language: tl
  text: Si Yahweh ang pumapatay at bumubuhay; ibinababa niya sa Sheol[a] at itinataas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “libingan” o “daigdig ng mga patay.” Ang “Sheol” ay tumutukoy sa kinaroroonan ng mga patay at hindi dapat awtomatikong ipakahulugang “impiyerno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa anyong “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: מֵמִית
  choice: ang pumapatay
  rationale: Ang Hiphil ng מות ay may tahasang sanhi o aktibong ahensiya. Likas at tuwiran sa Filipino ang “pumapatay,” at kaagapay ito ng “bumubuhay.”
- source_word: וּמְחַיֶּה
  choice: at bumubuhay
  rationale: Ipinahahayag ng anyong pandiwa ang pagbibigay o pagpapanumbalik ng buhay. Pinananatili ng “bumubuhay” ang malawak na saklaw nito nang hindi awtomatikong nililimitahan sa pisikal na muling pagkabuhay.
- source_word: מוֹרִיד
  choice: ibinababa niya
  rationale: Pinananatili ng pandiwang sanhi ang aktibong pagkilos ni Yahweh at ang patulang pagkakatapat nito sa “itinataas.”
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Pinanatili ang terminong Hebreo upang hindi ito awtomatikong ipakahulugang “impiyerno” o paliitin sa pisikal na libingan lamang.
- source_word: וַיָּעַל
  choice: at itinataas
  rationale: Likas itong katapat ng “ibinababa” at pinananatili ang malawak na patulang diwa nang hindi dinaragdagan ng tahasang pananalitang “muling binubuhay.”
theological_decisions:
- issue: Kung gagamit ng tahasang pananalita tungkol sa pisikal na muling pagkabuhay
  choice: Panatilihin ang mas malawak na “bumubuhay” at “itinataas.”
  alternative: Isalin bilang “muling binubuhay” o “ibinabangon mula sa mga patay.”
  rationale: Ipinapahayag ng talata ang kapangyarihan ni Yahweh sa buhay, kamatayan, at Sheol, ngunit hindi espesipikong tinutukoy ng mga salitang Hebreo ang pisikal na muling pagkabuhay. Pinananatili ng salin ang patulang lawak at teolohikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang balanseng patulang pares na “pumapatay at bumubuhay” at “ibinababa ... at itinataas.”
