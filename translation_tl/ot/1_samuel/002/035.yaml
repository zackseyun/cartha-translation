  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/הֲקִימֹתִ֥י לִ/י֙ כֹּהֵ֣ן נֶאֱמָ֔ן כַּ/אֲשֶׁ֛ר בִּ/לְבָבִ֥/י וּ/בְ/נַפְשִׁ֖/י יַעֲשֶׂ֑ה וּ/בָנִ֤יתִי ל/וֹ֙ בַּ֣יִת נֶאֱמָ֔ן וְ/הִתְהַלֵּ֥ךְ לִ/פְנֵֽי מְשִׁיחִ֖/י כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/035.yaml
  text: And I will raise up for myself a faithful priest[a], who will do according to what is in my heart and in my soul. And I will build for him a faithful house[b], and he will walk before my anointed all the days.
translation:
  language: tl
  text: At magbabangon ako para sa aking sarili ng isang tapat na pari[a], na gagawa ayon sa nasa puso ko at nasa kalooban ko. Magtatayo ako para sa kanya ng isang matatag na sambahayan[b], at lalakad siya sa harap ng aking pinahiran[c] sa lahat ng araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tapat” ay maaari ring mangahulugang “mapagkakatiwalaan.”
    reason: lexical_alternative
  - marker: b
    text: O “isang pangmatagalang angkan”—isang sambahayan o linya na mananatili.
    reason: lexical_alternative
  - marker: c
    text: Ang “aking pinahiran” ay maaari ring isaling “aking Mesiyas” o, ayon sa konteksto, “aking hari.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲקִימֹתִי
  choice: magbabangon ako
  rationale: Pinananatili nito ang larawan ng pagpapabangon sa isang tao upang humawak ng tungkulin, nang hindi nililimitahan ang diwa sa simpleng paghirang.
- source_word: לִי
  choice: para sa aking sarili
  rationale: 'Ipinakikita ang diin ng unang panauhang datibo: ang Diyos mismo ang nagtatatag ng pari para sa kanyang layunin at paglilingkod.'
- source_word: כֹּהֵן נֶאֱמָן
  choice: isang tapat na pari
  rationale: Ang נֶאֱמָן ay nagpapahiwatig ng pagiging mapagkakatiwalaan at matapat sa tungkulin; natural at tuwiran itong naihahayag ng “tapat.”
- source_word: כַּאֲשֶׁר בִּלְבָבִי וּבְנַפְשִׁי
  choice: ayon sa nasa puso ko at nasa kalooban ko
  rationale: Pinananatili ang “puso,” samantalang ang נֶפֶשׁ sa pares na ito ay isinaling “kalooban” upang natural na maipahayag sa Filipino ang matinding personal na hangarin ng Diyos nang hindi magmukhang tumutukoy lamang sa isang hiwalay na sangkap na “kaluluwa.”
- source_word: וּבָנִיתִי לוֹ בַּיִת נֶאֱמָן
  choice: Magtatayo ako para sa kanya ng isang matatag na sambahayan
  rationale: Pinananatili ng “magtatayo” ang metapora ng בניתי. Sa konteksto, ang בַּיִת ay sambahayan o angkan, at ang נֶאֱמָן ay maaaring tumukoy sa katiyakan at pananatili nito.
- source_word: וְהִתְהַלֵּךְ לִפְנֵי
  choice: lagi siyang maglilingkod sa harapan
  rationale: Ang hitpael ng הלך ay literal na “lalakad,” ngunit dito ay tumutukoy sa patuloy na pagkilos o paglilingkod sa harapan ng pinahiran; “maglilingkod” ang mas likas at malinaw sa kasalukuyang Filipino.
- source_word: מְשִׁיחִי
  choice: aking pinahiran
  rationale: Pinananatili ang pangunahing lexical na diwa ng מָשִׁיחַ at ang pagiging bukas ng reperente, sa halip na agad itong gawing teknikal na titulong “Mesiyas” o paliiting “hari.”
- source_word: כָּל הַיָּמִים
  choice: lagi
  rationale: Likas na katumbas sa Filipino ng idiomang “lahat ng mga araw,” na nagpapahayag ng patuloy o panghabambuhay na paglilingkod.
theological_decisions:
- issue: Reperente ng מְשִׁיחִי (“aking pinahiran”)
  choice: aking pinahiran
  alternative: aking Mesiyas; aking hari
  rationale: Maaaring tumukoy ang salita sa pinahirang tagapamahala sa makasaysayang konteksto at maaari ring magkaroon ng mas malawak na mesiyanikong kabuluhan. Hindi nilulutas ng salin ang tensiyong ito sa pangunahing teksto.
- issue: Kahulugan ng “bahay” sa pangako sa pari
  choice: sambahayan
  alternative: bahay; angkan
  rationale: Sa konteksto, malamang na tumutukoy ito sa isang nagpapatuloy na pamilya o linya ng mga pari, hindi lamang sa isang gusali. Pinananatili ng “sambahayan” ang metaporikal at dinastikong saklaw.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kalooban” sa halip na literal na “kaluluwa” upang maging likas ang tambalang idyoma, at “maglilingkod” sa halip na literal na “lalakad” upang malinaw ang kontekstuwal na diwa. Lahat ng talababa ay may katumbas na marker sa pangunahing teksto.
