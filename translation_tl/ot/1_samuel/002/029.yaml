id: 1SA.2.29
reference: 1 Samuel 2:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לָ֣/מָּה תִבְעֲט֗וּ בְּ/זִבְחִ/י֙ וּ/בְ/מִנְחָתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי מָע֑וֹן וַ/תְּכַבֵּ֤ד אֶת בָּנֶ֨י/ךָ֙ מִמֶּ֔/נִּי לְ/הַבְרִֽיאֲ/כֶ֗ם מֵ/רֵאשִׁ֛ית כָּל מִנְחַ֥ת יִשְׂרָאֵ֖ל לְ/עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/029.yaml
  text: Why do you scorn my sacrifice and my offering[a], which I commanded for the dwelling, and honor your sons above me, fattening yourselves from the first of every offering of Israel[c][b], my people?
translation:
  language: tl
  text: Bakit ninyo hinahamak[a] ang aking hain at ang aking handog, na iniutos ko para sa tahanan[b], at higit mong pinararangalan ang iyong mga anak kaysa sa akin, habang nagpapakataba kayo mula sa unang bahagi[c] ng bawat handog ng Israel, na aking bayan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sinisipa.” Matingkad itong larawan ng paghamak o pagtrato nang walang paggalang.
    reason: lexical_alternative
  - marker: b
    text: Mahirap ang maikling pariralang Hebreo. Maaari ring isalin, “na iniutos ko sa tahanan” o “na iniutos ko sa dakong tahanan.” Malamang na ang santuwaryo, ang tahanang dako ng Diyos, ang tinutukoy.
    reason: alternative_reading
  - marker: c
    text: O “sa pinakamainam na bahagi.” Ang salitang Hebreo ay maaaring tumukoy sa unang bahagi at, kaugnay nito, sa pangunahing o pinakapiling bahagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִבְעֲטוּ
  choice: hinahamak
  rationale: Ipinahahayag nito ang mapanghamak na pagtanggi na ipinahihiwatig ng literal at matingkad na larawang 'sinisipa,' nang hindi nagiging pilit sa Tagalog.
- source_word: זִבְחִי
  choice: aking handog na hayop
  rationale: Tinutukoy ng זֶבַח ang handog na kinakatay; malinaw sa karaniwang mambabasa ang 'handog na hayop' at naihihiwalay ito sa kasunod na מִנְחָה.
- source_word: מִנְחָתִי
  choice: aking handog
  rationale: Maaaring tumukoy ang מִנְחָה sa handog na butil o sa handog sa mas malawak na diwa; pinananatili ng pangkalahatang 'handog' ang saklaw na maaaring taglay nito rito.
- source_word: אֲשֶׁר צִוִּיתִי מָעוֹן
  choice: na iniutos ko para sa tahanan
  rationale: Malapit ito sa masinsing Hebreo at hindi nagdaragdag ng tahasang panghalip na paari; ang talababa ang nagpapaliwanag na malamang na santuwaryo o tahanang dako ng Diyos ang tinutukoy at na mahirap ang ugnayang sintaktiko.
- source_word: וַתְּכַבֵּד ... מִמֶּנִּי
  choice: higit mong pinararangalan ... kaysa sa akin
  rationale: 'Natural nitong inilalahad sa Tagalog ang paghahambing: binigyan ni Eli ng higit na karangalan ang kanyang mga anak kaysa sa Diyos.'
- source_word: לְהַבְרִיאֲכֶם
  choice: nagpapakataba kayo
  rationale: Pinananatili nito ang kongkreto at mapanumbat na larawan ng pagpapabusog at pagpapayaman sa sarili mula sa mga handog.
- source_word: מֵרֵאשִׁית
  choice: sa mga unang bahagi
  rationale: Pinananatili ang pangunahing kahulugang 'una' habang hindi isinasara ang posibleng diwang 'pinakamainam'; nakasaad ang alternatibo sa talababa.
- source_word: כָּל מִנְחַת יִשְׂרָאֵל לְעַמִּי
  choice: bawat handog ng Israel, na aking bayan
  rationale: Malinaw na iniuugnay ang Israel bilang bayan ng Diyos at pinananatiling malawak ang posibleng kahulugan ng מִנְחָה.
theological_decisions:
- issue: Paglipat mula sa pangmaramihang pagsaway tungo sa tuwirang pananagutan ni Eli
  choice: Pinanatili ang pangmaramihang 'ninyo' at 'kayo,' ngunit ginamit ang pang-isahang 'mong' at 'iyong' sa paratang tungkol sa pagpaparangal sa mga anak.
  alternative: Gawing pang-isahan o pangmaramihan ang buong talata para maging pantay ang anyo.
  rationale: 'Pangmaramihan ang תִבְעֲטוּ at hulaping לְהַבְרִיאֲכֶם, samantalang pang-isahan ang וַתְּכַבֵּד at בָּנֶיךָ. Mahalaga ang pagbabagong ito: malawak ang pagsaway ngunit personal na itinuturo ang pananagutan ni Eli.'
- issue: Kahulugan ng מֵרֵאשִׁית sa mga handog
  choice: mga unang bahagi
  alternative: pinakamainam na bahagi
  rationale: Maaaring mangahulugan ang salita ng una, pangunahing bahagi, o pinakamainam. Pinananatili sa teksto ang mas literal na diwa at inilalagay sa talababa ang posibleng kwalitatibong kahulugan.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang matinding tono ng pagsaway, ang kongkretong larawang 'nagpapakataba,' at ang sinadyang paglipat ng Hebreo mula pangmaramihan tungo sa pang-isahan at pabalik sa pangmaramihan. Lahat ng marker [a], [b], at [c] ay nakalagay sa pangunahing teksto.
