revisions:
- from: Bakit ninyo hinahamak[a] ang aking handog na hayop at ang aking handog, na iniutos ko para sa tahanan[b]? Bakit higit mong pinararangalan ang iyong mga anak kaysa sa akin, at nagpapakataba kayo sa mga unang bahagi[c] ng bawat handog ng Israel, na aking bayan?
  to: Bakit ninyo hinahamak[a] ang aking hain at ang aking handog, na iniutos ko para sa tahanan[b], at higit mong pinararangalan ang iyong mga anak kaysa sa akin, habang nagpapakataba kayo mula sa unang bahagi[c] ng bawat handog ng Israel, na aking bayan?
  rationale: Pinag-isa ang tanong upang tumugma sa iisang pambungad na לָמָּה, pinalitan ang hindi gaanong natural na "handog na hayop" ng "hain," at inayos ang pariralang "mula sa unang bahagi." Napanatili ang plural–singular–plural na pagbabago ng pinagmulan, ang di-tiyak na ugnay ng "tahanan," at lahat ng umiiral na talababa at anchor.
