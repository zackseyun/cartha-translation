translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “umaahon” upang mapanatili ang wika ng taunang paglalakbay paakyat sa santuwaryo. Ang ayos ng mga pananda sa teksto ay tumutugma sa pagkakasunod ng mga salitang nililinaw.
