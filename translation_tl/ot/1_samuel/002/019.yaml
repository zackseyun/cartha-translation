base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/019.yaml
  text: And his mother would make for him a small robe and bring it up to him from year to year[b][a], when she went up with her husband to offer the yearly sacrifice.
translation:
  language: tl
  text: Ang kanyang ina ay karaniwang gumagawa para sa kanya ng isang maliit na balabal[a] at dinadala ito sa kanya taon-taon[b], kapag umaakyat siya kasama ng kanyang asawa upang maghandog ng taunang hain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “maliit na roba” o “munting manto.” Ang Hebreong מְעִיל ay tumutukoy sa isang panlabas na kasuotan; ang “balabal” ay angkop sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa mga araw tungo sa mga araw,” isang idyomang nangangahulugang “taon-taon” o “bawat taon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעִיל
  choice: balabal
  rationale: Tumutukoy ito sa panlabas na kasuotan. Ang “balabal” ay natural sa makabagong Filipino at hindi kasing-arkaiko ng “manto,” bagaman maaaring tumukoy rito bilang kasuotang gaya ng bata o maikling roba sa kontekstong pansantuwaryo.
- source_word: קָטֹן
  choice: maliit
  rationale: Tuwirang inilalarawan ang kasuotang angkop sa laki ng isang bata.
- source_word: תַּעֲשֶׂה
  choice: gumagawa
  rationale: Ang imperfect sa salaysay ay nagsasaad dito ng nakagawiang kilos sa nakaraan; malinaw itong naihahatid ng pangkasalukuyang anyong ginagamit para sa paulit-ulit na gawa sa Filipino.
- source_word: וְהַעַלְתָה לּוֹ
  choice: at dinadala iyon sa kanya
  rationale: Ipinapahayag ang pagdadala ng kasuotan kay Samuel; ang kasunod na “umaahon” ay nagpapanatili sa heograpikal at panrelihiyong diwa ng pag-akyat sa santuwaryo nang hindi inuulit nang alanganin ang “paakyat.”
- source_word: מִיָּמִים יָמִימָה
  choice: taon-taon
  rationale: Idyomang Hebreo ito para sa regular na taunang pag-uulit, hindi literal na “mula sa mga araw tungo sa mga araw.”
- source_word: בַּעֲלוֹתָהּ
  choice: kapag umaahon siya
  rationale: Pinananatili ang wika ng pag-akyat sa santuwaryo at ang paulit-ulit na taunang gawain.
- source_word: אִישָׁהּ
  choice: kanyang asawa
  rationale: Sa relasyunal na kontekstong ito, ang ibig sabihin ay ang asawa niyang lalaki.
- source_word: לִזְבֹּחַ
  choice: upang maghandog
  rationale: Natural na pananalita ito para sa pagsasagawa ng sakripisyo, habang malinaw pa rin ang panrelihiyong kilos dahil sa kasunod na “handog.”
- source_word: זֶבַח הַיָּמִים
  choice: taunang handog
  rationale: Tumutukoy sa handog na inihahain sa regular na taunang pagdiriwang; malinaw at likas ito sa Filipino.
