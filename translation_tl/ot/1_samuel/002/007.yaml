  text: Yahweh makes poor and makes rich[b][a]; he brings low and also lifts up.
translation:
  language: tl
  text: Si Yahweh ang nagpapadukha[a] at nagpapayaman; siya ang nagpapababa at siya rin ang nagtataas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagkakait ng ari-arian.” Ang pandiwang Hebreo ay maaari ring tumukoy nang mas malawak sa pagdudulot ng pagkawala o pagkakait ng ari-arian.
    reason: lexical_alternative
  - marker: b
    text: O “nagdadakila” o “nag-aangat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: מוֹרִישׁ
  choice: nagpapadukha
  rationale: Sa antitetikong pagtutugma nito sa “nagpapayaman,” tumutukoy ang causative na pandiwa sa pagpapahirap sa kalagayang pangkabuhayan. Mas tiyak ang “nagpapadukha” kaysa “nagpapahirap,” na maaari ring mangahulugang nagpapasakit o nagpapabigat.
- source_word: וּמַעֲשִׁיר
  choice: at nagpapayaman
  rationale: Pinananatili nito ang causative na diwa at ang malinaw na pagtutugma sa “nagpapadukha.”
- source_word: מַשְׁפִּיל
  choice: nagpapababa
  rationale: Pinananatili ang larawang patayo at ang tuwirang kaibahan nito sa “nagtataas,” nang hindi nililimitahan ang kahulugan sa panloob na pagpapakumbaba.
- source_word: אַף
  choice: rin
  rationale: Natural na ipinahahayag ng “rin” ang pandagdag at bahagyang mapagdiing puwersa ng salitang Hebreo sa kasunod na kilos.
- source_word: מְרוֹמֵם
  choice: nagtataas
  rationale: Pinananatili nito ang konkretong larawang patayo na katapat ng “nagpapababa”; maaari rin itong mangahulugang pagdadakila.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang inihayag sa Israel sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at balanseng anyong patula sa pamamagitan ng magkatapat na pares na “nagpapadukha—nagpapayaman” at “nagpapababa—nagtataas.”
