id: 1SA.2.31
reference: 1 Samuel 2:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הִנֵּה֙ יָמִ֣ים בָּאִ֔ים וְ/גָֽדַעְתִּי֙ אֶת זְרֹ֣עֲ/ךָ֔ וְ/אֶת זְרֹ֖עַ בֵּ֣ית אָבִ֑י/ךָ מִֽ/הְי֥וֹת זָקֵ֖ן בְּ/בֵיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/031.yaml
  text: Look[a], days are coming when I will cut off your strength and the strength of your father's house, so that there will not be an old man in your house.
translation:
  language: tl
  text: Narito[a], dumarating ang mga araw na puputulin ko ang iyong lakas at ang lakas ng sambahayan ng iyong ama, kaya wala ni isang lalaki sa iyong sambahayan ang aabot sa katandaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Narito.” Ginagamit ito upang ipakilala ang isang taimtim at mariing pahayag.
    reason: discourse_marker
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Nagbubukas ito ng isang taimtim na pahayag ng propetikong hatol; pinananatili ng “Narito” ang pantawag-pansing puwersa nang may marangal na tono.
- source_word: יָמִים בָּאִים
  choice: dumarating ang mga araw
  rationale: Pinananatili ang karaniwang pormulang propetiko at ang diwa ng nalalapit na pangyayari sa natural na Tagalog.
- source_word: גָדַעְתִּי
  choice: puputulin ko
  rationale: Tuwirang ipinahahayag ang mapagpasiyang pagputol o pagkitil na tinutukoy ng pandiwa.
- source_word: זְרֹעֲךָ / זְרֹעַ בֵּית אָבִיךָ
  choice: iyong lakas / ang lakas ng sambahayan ng iyong ama
  rationale: Bagaman literal na “bisig,” metapora ito ng lakas, kapangyarihan, at kakayahang magpatuloy; malinaw na naihahatid ng “lakas” ang kahulugan sa modernong Tagalog.
- source_word: בֵּית אָבִיךָ / בְּבֵיתֶךָ
  choice: sambahayan ng iyong ama / iyong sambahayan
  rationale: Ang “sambahayan” ay likas na tumutukoy sa pamilya o angkan, hindi lamang sa gusali.
- source_word: מֵהְיוֹת זָקֵן בְּבֵיתֶךָ
  choice: kaya wala ni isang lalaki sa iyong sambahayan ang aabot sa katandaan
  rationale: Ipinapakita ang bunga ng hatol at nililinaw na ang זָקֵן dito ay tumutukoy sa taong umabot sa matandang edad, hindi sa katungkulan ng isang matanda.
theological_decisions:
- issue: Metaporikong kahulugan ng “bisig” sa pahayag ng hatol
  choice: Isinalin bilang “lakas” sa dalawang paglitaw
  alternative: Panatilihin nang literal bilang “bisig”
  rationale: Karaniwang larawan sa Hebreo ang bisig para sa lakas o kapangyarihan. Ang pagsasaling “lakas” ay naghahayag ng kahulugan nang hindi nagdaragdag ng doktrinang wala sa teksto.
- issue: Saklaw ng hatol na walang זָקֵן sa sambahayan
  choice: “wala ni isang lalaki ... ang aabot sa katandaan”
  alternative: “walang matandang lalaki sa iyong sambahayan”
  rationale: Nililinaw ng konteksto na pinaikling buhay ng mga lalaking kabilang sa angkan ang tinutukoy, hindi ang pagkawala ng isang opisyal na “matanda”; pinananatili pa rin ang kaugnayan nito sa sambahayan ni Eli.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sambahayan” para sa angkan o pamilya at “aabot sa katandaan” upang maiwasang mapagkamalang katungkulan ang “matanda.”
