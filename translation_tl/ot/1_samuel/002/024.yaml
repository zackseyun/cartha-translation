  text: אַ֖ל בָּנָ֑/י כִּ֠י לֽוֹא טוֹבָ֤ה הַ/שְּׁמֻעָה֙ אֲשֶׁ֣ר אָנֹכִ֣י שֹׁמֵ֔עַ מַעֲבִרִ֖ים עַם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/024.yaml
  text: No[a], my sons; for the report that I hear is not good. You are making Yahweh’s people transgress.
translation:
  language: tl
  text: Huwag, mga anak ko; sapagkat hindi mabuti ang balitang naririnig ko. Ginagawa ninyong magkasala ang bayan ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa ibang pagkaunawa sa Hebreo: “sapagkat hindi mabuti ang balitang naririnig kong ikinakalat ng bayan ni Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל
  choice: Hindi
  rationale: Ginamit bilang mariing pagtutol sa tuwirang pagsaway, hindi lamang bilang karaniwang pautos na pagbabawal.
- source_word: בָּנָי
  choice: mga anak ko
  rationale: Likas na salin sa Filipino para sa magiliw ngunit mariing pagtawag ni Eli sa kaniyang mga anak na lalaki; malinaw na ang kasarian mula sa konteksto.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagsaway ni Eli at angkop sa marangal na salaysay.
- source_word: לֹא טוֹבָה
  choice: hindi mabuti
  rationale: Pinananatili ang payak at tuwirang pagtataya ng Hebreo nang hindi pinatitindi bilang tahasang 'masama.'
- source_word: הַשְּׁמֻעָה
  choice: ang balita
  rationale: Tumutukoy sa ulat na nakararating kay Eli tungkol sa asal ng kaniyang mga anak; mas natural ito sa modernong Filipino kaysa 'ulat' sa pangungusap na ito.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: na naririnig ko
  rationale: Natural na inilalarawan ang patuloy na pagkarinig ni Eli sa kumakalat na balita.
- source_word: מַעֲבִרִים
  choice: Inililigaw ninyo sa pagkakasala
  rationale: 'Ipinapahayag ang posibleng causative na diwa ng Hiphil ng עבר: dahil sa asal ng mga anak ni Eli, ang bayan ay natutulak o naililigaw na lumabag. Pinananatili sa talababa ang mahalagang alternatibong pagsusuri sa parirala.'
- source_word: עַם יְהוָה
  choice: ang bayan ni Yahweh
  rationale: Natural at tumpak na salin ng construct phrase, habang pinananatili ang personal na pangalan ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH, alinsunod sa patakaran ng proyekto.
theological_decisions:
- issue: Paglalahad sa יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng מַעֲבִרִים עַם יְהוָה
  choice: Inililigaw ninyo sa pagkakasala ang bayan ni Yahweh
  alternative: ang balitang naririnig kong ikinakalat ng bayan ni Yahweh
  rationale: Ang pangunahing salin ay kumukuha sa מַעֲבִרִים bilang causative at tumutugma sa pagsaway sa mga anak ni Eli. Gayunman, mahirap ang sintaks at posibleng iugnay ang parirala sa pagkalat ng balita, kaya tahasang pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “sapagkat” upang mapanatili ang pormal ngunit madaling maunawaang himig, at “Hindi, mga anak ko” bilang natural na mariing pagsaway. Ang talababa ay nag-iingat sa tunay na kalabuan ng mahirap na pariralang Hebreo.
