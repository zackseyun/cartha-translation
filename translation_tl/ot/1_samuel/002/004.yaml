base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/004.yaml
  text: The bows of the mighty are shattered[b][a], but those who stumble are girded with strength.
translation:
  language: tl
  text: Ang mga busog ng mga makapangyarihan ay nabali[a], ngunit ang mga natitisod ay nagbigkis ng lakas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nawasak.”
    reason: lexical_alternative
  - marker: b
    text: O, “nabigkisan ng lakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: mga busog
  rationale: Bagaman pang-isahan ang anyong Hebreo, kolektibo ang gamit nito dahil kaugnay ito ng maramihang “makapangyarihan” at ng maramihang panaguri.
- source_word: גִּבֹּרִים
  choice: makapangyarihan
  rationale: Pinananatili nito ang malawak na diwa ng mga taong malakas o magiting nang hindi nililimitahan ang salita sa mga mandirigma lamang.
- source_word: חַתִּים
  choice: nabali
  rationale: Sa kaugnayan nito sa busog, tumutukoy ito sa pagkabali o pagkawasak, hindi sa emosyonal na panghihina. Likas at malinaw sa Filipino ang “nabali” para sa isang busog.
- source_word: נִכְשָׁלִים
  choice: mga natitisod
  rationale: Pinananatili nito ang kongkretong talinghaga ng mga taong natitisod o pasuray-suray sa halip na agad itong ipakahulugang “mahihina.”
- source_word: אָזְרוּ
  choice: nagbigkis sa kanilang sarili
  rationale: Aktibo at ganap ang anyong Hebreo. Ang tahasang pansariling parirala sa Filipino ay likas na nagpapahayag ng idyomang pagbibigkis sa sarili nang hindi inaalis ang talinghaga.
- source_word: חָיִל
  choice: lakas
  rationale: Saklaw nito ang lakas, kapangyarihan, at kagitingan; dito, ang “lakas” ang pinakamalinaw at pinakamalawak na katumbas para sa tema ng pagbaligtad.
theological_decisions:
- issue: Matalinghagang pagbaligtad sa awit ni Hana
  choice: Pinanatili ang mga larawang “busog,” “natitisod,” at “nagbigkis” sa halip na gawing abstraktong pahayag na ang malalakas ay nanghina at ang mahihina ay lumakas.
  alternative: Ang mga sandata ng mga mandirigma ay nasira, ngunit lumakas ang mahihina.
  rationale: Ang kongkretong larawang pandigma at pangkatawan ang naghahayag ng pagbaligtad ng kalagayan sa tula, nang hindi nagdaragdag ng paliwanag na wala sa talata.
- issue: Tinig ng pandiwang אָזְרוּ
  choice: Isinalin bilang aktibong “nagbigkis sa kanilang sarili,” ayon sa anyong Hebreo.
  alternative: “nabigkisan ng lakas,” na maaaring magpahiwatig ng di-binanggit na gumagawa ng kilos.
  rationale: Hindi tahasang pinangalanan ng talata kung sino ang nagbibigay ng lakas. Iniiwasan ng pangunahing salin ang pagdaragdag ng isang di-binanggit na tagaganap, habang itinatala sa talababa ang natural na alternatibong pasibo.
translation_notes:
  register: Makabagong Filipino na patula ngunit madaling maunawaan. Ginamit ang “makapangyarihan” sa malawak na diwa at pinanatili ang magkakatapat na kongkretong larawan ng lakas at kahinaan.
