  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִגַּ֣דְתִּי ל֔/וֹ כִּֽי שֹׁפֵ֥ט אֲנִ֛י אֶת בֵּית֖/וֹ עַד עוֹלָ֑ם בַּ/עֲוֺ֣ן אֲשֶׁר יָדַ֗ע כִּֽי מְקַֽלְלִ֤ים לָ/הֶם֙ בָּנָ֔י/ו וְ/לֹ֥א כִהָ֖ה בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/013.yaml
  text: And I have declared to him that I am judging his house forever for the iniquity that he knew[a], because his sons were cursing God, and he did not restrain them.
translation:
  language: tl
  text: 'At ipinahayag ko sa kanya na hinahatulan ko ang sambahayan niya magpakailanman dahil sa kasalanang alam niya: ang mga anak niya ay nagdadala ng sumpa sa kanilang sarili[a], at hindi niya sila pinigil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ayon sa ibang pagbasa na nasasalamin sa ilang sinaunang saksi at maraming salin: “nilalapastangan ng mga anak niya ang Diyos” o “isinusumpa ng mga anak niya ang Diyos.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגַּדְתִּי
  choice: At ipinahayag ko
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam o ipahayag. Ang anyong ganap ay tumutukoy sa nauna nang kapahayagan.
- source_word: שֹׁפֵט אֲנִי
  choice: hinahatulan ko
  rationale: Ang participle na may hayag na panghalip ay nagpapahiwatig ng nagpapatuloy o nalalapit na pagkilos; pinananatili ng kasalukuyang anyo ang taimtim at agarang diwa.
- source_word: בֵּיתוֹ
  choice: ang sambahayan niya
  rationale: Ang Hebreong 'bahay' ay maaaring tumukoy kapuwa sa sambahayan at sa angkan. Ang 'sambahayan' ay natural sa modernong Tagalog nang hindi nililimitahan sa gusali.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Ipinahahayag nito ang walang takdang tagal at pinananatili ang bigat ng hatol.
- source_word: בַּעֲוֺן
  choice: dahil sa kasalanan
  rationale: Ang עָוֹן ay tumutukoy sa mabigat na pagkakasala at maaari ring magtaglay ng diwa ng pananagutan; malinaw at likas sa Tagalog ang 'kasalanan'.
- source_word: יָדַע
  choice: alam niya
  rationale: Tuwirang ipinahahayag nito na batid ni Eli ang pagkakasala, kaya may pananagutan siya.
- source_word: מְקַלְלִים לָהֶם
  choice: nagdadala ng sumpa sa sarili nila
  rationale: Sinusunod nito ang anyo ng Masoretic Text, na likas na mauunawaang ang mga anak ay nagdadala ng sumpa sa kanilang sarili. Ang kilalang alternatibong pagbasa tungkol sa paglapastangan sa Diyos ay inilalagay sa talababa.
- source_word: וְלֹא כִהָה בָּם
  choice: ngunit hindi niya sila pinigil
  rationale: Sa konteksto, ang pandiwa ay nagpapahiwatig ng pagkabigong supilin, sawayin, o pigilan ang masamang ginagawa ng mga anak.
theological_decisions:
- issue: Kung susundin ang Masoretic na pagbasa tungkol sa sumpang dinadala ng mga anak sa kanilang sarili o ang alternatibong pagbasa tungkol sa paglapastangan sa Diyos
  choice: 'Pinanatili sa pangunahing teksto ang diwa ng Masoretic Text: ''nagdadala ng sumpa sa sarili nila.'''
  alternative: '''Nilalapastangan ng mga anak niya ang Diyos'' o ''isinusumpa ng mga anak niya ang Diyos.'''
  rationale: Sinusuportahan ng ibinigay na tekstong Hebreo ang pagbasa tungkol sa kanilang sarili, samantalang ang alternatibo ay nasasalamin sa ilang sinaunang saksi at maraming salin. Pinananatili ng talababa ang mahalagang pagkakaibang tekstuwal nang hindi pinapalitan ang pangunahing Hebreong ebidensiya.
- issue: Lawak ng hatol sa 'bahay' ni Eli
  choice: Isinalin bilang 'sambahayan niya' nang hindi tahasang nililimitahan sa mga kasalukuyang miyembro nito.
  alternative: '''angkan niya'' o literal na ''bahay niya.'''
  rationale: Maaaring saklawin ng idyomang Hebreo kapuwa ang sambahayan at nagpapatuloy na linya ng pamilya; iniiwasang paliitin nang labis ang saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang 'sambahayan' para sa biblikal na idyoma ng pamilya o angkan, at inilagay ang tekstuwal na alternatibo sa talababa upang mapanatili ang tunay na kalabuan.
