reference: 1 Samuel 3:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֥סֶף יְהוָ֖ה לְ/הֵרָאֹ֣ה בְ/שִׁלֹ֑ה כִּֽי נִגְלָ֨ה יְהוָ֧ה אֶל שְׁמוּאֵ֛ל בְּ/שִׁל֖וֹ בִּ/דְבַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/021.yaml
  text: And Yahweh continued to appear at Shiloh[a], for Yahweh revealed himself to Samuel at Shiloh by the word of Yahweh.
translation:
  language: tl
  text: At patuloy na nagpakita si Yahweh sa Shilo, sapagkat inihayag ni Yahweh ang sarili niya kay Samuel sa Shilo sa pamamagitan ng salita ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa salita ni Yahweh.”
    reason: Alternatibong paraan ng pag-unawa sa בִּדְבַר יְהוָה; maaaring idiin ng ב ang paraan o ang larangan ng paghahayag.
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: patuloy na
  rationale: Ang יָסַף na sinusundan ng pawatas ay idyomang nagsasaad ng pagpapatuloy o pag-uulit. Likas sa modernong Tagalog ang “patuloy na” at ipinapakita nitong hindi minsanan ang pagpapakita.
- source_word: לְהֵרָאֹה
  choice: nagpakita
  rationale: Ang Niphal ng ראה rito ay tumutukoy sa pagpapakita o pagpapamalas ng presensiya. Ang “nagpakita” ang pinakanatural na katumbas sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְשִׁלֹה / בְשִׁלוֹ
  choice: sa Shilo
  rationale: Lokatif ang ב rito. Ang “sa Shilo” ay natural na pagtukoy sa lugar sa Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng כִּי ang paliwanag o batayan ng naunang pahayag; malinaw at marangal na panumbas ang “sapagkat.”
- source_word: נִגְלָה
  choice: inihayag ... ang sarili niya
  rationale: Ang Niphal ng גלה ay nagpapahiwatig ng pagpapakilala o paghahayag ng sarili. Pinananatili nito ang pagkakaiba sa naunang “nagpakita” nang hindi tinutukoy ang eksaktong paraan ng pagpapahayag.
- source_word: אֶל שְׁמוּאֵל
  choice: kay Samuel
  rationale: Ito ang natural na Tagalog para sa direksiyon ng paghahayag tungo sa isang tao.
- source_word: בִּדְבַר יְהוָה
  choice: sa pamamagitan ng salita ni Yahweh
  rationale: Maaaring instrumental ang ב, kaya malinaw na ipinahahayag ng salin na ang salita ni Yahweh ang paraan ng paghahayag, habang itinatala sa talababa ang mas literal at maaaring alternatibong pagbasa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Uri ng pagpapakita at paghahayag ng Diyos
  choice: Pinananatili ang kapuwa “nagpakita” at “inihayag ang sarili” nang hindi nililinaw pa ang eksaktong paraan.
  alternative: Ituring itong tanging pangitain o tahasang pisikal na pagpapakita
  rationale: Nagsasalita ang Hebreo kapuwa tungkol sa pagpapakita at paghahayag sa pamamagitan ng salita. Hindi nito tiyak na inilalarawan kung bisyonaryo, pisikal, o ibang paraan ang pagpapamalas, kaya hindi iyon ipinapasok sa salin.
- issue: Gamit ng ב sa בִּדְבַר יְהוָה
  choice: sa pamamagitan ng salita ni Yahweh
  alternative: sa salita ni Yahweh
  rationale: Malamang na instrumental ang parirala, ngunit maaari ring panatilihin ang mas siksik na ugnayang “sa salita.” Inilalagay sa talababa ang alternatibo upang hindi ikubli ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sapagkat” upang mapanatili ang malinaw na paliwanag na ugnayan, at iniwasan ang arkaiko o labis na teknikal na pananalita.
