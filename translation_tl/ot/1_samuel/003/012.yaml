  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ אָקִ֣ים אֶל עֵלִ֔י אֵ֛ת כָּל אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל בֵּית֑/וֹ הָחֵ֖ל וְ/כַלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/012.yaml
  text: On that day I will carry out against Eli all that I have spoken concerning his house[b][a], from beginning to end.
translation:
  language: tl
  text: Sa araw na iyon, isasakatuparan ko laban kay Eli ang lahat ng sinabi ko tungkol sa kanyang sambahayan[a]—mula simula hanggang wakas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sambahayan” ay maaaring tumukoy sa pamilya, angkan, o linya ng mga pari ni Eli.
    reason: lexical_alternative
  - marker: b
    text: O “tutuparin ko kay Eli ang lahat ng sinabi ko tungkol sa kanyang sambahayan, mula simula hanggang wakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Sa araw na iyon
  rationale: Likas na modernong Tagalog para sa tiyak na panahong darating at pinananatili ang puwersa ng demonstratibo.
- source_word: אָקִים
  choice: isasakatuparan ko
  rationale: Ang Hiphil ng קום na ang layon ay ang lahat ng sinabi ng Diyos ay tumutukoy sa pagpapangyaring maganap o matupad ang kanyang salita.
- source_word: אֶל עֵלִי
  choice: laban kay Eli
  rationale: Bagaman karaniwang nangangahulugang “kay” ang אֶל, ipinahihiwatig ng konteksto ng paghatol na ang isasakatuparan ay salungat kay Eli.
- source_word: אֵת כָּל אֲשֶׁר דִּבַּרְתִּי
  choice: ang lahat ng sinabi ko
  rationale: Tuwirang pinananatili ang kabuuang saklaw ng כָּל אֲשֶׁר at ang diwa ng naunang pagsasalita ng Diyos.
- source_word: אֶל בֵּיתוֹ
  choice: tungkol sa kanyang sambahayan
  rationale: Sa kaugnayan sa דִּבַּרְתִּי, maaaring tukuyin ng אֶל ang paksa ng sinabi; ang “sambahayan” ay natural sa Tagalog at may sapat na lawak upang isama ang pamilya at angkan.
- source_word: בֵּיתוֹ
  choice: kanyang sambahayan
  rationale: Hindi literal na gusali ang tinutukoy kundi ang pamilya o angkan ni Eli, kasama sa konteksto ang kanyang linya ng mga pari; ipinaliliwanag sa talababa ang saklaw.
- source_word: הָחֵל וְכַלֵּה
  choice: mula simula hanggang wakas
  rationale: Ipinahahayag ng pares na ito ang lubos at ganap na pagsasagawa ng ipinahayag na paghatol; natural at malinaw ang idyomang Tagalog.
theological_decisions:
- issue: Saklaw ng paghatol kay Eli at sa kanyang בַּיִת
  choice: Pinanatili ang malawak na diwa sa “sambahayan,” na maaaring sumaklaw sa pamilya, angkan, at linya ng mga pari.
  alternative: Limitahan ito sa mga kasambahay o kagyat na pamilya lamang, o tahasang isalin bilang buong institusyon ng pagkasaserdote.
  rationale: Hindi nililimitahan ng Hebreo ang בֵּיתוֹ sa kagyat na pamilya lamang, ngunit hindi rin nito tahasang pinalalawak sa buong institusyon ng pagkasaserdote. Pinananatili ng salin at talababa ang tunay na lawak nang hindi nagpapasya nang lampas sa teksto.
- issue: Puwersa ng אָקִים אֶל עֵלִי
  choice: “isasakatuparan ko laban kay Eli” bilang pagpapatupad ng naunang ipinahayag na paghatol
  alternative: “tutuparin ko para kay Eli” o “itatatag ko kay Eli”
  rationale: Maaaring maging mas neutral ang mga salita sa kanilang sarili, ngunit malinaw na masama para kay Eli ang tinutukoy sa konteksto. Gayunman, itinatala sa talababa ang mas literal at hindi gaanong interpretatibong anyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” sa halip na literal na “bahay” upang maiwasan ang maling pagkaunawa na gusali ang tinutukoy, habang pinananatili sa talababa ang lawak ng Hebreong בַּיִת. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
