  text: וַ/יֹּ֣סֶף יְהוָ֗ה קְרֹ֣א עוֹד֮ שְׁמוּאֵל֒ וַ/יָּ֤קָם שְׁמוּאֵל֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יֹּ֛אמֶר לֹֽא קָרָ֥אתִי בְנִ֖/י שׁ֥וּב שְׁכָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/006.yaml
  text: Then the LORD called Samuel again. Samuel got up and went to Eli and said, “Here I am, because you called me.” But he said, “I did not call, my son. Go back; lie down.”
translation:
  language: tl
  text: Muling tinawag ni Yahweh si Samuel. Bumangon si Samuel, pumunta kay Eli, at sinabi, “Narito po ako, dahil tinawag ninyo ako.” Ngunit sinabi ni Eli, “Hindi kita tinawag, anak ko. Bumalik ka at humiga.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף יְהוָה קְרֹא עוֹד
  choice: Muling tinawag ni Yahweh
  rationale: Ang pinagsamang יֹסֶף at עוֹד ay likas na ipinahahayag sa Tagalog sa pamamagitan ng “muling,” nang hindi inuulit ang diwang ‘dagdag/muli.’ Pinanatili ang personal na pangalan ng Diyos na יהוה bilang “Yahweh.”
- source_word: הִנְנִי
  choice: Narito po ako
  rationale: Katumbas ito ng pormulang tugon na nagpapahayag ng pagiging handa o pagharap. Idinagdag ang “po” bilang natural na paggalang ni Samuel kay Eli.
- source_word: כִּי קָרָאתָ לִי
  choice: dahil tinawag ninyo ako
  rationale: Ginamit ang sanhiang kahulugan ng כִּי. Ang “ninyo” ay magalang na pang-isahang pagtukoy kay Eli, hindi pangmaramihan.
- source_word: בְנִי
  choice: anak ko
  rationale: Tuwirang pinananatili ang mapagmahal o nakatatandang pagtawag ni Eli kay Samuel.
- source_word: שׁוּב שְׁכָב
  choice: Bumalik ka at humiga
  rationale: Inilalarawan nito ang dalawang utos—bumalik at mahiga—sa natural na modernong Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang “Yahweh” ay malinaw na kumakatawan sa personal na pangalang nasa tekstong Hebreo at iniiwasang ipaghalo ito sa titulong ‘Panginoon.’ Walang doktrinal na paliwanag na idinagdag sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “po/ninyo” upang natural na ipakita ang paggalang ng batang si Samuel sa nakatatanda at saserdoteng si Eli; hindi ginawang magalang ang pananalita ni Eli kay Samuel.
