language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר עֵלִ֣י לִ/שְׁמוּאֵל֮ לֵ֣ךְ שְׁכָב֒ וְ/הָיָה֙ אִם יִקְרָ֣א אֵלֶ֔י/ךָ וְ/אָֽמַרְתָּ֙ דַּבֵּ֣ר יְהוָ֔ה כִּ֥י שֹׁמֵ֖עַ עַבְדֶּ֑/ךָ וַ/יֵּ֣לֶךְ שְׁמוּאֵ֔ל וַ/יִּשְׁכַּ֖ב בִּ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/009.yaml
  text: Then Eli said to Samuel[a], “Go, lie down, and if he calls to you, you shall say, ‘Speak, Yahweh, for your servant is listening.’” So Samuel went and lay down in his place.
translation:
  language: tl
  text: Sinabi ni Eli kay Samuel, “Humayo ka at mahiga. At kung tawagin ka niya, sabihin mo, ‘Magsalita ka, Yahweh, sapagkat nakikinig ang iyong lingkod.’” Kaya humayo si Samuel at humiga sa kanyang lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi ni Eli
  rationale: Ang wayyiqtol ay nagsusulong ng salaysay; natural sa Tagalog ang simpleng “Sinabi” dahil malinaw na ang pagkakasunod-sunod mula sa konteksto.
- source_word: לֵךְ שְׁכָב
  choice: Humayo ka at mahiga
  rationale: Pinananatili ang dalawang pautos at ang tuwirang tono nang hindi idinaragdag ang di-hayag na “matulog.”
- source_word: וְהָיָה אִם
  choice: At kung
  rationale: Pinananatili ang kondisyonal na diwa ng אִם; ang “kapag” ay maaaring magpahiwatig ng higit na katiyakan kaysa sa anyong Hebreo.
- source_word: יִקְרָא אֵלֶיךָ
  choice: tawagin ka niya
  rationale: Hindi hayag ang panaguri sa Hebreo, ngunit ipinahihiwatig ng konteksto na ang tumatawag ay si Yahweh. Likas sa Tagalog ang “tawagin ka” para sa קרא + אֶל sa kontekstong ito.
- source_word: וְאָמַרְתָּ
  choice: sabihin mo
  rationale: Ang anyo pagkatapos ng kondisyon ay naghahayag ng iniutos na tugon; ang pautos na Tagalog ang pinakanatural.
- source_word: דַּבֵּר
  choice: Magsalita ka
  rationale: Tuwirang salin ng panlalaking isahang pautos, na angkop bilang magalang ngunit malinaw na pakiusap sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng kahilingan; dignified at malinaw sa modernong Tagalog ang “sapagkat.”
- source_word: שֹׁמֵעַ
  choice: nakikinig
  rationale: Ang participle ay nagpapahiwatig ng nagpapatuloy at handang pakikinig, hindi lamang pisikal na pagkarinig.
- source_word: עַבְדֶּךָ
  choice: ang iyong lingkod
  rationale: Ang “lingkod” ay angkop sa mapagpakumbabang pagtukoy sa sarili sa harap ng Diyos at hindi labis na nagdidiin sa katayuang alipin.
- source_word: וַיֵּלֶךְ ... וַיִּשְׁכַּב
  choice: Kaya humayo si Samuel at humiga
  rationale: Ipinakikita ng “Kaya” na isinagawa ni Samuel ang tagubilin ni Eli, habang pinananatili ang magkasunod na kilos.
- source_word: בִּמְקוֹמוֹ
  choice: sa kanyang lugar
  rationale: Malapit sa literal na kahulugan at hindi nagdaragdag ng “karaniwan” o “sariling,” na hindi tahasang nakasaad.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton bilang pangalan sa panawagan. Pinananatili ng “Yahweh” ang pangalang nasa Hebreo nang hindi ito ginagawang titulo.
- issue: Di-hayag na simuno ng יִקְרָא
  choice: niya
  alternative: may tumawag sa iyo
  rationale: Hindi pinapangalanan ng mismong pandiwa ang simuno, ngunit malinaw sa agarang konteksto na naunawaan ni Eli na si Yahweh ang tumatawag. Pinananatili ng panghalip ang bahagyang di-tahasang anyo ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “humayo” upang panatilihin ang dignidad ng salaysay, samantalang ang balangkas ng mga pangungusap ay nananatiling natural. Walang talababa dahil walang alternatibong pagbasa o tekstuwal na suliraning kailangang ilahad sa talatang ito.
