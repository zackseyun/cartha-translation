base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/005.yaml
  text: He ran to Eli and said, “Here I am, because you called me.” But he said, “I did not call. Go back; lie down.” So he went and lay down.
translation:
  language: tl
  text: Tumakbo siya kay Eli at sinabi, “Narito po ako, dahil tinawag ninyo ako.” Ngunit sinabi ni Eli, “Hindi kita tinawag. Bumalik ka at humiga.” Kaya umalis siya at humiga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Narito po ako
  rationale: Likas na katumbas ng pormulang Hebreo na nagpapahayag ng agarang pagharap o kahandaang tumugon; ang “po” ay angkop sa paggalang ni Samuel kay Eli.
- source_word: כִּי
  choice: dahil
  rationale: 'Pinananatili ang malinaw na dahilang ibinigay ni Samuel: lumapit siya sapagkat inakala niyang tinawag siya ni Eli.'
- source_word: שׁוּב שְׁכָב
  choice: Bumalik ka at humiga
  rationale: Natural na Filipino para sa dalawang pautos na nagsasabing bumalik siya at muling mahiga.
- source_word: וַיֵּלֶךְ וַיִּשְׁכָּב
  choice: Kaya umalis siya at humiga
  rationale: Pinananatili ang sunod-sunod na kilos sa salaysay nang hindi dinaragdagan ang lugar na pinuntahan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “po” at maramihang anyong-galang na “ninyo” upang natural na maipakita ang paggalang ng batang si Samuel sa nakatatandang si Eli; inuulit ang pangalang Eli sa tugon upang maiwasan ang malabong reperensiya ng panghalip sa Filipino.
