base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/003.yaml
  text: And the lamp of God had not yet gone out[a], and Samuel was lying down in the temple of Yahweh, where the ark of God was.
translation:
  language: tl
  text: Hindi pa nauupos ang ilawan ng Diyos, at nakahiga si Samuel sa templo ni Yahweh[a], kung saan naroon ang kaban ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa santuwaryo ni Yahweh.” Ang salitang Hebreo ay maaaring tumukoy sa templo o santuwaryo; dito, tinutukoy nito ang dakong sambahan ni Yahweh sa Shilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵר אֱלֹהִים
  choice: ang ilawan ng Diyos
  rationale: Tuwirang pinananatili ang kahulugang ‘ilawan’ at ang ugnayang konstruktong ‘ng Diyos’; malamang na tumutukoy ito sa ilawang ginagamit sa santuwaryo.
- source_word: טֶרֶם יִכְבֶּה
  choice: hindi pa namamatay
  rationale: Likas sa modernong Tagalog ang ‘namamatay’ para sa ilawang unti-unting nauubos o nawawalan ng apoy, at malinaw na naihahayag ng ‘hindi pa’ ang di-pa-naganap na kilos.
- source_word: שֹׁכֵב
  choice: nakahiga
  rationale: Isinasalin ang posisyon o kalagayan ng paghiga nang hindi ipinapalagay na natutulog na si Samuel.
- source_word: הֵיכַל יְהוָה
  choice: sa templo ni Yahweh
  rationale: Maaaring mangahulugan ang הֵיכָל ng templo o santuwaryo. Ang ‘templo’ ay maikli at karaniwang katumbas, habang inilalagay sa talababa ang ‘santuwaryo’ upang maiwasan ang pag-aakalang gusali na ito ng templo ni Solomon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong ‘PANGINOON.’
- source_word: אֲשֶׁר שָׁם אֲרוֹן אֱלֹהִים
  choice: kung saan naroon ang kaban ng Diyos
  rationale: Natural na Tagalog ito para sa sugnay na tumutukoy sa lugar, at pinananatili ang konstruktong ‘kaban ng Diyos.’
theological_decisions:
- issue: Kahulugan ng הֵיכַל יְהוָה sa santuwaryo sa Shilo bago maitayo ang templo ni Solomon
  choice: sa templo ni Yahweh
  alternative: sa santuwaryo ni Yahweh
  rationale: Tunay na maaaring isalin ang הֵיכָל bilang ‘templo,’ ngunit ang tinutukoy rito ay ang tahanang sambahan sa Shilo, hindi ang templo ni Solomon. Pinananatili sa talababa ang ‘santuwaryo’ bilang lehitimong alternatibo at paglilinaw sa kasaysayan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang ‘nakahiga’ sa halip na ‘natutulog’ upang huwag dagdagan ang Hebreo, at ang pangalang ‘Yahweh’ upang katawanin ang tetragrammaton.
