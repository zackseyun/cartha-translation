id: 1SA.3.1
reference: 1 Samuel 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/נַּ֧עַר שְׁמוּאֵ֛ל מְשָׁרֵ֥ת אֶת יְהוָ֖ה לִ/פְנֵ֣י עֵלִ֑י וּ/דְבַר יְהוָ֗ה הָיָ֤ה יָקָר֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין חָז֖וֹן נִפְרָֽץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/001.yaml
  text: The boy Samuel was ministering to Yahweh before Eli[a], and the word of Yahweh was rare in those days; visions were not widespread.
translation:
  language: tl
  text: Ang batang si Samuel ay naglilingkod kay Yahweh sa harap ni Eli, at bihira noong mga araw na iyon ang salita ni Yahweh; hindi pangkaraniwan ang pangitain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “walang madalas na pangitain” o “hindi lumalaganap ang pangitain.” Idyomatiko ang pahayag sa Hebreo at nangangahulugang hindi karaniwan o laganap noon ang mga pangitaing naghahayag ng mensahe ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/נַּעַר
  choice: Ang batang si Samuel
  rationale: Ang הַנַּעַר ay tumutukoy sa isang batang lalaki o kabataan; sa yugtong ito ng salaysay, natural at angkop ang “batang si Samuel.” Hindi isinalin nang hiwalay ang וְ bilang “at” sapagkat nagsisilbi itong pang-ugnay sa daloy ng salaysay.
- source_word: מְשָׁרֵת
  choice: ay naglilingkod
  rationale: Ang participle ay nagpapahiwatig ng nagpapatuloy na gawain. Ang “naglilingkod” ay natural sa Filipino at maaari ring magtaglay ng diwang panrelihiyon ayon sa konteksto.
- source_word: אֶת יְהוָה
  choice: kay Yahweh
  rationale: Kasunod ng “naglilingkod,” likas sa Filipino ang panandang “kay” para sa pinaglilingkuran. Pinanatili ang personal na pangalang Yahweh para sa יהוה.
- source_word: לִפְנֵי עֵלִי
  choice: sa harap ni Eli
  rationale: Malapit ito sa literal na “sa harap/presensiya ni Eli” at hindi tahasang nilulutas kung ang diin ay pisikal na presensiya o pangangasiwa.
- source_word: וּ/דְבַר יְהוָה
  choice: at ... ang salita ni Yahweh
  rationale: Pinananatili ang karaniwang biblikal na idyoma para sa pahayag o kapahayagan mula sa Diyos.
- source_word: יָקָר
  choice: bihira
  rationale: Bagaman maaari itong mangahulugang “mahalaga” o “mahal,” ipinahihiwatig ng kasunod na sugnay na ang salita ni Yahweh ay madalang sa panahong iyon.
- source_word: בַּ/יָּמִים הָ/הֵם
  choice: noong mga araw na iyon
  rationale: Natural at malinaw na katumbas ng temporal na parirala sa modernong Filipino.
- source_word: אֵין חָזוֹן נִפְרָץ
  choice: hindi pangkaraniwan ang pangitain
  rationale: Ipinahahayag nito na hindi madalas o malaganap ang mapaghayag na pangitain, habang ang talababa ay nagpapanatili sa mas literal na larawan ng Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulo.
- issue: Kahulugan ng לִפְנֵי עֵלִי
  choice: sa harap ni Eli
  alternative: sa ilalim ng pangangasiwa ni Eli
  rationale: Ang “sa harap ni Eli” ay nagpapanatili sa tunay na lawak ng pariralang Hebreo at hindi ipinipilit na pangangasiwa lamang ang kahulugan.
- issue: Ugnayan ng “salita” at “pangitain”
  choice: Pinanatili bilang magkaugnay ngunit magkahiwalay na mga pahayag
  alternative: Ipaliwanag ang pangitain bilang tanging anyo ng salita ni Yahweh
  rationale: Ipinapahiwatig ng konteksto ang kakulangan ng kapahayagan, ngunit hindi tahasang pinapantay ng talata ang lahat ng “salita” sa “pangitain.”
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “naglilingkod” sa halip na mas teknikal na “nagmiministro,” at pinanatili ang biblikal na idyomang “salita ni Yahweh.”
