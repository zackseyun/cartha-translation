  yaml_path: translation/ot/1_samuel/003/016.yaml
  text: Then Eli called Samuel and said, “Samuel, my son.” And he said, “Here I am.”
translation:
  language: tl
  text: Pagkatapos, tinawag ni Eli si Samuel at sinabi, “Samuel, anak ko.” At sinabi niya, “Narito ako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Sa kontekstong pasalaysay, ang קרא ay tumutukoy sa pasalitang pagtawag ni Eli kay Samuel. Ang “tinawag” ay natural at tumpak sa Filipino.
- source_word: עֵלִי
  choice: Eli
  rationale: Ginamit ang nakasanayang anyo ng pangalang pantangi sa Filipino.
- source_word: אֶת שְׁמוּאֵל
  choice: si Samuel
  rationale: Hindi tuwirang isinasalin ang pananda ng tuwirang layon na אֶת; minamarkahan sa Filipino ang pangalang pantangi bilang layon sa pamamagitan ng “si.”
- source_word: וַיֹּאמֶר
  choice: sinabi / sumagot
  rationale: Ang אמר ay karaniwang pandiwa ng pagsasalita. Sa unang gamit, “sinabi” ang tuwirang katumbas; sa ikalawa, natural na ipinahahayag ng “sumagot” ang tugon ni Samuel nang hindi binabago ang diwa.
- source_word: שְׁמוּאֵל בְּנִי
  choice: Samuel, anak ko
  rationale: Pinananatili ng “anak ko” ang literal at magiliw na tawag na בְּנִי, nang hindi ipinapalagay na tumutukoy ito sa biyolohikal na relasyon.
- source_word: הִנֵּנִי
  choice: Narito ako
  rationale: Ito ang natural at nakaugaliang Filipino para sa pormulang Hebreo na nagpapahayag ng presensya at kahandaang tumugon.
- source_word: וַ
  choice: Pagkatapos / implicit sequence
  rationale: Ang unang waw-consecutive ay isinaling “Pagkatapos” upang malinaw ang pagsulong ng salaysay; sa kasunod na mga sugnay, likas na naipahihiwatig ng ayos ng Filipino ang pagkakasunod-sunod.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Pinanatili ang init ng tawag na “anak ko” at ang pormulang tugon na “Narito ako.”
