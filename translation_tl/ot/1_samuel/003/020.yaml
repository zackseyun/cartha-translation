  yaml_path: translation/ot/1_samuel/003/020.yaml
  text: And all Israel from Dan to Beer-sheba knew that Samuel was established as a prophet of Yahweh[a].
translation:
  language: tl
  text: At nalaman ng buong Israel, mula Dan hanggang Beer-seba, na si Samuel ay napatunayang tunay na propeta ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “itinatag bilang propeta ni Yahweh” o “pinagtibay bilang propeta ni Yahweh.” Ang salitang Hebreo ay maaaring mangahulugang napatunayang maaasahan, matatag, o pinagtibay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: nalaman
  rationale: Ipinahihiwatig ng pandiwa ang kaalamang naging hayag at kinilala ng buong Israel; natural at tuwiran ang “nalaman” sa Filipino.
- source_word: כָּל יִשְׂרָאֵל
  choice: buong Israel
  rationale: Pinananatili nito ang kolektibong pambansang pahayag ng Hebreo sa likas na anyong Filipino.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: mula Dan hanggang Beer-seba
  rationale: Pinananatili ang heograpikong idyoma para sa kabuuang lawak ng lupain sa halip na gawin itong paliwanag lamang.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng nalaman ng Israel.
- source_word: נֶאֱמָן
  choice: kinilalang tunay
  rationale: Sa konteksto, ang Niphal ng אמן ay nagsasaad na napatunayang mapananaligan at matatag ang katayuan ni Samuel bilang propeta. Ang “kinilalang tunay” ay natural sa Filipino at hindi nagpapahiwatig ng teknikal na ordinasyon.
- source_word: לְנָבִיא
  choice: na propeta
  rationale: Ipinahahayag ng lamed ang tungkulin o katayuan ni Samuel.
- source_word: לַיהוָה
  choice: ni Yahweh
  rationale: Ipinakikita ang kaugnayan at pagkakasugo ni Samuel bilang propeta ni Yahweh habang pinananatili ang personal na pangalan ng Diyos.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng נֶאֱמָן sa pagkilala kay Samuel
  choice: kinilalang tunay na propeta
  alternative: itinatag bilang propeta; napatunayang mapagkakatiwalaang propeta
  rationale: Binibigyang-diin ng konteksto na napatunayang tunay at hayagang kinilala ang pagkapropeta ni Samuel dahil natupad ang kanyang mga salita. Pinananatili ng talababa ang saklaw ng salitang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tradisyonal na heograpikong pormulang “mula Dan hanggang Beer-seba” at iniwasan ang teknikal o denominasyonal na pananalita.
