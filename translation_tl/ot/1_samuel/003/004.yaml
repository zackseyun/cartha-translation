  text: Then Yahweh called to Samuel[a], and he said, “Here I am.”
translation:
  language: tl
  text: Pagkatapos, tinawag ni Yahweh[a] si Samuel, at sinabi niya, “Narito ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: YHWH; ang “Jehovah” ay isa pang tradisyonal na anyo ng pangalan.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Ang Qal wayyiqtol ng קרא ay nagsasaad ng kasunod na pangyayari sa salaysay at, sa kontekstong ito, ng isang maririnig na pagtawag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל שְׁמוּאֵל
  choice: si Samuel
  rationale: Bagaman literal na may pang-ukol na אֶל, likas sa Filipino ang tuwirang layon sa pariralang “tinawag si Samuel.”
- source_word: וַיֹּאמֶר
  choice: at sumagot siya
  rationale: Literal itong “at sinabi niya,” ngunit ipinahihiwatig ng konteksto na tugon ni Samuel ang kasunod na pananalita; ang “sumagot” ay natural sa Filipino nang hindi binabago ang diwa.
- source_word: הִנֵּנִי
  choice: Narito ako
  rationale: Karaniwang pormula ito ng pagpapahayag ng presensya at kahandaang tumugon; likas at marangal ang “Narito ako” sa modernong Filipino.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na pangalan, habang inilalagay sa talababa ang isa pang kilalang anyo.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “Pagkatapos” upang ipakita ang pagkakasunod ng salaysay, at “sumagot” upang malinaw na si Samuel ang nagsasalita. Inilagay ang marker [a] kaagad pagkatapos ng “Samuel,” ayon sa ibinigay na konsultasyong teksto.
