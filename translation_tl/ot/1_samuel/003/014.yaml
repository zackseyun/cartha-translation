base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/014.yaml
  text: 'Therefore I have sworn to the house of Eli: the iniquity of Eli’s house shall never be atoned for by sacrifice or offering[a][b].'
translation:
  language: tl
  text: 'Kaya nanumpa ako tungkol sa sambahayan ni Eli: Ang pagkakasala ng sambahayan ni Eli ay hindi kailanman mapapatawad sa pamamagitan ng hain o handog na butil[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “tiyak na hindi mapapatawad.” Gumagamit ang Hebreo ng pormula ng panunumpa na may salitang “kung” pagkatapos ng “nanumpa ako” upang magpahayag ng mariing pagtanggi.
    reason: lexical_alternative
  - marker: b
    text: Ang “handog na butil” ay salin ng Hebreong minchah, na maaari ring tumukoy nang mas malawakan sa isang handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: Kaya
  rationale: Natural na panandang naghahayag ng bunga o pasiya batay sa naunang pahayag ng hatol.
- source_word: נִשְׁבַּעְתִּי
  choice: isinumpa ko
  rationale: Ipinahahayag ng ganap na pandiwa ang natapos nang taimtim na panunumpa na nananatiling may bisa.
- source_word: לְבֵית עֵלִי
  choice: tungkol sa sambahayan ni Eli
  rationale: Maaaring tukuyin ng ל ang pinatutungkulan ng sumpa; malinaw at natural ito sa Filipino nang hindi inuulit agad ang salitang 'laban sa,' na maaaring higit na magpaliit sa gamit ng pang-ukol.
- source_word: אִם
  choice: hindi kailanman
  rationale: Pagkatapos ng pandiwa ng panunumpa, ang אִם ay bahagi ng pormulang panumpa na nagpapahayag ng mariing pagtanggi, hindi isang karaniwang pasubali.
- source_word: יִתְכַּפֵּר
  choice: maipangtutubos
  rationale: Ipinahahayag ang pag-aalis o pagtatakip ng pagkakasala sa kontekstong pansakripisyo; pinananatili ang teolohikal na diwa sa salitang madaling maunawaan.
- source_word: עֲוֺן
  choice: kasamaan
  rationale: Saklaw ng עָוֹן ang mabigat na maling gawa at kaugnay na pagkakasala; ang 'kasamaan' ay dignified at natural, bagaman hindi nito lubos na pinaghihiwalay ang gawa at pananagutan.
- source_word: בֵּית עֵלִי
  choice: sambahayan ni Eli
  rationale: Tumutukoy sa angkan o pamilyang-bahay ni Eli, hindi lamang sa isang gusali.
- source_word: בְּזֶבַח
  choice: sa pamamagitan ng handog na hayop
  rationale: Ang זֶבַח ay handog na kinakatay; nililinaw ng parirala ang kaibhan nito sa kasunod na מִנְחָה.
- source_word: וּבְמִנְחָה
  choice: o ng handog
  rationale: Maaaring tumukoy ang מִנְחָה sa handog sa pangkalahatan o, sa kontekstong pangkulto, sa handog na butil; pinananatili sa talababa ang mas tiyak na kahulugan.
- source_word: עַד עוֹלָם
  choice: kailanman
  rationale: Kasama ng negatibong pormulang panumpa, natural nitong ipinahahayag ang permanenteng hindi pagtubos.
theological_decisions:
- issue: Saklaw ng hatol sa sambahayan ni Eli
  choice: Ipinahahayag na hindi maipangtutubos ang kanilang kasamaan sa pamamagitan ng mga nabanggit na handog.
  alternative: Maaaring ipakahulugan ito bilang ganap na pagtanggi sa anumang posibilidad ng kapatawaran mula sa Diyos.
  rationale: Tiyak na binabanggit ng Hebreo ang handog na hayop at minchah bilang mga paraang hindi makapagtutubos. Hindi pinalalawak ng salin ang pahayag tungo sa isang doktrina tungkol sa lahat ng posibleng paraan ng awa o kapatawaran.
- issue: Pormulang panumpa na may אִם
  choice: 'Isinalin bilang mariing negatibo: ''hindi kailanman.'''
  alternative: Panatilihin nang literal ang 'kung,' na mag-iiwan ng di-buong pasubaling pangungusap.
  rationale: Sa Hebreo, ang 'kung' matapos ang panunumpa ay isang idyomatikong pormula ng mariing pagtanggi. Ipinaliliwanag ito sa talababa upang mapanatili ang anyong pinagmulan nang hindi ginagawang malabo ang pangunahing teksto.
translation_notes:
  register: Modernong Filipino na may marangal at taimtim na himig. Ginamit ang 'sambahayan' upang maipakita ang angkan ni Eli, at 'handog na hayop' upang maiba ang zebach sa minchah. Ang mga pananda ng talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
