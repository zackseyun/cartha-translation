  naturalness: Mas natural at malinaw sa modernong Filipino ang “Hindi pa kilala ni Samuel si Yahweh” at “hindi pa nahahayag sa kanya.” Iniiwasan nito ang bahagyang pilit na progresibong “Hindi pa nakikilala” at ang mas mabigat na “naihayag.”
