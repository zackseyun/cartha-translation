base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/007.yaml
  text: Samuel did not yet know Yahweh[b][a], and the word of Yahweh had not yet been revealed to him.
translation:
  language: tl
  text: Hindi pa kilala ni Samuel si Yahweh[a], at ang salita ni Yahweh ay hindi pa nahahayag sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi pa nakilala ni Samuel si Yahweh.” Ang Hebreong pandiwang isinaling “kilala” ay maaaring tumukoy sa personal o karanasang pagkilala, lalo na kaugnay ng paghahayag ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם
  choice: hindi pa
  rationale: Ipinapahayag nito na hindi pa nagaganap ang kalagayan o pangyayari sa puntong ito ng salaysay.
- source_word: יָדַע אֶת־יְהוָה
  choice: nakikilala si Yahweh
  rationale: Pinananatili ng “nakikilala” ang posibleng relasyonal at karanasang diwa ng יָדַע, hindi lamang ang pagkakaroon ng kaalaman tungkol sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: יִגָּלֶה
  choice: naihayag
  rationale: 'Ang Niphal ay may pasibong diwa: ang salita ni Yahweh ay hindi pa naibubunyag o naipaaalam kay Samuel.'
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Natural at malinaw na modernong Tagalog para sa preposisyon at panghalip.
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ang nakaugaliang biblikal at propetikong parirala nang hindi ito nililimitahan sa mas interpretatibong “mensahe.”
- source_word: וּשְׁמוּאֵל
  choice: si Samuel
  rationale: Hindi kailangang tumbasan nang mekanikal ang waw; natural sa Tagalog ang tuwirang pagsisimula sa paksa sa paliwanag na pangungusap na ito.
theological_decisions:
- issue: Kahulugan ng hindi pa pagkakilala ni Samuel kay Yahweh
  choice: Panatilihin sa pangunahing teksto ang malawak na diwa ng “nakikilala,” habang nililinaw sa talababa ang kaugnayan nito sa personal na pagkilala o karanasan sa paghahayag.
  alternative: Hindi pa lubos na ignorante si Samuel tungkol kay Yahweh; o hindi pa siya espirituwal na napagbagong-loob.
  rationale: Iniuugnay mismo ng kasunod na sugnay ang pahayag sa hindi pa paghahayag ng salita ni Yahweh kay Samuel. Hindi dapat gawing tahasang doktrinal na pahayag ang higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nakikilala” upang mapanatili ang Hebreong idyoma at ambiguity; iniwasan ang artipisyal na panimulang “At” o “Ngayon.”
