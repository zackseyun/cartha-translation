reference: 1 Samuel 3:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֤א יְהוָה֙ וַ/יִּתְיַצַּ֔ב וַ/יִּקְרָ֥א כְ/פַֽעַם בְּ/פַ֖עַם שְׁמוּאֵ֣ל שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ דַּבֵּ֔ר כִּ֥י שֹׁמֵ֖עַ עַבְדֶּֽ/ךָ־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/010.yaml
  text: Then Yahweh came and stood there[a], and called as at the other times, “Samuel, Samuel!” And Samuel said, “Speak, for your servant is listening.”
translation:
  language: tl
  text: Pagkatapos, dumating si Yahweh at tumayo roon, at tumawag gaya ng mga naunang pagkakataon[a], “Samuel! Samuel!” At sinabi ni Samuel, “Magsalita po kayo, sapagkat nakikinig ang inyong lingkod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gaya ng dati.” Literal na inihahambing ng idyomang Hebreo ang pagtawag na ito sa mga naunang pagkakataon.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang natatanging pangalan ng Diyos sa pamamagitan ng karaniwang transliterasyong Filipino, sa halip na palitan ito ng isang titulo.
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Likas na salaysay sa Filipino para sa pagdating o paglapit na ipinahihiwatig ng בוא.
- source_word: וַיִּתְיַצַּב
  choice: tumayo roon
  rationale: Pinananatili ang kongkretong larawan ng pagtindig at pagharap sa isang lugar; ang “roon” ay likas na nagpapahayag ng presensiya sa tagpo.
- source_word: וַיִּקְרָא
  choice: tumawag
  rationale: Payak at angkop na katumbas para sa tinig na pagtawag kay Samuel, nang hindi pinalalakas ang himig bilang pagsigaw.
- source_word: כְפַעַם בְּפַעַם
  choice: gaya ng mga naunang pagkakataon
  rationale: Ipinahahayag ang paghahambing sa mga naunang paulit-ulit na pagtawag habang pinananatiling natural ang Filipino.
- source_word: שְׁמוּאֵל שְׁמוּאֵל
  choice: Samuel! Samuel!
  rationale: Pinananatili ang pag-uulit ng pangalan bilang mariin at personal na pagtawag.
- source_word: דַּבֵּר
  choice: Magsalita po kayo
  rationale: Tuwirang isinasalin ang pautos; ang “po kayo” ay natural na paraan sa modernong Filipino upang ipakita ang magalang at mapagpakumbabang tugon kay Yahweh.
- source_word: כִּי
  choice: sapagkat
  rationale: Pinananatili ang maikling ugnayang nagbibigay-dahilan sa sagot ni Samuel.
- source_word: שֹׁמֵעַ
  choice: nakikinig
  rationale: Ang participle ay nagpapahiwatig ng kasalukuyan at aktibong pakikinig, hindi lamang kakayahang makarinig.
- source_word: עַבְדֶּךָ
  choice: ang inyong lingkod
  rationale: Sa mapagpitagang pahayag na ito, ang עבד ay tumutukoy sa mapagpakumbabang paglilingkod at pagpapasakop; “lingkod” ang angkop na katumbas sa konteksto.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pagdating at pagtayo ni Yahweh
  choice: Panatilihin ang kongkretong pananalitang “dumating si Yahweh at tumayo roon.”
  alternative: Palambutin bilang “nagpakita” o “ipinadama ang kanyang presensiya.”
  rationale: Matingkad at personal ang pagsasalaysay ng Hebreo. Hindi ito dapat gawing abstrakto upang alisin ang likas na teolohikal na tensiyon ng teksto.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pinananatili ang banal na pangalan bilang pangalan at hindi ito pinapalitan ng titulo; ang “Yahweh” ay malinaw at karaniwang transliterasyon sa Filipino.
- issue: Paggalang sa tugon ni Samuel
  choice: Gamitin ang “po kayo” at “inyong” bilang likas na magalang na Filipino.
  alternative: 'Literal na isahan: “Magsalita ka, sapagkat nakikinig ang iyong lingkod.”'
  rationale: Walang pangmaramihang paggalang sa Hebreo, ngunit kinakailangan sa natural na modernong Filipino ang mga anyong ito upang maipahayag ang mapagpitagang tono nang hindi ipinahihiwatig na maramihan ang kausap.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang magalang na “po kayo/inyong” sa tuwirang pakikipag-usap kay Yahweh, at pinanatili ang kongkretong kilos at pag-uulit ng pangalan sa Hebreo.
