id: 1SA.3.19
reference: 1 Samuel 3:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּגְדַּ֖ל שְׁמוּאֵ֑ל וַֽ/יהוָה֙ הָיָ֣ה עִמּ֔/וֹ וְ/לֹֽא הִפִּ֥יל מִ/כָּל דְּבָרָ֖י/ו אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/019.yaml
  text: And Samuel grew[a], and Yahweh was with him and let none of his words fall to the ground.
translation:
  language: tl
  text: At lumaki si Samuel. Kasama niya si Yahweh, at hindi Niya hinayaang malaglag sa lupa ang alinman sa mga salita ni Samuel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi Niya hinayaang mabigo ang alinman sa mga salita ni Samuel.” Literal sa Hebreo, “hindi Niya hinayaang malaglag sa lupa ang alinman sa kanyang mga salita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: lumaki
  rationale: Ipinahahayag ng גדל ang patuloy na paglaki at paghinog ni Samuel. Maikli at likas ang “lumaki” at hindi nito nililimitahan ang diwa sa pisikal na pagtanda o sa pagtaas lamang ng katayuan.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Karaniwang anyo ng pangalan sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang tetragrammaton bilang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: הָיָה עִמּוֹ
  choice: Kasama niya
  rationale: Likas na Tagalog para sa “was with him,” habang pinananatili ang diwa ng presensiya at pagsang-ayon ni Yahweh kay Samuel.
- source_word: וְלֹא הִפִּיל
  choice: hindi Niya hinayaang malaglag
  rationale: Ipinapakita ng Hiphil ng נפל na hindi pinahintulutan ni Yahweh na mahulog o mabigo ang mga salita ni Samuel. Pinananatili ng salin ang sanhi at ang larawan ng Hebreong idyoma.
- source_word: מִכָּל דְּבָרָיו
  choice: ang alinman sa mga salita ni Samuel
  rationale: Ang literal na “mula sa lahat ng kanyang mga salita” ay nangangahulugang walang isa man sa mga iyon. Ginawang tahasan ang “ni Samuel” upang maiwasan ang malabong reperensiya ng panghalip sa Tagalog, ayon sa konteksto.
- source_word: אָרְצָה
  choice: sa lupa
  rationale: Pinananatili nito ang direksiyonal at matalinghagang larawan ng mga salitang nahuhulog sa lupa at hindi nagkakatotoo o nabibigo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Diwa ng idyomang “hindi hinayaang malaglag sa lupa ang alinman sa kanyang mga salita”
  choice: Pinanatili ang Hebreong larawan sa pangunahing teksto
  alternative: Hindi Niya hinayaang mabigo ang alinman sa mga salita ni Samuel; tinupad Niya ang lahat ng sinabi ni Samuel
  rationale: Ipinakikita ng konteksto ang pagiging mapagkakatiwalaan ni Samuel bilang propeta, ngunit mas malawak at masining ang mismong idyoma. Ang pagpapanatili rito ay umiiwas sa pagpapakitid nito tungo lamang sa mga hula o prediksiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang payak na ayos ng salaysay at ang Hebreong idyoma. Ginamit ang “ni Samuel” sa halip na isang malabong panghalip, at inilagay ang talababa sa idyomang aktuwal nitong ipinapaliwanag.
