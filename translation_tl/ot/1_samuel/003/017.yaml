base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/017.yaml
  text: And he said[a], “What is the word that he spoke to you? Please do not hide it from me. May God do so to you, and more also, if you hide from me a word of all the word that he spoke to you.”
translation:
  language: tl
  text: At sinabi niya, “Ano ang salitang sinabi niya sa iyo? Huwag mo sanang ilihim iyon sa akin. Gawin nawa sa iyo ng Diyos ang gayon at higit pa, kung ililihim mo sa akin ang kahit isang salita sa lahat ng sinabi niya sa iyo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na anyo: “kung ililihim mo sa akin ang isang salita mula sa buong salita na sinabi niya sa iyo.”'
    reason: Ipinakikita ang isahang anyo at pag-uulit ng דָּבָר sa Hebreo, na sadyang pinakinis sa pangunahing salin para sa likas na Tagalog.
lexical_decisions:
- source_word: מָה הַדָּבָר
  choice: Ano ang salita
  rationale: Ang דָּבָר ay maaaring mangahulugang “salita,” “bagay,” o “mensahe.” Pinili ang “salita” upang mapanatili ang tematikong ugnayan sa pagsasalita ng Diyos at ang pag-uulit ng salita sa talata.
- source_word: דִּבֶּר אֵלֶיךָ
  choice: sinabi niya sa iyo
  rationale: Bagaman literal na “sinalita niya sa iyo,” ang “sinabi niya sa iyo” ang likas na modernong Tagalog at malinaw na nagpapahayag ng kilos ng דּבר.
- source_word: אַל נָא תְכַחֵד מִמֶּנִּי
  choice: Huwag mo sanang ilihim iyon sa akin
  rationale: Ang “ilihim” ay natural na katumbas ng כחד, at ipinahahayag ng “sana” ang pakiusap na nasa נָא nang hindi pinahihina ang mariing tono.
- source_word: כֹּה יַעֲשֶׂה לְּךָ אֱלֹהִים וְכֹה יוֹסִיף
  choice: Gawin nawa sa iyo ng Diyos ang gayon at higit pa
  rationale: Pinananatili nito ang sumpang pormula at ang di-tiyak na kapahamakang ipinahihiwatig ng Hebreo, sa halip na tukuyin kung ano ang gagawin ng Diyos.
- source_word: תְּכַחֵד מִמֶּנִּי דָּבָר מִכָּל הַדָּבָר
  choice: ililihim mo sa akin ang kahit isang salita sa lahat ng sinabi niya sa iyo
  rationale: Ang “kahit isang salita” ay nagpapanatili sa isahang דָּבָר at sa diin na walang anumang bahagi ang dapat itago; ang “sa lahat ng sinabi niya” ay mas natural sa Tagalog kaysa sa kahoy na “mula sa buong salita.”
theological_decisions:
- issue: Paglalarawan sa אֱלֹהִים sa pormula ng panunumpa
  choice: Diyos
  alternative: mga diyos
  rationale: Sa konteksto, tinutukoy ni Eli ang Diyos ng Israel sa isang karaniwang pormula ng sumpa. Ang “mga diyos” ay magpapahiwatig ng politeismong wala sa konteksto.
- issue: Di-tiyak na nilalaman ng sumpa
  choice: ang gayon at higit pa
  alternative: parusahan ka ng Diyos nang mabigat
  rationale: Hindi tahasang binabanggit ng Hebreo ang partikular na parusa. Pinananatili ng salin ang sadyang di-tiyak at maringal na pormula sa halip na dagdagan ang teksto.
translation_notes:
  register: Makabago at dignidad na Tagalog. Ginamit ang “salita” upang mapanatili ang mahalagang pag-uulit sa Hebreo, ngunit pinakinis ang huling parirala upang maging malinaw sa karaniwang mambabasa. Ang “gayon at higit pa” ay sadyang bahagyang pormal dahil isa itong sinaunang pormula ng sumpa.
