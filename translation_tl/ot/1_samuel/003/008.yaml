  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨סֶף יְהוָ֥ה קְרֹא שְׁמוּאֵל֮ בַּ/שְּׁלִשִׁית֒ וַ/יָּ֨קָם֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יָּ֣בֶן עֵלִ֔י כִּ֥י יְהוָ֖ה קֹרֵ֥א לַ/נָּֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/008.yaml
  text: And Yahweh called Samuel again a third time. So he got up and went to Eli and said, “Here I am, for you called me.” Then Eli understood that Yahweh was calling the boy.
translation:
  language: tl
  text: Muling tinawag ni Yahweh si Samuel sa ikatlong pagkakataon. Kaya bumangon siya, pumunta kay Eli, at sinabi, “Narito po ako, dahil tinawag ninyo ako.” Nang magkagayon, naunawaan ni Eli na si Yahweh ang tumatawag sa bata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף ... קְרֹא
  choice: Muling tinawag
  rationale: Ang יָסַף na may kasunod na infinitive ay idyomang nagsasaad ng pag-uulit. Likas at malinaw sa Tagalog ang “muling tinawag.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בַּשְּׁלִשִׁית
  choice: sa ikatlong pagkakataon
  rationale: Tumpak nitong ipinahahayag na ito ang ikatlong paglitaw ng pagtawag at natural ito sa makabagong Tagalog.
- source_word: וַיָּקָם
  choice: bumangon siya
  rationale: Karaniwan at malinaw na salin ng pagkilos na pagbangon mula sa pagkakahiga o pamamahinga.
- source_word: וַיֵּלֶךְ אֶל־עֵלִי
  choice: pumunta kay Eli
  rationale: Direktang ipinapahayag ang pagkilos patungo kay Eli sa natural na Tagalog.
- source_word: הִנְנִי
  choice: Narito po ako
  rationale: Ang “Narito ako” ang karaniwang tugon sa isang pagtawag; idinagdag ang “po” bilang likas na paggalang ng batang si Samuel kay Eli, nang hindi binabago ang diwa ng kahandaang tumugon.
- source_word: כִּי קָרָאתָ לִי
  choice: dahil tinawag ninyo ako
  rationale: Dahilan ang gamit ng כִּי rito. Ang “ninyo” ay magalang na pang-isahan sa konteksto at hindi nagpapahiwatig na marami ang kausap.
- source_word: וַיָּבֶן
  choice: naunawaan
  rationale: Ipinapahayag ng בִּין ang pagkaunawa ni Eli sa tunay na nangyayari; hindi kailangan ang mas interpretatibong “napagtanto.”
- source_word: קֹרֵא
  choice: ang tumatawag
  rationale: Ang participle ay nagpapakita ng nagpapatuloy o kasalukuyang pagtawag sa loob ng tagpo; pinananatili ito ng nominal na pariralang Tagalog.
- source_word: לַנָּעַר
  choice: sa bata
  rationale: Malawak ang saklaw ng נַעַר, ngunit sa tagpong ito ay inilalarawan si Samuel bilang batang nasa pangangalaga ni Eli. Ang “bata” ay natural at angkop.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga anyong magalang na “po” at “ninyo” sa pananalita ni Samuel kay Eli dahil likas ito sa ugnayan nila sa Tagalog. Walang kinakailangang talababa sa talatang ito.
