base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/018.yaml
  text: So Samuel told him all the words and hid nothing from him[a]. And he said, “He is Yahweh[b]; let him do what is good in his eyes.”
translation:
  language: tl
  text: At sinabi ni Samuel sa kanya ang lahat ng salita, at wala siyang itinago sa kanya. At sinabi niya, “Si Yahweh nga siya; gawin niya[a] ang mabuti sa kanyang paningin[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “gagawin niya.” Ang anyong Hebreo ay maaaring unawain bilang mapagpasakop na hangarin (“gawin niya”) o bilang payak na pahayag tungkol sa hinaharap.'
    reason: alternative_reading
  - marker: b
    text: Ang Hebreo ay literal na “sa kanyang mga mata,” isang idyomang nangangahulugang ayon sa sarili niyang paghatol o kung ano ang minamabuti niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד לוֹ שְׁמוּאֵל
  choice: sinabi sa kanya ni Samuel
  rationale: Ang Hifil ng נגד ay nangangahulugang sabihin, iulat, o ipaalam. Natural sa modernong Tagalog ang ayos na ito at malinaw na si Samuel ang nagsabi.
- source_word: אֶת כָּל הַדְּבָרִים
  choice: ang lahat ng sinabi
  rationale: Maaaring tumukoy ang דְּבָרִים sa mga salita o mga bagay. Sa konteksto, ang tinutukoy ay ang buong mensaheng ipinahayag kay Samuel; pinananatili ng “lahat ng sinabi” ang ugnayan nito sa mga salitang narinig niya nang hindi nagiging mekanikal.
- source_word: וְלֹא כִחֵד מִמֶּנּוּ
  choice: at wala siyang itinago sa kanya
  rationale: Ang כחד ay nangangahulugang magkubli o maglihim ng impormasyon. Idiomatiko at tuwiran sa Tagalog ang “wala siyang itinago,” at ipinapakita nito ang lubos na pagsisiwalat.
- source_word: יְהוָה הוּא
  choice: Si Yahweh siya
  rationale: Pinananatili ang personal na pangalang יהוה bilang “Yahweh.” Ang nauunang pangalang “Yahweh” at hulíng panghalip sa Tagalog ay nagbibigay-diin sa pagkakakilanlan niya, gaya ng Hebreong sugnay.
- source_word: הַטּוֹב
  choice: ang mabuti
  rationale: Tuwirang katumbas ito ng “ang mabuti,” habang ang kasunod na pariralang “sa kanyang paningin” ang naglalahad kung kaninong pagtataya ang tinutukoy.
- source_word: בְּעֵינָיו
  choice: sa kanyang paningin
  rationale: Pinananatili nito ang Hebreong idyomang literal na “sa kanyang mga mata,” ngunit gumagamit ng natural at marangal na ekspresyon sa Tagalog.
- source_word: יַעֲשֶׂה
  choice: gawin niya
  rationale: Ang imperfect ay maaaring magkaroon dito ng puwersang naghahayag ng mapagpakumbabang pagsang-ayon o maaari ring basahin bilang payak na hinaharap. Ang “gawin niya” ay natural na naghahatid ng unang pagbasa, at inilalagay sa talababa ang lehitimong alternatibo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Puwersa ng pangwakas na יַעֲשֶׂה
  choice: 'Mapagpasakop na pahayag: “gawin niya”'
  alternative: 'Pahayag tungkol sa hinaharap: “gagawin niya”'
  rationale: Ang tugon sa ipinahayag na hatol ay angkop unawain bilang mapagpasakop na pagtanggap, ngunit hindi tiyak sa morpolohiya lamang ang puwersa ng imperfect. Kaya pinanatili sa talababa ang alternatibong pagbasa.
- issue: Hindi tahasang paksa ng וַיֹּאמַר
  choice: “Sinabi niya”
  alternative: “Sinabi ni Eli”
  rationale: Hindi inuulit ng talata ang pangalang Eli, bagaman malinaw siya sa konteksto. Pinananatili ng panghalip ang anyo at bahagyang implicit na katangian ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Si Yahweh siya” upang mapanatili ang diin ng Hebreo nang hindi nagiging artipisyal; iniwasan ang mas lumang “ikinubli” pabor sa natural na “itinago.”
