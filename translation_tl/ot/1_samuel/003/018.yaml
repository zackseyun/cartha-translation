  to: At sinabi ni Samuel sa kanya ang lahat ng salita, at wala siyang itinago sa kanya. At sinabi niya, “Si Yahweh nga siya; gawin niya[a] ang mabuti sa kanyang paningin[b].”
  rationale: Inalis ang di-tahasang sanhi-bungang “Kaya,” ginawang mas malapit sa כָּל הַדְּבָרִים ang “lahat ng salita,” at pinakinis ang emphatic na pagpapakilala kay Yahweh sa “Si Yahweh nga siya.” Pinanatili ang sinadyang di-pagbanggit kay Eli sa pangalawang “sinabi niya,” ang mapagpasakop na pangunahing pagbasa ng יַעֲשֶׂה, at ang mga umiiral na talababa na may wastong mga anchor.
