  naturalness: Mas natural at malinaw sa modernong Filipino ang “Sinabi ni Samuel sa kanya ang lahat ng salita” kaysa “sinabi sa kanya ni Samuel ang lahat ng sinabi.” Ang “Si Yahweh nga siya” ay isang likas na paraan upang maipahayag ang diin ng Hebreong יהוה הוא nang hindi nagiging putol o artipisyal.
