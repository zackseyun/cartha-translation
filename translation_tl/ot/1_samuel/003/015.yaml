id: 1SA.3.15
reference: 1 Samuel 3:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב שְׁמוּאֵל֙ עַד הַ/בֹּ֔קֶר וַ/יִּפְתַּ֖ח אֶת דַּלְת֣וֹת בֵּית יְהוָ֑ה וּ/שְׁמוּאֵ֣ל יָרֵ֔א מֵ/הַגִּ֥יד אֶת הַ/מַּרְאָ֖ה אֶל עֵלִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/015.yaml
  text: Samuel lay down until morning; then he opened the doors of the house of Yahweh[a]. But Samuel was afraid to tell the vision to Eli.
translation:
  language: tl
  text: Humiga si Samuel hanggang umaga. Pagkatapos, binuksan niya ang mga pinto ng bahay ni Yahweh. Ngunit natakot si Samuel na sabihin kay Eli ang pangitain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagpapakita.” Ang salitang Hebreo na mar’ah ay maaaring tumukoy sa isang pagpapakita o sa isang paghahayag sa pangitain. Sa kontekstong ito, mas angkop ang “pangitain” para sa paghahayag na tinanggap ni Samuel sa gabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: Humiga
  rationale: Pinananatili ang payak na kahulugang ‘humiga’ at hindi ipinapalagay na nakatulog si Samuel pagkatapos ng paghahayag.
- source_word: עַד הַבֹּקֶר
  choice: hanggang umaga
  rationale: Natural na salin ng pariralang panahunan sa modernong Tagalog.
- source_word: וַיִּפְתַּח
  choice: binuksan niya
  rationale: Tuwirang inilalarawan ang kasunod na kilos sa salaysay nang hindi nagdaragdag ng paggalaw na wala sa Hebreo.
- source_word: דַּלְתוֹת
  choice: mga pinto
  rationale: Pinananatili ang anyong maramihan ng pangngalang Hebreo.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Tapat sa literal at karaniwang pariralang ‘bahay ni Yahweh’; iniiwasan ang mas tiyak at posibleng anakronistikong ‘templo.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili bilang pangalang pantangi ang pangalan ng Diyos sa tekstong Hebreo.
- source_word: יָרֵא
  choice: natakot
  rationale: Natural at tuwirang ipinahahayag ang takot ni Samuel.
- source_word: מֵהַגִּיד
  choice: na sabihin
  rationale: Idyomatikong Tagalog para sa takot na gawin ang kilos ng pagsasabi o pag-uulat.
- source_word: הַמַּרְאָה
  choice: ang pangitain
  rationale: Sa konteksto, tumutukoy ito sa mapaghayag na karanasan ni Samuel; gayunman, maaaring mangahulugan din ang salita ng ‘pagpapakita.’
- source_word: אֶל עֵלִי
  choice: kay Eli
  rationale: Natural na Tagalog para sa taong pinagsasabihan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Direktang ginagamit ng talata ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang natatanging pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Pag-unawa sa הַמַּרְאָה
  choice: pangitain
  alternative: pagpapakita
  rationale: Ang konteksto ng paghahayag kay Samuel sa gabi ay pumapabor sa ‘pangitain,’ ngunit hindi inaalis ang leksikal na posibilidad na ‘pagpapakita,’ kaya itinatala ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang ‘Humiga’ sa halip na ‘natulog’ upang huwag magdagdag ng detalyeng hindi tahasang sinasabi ng Hebreo; ‘bahay ni Yahweh’ ang pinili sa halip na ‘templo.’
