  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל שְׁמוּאֵ֔ל הִנֵּ֧ה אָנֹכִ֛י עֹשֶׂ֥ה דָבָ֖ר בְּ/יִשְׂרָאֵ֑ל אֲשֶׁר֙ כָּל שֹׁ֣מְע֔/וֹ תְּצִלֶּ֖ינָה שְׁתֵּ֥י אָזְנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/011.yaml
  text: Then the LORD said to Samuel, "Look, I am about to do a thing in Israel that will make both ears of everyone who hears of it tingle."
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Samuel, “Tingnan mo, gagawa ako ng isang bagay sa Israel na magpapangilabot sa sinumang makarinig nito.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “na magpapanginig sa dalawang tainga ng bawat makarinig nito.”'
    reason: Pinananatili ang matingkad na Hebreong idyoma na pinasimple sa natural na pangunahing teksto.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang personal na pangalan ng Diyos bilang “Yahweh” upang maipakita ang pagkakaiba nito sa karaniwang titulong “Panginoon.”
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Likas at tuwirang panawag-pansin kay Samuel; pinananatili ang diin ng Hebreong הִנֵּה.
- source_word: אָנֹכִי עֹשֶׂה דָבָר
  choice: gagawa ako ng isang bagay
  rationale: Pinananatili ang sadyang malawak na kahulugan ng דָבָר at ang nalalapit na kilos na ipinahihiwatig ng konteksto.
- source_word: תְּצִלֶּינָה שְׁתֵּי אָזְנָיו
  choice: magpapangilabot sa sinumang makarinig nito
  rationale: Natural na idyomang Filipino para sa matinding pagkagulat o pagkasindak; ang literal na larawan ng dalawang tainga ay inilagay sa talababa.
theological_decisions:
- issue: Pagtukoy sa Diyos sa pamamagitan ng Tetragrammaton
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ang “Yahweh” ay tuwirang kumakatawan sa pangalang יהוה nang hindi ito pinapalitan ng isang titulo.
- issue: Hindi pa tinutukoy na gagawin ng Diyos
  choice: isang bagay
  alternative: isang kakila-kilabot na bagay
  rationale: Hindi tahasang inilalarawan ng talata ang דָבָר bilang “kakila-kilabot”; pinanatili ang tensiyon at hinayaang ang kasunod na pahayag ang maglinaw.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “sinabi,” “gagawa,” at “sinumang makarinig” bilang mga karaniwang anyo; iniwasan ang arkaikong “narito” at ang hindi natural na literal na pahayag tungkol sa dalawang tainga.
