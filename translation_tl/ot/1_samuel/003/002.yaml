base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/002.yaml
  text: On that day[a], Eli was lying down in his place, and his eyes had begun to grow dim; he could not see.
translation:
  language: tl
  text: Noong araw na iyon, nakahiga si Eli sa kanyang lugar. Nagsimula nang lumabo ang kanyang mga mata[a], at hindi na siya makakita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanyang mata ay nagsimula nang lumabo.” Maaaring unawain ang anyong Hebreo bilang kolektibong pagtukoy sa paningin, kaya “mga mata” ang nasa pangunahing teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[isinama sa daloy ng salaysay nang walang hiwalay na katumbas]'
  rationale: Ang anyong ito ay nagsisilbing panandang pasalaysay. Sa makabagong Tagalog, hindi kailangang isalin bilang “at nangyari” dahil magiging mabigat at hindi likas ang pangungusap.
- source_word: בַּיּוֹם הַהוּא
  choice: Noong araw na iyon
  rationale: Tuwirang ipinahahayag ang takdang panahong tinutukoy ng pariralang Hebreo, sa natural na ayos ng Tagalog.
- source_word: שֹׁכֵב
  choice: nakahiga
  rationale: Ipinakikita ng participle ang nagpapatuloy na kalagayan ni Eli; ang “nakahiga” ang likas at malinaw na katumbas sa Tagalog.
- source_word: בִּמְקֹמוֹ
  choice: sa kanyang lugar
  rationale: Pinananatili ang malawak na kahulugan ng מָקוֹם at hindi ito nililimitahan sa “silid,” na hindi tahasang sinasabi ng teksto.
- source_word: וְעֵינוֹ
  choice: ang kanyang mga mata
  rationale: Bagaman maaaring maunawaan bilang anyong isahan o kolektibo, tumutukoy ito sa paningin ni Eli; mas natural sa Tagalog ang maramihang “mga mata.” Nananatili sa talababa ang tunay na alternatibo.
- source_word: הֵחֵלּוּ כֵהוֹת
  choice: Nagsimula nang lumabo
  rationale: Naipahahayag nito kapwa ang pagsisimula at ang unti-unting paghina ng paningin.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: hindi na siya makakita
  rationale: Direkta at natural nitong inilalarawan ang bunga ng lumalabong paningin. Ang “na” ay angkop sa konteksto ng pagbabagong nagsimula na.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang makalumang pormulang “at nangyari” at ang labis na pagtukoy sa lugar bilang isang silid. Inilipat ang talababa sa “mga mata,” ang mismong salitang tinatalakay nito.
