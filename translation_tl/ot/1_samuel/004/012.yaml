base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/012.yaml
  text: Then a man of Benjamin ran from the battle line and came to Shiloh that same day[b][a], with his clothes torn and dirt on his head.
translation:
  language: tl
  text: Pagkatapos, isang lalaki mula sa lipi ni Benjamin ang tumakbo mula sa hanay ng labanan[a] at dumating sa Shilo nang araw ding iyon. Punit ang kanyang mga damit at may lupa sa kanyang ulo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa labanan” o “mula sa hanay ng mga mandirigma.” Ang salitang Hebreo ay mas tiyak na tumutukoy sa nakaayos na hanay o linya ng labanan.
    reason: lexical_alternative
  - marker: b
    text: Ang pagpunit ng damit at paglalagay ng lupa sa ulo ay nakaugaliang mga tanda ng pagluluksa, matinding dalamhati, o kapahamakan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּרָץ
  choice: tumakbo
  rationale: Payak at tuwirang katumbas ng רוץ; hindi ipinapalagay ang motibong 'tumakas,' na hindi tahasang sinasabi ng pandiwa.
- source_word: אִישׁ בִּנְיָמִן
  choice: isang lalaking mula sa Benjamin
  rationale: Malinaw na ipinahahayag ang pagkakakilanlan niya sa lipi ng Benjamin nang hindi gumagamit ng di-gaanong karaniwang katawagang 'Benjaminita.'
- source_word: מֵהַמַּעֲרָכָה
  choice: mula sa hanay ng labanan
  rationale: Ipinananatili ang mas tiyak na diwa ng מַעֲרָכָה bilang nakaayos na hanay o linya ng mga mandirigma, hindi lamang ang pangkalahatang pangyayaring labanan.
- source_word: וַיָּבֹא שִׁלֹה
  choice: dumating sa Shilo
  rationale: Likas na salaysay sa Filipino para sa pandiwang בוא na may tinutukoy na destinasyon.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw ding iyon
  rationale: Likas na Filipino para sa literal na 'sa araw na iyon' at malinaw na naghahatid ng agarang pagpapatuloy ng panahon.
- source_word: וּמַדָּיו קְרֻעִים
  choice: punit ang kanyang mga damit
  rationale: Ang מַדִּים ay tumutukoy sa kasuutan o mga damit, at ang קְרֻעִים ay nagsasaad na punit ang mga ito; natural at marangal ang pagkakasabi sa Filipino.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: at may lupa sa kanyang ulo
  rationale: Pinananatili ang leksikal na diwa ng אֲדָמָה bilang lupa, sa halip na gawing mas tiyak na 'alikabok.'
