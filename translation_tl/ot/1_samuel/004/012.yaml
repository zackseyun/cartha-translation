translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'hanay ng labanan' upang mapanatili ang tiyak na larawang militar ng Hebreo, at 'lupa' upang hindi gawing mas tiyak kaysa sa אֲדָמָה. Inilagay ang mga panandang talababa kaagad pagkatapos ng bahaging nililinaw ng bawat tala.
