  text: וַ/יֹּ֨אמֶר הָ/אִ֜ישׁ אֶל עֵלִ֗י אָֽנֹכִי֙ הַ/בָּ֣א מִן הַ/מַּעֲרָכָ֔ה וַ/אֲנִ֕י מִן הַ/מַּעֲרָכָ֖ה נַ֣סְתִּי הַ/יּ֑וֹם וַ/יֹּ֛אמֶר מֶֽה הָיָ֥ה הַ/דָּבָ֖ר בְּנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/016.yaml
  text: The man said to Eli[a], “I am the one who came from the battle line, and I fled from the battle line today.” And he said, “What happened, my son?”
translation:
  language: tl
  text: Sinabi ng lalaki kay Eli, “Ako ang nanggaling sa hanay ng labanan[a], at tumakas ako mula sa hanay ng labanan ngayong araw.” Sinabi ni Eli, “Ano ang nangyari, anak ko?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa labanan,” “mula sa mga hanay,” o “mula sa kampo.” Ang salitang Hebreo ay tumutukoy sa nakaayos na hanay o pormasyon ng hukbo para sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Karaniwang salita ito para sa ‘lalaki.’ Bagaman tagapaghatid siya ng balita ayon sa konteksto, hindi espesipikong salitang ‘mensahero’ ang ginamit sa Hebreo.
- source_word: הַבָּא
  choice: ang nanggaling
  rationale: Ang participle kasama ng אָנֹכִי ay nagpapakilala sa nagsasalita. Likas sa modernong Tagalog ang ‘Ako ang nanggaling’ dahil nakarating na siya kay Eli.
- source_word: מִן הַמַּעֲרָכָה
  choice: mula sa hanay ng labanan
  rationale: Ang מַעֲרָכָה ay tumutukoy sa nakaayos na hanay o pormasyon ng hukbo para sa labanan, hindi lamang sa abstraktong pangyayaring ‘labanan.’
- source_word: נַסְתִּי
  choice: tumakas ako
  rationale: Tuwirang ipinapahayag ng נוּס ang pagtakas o pagtatanan mula sa panganib; hindi idinaragdag ang resultang diwa ng ‘nakaligtas.’
- source_word: הַיּוֹם
  choice: ngayong araw
  rationale: Malinaw nitong pinananatili na sa araw ding iyon naganap ang pagtakas; natural din sana ang ‘ngayon,’ ngunit mas tiyak dito ang ‘ngayong araw.’
- source_word: מֶה הָיָה הַדָּבָר
  choice: Ano ang nangyari
  rationale: Literal na ‘Ano ang naging bagay/pangyayari?’ ngunit ang idiomatikong tanong sa Tagalog para sa ulat ng naganap ay ‘Ano ang nangyari?’
- source_word: בְּנִי
  choice: anak ko
  rationale: Pinananatili nito ang tahasang hulaping paari at ang magalang o mapagmahal na pagtawag ni Eli sa nakababatang lalaki.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘hanay ng labanan’ upang mapanatili ang militar na diwa ng מַעֲרָכָה, at pinaikli sa ‘mula roon’ ang ikalawang pagbanggit upang maging natural nang hindi nawawala ang tinutukoy.
