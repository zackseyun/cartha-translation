  text: וַ/יִּֽרְאוּ֙ הַ/פְּלִשְׁתִּ֔ים כִּ֣י אָמְר֔וּ בָּ֥א אֱלֹהִ֖ים אֶל הַֽ/מַּחֲנֶ֑ה וַ/יֹּאמְרוּ֙ א֣וֹי לָ֔/נוּ כִּ֣י לֹ֥א הָיְתָ֛ה כָּ/זֹ֖את אֶתְמ֥וֹל שִׁלְשֹֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/007.yaml
  text: The Philistines were afraid[a], for they said, “God has come into the camp.” And they said, “Woe to us! For nothing like this has happened before.”
translation:
  language: tl
  text: Natakot ang mga Filisteo[a], sapagkat sinabi nila, “Dumating ang Diyos sa kampo.” At sinabi nila, “Kawawa tayo! Wala pang nangyaring ganito noon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang diyos ang dumating sa kampo.” Maramihan ang anyo ng pangngalang Hebreo, ngunit isahan ang pandiwang kasama nito, kaya sinusuportahan nito ang saling “ang Diyos” sa pangunahing teksto.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּֽרְאוּ
  choice: Natakot
  rationale: Ang anyong wayyiqtol ng ירא ay nagsasaad ng agarang takot ng mga Filisteo; natural at tuwiran ang “natakot” sa makabagong Tagalog.
- source_word: הַפְּלִשְׁתִּים
  choice: ang mga Filisteo
  rationale: Karaniwang katawagang Tagalog sa pangkat-etnikong Philistines.
- source_word: כִּי אָמְרוּ
  choice: sapagkat sinabi nila
  rationale: Ipinakikilala ng כִּי ang dahilan ng kanilang pagkatakot, at ang simpleng “sinabi nila” ay angkop sa daloy ng salaysay.
- source_word: בָּא אֱלֹהִים
  choice: Dumating ang Diyos
  rationale: Bagaman maramihan ang anyo ng אֱלֹהִים, isahan ang pandiwang בָּא, kaya higit na sinusuportahan ng gramatika ang isahang “Diyos.” Pinananatili sa talababa ang posibleng “isang diyos.”
- source_word: אֶל הַמַּחֲנֶה
  choice: sa kampo
  rationale: Sa Tagalog, likas na naipahihiwatig ng pandiwang “dumating” at ng “sa kampo” ang pagpasok o pagdating sa loob ng kampo; iniiwasan nito ang mas mabigat na “papasok sa kampo.”
- source_word: אוֹי לָנוּ
  choice: Kahabag-habag tayo!
  rationale: Isang natural ngunit marangal na sigaw ng matinding pangamba at kapahamakan; mas madaling maunawaan kaysa sa arkaikong “Sa aba natin.”
- source_word: לֹא הָיְתָה כָּזֹאת
  choice: Wala pang nangyaring ganito
  rationale: Idyomatikong Tagalog na malinaw na nagpapahayag na walang kaparis na pangyayaring naganap dati.
- source_word: אֶתְמוֹל שִׁלְשֹׁם
  choice: noon
  rationale: Ang tambalang Hebreo ay idyoma para sa nakaraang panahon o dati, hindi lamang literal na kahapon at kamakalawa; natural itong naihahatid ng “noon” kasabay ng “wala pang.”
theological_decisions:
- issue: Paglalarawan sa אֱלֹהִים sa pananalita ng mga Filisteo
  choice: ang Diyos
  alternative: isang diyos
  rationale: Pinapaboran ng isahang pandiwang בָּא ang isahang tinutukoy. Gayunman, pananalita ito ng mga Filisteo at maramihan sa morpolohiya ang אֱלֹהִים, kaya inilalahad sa talababa ang tunay na posibleng alternatibo sa halip na lubusang alisin ang tensiyon.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, dignified, at angkop sa salaysay. Ginamit ang “kampo,” isang karaniwan at madaling maunawaang salita. Ang “Kahabag-habag tayo!” ay nagpapanatili ng bigat ng sigaw nang hindi labis na arkaiko.
