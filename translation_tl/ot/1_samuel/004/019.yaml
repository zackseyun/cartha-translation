translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “Kaban ng Diyos” bilang pamilyar na katawagan sa ark at “Finehas” bilang natural na anyong Tagalog ng pangalan. Inilagay ang bawat talababa sa mismong pariralang nililinaw nito.
