revisions:
- from: Ang manugang niyang babae, na asawa ni Finehas, ay buntis at malapit nang manganak. Nang marinig niya ang balitang nakuha ang Kaban ng Diyos[a] at namatay ang kaniyang biyenan at asawa[b], napaluhod siya at nanganak, sapagkat biglang sumapit sa kaniya ang mga sakit ng panganganak.[c]
  to: Ang kaniyang manugang na babae, ang asawa ni Finehas, ay buntis at malapit nang manganak. Nang marinig niya ang balitang nabihag ang Kaban ng Diyos[a] at namatay ang kaniyang biyenan at asawa[b], yumuko siya at nanganak, sapagkat biglang sumapit sa kaniya ang mga sakit ng panganganak.[c]
  rationale: Inayos ang isang hindi likas na ayos ng parirala, pinalinaw ang pagkabihag ng Kaban nang hindi pinapangalanan ang kumuha nito, at pinalitan ang “napaluhod” ng mas malawak at mas ligtas na “yumuko.” Napanatili ang mga umiiral na angkla ng talababa at ang mga alternatibong pagbasa.
