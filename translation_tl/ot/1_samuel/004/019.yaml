base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/019.yaml
  text: His daughter-in-law[a], the wife of Phinehas, was pregnant, about to give birth. When she heard the report that the ark of God had been taken, and that her father-in-law and her husband were dead, she bowed down and gave birth[c][b], because her labor pains came upon her.
translation:
  language: tl
  text: Ang kaniyang manugang na babae, ang asawa ni Finehas, ay buntis at malapit nang manganak. Nang marinig niya ang balitang nabihag ang Kaban ng Diyos[a] at namatay ang kaniyang biyenan at asawa[b], yumuko siya at nanganak, sapagkat biglang sumapit sa kaniya ang mga sakit ng panganganak.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tungkol sa pagkabihag ng Kaban ng Diyos.” Maaaring ipakilala ng Hebreong kayarian ang nilalaman ng balita o ang paksa nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “at patay na ang kaniyang biyenan at asawa.” Maaaring unawain ang Hebreo bilang kalagayan o bilang naganap na pagkamatay.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sapagkat bumaling sa kaniya ang kaniyang mga kirot,” isang idyoma para sa biglang pagsapit ng mga sakit ng panganganak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַלָּתוֹ
  choice: Ang manugang niyang babae
  rationale: Ang כַּלָּה ay tumutukoy rito sa manugang na babae. Tahasang idinagdag ang “babae” upang maiwasan ang kalabuan ng salitang “manugang” sa modernong Filipino.
- source_word: אֵשֶׁת פִּינְחָס
  choice: na asawa ni Finehas
  rationale: Likas na appositive sa Filipino at malinaw na tinutukoy kung sino ang manugang.
- source_word: הָרָה לָלַת
  choice: ay buntis at malapit nang manganak
  rationale: Pinananatili ang kalagayan ng pagbubuntis at ang nalalapit na panganganak na ipinahihiwatig ng infinitive.
- source_word: וַתִּשְׁמַע אֶת־הַשְּׁמֻעָה
  choice: Nang marinig niya ang balita
  rationale: Ang שְׁמוּעָה ay “balita” o “ulat”; mas natural sa salaysay na Filipino ang “balita.”
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: na nakuha ang Kaban ng Diyos
  rationale: Ipinapahayag nito ang nilalaman ng balita at pinananatili ang passive na diwang ang Kaban ay napasakamay ng kaaway nang hindi nagdaragdag ng tahasang gumagawa.
- source_word: וּמֵת חָמִיהָ וְאִישָׁהּ
  choice: at namatay ang kaniyang biyenan at asawa
  rationale: Ang מֵת ay maaaring ilarawan bilang kalagayang patay o pangyayaring namatay. Natural sa Filipino ang pandiwang “namatay” sa iniulat na pangyayari.
- source_word: וַתִּכְרַע
  choice: napaluhod siya
  rationale: Ang כרע ay pagyuko, pagluhod, o pagbulusok. Sa konteksto ng biglang panganganak, ipinahihiwatig ng “napaluhod” ang pisikal na pagbaba nang hindi tiyakang sinasabing kusang yumuko o tuluyang bumagsak.
- source_word: וַתֵּלֶד
  choice: at nanganak
  rationale: Karaniwan at tuwirang modernong Filipino para sa Qal ng ילד kapag babae ang simuno.
- source_word: כִּי נֶהֶפְכוּ עָלֶיהָ צִרֶיהָ
  choice: sapagkat biglang sumapit sa kaniya ang mga sakit ng panganganak
  rationale: Ang צִרֶיהָ ay mga kirot ng panganganak. Ang idyomang נֶהֶפְכוּ עָלֶיהָ ay nagsasaad na bigla siyang dinatnan o sinakmal ng mga ito; “sumapit sa kaniya” ay natural ngunit pinananatili ang pagdating ng mga sakit.
