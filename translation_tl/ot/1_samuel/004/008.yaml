base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/008.yaml
  text: Woe to us! Who can deliver us from the hand of these mighty gods? These are the gods who struck Egypt with every plague in the wilderness[a][b].
translation:
  language: tl
  text: Kahabag-habag tayo! Sino ang makapagliligtas sa atin mula sa kamay ng makapangyarihang mga diyos na ito?[a] Sila ang mga diyos na humampas sa Ehipto sa pamamagitan ng bawat salot sa ilang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “makapangyarihang Diyos/mga diyos na ito.” Gumagamit ang mga Filisteo ng mga anyong pangmaramihan, na nagpapakita ng sarili nilang pagkaunawa sa Diyos ng Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo: “sa ilang.” Mahirap ang parirala sa konteksto sapagkat sinalot ang Ehipto bago naglakbay ang Israel sa ilang. Sinusunod dito ang nakasulat sa Masoretic Text.'
    reason: textual_variant
lexical_decisions:
- source_word: א֣וֹי לָ֔נוּ
  choice: Kawawa tayo!
  rationale: Likas at matindi itong panaghoy sa modernong Tagalog, at ipinahahayag ang takot at napipintong kapahamakan.
- source_word: מִ֣י יַצִּילֵ֔נוּ
  choice: Sino ang makapagliligtas sa atin
  rationale: Ang Hiphil ng נצל ay nangangahulugang magligtas o sumagip; ang 'makapagliligtas' ay nagpapanatili sa retorikal na diwa ng desperadong kawalan ng magagawa.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang malinaw na Hebreong metapora ng kamay bilang kapangyarihan o kontrol.
- source_word: הָאֱלֹהִים הָאַדִּירִים הָאֵלֶּה
  choice: makapangyarihang mga diyos na ito
  rationale: Ang pangmaramihang pang-uri at panghalip pamatlig, kasama ng pananaw ng mga Filisteo, ay pumapabor sa pangmaramihang salin; natural na katumbas ng אַדִּירִים ang 'makapangyarihan.'
- source_word: אֵלֶּה הֵם הָאֱלֹהִים
  choice: Sila ang mga diyos
  rationale: Natural na sugnay na nagpapakilala sa Tagalog, habang pinananatili ang pangmaramihang pananaw ng nagsasalita.
- source_word: הַמַּכִּים
  choice: na humampas
  rationale: Ginagamit ang pandiwaring Hebreo bilang sugnay na tumutukoy sa kilalang nakaraang pagkilos; ang 'humampas' ay nagpapanatili sa larawan ng מַכָּה at maaari ring tumukoy sa pagpasapit ng salot.
- source_word: אֶת מִצְרַיִם
  choice: sa Ehipto
  rationale: Ang Ehipto bilang lupain o sambayanan ang tuwirang layon; ito ang karaniwang anyo sa pagsasalaysay ng mga salot.
- source_word: בְּכָל מַכָּה
  choice: sa pamamagitan ng bawat salot
  rationale: Malapit sa literal na 'sa bawat salot/hampas' at pinananatili ang panlahat na saklaw nang hindi idinaragdag ang 'bawat uri.'
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Karaniwan at marangal na katumbas ng מִדְבָּר ang 'ilang'; hindi inaalis o pinapaliwanag sa mismong teksto ang mahirap na lokasyong ito.
theological_decisions:
- issue: Pagpapakahulugan sa אֱלֹהִים sa pananalita ng mga Filisteo
  choice: mga diyos
  alternative: Diyos; makapangyarihang Diyos/mga diyos
  rationale: Bagaman ang tinutukoy ay ang Diyos ng Israel, nagsasalita ang mga Filisteo ayon sa sarili nilang politeistikong pagkaunawa. Sinusuportahan din ng pangmaramihang pang-uri at pandiwari sa Hebreo ang pagpapanatili sa kanilang pananaw.
- issue: Mahirap na pariralang בַּמִּדְבָּר
  choice: sa ilang
  alternative: sa disyerto; alisin o ihanay ang parirala sa kasaysayan ng mga salot
  rationale: Malinaw na nasa Masoretic Text ang parirala kahit mahirap itong iugnay sa pagkakasunod ng mga pangyayari. Pinananatili ng salin ang tekstuwal at pangkasaysayang tensiyon sa halip na tahimik itong lutasin.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang Hebreong metapora na 'mula sa kamay,' ang pangmaramihang pananalita ng mga Filisteo, at ang mahirap na pariralang 'sa ilang.'
