id: 1SA.4.5
reference: 1 Samuel 4:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן בְּרִית יְהוָה֙ אֶל הַֽ/מַּחֲנֶ֔ה וַ/יָּרִ֥עוּ כָל יִשְׂרָאֵ֖ל תְּרוּעָ֣ה גְדוֹלָ֑ה וַ/תֵּהֹ֖ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/005.yaml
  text: When the ark of the covenant of Yahweh came into the camp[a], all Israel shouted with a great shout, and the earth resounded.
translation:
  language: tl
  text: Nang dumating sa kampo ang kaban ng tipan ni Yahweh, sumigaw nang napakalakas ang buong Israel, at umugong ang lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “at nayanig ang lupa.” Ang pandiwang Hebreo ay maaaring tumukoy sa dagundong o sa panginginig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: Nang dumating
  rationale: Likas na temporal na sugnay sa Tagalog na pinananatili ang kahulugang ‘nang dumating’ nang hindi isinasalin nang literal ang pormulang pasalaysay.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ang kaban ng tipan ni Yahweh
  rationale: 'Malinaw at natural na ipinapakita ang ugnayang construct: ang kaban na kaugnay ng tipan ni Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: הַמַּחֲנֶה
  choice: kampo
  rationale: Ito ang natural na katawagan sa isang kampong militar sa konteksto.
- source_word: וַיָּרִעוּ ... תְּרוּעָה גְדוֹלָה
  choice: sumigaw nang napakalakas
  rationale: Natural na inililipat sa Tagalog ang cognate construction at ang diin ng גְדוֹלָה nang hindi inuulit nang alanganin ang ‘sigaw.’
- source_word: כָל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Tapat at karaniwang paraan ng pagtukoy sa buong sambayanan.
- source_word: וַתֵּהֹם הָאָרֶץ
  choice: umugong ang lupa
  rationale: Naipahahayag ang malakas na pagalingawngaw o pagyanig na dulot ng sigaw, habang hindi tiyak na ipinapalagay na literal na lindol ang tinutukoy.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng ‘Yahweh’ ang pagkakakilanlan nito sa halip na palitan ng titulo.
- issue: Kung literal na lindol ang inilalarawan ng וַתֵּהֹם
  choice: umugong ang lupa
  alternative: nayanig ang lupa
  rationale: Maaaring tumukoy ang pandiwa sa dagundong, kaguluhan, o panginginig. Pinananatili ng ‘umugong’ ang puwersa ng sigawan nang hindi nilulutas ang pahayag bilang tiyak na lindol.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang ‘kaban ng tipan’ bilang pamilyar na terminong biblikal, at ‘umugong ang lupa’ upang mapanatili ang masiglang larawan at ang leksikal na kalabuan ng Hebreo.
