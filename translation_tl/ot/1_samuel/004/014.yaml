    issue: Nawawala ang katumbas ng קוֹל sa tanong ni Eli.
    rationale: Ang Hebreo ay literal na nagtatanong tungkol sa “tunog/ingay ng kaguluhang ito.” Ang “Ano ang kaguluhang ito?” ay tumutukoy lamang sa kaguluhan at inaalis ang naririnig na ingay na siyang paksa ng tanong.
  - severity: low
    issue: Ang “ang nangyari” ay idinagdag sa huling sugnay.
    rationale: Ang וַיַּגֵּד ay “nagsabi/nag-ulat/ipinaalam,” at hindi tahasang sinasabi ang layon. Hindi mali ang implikasyon, ngunit mas mainam na huwag idagdag ito sa isang optimal-equivalence na salin.
  revised_text: Nang marinig ni Eli ang ingay ng sigawan[a], sinabi niya, “Ano ang ingay ng kaguluhang ito?” At nagmadaling lumapit ang lalaki at nag-ulat kay Eli.
