  yaml_path: translation/ot/1_samuel/004/014.yaml
  text: When Eli heard the sound of the outcry[a], he said, “What is this sound of the uproar?” And the man hurried and came and told Eli.
translation:
  language: tl
  text: Nang marinig ni Eli ang ingay ng sigawan[a], sinabi niya, “Ano ang ingay ng kaguluhang ito?” At nagmadaling lumapit ang lalaki at nag-ulat kay Eli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hiyawan” o “malakas na sigaw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: ingay
  rationale: Bagaman maaaring mangahulugang “tunog,” “tinig,” o “ingay,” natural ang “ingay” sa Filipino para sa sama-samang sigawan at kaguluhan sa lungsod.
- source_word: הַצְּעָקָה
  choice: sigawan
  rationale: Tumutukoy ito sa malakas at madamdaming pag-iyak o pagsigaw. Ang “sigawan” ay malinaw at natural sa konteksto ng reaksiyon ng buong lungsod.
- source_word: מֶה קוֹל הֶהָמוֹן הַזֶּה
  choice: Ano ang kaguluhang ito?
  rationale: Ang tanong ay tungkol sa dahilan o likas ng maingay na kaguluhan. Iniiwasan ng likas na Filipino ang mabigat na literal na “Ano ang ingay ng kaguluhang ito?”
- source_word: הֶהָמוֹן
  choice: kaguluhan
  rationale: Saklaw ng salita ang maingay na pagkilos ng maraming tao; ang “kaguluhan” ay karaniwang salita at akma sa pampublikong pagkakaingay.
- source_word: וְהָאִישׁ
  choice: Nagmadali ang lalaki
  rationale: Pinananatili ang payak na “ang lalaki” sa Hebreo sa halip na idagdag ang interpretibong “mensahero.”
- source_word: מִהַר
  choice: nagmadali
  rationale: Direkta at makabagong katumbas ng pandiwang nangangahulugang kumilos nang mabilis.
- source_word: וַיָּבֹא
  choice: lumapit
  rationale: Literal itong “dumating/pumasok,” ngunit sa konteksto ay natural na ipinahihiwatig na lumapit ang lalaki kay Eli upang mag-ulat.
- source_word: וַיַּגֵּד לְעֵלִי
  choice: ibinalita kay Eli ang nangyari
  rationale: Ang Hifil ng נגד ay “ipaalam/ibalita.” Idinagdag ang “ang nangyari” bilang likas na layon sa Filipino, nang hindi tinutukoy ang nilalaman ng balita.
- source_word: עֵלִי
  choice: Eli
  rationale: Ginamit ang karaniwang anyo ng personal na pangalan sa Filipino Bible usage.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “sigawan” at “kaguluhan” upang mapanatili ang dalawang magkaugnay ngunit hindi ganap na magkaparehong paglalarawan sa ingay sa Hebreo.
