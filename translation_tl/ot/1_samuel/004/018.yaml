revisions:
- from: Nang mabanggit ng lalaki ang kaban ng Diyos, napahulog si Eli nang patalikod mula sa upuan sa tabi ng pintuang-bayan[a]. Nabali ang kanyang leeg at namatay siya, sapagkat matanda na siya at mabigat[b]. Apatnapung taon siyang humatol sa Israel.
  to: Nang mabanggit ng lalaki ang kaban ng Diyos, nahulog si Eli nang patalikod mula sa upuan sa tabi ng tarangkahan[a]. Nabali ang kanyang leeg at namatay siya, sapagkat matanda na siya at mabigat[b]. Apatnapung taon siyang humatol sa Israel.
  rationale: Pinalitan ang pandiwang maaaring magpahiwatig ng sanhi ng di-sinasadyang pagkahulog ng payak na “nahulog,” na mas tapat sa Hebreo at mas natural sa Filipino. Ginawang “tarangkahan” ang lokasyon at inihanay ang mga talababa rito. Hindi binago ang kahulugan o ang mga pangunahing terminong teolohikal.
