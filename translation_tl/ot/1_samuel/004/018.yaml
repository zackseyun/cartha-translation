    text: Literal na “mabigat.” Maaaring ipinahihiwatig na ang bigat ni Eli, kasama ng kanyang katandaan, ay nakadagdag sa nakamamatay na resulta ng pagkahulog.
    reason: lexical_alternative
  revision_rationale: Pinalitan ang pandiwang maaaring magpahiwatig ng sanhi ng di-sinasadyang pagkahulog ng payak na “nahulog,” na mas tapat sa Hebreo at mas natural sa Filipino. Ginawang “tarangkahan” ang lokasyon at inihanay ang mga talababa rito. Hindi binago ang kahulugan o ang mga pangunahing terminong teolohikal.
