  text: וַ/יְהִ֞י כְּ/הַזְכִּיר֣/וֹ אֶת אֲר֣וֹן הָ/אֱלֹהִ֗ים וַ/יִּפֹּ֣ל מֵֽ/עַל הַ֠/כִּסֵּא אֲחֹ֨רַנִּ֜ית בְּעַ֣ד יַ֣ד הַ/שַּׁ֗עַר וַ/תִּשָּׁבֵ֤ר מַפְרַקְתּ/וֹ֙ וַ/יָּמֹ֔ת כִּֽי זָקֵ֥ן הָ/אִ֖ישׁ וְ/כָבֵ֑ד וְ/ה֛וּא שָׁפַ֥ט אֶת יִשְׂרָאֵ֖ל אַרְבָּעִ֥ים שָׁנָֽה׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/018.yaml
  text: And it happened[a], when he mentioned the ark of God, that Eli fell backward from the seat by the side of the gate, and his neck was broken and he died, for the man was old and heavy[b]. And he had judged Israel forty years.
translation:
  language: tl
  text: Nang mabanggit ng lalaki ang kaban ng Diyos, nahulog si Eli nang patalikod mula sa upuan sa tabi ng tarangkahan[a]. Nabali ang kanyang leeg at namatay siya, sapagkat matanda na siya at mabigat[b]. Apatnapung taon siyang humatol sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa may tarangkahan.” Literal na tumutukoy ang Hebreong idyoma sa “kamay” o “tagiliran” ng tarangkahan.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mabigat.” Maaaring ipinahihiwatig na ang bigat ni Eli, kasama ng kanyang katandaan, ay nakadagdag sa nakamamatay na resulta ng pagkahulog.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהַזְכִּירוֹ
  choice: Nang mabanggit ng lalaki
  rationale: Ang Hiphil ng זכר ay nangangahulugang “banggitin.” Nililinaw ng “ng lalaki” na ang paksa ay ang mensaherong nagsasalita sa naunang konteksto, hindi si Eli.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ang kaban ng Diyos
  rationale: Tuwirang katumbas ng construct phrase at karaniwang tawag sa sagradong kaban sa salaysay.
- source_word: וַיִּפֹּל ... אֲחֹרַנִּית
  choice: napahulog si Eli nang patalikod
  rationale: Ipinahahayag ang bigla at di-sinasadyang pagkahulog, habang pinananatili ang direksiyong אֲחֹרַנִּית, “patalikod.”
- source_word: הַכִּסֵּא
  choice: upuan
  rationale: Neutral at natural na salin; hindi ipinahihiwatig ng konteksto ang isang trono.
- source_word: בְּעַד יַד הַשַּׁעַר
  choice: sa tabi ng pintuang-bayan
  rationale: Ang idyomang literal na may “kamay/tagiliran ng pintuang-bayan” ay lokatibo. Ang “sa tabi” ay malinaw at natural, samantalang ang “pintuang-bayan” ay angkop sa שַׁעַר bilang tarangkahan ng pamayanan.
- source_word: וַתִּשָּׁבֵר מַפְרַקְתּוֹ
  choice: Nabali ang kanyang leeg
  rationale: Natural na Filipino para sa pagkabali ng leeg o batok na tinutukoy ng מַפְרֶקֶת.
- source_word: כִּי זָקֵן הָאִישׁ וְכָבֵד
  choice: sapagkat matanda na siya at mabigat
  rationale: Pinananatili ang payak na kahulugan ng כָבֵד na “mabigat” at hindi ito pinapakahulugang “napakataba,” kahit maaaring nakatulong ang bigat niya sa nakamamatay na pagkahulog.
- source_word: שָׁפַט אֶת יִשְׂרָאֵל אַרְבָּעִים שָׁנָה
  choice: Apatnapung taon siyang humatol sa Israel
  rationale: Ang “humatol” ay nagpapanatili sa papel ng biblikal na hukom at sa buod ng natapos na panunungkulan ni Eli.
theological_decisions:
- issue: Kahulugan ng אֱלֹהִים sa אֲרוֹן הָאֱלֹהִים
  choice: Diyos
  alternative: mga diyos
  rationale: Sa konteksto, ang kaban ay nauukol sa Diyos ng Israel; kaya isahan ang tinutukoy.
- issue: Papel ni Eli sa שָׁפַט אֶת יִשְׂרָאֵל
  choice: humatol sa Israel
  alternative: namuno sa Israel bilang hukom
  rationale: Pinananatili ng “humatol” ang saklaw at bahagyang kaluwagan ng pandiwang שׁפט nang hindi ito nililimitahan sa modernong gawaing panghukuman o pinalalawak sa isang tiyak na uri ng pamamahala.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “kaban ng Diyos,” “pintuang-bayan,” at “humatol” upang mapanatili ang bokabularyong biblikal nang hindi nagiging lipas o teknikal. Nasa pangunahing teksto ang lahat ng panandang talababa.
