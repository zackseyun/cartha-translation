  yaml_path: translation/ot/1_samuel/004/011.yaml
  text: And the ark of God was captured, and the two sons of Eli died, Hophni and Phinehas.
translation:
  language: tl
  text: At ang Kaban ng Diyos ay nabihag, at namatay ang dalawang anak ni Eli, sina Hofni at Finehas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן אֱלֹהִים
  choice: ang Kaban ng Diyos
  rationale: Tuwirang inililipat ang pariralang konstrukto bilang kaban na nauukol sa Diyos. Ginamit ang malaking titik sa “Kaban” bilang katawagan sa sagradong kaban na tiyak sa konteksto.
- source_word: נִלְקָח
  choice: ay nabihag
  rationale: Ang Niphal ng לקח ay pasibo; sa konteksto ng labanan, ang “nabihag” ay malinaw at likas na nagpapahayag na nakuha ito ng kaaway.
- source_word: וּשְׁנֵי בְנֵי עֵלִי
  choice: at namatay ang dalawang anak ni Eli
  rationale: Ang “dalawang anak ni Eli” ay natural na Filipino at pinananatili ang pagiging tiyak ng kilalang magkapatid; iniayon ang ayos ng pandiwa upang maging malinaw at magaan basahin.
- source_word: מֵתוּ
  choice: namatay
  rationale: Payak at tuwirang katumbas ng Qal perfect ng מות, nang walang idinadagdag na larawan o paliwanag.
- source_word: חָפְנִי וּפִינְחָס
  choice: sina Hofni at Finehas
  rationale: Isinalin ang mga pangalan ayon sa karaniwang anyong Filipino/Biblikal at ginamit ang “sina” upang likas na ipakilala ang dalawang pangalang pantangi bilang paglilinaw sa mga anak ni Eli.
