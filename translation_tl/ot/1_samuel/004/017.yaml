base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/017.yaml
  text: The messenger answered and said[a], “Israel has fled before the Philistines, and there has also been a great slaughter among the people; and your two sons also are dead, Hophni and Phinehas[b]; and the ark of God has been taken.”
translation:
  language: tl
  text: Sumagot ang tagapagbalita, “Tumakas ang Israel sa harap ng mga Filisteo. Napakarami ring napatay sa bayan[a]. Namatay rin ang dalawa mong anak, sina Hofni at Finehas. At nakuha[b] ang kaban ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matindi ang naging dagok sa bayan” o “malaki ang naging pagkatalo ng bayan.” Ang salitang Hebreo ay maaaring tumukoy sa matinding dagok, salot, o pagpatay; sa konteksto ng labanan, malamang na tumutukoy ito sa napakaraming napatay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nabihag ang kaban ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְבַשֵּׂר
  choice: ang tagapagbalita
  rationale: Ang participle ay tumutukoy sa taong nagdadala ng balita. Likas at malinaw sa modernong Filipino ang “tagapagbalita” sa kontekstong ito.
- source_word: נָס יִשְׂרָאֵל לִפְנֵי פְלִשְׁתִּים
  choice: Tumakas ang Israel sa harap ng mga Filisteo
  rationale: Tuwirang ipinahahayag ng pandiwa ang pagtakas, at pinananatili ng “sa harap ng” ang idyomang tumutukoy sa pag-urong mula sa kalaban nang hindi dinaragdagan ang diwa tungo sa tahasang “nalupig.”
- source_word: מַגֵּפָה גְדוֹלָה
  choice: Napakarami ring napatay
  rationale: Maaaring tumukoy ang parirala sa matinding dagok, salot, pagkatalo, o pagpatay. Sa konteksto ng labanan, malinaw at natural na ipinahahayag ng saling ito ang malaking bilang ng mga nasawi, habang inilalahad sa talababa ang mas malawak na saklaw ng salita.
- source_word: בָעָם
  choice: sa bayan
  rationale: Pinananatili ang karaniwang kahulugan na “bayan” o “mga tao,” bagaman sa kontekstong ito ay partikular na kabilang dito ang mga mandirigmang Israelita.
- source_word: שְׁנֵי בָנֶיךָ מֵתוּ
  choice: Namatay rin ang dalawa mong anak
  rationale: Natural at tuwirang ulat ito sa Filipino at pinananatili ang diin sa dalawang anak.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni at Finehas
  rationale: Isinalin sa karaniwang anyong Filipino ang mga pangalang Hebreo.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ang kaban ng Diyos
  rationale: Tuwirang katumbas ito ng pariralang Hebreo at karaniwang katawagan sa banal na kaban.
- source_word: נִלְקָחָה
  choice: nakuha
  rationale: Pinananatili nito ang payak na diwa ng passive na “kinuha,” samantalang ang “nabihag” ay wastong pagpapakahulugan sa konteksto ngunit mas tiyak kaysa sa mismong pandiwa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pasalaysay na ulat. Gumamit ng maiikling pangungusap upang mapanatili ang bigat at sunod-sunod na paglala ng masamang balita. Inilagay ang mga pananda ng talababa sa mismong pariralang tinutukoy ng bawat paliwanag.
