  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaban ng Diyos,” ang karaniwang katawagan sa biblikal na kaban. Iniwasan ang lipas na pantawag-pansin na “masdan” at pinanatili ang konkretong larawan ng pusong nanginginig.
