  source_fidelity: 'Tapat ang salin sa Hebreo: napananatili ang sunod-sunod na kilos, ang pantawag-pansing paglalarawan kay Eli, ang kaniyang pagmamatyag at pagkabalisa para sa kaban ng Diyos, ang pag-uulat ng lalaki sa lungsod, at ang sama-samang daing ng buong lungsod. Ang “dahil sa” ay angkop na pagpapahayag ng paksa ng pagkabahala, nang hindi nagdaragdag ng paliwanag.'
  naturalness: Likas, malinaw, at marangal ang makabagong Filipino. Ang “naroon si Eli,” “nagmamasid,” at “humiyaw ang buong lungsod” ay dumadaloy nang maayos sa salaysay. Katanggap-tanggap ang pag-uulit ng “dumating,” dahil tinutumbasan nito ang magkahiwalay na pandiwang pagsulong ng Hebreo.
  terminology: Ang “kaban ng Diyos” ay tumpak para sa אֲרוֹן הָאֱלֹהִים at hindi nito ipinapalit ang mas espesipikong “Kaban ng Tipan,” na wala sa mismong talata. Ang pangalan ni Eli at ang neutral na “upuan” ay angkop. Wasto rin ang talababa para sa idyomang יַד דֶּרֶךְ at sa posibleng diwang “balisa.”
