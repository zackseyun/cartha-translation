base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/013.yaml
  text: When he came[a], behold, Eli was sitting on the seat by the road, watching, because his heart trembled for the ark of God. And the man came to report it in the city[b], and the whole city cried out.
translation:
  language: tl
  text: Nang dumating siya, naroon si Eli, nakaupo sa upuan sa tabi ng daan[a] at nagmamasid, sapagkat nanginginig ang kanyang puso[b] dahil sa kaban ng Diyos. Dumating ang lalaki upang ibalita iyon sa lungsod, at humiyaw ang buong lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa kamay/panig ng daan,” isang idyomang nangangahulugang nasa tabi o gilid ng daan.
    reason: cultural_note
  - marker: b
    text: Maaari ring “balisa ang kanyang puso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Nang dumating siya
  rationale: Isinusulong ng waw-consecutive ang salaysay, at likas sa Tagalog ang temporal na ugnayang “Nang dumating siya” bago ilarawan ang tagpo.
- source_word: וְהִנֵּה
  choice: naroon
  rationale: Itinatampok ng הִנֵּה ang biglang nakitang tagpo. Ang “naroon” ay natural sa makabagong Tagalog at pinananatili ang pansin sa eksena nang hindi gumagamit ng lipas na “masdan.”
- source_word: יֹשֵׁב עַל הַכִּסֵּא
  choice: nakaupo sa upuan
  rationale: Tuwirang inilalarawan ng participle ang kalagayan ni Eli. Neutral ang “upuan” at hindi ipinapalagay na trono o karaniwang silya ang tinutukoy.
- source_word: יַד דֶּרֶךְ
  choice: sa tabi ng daan
  rationale: Idyoma itong literal na tumutukoy sa “kamay/panig ng daan” at nangangahulugang nasa gilid o tabi ng daan.
- source_word: מְצַפֶּה
  choice: nagmamasid
  rationale: Ipinahihiwatig ng צפה ang mapagmatyag na pagtanaw o paghihintay. Pinananatili ng “nagmamasid” ang konkretong kilos nang hindi labis na ipinapaliwanag ang inaasahan niya.
- source_word: כִּי הָיָה לִבּוֹ חָרֵד
  choice: sapagkat nanginginig ang kanyang puso
  rationale: Pinananatili nito ang konkretong Hebreong larawan at ang lakas ng חָרֵד, na maaaring magpahiwatig ng panginginig, takot, o matinding pagkabalisa.
- source_word: עַל אֲרוֹן הָאֱלֹהִים
  choice: dahil sa kaban ng Diyos
  rationale: Sa konstruksiyong ito, ang עַל ay nagpapakilala sa dahilan o paksa ng pag-aalala ni Eli. Natural sa Tagalog ang “dahil sa” at hindi nito nililinaw nang lampas sa teksto kung ano mismo ang kinatatakutan niya.
- source_word: וְהָאִישׁ בָּא לְהַגִּיד בָּעִיר
  choice: Dumating ang lalaki upang ibalita iyon sa lungsod
  rationale: Ang lalaki ay ang mensaherong nabanggit na sa konteksto. Ipinakikita ng “upang ibalita” ang layunin ng pagdating, samantalang ang “sa lungsod” ay nagpapanatili sa lokatibong diwa ng בָּעִיר. Ang “iyon” ay tumutukoy sa balitang ipinahihiwatig ng konteksto.
- source_word: וַתִּזְעַק כָּל הָעִיר
  choice: humiyaw ang buong lungsod
  rationale: Ang זעק ay malakas na sigaw ng dalamhati o pagkabahala. Ang “humiyaw” ay mas tiyak sa gayong sama-samang pagtangis o pagkagulat kaysa sa payak na “sumigaw.”
