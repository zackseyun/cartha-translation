base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/020.yaml
  text: And about the time of her death[a], the women standing by her said, “Do not fear, for you have borne a son.” But she did not answer, nor did she take it to heart.
translation:
  language: tl
  text: Nang malapit na siyang mamatay, sinabi sa kanya ng mga babaeng nakatayo sa tabi niya, “Huwag kang matakot, sapagkat nagsilang ka ng isang anak na lalaki.” Ngunit hindi siya sumagot ni hindi niya iyon isinapuso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ni hindi niya iyon binigyang-pansin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעֵת מוּתָהּ
  choice: Nang malapit na siyang mamatay
  rationale: Ipinahahayag ng parirala ang panahong halos kasabay ng kaniyang pagkamatay. Natural ito sa modernong Tagalog at hindi nito ipinapalagay na patay na siya habang kinakausap.
- source_word: וַתְּדַבֵּרְנָה
  choice: sinabi sa kanya
  rationale: Ang pambabaeng maramihang pandiwa ay tumutukoy sa sinabi ng mga babaeng nasa tabi niya; ang ganitong ayos ang natural bago ang tuwirang sipi sa Tagalog.
- source_word: הַנִּצָּבוֹת עָלֶיהָ
  choice: mga babaeng nakatayo sa tabi niya
  rationale: Pinananatili nito ang konkretong larawan ng mga babaeng naroon sa tabi niya, nang hindi labis na ipinapalagay ang isang tiyak na tungkulin gaya ng mga komadrona.
- source_word: אַל תִּירְאִי
  choice: Huwag kang matakot
  rationale: Karaniwan, malinaw, at tuwirang katumbas ito ng negatibong utos sa konteksto.
- source_word: כִּי בֵן יָלָדְתְּ
  choice: sapagkat nagsilang ka ng isang anak na lalaki
  rationale: Ang “sapagkat” ay naghahayag ng dahilan ng kanilang pagpapalakas-loob, at ang “nagsilang” ay tapat sa maternal na diwa ng pandiwa.
- source_word: וְלֹא עָנְתָה
  choice: hindi siya sumagot
  rationale: Tuwirang inilalarawan nito ang kawalan niya ng tugon sa sinabi ng mga babae.
- source_word: וְלֹא שָׁתָה לִבָּהּ
  choice: ni hindi niya iyon isinapuso
  rationale: Pinananatili ng “isinapuso” ang metaporang may kinalaman sa puso at naipahihiwatig na hindi niya pinagtuunan o binigyang-halaga ang sinabi sa kaniya.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Tagalog na madaling maunawaan. Ginamit ang “anak na lalaki” para sa malinaw na pagtukoy sa kasarian, at iniwasang tukuyin ang mga babaeng nasa tabi niya bilang mga komadrona dahil hindi iyon tahasang sinasabi ng Hebreo.
