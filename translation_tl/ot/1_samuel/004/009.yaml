  text: הִֽתְחַזְּק֞וּ וִֽ/הְי֤וּ לַֽ/אֲנָשִׁים֙ פְּלִשְׁתִּ֔ים פֶּ֚ן תַּעַבְד֣וּ לָ/עִבְרִ֔ים כַּ/אֲשֶׁ֥ר עָבְד֖וּ לָ/כֶ֑ם וִ/הְיִיתֶ֥ם לַ/אֲנָשִׁ֖ים וְ/נִלְחַמְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/009.yaml
  text: Be strong and be men[a], O Philistines, lest you become servants to the Hebrews as they have been to you[b]. Be men and fight!
translation:
  language: tl
  text: Magpakatatag kayo at magpakalalaki[a], mga Filisteo, baka maging alipin kayo ng mga Hebreo, gaya ng naging alipin ang mga Hebreo sa inyo.[b] Magpakalalaki kayo at lumaban!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “maging mga lalaki.” Isa itong idyomang panlalaki na nananawagan ng tapang sa labanan; maaari ring isaling “kumilos kayong gaya ng mga lalaki.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “gaya ng naglingkod sa inyo ang mga Hebreo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזְּקוּ
  choice: Magpakatatag kayo
  rationale: Ang Hitpael na pautos mula sa חזק ay panawagang lakasan ang sarili at magkaroon ng tapang. Likas at tuwiran sa makabagong Filipino ang “magpakatatag.”
- source_word: וִהְיוּ לַאֲנָשִׁים / וִהְיִיתֶם לַאֲנָשִׁים
  choice: magpakalalaki kayo
  rationale: Pinananatili nito ang sadyang panlalaking idyoma at ang puwersa ng panawagang pandigma. Inulit ang parehong salin upang mapanatili ang retorikal na pag-uulit ng Hebreo.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Tuwirang tawag ito sa mga mandirigmang Filisteo; hindi kailangan sa natural na Filipino ang katumbas ng Ingles na “O.”
- source_word: פֶּן
  choice: baka
  rationale: Nagpapakilala ito ng kinatatakutang maaaring mangyari. Ang “baka” ay maikli, natural, at akma sa babala.
- source_word: תַּעַבְדוּ
  choice: maging alipin kayo ng
  rationale: Bagaman maaaring mangahulugang “maglingkod,” malinaw sa konteksto ng pagkatalo sa digmaan ang sapilitang pagpapasakop, kaya ang “maging alipin” angkop na naghahayag ng puwersa nito.
- source_word: לָעִבְרִים
  choice: mga Hebreo
  rationale: Pinananatili ang katawagang עִבְרִים (“mga Hebreo”) at hindi ito ipinapalit sa “mga Israelita.”
- source_word: כַּאֲשֶׁר עָבְדוּ לָכֶם
  choice: gaya ng pagkaalipin nila sa inyo
  rationale: Ipinahahayag nito ang dating kalagayan ng mga Hebreo sa ilalim ng mga Filisteo at pinananatili ang paghahambing; inilalahad sa talababa ang mas malawak na alternatibong “paglilingkod.”
- source_word: וְנִלְחַמְתֶּם
  choice: at lumaban
  rationale: Sa konteksto, ang anyong ito ay nagpapatuloy sa panawagan bilang utos. Ang “lumaban” ay tuwiran at likas sa Filipino.
theological_decisions:
- issue: Panlalaking panawagan sa לַאֲנָשִׁים
  choice: magpakalalaki kayo
  alternative: magpakatapang kayo; kumilos kayong gaya ng mga lalaki
  rationale: Mga lalaking mandirigmang Filisteo ang kinakausap, at sadyang panlalaki ang idyoma. Hindi ito ginawang ganap na neutral upang hindi mapawi ang retorikal na anyo ng Hebreo, ngunit nilinaw sa talababa na tapang sa digmaan ang ipinahihiwatig.
- issue: Puwersa ng עבד sa konteksto ng pagkatalo sa digmaan
  choice: maging alipin kayo / pagkaalipin nila
  alternative: maglingkod kayo / paglilingkod nila
  rationale: Ang banta ay sapilitang pagpapasakop bunga ng pagkatalo, hindi kusang paglilingkod. Gayunman, dahil maaaring saklawin ng pandiwa ang “paglilingkod,” pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang “magpakalalaki” upang mapanatili ang matinding panlalaking idyoma at ang pag-uulit sa Hebreo, habang ipinaliliwanag sa talababa ang diwang pandigma. Ang “maging alipin” ay nagbibigay-linaw sa sapilitang pagpapasakop na ipinahihiwatig ng konteksto.
