  text: וַ/יַּעַרְכ֨וּ פְלִשְׁתִּ֜ים לִ/קְרַ֣את יִשְׂרָאֵ֗ל וַ/תִּטֹּשׁ֙ הַ/מִּלְחָמָ֔ה וַ/יִּנָּ֥גֶף יִשְׂרָאֵ֖ל לִ/פְנֵ֣י פְלִשְׁתִּ֑ים וַ/יַּכּ֤וּ בַ/מַּֽעֲרָכָה֙ בַּ/שָּׂדֶ֔ה כְּ/אַרְבַּ֥עַת אֲלָפִ֖ים אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/002.yaml
  text: The Philistines drew up to meet Israel[a], and the battle spread out, and Israel was defeated before the Philistines; and they struck down about four thousand men in the battle line in the field.
translation:
  language: tl
  text: Pumuwesto ang mga Filisteo upang harapin ang Israel. Lumawak ang labanan[a], at natalo ang Israel sa harap ng mga Filisteo. Napatay ng mga Filisteo sa hanay ng labanan, sa parang, ang humigit-kumulang apat na libong lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagsimula ang sagupaan.” Maaaring ilarawan ng pandiwang Hebreo ang pagsisimula ng labanan o ang paglawak nito habang nagkakaharap ang mga hukbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַרְכוּ
  choice: Pumuwesto
  rationale: Ipinahahayag ng ערך sa kontekstong militar ang pag-aayos o pagpuwesto ng hukbo para sa labanan. Natural ito sa makabagong Filipino at hindi labis na teknikal.
- source_word: לִקְרַאת
  choice: upang harapin
  rationale: Tumutukoy ito sa paglapit para salubungin ang kalabang hukbo. Sa kontekstong militar, malinaw at likas sa Filipino ang “harapin.”
- source_word: וַתִּטֹּשׁ הַמִּלְחָמָה
  choice: Lumawak ang labanan
  rationale: Pinananatili nito ang posibleng larawan ng paglawak o pagkalat ng sagupaan, nang hindi tiyakang nilulutas kung ang diin ay sa pagsisimula o paglawak ng labanan.
- source_word: וַיִּנָּגֶף
  choice: natalo
  rationale: Ang Niphal ng נגף kasama ng לִפְנֵי ay karaniwang nagpapahiwatig ng pagkatalo sa harap ng kaaway. Hindi nito inuuna ang bilang ng mga napatay, na binabanggit sa kasunod na sugnay.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili ang karaniwang idyomang Hebreo ng pagkatalo “sa harap” ng kaaway, sa halip na gawing payak na “ng.”
- source_word: וַיַּכּוּ
  choice: Napatay nila
  rationale: Sa konteksto ng apat na libong nasawi sa labanan, malinaw ang nakamamatay na diwa ng נכה. Ang tinutukoy ng “nila” ay ang mga Filisteo mula sa naunang sugnay.
- source_word: בַמַּעֲרָכָה
  choice: sa hanay ng labanan
  rationale: Ang מַעֲרָכָה ay tumutukoy sa pagkakaayos o hanay ng mga hukbo sa labanan; tuwiran itong naipapahayag ng “hanay ng labanan.”
- source_word: בַּשָּׂדֶה
  choice: sa parang
  rationale: Ang שׂדה ay payak na tumutukoy sa bukid o lantad na lupain. Ang “parang” ay maikli, natural, at hindi nagdaragdag ng detalyeng wala sa teksto.
- source_word: כְּאַרְבַּעַת אֲלָפִים אִישׁ
  choice: humigit-kumulang apat na libong lalaki
  rationale: Ang כְּ bago ang bilang ay nagpapahiwatig ng pagtataya. Ang אִישׁ ay literal na “lalaki” at sa konteksto ay tumutukoy sa mga mandirigma.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang militar na larawan ng tekstong Hebreo at ang tunay na kalabuan ng pariralang וַתִּטֹּשׁ הַמִּלְחָמָה; iniwasan ang mga arkaikong salitang gaya ng “nahanay” o “sinaktan” kapag hindi sapat ang linaw sa konteksto.
