  text: וַ/תִּקְרָ֣א לַ/נַּ֗עַר אִֽי כָבוֹד֙ לֵ/אמֹ֔ר גָּלָ֥ה כָב֖וֹד מִ/יִּשְׂרָאֵ֑ל אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וְ/אֶל חָמִ֖י/הָ וְ/אִישָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/021.yaml
  text: And she named the boy Ichabod[a], saying, “The glory has departed from Israel,” because the ark of God had been taken, and because of her father-in-law and her husband.
translation:
  language: tl
  text: At pinangalanan niya ang sanggol na lalaki na Icabod[a], na sinasabi, “Lumisan na sa Israel ang kaluwalhatian,” sapagkat nabihag ang Kaban ng Diyos, at dahil sa kaniyang biyenan at asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Icabod ay maaaring iugnay sa mga salitang Hebreo na nangangahulugang “walang kaluwalhatian” o marahil ay “nasaan ang kaluwalhatian?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לַנַּעַר
  choice: pinangalanan niya ang sanggol na lalaki
  rationale: Sa konteksto ng pagbibigay ng pangalan, ang קרא na may ל ay nangangahulugang pangalanan. Bagaman karaniwang 'batang lalaki' ang נַעַר, bagong silang ang tinutukoy rito, kaya likas at malinaw ang 'sanggol na lalaki.'
- source_word: אִי כָבוֹד
  choice: Icabod
  rationale: Isinalin sa baybay na madaling basahin sa Filipino ang pangalang Hebreo, habang ipinaliliwanag sa talababa ang hindi tiyak na ugnayan nito sa mga elementong nangangahulugang 'walang kaluwalhatian' o 'nasaan ang kaluwalhatian?'.
- source_word: גָּלָה כָבוֹד מִיִּשְׂרָאֵל
  choice: Lumisan na sa Israel ang kaluwalhatian
  rationale: Maaaring tumukoy ang גלה sa pag-alis, pagkakatapon, o pagkawala. Ang 'lumisan' ay natural sa Filipino at pinananatili ang larawan ng pag-alis nang hindi labis na nililinaw kung ang tinutukoy ay presensiya ng Diyos, karangalan ng Israel, o kapwa.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: sapagkat nabihag ang Kaban ng Diyos
  rationale: Ang אֶל ay nauunawaan dito bilang sanhi. Ang passive na הִלָּקַח ay hindi lamang pagkawala kundi pagkuha ng kaaway sa konteksto, kaya ang 'nabihag' ay maikli at malinaw.
- source_word: וְאֶל חָמִיהָ וְאִישָׁהּ
  choice: at dahil sa sinapit ng kaniyang biyenan at ng kaniyang asawa
  rationale: Ipinagpapatuloy ng inuulit na אֶל ang sanhi. Idinagdag ang 'sinapit' upang maging natural sa Filipino at maipahiwatig ang pagkamatay ng dalawang lalaki mula sa agarang konteksto nang hindi ito inuulit nang tahasan.
theological_decisions:
- issue: Kahulugan ng “kaluwalhatian” kaugnay ng Israel
  choice: Panatilihin ang payak na “ang kaluwalhatian” nang hindi tahasang tukuyin kung ito ang nahahayag na presensiya ng Diyos, ang karangalan ng Israel, o kapwa.
  alternative: “Lumisan na sa Israel ang kaluwalhatian ng Diyos” o “Nawala na ang karangalan ng Israel.”
  rationale: Siksik at maraming pahiwatig ang כָבוֹד sa Hebreo. Iniuugnay ito ng konteksto sa pagkabihag ng Kaban at sa pagbagsak ng sambahayan ni Eli; hindi dapat paliitin ng salin ang tunay na teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Kaban ng Diyos” bilang pamilyar na katawagan sa ark; pinanatili ang bigat at pagiging matimpi ng pananalita sa salaysay.
