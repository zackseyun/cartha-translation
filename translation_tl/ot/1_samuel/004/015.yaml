  text: Nobenta't walong taong gulang si Eli, at nakatitig na ang kaniyang mga mata, kaya hindi na siya makakita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן תִּשְׁעִים וּשְׁמֹנֶה שָׁנָה
  choice: Nobenta't walong taong gulang
  rationale: Isinalin ang Hebreong idyomang “anak ng siyamnapu't walong taon” sa likas na modernong Tagalog para sa edad.
- source_word: וְעֵינָיו
  choice: ang kaniyang mga mata
  rationale: Tuwirang salin ng pangngalang maramihan na may hulaping tumutukoy kay Eli.
- source_word: קָמָה
  choice: nanigas
  rationale: Pinananatili ang kongkretong paglalarawan na ang mga mata ni Eli ay naging matigas o hindi na gumagalaw nang maayos, sa halip na palitan agad ng interpretasyong “lumabo.”
- source_word: וְלֹא יָכֹל לִרְאוֹת
  choice: kaya hindi siya makakita
  rationale: Likas na ipinahahayag sa Tagalog ang bunga ng kalagayan ng kaniyang mga mata.
