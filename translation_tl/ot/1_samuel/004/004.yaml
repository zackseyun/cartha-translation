  source_fidelity: 'Tumpak sa kabuuan ang pagdadala ng kaban, ang titulong “Yahweh ng mga hukbo,” at ang presensiya nina Hofni at Finehas. Gayunman, ang talababa a ay hindi nagbibigay ng aktuwal na alternatibong salin: inuulit lamang nito ang eksaktong nasa pangunahing teksto at nagdaragdag ng paliwanag na hindi kailangan upang maunawaan ang talata.'
  naturalness: Natural at marangal ang Filipino. Katanggap-tanggap ang “nagsugo ang bayan sa Shilo” dahil hindi tinutukoy ng Hebreo ang mga isinugo; ang kasunod na mga sugnay ay malinaw at maayos ang daloy.
  terminology: Ang “kaban ng tipan,” “Yahweh,” “mga hukbo,” “kerubin,” at mga anyong “Hofni” at “Finehas” ay angkop sa modernong Filipino Tagalog na rehistrong biblikal. Ang talababa tungkol sa posisyon kaugnay ng mga kerubin ay nararapat, sapagkat hindi tahasang itinatakda ng Hebreo ang “sa ibabaw” o “sa gitna.”
