base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/004.yaml
  text: So the people sent to Shiloh[a], and they carried from there the ark of the covenant of Yahweh of hosts, who is enthroned above the cherubim. And the two sons of Eli, Hophni and Phinehas[b], were there with the ark of the covenant of God.
translation:
  language: tl
  text: Kaya nagsugo ang bayan sa Shilo, at mula roon ay dinala nila ang kaban ng tipan ni Yahweh ng mga hukbo, na nakaluklok sa ibabaw ng mga kerubin.[a] Naroon kasama ng kaban ng tipan ng Diyos ang dalawang anak ni Eli, sina Hofni at Finehas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na nakaluklok sa gitna ng mga kerubin.” Hindi tahasang tinutukoy ng Hebreo kung “sa ibabaw” o “sa gitna.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח הָעָם שִׁלֹה
  choice: Kaya nagsugo ang bayan sa Shilo
  rationale: Hindi tahasang binanggit sa Hebreo kung sino ang mga isinugo, kaya hindi idinagdag ang “mga tao.” Ang “bayan” ay likas na katumbas ng kolektibong הָעָם.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: at mula roon ay dinala nila
  rationale: Ipinahihiwatig ng נשׂא ang pagbuhat at pagdadala; natural sa Filipino ang “dinala” sa kontekstong ito.
- source_word: אֲרוֹן בְּרִית
  choice: kaban ng tipan
  rationale: Malinaw at kinikilalang salin ng construct phrase, na pinananatili ang bagay at kaugnayan nito sa tipan.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh ng mga hukbo
  rationale: Pinananatili ang personal na pangalang Yahweh at isinasalin ang צְבָאוֹת nang malawak bilang “mga hukbo,” nang hindi nililimitahan sa hukbong panlupa.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: na nakaluklok sa ibabaw ng mga kerubin
  rationale: Ang “nakaluklok” ay nagpapahayag ng maharlikang presensiya, hindi lamang ng pag-upo. Ang “sa ibabaw” ay umaangkop sa larawan ng kaban ngunit ang posibleng “sa gitna” ay inilagay sa talababa.
- source_word: וְשָׁם שְׁנֵי בְנֵי עֵלִי
  choice: Naroon ... ang dalawang anak ni Eli
  rationale: Natural na Filipino ang ayos na ito at pinananatili ang lokatibong diin ng וְשָׁם.
- source_word: עִם אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: kasama ng kaban ng tipan ng Diyos
  rationale: Ang עִם ay karaniwang “kasama”; hindi ito ginawang mas tiyak na relasyong espasyal.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni at Finehas
  rationale: Mga pangalang pantangi na tinumbasan ayon sa karaniwang anyong Filipino.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalan sa יְהוָה צְבָאוֹת
  choice: Yahweh ng mga hukbo
  alternative: PANGINOON ng mga hukbo
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang banal na pangalang pantangi sa halip na palitan ito ng titulo.
- issue: Pormula ng pagkaluklok sa יֹשֵׁב הַכְּרֻבִים
  choice: na nakaluklok sa ibabaw ng mga kerubin
  alternative: na nakaluklok sa gitna ng mga kerubin
  rationale: Pinananatili ng “nakaluklok” ang pahiwatig ng banal na paghahari. Hindi ganap na tinutukoy ng Hebreo ang eksaktong relasyong espasyal, kaya itinatala ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kaban ng tipan,” “nakaluklok,” at “kerubin” bilang malinaw na bokabularyong biblikal. Iniwasan ang pagdaragdag ng hindi tahasang layon ng pandiwang “nagsugo.”
