  text: וַ/יָּבֹ֣א הָ/עָם֮ אֶל הַֽ/מַּחֲנֶה֒ וַ/יֹּֽאמְרוּ֙ זִקְנֵ֣י יִשְׂרָאֵ֔ל לָ֣/מָּה נְגָפָ֧/נוּ יְהוָ֛ה הַ/יּ֖וֹם לִ/פְנֵ֣י פְלִשְׁתִּ֑ים נִקְחָ֧ה אֵלֵ֣י/נוּ מִ/שִּׁלֹ֗ה אֶת אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה וְ/יָבֹ֣א בְ/קִרְבֵּ֔/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/כַּ֥ף אֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/003.yaml
  text: When the people came into the camp[a], the elders of Israel said, “Why has Yahweh struck us down today before the Philistines? Let us bring here from Shiloh the ark of the covenant of Yahweh, so that it may come into our midst and save us from the hand of our enemies.”
translation:
  language: tl
  text: Nang makarating ang mga tao sa kampo, sinabi ng mga nakatatandang pinuno ng Israel, “Bakit tayo pinabagsak ni Yahweh ngayon sa harap ng mga Filisteo? Dalhin natin dito mula sa Shilo ang kaban ng tipan ni Yahweh, upang dumating ito sa gitna natin at iligtas tayo[a] mula sa kamay ng ating mga kaaway.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang dumating siya sa gitna natin at iligtas tayo,” kung ang mga pandiwang nasa isahan ay inuunawang mas tuwirang tumutukoy kay Yahweh, na ang presensiya ay iniuugnay sa kaban.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: ang mga tao
  rationale: Pinananatili ang karaniwang kahulugang ‘mga tao’ habang ipinahihiwatig na ng kampo at labanan na sila ang puwersang Israelita.
- source_word: הַמַּחֲנֶה
  choice: sa kampo
  rationale: Likas at maikli sa modernong Filipino para sa kampong militar.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: mga nakatatandang pinuno ng Israel
  rationale: Nililinaw na ang tinutukoy ay kinikilalang mga pinuno, hindi lamang matatanda sa edad, habang pinananatili ang diwa ng זִקְנֵי.
- source_word: נְגָפָנוּ
  choice: tayo pinabagsak
  rationale: Ipinahahayag ang aktibong pagkilos ni Yahweh at ang matinding pagkatalo sa labanan; hindi nito pinapahina ang pandiwa tungo sa simpleng ‘hinayaang matalo.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: sa harap ng mga Filisteo
  rationale: Pinananatili ang larawang spatial ng Hebrew na sa konteksto ay tumutukoy sa pagkatalo sa kanilang harapan.
- source_word: נִקְחָה אֵלֵינוּ
  choice: Dalhin natin dito
  rationale: Natural na mungkahing kohortatibo sa Filipino at malinaw na tumutukoy sa pagdadala ng kaban sa kampo.
- source_word: מִשִּׁלֹה
  choice: mula sa Shilo
  rationale: Tuwirang transliterasyon ng pangalan ng lugar ayon sa bigkas na angkop sa Filipino.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ang kaban ng tipan ni Yahweh
  rationale: Ang ‘kaban ng tipan’ ay malinaw at nakaugaliang katumbas na pinananatili ang ugnayan nito kay Yahweh.
- source_word: וְיָבֹא בְקִרְבֵּנוּ
  choice: upang mapasa gitna natin ito
  rationale: Ang ‘ito’ ay sumusunod sa pinakamalapit na tahasang paksa, ang kaban, at pinananatili ng ‘sa gitna natin’ ang spatial at presensiyal na diwa.
- source_word: וְיֹשִׁעֵנוּ
  choice: at iligtas tayo
  rationale: Ang ‘iligtas’ ay malawak at tuwirang katumbas ng Hiphil ng ישׁע; nililinaw ng kasunod na parirala ang pagliligtas mula sa kapangyarihan ng kaaway.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: mula sa kamay ng ating mga kaaway
  rationale: Pinananatili ang Hebreong idyoma ng ‘kamay’ bilang kapangyarihan o kontrol, na nauunawaan din sa Filipino.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebrew; pinananatili ito sa transliterasyon sa halip na palitan ng titulo.
- issue: Tinutukoy ng mga pandiwang isahan sa וְיָבֹא ... וְיֹשִׁעֵנוּ
  choice: ito—ang kaban
  alternative: siya—si Yahweh
  rationale: Ang kaban ang pinakamalapit na gramatikal na antecedent at panlalaki rin ang אֲרוֹן sa Hebrew. Gayunman, maaaring iugnay ang mga pandiwa kay Yahweh dahil ang presensiya niya ay iniuugnay sa kaban; kaya pinananatili sa talababa ang tunay na kalabuan at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘mga nakatatandang pinuno’ upang maging malinaw ang tungkuling pampamunuan, at pinanatili ang biblikal na idyomang ‘mula sa kamay.’
