  text: וַ/יִּשְׁמְע֤וּ פְלִשְׁתִּים֙ אֶת ק֣וֹל הַ/תְּרוּעָ֔ה וַ/יֹּ֣אמְר֔וּ מֶ֠ה ק֣וֹל הַ/תְּרוּעָ֧ה הַ/גְּדוֹלָ֛ה הַ/זֹּ֖את בְּ/מַחֲנֵ֣ה הָ/עִבְרִ֑ים וַ/יֵּ֣דְע֔וּ כִּ֚י אֲר֣וֹן יְהוָ֔ה בָּ֖א אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/006.yaml
  text: When the Philistines heard the sound of the shouting[a], they said[b], “What is this great sound of shouting in the camp of the Hebrews?” And they knew that the ark of Yahweh had come into the camp.
translation:
  language: tl
  text: Nang marinig ng mga Filisteo ang ingay ng sigawan[a], sinabi nila, “Ano ang napakalakas na sigawang ito sa kampo ng mga Hebreo?” At nalaman nilang dumating sa kampo ang kaban ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malakas na sigaw” o, sa kontekstong militar, “sigaw-pandigma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: ingay
  rationale: Tumutukoy rito sa naririnig na tunog na likha ng sama-samang sigawan; natural sa Tagalog ang “ingay ng sigawan” at hindi ito nagpapahiwatig ng isang nagsasalitang tinig.
- source_word: תְּרוּעָה
  choice: sigawan
  rationale: Maaaring tumukoy sa malakas na sigaw o sigaw-pandigma. Sa konteksto ng masayang pagsigaw ng Israel sa talata 5, sapat na malawak at natural ang “sigawan.”
- source_word: מֶה קוֹל ... הַזֹּאת
  choice: Ano ang napakalakas na sigawang ito
  rationale: Direkta at natural na tanong sa modernong Tagalog tungkol sa uri o kahulugan ng narinig na sigawan.
- source_word: הַגְּדוֹלָה
  choice: napakalakas
  rationale: Literal na “malaki/dakila,” ngunit inilalarawan dito ang tindi ng tunog; “napakalakas” ang malinaw at idiomatikong katumbas sa Tagalog.
- source_word: מַחֲנֶה
  choice: kampo
  rationale: Karaniwang katawagan sa isang kampong militar at akma sa dalawang paglitaw ng salita sa talata.
- source_word: הָעִבְרִים
  choice: mga Hebreo
  rationale: Pinananatili ang etnonimong ginamit ng mga Filisteo at ang pananaw ng mga nagsasalita, sa halip na gawing “mga Israelita.”
- source_word: וַיֵּדְעוּ
  choice: nalaman nila
  rationale: Ipinahihiwatig ng anyo at konteksto na nakatanggap sila ng bagong kaalaman; natural na ipinapahayag ito ng “nalaman nila.”
- source_word: אֲרוֹן יְהוָה
  choice: kaban ni Yahweh
  rationale: Ang אֲרוֹן ay “kaban,” at pinananatili ang personal na pangalang יְהוָה bilang “Yahweh.”
- source_word: בָּא
  choice: dumating
  rationale: Natapos na ang pagdating ng kaban bago ito nalaman ng mga Filisteo; sapat na ipinahahayag ng aspektong Tagalog at ng ayos ng salaysay ang ugnayang ito.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalang יְהוָה ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Kahulugan ng pagdating ng kaban
  choice: Payak na iniulat na dumating ang kaban ni Yahweh
  alternative: Ipahiwatig na si Yahweh mismo ang pisikal na dumating
  rationale: Magkaiba sa gramatika ang kaban at si Yahweh; hindi idinaragdag ng salin ang teolohikal na interpretasyong ang presensiya ng kaban ay katumbas ng pisikal na pagdating ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “mga Filisteo,” “mga Hebreo,” at “kaban” bilang pamilyar na katawagang biblikal. Iniwasan ang sobrang literal na “tunog ng sigawan” sa ikalawang pangungusap upang maging mas natural, habang pinananatili ang diin sa lakas ng sigaw.
