  source_fidelity: 'Tapat ang salin sa Hebreo: narinig ng mga Filisteo ang tunog/ingay ng sigawan, itinanong nila ang tungkol sa malakas na sigaw sa kampo ng mga Hebreo, at nalaman nila na dumating ang kaban ni Yahweh sa kampo. Napananatili ang pagkakaiba ng “mga Hebreo” sa halip na gawing “mga Israelita,” at hindi idinadagdag ang anumang interpretasyon sa pagdating ng kaban.'
