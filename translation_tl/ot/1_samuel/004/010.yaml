revisions:
- from: Kaya nakipaglaban ang mga Filisteo, at natalo ang Israel. Tumakas ang bawat isa patungo sa sarili niyang tolda.[a] Napakalubha ng pagpatay,[b] at tatlumpung libong kawal na naglalakad mula sa Israel ang nasawi.
  to: Kaya nakipaglaban ang mga Filisteo, at natalo ang Israel. Tumakas ang bawat isa patungo sa kani-kaniyang tolda.[a] Napakatindi ng naging pagpatay,[b] at tatlumpung libong kawal na lumalaban nang naglalakad mula sa Israel ang nasawi.
  rationale: Binago ang parirala para sa mga kawal na panlakad upang malinaw na tumukoy sa uri ng mandirigma, hindi lamang sa kilos ng paglalakad. Pinakinis din ang distributibong parirala para sa mga tumakas at ang paglalarawan sa matinding pagpatay. Napanatili ang mga alternatibong leksikal at ang mga angkla ng talababa.
