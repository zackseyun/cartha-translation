translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang konkretong “tolda,” ngunit ipinaliwanag ang posibleng idyomatikong kahulugan sa talababa. Ginamit ang “nasawi” upang malinaw na maipahayag ang kamatayan sa labanan.
