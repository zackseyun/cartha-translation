base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/010.yaml
  text: So the Philistines fought[a], and Israel was defeated, and each man fled to his tent. The slaughter was very great[b], and thirty thousand foot soldiers from Israel fell.
translation:
  language: tl
  text: Kaya nakipaglaban ang mga Filisteo, at natalo ang Israel. Tumakas ang bawat isa patungo sa kani-kaniyang tolda.[a] Napakatindi ng naging pagpatay,[b] at tatlumpung libong kawal na lumalaban nang naglalakad mula sa Israel ang nasawi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patungo sa kani-kaniyang tahanan.” Literal na “tolda” ang nasa Hebreo, ngunit maaari itong gamitin bilang katawagan sa tirahan ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: O “Napakatindi ng pagkatalo.” Literal na sinasabi ng Hebreo na “napakalaki ng dagok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ פְלִשְׁתִּים
  choice: nakipaglaban ang mga Filisteo
  rationale: Likas at tuwirang paglalarawan ito ng kilos-militar ng mga Filisteo, habang pinananatili ang sunod-sunod na daloy ng salaysay.
- source_word: וַיִּנָּגֶף יִשְׂרָאֵל
  choice: natalo ang Israel
  rationale: Sa konteksto ng labanan, ang נָגַף ay tumutukoy sa pagkatalo o pagkabuwal sa harap ng kaaway; malinaw ang “natalo” nang hindi ipinahihiwatig na ganap na nalipol ang Israel.
- source_word: וַיָּנֻסוּ אִישׁ לְאֹהָלָיו
  choice: Tumakas ang bawat isa patungo sa sarili niyang tolda
  rationale: Distributibo ang אִישׁ, kaya “bawat isa.” Pinanatili ang literal na “tolda” ng אֹהֶל, bagaman maaari rin itong tumukoy sa tahanan.
- source_word: וַתְּהִי הַמַּכָּה גְּדוֹלָה מְאֹד
  choice: Napakalubha ng pagpatay
  rationale: Ang מַכָּה ay literal na hampas o dagok, ngunit sa salaysay ng digmaan ay tumutukoy sa matinding pagpatay o pinsalang idinulot, gaya ng nililinaw ng kasunod na bilang ng nasawi.
- source_word: וַיִּפֹּל מִיִּשְׂרָאֵל
  choice: mula sa Israel ang nasawi
  rationale: Sa konteksto ng digmaan, ang “nahulog/bumagsak” ay idyomang nangangahulugang namatay sa labanan. Mas malinaw sa kasalukuyang Tagalog ang “nasawi.”
- source_word: שְׁלֹשִׁים אֶלֶף רַגְלִי
  choice: tatlumpung libong kawal na naglalakad
  rationale: Tuwirang isinalin ang bilang. Ang רַגְלִי ay mga mandirigmang lumalaban nang naglalakad, bilang kaibahan sa mga nakasakay; mas madaling maunawaan ito kaysa sa teknikal na “impanterya.”
