  text: וַ/תֹּ֕אמֶר גָּלָ֥ה כָב֖וֹד מִ/יִּשְׂרָאֵ֑ל כִּ֥י נִלְקַ֖ח אֲר֥וֹן הָ/אֱלֹהִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/022.yaml
  text: And she said[a], “The glory has departed from Israel[b], because the ark of God has been taken.”
translation:
  language: tl
  text: At sinabi niya, “Lumisan na ang kaluwalhatian mula sa Israel[a], sapagkat kinuha ang kaban ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Napatapon na ang kaluwalhatian mula sa Israel.” Maaaring magpahiwatig ang pandiwang Hebreo ng pagkatapon o pag-aalis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: At sinabi niya
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural at marangal sa makabagong Tagalog ang “At sinabi niya.”
- source_word: גָּלָה
  choice: Lumisan na
  rationale: Maaaring mangahulugan ang pandiwa ng pag-alis, pagkatanggal, o pagkatapon. Ang “lumisan na” ay natural sa Tagalog at pinananatili ang larawan ng pag-alis nang hindi labis na binibigyang-kahulugan ito.
- source_word: כָבוֹד
  choice: ang kaluwalhatian
  rationale: Tumutukoy ito sa mabigat na karangalan at kaluwalhatiang kaugnay ng presensya ng Diyos sa Israel; ang “kaluwalhatian” ang pamilyar at angkop na salitang biblikal.
- source_word: מִיִּשְׂרָאֵל
  choice: mula sa Israel
  rationale: Ang pang-ukol ay nagpapahayag ng paghihiwalay o pag-alis; malinaw at natural ang “mula sa Israel.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ibinibigay nito ang dahilan ng naunang pahayag. Ang “sapagkat” ay malinaw, marangal, at angkop sa register ng salin.
- source_word: נִלְקַח
  choice: kinuha
  rationale: Ang Niphal ay balintiyak, “ay kinuha/nakuha.” Sa Tagalog, likas na maunawaan ang “kinuha ang kaban” bilang balintiyak na pokus sa bagay, at hindi nito idinaragdag ang mas makitid na diwa ng “nabihag.”
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ang kaban ng Diyos
  rationale: Tuwirang isinasalin ang construct phrase at pinananatili ang pamilyar at marangal na katawagang biblikal.
theological_decisions:
- issue: Kahulugan ng “kaluwalhatian” kaugnay ng Israel at ng kaban
  choice: Pinananatili ang “kaluwalhatian” bilang mabigat na pagtukoy sa nawalang karangalan at presensyang kaugnay ng Diyos sa Israel, nang hindi ito ginagawang tahasang teknikal na doktrina.
  alternative: Maaaring unawain ito bilang pambansang karangalan lamang ng Israel, o bilang halos tuwirang pagtukoy sa mismong pag-alis ng Diyos.
  rationale: Iniuugnay ng konteksto ang pahayag sa pagkakuha sa kaban, kaya higit ito sa kahihiyang militar lamang. Gayunman, hindi tahasang tinutukoy ng talata ang eksaktong ugnayan ng presensya ng Diyos at ng kaban, kaya pinananatili ang teolohikal na tensiyon.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “lumisan na” upang maging natural habang pinananatili ang matalinghagang kilos ng kaluwalhatian. Inilagay ang panandang [a] sa mismong teksto at iniugnay ito sa tunay na leksikal na alternatibo.
