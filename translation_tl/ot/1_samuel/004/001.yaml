  text: וַ/יְהִ֥י דְבַר שְׁמוּאֵ֖ל לְ/כָל יִשְׂרָאֵ֑ל וַ/יֵּצֵ֣א יִשְׂרָאֵל֩ לִ/קְרַ֨את פְּלִשְׁתִּ֜ים לַ/מִּלְחָמָ֗ה וַֽ/יַּחֲנוּ֙ עַל הָ/אֶ֣בֶן הָעֵ֔זֶר וּ/פְלִשְׁתִּ֖ים חָנ֥וּ בַ/אֲפֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/001.yaml
  text: And the word of Samuel came to all Israel[a]. Then Israel went out to meet the Philistines in battle, and they camped at Ebenezer[b], while the Philistines camped at Aphek.
translation:
  language: tl
  text: At nakarating sa buong Israel ang salita ni Samuel.[a] Pagkatapos, lumabas ang Israel upang harapin ang mga Filisteo sa labanan. Nagkampo sila sa Ebenezer,[b] samantalang nagkampo naman ang mga Filisteo sa Afek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Nakarating sa buong Israel ang ulat ni Samuel.” Maaaring tumukoy ang Hebreo sa salita o mensahe ni Samuel, at sa konteksto ay malamang na tumutukoy ito sa kanyang propetikong salita.'
    reason: alternative_reading
  - marker: b
    text: Ang Ebenezer ay nangangahulugang “bato ng tulong.” Dito, pangalan ito ng isang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר שְׁמוּאֵל לְכָל יִשְׂרָאֵל
  choice: At nakarating sa buong Israel ang salita ni Samuel
  rationale: Ginagawang natural sa Tagalog ang Hebreong sugnay habang pinananatili ang “salita” at ang diwang umabot ito sa buong bayan.
- source_word: וַיֵּצֵא יִשְׂרָאֵל
  choice: lumabas ang Israel
  rationale: Tuwirang katumbas ng pandiwang יצא at hindi dinaragdagan ang antas ng militar na kilos na nasa kasunod na parirala na.
- source_word: לִקְרַאת פְּלִשְׁתִּים לַמִּלְחָמָה
  choice: upang harapin ang mga Filisteo sa labanan
  rationale: Ipinahahayag ang pagharap o pagsalubong sa konteksto ng digmaan sa natural na modernong Tagalog.
- source_word: וַיַּחֲנוּ עַל הָאֶבֶן הָעֵזֶר
  choice: Nagkampo sila sa Ebenezer
  rationale: Itinuturing ang Ebenezer bilang pangalan ng lugar; ang “nagkampo” ay kasalukuyan at madaling maunawaang katumbas ng חנה.
- source_word: וּפְלִשְׁתִּים חָנוּ בַאֲפֵק
  choice: samantalang nagkampo naman ang mga Filisteo sa Afek
  rationale: Malinaw na inilalarawan ang magkasabay at magkatapat na pagkakampo ng dalawang hukbo; tinutumbasan sa baybay-Filipino ang pangalang Aphek bilang Afek.
theological_decisions:
- issue: Kung ang דְבַר שְׁמוּאֵל ay propetikong salita/mensahe o ulat tungkol kay Samuel
  choice: salita ni Samuel na nakarating sa buong Israel
  alternative: kumalat sa buong Israel ang balita tungkol kay Samuel
  rationale: Mas natural sa konteksto ng 1 Samuel 3 ang propetikong salita, ngunit pinananatili ng salin ang literal na “salita” at inilalagay sa talababa ang tunay na posibleng alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Filisteo,” “Ebenezer,” at “Afek” bilang mga pangalang pantangi; pinanatili ang “salita ni Samuel” upang hindi alisin ang ugnay sa propetikong konteksto.
