  text: וַ/יִּקָּבְצ֣וּ פְלִשְׁתִּ֔ים וַ/יָּבֹ֖אוּ וַ/יַּחֲנ֣וּ בְ/שׁוּנֵ֑ם וַ/יִּקְבֹּ֤ץ שָׁאוּל֙ אֶת כָּל יִשְׂרָאֵ֔ל וַֽ/יַּחֲנ֖וּ בַּ/גִּלְבֹּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/004.yaml
  text: The Philistines gathered and came and camped at Shunem[a], and Saul gathered all Israel[b], and they camped at Gilboa.
translation:
  language: tl
  text: Nagtipon ang mga Filisteo, pumunta sila at nagkampo sa Shunem[a]. Tinipon naman ni Saul ang buong Israel, at nagkampo sila sa Gilboa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “nagkampo” bilang “humimpil” dito at sa kasunod na paglitaw nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa Bundok Gilboa,” yamang ang Gilboa ay tumutukoy sa bulubunduking lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: Nagtipon
  rationale: Mula sa קבץ, na tumutukoy sa pagtitipon o pagtipon ng mga tao. Natural ang “nagtipon” sa makabagong Filipino at pinananatili nito ang diwang militar nang hindi ito labis na binibigyang-kahulugan.
- source_word: פְלִשְׁתִּים
  choice: ang mga Filisteo
  rationale: Karaniwang katawagan sa Filipino para sa pangkat ng mga taong ito; ang “mga” ay likas na pananda ng maramihan.
- source_word: וַיָּבֹאוּ
  choice: pumunta sila
  rationale: Ang בוא ay payak na pandiwa ng paggalaw. Ang “pumunta sila” ay malinaw at hindi nagdaragdag ng di-tahasang ideya gaya ng pagsalakay o pagsulong.
- source_word: וַיַּחֲנוּ
  choice: nagkampo
  rationale: Ang חנה ay nangangahulugang humimpil o magtayo ng kampo. Ang “nagkampo” ay natural at madaling maunawaan sa modernong Filipino.
- source_word: בְשׁוּנֵם
  choice: sa Shunem
  rationale: Ang “sa” ang natural na panandang Filipino para sa lokasyon ng kampo at hindi nito nilulutas nang labis kung nasa loob o sa paligid ng Shunem.
- source_word: וַיִּקְבֹּץ
  choice: Tinipon
  rationale: Parehong ugat na קבץ ang ginamit sa unang pandiwa. Pinananatili ng “tinipon” ang leksikal na ugnayan habang malinaw na si Saul ang kumilos upang tipunin ang Israel.
- source_word: כָּל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Tapat ito sa kolektibong pahayag na “lahat/buong Israel” at hindi ito pinakikitid sa “mga lalaki” o “mga kawal,” na hindi tahasang sinabi sa Hebreo.
- source_word: וַיַּחֲנוּ
  choice: nagkampo sila
  rationale: Ang pangmaramihang pandiwa ay tumutukoy sa mga taong tinipon ni Saul. Kailangan ang “sila” sa Filipino upang luminaw ang paksa.
- source_word: בַּגִּלְבֹּעַ
  choice: sa Gilboa
  rationale: Gilboa lamang ang tahasang pangalan sa Hebreo, walang salitang “bundok.” Ang “sa Gilboa” ay natural at hindi nagdaragdag ng topograpikong detalye sa pangunahing teksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na mga kilos sa salaysay, ngunit hinati sa dalawang pangungusap para sa natural na daloy. Ginamit ang “naman” upang maipakita ang paglipat sa tugon ni Saul nang hindi nagdaragdag ng teolohikal na pagpapakahulugan.
