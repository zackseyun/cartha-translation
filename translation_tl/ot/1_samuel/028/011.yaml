  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה אֶת מִ֖י אַֽעֲלֶה לָּ֑/ךְ וַ/יֹּ֕אמֶר אֶת שְׁמוּאֵ֖ל הַֽעֲלִי לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/011.yaml
  text: Then the woman said[a], “Whom shall I bring up for you?” And he said, “Bring up Samuel for me.”
translation:
  language: tl
  text: Sinabi ng babae, “Sino ang iaahon ko para sa iyo?” Sinabi niya, “Iahon mo si Samuel para sa akin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Sinabi
  rationale: Ang wayyiqtol ng אמר ay nagpapatuloy sa salaysay; natural sa modernong Filipino ang payak na “Sinabi” nang hindi kailangang laging isalin ang waw bilang “at” o “pagkatapos.”
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Tumutukoy ito sa babaeng espiritista sa Endor; “ang babae” ang tuwiran at kontekstuwal na katumbas.
- source_word: אֶת מִי
  choice: Sino
  rationale: Bagaman minamarkahan ng אֶת ang tuwirang layon, “sino” ang natural na anyong ginagamit sa modernong Filipino para sa tao bilang layon.
- source_word: אַעֲלֶה
  choice: iaahon ko
  rationale: Ang Hiphil ng עלה ay “paakyatin/iahon.” Pinananatili ng “iaahon” ang larawang pataas sa Hebreo at hindi ipinapaliwanag ang mekanismo ng pangyayari.
- source_word: לָּךְ
  choice: para sa iyo
  rationale: 'Benefaktibo ang gamit ng ל: gagawin ng babae ang ipinapakiusap alang-alang kay Saul.'
- source_word: וַיֹּאמֶר
  choice: Sumagot siya
  rationale: Sa daloy ng tuwirang pag-uusap, natural na Filipino ang “Sumagot siya”; ipinahihiwatig pa rin nito ang kasunod na pagsasalita ni Saul.
- source_word: אֶת שְׁמוּאֵל
  choice: si Samuel
  rationale: Hindi hiwalay na isinasalin ang pantukoy sa tuwirang layon na אֶת; ginagamit ang personal marker na “si” bago ang pangalang Samuel.
- source_word: הַעֲלִי
  choice: Iahon mo
  rationale: Ito ay Hiphil imperative feminine singular ng עלה, na nakatuon sa babae. Pinananatili ang parehong salitang-ugat at larawang ginamit sa unang tanong.
- source_word: לִי
  choice: para sa akin
  rationale: Tulad ng naunang לָּךְ, pinakamainam itong unawain bilang benefaktibo.
theological_decisions:
- issue: Paglalarawan sa idyomang nekromantiko na עלה
  choice: iahon / Iahon
  alternative: ipatawag; paakyatin
  rationale: Ang “iahon” ay malapit sa literal na “dalhin pataas” at pinananatili ang sariling larawan ng tekstong Hebreo. Hindi nito ipinapasya kung paano nangyari ang pagpapakita ni Samuel o kung anong kapangyarihan ang kumilos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iaahon/Iahon” sa halip na mas interpretibong “ipatawag” upang mapanatili ang konkretong larawang pataas ng Hebreo at ang pagkakapareho ng dalawang anyo ng עלה.
