- from: Dahil hindi mo sinunod ang tinig ni Yahweh at hindi mo isinagawa ang nag-aalab niyang galit laban sa Amalek[a], kaya ginawa ito sa iyo ni Yahweh sa araw na ito.
  to: Dahil hindi mo sinunod ang tinig ni Yahweh at hindi mo isinagawa ang kanyang nag-aalab na galit laban sa Amalek[a], ginawa ito sa iyo ni Yahweh sa araw na ito.
  rationale: Inayos ang pagkakasunod ng panghalip at pangngalan upang maging natural ang Tagalog, at inalis ang kalabisan ng “kaya” matapos ang “Dahil.” Hindi binago ang saklaw ng pananagutan ni Saul, ang pagtukoy sa banal na pangalan, o ang talinghaga ng nag-aalab na galit.
