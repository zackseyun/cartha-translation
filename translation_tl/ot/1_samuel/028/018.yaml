base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/018.yaml
  text: Because you did not obey the voice of Yahweh and did not carry out his burning anger against Amalek[a], therefore Yahweh has done this thing to you today.
translation:
  language: tl
  text: Dahil hindi mo sinunod ang tinig ni Yahweh at hindi mo isinagawa ang kanyang nag-aalab na galit laban sa Amalek[a], ginawa ito sa iyo ni Yahweh sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “hindi mo ipinatupad ang matindi niyang galit laban sa Amalek.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Dahil
  rationale: Sa konteksto, ipinakikilala ng pangatnig ang dahilan ng hatol kay Saul; natural at malinaw sa Tagalog ang “Dahil.”
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: sinunod ang tinig ni Yahweh
  rationale: Ang שׁמע בְּקוֹל ay nangangahulugang pagsunod, hindi lamang pakikinig; pinananatili ng “sinunod ang tinig” ang Hebreong larawan at diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulo.
- source_word: עָשִׂיתָ חֲרוֹן אַפּוֹ
  choice: isinagawa ang nag-aalab niyang galit
  rationale: Ang literal na idyoma ay tumutukoy sa pagsasakatuparan ng nag-aalab na galit ng Diyos laban sa Amalek; pinananatili rito ang kilos ng עשה at ang init na larawan ng חֲרוֹן אַף.
- source_word: בַּעֲמָלֵק
  choice: laban sa Amalek
  rationale: Ipinapakita ng “laban sa” na ang Amalek ang tudlaan ng pagpapatupad ng banal na galit.
- source_word: עַל כֵּן
  choice: kaya
  rationale: Malinaw at natural na ipinahahayag ng “kaya” ang bungang nagmumula sa pagsuway ni Saul.
- source_word: הַדָּבָר הַזֶּה
  choice: ito
  rationale: Sa Tagalog, sapat at mas natural ang “ito” para sa kasalukuyang pangyayari o hatol na tinutukoy ng הַדָּבָר הַזֶּה.
- source_word: עָשָׂה לְךָ יְהוָה
  choice: ginawa ito sa iyo ni Yahweh
  rationale: Pinananatili nito ang tuwirang kilos ng pandiwa at ang di-kanais-nais na epekto ng hatol kay Saul.
- source_word: הַיּוֹם הַזֶּה
  choice: sa araw na ito
  rationale: Pinananatili ang tahasang temporal na diin ng Hebreo sa dignificado at madaling maunawaang Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ay tuwirang transliterasyon at hindi pagpapalit nito ng titulo.
- issue: Ang papel ni Saul sa galit ng Diyos laban sa Amalek
  choice: isinagawa ang nag-aalab niyang galit
  alternative: ibinuhos ang matinding galit niya
  rationale: Hindi sinasabing sariling galit ni Saul ang tinutukoy; ang panghalip ay tumutukoy kay Yahweh, at tungkulin ni Saul na isakatuparan ang iniutos na hatol. Pinananatili ang tensiyon ng idyoma sa halip na palawakin ito sa paliwanag.
translation_notes:
  register: Makabagong Filipino Tagalog na dignificado at tuwiran. Pinanatili ang Hebreong larawang “tinig” at “nag-aalab na galit,” habang inayos ang pangungusap ayon sa natural na daloy ng Tagalog.
