base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/023.yaml
  text: But he refused and said[a], “I will not eat.” Yet his servants, along with the woman, urged him, and he listened to their voice[c][b]. So he rose from the ground and sat on the bed.
translation:
  language: tl
  text: Ngunit tumanggi siya at sinabi, “Hindi ako kakain.” Pero mapilit siyang hinikayat ng kanyang mga lingkod at ng babae. Nakinig siya sa kanila. Kaya bumangon siya mula sa lupa at umupo sa higaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “higaan” ay maaari ring tumukoy sa isang sopa o diban.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: tumanggi siya
  rationale: Tuwirang ipinahahayag ng מָאֵן ang pagtanggi o hindi pagpayag; natural at malinaw ito sa makabagong Tagalog.
- source_word: לֹא אֹכַל
  choice: Hindi ako kakain
  rationale: Pinananatili ang payak at mariing pagtanggi ni Saul nang hindi nagdaragdag ng bagay na kakainin.
- source_word: וַיִּפְרְצוּ בוֹ
  choice: mapilit siyang hinikayat
  rationale: Ang idyomang פרץ ב ay nagpapahiwatig ng matinding pagpupumilit, hindi literal na pagsalakay o pagwasak.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Sa kontekstong makahari, tumutukoy ito sa mga taong naglilingkod o umaalalay kay Saul; hindi sentro rito ang legal na katayuan nila.
- source_word: וְגַם הָאִשָּׁה
  choice: at ng babae
  rationale: Isinasama ng parirala ang babae sa mga lingkod bilang mga humihikayat kay Saul; naihahatid ng 'at' ang dagdag na kalahok nang natural.
- source_word: וַיִּשְׁמַע לְקֹלָם
  choice: Nakinig siya sa kanila
  rationale: Natural na Tagalog para sa idyomang literal na 'nakinig siya sa kanilang tinig'; hindi ito labis na binibigyang-kahulugang ganap na pagsunod.
- source_word: מֵהָאָרֶץ
  choice: mula sa lupa
  rationale: Tumutukoy sa kinalalagyan ni Saul sa lupa; tuwiran at angkop sa tagpo.
- source_word: וַיֵּשֶׁב אֶל הַמִּטָּה
  choice: umupo sa higaan
  rationale: Ang מִטָּה ay maaaring higaan o isang uri ng sopa; 'higaan' ang karaniwang salin habang pinananatili sa talababa ang alternatibo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'mapilit siyang hinikayat' upang likas na maipahayag ang puwersa ng Hebreong idyoma; iniwasan ang sobrang literal na 'nakinig sa kanilang tinig' dahil hindi ito likas sa Tagalog, ngunit hindi rin isinaling 'sumunod' upang huwag palabis ang kahulugan.
