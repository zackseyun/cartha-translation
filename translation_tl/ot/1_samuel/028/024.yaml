base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/024.yaml
  text: The woman had a fattened calf in the house[a], and she hurried and slaughtered it. Then she took flour, kneaded it[c][b], and baked unleavened bread.
translation:
  language: tl
  text: May pinatabang guya ang babae sa bahay[a]. Nagmadali siyang katayin iyon[b]. Pagkatapos ay kumuha siya ng harina, minasa niya iyon, at inihurno niya ito bilang mga tinapay na walang pampaalsa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “guyang inalagaan sa kulungan”; tradisyonal na “pinatabang guya.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Hebreo ay maaari ring gamitin para sa rituwal na pagkatay sa ilang konteksto, ngunit dito ay tumutukoy ito sa pagkatay ng hayop upang ihanda bilang pagkain.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “matzot” o “mga tinapay na walang pampaalsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵגֶל מַרְבֵּק
  choice: pinatabang guya
  rationale: Ang עֵגֶל ay batang baka o guya, at ang מַרְבֵּק ay tumutukoy sa hayop na sadyang pinataba, malamang na inalagaan sa kulungan. Likas at malinaw sa modernong Tagalog ang “pinatabang guya.”
- source_word: בַּבַּיִת
  choice: sa bahay
  rationale: Pinananatili nito ang tuwirang lokatibong kahulugan ng parirala.
- source_word: וַתְּמַהֵר
  choice: Nagmadali siya
  rationale: Ipinahahayag ng pandiwa ang agarang pagkilos o pagmamadali.
- source_word: וַתִּזְבָּחֵהוּ
  choice: katayin iyon
  rationale: Bagaman maaaring gamitin ang pandiwa sa konteksto ng paghahandog, ang konteksto rito ay paghahanda ng pagkain. Ang “katayin” ay tiyak at hindi nagdaragdag ng rituwal na kahulugan.
- source_word: קֶמַח
  choice: harina
  rationale: Ito ang karaniwan at malinaw na salitang Filipino para sa harinang ginagamit sa paggawa ng tinapay.
- source_word: וַתָּלָשׁ
  choice: minasa niya iyon
  rationale: Ang pandiwa ay tumutukoy sa pagmamasa. Ang panghalip ay natural na tumutukoy sa harinang ginagawang masa.
- source_word: וַתֹּפֵהוּ מַצּוֹת
  choice: inihurno bilang tinapay na walang pampaalsa
  rationale: Pinananatili ng “inihurno” ang tiyak na paraan ng pagluluto, at ipinahahayag ng “tinapay na walang pampaalsa” ang מַצּוֹת sa malinaw na modernong Tagalog.
theological_decisions:
- issue: Posibleng rituwal na diwa ng וַתִּזְבָּחֵהוּ
  choice: katayin iyon
  alternative: ihandog iyon
  rationale: Walang pahiwatig sa talata na ito ay rituwal na paghahandog; ang hayop ay kinatay upang ihanda bilang pagkain. Iniiwasan ng salin ang pagpasok ng teolohikal na kahulugang hindi hinihingi ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pinatabang guya,” “katayin,” at “inihurno” bilang pangkaraniwan ngunit tiyak na mga salita. Hinati sa maiikling pangungusap ang sunod-sunod na Hebreong sugnay upang maging natural basahin nang hindi binabago ang pagkakasunod ng mga kilos.
