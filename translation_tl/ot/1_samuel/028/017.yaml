  naturalness: Natural at marangal ang pangkalahatang Filipino. Mas maayos ang “gaya ng sinabi niya sa pamamagitan ko” upang maipahayag ang paghahambing sa Hebreo, at nauunawaan pa rin ang sadyang di-karaniwang “para sa kanyang sarili.”
  terminology: Ang “Yahweh,” “kaharian,” at “kay David” ay angkop. Ang “iyong kapwa” ay katanggap-tanggap para sa רֵעֲךָ dahil agad itong nililinaw ng “kay David.”
