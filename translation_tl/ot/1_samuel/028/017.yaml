base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/017.yaml
  text: 'And Yahweh has done for you just as he spoke by my hand: Yahweh has torn the kingdom out of your hand and given it to your neighbor[b][a], to David.'
translation:
  language: tl
  text: 'At ginawa ni Yahweh para sa kanyang sarili, gaya ng sinabi niya sa pamamagitan ko: pinunit ni Yahweh ang kaharian mula sa iyong kamay at ibinigay ito sa iyong kapwa, kay David.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa unang sugnay, literal na mababasa sa Hebreo: “ginawa ni Yahweh para sa kanya/para sa kanyang sarili.” Maraming salin ang nagsasabing “ginawa sa iyo” o “ginawa para sa iyo,” ayon sa konteksto o ibang tradisyong tekstuwal.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH, alinsunod sa patakaran ng proyekto.
- source_word: וַיַּעַשׂ ... לוֹ
  choice: ginawa ... para sa kanyang sarili
  rationale: Pinananatili ang Masoretikong לוֹ, ‘para sa kanya/para sa kanyang sarili,’ sa halip na tahimik na baguhin tungo sa ‘sa iyo.’
- source_word: כַּאֲשֶׁר דִּבֶּר בְּיָדִי
  choice: ang mismong sinabi niya sa pamamagitan ko
  rationale: Natural na Filipino para sa Hebreong idyomang בְּיַדִי, na nagpapahayag ng pagkilos sa pamamagitan ng isang tagapamagitan.
- source_word: וַיִּקְרַע
  choice: inagaw
  rationale: Ipinahahayag ang marahas na pag-alis na nasa metaporang ‘pinunit,’ habang natural na tumutukoy sa pagkuha ng kaharian mula sa kapangyarihan ni Saul.
- source_word: הַמַּמְלָכָה
  choice: ang kaharian
  rationale: Karaniwan at malinaw na katumbas para sa sakop ng paghahari ni Saul.
- source_word: מִיָּדֶךָ
  choice: mula sa iyong kamay
  rationale: Pinananatili ang konkretong Hebreong larawan ng pag-alis mula sa pag-aari o kapangyarihan ni Saul.
- source_word: וַיִּתְּנָהּ
  choice: at ibinigay iyon
  rationale: Ang ‘iyon’ ay tumutukoy pabalik sa kaharian at nagpapanatili sa magkakaugnay na natapos na mga kilos.
- source_word: לְרֵעֲךָ
  choice: sa iyong kapwa
  rationale: Saklaw ng רֵעַ ang kapwa, kasamahan, o malapit na tao; nililinaw ng kasunod na ‘kay David’ ang tinutukoy.
- source_word: לְדָוִד
  choice: kay David
  rationale: Natural na panandang Filipino para sa personal na pangalan bilang tumatanggap.
theological_decisions:
- issue: Ang Masoretikong pagbasa na לוֹ sa unang sugnay
  choice: Isinalin bilang ‘para sa kanyang sarili.’
  alternative: ‘sa iyo’ o ‘para sa iyo’
  rationale: Malinaw na לוֹ (‘para sa kanya/para sa kanyang sarili’) ang ibinigay na Hebreo, hindi לְךָ (‘para sa iyo’). Pinananatili ang tekstuwal na tensiyon sa halip na tahimik itong ayusin batay sa konteksto.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang ‘sa pamamagitan ko’ sa halip na literal na ‘sa pamamagitan ng aking kamay’ upang maging natural, ngunit pinanatili ang di-karaniwang Masoretikong pagbasa na ‘para sa kanyang sarili.’
