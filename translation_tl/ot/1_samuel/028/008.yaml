  text: וַ/יִּתְחַפֵּ֣שׂ שָׁא֗וּל וַ/יִּלְבַּשׁ֙ בְּגָדִ֣ים אֲחֵרִ֔ים וַ/יֵּ֣לֶךְ ה֗וּא וּ/שְׁנֵ֤י אֲנָשִׁים֙ עִמּ֔/וֹ וַ/יָּבֹ֥אוּ אֶל הָ/אִשָּׁ֖ה לָ֑יְלָה וַ/יֹּ֗אמֶר קסומי נָ֥א לִ/י֙ בָּ/א֔וֹב וְ/הַ֣עֲלִי לִ֔/י אֵ֥ת אֲשֶׁר אֹמַ֖ר אֵלָֽיִ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/008.yaml
  text: So Saul disguised himself and put on other clothes[a], and he went, he and two men with him. They came to the woman by night, and he said, “Please divine for me by a medium, and bring up for me the one whom I name to you.”
translation:
  language: tl
  text: Kaya nagbalatkayo si Saul at nagsuot ng ibang damit. Umalis siya kasama ang dalawang lalaking kasama niya. Gabi nang makarating sila sa babae. Sinabi ni Saul, “Manghula ka nga para sa akin sa pamamagitan ng isang espiritu[a], at paahunin mo para sa akin ang sasabihin ko sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bilang espiritista.” Ang salitang Hebreo ay maaaring tumukoy sa espiritu ng patay na sinasangguni o sa taong nagsisilbing tagapamagitan sa gayong pagsangguni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַפֵּשׂ
  choice: nagbalatkayo
  rationale: Likas at tiyak na salitang Tagalog para sa sadyang pagbabago ng anyo upang maitago ang pagkakakilanlan; pinananatili nito ang reflexive na diwa ng hitpael.
- source_word: בְּגָדִים אֲחֵרִים
  choice: ibang damit
  rationale: Payak at natural na modernong Tagalog na malinaw na tumutukoy sa pagpapalit ng kasuotan bilang bahagi ng pagbabalatkayo.
- source_word: וַיֵּלֶךְ הוּא וּשְׁנֵי אֲנָשִׁים עִמּוֹ
  choice: Umalis siya kasama ang dalawa niyang tauhan
  rationale: Pinananatili ang tahasang pagbanggit kay Saul at sa dalawang lalaking kasama niya, habang iniiwasan ang pilit na ayos ng pangungusap sa Tagalog. Ang “tauhan” ay angkop sa dalawang lalaking kasama ng hari sa konteksto.
- source_word: לָיְלָה
  choice: Gabi nang makarating sila
  rationale: Natural na paraan sa Tagalog upang ipahayag na sa gabi naganap ang kanilang pagdating, kasabay ng pagpapanatili sa lihim na tagpuan ng salaysay.
- source_word: קָסֳמִי נָא לִי
  choice: Manghula ka nga para sa akin
  rationale: Ang “manghula” ay madaling maunawaang katumbas ng pagsasagawa ng dibinasyon; ipinahahayag ng “nga” sa pakiusap ang magalang ngunit tuwirang נָא.
- source_word: בָּאוֹב
  choice: sa pamamagitan ng isang espiritu[a]
  rationale: Pinananatili nito sa pangunahing teksto ang espiritistikong paraan ng konsultasyon nang hindi nagpapasiya kung ang אוֹב ay mismong espiritu ng patay o ang espiritistang tagapamagitan; ipinaliliwanag sa talababa ang tunay na leksikal na kalabuan.
- source_word: וְהַעֲלִי לִי
  choice: at paahunin mo para sa akin
  rationale: Pinananatili ang sanhi at pataas na larawang ipinahihiwatig ng hiphil ng עלה sa halip na palitan ito ng mas interpretatibong “ipatawag.”
- source_word: אֵת אֲשֶׁר אֹמַר אֵלָיִךְ
  choice: ang taong tutukuyin ko sa iyo
  rationale: Natural na Tagalog para sa taong sasabihin o papangalanan ni Saul, nang hindi nagdaragdag ng pagkakakilanlan na wala pa sa talata.
theological_decisions:
- issue: Paglalarawan sa nekromansiya nang hindi pinagtitibay o itinatanggi ang bisa nito
  choice: Inilahad nang tuwiran ang kahilingan ni Saul—“manghula,” “sa pamamagitan ng isang espiritu,” at “paahunin”—ayon sa pananaw at larawan ng salaysay.
  alternative: Magdagdag ng mapagdudang pananalita gaya ng “magkunwaring paahunin,” o mas tiyak na pananalitang gaya ng “tawagin ang tunay na espiritu ng patay.”
  rationale: Hindi nagpapasiya ang pagsasalin tungkol sa mekanismo o bisa ng nekromansiya; pinananatili nito ang teolohikal at naratibong tensiyon ng Hebreong teksto.
- issue: Kalabuan ng אוֹב
  choice: “isang espiritu[a]” sa teksto, na may talababa tungkol sa posibleng kahulugang “espiritista.”
  alternative: Isalin lamang bilang “espiritista” o lamang bilang “espiritu ng patay.”
  rationale: Maaaring tumukoy ang salita sa espiritu o sa taong nagsisilbing tagapamagitan. Ang teksto at talababa ay magkasamang nagpapanatili ng kalabuan sa halip na tahimik itong lutasin.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit payak na himig. Ginamit ang “nagbalatkayo,” “ibang damit,” at “manghula” bilang mga salitang madaling maunawaan; pinanatili ng “paahunin” ang natatanging larawan ng Hebreo. Inilagay ang tandang [a] sa terminong talagang tinatalakay ng talababa.
