  to: Kaya nagbalatkayo si Saul at nagsuot ng ibang damit. Umalis siya kasama ang dalawang lalaking kasama niya. Gabi nang makarating sila sa babae. Sinabi ni Saul, “Manghula ka nga para sa akin sa pamamagitan ng isang espiritu[a], at paahunin mo para sa akin ang sasabihin ko sa iyo.”
