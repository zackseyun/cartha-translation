  yaml_path: translation/ot/1_samuel/028/005.yaml
  text: When Saul saw the camp of the Philistines[a], he was afraid, and his heart trembled greatly.
translation:
  language: tl
  text: Nang makita ni Saul ang kampo ng mga Filisteo, natakot siya, at labis na nanginig ang kanyang puso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “labis na kinilabutan ang kanyang puso.” Pinananatili sa Hebreo ang larawan ng puso bilang sentro ng panloob na takot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: makita
  rationale: Karaniwang pandiwa ito para sa tuwirang pagkakita; ang “makita” ay natural sa sugnay na nagsasaad ng pangyayaring nagbunsod sa takot ni Saul.
- source_word: מַחֲנֵה
  choice: kampo
  rationale: Pinananatili ng “kampo” ang kongkretong larawan ng kinalalagyan ng hukbong Filisteo nang hindi ito pinapakahulugang “hukbo” lamang.
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Ito ang karaniwan at madaling makilalang anyo ng pangalan ng pangkat ng mga tao sa Tagalog.
- source_word: וַיִּרָא
  choice: natakot siya
  rationale: Tuwiran at likas na ipinapahayag nito ang takot na sumunod sa pagkakita ni Saul sa kampo.
- source_word: וַיֶּחֱרַד
  choice: nanginig
  rationale: Sinasalamin nito ang matinding panloob at halos pisikal na pagkagimbal na ipinahihiwatig ng pandiwang Hebreo, nang hindi ito labis na ipinapaliwanag.
- source_word: לִבּוֹ
  choice: ang kanyang puso
  rationale: Pinananatili nito ang tahasang larawang Hebreo ng puso bilang sentro ng panloob na takot, sa halip na gawing abstraktong “kalooban” o paraprasis.
- source_word: מְאֹד
  choice: labis
  rationale: Malinaw at natural na naipahahayag ng “labis” ang matinding antas ng panginginig.
theological_decisions: []
