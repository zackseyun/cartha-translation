  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang kongkretong larawang “kampo” at ang Hebreong idyomang “nanginig ang kanyang puso,” habang ginawang natural ang daloy sa pamamagitan ng sugnay na “Nang makita.”
