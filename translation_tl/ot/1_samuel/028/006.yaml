base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/006.yaml
  text: Saul inquired of Yahweh[a], but Yahweh did not answer him[b], either by dreams or by the Urim or by the prophets.
translation:
  language: tl
  text: Sumangguni si Saul kay Yahweh, ngunit hindi siya sinagot ni Yahweh sa pamamagitan ng mga panaginip, ng Urim[a], o ng mga propeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Urim ay isang paraang ginagamit ng mga pari sa pagsangguni para sa patnubay mula sa Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Sumangguni
  rationale: Sa konstruksiyong שׁאל ב na may pangalan ng Diyos, ang diwa ay paghingi ng patnubay o pahayag mula sa Diyos, hindi lamang pagtatanong.
- source_word: בַּיהוָה / יְהוָה
  choice: kay Yahweh / ni Yahweh
  rationale: Pinananatili ang personal na pangalang יְהוָה bilang “Yahweh”; ang pang-ukol at ugnayang panggramatika ay likas na ipinahayag sa Tagalog bilang “kay” at “ni.”
- source_word: וְלֹא עָנָהוּ
  choice: ngunit hindi siya sinagot
  rationale: Tuwirang ipinahahayag ng ענה ang hindi pagbibigay ng tugon sa pagsangguni ni Saul.
- source_word: גַּם ... גַּם ... גַּם
  choice: sa pamamagitan man ng ... ng ... o ng
  rationale: Kasunod ng negatibong sugnay, natural na ipinakikita ng “man ... o” ang tatlong paraang walang naibigay na sagot.
- source_word: בַּחֲלֹמוֹת
  choice: sa pamamagitan ng mga panaginip
  rationale: Ipinahahayag nito ang mga panaginip bilang paraan ng paghahatid ng banal na pahayag.
- source_word: בָּאוּרִים
  choice: ng Urim
  rationale: Pinananatili ang transliterasyong “Urim” sapagkat tumutukoy ito sa isang natatanging kasangkapang kaugnay ng pagsangguni ng mga pari at hindi tiyak ang literal na salin nito.
- source_word: בַּנְּבִיאִם
  choice: ng mga propeta
  rationale: Ang maramihang נביאים ay natural na isinaling “mga propeta,” na mga taong daluyan ng pahayag ng Diyos.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Direktang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito ginagawang titulo.
- issue: Dahilan ng hindi pagsagot kay Saul
  choice: Hindi ipinaliwanag ang dahilan; sinabi lamang na walang sagot sa alinman sa tatlong paraang nakalista.
  alternative: Magdagdag ng paliwanag kung bakit tumanggi ang Diyos na sumagot.
  rationale: Hindi sinasabi ng talata mismo ang dahilan, kaya pinananatili ang teolohikal na tensiyon at iniiwasan ang pagpapakahulugang wala sa teksto.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “sumangguni” upang malinaw na tumukoy sa paghingi ng banal na patnubay, at pinanatili ang maikli at mariing ayos ng Hebreo.
