  source_fidelity: 'Tumpak ang pangunahing diwa: sumangguni si Saul kay Yahweh at walang tugon sa pamamagitan ng mga panaginip, Urim, o mga propeta. Gayunman, ang em dash at ang ayos na “sa pamamagitan man” ay bahagyang nagpapalabo sa saklaw ng pagtanggi; mas tuwiran at mas malinaw na ikabit ang tatlong paraan sa “hindi siya sinagot.”'
  naturalness: Ang “Sumangguni si Saul kay Yahweh” at “hindi siya sinagot ni Yahweh” ay likas at angkop sa modernong Filipino. Mas maayos ang walang em dash at ang payak na talaan ng mga paraan ng pagtugon.
  terminology: Ang “Yahweh,” “Urim,” at “mga propeta” ay angkop. Mas maingat na ilarawan sa talababa ang Urim bilang paraan ng pagsangguni ng mga pari, sa halip na tiyak na “kasangkapan,” dahil hindi ganap na tiyak ang eksaktong anyo nito.
