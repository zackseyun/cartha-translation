    rationale: Bagaman nauunawaan, mas malinaw at mas natural sa Filipino na direktang ilista ang mga paraang walang ibinigay na sagot pagkatapos ng pandiwang “sinagot.”
  - severity: low
    issue: Masyadong kongkreto ang “kasangkapan” sa talababa para sa Urim.
    rationale: Ang Urim ay isang paraang pangparing pagsangguni, ngunit pinagtatalunan ang eksaktong anyo o mekanismo nito; mas mabuting huwag itong tukuying isang pisikal na kasangkapan.
