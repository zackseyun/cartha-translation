base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/021.yaml
  text: The woman came to Saul[a], and when she saw that he was very terrified, she said to him, “Behold, your servant has obeyed your voice[b], and I have put my life in my hand and listened to your words that you spoke to me.”
translation:
  language: tl
  text: Lumapit ang babae kay Saul. Nang makita niyang takot na takot ito, sinabi niya, “Tingnan po ninyo, sinunod ng inyong lingkod[a] ang sinabi ninyo. Isinapanganib ko ang aking buhay[b] at pinakinggan ang mga sinabi ninyo sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “nakinig ang inyong aliping babae sa inyong tinig”; ang pananalitang ito ay nangangahulugang sinunod o tinalima niya ang sinabi ni Saul.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na Hebreo, “inilagay ko ang aking buhay sa aking palad,” isang idyoma na nangangahulugang isinapanganib niya ang kanyang buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא הָאִשָּׁה אֶל שָׁאוּל
  choice: Lumapit ang babae kay Saul
  rationale: Ipinagpapatuloy ng pandiwang Hebreo ang salaysay at inilalarawan ang pagpunta ng babae kay Saul. Ang “lumapit” ay likas sa Tagalog at hindi nagdaragdag ng katawagang “manggagaway” na wala sa talata.
- source_word: וַתֵּרֶא כִּי נִבְהַל מְאֹד
  choice: Nang makita niyang takot na takot ito
  rationale: Ang נבהל ay maaaring tumukoy sa matinding pagkagulat, pagkabalisa, o pagkatakot; ipinahahayag ng “takot na takot” ang tindi ng מְאֹד sa malinaw at kasalukuyang Tagalog.
- source_word: הִנֵּה
  choice: Tingnan po ninyo
  rationale: Isa itong panandang pantawag-pansin sa pakiusap ng babae. Pinananatili ng “tingnan” ang puwersa nito, samantalang ang “po” ay likas na nagpapakita ng paggalang sa kausap sa Tagalog.
- source_word: שָׁמְעָה שִׁפְחָתְךָ בְּקוֹלֶךָ
  choice: sinunod ng inyong lingkod ang sinabi ninyo
  rationale: Karaniwang nangangahulugang sumunod o tumalima ang idyomang שׁמע בקול. Ang “inyong lingkod” ay likas na mapagpakumbabang pagtukoy sa sarili; malinaw na babae ang nagsasalita kahit walang kasariang pambalarila ang salitang Tagalog.
- source_word: וָאָשִׂים נַפְשִׁי בְּכַפִּי
  choice: Isinapanganib ko ang aking buhay
  rationale: Ipinahahayag nito nang natural sa Tagalog ang kahulugan ng idyomang Hebreo, habang inilalagay sa talababa ang literal na larawan.
- source_word: וָאֶשְׁמַע אֶת דְּבָרֶיךָ אֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: at pinakinggan ang mga sinabi ninyo sa akin
  rationale: Pinananatili ng “pinakinggan” ang pagkakaiba nito sa naunang idyomang isinaling “sinunod,” ngunit ipinahihiwatig pa rin ng konteksto ang pagtugon niya sa sinabi ni Saul.
