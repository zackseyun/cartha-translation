id: 1SA.28.12
reference: 1 Samuel 28:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אִשָּׁה֙ אֶת שְׁמוּאֵ֔ל וַ/תִּזְעַ֖ק בְּ/ק֣וֹל גָּד֑וֹל וַ/תֹּאמֶר֩ הָ/אִשָּׁ֨ה אֶל שָׁא֧וּל לֵ/אמֹ֛ר לָ֥/מָּה רִמִּיתָ֖/נִי וְ/אַתָּ֥ה שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/012.yaml
  text: When the woman saw Samuel[a], she cried out with a loud voice, and the woman said to Saul, “Why have you deceived me? You are Saul!”
translation:
  language: tl
  text: Nang makita ng babae si Samuel[a], napasigaw siya nang malakas. Sinabi ng babae kay Saul, “Bakit mo ako nilinlang? Ikaw pala si Saul!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang anyong waring si Samuel.” “Samuel” lamang ang sinasabi ng tekstong Hebreo, at hindi nito ipinaliliwanag ang kalikasan ng pagpapakitang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: makita
  rationale: Ang ראה sa anyong pasalaysay ay tuwirang nangangahulugang “makita”; hindi dinaragdagan ng interpretasyong gaya ng “mahiwatigan.”
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Karaniwang katawagan na “ang babae” ang ginamit sa Hebreo, hindi ang katawagang tumutukoy sa kaniyang papel bilang espiritista.
- source_word: אֶת שְׁמוּאֵל
  choice: si Samuel
  rationale: Tuwirang tinutukoy ng tekstong Hebreo si Samuel bilang nakita ng babae; pinananatili ito nang walang paliwanag sa pangunahing teksto.
- source_word: וַתִּזְעַק בְּקוֹל גָּדוֹל
  choice: napasigaw siya nang malakas
  rationale: Ipinahahayag ng זעק at ng pariralang בְּקוֹל גָּדוֹל ang isang bigla at malakas na sigaw. Natural sa modernong Tagalog ang “napasigaw ... nang malakas.”
- source_word: וַתֹּאמֶר ... לֵאמֹר
  choice: Sinabi
  rationale: Hindi kailangang ulitin sa Tagalog ang literal na “sinabi ... na sinasabi”; sapat at natural ang “Sinabi.”
- source_word: לָמָּה רִמִּיתָנִי
  choice: Bakit mo ako nilinlang?
  rationale: Ang piel ng רמה ay nagpapahiwatig ng panlilinlang. Malinaw at marangal na katumbas sa Tagalog ang “nilinlang.”
- source_word: וְאַתָּה שָׁאוּל
  choice: Ikaw pala si Saul!
  rationale: Ipinakikita ng hayag na panghalip na אַתָּה ang diin. Natural na naihahayag sa Tagalog ng “Ikaw pala” ang biglaang pagkakakilala at pagbubunyag, samantalang pinananatili ng tandang padamdam ang tindi.
theological_decisions:
- issue: Kung dapat bang tukuyin sa pangunahing teksto si Samuel bilang espiritu, aparisyon, o anyong wari'y si Samuel
  choice: Panatilihin ang tuwirang katawagang “Samuel”
  alternative: “ang anyong waring si Samuel” o “ang espiritu ni Samuel”
  rationale: Sinasabi lamang ng Hebreong salaysay na nakita ng babae si Samuel. Ang pagdaragdag ng “espiritu,” “aparisyon,” o katulad na panuring ay magpapasya sa isang usaping hindi nililinaw ng talata. Pinananatili ng salin at talababa ang tunay na teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “napasigaw” upang ihatid ang biglaan at matinding reaksiyon, at “Ikaw pala” upang natural na ipahayag ang mariing pagkakakilala kay Saul.
