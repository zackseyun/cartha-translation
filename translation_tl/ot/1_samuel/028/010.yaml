  text: וַ/יִּשָּׁ֤בַֽע לָ/הּ֙ שָׁא֔וּל בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר חַי יְהוָ֕ה אִֽם יִקְּרֵ֥/ךְ עָוֺ֖ן בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/010.yaml
  text: So Saul swore to her by Yahweh[a], saying, “As Yahweh lives, no punishment will come upon you in this matter.”
translation:
  language: tl
  text: Kaya sumumpa si Saul sa kanya sa pamamagitan ni Yahweh, na nagsasabi, “Buhay si Yahweh, walang kaparusahang sasapit sa iyo dahil sa bagay na ito.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “walang pagkakasala o pananagutang sasapit sa iyo dahil sa bagay na ito.” Ang salitang Hebreo ay maaaring mangahulugang kasamaan, pagkakasala, pananagutan, o kaparusahang bunga ng pagkakasala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: sumumpa
  rationale: Ang Niphal ng שׁבע ay nangangahulugang manumpa; natural at marangal sa modernong Tagalog ang “sumumpa.”
- source_word: לָהּ
  choice: sa kanya
  rationale: Tuwirang ipinahahayag ang di-tuwirang layon na tumutukoy sa babae.
- source_word: בַּיהוָה
  choice: sa pangalan ni Yahweh
  rationale: Ipinahihiwatig ng בְּ ang pagtawag kay Yahweh bilang saksi at batayan ng panunumpa; mas natural ito sa Tagalog kaysa sa literal na “sa pamamagitan ni Yahweh.”
- source_word: חַי יְהוָה
  choice: Buhay si Yahweh
  rationale: Pinananatili ang karaniwang Hebreong pormula ng panunumpa sa maikli at likas na anyong Tagalog.
- source_word: אִם
  choice: walang
  rationale: Sa konteksto ng panunumpa, ang אִם ay bahagi ng pinaikling sumpang may mariing negatibong diwa, hindi karaniwang kondisyunal na “kung.”
- source_word: יִקְּרֵךְ
  choice: sasapit sa iyo
  rationale: Ipinapahayag nito ang diwang may mangyayari o darating sa isang tao; natural at angkop sa solemneng pananalita ang “sasapit.”
- source_word: עָוֺן
  choice: kaparusahan
  rationale: Maaaring tumukoy ang עָוֺן sa kasamaan, pagkakasala, pananagutan, o kaparusahang bunga nito. Sa konteksto, tinitiyak ni Saul na hindi daranas ang babae ng parusang kahihinatnan.
- source_word: בַּדָּבָר הַזֶּה
  choice: dahil sa bagay na ito
  rationale: Malinaw na iniuugnay nito ang ipinangakong kawalan ng kaparusahan sa gawaing tinatalakay.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang pinananatili ang personal na pangalang tipan na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng עָוֺן sa panunumpa ni Saul
  choice: kaparusahan
  alternative: pagkakasala; pananagutan sa kasalanan
  rationale: Sa agarang legal at pasalaysay na konteksto, ipinapangako ni Saul na walang parusang sasapit sa babae. Gayunman, hindi lubusang nilulutas ng salin ang lawak ng salitang Hebreo; inilalahad sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “sumumpa,” “Buhay si Yahweh,” at “sasapit” upang mapanatili ang solemneng himig ng panunumpa nang hindi nagiging makaluma. Inilagay ang marker na [a] kaagad pagkatapos ng pangungusap na saklaw ng paliwanag.
