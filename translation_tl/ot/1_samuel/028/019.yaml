revisions:
- from: Ibibigay din ni Yahweh ang Israel, kasama mo, sa kamay ng mga Filisteo; at bukas, ikaw at ang iyong mga anak na lalaki ay makakasama ko.[a] Ibibigay din ni Yahweh sa kamay ng mga Filisteo ang hukbo ng Israel.[b]
  to: Ibibigay din ni Yahweh ang Israel kasama mo sa kamay ng mga Filisteo; at bukas, ikaw at ang mga anak mong lalaki ay sasama sa akin.[a] Ibibigay din ni Yahweh sa kamay ng mga Filisteo ang hukbo ng Israel.[b]
  rationale: Nilinaw ang direksiyon ng pakikisama kay Samuel sa pamamagitan ng “sasama sa akin,” ngunit hindi idinagdag sa pangunahing teksto ang kamatayan, Sheol, o anumang tiyak na pag-unawa sa kalagayan ng mga patay. Pinanatili ang mga footnote anchor at ang leksikal na kalabuan ng מַחֲנֶה.
