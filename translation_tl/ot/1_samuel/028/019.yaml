  text: וְ/יִתֵּ֣ן יְ֠הוָה גַּ֣ם אֶת יִשְׂרָאֵ֤ל עִמְּ/ךָ֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/מָחָ֕ר אַתָּ֥ה וּ/בָנֶ֖י/ךָ עִמִּ֑/י גַּ֚ם אֶת מַחֲנֵ֣ה יִשְׂרָאֵ֔ל יִתֵּ֥ן יְהוָ֖ה בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/019.yaml
  text: And Yahweh will also give Israel with you into the hand of the Philistines[a], and tomorrow you and your sons will be with me[b]. Yahweh will also give the camp of Israel into the hand of the Philistines.
translation:
  language: tl
  text: Ibibigay din ni Yahweh ang Israel kasama mo sa kamay ng mga Filisteo; at bukas, ikaw at ang mga anak mong lalaki ay sasama sa akin.[a] Ibibigay din ni Yahweh sa kamay ng mga Filisteo ang hukbo ng Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sasama kayo sa akin sa kamatayan” o “sasama kayo sa akin sa Sheol.” “Kasama ko” lamang ang literal na sinasabi ng Hebreo.
    reason: alternative_reading
  - marker: b
    text: O “kampo ng Israel.” Ang salitang Hebreo ay maaaring mangahulugang “kampo” o, sa kontekstong ito, “hukbo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng tetragrammaton na YHWH.
- source_word: וְיִתֵּן / יִתֵּן
  choice: ibibigay
  rationale: Tuwirang sinasalamin ang נתן; kasama ng pariralang 'sa kamay ng,' malinaw itong nangangahulugang ipapasailalim sa kapangyarihan ng mga Filisteo.
- source_word: גַּם
  choice: din
  rationale: Ipinahihiwatig ang pagdaragdag sa naunang kapahayagan at pinananatili sa dalawang sugnay.
- source_word: עִמְּךָ
  choice: kasama mo
  rationale: Likas at tuwirang salin na nagpapakitang makikibahagi ang Israel sa sasapitin ni Saul.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: sa kamay ng mga Filisteo
  rationale: Pinananatili ang Hebreong larawan ng 'kamay' bilang kapangyarihan o pamamahala; nauunawaan din ito sa marangal na modernong Tagalog.
- source_word: וּמָחָר
  choice: at bukas
  rationale: Pinananatili ang pangatnig at ang taimtim na pagkakasunod-sunod ng pahayag.
- source_word: וּבָנֶיךָ
  choice: at ang iyong mga anak na lalaki
  rationale: Tiyak na tumutukoy ang בנים sa mga anak na lalaki ni Saul sa kontekstong ito.
- source_word: עִמִּי
  choice: makakasama ko
  rationale: Pinananatili ang maikli at hindi ganap na tinutukoy na pahayag ng Hebreo, nang hindi idinaragdag sa pangunahing teksto ang 'sa kamatayan' o 'sa Sheol.'
- source_word: מַחֲנֵה יִשְׂרָאֵל
  choice: hukbo ng Israel
  rationale: Maaaring mangahulugan ang מַחֲנֶה ng kampo o hukbo; sa konteksto ng nalalapit na labanan, natural at malinaw ang 'hukbo,' habang inilalagay sa talababa ang leksikal na alternatibo.
theological_decisions:
- issue: Kahulugan ng pahayag na 'bukas, ikaw at ang iyong mga anak na lalaki ay makakasama ko'
  choice: makakasama ko
  alternative: makakasama ko sa kamatayan; makakasama ko sa Sheol
  rationale: Hindi tahasang binabanggit ng Hebreo ang kamatayan, libingan, o Sheol. Kaya pinananatili ng salin ang tunay na kalabuan at hindi nagpapasok ng mas tiyak na doktrina tungkol sa kalagayan ng mga patay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'Yahweh' para sa pangalan ng Diyos, pinanatili ang idyomang 'sa kamay ng,' at iniwasang linawin nang lampas sa Hebreo ang kalagayan ni Saul at ng kanyang mga anak pagkatapos ng kamatayan.
