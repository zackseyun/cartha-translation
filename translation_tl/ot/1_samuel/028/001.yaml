  text: וַֽ/יְהִי֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם וַ/יִּקְבְּצ֨וּ פְלִשְׁתִּ֤ים אֶת מַֽחֲנֵי/הֶם֙ לַ/צָּבָ֔א לְ/הִלָּחֵ֖ם בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֤אמֶר אָכִישׁ֙ אֶל דָּוִ֔ד יָדֹ֣עַ תֵּדַ֗ע כִּ֤י אִתִּ/י֙ תֵּצֵ֣א בַֽ/מַּחֲנֶ֔ה אַתָּ֖ה וַ/אֲנָשֶֽׁי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/001.yaml
  text: In those days the Philistines gathered their camps for war[a], to fight against Israel. And Achish said to David, “You surely know that you and your men must go out with me in the camp.”
translation:
  language: tl
  text: Nang panahong iyon, tinipon ng mga Filisteo ang kanilang mga hukbo para sa digmaan upang makipaglaban sa Israel. Sinabi ni Akis kay David, “Tiyak na alam mong ikaw at ang iyong mga tauhan ay lalabas na kasama ko sa hukbo[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kampo.” Ang salitang Hebreo ay maaaring tumukoy sa mismong kampo o, sa mas malawak na diwa, sa puwersang militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: Nang panahong iyon
  rationale: Natural na panandang pasalaysay sa modernong Tagalog na pinananatili ang temporal na diwa nang hindi nagdaragdag ng salitang katumbas ng ‘ngayon.’
- source_word: וַיִּקְבְּצוּ פְלִשְׁתִּים אֶת מַחֲנֵיהֶם לַצָּבָא
  choice: tinipon ng mga Filisteo ang kanilang mga hukbo para sa digmaan
  rationale: Ang מַחֲנֶה ay maaaring tumukoy sa kampo o sa puwersang militar. Sa konteksto ng pagtitipon para sa digmaan, mas malinaw at natural ang ‘mga hukbo’ kaysa ‘mga kampo,’ habang ang layuning militar ng לַצָּבָא ay ipinapahayag ng ‘para sa digmaan.’
- source_word: לְהִלָּחֵם בְּיִשְׂרָאֵל
  choice: upang makipaglaban sa Israel
  rationale: Tuwirang ipinapahayag ang layunin at ang labanang nakatuon laban sa Israel; sa Tagalog, malinaw na ang salungatang diwa ng ‘makipaglaban sa.’
- source_word: יָדֹעַ תֵּדַע
  choice: Tiyak na alam mo
  rationale: Pinananatili ng ‘tiyak’ ang diin ng infinitive absolute kasama ng pandiwang may hangganan.
- source_word: אִתִּי תֵצֵא
  choice: lalabas na kasama ko
  rationale: Pinananatili ang literal na larawan ng paglabas kasama ni Akis at ang matibay na inaasahang kilos, nang hindi ginagawang tahasang utos ang maaaring basahing pahayag ng katiyakan o obligasyon.
- source_word: בַּמַּחֲנֶה
  choice: sa hukbo
  rationale: Sa kontekstong militar, ang ‘hukbo’ ay natural na tumutukoy sa puwersang sasama sa pagkilos; inilalahad sa talababa ang mas literal na ‘kampo.’
- source_word: אַתָּה וַאֲנָשֶׁיךָ
  choice: ikaw at ang iyong mga tauhan
  rationale: Pinananatili ang tahasang pagbanggit kay David at sa mga lalaking nasa ilalim niya sa natural na Tagalog.
- source_word: אָכִישׁ
  choice: Akis
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang biblikal.
theological_decisions:
- issue: Lakas ng pahayag ni Akis sa תֵּצֵא
  choice: ‘lalabas’ bilang mariing inaasahang kilos
  alternative: ‘dapat kang lumabas’ bilang tahasang obligasyon
  rationale: Maaaring pragmatikong magpahiwatig ng obligasyon ang anyong panghinaharap, ngunit hindi kinakailangang gawing tahasang ‘dapat’ sa pangunahing teksto. Pinananatili nito ang bahagyang tensiyon sa pagitan ng katiyakan at utos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘Filisteo,’ ‘Akis,’ ‘hukbo,’ at ‘mga tauhan’ bilang natural at pamilyar na mga anyong biblikal; iniwasan ang labis na makalumang ayos at ang pagdaragdag ng denominasyonal na pagpapakahulugan.
