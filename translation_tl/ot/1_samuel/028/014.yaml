base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/014.yaml
  text: He said to her[a], “What is his appearance?” And she said, “An old man is coming up, and he is wrapped in a robe.” Then Saul knew that it was Samuel[c][b], and he bowed with his face to the ground and prostrated himself.
translation:
  language: tl
  text: Sinabi niya sa babae, “Ano ang anyo niya?” Sumagot ang babae, “Isang matandang lalaki ang umaahon[a], at nababalutan siya ng balabal[b].” Kaya nalaman ni Saul na si Samuel iyon. Yumukod siya nang nakaharap sa lupa ang mukha at nagpatirapa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pumapaitaas” o “umaakyat.” Binibigyang-diin ng pandiwaring Hebreo ang patuloy na paggalaw paitaas.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nakasuot ng balabal.” Mas malinaw na ipinahihiwatig ng Hebreo na siya ay nababalot o nababalutan nito.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “yumukod” o, sa ibang konteksto, “sumamba.” Dito, inilalarawan nito ang malalim na pagpapatirapa sa harap ng pigurang kinilala bilang Samuel.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּאֳרוֹ
  choice: anyo niya
  rationale: Ang תֹּאַר ay tumutukoy sa nakikitang anyo o hitsura. Ang “anyo” ay malinaw, marangal, at angkop sa pagtatanong ni Saul para makilala ang inilalarawan.
- source_word: אִישׁ זָקֵן
  choice: isang matandang lalaki
  rationale: Tuwirang ipinapahayag ng parirala na ang nakikitang tao ay isang lalaking matanda na.
- source_word: עֹלֶה
  choice: umaahon
  rationale: Ang pandiwaring Hebreo ay nagpapakita ng patuloy na paggalaw paitaas. Pinananatili ng “umaahon” ang direksiyong ito nang hindi nagpapaliwanag nang higit sa sinasabi ng teksto.
- source_word: עֹטֶה מְעִיל
  choice: nababalutan siya ng balabal
  rationale: Mas matindi ang עֹטֶה kaysa sa simpleng pagsusuot; ipinahihiwatig nito ang pagbabalot o pagkakabalot. Ang מְעִיל ay isang balabal o mahabang panlabas na kasuotan.
- source_word: וַיֵּדַע
  choice: nalaman ni Saul
  rationale: Karaniwang nangangahulugang “malaman” o “makilala” ang ידע. Sa konteksto, nakilala ni Saul ang inilalarawan batay sa sinabi ng babae, ngunit pinananatili ng “nalaman” ang payak na pahayag ng Hebreo.
- source_word: כִּי שְׁמוּאֵל הוּא
  choice: na iyon ay si Samuel
  rationale: Natural sa Filipino ang “iyon ay si Samuel” matapos ilarawan ang isang pigura, habang pinananatili ang pagkakakilanlang tahasang ibinibigay ng salaysay.
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: yumukod siya nang sayad ang mukha sa lupa
  rationale: Malinaw nitong inilalarawan ang pisikal na kilos ng pagyukod na ang mukha ay nakatuon o nakasayad sa lupa.
- source_word: וַיִּשְׁתָּחוּ
  choice: at nagpatirapa
  rationale: Ipinahihiwatig ng pandiwa ang malalim na pagyukod o pagpapatirapa bilang paggalang. Naiiba ito sa naunang “yumukod” at hindi nito awtomatikong ipinapasok ang kahulugang kultikong pagsamba.
theological_decisions:
- issue: Kung dapat bang isalin ang kilos ni Saul bilang tahasang pagsamba kay Samuel
  choice: nagpatirapa
  alternative: sumamba; yumukod bilang paggalang
  rationale: Maaaring tumukoy ang שׁחה sa pagsamba o sa pagpapatirapa bilang matinding paggalang, depende sa konteksto. Inilalarawan dito ang pisikal na pagpapatirapa ni Saul sa harap ng pigurang kinilala bilang Samuel. Ang “nagpatirapa” ay nagpapanatili sa kilos at sa teolohikal na tensiyon nang hindi ipinapasyang ito ay kultikong pagsamba.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “anyo,” “balabal,” at “nagpatirapa” bilang mga salitang madaling maunawaan ngunit sapat ang dignidad para sa salaysay. Iniwasan ang tahasang “sumamba” upang hindi lutasin sa salin ang teolohikal na kalabuan ng kilos ni Saul.
