  to: Sinabi niya sa babae, “Ano ang anyo niya?” Sumagot ang babae, “Isang matandang lalaki ang umaahon[a], at nababalutan siya ng balabal[b].” Kaya nalaman ni Saul na si Samuel iyon. Yumukod siya nang nakaharap sa lupa ang mukha at nagpatirapa[c].
