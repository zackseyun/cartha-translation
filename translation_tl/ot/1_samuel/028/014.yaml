  naturalness: Marangal at madaling maunawaan ang rehistro, ngunit mas natural ang “Sumagot ang babae” kaysa sa “Sumagot ito,” at mas direkta ang pangungusap na “Isang matandang lalaki ang umaahon.” Ang “Dahil dito” ay hindi kailangan at bahagyang nagdaragdag ng paliwanag sa simpleng pagkakasunod-sunod ng salaysay.
  terminology: Ang “anyo,” “balabal,” at “nagpatirapa” ay angkop sa modernong Filipino Tagalog at sa naratibong rehistro. Pinananatili ng “nagpatirapa” ang kilos ng שׁחה nang hindi ipinapasok ang di-tiyak na kahulugang kultikong pagsamba.
