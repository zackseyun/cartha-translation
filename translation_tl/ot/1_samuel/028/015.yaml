  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לָ֥/מָּה הִרְגַּזְתַּ֖/נִי לְ/הַעֲל֣וֹת אֹתִ֑/י וַ/יֹּ֣אמֶר שָׁ֠אוּל צַר לִ֨/י מְאֹ֜ד וּ/פְלִשְׁתִּ֣ים נִלְחָמִ֣ים בִּ֗/י וֵֽ/אלֹהִ֞ים סָ֤ר מֵֽ/עָלַ/י֙ וְ/לֹֽא עָנָ֣/נִי ע֗וֹד גַּ֤ם בְּ/יַֽד הַ/נְּבִיאִם֙ גַּם בַּ֣/חֲלֹמ֔וֹת וָ/אֶקְרָאֶ֣/ה לְ/ךָ֔ לְ/הוֹדִיעֵ֖/נִי מָ֥ה אֶעֱשֶֽׂה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/015.yaml
  text: Then Samuel said to Saul[a], “Why have you disturbed me by bringing me up?” Saul answered, “I am in great distress. The Philistines are fighting against me, and God has turned away from me and no longer answers me, either by prophets or by dreams[b]. So I have called you to tell me what I should do.”
translation:
  language: tl
  text: Sinabi ni Samuel kay Saul, “Bakit mo ako ginambala sa pagpapaaahon mo sa akin?” Sumagot si Saul, “Matindi ang paghihirap ko. Nilalabanan ako ng mga Filisteo, at lumayo na sa akin ang Diyos. Hindi na niya ako sinasagot, sa pamamagitan man ng mga propeta o ng mga panaginip. Kaya tinawag kita upang ipaalam mo sa akin kung ano ang dapat kong gawin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִרְגַּזְתַּנִי
  choice: ginambala
  rationale: Ipinahihiwatig ng pandiwa ang pagdudulot ng pagkabalisa o pagkagambala. Likas sa modernong Tagalog ang “ginambala” at hindi nito dinaragdagan ang teksto ng paliwanag tungkol sa paraan ng pagtawag kay Samuel.
- source_word: לְהַעֲלוֹת אֹתִי
  choice: sa pagpapaaahon sa akin
  rationale: Pinananatili ng “pagpapaaahon” ang literal na larawang pataas ng עלה sa konteksto ng pagtawag kay Samuel mula sa ibaba, nang hindi ito ipinapakahulugang muling pagkabuhay.
- source_word: צַר לִי מְאֹד
  choice: Matindi ang paghihirap ko
  rationale: Malinaw at likas nitong ipinahahayag ang matinding kagipitan at dalamhati ni Saul.
- source_word: נִלְחָמִים בִּי
  choice: Nilalabanan ako
  rationale: Tuwirang inilalarawan nito ang labanang militar na nakatuon laban kay Saul.
- source_word: וֵאלֹהִים סָר מֵעָלַי
  choice: lumayo na sa akin ang Diyos
  rationale: Sinasalamin nito ang paglayo o pagtalikod na ipinahahayag ng סור מעל, nang hindi nagsasaad nang higit sa relasyonal na paglayong nasa teksto.
- source_word: וְלֹא עָנָנִי עוֹד
  choice: Hindi na niya ako sinasagot
  rationale: Likas na ipinahahayag ng “hindi na” ang pagtigil ng dating pagtugon.
- source_word: גַּם בְּיַד הַנְּבִיאִם גַּם בַּחֲלֹמוֹת
  choice: sa pamamagitan man ng mga propeta o ng mga panaginip
  rationale: Ipinapakita ng “sa pamamagitan” ang idyomatikong gamit ng ביד bilang ahensiya, habang ang “man ... o” ay natural na tumutugma sa magkaugnay na גם ... גם.
- source_word: וָאֶקְרָאֶה לְךָ
  choice: Kaya tinawag kita
  rationale: Ang קרא ל ay maaaring mangahulugang tumawag o magpatawag. Ang “tinawag kita” ay payak at hindi nag-aangkat ng teknikal na terminolohiyang okultismo.
- source_word: לְהוֹדִיעֵנִי
  choice: upang ipaalam mo sa akin
  rationale: Tumpak nitong pinananatili ang Hiphil na diwang “ipabatid” o “ipaalam,” kaysa paikliin lamang bilang “sabihin.”
- source_word: מָה אֶעֱשֶׂה
  choice: kung ano ang dapat kong gawin
  rationale: Natural na di-tuwirang pahayag ito sa Tagalog para sa literal na tanong na “Ano ang gagawin ko?”
theological_decisions:
- issue: Pagkakakilanlan o kalagayan ni Samuel sa salaysay tungkol sa pakikipag-ugnayan sa patay
  choice: Isinalin nang tuwiran ang paglalahad ng teksto na si Samuel ang nagsalita kay Saul.
  alternative: Tukuyin ang nagsasalita bilang espiritung nagpapanggap, aparisyon, o persepsiyon lamang ng babaeng tagapamagitan.
  rationale: Tahasan sa Hebreo ang “Sinabi ni Samuel kay Saul.” Dapat panatilihin ng salin ang paglalahad ng salaysay nang hindi nilulutas ang mas malawak na pagtatalong teolohikal sa pamamagitan ng dagdag na panuring.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang larawang pataas sa “pagpapaaahon” at iniwasan ang mga katawagang maaaring magtakda ng isang partikular na paliwanag sa kalikasan ng pangyayari.
