  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וְ/לָ֖/מָּה תִּשְׁאָלֵ֑/נִי וַ/יהוָ֛ה סָ֥ר מֵ/עָלֶ֖י/ךָ וַ/יְהִ֥י עָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/016.yaml
  text: And Samuel said[a], “Why then do you ask me, since Yahweh has turned away from you and has become your adversary?”
translation:
  language: tl
  text: Sinabi ni Samuel, “Kung gayon, bakit mo ako tinatanong, gayong lumayo na sa iyo si Yahweh at naging kalaban[a] mo na siya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaaway.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  choice: Sinabi ni Samuel
  rationale: Likas na salaysay sa makabagong Filipino; ipinahihiwatig ng ayos at konteksto ang pagsulong ng salaysay na dala ng waw-consecutive.
- source_word: וְלָמָּה
  choice: Kung gayon, bakit
  rationale: Pinananatili ang pang-ugnay at ang matalim na puwersang retorikal ng tanong.
- source_word: תִּשְׁאָלֵנִי
  choice: sumasangguni sa akin
  rationale: Sa konteksto ng paghingi ni Saul ng patnubay, mas tiyak ang “sumasangguni” kaysa sa payak na “nagtatanong,” habang nananatili sa saklaw ng שאל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: סָר מֵעָלֶיךָ
  choice: lumayo na sa iyo
  rationale: Natural na Filipino para sa pagtalikod o paglayo mula sa isang tao, at pinananatili ang aspektong natupad na ng pandiwa.
- source_word: וַיְהִי עָרֶךָ
  choice: at naging kalaban mo na siya
  rationale: Malinaw na ipinapahayag ang matinding pagsalungat na tinutukoy ng עָר; ang “siya” ay tumutukoy kay Yahweh at ginagawang natural ang pangungusap sa Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” at hindi pinapalitan ng titulo.
- issue: Ang ugnayan ni Yahweh kay Saul sa pariralang וַיְהִי עָרֶךָ
  choice: naging kalaban mo na siya
  alternative: naging kaaway mo na siya; laban na siya sa iyo
  rationale: Pinananatili ang bigat ng pahayag na si Yahweh ay naging aktibong katunggali ni Saul, nang hindi ito pinahihina bilang simpleng di-pagsang-ayon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sumasangguni” dahil ang tagpo ay tungkol sa paghingi ng patnubay, at ang “kalaban” ay karaniwan ngunit sapat ang tindi para sa עָרֶךָ.
