base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/020.yaml
  text: Saul immediately fell full length to the ground[a], and he was very afraid because of Samuel’s words. There was no strength in him either, because he had eaten no bread all that day and all that night.
translation:
  language: tl
  text: Agad na bumagsak si Saul nang buong haba sa lupa, at labis siyang natakot dahil sa mga sinabi ni Samuel. Wala rin siyang lakas sapagkat hindi siya kumain ng tinapay[a] sa buong araw na iyon at buong gabing iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “tinapay” ay maaari ring tumukoy sa pagkain sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: Agad
  rationale: Bagaman literal na may diwang “nagmamadali,” gumaganap itong pananda ng bigla at mabilis na kasunod na pagbagsak ni Saul; natural itong naipahahayag sa Tagalog bilang “Agad.”
- source_word: וַיִּפֹּל
  choice: bumagsak
  rationale: Pinananatili ang payak na diwa ng pandiwang “mahulog/bumagsak” nang hindi dinaragdagan ng interpretatibong “nawalan ng malay” o “napalugmok.”
- source_word: מְלֹא קוֹמָתוֹ
  choice: nang buong haba
  rationale: Ipinahihiwatig ng parirala na ang buong katawan ni Saul ay nakahandusay sa lupa; ang “nang buong haba” ay malinaw at natural sa modernong Tagalog.
- source_word: אַרְצָה
  choice: sa lupa
  rationale: Ang directional na anyo ay nagsasaad ng paggalaw patungo sa lupa; sapat at natural ang “sa lupa” kasunod ng “bumagsak.”
- source_word: וַיִּרָא מְאֹד
  choice: labis siyang natakot
  rationale: Tuwirang ipinapahayag ang matinding takot sa dignified at karaniwang modernong Tagalog.
- source_word: מִדִּבְרֵי שְׁמוּאֵל
  choice: dahil sa mga sinabi ni Samuel
  rationale: Causal ang gamit ng pang-ukol sa konteksto. Mas natural sa Tagalog ang “mga sinabi” kaysa literal na “mga salita” habang pinananatili ang kahulugan.
- source_word: גַּם כֹּחַ לֹא הָיָה בוֹ
  choice: Wala rin siyang lakas
  rationale: Ang “rin” ang natural na katumbas ng additive na גַּם. Hindi idinagdag ang “natitira” dahil payak na sinasabi ng Hebreo na walang lakas sa kaniya.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinapakilala nito ang dahilan ng kawalan niya ng lakas; ang “sapagkat” ay natural at angkop sa marangal na salaysay.
- source_word: לֹא אָכַל לֶחֶם
  choice: hindi siya kumain ng tinapay
  rationale: Pinananatili ang literal na “tinapay,” bagaman maaari itong tumukoy nang mas malawak sa pagkain; inilalahad ang alternatibong diwa sa talababa.
- source_word: כָּל הַיּוֹם וְכָל הַלָּיְלָה
  choice: sa buong araw at buong gabing iyon
  rationale: Pinananatili ang kabuuang haba ng araw at gabi, at nililinaw ng “iyon” na ang tinutukoy ay ang partikular na panahong nasa salaysay.
