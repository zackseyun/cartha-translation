base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/013.yaml
  text: The king said to her[a], “Do not be afraid. What do you see?” And the woman said to Saul[b], “I see a divine being coming up from the earth.”
translation:
  language: tl
  text: Sinabi sa kanya ng hari, “Huwag kang matakot. Ano ang nakita mo?[a]” Sumagot ang babae kay Saul, “Nakikita ko ang isang sobrenatural na nilalang[b] na umaahon mula sa lupa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang pandiwang Hebreo ay pormal na nasa anyong perfect: “Ano ang nakita mo?” Sa agarang konteksto ng pangitain, maaari rin itong isalin na “Ano ang nakikita mo?”'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na אֱלֹהִים at ang kasunod na pandiwari ay nasa anyong maramihan. Maaari rin itong isalin na “mga diyos” o “mga sobrenatural na nilalang.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Karaniwang pangngalang may pantukoy ang ginamit sa Hebreo, hindi ang pangalang Saul; pinananatili nito ang paraan ng pagsasalaysay.
- source_word: אַל תִּירְאִי
  choice: Huwag kang matakot
  rationale: Likas at kasalukuyang Tagalog para sa negatibong pautos na may ירא.
- source_word: כִּי מָה רָאִית
  choice: Ano ang nakita mo?
  rationale: Ang רָאִית ay nasa anyong perfect at tuwirang maisasalin bilang “nakita mo.” Dahil nagaganap pa ang pangitain, posible rin ang “Ano ang nakikita mo?” at itinala iyon sa talababa.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: “Ang babae” lamang ang sinasabi ng talata; iniiwasang ipasok dito ang katawagang “manggagaway” o “medium,” bagaman malinaw iyon sa mas malawak na konteksto.
- source_word: אֱלֹהִים
  choice: isang sobrenatural na nilalang
  rationale: Ipinahihiwatig nito ang isang nilalang na hindi pangkaraniwan o makatao nang hindi ito tuwirang tinatawag na Diyos o isang diyos. Pinananatili sa talababa ang kapansin-pansing anyong maramihan ng Hebreo.
- source_word: עֹלִים
  choice: umaahon
  rationale: Ipinapahayag ng pandiwaring mula sa עלה ang paggalaw paitaas; natural sa Tagalog ang “umaahon” sa tagpong ito.
- source_word: מִן הָאָרֶץ
  choice: mula sa lupa
  rationale: Malapit ito sa Hebreo at pinananatili ang larawan ng paglitaw mula sa ibaba.
theological_decisions:
- issue: Kung paano isasalin ang אֱלֹהִים sa ulat ng babae
  choice: isang sobrenatural na nilalang
  alternative: mga diyos; isang diyos; Diyos
  rationale: Iniuulat ng talata ang nakita ng babae at hindi tuwirang nagbibigay ng doktrinal na pagkakakilanlan sa anyo. Ang napiling salin ay hindi nagpapahiwatig ng politeismo at hindi rin kinikilalang Diyos mismo ang lumilitaw, samantalang inilalahad sa talababa ang tunay na gramatikal na tensiyon ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “sobrenatural” bilang pangkaraniwang makabagong salita upang maiwasan ang “banal,” na maaaring magpahiwatig ng kabanalan, at “makalangit,” na magmumungkahing mula sa langit kahit umaahon ang anyo mula sa lupa.
