  source_fidelity: 'Ang pangunahing salin ay tapat sa daloy ng Hebreo: ang hari ay nagsasalita sa babae, at ang babae ay nag-uulat ng isang supernatural na paglitaw na umaahon mula sa lupa. Ang singular na “isang sobrenatural na nilalang” ay isang maingat na interpretatibong pag-render ng אֱלֹהִים sa konteksto, ngunit dapat malinaw na itala na kapwa ang אֱלֹהִים at עֹלִים ay maramihan ang anyo. Ang talababa a ay kailangang itama: hindi ganap na literal ang “Ano ang nakita mo?” sapagkat hindi nito isinasalin ang כִּי, at ang mahalagang usapin ay ang pormal na perfect na anyo ng pandiwa.'
  naturalness: Likas at angkop sa modernong Filipino Tagalog ang “Huwag kang matakot,” “Sumagot ang babae kay Saul,” at “umaahon mula sa lupa.” Mas tuwiran at natural sa isang agarang pangitain ang “Nakikita ko ang …” kaysa “May nakikita akong …,” bagaman kapwa katanggap-tanggap.
