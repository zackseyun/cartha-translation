translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “ni Saul” ngunit “nito” pagkatapos ng pangngalan upang maiwasan ang malabong “niya,” at “mga tauhan” upang katawanin ang mga kasamang naglilingkod kay Saul nang hindi ipinapalagay na sila ay mga alipin.
