  text: Then she brought it before Saul and before his servants[a], and they ate. Then they rose and went away that night.
translation:
  language: tl
  text: Pagkatapos, inihain niya iyon sa harap ni Saul at ng mga tauhan ni Saul[a], at kumain sila. Pagkatapos, tumindig sila at umalis nang gabing iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “iniharap niya [iyon] sa harap ni Saul at sa harap ng mga tauhan niya.” Ipinahihiwatig ng naunang konteksto na ang tinutukoy ay ang inihandang pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: inihain niya iyon sa harap
  rationale: Ang Hiphil ng נגשׁ ay nangangahulugang ilapit o iharap. Sa konteksto ng pagkaing inihanda, natural sa Tagalog ang “inihain”; idinagdag ang “iyon” bilang bagay na malinaw na ipinahihiwatig ng naunang talata.
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Tuwirang ipinapahayag nito ang ideya ng paglalagay ng pagkain sa harap ng mga kakain, habang nananatiling natural sa Filipino.
- source_word: עֲבָדָיו
  choice: mga tauhan nito
  rationale: Sa konteksto, tumutukoy ito sa mga lalaking kasama ni Saul sa paglilingkod sa hari. Ang “mga tauhan” ay natural at hindi nagpapahiwatig nang higit sa teksto na sila ay mga alipin.
- source_word: וַיֹּאכֵלוּ
  choice: at kumain sila
  rationale: Walang tahasang layon ang pandiwa sa Hebreo; malinaw na mula sa konteksto kung ano ang kinain nila.
- source_word: וַיָּקֻמוּ
  choice: Pagkatapos, tumindig sila
  rationale: Pinananatili ng “tumindig” ang sunod-sunod na kilos at ang marangal na himig, nang hindi nagiging lipas ang pananalita.
- source_word: וַיֵּלְכוּ
  choice: at umalis
  rationale: Bagaman pangunahing nangangahulugang “pumunta/lumakad,” ipinahihiwatig ng konteksto ang pag-alis nila sa bahay ng babae.
- source_word: בַּלַּיְלָה הַהוּא
  choice: nang gabing iyon
  rationale: Ito ang natural na modernong Tagalog para sa Hebreong temporal na pariralang “sa gabing iyon.”
