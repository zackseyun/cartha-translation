base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/009.yaml
  text: But the woman said to him[a], “Look, you yourself know what Saul has done, that he has cut off the mediums and the spiritists from the land. So why are you laying a snare for my life, to put me to death?”
translation:
  language: tl
  text: 'Ngunit sinabi ng babae sa kanya, “Alam na alam mo ang ginawa ni Saul: inalis niya mula sa lupain ang mga medium at mga espiritista. Kaya bakit mo ako binibitag upang ako’y patayin?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ngunit sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit pasalungat ang tugon ng babae sa naunang kahilingan; natural na ipinahahayag ito ng “Ngunit.”
- source_word: הִנֵּה אַתָּה יָדַעְתָּ
  choice: Alam na alam mo
  rationale: Ang הִנֵּה at tahasang panghalip na אַתָּה ay kapwa nagbibigay-diin. Ang “Alam na alam mo” ay natural na modernong Tagalog na nagpapanatili sa mariing tono.
- source_word: אֵת אֲשֶׁר עָשָׂה שָׁאוּל
  choice: ang ginawa ni Saul
  rationale: Direkta at likas na katumbas ng sugnay na layon sa Hebreo.
- source_word: הִכְרִית
  choice: inalis
  rationale: Sa kontekstong ito, tumutukoy sa pagpuksa o pagpapaalis sa mga practitioner mula sa lupain. Malinaw ang “inalis” nang hindi ipinapalagay na pinatay silang lahat.
- source_word: הָאֹבוֹת
  choice: mga sumasangguni sa mga espiritu
  rationale: Ipinahahayag ang mga practitioner na kumokonsulta sa mga espiritu o patay, sa paraang malinaw sa karaniwang mambabasang Filipino at hindi nagpapasok ng tiyak na paliwanag kung paano gumagana ang gawain.
- source_word: הַיִּדְּעֹנִי
  choice: mga manghuhula
  rationale: Natural na terminong Filipino para sa mga taong nag-aangking may lihim o okultong kaalaman; pinananatili sa talababa ang mas espesipikong alternatibo.
- source_word: מִן הָאָרֶץ
  choice: sa lupain
  rationale: Ang tinutukoy ay ang lupain ng Israel, hindi ang buong daigdig.
- source_word: וְלָמָה אַתָּה מִתְנַקֵּשׁ בְּנַפְשִׁי
  choice: Kaya bakit mo ako binibitag
  rationale: Pinananatili ng “binibitag” ang talinghaga ng paglalagay ng silo habang natural na ipinahahayag na buhay ng babae ang pinupuntirya.
- source_word: לַהֲמִיתֵנִי
  choice: upang ipapatay
  rationale: Ipinakikita ng causative form na ang layunin ng bitag ay maipapatay ang babae, hindi kinakailangang ang kausap mismo ang papatay sa kanya.
theological_decisions:
- issue: Paglalarawan sa mga ipinagbabawal na gawaing okulto nang hindi nagpapasya kung tunay o huwad ang pakikipag-ugnayan sa espiritu
  choice: mga sumasangguni sa mga espiritu at mga manghuhula
  alternative: mga may espiritung pinagsasanggunian at mga espiritista
  rationale: Tinutukoy ng talata ang mga practitioner at ang ginawa ni Saul sa kanila. Hindi hinahatulan ng salin kung ano ang ontolohikal na paliwanag sa kanilang gawain; inilalarawan lamang nito ang inaangkin o isinasagawa nilang pagkonsulta.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Alam na alam mo” upang likas na maipahayag ang diin ng הִנֵּה at אַתָּה. Ang mga terminong okulto ay inilalarawan nang maingat, at ang mas literal na alternatibo ay inilagay sa talababa.
