base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/003.yaml
  text: Samuel had died[a], and all Israel had mourned for him and buried him in Ramah, in his own city. And Saul had removed the mediums and the spiritists from the land.
translation:
  language: tl
  text: Namatay na si Samuel. Nagluksa para sa kanya ang buong Israel at inilibing siya sa Rama, sa sarili niyang lungsod. Inalis na ni Saul mula sa lupain ang mga medium at mga espiritista.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang dalawang katawagang Hebreo ay tumutukoy sa mga taong sumasangguni sa mga espiritu o sa mga patay; hindi tiyak ang eksaktong pagkakaiba ng dalawang uri.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת
  choice: Namatay na
  rationale: Ipinahihiwatig ng “na” na ang pagkamatay ni Samuel ay naunang pangyayaring nagsisilbing kaligiran ng kasunod na salaysay.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: Nagluksa para sa kanya
  rationale: Likas sa modernong Filipino at malinaw na naghahayag ng pampublikong pagluluksa kaugnay ng kamatayan.
- source_word: כָּל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Pinananatili ang kolektibong pambansang pahayag ng Hebreo nang hindi ito pinalalawak sa “lahat ng Israelita.”
- source_word: וַיִּקְבְּרֻהוּ
  choice: inilibing siya
  rationale: Tuwiran at natural na katumbas ng pandiwang tumutukoy sa paglilibing.
- source_word: בָרָמָה
  choice: sa Rama
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang-pook.
- source_word: וּבְעִירוֹ
  choice: sa sarili niyang lungsod
  rationale: Ipinakikita ang pag-aari sa hulaping Hebreo at itinuturing na paglilinaw sa Rama, nang hindi inuulit nang pilit ang pang-ugnay.
- source_word: הֵסִיר
  choice: Pinaalis na rin
  rationale: Ipinahihiwatig ang naunang opisyal na pagpapaalis o pagsugpo, habang hindi tinutukoy ang eksaktong paraan ng pagkilos ni Saul.
- source_word: הָאֹבוֹת
  choice: mga espiritista
  rationale: Nauunawaan sa modernong Filipino bilang mga taong nakikipag-ugnayan o sumasangguni sa mga espiritu; iniiwasan ang katawagang maaaring magpasok ng huling-panahong alamat.
- source_word: הַיִּדְּעֹנִים
  choice: mga manghuhula
  rationale: Likas na katawagang Filipino para sa mga okultong tagapagsangguni, bagaman hindi ganap na tiyak ang pagkakaiba nito sa naunang terminong Hebreo.
- source_word: מֵהָאָרֶץ
  choice: sa lupain
  rationale: Tuwirang katumbas na angkop sa pambansang heograpikong konteksto.
theological_decisions:
- issue: Paglalarawan sa dalawang uri ng okultong tagapagsangguni nang hindi nag-aangkat ng mas huling alamat o tiyak na sistemang okulto
  choice: mga espiritista at mga manghuhula
  alternative: mga sumasangguni sa espiritu ng mga patay at mga tagapamagitan sa espiritu
  rationale: Malinaw at natural ang piniling mga katawagan sa Filipino, ngunit inilalahad sa talababa na hindi tiyak ang eksaktong hangganan sa pagitan ng dalawang terminong Hebreo.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “na” at “rin” upang natural na ihayag na kapuwa naunang pangyayari ang pagkamatay ni Samuel at ang pagpapaalis ni Saul sa mga okultong tagapagsangguni. Inilagay ang talababa sa mismong mga katawagang tinatalakay nito.
