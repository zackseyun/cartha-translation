  source_fidelity: Tumpak ang salin sa pagkamatay ni Samuel, pambansang pagluluksa, paglilibing sa Rama, at naunang pagkilos ni Saul. Gayunman, ang “mga manghuhula” ay masyadong malawak at sa karaniwang gamit ay maaaring tumukoy sa mga propeta o manghuhula ng kapalaran, kaya hindi nito sapat na naihihiwatig ang יִדְּעֹנִים bilang kauring okultong practitioner na ipinares sa אֹבוֹת.
  naturalness: Natural at malinaw ang pangkalahatang daloy. Mas natural at mas tiyak sa kontemporaryong Filipino ang magkatambal na “mga medium at mga espiritista.” Ang pag-alis ng “rin” ay umiiwas sa di-kailangang dagdag na pahiwatig na “also,” na hindi kinakailangan ng Hebreo.
  terminology: Ang “Rama,” “buong Israel,” at “lupain” ay angkop. Ang “mga medium at mga espiritista” ay mas malapit sa saklaw ng magkapares na Hebreong termino kaysa “mga espiritista at mga manghuhula,” habang pinananatili ang kawalang-katiyakan sa eksaktong pagkakaiba ng dalawang termino sa talababa.
