base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/022.yaml
  text: Now then[a], please listen, you also, to the voice of your female servant, and let me set a piece of bread before you. Eat, so that there may be strength in you[c][b], because you must go on your way.
translation:
  language: tl
  text: Kaya ngayon, pakinggan din po ninyo ang sinasabi ng inyong lingkod na babae[a][b]. Hayaan ninyong maglagay ako ng isang pirasong tinapay sa harap ninyo[c]. Kumain po kayo upang magkaroon kayo ng lakas, sapagkat maglalakbay pa kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aliping babae.” Tahasang pambabae ang salitang Hebreo para sa lingkod.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “makinig sa tinig ng inyong lingkod na babae,” isang idyomang Hebreo na nangangahulugang dinggin o sundin ang sinasabi niya.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “isang subo ng tinapay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Nagsisilbi itong panandang pandiskurso na nag-uugnay sa naunang pangyayari at nagpapakilala ng agarang pakiusap; ipinahihiwatig ng “kaya” ang ugnayang iyon nang hindi ginagawang labis na tiyak.
- source_word: שְׁמַע נָא גַם אַתָּה
  choice: pakinggan din po ninyo
  rationale: Pinananatili ng “din” ang diin sa pagtugon ni Saul bilang kapalit, habang ipinahahayag ng “po” at magalang na anyong “ninyo” ang pakiusap na taglay ng נָא.
- source_word: בְּקוֹל שִׁפְחָתֶךָ
  choice: ang sinasabi ng inyong lingkod na babae
  rationale: Natural na ipinahahayag sa Filipino ang Hebreong idyomang “makinig sa tinig” bilang pakikinig o pagsunod sa sinasabi. Pinananatili ng “lingkod na babae” ang tahasang pambabaeng anyo ng שִׁפְחָה.
- source_word: וְאָשִׂימָה לְפָנֶיךָ
  choice: Hayaan ninyong maghain ako sa inyong harapan
  rationale: Ang cohortative ay isang magalang na alok o kahilingan; natural itong naihahatid ng “hayaan ninyong … ako.” Ang “sa inyong harapan” ay pinananatili ang larawan ng paglalagay ng pagkain sa harap ni Saul.
- source_word: פַּת לֶחֶם
  choice: kapirasong tinapay
  rationale: Ang פַּת ay isang piraso o subo; malinaw at natural sa kasalukuyang Filipino ang “kapirasong tinapay.”
- source_word: וֶאֱכֹל
  choice: Kumain po kayo
  rationale: Tuwirang pautos ito, ngunit ang “po” ay angkop sa magalang at mapakiusap na pananalita ng babae kay Saul.
- source_word: וִיהִי בְךָ כֹּחַ
  choice: upang magkaroon kayo ng lakas
  rationale: Ipinahahayag nito ang layon o inaasahang bunga ng pagkain sa natural na Filipino, nang hindi nilalagyan ng ibang uri ng lakas bukod sa ipinahihiwatig ng konteksto.
- source_word: כִּי תֵלֵךְ בַּדָּרֶךְ
  choice: sapagkat maglalakbay pa kayo
  rationale: Pinananatili ng “sapagkat” ang pagbibigay-katwiran at ng “maglalakbay pa” ang nalalapit na pag-alis at pagtahak sa daan, nang hindi sapilitang nagdaragdag ng modal na “kailangan.”
theological_decisions: []
translation_notes:
  register: Makabago, magalang, at marangal na Filipino. Ginamit ang “po” at “ninyo” upang ihatid ang mapakiusap na tono sa hari, ngunit iniwasan ang lipas o labis na pormal na pananalita. Pinanatili ang pambabaeng pagtukoy sa lingkod at ang kaunting kaluwagan ng panghuling sugnay tungkol sa nalalapit na paglalakbay.
