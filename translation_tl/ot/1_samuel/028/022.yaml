  naturalness: Makabago at magalang ang kabuuang Tagalog. Mas malinaw at mas likas ang ayos na “maglagay ako ng isang pirasong tinapay sa harap ninyo” kaysa “maghain ako sa inyong harapan ng kapirasong tinapay.”
