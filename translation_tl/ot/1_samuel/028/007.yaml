  to: Sinabi ni Saul sa kanyang mga lingkod, “Humanap kayo para sa akin ng isang babaeng medium[a], upang puntahan ko siya at makapagtanong sa pamamagitan niya.” Sinabi sa kanya ng kanyang mga lingkod, “May isang babaeng medium sa En-dor.”
  rationale: Pinalitan ang masyadong tiyak na “babaeng may espiritu ng patay” ng natural na “babaeng medium,” alinsunod sa gamit ng parirala sa talata at sa English POB audit trail. Inilipat sa talababa ang sinaunang leksikal na kalabuan ng ob. Inayos din ang “mapuntahan” bilang “puntahan” para sa mas likas na modernong Tagalog.
