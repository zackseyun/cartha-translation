base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/007.yaml
  text: Then Saul said to his servants, “Find for me a woman who is a medium, so that I may go to her and inquire through her.” And his servants said to him, “Look, there is a woman who is a medium at En-dor.”
translation:
  language: tl
  text: Sinabi ni Saul sa kanyang mga lingkod, “Humanap kayo para sa akin ng isang babaeng medium[a], upang puntahan ko siya at makapagtanong sa pamamagitan niya.” Sinabi sa kanya ng kanyang mga lingkod, “May isang babaeng medium sa En-dor.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang babaeng may ob.” Ang ob ay isang terminong Hebreo na kaugnay ng pagsangguni sa mga patay; maaaring tumukoy ito sa espiritung sinasangguni o sa paraan ng pagsangguni.
    reason: Pinananatili nito ang leksikal na kalabuan ng ob nang hindi ipinapalagay na ang babae ay literal na may taglay o sinasapian ng espiritu ng patay.
lexical_decisions:
- source_word: אֵשֶׁת בַּעֲלַת אוֹב
  choice: isang babaeng may espiritu ng patay
  rationale: Ang בַּעֲלַת ay ‘may taglay/may-ari,’ at ang אוֹב ay tumutukoy sa espiritung sinasangguni o sa taong nagsasagawa ng pakikipag-ugnayan sa mga patay. Pinananatili ng salin ang sinaunang konsepto nang hindi ipinapalagay na isang modernong ‘medium’ lamang ang kahulugan.
- source_word: בַּקְּשׁוּ לִי
  choice: Humanap kayo para sa akin
  rationale: Tuwirang ipinapahayag ang maramihang pautos na ‘hanapin ninyo para sa akin.’
- source_word: וְאֶדְרְשָׁה בָּהּ
  choice: at makapagtanong sa pamamagitan niya
  rationale: Ang בָּהּ ay maaaring maunawaang ‘sa/pamamagitan niya’; ang ‘sa pamamagitan niya’ ay natural sa Tagalog at nagpapakita na ginagamit siya ni Saul bilang tagapamagitan sa pagsangguni.
- source_word: הִנֵּה
  choice: May
  rationale: Sa tugon ng mga lingkod, likas na naihahatid ng eksistensiyal na ‘May’ ang pansin-pantawag na diwa ng הִנֵּה nang hindi gumagamit ng artipisyal na ‘Narito.’
- source_word: עֵין דּוֹר
  choice: En-dor
  rationale: Karaniwang transliterasyon ng pangalan ng lugar.
theological_decisions:
- issue: Pagkakakilanlan at kalikasan ng אוֹב
  choice: espiritu ng patay
  alternative: espiritung manghuhula; medium
  rationale: Hindi tinutukoy ng talata kung ano ang ontolohikal na kalikasan ng espiritu o kung tunay ang inaangking kakayahan ng babae. Ang parirala ay nagpapanatili sa terminolohiya ng sinaunang teksto at hindi nagpapatibay o nagpapabulaan sa gawaing okulto.
- issue: Paraan ng pagsangguni ni Saul
  choice: sa pamamagitan niya
  alternative: sa kanya
  rationale: Pinananatili ang instrumental na posibilidad ng בָּהּ at ang babaeng nagsisilbing tagapamagitan, nang hindi pa tinutukoy ang magiging pinagmulan ng sagot.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘mga lingkod’ para sa עֲבָדִים at iniwasan ang mas kolokyal na ‘tauhan.’ Ang dayalogo ay natural ngunit hindi impormal.
