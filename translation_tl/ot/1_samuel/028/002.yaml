base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/002.yaml
  text: David said to Achish[a], “Then you yourself will know what your servant can do.” And Achish said to David, “Very well[b], I will make you my bodyguard for all your days.”
translation:
  language: tl
  text: Sinabi ni David kay Akis, “Kung gayon, malalaman mo mismo kung ano ang magagawa ng iyong lingkod.[a]” Sumagot si Akis kay David, “Kung gayon, gagawin kitang personal kong bantay[b] habambuhay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “kung ano ang gagawin ng iyong lingkod.” Sadyang hindi tiyak ang pananalita ni David.
    reason: lexical_alternative
  - marker: b
    text: Literal na “bantay para sa aking ulo,” ibig sabihin, bantay sa kaniyang katauhan o buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kung gayon
  rationale: Sa unang pahayag, ipinakikita nito ang tugon o kongklusyon ni David mula sa sinabi ni Akis sa naunang talata; natural sa Tagalog ang “Kung gayon.”
- source_word: אַתָּה תֵדַע
  choice: malalaman mo mismo
  rationale: Ang hiwalay na panghalip na אַתָּה ay nagbibigay-diin sa kausap; pinananatili ito ng “mo mismo” nang natural sa Tagalog.
- source_word: אֵת אֲשֶׁר יַעֲשֶׂה
  choice: kung ano ang magagawa
  rationale: Ang anyong Hebreo ay maaaring tumukoy sa gagawin ni David, ngunit sa konteksto ay maaari ring marinig bilang pahiwatig ng kaniyang kakayahan. Pinananatili ng “magagawa” ang sadyang hindi tiyak na sagot, habang inilalagay sa talababa ang mas tuwirang alternatibo.
- source_word: עַבְדֶּךָ
  choice: iyong lingkod
  rationale: Magalang na pagtukoy ito ni David sa sarili sa harap ng isang hari, hindi tahasang pahayag tungkol sa pagkaalipin.
- source_word: לָכֵן
  choice: Kung gayon
  rationale: Sa tugon ni Akis, ipinakikita ng salita ang kongklusyon o pasiya niya batay sa sinabi ni David. Ang pag-uulit ng “Kung gayon” ay sumasalamin din sa pag-uulit ng Hebreo.
- source_word: שֹׁמֵר לְרֹאשִׁי
  choice: personal kong bantay
  rationale: Literal itong “bantay para sa aking ulo,” isang pariralang tumutukoy sa pag-iingat sa mismong katauhan o buhay ni Akis. Malinaw at likas sa modernong Tagalog ang “personal kong bantay.”
- source_word: אֲשִׂימְךָ
  choice: gagawin kita
  rationale: Ang שׂים ay maaaring mangahulugang maglagay o magtalaga; sa pagbibigay ng tungkulin, natural ang “gagawin kita.”
- source_word: כָּל הַיָּמִים
  choice: habambuhay
  rationale: Ang literal na “lahat ng mga araw” ay nagpapahiwatig ng panghabambuhay o permanenteng tungkulin sa kontekstong ito.
theological_decisions:
- issue: Sadyang kalabuan ng tugon ni David
  choice: Pinanatili ang pahiwatig ng kakayahan sa “kung ano ang magagawa,” na hindi tahasang nagsasaad kung ano ang aktuwal niyang gagawin.
  alternative: “kung ano ang gagawin ng iyong lingkod”
  rationale: Hindi nililinaw ng Hebreo kung nangangako si David na lalaban para kay Akis o nagsasalita nang may nakatagong ibang layunin. Mahalaga sa salaysay na huwag lutasin ang tensiyong ito sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Akis” ayon sa karaniwang pagbabaybay sa Tagalog, “lingkod” para sa magalang na pananalita sa korte, at “personal kong bantay” upang ipahayag nang natural ang idyomang Hebreo. Inilagay ang mga panandang talababa sa mismong pariralang nililinaw ng bawat tala.
