base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/058.yaml
  text: Saul said to him[a], “Whose son are you, young man?” And David said, “I am the son of your servant Jesse the Bethlehemite.”
translation:
  language: tl
  text: Sinabi ni Saul sa kanya, “Kanino kang anak, binata?” Sinabi ni David, “Anak ako ng inyong lingkod na si Jesse, na taga-Betlehem.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן מִי
  choice: Kanino kang anak
  rationale: Pinananatili nito ang Hebreong tanong tungkol sa angkan sa ama, at likas itong pakinggan sa makabagong Tagalog nang hindi ito binabago tungo sa mas interpretatibong “Sino ang iyong ama?”
- source_word: הַנָּעַר
  choice: binata
  rationale: Maaaring tumukoy ang נַעַר sa batang lalaki, kabataan, o binata. Sa tuwirang pagtawag kay David sa kontekstong ito, maikli, natural, at marangal ang “binata.”
- source_word: עַבְדְּךָ
  choice: inyong lingkod
  rationale: Dito, ang עֶבֶד ay magalang na pananalita sa hari, hindi tahasang pahayag tungkol sa kalagayang alipin. Ang “inyong lingkod” ay nagpapanatili sa mapagpakumbabang tono.
- source_word: בֵּית הַלַּחְמִי
  choice: na taga-Betlehem
  rationale: Ang anyong gentiliko ay nagpapakilala kay Jesse ayon sa kaniyang pinagmulan. Mas natural sa kasalukuyang Tagalog ang “taga-Betlehem” kaysa sa isang hiniram na katawagang tulad ng “Betlehemita.”
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Sinabi ... Sinabi
  rationale: Parehong gumagamit ang Hebreo ng karaniwang pandiwang “magsabi.” Pinananatili ng salin ang pag-uulit sa halip na ipalit ang mas interpretatibong “tinanong ... sumagot.”
- source_word: בֶּן עַבְדְּךָ יִשַׁי
  choice: Anak ako ng inyong lingkod na si Jesse
  rationale: Walang tahasang pandiwang panaguri sa sagot na Hebreo. Natural sa Tagalog ang nominal na pangungusap na “Anak ako,” kaya hindi kailangang magdagdag ng katumbas ng “I am” bilang hiwalay na pandiwa.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Tagalog ang ginamit. Ang “inyong” ay angkop na magalang na panghalip sa pakikipag-usap sa hari, samantalang ang “binata” ay natural na pantawag nang hindi labis na tinutukoy ang eksaktong edad ni David.
