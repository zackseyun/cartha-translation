translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Iniwasan ang arkaikong “pinuksa” o “pinaslang,” at pinanatili ang mabilis na sunod-sunod na kilos ng salaysay.
