base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/035.yaml
  text: I went out after it and struck it and rescued it from its mouth[a]; and when it rose up against me[b], I seized it by its beard and struck it and killed it.
translation:
  language: tl
  text: Lumabas ako at sinundan ko ito, hinampas ko ito, at iniligtas ko ang tupa mula sa bibig nito. Nang salakayin ako nito, sinunggaban ko ito sa balbas nito[a], hinampas ko ito, at pinatay ko ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa balbas nito.” Isinasalin ito ng ilan nang mas maluwag bilang “kiling” o “panga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָאתִי אַחֲרָיו
  choice: Sinundan ko iyon
  rationale: Ang literal na diwang “lumabas ako kasunod nito” ay likas na naipahahayag sa modernong Tagalog bilang “sinundan ko iyon.” Ang “iyon” ay tumutukoy sa mabangis na hayop na binanggit sa naunang talata, nang hindi nagdaragdag ng kasarian.
- source_word: וְהִכִּתִיו
  choice: hinampas
  rationale: Malawak ang saklaw ng נכה, ngunit dito ay angkop ang “hinampas.” Hindi ito isinaling “pinatay” dahil hiwalay at tahasang sinasabi ng huling pandiwa ang pagpatay.
- source_word: וְהִצַּלְתִּי מִפִּיו
  choice: iniligtas ang tupa mula sa bibig nito
  rationale: Ang Hiphil ng נצל ay nangangahulugang magligtas o magligtas mula sa panganib. Nilinaw ang ipinahiwatig na layon bilang “ang tupa,” ayon sa tuwirang konteksto ng naunang talata, at pinanatili ang konkretong larawan ng “bibig” sa halip na gawing “panga.”
- source_word: וַיָּקָם עָלַי
  choice: Nang salakayin ako nito
  rationale: Ang idyomang קום על ay nagsasaad ng pagbangon o pagkilos laban sa isang tao. Ang “salakayin” ay natural sa Tagalog at malinaw na naghahatid ng mapanlabang kilos, samantalang ang literal na “bumangon laban sa akin” ay maaaring maging malabo o di-likas.
- source_word: וְהֶחֱזַקְתִּי
  choice: sinunggaban ko iyon
  rationale: Ipinahihiwatig ng Hiphil ng חזק ang paghawak nang mahigpit o sapilitan. Ang “sinunggaban” ay malinaw, masigla, at angkop sa marahas na tagpo.
- source_word: בִּזְקָנוֹ
  choice: sa balbas
  rationale: Ang karaniwang kahulugan ng זָקָן ay “balbas.” Pinanatili ito upang hindi palitan ng mas mapagpaliwanag ngunit di-tiyak na “mane” o “panga” ang matingkad na larawan ng Hebreo.
- source_word: וַהֲמִיתִּיו
  choice: pinatay
  rationale: Ang Hiphil ng מות ay tahasang nangangahulugang maging sanhi ng kamatayan. Kaya ang “pinatay” ang malinaw na kasukdulan, na naiiba sa naunang “hinampas.”
