  to: Maagang bumangon si David nang umagang iyon. Iniwan niya ang mga tupa sa pangangalaga ng isang tagapag-alaga, kinuha ang mga panustos, at umalis, gaya ng iniutos sa kanya ni Jesse. Dumating siya sa kampo[a] habang lumalabas ang hukbo patungo sa hanay ng labanan at nagpapakawala ng sigaw-pandigma.[b]
