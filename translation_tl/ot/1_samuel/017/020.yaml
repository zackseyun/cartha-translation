translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “hukbo,” “hanay ng labanan,” at “sigaw-pandigma” upang mapanatili ang kontekstong militar nang hindi maging labis na teknikal. Inilipat ang mga pananda ng talababa sa mismong mga salitang tinatalakay ng bawat tala.
