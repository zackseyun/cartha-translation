base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/020.yaml
  text: So David rose early in the morning[a], left the sheep with a keeper, took the supplies, and went, just as Jesse had commanded him[b]. He came to the encampment as the army was going out to the battle line and shouting the war cry.
translation:
  language: tl
  text: Maagang bumangon si David nang umagang iyon. Iniwan niya ang mga tupa sa pangangalaga ng isang tagapag-alaga, kinuha ang mga panustos, at umalis, gaya ng iniutos sa kanya ni Jesse. Dumating siya sa kampo[a] habang lumalabas ang hukbo patungo sa hanay ng labanan at nagpapakawala ng sigaw-pandigma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pabilog na kampo” o “muog na binuo ng mga kariton”; maaaring mas tiyak na tumukoy ang salitang Hebreo sa pabilog na ayos ng kampo o sa depensibong hangganan nito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at sumigaw sila sa/para sa labanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם דָּוִד בַּבֹּקֶר
  choice: Maagang bumangon si David nang umagang iyon
  rationale: Pinananatili nito ang diin sa maagang pagkilos ni David at natural ang temporal na parirala sa makabagong Tagalog.
- source_word: וַיִּטֹּשׁ אֶת־הַצֹּאן עַל־שֹׁמֵר
  choice: Iniwan niya ang mga tupa sa pangangalaga ng isang tagapagbantay
  rationale: Ipinahahayag ng parirala na iniwan ni David ang kawan sa pananagutan at pag-iingat ng ibang tao.
- source_word: וַיִּשָּׂא
  choice: kinuha ang mga panustos
  rationale: Literal na may diwang ‘buhatin/dalhin’; ang ipinahiwatig na layon ay ang mga pagkaing ipinadala sa naunang talata. Ginawang tahas ito para sa malinaw na Tagalog.
- source_word: כַּאֲשֶׁר צִוָּהוּ יִשָׁי
  choice: gaya ng iniutos sa kanya ni Jesse
  rationale: Tapat na pinananatili ang diwa ng utos at ang pagsunod ni David nang hindi dinaragdagan ang teksto.
- source_word: הַמַּעְגָּלָה
  choice: kampo
  rationale: Malinaw at natural na tawag sa lugar na kinaroroonan ng hukbo; inilalagay sa talababa ang posibleng mas tiyak na kahulugan tungkol sa anyo o depensa nito.
- source_word: הַחַיִל הַיֹּצֵא אֶל־הַמַּעֲרָכָה
  choice: habang lumalabas ang hukbo patungo sa hanay ng labanan
  rationale: Ipinakikita ng participle ang kasabay na kilos nang dumating si David, at ang מַעֲרָכָה ay tumutukoy sa hanay o ayos para sa labanan.
- source_word: וְהֵרֵעוּ בַּמִּלְחָמָה
  choice: at sumisigaw ng sigaw-pandigma
  rationale: Inihahatid nito ang malakas na sigaw ng hukbo sa konteksto ng pakikipagdigma, habang pinananatili sa talababa ang mas literal at bahagyang malabong pagkakaugnay ng parirala.
