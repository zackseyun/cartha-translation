base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/026.yaml
  text: And David said to the men standing with him, “What will be done for the man who strikes down this Philistine and removes disgrace from Israel? For who is this uncircumcised Philistine, this one who has defied the battle lines of the living God?”
translation:
  language: tl
  text: Sinabi ni David sa mga lalaking nakatayong kasama niya, “Ano ang gagawin para sa taong papatay sa Filisteong ito at mag-aalis ng kahihiyan sa Israel? Sapagkat sino ba ang Filisteong itong di-tuli, na humahamak sa mga hanay ng hukbo ng Diyos na buháy?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַכֶּה
  choice: papatay
  rationale: Sa konteksto ng pakikipaglaban kay Goliat, ang pandiwa ay tumutukoy sa pagpaslang o pagpatay, hindi lamang pananakit.
- source_word: חֶרְפָּה
  choice: kahihiyan
  rationale: Ipinapahayag nito ang pampublikong paghamak at dungis na dinaranas ng Israel dahil sa hamon ng Filisteo.
- source_word: הֶעָרֵל
  choice: di-tuli
  rationale: Pinananatili ang tahasang katawagang tipan ng Hebreo at ang mapanuyang diin nito sa konteksto.
- source_word: מַעַרְכוֹת
  choice: mga hukbo
  rationale: Bagaman literal na maaaring tumukoy sa mga hanay na nakahanay sa labanan, dito ay likas sa Filipino ang “mga hukbo” at malinaw na tumutukoy sa mga puwersang pandigma ng Israel.
- source_word: אֱלֹהִים חַיִּים
  choice: Diyos na buháy
  rationale: Pinananatili ang mahalagang kaibahan ng Diyos ng Israel sa mga diyos na walang buhay.
theological_decisions:
- issue: Lakas ng חֵרֵף bilang paghamon sa Diyos
  choice: lumapastangan
  alternative: humamon / inalipusta
  rationale: Ang “lumapastangan” ay nagpapakita na ang ginawa ay hindi lamang hamong militar kundi mapanghamak na pagsasalita laban sa mga hukbong pag-aari ng Diyos na buháy.
- issue: Pagpapakahulugan sa “di-tuli”
  choice: Pinanatili sa pangunahing teksto nang walang paliwanag
  alternative: taong hindi kabilang sa tipan
  rationale: Hindi dapat palitan ng isang interpretatibong paliwanag ang kongkretong katawagang ginamit sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat sino ba” upang ihatid ang retorikal na diin, at ang “mga hukbo” bilang natural na katumbas sa kontekstong pandigma.
