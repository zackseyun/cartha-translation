revisions:
- from: Sinabi ni David sa mga lalaking nakatayong kasama niya, “Ano ang gagawin para sa taong papatay sa Filisteong ito at mag-aalis ng kahihiyan sa Israel? Sapagkat sino ba ang di-tuling Filisteong ito, na lumapastangan sa mga hukbo ng Diyos na buháy?”
  to: Sinabi ni David sa mga lalaking nakatayong kasama niya, “Ano ang gagawin para sa taong papatay sa Filisteong ito at mag-aalis ng kahihiyan sa Israel? Sapagkat sino ba ang Filisteong itong di-tuli, na humahamak sa mga hanay ng hukbo ng Diyos na buháy?”
  rationale: Ginawang mas tumpak ang paglalarawan sa mga puwersang Israelita bilang “mga hanay ng hukbo,” at ginamit ang “humahamak” para sa mapanghamak na kilos ng Filisteo nang hindi nagdaragdag ng isang mas tiyak na pagpapakahulugang doktrinal. Walang kinakailangang talababa dahil malinaw na naipapahayag ng pangunahing teksto ang mga terminong ito.
