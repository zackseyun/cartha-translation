  text: Then Saul clothed David with his garments[a], put a bronze helmet on his head[b], and clothed him with armor.
translation:
  language: tl
  text: Pagkatapos, isinuot ni Saul kay David ang kasuotan ni Saul[a], ipinatong sa ulo ni David ang isang tansong helmet, at isinuot sa kanya ang baluti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasuotang pandigma ni Saul.” Maaaring tumukoy ang salitang Hebreo sa kasuotang kaugnay ng katungkulan o sa damit na panlaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּלְבֵּשׁ
  choice: isinuot ... kay/sa kanya
  rationale: Ang Hiphil ng לבשׁ ay nagsasaad na pinasuot ni Saul si David. Likas sa modernong Tagalog ang konstruksyong “isinuot ... kay David/sa kanya,” at napapanatili rin ang pag-uulit ng pandiwa sa Hebreo.
- source_word: מַדָּיו
  choice: ang kanyang kasuotan
  rationale: Maaaring tumukoy ang מַד sa damit, kabilang ang opisyal o pandigmang kasuotan. Hindi ito isinaling “baluti” sapagkat hiwalay na binabanggit sa talata ang helmet at שִׁרְיוֹן. Ang hulaping 3ms ay ipinahayag bilang “kanyang,” na tumutukoy kay Saul ngunit hindi nagdaragdag ng diing katumbas ng “sarili niyang.”
- source_word: קוֹבַע נְחֹשֶׁת
  choice: isang tansong helmet
  rationale: Ang קוֹבַע ay helmet, at sa konteksto ng sinaunang sandata ang נְחֹשֶׁת ay karaniwang tumutukoy sa bronze. Ginamit ang “tanso” bilang malinaw at karaniwang katawagang Filipino para rito.
- source_word: עַל רֹאשׁוֹ
  choice: sa ulo nito
  rationale: Natural sa Tagalog ang “sa ulo.” Ginamit ang “nito” upang maging malinaw na kay David ipinatong ang helmet at maiwasan ang kalituhan sa dalawang lalaking binanggit.
- source_word: שִׁרְיוֹן
  choice: baluti
  rationale: Tumutukoy ang salita sa pananggalang sa katawan. Ang “baluti” ay maikli, marangal, at pamilyar na salin nang hindi nagpapasya kung ito ay mail, kaliskising baluti, o ibang tiyak na kayarian.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang tatlong sunod-sunod na kilos at ang pag-uulit ng “isinuot” mula sa Hebreo. Hindi nilagyan ng talababa ang helmet; ang ibinigay na English footnote b na “coat of mail” o “body armor” ay semantikong nauukol sa שִׁרְיוֹן, hindi sa pariralang “bronze helmet.”
