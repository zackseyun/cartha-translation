  yaml_path: translation/ot/1_samuel/017/004.yaml
  text: Then a champion came out from the camps of the Philistines[a]; his name was Goliath, from Gath[b]. His height was six cubits and a span.
translation:
  language: tl
  text: At isang mandirigmang kinatawan[a] ang lumabas mula sa mga kampo ng mga Filisteo. Goliat ang pangalan niya, at mula siya sa Gat. Anim na siko at isang dangkal[b] ang taas niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “isang tao ng pagitan,” na malamang ay tumutukoy sa mandirigmang lumalabas sa pagitan ng dalawang hanay upang lumaban bilang kinatawan.
    reason: lexical_alternative
  - marker: b
    text: Ang anim na siko at isang dangkal ay humigit-kumulang 3.0 metro, depende sa haba ng siko na ginamit.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ הַבֵּנַיִם
  choice: isang mandirigmang kinatawan
  rationale: Literal itong “tao ng pagitan,” malamang isang mandirigmang pumupunta sa pagitan ng dalawang hanay upang lumaban bilang kinatawan. Nililinaw ng saling ito ang tungkulin nang hindi isinasara ang idyomatikong diwa; ipinaliliwanag sa talababa ang literal na anyo.
- source_word: וַיֵּצֵא
  choice: ang lumabas
  rationale: Likas na katumbas ng pandiwang Hebreo sa tagpong lumalabas ang mandirigma mula sa panig ng mga Filisteo.
- source_word: מִמַּחֲנוֹת פְּלִשְׁתִּים
  choice: mula sa mga kampo ng mga Filisteo
  rationale: Pinananatili ang pangmaramihang “mga kampo” ng tekstong Hebreo at ang karaniwang pangalang Filipino para sa bayan.
- source_word: גָּלְיָת שְׁמוֹ
  choice: Goliat ang pangalan niya
  rationale: Natural na modernong Tagalog na nananatiling malapit sa estrukturang “Goliat ang pangalan niya.”
- source_word: מִגַּת
  choice: mula siya sa Gat
  rationale: Tuwirang pinananatili ang pook na pinagmulan sa halip na gawing katawagang etniko.
- source_word: גָּבְהוֹ
  choice: ang taas niya
  rationale: Karaniwang Tagalog para sa pangngalang tumutukoy sa taas o tindig ng isang tao.
- source_word: שֵׁשׁ אַמּוֹת וָזָרֶת
  choice: Anim na siko at isang dangkal
  rationale: Pinananatili sa pangunahing teksto ang sinaunang mga yunit. Ang “siko” at “dangkal” ang natural na katumbas sa Tagalog, habang nasa talababa ang tinatayang makabagong sukat.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mandirigmang kinatawan” upang maipahayag ang hindi pangkaraniwang idyomang Hebreo sa paraang mauunawaan ng karaniwang mambabasa, at pinanatili ang sinaunang mga yunit sa pangunahing teksto.
