base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/049.yaml
  text: Then David reached his hand into the bag[a], took a stone from there, slung it, and struck the Philistine on his forehead. The stone sank into his forehead[c][b], and he fell on his face to the ground.
translation:
  language: tl
  text: Pagkatapos, ipinasok ni David ang kamay niya sa supot[a], kumuha roon ng isang bato, ipinukol niya iyon gamit ang tirador, at tinamaan niya ang Filisteo sa noo. Bumaon ang bato sa noo nito[b], at bumagsak siyang nakasubsob sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lalagyan.” Malawak ang salitang Hebreo at dito ay tumutukoy sa sisidlang kinalalagyan ng mga bato ni David.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Bumaon ang bato sa noo nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ אֶל הַכֶּלִי
  choice: ipinasok ni David ang kamay niya sa supot
  rationale: Ang literal na idyoma ay ‘iniunat/ipinadala ang kamay patungo sa sisidlan,’ ngunit sa konteksto ay natural na tumutukoy sa pagpasok ng kamay upang kumuha ng bato.
- source_word: הַכֶּלִי
  choice: supot
  rationale: Malawak ang kahulugan ng כְּלִי, ngunit dito ay lalagyan ito ng mga bato ni David. Ang ‘supot’ ay malinaw at angkop sa kagamitang dala niya.
- source_word: אֶבֶן
  choice: isang bato
  rationale: Karaniwan at eksaktong katumbas ng אֶבֶן sa kontekstong ito.
- source_word: וַיְקַלַּע
  choice: pinahilagpos iyon
  rationale: Ipinahihiwatig ng pandiwa ang pagpapakawala ng bato gamit ang panghilagpos; pinananatili ng salin ang tiyak na kilos nang hindi mabigat ang pananalita.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי אֶל מִצְחוֹ
  choice: tinamaan ang Filisteo sa noo
  rationale: Natural sa Filipino at pinananatili ang noo bilang lugar ng tama.
- source_word: וַתִּטְבַּע הָאֶבֶן בְּמִצְחוֹ
  choice: Bumaon ang bato sa noo nito
  rationale: Ang pandiwa ay nagsasaad ng paglubog o pagkabaon; malinaw at masigla ang ‘bumabaon’ nang hindi nagdaragdag ng anatomikong detalye.
- source_word: וַיִּפֹּל עַל פָּנָיו אַרְצָה
  choice: bumagsak siyang nakasubsob sa lupa
  rationale: Natural na Filipino para sa literal na ‘bumagsak siya na ang mukha ay patungo sa lupa,’ at malinaw na ipinahahayag ang ayos ng katawan.
