  text: וַ/יִּקַּ֨ח מַקְל֜/וֹ בְּ/יָד֗/וֹ וַ/יִּבְחַר ל֣/וֹ חֲמִשָּׁ֣ה חַלֻּקֵֽי אֲבָנִ֣ים מִן הַ/נַּ֡חַל וַ/יָּ֣שֶׂם אֹ֠תָ/ם בִּ/כְלִ֨י הָ/רֹעִ֧ים אֲשֶׁר ל֛/וֹ וּ/בַ/יַּלְק֖וּט וְ/קַלְּע֣/וֹ בְ/יָד֑/וֹ וַ/יִּגַּ֖שׁ אֶל הַ/פְּלִשְׁתִּֽי־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/040.yaml
  text: He took his staff in his hand and chose for himself five smooth stones from the wadi[a], and put them in the shepherd’s bag that he had, in the pouch; and his sling was in his hand[b]. Then he approached the Philistine.
translation:
  language: tl
  text: Kinuha niya ang kanyang tungkod at hinawakan ito sa kanyang kamay, at pumili para sa sarili niya ng limang makikinis na bato mula sa batis[a]. Inilagay niya ang mga iyon sa sisidlan ng pastol na dala niya—sa supot[b]—at nasa kamay niya ang kanyang tirador. Pagkatapos, lumapit siya sa Filisteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa tuyong daluyan ng tubig.” Ang salitang Hebreo ay maaaring tumukoy sa batis, bangin, o pana-panahong daluyan ng tubig.
    reason: lexical_alternative
  - marker: b
    text: O “maliit na bag.” Ang salitang Hebreo ay tumutukoy sa isang supot o bag na lalagyan ng mga bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלוֹ
  choice: kanyang tungkod
  rationale: Ang מַקֵּל ay tungkod o patpat; ang “tungkod” ay natural at angkop sa konteksto ng isang pastol.
- source_word: וַיִּבְחַר לוֹ
  choice: pumili para sa sarili niya
  rationale: Pinananatili nito ang personal o reflexive na diin ng לוֹ at ang sinasadyang pagpili ni David.
- source_word: חֲמִשָּׁה חַלֻּקֵי אֲבָנִים
  choice: limang makikinis na bato
  rationale: Ang חַלֻּקֵי ay tumutukoy sa pagiging makinis ng mga batong pinakinis ng tubig.
- source_word: מִן הַנַּחַל
  choice: mula sa batis
  rationale: Ang נַחַל ay maaaring tumukoy sa batis, bangin, o pana-panahong daluyan ng tubig. “Batis” ang pinakanatural na maikling salin sa Tagalog, habang inilalahad sa talababa ang mas malawak na saklaw.
- source_word: בִּכְלִי הָרֹעִים אֲשֶׁר לוֹ
  choice: sa sisidlan ng pastol na dala niya
  rationale: Malawak ang kahulugan ng כְּלִי bilang sisidlan o kagamitan. Hindi agad ipinapalagay na isa pang bag ito, at natural na ipinahihiwatig ng “dala niya” na pag-aari o taglay niya iyon.
- source_word: וּבַיַּלְקוּט
  choice: sa supot
  rationale: Ang יַלְקוּט ay maliit na bag, supot, o sisidlang bitbit. Ginagamit ang gitling upang ipakitang nililinaw nito ang naunang mas malawak na parirala.
- source_word: וְקַלְעוֹ בְיָדוֹ
  choice: at hawak niya ang kanyang tirador
  rationale: Natural nitong isinasalin sa Tagalog ang sugnay na walang pandiwa at pinananatili ang diin na nasa kamay niya ang tirador.
- source_word: וַיִּגַּשׁ אֶל הַפְּלִשְׁתִּי
  choice: Pagkatapos, lumapit siya sa Filisteo
  rationale: Ang נגשׁ ay “lumapit” o “pumaroon nang malapit”; ipinahahayag ng “Pagkatapos” ang pagsulong ng salaysay.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang sunod-sunod at kongkretong kilos ng tekstong Hebreo. Ginamit ang “Filisteo,” ang karaniwang katawagan sa isang taong kabilang sa mga Filisteo.
