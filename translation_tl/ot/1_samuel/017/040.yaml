revisions:
- from: Kinuha niya sa kamay ang kanyang tungkod at pumili para sa sarili niya ng limang makikinis na bato mula sa batis[a]. Inilagay niya ang mga iyon sa sisidlan ng pastol na dala niya—sa supot[b]—at hawak niya ang kanyang tirador. Pagkatapos, lumapit siya sa Filisteo.
  to: Kinuha niya ang kanyang tungkod at hinawakan ito sa kanyang kamay, at pumili para sa sarili niya ng limang makikinis na bato mula sa batis[a]. Inilagay niya ang mga iyon sa sisidlan ng pastol na dala niya—sa supot[b]—at nasa kamay niya ang kanyang tirador. Pagkatapos, lumapit siya sa Filisteo.
  rationale: Inayos ang unang sugnay upang malinaw na ang tungkod ay kinuha at nasa kamay ni David, sa halip na magmukhang kinuha ito mula sa kamay. Pinalitan din ang “hawak niya ang kanyang tirador” ng “nasa kamay niya ang kanyang tirador” upang mas tuwirang maipakita ang nominal na sugnay sa Hebreo. Walang pagbabagong pangkahulugan sa iba pang bahagi o sa mga talababa.
