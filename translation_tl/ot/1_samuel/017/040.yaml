  terminology: Ang “tungkod,” “makikinis na bato,” “sisidlan,” “supot,” “tirador,” at “Filisteo” ay angkop. Ang “batis” ay katanggap-tanggap bilang pangunahing salin ng נחל, at ang talababa ay wastong nag-iingat sa mas malawak na saklaw nito. Pinananatili ng “sisidlan ng pastol na dala niya—sa supot” ang paglilinaw ng mas tiyak na lalagyan, nang hindi pinipilit na magkaibang bagay ang dalawang katawagan.
