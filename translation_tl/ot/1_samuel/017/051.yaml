base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/051.yaml
  text: Then David ran and stood over the Philistine[a], took his sword, drew it from its sheath, and killed him; then he cut off his head with it. When the Philistines saw that their champion was dead[b], they fled.
translation:
  language: tl
  text: Pagkatapos, tumakbo si David at tumayo sa tabi ng Filisteo.[a] Kinuha niya ang espada nito, binunot iyon mula sa kaluban, at pinatay siya. Pagkatapos, pinutol niya ang ulo nito gamit ang espada. Nang makita ng mga Filisteo na patay na ang kanilang mandirigma,[b] tumakas sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumayo sa ibabaw ng Filisteo.” Maaaring tumukoy ang pananalitang Hebreo sa pagpuwesto sa tabi o malapit sa kanya; ang “sa ibabaw” ay angkop din sa tagpong nakatayo si David sa ibabaw ng nakabulagtang Filisteo.
    reason: lexical_alternative
  - marker: b
    text: O “kanilang makapangyarihang lalaki,” “kanilang bayani,” o “kanilang kampeon.” Inilalarawan ng salitang Hebreo ang isang malakas at magiting na mandirigma; ipinakikita ng naunang salaysay na ang Filisteong ito ang kinatawang lumaban para sa mga Filisteo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: tumakbo
  rationale: Ang payak na pandiwang רוץ ay natural at tuwirang isinasalin na “tumakbo” sa salaysay.
- source_word: וַיַּעֲמֹד אֶל הַפְּלִשְׁתִּי
  choice: tumayo sa tabi ng Filisteo
  rationale: Ang עמד אל ay maaaring tumukoy sa pagpuwesto sa tabi o malapit sa isang tao. Pinananatili ng “sa tabi” ang kahulugang malinaw na sinusuportahan ng pariralang Hebreo nang hindi ipinapalagay ang eksaktong posisyon ni David sa ibabaw ng nakabulagtang Filisteo.
- source_word: חַרְבּוֹ
  choice: ang espada nito
  rationale: Tumutukoy ang hulaping paari sa espada ng Filisteo. Ginagawang malinaw ng “nito” ang tinutukoy at iniiwasan ang kalituhan kung kaninong espada iyon.
- source_word: וַיִּשְׁלְפָהּ מִתַּעְרָהּ
  choice: binunot iyon mula sa kaluban
  rationale: Karaniwang ginagamit ang שלף sa pagbunot ng sandata, at ang תער ay kaluban sa kontekstong ito.
- source_word: וַיְמֹתְתֵהוּ
  choice: pinatay siya
  rationale: Ang anyong pandiwa mula sa מות ay tahasang nagsasaad na pinatay ni David ang Filisteo. Pinananatili nito ang pagkakasunod ng salaysay kahit sinabi sa naunang talata na bumagsak na siya dahil sa tama ng bato.
- source_word: וַיִּכְרָת בָּהּ אֶת רֹאשׁוֹ
  choice: pinugutan niya ito gamit ang espada
  rationale: Sa kontekstong ito, ang כרת kasama ng ראשׁ ay pagputol sa ulo. Ang “pinugutan” ay natural at eksaktong Filipino; nililinaw ng “gamit ang espada” ang reperente ng pambabaeng panghalip na tumutukoy sa חֶרֶב.
- source_word: גִּבּוֹרָם
  choice: kanilang mandirigma
  rationale: Ang גבור ay maaaring mangahulugang makapangyarihang lalaki, mandirigma, o bayaning pandigma. Ang “mandirigma” ay likas sa Filipino at hindi labis na nililimitahan ang salita sa teknikal na papel ng kinatawang lumalaban.
- source_word: וַיָּנֻסוּ
  choice: tumakas sila
  rationale: Ang נוס ay karaniwang pandiwa para sa pagtakas, lalo na sa pagkatalo sa labanan; natural at maikli ang “tumakas.”
