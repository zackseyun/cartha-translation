translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “espada” at “kaluban” bilang pangkaraniwang kasalukuyang bokabularyo. Pinanatili ang mariing pagkakasunod ng mga kilos sa Hebreo at inilagay sa talababa ang tunay na leksikal na kalabuan sa posisyon ni David at sa katawagang גִּבּוֹר.
