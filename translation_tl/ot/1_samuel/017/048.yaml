  text: And when the Philistine rose and came and drew near to meet David[a], David hurried and ran toward the battle line to meet the Philistine.
translation:
  language: tl
  text: Nang tumindig ang Filisteo, lumakad at lumapit upang salubungin si David, nagmadali si David at tumakbo patungo sa linya ng labanan[a] upang salubungin ang Filisteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanay ng hukbo.” Ang salitang Hebreo ay maaaring tumukoy sa linya o sa pagkakaayos ng mga hukbo sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Nang
  rationale: Likas na ipinahahayag sa makabagong Tagalog ang temporal na pormulang pasalaysay nang hindi mabigat ang literal na “at nangyari nang.”
- source_word: קָם
  choice: tumindig
  rationale: Tumutukoy sa pagbangon o pagtayo ng Filisteo; pinananatili ng “tumindig” ang kongkretong kilos at marangal na himig.
- source_word: הַפְּלִשְׁתִּי
  choice: ang Filisteo
  rationale: Payak na “ang Filisteo” ang nasa Hebreo; hindi idinagdag ang “kampeon,” na mula sa mas malawak na konteksto.
- source_word: וַיֵּלֶךְ
  choice: sumulong
  rationale: Sa kontekstong militar at kasunod ng paglapit kay David, malinaw na naghahatid ang “sumulong” ng pasulong na pagkilos nang hindi ito pinagsasama sa kasunod na pandiwa.
- source_word: וַיִּקְרַב
  choice: lumapit
  rationale: Tuwirang inilalarawan ang papalapit na kilos at pinananatili itong hiwalay sa naunang “sumulong.”
- source_word: לִקְרַאת
  choice: upang salubungin
  rationale: Ipinahahayag ang pagkilos tungo sa isang harapang pagtatagpo; ang “salubungin” ay natural sa Tagalog at angkop sa sagupaan.
- source_word: וַיְמַהֵר
  choice: nagmadali
  rationale: Tuwirang ipinahahayag ang mabilis na pagkilos sa kasalukuyan at karaniwang Tagalog.
- source_word: וַיָּרָץ
  choice: tumakbo
  rationale: Payak at tuwirang katumbas ng pandiwang Hebreo.
- source_word: הַמַּעֲרָכָה
  choice: hanay ng labanan
  rationale: Maaaring tumukoy ang pangngalan sa linya o pagkakaayos ng mga hukbo sa labanan. Pinananatili ng parirala ang larawang militar nang hindi labis na tinutukoy kung aling hanay.
