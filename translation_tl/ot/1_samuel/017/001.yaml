  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּאַסְפ֨וּ פְלִשְׁתִּ֤ים אֶת מַֽחֲנֵי/הֶם֙ לַ/מִּלְחָמָ֔ה וַ/יֵּאָ֣סְפ֔וּ שֹׂכֹ֖ה אֲשֶׁ֣ר לִ/יהוּדָ֑ה וַֽ/יַּחֲנ֛וּ בֵּין שׂוֹכֹ֥ה וּ/בֵין עֲזֵקָ֖ה בְּ/אֶ֥פֶס דַּמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/001.yaml
  text: The Philistines gathered their armies for battle[a], and they assembled at Socoh, which belongs to Judah, and camped between Socoh and Azekah[b], at Ephes-dammim.
translation:
  language: tl
  text: Tinipon ng mga Filisteo ang kanilang mga hukbo para sa labanan[a]. Nagtipon sila sa Socoh, na sakop ng Juda, at nagkampo sa pagitan ng Socoh at Azekah[b], sa Ephes-dammim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang mga kampo” o “kanilang mga puwersa.” Ang salitang Hebreo ay maaaring tumukoy sa mga kampong militar o sa mga hukbo.
    reason: lexical_alternative
  - marker: b
    text: Ang Socoh ay isang bayan sa teritoryo ng Juda.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּאַסְפוּ
  choice: Tinipon
  rationale: Ang אָסַף ay nangangahulugang tipunin o pagt集?; ang 'tinipon' ay natural sa salaysay at malinaw na may tuwirang layon.
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang makabagong Tagalog na pangalan para sa pangkat na ito.
- source_word: מַחֲנֵיהֶם
  choice: kanilang mga hukbo
  rationale: Maaaring tumukoy ang מַחֲנֶה sa kampo o sa puwersang militar. Sa konteksto ng paghahanda para sa labanan, likas ang 'mga hukbo,' habang inilalahad sa talababa ang tunay na leksikal na saklaw.
- source_word: לַמִּלְחָמָה
  choice: para sa labanan
  rationale: Sa agarang tagpo ng pagtitipon ng mga puwersa, mas tiyak at natural ang 'labanan' kaysa sa mas malawak na 'digmaan.'
- source_word: וַיֵּאָסְפוּ
  choice: Nagtipon sila
  rationale: Pinananatili ang diwa ng parehong ugat na אָסַף, ngunit natural ang pandiwang katawanin sa ikalawang sugnay.
- source_word: שֹׂכֹה
  choice: Socoh
  rationale: Transliterasyon ng pangalan ng lugar, pinananatiling pareho sa kinikilalang anyong internasyonal.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: na sakop ng Juda
  rationale: Ipinahahayag nito ang teritoryal na pagkakaugnay o pag-aari na ipinakikita ng לְ, nang hindi ipinapalagay na simpleng lokasyon lamang.
- source_word: וַיַּחֲנוּ
  choice: nagkampo
  rationale: Natural at kasalukuyang Filipino para sa pagkakampo o pagtigil bilang kampo.
- source_word: בֵּין ... וּבֵין
  choice: sa pagitan ng ... at
  rationale: Tuwirang katumbas ng ekspresyong panglokasyon.
- source_word: עֲזֵקָה
  choice: Azekah
  rationale: Transliterasyon ng pangalan ng lugar.
- source_word: בְּאֶפֶס דַּמִּים
  choice: sa Ephes-dammim
  rationale: Itinuturing na pangalan ng lugar, hindi isinasalin ayon sa posibleng kahulugan ng mga sangkap nito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'sakop ng Juda' upang natural na maipahayag ang teritoryal na ugnayan. Hindi nagdagdag ng panimulang 'Ngayon' sapagkat walang tahasang katumbas nito sa Hebreo.
