translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal, na may payak na salaysay at bokabularyong madaling maunawaan. Pinanatili ang mga pangalang-pook sa transliterasyon at inilagay sa talababa ang tunay na kalabuan ng pariralang Hebreo.
