  text: וַ/יָּקֻ֣מוּ אַנְשֵׁי֩ יִשְׂרָאֵ֨ל וִ/יהוּדָ֜ה וַ/יָּרִ֗עוּ וַֽ/יִּרְדְּפוּ֙ אֶת הַ/פְּלִשְׁתִּ֔ים עַד בּוֹאֲ/ךָ֣ גַ֔יְא וְ/עַ֖ד שַׁעֲרֵ֣י עֶקְר֑וֹן וַֽ/יִּפְּל֞וּ חַֽלְלֵ֤י פְלִשְׁתִּים֙ בְּ/דֶ֣רֶךְ שַׁעֲרַ֔יִם וְ/עַד גַּ֖ת וְ/עַד עֶקְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/052.yaml
  text: Then the men of Israel and Judah rose up and shouted[a], and they pursued the Philistines as far as Gai and as far as the gates of Ekron. The slain Philistines fell along the road to Shaaraim[b], as far as Gath and as far as Ekron.
translation:
  language: tl
  text: Pagkatapos, tumindig ang mga kalalakihan ng Israel at Juda at sumigaw[a]. Hinabol nila ang mga Filisteo hanggang Gai[b] at hanggang sa mga tarangkahan ng Ekron. Nagbagsakan ang mga napatay na Filisteo sa daan patungong Shaaraim, hanggang Gat at hanggang Ekron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagtaas ng sigaw-pandigma.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, maaari ring unawain na “hanggang sa pasukan ng lambak.” Mahirap tiyakin ang teksto at ayos ng parirala; maaaring pangalan ng lugar ang Gai.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: tumindig
  rationale: Ipinahahayag ng Qal wayyiqtol ng קום ang biglang pagkilos ng hukbo matapos bumagsak si Goliat; natural at marangal sa modernong Tagalog ang “tumindig.”
- source_word: אַנְשֵׁי יִשְׂרָאֵל וִיהוּדָה
  choice: ang mga lalaki ng Israel at Juda
  rationale: Pinananatili ang tahasang “mga lalaki” ng Hebreo at ang kontekstong militar, nang hindi nagdaragdag ng salitang “kawal” na wala mismo sa parirala.
- source_word: וַיָּרִעוּ
  choice: sumigaw
  rationale: Ang רוע ay tumutukoy rito sa malakas na sigaw, partikular sa sigaw sa pakikipagdigma; natural ang “sumigaw,” at inilalahad sa talababa ang mas tiyak na alternatibo.
- source_word: וַיִּרְדְּפוּ
  choice: hinabol nila
  rationale: Karaniwang kahulugan ng רדף sa kontekstong militar ang pagtugis o paghabol; mas natural sa ordinaryong modernong Tagalog ang “hinabol nila.”
- source_word: עַד בּוֹאֲךָ גַיְא
  choice: hanggang Gai
  rationale: Sinusunod sa pangunahing teksto ang pagbasa sa גיא bilang pangalang-pook, habang pinananatili sa talababa ang literal na posibilidad na “hanggang sa pasukan ng lambak” dahil mahirap ang parirala sa teksto at sintaks.
- source_word: וְעַד שַׁעֲרֵי עֶקְרוֹן
  choice: at hanggang sa mga pintuang-bayan ng Ekron
  rationale: Tuwirang inilalarawan ang hangganan ng pagtugis; nililinaw ng “pintuang-bayan” na ang tinutukoy ay mga tarangkahan ng lungsod.
- source_word: וַיִּפְּלוּ חַלְלֵי פְלִשְׁתִּים
  choice: Nagbagsakan ang mga Filisteong napatay
  rationale: Ang חַלְלֵי ay mga napatay o nasawi sa labanan, hindi lamang nasugatan. Ipinananatili ng “nagbagsakan” ang pandiwang נפל sa natural na salaysay na Tagalog.
- source_word: בְּדֶרֶךְ שַׁעֲרַיִם
  choice: sa daan patungong Shaaraim
  rationale: Natural na ipinahahayag ang ruta tungo sa pangalang-pook na Shaaraim.
- source_word: וְעַד גַּת וְעַד עֶקְרוֹן
  choice: hanggang Gat at hanggang Ekron
  rationale: Pinananatili ang inuulit na עַד upang idiin ang lawak ng pagkatalo ng mga Filisteo.
