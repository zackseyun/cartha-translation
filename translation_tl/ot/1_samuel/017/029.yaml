  register: Modernong Filipino na natural ngunit marangal. Ang “Ano ba” at “nagtanong lang ako” ay malinaw sa karaniwang mambabasa at angkop sa pagtutol ni David; pinananatili ng talababa ang tunay na lawak at kalabuan ng דָּבָר.
