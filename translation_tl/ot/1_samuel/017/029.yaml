  text: David said[a], “What have I done now? Was it not just a word?”
translation:
  language: tl
  text: Sinabi ni David, “Ano ba ang nagawa ko ngayon? Hindi ba’t salita lamang iyon?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi ba’t isang usapin lamang iyon?” o “Hindi ba’t isang bagay lamang iyon?” Ang salitang Hebreo na דָּבָר ay maaaring mangahulugang “salita,” “usapin,” o “bagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang pandiwang pasalaysay na nagpapakilala ng tuwirang pananalita; natural sa modernong Filipino.
- source_word: דָּוִד
  choice: David
  rationale: Ginamit ang karaniwang anyo ng pangalan sa Filipino.
- source_word: מֶה עָשִׂיתִי עָתָּה
  choice: Ano ba ang nagawa ko ngayon?
  rationale: Pinananatili ang tanong na pagtutol; ang “ba” ay natural na naghahatid ng tono ng pagtatanggol sa sarili, at ang “nagawa” ay nagpapakita ng agarang kaugnayan ng sinasabing ginawa.
- source_word: הֲלוֹא
  choice: Hindi ba’t
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: דָּבָר
  choice: nagtanong
  rationale: Sa konteksto, ipinagtatanggol ni David ang nauna niyang sinabi, na nasa anyo ng pagtatanong. Natural itong pagpapahayag sa Filipino, habang inilalagay sa talababa ang mas literal at malawak na kahulugan ng salitang Hebreo.
- source_word: הוּא
  choice: —
  rationale: Hindi kailangang isalin nang hiwalay ang panghalip sa natural na pariralang Filipino na “nagtanong lang ako.”
