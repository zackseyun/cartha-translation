  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָ֗ה אֲשֶׁ֨ר הִצִּלַ֜/נִי מִ/יַּ֤ד הָֽ/אֲרִי֙ וּ/מִ/יַּ֣ד הַ/דֹּ֔ב ה֣וּא יַצִּילֵ֔/נִי מִ/יַּ֥ד הַ/פְּלִשְׁתִּ֖י הַ/זֶּ֑ה וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל דָּוִד֙ לֵ֔ךְ וַֽ/יהוָ֖ה יִהְיֶ֥ה עִמָּֽ/ךְס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/037.yaml
  text: David said[a], “Yahweh, who delivered me from the paw of the lion and from the paw of the bear, he will deliver me from the hand of this Philistine.” Then Saul said to David, “Go, and may Yahweh be with you.”
translation:
  language: tl
  text: Sinabi ni David, “Si Yahweh na nagligtas sa akin mula sa mga kuko ng leon at ng oso—siya ang magliligtas sa akin mula sa kamay ng Filisteong ito.” Pagkatapos, sinabi ni Saul kay David, “Humayo ka, at sumaiyo nawa si Yahweh.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at sasama sa iyo si Yahweh.” Maaaring basahin ang Hebreo bilang isang basbas o hangarin, o bilang isang payak na pahayag tungkol sa hinaharap.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos upang direktang katawanin ang Tetragrammaton, sa halip na palitan ito ng titulong “Panginoon.”
- source_word: הִצִּלַנִי / יַצִּילֵנִי
  choice: nagligtas sa akin / magliligtas sa akin
  rationale: Ang Hiphil ng נצל ay tumutukoy sa pagliligtas mula sa panganib. Pinananatili ng magkatugmang pandiwa ang ugnayan ng nakaraang pagliligtas at ng tiwala ni David sa darating na pagliligtas.
- source_word: מִיַּד
  choice: mula sa mga kuko / mula sa kamay
  rationale: Literal na “mula sa kamay” ang idyoma. Sa mga mababangis na hayop, natural sa Filipino ang “mula sa mga kuko,” samantalang sa Filisteo ay angkop at malinaw ang “mula sa kamay.”
- source_word: הָאֲרִי / הַדֹּב
  choice: ang leon / ang oso
  rationale: Tuwirang salin ng dalawang tiyak na pangngalan; sa pinagsamang pariralang Filipino, “ng leon at ng oso” ang natural na anyo.
- source_word: הוּא
  choice: siya rin
  rationale: Pinananatili ang diin ng hiwalay na panghalip sa Hebreo. Ang “rin” ay likas na nag-uugnay sa ginawa ni Yahweh noon at sa gagawin niya ngayon.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: Filisteong ito
  rationale: Natural na ayos sa Filipino na nagpapanatili sa tiyak at mariing pagtukoy ni David sa kalaban.
- source_word: לֵךְ
  choice: Humayo ka
  rationale: Maikli at tuwirang pautos, na may marangal na rehistrong angkop sa salaysay sa Kasulatan.
- source_word: יִהְיֶה עִמָּךְ
  choice: sumaiyo nawa si Yahweh
  rationale: Ipinahahayag ang kontekstuwal na puwersa bilang pagpapala o hangarin, habang inilalagay sa talababa ang posibleng pagbasa bilang payak na pahayag sa hinaharap.
theological_decisions:
- issue: Paglalarawan sa pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyong “Yahweh” nang hindi pinapalitan ng isang titulo.
- issue: Puwersa ng huling sinabi ni Saul
  choice: sumaiyo nawa si Yahweh
  alternative: at sasaiyo si Yahweh
  rationale: Maaaring unawain ang imperfect na Hebreo bilang basbas o hangarin sa kontekstong ito, ngunit maaari rin itong basahin bilang simpleng pahayag sa hinaharap. Pinili sa teksto ang natural na basbas at pinanatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal na himig. Ginamit ang “Humayo ka” bilang maikli at angkop na pautos; iniwasan ang labis na kolokyal o denominasyonal na pananalita.
