base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/057.yaml
  text: When David returned from striking down the Philistine[a], Abner took him and brought him before Saul, with the Philistine’s head in his hand.
translation:
  language: tl
  text: Nang bumalik si David matapos niyang pabagsakin ang Filisteo, isinama siya ni Abner at dinala sa harap ni Saul, habang hawak niya ang ulo ng Filisteo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O mas pormal: “at ang ulo ng Filisteo ay nasa kanyang kamay.” Walang tahasang pandiwa ang sugnay sa Hebreo, kaya maaari itong isalin bilang pangyayaring kasabay ng naunang kilos o bilang hiwalay na sugnay. Malamang na si David ang tinutukoy ng “niya,” ngunit maaari rin itong iugnay kay Abner ayon sa balarila.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְשׁוּב
  choice: Nang bumalik
  rationale: Ang waw kasama ng infinitive construct ng שׁוב ay nagpapakilala ng sugnay na temporal. Likas sa makabagong Tagalog ang “Nang bumalik.”
- source_word: מֵהַכּוֹת
  choice: matapos niyang pabagsakin
  rationale: Ang נכה ay may kongkretong diwang “hampasin” o “pabagsakin”; sa konteksto, nakamamatay ang pagkatalo sa Filisteo. Pinananatili ng “pabagsakin” ang larawan nang hindi nagdaragdag ng pangalang wala sa teksto.
- source_word: הַפְּלִשְׁתִּי
  choice: ang Filisteo
  rationale: “Ang Filisteo” lamang ang nasa Hebreo. Hindi ipinalit ang “Goliat” o “kampeong Filisteo,” bagaman malinaw sa konteksto kung sino siya.
- source_word: וַיִּקַּח אֹתוֹ
  choice: isinama siya ni Abner
  rationale: Ang לקח ay “kunin/dalhin.” Sa Tagalog, maaaring magpahiwatig ng marahas na pagdakip ang “kinuha,” kaya mas natural dito ang “isinama,” nang hindi inuunahan ang kasunod na pandiwang “dinala.”
- source_word: וַיְבִאֵהוּ לִפְנֵי שָׁאוּל
  choice: dinala sa harap ni Saul
  rationale: Ang hiphil ng בוא ay “dalhin,” at malinaw na katumbas ng לִפְנֵי ang “sa harap ni Saul.”
- source_word: וְרֹאשׁ הַפְּלִשְׁתִּי בְּיָדוֹ
  choice: habang hawak niya ang ulo ng Filisteo
  rationale: Ang sugnay sa Hebreo ay walang tahasang pandiwa at maaaring unawaing pangyayari kasabay ng pangunahing kilos. Natural sa Tagalog ang “habang hawak niya,” ngunit itinatala sa talababa ang mas pormal na koordinadong anyo at ang likas na kalabuan ng panghalip.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang katawagang “Filisteo” at ang marahas ngunit hindi eksaheradong larawan ng pagkakapabagsak. Inilagay ang marker [a] kaagad pagkatapos ng bahaging tinatalakay nito.
