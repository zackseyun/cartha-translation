  text: וַ/יֹּ֥אמֶר הַ/פְּלִשְׁתִּ֖י אֶל דָּוִ֑ד לְכָ֣/ה אֵלַ֔/י וְ/אֶתְּנָה֙ אֶת בְּשָׂ֣רְ/ךָ֔ לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הַ/שָּׂדֶֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/044.yaml
  text: And the Philistine said to David[a], “Come to me[b], and I will give your flesh to the birds of the heavens and to the beasts of the field.”
translation:
  language: tl
  text: Sinabi ng Filisteo kay David, “Lumapit ka sa akin, at ibibigay ko ang laman mo sa mga ibon sa langit[a] at sa mga hayop sa parang.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ibon sa kalangitan.”
    reason: lexical_alternative
  - marker: b
    text: O “mga hayop sa kaparangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: ang Filisteo
  rationale: Tiyak na tumutukoy kay Goliat ang pangngalang may pantukoy. Hindi idinagdag ang “mandirigma” sapagkat ipinahihiwatig lamang iyon ng konteksto at wala sa pariralang Hebreo.
- source_word: לְכָה אֵלַי
  choice: Lumapit ka sa akin
  rationale: Ang pautos ng הלך kasama ng אֵלַי ay isang tuwirang hamon na pumunta sa kinaroroonan ng nagsasalita. Mas likas sa modernong Tagalog ang “Lumapit ka sa akin” kaysa sa literal na “Pumarito ka sa akin.”
- source_word: וְאֶתְּנָה
  choice: at ibibigay ko
  rationale: Ipinahahayag ng anyo rito ang mariing pasiya o banta ng nagsasalita; malinaw at natural itong naihahatid ng panghinaharap na “ibibigay ko.”
- source_word: בְּשָׂרְךָ
  choice: ang laman mo
  rationale: Pinananatili ng “laman” ang literal at marahas na larawan ng בשר, sa halip na palitan ito ng mas interpretatibong “katawan” o “bangkay.”
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: sa mga ibon sa langit
  rationale: Ang עוֹף ay natural na tumutukoy rito sa mga ibon, at ang הַשָּׁמַיִם ay malinaw at karaniwang naihahayag bilang “langit.”
- source_word: וּלְבֶהֱמַת הַשָּׂדֶה
  choice: at sa mga hayop sa parang
  rationale: Saklaw ng בְּהֵמָה ang mga hayop, samantalang ang שָׂדֶה ay maaaring tumukoy sa parang o bukás na lupain. Ang “mga hayop sa parang” ay natural at hindi nagdaragdag ng katangiang “mababangis” na hindi tahasang nakasaad.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal ang himig. Pinanatili ang marahas na pananalita ng banta at iniwasan ang mga dagdag na salitang wala sa Hebreo. Inilagay ang mga panandang talababa kaagad pagkatapos ng mga pariralang tinutukoy ng mga ito.
