base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/002.yaml
  text: And Saul and the men of Israel gathered together and camped in the Valley of Elah[a], and they drew up for battle against the Philistines.
translation:
  language: tl
  text: At nagtipon si Saul at ang mga lalaki ng Israel at nagkampo sa Lambak ng Elah. Pumuwesto sila para sa labanan laban sa mga Filisteo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang harapin ang mga Filisteo” o “nakaharap sa mga Filisteo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאוּל
  choice: At ... si Saul
  rationale: Pinananatili ng “At” ang tuloy-tuloy na daloy ng salaysay na ipinahihiwatig ng pang-ugnay na Hebreo.
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: at ang mga tauhan ng Israel
  rationale: Kolektibo ang gamit ng isahang אִישׁ. Ang “mga tauhan” ay likas sa kontekstong militar at hindi kasing-interpretatibo ng “hukbo.”
- source_word: נֶאֶסְפוּ
  choice: nagtipon
  rationale: Malinaw at natural na ipinahahayag nito ang sama-samang pagtitipon o pagbuo ng puwersa.
- source_word: וַיַּחֲנוּ
  choice: nagkampo
  rationale: Karaniwang makabagong Filipino para sa pagtatayo o pananatili sa kampo.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: sa Lambak ng Elah
  rationale: Isinasalin ang pangheograpiyang katawagan na עֵמֶק bilang “Lambak” at pinananatili bilang transliterasyon ang pangalang Elah.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: Pumuwesto sila para sa labanan
  rationale: Ipinahahayag nito ang pag-aayos ng mga kawal sa pormasyon para sa labanan nang hindi gumagamit ng matigas na literal na parirala.
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: laban sa mga Filisteo
  rationale: Sa kontekstong militar, malinaw nitong ipinahahayag ang pagharap bilang mga kalaban, habang itinatala sa talababa ang mas literal na mga posibilidad.
