  to: Nang makita ni Saul si David na lumalabas upang salubungin ang Filisteo, sinabi niya kay Abner, na pinuno ng hukbo, “Anak nino ang binatang ito, Abner?” Sumagot si Abner, “Saksi ang inyong buhay,[a] O hari, hindi ko po alam.”
  rationale: Inilipat ang marker sa mismong pormula na ipinapaliwanag nito, pinalitan ang dagdag na maringal na “Mahal na Hari” ng mas tapat na “O hari,” at inayos ang pormula ng panunumpa sa likas na modernong Tagalog. Hindi binago ang kahulugan o ang antas ng katiyakan ng pinagmulan.
