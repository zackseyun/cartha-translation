    issue: Maling puwesto ang talababa.
    rationale: Ang talababa ay nagpapaliwanag sa pormula ng panunumpa (חֵי נַפְשְׁךָ), ngunit ang marker ay nakadikit sa “Hari,” na katumbas ng מֶלֶךְ. Dapat itong ilagay agad pagkatapos ng salin ng pormula ng panunumpa.
  - severity: low
    issue: Ang “Mahal na Hari” ay mas mataas na antas ng paggalang kaysa sa nasa pinagmulan.
    rationale: 'Simple lamang ang bokatibo sa Hebreo: “hari.” Ang “O hari” ay nagpapanatili ng marangal na pagtawag nang hindi nagdaragdag ng “mahal.”'
  - severity: low
    issue: Hindi ganap na natural ang “Sa buhay ninyo” bilang pormula ng panunumpa.
    rationale: Ang “Saksi ang inyong buhay” ay mas idiomatiko sa modernong Tagalog at malinaw na panunumpa, samantalang ang literal na larawan ay maipapaliwanag sa talababa.
