base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/055.yaml
  text: When Saul saw David going out to meet the Philistine[a], he said to Abner, the commander of the army, “Whose son is this young man, Abner?” And Abner said, “As your soul lives, O king, I do not know.”
translation:
  language: tl
  text: Nang makita ni Saul si David na lumalabas upang salubungin ang Filisteo, sinabi niya kay Abner, na pinuno ng hukbo, “Anak nino ang binatang ito, Abner?” Sumagot si Abner, “Saksi ang inyong buhay,[a] O hari, hindi ko po alam.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “Buhay ang inyong kaluluwa.” Isa itong pormula ng panunumpa sa Hebreo; ang diwa ay “Kasintiyak ng inyong buhay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִ/רְאוֹת
  choice: Nang makita
  rationale: Ang pangatnig kasama ng infinitive construct ay nagpapakilala ng sugnay na panahunan; likas sa modernong Tagalog ang “Nang makita.”
- source_word: יֹצֵא לִ/קְרַאת
  choice: lumalabas upang salubungin
  rationale: Pinananatili ng “lumalabas” ang nagpapatuloy na kilos ng participle, at ang “salubungin” ay angkop sa pagharap ni David sa kalaban nang hindi idinaragdag ang salitang “kampeon.”
- source_word: הַ/פְּלִשְׁתִּי
  choice: ang Filisteo
  rationale: Etnikong katawagan lamang ang nasa Hebreo; hindi idinagdag ang “kampeon,” kahit malinaw iyon sa mas malawak na konteksto.
- source_word: שַׂר הַ/צָּבָא
  choice: pinuno ng hukbo
  rationale: Malinaw at kasalukuyang katawagan ito para sa pinakamataas na opisyal na militar sa kontekstong ito.
- source_word: בֶּן מִי זֶה הַ/נַּעַר
  choice: Anak nino ang binatang ito
  rationale: Natural na tanong ito sa Tagalog at pinananatili ang tuon ng Hebreo sa ama o angkan ng binata. Ang “binata” ay mas angkop kaysa “batang lalaki” dahil kumikilos si David bilang mandirigma.
- source_word: חֵי נַפְשְׁ/ךָ
  choice: Sa buhay ninyo
  rationale: Pinananatili nito ang anyo ng panunumpang Hebreo sa maikli at mauunawaang Tagalog; ipinaliliwanag sa talababa ang literal na larawan at ang puwersa ng pormula.
- source_word: אִם יָדָעְתִּי
  choice: hindi ko po alam
  rationale: Sa pormula ng panunumpa, ang אִם ay eliptikong nagpapahayag ng mariing pagtanggi. Ang tahasang negatibo ang likas at malinaw sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may magalang at marangal na tono. Ginamit ang “po/ninyo” sa sagot ni Abner sa hari, at iniwasan ang arkaiko o labis na pormal na pananalita. Inilipat ang talababa sa mismong pormula ng panunumpa, na siyang tinutukoy ng nilalaman nito.
