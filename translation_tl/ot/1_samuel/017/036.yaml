revisions:
- from: Pinabagsak ng inyong lingkod kapuwa ang leon at ang oso, at ang Filisteong ito na hindi tuli ay magiging gaya ng isa sa kanila, sapagkat nilapastangan niya ang mga hanay sa labanan[a] ng Diyos na buhay.
  to: Pinabagsak ng inyong lingkod kapuwa ang leon at ang oso, at ang Filisteong ito na hindi tuli ay magiging gaya ng isa sa kanila, sapagkat hinamak niya ang mga hanay pandigma[a] ng buhay na Diyos.
  rationale: Pinalitan ang pandiwang tumutukoy sa paghamak upang mas malapit na maipahayag ang חרף, at pinasimple ang katumbas ng מַעַרְכֹת sa mas natural na Filipino nang hindi isinasantabi ang konkretong larawang militar. Inayos din ang ayos ng “buhay na Diyos” para sa likas na modernong gamit.
