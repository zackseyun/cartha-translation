  text: גַּ֧ם אֶֽת הָ/אֲרִ֛י גַּם הַ/דּ֖וֹב הִכָּ֣ה עַבְדֶּ֑/ךָ וְֽ֠/הָיָה הַ/פְּלִשְׁתִּ֨י הֶ/עָרֵ֤ל הַ/זֶּה֙ כְּ/אַחַ֣ד מֵ/הֶ֔ם כִּ֣י חֵרֵ֔ף מַעַרְכֹ֖ת אֱלֹהִ֥ים חַיִּֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/036.yaml
  text: Your servant struck down both the lion and the bear[a], and this uncircumcised Philistine will be like one of them, because he has defied the battle lines of the living God.
translation:
  language: tl
  text: Pinabagsak ng inyong lingkod kapuwa ang leon at ang oso, at ang Filisteong ito na hindi tuli ay magiging gaya ng isa sa kanila, sapagkat hinamak niya ang mga hanay pandigma[a] ng buhay na Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga hukbo ng buhay na Diyos.” Ang salitang Hebreo ay maaaring mangahulugang “mga hanay pandigma,” “mga hanay,” o, sa mas malawak na diwa, “mga hukbo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: pinabagsak
  rationale: Karaniwang nangangahulugan ang נכה ng paghampas o pagpapabagsak. Sa kontekstong ito, ipinahihiwatig ang paggapi sa mababangis na hayop nang hindi ginagawang mas tiyak kaysa sa mismong pandiwang Hebreo.
- source_word: עַבְדֶּךָ
  choice: inyong lingkod
  rationale: Magalang na pagtukoy ito ni David sa sarili habang nakikipag-usap kay Saul; ang “inyong” ay angkop sa makabagong magalang na Filipino.
- source_word: הָאֲרִי ... הַדּוֹב
  choice: ang leon at ang oso
  rationale: May pantukoy ang dalawang pangngalan sa Hebreo, at natural sa Filipino ang tiyak na anyong ito sa paggunita ni David sa mga hayop na nakaharap niya.
- source_word: וְהָיָה
  choice: ay magiging
  rationale: Panghinaharap ang gamit nito sa konteksto at nagpapahayag ng matibay na pagtitiwala ni David sa magiging kapalaran ng Filisteo.
- source_word: הֶעָרֵל
  choice: hindi tuli
  rationale: Pinananatili ang literal na pisikal at tipanang katawagan ng Hebreo sa halip na palitan ito ng paliwanag na gaya ng “wala sa tipan.”
- source_word: כְּאַחַד מֵהֶם
  choice: gaya ng isa sa kanila
  rationale: Pinananatili nito ang isahang distributibong paghahambing ng Filisteo sa leon at oso.
- source_word: חֵרֵף
  choice: nilapastangan
  rationale: Ipinahahayag ng חרף ang mapanghamak na paghamon o pag-alipusta. Ang “nilapastangan” ay natural at marangal na Filipino na nagpapanatili sa tindi ng paghamak.
- source_word: מַעַרְכֹת
  choice: mga hanay sa labanan
  rationale: Tumutukoy ang מערכה sa pagkakaayos o mga hanay para sa labanan. Pinananatili ng salin ang kongkretong larawang militar; inilalahad sa talababa ang posibleng mas malawak na saling “mga hukbo.”
- source_word: אֱלֹהִים חַיִּים
  choice: Diyos na buhay
  rationale: Karaniwang pahayag itong Hebreo na nagbibigay-diin na ang Diyos ay tunay at buháy, kaiba sa mga diyus-diyosan.
theological_decisions:
- issue: Tipanang bigat ng הֶעָרֵל sa paglalarawan ni David sa Filisteo
  choice: Panatilihin sa pangunahing teksto ang literal na “hindi tuli.”
  alternative: “Wala sa tipan” o “walang Diyos”
  rationale: Ginagamit ng Hebreo ang pisikal na tanda ng tipan bilang mapanuyang paglalarawan. Ang literal na salin ay nagpapanatili sa retorika at pahiwatig na teolohikal nang hindi nagdaragdag ng interpretasyon.
- issue: Kahulugan ng מַעַרְכֹת kaugnay ng Diyos
  choice: “mga hanay sa labanan”
  alternative: “mga hukbo” o “mga hanay”
  rationale: Malamang na tinutukoy nito ang mga pormasyong pandigma ng Israel bilang pag-aari ng Diyos na buhay. Pinananatili ng “mga hanay sa labanan” ang kongkretong larawang nasa Hebreo, habang kinikilala sa talababa ang ibang lehitimong salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magalang na “inyong lingkod” para sa pakikipag-usap ni David kay Saul. Iniwasan ang lipas na “di-tuli” pabor sa mas natural na “hindi tuli,” habang pinananatili ang tindi at tipanang pahiwatig ng orihinal.
