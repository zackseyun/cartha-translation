  source_fidelity: Tumpak na naihahatid ng draft ang paulit-ulit na pagpunta at pagbabalik ni David mula kay Saul, ang kaugnayan nito sa kawan ng kanyang ama, at ang lugar na Betlehem. Gayunman, ang “pastulan ang kawan” ay mas karaniwang nangangahulugang hayaang manginain o pakainin sa pastulan ang kawan; ang “magpastol ng kawan” ang mas tuwirang katumbas ng לִרְעוֹת sa kontekstong ito.
  naturalness: Likas ang “pabalik-balik” at ang kabuuang daloy ng pangungusap. Mas idiomatiko at mas tiyak sa modernong Filipino ang “magpastol ng kawan” kaysa “pastulan ang kawan.”
