translation:
  language: tl
  text: Si David ay pabalik-balik mula kay Saul upang magpastol ng kawan ng kanyang ama sa Betlehem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “Pumupunta at bumabalik si David mula kay Saul upang magpastol ng kawan ng kanyang ama sa Betlehem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹלֵךְ וָשָׁב
  choice: pabalik-balik
  rationale: Ipinahahayag ng magkatambal na anyong pandiwa ang paulit-ulit o nakaugaliang pagpunta at pagbabalik, hindi lamang isang biyahe. Likas at malinaw itong naihahatid ng “pabalik-balik” sa Filipino.
- source_word: מֵעַל שָׁאוּל
  choice: mula kay Saul
  rationale: Sa konteksto, tumutukoy ang parirala sa pag-alis mula sa piling o paglilingkod kay Saul. Pinananatili ng “mula kay Saul” ang maikli at bahagyang malabong anyo ng Hebreo nang hindi dinaragdagan ang kahulugan.
- source_word: לִרְעוֹת
  choice: upang pastulan
  rationale: Ang infinitibong רעה ay tumutukoy sa gawain ng isang pastol. Ang “pastulan” ay tuwiran at likas na pandiwang Filipino para sa pag-aalaga at pagpapakain sa kawan.
- source_word: צֹאן
  choice: kawan
  rationale: Ang צֹאן ay kolektibong katawagan sa maliliit na alagang hayop, karaniwang mga tupa at kambing. Ang “kawan” ay nagpapanatili sa kolektibong kahulugan nang hindi nililimitahan ito sa tupa lamang.
- source_word: אָבִיו
  choice: ng kanyang ama
  rationale: Likas na salin ito ng konstruktong nagpapahayag na ang kawan ay pag-aari ng ama ni David.
- source_word: בֵּית לָחֶם
  choice: Betlehem
  rationale: Karaniwang makabagong transliterasyon sa Filipino ng pangalang-pook na בֵּית לָחֶם.
- source_word: וְ
  choice: Si David ay
  rationale: Hindi isinalin bilang hiwalay na “at” o “ngayon” sapagkat gumaganap ito bilang payak na pang-ugnay sa daloy ng salaysay; hindi rin naglalaman ang Hebreo ng tahasang salitang nangangahulugang “ngayon.”
