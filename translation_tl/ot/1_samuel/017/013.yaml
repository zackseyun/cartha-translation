base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/013.yaml
  text: The three oldest sons of Jesse had gone after Saul to the battle. And the names of his three sons who had gone to the battle were Eliab the firstborn[a], his second Abinadab, and the third Shammah.
translation:
  language: tl
  text: Ang tatlong pinakamatandang anak ni Jesse ay sumama kay Saul sa labanan. Ang mga pangalan ng tatlo niyang anak na pumunta sa labanan ay si Eliab na panganay, si Abinadab na ikalawa, at si Shammah na ikatlo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ / הָלְכוּ
  choice: ay sumama / na pumunta
  rationale: Sa unang pangungusap, ang paglakad na אַחֲרֵי שָׁאוּל ay likas na nangangahulugang pagsama kay Saul sa kampanyang militar. Sa sugnay na umuulit, sapat at natural ang “pumunta.”
- source_word: שְׁלֹשֶׁת בְּנֵי יִשַׁי הַגְּדֹלִים
  choice: ang tatlong pinakamatandang anak ni Jesse
  rationale: Sa konteksto ng magkakapatid, ang הַגְּדֹלִים ay tumutukoy sa nakatatanda sa edad, hindi sa laki o katanyagan.
- source_word: אַחֲרֵי שָׁאוּל
  choice: sumama kay Saul
  rationale: Bagaman literal na “kasunod/sa likuran ni Saul,” ipinahihiwatig dito ng parirala ang pagsama o pagsunod sa kaniya sa kampanyang militar; “sumama kay Saul” ang pinakamalinaw at natural sa modernong Tagalog.
- source_word: לַמִּלְחָמָה / בַּמִּלְחָמָה
  choice: sa labanan
  rationale: Ang מִלְחָמָה ay maaaring “digmaan” o “labanan.” Ang tiyak na engkuwentro sa salaysay ay mas malinaw na naipapahayag ng “labanan.”
- source_word: וְשֵׁם
  choice: Ang mga pangalan ... ay
  rationale: Bagaman anyong isahan ang שֵׁם sa Hebreo, plural ang kasunod na talaan; natural sa Tagalog ang “mga pangalan.”
- source_word: בָּנָיו
  choice: tatlo niyang anak
  rationale: Ang hulaping panghalip ay tumutukoy kay Jesse. Nananatiling malinaw ang reperensiya sa Tagalog.
- source_word: הַבְּכוֹר
  choice: panganay
  rationale: Tumpak na katumbas ang “panganay” para sa katayuang pampamilya na ipinahahayag ng בְּכוֹר.
- source_word: וּמִשְׁנֵהוּ
  choice: na ikalawa
  rationale: Ipinapahayag nito ang ikalawang anak sa pagkakasunod-sunod pagkatapos ng panganay.
- source_word: וְהַשְּׁלִשִׁי
  choice: na ikatlo
  rationale: Pinananatili ang malinaw na ordinal na pagkakasunod-sunod ng tatlong magkakapatid.
- source_word: שַׁמָּה
  choice: Shamma
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo na שַׁמָּה.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “sumama kay Saul” sa halip na literal na “sumunod kay Saul” upang maiwasan ang posibleng di-sinasadyang diin sa pagsunod bilang awtoridad; nananatili ang diwa ng paglahok sa kampanyang militar. Walang footnote dahil walang mahalagang ambiguwidad na nangangailangan nito sa salin.
