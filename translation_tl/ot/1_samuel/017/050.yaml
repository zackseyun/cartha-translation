revisions:
- from: Kaya nanaig si David sa Filisteo sa pamamagitan ng panghilagpos at ng isang bato. Tinamaan niya ang Filisteo at pinatay ito, kahit walang tabak sa kamay ni David.[a]
  to: Kaya nanaig si David sa Filisteo sa pamamagitan ng panghilagpos at isang bato. Sinaktan niya ang Filisteo at pinatay niya ang Filisteo, kahit walang tabak sa kamay ni David.[a]
  rationale: Pinalitan ang “Tinamaan” ng “Sinaktan” upang mas tuwirang maipahayag ang וַיַּךְ nang hindi nagdaragdag ng detalye tungkol sa paraan ng pagtama. Inulit ang “ang Filisteo” upang maging malinaw at likas ang pantukoy sa taong pinatay. Inayos din ang instrumental na parirala upang magkatugma ang “panghilagpos” at “isang bato.”
