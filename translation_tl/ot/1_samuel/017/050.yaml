  - severity: low
    issue: Ang “pinatay ito” ay bahagyang di-likas para sa taong tinutukoy.
    rationale: Mas malinaw at mas marangal sa modernong Filipino ang muling pagtukoy sa “ang Filisteo,” lalo na sa isang salaysay na pampanitikan.
  revised_text: Kaya nanaig si David sa Filisteo sa pamamagitan ng panghilagpos at isang bato. Sinaktan niya ang Filisteo at pinatay niya ang Filisteo, kahit walang tabak sa kamay ni David.[a]
