translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “panghilagpos” upang tukuyin ang sinaunang sling nang hindi ito napagkakamalang tirador na may goma. Inilagay ang talababa pagkatapos ng buong sugnay na tinatalakay nito.
