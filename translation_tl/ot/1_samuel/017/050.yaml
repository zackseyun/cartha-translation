base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/050.yaml
  text: So David prevailed over the Philistine with a sling and with a stone; he struck the Philistine and killed him[a], though there was no sword in David’s hand.
translation:
  language: tl
  text: Kaya nanaig si David sa Filisteo sa pamamagitan ng panghilagpos at isang bato. Sinaktan niya ang Filisteo at pinatay niya ang Filisteo, kahit walang tabak sa kamay ni David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “at walang tabak sa kamay ni David.” Ang pang-ugnay sa Hebreo ay maaaring isalin nang mas pormal bilang payak na “at”; ginamit sa pangunahing teksto ang “kahit” upang maipakita ang konsesibong diwa ng sugnay ayon sa konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק דָּוִד מִן הַפְּלִשְׁתִּי
  choice: nanaig si David sa Filisteo
  rationale: Sa pagkakagamit na may מִן, ang חזק ay nangangahulugang naging higit na malakas o nanaig sa kalaban. Likas at malinaw sa modernong Tagalog ang “nanaig ... sa.”
- source_word: בַּקֶּלַע
  choice: sa pamamagitan ng panghilagpos
  rationale: Instrumental ang בְּ. Ang “panghilagpos” ay malinaw na tawag sa sandatang ginagamit upang maghagis ng bato, hindi sa laruan o tirador na may goma.
- source_word: וּבָאֶבֶן
  choice: at ng isang bato
  rationale: Instrumental din ang בְּ, at pinananatili ng “isang bato” ang isahan ng pangngalang Hebreo.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: Tinamaan niya ang Filisteo
  rationale: Sa konteksto ng batong inihagis, natural sa Tagalog ang “tinamaan” at tumpak nitong ipinahahayag ang matagumpay na paghampas o pagtama.
- source_word: וַיְמִיתֵהוּ
  choice: at pinatay ito
  rationale: Ang Hiphil ng מות ay tahasang nangangahulugang maging sanhi ng kamatayan o pumatay. Ang “ito” ay tumutukoy sa Filisteo at umiiwas sa di-likas na sunod-sunod na pag-uulit.
- source_word: וְחֶרֶב אֵין בְּיַד דָּוִד
  choice: kahit walang tabak sa kamay ni David
  rationale: 'Ang waw ay may kontekstuwal na diwang konsesibo: nagawa niya ito kahit wala siyang tabak. Pinananatili ang kongkretong larawang “sa kamay.”'
