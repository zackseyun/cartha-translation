base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/033.yaml
  text: Saul said to David[a], “You are not able to go against this Philistine to fight with him, because you are a youth[b], and he has been a man of war from his youth.”
translation:
  language: tl
  text: Sinabi ni Saul kay David, “Hindi mo kayang lumaban sa Filisteong ito, sapagkat binata ka pa[a], samantalang siya ay isang mandirigma mula pa sa kanyang kabataan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “kabataan” o, sa ilang konteksto, “batang lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: Hindi mo kayang
  rationale: Tuwirang ipinapahayag nito ang kawalan ng kakayahan, hindi isang pagbabawal lamang.
- source_word: לָלֶכֶת אֶל ... לְהִלָּחֵם עִמּוֹ
  choice: lumaban sa ...
  rationale: Sa kontekstong militar, ang paglapit laban sa Filisteo ay para makipaglaban; pinagsama ito sa natural at maikling Tagalog nang hindi nawawala ang diwa.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: Filisteong ito
  rationale: Natural na Tagalog para sa demonstratibong katawagang etniko.
- source_word: כִּי נַעַר אַתָּה
  choice: sapagkat binata ka pa
  rationale: Ang נַעַר ay maaaring tumukoy sa batang lalaki o kabataang lalaki. Ang “binata” ay angkop sa konteksto, at ang “pa” ay natural na naghahayag ng paghahambing sa bihasang kalaban.
- source_word: אִישׁ מִלְחָמָה
  choice: isang mandirigma
  rationale: Natural at marangal na katumbas ng Hebreong pariralang literal na “lalaki ng digmaan.”
- source_word: מִנְּעֻרָיו
  choice: mula pa sa kanyang kabataan
  rationale: 'Pinananatili ang duratibong diwa: naging bihasa siya sa pakikidigma simula noong bata pa siya.'
