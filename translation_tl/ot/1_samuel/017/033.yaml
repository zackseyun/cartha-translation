  source_fidelity: Tumpak ang pagsasalin ng kawalan ng kakayahan sa לֹא תוּכַל sa “Hindi mo kayang.” Ang “lumaban sa Filisteong ito” ay natural na Filipino at sapat na kumakatawan sa pagpunta laban sa Filisteo upang makipaglaban. Naipapahayag din nang wasto ang dahilan at ang pagkakaiba ng pagiging bata pa ni David at ng matagal nang karanasang pandigma ng Filisteo.
  naturalness: Malinaw, makabago, at marangal ang daloy. Natural ang “Filisteong ito,” “binata ka pa,” at “isang mandirigma mula pa sa kanyang kabataan.” Ang “samantalang” ay isang katanggap-tanggap na natural na paraan upang ilantad ang paghahambing na nasa konteksto, nang hindi binabago ang diwa.
  terminology: Wasto at pare-pareho ang mga pangalan at katawagang mahalaga. Ang “mandirigma” ay angkop na modernong katumbas ng אִישׁ מִלְחָמָה. Ang “binata” ay isang ligtas na kontekstuwal na pagsasalin ng נַעַר, at ang talababa ay maayos na nagsasaad ng saklaw na mga alternatibo.
