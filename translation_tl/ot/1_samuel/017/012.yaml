  naturalness: Malinaw ang karamihan, ngunit mas natural at mas malinaw sa modernong Filipino na ipakilala agad si Jesse bilang ama ni David. Ang pares na “matanda na ... at may edad na” ay nauunawaan ngunit bahagyang paulit-ulit; pinananatili ang diin sa edad sa mas maayos na anyo.
  terminology: Ang “Efrateo,” “Betlehem ng Juda,” “Jesse,” at “Saul” ay angkop. Ang talababa ay dapat maging mas maingat sa literal na larawan ng mahirap na Hebreong idyoma at huwag ipakahulugang literal na “sa gitna ng mga lalaki.”
