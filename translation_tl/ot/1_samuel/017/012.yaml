revisions:
- from: Si David ay anak ng isang Efrateo mula sa Betlehem ng Juda, na ang pangalan ay Jesse at may walong anak na lalaki. Noong panahon ni Saul, matanda na ang lalaking iyon at may edad na.[a]
  to: Si David ay anak ni Jesse, isang Efrateo mula sa Betlehem ng Juda, at may walong anak na lalaki si Jesse. Noong panahon ni Saul, matanda na ang lalaking iyon at malayo na ang narating sa edad.[a]
  rationale: Inayos ang unang pangungusap upang malinaw na si Jesse ang ama ni David at siyang may walong anak na lalaki. Pinahusay ang huling idyoma upang maging natural sa Filipino habang pinananatili ang kahulugang “matanda, malayo na sa edad,” at inayos ang talababa upang ilarawan nang maingat ang mahirap na Hebreong parirala.
