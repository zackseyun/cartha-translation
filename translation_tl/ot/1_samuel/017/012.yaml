base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/012.yaml
  text: David was the son of an Ephrathite from Bethlehem of Judah[a], whose name was Jesse, and he had eight sons. In the days of Saul, the man was old, advanced in years.
translation:
  language: tl
  text: Si David ay anak ni Jesse, isang Efrateo mula sa Betlehem ng Juda, at may walong anak na lalaki si Jesse. Noong panahon ni Saul, matanda na ang lalaking iyon at malayo na ang narating sa edad.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi pangkaraniwan ang Hebreong pahayag; literal, “matanda, dumating/nakarating sa mga tao.” Karaniwan itong nauunawaan na tumutukoy sa pagiging malayo na sa edad.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: Efrateo
  rationale: Sa konteksto ng Betlehem ng Juda, tumutukoy ito sa isang taga-Efrata/Betlehem, hindi sa isang kasapi ng lipi ni Efraim. Pinananatili ng “Efrateo” ang heograpikong katawagan.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: mula sa Betlehem ng Juda
  rationale: Tuwirang salin ng heograpikong parirala at naipag-iiba ang Betlehem na ito sa ibang lugar na may gayunding pangalan.
- source_word: וּשְׁמוֹ יִשַׁי
  choice: na ang pangalan ay Jesse
  rationale: Natural na Filipino na nagpapanatili sa tungkuling kumilala sa lalaki.
- source_word: וְלוֹ שְׁמֹנָה בָנִים
  choice: at may walong anak na lalaki
  rationale: Idyomatikong pagpapahayag ng pag-aari sa Filipino; malinaw na mga anak na lalaki ang tinutukoy.
- source_word: בִּימֵי שָׁאוּל
  choice: Noong panahon ni Saul
  rationale: Natural at malinaw na modernong Filipino para sa Hebreong temporal na idyoma.
- source_word: וְהָאִישׁ
  choice: ang lalaking iyon
  rationale: Tumutukoy pabalik kay Jesse at pinananatili ang pag-uulit ng Hebreong “ang lalaki” nang malinaw sa Filipino.
- source_word: זָקֵן בָּא בַאֲנָשִׁים
  choice: matanda na ... at may edad na
  rationale: Ipinahahayag ang karaniwang pagkaunawa na lubhang matanda na si Jesse, habang inilalagay sa talababa ang di-pangkaraniwang literal na larawan ng Hebreo.
