base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/039.yaml
  text: And David strapped his sword over his armor and tried to go[a], for he had not tested them. But David said to Saul, “I cannot go with these[b], for I have not tested them.” So David removed them from himself.
translation:
  language: tl
  text: Ibinigkis ni David ang kanyang espada sa ibabaw ng kanyang baluti at sinubukang lumakad[a], sapagkat hindi pa niya nasusubukan ang mga iyon. Ngunit sinabi ni David kay Saul, “Hindi ako makalalakad na suot ang mga ito[b], sapagkat hindi ko pa nasusubukan ang mga ito.” Kaya hinubad ni David ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at nagtangkang lumakad”; ang pandiwang Hebreo ay maaaring mangahulugang nagsimulang gawin, nangahas, o nagtangkang gawin ang isang bagay.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang isinaling “baluti” ay maaari ring mangahulugang mga kasuotan, ngunit sa kontekstong militar dito ay tumutukoy ito sa baluti at kagamitang pandigma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְגֹּר
  choice: Ibinigkis
  rationale: Ang חגר ay tumutukoy sa pagtatali o pagkakabit ng sandata sa katawan. Ang “ibinigkis” ay likas at marangal na Filipino para sa pagkakabit ng espada.
- source_word: חַרְבּוֹ
  choice: ang kanyang espada
  rationale: Tuwirang katumbas ng חֶרֶב na may hulaping ikatlong panauhang panlalaki.
- source_word: מֵעַל לְמַדָּיו
  choice: sa ibabaw ng kanyang baluti
  rationale: Bagaman maaaring tumukoy ang לְמַדִּים sa kasuotan, ipinapakita ng kontekstong militar at ng naunang talata na baluti ni Saul ang suot ni David.
- source_word: וַיֹּאֶל לָלֶכֶת
  choice: at sinubukang lumakad
  rationale: Ang יאל na may pawatas ay maaaring mangahulugang nagsimulang magsagawa, nangahas, o nagtangkang gumawa. Dito, ang pagsubok ni David na kumilos habang suot ang kagamitan ang pinakanaaayon sa daloy ng salaysay.
- source_word: כִּי לֹא נִסָּה
  choice: sapagkat hindi pa niya nasusubukan ang mga iyon
  rationale: Ang Piel ng נסה ay nangangahulugang sumubok o subukin. Ang tahasang “mga iyon” ay tumutukoy sa kagamitang binanggit, bagaman pahiwatig lamang ang layon sa Hebreo.
- source_word: לֹא אוּכַל לָלֶכֶת בָּאֵלֶּה
  choice: Hindi ako makalalakad na suot ang mga ito
  rationale: Ang בָּאֵלֶּה ay tumutukoy sa suot na baluti at kagamitan. Nililinaw ng “na suot” ang ugnayan nang hindi nililimitahan ang paglakad sa karaniwang paglalakad lamang.
- source_word: לֹא נִסִּיתִי
  choice: hindi ko pa nasusubukan ang mga ito
  rationale: Pinananatili nito ang parehong saligang kahulugan ng נסה at ang pag-uulit sa naunang sugnay.
- source_word: וַיְסִרֵם ... מֵעָלָיו
  choice: hinubad ni David ang mga iyon
  rationale: Ang Hiphil ng סור dito ay pag-aalis ng mga bagay mula sa sarili. Natural sa Filipino ang “hinubad” para sa baluti at kagamitang suot.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “baluti” dahil sa agarang kontekstong militar, at ang “hinubad” bilang natural na paglalarawan sa pag-aalis ng kagamitang suot. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
