  text: הַ/יּ֣וֹם הַ/זֶּ֡ה יְסַגֶּרְ/ךָ֩ יְהוָ֨ה בְּ/יָדִ֜/י וְ/הִכִּיתִ֗/ךָ וַ/הֲסִרֹתִ֤י אֶת רֹֽאשְׁ/ךָ֙ מֵ/עָלֶ֔י/ךָ וְ/נָ֨תַתִּ֜י פֶּ֣גֶר מַחֲנֵ֤ה פְלִשְׁתִּים֙ הַ/יּ֣וֹם הַ/זֶּ֔ה לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/חַיַּ֣ת הָ/אָ֑רֶץ וְ/יֵֽדְעוּ֙ כָּל הָ/אָ֔רֶץ כִּ֛י יֵ֥שׁ אֱלֹהִ֖ים לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/046.yaml
  text: This day Yahweh will deliver you into my hand[a], and I will strike you down and remove your head from you. And this day I will give the corpses of the Philistine camp to the birds of the sky and to the wild animals of the earth, so that all the earth may know that there is a God for Israel.
translation:
  language: tl
  text: Sa araw na ito, ibibigay ka ni Yahweh sa aking kamay, at pababagsakin kita at aalisin ko ang ulo mo mula sa katawan mo. At sa araw ding ito, ibibigay ko ang mga bangkay ng kampo ng mga Filisteo sa mga ibon sa langit at sa mababangis na hayop sa lupa, upang malaman ng buong daigdig na may Diyos para sa Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “na may Diyos sa Israel.” Literal na mababasa sa Hebreo, “para sa Israel,” na maaari ring magpahiwatig ng kaugnayang tipan o pagtataguyod para sa Israel.
    reason: alternative_reading
lexical_decisions:
- source_word: יְסַגֶּרְךָ ... בְּיָדִי
  choice: ibibigay ka ... sa aking kamay
  rationale: Ang Hiphil ng סגר sa kontekstong ito ay nangangahulugang ibigay ang isang tao sa kapangyarihan ng iba. Pinananatili ng salin ang larawang Hebreo ng paglalagay sa kamay ng kalaban.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang Yahweh, hindi pinalitan ng isang titulo.
- source_word: וְהִכִּיתִךָ
  choice: pababagsakin kita
  rationale: Maaaring mangahulugan ang נכה ng hampasin o patayin. Ang “pababagsakin” ay natural sa tagpong labanan at nagpapahiwatig ng kamatayan nang hindi ginagawang mas tahasan kaysa sa pandiwang Hebreo.
- source_word: וַהֲסִרֹתִי אֶת־רֹאשְׁךָ מֵעָלֶיךָ
  choice: aalisin ko ang ulo mo sa iyo
  rationale: Ginagamit ng Hebreo ang סור, “alisin,” sa halip na isang tahasang pandiwa para sa pagputol. Pinananatili rito ang kakaiba ngunit malinaw na larawan ng orihinal.
- source_word: פֶּגֶר מַחֲנֵה פְלִשְׁתִּים
  choice: mga bangkay ng kampo ng mga Filisteo
  rationale: Bagaman isahan ang פֶּגֶר sa anyo, kolektibo ang gamit nito sa konteksto. Ang “kampo” ay tuwirang kumakatawan sa מחנה at tumutukoy sa nakahimpil na hukbo.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: sa mga ibon sa langit
  rationale: Natural na modernong Tagalog ito para sa karaniwang pariralang Hebreo at pinananatili ang larawang pangkalangitan.
- source_word: וּלְחַיַּת הָאָרֶץ
  choice: sa mababangis na hayop sa lupa
  rationale: Sa tambalang ito, tumutukoy ang חיה sa mga mailap o mababangis na hayop sa lupa.
- source_word: וְיֵדְעוּ כָּל־הָאָרֶץ
  choice: upang malaman ng buong daigdig
  rationale: Ipinahahayag ng waw at imperfect ang nilalayong bunga sa daloy ng pahayag. Pinananatili ng “buong daigdig” ang malawak na retorikal na saklaw ng כל הארץ.
- source_word: כִּי יֵשׁ אֱלֹהִים לְיִשְׂרָאֵל
  choice: na may Diyos para sa Israel
  rationale: Pinananatili ng “para sa Israel” ang karaniwang halaga ng pang-ukol na ל at ang posibleng diwa ng kaugnayan o pagtataguyod, sa halip na tahimik itong gawing lokatibo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang transliterasyong “Yahweh” ang nagpapanatili rito sa halip na palitan ito ng titulo.
- issue: Kahulugan ng לְיִשְׂרָאֵל
  choice: may Diyos para sa Israel
  alternative: may Diyos sa Israel; may Diyos ang Israel
  rationale: Maaaring ipahayag ng ל ang kaugnayan o pag-aari, samantalang ang tradisyonal na lokatibong pagbasa ay “sa Israel.” Pinanatili sa pangunahing teksto ang mas tuwirang “para sa Israel” at inilagay sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang marahas at matapang na himig ng pahayag ni David, gayundin ang ilang konkretong larawang Hebreo, nang hindi dinaragdagan ang tahasang detalye ng orihinal.
