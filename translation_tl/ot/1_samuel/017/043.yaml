  to: Sinabi ng Filisteo kay David, “Aso ba ako at lumalapit ka sa akin na may mga pamalo[a]?” At isinumpa ng Filisteo si David sa pamamagitan ng kanyang mga diyos.[b]
  rationale: 'Inayos ang salin upang maging mas tuwiran sa Hebreo at mas likas sa modernong Tagalog: inalis ang di-kinakailangang ideya ng “pagdadala,” ginawang mas neutral ang ugnayan ng retorikal na tanong, at ginamit ang instrumental na parirala para sa pagsumpa sa pamamagitan ng mga diyos ng Filisteo. Napanatili ang plural na pangunahing salin at ang alternatibong singular sa talababa.'
