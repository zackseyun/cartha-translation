base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/043.yaml
  text: And the Philistine said to David[a], “Am I a dog[b], that you come to me with sticks?” And the Philistine cursed David by his gods.
translation:
  language: tl
  text: Sinabi ng Filisteo kay David, “Aso ba ako at lumalapit ka sa akin na may mga pamalo[a]?” At isinumpa ng Filisteo si David sa pamamagitan ng kanyang mga diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tungkod” o “mga patpat.” Malawak ang saklaw ng salitang Hebreo at maaaring tumukoy sa pamalo, tungkod, o patpat; dito ay nagpapahayag ito ng paghamak ng Filisteo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa ngalan ng kanyang mga diyos” o “sa kanyang diyos.” Ang anyong Hebreo ay karaniwang inuunawa bilang plural sa kontekstong Filisteo, bagaman posible rin ang singular na pagbasa.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: ang Filisteo
  rationale: Tinutukoy ng pangngalan ang etnikong pagkakakilanlan ni Goliat; hindi na kailangang idagdag ang ‘mandirigma,’ na wala sa mismong parirala.
- source_word: הֲכֶלֶב אָנֹכִי
  choice: Aso ba ako
  rationale: Pinananatili ang literal at mahalagang larawan ng aso sa retorikal na tanong na nagpapahayag ng pagkagalit at paghamak.
- source_word: כִּי אַתָּה בָא אֵלַי
  choice: kaya lumalapit ka sa akin
  rationale: Sa kontekstong ito, ipinakikita ng כִּי ang batayan ng retorikal na tanong. Likas sa modernong Tagalog ang ‘kaya,’ at ang ‘lumalapit’ ay naghahatid ng kasalukuyan at papalapit na kilos.
- source_word: בַּמַּקְלוֹת
  choice: na may dalang mga pamalo
  rationale: Ang מַקֵּל ay maaaring pamalo, tungkod, o patpat. Ang ‘mga pamalo’ ay natural, maramihan, at nagpapanatili sa mapanlibak na paglalarawan ng Filisteo nang hindi ginagawang tiyak na sandata ang mga ito.
- source_word: וַיְקַלֵּל
  choice: isinumpa
  rationale: Ang pandiwa ay tumutukoy sa pagsambit o pagtawag ng sumpa, hindi lamang sa pang-iinsulto.
- source_word: בֵּאלֹהָיו
  choice: sa ngalan ng mga diyos nito
  rationale: Ipinahihiwatig ng preposisyong בְּ na ginamit o tinawagan ng Filisteo ang kaniyang mga diyos sa pagsumpa. Ang ‘nito’ ay malinaw na tumutukoy sa Filisteo at umiiwas sa kalituhan kung kaninong mga diyos ang tinutukoy.
theological_decisions:
- issue: Bilang ng אֱלֹהִים na may hulaping ikatlong panauhang panlalaki sa kontekstong Filisteo
  choice: mga diyos nito
  alternative: diyos nito
  rationale: Bagaman maaaring singular ang אֱלֹהִים sa ibang konteksto, natural dito ang plural dahil ang nagsasalita ay Filisteo. Gayunman, tunay na ambiguwidad sa anyong Hebreo ang singular o plural kaya itinatala ang alternatibo sa talababa.
- issue: Lakas ng relihiyosong diwa ng וַיְקַלֵּל
  choice: isinumpa
  alternative: nilait
  rationale: Mas tumpak ang ‘isinumpa’ sapagkat ang kasunod na pariralang tumutukoy sa mga diyos ay nagpapakitang ritwal o relihiyosong sumpa ito, hindi lamang pandiwang paghamak.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang ‘Filisteo,’ ‘pamalo,’ at ‘isinumpa’ bilang mga salitang madaling maunawaan ngunit angkop sa salaysay. Ang panghalip na ‘nito’ ay sadyang ginamit upang malinaw na ang tinutukoy ay ang mga diyos ng Filisteo.
