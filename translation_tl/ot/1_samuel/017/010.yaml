base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/010.yaml
  text: Then the Philistine said[a], “I have defied the ranks of Israel this day. Give me a man[c][b], and let us fight together.”
translation:
  language: tl
  text: Sinabi pa ng Filisteo, “Hinamon ko nang may paghamak[a] ang mga hanay[b] ng Israel sa araw na ito.[c] Bigyan ninyo ako ng isang lalaki, at maglaban kami!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “inalipusta,” “tinuya,” o “hinamak.” Sa konteksto, ang pandiwa ay nagpapahiwatig ng mapanghamong paghamak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga linya ng labanan ng Israel” o, sa mas malawak na diwa, “mga hukbo ng Israel.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sa araw na ito”; maaari ring “ngayon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: ang Filisteo
  rationale: Tinutukoy ng pangngalang may pantukoy si Goliat ayon sa kaniyang bayan; hindi idinaragdag ang ‘mandirigma’ o ‘kampeon,’ na wala sa mismong salita.
- source_word: חֵרַפְתִּי
  choice: Hinamak ko
  rationale: Sa hamong militar na ito, ipinahahayag ng pandiwa ang hayagang paglapastangan at paghamon. Likas at marangal sa modernong Filipino ang ‘hinamak,’ habang pinananatili ang bigat ng insulto.
- source_word: מַעַרְכוֹת
  choice: mga hanay
  rationale: Ang maramihang anyo ay tumutukoy sa mga nakahanay na pangkat o linya para sa labanan; mas tiyak ito kaysa sa pangkalahatang ‘hukbo.’
- source_word: הַיּוֹם הַזֶּה
  choice: ngayon
  rationale: Likas na katumbas sa Filipino ng idiomatikong ‘sa araw na ito,’ at napapanatili ang agarang diin sa kasalukuyang hamon.
- source_word: תְּנוּ לִי אִישׁ
  choice: Bigyan ninyo ako ng isang lalaki
  rationale: Pinananatili ang tuwiran at mapanghamong anyo ng Hebreo. Ang ‘isang lalaki’ ay tumutukoy sa lalaking lalaban bilang kinatawan.
- source_word: וְנִלָּחֲמָה
  choice: at maglaban kami
  rationale: Ipinahahayag ng cohortative ang paanyayang-hamon. Sa Filipino, ang ‘maglaban kami’ ay natural na naghahatid ng kusang mungkahing lumaban silang dalawa.
- source_word: יָחַד
  choice: maglaban kami
  rationale: Sa konteksto, ang יָחַד ay nagpapahiwatig ng pakikipaglaban sa isa’t isa. Nakasama na ang diwang ito sa idiomatikong ‘maglaban kami,’ kaya hindi na kailangan ang alanganing literal na ‘nang magkasama.’
