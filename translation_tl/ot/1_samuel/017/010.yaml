translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang maigting na tinig ng hamong militar at ang tiyak na larawan ng mga hanay ng Israel, nang hindi nagdaragdag ng titulong ‘kampeon.’
