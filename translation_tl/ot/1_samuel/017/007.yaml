translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang 'puluhan,' 'biga ng habihan,' at 'kalasag' upang mapanatili ang kongkretong paglalarawan ng Hebreo nang hindi nagiging lipas o labis na teknikal. Inilipat ang talababa sa 'kalasag,' ang salitang aktuwal na tinutukoy ng leksikal na paliwanag.
