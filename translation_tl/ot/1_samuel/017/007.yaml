  text: The shaft of his spear was like a weaver’s beam[a], and the iron head of his spear weighed six hundred shekels; and the bearer of the shield went before him.
translation:
  language: tl
  text: Ang baras ng kanyang sibat ay parang biga ng habihan, at ang bakal na ulo ng kanyang sibat ay may bigat na animnaraang siklo. Nauuna sa kanya ang tagapagdala ng kalasag[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring tumukoy sa isang malaking kalasag na tumatakip sa katawan, hindi lamang sa mas maliit na panangga.
    reason: lexical_alternative
lexical_decisions:
- source_word: חץ חניתו
  choice: ang puluhan ng kanyang sibat
  rationale: Sa konteksto ng paghahambing sa biga ng habihan, ang חץ ay tumutukoy sa mahabang puluhan o katawan ng sibat, hindi sa isang palaso.
- source_word: כמנור ארגים
  choice: parang biga ng habihan
  rationale: Pinananatili nito ang konkretong larawan ng makapal at mabigat na bigang ginagamit sa paghahabi, sa natural na modernong Tagalog.
- source_word: להבת חניתו
  choice: ang bakal na talim ng kanyang sibat
  rationale: Ang להבת ay literal na talim o bahaging parang apoy ang hugis; sa konteksto, ito ang matalim na bakal na ulo ng sibat. Ang 'talim' ay maikli at likas sa Tagalog.
- source_word: שש מאות שקלים ברזל
  choice: may bigat na animnaraang siklo
  rationale: Eliptiko ang Hebreo, kaya tahasang idinagdag ang 'may bigat' upang maging malinaw. Pinananatili ang sinaunang yunit na siklo sa halip na magbigay ng tiyak ngunit pinagtatalunang modernong katumbas.
- source_word: נשא הצנה
  choice: tagapagdala ng kalasag
  rationale: Tuwirang inilalarawan nito ang tauhang may dalang kalasag ni Goliat at natural itong pakinggan sa Tagalog.
- source_word: צנה
  choice: kalasag
  rationale: Ang karaniwang salin ay 'kalasag'; inilalagay sa talababa ang mas tiyak na diwang maaari itong tumukoy sa malaking kalasag na tumatakip sa katawan.
- source_word: הלך לפניו
  choice: nauuna sa kanya
  rationale: Ipinahahayag ng pariralang participyal na ang tagapagdala ng kalasag ay naglalakad sa harap niya; natural at maikli ang 'nauuna sa kanya'.
