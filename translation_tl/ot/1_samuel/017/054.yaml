source:
  edition: WLC
  text: וַ/יִּקַּ֤ח דָּוִד֙ אֶת רֹ֣אשׁ הַ/פְּלִשְׁתִּ֔י וַ/יְבִאֵ֖/הוּ יְרוּשָׁלִָ֑ם וְ/אֶת כֵּלָ֖י/ו שָׂ֥ם בְּ/אָהֳלֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/054.yaml
  text: David took the head of the Philistine and brought it to Jerusalem[b][a], and he put his weapons in his tent.
translation:
  language: tl
  text: Kinuha ni David ang ulo ng Filisteo at dinala iyon sa Jerusalem[b], at inilagay niya sa kanyang tolda ang mga sandata nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kagamitan nito” o “mga kagamitang pandigma nito.” Malawak ang salitang Hebreo at maaaring tumukoy sa mga sandata, baluti, o iba pang gamit.
    reason: lexical_alternative
  - marker: b
    text: Nakikita ng ilang mambabasa rito ang isang tensiyong kronolohikal, sapagkat sa bahaging ito ng salaysay ay hindi pa ganap na nasasakop ng Israel ang Jerusalem. Pinananatili ng salin ang mismong pagkakasabi ng Hebreo sa halip na pagtugmain ito sa ibang detalye ng salaysay.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kinuha
  rationale: Karaniwang pandiwang pasalaysay ng לקח; natural at tuwirang katumbas sa Filipino.
- source_word: רֹאשׁ
  choice: ulo
  rationale: Literal na bahagi ng katawan ang malinaw na tinutukoy matapos mapatay ang Filisteo.
- source_word: הַפְּלִשְׁתִּי
  choice: ang Filisteo
  rationale: Pang-etnikong katawagang ginamit bilang pangngalan para kay Goliat; likas sa Filipino ang anyong ito.
- source_word: וַיְבִאֵהוּ
  choice: dinala iyon
  rationale: Ang hulaping panlalaki sa Hebreo ay tumutukoy sa רֹאשׁ, na panlalaking pangngalan; ginagamit ang “iyon” sa Filipino para sa pinutol na ulo.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lugar sa modernong Filipino.
- source_word: כֵּלָיו
  choice: mga sandata nito
  rationale: Malawak ang כְּלִי at maaaring tumukoy sa mga gamit, kagamitan, baluti, o sandata. Sa konteksto ng labanan, malinaw na kagamitang pandigma ng Filisteo ang tinutukoy; nililinaw ng “nito” na sa Filisteo ang mga iyon.
- source_word: שָׂם
  choice: inilagay
  rationale: Natural at dignified na Filipino para sa payak na kilos ng paglalagay.
- source_word: בְּאָהֳלוֹ
  choice: sa kanyang tolda
  rationale: Karaniwang kahulugan ng אָהֶל ang “tolda.” Pinananatili ng “kanyang” ang pormal na kalabuan ng hulaping paari, bagaman si David ang pinakaangkop na tinutukoy ayon sa konteksto.
theological_decisions:
- issue: Tinutukoy ng mga hulaping paari sa huling sugnay
  choice: Ang mga kagamitan ay sa Filisteo, samantalang ang tolda ay pinakamalamang na kay David.
  alternative: Maaaring ipakahulugang kay David ang kapuwa kagamitan at tolda, o isang pangkomunidad o toldang panghukbo ang tinutukoy.
  rationale: Mga tropeo mula kay Goliat ang paksa ng konteksto. Ginawang malinaw ng “mga sandata nito” na sa Filisteo ang kagamitan, ngunit pinanatili ng “kanyang tolda” ang likas na anyo at bahagyang kalabuan ng Hebreo.
- issue: Posibleng tensiyong kronolohikal sa pagdadala sa Jerusalem
  choice: Tuwirang isinalin bilang “dinala iyon sa Jerusalem.”
  alternative: “Dadalhin niya iyon sa Jerusalem sa kalaunan” o “dinala iyon patungo sa Jerusalem.”
  rationale: Tuwirang inilalahad ng tekstong Hebreo ang kilos. Hindi dinagdagan ng paliwanag o paghaharmonya ang pangunahing teksto; ang posibleng tensiyon ay ipinaalam sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Filisteo” at “tolda” bilang karaniwang biblikal ngunit madaling maunawaang mga salita. Inayos ang huling sugnay bilang “inilagay niya sa kanyang tolda ang mga sandata nito” upang malinaw sa Filipino na ang mga sandata ay sa Filisteo samantalang ang tolda ay kay David, nang hindi nagdaragdag ng di-nasa-tekstong pagtutol o paghaharmonya.
