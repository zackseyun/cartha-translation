revisions:
- from: Sinabi ng mga Israelita, “Nakikita ba ninyo ang lalaking ito na umaahon? Umaahon siya upang hamunin ang Israel. Ang sinumang makapagpabagsak sa kanya ay pagkakalooban ng hari ng napakalaking kayamanan, ibibigay sa kanya ang anak na babae ng hari, at palalayain sa mga pananagutan ang sambahayan ng kanyang ama sa Israel.”[a]
  to: Sinabi ng mga Israelita, “Nakita ba ninyo ang lalaking ito na umaahon? Umaahon siya upang hamunin ang Israel. Ang sinumang makapagpabagsak sa kanya ay pagyayamanin ng hari sa pamamagitan ng malaking kayamanan; ibibigay ng hari sa kanya ang kanyang anak na babae, at gagawin niyang malaya sa Israel ang sambahayan ng ama ng taong iyon.”[a]
