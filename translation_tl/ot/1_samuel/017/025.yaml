  text: וַ/יֹּ֣אמֶר אִ֣ישׁ יִשְׂרָאֵ֗ל הַ/רְּאִיתֶם֙ הָ/אִ֤ישׁ הָֽ/עֹלֶה֙ הַ/זֶּ֔ה כִּ֛י לְ/חָרֵ֥ף אֶת יִשְׂרָאֵ֖ל עֹלֶ֑ה וְֽ֠/הָיָה הָ/אִ֨ישׁ אֲשֶׁר יַכֶּ֜/נּוּ יַעְשְׁרֶ֥/נּוּ הַ/מֶּ֣לֶךְ עֹ֣שֶׁר גָּד֗וֹל וְ/אֶת בִּתּ/וֹ֙ יִתֶּן ל֔/וֹ וְ/אֵת֙ בֵּ֣ית אָבִ֔י/ו יַעֲשֶׂ֥ה חָפְשִׁ֖י בְּ/יִשְׂרָאֵֽל׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/025.yaml
  text: And the men of Israel said[a], “Have you seen this man who is coming up? Surely he is coming up to defy Israel. And it shall be that the man who strikes him down, the king will enrich him with great riches, and will give him his daughter, and will make his father’s house free in Israel.”
translation:
  language: tl
  text: Sinabi ng mga Israelita, “Nakita ba ninyo ang lalaking ito na umaahon? Umaahon siya upang hamunin ang Israel. Ang sinumang makapagpabagsak sa kanya ay pagyayamanin ng hari sa pamamagitan ng malaking kayamanan; ibibigay ng hari sa kanya ang kanyang anak na babae, at gagawin niyang malaya sa Israel ang sambahayan ng ama ng taong iyon.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palalayain sa mga pananagutan sa Israel ang sambahayan ng ama ng taong iyon.” Malamang na tumutukoy ito sa eksempsyon mula sa mga buwis o iba pang obligasyong paglilingkod sa hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman morpolohikal na isahan ang אִישׁ, kolektibo o pangkalahatan ang gamit nito sa konteksto ng mga kawal na nag-uusap; natural itong ipinahahayag sa maramihan sa Tagalog.
- source_word: הַרְּאִיתֶם
  choice: Nakikita ba ninyo
  rationale: Ang ikalawang panauhang maramihan at patanong na anyo ay tumutukoy sa lalaking kasalukuyang nasa tanaw; ang kasalukuyang aspekto ay natural sa usapang Tagalog.
- source_word: הָאִישׁ הָעֹלֶה הַזֶּה
  choice: ang lalaking ito na umaahon
  rationale: Pinananatili ng “umaahon” ang nagpapatuloy na kilos ng participle עֹלֶה at ang galaw ni Goliat mula sa kanyang kinalalagyan.
- source_word: כִּי לְחָרֵף אֶת יִשְׂרָאֵל עֹלֶה
  choice: Umaahon siya upang hamunin ang Israel
  rationale: Dito ay nagbibigay ang כִּי ng mariing paliwanag, na likas na naipahahayag sa Tagalog bilang hiwalay na pahayag; ang חרף ay pampublikong mapanghamak na paghamon.
- source_word: יַכֶּנּוּ
  choice: makapagpabagsak sa kanya
  rationale: Sinasaklaw nito ang diwa ng נכה na hampasin o pabagsakin nang hindi tahasang nililimitahan ang kahulugan sa “patayin.”
- source_word: יַעְשְׁרֶנּוּ ... עֹשֶׁר גָּדוֹל
  choice: pagkakalooban ... ng napakalaking kayamanan
  rationale: Natural sa modernong Tagalog at pinananatili ang matinding diin ng pandiwa at kaugnay na pangngalang Hebreo tungkol sa pagpapayaman.
- source_word: בֵּית אָבִיו
  choice: sambahayan ng kanyang ama
  rationale: Mas malinaw kaysa literal na “bahay ng kanyang ama” na ang tinutukoy ay ang mas malawak na pamilya o sambahayang paternal.
- source_word: יַעֲשֶׂה חָפְשִׁי בְּיִשְׂרָאֵל
  choice: palalayain sa mga pananagutan ... sa Israel
  rationale: Ipinahahayag ang malamang na administratibong diwa ng חָפְשִׁי habang hindi tinutukoy nang labis kung buwis, sapilitang paglilingkod, o iba pang tungkulin ang eksaktong saklaw.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga Israelita” para sa kolektibong tagapagsalita, “umaahon” upang mapanatili ang kilos ng participle, at “sambahayan” para sa malawak na kahulugan ng paternal household. Inilagay ang marker na [a] sa pangunahing teksto.
