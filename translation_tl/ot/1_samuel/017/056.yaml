translation_notes:
  register: Makabagong Filipino na may dignidad at likas na daloy. Pinanatili ang titulong “hari,” ang diin sa tahasang אַתָּה sa pamamagitan ng “Ikaw mismo,” at ang payak na utos na magtanong. Hindi kailangan ang talababa sapagkat sapat na naihahayag sa pangunahing teksto ang leksikal na saklaw.
