  text: And the king said[a], “You, inquire whose son this young man is.”
translation:
  language: tl
  text: At sinabi ng hari, “Ikaw mismo ang magtanong kung kaninong anak ang binatang ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa Filipino ang “At sinabi” at hindi nito dinaragdagan ang ugnayang pangdiskurso.
- source_word: הַמֶּלֶךְ
  choice: ng hari
  rationale: Tiyak ang pangngalan dahil sa artikulo. Pinanatili ang titulong ginamit ng Hebreo sa halip na tukuyin siya bilang Saul.
- source_word: שְׁאַל
  choice: magtanong
  rationale: Ang pautos na anyo ng שׁאל ay nangangahulugang magtanong o magsiyasat. Ang “magtanong” ang tuwiran at likas na katumbas sa kontekstong ito.
- source_word: אַתָּה
  choice: Ikaw mismo
  rationale: Tahasan at may diin ang hiwalay na panghalip sa Hebreo; ipinapahayag ng “Ikaw mismo” ang diin nang natural sa Filipino.
- source_word: בֶּן מִי
  choice: kung kaninong anak
  rationale: Ito ang natural na idyomang Filipino para sa tanong tungkol sa pinagmulang ama o angkan.
- source_word: זֶה
  choice: ito
  rationale: Tinutumbasan nito ang malapit na panandang demonstratibo at tumutukoy sa binatang nasa tanaw o kasalukuyang pinag-uusapan.
- source_word: הָעָלֶם
  choice: binata
  rationale: Tumutukoy ito sa isang batang lalaki o kabataang lalaki; ang “binata” ay maikli, makabago, at marangal sa Filipino.
