base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/017.yaml
  text: And Jesse said to David his son[a], “Please take to your brothers this ephah of roasted grain and these ten loaves[b], and run to the camp to your brothers.”
translation:
  language: tl
  text: Sinabi ni Jesse sa anak niyang si David, “Pakidala sa mga kapatid mo ang isang efa ng binusang butil na ito[a] at ang sampung tinapay na ito, at tumakbo ka papunta sa kampo ng mga kapatid mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang isang efa ay sinaunang panukat ng tuyong bagay, na humigit-kumulang 22 litro.
    reason: cultural_note
lexical_decisions:
- source_word: קַח נָא
  choice: Pakidala
  rationale: Ang paki- ay likas na paraan sa modernong Tagalog upang ipahayag ang pinalambot ngunit apurahang utos na may נָא; ang “dala” ay angkop dahil dadalhin ang mga pagkain sa mga tatanggap.
- source_word: לְאַחֶיךָ
  choice: sa mga kapatid mo
  rationale: Tinutukoy ng ל ang mga tatanggap o patutunguhan; natural sa Tagalog ang “sa mga kapatid mo.”
- source_word: אֵיפַת
  choice: isang efa ng
  rationale: Pinananatili ang sinaunang tiyak na yunit na efa sa halip na palitan ito ng isang di-tiyak na sukat; ipinaliliwanag ito sa talababa.
- source_word: הַקָּלִיא
  choice: binusang butil
  rationale: Ang salita ay tumutukoy sa butil na inihanda sa pag-iihaw o pagbubusa. Ang “binusang butil” ay maikli at nauunawaan sa Filipino, habang pinananatili ang paraan ng paghahanda.
- source_word: וַעֲשָׂרָה לֶחֶם
  choice: at ang sampung tinapay na ito
  rationale: Sa kontekstong paglalaan ng pagkain, natural na bilangin sa Tagalog ang “tinapay” nang walang pagdaragdag ng isang salitang katumbas ng “loaves.”
- source_word: וְהָרֵץ
  choice: at tumakbo ka
  rationale: Pinananatili nito ang matingkad at apurahang utos ng Hebreong anyo mula sa רוץ, sa halip na gawing mas malabong “magmadali.”
- source_word: הַמַּחֲנֶה
  choice: kampo
  rationale: Ito ang natural at malinaw na salita para sa isang kampong militar.
- source_word: בְּנוֹ
  choice: sa anak niyang si David
  rationale: Likas na Tagalog na appositional na pagkakakilanlan ito para kay David bilang anak ni Jesse.
