translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw na salaysay. Ginamit ang “Pakidala” upang maging magalang ngunit may pagkaapurahan, at pinanatili ang “efa” bilang kongkretong sinaunang sukat. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang saklaw ng paliwanag.
