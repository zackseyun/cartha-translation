  text: And he had bronze greaves on his legs[a], and a bronze javelin between his shoulders.
translation:
  language: tl
  text: May suot siyang bronseng pananggalang sa mga binti, at isang bronseng suligi[a] sa pagitan ng kanyang mga balikat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sibat.” Maaaring tumukoy ang salitang Hebreo sa isang mas magaan, tulad-sibat na sandata. Iminungkahi rin ng ilan na ibang uri ito ng sandata, ngunit hindi iyon tiyak.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְחַת
  choice: pananggalang … sa mga binti
  rationale: Tumutukoy ito sa baluting nag-iingat sa ibabang bahagi ng mga binti. Mas madaling maunawaan ng karaniwang mambabasa ang “pananggalang sa mga binti” kaysa sa isang teknikal o hiram na katawagan.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Sa sinaunang kontekstong militar, karaniwan itong tumutukoy sa bronse. “Tanso” ang natural at nakaugaliang katawagang Filipino para rito sa pagsasalin ng mga kagamitang biblikal.
- source_word: עַל רַגְלָיו
  choice: sa mga binti
  rationale: Bagaman maaaring mangahulugang paa o binti ang רֶגֶל, malinaw sa uri ng baluti na ang ibabang bahagi ng mga binti ang tinutukoy.
- source_word: כִידוֹן
  choice: suligi
  rationale: Ang salita ay tumutukoy sa isang magaan at tila maihahagis na sandatang tulad ng sibat. Pinananatili ng “suligi” ang posibleng pagkakaiba nito sa mas malaking sibat na binanggit sa kasunod na talata.
- source_word: בֵּין כְּתֵפָיו
  choice: sa pagitan ng kanyang mga balikat
  rationale: Tuwirang pinananatili ang larawan at kalabuan ng Hebreo nang hindi idinaragdag na nakasakbat o nakasabit ang sandata.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pananggalang sa mga binti” sa halip na teknikal na katawagan, samantalang pinanatili ang “sa pagitan ng kanyang mga balikat” upang hindi magdagdag ng paraang hindi tahasang sinasabi ng Hebreo.
