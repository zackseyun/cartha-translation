  text: וּ/פְלִשְׁתִּ֞ים עֹמְדִ֤ים אֶל הָ/הָר֙ מִ/זֶּ֔ה וְ/יִשְׂרָאֵ֛ל עֹמְדִ֥ים אֶל הָ/הָ֖ר מִ/זֶּ֑ה וְ/הַ/גַּ֖יְא בֵּינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/003.yaml
  text: The Philistines were standing on the mountain on one side[a], and Israel was standing on the mountain on the other side[b], with the valley between them.
translation:
  language: tl
  text: Nakatayo ang mga Filisteo sa bundok[a] sa isang panig, at nakatayo naman ang Israel sa bundok sa kabilang panig; nasa pagitan nila ang lambak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “burol” sa dalawang paglitaw ng salitang “bundok”; ang Hebreong הַר ay maaaring tumukoy sa bundok o burol depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “makitid na lambak na matatarik ang mga gilid”; ganito rin ang maaaring tukuyin ng Hebreong גַּיְא.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: ang mga Filisteo
  rationale: Ginamit ang karaniwang pangalang Filipino para sa pangkat ng mga Filisteo. Hindi na tahasang isinalin ang ו bilang “at” sa simula sapagkat nagsisilbi itong pang-ugnay sa daloy ng salaysay at hindi kailangan sa natural na Filipino sa talatang ito.
- source_word: עֹמְדִים
  choice: nakatayo
  rationale: Ang participle ay naglalarawan ng nagpapatuloy na kalagayan o posisyon ng dalawang hukbo. Ang “nakatayo” ang tuwirang salin at hindi kasing-interpretibo ng “nakapuwesto.”
- source_word: אֶל הָהָר מִזֶּה
  choice: sa bundok sa isang panig
  rationale: Sa ganitong paglalarawan ng kinalalagyan, ang אֶל kasama ng עמד ay maaaring tumukoy sa posisyon kaugnay ng bundok. Isinasalin ang מִזֶּה nang idyomatiko bilang “sa isang panig.” Maaaring mangahulugan ang הַר ng bundok o burol, kaya inilakip ang alternatibo sa talababa.
- source_word: וְיִשְׂרָאֵל
  choice: at ... naman ang Israel
  rationale: Pinanatili ang kolektibong pangalang “Israel” ayon sa Hebreo. Ipinakikita ng “at ... naman” ang malinaw na paghahambing sa dalawang magkatapat na panig nang hindi nagdaragdag ng bagong impormasyon.
- source_word: אֶל הָהָר מִזֶּה
  choice: sa bundok sa kabilang panig
  rationale: Inihanay ang ikalawang parirala sa una. Ang “kabilang panig” ang natural na Filipino para sa contrastibong pag-uulit ng מִזֶּה.
- source_word: וְהַגַּיְא
  choice: ang lambak
  rationale: Ang גַּיְא ay maaaring tumukoy sa lambak o sa mas makitid na lambak na matatarik ang mga gilid. “Lambak” ang malinaw at karaniwang salin, habang inilalagay sa talababa ang mas tiyak na posibleng anyong heograpiko.
- source_word: בֵּינֵיהֶם
  choice: nasa pagitan nila
  rationale: Natural at tuwirang ipinahahayag nito na ang lambak ang naghihiwalay sa dalawang pangkat.
