translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal. Ginamit ang “inyong” bilang paggalang kay Saul at ang “nagpapastol” para sa natural na daloy. Ang talata ay sadyang nagtatapos sa kuwit sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
