base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/034.yaml
  text: David said to Saul[a], “Your servant was tending his father’s sheep[b], and when a lion or a bear would come and carry off a lamb from the flock,”
translation:
  language: tl
  text: Sinabi ni David kay Saul, “Ang inyong lingkod ay nagpapastol noon ng mga tupa ng kanyang ama, at kapag may dumarating na leon o oso at tumatangay ng isang tupa mula sa kawan,[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang leon at ang oso,” ngunit malamang na ang diwa ay alinman sa dalawang mandaragit. Ang “isang tupa” ay maaari ring isaling “isang batang tupa” o “isang hayop mula sa kawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה הָיָה
  choice: ay nagpapastol
  rationale: Ang participle kasama ng הָיָה ay naglalarawan ng nagpapatuloy o nakagawiang gawain ni David. Mas natural sa modernong Tagalog ang “nagpapastol” kaysa sa nominal na “isang pastol” sa pangungusap na ito.
- source_word: עַבְדְּךָ
  choice: ang inyong lingkod
  rationale: Magalang at mapagpakumbabang pagtukoy ito ni David sa sarili habang kausap ang hari; hindi kailangang idiin dito ang kahulugang alipin.
- source_word: לְאָבִיו בַּצֹּאן
  choice: ng mga tupa ng kanyang ama
  rationale: Ipinahihiwatig ng parirala na inaalagaan ni David ang kawan ng kanyang ama. Pinagsama ito sa likas na Tagalog na “nagpapastol ng mga tupa ng kanyang ama.”
- source_word: וּבָא
  choice: kapag dumarating
  rationale: Sa paglalahad ni David, malamang na nakagawian o nauulit na pangyayari ang tinutukoy; malinaw itong naipapahayag ng “kapag dumarating.”
- source_word: הָאֲרִי וְאֶת הַדּוֹב
  choice: isang leon o isang oso
  rationale: 'Bagaman “at” ang pormal na pang-ugnay sa Hebreo, malamang na distributibo ang diwa: alinman sa dalawang mandaragit ang dumarating. Likas sa Tagalog ang “leon o oso.”'
- source_word: וְנָשָׂא
  choice: tinatangay
  rationale: Ipinapahayag nito ang pag-agaw at pagdala ng mandaragit sa hayop mula sa kawan.
- source_word: שֶׂה
  choice: isang tupa
  rationale: Maaaring tumukoy ang שֶׂה sa isang hayop ng kawan at hindi kinakailangang sa batang tupa lamang; pinananatili ng “tupa” ang mas malawak na saklaw.
- source_word: מֵהָעֵדֶר
  choice: mula sa kawan
  rationale: Ang “kawan” ang natural na katawagan sa pangkat ng mga tupang inaalagaan.
