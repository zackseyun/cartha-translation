  source_fidelity: Tumpak na naihahatid ng draft ang mapagpakumbabang pagtukoy ni David sa sarili, ang pagpapastol niya sa mga tupa ng kanyang ama, at ang distributibong diwa ng leon o oso na kumukuha ng hayop mula sa kawan. Gayunman, ang walang panandang nakaraan na “ay nagpapastol” at lalo na ang “Kapag dumarating ... at tinatangay” ay mas madaling basahin bilang kasalukuyan o pangkalahatang pangyayari sa modernong Tagalog. Ang Hebreo ay paglalarawan ni David sa dati niyang nakagawiang karanasan. Idinagdag ang “noon” at ginawang “may dumarating ... tumatangay” upang malinaw ang habitual na nakaraan nang hindi ipinipilit ang isang beses-lamang na pangyayari.
