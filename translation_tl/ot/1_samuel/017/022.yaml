  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּטֹּשׁ֩ דָּוִ֨ד אֶת הַ/כֵּלִ֜ים מֵ/עָלָ֗י/ו עַל יַד֙ שׁוֹמֵ֣ר הַ/כֵּלִ֔ים וַ/יָּ֖רָץ הַ/מַּעֲרָכָ֑ה וַ/יָּבֹ֕א וַ/יִּשְׁאַ֥ל לְ/אֶחָ֖י/ו לְ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/022.yaml
  text: So David left the supplies with the keeper of the supplies[a], and ran to the battle line[c][b]. When he arrived, he asked his brothers how they were.
translation:
  language: tl
  text: Kaya iniwan ni David ang mga dala niya sa tagapag-ingat ng mga kagamitan[a], at tumakbo siya patungo sa hanay ng mga kawal[b]. Pagdating niya, kinumusta niya ang kanyang mga kapatid.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay malawak ang kahulugan at maaari ring isaling “mga dala,” “mga bagahe,” o “mga gamit.”
    reason: lexical_alternative
  - marker: b
    text: O “hanay ng labanan”; tumutukoy ito sa nakaayos na hanay o pormasyon ng mga kawal.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “nagtanong siya sa kanyang mga kapatid tungkol sa kapayapaan.” Isa itong idyomang Hebreo na nangangahulugang nagtanong siya tungkol sa kanilang kalagayan o kapakanan.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: iniwan
  rationale: Ang pandiwa ay maaaring mangahulugang iwan o pabayaan, ngunit pansamantala lamang ipinagkatiwala ni David ang kanyang dala; kaya natural at tumpak ang “iniwan.”
- source_word: הַכֵּלִים
  choice: mga dala / mga kagamitan
  rationale: 'Malawak ang kahulugan ng כֵּלִים: mga bagay, kagamitan, o dala. Ginamit ang “mga dala” para sa mga bitbit ni David at “mga kagamitan” para sa mga bagay na binabantayan sa kampo, nang hindi ipinapalagay na armas ang mga ito.'
- source_word: מֵעָלָיו
  choice: mga dala niya
  rationale: Ang literal na diwa ay mga bagay na nasa ibabaw o pasan niya. Natural na naipapahayag ito sa Tagalog sa “mga dala niya.”
- source_word: עַל יַד שׁוֹמֵר הַכֵּלִים
  choice: sa tagapag-ingat ng mga kagamitan
  rationale: Bagaman literal na “sa kamay ng,” ipinahihiwatig ng idyoma ang paglalagay sa pangangalaga ng isang tagapag-ingat.
- source_word: וַיָּרָץ
  choice: tumakbo
  rationale: Tuwirang pinananatili ang kilos at pagmamadali sa salaysay.
- source_word: הַמַּעֲרָכָה
  choice: hanay ng mga kawal
  rationale: Tumutukoy ito sa nakaayos na hanay o pormasyon ng hukbo; malinaw at natural sa modernong Tagalog ang “hanay ng mga kawal.”
- source_word: וַיָּבֹא
  choice: Pagdating niya
  rationale: Natural na ipinapakita sa Tagalog ang kasunod na pangyayari sa pamamagitan ng sugnay na pamanahon, habang pinananatili ang daloy ng Hebreong salaysay.
- source_word: וַיִּשְׁאַל לְאֶחָיו לְשָׁלוֹם
  choice: kinumusta niya ang kanyang mga kapatid
  rationale: Ang literal na “nagtanong ... tungkol sa kapayapaan” ay idyomang Hebreo para sa pagtatanong tungkol sa kalagayan o kapakanan; eksaktong natural na katumbas nito ang “kinumusta.”
