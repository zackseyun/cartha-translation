  source_fidelity: 'Tumpak na naipapahayag ang pagkakasunod ng kilos: iniwan ni David ang mga bitbit niya sa pangangalaga ng tagapag-ingat, tumakbo siya sa hanay ng hukbo, at inusisa ang kalagayan ng kanyang mga kapatid. Ang “mga dala niya” ay angkop na pagsasalin ng כֵּלִים מֵעָלָיו, at ang “kinumusta” ay wastong modernong katumbas ng idyomang שׁאל ... לְשָׁלוֹם.'
