  text: Also bring these ten cuts of cheese to the commander of the thousand[a], check on your brothers’ welfare, and bring back some token from them.
translation:
  language: tl
  text: Dalhin mo rin sa pinuno ng pangkat na isang libo ang sampung piraso ng kesong ito, alamin mo kung maayos ang kalagayan ng mga kapatid mong lalaki, at mag-uwi ka ng isang tanda mula sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kunin mo ang kanilang panagot.” Maaaring tumukoy ito sa isang bagay o tanda na iuuwi bilang katibayan ng kanilang kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרִצֵי הֶחָלָב
  choice: mga piraso ng keso
  rationale: Ang חֲרִיצִים ay maaaring tumukoy sa mga pinutol o hinulmang bahagi ng produktong gatas. Ang “mga piraso ng keso” ay malinaw, kongkreto, at natural sa makabagong Filipino.
- source_word: שַׂר הָאָלֶף
  choice: pinuno ng sanlibo
  rationale: Pinananatili nito ang anyo ng sinaunang yunit militar na tinatawag na אֶלֶף nang hindi ipinapalagay na laging eksaktong isang libong kawal ang bilang nito.
- source_word: תִּפְקֹד לְשָׁלוֹם
  choice: alamin mo kung mabuti ang kalagayan
  rationale: Sa kontekstong ito, ang פקד ay pag-alam o pagtiyak sa kalagayan ng isang tao, at ang שָׁלוֹם ay tumutukoy sa kanyang kabutihan o kapakanan.
- source_word: עֲרֻבָּתָם
  choice: isang tanda mula sa kanila
  rationale: 'Malabo ang tiyak na kahulugan ng salita: maaari itong tumukoy sa panagot, tanda, o katibayang iuuwi bilang patunay ng kalagayan ng mga kapatid. Pinananatili ng “tanda” ang lawak na ito nang hindi labis na nagpapaliwanag sa pangunahing teksto.'
- source_word: וְאֵת
  choice: rin
  rationale: Ipinahahayag nito ang pandagdag na puwersa ng וְ sa sunod-sunod na mga tagubilin.
- source_word: תָּבִיא
  choice: dalhin mo
  rationale: Ang utos ay maghatid ng pagkain sa kampo; natural at tuwiran dito ang “dalhin mo.”
- source_word: תִּקָּח
  choice: mag-uwi ka
  rationale: Bagaman karaniwang nangangahulugang “kunin,” ipinahihiwatig ng konteksto na may kukunin si David mula sa kanyang mga kapatid at ibabalik kay Jesse.
