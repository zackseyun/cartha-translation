  text: And the Philistine came on[a], coming closer to David[b], with the man carrying the shield before him.
translation:
  language: tl
  text: Patuloy na lumapit ang Filisteo kay David[a], habang nasa unahan niya ang lalaking may dalang malaking kalasag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, magkakasunod ang isang pamanahong pandiwa at dalawang participle upang ilarawan ang patuloy niyang pagsulong at papalapit na paggalaw kay David. Maaari ring isalin, “Sumulong ang Filisteo, palapit nang palapit kay David.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הַפְּלִשְׁתִּי הֹלֵךְ וְקָרֵב
  choice: Patuloy na lumapit ang Filisteo
  rationale: Pinagsasama ng pamanahong pandiwa at mga kasunod na participle ang pagsulong at tuloy-tuloy na paglapit. Likas sa modernong Tagalog ang “patuloy na lumapit” at hindi nito idinaragdag ang salitang “mandirigma” o “kampeon.”
- source_word: אֶל דָּוִד
  choice: kay David
  rationale: Ipinapahayag ng אֶל ang direksiyon ng paglapit; ang “kay David” ang natural na anyo sa Tagalog pagkatapos ng “lumapit.”
- source_word: וְהָאִישׁ נֹשֵׂא הַצִּנָּה
  choice: habang ... ang lalaking may dalang malaking kalasag
  rationale: Ang sugnay ay pangyayari o kalagayang kasabay ng paglapit. Malinaw na ipinahihiwatig ng “habang” ang ugnayang ito. Ang צִנָּה ay isang malaki at pananggalang na uri ng kalasag, kaya isinama ang “malaking” sa teksto.
- source_word: לְפָנָיו
  choice: nasa unahan niya
  rationale: Tuwirang inilalarawan nito ang puwesto ng tagapagdala ng kalasag sa harap ng Filisteo; mas natural sa kasalukuyang Tagalog ang “nasa unahan niya” kaysa “sa harap niya” sa pangungusap na ito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal ang ginamit. Pinanatili ang “Filisteo” bilang tiyak na tawag sa tauhan at iniwasang idagdag ang “kampeon,” na wala sa talata. Ginawang malinaw ang kasabay na kalagayan ng tagapagdala ng malaking kalasag.
