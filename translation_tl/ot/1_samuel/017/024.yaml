  text: Nang makita ng lahat ng lalaking Israelita ang lalaking iyon, tumakas sila palayo sa kanya at lubhang natakot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: lahat ng Israelita
  rationale: Ang literal na “bawat lalaki ng Israel” ay tumutukoy sa mga lalaking Israelita sa hukbo; mas natural sa modernong Tagalog ang kolektibong “lahat ng Israelita” sa kontekstong ito.
- source_word: בִּרְאוֹתָם
  choice: Nang makita ... nila
  rationale: Pinananatili ang pangmaramihang hulapi sa Hebreo at ang temporal na ugnayang “nang makita.”
- source_word: הָאִישׁ
  choice: ang lalaking iyon
  rationale: Tumutukoy ito sa lalaking nabanggit na, si Goliat, ngunit hindi ipinapalit ang pangalan upang mapanatili ang anyo at pagtukoy ng Hebreo.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: tumakas sila mula sa harap niya
  rationale: Malapit sa Hebreong idyoma at malinaw na ipinahahayag na lumayo sila dahil sa presensiya niya.
- source_word: וַיִּירְאוּ מְאֹד
  choice: labis na natakot
  rationale: Natural at matinding katumbas ng “natakot nang lubha.”
