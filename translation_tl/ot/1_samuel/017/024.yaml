  source_fidelity: Kailangang panatilihin ang panlalaking saklaw ng כֹל אִישׁ יִשְׂרָאֵל (“bawat/lahat ng lalaki ng Israel”). Ang “lahat ng Israelita” ay mas malawak at maaaring sumaklaw sa kababaihan, samantalang malinaw na panlalaki ang Hebreo. Ang natitirang ugnayan at diin—pagkakita, pagtakas mula sa presensiya niya, at matinding takot—ay wastong naipapahayag.
  naturalness: Natural ang daloy ng pangungusap. Gayunman, mas idiomatiko sa modernong Tagalog ang “tumakas palayo sa kanya” kaysa “tumakas sila mula sa harap niya,” habang pinananatili ang kahulugang pagtakas dahil sa harap/presensiya ng lalaki.
  terminology: Ang “lalaking iyon” ay angkop para sa הָאִישׁ at hindi kailangang palitan ng pangalan. Ang “lalaking Israelita” ay kinakailangan upang tumugma sa panlalaking pantukoy ng pinagmulan.
