  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/פְּלִשְׁתִּ֔י אַתָּה֙ בָּ֣א אֵלַ֔/י בְּ/חֶ֖רֶב וּ/בַ/חֲנִ֣ית וּ/בְ/כִיד֑וֹן וְ/אָנֹכִ֣י בָֽא אֵלֶ֗י/ךָ בְּ/שֵׁם֙ יְהוָ֣ה צְבָא֔וֹת אֱלֹהֵ֛י מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר חֵרַֽפְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/045.yaml
  text: Then David said to the Philistine[a], “You come to me with a sword, with a spear, and with a javelin, but I come to you in the name of Yahweh of Armies, the God of the armies of Israel[c][b], whom you have defied.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni David sa Filisteo, “Lumalapit ka sa akin na may tabak, sibat, at sibat na panghagis, ngunit lumalapit ako sa iyo sa pangalan ni Yahweh ng mga Hukbo[a], ang Diyos ng mga hanay ng Israel[b], na iyong inalipusta[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Yahweh ng mga hukbo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga hanay” ay maaari ring isalin na “mga hukbo” o “mga linya ng labanan.”
    reason: lexical_alternative
  - marker: c
    text: Ang “inalipusta” ay maaari ring isalin na “nilait” o “mapanghamong ininsulto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang “Pagkatapos, sinabi” habang pinananatili ang pagkakasunod-sunod.
- source_word: הַפְּלִשְׁתִּי
  choice: Filisteo
  rationale: Tinutukoy si Goliat ayon sa kaniyang lahi o bayan, nang hindi idinaragdag ang “mandirigma,” na wala sa mismong parirala.
- source_word: בָּא אֵלַי / בָא אֵלֶיךָ
  choice: lumalapit ka sa akin / lumalapit ako sa iyo
  rationale: Ang participle ay nagpapahayag ng kasalukuyan o napipintong pagkilos. Ang “lumalapit” ay natural at hindi kailangang dagdagan ng “laban,” sapagkat malinaw na ang pagkapoot sa konteksto.
- source_word: בְּחֶרֶב
  choice: may tabak
  rationale: Ang ב ay nagmamarka ng kasangkapan; ang “may tabak” ay maikli at likas na Filipino.
- source_word: וּבַחֲנִית
  choice: sibat
  rationale: Karaniwang tumutukoy ang חֲנִית sa isang spear o lance; “sibat” ang malinaw na katumbas.
- source_word: וּבְכִידוֹן
  choice: suligi
  rationale: Tumutukoy ang כִּידוֹן sa mas magaan o naihahagis na uri ng sibat. Pinag-iiba ito ng “suligi” mula sa חֲנִית habang pinananatili ang tatlong magkakaibang sandata.
- source_word: בְּשֵׁם
  choice: sa pangalan ni
  rationale: Pinananatili nito ang idyomang biblikal na nagsasaad ng awtoridad, pagkatawan, at pagtitiwala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: צְבָאוֹת
  choice: ng mga Hukbo
  rationale: Malinaw na ipinahahayag ang militar at makapangyarihang diwa ng צְבָאוֹת; ginamit ang malaking titik bilang bahagi ng banal na titulo.
- source_word: אֱלֹהֵי מַעַרְכוֹת יִשְׂרָאֵל
  choice: ang Diyos ng mga hanay ng Israel
  rationale: Ang מַעַרְכוֹת ay mga puwersang nakaayos sa mga hanay o linya ng labanan. Pinananatili ng “mga hanay” ang kongkretong larawan sa larangan ng digmaan.
- source_word: אֲשֶׁר חֵרַפְתָּ
  choice: na iyong hinamak
  rationale: Sa konteksto, ang חרף ay mapanghamak na pag-insulto at paghamon. Sinasaklaw ng “hinamak” ang paglapastangan nang hindi nililimitahan ito sa pandiwang panunuya lamang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Pagsasalin sa יְהוָה צְבָאוֹת
  choice: Yahweh ng mga Hukbo
  alternative: Yahweh ng mga hukbo; PANGINOON ng mga hukbo
  rationale: Pinananatili ang personal na pangalan at malinaw na isinasalin ang צְבָאוֹת. Ang malaking titik sa “Hukbo” ay nagpapakitang bahagi ito ng titulo, ngunit hindi tinutukoy kung makalangit o makalupang hukbo lamang.
- issue: Tinutukoy ng אֲשֶׁר חֵרַפְתָּ
  choice: ang Diyos ng mga hanay ng Israel
  alternative: ang mga hanay ng Israel
  rationale: Ang panlalaking isahang relative form ay gramatikal na pinakamalapit sa “Diyos,” kaya ang tuwirang pagbasa ay ang Diyos ang hinamak. Gayunman, kaugnay rin nito ang naunang paghamak ni Goliat sa mga hanay ng Israel.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismo ng “lumalapit ka… lumalapit ako,” ang tatlong magkaibang sandata, at ang bigat ng banal na pangalan at titulong militar. Iniwasan ang sobrang arkaikong pananalita at ang pagdaragdag ng denominasyonal na paliwanag.
