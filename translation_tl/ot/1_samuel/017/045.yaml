  naturalness: Malinaw at marangal ang salin, ngunit ang “suligi” ay hindi na karaniwang bokabularyo sa modernong Filipino. Ang “sibat na panghagis” ay mas natural at nauunawaan agad.
  terminology: Ang “Yahweh ng mga Hukbo” at “Diyos ng mga hanay ng Israel” ay angkop na mga salin ng mga titulong Hebreo. Inalis ang tala na nagtatanghal ng “PANGINOON” bilang alternatibo, sapagkat ang pangunahing patakaran para sa יהוה ay “Yahweh”; ang natitirang tala ay tumutukoy lamang sa leksikal na saklaw ng צבאות.
