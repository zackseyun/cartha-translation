    rationale: Bagaman maaaring tumukoy ang “suligi” sa javelin, hindi ito pangkaraniwan sa modernong Filipino. Ang “sibat na panghagis” ay malinaw, natural, at pinananatili ang pagkakaiba nito sa sibat (חֲנִית).
