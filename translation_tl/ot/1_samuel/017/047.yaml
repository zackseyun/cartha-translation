id: 1SA.17.47
reference: 1 Samuel 17:47
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יֵֽדְעוּ֙ כָּל הַ/קָּהָ֣ל הַ/זֶּ֔ה כִּֽי לֹ֛א בְּ/חֶ֥רֶב וּ/בַ/חֲנִ֖ית יְהוֹשִׁ֣יעַ יְהוָ֑ה כִּ֤י לַֽ/יהוָה֙ הַ/מִּלְחָמָ֔ה וְ/נָתַ֥ן אֶתְ/כֶ֖ם בְּ/יָדֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/047.yaml
  text: and all this assembly will know that Yahweh does not save by sword or by spear[a]; for the battle belongs to Yahweh[c][b], and he will give you into our hand.
translation:
  language: tl
  text: At malalaman ng buong kapulungang ito na hindi sa pamamagitan ng tabak o sibat nagliligtas si Yahweh[a]. Sapagkat kay Yahweh ang labanan[b], at ibibigay niya kayo sa aming kamay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi sa tabak at sibat nagliligtas si Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang labanan ay kay Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “sa aming kamay”; isang idyomang nangangahulugang “sa aming kapangyarihan” o “ipauubaya sa amin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: At malalaman
  rationale: 'Ang Qal imperfect ay nagsasaad dito ng magiging resulta: makikilala o mauunawaan ng kapulungan ang katotohanang ipinahahayag ni David.'
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: ng buong kapulungang ito
  rationale: Ang קהל ay ang nagkatipong pangkat na naroon. Ang “kapulungan” ay dignified at angkop sa pampublikong pagtitipon nang hindi nagiging partikular na terminong pansimbahan.
- source_word: לֹא בְּחֶרֶב וּבַחֲנִית יְהוֹשִׁיעַ
  choice: hindi sa pamamagitan ng tabak o sibat nagliligtas
  rationale: Pinananatili ng “nagliligtas” ang malawak na saklaw ng Hiphil ng ישׁע, habang malinaw na ipinapakita ng “sa pamamagitan ng” ang instrumental na gamit ng בְּ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang inililipat sa Tagalog ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: כִּי לַיהוָה הַמִּלְחָמָה
  choice: Sapagkat kay Yahweh ang labanan
  rationale: Ang ikalawang כִּי ay nagbibigay ng dahilan, at likas sa Tagalog ang “kay Yahweh ang labanan” upang ipahayag ang pag-aari o kapamahalaan na ipinahihiwatig ng לְ.
- source_word: וְנָתַן
  choice: at ibibigay niya
  rationale: Bagaman qatal ang anyo, prediktibo ang gamit nito sa konteksto ng pahayag tungkol sa nalalapit na tagumpay.
- source_word: אֶתְכֶם בְּיָדֵנוּ
  choice: kayo sa aming kamay
  rationale: Pinananatili ang Hebreong idyoma at ang isahang “kamay,” na tumutukoy sa kapangyarihan o kontrol ng pangkat.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong pangalan at hindi pinapalitan ng titulo.
- issue: Saklaw ng יְהוֹשִׁיעַ sa kontekstong militar
  choice: nagliligtas
  alternative: nagbibigay ng tagumpay o nagliligtas mula sa panganib
  rationale: Ang “nagliligtas” ay angkop sa laban ngunit hindi nagpapakitid sa pandiwa sa tagumpay militar lamang.
- issue: Kahulugan ng לַיהוָה הַמִּלְחָמָה
  choice: kay Yahweh ang labanan
  alternative: ang labanan ay pag-aari ni Yahweh
  rationale: Pinananatili nito ang mariing pahayag ng Hebreo tungkol sa pag-aari o kapamahalaan ni Yahweh nang hindi ipinapaliwanag nang lampas sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at malinaw. Ginamit ang “kapulungan” para sa pampublikong pagtitipon, “labanan” para sa agarang kontekstong militar, at pinanatili ang Hebreong idyomang “sa aming kamay” na may paliwanag sa talababa.
