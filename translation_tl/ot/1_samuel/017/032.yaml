base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/032.yaml
  text: And David said to Saul[a], “Let no man's heart fail because of him[b]. Your servant will go and fight with this Philistine.”
translation:
  language: tl
  text: Sinabi ni David kay Saul, “Huwag panghinaan ng loob ang sinuman dahil sa kanya.[a] Pupunta ang inyong lingkod at lalabanan ang Filisteong ito.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa Filisteong ito.” Sa Hebreo ay “dahil sa kanya”; nalalaman sa konteksto kung sino ang tinutukoy.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “at makikipaglaban sa Filisteong ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל שָׁאוּל
  choice: Sinabi ni David kay Saul
  rationale: Isinusulong ng waw-consecutive ang salaysay. Natural sa makabagong Tagalog ang payak na “Sinabi” nang hindi kailangang idagdag ang “At.”
- source_word: אַל יִפֹּל לֵב אָדָם
  choice: Huwag panghinaan ng loob ang sinuman
  rationale: Ang literal na larawan ay ‘huwag bumagsak ang puso ng isang tao.’ Ang “panghinaan ng loob” ang natural at malinaw na idyomang Tagalog na nagpapanatili sa diwa ng pagkawala ng tapang; ang “sinuman” ay angkop sa pangkalahatang gamit ng אָדָם.
- source_word: עָלָיו
  choice: dahil sa kanya
  rationale: Pinananatili ang panghalip ng Hebreo at ang pagtukoy nito sa Filisteo batay sa konteksto, sa halip na tahasang pangalanan siya sa pangunahing teksto.
- source_word: עַבְדְּךָ
  choice: ang inyong lingkod
  rationale: Magalang na pagtukoy ito ni David sa sarili sa harap ng hari. Ang “inyong” ay dignified na anyo ng paggalang sa modernong Filipino, at ang “lingkod” ay mas angkop kaysa “alipin” sa kontekstong ito.
- source_word: יֵלֵךְ
  choice: Pupunta
  rationale: Ipinahahayag ng imperfect ang matatag na balak o pasiya ni David; natural itong maipahayag sa aspektong kontemplatibo sa Tagalog.
- source_word: וְנִלְחַם
  choice: at lalabanan
  rationale: Ang pandiwa ay tumutukoy sa aktuwal na pakikipaglaban. Sa Tagalog, ang “lalabanan” ay likas na nangangailangan ng tuwirang layon at malinaw na naghahayag ng pagharap sa kalaban.
- source_word: עִם הַפְּלִשְׁתִּי הַזֶּה
  choice: ang Filisteong ito
  rationale: Bagaman literal na ‘kasama/kaharap ang Filisteong ito’ ang anyong may עִם, sa konteksto ng labanan ay natural sa Tagalog ang “lalabanan ang Filisteong ito.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “inyong lingkod” bilang magalang na pananalita sa hari. Isinalin nang idyomatiko ang Hebreong larawan ng pusong bumabagsak bilang “panghinaan ng loob,” habang inilagay sa talababa ang mga elementong mas literal o mas tahasang mababasa.
