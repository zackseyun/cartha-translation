base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/023.yaml
  text: While he was speaking with them[a], behold, the champion came up—the Philistine named Goliath, from Gath, from the ranks of the Philistines—and he spoke these words[b], and David heard.
translation:
  language: tl
  text: Habang nakikipag-usap pa si David sa kanila, narito, umaahon ang mandirigmang kampeon[a]—ang Filisteong si Goliat na taga-Gat—mula sa hanay ng mga Filisteo[b]. Sinabi niya ang mga salitang iyon, at narinig iyon ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang lalaking nasa pagitan [ng dalawang panig o hanay],” isang idyoma para sa kinatawang mandirigma sa sagupaang tig-isa sa pagitan ng dalawang hukbo.
    reason: lexical_alternative
  - marker: b
    text: Mahirap ang pagbasa ng tekstong Hebreo rito. Malamang na tumutukoy ito sa mga hanay o pormasyon ng hukbong Filisteo; isinasalin naman ng ilan na “mula sa mga kampo ng mga Filisteo.”
    reason: alternative_reading
lexical_decisions:
- source_word: מְדַבֵּר עִמָּם
  choice: nakikipag-usap pa ... sa kanila
  rationale: Ipinahihiwatig ng participle kasama ng הוּא ang patuloy na kilos. Ang “nakikipag-usap” ay likas na nagsasaad ng pakikipag-usap sa isa’t isa, gaya ng עִם na “kasama/kausap.” Nilinaw ang simuno bilang si David ayon sa konteksto.
- source_word: וְהִנֵּה
  choice: narito
  rationale: Pinananatili nito ang biglang paglilipat ng pansin at matingkad na puwersa ng salaysay nang hindi nagiging lipas o di-likas sa makabagong Tagalog.
- source_word: אִישׁ הַבֵּנַיִם
  choice: mandirigmang kampeon
  rationale: Idyoma ito para sa kinatawang mandirigma na lumalaban sa pagitan ng dalawang hukbo. Nililinaw ng “mandirigma” ang kahulugan ng “kampeon,” habang nasa talababa ang literal na anyo.
- source_word: עוֹלֶה
  choice: umahon
  rationale: Ang pandiwang ito ay tumutukoy sa pag-ahon o paglapit ni Goliat mula sa puwesto ng hukbo. Ang payak na naganap na anyo ay natural sa salaysay sa Tagalog.
- source_word: הַפְּלִשְׁתִּי שְׁמוֹ ... מִגַּת
  choice: ang Filisteong si Goliat na taga-Gat
  rationale: Natural na pormula ito sa Tagalog para sa pagkakakilanlan, bayan, at pinagmulan ng tauhan.
- source_word: ממערות פְּלִשְׁתִּים
  choice: mula sa hanay ng mga Filisteo
  rationale: Mahirap ang tradisyong tekstuwal dito, ngunit ipinahihiwatig ng konteksto ang hanay o pormasyon ng hukbong Filisteo. Nasa talababa ang ibang posibleng pagbasa.
- source_word: וַיְדַבֵּר כַּדְּבָרִים הָאֵלֶּה
  choice: Sinabi niya ang mga salitang iyon
  rationale: Tumutukoy ang parirala sa nauna nang inilahad na hamon o panunuya ni Goliat. Pinananatili nitong malinaw ang pagtukoy pabalik nang hindi dinaragdagan ang nilalaman.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: at narinig ito ni David
  rationale: Payak na kilos ito sa salaysay. Ang “ito” ay tumutukoy sa sinabi ni Goliat at natural na kailangan sa Tagalog bagaman pahiwatig lamang ang layon sa Hebreo.
