    issue: Hindi tugma ang pandiwang "makita niya" sa nakaraang salaysay.
    rationale: Ang וַיִּרְאֶה ay perpektibong salaysay na "nakita niya," hindi "makita niya."
  - severity: low
    issue: Maaaring maging malabo at di-likas ang "ito" para kay David.
    rationale: Dahil ang Filisteo ang kasalukuyang simuno, mas malinaw na banggitin si David sa sugnay na nagbibigay ng dahilan.
  - severity: low
    issue: Ang "magandang lalaki" ay hindi kasingtuon ng Hebreo sa anyo o hitsura.
    rationale: Ang יְפֵה מַרְאֶה ay "maganda/kaaya-aya ang anyo"; mas eksakto at natural ang ganitong pahayag.
  revised_text: Nang tumingin ang Filisteo at nakita niya si David, hinamak niya si David, sapagkat bata pa si David, mapula ang kutis, at maganda ang anyo.
