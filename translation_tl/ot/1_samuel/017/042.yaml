  yaml_path: translation/ot/1_samuel/017/042.yaml
  text: When the Philistine looked and saw David[a], he despised him, because he was a youth, ruddy and handsome in appearance.
translation:
  language: tl
  text: Nang tumingin ang Filisteo at nakita niya si David, hinamak niya si David, sapagkat bata pa si David, mapula ang kutis, at maganda ang anyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: tumingin
  rationale: Ipinahahayag ng נבט ang pagtutuon ng tingin; natural ang “tumingin” at napapanatili ang kasunod na hiwalay na kilos na “makita.”
- source_word: הַפְּלִשְׁתִּי
  choice: ang Filisteo
  rationale: Etnikong katawagan lamang ang ginamit sa Hebreo; hindi idinagdag ang “mandirigma” o ang pangalang Goliat.
- source_word: וַיִּרְאֶה אֶת דָּוִד
  choice: makita niya si David
  rationale: Payak na kahulugan ng ראה ang “makita”; pinananatili nito ang pagkakasunod ng pagtingin at pagkakita.
- source_word: וַיִּבְזֵהוּ
  choice: hinamak niya ito
  rationale: Ang בזה ay paghamak o pagtingin nang may pag-alipusta; maikli at likas sa Filipino ang “hinamak.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng paghamak; ang “sapagkat” ay malinaw at marangal sa salaysay.
- source_word: הָיָה נַעַר
  choice: bata pa ito
  rationale: Maaaring tumukoy ang נַעַר sa batang lalaki o kabataang lalaki. Ang “bata pa” ay natural at hindi tiyak na ipinapalagay na musmos si David.
- source_word: אַדְמֹנִי
  choice: mapula ang kutis
  rationale: Tumutukoy ang pang-uri sa mapulang anyo o kulay ngunit hindi tinitiyak na buhok ang inilalarawan. Ang “mapula ang kutis” ang pinakanatural na paglalarawan sa Filipino sa kontekstong ito.
- source_word: עִם יְפֵה מַרְאֶה
  choice: at magandang lalaki
  rationale: Ang parirala ay literal na tumutukoy sa kaaya-aya o magandang anyo. Ang “magandang lalaki” ay natural na modernong Filipino at angkop sa lalaking tinutukoy.
