  text: וַֽ/יַּעֲמֹ֗ד וַ/יִּקְרָא֙ אֶל מַעַרְכֹ֣ת יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר לָ/הֶ֔ם לָ֥/מָּה תֵצְא֖וּ לַ/עֲרֹ֣ךְ מִלְחָמָ֑ה הֲ/ל֧וֹא אָנֹכִ֣י הַ/פְּלִשְׁתִּ֗י וְ/אַתֶּם֙ עֲבָדִ֣ים לְ/שָׁא֔וּל בְּרוּ לָ/כֶ֥ם אִ֖ישׁ וְ/יֵרֵ֥ד אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/008.yaml
  text: He stood and called out to the battle lines of Israel and said to them[a], “Why do you come out to array yourselves for battle? Am I not the Philistine, and are you not servants of Saul? Choose a man for yourselves[b], and let him come down to me.”
translation:
  language: tl
  text: Tumayo siya at sumigaw sa mga hanay ng Israel. Sinabi niya sa kanila, “Bakit kayo lumalabas upang pumuwesto para sa labanan? Hindi ba ako ang Filisteo, at kayo nama’y mga alipin ni Saul?[a] Pumili kayo ng isang lalaki mula sa inyo, at bumaba siya sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lingkod ni Saul.” Ang salitang Hebreo ay maaaring tumukoy sa mga lingkod o mga alipin; sa hamong ito, mapanlait ang puwersa ng katawagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Tumayo siya
  rationale: Karaniwang salaysay na kahulugan ng עמד ang pagtayo; pinananatili rin nito ang mapanghamong tindig sa tagpo.
- source_word: וַיִּקְרָא
  choice: sumigaw
  rationale: Ang קרא ay tumutukoy rito sa malakas na pagtawag sa kabilang hanay, kaya mas angkop ang “sumigaw” kaysa sa payak na “tumawag.”
- source_word: מַעַרְכוֹת יִשְׂרָאֵל
  choice: mga hanay ng Israel
  rationale: Tinutukoy ng מַעַרְכוֹת ang mga hukbong nakaayos sa pormasyon; likas at malinaw sa Filipino ang “mga hanay.”
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: upang pumuwesto para sa labanan
  rationale: Ipinapahayag nito ang pag-aayos o pagpupuwesto ng mga kawal para sa labanan, hindi lamang ang pakikipaglaban.
- source_word: אָנֹכִי הַפְּלִשְׁתִּי
  choice: Hindi ba ako ang Filisteo
  rationale: Pinananatili ang tiyak na pantukoy sa Hebreo at ang pagpapakilala ni Goliat sa sarili bilang kinatawang mandirigma ng mga Filisteo.
- source_word: עֲבָדִים לְשָׁאוּל
  choice: mga alipin ni Saul
  rationale: Maaaring mangahulugan ang עֲבָדִים ng mga lingkod o mga alipin. Sa mapanlait na hamon, naipadarama ng “mga alipin” ang sadyang paghamak sa kanilang katayuan sa ilalim ni Saul.
- source_word: בְּרוּ לָכֶם אִישׁ
  choice: Pumili kayo ng isang lalaki mula sa inyo
  rationale: Pinananatili ang utos, ang panlalaking pangngalan, at ang diwang pipili sila ng sariling kinatawan.
- source_word: וְיֵרֵד אֵלָי
  choice: at pababain ninyo siya rito sa akin
  rationale: Ipinahihiwatig ng kasunod na anyong pandiwa na dapat bumaba ang napili patungo kay Goliat; pinananatili ng “pababain” at “rito sa akin” ang direksiyon at anyo ng hamon.
theological_decisions:
- issue: Saklaw ng עֲבָדִים bilang katawagan sa mga Israelita
  choice: mga alipin ni Saul
  alternative: mga lingkod ni Saul
  rationale: Hindi dapat alisin ang leksikal na posibilidad ng “mga lingkod,” ngunit sa konteksto ng pang-iinsulto ni Goliat, mas naihahatid ng “mga alipin” ang mapanghamak na puwersa. Itinatala sa talababa ang tunay na alternatibo.
- issue: Tiyak na pantukoy sa הַפְּלִשְׁתִּי
  choice: ang Filisteo
  alternative: isang Filisteo
  rationale: Ang tiyak na anyo ay maaaring magpakita kay Goliat bilang kilala o kinatawang Filisteo. Pinananatili ito sa halip na gawing di-tiyak.
translation_notes:
  register: Makabago at marangal na Filipino, na may tuwirang lakas na angkop sa pampublikong paghamon. Ginamit ang “pumuwesto para sa labanan” upang manatiling malinaw sa karaniwang mambabasa habang pinananatili ang larawan ng pag-aayos ng mga hanay.
