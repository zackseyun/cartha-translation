  to: Tumayo siya at sumigaw sa mga hanay ng Israel. Sinabi niya sa kanila, “Bakit kayo lumalabas upang pumuwesto para sa labanan? Hindi ba ako ang Filisteo, at kayo nama’y mga alipin ni Saul?[a] Pumili kayo ng isang lalaki mula sa inyo, at bumaba siya sa akin.”
