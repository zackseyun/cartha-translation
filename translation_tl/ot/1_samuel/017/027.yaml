  text: The people told him the same thing, saying, “This is what will be done for the man who strikes him down.”
translation:
  language: tl
  text: Sinabi sa kanya ng mga tao ang gayon ding bagay, na sinasabi, “Gayon ang gagawin sa lalaking makakapatay sa kanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּדָּבָר הַזֶּה
  choice: ang gayon ding bagay
  rationale: Sa konteksto, inuulit ng mga tao kay David ang naunang sinabi tungkol sa gantimpala; natural itong nagpapahayag ng ‘the same thing’ nang hindi ginagawang literal at mabigat ang ‘ayon sa salitang ito.’
- source_word: יַכֶּנּוּ
  choice: makakapatay sa kanya
  rationale: Bagaman literal na ‘sasaktan/papaluin siya,’ malinaw sa hamon laban kay Goliat na ang tinutukoy ay ang pagpapatumba sa pamamagitan ng pagpatay; ang ‘makakapatay’ ay natural at kontekstuwal sa Tagalog.
- source_word: כֹּה יֵעָשֶׂה
  choice: Ito ang gagawin
  rationale: Pinananatili ang pasibong diwa at ang pagtukoy sa naunang ipinangakong gantimpala, sa payak at kasalukuyang Tagalog.
