base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/005.yaml
  text: He had a bronze helmet on his head[a], and he was clothed with a coat of scale armor[b]; and the weight of the coat was five thousand shekels of bronze.
translation:
  language: tl
  text: May helmet siyang bronse sa ulo, at nakasuot siya ng baluting yari sa magkakapatong na kaliskis[a]. Limang libong shekel ng bronse ang bigat ng baluti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “baluting kaliskis.” Inilalarawan ng Hebreo ang baluting yari sa magkakapatong na pirasong kahawig ng mga kaliskis.
    reason: lexical_alternative
  - marker: b
    text: Ang limang libong shekel ay humigit-kumulang 57 kilo.
    reason: cultural_note
lexical_decisions:
- source_word: כּוֹבַע
  choice: helmet
  rationale: Sa kontekstong militar, tumutukoy ito sa pananggalang sa ulo. Karaniwan at malinaw sa modernong Filipino ang “helmet.”
- source_word: נְחֹשֶׁת
  choice: bronse / tanso
  rationale: Maaaring tumukoy ang salitang Hebreo sa tanso o bronse. “Bronseng helmet” ang natural at malamang na paglalarawan sa kagamitang pandigma; pinanatili naman ang mas malawak na “tanso” sa pariralang sumusunod sa sukat ng bigat.
- source_word: שִׁרְיוֹן קַשְׂקַשִּׂים
  choice: baluting yari sa magkakapatong na kaliskis
  rationale: Ang שִׁרְיוֹן ay baluting isinusuot sa katawan, at literal na “mga kaliskis” ang קַשְׂקַשִּׂים. Ipinahahayag ng salin ang baluting binubuo ng magkakapatong na pirasong tulad ng kaliskis, nang hindi ito napagkakamalang chain mail.
- source_word: הוּא לָבוּשׁ
  choice: nakasuot siya
  rationale: Natural na modernong Filipino ito para sa Hebreong konstruksiyong nagsasaad ng kalagayan niyang nababalutan ng baluti.
- source_word: מִשְׁקַל
  choice: bigat
  rationale: Ito ang malinaw at karaniwang katumbas sa paglalarawan ng timbang ng baluti.
- source_word: חֲמֵשֶׁת אֲלָפִים שְׁקָלִים
  choice: limang libong shekel
  rationale: Pinananatili sa pangunahing teksto ang sinaunang yunit ng orihinal; inilalagay sa talababa ang tinatayang makabagong katumbas.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pamilyar na “helmet” at “baluti,” habang ipinaliwanag ang teknikal na anyo ng baluti sa mismong teksto. Pinanatili ang “shekel” bilang sinaunang yunit at ibinigay ang katumbas nito sa talababa.
