  text: Then he turned away from him toward another and said the same thing[a], and the people answered him as before.
translation:
  language: tl
  text: Pagkatapos, tumalikod siya mula sa kanya at humarap sa ibang tao. Ganoon din ang sinabi niya, at sinagot siya ng mga tao gaya rin ng una.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Sinagot siya ng mga tao ng salitang gaya ng unang salita,” ibig sabihin, pareho ang isinagot nila sa kanya gaya ng dati.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב מֵאֶצְלוֹ
  choice: tumalikod siya rito
  rationale: Ipinahihiwatig ng parirala ang pisikal na pagtalikod ni David mula sa naunang kausap; ang “rito” ay likas na tumutukoy sa taong malapit na binanggit.
- source_word: אֶל מוּל אַחֵר
  choice: at humarap sa iba
  rationale: Pinananatili ng “humarap” ang direksiyonal na diwa ng מוּל, samantalang ang “sa iba” ay natural na tumutukoy sa ibang tao.
- source_word: וַיֹּאמֶר כַּדָּבָר הַזֶּה
  choice: Ganoon din ang sinabi niya
  rationale: Sa konteksto, inulit ni David ang parehong sinabi o tanong; natural itong ipinahahayag nang hindi labis na nililimitahan ang malawak na diwa ng דָּבָר.
- source_word: וַיְשִׁבֻהוּ הָעָם
  choice: ang isinagot sa kanya ng mga tao
  rationale: Ang Hiphil ng שוב ay may diwang “sumagot,” at ang הָעָם ay pinanatiling malawak bilang “mga tao” sa halip na gawing tiyak na “mga kawal.”
- source_word: דָּבָר כַּדָּבָר הָרִאשׁוֹן
  choice: ay gaya ng nauna
  rationale: Ipinahahayag nito nang maikli at natural ang literal na “isang salita/sagot na gaya ng unang salita,” habang pinananatili ang paghahambing sa naunang tugon.
