  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: lumayo si David sa naunang kausap, humarap sa iba, inulit ang sinabi niya, at pareho ang naging tugon ng mga tao. Gayunman, ang “rito” ay deiktiko at karaniwang nangangahulugang “sa lugar na ito,” kaya hindi nito malinaw na isinasalin ang מֵאֶצְלוֹ (“mula sa kanya/mula sa tabi niya”).'
