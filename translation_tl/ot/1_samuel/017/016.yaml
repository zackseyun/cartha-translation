  text: The Philistine came forward morning and evening and took his stand for forty days[a].
translation:
  language: tl
  text: Ang Filisteo ay lumalapit tuwing umaga at gabi at pumupuwesto sa loob ng apatnapung araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ang Filisteo ay lumalapit tuwing umaga at gabi at tumitindig sa loob ng apatnapung araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: lumalapit
  rationale: Karaniwang nangangahulugang ‘lumapit’ ang נגשׁ. Ang aspektong paulit-ulit, na malinaw sa ‘tuwing umaga at gabi’ at sa apatnapung araw, ay natural na ipinahahayag sa Filipino sa anyong ‘lumalapit.’
- source_word: הַפְּלִשְׁתִּי
  choice: ang Filisteo
  rationale: ‘Ang Filisteo’ lamang ang nasa Hebreo. Hindi idinagdag ang ‘mandirigma’ o ‘kampeon,’ bagaman si Goliat ang tinutukoy, upang hindi magpasok ng salita mula sa kalapit na mga talata.
- source_word: הַשְׁכֵּם וְהַעֲרֵב
  choice: tuwing umaga at gabi
  rationale: Ipinahahayag ng magkaparis na parirala ang paulit-ulit na oras ng pagharap niya bawat araw. Ang ‘tuwing umaga at gabi’ ay natural sa modernong Filipino at malinaw na naghahatid ng ganitong ritmo.
- source_word: וַיִּתְיַצֵּב
  choice: at pumupuwesto roon
  rationale: Ang hitpael ng יצב ay maaaring mangahulugang pumuwesto, humarap, o tumindig sa itinakdang lugar. Ang ‘pumupuwesto roon’ ay nagpapanatili sa kusang paglalagay ng sarili sa posisyon nang hindi nagdaragdag ng paliwanag.
- source_word: אַרְבָּעִים יוֹם
  choice: sa loob ng apatnapung araw
  rationale: Nagsasaad ang parirala ng tagal. Ang ‘sa loob ng apatnapung araw’ ay likas na paraan sa Filipino upang ipahayag ang panahong saklaw ng paulit-ulit na kilos.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘tuwing’ at pangkasalukuyang anyong ‘lumalapit’ upang likas na maipakita ang paulit-ulit na kilos, samantalang ang ‘pumupuwesto’ ay nagpapanatili sa diwa ng kusang pagtindig o paglalagay ng sarili sa isang posisyon. Nasa pangunahing teksto ang panandang [a].
