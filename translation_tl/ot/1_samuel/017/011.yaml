base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/011.yaml
  text: When Saul and all Israel heard these words of the Philistine[a], they were dismayed and greatly afraid.
translation:
  language: tl
  text: Nang marinig ni Saul at ng buong Israel ang mga salitang ito ng Filisteo, nasiraan sila ng loob at labis na natakot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Nang marinig
  rationale: Ang qal na שׁמע ay karaniwang nangangahulugang “marinig.” Ginamit ang “Nang” upang natural na maipahayag sa Filipino ang sunod-sunod na pangyayari sa salaysay.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Pinanatili ang karaniwang anyo ng pangalang pantangi sa Filipino.
- source_word: וְכָל יִשְׂרָאֵל
  choice: at ng buong Israel
  rationale: Pinananatili nito ang kolektibong pagtukoy ng Hebreo sa Israel, na sa konteksto ay tumutukoy sa mga Israelitang naroon, lalo na sa hukbo.
- source_word: דִּבְרֵי הַפְּלִשְׁתִּי הָאֵלֶּה
  choice: ang mga salitang ito ng Filisteo
  rationale: Tuwirang inilalarawan nito ang sinabi ng kinatawang mandirigmang Filisteo at pinananatili ang demonstratibong “ito.”
- source_word: וַיֵּחַתּוּ
  choice: nasiraan sila ng loob
  rationale: Ang חתת ay maaaring magpahiwatig ng pagkadurog, panghihina, o pagkasindak. Ang “nasiraan ng loob” ay natural at marangal na Filipino na naghahatid ng matinding panghihina ng loob nang hindi inuulit lamang ang kasunod na takot.
- source_word: וַיִּירְאוּ מְאֹד
  choice: at labis na natakot
  rationale: Ang ירא ay “matakot,” at ang מְאֹד ay nagbibigay ng matinding diin; natural na katumbas ang “labis na natakot.”
theological_decisions: []
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Pinili ang “nasiraan ng loob” upang mapanatili ang pagkakaiba ng dalawang pandiwang Hebreo: matinding panghihina ng loob muna, saka matinding pagkatakot.'
