  source_fidelity: 'Tumpak na naipapahayag ang pagkakasunod ng Hebreo: narinig ni Saul at ng buong Israel ang mga salitang ito ng Filisteo, pagkatapos ay sila''y nasiraan ng loob at lubhang natakot. Ang “nasiraan ng loob” ay isang ligtas at kontekstuwal na katumbas ng וַיֵּחַתּוּ, na naiiba pa rin sa kasunod na tahasang pagkatakot.'
