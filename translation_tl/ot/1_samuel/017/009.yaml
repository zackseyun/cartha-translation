  register: Makabago at dignidad na Filipino, na may malinaw na paralelismo sa dalawang kondisyong sugnay. Ginamit ang “makipaglaban,” “manaig,” at “mapabagsak” bilang natural ngunit malapit-sa-pinagmulan na pananalita; iniwasan ang sobrang teknikal o makalumang bokabularyo.
