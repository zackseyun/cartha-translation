  yaml_path: translation/ot/1_samuel/017/009.yaml
  text: If he is able to fight with me and strike me down[a], then we will be your servants. But if I prevail against him and strike him down[c][b], then you will be our servants and serve us.
translation:
  language: tl
  text: Kung kaya niyang makipaglaban sa akin at mapabagsak ako,[a] magiging mga alipin ninyo kami.[b] Ngunit kung manaig ako sa kanya[c] at mapabagsak ko siya, magiging mga alipin namin kayo at maglilingkod kayo sa amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “matalo ako” o “mapatay ako.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga lingkod” ang salin sa “mga alipin,” ngunit sa kontekstong ito ay pagpapasakop ng isang bayan matapos ang labanan ang tinutukoy.
    reason: lexical_alternative
  - marker: c
    text: 'Mas literal: “kung kaya ko siya”; sa konteksto ng labanan, ang diwa ay “kung manaig ako sa kanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּכַל לְהִלָּחֵם אִתִּי
  choice: kaya niyang makipaglaban sa akin
  rationale: Pinananatili ng “kaya” ang diwa ng kakayahan sa kondisyong hamon, at likas sa Tagalog ang “makipaglaban” para sa harapang labanan ng dalawang panig.
- source_word: וְהִכָּנִי / וְהִכִּיתִיו
  choice: mapabagsak ako / mapabagsak ko siya
  rationale: Ang נכה ay maaaring tumukoy sa paghampas, pagdaig, o pagpatay ayon sa konteksto. Ipinahahayag ng “mapabagsak” ang tiyak na pagkatalo sa tunggalian nang hindi tahasang nililimitahan ang kahulugan sa pagpatay.
- source_word: עֲבָדִים
  choice: mga alipin
  rationale: Sa konteksto ng pagpapasakop ng isang buong bayan matapos ang labanan, malinaw ang sapilitang nakabababang kalagayan; mas tuwiran dito ang “mga alipin” kaysa “mga lingkod.”
- source_word: אֲנִי אוּכַל לוֹ
  choice: manaig ako sa kanya
  rationale: Ang יכל na may ל ay maaaring magpahayag ng kakayahang manaig laban sa isang tao. Ang “manaig” ay natural sa konteksto ng tunggalian at hindi kahoy na salin.
- source_word: וַעֲבַדְתֶּם אֹתָנוּ
  choice: maglilingkod kayo sa amin
  rationale: Tuwirang ipinahahayag nito ang paglilingkod na bunga ng pagkasakop at pinananatili ang pag-uulit ng ugat na עבד sa anyong angkop sa Tagalog.
