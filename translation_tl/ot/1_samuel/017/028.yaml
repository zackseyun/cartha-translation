revisions:
- from: Narinig siya ni Eliab, ang panganay niyang kapatid, habang nakikipag-usap siya sa mga lalaki. Nag-alab ang galit ni Eliab kay David, at sinabi niya, “Bakit ka bumaba rito? At kanino mo iniwan ang kakaunting tupang iyon sa ilang? Alam ko ang iyong kapalaluan[a] at ang kasamaan ng iyong puso[b]. Bumaba ka rito para makita ang labanan.”
  to: Narinig ni Eliab, ang panganay na kapatid ni David, na nakikipag-usap si David sa mga lalaki. Nag-alab ang galit ni Eliab kay David, at sinabi niya, “Bakit ka bumaba rito? At kanino mo iniwan ang kakaunting tupang iyon sa ilang? Alam ko ang kapalaluan mo[a] at ang kasamaan ng puso mo[b]. Bumaba ka para makita ang labanan.”
  rationale: Nilinaw ang paksa ng pandiwang “nakikipag-usap” sa pamamagitan ng tahasang pagbanggit kay David, inalis ang di-kailangang ikalawang “rito,” at pinasimple ang ilang anyong panghalip para sa mas natural na modernong Filipino. Napanatili ang mga paratang bilang mga salita ni Eliab at ang mga marker ng talababa ay nakatali sa wastong mga salitang may alternatibong leksikal.
