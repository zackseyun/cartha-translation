  text: וַ/יִּשְׁמַ֤ע אֱלִיאָב֙ אָחִ֣י/ו הַ/גָּד֔וֹל בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים וַ/יִּֽחַר אַף֩ אֱלִיאָ֨ב בְּ/דָוִ֜ד וַ/יֹּ֣אמֶר לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ וְ/עַל מִ֨י נָטַ֜שְׁתָּ מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙ בַּ/מִּדְבָּ֔ר אֲנִ֧י יָדַ֣עְתִּי אֶת זְדֹנְ/ךָ֗ וְ/אֵת֙ רֹ֣עַ לְבָבֶ֔/ךָ כִּ֗י לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה יָרָֽדְתָּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/028.yaml
  text: Eliab his oldest brother heard him speaking to the men[a], and Eliab’s anger burned against David, and he said, “Why have you come down here? And with whom have you left those few sheep in the wilderness? I know your presumption and the evil of your heart[b], for you have come down to see the battle.”
translation:
  language: tl
  text: Narinig ni Eliab, ang panganay na kapatid ni David, na nakikipag-usap si David sa mga lalaki. Nag-alab ang galit ni Eliab kay David, at sinabi niya, “Bakit ka bumaba rito? At kanino mo iniwan ang kakaunting tupang iyon sa ilang? Alam ko ang kapalaluan mo[a] at ang kasamaan ng puso mo[b]. Bumaba ka para makita ang labanan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kapangahasan” o “kayabangan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kasamaan sa puso mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים
  choice: habang nakikipag-usap siya sa mga lalaki
  rationale: Ipinahahayag ng infinitive construct na may ב ang kasabay na kilos; pinananatili ng “habang” ang temporal/circumstantial na diwa, at ang אֲנָשִׁים ay payak na “mga lalaki,” hindi tahasang “mga kawal.”
- source_word: וַ/יִּֽחַר אַף
  choice: Nag-alab ang galit
  rationale: Pinananatili ang matingkad na Hebreong idyoma ng galit na nag-aalab sa natural na Filipino.
- source_word: לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ
  choice: Bakit ka bumaba rito?
  rationale: Ang ירד ay “bumaba,” at ipinahihiwatig ng זֶה ang lugar na kinaroroonan ni Eliab, kaya natural ang “rito.”
- source_word: וְ/עַל מִ֨י נָטַ֜שְׁתָּ
  choice: At kanino mo iniwan
  rationale: Ipinahahayag ang praktikal na diwa ng pag-iwan sa pangangalaga ng iba nang hindi pinalalabis tungo sa ganap na pagpapabaya.
- source_word: מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙
  choice: ang kakaunting tupang iyon
  rationale: Ang “kakaunti” at “iyon” ay kapuwa kumakatawan sa maliit na bilang at demonstratibong diin, at pinananatili ang mapangmaliit na tono ni Eliab.
- source_word: בַּ/מִּדְבָּ֔ר
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, dignificado, at karaniwang salin ng uncultivated wilderness o pastulan.
- source_word: זְדֹנְ/ךָ֗
  choice: iyong kapalaluan
  rationale: Saklaw ng זָדוֹן ang pagmamataas, pangahas na pag-aakala, at kawalang-galang; natural sa Filipino ang “kapalaluan,” habang inilalahad sa talababa ang iba pang posibleng himig.
- source_word: רֹ֣עַ לְבָבֶ֔/ךָ
  choice: ang kasamaan ng iyong puso
  rationale: Malapit ito sa anyo at moral na bigat ng Hebreo at malinaw sa modernong Filipino.
- source_word: לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה
  choice: para makita ang labanan
  rationale: Tuwirang ipinapahayag ang layunin; ang “labanan” ay higit na angkop sa agarang sagupaan kaysa sa mas malawak na “digmaan.”
theological_decisions:
- issue: Katayuan ng paratang ni Eliab tungkol sa puso at motibo ni David
  choice: Inilahad bilang mismong paratang ni Eliab, nang walang pagsang-ayon ng tagapagsalaysay.
  alternative: Ipahiwatig na totoong palalo o masama ang motibo ni David.
  rationale: Hindi pinagtitibay ng Hebreong salaysay sa talatang ito ang pagsusuri ni Eliab; dapat manatili ang tensiyon sa pagitan ng paratang at ng mas malawak na paglalarawan kay David.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Pinanatili ang matalim at mapangmaliit na tono ni Eliab, gayundin ang larawang “nag-alab ang galit,” nang hindi dinaragdagan ang paratang. Ang lahat ng talababa ay may katugmang marker sa pangunahing teksto.
