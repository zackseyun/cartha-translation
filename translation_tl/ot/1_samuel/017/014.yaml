  text: David was the youngest[a], and the three oldest had gone after Saul.
translation:
  language: tl
  text: Si David ang bunso[a], at ang tatlo niyang pinakamatatandang kapatid ay sumunod kay Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “At si David ang bunso, at ang tatlo niyang pinakamatatandang kapatid ay sumunod kay Saul.” Maaaring isalin ang panimulang Hebreong pangatnig bilang “at.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/דָוִד
  choice: Si David
  rationale: Hindi isinama sa pangunahing teksto ang panimulang ו bilang hiwalay na “at” upang maging natural sa salaysay sa Filipino; itinala sa talababa ang posibleng tuwirang pagkakaugnay na “At si David.”
- source_word: הוּא הַ/קָּטָן
  choice: ang bunso
  rationale: Sa paghahambing ng magkakapatid, ang literal na “siya ang maliit/bata” ay likas na tumutukoy sa bunso. Ang kayariang “Si David ang bunso” ay natural at naipapahiwatig ang diin ng malayang panghalip na הוּא.
- source_word: וּ/שְׁלֹשָׁה הַ/גְּדֹלִים
  choice: at ang tatlo niyang pinakamatatandang kapatid
  rationale: Ang הַגְּדֹלִים ay tumutukoy sa tatlong nakatatanda sa konteksto ng magkakapatid. Nilinaw ng “kapatid” ang ipinahihiwatig ng konteksto, at ipinapakita ng “pinakamatatanda” na sila ang tatlong panganay sa magkakapatid.
- source_word: הָלְכוּ אַחֲרֵי
  choice: ay sumunod kay
  rationale: Ang idyomang literal na “nagpunta sa likuran” ay natural na nangangahulugang sumunod o pumanig sa isang pinuno. Ang “sumunod kay” ay malinaw at hindi nagdaragdag ng hindi tahasang temporal na detalye.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “bunso” at “pinakamatatandang kapatid” bilang likas na pananalita sa konteksto ng magkakapatid; iniwasan ang artipisyal na pagtulad sa aspektong pluperfect ng Ingles dahil walang hiwalay na anyong pluperfect sa Filipino at hindi ito tahasang minamarkahan sa Hebreo.
