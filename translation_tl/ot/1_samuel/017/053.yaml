base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/053.yaml
  text: The sons of Israel returned from pursuing the Philistines[a], and they plundered their camps.
translation:
  language: tl
  text: Bumalik ang mga Israelita mula sa paghabol sa mga Filisteo, at sinamsam nila ang mga kampo ng mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kampo nila.” Maaaring unawain ang anyong Hebreo bilang tumutukoy sa kampo o mga kampo ng mga Filisteo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Bumalik
  rationale: Tuwirang ipinapahayag ang saligang diwa ng שוב at likas sa salaysay ang pandiwang “bumalik.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Bagaman literal na “mga anak na lalaki ng Israel,” ang parirala ay karaniwang katawagan sa bayang Israel; ang “mga Israelita” ay tumpak, natural, at hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
- source_word: מִדְּלֹק אַחֲרֵי
  choice: mula sa paghabol sa
  rationale: Inihahatid ng “paghabol” ang masiglang pagtugis na ipinahihiwatig ng דלק kasabay ng אַחֲרֵי.
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Ito ang karaniwang makabagong Tagalog na anyo ng pangalan ng pangkat.
- source_word: וַיָּשֹׁסּוּ
  choice: sinamsam nila
  rationale: Sa konteksto ng labanan, malinaw at likas na ipinapahayag ng “sinamsam” ang pandarambong o pagkuha sa ari-arian ng natalong hukbo.
- source_word: מַחֲנֵיהֶם
  choice: ang mga kampo ng mga ito
  rationale: Pinananatili ang anyong maramihan ng tekstong Masoretiko at nililinaw na ang tinutukoy ng hulaping panghalip ay ang mga Filisteo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Israelita” sa halip na literal na “mga anak na lalaki ng Israel” dahil ito ang likas na kolektibong katawagan sa bayan sa kasalukuyang Tagalog. Inilagay ang panandang talababa sa mismong teksto ayon sa hinihingi.
