  text: וַ/יְּשָּֽׁמְעוּ֙ הַ/דְּבָרִ֔ים אֲשֶׁ֖ר דִּבֶּ֣ר דָּוִ֑ד וַ/יַּגִּ֥דוּ לִ/פְנֵֽי שָׁא֖וּל וַ/יִּקָּחֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/031.yaml
  text: When the words that David had spoken were heard[a], they reported them before Saul, and he sent for him.
translation:
  language: tl
  text: Nang marinig ang mga salitang sinabi ni David, iniulat nila ang mga iyon kay Saul, at ipinakuha niya si David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at kinuha niya siya.” Malamang na ang ibig sabihin ng Hebreo ay ipinakuha ni Saul si David upang dalhin sa kanyang harapan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְּשָּׁמְעוּ
  choice: Nang marinig
  rationale: Pinananatili nito ang di-tiyak na tagaganap ng Hebreo at natural itong basahin sa makabagong Tagalog nang hindi nagdaragdag ng tahasang simuno.
- source_word: הַדְּבָרִים אֲשֶׁר דִּבֶּר דָּוִד
  choice: ang mga salitang sinabi ni David
  rationale: Ang דְּבָרִים ay tumutukoy rito sa mga sinabi ni David; malinaw at natural ang “mga salita” sa konteksto ng pagsasalita.
- source_word: וַיַּגִּדוּ
  choice: iniulat nila
  rationale: Ipinahihiwatig ng נגד ang pagpapabatid o pag-uulat; ang “iniulat” ay angkop sa paghahatid ng sinabi ni David kay Saul.
- source_word: לִפְנֵי שָׁאוּל
  choice: kay Saul
  rationale: Bagaman literal na “sa harap ni Saul,” idyomatikong ipinahihiwatig dito ang pagsasabi kay Saul; mas natural sa Tagalog ang “kay Saul.”
- source_word: וַיִּקָּחֵהוּ
  choice: ipinakuha niya si David
  rationale: Literal na “at kinuha niya siya,” ngunit sa konteksto ng hari ay malamang na ipinatawag o ipinakuha ni Saul si David. Pinananatili ng “ipinakuha” ang ugnayan sa pandiwang “kunin” habang malinaw na causative ang diwa.
