  text: And Israel and the Philistines drew up battle line against battle line[a].
translation:
  language: tl
  text: Nag-ayos ng hanay ang Israel at ang mga Filisteo, hanay na pandigma laban sa hanay na pandigma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pormasyon laban sa pormasyon” o “hanay na pandigmang magkaharap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲרֹךְ
  choice: pumuwesto sa kani-kanilang hanay
  rationale: Ang pandiwang ערך sa kontekstong militar ay tumutukoy sa pagsasaayos ng mga kawal sa hanay para sa labanan. Natural ito sa modernong Filipino at pinananatili ang larawan ng organisadong pagharap.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Karaniwang anyong Filipino ng pangalang pambansa.
- source_word: וּפְלִשְׁתִּים
  choice: at ang mga Filisteo
  rationale: Karaniwang tawag sa Filipino sa pangkat na etniko; ginamit ang pangmaramihang pantukoy upang maging natural.
- source_word: מַעֲרָכָה
  choice: hanay na pandigma
  rationale: Sa kontekstong ito, tumutukoy ang pangngalan sa inayos na hanay o pormasyon ng hukbo. Malinaw ang 'hanay na pandigma' at napapanatili ang larawang militar.
- source_word: לִקְרַאת
  choice: laban sa
  rationale: Bagaman literal na may diwang 'upang salubungin' o 'nakaharap sa,' ipinahihiwatig ng kontekstong militar ang magkatunggaling mga hanay.
- source_word: מַעֲרָכָה
  choice: hanay na pandigma
  rationale: Inulit ang parehong salin upang mapanatili ang sadyang pag-uulit at simetriya ng Hebreo.
