base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/003.yaml
  text: So David stayed with Achish in Gath[a], he and his men, each man with his household—David with his two wives, Ahinoam the Jezreelite and Abigail[b], the wife of Nabal the Carmelite.
translation:
  language: tl
  text: 'Kaya nanirahan si David kasama ni Akis sa Gat[a], siya at ang kanyang mga tauhan, bawat isa kasama ang kanyang sambahayan—si David kasama ang kanyang dalawang asawa: si Ahinoam na taga-Jezreel at si Abigail, ang asawa ni Nabal na taga-Carmel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nanatili.” Ang pandiwang Hebreo ay maaaring tumukoy sa paninirahan o sa pansamantalang pananatili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Ang יָשַׁב ay maaaring mangahulugang umupo, manatili, o manirahan. Sa kontekstong ito, tumutukoy ito sa paninirahan ni David sa Gat nang hindi ipinahihiwatig na permanente iyon.
- source_word: עִם אָכִישׁ בְּגַת
  choice: kasama ni Akis sa Gat
  rationale: Tuwirang ipinapahayag ng עִם ang pakikisama o paglagi kasama ng isang tao, at ang בְּ sa pangalan ng lungsod ay lokatibong “sa Gat.”
- source_word: הוּא וַאֲנָשָׁיו
  choice: siya at ang kanyang mga tauhan
  rationale: Literal na “siya at ang kanyang mga lalaki”; sa salaysay, ang mga ito ay mga tagasunod o mandirigma ni David. Ang “mga tauhan” ay natural at hindi labis na nagtatakda sa kanilang tungkulin.
- source_word: אִישׁ וּבֵיתוֹ
  choice: bawat isa kasama ang kanyang sambahayan
  rationale: Distributibo ang אִישׁ, kaya “bawat isa”; ang בַּיִת dito ay tumutukoy sa sambahayan, hindi lamang sa gusali.
- source_word: וּשְׁתֵּי נָשָׁיו
  choice: kasama ang kanyang dalawang asawa
  rationale: Tinutukoy nito ang sariling sambahayan ni David at natural na inuugnay sa naunang pariralang distributibo.
- source_word: הַיִּזְרְעֵאלִית
  choice: na taga-Jezreel
  rationale: Ang pambabaeng gentilic ay nagsasaad ng pinagmulan ni Ahinoam. Ang “taga-Jezreel” ang natural at malinaw na anyo sa modernong Tagalog.
- source_word: אֵשֶׁת נָבָל הַכַּרְמְלִית
  choice: na asawa ni Nabal na taga-Carmel
  rationale: Ang אֵשֶׁת נָבָל ay “asawa ni Nabal,” at ang pambabaeng הַכַּרְמְלִית ay pinakanatural na iugnay kay Abigail bilang babaeng taga-Carmel.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang “sambahayan” upang isama ang pamilya at iba pang kabilang sa bahay. Hindi nilagyan ng talababa si Abigail sapagkat walang tunay na tekstuwal o leksikal na alternatibo roon; ang marker [a] lamang ang kailangan at lumilitaw sa pangunahing teksto.
