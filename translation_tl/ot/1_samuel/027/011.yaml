revisions:
- from: Hindi nag-iwan si David ng buháy na lalaki o babae na madadala sa Gat. Sinabi niya, “Baka isumbong nila kami at sabihin, ‘Ganito ang ginawa ni David, at ganito ang nakagawian niya[b] sa buong panahong nanirahan siya sa lupain ng mga Filisteo[a].’”
  to: Hindi nag-iwan si David ng buhay na lalaki o babae upang madala sa Gat. Sinabi niya, “Baka mag-ulat sila tungkol sa amin at sabihin, ‘Ganito ang ginawa ni David, at ganito ang nakagawian niya[b] sa buong panahong nanirahan siya sa lupain ng mga Filisteo[a].’”
  rationale: Ginawang neutral ang pandiwang tumutukoy sa maaaring sabihin ng mga nakaligtas at nilinaw ang layuning ipinahahayag ng infinitive na “dalhin sa Gat.” Hindi binago ang saklaw ng karahasan sa salaysay, ang mga pangalan, ang idyomang pangheograpiya, o ang kahulugang “nakasanayang gawain.” Nananatili ang mga anchor ng talababa sa mga pariralang tinutukoy nila.
