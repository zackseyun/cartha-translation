  text: וְ/אִ֨ישׁ וְ/אִשָּׁ֜ה לֹֽא יְחַיֶּ֣ה דָוִ֗ד לְ/הָבִ֥יא גַת֙ לֵ/אמֹ֔ר פֶּן יַגִּ֥דוּ עָלֵ֖י/נוּ לֵ/אמֹ֑ר כֹּֽה עָשָׂ֤ה דָוִד֙ וְ/כֹ֣ה מִשְׁפָּט֔/וֹ כָּל הַ֨/יָּמִ֔ים אֲשֶׁ֥ר יָשַׁ֖ב בִּ/שְׂדֵ֥ה פְלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/011.yaml
  text: David left alive neither man nor woman to bring to Gath[a], saying, “Otherwise they might report about us, saying, ‘This is what David did[b], and this was his practice all the days that he lived in the country of the Philistines.’”
translation:
  language: tl
  text: Hindi nag-iwan si David ng buhay na lalaki o babae upang madala sa Gat. Sinabi niya, “Baka mag-ulat sila tungkol sa amin at sabihin, ‘Ganito ang ginawa ni David, at ganito ang nakagawian niya[b] sa buong panahong nanirahan siya sa lupain ng mga Filisteo[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal sa Hebreo: “sa parang ng mga Filisteo,” isang idyoma para sa teritoryo o kanayunan ng mga Filisteo.'
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “paraan niya” o “kaugalian niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ וְאִשָּׁה
  choice: lalaki o babae
  rationale: Ang pares na isahan sa Hebreo ay distributibo at sumasaklaw sa sinumang posibleng makaligtas; natural sa Tagalog ang “lalaki o babae.”
- source_word: לֹא יְחַיֶּה דָוִד
  choice: Hindi nag-iwan si David ng buháy
  rationale: Ang Piel ng חיה rito ay nangangahulugang magpanatiling buhay o magligtas. Malinaw at natural na ipinahahayag ng “hindi nag-iwan ... ng buháy” na walang pinatawad na saksi.
- source_word: לְהָבִיא גַת
  choice: na madadala sa Gat
  rationale: 'Ipinahahayag ng pawatas ang layunin: walang iniwang buhay na maaaring dalhin sa Gat. Ginawang pasibo sa Tagalog upang luminaw na ang mga nakaligtas sana ang dadalhin, nang hindi tinutukoy kung sino ang magdadala.'
- source_word: לֵאמֹר
  choice: Sinabi niya
  rationale: Pinananatili nito ang balangkas ng tuwirang pananalita sa Hebreo at ipinakikilalang katuwiran ni David ang sumusunod.
- source_word: פֶּן
  choice: Baka
  rationale: Ang פֶּן ay nagpapahayag ng kinatatakutang pangyayaring nais pigilan; “baka” ang natural at tuwirang katumbas sa modernong Tagalog.
- source_word: יַגִּדוּ עָלֵינוּ
  choice: isumbong nila kami
  rationale: Sa konteksto, ang pag-uulat tungkol kina David ay laban sa kanilang lihim na gawain. Ang “isumbong” ay natural na naghahatid ng ganitong diwa.
- source_word: כֹּה עָשָׂה דָוִד
  choice: Ganito ang ginawa ni David
  rationale: Pinananatili ng “ganito” ang demonstratibong puwersa ng כֹּה.
- source_word: וְכֹה מִשְׁפָּטוֹ
  choice: at ganito ang nakagawian niya
  rationale: Maaaring tumukoy ang מִשְׁפָּט sa pasiya, tuntunin, paraan, o nakaugaliang gawain. Sa salaysay, tumutukoy ito sa paulit-ulit na paraan ng pagkilos ni David.
- source_word: כָּל הַיָּמִים אֲשֶׁר יָשַׁב
  choice: sa buong panahong nanirahan siya
  rationale: Natural nitong ipinahahayag sa Tagalog ang kabuuang tagal ng paninirahan ni David.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: sa lupain ng mga Filisteo
  rationale: Literal na “sa parang/larangan ng mga Filisteo,” ngunit ang idyoma rito ay tumutukoy sa kanilang teritoryo o kanayunan; “lupain” ang malinaw na katumbas.
theological_decisions:
- issue: Ang moral na pagtataya sa pagpatay ni David sa lahat ng posibleng saksi
  choice: Isinalaysay ang ginawa nang tuwiran at walang idinagdag na paghatol o pagtatanggol.
  alternative: Magdagdag ng salitang nagpapawalang-sala o tahasang humahatol sa ginawa.
  rationale: Hindi nagbibigay ang talata mismo ng tahasang teolohikal o moral na pagsusuri; dapat panatilihin ng salin ang tensiyon ng salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Ginamit ang “Gat” at “mga Filisteo,” at iniwasan ang lipas na “tumahan” at ang sobrang literal ngunit malabong “parang ng mga Filisteo.” Inilagay ang marker [a] sa mismong pariralang “lupain ng mga Filisteo,” na siyang tinutukoy ng tala.
