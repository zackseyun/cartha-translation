  source_fidelity: 'Tumpak ang pangunahing diwa: walang lalake o babaeng iniwang buhay si David upang walang makadala ng ulat sa Gat. Gayunman, ang “isumbong” ay mas tiyak na nagpapahiwatig ng pagsusumbong o paratang kaysa sa neutral na “mag-ulat/tumukoy tungkol sa amin” ng יַגִּדוּ עָלֵינוּ. Mas ligtas ang neutral na salin.'
  naturalness: Malinaw at moderno ang Tagalog. Ang “upang madala sa Gat” ay mas tuwirang naghahayag ng layuning nasa infinitive kaysa “na madadala sa Gat,” na maaaring magmukhang simpleng panuring lamang sa lalaki o babae.
  terminology: Ang “Gat,” “mga Filisteo,” “lupain,” at “nakagawian” ay angkop. Napananatili ng “nakagawian” ang diwang nakasanayang paraan o gawain ng מִשְׁפָּטוֹ nang hindi ipinipilit ang kahulugang batas o hatol.
