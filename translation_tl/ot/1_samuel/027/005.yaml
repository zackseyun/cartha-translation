  to: Pagkatapos, sinabi ni David kay Akis, “Kung nakamit ko ang iyong pagsang-ayon, ipagkaloob sana sa akin ang isang lugar sa isa sa mga bayan sa kanayunan[a], upang doon ako manirahan[b]. Bakit pa maninirahang kasama mo sa maharlikang lungsod[c] ang iyong lingkod?”
