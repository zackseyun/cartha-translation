base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/005.yaml
  text: Then David said to Achish[a], “If I have now found favor in your eyes, let them give me a place in one of the towns in the countryside, so that I may live there[c][b]. For why should your servant live with you in the royal city?”
translation:
  language: tl
  text: Pagkatapos, sinabi ni David kay Akis, “Kung nakamit ko ang iyong pagsang-ayon, ipagkaloob sana sa akin ang isang lugar sa isa sa mga bayan sa kanayunan[a], upang doon ako manirahan[b]. Bakit pa maninirahang kasama mo sa maharlikang lungsod[c] ang iyong lingkod?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa isa sa mga lungsod ng parang,” na tumutukoy sa isang bayan sa kanayunan, taliwas sa maharlikang lungsod.
    reason: lexical_alternative
  - marker: b
    text: O “at doon ako maninirahan.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, literal na “lungsod ng kaharian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: kinalulugdan mo ako
  rationale: Likas na salin ng idyomang Hebreo na literal na tumutukoy sa pagkakaroon ng pabor sa paningin ng isang tao; malinaw at magalang sa makabagong Tagalog.
- source_word: נָא
  choice: sana
  rationale: Pinapalambot nito ang kahilingan at ipinahahayag ang magalang na pakiusap, gaya ng gamit ng partikulang Hebreo sa konteksto.
- source_word: יִתְּנוּ לִי
  choice: ipagkaloob sana sa akin
  rationale: Ang ikatlong panauhang maramihan ay di-tiyak at may puwersang pakiusap. Mas natural sa Tagalog ang magalang na konstruksiyong ito kaysa sa literal na “bigyan nila ako,” nang hindi tinutukoy kung sino ang magbibigay.
- source_word: מָקוֹם
  choice: isang lugar
  rationale: Pinananatili ang pangkalahatang kahulugan ng salitang Hebreo.
- source_word: בְּאַחַת עָרֵי הַשָּׂדֶה
  choice: sa isa sa mga bayan sa lalawigan
  rationale: Ipinahahayag ang kaibahan ng mga bayan sa labas ng sentrong maharlika sa “maharlikang lungsod”; may talababa para sa literal na larawan ng Hebreo.
- source_word: וְאֵשְׁבָה שָּׁם
  choice: upang doon ako manirahan
  rationale: Natural na Tagalog na nagpapakita ng malamang na layuning ugnayan, habang itinatala sa talababa ang posibleng payak na koordinasyon.
- source_word: לָמָּה יֵשֵׁב
  choice: Bakit pa maninirahan
  rationale: Pinananatili ang retorikal na tanong at ang paliwanag ni David sa kaniyang kahilingan.
- source_word: עַבְדְּךָ
  choice: ang iyong lingkod
  rationale: Ito ay mapagpakumbabang pagtukoy sa sarili sa pananalita sa hari, hindi pangunahing pagdidiin sa pagkaalipin.
- source_word: בְּעִיר הַמַּמְלָכָה
  choice: sa maharlikang lungsod
  rationale: Malinaw at likas na salin ng literal na “lungsod ng kaharian,” nang hindi labis na tinutukoy itong kabisera.
- source_word: עִמָּךְ
  choice: kasama mo
  rationale: Tuwirang ipinahahayag ang personal na pagiging malapit kay Akis na tinutukoy sa tanong.
theological_decisions: []
translation_notes:
  register: Makabago, magalang, at marangal na Tagalog. Ginamit ang “Akis,” ang karaniwang anyong Filipino ng pangalang Achish. Pinanatili ang pormal na pananalita ni David bilang lingkod sa isang hari, habang iniwasan ang labis na literal at di-likas na ayos.
