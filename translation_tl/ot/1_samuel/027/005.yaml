  naturalness: Likas ang kabuuang ayos, ngunit mas natural at mas tumpak ang “mga bayan sa kanayunan” kaysa “mga bayan sa lalawigan.” Ang “nakamit ko ang iyong pagsang-ayon” ay malinaw na makabagong Tagalog para sa idyoma ng pagkakaroon ng pabor.
  terminology: Ang “Akis,” “iyong lingkod,” at “maharlikang lungsod” ay angkop sa pangalan, magalang na rehistro, at kahulugan ng mga pangunahing termino. Pinanatili ang literal na alternatibo para sa “lungsod ng kaharian.”
