base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/002.yaml
  text: So David arose and crossed over, he and the six hundred men who were with him, to Achish son of Maoch, king of Gath.
translation:
  language: tl
  text: Tumindig si David at tumawid—siya at ang animnaraang lalaking kasama niya—patungo kay Akis na anak ni Maoc, hari ng Gat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Ang Qal wayyiqtol ng קום ay naghuhudyat dito ng pagsisimula ng tiyak na pagkilos. Pinananatili ng “tumindig” ang salaysay na idyoma nang hindi ito nililimitahan sa literal na pagtayo lamang.
- source_word: וַיַּעֲבֹר
  choice: tumawid
  rationale: Ang עבר ay karaniwang nangangahulugang tumawid o lumipat sa kabilang panig. Ang “tumawid” ay nagpapanatili ng diwa ng paglipat ni David patungo sa teritoryo ng mga Filisteo.
- source_word: הוּא
  choice: siya
  rationale: Ang hiwalay na panghalip ay nagbibigay-linaw at bahagyang diin kay David bilang kasama ng pangkat; likas itong maipahahayag sa Tagalog bilang “siya at…”
- source_word: וְשֵׁשׁ מֵאוֹת אִישׁ
  choice: ang animnaraang lalaking
  rationale: Tuwirang inililipat ang bilang at ipinakikitang ito ang kilala nang pangkat ng mga lalaking kasama ni David.
- source_word: אֲשֶׁר עִמּוֹ
  choice: kasama niya
  rationale: Maikli, tuwiran, at natural na Tagalog para sa sugnay na tumutukoy sa pangkat ni David, nang hindi dinaragdagan ang kahulugan ng aktibong pagsama o pag-escort.
- source_word: אֶל
  choice: papunta kay
  rationale: Ipinahahayag nito ang pagkilos tungo sa isang taong siyang patutunguhan; kailangan ang pantukoy na “kay” sa pangalan ng tao sa natural na Tagalog.
- source_word: אָכִישׁ
  choice: Akis
  rationale: Isinalin sa nakaugaliang anyong Tagalog ang personal na pangalang Hebreo.
- source_word: בֶּן מָעוֹךְ
  choice: anak ni Maoc
  rationale: Pinananatili ang tuwirang patronimikong ugnayan ng tekstong Hebreo.
- source_word: מֶלֶךְ גַּת
  choice: hari ng Gat
  rationale: Tuwirang inililipat ang construct chain na tumutukoy sa katungkulan ni Akis bilang hari ng Gat.
