  to: Tumindig si David at tumawid—siya at ang animnaraang lalaking kasama niya—patungo kay Akis na anak ni Maoc, hari ng Gat.
  rationale: Inalis ang posibleng sanhi-bungang diin ng “Kaya,” pinalitan ang mas kolokyal na “papunta” ng “patungo,” at nilinaw ang appositional na pangkat nang walang dagdag o bawas sa kahulugan ng Hebreo.
