  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na kilos at ang bahagyang idiomatikong “tumindig,” habang ginawang natural ang apposition sa hulihan sa pamamagitan ng “na hari ng Gat.”
