revisions:
- from: Pagkatapos, umahon si David at ang kanyang mga tauhan at sinalakay ang mga Gesureo, ang mga Girzita[a], at ang mga Amalekita. Sila ang mga naninirahan sa lupaing iyon mula pa noong unang panahon, sa dakong patungong Shur[b] hanggang sa lupain ng Ehipto.
  to: Pagkatapos, umahon si David at ang kanyang mga tauhan at nagsagawa ng mga pagsalakay laban sa mga Gesureo, mga Girzita[a], at mga Amalekita, sapagkat sila ang mga naninirahan sa lupain mula pa noong unang panahon, sa daang patungong Shur hanggang sa lupain ng Ehipto.
