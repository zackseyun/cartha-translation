translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘umahon’ upang mapanatili ang kilos ng Hebreo, at ‘sinalakay’ para sa natural na paglalarawan ng ekspedisyong pandarambong. Inilagay ang pangungusap sa dalawang bahagi para sa malinaw na daloy.
