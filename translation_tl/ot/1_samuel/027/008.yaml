base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/008.yaml
  text: Then David and his men went up and made raids against the Geshurites[a], the Girzites, and the Amalekites, for these were the inhabitants of the land from ancient times, as you go to Shur[b], even to the land of Egypt.
translation:
  language: tl
  text: Pagkatapos, umahon si David at ang kanyang mga tauhan at nagsagawa ng mga pagsalakay laban sa mga Gesureo, mga Girzita[a], at mga Amalekita, sapagkat sila ang mga naninirahan sa lupain mula pa noong unang panahon, sa daang patungong Shur hanggang sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Gezrita.” Hindi tiyak ang pagbasa at pagsasalin ng pangalang Hebreo rito; sinusunod sa teksto ang anyong katinig na nasa ibinigay na tekstong Hebreo bilang “Girzita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: umahon
  rationale: Pinananatili ang karaniwang diwa ng עלה na ‘umakyat/umahon’ sa salaysay, sa halip na gawing pangkalahatang ‘umalis.’
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: sinalakay
  rationale: Sa kontekstong militar, ang פשט kasama ng אֶל ay tumutukoy sa pagsalakay o pandarambong laban sa mga pangkat; natural at malinaw sa modernong Filipino ang ‘sinalakay.’
- source_word: הַגְּשׁוּרִי
  choice: mga Gesureo
  rationale: Ginawang likas na katawagan sa Filipino para sa isang pangkat ng tao.
- source_word: הגרזי
  choice: mga Girzita
  rationale: Malapit sa katinig na anyong גרזי ng ibinigay na tekstong Hebreo; kinikilala sa talababa ang kawalang-katiyakan ng pangalan.
- source_word: הָעֲמָלֵקִי
  choice: mga Amalekita
  rationale: Karaniwang katawagang Filipino sa bayang nagmula kay Amalek.
- source_word: כִּי הֵנָּה יֹשְׁבוֹת הָאָרֶץ
  choice: Sila ang mga naninirahan sa lupaing iyon
  rationale: Ipinahahayag ang kolektibong pagtukoy sa mga nabanggit na pangkat at ang kanilang paninirahan sa lupain nang natural sa Filipino.
- source_word: מֵעוֹלָם
  choice: mula pa noong unang panahon
  rationale: Dito, ang עוֹלָם ay tumutukoy sa matagal nang nakaraan, hindi sa walang hanggang panahon.
- source_word: בּוֹאֲךָ שׁוּרָה
  choice: sa dakong patungong Shur
  rationale: Isinasalin ang karaniwang heograpikong idyoma bilang direksiyon o rutang patungo sa Shur, nang hindi pinipilit ang literal na ikalawang panauhan.
- source_word: וְעַד אֶרֶץ מִצְרָיִם
  choice: hanggang sa lupain ng Ehipto
  rationale: Malinaw na naghahayag ng hangganan o lawak ng teritoryo.
