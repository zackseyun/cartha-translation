base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/006.yaml
  text: So Achish gave him Ziklag that day[b][a]. Therefore Ziklag has belonged to the kings of Judah to this day.
translation:
  language: tl
  text: Noong araw na iyon, ibinigay ni Akis sa kanya ang Ziklag.[a] Dahil dito, ang Ziklag ay naging pag-aari ng mga hari ng Juda hanggang sa araw na ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sa araw na iyon.”
    reason: lexical_alternative
  - marker: b
    text: O, “ay nanatiling pag-aari ng mga hari ng Juda.” Ipinahihiwatig ng Hebreo na nanatili ang Ziklag sa pag-aari ng mga hari ng Juda hanggang sa panahon ng tagapagsalaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן
  choice: ibinigay
  rationale: Ang karaniwang kahulugan ng נתן sa kontekstong ito ay “ibinigay”; malinaw at natural ito sa Filipino nang hindi dinaragdagan ang diwa ng pagkakaloob o pagtatalaga.
- source_word: לּוֹ
  choice: sa kanya
  rationale: Pinananatili ang panghalip na panlalaking isahan ng Hebreo. Si David ang tinutukoy ayon sa agarang konteksto, ngunit hindi inuulit ang kanyang pangalan dahil wala ito sa talata.
- source_word: אָכִישׁ
  choice: Akis
  rationale: Isinalin sa karaniwang anyong Filipino ng pangalang Achish.
- source_word: בַּיּוֹם הַהוּא
  choice: noong araw na iyon
  rationale: Natural na katumbas sa modernong Filipino ng tiyak na panandang pamanahon na “on that day.”
- source_word: צִקְלָג
  choice: Ziklag
  rationale: Pinanatili ang nakaugaliang transliterasyon ng pangalan ng lugar.
- source_word: לָכֵן
  choice: Dahil dito
  rationale: Malinaw na ipinahahayag ang bunga ng pagbibigay ni Akis sa Ziklag.
- source_word: הָיְתָה ... לְמַלְכֵי יְהוּדָה
  choice: ay naging pag-aari ng mga hari ng Juda
  rationale: Sa ganitong kayarian, ang לְ ay nagpapahayag ng kaugnayang pag-aari. Ang “naging pag-aari” ay natural sa Filipino at, kasama ng “hanggang sa araw na ito,” ipinahihiwatig ang nagpapatuloy na kalagayan mula sa pangyayaring iyon.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Tuwirang pinananatili ang pananaw ng tagapagsalaysay na nagpatuloy ang kalagayang ito hanggang sa kanyang sariling panahon.
theological_decisions:
- issue: Pananaw na pangkasaysayan sa “hanggang sa araw na ito” at “mga hari ng Juda”
  choice: Pinanatili ang retrospektibong pahayag ng tagapagsalaysay nang walang paliwanag tungkol sa panahon o proseso ng pagkakabuo ng aklat.
  alternative: Linawin sa salin na nagsasalita ang isang tagapagsalaysay mula sa mas huling panahon ng monarkiya ng Juda.
  rationale: Ang Hebreo ay nagsasaad lamang ng pangyayaring pangkasaysayan mula sa pananaw ng tagapagsalaysay. Hindi nararapat magpasok sa pangunahing teksto ng isang tiyak na teorya tungkol sa may-akda o redaksiyon.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang “sa kanya” sa halip na tahasang “kay David” upang manatiling malapit sa panghalip ng Hebreo, at ginamit ang “mga hari ng Juda” bilang natural at pormal na katawagan.
