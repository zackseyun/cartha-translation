  text: When it was reported to Saul that David had fled to Gath[b][a], he no longer continued to seek him.
translation:
  language: tl
  text: Nang iulat kay Saul na tumakas si David patungong Gat, hindi na niya ipinagpatuloy ang paghahanap sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: ibalita
  rationale: Pinananatili ng anyong di-tiyak ang tagapagbalita at natural na ipinahahayag sa Filipino na ipinaalam kay Saul ang balita.
- source_word: לְשָׁאוּל
  choice: kay Saul
  rationale: Karaniwang pananda sa Filipino para sa tumanggap ng ibinalitang impormasyon.
- source_word: כִּי
  choice: na
  rationale: Likas na pang-ugnay sa Filipino na nagpapakilala sa nilalaman ng balita.
- source_word: בָרַח
  choice: tumakas
  rationale: Tumpak sa kahulugang tumakas o lumayo upang makaiwas; ang naunang pagganap ng kilos ay malinaw na sa pagkakasunod ng salaysay.
- source_word: גַּת
  choice: patungong Gat
  rationale: Bagaman walang tahasang pang-ukol sa Hebreo, gumaganap ang Gat bilang hantungan ng pagtakas; malinaw at natural ang “patungong” sa Filipino.
- source_word: וְלֹא יֹסֶף עוֹד
  choice: hindi na niya ipinagpatuloy
  rationale: 'Inilalahad ang idyomatikong puwersa ng יסף kasama ng עוד: tumigil si Saul at hindi na nagpatuloy sa dating ginagawa.'
- source_word: לְבַקְשׁוֹ
  choice: ang paghahanap sa kanya
  rationale: Pinananatili ang malawak na kahulugan ng בקש na maghanap; hindi nito labis na tinutukoy kung ang layunin ay matunton, hulihin, o usigin si David.
