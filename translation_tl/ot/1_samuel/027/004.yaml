translation_notes:
  register: Modernong Filipino na malinaw, dignipikado, at angkop sa salaysay. Ginamit ang “ipinagpatuloy ang paghahanap” upang mapanatili ang aspektong pagpapatuloy sa idyomang Hebreo nang hindi nagiging asiwa ang pangungusap.
