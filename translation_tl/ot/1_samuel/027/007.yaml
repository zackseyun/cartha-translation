translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Filisteo,” ang karaniwang anyo sa Tagalog para sa Philistines, at iniwasan ang sobrang literal na mga pariralang maaaring makalito.
