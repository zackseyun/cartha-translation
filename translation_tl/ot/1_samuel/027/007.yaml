  yaml_path: translation/ot/1_samuel/027/007.yaml
  text: The number of days that David lived in the territory of the Philistines was a year and four months[a].
translation:
  language: tl
  text: Ang haba ng panahong nanirahan si David sa lupain ng mga Filisteo ay isang taon at apat na buwan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga araw at apat na buwan.” Sa ganitong pahayag ng tagal, ang “mga araw” ay isang idyomatikong paraan ng pagsasabing “isang taon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִסְפַּר הַיָּמִים
  choice: Ang haba ng panahon ... ay
  rationale: Ipinahahayag ng parirala ang kabuuang tagal ng paninirahan. Mas natural sa modernong Tagalog ang “haba ng panahon” kaysa literal na “bilang ng mga araw,” habang pinananatili ang diwa ng buod ng tagal.
- source_word: אֲשֶׁר יָשַׁב דָּוִד
  choice: nanirahan si David
  rationale: Ang יָשַׁב dito ay tumutukoy sa pananatili o paninirahan, hindi sa literal na pag-upo. Ang “nanirahan” ay angkop sa matagal na pananatili.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: sa lupain ng mga Filisteo
  rationale: Bagaman maaaring literal na “bukid” ang שָׂדֶה, dito ay tumutukoy ito sa lupaing sakop o tinitirhan ng mga Filisteo. Natural at malinaw ang “lupain.”
- source_word: יָמִים וְאַרְבָּעָה חֳדָשִׁים
  choice: isang taon at apat na buwan
  rationale: Sa pormula ng tagal, ang יָמִים ay idyomatikong maaaring mangahulugang “isang taon.” Inilalagay sa talababa ang literal na anyo upang maging malinaw ang tekstuwal na batayan.
