  text: וַ/יֹּ֣אמֶר אָכִ֔ישׁ אַל פְּשַׁטְתֶּ֖ם הַ/יּ֑וֹם וַ/יֹּ֣אמֶר דָּוִ֗ד עַל נֶ֤גֶב יְהוּדָה֙ וְ/עַל נֶ֣גֶב הַ/יַּרְחְמְאֵלִ֔י וְ/אֶל נֶ֖גֶב הַ/קֵּינִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/010.yaml
  text: Then Achish said[a], “Where have you made a raid today?” And David said, “Against the Negev of Judah, against the Negev of the Jerahmeelites[b], and against the Negev of the Kenites.”
translation:
  language: tl
  text: Sinabi ni Akis[a], “Saan kayo sumalakay ngayon?” Sumagot si David, “Sa Negev ng Juda, sa Negev ng mga Jerameelita[b], at sa Negev ng mga Kenita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang tekstong Hebreo ay literal na tila nagsasabing, “Hindi ba kayo sumalakay ngayon?” Ngunit sa konteksto, ang diwa ay isang tanong: “Saan kayo sumalakay ngayon?”'
    reason: textual_variant
  - marker: b
    text: O “sa timog ng Juda, sa timog ng mga Jerameelita, at sa timog ng mga Kenita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל פְּשַׁטְתֶּם הַיּוֹם
  choice: Saan kayo sumalakay ngayon?
  rationale: Bagaman ang anyong Masoretiko ay literal na tila ‘Hindi ba kayo sumalakay ngayon?’, ipinahihiwatig ng konteksto at ng mga sinaunang salin na nagtatanong si Akis kung saan nagsagawa ng pagsalakay si David at ang kanyang mga tauhan. Ang ‘sumalakay’ ay natural at malinaw na naghahatid ng militar at pandarambong na diwa ng פּשט.
- source_word: נֶגֶב
  choice: Negev
  rationale: Maaaring mangahulugan ang salita ng ‘timog’ o tumukoy sa tiyak na tuyong rehiyon sa timog. Dahil inuulit ito kasama ng mga pangalan ng lupain o pangkat, pinanatili ang heograpikong pangalang ‘Negev’, habang inilalahad sa talababa ang leksikal na alternatibo.
- source_word: עַל
  choice: sa
  rationale: Sa iniulat na mga lugar na sinalakay, natural sa Filipino ang ‘sumalakay sa’. Nananatili rito ang diwa ng pagkilos laban sa isang target nang hindi gumagamit ng hindi likas na ‘laban sa Negev’.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyong Filipino ng pangalan ng lipi at lupain ng Judah.
- source_word: הַיַּרְחְמְאֵלִי
  choice: mga Jerameelita
  rationale: Ang anyong gentiliko ay tumutukoy sa mga tao o angkan ni Jerameel; ang hulaping ‘-ita’ ay natural na anyong Filipino para sa pangkat-etniko.
- source_word: הַקֵּינִי
  choice: mga Kenita
  rationale: Ang anyong gentiliko ay tumutukoy sa bayang Kenita; ito ang malinaw at nakasanayang anyong Filipino.
- source_word: וַיֹּאמֶר
  choice: Sinabi / Sumagot
  rationale: Isinalin ang unang paglitaw bilang ‘Sinabi’ upang mapanatili ang payak na pandiwang Hebreo. Sa ikalawa, ‘Sumagot’ ang natural na katumbas sa daloy ng usapan, yamang tugon ni David ang kasunod na pananalita.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang ‘kayo’ dahil plural ang pandiwang Hebreo, malamang na tumutukoy kay David kasama ng kanyang mga tauhan. Pinanatili ang ‘Negev’ bilang heograpikong pangalan at inilagay ang ‘timog’ bilang alternatibo sa talababa.
