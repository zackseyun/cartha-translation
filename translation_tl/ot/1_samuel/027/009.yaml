source:
  edition: WLC
  text: וְ/הִכָּ֤ה דָוִד֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א יְחַיֶּ֖ה אִ֣ישׁ וְ/אִשָּׁ֑ה וְ/לָקַח֩ צֹ֨אן וּ/בָקָ֜ר וַ/חֲמֹרִ֤ים וּ/גְמַלִּים֙ וּ/בְגָדִ֔ים וַ/יָּ֖שָׁב וַ/יָּבֹ֥א אֶל אָכִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/009.yaml
  text: David struck the land and left alive neither man nor woman[a], and he took sheep, cattle, donkeys, camels, and clothing. Then he returned and came to Achish.
translation:
  language: tl
  text: Sinalakay ni David ang lupain at wala siyang iniwang buhay na lalaki o babae[a]. Kinuha niya ang mga tupa, mga baka, mga asno, mga kamelyo, at mga kasuotan. Pagkatapos, bumalik siya at pumunta kay Akis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi niya hinayaang mabuhay ang sinumang lalaki o babae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכָּה
  choice: Sinalakay
  rationale: Sa kontekstong militar, ang Hiphil ng נכה ay tumutukoy sa pagsalakay o pagpatay. Ang “sinalakay” ay natural sa modernong Tagalog at hindi nagdaragdag ng detalyeng wala sa Hebreo.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa teritoryong tinitirhan ng mga sinalakay, hindi sa buong daigdig. Ang “lupain” ang tuwiran at angkop na katumbas.
- source_word: וְלֹא יְחַיֶּה אִישׁ וְאִשָּׁה
  choice: wala siyang iniwang buhay, lalaki man o babae
  rationale: Ang Hiphil ng חיה ay nangangahulugang panatilihing buhay o hayaang mabuhay. Malinaw at natural na ipinapahayag ng salin na walang pinaligtas, habang pinananatili ang tahasang pares na lalaki at babae.
- source_word: וְלָקַח
  choice: Kinuha niya
  rationale: Ang לקח ay karaniwang nangangahulugang “kumuha.” Sapat itong malinaw sa konteksto ng samsam nang hindi labis na tinutukoy kung paano kinuha ang mga iyon.
- source_word: צֹאן וּבָקָר
  choice: mga tupa, baka
  rationale: Ang צֹאן ay maliit na alagang hayop at ang בָקָר ay mga bovine livestock. Pinananatili ng “mga tupa, baka” ang konkreto at madaling basahing talaan.
- source_word: חֲמֹרִים וּגְמַלִּים וּבְגָדִים
  choice: asno, kamelyo, at mga kasuotan
  rationale: Mga tuwiran, kasalukuyan, at marangal na katumbas sa Tagalog ng mga hayop at damit na kinuha bilang samsam.
- source_word: וַיָּשָׁב וַיָּבֹא
  choice: Pagkatapos, bumalik siya at pumunta
  rationale: 'Pinananatili ang dalawang sunod na kilos sa Hebreo: bumalik siya mula sa pagsalakay at saka pumunta kay Akis.'
- source_word: אָכִישׁ
  choice: Akis
  rationale: Karaniwang anyong Tagalog ng pangalang Achish.
theological_decisions:
- issue: Paglalarawan sa marahas na ginawa ni David
  choice: Tahasang sinabing walang iniwang buhay si David, lalaki man o babae.
  alternative: Palambutin ang paglalarawan o dagdagan ito ng mas masidhing salitang wala sa Hebreo.
  rationale: Hindi dapat pagaanin o pasidhiin ng salin ang mahirap na pangyayaring isinasalaysay. Pinananatili nito ang payak at mariing pahayag ng teksto nang walang idinagdag na paghatol o pagtatanggol.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “sinalakay” para sa kontekstong militar, at pinanatili ang lantad na banggit sa lalaki at babae. Ang panandang [a] ay nasa pangunahing teksto.
