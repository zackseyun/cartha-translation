  naturalness: 'Kailangan ng maliit ngunit mahalagang ayos para maging malinaw at natural na modernong Tagalog ang parirala: “wala siyang iniwang buhay na lalaki o babae.” Ang talaan ng nasamsam ay maaari ring lagyan ng “mga” upang malinaw na maramihan at mas madulas basahin.'
