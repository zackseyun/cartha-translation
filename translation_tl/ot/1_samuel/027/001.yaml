  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa kanyang sarili” para sa natural na panloob na pananalita, ngunit pinanatili sa talababa ang idyomang “sa kanyang puso.” Pinanatili rin ang larawang “kamay” at ang katawagang “lupain ng mga Filisteo.”
