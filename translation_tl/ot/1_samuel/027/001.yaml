  to: Pagkatapos, sinabi ni David sa kanyang sarili[a], “Balang araw ay mamamatay ako sa kamay ni Saul.[b] Walang mas mabuti para sa akin kundi ang tiyak na makatakas patungo sa lupain ng mga Filisteo.[c] Sa gayon, mawawalan na ng pag-asa si Saul na patuloy akong hanapin sa buong nasasakupan ng Israel,[d] at makakatakas ako sa kanyang kamay.”
