  naturalness: Natural ang pangkalahatang rehistro, ngunit mas malinaw at mas idiomatiko ang “mawawalan na ng pag-asa ... na patuloy akong hanapin” kaysa “susuko na ... sa paghahanap sa akin.”
  terminology: Wasto ang “Filisteo,” “Israel,” at ang pagpapanatili ng “kamay” bilang larawan ng kapangyarihan. Ang “sa kanyang sarili” ay angkop na modernong katumbas ng Hebreong idyoma.
