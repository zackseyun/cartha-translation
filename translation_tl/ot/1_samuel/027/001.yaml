  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל לִבּ֔/וֹ עַתָּ֛ה אֶסָּפֶ֥ה יוֹם אֶחָ֖ד בְּ/יַד שָׁא֑וּל אֵֽין לִ֨/י ט֜וֹב כִּ֣י הִמָּלֵ֥ט אִמָּלֵ֣ט אֶל אֶ֣רֶץ פְּלִשְׁתִּ֗ים וְ/נוֹאַ֨שׁ מִמֶּ֤/נִּי שָׁאוּל֙ לְ/בַקְשֵׁ֤/נִי עוֹד֙ בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֔ל וְ/נִמְלַטְתִּ֖י מִ/יָּדֽ/וֹ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/001.yaml
  text: Then David said in his heart[a], “Now I will one day perish by the hand of Saul. There is nothing better for me than that I should surely escape to the land of the Philistines. Then Saul will despair of seeking me any longer in all the territory of Israel[c][b], and I will escape from his hand.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni David sa kanyang sarili[a], “Balang araw ay mamamatay ako sa kamay ni Saul.[b] Walang mas mabuti para sa akin kundi ang tiyak na makatakas patungo sa lupain ng mga Filisteo.[c] Sa gayon, mawawalan na ng pag-asa si Saul na patuloy akong hanapin sa buong nasasakupan ng Israel,[d] at makakatakas ako sa kanyang kamay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sinabi ni David sa kanyang puso,” isang idyoma para sa pagsasalita sa sarili o panloob na pagninilay.
    reason: idiom
  - marker: b
    text: Maaari ring isalin na “mapapahamak ako” o “matatangay ako.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, inuulit sa magkaugnay na anyo ang pandiwang “tumakas” upang idiin ang katiyakan o tindi ng pagtakas.
    reason: source_emphasis
  - marker: d
    text: Maaari ring isalin na “titigil na si Saul sa patuloy na paghahanap sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל־לִבּוֹ
  choice: sa kanyang sarili
  rationale: Idiomatikong tumutukoy sa panloob na pagsasalita o pagninilay. Mas natural ito sa makabagong Tagalog kaysa sa literal na “sa kanyang puso,” habang inilalahad sa talababa ang mismong larawan ng Hebreo.
- source_word: אֶסָּפֶה
  choice: mapapahamak ako
  rationale: Ang Niphal ng ספה ay maaaring mangahulugang mapawi, matangay, o mapahamak. Ang “mapapahamak” ay natural sa konteksto ng banta ni Saul at hindi nililimitahan ang kahulugan sa tahasang pagpatay lamang.
- source_word: יוֹם אֶחָד
  choice: balang araw
  rationale: Karaniwang ekspresyong temporal na tumutukoy sa isang di-tiyak na araw sa hinaharap; natural at malinaw sa Tagalog.
- source_word: בְּיַד שָׁאוּל
  choice: sa kamay ni Saul
  rationale: Pinananatili ang Hebreong larawan ng kamay bilang kapangyarihan o ahensiya, na nauunawaan din sa Tagalog.
- source_word: אֵין לִי טוֹב כִּי
  choice: Wala nang mas mabuti para sa akin kundi ang
  rationale: Pinananatili ang paghahambing at pansariling pagtataya ni David nang hindi ginagawang mas tiyak o mas interpretatibo ang pahayag.
- source_word: הִמָּלֵט אִמָּלֵט
  choice: ang tumakas
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa pagtakas. Sa pangunahing teksto, natural na ipinahihiwatig ng buong pangungusap ang matibay na pasiya; ipinaliliwanag sa talababa ang tahasang diin ng Hebreo.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: patungo sa lupain ng mga Filisteo
  rationale: Tuwiran at malinaw na katumbas ng heograpikong parirala; iniiwasan ang mas teknikal na pangalang “Filistia.”
- source_word: וְנוֹאַשׁ מִמֶּנִּי שָׁאוּל
  choice: susuko na si Saul sa paghahanap sa akin
  rationale: Sa kontekstong ito, ang יאשׁ ay pagkawala ng pag-asa na humahantong sa pagtigil. Ang “susuko na” ay natural at pinananatili ang parehong diwa.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: sa buong nasasakupan ng Israel
  rationale: Dito, ang גְּבוּל ay tumutukoy sa kabuuang teritoryo o saklaw, hindi lamang sa guhit ng hangganan.
- source_word: וְנִמְלַטְתִּי מִיָּדוֹ
  choice: at makakatakas ako sa kanyang kamay
  rationale: Pinananatili ang pag-uulit ng motibo ng pagtakas at ang larawan ng “kamay” bilang kapangyarihan o kontrol ni Saul.
