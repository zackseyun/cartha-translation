base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/012.yaml
  text: And Achish trusted David[a], saying, “He has surely made himself stink among his people in Israel[b], so he will be my servant forever.”
translation:
  language: tl
  text: At nagtiwala si Akis kay David at sinabi, “Tiyak na ginawa niyang kasuklam-suklam ang sarili niya[a] sa gitna ng kanyang bayang Israel, kaya magiging lingkod[b] ko siya magpakailanman.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Tiyak na pinabaho niya ang sarili niya sa kanyang bayan sa Israel.” Ang “maging mabaho” ay isang idyoma para sa pagiging kasuklam-suklam o kinamumuhian.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “alipin.” Gayunman, sa kontekstong ito ay malamang na tinutukoy ang patuloy na paglilingkod at pagdepende kay Akis, sa halip na tahasang idiin ang katayuan ng isang taong pag-aari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: nagtiwala
  rationale: Ang Hifil ng אמן na may ב ay nagpapahayag ng pagtitiwala o paglalagak ng tiwala sa isang tao; mas angkop dito ang “nagtiwala” kaysa “naniwala.”
- source_word: בְּדָוִד
  choice: kay David
  rationale: Likas sa Tagalog ang paggamit ng “kay” para sa taong pinagtitiwalaan.
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Pinananatili nito ang karaniwang pormulang nagpapakilala sa kasunod na sinabi, nang hindi tiyak na nagpapasya kung ito ay binigkas nang malakas o saloobin lamang ni Akis.
- source_word: הַבְאֵשׁ הִבְאִישׁ
  choice: Tiyak na ginawa niyang kasuklam-suklam ang sarili niya
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin. Ang literal na larawan ay “pinabaho,” ngunit ang “ginawang kasuklam-suklam” ay natural sa modernong Tagalog at malinaw na naghahatid ng idyomatikong diwa; inilalahad sa talababa ang literal na larawan.
- source_word: בְּעַמּוֹ בְיִשְׂרָאֵל
  choice: sa kanyang bayang Israel
  rationale: Ipinahahayag nito ang kaugnayan ni David sa sarili niyang sambayanan at kinikilala ang Israel bilang bayang tinutukoy, nang hindi nagdaragdag ng paliwanag na wala sa Hebreo.
- source_word: וְהָיָה לִי
  choice: kaya magiging ... ko siya
  rationale: Ang “kaya” ay malinaw na naghahatid ng resultang ipinapalagay ni Akis, at ang ayos ng pangungusap ay natural sa Tagalog.
- source_word: לְעֶבֶד
  choice: lingkod
  rationale: Maaaring mangahulugan ang עֶבֶד ng lingkod o alipin. Sa konteksto, inaasahan ni Akis ang patuloy na paglilingkod at pagdepende ni David sa kanya; hindi tahasang binibigyang-diin ang katayuang ari-arian.
- source_word: עוֹלָם
  choice: magpakailanman
  rationale: Ipinahahayag nito ang inaasahan ni Akis na walang takdang wakas ang paglilingkod ni David, habang pinananatili ang malawak na saklaw ng Hebreong עוֹלָם.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Akis,” ang karaniwang anyong Tagalog ng pangalan. Isinalin nang idyomatiko sa pangunahing teksto ang Hebreong larawan ng pagiging “mabaho,” ngunit pinanatili ang literal na metapora sa talababa. Inilipat ang mga pananda ng talababa sa mismong mga salitang tinatalakay ng bawat tala.
