  to: Nagpatirapa siya sa paanan ni David at sinabi[a], “Panginoon ko, sa akin ang sala. Nakikiusap ako, hayaan mong magsalita ang iyong lingkod sa iyong pandinig, at pakinggan mo ang mga salita ng iyong lingkod.”
