base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/024.yaml
  text: She fell at his feet and said[a], “On me, my lord, be the guilt. Please let your servant speak in your hearing[b], and hear the words of your servant.”
translation:
  language: tl
  text: Nagpatirapa siya sa paanan ni David at sinabi[a], “Panginoon ko, sa akin ang sala. Nakikiusap ako, hayaan mong magsalita ang iyong lingkod sa iyong pandinig, at pakinggan mo ang mga salita ng iyong lingkod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Panginoon ko, ako ang mananagot.” Siksik na idyoma sa Hebreo ang literal na “Sa akin, panginoon ko, ang sala,” na nagpapahayag ng kusang pag-ako ng sala o pananagutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: Nagpatirapa siya sa paanan ni David
  rationale: Ang Hebreong idyoma ay literal na ‘bumagsak sa kanyang mga paa’ at tumutukoy sa kilos ng pagpapakumbaba at pagsusumamo. Likas sa Tagalog ang ‘nagpatirapa sa paanan’; nilinaw ang reperenteng si David mula sa konteksto.
- source_word: בִּי אֲנִי אֲדֹנִי הֶעָוֹן
  choice: Panginoon ko, ako ang managot sa kasalanang ito
  rationale: Ang siksik na pahayag ay kusang pag-angkin sa pananagutan. Pinananatili ng ‘ako ang managot’ ang diwa ng kasalanang ipinapasan sa nagsasalita nang hindi ipinahihiwatig na talagang siya ang gumawa nito.
- source_word: אֲדֹנִי
  choice: Panginoon ko
  rationale: Magalang na pantawag ito ni Abigail kay David, hindi pagtukoy sa Diyos. Ang maliit na titik sa ‘panginoon’ ay naghihiwalay sa panlipunang titulo mula sa banal na pangalan o titulo.
- source_word: וּתְדַבֶּר נָא
  choice: Nakikiusap ako, hayaan mong magsalita
  rationale: Ipinahahayag ng נָא ang magalang at mapilit na pagsusumamo. Natural sa modernong Tagalog ang ganitong pahintulot na pakiusap.
- source_word: אֲמָתְךָ / אֲמָתֶךָ
  choice: iyong lingkod
  rationale: Ang אמה ay partikular na pambabaeng katawagan sa isang lingkod. Sapagkat malinaw na babae si Abigail, natural sa Tagalog ang ‘iyong lingkod’; ipinaliliwanag sa talababa ang kasariang hayagang taglay ng salitang Hebreo.
- source_word: בְּאָזְנֶיךָ
  choice: sa iyong pandinig
  rationale: Malapit ito sa Hebreong ‘sa iyong mga tainga’ habang nananatiling nauunawaan at marangal sa Tagalog.
- source_word: וּשְׁמַע אֵת דִּבְרֵי
  choice: at pakinggan mo ang mga salita ng
  rationale: Pinananatili ang tahasang pautos at ang pag-uulit ng ‘mga salita,’ na angkop sa pormal na pagsusumamo ni Abigail.
theological_decisions:
- issue: Pag-angkin ni Abigail sa kasalanan
  choice: ako ang managot sa kasalanang ito
  alternative: akin ang kasalanan
  rationale: Ang Hebreo ay maaaring marinig bilang pag-angkin ng sala o bilang kahandaang akuin ang pananagutan. Pinili ang ikalawa upang mapanatili ang retorikal na kilos ni Abigail nang hindi nilulutas kung siya mismo ang may moral na sala.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig. Ginamit ang ‘nagpatirapa’ at ‘sa iyong pandinig’ upang mapanatili ang pormal at mapagpakumbabang pananalita ni Abigail, habang iniwasan ang lubhang makaluma o denominasyonal na mga salita.
