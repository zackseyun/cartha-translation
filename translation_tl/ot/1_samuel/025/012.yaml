- from: Kaya bumalik sa kanilang dinaanan ang mga tauhan ni David. Pagdating nila, sinabi nila sa kanya ang lahat ng salitang iyon.[a]
  to: Kaya tumalikod ang mga tauhan ni David at naglakbay pabalik. Pagdating nila kay David, isinalaysay nila sa kanya ang lahat ng salitang ito.[a]
  rationale: Pinalitan ang pariralang maaaring magpahiwatig lamang ng mga lugar na dinaanan ng pananalitang malinaw na nagsasaad ng pagtalikod at paglalakbay pabalik. Idinagdag ang “kay David” upang maging malinaw ang tinutukoy ng “kanya,” at pinanatili ang pagdating bilang kasunod na kilos. Ginawang “mga salitang ito” ang panghalip na pamatlig upang mas malapit sa “mga salitang ito” ng Hebreo.
