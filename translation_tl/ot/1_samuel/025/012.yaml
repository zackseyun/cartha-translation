  text: So David’s young men turned back on their way[a], and they returned and came and told him all these words.
translation:
  language: tl
  text: Kaya tumalikod ang mga tauhan ni David at naglakbay pabalik. Pagdating nila kay David, isinalaysay nila sa kanya ang lahat ng salitang ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lahat ng bagay na ito.” Ang salitang Hebreo ay maaaring tumukoy sa mga salitang sinabi o sa mga bagay at pangyayari; dito, mas angkop ang “mga salita” dahil ang iniulat nila ay ang tugon ni Nabal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַפְכוּ
  choice: bumalik
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa pagbaligtad ng direksiyon. Likas sa modernong Tagalog ang “bumalik” at hindi nito ipinahihiwatig ang literal na pagbaligtad.
- source_word: נַעֲרֵי דָוִד
  choice: mga tauhan ni David
  rationale: Maaaring tumukoy ang נַעַר sa kabataang lalaki, tagapaglingkod, o tauhan. Dito, sila ang mga isinugo ni David; ang “mga tauhan” ay natural at hindi labis na nagtatakda ng kanilang edad o katayuang alipin.
- source_word: לְדַרְכָּם
  choice: sa kanilang dinaanan
  rationale: Literal itong “sa kanilang daan,” at inilalarawan dito ang ruta ng kanilang pagbabalik. Ang “sa kanilang dinaanan” ay malinaw at natural sa Tagalog.
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ
  choice: Pagdating nila
  rationale: Magkakasunod sa Hebreo ang “bumalik sila at dumating.” Naipahayag na ng “bumalik” ang pag-uwi, kaya ang “Pagdating nila” ay natural na nagpapanatili sa kasunod na yugto ng kilos nang hindi mabigat o paulit-ulit.
- source_word: וַיַּגִּדוּ לוֹ
  choice: sinabi nila sa kanya
  rationale: Ang נגד ay nangangahulugang magsabi o mag-ulat. Ang “sinabi nila sa kanya” ay payak at angkop sa salaysay.
- source_word: כְּכֹל הַדְּבָרִים הָאֵלֶּה
  choice: ang lahat ng salitang iyon
  rationale: Maaaring mangahulugan ang דְּבָרִים ng mga salita o mga bagay/pangyayari. Dahil ang inuulat ay ang pasalitang tugon ni Nabal, pinili ang “mga salita,” habang inilalagay sa talababa ang tunay na alternatibo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mga tauhan” sa halip na “mga binata” o “mga lingkod” upang hindi labis na tukuyin ang edad o katayuan ng mga isinugo ni David. Bahagyang pinakinis ang magkakasunod na pandiwa ng Hebreo upang maging natural ang daloy sa Tagalog.
