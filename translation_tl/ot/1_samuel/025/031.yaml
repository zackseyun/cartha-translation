  terminology: Ang “aking panginoon,” “Yahweh,” at “inyong babaeng lingkod” ay angkop at tapat sa panlipunang rehistro, banal na pangalan, at pambabaeng anyo ng אֲמָתֶךָ. Pinanatili ang “katitisuran ng puso” bilang literal na talinghaga, na may paliwanag sa talababa.
