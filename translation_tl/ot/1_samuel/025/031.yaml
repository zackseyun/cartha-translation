revisions:
- from: At hindi ito magiging dahilan ng masakit na panghihinayang[a] o katitisuran ng puso[b] sa aking panginoon—na nagbuhos kayo ng dugo nang walang dahilan o na ipinaghiganti ng aking panginoon ang kanyang sarili.[c] At kapag ginawan ni Yahweh ng mabuti ang aking panginoon, alalahanin ninyo ang inyong lingkod na babae.”[d]
  to: At hindi ito magiging dahilan ng masakit na panghihinayang[a] at katitisuran ng puso[b] para sa aking panginoon—dahil nagbuhos kayo ng dugo nang walang dahilan at dahil ipinaghiganti ng aking panginoon ang kanyang sarili.[c] At kapag pinagpakitaan ni Yahweh ng kabutihan ang aking panginoon, alalahanin ninyo ang inyong babaeng lingkod.[d]
  rationale: Pinalitan ang eksklusibong “o” ng nag-uugnay na “at” upang maipakita ang koordinasyon ng dalawang infinitive sa Hebreo. Pinakinis ang huling temporal na sugnay para sa likas na Tagalog at inalis ang hindi katugmang panipi. Hindi binago ang kontekstuwal na “ipinaghiganti ... ang kanyang sarili”; malinaw na inilalahad ng talababa ang mas literal na kahulugang “iniligtas ... ang kanyang sarili.”
