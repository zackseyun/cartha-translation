base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/031.yaml
  text: 'And this will not be a cause of grief to you or a stumbling block of heart to my lord: either that you have shed blood without cause or that my lord has avenged himself[a]. And when Yahweh has dealt well with my lord[d][c][b], then remember your servant.'
translation:
  language: tl
  text: At hindi ito magiging dahilan ng masakit na panghihinayang[a] at katitisuran ng puso[b] para sa aking panginoon—dahil nagbuhos kayo ng dugo nang walang dahilan at dahil ipinaghiganti ng aking panginoon ang kanyang sarili.[c] At kapag pinagpakitaan ni Yahweh ng kabutihan ang aking panginoon, alalahanin ninyo ang inyong babaeng lingkod.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahilan ng pagkatisod” o “pagkakataon ng pagsisisi.” Bihira ang salitang Hebreo at maaaring tumukoy sa isang bagay na kalauna’y nagdudulot ng masakit na panghihinayang.
    reason: lexical_alternative
  - marker: b
    text: Literal na “katitisuran ng puso”; sa konteksto, isang sagabal o bigat sa budhi.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “iniligtas ng aking panginoon ang kanyang sarili.” Karaniwang nangangahulugang “iligtas” ang pandiwang Hebreo, ngunit sa kontekstong ito ay tumutukoy ito sa pagkuha ni David ng paghihiganti sa sarili niyang mga kamay.
    reason: lexical_alternative
  - marker: d
    text: Ang Hebreo ay tahasang “inyong babaeng lingkod,” isang mapagpakumbabang pagtukoy ni Abigail sa sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפוּקָה
  choice: dahilan ng masakit na panghihinayang
  rationale: Bihira ang pangngalang Hebreo at maaaring tumukoy sa pagkatisod, pagkabigla, o bagay na kalauna'y nagdudulot ng matinding pagsisisi. Ang salin ay natural sa Tagalog at angkop sa babala ni Abigail tungkol sa magiging moral na dalamhati ni David.
- source_word: מִכְשׁוֹל לֵב
  choice: katitisuran ng puso
  rationale: Pinananatili nito ang tahasang talinghaga ng Hebreo, habang ipinahihiwatig ng konteksto ang isang sagabal o bigat sa budhi.
- source_word: לַאדֹנִי / אֲדֹנִי
  choice: aking panginoon
  rationale: Magalang at mapagpakumbabang tawag ito ni Abigail kay David; hindi ito tumutukoy sa pagka-Diyos.
- source_word: לִשְׁפָּךְ דָּם חִנָּם
  choice: nagbuhos kayo ng dugo nang walang dahilan
  rationale: Ang חִנָּם ay tumutukoy rito sa pagdanak ng dugong walang sapat o makatarungang dahilan.
- source_word: לְהוֹשִׁיעַ ... לוֹ
  choice: ipinaghiganti ng aking panginoon ang kanyang sarili
  rationale: Karaniwang nangangahulugang ‘iligtas’ ang pandiwa, ngunit sa konteksto ay tinutukoy nito ang marahas na pagkuha ni David ng katarungan para sa sarili. Inilalagay sa talababa ang mas literal na posibilidad upang mapanatili ang tunay na leksikal na tensiyon.
- source_word: וְהֵיטִב יְהוָה
  choice: kapag ginawan ni Yahweh ng mabuti
  rationale: 'Ang sugnay ay nakatuon sa hinaharap: inaasahan ni Abigail ang kabutihang gagawin ni Yahweh kay David.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֲמָתֶךָ
  choice: inyong lingkod na babae
  rationale: Hayagang pambabae ang katawagang Hebreo at mapagpakumbabang pagtukoy ito ni Abigail sa sarili.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong Yahweh sa transliterasyon.
- issue: Ang kilos ni David sa pariralang לְהוֹשִׁיעַ ... לוֹ
  choice: ipinaghiganti ang kanyang sarili
  alternative: iniligtas ang kanyang sarili
  rationale: Mas malinaw sa salaysay ang diwa ng sariling paghihiganti, ngunit hindi itinatago ang karaniwang kahulugang ‘iligtas’; ibinibigay ito bilang alternatibo sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang magalang na panghalip na “kayo/ninyo” sa pakikipag-usap ni Abigail kay David, at pinanatili ang paulit-ulit na “aking panginoon” upang maipakita ang mapagpakumbabang rehistro at ang paglipat ng Hebreo sa ikatlong panauhan.
