base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/015.yaml
  text: Yet the men were very good to us[a], and we were not mistreated[b], nor did we miss anything all the days we went about with them while we were in the field.
translation:
  language: tl
  text: Ngunit napakabuti sa amin ng mga lalaking iyon. Hindi kami ipinahiya[a], at wala kaming nawalang anuman[b] sa buong panahong naglilibot kami kasama nila habang nasa parang kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi kami hinamak” o “Hindi kami ininsulto.”
    reason: lexical_alternative
  - marker: b
    text: O “wala kaming kinulang” o “walang anumang nawala sa amin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Ngunit ... ang mga lalaking iyon
  rationale: Ang אֲנָשִׁים ay “mga lalaki.” Isinalin ang waw na “Ngunit” upang maipakita ang pagsalungat ng patotoong ito sa masamang pagtingin ni Nabal sa konteksto.
- source_word: טֹבִים לָנוּ מְאֹד
  choice: napakabuti sa amin
  rationale: Pinananatili nito ang payak na paglalarawan ng טוֹבִים at malinaw na ipinahihiwatig ang napakabuting pakikitungo nila sa mga pastol.
- source_word: הָכְלַמְנוּ
  choice: Hindi kami ipinahiya
  rationale: Ang anyong Hophal ay pasibo at tumutukoy sa hindi pagkapahiya, paghamak, o pag-insulto. Pinananatili ng salin ang pasibong diwa nang hindi nilalawak sa pangkalahatang “minaltrato.”
- source_word: פָקַדְנוּ מְאוּמָה
  choice: wala kaming anumang nawala
  rationale: Sa negatibong pangungusap na ito, ipinapahayag ng parirala na walang anumang pag-aari ang nawala o hindi na mabilang.
- source_word: כָּל יְמֵי
  choice: sa buong panahong
  rationale: Likas na Filipino ito para sa idyomang Hebreo na tumutukoy sa kabuuan ng panahong tinatalakay.
- source_word: הִתְהַלַּכְנוּ אִתָּם
  choice: naglilibot kami kasama nila
  rationale: Ipinahihiwatig ng Hitpael ng הלך ang patuloy o paulit-ulit na pagkilos habang kasama sila; hindi ito pinapantay lamang sa “kasama namin sila.”
- source_word: בִּהְיוֹתֵנוּ בַּשָּׂדֶה
  choice: habang nasa parang kami
  rationale: Ang שָׂדֶה rito ay bukas na lupain o pastulan. Ang “parang” ay natural sa konteksto ng pagpapastol.
