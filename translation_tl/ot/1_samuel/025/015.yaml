  source_fidelity: 'Tumpak ang pangunahing diwa ng salin: mabuti ang pakikitungo ng mga lalaki, hindi ipinahiya ang mga pastol, walang nawala, at magkakasama sila sa parang sa buong panahon. Gayunman, ang “wala kaming anumang nawala” ay hindi likas na pagkakabuo sa Filipino at maaaring pansamantalang mabasa bilang pag-uulit o malabong pagmamay-ari. Ang “wala kaming nawalang anuman” ay malinaw na naghahatid ng negatibong pahayag na walang anumang nawala.'
  naturalness: Makabago at angkop ang rehistro. Mas natural ang “wala kaming nawalang anuman” kaysa “wala kaming anumang nawala.” Ang ibang bahagi, kabilang ang “naglilibot kami kasama nila” at “nasa parang kami,” ay katanggap-tanggap at pinananatili ang aspektong nagpapatuloy ng Hebreo.
  terminology: Ang “ipinahiya” ay wastong pasibong katumbas ng הָכְלַמְנוּ at ang talababa ay nagbibigay ng mga katanggap-tanggap na alternatibo. Ang “parang” ay angkop sa שָׂדֶה sa kontekstong pastoral. Walang terminong teolohikal na nangangailangan ng pagbabago.
