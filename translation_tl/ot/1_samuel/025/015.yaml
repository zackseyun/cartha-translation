  to: Ngunit napakabuti sa amin ng mga lalaking iyon. Hindi kami ipinahiya[a], at wala kaming nawalang anuman[b] sa buong panahong naglilibot kami kasama nila habang nasa parang kami.
  rationale: Pinalitan lamang ang di-likas na ayos na “wala kaming anumang nawala” ng “wala kaming nawalang anuman.” Pinananatili nito ang saklaw na “anuman,” ang negatibong kahulugan, at ang diwang walang nawawalang pag-aari. Inayos din nang bahagya ang talababa upang magbigay ng tunay na mga alternatibong salin.
