base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/042.yaml
  text: Abigail quickly got up and rode on the donkey, with five of her young women going after her; she went after David's messengers and became his wife.
translation:
  language: tl
  text: Nagmadaling tumayo si Abigail at sumakay sa asno. Kasama niya ang lima sa kanyang mga dalaga na naglalakad sa likuran niya. Sumunod siya sa mga sugo ni David at naging asawa niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּקָם
  choice: Nagmadaling tumayo
  rationale: Likas at tuwirang ipinahahayag ang magkasunod na kilos na pagmamadali at pagtayo.
- source_word: נַעֲרֹתֶיהָ
  choice: kanyang mga dalaga
  rationale: Tumutukoy sa mga kabataang babaeng kasama o naglilingkod kay Abigail; pinananatili ng “mga dalaga” ang saklaw nang hindi labis na tinutukoy ang kanilang katayuan.
- source_word: הַהֹלְכוֹת לְרַגְלָהּ
  choice: na naglalakad sa likuran niya
  rationale: Ang idyomang literal na “sa kanyang mga paa” ay tumutukoy sa pagsunod o paglalakad sa likuran bilang mga kasama.
- source_word: וַתֵּלֶךְ אַחֲרֵי מַלְאֲכֵי דָוִד
  choice: Sumunod siya sa mga sugo ni David
  rationale: Ang “sumunod” ay natural na katumbas ng paglakad kasunod ng mga isinugo ni David.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: at naging asawa niya
  rationale: Tapat sa karaniwang pormulang Hebreo para sa pag-aasawa at malinaw sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at angkop sa salaysay. Ginamit ang “asno” bilang karaniwang terminong biblikal at ang “sugo” para sa mga mensaherong ipinadala ni David.
