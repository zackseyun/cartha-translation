  text: וַ/יֹּ֥אמֶר דָּוִ֖ד לַ/אֲבִיגַ֑ל בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֧ר שְׁלָחֵ֛/ךְ הַ/יּ֥וֹם הַ/זֶּ֖ה לִ/קְרָאתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/032.yaml
  text: David said to Abigail[a], “Blessed be Yahweh, the God of Israel, who sent you this day to meet me.”
translation:
  language: tl
  text: Sinabi ni David kay Abigail, “Purihin si Yahweh, ang Diyos ng Israel, na nagsugo sa iyo sa araw na ito[a] upang salubungin ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “ngayon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Ipinagpapatuloy ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang “Sinabi” nang hindi na tahasang isinasalin ang panimulang pang-ugnay.
- source_word: לַאֲבִיגַל
  choice: kay Abigail
  rationale: Ang לְ ay nagmamarka sa taong kinakausap; “kay Abigail” ang likas na anyo sa Tagalog.
- source_word: בָּרוּךְ
  choice: Purihin
  rationale: Isa itong pormulang doksolohikal. Mas likas at marangal sa Tagalog ang “Purihin si Yahweh” kaysa sa literal ngunit alanganing “Pinagpala si Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan sa pamamagitan ng transliterasyon sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tinutukoy ng pariralang konstrakto si Yahweh bilang Diyos ng Israel; malinaw at natural ang appositional na anyong ito sa Tagalog.
- source_word: אֲשֶׁר
  choice: na
  rationale: Ipinakikilala ng relative particle ang sugnay na tumutukoy kay Yahweh; “na” ang payak at likas na katumbas.
- source_word: שְׁלָחֵךְ
  choice: nagsugo sa iyo
  rationale: Ipinahahayag ng perfect verb at 2fs suffix ang natapos na pagkilos ng Diyos at ang babaeng layon nito, si Abigail.
- source_word: הַיּוֹם הַזֶּה
  choice: sa araw na ito
  rationale: Pinananatili nito ang tahasang demonstratibong diwa at ang marangal na tono; maaari rin itong unawain bilang “ngayon.”
- source_word: לִקְרָאתִי
  choice: upang salubungin ako
  rationale: Ipinahahayag ng infinitive na may לְ ang layunin ng pagsusugo. Ang “salubungin ako” ay natural sa konteksto ng pagpunta ni Abigail upang makatagpo si David.
theological_decisions:
- issue: Paglalarawan sa doksolohikal na בָּרוּךְ kapag Diyos ang tinutukoy
  choice: Purihin si Yahweh
  alternative: Pinagpala si Yahweh
  rationale: Ang Hebreo ay pormula ng pagpapala o pagpupuri, hindi pahayag na tumanggap ang Diyos ng biyaya mula sa mas mataas na pinagmulan. Inihahatid ng “Purihin” ang tungkuling doksolohikal nang hindi dinaragdagan ang teolohiya ng talata.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit sa tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang katangian nito bilang personal na pangalan sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Purihin” bilang natural na pormulang doksolohikal at inilagay ang talababa pagkatapos ng katumbas ng הַיּוֹם הַזֶּה, kung saan ito aktuwal na nauugnay.
