base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/028.yaml
  text: Please forgive the transgression of your servant[a], for Yahweh will surely make my lord a lasting house, because my lord fights Yahweh’s battles, and evil will not be found in you all your days.
translation:
  language: tl
  text: Patawarin mo sana ang pagkakasala ng iyong lingkod na babae, sapagkat tiyak na itatatag ni Yahweh para sa aking panginoon ang isang matatag na sambahayan[a], dahil nakikipaglaban ang aking panginoon sa mga labanan ni Yahweh. At walang kasamaang masusumpungan sa iyo sa buong buhay mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matatag na angkan” o “pangmatagalang dinastiya.” Ang “sambahayan” dito ay tumutukoy sa isang matatag at nagpapatuloy na linya ng lahi, hindi lamang sa isang tahanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא לְפֶשַׁע
  choice: Patawarin mo sana ang pagkakasala
  rationale: Ang idyomang literal na ‘buhatin sana ang pagsuway’ ay nangangahulugang magpatawad. Pinananatili ng ‘sana’ ang magalang at taimtim na pakiusap.
- source_word: אֲמָתֶךָ
  choice: iyong lingkod
  rationale: Babae ang tinutukoy ng אמה, ngunit sa natural na modernong Tagalog ay sapat ang ‘lingkod’ sa mapagpakumbabang pagtukoy ni Abigail sa sarili; malinaw na ang kasarian niya mula sa konteksto.
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: tiyak na itatatag
  rationale: Ipinahahayag ng infinitive absolute kasama ng finite verb ang katiyakan at diin. Ang ‘tiyak na’ ang likas na katumbas nito.
- source_word: לַאדֹנִי
  choice: para sa aking panginoon
  rationale: Magalang na tawag ito ni Abigail kay David. Ang ‘panginoon’ ay angkop sa marangal na pananalita at hindi tumutukoy rito sa Diyos.
- source_word: בַּיִת נֶאֱמָן
  choice: isang matatag na sambahayan
  rationale: Ang ‘bahay/sambahayan’ ay metapora para sa matatag at nagpapatuloy na angkan o dinastiya. Pinananatili ng salin ang metapora habang ipinahihiwatig ng ‘matatag’ ang pagiging panatag at pangmatagalan.
- source_word: מִלְחֲמוֹת יְהוָה ... נִלְחָם
  choice: ipinaglalaban ... ang mga pakikipaglaban ni Yahweh
  rationale: Ang participle ay naglalarawan sa patuloy o kinagawiang gawain ni David. Ang ‘ipinaglalaban’ ay nagpapakita na nakikibaka siya para sa layunin ni Yahweh, habang pinananatili ang pag-uulit ng ugat na ‘laban.’
- source_word: וְרָעָה לֹא תִמָּצֵא בְךָ
  choice: At walang kasamaang masusumpungan sa iyo
  rationale: Pinananatili ng ‘kasamaan’ ang moral na bigat ng רעה, at ng ‘masusumpungan sa iyo’ ang pasibong anyo at bahagyang ambiguwidad kung ito ay kasamaang nasa pagkatao o nakaugnay sa gawa ng tao.
- source_word: מִיָּמֶיךָ
  choice: habang nabubuhay ka
  rationale: Idyomatikong tumutukoy ang parirala sa buong panahon ng buhay. Mas natural ito sa modernong Tagalog kaysa sa literal na ‘sa lahat ng iyong mga araw.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang ‘Yahweh’ sa halip na palitan ito ng titulong ‘PANGINOON.’
theological_decisions:
- issue: Dinastikong kahulugan ng בַּיִת נֶאֱמָן
  choice: isang matatag na sambahayan
  alternative: isang pangmatagalang dinastiya; isang matatag na angkan
  rationale: Malamang na tumutukoy ang ‘sambahayan’ sa nagpapatuloy na linya o maharlikang angkan ni David. Pinananatili ang biblikal na metapora sa halip na ganap itong ipaliwanag bilang ‘dinastiya.’
- issue: Saklaw ng רָעָה
  choice: kasamaan
  alternative: kapahamakan; masamang gawa
  rationale: Maaaring tumukoy ang salita sa kasamaan, kapahamakan, o masamang gawa. Sa konteksto ng pagpigil kay David sa pagkakasala, pinananatili ng ‘kasamaan’ ang moral na diwa nang hindi labis na nililimitahan ang saklaw.
translation_notes:
  register: Makabago, magalang, at marangal na Filipino. Ginamit ang ‘sana’ upang ipakita ang mapagpakumbabang pakiusap ni Abigail, at pinanatili ang ‘aking panginoon’ bilang magalang na tawag kay David. Iniwasan ang labis na arkaikong ayos habang pinananatili ang metapora at diin ng Hebreo.
