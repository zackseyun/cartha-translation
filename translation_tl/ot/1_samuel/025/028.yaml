revisions:
- from: Patawarin mo sana ang pagkakasala ng iyong lingkod, sapagkat tiyak na itatatag ni Yahweh para sa aking panginoon ang isang matatag na sambahayan[a], dahil ipinaglalaban ng aking panginoon ang mga pakikipaglaban ni Yahweh. At walang kasamaang masusumpungan sa iyo habang nabubuhay ka.
  to: Patawarin mo sana ang pagkakasala ng iyong lingkod na babae, sapagkat tiyak na itatatag ni Yahweh para sa aking panginoon ang isang matatag na sambahayan[a], dahil nakikipaglaban ang aking panginoon sa mga labanan ni Yahweh. At walang kasamaang masusumpungan sa iyo sa buong buhay mo.
  rationale: Ang rebisyon ay ipinapakita ang kasarian sa אֲמָתֶךָ, pinapalitan ang di-likas na “mga pakikipaglaban” ng “mga labanan,” at gumagamit ng mas tuwirang idyoma para sa מִיָּמֶיךָ. Hindi binabago ang kahulugan o ang dinastikong ambiguwidad ng “sambahayan.”
