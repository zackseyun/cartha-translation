    text: O “matatag na angkan” o “pangmatagalang dinastiya.” Ang “sambahayan” dito ay tumutukoy sa isang matatag at nagpapatuloy na linya ng lahi, hindi lamang sa isang tahanan.
    reason: lexical_alternative
