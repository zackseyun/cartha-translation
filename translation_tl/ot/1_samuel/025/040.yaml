base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/040.yaml
  text: So David’s servants came to Abigail at Carmel and spoke to her[a], saying, “David has sent us to you to take you for himself as a wife.”
translation:
  language: tl
  text: Dumating ang mga lingkod ni David kay Abigail sa Carmel at sinabi sa kanya, “Isinugo kami ni David sa iyo upang kunin ka bilang asawa niya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang pakasalan ka”; sa literal, “upang kunin ka para sa kanya bilang asawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dumating
  rationale: Ang בוא ay maaaring tumukoy sa pagdating o pagpunta ayon sa pananaw ng salaysay. Dito, ang pagdating ng mga sugo sa kinaroroonan ni Abigail ang binibigyang-diin.
- source_word: עַבְדֵי דָוִד
  choice: mga lingkod ni David
  rationale: Sa kontekstong ito, ang עֶבֶד ay tumutukoy sa mga tauhang isinugo ni David, hindi sa katayuang alipin; malinaw at marangal ang “mga lingkod.”
- source_word: אֶל אֲבִיגַיִל הַכַּרְמֶלָה
  choice: kay Abigail sa Carmel
  rationale: Ipinahihiwatig ng mga anyong direksiyonal ang paglapit kay Abigail at pagpunta sa Carmel. Natural sa Tagalog ang paglalahad ng natapos na paglalakbay bilang pagdating sa kanya roon.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ לֵאמֹר
  choice: at sinabi sa kanya
  rationale: Karaniwang pormula ito sa Hebreo sa pagpapakilala ng tuwirang pananalita. Ang “sinabi sa kanya” ay natural sa modernong Tagalog nang hindi dinaragdagan ang kahulugan.
- source_word: שְׁלָחָנוּ
  choice: Isinugo kami
  rationale: Ipinahahayag ng pandiwa ang natapos na pagsusugo sa kanila bilang mga kinatawan ni David. Ang “isinugo” ay angkop sa pormal ngunit madaling maunawaang rehistro.
- source_word: לְקַחְתֵּךְ לוֹ לְאִשָּׁה
  choice: upang kunin ka bilang asawa niya
  rationale: Pinananatili nito ang Hebreong idyomang “kunin ... bilang asawa” at malinaw na si David ang kukuha kay Abigail bilang sarili niyang asawa. Ang mas natural na kahulugang “pakasalan ka” ay inilagay sa talababa.
