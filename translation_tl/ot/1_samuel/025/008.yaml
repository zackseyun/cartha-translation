base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/008.yaml
  text: Ask your young men[a], and they will tell you. So let the young men find favor in your eyes, for we have come on a festive day[b]. Please give whatever your hand finds to your servants and to your son David.
translation:
  language: tl
  text: Tanungin mo ang iyong mga tauhan, at sasabihin nila sa iyo. Kaya sana’y makamit ng mga tauhan ang iyong pagsang-ayon, sapagkat dumating kami sa isang masayang araw.[a] Pakibigay sa iyong mga lingkod at sa iyong anak na si David ang anumang masumpungan ng iyong kamay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “sa isang mabuting araw.” Sa konteksto, tumutukoy ito sa masayang panahon ng paggugupit ng mga tupa.'
    reason: cultural_note
  - marker: b
    text: Ibig sabihin, “anumang maibibigay mo” o “anumang mailalaan mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל אֶת נְעָרֶיךָ
  choice: Tanungin mo ang iyong mga tauhan
  rationale: Ang נַעַר ay maaaring mangahulugang binata, lingkod, o tauhan. Sa konteksto, sila ang mga tauhan ni Nabal na makapagpapatunay sa ginawa ng mga tauhan ni David; pinananatili rin ng “mga tauhan” ang ugnayan sa הַנְּעָרִים sa kasunod na sugnay.
- source_word: וְיַגִּידוּ לָךְ
  choice: at sasabihin nila sa iyo
  rationale: Tuwirang isinasalin ang Hiphil ng נגד bilang pagsasabi o pag-uulat, sa natural na modernong Tagalog.
- source_word: וְיִמְצְאוּ הַנְּעָרִים חֵן בְּעֵינֶיךָ
  choice: Kaya loobin mong kalugdan ang mga tauhan
  rationale: Ang idyomang “makasumpong ng biyaya sa iyong mga mata” ay ginawang natural na pakiusap sa Tagalog habang pinananatili ang diwa ng jussive at ng paghiling ng mabuting pagtanggap.
- source_word: כִּי עַל יוֹם טוֹב בָּאנוּ
  choice: sapagkat dumating kami sa araw ng pagdiriwang
  rationale: Literal na “mabuting araw” ang יוֹם טוֹב, ngunit sa konteksto ng paggugupit ng mga tupa ay tumutukoy ito sa isang masayang araw ng pagdiriwang. Iniiwasan ng salin ang malabong karaniwang kahulugan ng “magandang araw.”
- source_word: תְּנָה נָּא
  choice: Pakibigay
  rationale: Ipinahahayag ng נָא ang magalang na pakiusap kasabay ng pautos na pandiwa.
- source_word: אֵת אֲשֶׁר תִּמְצָא יָדְךָ
  choice: ang anumang masumpungan ng iyong kamay
  rationale: Pinananatili ang kongkretong larawang Hebreo; ipinaliliwanag sa talababa ang idyomatikong kahulugang anumang maibibigay o mailalaan.
- source_word: לַעֲבָדֶיךָ
  choice: sa iyong mga lingkod
  rationale: Ang עֶבֶד dito ay mapagpakumbabang pantukoy ni David sa kaniyang pangkat, hindi kinakailangang pahayag tungkol sa legal na kalagayan ng pagkaalipin.
- source_word: וּלְבִנְךָ לְדָוִד
  choice: at sa iyong anak na si David
  rationale: Pinananatili ang mapagpakumbabang pagtukoy ni David sa sarili bilang “anak” ni Nabal, hindi bilang literal na anak.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na magalang at marangal. Ginamit ang “tauhan” para sa נַעַר sa dalawang paglitaw at “lingkod” para sa mapagpakumbabang עֶבֶד. Ang mga panandang talababa [a] at [b] ay kapwa nasa pangunahing teksto.
