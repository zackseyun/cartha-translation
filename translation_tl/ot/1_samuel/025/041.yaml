  text: She rose and bowed with her face to the ground and said[a], “Behold[b], your servant is a maidservant to wash the feet of the servants of my lord.”
translation:
  language: tl
  text: Tumayo siya at yumukod nang nakasubsob ang mukha sa lupa.[a] Sinabi niya, “Narito ang iyong lingkod na babae—isang aliping babae na maghuhugas ng mga paa ng mga lingkod ng aking panginoon.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pananalitang “yumukod nang nakasubsob ang mukha sa lupa” ay tumutukoy sa matinding pagpipitagan; maaari ring isalin na “nagpatirapa.”
    reason: lexical_alternative
  - marker: b
    text: 'Dalawang magkaugnay ngunit magkaibang salitang Hebreo para sa babaeng lingkod o alipin ang ginamit dito: אמה at שפחה.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Tumayo siya
  rationale: Tuwirang inilalarawan ang kasunod na kilos sa salaysay at natural sa makabagong Tagalog.
- source_word: וַתִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: yumukod nang nakasubsob ang mukha sa lupa
  rationale: Pinananatili ang malalim na pagyukod at ang tiyak na posisyon ng mukha sa lupa nang hindi gumagamit ng teknikal o lipas na pananalita.
- source_word: הִנֵּה
  choice: Narito
  rationale: Isang marangal at likas na panandang pantawag-pansin na nagpapakilala sa mapagpakumbabang pahayag ni Abigail.
- source_word: אֲמָתְךָ
  choice: iyong lingkod na babae
  rationale: Pinananatili ang pambabaeng anyo at ang magalang na pagtukoy ni Abigail sa sarili.
- source_word: לְשִׁפְחָה
  choice: isang aliping babae
  rationale: Ibinubukod ito sa naunang אֲמָתְךָ at mas malinaw na ipinahahayag ang mababang katayuang iniaalok niya sa matinding pagpapakumbaba.
- source_word: לִרְחֹץ רַגְלֵי
  choice: na maghuhugas ng mga paa
  rationale: Natural na Tagalog para sa layunin o tungkuling ipinahahayag ng infinitive at ng layon nito.
- source_word: עַבְדֵי אֲדֹנִי
  choice: mga lingkod ng aking panginoon
  rationale: Ang 'mga lingkod' ay angkop sa mga tauhan ni David, at pinananatili ng 'aking panginoon' ang magalang na pananalita ni Abigail.
theological_decisions:
- issue: Pagpapahayag sa dalawang magkaugnay ngunit magkaibang katawagan para sa babaeng lingkod, אמה at שפחה
  choice: “lingkod na babae” at “aliping babae”
  alternative: Gawing “lingkod” o “alipin” ang dalawang katawagan
  rationale: Pinananatili ng magkaibang salin ang leksikal na pagkakaiba at ang pag-igting ng pagpapakumbaba ni Abigail, nang hindi nagdaragdag ng isang tiyak na doktrina tungkol sa eksaktong legal na katayuan niya.
- issue: Ugnayan ng לְשִׁפְחָה sa אֲמָתְךָ
  choice: 'Appositional na pahayag: “ang iyong lingkod na babae—isang aliping babae”'
  alternative: “ang iyong lingkod na babae ay magiging aliping babae”
  rationale: Hindi tahasang future tense ang Hebreo. Iniiwasan ng apposition ang pagdaragdag ng “magiging” habang pinananatili ang pag-aalay niya ng sarili para sa pinakamababang paglilingkod.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Narito” sa halip na mas lipas na pormula, at pinanatili ang magalang na “aking panginoon.” Ang gitling-pahaba ay tumutulong na maipakita ang apposition nang hindi nagdaragdag ng future tense na wala sa Hebreo.
