base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/017.yaml
  text: Now know this and consider what you should do[a], for disaster has been determined against our master and against all his household, and he is such a worthless man that one cannot speak to him.
translation:
  language: tl
  text: Ngayon, alamin mo ito at pag-isipan kung ano ang dapat mong gawin, sapagkat nakatakda na ang kapahamakan laban sa ating amo at sa buo niyang sambahayan. Siya ay isang walang-kuwentang tao[a] na walang makausap sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “anak ng kawalang-kabuluhan”; ayon sa tradisyon, “anak ni Belial.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Naghuhudyat ito ng apurahang paglipat mula sa ulat ng lingkod tungo sa panawagang kumilos si Abigail. Likas sa Tagalog ang “Kaya ngayon” sa ganitong konteksto.
- source_word: דְּעִי וּרְאִי
  choice: unawain mo ito at pag-isipan
  rationale: Ang dalawang pambabaeng pautos na “alamin” at “tingnan” ay magkasamang nananawagan sa maingat na pagkilala at pagsasaalang-alang; iniiwasan ng salin ang di-likas na literalismong “alamin at tingnan.”
- source_word: מַה תַּעֲשִׂי
  choice: kung ano ang dapat mong gawin
  rationale: Ipinahihiwatig ng imperfect ang nalalapit at pinag-iisipang pagkilos. Ang “dapat” ay naghahatid ng agarang praktikal na pangangailangan nang hindi ito ginagawang tahasang utos.
- source_word: כָלְתָה הָרָעָה
  choice: tiyak nang sasapit ang kapahamakan
  rationale: Ang idyoma ay nagpapahayag na ang masamang kahihinatnan ay ganap nang napagpasyahan o tiyak. Mas natural sa Tagalog ang “tiyak nang sasapit” kaysa sa literal na “natapos na ang kasamaan.”
- source_word: אֶל אֲדֹנֵינוּ
  choice: sa ating amo
  rationale: Ang “amo” ay angkop sa relasyon ng lingkod sa pinuno ng sambahayan; sa konteksto, ang אֶל ay tumutukoy sa taong tatamaan ng kapahamakan.
- source_word: וְעַל כָּל בֵּיתוֹ
  choice: at sa buo niyang sambahayan
  rationale: Ang “sambahayan” ay malinaw na tumutukoy sa mga taong sakop ng bahay ni Nabal, hindi lamang sa gusali.
- source_word: בֶּן בְּלִיַּעַל
  choice: walang-kuwentang tao
  rationale: Idyoma ito para sa isang taong ubod ng sama, hamak, o walang pakinabang sa moral na diwa. Pinananatili ng salin ang matinding paghamak nang hindi ginagawang pangalang pantangi ang Belial.
- source_word: מִדַּבֵּר אֵלָיו
  choice: na hindi makausap
  rationale: 'Ipinapahayag ng parirala ang bunga ng kaniyang ugali: imposibleng makipag-usap o mangatuwiran sa kaniya. Maikli at natural ang “hindi makausap.”'
theological_decisions:
- issue: Ang idyomang בֶּן בְּלִיַּעַל
  choice: walang-kuwentang tao
  alternative: anak ng kawalang-kabuluhan; anak ni Belial
  rationale: Sa kontekstong ito, karaniwang idyomang Hebreo ito para sa isang mababa at masamang tao, hindi kinakailangang pangalan ng isang demonyong nilalang. Inilalagay sa talababa ang literal at tradisyonal na anyo upang mapanatili ang impormasyong tekstuwal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “amo” at “sambahayan” upang mapanatili ang tagpong panlipunan ng salaysay. Inilipat ang talababa sa mismong pariralang “walang-kuwentang tao,” na siyang tinutukoy nito.
