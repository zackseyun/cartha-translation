translation_notes:
  register: Makabagong Filipino na magalang at marangal. Ginamit ang ‘po sana’ at ‘aking panginoon’ upang ipakita ang mapagpakumbabang pakiusap ni Abigail. Inilagay ang pananda [a] pagkatapos ng buong larong-salita upang malinaw ang saklaw nito.
