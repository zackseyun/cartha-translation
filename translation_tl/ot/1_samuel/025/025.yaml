base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/025.yaml
  text: 'Please[a], my lord, do not set your heart on this worthless man, on Nabal, for as his name is, so is he: Nabal is his name, and folly is with him. But I, your servant, did not see the young men of my lord whom you sent.'
translation:
  language: tl
  text: 'Huwag po sanang pagtuunan ng aking panginoon ng pansin ang hamak na taong ito, si Nabal. Sapagkat kung ano ang pangalan niya, gayon nga siya: Nabal ang pangalan niya, at kahangalan ang taglay niya.[a] Ngunit ako na inyong lingkod ay hindi ko nakita ang mga binata ng aking panginoon na isinugo ninyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang “Nabal” ay kaugnay sa tunog ng salitang Hebreo para sa “hangal” o “kahangalan.” Sinasadya rito ni Abigail ang larong-salita sa pangalan at pagkatao ni Nabal.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂים אֶת־לִבּוֹ אֶל
  choice: pag-ukulan ng pansin
  rationale: Natural na Filipino para sa idyomang literal na ‘ilagay ang puso tungo sa’; ipinahahayag nito ang pagbibigay ng seryosong pansin nang hindi nagmumungkahi ng romantikong kahulugan.
- source_word: אִישׁ הַבְּלִיַּעַל
  choice: hamak na taong ito
  rationale: Ipinapanatili ang matinding moral na paghamak ng בְּלִיַּעַל sa kontekstong ito nang hindi ito itinuturing na pangalang pantangi.
- source_word: נָבָל
  choice: Nabal
  rationale: Pinananatili ang pangalang pantangi; ipinaliliwanag sa talababa ang larong-salita kaugnay ng kahangalan.
- source_word: כִּי כִשְׁמוֹ כֶּן הוּא
  choice: Sapagkat kung ano ang pangalan niya, gayon nga siya
  rationale: Pinananatili ang tahasang paghahambing sa pangalan at pagkatao, pati ang anyong kasabihan ng Hebreo.
- source_word: וּנְבָלָה עִמּוֹ
  choice: at kahangalan ang taglay niya
  rationale: Ang נְבָלָה ay maaaring tumukoy sa kahangalan o kahiya-hiyang asal. ‘Kahangalan’ ang pinakamalinaw na nagpapanatili sa larong-salita sa Nabal, habang ang ‘taglay niya’ ay natural na katumbas ng עִמּוֹ.
- source_word: אֲמָתְךָ
  choice: ako na inyong lingkod
  rationale: Likas at magalang na pormula ng pagpapakumbaba sa Filipino; ipinahihiwatig na babae ang nagsasalita sa konteksto, bagaman hindi minamarkahan ng salitang ‘lingkod’ ang kasarian.
- source_word: נַעֲרֵי
  choice: mga binata
  rationale: Malapit sa leksikal na kahulugan ng נַעַר bilang mga kabataang lalaki, at angkop sa mga isinugong tauhan ni David.
- source_word: אֲדֹנִי
  choice: aking panginoon
  rationale: Angkop na magalang na pantawag ni Abigail kay David at hindi tumutukoy sa banal na pangalan.
