base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/022.yaml
  text: May God do so to David’s enemies[a], and more also[b], if by morning I leave so much as one male of all who belong to him.
translation:
  language: tl
  text: Nawa’y gawin ito ng Diyos sa mga kaaway ni David[a], at higit pa rito, kung pagsapit ng umaga ay magtitira ako kahit isang lalaki[b] sa lahat ng nauukol sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring unawain ng ilang tagapagpaliwanag ang “mga kaaway ni David” bilang eupemistikong pagkakasulat para sa “David” o “ako,” sapagkat karaniwang ipinapataw ng ganitong panunumpa ang sumpa sa mismong nanunumpa.
    reason: textual_variant
  - marker: b
    text: 'Sa Hebreo: “umiihi laban sa pader,” isang magaspang at mapanghamak na idyomang nangangahulugang “lalaki.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה ... וְכֹה יֹסִיף
  choice: Gawin nawa ito ... at dagdagan pa niya
  rationale: Pinananatili nito ang puwersa ng karaniwang Hebreong pormula ng sumpa habang natural at malinaw sa makabagong Tagalog.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman maramihan ang anyong morpolohikal, isahan ang pandiwa at tumutukoy ito sa Diyos sa loob ng pormula ng panunumpa.
- source_word: לְאֹיְבֵי דָוִד
  choice: sa mga kaaway ni David
  rationale: Tuwirang pinananatili ang mahirap ngunit aktuwal na pagbasa ng tekstong Masoretiko, sa halip na tahimik itong palitan ng “kay David” o “sa akin.”
- source_word: אִם
  choice: kung
  rationale: Sa konteksto ng sumpa, ipinakikilala nito ang kondisyon; ang naunang pormula ang nagbibigay rito ng puwersang mapanumpa.
- source_word: אַשְׁאִיר
  choice: magtitira ako
  rationale: Tumpak nitong ipinahahayag ang Hiphil na diwang “mag-iwan” o “magpanatiling buhay,” nang hindi tahasang ipinapasok ang mas interpretatibong “patatawarin” o “ililigtas.”
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: sa lahat ng nauukol sa kanya
  rationale: Pinananatili ang malawak na kahulugang pag-aari o sambahayan, habang ang kasunod na idyoma ang tumutukoy sa mga lalaking kabilang dito.
- source_word: עַד הַבֹּקֶר
  choice: pagsapit ng umaga
  rationale: Natural na Tagalog para sa hangganang temporal na “hanggang sa umaga” o “bago dumating ang umaga.”
- source_word: מַשְׁתִּין בְּקִיר
  choice: kahit isang lalaki
  rationale: Malinaw nitong ipinahahayag ang tinutukoy ng magaspang at mapanghamak na idyomang Hebreo; inilalahad sa talababa ang literal na larawan.
theological_decisions:
- issue: Ang pagbasa ng tekstong Masoretiko na “mga kaaway ni David” sa pormula ng sumpa
  choice: Panatilihin sa pangunahing teksto ang “mga kaaway ni David.”
  alternative: Unawaing eupemistikong pagbabago ito para sa “David” o “ako,” yamang karaniwang laban sa mismong nanunumpa ang ganitong sumpa.
  rationale: Ang ibinigay na pinagmulang Hebreo ay tahasang may “mga kaaway ni David.” Pinananatili ng salin ang tunay na tensiyon ng teksto at inilalagay sa talababa ang posibleng paliwanag sa halip na tahimik na amyendahan ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino, ngunit pinananatili ang pormal at mabigat na himig ng panunumpa. Iniwasan ang sobrang arkaikong pananalita at inilagay sa talababa ang magaspang na literal na idyoma.
