revisions:
- from: Gawin nawa ito ng Diyos sa mga kaaway ni David[a], at dagdagan pa niya, kung pagsapit ng umaga ay magtitira ako kahit isang lalaki[b] sa lahat ng nauukol sa kanya.
  to: Nawa’y gawin ito ng Diyos sa mga kaaway ni David[a], at higit pa rito, kung pagsapit ng umaga ay magtitira ako kahit isang lalaki[b] sa lahat ng nauukol sa kanya.
  rationale: Pinalitan ang hindi ganap na idiomatikong “at dagdagan pa niya” ng “at higit pa rito,” na natural na Filipino at pinananatili ang masidhing pormula ng sumpa. Pinatumpak ang literal na larawan sa talababa. Walang binagong pagbasa sa pangunahing tekstong Masoretiko at nananatili ang footnote na nagsasaad ng pinagtatalunang katangian nito.
