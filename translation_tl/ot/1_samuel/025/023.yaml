source:
  edition: WLC
  text: וַ/תֵּ֤רֶא אֲבִיגַ֨יִל֙ אֶת דָּוִ֔ד וַ/תְּמַהֵ֕ר וַ/תֵּ֖רֶד מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/תִּפֹּ֞ל לְ/אַפֵּ֤י דָוִד֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/023.yaml
  text: When Abigail saw David[a], she hurried and got down from the donkey, and fell before David on her face and bowed to the ground.
translation:
  language: tl
  text: Nang makita ni Abigail si David, nagmadali siyang bumaba sa asno. Nagpatirapa siya sa harap ni David at yumukod hanggang lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagpatirapa sa lupa.” Maaaring tumukoy ang pandiwang Hebreo sa malalim na pagyukod o pagpapatirapa; dito, kilos ito ng paggalang at pagpapakumbaba ni Abigail sa harap ni David, hindi kinakailangang pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: makita
  rationale: Ang ראה ay karaniwang pandiwa para sa pagkakita; ang “makita” ang likas at tuwirang katumbas sa salaysay.
- source_word: וַתְּמַהֵר
  choice: nagmadali
  rationale: Ipinahahayag ng מהר ang mabilis at apurahang pagkilos. Likas sa modernong Filipino ang “nagmadali” at napapanatili nito ang sigla ng salaysay.
- source_word: וַתֵּרֶד מֵעַל הַחֲמוֹר
  choice: bumaba sa asno
  rationale: Sa konteksto ng pagsakay, natural sa Filipino ang “bumaba sa asno”; hindi na kailangan ang mas literal ngunit mabigat na “bumaba mula sa ibabaw ng asno.”
- source_word: הַחֲמוֹר
  choice: asno
  rationale: Ang חמור ay asno. Karaniwan at malinaw na katawagan ito sa dignified na salin ng Bibliya sa Filipino.
- source_word: וַתִּפֹּל לְאַפֵּי דָוִד עַל פָּנֶיהָ
  choice: Nagpatirapa siya sa harap ni David
  rationale: Pinagsasama ng parirala ang pagbagsak sa harap ni David at ang pagkakadapa ng mukha. Ang “nagpatirapa” ay natural na naghahatid ng sinadyang lubos na pagpapakumbaba, nang hindi nagdaragdag ng “sa paanan,” na wala sa Hebreo.
- source_word: וַתִּשְׁתַּחוּ אָרֶץ
  choice: yumukod hanggang lupa
  rationale: Maaaring tumukoy ang שׁחה sa malalim na pagyukod o pagpapatirapa. Inilalarawan dito ang paggalang at pagpapakumbaba sa harap ng isang tao, kaya iniiwasan ang salitang “sumamba.”
theological_decisions:
- issue: Kahulugan ng שׁחה sa pagharap ni Abigail kay David
  choice: yumukod hanggang lupa
  alternative: nagpatirapa sa lupa; sumamba
  rationale: Dahil tao ang pinatutungkulan ng kilos, inilalarawan nito ang matinding paggalang at pagpapakumbaba, hindi kinakailangang pagsambang iniuukol sa Diyos. Pinananatili ng salin at talababa ang saklaw sa pagitan ng malalim na pagyukod at pagpapatirapa nang hindi ipinapasok ang teolohikal na diwa ng pagsamba.
translation_notes:
  register: Modernong Filipino na malinaw, natural, at marangal. Pinanatili ang sunod-sunod na kilos at ang matinding pagpapakumbaba ni Abigail, habang iniwasan ang arkaykong pananalita at ang teolohikal na labis na pagpapakahulugan.
