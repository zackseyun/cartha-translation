translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang tatlong ulit na “kapayapaan” upang maipakita ang estruktura at diin ng Hebreo. Ang “Mabuhay ka!” ay may tandang padamdam bilang likas na pagbati; hindi nito inaalis ang kalabuan ng pinagmulang parirala dahil nakatala iyon sa talababa.
