  yaml_path: translation/ot/1_samuel/025/006.yaml
  text: 'And say this: ‘To the living one: Peace to you[a], peace to your house[b], and peace to all that is yours.’'
translation:
  language: tl
  text: 'Sabihin ninyo ito: “Mabuhay ka![a] Kapayapaan sa iyo, kapayapaan sa iyong sambahayan,[b] at kapayapaan sa lahat ng nasa iyo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na mahirap unawain ang Hebreong parirala: “sa buhay” o “sa nabubuhay.” Malamang na isa itong pagbati o pagpapala, gaya ng “Mabuhay ka!” Maaari rin itong unawain nang mas pangkalahatan bilang “Pagbati.”'
    reason: alternative_reading
  - marker: b
    text: Ang “kapayapaan” ay salin ng Hebreong shalom, na maaari ring tumukoy sa mabuting kalagayan, kaginhawahan, kabuuan, o kasaganaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם כֹּה
  choice: Sabihin ninyo sa kanya
  rationale: Ang waw + perfect ay nagpapatuloy sa utos, kaya likas sa Filipino ang pautos na “Sabihin ninyo.” Idinagdag ang “sa kanya” upang malinaw ang di-tuwirang layon na ipinahihiwatig ng konteksto, nang hindi binabago ang mensahe.
- source_word: לֶחָי
  choice: Mabuhay ka!
  rationale: Mahirap at malamang na idyomatikong pagbati o pagpapala ang literal na “sa buhay/sa nabubuhay.” Ang “Mabuhay ka!” ay natural na pagbating Filipino at pinananatili ang diwa ng buhay, habang ang tunay na kalabuan ng Hebreo ay itinatala sa talababa.
- source_word: וְאַתָּה שָׁלוֹם
  choice: Kapayapaan sa iyo
  rationale: Pinananatili nito ang maikli at walang-pandiwang anyo ng pagpapala at ang tahasang pag-uulit ng שָׁלוֹם.
- source_word: וּבֵיתְךָ שָׁלוֹם
  choice: kapayapaan sa iyong sambahayan
  rationale: Ang בַּיִת ay literal na “bahay” ngunit dito ay maaaring tumukoy sa buong sambahayan. Mas malinaw at natural ang “sambahayan” sa modernong Filipino.
- source_word: וְכֹל אֲשֶׁר לְךָ שָׁלוֹם
  choice: at kapayapaan sa lahat ng pag-aari mo
  rationale: Saklaw nito ang lahat ng nasa kay Nabal. Ang “pag-aari” ay natural sa konteksto, bagaman maaaring mas malawak ang Hebreo kaysa sa mga materyal na ari-arian lamang.
- source_word: שָׁלוֹם
  choice: kapayapaan
  rationale: Ito ang tuwirang tradisyonal na katumbas at pinananatili ang tatlong ulit na pormula. Maaari rin itong mangahulugan ng mabuting kalagayan, kaginhawahan, kabuuan, o kasaganaan, na nililinaw sa talababa.
