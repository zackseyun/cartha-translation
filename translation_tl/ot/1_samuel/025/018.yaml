revisions:
- from: Nagmamadali si Abigail at kumuha ng dalawang daang tinapay, dalawang sisidlang-balat ng alak, limang tupang naihanda na, limang sea[a] ng binusang butil, isang daang kumpol ng pasas, at dalawang daang tipak ng pinisang igos. Ipinakarga niya ang mga iyon sa mga asno.
  to: Nagmamadaling kumuha si Abigail ng dalawang daang tinapay, dalawang sisidlang balat ng alak, limang tupa na naihanda na, limang seah[a] ng binusang butil, isang daang kumpol ng pasas, at dalawang daang tipak ng pinatuyong igos. Ipinakarga niya ang mga ito sa mga asno.
  rationale: Inayos ang aspekto at daloy ng pambungad na salaysay, pinalitan ang hindi likas na mga tambalan at anyong pangngalan, at nilinaw ang mga tipak ng igos. Hindi binago ang dami, pagkakasunod-sunod, o antas ng katiyakan ng mga pagkaing nasa Hebreo.
