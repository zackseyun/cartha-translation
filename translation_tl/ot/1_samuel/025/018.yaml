base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/018.yaml
  text: Then Abigail hurried and took two hundred loaves of bread[a], two skins of wine, five sheep already prepared, five seahs of roasted grain, a hundred clusters of raisins, and two hundred cakes of figs, and put them on the donkeys.
translation:
  language: tl
  text: Nagmamadaling kumuha si Abigail ng dalawang daang tinapay, dalawang sisidlang balat ng alak, limang tupa na naihanda na, limang seah[a] ng binusang butil, isang daang kumpol ng pasas, at dalawang daang tipak ng pinatuyong igos. Ipinakarga niya ang mga ito sa mga asno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang seah ay isang sinaunang panukat para sa mga tuyong bagay; maaari ring isalin ang parirala bilang “limang takal ng binusang butil.”
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Nagmamadali si Abigail
  rationale: Ipinahahayag ng pandiwa ang agarang pagkilos. Natural sa makabagong Tagalog ang “nagmamadali” at napapanatili nito ang tensiyon ng salaysay.
- source_word: וַתִּקַּח
  choice: kumuha
  rationale: Tuwirang katumbas ito ng karaniwang kahulugan ng לקח at angkop bilang panimula sa talaan ng mga panustos.
- source_word: מָאתַיִם לֶחֶם
  choice: dalawang daang tinapay
  rationale: Sa konteksto ng binibilang na pagkain, malinaw sa Tagalog na ang tinutukoy ay magkakahiwalay na tinapay; hindi kailangang idagdag ang “buo” o “tinapay na bilog,” na wala sa Hebreo.
- source_word: שְׁנַיִם נִבְלֵי יַיִן
  choice: dalawang sisidlang-balat ng alak
  rationale: Ipinakikita ng “sisidlang-balat” ang sinaunang lalagyan ng likido at iniiwasan ang anakronistikong “bote.”
- source_word: חָמֵשׁ צֹאן עֲשׂוּיוֹת
  choice: limang tupang naihanda na
  rationale: Ang anyo mula sa עשה ay nagsasabing naihanda na ang mga tupa. Hindi tinutukoy nang tiyak ng Hebreo kung kinatay, nilinis, o niluto na ang mga ito, kaya pinananatili ang saklaw ng orihinal.
- source_word: חָמֵשׁ סְאִים קָלִי
  choice: limang sea ng binusang butil
  rationale: Pinananatili ang tiyak na sinaunang yunit na סאה bilang “sea,” habang ang קָלִי ay natural na isinasalin bilang butil na binusa o inihaw. Ipinaliliwanag sa talababa ang di-pamilyar na sukat.
- source_word: מֵאָה צִמֻּקִים
  choice: isang daang kumpol ng pasas
  rationale: Ang צִמֻּקִים ay mga pasas na maaaring pinagsama o pinipi bilang mga bahaging nabibilang. Ang “kumpol ng pasas” ay malinaw at naihihiwalay sa mga tipak ng igos na kasunod.
- source_word: מָאתַיִם דְּבֵלִים
  choice: dalawang daang tipak ng pinisang igos
  rationale: Ang דְּבֵלָה ay pinisang o pinagdikit na igos na hinubog na parang cake. Inihahatid ng “tipak ng pinisang igos” ang anyo nang hindi ipinahihiwatig na modernong keyk ito.
- source_word: וַתָּשֶׂם עַל הַחֲמֹרִים
  choice: Ipinakarga niya ang mga iyon sa mga asno
  rationale: Bagaman literal na “inilagay,” malinaw sa konteksto na ikinarga ang mga panustos sa mga asno. Natural at tumpak sa Tagalog ang “ipinakarga.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sinaunang detalye sa “sisidlang-balat” at “sea,” ngunit ipinaliwanag ang di-pamilyar na yunit sa talababa. Inilagay ang [a] pagkatapos ng “sea,” ang salitang talagang tinutukoy ng tala.
