base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/037.yaml
  text: And in the morning[a], when the wine had gone out of Nabal, his wife told him these things, and his heart died within him[b], and he became like a stone.
translation:
  language: tl
  text: Kinaumagahan, nang mawala na kay Nabal ang epekto ng alak[a], sinabi ng kanyang asawa sa kanya ang mga bagay na ito. Namatay ang puso niya sa loob niya[b], at siya ay naging gaya ng bato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nang lumabas o umalis ang alak mula kay Nabal,” ibig sabihin, nang mahimasmasan na siya o mawala na ang epekto ng alak.
    reason: lexical_alternative
  - marker: b
    text: O, “tumigil ang puso niya sa loob niya.” Gumagamit ang Hebreo ng matingkad na larawan at hindi ng tiyak na katawagang medikal.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַבֹּקֶר
  choice: Kinaumagahan
  rationale: Likas at maikli itong katumbas ng karaniwang pahayag na Hebreo para sa pagsapit ng umaga.
- source_word: בְּצֵאת הַיַּיִן מִנָּבָל
  choice: nang mawala na kay Nabal ang epekto ng alak
  rationale: Literal na inilalarawan ng Hebreo ang alak na ‘lumalabas’ o ‘umaalis’ kay Nabal. Sa modernong Tagalog, malinaw na ipinahahayag ng saling ito na lumipas na ang kanyang pagkalasing, habang inilalahad sa talababa ang kongkretong larawan ng orihinal.
- source_word: וַתַּגֶּד לוֹ אִשְׁתּוֹ
  choice: sinabi sa kanya ng kanyang asawa
  rationale: Karaniwan at natural na salin ito ng Hifil ng נגד sa kontekstong nagsasalaysay o nag-uulat.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ang mga bagay na ito
  rationale: Maaaring mangahulugan ang דְּבָרִים ng mga salita, bagay, o pangyayari. Pinananatili ng ‘mga bagay na ito’ ang lawak at bahagyang kalabuan ng Hebreo.
- source_word: וַיָּמָת לִבּוֹ בְּקִרְבּוֹ
  choice: Namatay ang puso niya sa loob niya
  rationale: Pinananatili nito ang matindi at kongkretong larawan ng Hebreo sa halip na magtakda ng isang tiyak na medikal na diagnosis.
- source_word: וְהוּא הָיָה לְאָבֶן
  choice: at para siyang naging bato
  rationale: Natural na Tagalog itong nagpapanatili sa paghahambing ng Hebreo nang hindi ipinapaliwanag kung pisikal, emosyonal, o medikal ang eksaktong kalagayan.
theological_decisions:
- issue: Kung bibigyan ng tiyak na medikal na paliwanag ang kalagayan ni Nabal
  choice: Panatilihin ang larawang ‘Namatay ang puso niya sa loob niya, at para siyang naging bato.’
  alternative: Sabihing inatake siya sa puso, na-stroke, o naparalisa.
  rationale: Matalinghagang pananalita ang ginagamit ng salaysay at hindi nito tahasang tinutukoy ang isang partikular na sakit. Iniiwasan ng salin ang pagdaragdag ng diagnosis na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang himig. Ginawang natural ang idyoma tungkol sa paglipas ng kalasingan, ngunit pinanatili sa pangunahing teksto ang matinding larawan ng pusong namatay at ng pagiging parang bato.
