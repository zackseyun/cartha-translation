  text: David heard in the wilderness that Nabal was shearing his sheep[a].
translation:
  language: tl
  text: Habang nasa ilang si David, nabalitaan niya na naggugupit si Nabal ng balahibo ng kanyang mga tupa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas malawak na diwa, “ang kanyang kawan.” Maaaring tumukoy ang Hebreong צֹאן sa maliliit na alagang hayop bilang isang pangkat, bagaman “mga tupa” ang higit na angkop sa konteksto ng paggugupit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Nabalitaan
  rationale: Isinasalaysay ng anyong pandiwa ang isang pangyayaring naganap na. Likas sa modernong Tagalog ang “nabalitaan” para sa pagtanggap ni David ng ulat, nang hindi dinaragdagan ang nilalaman nito.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay karaniwang tumutukoy sa ilang o malawak na lupaing kakaunti ang naninirahan, hindi kinakailangang mabuhanging disyerto. Pinananatili rin ng parirala ang posibleng diwa na nasa ilang si David nang matanggap niya ang balita.
- source_word: כִּי
  choice: na
  rationale: Dito, ipinakikilala ng כִּי ang nilalaman ng narinig o nabalitaan ni David; ang “na” ang natural na panandang Tagalog.
- source_word: גֹזֵז
  choice: ginugupitan
  rationale: Ang participle ay nagpapahiwatig ng kasalukuyang nagaganap na gawain sa puntong iyon. Ang “ginugupitan” ay natural na paglalarawan sa paggupit ng balahibo ng mga tupa at nagpapanatili sa aspektong di-ganap.
- source_word: נָבָל
  choice: Nabal
  rationale: Pangalan ng tao; tinumbasan sa karaniwang transliterasyong Tagalog sa halip na isalin ang posibleng kahulugan ng pangalan.
- source_word: אֶת צֹאנוֹ
  choice: ang kanyang mga tupa
  rationale: Maaaring tumukoy ang צֹאן sa maliliit na alagang hayop bilang isang kawan, kabilang ang mga tupa at kambing. Gayunman, sa konteksto ng paggugupit ng balahibo, “mga tupa” ang pinakanatural at tiyak na salin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “sa ilang” sa halip na “sa disyerto” upang maiwasan ang sobrang tiyak na larawang mabuhangin. Ang ayos ng pangungusap ay malinaw sa karaniwang mambabasa habang pinananatili ang lokasyon ni David at ang nagpapatuloy na kilos ng paggugupit.
