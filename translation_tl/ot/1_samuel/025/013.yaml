base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/013.yaml
  text: Then David said to his men[a], “Each man strap on his sword.” So each man strapped on his sword, and David also strapped on his sword. About four hundred men went up after David, while two hundred stayed with the supplies.
translation:
  language: tl
  text: Sinabi ni David sa kanyang mga tauhan, “Isuot ng bawat isa ang kanyang espada.” Kaya isinuot ng bawat isa ang kanyang espada, at isinuot din ni David ang kanyang espada. Humigit-kumulang apatnaraang lalaki ang sumunod kay David paakyat, samantalang nanatili kasama ng mga kagamitan ang dalawandaang lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nanatili sa tabi ng mga kagamitan” o “nanatili kasama ng mga bagahe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חִגְרוּ / וַיַּחְגְּרוּ / וַיַּחְגֹּר
  choice: isakbat / isinakbat
  rationale: Sa kontekstong militar, ang חגר ay tumutukoy sa pagkakabit o pagsusuot ng espada sa katawan. Likas at kongkreto sa modernong Tagalog ang “isakbat,” nang hindi gumagamit ng makalumang pananalita.
- source_word: אִישׁ ... אֶת־חַרְבּוֹ
  choice: bawat isa ... ang kanyang espada
  rationale: 'Pinananatili nito ang distributibong diwa ng Hebreo: isa-isa nilang isinakbat ang kani-kaniyang espada.'
- source_word: חַרְבּוֹ
  choice: ang kanyang espada
  rationale: Tiyak na espada ang חֶרֶב sa talata, kaya hindi ito pinalawak bilang pangkalahatang “sandata.”
- source_word: גַּם
  choice: din
  rationale: Malinaw nitong ipinakikita na nakibahagi rin si David sa pagsakbat ng espada.
- source_word: וַיַּעֲלוּ אַחֲרֵי דָוִד
  choice: sumunod kay David paakyat
  rationale: 'Pinananatili ng salin ang dalawang sangkap ng parirala: ang pagsunod kay David at ang kilos na pag-akyat.'
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: humigit-kumulang apatnaraang lalaki
  rationale: Ang unlaping כְּ sa bilang ay nagpapahiwatig ng pagtatantiya; malinaw itong naihahayag ng “humigit-kumulang.”
- source_word: יָשְׁבוּ
  choice: nanatili
  rationale: Bagaman maaaring literal na “umupo,” sa salaysay ay nangangahulugan itong hindi sila sumama at nanatili sa kinaroroonan ng mga kagamitan.
- source_word: עַל־הַכֵּלִים
  choice: upang bantayan ang mga kagamitan
  rationale: Malawak ang kahulugan ng כֵּלִים at maaaring tumukoy sa mga gamit, kagamitan, o bagahe. Sa kontekstong ito, ipinahihiwatig ng pananatili nila roon ang pagbabantay, ngunit inilalagay sa talababa ang mas pormal na alternatibo upang mapanatili ang saklaw at kaunting kalabuan ng Hebreo.
- source_word: לַאֲנָשָׁיו
  choice: sa kanyang mga tauhan
  rationale: Sa kontekstong ito, ang אֲנָשִׁים ay mga lalaking kasama ni David bilang pangkat na mandirigma; natural at hindi labis na teknikal ang “mga tauhan.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga tauhan,” “isakbat,” at “espada” para sa malinaw at likas na salaysay. Ang “apatnaraan” at “dalawandaan” ay isinulat bilang pinagsamang anyong pamilang ayon sa karaniwang gamit.
