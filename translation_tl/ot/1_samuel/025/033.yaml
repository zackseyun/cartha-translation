base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/033.yaml
  text: And blessed be your judgment[a], and blessed be you[c][b], who have kept me this day from coming into bloodshed and from saving myself by my own hand.
translation:
  language: tl
  text: At pagpalain nawa ang iyong paghatol[a], at pagpalain nawa ikaw, na pumigil sa akin sa araw na ito na masangkot sa pagdanak ng dugo[b] at magligtas sa sarili ko sa pamamagitan ng sarili kong kamay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iyong pagkilatis” o “iyong pag-unawa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “pumasok sa mga dugo”; maaari rin itong magpahiwatig ng pagkakasala dahil sa dugong dumanak.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ipaghiganti ang sarili ko sa pamamagitan ng sarili kong kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ טַעְמֵךְ
  choice: At pagpalain ang iyong pagpapasya
  rationale: Ang טַעַם ay tumutukoy rito sa matinong paghatol, pagkilala, o pagpapasya ni Abigail. Ang “pagpapasya” ay likas sa makabagong Tagalog at hindi labis na nagpapaliit sa saklaw ng salita.
- source_word: וּבְרוּכָה אָתְּ
  choice: at pagpalain ka rin
  rationale: Pinananatili nito ang tuwirang pormula ng pagpapala at ang pagkakapantay ng dalawang magkakasunod na pagpapahayag.
- source_word: אֲשֶׁר כְּלִתִנִי
  choice: ikaw na pumigil sa akin
  rationale: Ang anyo ng כלה rito ay may diwang pagpigil o paghadlang. Ang “ikaw na” ay nagpapanatili sa kaugnay na sugnay ng Hebreo.
- source_word: הַיּוֹם הַזֶּה
  choice: sa araw na ito
  rationale: Pinananatili ang mariing pormal na temporal na parirala ng Hebreo.
- source_word: מִבּוֹא בְדָמִים
  choice: na humantong sa pagdanak ng dugo
  rationale: Ipinahihiwatig ng literal na “pumasok/dumating sa mga dugo” ang pagkakasangkot sa marahas na pagpatay. Ang “humantong” ay nagpapanatili sa galaw ng orihinal nang hindi nagiging asiwa sa Tagalog.
- source_word: וְהֹשֵׁעַ יָדִי לִי
  choice: at iligtas ang aking sarili sa pamamagitan ng sarili kong kamay
  rationale: Pinananatili ang karaniwang diwa ng ישׁע na “iligtas,” pati ang tensiyon at kabalintunaan ng sariling pagliligtas sa pamamagitan ng marahas na paghihiganti; inilalagay sa talababa ang mas kontekstuwal na pagbasa.
theological_decisions:
- issue: Ang דָּמִים bilang pagdanak ng dugo o pagkakasala dahil sa dugo
  choice: pagdanak ng dugo
  alternative: pagkakasala dahil sa dugong dumanak
  rationale: Ang agarang konteksto ay ang balak ni David na marahas na pumatay, kaya malinaw ang “pagdanak ng dugo.” Gayunman, maaaring taglay rin ng maramihang anyo sa Hebreo ang diwa ng pananagutan o pagkakasala, kaya hindi ito inalis at inilagay sa talababa.
- issue: Ang וְהֹשֵׁעַ יָדִי לִי bilang sariling pagliligtas o paghihiganti
  choice: iligtas ang aking sarili sa pamamagitan ng sarili kong kamay
  alternative: ipaghiganti ang aking sarili sa pamamagitan ng sarili kong kamay
  rationale: Ang pangunahing salin ay nananatiling malapit sa leksikal na diwa ng ישׁע at pinananatili ang teolohikal na tensiyon ng pagtatangkang iligtas o ipagtanggol ang sarili sa sariling lakas. Ang mas tahasang diwa ng paghihiganti ay ibinibigay bilang lehitimong alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang magkatambal na pormula ng pagpapala, ang diin ng “sa araw na ito,” at ang sadyang tensiyon ng “iligtas ang aking sarili” sa halip na tahasang lutasin ito bilang paghihiganti lamang.
