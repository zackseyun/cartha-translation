revisions:
- from: At pagpalain ang iyong pagpapasya[a], at pagpalain ka rin, ikaw na pumigil sa akin sa araw na ito na humantong sa pagdanak ng dugo[b] at iligtas ang aking sarili sa pamamagitan ng sarili kong kamay.[c]
  to: At pagpalain nawa ang iyong paghatol[a], at pagpalain nawa ikaw, na pumigil sa akin sa araw na ito na masangkot sa pagdanak ng dugo[b] at magligtas sa sarili ko sa pamamagitan ng sarili kong kamay.[c]
  rationale: Pinalitan ang “pagpapasya” ng “paghatol” upang masaklaw ang diwa ng טַעַם bilang discernment o judgment. Pinalitan ang “humantong sa” ng “masangkot sa” upang mas maipakita ang pagkakasangkot na ipinahihiwatig ng Hebreo. Pinanatili ang literal na tensiyon ng sariling pagliligtas sa pamamagitan ng sariling kamay, nang hindi ipinipilit sa pangunahing teksto ang interpretasyong paghihiganti.
