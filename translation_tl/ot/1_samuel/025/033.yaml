    issue: Ang “humantong sa pagdanak ng dugo” ay hindi ang pinakatumpak na pagpapahayag ng מִבּוֹא בְדָמִים.
    rationale: Ang parirala ay tumutukoy sa pagpasok o pagkakasangkot sa bloodshed/bloodguilt, hindi lamang sa pagdating sa resultang pagdanak ng dugo. Ang “masangkot sa pagdanak ng dugo” ay mas tapat at natural.
  - severity: low
