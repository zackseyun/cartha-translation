revisions:
- from: Nang mabalitaan ni David na patay na si Nabal, sinabi niya, “Purihin si Yahweh, na ipinagtanggol ang usapin ng paghamak sa akin mula sa kamay ni Nabal[a] at pumigil sa kanyang lingkod sa paggawa ng masama.[b] Ibinalik ni Yahweh sa sariling ulo ni Nabal ang kasamaan nito.” Pagkatapos, nagsugo si David at nakipag-usap kay Abigail upang kunin siya bilang asawa.[c]
  to: Nang mabalitaan ni David na patay na si Nabal, sinabi niya, “Purihin nawa si Yahweh, na ipinaglaban ang usapin ng paghamak na ginawa sa akin ni Nabal[a] at pumigil sa kanyang lingkod sa paggawa ng masama.[b] Ibinalik ni Yahweh sa sarili niyang ulo ang kasamaan ni Nabal.” Pagkatapos, nagsugo si David ng mga sugo upang kausapin si Abigail at kunin siya bilang asawa.[c]
  rationale: The revision improves Tagalog idiom and syntactic clarity while preserving the Hebrew legal metaphor, the moral sense of David’s restraint, the idiom of recompense falling on Nabal’s own head, and the marriage expression. The supplied “mga sugo” clarifies the sending construction in a way directly supported by the ensuing narrative.
