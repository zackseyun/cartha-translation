source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע דָּוִד֮ כִּ֣י מֵ֣ת נָבָל֒ וַ/יֹּ֡אמֶר בָּר֣וּךְ יְהוָ֡ה אֲשֶׁ֣ר רָב֩ אֶת רִ֨יב חֶרְפָּתִ֜/י מִ/יַּ֣ד נָבָ֗ל וְ/אֶת עַבְדּ/וֹ֙ חָשַׂ֣ךְ מֵֽ/רָעָ֔ה וְ/אֵת֙ רָעַ֣ת נָבָ֔ל הֵשִׁ֥יב יְהוָ֖ה בְּ/רֹאשׁ֑/וֹ וַ/יִּשְׁלַ֤ח דָּוִד֙ וַ/יְדַבֵּ֣ר בַּ/אֲבִיגַ֔יִל לְ/קַחְתָּ֥/הּ ל֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/039.yaml
  text: When David heard that Nabal was dead[a], he said, “Blessed be Yahweh, who has pleaded the case of my reproach from the hand of Nabal, and has kept his servant back from evil. Yahweh has returned Nabal’s evil on his own head.” Then David sent and spoke to Abigail[e][d][c][b], to take her as his wife.
translation:
  language: tl
  text: Nang mabalitaan ni David na patay na si Nabal, sinabi niya, “Purihin nawa si Yahweh, na ipinaglaban ang usapin ng paghamak na ginawa sa akin ni Nabal[a] at pumigil sa kanyang lingkod sa paggawa ng masama.[b] Ibinalik ni Yahweh sa sarili niyang ulo ang kasamaan ni Nabal.” Pagkatapos, nagsugo si David ng mga sugo upang kausapin si Abigail at kunin siya bilang asawa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ipinaghiganti ang paghamak sa akin” o “ipinaglaban ang usapin ng aking kahihiyan laban kay Nabal.” Gumagamit ang Hebreo ng wikang may larawan ng isang usaping legal.'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pumigil sa kanyang lingkod mula sa kasamaan”; tinutukoy ni David ang sarili niya bilang lingkod ni Yahweh.
    reason: clarification
  - marker: c
    text: Ang “kunin siya bilang asawa” ay karaniwang pahayag sa Hebreo na nangangahulugang pakasalan siya.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: Purihin si Yahweh
  rationale: Likas at marangal na pormula ng pagpupuri sa modernong Tagalog; pinananatili ang doxological na diwa ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: רָב אֶת רִיב חֶרְפָּתִי
  choice: ipinagtanggol ang usapin ng paghamak sa akin
  rationale: Pinananatili ang legal na larawan ng ריב at ang diwa ng insulto o kahihiyan sa חֶרְפָּה, nang hindi lubusang nilulutas ito bilang paghihiganti lamang.
- source_word: מִיַּד נָבָל
  choice: mula sa kamay ni Nabal
  rationale: Pinananatili ang konkretong idyomang Hebreo tungkol sa pinagmulan o ahensiya; ipinaliliwanag sa talababa ang natural na kahulugan.
- source_word: וְאֶת עַבְדּוֹ חָשַׂךְ מֵרָעָה
  choice: pumigil sa kanyang lingkod sa paggawa ng masama
  rationale: Malinaw na ipinahihiwatig ang pagpigil kay David sa maling gawa habang pinananatili ang moral na bigat ng רָעָה.
- source_word: וְאֵת רָעַת נָבָל הֵשִׁיב יְהוָה בְּרֹאשׁוֹ
  choice: Ibinalik ni Yahweh sa sariling ulo ni Nabal ang kasamaan nito
  rationale: Pinananatili ang idyoma at larawan ng kaparusahan o bunga na bumabalik sa gumawa ng masama.
- source_word: וַיְדַבֵּר בַּאֲבִיגַיִל
  choice: nagsugo si David at nakipag-usap kay Abigail
  rationale: Malapit sa dalawang pandiwang Hebreo at hindi tahasang dinaragdagan ang teksto ng salitang 'nag-alok ng kasal,' bagaman malinaw ang layunin sa kasunod na parirala.
- source_word: לְקַחְתָּהּ לוֹ לְאִשָּׁה
  choice: upang kunin siya bilang asawa
  rationale: Pinananatili ang karaniwang pormulang Hebreo sa pag-aasawa habang nananatiling nauunawaan sa Tagalog.
theological_decisions:
- issue: Paghatol at pagkilos ng Diyos sa pagkamatay ni Nabal
  choice: Inihahayag ang pagkaunawa ni David na ipinagtanggol siya ni Yahweh at ibinalik kay Nabal ang sarili nitong kasamaan.
  alternative: Tahasang sabihing direktang pinatay o pinarusahan ng Diyos si Nabal.
  rationale: Iniuugnay ng Hebreo kay Yahweh ang pagtatanggol at pagganti, ngunit hindi kailangang palawakin ang talata sa higit na tiyak na sistematikong pahayag tungkol sa lahat ng pagdurusa o kamatayan.
- issue: Moral na kahulugan ng רָעָה sa pagpigil kay David
  choice: sa paggawa ng masama
  alternative: sa pananakit; sa paghihiganti
  rationale: Pinananatili nito ang moral na pagtataya sa balak ni David at hindi ito pinapahina bilang pinsala lamang o nililimitahan sa isang mas makitid na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pangalang Yahweh, ang legal na larawan sa pagtatanggol sa usapin, at ang idyoma ng kasamaang bumabalik sa ulo ng gumawa nito. Gumamit ng ‘nito’ para kay Nabal upang maiwasan ang kalituhan sa naunang ‘kanyang lingkod,’ na tumutukoy kay Yahweh.
