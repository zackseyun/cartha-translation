base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/011.yaml
  text: Should I take my bread and my water and my meat that I have slaughtered for my shearers[b][a], and give it to men whom I do not know where they are from?
translation:
  language: tl
  text: Kukunin ko ba ang aking tinapay, aking tubig, at karneng kinatay ko para sa mga manggugupit ng aking mga tupa[b], at ibibigay ko sa mga lalaking hindi ko kilala ni alam kung taga-saan sila?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “At kukunin ko … at ibibigay ko,” na gumagamit ang Hebreo ng mga anyong ganap sa isang retorikal na tanong.'
    reason: lexical_alternative
  - marker: b
    text: Ang “mga manggugupit ng aking mga tupa” ay ang mga manggagawang gumugupit ng balahibo ng mga tupa.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Kukunin ko ba
  rationale: Ang anyong qatal na may pang-ugnay ay bahagi ng isang retorikal na tanong at nagpapahayag ng galit na pagtutol; natural itong naihahatid sa Tagalog sa hinaharap na anyong may “ba.”
- source_word: לַחְמִי וְאֶת־מֵימַי
  choice: ang aking tinapay, tubig
  rationale: Pinananatili ang kongkretong talaan at ang diin ng unang panauhang pag-aari, nang hindi inuulit ang “aking” sa paraang mabigat sa natural na Tagalog.
- source_word: טִבְחָתִי אֲשֶׁר טָבַחְתִּי
  choice: karneng kinatay ko
  rationale: Ipinahahayag nito ang inihandang karne at pinananatili ang diwa ng pandiwang “kinatay,” bagaman hindi ganap na matutularan nang natural ang pag-uulit ng ugat sa Hebreo.
- source_word: לְגֹזְזָי
  choice: para sa mga manggugupit ng aking mga tupa
  rationale: Ang participle ay tumutukoy sa mga gumagawa ng paggugupit; idinagdag ang “mga tupa” upang maging malinaw sa karaniwang mambabasa ang gawaing tinutukoy.
- source_word: וְנָתַתִּי
  choice: at ibibigay
  rationale: Ipinagpapatuloy nito ang iisang retorikal na tanong at natural na ipinahihiwatig sa Tagalog ang bagay na ibibigay mula sa naunang talaan.
- source_word: לָאֲנָשִׁים
  choice: sa mga lalaking
  rationale: Pinananatili ang panlalaking maramihan at ang mapagtaboy na pagtukoy ni Nabal sa grupo.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי אֵי מִזֶּה הֵמָּה
  choice: hindi ko alam kung taga-saan
  rationale: Natural na modernong Tagalog ito para sa pahayag na hindi niya alam ang kanilang pinagmulan; hindi nito dinaragdagan ang teksto ng tahasang pag-aangking hindi niya sila personal na kilala.
