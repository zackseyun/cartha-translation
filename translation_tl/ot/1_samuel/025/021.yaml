base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/021.yaml
  text: David had said, “Surely I have guarded all that belongs to this man in the wilderness for nothing, so that not a thing of all that belonged to him was missing; and he has repaid me evil for good.”
translation:
  language: tl
  text: Sinabi ni David, “Tunay ngang walang kabuluhan ang pagbabantay ko sa lahat ng pag-aari ng taong ito sa ilang. Wala ni isa man sa lahat ng kanyang pag-aari ang nawala, ngunit ginantihan niya ako ng masama kapalit ng mabuti.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ לַשֶּׁקֶר
  choice: Talagang walang kabuluhan
  rationale: Pinananatili ang diin ng אַךְ at ang diwa ng לַשֶּׁקֶר na ‘walang saysay’ o ‘walang napala,’ sa natural na pananalitang Tagalog.
- source_word: שָׁמַרְתִּי
  choice: ang pag-iingat ko
  rationale: Ang שׁמר ay tumutukoy rito sa pagbabantay at pag-iingat sa mga pag-aari ni Nabal.
- source_word: וְלֹא נִפְקַד ... מְאוּמָה
  choice: Wala ni isa man ... ang nawala
  rationale: Ipinahahayag nang malinaw ang Hebreong idyoma na walang anumang bagay na nawawala o hindi mabilang.
- source_word: וַיָּשֶׁב לִי רָעָה תַּחַת טוֹבָה
  choice: ginantihan niya ako ng masama sa halip na mabuti
  rationale: Ang ‘ginantihan’ ay likas na Tagalog para sa pagbabalik ng masama kapalit ng mabuting ginawa, habang pinananatili ng ‘sa halip na’ ang pagsalungat ng תַּחַת.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sinabi noon” upang ipahiwatig ang pangyayaring naunang sinabi ni David ayon sa konteksto, nang hindi nagdaragdag ng hiwalay na discourse marker na ‘ngayon.’
