  text: וְ/שֵׁ֤ם הָ/אִישׁ֙ נָבָ֔ל וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ אֲבִגָ֑יִל וְ/הָ/אִשָּׁ֤ה טֽוֹבַת שֶׂ֨כֶל֙ וִ֣/יפַת תֹּ֔אַר וְ/הָ/אִ֥ישׁ קָשֶׁ֛ה וְ/רַ֥ע מַעֲלָלִ֖ים וְ/ה֥וּא כ/לב/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/003.yaml
  text: The man's name was Nabal[a], and his wife's name was Abigail. The woman was intelligent and beautiful in appearance, but the man was harsh and evil in his dealings; he was a Calebite.
translation:
  language: tl
  text: Ang pangalan ng lalaki ay Nabal, at Abigail naman ang pangalan ng asawa niya. Ang babae ay matalino at maganda ang anyo, ngunit ang lalaki ay mabagsik at masama ang mga gawa; isa siyang Calebita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tradisyonal na pagbasa sa Hebreo ay “Calebita,” samakatuwid, kabilang sa angkan ni Caleb. Di-karaniwan ang nakasulat na anyo, at maaari itong basahin sa ibang paraan.
    reason: textual_variant
lexical_decisions:
- source_word: נָבָל
  choice: Nabal
  rationale: Pangngalang pantangi; pinanatili sa karaniwang anyong ginagamit sa Filipino.
- source_word: אֲבִגָיִל
  choice: Abigail
  rationale: Pangngalang pantangi; ginamit ang nakasanayang anyo sa Filipino.
- source_word: טוֹבַת שֶׂכֶל
  choice: matalino
  rationale: Ang parirala ay literal na tumutukoy sa mabuting pang-unawa o wastong pag-iisip. Likas at malinaw na ipinahahayag ito ng “matalino” sa modernong Filipino.
- source_word: וִיפַת תֹּאַר
  choice: maganda ang anyo
  rationale: Tumutukoy ito sa pisikal na kagandahan o kaaya-ayang anyo; pinananatili ng salin ang kongkretong diwa nang hindi nagiging matigas pakinggan.
- source_word: קָשֶׁה
  choice: mabagsik
  rationale: Inilalarawan ang matigas at malupit na ugali ni Nabal sa pakikitungo sa iba. Mas angkop dito ang “mabagsik” kaysa sa literal na “matigas.”
- source_word: רַע מַעֲלָלִים
  choice: masama ang mga gawa
  rationale: Ang מַעֲלָלִים ay tumutukoy sa mga gawa, kilos, o asal. Ang saling ito ay tuwiran at hindi nililimitahan ang kahulugan sa pakikitungo lamang.
- source_word: כלבו
  choice: Calebita
  rationale: 'Sinusunod ang tradisyonal na pagbasa bilang katawagang pangangkan o pangkat: isang kabilang sa angkan ni Caleb. Dahil di-karaniwan ang nakasulat na anyo, itinala sa talababa ang tekstuwal na kalabuan.'
theological_decisions:
- issue: Pagpapakahulugan sa וְהוּא כלבו
  choice: isa siyang Calebita
  alternative: kabilang siya sa angkan ni Caleb; maaari ring basahin sa ibang paraan ang di-karaniwang nakasulat na anyo
  rationale: Pangunahing usaping tekstuwal at leksikal ito, hindi doktrinal. Ang tradisyonal na pagbasa bilang katawagang pangangkan ang pinakaangkop sa konteksto, ngunit hindi ikinubli ang tunay na kalabuan ng nakasulat na anyo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “Abigail naman” upang natural na maipakita ang magkatugmang pagbanggit sa pangalan ng lalaki at ng asawa niya. Inilagay ang talababa sa “Calebita,” ang mismong salitang saklaw ng tekstuwal na usapin.
