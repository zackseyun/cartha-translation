base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/035.yaml
  text: So David took from her hand what she had brought him[a], and he said to her, “Go up in peace to your house. See, I have listened to your voice and accepted you.”
translation:
  language: tl
  text: At kinuha ni David mula sa kamay ni Abigail ang dinala niya kay David. Sinabi ni David sa kanya, “Umakyat kang payapa patungo sa iyong tahanan. Tingnan mo, pinakinggan ko ang sinabi mo at pinagbigyan kita[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpakita ako ng pabor sa iyo” o “tinanggap kita.” Sa literal na Hebreo, “itinaas ko ang iyong mukha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Pinananatili ang payak at kongkretong kahulugan ng pandiwang לקח.
- source_word: מִיָּדָהּ
  choice: mula sa kamay niya
  rationale: Tahasang binabanggit ng Hebreo ang kamay, kaya pinanatili ang matingkad na larawan ng tuwirang pagtanggap.
- source_word: אֵת אֲשֶׁר הֵבִיאָה לוֹ
  choice: ang dinala nito para sa kanya
  rationale: Natural na Filipino para sa mga handog o pagkaing dinala ni Abigail kay David.
- source_word: עֲלִי לְשָׁלוֹם לְבֵיתֵךְ
  choice: Bumalik kang payapa sa iyong tahanan
  rationale: Ang עֲלִי ay literal na ‘umakyat ka,’ ngunit sa konteksto ay pagpapaalis kay Abigail pabalik sa tahanan niya; ang ‘bumalik’ ay malinaw at likas sa Filipino, samantalang pinananatili ng ‘payapa’ ang לְשָׁלוֹם.
- source_word: רְאִי
  choice: Tingnan mo
  rationale: Isang panawag-pansin na tuwiran at nauunawaan sa modernong Filipino.
- source_word: שָׁמַעְתִּי בְקוֹלֵךְ
  choice: pinakinggan ko ang sinabi mo
  rationale: Ipinapahayag ang idyomang ‘nakinig ako sa iyong tinig’ bilang aktuwal na pagdinig at pagsasaalang-alang sa pakiusap ni Abigail, nang hindi gumagamit ng di-likas na parirala.
- source_word: וָאֶשָּׂא פָּנָיִךְ
  choice: pinagbigyan kita
  rationale: Ang idyoma ay literal na ‘itinaas ang iyong mukha’ at sa konteksto ay nangangahulugang nagpakita ng pabor o pinagbigyan ang pakiusap. Ang ‘pinagbigyan kita’ ang pinakanatural sa konteksto.
theological_decisions:
- issue: Kahulugan ng idyomang וָאֶשָּׂא פָּנָיִךְ
  choice: pinagbigyan kita
  alternative: nagpakita ako ng pabor sa iyo; tinanggap kita; literal, itinaas ko ang iyong mukha
  rationale: Hindi ito ginawang pangkalahatang pahayag lamang ng pagtanggap. Sa konteksto, ipinahihiwatig ng idyoma na kinilala ni David si Abigail at ipinagkaloob ang pakiusap niyang huwag magsagawa ng paghihiganti; inilalahad sa talababa ang literal at iba pang posibleng diwa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tahanan” at “payapa” para sa natural na pananalita; iniwasan ang sobrang literal na “umakyat ka” at “nakinig ako sa iyong tinig,” ngunit idinokumento ang mahalagang idyomang Hebreo sa talababa.
