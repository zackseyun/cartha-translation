  text: וַ/תֹּ֤אמֶר לִ/נְעָרֶ֨י/הָ֙ עִבְר֣וּ לְ/פָנַ֔/י הִנְ/נִ֖י אַחֲרֵי/כֶ֣ם בָּאָ֑ה וּ/לְ/אִישָׁ֥/הּ נָבָ֖ל לֹ֥א הִגִּֽידָה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/019.yaml
  text: She said to her young men[a], “Go on ahead of me. Look, I am coming behind you.” But she did not tell her husband Nabal.
translation:
  language: tl
  text: Sinabi niya sa kanyang mga tauhan, “Mauna na kayo sa akin. Tingnan ninyo, susunod ako sa inyo.” Ngunit hindi niya ito sinabi sa asawa niyang si Nabal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Sinabi niya
  rationale: Ang wayyiqtol ng אמר ay nagsasaad ng kasunod na kilos sa salaysay; natural sa Tagalog ang “Sinabi niya” nang walang tahasang pang-ugnay.
- source_word: לִנְעָרֶיהָ
  choice: sa kanyang mga tauhan
  rationale: Maaaring tumukoy ang נַעַר sa binata, lingkod, o tauhan. Sa konteksto, sila ang mga lalaking inutusan ni Abigail na magdala ng mga panustos; ang “mga tauhan” ay natural at hindi nagpapalagay ng kanilang eksaktong edad.
- source_word: עִבְרוּ לְפָנַי
  choice: Mauna na kayo sa akin
  rationale: Sa kontekstong ito, ang עבר kasama ng לְפָנַי ay nangangahulugang lumakad o magpatuloy sa unahan ng nagsasalita. Likas sa modernong Tagalog ang “Mauna na kayo sa akin.”
- source_word: הִנְנִי
  choice: Tingnan ninyo
  rationale: Ang הִנְנִי ay pantawag-pansin na nakatuon sa gagawin ng nagsasalita. Pinananatili ng “Tingnan ninyo” ang diskursong diin, bagaman maaari ring unawain bilang “Narito.”
- source_word: אַחֲרֵיכֶם בָּאָה
  choice: susunod ako sa inyo
  rationale: Ipinahahayag ng anyong participle na darating si Abigail kasunod nila. Ang “susunod ako sa inyo” ay natural na Tagalog at pinananatili ang kaugnayang pangpuwesto at pagkakasunod.
- source_word: וּלְאִישָׁהּ נָבָל לֹא הִגִּידָה
  choice: Ngunit hindi niya ito sinabi sa asawa niyang si Nabal
  rationale: Sa konteksto, ang אִישָׁהּ ay “asawa niya,” at ang Hiphil ng נגד ay “sabihin/ipaalam.” Ang “Ngunit” ay malinaw na naghahayag ng kaibahan sa sinabi niya sa mga tauhan at sa hindi niya sinabi kay Nabal; idinagdag ang “ito” bilang likas na layon sa Tagalog nang hindi dinaragdagan ang diwa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at salaysay ang himig. Ginamit ang “mga tauhan” sa halip na “mga binata” upang hindi ipilit ang edad, at pinanatiling tuwiran ang utos at ang lihim na pagkilos ni Abigail.
