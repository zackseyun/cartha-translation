base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/044.yaml
  text: Saul had given Michal his daughter[a], David’s wife, to Palti son of Laish, who was from Gallim.
translation:
  language: tl
  text: At ibinigay na ni Saul ang anak niyang si Mical, na asawa ni David, kay Palti na taga-Galim, anak ni Lais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang salin, “Falti”; ang anyong Hebreo rito ay Palti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל
  choice: naman ni Saul
  rationale: Ang וְ ay ipinahiwatig sa natural na daloy ng salaysay sa pamamagitan ng “naman,” nang hindi nagdaragdag ng tahasang panandang-panahong wala sa Hebreo.
- source_word: נָתַן
  choice: Ibinigay
  rationale: Tumutukoy ito sa natapos na kilos; malinaw sa konteksto at sa ayos ng pangungusap na nauna nang ginawa ni Saul ang pagbibigay kay Mical.
- source_word: מִיכַל בִּתּוֹ
  choice: ang anak niyang si Mical
  rationale: Natural na makabagong Tagalog para sa pariralang kumikilala kay Mical bilang anak ni Saul.
- source_word: אֵשֶׁת דָּוִד
  choice: na asawa ni David
  rationale: Pinananatili ang tuwirang pagkakakilanlan kay Mical bilang asawa ni David, nang hindi nilulutas ang tensiyong dulot ng pagbibigay sa kaniya sa ibang lalaki.
- source_word: לְפַלְטִי
  choice: kay Palti
  rationale: Tuwirang transliterasyon ng pangalang Hebreo na פַלְטִי at natural ang panandang “kay” para sa taong tumanggap.
- source_word: בֶן לַיִשׁ
  choice: na anak ni Lais
  rationale: Karaniwang paraang Tagalog ng pagpapahayag ng patronimiko.
- source_word: אֲשֶׁר מִגַּלִּים
  choice: na taga-Galim
  rationale: Maikli at likas na Tagalog para sa taong nagmula o nakaugnay sa isang lugar.
theological_decisions:
- issue: Ang kalagayan ni Mical bilang asawa ni David habang ibinibigay siya kay Palti
  choice: na asawa ni David
  alternative: na dating asawa ni David
  rationale: Hindi sinasabi ng Hebreo na “dating” asawa; pinananatili ng salin ang legal at teolohikal na tensiyon ng teksto sa halip na lutasin ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naman” upang maipahiwatig ang Hebreong pang-ugnay at ang paglipat ng pokus sa ginawa ni Saul, nang hindi nagpapasok ng tahasang “ngayon” o ibang panandang-panahon.
