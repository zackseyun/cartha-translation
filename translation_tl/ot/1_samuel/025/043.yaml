  text: David also took Ahinoam of Jezreel[b][a], and both of them became his wives.
translation:
  language: tl
  text: Kinuha rin ni David si Ahinoam na taga-Jezreel[a], at silang dalawa ay naging mga asawa niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “si Ahinoam mula sa Jezreel” o “si Ahinoam ng Jezreel.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at silang dalawa ay naging mga asawa sa kaniya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח
  choice: kinuha
  rationale: Pinananatili nito ang karaniwang kahulugan ng pandiwang Hebreo na ‘kumuha.’ Nililinaw ng kasunod na parirala na ang tinutukoy ay pagkuha sa kaniya bilang asawa.
- source_word: אֲחִינֹעַם
  choice: Ahinoam
  rationale: Isinalin sa baybay na karaniwang ginagamit para sa pangalang pantangi.
- source_word: מִיִּזְרְעֶאל
  choice: na mula sa Jezreel
  rationale: Tuwirang ipinapahayag ng pang-ukol na מִן ang pinagmulan o kaugnayan niya sa lugar na Jezreel; natural sa Filipino ang ‘na mula sa Jezreel.’
- source_word: וַתִּהְיֶיןָ גַּם שְׁתֵּיהֶן
  choice: at silang dalawa ay naging
  rationale: Ang pandiwa at panghalip ay kapuwa pambabae at tumutukoy kina Ahinoam at Abigail; pinananatili ng ‘naging’ ang diwa ng היה.
- source_word: לְנָשִׁים
  choice: mga asawa niya
  rationale: Natural na Filipino ito para sa idyomang Hebreo na literal na ‘bilang mga asawa sa kaniya,’ at malinaw na pinananatili ang maramihang bilang.
- source_word: גַּם
  choice: rin
  rationale: Ipinahihiwatig ng kataga ang pagdaragdag kay Ahinoam bukod kay Abigail; ‘rin’ ang natural na katumbas sa kontekstong ito.
theological_decisions:
- issue: Paglalarawan sa pagkakaroon ni David ng higit sa isang asawa
  choice: Tuwirang sinabing naging mga asawa niya ang dalawang babae.
  alternative: Palabuin o pagaanin ang pagtukoy sa maramihang pag-aasawa.
  rationale: Malinaw na inilalarawan ng Hebreo ang kalagayan nang hindi nagbibigay rito ng tahasang pagsang-ayon o paghatol; gayon din ang salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na pagsasalaysay ng Hebreo at iniwasang dagdagan ito ng moral o doktrinal na pagpapakahulugan.
