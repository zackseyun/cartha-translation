  text: וַ/יִּשְׁלַ֥ח דָּוִ֖ד עֲשָׂרָ֣ה נְעָרִ֑ים וַ/יֹּ֨אמֶר דָּוִ֜ד לַ/נְּעָרִ֗ים עֲל֤וּ כַרְמֶ֨לָ/ה֙ וּ/בָאתֶ֣ם אֶל נָבָ֔ל וּ/שְׁאֶלְתֶּם ל֥/וֹ בִ/שְׁמִ֖/י לְ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/005.yaml
  text: So David sent ten young men[a], and David said to the young men, “Go up to Carmel, and go to Nabal, and greet him in my name with peace.”
translation:
  language: tl
  text: Kaya nagsugo si David ng sampung binata at sinabi niya sa kanila, “Umakyat kayo sa Carmel, pumunta kay Nabal, at kumustahin ninyo siya sa pangalan ko.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Karaniwang salaysay na gamit ng שלח; natural sa Filipino kapag may mga taong ipinadadala bilang mga sugo.
- source_word: עֲשָׂרָה נְעָרִים
  choice: sampung binata
  rationale: Ang נְעָרִים ay maaaring tumukoy sa mga kabataang lalaki o mga lingkod. Pinananatili ng “binata” ang pangunahing pahiwatig ng edad nang hindi idinaragdag na sila ay mga lingkod.
- source_word: עֲלוּ כַרְמֶלָה
  choice: Umakyat kayo sa Carmel
  rationale: Pinananatili ang kilos na ipinahihiwatig ng עלה at ang direksiyonal na hulapi sa כַרְמֶלָה sa natural na Filipino.
- source_word: וּבָאתֶם אֶל נָבָל
  choice: pumunta kay Nabal
  rationale: Bagaman literal na “dumating/lumapit,” mas natural ang “pumunta” sa utos mula sa pananaw ni David.
- source_word: וּשְׁאֶלְתֶּם לוֹ ... לְשָׁלוֹם
  choice: kumustahin ninyo siya
  rationale: Idyomatikong ipinahahayag nito ang pagtatanong tungkol sa kapayapaan o kalagayan ng isang tao bilang pagbati; natural at malinaw sa modernong Filipino.
- source_word: בִשְׁמִי
  choice: sa pangalan ko
  rationale: Malapit sa literal na anyo at malinaw na si David ang kinakatawan ng pagbati.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “binata” sa halip na “mga lingkod” upang huwag tukuyin nang higit sa mismong salitang Hebreo. Ang “kumustahin” ay likas na katumbas ng Hebreong pormula ng pagtatanong tungkol sa kapayapaan o mabuting kalagayan.
