  text: וַ/יָּ֣מָת שְׁמוּאֵ֔ל וַ/יִּקָּבְצ֤וּ כָל יִשְׂרָאֵל֙ וַ/יִּסְפְּדוּ ל֔/וֹ וַ/יִּקְבְּרֻ֥/הוּ בְּ/בֵית֖/וֹ בָּ/רָמָ֑ה וַ/יָּ֣קָם דָּוִ֔ד וַ/יֵּ֖רֶד אֶל מִדְבַּ֥ר פָּארָֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/001.yaml
  text: Samuel died[a], and all Israel gathered and mourned for him, and they buried him at his house in Ramah. Then David arose and went down to the wilderness of Paran.
translation:
  language: tl
  text: Namatay si Samuel. Nagtipon ang buong Israel at nagluksa[a] para sa kanya, at inilibing nila siya sa bahay niya sa Rama. Pagkatapos, tumindig si David at bumaba patungo sa ilang ng Paran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nanaghoy.” Ang pandiwang Hebreo ay tumutukoy sa mga gawaing pagluluksa para sa yumao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת שְׁמוּאֵל
  choice: Namatay si Samuel
  rationale: Tuwirang isinasalin ang simpleng salaysay ng pagkamatay; hindi nagdaragdag ng tahasang panandang pamanahon na wala sa Hebreo.
- source_word: וַיִּקָּבְצוּ כָל יִשְׂרָאֵל
  choice: Nagtipon ang buong Israel
  rationale: Pinananatili ang kolektibong pambansang katawagang כָל יִשְׂרָאֵל, habang gumagamit ng likas na pandiwang Filipino para sa pagtitipon.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: nagluksa para sa kanya
  rationale: Ang ספד ay tumutukoy sa pagluluksa o panaghoy para sa yumao. Malinaw at kasalukuyang gamit ang “nagluksa,” samantalang inilalahad sa talababa ang mas tiyak na alternatibong “nanaghoy.”
- source_word: וַיִּקְבְּרֻהוּ בְּבֵיתוֹ בָּרָמָה
  choice: inilibing nila siya sa bahay niya sa Rama
  rationale: Pinananatili ang payak na anyo ng Hebreong “sa bahay niya” nang hindi ipinapasiyang ang libingan ay nasa loob mismo ng tirahan o nasa ari-ariang kaugnay nito.
- source_word: וַיָּקָם דָּוִד
  choice: Pagkatapos, tumindig si David
  rationale: Isinasalin ang kilos at pagsulong ng salaysay na ipinahihiwatig ng קום; ang “Pagkatapos” ay likas na nag-uugnay sa kasunod na pangyayari.
- source_word: וַיֵּרֶד אֶל מִדְבַּר פָּארָן
  choice: bumaba patungo sa ilang ng Paran
  rationale: Pinananatili ang topograpikong “bumaba” ng ירד at isinasalin ang מִדְבָּר bilang “ilang,” ang karaniwang dignified na katawagan sa lupaing ilang o wilderness.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “buong Israel” bilang kolektibong pambansang katawagan, “ilang” para sa wilderness, at ang mga pangalang “Rama” at “Paran” sa karaniwang anyong Filipino. Hinati ang unang mahabang hanay ng mga sugnay upang maging natural basahin nang hindi binabago ang pagkakasunod-sunod ng mga pangyayari.
