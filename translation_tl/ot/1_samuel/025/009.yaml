base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/009.yaml
  text: When David’s young men came[a], they spoke to Nabal all these words in David’s name, and then they rested.
translation:
  language: tl
  text: Nang dumating ang mga kabataang lalaki ni David, sinabi nila kay Nabal ang lahat ng salitang ito sa pangalan ni David, at pagkatapos ay nagpahinga sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumigil sila” o “nanahimik sila.” Karaniwang nangangahulugang “magpahinga” ang pandiwang Hebreo. Sa kontekstong ito, maaari rin itong magpahiwatig na natapos silang magsalita at naghintay ng tugon ni Nabal.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי
  choice: mga kabataang tauhan
  rationale: Ang נַעַר ay maaaring tumukoy sa isang kabataan, lingkod, o tauhan. Dito, sila ang mga sugo at tagasunod ni David; pinananatili ng “kabataang tauhan” ang pahiwatig ng edad nang hindi ipinapalagay na mga bata sila.
- source_word: וַיָּבֹאוּ
  choice: dumating
  rationale: Karaniwang nangangahulugang “dumating” o “pumaroon” ang בוא. Ang “dumating” ay natural sa pagkakasunod-sunod ng salaysay.
- source_word: וַיְדַבְּרוּ אֶל
  choice: sinabi nila kay
  rationale: Ang דבר na may אֶל ay nagpapahayag ng pagsasalita na nakatuon sa isang tao. Sa kontekstong naghahatid sila ng mensahe, natural sa Filipino ang “sinabi nila kay.”
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: ang lahat ng salitang iyon
  rationale: Pinananatili nito ang verbal na diwa ng דְּבָרִים at ang pagtukoy sa mensaheng kababanggit lamang. Ang prefiksong כְּ ay may diwang “ayon sa,” ngunit sapat na naipahihiwatig dito na tapat nilang inilahad ang buong mensahe.
- source_word: בְּשֵׁם דָּוִד
  choice: sa pangalan ni David
  rationale: Ipinahihiwatig ng parirala na nagsalita sila bilang mga kinatawan at sa kapahintulutan ni David. Pinananatili ng “sa pangalan ni David” ang pormal na larawan ng Hebreo.
- source_word: וַיָּנוּחוּ
  choice: tumigil sila at naghintay
  rationale: Karaniwang may diwang “magpahinga” o “manatili” ang נוח. Pagkatapos maihatid ang mensahe, malamang na tumigil sila sa pagsasalita at naghintay ng tugon; inilalahad ng salin ang kontekstuwal na diwang ito habang ang talababa ay nagpapanatili sa literal na posibilidad.
