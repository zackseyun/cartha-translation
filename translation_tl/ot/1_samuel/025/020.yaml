  verdict: revise
  source_fidelity: 'Tumpak sa kabuuan ang pagsasalin ng mga kilos: nakasakay si Abigail, bumababa siya sa tago/nakukubling bahagi ng bundok, bumababa rin si David at ang kanyang mga tauhan patungo sa kanya, at nagkita sila. Gayunman, ang “naroon at pababa naman sina David” ay hindi likas na kayarian at hindi malinaw na naihahatid ang pansin-tawag ng וְהִנֵּה.'
  naturalness: Kailangan ang maliit na rebisyon para sa mas malinaw at likas na modernong Tagalog. Ang “narito,” ay isang angkop na pangsalaysay na katumbas ng “behold,” at ang “bumababa si David at ang kanyang mga tauhan” ay tuwiran at gramatikal.
  terminology: Ang “asno,” “tagong bahagi ng bundok,” at “nakasalubong” ay katanggap-tanggap sa marangal na salaysay. Pinanatili ang topograpikong di-tiyak ng Hebreo at ang footnote na nagbibigay ng leksikal na alternatibo.
  issues:
