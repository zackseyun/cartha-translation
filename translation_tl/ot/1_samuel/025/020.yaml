base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/020.yaml
  text: And as she was riding on the donkey and going down under cover of the mountain[a], behold, David and his men were coming down to meet her, and she met them.
translation:
  language: tl
  text: Habang nakasakay siya sa asno at bumababa sa tagong bahagi ng bundok[a], narito, bumababa si David at ang kanyang mga tauhan patungo sa kanya, at nakasalubong niya sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa nasisilungang bahagi ng bundok.” Ang pariralang Hebreo ay tumutukoy sa isang tago o nakukubliang bahagi ng bundok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הִיא
  choice: Habang ... siya
  rationale: Ipinahahayag ng kayariang ito ang tagpong nagaganap at ang kasabay na kilos; natural sa makabagong Tagalog ang “Habang” kaysa sa literal na “At nangyari.”
- source_word: רֹכֶבֶת עַל הַחֲמוֹר
  choice: nakasakay siya sa asno
  rationale: Tuwirang ipinapahayag ang patuloy na pagsakay; karaniwan at marangal na katumbas ng חֲמוֹר ang “asno.”
- source_word: וְיֹרֶדֶת
  choice: at bumababa
  rationale: Pinananatili ang kilos na pagbaba ayon sa anyong participle at sa kalupaan ng tagpo.
- source_word: בְּסֵתֶר הָהָר
  choice: sa tagong bahagi ng bundok
  rationale: Ang סֵתֶר ay tumutukoy sa pagkakatago o pagkalingid; ipinapahiwatig ng parirala ang nakukubli o nasisilungang bahagi ng bundok nang hindi sobrang tinutukoy ang eksaktong topograpiya.
- source_word: וְהִנֵּה
  choice: naroon at
  rationale: Ipinananatili nito ang biglang pagtawag-pansin ng הִנֵּה sa paraang natural sa salaysay na Tagalog.
- source_word: יֹרְדִים לִקְרָאתָהּ
  choice: pababa ... patungo sa kanya
  rationale: Ang ירד ay pagbaba, at ang לִקְרָאתָהּ ay pagkilos sa direksiyon ng isang tao upang makasalubong siya. Ang “patungo sa kanya” ay hindi labis na nagpapahiwatig na sinadya nilang makipagtagpo.
- source_word: וַתִּפְגֹּשׁ אֹתָם
  choice: at nasalubong niya sila
  rationale: Ang פגש ay pagkikita o pagsasalubong; mas angkop sa magkasalungat na pagkilos sa daan ang “nasalubong” kaysa sa payak na “nakita.”
