  to: Habang nakasakay siya sa asno at bumababa sa tagong bahagi ng bundok[a], narito, bumababa si David at ang kanyang mga tauhan patungo sa kanya, at nakasalubong niya sila.
  rationale: Pinalitan ang hindi likas na “naroon at pababa naman sina David” ng “narito, bumababa si David at ang kanyang mga tauhan.” Pinananatili nito ang masiglang pansin-tawag ng וְהִנֵּה, ang sabayang pagbaba ng dalawang pangkat, at ang di-tiyak na direksiyong ipinahihiwatig ng לִקְרָאתָהּ. Ginawang “nakasalubong” ang pangwakas upang maging malinaw na naganap ang pagkikita sa salaysay.
