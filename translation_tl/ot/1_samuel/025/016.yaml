  text: They were a wall around us both by night and by day[b][a], all the days we were with them tending the flock.
translation:
  language: tl
  text: Nagsilbi silang pader sa paligid namin[a], gabi’t araw, sa buong panahong kami’y kasama nila habang nagpapastol kami ng kawan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ibabaw namin,” ayon sa mas literal na diwa ng pang-ukol; sa konteksto, inilalarawan nito ang kanilang presensiyang nag-iingat at nakapaligid.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong salita ay kolektibong katawagan sa kawan at maaaring kabilang dito ang mga tupa at kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: pader
  rationale: Pinananatili ang kongkretong larawan ng Hebreo. Sa konteksto, metapora ito para sa proteksiyon.
- source_word: הָיוּ
  choice: nagsilbi silang
  rationale: Ipinapahayag nito sa natural na Tagalog ang ginampanang papel ng mga lalaki bilang isang ‘pader,’ nang hindi ipinahihiwatig na literal silang pader.
- source_word: עָלֵינוּ
  choice: sa paligid namin
  rationale: Bagaman karaniwang nangangahulugang ‘sa ibabaw namin’ ang pang-ukol, sa pagsama nito sa ‘pader’ ang diwa ay proteksiyong nakapaligid.
- source_word: גַּם לַיְלָה גַּם יוֹמָם
  choice: gabi’t araw
  rationale: Natural at mariing pahayag sa Tagalog ng tuloy-tuloy na proteksiyon sa buong magdamag at maghapon.
- source_word: כָּל יְמֵי הֱיוֹתֵנוּ עִמָּם
  choice: sa buong panahong kasama namin sila
  rationale: Malinaw na inilalahad ang temporal na diwa ng Hebreo sa makabagong Tagalog.
- source_word: רֹעִים
  choice: habang nagpapastol kami
  rationale: Ipinapakita ang patuloy na gawain ng mga nagsasalita sa pag-aalaga at pagpapakain sa kawan.
- source_word: הַצֹּאן
  choice: ang kawan
  rationale: Ang Hebreong kolektibong katawagan ay maaaring tumukoy sa mga tupa at kambing, kaya mas angkop ang masaklaw na ‘kawan’ kaysa ‘mga tupa.’
