  text: וַ/יְהִ֖י כַּ/עֲשֶׂ֣רֶת הַ/יָּמִ֑ים וַ/יִּגֹּ֧ף יְהוָ֛ה אֶת נָבָ֖ל וַ/יָּמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/038.yaml
  text: And about ten days later[a], Yahweh struck Nabal, and he died.
translation:
  language: tl
  text: Pagkaraan ng humigit-kumulang sampung araw[a], sinaktan ni Yahweh si Nabal, at namatay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “makalipas ang mga sampung araw.” Nagpapahiwatig ang pananalitang Hebreo ng tinatayang sampung araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Pagkaraan
  rationale: Ipinahahayag ng anyong pasalaysay ang pagsunod ng susunod na pangyayari; ang “Pagkaraan” ay likas na salaysay sa modernong Tagalog nang hindi kinakailangang isalin nang mekanikal bilang “At nangyari.”
- source_word: כַּעֲשֶׂרֶת הַיָּמִים
  choice: ng humigit-kumulang sampung araw
  rationale: Ang unlaping כ־ ay nagpapahiwatig ng pagtatantiya. Pinananatili ng “humigit-kumulang” ang di-tiyak na tagal na malapit sa sampung araw.
- source_word: וַיִּגֹּף
  choice: sinaktan
  rationale: Ang נָגַף ay tumutukoy sa pagdagok o pananakit, lalo na bilang kilos ng Diyos. Malawak ang “sinaktan” at hindi nito tinutukoy kung pisikal na hampas, sakit, o salot ang paraan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶת נָבָל
  choice: si Nabal
  rationale: Hindi hiwalay na isinasalin ang pananda ng tuwirang layon na אֶת; ginagamit ang likas na pantukoy na “si” bago ang personal na pangalan.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: 'Pinananatili ang payak na pagkakasunod ng dalawang pandiwa: sinaktan siya ni Yahweh, at pagkatapos ay namatay siya. Hindi ito pinagsasanib bilang “pinatay” o “sinaktan hanggang mamatay.”'
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaibang iyon sa isang titulo.
- issue: Antas ng sanhi sa kamatayan ni Nabal
  choice: sinaktan ni Yahweh si Nabal, at namatay siya
  alternative: pinatay ni Yahweh si Nabal; sinaktan ni Yahweh si Nabal kaya namatay siya
  rationale: Dalawang magkasunod na pandiwa ang nasa Hebreo. Malinaw na iniuugnay ng salaysay ang pagkamatay sa pagkilos ni Yahweh, ngunit hindi nito pinagsasanib ang mga pandiwa o tahasang idinaragdag ang “kaya.”
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “humigit-kumulang” upang malinaw na ihayag ang pagtatantiya, at ang “sinaktan” upang huwag magdagdag ng tiyak na paraan ng banal na pagdagok na hindi binabanggit ng teksto.
