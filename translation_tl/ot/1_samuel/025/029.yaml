revisions:
- from: Bagaman may bumangong lalaki upang tugisin ka at hangaring kitilin ang buhay mo, ang buhay ng panginoon ko ay mabibigkis sa bigkis ng mga buháy[a], kasama ni Yahweh na iyong Diyos; ngunit ang buhay ng iyong mga kaaway ay ihahagis niya mula sa lalagyan ng tirador[b].
  to: Bagaman may bumangong lalaki upang tugisin ka at hangaring kitilin ang buhay mo, ang buhay ng panginoon ko ay matatali sa bigkis ng mga buháy[a], kasama ni Yahweh na iyong Diyos; ngunit ang buhay ng iyong mga kaaway ay ipapahilagpos niya na parang mula sa supot ng tirador[b].
  rationale: Pinalitan ang pangwakas na parirala upang igalang ang בְּתוֹךְ ("sa loob/sa gitna ng") at maipakita sa natural na Filipino ang metaporang paghahagis gamit ang tirador. Pinalitan din ang "mabibigkis" ng mas likas na "matatali," nang hindi inaalis ang magkapares na larawang pagbibigkis at paghagis. Walang idinagdag na interpretasyong eskatolohikal o doktrinal.
