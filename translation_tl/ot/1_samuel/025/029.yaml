base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/029.yaml
  text: Though a man has risen to pursue you and to seek your life[a], yet the life of my lord shall be bound in the bundle of the living with Yahweh your God[b], and the lives of your enemies he shall sling out from the hollow of the sling.
translation:
  language: tl
  text: Bagaman may bumangong lalaki upang tugisin ka at hangaring kitilin ang buhay mo, ang buhay ng panginoon ko ay matatali sa bigkis ng mga buháy[a], kasama ni Yahweh na iyong Diyos; ngunit ang buhay ng iyong mga kaaway ay ipapahilagpos niya na parang mula sa supot ng tirador[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahigpit na matatali sa balutan ng buhay.” Ang larawan sa Hebreo ay isang bagay na binalot o itinali nang ligtas upang maingatan.
    reason: lexical_alternative
  - marker: b
    text: O “ihahagis niya.” Ang pandiwa sa Hebreo ay tumutukoy mismo sa kilos ng paggamit ng tirador at sadyang kabaligtaran ng ligtas na pagkakabigkis sa naunang larawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם אָדָם
  choice: Bagaman may bumangong lalaki
  rationale: Ipinahahayag nito ang mapagparayang diwa ng sugnay sa pananalita ni Abigail. Pinanatili ang isahang panlalaking אָדָם bilang “lalaki,” na sa konteksto ay tumutukoy sa isang tiyak na humahabol kay David.
- source_word: לִרְדָפְךָ
  choice: upang tugisin ka
  rationale: Ang רדף ay hostile na paghabol; natural at marangal sa Filipino ang “tugisin.”
- source_word: וּלְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: at hangaring kitilin ang buhay mo
  rationale: Dito ang נֶפֶשׁ ay buhay o sarili na pinupuntirya. Ipinahahayag ng “hangaring kitilin” ang nakamamatay na layon ng Hebreong idyomang “hanapin ang buhay,” na magiging malabo kung isasalin nang salita-sa-salita.
- source_word: נֶפֶשׁ אֲדֹנִי
  choice: ang buhay ng panginoon ko
  rationale: Pinananatili ang magalang na tawag ni Abigail kay David at ang pagkakapantay ng “buhay” niya sa “buhay” ng kaniyang mga kaaway.
- source_word: צְרוּרָה בִּצְרוֹר הַחַיִּים
  choice: mabibigkis sa bigkis ng mga buháy
  rationale: Pinananatili ang sadyang pag-uulit at kongkretong larawan ng isang bagay na ligtas na ibinalot o itinali. Ang “mga buháy” ay tumutugma sa anyong maramihan ng הַחַיִּים nang hindi ito ginagawang tahasang aral tungkol sa kabilang buhay.
- source_word: אֵת יְהוָה אֱלֹהֶיךָ
  choice: kasama ni Yahweh na iyong Diyos
  rationale: Ipinananatili ang diwa ng pakikisama o pagiging nasa piling na maaaring taglayin ng אֵת, sa halip na agad itong ipakahulugang “sa pag-iingat ng.” Ginamit ang personal na pangalang Yahweh.
- source_word: וְאֵת נֶפֶשׁ אֹיְבֶיךָ
  choice: ngunit ang buhay ng iyong mga kaaway
  rationale: Ang isahang נֶפֶשׁ ay kolektibong tumutukoy sa buhay ng maramihang mga kaaway. Ang “ngunit” ay malinaw na nagpapakita ng matinding paghahambing sa kapalaran ni David.
- source_word: יְקַלְּעֶנָּה
  choice: ihahagis niya
  rationale: Ang pandiwa ay partikular na kaugnay ng pagpapahilagpos gamit ang tirador. Ang kasunod na parirala ang nagpapanatili sa imahen ng tirador sa natural na Filipino.
- source_word: בְּתוֹךְ כַּף הַקָּלַע
  choice: mula sa lalagyan ng tirador
  rationale: Ang כַּף ay literal na palad o malukong na bahagi at dito ay ang supot o lalagyan ng bato sa tirador. Ang “mula sa lalagyan” ay malinaw na naglalarawan sa batong pinakakawalan.
theological_decisions:
- issue: Ang paghahambing ng pag-iingat kay David at pagpuksa sa kaniyang mga kaaway
  choice: Pinanatili ang kongkretong mga larawan ng pagkabigkis sa isang bigkis at paghahagis mula sa tirador.
  alternative: Ipaliwanag ang “bigkis ng mga buháy” bilang tahasang pangako ng buhay na walang hanggan, o gawing pangkalahatang “iingatan” at “lilipulin” ang dalawang larawan.
  rationale: Ipinapahayag ng talata ang pag-iingat ng Diyos kay David at pag-aalis sa kaniyang mga kaaway, ngunit hindi nito tahasang binubuo ang isang aral tungkol sa kabilang buhay. Ang pagpapanatili sa larawan ay umiiwas kapwa sa labis na pagpapakahulugan at sa pagpapakinis ng tensiyon.
- issue: Ang kaugnayan ng buhay ni David kay Yahweh sa pariralang אֵת יְהוָה
  choice: Isinaling “kasama ni Yahweh na iyong Diyos.”
  alternative: “sa pag-iingat ni Yahweh na iyong Diyos” o “sa piling ni Yahweh na iyong Diyos.”
  rationale: Mas tuwirang pinananatili ng “kasama” ang kaugnayang ipinahihiwatig ng אֵת at hindi tahasang nilulutas kung ang diin ay presensiya, pakikisama, o pag-iingat ng Diyos.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong talinghaga at ang pangalang Yahweh. Ginamit ang tuldik sa “buháy” upang malinaw na makilala ito sa “búhay” sa magkasunod na parirala.
