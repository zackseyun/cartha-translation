source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֲדֹנִ֗/י חַי יְהוָ֤ה וְ/חֵֽי נַפְשְׁ/ךָ֙ אֲשֶׁ֨ר מְנָעֲ/ךָ֤ יְהוָה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הוֹשֵׁ֥עַ יָדְ/ךָ֖ לָ֑/ךְ וְ/עַתָּ֗ה יִֽהְי֤וּ כְ/נָבָל֙ אֹיְבֶ֔י/ךָ וְ/הַֽ/מְבַקְשִׁ֥ים אֶל אֲדֹנִ֖/י רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/026.yaml
  text: '[A], my lord, as Yahweh lives and as you yourself live, since Yahweh has kept you from bloodguilt and from saving yourself by your own hand[b], now let your enemies and those who seek evil against my lord be like Nabal.'
translation:
  language: tl
  text: At ngayon, panginoon ko, kung paanong buhay si Yahweh at buhay ka rin, yamang pinigilan ka ni Yahweh na magkaroon ng pagkakasala dahil sa pagdanak ng dugo at iligtas ang sarili mo sa sarili mong kamay[a], maging gaya ni Nabal ang iyong mga kaaway at ang mga naghahangad ng masama laban sa iyo, panginoon ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at ipaghiganti ang sarili mo sa sarili mong kamay.”
    reason: lexical_alternative
  - marker: b
    text: Ang “maging gaya ni Nabal” ay malamang na tumutukoy sa taong si Nabal; ang pangalan niya ay umaalingawngaw rin sa salitang Hebreo para sa “hangal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: May tahasang temporal na עַתָּה sa Hebreo. Ang “Kaya ngayon” ay natural na nag-uugnay sa panunumpa at sa kasunod na kahilingan sa konteksto.
- source_word: אֲדֹנִי
  choice: panginoon ko
  rationale: Magalang na tawag ni Abigail kay David. Ang maliit na titik ay tumutulong na ipakitang titulo ito para sa tao, hindi pangalan o titulo ng Diyos.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: buhay si Yahweh at buhay ka rin
  rationale: Pinananatili ang pormula ng panunumpa at natural itong nauunawaan sa modernong Tagalog; ang נֶפֶשׁ dito ay tumutukoy sa mismong buhay o persona ng kausap, hindi kailangang isaling literal na “kaluluwa.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: מְנָעֲךָ
  choice: pinigilan ka
  rationale: Tuwirang ipinapahayag ang pagpigil o paghadlang ni Yahweh kay David.
- source_word: מִבּוֹא בְדָמִים
  choice: na magkaroon ng pananagutan sa pagdanak ng dugo
  rationale: Ipinapahayag nito hindi lamang ang marahas na pagpatay kundi ang pananagutang moral dahil sa dugong ibububo.
- source_word: וְהוֹשֵׁעַ יָדְךָ לָךְ
  choice: at magligtas sa sarili mo sa pamamagitan ng sarili mong kamay
  rationale: Pinananatili sa pangunahing teksto ang karaniwang diwa ng ugat na ישׁע, “magligtas,” kasama ang idiomang tumutukoy sa sariling pagkilos. Inilalagay sa talababa ang mas kontekstuwal na pagbasa tungkol sa paghihiganti.
- source_word: יִהְיוּ כְנָבָל
  choice: maging gaya ni Nabal
  rationale: Pangunahing tinutukoy ang taong si Nabal, habang ang alingawngaw ng pangalan sa salitang Hebreo para sa “hangal” ay ipinapaliwanag sa talababa.
- source_word: הַמְבַקְשִׁים אֶל אֲדֹנִי רָעָה
  choice: ang mga naghahangad na saktan ka, panginoon ko
  rationale: Natural na Tagalog para sa paghahangad ng masama laban sa isang tao. Ang panghalip na “ka” ay malinaw na tumutukoy kay David, na agad muling tinatawag na “panginoon ko.”
theological_decisions:
- issue: Paglalarawan sa pagkilos na ipinigil kay David
  choice: Pinigilan siya ni Yahweh na magkaroon ng pananagutan sa pagdanak ng dugo at magligtas sa sarili sa sarili niyang kamay.
  alternative: Pinigilan siya ni Yahweh na maghiganti sa sarili niyang kamay.
  rationale: Ang pangunahing salin ay nananatiling malapit sa pandiwang ישׁע habang hindi ikinukubli ang moral na pananagutan sa pagdanak ng dugo. Ang mas tiyak na interpretasyong “maghiganti” ay malakas sa konteksto ngunit inilalagay sa talababa upang mapanatili ang tunay na saklaw ng idyoma.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong pinagmulan at hindi ito pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ngunit madaling maunawaan. Ginamit ang “panginoon ko” bilang makasaysayang magalang na tawag sa isang taong nakatataas, at iniwasan ang sobrang literal na “buhay ang iyong kaluluwa,” na hindi natural sa kasalukuyang Tagalog.
