  to: At ngayon, nabalitaan kong panahon na ng paggugupit ng iyong mga tupa. Ang iyong mga pastol, na kasama namin, ay hindi namin ipinahiya[a], at walang anumang nawala sa kanila sa buong panahong nasa Carmel sila.
