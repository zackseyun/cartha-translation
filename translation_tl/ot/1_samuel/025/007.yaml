    issue: Bahagyang di-tuwirang pagpapahayag ng ‘walang anumang nawawala sa kanila’
    rationale: Ang “wala silang anumang nawala” ay posible ngunit maaaring pakinggang gaya ng aktibong ‘may nawala sila.’ Ang “walang anumang nawala sa kanila” ay mas malinaw na walang anumang ari-arian o bagay na nawala sa kanila.
