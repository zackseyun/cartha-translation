base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/007.yaml
  text: And now I have heard that you have shearers. Now your shepherds[a], who were with us, we did not mistreat, and nothing of theirs was missing all the days they were in Carmel.
translation:
  language: tl
  text: At ngayon, nabalitaan kong panahon na ng paggugupit ng iyong mga tupa. Ang iyong mga pastol, na kasama namin, ay hindi namin ipinahiya[a], at walang anumang nawala sa kanila sa buong panahong nasa Carmel sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi namin sila minaltrato.” Ang pandiwang Hebreo ay literal na tumutukoy sa pagdudulot ng kahihiyan o paghamak; sa konteksto, maaari rin itong magpahiwatig na hindi sila sinaktan o inabuso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayo
  rationale: Pinananatili ang pang-ugnay at ang paglipat sa kasalukuyang pakiusap sa natural na Tagalog.
- source_word: שָׁמַעְתִּי כִּי גֹזְזִים לָךְ
  choice: nabalitaan kong panahon na ng paggugupit ng iyong mga tupa
  rationale: Ang literal na ‘may mga manggugupit ka’ ay di-likas sa Tagalog; ipinahahayag ng parirala ang kasalukuyang panahon o gawain ng paggugupit para kay Nabal.
- source_word: הָרֹעִים אֲשֶׁר לְךָ הָיוּ עִמָּנוּ
  choice: Ang iyong mga pastol, na kasama namin
  rationale: Tuwirang inililipat ang pagmamay-ari at ugnayang ipinahahayag ng Hebreo nang hindi ipinapalagay na tumira sila kasama ng pangkat ni David.
- source_word: לֹא הֶכְלַמְנוּם
  choice: hindi namin ipinahiya
  rationale: Malapit ito sa pangunahing kahulugan ng Hiphil ng כלם, na tumutukoy sa pagdudulot ng kahihiyan o disgrace; pinananatili ang saklaw ng salita sa halip na tahasang paliitin ito sa pananakit o pagmamaltrato.
- source_word: וְלֹא נִפְקַד לָהֶם מְאוּמָה
  choice: wala silang anumang nawala
  rationale: Natural na Tagalog para sa diwang walang anumang bagay nila ang nawala o hindi naisaalang-alang, habang iniiwasan ang alanganing literal na dative.
- source_word: כָּל יְמֵי הֱיוֹתָם בַּכַּרְמֶל
  choice: sa buong panahong nasa Carmel sila
  rationale: Likas na katumbas ng Hebreong temporal na idyoma at malinaw na tinutukoy ang Carmel bilang pangalan ng lugar.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “panahon na ng paggugupit ng iyong mga tupa” upang natural na maipahayag ang gawaing ipinahihiwatig ng Hebreo. Pinanatili sa pangunahing teksto ang mas malapit na kahulugang “ipinahiya,” at inilagay sa talababa ang mas kontekstuwal na “minaltrato.”
