source:
  edition: WLC
  text: וְ/אוּלָ֗ם חַי יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר מְנָעַ֔/נִי מֵ/הָרַ֖ע אֹתָ֑/ךְ כִּ֣י לוּלֵ֣י מִהַ֗רְתְּ ו/תבאתי לִ/קְרָאתִ֔/י כִּ֣י אִם נוֹתַ֧ר לְ/נָבָ֛ל עַד א֥וֹר הַ/בֹּ֖קֶר מַשְׁתִּ֥ין בְּ/קִֽיר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/034.yaml
  text: But as Yahweh[a], the God of Israel, lives, who has kept me from harming you, if you had not hurried and come to meet me, surely by the light of morning not one male would have been left to Nabal.
translation:
  language: tl
  text: Ngunit, buháy si Yahweh, ang Diyos ng Israel, na pumigil sa akin na saktan ka! Kung hindi ka nagmadali at pumarito upang salubungin ako, pagsapit ng bukang-liwayway ay wala sanang natirang kahit isang lalaki[a] sa sambahayan ni Nabal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “isang umiihi sa pader,” isang magaspang na idyoma para sa isang lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Ngunit
  rationale: Ipinakikita ang pagsalungat sa maaaring nangyari at ipinapasok ang taimtim na panunumpa ni David.
- source_word: חַי יְהוָה
  choice: buháy si Yahweh
  rationale: Pinananatili ang karaniwang pormula ng panunumpa sa Hebreo at ang diin sa buhay ng Diyos, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng pariralang tumutukoy sa pagkakakilanlan ni Yahweh.
- source_word: אֲשֶׁר מְנָעַנִי
  choice: na pumigil sa akin
  rationale: Malinaw na ipinahahayag ng pandiwa na si Yahweh ang humadlang o pumigil kay David.
- source_word: מֵהָרַע אֹתָךְ
  choice: na saktan ka
  rationale: Natural na Filipino para sa literal na ideyang ‘gumawa ng masama sa iyo’; sa konteksto, ang tinutukoy ay marahas na pananakit.
- source_word: כִּי לוּלֵי מִהַרְתְּ
  choice: Kung hindi ka nagmadali
  rationale: Inihahayag ang kondisyong salungat sa aktuwal na nangyari; pinananatili rin ang pambabaeng isahan na kausap sa konteksto, bagaman hindi ito minamarkahan sa pandiwang Filipino.
- source_word: וַתָּבֹאתִי לִקְרָאתִי
  choice: at pumarito upang salubungin ako
  rationale: Natural na paglalahad ng paglapit ni Abigail upang harapin at salubungin si David.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: pagsapit ng bukang-liwayway
  rationale: Ipinahahayag ang hangganang oras na literal na ‘hanggang sa liwanag ng umaga.’
- source_word: מַשְׁתִּין בְּקִיר
  choice: kahit isang lalaki
  rationale: Ang magaspang na idyomang Hebreo ay tumutukoy sa isang lalaki; inilalagay sa talababa ang literal na larawan upang manatiling malinaw at marangal ang pangunahing teksto.
- source_word: לְנָבָל
  choice: sa sambahayan ni Nabal
  rationale: Ang pang-ukol ay nagpapahiwatig ng mga taong kabilang kay Nabal; nililinaw ng ‘sambahayan’ ang saklaw sa konteksto.
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Pagkilala sa pumigil kay David
  choice: Si Yahweh ang tahasang pumigil kay David na manakit
  alternative: Ang pagkilos lamang ni Abigail ang pumigil kay David
  rationale: Iniuugnay mismo ng sugnay na אֲשֶׁר מְנָעַנִי kay Yahweh ang pagpigil, samantalang kinikilala rin ng kasunod na kondisyon ang mahalagang pagkilos ni Abigail; pinananatili ang dalawang pananaw ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang Hebraikong pormula ng panunumpang “buháy si Yahweh,” habang ginawang natural ang kondisyong salungat sa nangyari. Ang magaspang na literal na idyoma ay inilagay sa talababa.
