base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/014.yaml
  text: But one of the young men told Abigail[a], Nabal’s wife, saying, “Look, David sent messengers from the wilderness to greet our master[b], and he shouted at them.”
translation:
  language: tl
  text: Ngunit sinabi ng isa sa mga kabataang tauhan kay Abigail, na asawa ni Nabal, “Tingnan mo, nagpadala si David ng mga mensahero mula sa ilang upang batiin[a] ang ating amo, ngunit sinagawan niya sila.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang pagpalain.” Karaniwang nangangahulugang “pagpalain” ang pandiwang Hebreo, ngunit dito ay malamang na tumutukoy sa magalang na pagbati o pagpapala.
    reason: lexical_alternative
  - marker: b
    text: O, “binulyawan niya sila” o “sumugod siya sa kanila.” Masigla ang pandiwang Hebreo at maaaring magpahiwatig ng bigla at agresibong pagsugod o pagbulalas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲבִיגַיִל
  choice: Ngunit ... kay Abigail
  rationale: Ang pang-ugnay ay nagpapatuloy sa salaysay ngunit nagpapakita rin ng pagliko mula sa pagtanggi ni Nabal tungo sa lihim na pag-uulat kay Abigail.
- source_word: אֵשֶׁת נָבָל
  choice: na asawa ni Nabal
  rationale: Likas na paraan sa modernong Tagalog upang tukuyin ang kaugnayan ni Abigail kay Nabal.
- source_word: הִגִּיד
  choice: sinabi
  rationale: Karaniwan at natural na katumbas ng Hiphil ng נגד sa konteksto ng pag-uulat.
- source_word: נַעַר אֶחָד מֵהַנְּעָרִים
  choice: isa sa mga kabataang tauhan
  rationale: Pinananatili ng “kabataan” ang pangunahing diwa ng נַעַר, samantalang ipinahihiwatig ng “tauhan” ang kanilang papel sa sambahayan nang hindi sila masyadong makitid na tinatawag na alipin.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Makabagong panawag-pansin na angkop sa direktang pananalita at hindi makaluma.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Mga taong isinugo ni David ang malinaw na tinutukoy rito, hindi mga anghel.
- source_word: מֵהַמִּדְבָּר
  choice: mula sa ilang
  rationale: Ang “ilang” ay maikli at dignified na katumbas ng rehiyong ilang kung saan nananatili sina David.
- source_word: לְבָרֵךְ
  choice: upang batiin
  rationale: Bagaman karaniwang nangangahulugang “pagpalain” ang ברך, tumutukoy ito rito sa magalang na pagbati o paghiling ng mabuti sa isang pakikipagtagpo.
- source_word: אֶת אֲדֹנֵינוּ
  choice: ang ating amo
  rationale: Sa konteksto ng mga tauhan ng sambahayan, ang אֲדוֹן ay tumutukoy sa kanilang amo at hindi isang banal na titulo.
- source_word: וַיָּעַט בָּהֶם
  choice: ngunit sinagawan niya sila
  rationale: Ang bihira at masiglang pandiwa ay maaaring maglarawan ng biglang pagsugod o mabagsik na pagbulalas; sa kontekstong ito, malinaw na ipinahahayag ng “sinagawan” ang marahas na pasalitang pagtanggi nang hindi labis na nilulutas ang larawan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “amo” para sa ugnayang sambahayan at “kabataang tauhan” upang mapanatili kapwa ang edad na ipinahihiwatig ng נַעַר at ang tungkulin sa konteksto. Inilagay ang mga panandang talababa sa mismong mga salitang may leksikal na alternatibo.
