base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/002.yaml
  text: There was a man in Maon whose business was in Carmel[a]. The man was very wealthy, and he had three thousand sheep and a thousand goats[b]. He was shearing his sheep in Carmel.
translation:
  language: tl
  text: May isang lalaki sa Maon na ang kanyang kabuhayan ay nasa Carmel.[a] Napakayaman niya; mayroon siyang tatlong libong tupa at isang libong kambing.[b] Ginugugupitan niya ang kanyang mga tupa sa Carmel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na ang kanyang gawain” o “mga ari-arian ay nasa Carmel.” Malawak ang kahulugan ng salitang Hebreo at maaaring tumukoy sa gawain, mga pinagkakaabalahan, o mga pag-aari ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang lalaki ay napakadakila,” na maaaring tumukoy sa kanyang katayuan sa lipunan o sa kanyang yaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּמָעוֹן
  choice: May isang lalaki sa Maon
  rationale: Natural na panimulang salaysay sa Tagalog na pinananatili ang di-tiyak na pagkakakilanlan ng lalaki at ang pangalang Maon.
- source_word: מַעֲשֵׂהוּ
  choice: ang mga ari-arian ay
  rationale: Sa konteksto ng tirahan sa Maon ngunit gawaing pangkabuhayan at mga kawan sa Carmel, ang salita ay malamang na tumutukoy sa kanyang mga pag-aari o kabuhayang naroon. Nilalagyan ng talababa upang mapanatili ang mas malawak na saklaw na 'gawain/hanapbuhay.'
- source_word: הָאִישׁ גָּדוֹל מְאֹד
  choice: Napakayaman niya
  rationale: Ang literal na 'napakadakila' ay idiomatikong tumutukoy rito sa mataas na kalagayang pangkabuhayan, gaya ng nililinaw ng kasunod na dami ng kanyang mga hayop.
- source_word: וְלוֹ צֹאן שְׁלֹשֶׁת אֲלָפִים וְאֶלֶף עִזִּים
  choice: mayroon siyang tatlong libong tupa at isang libong kambing
  rationale: Likas na Tagalog para sa Hebreong konstruksiyong nagsasaad ng pagmamay-ari; tuwirang pinananatili ang bilang at uri ng mga hayop.
- source_word: וַיְהִי בִּגְזֹז אֶת צֹאנוֹ
  choice: Noon ay ginugupitan niya ang kanyang mga tupa
  rationale: Ipinahahayag ang nagaganap na paggugupit bilang tagpo ng salaysay. Ang 'ginugupitan' ay natural na tumutukoy sa pagpapatabas ng balahibo ng mga tupa nang hindi ipinapalagay na siya lamang mismo ang gumagawa nito.
- source_word: בַכַּרְמֶל
  choice: sa Carmel
  rationale: Pangalan ng lugar ang Carmel dito at hindi ang karaniwang pangngalang maaaring mangahulugang taniman o halamanan.
