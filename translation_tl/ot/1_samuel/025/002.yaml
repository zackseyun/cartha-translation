translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ginugupitan” sa halip na “ginugupit” upang natural na ipahiwatig ang pagpapagupit ng maraming tupa, at pinanatili ang pag-uulit ng Carmel ayon sa Hebreo.
