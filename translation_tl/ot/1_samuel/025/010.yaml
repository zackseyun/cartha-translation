base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/010.yaml
  text: Nabal answered David’s servants and said[a], “Who is David? And who is the son of Jesse? These days many servants are breaking away, each man from before his master.”
translation:
  language: tl
  text: Sumagot si Nabal sa mga lingkod ni David, “Sino ba si David? At sino ang anak ni Jesse? Sa panahong ito, maraming lingkod ang kumakawala mula sa kani-kanilang amo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Sa panahong ito, dumami ang mga lingkod na kumakawala, bawat isa mula sa harap ng kanyang amo.”'
    reason: Pinananatili rito ang pandiwang diwa ng רַבּוּ (“dumami”) at ang spatial na anyo ng מִפְּנֵי (“mula sa harap ng”), na idyomatikong nangangahulugang paglayo mula sa amo.
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Karaniwang pormula ito sa salaysay para sa pagsagot o pagtugon; natural at tuwiran ang “sumagot” sa modernong Tagalog.
- source_word: עַבְדֵי דָוִד
  choice: mga lingkod ni David
  rationale: Maaaring tumukoy ang עבד sa lingkod o alipin. Sa kontekstong ito, mga tauhan o sugo ni David ang tinutukoy, kaya ang “mga lingkod” ang malinaw at hindi labis ang pagpapakahulugan.
- source_word: מִי דָוִד וּמִי בֶן יִשָׁי
  choice: Sino ba si David? At sino ang anak ni Jesse?
  rationale: Pinananatili ang dalawang tanong at ang katawagang “anak ni Jesse.” Ipinahihiwatig ng “ba” ang mapanghamak na himig nang hindi tahasang ipinapasok sa teksto ang paliwanag.
- source_word: הַיּוֹם
  choice: Sa panahon ngayon
  rationale: Bagaman literal na “ngayon/araw na ito,” pangkalahatang paglalarawan ito sa umiiral na kalagayan, kaya natural ang “sa panahon ngayon.”
- source_word: רַבּוּ
  choice: napakaraming
  rationale: Ang pandiwa ay may diwang “dumami” o “naging marami.” Ang “napakaraming” ay likas na Tagalog at pinananatili ang diin sa dami; ibinibigay sa talababa ang mas pormal na alternatibo.
- source_word: הַמִּתְפָּרְצִים
  choice: kumakawala
  rationale: Ipinahihiwatig ng anyong ito ang sapilitang pagkalas o paglayo. Ang “kumakawala” ay nagpapanatili sa lakas ng larawan nang hindi agad tinatawag itong ganap na paghihimagsik.
- source_word: אִישׁ מִפְּנֵי אֲדֹנָיו
  choice: sa kani-kanilang amo
  rationale: Ang אִישׁ ay distributibo, kaya natural na ipinahahayag ng “kani-kanilang.” Ang מִפְּנֵי ay idyomatikong paglayo mula sa isang nakatataas; hindi natural sa pangunahing teksto ang literal na “mula sa harap.”
- source_word: אֲדֹנָיו
  choice: amo
  rationale: Tumutukoy ito sa taong may kapangyarihan sa isang lingkod. Ang “amo” ay malinaw sa kontekstong panlipunan at umiiwas sa posibleng teolohikal na pahiwatig ng “panginoon.”
