translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Ginamit ang “Sino ba” upang maipahiwatig ang mapanghamak na retorika ni Nabal, at “kumakawala” upang mapanatili ang marahas o mapuwersang larawan ng Hebreo.
