id: 1SA.25.30
reference: 1 Samuel 25:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יַעֲשֶׂ֤ה יְהוָה֙ לַֽ/אדֹנִ֔/י כְּ/כֹ֛ל אֲשֶׁר דִּבֶּ֥ר אֶת הַ/טּוֹבָ֖ה עָלֶ֑י/ךָ וְ/צִוְּ/ךָ֥ לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/030.yaml
  text: And when Yahweh has done for my lord according to all the good that he spoke concerning you[a], and has appointed you ruler over Israel[b],
translation:
  language: tl
  text: At mangyayari, kapag ginawa ni Yahweh para sa aking panginoon ang lahat ng mabuting sinabi niya tungkol sa iyo[a], at hinirang ka niyang pinuno sa buong Israel[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “ang mabuting ipinangako niya sa iyo.” Literal sa Hebreo: “ang mabuti” na sinabi ni Yahweh tungkol kay David.'
    reason: lexical_alternative
  - marker: b
    text: O “iniatas sa iyo na maging pinuno sa Israel.” Ang pandiwa ay maaari ring mangahulugang “inutusan,” ngunit dito ay malamang na tumutukoy sa paghirang o pag-aatas sa pamumuno.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At mangyayari, kapag
  rationale: Pinananatili nito ang pormang panghinaharap ng idyomang Hebreo habang nananatiling natural sa modernong Tagalog. Nakaugnay ang sugnay sa kasunod na talata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang personal na pangalan ng Diyos sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: לַאדֹנִי
  choice: para sa aking panginoon
  rationale: Magalang na pakikipag-usap ito ni Abigail kay David; ang “aking panginoon” ay marangal at angkop sa konteksto.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר אֶת הַטּוֹבָה עָלֶיךָ
  choice: ang lahat ng mabuting sinabi niya tungkol sa iyo
  rationale: Malapit ito sa literal na “ang mabuti” na sinabi tungkol kay David, nang hindi ginagawang tahasang “ipinangako” ang mas malawak na pandiwang דִּבֶּר.
- source_word: וְצִוְּךָ
  choice: at hinirang ka niya
  rationale: Bagaman karaniwang nangangahulugang “inutusan” ang צוה, kasama ng לְנָגִיד ay maaari itong tumukoy sa pag-aatas o paghirang sa isang tungkulin.
- source_word: לְנָגִיד
  choice: pinuno
  rationale: Ang נָגִיד ay isang taong inilagay sa kapangyarihan. Ang “pinuno” ay malinaw, makabago, at hindi labis na nagtatakda ng eksaktong titulong pampolitika.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa pariralang “pinuno sa Israel,” likas na ipinahihiwatig sa Tagalog ang pamumuno sa bayan; iniiwasan nito ang di-likas na “sa ibabaw ng Israel.”
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kung pangako ba o simpleng pagsasalita ang tinutukoy
  choice: sinabi niya tungkol sa iyo
  alternative: ipinangako niya sa iyo
  rationale: Ipinahihiwatig ng konteksto ang pangako ng Diyos, ngunit ang pandiwang דִּבֶּר ay literal na “nagsalita/nagsabi.” Pinananatili sa teksto ang mas malawak na kahulugan at inilalagay sa talababa ang kontekstuwal na alternatibo.
- issue: Kahulugan ng וְצִוְּךָ kaugnay ng pagiging נָגִיד
  choice: hinirang ka niyang pinuno
  alternative: inutusan/itinalaga ka niyang maging pinuno
  rationale: Maaaring mangahulugang “mag-utos” ang pandiwa, ngunit sa konstruksiyong ito ay malamang na commissioning o appointment sa pamumuno ang diwa. Itinatala sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang nakabiting estruktura at kuwit sa dulo sapagkat nagpapatuloy ang pangungusap sa 1 Samuel 25:31. Ginamit ang “aking panginoon” bilang magalang na tawag ni Abigail kay David, hindi bilang banal na titulo.
