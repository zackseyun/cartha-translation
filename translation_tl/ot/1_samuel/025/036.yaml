translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “handaan” at “magbukang-liwayway” bilang natural ngunit dignified na pananalita; pinanatili ang Hebreong merismo sa pangunahing teksto at ipinaliwanag sa talababa.
