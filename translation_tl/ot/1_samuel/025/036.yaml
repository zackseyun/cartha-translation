  naturalness: May bahagyang kalabuan at di-gaanong likas na pagtukoy ang “naroon ito,” dahil maaaring hindi agad malinaw kung sino ang tinutukoy. Ang “may handaan siya sa kanyang bahay” ay mas natural at malinaw sa modernong Filipino habang nananatiling malapit sa Hebreo.
  terminology: Ang “handaan,” “lasing na lasing,” at “magbukang-liwayway” ay angkop sa modernong Filipino Tagalog at sa register ng salaysay. Walang usaping teolohikal o pangalan na nangangailangan ng pagbabago.
