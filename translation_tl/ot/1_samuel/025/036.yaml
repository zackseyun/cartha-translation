base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/036.yaml
  text: When Abigail came to Nabal[a], behold, he was holding a feast in his house like the feast of a king, and Nabal’s heart was merry within him, and he was very drunk. So she told him nothing at all, small or great[b], until the light of morning.
translation:
  language: tl
  text: Nang dumating si Abigail kay Nabal, may handaan siya sa kanyang bahay na parang handaan ng isang hari. Masayang-masaya si Nabal, at lasing na lasing siya. Kaya walang anumang sinabi sa kanya si Abigail, maliit man o malaki,[a] hanggang sa magbukang-liwayway.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “maliit man o malaki,” isang idyomang nangangahulugang “wala ni anuman.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hanggang sa liwanag ng umaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Pagdating ni Abigail
  rationale: Ipinahahayag ang pagsulong at temporal na ugnayan ng salaysay sa natural na Tagalog.
- source_word: וְהִנֵּה
  choice: naroon ito
  rationale: Pinananatili ang biglang pagpapakita ng eksena, ngunit gumagamit ng natural na modernong Tagalog kaysa sa mas arkaikong “narito.”
- source_word: מִשְׁתֶּה
  choice: isang handaan
  rationale: Saklaw ng “handaan” ang piging o bangketeng may inuman; malinaw namang binabanggit sa kasunod na sugnay ang pagkalasing.
- source_word: בְּבֵיתוֹ
  choice: sa bahay niya
  rationale: Tuwirang lokatibong salin na karaniwan at malinaw sa modernong Tagalog.
- source_word: כְּמִשְׁתֵּה הַמֶּלֶךְ
  choice: na parang handaan ng isang hari
  rationale: Pinananatili ang pagtutulad at ang di-tiyak na hari, na nagpapahiwatig ng marangyang handaan.
- source_word: וְלֵב נָבָל טוֹב עָלָיו
  choice: Masayang-masaya si Nabal
  rationale: Natural na salin ng Hebreong idyoma tungkol sa pusong nasa mabuting kalagayan; ang pag-uulit ay naghahatid ng diin sa konteksto ng handaan.
- source_word: וְהוּא שִׁכֹּר עַד מְאֹד
  choice: at lasing na lasing siya
  rationale: Malinaw at idyomatikong ipinapahayag ang matinding antas ng pagkalasing.
- source_word: וְלֹא הִגִּידָה לוֹ
  choice: Kaya walang anumang sinabi sa kanya si Abigail
  rationale: Ipinakikita ang kontekstuwal na bunga habang pinananatili ang tahasang pagtanggi sa pagsasabi.
- source_word: דָּבָר קָטֹן וְגָדוֹל
  choice: maliit man o malaki
  rationale: Pinananatili sa teksto ang Hebreong merismo sa halip na lubusang palitan ng paliwanag nito.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: hanggang sa magbukang-liwayway
  rationale: Natural na Tagalog para sa pagdating ng liwanag ng umaga, habang ang mas literal na anyo ay inilalagay sa talababa.
