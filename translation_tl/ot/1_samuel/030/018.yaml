  yaml_path: translation/ot/1_samuel/030/018.yaml
  text: David recovered all that Amalek had taken[a], and David rescued his two wives.
translation:
  language: tl
  text: Nabawi ni David ang lahat ng kinuha ng Amalek[a], at iniligtas ni David ang dalawa niyang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iniligtas” sa dalawang sugnay. Iisang pandiwa ang ginamit sa Hebreo, ngunit mas natural sa Filipino ang “nabawi” para sa mga kinuha at “iniligtas” para sa mga asawa ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל / הִצִּיל (נצל)
  choice: nabawi / iniligtas
  rationale: Iisang ugat na Hebreo ang ginamit sa dalawang sugnay. Ang “nabawi” ay likas sa Filipino para sa mga tao o ari-ariang kinuha ng kaaway, samantalang ang “iniligtas” ay mas angkop kapag ang tinutukoy ay ang dalawang asawa ni David. Ipinapakita sa talababa ang pagkakaisa ng pandiwang Hebreo.
- source_word: כָּל אֲשֶׁר לָקְחוּ עֲמָלֵק
  choice: ang lahat ng kinuha ng Amalek
  rationale: Tuwirang ipinahahayag ng parirala ang kabuuan ng kinuha. Natural sa salaysay na Filipino ang “kinuha,” at sapat na ang konteksto upang ipakitang nauna ang pagkuha sa pagbawi.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Pinananatili ang pangalang nasa anyong isahan sa Hebreo, na dito ay kolektibong tumutukoy sa bayan o pangkat ng mga Amalekita.
- source_word: שְׁתֵּי נָשָׁיו
  choice: ang dalawa niyang asawa
  rationale: Malinaw at natural itong modernong Filipino at pinananatili ang tahasang bilang na dalawa.
- source_word: דָּוִד ... דָּוִד
  choice: David ... David
  rationale: Inuulit ang pangalan ni David gaya ng Hebreo upang mapanatili ang diin at balangkas ng talata.
