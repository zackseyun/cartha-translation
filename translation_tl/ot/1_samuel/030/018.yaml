translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Pinanatili ang pag-uulit sa pangalang David at ang kolektibong pangalang Amalek, habang ginamitan ng magkaibang kontekstuwal na salin ang magkaparehong pandiwang Hebreo.
