base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/015.yaml
  text: David said to him[a], “Will you lead me down to this raiding party?” He said, “Swear to me by God that you will not kill me or hand me over into the hand of my master, and I will lead you down to this raiding party.”
translation:
  language: tl
  text: Sinabi ni David sa kanya, “Maaari mo ba akong ihatid pababa sa pangkat na ito ng mga mananalakay[a]?” Sumagot siya, “Sumumpa ka sa akin sa pangalan ng Diyos na hindi mo ako papatayin o ibibigay sa kamay ng aking amo, at ihahatid kita pababa sa pangkat na ito ng mga mananalakay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pangkat” o “tropa”; ang salitang Hebreo ay tumutukoy sa isang pangkat na gumagala upang manalakay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתוֹרִדֵנִי / וְאוֹרִדְךָ
  choice: ihahatid pababa / ihahatid ... pababa
  rationale: Ang Hiphil ng ירד ay may sanhi at direksiyonal na diwa, ‘magpababa’ o ‘dalhin pababa.’ Ang “ihahatid pababa” ay natural sa Tagalog para sa paggabay patungo sa kinaroroonan ng pangkat at pinananatili ang direksiyong ipinahihiwatig ng Hebreo.
- source_word: הַגְּדוּד
  choice: pangkat ... ng mga mananalakay
  rationale: Tumutukoy ang גדוד sa isang gumagalang pangkat na nagsasagawa ng pagsalakay. Mas malinaw sa karaniwang Tagalog ang “pangkat ng mga mananalakay” kaysa sa mas malabong “pangkat” lamang o sa militar na “tropa.”
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: Sumumpa ka sa akin sa pangalan ng Diyos
  rationale: Ipinahahayag nito ang taimtim na panunumpang humihingi sa Diyos bilang saksi. Ang “sa pangalan ng Diyos” ay likas na ekspresyon sa Tagalog at hindi nito ginagawang panunumpa sa isang di-tiyak na bagay ang parirala.
- source_word: אִם תְּמִיתֵנִי
  choice: na hindi mo ako papatayin
  rationale: 'Sa pormula ng panunumpa, elliptikal ang אִם at may negatibong diwa: hinihingi niyang ipangakong hindi siya papatayin. Kailangang hayagang ilahad ang “hindi” sa natural at malinaw na Tagalog.'
- source_word: תַּסְגִּרֵנִי בְּיַד אֲדֹנִי
  choice: ibibigay sa kamay ng aking amo
  rationale: Ang Hiphil ng סגר ay nangangahulugang ibigay o ipaubaya sa kapangyarihan ng iba. Pinananatili ng “sa kamay” ang Hebreong larawan ng kontrol, samantalang malinaw na ipinahahayag ng “ibibigay” ang kilos.
- source_word: אֲדֹנִי
  choice: aking amo
  rationale: Tumutukoy ito sa taong nagmamay-ari o pinaglilingkuran ng aliping Ehipsiyo, hindi sa Diyos. Ang “amo” ang natural at malinaw na katawagan sa ugnayang ito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “amo” para sa taong pinaglilingkuran, at pinanatili ang idyomang “sa kamay” upang maipahayag ang kapangyarihan o kontrol. Ang tanong ay isinaling “Maaari mo ba...” bilang natural na pakiusap sa Filipino nang hindi binabago ang nilalaman.
