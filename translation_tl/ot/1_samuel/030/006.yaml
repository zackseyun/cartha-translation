  - severity: low
    issue: Ang "naghihinagpis" ay mas makitid kaysa sa "mapait ang kaluluwa/kalooban."
    rationale: Maaaring kasama ang dalamhati, ngunit ang Hebreo ay nagpapahayag din ng kapaitan o matinding hinanakit; mas ligtas na panatilihin ang larawang ito.
  - severity: low
