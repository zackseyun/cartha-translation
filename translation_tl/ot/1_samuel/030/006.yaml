revisions:
- from: At labis na nabagabag si David, sapagkat pinag-usapan ng mga tao na batuhin siya. Labis kasing naghihinagpis ang buong bayan, bawat lalaki dahil sa kanyang mga anak na lalaki at babae. Ngunit nagpakalakas si David kay Yahweh na kanyang Diyos.
  to: At labis na nabagabag si David, sapagkat pinag-uusapan ng mga tao ang pagbato sa kanya. Sapagkat mapait ang kalooban ng lahat ng tao, bawat lalaki dahil sa kanyang mga anak na lalaki at babae. Ngunit nagpalakas ng loob si David sa pamamagitan ni Yahweh, na kanyang Diyos.
  rationale: 'Inalis ang dagdag na pagpapatingkad sa kapaitan ng mga tao, ibinalik ang saklaw ng idyomang מָרָה נֶפֶשׁ sa "mapait ang kalooban," at pinasining ang mga pariralang Tagalog para sa balak na pagbato at sa pagpapalakas ni David. Walang kinakailangang talababa: ang piniling pananalita ay sapat na malinaw at hindi nagtatakda ng pinagtatalunang pakahulugan.'
