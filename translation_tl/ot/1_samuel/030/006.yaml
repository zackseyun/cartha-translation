  text: וַ/תֵּ֨צֶר לְ/דָוִ֜ד מְאֹ֗ד כִּֽי אָמְר֤וּ הָ/עָם֙ לְ/סָקְל֔/וֹ כִּֽי מָ֨רָה֙ נֶ֣פֶשׁ כָּל הָ/עָ֔ם אִ֖ישׁ עַל בנ/ו וְ/עַל בְּנֹתָ֑י/ו וַ/יִּתְחַזֵּ֣ק דָּוִ֔ד בַּ/יהוָ֖ה אֱלֹהָֽי/ו־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/006.yaml
  text: And David was greatly distressed[a], because the people spoke of stoning him, for the soul of all the people was bitter, each man because of his sons and his daughters. But David strengthened himself in Yahweh his God.
translation:
  language: tl
  text: At labis na nabagabag si David, sapagkat pinag-uusapan ng mga tao ang pagbato sa kanya. Sapagkat mapait ang kalooban ng lahat ng tao, bawat lalaki dahil sa kanyang mga anak na lalaki at babae. Ngunit nagpalakas ng loob si David sa pamamagitan ni Yahweh, na kanyang Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּצֶר לְדָוִד מְאֹד
  choice: labis na nabagabag si David
  rationale: Ipinahahayag ng impersonal na konstruksyon ang matinding kagipitan at emosyonal na pagkabalisa ni David; natural at marangal sa modernong Tagalog ang “labis na nabagabag.”
- source_word: הָעָם
  choice: mga tao / buong bayan
  rationale: Pinananatili ang kolektibong katawagan ng Hebreo nang hindi nililimitahan sa “mga kawal,” bagaman sila ang tinutukoy sa konteksto.
- source_word: אָמְרוּ ... לְסָקְלוֹ
  choice: pinag-usapan ... na batuhin siya
  rationale: Ang infinitive ay tumutukoy sa balak na kanilang pinag-uusapan; hindi nito kinakailangang sabihing sinimulan na nila ang pagbato.
- source_word: מָרָה נֶפֶשׁ
  choice: labis ... naghihinagpis
  rationale: Ang literal na idyomang “mapait ang kaluluwa” ay nagsasaad ng matinding dalamhati at sama ng loob. Ang “naghihinagpis” ay malinaw at likas sa Tagalog, habang ang “labis” ay naghahatid ng tindi.
- source_word: אִישׁ עַל בנו וְעַל בְּנֹתָיו
  choice: bawat lalaki dahil sa kanyang mga anak na lalaki at babae
  rationale: Distributibo ang אִישׁ at tumutukoy sa bawat lalaking kabilang sa pangkat; ang עַל ay nagpapahiwatig ng sanhi ng kanilang paghihinagpis.
- source_word: וַיִּתְחַזֵּק
  choice: nagpakalakas
  rationale: 'Pinananatili ang reflexive o middle na diwa ng hitpael: aktibong nagtatag ng loob o kumuha ng lakas si David.'
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Ang pang-ukol ay nagpapakitang si Yahweh ang pinagbalingan at pinagmulan ng lakas ni David; ang “kay” ay natural sa Tagalog kasama ng personal na pangalan.
- source_word: אֱלֹהָיו
  choice: kanyang Diyos
  rationale: Tuwirang pinananatili ang personal na ugnayang ipinahahayag ng hulaping paari.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
- issue: Paraan ng pagpapalakas ni David sa Diyos
  choice: nagpakalakas si David kay Yahweh na kanyang Diyos
  alternative: pinalakas ni Yahweh si David / nagtiwala si David kay Yahweh
  rationale: 'Pinananatili ang reflexive o middle na anyo at ang tunay na tensyon ng teksto: aktibo si David, ngunit kay Yahweh nakaugnay ang kanyang lakas. Hindi tahasang sinasabi ng talata ang eksaktong paraan nito.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Iniwasan ang sobrang literal na “mapait ang kaluluwa,” na maaaring maging malabo sa karaniwang mambabasa, ngunit pinanatili ang tindi ng sama ng loob at dalamhati sa “labis na naghihinagpis.”
