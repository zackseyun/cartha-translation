translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “lunsod” para sa dignified biblical register at “mga tauhan” para sa mga lalaking kasama ni David sa kontekstong militar.
