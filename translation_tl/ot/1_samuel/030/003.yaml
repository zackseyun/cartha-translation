  text: When David and his men came to the city, behold, it had been burned with fire, and their wives, sons, and daughters had been taken captive.
translation:
  language: tl
  text: Nang dumating si David at ang kanyang mga tauhan sa lunsod, nakita nilang nasunog na sa apoy ang lunsod, at binihag ang kanilang mga asawa, mga anak na lalaki, at mga anak na babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: nakita nilang
  rationale: Ipinahahayag ang biglaang pagkakita sa kalagayan ng lunsod sa natural na modernong Tagalog, sa halip na literal ngunit di-likas na “narito.”
- source_word: שְׂרוּפָה בָּאֵשׁ
  choice: sinunog na iyon
  rationale: Ang passive participle at בָּאֵשׁ ay nagsasaad na natupok na sa pagsunog ang lunsod; sapat at natural sa Tagalog ang “sinunog na,” sapagkat likas nang ipinahihiwatig ang apoy.
- source_word: נִשְׁבּוּ
  choice: binihag
  rationale: Tumpak na inilalarawan ang pagkuha sa kanila bilang mga bihag, hindi lamang pangkalahatang pagdakip.
- source_word: וּנְשֵׁיהֶם וּבְנֵיהֶם וּבְנֹתֵיהֶם
  choice: ang kanilang mga asawa, mga anak na lalaki, at mga anak na babae
  rationale: Pinananatili ang tatlong tahasang pangkat at ang pag-uulit ng diwa ng maramihan sa malinaw na Tagalog.
