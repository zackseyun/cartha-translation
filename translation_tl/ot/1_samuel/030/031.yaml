  yaml_path: translation/ot/1_samuel/030/031.yaml
  text: and to those in Hebron[a], and to all the places where David and his men had gone about.
translation:
  language: tl
  text: at sa mga nasa Hebron, at sa lahat ng lugar na nilibot ni David at ng kanyang mga tauhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinuntahan” o “palipat-lipat na dinaanan.” Ipinahihiwatig ng pandiwang Hebreo ang paulit-ulit na pagkilos sa iba't ibang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/אֲשֶׁר
  choice: at sa mga nasa
  rationale: Sa konteksto ng talaan ng mga pinadalhan, ang pariralang Hebreo ay likas na tumutukoy sa mga taong nasa binanggit na lugar.
- source_word: בְּ/חֶבְר֑וֹן
  choice: Hebron
  rationale: Karaniwang transliterasyon ng pangalang-lugar; ang lokatibong diwa ng בְּ ay naipapahayag na ng “nasa.”
- source_word: וּֽ/לְ/כָל הַ/מְּקֹמ֛וֹת
  choice: at sa lahat ng lugar
  rationale: Pinananatili ang pagpapatuloy ng talaan ng mga pinagpadalhan at ang pangkalahatang saklaw ng כָל.
- source_word: אֲשֶׁר ... שָׁם
  choice: na
  rationale: Sa Filipino, sapat ang pang-ugnay na “na” upang iugnay ang mga lugar sa kilos na naganap doon; hindi kailangang ulitin ang “doon.”
- source_word: הִתְהַלֶּךְ
  choice: nilibot
  rationale: Ipinahihiwatig ng hitpael ang paulit-ulit o palipat-lipat na pagkilos sa iba't ibang lugar; likas at maikli itong naipapahayag ng “nilibot.”
- source_word: דָּוִד הוּא
  choice: ni David
  rationale: Ang hiwalay na panghalip ay appositional sa pangalang David sa sugnay na ito; hindi ito kailangang gawing “si David mismo,” na maaaring magdagdag ng labis na diin.
- source_word: וַ/אֲנָשָׁיו
  choice: at ng kanyang mga tauhan
  rationale: Sa konteksto, tumutukoy ito sa pangkat ng mga lalaking kasama ni David; mas tiyak at natural ang “mga tauhan” kaysa “mga tao.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nilibot” upang natural na maipahayag ang palipat-lipat na pagkilos, habang pinananatili sa talababa ang saklaw ng posibleng kahulugan.
