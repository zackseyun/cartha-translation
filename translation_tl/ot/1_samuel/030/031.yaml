  source_fidelity: 'Tumpak na naipapasa ng salin ang pagpapatuloy ng talaan ng mga tatanggap: mga nasa Hebron at lahat ng mga lugar na pinuntahan/nilibot ni David at ng kanyang mga tauhan. Ang “nilibot” ay angkop sa paulit-ulit o palipat-lipat na diwa ng hitpael na הִתְהַלֶּךְ. Hindi kinakailangang tahasang isalin ang שָׁם dahil likas na nasasaklaw ito ng pang-ugnay na “na.”'
  naturalness: 'Likas at malinaw ang modernong Filipino: “at sa mga nasa Hebron, at sa lahat ng lugar na nilibot ni David at ng kanyang mga tauhan.” Ang register ay marangal ngunit hindi lipas.'
