  text: to those in Bethel[a], to those in Ramoth-negeb, and to those in Jattir—
translation:
  language: tl
  text: sa mga nasa Betel, sa mga nasa Ramot-negeb[a], at sa mga nasa Jatir—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ramot ng Negeb,” ibig sabihin, “Ramot sa Timog.”
    reason: Pinananatili ang posibleng pagbasa sa נֶגֶב bilang heograpikong panuring sa halip na tiyak na bahagi ng tambalang pangalan.
lexical_decisions:
- source_word: לַאֲשֶׁר
  choice: sa mga nasa
  rationale: Ang לְ kasama ng אֲשֶׁר ay tumutukoy sa mga tatanggap na nasa bawat binanggit na lugar. Likas sa modernong Tagalog ang “sa mga nasa” at pinananatili nito ang diwang patungkol sa mga tatanggap.
- source_word: בְּבֵית אֵל
  choice: nasa Betel
  rationale: Pangalan ito ng lugar sa kontekstong ito, hindi karaniwang pariralang “bahay ng Diyos.” Ginamit ang “nasa” para sa lokasyon at ang nakasanayang anyong Tagalog na “Betel.”
- source_word: בְּרָמוֹת נֶגֶב
  choice: nasa Ramot-negeb
  rationale: Pinanatili bilang tambalang pangalan ng lugar upang hindi tiyaking higit sa ipinahihiwatig ng Hebreo kung ang נֶגֶב ay bahagi ng pangalan o panuring na tumutukoy sa timog. Inilagay sa talababa ang mas interpretatibong pagbasa.
- source_word: בְּיַתִּר
  choice: nasa Jatir
  rationale: Pangalan ng lugar na isinalin sa baybay na angkop sa modernong Tagalog; ipinahahayag ng “nasa” ang lokasyon.
- source_word: וְ
  choice: at
  rationale: Payak na pang-ugnay sa huling bahagi ng talaan.
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at likas sa modernong Filipino. Pinanatili ang em dash dahil nagpapatuloy ang talaan sa kasunod na talata. Inilagay ang marker [a] pagkatapos ng “Ramot-negeb,” ang mismong pariralang tinutukoy ng talababa.
