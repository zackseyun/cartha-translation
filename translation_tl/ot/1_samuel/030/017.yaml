    issue: Ang “Nilipol sila” ay sobrang tindi para sa וַיַּכֵּם.
    rationale: Ang pandiwa ay tumutukoy sa pagsalakay o marahas na pagpabagsak; hindi nito sa sarili nito sinasabing ganap na nilipol ang lahat. Ang “nilipol” ay maaari ring lumitaw na salungat sa malinaw na pagbubukod sa apatnaraang tumakas.
  - severity: low
    issue: Ang “gabi” ay hindi ang pinakatiyak na katumbas ng הָעֶרֶב.
    rationale: Ang הָעֶרֶב ay “evening,” na mas malapit na naihahatid ng “dapithapon.”
