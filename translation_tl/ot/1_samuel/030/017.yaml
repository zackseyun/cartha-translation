base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/017.yaml
  text: David struck them down from the twilight until the evening of the next day[a], and not a man of them escaped, except four hundred young men who rode on the camels and fled.
translation:
  language: tl
  text: Sinalakay sila ni David mula sa takipsilim hanggang sa dapithapon ng sumunod na araw.[a] Walang isa man sa kanila ang nakaligtas, maliban sa apatnaraang kabataang lalaki na sumakay sa mga kamelyo at tumakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa bukang-liwayway.” Ang salitang Hebreo ay maaaring tumukoy sa takipsilim sa dapithapon o sa bukang-liwayway. Dito, itinuturing ng ilan na bukang-liwayway ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: Nilipol sila
  rationale: Sa konteksto ng labanan, ang נכה ay tumutukoy sa marahas na pag-atake at paggapi. Likas sa Filipino ang “nilipol” para sa malawakang paggapi, at hindi ito lipas sa gamit.
- source_word: מֵהַנֶּשֶׁף
  choice: mula sa takipsilim
  rationale: Maaaring tumukoy ang נֶשֶׁף sa dapithapon o sa bukang-liwayway. Pinananatili ng “takipsilim” ang batayang diwa ng malabong liwanag, samantalang ipinaliliwanag sa talababa ang alternatibong pagbasa.
- source_word: וְעַד הָעֶרֶב לְמָחֳרָתָם
  choice: hanggang sa gabi ng sumunod na araw
  rationale: Malinaw at natural itong nagpapahayag na nagpatuloy ang labanan hanggang sa gabi kinabukasan.
- source_word: וְלֹא נִמְלַט מֵהֶם אִישׁ
  choice: Walang isa man sa kanila ang nakaligtas
  rationale: Inihahatid nito ang mariing distributibong diwa ng אִישׁ nang natural sa modernong Filipino.
- source_word: כִּי אִם
  choice: maliban sa
  rationale: Ito ang malinaw at karaniwang panumbas sa idyomang nagpapakilala ng eksepsiyon.
- source_word: אַרְבַּע מֵאוֹת אִישׁ נַעַר
  choice: apatnaraang kabataang lalaki
  rationale: Ang נַעַר ay maaaring kabataan, binata, o utusan; ang “kabataang lalaki” ay angkop sa mga mandirigmang nakasakay at nakatakas, nang hindi nagpapahiwatig na sila ay mga bata o utusan.
- source_word: רָכְבוּ עַל הַגְּמַלִּים
  choice: sumakay sa mga kamelyo
  rationale: Natural na Filipino ito at tapat sa kilos ng pagsakay sa mga kamelyo.
- source_word: וַיָּנֻסוּ
  choice: at tumakas
  rationale: Ang נוּס ay nangangahulugang tumakas o tumalilis. Pinananatili ng “tumakas” ang pagkakaiba nito sa naunang נִמְלַט, “nakaligtas.”
