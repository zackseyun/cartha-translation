  to: Sinalakay sila ni David mula sa takipsilim hanggang sa dapithapon ng sumunod na araw.[a] Walang isa man sa kanila ang nakaligtas, maliban sa apatnaraang kabataang lalaki na sumakay sa mga kamelyo at tumakas.
