translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “takipsilim” sa pangunahing teksto upang hindi tahasang alisin ang leksikal na kalabuan, at inilagay ang alternatibong “bukang-liwayway” sa talababa.
