base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/013.yaml
  text: David said to him, “Whose are you, and where are you from?” He said, “I am an Egyptian young man, a servant of an Amalekite man, and my master abandoned me because I became sick three days ago.”
translation:
  language: tl
  text: Sinabi ni David sa kanya, “Kanino ka kabilang, at taga-saan ka?” Sumagot siya, “Isa akong kabataang Egipcio, alipin ng isang Amalekita. Iniwan ako ng aking panginoon dahil nagkasakit ako tatlong araw na ang nakararaan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִי אַתָּה
  choice: Kanino ka
  rationale: Pinananatili ang tuwirang tanong tungkol sa kung kanino siya kabilang o naglilingkod, nang hindi nililinaw nang higit sa Hebreo.
- source_word: וְאֵי מִזֶּה אָתָּה
  choice: at taga-saan ka?
  rationale: Natural na modernong Tagalog para sa tanong tungkol sa pinagmulan.
- source_word: נַעַר מִצְרִי
  choice: kabataang Egipcio
  rationale: Inilalarawan siya bilang isang batang lalaking taga-Ehipto, alinsunod sa נַעַר at sa pagkakasunod ng Hebreo.
- source_word: עֶבֶד
  choice: alipin
  rationale: Tumpak sa katayuang ipinahihiwatig ng עֶבֶד sa konteksto, lalo na dahil iniwan siya ng kanyang amo nang magkasakit.
- source_word: וַיַּעַזְבֵנִי אֲדֹנִי
  choice: Iniwan ako ng aking panginoon
  rationale: Pinananatili ang matinding diwa ng pandiwang ‘iniwan’ at ang ugnayang panginoon-alipin.
- source_word: כִּי חָלִיתִי הַיּוֹם שְׁלֹשָׁה
  choice: dahil nagkasakit ako tatlong araw na ang nakararaan
  rationale: Natural na Tagalog para sa idyomang Hebreo na literal na tumutukoy sa ‘ngayon, tatlong araw’; ipinahihiwatig nito na nagsimula ang sakit tatlong araw bago ang pag-uusap.
