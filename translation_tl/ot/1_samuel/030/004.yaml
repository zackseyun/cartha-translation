  text: Then David and the people who were with him raised their voices and wept until they had no strength left to weep[a].
translation:
  language: tl
  text: Pagkatapos, umiyak nang malakas si David at ang mga taong kasama niya hanggang sa wala na silang lakas na umiyak pa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “itinaas nina David at ng mga taong kasama niya ang kanilang tinig at umiyak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־קוֹלָם
  choice: umiyak nang malakas
  rationale: Ang literal na “itinaas ang kanilang tinig” ay isang idyomang Hebreo na sa kontekstong ito ay tumutukoy sa malakas na pag-iyak. Ang salin ay likas sa modernong Tagalog, habang nasa talababa ang mas literal na anyo.
- source_word: וַיִּבְכּוּ
  choice: umiyak
  rationale: Malinaw na ipinahahayag ng בכה ang pag-iyak; ang “umiyak” ay natural, marangal, at angkop sa salaysay.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: ang mga taong kasama niya
  rationale: Pinananatili nito ang malawak na kahulugan ng עָם at hindi ipinapalit ang mas tiyak na “mga kawal” o “mga lalaki,” bagaman mga mandirigma ang tinutukoy sa konteksto.
- source_word: עַד אֲשֶׁר אֵין בָּהֶם כֹּחַ
  choice: hanggang sa wala na silang lakas
  rationale: Natural nitong ipinahahayag sa Tagalog ang ganap na pagkaubos ng kanilang lakas, katumbas ng literal na “wala nang lakas sa kanila.”
- source_word: לִבְכּוֹת
  choice: na umiyak pa
  rationale: Pinananatili ang pag-uulit ng ugat na בכה at nililinaw ng “pa” na naubos na ang kakayahan nilang ipagpatuloy ang pag-iyak.
