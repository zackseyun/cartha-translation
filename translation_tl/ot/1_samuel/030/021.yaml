  text: וַ/יָּבֹ֣א דָוִ֗ד אֶל מָאתַ֨יִם הָ/אֲנָשִׁ֜ים אֲשֶֽׁר פִּגְּר֣וּ מִ/לֶּ֣כֶת אַחֲרֵ֣י דָוִ֗ד וַ/יֹּֽשִׁיבֻ/ם֙ בְּ/נַ֣חַל הַ/בְּשׂ֔וֹר וַ/יֵּֽצְאוּ֙ לִ/קְרַ֣את דָּוִ֔ד וְ/לִ/קְרַ֖את הָ/עָ֣ם אֲשֶׁר אִתּ֑/וֹ וַ/יִּגַּ֤שׁ דָּוִד֙ אֶת הָ/עָ֔ם וַ/יִּשְׁאַ֥ל לָ/הֶ֖ם לְ/שָׁלֽוֹם־־׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/021.yaml
  text: David came to the two hundred men who had become too exhausted to follow after David[a], and whom they had left at the Brook Besor. They came out to meet David and to meet the people who were with him[b], and David approached the people and asked them how they were.
translation:
  language: tl
  text: Dumating si David sa dalawang daang lalaking nanghina at hindi na nakasunod sa kanya,[a] na pinaiwan niya sa Batis ng Besor.[b] Lumabas ang mga ito upang salubungin si David at ang mga taong kasama niya. Lumapit si David sa kanila at kinumusta sila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nahuli at hindi na nakasunod sa kanya.” Ang pandiwang Hebreo ay maaaring magpahiwatig ng panghihina o hindi na kakayahang magpatuloy.
    reason: lexical_alternative
  - marker: b
    text: Ang “Batis ng Besor” ay maaari ring tawaging “Wadi ng Besor”; ang tinutukoy ay isang batis o agusang maaaring matuyo.
    reason: geographical_clarification
  - marker: c
    text: Sa literal, “tinanong sila tungkol sa kapayapaan [o mabuting kalagayan] nila.” Isa itong idyomang Hebreo para sa pangungumusta.
    reason: idiom_clarification
lexical_decisions:
- source_word: פִּגְּרוּ מִלֶּכֶת אַחֲרֵי דָוִד
  choice: nanghina at hindi na nakasunod sa kanya
  rationale: Ipinahahayag ng פּגר ang panghihina o kawalan ng kakayahang magpatuloy; ang pariralang may מִלֶּכֶת אַחֲרֵי ay tumutukoy sa hindi na pagpapatuloy na sumunod kay David. Natural sa modernong Tagalog ang piniling salin at hindi nito ginagawang simpleng kusang pag-iwan ang nangyari.
- source_word: וַיֹּשִׁיבֻם
  choice: na iniwan nila
  rationale: Ang Hiphil ng ישׁב ay maaaring mangahulugang pinanatili, pinaupo, o iniwan sa isang lugar. Pinananatili ng “iniwan nila” ang maramihang di-tiyak na simuno ng pandiwang Hebreo at ang malinaw na diwa sa salaysay.
- source_word: בְּנַחַל הַבְּשׂוֹר
  choice: sa Batis ng Besor
  rationale: Ang נחל ay maaaring tumukoy sa batis, wadi, o tuyong ilog-lambak. Ang “Batis ng Besor” ay malinaw at dignidadong katawagan sa lugar, habang itinatala sa talababa ang heograpikong alternatibo.
- source_word: לִקְרַאת
  choice: upang salubungin
  rationale: Sa kontekstong lumabas sila patungo sa dumarating na pangkat, mas natural sa Tagalog ang “salubungin” kaysa sa pangkalahatang “katagpuin.”
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: ang mga taong kasama niya
  rationale: Pinananatili nito ang malawak na kahulugan ng עָם at hindi ito di-kailangang nililimitahan sa “mga kawal,” bagaman pangkat ng mandirigma ang konteksto.
- source_word: וַיִּגַּשׁ דָּוִד אֶת הָעָם
  choice: Lumapit si David sa kanila
  rationale: Ang נגשׁ ay “lumapit.” Ginamit ang “sa kanila” upang maiwasan ang mabigat na pag-uulit ng “mga tao” nang hindi nawawala ang reperente.
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: kinumusta sila
  rationale: Ang idyomang Hebreo ay literal na pagtatanong tungkol sa kapayapaan o kalagayan ng isang tao. Ang “kinumusta sila” ang natural at tumpak na katumbas sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “kinumusta” para sa buhay na katumbas ng idyomang Hebreo, at “mga taong kasama niya” upang huwag paliitin ang saklaw ng עָם. Ang mga talababa ay nagpapanatili sa leksikal at heograpikong ambiguwidad ng teksto.
