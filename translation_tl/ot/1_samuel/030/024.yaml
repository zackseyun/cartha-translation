  to: At sino ang makikinig sa inyo tungkol sa bagay na ito? Sapagkat kung ano ang bahagi ng lumulusong sa labanan, gayon din ang bahagi ng nananatili sa tabi ng mga kagamitan[a]; magiging magkapareho ang kanilang bahagi.
