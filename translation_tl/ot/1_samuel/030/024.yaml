base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/024.yaml
  text: And who will listen to you in this matter? For as is the share of the one who goes down into the battle[a], so is the share of the one who stays by the supplies[b]; together they shall divide.
translation:
  language: tl
  text: At sino ang makikinig sa inyo tungkol sa bagay na ito? Sapagkat kung ano ang bahagi ng lumulusong sa labanan, gayon din ang bahagi ng nananatili sa tabi ng mga kagamitan[a]; magiging magkapareho ang kanilang bahagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga dala-dalahan” o “mga panustos.” Malawak ang saklaw ng salitang Hebreo at maaari itong tumukoy sa mga gamit, kasangkapan, o suplay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: At sino
  rationale: Pinananatili ang pang-ugnay at ang retorikal na tanong na nagsisilbing tugon ni David.
- source_word: יִשְׁמַע לָכֶם
  choice: makikinig sa inyo
  rationale: Ang שׁמע na may ל ay maaaring mangahulugang makinig, tumalima, o sumunod; ang “makikinig sa inyo” ay likas sa Filipino at sapat ang lawak para sa diwang tatanggap o papansin sa kanilang mungkahi.
- source_word: לַדָּבָר הַזֶּה
  choice: tungkol sa bagay na ito
  rationale: Ang דָּבָר dito ay tumutukoy sa usapin o mungkahing pinagtatalunan, hindi lamang sa isang binigkas na salita.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit hindi dapat tanggapin ang mungkahi.
- source_word: כְּחֵלֶק
  choice: kung ano ang bahagi ... gayon din ang bahagi
  rationale: Ang חֵלֶק ay bahagi o takdang parte sa samsam; malinaw na inihahayag ng hulma sa Filipino ang paghahambing ng dalawang bahagi.
- source_word: הַיֹּרֵד בַּמִּלְחָמָה
  choice: ang lumulusong sa labanan
  rationale: Pinananatili ang Hebreong larawang “lumlusong” sa halip na gawing payak na “mandirigma,” at ipinahihiwatig ang aktuwal na pagsabak sa labanan.
- source_word: וּכְחֵלֶק הַיֹּשֵׁב עַל הַכֵּלִים
  choice: gayon din ang bahagi ng nananatili sa tabi ng mga kagamitan
  rationale: Ang יֹשֵׁב ay literal na umuupo ngunit sa konteksto ay nananatili; malawak ang כֵּלִים at maaaring tumukoy sa kagamitan, dala-dalahan, o panustos.
- source_word: יַחְדָּו
  choice: sabay
  rationale: Ipinapahayag ang magkatuwang na pakikibahagi nang hindi dinaragdagan ang teksto ng tahasang salitang “pantay,” bagaman iyon ang implikasyon ng magkatulad na bahagi.
- source_word: יַחֲלֹקוּ
  choice: silang maghahati
  rationale: Pinananatili ang konkretong diwa ng paghahati o pamamahagi ng samsam.
