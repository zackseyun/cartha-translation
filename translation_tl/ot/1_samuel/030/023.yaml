id: 1SA.30.23
reference: 1 Samuel 30:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד לֹֽא תַעֲשׂ֥וּ כֵ֖ן אֶחָ֑/י אֵ֠ת אֲשֶׁר נָתַ֨ן יְהוָ֥ה לָ֨/נוּ֙ וַ/יִּשְׁמֹ֣ר אֹתָ֔/נוּ וַ/יִּתֵּ֗ן אֶֽת הַ/גְּד֛וּד הַ/בָּ֥א עָלֵ֖י/נוּ בְּ/יָדֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/023.yaml
  text: But David said[a], “You must not do so, my brothers, with what Yahweh has given us[c][b]. He has preserved us and has given into our hand the raiding band that came against us.”
translation:
  language: tl
  text: Ngunit sinabi ni David, “Huwag ninyong gawin iyan, mga kapatid ko, sa ibinigay sa atin ni Yahweh.[a] Iningatan niya tayo[b] at ibinigay niya sa ating kamay[c] ang pangkat ng mga mananalakay na sumalakay sa atin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “tungkol sa ibinigay sa atin ni Yahweh.” Siksik at bahagyang malabo ang pagkakabuo ng Hebreo habang ipinakikilala ni David ang usapin ng pamamahagi ng samsam.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “Pinrotektahan niya tayo” o “Binantayan niya tayo.”'
    reason: lexical_alternative
  - marker: c
    text: Ang “sa ating kamay” ay isang Hebreong idyoma na nangangahulugang ibinigay sa ating kapangyarihan o kontrol.
    reason: idiom_explanation
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ כֵן
  choice: Huwag ninyong gawin iyan
  rationale: Tuwirang pagbabawal ito sa maramihang kausap. Natural at malinaw sa modernong Tagalog ang “Huwag ninyong gawin iyan,” habang pinananatili ang mariing pagsaway ni David.
- source_word: אֶחָי
  choice: mga kapatid ko
  rationale: Literal itong “mga kapatid ko” at isang magiliw ngunit mapagsaway na tawag ni David sa kaniyang mga tauhan. Hindi ito ginawang neutral upang mapanatili ang panlalaking pangkat na tinutukoy sa konteksto.
- source_word: אֵת אֲשֶׁר נָתַן יְהוָה לָנוּ
  choice: sa ibinigay sa atin ni Yahweh
  rationale: Masinsin at bahagyang siksik ang Hebreong pagkakabuo. Ang “sa ibinigay sa atin” ay natural na tumutukoy sa paraan ng pakikitungo nila sa samsam bilang kaloob ni Yahweh, nang hindi lubusang nilulutas ang sintaktikong kalabuan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulong pamalit.
- source_word: וַיִּשְׁמֹר אֹתָנוּ
  choice: Iningatan niya tayo
  rationale: Sa konteksto ng labanan, ang שׁמר ay nangangahulugang bantayan, ingatan, o protektahan. Malinaw at karaniwan sa Tagalog ang “iningatan” at hindi nito labis na tinutukoy kung paano sila pinrotektahan.
- source_word: הַגְּדוּד
  choice: ang pangkat ng mga mananalakay
  rationale: Tumutukoy ang גְּדוּד dito sa organisadong pangkat na nagsagawa ng pagsalakay. Mas tiyak ito kaysa “hukbo” at mas natural kaysa literal na “pangkat ng pagsalakay.”
- source_word: הַבָּא עָלֵינוּ
  choice: na sumalakay sa atin
  rationale: Literal na larawan nito ang pagparito laban sa kanila. Sa kontekstong militar, malinaw na naipapahayag ng “sumalakay sa atin” ang pagkapoot ng paglapit, bagaman bahagyang mas tahas kaysa sa literal na “dumating laban sa atin.”
- source_word: בְּיָדֵנוּ
  choice: sa ating kamay
  rationale: Pinanatili ang Hebreong idyoma ng “kamay,” na tumutukoy sa kapangyarihan o kontrol. Nauunawaan din sa Tagalog ang larawan ng pagbibigay ng kaaway sa kamay ng isang tao.
theological_decisions:
- issue: Paglalarawan sa tagumpay bilang kaloob at pag-iingat ng Diyos
  choice: Pinanatiling si Yahweh ang nagbigay, nag-ingat, at naglagay sa kapangyarihan nila ng mga mananalakay.
  alternative: Isalin lamang bilang tagumpay na nakamit ng mga tauhan ni David.
  rationale: Tatlong kilos sa Hebreo ang tuwirang iniuugnay kay Yahweh. Mahalaga sa pangangatwiran ni David na ang samsam at tagumpay ay hindi lamang bunga ng pagsisikap ng mga mandirigma.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalang יְהוָה ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa mga titulong gaya ng “Panginoon.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga kapatid ko” bilang tuwirang katumbas ng magiliw na tawag ni David sa kaniyang mga tauhan. Pinanatili ang idyomang “sa ating kamay,” ngunit ipinaliwanag ito sa talababa. Ang “pangkat ng mga mananalakay” ay madaling maunawaan at angkop sa kontekstong militar.
