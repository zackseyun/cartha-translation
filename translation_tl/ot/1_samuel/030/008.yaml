base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/008.yaml
  text: And David inquired of the LORD, saying, “Should I pursue this raiding party? Will I overtake them?” And he said to him, “Pursue, for you will surely overtake them, and you will surely rescue.”
translation:
  language: tl
  text: At nagtanong si David sa PANGINOON, “Hahabulin ko ba ang pangkat na ito ng mga mandarambong? Maaabutan ko ba sila?” Sinabi niya sa kanya, “Habulin mo sila, sapagkat tiyak na maaabutan mo sila at tiyak na magliligtas ka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: nagtanong ... sa PANGINOON
  rationale: Likas at marangal na Filipino para sa paghingi ni David ng patnubay sa Diyos; ang PANGINOON ang tradisyonal na salin ng banal na pangalan.
- source_word: הַגְּדוּד
  choice: pangkat ... ng mga mandarambong
  rationale: Sa konteksto, tumutukoy ito sa pangkat na sumalakay at kumuha ng mga bihag, hindi lamang sa isang pangkalahatang hukbo.
- source_word: הַאַשִּׂגֶנּוּ / הַשֵּׂג תַּשִּׂיג
  choice: Maaabutan ko ba sila? / tiyak na maaabutan mo sila
  rationale: Pinananatili ang pag-uulit ng pandiwa sa tanong at sagot; ang infinitive absolute kasama ng finite verb ay ipinahayag sa natural na Filipino sa pamamagitan ng “tiyak.”
- source_word: וְהַצֵּל תַּצִּיל
  choice: at tiyak na maililigtas mo ang mga bihag
  rationale: Ang Hebreo ay mariing nangangakong makapagliligtas si David ngunit walang tahasang layon; nilinaw ng konteksto na ang ililigtas ay ang mga dinalang bihag.
theological_decisions:
- issue: Pagkakakilanlan ng nagsasalita sa sagot
  choice: “Sinabi niya sa kanya”
  alternative: “Sinabi ng PANGINOON sa kanya”
  rationale: Pinananatili ang panghalip ng tekstong Hebreo at ang paraan ng pagsasalaysay nito, nang hindi nagdaragdag ng tahasang pangngalan.
- issue: Lakas ng pangako sa dalawang infinitive absolute
  choice: “tiyak na ... at tiyak na ...”
  alternative: “maaabutan mo ... at makapagliligtas ka”
  rationale: Ipinapakita ang mariing katiyakang taglay ng mga Hebreong konstruksiyon sa parehong sugnay.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “mandarambong” upang malinaw na ilarawan ang sumalakay na pangkat, at “mga bihag” bilang kontekstuwal na layon ng pagliligtas.
