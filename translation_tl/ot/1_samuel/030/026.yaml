language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֤א דָוִד֙ אֶל צִ֣קְלַ֔ג וַ/יְשַׁלַּ֧ח מֵֽ/הַ/שָּׁלָ֛ל לְ/זִקְנֵ֥י יְהוּדָ֖ה לְ/רֵעֵ֣/הוּ לֵ/אמֹ֑ר הִנֵּ֤ה לָ/כֶם֙ בְּרָכָ֔ה מִ/שְּׁלַ֖ל אֹיְבֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/026.yaml
  text: When David came to Ziklag[a], he sent some of the plunder to the elders of Judah, his friends, saying, “Look, here is a gift for you from the plunder of the enemies of Yahweh.”
translation:
  language: tl
  text: Nang dumating si David sa Ziklag, nagpadala siya ng bahagi ng samsam sa mga nakatatanda ng Juda, na mga kaibigan niya, at sinabi niya, “Narito ang isang regalo[a] para sa inyo mula sa samsam ng mga kaaway ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagpapala.” Ang salitang Hebreo ay karaniwang nangangahulugang “pagpapala,” ngunit dito ay tumutukoy ito sa materyal na regalong mula sa samsam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pagdating ni David
  rationale: Ipinahahayag nang natural sa Tagalog ang pagkakasunod ng pagdating ni David at ang ginawa niya pagkatapos, habang pinananatili ang takbo ng salaysay.
- source_word: צִקְלַג
  choice: Ziklag
  rationale: Isinatinig ang pangalang pantangi ng lugar ayon sa karaniwang anyo nito.
- source_word: וַיְשַׁלַּח מֵהַשָּׁלָל
  choice: nagpadala siya ng bahagi ng samsam
  rationale: Ipinahihiwatig ng מִן na bahagi lamang ng kabuuang samsam ang ipinadala. Ang “samsam” ay natural at malinaw na terminong militar sa modernong Tagalog.
- source_word: לְזִקְנֵי יְהוּדָה
  choice: sa matatandang pinuno ng Juda
  rationale: Ang “matatandang pinuno” ay naglilinaw na kinikilalang mga lider ng Juda ang tinutukoy, hindi lamang matatanda sa edad.
- source_word: לְרֵעֵהוּ
  choice: na mga kaibigan niya
  rationale: Maaaring mangahulugan ang רֵעַ na kaibigan, kasamahan, o kapuwa. Sa konteksto ng mabuting ugnayan ni David sa mga pinunong ito, natural ang “mga kaibigan niya” nang hindi higit na tinutukoy ang uri ng alyansa.
- source_word: לֵאמֹר
  choice: Sinabi niya
  rationale: Natural na panimula ng tuwirang pananalita sa Tagalog.
- source_word: הִנֵּה לָכֶם
  choice: Narito ... para sa inyo
  rationale: Pinananatili ng “Narito” ang pantawag-pansing at panturong lakas ng הִנֵּה nang hindi gumagamit ng makalumang pananalita.
- source_word: בְּרָכָה
  choice: isang regalo
  rationale: Bagaman literal na “pagpapala,” tumutukoy ito rito sa materyal na regalong mula sa samsam. Inilalagay sa talababa ang mas literal na kahulugan upang mapanatili ang leksikal na pahiwatig.
- source_word: מִשְּׁלַל
  choice: mula sa samsam
  rationale: Parehong salitang Hebreo para sa nasamsam sa digmaan ang ginamit; pinananatili ang pagkakapare-pareho.
- source_word: אֹיְבֵי יְהוָה
  choice: mga kaaway ni Yahweh
  rationale: Tuwirang inilalarawan ng parirala ang mga taong itinuturing na kalaban ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinatinig ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang pagsasatinig nito at hindi pagpapalit ng pangalan ng isang titulo.
- issue: Kung literal na “pagpapala” o kontekstuwal na “regalo” ang בְּרָכָה
  choice: regalo
  alternative: pagpapala
  rationale: Ang agarang konteksto ay pagpapadala ni David ng materyal na bahagi mula sa samsam. Ipinababatid ng “regalo” ang konkretong tinutukoy, samantalang pinananatili sa talababa ang literal at maaaring teolohikal na pahiwatig na “pagpapala.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “matatandang pinuno” upang malinaw ang tungkulin ng mga elder, “samsam” para sa bokabularyong pandigma, at “Narito” upang mapanatili ang diin ng הִנֵּה nang hindi nagiging makaluma.
