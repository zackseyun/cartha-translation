  to: Sumagot ang lahat ng masasama at walang-kuwentang[a] lalaki na kabilang sa mga sumama kay David. Sinabi nila, “Dahil hindi sila sumama sa akin[b], hindi natin sila bibigyan ng anuman mula sa nasamsam[c] na nabawi natin, maliban sa asawa at mga anak ng bawat isa; isama nila ang mga ito at umalis.”
