  source_fidelity: Kailangan ng maliit ngunit mahalagang pagwawasto sa huling konsesyon. Ang Hebreo ay elliptical na “maliban [sa] bawat lalaki, ang kanyang asawa at mga anak,” kasunod ng “akayin nila at umalis.” Ang “Ang ibibigay lamang sa bawat isa” ay masyadong nagpapalinaw at bahagyang binabago ang estruktura ng tuwirang pananalita. Ang iba pang pangunahing elemento—ang partitive na pangkat, ang isahang “sa akin,” ang maramihang “natin,” at ang nabawing samsam—ay naipapahayag nang wasto.
  naturalness: Natural ang pangkalahatang Tagalog, ngunit mas malinaw at mas tuwiran ang “maliban sa asawa at mga anak ng bawat isa” kaysa “Ang ibibigay lamang sa bawat isa ay ...”. Ang “walang-kuwenta” ay mas maayos na baybay para sa pang-uri.
  terminology: Ang “masama at walang-kuwenta” ay angkop na deskriptibong salin ng רָע וּבְלִיַּעַל at hindi ginagawang pangalang pantangi ang beliyyaal. Ang “nasamsam” at “nabawi” ay angkop sa kontekstong pandigma at pagbawi.
