  text: וַ/יַּ֜עַן כָּל אִֽישׁ רָ֣ע וּ/בְלִיַּ֗עַל מֵֽ/הָ/אֲנָשִׁים֮ אֲשֶׁ֣ר הָלְכ֣וּ עִם דָּוִד֒ וַ/יֹּאמְר֗וּ יַ֚עַן אֲשֶׁ֣ר לֹֽא הָלְכ֣וּ עִמִּ֔/י לֹֽא נִתֵּ֣ן לָ/הֶ֔ם מֵ/הַ/שָּׁלָ֖ל אֲשֶׁ֣ר הִצַּ֑לְנוּ כִּֽי אִם אִ֤ישׁ אֶת אִשְׁתּ/וֹ֙ וְ/אֶת בָּנָ֔י/ו וְ/יִנְהֲג֖וּ וְ/יֵלֵֽכוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/022.yaml
  text: Then every wicked and worthless man from among the men who had gone with David answered and said[a], “Because they did not go with me, we will not give them any of the spoil that we recovered[c][b], except that each man may take his wife and his children and lead them away and go.”
translation:
  language: tl
  text: Sumagot ang lahat ng masasama at walang-kuwentang[a] lalaki na kabilang sa mga sumama kay David. Sinabi nila, “Dahil hindi sila sumama sa akin[b], hindi natin sila bibigyan ng anuman mula sa nasamsam[c] na nabawi natin, maliban sa asawa at mga anak ng bawat isa; isama nila ang mga ito at umalis.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “walang-kuwenta” ay salin ng Hebreong beliyyaal bilang paglalarawan; maaari rin itong isaling “masuwayin” o “walang prinsipyo.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “sa akin.” Maramihan ang mga nagsasalita, ngunit anyong isahan ang pinananatili sa sipi.'
    reason: source_ambiguity
  - marker: c
    text: O “dambong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: Sumagot ... Sinabi nila
  rationale: Pinananatili ang dalawang pandiwang pananalita at ang paglipat mula sa anyong isahan tungo sa maramihan, ngunit ipinapahayag ang mga ito sa natural na salaysay sa Tagalog.
- source_word: כָּל אִישׁ רָע וּבְלִיַּעַל
  choice: lahat ng lalaking masama at walang kuwenta
  rationale: Ipinahahayag ng “masama” ang moral na bigat ng רָע, samantalang ang “walang kuwenta” ay naglalarawan sa בְלִיַּעַל nang hindi ito ginagawang pangalang pantangi o nilalagyan ng mas huling kaugnayang demoniko.
- source_word: מֵהָאֲנָשִׁים אֲשֶׁר הָלְכוּ עִם דָּוִד
  choice: na kabilang sa mga sumama kay David
  rationale: 'Malinaw na ipinakikita ang partitive na gamit ng מִן: ang mga nagsalita ay isang pangkat mula sa mga sumama kay David.'
- source_word: יַעַן אֲשֶׁר
  choice: Dahil
  rationale: Natural at tuwirang ipinahahayag ang sanhi o dahilan.
- source_word: לֹא הָלְכוּ עִמִּי
  choice: hindi sila sumama sa akin
  rationale: Pinananatili ang unang panauhang isahan ng tekstong Hebreo kahit maramihan ang mga nagsasalita at ang kasunod na “natin.”
- source_word: לֹא נִתֵּן לָהֶם
  choice: hindi natin sila bibigyan
  rationale: Ang unang panauhang maramihang imperfect ay ipinahayag bilang matatag na pasiya ng pangkat.
- source_word: מֵהַשָּׁלָל
  choice: anumang bahagi sa nasamsam
  rationale: Ang “nasamsam” ay likas na katawagan sa mga ari-ariang nakuha sa digmaan, at ang “anumang bahagi” ay naghahayag sa partitive na diwa ng מִן.
- source_word: אֲשֶׁר הִצַּלְנוּ
  choice: na nabawi natin
  rationale: Sa konteksto ng muling pagkuha ng mga ari-ariang tinangay ng mga mananalakay, malinaw na ipinahahayag ng “nabawi” ang kontekstuwal na diwa ng hiphil ng נצל.
- source_word: כִּי אִם אִישׁ אֶת אִשְׁתּוֹ וְאֶת בָּנָיו
  choice: Ang ibibigay lamang sa bawat isa ay ang kanyang asawa at mga anak
  rationale: Ipinahahayag ang tanging ipinahihintulot na matanggap ng bawat lalaki. Ang בָּנָיו ay isinaling “mga anak” bilang natural at kontekstuwal na katawagan sa pamilya.
- source_word: וְיִנְהֲגוּ וְיֵלֵכוּ
  choice: isama nila ang mga ito at umalis
  rationale: Pinananatili ang dalawang kilos—ang pag-akay o pagsama sa pamilya at ang pag-alis—sa malinaw na modernong Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa בְלִיַּעַל
  choice: walang kuwenta
  alternative: masuwayin; Belial
  rationale: Dito ay paglalarawan ito sa masasamang tao, hindi pangalang pantangi ng isang espirituwal na nilalang. Iniiwasan ng salin ang pagpasok ng mas huling teolohikal na kahulugan na hindi hinihingi ng konteksto.
- issue: Pagpapanatili sa paglipat mula “akin” tungo sa “natin”
  choice: panatilihin ang isahan sa “akin” at maramihan sa “natin”
  alternative: gawing “atin” o “sa amin” ang kapuwa parirala
  rationale: Tunay na nasa tekstong Hebreo ang tensiyong panggramatika. Maaaring isang kinatawan ang nagsasalita para sa pangkat, ngunit hindi ito tahasang nilulutas ng salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal, na may natural na ayos ng salaysay. Iniwasan ang sobrang arkaikong “dambong” sa pangunahing teksto ngunit inilagay ito bilang leksikal na alternatibo. Pinanatili ang kapansin-pansing paglipat ng panauhan mula “akin” tungo sa “natin.”
