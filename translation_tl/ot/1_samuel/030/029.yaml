base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/029.yaml
  text: and to those in Rakal[a], and to those in the towns of the Jerahmeelites, and to those in the towns of the Kenites.
translation:
  language: tl
  text: at sa mga nasa Rakal,[a] at sa mga nasa mga bayan ng mga Jerahmeelita, at sa mga nasa mga bayan ng mga Kenita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Rakal ay binabaybay ding “Racal” sa ilang tradisyong Ingles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: at sa mga nasa
  rationale: Sa talaan ng mga pinadalhan, ang inuulit na parirala ay tumutukoy sa mga taong naroon sa bawat pook. Likas sa Tagalog ang “sa mga nasa,” at napapanatili nito ang diwa ng pagbibigay sa mga tatanggap.
- source_word: בְּרָכָל
  choice: nasa Rakal
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng tuwirang transliterasyon mula sa Hebreo.
- source_word: בְּעָרֵי
  choice: nasa mga bayan ng
  rationale: Maaaring mangahulugan ang עִיר ng lungsod o bayan. Sa konteksto ng mga pamayanang panrehiyon, mas likas at angkop ang “mga bayan.”
- source_word: הַיְּרַחְמְאֵלִי
  choice: mga Jerahmeelita
  rationale: Bagaman anyong isahan ang gentiliko sa Hebreo, kolektibo itong tumutukoy sa pangkat ng mga taong kaugnay ng mga bayang iyon.
- source_word: הַקֵּינִי
  choice: mga Kenita
  rationale: Ang gentiliko ay nasa anyong isahan sa Hebreo ngunit ginagamit nang kolektibo; natural itong isalin bilang pangalan ng pangkat sa maramihan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na ayos ng Hebreo upang maipakita ang anyo ng talaan, habang ginamit ang likas na pariralang “sa mga nasa.”
