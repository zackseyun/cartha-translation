base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/019.yaml
  text: Nothing of theirs was missing[a], from small to great, sons and daughters, spoil, or anything that had been taken from them[b]; David brought back everything.
translation:
  language: tl
  text: Walang anumang nawala sa kanila, mula sa maliit hanggang sa malaki[a]—mga anak na lalaki at babae, samsam, o anumang kinuha mula sa kanila[b]. Ibinalik ni David ang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa hamak hanggang sa dakila.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “lahat ng kinuha nila para sa kanilang sarili”; sa konteksto, ito ang kinuha ng mga Amalekita mula sa mga tauhan ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶעְדַּר
  choice: nawawala
  rationale: Ang Niphal ng עדר ay tumutukoy sa pagiging wala o kulang. Ang “nawawala” ay natural sa salaysay ng pagbawi at hindi nagpapahiwatig na tuluyan nang nawala ang mga tao o ari-arian.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Pinananatili ng “sa kanila” ang kaugnayan ng mga tao at ari-arian sa pangkat ni David nang hindi nililimitahan ang parirala sa mga pag-aari lamang.
- source_word: מִן הַקָּטֹן וְעַד הַגָּדוֹל
  choice: mula sa maliit hanggang sa malaki
  rationale: Malapit ito sa Hebreo at pinananatili ang posibleng pagtukoy sa edad, katayuan, o isang saklaw na sumasaklaw sa lahat.
- source_word: בָּנִים וּבָנוֹת
  choice: mga anak na lalaki at babae
  rationale: Tahasan nitong pinananatili ang pagbanggit ng Hebreo sa mga anak na lalaki at mga anak na babae.
- source_word: מִשָּׁלָל
  choice: samsam
  rationale: Ang “samsam” ay kasalukuyan at angkop na salitang Filipino para sa mga bagay na kinuha sa pagsalakay.
- source_word: כָּל אֲשֶׁר לָקְחוּ לָהֶם
  choice: anumang kinuha mula sa kanila
  rationale: Ipinahahayag nito nang natural ang kahulugan sa konteksto, habang inilalagay sa talababa ang mas literal na anyo ng Hebreo.
- source_word: הַכֹּל הֵשִׁיב
  choice: Ibinalik ... ang lahat
  rationale: Ang Hiphil ng שוב ay nangangahulugang pinabalik o ibinalik; malinaw na inilalarawan ng “ibinalik” ang ginawa ni David.
- source_word: דָּוִד
  choice: David
  rationale: Karaniwang anyo ng pangalang ito sa modernong Filipino.
theological_decisions:
- issue: Saklaw ng “mula sa maliit hanggang sa malaki”
  choice: Pinanatili ang literal at malawak na parirala.
  alternative: Ipaliwanag ito bilang “mula sa pinakabata hanggang sa pinakamatanda” o “mula sa hamak hanggang sa dakila.”
  rationale: Hindi tiyak sa parirala mismo kung edad, katayuan, o pangkalahatang saklaw ang pangunahing diin, kaya hindi ito nilimitahan sa isang interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “samsam” bilang maikli at pamilyar na katawagan sa mga ari-ariang kinuha sa pagsalakay; pinanatili ang bahagyang kalabuan ng merismong “maliit ... malaki.”
