base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/007.yaml
  text: Then David said to Abiathar the priest[a], the son of Ahimelech[b], “Please bring me the ephod.” So Abiathar brought the ephod to David.
translation:
  language: tl
  text: Pagkatapos, sinabi ni David kay Abiatar na pari, anak ni Ahimelec, “Pakidalá mo sa akin ang efod.[a]” Kaya dinala ni Abiatar ang efod kay David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “efod” ay isang sagradong bagay o kasuotang ginagamit ng mga pari sa pagsamba ng Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: הַכֹּהֵן
  choice: na pari
  rationale: Tinutukoy nito ang katungkulan ni Abiatar; ang “pari” ang tuwirang katumbas sa konteksto ng Israel.
- source_word: בֶּן אֲחִימֶלֶךְ
  choice: na anak ni Ahimelec
  rationale: Ipinahahayag ng pariralang construct ang ugnayang ama-anak; ang dalawang pariralang may “na” ay malinaw at natural na paglalarawan kay Abiatar.
- source_word: הַגִּישָׁה נָּא לִי
  choice: Pakidala rito sa akin
  rationale: Ang Hiphil imperative ng נגשׁ ay “ilapit” o “dalhin,” at ang נָא ay magalang na pakiusap. Ipinahihiwatig ng “rito” ang paglapit sa nagsasalita.
- source_word: הָאֵפֹד
  choice: ang efod
  rationale: Walang eksaktong katumbas sa Tagalog ang natatanging bagay o kasuotang panpari na ito, kaya pinanatili ang transliterasyon.
- source_word: וַיַּגֵּשׁ
  choice: Kaya dinala
  rationale: Ang pandiwa ay mula sa ugat ding ginamit sa utos at nagsasaad ng pagtugon ni Abiatar; natural na inilalahad ng “Kaya” ang bunga.
- source_word: אֶל דָּוִד
  choice: kay David
  rationale: Ipinakikita ng אֶל ang paggalaw patungo kay David; sa Tagalog, sapat at natural ang “kay David” pagkatapos ng “dinala.”
theological_decisions:
- issue: Kahulugan ng אֵפוֹד bilang sagradong bagay na kaugnay ng paglilingkod at pagsangguni ng pari
  choice: Panatilihin ang transliterasyong “efod” sa pangunahing teksto
  alternative: kasuotang panpari / sagradong kasuotan
  rationale: Maaaring tumukoy ang termino sa isang kasuotang panpari o sa sagradong bagay na ginamit sa pagsangguni sa Diyos. Ang transliterasyon at maikling talababa ay hindi labis na nagtatakda sa anyo o tungkulin nito sa talatang ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Pakidala rito sa akin” upang mapanatili ang magalang na pakiusap at ang diwa ng paglalapit. Ang mga pangalang “Abiatar” at “Ahimelec” ay nasa karaniwang anyong Tagalog.
