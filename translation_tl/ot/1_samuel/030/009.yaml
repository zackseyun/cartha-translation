base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/009.yaml
  text: So David went[a], he and the six hundred men who were with him, and they came to the Brook Besor[b], where those who were left behind stayed.
translation:
  language: tl
  text: Kaya umalis si David kasama ang animnaraang lalaking kasama niya, at nakarating sila sa Batis ng Besor[a]. Nanatili roon ang mga naiwan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Batis ng Besor” ay maaari ding isaling “Wadi Besor,” isang pana-panahong daluyan ng tubig o bangin na maaaring matuyo kapag walang ulan.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin, “Huminto roon ang mga natira”; sa literal, “tumayo ang mga natira.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד
  choice: Kaya umalis si David
  rationale: Ang wayyiqtol ng הלך ay nagpapatuloy sa daloy ng salaysay. Likas sa modernong Tagalog ang “Kaya umalis” at malinaw nitong ipinahihiwatig ang paglalakbay ni David.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר אִתּוֹ
  choice: kasama ang animnaraang lalaking kasama niya
  rationale: Ang hiwalay na panghalip na הוּא ay idinurugtong kay David at isinasama siya sa animnaraang lalaki. Ang “lalaki” ay angkop sa pangkat ng mga mandirigma sa konteksto, at natural na naipahahayag ng “kasama” ang ugnayan nila kay David.
- source_word: וַיָּבֹאוּ
  choice: at nakarating sila
  rationale: Maramihan ang pandiwa sapagkat tumutukoy ito kay David at sa kanyang mga tauhan. Sa konteksto ng paglalakbay, mas natural ang “nakarating sila” kaysa sa literal na “dumating sila.”
- source_word: עַד נַחַל הַבְּשׂוֹר
  choice: sa Batis Besor
  rationale: Maaaring tumukoy ang נַחַל sa batis o sa isang pana-panahong daluyan ng tubig. Madaling maunawaan ang “Batis Besor,” samantalang ipinapaliwanag sa talababa ang heograpikong diwa ng salita.
- source_word: וְהַנּוֹתָרִים עָמָדוּ
  choice: Nanatili roon ang mga naiwan
  rationale: Ang הַנּוֹתָרִים ay tumutukoy sa mga hindi nagpatuloy, at ang עָמָדוּ, bagaman literal na “tumayo,” ay nangangahulugang huminto o nanatili sa kontekstong ito. Hindi tinutukoy ng talata kung bakit sila naiwan; nililinaw iyon ng kasunod na talata.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural at marangal na modernong Tagalog. Hinati sa dalawang pangungusap ang Hebreong salaysay upang maging malinaw nang hindi binabago ang ugnayan ng mga sugnay. Iniwasang ipahiwatig sa pangunahing teksto ang dahilan ng pagkaiwan ng ilan, sapagkat saka pa lamang iyon nililinaw sa kasunod na talata.
