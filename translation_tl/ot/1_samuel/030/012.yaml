base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/012.yaml
  text: They gave him a piece of fig cake and two clusters of raisins[a], and he ate, and his spirit returned to him[c][b], for he had not eaten bread or drunk water for three days and three nights.
translation:
  language: tl
  text: Binigyan nila siya ng isang piraso ng pinisang igos[a] at dalawang kumpol ng pasas[b]. Kumain siya, at nagbalik sa kanya ang kanyang espiritu[c], sapagkat tatlong araw at tatlong gabi na siyang hindi kumakain ng tinapay ni umiinom ng tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay igos na pinisa at hinubog upang maging isang tipak o keyk.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “dalawang keyk ng pasas.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “nanumbalik ang kanyang lakas” o “nanumbalik ang kanyang sigla”; literal, “nagbalik sa kanya ang kanyang espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶלַח דְּבֵלָה
  choice: isang piraso ng pinisang igos
  rationale: Ang פֶלַח ay isang piraso o hiwa, at ang דְּבֵלָה ay igos na pinisa at hinubog upang maimbak, hindi sariwang igos. Ang saling ito ay malinaw sa karaniwang mambabasa nang hindi ipinapalagay ang isang makabagong uri ng keyk.
- source_word: שְׁנֵי צִמֻּקִים
  choice: dalawang kumpol ng pasas
  rationale: Ang צִמֻּקִים ay mga pasas, at ipinahihiwatig ng bilang na may dalawang yunit ang ibinigay. Pinananatili ng “kumpol” ang anyong hindi lubusang tiyak; maaari ring tumukoy ang parirala sa dalawang pinisang tipak o keyk ng pasas.
- source_word: וַתָּשָׁב רוּחוֹ אֵלָיו
  choice: nagbalik sa kanya ang kanyang espiritu
  rationale: Tuwirang pinananatili nito ang larawang Hebreo. Sa konteksto, idyoma ito ng panunumbalik ng lakas o sigla, ngunit hindi iyon tahasang ipinalit sa teksto.
- source_word: לֶחֶם
  choice: tinapay
  rationale: Bagaman maaari itong mangahulugang pagkain sa mas malawak na diwa, konkreto rito ang “tinapay” at likas itong kapares ng tubig.
- source_word: שָׁתָה מַיִם
  choice: umiinom ng tubig
  rationale: Tiyak na binabanggit ng Hebreo ang pag-inom ng tubig, kaya pinanatili ang konkretong detalye.
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: tatlong araw at tatlong gabi
  rationale: Tuwirang salin ito ng malinaw na panandang pangpanahon sa Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili sa pangunahing teksto ang konkretong “tinapay” at “tubig” at ang larawang “nagbalik ... ang kanyang espiritu,” habang ipinaliwanag sa talababa ang idyomatikong diwa at ang mga hindi tiyak na anyo ng pagkaing pinatuyo.
