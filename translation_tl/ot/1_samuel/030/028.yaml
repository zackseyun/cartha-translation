  text: and to those in Aroer[a], and to those in Siphmoth, and to those in Eshtemoa[b],
translation:
  language: tl
  text: at sa mga nasa Aroer, at sa mga nasa Sifmot, at sa mga nasa Estemoa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: at sa mga nasa
  rationale: Ang paulit-ulit na pormula ay binubuo ng pangatnig, pang-ukol, at panghalip na relativo. Sa talaan ng mga tumanggap na nakatira sa mga bayan, likas at malinaw sa modernong Tagalog ang “at sa mga nasa,” habang pinananatili ang pag-uulit ng Hebreo.
- source_word: בַּעֲרֹעֵר
  choice: Aroer
  rationale: Pangalan ito ng isang lugar. Ipinahahayag na ng “nasa” ang lokasyon, kaya hindi na kailangang isalin nang hiwalay ang prefixed na pang-ukol.
- source_word: בְּשִׂפְמוֹת
  choice: Sifmot
  rationale: Isinatinig ang pangalang Hebreo ayon sa karaniwang baybay at bigkas sa Filipino; ipinahahayag ng “nasa” ang lokatibong pang-ukol.
- source_word: בְּאֶשְׁתְּמֹעַ
  choice: Estemoa
  rationale: Isinatinig ang pangalang Hebreo sa paraang madaling basahin sa Filipino; ipinahahayag ng “nasa” ang lokatibong pang-ukol.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Pinanatili ang tatlong ulit na “at sa mga nasa” upang maipakita ang diin at ayos ng tekstong Hebreo. Ginamit ang mga anyong pangalang Aroer, Sifmot, at Estemoa na angkop sa ortograpiyang Filipino.
