  text: וַ/יְהִ֞י בְּ/בֹ֨א דָוִ֧ד וַ/אֲנָשָׁ֛י/ו צִֽקְלַ֖ג בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וַ/עֲמָלֵקִ֣י פָֽשְׁט֗וּ אֶל נֶ֨גֶב֙ וְ/אֶל צִ֣קְלַ֔ג וַ/יַּכּוּ֙ אֶת צִ֣קְלַ֔ג וַ/יִּשְׂרְפ֥וּ אֹתָ֖/הּ בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/001.yaml
  text: When David and his men came to Ziklag on the third day[a], the Amalekites had made a raid against the Negev and against Ziklag, and they had struck Ziklag and burned it with fire.
translation:
  language: tl
  text: Nang dumating si David at ang kanyang mga tauhan sa Ziklag noong ikatlong araw, nilusob na ng mga Amalekita ang Negev[a] at ang Ziklag. Sinalakay nila ang Ziklag at sinunog ito sa apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang Timog.” Ang salitang Hebreo na negev ay maaaring tumukoy sa timog na lupain sa pangkalahatan o sa partikular na rehiyong tinatawag na Negev.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבֹא
  choice: Nang dumating
  rationale: Ipinapahayag ng parirala ang pangyayaring nagsisilbing panahong tagpuan. Natural sa makabagong Tagalog ang “Nang dumating” at hindi nito dinaragdagan ng tahasang “ngayon” ang Hebreo.
- source_word: וַאֲנָשָׁיו
  choice: at ang kanyang mga tauhan
  rationale: Sa konteksto, tumutukoy ito sa pangkat ng mga lalaking kasama ni David, hindi sa mga tao sa pangkalahatan. Ang “mga tauhan” ay malinaw at natural para sa kanyang pangkat.
- source_word: צִקְלַג
  choice: Ziklag
  rationale: Isinalin sa pamamagitan ng transliterasyon bilang pangalan ng lugar.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: noong ikatlong araw
  rationale: Tuwirang temporal na pahayag na natural sa salaysay sa Tagalog.
- source_word: וַעֲמָלֵקִי
  choice: mga Amalekita
  rationale: Bagaman kolektibong anyong isahan ang katawagang Hebreo, maramihan ang mga kasunod na pandiwa; kaya maramihan din ang natural na salin.
- source_word: פָשְׁטוּ
  choice: sinalakay na
  rationale: Sa kontekstong militar, nangangahulugan itong magsagawa ng biglaang pagsalakay. Ipinahihiwatig ng “na” na naganap ang pagsalakay bago dumating si David.
- source_word: אֶל נֶגֶב
  choice: ang Negev
  rationale: Maaaring tumukoy ang נֶגֶב sa partikular na rehiyong Negev o sa timog sa pangkalahatan. Pinanatili sa pangunahing teksto ang pangalang heograpiko at inilagay sa talababa ang leksikal na alternatibo.
- source_word: וַיַּכּוּ אֶת צִקְלַג
  choice: Nilusob nila ang Ziklag
  rationale: Ang נכה ay malawak na pandiwang maaaring mangahulugang hampasin o salakayin. Ang “nilusob” ay malinaw sa kontekstong militar at hindi lipas ang dating.
- source_word: וַיִּשְׂרְפוּ אֹתָהּ בָּאֵשׁ
  choice: sinunog iyon sa apoy
  rationale: Pinananatili ang tahasang Hebreong “sinunog ... sa apoy,” kahit bahagyang mariin ito sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga tauhan” para sa pangkat ni David at ang “sinalakay na” upang maipakita nang natural na nauna ang pagsalakay sa pagdating niya. Inilipat ang talababa sa “Negev,” ang salitang talagang may leksikal na alternatibo.
