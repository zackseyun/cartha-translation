base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/005.yaml
  text: 'And David’s two wives had been taken captive: Ahinoam the Jezreelitess and Abigail[b][a], the wife of Nabal the Carmelite.'
translation:
  language: tl
  text: 'Nabihag din ang dalawang asawa ni David: si Ahinoam na taga-Jezreel[a], at si Abigail, na asawa ni Nabal na taga-Carmel.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang babaeng mula sa Jezreel.”
    reason: lexical_alternative
  - marker: b
    text: Ang “taga-Carmel” dito ay nangangahulugang mula sa lugar na Carmel; hindi ito tumutukoy sa isang orden ng relihiyon na lumitaw noong bandang huli.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁתֵּי נְשֵׁי דָוִד
  choice: din ang dalawang asawa ni David
  rationale: Ikinakabit ng וּ ang talata sa naunang salaysay; natural sa Filipino ang “din” upang ipakitang kabilang ang dalawang asawa sa mga nabihag. Ang שְׁתֵּי נְשֵׁי דָוִד ay “dalawang asawa ni David.”
- source_word: נִשְׁבּוּ
  choice: Nabihag
  rationale: Ang nifal perfect ng שׁבה ay nagsasaad na sila ay dinakip bilang mga bihag. Sapat na sa daloy ng salaysay ang aspektong perpektibo ng “nabihag,” nang hindi pilit na ginagaya ang English pluperfect.
- source_word: אֲחִינֹעַם הַ/יִּזְרְעֵלִית
  choice: si Ahinoam na taga-Jezreel
  rationale: Isinatinig ang pangalang Ahinoam at isinalin ang pambabaeng gentilic bilang natural at walang-kasariang katawagang Filipino na “taga-Jezreel.”
- source_word: וַ/אֲבִיגַיִל
  choice: at si Abigail
  rationale: Tuwirang ipinapahayag ang pangatnig at isinasatinig ang pangalan.
- source_word: אֵשֶׁת נָבָל
  choice: na asawa ni Nabal
  rationale: Pinananatili ang payak na pagkakakilanlan sa tekstong Hebreo. Hindi idinagdag ang “dating,” kahit patay na si Nabal sa konteksto, sapagkat wala iyon sa pariralang ito.
- source_word: הַֽ/כַּרְמְלִי
  choice: na taga-Carmel
  rationale: Ang gentilic ay heograpikal at tumutukoy kay Nabal bilang lalaking mula sa Carmel. Mas malinaw sa modernong Filipino ang “taga-Carmel” kaysa sa hiram na katawagang maaaring mapagkamalang kaugnay ng isang orden ng relihiyon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “taga-” para sa mga gentilic dahil natural ito sa karaniwang wika at malinaw na nagpapahayag ng pinagmulan. Inilagay ang bawat talababa sa mismong salitang nililinaw nito.
