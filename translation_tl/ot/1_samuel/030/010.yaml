  text: וַ/יִּרְדֹּ֣ף דָּוִ֔ד ה֖וּא וְ/אַרְבַּע מֵא֣וֹת אִ֑ישׁ וַ/יַּֽעַמְדוּ֙ מָאתַ֣יִם אִ֔ישׁ אֲשֶׁ֣ר פִּגְּר֔וּ מֵ/עֲבֹ֖ר אֶת נַ֥חַל הַ/בְּשֽׂוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/010.yaml
  text: So David pursued[a], he and four hundred men, while two hundred men stayed behind[b], who were too exhausted to cross the Brook Besor.
translation:
  language: tl
  text: Kaya humabol si David kasama ang apatnaraang lalaki. Naiwan naman ang dalawandaang lalaki dahil sa sobrang pagod[a] at hindi na sila makatawid sa Batis ng Besor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang pananalitang Hebreo na “lubhang nanghina” o “nahuli dahil sa pagod.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Batis ng Besor.” Ang salitang נחל ay maaaring tumukoy sa batis, wadi, o daluyang natutuyo kapag walang ulan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: humabol
  rationale: Ang רדף ay nangangahulugang humabol o tumugis. Ang “humabol” ay natural sa salaysay at malinaw na nagpapahiwatig ng patuloy na pagtugis.
- source_word: הוּא וְאַרְבַּע מֵאוֹת אִישׁ
  choice: si David kasama ang apatnaraang lalaki
  rationale: Ang hulma ng Hebreo ay mariing tumutukoy kay David at sa apatnaraang lalaking kasama niya. Natural itong ipinahahayag sa Tagalog sa pamamagitan ng “kasama.”
- source_word: וַיַּעַמְדוּ
  choice: naiwan naman
  rationale: Literal na “tumayo” o “huminto,” ngunit sa konteksto ay hindi na nagpatuloy ang pangkat. Ang “naiwan naman” ang natural na paglalarawan sa kanilang kalagayan nang hindi sinasabing sadyang iniwan sila ni David.
- source_word: אֲשֶׁר פִּגְּרוּ מֵעֲבֹר
  choice: dahil sa sobrang pagod at hindi na sila makatawid
  rationale: Ang bihirang pandiwang פגר sa kontekstong ito ay nagpapahiwatig ng panghihina o pagkaubos ng lakas kaya hindi na sila makatawid. Nililinaw ng salin ang ugnayan ng kalagayan at bunga nang hindi inaalis ang alternatibong kahulugan sa talababa.
- source_word: נַחַל הַבְּשׂוֹר
  choice: Batis ng Besor
  rationale: Ang נחל ay maaaring tumukoy sa batis, wadi, o daluyang pana-panahon lamang may tubig. Ang “Batis ng Besor” ay madaling maunawaan, samantalang pinananatili sa talababa ang mas malawak na saklaw ng salita.
theological_decisions: []
translation_notes:
  register: Makabago at dignified na Filipino, gamit ang karaniwang mga salitang “humabol,” “naiwan,” at “sobrang pagod.” Pinanatili ang pangalan ng lugar bilang Besor at iniwasan ang labis na teknikal na “wadi” sa pangunahing teksto.
