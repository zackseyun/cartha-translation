base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/014.yaml
  text: We raided the Negev of the Kerethites[a], and the territory that belongs to Judah, and the Negev of Caleb; and we burned Ziklag with fire.
translation:
  language: tl
  text: Nilusob namin ang Negev ng mga Kereteo[a], ang teritoryong pag-aari ng Juda, at ang Negev ni Caleb; at sinunog namin sa apoy ang Ziklag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tinatawag ding “mga Keretita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשַׁטְנוּ
  choice: Nilusob namin
  rationale: Sa kontekstong militar, tumutukoy ang pandiwa sa pagsalakay upang manamsam. Likas at tuwiran sa Filipino ang “nilusob,” bagaman hindi nito kailangang ipahiwatig ang pangmatagalang pananakop.
- source_word: נֶגֶב
  choice: Negev
  rationale: Pangalan ito rito ng tuyong rehiyon sa timog, hindi lamang direksiyon na “timog.” Pinananatili rin nito ang pag-uulit sa talata.
- source_word: הַכְּרֵתִי
  choice: mga Kereteo
  rationale: Tumutukoy ito sa isang pangkat ng mga tao. Ang “Kereteo” ay likas na anyong Filipino ng transliterasyong nakabatay sa Hebreo.
- source_word: וְעַל אֲשֶׁר לִיהוּדָה
  choice: ang teritoryong sakop ng Juda
  rationale: Ipinagpapatuloy ng parirala ang talaan ng mga lugar na nilusob. Ipinahahayag ng “sakop ng Juda” ang pag-aari o pagkakaugnay ng lugar sa Juda nang hindi gumagamit ng alanganing literal na anyo.
- source_word: נֶגֶב כָּלֵב
  choice: ang Negev ni Caleb
  rationale: Pinananatili ang maikling estrukturang Hebreo at ang heograpikong diwa; malamang na tumutukoy ito sa katimugang distrito na kaugnay ng angkan o teritoryo ni Caleb.
- source_word: שָׂרַפְנוּ בָאֵשׁ
  choice: sinunog namin
  rationale: Sa Filipino, likas nang ipinahihiwatig ng “sinunog” ang paggamit ng apoy; ang literal na “sinunog sa pamamagitan ng apoy” ay paulit-ulit at di-likas, habang nananatili ang buong diwa ng Hebreo.
- source_word: צִקְלַג
  choice: Ziklag
  rationale: Karaniwang transliterasyon ng pangalan ng lugar.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nilusob” para sa maikli at natural na salaysay-militar, at pinanatili ang “Negev” bilang pangalang heograpiko. Ang marker na [a] ay inilagay kaagad pagkatapos ng pangalan ng pangkat.
