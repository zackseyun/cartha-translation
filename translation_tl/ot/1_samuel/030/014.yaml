  - severity: low
    issue: Nawala ang hayagang pagtukoy sa apoy sa שָׂרַפְנוּ בָאֵשׁ.
    rationale: Bagaman likas na ipinahihiwatig ng “sinunog” ang apoy, tahasan itong binabanggit ng Hebreo at maaari itong maipahayag nang hindi nagiging di-likas ang Filipino.
  revised_text: Nilusob namin ang Negev ng mga Kereteo[a], ang teritoryong pag-aari ng Juda, at ang Negev ni Caleb; at sinunog namin sa apoy ang Ziklag.
