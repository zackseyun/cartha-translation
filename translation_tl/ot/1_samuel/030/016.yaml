  text: וַ/יֹּ֣רִדֵ֔/הוּ וְ/הִנֵּ֥ה נְטֻשִׁ֖ים עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ אֹכְלִ֤ים וְ/שֹׁתִים֙ וְ/חֹ֣גְגִ֔ים בְּ/כֹל֙ הַ/שָּׁלָ֣ל הַ/גָּד֔וֹל אֲשֶׁ֥ר לָקְח֛וּ מֵ/אֶ֥רֶץ פְּלִשְׁתִּ֖ים וּ/מֵ/אֶ֥רֶץ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/016.yaml
  text: When he had led him down[a], behold, they were spread out over the face of all the land[b], eating and drinking and celebrating over all the great spoil that they had taken from the land of the Philistines and from the land of Judah.
translation:
  language: tl
  text: Nang dinala niya siya pababa, naroon ang mga ito, nakakalat sa buong lupain[a], kumakain, umiinom, at nagdiriwang dahil sa[b] lahat ng malaking samsam na nakuha nila mula sa lupain ng mga Filisteo at sa lupain ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagkakahiwa-hiwalay sa buong lupain.” Maaaring idiin ng Hebreong participle ang pagkakawatak-watak o ang malawak na pagkalat.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagdiriwang dahil sa lahat ng malaking samsam.” Maaaring tukuyin ng pang-ukol sa Hebreo ang dahilan o ang okasyon ng kanilang pagdiriwang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרִדֵהוּ
  choice: Nang maihatid niya siya pababa
  rationale: Ang Hiphil ng ירד ay nangangahulugang magpababa o maghatid pababa. Pinananatili ng salin ang direksiyon at ang temporal na daloy ng salaysay nang hindi tahasang pinapangalanan ang mga panghalip na hindi pinangalanan sa Hebreo.
- source_word: וְהִנֵּה
  choice: naroon ang mga ito
  rationale: Ang הִנֵּה ay biglang nagtutuon ng pansin sa tanawing nakita. Ang “naroon ang mga ito” ay natural sa makabagong Tagalog at nagpapanatili ng agarang paglalahad nang hindi gumagamit ng lipas na “narito.”
- source_word: נְטֻשִׁים עַל־פְּנֵי כָל־הָאָרֶץ
  choice: nakakalat sa buong lupain
  rationale: Ipinahihiwatig ng pasibong participle ang pagkalat o malawak na pagkakahimpil. Ang “buong lupain” ay kumakatawan sa lokal na saklaw ng אֶרֶץ at hindi sa buong daigdig.
- source_word: אֹכְלִים וְשֹׁתִים וְחֹגְגִים
  choice: kumakain, umiinom, at nagdiriwang
  rationale: Pinananatili ang tatlong magkakasunod na participle bilang sabay-sabay at nagpapatuloy na mga kilos. Hindi ipinagsama sa isang malayang paraphrase ang pagkain, pag-inom, at pagdiriwang.
- source_word: בְּכֹל הַשָּׁלָל הַגָּדוֹל
  choice: dahil sa napakaraming nasamsam
  rationale: Maaaring markahan ng בְּ ang dahilan o okasyon ng pagdiriwang. Ang “dahil sa” ay malinaw at natural, samantalang ipinapakita sa talababa ang posibleng mas tuwirang ugnayang “para sa.” Ang הַשָּׁלָל ay isinaling “nasamsam,” ang karaniwang salitang Filipino para sa samsam sa digmaan.
- source_word: אֲשֶׁר לָקְחוּ
  choice: nila ... nasamsam
  rationale: Ang paglalagay ng “nila” sa pariralang “nasamsam nila” ay natural na kumakatawan sa naunang natapos na pagkuha na tinutukoy ng Hebreong perfect.
- source_word: מֵאֶרֶץ פְּלִשְׁתִּים וּמֵאֶרֶץ יְהוּדָה
  choice: mula sa lupain ng mga Filisteo at sa lupain ng Juda
  rationale: Pinananatili ang magkatulad na panteritoryong parirala at ang pagkakaiba ng mga Filisteo bilang isang bayan at ng Juda bilang pangalan ng lupain.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Iniwasan ang lipas na “masdan” o “narito,” ngunit pinanatili ang biglang pagbubukas ng tanawin. Ang mga marker [a] at [b] ay inilagay mismo sa mga pariralang tinatalakay ng kani-kanilang talababa.
