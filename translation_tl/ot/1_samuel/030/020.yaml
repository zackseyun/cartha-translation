  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח דָּוִ֔ד אֶת כָּל הַ/צֹּ֖אן וְ/הַ/בָּקָ֑ר נָהֲג֗וּ לִ/פְנֵי֙ הַ/מִּקְנֶ֣ה הַ/ה֔וּא וַ/יֹּ֣אמְר֔וּ זֶ֖ה שְׁלַ֥ל דָּוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/020.yaml
  text: David took all the flocks and the herds[a]. They drove them ahead of the other livestock, and said[b], “This is David’s spoil.”
translation:
  language: tl
  text: Kinuha ni David ang lahat ng kawan at bakahan. Itinaboy nila ang mga iyon sa unahan ng iba pang mga alagang hayop[a], at sinabi nila, “Ito ang samsam ni David.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa unahan ng mga alagang hayop na iyon.” Malamang na ang bagong nakuhang mga hayop ay itinaboy sa unahan ng mga alagang hayop na nabawi na nila.
    reason: textual_clarity
  - marker: b
    text: Maaari ring isalin, “Ito ang nasamsam ni David.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kinuha
  rationale: Karaniwang salaysay na kahulugan ng לקח; hindi nito dinaragdagan ang antas ng puwersang ipinahihiwatig ng teksto.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: ang lahat ng kawan at bakahan
  rationale: Pinananatili ang pagkakaiba ng צאן, maliliit na alagang hayop na gaya ng mga tupa at kambing, at בקר, mga baka; natural sa Filipino ang pares na “kawan at bakahan.”
- source_word: נָהֲגוּ
  choice: Itinaboy nila
  rationale: Sa konteksto, tumutukoy ang נהג sa pagpapasulong ng mga hayop; mas tiyak ito kaysa “inalakay.”
- source_word: לִפְנֵי הַמִּקְנֶה הַהוּא
  choice: sa unahan ng iba pang mga alagang hayop
  rationale: Ipinahahayag nang natural ang pagkakaiba ng mga hayop na kinuha ni David at ng grupong tinutukoy ng demonstratibong “iyon,” habang inilalahad sa talababa ang mas literal na anyo at ang hindi ganap na tiyak na reperensiya.
- source_word: שְׁלַל דָּוִד
  choice: samsam ni David
  rationale: Ang “samsam” ay natural at marangal na katumbas ng mga ari-ariang nakuha sa labanan o pagsalakay; pinananatili ng pariralang paari ang maikling anyo ng Hebreo.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “kawan at bakahan” upang mapanatili ang dalawang uri ng hayop, at “samsam” bilang maikli at pamilyar na salita para sa war booty. Iniwasang gawing lubhang tiyak sa pangunahing teksto ang reperensiya ng demonstratibo sa Hebreo; ipinaliwanag ito sa talababa.
