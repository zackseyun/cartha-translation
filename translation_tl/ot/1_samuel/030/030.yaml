base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/030.yaml
  text: and to those in Hormah[a], and to those in Bor-ashan, and to those in Athach.
translation:
  language: tl
  text: at sa mga nasa Horma, at sa mga nasa Bor-asan,[a] at sa mga nasa Atac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Bor-asan ay pangalan ng isang lugar. Maaaring literal na ipahiwatig ng mga sangkap ng pangalan ang “balon” o “hukay ng usok,” ngunit tinranslitera rito ang pangalan sa halip na isalin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: at sa mga nasa
  rationale: Ang וְ + לַאֲשֶׁר ay tumutukoy sa mga tumanggap na kaugnay ng bawat lugar. Ang “at sa mga nasa” ay likas sa Tagalog at pinananatili ang diwang datibo at lokatibo ng talaan.
- source_word: בְּחָרְמָה
  choice: nasa Horma
  rationale: Pangalan ito ng lugar na may pang-ukol na בְּ. Ang “nasa” ay natural na pagpapahayag ng lokasyon sa Tagalog.
- source_word: בְּבוֹר עָשָׁן
  choice: nasa Bor-asan
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa anyong transliterado sa halip na isalin ang mga sangkap nitong maaaring mangahulugang “balon/hukay ng usok.” Ginamit ang gitling upang ipakitang iisang pangalan ng lugar ito.
- source_word: בַּעֲתָךְ
  choice: nasa Atac
  rationale: Isa pang pangalan ng lugar na may lokatibong בְּ; pinanatili bilang transliteradong pantanging pangalan.
theological_decisions: []
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Inulit ang “at sa mga nasa” upang mapanatili ang estruktura ng Hebreong listahan. Inangkop sa karaniwang baybay-Filipino ang mga pangalan: Horma, Bor-asan, at Atac.'
