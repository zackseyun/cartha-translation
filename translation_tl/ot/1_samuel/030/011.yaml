base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/011.yaml
  text: They found an Egyptian man in the field and brought him to David[a]. They gave him bread, and he ate[c][b], and they gave him water to drink.
translation:
  language: tl
  text: Nakakita sila ng isang lalaking Ehipcio sa bukid at dinala nila siya kay David. Binigyan nila siya ng tinapay, at kumain siya, at pinainom nila siya ng tubig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: May nakita sila
  rationale: Likas na salaysay sa Filipino para sa wayyiqtol; malinaw nitong ipinahahayag ang pagkakatagpo nang hindi kailangang ulitin ang bawat pang-ugnay na וַ.
- source_word: אִישׁ מִצְרִי
  choice: isang lalaking Ehipcio
  rationale: Pinananatili ang tahasang אִישׁ ('lalaki') at ang pagkakakilanlang מִצְרִי ('Ehipcio').
- source_word: בַּשָּׂדֶה
  choice: sa parang
  rationale: Sa kontekstong ito, natural na katumbas ng שָׂדֶה ang 'parang,' isang bukas na lupain; hindi ipinapalagay na taniman ang lugar.
- source_word: וַיִּקְחוּ אֹתוֹ אֶל דָּוִד
  choice: at dinala nila siya kay David
  rationale: Ang לקח na may tao at patutunguhan ay likas na isinasaling 'dinala' sa Filipino.
- source_word: וַיִּתְּנוּ לוֹ לֶחֶם
  choice: Binigyan nila siya ng tinapay
  rationale: Pinananatili ang tiyak na kahulugang 'tinapay' ng לֶחֶם sa halip na palawakin bilang pangkalahatang pagkain.
- source_word: וַיֹּאכַל
  choice: at kumain siya
  rationale: Walang tahasang layon ang pandiwa sa Hebreo, kaya hindi rin ito dinagdagan sa salin.
- source_word: וַיַּשְׁקֻהוּ מָיִם
  choice: pinainom din nila siya ng tubig
  rationale: Ang Hiphil ng שׁקה ay causative, 'painumin/give drink'; idiomatiko at tumpak sa Filipino ang 'pinainom ... ng tubig.'
theological_decisions: []
translation_notes:
  register: Makabagong, dignified, at madaling maunawaang Filipino. Ginamit ang 'Ehipcio' bilang karaniwang katawagan sa Bibliyang Filipino at 'parang' para sa bukas na lupain. Ang semicolon ay naghihiwalay sa pagpapakain at pagpapainom habang pinananatili ang mabilis na daloy ng salaysay.
