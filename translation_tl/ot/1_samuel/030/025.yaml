  source_fidelity: Ang draft ay wastong kumikilala kay David bilang paksa at sa naunang kaugalian bilang tinutukoy ng panghalip. Gayunman, hindi ganap na naipapahayag ng “mula sa araw na iyon” ang וָמָעְלָה (“at magmula noon/onward”). Ang binagong teksto ay malinaw na isinasaad ang patuloy na kalakaran mula sa araw na iyon, habang pinananatili ang pananaw ng tagapagsalaysay sa “hanggang sa araw na ito.”
  naturalness: Hindi gaanong likas ang “At gayon nga mula sa araw na iyon,” sapagkat bitin ang konstruksiyon at hindi malinaw ang saklaw ng pagpapatuloy. Ang “Mula nang araw na iyon, naging ganito ang kalakaran” ay makabago, marangal, at natural na Tagalog.
  terminology: Ang “tuntunin at batas” ay nauunawaan, ngunit ang “tuntunin at kautusan” ay mas maayos na naghihiwalay sa dalawang magkatambal na terminong normatibo nang hindi ipinipilit na ang מִשְׁפָּט ay eksaktong “batas.” Sa talababa, ang “hatol” ay leksikal na posible ngunit maaaring magmukhang isang tiyak na hukom na pasiya; “pasiya” ay mas natural na Filipino para sa alternatibong saklaw ng משפט.
  issues:
