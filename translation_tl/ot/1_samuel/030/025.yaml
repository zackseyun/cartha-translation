  text: 'And it was so from that day onward: he made it a statute and an ordinance for Israel to this day[a].'
translation:
  language: tl
  text: 'Mula nang araw na iyon, naging ganito ang kalakaran: ginawa niya itong tuntunin at kautusan para sa Israel hanggang sa araw na ito.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itinakda niya ito bilang tuntunin at pasiya para sa Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At gayon nga
  rationale: Ipinahahayag ng idyoma ang naging resulta at ang pagpapatuloy ng kaayusang inilalarawan, hindi lamang ang paglitaw ng isang pangyayari.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: mula sa araw na iyon
  rationale: Likas itong pahayag sa makabagong Tagalog para sa isang kalagayang nagsimula sa takdang araw at nagpatuloy; nililinaw rin ng hulíng pariralang “hanggang sa araw na ito” ang nagpapatuloy na saklaw.
- source_word: וַיְשִׂמֶהָ
  choice: ginawa niya itong
  rationale: Ang שׂים ay maaaring mangahulugang maglagay, magtakda, o gumawa. Dito, ang pambabaeng hulapi ay tumutukoy sa naunang kaugaliang itinakda ni David bilang pamantayan.
- source_word: לְחֹק
  choice: tuntunin
  rationale: Ang חֹק ay isang itinakda at may-bisang alituntunin; malinaw at dignidadong katumbas sa karaniwang makabagong Tagalog ang “tuntunin.”
- source_word: וּלְמִשְׁפָּט
  choice: at batas
  rationale: Malawak ang saklaw ng מִשְׁפָּט—hatol, pasiya, katarungan, o legal na pamantayan. Kasabay ng חֹק, tumutukoy ito rito sa isang may-bisang kaayusang legal o kaugalian.
- source_word: לְיִשְׂרָאֵל
  choice: para sa Israel
  rationale: Pinananatili ng “para sa” ang gamit ng ל bilang pagtukoy sa bayang saklaw ng tuntunin.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Karaniwang idyomang Hebreo ito na nagsasabing nanatili ang kaugalian hanggang sa panahon ng tagapagsalaysay.
theological_decisions:
- issue: Saklaw ng מִשְׁפָּט sa legal na konteksto
  choice: batas
  alternative: hatol
  rationale: Sa pagkakatambal nito sa חֹק at sa konteksto ng patuloy na pamantayan para sa Israel, mas likas ang legal at normatibong diwang “batas”; inilalagay sa talababa ang mas literal na posibilidad na “hatol” upang mapanatili ang leksikal na lawak.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “At gayon nga” upang maipakita ang resultang naging kalakaran, at iniwasan ang labis na legalistikong bokabularyo habang pinananatili ang pormal na bigat ng talata.
