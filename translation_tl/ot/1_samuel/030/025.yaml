    issue: Hindi naisasalin ang “onward” sa temporal na parirala.
    rationale: Ang מֵהַיּוֹם הַהוּא וָמָעְלָה ay hindi lamang “mula sa araw na iyon” kundi nagsasaad ng pagpapatuloy mula noon.
  - severity: medium
    issue: Hindi likas at di-ganap ang pambungad na “At gayon nga mula sa araw na iyon.”
    rationale: Kailangan ng isang buong konstruksiyon na magpapahayag na ito ang naging nagpapatuloy na kalakaran.
  - severity: low
    issue: Ang talababa na “hatol” ay maaaring maling maunawaan bilang hatol sa isang kaso.
    rationale: Bagaman leksikal na posible ang “hatol,” mas natural ang “pasiya” bilang alternatibong normatibong kahulugan sa Filipino.
