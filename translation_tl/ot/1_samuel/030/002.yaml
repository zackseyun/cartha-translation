  yaml_path: translation/ot/1_samuel/030/002.yaml
  text: They took captive the women who were in it[a], from small to great. They did not kill anyone, but led them away and went on their way.
translation:
  language: tl
  text: Binihag nila ang mga babaeng naroon, mula sa maliit hanggang sa malaki.[a] Wala silang pinatay na sinuman; dinala nila ang mga bihag at nagpatuloy sa kanilang paglalakbay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa bata hanggang sa matanda.” Ang idyomang Hebreo na “mula sa maliit hanggang sa malaki” ay maaaring tumukoy sa lahat nang walang itinatangi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: Binihag nila
  rationale: Tuwirang ipinahahayag ng pandiwang שׁבה ang pagbihag sa mga tao sa digmaan; likas at malinaw sa modernong Tagalog ang “binihag.”
- source_word: הַנָּשִׁים
  choice: ang mga babae
  rationale: Ang payak na kahulugan ay “mga babae,” hindi lamang “mga asawa,” kaya hindi nililimitahan ang tinutukoy.
- source_word: אֲשֶׁר בָּהּ
  choice: naroon
  rationale: Ang panghalip na pambabaeng isahan ay tumutukoy sa Ziklag na nabanggit sa naunang talata. Likas sa Tagalog ang “naroon” at hindi na kailangang ulitin ang “lungsod.”
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: mula sa maliit hanggang sa malaki
  rationale: Pinananatili nito ang sadyang malawak na idyomang Hebreo, na maaaring tumukoy sa edad, katayuan, o kabuuang saklaw, sa halip na paliitin agad sa “bata hanggang matanda.”
- source_word: לֹא הֵמִיתוּ אִישׁ
  choice: Wala silang pinatay na sinuman
  rationale: Ang אִישׁ ay ginagamit dito bilang di-tiyak na indibidwal at hindi lamang bilang lalaking nasa hustong gulang; malinaw itong naihahatid ng “sinuman.”
- source_word: וַיִּנְהֲגוּ
  choice: dinala nila ang mga bihag
  rationale: Maaaring mangahulugang “itaboy” o “akayin/dalhin.” Nililinaw ng “dinala nila ang mga bihag” ang ipinahiwatig na layon at ang sapilitang pag-alis nang hindi nagdaragdag ng di-tiyak na paraan.
- source_word: וַיֵּלְכוּ לְדַרְכָּם
  choice: nagpatuloy sa kanilang paglalakbay
  rationale: Likas na katumbas ito sa Tagalog ng idyomang nangangahulugang umalis sila at nagpatuloy sa kanilang patutunguhan.
