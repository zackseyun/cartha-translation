source:
  edition: WLC
  text: וְ/אַתֶּ֨ם הַ/יּ֜וֹם מְאַסְתֶּ֣ם אֶת אֱלֹהֵי/כֶ֗ם אֲשֶׁר ה֣וּא מוֹשִׁ֣יעַ לָ/כֶם֮ מִ/כָּל רָעוֹתֵי/כֶ֣ם וְ/צָרֹֽתֵי/כֶם֒ וַ/תֹּ֣אמְרוּ ל֔/וֹ כִּי מֶ֖לֶךְ תָּשִׂ֣ים עָלֵ֑י/נוּ וְ/עַתָּ֗ה הִֽתְיַצְּבוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/שִׁבְטֵי/כֶ֖ם וּ/לְ/אַלְפֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/019.yaml
  text: But today you have rejected your God[a], who himself saves you from all your calamities and distresses, and you have said to him, ‘No[b], but set a king over us.’ So now present yourselves before Yahweh by your tribes and by your thousands.
translation:
  language: tl
  text: Ngunit ngayon ay itinakwil ninyo ang inyong Diyos, na siyang nagliligtas sa inyo mula sa lahat ng inyong kapahamakan at paghihirap.[a] Sinabi ninyo sa kanya, “Hindi, kundi magtalaga ka ng hari para mamuno sa amin.”[b] Kaya ngayon, humarap kayo kay Yahweh ayon sa inyong mga lipi at mga libu-libo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga salitang Hebreo ay maaari ring isaling “mula sa lahat ng kasamaang sinapit ninyo at mga kagipitan.” Tumutukoy ang mga ito sa kapahamakan, problema, o pagdurusang dinaranas.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin nang mas payak: “Sinabi ninyo sa kanya, ‘Magtalaga ka ng hari para mamuno sa amin.’” Maaaring mariing panalungat ang כִּי rito, ngunit maaari rin nitong ipakilala lamang ang nilalaman ng sinabi nila.'
    reason: source_ambiguity
  - marker: c
    text: Ang “mga libu-libo” ay maaari ring isaling “mga angkan” o “mga pangkat na tig-iisang libo.” Ang salitang Hebreo ay maaaring tumukoy sa panlipunan o panghukbong mga yunit, hindi lamang sa literal na bilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַסְתֶּם
  choice: itinakwil ninyo
  rationale: Ang מָאַס ay tumutukoy sa pagtanggi o pagtatakwil. Ang “itinakwil” ay natural sa Filipino at pinananatili ang bigat ng sadyang pagtanggi sa Diyos.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman anyong maramihan ang אֱלֹהִים, ang konteksto at isahang panghalip na kasunod nito ay malinaw na tumutukoy sa iisang Diyos ng Israel.
- source_word: מוֹשִׁיעַ
  choice: na siyang nagliligtas
  rationale: Ang participle ay nagpapahayag ng katangian o patuloy na gawain ng Diyos. Ipinakikita ng “na siyang nagliligtas” ang diin ng הוּא at ang palagian niyang pagliligtas.
- source_word: מִכָּל רָעוֹתֵיכֶם וְצָרֹתֵיכֶם
  choice: mula sa lahat ng inyong kapahamakan at paghihirap
  rationale: Sa kontekstong ito, ang רָעוֹת ay mga kasamaang dinaranas o kapahamakan, samantalang ang צָרוֹת ay mga kagipitan o paghihirap. Pinananatili ng dalawang salitang Filipino ang magkaugnay ngunit hindi ganap na magkaparehong diwa.
- source_word: כִּי
  choice: Hindi! Sa halip,
  rationale: Sa tuwirang pananalitang ito, maaaring magpahiwatig ang כִּי ng mariing pagsalungat sa naunang katotohanan na Diyos ang kanilang tagapagligtas. Inilalantad ng salin ang puwersang iyon, habang itinatala sa talababa ang mas payak na pagbasa.
- source_word: תָּשִׂים עָלֵינוּ
  choice: magtalaga ka ng hari na mamumuno sa amin
  rationale: Ang שׂוּם ay maaaring mangahulugang maglagay o magtalaga. Ginagawang natural ng “na mamumuno sa amin” ang literal na עָלֵינוּ, “sa ibabaw namin,” nang hindi binabago ang kahulugan.
- source_word: הִתְיַצְּבוּ
  choice: humarap kayo
  rationale: Ang hitpael ay nag-uutos na pormal silang pumuwesto o magpakita sa harap ni Yahweh. Ang “humarap kayo” ay malinaw at natural sa tagpong ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: לְשִׁבְטֵיכֶם
  choice: ayon sa inyong mga lipi
  rationale: Ang לְ ay nagpapakita rito ng pagsasaayos ayon sa pangkat; malinaw itong naihahayag ng “ayon sa inyong mga lipi.”
- source_word: וּלְאַלְפֵיכֶם
  choice: at mga libu-libo
  rationale: Pinananatili ng “mga libu-libo” ang lantad na anyo ng אֲלָפִים, habang ipinababatid sa talababa na maaari itong tumukoy sa mga angkan o yunit at hindi lamang sa eksaktong bilang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Puwersa ng כִּי sa siniping kahilingan ng bayan
  choice: “Hindi! Sa halip, magtalaga ka…”
  alternative: “Magtalaga ka ng hari…” / “Tunay na magtalaga ka…”
  rationale: Sa konteksto ng pagsaway, may makatuwirang adversative at mariing puwersa ang pahayag. Gayunman, hindi ganap na tiyak ang tungkulin ng כִּי, kaya inilalahad sa talababa ang mas payak na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “itinakwil,” “magtalaga,” at “humarap” upang mapanatili ang bigat at pormal na tono ng pagsaway at pagtitipon, habang iniwasan ang lipas o labis na teknikal na pananalita.
