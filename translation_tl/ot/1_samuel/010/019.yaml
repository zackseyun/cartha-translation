  source_fidelity: Tumpak sa kabuuan ang pagsasalin ng pagtatakwil sa Diyos, ng kanyang patuloy na pagliligtas, at ng pormal na pagpapaharap sa bayan kay Yahweh. Gayunman, ang “Sa halip” ay mas malayang pagpapaliwanag kaysa kinakailangan para sa כִּי. Ang “ng hari na mamumuno sa amin” ay nagpapahayag nang wasto sa עָלֵינוּ ngunit maaaring gawing mas tuwiran bilang “hari para mamuno sa amin.”
  naturalness: Makabago at marangal ang rehistro. Mas natural at mas tuwiran ang “Hindi, kundi magtalaga ka ng hari para mamuno sa amin” kaysa “Hindi! Sa halip, magtalaga ka ng hari na mamumuno sa amin.”
  terminology: Ang “Diyos,” “Yahweh,” “itinakwil,” “mga lipi,” at “mga libu-libo” ay angkop. Kailangang linawin ang talababa c upang hindi ipahiwatig na ang “mga lipi” mismo ay alternatibo ng אֶלֶף; ang alternatibo ng huling salita ay “mga angkan” o mga yunit na tig-iisang libo.
