id: 1SA.10.1
reference: 1 Samuel 10:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת פַּ֥ךְ הַ/שֶּׁ֛מֶן וַ/יִּצֹ֥ק עַל רֹאשׁ֖/וֹ וַ/יִּשָּׁקֵ֑/הוּ וַ/יֹּ֕אמֶר הֲ/ל֗וֹא כִּֽי מְשָׁחֲ/ךָ֧ יְהוָ֛ה עַל נַחֲלָת֖/וֹ לְ/נָגִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/001.yaml
  text: Then Samuel took the flask of oil and poured it on his head and kissed him[a], and said, “Has not Yahweh anointed you as ruler over his inheritance?”
translation:
  language: tl
  text: Pagkatapos, kinuha ni Samuel ang sisidlan ng langis, ibinuhos iyon sa ulo ni Saul, at hinalikan siya. Sinabi niya, “Hindi ba’t pinahiran ka ni Yahweh bilang pinuno[a] ng kanyang mana?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tagapamahala” o “prinsipe.” Ang salitang Hebreo ay tumutukoy sa isang itinalagang mamahala at hindi lubos na kapareho ng mas tiyak na titulong “hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּךְ הַשֶּׁמֶן
  choice: sisidlan ng langis
  rationale: Ang פַּךְ ay isang maliit na lalagyan. Likas at malinaw sa modernong Tagalog ang “sisidlan,” nang hindi ipinapalagay kung bote, banga, o prasko ang tiyak na hugis nito.
- source_word: וַיִּצֹק עַל רֹאשׁוֹ
  choice: ibinuhos iyon sa ulo ni Saul
  rationale: Tuwirang ipinapahayag ng יצק ang pagbuhos. Ginamit ang pangalang “Saul” bilang likas na paglilinaw sa Tagalog ng tinutukoy ng panlalaking panghalip sa Hebreo.
- source_word: וַיִּשָּׁקֵהוּ
  choice: hinalikan siya
  rationale: Tahasang nangangahulugang “humalik” ang pandiwa rito; pinananatili ang kilos bilang bahagi ng tagpo ng pagpapahid at pagtatalaga.
- source_word: הֲלוֹא כִּי
  choice: Hindi ba’t
  rationale: Pinananatili nito ang anyong retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: מְשָׁחֲךָ
  choice: pinahiran ka
  rationale: Ang משׁח ang karaniwang salitang Hebreo para sa ritwal na pagpapahid at pagtatalaga; pinananatili ng “pinahiran” ang parehong pisikal at pampamahalaang diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: נַחֲלָתוֹ
  choice: kanyang mana
  rationale: Pinananatili ng “mana” ang larawan ng נַחֲלָה bilang minana o itinakdang pag-aari at ang diwang tipan na ang Israel ay kay Yahweh.
- source_word: לְנָגִיד
  choice: bilang pinuno
  rationale: Ipinahihiwatig ng נָגִיד ang isang itinalagang mamahala. Ang “pinuno” ay natural sa Tagalog at hindi agad ipinapantay ang katungkulan sa mas tiyak na titulong “hari.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Kahulugan ng נָגִיד sa pagtatalaga kay Saul
  choice: pinuno
  alternative: tagapamahala; prinsipe; hari
  rationale: Ipinapakita ng talata ang pagtatalaga kay Saul na mamahala, ngunit hindi ginagamit dito ang mas tahasang salitang Hebreo para sa “hari.” Pinananatili ng “pinuno” ang saklaw na iyon nang hindi inuunahan ang kasunod na pampublikong pagkilala sa kanya bilang hari.
- issue: Paglalarawan sa Israel bilang נַחֲלָתוֹ ni Yahweh
  choice: kanyang mana
  alternative: kanyang bayan; kanyang pag-aari
  rationale: 'Pinananatili ang metaporang covenantal ng orihinal: ang bayang pamamahalaan ni Saul ay inilalarawan bilang mana ni Yahweh, hindi bilang pag-aari ni Saul.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Hindi ba’t” upang mapanatili ang retorikal na tanong, at “bilang pinuno” para sa likas na daloy. Inilagay ang talababa sa mismong salitang “pinuno,” na siyang tinatalakay nito.
