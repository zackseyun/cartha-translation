base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/009.yaml
  text: And it happened[a], when he turned his back to go from Samuel, that God gave him another heart[b], and all these signs came to pass on that day.
translation:
  language: tl
  text: At nang tumalikod siya upang umalis kay Samuel[a], ginawa ng Diyos na iba ang kanyang puso[b], at nangyari ang lahat ng tandang ito nang araw ding iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “ipinihit niya ang kanyang balikat,” isang idyoma para sa pagtalikod at pag-alis.
    reason: lexical_alternative
  - marker: b
    text: O, “binigyan siya ng Diyos ng ibang puso.” Ang pandiwang Hebreo ay maaaring mangahulugang “binago” o “ginawa na iba.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: At nang
  rationale: Ipinapahayag nito ang pag-usad ng salaysay at ang kasunod na pangyayari nang natural sa makabagong Tagalog, nang hindi gumagamit ng mabigat na pormulang “at nangyari.”
- source_word: כְּהַפְנֹתוֹ שִׁכְמוֹ
  choice: nang tumalikod siya
  rationale: Literal na “nang ipihit niya ang kanyang balikat,” ngunit isa itong idyoma ng pagtalikod o pag-alis. Ang “tumalikod” ay natural at malinaw, habang inilalahad sa talababa ang literal na larawan.
- source_word: לָלֶכֶת מֵעִם שְׁמוּאֵל
  choice: upang umalis kay Samuel
  rationale: Likas na Tagalog para sa paglayo o pag-alis mula sa piling ni Samuel.
- source_word: וַיַּהֲפָךְ ... לֵב אַחֵר
  choice: binigyan siya ... ng ibang puso
  rationale: Ipinahahayag nang natural ang bunga ng pandiwang “binaligtad/binago” kasama ng “ibang puso.” Pinananatili ang “ibang puso” upang hindi ito gawing “bagong puso,” na maaaring magpasok ng mas tiyak na doktrinal na pakahulugan.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang anyo ay tumutukoy rito sa Diyos ng Israel at kaagapay ng pandiwang nasa isahan.
- source_word: וַיָּבֹאוּ
  choice: nangyari
  rationale: Sa mga tanda bilang simuno, ipinahahayag nito na naganap ang mga ito. Iniiwasan ang “natupad,” na maaaring magdagdag ng interpretasyong higit sa payak na pandiwa.
- source_word: כָּל הָאֹתוֹת הָאֵלֶּה
  choice: lahat ng tandang ito
  rationale: Tuwirang tumutukoy sa mga tandang kasasabi lamang ni Samuel.
- source_word: בַּיּוֹם הַהוּא
  choice: Nang araw ding iyon
  rationale: Natural na pahayag sa Tagalog na nagpapanatili sa tiyak at agarang panahong tinutukoy ng Hebreo.
theological_decisions:
- issue: Ang kalikasan ng pagbabagong ipinahayag ng “ibang puso”
  choice: Panatilihin ang “binigyan siya ng Diyos ng ibang puso” nang hindi tinutukoy kung ito ay muling kapanganakan, pagbabagong-loob, o tapang lamang para sa pagiging hari.
  alternative: “Binago ng Diyos ang kanyang pagkatao” o “binigyan siya ng Diyos ng bagong puso.”
  rationale: Nagsasaad ang Hebreo ng tunay na pagkilos ng Diyos sa panloob na kalagayan ni Saul, ngunit hindi nito tahasang nililinaw ang eksaktong doktrinal o sikolohikal na uri ng pagbabagong iyon. Pinananatili ng “ibang puso” ang tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tumalikod” bilang likas na katumbas ng idyomang Hebreo at pinanatili ang “ibang puso” upang huwag paliitin o palawakin ang teolohikal na kahulugan.
