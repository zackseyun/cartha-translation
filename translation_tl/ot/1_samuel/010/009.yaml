  naturalness: Natural at marangal sa makabagong Filipino ang isang pangungusap na may “At nang …, …, at ….” Mas maayos ito kaysa hatiing “Nang araw ding iyon” bilang panibagong pangungusap, na medyo putol ang daloy ng salaysay.
  terminology: Ang “Diyos,” “Samuel,” “puso,” at “mga tandang ito” ay angkop. Ang “tanda” ay tumutukoy nang wasto sa mga palatandaang inihula ni Samuel. Ang talababa b sa draft ay kailangang itama sapagkat ang “binaligtad” ay hindi angkop na literal na paglalarawan sa pandiwang Hebreo rito, at ang iminungkahing pananalita ay hindi likas.
