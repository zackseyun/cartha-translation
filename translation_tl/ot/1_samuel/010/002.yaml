  text: בְּ/לֶכְתְּ/ךָ֤ הַ/יּוֹם֙ מֵ/עִמָּדִ֔/י וּ/מָצָאתָ֩ שְׁנֵ֨י אֲנָשִׁ֜ים עִם קְבֻרַ֥ת רָחֵ֛ל בִּ/גְב֥וּל בִּנְיָמִ֖ן בְּ/צֶלְצַ֑ח וְ/אָמְר֣וּ אֵלֶ֗י/ךָ נִמְצְא֤וּ הָ/אֲתֹנוֹת֙ אֲשֶׁ֣ר הָלַ֣כְתָּ לְ/בַקֵּ֔שׁ וְ/הִנֵּ֨ה נָטַ֤שׁ אָבִ֨י/ךָ֙ אֶת דִּבְרֵ֣י הָ/אֲתֹנ֔וֹת וְ/דָאַ֤ג לָ/כֶם֙ לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לִ/בְנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/002.yaml
  text: When you leave me today[a], you will find two men near Rachel’s tomb in the territory of Benjamin at Zelzah, and they will say to you, ‘The donkeys that you went to look for have been found, and look, your father has stopped caring about the donkeys and is anxious about you, saying[c][b], “What shall I do about my son?”’
translation:
  language: tl
  text: Pagkaalis mo sa akin ngayon, makakatagpo ka ng dalawang lalaki malapit sa libingan ni Raquel, sa hangganan[a] ng Benjamin, sa Zelzah. Sasabihin nila sa iyo, ‘Natagpuan na ang mga asnong hinanap mo. Hindi na nababahala ang iyong ama sa mga asno, kundi nag-aalala siya sa inyong dalawa[c], at sinasabi niya, “Ano ang gagawin ko tungkol sa anak ko?”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa nasasakupan ng Benjamin.” Ang salitang Hebreo ay maaaring mangahulugang “hangganan” o “nasasakupan.”
    reason: lexical_alternative
  - marker: c
    text: Pangmaramihan ang panlapi sa “inyong dalawa” sa Hebreo, malamang na tumutukoy kay Saul at sa lingkod na kasama niya.
    reason: grammatical_clarification
lexical_decisions:
- source_word: בְּלֶכְתְּךָ הַיּוֹם מֵעִמָּדִי
  choice: Sa pag-alis mo sa akin ngayon
  rationale: Ang ב na may infinitive construct ay bumubuo ng sugnay na panahunan; natural sa modernong Tagalog ang “sa pag-alis mo” at napapanatili ang paglayo mula sa piling ni Samuel.
- source_word: וּמָצָאתָ
  choice: makakatagpo ka
  rationale: Ang anyo ay bahagi ng prediksiyon ni Samuel. Ang “makakatagpo” ay natural para sa di-sinasadyang pagkakita sa mga taong sasalubong kay Saul.
- source_word: עִם קְבֻרַת רָחֵל
  choice: malapit sa libingan ni Raquel
  rationale: Lokasyonal ang gamit ng עִם dito, kaya ang “malapit sa” ay malinaw; ang “libingan” ay angkop sa kilalang pook na pinaglibingan.
- source_word: בִּגְבוּל בִּנְיָמִן
  choice: sa hangganan ng Benjamin
  rationale: Maaaring mangahulugan ang גְּבוּל ng hangganan o nasasakupan. Pinili ang “hangganan” upang mapanatili ang partikular na lokasyonal na diwa, habang inilalagay sa talababa ang alternatibo.
- source_word: נִמְצְאוּ הָאֲתֹנוֹת אֲשֶׁר הָלַכְתָּ לְבַקֵּשׁ
  choice: Natagpuan na ang mga asnong hinahanap mo
  rationale: Ang “natagpuan na” ay naghahayag ng natapos na paghahanap at kasalukuyang resulta. Hindi kailangang tahasang sabihing mga babaeng asno sapagkat hindi mahalaga rito ang kasarian ng hayop.
- source_word: נָטַשׁ אָבִיךָ אֶת דִּבְרֵי הָאֲתֹנוֹת
  choice: Iniwan na ng iyong ama ang usapin tungkol sa mga asno
  rationale: Malapit ito sa literal na “iniwan ang bagay/usapin ng mga asno” at iniiwasang ipahiwatig na nawalan siya ng malasakit sa mga hayop.
- source_word: וְדָאַג לָכֶם
  choice: at nag-aalala na siya sa inyong dalawa
  rationale: Ang לָכֶם ay pangmaramihan at malamang na tumutukoy kay Saul at sa kasama niyang lingkod. Tahasang minarkahan ito sa Tagalog upang hindi mawala ang bilang.
- source_word: מָה אֶעֱשֶׂה לִבְנִי
  choice: Ano ang gagawin ko tungkol sa anak ko?
  rationale: Ang לְ ay nagpapahayag ng paksa o kaugnayan dito; natural ang “tungkol sa anak ko” at pinananatili ang balisang tanong ng ama.
