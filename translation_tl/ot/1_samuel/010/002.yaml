translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “Raquel,” “Benjamin,” at “Zelza” bilang karaniwang anyong Filipino ng mga pangalang pantangi. Iniwasan ang labis na kolokyal at ang arkaikong pananalita; pinanatili sa mga talababa ang tunay na leksikal na kalabuan.
