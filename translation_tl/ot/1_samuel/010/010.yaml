source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ שָׁם֙ הַ/גִּבְעָ֔תָ/ה וְ/הִנֵּ֥ה חֶֽבֶל נְבִאִ֖ים לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֤ח עָלָי/ו֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּתְנַבֵּ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/010.yaml
  text: When they came there to the hill[a], behold, a band of prophets came to meet him, and the Spirit of God rushed upon him, and he prophesied among them.
translation:
  language: tl
  text: Nang makarating sila roon sa burol[a], narito, isang pangkat ng mga propeta ang sumalubong sa kanya. Sumakanya nang may kapangyarihan ang Espiritu ng Diyos, at nagpropesiya siya kasama nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Gibea.” Maaaring basahin ang anyong Hebreo bilang pangalan ng lugar o bilang “sa burol.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּבְעָתָה
  choice: sa burol
  rationale: May hulaping paturol ang anyo at maaari itong tumukoy sa karaniwang pangngalang “burol” o sa pangalang-lugar na “Gibea.” Pinili ang “sa burol” dahil may pantukoy ang Hebreo at tumutugma ito sa burol na nabanggit sa konteksto; inilagay sa talababa ang tunay na alternatibo.
- source_word: חֶבֶל נְבִאִים
  choice: isang pangkat ng mga propeta
  rationale: Ang חֶבֶל ay tumutukoy rito sa isang pangkat o samahan, hindi sa literal na lubid. Natural at malinaw sa modernong Filipino ang “pangkat.”
- source_word: לִקְרָאתוֹ
  choice: sumalubong sa kanya
  rationale: Ipinapahayag ng parirala ang paglapit upang salubungin o katagpuin si Saul; maikli at likas sa Filipino ang “sumalubong sa kanya.”
- source_word: וְהִנֵּה
  choice: naroon
  rationale: Itinatampok ng הִנֵּה ang biglang napansing tagpo. Ang “naroon” ay natural na salaysay sa Filipino at naipapakita ang paglitaw ng pangkat nang hindi gumagamit ng lipas na ekspresyon.
- source_word: רוּחַ אֱלֹהִים
  choice: ang Espiritu ng Diyos
  rationale: Sa konteksto ng tanda at kapangyarihang mula sa Diyos, pinakamalamang na tumutukoy ito sa Espiritu ng Diyos. Hindi nito dinaragdagan ang teksto ng mas huling sistematikong paglilinaw.
- source_word: וַתִּצְלַח עָלָיו
  choice: Makapangyarihang dumating sa kanya
  rationale: Kapag kaugnay ng רוּחַ sa Samuel, ang צלח על ay nagsasaad ng biglaan at makapangyarihang pagdating para bigyan ng kakayahan. Pinananatili ng salin ang lakas ng pandiwa sa natural na Filipino.
- source_word: וַיִּתְנַבֵּא
  choice: nagpahayag siya bilang propeta
  rationale: Ang hitpael ng נבא ay tumutukoy sa pagsasagawa ng gawaing propetiko. Mas malinaw sa ordinaryong Filipino ang “nagpahayag bilang propeta” kaysa sa teknikal o di-karaniwang “nagpropesiya,” habang hindi tinutukoy nang labis ang anyo ng pagpapahayag.
- source_word: בְּתוֹכָם
  choice: kasama nila
  rationale: Ipinakikita nitong nakibahagi si Saul sa gawaing propetiko sa gitna ng pangkat. Natural sa Filipino ang “kasama nila.”
theological_decisions:
- issue: Pagpapakahulugan sa רוּחַ אֱלֹהִים
  choice: ang Espiritu ng Diyos
  alternative: isang espiritung mula sa Diyos
  rationale: Ang konteksto ay tanda at pagkakaloob ng kapangyarihan kay Saul mula sa Diyos, kaya pinakamalamang na ang sariling Espiritu ng Diyos ang tinutukoy. Pinananatili nito ang bigat na teolohikal ng salaysay nang hindi nagpapasok ng denominasyonal na paliwanag.
- issue: Uri ng propetikong gawain sa וַיִּתְנַבֵּא
  choice: nagpahayag siya bilang propeta
  alternative: kumilos siya na gaya ng isang propeta
  rationale: Hindi nililinaw ng teksto kung ang gawain ay tiyak na pagsasalita, pag-awit, o ibang anyo ng propetikong pagpapahayag. Ang napiling salin ay sapat na malawak upang mapanatili ang hindi pagkakatiyak na iyon.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Iniwasan ang lipas na “masdan” at ang di-gaanong likas na “nagpropesiya,” ngunit pinanatili ang biglaan at makapangyarihang kilos ng Espiritu at ang tunay na kalabuan sa pangalan ng lugar.
