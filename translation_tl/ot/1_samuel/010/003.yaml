  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang pagpapatuloy mula sa naunang lugar, pagdating sa puno ng Tabor, pagtatagpo sa tatlong lalaki, at ang kani-kanilang tatlong batang kambing, tatlong tinapay, at sisidlang-balat na may alak. Ang “umaahon patungo sa Diyos sa Bethel” ay maingat na pinananatili ang relihiyosong direksiyon nang hindi nagdaragdag ng tahasang pagsamba o handog.'
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Maayos ang daloy ng pangungusap at ang paghahanay ng tatlong lalaki at mga dala nila. Ang “sisidlang-balat na may alak” ay madaling maunawaan at angkop sa konteksto.
