source:
  edition: WLC
  text: וְ/חָלַפְתָּ֨ מִ/שָּׁ֜ם וָ/הָ֗לְאָה וּ/בָ֨אתָ֙ עַד אֵל֣וֹן תָּב֔וֹר וּ/מְצָא֤וּ/ךָ שָּׁם֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים עֹלִ֥ים אֶל הָ/אֱלֹהִ֖ים בֵּֽית אֵ֑ל אֶחָ֞ד נֹשֵׂ֣א שְׁלֹשָׁ֣ה גְדָיִ֗ים וְ/אֶחָד֙ נֹשֵׂ֗א שְׁלֹ֨שֶׁת֙ כִּכְּר֣וֹת לֶ֔חֶם וְ/אֶחָ֥ד נֹשֵׂ֖א נֵֽבֶל יָֽיִן־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/003.yaml
  text: 'Then you will pass on from there and go farther[a], and you will come to the oak of Tabor. There three men going up to God at Bethel will meet you: one carrying three young goats, another carrying three loaves of bread[c][b], and another carrying a wineskin.'
translation:
  language: tl
  text: Pagkatapos, magpatuloy ka mula roon hanggang sa makarating ka sa malaking puno ng Tabor.[a] Doon ay sasalubungin ka ng tatlong lalaking umaahon patungo sa Diyos sa Bethel.[b] Ang isa ay may dalang tatlong batang kambing, ang isa nama’y tatlong tinapay, at ang isa pa’y isang sisidlang-balat na may alak.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ensina ng Tabor” o “terebinto ng Tabor.” Ang salitang Hebreo ay maaaring tumukoy sa isang malaking puno gaya ng ensina o terebinto.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “umaahon patungo sa Diyos, Bethel.” Malamang na tumutukoy ito sa paglalakbay patungo sa isang pook-sambahan sa Bethel.
    reason: cultural_note
  - marker: c
    text: Sa literal, “isang sisidlang-balat ng alak.” Ang tinutukoy ay sisidlang karaniwang yari sa balat na pinaglalagyan ng alak.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וְחָלַפְתָּ מִשָּׁם וָהָלְאָה
  choice: magpatuloy ka mula roon
  rationale: Ipinahahayag nito ang tuloy-tuloy na paglalakbay mula sa naunang lugar, nang hindi ipinapalagay na basta daraan lamang siya sa tabi nito.
- source_word: אֵלוֹן תָּבוֹר
  choice: malaking puno ng Tabor
  rationale: Maaaring tumukoy ang אֵלוֹן sa ensina o terebinto. Pinananatili ng mas pangkalahatang ‘malaking puno’ ang tunay na leksikal na kalabuan at nililinaw sa talababa ang mga uri ng punong maaaring tinutukoy.
- source_word: וּמְצָאוּךָ
  choice: sasalubungin ka
  rationale: Bagaman pangunahing nangangahulugang ‘matatagpuan ka,’ ang ‘sasalubungin ka’ ay natural sa Filipino para sa naganap na pagtatagpo sa daan.
- source_word: עֹלִים אֶל־הָאֱלֹהִים בֵּית אֵל
  choice: umaahon patungo sa Diyos sa Bethel
  rationale: Malapit ito sa ayos at diwa ng Hebreo at hindi tahasang nagdaragdag ng ‘sumamba,’ bagaman malinaw ang relihiyosong patutunguhan.
- source_word: גְדָיִים
  choice: batang kambing
  rationale: Tiyak at madaling maunawaan sa modernong Filipino ang tawag sa mga inakay ng kambing.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: tinapay
  rationale: Ang bilang na tatlo at ang anyong tinapay ay malinaw sa konteksto; ang payak na ‘tatlong tinapay’ ay natural at hindi nagpapasya nang di-kailangan kung bilog ang hugis.
- source_word: נֵבֶל יָיִן
  choice: isang sisidlang-balat na may alak
  rationale: Ipinakikita nito kapuwa ang sisidlang karaniwang yari sa balat at ang laman nitong alak, nang hindi gumagamit ng di-pamilyar na terminong teknikal.
theological_decisions:
- issue: Kahulugan ng ‘umaahon patungo sa Diyos sa Bethel’
  choice: Pinanatili ang tahasang paglapit sa Diyos kaugnay ng Bethel.
  alternative: umaahon sa Bethel upang sumamba sa Diyos
  rationale: Malamang na paglalakbay ito patungo sa isang pook-sambahan, ngunit hindi tahasang binabanggit ng sugnay ang pagsamba o paghahandog. Kaya hindi idinagdag ang ritwal na detalye sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘nama’y’ para sa maayos na paghahanay ng tatlong lalaki at ang kani-kanilang dala. Iniwasan ang sobrang pormal o lumang bokabularyo, habang pinanatili ang hinaharap na anyo ng mga tanda na ibinibigay kay Saul.
