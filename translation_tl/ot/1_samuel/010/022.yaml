base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/022.yaml
  text: So they inquired of Yahweh again[a], “Has the man come here yet?” And Yahweh said, “Behold, he has hidden himself among the baggage.”
translation:
  language: tl
  text: Muli silang sumangguni kay Yahweh, “Dumating na ba rito ang lalaki?” Sinabi ni Yahweh, “Narito, nakatago siya sa gitna ng mga bagahe.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa gitna ng mga kagamitan/mga bagay.” Malawak ang kahulugan ng salita at maaari itong tumukoy sa mga sisidlan, kagamitan, gear, o mga ari-ariang dala. Dito, malamang na tumutukoy ito sa mga bagahe o panustos ng mga nagkatipon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ עוֹד בַּיהוָה
  choice: muli silang sumangguni kay Yahweh
  rationale: Ang שׁאל na may בַּיהוָה ay tumutukoy sa pormal na paghingi ng sagot o patnubay mula sa Diyos, hindi sa karaniwang pagtatanong lamang. Likas sa modernong Filipino ang “sumangguni kay,” at malinaw na ipinahahayag ng “muli” ang pag-uulit.
- source_word: הֲבָא עוֹד הֲלֹם אִישׁ
  choice: Dumating na ba rito ang lalaking iyon?
  rationale: Ang tanong ay kung naganap na ang pagdating. Ginagampanan ng “na ba” ang kahulugan ng ikalawang עוֹד, samantalang ang “rito” ay tumutugma sa direksiyonal na הֲלֹם. Sa konteksto, ang אִישׁ ay ang partikular na lalaking hinahanap, kaya ginamit ang “lalaking iyon.”
- source_word: הִנֵּה הוּא
  choice: Naroon siya!
  rationale: Ang הִנֵּה ay pantawag-pansin at ipinakikitang natukoy na ang kinaroroonan niya. Mas natural at buhay sa Filipino ang “Naroon siya!” kaysa sa literal ngunit makalumang “Masdan.”
- source_word: נֶחְבָּא
  choice: Nagtago siya
  rationale: 'Ang Niphal ng חבא ay may reflexive na diwa sa konteksto: kusang ikinubli ni Saul ang sarili. Ang simpleng “nagtago siya” ang pinakanatural na pagpapahayag nito sa Filipino.'
- source_word: אֶל הַכֵּלִים
  choice: sa gitna ng mga dala-dalahan
  rationale: Malawak ang kahulugan ng כֵּלִים—mga kagamitan, sisidlan, gear, o mga ari-ariang dala. Sa pagtitipong ito, ang “mga dala-dalahan” ay malinaw at natural, habang pinananatili ng talababa ang lawak ng salitang Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan ng Diyos nang hindi ito pinapalitan ng isang titulo.
- issue: Paraan ng sagot ni Yahweh
  choice: Sinabi ni Yahweh
  alternative: Sumagot si Yahweh
  rationale: Bagaman sagot ang tungkulin ng pahayag, ang Hebreo ay gumagamit ng karaniwang pandiwang אמר, “sinabi.” Pinananatili ng salin ang payak na anyong pasalaysay.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sumangguni” upang ipakita ang pormal na pagsangguni sa Diyos, at ang “Naroon siya!” upang natural na maipahayag ang pantawag-pansing הִנֵּה. Inilagay ang talababa pagkatapos ng pariralang tinutukoy nito at pinanatili sa pangunahing teksto ang marker na [a].
