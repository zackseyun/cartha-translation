revisions:
- from: Kaya muli silang sumangguni kay Yahweh, “Dumating na ba rito ang lalaking iyon?” Sinabi ni Yahweh, “Naroon siya! Nagtago siya sa gitna ng mga dala-dalahan.”[a]
  to: Muli silang sumangguni kay Yahweh, “Dumating na ba rito ang lalaki?” Sinabi ni Yahweh, “Narito, nakatago siya sa gitna ng mga bagahe.”[a]
  rationale: Inalis ang hindi kinakailangang “iyon” upang hindi magdagdag ng diin na wala sa Hebreo. Pinalitan ang “Naroon siya! Nagtago siya” ng “Narito, nakatago siya” upang mas malapit na maipakita ang pantawag-pansing הִנֵּה at ang kasalukuyang/statibong paglalarawan ng נֶחְבָּא. Pinalitan din ang “mga dala-dalahan” ng mas likas at malinaw na “mga bagahe,” na sinusuportahan ng talababa.
