  text: וְ/צָלְחָ֤ה עָלֶ֨י/ךָ֙ ר֣וּחַ יְהוָ֔ה וְ/הִתְנַבִּ֖יתָ עִמָּ֑/ם וְ/נֶהְפַּכְתָּ֖ לְ/אִ֥ישׁ אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/006.yaml
  text: Then the Spirit of Yahweh will rush upon you[a], and you will prophesy with them[b], and be turned into another man.
translation:
  language: tl
  text: At darating sa iyo nang buong kapangyarihan ang Espiritu ni Yahweh,[a] at magpopropesiya kang kasama nila, at magiging ibang tao ka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “biglang darating sa iyo nang may kapangyarihan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “magiging ibang lalaki ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָלְחָה עָלֶיךָ
  choice: darating sa iyo nang buong kapangyarihan
  rationale: Sa mga kontekstong Espiritu ni Yahweh ang simuno, ang צלח על ay tumutukoy sa malakas at mabisang pagdating sa isang tao. Likas ito sa makabagong Tagalog at hindi ito ipinakahulugang simpleng pag-unlad o pagtatagumpay.
- source_word: רוּחַ יְהוָה
  choice: ang Espiritu ni Yahweh
  rationale: Ang רוּחַ rito ay Espiritu ng Diyos, hindi hangin o hininga. Pinananatili ang personal na pangalang Yahweh mula sa tekstong Hebreo.
- source_word: וְהִתְנַבִּיתָ
  choice: magpopropesiya ka
  rationale: Ang hitpael ng נבא sa salaysay na ito ay tumutukoy sa pakikibahagi ni Saul sa gawaing propetiko ng pangkat.
- source_word: עִמָּם
  choice: kasama nila
  rationale: Tuwirang ipinahahayag ng עִם ang pakikisama ni Saul sa mga propeta.
- source_word: וְנֶהְפַּכְתָּ לְאִישׁ אַחֵר
  choice: magiging ibang tao ka
  rationale: Natural na inililipat sa Tagalog ang Hebreong idyoma ng pagbabago tungo sa pagiging 'ibang lalaki/tao.' Ang 'tao' ay mas likas sa idyomang Filipino, samantalang inilalagay sa talababa ang mas tahasang panlalaking anyo.
theological_decisions:
- issue: Saklaw at likas ng pagbabago kay Saul
  choice: Panatilihing payak ang pahayag na magiging ibang tao si Saul.
  alternative: Tukuyin ito bilang panloob na muling kapanganakan, permanenteng pagbabagong moral, o panlabas lamang na ekstatikong karanasan.
  rationale: Sinasabi ng Hebreo na magpopropesiya si Saul at magiging ibang tao, ngunit hindi nito nililinaw ang lawak, uri, o pananatili ng pagbabagong iyon. Hindi dapat lutasin ng salin ang usaping teolohikal na hindi nilulutas ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magpopropesiya” bilang karaniwang biblikal na pandiwa at ang “ibang tao” bilang natural na idyoma, habang pinananatili sa talababa ang tahasang panlalaking anyo ng אִישׁ.
