  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בְנֵ֧י בְלִיַּ֣עַל אָמְר֗וּ מַה יֹּשִׁעֵ֨/נוּ֙ זֶ֔ה וַ/יִּבְזֻ֕/הוּ וְ/לֹֽא הֵבִ֥יאוּ ל֖/וֹ מִנְחָ֑ה וַ/יְהִ֖י כְּ/מַחֲרִֽישׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/027.yaml
  text: But worthless men said[a], “How can this man save us?” And they despised him and did not bring him a gift. But he was like one keeping silent.
translation:
  language: tl
  text: Ngunit sinabi ng mga walang-kuwentang tao, “Paano tayo maililigtas ng taong ito?” Hinamak nila siya at hindi sila nagdala sa kanya ng kaloob. Ngunit para siyang hindi umiimik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “para siyang walang narinig.” Maaaring ilarawan ng Hebreong pananalita ang sadyang pananahimik sa harap ng pang-uudyok.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בְלִיַּעַל
  choice: mga walang-kuwentang tao
  rationale: Ang idyoma ay literal na “mga anak ng kawalang-kabuluhan” at tumutukoy sa mga taong masama o walang dangal. Pinananatili ng salin ang matinding negatibong paglalarawan nang hindi gumagamit ng di-likas na literal na anyo.
- source_word: מַה יֹּשִׁיעֵנוּ זֶה
  choice: Paano tayo maililigtas ng taong ito?
  rationale: Ipinahahayag ng tanong ang mapanghamak at mapagdudang paghamon sa kakayahan ni Saul na iligtas sila. Likas sa Tagalog ang aktibong tagaganap sa pariralang “ng taong ito.”
- source_word: וַיִּבְזֻהוּ
  choice: Hinamak nila siya
  rationale: Tuwirang ipinahahayag ng “hinamak” ang pagtingin kay Saul bilang mababa o walang halaga at angkop ito sa maikling estilong pasalaysay.
- source_word: מִנְחָה
  choice: kaloob
  rationale: Sa konteksto ng pagkilala sa isang hari, tumutukoy ito sa regalong inihaharap sa pinuno at hindi kinakailangang handog na panrelihiyon. Hindi rin labis na tinutukoy ng “kaloob” na ito ay pormal na tributo.
- source_word: כְּמַחֲרִישׁ
  choice: para siyang hindi umiimik
  rationale: Pinananatili nito ang paghahambing na ipinahihiwatig ng כְּ at ang pangunahing diwa ng sadyang pananahimik sa harap ng panghahamak. Ang posibilidad na ang parirala ay nangangahulugang nagkunwaring hindi nakarinig ay inilagay sa talababa.
- source_word: וַיְהִי
  choice: siya’y para
  rationale: Sa pariralang “para siyang hindi umiimik,” likas na naisasama sa Tagalog ang pandiwang היה sa paghahambing nang hindi kinakailangang isalin nang hiwalay bilang “siya ay naging.”
theological_decisions:
- issue: Paglalarawan sa tugon ni Saul
  choice: Inilarawan si Saul na parang hindi umiimik sa harap ng panghahamak.
  alternative: Maaaring unawain na kumilos siyang para bang hindi niya narinig ang mga sinabi nila.
  rationale: Maaaring tumukoy ang כְּמַחֲרִישׁ sa pananahimik o sa pagkilos na parang bingi. Pinananatili sa pangunahing teksto ang mas tuwirang diwa ng pananahimik, samantalang kinikilala sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kaloob” sa halip na “handog” upang maiwasan ang di-kinakailangang panrelihiyong kahulugan, at pinanatili ang mapanghamak na himig ng tanong nang hindi dinaragdagan ang teksto.
