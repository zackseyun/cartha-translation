id: 1SA.10.25
reference: 1 Samuel 10:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר שְׁמוּאֵ֜ל אֶל הָ/עָ֗ם אֵ֚ת מִשְׁפַּ֣ט הַ/מְּלֻכָ֔ה וַ/יִּכְתֹּ֣ב בַּ/סֵּ֔פֶר וַ/יַּנַּ֖ח לִ/פְנֵ֣י יְהוָ֑ה וַ/יְשַׁלַּ֧ח שְׁמוּאֵ֛ל אֶת כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/025.yaml
  text: Then Samuel told the people the rights and duties of the kingship[a], and he wrote them in the book and laid it before Yahweh. Then Samuel sent all the people away[b], each man to his house.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Samuel sa bayan ang mga tuntunin ng paghahari[a]. Isinulat niya ang mga iyon sa aklat at inilagay iyon sa harap ni Yahweh. Pagkatapos, pinauwi ni Samuel ang buong bayan—bawat lalaki sa sarili niyang bahay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga karapatan at tungkulin ng paghahari” o “nakaugaliang kaayusan ng paghahari.” Maaaring tumukoy ang pariralang Hebreo sa mga legal na tuntunin o sa itinakdang kaugalian at pamamaraan ng pamamahala ng hari.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “bawat lalaki sa kanyang bahay.” Isa itong pamahaging pahayag na nagsasaad na umuwi ang mga tao sa kani-kanilang sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sinabi
  rationale: Karaniwang salin ito ng pagsasalita sa isang pangkat na may kasunod na nilalaman; natural at malinaw sa modernong Tagalog.
- source_word: מִשְׁפַּט הַמְּלֻכָה
  choice: mga tuntunin ng paghahari
  rationale: Ang מִשְׁפַּט ay maaaring tumukoy sa batas, karapatan, pananagutan, o nakaugaliang kaayusan. Ang “mga tuntunin” ay natural sa Tagalog at hindi gaanong makitid, samantalang ang “paghahari” ay tumutukoy sa institusyon o katungkulan ng hari, hindi sa teritoryo.
- source_word: וַיִּכְתֹּב בַּסֵּפֶר
  choice: Isinulat niya ang mga iyon sa aklat
  rationale: Ang “mga iyon” ay tumutukoy sa mga tuntuning kababanggit pa lamang. Maaaring mangahulugan ang סֵפֶר ng aklat, balumbon, o nakasulat na dokumento; pinananatili ng “aklat” ang malawak at pamilyar na katawagan.
- source_word: וַיַּנַּח לִפְנֵי יְהוָה
  choice: inilagay iyon sa harap ni Yahweh
  rationale: Tapat itong nagpapahayag ng paglalagak o paglalagay ng kasulatan sa presensiya ni Yahweh nang hindi dinaragdagan ang di-tiyak na detalye kung saan o paano ito itinago.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: וַיְשַׁלַּח
  choice: pinauwi
  rationale: Sa konteksto, pinaalis ni Samuel ang bayan upang bumalik sa kani-kanilang bahay; malinaw at natural itong ipinahahayag ng “pinauwi.”
- source_word: אִישׁ לְבֵיתוֹ
  choice: bawat lalaki sa sarili niyang bahay
  rationale: Pinananatili nito ang panlalaking isahang anyong ginamit nang pamahagi sa Hebreo at ang tahasang pagtukoy sa bahay.
theological_decisions:
- issue: Paglalarawan sa מִשְׁפַּט הַמְּלֻכָה
  choice: mga tuntunin ng paghahari
  alternative: mga karapatan at tungkulin ng paghahari; nakaugaliang kaayusan ng paghahari
  rationale: Hindi tiyak kung ang parirala ay pangunahing tumutukoy sa mga legal na karapatan at pananagutan o sa itinakdang pamamaraan at kaugalian ng monarkiya. Gumagamit ang pangunahing teksto ng malawak na salitang “mga tuntunin,” at inilalahad sa talababa ang saklaw ng kahulugan.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Panlalaking pamahaging pahayag na אִישׁ לְבֵיתוֹ
  choice: bawat lalaki sa sarili niyang bahay
  alternative: bawat isa sa sariling tahanan
  rationale: Pinananatili sa pangunahing teksto ang gramatikal na panlalaking anyo ng Hebreo, habang nililinaw sa talababa na isa itong pamahaging pahayag tungkol sa pag-uwi ng mga tao.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “paghahari” para sa institusyon ng pagiging hari, “mga tuntunin” upang mapanatili ang lawak ng מִשְׁפַּט, at “pinauwi” upang natural na ipahayag ang pagpapauwi sa bayan.
