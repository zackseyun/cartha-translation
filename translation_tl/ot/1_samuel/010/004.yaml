  text: They will ask you about your welfare and give you two loaves of bread[c][b][a], and you shall receive them from their hand.
translation:
  language: tl
  text: Kukumustahin ka nila[a] at bibigyan ka nila ng dalawang tinapay[b], at tatanggapin mo ang mga iyon mula sa kanilang kamay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Tatanungin ka nila tungkol sa iyong kapayapaan [o mabuting kalagayan].” Maaari ring isalin na “Babatiin ka nila.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “dalawang tinapay”; tumutukoy ito sa dalawang piraso o buong yunit ng tinapay.'
    reason: lexical_alternative
  - marker: c
    text: O “kukunin mo ang mga iyon mula sa kanilang kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלוּ לְךָ לְשָׁלוֹם
  choice: Kukumustahin ka nila
  rationale: Ang pariralang Hebreo ay literal na pagtatanong tungkol sa kapayapaan o mabuting kalagayan ng isang tao, ngunit likas itong ipinapahayag sa modernong Tagalog bilang pangungumusta.
- source_word: שָׁלוֹם
  choice: kumusta / kalagayan
  rationale: Sa idyomang ito, ang שָׁלוֹם ay tumutukoy sa personal na mabuting kalagayan, hindi lamang sa kawalan ng alitan.
- source_word: וְנָתְנוּ לְךָ
  choice: at bibigyan
  rationale: Ipinagpapatuloy ng anyong pandiwa ang pagkakasunod-sunod ng mga pangyayaring hinuhulaan ni Samuel; natural sa Tagalog ang panghinaharap na “bibigyan.”
- source_word: שְׁתֵּי לֶחֶם
  choice: dalawang tinapay
  rationale: Bagaman literal na “dalawang bread,” ang “dalawang tinapay” ang natural na paraang Tagalog para sa dalawang yunit o bilog ng tinapay nang hindi sapilitang tinutukoy ang tiyak na hugis nito.
- source_word: וְלָקַחְתָּ מִיָּדָם
  choice: at tatanggapin mo ang mga iyon mula sa kanilang kamay
  rationale: Maaaring mangahulugan ang לָקַחְתָּ na “kukunin” o “tatanggapin.” Dahil kusang ibibigay ang tinapay, malinaw at natural ang “tatanggapin,” habang pinananatili ng “mula sa kanilang kamay” ang larawan ng tekstong Hebreo.
- source_word: מִיָּדָם
  choice: mula sa kanilang kamay
  rationale: Pinananatili nito ang Hebreong kolektibong idyoma na literal na “mula sa kamay nila,” na mauunawaan din sa Tagalog.
