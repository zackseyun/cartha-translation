  text: So they ran and took him from there[a], and he stood in the midst of the people. And he was taller than all the people from his shoulders upward.
translation:
  language: tl
  text: Kaya tumakbo sila at kinuha siya mula roon[a]. Tumayo siya sa gitna ng mga tao, at mas matangkad siya kaysa sa lahat ng tao mula sa kanyang mga balikat pataas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinundo siya mula roon.” Karaniwang nangangahulugang “kinuha” ang pandiwang Hebreo, ngunit sa kontekstong ito maaari itong tumukoy sa pagsundo kay Saul mula sa pinagtataguan niya (tingnan ang tal. 22).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֻצוּ
  choice: tumakbo sila
  rationale: Tuwirang ipinapahayag ng רוץ ang pagtakbo o pagmamadali; pinananatili ng “tumakbo” ang sigla ng salaysay.
- source_word: וַיִּקָּחֻהוּ מִשָּׁם
  choice: kinuha siya mula roon
  rationale: Karaniwang kahulugan ng לקח ang “kunin.” Ang “mula roon” ay tapat sa מִשָּׁם, habang ang konteksto ng pagbawi sa kaniya mula sa pinagtataguan ay inilagay sa talababa.
- source_word: וַיִּתְיַצֵּב בְּתוֹךְ הָעָם
  choice: Tumayo siya sa gitna ng mga tao
  rationale: Ang hitpael ng יצב ay maaaring mangahulugang pumuwesto o tumindig. Natural at hindi labis na interpretatibo rito ang “tumayo,” at pinananatili ng “sa gitna” ang diwa ng בְּתוֹךְ.
- source_word: וַיִּגְבַּהּ מִכָּל הָעָם
  choice: mas matangkad siya kaysa sa kanilang lahat
  rationale: Sa paglalarawan ng taas ng tao, natural na katumbas ng pahambing na גבהּ ang “mas matangkad.” Ang “kanilang lahat” ay tumutukoy sa mga taong nagkakatipon nang hindi pinakikitid ang saklaw ng הָעָם.
- source_word: מִשִּׁכְמוֹ וָמָעְלָה
  choice: mula balikat pataas
  rationale: Ito ang natural na modernong ekspresyong Filipino para sa idyomang Hebreo na nagpapakitang higit ang taas ni Saul nang isang ulo at mga balikat.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “mga tao” para sa kolektibong הָעָם at iniwasan ang mas makalumang “sambayanan” dahil ang tagpo ay tumutukoy sa nagkakatipong mga tao. Ang “mula balikat pataas” ay idiomatiko at madaling maunawaan.
