  to: Sinabi ni Saul sa tiyuhin niya, “Malinaw niyang sinabi sa amin na natagpuan na ang mga asnong babae.[a]” Ngunit hindi sinabi ni Saul sa kanya ang usapin tungkol sa paghahari[b] na sinabi ni Samuel.
