base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/016.yaml
  text: Saul said to his uncle[b][a], “He plainly told us that the donkeys had been found.” But he did not tell him about the matter of the kingship that Samuel had spoken of.
translation:
  language: tl
  text: Sinabi ni Saul sa tiyuhin niya, “Malinaw niyang sinabi sa amin na natagpuan na ang mga asnong babae.[a]” Ngunit hindi sinabi ni Saul sa kanya ang usapin tungkol sa paghahari[b] na sinabi ni Samuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga asnong babae.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “ang usapin tungkol sa kaharian.” Sa konteksto, malamang na tumutukoy ito sa paghahari ni Saul.
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: tiyuhin niya
  rationale: Sa konteksto ng salaysay, ang דּוֹד na may hulaping 3ms ay tumutukoy sa tiyuhin ni Saul, hindi sa minamahal.
- source_word: הַגֵּד הִגִּיד
  choice: Malinaw niyang sinabi
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa pagkakasabi; natural na ipinahahayag ito ng “malinaw niyang sinabi.”
- source_word: נִמְצְאוּ
  choice: natagpuan na
  rationale: Pinananatili nito ang diwang pasibo at ang aspektong natapos na ang pagkakatagpo bago ang pag-uulat ni Saul.
- source_word: הָאֲתֹנוֹת
  choice: mga asnong babae
  rationale: Tahasang pambabae ang katawagang Hebreo; nauunawaan at likas sa Filipino ang “mga asnong babae,” bagaman maaari ring paikliin sa “mga asno.”
- source_word: דְּבַר הַמְּלוּכָה
  choice: ang tungkol sa pagiging hari
  rationale: Sa kontekstong ito, ang דָּבָר ay bagay o usapin, at ang מְלוּכָה ay tumutukoy sa pagkakahirang ni Saul sa paghahari, hindi pangunahin sa isang teritoryal na kaharian.
- source_word: לֹא הִגִּיד לוֹ
  choice: hindi sinabi ni Saul sa kanya
  rationale: Nilinaw ang paksang si Saul upang maiwasan ang kalituhan sa Filipino, habang tapat sa pagpapatuloy ng paksa sa Hebreo.
- source_word: אֲשֶׁר אָמַר שְׁמוּאֵל
  choice: na binanggit ni Samuel
  rationale: Natural itong nag-uugnay sa sinabi ni Samuel sa usapin ng pagiging hari nang hindi nagdaragdag ng detalye.
theological_decisions:
- issue: Saklaw ng מְלוּכָה
  choice: pagiging hari
  alternative: kaharian
  rationale: Malamang na ang tinutukoy rito ay ang katayuan o tungkulin ni Saul bilang hari na ipinahayag ni Samuel, bagaman maaari ring mangahulugan ang salita ng paghahari o kaharian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tiyuhin” at “pagiging hari” bilang karaniwang pananalita; bahagyang nilinaw ang paksang si Saul sa ikalawang pangungusap upang maiwasan ang malabong panghalip.
