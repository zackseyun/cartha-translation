  text: And when these signs come to you[a], do whatever your hand finds to do, for God is with you.
translation:
  language: tl
  text: At kapag dumating sa iyo ang mga tandang ito, gawin mo ang anumang kaya mong gawin,[a] sapagkat ang Diyos ay kasama mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “gawin mo ang anumang abot ng iyong makakaya.” Literal sa Hebreo, “anumang matagpuan ng iyong kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At kapag
  rationale: Ipinakikilala ng parirala ang isang pangyayari sa hinaharap; natural at malinaw ito sa makabagong Tagalog.
- source_word: תבאינה ... לָךְ
  choice: dumating sa iyo
  rationale: Ang בוא kasama ng 'mga tanda' ay tumutukoy sa pagdating o pagsapit ng mga ito.
- source_word: הָאֹתוֹת הָאֵלֶּה
  choice: ang mga tandang ito
  rationale: Tuwirang katumbas ng pangngalang אות at ng demonstratibong 'ito.'
- source_word: עֲשֵׂה לְךָ
  choice: gawin mo
  rationale: Natural na utos sa Tagalog; ang personal na pakikilahok ng kinakausap ay malinaw na sa hulaping panghalip na 'mo,' kaya hindi na kailangang idagdag ang alanganing 'para sa iyong sarili.'
- source_word: אֲשֶׁר תִּמְצָא יָדֶךָ
  choice: ang anumang masumpungang gawin ng iyong kamay
  rationale: Pinananatili ang kongkretong Hebreong idyoma at ang pahiwatig na gawin ang abot ng kapangyarihan o pagkakataon ng isang tao.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ito ng dahilan para sa utos at angkop sa marangal ngunit madaling unawaing rehistro.
- source_word: הָאֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman may pantukoy sa Hebreo, tiyak na tumutukoy ito sa Diyos ng Israel; likas sa Tagalog ang 'ang Diyos.'
- source_word: עִמָּךְ
  choice: kasama mo
  rationale: Tuwirang ipinahahayag ang presensiya at pagsuporta ng Diyos kay Saul.
theological_decisions:
- issue: Pagpapakahulugan sa presensiya ng Diyos sa עִמָּךְ
  choice: kasama mo ang Diyos
  alternative: sumasaiyo ang Diyos
  rationale: Parehong posible, ngunit mas karaniwan at madaling maunawaan ang 'kasama mo' habang hindi dinaragdagan ang kahulugan ng banal na pagsuporta.
- issue: Paglalarawan sa הָאֱלֹהִים na may pantukoy
  choice: ang Diyos
  alternative: ang [tunay na] Diyos
  rationale: Hindi idinaragdag ang 'tunay' na wala sa teksto; ang karaniwang pangalang 'Diyos' na may pantukoy ay sapat upang ipakita ang tiyak na sanggunian.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili sa pangunahing teksto ang Hebreong idyoma tungkol sa kamay, habang nililinaw sa talababa ang diwang tumutukoy sa anumang abot ng kakayahan o kapangyarihan.
