  text: וַ/יַּקְרֵ֞ב אֶת שֵׁ֤בֶט בִּנְיָמִן֙ ל/משפחת/ו וַ/תִּלָּכֵ֖ד מִשְׁפַּ֣חַת הַ/מַּטְרִ֑י וַ/יִּלָּכֵד֙ שָׁא֣וּל בֶּן קִ֔ישׁ וַ/יְבַקְשֻׁ֖/הוּ וְ/לֹ֥א נִמְצָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/021.yaml
  text: Then he brought the tribe of Benjamin near by its clans[a], and the clan of the Matrites was taken. Then Saul son of Kish was taken, but when they sought him[b], he could not be found.
translation:
  language: tl
  text: Pagkatapos, ipinalapit niya ang lipi ni Benjamin ayon sa mga angkan nito,[a] at nabunot ang angkan ng mga Matrita.[b] Pagkatapos ay nabunot si Saul na anak ni Kish. Ngunit nang hanapin nila siya, hindi siya natagpuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa mga pamilya nito.” Ang salitang Hebreo ay maaaring tumukoy sa malalaking pangkat ng magkakamag-anak o mga angkan sa loob ng isang lipi.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nahuli” o “nakuha.” Dito, tumutukoy ito sa pagkakakilanlan o pagpili sa pamamagitan ng palabunutan, hindi sa pagkabihag sa digmaan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: ipinalapit niya
  rationale: Pinananatili nito ang causative na diwa ng Hiphil na ‘dalhin o iharap nang malapit’ at ang seremonyal na hakbang sa pagpili.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: ang lipi ni Benjamin
  rationale: Ang “lipi” ay natural at malinaw na tawag sa malaking pangkat-tribo sa makabagong Filipino.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: ayon sa mga angkan nito
  rationale: Sa pagkakasunod-sunod na lipi → pangkat-pamilya → tao, mas malinaw ang “angkan” kaysa karaniwang “pamilya”; ipinahihiwatig ng “ayon sa” ang pamamahagi sa mga pangkat.
- source_word: וַתִּלָּכֵד / וַיִּלָּכֵד
  choice: nabunot
  rationale: Sa konteksto ng pagpili sa pamamagitan ng palabunutan, natural na ipinahahayag ng “nabunot” ang napiling pangkat o tao, habang pinananatili ang parehong salin sa dalawang paglitaw ng pandiwa.
- source_word: מִשְׁפַּחַת הַמַּטְרִי
  choice: ang angkan ng mga Matrita
  rationale: Pinananatili ang pangkatang katawagang Hebreo bilang isang gentiliko sa halip na gawing pangalan ng isang ipinapalagay na ninuno.
- source_word: שָׁאוּל בֶּן קִישׁ
  choice: si Saul na anak ni Kish
  rationale: Ito ang natural na Filipino para sa Hebreong patronimiko at pinananatili ang mga pangalang pantangi.
- source_word: וַיְבַקְשֻׁהוּ
  choice: nang hanapin nila siya
  rationale: Ang “hanapin” ay tuwiran at likas na katumbas ng בקשׁ; ipinakikita ng “nang” ang kasunod na pangyayari nang hindi dinaragdagan ang kahulugan.
- source_word: וְלֹא נִמְצָא
  choice: hindi siya natagpuan
  rationale: Pinananatili nito ang pasibong anyo at ang simpleng pahayag ng Hebreo, sa halip na idagdag ang modal na diwang “hindi matagpuan.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lipi” at “angkan” upang malinaw ang pagliit ng saklaw mula sa tribo tungo sa pangkat ng magkakamag-anak at pagkatapos sa isang tao. Ang “nabunot” ay karaniwang salitang Filipino para sa napili sa palabunutan at iniiwasan ang maling impresyon ng pagdakip.
