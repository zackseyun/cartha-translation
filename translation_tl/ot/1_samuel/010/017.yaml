base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/017.yaml
  text: Then Samuel called the people together to Yahweh at Mizpah[a].
translation:
  language: tl
  text: Pagkatapos, ipinatawag ni Samuel ang mga tao kay Yahweh sa Mizpa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinipon ni Samuel ang mga tao kay Yahweh sa Mizpa.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagtawag o pagpapatawag sa isang kapulungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצְעֵק
  choice: tinipon
  rationale: Bagaman karaniwang nangangahulugang “sumigaw” ang צעק, dito ay may tuwirang layon na “ang mga tao” at tumutukoy sa pagtawag upang magkatipon. Likas at malinaw sa Tagalog ang “tinipon.”
- source_word: אֶת הָעָם
  choice: ang mga tao
  rationale: Ang עָם ay tumutukoy rito sa bayang Israel na tinawag upang magkatipon; tuwiran at natural ang “ang mga tao.”
- source_word: אֶל יְהוָה
  choice: sa harap ni Yahweh
  rationale: Karaniwang nangangahulugang “patungo sa” ang אֶל, ngunit sa kontekstong ito ay inilalarawan nito ang pagtitipon ng bayan sa presensiya ni Yahweh. Iniiwasan ng “sa harap ni Yahweh” ang di-likas na “kay Yahweh” habang pinananatili ang ugnayang panrelihiyon ng pagtitipon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: הַמִּצְפָּה
  choice: sa Mizpa
  rationale: Pangalan ng lugar ang מִצְפָּה rito. Ginamit ang anyong “Mizpa,” na natural sa baybay-Filipino, at ang “sa” upang ipakita ang lokasyon ng pagtitipon.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng אֶל יְהוָה sa pagtitipon
  choice: sa harap ni Yahweh
  alternative: kay Yahweh
  rationale: Maaaring panatilihin nang mas literal ang אֶל bilang “kay,” ngunit hindi ito natural sa Tagalog para sa isang pagtitipon. Ipinahahayag ng “sa harap ni Yahweh” ang pagtitipon sa kaniyang presensiya nang hindi nagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tinipon” para sa natural na salaysay at “sa harap ni Yahweh” upang maipahayag nang malinaw ang ugnayan ng kapulungan kay Yahweh. Inilagay ang pananda ng talababa pagkatapos ng pangalan ng lugar.
