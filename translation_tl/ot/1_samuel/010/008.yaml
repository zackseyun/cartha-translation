revisions:
- from: At mauuna kang bumaba sa Gilgal. Narito, bababa ako riyan sa iyo upang maghandog ng mga handog na sinusunog at mag-alay ng mga handog para sa kapayapaan.[a] Maghintay ka nang pitong araw, hanggang sa makarating ako sa iyo at ipaalam ko sa iyo kung ano ang gagawin mo.
  to: At mauna kang bumaba sa Gilgal. Narito, bababa ako riyan sa iyo upang maghandog ng mga handog na sinusunog at mag-alay ng mga handog ng kapayapaan.[a] Maghintay ka nang pitong araw, hanggang sa makarating ako sa iyo at ipaalam ko sa iyo kung ano ang gagawin mo.
  rationale: Pinalitan ang pangunahing katawagan para sa שְׁלָמִים upang malinaw itong basahin bilang isang uri ng handog, hindi lamang bilang handog na may layuning magdala ng kapayapaan. Inayos din ang alternatibong leksikal sa talababa upang mas tumpak na katawanin ang saklaw na ‘well-being.’ Walang ibang pagbabago sa kahulugan o pagkakasunod ng Hebreong teksto.
