base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/008.yaml
  text: And you shall go down before me to Gilgal. And behold[a], I am coming down to you to offer burnt offerings and to sacrifice peace offerings. You shall wait seven days, until I come to you and make known to you what you shall do.
translation:
  language: tl
  text: At mauna kang bumaba sa Gilgal. Narito, bababa ako riyan sa iyo upang maghandog ng mga handog na sinusunog at mag-alay ng mga handog ng kapayapaan.[a] Maghintay ka nang pitong araw, hanggang sa makarating ako sa iyo at ipaalam ko sa iyo kung ano ang gagawin mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog ng pakikisalo” o “mga handog para sa kapakanan.” Ang terminong Hebreo ay tumutukoy sa mga haing kaugnay ng kapayapaan, kabuuan, kapakanan, at sama-samang pakikisalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתָּ
  choice: At mauuna kang bumaba
  rationale: Ang Qal perfect na may pang-ugnay ay bahagi ng sunod-sunod na tagubilin. Ipinahahayag ng “mauuna” ang kaugnayan nito sa לְפָנַי, habang pinananatili ng “bumaba” ang direksiyong ipinahihiwatig ng ירד.
- source_word: לְפָנַי
  choice: mauuna ka sa akin
  rationale: Literal na “sa harap ko”; sa konteksto, pupunta si Saul sa Gilgal bago dumating si Samuel. Ang “mauuna” ay likas sa modernong Tagalog at pinananatili ang temporal at spatial na diwa.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Isinalin sa baybay-transliterasyon bilang pangalan ng lugar.
- source_word: וְהִנֵּה
  choice: Narito
  rationale: Panandang pantawag-pansin at nagbibigay-buhay sa pahayag; ang “Narito” ay marangal at nauunawaan sa modernong Tagalog.
- source_word: יֹרֵד אֵלֶיךָ
  choice: bababa ako riyan sa iyo
  rationale: Ang participle ay nagpapahiwatig ng nalalapit o nilalayong pagkilos. Pinananatili ng “bababa” ang spatial na diwa, at ng “riyan sa iyo” ang pananaw ng nagsasalita patungo sa kinaroroonan ni Saul.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: upang maghandog ng mga handog na sinusunog
  rationale: Ang parirala ay tumutukoy sa paghahandog ng mga alay na buong sinusunog. Malinaw ang parirala at pinananatili ang terminolohiyang panghandog.
- source_word: לִזְבֹּחַ זִבְחֵי שְׁלָמִים
  choice: mag-alay ng mga handog para sa kapayapaan
  rationale: Ang זבח ay tumutukoy sa pagkatay o pag-aalay ng hain, at ang שְׁלָמִים ay kaugnay ng kapayapaan, kabuuan, kaginhawahan, at pakikisalo. Pinananatili sa talababa ang lawak ng kahulugan.
- source_word: שִׁבְעַת יָמִים תּוֹחֵל
  choice: Maghintay ka nang pitong araw
  rationale: Bagaman maaari ring mangahulugang “umasa” ang יחל, malinaw na paghihintay ang diwa sa tagubiling ito. Ginamit ang “nang” bilang pang-abay na pananda sa haba ng paghihintay.
- source_word: עַד בּוֹאִי אֵלֶיךָ
  choice: hanggang sa makarating ako sa iyo
  rationale: Likas na salin ng infinitive construct na may hulapi pagkatapos ng עַד; ipinahahayag ang pagdating sa kinaroroonan ni Saul.
- source_word: וְהוֹדַעְתִּי לְךָ
  choice: at ipaalam ko sa iyo
  rationale: Pinananatili ng “ipaalam” ang causative na diwa ng Hiphil ng ידע, “pangyarihing malaman.”
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: kung ano ang gagawin mo
  rationale: Natural na Tagalog para sa object marker at relative clause, habang pinananatili ang hinaharap at mapag-utos na tono.
theological_decisions:
- issue: Salin ng terminong panghandog na שְׁלָמִים
  choice: mga handog para sa kapayapaan
  alternative: mga handog ng pakikisalo; mga handog para sa kaginhawahan o kabutihan
  rationale: Ang “handog para sa kapayapaan” ay nagpapanatili sa pangunahing ugnayan ng salita sa kapayapaan at kabuuan nang hindi ito nililimitahan sa iisang teolohikal na paliwanag. Inilalahad sa talababa ang kaugnay na diwa ng pakikisalo at kaginhawahan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa sa publiko. Ginamit ang “Narito” upang mapanatili ang solemne at pantawag-pansing lakas ng הִנֵּה. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
