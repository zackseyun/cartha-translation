  text: וַ/יֹּ֣אמֶר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וָ/אַצִּ֤יל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּד֙ כָּל הַ/מַּמְלָכ֔וֹת הַ/לֹּחֲצִ֖ים אֶתְ/כֶֽם׀־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/018.yaml
  text: 'And he said to the sons of Israel[a], “Thus says Yahweh, the God of Israel: I brought Israel up from Egypt, and I delivered you from the hand of the Egyptians and from the hand of all the kingdoms that were oppressing you.”'
translation:
  language: tl
  text: 'At sinabi niya sa mga anak ni Israel[a], “Ganito ang sabi ni Yahweh, ang Diyos ng Israel: Ako ang nag-ahon sa Israel mula sa Ehipto at nagligtas sa inyo mula sa kamay ng mga Ehipsiyo at mula sa kamay ng lahat ng kahariang umaapi sa inyo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita”; sa literal, “mga anak na lalaki ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pormal na anyong Hebreo na ‘mga anak na lalaki ni Israel,’ ngunit ginagamit ang likas at nakaugaliang ekspresyong Tagalog na tumutukoy sa bayang Israel; inilalagay sa talababa ang mas tuwirang alternatibo.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Likas at marangal na Tagalog para sa pormulang pangmensahero o pangpropeta, habang pinananatili ang tahasang pagpapahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: הֶעֱלֵיתִי
  choice: nag-ahon
  rationale: Ipinahahayag ang Hiphil na ‘nagpaakyat/nag-ahon’ mula sa Ehipto at pinananatili ang larawan ng pag-ahon, sa halip na gawing pangkalahatang ‘naglabas.’
- source_word: וָאַצִּיל
  choice: nagligtas
  rationale: Natural na Tagalog para sa pagliligtas mula sa kapangyarihan o panganib.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang larawang Hebreo ng kamay bilang kapangyarihan o paghahari; malinaw pa rin ito sa Tagalog.
- source_word: מִצְרַיִם
  choice: mga Ehipsiyo
  rationale: Sa pariralang ‘kamay ng,’ ang tinutukoy ay ang kapangyarihan ng mga taga-Ehipto, kaya mas natural ang demonym kaysa sa pangalan ng lupain.
- source_word: כָּל הַמַּמְלָכוֹת
  choice: lahat ng kaharian
  rationale: Tuwirang pinananatili ang maramihan at malawak na saklaw ng Hebreo nang walang idinagdag na lokasyon.
- source_word: הַלֹּחֲצִים אֶתְכֶם
  choice: umaapi sa inyo
  rationale: Ang pandiwaring Hebreo ay nagpapahiwatig ng patuloy o karaniwang pang-aapi; ang kasalukuyang anyong Tagalog ay nagpapanatili ng duratibong diwa.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng ‘Yahweh’ ang pagkakakilanlan nito bilang tipanang pangalan at hindi ito pinapalitan ng titulo.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita o mga anak na lalaki ni Israel
  rationale: Ang parirala ay pormal na panlalaking maramihan ngunit ginagamit bilang pangkat-etnikong katawagan. Pinananatili sa pangunahing teksto ang tradisyonal at kolektibong ‘mga anak ni Israel,’ habang inilalahad sa talababa ang literal at idiomatikong mga alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pormulang ‘Ganito ang sinabi,’ ang banal na pangalang Yahweh, at ang idyomang ‘mula sa kamay ng’ dahil malinaw ang mga ito sa konteksto. Ginamit ang ‘nag-ahon’ upang mapanatili ang natatanging larawan ng Hebreong עלה.
