translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘binatang kasama niya’ upang maiwasan ang hindi natural na ‘kanyang binata’ at ang labis na pagtitiyak na isa siyang tagapaglingkod. Pinanatiling maikli at tuwiran ang diyalogo.
