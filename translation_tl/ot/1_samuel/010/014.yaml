  text: וַ/יֹּאמֶר֩ דּ֨וֹד שָׁא֥וּל אֵלָ֛י/ו וְ/אֶֽל נַעֲר֖/וֹ אָ֣ן הֲלַכְתֶּ֑ם וַ/יֹּ֕אמֶר לְ/בַקֵּשׁ֙ אֶת הָ֣/אֲתֹנ֔וֹת וַ/נִּרְאֶ֣ה כִי אַ֔יִן וַ/נָּב֖וֹא אֶל שְׁמוּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/014.yaml
  text: Then Saul’s uncle said to him and to his young man[a], “Where did you go?” And he said, “To seek the donkeys. When we saw that they were nowhere to be found[b], we went to Samuel.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng tiyuhin ni Saul sa kanya at sa binatang kasama niya[a], “Saan kayo nagpunta?” Sumagot siya, “Para hanapin ang mga asno.[b] Nang makita naming wala ang mga asno, pumunta kami kay Samuel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa kasama niyang tagapaglingkod.”
    reason: Pinahihintulutan ng נַעַר ang kahulugang binata, kasama, o tagapaglingkod; hindi tiyak sa talata ang katayuan niya.
  - marker: b
    text: Ang salitang Hebreo ay tumutukoy sa mga babaeng asno.
    reason: Nasa anyong pambabae ang אֲתֹנוֹת, ngunit mas natural sa Filipino na gamitin ang pangkalahatang “mga asno” sa pangunahing teksto.
lexical_decisions:
- source_word: דּוֹד שָׁאוּל
  choice: tiyuhin ni Saul
  rationale: Karaniwang tumutukoy ang דּוֹד sa tiyuhin sa ganitong kontekstong pampamilya; mas tiyak at natural ito kaysa sa pangkalahatang ‘kamag-anak.’
- source_word: אֵלָיו וְאֶל נַעֲרוֹ
  choice: sa kanya at sa binatang kasama niya
  rationale: Maaaring mangahulugan ang נַעַר ng binata, tagapaglingkod, o kasama. Pinananatili ng salin ang pangunahing kahulugang ‘binata’ nang hindi ipinapalagay na alipin o lingkod siya.
- source_word: אָן הֲלַכְתֶּם
  choice: Saan kayo nagpunta?
  rationale: Ang אָן ay tanong tungkol sa lugar, at ang pandiwa ay nasa ikalawang panauhang maramihan; natural sa makabagong Filipino ang ‘kayo nagpunta.’
- source_word: לְבַקֵּשׁ אֶת הָאֲתֹנוֹת
  choice: Para hanapin ang mga asno
  rationale: Ang בקשׁ ay ‘hanapin’ o ‘saliksikin.’ Natural at malinaw ang ‘hanapin’; ang anyong pambabae ng אֲתֹנוֹת ay ipinaliwanag sa talababa upang hindi maging mabigat ang pangunahing teksto.
- source_word: וַנִּרְאֶה כִי אַיִן
  choice: Nang makita naming wala roon ang mga iyon
  rationale: Literal na ipinahahayag ng parirala na nakita nilang wala ang mga asno. Ang ‘wala roon’ ay malinaw at hindi nagdaragdag ng ideyang lubusang imposible nang matagpuan ang mga ito.
- source_word: וַנָּבוֹא אֶל שְׁמוּאֵל
  choice: pumunta kami kay Samuel
  rationale: Ang בוא ay maaaring ‘dumating’ o ‘pumaroon/pumunta’ ayon sa pananaw ng nagsasalaysay. Sa pagsasalaysay ni Saul tungkol sa kanilang paglalakbay, natural ang ‘pumunta kami kay Samuel.’
