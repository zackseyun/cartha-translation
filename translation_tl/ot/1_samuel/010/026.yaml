  text: וְ/גַ֨ם שָׁא֔וּל הָלַ֥ךְ לְ/בֵית֖/וֹ גִּבְעָ֑תָ/ה וַ/יֵּלְכ֣וּ עִמּ֔/וֹ הַ/חַ֕יִל אֲשֶׁר נָגַ֥ע אֱלֹהִ֖ים בְּ/לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/026.yaml
  text: Saul also went to his home at Gibeah[b][a], and with him went the valiant men whose hearts God had touched.
translation:
  language: tl
  text: Umuwi rin si Saul sa Gibeah, at sumama sa kanya ang matatapang na lalaki[a] na ang mga puso ay hinipo ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga magigiting na lalaki” o “mga mandirigma.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “na ang mga puso ay hinipo ng Diyos”; ipinahihiwatig ng idyoma na pinakilos ng Diyos ang kanilang panloob na disposisyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: rin
  rationale: Ipinahihiwatig nito ang pagdaragdag o pagpapatuloy sa salaysay; natural sa Filipino ang “rin” kasunod ng pandiwang “umuwi.”
- source_word: הָלַךְ לְבֵיתוֹ גִּבְעָתָה
  choice: umuwi ... sa Gibeah
  rationale: Ang “umuwi” ay likas na nagpapahayag ng pagpunta sa sariling bahay, habang pinananatili ng “sa Gibeah” ang tahasang patutunguhan.
- source_word: וַיֵּלְכוּ עִמּוֹ
  choice: at sumama sa kanya
  rationale: Natural na salin ito ng pagkilos na kasama ni Saul at pinananatili ang pagkakasunod ng salaysay.
- source_word: הַחַיִל
  choice: ang matatapang na lalaki
  rationale: Sa konteksto, tumutukoy ito sa mga lalaking may tapang at kakayahang pandigma, hindi kinakailangang sa buong hukbo bilang isang institusyon.
- source_word: אֲשֶׁר נָגַע אֱלֹהִים בְּלִבָּם
  choice: na ang mga puso ay hinipo ng Diyos
  rationale: Pinananatili nito ang metapora ng Hebreo at ang pamamahagi ng kilos sa kani-kanilang puso, nang hindi tinutukoy nang labis ang paraan o tindi ng impluwensiya ng Diyos.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Malinaw na tumutukoy rito sa Diyos ng Israel; “Diyos” ang karaniwang salin sa Filipino.
- source_word: לֵב
  choice: mga puso
  rationale: Saklaw ng salitang Hebreo ang kalooban, pag-iisip, at panloob na disposisyon; pinananatili ng “mga puso” ang malinaw at tradisyonal na larawan.
theological_decisions:
- issue: Ang likas na katangian ng pagkilos ng Diyos sa mga puso ng mga lalaki
  choice: Panatilihin ang idyomang “hinipo ng Diyos” bilang pahayag ng banal na pagkilos sa kanilang panloob na disposisyon.
  alternative: “pinukaw ng Diyos ang kanilang mga puso” o “pinakilos ng Diyos ang kanilang kalooban”
  rationale: Ipinapahayag ng teksto ang pagkukusa at impluwensiya ng Diyos, ngunit hindi nito tinutukoy ang isang partikular na mekanismong doktrinal gaya ng muling kapanganakan, di-mapipigilang pamimilit, o emosyonal na pagpapalakas lamang.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “umuwi” upang maipahayag nang maikli ang pagpunta ni Saul sa sarili niyang tahanan sa Gibeah. Pinanatili sa pangunahing teksto ang metaporang “hinipo ... ang mga puso,” at inilagay ang paliwanag sa talababa upang maiwasan ang labis na pagpapakahulugan.
