base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/024.yaml
  text: Then Samuel said to all the people[a], “Do you see the one whom Yahweh has chosen? There is no one like him among all the people.” And all the people shouted and said[b], “Long live the king!”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Samuel sa buong bayan, “Nakikita ba ninyo ang pinili ni Yahweh?[a] Walang sinumang katulad niya sa buong bayan.” At sumigaw ang buong bayan at nagsabi, “Mabuhay ang hari!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Nakita na ba ninyo ang pinili ni Yahweh?”
    reason: Pinahihintulutan ng anyong Hebreo ang pagbasa bilang natapos nang pagkakita o bilang tanong na nagtutuon ng pansin sa kasalukuyang nakikita.
  - marker: b
    text: Sa literal na Hebreo, “Mabuhay nawa ang hari!”
    reason: Ang anyong jussive ay nagpapahayag ng hangarin o pagpupugay; “Mabuhay ang hari!” ang natural na katumbas sa Tagalog.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Tagalog ang “Pagkatapos ay sinabi” bilang pahiwatig ng kasunod na pangyayari.
- source_word: הַרְּאִיתֶם
  choice: Nakikita ba ninyo
  rationale: Bagaman nasa anyong perfect na ikalawang panauhang maramihan, ginagamit ito rito bilang tanong na nagtutuon ng pansin sa taong inihaharap ni Samuel. Pinananatili sa talababa ang posibleng pagbasa na tumutukoy sa natapos na pagkakita.
- source_word: אֲשֶׁר בָּחַר בּוֹ יְהוָה
  choice: ang pinili ni Yahweh
  rationale: Likas at tuwiran sa Tagalog ang pariralang ito para tukuyin si Saul bilang taong pinili ni Yahweh, nang hindi kailangang ulitin ang panghalip na panlalaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כִּי אֵין כָּמֹהוּ
  choice: Walang sinumang katulad niya
  rationale: Malinaw na ipinahahayag ang paliwanag o batayan ng naunang tanong. Hindi na kailangang tumbasan nang mekanikal ang כִּי ng “sapagkat” dahil malinaw ang ugnayan ng magkasunod na pangungusap.
- source_word: בְּכָל הָעָם
  choice: sa buong bayan
  rationale: Ipinahihiwatig nito ang paghahambing kay Saul sa lahat ng kabilang sa bayan; natural at marangal ang “sa buong bayan” sa Tagalog.
- source_word: וַיָּרִעוּ
  choice: sumigaw
  rationale: Tumutukoy ang pandiwa sa malakas na sigaw ng pagpupugay; hindi idinaragdag ang mas tiyak na damdaming maaaring ipahiwatig ng “nagsaya” o “nagbunyi.”
- source_word: יְחִי הַמֶּלֶךְ
  choice: Mabuhay ang hari!
  rationale: Ito ang natural at nakaugaliang Tagalog na pormula ng pagpupugay na nagpapahayag ng hangaring mabuhay at maghari ang hari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON,” nang walang pagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Saklaw ng pahayag na walang katulad si Saul
  choice: Walang sinumang katulad niya sa buong bayan
  alternative: Sapagkat walang sinumang katulad niya sa buong bayan
  rationale: Pinananatili ang paghahambing sa loob ng bayan at hindi nililinaw kung anong partikular na katangian ang tinutukoy. Ang paliwanag na puwersa ng כִּי ay naipapakita ng pagkakasunod ng mga pangungusap nang hindi ginagawang tahasang sanhi ang ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw sa karaniwang mambabasa. Ginamit ang “bayan” para sa kolektibong הָעָם at iniwasan ang sobrang literal o makalumang ayos. Ang mga talababa ay nagpapanatili sa aspektuwal na posibilidad ng הַרְּאִיתֶם at sa literal na anyo ng sigaw para sa hari.
