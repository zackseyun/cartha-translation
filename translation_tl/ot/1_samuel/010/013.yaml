  text: When he had finished prophesying[a], he came to the high place.
translation:
  language: tl
  text: Nang matapos na siyang magpahayag bilang propeta, dumating siya sa mataas na lugar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “dambana sa burol.” Sa Hebreo, “ang mataas na lugar,” na tumutukoy sa isang mataas na pook-sambahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: Nang matapos siya
  rationale: Ipinahihiwatig ng anyo ng pandiwa ang pagkumpleto sa naunang gawain bago sumunod ang pagpunta; natural itong ipinapahayag sa Filipino bilang sugnay na panahunan.
- source_word: מֵהִתְנַבּוֹת
  choice: magpahayag bilang propeta
  rationale: Tuwirang tumutukoy ito sa gawain ng isang propeta. Iniwasan ang “manghula,” na sa modernong Filipino ay maaaring magpahiwatig lamang ng panghuhula sa hinaharap, at hindi rin idinagdag na may partikular siyang mensaheng sinabi.
- source_word: וַיָּבֹא
  choice: pumunta siya
  rationale: Maaaring mangahulugan ang בוא ng pagdating o pagpunta ayon sa pananaw ng salaysay. Ang “pumunta” ay natural dito at hindi labis na nagtatakda ng pananaw.
- source_word: הַבָּמָה
  choice: ang mataas na lugar
  rationale: Pinananatili nito ang karaniwang literal na katawagan sa Hebreo at ang posibilidad na maunawaan ito bilang isang mataas na pook-sambahan, habang nililinaw sa talababa ang kontekstong panrelihiyon.
theological_decisions:
- issue: Kahalagahang panrelihiyon ng הַבָּמָה
  choice: ang mataas na lugar
  alternative: ang dambana sa burol; ang pook-sambahan sa mataas na lugar
  rationale: Tumutukoy ang salita sa isang lugar ng pagsamba, ngunit hindi hinihingi ng talata na magpasya tungkol sa pagiging lehitimo nito. Pinananatili ng pangunahing teksto ang payak na katawagan at iniiwasang lutasin ang mas malawak na usaping panrelihiyon.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “magpahayag bilang propeta” sa halip na “manghula” upang maiwasan ang makitid o maling diwa ng paghula sa hinaharap. Ang panandang [a] ay ikinabit sa “mataas na lugar,” ang salitang aktuwal na nililinaw ng talababa.
