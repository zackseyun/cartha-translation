  yaml_path: translation/ot/1_samuel/010/012.yaml
  text: 'Then a man from there answered and said[a], “And who is their father?” Therefore it became a proverb: “Is Saul also among the prophets?”'
translation:
  language: tl
  text: 'Sumagot ang isang lalaki mula roon at sinabi[a], “At sino ang kanilang ama?” Kaya naging kasabihan ito: “Kasama rin ba si Saul sa mga propeta?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At sino ang kanyang ama?” Itinuturing ng ilang salin na si Saul mismo ang tinutukoy ng tanong, ngunit “kanilang ama” ang mababasa sa tekstong Masoretiko.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Karaniwang panimulang pandiwa ito sa isang tugon sa salaysay; natural at tuwiran ang “sumagot” sa modernong Tagalog.
- source_word: אִישׁ מִשָּׁם
  choice: isang lalaking tagaroon
  rationale: Pinananatili ang isahang אִישׁ at ang diwang lokal ng מִשָּׁם sa likas na pariralang Tagalog.
- source_word: וּמִי אֲבִיהֶם
  choice: At sino ang kanilang ama?
  rationale: Pinananatili ang pangmaramihang hulapi ng tekstong Masoretiko, kaya “kanilang” at hindi “kanyang.”
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Likas at malinaw na panandang nagpapakilala sa naging bunga o kinahinatnan.
- source_word: הָיְתָה לְמָשָׁל
  choice: naging kasabihan ito
  rationale: Ang מָשָׁל dito ay isang kilalang sawikain o kasabihan, hindi isang mahabang talinghaga; “kasabihan” ang pinakanatural sa konteksto.
- source_word: הֲגַם
  choice: rin ba
  rationale: Ipinahahayag nito ang nagugulat na pagsama kay Saul sa isang pangkat; likas itong naihahatid ng “rin ba” sa tanong.
- source_word: בַּנְּבִאִים
  choice: sa mga propeta
  rationale: Sa pariralang “kasama ... sa mga propeta,” malinaw ang diwa ng pagiging kabilang sa pangkat at natural ang Tagalog.
theological_decisions:
- issue: Tinutukoy ng “kanilang ama” sa retorikal na tanong
  choice: Pinanatili ang pangmaramihang “kanilang ama,” na tumutukoy sa mga propeta bilang pangkat.
  alternative: “Kanyang ama,” na inuunawang si Saul lamang ang tinutukoy.
  rationale: Pangmaramihan ang hulapi sa tekstong Masoretiko. Pinananatili nito ang posibilidad na ang pagiging propeta ay hindi nakabatay sa angkan, nang hindi nilulutas nang labis ang pahiwatig ng retorikal na tanong.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tagaroon” bilang maikli at natural na katumbas ng isang lalaking mula sa lugar na iyon, at “kasabihan” para sa proverbial saying.
