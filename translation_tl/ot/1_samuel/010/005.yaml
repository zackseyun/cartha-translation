id: 1SA.10.5
reference: 1 Samuel 10:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַ֣חַר כֵּ֗ן תָּבוֹא֙ גִּבְעַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁר שָׁ֖ם נְצִבֵ֣י פְלִשְׁתִּ֑ים וִ/יהִי֩ כְ/בֹאֲ/ךָ֨ שָׁ֜ם הָ/עִ֗יר וּ/פָגַעְתָּ֞ חֶ֤בֶל נְבִיאִים֙ יֹרְדִ֣ים מֵֽ/הַ/בָּמָ֔ה וְ/לִ/פְנֵי/הֶ֞ם נֵ֤בֶל וְ/תֹף֙ וְ/חָלִ֣יל וְ/כִנּ֔וֹר וְ/הֵ֖מָּה מִֽתְנַבְּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/005.yaml
  text: After that you will come to Gibeath-ha-Elohim[a], where the Philistine garrison is. And when you enter there, into the city, you will meet a band of prophets coming down from the high place, with harp, tambourine, flute, and lyre before them[c][b], and they will be prophesying.
translation:
  language: tl
  text: Pagkatapos nito, darating ka sa Gibeat-ha-Elohim[a], kung saan naroon ang himpilan ng mga Filisteo[b]. Pagpasok mo roon sa lungsod, makakasalubong mo ang isang pangkat ng mga propeta na bumababa mula sa mataas na lugar. Nasa unahan nila ang alpa, tamburin, plauta, at lira[c], at nagpopropesiya sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “burol ng Diyos” o “Gibea ng Diyos.” Maaaring pangalan ng pook o naglalarawang tawag sa lugar ang pariralang Hebreo.
    reason: alternative_reading
  - marker: b
    text: O “puwesto ng mga Filisteo” o “mga pinunong Filisteo.” Maaaring tumukoy ang salitang Hebreo sa isang himpilang militar o sa mga opisyal, bagaman mas angkop sa konteksto ang himpilan.
    reason: alternative_reading
  - marker: c
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng mga sinaunang instrumento. Ang “alpa” ay maaari ring isang instrumentong tulad ng lute, at ang “plauta” ay maaari ring “pipa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבְעַת הָאֱלֹהִים
  choice: Gibeat-ha-Elohim
  rationale: Itinuring na pangalan ng pook at isinalin sa baybay na madaling basahin sa Filipino; pinanatili sa talababa ang posibilidad na isa itong naglalarawang parirala.
- source_word: נְצִבֵי פְלִשְׁתִּים
  choice: himpilan ng mga Filisteo
  rationale: Maaaring tumukoy ang נְצִיב sa nakatalagang opisyal o sa puwestong militar. Mas akma sa konteksto ang himpilang militar, ngunit itinala ang ibang posibilidad.
- source_word: וִיהִי כְבֹאֲךָ שָׁם הָעִיר
  choice: Pagpasok mo roon sa lungsod
  rationale: Likas na Filipino para sa temporal na pormulang Hebreo at pinananatili ang parehong 'roon' at 'lungsod' nang hindi mabigat pakinggan.
- source_word: וּפָגַעְתָּ
  choice: makakasalubong mo
  rationale: Ipinahahayag ang pagdating sa harap o di-inaasahang pagkakita sa pangkat, sa likas na gamit sa Filipino.
- source_word: חֶבֶל נְבִיאִים
  choice: isang pangkat ng mga propeta
  rationale: Malinaw at pangkaraniwang salin ng kolektibong חֶבֶל nang walang di-kailangang pahiwatig tungkol sa organisasyon ng pangkat.
- source_word: יֹרְדִים מֵהַבָּמָה
  choice: bumababa mula sa mataas na lugar
  rationale: Pinananatili ang tradisyonal at lantad na katawagan sa kultikong במה; hindi ito tahasang ginawang templo o dambana.
- source_word: נֵבֶל
  choice: alpa
  rationale: Pamilyar na modernong pagtataya sa sinaunang instrumentong de-kuwerdas; kinikilala sa talababa ang kawalan ng katiyakan.
- source_word: תֹף
  choice: tamburin
  rationale: Madaling maunawaang katawagan para sa instrumentong perkusyon na hinahawakan sa kamay.
- source_word: חָלִיל
  choice: plauta
  rationale: Karaniwang modernong katumbas para sa instrumentong hinihipan, bagaman posible rin ang 'pipa.'
- source_word: כִּנּוֹר
  choice: lira
  rationale: Pinakamalinaw na katawagan para sa instrumentong uring lyre at naiiba sa נֵבֶל na isinaling 'alpa.'
- source_word: וְהֵמָּה מִתְנַבְּאִים
  choice: at nagpopropesiya sila
  rationale: Pinananatili ang malinaw na ugnayan sa gawaing propetiko nang hindi tinutukoy kung ito ay ekstatikong pananalita, awit, o ibang anyo.
theological_decisions:
- issue: Kalikasan ng gawaing propetiko sa מִתְנַבְּאִים
  choice: nagpopropesiya sila
  alternative: nasa ekstatikong kalagayan sila bilang mga propeta; umaawit sila sa ilalim ng inspirasyon
  rationale: Tiyak na tumutukoy ang pandiwa sa gawaing propetiko, ngunit hindi nililinaw ng teksto ang eksaktong anyo nito. Kaya hindi nilimitahan ng salin ang kahulugan.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Iniwasan ang arkaikong bokabularyo at pinanatili ang mga tunay na kalabuan ng Hebreo sa mga talababa. Ginamit ang “nagpopropesiya” nang walang dagdag na paglalarawan sa paraan o kalagayan ng mga propeta.
