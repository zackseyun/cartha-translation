  text: Then Saul’s uncle said[a], “Please tell me what Samuel said to you.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng tiyuhin ni Saul, “Pakisabi mo sa akin kung ano ang sinabi ni Samuel sa inyo[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “inyo” sa Hebreo ay maramihan, malamang na tumutukoy kay Saul at sa kanyang lingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng pangyayari.
- source_word: דּוֹד שָׁאוּל
  choice: tiyuhin ni Saul
  rationale: Ang דּוֹד ay karaniwang nangangahulugang “tiyuhin” sa kontekstong pampamilya, at natural sa Tagalog ang pariralang ito.
- source_word: הַגִּידָה נָּא לִי
  choice: Pakisabi sa akin
  rationale: Ang Hiphil imperative ng נגד ay “sabihin/ipahayag,” at ang נָא ay nagpapahayag ng magalang na pakiusap; kapuwa natural na naihahatid ng “Pakisabi sa akin.”
- source_word: מָה
  choice: kung ano
  rationale: Sa di-tuwirang tanong na kasunod ng “Pakisabi sa akin,” natural sa Tagalog ang “kung ano.”
- source_word: אָמַר
  choice: sinabi
  rationale: Pinananatili nito ang payak at karaniwang kahulugan ng אמר na “sabihin.”
- source_word: לָכֶם
  choice: sa inyo
  rationale: Ang anyo ay ikalawang panauhang panlalaking maramihan. Ang “sa inyo” ay natural at maaari ring magpahiwatig ng maramihan sa Tagalog; nililinaw ito sa talababa.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa Tagalog na Bibliya.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pakisabi” upang likas na maipahayag ang magalang na pakiusap, at pinanatili ang maramihang diwa ng לָכֶם sa “sa inyo” at sa talababa.
