  text: וַ/יְהִ֗י כָּל יֽוֹדְע/וֹ֙ מֵ/אִתְּמ֣וֹל שִׁלְשׁ֔וֹם וַ/יִּרְא֕וּ וְ/הִנֵּ֥ה עִם נְבִאִ֖ים נִבָּ֑א וַ/יֹּ֨אמֶר הָ/עָ֜ם אִ֣ישׁ אֶל רֵעֵ֗/הוּ מַה זֶּה֙ הָיָ֣ה לְ/בֶן קִ֔ישׁ הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִיאִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/011.yaml
  text: And it happened that all who had known him formerly saw[a], and behold, he was prophesying with the prophets. So the people said, each man to his neighbor[b], “What has happened to the son of Kish? Is Saul also among the prophets?”
translation:
  language: tl
  text: 'At nangyari ito: nakita ng lahat ng dati nang nakakakilala sa kanya[a] na, heto, nagpapahayag siya bilang propeta kasama ng mga propeta. Kaya sinabi ng mga tao sa isa’t isa, “Ano ang nangyari sa anak ni Kish? Pati ba si Saul ay kabilang sa mga propeta?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nakakakilala sa kanya mula pa kahapon at noong makalawa,” isang idyomang Hebreo na nangangahulugang dati na nila siyang kilala.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Kasama rin ba si Saul sa mga propeta?” o “Maging si Saul ba ay kabilang sa mga propeta?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Sa daloy ng salaysay, likas na naiuugnay ng “Nang” ang pangyayari sa naunang konteksto nang hindi gumagamit ng makalumang pormula.
- source_word: יֹדְעוֹ מֵאִתְּמוֹל שִׁלְשׁוֹם
  choice: dati nang nakakakilala sa kanya
  rationale: Idyoma ito para sa pagkakilala sa nakaraang panahon; malinaw at natural itong naipahahayag sa modernong Tagalog.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: makita ... naroon siya at
  rationale: Pinananatili ng “naroon siya” ang biglaang pagtuklas at pagkagulat na dala ng וְהִנֵּה, nang hindi gumagamit ng di-likas na “masdan.”
- source_word: עִם נְבִאִים
  choice: kasama ng mga propeta
  rationale: Tuwirang pinananatili ang kahulugan ng עִם na “kasama,” at naipagkakaiba ito sa בַּנְּבִיאִים sa huling tanong.
- source_word: נִבָּא
  choice: nagpapahayag bilang propeta
  rationale: Ipinahihiwatig nito ang aktuwal at nagpapatuloy na gawaing propetiko, ngunit hindi ipinapalagay na permanenteng hinirang si Saul sa katungkulan ng propeta.
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: sa isa’t isa
  rationale: Ito ang natural na distributibong idyoma sa Tagalog para sa pag-uusap ng mga taong naroon; hindi kailangang gawing tahasang panlalaki ang gramatikal na anyong Hebreo.
- source_word: מַה זֶּה הָיָה לְבֶן קִישׁ
  choice: Ano ang nangyari sa anak ni Kish?
  rationale: Likas na ipinahahayag ang pagkagulat sa pagbabago kay Saul nang walang dagdag na interpretasyon.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִים
  choice: Pati ba si Saul ay kabilang na sa mga propeta?
  rationale: Ang “pati ba” ay natural na naghahatid ng nakakagulat na diwa ng הֲגַם; ang “kabilang” ay angkop sa בַּנְּבִיאִים. Ipinaliliwanag sa talababa ang posibleng implikasyon ng “na.”
theological_decisions:
- issue: Gawaing propetiko kumpara sa permanenteng katungkulan
  choice: nagpapahayag bilang propeta kasama ng mga propeta
  alternative: nasa propetikong silakbo kasama ng mga propeta; naging propeta kasama nila
  rationale: Iniuulat ng teksto ang ginagawang propetiko ni Saul ngunit hindi nito tahasang nilulutas kung nagkaroon siya ng permanenteng katungkulan. Iniiwasan din ng salin ang pagtakda na isa lamang itong silakbo.
- issue: Pagkabilang ni Saul sa mga propeta
  choice: kabilang na sa mga propeta
  alternative: kasama rin ba si Saul sa mga propeta
  rationale: Pinananatili ang retorikal na tanong at pagkagulat. Ang “na” ay natural sa Tagalog ngunit maaaring magpahiwatig ng bagong kalagayan, kaya nililinaw sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nagpapahayag bilang propeta” upang maging malinaw ang kilos nang hindi ipinapalagay ang permanenteng tungkulin; pinanatili ang pangalang “Kish” ayon sa karaniwang anyong biblikal.
