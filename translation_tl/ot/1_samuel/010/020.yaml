id: 1SA.10.20
reference: 1 Samuel 10:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּקְרֵ֣ב שְׁמוּאֵ֔ל אֵ֖ת כָּל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט בִּנְיָמִֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/020.yaml
  text: Then Samuel brought near all the tribes of Israel[a], and the tribe of Benjamin was taken.
translation:
  language: tl
  text: Pagkatapos, pinalapit ni Samuel ang lahat ng lipi ng Israel, at ang lipi ni Benjamin ang nabunot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nakuha” o “nahuli”; dito, tumutukoy ito sa pagkakapili sa pamamagitan ng palabunutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: pinalapit
  rationale: Ang Hiphil ng קרב ay nangangahulugang magpalapit o magharap. Ang “pinalapit” ay natural sa Filipino at pinananatili ang larawan ng paglapit ng mga lipi para sa pagpili.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Karaniwang anyo ng pangalang ito sa Filipino.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ang lahat ng lipi ng Israel
  rationale: Tuwirang inilalahad ang kabuuang saklaw ng parirala at gumagamit ng likas na ayos sa Filipino.
- source_word: וַיִּלָּכֵד
  choice: ang nabunot
  rationale: Bagaman literal na “nahuli” o “nakuha” ang Niphal ng לכד, sa kontekstong ito tumutukoy ito sa pagkakapili sa pamamagitan ng palabunutan. Ang “nabunot” ay malinaw at natural sa Filipino habang pinananatili ang paraan ng pagpili.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: ang lipi ni Benjamin
  rationale: Likas na salin sa Filipino para sa liping kaugnay ng ninunong si Benjamin.
theological_decisions:
- issue: Ang di-tahasang tagapagpasiya sa palabunutan
  choice: Hindi tinukoy kung sino ang pumili; ginamit ang pasibong “nabunot.”
  alternative: “pinili ng PANGINOON”
  rationale: Pasibo ang Hebreo at hindi tahasang binabanggit ang Diyos sa talatang ito. Hindi idinagdag ang isang teolohikal na tagaganap na wala sa mismong teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “lipi” bilang karaniwang terminong biblikal at ang “nabunot” upang natural na maipahayag ang sagradong pagpili sa pamamagitan ng palabunutan.
