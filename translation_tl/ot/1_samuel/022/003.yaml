base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/003.yaml
  text: Then David went from there to Mizpeh of Moab[a], and he said to the king of Moab[b], “Please let my father and my mother come out and stay with you until I know what God will do for me.”
translation:
  language: tl
  text: Pagkatapos, umalis si David mula roon at pumunta sa Mizpe ng Moab. Sinabi niya sa hari ng Moab, “Nakikiusap ako, pahintulutan ninyong pumunta sa inyo ang aking ama at ina at manatili sa piling ninyo[a] hanggang sa malaman ko kung ano ang gagawin ng Diyos para sa akin[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pahintulutan ninyong lumabas ang aking ama at ina papunta sa inyo.” Literal na “lumabas” ang pandiwang Hebreo; sa konteksto, ang kahilingan ay pumunta sila sa hari ng Moab upang manatili sa kanyang pangangalaga.
    reason: lexical_alternative
  - marker: b
    text: O “kung ano ang gagawin ng Diyos sa akin” o “kung paano ako pakikitunguhan ng Diyos.” Maaaring saklawin ng Hebreo ang mga kahulugang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד מִשָּׁם
  choice: Pagkatapos, umalis si David mula roon at pumunta
  rationale: Ang wayyiqtol ng הלך ay nagsasalaysay ng kasunod na pagkilos. Ang “umalis ... at pumunta” ay likas sa Filipino at malinaw na ipinahihiwatig ang pag-alis mula sa dating lugar at pagpunta sa Moab.
- source_word: מִצְפֵּה מוֹאָב
  choice: Mizpe ng Moab
  rationale: Pangalan ito ng lugar; ang “Mizpe” ay malapit sa patinig ng tekstong Masoretiko, at nililinaw ng “ng Moab” ang kaugnayan nito sa lupain.
- source_word: מֶלֶךְ מוֹאָב
  choice: hari ng Moab
  rationale: Tuwirang katumbas ng construct phrase na tumutukoy sa pinunong kinausap ni David.
- source_word: יֵצֵא נָא
  choice: Nakikiusap ako, hayaan ninyong umalis ... at manatili
  rationale: Pinananatili ng “umalis” ang literal na diwa ng יצא, samantalang ang “at manatili” ay natural na naghahayag ng praktikal na layunin ng kahilingan. Ipinapahayag ng “Nakikiusap ako” ang magalang na particle na נָא.
- source_word: אָבִי וְאִמִּי
  choice: aking ama at ina
  rationale: Pinananatili ang tahasang pagbanggit sa dalawang magulang sa halip na paikliin bilang “mga magulang ko.”
- source_word: אִתְּכֶם
  choice: sa piling ninyo
  rationale: Likas na Filipino para sa pananatili sa pangangalaga o kasama ng kausap. Ang “ninyo” ay nagpapanatili sa anyong maramihan ng Hebreo, na maaaring sumaklaw sa hari at sa kanyang sambahayan o hukuman.
- source_word: עַד אֲשֶׁר אֵדַע
  choice: hanggang sa malaman ko
  rationale: Natural at malapit na katumbas ng sugnay na nagtatakda sa haba ng pananatili.
- source_word: מַה יַּעֲשֶׂה לִּי אֱלֹהִים
  choice: kung ano ang gagawin ng Diyos para sa akin
  rationale: Ang לִי ay maaaring mangahulugang “para sa akin,” “sa akin,” o “tungkol sa akin.” Ang “para sa akin” ay natural sa konteksto ng paghihintay ni David sa gagawin ng Diyos, habang inilalagay sa talababa ang tunay na lawak ng Hebreo.
theological_decisions:
- issue: Pagpapakahulugan sa אֱלֹהִים sa pananalita ni David
  choice: Diyos
  alternative: mga diyos; isang diyos
  rationale: Bagaman anyong maramihan ang אֱלֹהִים, ang pandiwang isahan at ang konteksto ay tumutukoy sa Diyos ng Israel. Kaya ang “Diyos” ang wastong salin nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Saklaw ng לִי sa kilos ng Diyos
  choice: para sa akin
  alternative: sa akin; tungkol sa akin
  rationale: Hindi ganap na tinutukoy ng Hebreo kung ang diin ay tulong, mangyayari kay David, o pakikitungo ng Diyos sa kanya. Pinili ang natural na pangunahing pagbasa ngunit pinanatili ang mga alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magalang na “ninyo” dahil maramihan ang panghalip sa Hebreo at hari ang kausap. Iniwasan ang sobrang literal na ayos na magiging alanganin sa Filipino, ngunit pinanatili sa pangunahing teksto ang kilos na “umalis” at sa talababa ang ambiguwidad ng יֵצֵא at לִי.
