base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/001.yaml
  text: So David went from there and escaped to the cave of Adullam. When his brothers and all his father's household heard[a], they went down there to him.
translation:
  language: tl
  text: Umalis si David doon at nakatakas[a] patungo sa kuweba ng Adulam. Nang mabalitaan ng mga kapatid niyang lalaki at ng buong sambahayan ng kanyang ama, bumaba sila roon kay David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tumakas.” Maaaring ipahiwatig ng pandiwang Hebreo ang pagtakas o ang matagumpay na pagkaligtas mula sa panganib.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: umalis doon
  rationale: Likas na salaysay sa Filipino para sa pag-alis ni David mula sa naunang lugar; malinaw nitong pinagsasama ang kilos at pinanggalingan.
- source_word: וַיִּמָּלֵט
  choice: nakatakas
  rationale: Ang nifal ng מלט ay maaaring tumukoy sa pagtakas na nagtagumpay o sa pagkaligtas mula sa panganib. Pinananatili ng “nakatakas” ang resultang diwa nang hindi ipinapalagay na ang kuweba mismo ang kanlungan.
- source_word: אֶל מְעָרַת עֲדֻלָּם
  choice: patungo sa kuweba ng Adulam
  rationale: Tuwirang ipinapahayag ang direksiyon at ang construct phrase na tumutukoy sa kilalang kuweba ng Adulam.
- source_word: וַיִּשְׁמְעוּ
  choice: nang mabalitaan iyon
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa pagkarinig nila ng balita tungkol sa kinaroroonan o pagtakas ni David. Ang “mabalitaan” ay natural sa Filipino, habang ang “iyon” ay kumakatawan sa ipinahihiwatig ngunit hindi tahasang binanggit na layon.
- source_word: אֶחָיו
  choice: kanyang mga kapatid
  rationale: Ang panlalaking maramihan sa kontekstong ito ay tumutukoy sa mga kapatid na lalaki ni David; sa Filipino, ang karaniwang “mga kapatid” ay natural at hindi kailangang dagdagan ng “na lalaki” maliban kung kailangan sa konteksto.
- source_word: כָל בֵּית אָבִיו
  choice: buong sambahayan ng kanyang ama
  rationale: Ang בֵּית אָבִיו ay tumutukoy sa yunit ng pamilya o sambahayan, hindi lamang sa gusaling tinitirhan. Ang “sambahayan” ay malinaw, marangal, at kasalukuyang Filipino.
- source_word: וַיֵּרְדוּ
  choice: bumaba sila
  rationale: Pinananatili ang tahasang pababang direksiyon ng ירד, na malamang ay topograpikal.
- source_word: אֵלָיו שָׁמָּה
  choice: roon upang puntahan siya
  rationale: Natural na ayos sa Filipino na nagpapanatili kapwa sa lokasyong “roon” at sa direksiyon patungo kay David.
