  text: וַ/יַּ֜עַן דֹּאֵ֣ג הָ/אֲדֹמִ֗י וְ/ה֛וּא נִצָּ֥ב עַל עַבְדֵֽי שָׁא֖וּל וַ/יֹּאמַ֑ר רָאִ֨יתִי֙ אֶת בֶּן יִשַׁ֔י בָּ֣א נֹ֔בֶ/ה אֶל אֲחִימֶ֖לֶךְ בֶּן אֲחִטֽוּב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/009.yaml
  text: Then Doeg the Edomite[a], who was standing among Saul’s servants, answered and said, “I saw the son of Jesse coming to Nob, to Ahimelech son of Ahitub.”
translation:
  language: tl
  text: Sumagot si Doeg na Edomita[a], na nakatayo kasama ng mga lingkod ni Saul, at sinabi, “Nakita ko ang anak ni Jesse na papunta sa Nob, kay Ahimelec na anak ni Ahitub.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na siyang nakatalaga sa pamamahala sa mga lingkod ni Saul.” Maaaring tumukoy ang pariralang Hebreo sa kinaroroonan ni Doeg kasama ng mga lingkod ni Saul o sa tungkulin niyang mamahala sa kanila.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Karaniwang panimulang pandiwa ito sa tugon sa salaysay; pinananatili ng “Sumagot” ang Hebreong paraan ng pagpapahayag kahit walang tahasang tanong kaagad bago nito.
- source_word: הָאֲדֹמִי
  choice: na Edomita
  rationale: Tumutukoy ito sa lahi o bayang pinagmulan ni Doeg; natural sa modernong Tagalog ang appositional na “si Doeg na Edomita.”
- source_word: וְהוּא נִצָּב עַל עַבְדֵי שָׁאוּל
  choice: na nakatayo kasama ng mga lingkod ni Saul
  rationale: Maaaring mangahulugan ang נִצָּב ng “nakatayo” o “nakatalaga,” at ang עַל ay maaaring magpahiwatig ng lokasyon kaugnay ng pangkat o pamamahala rito. Pinipili ng pangunahing teksto ang pisikal na presensya nang hindi ipinapalagay ang opisyal na ranggo; inilalagay sa talababa ang alternatibo.
- source_word: עַבְדֵי שָׁאוּל
  choice: mga lingkod ni Saul
  rationale: Direktang katumbas ito ng Hebreo at angkop din sa konteksto ng maharlikang sambahayan, nang hindi tiyakang ginagawang mga opisyal o tagapaglingkod sa korte.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Pinananatili ang ikalawang pandiwa ng pormulang Hebreo na “sumagot at sinabi,” sa natural ngunit tapat na anyong Tagalog.
- source_word: רָאִיתִי
  choice: Nakita ko
  rationale: Ang ganap na anyo ay nag-uulat ng isang nakaraang nasaksihang pangyayari; natural ang karaniwang aspektong Tagalog na “Nakita ko.”
- source_word: בֶּן יִשַׁי
  choice: ang anak ni Jesse
  rationale: Sinasadya ng Hebreo ang katawagang batay sa relasyon sa halip na pangalang David, kaya pinananatili ang retorikal na epekto nito.
- source_word: בָּא
  choice: na pumunta
  rationale: Inilalarawan ng participle ang kilos na nasaksihan. Sa konteksto ng natapos na pagpunta sa isang destinasyon, malinaw at natural ang “na pumunta,” bagaman maaari ring isiping “papunta.”
- source_word: נֹבֶה
  choice: sa Nob
  rationale: Ang directional he ay nagpapahiwatig ng kilos patungo sa Nob; sa Tagalog, natural itong ipinapahayag sa “sa Nob” kasunod ng “pumunta.”
- source_word: אֶל אֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: kay Ahimelec na anak ni Ahitub
  rationale: Ang אֶל ay tumutukoy sa taong nilapitan o pinuntahan; “kay” ang likas na panandang Tagalog para sa personal na destinasyon.
