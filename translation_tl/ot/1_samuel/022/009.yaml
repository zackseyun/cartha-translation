translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang ginamit. Pinanatili ang Hebreong dobleng pormula na “Sumagot ... at sinabi,” ang katawagang “anak ni Jesse,” at ang kalabuan kung si Doeg ay naroon lamang sa gitna ng mga lingkod o nakatalaga sa pamamahala sa kanila.
