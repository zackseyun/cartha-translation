  text: וַ/יִּשְׁאַל ל/וֹ֙ בַּֽ/יהוָ֔ה וְ/צֵידָ֖ה נָ֣תַן ל֑/וֹ וְ/אֵ֗ת חֶ֛רֶב גָּלְיָ֥ת הַ/פְּלִשְׁתִּ֖י נָ֥תַן לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/010.yaml
  text: And he inquired of Yahweh for him[a], and gave him provisions, and gave him the sword of Goliath the Philistine.
translation:
  language: tl
  text: At sumangguni siya kay Yahweh para sa kanya[a], at binigyan niya siya ng mga panustos, at ibinigay niya sa kanya ang espada ni Goliat na Filisteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagtanong siya kay Yahweh para sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל לוֹ בַּיהוָה
  choice: sumangguni siya kay Yahweh para sa kanya
  rationale: Ang שׁאל na may ב at pangalan ng Diyos ay tumutukoy sa paghingi ng patnubay o kasagutan mula sa Diyos. Pinananatili ng “para sa kanya” ang לּוֹ bilang pagkilos para sa kapakanan o alang-alang kay David.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh”; ginagamit ang “kay” dahil personal na pinatutungkulan ang Diyos sa pandiwang “sumangguni.”
- source_word: צֵידָה
  choice: mga panustos
  rationale: Ang צֵידָה ay mga baon o panustos para sa paglalakbay at ikabubuhay; mas malawak at mas tumpak ang “mga panustos” kaysa “pagkain” lamang.
- source_word: נָתַן לוֹ
  choice: binigyan niya siya / ibinigay niya sa kanya
  rationale: Tuwirang ipinahahayag ang pagbibigay sa dalawang sugnay. Bahagyang iniiba ang ayos upang maging natural sa Tagalog habang pinananatili ang pag-uulit ng pandiwang נתן.
- source_word: וְאֵת חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: at ang espada ni Goliat na Filisteo
  rationale: Malinaw at natural nitong pinananatili ang ugnayang paari at ang pagkakakilanlan kay Goliat bilang Filisteo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan mismo na יהוה ang nasa Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng pagsangguni kay Yahweh
  choice: sumangguni siya kay Yahweh para sa kanya
  alternative: nagtanong siya kay Yahweh para sa kanya
  rationale: Ipinahihiwatig ng konstruksyon ang paghiling ng patnubay o tugon mula sa Diyos, ngunit hindi dinaragdagan ng teksto kung anong ritwal o paraan ang ginamit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkakasunod na paratang at ang pag-uulit ng pagbibigay sa Hebreo, ngunit inayos ang mga panghalip upang maging likas sa Tagalog.
