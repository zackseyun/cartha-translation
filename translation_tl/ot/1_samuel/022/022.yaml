base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/022.yaml
  text: David said to Abiathar[a], “I knew on that day, when Doeg the Edomite was there, that he would surely tell Saul[c][b]. I am responsible for all the lives of your father’s house.”
translation:
  language: tl
  text: Sinabi ni David kay Abiatar, “Nang araw na iyon, alam ko na na naroon si Doeg na Edomita[a] at tiyak siyang magsusumbong kay Saul[b]. Ako ang may pananagutan sa pagkamatay ng bawat isa sa sambahayan ng iyong ama[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “na naroon si Doeg na Edomita.” Maaaring ipakilala ng pang-ugnay sa Hebreo ang nilalaman ng nalaman ni David sa halip na isang pangyayaring tumutukoy sa panahon.'
    reason: lexical_alternative
  - marker: b
    text: Gumagamit ang Hebreo ng infinitive absolute kasama ng pandiwang may hangganan—sa literal, “sa pagsasabi ay magsasabi siya”—upang idiin na tiyak siyang magsusumbong.
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring: “Ako ang naging dahilan ng pagkamatay” o “Ako ang sanhi ng” bawat isa sa sambahayan ng iyong ama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Alam ko
  rationale: Tuwirang ipinapahayag ng perpektong anyo ng ידע ang dati nang kaalaman ni David; natural at malinaw ang “Alam ko” sa makabagong Tagalog.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Pinananatili ang pagtukoy sa isang tiyak na araw sa nakaraan sa natural na anyong Tagalog.
- source_word: כִּי שָׁם דויג הָאֲדֹמִי
  choice: nang naroon si Doeg na Edomita
  rationale: Binabasa ang כִּי bilang pangyayaring kaugnay ng panahong iyon, habang inilalahad sa talababa ang posibleng pagbasa rito bilang nilalaman ng nalaman ni David.
- source_word: כִּי הַגֵּד יַגִּיד לְשָׁאוּל
  choice: na tiyak na magsusumbong siya kay Saul
  rationale: Ang infinitive absolute na kasunod ng pandiwang may hangganan ay nagbibigay-diin sa katiyakan ng kilos; ipinahahayag ito ng “tiyak na.” Ang “magsusumbong” ay angkop sa pag-uulat kay Saul nang walang idinaragdag na tahasang layon na wala sa Hebreo.
- source_word: אָנֹכִי
  choice: Ako
  rationale: Pinananatili ng hiwalay na panghalip ang diin sa personal na pag-ako ni David.
- source_word: סַבֹּתִי
  choice: ako ang may pananagutan
  rationale: Ipinahahayag nito ang pag-ako ni David sa pagiging sanhi o responsable sa nangyari, sa paraang likas at malinaw sa Tagalog.
- source_word: בְּכָל נֶפֶשׁ
  choice: sa pagkamatay ng bawat isa
  rationale: Ang נֶפֶשׁ ay tumutukoy rito sa bawat taong buhay na nawala; nililinaw ng konteksto ang pagkamatay nang hindi ginagamit ang “kaluluwa,” na maaaring magbigay ng di-angkop na espirituwalisadong kahulugan.
- source_word: בֵּית אָבִיךָ
  choice: sa sambahayan ng iyong ama
  rationale: Ang “sambahayan” ay natural na katumbas ng idyomang Hebreo para sa pamilya o angkan ng ama.
theological_decisions:
- issue: Lawak ng pag-ako ni David sa pananagutan
  choice: Ako ang may pananagutan sa pagkamatay ng bawat isa
  alternative: Ako ang dahilan ng pagkamatay ng bawat isa / Ako ang may kagagawan sa bawat buhay
  rationale: Hindi nilulutas ang pahayag bilang tiyak na legal o moral na hatol; ipinakikita lamang ang mariing personal na pag-ako ni David sa pananagutan, habang inilalagay sa talababa ang mas tuwirang mga posibleng salin ng pambihirang pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sambahayan” sa halip na literal na “bahay” upang maipahayag ang pamilya o angkan, at “Edomita” bilang karaniwang anyo ng katawagang etniko. Napanatili sa mga talababa ang sintaktikong kalabuan ng unang כִּי at ang saklaw ng pananagutan sa סַבֹּתִי.
