base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/018.yaml
  text: Then the king said to Doeg[a], “Turn and strike down the priests.” So Doeg the Edomite turned and struck down the priests, and on that day he put to death eighty-five men who wore a linen ephod.
translation:
  language: tl
  text: Pagkatapos, sinabi ng hari kay Doeg, “Bumaling ka at salakayin ang mga pari.” Kaya bumaling si Doeg na Edomita at sinalakay ang mga pari. Noong araw na iyon, pinatay niya ang walumpu't limang lalaking nagsusuot ng efod na lino.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakasuot ng linong efod.” Ang efod ay isang kasuotang pangpari.
    reason: lexical_and_cultural_clarification
lexical_decisions:
- source_word: סֹב
  choice: Humarap ka
  rationale: Sa utos na ito, ang pandiwa ay tumutukoy sa paglingon o pagharap ni Doeg sa mga pari upang isagawa ang iniutos. Mas natural sa Filipino ang “Humarap ka” kaysa literal na “Bumaling ka,” at nananatili ang biglaan at tuwirang himig.
- source_word: וּפְגַע / וַיִּפְגַּע
  choice: salakayin / sinalakay
  rationale: Malawak ang saklaw ng פגע at maaari itong tumukoy sa marahas na pagsalakay o pananakit. Pinananatili ng “salakayin” ang pagkakaiba nito sa וַיָּמֶת, na tahasang nagsasaad ng pagpatay sa kasunod na sugnay.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Tuwirang salin ng tiyak na pangngalang maramihan.
- source_word: הָאֲדֹמִי
  choice: na Edomita
  rationale: Likas na Filipino na paglalarawan sa etnikong pagkakakilanlan ni Doeg.
- source_word: וַיָּמֶת
  choice: pinatay niya
  rationale: Ang Hiphil ng מות ay causative at malinaw na tumutukoy sa pagpatay. Natural sa Filipino ang “pinatay niya,” habang ang naunang “sinalakay” ay nagpapanatili sa pagkakaiba ng kilos at kinalabasan.
- source_word: שְׁמֹנִים וַחֲמִשָּׁה אִישׁ
  choice: walumpu't limang lalaki
  rationale: Ang איש kasunod ng bilang ay tumutukoy rito sa mga lalaking pari; ang “lalaki” ay tiyak at natural.
- source_word: נֹשֵׂא אֵפוֹד בָּד
  choice: mga lalaking nagsusuot ng efod na lino
  rationale: Kapag kasuotan ang layon, maaaring mangahulugan ang נשא na isuot. Ang efod ay kasuotang pangpari, at ang בָּד ay lino.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Pagkatapos, sinabi ng hari
  rationale: Isinusulong ng waw-consecutive ang salaysay; malinaw at natural na ipinahihiwatig ng “Pagkatapos” ang pagkakasunod-sunod.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “salakayin” upang hindi agad ipakahulugan ang פגע bilang mismong pagpatay, sapagkat hiwalay na binubuod ng sumunod na pandiwa ang nakamamatay na kinalabasan. Pinanatili ang terminong “efod” at nilinaw ito sa talababa.
