  source_fidelity: Malinaw na naipapahayag ng draft ang utos ng hari, ang marahas na pagkilos ni Doeg laban sa mga pari, at ang bilang ng walumpu't limang lalaking may suot na efod na lino. Gayunman, ang “bumaling” ay mas tumpak na katumbas ng parehong anyo ng סֹב kaysa “humarap,” na maaaring mangahulugang humarap lamang at hindi kinakailangang bumaling.
  naturalness: Makabago at malinaw ang rehistro. Mas natural at magkakatugma ang pag-uulit ng “bumaling” sa utos at sa salaysay; ang “Noong araw na iyon” ay mas karaniwang pang-abay na pambungad sa pangungusap kaysa “Nang araw na iyon” sa ganitong ayos.
  terminology: Ang “mga pari,” “Edomita,” “efod,” at “lino” ay angkop. Ang “salakayin” ay maingat na pinananatili ang saklaw ng פגע at hindi agad ipinapantay sa kasunod na “pinatay.”
