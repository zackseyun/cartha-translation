- from: Pagkatapos, sinabi ng hari kay Doeg, “Humarap ka at salakayin ang mga pari.” Kaya humarap si Doeg na Edomita at sinalakay ang mga pari. Nang araw na iyon, pinatay niya ang walumpu't limang lalaking nagsusuot ng efod na lino.[a]
  to: Pagkatapos, sinabi ng hari kay Doeg, “Bumaling ka at salakayin ang mga pari.” Kaya bumaling si Doeg na Edomita at sinalakay ang mga pari. Noong araw na iyon, pinatay niya ang walumpu't limang lalaking nagsusuot ng efod na lino.[a]
  rationale: Pinalitan ang “humarap” ng “bumaling” upang mas tumpak na maipakita ang pandiwang Hebreo para sa paglingon o pagbalin ni Doeg sa iniutos na pagkilos, kapwa sa utos at sa pagsasalaysay. Inayos din ang pang-abay na panahon para sa mas likas na modernong Filipino. Hindi binago ang maingat na pagkakaiba ng “salakayin” at “pinatay.”
