base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/016.yaml
  text: But the king said[a], “You shall surely die, Ahimelech[b], you and all your father's house.”
translation:
  language: tl
  text: Ngunit sinabi ng hari, “Tiyak na mamamatay ka, Ahimelec[a]—ikaw at ang buong sambahayan ng iyong ama.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalan ay maaari ring baybayin na “Ahimelek.”
    reason: transliteration_alternative
  - marker: b
    text: Ang “sambahayan ng iyong ama” ay tumutukoy sa sambahayan o angkan sa panig ng ama.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sinabi
  rationale: Karaniwang salaysay na anyo ng אמר; natural itong isalin bilang “sinabi” sa makabagong Tagalog.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tiyak na pangngalang may pantukoy, kaya tuwirang “ang hari.”
- source_word: מוֹת תָּמוּת
  choice: Tiyak na mamamatay ka
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay ng matinding pagdidiin. Pinananatili ng “tiyak na” ang katiyakan at bigat ng hatol sa natural na Tagalog.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimelec
  rationale: Tinumbasan ang personal na pangalan ayon sa nakaugaliang anyong Tagalog at sa ponetikong halaga ng pangwakas na Hebreong kaf.
- source_word: אַתָּה
  choice: ikaw
  rationale: Ang tahasang panghalip ay mariin; pinanatili ito pagkatapos ng pangalan upang ihayag ang diin ng Hebreo.
- source_word: וְכָל
  choice: at ang buong
  rationale: Likas na ipinahahayag ang saklaw ng כָּל sa pariralang “ang buong,” na isinasama ang kabuuan ng sambahayan.
- source_word: בֵּית אָבִיךָ
  choice: sambahayan ng iyong ama
  rationale: Ang בֵּית אָב ay tumutukoy hindi lamang sa gusali kundi sa sambahayan o angkan sa panig ng ama. Ang “sambahayan” ay natural at nagpapanatili ng sinaunang konseptong panlipunan.
theological_decisions:
- issue: Lakas at uri ng pahayag na מוֹת תָּמוּת
  choice: Tiyak na mamamatay ka
  alternative: Dapat kang mamatay / Walang pagsalang mamamatay ka
  rationale: Hindi tahasang nilulutas kung ang diin ay pangunahing prediksiyon o hudisyal na hatol; ang konteksto at pormang Hebreo ay kapuwa nasasalamin sa mariing ngunit hindi labis na interpretatibong salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tiyak na mamamatay ka” upang likas na maipahayag ang matinding pagdidiin ng Hebreo, at “sambahayan” upang mapanatili ang kulturang kahulugan ng בֵּית אָב nang hindi ito ipakahulugang gusali lamang.
