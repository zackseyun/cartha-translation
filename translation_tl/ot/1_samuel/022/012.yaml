base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/012.yaml
  text: Then Saul said, “Listen, please, son of Ahitub.” And he answered, “Here I am, my lord.”
translation:
  language: tl
  text: Sinabi ni Saul, “Makinig ka muna, anak ni Ahitub.” Sumagot siya, “Narito ako, panginoon ko.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע נָא
  choice: Makinig ka
  rationale: Ang שְׁמַע ay tuwirang utos na ‘makinig’; ang נָא ay nagpapalambot sa pakiusap o utos, na likas na naipahihiwatig rito ng magalang ngunit makapangyarihang tono ng hari sa Filipino nang hindi dinaragdagan ng mabigat na ‘pakiusap.’
- source_word: בֶּן אֲחִיטוּב
  choice: anak ni Ahitub
  rationale: Tuwirang salin ng pariralang nagpapakilala kay Ahimelec ayon sa kaniyang ama.
- source_word: הִנְנִי
  choice: Narito ako
  rationale: Karaniwang tugon ng pagiging handa at pagharap sa tumatawag; pinananatili ang maikli at pormal na anyo ng Hebreo.
- source_word: אֲדֹנִי
  choice: panginoon ko
  rationale: Tawag-galang sa taong may kapangyarihan, hindi ang banal na pangalang YHWH; maliit na titik ang ginamit upang maiwasang ipakahulugang pagtukoy sa Diyos.
theological_decisions:
- issue: Kahulugan ng אֲדֹנִי
  choice: panginoon ko
  alternative: mahal na hari / ginoo ko
  rationale: Pinananatili ang literal na katawagang nagpapahayag ng pagpapasakop sa hari, habang malinaw sa maliit na titik na hindi ito banal na titulo.
translation_notes:
  register: Modernong Filipino na maikli, marangal, at angkop sa usapan sa maharlikang hukuman. Hindi ginawang tahasang ‘pakiusap’ ang נָא dahil maaaring maging pananda rin ito ng magalang o pinalambot na utos sa kontekstong ito.
