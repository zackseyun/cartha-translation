base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/013.yaml
  text: Saul said to him[a], “Why have you and the son of Jesse conspired against me, by giving him bread and a sword and by inquiring of God for him, so that he has risen against me to lie in wait[b], as on this day?”
translation:
  language: tl
  text: Sinabi ni Saul sa kanya, “Bakit kayo nagsabwatan laban sa akin—ikaw at ang anak ni Jesse—sa pagbibigay mo sa kanya ng tinapay at tabak, at sa pagsangguni mo sa Diyos para sa kanya, upang bumangon siya laban sa akin upang tambangan ako, gaya ng nangyayari ngayon?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: kayo nagsabwatan
  rationale: Ang pandiwa ay tumutukoy sa pakikipagsabwatan laban sa isang pinuno; natural at malinaw sa modernong Tagalog ang “nagsabwatan.”
- source_word: בֶן־יִשָׁי
  choice: ang anak ni Jesse
  rationale: Pinananatili ang mapanlayong pagtukoy ni Saul kay David sa pamamagitan ng pangalan ng kanyang ama, sa halip na palitan ito ng “David.”
- source_word: בְּתִתְּךָ לוֹ לֶחֶם וְחֶרֶב
  choice: sa pagbibigay mo sa kanya ng tinapay at tabak
  rationale: Ipinahahayag ng parirala ang batayan o paraan ng paratang ni Saul; pinananatili rin ang isahang “mo,” na nakatuon kay Ahimelec.
- source_word: וְשָׁאוֹל לוֹ בֵּאלֹהִים
  choice: at sa pagsangguni mo sa Diyos para sa kanya
  rationale: Sa kontekstong makasaserdote, ang parirala ay tumutukoy sa paghingi ng patnubay mula sa Diyos. Ang “pagsangguni” ay natural ngunit may pormal na relihiyosong diwa.
- source_word: בֵּאלֹהִים
  choice: sa Diyos
  rationale: Ang tekstong Hebreo ay gumagamit ng אֱלֹהִים, hindi ng banal na pangalang YHWH, kaya “Diyos” ang tumpak na katumbas.
- source_word: לָקוּם אֵלַי
  choice: upang bumangon siya laban sa akin
  rationale: Pinananatili ng “upang” ang maaaring layunin o bunga sa paratang ni Saul, nang hindi lubusang nilulutas ang sintaktikong tensiyon.
- source_word: לְאֹרֵב
  choice: at tambangan ako
  rationale: Ang infinitibong mula sa ארב ay nangangahulugang mag-abang o manambang. Nilinaw ng “ako” ang likas na layon sa Tagalog ayon sa konteksto, habang ang talababa ay nagpapanatili ng mas literal na estruktura.
- source_word: כַּיּוֹם הַזֶּה
  choice: gaya ng nangyayari sa araw na ito
  rationale: Ipinahihiwatig ng idyoma ang kasalukuyang kalagayan na itinuturing ni Saul na hayag na ngayon; ang salin ay mas natural kaysa sa literal na “gaya ng araw na ito.”
theological_decisions:
- issue: Pagtukoy sa Diyos sa בֵּאלֹהִים
  choice: Diyos
  alternative: PANGINOON
  rationale: אֱלֹהִים ang nasa pinagmulang teksto, hindi YHWH; kaya hindi ipinapasok ang pangalang tipan na wala rito.
- issue: Layunin o bunga ng לָקוּם אֵלַי
  choice: upang bumangon siya laban sa akin
  alternative: kaya bumangon siya laban sa akin
  rationale: Maaaring magpahiwatig ang infinitibo ng layunin o bunga. Pinananatili ng “upang” ang pananaw ng paratang ni Saul at hindi ginagawang tiyak na katotohanan ang kanyang alegasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang “anak ni Jesse” at “Diyos” ayon sa Hebreo. Ginamit ang “tabak” para sa biblikal na register at “nagsabwatan” para sa pampolitikang diwa ng paratang.
