base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/002.yaml
  text: And everyone in distress[a], everyone who was in debt, and everyone bitter in soul gathered to him, and he became commander over them[b]. About four hundred men were with him.
translation:
  language: tl
  text: At nagtipon sa kaniya ang bawat lalaking nasa kagipitan, ang bawat lalaking may pinagkakautangan[a], at ang bawat lalaking mapait ang kalooban[b]. Siya ang naging pinuno nila. Kasama niya ang humigit-kumulang apatnaraang lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang bawat lalaking may pinagkakautangan” o “may tagasingil”; ibig sabihin, mga lalaking may utang na sinisingil.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mapait ang kaluluwa,” isang idyoma para sa matinding kapaitan o dalamhati sa kalooban.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ אֵלָיו
  choice: nagtipon sa kaniya
  rationale: Tuwirang ipinapahayag ang sama-samang paglapit kay David; natural ito sa modernong Tagalog at hindi dinaragdagan ng diwang 'sa paligid niya.'
- source_word: כָּל אִישׁ מָצוֹק
  choice: ang bawat lalaking nasa kagipitan
  rationale: Ang מָצוֹק ay tumutukoy sa matinding hirap o gipit na kalagayan. Pinananatili ng 'bawat lalaking' ang paulit-ulit na distributibong anyo at ang panlalaking sanggunian sa pangkat ni David.
- source_word: אֲשֶׁר לוֹ נֹשֶׁא
  choice: may pinagkakautangan
  rationale: Mas malapit ito sa eliptikong Hebreong 'may creditor/tagasingil' kaysa sa simpleng 'may utang,' ngunit natural pa rin sa Tagalog; nililinaw ng talababa ang literal na larawan.
- source_word: מַר נֶפֶשׁ
  choice: may mapait na kalooban
  rationale: Pinananatili ang larawan ng panloob na kapaitan nang hindi ito nililimitahan sa pagkadismaya lamang; ang 'kalooban' ay mas likas kaysa literal na 'kaluluwa' sa idyomang ito.
- source_word: וַיְהִי עֲלֵיהֶם לְשָׂר
  choice: Siya ang naging pinuno nila
  rationale: Ang שַׂר ay maaaring pinuno o kumander. Ang 'pinuno' ay natural at sapat na malawak, habang ang konteksto ang nagpapahiwatig ng pamumuno sa pangkat.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: humigit-kumulang apatnaraang lalaki
  rationale: Ipinakikita ng כְּ ang pagtatantiya. Ang 'lalaki' ay angkop sapagkat mga adultong lalaki sa pangkat ni David ang binibilang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang tatlong-ulit na pariralang 'ang bawat' at ang matalinghagang kapaitan ng panloob na pagkatao, habang iniwasan ang lipas o labis na teknikal na pananalita.
