  text: וַ/יֹּאמֶר֩ גָּ֨ד הַ/נָּבִ֜יא אֶל דָּוִ֗ד לֹ֤א תֵשֵׁב֙ בַּ/מְּצוּדָ֔ה לֵ֥ךְ וּ/בָֽאתָ לְּ/ךָ֖ אֶ֣רֶץ יְהוּדָ֑ה וַ/יֵּ֣לֶךְ דָּוִ֔ד וַ/יָּבֹ֖א יַ֥עַר חָֽרֶת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/005.yaml
  text: Then Gad the prophet said to David[a], “Do not stay in the stronghold. Go and come for yourself to the land of Judah.” So David went and came to the forest of Hereth.
translation:
  language: tl
  text: Pagkatapos, sinabi ng propetang si Gad kay David, “Huwag kang manatili sa kuta. Umalis ka at pumasok sa lupain ng Juda[a].” Kaya umalis si David at pumasok sa kagubatan ng Heret.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pumunta ka sa lupain ng Juda.” Ang pandiwang Hebreo ay maaaring mangahulugang “pumarito/pumunta” o “pumasok,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: propetang
  rationale: Ang נָבִיא ang karaniwang salitang Hebreo para sa propeta; hindi ito ang ibang terminong Hebreo na karaniwang isinasaling ‘tagakita.’
- source_word: לֹא תֵשֵׁב
  choice: Huwag kang manatili
  rationale: Sa konteksto, ang יָשַׁב ay tumutukoy sa pananatili sa isang lugar; malinaw at likas sa makabagong Tagalog ang ‘manatili.’
- source_word: בַּמְּצוּדָה
  choice: sa kuta
  rationale: Ang מְצוּדָה ay isang matibay o mahirap marating na lugar na nagsisilbing kanlungan; maikli at angkop sa konteksto ang ‘kuta.’
- source_word: לֵךְ
  choice: Umalis ka
  rationale: Bagaman literal na ‘humayo/pumunta,’ ipinahihiwatig dito ng utos ang pag-alis ni David sa kuta; natural sa Tagalog ang ‘Umalis ka’ at pinananatili ang hiwalay na kilos bago ang pagpasok sa Juda.
- source_word: וּבָאתָ לְּךָ אֶרֶץ יְהוּדָה
  choice: at pumasok sa lupain ng Juda
  rationale: Ang בוא ay maaaring mangahulugang ‘pumarito/pumunta’ o ‘pumasok.’ Ang ‘pumasok’ ay malinaw na naghahayag ng pagdating sa nasasakupan ng Juda. Idiomatiko ang לְךָ at hindi kailangang tumbasan ng hiwalay na panghalip sa Tagalog; nasa talab ng personal na utos ang diin nito.
- source_word: אֶרֶץ יְהוּדָה
  choice: lupain ng Juda
  rationale: Pinananatili ng ‘lupain’ ang teritoryal na kahulugan ng אֶרֶץ, sa halip na paikliin lamang bilang ‘Juda.’
- source_word: יַעַר חָרֶת
  choice: kagubatan ng Heret
  rationale: Ang יַעַר ay gubat o kagubatan; ang ‘kagubatan’ ay likas na pantukoy sa lugar, at ang Heret ay transliterasyon ng pangalang pantangi.
- source_word: וַיָּבֹא
  choice: pumasok
  rationale: Pinananatili nito ang ugnayan sa naunang בוא at ang diwa ng pagpasok ni David sa isang kagubatang lugar.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang payak na ‘kuta’ at ‘manatili’ para madaling maunawaan, habang pinanatili ang ‘lupain ng Juda’ upang maipahayag ang teritoryal na diwa ng Hebreo.
