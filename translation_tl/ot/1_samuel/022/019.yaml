source:
  edition: WLC
  text: וְ/אֵ֨ת נֹ֤ב עִיר הַ/כֹּֽהֲנִים֙ הִכָּ֣ה לְ/פִי חֶ֔רֶב מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מֵ/עוֹלֵ֖ל וְ/עַד יוֹנֵ֑ק וְ/שׁ֧וֹר וַ/חֲמ֛וֹר וָ/שֶׂ֖ה לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/019.yaml
  text: And Nob[a], the city of the priests, he struck with the edge of the sword, from man to woman, from child to nursing infant, and ox and donkey and sheep, with the edge of the sword.
translation:
  language: tl
  text: At ang Nob, ang lunsod ng mga pari, ay nilipol niya sa pamamagitan ng talim ng tabak—mula sa lalaki hanggang sa babae, mula sa bata hanggang sa sanggol na sumususo, pati ang baka, asno, at tupa—sa pamamagitan ng talim ng tabak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa bibig ng tabak,” isang idyomang nangangahulugang patayin sa pamamagitan ng tabak.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹב
  choice: Nob
  rationale: Pangalan ng lugar; tinumbasan sa karaniwang transliterasyong Filipino.
- source_word: עִיר הַכֹּהֲנִים
  choice: ang lunsod ng mga pari
  rationale: Likas at malinaw na Filipino para sa pariralang naglalarawan sa Nob bilang lunsod na kaugnay ng mga pari.
- source_word: הִכָּה
  choice: nilipol niya
  rationale: Bagaman malawak ang kahulugan ng pandiwang נכה na ‘hampasin,’ malinaw sa pariralang לְפִי חֶרֶב at sa saklaw ng mga biktima na nakamamatay na pagpatay ang tinutukoy. Ang ‘nilipol’ ay natural sa Filipino at naghahatid ng malawakang pagpatay, nang hindi inaalis ang kasunod na larawan ng tabak.
- source_word: לְפִי חֶרֶב / לְפִי חָרֶב
  choice: sa pamamagitan ng talim ng tabak
  rationale: Pinananatili ang konkretong larawan ng Hebreong idyoma, na literal na ‘sa bibig ng tabak’ at nangangahulugang patayin sa pamamagitan ng tabak.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: mula sa lalaki hanggang sa babae
  rationale: Pinananatili ang isahang mga katawagang may kasarian at ang merismong nagpapahayag na walang pinaligtas.
- source_word: מֵעוֹלֵל וְעַד יוֹנֵק
  choice: mula sa bata hanggang sa sanggol na sumususo
  rationale: Ang עוֹלֵל ay maliit na bata at ang יוֹנֵק ay sanggol na sumususo; malinaw na naihahatid ng salin ang saklaw at tindi ng karahasan.
- source_word: וְשׁוֹר וַחֲמוֹר וָשֶׂה
  choice: pati ang baka, asno, at tupa
  rationale: Natural na Filipino para sa talaan ng mga alagang hayop; ang ‘pati’ ay malinaw na nagdurugtong sa mga hayop sa naunang mga biktima.
theological_decisions:
- issue: Mga katawagang may kasarian sa isang merismo
  choice: mula sa lalaki hanggang sa babae
  alternative: mula sa mga lalaki hanggang sa mga babae
  rationale: Sinusunod ang isahang anyo ng Hebreo at pinananatili ang merismong nagsasaad ng kabuuang saklaw; hindi ito ginagawang neutral o binibigyan ng doktrinal na kahulugang wala sa teksto.
- issue: Pagpapanatili ng pormula ng malawakang pagpatay
  choice: Inulit ang ‘sa pamamagitan ng talim ng tabak’ at pinanatili ang pagkakasunod ng mga biktima
  alternative: Banggitin lamang minsan na ‘pinatay sa tabak’
  rationale: Mahalaga sa retorika ng Hebreo ang pag-uulit at ang sunod-sunod na pagbanggit sa tao at hayop; pinananatili nito ang bigat ng ganap na paglipol.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘lunsod’ at ‘tabak’ upang mapanatili ang dignidad ng salaysay, habang ang ‘sanggol na sumususo’ ay tuwiran at madaling maunawaan. Inilagay ang tandang talababa pagkatapos ng ikalawang paglitaw ng idyoma upang ipaliwanag ang parehong parirala.
