  text: כִּי֩ קְשַׁרְתֶּ֨ם כֻּלְּ/כֶ֜ם עָלַ֗/י וְ/אֵין גֹּלֶ֤ה אֶת אָזְנִ/י֙ בִּ/כְרָת בְּנִ֣/י עִם בֶּן יִשַׁ֔י וְ/אֵין חֹלֶ֥ה מִ/כֶּ֛ם עָלַ֖/י וְ/גֹלֶ֣ה אֶת אָזְנִ֑/י כִּ֣י הֵקִים֩ בְּנִ֨/י אֶת עַבְדִּ֥/י עָלַ֛/י לְ/אֹרֵ֖ב כַּ/יּ֥וֹם הַ/זֶּֽה־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/008.yaml
  text: For all of you have conspired against me[a], and no one informs me when my son makes a covenant with the son of Jesse, and none of you is grieved for me or informs me that my son has stirred up my servant against me to lie in wait[d][c][b], as at this day.
translation:
  language: tl
  text: Sapagkat nagsabwatan kayong lahat laban sa akin, at walang nagsasabi sa akin nang makipagtipan ang anak ko sa anak ni Jesse.[a] Walang sinuman sa inyo ang nag-aalala para sa akin[b] o nagsasabi sa akin na inudyukan ng anak ko ang lingkod ko laban sa akin upang tambangan ako,[c] gaya ng nangyayari ngayon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “anak ni Jesse” ay si David. Ginamit ni Saul ang pangalan ng ama ni David sa halip na tawagin siyang David.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “nahahabag sa akin” o “nagmamalasakit sa akin.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “pinakilos ng anak ko ang lingkod ko laban sa akin bilang isang mananambang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: nagsabwatan
  rationale: Sa konteksto, tumutukoy ang pandiwa sa sabwatan o pagtataksil laban kay Saul, hindi lamang sa neutral na pakikipagkaisa.
- source_word: גֹּלֶה אֶת אָזְנִי
  choice: nagsasabi sa akin
  rationale: Ang literal na idyomang Hebreo na “nagbubukas ng aking tainga” ay nangangahulugang naghahayag o nagpapaalam; natural sa modernong Tagalog ang “nagsasabi sa akin.”
- source_word: בִּכְרָת
  choice: nang makipagtipan
  rationale: Ipinakikita ng ב kasama ng infinitive construct ang kalagayan o panahon ng pakikipagtipan; pinananatili ng “nang” ang ugnayang ito nang natural.
- source_word: בְּנִי עִם בֶּן יִשַׁי
  choice: makipagtipan ang anak ko sa anak ni Jesse
  rationale: Pinananatili ang pagtukoy ni Saul kay Jonathan bilang “anak ko” at kay David sa patronimikong “anak ni Jesse,” na may tonong mapaglayo.
- source_word: חֹלֶה ... עָלַי
  choice: nagmamalasakit sa akin
  rationale: Dito, ang חלה ay nagpapahayag ng simpatetikong pag-aalala o pagkabagabag para kay Saul, hindi literal na pagkakasakit.
- source_word: הֵקִים
  choice: ibinangon
  rationale: Ang literal at sadyang hindi ganap na tiyak na “ibinangon” ay maaaring magpahiwatig ng pag-udyok, pagpapakilos, o pagtatalaga laban kay Saul nang hindi labis na nilulutas ang saklaw ng pandiwa.
- source_word: עַבְדִּי
  choice: ang lingkod ko
  rationale: Tinutukoy ni Saul si David bilang tauhan at nasasakupan niya sa maharlikang sambahayan, kaya ang “lingkod” ang angkop kaysa “alipin.”
- source_word: לְאֹרֵב
  choice: upang tambangan ako
  rationale: Ipinapahayag ng anyo mula sa ארב ang pag-aabang na may layuning umatake; malinaw at natural sa Tagalog ang “tambangan ako.”
- source_word: כַּיּוֹם הַזֶּה
  choice: gaya ng nangyayari ngayon
  rationale: Tumutukoy ang idyoma sa kasalukuyang kalagayan, hindi lamang sa isang petsa o araw.
theological_decisions:
- issue: Kung tunay na inudyukan ni Jonathan si David laban kay Saul
  choice: Iniharap ang pahayag bilang paratang ni Saul nang walang dagdag na pagpapatunay ng tagapagsalaysay.
  alternative: Ipaliwanag sa teksto na maling hinala lamang ito ni Saul.
  rationale: Ang talata ay mismong pananalita ni Saul; hindi dapat ipasok sa salin ang hatol na hindi tahasang nasa sugnay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Pinanatili ang paulit-ulit at maparatang na tono ni Saul, gayundin ang patronimikong “anak ni Jesse.” Ang bawat talababa ay may katumbas na marker sa pangunahing teksto.
