  to: Sapagkat nagsabwatan kayong lahat laban sa akin, at walang nagsasabi sa akin nang makipagtipan ang anak ko sa anak ni Jesse.[a] Walang sinuman sa inyo ang nag-aalala para sa akin[b] o nagsasabi sa akin na inudyukan ng anak ko ang lingkod ko laban sa akin upang tambangan ako,[c] gaya ng nangyayari ngayon.”
