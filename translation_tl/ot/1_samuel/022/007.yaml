  text: וַ/יֹּ֣אמֶר שָׁא֗וּל לַֽ/עֲבָדָי/ו֙ הַ/נִּצָּבִ֣ים עָלָ֔י/ו שִׁמְעוּ נָ֖א בְּנֵ֣י יְמִינִ֑י גַּם לְ/כֻלְּ/כֶ֗ם יִתֵּ֤ן בֶּן יִשַׁי֙ שָׂד֣וֹת וּ/כְרָמִ֔ים לְ/כֻלְּ/כֶ֣ם יָשִׂ֔ים שָׂרֵ֥י אֲלָפִ֖ים וְ/שָׂרֵ֥י מֵאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/007.yaml
  text: Then Saul said to his servants who were standing around him, “Listen, please, sons of Benjamin! Will the son of Jesse also give all of you fields and vineyards? Will he make all of you commanders of thousands and commanders of hundreds?”
translation:
  language: tl
  text: Sinabi ni Saul sa mga lingkod niyang nakatayo sa paligid niya, “Makinig kayo, pakiusap, mga anak ni Benjamin! Bibigyan din ba kayong lahat ng anak ni Jesse ng mga bukid at ubasan? Gagawin din ba niya kayong lahat na mga pinuno ng libu-libo at mga pinuno ng daan-daan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: mga lingkod niya
  rationale: Ang עֶבֶד ay maaaring tumukoy sa lingkod o opisyal ng hari; pinananatili ng “mga lingkod” ang malawak na saklaw ng salita sa kontekstong maharlika.
- source_word: הַנִּצָּבִים עָלָיו
  choice: nakatayo sa paligid niya
  rationale: Natural na Filipino para sa mga tauhang nakatayo at nakapaligid kay Saul; hindi ito pinaliit sa ideya lamang ng pagbabantay.
- source_word: שִׁמְעוּ נָא
  choice: Makinig kayo, pakiusap
  rationale: Inilalarawan ng נָא ang pakiusap o panghihikayat, kahit may matalim at mapanuyang tono ang mga kasunod na tanong.
- source_word: בְּנֵי יְמִינִי
  choice: mga anak ni Benjamin
  rationale: Pinananatili ang Hebreong katawagan sa mga kabilang sa lipi ni Benjamin at ang retorikal na diin ni Saul sa kanilang ugnayang pantribo.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת
  choice: mga pinuno ng libu-libo at mga pinuno ng daan-daan
  rationale: Pormal na pinananatili ang mga yunit ng organisasyong militar o administratibo nang hindi nagdaragdag ng tiyak na ranggong hindi tahasang nasa teksto.
theological_decisions:
- issue: Ang retorikal na katangian ng mga tanong ni Saul
  choice: Panatilihin bilang dalawang tanong na nagpapahiwatig ng negatibong sagot
  alternative: Isalin bilang tuwirang pahayag na hindi sila bibigyan o gagawing mga pinuno ni David
  rationale: Ang Hebreo ay gumagamit ng mga tanong upang idiin ang pantribong apela at panggigipit ni Saul; hindi dapat gawing tahasang pahayag ang ipinahiwatig lamang.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “pakiusap” upang katawanin ang נָא, at pinanatili ang “mga anak ni Benjamin” bilang sadyang literal na katawagang pantribo. Ang “anak ni Jesse” ay nagpapanatili sa mapanghamak o umiiwas-sa-pangalan na pagtukoy ni Saul kay David.
