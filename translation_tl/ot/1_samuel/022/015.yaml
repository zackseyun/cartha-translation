base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/015.yaml
  text: Was today the first time that I inquired of God for him? Far be it from me! Let not the king impute anything to his servant or to all my father’s house[a], for your servant knew nothing of all this, whether small or great.
translation:
  language: tl
  text: “Ngayon lang ba ako nagsimulang sumangguni sa Diyos para sa kanya?[a] Malayong mangyari iyon sa akin! Huwag nawang paratangan ng hari ang kanyang lingkod o ang buong sambahayan ng aking ama, sapagkat walang anumang nalalaman ang inyong lingkod tungkol sa lahat ng ito, maliit man o malaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “Ngayon ba ako nagsimulang sumangguni sa Diyos para sa kanya?” Ipinahihiwatig ng retorikal na tanong sa Hebreo na hindi ito ang unang pagkakataong ginawa iyon ni Ahimelec.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַחִלֹּתִי
  choice: Ngayon lang ba ako nagsimulang
  rationale: Pinananatili ang anyo ng retorikal na tanong at ang diwang hindi ito ang unang pagkakataon, habang natural ang “ngayon lang ba” sa makabagong Tagalog.
- source_word: לִשְׁאוֹל לוֹ בֵאלֹהִים
  choice: sumangguni sa Diyos para sa kanya
  rationale: Ang parirala ay tumutukoy sa paghingi ng patnubay o pahayag mula sa Diyos; pinananatili ng “para sa kanya” ang benepisyaryong לּוֹ.
- source_word: חָלִילָה לִּי
  choice: Hinding-hindi!
  rationale: Isang mariing pormula ng pagtanggi; maikli, natural, at matindi sa Tagalog nang hindi nagdaragdag ng paliwanag.
- source_word: אַל יָשֵׂם ... דָבָר
  choice: Huwag nawang paratangan
  rationale: Ipinahahayag ang diwang paglalagay ng isang usapin o kasalanan laban sa isang tao, na malinaw sa konteksto ng paratang ng hari.
- source_word: בְּעַבְדּוֹ
  choice: ang kanyang lingkod
  rationale: Pinananatili ang mapagpakumbabang pagtukoy ni Ahimelec sa sarili sa harap ng hari.
- source_word: בְּכָל בֵּית אָבִי
  choice: ang buong sambahayan ng aking ama
  rationale: Ang “sambahayan” ay likas na salin ng בית־אב at maaaring sumaklaw sa pamilya o angkan nang hindi labis na nililimitahan ang saklaw.
- source_word: לֹא יָדַע עַבְדְּךָ בְּכָל זֹאת
  choice: walang anumang nalalaman ang inyong lingkod tungkol sa lahat ng ito
  rationale: Malinaw na itinatanggi ang anumang kaalaman sa buong usaping ipinaparatang at pinananatili ang magalang na pansariling pagtukoy.
- source_word: דָּבָר קָטֹן אוֹ גָדוֹל
  choice: maliit man o malaki
  rationale: Pinananatili ang Hebreong merismo na sumasaklaw sa lahat, gaano man kaliit o kalaki.
