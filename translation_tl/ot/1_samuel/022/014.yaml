base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/014.yaml
  text: Ahimelech answered the king and said[a], “And who among all your servants is as faithful as David, the king’s son-in-law, who has access to your council[b], and is honored in your house?”
translation:
  language: tl
  text: Sumagot si Ahimelec sa hari, “Sino sa lahat ng iyong mga lingkod ang tapat na gaya ni David—na manugang mo, tumatalima sa iyong utos[a], at iginagalang sa iyong sambahayan[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang pariralang Hebreo. Maaari rin itong mangahulugang “may daan sa iyong sanggunian” o “handang tumugon sa iyong ipinag-uutos.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan” ay maaari ring tumukoy sa maharlikang tahanan o korte ng hari.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן אֲחִימֶלֶךְ אֶת־הַמֶּלֶךְ וַיֹּאמַר
  choice: Sumagot si Ahimelec sa hari
  rationale: Likas na salaysay sa Filipino ang “sumagot”; hindi na kailangang ulitin ang literal na “at sinabi” dahil kalabisan iyon sa kasalukuyang Tagalog.
- source_word: וּמִי בְכָל־עֲבָדֶיךָ
  choice: Sino sa lahat ng iyong mga lingkod
  rationale: Pinananatili ang retorikal na tanong at ang malawak na kahulugan ng עֲבָדִים bilang mga lingkod, nang hindi ito nililimitahan sa mga opisyal.
- source_word: כְדָוִד נֶאֱמָן
  choice: ang tapat na gaya ni David
  rationale: Ang נֶאֱמָן ay tumutukoy sa pagiging mapagkakatiwalaan at matapat; natural sa Filipino ang “tapat na gaya ni David.”
- source_word: וַחֲתַן הַמֶּלֶךְ
  choice: ang manugang ng hari
  rationale: Tuwirang ipinapahayag ang relasyon ni David sa hari; sa konteksto, malinaw na siya ay lalaking manugang.
- source_word: וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: tumatalima sa iyong utos[a]
  rationale: Ipinahahayag nito ang malamang na diwa ng pagiging masunurin o handang tumugon sa ipinag-uutos, habang inilalahad sa talababa ang tunay na leksikal na kalabuan ng parirala.
- source_word: וְנִכְבָּד בְּבֵיתֶךָ
  choice: iginagalang sa iyong sambahayan[b]
  rationale: Ang נִכְבָּד ay “iginagalang” o “pinahahalagahan,” at ang “sambahayan” ay natural na salin ng בֵּיתֶךָ sa konteksto ng maharlikang tahanan, sambahayan, o hukuman.
theological_decisions:
- issue: Kahulugan ng וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: tumatalima sa iyong utos
  alternative: may daan sa iyong sanggunian / kabilang sa mga nakikinig sa iyo
  rationale: Hindi tiyak ang idyomatikong parirala. Pinili sa pangunahing teksto ang diwa ng pagsunod na sinusuportahan ng ugat na may kaugnayan sa pakikinig at pagtalima, ngunit hindi itinago ang alternatibong panghukuman o pangsanggunian.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “Ahimelec” ayon sa karaniwang anyong Filipino ng pangalan. Pinanatili ang retorikal na lakas ng tanong at minarkahan sa talababa ang dalawang mahalagang kalabuan sa Hebreo.
