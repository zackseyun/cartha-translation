translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nito” para malinaw na ang tinutukoy ay ang hari ng Moab, at ang “habang” upang natural na ipahayag ang buong panahong saklaw ng pariralang Hebreo.
