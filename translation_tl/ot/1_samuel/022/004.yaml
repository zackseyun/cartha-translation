  text: He brought them before the king of Moab[a], and they stayed with him all the days that David was in the stronghold.
translation:
  language: tl
  text: Dinala niya sila sa harapan ng hari ng Moab[a], at nanatili silang kasama niya sa buong panahong nasa kuta si David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Inakay niya sila sa harapan ng hari ng Moab.” Ang pandiwang Hebreo ay maaaring mangahulugang pag-akay o pagdadala sa presensiya ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Dinala niya sila
  rationale: Sa konteksto, ipinahihiwatig ng pandiwa na dinala o inakay ni David ang kanyang mga magulang sa presensiya ng hari. Natural sa modernong Tagalog ang “dinala niya sila.”
- source_word: אֶת־פְּנֵי
  choice: sa harapan ng
  rationale: Ang idyoma ay tumutukoy sa pagdadala sa presensiya ng isang tao; malinaw at likas sa Tagalog ang “sa harapan ng.”
- source_word: מֶלֶךְ מוֹאָב
  choice: hari ng Moab
  rationale: Tuwirang salin ng pariralang konstruktong tumutukoy sa pinuno ng Moab.
- source_word: וַיֵּשְׁבוּ עִמּוֹ
  choice: nanatili sila roon sa piling nito
  rationale: Ang ישב ay maaaring mangahulugang tumira o manatili. Ipinapahayag ng “nanatili ... sa piling nito” ang patuloy na paninirahan sa pangangalaga o presensiya ng hari, habang iniiwasan ang malabong panghalip.
- source_word: כָּל יְמֵי הֱיוֹת דָּוִד
  choice: habang si David ay
  rationale: Ang buong pahayag ay isang temporal na konstruksyon na tumutukoy sa kabuuan ng panahong naroon si David; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “habang.”
- source_word: בַּמְּצוּדָה
  choice: nasa kuta
  rationale: Ang מְצוּדָה ay isang pinatibay na lugar ng kanlungan. Ang “kuta” ay maikli, natural, at angkop sa kontekstong militar.
