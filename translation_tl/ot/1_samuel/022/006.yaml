translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nabalitaan” at “hawak” para sa natural na daloy ng salaysay, habang pinanatili sa mga talababa ang tunay na leksikal at heograpikong kalabuan.
