base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/006.yaml
  text: Saul heard that David and the men who were with him had become known[a]. Now Saul was sitting at Gibeah, under the tamarisk tree on the height, with his spear in his hand[b], and all his servants were standing around him.
translation:
  language: tl
  text: Nabalitaan ni Saul na nalaman na ang kinaroroonan ni David at ng mga lalaking kasama niya.[a] Noon, nakaupo si Saul sa Gibea, sa ilalim ng punong tamarisko sa mataas na lugar,[b] hawak ang kanyang sibat, at nakatayo sa paligid niya ang lahat ng kanyang mga lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging hayag si David at ang mga lalaking kasama niya” o “natuklasan si David at ang mga lalaking kasama niya.” Maaaring ipahiwatig ng pandiwang Hebreo na hindi na lingid ang kanilang kinaroroonan.
    reason: lexical_alternative
  - marker: b
    text: O maaaring “sa Rama,” kung ang בָּרָמָה ay ituturing na pangalang-pook na Rama sa halip na karaniwang pangngalang “mataas na lugar.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Nabalitaan
  rationale: Sa salaysay, ang pandiwa ay tumutukoy sa pagtanggap ni Saul ng balita; natural sa modernong Tagalog ang “nabalitaan” kaysa sa literal na “narinig.”
- source_word: כִּי נוֹדַע דָּוִד
  choice: na natuklasan na si David
  rationale: Ang Niphal ng ידע ay maaaring mangahulugang “nalaman” o “natuklasan.” Ipinahihiwatig ng konteksto na hindi na lingid ang kinaroroonan o kalagayan ni David, habang itinatala sa talababa ang saklaw ng kahulugan.
- source_word: וַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: at ang mga lalaking kasama niya
  rationale: Tuwirang inilalarawan nito ang pangkat ng mga lalaking kasama ni David.
- source_word: יוֹשֵׁב
  choice: nakaupo
  rationale: Ang participle ay naglalarawan ng nagpapatuloy na tagpo sa likuran ng salaysay.
- source_word: בַּגִּבְעָה
  choice: sa Gibea
  rationale: Tinatrato ang גבעה bilang pangalang-pook na Gibeah, na karaniwang isinasalin sa Filipino bilang Gibea.
- source_word: תַּחַת הָאֶשֶׁל
  choice: sa ilalim ng punong tamarisko
  rationale: Ang אשל ay karaniwang kinikilalang tamarisk; ang “punong tamarisko” ay malinaw at madaling maunawaan sa Filipino.
- source_word: בָּרָמָה
  choice: sa mataas na lugar
  rationale: Mas pinapaboran ng artikulo at sintaks ang karaniwang pangngalang “mataas na lugar,” bagaman maaaring unawain bilang pangalang-pook na Rama.
- source_word: וַחֲנִיתוֹ בְיָדוֹ
  choice: hawak ang kanyang sibat
  rationale: Natural na Filipino ito para sa sugnay na walang pandiwa at pinananatili ang larawan ng sibat na nasa kamay ni Saul.
- source_word: וְכָל עֲבָדָיו
  choice: ang lahat ng kanyang mga lingkod
  rationale: Ang עבדים ay maaaring tumukoy sa mga lingkod, tagapaglingkod, o opisyal; “mga lingkod” ang pinakamalawak at pinakatapat na katumbas.
- source_word: נִצָּבִים עָלָיו
  choice: nakatayo sa paligid niya
  rationale: Ipinakikita nito ang mga lingkod na nakapuwesto sa presensiya ni Saul, nang hindi ipinapalagay ang mas tiyak na tungkuling opisyal.
