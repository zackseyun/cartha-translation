  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinatawag” para sa natural na utos-haring konteksto at “angkan ng kanyang ama” upang maipahayag ang sinaunang konsepto ng paternal household nang hindi tunog-salita-sa-salita.
