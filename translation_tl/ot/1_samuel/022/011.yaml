base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/011.yaml
  text: Then the king sent to summon Ahimelech son of Ahitub the priest[a], and all his father's house, the priests who were at Nob; and they all came to the king.
translation:
  language: tl
  text: Nagpadala ang hari upang ipatawag si Ahimelec na anak ni Ahitub, ang pari, at ang buong angkan ng ama ni Ahimelec[a]—ang mga paring nasa Nob. Lahat sila ay pumunta sa hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “angkan ng ama ni Ahimelec” ay tumutukoy sa mas malawak na sambahayan o angkan sa panig ng ama, hindi lamang sa kanyang malapit na pamilya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח ... לִקְרֹא
  choice: ipinatawag
  rationale: Sa konteksto ng utos ng hari, likas na ipinahahayag ng “ipinatawag” ang pagpapadala upang paharapin ang isang tao, nang hindi mabigat ang literal na “nagpadala upang tawagin.”
- source_word: אֲחִימֶלֶךְ בֶּן אֲחִיטוּב
  choice: Ahimelec na anak ni Ahitub
  rationale: Isinatinig ang mga pangalang pantangi ayon sa karaniwang anyong Filipino at tuwirang pinanatili ang ugnayang mag-ama.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Tuwirang tumutukoy ito sa tungkulin ni Ahimelec at nananatiling appositional sa Filipino.
- source_word: כָּל בֵּית אָבִיו
  choice: ang buong angkan ng kanyang ama
  rationale: Ang “angkan” ay natural na Filipino para sa mas malawak na sambahayan o liping mula sa panig ng ama; iniiwasan nitong ipakahulugan ang parirala bilang gusali o pamilya lamang sa iisang bahay.
- source_word: הַכֹּהֲנִים אֲשֶׁר בְּנֹב
  choice: ang mga paring nasa Nob
  rationale: Pinananatili ang pagkakakilanlan ng angkan bilang pangkat ng mga paring naninirahan o naroroon sa Nob.
- source_word: וַיָּבֹאוּ כֻלָּם
  choice: At silang lahat ay pumunta
  rationale: Pinananatili ng “silang lahat” ang diin ng Hebrew na tumugon ang buong pangkat.
- source_word: אֶל הַמֶּלֶךְ
  choice: sa hari
  rationale: Ipinahahayag ang kilos patungo sa hari nang hindi idinaragdag ang di-tahasang ideya na humarap sila sa isang pormal na pagdinig.
