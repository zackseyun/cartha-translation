base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/017.yaml
  text: Then the king said to the runners who were standing around him[a], “Turn and kill the priests of Yahweh, because their hand also is with David[b], and because they knew that he was fleeing and did not disclose it to me.” But the king’s servants were not willing to put out their hand to strike the priests of Yahweh.
translation:
  language: tl
  text: Pagkatapos, sinabi ng hari sa mga mananakbo[a] na nakatayo sa paligid niya, “Humarap kayo at patayin ang mga pari ni Yahweh, sapagkat kampi rin sila kay David,[b] at alam nilang tumatakas siya ngunit hindi nila ito ipinaalam sa akin.[c]” Ngunit ayaw ng mga lingkod ng hari na pagbuhatan ng kamay ang mga pari ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay literal na “mga mananakbo.” Sa korte ng hari, maaari itong tumukoy sa mga maharlikang tanod o mensahero.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo: “ang kanilang kamay ay kasama rin ni David,” isang idyomang nangangahulugang sumusuporta o kumakampi sila kay David.'
    reason: idiom
  - marker: c
    text: 'Sa Hebreo: “hindi nila ibinunyag ang tainga niya,” ibig sabihin, hindi nila ipinaalam sa hari.'
    reason: idiom
lexical_decisions:
- source_word: לָרָצִים
  choice: sa mga mananakbo
  rationale: Literal itong tumutukoy sa ‘mga mananakbo.’ Sa konteksto ng palasyo, maaaring mga tanod o mensaherong maharlika ang kanilang tungkulin; pinanatili sa teksto ang kongkretong katawagan ng Hebreo at nilinaw sa talababa.
- source_word: הַנִּצָּבִים עָלָיו
  choice: na nakatayo sa paligid niya
  rationale: Ang נצב na may על ay maaaring mangahulugang nakatayo sa tabi o nakatalaga sa paglilingkod sa isang tao. Ang salin ay natural sa tagpo ng korte.
- source_word: סֹבּוּ וְהָמִיתוּ
  choice: Humarap kayo at patayin
  rationale: Ipinahihiwatig ng סבב na dapat silang bumaling sa mga pari upang isagawa ang utos. Ang ‘patayin’ ay tuwiran at hindi nagdaragdag ng legal na diwa ng isang pormal na pagbitay.
- source_word: כֹּהֲנֵי יְהוָה
  choice: mga pari ni Yahweh
  rationale: Tuwirang isinalin ang pariralang konstrakto, at pinanatili ang personal na pangalang יהוה bilang ‘Yahweh.’
- source_word: כִּי גַם יָדָם עִם דָּוִד
  choice: sapagkat kampi rin sila kay David
  rationale: Ang literal na larawang ‘ang kanilang kamay ay kasama ni David’ ay isang idyoma ng pakikiisa o pagsuporta. Natural na ipinahayag ang kahulugan sa pangunahing teksto at itinabi sa talababa ang literal na larawan.
- source_word: וְכִי יָדְעוּ כִּי בֹרֵחַ הוּא
  choice: at alam nilang tumatakas siya
  rationale: Ang participle na בֹרֵחַ ay naglalarawan ng nagpapatuloy na pagtakas; hindi ito ginawang tahasang natapos na pangyayari.
- source_word: וְלֹא גָלוּ אֶת־אָזְנוֹ
  choice: ngunit hindi nila ito ipinaalam sa akin
  rationale: Ang literal na ‘hindi nila ibinunyag ang tainga niya’ ay idyoma para sa pagbibigay-alam. Dahil ang hari ang nagsasalita, natural na unang panauhan ang ginamit sa Filipino.
- source_word: וְלֹא אָבוּ
  choice: Ngunit ayaw
  rationale: Ang אבה ay tumutukoy sa pagpayag o pagkukusa. Ang ‘ayaw’ ay malinaw at likas na pagpapahayag ng kanilang pagtanggi.
- source_word: לִשְׁלֹחַ אֶת־יָדָם לִפְגֹעַ
  choice: pagbuhatan ng kamay
  rationale: Ang Filipino na idyomang ‘pagbuhatan ng kamay’ ay natural na naghahatid ng marahas na pagkilos at kaayon ng larawang ‘iunat ang kamay’ sa Hebreo, nang hindi kailangang ulitin ang ‘saktan’ o ‘salakayin.’
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang tetragrammaton ang nasa tekstong Hebreo. Ang ‘Yahweh’ ay malapit na transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Paglalarawan sa mga pari bilang ‘mga pari ni Yahweh’ sa utos ni Saul
  choice: Pinanatili ang katawagan nang walang paliwanag na teolohikal sa pangunahing teksto
  alternative: Dagdagan ng paglalarawang nagbibigay-katwiran o humahatol sa kanila
  rationale: Ang salaysay ay tahasang kinikilala silang mga pari ni Yahweh, ngunit hindi nito hinihinging dagdagan ang mismong talata ng interpretasyon tungkol sa kanilang pagkakasala o kawalang-sala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mga mananakbo’ upang mapanatili ang kongkretong katawagan ng Hebreo, na may paliwanag sa talababa. Natural na isinalin ang dalawang idyoma tungkol sa kamay at tainga, habang pinanatili sa mga talababa ang kanilang literal na anyo.
