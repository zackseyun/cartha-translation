base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/023.yaml
  text: Stay with me[a]; do not be afraid, for he who seeks my life seeks your life also[b], for you are under my protection.
translation:
  language: tl
  text: Manatili ka sa piling ko; huwag kang matakot. Ang nagtatangkang kumitil sa buhay ko ay nagtatangkang kumitil din sa buhay mo, sapagkat nasa aking pangangalaga ka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “sapagkat ikaw ay isang pag-iingat/proteksiyon na kasama ko.” Maaaring mangahulugan ito na ikaw ay nasa aking pag-iingat o pangangalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה אִתִּי
  choice: Manatili ka sa piling ko
  rationale: Sa kontekstong ito, ang pandiwang ישׁב ay utos na manatili sa kasama ni David, hindi literal na umupo. Likas at marangal sa makabagong Tagalog ang “manatili ka sa piling ko.”
- source_word: אַל תִּירָא
  choice: huwag kang matakot
  rationale: Karaniwang natural na salin ng Hebreong pagbabawal; malinaw ito sa ordinaryong mambabasa.
- source_word: אֲשֶׁר יְבַקֵּשׁ אֶת נַפְשִׁי
  choice: ang nagtatangka sa buhay ko
  rationale: Ang “hanapin ang buhay” ay idyomang tumutukoy sa pagtatangkang pumatay. Pinananatili ng salin ang salitang “buhay” at ang paralelismo nang hindi nagmumukhang simpleng paghahanap lamang.
- source_word: יְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: ay nagtatangka rin sa buhay mo
  rationale: Inuulit ang kilos at ang “buhay” gaya sa Hebreo. Ang “rin” ay nagpapalinaw sa likas na paghahambing, bagaman wala itong hiwalay na katumbas na partikulo sa teksto.
- source_word: מִשְׁמֶרֶת אַתָּה עִמָּדִי
  choice: ngunit ligtas ka sa piling ko
  rationale: Ang מִשְׁמֶרֶת ay maaaring tumukoy sa pag-iingat, pagbabantay, o proteksiyon. Ipinahahayag ng salin ang katiyakang magiging ligtas si Abiatar kasama ni David; minarkahan sa talababa ang mas pormal na anyo ng parirala.
theological_decisions:
- issue: Batayan ng katiwasayan ni Abiatar
  choice: “ligtas ka sa piling ko”
  alternative: “nasa pangangalaga kita”
  rationale: Hindi ginawang tahasang ganap o walang pasubaling garantiya ni David ang proteksiyon. Ang napiling anyo ay nagpapahayag ng katiwasayan habang hindi lumalampas sa maikling at di-karaniwang Hebreong parirala.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “sa piling ko” sa halip na payak na “kasama ko” upang maipahiwatig ang personal na kanlungan nang hindi nagiging teknikal. Ang “ngunit” ay kontekstuwal na nag-uugnay sa magkaparehong panganib at sa kasunod na katiyakan ng kaligtasan.
