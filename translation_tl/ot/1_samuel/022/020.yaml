  source_fidelity: 'Ang salin ay tapat sa pangunahing daloy ng Hebreo: isang natatanging anak ni Ahimelec ang nakatakas, pinangalanang Abiatar, at pagkatapos ay tumakas na kasunod ni David. Gayunman, ang "isang anak" ay hindi tahasang naghahayag ng kasariang panlalaki ng בֵּן; nararapat ang "isang anak na lalaki."'
