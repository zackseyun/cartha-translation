  text: וַ/יִּמָּלֵ֣ט בֵּן אֶחָ֗ד לַ/אֲחִימֶ֨לֶךְ֙ בֶּן אֲחִט֔וּב וּ/שְׁמ֖/וֹ אֶבְיָתָ֑ר וַ/יִּבְרַ֖ח אַחֲרֵ֥י דָוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/020.yaml
  text: But one son of Ahimelech son of Ahitub escaped[a], and his name was Abiathar, and he fled after David.
translation:
  language: tl
  text: Ngunit nakatakas ang isang anak na lalaki ni Ahimelec na anak ni Ahitub. Abiatar ang kanyang pangalan, at tumakas siyang kasunod ni David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tumakas siya patungo kay David.” Literal sa Hebreo ang “tumakas siyang kasunod ni David,” na maaaring mangahulugang sinundan niya si David upang sumama sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵט
  choice: nakatakas
  rationale: Ang Niphal ng מלט ay nagsasaad dito ng matagumpay na pagtakas mula sa pagpatay na isinalaysay bago nito. Tuwirang ipinapahayag ng “nakatakas” ang kinalabasan ng pagkilos.
- source_word: בֵּן אֶחָד
  choice: isang anak
  rationale: Literal itong “isang anak na lalaki.” Dahil malinaw sa talaangkanan at konteksto na anak na lalaki ang tinutukoy, natural sa Tagalog ang “isang anak” at napapanatili nito ang diin na iisa ang nakatakas.
- source_word: לַאֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: ni Ahimelec na anak ni Ahitub
  rationale: Ang לְ ay nagpapahiwatig dito ng kaugnayang pampamilya. Pinananatili rin ng parirala ang pagkakakilanlang talaangkanan ni Ahimelec bilang anak ni Ahitub.
- source_word: וּשְׁמוֹ אֶבְיָתָר
  choice: na ang pangalan ay Abiatar
  rationale: Natural na sugnay ito sa Tagalog para sa Hebreong pormulang nagpapakilala ng pangalan, habang nananatiling malapit sa anyo ng pinagmulan.
- source_word: וַיִּבְרַח
  choice: at tumakas siya
  rationale: 'Ang ברח ay “tumakas.” Hiwalay itong pandiwa sa naunang וַיִּמָּלֵט, kaya pinananatili ang pagkakasunod: nakaligtas siya sa pagpatay at pagkatapos ay tumakas.'
- source_word: אַחֲרֵי דָוִד
  choice: kasunod ni David
  rationale: Ang אַחֲרֵי ay literal na “sa likuran/kasunod.” Maaaring ipahiwatig sa konteksto na pinuntahan at sinamahan niya si David, ngunit pinananatili ng “kasunod ni David” ang bahagyang kalabuan ng Hebreo.
- source_word: וַ
  choice: Ngunit
  rationale: 'Ang panimulang waw ay nag-uugnay sa naunang pagpatay at may banayad na pagsalungat: sa kabila ng masaker, may isang anak na nakatakas.'
- source_word: אֶבְיָתָר
  choice: Abiatar
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimelec
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Isinatinig ang pangalang pantangi sa malinaw at karaniwang anyong Filipino.
