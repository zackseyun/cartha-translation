  text: Abiathar told David that Saul had killed the priests of Yahweh.
translation:
  language: tl
  text: Ibinalita ni Abiatar kay David na pinatay ni Saul ang mga pari ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: Ibinalita
  rationale: Ang Hifil ng נגד ay nangangahulugang ipaalam o sabihin. Ang “ibinalita” ay natural sa Filipino at angkop sa paghahatid ni Abiatar ng nangyari.
- source_word: אֶבְיָתָר
  choice: Abiatar
  rationale: Isinalin sa karaniwang anyong Filipino ang personal na pangalang Hebreo.
- source_word: לְדָוִד
  choice: kay David
  rationale: Ang prefiks na לְ ay nagmamarka sa pinag-ukulan ng pagbabalita, kaya natural itong ipinahayag bilang “kay David.”
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng ibinalita ni Abiatar; “na” ang natural na pang-ugnay sa Filipino.
- source_word: הָרַג
  choice: pinatay
  rationale: Tumutukoy ang qatal sa pagpatay na naganap bago ang pagbabalita. Sapat na ipinahihiwatig ng konteksto at ayos ng pangungusap sa Filipino ang naunang pangyayari.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Ginamit ang karaniwang anyong Filipino ng personal na pangalan.
- source_word: כֹּהֲנֵי יְהוָה
  choice: ang mga pari ni Yahweh
  rationale: Natural na ipinahahayag ng “mga pari ni Yahweh” ang ugnayang construct sa Hebreo habang pinananatili ang banal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang Tetragrammaton bilang personal na pangalan ng Diyos, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan at hindi ito pinapalitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “ibinalita” sa halip na mas pormal na “ipinaalam,” at pinanatiling maikli ang payak na salaysay ng Hebreo.
