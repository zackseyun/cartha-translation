  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִי֙ לִ/תְקֻפ֣וֹת הַ/יָּמִ֔ים וַ/תַּ֥הַר חַנָּ֖ה וַ/תֵּ֣לֶד בֵּ֑ן וַ/תִּקְרָ֤א אֶת שְׁמ/וֹ֙ שְׁמוּאֵ֔ל כִּ֥י מֵ/יְהוָ֖ה שְׁאִלְתִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/020.yaml
  text: And in due time Hannah conceived and bore a son[a], and she called his name Samuel, for she said[b], “I asked for him from Yahweh.”
translation:
  language: tl
  text: Nang sumapit ang takdang panahon,[a] naglihi si Ana at nagsilang ng isang anak na lalaki. Pinangalanan niya itong Samuel,[b] sapagkat sinabi niya, “Hiningi ko siya kay Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “sa pag-ikot/pagsapit ng mga araw,” isang idyomang nangangahulugang dumating na ang angkop na panahon.'
    reason: lexical_alternative
  - marker: b
    text: 'Ipinaliliwanag dito ang pangalang “Samuel” sa pamamagitan ng paglalaro sa salitang Hebreo na שׁאל (sha’al), “humingi”: “Hiningi ko siya kay Yahweh.” Hindi tiyak ang eksaktong etimolohiya ng pangalang Samuel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקֻפוֹת הַיָּמִים
  choice: Nang sumapit ang takdang panahon
  rationale: Ang parirala ay literal na tumutukoy sa pag-ikot o pagsapit ng mga araw. Ipinahahayag ng saling ito sa natural na Tagalog na dumating ang angkop na panahon, nang hindi ginagawang tiyak kung gaano katagal iyon.
- source_word: וַתַּהַר
  choice: naglihi
  rationale: Karaniwan at maikli itong salin ng pandiwang tumutukoy sa paglilihi o pagbubuntis sa salaysay ng kapanganakan.
- source_word: וַתֵּלֶד בֵּן
  choice: nagsilang ng isang anak na lalaki
  rationale: Tumpak at likas na pahayag ito sa modernong Tagalog para sa pagsilang ng isang lalaking anak.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: Pinangalanan niya itong
  rationale: Likas na katumbas ito sa Tagalog ng Hebreong pormula sa pagbibigay ng pangalan.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog.
- source_word: כִּי מֵיְהוָה שְׁאִלְתִּיו
  choice: sapagkat sinabi niya, “Hiningi ko siya kay Yahweh.”
  rationale: Pinananatili ng “hiningi” ang kaugnayan sa pandiwang Hebreo na שׁאל at malinaw na ipinakikitang kay Yahweh nagmula ang hiniling na anak. Ipinahihiwatig sa Hebreo ang paliwanag sa pangalan; idinagdag ang “sinabi niya” upang maging malinaw at natural ang tuwirang sipi sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang tinutumbasan nito ang banal na pangalang YHWH sa halip na palitan iyon ng isang titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Paliwanag sa pangalang Samuel at sa pandiwang שׁאל (“humingi”)
  choice: Panatilihin sa pangunahing teksto ang salitang “hiningi” at ipaliwanag ang paglalaro sa salita sa talababa.
  alternative: Magbigay sa pangunahing teksto ng isang tiyak na literal na etimolohiya ng pangalang Samuel.
  rationale: Iniuugnay ng talata ang Samuel sa pandiwang “humingi,” ngunit pinagtatalunan ang eksaktong etimolohiya ng pangalan. Hindi dapat ipilit ng salin ang isang katiyakang wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinili ang “Ana,” ang nakaugaliang anyo sa Tagalog, at pinanatili ang “Yahweh” bilang personal na pangalan. Iniwasan ang sobrang literal na ayos ng Hebreo upang manatiling natural ang daloy, ngunit pinanatili sa talababa ang idyoma at paglalaro sa salita.
