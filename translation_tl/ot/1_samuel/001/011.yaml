  text: וַ/תִּדֹּ֨ר נֶ֜דֶר וַ/תֹּאמַ֗ר יְהוָ֨ה צְבָא֜וֹת אִם רָאֹ֥ה תִרְאֶ֣ה בָּ/עֳנִ֣י אֲמָתֶ֗/ךָ וּ/זְכַרְתַּ֨/נִי֙ וְ/לֹֽא תִשְׁכַּ֣ח אֶת אֲמָתֶ֔/ךָ וְ/נָתַתָּ֥ה לַ/אֲמָתְ/ךָ֖ זֶ֣רַע אֲנָשִׁ֑ים וּ/נְתַתִּ֤י/ו לַֽ/יהוָה֙ כָּל יְמֵ֣י חַיָּ֔י/ו וּ/מוֹרָ֖ה לֹא יַעֲלֶ֥ה עַל רֹאשֽׁ/וֹ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/011.yaml
  text: She made a vow and said[a], “O Yahweh of hosts, if you will indeed look on the affliction of your female servant, and remember me, and not forget your female servant, but give your female servant a male child, then I will give him to Yahweh all the days of his life[b], and no razor shall come upon his head.”
translation:
  language: tl
  text: Nanata siya at sinabi, “Yahweh ng mga Hukbo, kung talagang papansinin mo ang paghihirap ng iyong lingkod na babae, aalalahanin mo ako at hindi mo kalilimutan ang iyong lingkod na babae, kundi bibigyan mo ang iyong lingkod na babae ng anak na lalaki[a], ibibigay ko siya kay Yahweh sa lahat ng araw ng kanyang buhay, at walang labahang daraan sa kanyang ulo.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “binhi” o “supling ng mga lalaki,” isang pariralang tumutukoy rito sa isang anak na lalaki.
    reason: lexical_alternative
  - marker: b
    text: Ang pananalitang “walang labahang daraan sa kanyang ulo” ay kahawig ng wikang kaugnay ng natatanging pagtatalaga sa panata ng isang Nazareo. Gayunman, tahasang binabanggit lamang dito ang pagbabawal sa pag-ahit at ang panghabambuhay na pagbibigay sa kanya kay Yahweh, hindi ang katawagang “Nazareo.”
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּדֹּר נֶדֶר
  choice: Nanata siya
  rationale: Likas na salin sa Tagalog ng Hebreong magkaugnay na pandiwa at pangngalan na literal na ‘nanata ng isang panata’; pinananatili nito ang pormal at taimtim na kilos nang hindi nagiging paulit-ulit.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh ng mga Hukbo
  rationale: Pinananatili ang pangalang tipan na Yahweh at isinasalin ang צְבָאוֹת bilang ‘mga Hukbo,’ na hindi nililimitahan ang titulo sa isang tahasang paliwanag kung makalangit o makalupang hukbo ang tinutukoy.
- source_word: אִם רָאֹה תִרְאֶה
  choice: kung talagang papansinin mo
  rationale: Ang infinitive absolute kasama ng pandiwa ay nagbibigay-diin sa pagtingin. Ang ‘talagang papansinin’ ay natural sa makabagong Tagalog at ipinahihiwatig ang mahabaging pagtingin sa kalagayan ni Ana.
- source_word: בָּעֳנִי
  choice: ang paghihirap
  rationale: Saklaw ng ‘paghihirap’ ang dalamhati, kaapihan, at kahihiyang maaaring taglay ng עֳנִי nang hindi labis na tinutukoy ang isang aspeto lamang.
- source_word: אֲמָתֶךָ / לַאֲמָתְךָ
  choice: iyong lingkod na babae
  rationale: Tiyak na babaeng lingkod ang tinutukoy ng Hebreo. Pinananatili ng salin ang kasarian at ang mapagpakumbabang pananalita ng panalangin.
- source_word: וּזְכַרְתַּנִי
  choice: aalalahanin mo ako
  rationale: Direkta at likas na katumbas ng pananalitang ginagamit sa panalangin; hindi nito binabawasan ang kahulugang higit sa simpleng paggunita.
- source_word: וְלֹא תִשְׁכַּח אֶת אֲמָתֶךָ
  choice: at hindi mo kalilimutan ang iyong lingkod na babae
  rationale: Pinananatili ang paralelismo sa ‘aalalahanin mo ako’ at ang pag-uulit ng mapagpakumbabang pagtukoy ni Ana sa sarili.
- source_word: וְנָתַתָּה לַאֲמָתְךָ זֶרַע אֲנָשִׁים
  choice: kundi bibigyan mo siya ng anak na lalaki
  rationale: Ang literal na ‘binhi/supling ng mga lalaki’ ay tumutukoy rito sa isang lalaking anak. Ginamit ang ‘siya’ upang maging natural ang pangungusap sa Tagalog habang malinaw na ang tinutukoy ay ang lingkod na babae.
- source_word: וּנְתַתִּיו לַיהוָה
  choice: ibibigay ko siya kay Yahweh
  rationale: Pinananatili ang payak na pandiwang ‘ibigay’ sa halip na idagdag sa pangunahing teksto ang mas interpretibong ‘ialay’ o ‘italaga.’
- source_word: כָּל יְמֵי חַיָּיו
  choice: sa lahat ng araw ng kanyang buhay
  rationale: Malapit sa anyo ng Hebreo at malinaw na ipinapahayag ang panghabambuhay na saklaw ng panata.
- source_word: וּמוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: at hindi daraan ang labaha sa kanyang ulo
  rationale: Ang ‘labaha’ ang malamang na kahulugan ng מוֹרָה rito. Ang idyomang ‘hindi daraan ... sa kanyang ulo’ ay malinaw sa Tagalog at pinananatili ang kongkretong larawan ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang natatanging pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Posibleng kaugnayan ng pagbabawal sa labaha sa panata ng Nazareo
  choice: Panatilihin sa pangunahing teksto ang kongkretong pagbabawal sa labaha nang hindi tawaging Nazareo si Samuel
  alternative: Tahasang sabihing itatalaga siya bilang isang Nazareo
  rationale: Malakas ang pagkakahawig sa wika ng natatanging pagtatalaga ng isang Nazareo, ngunit hindi ginagamit ng talata ang katawagang iyon. Kaya inilalagay lamang ang kaugnayang pangkultura sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang taimtim at mapagpakumbabang himig ng panalangin, pati ang sinadyang pag-uulit ng ‘iyong lingkod na babae.’ Ginamit ang pangkasalukuyang likas na bokabularyo at iniwasan ang mga salitang labis na arkaiko o denominasyonal.
