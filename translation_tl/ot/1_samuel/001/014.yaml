  text: Sinabi ni Eli sa kanya, “Hanggang kailan ka mananatiling lasing?[a] Ilayo mo sa iyong sarili ang iyong alak.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Hanggang kailan ka magpapakalasing?” Ang pandiwang Hebreo ay maaaring tumukoy sa pagkalasing o sa pagiging nasa kalagayang lasing.
    reason: lexical_alternative
  - marker: b
