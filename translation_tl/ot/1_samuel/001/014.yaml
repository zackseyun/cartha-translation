lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ עֵלִי
  choice: Sinabi ni Eli sa kanya
  rationale: Natural na salaysay sa modernong Tagalog; malinaw na pinananatili ang nagsasalita at ang babaeng kinakausap.
- source_word: עַד מָתַי
  choice: Hanggang kailan
  rationale: Tuwirang at idiomatikong katumbas ng temporal na tanong sa Hebreo.
- source_word: תִּשְׁתַּכָּרִין
  choice: ka mananatiling lasing
  rationale: Ipinahahayag ang paratang ni Eli tungkol sa nagpapatuloy na kalagayan, habang ang talababa ay nagpapanatili sa posibleng diwang ‘magpakalasing.’
- source_word: הָסִירִי
  choice: Alisin mo
  rationale: Tuwirang pautos na angkop sa pandiwang Hebreo at dignidad ng konteksto.
- source_word: אֶת יֵינֵךְ מֵעָלָיִךְ
  choice: sa iyo ang iyong alak
  rationale: Pinananatili ang kakaibang larawang Hebreo na alisin ang alak ‘mula sa ibabaw/sa sarili,’ nang hindi inuunahan kung alak mismo o impluwensiya nito ang tinutukoy.
theological_decisions:
- issue: Kung inilalarawan ni Eli ang pagiging lasing o ang pagpapakalasing
  choice: mananatiling lasing
  alternative: magpapakalasing
  rationale: May tunay na leksikal na puwang ang anyong Hebreo sa pagiging o pagkalasing. Pinili sa teksto ang nagpapatuloy na kalagayan, at inilagay sa talababa ang alternatibo upang hindi tahimik na lutasin ang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “mananatiling lasing” upang maging malinaw ang patuloy na paratang, samantalang pinanatili ng mga talababa ang leksikal na kalabuan at ang literal na larawan ng huling parirala.
