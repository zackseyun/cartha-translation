  yaml_path: translation/ot/1_samuel/001/016.yaml
  text: Do not regard your servant as a worthless woman[b][a], for out of the abundance of my complaint and my vexation I have spoken until now.
translation:
  language: tl
  text: Huwag po ninyong ituring ang inyong lingkod na isang masamang babae,[a] sapagkat nagsalita ako hanggang ngayon dahil sa tindi ng aking hinagpis at sama ng loob.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “anak na babae ng kawalang-kabuluhan,” isang idyoma para sa babaeng masama ang asal o kahiya-hiya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “dahil sa dami ng aking daing at pagkabagabag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן ... לִפְנֵי
  choice: Huwag po ninyong ituring ... na
  rationale: Idyomatikong gamit ito ng נתן kasama ang לִפְנֵי at panaguring pangngalan; ang diwa ay ‘ituring bilang,’ hindi literal na ‘ibigay sa harap.’ Ang ‘po’ ay likas sa makabagong Tagalog para sa magalang na pakikipag-usap ni Hana kay Eli.
- source_word: אֲמָתְךָ
  choice: ang inyong lingkod
  rationale: Mapagpakumbabang pagtukoy ito ni Hana sa sarili. Bagaman tiyak na pambabae ang anyong Hebreo, malinaw na ang kasarian sa kasunod na ‘babae,’ kaya natural ang ‘inyong lingkod.’
- source_word: בַּת בְּלִיָּעַל
  choice: isang masamang babae
  rationale: Literal itong ‘anak na babae ng kawalang-kabuluhan,’ isang idyoma para sa babaeng masama ang asal o hamak sa moral. Mas natural at dignified sa Tagalog ang ‘masamang babae’ kaysa literal na salin.
- source_word: כִּי מֵרֹב
  choice: sapagkat ... dahil sa tindi ng
  rationale: Ipinakikilala ng כִּי ang paliwanag ni Hana, at ipinahahayag ng מֵרֹב ang sanhi at matinding antas ng kaniyang dinaranas.
- source_word: שִׂיחִי
  choice: aking hinagpis
  rationale: Maaaring tumukoy ang salita sa pagninilay, daing, o reklamo. Sa konteksto ng balisang panalangin ni Hana, ang ‘hinagpis’ ay likas at hindi nagpapahiwatig ng mapaghimagsik na pagrereklamo.
- source_word: וְכַעְסִי
  choice: sama ng loob
  rationale: Tumutukoy dito ang כַּעַס sa panloob na pagkayamot, dalamhati, o pagkabagabag dahil sa kaniyang kalagayan, hindi sa bagay na siya ang sanhi. Pinananatili ng ‘sama ng loob’ ang emosyonal na tensiyon nang hindi ito awtomatikong ginagawang makasalanang galit.
- source_word: דִּבַּרְתִּי עַד הֵנָּה
  choice: nagsalita ako hanggang ngayon
  rationale: Tumutukoy ang parirala sa pagsasalita niyang nagpapatuloy hanggang sa kasalukuyang sandali; temporal ang עַד הֵנָּה, hindi lokatibo.
