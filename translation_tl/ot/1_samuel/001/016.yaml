translation_notes:
  register: Makabago, magalang, at dignified na Filipino. Ginamit ang ‘po’ at maramihang anyo ng paggalang (‘ninyong,’ ‘inyong’) upang natural na katawanin ang mapagpakumbabang pakikipag-usap ni Hana kay Eli. Pinanatili ang dalawang magkaugnay ngunit hindi ganap na magkaparehong salita para sa kaniyang matinding panloob na dalamhati.
