  source_fidelity: 'Tumpak na naihahatid ng salin ang Hebreong pakiusap ni Hana: huwag siyang ituring na isang babae ng Belial, sapagkat ang kaniyang pagsasalita ay bunga ng nag-uumapaw na daing at panloob na pagkabagabag. Ang “hanggang ngayon” ay wastong temporal na salin ng עַד הֵנָּה.'
