language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עָלָה֩ הָ/אִ֨ישׁ הַ/ה֤וּא מֵֽ/עִיר/וֹ֙ מִ/יָּמִ֣ים יָמִ֔ימָ/ה לְ/הִֽשְׁתַּחֲוֺ֧ת וְ/לִ/זְבֹּ֛חַ לַ/יהוָ֥ה צְבָא֖וֹת בְּ/שִׁלֹ֑ה וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י חָפְנִי֙ וּ/פִ֣נְחָ֔ס כֹּהֲנִ֖ים לַ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/003.yaml
  text: That man used to go up from his city year after year to worship and to sacrifice to Yahweh of Armies at Shiloh. And the two sons of Eli[a], Hophni and Phinehas, were there as priests of Yahweh.
translation:
  language: tl
  text: Noon, taon-taon ay umaahon ang lalaking iyon mula sa kanyang bayan patungong Shilo upang sumamba at maghandog ng hain kay Yahweh ng mga Hukbo. Naroon ang dalawang anak ni Eli—sina Hofni at Finehas—na mga pari ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: umaahon
  rationale: Ipinahihiwatig ng anyong pandiwa sa konteksto ang nakaugaliang kilos sa nakaraan; kasama ng “taon-taon,” malinaw ang paulit-ulit na pag-ahon para sa peregrinasyon.
- source_word: הָאִישׁ הַהוּא
  choice: ang lalaking iyon
  rationale: Pinananatili ng “iyon” ang tiyak at anaporikong pagtukoy kay Elcana na nauna nang ipinakilala.
- source_word: מֵעִירוֹ
  choice: mula sa kanyang bayan
  rationale: Maaaring tumukoy ang עִיר sa lungsod o bayan; mas natural sa makabagong Tagalog ang “bayan” para sa pinanggalingang pamayanan sa salaysay na ito.
- source_word: מִיָּמִים יָמִימָה
  choice: taon-taon
  rationale: Natural at maikli itong katumbas ng idyomang Hebreo na nagsasaad ng regular na pag-uulit bawat taon.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: upang sumamba
  rationale: Bagaman literal na tumutukoy sa pagyukod o pagpapatirapa, sa kontekstong pangkulto ang kilos ay pagsamba.
- source_word: וְלִזְבֹּחַ
  choice: at maghandog
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa paghahandog ng hain; natural sa Tagalog ang “maghandog” nang hindi inuulit ang salitang “hain.”
- source_word: לַיהוָה צְבָאוֹת
  choice: kay Yahweh ng mga Hukbo
  rationale: Pinananatili ang personal na pangalang Yahweh at isinasalin nang malinaw ang צְבָאוֹת bilang “mga Hukbo,” sa halip na gumamit ng mas tradisyonal ngunit di-gaanong malinaw na “mga Hukbo/Host” na hiram na pahayag.
- source_word: בְּשִׁלֹה
  choice: patungong Shilo
  rationale: Dahil ang pandiwa ay “umaahon,” natural na ipahayag ang destinasyon bilang “patungong Shilo,” habang nananatiling malinaw na doon nagaganap ang pagsamba at paghahandog.
- source_word: וְשָׁם
  choice: Naroon
  rationale: Direkta at natural na katumbas ng lokatibong pahayag na “at naroon.”
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: ang dalawang anak ni Eli
  rationale: Pinananatili ang diin ng Hebreo sa dalawang anak bilang isang pares.
- source_word: חָפְנִי וּפִנְחָס
  choice: sina Hofni at Finehas
  rationale: Ginamit ang mga anyong pangalan na nababagay sa baybay at bigkas ng Filipino.
- source_word: כֹּהֲנִים לַיהוָה
  choice: na mga pari ni Yahweh
  rationale: Malinaw na ipinahahayag ang kanilang tungkulin bilang mga paring naglilingkod kay Yahweh.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Pagsasalin sa titulong יְהוָה צְבָאוֹת
  choice: Yahweh ng mga Hukbo
  alternative: PANGINOON ng mga Hukbo; Panginoon ng mga hukbo; Makapangyarihang PANGINOON
  rationale: Ang “mga Hukbo” ang tuwirang kahulugan ng צְבָאוֹת at hindi nito ipinapakahulugan agad kung makalangit o makalupang hukbo ang saklaw, kaya napapanatili ang lawak ng titulong Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “umaahon” upang mapanatili ang tradisyonal at heograpiko-teolohikal na wika ng paglalakbay sa dambana, at “taon-taon” upang likas na maipahayag ang nakaugaliang kilos. Walang talababa dahil ang mga leksikal na alternatibo ay hindi kinakailangang ilagay sa publikasyong teksto ng talatang ito.
