  to: Noon, taon-taon ay umaahon ang lalaking iyon mula sa kanyang bayan patungong Shilo upang sumamba at maghandog ng hain kay Yahweh ng mga Hukbo. Naroon ang dalawang anak ni Eli—sina Hofni at Finehas—na mga pari ni Yahweh.
  rationale: Ang rebisyon ay tahasang nagmamarka sa taunang paglalakbay bilang nakaugaliang kilos sa nakaraan at nililinaw na ang paghahandog ay paghahandog ng hain. Hindi binabago ang pangalan, titulo, lokasyon, o saklaw ng kahulugan ng Hebreo.
