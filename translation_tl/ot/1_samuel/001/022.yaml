  text: וְ/חַנָּ֖ה לֹ֣א עָלָ֑תָה כִּֽי אָמְרָ֣ה לְ/אִישָׁ֗/הּ עַ֣ד יִגָּמֵ֤ל הַ/נַּ֨עַר֙ וַ/הֲבִאֹתִ֗י/ו וְ/נִרְאָה֙ אֶת פְּנֵ֣י יְהוָ֔ה וְ/יָ֥שַׁב שָׁ֖ם עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/022.yaml
  text: But Hannah did not go up[a], for she said to her husband, “Not until the boy is weaned will I bring him[b], so that he may appear before Yahweh and stay there forever.”
translation:
  language: tl
  text: Ngunit hindi umakyat si Hana, sapagkat sinabi niya sa kanyang asawa, “Hindi ko siya dadalhin hangga't hindi pa siya maawat sa pagsuso. Pagkatapos ay dadalhin ko siya upang humarap siya kay Yahweh[a] at manatili roon magpakailanman[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ibang pagkakabasa o tradisyon ng teksto: “at haharap ako kay Yahweh, at mananatili siya roon magpakailanman.”'
    reason: alternative_reading
  - marker: b
    text: Ang “magpakailanman” dito ay tumutukoy sa permanenteng pagtatalaga kay Samuel sa paglilingkod kay Yahweh—samakatuwid, sa buong buhay niya.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָתָה
  choice: sumama sa pag-akyat
  rationale: Pinananatili ang larawang ‘umakyat’ patungo sa santuwaryo sa Shilo, habang nililinaw sa natural na Tagalog na hindi sumama si Hana sa taunang paglalakbay.
- source_word: כִּי אָמְרָה לְאִישָׁהּ
  choice: sapagkat sinabi niya sa kanyang asawa
  rationale: Malinaw na ipinakikilala ng כִּי ang dahilan, at ang אִישׁ na may hulaping tumutukoy kay Hana ay idiomatikong ‘kanyang asawa.’
- source_word: עַד יִגָּמֵל הַנַּעַר
  choice: hangga't hindi naaawat sa pagsuso ang bata
  rationale: Ipinahahayag ang hangganang itinakda ng עַד at nililinaw na ang pag-awat ay sa pagpapasuso, ang kahulugan sa kontekstong ito.
- source_word: וַהֲבִאֹתִיו
  choice: Pagkatapos, dadalhin ko siya
  rationale: Inilalahad nang natural ang kasunod na balak ni Hana matapos maawat ang bata.
- source_word: וְנִרְאָה אֶת־פְּנֵי יְהוָה
  choice: upang humarap kay Yahweh
  rationale: Ang Niphal ng ראה sa pormulang ito ay nangangahulugang magpakita o humarap sa presensya ni Yahweh; ayon sa pinakapayak na pagbasa ng Masoretikong teksto, si Samuel ang paksa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וְיָשַׁב שָׁם עַד־עוֹלָם
  choice: at manatili roon magpakailanman
  rationale: Pinananatili ang malawak na diwa ng עוֹלָם, habang ipinapaliwanag sa talababa na sa konteksto ay tumutukoy ito sa habambuhay na pagtatalaga ni Samuel.
theological_decisions:
- issue: Paksa ng ‘humarap kay Yahweh’ at ‘manatili roon’
  choice: Si Samuel ang paksa ng dalawang pandiwa.
  alternative: 'Sa ibang pagkakabasa o tradisyon ng teksto: si Hana ang haharap kay Yahweh, ngunit si Samuel ang mananatili roon.'
  rationale: Pagkatapos ng ‘dadalhin ko siya,’ pinakamadulas sa Masoretikong teksto na si Samuel ang nagpapatuloy na paksa, at tugma ito sa kanyang pagtatalaga sa paglilingkod sa santuwaryo. Gayunman, mahalaga ang ibang tradisyon kaya inilalagay ito sa talababa.
- issue: Saklaw ng ‘magpakailanman’
  choice: Pinanatili ang literal at bukas na pananalitang ‘magpakailanman.’
  alternative: ‘habambuhay’ o ‘sa buong buhay niya’
  rationale: Ang עַד־עוֹלָם ay maaaring magpahiwatig ng walang takdang pananatili; sa salaysay, praktikal itong tumutukoy sa buong buhay ni Samuel. Hindi pinapaliit ang pangunahing teksto, ngunit nililinaw ang konteksto sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “naaawat sa pagsuso” para maging malinaw sa ordinaryong mambabasa, at “sumama sa pag-akyat” upang mapanatili ang Hebreong larawan ng pag-akyat sa santuwaryo nang hindi tunog di-natural.
