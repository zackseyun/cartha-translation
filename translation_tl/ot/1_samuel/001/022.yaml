revisions:
- from: Ngunit hindi sumama si Hana sa pag-akyat[a], sapagkat sinabi niya sa kanyang asawa, “Hindi ko siya dadalhin hangga't hindi naaawat sa pagsuso ang bata. Pagkatapos, dadalhin ko siya upang humarap kay Yahweh at manatili roon magpakailanman[b].”
  to: Ngunit hindi umakyat si Hana, sapagkat sinabi niya sa kanyang asawa, “Hindi ko siya dadalhin hangga't hindi pa siya maawat sa pagsuso. Pagkatapos ay dadalhin ko siya upang humarap siya kay Yahweh[a] at manatili roon magpakailanman[b].”
  rationale: Pinalitan ang “hindi sumama si Hana sa pag-akyat” ng mas tapat at natural na “hindi umakyat si Hana.” Inilipat ang talababa a sa “humarap siya kay Yahweh,” ang pariralang aktuwal na tinutukoy ng alternatibong pagbasa. Pinanatili ang pangunahing pagbasa na si Samuel ang haharap at mananatili, habang idinodokumento ang alternatibong tradisyon nang hindi ito ipinipilit sa pangunahing teksto.
