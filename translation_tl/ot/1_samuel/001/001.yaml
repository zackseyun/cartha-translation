  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֜ד מִן הָ/רָמָתַ֛יִם צוֹפִ֖ים מֵ/הַ֣ר אֶפְרָ֑יִם וּ/שְׁמ֡/וֹ אֶ֠לְקָנָה בֶּן יְרֹחָ֧ם בֶּן אֱלִיה֛וּא בֶּן תֹּ֥חוּ בֶן צ֖וּף אֶפְרָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/001.yaml
  text: There was a certain man from Ramathaim-zophim[a], from the hill country of Ephraim, and his name was Elkanah son of Jeroham, son of Elihu, son of Tohu, son of Zuph, an Ephraimite.
translation:
  language: tl
  text: May isang lalaking taga-Ramatayim-Zofim, sa kabundukan ng Efraim; ang pangalan niya ay Elkana na anak ni Jeroham, na anak ni Elihu, na anak ni Tohu, na anak ni Zuf, isang Efrateo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, marahil, “isang Efraimita.” Ang Hebreo ay “Efrateo,” na maaaring gamitin dito bilang katawagang panrehiyon na may kaugnayan sa Efraim.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: May
  rationale: Likas na panimulang salaysay sa Tagalog para sa Hebreong wayyiqtol ng היה, nang hindi nagdaragdag ng tahasang temporal na “ngayon.”
- source_word: אִישׁ אֶחָד
  choice: isang lalaki
  rationale: Ipinakikilala nito ang isang partikular ngunit hindi pa pinapangalanang tauhan; sapat at natural sa Tagalog ang “isang lalaki.”
- source_word: מִן הָרָמָתַיִם צוֹפִים
  choice: taga-Ramatayim-Zofim
  rationale: Itinuturing ang parirala bilang pangalan ng lugar at tinutumbasan ng natural na Tagalog na panandang pinagmulan na “taga-.”
- source_word: מֵהַר אֶפְרָיִם
  choice: mula sa kabundukan ng Efraim
  rationale: Sa heograpikong pariralang ito, tumutukoy ang הַר sa maburol o mabundok na rehiyon, hindi lamang sa isang bundok.
- source_word: וּשְׁמוֹ
  choice: Ang pangalan niya ay
  rationale: Pinananatili ang hiwalay at payak na sugnay ng Hebreo habang gumagamit ng natural na ayos sa modernong Tagalog.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Isinalin sa karaniwang anyong transliterado sa Tagalog ang personal na pangalan.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶן
  choice: anak ni ... na anak ni ... na anak ni ... na anak ni
  rationale: Pinananatili ang sunod-sunod na ugnayang pangangkan bilang “anak ni,” kahit maaaring laktawan kung minsan ng mga talaangkanan ang ilang salinlahi.
- source_word: אֶפְרָתִי
  choice: isang Efrateo
  rationale: Pinananatili sa pangunahing teksto ang pormal na anyo ng Hebreo, “Efrateo,” sa halip na tahimik na ipakahulugang “Efraimita.”
theological_decisions:
- issue: Pagkakakilanlang heograpiko o pangkat ng אֶפְרָתִי
  choice: isang Efrateo
  alternative: isang Efraimita
  rationale: Pormal na tumutukoy ang anyong Hebreo sa isang Efrateo, ngunit dahil maaaring gamitin ito rito bilang panrehiyong katawagan na kaugnay ng Efraim, inilagay sa talababa ang alternatibo sa halip na lutasin nang walang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “kabundukan” para sa heograpikong rehiyon at pinanatili ang payak na estilo ng pagsasalaysay. Ang mga pangalan ay tinranslitera sa anyong madaling basahin sa Tagalog.
