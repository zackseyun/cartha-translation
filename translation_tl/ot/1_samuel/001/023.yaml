base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/023.yaml
  text: And Elqanah her husband said to her[a], “Do what seems good in your eyes. Stay until you have weaned him; only may Yahweh establish his word.” So the woman stayed and nursed her son until she had weaned him.
translation:
  language: tl
  text: Sinabi sa kanya ng asawa niyang si Elkana, “Gawin mo ang sa tingin mo ay mabuti. Manatili ka hanggang sa maawat mo siya sa pagsuso. Tanging pagtibayin nawa ni Yahweh ang kanyang salita[a].” Kaya nanatili ang babae at pinasuso ang kanyang anak hanggang sa maawat niya ang kanyang anak sa pagsuso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patunayan” o “tuparin ang kanyang salita.” Maaaring tumukoy ang Hebreo sa pangako ni Yahweh o sa usaping kasasabi lamang sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישָׁהּ
  choice: asawa niya
  rationale: Sa konteksto, ang אִישׁ na may hulaping pambabae ay tumutukoy sa kaugnayang mag-asawa ni Elkana at Hana; natural at tiyak sa Filipino ang “asawa niya.”
- source_word: עֲשִׂי הַטּוֹב בְּעֵינַיִךְ
  choice: Gawin mo ang sa tingin mo ay mabuti
  rationale: Ipinapahayag ng idyomang Hebreo ang sariling pasiya kung ano ang pinakamainam. Pinananatili ng salin ang larawan ng “pagtingin” sa natural na modernong Filipino.
- source_word: שְׁבִי
  choice: Manatili ka
  rationale: Ang pandiwa ay nangangahulugang manatili sa kinaroroonan, hindi literal na umupo.
- source_word: עַד גָּמְלֵךְ אֹתוֹ / עַד גָּמְלָהּ אֹתוֹ
  choice: hanggang sa maawat mo siya sa pagsuso / hanggang sa maawat niya ito
  rationale: Sa konteksto ng pag-aalaga ng sanggol, malinaw na tumutukoy ang גמל sa pag-awat sa bata sa pagsuso.
- source_word: אַךְ
  choice: tangi lamang
  rationale: Ipinakikita rito ng אַךְ ang isang kondisyon o paglilimita sa naunang pahintulot ni Elkana.
- source_word: יָקֵם
  choice: pagtibayin nawa
  rationale: 'Ipinahihiwatig ng anyong jussive ang hangarin o panalangin: “nawa.” Ang “pagtibayin” ay kumakatawan sa causative na diwa ng קום nang hindi ipinapasiyang tuparin o patunayan ang pangunahing diin.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: דְּבָרוֹ
  choice: ang kanyang salita
  rationale: Maaaring mangahulugan ang דָּבָר ng salita, usapin, o pangako. Pinananatili ng “kanyang salita” ang kalabuan ng pinagmulan.
- source_word: וַתֵּינֶק
  choice: pinasuso
  rationale: Tumutukoy ang pandiwa sa pagpapasuso o pag-aalaga sa sanggol sa pamamagitan ng gatas ng ina; malinaw at karaniwan sa Filipino ang “pinasuso.”
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Karaniwang pangngalan na may pantukoy ang ginamit sa Hebreo, hindi ang pangalang Hana, kaya pinananatili ito sa salin.
theological_decisions:
- issue: Ang tinutukoy ng “kanyang salita” sa sinabi ni Elkana
  choice: Pinanatili bilang “kanyang salita” nang hindi tinutukoy kung ito ay pangako ni Yahweh o ang usaping kasasabi lamang sa konteksto.
  alternative: “kanyang pangako,” “ang salita tungkol sa bata,” o ang panata ni Hana na pinagtibay ni Yahweh
  rationale: Ang Hebreo ay literal na “kanyang salita” at hindi ganap na tiyak ang tinutukoy. Pinananatili ng salin ang tunay na interpretatibo at teolohikal na kalabuan.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Pinanatili ang bahagyang pormal na “pagtibayin nawa” upang maipahayag ang panalangin o hangarin ni Elkana, habang iniwasang lutasin ang kalabuan ng “kanyang salita.”
