  text: And her rival would provoke her bitterly in order to irritate her[a], because Yahweh had closed her womb.
translation:
  language: tl
  text: At paulit-ulit siyang lubhang iniinis ng kanyang karibal[a] upang ligaligin siya, sapagkat isinara ni Yahweh ang kanyang sinapupunan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang kapwa asawa”; ang salitang Hebreo ay tumutukoy sa isang babaeng karibal sa loob ng sambahayan, at sa kontekstong ito ay isa pang asawa ni Elkana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִעֲסַתָּה
  choice: At lagi siyang ... ginagalit
  rationale: Ang Piel ng כעס ay causative, ‘galitin’ o ‘yamutin.’ Ipinahihiwatig ng konteksto ang paulit-ulit o nakaugaliang pagkilos, kaya ginamit ang ‘lagi.’
- source_word: צָרָתָהּ
  choice: karibal niyang asawa
  rationale: Tumutukoy ito kay Penina bilang kapwa asawa ni Elkana at karibal ni Hana sa sambahayan. Mas malinaw sa mambabasang Filipino ang ‘karibal niyang asawa’ kaysa ‘karibal’ lamang.
- source_word: גַּם כַּעַס
  choice: lubhang
  rationale: Ang pariralang inuulit ang ideya ng כעס upang patindihin ang panggagalit; natural itong ipinahayag sa Filipino sa pamamagitan ng ‘lubhang.’
- source_word: בַּעֲבוּר
  choice: upang
  rationale: Ipinakikilala rito ang layunin ng panggagalit.
- source_word: הַרְּעִמָהּ
  choice: ligaligin siya
  rationale: Ang bihirang anyo ay nauunawaan bilang pagpapabalisa o paggambala. Pinananatili ng ‘ligaligin’ ang kaibhan nito sa naunang ‘ginagalit’ at hindi labis na tinutukoy ang eksaktong epekto.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ang dahilan o kalagayang pinagsamantalahan ng karibal.
- source_word: סָגַר
  choice: isinara
  rationale: Tuwirang katumbas ng pandiwang ‘isara’; sa idyomang kasunod nito, nangangahulugang ipinagkait ang paglilihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: בְּעַד רַחְמָהּ
  choice: ang kanyang sinapupunan
  rationale: Ang רֶחֶם ay ‘sinapupunan.’ Kasama ng סגר, bumubuo ito ng idyomang ‘isara ang sinapupunan,’ ibig sabihing hindi hayaang maglihi.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang hayagang nasa tekstong Hebreo; pinananatili itong ‘Yahweh’ upang hindi mapalitan ng titulo.
- issue: Pagkilos ni Yahweh kaugnay ng pagkabaog ni Hana
  choice: isinara ni Yahweh ang kanyang sinapupunan
  alternative: hindi siya pinahintulutan ni Yahweh na magkaanak
  rationale: Pinananatili ang tuwirang pahayag at matalinghagang pananalita ng Hebreo, pati ang teolohikal na tensiyon ng pag-uugnay nito sa pagkilos ni Yahweh, sa halip na palambutin o ipaliwanag ito.
translation_notes:
  register: Makabago at dignified na Filipino. Ginamit ang ‘karibal niyang asawa’ para sa agarang linaw sa kulturang poligamo ng salaysay, habang inilagay sa talababa ang mas literal na alternatibo. Ang ‘ligaligin’ ay natural ngunit sapat na malawak upang mapanatili ang di-gaanong tiyak na kahulugan ng bihirang pandiwa.
