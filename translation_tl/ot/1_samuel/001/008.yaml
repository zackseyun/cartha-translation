base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/008.yaml
  text: Then Elkanah her husband said to her[a], “Hannah, why are you weeping? And why do you not eat? And why is your heart troubled? Am I not better to you than ten sons?”
translation:
  language: tl
  text: Pagkatapos, sinabi sa kanya ng asawa niyang si Elkana, “Ana, bakit ka umiiyak? Bakit hindi ka kumakain? At bakit nalulungkot ang puso mo?[a] Hindi ba mas mabuti ako para sa iyo kaysa sa sampung anak na lalaki?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bakit nababagabag ang puso mo?” Sa literal, “bakit masama ang puso mo?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Filipino ang “Pagkatapos” habang pinananatili ang pagkakasunod-sunod.
- source_word: אֶלְקָנָה אִישָׁהּ
  choice: ng asawa niyang si Elkana
  rationale: Malinaw at natural na ipinakikilala si Elkana bilang asawa ni Ana.
- source_word: לָמֶה
  choice: bakit
  rationale: Tuwirang katumbas ng tanong; pinanatili ang tatlong ulit na retorikal na pagtatanong.
- source_word: תִבְכִּי
  choice: ka umiiyak
  rationale: Ipinahihiwatig ng anyo at konteksto ang nagpapatuloy na pag-iyak ni Ana.
- source_word: לֹא תֹאכְלִי
  choice: hindi ka kumakain
  rationale: Inilalarawan ang kasalukuyang hindi pagkain nang hindi nagdaragdag ng diwang tahasang pagtanggi.
- source_word: יֵרַע לְבָבֵךְ
  choice: nalulungkot ang puso mo
  rationale: Ang literal na “sumama ang iyong puso” ay idyoma para sa panloob na lungkot o dalamhati; pinanatili ang larawan ng puso.
- source_word: לְבָבֵךְ
  choice: ang puso mo
  rationale: Pinananatili ang Hebreong larawang antropolohikal sa halip na palitan ng “isip” o “kalooban.”
- source_word: הֲלוֹא
  choice: Hindi ba
  rationale: Pinananatili ang negatibong retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: טוֹב לָךְ
  choice: mas mahalaga ako sa iyo
  rationale: Sa paghahambing ng halaga ng asawa at mga anak, mas natural at malinaw sa Filipino ang “mas mahalaga ... sa iyo” kaysa literal na “mas mabuti para sa iyo.”
- source_word: מֵעֲשָׂרָה בָּנִים
  choice: kaysa sampung anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng Hebreo; pinanatili rin ang bilang na sampu nang walang dagdag na pagpapakahulugan.
theological_decisions:
- issue: Tiyak na kasarian ng בָּנִים
  choice: mga anak na lalaki
  alternative: mga anak
  rationale: Masculine plural ang salitang Hebreo at mahalaga sa kontekstong pangkultura; hindi ito ginawang gender-neutral.
- issue: Paghahambing na טוֹב לָךְ
  choice: mas mahalaga ako sa iyo
  alternative: mas mabuti ako para sa iyo
  rationale: Inihahayag nito ang pag-aangkin ni Elkana tungkol sa sarili niyang halaga kay Ana, hindi isang doktrinal na paghatol o pag-apruba sa kanyang pananaw.
translation_notes:
  register: Modernong Filipino na magalang at madaling maunawaan. Pinanatili ang tatlong tanong, ang idyomang “puso,” at ang retorikal na diin ng huling pangungusap.
