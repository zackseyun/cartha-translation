reference: 1 Samuel 1:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/ל/וֹ֙ שְׁתֵּ֣י נָשִׁ֔ים שֵׁ֤ם אַחַת֙ חַנָּ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פְּנִנָּ֑ה וַ/יְהִ֤י לִ/פְנִנָּה֙ יְלָדִ֔ים וּ/לְ/חַנָּ֖ה אֵ֥ין יְלָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/002.yaml
  text: He had two wives. The name of one was Hannah[a], and the name of the second was Peninnah. Peninnah had children, but Hannah had no children.
translation:
  language: tl
  text: Mayroon siyang dalawang asawa. Ang pangalan ng isa ay Ana, at ang pangalan ng ikalawa ay Penina. May mga anak si Penina, ngunit walang anak si Ana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹו
  choice: Mayroon siyang
  rationale: Ang Hebreong konstruksiyong pag-aari, na literal na ‘at sa kaniya,’ ay likas na ipinahahayag sa modernong Tagalog bilang ‘mayroon siyang.’ Hindi na hiwalay na isinalin ang pangatnig dahil ipinagpapatuloy na ito ng daloy ng salaysay.
- source_word: שְׁתֵּי נָשִׁים
  choice: dalawang asawa
  rationale: Sa kontekstong ito ng pag-aasawa, ang נָשִׁים ay tumutukoy sa mga asawa, hindi lamang sa mga babae; pinananatili rin nito ang sambahayang may higit sa isang asawa na tahasang inilalarawan ng Hebreo.
- source_word: שֵׁם אַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: Ang pangalan ng isa ... at ang pangalan ng ikalawa
  rationale: Pinananatili ang inuulit na pormal na pormula ng pagkilala at ang paralelismo ng Hebreo, habang nananatiling malinaw sa Tagalog.
- source_word: חַנָּה
  choice: Ana
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Bibliya sa Tagalog.
- source_word: פְּנִנָּה
  choice: Penina
  rationale: Isinatinig ang pangalang Hebreo sa malinaw at nakaugaliang anyong Tagalog.
- source_word: וַיְהִי לִפְנִנָּה יְלָדִים
  choice: May mga anak si Penina
  rationale: Likas na isinalin bilang pag-aari ang eksistensiyal na konstruksiyon. Pangkalahatan ang יְלָדִים at hindi nito espesipikong sinasabing mga anak na lalaki at babae.
- source_word: וּלְחַנָּה אֵין יְלָדִים
  choice: ngunit walang anak si Ana
  rationale: Ang אֵין ay nagpapahayag ng kawalan. Ipinakikita ng ‘ngunit’ ang malinaw na pagsalungat ng kalagayan nina Penina at Ana na nakapaloob sa magkatabing sugnay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Pinanatili ang pormal na paralelismo sa pagpapangalan ngunit gumamit ng likas na Tagalog sa mga konstruksiyong nagpapahayag ng pag-aari. Walang talababa sapagkat hindi kailangan para sa tekstong Tagalog; ang marker na [a] sa English consultation layer ay tila hindi tumutugma sa ibinigay nitong paliwanag, na nauukol sa וְלֹו sa halip na sa pangalang Hannah.
