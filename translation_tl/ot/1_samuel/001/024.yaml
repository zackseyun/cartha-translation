id: 1SA.1.24
reference: 1 Samuel 1:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תַּעֲלֵ֨/הוּ עִמָּ֜/הּ כַּ/אֲשֶׁ֣ר גְּמָלַ֗תּ/וּ בְּ/פָרִ֤ים שְׁלֹשָׁה֙ וְ/אֵיפָ֨ה אַחַ֥ת קֶ֨מַח֙ וְ/נֵ֣בֶל יַ֔יִן וַ/תְּבִאֵ֥/הוּ בֵית יְהוָ֖ה שִׁל֑וֹ וְ/הַ/נַּ֖עַר נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/024.yaml
  text: When she had weaned him[a], she took him up with her, with three bulls, one ephah of flour, and a skin of wine, and brought him to the house of Yahweh at Shiloh. Now the boy was young.
translation:
  language: tl
  text: Nang maawat na niya sa pagsuso ang bata, isinama niya ito paakyat, kasama ang tatlong toro[a], isang efa ng harina, at isang sisidlang balat na may alak. Dinala niya ang bata sa bahay ni Yahweh sa Shilo. Napakabata pa nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “tatlong toro”; mababasa naman sa ilang sinaunang saksi at ayon sa ilang tagapagpaliwanag: “isang torong tatlong taóng gulang.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַתַּעֲלֵהוּ עִמָּהּ
  choice: isinama niya ito paakyat
  rationale: Pinananatili ng “paakyat” ang direksiyonal na diwa ng עלה sa paglalakbay patungo sa santuwaryo, habang malinaw na ipinahahayag ng “isinama” ang עִמָּהּ.
- source_word: כַּאֲשֶׁר גְּמָלַתּוּ
  choice: Nang maawat na niya sa pagsuso ang bata
  rationale: Sa kontekstong ito, ang גמל ay tumutukoy sa pag-awat sa bata sa pagsuso. Likas sa modernong Tagalog ang tahasang pariralang ito.
- source_word: בְּפָרִים שְׁלֹשָׁה
  choice: kasama ang tatlong toro
  rationale: Tuwirang sinusunod ang tekstong Masoretiko, na nagsasabing “tatlong toro”; inilalagay sa talababa ang mahalagang sinaunang alternatibong pagbasa.
- source_word: וְאֵיפָה אַחַת קֶמַח
  choice: isang efa ng harina
  rationale: Pinananatili ang sinaunang yunit na אֵיפָה bilang “efa” sa halip na magbigay ng di-tiyak na makabagong katumbas; ang קֶמַח ay “harina.”
- source_word: וְנֵבֶל יַיִן
  choice: isang sisidlang balat na may alak
  rationale: Ipinahahayag nito ang נֵבֶל bilang lalagyang balat para sa alak nang malinaw at natural sa Tagalog.
- source_word: וַתְּבִאֵהוּ בֵית יְהוָה שִׁלוֹ
  choice: Dinala niya ang bata sa bahay ni Yahweh sa Shilo
  rationale: Ang hiphil ng בוא ay tuwirang “dinala”; ang יְהוָה ay isinasalin bilang personal na pangalang “Yahweh,” at ang שִׁלוֹ bilang “Shilo.”
- source_word: וְהַנַּעַר נָעַר
  choice: Napakabata pa nito
  rationale: Ang pag-uulit ng נַעַר ay may diin sa murang edad ng bata. Inililipat ang diing iyon sa natural na Tagalog sa pamamagitan ng “napakabata pa.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Iniwasan ang labis na teknikal o makalumang pananalita, ngunit pinanatili ang sinaunang yunit na “efa,” ang pangalang “Yahweh,” at ang direksiyonal na diwa ng pag-ahon patungo sa santuwaryo.
