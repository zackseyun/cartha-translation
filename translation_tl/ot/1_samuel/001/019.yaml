base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/019.yaml
  text: They rose early in the morning and bowed down before Yahweh[a]. Then they returned and came to their house at Ramah, and Elkanah knew Hannah his wife[b], and Yahweh remembered her.
translation:
  language: tl
  text: Kinaumagahan, maaga silang bumangon at yumukod sa harap ni Yahweh. Pagkatapos, bumalik sila at dumating sa kanilang tahanan sa Rama. Sumiping si Elkana sa asawa niyang si Hana[a], at inalala siya ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “nakilala.” Isa itong nakaugaliang mahinahong pananalita para sa pagtatalik ng mag-asawa.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, ang “inalala” ay madalas na higit sa simpleng paggunita; maaari itong mangahulugang ibinaling ng Diyos sa isang tao ang kanyang tapat at mabisang malasakit.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: Kinaumagahan, maaga silang bumangon
  rationale: Pinagsasama ng pandiwang Hiphil ng שׁכם at ng בַבֹּקֶר ang diwang maagang pagbangon sa umaga. Natural sa modernong Tagalog ang pagkakasaling ito at malinaw ang diin sa oras.
- source_word: וַיִּשְׁתַּחֲווּ לִפְנֵי יְהוָה
  choice: yumukod sa harap ni Yahweh
  rationale: Ang השתחוה ay tumutukoy sa pisikal na pagyukod o pagpapatirapa. Pinananatili ng “yumukod” ang kongkretong kilos sa halip na palitan agad ng mas pangkalahatang “sumamba.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang pamagat.
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל־בֵּיתָם הָרָמָתָה
  choice: bumalik sila sa kanilang tahanan sa Rama
  rationale: Ipinahihiwatig ng magkasunod na pandiwa ang pagbabalik at pagdating sa kanilang tahanan na nasa Rama. Ang pinaikling Tagalog ay natural ngunit pinananatili ang kilos at patutunguhan.
- source_word: וַיֵּדַע אֶלְקָנָה אֶת־חַנָּה אִשְׁתּוֹ
  choice: Sumiping si Elkana sa asawa niyang si Hana
  rationale: Ang ידע, literal na “nakilala,” ay nakaugaliang Hebreong eupemismo para sa pagtatalik ng mag-asawa. Ang “sumiping” ay likas, mahinahon, at marangal na eupemismo sa Tagalog; ipinaliliwanag sa talababa ang anyong Hebreo.
- source_word: וַיִּזְכְּרֶהָ יְהוָה
  choice: inalala siya ni Yahweh
  rationale: Pinananatili ng “inalala” ang pangunahing larawan ng זכר nang hindi pa tahasang sinasabi ang magiging bunga. Nililinaw sa talababa na higit ito sa simpleng paggunita.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa isang karaniwang titulo.
- issue: Kung gagawing tahasan ang eupemismo para sa pagtatalik
  choice: Gamitin ang likas na eupemismong Tagalog na “sumiping”
  alternative: “nakilala” o “nakipagtalik”
  rationale: Ang literal na “nakilala” ay madaling mapagkamalan sa Tagalog, samantalang ang “nakipagtalik” ay mas tahas kaysa sa marahang Hebreong pananalita. Pinananatili ng “sumiping” ang kahulugan at antas ng pagiging mahinahon.
- issue: Kahulugan ng pag-alaala ni Yahweh kay Hana
  choice: Panatilihin ang “inalala” at ipaliwanag ang mabisang malasakit sa talababa
  alternative: “pinansin” o “ipinagkaloob ang kahilingan niya”
  rationale: Ang זכר ay maaaring magpahiwatig ng pagkilos na nagmumula sa tapat na malasakit, ngunit hindi pa tahasang sinasabi ng talata ang kinalabasan. Iniiwasan nitong unahan ang salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “tahanan” at “sumiping” upang mapanatili ang dignidad ng salaysay; iniwasan ang sobrang literal na “nakilala,” na malabo sa kasalukuyang Tagalog. Itinama rin ang pagkakalagay ng mga panandang talababa upang ang [a] ay tumukoy sa eupemismo at ang [b] sa “inalala.”
