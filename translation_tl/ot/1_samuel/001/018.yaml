base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/018.yaml
  text: She said[a], “May your servant find favor in your eyes.” Then the woman went on her way and ate[b], and her face was no longer downcast.
translation:
  language: tl
  text: Sinabi niya, “Nawa’y makasumpong ng lingap sa inyong paningin ang inyong lingkod.”[a] Pagkatapos, nagpatuloy sa kanyang lakad ang babae at kumain, at hindi na bakas sa kanyang mukha ang lungkot.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “iyong babaeng lingkod.” Isang mapagpakumbabang paraan ito ng pagtukoy ni Hana sa sarili.
    reason: lexical_alternative
  - marker: b
    text: 'Hindi karaniwan at hindi ganap na tahas ang literal na anyo ng Hebreo: “at ang kanyang mukha ay hindi na sa kanya.” Ipinahihiwatig nito na hindi na makikita sa kanyang mukha ang dating kalungkutan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: Nawa’y makasumpong
  rationale: Ang anyong di-ganap sa magalang na pananalita ay nagpapahayag ng hangarin o pakiusap, hindi payak na pahayag tungkol sa hinaharap.
- source_word: שִׁפְחָתְךָ
  choice: ang inyong lingkod
  rationale: Tahasang pambabae ang salitang Hebreo at ginagamit ni Hana bilang mapagpakumbabang pagtukoy sa sarili. Likas at magalang sa modernong Filipino ang “inyong lingkod”; malinaw na sa konteksto na babae ang nagsasalita.
- source_word: חֵן בְּעֵינֶיךָ
  choice: makasumpong ng lingap sa inyong paningin
  rationale: Pinananatili nito ang larawan ng idyomang Hebreo tungkol sa pagtanggap ng mabuting pagtingin, habang nananatiling malinaw at marangal sa Filipino.
- source_word: לְדַרְכָּהּ
  choice: nagpatuloy sa kanyang lakad
  rationale: Ipinahihiwatig ng parirala ang pag-alis at pagpapatuloy sa pupuntahan, hindi lamang ang literal na pagpunta sa isang daan.
- source_word: וַתֹּאכַל
  choice: kumain
  rationale: Payak na sumusunod na kilos ang isinasaad. Mahalaga ito sa konteksto sapagkat dati ay hindi makakain si Hana dahil sa matinding kalungkutan.
- source_word: וּפָנֶיהָ לֹא הָיוּ לָהּ עוֹד
  choice: hindi na bakas sa kanyang mukha ang lungkot
  rationale: Hindi ganap na tahas ang literal na Hebreo, ngunit sa konteksto ay tumutukoy ito sa nakikitang pagbabago ng anyo o ekspresyon ni Hana. Inihahatid ng salin ang ipinahihiwatig na diwa nang hindi sinasabing nawala na ang lahat ng kanyang suliranin.
theological_decisions:
- issue: Kung ang pagbabago sa mukha ni Hana ay nangangahulugang natupad na ang kanyang panalangin
  choice: Inilarawan lamang na hindi na nakikita sa kanyang mukha ang lungkot.
  alternative: Ipahiwatig na lubos na siyang masaya o tiyak nang natugunan ang kanyang panalangin.
  rationale: Ang talata ay naglalarawan ng pagbabago sa kanyang kilos at anyo matapos ang pakikipag-usap kay Eli; hindi nito tahasang sinasabing alam na niyang ipinagkaloob na ang kanyang kahilingan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang magalang na “inyong” sa pakikipag-usap ni Hana kay Eli. Pinanatili ang larawan ng “sa inyong paningin,” samantalang ang mahirap na huling pariralang Hebreo ay isinalin ayon sa konteksto at nilinaw sa talababa.
