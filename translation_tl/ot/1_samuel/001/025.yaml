  text: Then they slaughtered the bull and brought the boy to Eli[a][b].
translation:
  language: tl
  text: Pagkatapos, kinatay nila ang toro[a] at dinala ang batang lalaki[b] kay Eli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinatay.” Mas pangkalahatan ang maaaring kahulugan ng pandiwang Hebreo, ngunit higit na angkop ang “kinatay” sa konteksto ng paghahandog.
    reason: lexical_alternative
  - marker: b
    text: O “bata.” Ang Hebreong naʿar ay maaaring tumukoy sa isang batang lalaki, bata, o binata depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: Pagkatapos, kinatay nila
  rationale: Isinusulong ng wayyiqtol ang pagkakasunod-sunod ng salaysay. Ang “kinatay” ay likas sa makabagong Tagalog at mas malinaw na nagpapahiwatig ng konteksto ng paghahandog kaysa sa pangkalahatang “pinatay.”
- source_word: הַפָּר
  choice: ang toro
  rationale: Karaniwang tumutukoy ang פַּר sa lalaking baka, lalo na sa konteksto ng paghahandog. Hindi idinagdag rito ang edad sapagkat wala iyon sa mismong talata.
- source_word: וַיָּבִיאוּ
  choice: at dinala
  rationale: Ipinagpapatuloy ng ikalawang wayyiqtol ang salaysay; natural at malinaw sa Tagalog ang koordinasyong “at dinala.”
- source_word: הַנַּעַר
  choice: ang batang lalaki
  rationale: Malawak ang saklaw ng נַעַר—mula bata hanggang binata—ngunit napakabata pa ni Samuel sa kontekstong ito. Pinananatili ng “batang lalaki” ang kasarian at edad na ipinahihiwatig ng salaysay.
- source_word: אֶל עֵלִי
  choice: kay Eli
  rationale: Ipinahihiwatig ng אֶל ang paglapit o pagdadala tungo sa isang tao; “kay Eli” ang tuwiran at natural na katumbas sa Tagalog.
theological_decisions:
- issue: Diwang pansakripisyo ng pagkatay
  choice: “kinatay” upang mapanatili ang malamang na konteksto ng paghahandog nang walang idinaragdag na paliwanag sa pangunahing teksto
  alternative: “pinatay,” na mas pangkalahatan
  rationale: Ang kalapit na konteksto ay pagsamba at paghahandog sa Shilo. Ang “kinatay” ay tapat sa pandiwang Hebreo at nagpapanatili ng kaugnayang pansakripisyo.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Pagkatapos” upang malinaw na ihatid ang sunod-sunod na kilos sa salaysay; iniwasan ang luma o labis na pormal na pananalita.
