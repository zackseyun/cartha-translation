  yaml_path: translation/ot/1_samuel/001/013.yaml
  text: Hannah was speaking in her heart; only her lips were moving[a], but her voice was not heard. So Eli thought she was drunk.
translation:
  language: tl
  text: Si Hana ay nagsasalita sa kanyang puso[a]; tanging ang kanyang mga labi ang gumagalaw, ngunit hindi naririnig ang kanyang tinig. Kaya inakala ni Eli na lasing siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “nagsasalita sa sarili” o “nananalangin nang tahimik sa kanyang kalooban.” Literal sa Hebreo: “nagsasalita sa kanyang puso.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֶּרֶת עַל לִבָּהּ
  choice: nagsasalita sa kanyang puso
  rationale: Pinananatili nito ang larawan ng Hebreo habang ipinahihiwatig ng konteksto na panloob at walang tinig ang kanyang pananalita. Ipinaliliwanag sa talababa ang mas natural ngunit mas interpretibong mga alternatibo.
- source_word: רַק
  choice: lamang
  rationale: 'Ipinapakita nito ang paglilimita: ang paggalaw ng mga labi lamang ang nakikitang panlabas na palatandaan.'
- source_word: שְׂפָתֶיהָ נָּעוֹת
  choice: mga labi niya ang gumagalaw
  rationale: Ang pandiwa ay karaniwang tumutukoy sa paggalaw; ang aspektong nagpapatuloy ay likas na naihahayag ng “gumagalaw.”
- source_word: וְקוֹלָהּ לֹא יִשָּׁמֵעַ
  choice: ngunit hindi naririnig ang kanyang tinig
  rationale: Pinananatili ang pasibong diwa ng Niphal. Ang “ngunit” ay natural na naghahayag ng pagsalungat sa pagitan ng gumagalaw na mga labi at di-naririnig na tinig.
- source_word: וַיַּחְשְׁבֶהָ
  choice: inakala ni Eli na ... siya
  rationale: Natural na Filipino ito para sa pag-aakalang ang isang tao ay nasa isang kalagayan.
- source_word: לְשִׁכֹּרָה
  choice: lasing
  rationale: Tuwiran at karaniwang salin ito ng pang-uring nangangahulugang lango sa alak.
- source_word: וְחַנָּה הִיא
  choice: Si Hana ay
  rationale: Ginagawang paksa si Hana nang hindi nagdaragdag ng tahasang panandang temporal na wala sa Hebreo.
