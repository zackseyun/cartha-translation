  yaml_path: translation/ot/1_samuel/001/017.yaml
  text: Then Eli answered and said[a], “Go in peace, and may the God of Israel grant your petition that you have asked from him.”
translation:
  language: tl
  text: Sumagot si Eli, “Humayo ka nang payapa, at ipagkaloob nawa ng Diyos ng Israel ang kahilingang hiningi mo sa kanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן עֵלִי וַיֹּאמֶר
  choice: Sumagot si Eli
  rationale: Ang pinagsamang pormulang Hebreo na literal na ‘sumagot at sinabi’ ay likas na ipinahahayag sa modernong Tagalog bilang ‘sumagot,’ nang hindi nawawala ang tungkulin nito sa salaysay.
- source_word: לְכִי לְשָׁלוֹם
  choice: Humayo kang payapa
  rationale: Ang pambabaeng isahang pautos ay nakatuon kay Hana. Ipinahahayag ng ‘Humayo kang payapa’ ang idyomatikong basbas na may diwa ng kapayapaan at mabuting kalagayan.
- source_word: וֵאלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang katumbas ito ng pariralang construct na tumutukoy sa Diyos ng Israel.
- source_word: יִתֵּן
  choice: ipagkaloob nawa
  rationale: Bagaman literal na ‘magbigay,’ ang pandiwa ay may puwersa ng paghiling o pagbabasbas sa konteksto; likas na ipinahahayag iyon ng ‘nawa.’
- source_word: שֵׁלָתֵךְ
  choice: ang kahilingan mo
  rationale: Tumutukoy ang salita sa bagay na hiningi sa panalangin. Ang ‘kahilingan’ ay malinaw, marangal, at likas sa modernong Tagalog.
- source_word: אֲשֶׁר שָׁאַלְתְּ מֵעִמּוֹ
  choice: na hiniling mo sa kanya
  rationale: Pinananatili nito ang relative clause at ang panghalip ng Hebreo. Sa konteksto, ang ‘kanya’ ay tumutukoy sa Diyos.
theological_decisions:
- issue: Tinutukoy ng panghalip sa מֵעִמּוֹ
  choice: Pinanatili bilang ‘sa kanya,’ na sa konteksto ay tumutukoy sa Diyos.
  alternative: Tahasan itong gawing ‘sa Diyos.’
  rationale: Ang Hebreo ay gumagamit ng panghalip, at malinaw na ang Diyos ang tinutukoy dahil siya ang paksa ng naunang sugnay. Hindi kailangang palitan ang panghalip ng tahasang pangngalan.
- issue: Puwersa ng יִתֵּן
  choice: 'Paghiling o basbas: ‘ipagkaloob nawa.’'
  alternative: 'Tiyak na pahayag: ‘ipagkakaloob.’'
  rationale: Mas angkop sa anyo at konteksto ang jussive-like na paghiling kaysa gawing tiyak na pangako ang sinabi ni Eli.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘Humayo’ upang mapanatili ang tono ng basbas, at iniwasan ang sobrang literal na ‘sumagot at sinabi,’ na hindi likas sa Tagalog.
