  text: וַ/יַּ֛עַל הָ/אִ֥ישׁ אֶלְקָנָ֖ה וְ/כָל בֵּית֑/וֹ לִ/זְבֹּ֧חַ לַֽ/יהוָ֛ה אֶת זֶ֥בַח הַ/יָּמִ֖ים וְ/אֶת נִדְרֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/021.yaml
  text: Then the man Elkanah went up with all his household to sacrifice to Yahweh the yearly sacrifice and his vow[a].
translation:
  language: tl
  text: Pagkatapos, umakyat si Elkana kasama ang buo niyang sambahayan upang ihandog kay Yahweh ang taunang handog at ang kanyang panata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin, “at upang tuparin ang kanyang panata.” Eliptiko ang Hebreo: maaaring unawain na ang pandiwang “ihandog” ay sumasaklaw rin sa “kanyang panata,” ibig sabihin, umakyat din siya upang gawin ang kanyang ipinangako.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Pinananatili nito ang karaniwang diwa ng עלה na ‘umakyat’ at ang konteksto ng paglalakbay patungo sa santuwaryo sa Shilo.
- source_word: הָאִישׁ אֶלְקָנָה
  choice: si Elkana
  rationale: Bagaman tahasang may ‘ang lalaki’ sa Hebreo, sapat at mas natural sa Tagalog ang pagpapangalan kay Elkana; hindi kailangang idagdag ang impormasyong malinaw na sa pangalang pantangi.
- source_word: וְכָל בֵּיתוֹ
  choice: kasama ang buo niyang sambahayan
  rationale: Ang בַּיִת dito ay tumutukoy sa mga kabilang sa sambahayan, hindi sa gusali. Ang ‘sambahayan’ ay likas at pinananatili ang kolektibong diwa.
- source_word: לִזְבֹּחַ
  choice: upang ihandog
  rationale: Sa kontekstong panrelihiyon, tumutukoy ang זבח sa paghahandog ng hain. Natural sa Tagalog ang ‘ihandog’ kapag sinusundan ng mismong handog.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang ‘Yahweh’ upang panatilihin ang personal na pangalan ng Diyos sa tekstong Hebreo.
- source_word: זֶבַח הַיָּמִים
  choice: ang taunang handog
  rationale: Ang idyomang Hebreo ay tumutukoy sa handog na paulit-ulit na inihahandog bawat taon; malinaw at natural ang ‘taunang handog.’
- source_word: וְאֶת נִדְרוֹ
  choice: at ang kanyang panata
  rationale: Pinananatili ang eliptikong koordinasyon ng Hebreo sa halip na tahasang idagdag ang ‘tuparin,’ na wala sa mismong parirala.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalang nasa Hebreo nang hindi ito pinapalitan ng titulo.
- issue: Ugnayan ng panata sa pandiwang ‘maghandog’
  choice: panatilihin ang ‘at ang kanyang panata’ at ipaliwanag sa talababa
  alternative: ‘at upang tuparin ang kanyang panata’
  rationale: Eliptiko ang Hebreo at maaaring maunawaan bilang pagpunta upang isagawa ang ipinangako. Hindi tahasang nilulutas sa pangunahing teksto ang posibleng tensiyon sa gramatika.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘sambahayan’ upang ipahayag ang kolektibong diwa ng Hebreo, at pinanatili sa pangunahing teksto ang elipsis tungkol sa panata, na nilinaw lamang sa talababa.
