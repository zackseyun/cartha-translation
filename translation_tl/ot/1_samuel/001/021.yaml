  source_fidelity: 'Tapat ang salin sa Hebreo: naipapakita ang pag-akyat ni Elkana kasama ang buong sambahayan upang maghandog kay Yahweh ng taunang handog at ng kanyang panata. Maingat na pinananatili ng pangunahing teksto ang elipsis sa וְאֶת־נִדְרוֹ sa halip na ipasok bilang tiyak na pandiwa ang ‘tuparin.’'
  naturalness: Natural at marangal ang modernong Filipino. Ang ‘umakyat,’ ‘sambahayan,’ at ‘taunang handog’ ay malinaw at angkop sa kontekstong pagsamba. Bagaman bahagyang di-karaniwan ang pagsasamang ‘ihandog ... ang kanyang panata,’ ito ay sinasadyang literal na pag-iingat sa elipsis at sapat na nililinaw ng talababa.
  terminology: Wasto ang ‘Yahweh’ para sa יהוה, ‘sambahayan’ para sa בֵּיתוֹ, at ‘panata’ para sa נִדְרוֹ. Ang ‘handog’ ay angkop sa sakripisyal na diwa ng זבח sa kontekstong ito.
