base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/028.yaml
  text: So I also have given him to Yahweh[a]; all the days that he lives[b], he is given to Yahweh.” And he worshiped Yahweh there.
translation:
  language: tl
  text: Kaya ipinagkatiwala ko rin siya kay Yahweh[a]; sa buong buhay niya, nakatalaga siya kay Yahweh.” At sumamba siya[b] roon kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “ipinahiram ko siya kay Yahweh” o “inihandog ko siya kay Yahweh.” Ginagamit dito sa Hebreo ang salitang-ugat na ginamit sa “humingi” kanina sa kabanata, kaya may paglalaro sa mga salitang “hiningi” at “ipinahiram” na hindi ganap na mailipat sa Tagalog.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “At sumamba sila roon kay Yahweh.” Hindi tahasang tinutukoy sa konteksto kung sino ang sumamba, at magkaiba ang pagkaunawa rito sa tradisyon ng pagsasalin.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁאִלְתִּהוּ
  choice: ipinagkatiwala ko rin siya
  rationale: Ipinahihiwatig ng Hiphil ng שׁאל na ibinibigay o inilalaan ni Hana ang batang hiningi niya. Mas natural sa makabagong Tagalog ang “ipinagkatiwala” kaysa “ipinahiram,” habang nililinaw ng talababa ang paglalaro sa salitang-ugat.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang pang-ukol ay nagsasaad kung kanino ipinagkakatiwala at itinatalaga si Samuel; pinananatili ang personal na pangalang Yahweh.
- source_word: כָּל הַיָּמִים אֲשֶׁר הָיָה
  choice: sa buong buhay niya
  rationale: Likas at malinaw na salin sa Tagalog ng idyomang tumutukoy sa lahat ng araw na siya ay nabubuhay.
- source_word: שָׁאוּל
  choice: nakatalaga
  rationale: Ipinakikita ng konteksto ang patuloy at panghabambuhay na paglalaan kay Yahweh. Hindi lubos na mauulit sa Tagalog ang salitang-ugat na שׁאל nang hindi nagmumukhang pansamantalang pautang.
- source_word: וַיִּשְׁתַּחוּ
  choice: sumamba siya
  rationale: Ang pandiwa ay tumutukoy sa pagyukod bilang pagsamba. Pinili ang isahang pagbasa ng anyong Masoretiko, ngunit hindi tiyak sa konteksto kung sino ang tinutukoy kaya may talababa.
- source_word: שָׁם
  choice: roon
  rationale: Natural na katumbas sa Tagalog ng payak na pang-abay na panlunan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang pinananatili ang pangalang tipan na nasa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Paksa ng וַיִּשְׁתַּחוּ
  choice: sumamba siya
  alternative: sumamba sila
  rationale: Pinapaboran ng anyong Masoretiko ang isahan, ngunit hindi tahasang binanggit ang paksa at may tradisyon ng saling maramihan; kaya pinananatili sa talababa ang alternatibo.
- issue: Kahulugan ng paglalaan kay Yahweh
  choice: ipinagkatiwala / nakatalaga
  alternative: ipinahiram
  rationale: Iniiwasan ang pahiwatig na pansamantala lamang ang pag-aalay, yamang malinaw na panghabambuhay ito, habang inilalahad sa talababa ang mahalagang pag-uulit ng salitang-ugat na שׁאל.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinagkatiwala” at “nakatalaga” upang ihatid ang panghabambuhay na pag-aalay nang hindi magmukhang pansamantalang pautang; ipinaliwanag sa talababa ang salitang-laro sa Hebreo.
