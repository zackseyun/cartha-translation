  text: וְ/כֵ֨ן יַעֲשֶׂ֜ה שָׁנָ֣ה בְ/שָׁנָ֗ה מִ/דֵּ֤י עֲלֹתָ/הּ֙ בְּ/בֵ֣ית יְהוָ֔ה כֵּ֖ן תַּכְעִסֶ֑/נָּה וַ/תִּבְכֶּ֖ה וְ/לֹ֥א תֹאכַֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/007.yaml
  text: 'And so it happened year after year: whenever she went up to the house of Yahweh[a], Peninnah would provoke her[b], and she would weep and not eat.'
translation:
  language: tl
  text: 'At ganito ang nangyayari taon-taon[a]: tuwing umaakyat si Hana patungo sa bahay ni Yahweh[b], ginigalit siya ni Penina, kaya umiiyak siya at hindi kumakain.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ganito ang ginagawa niya taon-taon.” Panlalaking isahan ang pandiwang Hebreo at maaaring tumukoy kay Elkana, ngunit maaari ring ibuod ng sugnay ang paulit-ulit na pangyayari.
    reason: alternative_reading
  - marker: b
    text: Maaari ring unawain na “sa loob o sa lugar ng bahay ni Yahweh.” Literal na “sa” ang pang-ukol sa Hebreo, bagaman sa konteksto ng pag-ahon ay natural itong tumukoy sa patutunguhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן יַעֲשֶׂה
  choice: At ganito ang nangyayari
  rationale: Ang pandiwa ay literal na panlalaking isahan, “ginagawa niya,” ngunit sa konteksto maaari itong magsilbing idyomatikong buod ng paulit-ulit na pangyayari. Pinananatili sa talababa ang posibilidad na si Elkana ang ipinahihiwatig na simuno.
- source_word: שָׁנָה בְשָׁנָה
  choice: taon-taon
  rationale: Likas na Filipino para sa distributibong pariralang Hebreo na nagsasaad ng taunang pag-uulit.
- source_word: מִדֵּי עֲלֹתָהּ
  choice: tuwing umaahon si Hana
  rationale: Ipinahahayag ng מִדֵּי at infinitibo ang paulit-ulit na pagkakataon, “tuwing.” Ang hulaping pambabae ay tumutukoy kay Hana; ginamit ang pangalan upang maiwasan ang malabong panghalip sa Filipino.
- source_word: בְּבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Sa piling ng pandiwang “umaahon,” likas na nauunawaan ang “sa” bilang patutunguhan. Ang literal na lokatibong diwa ay inilalahad sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalang nasa tekstong Hebreo.
- source_word: תַּכְעִסֶנָּה
  choice: ginagalit siya ni Penina
  rationale: Ang Hiphil ng כעס ay pagpapagalit o matinding pang-iinis. Ang ayos na ito ay malinaw at natural sa Filipino; ang pangalang Penina ay mula sa agarang konteksto at nililinaw kung sino ang gumagawa at sino ang pinatutungkulan.
- source_word: וַתִּבְכֶּה וְלֹא תֹאכַל
  choice: kaya umiiyak siya at hindi kumakain
  rationale: Bagaman magkaiba ang anyong pandiwa sa Hebreo, kapwa inilalarawan dito ang nakagawiang bunga sa paulit-ulit na sitwasyon. Ang “kaya” ay natural na nagpapakita ng bunga nang hindi dinaragdagan ang teolohikal na diwa.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Nasa talata mismo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Simuno ng יַעֲשֶׂה
  choice: 'Idyomatikong buod: “ganito ang nangyayari”'
  alternative: “Ganito ang ginagawa niya,” na tumutukoy kay Elkana
  rationale: Panlalaking isahan ang pandiwa at maaaring tumukoy kay Elkana, ngunit maaari ring ibuod ng sugnay ang taunang sitwasyon. Hindi tahasang nilulutas ang tunay na kalabuan; inihaharap ang literal na posibilidad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga pangalang Hana at Penina sa halip na magkasunod na malalabong panghalip, habang pinanatili sa talababa ang mahalagang kalabuan ng unang pandiwa.
