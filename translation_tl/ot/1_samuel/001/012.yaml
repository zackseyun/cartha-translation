  text: וְ/הָיָה֙ כִּ֣י הִרְבְּתָ֔ה לְ/הִתְפַּלֵּ֖ל לִ/פְנֵ֣י יְהוָ֑ה וְ/עֵלִ֖י שֹׁמֵ֥ר אֶת פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/012.yaml
  text: And as she continued praying before Yahweh[a], Eli was watching her mouth.
translation:
  language: tl
  text: At habang patuloy siyang nananalangin sa harap ni Yahweh, pinagmamasdan ni Eli ang kanyang bibig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At habang
  rationale: Ipinakikilala ng pormulang Hebreo ang kalagayang kasabay ng sumunod na kilos. Likas sa makabagong Tagalog ang “At habang” at napapanatili nito ang temporal na diwa nang hindi nagiging mabigat.
- source_word: הִרְבְּתָה לְהִתְפַּלֵּל
  choice: patuloy siyang nananalangin
  rationale: Ang Hiphil ng רבה kasama ng infinitibong להתפלל ay idyomatikong nagpapahiwatig ng matagal o paulit-ulit na pananalangin. Ang “patuloy siyang nananalangin” ay natural at tumpak.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ng “sa harap” ang karaniwang idyomang Hebreo para sa pagkilos sa presensiya ng Diyos, at ang pangalang pantangi na Yahweh ay likas na kinukuha ng “ni.”
- source_word: שֹׁמֵר
  choice: pinagmamasdan
  rationale: Ang Qal participle ay nagsasaad ng nagpapatuloy na kilos. Ipinahihiwatig ng “pinagmamasdan” ang maingat at tuloy-tuloy na pagmamasid ni Eli.
- source_word: אֶת פִּיהָ
  choice: ang kanyang bibig
  rationale: Literal na “bibig” ang Hebreo. Hindi ito pinalitan ng “mga labi,” sapagkat tahasang binabanggit ang mga labi sa kasunod na talata.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang natatanging pangalang tipan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nananalangin” sa halip na mas kolokyal na “nagdarasal,” at pinanatili ang payak na daloy ng salaysay.
