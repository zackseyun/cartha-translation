base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/027.yaml
  text: For this boy I prayed[b][a], and Yahweh has given me my petition that I asked from him.
translation:
  language: tl
  text: Para sa batang ito ako nanalangin,[a] at ibinigay sa akin ni Yahweh ang kahilingan ko[b] na hiningi ko sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tungkol sa batang ito ako nanalangin.” Maaaring tukuyin ng pang-ukol sa Hebreo ang bagay na ipinanalangin ni Hana.
    reason: lexical_alternative
  - marker: b
    text: O “pakiusap ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל הַנַּעַר הַזֶּה
  choice: Para sa batang ito
  rationale: Sa konstruksiyong ito kasama ng pandiwang ‘manalangin,’ maaaring tukuyin ng אֶל ang taong ipinanalangin o ang bagay na paksa ng panalangin. Natural sa Tagalog ang ‘Para sa batang ito,’ habang pinananatili sa talababa ang tunay na alternatibong ‘Tungkol sa batang ito.’ Ang נַעַר ay isinaling ‘batang’ dahil batang lalaki si Samuel sa konteksto.
- source_word: הִתְפַּלָּלְתִּי
  choice: ako nanalangin
  rationale: Tuwirang ipinahahayag ng hitpael ng פלל ang pananalangin. Ang naganap na aspekto ay angkop sa pagbabalik-tanaw ni Hana sa dati niyang panalangin.
- source_word: וַיִּתֵּן
  choice: ibinigay sa akin
  rationale: Ang wayyiqtol ay nagsasaad ng naganap na kilos. Isinasama sa sugnay ang לִי bilang ‘sa akin,’ at malinaw sa kasalukuyang paghaharap kay Samuel ang bunga ng pagkakaloob.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nakasulat sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: שְׁאֵלָתִי
  choice: ang kahilingan ko
  rationale: Ang pangngalan ay nangangahulugang kahilingan o pakiusap at may hulaping unang panauhan, kaya mahalagang panatilihin ang ‘ko.’ Mas natural sa karaniwang makabagong Tagalog ang ‘kahilingan’ kaysa ‘petisyon.’
- source_word: אֲשֶׁר שָׁאַלְתִּי מֵעִמּוֹ
  choice: na hiningi ko sa kanya
  rationale: Pinananatili ng ‘hiningi’ ang pag-uulit ng ugat na שאל sa abot ng natural na Tagalog, at ang ‘sa kanya’ ay malinaw na nagpapakitang kay Yahweh ginawa ang paghiling.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang ‘Yahweh’ ay nagpapanatili rito sa halip na palitan ng titulong ‘PANGINOON.’
- issue: Ugnayan ng panalangin ni Hana sa bata
  choice: Para sa batang ito ako nanalangin
  alternative: Tungkol sa batang ito ako nanalangin
  rationale: Maaaring ipahiwatig ng אֶל sa konstruksyong ito ang taong hiniling sa panalangin o ang paksang tungkol sa kanya. Pinili ang mas natural na pangunahing salin ngunit hindi nilutas nang tahimik ang kalabuan; inilagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘batang ito’ bilang natural na pagtukoy kay Samuel at ‘kahilingan’ para sa bokabularyo ng panalangin. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto at tumutugma sa mga talababa.
