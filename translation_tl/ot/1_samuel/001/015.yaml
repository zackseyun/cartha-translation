  to: Ngunit sumagot si Hana, “Hindi po, panginoon ko. Isa po akong babaeng may mabigat na kalooban.[a] Hindi ako uminom ng alak ni ng matapang na inumin.[b] Sa halip, ibinuhos ko ang aking kaluluwa sa harap ni Yahweh.”
  rationale: Inayos ang hindi likas na konstruksyon para sa “troubled/sorrowful in spirit” nang pinananatili ang saklaw ng Hebrew na panloob na dalamhati o pagkabalisa. Nilinaw rin ang negatibong pares ng mga inumin. Walang binago sa kahulugan, pangalan, antas ng paggalang, o mga panandang talababa.
