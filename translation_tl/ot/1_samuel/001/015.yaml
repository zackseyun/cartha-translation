base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/015.yaml
  text: But Hannah answered and said[a], “No, my lord. I am a woman troubled in spirit. I have drunk neither wine nor strong drink[b], but I have poured out my soul before Yahweh.”
translation:
  language: tl
  text: Ngunit sumagot si Hana, “Hindi po, panginoon ko. Isa po akong babaeng may mabigat na kalooban.[a] Hindi ako uminom ng alak ni ng matapang na inumin.[b] Sa halip, ibinuhos ko ang aking kaluluwa sa harap ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang babaeng tigib ng dalamhati.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay tumutukoy sa inuming nakalalasing na iba sa alak mula sa ubas.
    reason: lexical_clarification
lexical_decisions:
- source_word: לֹא אֲדֹנִי
  choice: Hindi po, panginoon ko
  rationale: Magalang na pakikipag-usap ito ni Hana kay Eli, hindi isang banal na titulo. Pinananatili ng “panginoon ko” ang paggalang at ang anyong may panghalip ng Hebreo; idinagdag ang “po” upang maging likas sa makabagong Tagalog.
- source_word: אִשָּׁה קְשַׁת רוּחַ
  choice: isang babaeng nababagabag ang kalooban
  rationale: Ipinahihiwatig ng parirala ang matinding dalamhati o panloob na pagkabalisa, hindi katigasan ng ulo. Ang “kalooban” ay likas na Tagalog para sa panloob na kalagayang tinutukoy rito ng רוּחַ.
- source_word: וְיַיִן וְשֵׁכָר
  choice: alak o matapang na inumin
  rationale: Pinag-iiba nito ang alak mula sa ubas at ang iba pang inuming nakalalasing nang hindi labis na tinutukoy kung anong sinaunang inumin iyon.
- source_word: לֹא שָׁתִיתִי
  choice: Hindi ako uminom
  rationale: Payak at natural na Tagalog ito para sa ganap na pandiwang Hebreo sa konteksto ng pagtanggi ni Hana sa paratang na paglalasing.
- source_word: וָאֶשְׁפֹּךְ אֶת נַפְשִׁי
  choice: ibinuhos ko ang aking kaluluwa
  rationale: Pinananatili nito ang matingkad na idyomang Hebreo tungkol sa taimtim at lubos na pagbubukas ng sarili sa panalangin, sa halip na palitan ito ng mas malayang “damdamin” o “puso.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang ipinahahayag ng לִפְנֵי ang pagiging nasa presensiya ng Diyos, at isinasalin ang pangalan ng tipan na יהוה bilang “Yahweh.”
- source_word: וַתַּעַן חַנָּה וַתֹּאמֶר
  choice: Ngunit sumagot si Hana
  rationale: Ang dalawang pandiwa ay karaniwang pormulang pasalaysay sa Hebreo. Ang isang likas na pandiwang “sumagot” ay sapat sa Tagalog, samantalang ipinakikita ng “Ngunit” ang pagsalungat ni Hana sa paratang ni Eli.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng pagbubuhos ng נֶפֶשׁ sa harap ng Diyos
  choice: ibinuhos ko ang aking kaluluwa
  alternative: ibinuhos ko ang aking puso / buong sarili
  rationale: Hindi tinutukoy rito ang isang teknikal na doktrina tungkol sa mga bahagi ng tao kundi ang lubos at taimtim na pagbubukas ng sarili sa panalangin. Pinananatili ng salin ang idyoma nang hindi nililimitahan ang kahulugan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “po” upang likas na maipakita ang paggalang ni Hana kay Eli. Napanatili ang biblikal na larawang “ibinuhos ko ang aking kaluluwa,” habang ginawang mas natural ang karaniwang dobleng pandiwang pasalaysay ng Hebreo.
