revisions:
- from: Nang sumapit ang araw ng paghahandog, naghandog si Elcana at nagbigay[a] ng mga bahagi kay Penina na kanyang asawa, at sa lahat ng kanyang mga anak na lalaki at babae.
  to: Nang dumating ang araw, naghandog si Elcana at nagbigay[a] ng mga bahagi kay Penina, na kanyang asawa, at sa lahat ng kanyang mga anak na lalaki at babae.
  rationale: Inalis ang idinagdag na pagtitiyak na “ng paghahandog” upang masundan ang saklaw ng Hebreo, at nilagyan ng kuwit ang appositive na “na kanyang asawa” para sa mas malinaw at natural na Filipino. Pinanatili ang talababa upang katawanin ang kontekstuwal na posibilidad ng nakaugaliang pagbibigay nang hindi inaalis ang payak na naratibong pagbasa.
