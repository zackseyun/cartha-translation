base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/004.yaml
  text: And when the day came[a], Elkanah sacrificed and gave portions to Peninnah his wife and to all her sons and daughters.
translation:
  language: tl
  text: Nang dumating ang araw, naghandog si Elcana at nagbigay[a] ng mga bahagi kay Penina, na kanyang asawa, at sa lahat ng kanyang mga anak na lalaki at babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring tumukoy ito sa nakaugaliang kilos: “nagbibigay siya” o “palagi siyang nagbibigay.”'
    reason: Pinahihintulutan ng anyo ng pandiwa at ng konteksto ang payak na nagdaang kilos o ang paulit-ulit na kaugalian.
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Nang sumapit ang araw ng paghahandog
  rationale: Isinasalin ang pormulang panahunan bilang likas na pambungad sa salaysay. Ipinahihiwatig ng kasunod na pandiwang זבח kung anong araw ang tinutukoy, kaya nilinaw ito nang hindi nagdaragdag ng bagong pangyayari.
- source_word: וַיִּזְבַּח
  choice: naghandog
  rationale: Sa kontekstong panrelihiyon, tumutukoy ang זבח sa pagkatay o pag-aalay ng handog. Ang “naghandog” ay maikli, natural, at hindi labis na tumutukoy sa mekanismo ng pagkatay.
- source_word: וְנָתַן
  choice: nagbigay
  rationale: Pinananatili nito ang payak na pagkakasunod ng mga kilos sa Hebreo. Gayunman, maaaring habitual ang kilos sa konteksto, kaya inilagay ang alternatibong pagbasa sa talababa.
- source_word: לִפְנִנָּה אִשְׁתּוֹ
  choice: kay Penina na kanyang asawa
  rationale: Malapit ito sa ayos ng Hebreo at malinaw pa rin sa makabagong Filipino.
- source_word: וּלְכָל בָּנֶיהָ וּבְנוֹתֶיהָ
  choice: at sa lahat ng kanyang mga anak na lalaki at babae
  rationale: Pinananatili ang tahasang pagbanggit sa mga anak na lalaki at mga anak na babae sa halip na paikliin lamang bilang “mga anak.”
- source_word: מָנוֹת
  choice: mga bahagi
  rationale: Tumutukoy ito sa mga bahaging inilaan sa bawat isa mula sa handog o handaan. Sapat na ang “mga bahagi” dahil malinaw na sa pangungusap ang konteksto ng paghahandog.
