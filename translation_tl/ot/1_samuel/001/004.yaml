translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinanatili ang tahasang pagbanggit sa asawa, mga anak na lalaki, at mga anak na babae. Inilagay ang talababa sa pandiwang may tunay na aspektuwal na kalabuan.
