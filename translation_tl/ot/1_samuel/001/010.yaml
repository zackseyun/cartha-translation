  text: וְ/הִ֖יא מָ֣רַת נָ֑פֶשׁ וַ/תִּתְפַּלֵּ֥ל עַל יְהוָ֖ה וּ/בָכֹ֥ה תִבְכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/010.yaml
  text: And she was bitter in soul[b][a], and she prayed to Yahweh and wept bitterly.
translation:
  language: tl
  text: Punô ng matinding dalamhati ang kanyang kalooban[a]. Nanalangin siya kay Yahweh at umiyak nang umiyak[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “mapait ang kanyang kaluluwa/kalooban,” isang idyoma para sa matinding panloob na dalamhati.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “umiyak nang labis” o “patuloy na umiyak.” Gumagamit ang Hebreo ng pinasidhi at paulit na anyo—sa literal, “sa pag-iyak ay umiyak siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרַת נָפֶשׁ
  choice: punô ng matinding dalamhati ang kanyang kalooban
  rationale: Ang literal na larawan ay “mapait ang kaluluwa/kalooban.” Ipinahahayag ng salin ang matinding panloob na paghihirap sa natural na Filipino, habang pinananatili sa talababa ang metapora ng Hebreo.
- source_word: וַתִּתְפַּלֵּל
  choice: nanalangin siya
  rationale: Tuwirang kahulugan ng anyong hitpael ng פלל ang pananalangin; hindi na idinagdag ang “taimtim” sapagkat ipinakikita na ng konteksto ang tindi ng damdamin.
- source_word: עַל יְהוָה
  choice: kay Yahweh
  rationale: Sa pagsama nito sa pandiwang “manalangin,” natural na ipinahihiwatig ng עַל ang pinatutungkulan ng panalangin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וּבָכֹה תִבְכֶּה
  choice: umiyak nang umiyak
  rationale: Ang infinitive absolute na kasunod ng kaugnay na pandiwa ay nagpapasidhi sa kilos. Natural na naihahatid ng pag-uulit sa Filipino ang mariin o nagpapatuloy na pag-iyak nang hindi ipinapasok sa pandiwa ang tiyak na diwang “mapait.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na halinhan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kalooban” para sa נֶפֶשׁ sa idyomang ito, at ang karaniwang hulma na “umiyak nang umiyak” upang natural na maipahayag ang Hebreong pagpapaigting.
