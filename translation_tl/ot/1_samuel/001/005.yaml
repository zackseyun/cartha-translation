  source_fidelity: 'Ang pangunahing diwa ay wasto: nakaugalian ni Elkana na magbigay kay Hana ng isang natatanging/dobleng bahagi dahil mahal niya ito, at si Yahweh ang nagsara ng kanyang sinapupunan. Gayunman, ang “kahit” ay nagdaragdag ng hayag na concessive na ugnayan na wala sa Hebreong waw; mas maingat ang “at,” na nagpapanatili sa pagkakatabi ng mga sugnay.'
  naturalness: Mas likas at malinaw sa modernong Filipino ang “Kay Hana naman ay nagbibigay siya” kaysa “Ngunit binibigyan niya si Hana,” sapagkat malinaw nitong itinatakda si Hana bilang tumatanggap at naipapakita ang nakaugaliang kilos sa salaysay.
  terminology: Ang “Yahweh,” “dobleng bahagi,” at “sinapupunan” ay angkop. Ang talababa ay sapat na nagpapanatili sa pinagtatalunang kahulugan ng אַפָּיִם.
