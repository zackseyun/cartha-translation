- from: Ngunit binibigyan niya si Hana ng dobleng bahagi[a], sapagkat mahal niya si Hana, kahit isinara ni Yahweh ang kanyang sinapupunan.
  to: Kay Hana naman ay nagbibigay siya ng dobleng bahagi[a], sapagkat mahal niya si Hana, at isinara ni Yahweh ang kanyang sinapupunan.
  rationale: Pinalitan ang “kahit” ng “at” upang hindi magdagdag ng isang tahasang ugnayang concessive na hindi minarkahan sa Hebreo. Inayos ang unang sugnay sa “Kay Hana naman ay nagbibigay siya” para sa mas natural na Filipino at para maipakita ang nakaugaliang kilos sa kontekstong pasalaysay. Pinanatili ang talababa dahil pinagtatalunan ang kahulugan ng parirala.
