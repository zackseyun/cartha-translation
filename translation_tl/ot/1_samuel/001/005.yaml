  text: וּ/לְ/חַנָּ֕ה יִתֵּ֛ן מָנָ֥ה אַחַ֖ת אַפָּ֑יִם כִּ֤י אֶת חַנָּה֙ אָהֵ֔ב וַֽ/יהוָ֖ה סָגַ֥ר רַחְמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/005.yaml
  text: But to Hannah he would give a double portion[a], because he loved Hannah, though Yahweh had closed her womb.
translation:
  language: tl
  text: Kay Hana naman ay nagbibigay siya ng dobleng bahagi[a], sapagkat mahal niya si Hana, at isinara ni Yahweh ang kanyang sinapupunan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isang bahagi ng dalawang mukha/butas ng ilong.” Mahirap unawain ang parirala at maaaring mangahulugang “dobleng bahagi” o “natatanging bahagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/חַנָּה
  choice: Ngunit … si Hana
  rationale: Ipinahihiwatig ng pang-ugnay at pang-ukol ang pagtutol sa naunang talata, kung saan tumatanggap ng mga bahagi si Penina at ang kanyang mga anak.
- source_word: יִתֵּן
  choice: binibigyan niya
  rationale: Ang imperfect sa kontekstong pasalaysay ay tumutukoy sa nakaugaliang kilos ni Elkana tuwing naghahandog; likas sa Filipino ang aspektong imperpektibo para sa paulit-ulit na kilos noon.
- source_word: מָנָה אַחַת אַפָּיִם
  choice: dobleng bahagi[a]
  rationale: Mahirap ang literal na pariralang ‘isang bahagi ng dalawang mukha/butas ng ilong.’ Malamang na tumutukoy ito sa dobleng bahagi, ngunit inilalahad sa talababa ang maaaring kahulugang natatanging bahagi.
- source_word: כִּי אֶת חַנָּה אָהֵב
  choice: sapagkat mahal niya si Hana
  rationale: Ang כִּי ay nagbibigay ng dahilan, at tuwirang sinasabi ng kasunod na sugnay ang pag-ibig ni Elkana kay Hana.
- source_word: וַֽ/יהוָה
  choice: ni Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton יהוה.
- source_word: סָגַר רַחְמָהּ
  choice: isinara … ang kanyang sinapupunan
  rationale: Tuwirang inilalarawan ng pandiwa ang pagsasara, at ang רֶחֶם ay ‘sinapupunan’; malinaw at marangal ang parirala sa modernong Filipino.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Direktang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang natatanging pangalan sa halip na palitan ito ng titulo.
- issue: Ugnayan ng pag-ibig ni Elkana at pagkabaog ni Hana
  choice: kahit isinara ni Yahweh ang kanyang sinapupunan
  alternative: at isinara ni Yahweh ang kanyang sinapupunan
  rationale: 'Ang ‘kahit’ ay nagpapahayag ng malamang na pasalungat na ugnayan ng magkatabing sugnay: mahal ni Elkana si Hana sa kabila ng kanyang pagkabaog. Gayunman, hindi nito inaalis ang tuwirang pahayag na si Yahweh ang nagsara ng kanyang sinapupunan.'
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “binibigyan” upang ipakita ang nakaugaliang kilos at “sinapupunan” bilang malinaw at angkop na katawagan sa konteksto.
