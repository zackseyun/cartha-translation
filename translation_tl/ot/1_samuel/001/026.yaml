base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/026.yaml
  text: And she said[a], “Please, my lord, as surely as you live, my lord, I am the woman who stood here beside you, praying to Yahweh.
translation:
  language: tl
  text: At sinabi niya, “Pakiusap po,[a] panginoon ko, kung paanong buhay kayo, panginoon ko, ako ang babaeng nakatayo rito sa tabi ninyo noon at nananalangin kay Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “sa buhay ninyo,” o mas literal, “kung paanong buhay ang inyong kaluluwa.” Isa itong pormula ng taimtim na panunumpa o pagsusumamo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Nakikiusap po ako
  rationale: Ang בִּי sa tuwirang pakikipag-usap ay magalang na pakiusap. Likas sa modernong Tagalog ang “Nakikiusap po ako” at pinananatili nito ang mapagpakumbabang tono.
- source_word: אֲדֹנִי
  choice: panginoon ko
  rationale: Magalang na tawag ito ni Hana kay Eli, hindi banal na titulo. Pinananatili ng “panginoon ko” ang malinaw na paggalang at pagkakaiba sa pangalang Yahweh.
- source_word: חֵי נַפְשְׁךָ
  choice: habang kayo’y nabubuhay
  rationale: Isang pormula ito ng taimtim na panunumpa na literal na tumutukoy sa buhay ng kausap. Ang salin ay malinaw at natural, nang hindi ipinapalagay na simpleng pagbati lamang ito.
- source_word: הָאִשָּׁה
  choice: ang babaeng
  rationale: Tinutukoy ng tiyak na pangngalan si Hana bilang mismong babaeng nakita noon ni Eli.
- source_word: הַנִּצֶּבֶת
  choice: nakatayo
  rationale: Ang participle ay naglalarawan sa posisyon ni Hana sa naunang tagpo; natural itong maipahayag sa Tagalog bilang “nakatayo.”
- source_word: עִמְּכָה
  choice: sa tabi ninyo
  rationale: Sa konteksto, lokasyong malapit kay Eli ang diwa, hindi pakikisama o pagsama sa kaniya.
- source_word: בָּזֶה
  choice: rito
  rationale: Itinuturo nito ang mismong lugar ng naunang pangyayari; maikli at natural ang “rito.”
- source_word: לְהִתְפַּלֵּל
  choice: nananalangin
  rationale: Ipinapahayag nito ang ginagawa ni Hana habang nakatayo roon; ang aspektong imperpektibo ay angkop sa nagpapatuloy na kilos sa naunang tagpo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa pormulang חֵי נַפְשְׁךָ
  choice: habang kayo’y nabubuhay
  alternative: saksi ang buhay ninyo / kung paanong buhay ang inyong kaluluwa
  rationale: Pinananatili ng napiling salin ang taimtim na pormula at pagtukoy sa buhay ng kausap, ngunit iniiwasan ang salitang “kaluluwa,” na maaaring magpasok ng di-kinakailangang teknikal na teolohikal na pakahulugan sa נֶפֶשׁ dito.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang יְהוָה sa pinagmulan; pinananatili ng “Yahweh” ang pangalan at malinaw itong naiiba sa אֲדֹנִי, na tawag kay Eli.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal. Ginamit ang “po” at maramihang panghalip na “kayo/ninyo” bilang likas na katumbas ng paggalang ni Hana kay Eli. Hindi nilagyan ng talababa dahil naipapahayag nang sapat sa pangunahing teksto ang pormula ng taimtim na pananalita.
