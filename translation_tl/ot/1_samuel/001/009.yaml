source:
  edition: WLC
  text: וַ/תָּ֣קָם חַנָּ֔ה אַחֲרֵ֛י אָכְלָ֥ה בְ/שִׁלֹ֖ה וְ/אַחֲרֵ֣י שָׁתֹ֑ה וְ/עֵלִ֣י הַ/כֹּהֵ֗ן יֹשֵׁב֙ עַל הַ/כִּסֵּ֔א עַל מְזוּזַ֖ת הֵיכַ֥ל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/009.yaml
  text: After they had eaten in Shiloh[a], and after they had drunk, Hannah rose. Now Eli the priest was sitting on the seat by the doorpost of the temple of Yahweh.
translation:
  language: tl
  text: Pagkatapos kumain si Hana sa Shilo at pagkatapos niyang uminom, tumayo siya. Samantala, ang paring si Eli ay nakaupo sa upuan sa tabi ng hamba ng pinto ng templo[a] ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “santuwaryo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: tumayo
  rationale: Ang Qal wayyiqtol ng קום ay nagsasaad ng pagtayo o pagbangon upang kumilos; natural at tuwiran dito ang “tumayo.”
- source_word: אַחֲרֵי אָכְלָה ... וְאַחֲרֵי שָׁתֹה
  choice: Pagkatapos kumain ... at pagkatapos uminom
  rationale: Pinananatili ng mga pariralang walang tahasang paksa ang hindi ganap na tiyak na tinutukoy ng Hebreo, sa halip na ipasiya kung si Hana lamang o ang buong pangkat ang kumain at uminom.
- source_word: בְשִׁלֹה
  choice: sa Shilo
  rationale: Karaniwang lokatibong salin ng ב ang “sa,” at ang “Shilo” ang natural na anyong Filipino ng pangalan ng lugar.
- source_word: וְעֵלִי הַכֹּהֵן יֹשֵׁב
  choice: Samantala, ang paring si Eli ay nakaupo
  rationale: Ang participle na יֹשֵׁב ay naglalarawan ng nagpapatuloy na kalagayan sa likuran ng pangunahing kilos; ipinahihiwatig ito ng “Samantala” at “ay nakaupo.”
- source_word: עַל הַכִּסֵּא
  choice: sa upuan
  rationale: Maaaring mangahulugan ang כִּסֵּא ng upuan, silya, o trono. Ang pangkalahatang “upuan” ay akma sa tagpo at hindi nagdaragdag ng maharlikang pahiwatig.
- source_word: עַל מְזוּזַת
  choice: sa tabi ng hamba ng pinto
  rationale: Ang מְזוּזָה ay hamba ng pinto, at lokatibo rito ang עַל; natural sa Filipino ang “sa tabi ng.”
- source_word: הֵיכַל יְהוָה
  choice: templo ni Yahweh
  rationale: Ang הֵיכָל ay maaaring tumukoy sa templo o santuwaryo. Ang “templo” ay malinaw na pangunahing salin, habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” alinsunod sa patakaran ng proyekto at nang hindi pinapalitan ito ng isang titulo.
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Pinananatili ang personal na pangalan sa anyong transliterasyong “Yahweh”; hindi ito nagdaragdag ng doktrinal na pagpapakahulugan.
- issue: Kahulugan ng הֵיכַל sa Shilo
  choice: templo
  alternative: santuwaryo
  rationale: Saklaw ng salita ang parehong ideya. Ginamit ang “templo” sa teksto ngunit pinanatili sa talababa ang “santuwaryo,” lalo na dahil bago pa ito sa templong itinayo ni Solomon.
- issue: Paksa ng pagkain at pag-inom
  choice: Hindi tahasang pinangalanan ang paksa
  alternative: Pagkatapos nilang kumain at uminom / Pagkatapos niyang kumain at uminom
  rationale: Hindi lubos na tiyak sa anyo at konteksto ng Hebreo kung si Hana lamang o ang pangkat ang tinutukoy. Ang likas na pariralang Filipino na walang tahasang paksa ay nagpapanatili ng tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Samantala” upang ipakita ang pangyayaring nasa likuran, “hamba ng pinto” para sa tiyak na bahagi ng pasukan, at mga pariralang walang tahasang paksa upang hindi alisin ang tunay na kalabuan ng Hebreo.
