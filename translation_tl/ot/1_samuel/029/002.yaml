translation:
  language: tl
  text: At ang mga pinuno ng mga Filisteo ay nagmamartsa nang pangkat-pangkat na tig-iisandaan at tig-iisang libo[a], at si David at ang kanyang mga tauhan ay nagmamartsa sa hulihan kasama ni Akis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang daan-daan at libo-libo,” na maaaring tumukoy sa mga yunit ng hukbo na nakaayos sa mga pangkat na tig-iisandaan at tig-iisang libo.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: mga pinuno
  rationale: Tumutukoy ito sa matataas na tagapamahala ng mga lungsod-estado ng mga Filisteo. Ang “mga pinuno” ay natural at marangal sa modernong Filipino nang hindi nagdaragdag ng tiyak na titulong wala sa teksto.
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang katawagang Filipino sa pangkat ng mga taong ito.
- source_word: עֹבְרִים
  choice: nagmamartsa
  rationale: Ang participle ay naglalarawan ng nagpapatuloy na pagkilos sa isang hanay militar. Sa kontekstong ito, mas natural at malinaw ang “nagmamartsa” kaysa sa literal na “dumaraan.”
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: nang pangkat-pangkat na tig-iisandaan at tig-iisang libo
  rationale: Ipinahihiwatig ng parirala ang pagkakaayos sa mga yunit na binubuo ng daan-daan at libo-libo; pinananatili ng salin ang distributibong diwa at nililinaw ang kontekstong militar.
- source_word: אֲנָשָׁיו
  choice: ang kanyang mga tauhan
  rationale: Tumutukoy sa mga lalaking kasama at mandirigma ni David. Ang “mga tauhan” ay likas sa Filipino at hindi kasingkipot ng “mga sundalo.”
- source_word: בָּאַחֲרֹנָה
  choice: sa hulihan
  rationale: Malinaw na ipinapahayag ang posisyon nila sa pinakadulong bahagi ng hanay.
- source_word: עִם אָכִישׁ
  choice: kasama ni Akis
  rationale: Tuwirang ipinapahayag ang pagsama ni David at ng kanyang mga tauhan kay Akis.
