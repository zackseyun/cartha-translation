translation_notes:
  register: Modernong Filipino na malinaw, dignificado, at madaling maunawaan. Ginamit ang “nagmamartsa” upang maipakita ang patuloy at militar na pagkilos, at ang “samantalang” upang natural na iugnay ang dalawang magkasabay na hanay.
