  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֣עַן אָכִישׁ֮ וַ/יֹּ֣אמֶר אֶל דָּוִד֒ יָדַ֕עְתִּי כִּ֣י ט֥וֹב אַתָּ֛ה בְּ/עֵינַ֖/י כְּ/מַלְאַ֣ךְ אֱלֹהִ֑ים אַ֣ךְ שָׂרֵ֤י פְלִשְׁתִּים֙ אָֽמְר֔וּ לֹֽא יַעֲלֶ֥ה עִמָּ֖/נוּ בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/009.yaml
  text: Achish answered and said to David[a], “I know that you are good in my eyes, like an angel of God. Yet the commanders of the Philistines have said, ‘He must not go up with us into battle.’”
translation:
  language: tl
  text: Sumagot si Aquis at sinabi kay David, “Alam kong mabuti ka sa aking paningin, gaya ng isang anghel ng Diyos.[a] Ngunit sinabi ng mga kumander ng mga Filisteo, ‘Hindi siya dapat sumama sa atin sa labanan.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahero ng Diyos.” Ang salitang Hebreo na מַלְאָךְ ay maaaring mangahulugang “mensahero” o “anghel,” bagaman mas likas sa pananalitang ito ang “anghel ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Sumagot ... at sinabi
  rationale: Pinananatili ang magkasunod na pandiwang salaysay ng Hebreo, kahit may bahagyang pag-uulit, sa paraang malinaw pa rin sa modernong Tagalog.
- source_word: יָדַעְתִּי
  choice: Alam ko
  rationale: Ipinahahayag ng anyong perpekto rito ang matatag at kasalukuyang pagkilala ni Aquis kay David.
- source_word: טוֹב אַתָּה בְּעֵינַי
  choice: mabuti ka sa aking paningin
  rationale: Pinananatili ang malawak na kahulugan ng טוֹב at ang Hebreong idyomang ‘sa aking paningin’ nang hindi ito nililimitahan sa katapatan o pagiging kalugod-lugod lamang.
- source_word: כְּמַלְאַךְ אֱלֹהִים
  choice: gaya ng isang anghel ng Diyos
  rationale: Sa pariralang ito, ang diwang makalangit ng מַלְאָךְ ang mas likas, ngunit inilalagay sa talababa ang tunay na alternatibong ‘mensahero.’ Isa itong paghahambing na nagpapahayag ng napakataas na pagtingin.
- source_word: אַךְ
  choice: Ngunit
  rationale: Malinaw na ipinakikita ang pagsalungat sa personal na pagtatasa ni Aquis at sa pasiya ng mga pinunong Filisteo.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: mga kumander ng mga Filisteo
  rationale: Ang mga שָׂרִים ay mga pinunong militar sa konteksto ng kampanya; tuwiran at likas sa modernong Filipino ang ‘mga kumander.’
- source_word: לֹא יַעֲלֶה עִמָּנוּ בַּמִּלְחָמָה
  choice: Hindi siya dapat sumama sa atin sa labanan
  rationale: Ipinahahayag ng ‘hindi ... dapat’ ang pagbabawal o tiyak na pasiya. Ang ‘sumama ... sa labanan’ ang likas na Tagalog para sa paglahok sa kampanyang militar; hindi pinilit ang literal na ‘umahon,’ na magiging malabo rito.
theological_decisions:
- issue: Kahulugan ng מַלְאַךְ אֱלֹהִים sa paghahambing ni Aquis
  choice: anghel ng Diyos
  alternative: mensahero ng Diyos
  rationale: Malamang na idyomatikong paghahambing ito na nagpapahayag ng sukdulang pagtitiwala o paggalang kay David, hindi pahayag tungkol sa kaniyang likas na pagkatao. Pinananatili sa talababa ang leksikal na posibilidad na ‘mensahero.’
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang Hebreong idyomang ‘sa aking paningin’ at ang bahagyang pormal na ‘sumagot ... at sinabi,’ habang ginawang likas sa Tagalog ang paglalarawan sa pagsama sa kampanyang militar.
