  source_fidelity: 'Tapat ang salin sa Hebreo: pinananatili nito ang magkapares na pandiwang “sumagot … at sinabi,” ang kasalukuyang puwersa ng “alam ko,” ang idyomang “mabuti ka sa aking paningin,” ang paghahambing na “gaya ng isang anghel ng Diyos,” at ang pasiyang hindi dapat sumama si David sa labanan. Ang “sumama sa atin sa labanan” ay isang likas na katumbas ng pag-ahon/pagsama sa kampanyang militar, nang hindi nagdadagdag ng kahulugan.'
  naturalness: Marangal, malinaw, at natural sa modernong Filipino Tagalog ang kabuuang daloy. Ang “sa aking paningin” ay bahagyang pormal ngunit angkop sa rehistrong biblikal at maingat na nagpapanatili ng Hebreong idyoma. Ang “mga kumander” ay nauunawaan at angkop sa kontekstong militar.
  terminology: Wasto at pare-pareho ang mga pangalang Aquis, David, at mga Filisteo. Ang “anghel ng Diyos” ay ang mas likas na pagbasa sa pariralang ito, habang maayos na inilalahad ng talababa ang leksikal na alternatibong “mensahero ng Diyos” nang hindi ito ginagawang doktrinal na pahayag.
