translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang literal na “mga kampo” sa pangunahing teksto at inilagay sa talababa ang mas interpretatibong mga alternatibong militar. Walang idinagdag na panimulang discourse marker na walang tahasang katumbas sa Hebreo.
