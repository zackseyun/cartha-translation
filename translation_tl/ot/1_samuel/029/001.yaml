  yaml_path: translation/ot/1_samuel/029/001.yaml
  text: The Philistines gathered all their camps at Aphek[b][a], while Israel was encamped by the spring that is in Jezreel.
translation:
  language: tl
  text: Tinipon ng mga Filisteo ang lahat ng kanilang mga kampo[a] sa Afec, samantalang nakahimpil ang Israel sa tabi ng bukal[b] na nasa Jezreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “lahat ng kanilang mga hukbo” o “lahat ng kanilang mga puwersa.” Mas literal sa Hebreo: “lahat ng kanilang mga kampo.”'
    reason: lexical_alternative
  - marker: b
    text: O “sa tabi ng fountain”; ang salitang Hebreo ay maaaring tumukoy sa isang bukal o fountain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּצוּ
  choice: Tinipon
  rationale: Tumpak at likas na salaysay na nagpapahayag ng pagtitipon, nang hindi labis na tinutukoy ang paraang militar.
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang makabagong Tagalog na anyo ng pangalan ng pangkat-etniko.
- source_word: כָּל מַחֲנֵיהֶם
  choice: lahat ng kanilang mga kampo
  rationale: Pinananatili ang literal na diwa ng מַחֲנֶה bilang kampo, habang ang konteksto ay nagpapahiwatig ng mga pangkat o puwersang militar.
- source_word: אֲפֵקָה
  choice: sa Afec
  rationale: Ang hulaping direksiyonal ay natural na ipinahahayag sa Tagalog sa pamamagitan ng “sa”; ginamit ang anyong Afec para sa pangalan ng lugar.
- source_word: וְיִשְׂרָאֵל
  choice: samantalang ... ang Israel
  rationale: Ipinakikita ang magkasabay at bahagyang magkatunggaling ayos ng dalawang hukbo, hindi lamang simpleng pagdaragdag.
- source_word: חֹנִים
  choice: nagkampo
  rationale: Likas na Tagalog para sa kalagayang militar ng Israel bilang isang kolektibong bayan.
- source_word: בַּעַיִן
  choice: sa tabi ng bukal
  rationale: Ang עַיִן ay maaaring tumukoy sa bukal o fountain; “bukal” ang pinakakaraniwang salita para sa likas na pinagmumulan ng tubig.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: na nasa Jezreel
  rationale: Tuwirang inilalagay ng parirala ang bukal sa Jezreel nang walang dagdag na pagpapakahulugan.
