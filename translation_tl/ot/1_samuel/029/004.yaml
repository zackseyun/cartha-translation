  text: וַ/יִּקְצְפ֨וּ עָלָ֜י/ו שָׂרֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֣אמְרוּ ל/וֹ֩ שָׂרֵ֨י פְלִשְׁתִּ֜ים הָשֵׁ֣ב אֶת הָ/אִ֗ישׁ וְ/יָשֹׁב֙ אֶל מְקוֹמ/וֹ֙ אֲשֶׁ֣ר הִפְקַדְתּ֣/וֹ שָׁ֔ם וְ/לֹֽא יֵרֵ֤ד עִמָּ֨/נוּ֙ בַּ/מִּלְחָמָ֔ה וְ/לֹא יִֽהְיֶה לָּ֥/נוּ לְ/שָׂטָ֖ן בַּ/מִּלְחָמָ֑ה וּ/בַ/מֶּ֗ה יִתְרַצֶּ֥ה זֶה֙ אֶל אֲדֹנָ֔י/ו הֲ/ל֕וֹא בְּ/רָאשֵׁ֖י הָ/אֲנָשִׁ֥ים הָ/הֵֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/004.yaml
  text: But the Philistine commanders were angry with him[a], and the Philistine commanders said to him, “Send the man back, so that he may return to his place where you assigned him, and let him not go down with us into battle, lest he become an adversary to us in the battle[b]. For with what could this man reconcile himself to his lord? Would it not be with the heads of those men?”
translation:
  language: tl
  text: Ngunit nagalit sa kanya ang mga kumandante ng mga Filisteo. Sinabi sa kanya ng mga kumandante ng mga Filisteo, “Pabalikin mo ang lalaking ito, at hayaang bumalik siya sa lugar na itinalaga mo para sa kanya. Huwag mo siyang pasamahin sa atin sa labanan, baka maging kalaban[a] natin siya sa labanan. Sapagkat paano niya muling makukuha ang pabor ng kanyang panginoon?[b] Hindi ba sa pamamagitan ng mga ulo ng mga taong iyon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo rito ay nangangahulugang “kalaban” o “katunggali,” hindi ang pantanging pangalang “Satanas.”
    reason: lexical_alternative
  - marker: b
    text: O “makipagkasundo siyang muli sa kanyang panginoon.” Ang pananalitang Hebreo ay tumutukoy sa muling pagiging kalugod-lugod o katanggap-tanggap sa isang nakatataas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצְפוּ עָלָיו
  choice: nagalit sa kanya
  rationale: Likas at malinaw na katumbas ng קצף sa kontekstong ito; ipinahahayag ang matinding pagtutol nang hindi pinalalabis ang lakas ng salita.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: mga kumandante ng mga Filisteo
  rationale: Sa konteksto ng isang kampanyang militar, ang שָׂרִים ay tumutukoy sa mga pinunong may kapangyarihang militar; mas angkop dito ang “mga kumandante” kaysa “mga prinsipe.”
- source_word: הָשֵׁב אֶת הָאִישׁ וְיָשֹׁב אֶל מְקוֹמוֹ
  choice: Pabalikin mo ang lalaking iyan sa lugar
  rationale: Ang Hiphil na pautos ng שוב ay causative, kaya malinaw na ipinapahayag ng “pabalikin mo” na dapat ipabalik ni Aquis ang lalaki.
- source_word: אֲשֶׁר הִפְקַדְתּוֹ שָׁם
  choice: na itinakda mo sa kanya
  rationale: Sinasaklaw ng “itinakda” ang diwa ng הפקיד na magtalaga o mag-atas nang hindi labis na nililimitahan kung anong tungkulin o puwesto ang ibinigay.
- source_word: וְלֹא יֵרֵד עִמָּנוּ בַּמִּלְחָמָה
  choice: Huwag mo siyang pasamahin sa atin sa labanan
  rationale: Natural sa modernong Tagalog at malinaw na naihahatid ang layuning huwag makilahok si David sa kampanya, bagaman hindi literal na inuulit ang Hebreong idyomang “bumaba.”
- source_word: וְלֹא יִהְיֶה לָּנוּ לְשָׂטָן
  choice: baka maging kalaban natin siya
  rationale: Ang שָׂטָן ay karaniwang pangngalan dito na nangangahulugang kalaban o katunggali, hindi pantanging pangalang Satanas.
- source_word: יִתְרַצֶּה זֶה אֶל אֲדֹנָיו
  choice: paano niya muling makukuha ang loob ng kanyang panginoon?
  rationale: Likas na idyomang Tagalog para sa muling pagtatamo ng pabor ng nakatataas; pinananatili ang praktikal na diwa ng reflexive Hitpael ng רצה.
- source_word: הֲלוֹא בְּרָאשֵׁי הָאֲנָשִׁים הָהֵם
  choice: Hindi ba sa pamamagitan ng mga ulo ng mga tauhan nating ito?
  rationale: 'Pinananatili ang matalim at bahagyang eliptikong larawan ng Hebreo: maaaring maibalik ni David ang pabor ni Saul sa pamamagitan ng pagpatay at pagdadala ng mga ulo ng mga Filisteong kawal.'
theological_decisions:
- issue: Kahulugan ng שָׂטָן
  choice: karaniwang pangngalang “kalaban”
  alternative: pantanging pangalang “Satanas”
  rationale: Sa salaysay na ito, ang salita ay tumutukoy sa isang taong maaaring kumalaban sa hukbo sa panahon ng labanan. Ang pagsasaling “Satanas” ay magpapasok ng demonolohikal na kahulugang wala sa konteksto.
- issue: Kahulugan ng יִתְרַצֶּה אֶל אֲדֹנָיו
  choice: muling makuha ang loob ng kanyang panginoon
  alternative: makipagkasundo sa kanyang panginoon
  rationale: Ang konteksto ay hindi lamang pormal na pakikipagkasundo kundi muling pagtatamo ni David ng pabor ng kanyang nakatataas, na si Saul. Pinananatili ng talababa ang posibleng mas pormal na pagpapahayag.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “kumandante,” “labanan,” at “mga tauhan” para sa malinaw na kontekstong militar. Ang “panginoon” ay maliit ang titik sapagkat tumutukoy ito sa taong nakatataas kay David, si Saul, hindi sa Diyos.
