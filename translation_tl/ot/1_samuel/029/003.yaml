  naturalness: Likas at malinaw ang pangkalahatang register. Mas natural at mas tuwirang Tagalog ang “na ilang araw o ilang taon nang kasama ko” kaysa sa “Nakasama ko na siya nang ilang araw—o mga taon na nga.”
  terminology: Ang “mga kumander,” “mga Filisteo,” “mga Hebreo,” “lingkod,” at mga pangalang Akis, David, at Saul ay angkop. Ang “anumang laban sa kanya” ay mahusay na idiomatikong pagsasalin ng kontekstuwal na diwa ng מְאוּמָה.
