revisions:
- from: Sinabi ng mga kumander ng mga Filisteo, “Ano ang ginagawa rito ng mga Hebreong ito?” Sumagot si Akis sa mga kumander ng mga Filisteo, “Hindi ba ito si David, ang lingkod ni Saul na hari ng Israel? Nakasama ko na siya nang ilang araw—o mga taon na nga. Wala akong nakitang anumang laban sa kanya mula nang pumanig siya sa akin[a] hanggang sa mismong araw na ito.”
  to: Sinabi ng mga kumander ng mga Filisteo, “Ano ang ginagawa ng mga Hebreong ito?” Sumagot si Akis sa mga kumander ng mga Filisteo, “Hindi ba ito si David, ang lingkod ni Saul, na hari ng Israel? Ilang araw o ilang taon na siyang kasama ko. Wala akong nakitang anumang laban sa kanya mula nang pumanig siya sa akin[a] hanggang sa mismong araw na ito.”
  rationale: Inayos ang pagpapahayag ng tagal upang mas malapit nitong maipakita ang magkatapat na “mga araw o mga taon” sa Hebreo at inalis ang diing wala sa pinagmulan. Inalis din ang hindi tahasang “rito” sa elliptical na unang tanong. Pinanatili ang maingat ngunit likas na “pumanig siya sa akin,” at nilinaw sa talababa ang literal na idyoma at ang alternatibong pagpapakahulugan nito.
