base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/003.yaml
  text: Then the Philistine commanders said[a], “What are these Hebrews?” And Achish said to the Philistine commanders, “Is this not David, the servant of Saul king of Israel, who has been with me these days or these years? And I have found nothing against him from the day of his defecting until this very day.”
translation:
  language: tl
  text: Sinabi ng mga kumander ng mga Filisteo, “Ano ang ginagawa ng mga Hebreong ito?” Sumagot si Akis sa mga kumander ng mga Filisteo, “Hindi ba ito si David, ang lingkod ni Saul, na hari ng Israel? Ilang araw o ilang taon na siyang kasama ko. Wala akong nakitang anumang laban sa kanya mula nang pumanig siya sa akin[a] hanggang sa mismong araw na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “mula nang bumagsak siya sa akin.” Sa kontekstong ito, maaaring tumukoy ito sa paglipat niya ng panig o pagpanig niya kay Akis.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: mga kumander ng mga Filisteo
  rationale: Sa kontekstong militar, ang שָׂרִים ay matataas na pinunong militar; malinaw at likas sa makabagong Tagalog ang “mga kumander.”
- source_word: מָה הָעִבְרִים הָאֵלֶּה
  choice: Ano ang ginagawa rito ng mga Hebreong ito?
  rationale: Elliptical ang Hebreo, literal na “Ano [ang] mga Hebreong ito?” Isinasaad ng “ginagawa rito” ang likas na diwa ng mapaghinalang tanong sa Tagalog nang hindi binabago ang tinutukoy.
- source_word: הָעִבְרִים
  choice: mga Hebreo
  rationale: Pinananatili ang katawagang etniko at ang pananaw ng mga Filisteo sa halip na palitan ito ng “mga Israelita.”
- source_word: הֲלוֹא
  choice: Hindi ba ito
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: עֶבֶד
  choice: lingkod
  rationale: Tumutukoy ito sa kaugnayan ni David kay Saul sa kontekstong maharlika at pampolitika, hindi partikular sa pagiging alipin.
- source_word: זֶה יָמִים אוֹ זֶה שָׁנִים
  choice: nang ilang araw—o mga taon na nga
  rationale: Inilalarawan nang natural sa Tagalog ang di-tiyak at medyo idiomatikong pagbanggit sa haba ng panahong magkasama sila, habang pinananatili ang “mga araw o mga taon.”
- source_word: מְאוּמָה
  choice: anumang laban sa kanya
  rationale: Sa konteksto, nangangahulugan itong walang natuklasang dahilan upang paratangan o ireklamo si David.
- source_word: מִיּוֹם נָפְלוֹ
  choice: mula nang pumanig siya sa akin
  rationale: Ang נפל sa kontekstong militar-pampolitika ay maaaring mangahulugang lumipat o pumanig sa isang pinuno; natural sa Tagalog ang “pumanig,” habang inilalagay sa talababa ang literal na idyoma.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa mismong araw na ito
  rationale: Pinananatili ang diin ng demonstratibong parirala.
- source_word: אָכִישׁ
  choice: Akis
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalan.
- source_word: דָוִד
  choice: David
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalan.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalan.
