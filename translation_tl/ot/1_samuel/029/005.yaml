base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/005.yaml
  text: Is this not David[a], of whom they sang to one another in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: tl
  text: "Hindi ba ito si David[a], na siyang ipinag-awitan nila nang salitan sa mga sayawan, na sinasabi,\n\n‘Pinabagsak ni Saul ang libu-libo,\n    at pinabagsak ni David ang sampu-sampung libo[b]’?”"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “na tungkol sa kanya ay tumugon sila sa mga sayawan”—isang idyoma para sa tugunang pag-awit.'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga sampung libo”; maaari rin itong unawain sa mas pangkalahatang diwang “napakaraming bilang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא זֶה דָוִד
  choice: Hindi ba ito si David
  rationale: Pinananatili ang anyong patanong na retorikal at ang mariing pagkilala kay David, habang natural ang ayos sa modernong Tagalog.
- source_word: יַעֲנוּ לוֹ
  choice: inawitan nila nang salitan
  rationale: Sa konteksto ng sayawan, ang ענה ay tumutukoy sa tugunan o antiphonal na pag-awit; ipinahahayag ito nang malinaw nang hindi ipinapalagay na literal silang sumagot kay David.
- source_word: בַּמְּחֹלוֹת
  choice: habang nagsasayaw
  rationale: Natural na inilalarawan sa Tagalog ang maligayang pag-awit sa gitna ng mga sayaw o paikot na pagsasayaw.
- source_word: הִכָּה
  choice: pinabagsak
  rationale: Ipinahihiwatig ng pandiwa sa awiting pandigma ang marahas na paggapi, malamang na pagpatay, ngunit hindi ito labis na tinutukoy kaysa sa Hebreo.
- source_word: בַּאֲלָפָיו
  choice: libu-libo
  rationale: Inililipat nang natural ang bilang ng mga natalo ni Saul at pinananatili ang paghahambing sa kasunod na mas malaking bilang.
- source_word: בְרִבְבֹתָיו
  choice: sampu-sampung libo
  rationale: Pinananatili ang numerikal na kaibahan sa 'libu-libo'; ang רבבה ay maaaring mangahulugang sampung libo o napakaraming bilang.
