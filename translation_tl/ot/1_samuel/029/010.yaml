translation_notes:
  register: Gumamit ng moderno ngunit marangal at madaling maunawaang Filipino. Pinanatili ang paglipat mula sa isahang utos kay David (“bumangon ka”) tungo sa maramihang tagubilin sa buong pangkat (“bumangon kayo,” “umalis na kayo”), gayundin ang pag-uulit ng “nang maaga sa umaga.”
