  yaml_path: translation/ot/1_samuel/029/010.yaml
  text: Now rise early in the morning[a], you and your master's servants who came with you. When you rise early in the morning and it is light for you, go.
translation:
  language: tl
  text: Ngayon, bumangon ka nang maaga sa umaga, ikaw at ang mga lingkod ng iyong panginoon na dumating na kasama mo. Kapag bumangon kayo nang maaga sa umaga at maliwanag na para sa inyo[a], umalis na kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “kapag lumiwanag na para sa inyo” o “sa pagbubukang-liwayway.” Literal sa Hebreo: “at maliwanag para sa inyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Nagsisilbi itong panandang diskurso na naghahatid sa agarang tagubilin; ipinapakita ng “Kaya ngayon” ang paglipat at kaugnayan sa naunang sinabi.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: bumangon ka nang maaga sa umaga
  rationale: Pinananatili ang diwa ng Hiphil imperative na gumising o bumangon nang maaga, pati ang tahasang pagtukoy sa umaga.
- source_word: וְעַבְדֵי אֲדֹנֶיךָ
  choice: ikaw at ang mga lingkod ng mga panginoon mo
  rationale: Ang anyong אֲדֹנֶיךָ ay maramihan, kaya pinanatili ang “mga panginoon mo” sa halip na gawing isahan batay lamang sa konteksto. Ang “panginoon” dito ay tumutukoy sa mga taong may kapangyarihan, hindi isang banal na titulo.
- source_word: אֲשֶׁר בָּאוּ אִתָּךְ
  choice: na dumating na kasama mo
  rationale: Likas na salin ng sugnay na tumutukoy sa mga lingkod na sumama kay David.
- source_word: וְהִשְׁכַּמְתֶּם בַּבֹּקֶר
  choice: Kapag bumangon kayo nang maaga sa umaga
  rationale: Ang pandiwa ay maramihan at inuulit ang naunang utos. Ang “kapag” ay nagpapahayag ng temporal na pagkakasunod nang hindi inaalis ang pag-uulit sa Hebreo.
- source_word: וְאוֹר לָכֶם
  choice: at maliwanag na para sa inyo
  rationale: Malapit ito sa literal na Hebreong “at liwanag/maliwanag para sa inyo,” kaya hindi lubusang nilulutas ang bahagyang di-karaniwang pahayag bilang simpleng “pagsikat ng araw.”
- source_word: וָלֵכוּ
  choice: umalis na kayo
  rationale: Ang maramihang pautos ng הלך ay nangangahulugang humayo o umalis. Mas natural sa kontekstong ito ang “umalis na kayo” kaysa sa payak na “pumunta kayo.”
