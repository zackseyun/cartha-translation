  to: Ngayon, bumangon ka nang maaga sa umaga, ikaw at ang mga lingkod ng iyong panginoon na dumating na kasama mo. Kapag bumangon kayo nang maaga sa umaga at maliwanag na para sa inyo[a], umalis na kayo.
  rationale: Pinalitan ang plural na “mga panginoon mo” ng singular na “iyong panginoon,” ayon sa karaniwang pantanging gamit ng plural na anyong אֲדֹנֶיךָ sa kontekstong ito. Pinasimple rin ang panandang pangdiskurso sa “Ngayon.” Nananatili ang pag-uulit ng “bumangon ... nang maaga sa umaga,” ang temporal na ayos ng huling pangungusap, at ang bahagyang literal na “maliwanag na para sa inyo,” na nililinaw ng talababa nang hindi ipinipilit ang isang interpretasyong lampas sa Hebreo.
