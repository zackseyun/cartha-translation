base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/008.yaml
  text: David said to Achish[a], “But what have I done? And what have you found against your servant from the day I entered your service until this day[b], that I should not go and fight against the enemies of my lord the king?”
translation:
  language: tl
  text: Sinabi ni David kay Akis, “Pero ano ba ang nagawa ko? Ano ang nakita mong laban sa iyong lingkod mula nang maglingkod ako sa iyo hanggang sa araw na ito[a], bakit hindi ako makasama at makipaglaban sa mga kaaway ng aking panginoon na hari[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “mula nang ako ay nasa harap mo hanggang sa araw na ito.”'
    reason: lexical_alternative
  - marker: b
    text: Pinanatili ang “aking panginoon na hari” ayon sa mismong pananalita. Maaaring tuwirang pagtukoy ito ni David kay Akis, ngunit maaari ring sadyang malabo ang pahayag dahil sa konteksto ng salaysay.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי מֶה עָשִׂיתִי
  choice: Pero ano ba ang nagawa ko?
  rationale: Ginamit ang “Pero” bilang likas na panandang pasalungat sa pagtutol ni David; ang “ba” ay natural na naghahatid ng himig ng protesta sa modernong Tagalog.
- source_word: וּמַה מָּצָאתָ בְעַבְדְּךָ
  choice: Ano ang nakita mong laban sa iyong lingkod
  rationale: Maaaring literal na “nakita sa iyong lingkod,” ngunit sa konteksto, ang מצא na may ב ay tumutukoy sa natuklasang kasalanan o batayan ng paratang. Pinananatili ng “laban sa” ang ipinahihiwatig na negatibong diwa nang hindi dinaragdagan ang teksto ng tiyak na “kasalanan.”
- source_word: בְעַבְדְּךָ
  choice: iyong lingkod
  rationale: Bagaman maaari ring mangahulugang alipin ang עבד, dito ay magalang na pagtukoy sa sarili sa harap ng isang hari; ang “lingkod” ang angkop sa marangal at pampamahalaang rehistro.
- source_word: מִיּוֹם אֲשֶׁר הָיִיתִי לְפָנֶיךָ עַד הַיּוֹם הַזֶּה
  choice: mula nang maglingkod ako sa iyo hanggang sa araw na ito
  rationale: Ang literal ay “mula nang ako ay nasa harap mo.” Sa konteksto, inilalarawan nito ang panahong nasa paglilingkod ni Akis si David. Ang “maglingkod ako sa iyo” ay malinaw at natural, habang inilalagay sa talababa ang mas literal na anyo.
- source_word: כִּי לֹא אָבוֹא וְנִלְחַמְתִּי
  choice: kaya hindi ako maaaring sumama at makipaglaban
  rationale: Ipinahahayag ng sugnay ang reklamo ni David na hindi siya pinahihintulutang sumama sa labanan. Ang “sumama” ay likas sa konteksto ng hukbong humahayo, at ang “maaaring” ay tumutukoy sa pahintulot o pagkakataon, hindi sa kakayahan.
- source_word: בְּאֹיְבֵי
  choice: sa mga kaaway
  rationale: Kasama ng נלחם, minamarkahan ng ב ang kalaban sa digmaan; natural sa Tagalog ang “makipaglaban sa mga kaaway.”
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: aking panginoon na hari
  rationale: Pantao at pampolitikang katawagang pandangal ang אֲדֹנִי dito, hindi banal na titulo. Pinananatili ng salin ang anyo ng pananalita at hindi tinutukoy nang tahasan kung sino ang nasa isip ni David.
theological_decisions:
- issue: Ang tinutukoy at retorikal na bisa ng “mga kaaway ng aking panginoon na hari”
  choice: Panatilihin ang mismong pahayag nang hindi tinutukoy kung si Akis lamang ang tinutukoy o kung sadyang may dalawang maaaring pakahulugan.
  alternative: Ipaliwanag na tapat na tinutukoy ni David si Akis, o ipakahulugang may iba siyang lihim na tinutukoy.
  rationale: Hindi tahasang sinasabi ng Hebreo ang layunin ni David. Ang hindi paglutas sa tinutukoy ng “aking panginoon na hari” ay nagpapanatili sa tensiyon at posibleng kalabuan ng salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Akis,” “lingkod,” at “panginoon na hari” para sa malinaw na bigkas at angkop na rehistrong pampamahalaan. Ang mga talababa [a] at [b] ay kapwa nakamarka sa pangunahing teksto.
