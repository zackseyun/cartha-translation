base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/011.yaml
  text: So David rose early[a], he and his men, to leave in the morning and return to the land of the Philistines[b]. And the Philistines went up to Jezreel.
translation:
  language: tl
  text: Maagang bumangon si David at ang kanyang mga tauhan upang umalis nang umaga at bumalik sa lupain ng mga Filisteo.[a] At umakyat ang mga Filisteo sa Jezreel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “upang humayo nang umaga at bumalik sa lupain ng mga Filisteo.” Maaaring isalin nang ganito ang mga pawatas sa Hebreo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ang “umakyat” ay sumasalamin sa idyomang Hebreo para sa pagpunta sa isang lugar at maaaring may heograpiko o militar na pahiwatig. Maaari ring isalin: “nagmartsa patungong Jezreel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: maagang bumangon
  rationale: Karaniwang ipinahihiwatig ng Hiphil ng שׁכם ang maagang pagbangon o maagang pagsisimula. Likas sa modernong Tagalog ang “maagang bumangon” at napapanatili nito ang diin sa oras.
- source_word: הוּא וַאֲנָשָׁיו
  choice: si David at ang kanyang mga tauhan
  rationale: Ang אֲנָשָׁיו ay tumutukoy rito sa pangkat ng mga lalaking kasama ni David, lalo na sa kanyang mga mandirigma; mas natural at angkop ang “mga tauhan” kaysa “mga lingkod.”
- source_word: לָלֶכֶת בַּבֹּקֶר לָשׁוּב
  choice: para umalis nang umagang iyon at bumalik
  rationale: Ang לָלֶכֶת ay literal na “humayo,” ngunit sa konteksto ay pag-alis mula sa kampo ang tinutukoy. Ipinakikita ng “para” ang layunin, samantalang pinananatili ng “bumalik” ang kahulugan ng שׁוב. Ang “umagang iyon” ay natural na Tagalog para sa tiyak na umagang tinutukoy nang hindi inaakalang ibang araw.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: sa lupain ng mga Filisteo
  rationale: Pinananatili ng “lupain” ang konkretong kahulugan ng אֶרֶץ at hindi nililimitahan ang tinutukoy sa isang partikular na lungsod.
- source_word: וּפְלִשְׁתִּים עָלוּ
  choice: At umakyat naman ang mga Filisteo
  rationale: Ang “umakyat” ay tuwirang nagpapahayag sa עלה at maaaring magtaglay ng heograpiko o militar na pahiwatig. Ang “naman” ay likas na nagmamarka ng paglipat ng salaysay sa kilos ng mga Filisteo.
- source_word: יִזְרְעֶאל
  choice: Jezreel
  rationale: Ginamit ang kinagawiang transliterasyon sa Filipino ng pangalan ng lugar.
