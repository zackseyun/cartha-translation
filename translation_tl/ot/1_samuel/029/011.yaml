translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “para” sa layunin dahil natural ito sa karaniwang pananalita, habang nananatiling angkop sa salaysay. Iniwasan ang labis na literal na “humayo nang umaga” sa pangunahing teksto dahil hindi ito likas sa kasalukuyang gamit, ngunit inilagay ito sa talababa bilang pormal na alternatibo.
