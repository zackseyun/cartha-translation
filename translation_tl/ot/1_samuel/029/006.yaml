  text: וַ/יִּקְרָ֨א אָכִ֜ישׁ אֶל דָּוִ֗ד וַ/יֹּ֣אמֶר אֵ֠לָי/ו חַי יְהוָ֞ה כִּי יָשָׁ֣ר אַתָּ֗ה וְ/ט֣וֹב בְּ֠/עֵינַ/י צֵאתְ/ךָ֨ וּ/בֹאֲ/ךָ֤ אִתִּ/י֙ בַּֽ/מַּחֲנֶ֔ה כִּ֠י לֹֽא מָצָ֤אתִֽי בְ/ךָ֙ רָעָ֔ה מִ/יּ֛וֹם בֹּאֲ/ךָ֥ אֵלַ֖/י עַד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בְ/עֵינֵ֥י הַ/סְּרָנִ֖ים לֹֽא ט֥וֹב אָֽתָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/006.yaml
  text: Then Achish called David and said to him[a], “As Yahweh lives, you are upright, and your going out and your coming in with me in the camp is good in my sight; for I have not found any evil in you from the day of your coming to me to this day. But in the eyes of the lords of the Philistines[c][b], you are not good.”
translation:
  language: tl
  text: Pagkatapos, tinawag ni Akis si David at sinabi sa kanya, “Kung paanong buhay si Yahweh, matuwid kang tao. Mabuti sa paningin ko ang paglabas at pagpasok mo kasama ko sa kampo[a], sapagkat wala akong nakitang anumang masama sa iyo mula nang dumating ka sa akin hanggang sa araw na ito. Ngunit sa paningin ng mga pinuno ng mga Filisteo[b], hindi ka katanggap-tanggap[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang paglabas at pagpasok mo kasama ko sa kampo.” Maaaring tumukoy ang parirala sa kilos o paglilingkod ni David kasama ni Akis.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay isang natatanging titulo para sa mga pinuno ng mga Filisteo.
    reason: cultural_note
  - marker: c
    text: Sa literal, “hindi ka mabuti”; sa konteksto, hindi siya sinasang-ayunan o tinatanggap ng mga pinunong Filisteo.
    reason: alternative_reading
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Saksi ang buhay ni Yahweh
  rationale: Karaniwang pormula ito ng panunumpa. Likas sa modernong Tagalog ang 'Saksi ang buhay ni Yahweh' at naipahihiwatig nitong pinagtitibay ang sinabi sa pamamagitan ng buhay ni Yahweh.
- source_word: יָשָׁר
  choice: matuwid kang tao
  rationale: Ipinahahayag ng salita ang integridad o moral na katuwiran; mas malinaw at natural sa Tagalog ang pariralang ito kaysa sa payak na 'matuwid ka.'
- source_word: טוֹב בְּעֵינַי
  choice: Mabuti sa paningin ko
  rationale: Pinananatili ang Hebreong larawang 'sa paningin' at ang evaluative na diwa ng טוֹב.
- source_word: צֵאתְךָ וּבֹאֲךָ
  choice: ang paglabas at pagpasok mo
  rationale: Pinananatili ang literal na pares at ritmo ng Hebreo, habang ipinapaliwanag sa talababa ang posibleng idyomatikong diwang tumutukoy sa kilos o paglilingkod.
- source_word: אִתִּי בַּמַּחֲנֶה
  choice: kasama ko sa kampo
  rationale: Ang מַחֲנֶה ay maaaring tumukoy sa kampo o hukbo; ang 'kampo' ang tuwirang kahulugan at ang konteksto ang nagbibigay ng militar na diwa.
- source_word: לֹא מָצָאתִי בְךָ רָעָה
  choice: wala akong nakitang anumang masama sa iyo
  rationale: Malapit ito sa Hebreo at malinaw na nagpapahayag na walang nakitang kasamaan, pagkakamali, o bagay na maipupula kay David.
- source_word: מִיּוֹם בֹּאֲךָ אֵלַי עַד הַיּוֹם הַזֶּה
  choice: mula nang dumating ka sa akin hanggang sa araw na ito
  rationale: Natural na Tagalog na tapat sa buong saklaw ng Hebreong pahayag tungkol sa panahon.
- source_word: סְרָנִים
  choice: mga pinuno ng mga Filisteo
  rationale: Natatanging titulo ito para sa mga namumuno sa mga Filisteo. Ang 'mga pinuno' ay malinaw sa karaniwang mambabasa; nililinaw ng talababa ang katangiang pantitulo nito.
- source_word: לֹא טוֹב אָתָּה
  choice: hindi ka katanggap-tanggap
  rationale: Ang literal na 'hindi ka mabuti' ay alanganin at maaaring magpahiwatig ng moral na hatol na salungat sa naunang papuri. Sa konteksto, ang maikli at eliptikong Hebreo ay tumutukoy sa hindi pagsang-ayon o hindi pagtanggap ng mga pinuno; itinatala ang literal na anyo sa talababa.
theological_decisions:
- issue: Ang banal na pangalang יְהוָה sa panunumpa ng isang haring Filisteo
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang nasa tekstong Hebreo ang Tetragrammaton. Pinananatili ng 'Yahweh' ang personal na pangalan kahit ang nagsasalita ay si Akis, nang hindi nagpapasya kung ano ang eksaktong lawak ng kanyang pananampalataya o motibo sa paggamit nito.
- issue: Kung ang לֹא טוֹב אָתָּה ay moral na paghatol o pahayag ng hindi pagtanggap
  choice: hindi ka katanggap-tanggap
  alternative: hindi ka mabuti
  rationale: Ang agarang paghahambing ay sa positibong paghatol ni Akis at sa salungat na paghatol ng mga pinunong Filisteo. Ang salin ay naghahayag ng kontekstuwal na diwa, samantalang pinananatili sa talababa ang literal at sadyang maikling Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong larawang 'sa paningin ko' at ang pares na 'paglabas at pagpasok,' ngunit ginamit ang likas na 'hindi ka katanggap-tanggap' para sa eliptikong pangwakas na pahayag. Ang mga talababa ay sunod-sunod na [a], [b], at [c], at lahat ay nakamarka sa pangunahing teksto.
