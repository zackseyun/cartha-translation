base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/007.yaml
  text: So now[a], return and go in peace, and do not do evil in the eyes of the Philistine lords.
translation:
  language: tl
  text: Kaya ngayon, bumalik ka at umalis nang payapa. Huwag kang gumawa ng masama sa paningin ng mga pinuno ng mga Filisteo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Huwag kang gumawa ng mali sa paningin ng mga pinuno ng mga Filisteo.” Ang pananalitang Hebreo ay maaaring tumukoy sa anumang itinuturing nilang masama o hindi katanggap-tanggap.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinahahayag nito ang bunga o pangwakas na tagubilin ng nagsasalita, habang pinananatili ang pang-ugnay at temporal na diwa.
- source_word: שׁוּב וְלֵךְ
  choice: bumalik ka at umalis
  rationale: Pinananatili ang dalawang magkasunod na pautos sa Hebreo; mas natural sa Tagalog ang “umalis” kaysa ulitin ang “pumunta” sa kontekstong pinauuwi si David.
- source_word: בְּשָׁלוֹם
  choice: nang payapa
  rationale: Natural na Tagalog para sa ligtas at mapayapang pag-alis, nang hindi nililimitahan ang saklaw sa kaligtasan lamang.
- source_word: וְלֹא תַעֲשֶׂה רָע
  choice: Huwag kang gumawa ng masama
  rationale: Tuwirang pinananatili ang moral na kulay ng רָע at ang pautos na negatibo.
- source_word: בְּעֵינֵי
  choice: sa paningin ng
  rationale: Pinananatili ang malinaw na idyomang Hebreo tungkol sa pagsusuri o paghatol ng isang tao.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: mga pinuno ng mga Filisteo
  rationale: Ang סֶרֶן ay tumutukoy sa matataas na pinuno ng mga lungsod-estado ng Filisteo; malinaw at marangal sa modernong Tagalog ang “mga pinuno.”
theological_decisions:
- issue: Kung ang “masama” ay likas na moral na kasamaan o anumang hindi katanggap-tanggap sa mga pinunong Filisteo
  choice: Pinanatili sa teksto ang “masama sa paningin ng” at nilinaw sa talababa ang saklaw ng idyoma.
  alternative: “Huwag kang gumawa ng anumang hindi nila magugustuhan.”
  rationale: Hindi dapat tahimik na alisin ang moral na kulay ng רָע, ngunit ipinahihiwatig ng בְּעֵינֵי na nakaugnay rin ito sa paghatol o pagtanggap ng mga pinunong Filisteo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang dalawang pautos na “bumalik” at “umalis,” gayundin ang idyomang “sa paningin ng,” habang inilagay ang marker [a] pagkatapos ng kaugnay na buong pahayag.
