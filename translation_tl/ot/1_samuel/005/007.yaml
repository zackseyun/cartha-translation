base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/007.yaml
  text: When the men of Ashdod saw that it was so[a], they said, “The ark of the God of Israel must not remain with us[b], because his hand is heavy against us and against Dagon our god.”
translation:
  language: tl
  text: Nang makita ng mga kalalakihan ng Asdod na gayon nga, sinabi nila, “Hindi dapat manatili[a] sa atin ang kaban ng Diyos ng Israel, sapagkat mabigat ang kamay niya[b] laban sa atin at laban kay Dagon, na diyos natin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo ay maaari ring mangahulugang “umupo” o “manahan.” Dito, tumutukoy ito sa patuloy na pananatili ng kaban sa piling nila.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mabigat ang kamay niya,” isang idyomang tumutukoy sa matinding kapangyarihan o paghatol ng Diyos.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּרְאוּ אַנְשֵׁי אַשְׁדּוֹד
  choice: Nang makita ng mga kalalakihan ng Asdod
  rationale: Ipinahahayag ng “Nang” ang pagsulong at ugnayang temporal ng salaysay. Pinananatili ng “mga kalalakihan” ang panlalaking anyo ng אַנְשֵׁי nang hindi ipinapalagay na mga opisyal lamang sila.
- source_word: כִּי כֵן
  choice: na gayon nga
  rationale: Likas sa Tagalog ang pariralang ito at tumutukoy pabalik sa kalagayang nasaksihan nila.
- source_word: לֹא יֵשֵׁב
  choice: Hindi dapat manatili
  rationale: Sa kaban bilang simuno, malinaw na ipinahahayag ng “manatili” ang patuloy na pagkaparoon; ipinakikita ng “hindi dapat” ang mariing pasiya ng mga nagsasalita.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: ang kaban ng Diyos ng Israel
  rationale: Malapit ito sa pormal na katawagan sa Hebreo at pinananatili ang kaibahan sa “Dagon na diyos natin.”
- source_word: עִמָּנוּ
  choice: sa atin
  rationale: Natural na Tagalog ito para sa presensiya ng kaban na kasama o nasa gitna nila.
- source_word: קָשְׁתָה יָדוֹ
  choice: naging mabagsik ang kamay niya
  rationale: Ang קָשְׁתָה ay nagsasaad ng pagiging matindi, mabagsik, o mabigat. Pinananatili ng salin ang metapora ng “kamay” at ang aspektong nagsasaad na naranasan na nila ang tindi nito.
- source_word: עָלֵינוּ וְעַל דָּגוֹן אֱלֹהֵינוּ
  choice: laban sa atin at laban kay Dagon na diyos natin
  rationale: Ang “laban sa” ay malinaw na naghahatid ng mapaminsalang pagkilos sa kontekstong ito, at ang pag-uulit nito ay nagpapanatili sa paralelismo. Ang “diyos natin” ay pananaw ng mga nagsasalitang Filisteo, gaya ng nasa Hebreo.
theological_decisions:
- issue: Metapora ng kamay ng Diyos sa paghatol
  choice: naging mabagsik ang kamay niya laban sa atin
  alternative: mabigat ang kamay niya laban sa atin; pinahirapan niya kami
  rationale: Pinananatili ang antropomorpikong “kamay” at ang aktibong paghatol ng Diyos, ngunit hindi pinapantay ang קָשְׁתָה sa isang paliwanag lamang gaya ng “pinarusahan.”
- issue: Pagtukoy kay Dagon bilang “diyos natin”
  choice: panatilihin ang mismong pananaw ng mga Filisteo
  alternative: Dagon na diyus-diyosan natin
  rationale: Sinasabi ng Hebreo na “Dagon na diyos natin.” Hindi dinaragdagan ng salin ang teksto ng tahasang polemikong katawagan, ni pinagtitibay ang pag-iral ni Dagon bilang tunay na Diyos.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinili ang “mga kalalakihan ng Asdod” upang mapanatili ang panlalaking anyo ng Hebreo; ginamit ang “sa atin” sa halip na mas pormal na “sa piling natin.” Ang metapora ng kamay ay sadyang hindi pinalitan ng tuwirang paliwanag.
