  source_fidelity: Kailangang baguhin ang “naging mabagsik ang kamay niya.” Ang קָשְׁתָה יָדוֹ ay literal na nagsasabing “mabigat ang kaniyang kamay,” isang idiomang dapat panatilihin sa pangunahing teksto. Ang “mabagsik” ay interpretatibo at inililipat ang metapora mula sa bigat/paninikil tungo sa bangis. Wasto ang iba pang mahahalagang elemento, kabilang ang “kaban ng Diyos ng Israel,” ang pasiyang “Hindi dapat manatili,” at ang pananaw ng mga nagsasalita sa “Dagon, na diyos natin.”
  naturalness: Likas at marangal ang pangkalahatang Tagalog. Mas malinaw at mas malapit sa Hebreo ang “mabigat ang kamay niya.” Inilipat din ang panandang footnote ng idiom upang talagang nakadikit ito sa pariralang “kamay niya,” sa halip na sa “atin.”
  terminology: Ang “kaban,” “Diyos ng Israel,” at “Dagon, na diyos natin” ay angkop. Pinananatili ng “mga kalalakihan ng Asdod” ang panlalaking anyo ng Hebreo nang hindi nagdaragdag na sila ay mga pinuno.
