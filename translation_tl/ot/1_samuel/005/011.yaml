language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁלְח֨וּ וַ/יַּאַסְפ֜וּ אֶת כָּל סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּֽאמְרוּ֙ שַׁלְּח֞וּ אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ וְ/יָשֹׁ֣ב לִ/מְקֹמ֔/וֹ וְ/לֹֽא יָמִ֥ית אֹתִ֖/י וְ/אֶת עַמִּ֑/י כִּֽי הָיְתָ֤ה מְהֽוּמַת מָ֨וֶת֙ בְּ/כָל הָ/עִ֔יר כָּבְדָ֥ה מְאֹ֛ד יַ֥ד הָ/אֱלֹהִ֖ים שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/011.yaml
  text: So they sent and gathered all the lords of the Philistines[a], and they said, “Send away the ark of the God of Israel, and let it return to its place, so that it may not kill us and our people.” For there was a deadly panic throughout the whole city[b]; the hand of God was very heavy there.
translation:
  language: tl
  text: Kaya nagsugo sila at tinipon ang lahat ng pinuno ng mga Filisteo. Sinabi nila, “Ipaalis ninyo ang kaban ng Diyos ng Israel, at hayaan itong bumalik sa lugar nito, upang hindi nito patayin ako at ang bayan ko.” Sapagkat nagkaroon ng nakamamatay na kaguluhan[a] sa buong lungsod; napakabigat ng kamay ng Diyos doon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sindak ng kamatayan,” “nakamamatay na pagkalito,” o “nakamamatay na ligalig.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “napakabigat ng kamay ng Diyos doon,” isang metapora para sa matinding pagkilos ng Diyos sa paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: mga pinuno
  rationale: Tumutukoy ito sa mga kinikilalang tagapamahala ng mga Filisteo. Mas natural sa modernong Tagalog ang “mga pinuno” kaysa “mga panginoon,” habang napapanatili ang kanilang katayuang pampolitika.
- source_word: שַׁלְּחוּ
  choice: Ipaalis ninyo
  rationale: Ang pautos ay humihiling na alisin ang kaban sa kanilang lungsod o nasasakupan; malinaw at natural na naipapahayag ito ng “ipa-alis.”
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: ang kaban ng Diyos ng Israel
  rationale: Pinananatili nito ang ugnayang genitibo at ang diwang ang kaban ay nauukol sa Diyos ng Israel.
- source_word: וְיָשֹׁב לִמְקֹמוֹ
  choice: at hayaan itong bumalik sa lugar nito
  rationale: Naipapakita ng “hayaan” ang jussive na diwa kasunod ng pautos at pinananatili ang literal na “lugar nito.”
- source_word: וְלֹא יָמִית אֹתִי וְאֶת עַמִּי
  choice: upang hindi nito patayin ako at ang bayan ko
  rationale: Ang Hiphil ng מות ay causative, “patayin.” Pinananatili ang isahang “ako” at “bayan ko” ng Hebreo, kahit maramihan ang naunang nagsasalita.
- source_word: מְהוּמַת מָוֶת
  choice: nakamamatay na kaguluhan
  rationale: Saklaw ng מְהוּמָה ang matinding kaguluhan, pagkalito, o sindak, samantalang ipinahihiwatig ng מָוֶת ang kamatayan. Ang salin ay natural ngunit hindi nililimitahan ang parirala sa emosyonal na takot lamang.
- source_word: בְּכָל הָעִיר
  choice: sa buong lungsod
  rationale: Natural nitong ipinapahayag ang lawak na sakop ng pangyayari sa buong siyudad.
- source_word: כָּבְדָה מְאֹד יַד הָאֱלֹהִים
  choice: napakabigat ng kamay ng Diyos
  rationale: Pinananatili ang mahalagang biblikal na metapora ng “kamay” bilang aktibong kapangyarihan ng Diyos at malapit na tinutumbasan ang diin ng כָּבְדָה מְאֹד.
theological_decisions:
- issue: Kung pananatilihin ang antropomorpikong metapora na “kamay ng Diyos” o papalitan ito ng paliwanag tungkol sa kapangyarihan o hatol ng Diyos
  choice: Panatilihin ang “napakabigat ng kamay ng Diyos doon”
  alternative: Matindi silang pinarusahan ng Diyos doon
  rationale: Tahasang ginagamit ng Hebreo ang “kamay,” isang mahalagang biblikal na larawan ng pagkilos at paghatol ng Diyos. Ang pagpapanatili rito ay hindi nagpapasok ng interpretasyong higit sa teksto.
- issue: Pagbabago ng bilang mula sa maramihang nagsasalita tungo sa isahang mga panghalip
  choice: Panatilihin ang “ako at ang bayan ko”
  alternative: kami at ang aming bayan
  rationale: Isahan ang mga hulapi sa Hebreo, marahil dahil isang kinatawang pinuno ang nagsasalita para sa lungsod. Hindi ito pinapantay sa maramihan upang hindi mabura ang tunay na katangian ng teksto.
- issue: Kung ang paksa ng “patayin” ay dapat tukuying Diyos sa halip na kaban
  choice: Gamitin ang “nito” nang hindi tahasang pinapalitan ang paksa ng Diyos
  alternative: upang hindi kami patayin ng Diyos
  rationale: Ang pinakamalapit na pangngalan sa balangkas ay ang kaban, at inilalarawan ng salaysay ang kaban bilang kaugnay ng nakamamatay na presensiya ng Diyos. Pinananatili ng “nito” ang gramatikal at teolohikal na tensiyon nang hindi ito tahasang nilulutas.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kaban” bilang nakagawiang salin sa kontekstong biblikal, “mga pinuno” para sa natural na katawagang pampolitika, at pinanatili ang semitikong metapora ng mabigat na kamay ng Diyos. Inilagay ang mga panandang [a] at [b] sa mismong mga pariralang ipinaliliwanag ng talababa.
