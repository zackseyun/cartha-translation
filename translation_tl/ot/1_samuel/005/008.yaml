revisions:
- from: Kaya nagsugo sila at ipinatawag sa kanila ang lahat ng mga pinuno ng mga Filisteo. Sinabi nila, “Ano ang gagawin natin sa kaban ng Diyos ng Israel?” Sumagot ang mga pinuno, “Ilipat sa Gat ang kaban ng Diyos ng Israel.” Kaya inilipat nila roon ang kaban ng Diyos ng Israel.[a]
  to: Kaya nagsugo sila at tinipon sa kanilang kinaroroonan ang lahat ng mga pinuno ng mga Filisteo. Sinabi nila, “Ano ang gagawin natin sa kaban ng Diyos ng Israel?” Sumagot ang mga pinuno, “Ilipat sa Gat ang kaban ng Diyos ng Israel.” Kaya inilipat nila sa Gat ang kaban ng Diyos ng Israel.[a]
  rationale: Pinalitan ang hindi likas na “ipinatawag sa kanila” ng pananalitang malinaw na ang mga pinuno ay tinipon sa kinaroroonan ng mga taga-Asdod. Inayos din ang talababa upang maipakita ang leksikal na alternatibo ng סבב nang hindi nagmumungkahing literal na pinaikot ang kaban. Ang “ilipat” ay pinanatili bilang likas na pangunahing salin sa kontekstong paglilipat mula sa isang lungsod patungo sa Gat.
