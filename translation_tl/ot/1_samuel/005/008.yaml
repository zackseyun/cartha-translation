translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “mga pinuno” para sa madaling pagkaunawa at “ilipat” para sa likas na daloy, habang pinanatili sa talababa ang mas literal na diwa ng pandiwang סבב.
