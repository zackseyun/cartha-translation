base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/008.yaml
  text: So they sent and gathered all the lords of the Philistines to themselves[a], and said, “What shall we do with the ark of the God of Israel?” And they said, “Let the ark of the God of Israel be brought around to Gath.” So they brought the ark of the God of Israel around.
translation:
  language: tl
  text: Kaya nagsugo sila at tinipon sa kanilang kinaroroonan ang lahat ng mga pinuno ng mga Filisteo. Sinabi nila, “Ano ang gagawin natin sa kaban ng Diyos ng Israel?” Sumagot ang mga pinuno, “Ilipat sa Gat ang kaban ng Diyos ng Israel.” Kaya inilipat nila sa Gat ang kaban ng Diyos ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ipalibot sa Gat ang kaban ng Diyos ng Israel… Kaya ipinalibot nila ang kaban.” Binibigyang-diin ng pandiwa ang paggalaw o paglilipat ng kaban, ngunit hindi nito tinutukoy kung paano ito dinala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיַּאַסְפוּ
  choice: nagsugo sila at ipinatawag
  rationale: Ang שׁלח ay tumutukoy sa pagsusugo, at ang אָסף ay sa pagtitipon. Sa natural na Tagalog, malinaw na ipinahihiwatig ng “ipinatawag” na nagsugo sila upang tipunin ang mga pinuno.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: mga pinuno ng mga Filisteo
  rationale: Ang סֶרֶן ay natatanging titulo ng mga tagapamahala ng mga lungsod ng Filisteo. Mas malinaw at hindi mapagpalagay ang “mga pinuno” kaysa “mga prinsipe” o “mga panginoon.”
- source_word: אֲלֵיהֶם
  choice: sa kanila
  rationale: Ipinakikita ng parirala na tinipon ang mga pinuno sa kinaroroonan ng mga taga-Asdod; pinananatili ng “sa kanila” ang payak na kahulugan nang hindi nagdaragdag ng lugar na hindi tahasang binanggit.
- source_word: מַה נַּעֲשֶׂה לַאֲרוֹן
  choice: Ano ang gagawin natin sa kaban
  rationale: Ang imperfect na unang panauhang maramihan ay nagpapahayag ng sama-samang pagsangguni; natural sa Tagalog ang tanong na “Ano ang gagawin natin sa…?”
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: kaban ng Diyos ng Israel
  rationale: Tuwirang inililipat nito ang construct phrase at ginagamit ang nakaugaliang salitang “kaban” para sa sagradong ark.
- source_word: גַּת
  choice: Gat
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Gath.
- source_word: יִסֹּב / וַיַּסֵּבּוּ
  choice: Ilipat sa Gat / inilipat nila roon
  rationale: Ang סבב ay may diwang pag-ikot o pagpapalipat. Sa konteksto, ang kaban ay ipinadadala mula sa isang lungsod patungo sa Gat; malinaw at natural ang “ilipat,” habang ang talababa ay nagpapanatili sa leksikal na diwa ng pag-ikot/pagdaan.
