base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/004.yaml
  text: When they rose early the next morning[a], behold, Dagon had fallen facedown on the ground before the ark of Yahweh, and the head of Dagon and both the palms of his hands were cut off on the threshold; only Dagon was left on him.
translation:
  language: tl
  text: Kinaumagahan, maaga silang bumangon, at naroon si Dagon, nakasubsob sa lupa sa harap ng Kaban ni Yahweh. Putol ang ulo ni Dagon at ang mga palad ng dalawang kamay nito, at nasa ibabaw ng pasimano ang mga iyon; Dagon lamang ang natira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “Dagon lamang ang natira sa kaniya.” Mahirap ang huling parirala; malamang na ang katawan o punong bahagi lamang ng rebulto ang natira matapos maputol ang ulo at mga palad nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר מִמָּחֳרָת
  choice: Kinaumagahan, maaga silang bumangon
  rationale: Pinananatili ang diwa ng maagang pagbangon at ng sumunod na umaga nang natural sa makabagong Tagalog.
- source_word: וְהִנֵּה
  choice: at naroon
  rationale: Ipinahihiwatig nito ang bigla at nakakagulat na tanawing natuklasan nila, nang hindi gumagamit ng lipas na ekspresyon.
- source_word: נֹפֵל לְפָנָיו אַרְצָה
  choice: nakasubsob sa lupa
  rationale: Ang participle ay naglalarawan sa kalagayang nadatnan; ang 'nakasubsob' ay malinaw na nagpapahiwatig ng pagkalugmok nang padapa.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: sa harap ng Kaban ni Yahweh
  rationale: Tuwirang inilalarawan ang lokasyon at pinananatili ang personal na pangalang Yahweh.
- source_word: וּשְׁתֵּי כַּפּוֹת יָדָיו
  choice: ang dalawang palad ng kanyang mga kamay
  rationale: Pinananatili ang tiyak na kahulugan ng כַּפּוֹת bilang mga palad, hindi lamang pangkalahatang 'mga kamay.'
- source_word: כְּרֻתוֹת אֶל הַמִּפְתָּן
  choice: Putol ... at nakalagay ang mga iyon sa bungad
  rationale: Ipinapahayag ang kalagayang naputol at ang kinalalagyan ng mga bahagi. Ang 'bungad' ay natural na tawag sa threshold ng pasukan.
- source_word: רַק דָּגוֹן נִשְׁאַר עָלָיו
  choice: katawan na lamang ni Dagon ang natira sa kanya
  rationale: Ipinababatid ang malamang na diwa sa konteksto, habang inilalagay sa talababa ang literal at mahirap na anyo ng Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang יהוה ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Kung ano ang 'natira' kay Dagon
  choice: katawan na lamang ni Dagon
  alternative: si Dagon lamang ang natira sa kanya
  rationale: Dahil putol na ang ulo at mga palad, malamang na katawan o punong bahagi ng rebulto ang tinutukoy. Gayunman, hindi lubos na malinaw ang literal na Hebreo, kaya tahasang itinatala ang ambiguity sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaban” bilang maikli at pamilyar na tawag sa kaban sa konteksto, at “bungad” para sa threshold. Iniwasan ang sobrang literal na huling sugnay sa pangunahing teksto ngunit pinanatili ang tunay na kalabuan sa talababa.
