  terminology: Ang “Kaban ni Yahweh” ay angkop at pinananatili ang banal na pangalan. Ang “Dagon” ay wastong anyo. Ang “pasimano” ay mas eksaktong katumbas ng מִפְתָּן sa kontekstong ito.
