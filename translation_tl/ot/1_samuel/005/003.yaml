  source_fidelity: Tumpak na naipapahayag ang maagang pagbangon ng mga taga-Asdod, ang kanilang pagkakatuklas na si Dagon ay nakadapa nang mukha sa lupa sa harap ng kaban ni Yahweh, at ang pagbabalik nila sa kanya/rito sa dating kinalalagyan. Ang “nakita nilang” ay natural na Tagalog na paraan upang ihatid ang biglaang pagkakatuklas na minamarkahan ng וְהִנֵּה.
  naturalness: Makabago, malinaw, at angkop ang register. Ang “mga taga-Asdod,” “maagang bumangon,” “nakasubsob sa lupa,” at “sa harap ng” ay likas na gamit sa Filipino Tagalog. Natural din ang paggamit ng “ito” sa huling pangungusap dahil tumutukoy ang salaysay sa pisikal na bagay na kanilang kinuha at ibinalik, nang hindi kinakailangang lutasin ang sinadyang paglalabo ng teksto sa diyos at imahen.
  terminology: Wasto at pare-pareho ang “Yahweh” para sa יהוה. Ang “kaban ni Yahweh” ay angkop para sa אֲרוֹן יְהוָה. Pinananatili ng “Dagon” ang pangalan at hindi nagdaragdag ng interpretasyong gaya ng “rebulto.”
