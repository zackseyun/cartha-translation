id: 1SA.5.3
reference: 1 Samuel 5:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֤מוּ אַשְׁדּוֹדִים֙ מִֽ/מָּחֳרָ֔ת וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וַ/יִּקְחוּ֙ אֶת דָּג֔וֹן וַ/יָּשִׁ֥בוּ אֹת֖/וֹ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/003.yaml
  text: When the Ashdodites rose early the next day, behold, Dagon had fallen facedown on the ground before the ark of Yahweh. So they took Dagon and put him back in his place.
translation:
  language: tl
  text: Kinabukasan, maagang bumangon ang mga taga-Asdod, at nakita nilang nakasubsob si Dagon sa lupa sa harap ng kaban ni Yahweh. Kaya kinuha nila si Dagon at ibinalik ito sa kinalalagyan nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: maagang bumangon
  rationale: Tuwirang ipinapahayag nito ang diwa ng Hiphil ng שׁכם, na tumutukoy sa maagang pagbangon, sa natural na makabagong Tagalog.
- source_word: אַשְׁדּוֹדִים
  choice: mga taga-Asdod
  rationale: Ang anyong gentiliko ay tumutukoy sa mga naninirahan sa Asdod; ang “mga taga-Asdod” ang malinaw at karaniwang katumbas sa Tagalog.
- source_word: מִמָּחֳרָת
  choice: Kinabukasan
  rationale: Natural at maikli itong katumbas ng “sa sumunod na araw,” habang pinananatili ang pagkakasunod ng salaysay.
- source_word: וְהִנֵּה
  choice: at nakita nilang
  rationale: Sa konteksto, ipinakikilala ng הִנֵּה ang bigla at nakakagulat na tanawin. Inihahatid ng “nakita nilang” ang perspektiba ng pagkakatuklas nang hindi gumagamit ng artipisyal na “narito.”
- source_word: נֹפֵל לְפָנָיו אַרְצָה
  choice: nakasubsob ... sa lupa
  rationale: Ang “nakasubsob” ay malinaw na naglalarawan sa pagkakadapa nang patiwarik o mukha sa lupa at pinananatili ang larawan ng pagpapakumbaba o pagkatalo.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: sa harap ng kaban ni Yahweh
  rationale: Spatial ang לִפְנֵי rito. Ang “kaban ni Yahweh” ay natural sa Tagalog at malinaw na nagpapahayag ng kaugnayan ng kaban sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: וַיִּקְחוּ אֶת־דָּגוֹן
  choice: kinuha nila si Dagon
  rationale: Pinananatili nito ang payak na pandiwang לקח at hindi nagdaragdag kung paano nila binuhat o hinawakan ang imahen.
- source_word: וַיָּשִׁבוּ אֹתוֹ לִמְקוֹמוֹ
  choice: ibinalik ito sa kinalalagyan nito
  rationale: Ipinapahayag nito ang causative na diwa ng שׁוב at ang pagbabalik kay Dagon sa dati o takdang puwesto, nang hindi ipinapalagay na tahasang binanggit ang pedestal.
theological_decisions:
- issue: Paglalarawan kay Dagon bilang diyos o imahen
  choice: Panatilihin lamang ang pangalang “Dagon” at ang panghalip na “ito.”
  alternative: Tukuyin siya bilang “rebulto ni Dagon” o gumamit ng “siya.”
  rationale: Hindi tahasang pinag-iiba ng Hebreo rito ang diyos at ang imahen nito. Ang salin ay hindi nagdaragdag ng “rebulto,” kaya napapanatili ang malikhaing tensiyon ng salaysay; ang Tagalog na “ito” ay natural para sa bagay na pisikal na kinuha at ibinalik.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nakasubsob” upang maging buhay ngunit tumpak ang postura ni Dagon, at iniwasan ang masyadong literal ngunit di-natural na “sa kaniyang mukha patungo sa lupa.”
