translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “templo” upang natural na maipahayag ang paganong dambana, ngunit pinanatili sa talababa ang literal na “bahay.” Ang “bungad ng pintuan” ay pinili bilang madaling maunawaang katumbas ng threshold.
