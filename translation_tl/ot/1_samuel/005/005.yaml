base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/005.yaml
  text: Therefore, to this day the priests of Dagon and all who enter Dagon's temple in Ashdod do not step on Dagon's threshold[a][b].
translation:
  language: tl
  text: Kaya hanggang sa araw na ito, hindi tumatapak sa tuntungan ng pintuan ni Dagon ang mga pari ni Dagon at lahat ng pumapasok sa bahay ni Dagon sa Ashdod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Likas at tuwirang ipinahahayag ang bunga ng naunang pangyayari.
- source_word: לֹא יִדְרְכוּ
  choice: ay hindi tumatapak
  rationale: Ang דרך ay nangangahulugang tumapak o yumapak. Ang pangkasalukuyang anyo ay angkop sa kaugaliang nagpapatuloy hanggang sa panahon ng tagapagsalaysay.
- source_word: כֹהֲנֵי דָגוֹן
  choice: ang mga pari ni Dagon
  rationale: Tuwirang salin ng pariralang konstrukto at malinaw na tumutukoy sa mga tagapaglingkod ng paganong diyos.
- source_word: וְכָל הַבָּאִים בֵּית דָּגוֹן
  choice: at ang lahat ng pumapasok sa templo ni Dagon
  rationale: Sa konteksto, ang 'bahay ni Dagon' ay gusaling panrelihiyon; mas malinaw at natural sa makabagong Filipino ang 'templo,' habang itinatala sa talababa ang literal na anyo.
- source_word: עַל מִפְתַּן דָּגוֹן
  choice: sa bungad ng pintuan ng templo ni Dagon
  rationale: Ang מִפְתָּן ay ang tuntungan o threshold sa ibabang bahagi ng pintuan. Ang 'bungad ng pintuan' ay natural at madaling maunawaang Filipino; nilinaw ang kaugnayan nito sa templo ni Dagon.
- source_word: בְּאַשְׁדּוֹד
  choice: sa Ashdod
  rationale: Pinananatili ang pook na kinaroroonan ng templo at ng kaugaliang inilalarawan.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Malapit sa anyo ng Hebreo at malinaw na nagsasaad na nagpapatuloy ang kaugalian hanggang sa panahon ng tagapagsalaysay.
