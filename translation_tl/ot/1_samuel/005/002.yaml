base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/002.yaml
  text: So the Philistines took the ark of God and brought it into the house of Dagon[a], and set it beside Dagon.
translation:
  language: tl
  text: Kaya kinuha ng mga Filisteo ang Kaban ng Diyos at dinala ito sa bahay ni Dagon[a]. Inilagay nila ito sa tabi ni Dagon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templo ni Dagon.” Literal na, “bahay ni Dagon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: kinuha
  rationale: Karaniwang kahulugan ng לקח sa sunod-sunod na salaysay ang “kumuha.” Hindi dinaragdagan ng puwersang ipinahihiwatig ng “inagaw” o “sinamsam.”
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwan at malinaw na anyong Tagalog para sa pangalan ng pangkat-etniko.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: Kaban ng Diyos
  rationale: Ang אֲרוֹן ay tumutukoy sa sagradong kaban, at ang הָאֱלֹהִים ay “Diyos,” hindi ang pangalang YHWH. Ginamit ang malaking titik sa “Kaban” bilang nakaugaliang pantukoy sa natatanging sagradong bagay.
- source_word: וַיָּבִיאוּ אֹתוֹ
  choice: dinala ito
  rationale: Ang Hiphil ng בוא ay karaniwang “dalhin.” Ang panghalip ay tumutukoy sa Kaban; hindi idinagdag ang paraang “buhat” na hindi tahasang sinabi.
- source_word: בֵּית דָּגוֹן
  choice: bahay ni Dagon
  rationale: Pinananatili ang literal na larawan ng בַּיִת na “bahay,” habang ang “ni Dagon” ay likas na Tagalog para sa ugnayang paari. Sa konteksto, santuwaryo o templo ito.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: inilagay nila ito
  rationale: Ang Hiphil ng יצג ay “ilagay” o “itindig.” Ang “inilagay” ay natural at hindi nagpapasya kung nakatayo ang Kaban.
- source_word: אֵצֶל דָּגוֹן
  choice: sa tabi ni Dagon
  rationale: Malinaw na ipinahahayag ng אֵצֶל ang pagiging katabi. Hindi idinagdag sa pangunahing teksto ang “rebulto” o “larawan,” sapagkat Dagon lamang ang tahasang sinasabi ng Hebreo.
theological_decisions:
- issue: Pantukoy sa Diyos sa pariralang אֲרוֹן הָאֱלֹהִים
  choice: Kaban ng Diyos
  alternative: Kaban ng PANGINOON
  rationale: הָאֱלֹהִים ang nasa tekstong Hebreo, hindi YHWH; kaya pinananatili ang mismong banal na katawagang ginamit sa talata.
- issue: Tinutukoy ng pangalawang “Dagon”
  choice: Dagon
  alternative: rebulto ni Dagon
  rationale: Malamang na larawan o rebulto ng diyos ang pisikal na katabi ng Kaban, ngunit hindi ito tahasang binabanggit ng Hebreo. Pinananatili ng salin ang tunay na di-tiyak na pagtukoy.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang maiikling pandiwang salaysay at ang likas na “sa tabi ni.” Ang panandang talababa [a] ay inilagay kaagad pagkatapos ng “Dagon,” na siyang tinutukoy nito.
