  yaml_path: translation/ot/1_samuel/005/001.yaml
  text: The Philistines had taken the ark of God and brought it from Ebenezer to Ashdod[a].
translation:
  language: tl
  text: Kinuha ng mga Filisteo ang kaban ng Diyos at dinala nila ito mula sa Ebenezer patungong Ashdod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, nagsisimula ang talata sa salitang “At.” Hindi na ito isinalin nang hiwalay dahil likas nang nauunawaan sa Tagalog ang pagpapatuloy ng salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: ang mga Filisteo
  rationale: Ang וּ ay nag-uugnay sa salaysay, ngunit hindi kailangang isalin nang hiwalay sa natural na Tagalog sa pagsisimula ng bagong yugto. Ang “mga Filisteo” ang karaniwang tawag sa pangkat na ito.
- source_word: לָקְחוּ
  choice: Kinuha
  rationale: Ang Qal perfect ng לקח ay tumutukoy sa natapos na pagkilos. Hindi nangangailangan ang Tagalog ng katumbas ng English past perfect upang maipakita ang ugnayan nito sa naunang salaysay.
- source_word: אֵת
  choice: '[hindi isinalin ang pananda ng tuwirang layon]'
  rationale: Walang tuwirang katumbas sa Tagalog ang Hebreong pananda ng tiyak na tuwirang layon.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ang kaban ng Diyos
  rationale: Pinananatili nito ang payak na ugnayang genitibo ng Hebreo at gumagamit ng nakasanayang salitang “kaban” para sa banal na kaban.
- source_word: וַיְבִאֻהוּ
  choice: at dinala nila ito
  rationale: Ang Hiphil wayyiqtol ng בוא na may hulaping 3ms ay nangangahulugang dinala nila ito. Tahasang inilagay ang “nila” at “ito” para sa malinaw at natural na Tagalog.
- source_word: מֵאֶבֶן הָעֵזֶר
  choice: mula sa Ebenezer
  rationale: Isinalin ang מִן bilang “mula sa” at ginamit ang nakasanayang transliterasyong Ebenezer para sa pangalan ng lugar.
- source_word: אַשְׁדּוֹדָה
  choice: patungong Ashdod
  rationale: Ipinahihiwatig ng directional he ang kilos tungo sa Ashdod; natural itong ipinapahayag sa Tagalog sa pamamagitan ng “patungong.”
