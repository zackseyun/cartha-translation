  text: וַ/יְהִ֞י אַחֲרֵ֣י הֵסַ֣בּוּ אֹת֗/וֹ וַ/תְּהִ֨י יַד יְהוָ֤ה בָּ/עִיר֙ מְהוּמָה֙ גְּדוֹלָ֣ה מְאֹ֔ד וַ/יַּךְ֙ אֶת אַנְשֵׁ֣י הָ/עִ֔יר מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּשָּׂתְר֥וּ לָ/הֶ֖ם עפלים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/009.yaml
  text: And after they had moved it around[a], the hand of Yahweh was against the city, causing a very great panic; and he struck the men of the city, from small to great, and tumors broke out on them.
translation:
  language: tl
  text: Pagkatapos nilang ilipat ito, ang kamay ni Yahweh ay laban sa lunsod, at nagkaroon doon ng napakatinding kaguluhan. Hinampas niya ang mga lalaki ng lunsod, mula sa maliit hanggang sa malaki, at naglabasan sa kanila ang mga bukol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at tinubuan sila ng mga bukol.” Hindi tiyak kung anong uri ng bukol o pamamaga ang tinutukoy ng Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסַבּוּ אֹתוֹ
  choice: inilipat iyon
  rationale: Ang Hiphil ng סבב na may panghalip na layon ay tumutukoy sa paglilipat ng kaban. Natural sa modernong Tagalog ang “inilipat iyon” at hindi nito dinaragdagan ang direksiyong hindi tahasang sinabi sa talata.
- source_word: יַד יְהוָה
  choice: ang kamay ni Yahweh
  rationale: Pinananatili ang konkretong Hebreong metapora para sa aktibong kapangyarihan o hatol ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: napakatinding takot
  rationale: Ang מְהוּמָה ay maaaring tumukoy sa sindak, kaguluhan, o pagkalito. Ang “napakatinding takot” ay malinaw at natural sa konteksto ng biglaang salot, habang kinikilala sa talababa ang mas malawak na saklaw ng salita.
- source_word: וַיַּךְ
  choice: Hinampas niya
  rationale: Ang pandiwang isahan ay tumutukoy kay Yahweh bilang kumikilos. Pinananatili ng “hinampas” ang tuwiran at konkretong lakas ng Hebreo.
- source_word: אַנְשֵׁי הָעִיר
  choice: ang mga lalaki sa lunsod
  rationale: Tiyak na “mga lalaki” ang anyong Hebreo, kaya hindi ito pinalawak tungo sa pangkalahatang “mga tao.”
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: mula sa maliit hanggang sa malaki
  rationale: Malapit ito sa Hebreong idyoma at hindi nito ipinapasiya kung edad, katayuan, o ranggo ang tinutukoy.
- source_word: וַיִּשָּׂתְרוּ לָהֶם עפלים
  choice: tinubuan sila ng mga bukol
  rationale: Ang pambihirang pandiwa at pangngalan ay naglalarawan sa paglitaw ng mga pamamaga sa katawan. Ang “mga bukol” ay malinaw ngunit hindi labis na tiyak na medikal.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tahasang ginagamit ng teksto ang Tetragrammaton, kaya pinananatili bilang personal na pangalang Yahweh.
- issue: Ang kamay ni Yahweh bilang sanhi ng kapahamakan
  choice: Pinanatili ang metaporang “ang kamay ni Yahweh” at ang Diyos bilang paksa ng “hinampas niya”
  alternative: Gawing di-tuwiran ang sanhi, gaya ng “dumating ang salot”
  rationale: Tahasang iniuugnay ng Hebreo kay Yahweh ang hatol; hindi ito dapat palabuin o gawing impersonal.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “lunsod” upang mapanatili ang bahagyang pormal na himig ng salaysay; pinanatili rin ang Hebreong metapora at mga hindi tiyak na detalye. Inilagay ang [a] sa pangunahing teksto ayon sa talababa.
