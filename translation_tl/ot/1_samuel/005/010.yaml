base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/010.yaml
  text: So they sent the ark of God to Ekron. But when the ark of God came to Ekron, the Ekronites cried out, saying, “They have brought around to me the ark of the God of Israel, to kill me and my people!”
translation:
  language: tl
  text: Kaya ipinadala nila sa Ekron ang kaban ng Diyos. Ngunit nang dumating sa Ekron ang kaban ng Diyos, sumigaw ang mga taga-Ekron, “Dinala nila sa akin ang kaban ng Diyos ng Israel upang patayin ako at ang aking bayan!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isahan ang “akin,” “ako,” at “aking bayan,” marahil dahil nagsasalita ang Ekron bilang isang lungsod o sa pamamagitan ng isang kinatawan.
    reason: Nililinaw ang kapansin-pansing paglipat mula sa maramihang “mga taga-Ekron” tungo sa isahang tinig nang hindi binabago ang anyo ng pinagmulang teksto.
lexical_decisions:
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: kaban ng Diyos
  rationale: Ang “kaban” ang natural at kinikilalang salin ng אֲרוֹן sa kontekstong ito; pinananatili ang tahasang pagtukoy sa Diyos.
- source_word: הֵסַבּוּ אֵלַי
  choice: Dinala nila rito sa akin
  rationale: Ipinahihiwatig ng causative na anyo ng סבב ang pagpapalipat o pagpaparating ng kaban sa nagsasalita. Ang “rito sa akin” ay natural sa Filipino habang pinananatili ang isahang panghalip ng Hebreo.
- source_word: לַהֲמִיתֵנִי
  choice: upang patayin ako
  rationale: Tuwirang ipinapahayag ang layunin o ibinibintang na bunga ng pagdadala sa kaban, at pinananatili ang isahang hulaping panghalip.
- source_word: עַמִּי
  choice: aking bayan
  rationale: Ang עַם ay tumutukoy sa sambayanan o populasyong kinakatawan ng nagsasalita; mas angkop dito ang “bayan” kaysa “mga tao” bilang kolektibong katawagan.
theological_decisions:
- issue: Pagpapanatili sa isahang “ako/aking” sa sigaw ng mga taga-Ekron
  choice: “sa akin… patayin ako at ang aking bayan”
  alternative: “sa amin… patayin kami at ang aming bayan”
  rationale: Isahan ang mga panghalip sa tekstong Masoretiko (אֵלַי, הֲמִיתֵנִי, עַמִּי). Hindi ito ginawang maramihan kahit kolektibong sumisigaw ang mga taga-Ekron, upang mapanatili ang retorikang tila ang lungsod o kinatawan nito ang nagsasalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagdating doon” upang maiwasan ang mabigat na pag-uulit ng “sa Ekron,” habang malinaw pa rin ang lokasyon mula sa naunang pangungusap. Pinanatili ang matinding tono ng sigaw at ang isahang tinig ng Hebreo.
