base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/006.yaml
  text: And the hand of Yahweh was heavy against the people of Ashdod[a], and he devastated them and struck them with tumors, Ashdod and its territory.
translation:
  language: tl
  text: At naging mabigat ang kamay ni Yahweh laban sa mga taga-Asdod. Winasak niya sila at hinampas niya sila ng mga bukol[a]—ang Asdod at ang nasasakupan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pamamaga”; ayon sa tradisyon, mas tiyak itong isinasalin ng ilan na “mga almoranas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד יַד יְהוָה
  choice: naging mabigat ang kamay ni Yahweh
  rationale: Pinananatili ang konkretong Hebreong idyoma ng ‘mabigat na kamay,’ na nagpapahiwatig ng makapangyarihan at mapanghatol na pagkilos, sa halip na gawing abstraktong paliwanag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: אֶל הָאַשְׁדּוֹדִים
  choice: laban sa mga taga-Asdod
  rationale: Ang anyo ay tumutukoy sa mga naninirahan sa Asdod, at ipinahihiwatig ng אֶל dito ang kilos na nakatuon laban sa kanila.
- source_word: וַיְשִׁמֵּם
  choice: winasak niya sila
  rationale: Ipinapahayag ng pandiwa ang matinding pamiminsala o pagwasak; tuwiran at likas sa modernong Filipino ang ‘winasak.’
- source_word: וַיַּךְ אֹתָם
  choice: hinampas
  rationale: Pinananatili ang karaniwang larawan ng Hebreong pandiwa para sa paghatol—ang paghampas o pananakit—nang hindi gumagamit ng makalumang pananalita.
- source_word: בָּעֳפָלִים
  choice: mga bukol
  rationale: Ang salita ay tumutukoy sa mga bukol o pamamaga sa katawan. Ang ‘mga bukol’ ay sapat na malawak upang hindi tiyaking almoranas ang sakit, bagaman inilalaan sa talababa ang tradisyonal na mas tiyak na pagbasa.
- source_word: אֶת אַשְׁדּוֹד וְאֶת גְּבוּלֶיהָ
  choice: ang Asdod at ang nasasakupan nito
  rationale: Nililinaw ng parirala ang lawak ng salot—ang lungsod at ang teritoryong sakop nito. Mas natural sa Filipino ang ‘nasasakupan’ kaysa literal na ‘mga hangganan.’
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang personal na pangalan ng Diyos ng Israel at hindi ito pinapalitan ng titulong ‘Panginoon.’
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong talinghaga ng mabigat na kamay, habang gumamit ng karaniwang salitang ‘mga bukol’ upang mapanatili ang leksikal na di-katiyakan.
