  text: And the men who did not die were struck with tumors[a], and the cry of the city went up to heaven.
translation:
  language: tl
  text: At ang mga lalaking hindi namatay ay tinamaan ng mga bukol[a], at ang daing ng lungsod ay umakyat sa langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pamamaga.” Ang salitang Hebreo ay tumutukoy sa bukol o pamamaga sa katawan. Sa ilang tradisyonal na salin, tinukoy ito bilang “almoranas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: At ang mga lalaking
  rationale: Tuwirang pinananatili ang karaniwang panlalaking kahulugan ng אֲנָשִׁים nang hindi ito pinalalawak sa lahat ng tao.
- source_word: אֲשֶׁר לֹא מֵתוּ
  choice: hindi namatay
  rationale: Malinaw na itinatangi ng sugnay ang mga nakaligtas mula sa mga namatay.
- source_word: הֻכּוּ
  choice: dinapuan
  rationale: Sa konteksto ng salot, natural sa Filipino ang 'dinapuan' para sa pasibong pagkakaroon ng karamdaman, bagaman hindi nito literal na inuulit ang larawang 'sinaktan' ng Hebreo.
- source_word: בָעֳפָלִים
  choice: ng mga bukol
  rationale: Ang terminong Hebreo ay tumutukoy sa mga pamamaga o bukol sa katawan; hindi tiyak ang eksaktong karamdamang tinutukoy.
- source_word: וַתַּעַל
  choice: umabot
  rationale: Natural na ipinahahayag sa Filipino ang larawang ang daing ay umaakyat at nakararating sa langit.
- source_word: שַׁוְעַת
  choice: ang daing
  rationale: Ipinahihiwatig ng שַׁוְעָה ang matinding sigaw o paghingi ng saklolo; ang 'daing' ay maikli, marangal, at angkop sa konteksto.
- source_word: הָעִיר
  choice: ng lungsod
  rationale: Pinananatili ang konstruktong 'daing ng lungsod,' na kumakatawan sa sama-samang pagdaing ng mga naroon.
- source_word: הַשָּׁמָיִם
  choice: sa langit
  rationale: Karaniwang idiomatikong salin sa Filipino ng Hebreong anyong maramihan sa ganitong pahayag.
