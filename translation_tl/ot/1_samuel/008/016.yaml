base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/016.yaml
  text: He will take your male servants[a], your female servants, your best young men, and your donkeys, and use them for his work.
translation:
  language: tl
  text: Kukunin niya ang inyong mga aliping lalaki[a], inyong mga aliping babae, inyong pinakamahuhusay na kabataang lalaki, at inyong mga asno, at gagamitin niya ang mga ito sa kanyang gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inyong mga lingkod na lalaki … inyong mga lingkod na babae.” Maaaring mas malawak na tumukoy sa mga lingkod ang mga salitang Hebreo, ngunit sa kontekstong sapilitang kukunin sila ng hari, mas angkop ang “mga alipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵיכֶם
  choice: inyong mga aliping lalaki
  rationale: Maaaring tumukoy ang עֶבֶד sa alipin o lingkod. Sa konteksto ng sapilitang pagkuha ng hari, malinaw na nangingibabaw ang diwa ng pagkaalipin; pinananatili rin ng “aliping lalaki” ang kaibahan sa kasunod na terminong pambabae.
- source_word: שִׁפְחוֹתֵיכֶם
  choice: mga aliping babae
  rationale: Ang שִׁפְחָה ay babaeng alipin o lingkod. Ang “aliping babae” ay likas sa modernong Filipino at kapantay ng naunang “aliping lalaki.”
- source_word: בַּחוּרֵיכֶם הַטּוֹבִים
  choice: pinakamahuhusay na kabataang lalaki
  rationale: Karaniwang tumutukoy ang בָּחוּר sa lalaking nasa kasibulan ng kabataan, samantalang ipinahihiwatig ng הַטּוֹבִים ang pinakamahusay o pinakapili. Pinananatili ng salin ang edad at kalidad.
- source_word: חֲמוֹרֵיכֶם
  choice: mga asno
  rationale: Ang חֲמוֹר ay karaniwang nangangahulugang asno; ito ang tuwiran at dignified na katawagan sa Filipino.
- source_word: יִקָּח
  choice: kukunin niya
  rationale: Ang לקח ay “kumuha.” Ang aspektong di-ganap sa sunod-sunod na babala tungkol sa gagawin ng hari ay angkop na isalin sa panghinaharap.
- source_word: וְעָשָׂה לִמְלַאכְתּוֹ
  choice: at gagamitin ang mga ito sa kanyang gawain
  rationale: Ang parirala ay literal na kaugnay ng paggawa para sa gawain ng hari, ngunit idiomatikong ipinahihiwatig na itatalaga o gagamitin niya ang mga tao at hayop para sa sariling gawain. Natural sa Filipino ang napiling anyo at pinananatili ang diwa ng sapilitang paglalaan.
