translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “kanyang” ayon sa kasalukuyang pamantayang baybay. Tahasang inulit ang “mga” sa magkakahanay na pangngalan upang maging malinaw, at ginamit ang “mga ito” sapagkat kapuwa mga tao at hayop ang tinutukoy.
