  source_fidelity: Tumpak sa pangkalahatan ang paglalarawan ng pagkuha ng hari ng mga tao para sa kaniyang paglilingkod, pati ang mga ranggong militar, gawaing bukid, at paggawa ng kagamitang militar at pangkarwahe. Gayunman, ang mga anyong “pag-aanihin ng kaniyang ani” at “pagagawin niya ng kaniyang mga sandata” ay hindi gaanong malinaw o likas sa Tagalog at maaaring lumabo ang ugnayan ng mga taong itatalaga at ng gawaing ipagagawa. Ang “mga sandata sa digmaan” ay mas makitid kaysa sa malawak na כְּלֵי מִלְחַמְתּוֹ, na sumasaklaw sa kagamitang pandigma.
  naturalness: Kailangan ng banayad na rebisyon upang maging mas likas at tuwiran ang sintaks. Ang “magtatalaga ... ng iba upang ...” ay malinaw na Tagalog at natural na naipapakita na ang hari ay nagtatakda ng mga tao para sa mga gawaing ito.
  terminology: Mas angkop ang “mga kumandante” bilang alternatibong mas malinaw na pantukoy sa mga ranggong militar. Ang “mga kagamitang pandigma” ay mas tapat sa lawak ng Hebreong כְּלִי kaysa “mga sandata.” Nananatiling wasto at natural ang “mga kagamitan ng kaniyang mga karwahe.”
