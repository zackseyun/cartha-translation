translation_notes:
  register: Makabagong Filipino na natural at marangal. Ginamit ang “siya/niya” sa halip na mas pormal na “kaniya” bilang panghalip, ngunit pinanatili ang “kaniyang” bilang pantukoy na paari. Inayos ang magkakasunod na infinitibo bilang mga pandiwang nagpapagawa upang malinaw sa karaniwang mambabasa na kukunin ng hari ang mga tao para sa sariling paglilingkod.
