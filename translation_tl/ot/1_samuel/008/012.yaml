base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/012.yaml
  text: He will appoint for himself commanders of thousands and commanders of fifties[a], and some to plow his ground and reap his harvest[c][b], and to make his weapons of war and the equipment of his chariots.
translation:
  language: tl
  text: Magtatalaga siya para sa sarili niya ng mga kumandante ng libu-libo at mga kumandante ng tiglilimampu[a], at ng iba upang mag-araro sa kaniyang lupain at mag-ani ng kaniyang ani[b], at upang gumawa ng mga kagamitang pandigma at mga kagamitan ng kaniyang mga karwahe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pinuno ng libu-libo at mga pinuno ng tiglilimampu.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “araruhin ang kaniyang pag-aararo at aanihin ang kaniyang ani,” isang anyong nagbibigay-diin sa gawaing ginagawa para sa hari.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga kagamitang militar at mga kagamitan ng kaniyang mga karwahe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָשׂוּם לוֹ
  choice: Magtatalaga siya para sa sarili niya
  rationale: Ang infinitibong Hebreo ay nagpapatuloy sa paglalarawan ng gagawin ng hari; ginawang tahasang pandiwa sa Tagalog para maging natural, habang pinananatili ng “para sa sarili niya” ang diwang para sa sariling kapakinabangan ng hari.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי חֲמִשִּׁים
  choice: mga pinuno ng libu-libo at mga pinuno ng tiglilimampu
  rationale: Maaaring tumukoy ang שַׂר sa opisyal o kumandante. Sapat na malawak at dignified ang “pinuno,” at pinananatili ng mga bilang ang estrukturang militar o administratibo ng Hebreo.
- source_word: וְלַחֲרֹשׁ חֲרִישׁוֹ
  choice: pag-aararuhin niya sa kaniyang bukid
  rationale: Ang literal na magkaugnay na salitang “araruhin ang kaniyang pag-aararo” ay hindi natural sa Tagalog. Ipinahahayag ng salin ang sapilitang paggawa sa lupang para sa hari nang hindi dinaragdagan ang detalye.
- source_word: וְלִקְצֹר קְצִירוֹ
  choice: pag-aanihin ng kaniyang ani
  rationale: Pinananatili nito ang pag-aani para sa hari at ang pagmamay-ari na ipinahihiwatig ng hulaping Hebreo.
- source_word: וְלַעֲשׂוֹת כְּלֵי מִלְחַמְתּוֹ
  choice: pagagawin niya ng kaniyang mga sandata sa digmaan
  rationale: Malawak ang כְּלִי, ngunit sa pariralang may “digmaan” ay natural itong tumukoy sa mga sandata o kagamitang militar. Ang “mga sandata sa digmaan” ay malinaw at malapit sa anyo ng Hebreo.
- source_word: וּכְלֵי רִכְבּוֹ
  choice: mga kagamitan ng kaniyang mga karwahe
  rationale: Maaaring tumukoy ang רֶכֶב sa karwahe o hukbong nakakarwahe. Pinananatiling malawak ng “mga kagamitan ng kaniyang mga karwahe” ang ugnayang genitibo at hindi tinutukoy nang labis ang uri ng kagamitan.
