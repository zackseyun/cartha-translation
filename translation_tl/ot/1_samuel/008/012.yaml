revisions:
- from: Magtatalaga siya para sa sarili niya ng mga pinuno ng libu-libo at mga pinuno ng tiglilimampu[a]. Ang iba ay pag-aararuhin niya sa kaniyang bukid at pag-aanihin ng kaniyang ani[b], at ang iba nama’y pagagawin niya ng kaniyang mga sandata sa digmaan at ng mga kagamitan ng kaniyang mga karwahe[c].
  to: Magtatalaga siya para sa sarili niya ng mga kumandante ng libu-libo at mga kumandante ng tiglilimampu[a], at ng iba upang mag-araro sa kaniyang lupain at mag-ani ng kaniyang ani[b], at upang gumawa ng mga kagamitang pandigma at mga kagamitan ng kaniyang mga karwahe[c].
  rationale: Inayos ang sintaks upang malinaw na ang hari ay magtatalaga ng mga tao para sa bawat tungkulin. Pinalitan ang mas makitid na “mga sandata sa digmaan” ng “mga kagamitang pandigma,” na mas tapat sa malawak na kahulugan ng Hebreong כְּלֵי. Pinanatili ang mga bilang, ang pagmamay-ari ng hari sa lupain at ani, at ang hindi labis na pagtukoy sa uri ng kagamitang kaugnay ng mga karwahe.
