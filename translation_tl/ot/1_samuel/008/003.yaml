base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/003.yaml
  text: But his sons did not walk in his ways[a]; they turned aside after dishonest gain, took bribes[b], and perverted justice.
translation:
  language: tl
  text: Ngunit hindi lumakad sa kanyang landas ang kanyang mga anak na lalaki. Lumihis sila tungo sa di-makatarungang pakinabang[a], tumanggap ng mga suhol, at binaluktot ang katarungan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi makatarungang pakinabang” o “kasakiman.” Ang salitang Hebreo ay tumutukoy sa pakinabang na hinahangad sa mali o mapagsamantalang paraan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “inilihis ang hatol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ ... בִדְרָכָיו
  choice: lumakad ... sa kanyang mga landas
  rationale: Ang paglakad sa mga landas ng isang tao ay metapora para sa pagsunod sa kanyang asal at paraan ng pamumuhay. Nauunawaan ito sa modernong Filipino at pinananatili ang larawan ng Hebreo.
- source_word: וַיִּטּוּ
  choice: lumihis sila
  rationale: Ipinahihiwatig ng נטה ang paglihis mula sa matuwid na landas; maikli at natural ang “lumihis” sa kontekstong moral at legal.
- source_word: אַחֲרֵי הַבָּצַע
  choice: para sa maruming pakinabang
  rationale: Ang בֶּצַע ay pakinabang na hinahangad o nakukuha sa mali, sakim, o mapagsamantalang paraan. Ipinapakita ng “maruming pakinabang” kapwa ang pakinabang at ang pagiging tiwali nito.
- source_word: וַיִּקְחוּ שֹׁחַד
  choice: tumanggap ng mga suhol
  rationale: Ang שֹׁחַד ay partikular na suhol, lalo na sa usaping legal. Ang maramihang “mga suhol” ay angkop sa paglalarawan ng kanilang nakaugaliang gawain.
- source_word: וַיַּטּוּ מִשְׁפָּט
  choice: binaluktot ang katarungan
  rationale: Ang idyoma ay tumutukoy sa pagpilipit o paglihis ng makatarungang hatol. Natural sa Filipino ang “binaluktot ang katarungan” at malinaw ang legal na diwa.
- source_word: בָּנָיו
  choice: kanyang mga anak
  rationale: Bagaman maaaring pangkalahatan ang “anak” sa Filipino, nililinaw ng konteksto na tumutukoy ito sa mga lalaking anak ni Samuel; natural at tumpak dito ang “mga anak.”
theological_decisions:
- issue: Paglalarawang moral at legal sa mga anak ni Samuel
  choice: 'Panatilihin ang tiyak na paratang ng katiwalian sa paghatol: maruming pakinabang, mga suhol, at pagbaluktot sa katarungan.'
  alternative: Gumamit ng pangkalahatang paglalarawan gaya ng “naging sakim sila” o “gumawa sila ng masama.”
  rationale: Sunod-sunod sa Hebreo ang mga salitang tumutukoy sa katiwaliang legal. Hindi dapat pahinain ang talata tungo sa malabong paglalarawan lamang ng masamang asal.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang metaporang “lumakad ... sa mga landas,” habang ginawang natural ang mga idyomang legal. Inilagay ang mga panandang talababa sa mismong pariralang ipinaliliwanag ng bawat tala.
