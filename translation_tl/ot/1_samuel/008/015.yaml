    issue: Idinagdag ng pangunahing teksto ang “ani” sa pariralang “ani ng inyong mga ubasan.”
    rationale: Ang כַּרְמֵיכֶם ay “inyong mga ubasan.” Maaaring ipahiwatig ng konteksto ang produktong agrikultural, ngunit hindi ito hayagang nasa Hebreo; dapat panatilihin ng salin ang masiksik na pahayag ng pinagmulan.
  - severity: low
    issue: “Mga binhi” ay hindi gaanong natural sa pangkalahatang agrikultural na kahulugan ng זַרְעֵיכֶם.
    rationale: Ang “binhi” bilang pangngalang masa ay mas natural sa Filipino at maaari ring saklawin ang semantikong saklaw na binhi/itinanim na ani nang hindi labis na nagpapaliwanag.
  revised_text: Kukuha siya ng ikasampung bahagi ng inyong binhi at mga ubasan, at ibibigay niya ito sa kanyang mga opisyal[a] at mga lingkod.
