  source_fidelity: Kailangang itama ang “ani ng inyong mga ubasan.” Ang Hebreo ay tuwirang nagsasabing “inyong mga ubasan” (כַרְמֵיכֶם), hindi tahasang ang ani o produkto ng mga ito. Bagaman makatuwiran ang ani sa konteksto ng ikasampung bahagi, hindi ito dapat idagdag sa pangunahing teksto.
  naturalness: Natural at marangal ang pangungusap pagkatapos ng maliit na pag-aayos. Ang “binhi” ay mas likas bilang pangngalang masa na walang “mga.”
  terminology: Ang “ikasampung bahagi” ay angkop para sa יַעְשֹׂר at malinaw na inilalarawan ang sapilitang pagkuha. Ang “mga opisyal” para sa סָרִיסָיו ay angkop, habang napapanatili ng talababa ang alternatibong “mga eunuko.” Ang “mga lingkod” para sa עֲבָדָיו ay katanggap-tanggap.
  issues:
