translation:
  language: tl
  text: Kukuha siya ng ikasampung bahagi ng inyong binhi at mga ubasan, at ibibigay niya ito sa kanyang mga opisyal[a] at mga lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanyang mga eunuko.” Ang salitang Hebreo na סָרִיסָיו ay maaaring tumukoy sa mga eunuko o, sa mas malawak na diwa, sa mga opisyal ng palasyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעֵיכֶם
  choice: inyong mga binhi
  rationale: Ang זֶרַע ay literal na “binhi” at maaari ring tumukoy sa inaning bunga ng itinanim. Pinananatili ng “mga binhi” ang konkretong larawan ng Hebreo, habang nililinaw ng konteksto ng pagkuha ng ikasampung bahagi ang agrikultural na diwa.
- source_word: כַרְמֵיכֶם
  choice: ani ng inyong mga ubasan
  rationale: Karaniwang nangangahulugang “ubasan” ang כֶּרֶם, ngunit ang bagay na maaaring kunan ng ikasampung bahagi ay ang ani nito. Ginagawang natural at malinaw ng salin ang ipinahihiwatig na produkto ng mga ubasan.
- source_word: יַעְשֹׂר
  choice: kukuha ... ng ikasampung bahagi
  rationale: Sa Hiphil, ang עשר ay nangangahulugang kumuha o magtakda ng ikasampung bahagi. Ang “kukuha ng ikasampung bahagi” ay malinaw na naghahayag ng sapilitang singil ng hari at umiiwas sa eksklusibong panrelihiyong dating ng “magbibigay ng ikapu.”
- source_word: וְנָתַן
  choice: at ibibigay niya iyon
  rationale: Ang waw + qatal ay nagpapatuloy sa paglalarawan ng gagawin ng hari. Ang “iyon” ay natural na tumutukoy sa ikasampung bahaging kukunin.
- source_word: לְסָרִיסָיו
  choice: sa kanyang mga opisyal
  rationale: Ang סָרִיס ay maaaring tumukoy sa eunuko o, sa mas malawak na diwa, sa opisyal ng palasyo. Ang “mga opisyal” ang pinakamalinaw sa administratibong konteksto, habang pinananatili sa talababa ang mas tiyak na alternatibo.
- source_word: וְלַעֲבָדָיו
  choice: at mga lingkod
  rationale: Ang עֶבֶד ay maaaring mangahulugang lingkod o alipin. Dito ay tumutukoy ito sa mga taong naglilingkod sa hari, kaya hindi labis na tinutukoy ng “mga lingkod” ang kanilang legal na katayuan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ikasampung bahagi” sa halip na “ikapu” upang idiin ang sapilitang pagkuha ng hari, hindi ang panrelihiyong paghahandog. Ang “ani ng inyong mga ubasan” ay natural na paglilinaw sa bagay na kinukunan ng bahagi.
