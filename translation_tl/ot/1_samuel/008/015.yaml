- from: Kukuha siya ng ikasampung bahagi ng inyong mga binhi at ng ani ng inyong mga ubasan, at ibibigay niya iyon sa kanyang mga opisyal[a] at mga lingkod.
  to: Kukuha siya ng ikasampung bahagi ng inyong binhi at mga ubasan, at ibibigay niya ito sa kanyang mga opisyal[a] at mga lingkod.
  rationale: Inalis ang “ani” upang hindi lumampas ang pangunahing teksto sa tahasang sinasabi ng Hebreo. Pinanatili ang “ikasampung bahagi,” “mga opisyal,” at ang talababa, sapagkat wasto nilang inihahatid ang pandiwa at ang leksikal na kalabuan ng סָרִיסָיו.
