  source_fidelity: 'Tumpak ang salin sa lahat ng pangunahing elemento ng Hebreo: ang צֹאן ay naipahayag bilang kolektibong “mga kawan,” ang יַעְשֹׂר bilang sapilitang pagkuha ng ikasampung bahagi, at ang resulta ng pagpapasakop sa hari bilang pagiging “mga alipin niya.” Ang “magiging” ay likas na naghahatid ng bunga ng babala sa konteksto nang hindi lumalayo sa simpleng pandiwang “magiging/maaaring maging.”'
  naturalness: Malinaw, payak, at natural sa modernong Filipino Tagalog ang pangungusap. Ang “Kukunin niya ang ikasampung bahagi ng inyong mga kawan” ay maayos na tumutukoy sa ikasampung bahagi ng mga alagang hayop, at ang “kayo’y magiging mga alipin niya” ay tuwiran at marangal ang rehistro.
  terminology: Ang “mga kawan” ay angkop para sa צֹאן at hindi di-kailangang nililimitahan sa tupa lamang. Ang “mga alipin” ay isang makatwirang pangunahing salin para sa עֲבָדִים sa kontekstong ito ng maharlikang sapilitang pagkuha at pagkawala ng kalayaan. Wastong itinatala ng talababa ang “mga lingkod” bilang alternatibong saklaw ng termino.
