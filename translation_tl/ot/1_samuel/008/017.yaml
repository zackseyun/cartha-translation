  text: צֹאנְ/כֶ֖ם יַעְשֹׂ֑ר וְ/אַתֶּ֖ם תִּֽהְיוּ ל֥/וֹ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/017.yaml
  text: He will take a tenth of your flocks[a], and you will become his servants.
translation:
  language: tl
  text: Kukunin niya ang ikasampung bahagi ng inyong mga kawan, at kayo'y magiging mga alipin niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lingkod.” Saklaw ng salitang Hebreo ang mga taong naglilingkod, ngunit sa kontekstong ito ng sapilitang pagkuha ng hari at pagkawala ng kalayaan, mas angkop ang “mga alipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאנְכֶם
  choice: inyong mga kawan
  rationale: Ang צֹאן ay tumutukoy nang pangkatan sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Likas sa Filipino ang “mga kawan” at hindi nito nililimitahan ang kahulugan sa mga tupa lamang.
- source_word: יַעְשֹׂר
  choice: kukunin niya ang ikasampung bahagi
  rationale: Sa babalang ito tungkol sa mga sapilitang kukunin ng hari, malinaw at natural ang pariralang ito. Iniiwasan din nito ang kultiko o kusang-loob na pahiwatig na maaaring dala ng “ikapu.”
- source_word: וְאַתֶּם תִּהְיוּ לוֹ
  choice: at kayo'y magiging ... niya
  rationale: Ipinapahayag ng sugnay ang kalagayang kahahantungan ng bayan sa ilalim ng hari. Pinananatili ng “magiging” ang bunga o kinalabasang diin ng konteksto.
- source_word: לַעֲבָדִים
  choice: mga alipin
  rationale: Bagaman maaaring tumukoy ang עֲבָדִים sa mga lingkod, ang konteksto ng maharlikang pagsasamantala at pagkawala ng kalayaan ay nagpapahiwatig ng sapilitan at lubos na pagpapasakop; kaya ang “mga alipin” ang pinakamalinaw dito.
theological_decisions:
- issue: Paglalarawan sa עֲבָדִים sa konteksto ng pagpapasakop sa hari
  choice: mga alipin
  alternative: mga lingkod
  rationale: Ang kasukdulan ng babala ay ang pagkawala ng kalayaan ng Israel sa ilalim ng hari. Ipinakikita ng “mga alipin” ang bigat ng babala nang hindi nagdaragdag ng kalaunang teolohikal na kategorya; gayunman, itinatala sa talababa ang tunay na saklaw ng salitang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “kayo’y” para sa maayos na daloy, “ikasampung bahagi” upang maging malinaw ang sapilitang pagkuha, at “mga kawan” upang mapanatili ang kolektibong kahulugan ng mga tupa at kambing.
