base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/005.yaml
  text: They said to him[a], “Look, you have grown old, and your sons have not walked in your ways. Now appoint for us a king to judge us, like all the nations.”
translation:
  language: tl
  text: Sinabi nila sa kanya, “Tingnan mo, matanda ka na, at ang iyong mga anak ay hindi lumakad sa iyong mga daan. Kaya ngayon, magtalaga ka para sa amin ng isang hari na hahatol sa amin, gaya ng sa lahat ng bansa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pinananatili ang puwersang pantawag-pansin ng Hebreo sa natural at makabagong Tagalog, nang hindi gumagamit ng makalumang “Narito.”
- source_word: זָקַנְתָּ
  choice: matanda ka na
  rationale: Ipinahihiwatig ng “na” ang kalagayang bunga ng pagtanda, gaya ng aspektong ganap ng pandiwang Hebreo.
- source_word: הָלְכוּ בִּדְרָכֶיךָ
  choice: hindi lumakad sa iyong mga daan
  rationale: Pinananatili ang biblikal na talinghaga ng paglakad sa mga daan bilang paraan ng pamumuhay at pagkilos.
- source_word: שִׂימָה לָּנוּ
  choice: magtalaga ka para sa amin
  rationale: Ang “magtalaga” ay malinaw na nagpapahayag ng pagluklok o pagtatalaga ng pinunong hinihingi ng matatanda.
- source_word: מֶלֶךְ
  choice: isang hari
  rationale: Tuwirang salin ng karaniwang katawagan sa isang monarko; natural sa Tagalog ang “isang” sa kahilingang ito.
- source_word: לְשָׁפְטֵנוּ
  choice: na hahatol sa amin
  rationale: Pinananatili ang pangunahing kahulugan ng שׁפט na “humatol,” habang kinikilala sa talababa ang mas malawak na tungkuling pampamahalaan sa kontekstong ito.
- source_word: כְּכָל הַגּוֹיִם
  choice: gaya ng lahat ng bansa
  rationale: Ang “mga bansa” ay tumutukoy sa ibang mga bayan sa paligid ng Israel at hindi nag-aangkat ng mas huling gamit ng terminong “mga Hentil.”
theological_decisions:
- issue: Ang kahilingan para sa monarkiya ay inihahambing sa kaayusang pampolitika ng ibang mga bayan.
  choice: gaya ng lahat ng bansa
  alternative: gaya ng lahat ng mga Hentil
  rationale: Pinananatili ng “mga bansa” ang paghahambing ng Israel sa nakapaligid na mga bayan nang hindi nagdaragdag ng mga konotasyong etniko at teolohikal mula sa mas huling panahon.
- issue: Ang saklaw ng tungkulin ng haring “hahatol” sa Israel.
  choice: hahatol sa amin
  alternative: mamamahala sa amin / mamumuno sa amin
  rationale: Ang pangunahing kahulugan ng pandiwang Hebreo ay paghatol, ngunit maaari nitong saklawin ang mas malawak na pamamahala. Nasa pangunahing teksto ang mas tuwirang salin at nasa talababa ang mga lehitimong kahulugan sa konteksto.
translation_notes:
  register: Makabago at marangal na Tagalog na gumagamit ng pang-isahang panghalip upang panatilihin ang bilang ng Hebreo. Pinanatili ang biblikal ngunit malinaw na talinghagang “lumakad sa iyong mga daan.”
