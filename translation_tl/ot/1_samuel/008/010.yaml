  source_fidelity: 'Tumpak na isinasalin ng draft ang pangunahing mga bahagi ng Hebreo: si Samuel ang nagsalita, ang kabuuan ng mga salita ni Yahweh ang ipinahayag, at ang bayan ang humihiling kay Samuel ng hari. Gayunman, ang panimulang “Kaya” ay hindi kinakailangan ng waw-consecutive at bahagyang nagdaragdag ng hinuha ng bunga o konklusyon.'
  naturalness: Nauunawaan ang draft, ngunit mas natural at malinaw ang ayos na “Sinabi ni Samuel sa bayan na humihingi sa kanya ng isang hari ang lahat ng salita ni Yahweh.” Iniiwasan nito ang medyo mabigat na paglalagay ng mahabang pariralang “sa bayang humihingi…” bago ang layon.
  terminology: Ang “Yahweh” ay wastong pananatili ng Tetragrammaton. Ang “lahat ng salita ni Yahweh” ay angkop at pormal-biblikal. Ang “isang hari” ay malinaw na naghahayag ng di-tiyak na layon ng Hebreo nang hindi nagdadagdag ng kahulugan.
