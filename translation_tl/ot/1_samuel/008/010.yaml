  text: So Samuel spoke all the words of Yahweh to the people who were asking him for a king[a].
translation:
  language: tl
  text: Sinabi ni Samuel sa bayan na humihingi sa kanya ng isang hari[a] ang lahat ng salita ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na humiling sa kanya ng isang hari.” Maaaring ilarawan ng Hebreong participle ang nagpapatuloy na pagkilos o ang bayan bilang mga taong nakilala sa kahilingang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sinabi
  rationale: Karaniwang katumbas ito ng pandiwang Hebreo at natural sa Filipino kapag ang layon ay “ang lahat ng salita.”
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  choice: ang lahat ng salita ni Yahweh
  rationale: Pinananatili nito ang diin sa kabuuan ng mensahe at ang pormal na biblikal na pariralang “mga salita ni Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֶל הָעָם
  choice: sa bayan
  rationale: Ang “bayan” ay natural at marangal na kolektibong tawag sa mga taong tinutukoy rito, nang hindi nagdaragdag ng “Israel” na wala sa mismong parirala.
- source_word: הַשֹּׁאֲלִים מֵאִתּוֹ מֶלֶךְ
  choice: humihingi sa kanya ng hari
  rationale: Ipinapakita ng kasalukuyang anyong “humihingi” ang nagpapatuloy o naglalarawang bisa ng Hebreong participle; malinaw rin na kay Samuel inihaharap ang kahilingan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo o ibang tradisyonal na anyo.
- issue: Aspekto ng הַשֹּׁאֲלִים
  choice: humihingi
  alternative: humingi na
  rationale: Maaaring tumukoy ang participle sa nagpapatuloy na paghingi o maglarawan sa bayan bilang mga humiling. Pinili sa teksto ang una at pinanatili sa talababa ang ikalawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” bilang kolektibong katawagan at pinanatili ang bahagyang pormal na “lahat ng salita ni Yahweh” upang maipakita ang diin ng Hebreo.
