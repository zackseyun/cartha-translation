  text: וְ/אֶת שְׂ֠דֽוֹתֵי/כֶם וְ/אֶת כַּרְמֵי/כֶ֧ם וְ/זֵיתֵי/כֶ֛ם הַ/טּוֹבִ֖ים יִקָּ֑ח וְ/נָתַ֖ן לַ/עֲבָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/014.yaml
  text: He will take your fields[a], your vineyards, and your best olive groves[b], and give them to his servants.
translation:
  language: tl
  text: Kukunin niya ang inyong mga bukid, mga ubasan, at pinakamaiinam na taniman ng olibo[a], at ibibigay ang mga iyon sa kanyang mga lingkod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga punong olibo” o “mga halamanan ng olibo.” Malamang na tumutukoy ang Hebreo sa mga taniman ng olibo bilang ari-ariang pansakahan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga alipin.” Ang salitang Hebreo ay maaaring tumukoy sa mga lingkod o mga alipin, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֹתֵיכֶם
  choice: inyong mga bukid
  rationale: Ang שָׂדֶה ay karaniwang tumutukoy sa bukid o lupang sinasaka. Ang “mga bukid” ang tuwiran at natural na katumbas sa talaan ng mga ari-ariang pansakahan.
- source_word: כַּרְמֵיכֶם
  choice: mga ubasan
  rationale: Ang כֶּרֶם ay karaniwang ubasan. Tumpak at likas sa modernong Tagalog ang “mga ubasan.”
- source_word: זֵיתֵיכֶם
  choice: taniman ng olibo
  rationale: Maaaring tumukoy ang זַיִת sa mga punong olibo bilang isang pangkat o sa lupaing tinamnan ng olibo. Dahil kaagapay ito ng mga bukid at ubasan, ipinapakita ng “taniman ng olibo” na ari-ariang pansakahan ang tinutukoy.
- source_word: הַטּוֹבִים
  choice: pinakamaiinam
  rationale: Pangunahing kahulugan ng טוֹב ang “mabuti” o “mainam,” ngunit sa konteksto ng pagkuha ng hari sa mga ari-arian, tumutukoy ito sa mga pinakapiling taniman. Likas na ipinahahayag ito ng “pinakamaiinam.”
- source_word: יִקָּח
  choice: kukunin
  rationale: Ang לָקַח ay payak na pandiwang “kumuha.” Pinananatili ng “kukunin” ang payak na salita ng Hebreo, habang ipinahihiwatig ng konteksto ang sapilitang katangian ng pagkuha.
- source_word: וְנָתַן
  choice: at ibibigay
  rationale: Ang נָתַן ay karaniwang nangangahulugang “magbigay.” Ang “ibibigay” ay tuwiran at malinaw sa daloy ng babala.
- source_word: לַעֲבָדָיו
  choice: sa kanyang mga lingkod
  rationale: Maaaring mangahulugan ang עֶבֶד ng lingkod o alipin ayon sa konteksto. Dito, maaaring tumukoy ito sa mga tauhan o opisyal ng hari na pagkakalooban ng lupa; kaya “mga lingkod” ang nasa teksto, habang inilalagay sa talababa ang tunay na alternatibong “mga alipin.”
