base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/007.yaml
  text: And Yahweh said to Samuel[a], “Listen to the voice of the people in all that they say to you, for they have not rejected you, but they have rejected me from being king over them.”
translation:
  language: tl
  text: At sinabi ni Yahweh kay Samuel, “Pakinggan mo ang tinig ng bayan sa lahat ng sinasabi nila sa iyo, sapagkat hindi ikaw ang itinakwil nila, kundi ako ang itinakwil nila bilang hari nila.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ayaw nilang ako ang maghari sa kanila.”
    reason: Pinananatili ng alternatibo ang pandiwang anyo ng Hebreong מִמְּלֹךְ עֲלֵיהֶם, na maaaring ipahayag bilang pagtanggi sa paghahari ni Yahweh sa kanila.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang tuwirang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: שְׁמַע
  choice: Pakinggan mo
  rationale: Ang pautos ay humihiling kay Samuel na dinggin at sundin ang kahilingan ng bayan. Likas sa modernong Tagalog ang “Pakinggan mo” at hindi nito labis na nililinaw ang ipinahihiwatig na pagsunod.
- source_word: בְּקוֹל הָעָם
  choice: ang tinig ng bayan
  rationale: Pinananatili nito ang larawan ng Hebreong idyomang “tinig ng bayan” habang malinaw pa rin sa Tagalog.
- source_word: לְכֹל אֲשֶׁר יֹאמְרוּ אֵלֶיךָ
  choice: sa lahat ng sinasabi nila sa iyo
  rationale: Ipinahahayag nito ang kabuuang saklaw ng utos nang malapit sa anyo at diwa ng Hebreo.
- source_word: מָאַס
  choice: itinakwil
  rationale: Ang pandiwa ay nangangahulugang tumanggi o magtaboy. Ang “itinakwil” ay angkop sa matinding personal at pampamahalaang pagtanggi sa talata.
- source_word: כִּי לֹא אֹתְךָ מָאָסוּ כִּי אֹתִי מָאֲסוּ
  choice: sapagkat hindi ikaw ang itinakwil nila, kundi ako ang itinakwil nila
  rationale: Pinananatili ng “hindi… kundi…” ang mariing paghahambing sa Hebreo sa natural na ayos ng Tagalog.
- source_word: מִמְּלֹךְ עֲלֵיהֶם
  choice: bilang hari nila
  rationale: Natural nitong ipinahahayag na ang itinakwil ay ang paghahari ni Yahweh sa kanila, at pinananatili ang personal na diin sa kaniyang pagiging hari. Inilalagay sa talababa ang mas pandiwang anyo ng parirala.
theological_decisions:
- issue: Ang paghahari ng Diyos kaugnay ng kahilingan ng Israel para sa isang taong hari
  choice: Malinaw na ang kahilingan ng bayan ay pagtakwil kay Yahweh bilang hari nila.
  alternative: Ang itinakwil lamang ng bayan ay ang pamumuno ni Samuel, hindi si Yahweh mismo.
  rationale: Tahasang pinaghahambing ng Hebreo si Samuel at si Yahweh at itinuturing ang mas malalim na usapin bilang pagtakwil sa paghahari ng Diyos. Hindi dinaragdagan ng salin ang pahayag ng anumang denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang “tinig ng bayan” bilang malinaw na larawang Hebreo; ginamit ang “bilang hari nila” sa pangunahing teksto para sa likas na daloy, kasama ang mas literal na pandiwang alternatibo sa talababa.
