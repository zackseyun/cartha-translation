source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע שְׁמוּאֵ֔ל אֵ֖ת כָּל דִּבְרֵ֣י הָ/עָ֑ם וַֽ/יְדַבְּרֵ֖/ם בְּ/אָזְנֵ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/021.yaml
  text: Samuel heard all the words of the people[b][a], and he spoke them in the ears of Yahweh.
translation:
  language: tl
  text: Narinig ni Samuel ang lahat ng sinabi ng bayan, at sinabi niya ang mga iyon sa pandinig ni Yahweh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa mga tainga ni Yahweh,” isang idyomang nangangahulugang sa pandinig niya o sa harap niya.
    reason: lexical_alternative
  - marker: b
    text: Ang pangalang Hebreo ay YHWH, na tradisyonal na isinasaling “PANGINOON”; maaari ring baybaying “Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Narinig
  rationale: Tuwirang inilalarawan ng pandiwa ang pagkarinig ni Samuel sa sinabi ng bayan; natural ito sa salaysay at hindi nagdaragdag ng diwang pagsunod.
- source_word: כָּל דִּבְרֵי הָעָם
  choice: ang lahat ng sinabi ng bayan
  rationale: Mas natural sa modernong Tagalog kaysa sa literal na “lahat ng mga salita ng bayan,” habang pinananatili ang kabuuang saklaw ng כָּל at ang diwa ng דִּבְרֵי.
- source_word: וַיְדַבְּרֵם
  choice: at sinabi niya ang mga iyon
  rationale: Ang hulaping panghalip ay tumutukoy sa mga sinabi ng bayan. Pinananatili ng salin ang pagtukoy na iyon nang hindi idinaragdag ang mas tiyak na diwang “iniulat” o “inulit.”
- source_word: בְּאָזְנֵי
  choice: sa pandinig ni
  rationale: Pinananatili nito ang larawang Hebreo ng pagsasalita sa pandinig ng isang tao, ngunit mas likas sa Tagalog kaysa sa literal na “sa mga tainga ni.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ng Diyos sa halip na palitan ng titulong “PANGINOON”; nililinaw sa talababa ang tradisyonal na anyo.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Ginagamit ang nakaugaliang anyo ng pangalan sa Tagalog.
theological_decisions:
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaibang iyon, samantalang ibinibigay sa talababa ang tradisyonal na salin.
- issue: Kahulugan ng idyomang בְּאָזְנֵי יְהוָה
  choice: sa pandinig ni Yahweh
  alternative: sa harap ni Yahweh / kay Yahweh
  rationale: Pinananatili ang Hebreong larawan at ang ideya na binigkas ni Samuel ang mga sinabi ng bayan upang marinig ng Diyos, nang hindi tinutukoy nang higit sa sinasabi ng teksto ang paraan ng pakikipag-usap.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “bayan” para sa kolektibong הָעָם at ang likas na pariralang “lahat ng sinabi” sa halip na ang matigas na literalismong “lahat ng mga salita.” Ang mga marker [a] at [b] ay kapuwa nasa pangunahing teksto.
