base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/008.yaml
  text: According to all the deeds that they have done from the day I brought them up out of Egypt to this day[a], forsaking me and serving other gods[b], so they are also doing to you.
translation:
  language: tl
  text: Gaya ng lahat ng ginawa nila mula noong araw na inilabas ko sila mula sa Ehipto hanggang sa araw na ito[a]—iniwan nila ako at naglingkod sa ibang mga diyos[b]—gayon din ang ginagawa nila sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hanggang ngayon.”
    reason: lexical_alternative
  - marker: b
    text: Ang “naglingkod sa ibang mga diyos” ay maaari ring ipahayag na “sumamba sa ibang mga diyos.” Literal na “maglingkod” ang pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשׂוּ
  choice: Gaya ng lahat ng ginawa nila
  rationale: Pinananatili ang paghahambing na ipinahihiwatig ng כְּ at ang moral na bigat ng kanilang paulit-ulit na mga ginawa, nang hindi dinaragdagan ang kahulugan.
- source_word: מִיּוֹם הַעֲלֹתִי אֹתָם מִמִּצְרַיִם
  choice: mula nang araw na inilabas ko sila sa Ehipto
  rationale: Ang Hiphil ng עלה ay bahagi ng karaniwang pormula tungkol sa Exodo. Ang “inilabas” ang likas at malinaw na katumbas sa modernong Tagalog, samantalang ang literal na “iniahon” ay maaaring magbigay ng maling larawang pisikal.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Malapit ito sa anyo ng Hebreo at malinaw na saklaw ang buong panahon mula sa Exodo hanggang sa kasalukuyang sandali ng pagsasalita.
- source_word: וַיַּעַזְבֻנִי
  choice: iniwan nila ako
  rationale: Tuwirang inilalarawan ang kanilang pagtatakwil at kawalan ng katapatan, nang hindi nagdaragdag ng mas tiyak na teolohikal na paliwanag.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: at naglingkod sa ibang mga diyos
  rationale: Ang “naglingkod” ay nagpapanatili sa literal na diwa ng עבד at, sa konteksto ng mga diyos, natural ding nagpapahiwatig ng pagsamba at katapatan.
- source_word: כֵּן הֵמָּה עֹשִׂים גַּם לָךְ
  choice: gayon din ang ginagawa nila sa iyo
  rationale: Pinananatili ang paghahambing at ang sadyang hindi tahasang tinukoy na bagay na “ginagawa” nila kay Samuel, gaya ng Hebreo.
theological_decisions:
- issue: Ugnayan ng pagtanggi ng Israel kay Samuel at ng kanilang pagtalikod sa Panginoon
  choice: Iniharap ang ginagawa nila kay Samuel bilang pagpapatuloy ng dati nilang asal sa Diyos, ngunit hindi ito pinalawak bilang tahasang “paghihimagsik.”
  alternative: “Naghihimagsik din sila laban sa iyo gaya ng paghihimagsik nila laban sa akin.”
  rationale: Sinasabi ng Hebreo na iniwan nila ang Diyos, naglingkod sa ibang mga diyos, at gayon din ang ginagawa nila kay Samuel. Ang salin ay nagpapanatili sa paghahambing at sa bahagyang di-tiyak na pananalita ng huling parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga gitling upang malinaw na maipakita na ang pag-iwan sa Diyos at paglilingkod sa ibang mga diyos ang nilalaman ng kanilang mga ginawa, habang pinananatili ang mahabang paghahambing ng pangungusap sa Hebreo.
