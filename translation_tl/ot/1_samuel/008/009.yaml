  text: So now[a], listen to their voice; only, you must solemnly warn them and tell them the justice of the king who will reign over them.
translation:
  language: tl
  text: Kaya ngayon, pakinggan mo sila. Ngunit mahigpit mong babalaan sila at ipaalam mo sa kanila ang gawi[a] ng haring maghahari sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “karapatan ng hari,” “kaugalian ng hari,” o “pamamaraan ng hari.” Malawak ang saklaw ng salitang Hebreo na מִשְׁפָּט at maaari itong tumukoy sa legal na karapatan, pamantayan, o nakaugaliang gawain.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע בְּקוֹלָם
  choice: pakinggan mo sila
  rationale: Ang idyoma ay nangangahulugang makinig o tumalima sa isang tao. Likas sa makabagong Tagalog ang “pakinggan mo sila” at hindi nito ipinahihiwatig na sinasang-ayunan ni Samuel ang kahilingan.
- source_word: אַךְ כִּי
  choice: ngunit
  rationale: Nagpapasok ito ng mariing pasubali sa naunang utos. Ang “ngunit” ay malinaw at natural sa Tagalog; ang diin ay higit pang naipakikita ng kasunod na “tiyakin mong.”
- source_word: הָעֵד תָּעִיד
  choice: tiyakin mong taimtim silang babalaan
  rationale: Ang infinitive absolute na kasunod ng pandiwang may iisang ugat ay nagpapatingkad sa kilos. Ipinahahayag ng parirala ang katiyakan, tindi, at pormal na bigat ng babala.
- source_word: בָּהֶם
  choice: silang
  rationale: Sa konstruksyong ito, ang babala ay nakatuon sa kanila at maaari ring may bahid na pagpapatotoo laban sa kanila. Ang “silang babalaan” ang pinakanatural na Tagalog.
- source_word: וְהִגַּדְתָּ לָהֶם
  choice: at ipaalam mo sa kanila
  rationale: Ang Hiphil ng נגד ay nangangahulugang sabihin, ipahayag, o ipabatid. Ang “ipaalam” ay malinaw at angkop sa pormal na tagubilin.
- source_word: מִשְׁפַּט הַמֶּלֶךְ
  choice: ang magiging gawi ng hari
  rationale: Maaaring tumukoy ang מִשְׁפָּט sa pasiya, katarungan, karapatan, pamantayan, o nakaugaliang gawain. Sa konteksto ng kasunod na paglalarawan sa gagawin ng hari, natural na ipinahahayag ng “magiging gawi” ang paraan ng pamamahala nang hindi ipinapalagay na lehitimo sa moral ang lahat ng kanyang aangkinin.
- source_word: אֲשֶׁר יִמְלֹךְ עֲלֵיהֶם
  choice: ng haring maghahari sa kanila
  rationale: Pinananatili ng “maghahari” ang tiyak na maharlikang kahulugan ng מלך, sa halip na ang mas malawak na “mamamahala.”
theological_decisions:
- issue: Kung ang מִשְׁפַּט הַמֶּלֶךְ ay tumutukoy sa lehitimong karapatan ng hari o sa inilalarawang gawi at mga aangkinin niya
  choice: “ang magiging gawi ng hari,” bilang paglalarawan sa paraan ng pagkilos at pamamahala ng magiging hari
  alternative: “ang karapatan ng hari” o “ang tuntunin ng hari”
  rationale: Inilalarawan ng mga sumunod na talata ang mabibigat na kukunin at ipagagawa ng hari. Hindi tahasang nilulutas ng talata kung ang lahat ng ito ay legal o moral na lehitimo, kaya iniiwasan ng salin ang pagpasok ng gayong pasiya habang pinananatili ang babalang tono.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “pakinggan mo sila” sa halip na literal na “pakinggan ang kanilang tinig” upang maging natural, at “taimtim silang babalaan” upang mapanatili ang mariin at pormal na bigat ng Hebreo.
