  text: וַ/יֹּ֕אמֶר זֶ֗ה יִֽהְיֶה֙ מִשְׁפַּ֣ט הַ/מֶּ֔לֶךְ אֲשֶׁ֥ר יִמְלֹ֖ךְ עֲלֵי/כֶ֑ם אֶת בְּנֵי/כֶ֣ם יִקָּ֗ח וְ/שָׂ֥ם ל/וֹ֙ בְּ/מֶרְכַּבְתּ֣/וֹ וּ/בְ/פָרָשָׁ֔י/ו וְ/רָצ֖וּ לִ/פְנֵ֥י מֶרְכַּבְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/011.yaml
  text: 'He said[a], “This will be the custom of the king who will reign over you: he will take your sons and assign them to his chariots and among his horsemen[c][b], and they will run before his chariots.”'
translation:
  language: tl
  text: Sinabi niya, “Ganito ang magiging kalakaran ng haring maghahari sa inyo:[a] kukunin niya ang inyong mga anak na lalaki[b] at itatalaga sila sa kanyang mga karwahe at sa kanyang mga mangangabayo; tatakbo sila sa unahan ng kanyang karwahe.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ganito ang magiging karapatan o tuntunin ng hari.” Ang Hebreong mishpat ay maaaring tumukoy sa nakagawiang kalakaran, legal na karapatan, o pamantayang panghukuman; dito, inilalarawan nito kung paano karaniwang kikilos ang hari sa bayan.
    reason: lexical_alternative
  - marker: b
    text: Tahasang “mga anak ninyong lalaki” sa Hebreo, na angkop sa konteksto ng paglilingkod militar sa hari.
    reason: cultural_note
  - marker: c
    text: Maaari ring “sa unahan ng kanyang mga karwahe.” Isahan ang anyo sa Hebreo ngunit maaari itong unawain bilang indibidwal o kolektibo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: kalakaran
  rationale: Sa kontekstong ito, inilalarawan ni Samuel ang karaniwang paraan ng pakikitungo at pagkilos ng hari, hindi isang hatol. Pinananatili ng “kalakaran” ang posibilidad ng nakagawiang gawain nang hindi ipinahihiwatig na makatarungan o lehitimo iyon.
- source_word: הַמֶּלֶךְ אֲשֶׁר יִמְלֹךְ עֲלֵיכֶם
  choice: ang haring maghahari sa inyo
  rationale: Pinananatili nito ang pandiwang kaugnay ng pagiging hari at ang diwang pamamahala sa bayan.
- source_word: אֶת־בְּנֵיכֶם יִקָּח
  choice: kukunin niya ang inyong mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng Hebreo, na angkop sa konteksto ng sapilitang paglilingkod militar at maharlika.
- source_word: וְשָׂם לוֹ
  choice: at itatalaga sila
  rationale: Ipinahihiwatig ng שׂים na ilalagay o itatalaga sila sa paglilingkod sa hari; natural at malinaw sa Filipino ang “itatalaga.”
- source_word: בְּמֶרְכַּבְתּוֹ
  choice: sa kanyang mga karwahe
  rationale: Bagaman anyong isahan ang Hebreo, maaari itong gamiting kolektibo para sa hukbo ng mga karwahe. Ang maramihan dito ay natural sa Filipino.
- source_word: וּבְפָרָשָׁיו
  choice: sa kanyang mga mangangabayo
  rationale: Ang פָרָשִׁים ay mga mangangabayo o hukbong nakakabayo. Ang “mga mangangabayo” ay malinaw at hindi labis na teknikal.
- source_word: וְרָצוּ לִפְנֵי מֶרְכַּבְתּוֹ
  choice: tatakbo sila sa unahan ng kanyang karwahe
  rationale: Inilalarawan nito ang mga tagatakbong nauuna sa sasakyan ng hari. Pinananatili rito ang isahan ng huling anyong Hebreo, habang kinikilala sa talababa ang posibleng kolektibong pagkaunawa.
theological_decisions:
- issue: Kung ang מִשְׁפַּט ay nagbibigay ng legal o moral na karapatan sa hari
  choice: Isinalin bilang “kalakaran,” na naglalarawan sa gagawin ng hari
  alternative: “karapatan ng hari” o “batas ng hari”
  rationale: Babala ang konteksto tungkol sa magiging asal ng hari. Ang “kalakaran” ay hindi tahimik na nagpapasiya na lehitimo o makatarungan ang mga gagawin niya, ngunit ang ibang legal na diwa ng salita ay pinananatili sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kalakaran” upang mapanatili ang babalang tono at ang leksikal na tensiyon ng מִשְׁפַּט; iniwasan ang labis na pormal na “matuwid na kahatulan” at ang posibleng mapanlinlang na “karapatan” sa pangunahing teksto.
