base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/006.yaml
  text: But the matter was displeasing in Samuel’s eyes when they said[b][a], “Give us a king to judge us.” And Samuel prayed to Yahweh.
translation:
  language: tl
  text: Ngunit masama sa paningin ni Samuel ang bagay na ito nang sabihin nila, “Bigyan mo kami ng isang hari upang humatol sa amin[a].” At nanalangin si Samuel kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “humatol sa amin” ay maaari ring mangahulugang “mamahala sa amin” o “maghari sa amin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: masama
  rationale: Pinananatili nito ang malakas na negatibo at moral na pagtataya ng Hebreo, hindi lamang ang damdaming hindi nasiyahan.
- source_word: הַדָּבָר
  choice: ang bagay na ito
  rationale: Malawak ang saklaw ng דָּבָר; likas sa Tagalog ang pariralang ito at hindi nito agad nililimitahan ang tinutukoy sa ‘kahilingan.’
- source_word: בְּעֵינֵי שְׁמוּאֵל
  choice: sa paningin ni Samuel
  rationale: Pinananatili ang Hebreong idyoma at malinaw na ang pagtataya ay mula sa pananaw ni Samuel.
- source_word: כַּאֲשֶׁר אָמְרוּ
  choice: nang sabihin nila
  rationale: Natural na ipinahahayag ang temporal na ugnayan nang hindi labis na iginigiit ang sanhi.
- source_word: תְּנָה לָּנוּ
  choice: Bigyan mo kami
  rationale: Tuwiran at natural na katumbas ng pautos na anyo ng נתן.
- source_word: מֶלֶךְ
  choice: isang hari
  rationale: Karaniwang katumbas ng מֶלֶךְ sa kontekstong ito.
- source_word: לְשָׁפְטֵנוּ
  choice: upang humatol sa amin
  rationale: Pinananatili ang leksikal na kaugnayan sa mga hukom at sa tungkulin ni Samuel, habang inilalahad sa talababa ang mas malawak na diwang pamamahala.
- source_word: וַיִּתְפַּלֵּל
  choice: nanalangin
  rationale: Natural at karaniwang katumbas ng hitpael ng פלל; hindi nito ipinapasok ang mas tiyak na ideya ng pamamagitan.
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Natural sa Tagalog ang ‘nanalangin kay,’ at tuwirang inililipat ang pangalang tipan na יהוה bilang Yahweh.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang pinananatili ang natatanging banal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Lakas ng negatibong pagtataya sa וַיֵּרַע
  choice: masama sa paningin ni Samuel
  alternative: hindi nakalugod kay Samuel; ikinagalit ni Samuel
  rationale: Pinananatili ang moral at evaluative na lakas ng Hebreo at ang pananaw ni Samuel, sa halip na gawin lamang itong ulat ng damdamin.
- issue: Saklaw ng לְשָׁפְטֵנוּ
  choice: upang humatol sa amin
  alternative: upang mamahala sa amin; upang maghari sa amin
  rationale: Hindi nilulutas nang palihim ang lawak ng שׁפט; ang pangunahing salin ay nagpapanatili sa ‘humatol,’ at ang mas malawak na diwang pampamahalaan ay nasa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong idyomang ‘masama sa paningin’ dahil malinaw ito sa Tagalog at mahalaga ang lakas ng orihinal na pagtataya. Ang bawat talababa ay may katugmang marker sa teksto.
