  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל שְׁמוּאֵל֙ שְׁמַ֣ע בְּ/קוֹלָ֔/ם וְ/הִמְלַכְתָּ֥ לָ/הֶ֖ם מֶ֑לֶךְ וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל אַנְשֵׁ֣י יִשְׂרָאֵ֔ל לְכ֖וּ אִ֥ישׁ לְ/עִירֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/022.yaml
  text: And Yahweh said to Samuel[a], “Listen to their voice and make a king for them.” Then Samuel said to the men of Israel, “Go[b], each man to his city.”
translation:
  language: tl
  text: At sinabi ni Yahweh kay Samuel, “Pakinggan mo sila[a] at magluklok ka ng hari para sa kanila.” Pagkatapos, sinabi ni Samuel sa mga lalaki ng Israel[b], “Umuwi kayo, bawat lalaki sa sarili niyang lungsod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pakinggan mo ang kanilang tinig.” Ang idyomang Hebreo ay maaari ring mangahulugang dinggin o sundin ang kanilang hinihiling.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga lalaki ng Israel” ay maaaring tumukoy bilang kinatawan sa nagkakatipong mga Israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: שְׁמַע בְּקוֹלָם
  choice: Pakinggan mo sila
  rationale: Likas ito sa makabagong Tagalog at naipahihiwatig sa konteksto ang pagsang-ayon sa kanilang hinihiling; inilalahad sa talababa ang mas literal na idyomang Hebreo.
- source_word: וְהִמְלַכְתָּ לָהֶם מֶלֶךְ
  choice: magluklok ka ng hari para sa kanila
  rationale: Ang anyong Hiphil ng מלך ay tumutukoy sa paglalagay o pagtatalaga sa isang tao bilang hari. Ang “magluklok” ay natural at tiyak sa kontekstong maharlika.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: mga lalaki ng Israel
  rationale: Pinananatili ang tahasang panlalaking anyo ng Hebreo, habang kinikilala sa talababa na maaari nitong katawanin ang nagkakatipong mga Israelita.
- source_word: לְכוּ
  choice: Umuwi kayo
  rationale: Bagaman literal na “humayo kayo,” sa pormulang אִישׁ לְעִירוֹ ang utos ay pagpapauwi sa bawat isa; malinaw at natural ang “Umuwi kayo.”
- source_word: אִישׁ לְעִירוֹ
  choice: bawat lalaki sa sarili niyang lungsod
  rationale: Pinananatili ang distributibong אִישׁ at ang panlalaking pagtukoy. Ang עִיר ay maaaring lungsod o bayan; “lungsod” ang tuwirang katumbas dito.
theological_decisions:
- issue: Paglalarawan sa tugon ni Yahweh sa kahilingan ng bayan
  choice: Pakinggan mo sila
  alternative: Sundin mo ang tinig nila
  rationale: Hindi tahasang nilulutas kung ang utos ay simpleng pakikinig o pagsang-ayon sa kahilingan. Pinananatili sa pangunahing teksto ang mas malawak na kahulugan at ipinapaliwanag ang idyoma sa talababa.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Direktang ginagamit ng tekstong Hebreo ang banal na pangalan, kaya pinananatili ito bilang pangalan sa salin.
- issue: Panlalaking wika sa אַנְשֵׁי יִשְׂרָאֵל at אִישׁ
  choice: mga lalaki ng Israel; bawat lalaki
  alternative: mga Israelita; bawat isa
  rationale: Pinananatili ang tahasang panlalaking anyo ng pinagmulan nang hindi itinatangging maaaring kumatawan ang kapulungan sa mas malawak na Israel.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “magluklok” para sa paglalagay ng hari at “umuwi kayo” para sa natural na diwa ng pormulang pagpapauwi, habang pinananatili sa talababa ang mahahalagang idyoma at posibleng saklaw ng Hebreo.
