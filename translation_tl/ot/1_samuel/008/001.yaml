    rationale: Ang לְיִשְׂרָאֵל ay maaaring “para sa Israel” o tumukoy sa saklaw ng tungkulin/awtoridad. Mas malinaw na pangunahing salin ang “para sa Israel,” habang pinananatili ng talababa ang ibang posibilidad.
