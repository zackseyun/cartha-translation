translation:
  language: tl
  text: Nang tumanda si Samuel, itinalaga niya ang kanyang mga anak na lalaki bilang mga hukom para sa Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “itinalaga niya ang kanyang mga anak na lalaki bilang mga hukom na mamamahala sa Israel.” Literal na “inilagay” ang pandiwang Hebreo; ang pang-ukol bago ang “Israel” ay maaaring mangahulugang “para sa” o tumukoy sa saklaw ng kanilang tungkulin o awtoridad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Ang pormulang pasalaysay ay nagpapakilala ng kalagayang temporal. Likas sa makabagong Tagalog ang “Nang” at naihahatid nito ang diwa nang hindi matigas na isinasalin ang idyomang “at nangyari.”
- source_word: זָקֵן
  choice: tumanda
  rationale: Ang pandiwa ay tumutukoy sa pagiging matanda o pagtanda, hindi lamang sa isang nakapirming kalagayan. Pinananatili ng “tumanda” ang aspektong ito.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Bibliyang Tagalog.
- source_word: וַיָּשֶׂם
  choice: itinalaga
  rationale: Bagaman literal na nangangahulugang “inilagay” ang pandiwa, tumutukoy ito rito sa pagtatalaga sa isang tungkulin. Likas at malinaw sa Tagalog ang “itinalaga.”
- source_word: אֶת בָּנָיו
  choice: ang kanyang mga anak
  rationale: Sa konteksto, ang tinutukoy ay mga anak na lalaki ni Samuel. Sa karaniwang Tagalog, ang “mga anak” ay natural at hindi nangangahulugang binago ang kasarian ng mga tinutukoy.
- source_word: שֹׁפְטִים
  choice: mga hukom
  rationale: Pinananatili ng “mga hukom” ang kilalang tungkuling panghukuman at pamamahala sa konteksto ng Samuel nang hindi ito labis na ipinapaliwanag.
- source_word: לְיִשְׂרָאֵל
  choice: sa Israel
  rationale: Maaaring ipahiwatig ng pang-ukol ang paglilingkod para sa Israel o ang saklaw ng kanilang awtoridad. Natural sa Tagalog ang “sa Israel” at hindi nito labis na nilulutas ang tunay na kalabuan.
