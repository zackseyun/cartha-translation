translation_notes:
  register: Makabago, payak, at marangal na Tagalog. Ginamit ang “itinalaga” para sa malinaw na diwa ng paghirang sa tungkulin, habang pinanatili ng “sa Israel” at ng talababa ang kalabuan ng pang-ukol sa Hebreo.
