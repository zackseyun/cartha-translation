  source_fidelity: Kailangang tahasang tukuyin na mga anak na lalaki ang tinutukoy ng Hebreong בָּנָיו. Ang “mga anak” ay mas malawak at hindi pinananatili ang espesipikong kasarian ng pinagmulan. Ang “itinalaga ... bilang mga hukom” ay tumpak para sa pandiwang ‘set/appoint’ sa kontekstong ito.
  naturalness: Natural at marangal sa makabagong Tagalog ang “Nang tumanda si Samuel, itinalaga niya ang kanyang mga anak na lalaki bilang mga hukom para sa Israel.”
  terminology: Ang “Samuel,” “itinalaga,” at “mga hukom” ay angkop at pare-pareho sa karaniwang bokabularyong Biblikal sa Tagalog. Ginamit ang “para sa Israel” bilang pangunahing salin upang hindi ipakahulugang ang mga hukom ay basta nasa loob lamang ng Israel; inilalahad ng talababa ang posibilidad na saklaw ng kanilang awtoridad ang Israel.
