  yaml_path: translation/ot/1_samuel/008/013.yaml
  text: He will take your daughters to be perfumers[a], cooks, and bakers.
translation:
  language: tl
  text: Kukunin niya ang inyong mga anak na babae upang gawing mga tagagawa ng pabango[a], mga tagapagluto, at mga panadero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tagagawa ng mababangong pamahid.” Malawak ang saklaw ng salitang Hebreo at maaaring tumukoy sa mga naghahanda ng mababangong halo, kabilang ang pabango o pamahid.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: '[pananda ng tuwirang layon; hindi isinalin nang hiwalay]'
  rationale: Minamarkahan nito ang “inyong mga anak na babae” bilang tuwirang layon ng pandiwang “kukunin.” Walang kailangang hiwalay na katumbas sa natural na Tagalog.
- source_word: בְּנוֹתֵיכֶם
  choice: ang inyong mga anak na babae
  rationale: Ang maramihang anyong konstruktibo ng “anak na babae,” na may hulaping ikalawang panauhang maramihan, ay pangunahing tumutukoy sa “inyong mga anak na babae.”
- source_word: יִקָּח
  choice: kukunin niya
  rationale: Ang Qal imperfect na ikatlong panauhang panlalaki at isahan ay may puwersang panghinaharap sa babala ni Samuel. Pinananatili ng “kukunin” ang diwang mapilit na pagkuha para sa paglilingkod sa hari.
- source_word: לְרַקָּחוֹת
  choice: upang gawing mga tagagawa ng pabango
  rationale: Tumutukoy ang terminong pambabae at maramihan sa mga naghahanda ng mababangong halo, gaya ng pabango o pamahid. Malinaw at natural sa modernong Tagalog ang “mga tagagawa ng pabango,” habang inilalagay sa talababa ang mas malawak na saklaw nito.
- source_word: וּלְטַבָּחוֹת
  choice: mga tagapagluto
  rationale: Ang pangngalang pambabae at maramihan ay tumutukoy sa mga babaeng naghahanda ng pagkain. Hindi na kailangang ulitin ang kasarian sapagkat malinaw na mga anak na babae ang tinutukoy.
- source_word: וּלְאֹפוֹת
  choice: mga panadero
  rationale: Mula ito sa pandiwang “maghurno” at ginagamit bilang katawagan sa mga babaeng gumagawa ng tinapay o iba pang niluluto sa hurno. Ang “mga panadero” ang likas at kasalukuyang katawagang panghanapbuhay sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “inyong” upang mapanatili ang maramihang kausap at ang bahagyang pormal na himig ng babala. Ang “upang gawing” ay likas na naghahayag ng sapilitang pagtatalaga sa mga tungkulin sa palasyo.
