  source_fidelity: 'Tumpak ang pagsasalin sa Hebreo: ang hari ang paksa ng panghinaharap na “kukunin,” ang “inyong mga anak na babae” ang layon, at ang tatlong tungkuling pambabae ay maayos na naipahayag. Ang “upang gawing” ay angkop na nagpapakita ng pagtatalaga/pagkuha para sa mga gawaing ito nang hindi nagdaragdag ng diwa.'
