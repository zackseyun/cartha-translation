  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/זְעַקְתֶּם֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִ/לִּ/פְנֵ֣י מַלְכְּ/כֶ֔ם אֲשֶׁ֥ר בְּחַרְתֶּ֖ם לָ/כֶ֑ם וְ/לֹֽא יַעֲנֶ֧ה יְהוָ֛ה אֶתְ/כֶ֖ם בַּ/יּ֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/018.yaml
  text: And in that day you will cry out because of your king, whom you have chosen for yourselves, but Yahweh will not answer you in that day.
translation:
  language: tl
  text: Sa araw na iyon, dadaing kayo dahil sa inyong hari na pinili ninyo para sa inyong mga sarili, ngunit hindi kayo sasagutin ni Yahweh sa araw na iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּזְעַקְתֶּם
  choice: dadaing kayo
  rationale: Ang זעק ay masidhing pagdaing sa kagipitan, kadalasa'y may pahiwatig ng paghingi ng tulong. Likas sa Tagalog ang “dadaing” at hindi nito labis na tinutukoy kung kanino nakatuon ang daing.
- source_word: בַּיּוֹם הַהוּא
  choice: sa araw na iyon
  rationale: Karaniwan at marangal na katumbas ng Hebreong panandang temporal; pinanatili rin ang pag-uulit nito sa talata.
- source_word: מִלִּפְנֵי
  choice: dahil sa
  rationale: 'Bagaman literal na “mula sa harapan/presensiya ng,” sanhi ang ipinahahayag nito sa konteksto: ang hari ang dahilan ng kanilang pagdaing.'
- source_word: מַלְכְּכֶם
  choice: inyong hari
  rationale: Tuwirang salin ng pangngalang may ikalawang panauhang pangmaramihang hulapi.
- source_word: אֲשֶׁר בְּחַרְתֶּם לָכֶם
  choice: na pinili ninyo para sa inyong sarili
  rationale: Pinananatili ang pananagutan ng Israel sa pagpili at ang reflexive na diin ng לָכֶם.
- source_word: וְלֹא יַעֲנֶה
  choice: ngunit hindi ... sasagutin
  rationale: Ang “ngunit” ay natural na naghahayag ng matinding pagsalungat sa pagitan ng pagdaing ng bayan at ng hindi pagtugon ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֶתְכֶם
  choice: kayo
  rationale: Sa Tagalog, ang likas na anyo ng tuwirang layon sa pandiwang “sasagutin” ay “kayo.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; PANGINOON
  rationale: Tahasang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng hindi pagsagot ni Yahweh
  choice: hindi kayo sasagutin ... sa araw na iyon
  alternative: hinding-hindi kayo sasagutin
  rationale: Nililimitahan ng tekstong Hebreo ang pahayag sa “araw na iyon”; hindi ito pinalawak tungo sa ganap o walang-hanggang pagtanggi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dadaing” upang ihatid ang tindi ng זעק nang hindi labis na ipinapaliwanag, at pinanatili ang solemne at mariing pag-uulit ng “sa araw na iyon.”
