  naturalness: Malinaw, makabago, at angkop ang marangal na rehistro. Gayunman, ang “para sa inyong sarili” ay maaaring basahin bilang iisang “sarili” sa halip na tahasang pangmaramihang pagbabalik sa mga kausap.
  terminology: Ang “Yahweh” ay wastong pagpapanatili ng Tetragrammaton ayon sa ibinigay na patakaran. Ang “dadaing” at “sasagutin” ay natural at sapat na katumbas ng mga pandiwang Hebreo.
