translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong Israel at “haring mamamahala sa amin” upang natural na ipahayag ang awtoridad ng hari. Pinanatili sa pangunahing teksto ang diwa ng pakikinig at inilagay sa talababa ang mas tahasang kahulugang pagsunod.
