base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/019.yaml
  text: But the people refused to listen to the voice of Samuel[a], and they said, “No, but there shall be a king over us.”
translation:
  language: tl
  text: Ngunit tumanggi ang bayan na makinig kay Samuel[a]. Sinabi nila, “Hindi! Magkakaroon kami ng hari na mamamahala sa amin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumangging sumunod kay Samuel.” Ang idyomang Hebreo ay literal na “makinig sa tinig ni Samuel” at maaaring mangahulugang dinggin o sundin siya, hindi lamang marinig ang kanyang sinabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  choice: tumanggi
  rationale: Tuwirang ipinapahayag ang aktibong pagtanggi o ayaw ng bayan, ayon sa pandiwang מאן.
- source_word: הָעָם
  choice: ang bayan
  rationale: Tumutukoy ito sa sambayanang Israel bilang isang pangkat; natural at marangal sa salaysay ang “bayan.”
- source_word: לִשְׁמֹעַ בְּקוֹל שְׁמוּאֵל
  choice: na makinig sa sinabi ni Samuel
  rationale: Ang idyomang Hebreo ay literal na “makinig sa tinig ni Samuel,” ngunit sa konteksto ay nangangahulugang pakinggan, sundin, o dinggin ang kanyang babala. Pinananatili ng “makinig” ang pangunahing larawan habang natural sa Filipino ang “sa sinabi ni Samuel.”
- source_word: וַיֹּאמְרוּ
  choice: Sinabi nila
  rationale: Karaniwang pandiwa ng pagsasalita ang אמר; malinaw at natural ang ayos na ito sa makabagong Filipino.
- source_word: לֹא
  choice: Hindi!
  rationale: Ang nakahiwalay na pagtanggi ay mariin; ipinahihiwatig ng tandang padamdam ang lakas nito nang hindi nagdaragdag ng kahulugan.
- source_word: כִּי אִם
  choice: Dapat
  rationale: Pagkatapos ng mariing pagtanggi, ipinakikilala ng parirala ang iginigiit na kabaligtaran. Sa Filipino, natural na naihahatid ng “Dapat” ang mariing paggiit kaysa sa alanganing literal na “kundi.”
- source_word: מֶלֶךְ יִהְיֶה עָלֵינוּ
  choice: kaming magkaroon ng haring mamamahala sa amin
  rationale: Ipinapahayag nito ang matatag na kahilingan na magkaroon sila ng hari sa ibabaw nila. Ang “mamamahala sa amin” ay natural na katumbas ng עָלֵינוּ sa konteksto ng paghahari, hindi lamang pisikal na pagiging “nasa ibabaw.”
