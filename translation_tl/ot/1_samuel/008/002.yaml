base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/002.yaml
  text: The name of his firstborn was Joel, and the name of his second was Abijah; they were judges in Beersheba.
translation:
  language: tl
  text: Ang pangalan ng kaniyang panganay ay Joel, at ang pangalan ng kaniyang ikalawa ay Abias; sila ay mga hukom sa Beer-seba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי שֶׁם
  choice: Ang pangalan ... ay
  rationale: Sa pormulang ito ng pagbibigay ng pangalan, likas sa modernong Tagalog ang payak na pangungusap na may panandang “ay,” sa halip na isalin ang pandiwa bilang hiwalay na pangyayari.
- source_word: בְּנוֹ הַבְּכוֹר
  choice: kaniyang panganay
  rationale: Tiyak na tumutukoy ang בְּנוֹ sa anak na lalaki ni Samuel, ngunit sapat at natural sa konteksto ang “kaniyang panganay”; pinananatili rin nito ang lapit sa anyo ng Hebreo.
- source_word: יוֹאֵל
  choice: Joel
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: מִשְׁנֵהוּ
  choice: kaniyang ikalawa
  rationale: Ipinapahayag nito ang ikalawa sa pagkakasunod-sunod, habang nauunawaan mula sa paralelismo na ikalawang anak na lalaki ang tinutukoy.
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: שֹׁפְטִים
  choice: naglingkod silang mga hukom
  rationale: Ang panlalaking pangmaramihang participle ay nagsasaad ng patuloy na tungkulin ng dalawang anak; malinaw at natural itong ipinahahayag ng “naglingkod silang mga hukom.”
- source_word: בִּבְאֵר שָׁבַע
  choice: sa Beer-seba
  rationale: Ang “sa” ang likas na pananda ng lokasyon sa Tagalog, at “Beer-seba” ang malinaw na anyong Filipino ng pangalan ng lugar.
