  register: Modernong Filipino Tagalog na payak, marangal, at angkop sa publikong pagbasa. Pinanatili ang paralelismong “ang pangalan ... at ang pangalan ...” ng Hebreo nang hindi nagdaragdag ng paliwanag na wala sa talata.
