  to: Maaga silang bumangon. Nang magbukang-liwayway,[a] tinawag ni Samuel si Saul sa bubungan at sinabi, “Bumangon ka, at papaalisin na kita.”[b] Kaya bumangon si Saul, at silang dalawa—siya at si Samuel—ay lumabas.
