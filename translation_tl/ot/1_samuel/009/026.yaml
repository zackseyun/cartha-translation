base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/026.yaml
  text: They rose early[a], and when the dawn was breaking, Samuel called to Saul on the roof, saying, “Get up, and I will send you on your way.” So Saul got up, and the two of them, he and Samuel[b], went outside.
translation:
  language: tl
  text: Maaga silang bumangon. Nang magbukang-liwayway,[a] tinawag ni Samuel si Saul sa bubungan at sinabi, “Bumangon ka, at papaalisin na kita.”[b] Kaya bumangon si Saul, at silang dalawa—siya at si Samuel—ay lumabas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na pananalita, “sa pagsikat ng bukang-liwayway.”
    reason: lexical_alternative
  - marker: b
    text: O “at pahihintulutan na kitang umalis” o “at ihahatid na kita sa pag-alis.” Ang Hebreo ay maaaring mangahulugang magpaalis o magbigay-paalam sa pag-alis ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: Maaga silang bumangon
  rationale: Ang Hiphil ng שׁכם ay karaniwang tumutukoy sa maagang pagbangon o pagsisimula. Natural ito sa modernong Tagalog at pinananatili ang diin sa oras.
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: Nang magbukang-liwayway
  rationale: Idyomatikong katumbas ito ng literal na ‘sa pagsikat/pag-ahon ng bukang-liwayway,’ at malinaw na tumutukoy sa pagsisimula ng madaling-araw.
- source_word: הַגָּג
  choice: sa bubungan
  rationale: Tumutukoy ito sa patag na bubungan ng bahay na ginagamit na matutuluyan. Ang parirala ay pinanatiling maikli at malapit sa bahagyang masinsing kayarian ng Hebreo.
- source_word: קוּמָה
  choice: Bumangon ka
  rationale: Direkta at likas na utos ito sa Tagalog para sa pagbangon mula sa pagkakahiga o pagkakaupo.
- source_word: וַאֲשַׁלְּחֶךָּ
  choice: ihahatid na kita sa iyong paglalakbay
  rationale: Sa kontekstong ito, ang שׁלח ay nangangahulugang paalisin o ihatid sa pag-alis. Ang salin ay nagpapahayag ng magalang na pagpapaalis nang hindi nagmumungkahi ng marahas na pagtataboy.
- source_word: וַיֵּצְאוּ ... הַחוּצָה
  choice: ay lumabas
  rationale: Sapat na ipinahahayag ng ‘lumabas’ ang pandiwa at direksiyonal na הַחוּצָה nang hindi nagdaragdag ng tiyak na destinasyon gaya ng lansangan.
- source_word: שְׁנֵיהֶם הוּא וּשְׁמוּאֵל
  choice: silang dalawa—siya at si Samuel
  rationale: Pinananatili nito ang mariing apposisyon ng Hebreo at ang panghalip na likas na tumutukoy pabalik kay Saul.
