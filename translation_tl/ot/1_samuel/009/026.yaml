  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magbukang-liwayway” bilang pamilyar ngunit dignidad na pananalita; iniwasan ang sobrang pormal na “bumangon nang maaga sila” at ang kolokyal na “aalis ka na.”
