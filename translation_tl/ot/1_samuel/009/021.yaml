base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/021.yaml
  text: Saul answered and said[a], “Am I not a Benjaminite, from the smallest of the tribes of Israel? And is not my clan the least of all the clans of the tribe of Benjamin? So why have you spoken to me in this way?”
translation:
  language: tl
  text: Sumagot si Saul, “Hindi ba ako ay isang Benjaminita, mula sa isa sa pinakamaliit na lipi ng Israel? Hindi ba ang angkan ko ang pinakamababa sa lahat ng angkan ng lipi ni Benjamin? Kaya bakit mo ako kinausap nang ganito?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Bakit mo ako kinausap tungkol sa ganitong bagay?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Hindi baʼt ...?
  rationale: Likas na paraang Filipino upang ihayag ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: בֶן־יְמִינִי
  choice: isang Benjaminita
  rationale: Tumutukoy sa pagiging kabilang ni Saul sa lipi ni Benjamin; malinaw at maikli ang katawagang etniko sa Filipino.
- source_word: מִקַּטַנֵּי שִׁבְטֵי יִשְׂרָאֵל
  choice: mula sa pinakamaliit sa mga lipi ng Israel
  rationale: Pinananatili ang larawan ng kaliitan na maaari ring magpahiwatig ng mababang katayuan, nang hindi nilulutas ang saklaw nang higit sa Hebreo.
- source_word: וּמִשְׁפַּחְתִּי
  choice: ang angkan ko
  rationale: Ang מִשְׁפָּחָה rito ay yunit ng pagkakamag-anak sa loob ng lipi, mas malawak kaysa sambahayan o nuklear na pamilya.
- source_word: הַצְּעִרָה
  choice: ang pinakamababa
  rationale: Ipinahahayag ang posibleng diwa ng mababang ranggo o kawalang-halaga at iniiwasan ang alanganing pag-uulit ng “pinakamaliit.”
- source_word: מִכָּל מִשְׁפְּחוֹת שִׁבְטֵי בִנְיָמִן
  choice: sa lahat ng mga angkan ng lipi ni Benjamin
  rationale: Ipinakikita ang paghahambing sa mga angkan sa loob ng Benjamin; ginawang isahan ang “lipi” ayon sa malinaw na konteksto.
- source_word: וְלָמָּה
  choice: Kaya bakit
  rationale: Natural na ipinahahayag ang inferensiya mula sa pagpapakumbaba ni Saul tungo sa kaniyang tanong.
- source_word: דִּבַּרְתָּ אֵלַי
  choice: ninyo ako kinausap
  rationale: Magalang at natural na modernong Filipino para sa pagsasalita ni Saul kay Samuel.
- source_word: כַּדָּבָר הַזֶּה
  choice: nang ganito
  rationale: Pinananatili ang saklaw na maaaring tumukoy sa paraan o nilalaman ng sinabi ni Samuel.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang magalang na “ninyo” dahil kausap ni Saul si Samuel. Hindi isinama ang paulit-ulit na Hebreong pormulang “sumagot at sinabi” sapagkat sapat at natural sa Filipino ang “sumagot.”
