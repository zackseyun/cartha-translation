  to: Sumagot si Saul, “Hindi ba ako ay isang Benjaminita, mula sa isa sa pinakamaliit na lipi ng Israel? Hindi ba ang angkan ko ang pinakamababa sa lahat ng angkan ng lipi ni Benjamin? Kaya bakit mo ako kinausap nang ganito?”[a]
