translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “nito” upang malinaw na si Saul ang tinutukoy na may tagapaglingkod. Ang dash sa huling sugnay ay nagpapanatili sa biglang dagdag na impormasyon ng Hebreo habang ginagawang natural ang daloy.
