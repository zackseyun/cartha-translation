  text: וַ/יִּקַּ֤ח שְׁמוּאֵל֙ אֶת שָׁא֣וּל וְ/אֶֽת נַעֲר֔/וֹ וַ/יְבִיאֵ֖/ם לִשְׁכָּ֑תָ/ה וַ/יִּתֵּ֨ן לָ/הֶ֤ם מָקוֹם֙ בְּ/רֹ֣אשׁ הַ/קְּרוּאִ֔ים וְ/הֵ֖מָּה כִּ/שְׁלֹשִׁ֥ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/022.yaml
  text: Then Samuel took Saul and his young man and brought them into the hall[a], and gave them a place at the head of those who had been invited[c][b]; and they were about thirty men.
translation:
  language: tl
  text: Pagkatapos, isinama ni Samuel si Saul at ang tagapaglingkod nito[a] at dinala sila sa bulwagan[b]. Binigyan niya sila ng lugar sa unahan ng mga inanyayahan—mga tatlumpung lalaki ang mga ito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kabataang kasama” o “tagapaglingkod na kasama.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “silid.” Ang salitang Hebreo ay maaaring tumukoy sa isang silid o bulwagan; malamang na mas malaking lugar para sa handaan ang tinutukoy rito.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “at sila ay mga tatlumpung lalaki.” Malamang na tumutukoy ito sa mga inanyayahang naroon.
    reason: referent_ambiguity
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: ang tagapaglingkod nito
  rationale: Sa konteksto, ang נַעַר ay ang nakababatang tauhang kasama ni Saul. Ang “tagapaglingkod” ay natural sa modernong Tagalog at hindi nangangahulugang alipin; nililinaw ng talababa ang iba pang posibleng diwa.
- source_word: לִשְׁכָּתָה
  choice: sa bulwagan
  rationale: Ang לִשְׁכָּה ay maaaring silid o bulwagan. Dahil handaan ito na may humigit-kumulang tatlumpung panauhin, ang “bulwagan” ang pinakaangkop sa konteksto.
- source_word: מָקוֹם
  choice: lugar
  rationale: Pinananatili ng “lugar” ang payak na kahulugan ng מָקוֹם habang natural na nagpapahiwatig ng puwesto sa handaan.
- source_word: בְּרֹאשׁ
  choice: sa unahan
  rationale: Ipinahihiwatig ng idyoma ang pangunahing puwesto o marangal na lugar. Natural sa Tagalog ang “sa unahan” nang hindi labis na ipinapaliwanag ang ranggo.
- source_word: הַקְּרוּאִים
  choice: mga inanyayahan
  rationale: Sa konteksto ng handaan, ang pasibong participle ng קרא ay tumutukoy sa mga tinawag o inanyayahang panauhin.
- source_word: וְהֵמָּה כִּשְׁלֹשִׁים אִישׁ
  choice: mga tatlumpung lalaki ang mga ito
  rationale: Malapit ito sa kayarian ng Hebreo at pinananatiling lantad na malamang na ang tinutukoy ng panghalip ay ang mga inanyayahan. Ang “lalaki” ay tumutugma sa אִישׁ.
- source_word: וַיִּקַּח
  choice: isinama
  rationale: Bagaman literal na “kinuha,” sa salaysay ay mas natural na ipinahahayag ng “isinama” ang pag-akay ni Samuel kina Saul at sa kasama nito.
- source_word: וַיְבִיאֵם
  choice: dinala sila
  rationale: Tuwirang ipinapahayag nito ang causative na diwa ng בוא at ang pagpasok nila sa tinukoy na lugar.
