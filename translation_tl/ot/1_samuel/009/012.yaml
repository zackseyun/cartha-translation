    reason: cultural_note
  revision_rationale: Pinalitan ang “sambahan sa mataas na lugar” ng “mataas na lugar” upang mapanatili ang teknikal at hindi paunang mapanghatol na termino ng Hebreo. Pinalitan ang malawak na “handog” ng “hain,” at pinakinis ang pagkakaugnay ng mga sugnay habang pinananatili ang pagdating ni Samuel, ang pagkaapurahan, at ang hain sa araw na iyon.
