  text: וַ/תַּעֲנֶ֧ינָה אוֹתָ֛/ם וַ/תֹּאמַ֥רְנָה יֵּ֖שׁ הִנֵּ֣ה לְ/פָנֶ֑י/ךָ מַהֵ֣ר עַתָּ֗ה כִּ֤י הַ/יּוֹם֙ בָּ֣א לָ/עִ֔יר כִּ֣י זֶ֧בַח הַ/יּ֛וֹם לָ/עָ֖ם בַּ/בָּמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/012.yaml
  text: They answered them and said[a], “Yes, look—he is just ahead of you. Hurry now, because he came to the city today[b], because today there is a sacrifice for the people at the high place.”
translation:
  language: tl
  text: Sumagot sila sa kanila, “Oo, naroon siya sa unahan ninyo. Magmadali kayo ngayon, sapagkat dumating siya sa lungsod ngayong araw dahil may hain para sa mga tao ngayon sa mataas na lugar.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mataas na lugar” ay isang lokal na pook ng pagsamba at paghahandog; karaniwan itong tumutukoy sa isang pook na nasa mataas na bahagi ng lupain.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעֲנֶינָה אוֹתָם וַתֹּאמַרְנָה
  choice: Sumagot sila sa kanila
  rationale: Ang dalawang pambabaeng anyo ay tumutukoy sa mga dalagang sumasagot. Hindi na inuulit ang literal na “sumagot at sinabi” sapagkat di-likas iyon sa makabagong Tagalog; naihahatid ng “sumagot” ang buong tungkulin sa salaysay.
- source_word: יֵשׁ הִנֵּה
  choice: Oo. Naroon siya
  rationale: Sa sagot sa naunang tanong, ang יֵשׁ ay nagsisilbing pagpapatibay na “Oo,” at ang הִנֵּה ay nagtuturo at tumatawag-pansin. Ang “Naroon siya” ay natural na paraan upang pagsamahin ang deiktikong diwa nang hindi gumagamit ng makalumang pananalita.
- source_word: לְפָנֶיךָ
  choice: sa unahan ninyo
  rationale: Literal itong “sa harap mo.” Sa konteksto ng paghahanap at paglalakbay, ang “sa unahan ninyo” ay malinaw na panandang pook; hindi idinagdag ang “malapit lang,” na hindi tahasang nasa Hebreo.
- source_word: מַהֵר עַתָּה
  choice: Magmadali kayo ngayon
  rationale: Pinananatili ang pautos at ang temporal na diin. Ginawang maramihan ang panghalip ayon sa kausap na pangkat sa konteksto, bagaman isahan ang anyong Hebreo na nakatuon kay Saul.
- source_word: כִּי הַיּוֹם בָּא לָעִיר
  choice: sapagkat dumating siya sa lungsod ngayong araw
  rationale: Ang perpektong בָּא ay tumutukoy sa pagdating ni Samuel sa araw ding iyon. Natural sa Tagalog ang payak na “dumating,” at pinananatili ang paliwanag sa pagmamadali.
- source_word: זֶבַח הַיּוֹם לָעָם
  choice: may handog para sa mga tao ngayon
  rationale: Ang זֶבַח ay hain o handog na iniaalay; pinili ang “handog” bilang natural at dignified na terminong Tagalog. Hindi tahasang idinagdag ang piging, bagaman maaaring may kasamang kainan ang ganitong paghahandog.
- source_word: בַּבָּמָה
  choice: sa sambahan sa mataas na lugar
  rationale: Ang בָּמָה ay isang lokal na pook ng pagsamba, karaniwang nasa mataas na lugar. Mas madaling maunawaan ang pariralang ito kaysa sa literal ngunit malabong “sa mataas na lugar” lamang, habang iniiwasang hatulan ang pook batay sa mas huling polemika.
theological_decisions:
- issue: Paglalarawan sa בָּמָה bago maitayo ang templo
  choice: sambahan sa mataas na lugar
  alternative: mataas na lugar; dambana sa burol
  rationale: Ipinakikita ng salin na ito na ang tinutukoy ay isang kinikilalang lokal na pook ng pagsamba, hindi basta mataas na lupain. Hindi nito ipinapalagay na lehitimo o labag sa kautusan ang gawain, kaya napapanatili ang historikal at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kayo/ninyo” upang natural na tukuyin ang pangkat nina Saul, kahit isahan ang ilang panghalip sa Hebreo dahil si Saul ang pangunahing kinakausap. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang ipinaliliwanag.
