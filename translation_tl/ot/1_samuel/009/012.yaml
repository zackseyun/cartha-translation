revisions:
- from: Sumagot sila sa kanila, “Oo. Naroon siya sa unahan ninyo. Magmadali kayo ngayon, sapagkat dumating siya sa lungsod ngayong araw, dahil may handog para sa mga tao ngayon sa sambahan sa mataas na lugar.[a]”
  to: Sumagot sila sa kanila, “Oo, naroon siya sa unahan ninyo. Magmadali kayo ngayon, sapagkat dumating siya sa lungsod ngayong araw dahil may hain para sa mga tao ngayon sa mataas na lugar.[a]”
  rationale: Pinalitan ang “sambahan sa mataas na lugar” ng “mataas na lugar” upang mapanatili ang teknikal at hindi paunang mapanghatol na termino ng Hebreo. Pinalitan ang malawak na “handog” ng “hain,” at pinakinis ang pagkakaugnay ng mga sugnay habang pinananatili ang pagdating ni Samuel, ang pagkaapurahan, at ang hain sa araw na iyon.
