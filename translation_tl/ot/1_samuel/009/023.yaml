    rationale: Ang “itabi mo ito” ay likas na Filipino at naipahihiwatig ang pagreserba; itinatala ng talababa ang mas literal na “sa iyo/kasama mo” upang mapanatili ang detalye ng Hebreo nang hindi ginagawang pilit ang pangunahing salin.
