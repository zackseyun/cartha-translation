  naturalness: Natural ang karamihan ng salin, ngunit hindi kumpleto at hindi likas ang “na sinabi kong, ‘Itabi mo muna.’” Mas malinaw at maayos ang “na sinabi ko sa iyo, ‘Itabi mo ito.’”
  terminology: Ang “tagapagluto” ay angkop para sa טַבָּח sa tagpo ng handaan. Ang “bahagi” ay tumpak para sa מָנָה. Pinili ang “Ibigay mo sa akin” upang tuwirang maipahayag ang imperatibong “ibigay,” na ang tumatanggap ay malinaw sa konteksto bilang si Samuel.
