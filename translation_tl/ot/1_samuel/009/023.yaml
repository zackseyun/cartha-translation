translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “tagapagluto” at “bahagi” upang maging madaling maunawaan nang hindi nawawala ang diwa ng nakatalagang pagkain. Hindi nilagyan ng talababa sapagkat sapat na naihahatid ng salin ang kontekstuwal na diwa at walang mahalagang teolohikal na kalabuan dito.
