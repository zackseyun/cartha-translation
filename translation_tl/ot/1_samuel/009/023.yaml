  text: Then Samuel said to the cook[a], “Bring the portion that I gave you, of which I said to you, ‘Set it aside with you.’”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Samuel sa tagapagluto, “Ibigay mo sa akin ang bahaging ibinigay ko sa iyo, na sinabi ko sa iyo, ‘Itabi mo ito.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ibigay mo ang bahagi … na sinabi ko sa iyo, ‘Ilagay mo ito sa iyo/kasama mo.’” Mas literal, “Ibigay mo ang bahaging ibinigay ko sa iyo, na sinabi ko sa iyo, ‘Ilagay mo ito kasama mo.’”
    reason: lexical_alternative
lexical_decisions:
- source_word: טַּבָּח
  choice: tagapagluto
  rationale: Sa konteksto ng handaan at paghahain ng inihandang karne, ang salita ay tumutukoy sa taong naghanda ng pagkain; mas natural dito ang “tagapagluto” kaysa “mangangatay.”
- source_word: תְּנָה
  choice: Dalhin mo
  rationale: Bagaman literal na “ibigay mo,” ang utos ay hinggil sa paglabas at paghahain ng bahaging naitabi, kaya likas sa Tagalog ang “Dalhin mo.”
- source_word: מָּנָה
  choice: bahagi
  rationale: Tumutukoy ito sa nakatalagang bahagi o takal ng pagkain sa isang handaan.
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: na ibinigay ko sa iyo
  rationale: Pinananatili ang payak at tuwirang kahulugan ng pandiwang “ibinigay.”
- source_word: אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: na sinabi kong
  rationale: Natural na inuugnay sa Tagalog ang ikalawang sugnay na panuring sa naunang “bahagi,” habang pinananatili ang pag-uulit ng Hebreong אֲשֶׁר.
- source_word: שִׂים אֹתָהּ עִמָּךְ
  choice: Itabi mo muna
  rationale: Literal itong “ilagay mo ito sa piling mo,” ngunit sa konteksto ay utos na panatilihin o ireserba ang bahagi hanggang kailanganin; malinaw at likas sa modernong Tagalog ang “Itabi mo muna.”
