  text: וַ/יֹּ֣אמֶר ל֗/וֹ הִנֵּה נָ֤א אִישׁ אֱלֹהִים֙ בָּ/עִ֣יר הַ/זֹּ֔את וְ/הָ/אִ֣ישׁ נִכְבָּ֔ד כֹּ֥ל אֲשֶׁר יְדַבֵּ֖ר בּ֣וֹא יָב֑וֹא עַתָּה֙ נֵ֣לֲכָה שָּׁ֔ם אוּלַי֙ יַגִּ֣יד לָ֔/נוּ אֶת דַּרְכֵּ֖/נוּ אֲשֶׁר הָלַ֥כְנוּ עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/006.yaml
  text: He said to him, “Look now, there is a man of God in this city, and the man is held in honor; everything that he says surely comes to pass. Now let us go there. Perhaps he will tell us the way we should go.”
translation:
  language: tl
  text: Sinabi ng lingkod sa kanya, “Tingnan po ninyo, may isang tao ng Diyos sa lungsod na ito. Lubos siyang iginagalang, at tiyak na nangyayari ang lahat ng sinasabi niya. Pumunta tayo roon ngayon. Baka sabihin niya sa atin kung anong daan ang dapat nating tahakin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Bagaman literal na “tao ng Diyos,” ang parirala ay isang kinikilalang tawag sa propeta o natatanging sugo ng Diyos. Ang “lingkod ng Diyos” ay natural sa modernong Tagalog at malinaw na tumutukoy sa kaniyang tungkulin, nang hindi pa tahasang ipinapalit ang “propeta.”
- source_word: נִכְבָּד
  choice: lubos siyang iginagalang
  rationale: Ipinahahayag ang diwang ‘marangal/kinararangalan’ sa natural at dignified na Tagalog.
- source_word: בּוֹא יָבוֹא
  choice: tiyak na nangyayari
  rationale: 'Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa katiyakan: ang sinasabi niya ay talagang natutupad o nangyayari.'
- source_word: אֶת דַּרְכֵּנוּ אֲשֶׁר הָלַכְנוּ עָלֶיהָ
  choice: kung aling daan ang dapat nating tahakin
  rationale: Ang literal na anyo ay maaaring tumukoy sa daang nilalakaran o dapat lakaran. Sa konteksto ng paghahanap at paghingi ng patnubay, ang idiomatikong Tagalog na ito ang pinakamalinaw, habang hindi nililimitahan kung pisikal na ruta o hakbang na gagawin ang tinutukoy.
theological_decisions:
- issue: Pagkakakilanlan ng אִישׁ אֱלֹהִים
  choice: lingkod ng Diyos
  alternative: tao ng Diyos / propeta
  rationale: Hindi tahasang ginamit sa talata ang salitang Hebreo para sa “propeta.” Pinananatili ng salin ang natatanging relihiyosong tungkulin nang hindi nagdaragdag ng katawagang wala rito.
- issue: Katiyakan ng mga pahayag ng lingkod ng Diyos
  choice: tiyak na nangyayari ang lahat ng sinasabi niya
  alternative: lahat ng sinasabi niya ay tiyak na natutupad
  rationale: Pinananatili ang mariing katiyakan ng Hebreo nang hindi nagpapasok ng paliwanag tungkol sa mekanismo o saklaw ng propesiya.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang magalang na “ninyo” dahil lingkod ang nagsasalita kay Saul; pinanatili ang tuwirang pagsasalaysay at hindi dinagdagan ng denominasyonal na terminolohiya.
