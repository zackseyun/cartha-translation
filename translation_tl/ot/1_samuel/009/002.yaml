  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “makisig” para sa pisikal na kaanyuan at “mga anak ni Israel” upang mapanatili ang anyo ng Hebreo. Walang footnote dahil walang kailangang markahang tekstuwal o makabuluhang leksikal na alternatibo sa inilathalang salin.
