base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/002.yaml
  text: And he had a son whose name was Saul[a], a young man and handsome. There was not a man among the sons of Israel more handsome than he[b]; from his shoulders upward he was taller than all the people.
translation:
  language: tl
  text: May anak siyang lalaki na ang pangalan ay Saul. Siya ay isang binatang makisig, at walang lalaking kabilang sa mga anak ni Israel ang higit na makisig kaysa sa kanya. Mula sa kanyang mga balikat pataas, mas matangkad siya kaysa kaninuman sa buong bayan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵן
  choice: anak na lalaki
  rationale: Tuwirang tumutukoy ito sa lalaking anak ni Kish; malinaw at natural sa modernong Filipino ang “anak na lalaki.”
- source_word: וּשְׁמוֹ
  choice: na ang pangalan ay
  rationale: Pinananatili nito ang pagkakaugnay ng “anak” at ng sugnay na nagpapakilala sa kanyang pangalan.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Ginamit ang nakaugaliang anyo ng pangalang pantangi sa Filipino.
- source_word: בָּחוּר
  choice: binata
  rationale: Tumutukoy sa isang kabataang lalaki na nasa kasibulan ng buhay; likas at maikli ang “binata” sa Filipino.
- source_word: טוֹב / וָטוֹב
  choice: makisig
  rationale: Sa konteksto, inilalarawan nito ang kaaya-ayang pisikal na anyo ni Saul, na kasunod na inuugnay sa kanyang pambihirang tangkad.
- source_word: וְאֵין אִישׁ מִבְּנֵי יִשְׂרָאֵל
  choice: walang lalaking kabilang sa mga anak ni Israel
  rationale: Pinananatili ang panlalaking אִישׁ at ang literal na katawagang “mga anak ni Israel,” habang ginagawa itong malinaw sa Filipino.
- source_word: טוֹב מִמֶּנּוּ
  choice: higit na makisig kaysa sa kanya
  rationale: Ipinahahayag ang paghahambing at ipinagpapatuloy ang pisikal na kahulugan ng טוֹב sa konteksto.
- source_word: מִשִּׁכְמוֹ וָמַעְלָה
  choice: mula sa kanyang mga balikat pataas
  rationale: Natural na katumbas ito ng idyomang Hebreo na nagsasaad kung gaano kalaki ang inilamang niya sa tangkad.
- source_word: גָּבֹהַּ
  choice: mas matangkad
  rationale: Ang paghahambing sa ibang tao ay tungkol sa pisikal na tangkad, kaya ang pahambing na anyo ang malinaw sa Filipino.
- source_word: מִכָּל הָעָם
  choice: kaysa sa buong bayan
  rationale: Pinananatili nito ang kolektibong pagtukoy ng הָעָם sa sambayanan; sa konteksto, ang diwa ay mas matangkad siya kaysa sa sinuman sa kanila.
