  to: May anak siyang lalaki na ang pangalan ay Saul. Siya ay isang binatang makisig, at walang lalaking kabilang sa mga anak ni Israel ang higit na makisig kaysa sa kanya. Mula sa kanyang mga balikat pataas, mas matangkad siya kaysa kaninuman sa buong bayan.
