base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/017.yaml
  text: When Samuel saw Saul[a], Yahweh answered him, “Look, this is the man of whom I spoke to you. This one shall rule over my people.”
translation:
  language: tl
  text: Nang makita ni Samuel si Saul, tumugon sa kanya si Yahweh, “Tingnan mo, ito ang lalaking binanggit ko sa iyo. Siya ang mamamahala sa aking bayan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “Siya ang pipigil o kokontrol sa aking bayan.” Ang pandiwang Hebreo ay maaaring mangahulugang pumigil, kumontrol, o mamahala.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: makita
  rationale: Karaniwang pandiwa ito para sa tuwirang pagkakita; natural ang “nang makita” sa daloy ng salaysay.
- source_word: וַיהוָה
  choice: si Yahweh
  rationale: Isinalin ang pangalang tipan na יְהוָה bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: עָנָהוּ
  choice: tumugon sa kanya
  rationale: Pinananatili ng “tumugon” ang diwa ng pagsagot o pagtugon, kahit walang agarang tanong sa mismong talata.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Tinatawag ng kataga ang pansin ni Samuel sa taong nasa harap niya; malinaw at kasalukuyang Tagalog ang “Tingnan mo.”
- source_word: הָאִישׁ אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: ang lalaking binanggit ko sa iyo
  rationale: Natural na ipinahahayag nito sa Tagalog ang pagtukoy ng Diyos sa nauna niyang sinabi tungkol sa lalaking ito.
- source_word: זֶה
  choice: Siya
  rationale: Ipinakikita ng hiwalay na panghalip ang mariing pagtukoy sa mismong lalaking kaharap ni Samuel nang hindi nagiging pilit ang Tagalog.
- source_word: יַעְצֹר
  choice: mamamahala
  rationale: Sa konteksto ng pagkahirang kay Saul bilang pinuno, ipinahahayag nito ang paggamit ng kapangyarihang mamahala; inilalahad sa talababa ang mas literal na diwang pagpigil o pagkontrol.
- source_word: בְּעַמִּי
  choice: sa aking bayan
  rationale: Kasama ng pandiwang יַעְצֹר, tinutukoy nito ang bayang saklaw ng pamamahala.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng יַעְצֹר kaugnay ng magiging tungkulin ni Saul
  choice: mamamahala sa aking bayan
  alternative: pipigil sa aking bayan; kokontrol sa aking bayan
  rationale: Ipinahihiwatig ng konteksto ang pamumunong may kapangyarihan, ngunit tunay ding taglay ng pandiwang Hebreo ang diwa ng pagpigil o pagkontrol; kaya hindi inaalis ang tensiyong ito at inilalagay sa talababa.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “tumugon” upang mapanatili ang Hebreong diwa ng pagsagot, at “mamamahala” para sa malinaw na kahulugan sa konteksto, habang pinananatili sa talababa ang mas literal na saklaw ng pandiwa.
