base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/014.yaml
  text: So they went up to the city. As they were entering the city[a], behold, Samuel was coming out to meet them, to go up to the high place.
translation:
  language: tl
  text: Kaya umakyat sila sa lungsod. Habang pumapasok sila sa lungsod[a], naroon si Samuel, na lumalabas upang salubungin sila at umakyat sa mataas na lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa loob ng lungsod.” Literal sa Hebreo, “sa gitna ng lungsod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: umakyat sila
  rationale: Karaniwang nangangahulugan ang עלה na “umakyat.” Pinananatili nito ang direksiyon at malamang na pag-ahon patungo sa lungsod.
- source_word: הָעִיר
  choice: lungsod
  rationale: Ang עִיר ay tumutukoy sa isang lungsod o bayan; “lungsod” ang karaniwang katumbas dito.
- source_word: הֵמָּה בָּאִים
  choice: habang papasok sila
  rationale: Ang hayag na panghalip at participle ay nagpapakita ng nagpapatuloy na kilos; natural itong isinalin bilang kilos na kasabay ng paglabas ni Samuel.
- source_word: בְּתוֹךְ הָעִיר
  choice: sa lungsod
  rationale: Literal itong “sa gitna/loob ng lungsod,” ngunit sa konteksto ng pagpasok ay likas na nangangahulugang papasok o nasa loob ng lungsod. Inilagay sa talababa ang mas literal na anyo.
- source_word: וְהִנֵּה
  choice: naroon
  rationale: Ang הִנֵּה ay pantawag-pansin sa bigla o mahalagang tanawin. Ang “naroon” ay likas sa makabagong Tagalog at pinananatili ang masiglang paglitaw ni Samuel sa salaysay.
- source_word: יֹצֵא
  choice: papalabas
  rationale: Ang participle ng יצא ay naglalarawan ng kasalukuyang nagpapatuloy na paglabas ni Samuel.
- source_word: לִקְרָאתָם
  choice: upang salubungin sila
  rationale: Ipinahihiwatig ng לִקְרָאת ang pagkilos patungo sa isang tao upang makatagpo siya; “salubungin” ang natural na katumbas sa Tagalog.
- source_word: לַעֲלוֹת
  choice: umakyat
  rationale: Infinitive ito na nagpapahayag ng layunin at pinananatili ang direksiyong pataas.
- source_word: הַבָּמָה
  choice: mataas na sambahan
  rationale: Ang בָּמָה ay isang mataas na lugar na ginagamit sa pagsamba. Ang “mataas na sambahan” ay mas malinaw sa karaniwang mambabasa kaysa sa literal ngunit maaaring malabong “mataas na lugar,” nang hindi nagpapataw ng negatibong paghatol.
theological_decisions:
- issue: Paglalarawan sa pook-sambahan na בָּמָה
  choice: mataas na sambahan
  alternative: mataas na lugar
  rationale: Tumutukoy ang salita sa kinikilalang pook ng pagsamba sa panahong ito. Ipinahahayag ng napiling salin ang gamit nito bilang sambahan at ang kaugnayan nito sa mataas na lugar, nang hindi ipinapasok ang mga negatibong pagsusuri sa ibang konteksto.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “naroon” sa halip na mas makalumang “masdan,” at “mataas na sambahan” upang maging malinaw ang kultikong kahulugan ng בָּמָה sa ordinaryong mambabasa.
