language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֵ֗מָּה עֹלִים֙ בְּ/מַעֲלֵ֣ה הָ/עִ֔יר וְ/הֵ֨מָּה֙ מָצְא֣וּ נְעָר֔וֹת יֹצְא֖וֹת לִ/שְׁאֹ֣ב מָ֑יִם וַ/יֹּאמְר֣וּ לָ/הֶ֔ן הֲ/יֵ֥שׁ בָּ/זֶ֖ה הָ/רֹאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/011.yaml
  text: As they were going up the ascent to the city[a], they found young women coming out to draw water, and they said to them, “Is the seer here?”
translation:
  language: tl
  text: Habang paakyat sila sa daang patungo sa lungsod, nakakita sila ng mga kabataang babaeng lumalabas upang umigib ng tubig. Tinanong nila ang mga ito, “Narito ba ang tagakita[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “propeta.” Ang literal na katawagan sa Hebreo ay “tagakita,” isang mas matandang tawag sa taong tinawag nang propeta kalaunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלִים
  choice: paakyat sila
  rationale: Ipinahihiwatig ng participle kasama ng panghalip ang nagpapatuloy na kilos; natural itong naipapahayag sa Tagalog bilang “paakyat sila.”
- source_word: בְּמַעֲלֵה הָעִיר
  choice: sa daang patungo sa lungsod
  rationale: Ang מַעֲלֶה ay tumutukoy sa paahong daan o pag-ahon. Naipahihiwatig na ng “paakyat” ang topograpiya, kaya malinaw at hindi paulit-ulit ang pariralang ito.
- source_word: מָצְאוּ
  choice: nakakita sila ng
  rationale: Pinananatili nito ang pangunahing diwa ng pandiwang “makakita/makasumpong,” habang natural sa Tagalog sa konteksto ng pagkakatagpo sa daan.
- source_word: נְעָרוֹת
  choice: mga kabataang babae
  rationale: Tumutukoy ito sa mga babaeng nasa murang gulang. Hindi nito ipinapalagay ang katayuang pag-aasawa na maaaring ipahiwatig ng “mga dalaga.”
- source_word: יֹצְאוֹת לִשְׁאֹב מָיִם
  choice: lumalabas upang umigib ng tubig
  rationale: 'Ipinapakita ng participle at infinitive ang kasalukuyang kilos at layunin: lumalabas sila para umigib.'
- source_word: הֲיֵשׁ בָּזֶה
  choice: Narito ba
  rationale: Ito ang maikli at natural na katumbas sa Tagalog ng tanong kung naroon sa lugar ang isang tao.
- source_word: הָרֹאֶה
  choice: tagakita
  rationale: Pinananatili nito ang tiyak at mas matandang katawagan sa Hebreo, sa halip na agad itong gawing “propeta.”
theological_decisions:
- issue: Pagkakakilanlan ng הָרֹאֶה
  choice: tagakita
  alternative: propeta
  rationale: Hindi pinagpapantay nang walang paliwanag ang dalawang katawagan. Pinananatili ng salin ang historikal na terminolohiya ng salaysay, habang nililinaw sa talababa ang kaugnayan nito sa “propeta.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kabataang babae” sa halip na mas arkaikong “dalaga” o “dalagita,” at pinanatili ang teknikal na katawagang “tagakita” na may paliwanag sa talababa.
