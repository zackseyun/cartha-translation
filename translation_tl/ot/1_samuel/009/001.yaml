translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lalaki” sa halip na mas lumang “lalake,” at pinanatiling malinaw ang talaangkanan. Inilagay ang talababa sa pariralang גִּבּוֹר חָיִל, na siyang tunay na pinagmumulan ng leksikal na kalabuan.
