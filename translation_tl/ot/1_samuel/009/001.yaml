- from: May isang lalaking mula sa Benjamin na ang pangalan ay Kish. Anak siya ni Abiel, na anak ni Zeror, na anak ni Becorat, na anak ni Afia—isang Benjaminita na makapangyarihan at iginagalang.[a]
  to: May isang lalaki mula sa Benjamin na ang pangalan ay Kish, anak ni Abiel, anak ni Zeror, anak ni Bekorat, anak ni Afia, na anak ng isang Benjaminita. Si Kish ay isang makapangyarihang lalaki.[a]
