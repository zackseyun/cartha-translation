base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/001.yaml
  text: There was a man of Benjamin[a], and his name was Kish son of Abiel, son of Zeror, son of Becorath, son of Aphiah, son of a Benjaminite, a mighty man of valor.
translation:
  language: tl
  text: May isang lalaki mula sa Benjamin na ang pangalan ay Kish, anak ni Abiel, anak ni Zeror, anak ni Bekorat, anak ni Afia, na anak ng isang Benjaminita. Si Kish ay isang makapangyarihang lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang magiting na mandirigma,” “isang kilalang tao,” o “isang mayaman at maimpluwensiyang tao.” Ang pananalitang Hebreo ay maaaring tumukoy sa katapangan sa digmaan, mataas na katayuan, o kayamanan at impluwensiya, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אִישׁ מִבֶּן־יָמִין
  choice: May isang lalaking mula sa Benjamin
  rationale: Ipinakikilala ng וַיְהִי ang bagong bahagi ng salaysay; natural sa modernong Tagalog ang “May isang lalaki.” Ang מִבֶּן־יָמִין ay tumutukoy sa pinagmulan o ugnayang pantribo, kaya “mula sa Benjamin” ang pinili nang hindi nagdaragdag ng salitang “lipi” sa pangunahing teksto.
- source_word: וּשְׁמוֹ קִישׁ
  choice: na ang pangalan ay Kish
  rationale: Likas na Tagalog na pormula ito sa pagpapakilala ng pangalan at tapat sa kahulugan ng Hebreo.
- source_word: בֶּן ... בֶּן ...
  choice: Anak siya ni ... na anak ni ...
  rationale: Pinananatili ang sunod-sunod na pormulang pangangkanan, ngunit hinati sa malinaw at madaling basahing pangungusap sa Tagalog. Hindi ito pinalitan ng “inapo,” bagaman maaaring mas malawak minsan ang saklaw ng בֶּן.
- source_word: אֲבִיאֵל / צְרוֹר / בְּכוֹרַת / אֲפִיחַ
  choice: Abiel / Zeror / Becorat / Afia
  rationale: Isinatinig ang mga pangalang pantangi ayon sa malinaw at karaniwang pagbasa sa Filipino.
- source_word: בֶּן־אִישׁ יְמִינִי
  choice: isang Benjaminita
  rationale: Tinutukoy ng parirala ang angkan bilang Benjaminita. Sa daloy ng Hebreo, malamang na si Afia ang inilalarawan; pinananatili ng gitling ang posibleng pagkakaugnay nito sa huling pangalang binanggit.
- source_word: גִּבּוֹר חָיִל
  choice: makapangyarihan at iginagalang
  rationale: 'Malawak ang saklaw ng idyomang Hebreo: maaari itong tumukoy sa lakas o kakayahang militar, katayuan sa lipunan, impluwensiya, o kayamanan. Sa pagpapakilala sa pamilya ni Saul, inilalarawan nito ang isang lalaking may kapangyarihan at mataas na katayuan nang hindi ito nililimitahan sa pagiging mandirigma.'
