  text: כְּ/בֹאֲ/כֶ֣ם הָ/עִ֣יר כֵּ֣ן תִּמְצְא֣וּ/ן אֹת֡/וֹ בְּ/טֶרֶם֩ יַעֲלֶ֨ה הַ/בָּמָ֜תָ/ה לֶ/אֱכֹ֗ל כִּ֠י לֹֽא יֹאכַ֤ל הָ/עָם֙ עַד בֹּא֔/וֹ כִּֽי הוּא֙ יְבָרֵ֣ךְ הַ/זֶּ֔בַח אַחֲרֵי כֵ֖ן יֹאכְל֣וּ הַ/קְּרֻאִ֑ים וְ/עַתָּ֣ה עֲל֔וּ כִּֽי אֹת֥/וֹ כְ/הַ/יּ֖וֹם תִּמְצְא֥וּ/ן אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/013.yaml
  text: As soon as you enter the city[a], you will find him, before he goes up to the high place to eat. For the people will not eat until he comes, because he is the one who blesses the sacrifice; afterward those who are invited eat. So go up now[c][b], for today you will find him.
translation:
  language: tl
  text: Pagpasok ninyo sa lunsod, matatagpuan ninyo siya bago siya umakyat sa mataas na lugar ng pagsamba[a] upang kumain. Hindi kakain ang mga tao hangga't hindi siya dumarating, sapagkat siya ang magbabasbas sa handog[b]. Pagkatapos, kakain ang mga inanyayahan. Kaya umakyat na kayo ngayon, sapagkat matatagpuan ninyo siya ngayon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mataas na lugar” ay isang mataas na pook ng pagsamba kung saan naghahandog at nagsasalo sa pagkaing mula sa handog.
    reason: cultural_note
  - marker: b
    text: Ang “magbabasbas sa handog” ay malamang na tumutukoy sa pagbigkas ng basbas kaugnay ng handog bago kumain ang mga inanyayahan.
    reason: cultural_note
  - marker: c
    text: 'Maaari ring isalin: “ngayong araw.” Binibigyang-diin ng Hebreong כְהַיּוֹם ang agarang pagkakataon at maaaring tumukoy sa kasalukuyang sandali, hindi lamang sa araw sa kalendaryo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם הָעִיר
  choice: Pagpasok ninyo sa lunsod
  rationale: 'Ang כ na kasama ng infinitive construct at hulaping pangmaramihan ay temporal: “kapag/pagpasok ninyo.” Likas at tuwiran ito sa modernong Tagalog.'
- source_word: כֵּן תִּמְצְאוּן אֹתוֹ
  choice: matatagpuan ninyo siya
  rationale: Ipinahihiwatig ng כֵּן ang tiyak at agarang resulta; sapat na itong naihahayag ng daloy ng pangungusap sa Tagalog nang hindi kailangang isalin nang hiwalay.
- source_word: בְּטֶרֶם יַעֲלֶה הַבָּמָתָה
  choice: bago siya umakyat sa sambahan sa mataas na lugar
  rationale: Ang בְּטֶרֶם ay “bago,” at pinananatili ng “umakyat” ang direksiyon ng עלה. Ang במה ay isang mataas na pook ng pagsamba at paghahandog; nililinaw ito nang hindi basta tinatawag na karaniwang burol.
- source_word: לֶאֱכֹל
  choice: upang kumain
  rationale: Tuwirang isinasalin ang layuning ipinahahayag ng infinitive.
- source_word: לֹא יֹאכַל הָעָם עַד בֹּאוֹ
  choice: Hindi kakain ang mga tao hangga't hindi siya dumarating
  rationale: Ang imperfect ay tumutukoy sa nalalapit na pangyayari, at ang עַד בֹּאוֹ ay natural na naihahayag sa Tagalog bilang “hangga't hindi siya dumarating.”
- source_word: כִּי הוּא יְבָרֵךְ הַזֶּבַח
  choice: sapagkat siya ang magbabasbas sa handog
  rationale: Ang “siya ang” ay nagpapanatili sa diin ng הוּא. Ang זבח ay handog na sakripisyo at may kaugnay na salu-salo; “handog” ang natural na pangunahing salin, habang nililinaw sa talababa ang konteksto.
- source_word: אַחֲרֵי כֵן יֹאכְלוּ הַקְּרֻאִים
  choice: Pagkatapos, kakain ang mga inanyayahan
  rationale: Pinananatili ang pagkakasunod-sunod at ang pasibong diwa ng הַקְּרֻאִים, “mga inanyayahan.”
- source_word: וְעַתָּה עֲלוּ
  choice: Kaya umakyat na kayo ngayon
  rationale: Ang “kaya” ay naghahatid ng lohikal na bunga sa konteksto, at ang “umakyat” ay nagpapanatili sa kilos ng עלה.
- source_word: כְהַיּוֹם
  choice: sa mismong oras na ito
  rationale: Maaaring tumukoy ang idyoma sa “ngayon/sa oras na ito” at nagbibigay-diin sa agarang pagkakataon, hindi lamang sa araw sa kalendaryo.
theological_decisions:
- issue: Kalikasan ng mataas na lugar at ng pagbabasbas sa handog
  choice: Isinalin bilang “sambahan sa mataas na lugar” at “magbabasbas sa handog,” na may paliwanag sa mga talababa.
  alternative: “dambana” at “bibigkasin ang basbas bago ang handuang mula sa sakripisyo”
  rationale: Pinananatili ng pangunahing teksto ang mga pangunahing leksikal na konsepto nang hindi nagpapasiya nang higit sa sinasabi ng Hebreo; ang rituwal at pangkulturang konteksto ay inilalagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “lunsod,” “handog,” at “mga inanyayahan” bilang madaling maunawaang mga salitang hindi labis na teknikal. Ang lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
