  source_fidelity: 'Ang salin ay malapit sa Hebreo at napananatili ang pagkakasunod-sunod: pagdating sa lunsod, bago umakyat sa mataas na lugar, pagkain ng bayan matapos ang pagbabasbas, at ang agarang pag-akyat. Gayunman, ang pangwakas na כְהַיּוֹם ay mas ligtas na isalin sa pangunahing teksto bilang “ngayon,” habang ang “ngayong araw” ay ilalagay bilang alternatibo. Ang “sa mismong oras na ito” ay masyadong makitid at hindi likas sa pangungusap.'
  naturalness: May ilang bahagyang di-likas o mabigat na parirala. Ang “mataas na lugar ng pagsamba” ay mas malinaw at mas natural kaysa “sambahan sa mataas na lugar,” na maaaring magmungkahi ng isang gusali. Ang “ngayon” sa hulihan ay mas matatas kaysa “sa mismong oras na ito.”
  terminology: Ang “mataas na lugar” ay pinananatili bilang pangunahing katawagan para sa בָּמָה, na may maikling paliwanag sa talababa. Ang “handog” para sa זֶבַח at “mga inanyayahan” para sa הַקְּרֻאִים ay katanggap-tanggap. Hindi ipinapasok ng salin ang di-tiyak na pagpapakahulugan sa ritwal.
