  - severity: low
    issue: Hindi pinakanatural na pagtukoy sa mataas na lugar
    rationale: Ang “sambahan sa mataas na lugar” ay nauunawaan ngunit medyo mabigat at maaaring magpahiwatig ng isang tiyak na gusali. Mas maayos ang “mataas na lugar ng pagsamba,” habang pinananatili ang pangunahing kahulugan at ang paliwanag sa talababa.
