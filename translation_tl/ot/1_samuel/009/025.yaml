  text: When they came down from the high place into the city[a], he spoke with Saul on the roof.
translation:
  language: tl
  text: Pagbaba nila mula sa mataas na lugar patungo sa bayan,[a] nakipag-usap siya kay Saul sa bubungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bumaba sila mula sa mataas na lugar patungo sa bayan, at nakipag-usap siya kay Saul sa bubungan.”
    reason: Maaaring panatilihin ang dalawang pandiwang Hebreo bilang magkakasunod na pangungusap sa halip na gawing pantulong na sugnay ang una.
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: Pagkababa nila
  rationale: Ipinapahayag ng anyong pandiwa ang pagsulong ng salaysay. Ang sugnay na “Pagkababa nila” ay likas sa Tagalog at maayos na nag-uugnay sa kasunod na pandiwang isahan nang hindi inaalis ang diwa ng pagbaba.
- source_word: מֵהַבָּמָה
  choice: mula sa mataas na sambahan
  rationale: Ang בָּמָה ay karaniwang tumutukoy sa mataas na pook na ginagamit sa pagsamba at paghahandog. Mas malinaw sa karaniwang mambabasa ang “mataas na sambahan” kaysa sa literal ngunit malabong “mataas na lugar,” habang hindi tinutukoy kung anong uri ng dambana iyon.
- source_word: הָעִיר
  choice: papunta sa bayan
  rationale: Sa konteksto ng pandiwa ng pagkilos at ng pariralang “mula sa,” ipinahihiwatig nito ang pagbaba patungo sa mismong pamayanan. Ang “bayan” ay natural na katumbas ng עִיר sa ganitong sinaunang tagpuan.
- source_word: וַיְדַבֵּר
  choice: nakipag-usap siya
  rationale: Isahan ang pandiwa pagkatapos ng naunang maramihang simuno. Ang “nakipag-usap” ay angkop sa עִם (“kasama/kay”) at nagpapahiwatig ng pakikipag-usap nang hindi nagdaragdag ng nilalaman.
- source_word: עִם שָׁאוּל
  choice: kay Saul
  rationale: Bagaman karaniwang nangangahulugang “kasama” ang עִם, natural na ipinahahayag sa Tagalog ang pakikipag-usap sa pamamagitan ng “nakipag-usap … kay Saul.”
- source_word: עַל הַגָּג
  choice: sa bubungan
  rationale: Ang גָּג ay tumutukoy sa patag na bubong na nagagamit na bahagi ng bahay. Ang “sa bubungan” ay malinaw at natural sa modernong Tagalog.
