  text: הֵ֗מָּה בָּ֚אוּ בְּ/אֶ֣רֶץ צ֔וּף וְ/שָׁא֥וּל אָמַ֛ר לְ/נַעֲר֥/וֹ אֲשֶׁר עִמּ֖/וֹ לְכָ֣/ה וְ/נָשׁ֑וּבָה פֶּן יֶחְדַּ֥ל אָבִ֛/י מִן הָ/אֲתֹנ֖וֹת וְ/דָ֥אַג לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/005.yaml
  text: When they came into the land of Zuph[a], Saul said to his young man who was with him, “Come, let us return[b], lest my father stop caring about the donkeys and become anxious about us.”
translation:
  language: tl
  text: Nang makarating sila sa lupain ng Zuf, sinabi ni Saul sa binatang kasama niya, “Halika, bumalik na tayo. Baka tigilan na ng aking ama ang pag-aalala sa mga asnong babae[a] at sa atin naman siya mag-alala[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tumigil mula sa mga asnong babae,” ibig sabihin, tumigil sa pagiging abala o sa pag-aalala tungkol sa mga ito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mabahala tungkol sa atin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ בְּאֶרֶץ צוּף
  choice: makarating sila sa lupain ng Zuf
  rationale: Ang בוא na may ב ay tumutukoy sa pagdating o pagpasok sa isang lugar. Likas sa modernong Tagalog ang “makarating sa,” at pinananatili ng “lupain ng Zuf” ang heograpikong pangalan.
- source_word: נַעֲרוֹ
  choice: binatang kasama niya
  rationale: Ang נַעַר ay pangunahing nangangahulugang binata o kabataang lalaki, bagaman maaari rin itong tumukoy sa isang tagapaglingkod. Hindi labis na tinutukoy ng salin ang katayuan niya, habang malinaw na kasama siya ni Saul.
- source_word: לְכָה וְנָשׁוּבָה
  choice: Halika, bumalik na tayo
  rationale: Pinagsasama ng parirala ang pautos at cohortative na panawagan. Ang “bumalik na tayo” ay natural na Tagalog at naghahatid ng mungkahing umuwi o magbalik na.
- source_word: פֶּן
  choice: Baka
  rationale: Ipinakikilala ng פֶּן ang isang kinatatakutang maaaring mangyari. Mas natural sa kasalukuyang Tagalog ang “baka” kaysa sa mas pormal na “nang huwag mangyari na.”
- source_word: יֶחְדַּל ... מִן הָאֲתֹנוֹת
  choice: tigilan na ... ang pag-aalala sa mga asnong babae
  rationale: Literal na “tumigil mula sa mga asnong babae,” isang pariralang nagsasaad ng pagtigil sa pagiging abala o pag-aalala tungkol sa mga ito. Ginawang hayag ang ipinahihiwatig na pag-aalala upang maging malinaw sa Tagalog, habang itinatala sa talababa ang anyong mas literal.
- source_word: הָאֲתֹנוֹת
  choice: mga asnong babae
  rationale: Ang pangngalan ay partikular na tumutukoy sa mga babaeng asno. Pinananatili ang detalyeng ito sa halip na gawing pangkalahatang “mga asno.”
- source_word: וְדָאַג לָנוּ
  choice: at sa atin naman siya mag-alala
  rationale: Ang דאג ay nangangahulugang mabahala o mag-alala, at ang לָנוּ ang layon ng pag-aalala. Ang “naman” ay natural na nagpapakita ng paglipat ng pag-aalala mula sa mga asno tungo kina Saul at sa kasama niya.
