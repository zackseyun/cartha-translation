translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “binata” sa halip na “tagapaglingkod” upang mapanatili ang lawak ng kahulugan ng נַעַר, at “mga asnong babae” upang mapanatili ang kasarian na tahasang nasa Hebreo.
