  naturalness: Natural ang karamihan ng salin. Mas malinaw at mas tuwiran ang «Mauna ka sa akin umakyat» kaysa «Mauna ka sa akin sa pag-akyat», at mas neutral ang «Sa umaga, papaalisin kita» nang walang «na».
  terminology: Ang «tagakita» ay angkop para sa הָרֹאֶה at maayos ang talababa nito. Katanggap-tanggap ang «mataas na lugar ng pagsamba» para sa הַבָּמָה, bagaman ito ay bahagyang nagpapaliwanag ng terminong «mataas na lugar» sa halip na iwan itong mas maigsi.
