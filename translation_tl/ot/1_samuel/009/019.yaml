base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/019.yaml
  text: Samuel answered Saul and said[a], “I am the seer. Go up before me to the high place, and eat with me today. In the morning I will send you on your way[b], and I will tell you all that is in your heart.”
translation:
  language: tl
  text: Sumagot si Samuel kay Saul, “Ako ang tagakita.[a] Mauna ka sa akin umakyat sa mataas na lugar ng pagsamba, at kumain kayo kasama ko ngayong araw.[b] Sa umaga, papaalisin kita, at sasabihin ko sa iyo ang lahat ng nasa puso mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “propeta.” Ang “tagakita” ang mas naunang tawag sa tinatawag na propeta noong panahong iyon; tingnan ang 1 Samuel 9:9.
    reason: alternative_reading
  - marker: b
    text: Pangmaramihan sa Hebreo ang “kumain kayo,” kaya malamang na kasama rito ang lingkod ni Saul.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאֶה
  choice: tagakita
  rationale: Literal itong tumutukoy sa ‘taong nakakakita’ at siyang mas naunang tawag sa isang propeta sa kontekstong ito (tingnan ang 1 Samuel 9:9). Pinananatili ng ‘tagakita’ ang natatanging makasaysayang termino sa halip na ipantay agad sa ‘propeta.’
- source_word: הַבָּמָה
  choice: mataas na lugar ng pagsamba
  rationale: Ang בָּמָה ay isang mataas na pook na ginagamit sa pagsamba. Mas malinaw sa karaniwang mambabasa ang pariralang ito kaysa sa literal ngunit maaaring mapagkamalang pangkaraniwang ‘mataas na lugar.’
- source_word: עֲלֵה לְפָנַי
  choice: Mauna ka sa akin sa pag-akyat
  rationale: Pinananatili nito kapuwa ang paakyat na kilos at ang utos na mauna si Saul kay Samuel, nang hindi ipinapalagay ang iba pang detalye ng kanilang pagkilos.
- source_word: וַאֲכַלְתֶּם עִמִּי הַיּוֹם
  choice: kumain kayo kasama ko ngayong araw
  rationale: Pangmaramihan ang pandiwang Hebreo, kaya ginamit ang ‘kayo’ upang isama ang kasama ni Saul kahit si Saul ang pangunahing kinakausap.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: papaalisin na kita
  rationale: Ipinahihiwatig ng pandiwa na pahihintulutan o padadalhan na si Saul upang magpatuloy sa kanyang paglalakbay. Natural ito sa Filipino at hindi nagdaragdag ng tiyak na destinasyon gaya ng ‘pauuwiin.’
- source_word: בַבֹּקֶר
  choice: Kinaumagahan
  rationale: Ipinapahayag nito ang umagang kasunod ng ‘ngayong araw’ nang hindi kailangang idagdag ang salitang ‘bukas.’
- source_word: וְכֹל אֲשֶׁר בִּלְבָבְךָ
  choice: lahat ng nasa puso mo
  rationale: Pinananatili ang larawang Hebreo ng puso bilang kaloob-looban, kasama ang mga iniisip, ninanais, at alalahanin, sa halip na limitahan ito sa isip lamang.
- source_word: אַגִּיד לָךְ
  choice: sasabihin ko sa iyo
  rationale: Natural at tumpak itong katumbas ng Hiphil na nangangahulugang ipaalam o sabihin ang isang bagay.
theological_decisions:
- issue: Pagkakakilanlan ni Samuel bilang הָרֹאֶה
  choice: tagakita
  alternative: propeta
  rationale: Hindi nilulutas sa salin ang makasaysayang pagkakaiba ng mga katawagan. Ang ‘tagakita’ ang mismong terminong ginamit dito, samantalang ipinaliliwanag ng 1 Samuel 9:9 ang kaugnayan nito sa ‘propeta.’
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Iniwasan ang mas lumang ‘mataas na dako’ at nilinaw ang gamit nitong panrelihiyon sa ‘mataas na lugar ng pagsamba.’ Ang paglipat mula sa isahang ‘ka’ tungo sa maramihang ‘kayo’ ay sinadyang panatilihin dahil malinaw ang pagbabagong ito sa Hebreo.
