base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/020.yaml
  text: And as for the donkeys that were lost to you three days ago[a], do not set your heart on them, for they have been found[b]. And for whom is all the desire of Israel? Is it not for you and for all your father's house?
translation:
  language: tl
  text: At tungkol naman sa iyong mga asnong babaeng nawala tatlong araw na ang nakararaan, huwag mo nang alalahanin ang mga iyon, sapagkat natagpuan na ang mga asno. At para kanino ang lahat ng minimithi ng Israel?[a] Hindi ba para sa iyo at sa buong sambahayan ng iyong ama?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “At kanino nauukol ang lahat ng kanais-nais sa Israel?” Maaaring tumukoy ang pariralang Hebreo sa minimithi ng Israel o sa mga bagay na kanais-nais o mahalaga sa Israel.'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sambahayan ng iyong ama,” isang katawagang maaaring sumaklaw sa mas malawak na angkan o pangkat ng magkakamag-anak, hindi lamang sa mga magulang at anak.
    reason: cultural_note
lexical_decisions:
- source_word: אֲתֹנוֹת
  choice: mga asnong babae
  rationale: Tiyak na mga babaeng asno ang tinutukoy ng pangngalang Hebreo. Likas at malinaw sa Filipino ang tahasang pariralang ito, at pinananatili nito ang detalyeng nasa pinagmulang teksto.
- source_word: הָאֹבְדוֹת לְךָ
  choice: mong nawala
  rationale: Maikli at natural itong paglalarawan sa mga hayop na nawala kay Saul, habang pinananatili ang resultang kalagayan ng pandiwaring Hebreo.
- source_word: הַיּוֹם שְׁלֹשֶׁת הַיָּמִים
  choice: tatlong araw na ang nakararaan
  rationale: Idyomang Hebreo ito para sa panahong tatlong araw bago ang kasalukuyan; ang salin ay natural at tiyak sa modernong Filipino.
- source_word: אַל תָּשֶׂם אֶת־לִבְּךָ לָהֶם
  choice: huwag mo nang alalahanin ang mga iyon
  rationale: Ang literal na larawan ay ‘huwag mong ituon ang iyong puso sa mga iyon.’ Sa konteksto, tumutukoy ito sa pag-aalala o patuloy na pagbibigay-pansin; ang salin ay natural nang hindi dinaragdagan ang diwa.
- source_word: נִמְצָאוּ
  choice: natagpuan na ang mga iyon
  rationale: 'Pinananatili nito ang balintiyak at resultang kahulugan ng Niphal perfect: natagpuan na ang mga nawawalang asno.'
- source_word: וּלְמִי כָּל חֶמְדַּת יִשְׂרָאֵל
  choice: At para kanino ang lahat ng minimithi ng Israel?
  rationale: Maaaring tumukoy ang חֶמְדַּת sa minimithi o sa kanais-nais/mahalagang bagay. Ang ‘minimithi ng Israel’ ay likas sa Filipino at pinananatili ang matayog na retorika; inilalahad sa talababa ang tunay na leksikal na alternatibo.
- source_word: הֲלוֹא
  choice: Hindi ba
  rationale: Pinananatili nito ang anyo ng retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: לְךָ וּלְכֹל בֵּית אָבִיךָ
  choice: para sa iyo at sa buong sambahayan ng iyong ama
  rationale: Ang ‘sambahayan ng iyong ama’ ay mas malawak kaysa nukleyar na pamilya at mas malapit sa yunit ng pagkakamag-anak at lipunan na tinutukoy ng Hebreo.
theological_decisions:
- issue: Kahulugan ng pahayag tungkol sa חֶמְדַּת יִשְׂרָאֵל
  choice: Isinalin bilang matayog na retorikal na pahayag tungkol sa ‘lahat ng minimithi ng Israel,’ nang hindi tahasang ipinapasok ang paghahari.
  alternative: Maaaring tumukoy ito sa lahat ng kanais-nais o mahalaga sa Israel; maaari ring unawain sa konteksto bilang pahiwatig sa haring minimithi ng Israel.
  rationale: Siksik at may likas na kalabuan ang Hebreo. Bagaman tumuturo ang konteksto sa nalalapit na pagkahirang kay Saul, hindi tahasang binabanggit sa talata ang paghahari, kaya hindi ito idinagdag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang ‘sambahayan’ upang mapanatili ang sinaunang panlipunang diwa nang hindi nagiging sobrang teknikal; iniwasan ang tahasang pagbanggit sa paghahari upang mapanatili ang kalabuan ng pinagmulang teksto.
