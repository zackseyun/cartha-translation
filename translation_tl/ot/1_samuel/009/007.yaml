base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/007.yaml
  text: Then Saul said to his young man[a], “But look, if we go, what will we bring to the man? For the bread is gone from our bags, and there is no gift to bring to the man of God[b]. What do we have?”
translation:
  language: tl
  text: Sinabi ni Saul sa kanyang binata, “Pero tingnan mo, kung pupunta tayo, ano ang dadalhin natin sa lalaki? Ubos na ang tinapay sa ating mga sisidlan,[a] at wala tayong regalong maidadala sa tao ng Diyos.[b] Ano ang mayroon tayo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ubos na ang tinapay mula sa ating mga lalagyan.” Kongkreto ang “tinapay” sa Hebreo, at ang “mga sisidlan” ay mga lalagyan ng kanilang baon.
    reason: lexical_alternative
  - marker: b
    text: O “kaloob.” Ang salitang Hebreo ay tumutukoy sa regalong dinadala bilang paggalang sa isang taong iginagalang.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: binata
  rationale: Ipinapanatili ang pahiwatig ng kabataan nang hindi tiyak na itinuturing siyang alipin; malinaw sa konteksto na siya ang kasama o tagapaglingkod ni Saul.
- source_word: וְהִנֵּה
  choice: Pero
  rationale: Dito, ipinakikilala ng kataga ang praktikal na pagtutol ni Saul; natural sa modernong Tagalog ang “Pero” nang hindi gumagamit ng makalumang “narito.”
- source_word: נֵלֵךְ
  choice: kung pupunta tayo
  rationale: Ang anyong pandiwa ay gumaganap sa kondisyunal na pahayag, kaya malinaw at natural ang ganitong salin.
- source_word: נָּבִיא
  choice: dadalhin natin
  rationale: Ang Hiphil ng בוא ay nangangahulugang magdala ng isang bagay patungo sa isang tao.
- source_word: לֶחֶם
  choice: tinapay
  rationale: Pinananatili ang kongkretong pangunahing kahulugan sa halip na gawing pangkalahatang “pagkain” o “baon.”
- source_word: כְּלִי
  choice: mga sisidlan
  rationale: Malawak ang kahulugan ng Hebreo na lalagyan o kasangkapan; iniiwasan nitong tukuying “mga bag” lamang ang ginamit nila.
- source_word: תְּשׁוּרָה
  choice: regalo
  rationale: Tumutukoy ito sa handog o regalong dinadala bilang paggalang sa isang tao, nang walang kinakailangang kultikong kahulugan.
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Natural itong titulong Filipino para sa taong inatasan ng Diyos, bagaman literal na “lalaki ng Diyos”; hindi ito basta pinapalitan ng “propeta.”
- source_word: מָה אִתָּנוּ
  choice: Ano pa ang dala natin?
  rationale: Likas na Tagalog para sa tanong kung ano ang mayroon silang kasama o maaaring ialay.
theological_decisions:
- issue: Paglalarawan kay Samuel bilang אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  alternative: tao ng Diyos
  rationale: Ang “lingkod ng Diyos” ay dignified at madaling maunawaan bilang titulo ng isang taong inatasan ng Diyos, ngunit hindi nito nililimitahan ang katawagan sa teknikal na “propeta.”
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang kongkretong “tinapay” at ang malawak na “mga sisidlan,” habang ginawang malinaw ang praktikal na pag-aalala ni Saul. Ang mga panandang talababa [a] at [b] ay kapwa nasa pangunahing teksto.
