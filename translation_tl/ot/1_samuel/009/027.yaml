  to: Habang pababa sila sa dulo ng bayan, sinabi ni Samuel kay Saul, “Sabihin mo sa binata[a] na mauna na sa atin.” At nauna siya. “Ngunit ikaw, huminto ka muna rito[b], at iparirinig ko sa iyo ang salita ng Diyos.”
