  text: הֵ֗מָּה יֽוֹרְדִים֙ בִּ/קְצֵ֣ה הָ/עִ֔יר וּ/שְׁמוּאֵ֞ל אָמַ֣ר אֶל שָׁא֗וּל אֱמֹ֥ר לַ/נַּ֛עַר וְ/יַעֲבֹ֥ר לְ/פָנֵ֖י/נוּ וַֽ/יַּעֲבֹ֑ר וְ/אַתָּה֙ עֲמֹ֣ד כַּ/יּ֔וֹם וְ/אַשְׁמִיעֲ/ךָ֖ אֶת דְּבַ֥ר אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/027.yaml
  text: As they were going down to the edge of the city[a], Samuel said to Saul, “Tell the young man to go on ahead of us.” And he went on ahead. “But you, stand here now[b], and I will let you hear the word of God.”
translation:
  language: tl
  text: Habang pababa sila sa dulo ng bayan, sinabi ni Samuel kay Saul, “Sabihin mo sa binata[a] na mauna na sa atin.” At nauna siya. “Ngunit ikaw, huminto ka muna rito[b], at iparirinig ko sa iyo ang salita ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katulong” o “tagapaglingkod.” Ang Hebreong נַעַר ay maaaring tumukoy sa isang binata, alalay, o tagapaglingkod.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “tumayo ka ngayon/gaya sa oras na ito.” Idyomatiko ang pananalita at nangangahulugang tumigil at manatili muna roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרְדִים
  choice: pababa sila
  rationale: Ang participle ay nagsasaad ng nagpapatuloy na kilos. Likas sa modernong Tagalog ang “habang pababa sila” at pinananatili nito ang direksiyon ng paglalakbay.
- source_word: בִּקְצֵה הָעִיר
  choice: sa hangganan ng bayan
  rationale: Ang קָצֶה ay tumutukoy sa dulo o hangganan. Mas angkop sa sinaunang pamayanan ang “bayan” kaysa “lungsod,” at hindi labis na ipinapakahulugan ang parirala bilang “mga labas ng bayan.”
- source_word: אֱמֹר לַנַּעַר
  choice: Sabihin mo sa binata
  rationale: Maaaring mangahulugan ang נַעַר ng binata, tagapaglingkod, o katulong. Pinananatili ng “binata” ang mas malawak na leksikal na diwa, habang inilalahad sa talababa ang kahulugang hinihingi ng konteksto.
- source_word: וְיַעֲבֹר לְפָנֵינוּ
  choice: na mauna na sa atin
  rationale: Sa konstruksiyong ito, ang עבר na may לִפְנֵי ay nangangahulugang lumampas at magpatuloy sa unahan. Natural at malinaw sa Tagalog ang “mauna na sa atin.”
- source_word: וַיַּעֲבֹר
  choice: At nauna nga siya
  rationale: Isinasalaysay nito ang agarang pagsunod ng binata. Ang “nga” ay natural na nag-uugnay sa utos at sa katuparan nito nang hindi nagdaragdag ng bagong nilalaman.
- source_word: עֲמֹד כַּיּוֹם
  choice: huminto ka muna rito
  rationale: Idyomatiko at mahirap isalin nang literal ang כַּיּוֹם. Sa konteksto, inuutusan si Saul na tumigil at manatili sandali; mas malinaw ito kaysa “tumayo ka,” na maaaring ipakahulugang bumangon mula sa pagkakaupo.
- source_word: וְאַשְׁמִיעֲךָ
  choice: iparirinig ko sa iyo
  rationale: 'Pinananatili ng anyong pa- ng “iparirinig” ang causative na diwa ng Hiphil ng שׁמע: gagawin ni Samuel na marinig ni Saul ang mensahe.'
- source_word: דְּבַר אֱלֹהִים
  choice: ang salita ng Diyos
  rationale: Pinananatili ng “salita ng Diyos” ang pormula at bigat ng pahayag na tumutukoy sa banal na kapahayagan, nang hindi nililimitahan ito sa saling “mensahe.”
theological_decisions:
- issue: Paglilipat ng pormulang דְּבַר אֱלֹהִים na tumutukoy sa kapahayagan
  choice: ang salita ng Diyos
  alternative: ang mensahe ng Diyos
  rationale: Ang “salita ng Diyos” ay tapat sa anyo at propetikong bigat ng Hebreo. Hindi nito paunang tinutukoy nang higit sa teksto ang eksaktong nilalaman ng ihahayag ni Samuel.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa sinaunang pamayanan, “binata” upang mapanatili ang leksikal na lawak ng נַעַר, at “huminto ka muna rito” upang likas na maipahayag ang idyomatikong utos nang hindi binubura ang alternatibong literal na anyo sa talababa.
