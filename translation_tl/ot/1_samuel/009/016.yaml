  to: Bukas, sa ganitong oras, magpapadala ako sa iyo ng isang lalaki mula sa lupain ng Benjamin. Pahiran mo siya ng langis bilang tagapamahala[a] sa aking bayang Israel. Ililigtas niya ang aking bayan mula sa kamay ng mga Filisteo, sapagkat nakita ko ang aking bayan; nakarating sa akin ang kanilang daing.[b]
