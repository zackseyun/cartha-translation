  text: כָּ/עֵ֣ת מָחָ֡ר אֶשְׁלַח֩ אֵלֶ֨י/ךָ אִ֜ישׁ מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מְשַׁחְתּ֤/וֹ לְ/נָגִיד֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הוֹשִׁ֥יעַ אֶת עַמִּ֖/י מִ/יַּ֣ד פְּלִשְׁתִּ֑ים כִּ֤י רָאִ֨יתִי֙ אֶת עַמִּ֔/י כִּ֛י בָּ֥אָה צַעֲקָת֖/וֹ אֵלָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/016.yaml
  text: About this time tomorrow I will send to you a man from the land of Benjamin[a], and you shall anoint him as ruler over my people Israel. He will save my people from the hand of the Philistines, for I have seen my people[b], because their cry has come to me.
translation:
  language: tl
  text: Bukas, sa ganitong oras, magpapadala ako sa iyo ng isang lalaki mula sa lupain ng Benjamin. Pahiran mo siya ng langis bilang tagapamahala[a] sa aking bayang Israel. Ililigtas niya ang aking bayan mula sa kamay ng mga Filisteo, sapagkat nakita ko ang aking bayan; nakarating sa akin ang kanilang daing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebreo, nagid; maaari ring “pinuno,” at tradisyonal na “prinsipe.” Tumutukoy ito sa isang itinalagang mamahala, hindi lamang sa isang seremonyal na katungkulan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “ang kanyang daing”; ang pang-isahang hulapi ay tumutukoy sa kolektibong pangngalang “aking bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת מָחָר
  choice: Bukas, sa ganitong oras
  rationale: Likas na salin sa Filipino ng idyomang tumutukoy sa humigit-kumulang kaparehong oras kinabukasan.
- source_word: אֶשְׁלַח אֵלֶיךָ
  choice: magpapadala ako sa iyo
  rationale: Pinananatili ang direksiyon ng אֶל, “sa iyo,” at natural ang anyong magpapadala sa Filipino.
- source_word: אִישׁ מֵאֶרֶץ בִּנְיָמִן
  choice: isang lalaki mula sa lupain ng Benjamin
  rationale: Pinananatili ang tiyak na panlalaking sanggunian at ang heograpikong diwa ng אֶרֶץ.
- source_word: וּמְשַׁחְתּוֹ
  choice: Pahiran mo siya ng langis
  rationale: Ang pagpapahid dito ay pagtatalaga sa tungkulin; tahasang binanggit ang langis upang maging malinaw at natural sa karaniwang mambabasa.
- source_word: לְנָגִיד
  choice: bilang tagapamahala
  rationale: Ipinahahayag ang awtoridad na mamuno nang hindi agad itinutumbas ang נָגִיד sa mas tiyak na titulong “hari” o sa makabagong kahulugan ng “prinsipe.”
- source_word: וְהוֹשִׁיעַ
  choice: Ililigtas niya
  rationale: Ang יָשַׁע ay tumutukoy sa pagliligtas o pagpapalaya; ipinapakita rito ang magiging bunga ng pagkatalaga.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: mula sa kamay ng mga Filisteo
  rationale: Pinananatili ang Hebreong larawang “kamay” bilang kapangyarihan o paghahari, na nauunawaan din sa Filipino.
- source_word: כִּי רָאִיתִי אֶת עַמִּי
  choice: sapagkat nakita ko ang aking bayan
  rationale: Pinananatili ang tuwirang pahayag na nakita o pinansin ng Diyos ang kalagayan ng kanyang bayan.
- source_word: כִּי בָּאָה צַעֲקָתוֹ אֵלָי
  choice: dahil nakarating sa akin ang kanilang daing
  rationale: Ang hulaping pang-isahan ay tumutukoy sa kolektibong “aking bayan”; natural sa Filipino ang pangmaramihang “kanilang.”
theological_decisions:
- issue: Ang tungkulin ni Saul na ipinahahayag ng נָגִיד
  choice: tagapamahala
  alternative: pinuno; prinsipe
  rationale: Ipinapakita ng “tagapamahala” ang bigat ng banal na pagtatalaga at aktuwal na pamamahala, ngunit hindi nito ipinipilit ang mas espesipikong titulong “hari” na wala sa mismong salita rito.
- issue: Ang kolektibong pang-isahan sa צַעֲקָתוֹ
  choice: kanilang daing
  alternative: kanyang daing
  rationale: Ang pang-isahang hulapi sa Hebreo ay bumabalik sa kolektibong pangngalang “aking bayan.” Nililinaw ng “kanilang” ang tinutukoy nang hindi binabago ang kolektibong hinaing.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayang Israel,” “tagapamahala,” at “daing” upang mapanatili ang biblikal na dignidad nang hindi nagiging lipas o labis na teknikal.
