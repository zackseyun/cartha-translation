base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/004.yaml
  text: He passed through the hill country of Ephraim and passed through the land of Shalishah[a], but they did not find them. Then they passed through the land of Shaalim, but they were not there. Then he passed through the land of Benjamin[b], but they did not find them.
translation:
  language: tl
  text: Dumaan siya sa kaburulan ng Efraim at sa lupain ng Salisa, ngunit hindi nila natagpuan ang mga asno.[a] Pagkatapos, dumaan sila sa lupain ng Saalim, ngunit wala roon ang mga ito.[b] Pagkatapos, dumaan siya sa lupain ng Benjamin, ngunit hindi nila natagpuan ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Walang tahasang layon sa Hebreo; idinagdag sa salin ang “mga asno” mula sa naunang konteksto.
    reason: implicit_object
  - marker: b
    text: 'Sa Hebreo: “at wala” o “at walang anuman,” isang eliptikong pahayag na nangangahulugang wala roon ang mga asno.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר / וַיַּעַבְרוּ
  choice: dumaan siya / dumaan sila
  rationale: Ang עבר na may בְ ay tumutukoy sa pagdaan sa isang rehiyon. Pinananatili rin ng salin ang pagpapalit ng Hebreo sa isahan at maramihan.
- source_word: בְּהַר אֶפְרַיִם
  choice: sa kaburulan ng Efraim
  rationale: Sa heograpikong pariralang ito, ang הַר ay isang bulubundukin o maburol na rehiyon, hindi lamang iisang burol.
- source_word: אֶרֶץ שָׁלִשָׁה
  choice: sa lupain ng Salisa
  rationale: Ang אֶרֶץ ay tumutukoy dito sa isang pinangalanang teritoryo; isina-Filipino ang baybay ng pangalang Hebreo.
- source_word: וְלֹא מָצָאוּ
  choice: ngunit hindi nila natagpuan ang mga asno
  rationale: Maramihan ang pandiwa, na tumutukoy kay Saul at sa kanyang lingkod. Walang tahasang layon sa Hebreo, ngunit malinaw sa naunang konteksto na ang hinahanap ay ang mga nawawalang asno.
- source_word: אֶרֶץ שַׁעֲלִים
  choice: sa lupain ng Saalim
  rationale: Pinananatili itong pangalan ng isang teritoryo at isina-Filipino ang transliterasyon.
- source_word: וָאַיִן
  choice: ngunit wala roon ang mga ito
  rationale: Ang maikling pahayag na Hebreo ay literal na ‘at wala’; natural na ipinahahayag sa Filipino ang ipinahihiwatig na kawalan doon ng mga asno.
- source_word: אֶרֶץ יְמִינִי
  choice: sa lupain ng Benjamin
  rationale: Ang יְמִינִי ay anyong pang-uri o pantawag sa lipi na kaugnay ng Benjamin; sa heograpikong konteksto, malinaw at natural ang ‘lupain ng Benjamin.’
