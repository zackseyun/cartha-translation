  yaml_path: translation/ot/1_samuel/009/010.yaml
  text: Then Saul said to his young man[a], “Your word is good. Come[b], let us go.” So they went to the city where the man of God was.
translation:
  language: tl
  text: Sinabi ni Saul sa kasama niyang binata, “Mabuti ang sinabi mo.[a] Halika, pumunta tayo.” Kaya nagtungo sila sa lungsod kung saan naroon ang tao ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Mabuti ang iyong salita”; ibig sabihin, “Mabuti ang mungkahi mo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “tao ng Diyos” ay isang titulong Hebreo na karaniwang ginagamit para sa isang propeta o taong nagsasalita para sa Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: binatang kasama niya
  rationale: Pinananatili ng “binata” ang pangunahing diwa ng נַעַר bilang isang kabataang lalaki, habang nililinaw ng “kasama niya” ang papel nito sa tagpo nang hindi agad nililimitahan sa pormal na katawagang “lingkod.”
- source_word: טוֹב דְּבָרְךָ
  choice: Mabuti ang sinabi mo
  rationale: Maaaring tumukoy ang דָּבָר sa salita, sinabi, usapin, o mungkahi. Sa konteksto, sinasang-ayunan ni Saul ang mungkahi ng kasama niya; natural sa Tagalog ang “Mabuti ang sinabi mo” at nananatiling malapit sa Hebreo.
- source_word: לְכָה נֵלֵכָה
  choice: Halika, pumunta tayo
  rationale: Pinagsasama ng parirala ang paanyayang “halika” at ang hortatoryong “pumunta tayo,” kaya napapanatili ang puwersa ng sama-samang pagkilos.
- source_word: הָעִיר
  choice: lungsod
  rationale: Karaniwang kahulugan ng עִיר ang lungsod o bayan. Ginamit ang “lungsod” bilang tuwirang katumbas ng tiyak na anyong Hebreo.
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Tuwirang isinasalin ang kinikilalang titulong Hebreo sa halip na palitan ito ng interpretatibong “propeta,” kaya napapanatili ang sariling teolohikal na pananalita ng teksto.
- source_word: אֲשֶׁר שָׁם
  choice: na kinaroroonan
  rationale: Natural na ipinahahayag ng “na kinaroroonan” ang kaugnay na parirala at lokatibong “doon” sa salaysay.
theological_decisions:
- issue: Pagsasalin sa titulong אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  alternative: propeta
  rationale: Bagaman madalas tumutukoy ang titulo sa isang propeta o tagapagsalita ng Diyos, “tao ng Diyos” mismo ang ginamit ng Hebreo. Pinananatili ng tuwirang salin ang katawagan ng teksto nang hindi ipinapalit ang isang pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “binatang kasama niya” upang maiwasan ang malabong “kanyang binata” at ang mas makitid na “lingkod.” Ang “Halika, pumunta tayo” ay natural na paanyaya ngunit hindi kolokyal na gaya ng “Tara.”
