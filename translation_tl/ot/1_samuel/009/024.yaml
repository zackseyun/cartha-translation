  text: וַ/יָּ֣רֶם הַ֠/טַּבָּח אֶת הַ/שּׁ֨וֹק וְ/הֶ/עָלֶ֜י/הָ וַ/יָּ֣שֶׂם לִ/פְנֵ֣י שָׁא֗וּל וַ/יֹּ֨אמֶר֙ הִנֵּ֤ה הַ/נִּשְׁאָר֙ שִׂים לְ/פָנֶ֣י/ךָ אֱכֹ֔ל כִּ֧י לַ/מּוֹעֵ֛ד שָֽׁמוּר לְ/ךָ֥ לֵ/אמֹ֖ר הָ/עָ֣ם קָרָ֑אתִי וַ/יֹּ֧אכַל שָׁא֛וּל עִם שְׁמוּאֵ֖ל בַּ/יּ֥וֹם הַ/הֽוּא־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/024.yaml
  text: So the cook took up the leg and what was on it and set it before Saul[a]. And he said, “Look, what has been kept is set before you. Eat, because it was kept for you for the appointed time, from when I said[d][c][b], ‘I have invited the people.’” So Saul ate with Samuel that day.
translation:
  language: tl
  text: Kaya kinuha ng tagapagluto ang bahagi ng hita[a] at ang nakapatong dito[b], at inilagay niya ang mga ito sa harap ni Saul. Sinabi niya, “Narito, ang itinabi[c] ay nasa harap mo. Kumain ka nito, sapagkat itinabi ito para sa iyo para sa itinakdang pagkakataon, nang sabihin ko, ‘Inanyayahan[d] ko ang mga tao.’” Kaya kumain si Saul kasama ni Samuel nang araw na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bahagi ng paa.” Ang Hebreong שׁוֹק ay tumutukoy sa bahagi ng paa ng hayop, na maaaring ilarawang hita o binti depende sa paraan ng paghihiwa.
    reason: lexical_alternative
  - marker: b
    text: Literal na “at ang nasa ibabaw nito.” Hindi tahasang tinutukoy ng Hebreo kung anong bahagi ang kasama ng hita.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang natira.” Ang salitang Hebreo ay maaaring tumukoy sa natirang bahagi o sa bahaging sadyang inilaan; mas pinapaboran ng konteksto ang huli.
    reason: alternative_reading
  - marker: d
    text: Maaari ring “Tinawag ko ang mga tao.” Sa konteksto ng salu-salo, malamang na “inanyayahan” ang diwa ng pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטַּבָּח
  choice: ang tagapagluto
  rationale: Sa konteksto ng handaan, ang tinutukoy ay ang naghanda at nagsilbi ng karne. Mas natural dito ang “tagapagluto” kaysa “mangangatay,” bagaman maaari ring taglayin ng salitang Hebreo ang huling diwang iyon.
- source_word: הַשּׁוֹק
  choice: ang bahagi ng hita
  rationale: Tumutukoy ang שׁוֹק sa bahagi ng paa ng hayop. Malinaw at natural sa Filipino ang “bahagi ng hita” nang hindi labis na tinutukoy ang eksaktong hiwa.
- source_word: וְהֶעָלֶיהָ
  choice: at ang nakapatong dito
  rationale: Literal na sinasabi ng Hebreo na “at ang nasa ibabaw nito.” Hindi pinapangalanan ng teksto ang kasamang bahagi, kaya pinanatili ang pagiging di-tiyak nito.
- source_word: הַנִּשְׁאָר
  choice: ang itinabi
  rationale: Maaari itong mangahulugang “ang natira,” ngunit ipinapakita ng kasunod na pangungusap na sadyang inilaan ang bahaging ito para kay Saul. Ang “itinabi” ay likas sa konteksto ngunit hindi lubusang nag-aalis sa alternatibong pagbasa, na inilagay sa talababa.
- source_word: שִׂים לְפָנֶיךָ
  choice: Ilagay mo ito sa harap mo
  rationale: Pinanatili ang tahasang pautos na anyo ng Hebreo. Bagaman tila inuulit nito ang naunang pagkakalagay ng pagkain sa harap ni Saul, hindi pinakinis ang tensiyong iyon sa pamamagitan ng pagpapalit sa balintiyak.
- source_word: לַמּוֹעֵד
  choice: para sa takdang oras
  rationale: Ang מוֹעֵד ay isang itinakdang oras o okasyon. Pinananatili ng saling ito ang diwa ng sinadyang paghahanda nang hindi ito ginagawang teknikal na katawagan para sa isang kapistahan.
- source_word: שָׁמוּר לְךָ
  choice: itinabi ito para sa iyo
  rationale: Ang anyong balintiyak mula sa שמר ay nagpapahiwatig na sadyang iningatan o inilaan ang bahagi para kay Saul. Karaniwan at malinaw sa Filipino ang “itinabi para sa iyo.”
- source_word: לֵאמֹר הָעָם קָרָאתִי
  choice: mula nang sabihin ko, ‘Inanyayahan ko ang mga tao’
  rationale: Masinsin at bahagyang malabo ang ugnayang sintaktiko sa Hebreo. Ang “mula nang sabihin ko” ay nagbibigay ng natural na temporal na ugnayan, samantalang ang “inanyayahan” ang malamang na diwa ng קרא sa konteksto ng salu-salo.
- source_word: עִם שְׁמוּאֵל
  choice: kasama ni Samuel
  rationale: Direkta at likas nitong ipinapahayag ang magkasamang pagkain nina Saul at Samuel.
