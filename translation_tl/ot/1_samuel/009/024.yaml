  - severity: medium
    issue: Ang “mula nang sabihin ko” ay labis na tinutukoy ang temporal na relasyon.
    rationale: Ang לֵאמֹר ay compressed at maaaring magpakilala ng sinabi/kaakibat na pahayag; hindi nito tahasang hinihingi ang ideyang ‘mula nang.’ Ang “nang sabihin ko” ay mas maingat.
  - severity: low
    issue: Maling kinalalagyan ng talababa a.
    rationale: Ang talababa ay tungkol sa שׁוֹק (‘hita’/‘bahagi ng paa’), kaya dapat nakaangkla sa “hita,” hindi sa “Saul.”
