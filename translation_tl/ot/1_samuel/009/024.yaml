revisions:
- from: Kaya kinuha ng tagapagluto ang bahagi ng hita[a] at ang nakapatong dito[b], at inilagay iyon sa harap ni Saul. Sinabi niya, “Narito ang itinabi[c]. Ilagay mo ito sa harap mo at kumain ka, sapagkat itinabi ito para sa iyo para sa takdang oras, mula nang sabihin ko, ‘Inanyayahan[d] ko ang mga tao.’” Kaya kumain si Saul kasama ni Samuel nang araw na iyon.
  to: Kaya kinuha ng tagapagluto ang bahagi ng hita[a] at ang nakapatong dito[b], at inilagay niya ang mga ito sa harap ni Saul. Sinabi niya, “Narito, ang itinabi[c] ay nasa harap mo. Kumain ka nito, sapagkat itinabi ito para sa iyo para sa itinakdang pagkakataon, nang sabihin ko, ‘Inanyayahan[d] ko ang mga tao.’” Kaya kumain si Saul kasama ni Samuel nang araw na iyon.
  rationale: Inayos ang idiomatikong panawagan na kumain, inalis ang hindi kinakailangang implikasyong temporal ng “mula nang,” ginawang mas likas ang pagtukoy sa itinakdang okasyon ng handaan, at itinama ang anchor ng talababa a. Pinanatili ang di-pagtukoy sa eksaktong bagay na nakapatong sa bahagi ng paa at ang alternatibong pagbasa ng “itinabi/natira.”
