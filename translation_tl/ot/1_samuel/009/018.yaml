  text: Then Saul approached Samuel in the midst of the gate and said[b][a], “Please tell me where the seer’s house is.”
translation:
  language: tl
  text: Lumapit si Saul kay Samuel sa loob ng pintuang-bayan at sinabi, “Pakisabi sa akin kung nasaan ang bahay ng tagakita[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tagakita” ay dating katawagan sa Israel para sa mas karaniwang tinatawag na “propeta”; ipinaliliwanag ito ng salaysay sa 1 Samuel 9:9.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: Lumapit
  rationale: Ang pandiwang נגשׁ ay tumutukoy sa paglapit sa isang tao; natural at tuwiran itong naipahahayag ng “lumapit.”
- source_word: בְּתוֹךְ הַשָּׁעַר
  choice: sa loob ng pintuang-bayan
  rationale: Ang שַׁעַר sa ganitong konteksto ay maaaring tumukoy sa buong pasukan ng bayan, hindi lamang sa pinto; nililinaw ito ng “pintuang-bayan,” samantalang pinananatili ng “sa loob” ang diwa ng בְּתוֹךְ.
- source_word: הַגִּידָה נָּא לִי
  choice: Pakisabi po sa akin
  rationale: Ang pautos na הַגִּידָה kasama ng magalang na נָא ay isang magalang na pakiusap. Ang “pakisabi po” ay natural sa modernong Tagalog at ipinahihiwatig ang paggalang sa kausap.
- source_word: אֵי זֶה
  choice: kung nasaan
  rationale: Sa konteksto, humihingi si Saul ng lokasyon. Ang “kung nasaan” ang natural na Tagalog para sa ganitong di-tuwirang tanong pagkatapos ng “pakisabi.”
- source_word: בֵּית הָרֹאֶה
  choice: ang bahay ng tagakita
  rationale: Pinananatili ng “tagakita” ang mas lumang katawagang רֹאֶה sa halip na gawing “propeta,” alinsunod sa paliwanag ng salaysay sa 1 Samuel 9:9. Ang “bahay ng tagakita” ay natural na anyong paari sa Tagalog.
theological_decisions:
- issue: Pagkakakilanlan ng רֹאֶה
  choice: tagakita
  alternative: propeta
  rationale: Hindi agad pinapantay sa salin ang dalawang katawagan sapagkat sadyang ipinaliliwanag ng salaysay sa 1 Samuel 9:9 na “tagakita” ang dating tawag sa tinatawag na “propeta” nang panahong isinasalaysay.
translation_notes:
  register: Modernong Filipino Tagalog na magalang, malinaw, at marangal. Ginamit ang “po” upang natural na katawanin ang magalang na pakiusap na may נָא. Ang “pintuang-bayan” ay tumutukoy sa pasukan o gateway complex ng bayan.
