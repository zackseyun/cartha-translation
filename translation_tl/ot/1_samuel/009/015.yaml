  yaml_path: translation/ot/1_samuel/009/015.yaml
  text: Yahweh had revealed to Samuel one day before Saul came[a], saying,
translation:
  language: tl
  text: 'Isang araw bago dumating si Saul, ipinaalam na ni Yahweh kay Samuel[a] ang ganito:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “ibinunyag ni Yahweh ang tainga ni Samuel,” isang idyomang nangangahulugang may ipinaalam o isiniwalat sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: ni Yahweh
  rationale: Ginamit ang pangalang tipan na “Yahweh” para sa יהוה. Hindi isinalin nang hiwalay ang waw bilang “at” dahil sa Filipino, sapat na ang ayos ng pangungusap upang natural na ipagpatuloy ang salaysay.
- source_word: גָּלָה אֶת־אֹזֶן שְׁמוּאֵל
  choice: ipinaalam na ... kay Samuel
  rationale: Ang literal na idyomang “ibinunyag ang tainga ni Samuel” ay nangangahulugang lihim o tuwirang pagsisiwalat ng impormasyon. Ang “ipinaalam” ay malinaw at natural sa modernong Filipino; ipinapaliwanag sa talababa ang larawan sa Hebreo.
- source_word: יוֹם אֶחָד לִפְנֵי בּוֹא שָׁאוּל
  choice: Isang araw bago dumating si Saul
  rationale: Tuwirang pinananatili ang isang-araw na agwat at ginagawang likas na sugnay sa Filipino ang infinitive construct na בּוֹא.
- source_word: לֵאמֹר
  choice: 'ang ganito:'
  rationale: Ipinakikilala nito ang tuwirang pahayag na kasunod sa susunod na talata. Mas natural sa Filipino ang “ang ganito:” kaysa sa literal na “na sinasabi,” habang pinananatili ang tungkulin ng pormulang Hebreo.
theological_decisions:
- issue: Pag-render sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang pangalan ng Diyos ang יהוה sa teksto; pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalang tipan nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Inuna ang pariralang pamanahon upang maging maayos ang daloy, at ginamit ang “ipinaalam” para sa pribadong pagsisiwalat sa halip na “ipinahayag,” na maaaring magpahiwatig ng pampublikong pagpapahayag.
