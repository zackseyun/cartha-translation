  text: לְ/פָנִ֣ים בְּ/יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר הָ/אִישׁ֙ בְּ/לֶכְתּ/וֹ֙ לִ/דְר֣וֹשׁ אֱלֹהִ֔ים לְכ֥וּ וְ/נֵלְכָ֖ה עַד הָ/רֹאֶ֑ה כִּ֤י לַ/נָּבִיא֙ הַ/יּ֔וֹם יִקָּרֵ֥א לְ/פָנִ֖ים הָ/רֹאֶֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/009.yaml
  text: Formerly in Israel[a], when a man went to inquire of God, he would say, “Come, and let us go to the seer,” for the prophet of today was formerly called the seer.
translation:
  language: tl
  text: Noong unang panahon sa Israel[a], kapag pumupunta ang isang lalaki upang sumangguni sa Diyos, sinasabi niya, “Halikayo, pumunta tayo sa tagakita,” sapagkat ang tinatawag ngayong propeta ay tinatawag noon na tagakita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Dati sa Israel, kapag pumupunta ang isang lalaki upang hanapin ang Diyos, sinasabi niya, ‘Halikayo, pumunta tayo sa tagakita.’”'
    reason: Ipinapakita ang alternatibong pagsasalin ng לְפָנִים bilang “dati” at ng לִדְרֹשׁ אֱלֹהִים bilang “hanapin ang Diyos.”
lexical_decisions:
- source_word: לְפָנִים
  choice: noong unang panahon / noon
  rationale: Ipinapahayag nito ang dating panahon at pinananatili ang paghahambing ng dalawang paglitaw ng salita sa talata.
- source_word: כֹּה אָמַר
  choice: sinasabi niya
  rationale: Bagaman literal na “ganito ang sinabi,” ipinahihiwatig ng konteksto ang nakaugaliang pananalita noon; natural itong ipinapahayag sa Filipino sa aspektong imperpektibo.
- source_word: הָאִישׁ
  choice: isang lalaki
  rationale: Pangkalahatan ang gamit ng panlalaking pangngalan, hindi pagtukoy sa isang partikular na tao; pinananatili ng salin ang anyong panlalaki ng Hebreo.
- source_word: לִדְרֹשׁ אֱלֹהִים
  choice: upang sumangguni sa Diyos
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa paghingi ng banal na patnubay, na ginagawa sa pamamagitan ng pagpunta sa isang propetikong tagapamagitan.
- source_word: לְכוּ וְנֵלְכָה
  choice: Halikayo, pumunta tayo
  rationale: Pinananatili ang dalawang bahagi ng Hebreo—isang maramihang pautos at isang paanyayang sama-samang kumilos—sa natural at marangal na Filipino.
- source_word: הָרֹאֶה
  choice: tagakita
  rationale: Ito ang maikli at nakaugaliang katawagan sa isang propetikong taong “nakakakita,” at malinaw na naihahambing sa “propeta.”
- source_word: לַנָּבִיא הַיּוֹם
  choice: ang tinatawag ngayong propeta
  rationale: Ipinapakita nito ang pananaw ng tagapagsalaysay na ang katawagang ginagamit sa kanyang panahon ay “propeta.”
- source_word: יִקָּרֵא לְפָנִים הָרֹאֶה
  choice: ay tinatawag noon na tagakita
  rationale: Inihahatid ang paliwanag tungkol sa mas matandang katawagan nang hindi ipinapalagay na magkaiba ang tinutukoy na tungkulin.
theological_decisions:
- issue: Pagsasalin sa pangkalahatang panlalaking הָאִישׁ
  choice: isang lalaki
  alternative: isang tao / sinuman
  rationale: Panlalaking isahan ang tahasang anyo ng Hebreo at pangkalahatan ang gamit nito. Pinananatili ito nang hindi nagdaragdag ng anumang doktrinal na pahiwatig.
- issue: Kahulugan ng דָּרַשׁ אֱלֹהִים sa kontekstong propetiko
  choice: sumangguni sa Diyos
  alternative: hanapin ang Diyos / magtanong sa Diyos
  rationale: Ang agarang konteksto ay pagpunta sa tagakita upang humingi ng patnubay mula sa Diyos. Ang “sumangguni” ay nagpapanatili sa konsultatibong diwa nang hindi nilulutas ang lahat ng posibleng lawak ng pandiwa.
- issue: Ugnayan ng “propeta” at “tagakita”
  choice: ang tinatawag ngayong propeta ay tinatawag noon na tagakita
  alternative: ang propeta ngayon ay dating tinatawag na tagakita
  rationale: Pinananatili ng napiling anyo ang paliwanag tungkol sa pagbabago ng katawagan at iniiwasang magpahiwatig na magkaibang uri ng tao o tungkulin ang dalawang termino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Halikayo” sa halip na mas kolokyal na “Tara,” at ang teknikal ngunit madaling maunawaang “tagakita” upang mapanatili ang mahalagang paghahambing sa “propeta.”
