  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תֹּאבַ֨דְנָה֙ הָ/אֲתֹנ֔וֹת לְ/קִ֖ישׁ אֲבִ֣י שָׁא֑וּל וַ/יֹּ֨אמֶר קִ֜ישׁ אֶל שָׁא֣וּל בְּנ֗/וֹ קַח נָ֤א אִתְּ/ךָ֙ אֶת אַחַ֣ד מֵֽ/הַ/נְּעָרִ֔ים וְ/ק֣וּם לֵ֔ךְ בַּקֵּ֖שׁ אֶת הָ/אֲתֹנֹֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/003.yaml
  text: The donkeys belonging to Kish[a], Saul’s father, were lost. So Kish said to Saul his son, “Please take with you one of the young men, and get up, go[b], seek the donkeys.”
translation:
  language: tl
  text: Nawala ang mga asno[a] ni Kish, na ama ni Saul. Kaya sinabi ni Kish sa anak niyang si Saul, “Pakisuyo, isama mo ang isa sa mga kabataang lalaki[b]. Bumangon ka, humayo ka, at hanapin mo ang mga asno.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga babaeng asno.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring tumukoy sa mga lingkod o mga alalay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאבַדְנָה
  choice: Nawala
  rationale: Likas na salin sa Filipino para sa mga hayop na hindi na matagpuan; hindi nito ipinahihiwatig na namatay sila.
- source_word: הָאֲתֹנוֹת
  choice: mga asno
  rationale: Tiyak na babaeng asno ang tinutukoy ng Hebreo, ngunit karaniwang hindi tinutukoy ang kasarian sa natural na salaysay sa Filipino; nililinaw ito sa talababa.
- source_word: לְקִישׁ
  choice: ni Kish
  rationale: Ipinapahayag ng pang-ukol na Hebreo ang pagmamay-ari; natural itong isinasaad sa Filipino sa pamamagitan ng “ni Kish.”
- source_word: אֲבִי שָׁאוּל
  choice: na ama ni Saul
  rationale: Malinaw at natural na aposisyon sa Filipino na pinananatili ang pagkakakilanlan ni Kish.
- source_word: קַח נָא אִתְּךָ
  choice: Pakisuyo, isama mo
  rationale: Ang “pakisuyo” ay nagpapahayag ng pagpapalambot ng utos na dala ng נָא, at ang “isama mo” ay natural na katumbas ng pagkuha ng kasama.
- source_word: אַחַד מֵהַנְּעָרִים
  choice: isa sa mga kabataang lalaki
  rationale: Pinananatili ang pangunahing kahulugan ng נְעָרִים nang hindi tiyakang ipinapasok ang papel na alipin o tagapaglingkod; inilalahad sa talababa ang posibleng kahulugang panlipunan.
- source_word: וְקוּם לֵךְ
  choice: Bumangon ka, humayo ka
  rationale: Pinananatili ang dalawang magkasunod na pautos at ang diin sa agarang pagkilos, sa dignified ngunit malinaw na Filipino.
- source_word: בַּקֵּשׁ
  choice: hanapin mo
  rationale: Natural na pandiwa sa Filipino para sa praktikal na paghahanap sa mga nawawalang hayop.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “humayo” upang mapanatili ang hiwalay na pautos na “pumunta” kasunod ng “bumangon,” nang hindi nagiging labis na kolokyal. Inilagay ang mga pananda ng talababa sa mismong mga salitang tinatalakay.
