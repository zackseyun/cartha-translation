base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/008.yaml
  text: The young man answered Saul again and said[a], “Look, I have in my hand a quarter shekel of silver. I will give it to the man of God, and he will tell us our way.”
translation:
  language: tl
  text: Muling sumagot ang binata kay Saul at nagsabi, “Tingnan mo, sa kamay ko ay may isang-kapat na siklo ng pilak. Ibibigay ko ito sa tao ng Diyos, at sasabihin niya sa atin ang ating daan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang daang dapat nating tahakin.” Literal sa Hebreo, “ang ating daan,” na maaaring tumukoy sa ruta nila o sa dapat nilang gawin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף ... לַעֲנוֹת
  choice: Muling sumagot
  rationale: Ipinahahayag nito ang paulit o karagdagang pagsagot na nasa idyomang יסף + pawatas, sa natural na Tagalog.
- source_word: הַנַּעַר
  choice: ang binata
  rationale: Maaaring mangahulugan ang נער ng bata, kabataan, o tagapaglingkod. Ang “binata” ay nagpapanatili sa diwa ng kabataang lalaki nang hindi labis na tinutukoy ang kaniyang tungkulin.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Likas na panawag-pansin ito sa modernong Tagalog at katumbas ng deiktikong gamit ng הִנֵּה.
- source_word: נִמְצָא בְיָדִי
  choice: mayroon akong
  rationale: Ang literal na “matatagpuan sa aking kamay” ay idyoma ng pag-aari; ang “mayroon akong” ang natural na katumbas sa Tagalog.
- source_word: רֶבַע שֶׁקֶל כָּסֶף
  choice: isang kapat ng siklong pilak
  rationale: Pinananatili nito ang sinaunang yunit ng timbang at ang eksaktong bahaging tinutukoy.
- source_word: וְנָתַתִּי
  choice: Ibibigay ko ito
  rationale: Ang anyong qatal ay nagpapahayag dito ng nilalayong gagawin; malinaw at natural ang panghinaharap na salin.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: sa lingkod ng Diyos
  rationale: Ang אישׁ האלהים ay isang kinikilalang titulo para sa taong inatasan ng Diyos. Ang “lingkod ng Diyos” ay natural at marangal sa Tagalog, bagaman hindi nito literal na inuulit ang salitang “lalaki.”
- source_word: וְהִגִּיד לָנוּ
  choice: at sasabihin niya sa atin
  rationale: Tumpak at karaniwang Tagalog ito para sa Hiphil ng נגד, na nangangahulugang ipahayag o ipaalam.
- source_word: אֶת דַּרְכֵּנוּ
  choice: ang ating daan
  rationale: Pinananatili nito ang literal at sadyang malawak na larawan ng Hebrew, na maaaring tumukoy sa ruta o sa nararapat na hakbang.
