  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ שְׁמוּאֵ֔ל קָרַ֨ע יְהוָ֜ה אֶֽת מַמְלְכ֧וּת יִשְׂרָאֵ֛ל מֵ/עָלֶ֖י/ךָ הַ/יּ֑וֹם וּ/נְתָנָ֕/הּ לְ/רֵעֲ/ךָ֖ הַ/טּ֥וֹב מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/028.yaml
  text: And Samuel said to him[a], “Yahweh has torn the kingdom of Israel away from you today and has given it to your neighbor[b], who is better than you.”
translation:
  language: tl
  text: At sinabi ni Samuel sa kanya, “Ngayon ay pinunit ni Yahweh ang kaharian ng Israel[a] mula sa iyo at ibinigay niya ito sa kapwa mo[b], na mas mabuti kaysa sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang paghahari sa Israel.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “kasama mo,” “kaibigan mo,” o “kapitbahay mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו שְׁמוּאֵל
  choice: At sinabi sa kanya ni Samuel
  rationale: Isinusulong ng waw-consecutive ang salaysay. Ang “At sinabi” ay natural sa marangal na salaysay sa Filipino at hindi nagdaragdag ng ugnayang higit sa ipinahihiwatig ng Hebreo.
- source_word: קָרַע
  choice: Pinunit ... mula sa iyo
  rationale: Pinananatili ng “pinunit” ang matingkad na metapora at ang tuwirang ugnayan sa pagkapunit ng laylayan ng balabal ni Samuel sa naunang talata. Ipinahahayag ng “mula sa iyo” ang pag-aalis kay Saul.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang Hebreo sa transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: מַמְלְכוּת יִשְׂרָאֵל
  choice: ang kaharian ng Israel
  rationale: Maaaring tumukoy ang מַמְלְכוּת sa kaharian o paghahari. Natural sa Filipino ang “kaharian ng Israel,” habang nililinaw sa talababa ang posibleng diwang “paghahari sa Israel.”
- source_word: מֵעָלֶיךָ
  choice: mula sa iyo
  rationale: Malinaw at natural nitong ipinahahayag ang pag-aalis ng kaharian mula sa kapangyarihan o pag-aari ni Saul.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Natural na modernong katumbas ito ng “sa araw na ito” at pinananatili ang agarang bigat ng hatol.
- source_word: וּנְתָנָהּ
  choice: at ibinigay iyon
  rationale: Ang ganap na anyo ng pandiwa sa pahayag ng hatol ay inilalarawan bilang tiyak at napagpasyahan nang pagkilos ng Diyos.
- source_word: לְרֵעֲךָ
  choice: sa kapwa mo
  rationale: 'Malawak ang saklaw ng רֵעַ: kapwa, kasama, o kapitbahay. Ang “kapwa mo” ay hindi nagpapalagay na matalik na kaibigan ni Saul ang tinutukoy.'
- source_word: הַטּוֹב מִמֶּךָּ
  choice: na higit na mabuti kaysa sa iyo
  rationale: Tuwirang pinananatili nito ang paghahambing sa Hebreo at malinaw na inilalarawan ang taong tatanggap ng kaharian.
theological_decisions:
- issue: Kung natapos na o mangyayari pa lamang ang pag-aalis at pagbibigay ng kaharian
  choice: 'Natapos na/tiyak na atas: “Pinunit ... at ibinigay”'
  alternative: 'Panghinaharap: “Pupunitin ... at ibibigay”'
  rationale: Ang mga pandiwang ganap sa pahayag ng propetikong hatol ay naglalahad sa pasya ng Diyos bilang tiyak at para bang naisagawa na, kahit ang ganap na katuparan nito sa kasaysayan ay darating pa.
- issue: Kahulugan ng מַמְלְכוּת bilang nasasakupan o kapamahalaan
  choice: “kaharian ng Israel,” na may talababa para sa “paghahari sa Israel”
  alternative: “paghahari sa Israel” sa pangunahing teksto
  rationale: Pinananatili ng “kaharian” ang karaniwang kongkretong diwa ng salita, samantalang kinikilala ng talababa na ang inililipat sa konteksto ay ang karapatang maghari.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang literal na larawang “pinunit” dahil mahalaga ang alingawngaw nito sa simbolikong pagkapunit ng balabal sa naunang talata. Iniwasan ang sobrang pagpapaliwanag sa pangunahing teksto at inilagay sa mga talababa ang tunay na mga alternatibong leksikal.
