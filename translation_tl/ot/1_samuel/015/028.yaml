    issue: Medyo pilit ang ayos ng mga pang-abay at pariralang pang-ukol sa pangunahing pangungusap.
    rationale: Ang “mula sa iyo ngayon” bago ang layon ay nauunawaan ngunit hindi pinakanatural. Hindi hinihingi ng Hebreo ang gayong ayos sa Filipino.
  - severity: medium
    issue: Ang alternatif na “kababayan mo” sa talababa para sa רֵעַ ay masyadong tiyak.
    rationale: Ang רֵעַ ay maaaring mangahulugang kapwa, kasama, kaibigan, o kapitbahay, ngunit walang batayan sa talata upang tukuyin itong kababayan.
