  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa: si Samuel ay nagsasalita kay Saul; si Yahweh ang nagpunit/nag-alis ng kaharian ng Israel mula sa kanya sa araw na iyon at ibinigay ito sa kanyang רֵעַ, na mas mabuti kaysa sa kanya. Pinananatili rin ng saling ganap na pandiwa ang decretive o tiyak-na-hatol na bisa ng mga perfect sa Hebreo.'
  naturalness: May bahagyang di-natural na ayos sa “Pinunit ni Yahweh mula sa iyo ngayon ang kaharian ng Israel.” Mas malinaw at mas natural sa modernong Filipino ang paglalagay ng “ngayon” sa unahan at ng layon kasunod ng pandiwa. Ang “At sinabi ni Samuel sa kanya” ay mas karaniwang ayos kaysa “At sinabi sa kanya ni Samuel.”
  terminology: Ang “Yahweh,” “kaharian ng Israel,” at “mas mabuti kaysa sa iyo” ay angkop. Ang “kapwa mo” ay maaaring tumukoy sa רֵעַ ngunit medyo malabo sa kasalukuyang gamit; pinananatili ito sa pangunahing teksto bilang malawak na katumbas, habang itinatama ang talababa upang huwag magmungkahi ng “kababayan,” na hindi kinakailangang kahulugan ng Hebreo.
  issues:
