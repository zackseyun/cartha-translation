revisions:
- from: At sinabi sa kanya ni Samuel, “Pinunit ni Yahweh mula sa iyo ngayon ang kaharian ng Israel[a] at ibinigay iyon sa kapwa mo[b], na higit na mabuti kaysa sa iyo.”
  to: At sinabi ni Samuel sa kanya, “Ngayon ay pinunit ni Yahweh ang kaharian ng Israel[a] mula sa iyo at ibinigay niya ito sa kapwa mo[b], na mas mabuti kaysa sa iyo.”
  rationale: Inayos ang ayos ng pangungusap para sa likas na modernong Filipino nang hindi binabago ang diin ng “ngayon,” ang metapora ng pagpunit, o ang completed/decretive na aspekto ng hatol. Pinalitan ang hindi suportadong “kababayan mo” sa talababa ng mga leksikal na alternatibong saklaw ng רֵעַ.
