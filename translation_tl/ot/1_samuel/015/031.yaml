  yaml_path: translation/ot/1_samuel/015/031.yaml
  text: So Samuel went back after Saul[a], and Saul bowed down to Yahweh.
translation:
  language: tl
  text: Kaya bumalik si Samuel at sumunod kay Saul, at yumukod[a] si Saul sa PANGINOON.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sumamba sa PANGINOON.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagyukod o sa pagsamba, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Ang pandiwang שׁוב ay nagpapahiwatig ng pagbabalik; ang “bumalik” ay natural sa salaysay at pinananatili ang pagbabagong pasiya ni Samuel matapos niyang tumangging sumama kay Saul sa talata 26.
- source_word: אַחֲרֵי
  choice: na kasunod ni
  rationale: Literal itong “pagkatapos/sa likuran ni.” Sa konteksto, sumunod si Samuel kay Saul pabalik; pinananatili ng “kasunod ni” ang direksiyon nang hindi labis na binibigyang-kahulugan bilang simpleng pagsama lamang.
- source_word: וַיִּשְׁתַּחוּ
  choice: yumukod
  rationale: Ang pandiwang שׁחה ay tumutukoy sa pisikal na pagyukod o pagpapatirapa at maaari ring mangahulugang pagsamba ayon sa konteksto. Pinananatili ng “yumukod” ang konkretong kilos at ang tunay na lawak ng kahulugan.
- source_word: לַיהוָה
  choice: sa harap ng PANGINOON
  rationale: Ang לְ ay nagmamarka sa pinag-uukulan ng pagyukod. Ang “sa harap ng” ay likas na Filipino para sa pagyukod na iniuukol sa Diyos, at ang tipograpikong “PANGINOON” ang kumakatawan sa banal na pangalang יהוה.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Karaniwang anyo ng pangalan sa Filipino.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Karaniwang anyo ng pangalan sa Filipino.
theological_decisions:
- issue: Kung ang וַיִּשְׁתַּחוּ ay tahasang isasaling bilang pagsamba o bilang pisikal na pagyukod
  choice: “yumukod” sa pangunahing teksto
  alternative: “sumamba sa PANGINOON”
  rationale: Maaaring tumukoy ang Hebreong pandiwa sa pagyukod o sa pagsamba. Dahil ang PANGINOON ang pinag-uukulan, malinaw ang mapitagang oryentasyon ng kilos, ngunit hindi kailangang alisin ang pisikal na larawang taglay ng pandiwa. Kaya “yumukod” ang nasa teksto at inilalagay sa talababa ang “sumamba.”
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “na kasunod ni Saul” upang natural na maipahayag ang Hebreong אַחֲרֵי nang hindi binubura ang larawang si Samuel ay sumusunod sa kaniya. Inilagay ang talababa pagkatapos ng sugnay na “yumukod…sa harap ng PANGINOON,” sapagkat iyon ang salitang may leksikal na alternatibo.
