base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/029.yaml
  text: Moreover[a], the Glory of Israel will not lie, nor will he relent, for he is not a man[b], that he should relent.
translation:
  language: tl
  text: Bukod dito, ang Kaluwalhatian ng Israel[a] ay hindi magsisinungaling ni magbabago ng pasiya[b], sapagkat hindi siya tao upang magbago ng pasiya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang Walang Hanggan ng Israel,” “ang Lakas ng Israel,” o “ang Tagumpay ng Israel.” Malawak ang saklaw ng kahulugan ng titulong Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi uurong” o “hindi magsisisi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Bukod dito
  rationale: Ipinahihiwatig ang karagdagang mariing pahayag na nakaugnay sa naunang pagsaway.
- source_word: נֵצַח יִשְׂרָאֵל
  choice: ang Kaluwalhatian ng Israel
  rationale: Pinananatili ang marangal na anyo ng titulong tumutukoy sa Diyos, habang kinikilala sa talababa ang malawak at pinagtatalunang saklaw ng נֵצַח.
- source_word: יְשַׁקֵּר
  choice: ay hindi magsisinungaling
  rationale: 'Tuwirang ipinapahayag ang diwa ng piel ng שקר: magsinungaling o kumilos nang di-tapat.'
- source_word: וְלֹא יִנָּחֵם
  choice: ni magbabago ng pasiya
  rationale: Sa konteksto ng di-pagbawi ng hatol kay Saul, natural itong Filipino at pinananatili ang posibilidad ng pagbabago ng pasiya nang hindi nagpapahiwatig ng simpleng pagsisisi sa kasalanan.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng naunang pahayag sa marangal at likas na Filipino.
- source_word: לֹא אָדָם הוּא
  choice: hindi siya tao
  rationale: Tumutukoy ang אָדָם sa isang taong nilalang sa pangkalahatan, bilang paghahambing sa Diyos.
- source_word: לְהִנָּחֵם
  choice: na nagbabago ng pasiya
  rationale: Inuulit ang parehong salin ng נחם upang mapanatili ang leksikal na ugnayan ng dalawang paglitaw nito sa talata.
theological_decisions:
- issue: Paglalahad sa pagiging di-nagbabago ng Diyos nang hindi lumalampas sa konteksto
  choice: hindi magsisinungaling ni magbabago ng pasiya
  alternative: hindi magsisisi / hindi uurong
  rationale: Binibigyang-diin ng talata ang pagiging mapagkakatiwalaan ng Diyos at ang hindi niya pagbawi sa hatol kay Saul. Hindi nito ginagawang isang malawak na pilosopikal na pormula ang pahayag.
- issue: Ang kahulugan ng titulong נֵצַח יִשְׂרָאֵל
  choice: ang Kaluwalhatian ng Israel
  alternative: ang Walang Hanggan ng Israel / ang Lakas ng Israel / ang Tagumpay ng Israel
  rationale: Malawak ang semantikong saklaw ng נֵצַח. Pinananatili sa pangunahing teksto ang isang marangal na banal na titulo at inilalagay sa talababa ang iba pang tunay na posibleng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magbabago ng pasiya” bilang natural na katumbas ng נחם sa kontekstong ito; iniwasan ang “magbabago ng isip,” na maaaring tunog kolokyal, at ang “magsisisi,” na madaling ipakahulugang pagtalikod sa kasalanan.
