  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת פָּקַ֕דְתִּי אֵ֛ת אֲשֶׁר עָשָׂ֥ה עֲמָלֵ֖ק לְ/יִשְׂרָאֵ֑ל אֲשֶׁר שָׂ֥ם ל/וֹ֙ בַּ/דֶּ֔רֶךְ בַּ/עֲלֹת֖/וֹ מִ/מִּצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/002.yaml
  text: 'Thus says Yahweh of hosts: ‘I have taken note of what Amalek did to Israel[c][b][a], how he opposed him on the way when he came up from Egypt.’'
translation:
  language: tl
  text: 'Ganito ang sabi ni Yahweh ng mga hukbo: “Binigyang-pansin ko ang ginawa ng Amalek sa Israel—kung paano niya ito sinalungat sa daan nang umahon ito mula sa Ehipto.[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ito” ay tumutukoy sa Israel bilang isang sambayanan; isahan ang mga panghalip sa Hebreo.
    reason: cultural_note
  - marker: b
    text: Ang pandiwang isinaling “Binigyang-pansin ko” ay maaari ring mangahulugang “inalala” o “dinalaw upang hatulan.” Ang “sinalungat” ay maaari ring unawaing “hinarang” o, marahil, “tinambangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Natural na makabagong Filipino para sa pormulang mensahero o propeta, habang pinananatili ang pormal na pagpapahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: צְבָאוֹת
  choice: ng mga hukbo
  rationale: Pinananatili ang malawak na diwa ng צְבָאוֹת nang hindi nililimitahan sa hukbong tao lamang.
- source_word: פָּקַדְתִּי
  choice: Pinansin ko
  rationale: Ipinahahayag ang aktibong pagbibigay-pansin o pag-alaala na may layunin, ngunit hindi pa tahasang isinasalin bilang pagpaparusa; ang saklaw ng pandiwa ay inilalahad sa talababa.
- source_word: אֵת אֲשֶׁר עָשָׂה עֲמָלֵק לְיִשְׂרָאֵל
  choice: ang ginawa ng Amalek sa Israel
  rationale: Natural at sapat na malawak upang tukuyin ang masamang ginawa nang hindi nagdaragdag ng detalye.
- source_word: אֲשֶׁר שָׂם לוֹ בַּדֶּרֶךְ
  choice: kung paano niya ito sinalungat sa daan
  rationale: Ipinahahayag ang mapanlabang pagkilos ng Amalek laban sa Israel, habang hindi nililimitahan ang kahulugan sa tiyak na taktikang gaya ng pagtambang.
- source_word: לוֹ ... בַּעֲלֹתוֹ
  choice: ito ... nang umahon ito
  rationale: Ang mga panghalip na isahan sa Hebreo ay tumutukoy sa Israel bilang isang kolektibong pangngalan; ang “ito” ay natural sa Filipino para sa bansang Israel.
- source_word: מִמִּצְרָיִם
  choice: mula sa Ehipto
  rationale: Karaniwang salin ng pinanggalingan sa pariralang tumutukoy sa pag-alis ng Israel sa Ehipto.
theological_decisions:
- issue: Paglalahad sa banal na titulong יְהוָה צְבָאוֹת
  choice: Yahweh ng mga hukbo
  alternative: PANGINOON ng mga hukbo; Yahweh ng mga hukbong sandatahan
  rationale: Pinananatili ang personal na pangalan at ang malawak na saklaw ng titulong צְבָאוֹת, nang hindi ito nililimitahan sa mga hukbong tao.
- issue: Diwa ng banal na pag-alaala at paghatol sa פָּקַדְתִּי
  choice: Pinansin ko
  alternative: Pinarusahan ko; Inalala ko; Tutugunan ko
  rationale: Pinananatili ang tensiyon sa pagitan ng pag-alaala, pagbibigay-pansin, at pagdalaw na may paghatol. Hindi inuunahan ng pangunahing teksto ang tahasang utos ng paghatol sa kasunod na talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ganito ang sinabi” bilang natural na pormulang propetiko, “Yahweh” para sa banal na pangalan, at “mga hukbo” upang mapanatili ang lawak ng titulo. Ang mga talababa ay inayos ayon sa paglitaw ng mga marker sa teksto.
