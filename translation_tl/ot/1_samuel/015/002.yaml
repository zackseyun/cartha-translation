  to: 'Ganito ang sabi ni Yahweh ng mga hukbo: “Binigyang-pansin ko ang ginawa ng Amalek sa Israel—kung paano niya ito sinalungat sa daan nang umahon ito mula sa Ehipto.[a][b]”'
