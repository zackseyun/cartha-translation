  terminology: Ang "Yahweh ng mga hukbo" ay angkop na salin ng יהוה צבאות at hindi nagpapakitid sa saklaw ng titulo. Ang "Amalek," "Israel," at "Ehipto" ay pare-pareho at wasto. Inayos ang talababa upang hindi ipahiwatig na ang "tinugon" ay tuwirang katumbas ng פקד sa talatang ito.
