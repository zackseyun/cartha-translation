lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: tinipon
  rationale: Ang Hiphil ng שׁמע ay idyomatikong tumutukoy rito sa pagpapatawag at pagtitipon ng mga tao para sa digmaan. Natural at malinaw sa Filipino ang “tinipon.”
- source_word: הָעָם
  choice: ang mga tao
  rationale: Literal itong “ang bayan/mga tao.” Bagaman mga mandirigma ang tinutukoy sa konteksto, pinananatili ng “mga tao” ang lawak ng salitang Hebreo.
- source_word: וַיִּפְקְדֵם
  choice: binilang sila
  rationale: Sa kontekstong militar, nangangahulugan ang פקד ng pagbilang o pagrerepaso sa natipong hukbo. Mas madaling maunawaan ng karaniwang mambabasa ang “binilang” kaysa sa teknikal na “minuster.”
- source_word: בַּטְּלָאִים
  choice: sa Telaim
  rationale: Pinakamalamang na pangalan ito ng lugar kung saan tinipon at binilang ang hukbo, bagaman maaari ring unawain nang literal bilang “kasama ang mga kordero”; inilalahad ang alternatibo sa talababa.
- source_word: מָאתַיִם אֶלֶף
  choice: dalawang daang libo
  rationale: Tuwirang salin ng bilang.
- source_word: רַגְלִי
  choice: kawal na naglalakad
  rationale: Ang salita ay literal na tumutukoy sa taong naglalakad at, sa kontekstong militar, sa mga kawal na panlupa o infantry. Malinaw ang “kawal na naglalakad” at pinananatili ang larawan ng Hebreo.
- source_word: וַעֲשֶׂרֶת אֲלָפִים
  choice: at sampung libo
  rationale: Tuwirang salin ng ikalawang bilang.
- source_word: אֶת אִישׁ יְהוּדָה
  choice: lalaki mula sa Juda
  rationale: Ang kolektibong parirala ay tumutukoy sa mga lalaking kabilang sa Juda. Natural sa Filipino ang “mula sa Juda” at malinaw ang pagkakakilanlang pantribo.
