  text: 'So Saul summoned the people and mustered them at Telaim: two hundred thousand foot soldiers[a], and ten thousand men of Judah.'
translation:
  language: tl
  text: 'Kaya ipinatawag ni Saul ang mga tao at binilang niya sila sa Telaim: dalawang daang libong kawal na naglalakad[a], at sampung libong lalaki ng Juda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O marahil, “kasama ng mga kordero,” kung literal na uunawain ang בַּטְּלָאִים sa halip na bilang pangalang Telaim.
