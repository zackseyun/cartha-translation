source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל שְׁמוּאֵ֗ל אֲשֶׁ֤ר שָׁמַ֨עְתִּי֙ בְּ/ק֣וֹל יְהוָ֔ה וָ/אֵלֵ֕ךְ בַּ/דֶּ֖רֶךְ אֲשֶׁר שְׁלָחַ֣/נִי יְהוָ֑ה וָ/אָבִ֗יא אֶת אֲגַג֙ מֶ֣לֶךְ עֲמָלֵ֔ק וְ/אֶת עֲמָלֵ֖ק הֶחֱרַֽמְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/020.yaml
  text: Saul said to Samuel[a], “But I did obey the voice of Yahweh, and I went on the way that Yahweh sent me, and I brought Agag king of Amalek[b], and I devoted Amalek to destruction.”
translation:
  language: tl
  text: Sinabi ni Saul kay Samuel, “Ngunit talagang sinunod ko ang tinig ni Yahweh[a]. Tinahak ko ang landas na iniutos ni Yahweh na tahakin ko; dinala ko si Agag na hari ng Amalek, at itinalaga ko ang Amalek sa paglipol[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “nakinig ako sa tinig ni Yahweh”; sa ganitong parirala, ang pakikinig ay nangangahulugan ding pagsunod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “lubusan kong nilipol ang Amalek” o “inilagay ko ang Amalek sa ilalim ng pagbabawal.” Ang pandiwang Hebreo ay tumutukoy sa pagtatalaga ng isang bagay o bayan sa paglipol.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: talagang sinunod ko ang tinig ni
  rationale: Ang שׁמע בְּקוֹל ay idyomang nangangahulugang makinig at sumunod. Pinananatili ng “sinunod ko ang tinig” ang larawan sa Hebreo, samantalang ipinahahayag ng “talagang” ang mapagtanggol at mariing paggigiit ni Saul sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: וָאֵלֵךְ בַּדֶּרֶךְ אֲשֶׁר שְׁלָחַנִי יְהוָה
  choice: Tinahak ko ang daan kung saan ako isinugo ni Yahweh
  rationale: Pinananatili ng “tinahak ko ang daan” ang metapora ng Hebreo, at natural na ipinapahayag ng kasunod na sugnay ang pagkakasugo kay Saul nang hindi ginagawang tahasang “misyon” ang דֶּרֶךְ.
- source_word: וָאָבִיא
  choice: dinala ko
  rationale: Ang hiphil ng בוא ay nangangahulugang magdala o maging sanhi ng pagdating. Hindi idinagdag ang “pabalik” o “rito,” sapagkat hindi tahasang nasa pandiwa ang mga iyon.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: si Agag na hari ng Amalek
  rationale: Tuwirang ipinapahayag ang appositional na pagkakakilanlan sa natural na Tagalog.
- source_word: הֶחֱרַמְתִּי
  choice: itinalaga ko ... sa paglipol
  rationale: Ang hiphil ng חרם ay tumutukoy sa pagtatalaga sa ganap na pagwasak sa ilalim ng pagbabawal. Pinananatili ng salin ang ideya ng pagtatalaga at paglipol, hindi lamang ang pangkalahatang pagpatay o pagkatalo.
- source_word: וְאֶת עֲמָלֵק
  choice: ang Amalek
  rationale: Pinananatili ang pangalang nasa isahan sa Hebreo, na dito ay kolektibong tumutukoy sa bayan o mga Amalekita.
theological_decisions:
- issue: Kahulugan ng חרם sa konteksto ng banal na digmaan
  choice: itinalaga ko ang Amalek sa paglipol
  alternative: lubusan kong nilipol ang Amalek; inilagay ko ang Amalek sa ilalim ng pagbabawal
  rationale: Pinananatili ng “itinalaga ... sa paglipol” ang hudisyal at panrelihiyong bigat ng חרם nang hindi pinalalabo ito bilang simpleng pagkawasak. Inilalahad sa talababa ang mga leksikal na alternatibo.
- issue: Mariing pagtatanggol ni Saul sa sarili
  choice: Ngunit talagang sinunod ko ang tinig ni Yahweh
  alternative: Sinunod ko ang tinig ni Yahweh; Tunay na sinunod ko ang tinig ni Yahweh
  rationale: Ang pambungad na אֲשֶׁר ay may mariin at mapanagutang puwersa sa tugon ni Saul. Ipinahahayag ng “Ngunit talagang” ang pagsalungat niya sa paratang nang hindi pinatutunayang tama ang kanyang pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “talagang” upang likas na maipakita ang mariing pagtatanggol ni Saul, samantalang pinanatili ang “tinig,” “daan,” at “itinalaga ... sa paglipol” upang hindi mawala ang mahahalagang larawan at saklaw ng Hebreo. Itinama rin ang pagkakalagay ng mga marker upang ang talababa tungkol sa pagsunod ay nasa kaugnay na parirala at ang talababa tungkol sa חרם ay nasa “paglipol.”
