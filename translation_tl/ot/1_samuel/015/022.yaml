base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/022.yaml
  text: And Samuel said, “Does the LORD delight in burnt offerings and sacrifices as much as in obeying the voice of the LORD? Look, to obey is better than sacrifice, and to listen than the fat of rams.”
translation:
  language: tl
  text: Sinabi ni Samuel, “Nalulugod ba ang PANGINOON sa mga handog na sinusunog at mga hain gaya ng pagsunod sa tinig ng PANGINOON? Narito, ang pagsunod ay higit na mabuti kaysa hain, at ang pakikinig kaysa taba ng mga lalaking tupa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: Nalulugod ba
  rationale: Ipinapahayag ang Hebreong tanong tungkol sa ikinalulugod o kinalulugdan ng PANGINOON sa natural at dignified na Filipino.
- source_word: עֹלוֹת
  choice: mga handog na sinusunog
  rationale: Tumutukoy sa mga handog na lubusang sinusunog; mas malinaw ito sa karaniwang mambabasa kaysa transliterasyon o sa malabong “handog na susunugin.”
- source_word: זְבָחִים
  choice: iba pang mga handog
  rationale: Ang זבח ay karaniwang handog na kinakatay. Ginamit ang “iba pang” upang hindi magmukhang hiwalay sa malawak na kategorya ng mga handog, habang iniiwasan ang mabigat na “mga hain.”
- source_word: שְׁמֹעַ בְּקוֹל
  choice: pagtalima sa tinig
  rationale: Sa idyomang Hebreo, ang pakikinig sa tinig ay may diwang pagsunod. Pinananatili ng “pagtalima sa tinig” kapwa ang larawan ng tinig at ang hinihinging pagsunod.
- source_word: הִנֵּה
  choice: Tingnan ninyo
  rationale: Nagbibigay-diin at tumatawag ng pansin sa kasunod na pahayag; natural na katumbas ng Hebreong הִנֵּה sa kontekstong ito.
- source_word: לְהַקְשִׁיב
  choice: ang pakikinig
  rationale: Pinananatili ang parallelismo sa “pagtalima” at ang pagdiin sa maingat na pagbibigay-pansin, nang hindi dinaragdagan ang kahulugan.
- source_word: חֵלֶב אֵילִים
  choice: taba ng mga lalaking tupa
  rationale: Tiyak na isinasalin ang ritwal na mahalagang taba at ang אֵילִים bilang mga lalaking tupa.
theological_decisions:
- issue: Ugnayan ng mga handog at pagsunod
  choice: “gaya ng pagtalima ... higit na mabuti kaysa handog”
  alternative: “kasinglaki ng lugod niya ...” o isang absolutong pagtanggi sa lahat ng handog
  rationale: 'Pinananatili ang retorikal na paghahambing ng teksto: inuuna ng Diyos ang pagsunod kaysa ritwal, ngunit hindi ginagawang tahasang pagkondena sa lahat ng paghahandog.'
- issue: Pangalan ng Diyos, יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Gumagamit ng nakaugaliang anyong maliit na kapital para sa Tetragrammaton, alinsunod sa ibinigay na consultation layer at sa malawak na tradisyon ng saling Filipino, nang hindi nagdaragdag ng sektaryong interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang retorikal na tanong, ang parallelismo ng “pagtalima/pakikinig,” at ang kongkretong larawang “taba ng mga lalaking tupa.”
