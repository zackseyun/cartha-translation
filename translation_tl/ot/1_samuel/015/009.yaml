base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/009.yaml
  text: But Saul and the people spared Agag and the best of the sheep and cattle[a], and the fattened calves, and the lambs, and all that was good, and they were not willing to devote them to destruction[b]. But every despised and worthless thing they devoted to destruction.
translation:
  language: tl
  text: Ngunit iniligtas ni Saul at ng bayan si Agag at ang pinakamainam sa mga tupa at baka, ang mga pinatabang hayop[a], ang mga lalaking tupa, at lahat ng mabubuting bagay. Ayaw nilang italaga ang mga iyon sa paglipol[b]. Ngunit ang bawat bagay na hinamak at walang halaga ay itinalaga nila sa paglipol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan ng salitang Hebreo. Maaari rin itong isalin na “mga ikalawa” o “mga piling hayop.”
    reason: lexical_alternative
  - marker: b
    text: Ang “italaga sa paglipol” ay teknikal na pananalitang Hebreo para sa paglalagay ng isang tao o bagay sa ilalim ng pagbabawal upang lipulin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: hindi pinatay
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa hindi pagsasagawa ng iniutos na paglipol. Mas malinaw sa karaniwang Tagalog ang praktikal na kinalabasan kaysa sa 'kinaawaan,' na maaaring magpahiwatig lamang ng damdamin.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: ang pinakamainam sa mga tupa at baka
  rationale: Pinananatili ang diwang tumutukoy sa pinakamagandang bahagi ng mga alagang hayop sa natural na modernong Tagalog.
- source_word: הַמִּשְׁנִים
  choice: ang mga pinatabang hayop
  rationale: Mahirap at hindi tiyak ang bihirang terminong Hebreo. Ginamit sa teksto ang tradisyonal na kahulugang akma sa talaan ng piling hayop, habang hayagang itinatala sa talababa ang kawalang-katiyakan.
- source_word: הַכָּרִים
  choice: ang mga barakong tupa
  rationale: Karaniwan itong tumutukoy sa mga lalaking tupa o barakong tupa; malinaw at tiyak ang salin sa konteksto ng mga alagang hayop.
- source_word: לֹא אָבוּ
  choice: Ayaw nilang
  rationale: Ipinahahayag nito ang kusang pagtanggi o kawalan ng pagnanais, hindi kawalan ng kakayahan.
- source_word: הַחֲרִימָם / הֶחֱרִימוּ
  choice: italaga ... sa paglipol / itinalaga ... sa paglipol
  rationale: 'Pinananatili ang teknikal na diwa ng חרם: paglalagay ng isang tao o bagay sa ilalim ng pagbabawal na humahantong sa ganap na pagwasak, sa halip na payak na ''sirain'' lamang.'
- source_word: כָל הַמְּלָאכָה נְמִבְזָה וְנָמֵס
  choice: ang bawat bagay na hinamak at walang halaga
  rationale: Sa kontekstong ito, ang kolektibong pangngalan ay tumutukoy sa mga ari-arian o bagay na samsam; pinananatili ng salin ang pagtataya sa mga ito bilang hinamak at walang halaga.
theological_decisions:
- issue: Pagpapakahulugan sa חרם sa konteksto ng banal na digmaan
  choice: italaga sa paglipol
  alternative: ganap na lipulin; ilagay sa ilalim ng pagbabawal
  rationale: Pinananatili nito ang teknikal at hudisyal na bigat ng termino nang hindi pinadadali bilang karaniwang pagpatay o nag-aangkat ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Iniwasan ang masyadong literal na 'nagtipid' o ang maaaring malabong 'kinaawaan'; ginamit ang malinaw na 'hindi pinatay.' Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
