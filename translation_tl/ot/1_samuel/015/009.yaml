revisions:
- from: Ngunit hindi pinatay ni Saul at ng bayan si Agag, pati ang pinakamainam sa mga tupa at baka, ang mga pinatabang hayop[a], ang mga barakong tupa, at ang lahat ng mabuti. Ayaw nilang italaga ang mga iyon sa paglipol[b]. Ngunit ang bawat bagay na hinamak at walang halaga ay itinalaga nila sa paglipol.
  to: Ngunit iniligtas ni Saul at ng bayan si Agag at ang pinakamainam sa mga tupa at baka, ang mga pinatabang hayop[a], ang mga lalaking tupa, at lahat ng mabubuting bagay. Ayaw nilang italaga ang mga iyon sa paglipol[b]. Ngunit ang bawat bagay na hinamak at walang halaga ay itinalaga nila sa paglipol.
  rationale: Pinalitan ang “hindi pinatay” ng “iniligtas” upang maisalin ang praktikal na diwa ng “spared” para kay Agag at sa mga ari-ariang hindi nila inilaan sa paglipol. Inayos ang pagkakasunod ng mga layon, ginawang mas natural ang katawagan para sa mga lalaking tupa, at pinakinis ang talababa nang hindi inaalis ang leksikal na kawalang-katiyakan.
