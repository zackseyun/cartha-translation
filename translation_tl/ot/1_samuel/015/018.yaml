id: 1SA.15.18
reference: 1 Samuel 15:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁלָחֲ/ךָ֥ יְהוָ֖ה בְּ/דָ֑רֶךְ וַ/יֹּ֗אמֶר לֵ֣ךְ וְ/הַחֲרַמְתָּ֞ה אֶת הַֽ/חַטָּאִים֙ אֶת עֲמָלֵ֔ק וְ/נִלְחַמְתָּ֣ ב֔/וֹ עַ֥ד כַּלּוֹתָ֖/ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/018.yaml
  text: And Yahweh sent you on a mission and said[a], ‘Go and devote the sinners, the Amalekites, to destruction[b], and fight against them until they are consumed.’
translation:
  language: tl
  text: At isinugo ka ni Yahweh sa isang misyon at sinabi, “Humayo ka at italaga sa ganap na paglipol[a] ang mga makasalanan—ang mga Amalekita[b]—at makipaglaban ka sa kanila hanggang sa tuluyan silang maubos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lipulin nang lubusan.” Ang pandiwang Hebreo ay tumutukoy sa pagtatalaga ng isang bagay o bayan sa pagkawasak sa ilalim ng pagbabawal.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang mga makasalanan, ang Amalek”; ang “Amalek” ay kolektibong pangalan na nagpapakilala kung sino ang tinawag na “mga makasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֲךָ
  choice: isinugo ka
  rationale: Ipinapahayag ng שלח ang pagpapadala kay Saul na may tiyak na atas; natural sa Filipino ang “isinugo” at malinaw ang diwa ng pagkakatiwala ng gawain.
- source_word: בְּדָרֶךְ
  choice: sa isang misyon
  rationale: Bagaman literal na “sa daan,” sa pagkakagamit nito kasunod ng “isinugo” tumutukoy ito sa gawaing iniatas, hindi lamang sa paglalakbay.
- source_word: לֵךְ
  choice: Humayo ka
  rationale: Tuwirang pautos ito. Ang “Humayo ka” ay marangal ngunit nauunawaan pa rin sa makabagong Filipino.
- source_word: וְהַחֲרַמְתָּה
  choice: italaga sa ganap na paglipol
  rationale: Ang חרם sa Hiphil ay teknikal na tumutukoy sa paglalagay sa ilalim ng pagbabawal na humahantong sa paglipol. Pinananatili ng salin ang diwa ng pagtatalaga at ang layuning ganap na pagkawasak.
- source_word: הַחַטָּאִים
  choice: ang mga makasalanan
  rationale: Pinananatili ang tahasang moral na tawag ng Hebreo sa Amalek sa halip na gawin lamang itong pangalan ng isang pangkat.
- source_word: אֶת עֲמָלֵק
  choice: ang mga Amalekita
  rationale: Ang “Amalek” ay kolektibong pangalan sa Hebreo; “mga Amalekita” ang natural na pagtukoy sa bayan sa Filipino, samantalang ipinaliliwanag ng talababa ang anyo ng orihinal.
- source_word: וְנִלְחַמְתָּ בוֹ
  choice: makipaglaban ka sa kanila
  rationale: Isahan ang hulaping Hebreo dahil kolektibong “Amalek” ang tinutukoy, ngunit maramihan ang natural na pagtukoy sa mga tao sa Filipino.
- source_word: עַד כַּלּוֹתָם אֹתָם
  choice: hanggang sa tuluyan silang maubos
  rationale: Ipinahihiwatig ng כלה ang pagdating sa lubos na wakas. Ang pormang hindi tahasang nagpapangalan sa gumagawa ay pinananatili sa natural na Filipino at hindi labis na nilulutas ang masalimuot na sintaks ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Diwa ng utos na חרם
  choice: italaga sa ganap na paglipol
  alternative: lipulin nang lubusan
  rationale: Pinananatili ng napiling salin kapwa ang teknikal na diwa ng pagtatalaga sa ilalim ng pagbabawal at ang kinahinatnang paglipol, nang hindi binabawasan ang bigat o tensiyong teolohikal ng utos.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “isinugo” at “Humayo” upang mapanatili ang bigat ng atas nang hindi nagiging lipas o labis na pormal. Ang mga gitling em ay nagpapalinaw na ang “mga Amalekita” ang appositional na pagkakakilanlan ng “mga makasalanan.”
