source:
  edition: WLC
  text: עַתָּה֩ לֵ֨ךְ וְ/הִכִּֽיתָ֜ה אֶת עֲמָלֵ֗ק וְ/הַֽחֲרַמְתֶּם֙ אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/לֹ֥א תַחְמֹ֖ל עָלָ֑י/ו וְ/הֵמַתָּ֞ה מֵ/אִ֣ישׁ עַד אִשָּׁ֗ה מֵֽ/עֹלֵל֙ וְ/עַד יוֹנֵ֔ק מִ/שּׁ֣וֹר וְ/עַד שֶׂ֔ה מִ/גָּמָ֖ל וְ/עַד חֲמֽוֹר־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/003.yaml
  text: Now go and strike Amalek[a], and devote to destruction all that belongs to him. Do not spare him, but put to death from man to woman, from child to nursing infant, from ox to sheep[b], from camel to donkey.
translation:
  language: tl
  text: Ngayon, humayo ka at salakayin ang Amalek[a]. Italaga ninyo sa ganap na paglipol[b] ang lahat ng mayroon ito. Huwag mo itong kaawaan; patayin mo ang lalaki at babae, ang bata at sanggol na sumususo, ang baka at tupa o kambing, ang kamelyo at asno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Amalek” ay tumutukoy rito sa bayang Amalekita bilang isang kabuuan; kaya pang-isahan din ang mga panghalip sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang “italaga sa ganap na paglipol” ay salin ng pandiwang Hebreo na maaari ring isaling “lubusang lipulin” o “ilagay sa ilalim ng pagbabawal.” Ipinahihiwatig nito ang di-mababawing pagtatalaga sa paglipol bilang hatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה לֵךְ
  choice: Ngayon, humayo ka
  rationale: Pinananatili ang agarang panandang panahunan at ang tuwirang utos; marangal ngunit malinaw sa makabagong Filipino ang “humayo.”
- source_word: וְהִכִּיתָה אֶת־עֲמָלֵק
  choice: salakayin ang Amalek
  rationale: Sa kontekstong pandigma, natural na ipinahahayag ng “salakayin” ang נכה nang hindi gumagamit ng makalumang katumbas; pinanatili ang pang-isahang pangalang kolektibo.
- source_word: וְהַחֲרַמְתֶּם
  choice: Italaga ninyo sa ganap na paglipol
  rationale: 'Ipinakikita ang teknikal at panrelihiyong diwa ng חרם: hindi lamang pagwasak kundi di-mababawing pagtatalaga sa paglipol bilang hatol.'
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: ang lahat ng pag-aari nito
  rationale: Saklaw nito ang lahat ng nauukol sa kolektibong Amalek; ang “nito” ay umaayon sa pagtukoy sa isang bayan o pangkat bilang kabuuan.
- source_word: וְלֹא תַחְמֹל עָלָיו
  choice: Huwag mo itong patawarin
  rationale: Ang חמל ay maaaring mangahulugang maawa o magpaligtas. Sa kontekstong ito, malinaw na ipinahahayag ng “patawarin” ang hindi pagligtas mula sa itinakdang kamatayan, bagaman may tala sa alternatibong diwa.
- source_word: וְהֵמַתָּה
  choice: patayin mo
  rationale: Tuwiran at eksaktong causative na katumbas ng “ipapatay/ilagay sa kamatayan,” at natural sa kasalukuyang Filipino.
- source_word: מֵאִישׁ עַד־אִשָּׁה מֵעֹלֵל וְעַד־יוֹנֵק
  choice: ang lalaki at babae, ang bata at sanggol na sumususo
  rationale: Pinananatili ang tahasang magkapares na kategorya at ang pagkakaiba ng maliit na bata at pasusuhing sanggol; ang “at” ay natural na naghahatid ng saklaw sa Filipino.
- source_word: מִשּׁוֹר וְעַד־שֶׂה
  choice: ang baka at tupa o kambing
  rationale: Ang שׁוֹר ay hayop na bakahan, at ang שֶׂה ay isang hayop mula sa maliit na kawan na maaaring tupa o kambing; hindi pinakikitid sa “tupa” lamang ang tunay na saklaw.
- source_word: מִגָּמָל וְעַד־חֲמוֹר
  choice: ang kamelyo at asno
  rationale: Tuwirang makabagong katumbas ng dalawang uri ng hayop; pinananatili ang pangkategoryang gamit ng mga pang-isahan.
theological_decisions:
- issue: Wikang חרם sa banal na digmaan at paghatol
  choice: italaga ... sa ganap na paglipol
  alternative: lubusang lipulin; ilagay sa ilalim ng pagbabawal
  rationale: Pinananatili ang sakral at panghatol na bigat ng pandiwa sa halip na gawing karaniwang pagsira lamang, nang hindi nagdaragdag ng paliwanag na teolohikal sa mismong talata.
- issue: Pang-isahang Amalek at mga panghalip bilang kolektibong katauhan
  choice: Amalek ... nito/itong
  alternative: mga Amalekita ... nila/sila
  rationale: Sinusunod ang pang-isahang anyo ng Hebreo habang nililinaw sa talababa na ang tinutukoy ay ang buong bayang Amalekita.
- issue: Hayagang pagsasama ng mga kategoryang pantao
  choice: lalaki at babae, bata at sanggol na sumususo
  alternative: lahat ng tao, pati mga bata
  rationale: Hindi pinapawi ang tahasang mga kategorya o ang matinding moral at teolohikal na tensiyon ng teksto.
- issue: Saklaw ng שֶׂה
  choice: tupa o kambing
  alternative: tupa
  rationale: Ang salitang Hebreo ay maaaring tumukoy sa alinman sa tupa o kambing; pinananatili ang tunay na leksikal na lawak.
translation_notes:
  register: Makabagong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang “humayo” upang mapanatili ang solemneng himig ng utos, ngunit iniwasan ang labis na makaluma o denominasyonal na pananalita. Pinanatili ang karahasan at teolohikal na tensiyon ng pinagmulang teksto nang walang pagpapalambot o dagdag na paghatol.
