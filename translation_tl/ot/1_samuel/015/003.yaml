revisions:
- from: Ngayon, humayo ka at salakayin ang Amalek[a]. Italaga ninyo sa ganap na paglipol ang lahat ng pag-aari nito. Huwag mo itong patawarin; sa halip, patayin mo ang lalaki at babae, ang bata at sanggol na sumususo, ang baka at tupa o kambing, ang kamelyo at asno.[b]
  to: Ngayon, humayo ka at salakayin ang Amalek[a]. Italaga ninyo sa ganap na paglipol[b] ang lahat ng mayroon ito. Huwag mo itong kaawaan; patayin mo ang lalaki at babae, ang bata at sanggol na sumususo, ang baka at tupa o kambing, ang kamelyo at asno.
  rationale: Pinalitan ang “patawarin” ng “kaawaan” upang tumpak na maihatid ang חמל nang hindi nagpapasok ng diwa ng pagpapatawad ng kasalanan. Pinalawak ang “pag-aari” tungo sa “lahat ng mayroon” upang mapanatili ang saklaw ng כָּל אֲשֶׁר לוֹ. Inilipat ang talababa ng חרם sa mismong pariralang ipinaliliwanag nito. Pinanatili ang pangmaramihang “Italaga ninyo,” sapagkat ito ang anyo ng pandiwang Hebreo, habang ang mga kasunod na utos ay pang-isahan gaya ng nasa pinagmulan.
