    rationale: Ang marker b ay nasa dulo ng buong pangungusap, samantalang ang nilalaman nito ay pangunahing tumutukoy sa “italaga ... sa ganap na paglipol.” Ang paglipat nito pagkatapos ng pariralang iyon ay nagpapalinaw ng anchor.
