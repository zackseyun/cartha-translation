base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/024.yaml
  text: Then Saul said to Samuel[a], “I have sinned, for I transgressed the command of Yahweh and your words[b], for I feared the people and listened to their voice.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Saul kay Samuel, “Nagkasala ako, sapagkat nilabag ko ang utos ni Yahweh[a] at ang mga salita mo, sapagkat natakot ako sa bayan at nakinig sa kanilang tinig[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang bibig ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sumunod sa kanila”; sa Hebreo, literal na “nakinig sa kanilang tinig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Nagkasala ako
  rationale: Ang Hebreong perfect ay pagpapahayag ni Saul ng nagawa na niyang kasalanan; natural at tuwiran itong ipinahahayag sa Tagalog bilang “Nagkasala ako.”
- source_word: עָבַרְתִּי
  choice: nilabag ko
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa paglabag sa isang tiyak na tagubilin. Pinananatili ng “nilabag” ang moral at legal na bigat nito nang natural sa Tagalog.
- source_word: פִּי יְהוָה
  choice: ang utos ni Yahweh
  rationale: Literal itong “bibig ni Yahweh,” ngunit isang idyoma para sa ipinahayag na utos niya. Ang “utos” ang malinaw na kahulugan sa salaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: דְּבָרֶיךָ
  choice: ang mga salita mo
  rationale: Pinananatili nito ang maramihang anyo at ang tahasang pagtukoy sa mga sinabi ni Samuel.
- source_word: יָרֵאתִי
  choice: Natakot ako
  rationale: Natural na Tagalog ito para sa takot na inilalahad ni Saul bilang dahilan ng kanyang ginawa.
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang pangngalan ay malawak na tumutukoy sa mga tao, bagaman sa konteksto ay kabilang dito ang mga tauhan o mandirigma ni Saul. Iniiwasang paliitin ang saklaw sa “hukbo.”
- source_word: וָאֶשְׁמַע בְּקוֹלָם
  choice: nakinig sa kanilang tinig
  rationale: Pinananatili ang Hebreong idyoma at ang mahalagang paghahambing sa pakikinig sa tinig ni Yahweh; maaari rin nitong ipahiwatig ang pagsunod.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa Hebreong teksto. Ang “Yahweh” ay tuwirang paglilipat nito at hindi pagpapalit ng pangalan sa isang titulo.
- issue: Kahulugan ng idyomang פִּי יְהוָה
  choice: ang utos ni Yahweh
  alternative: ang bibig ni Yahweh / ang salita ni Yahweh
  rationale: Bagaman literal na “bibig ni Yahweh,” tumutukoy ito rito sa utos na binigkas niya at nilabag ni Saul. Nililinaw ng “utos” ang idyomatikong diwa nang hindi dinaragdagan ang teolohiya ng teksto.
- issue: Diwa ng pakikinig sa tinig ng bayan
  choice: nakinig sa kanilang tinig
  alternative: sumunod sa kanila
  rationale: Pinananatili ng pangunahing teksto ang anyo at alingawngaw ng Hebreo, habang inilalagay sa talababa ang posibleng implikasyong pagsunod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapagkat” para sa unang כִּי at “kasi” sa ikalawa upang maging natural ang paliwanag ni Saul nang hindi binabago ang ugnayang sanhi. Pinanatili ang “kanilang tinig” upang mapanatili ang Hebreong larawan at paghahambing.
