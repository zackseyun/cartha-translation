    rationale: Karaniwang tumutukoy ang 'ipinagluksa' sa isang kamatayan o pangyayaring iniluluksa. Ang Hebreo ay nagsasabing nagdalamhati si Samuel dahil/kaugnay ni Saul, nang hindi tahasang sinasabing namatay si Saul.
  - severity: low
