  to: Hindi na muling nakita ni Samuel si Saul hanggang sa araw ng kanyang kamatayan, sapagkat nagdalamhati si Samuel dahil kay Saul. At pinanghinayangan[a] ni Yahweh na ginawa niyang hari si Saul sa Israel.
  rationale: Pinahusay ang idiomang Filipino para sa pagdadalamhati ni Samuel at pinili ang 'pinanghinayangan' upang ihatid ang contextual na diwa ng banal na regret nang hindi labis na nagdaragdag ng pahiwatig ng moral na pagkakasala. Pinanatili ang panghalip na 'kanyang' upang huwag magdagdag ng pagpapalinaw na wala sa anyong Hebreo, at nananatili ang footnote anchor sa pandiwang isinasalaysay nito.
