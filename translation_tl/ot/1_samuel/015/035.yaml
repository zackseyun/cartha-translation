    rationale: Posible ang diwang pagbabago o pag-urong sa ilang konteksto ng נִחָם, ngunit hindi ito ang pinakamalapit na alternatibong Filipino sa talatang ito. Mas maingat ang 'nagbago ng pasiya,' na malinaw na inilalahad bilang kontekstuwal na alternatibo.
