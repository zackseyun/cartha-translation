  naturalness: Mas natural sa makabagong Filipino ang 'nagdalamhati si Samuel dahil kay Saul.' Ang 'pinagsisihan' ay nauunawaan ngunit maaaring magpahiwatig ng personal na pagkakasala; 'pinanghinayangan' ay mas malapit sa contextual na 'regretted' at nananatiling personal at madamdamin.
  terminology: Ang 'Yahweh,' 'hari,' at 'Israel' ay angkop at pare-pareho. Ang talababa ay dapat magbigay ng mga alternatibong leksikal na talagang posible para sa נִחָם sa kontekstong ito, nang hindi ipinipilit ang isang teolohikal na paglutas.
