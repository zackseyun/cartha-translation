  text: וְ/לֹא יָסַ֨ף שְׁמוּאֵ֜ל לִ/רְא֤וֹת אֶת שָׁאוּל֙ עַד י֣וֹם מוֹת֔/וֹ כִּֽי הִתְאַבֵּ֥ל שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יהוָ֣ה נִחָ֔ם כִּֽי הִמְלִ֥יךְ אֶת שָׁא֖וּל עַל יִשְׂרָאֵֽל־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/035.yaml
  text: And Samuel did not see Saul again until the day of his death[a], for Samuel mourned over Saul. And Yahweh regretted that he had made Saul king over Israel.
translation:
  language: tl
  text: Hindi na muling nakita ni Samuel si Saul hanggang sa araw ng kanyang kamatayan, sapagkat nagdalamhati si Samuel dahil kay Saul. At pinanghinayangan[a] ni Yahweh na ginawa niyang hari si Saul sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ikinalungkot” o “nagbago ng pasiya.” Nag-iiba ang saklaw ng diwa ng pandiwang Hebreo ayon sa konteksto; dito, ipinahahayag nito ang pagdadalamhati o panghihinayang ni Yahweh dahil ginawa niyang hari si Saul.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַף ... לִרְאוֹת
  choice: hindi na muling nakita
  rationale: Likas na katumbas sa Filipino ng negatibong idyomang Hebreo na nangangahulugang hindi na muling ginawa ang isang bagay.
- source_word: לִרְאוֹת אֶת שָׁאוּל
  choice: nakita ... si Saul
  rationale: Pinananatili ang karaniwang diwa ng ראה na ‘makita,’ bagaman ipinahihiwatig ng konteksto ang personal na pakikipagtagpo.
- source_word: עַד יוֹם מוֹתוֹ
  choice: hanggang sa araw ng kanyang kamatayan
  rationale: Pinananatili ang maringal na anyo at ang tunay na kalabuan ng panghalip na Hebreo kung kaninong kamatayan ang tinutukoy.
- source_word: הִתְאַבֵּל
  choice: ipinagluksa
  rationale: Tuwirang ipinahahayag ang matinding pagdadalamhati ni Samuel.
- source_word: אֶל שָׁאוּל
  choice: si Saul
  rationale: Sa pariralang ‘ipinagluksa ... si Saul,’ likas sa Filipino ang tuwirang layon upang ipahayag na si Saul ang dahilan o paksa ng pagluluksa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: נִחָם
  choice: pinagsisihan
  rationale: Sa kontekstong sinusundan ng sugnay tungkol sa pagkakagawa kay Saul bilang hari, ipinahahayag nito ang pagsisisi o matinding panghihinayang ni Yahweh; pinananatili ng salin ang tensiyong nasa teksto.
- source_word: הִמְלִיךְ
  choice: ginawa niyang hari
  rationale: Tuwiran at natural na katumbas ng causative na anyong ‘ginawang hari.’
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Likas na Filipino para sa paghahari o pagiging hari sa isang bayan.
theological_decisions:
- issue: Ang makataong pananalita tungkol sa Diyos sa נִחָם
  choice: pinagsisihan
  alternative: ikinalungkot; iniurong ang pasiya
  rationale: Tahasang iniuukol ng talata kay Yahweh ang נִחָם. Hindi pinahihina ng salin ang personal at madamdaming pananalita o nilulutas ang teolohikal na tensiyon. Sa kontekstong ‘ginawa niyang hari si Saul,’ mas angkop ang pagsisisi o panghihinayang kaysa pag-urong mula sa isang ibinalang hakbang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit sa pangalan ni Samuel at ni Saul upang maging malinaw ang mga tauhan, at iniwasang tukuyin nang higit sa Hebreo kung kaninong kamatayan ang tinutukoy ng ‘kanyang kamatayan.’
