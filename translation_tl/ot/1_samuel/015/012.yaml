  to: Kinaumagahan, maagang bumangon si Samuel upang salubungin si Saul. At ibinalita kay Samuel, “Pumunta si Saul sa Carmel, at narito, may itinayo siyang bantayog para sa sarili niya.[a] Pagkatapos ay lumiko siya, nagpatuloy, at bumaba sa Gilgal.”
