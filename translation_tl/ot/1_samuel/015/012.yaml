base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/012.yaml
  text: Samuel rose early in the morning to meet Saul[a], and it was reported to Samuel, saying, “Saul came to Carmel, and look, he has set up a monument for himself; then he turned and passed on and went down to Gilgal.”
translation:
  language: tl
  text: Kinaumagahan, maagang bumangon si Samuel upang salubungin si Saul. At ibinalita kay Samuel, “Pumunta si Saul sa Carmel, at narito, may itinayo siyang bantayog para sa sarili niya.[a] Pagkatapos ay lumiko siya, nagpatuloy, at bumaba sa Gilgal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “kamay para sa sarili niya.” Dito, ang “kamay” ay tumutukoy sa isang panandang nagpapagunita o bantayog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: Kinaumagahan, maagang bumangon
  rationale: Pinananatili nito kapwa ang diwa ng maagang pagbangon sa pandiwa at ang tahasang pagtukoy sa umaga, nang hindi nagiging asiwa sa modernong Tagalog.
- source_word: לִקְרַאת
  choice: upang salubungin
  rationale: Ipinahahayag ng pariralang may ל ang layunin. Ang “salubungin” ay natural na Tagalog para sa pagpunta upang makipagtagpo sa isang taong dumarating.
- source_word: וַיֻּגַּד לִשְׁמוּאֵל לֵאמֹר
  choice: At ibinalita kay Samuel
  rationale: Ang balintiyak na anyo ay nagpapanatiling di-tiyak kung sino ang nagbalita; hindi na kailangang tumbasan nang hiwalay ang pormulang לֵאמֹר bago ang tuwirang sipi.
- source_word: בָּא שָׁאוּל הַכַּרְמֶלָה
  choice: Pumunta si Saul sa Carmel
  rationale: Ang hulaping patunguhan ay malinaw na nagsasaad ng kilos patungo sa Carmel; “pumunta” ang pinakanatural na salin sa iniulat na pananalita.
- source_word: וְהִנֵּה
  choice: at narito
  rationale: Pinananatili ang pantawag-pansing bisa ng Hebreong kataga sa isang maikli at marangal na anyong nauunawaan pa rin sa modernong Filipino.
- source_word: מַצִּיב
  choice: nagtayo siya
  rationale: Ang pandiwaring kasunod ng וְהִנֵּה ay naghaharap nang matingkad sa kilos at maaari ring magpahiwatig ng resultang kalagayan. Ang payak na nagdaang anyo ay natural sa ulat at hindi nagdaragdag ng di-tiyak na detalye.
- source_word: יָד
  choice: isang bantayog
  rationale: Bagaman literal na “kamay,” ginagamit dito ang salita para sa isang panandang nagpapagunita o bantayog. Ang literal na “kamay” ay magiging malabo sa karaniwang mambabasa.
- source_word: לּוֹ
  choice: para sa sarili niya
  rationale: 'Ipinakikita ang reflexive na diwa: ang bantayog ay itinayo ni Saul para sa sarili niyang karangalan o paggunita.'
- source_word: וַיִּסֹּב וַיַּעֲבֹר
  choice: lumiko siya, nagpatuloy
  rationale: Inilalarawan ng magkasunod na pandiwa ang pagbabago ng direksiyon at ang pagpapatuloy ng paglalakbay.
- source_word: וַיֵּרֶד הַגִּלְגָּל
  choice: bumaba sa Gilgal
  rationale: Pinananatili ng “bumaba” ang topograpikal na diwa ng ירד at ang patunguhang Gilgal.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit tuwiran. Ginamit ang “bantayog” upang malinaw na maipahayag ang idyomatikong kahulugan ng יָד, habang inilagay sa talababa ang literal na larawan. Ang pananda [a] ay ikinabit sa mismong pariralang “bantayog para sa sarili niya,” na siyang tinutukoy ng talababa.
