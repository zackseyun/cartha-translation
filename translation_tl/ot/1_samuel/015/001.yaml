  source_fidelity: Ang “sa kanyang bayan, sa Israel” ay hindi malinaw na naihahatid ang עַל, na tumutukoy sa paghahari ni Saul sa bayan. Ang “pakinggan mo at sundin” ay nagpapalawak sa hayag na pandiwang “makinig/pakinggan”; bagaman ang idyoma ay may panawagang tumalima, mas mainam itong panatilihin sa tala upang hindi gawing tahasang ikalawang utos ang salin.
  naturalness: Ang “pahiran ka ng langis” at “bilang hari” ay natural at angkop sa marangal na makabagong Filipino. Mas likas at mas tumpak ang “bilang hari ng kanyang bayan, ang Israel” kaysa sa pag-uulit na “sa kanyang bayan, sa Israel.”
  terminology: Wasto ang “Yahweh,” “Samuel,” at “Saul.” Ang “pahiran ka ng langis” ay nagpapanatili sa terminolohiyang pagpapahid sa pagtatalaga sa hari.
