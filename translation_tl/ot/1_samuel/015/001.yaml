  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל אֹתִ֨/י שָׁלַ֤ח יְהוָה֙ לִ/מְשָׁחֳ/ךָ֣ לְ/מֶ֔לֶךְ עַל עַמּ֖/וֹ עַל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה שְׁמַ֔ע לְ/ק֖וֹל דִּבְרֵ֥י יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/001.yaml
  text: Then Samuel said to Saul[a], “Yahweh sent me to anoint you as king over his people, over Israel. So now, listen to the words of Yahweh.”
translation:
  language: tl
  text: Sinabi ni Samuel kay Saul, “Isinugo ako ni Yahweh upang pahiran ka ng langis bilang hari ng kanyang bayan, ang Israel. Kaya ngayon, pakinggan mo ang mga salita ni Yahweh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Tagalog ang “Pagkatapos” bilang panandang pasalaysay.
- source_word: שְׁמוּאֵל ... שָׁאוּל
  choice: Samuel ... Saul
  rationale: Mga pamantayang anyo ng mga pangalang ito sa makabagong saling Tagalog.
- source_word: אֹתִי שָׁלַח יְהוָה
  choice: Isinugo ako ni Yahweh
  rationale: Pinananatili ang natapos na pagsusugo at ang diin sa “ako” sa isang natural na ayos sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: לִמְשָׁחֳךָ
  choice: upang pahiran ka ng langis
  rationale: Ipinahahayag ang literal at seremonyal na kahulugan ng משׁח sa pagtatalaga sa tungkulin bilang hari.
- source_word: לְמֶלֶךְ
  choice: bilang hari
  rationale: Likas na ipinahahayag sa Tagalog ang tungkulin o kalagayang bunga ng pagpapahid.
- source_word: עַל עַמּוֹ עַל יִשְׂרָאֵל
  choice: sa kanyang bayan, sa Israel
  rationale: Sa konteksto ng paghahari, ang עַל ay tumutukoy sa saklaw ng pamamahala. Pinananatili ng ikalawang parirala ang paglilinaw at pag-uulit ng Hebreo nang hindi nagiging mabigat sa Tagalog.
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinapakita ang paglipat mula sa paalala tungkol sa pagkahirang ni Saul tungo sa kasalukuyang utos, kasama ang bahagyang lohikal na ugnayan.
- source_word: שְׁמַע לְקוֹל דִּבְרֵי יְהוָה
  choice: pakinggan mo at sundin ang mga salita ni Yahweh
  rationale: Ang שׁמע sa ganitong pormula ay hindi lamang pandinig kundi masunuring pagtugon. Ang tahasang “pakinggan ... at sundin” ay natural sa Tagalog at naghahatid ng buong pragmatikong puwersa ng utos.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng utos na שְׁמַע
  choice: pakinggan mo at sundin
  alternative: pakinggan mo lamang
  rationale: Sa konteksto ng tipan at utos, saklaw ng pandiwa ang pakikinig na humahantong sa pagsunod; hindi nito ipinapasok ang isang denominasyonal na pagbasa kundi nililinaw ang puwersa ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pahiran ng langis” upang madaling maunawaan ang seremonyal na pagtatalaga, at “pakinggan mo at sundin” upang likas na maihatid ang Hebreong idyoma nang hindi gumagawa ng malamya at sobrang literal na parirala.
