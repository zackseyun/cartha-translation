  yaml_path: translation/ot/1_samuel/015/005.yaml
  text: Saul came to the city of Amalek and lay in wait in the wadi[a][b][c].
translation:
  language: tl
  text: Dumating si Saul sa lunsod ng Amalek at nag-abang sa bangin[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagtambang sa bangin.” Mahirap tiyakin ang pandiwang Hebreo rito; nauunawaan din ito bilang “nakipaglaban” o “nakipagtalo,” ngunit mas angkop sa konteksto ang diwa ng pag-aabang para sa isang pagtambang.
    reason: lexical_alternative
  - marker: b
    text: Ang “bangin” dito ay maaaring tumukoy sa isang daluyan ng tubig o ravine na maaaring walang tubig maliban kapag tag-ulan.
    reason: cultural_note
  - marker: c
    text: O “lunsod ng mga Amalekita.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dumating
  rationale: Ang בוא ay maaaring mangahulugang pumunta, dumating, o pumasok ayon sa pananaw. Ang “dumating” ay natural sa salaysay at malinaw na naghahayag ng pag-abot ni Saul sa destinasyon.
- source_word: עַד
  choice: sa
  rationale: Kapag kasama ng pandiwa ng paggalaw at isang destinasyon, ang עַד ay maaaring mangahulugang “hanggang sa.” Sa Filipino, sapat at natural ang “dumating ... sa.”
- source_word: עִיר עֲמָלֵק
  choice: lunsod ng Amalek
  rationale: Pinananatili nito ang tuwirang anyo ng pariralang konstrukto. Maaari ring tumukoy ang Amalek sa mga Amalekita, kaya inilagay ang alternatibo sa talababa.
- source_word: וַיָּרֶב
  choice: nag-abang
  rationale: Mahirap ang pandiwa sa kontekstong ito. Bagaman maaari itong iugnay sa pakikipagtalo o pakikipaglaban, sinusuportahan ng kontekstong militar at ng sinaunang pag-unawa ang diwang taktikal na paghihintay o pagtambang. Ang “nag-abang” ay natural at hindi labis na nagtatakda sa eksaktong maniobra.
- source_word: בַּנָּחַל
  choice: sa tuyong ilog
  rationale: Ang נחל ay tumutukoy sa isang pana-panahong daluyan ng tubig o bangin na maaaring tuyo maliban kapag tag-ulan. Ang “tuyong ilog” ay madaling maunawaan sa Filipino, habang nililinaw sa talababa ang heograpikong kahulugan.
theological_decisions:
- issue: Di-tiyak na kahulugan ng וַיָּרֶב
  choice: nag-abang
  alternative: nagtambang; nakipaglaban; nakipagtalo
  rationale: Hindi ito isang usaping doktrinal ngunit may epekto sa paglalarawan ng kilos ni Saul. Pinili ang kahulugang angkop sa kontekstong militar, habang hayagang pinananatili sa talababa ang leksikal na pag-aalinlangan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “lunsod” para sa dignified biblical register at “tuyong ilog” sa halip na hiram na “wadi” upang maging malinaw sa karaniwang mambabasa. Ang mga marker na [a], [b], at [c] ay nasa pangunahing teksto.
