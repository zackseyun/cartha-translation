id: 1SA.15.26
reference: 1 Samuel 15:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לֹ֥א אָשׁ֖וּב עִמָּ֑/ךְ כִּ֤י מָאַ֨סְתָּה֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֣ יְהוָ֔ה מִ/הְי֥וֹת מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/026.yaml
  text: And Samuel said to Saul, “I will not return with you, because you have rejected the word of Yahweh, and Yahweh has rejected you from being king over Israel.”
translation:
  language: tl
  text: Sinabi ni Samuel kay Saul, “Hindi ako babalik kasama mo, sapagkat itinakwil mo ang salita ni Yahweh, at itinakwil ka rin ni Yahweh bilang hari ng Israel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang payak na “Sinabi” nang hindi kailangang isalin nang hiwalay ang pang-ugnay.
- source_word: לֹא אָשׁוּב עִמָּךְ
  choice: Hindi ako babalik na kasama mo
  rationale: Pinananatili ang kahulugan ng שׁוּב na “bumalik” at ang comitative na עִמָּךְ; malinaw na tumatanggi si Samuel na sumama kay Saul.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagtanggi ni Samuel. Ang “sapagkat” ay malinaw, marangal, at angkop sa salaysay.
- source_word: מָאַסְתָּה / וַיִּמְאָסְךָ
  choice: itinakwil mo / itinakwil ka rin
  rationale: 'Ang “itinakwil” ay naglalahad ng mariing pagtanggi. Inulit ang iisang pandiwa upang mapanatili ang sinadyang pagtutumbasan sa Hebreo: itinakwil ni Saul ang salita ni Yahweh, kaya itinakwil siya ni Yahweh. Ang “rin” ay natural na naghahayag ng pagtutumbasang ito.'
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ng “salita” ang malawak na saklaw ng דָּבָר at ang pamilyar na pariralang biblikal; sa konteksto, tumutukoy ito sa ipinahayag na utos ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang banal na nakasulat sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: מִהְיוֹת מֶלֶךְ עַל יִשְׂרָאֵל
  choice: bilang hari ng Israel
  rationale: Natural na ipinahahayag sa Tagalog ang pag-aalis kay Saul sa katungkulan. Ang “hari ng Israel” ay mas likas kaysa “hari sa ibabaw ng Israel” at malinaw pa ring nagsasaad ng kanyang pamamahala.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalan sa halip na palitan ng titulong “PANGINOON.”
- issue: Magkatumbas na paggamit ng ugat na מאס para kay Saul at kay Yahweh
  choice: Gamitin ang “itinakwil” sa dalawang sugnay
  alternative: Gumamit ng magkaibang pandiwa, gaya ng “hinamak” at “itinakwil”
  rationale: 'Sinadyang inuulit ng Hebreo ang parehong ugat upang idiin ang pagtutumbasan: itinakwil ni Saul ang salita ni Yahweh, at itinakwil naman siya ni Yahweh bilang hari. Hindi nito nilulutas nang lampas sa teksto ang mas malawak na usaping teolohikal tungkol sa paghahari ni Saul.'
- issue: Saklaw ng דְּבַר sa konteksto
  choice: salita
  alternative: utos o mensahe
  rationale: Bagaman ang tinutukoy sa konteksto ay isang utos, pinananatili ng “salita” ang leksikal na lawak at biblikal na pahayag ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “itinakwil” upang mapanatili ang diin at pag-uulit ng Hebreo; iniwasan ang sobrang literal ngunit di-likas na “mula sa pagiging hari sa ibabaw ng Israel.”
