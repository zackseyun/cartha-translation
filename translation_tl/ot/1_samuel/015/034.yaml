  yaml_path: translation/ot/1_samuel/015/034.yaml
  text: Then Samuel went to Ramah[a], and Saul went up to his house in Gibeah of Saul.
translation:
  language: tl
  text: Pagkatapos, pumunta si Samuel sa Rama, at umakyat si Saul patungo sa kanyang bahay sa Gibea ni Saul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang pangalan ay nasa anyong “Gibea ni Saul.” Maaaring ito ay nakatatag na pangalan ng lugar, hindi lamang pagtukoy na pag-aari ito ni Saul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pumunta
  rationale: Ang wayyiqtol ng הלך ay karaniwang nagpapatuloy sa salaysay sa payak na diwang “pumunta.” Natural at malinaw ito sa makabagong Tagalog.
- source_word: הָרָמָתָה
  choice: sa Rama
  rationale: Ang directional he ay nagpapahiwatig ng pagpunta patungo sa Rama. Sa Tagalog, likas itong ipinapahayag bilang “pumunta ... sa Rama.”
- source_word: עָלָה
  choice: umuwi
  rationale: Literal na “umakyat/pumaitaas,” ngunit dahil ang tunguhin ay בֵּיתוֹ (“bahay niya”), ang “umuwi” ang pinakanatural na salaysay sa Tagalog. Hindi karaniwang ginagamit ang “umakyat sa bahay niya” upang ipahayag ang ganitong paglalakbay; ang posibleng topograpikal na pahiwatig ay hindi tiyak na kailangang gawing lantad.
- source_word: בֵּיתוֹ
  choice: sa bahay niya
  rationale: Tuwirang katumbas ng בית na may hulaping ikatlong panauhang panlalaki. Ang “bahay niya” ay natural at malapit sa anyong Hebreo.
- source_word: גִּבְעַת שָׁאוּל
  choice: Gibea ni Saul
  rationale: Pinananatili ang anyong genitibo ng Hebreo sa likas na Tagalog. Maaari itong maunawaan bilang nakatatag nang pangalan ng lugar o bilang “Gibea ni Saul,” kaya hindi ito pinaikli sa “Gibea” lamang.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “naman” upang natural na ihambing ang magkahiwalay na pag-alis nina Samuel at Saul. Inilagay ang talababa pagkatapos ng “Gibea ni Saul,” ang mismong pariralang nililinaw nito.
