id: 1SA.15.11
reference: 1 Samuel 15:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: נִחַ֗מְתִּי כִּֽי הִמְלַ֤כְתִּי אֶת שָׁאוּל֙ לְ/מֶ֔לֶךְ כִּֽי שָׁב֙ מֵ/אַֽחֲרַ֔/י וְ/אֶת דְּבָרַ֖/י לֹ֣א הֵקִ֑ים וַ/יִּ֨חַר֙ לִ/שְׁמוּאֵ֔ל וַ/יִּזְעַ֥ק אֶל יְהוָ֖ה כָּל הַ/לָּֽיְלָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/011.yaml
  text: I regret that I made Saul king[a], because he has turned back from following me and has not carried out my words. And Samuel burned with anger[d][c][b], and he cried out to Yahweh all night.
translation:
  language: tl
  text: “Ikinalulungkot ko na ginawa kong hari si Saul[a], sapagkat tumalikod siya sa pagsunod sa akin[b] at hindi niya isinagawa ang aking mga salita[c].” Nag-alab sa galit si Samuel[d], at dumaing siya kay Yahweh buong magdamag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Nanghihinayang ako” o “Nalulungkot ako.” Mas literal, “Nagsisisi ako,” ngunit maaari itong magpahiwatig ng kahulugang hindi kinakailangan sa kontekstong ito. Ipinahahayag ng Hebreo ang matinding kalungkutan at panghihinayang ni Yahweh sa pagtatalaga kay Saul bilang hari.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “tumalikod siya mula sa pagsunod sa akin,” isang idyoma para sa pagtalikod sa pagsunod kay Yahweh.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “hindi niya tinupad ang aking mga salita” o “hindi niya sinunod ang aking mga salita.”
    reason: lexical_alternative
  - marker: d
    text: 'Idyoma sa Hebreo: “Nag-alab sa galit si Samuel.” Dahil sa konteksto, nauunawaan naman ito ng ilan bilang matinding sama ng loob o dalamhati.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִחַמְתִּי
  choice: Ikinalulungkot ko
  rationale: Ipinahahayag ng Niphal ng נחם dito ang tunay na panghihinayang at kalungkutan ni Yahweh sa paghahari ni Saul, nang hindi nagpapahiwatig na nagkasala o nagkamali ang Diyos.
- source_word: הִמְלַכְתִּי אֶת־שָׁאוּל לְמֶלֶךְ
  choice: ginawa kong hari si Saul
  rationale: Likas at malinaw na Tagalog para sa Hiphil na nagsasaad ng paglalagay o pagtatalaga kay Saul bilang hari.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng ipinahayag na kalungkutan; ang “sapagkat” ay malinaw, marangal, at sanhi ang diwa.
- source_word: שָׁב מֵאַחֲרַי
  choice: tumalikod siya sa pagsunod sa akin
  rationale: Pinananatili nito ang larawang Hebreo ng pagtalikod mula sa pagsunod, sa halip na payaking “tumalikod sa akin.”
- source_word: וְאֶת־דְּבָרַי לֹא הֵקִים
  choice: at hindi niya isinagawa ang aking mga salita
  rationale: Ang הקים kasama ng “mga salita” ay tumutukoy sa pagsasakatuparan ng iniutos; pinananatili ng “isinagawa” ang konkretong diwa.
- source_word: וַיִּחַר לִשְׁמוּאֵל
  choice: Nag-alab sa galit si Samuel
  rationale: Pinananatili ang matingkad na idyomang Hebreo ng nag-aalab na galit, habang inilalagay sa talababa ang posibleng diwa ng matinding sama ng loob o dalamhati ayon sa konteksto.
- source_word: וַיִּזְעַק אֶל־יְהוָה
  choice: dumaing siya kay Yahweh
  rationale: Ipinahahayag ng זעק ang matindi at apurahang pagdaing; natural sa Tagalog ang “dumaing” sa ganitong konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כָּל־הַלַּיְלָה
  choice: buong magdamag
  rationale: Natural na modernong Tagalog na tumpak na naghahayag ng tuloy-tuloy na tagal sa buong gabi.
theological_decisions:
- issue: Ang paggamit ng נִחַמְתִּי tungkol sa Diyos
  choice: Ikinalulungkot ko
  alternative: Nagsisisi ako; nanghihinayang ako; nagbago ang pasiya ko
  rationale: Pinananatili nito ang tunay na bigat ng kalungkutan at panghihinayang ng Diyos sa salaysay nang hindi ipinahihiwatig na gumawa siya ng kasalanan. Hindi rin nito nilulutas nang palihim ang teolohikal na tensiyon.
- issue: Ang damdamin ni Samuel sa וַיִּחַר לִשְׁמוּאֵל
  choice: Nag-alab sa galit si Samuel
  alternative: Labis na nalungkot si Samuel; lubhang sumama ang loob ni Samuel
  rationale: Galit ang karaniwang leksikal na diwa ng idyoma, kaya iyon ang nasa pangunahing teksto; kinikilala sa talababa ang ibang pag-unawang ibinubunsod ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sapagkat” para sa bahagyang pormal na himig, “buong magdamag” para sa likas na daloy, at “Yahweh” upang panatilihin ang personal na pangalan sa Hebreo. Ang lahat ng marker [a]–[d] ay nasa pangunahing teksto.
