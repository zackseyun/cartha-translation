  terminology: Ang “mga tupa” at “mga baka” ay angkop na mga salin para sa צאן at בקר sa kontekstong ito. Walang teolohikal na terminong kailangang baguhin. Hindi kailangan ng talababa; ang “tunog” ay sapat na malinaw na katumbas ng קול dito.
