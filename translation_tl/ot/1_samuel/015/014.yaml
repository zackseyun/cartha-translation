  text: But Samuel said[a], “Then what is this sound of sheep in my ears, and the sound of cattle that I hear?”
translation:
  language: tl
  text: Ngunit sinabi ni Samuel, “Kung gayon, ano itong tunog ng mga tupa sa aking pandinig, at ang tunog ng mga baka na naririnig ko?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi ni Samuel
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay, ngunit sa konteksto ay may pagsalungat ang tugon ni Samuel sa pahayag ni Saul na sumunod siya; kaya natural ang “Ngunit.”
- source_word: וּמֶה
  choice: Kung gayon, ano
  rationale: Humihingi ang tanong ng paliwanag at may retorikal na hamon; malinaw itong naipahahayag ng “Kung gayon, ano.”
- source_word: קוֹל
  choice: ingay
  rationale: Bagaman maaaring mangahulugang “tinig” o “tunog” ang קוֹל, dito ay tumutukoy ito sa naririnig na ingay na ginagawa ng mga hayop.
- source_word: הַצֹּאן
  choice: mga tupa
  rationale: Kolektibong maaaring tumukoy ang salita sa maliliit na alagang hayop, kabilang ang tupa at kambing; sa kontekstong ito, natural at tradisyonal ang “mga tupa,” ngunit hindi nito lubos na naipakikita ang lawak ng Hebreo.
- source_word: הַזֶּה
  choice: itong
  rationale: Pinananatili ng “itong” ang deiktikong diin sa ingay na kasalukuyang naririnig.
- source_word: בְּאָזְנָי
  choice: na naririnig ko
  rationale: Ang literal na “sa aking mga tainga” ay hindi gaanong natural sa modernong Filipino; ang “naririnig ko” ay malinaw na katumbas sa kontekstong ito.
- source_word: וְקוֹל הַבָּקָר
  choice: at ang ingay ng mga baka
  rationale: Kolektibong tumutukoy ang בָּקָר sa bakahan o mga baka; ang “mga baka” ay karaniwan at madaling maunawaan.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: na umaabot sa aking pandinig
  rationale: Iniiwasan nito ang hindi natural na pag-uulit ng “naririnig ko” habang pinananatili ang ideya na si Samuel mismo ang nakaririnig sa hayagang ebidensiya.
