  register: Modernong Filipino na dignified ngunit madaling maunawaan. Pinili ang natural na retorikal na tanong kaysa sa mahigpit na literal na ayos ng Hebreo. Walang footnote dahil ang mga leksikal na alternatibo ay hindi kailangang ilagay sa tekstong panglathala ng talatang ito.
