id: 1SA.15.6
reference: 1 Samuel 15:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֣וּל אֶֽל הַ/קֵּינִ֡י לְכוּ֩ סֻּ֨רוּ רְד֜וּ מִ/תּ֣וֹךְ עֲמָלֵקִ֗י פֶּן אֹֽסִפְ/ךָ֙ עִמּ֔/וֹ וְ/אַתָּ֞ה עָשִׂ֤יתָה חֶ֨סֶד֙ עִם כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/עֲלוֹתָ֖/ם מִ/מִּצְרָ֑יִם וַ/יָּ֥סַר קֵינִ֖י מִ/תּ֥וֹךְ עֲמָלֵֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/006.yaml
  text: Then Saul said to the Kenite[a], “Go, turn aside, go down from among the Amalekites, lest I sweep you away with them[c][b]. For you showed kindness to all the sons of Israel when they came up from Egypt.” So the Kenite turned aside from among the Amalekites.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Saul sa mga Keneo[a], “Umalis kayo! Lumayo kayo at bumaba mula sa gitna ng mga Amalekita, baka malipol ko rin kayo kasama nila.[b] Sapagkat nagpakita kayo ng kagandahang-loob[c] sa lahat ng mga anak ni Israel nang umahon sila mula sa Ehipto.” Kaya lumayo ang mga Keneo mula sa gitna ng mga Amalekita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na nasa pang-isahan ang katawagang Hebreo, “ang Keneo,” ngunit kolektibo itong tumutukoy sa mga Keneo; maramihan din ang mga utos ni Saul.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “baka maalis ko kayo kasama nila.” Sa kontekstong ito, ang pandiwang Hebreo ay tumutukoy sa pagkakasama nila sa hatol na darating sa mga Amalekita.
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Hebreo ay maaari ring mangahulugang “tapat na kabutihan,” “pagmamahal,” o “katapatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי / קֵינִי
  choice: mga Keneo
  rationale: Nasa anyong pang-isahang pangkat-tao ang Hebreo ngunit kolektibo ang gamit, gaya rin ng ipinahihiwatig ng mga pautos na maramihan. Ang “mga Keneo” ang malinaw at likas na katumbas sa modernong Tagalog.
- source_word: לְכוּ סֻּרוּ רְדוּ
  choice: Umalis kayo! Lumayo kayo at bumaba
  rationale: Pinananatili ang tatlong pautos at ang kongkretong diwa ng pagbaba, ngunit gumagamit ng natural na ayos sa Tagalog.
- source_word: מִתּוֹךְ עֲמָלֵקִי / מִתּוֹךְ עֲמָלֵק
  choice: mula sa gitna ng mga Amalekita
  rationale: Ipinahahayag ang paghihiwalay ng mga Keneo mula sa bayang Amalekita at pinananatili ang pagkakatugma ng dalawang parirala.
- source_word: פֶּן אֹסִפְךָ עִמּוֹ
  choice: baka malipol ko rin kayo kasama nila
  rationale: Sa konteksto ng hatol, ang אסף ay maaaring tumukoy sa pag-aalis o paglipol kasama ng iba. Ang “malipol” ay malinaw sa Tagalog, habang inilalahad sa talababa ang ibang posibleng himig.
- source_word: חֶסֶד
  choice: kagandahang-loob
  rationale: Natural at hindi labis na mapagpasiya ang salin para sa tapat at mabuting pakikitungo ng mga Keneo sa Israel. Hindi nito ipinapalagay na may pormal na tipan sa pagitan nila.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: lahat ng mga anak ni Israel
  rationale: Pinananatili ang tahasang pambansang katawagang Hebreo sa halip na gawing “lahat ng Israelita,” bagaman iisang bayan ang tinutukoy.
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: nang umahon sila mula sa Ehipto
  rationale: Pinananatili ang karaniwang wikang pag-ahon mula sa Ehipto na kaugnay ng Exodo.
- source_word: וַיָּסַר
  choice: Kaya lumayo
  rationale: Inuulit ang salitang ginamit sa naunang utos upang maipakita na sumunod ang mga Keneo.
theological_decisions:
- issue: Saklaw ng חֶסֶד sa makasaysayang ugnayan ng mga Keneo at Israel
  choice: kagandahang-loob
  alternative: tapat na pagmamahal; katapatan sa tipan
  rationale: May diwa ang salita ng matapat at mapagkalingang kabutihan, ngunit hindi malinaw sa talata na pormal na pakikipagtipan ang tinutukoy. Kaya iniiwasan ng pangunahing salin ang pagdaragdag ng isang tiyak na teolohikal na konklusyon.
- issue: Pang-isahang anyo ng katawagang Keneo ngunit maramihang kausap
  choice: mga Keneo
  alternative: ang Keneo
  rationale: Ang pang-isahang katawagang pangkat-tao ay kolektibo rito, at maramihan ang mga pautos. Nililinaw ng Tagalog ang tunay na bilang ng mga taong kinakausap nang hindi binabago ang tinutukoy na pangkat.
- issue: Diwa ng אסף sa babala ng hatol
  choice: malipol ko rin kayo kasama nila
  alternative: maalis ko kayo kasama nila; matipon ko kayo kasama nila
  rationale: Ipinahihiwatig ng konteksto ang pagkakasama sa nalalapit na paglipol sa Amalek. Gayunman, dahil mas malawak ang literal na saklaw ng pandiwa, pinananatili sa talababa ang alternatibong “maalis.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kayo” dahil maramihan ang mga pautos sa Hebreo. Pinanatili ang kongkretong “bumaba” at “umahon,” at iniwasan ang teknikal na “katapatan sa tipan” sa pangunahing teksto upang huwag higitan ang malinaw na sinasabi ng konteksto.
