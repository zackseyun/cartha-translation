  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nilipol” bilang likas na pandiwa sa konteksto ng digmaan, at ang “nasa tapat” upang mapanatili ang kalabuan ng heograpikal na parirala. Ang mga pangalang Havila, Shur, at Ehipto ay sumusunod sa karaniwang anyong Filipino.
