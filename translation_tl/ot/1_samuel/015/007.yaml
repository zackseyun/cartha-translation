  yaml_path: translation/ot/1_samuel/015/007.yaml
  text: Then Saul struck Amalek[a], from Havilah as you go to Shur[b], which is opposite Egypt.
translation:
  language: tl
  text: Pagkatapos, sinalakay ni Saul ang Amalek[a] mula Havila hanggang sa Shur[b], na nasa tapat ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga Amalekita.” Ang “Amalek” sa Hebreo ay kolektibong tawag sa bayang nagmula kay Amalek.
    reason: lexical_alternative
  - marker: b
    text: O “na nasa silangan ng Ehipto” o “na nasa harap ng Ehipto.” Maaaring tumukoy ang pananalitang Hebreo sa isang lugar na kaharap o nasa tapat ng Ehipto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: nilipol
  rationale: Sa konteksto ng pakikidigma at ng saklaw na heograpikal, ipinahihiwatig ng נכה ang matinding pagsalakay laban sa bayan. Ang “nilipol” ay likas sa Filipino, bagaman hindi nito ipinapalagay na walang nakaligtas, gaya ng ipinakikita ng kasunod na talata.
- source_word: עֲמָלֵק
  choice: ang Amalek
  rationale: Pinananatili ang pangalang nasa isahan bilang kolektibong tawag sa bayang Amalek; ipinaliliwanag sa talababa ang mas tahasang alternatibong “mga Amalekita.”
- source_word: מֵחֲוִילָה
  choice: mula sa Havila
  rationale: Ang מִן ay tumutukoy sa panimulang dulo ng saklaw na heograpikal.
- source_word: בּוֹאֲךָ שׁוּר
  choice: hanggang sa daan patungong Shur
  rationale: Ang idyomang בּוֹאֲךָ ay nangangahulugang “sa pagpunta mo” o “sa daang patungo.” Ginawang likas na paglalarawan ng hangganan sa Filipino.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרָיִם
  choice: na nasa tapat ng Ehipto
  rationale: Pinananatili ng “nasa tapat” ang heograpikal na di-tiyak na kahulugan ng עַל־פְּנֵי—nasa harap, kaharap, o silangan ng Ehipto—nang hindi labis na nililinaw ang direksiyon.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Karaniwang anyo ng personal na pangalan sa modernong saling Filipino.
