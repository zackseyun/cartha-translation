  text: וַ/יִּסֹּ֥ב שְׁמוּאֵ֖ל לָ/לֶ֑כֶת וַ/יַּחֲזֵ֥ק בִּ/כְנַף מְעִיל֖/וֹ וַ/יִּקָּרַֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/027.yaml
  text: As Samuel turned to go[a], he seized the edge of his robe, and it tore.
translation:
  language: tl
  text: Nang tumalikod si Samuel para umalis, mahigpit na hinawakan ni Saul ang laylayan[a] ng balabal ni Samuel, at napunit iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dulo” o “sulok.” Ang salitang Hebreo ay tumutukoy sa pinakadulong bahagi ng isang kasuotan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב
  choice: tumalikod
  rationale: Ang סבב ay tumutukoy sa pagharap ni Samuel sa ibang direksiyon upang umalis. Natural sa salaysay ang “tumalikod” at hindi nito kailangang ipahiwatig na lubos siyang umikot.
- source_word: לָלֶכֶת
  choice: para umalis
  rationale: Ipinapahayag ng infinitibo ng הלך ang layunin ng pagtalikod ni Samuel. Sa kontekstong ito, mas malinaw at natural ang “umalis” kaysa literal na “lumakad.”
- source_word: וַיַּחֲזֵק
  choice: mahigpit na hinawakan
  rationale: Ang Hiphil ng חזק dito ay nangangahulugang humawak nang mariin o sumunggab. Malinaw at likas sa modernong Filipino ang “mahigpit na hinawakan.”
- source_word: בִּכְנַף
  choice: ang laylayan
  rationale: Ang כָּנָף ay literal na “pakpak” at maaari ring tumukoy sa dulo, sulok, o gilid ng kasuotan. Ang “laylayan” ay angkop sa balabal, habang inilalahad sa talababa ang ibang posibleng paglalarawan.
- source_word: מְעִילוֹ
  choice: ng balabal ni Samuel
  rationale: Ang מְעִיל ay panlabas na kasuotan o balabal. Tinukoy si Samuel sa halip na gumamit ng malabong panghalip, ayon sa malinaw na daloy ng mas malawak na salaysay.
- source_word: וַיִּקָּרַע
  choice: at napunit iyon
  rationale: 'Ang Niphal ay pasibo o intransitibo: napunit ang bahaging hinawakan. Pinananatili ng “iyon” na hindi labis na tinutukoy kung ang laylayan lamang o ang balabal sa bahaging iyon ang napunit.'
theological_decisions:
- issue: Ang hindi tahasang binanggit na simuno ng וַיַּחֲזֵק
  choice: ni Saul
  alternative: niya
  rationale: Bagaman walang nakasulat na pangalan sa sugnay, malinaw sa kasunod-sunod na pangyayari sa 1 Samuel 15:24–28 na si Saul ang humawak sa balabal ni Samuel. Ang pagbanggit sa pangalan ay umiiwas sa nakalilitong mga panghalip sa Filipino at hindi nagdaragdag ng doktrinal na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “balabal” bilang karaniwang salin sa panlabas na kasuotan at “laylayan” bilang natural ngunit hindi lubhang teknikal na tawag sa dulo nito.
