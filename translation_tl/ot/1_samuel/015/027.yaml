  source_fidelity: 'Tumpak ang salin sa Hebreo: si Samuel ay pumihit upang umalis; si Saul, na malinaw mula sa konteksto, ang humawak nang mahigpit sa dulo ng balabal ni Samuel; at napunit ito. Ang paggamit ng “ni Saul” ay makatuwirang paglilinaw ng di-binanggit na simuno at hindi pagdaragdag ng kahulugan.'
