  text: Now please forgive my sin[a], and return with me[b], so that I may bow down to Yahweh.
translation:
  language: tl
  text: Ngayon, patawarin mo sana ang kasalanan ko[a] at bumalik kang kasama ko, upang yumukod ako[b] kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “iangat ang kasalanan ko,” isang idyomang nangangahulugang “patawarin ang kasalanan ko.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “upang makasamba ako kay Yahweh.” Ang pandiwang Hebreo ay literal na tumutukoy sa pagyukod o pagpapatirapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngayon
  rationale: Ipinakikita nito ang agarang pakiusap ni Saul bilang tugon sa pagsaway ni Samuel; likas sa modernong Tagalog ang “Ngayon.”
- source_word: שָׂא נָא
  choice: patawarin mo sana
  rationale: Bagaman literal na nangangahulugang “buhatin/dalhin” ang נָשָׂא, kasama ng חַטָּאת ay idyoma ito para sa pagpapatawad o pag-aalis ng kasalanan. Ipinahahayag ng “sana” ang magalang at mariing pakiusap ng נָא.
- source_word: אֶת חַטָּאתִי
  choice: ang kasalanan ko
  rationale: Sa konteksto ng pag-amin ni Saul, tumutukoy ang חַטָּאת sa kaniyang kasalanan, hindi sa handog para sa kasalanan.
- source_word: וְשׁוּב עִמִּי
  choice: at bumalik kang kasama ko
  rationale: Pinananatili ng “bumalik” ang pangunahing diwa ng שׁוּב, at malinaw na hinihiling ni Saul na samahan siya ni Samuel sa pagbabalik.
- source_word: וְאֶשְׁתַּחֲוֶה
  choice: upang makayukod ako
  rationale: Tumutukoy ang pandiwa sa pisikal na pagyukod o pagpapatirapa, na sa kontekstong ito ay gawa ng pagsamba. Ipinahahayag ng “upang” ang layuning sumusunod sa pakiusap.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang tinutukoy ng pangalang tipan na יהוה si Yahweh; ang “kay” ay natural na pananda sa Tagalog para sa personal na pinag-uukulan ng pagyukod.
theological_decisions:
- issue: Paglalarawan sa kilos ng שׁחה
  choice: makayukod
  alternative: makasamba
  rationale: Pinananatili ng “makayukod” ang kongkretong pisikal na kilos ng Hebreo nang hindi inaalis ang malinaw na pahiwatig ng pagsamba kay Yahweh.
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang personal na pangalang “Yahweh” upang katawanin nang tuwiran ang Tetragrammaton at hindi ito palitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patawarin mo sana” bilang natural na pakiusap at ang “makayukod” upang mapanatili ang pisikal na larawan ng tekstong Hebreo.
