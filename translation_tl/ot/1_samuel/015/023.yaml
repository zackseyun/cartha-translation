id: 1SA.15.23
reference: 1 Samuel 15:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֤י חַטַּאת קֶ֨סֶם֙ מֶ֔רִי וְ/אָ֥וֶן וּ/תְרָפִ֖ים הַפְצַ֑ר יַ֗עַן מָאַ֨סְתָּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֖ מִ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/023.yaml
  text: For rebellion is like the sin of divination[a], and stubbornness is like wickedness and household idols. Because you have rejected the word of Yahweh[c][b], he has also rejected you from being king.
translation:
  language: tl
  text: Sapagkat ang paghihimagsik ay tulad ng kasalanan ng panghuhula[a], at ang pagmamatigas ay tulad ng kasamaan at mga diyus-diyosan sa tahanan[b]. Dahil itinakwil mo ang salita ni Yahweh, itinakwil ka rin niya bilang hari.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “kasalanan ng pangkukulam.” Mas malawak ang Hebreong קֶסֶם (qesem): panghuhula o paghahanap ng nakatagong kaalaman sa ipinagbabawal na paraan.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: תְּרָפִים (terafim), mga imahen o diyus-diyosang ginagamit sa kulto sa sambahayan.'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “itinakwil ka rin niya mula sa pagiging hari.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan ng naunang pagsaway, samantalang ang יַעַן sa kasunod na pangungusap ang naghahayag ng tiyak na dahilan ng hatol.
- source_word: חַטַּאת קֶסֶם
  choice: kasalanan ng panghuhula
  rationale: Pinananatili ang ugnayang konstruktong Hebreo. Ang “panghuhula” rito ay tumutukoy sa ipinagbabawal na paghahanap ng nakatagong kaalaman, hindi lamang sa karaniwang paghula.
- source_word: מֶרִי
  choice: paghihimagsik
  rationale: Nagpapahayag ng hayagang pagsuway at paglaban sa may awtoridad; ang salita ay natural at may angkop na bigat sa konteksto.
- source_word: וְאָוֶן
  choice: kasamaan
  rationale: Sa pagkakatambal nito sa תְּרָפִים, moral na kasamaan ang pinakamalamang na diwa, hindi simpleng kaguluhan o kawalang-kabuluhan.
- source_word: וּתְרָפִים
  choice: mga diyus-diyosan sa tahanan
  rationale: Ipinahahayag ang kahulugan ng mga terafim bilang mga imaheng ginagamit sa kulto o pagsamba sa sambahayan, sa paraang mauunawaan agad ng makabagong mambabasa.
- source_word: הַפְצַר
  choice: pagmamatigas
  rationale: Tumutukoy sa mapilit at mapagmatigas na pagtangging sumunod; malinaw at likas itong katumbas sa modernong Tagalog.
- source_word: יַעַן
  choice: Dahil
  rationale: Malinaw na ipinakikilala ang sanhi ng hatol kay Saul.
- source_word: מָאַסְתָּ אֶת דְּבַר יְהוָה
  choice: itinakwil mo ang salita ni Yahweh
  rationale: Pinananatili ng “itinakwil” ang diwa ng pagtanggi o paghamak at ang retorikal na pag-uulit ng parehong pandiwa sa ikalawang sugnay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיִּמְאָסְךָ מִמֶּלֶךְ
  choice: itinakwil ka rin niya bilang hari
  rationale: Likas ito sa Tagalog at pinananatili ang pag-uulit ng מָאַס. Ang pang-ukol na מִן ay maaari ring idiin ang pagkaalis sa katayuang hari, kaya inilalahad iyon sa talababa.
theological_decisions:
- issue: Kayarian ng paghahambing sa unang pangungusap
  choice: Inihahambing ang paghihimagsik sa kasalanan ng panghuhula, at ang pagmamatigas sa kasamaan at mga diyus-diyosan sa tahanan.
  alternative: Tuwirang ipinapantay ang paghihimagsik sa kasalanan ng panghuhula at ang pagmamatigas sa kasamaan at mga terafim, nang walang salitang “tulad.”
  rationale: Walang tahasang ikalawang katumbas ng “tulad” sa Hebreo, ngunit sinusuportahan ng paralelismo ang pagdadala ng paghahambing sa dalawang hati. Pinananatili nito ang matinding pag-uugnay ni Samuel nang hindi nagiging matigas o malabo ang Tagalog.
- issue: Saklaw ng pagtakwil kay Saul
  choice: itinakwil ka rin niya bilang hari
  alternative: itinakwil ka rin niya mula sa pagiging hari
  rationale: Maaaring ipahiwatig ng מִמֶּלֶךְ ang pagtakwil sa kaniya sa kapasidad niya bilang hari o ang pag-aalis sa kaniya sa paghahari. Pinili sa teksto ang mas likas na Tagalog at inilagay sa talababa ang mas tahasang pagbasa tungkol sa pagkawala ng katungkulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “paghihimagsik” at “pagmamatigas” upang mapanatili ang bigat at paralelismo ng pahayag, habang ipinaliwanag sa talababa ang mga teknikal na terminong pangkulto.
