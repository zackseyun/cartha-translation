  text: וַ/יֹּ֨אמֶר שָׁא֜וּל מֵ/עֲמָלֵקִ֣י הֱבִיא֗וּ/ם אֲשֶׁ֨ר חָמַ֤ל הָ/עָם֙ עַל מֵיטַ֤ב הַ/צֹּאן֙ וְ/הַ/בָּקָ֔ר לְמַ֥עַן זְבֹ֖חַ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/אֶת הַ/יּוֹתֵ֖ר הֶחֱרַֽמְנוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/015.yaml
  text: And Saul said[a], “They brought them from the Amalekites, because the people spared the best of the sheep and the cattle, in order to sacrifice them to Yahweh your God; but the rest we devoted to destruction.”
translation:
  language: tl
  text: At sinabi ni Saul, “Dinala nila ang mga iyan mula sa mga Amalekita, sapagkat ang pinakamainam sa mga tupa at baka ay hindi nilipol ng mga tao upang ihandog kay Yahweh na iyong Diyos. Ngunit ang natira ay itinalaga namin sa paglipol.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lubusan naming nilipol.” Ang salitang Hebreo ay anyo ng חָרַם, isang teknikal na katawagan para sa pagtatalaga sa paglipol sa ilalim ng pagbabawal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱבִיאוּם
  choice: Dinala nila ang mga iyan
  rationale: Ang Hifil ng בוא na may hulaping layon na pangmaramihan ay nagsasaad na sila ang nagdala sa mga hayop. Ang “mga iyan” ay natural na tumutukoy sa mga hayop na pinag-uusapan.
- source_word: מֵעֲמָלֵקִי
  choice: mula sa mga Amalekita
  rationale: Ang anyong gentiliko ay tumutukoy sa pangkat ng mga tao, kaya mas tiyak ang “mga Amalekita” kaysa sa lugar na “Amalek.”
- source_word: חָמַל ... עַל
  choice: hindi pinatay
  rationale: Sa konteksto ng utos na lipulin ang mga bagay na nasa ilalim ng pagbabawal, ang pandiwa ay nangangahulugang pinanatiling buhay o hindi nilipol. Ang “hindi pinatay” ay malinaw at natural sa modernong Tagalog.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: ang pinakamainam sa mga tupa at baka
  rationale: Ipinahihiwatig ng מֵיטַב ang piling pinakamagandang bahagi ng mga kawan at bakahan. Pinananatili ng salin ang dalawang uri ng hayop.
- source_word: לְמַעַן זְבֹחַ
  choice: upang ihandog ang mga iyon
  rationale: Ang לְמַעַן ay nagpapahayag ng layunin. Ginagawang tahas ng “ang mga iyon” ang ipinahihiwatig na layon ng paghahandog.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: Pinananatili ang ikalawang panauhang isahan sa sinabi ni Saul kay Samuel, pati ang kapansin-pansing retorikal na distansiyang dulot ng “iyong Diyos.”
- source_word: הַיּוֹתֵר
  choice: ang natira
  rationale: Natural at maikli itong tumutukoy sa lahat ng hindi kabilang sa pinakamainam na mga hayop na hindi pinatay.
- source_word: הֶחֱרַמְנוּ
  choice: itinalaga namin sa paglipol
  rationale: Ang Hifil ng חרם ay isang teknikal na katawagan sa paglalagay ng isang bagay sa ilalim ng banal na pagbabawal para sa paglipol. Pinananatili ng salin ang ideya ng pagtatalaga, hindi lamang ang aktuwal na pagwasak.
theological_decisions:
- issue: Kahulugan ng חרם sa konteksto ng banal na paghatol at pakikidigma
  choice: itinalaga namin sa paglipol
  alternative: lubusan naming nilipol
  rationale: May diwang pagtatalaga sa ilalim ng banal na pagbabawal ang pandiwa, bukod sa simpleng pagwasak. Pinananatili ng pangunahing salin ang teknikal na puwersang ito, habang ibinibigay sa talababa ang mas tuwirang alternatibo.
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton bilang pansariling pangalan ng Diyos; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Pahayag ni Saul na “iyong Diyos”
  choice: iyong Diyos
  alternative: ating Diyos
  rationale: Malinaw na ikalawang panauhang isahan ang hulapi sa Hebreo. Hindi ito ginawang “ating Diyos,” upang mapanatili ang posibleng retorikal na distansiya nang hindi ipinapaliwanag ang motibo ni Saul.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang payak na “hindi pinatay” para sa konkretong kilos ng pag-iwas sa paglipol, ngunit pinanatili ang mas teknikal na “itinalaga sa paglipol” para sa חרם. Ang “mga iyan” at “mga iyon” ay natural na pantukoy sa mga hayop na nasa agarang konteksto.
