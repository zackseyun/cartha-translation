  to: At sinabi ni Saul, “Dinala nila ang mga iyan mula sa mga Amalekita, sapagkat ang pinakamainam sa mga tupa at baka ay hindi nilipol ng mga tao upang ihandog kay Yahweh na iyong Diyos. Ngunit ang natira ay itinalaga namin sa paglipol.[a]”
