base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/016.yaml
  text: Then Samuel said to Saul[a], “Stop, and I will tell you what Yahweh said to me last night.” And he said to him, “Speak.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Samuel kay Saul[a], “Tumigil ka, at sasabihin ko sa iyo ang sinabi sa akin ni Yahweh kagabi.” Sumagot si Saul, “Magsalita ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa nakasulat na anyong Hebreo, ang huling sugnay ay “at sinabi nila sa kanya.” Ngunit ipinakikita ng konteksto na si Saul ang nagsasalita, kaya isahan ang diwa: “sumagot si Saul.”'
    reason: textual_variant
lexical_decisions:
- source_word: הֶרֶף
  choice: Tumigil ka
  rationale: Matalim na pautos ito kay Saul na huminto sa pagsasalita; tuwiran at natural ang “Tumigil ka” sa makabagong Filipino.
- source_word: וְאַגִּידָה לְּךָ
  choice: at sasabihin ko sa iyo
  rationale: Ang hiphil ng נגד ay nangangahulugang magpahayag o magsabi; pinananatili ng parirala ang pagkakasunod sa pautos at ang layunin ni Samuel.
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: ang sinabi
  rationale: Natural nitong ipinapakilala sa Filipino ang nilalaman ng sinabi ni Yahweh nang hindi nagdaragdag ng paliwanag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: הַלָּיְלָה
  choice: kagabi
  rationale: Dahil naganap na ang pagsasalita ni Yahweh, tumutukoy ito sa gabing kalilipas lamang.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Sinabi nito sa kanya
  rationale: Plural ang nakasulat na anyong Hebreo, ngunit si Saul lamang ang makatuwirang sumasagot sa konteksto; ang “nito” ay malinaw na tumutukoy kay Saul habang pinananatili sa talababa ang suliraning tekstuwal.
- source_word: דַּבֵּר
  choice: Magsalita ka
  rationale: Tuwiran at maikli itong katumbas ng payak na pautos na nagpapahintulot kay Samuel na magpatuloy.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Pinananatili ang personal na pangalan sa tekstong pinagmulan at hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Bilang ng huling nagsalita sa talata
  choice: 'Isahan: si Saul ang sumagot'
  alternative: 'Maramihan: “sinabi nila sa kanya”'
  rationale: Bagaman maramihan ang nakasulat na anyo, iisang kausap lamang—si Saul—ang hinihingi ng malinaw na daloy ng salaysay; hayagang itinatala sa talababa ang pagkakaiba.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Pinananatili ang matalas na tono ng pagsaway ni Samuel at ang maikling tugon ni Saul; iniwasan ang makaluma o labis na pormal na pananalita.
