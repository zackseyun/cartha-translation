base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/019.yaml
  text: Why then did you not obey the voice of Yahweh[a], but rush upon the spoil and do what was evil in the eyes of Yahweh?
translation:
  language: tl
  text: Bakit nga hindi mo sinunod ang sinabi ni Yahweh, at sabik mong dinambahan ang samsam[a] at ginawa ang masama sa paningin ni Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dumagit sa samsam” o “dumamba sa samsam.” Ipinahihiwatig ng pandiwang Hebreo ang sabik at mapag-imbot na pagkilos patungo sa mga bagay na nakuha sa digmaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: Bakit nga
  rationale: Likas na ipinahahayag sa modernong Tagalog ang mapanumbat na tanong at ang puwersa ng pang-ugnay na וְ sa konteksto.
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: sinunod ang sinabi
  rationale: Sa konteksto ng isang utos, ang idyomang Hebreo ay tumutukoy sa pagsunod, hindi lamang sa pisikal na pakikinig. Pinananatili ng “ang sinabi” ang kaugnayan nito sa tinig o pahayag nang natural sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang Hebreo na YHWH sa halip na palitan ito ng isang titulo.
- source_word: וַתַּעַט אֶל
  choice: buong pananabik mong sinunggaban
  rationale: Ipinahihiwatig ng pambihirang pandiwa ang mabilis at mapag-imbot na pagkilos patungo sa samsam. Inihahatid ng “sinunggaban” ang marahas at sabik na pagkilos, habang nililinaw ng “buong pananabik” ang puwersa nito.
- source_word: הַשָּׁלָל
  choice: ang samsam
  rationale: Ang “samsam” ay likas at dignified na salitang Tagalog para sa mga bagay na kinuha sa digmaan.
- source_word: וַתַּעַשׂ הָרַע
  choice: ginawa ang masama
  rationale: Natural na Tagalog ito para sa karaniwang idyomang Hebreo na nangangahulugang kumilos nang masama.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang malinaw na metapora ng Hebreo at ang diwang ang kilos ay hinahatulan ayon sa pagtataya ni Yahweh.
theological_decisions:
- issue: Paglalarawan sa pagsuway ni Saul
  choice: sinunod ang sinabi ni Yahweh
  alternative: nakinig sa tinig ni Yahweh
  rationale: Nasa saklaw ng pandiwang שׁמע ang kapwa pakikinig at pagsunod. Sa konteksto ng tuwirang utos, nangingibabaw ang diwa ng pagsunod, ngunit ang “ang sinabi” ay hindi nagdaragdag ng isang partikular na paliwanag sa nilalaman nito.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong pangalan sa salin sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “samsam” bilang malinaw na terminong pandigma at inilagay ang talababa sa pandiwang may tunay na leksikal na kalabuan.
