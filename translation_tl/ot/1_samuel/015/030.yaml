  to: At sinabi niya, “Nagkasala ako. Ngayon, pakisuyo, parangalan mo ako sa harap ng mga matatanda ng aking bayan at sa harap ng Israel. Bumalik ka kasama ko upang yumukod ako kay Yahweh, na iyong Diyos.”[a]
