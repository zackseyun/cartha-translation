  text: וַ/יֹּ֣אמֶר חָטָ֔אתִי עַתָּ֗ה כַּבְּדֵ֥/נִי נָ֛א נֶ֥גֶד זִקְנֵֽי עַמִּ֖/י וְ/נֶ֣גֶד יִשְׂרָאֵ֑ל וְ/שׁ֣וּב עִמִּ֔/י וְ/הִֽשְׁתַּחֲוֵ֖יתִי לַֽ/יהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/030.yaml
  text: And he said[a], “I have sinned. Now please honor me before the elders of my people and before Israel, and return with me, so that I may bow down to Yahweh your God.”
translation:
  language: tl
  text: At sinabi niya, “Nagkasala ako. Ngayon, pakisuyo, parangalan mo ako sa harap ng mga matatanda ng aking bayan at sa harap ng Israel. Bumalik ka kasama ko upang yumukod ako kay Yahweh, na iyong Diyos.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang hulihan: “at yuyukod ako kay Yahweh, na iyong Diyos.” Ang anyong Hebreo ay maaaring unawain bilang simpleng pagpapatuloy (“at yuyukod ako”) o bilang layunin ng naunang pakiusap (“upang yumukod ako”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Nagkasala ako
  rationale: Likas at tuwirang Filipino para sa Qal perfect 1cs; ipinahahayag ang nagawang kasalanan na mahalaga sa kasalukuyang usapan.
- source_word: עַתָּה
  choice: Ngayon
  rationale: Pinananatili ang agarang paglipat mula sa pag-amin tungo sa pakiusap.
- source_word: כַּבְּדֵנִי נָא
  choice: pakisuyo, parangalan mo ako
  rationale: Ang Piel imperative ng כבד ay tumutukoy sa pampublikong pagbibigay-dangal; ipinahahayag ng “pakisuyo” ang נָא.
- source_word: נֶגֶד זִקְנֵי עַמִּי וְנֶגֶד יִשְׂרָאֵל
  choice: sa harap ng matatandang pinuno ng aking bayan at sa harap ng Israel
  rationale: Inilalahad ang hayag at pampublikong tagpo. Nililinaw ng “matatandang pinuno” ang tungkuling panlipunan ng זקנים nang hindi idinaragdag ang “buong” Israel, na wala sa Hebreo.
- source_word: וְשׁוּב עִמִּי
  choice: Bumalik ka kasama ko
  rationale: Tuwirang inilalarawan ang pakiusap kay Samuel na bumalik at sumama kay Saul.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: upang makayukod ako sa pagsamba
  rationale: Pinananatili ang pisikal na diwa ng pagpapatirapa o pagyukod, habang nililinaw ng pariralang “sa pagsamba” ang kilos na nakatuon kay Yahweh.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang pangalang tipan na “Yahweh,” ayon sa ibinigay na doktrinal na pasya.
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: Pinananatili ang tahasang ikalawang panauhang isahan at ang tensiyong nililikha ng pagtukoy ni Saul kay Yahweh bilang Diyos ni Samuel.
theological_decisions:
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo; ang “Yahweh” ay nagpapanatili rito bilang pangalang tipan sa halip na palitan ng titulo.
- issue: Ang pananalitang אֱלֹהֶיךָ ni Saul
  choice: iyong Diyos
  alternative: ating Diyos
  rationale: Tahasang ikalawang panauhang isahan ang Hebreo. Hindi ito ginawang “ating Diyos” upang mapanatili ang mahalagang tensiyong salaysay at teolohikal.
- issue: Ugnayan ng וְהִשְׁתַּחֲוֵיתִי sa naunang pakiusap
  choice: upang makayukod ako
  alternative: at yuyukod ako
  rationale: Ang anyong Hebreo ay maaaring basahing simpleng pagpapatuloy o layunin. Pinili sa pangunahing teksto ang likas na pagbasa bilang layunin, at inilagay sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang pinuno” upang maging madaling maunawaan ang institusyonal na diwa ng “elders,” at pinanatili ang pampublikong pag-aalala ni Saul at ang tensiyon ng “iyong Diyos.”
