  terminology: Ang “Yahweh” at “iyong Diyos” ay wastong pinananatili. Ang “yumukod” ay maayos na katumbas ng kilos ng pagpapatirapa/pagyukod at hindi nito pinapalitan ang konkretong kilos ng isang mas malawak na terminong interpretatibo gaya ng “sumamba.”
