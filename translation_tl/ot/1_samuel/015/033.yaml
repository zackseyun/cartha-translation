base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/033.yaml
  text: Samuel said[a], “As your sword has made women childless[b], so your mother will be childless among women.” And Samuel hacked Agag to pieces before Yahweh at Gilgal.
translation:
  language: tl
  text: Sinabi ni Samuel, “Kung paanong pinagkaitan ng iyong tabak ng mga anak ang mga babae, gayon din pagkakaitan ng anak ang iyong ina sa gitna ng mga babae.”[a] At pinagputul-putol ni Samuel si Agag sa harap ni Yahweh sa Gilgal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kung paanong pinangulila ng iyong tabak ang mga babae, gayon din pangungulilain ang iyong ina sa gitna ng mga babae.” Iisang pandiwa ang ginamit sa dalawang sugnay sa Hebreo, na nagdiriin sa katumbas na ganti.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tinadtad ni Samuel si Agag” o “pinaghiwa-hiwalay ni Samuel si Agag.” Marahas ang bihirang pandiwang Hebreo at nagpapahiwatig ng paghiwa o pagputol-putol.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכְּלָה / תִּשְׁכַּל (שׁכל)
  choice: inulila ... sa mga anak / mauulila sa anak
  rationale: Tumutukoy ang ugat sa pangungulila dahil sa pagkamatay o pagkawala ng mga anak. Pinananatili ng magkatugmang parirala ang pag-uulit ng iisang pandiwang Hebreo at ang diwa ng katumbas na ganti.
- source_word: חַרְבֶּךָ
  choice: iyong tabak
  rationale: Tuwirang salin na likas ding nagpapahiwatig sa mararahas na ginawa ni Agag.
- source_word: מִנָּשִׁים
  choice: sa gitna ng mga babae
  rationale: Likas na salin ng paghahambing na ipinahihiwatig ng pang-ukol מן sa kontekstong ito.
- source_word: וַיְשַׁסֵּף
  choice: pinagtataga ... hanggang sa magkapira-piraso
  rationale: Ipinakikita ng bihira at marahas na pandiwa ang paghiwa o pagputol-putol. Malinaw ang tindi ng kilos nang hindi gumagamit ng makalumang salita o pinahihinang 'pinatay' lamang.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Natural na salin ng pariralang tumutukoy sa harapan o presensiya ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo.
- source_word: בַּגִּלְגָּל
  choice: sa Gilgal
  rationale: Karaniwang paraan sa Filipino ng pagtukoy sa lugar na pinangyarihan.
theological_decisions:
- issue: Ang marahas na pagpatay kay Agag
  choice: Tahasang si Samuel ang gumawa, at isinaling 'pinagtataga ... hanggang sa magkapira-piraso.'
  alternative: “Pinagputul-putol ni Samuel si Agag” o “pinatay ni Samuel si Agag”
  rationale: Malinaw sa Hebreo na si Samuel ang gumawa at marahas ang pandiwa. Hindi dapat pagaanin ang salaysay sa 'pinatay' lamang, ngunit hindi rin dapat dagdagan ng paliwanag o pagbibigay-katwirang wala sa talata.
- issue: Ang banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tahasang ginagamit sa talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “tabak” at “sa harap ni Yahweh” bilang pormal ngunit madaling maunawaang mga parirala. Iniwasan ang makalumang “nilagari” o “tinaga nang pira-piraso” bilang posibleng labis na mekanikal o sensationalized; pinanatili naman ang tahasang karahasan ng orihinal.
