  naturalness: Nauunawaan ang draft, ngunit mas natural sa modernong Filipino ang “lahat ng tao” kaysa “lahat ng mga tao.” Ang paglalagay ng “si Agag, ang hari ng Amalek” ay nagpapalinaw rin sa appositional na ugnayan nang hindi binabago ang kahulugan.
  terminology: Ang “itinalaga ... sa pagkalipol” ay angkop na salin para sa חרם. Pinananatili ang “sa talim ng tabak” bilang natural na katumbas ng Hebreong idyoma. Nililinaw ng talababa ang teknikal na konsepto ng ḥerem nang hindi ipinipilit ang isang doktrinal na pagpapakahulugan.
