base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/008.yaml
  text: He captured Agag king of Amalek alive[a], and devoted all the people to destruction with the edge of the sword.
translation:
  language: tl
  text: Binihag niyang buhay si Agag, ang hari ng Amalek, at itinalaga niya ang lahat ng tao sa pagkalipol[a] sa talim ng tabak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lubusan niyang nilipol ang lahat ng tao.” Ang pandiwang Hebreo ay tumutukoy sa pagtatalaga ng tao o bagay sa pagkalipol sa ilalim ng ḥerem, isang natatanging pagbabawal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: Binihag
  rationale: Ang pandiwa ay nangangahulugang hulihin o dakpin. Ang “binihag” ay natural sa konteksto ng digmaan at malinaw na tumutukoy sa pagdakip sa isang kaaway.
- source_word: אֲגַג
  choice: Agag
  rationale: Isinalin sa karaniwang transliterasyon sa Filipino ang pangalan ng tao.
- source_word: מֶלֶךְ עֲמָלֵק
  choice: hari ng Amalek
  rationale: Tuwirang pinananatili nito ang ugnayang nasa pariralang Hebreo at natural itong basahin sa Filipino.
- source_word: חָי
  choice: buhay
  rationale: Ipinakikitang buhay, sa halip na patay, si Agag nang bihagin siya.
- source_word: כָּל הָעָם
  choice: ang lahat ng mga tao
  rationale: Pinananatili ang malawak na kahulugan ng עָם nang hindi nililimitahan sa mga kawal o sa mga sibilyan lamang.
- source_word: הֶחֱרִים
  choice: itinalaga ... sa pagkalipol
  rationale: Ang hiphil ng חרם ay tumutukoy sa paglalagay sa ilalim ng ḥerem—pagtatalaga sa ganap na pagkalipol. Pinananatili ng salin ang natatanging bigat ng terminong pandigma at panrelihiyon sa halip na gawin lamang itong karaniwang pagpatay.
- source_word: לְפִי חָרֶב
  choice: sa talim ng tabak
  rationale: Ito ang natural na katumbas sa Filipino ng idyomang Hebreo na literal na “sa bibig ng tabak,” habang pinananatili ang larawan ng talim.
theological_decisions:
- issue: Paglalarawan sa wikang pandigma ng חרם
  choice: itinalaga niya sa pagkalipol ang lahat ng mga tao
  alternative: nilipol niya nang lubusan ang lahat ng mga tao
  rationale: Pinananatili ng pangunahing salin ang teolohikal at panritwal na bigat ng חרם nang hindi ito pinapantay sa karaniwang pagpatay. Inilalagay sa talababa ang mas tuwirang paglalarawan sa kinalabasan upang mapanatili ang tunay na lawak ng kahulugan.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “binihag niyang buhay” at “sa talim ng tabak” ay malinaw sa karaniwang mambabasa, samantalang ang “itinalaga sa pagkalipol” ay sadyang nagpapanatili sa natatanging kahulugan ng terminong Hebreo.
