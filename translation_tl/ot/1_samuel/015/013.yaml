base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/013.yaml
  text: Then Samuel came to Saul[a], and Saul said to him, “Blessed are you to Yahweh[b]; I have carried out the word of Yahweh.”
translation:
  language: tl
  text: Pagkatapos, dumating si Samuel kay Saul. Sinabi ni Saul sa kanya, “Pinagpala ka ni Yahweh[a]! Tinupad ko ang salita ni Yahweh.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Pagpalain ka nawa ni Yahweh.” Ang Hebreo ay isang pormula ng pagbabasbas na anyong pagpapahayag na pinagpala ang kausap, ngunit maaari ring ipahayag bilang isang pagbabasbas o kahilingan sa Tagalog.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Isinakatuparan ko” o “isinagawa ko ang salita ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Isinasalaysay ng pandiwa ang pagdating ni Samuel sa kinaroroonan ni Saul; natural at malinaw sa makabagong Tagalog ang “dumating.”
- source_word: וַיֹּאמֶר לוֹ
  choice: sinabi ... sa kanya
  rationale: Pinananatili nito ang tahasang di-tuwirang layon na לוֹ, habang malinaw na inuulit ang nagsasalita at kinakausap.
- source_word: בָּרוּךְ אַתָּה לַיהוָה
  choice: Pagpalain ka nawa ni Yahweh
  rationale: Natural itong pormula ng pagbabasbas sa Tagalog at ipinapahayag na si Yahweh ang pinagmumulan o gumagawa ng pagpapala, nang hindi gumagamit ng alanganing literal na “pinagpala ka para kay Yahweh.”
- source_word: הֲקִימֹתִי
  choice: Tinupad ko
  rationale: Sa pagsama sa דְּבַר יְהוָה, ang hiphil ng קום ay tumutukoy sa pagsasakatuparan o pagpapatupad ng sinabi; ang “tinupad” ay natural at pinananatiling pahayag lamang ni Saul ang ganap na pagsunod.
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ng “salita” ang lawak ng דָּבָר, bagaman sa konteksto ay tumutukoy ito sa utos ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Lakas ng pahayag ni Saul tungkol sa pagsunod
  choice: Tinupad ko ang salita ni Yahweh
  alternative: Sinunod ko ang utos ni Yahweh
  rationale: Pinananatili ng “salita” ang anyo at lawak ng דְּבַר, at ng “tinupad” ang mariing pag-aangkin ni Saul nang hindi pinatutunayan ng salin kung tama ang kanyang sinabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang pangungusap ang salaysay upang maging likas ang daloy. Ginamit ang “nawa” para kilalanin ang pormula ng pagbabasbas, samantalang inilagay sa talababa ang statibong alternatibo.
