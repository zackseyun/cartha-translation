revisions:
- from: Ngunit kumuha ang bayan mula sa samsam ng mga tupa at baka—ang pinakamainam sa mga itinalagang lipulin[a]—upang ihandog sa PANGINOON[b] mong Diyos sa Gilgal.
  to: Ngunit kumuha ang bayan mula sa samsam ng mga tupa at baka—ang pinakamainam sa mga hayop na inilaan upang lipulin[a]—upang ihandog bilang hain sa PANGINOON[b] mong Diyos sa Gilgal.
