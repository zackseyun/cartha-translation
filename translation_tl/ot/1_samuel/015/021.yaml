  source_fidelity: 'Tumpak ang pangunahing diwa: ibinabaling ni Saul sa bayan ang pagkukuha ng mga tupa at baka mula sa samsam upang ihandog sa PANGINOON sa Gilgal. Napapanatili rin ang makabuluhang ‘mong Diyos’ (ikalawang panauhang isahan). Gayunman, ang ‘mga itinalagang lipulin’ ay maaaring basahing mga taong inatasang manlipol, sa halip na mga hayop/bagay na itinalaga sa paglipol. Hindi rin ganap na naipapahayag ng simpleng ‘ihandog’ ang tiyak na pandiwang ‘maghandog ng hain.’'
  naturalness: Marangal at madaling unawain ang Tagalog, ngunit mas natural at walang kalabuan ang ‘mga hayop na inilaan upang lipulin.’ Ang ‘ihandog bilang hain’ ay mas tiyak at natural para sa layuning sakripisyal ng לזבח.
  terminology: Ang ‘samsam,’ ‘PANGINOON,’ ‘Diyos,’ at ‘Gilgal’ ay angkop. Dapat panatilihin ang PANGINOON at ang talababa para sa YHWH. Ang חֵרֶם ay kailangang ilarawan bilang bagay o hayop na inilaan sa paglipol, hindi bilang mga posibleng tagaganap ng paglipol.
