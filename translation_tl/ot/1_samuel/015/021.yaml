base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/021.yaml
  text: But the people took from the spoil sheep and cattle[a], the best of what had been devoted to destruction[c][b], to sacrifice to Yahweh your God at Gilgal.
translation:
  language: tl
  text: Ngunit kumuha ang bayan mula sa samsam ng mga tupa at baka—ang pinakamainam sa mga hayop na inilaan upang lipulin[a]—upang ihandog bilang hain sa PANGINOON[b] mong Diyos sa Gilgal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang pinakamainam—or ang una—sa mga itinalagang lipulin.” Ang mga hayop na ito ay saklaw ng utos na lipulin at hindi dapat itinabi.
    reason: lexical_alternative
  - marker: b
    text: Ang “PANGINOON” ay salin ng banal na pangalang YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Ngunit kumuha
  rationale: Ang לקח ay karaniwang nangangahulugang “kumuha.” Ginamit ang “Ngunit” upang ipakita ang pagsalungat sa naunang pahayag ni Saul.
- source_word: הָעָם
  choice: ang bayan
  rationale: Pinananatili nito ang kolektibong katawagan ng Hebreo at ang pagtatangka ni Saul na ibaling sa mga tao ang pananagutan; sa konteksto, tumutukoy ito sa kanyang mga tauhan.
- source_word: מֵהַשָּׁלָל
  choice: mula sa samsam
  rationale: Ang שׁלל ay mga ari-ariang nakuha sa digmaan; natural at malinaw sa modernong Tagalog ang “samsam.”
- source_word: צֹאן וּבָקָר
  choice: mga tupa at baka
  rationale: Tiyak na tinutukoy ng pares ang maliliit at malalaking alagang hayop.
- source_word: רֵאשִׁית
  choice: ang pinakamainam
  rationale: Bagaman maaari itong mangahulugang “una” o “unang bahagi,” sa kontekstong ito ay tumutukoy ito sa pinakapiling bahagi ng mga hayop.
- source_word: הַחֵרֶם
  choice: mga itinalagang lipulin
  rationale: Ipinahahayag nito na ang mga hayop ay inilaan sa Diyos para sa paglipol at hindi karaniwang samsam na maaaring itabi.
- source_word: לִזְבֹּחַ
  choice: upang ihandog
  rationale: Ipinapakita ng pawatas ang layunin. Sa konteksto ng paghahain sa Diyos, natural ang “ihandog.”
- source_word: לַיהוָה
  choice: sa PANGINOON
  rationale: Ginagamit ang nakaugaliang salin na “PANGINOON” para sa banal na pangalang YHWH, na nililinaw sa talababa.
- source_word: אֱלֹהֶיךָ
  choice: mong Diyos
  rationale: 'Pinananatili ang ikalawang panauhang isahan: sinabi ni Saul kay Samuel na “iyong Diyos,” hindi “ating Diyos.”'
- source_word: בַּגִּלְגָּל
  choice: sa Gilgal
  rationale: Natural na pang-ukol sa Tagalog para sa lokasyon.
theological_decisions:
- issue: Kahulugan ng חֵרֶם sa konteksto ng banal na digmaan
  choice: mga itinalagang lipulin
  alternative: mga bagay na nasa ilalim ng pagbabawal
  rationale: Pinananatili ng salin ang tensiyon na ang mga hayop na sinasabing ihahandog ay mismong mga bagay na dapat sana'y nilipol ayon sa utos, nang hindi gumagamit ng malabong teknikal na katawagan.
- issue: Paglalarawan sa רֵאשִׁית הַחֵרֶם
  choice: ang pinakamainam sa mga itinalagang lipulin
  alternative: ang una sa mga itinalagang lipulin
  rationale: Ang רֵאשִׁית ay maaaring literal na “una,” ngunit dito ay malamang na tumutukoy sa pinili o pinakamainam na bahagi. Itinatala sa talababa ang saklaw ng parirala at ang obligasyong lipulin ang mga hayop.
- issue: Paglalapat ng יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ang “PANGINOON” ay dignified at pamilyar na representasyon ng tetragrammaton; inilalahad sa talababa ang banal na pangalang nasa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bayan” upang mapanatili ang retorika ni Saul, bagaman ang tinutukoy ay ang kanyang mga tauhan. Ang mga gitling ay naghihiwalay sa paliwanag kung aling mga hayop ang kinuha.
