  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל שְׁמוּאֵ֖ל לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/010.yaml
  text: Then the word of Yahweh came to Samuel[a], saying,
translation:
  language: tl
  text: 'Pagkatapos, dumating kay Samuel ang salita ni Yahweh[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; ayon sa tradisyon ay isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Pagkatapos, dumating
  rationale: Ang waw-consecutive ng היה ay nagpapakilala ng kasunod na pangyayari sa salaysay. Likas sa modernong Filipino ang “Pagkatapos, dumating” at naiiwasan nito ang mas mabigat na literal na “At nangyari.”
- source_word: דְּבַר
  choice: ang salita
  rationale: Sa pormulang propetiko na דְּבַר יְהוָה, pinananatili ng “ang salita” ang malinaw na kaugnayan sa banal na kapahayagan; ang “mensahe” ay posible ngunit hindi kasing-pormal na katumbas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan nito ang banal na pangalang YHWH sa halip na palitan iyon ng titulong “PANGINOON.”
- source_word: אֶל שְׁמוּאֵל
  choice: kay Samuel
  rationale: Ang אֶל ay tumutukoy sa tumanggap ng salita. “Kay Samuel” ang natural na anyo sa Filipino.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ipinakikilala ng לֵאמֹר ang mismong nilalaman ng susunod na pahayag. Sa modernong Filipino, sapat at mas natural ang tutuldok kaysa tahasang “na sinasabi,” lalo na dahil kasunod agad ang tuwirang pagsasalita.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang karaniwang pormulang “dumating kay Samuel ang salita ni Yahweh.” Ang tutuldok ang natural na pananda sa nilalamang ipakikilala ng לֵאמֹר.
