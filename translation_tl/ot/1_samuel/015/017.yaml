base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/017.yaml
  text: And Samuel said[a], “Though you were small in your own eyes, were you not the head of the tribes of Israel? And Yahweh anointed you king over Israel.”
translation:
  language: tl
  text: At sinabi ni Samuel, “Bagaman[a] maliit ka sa sarili mong paningin, hindi ba ikaw ang pinuno ng mga lipi ng Israel? At pinahiran ka ni Yahweh bilang hari ng Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kahit maliit ka sa sarili mong paningin.” Maaaring unawain ang Hebreo nang may bahagyang naiibang diin, ngunit ipinahihiwatig nito na minsang itinuring ni Saul ang sarili bilang hindi mahalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: hindi ba
  rationale: Naghaharap ito ng retorikal na tanong na umaasang sasang-ayon ang kausap; natural na ipinapahayag iyon sa Tagalog sa pamamagitan ng “hindi ba.”
- source_word: אִם קָטֹן אַתָּה בְּעֵינֶיךָ
  choice: Bagaman maliit ka sa sarili mong paningin
  rationale: Pinananatili ng “maliit” at “sa sarili mong paningin” ang larawang Hebreo tungkol sa mababang pagtataya ni Saul sa sarili. Ang “bagaman” ay naghahatid ng malamang na diwang pasalungat nang hindi nilalagyan ng tiyak na panahong wala sa sugnay na Hebreo.
- source_word: רֹאשׁ שִׁבְטֵי יִשְׂרָאֵל
  choice: pinuno ng mga lipi ng Israel
  rationale: Ang רֹאשׁ ay literal na “ulo” ngunit ginagamit dito para sa pangunahing namumuno. Mas natural at malinaw sa makabagong Tagalog ang “pinuno” kaysa sa literal na “ulo,” habang pinananatili ang katayuang ipinantatapat sa mababang tingin ni Saul sa sarili.
- source_word: וַיִּמְשָׁחֲךָ
  choice: pinahiran ka
  rationale: Tiyak na tumutukoy ang pandiwa sa ritwal ng pagpapahid para sa pagkahari; hindi ito pinalalabo bilang simpleng paghirang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: bilang hari sa Israel
  rationale: Natural nitong ipinahahayag sa Tagalog ang tungkuling bunga ng pagpapahid, habang ang “sa Israel” ay sapat na naghahatid ng saklaw ng paghahari.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo; pinananatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Kahulugan ng pagpapahid kay Saul
  choice: pinahiran ka bilang hari
  alternative: hinirang ka bilang hari
  rationale: Pinananatili ng “pinahiran” ang kongkretong gawaing maharlika at teolohikal na ipinahahayag ng משׁח, samantalang masyadong pangkalahatan ang “hinirang.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang idyomang “maliit ka sa sarili mong paningin” dahil malinaw pa rin ito sa Tagalog at iniiwasang limitahan ang kahulugan sa sikolohikal na kawalan ng tiwala sa sarili lamang. Ginamit ang “pinuno” para sa natural na pagpapahayag ng metaporang רֹאשׁ.
