base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/032.yaml
  text: Then Samuel said[a], “Bring Agag king of Amalek to me.” And Agag came to him trembling, and Agag said, “Surely the bitterness of death has turned aside.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Samuel, “Dalhin ninyo sa akin si Agag, ang hari ng Amalek.” Lumapit sa kanya si Agag nang marahan[a] at sinabi, “Tiyak na lumipas na ang pait ng kamatayan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan ng salitang Hebreo. Maaari rin itong isaling “nang buong tiwala”; ayon sa ibang pagpapakahulugan, “nakatanikala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישׁוּ
  choice: Dalhin ninyo sa akin
  rationale: Ang Hiphil imperative na maramihan ay utos sa mga tagapaglingkod na iharap o ilapit si Agag kay Samuel. Likas sa modernong Tagalog ang “Dalhin ninyo sa akin.”
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: si Agag, ang hari ng Amalek
  rationale: Pinananatili ang pangalang pantangi at malinaw na inilalahad ang katungkulan niya bilang hari ng Amalek.
- source_word: וַיֵּלֶךְ אֵלָיו
  choice: Lumapit sa kanya
  rationale: Bagaman karaniwang nangangahulugang “pumunta,” ipinahihiwatig dito ng parirala ang paglapit ni Agag kay Samuel bilang tugon sa utos.
- source_word: מַעֲדַנֹּת
  choice: nang panatag
  rationale: Hindi tiyak ang kahulugan ng salitang Hebreo. Ang “panatag” ay umaayon sa kasunod na pahayag ni Agag na wari niya ay nakalipas na ang panganib, ngunit inilalahad sa talababa ang iba pang mahahalagang pagpapakahulugan.
- source_word: אָכֵן
  choice: Tiyak na
  rationale: Ipinahahayag nito ang mariing paniniwala o katiyakan ni Agag.
- source_word: סָר
  choice: lumipas na
  rationale: Ang literal na diwa ay “lumihis” o “umalis.” Sa Tagalog, natural na ipinahahayag ng “lumipas na” ang paniniwalang wala na ang banta.
- source_word: מַר הַמָּוֶת
  choice: ang pait ng kamatayan
  rationale: Pinananatili nito ang metapora ng Hebreo tungkol sa mapait na karanasan o banta ng kamatayan.
theological_decisions:
- issue: Kung ang pahayag ni Agag ay katiyakang nakalipas na ang panganib o komento na mapait ang kamatayan
  choice: “Tiyak na lumipas na ang pait ng kamatayan”
  alternative: “Tunay na mapait ang kamatayan”
  rationale: Pinakamalapit sa anyo ng tekstong Masoretiko ang pagbasa sa סָר bilang pandiwang “umalis/lumipas.” Gayunman, kinikilala na maaaring maunawaan sa ibang paraan ang maikli at mahirap na pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pangmaramihang “ninyo” upang mapanatili ang anyo ng utos, at inilagay ang talababa mismo sa salitang may tunay na katiyakan sa Hebreo.
