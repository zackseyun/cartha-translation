base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/022.yaml
  text: So on the day of battle[a], not a sword or spear was found in the hand of any of the people who were with Saul and Jonathan; but Saul and his son Jonathan had them.
translation:
  language: tl
  text: Kaya sa araw ng labanan, walang tabak o sibat na natagpuan sa kamay ng sinuman sa mga taong kasama nina Saul at Jonatan[a]; ngunit sina Saul at ang anak niyang si Jonatan lamang ang may mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na pagkakasalin: “at walang tabak at sibat na natagpuan sa kamay ng lahat ng taong kasama nina Saul at Jonatan.” Ipinapahayag ng salin sa talata na wala ni isa sa mga kawal ang may gayong mga sandata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם מִלְחֶמֶת
  choice: Kaya nang araw ng labanan
  rationale: Ipinapakita ng “Kaya” ang bunga ng naunang salaysay, samantalang pinananatili ng “nang araw ng labanan” ang kongkretong pahiwatig ng panahon.
- source_word: לֹא נִמְצָא
  choice: walang ... na natagpuan
  rationale: Pinananatili ang pasibong diwa ng Nifal ng מצא at natural itong pakinggan sa makabagong Filipino.
- source_word: חֶרֶב וַחֲנִית
  choice: tabak o sibat
  rationale: Bagaman “at” ang literal na pang-ugnay sa Hebreo, ang “o” ang likas na Filipino sa saklaw ng negasyon at malinaw na nangangahulugang wala sa alinman sa dalawang uri ng sandata.
- source_word: בְּיַד כָּל הָעָם
  choice: sa kamay ng sinuman sa mga tao
  rationale: Pinananatili ang Hebreong idyomang “sa kamay,” habang ang “sinuman” ay naghahayag ng distributibong diwa ng כָּל sa ilalim ng negasyon.
- source_word: אֲשֶׁר אֶת־שָׁאוּל וְאֶת־יוֹנָתָן
  choice: na kasama nina Saul at Jonatan
  rationale: Ang אֵת dito ay nagpapahiwatig ng pakikisama o pag-ugnay, hindi ng tuwirang layon.
- source_word: וַתִּמָּצֵא לְשָׁאוּל וּלְיוֹנָתָן בְּנוֹ
  choice: ngunit mayroon lamang sina Saul at ang anak niyang si Jonatan
  rationale: Natural na ipinapahayag sa Filipino ang pag-aari o pagkakaroon sa pamamagitan ng “mayroon.” Hindi tahasang inuulit ang mga sandata upang mapanatili ang bahagyang pagkaelliptical ng Hebreo.
