translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tabak” at “sibat” bilang karaniwang katawagan sa mga sandata, at pinanatili ang idyomang “sa kamay” dahil nauunawaan ito bilang pag-aari o pagkakaroon.
