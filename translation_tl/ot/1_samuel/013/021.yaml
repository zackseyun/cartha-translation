  yaml_path: translation/ot/1_samuel/013/021.yaml
  text: And the charge was a pim for the plowshares[a], for the mattocks, for the three-pronged forks, and for the axes[b], and for setting the goads.
translation:
  language: tl
  text: Ang singil ay isang pim[a] para sa mga talim ng araro, mga asarol, mga tinidor na may tatlong tulis, at mga palakol,[b] at para sa pag-aayos ng mga pang-udyok sa baka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pim ay malamang na isang maliit na yunit ng timbang o bayad, na karaniwang tinatayang mga dalawang-katlo ng isang siklo.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “Ang pagpapatalas ay isang pim.” Mahirap unawain ang pagkakasabi sa Hebreo, at maaaring ang tinutukoy ay ang halagang sinisingil o ang mismong pagpapatalas.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּצִירָה
  choice: ang singil sa pagpapatalas
  rationale: Bihira at mahirap ang salitang Hebreo. Sa konteksto, malamang na tumutukoy ito sa singil para sa pagpapatalas ng mga kagamitang bakal; isinama ang “sa pagpapatalas” upang maging malinaw ang uri ng serbisyo nang hindi itinatago ang kahirapan ng parirala.
- source_word: פִים
  choice: isang pim
  rationale: Pinanatili ang katawagan sa sinaunang yunit ng timbang o bayad dahil walang eksaktong likas na katumbas sa Tagalog; ipinaliwanag ang malamang na halaga sa talababa.
- source_word: מַחֲרֵשֹׁת
  choice: mga talim ng araro
  rationale: Tumutukoy sa bahaging bakal ng araro na kailangang patalasin; mas malinaw ito sa karaniwang mambabasa kaysa sa teknikal na katawagan.
- source_word: אֵתִים
  choice: mga asarol
  rationale: Ito ay kagamitang pansaka para sa paghuhukay o pagtaga. Ang “asarol” ang natural at madaling maunawaang katumbas, bagaman hindi tiyak ang eksaktong anyo ng kagamitan.
- source_word: שְׁלֹשׁ קִלְּשׁוֹן
  choice: mga tinidor na may tatlong tulis
  rationale: Inilalarawan nang tuwiran ang kagamitang may tatlong tulis at iniiwasan ang hindi gaanong karaniwang teknikal na salita.
- source_word: קַּרְדֻּמִּים
  choice: mga palakol
  rationale: Karaniwang tumutukoy sa mga kagamitang pantaga; “palakol” ang pinakatuwiran at likas na salin, kahit maaaring may anyong kahawig ng daras.
- source_word: לְהַצִּיב הַדָּרְבָן
  choice: para sa pag-aayos ng mga pantaboy sa baka
  rationale: Ang pandiwa ay maaaring mangahulugang ituwid, ikabit, o ayusin. Pinananatili ng “pag-aayos” ang lawak ng kahulugan nang hindi ipinapalagay na pagpapatalas lamang ang tinutukoy; nilinaw ang gamit ng pantaboy.
