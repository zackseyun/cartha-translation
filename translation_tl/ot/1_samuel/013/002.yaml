  text: וַ/יִּבְחַר ל֨/וֹ שָׁא֜וּל שְׁלֹ֣שֶׁת אֲלָפִים֮ מִ/יִּשְׂרָאֵל֒ וַ/יִּהְי֨וּ עִם שָׁא֜וּל אַלְפַּ֗יִם בְּ/מִכְמָשׂ֙ וּ/בְ/הַ֣ר בֵּֽית אֵ֔ל וְ/אֶ֗לֶף הָיוּ֙ עִם י֣וֹנָתָ֔ן בְּ/גִבְעַ֖ת בִּנְיָמִ֑ין וְ/יֶ֣תֶר הָ/עָ֔ם שִׁלַּ֖ח אִ֥ישׁ לְ/אֹהָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/002.yaml
  text: And Saul chose for himself three thousand men from Israel[a]. Two thousand were with Saul at Michmash and in the hill country of Bethel, and a thousand were with Jonathan at Gibeah of Benjamin. The rest of the people he sent away[b], each man to his tent.
translation:
  language: tl
  text: Pumili si Saul para sa sarili niya ng tatlong libong lalaki mula sa Israel. Dalawang libo ang kasama ni Saul sa Micmas at sa kaburulan ng Bethel[a], at isang libo naman ang kasama ni Jonatan sa Gibea ng Benjamin. Ang iba sa mga tao ay pinauwi niya[b], bawat isa sa sarili niyang tolda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa burol ng Bethel” o “sa bundok ng Bethel.” Maaaring tumukoy ang salitang Hebreo sa isang tiyak na mataas na lugar o sa maburol na rehiyon sa palibot ng Bethel.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pinaalis niya, bawat isa sa sarili niyang tolda.” Karaniwang idyoma ito sa Hebreo para sa pagpapauwi sa mga tao sa kani-kanilang tirahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: Pumili si Saul para sa sarili niya
  rationale: Pinananatili ng “pumili” ang pangunahing diwa ng בחר, at ng “para sa sarili niya” ang dative na לוֹ, na nagpapahiwatig na personal na pumili si Saul ng mga tauhan.
- source_word: שְׁלֹשֶׁת אֲלָפִים מִיִּשְׂרָאֵל
  choice: tatlong libong lalaki mula sa Israel
  rationale: Tuwirang inililipat ang bilang at ang pinagmulan ng mga pinili. Idinagdag ang “lalaki” ayon sa malinaw na kontekstong militar at sa kasunod na אִישׁ.
- source_word: וַיִּהְיוּ עִם שָׁאוּל
  choice: ang kasama ni Saul
  rationale: Natural na Filipino para sa literal na “ay kasama ni Saul,” nang hindi dinaragdagan ng ideyang “nanatili” na hindi tahasang nasa Hebreo.
- source_word: בְּמִכְמָשׂ
  choice: sa Micmas
  rationale: Karaniwang anyong Filipino ng pangalang-lugar at natural na gamit ng “sa” para sa kinalalagyan ng mga hukbo.
- source_word: וּבְהַר בֵּית אֵל
  choice: at sa kaburulan ng Bethel
  rationale: Maaaring tumukoy ang הַר sa isang burol o bundok, ngunit maaari rin itong tumukoy sa maburol na rehiyon. Ang “kaburulan” ay natural sa konteksto ng pagpuwesto ng hukbo, habang itinatala sa talababa ang tunay na alternatibo.
- source_word: וְאֶלֶף הָיוּ עִם יוֹנָתָן
  choice: at isang libo naman ang kasama ni Jonatan
  rationale: Pinananatili ang parallel na kayarian; ang “naman” ay natural na nagmamarka sa ikalawang pangkat nang hindi nagdaragdag ng bagong diwa.
- source_word: בְּגִבְעַת בִּנְיָמִין
  choice: sa Gibea ng Benjamin
  rationale: Sinusunod ang pagbasa ng tekstong Masoretiko na Gibeah/Gibea at pinananatili ang pagtukoy nito sa Benjamin.
- source_word: וְיֶתֶר הָעָם
  choice: Ang iba sa mga tao
  rationale: Ang יֶתֶר ay ang natitira o iba pa, at ang הָעָם ay literal na “mga tao.” Iniiwasang gawing “hukbo” upang manatiling malapit sa Hebreo.
- source_word: שִׁלַּח
  choice: pinauwi niya
  rationale: Sa konteksto, pinaalis ni Saul ang natitirang mga tao patungo sa kani-kanilang tirahan. Ang “pinauwi” ay malinaw at natural, habang ang talababa ay nagpapanatili sa mas literal na idyoma.
- source_word: אִישׁ לְאֹהָלָיו
  choice: bawat isa sa sarili niyang tolda
  rationale: Pinananatili ang konkretong “tolda” at ang distributibong diwa ng אִישׁ. Ang “bawat isa” ay mas natural sa modernong Filipino kaysa “bawat lalaki” matapos nang malinaw ang konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal, na may payak na ayos ng pangungusap. Ginamit ang “Micmas,” “Bethel,” “Jonatan,” at “Gibea” bilang madaling kilalaning anyong Filipino ng mga pangalan. Itinama ang pagkakalagay ng mga marker upang ang [a] ay tumukoy sa heograpikong alternatibo at ang [b] sa idyoma ng pagpapauwi.
