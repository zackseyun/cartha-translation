  text: So Saul said[b][a], “Bring near to me the burnt offering and the peace offerings.” And he offered up the burnt offering.
translation:
  language: tl
  text: At sinabi ni Saul, “Ilapit ninyo sa akin ang handog na sinusunog at ang mga handog pangkapayapaan.[a]” At inihandog niya ang handog na sinusunog.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog para sa mabuting kalagayan” o “mga handog ng pakikisalo.” Ang salitang Hebreo ay maaaring tumukoy sa kapayapaan, kabutihang kalagayan, o pakikisalong kaugnay ng handog.
    reason: lexical_alternative
  - marker: b
    text: 'Pinakanatural na ibig sabihin nito na si Saul mismo ang naghandog ng handog na sinusunog. Nauunawaan naman ito ng ilan sa mas di-tuwirang paraan: ipinahandog niya ang handog.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kaya sinabi ni Saul
  rationale: Isinusulong ng waw-consecutive ang salaysay at iniuugnay ang sinabi ni Saul sa naunang pangyayari; natural sa makabagong Tagalog ang “Kaya sinabi.”
- source_word: הַגִּשׁוּ אֵלַי
  choice: Ilapit ninyo sa akin
  rationale: Pinananatili nito ang diwa ng Hiphil imperative na maglapit o magharap, kasama ang kontekstong panghandog.
- source_word: הָעֹלָה
  choice: ang handog na sinusunog
  rationale: Ito ang malinaw at karaniwang katawagan sa handog na lubusang sinusunog; inuulit din ito sa huling sugnay gaya ng Hebreo.
- source_word: וְהַשְּׁלָמִים
  choice: at ang mga handog pangkapayapaan
  rationale: Nananatiling malapit ito sa kaugnayan ng שְׁלָמִים sa kapayapaan at kagalingan, habang ang posibleng diwa ng pakikisalo ay inilalagay sa talababa.
- source_word: וַיַּעַל
  choice: At inihandog niya
  rationale: Sa kontekstong pansakripisyo, idiomatikong tumutukoy ang עלה sa paghahandog; malinaw ding pinananatili ng panghalip na “niya” ang tuwirang pagbasa kay Saul bilang gumagawa.
theological_decisions:
- issue: Ang gumagawa ng kilos sa huling sugnay
  choice: Si Saul mismo ang naghandog ng handog na sinusunog
  alternative: Ipinahandog o ipinalapit ni Saul ang handog sa pamamagitan ng iba
  rationale: Pinakamadaling unawain ang isahang pandiwa na ang naunang simuno, si Saul, ang mismong nagsagawa ng paghahandog. Naaayon din ito sa kasunod na pagsaway, ngunit hindi lubusang isinasara ang mas di-tuwirang pagkaunawa kaya binabanggit iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “handog na sinusunog” bilang madaling maunawaang katawagang panrelihiyon, at pinanatili ang pag-uulit ng orihinal para sa linaw. Ang bawat talababa ay inilagay kaagad pagkatapos ng bahaging tinutukoy nito.
