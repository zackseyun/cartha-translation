  text: וַ/יֹּ֧אמֶר שְׁמוּאֵ֛ל אֶל שָׁא֖וּל נִסְכָּ֑לְתָּ לֹ֣א שָׁמַ֗רְתָּ אֶת מִצְוַ֞ת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר צִוָּ֔/ךְ כִּ֣י עַתָּ֗ה הֵכִ֨ין יְהוָ֧ה אֶת מַֽמְלַכְתְּ/ךָ֛ אֶל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/013.yaml
  text: And Samuel said to Saul[a], “You have acted foolishly. You have not kept the command of Yahweh your God, which he commanded you; for now Yahweh would have established your kingdom over Israel forever.”
translation:
  language: tl
  text: At sinabi ni Samuel kay Saul, “Nagpakahangál ka.[a] Hindi mo sinunod ang utos ni Yahweh na iyong Diyos, na iniutos niya sa iyo. Sapagkat itatatag sana ngayon ni Yahweh ang iyong kaharian sa Israel magpakailanman.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Gumawa ka nang may kamangmangan” o “Naging hangal ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכָּלְתָּ
  choice: Kumilos ka nang may kamangmangan
  rationale: Ang nifal ng סכל ay tumutukoy sa hangal o di-matalinong pagkilos, hindi lamang sa isang kalagayan; dignified at malinaw ito sa modernong Filipino.
- source_word: לֹא שָׁמַרְתָּ
  choice: Hindi mo sinunod
  rationale: Bagaman literal na may diwang ‘hindi mo iningatan,’ sa kaugnayan ng isang utos, likas na ipinahahayag sa Filipino ng ‘hindi mo sinunod’ ang hinihinging pagsunod.
- source_word: מִצְוַת
  choice: ang utos
  rationale: Isang tiyak na utos ang tinutukoy; mas natural sa kasalukuyang Filipino ang ‘utos’ kaysa ‘kautusan’ sa kontekstong ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang inililipat ang ikalawang panauhang pang-isahang konstruksyong paari.
- source_word: אֲשֶׁר צִוָּךְ
  choice: na iniutos niya sa iyo
  rationale: Pinananatili ang tahasang pandiwang ‘mag-utos’ at ang pagtukoy kay Yahweh bilang gumagawa.
- source_word: כִּי עַתָּה הֵכִין
  choice: Sapagkat kung sinunod mo iyon, itatatag sana ngayon
  rationale: 'Nililinaw ng ‘sana’ at ng kondisyong mahihinuha sa konteksto ang kontra-katotohanang bunga: ito ang mangyayari sana kung sumunod si Saul. Ang idinagdag na ‘kung sinunod mo iyon’ ay ekspilisitasyong kailangan para maging natural at di-malabo sa Filipino.'
- source_word: מַמְלַכְתְּךָ
  choice: iyong kaharian
  rationale: Pinananatili ang kahulugan ng maharlikang sakop o dinastikong paghahari nang hindi ito nililimitahan sa personal na panahon ng pamumuno ni Saul.
- source_word: אֶל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa Filipino, natural na ipinahahayag ng ‘kaharian sa Israel’ ang larangan ng pamamahala; hindi kailangang piliting gawing literal ang direksiyonal na halaga ng אֶל.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Karaniwan at marangal na katumbas ng pariralang nagsasaad ng walang hanggang pagpapatuloy.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong ‘Yahweh’ at hindi pinapalitan ng titulo.
- issue: Kontra-katotohanang puwersa ng כִּי עַתָּה הֵכִין יְהוָה
  choice: kung sinunod mo iyon, itatatag sana ngayon ni Yahweh
  alternative: sapagkat itinatag na ngayon ni Yahweh
  rationale: Ipinakikita ng kasunod na hatol at ng daloy ng salaysay na isang napawalang pagkakataon ang tinutukoy, hindi isang permanenteng kahariang aktuwal nang naitatag. Ginagawang malinaw ng Filipino ang kondisyong ipinahihiwatig ng Hebreo.
- issue: Saklaw ng ‘iyong kaharian ... magpakailanman’
  choice: iyong kaharian sa Israel magpakailanman
  alternative: ang personal mong paghahari habang-buhay
  rationale: Hindi nililimitahan ang מַמְלָכָה sa haba ng buhay ni Saul; pinananatili ang mas malawak na dinastiko o maharlikang diwa nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘sinunod’ para sa likas na wika ng pagsunod sa utos, at ‘itatatag sana’ upang maipahayag nang malinaw ang kontra-katotohanang diwa. Lumilitaw ang marker na [a] sa pangunahing teksto.
