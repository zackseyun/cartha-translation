  text: ו/ייחל שִׁבְעַ֣ת יָמִ֗ים לַ/מּוֹעֵד֙ אֲשֶׁ֣ר שְׁמוּאֵ֔ל וְ/לֹא בָ֥א שְׁמוּאֵ֖ל הַ/גִּלְגָּ֑ל וַ/יָּ֥פֶץ הָ/עָ֖ם מֵ/עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/008.yaml
  text: He waited seven days[a], until the appointed time that Samuel had set, but Samuel did not come to Gilgal[b], and the people were scattering from him.
translation:
  language: tl
  text: Naghintay siya nang pitong araw, hanggang sa takdang panahong itinakda ni Samuel.[a] Ngunit hindi dumating si Samuel sa Gilgal, at ang mga tao ay nangangalat palayo sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pinaikli ang pariralang Hebreo at walang hayag na pandiwa pagkatapos ng “Samuel.” Isinusuplay ng salin ang “itinakda” ayon sa konteksto; maaari rin itong unawain bilang panahong binanggit ni Samuel.
    reason: lexical_alternative
  - marker: b
    text: Ang tinutukoy ng “kanya” ay si Saul.
    reason: referent_clarification
lexical_decisions:
- source_word: וַיִּיחֶל
  choice: Naghintay siya
  rationale: Sa konteksto, tumutukoy ang pandiwa sa paghihintay sa loob ng isang takdang panahon, hindi sa pag-asa sa pangkalahatan.
- source_word: שִׁבְעַת יָמִים
  choice: nang pitong araw
  rationale: Likas na paraan sa modernong Tagalog upang ipahayag ang tagal ng paghihintay.
- source_word: לַמּוֹעֵד
  choice: hanggang sa takdang panahon
  rationale: Ipinahihiwatig ng מוֹעֵד ang isang panahong dati nang itinakda; ang “hanggang sa” ay angkop sa takbo ng salaysay at sa naunang tagubiling maghintay nang pitong araw.
- source_word: אֲשֶׁר שְׁמוּאֵל
  choice: itinakda ni Samuel
  rationale: Pinaikli at walang hayag na pandiwa ang pariralang Hebreo. Isinusuplay ng salin ang ipinahihiwatig na pagtatakda ni Samuel, ayon sa konteksto, habang itinatala sa talababa ang ellipsis.
- source_word: וְלֹא בָא שְׁמוּאֵל הַגִּלְגָּל
  choice: Ngunit hindi dumating si Samuel sa Gilgal
  rationale: Ang “ngunit” ay natural na naghahayag ng pagsalungat sa inaasahang pagdating, bagaman karaniwang pang-ugnay na “at” ang anyong Hebreo.
- source_word: וַיָּפֶץ הָעָם
  choice: unti-unti nang nagsialis ang mga tao
  rationale: Ipinapakita nito ang nagaganap na pagkawatak at paglayo ng pangkat, hindi lamang ang isang bigla at tapos nang kilos.
- source_word: מֵעָלָיו
  choice: mula sa kanya
  rationale: Pinananatili ang panghalip ng Hebreo; sa konteksto, si Saul ang malinaw na tinutukoy.
theological_decisions:
- issue: Kung dapat bang tukuyin ang mga tao bilang hukbo o mga kawal
  choice: mga tao
  alternative: mga kawal / hukbo
  rationale: Maaaring tumukoy ang הָעָם sa mga lalaking kasama ni Saul bilang puwersang militar, ngunit hindi tahasang “hukbo” o “mga kawal” ang salita. Pinananatili ng “mga tao” ang lawak at di-tiyak na katangian ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “takdang panahon” sa halip na mas teknikal na pananalita, at “unti-unti nang nagsialis” upang natural na maipakita ang nagpapatuloy na pagkalas ng mga tao kay Saul.
