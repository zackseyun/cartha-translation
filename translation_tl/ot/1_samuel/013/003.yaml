    issue: Ang “nilupig” ay labis na tiyak para sa וַיַּךְ.
    rationale: Ang pandiwa ay nagsasaad ng pagsalakay/pananakit o pagpapabagsak, ngunit hindi nito tahasang sinasabing nasakop ang garison. Ang “sinalakay” ay hindi nagdaragdag ng resulta na wala sa teksto.
  - severity: medium
    issue: Hindi natural ang “tambuling sungay.”
    rationale: Ang parirala ay redundant at hindi karaniwang katawagan sa modernong Filipino. Ang “sungay” ay sapat na salin ng shofar, at ang instrumentong katangian nito ay nililinaw ng pandiwang “hinipan” at ng talababa.
  - severity: low
    issue: Bahagyang matigas ang “Marinig ito ng mga Hebreo!” bilang panawagan.
    rationale: Mas likas ang “Pakinggan ito ng mga Hebreo!” para sa jussive na proklamasyon, habang pinananatili ang ipinahiwatig na layon at ang terminong “mga Hebreo.”
