revisions:
- from: Nilupig ni Jonatan ang garison ng mga Filisteo na nasa Geba[a], at nabalitaan iyon ng mga Filisteo. Pagkatapos, hinipan ni Saul ang tambuling sungay[b] sa buong lupain at sinabi, “Marinig ito ng mga Hebreo!”
  to: Sinalakay ni Jonatan ang garison ng mga Filisteo na nasa Geba[a], at nabalitaan ito ng mga Filisteo. Pagkatapos, hinipan ni Saul ang sungay[b] sa buong lupain, na nagsasabi, “Pakinggan ito ng mga Hebreo!”
  rationale: Pinalitan ang pandiwang nagsasaad ng lubos na tagumpay ng mas maingat na “sinalakay,” upang huwag lumampas sa semantikong saklaw ng וַיַּךְ. Pinasimple ang salin ng shofar sa “sungay,” at inilagay ang kulturang paliwanag sa talababa. Inayos din ang huling panawagan para sa mas natural na modernong Filipino habang pinananatili ang jussive na puwersa at ang ipinahiwatig na layon.
