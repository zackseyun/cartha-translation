translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “garison,” isang karaniwang terminong militar sa Filipino, at nilinaw ang pinagtatalunang kahulugan sa talababa. Pinanatili ang “mga Hebreo” at ang pampanawagang lakas ng huling sugnay.
