base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/003.yaml
  text: Jonathan struck down the Philistine garrison that was at Geba[a], and the Philistines heard of it. Then Saul blew the ram's horn throughout all the land, saying[b], “Let the Hebrews hear!”
translation:
  language: tl
  text: Sinalakay ni Jonatan ang garison ng mga Filisteo na nasa Geba[a], at nabalitaan ito ng mga Filisteo. Pagkatapos, hinipan ni Saul ang sungay[b] sa buong lupain, na nagsasabi, “Pakinggan ito ng mga Hebreo!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pinunong Filisteo” o “ang gobernador ng mga Filisteo.” Ang salitang Hebreo ay maaaring tumukoy sa isang opisyal o sa isang nakahimpil na puwersa o himpilang militar. Sa kontekstong ito, mas angkop ang “garison.”
    reason: lexical_alternative
  - marker: b
    text: O “hinipan ang trumpeta.” Ang Hebreong shofar ay tumutukoy sa isang sungay na ginagamit na pantawag; ayon sa tradisyon, karaniwan itong sungay ng lalaking tupa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: Nilupig
  rationale: Ipinahahayag ng נכה ang isang mapagpasiyang pagsalakay o pananakit. Dahil maaaring isang garison o opisyal ang tinutukoy ng layon, iniiwasan ng “nilupig” ang sobrang tiyak na “pinatay” habang pinananatili ang puwersang militar.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: ang garison ng mga Filisteo
  rationale: Maaaring tumukoy ang נְצִיב sa isang nakatalagang opisyal o sa isang nakahimpil na puwersa/himpilan. Sa kontekstong militar, natural ang “garison,” ngunit inilalahad sa talababa ang tunay na leksikal na alternatibo.
- source_word: בְּגֶבַע
  choice: nasa Geba
  rationale: Pinananatili ang pangalang-pook na Geba at hindi labis na tinutukoy kung nasa loob mismo o sa kinaroroonan nito ang garison.
- source_word: וַיִּשְׁמְעוּ פְּלִשְׁתִּים
  choice: nabalitaan iyon ng mga Filisteo
  rationale: Literal na “narinig ng mga Filisteo.” Ang “nabalitaan iyon” ay likas sa modernong Tagalog at malinaw na tumutukoy sa naunang pangyayari.
- source_word: תָּקַע בַּשּׁוֹפָר
  choice: hinipan ... ang tambuling sungay
  rationale: Ang שׁוֹפָר ay isang instrumentong sungay, karaniwang sungay ng lalaking tupa. Ginagawang malinaw ng “tambuling sungay” na instrumento ito at hindi basta sungay ng hayop.
- source_word: בְּכָל הָאָרֶץ
  choice: sa buong lupain
  rationale: Dito, ang אֶרֶץ ay tumutukoy sa lupain o nasasakupan, hindi sa buong daigdig.
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Natural na Tagalog na panimula sa tuwirang pahayag, habang malinaw na si Saul ang nagpapahayag kasabay ng pagpapatunog.
- source_word: יִשְׁמְעוּ הָעִבְרִים
  choice: Marinig ito ng mga Hebreo!
  rationale: Pinananatili ang diwa ng jussive na pampublikong panawagan at ang katawagang “mga Hebreo,” sa halip na palitan ito ng “mga Israelita.” Ang “ito” ay likas na ipinahihiwatig ng konteksto.
