  source_fidelity: Tumpak na naihahatid ng draft ang hatol na hindi mananatili ang kaharian ni Saul, ang paghahanap ni Yahweh ng isang lalaking ayon sa kanyang puso, ang pagtatalaga sa lalaking iyon, at ang dahilan ng hatol. Maayos ding napapanatili ang referent ng mga panghalip sa pamamagitan ng mga talababa nang hindi isinasara ang bahagyang ambigwidad ng Hebreo sa pangunahing teksto.
  naturalness: Karaniwang natural at marangal ang modernong Tagalog. Gayunman, ang “bilang pinuno sa kanyang bayan” ay hindi ang pinakanatural na kolokasyon at maaaring mangahulugang pinuno na nasa loob ng bayan, sa halip na pinunong namamahala rito. Mas malinaw ang “bilang pinuno ng kanyang bayan.”
  terminology: Ang “Yahweh,” “kaharian,” “lalaki,” at “pinuno” ay angkop at pare-pareho sa source at sa nakasaad na mga pagpapasiya. Ang “tinupad ang iniutos” ay isang natural at sapat na salin para sa hindi pag-iingat/pagtupad sa iniutos ni Yahweh.
