base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/014.yaml
  text: But now your kingdom will not endure[a]. Yahweh has sought for himself a man according to his own heart, and Yahweh has appointed him ruler over his people[c][b], because you have not kept what Yahweh commanded you.
translation:
  language: tl
  text: Ngunit ngayon, hindi mananatili ang iyong kaharian.[a] Humanap si Yahweh para sa kanyang sarili ng isang lalaking ayon sa kanyang puso,[b] at itinalaga siya ni Yahweh bilang pinuno ng kanyang bayan,[c] sapagkat hindi mo tinupad ang iniutos sa iyo ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi tatayo” o “hindi magpapatuloy.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ayon sa kanyang puso.” Pinakanatural na tumutukoy ang “kanyang” kay Yahweh.
    reason: ambiguity_clarification
  - marker: c
    text: Ang “kanyang bayan” ay tumutukoy sa bayan ni Yahweh.
    reason: referent_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngunit ngayon
  rationale: Ipinahahayag nito ang matalim na paglipat mula sa dating kalagayan ni Saul tungo sa hatol na kasunod.
- source_word: מַמְלַכְתְּךָ לֹא תָקוּם
  choice: hindi mananatili ang iyong kaharian
  rationale: Ang תקום ay literal na ‘tatayo,’ ngunit sa konteksto ay tumutukoy sa hindi pagpapatuloy o hindi pagiging matatag ng paghahari o dinastiya ni Saul.
- source_word: בִּקֵּשׁ יְהוָה לוֹ
  choice: Humanap si Yahweh para sa kanyang sarili
  rationale: 'Pinananatili ang natapos na aspekto ng pandiwa at ang reflexive na diwa ng לוֹ: pumili o humanap si Yahweh para sa sarili niyang layunin.'
- source_word: אִישׁ כִּלְבָבוֹ
  choice: isang lalaking ayon sa kanyang puso
  rationale: Malapit ito sa literal na Hebreo at hindi dinaragdagan ng paliwanag na wala mismo sa talata.
- source_word: וַיְצַוֵּהוּ יְהוָה לְנָגִיד
  choice: itinalaga siya ni Yahweh bilang pinuno
  rationale: Bagaman karaniwang nangangahulugang ‘mag-utos’ ang צוה, kasama ng לְנָגִיד ay ipinahihiwatig nito ang pagtatalaga sa isang tungkulin.
- source_word: עַל עַמּוֹ
  choice: sa kanyang bayan
  rationale: Ang hulaping panghalip ay tumutukoy kay Yahweh; pinananatili ng salin ang panghalip habang nililinaw ito sa talababa.
- source_word: לֹא שָׁמַרְתָּ אֵת אֲשֶׁר צִוְּךָ יְהוָה
  choice: hindi mo tinupad ang iniutos sa iyo ni Yahweh
  rationale: Sa konteksto ng utos, ang שמר ay nangangahulugang ingatan, sundin, o tuparin; natural sa modernong Tagalog ang ‘tinupad’ nang hindi nawawala ang diwa ng pananagutan.
theological_decisions:
- issue: Tinutukoy ng hulaping panghalip sa כִּלְבָבוֹ
  choice: Pinanatili bilang ‘ayon sa kanyang puso,’ na sa agarang konteksto ay pinakanatural na tumutukoy kay Yahweh.
  alternative: Maaaring unawain ang panghalip bilang kaugnay ng lalaking hinanap, bagaman hindi iyon ang pinakanaaangkop sa sintaks at konteksto.
  rationale: Pinananatili ang tunay na kaiklian at bahagyang posibilidad ng Hebreo sa pangunahing teksto, habang nililinaw sa talababa ang pinakanatural na antecedent nang hindi ipinapasok ang mas huling interpretasyong ‘gagawa ng buong kalooban niya.’
- issue: Saklaw ng נָגִיד
  choice: pinuno
  alternative: tagapamahala; prinsipe
  rationale: Ipinahihiwatig ng salita ang isang itinalagang may awtoridad. Ang ‘pinuno’ ay malinaw at hindi naglalagay ng teknikal na dinastiko o mesiyanikong kahulugan na lampas sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang pangalang Yahweh ayon sa patakaran ng proyekto. Iniwasan ang arkaikong pananalita at ang pagpapalawak na doktrinal na wala sa Hebreong teksto.
