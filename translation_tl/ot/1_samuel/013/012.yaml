  to: Kaya sinabi ko, ‘Ngayon ay bababa ang mga Filisteo laban sa akin sa Gilgal, at hindi ko pa hinihingi ang pabor ni Yahweh.’ Kaya pinilit ko ang aking sarili[a] at inihandog ang handog na sinusunog.
  rationale: Binago ang kilos ng mga Filisteo mula “lulusob” tungo sa “bababa” upang mapanatili ang tahasang direksiyonal na kahulugan ng Hebreo. Inalis ang “dito” dahil wala itong katumbas sa pinagmulan, at pinalitan ang “ngunit” ng “at” upang hindi palakasin ang ugnayan nang lampas sa simpleng pangatnig ng teksto. Pinanatili ang talababa dahil wasto nitong itinatala ang leksikal na posibilidad ng וָאֶתְאַפַּק.
