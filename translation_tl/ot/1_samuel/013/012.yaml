base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/012.yaml
  text: So I said[a], ‘Now the Philistines will come down against me at Gilgal[b], and I have not sought the favor of Yahweh.’ So I forced myself and offered up the burnt offering.
translation:
  language: tl
  text: Kaya sinabi ko, ‘Ngayon ay bababa ang mga Filisteo laban sa akin sa Gilgal, at hindi ko pa hinihingi ang pabor ni Yahweh.’ Kaya pinilit ko ang aking sarili[a] at inihandog ang handog na sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pinigil ko ang aking sarili.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagpipigil o pagsupil sa sarili; sa kontekstong ito, waring sinasabi ni Saul na pinuwersa niya ang sarili na kumilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Kaya sinabi ko
  rationale: Isinusulong ng waw-consecutive ang paliwanag ni Saul at ipinahihiwatig ang bunga ng naunang pangyayari; natural itong ipinapahayag ng “Kaya sinabi ko.”
- source_word: יֵרְדוּ פְלִשְׁתִּים אֵלַי
  choice: lulusob sa akin ang mga Filisteo
  rationale: Literal na tumutukoy ang ירד sa pagbaba, ngunit ang אֵלַי sa kontekstong militar ay nagpapahayag ng paglapit na laban kay Saul. Ang “lulusob” ay malinaw at natural sa Filipino habang pinananatili ang banta ng kilos militar.
- source_word: הַגִּלְגָּל
  choice: dito sa Gilgal
  rationale: Tinutukoy ni Saul ang lugar ng inaasahang sagupaan mula sa kaniyang sariling pananaw; ang “dito sa” ay likas na katumbas sa Filipino.
- source_word: וּפְנֵי יְהוָה לֹא חִלִּיתִי
  choice: ngunit hindi ko pa hinihingi ang pabor ni Yahweh
  rationale: Ang idyomang חלה פני ay nangangahulugang magsumamo o humingi ng pabor. Nililinaw ng “pabor” ang diwa nang hindi literal at malabong isinasalin bilang “mukha.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וָאֶתְאַפַּק
  choice: Kaya pinilit ko ang aking sarili
  rationale: Maaaring tumukoy ang hitpael ng אפק sa pagpipigil o pagpuwersa sa sarili. Sa paliwanag ni Saul, ipinakikita nitong kumilos siya sa kabila ng pag-aatubili, kaya ang “pinilit ko ang aking sarili” ang pinakamalinaw sa konteksto.
- source_word: וָאַעֲלֶה הָעֹלָה
  choice: at inihandog ang handog na sinusunog
  rationale: Ang עלה kasama ng עֹלָה ay nakaugaliang pananalita para sa paghahandog. Ang “handog na sinusunog” ay malinaw at madaling maunawaan sa modernong Filipino.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa Hebreo, kaya pinananatili bilang “Yahweh” upang hindi ito gawing titulo.
- issue: Kahulugan ng paghiling sa “mukha” ni Yahweh
  choice: hinihingi ang pabor ni Yahweh
  alternative: nagsumamo sa harapan ni Yahweh
  rationale: Idyoma ang pariralang Hebreo para sa pagsusumamo o paghahangad ng pabor. Ang napiling salin ay natural ngunit hindi nagdaragdag ng partikular na ritwal o doktrinal na kahulugan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “mga Filisteo,” “pabor,” at “handog na sinusunog” bilang malinaw na karaniwang pananalita. Pinanatili sa talababa ang tunay na ambiguwidad ng וָאֶתְאַפַּק.
