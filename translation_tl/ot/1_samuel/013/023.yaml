  text: And a garrison of the Philistines went out to the pass of Michmash[a].
translation:
  language: tl
  text: At lumabas ang isang garison ng mga Filisteo patungo sa lagusan ng Micmas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “himpilan” o “destakamento” para sa “garison”; maaari ring “tawiran” para sa “lagusan.”
    reason: Pinananatili ang mga leksikal na alternatibo ng מַצַּב at מַעֲבַר nang hindi ginagawang pangunahing paksa ang “himpilan,” na karaniwang tumutukoy sa isang lugar sa Filipino.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Karaniwang nagsasaad ang pandiwa ng paglabas o pagpunta mula sa isang lugar; pinananatili ng “lumabas” ang payak na diwang pasalaysay nang hindi dinaragdagan ng tiyak na kilos-militar.
- source_word: מַצַּב
  choice: isang himpilan
  rationale: Sa kontekstong militar, maaaring tumukoy ang salita sa nakatalagang pangkat ng mga kawal o sa puwestong kanilang binabantayan. Likas sa Filipino ang “himpilan,” ngunit pinananatili sa talababa ang posibleng “destakamento.”
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang makabagong anyo sa Filipino ng pangalan ng pangkat; ang ugnayang konstruktibo ay likas na isinalin bilang “ng mga Filisteo.”
- source_word: אֶל
  choice: patungo sa
  rationale: Malinaw nitong ipinahahayag ang direksiyon habang hindi iginigiit na narating na ang destinasyon.
- source_word: מַעֲבַר
  choice: lagusan
  rationale: Tumutukoy ito sa lugar na dinaraanan o tawiran; sa heograpiya at kontekstong militar ng Micmas, ang “lagusan” ay natural at angkop, bagaman maaari ring “tawiran.”
- source_word: מִכְמָשׂ
  choice: Micmas
  rationale: Ginamit ang anyong madaling basahin at bigkasin sa Filipino para sa pangalang Hebreo.
