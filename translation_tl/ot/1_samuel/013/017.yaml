  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mananalakay” sa halip na mas lumang “mangloloob,” at “pangkat” bilang pangkalahatan at madaling maunawaang katawagan sa yunit militar. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
