base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/017.yaml
  text: And raiders came out from the camp of the Philistines in three companies[a]. One company turned toward the road to Ophrah[b], toward the land of Shual.
translation:
  language: tl
  text: At lumabas mula sa kampo ng mga Filisteo ang puwersang mananalakay[a] sa tatlong pangkat[b]. Ang isang pangkat ay lumiko patungo sa daan patungo sa Ofra, sa lupain ng Shual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang tagapagwasak” o “ang mapanirang puwersa”; dito, tumutukoy ito sa isang pangkat ng mga mananalakay mula sa kampo ng mga Filisteo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “tatlong ulo” at pagkatapos ay “isang ulo,” isang idyoma para sa mga dibisyon o pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁחִית
  choice: pangkat ng mga mananalakay
  rationale: Bagaman anyong isahan at literal na nangangahulugang “ang tagapagwasak” o “ang mapanirang puwersa,” kolektibo ang gamit nito rito para sa pangkat na lumabas mula sa kampo upang manalakay.
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: nahati sa tatlong pangkat
  rationale: Literal itong “tatlong ulo,” ngunit sa kontekstong militar tumutukoy sa tatlong dibisyon o pangkat. Nilinaw ng “nahati” ang ugnayan ng iisang puwersa sa tatlong yunit.
- source_word: הָרֹאשׁ אֶחָד
  choice: ang isang pangkat
  rationale: Pinananatili nito ang pagkakatugma sa naunang idyomang “tatlong pangkat” at natural itong basahin sa Filipino.
- source_word: יִפְנֶה
  choice: lumiko
  rationale: Ipinahihiwatig ng pandiwa ang pagharap o pagliko sa isang direksiyon; ang “lumiko” ay natural sa salaysay ng pagpunta ng pangkat sa isang ruta.
- source_word: דֶּרֶךְ עָפְרָה
  choice: daan ng Ofra
  rationale: Ang דֶּרֶךְ ay “daan” o “ruta.” Ang parirala ay maaaring tumukoy sa daang patungo sa Ofra; pinananatili sa teksto ang maikling anyong malapit sa Hebreo.
- source_word: אֶרֶץ שׁוּעָל
  choice: lupain ng Shual
  rationale: Ang אֶרֶץ ay maaaring “lupain” o “nasasakupan”; ang “lupain ng Shual” ay malinaw na panrehiyong pagtukoy.
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang modernong Filipino na anyo ng pangalan ng pangkat ng mga tao.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Isinalin sa karaniwang anyong transliterado sa Filipino ang pangalan ng lugar.
- source_word: שׁוּעָל
  choice: Shual
  rationale: Pinanatiling transliterasyon ang pangalan ng rehiyon upang hindi ito mapagkamalang karaniwang pangngalan.
