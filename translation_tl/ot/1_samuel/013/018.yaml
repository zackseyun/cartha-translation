  text: וְ/הָ/רֹ֤אשׁ אֶחָד֙ יִפְנֶ֔ה דֶּ֖רֶךְ בֵּ֣ית חֹר֑וֹן וְ/הָ/רֹ֨אשׁ אֶחָ֤ד יִפְנֶה֙ דֶּ֣רֶךְ הַ/גְּב֔וּל הַ/נִּשְׁקָ֛ף עַל גֵּ֥י הַצְּבֹעִ֖ים הַ/מִּדְבָּֽרָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/018.yaml
  text: and one company turned toward the road to Beth-horon[a], and one company turned toward the road of the border that overlooks the Valley of Zeboim[b], toward the wilderness.
translation:
  language: tl
  text: At lumiko ang isang pangkat[a] sa daang patungong Bet-Horon, at lumiko naman ang isa pang pangkat sa daang patungo sa hangganang nakatanaw sa Lambak ng Zeboim[b], patungo sa ilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang dibisyon” o “isang pangkat ng kawal”; literal, “isang ulo.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na pangalan ng lugar ang “Zeboim”; maaaring kaugnay ang salitang pinagmulan nito sa “mga hyena.”
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ אֶחָד
  choice: isang pangkat
  rationale: Literal itong “isang ulo,” ngunit sa kontekstong militar ay tumutukoy sa isa sa mga pangkat o dibisyon ng mga mananalakay. Ang “pangkat” ay malinaw at likas sa makabagong Filipino nang hindi labis na tinutukoy ang laki o organisasyon ng yunit.
- source_word: יִפְנֶה
  choice: lumiko ... patungo
  rationale: Ang pandiwa ay nangangahulugang bumaling o lumiko. Sa pagkilos ng mga kawal, likas na ipinahahayag ng “lumiko ... patungo” ang pagbabago ng direksiyon.
- source_word: דֶּרֶךְ
  choice: daan
  rationale: Tumutukoy rito sa aktuwal na ruta ng paglalakbay; tuwiran at natural ang “daan.”
- source_word: בֵּית חֹרוֹן
  choice: Bet-Horon
  rationale: Isinalin sa baybay-Filipino ang pangalan ng lugar sa halip na isalin ang kahulugan ng mga bahagi nito.
- source_word: הַגְּבוּל
  choice: hangganan
  rationale: Ang salita ay tumutukoy sa hangganan o border ng isang lupain. Ang “hangganan” ang pinakanatural at tiyak sa Filipino.
- source_word: הַנִּשְׁקָף
  choice: nakatanaw sa
  rationale: Ipinahihiwatig ng anyong Hebreo ang isang lugar na nasa itaas at nakaharap o nakatanaw sa lambak. Pinananatili ng “nakatanaw sa” ang topograpikong larawan.
- source_word: גֵּי הַצְּבֹעִים
  choice: Lambak ng Zeboim
  rationale: Malamang na pangalan ito ng lugar, kaya tinumbasan bilang toponimo. Ang posibleng kaugnayan ng pangalan sa mga hyena ay inilagay sa talababa.
- source_word: הַמִּדְבָּרָה
  choice: patungo sa ilang
  rationale: Ang hulaping pandireksiyon sa Hebreo ay nagpapahiwatig ng pagkilos tungo sa ilang; malinaw itong napapanatili ng “patungo sa ilang.”
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pangkat” bilang neutral na katawagang militar at pinanatili ang mga pangalang heograpiko sa anyong transliterado.
