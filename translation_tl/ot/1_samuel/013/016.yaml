base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/016.yaml
  text: Saul and Jonathan his son[a], and the people who were with them, were staying in Geba of Benjamin[b], while the Philistines had encamped at Michmash.
translation:
  language: tl
  text: Si Saul, ang anak niyang si Jonatan, at ang mga taong kasama nila[a] ay nananatili sa Geba ng Benjamin[b], samantalang nagkampo naman ang mga Filisteo sa Micmas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang mga taong natagpuang kasama nila,” na malamang ay tumutukoy sa mga nanatiling kasama nina Saul at Jonatan matapos magsipangalat ang iba.
    reason: lexical_alternative
  - marker: b
    text: Geba ang pangalang-lugar sa tekstong Hebreo, hindi Gibea; magkaugnay ang mga pangalan ngunit magkaibang lugar ang mga ito sa konteksto ng salaysay.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: nananatili
  rationale: Sa kontekstong militar, ang participle ng ישׁב ay tumutukoy sa pananatili o pagkakatigil sa isang lugar, hindi lamang sa literal na pag-upo. Likas sa modernong Filipino ang “nananatili” at pinananatili nito ang duratibong diwa.
- source_word: הַנִּמְצָא עִמָּם
  choice: mga taong kasama nila
  rationale: Literal itong “mga taong natagpuang kasama nila,” ngunit sa konteksto ay tumutukoy sa mga taong naroon pa kasama nina Saul at Jonatan matapos magsipangalat ang iba. Ang “kasama nila” ay natural sa Filipino; inilalahad sa talababa ang mas literal na anyo at ang posibleng pahiwatig nito.
- source_word: בְּגֶבַע בִּנְיָמִן
  choice: sa Geba ng Benjamin
  rationale: Sinusunod ang pangalang-lugar na Geba sa tekstong Hebreo at hindi ito itinutulad sa hiwalay na lugar na Gibea. Ipinahihiwatig ng “ng Benjamin” ang kaugnayan nito sa lupain o lipi ni Benjamin.
- source_word: חָנוּ
  choice: nagkampo
  rationale: Ang חנה ay karaniwang terminong militar para sa pagtatayo o paglalagak ng kampo. Ang “nagkampo” ay malinaw at natural na katumbas sa Filipino.
- source_word: בְמִכְמָשׂ
  choice: sa Micmas
  rationale: Isinalin ang pang-ukol sa natural na Filipino na “sa” at tinumbasan ang pangalang-lugar ayon sa karaniwang anyong Filipino na Micmas.
- source_word: וְ
  choice: samantalang … naman
  rationale: Ang unang וְ ay ipinahihiwatig ng pagkakasunod ng pangungusap nang walang idinagdag na tahasang “Ngayon.” Sa ikalawang sugnay, ang “samantalang … naman” ay natural na naghahayag ng paghahambing o pagkakaiba ng kinalalagyan ng dalawang pangkat.
theological_decisions: []
translation_notes:
  register: 'Gumamit ng modernong, malinaw, at marangal na Filipino. Pinanatili ang mga pangalang Hebreo sa mga anyong madaling basahin sa Filipino: Jonatan, Geba, Benjamin, Filisteo, at Micmas. Hindi nagdagdag ng panimulang pang-abay na katumbas ng English “Now,” sapagkat walang tahasang salitang “ngayon” sa Hebreo.'
