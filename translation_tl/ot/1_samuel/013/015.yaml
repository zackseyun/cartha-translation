  to: Pagkatapos, tumindig si Samuel at umakyat mula sa Gilgal patungong Gibea ng Benjamin.[a] Binilang ni Saul ang mga taong naroon kasama niya, mga animnaraang lalaki.
  rationale: Pinalitan ang “umahon” ng “umakyat” upang maging mas likas at tumpak ang pandiwang paglalakbay, at idinagdag ang “naroon” upang maipahayag ang diwa ng mga taong present kasama ni Saul. Pinanatili ang tekstong Masoretiko na “Gibea ng Benjamin” sa pangunahing teksto at ang variant na “Geba” sa talababa.
