base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/015.yaml
  text: Then Samuel arose and went up from Gilgal to Gibeah of Benjamin[a], and Saul counted the people who were present with him, about six hundred men.
translation:
  language: tl
  text: Pagkatapos, tumindig si Samuel at umakyat mula sa Gilgal patungong Gibea ng Benjamin.[a] Binilang ni Saul ang mga taong naroon kasama niya, mga animnaraang lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Gibea ng Benjamin” ang mababasa sa tekstong Hebreo rito. “Geba ng Benjamin” naman ang mababasa sa ilang saksi at salin.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Karaniwang pandiwang pasalaysay mula sa קום; pinananatili ng “tumindig” ang kilos nang hindi ito nililimitahan sa pag-alis lamang.
- source_word: וַיַּעַל
  choice: umahon
  rationale: Ang עלה ay may diwang pagpunta paitaas; natural sa Filipino ang “umahon” at pinananatili nito ang direksiyonal na pahiwatig.
- source_word: מִן הַגִּלְגָּל
  choice: mula sa Gilgal
  rationale: Tuwirang pariralang nagsasaad ng pinanggalingan.
- source_word: גִּבְעַת בִּנְיָמִן
  choice: patungong Gibea ng Benjamin
  rationale: Ayon sa patinig ng tekstong Masoretiko, Gibea ang pangalan ng lugar. Ginawang tahasan ang patutunguhan na ipinahihiwatig ng pandiwang paglalakbay.
- source_word: וַיִּפְקֹד
  choice: binilang
  rationale: Sa kontekstong militar, maaaring mangahulugang bilangin o tipunin para sa talaan. Ang “binilang” ay malinaw at hindi nagdaragdag ng pormal na pagmomobilisa na hindi tiyak sa teksto.
- source_word: הָעָם
  choice: mga tao
  rationale: Pinananatili ang malawak na kahulugan ng עם, bagaman tumutukoy ito rito sa puwersang kasama ni Saul.
- source_word: הַנִּמְצְאִים עִמּוֹ
  choice: mga taong kasama niya
  rationale: Ang literal na “mga natagpuang kasama niya” ay idyomatikong tumutukoy sa mga naroon o nanatiling kasama niya; “kasama niya” ang natural na Filipino.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: humigit-kumulang animnaraang lalaki
  rationale: Ipinahahayag ng prefiks na כ ang pagtatantiya, at ang אִישׁ sa kontekstong ito ay tumutukoy sa mga lalaking nasa puwersa.
