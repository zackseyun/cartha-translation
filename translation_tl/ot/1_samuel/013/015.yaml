translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “umahon” upang mapanatili ang direksiyonal na diwa, at ang “mga tao” upang hindi paliitin nang higit sa Hebreo ang kahulugan ng עם. Nasa pangunahing teksto ang panandang [a] at ipinaliwanag sa talababa ang variant na Gibea/Geba.
