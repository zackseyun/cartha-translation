base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/010.yaml
  text: And it happened[a], as soon as he had finished offering up the burnt offering, that behold, Samuel came. And Saul went out to meet him, to bless him.
translation:
  language: tl
  text: At nangyari, nang matapos ni Saul ang paghahandog ng handog na sinusunog, dumating si Samuel. Lumabas si Saul upang salubungin siya at pagpalain siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “batiin siya.” Literal na nangangahulugang “pagpalain” ang pandiwang Hebreo, ngunit sa ganitong pagtatagpo maaari itong tumukoy sa isang pormal na pagbati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Pinananatili ang Hebreong panandang pasalaysay na naghaharap ng kasunod na pangyayari, nang hindi gumagamit ng makalumang pananalita.
- source_word: כְּכַלֹּתוֹ
  choice: pagkatapos na pagkatapos
  rationale: Ipinahihiwatig ng כְּ na kasunod agad ang pagdating ni Samuel sa pagtatapos ng paghahandog.
- source_word: לְהַעֲלוֹת
  choice: ihandog
  rationale: Ang Hiphil ng עלה kasama ng bagay na hain ay teknikal na tumutukoy sa paghahandog; likas at malinaw sa Filipino ang “ihandog.”
- source_word: הָעֹלָה
  choice: ang handog na sinusunog
  rationale: Tumutukoy ang עֹלָה sa takdang uri ng hain na sinusunog; malinaw ito sa karaniwang modernong Filipino.
- source_word: וְהִנֵּה
  choice: dumating si Samuel
  rationale: Naipahahayag ng tuwirang pagdating sa puntong ito ang biglaan at kapansin-pansing paglitaw ni Samuel. Hindi isinama ang literal na “narito” dahil magiging pilit ito sa natural na salaysay sa Filipino.
- source_word: וַיֵּצֵא
  choice: Lumabas
  rationale: Pinananatili ang tahasang kilos na palabas.
- source_word: לִקְרָאתוֹ
  choice: upang salubungin siya
  rationale: Ang “salubungin” ang natural na katumbas ng Hebreong idyoma para sa paglabas upang makipagtagpo.
- source_word: לְבָרֲכוֹ
  choice: at pagpalain siya
  rationale: Pinananatili ang pangunahing kahulugang leksikal ng ברך, habang inilalahad sa talababa ang posibleng gamit nito bilang pormal na pagbati.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang teknikal ngunit madaling maunawaang “handog na sinusunog.” Pinanatili sa pangunahing teksto ang literal na “pagpalain,” at inilagay sa talababa ang kontekstuwal na alternatibong “batiin.”
