id: 1SA.13.11
reference: 1 Samuel 13:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר שְׁמוּאֵ֖ל מֶ֣ה עָשִׂ֑יתָ וַ/יֹּ֣אמֶר שָׁא֡וּל כִּֽי רָאִיתִי֩ כִֽי נָפַ֨ץ הָ/עָ֜ם מֵ/עָלַ֗/י וְ/אַתָּה֙ לֹא בָ֨אתָ֙ לְ/מוֹעֵ֣ד הַ/יָּמִ֔ים וּ/פְלִשְׁתִּ֖ים נֶאֱסָפִ֥ים מִכְמָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/011.yaml
  text: Then Samuel said[a], “What have you done?” And Saul said, “Because I saw that the people were scattering from me, and you had not come at the appointed time[b], and the Philistines were gathering at Michmash,”
translation:
  language: tl
  text: Sinabi ni Samuel, “Ano ang ginawa mo?” Sumagot si Saul, “Dahil nakita kong nagkakawatak-watak ang mga tao at lumalayo sa akin, hindi ka dumating sa itinakdang panahon[a], at nagtitipon ang mga Filisteo sa Micmas[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa itinakdang panahon ng mga araw,” malamang na tumutukoy sa panahong dati nang itinakda.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nagkakatipon” o “nakapisan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: Ano ang ginawa mo?
  rationale: Natural at tuwirang tanong sa Tagalog na pinananatili ang matalim na pagsaway ni Samuel tungkol sa natapos nang ginawa ni Saul.
- source_word: כִּי רָאִיתִי
  choice: Dahil nakita kong
  rationale: Ang כִּי ay nagpapakilala sa paliwanag na sanhi ni Saul, at ang רָאִיתִי ay natural na isinasaling “nakita ko” sa kontekstong ito.
- source_word: נָפַץ הָעָם מֵעָלַי
  choice: nagkakawatak-watak ang mga tao at lumalayo sa akin
  rationale: Ipinahahayag nito kapwa ang pagkalat ng pangkat at ang pagkawala ng mga tauhan mula sa paligid o pamumuno ni Saul, nang hindi ipinapalagay na may tahasang panlabas na tagapagwatak.
- source_word: לֹא בָאתָ
  choice: hindi ka dumating
  rationale: Direkta at natural na katumbas; malinaw sa salaysay na hindi dumating si Samuel ayon sa inaasahan ni Saul.
- source_word: לְמוֹעֵד הַיָּמִים
  choice: sa itinakdang panahon
  rationale: Idyomatikong ipinahahayag ang takdang panahon o bilang ng mga araw na napag-usapan, samantalang inilalagay sa talababa ang mas literal na anyo.
- source_word: נֶאֱסָפִים
  choice: nagtitipon
  rationale: Ang Niphal participle ay maaaring maglarawan ng nagpapatuloy na pagtitipon o pagbuo ng hukbo; pinananatili ng “nagtitipon” ang aspektong iyon.
- source_word: מִכְמָשׂ
  choice: Micmas
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar na Michmash.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong paliwanag ni Saul na nagpapatuloy sa kasunod na talata, kaya nagtatapos ang sipi sa kuwit. Inilipat sa wastong salita ang talababa tungkol sa נֶאֱסָפִים sa halip na ilagay pagkatapos ng “Sinabi ni Samuel.”
