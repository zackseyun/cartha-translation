source:
  edition: WLC
  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֤ל רָאוּ֙ כִּ֣י צַר ל֔/וֹ כִּ֥י נִגַּ֖שׂ הָ/עָ֑ם וַ/יִּֽתְחַבְּא֣וּ הָ/עָ֗ם בַּ/מְּעָר֤וֹת וּ/בַֽ/חֲוָחִים֙ וּ/בַ/סְּלָעִ֔ים וּ/בַ/צְּרִחִ֖ים וּ/בַ/בֹּרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/006.yaml
  text: When the men of Israel saw that they were in trouble[a], because the people were hard pressed, the people hid themselves in caves, in thickets, among rocks, in strongholds[c][b], and in pits.
translation:
  language: tl
  text: Nang makita ng mga Israelita na nasa panganib sila, sapagkat gipit na gipit ang bayan, nagtago ang mga tao sa mga yungib, sa mga masukal na tinikan[a], sa mga batuhan, sa mga kuta[b], at sa mga hukay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga matinik na palumpong.” Bihira ang salitang Hebreo at maaaring tumukoy sa masukal at matinik na halaman.
    reason: lexical_alternative
  - marker: b
    text: O “sa mga silid sa ilalim ng lupa,” “sa mga taguang nasa ilalim ng lupa,” o “sa mga lungga.” Hindi tiyak ang salitang Hebreo.
    reason: lexical_alternative
  - marker: c
    text: O “sa mga imbakang-tubig.” Ang salitang Hebreo ay maaari ring tumukoy sa mga balon o sisidlang hinukay sa lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman anyong isahan ang אִישׁ, ang maramihang pandiwang רָאוּ ay nagpapakitang kolektibo ang diwa. Likas sa modernong Tagalog ang “mga Israelita” at hindi nito ipinapalagay na bawat isa ay kumilos nang hiwalay.
- source_word: רָאוּ
  choice: makita
  rationale: Pinananatili nito ang payak na diwang pandama ng pandiwa, habang ipinahihiwatig ng kasunod na sugnay ang pagkilala nila sa kanilang kalagayan.
- source_word: כִּי צַר לוֹ
  choice: na nasa panganib sila
  rationale: Ang Hebreo ay siksik at gumagamit ng isahang panghalip kaugnay ng kolektibong simuno. Ang maramihang “sila” ay likas sa Tagalog, at ang “nasa panganib” ay angkop sa kagyat na banta sa konteksto.
- source_word: כִּי נִגַּשׂ הָעָם
  choice: sapagkat gipit na gipit ang bayan
  rationale: Ang Niphal ng נגשׂ ay nagpapahiwatig na sila ay matinding sinisikil o naiipit. Ang “gipit na gipit” ay natural at malinaw sa kontekstong militar nang hindi labis na tinutukoy kung paano sila pinahirapan.
- source_word: וַיִּתְחַבְּאוּ
  choice: nagtago
  rationale: Natural na naihahatid ng “nagtago” ang reflexive na diwa ng Hitpael sa Tagalog.
- source_word: בַּמְּעָרוֹת
  choice: sa mga yungib
  rationale: Tuwiran at marangal na katumbas ng mga kuweba o lungga sa bato ang “mga yungib.”
- source_word: וּבַחֲוָחִים
  choice: sa mga masukal na tinikan
  rationale: Bihira ang salitang Hebreo at malamang na tumutukoy sa matinik na palumpong o masukal na tinikan. Pinagsasama ng salin ang pagiging masukal at matinik, habang inilalahad sa talababa ang kawalan ng katiyakan.
- source_word: וּבַסְּלָעִים
  choice: sa mga batuhan
  rationale: Natural sa Tagalog ang “mga batuhan” bilang lugar sa gitna ng mga bato, bangin, o malalaking tipak ng bato.
- source_word: וּבַצְּרִחִים
  choice: sa mga silid sa ilalim ng lupa
  rationale: Bihira at di-tiyak ang termino. Posibleng tumukoy ito sa mga silid, taguan, o imbakan sa ilalim ng lupa; ang pangunahing salin ay kongkreto ngunit pinananatili sa talababa ang ibang posibilidad.
- source_word: וּבַבֹּרוֹת
  choice: sa mga hukay
  rationale: Ang בּוֹר ay maaaring hukay, balon, o sisidlan ng tubig. “Mga hukay” ang pinakamalawak na katumbas sa kontekstong pagtataguan, at inilalagay sa talababa ang “mga imbakang-tubig.”
