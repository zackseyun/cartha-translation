translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw na daloy. Ginamit ang “yungib” bilang pamilyar na salitang biblikal ngunit nananatiling madaling maunawaan. Iningatan ang pag-uulit ng kolektibong bayan sa pamamagitan ng “mga Israelita” at “mga tao,” at tahasang minarkahan ang tatlong leksikal na di-katiyakan.
