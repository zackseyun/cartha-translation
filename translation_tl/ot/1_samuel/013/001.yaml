base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/001.yaml
  text: Saul was one year old when he became king[a], and he reigned two years over Israel.
translation:
  language: tl
  text: Isang taóng gulang si Saul nang maging hari siya[a], at naghari siya sa Israel nang dalawang taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang tekstong Hebreo rito at malamang na kulang o nasira. Sa literal na anyo, “Anak siya ng isang taon sa kanyang paghahari, at naghari siya sa Israel nang dalawang taon.” Nagbibigay ang ilang sinaunang saksi at mga kalaunang mungkahi ng mas malalaking bilang, gaya ng “tatlumpu” para sa edad ni Saul at “apatnapu’t dalawa” para sa haba ng kanyang paghahari.
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שָׁנָה
  choice: isang taóng gulang
  rationale: Karaniwang idyomang Hebreo ito para sa edad na isang taon. Pinananatili ng salin ang aktuwal na anyo ng tekstong Masoretiko, kahit nagdudulot ito rito ng malinaw na suliraning pangkasaysayan; ipinaliliwanag iyon sa talababa.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Karaniwang anyo ng pangalang ito sa makabagong saling Filipino.
- source_word: בְּמָלְכוֹ
  choice: nang maging hari siya
  rationale: Ipinapahayag ng pariralang Hebreo ang panahon ng pagluklok ni Saul. Natural at malinaw ito sa Filipino nang hindi dinaragdagan ang teksto.
- source_word: וּשְׁתֵּי שָׁנִים
  choice: at ... nang dalawang taon
  rationale: Tuwirang pinananatili ang pangatnig at bilang sa tekstong Masoretiko; ang “nang” ay natural na pananda ng tagal sa Filipino.
- source_word: מָלַךְ
  choice: naghari siya
  rationale: Ang qal na pandiwang מלך ay nangangahulugang “maghari” o “maging hari”; “naghari” ang natural na katumbas sa pormulang ito.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa Filipino, natural na gamitin ang “sa” upang tukuyin ang bayang pinaghaharian; ang “naghari sa Israel” ay malinaw at idiomatiko.
theological_decisions:
- issue: Mahirap o maaaring kulang na pormula tungkol sa paghahari sa tekstong Masoretiko
  choice: Panatilihin sa pangunahing teksto ang mga bilang ng WLC nang walang haka-hakang pagdaragdag
  alternative: Maaaring punan ang edad at/o haba ng paghahari ng mas malalaking bilang, gaya ng tatlumpu at apatnapu't dalawa, o maglagay ng puwang para sa nawawalang bilang.
  rationale: Malamang na may kakulangan o pagkasira ang naipasa ritong tekstong Hebreo, ngunit hindi tiyak ang orihinal na mga bilang. Kaya hindi nararapat na gawing pangunahing teksto ang alinmang haka-hakang pagbubuo; inilalahad sa talababa ang suliranin at mahahalagang mungkahi.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili sa pangunahing teksto ang nakagugulat na bilang ng tekstong Masoretiko, habang malinaw na inilagay sa talababa ang problemang tekstuwal.
