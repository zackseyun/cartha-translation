  text: וּ/פְלִשְׁתִּ֞ים נֶאֶסְפ֣וּ לְ/הִלָּחֵ֣ם עִם יִשְׂרָאֵ֗ל שְׁלֹשִׁ֨ים אֶ֤לֶף רֶ֨כֶב֙ וְ/שֵׁ֤שֶׁת אֲלָפִים֙ פָּרָשִׁ֔ים וְ/עָ֕ם כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַֽת הַ/יָּ֖ם לָ/רֹ֑ב וַֽ/יַּעֲלוּ֙ וַ/יַּחֲנ֣וּ בְ/מִכְמָ֔שׂ קִדְמַ֖ת בֵּ֥ית אָֽוֶן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/005.yaml
  text: 'And the Philistines gathered to fight against Israel: thirty thousand chariots[a], and six thousand horsemen, and troops as numerous as the sand that is on the seashore. They went up and camped at Mikmash, east of Beth-aven.'
translation:
  language: tl
  text: 'Nagtipon ang mga Filisteo upang makipaglaban sa Israel: tatlumpung libong karwaheng pandigma[a], anim na libong mangangabayo, at mga kawal na kasingdami ng buhangin sa dalampasigan. Umakyat sila at nagkampo sa Micmas, sa silangan ng Bet-aven.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tatlumpung libong karwaheng pandigma.” Iminungkahi ng ilang tagapagpaliwanag at sinaunang saksi sa teksto ang mas maliit na bilang, gaya ng “tatlong libo,” sapagkat tila di-pangkaraniwang malaki sa konteksto ang tatlumpung libo. Gayunman, sinusunod ng pangunahing teksto ang Masoretikong tekstong Hebreo.
    reason: textual_variant
lexical_decisions:
- source_word: נֶאֶסְפוּ
  choice: Nagtipon
  rationale: Ang Niphal ng אסף ay tumutukoy rito sa pagtitipon o pagmamartsa ng hukbo; natural at malinaw ang “nagtipon” sa makabagong Tagalog.
- source_word: לְהִלָּחֵם עִם
  choice: upang makipaglaban sa
  rationale: Ipinapahayag ng parirala ang layuning lumaban sa Israel. Sa Tagalog, malinaw sa konteksto na ang “makipaglaban sa” ay adversatibo.
- source_word: שְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: tatlumpung libong karwaheng pandigma
  rationale: Sinusunod nito ang bilang at payak na kahulugan ng tekstong Masoretiko. Nililinaw ng “pandigma” na רֶכֶב ay mga karwaheng ginagamit sa labanan, hindi karaniwang sasakyan.
- source_word: שֵׁשֶׁת אֲלָפִים פָּרָשִׁים
  choice: anim na libong mangangabayo
  rationale: Ang פָּרָשִׁים ay mga nakasakay na mandirigma; “mangangabayo” ang natural at tradisyonal na katumbas sa Tagalog.
- source_word: וְעָם
  choice: at mga kawal
  rationale: Bagaman literal na “bayan” o “mga tao,” tumutukoy ito sa mga tauhang pandigma sa konteksto; ang “mga kawal” ay malinaw nang hindi labis na nagpapakahulugan.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: na sindami ng buhangin sa dalampasigan
  rationale: Pinananatili ang Hebreong paghahambing para sa napakaraming bilang sa isang natural at madaling maunawaang anyong Tagalog.
- source_word: וַיַּעֲלוּ
  choice: Umahon sila
  rationale: Pinananatili ng “umahon” ang direksiyonal na diwa ng עלה at hindi ito pinapalitan ng mas interpretatibong “sumalakay” o “sumulong.”
- source_word: וַיַּחֲנוּ
  choice: nagkampo
  rationale: Makabago, natural, at tumpak na katumbas ng חנה.
- source_word: בְמִכְמָשׂ
  choice: sa Micmas
  rationale: Isinalin sa baybay na angkop sa Filipino ang pangalan ng lugar at ginamit ang natural na panandang lokatibo na “sa.”
- source_word: קִדְמַת בֵּית אָוֶן
  choice: sa silangan ng Bet-aven
  rationale: Malinaw na ipinapahayag ang heograpikong relasyon na tinutukoy ng קִדְמַת, habang pinananatili ang pangalan ng lugar.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ayos ng pangungusap at mga terminong militar na madaling maunawaan. Pinanatili ang tunay na suliraning tekstuwal sa bilang ng mga karwaheng pandigma sa talababa sa halip na baguhin nang tahimik ang pangunahing teksto.
