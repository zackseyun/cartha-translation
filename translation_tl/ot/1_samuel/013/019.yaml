  text: No blacksmith could be found in all the land of Israel[a], because the Philistines said, “Otherwise the Hebrews will make swords or spears.”
translation:
  language: tl
  text: Walang panday na matatagpuan sa buong lupain ng Israel, dahil sinabi ng mga Filisteo, “Baka gumawa ang mga Hebreo ng tabak o sibat.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin nang mas pormal ang “Baka gumawa” bilang “baka sakaling gumawa.” Ang Hebreong פֶּן ay nagpapahayag ng kinatatakutang pangyayari na nais pigilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרָשׁ
  choice: panday
  rationale: Bagaman maaari itong tumukoy nang mas malawak sa isang bihasang manggagawa, malinaw sa konteksto ng paggawa ng mga sandata at pagpapatalas ng mga kagamitan na isang panday sa metal ang tinutukoy.
- source_word: יִמָּצֵא
  choice: matatagpuan
  rationale: Ipinahahayag ng anyong Niphal na walang ganitong panday na naroroon o masusumpungan sa lupain.
- source_word: בְּכֹל אֶרֶץ יִשְׂרָאֵל
  choice: sa buong lupain ng Israel
  rationale: Tuwirang inililipat ang saklaw na heograpiko habang pinananatili ang biblikal ngunit likas na salitang “lupain.”
- source_word: כִּי
  choice: dahil
  rationale: Ipinakikilala nito ang dahilan kung bakit walang panday; ang “dahil” ay malinaw at natural sa modernong Filipino.
- source_word: אמר
  choice: sinabi
  rationale: Ang payak na nagdaang panahunan ay angkop sa salaysay; hindi kailangang gawing tahasang “nauna nang sinabi.”
- source_word: פֶּן
  choice: Baka
  rationale: Likas na ipinahahayag ng “baka” ang kinatatakutang maaaring mangyari na nais pigilan ng mga Filisteo, nang hindi gumagamit ng lipas o labis na pormal na pananalita.
- source_word: הָעִבְרִים
  choice: ang mga Hebreo
  rationale: Pinananatili ang tiyak na katawagang etniko ng teksto, na angkop sa pananalita ng mga Filisteo, sa halip na palitan ito ng “mga Israelita.”
- source_word: יַעֲשׂוּ
  choice: gumawa
  rationale: Kasunod ng “baka,” natural sa Filipino ang anyong ito para sa inaasahan o kinatatakutang kilos.
- source_word: חֶרֶב אוֹ חֲנִית
  choice: tabak o sibat
  rationale: Pinananatili ang isahan ng Hebreo, na natural ding gumaganap bilang pangkalahatang uri sa Filipino.
