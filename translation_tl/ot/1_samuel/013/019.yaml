translation_notes:
  register: Modernong Filipino na malinaw at marangal ang ginamit. Ang “panday,” “lupain,” “tabak,” at “sibat” ay madaling maunawaan ngunit angkop sa makasaysayang salaysay. Hindi nagdagdag ng panimulang “Ngayon” sapagkat walang tahasang katumbas nito sa pinagmulang teksto; hindi rin kailangang isalin nang hiwalay ang panimulang waw sa talatang ito.
