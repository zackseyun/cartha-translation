base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/004.yaml
  text: And all Israel heard it said[a], “Saul has struck down the Philistine garrison[c][b], and Israel has also become odious to the Philistines.” Then the people were called out to join Saul at Gilgal.
translation:
  language: tl
  text: 'Narinig ng buong Israel ang balita: “Nilusob ni Saul ang himpilan ng mga Filisteo[a], at naging kasuklam-suklam din ang Israel sa mga Filisteo[b].” Kaya tinawag ang bayan upang sumunod kay Saul sa Gilgal[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring tumukoy sa “opisyal” o “gobernador ng mga Filisteo,” o sa isang nakatalagang puwersa o puwestong militar. Mas angkop sa konteksto rito ang “himpilan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “naging mabaho ang Israel sa mga Filisteo”—isang idyomang nangangahulugang naging lubhang kasuklam-suklam o kinamumuhian sila.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin, “tinawag na magtipon ang bayan sa likuran ni Saul sa Gilgal.” Malamang na tumutukoy ito sa pagtitipon ng bayan upang sumunod kay Saul sa pakikipaglaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ לֵאמֹר
  choice: narinig ... ang balitang
  rationale: Ipinahahayag ng parirala ang pagkalat ng isang ulat. Likas sa modernong Tagalog ang “narinig ... ang balitang” at pinananatili nitong iniulat lamang ang kasunod na pahayag.
- source_word: הִכָּה
  choice: tinalo
  rationale: Sa kontekstong militar, ang נכה ay nangangahulugang hampasin o gapiin. Ang “tinalo” ay malinaw at natural, nang hindi ipinapalagay na napatay ang bawat nasa himpilan.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: himpilan ng mga Filisteo
  rationale: Maaaring tumukoy ang נְצִיב sa isang opisyal o sa isang nakatalagang puwersa o puwestong militar. Pinapaboran ng konteksto ang kahulugang militar, at saklaw ng “himpilan” ang puwesto at ang mga kawal na naroon.
- source_word: נִבְאַשׁ
  choice: naging kasuklam-suklam
  rationale: Literal na nagpapahiwatig ang pandiwa ng pagiging mabaho, ngunit matalinghaga itong tumutukoy sa pagiging lubhang kinamumuhian. Likas at marangal sa Tagalog ang “naging kasuklam-suklam”; inilalahad sa talababa ang kongkretong larawan.
- source_word: בַּפְּלִשְׁתִּים
  choice: sa mga Filisteo
  rationale: Tinutukoy ng pang-ukol ang mga Filisteong tumuring sa Israel bilang kasuklam-suklam. Pinananatili ng “sa mga Filisteo” ang maikli at bahagyang maluwag na ugnayan ng Hebreo.
- source_word: וַיִּצָּעֲקוּ
  choice: tinipon
  rationale: Bagaman kaugnay ng pagsigaw o pagtawag ang ugat, ang anyo at kontekstong militar dito ay tumutukoy sa pagtawag at pagtitipon sa bayan para sa pagkilos.
- source_word: אַחֲרֵי שָׁאוּל
  choice: upang sumunod kay Saul
  rationale: Literal itong “sa likuran/pagkatapos ni Saul,” ngunit sa konteksto ay nangangahulugang magtipon sa ilalim ng kanyang pamumuno at sumunod sa kanya.
- source_word: הַגִּלְגָּל
  choice: sa Gilgal
  rationale: Ang “sa Gilgal” ang natural na pagpapahayag ng lugar na pinagtitipunan sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “mga Filisteo” at “Gilgal” bilang karaniwang anyo ng mga pangalang biblikal. Ang “himpilan,” “kasuklam-suklam,” at “tinipon” ay nagpapanatili ng kontekstong militar at ng lakas ng idyomang Hebreo nang hindi nagiging salitang-kalye o labis na teknikal.
