  naturalness: Mas natural sa modernong Tagalog ang “Narinig ng buong Israel ang balita:” kaysa “At narinig ng buong Israel ang balitang,” bago ang tuwirang sipi. Ang “tinawag ang bayan upang sumunod kay Saul” ay mas tuwirang naglalahad ng pagmamuster kaysa “tinipon ang mga tao,” habang nananatiling likas at dignificado.
  terminology: Ang “mga Filisteo,” “Gilgal,” “himpilan,” at “kasuklam-suklam” ay angkop. Pinananatili ng talababa sa “himpilan” ang leksikal na posibilidad na opisyal ang tinutukoy, nang hindi ipinipilit ang isang pinag-aalitang kahulugan.
