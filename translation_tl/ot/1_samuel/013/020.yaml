translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'magpahasa' bilang natural na pagpapahayag ng pagpunta sa mga Filisteo upang patalasin ang mga kagamitan, nang hindi tahasang idinaragdag ang 'mga panday,' na wala sa Hebreong teksto.
