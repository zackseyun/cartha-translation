  text: So all Israel went down to the Philistines[a], each man to sharpen his plowshare, his mattock, his axe, and his sickle.
translation:
  language: tl
  text: Kaya bumaba ang buong Israel sa mga Filisteo upang ipahasa ng bawat isa ang kanyang talim ng araro, asarol, palakol, at karit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O marahil, “panghiwa ng araro” o ibang kasangkapang pang-araro; hindi tiyak ang kahulugan ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: bumaba
  rationale: Pinananatili ang diwang patungong ibaba ng pandiwang ירד at ang daloy ng salaysay.
- source_word: כָל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Likas na kolektibong pahayag sa Filipino na pinananatili ang Israel bilang isang sambayanan.
- source_word: הַפְּלִשְׁתִּים
  choice: sa mga Filisteo
  rationale: Ang Hebreo ay tumutukoy sa pangkat ng mga tao, hindi tahasang sa lupain o sa mga panday; hindi idinagdag ang hindi nakasaad sa teksto.
- source_word: לִלְטוֹשׁ
  choice: upang magpahasa
  rationale: Sa konteksto, pumupunta ang mga Israelita sa mga Filisteo para maipahasa ang kanilang mga kagamitang metal. Ang 'magpahasa' ang natural na pagpapahayag nito sa Filipino.
- source_word: אִישׁ
  choice: ang bawat isa
  rationale: Ipinakikita ang distributibong isahan kasunod ng kolektibong simuno nang natural sa Filipino.
- source_word: מַחֲרַשְׁתּוֹ
  choice: kanyang talim ng araro
  rationale: Malamang na tumutukoy sa bahaging metal ng araro na humihiwa sa lupa; mas malinaw ito sa karaniwang mambabasa kaysa sa teknikal na katawagan.
- source_word: אֵתוֹ
  choice: asarol
  rationale: Tumutukoy sa kasangkapang panghukay o pambungkal; ang 'asarol' ay karaniwan at madaling maunawaan.
- source_word: קַרְדֻּמּוֹ
  choice: palakol
  rationale: Ito ang tuwirang katumbas ng kasangkapang pamputol na tinutukoy ng pangngalan.
- source_word: מַחֲרֵשָׁתוֹ
  choice: karit
  rationale: Posibleng tumukoy sa karit sa talaan ng mga kagamitang kailangang hasain, ngunit hindi tiyak ang kahulugan ng salitang Hebreo; kaya inilagay sa talababa ang ibang posibilidad.
