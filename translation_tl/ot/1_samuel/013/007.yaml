base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/007.yaml
  text: And Hebrews crossed over the Jordan into the land of Gad and Gilead[a]. But Saul was still at Gilgal[b], and all the people trembled behind him.
translation:
  language: tl
  text: At tumawid ang mga Hebreo sa Jordan patungo sa lupain ng Gad at Gilead. Samantala, nasa Gilgal pa rin si Saul, at ang buong bayan ay nanginig sa likuran niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang buong bayan ay nanginig na sumusunod sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִים
  choice: mga Hebreo
  rationale: Tuwirang pinananatili ang katawagang etniko ng tekstong Hebreo sa halip na ipakahulugan agad bilang “mga Israelita.”
- source_word: עָבְרוּ אֶת הַיַּרְדֵּן
  choice: tumawid ... sa Jordan
  rationale: Likas na pariralang Tagalog para sa pagtawid sa Ilog Jordan; hindi na kailangan ang “tumawid sa kabila” dahil sapat na ang pandiwa.
- source_word: אֶרֶץ גָּד וְגִלְעָד
  choice: patungo sa lupain ng Gad at Gilead
  rationale: Pinananatili ng “lupain” ang heograpikong diwa ng אֶרֶץ, at ipinahihiwatig ng “patungo sa” ang direksiyon ng pagtawid.
- source_word: עוֹדֶנּוּ בַגִּלְגָּל
  choice: nasa Gilgal pa rin
  rationale: Natural na modernong Tagalog para sa nagpapatuloy na pananatili ni Saul sa lugar.
- source_word: חָרְדוּ
  choice: nanginginig sa takot
  rationale: Inilalahad ang kapwa pisikal at emosyonal na diwa ng pandiwa, na mas malinaw kaysa sa “nanginginig” lamang.
- source_word: אַחֲרָיו
  choice: sumusunod sa kanya
  rationale: Sa konteksto ng bayang kasama ni Saul, ang relasyonal na diwang “sumusunod” ay mas natural sa Tagalog; ang literal na larawang “nasa likuran niya” ay inilalagay sa talababa bilang tunay na alternatibo.
theological_decisions:
- issue: Pagkakakilanlan ng עִבְרִים
  choice: mga Hebreo
  alternative: mga Israelita
  rationale: Hindi nilulutas ng salin kung ang katawagan ay panlabas na pangalan para sa mga Israelita o tumutukoy sa isang mas tiyak na pangkat; pinananatili ang anyo ng pinagmulan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “bayan” para sa הָעָם ayon sa salaysay, at iniwasan ang mas arkaikong ayos. Inilagay ang talababa sa sugnay na saklaw nito.
