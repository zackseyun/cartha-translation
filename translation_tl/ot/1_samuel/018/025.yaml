base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/025.yaml
  text: Then Saul said[a], “Thus you shall say to David, ‘The king has no desire for a bride-price except a hundred Philistine foreskins[c][b], to take vengeance on the king’s enemies.’” Now Saul intended to make David fall by the hand of the Philistines.
translation:
  language: tl
  text: 'Sinabi ni Saul, “Ito ang sabihin ninyo kay David: ‘Hindi naghahangad ang hari ng kabayarang pangkasal[a], maliban sa isang daang balat sa dulo ng ari ng mga Filisteo, upang maipaghiganti ang hari laban sa kanyang mga kaaway.’” Balak ni Saul na pabagsakin si David sa kamay ng mga Filisteo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kabayarang pangkasal” ay kabayarang kaugnay ng pag-aasawa na karaniwang ibinibigay ng lalaki o ng pamilya niya sa pamilya ng babae; hindi ito katumbas ng karaniwang kahulugan ng “dote.”
    reason: cultural_note
  - marker: b
    text: Ang “pabagsakin si David” ay malamang na nangangahulugang ipahamak siya hanggang sa mamatay, ngunit hindi ito tahasang sinabi sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹהַר
  choice: handog-pangkasal
  rationale: Tumutukoy ito sa halagang ibinibigay ng lalaki o ng pamilya niya sa pamilya ng babae kaugnay ng pag-aasawa. Mas malinaw ang “handog-pangkasal” sa karaniwang mambabasa kaysa sa “dote,” na maaaring magpahiwatig ng kabaligtarang direksiyon ng pagbibigay.
- source_word: אֵין חֵפֶץ לַמֶּלֶךְ
  choice: Hindi naghahangad ang hari
  rationale: Ipinahahayag ng חֵפֶץ ang pagnanais o pagkagusto. Ang “hindi naghahangad” ay natural sa kontekstong nagsasaad kung anong kabayaran ang hindi hinihingi ng hari.
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: kundi ng isandaang balat ng masama ng mga Filisteo
  rationale: Pinananatili nito ang tahasan at nakagigimbal na hinihingi sa Hebreo. Ang “kundi” ay angkop sa diwa ng konstruksiyong “hindi ... kundi.”
- source_word: לְהִנָּקֵם בְּאֹיְבֵי הַמֶּלֶךְ
  choice: upang makapaghiganti sa mga kaaway ng hari
  rationale: Natural na Filipino ito para sa layuning ipinahahayag ng anyong Niphal ng נקם, nang hindi dinaragdagan kung paano isasagawa ang paghihiganti.
- source_word: חָשַׁב
  choice: Balak
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa sadyang hangarin o pakana, hindi lamang sa pag-iisip.
- source_word: לְהַפִּיל אֶת־דָּוִד
  choice: na pabagsakin si David
  rationale: Pinananatili ang metapora ng Hebreo na “pabagsakin,” na maaaring tumukoy sa pagkamatay o pagkawasak ni David nang hindi ito ginagawang tahasan sa pangunahing teksto.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: sa kamay ng mga Filisteo
  rationale: Pinananatili ang Hebreong idyoma ng ahensiya habang nananatiling malinaw at pamilyar sa estilong biblikal na Filipino.
theological_decisions:
- issue: Saklaw ng “pabagsakin”
  choice: 'Pinanatili ang di-tahasang metapora: “pabagsakin si David.”'
  alternative: “ipapatay si David”
  rationale: Malamang na kamatayan ang nilalayon ni Saul, ngunit hindi tahasang sinabi ng Hebreo ang pandiwang “patayin”; kaya hindi dapat alisin ang tunay na antas ng di-pagkatiyak.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang pamilyar na ekspresyong “balat ng masama” upang maging tahasan ngunit hindi bulgar; pinanatili rin ang mga larawang “pabagsakin” at “sa kamay ng” mula sa Hebreo.
