revisions:
- from: 'Sinabi ni Saul, “Ganito ang sabihin ninyo kay David: ‘Hindi naghahangad ang hari ng handog-pangkasal[a], kundi ng isandaang balat ng masama ng mga Filisteo, upang makapaghiganti sa mga kaaway ng hari.’” Balak ni Saul na pabagsakin si David sa kamay ng mga Filisteo.[b]'
  to: 'Sinabi ni Saul, “Ito ang sabihin ninyo kay David: ‘Hindi naghahangad ang hari ng kabayarang pangkasal[a], maliban sa isang daang balat sa dulo ng ari ng mga Filisteo, upang maipaghiganti ang hari laban sa kanyang mga kaaway.’” Balak ni Saul na pabagsakin si David sa kamay ng mga Filisteo.[b]'
