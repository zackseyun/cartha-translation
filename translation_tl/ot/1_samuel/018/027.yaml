base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/027.yaml
  text: So David arose and went[a], he and his men, and struck down two hundred Philistine men. Then David brought their foreskins, and they counted them out in full to the king, so that he might become the king’s son-in-law. And Saul gave him Michal his daughter as a wife.
translation:
  language: tl
  text: Kaya tumindig si David at humayo siya kasama ng kanyang mga tauhan, at pinatay nila ang dalawang daang lalaking Filisteo. Pagkatapos, dinala ni David ang kanilang mga balat ng ari, at iniharap nila ang mga iyon sa hari nang buong bilang[a], upang maging manugang ng hari si David. At ibinigay ni Saul sa kanya si Mical, ang kanyang anak na babae, bilang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at binilang nila ang mga iyon nang buo sa harap ng hari.” Mahirap unawain ang pandiwang Hebreo; maaaring tumukoy ito sa paghaharap ng buong bilang o sa pagbibilang ng mga iyon sa harap ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Ang Qal wayyiqtol ng קום ay panandang pasalaysay sa pagsisimula ng isang tiyak na pagkilos. Pinananatili ng “tumindig” ang puwersang ito nang hindi ipinahihiwatig na basta lamang siya bumangon mula sa pagkakaupo.
- source_word: וַיֵּלֶךְ הוּא וַאֲנָשָׁיו
  choice: yumaon kasama ang kanyang mga tauhan
  rationale: Likas at marangal ito sa modernong Tagalog. Naipapahayag ng “kasama ang kanyang mga tauhan” ang tahasang pagbanggit kay David at sa kanyang pangkat, bagaman hindi ginagaya nang mekanikal ang Hebreong ayos.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים מָאתַיִם אִישׁ
  choice: Pinabagsak nila ang dalawang daang lalaking Filisteo
  rationale: Sa kontekstong pandigmaan, ang נכה ay tumutukoy sa pananakit na nakamamatay. Ang “pinabagsak” ay malinaw ngunit hindi higit na tahasan kaysa sa Hebreo; ipinahihiwatig ng kasunod na pagkuha ng balat na napatay ang mga lalaki.
- source_word: עָרְלֹתֵיהֶם
  choice: kanilang mga balat ng maselang bahagi
  rationale: Tumutukoy ito sa balat na tinatanggal sa pagtutuli. Gumagamit ang salin ng malinaw ngunit dignified na parirala, nang hindi itinatago ang diwa ng hinihinging handog sa pag-aasawa.
- source_word: וַיְמַלְאוּם לַמֶּלֶךְ
  choice: ibinigay ang mga iyon nang buong bilang sa hari
  rationale: Mahirap ang anyo at sintaks ng pandiwa. Ang salin ay nagpapahayag ng paghaharap ng kumpletong bilang sa hari, habang ang talababa ay nagpapanatili sa posibilidad na binilang ang mga iyon sa harap niya.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: upang maging manugang siya ng hari
  rationale: Ang hitpael ng חתן ay pagpasok sa ugnayang pampamilya sa pamamagitan ng kasal. Sa konteksto, ang pagiging manugang ng hari ang tiyak at likas na kahulugan.
- source_word: וַיִּתֶּן לוֹ שָׁאוּל אֶת מִיכַל בִּתּוֹ לְאִשָּׁה
  choice: ibinigay sa kanya ni Saul ang anak nitong si Mical upang maging asawa niya
  rationale: Pinananatili nito ang pormal na idyoma ng pagbibigay sa anak na babae bilang asawa, ngunit nasa natural at makabagong Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Tagalog. Ginamit ang “yumaon” at “tumindig” para sa marangal na himig ng salaysay, ngunit iniwasan ang labis na makalumang balangkas. Ang pangalang מִיכַל ay isinaling “Mical,” ayon sa karaniwang anyong Filipino. Ang anatomikong termino ay ipinahayag nang tuwiran sa diwa ngunit may dignidad.
