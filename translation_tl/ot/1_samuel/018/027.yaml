revisions:
- from: Kaya tumindig si David at yumaon kasama ang kanyang mga tauhan. Pinabagsak nila ang dalawang daang lalaking Filisteo. Pagkatapos, dinala ni David ang kanilang mga balat ng maselang bahagi, at ibinigay ang mga iyon nang buong bilang sa hari[a] upang maging manugang siya ng hari. At ibinigay sa kanya ni Saul ang anak nitong si Mical upang maging asawa niya.
  to: Kaya tumindig si David at humayo siya kasama ng kanyang mga tauhan, at pinatay nila ang dalawang daang lalaking Filisteo. Pagkatapos, dinala ni David ang kanilang mga balat ng ari, at iniharap nila ang mga iyon sa hari nang buong bilang[a], upang maging manugang ng hari si David. At ibinigay ni Saul sa kanya si Mical, ang kanyang anak na babae, bilang asawa.
  rationale: Pinalitan ang euphemism ng tumpak na anatomikong termino na kailangan ng Hebreong teksto. Inayos din ang sintaks upang maging malinaw ang mga sanggunian ng panghalip at upang maipakita, nang may pag-iingat, ang plural na pandiwa sa mahirap na pariralang וַיְמַלְאוּם. Nananatili sa talababa ang leksikal at sintaktikong kawalang-katiyakan.
