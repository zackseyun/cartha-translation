  text: וַ/יַּ֤רְא שָׁאוּל֙ וַ/יֵּ֔דַע כִּ֥י יְהוָ֖ה עִם דָּוִ֑ד וּ/מִיכַ֥ל בַּת שָׁא֖וּל אֲהֵבַֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/028.yaml
  text: Saul saw and knew that Yahweh was with David[a], and that Michal the daughter of Saul loved him.
translation:
  language: tl
  text: Nakita at nalaman ni Saul na kasama ni David si Yahweh, at na mahal ni Mical na anak ni Saul si David.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nakita
  rationale: Pinananatili ang karaniwang kahulugan ng ראה at ang pagsulong mula sa pagkakita tungo sa pagkaalam.
- source_word: וַיֵּדַע
  choice: nalaman
  rationale: Ipinahahayag ang tiyak na pagkilalang nabuo kay Saul batay sa kanyang nakita; natural itong ipares sa “nakita.”
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng nalaman ni Saul.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: עִם דָּוִד
  choice: kasama ni David
  rationale: Natural na salin ng presensiya o pakikisama; hindi nito labis na ipinapaliwanag ang ipinahihiwatig na banal na pagsang-ayon.
- source_word: וּמִיכַל בַּת שָׁאוּל
  choice: at ... si Mical na anak ni Saul
  rationale: Natural na Filipino para sa pariralang konstrakto. Ang ikalawang sugnay ay maaaring unawain bilang isa pang bagay na nakita at nalaman ni Saul, ngunit hindi kailangang ulitin ang “na” sa Filipino.
- source_word: אֲהֵבַתְהוּ
  choice: minamahal siya
  rationale: Ang anyong participle ay nagpapahiwatig ng nagpapatuloy na kalagayan o kilos; mas malinaw itong naipapakita ng “minamahal” kaysa sa simpleng “minahal.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Yehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng pagiging “kasama” ni Yahweh kay David
  choice: kasama ni David si Yahweh
  alternative: pinapanigan ni Yahweh si David
  rationale: Pinananatili ang mas malawak na pananalita ng Hebreo tungkol sa presensiya at pakikisama ng Diyos, nang hindi nililimitahan iyon sa tahasang pagsang-ayon o pagtulong.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “Mical,” ang karaniwang anyong Filipino ng Michal. Pinanatili ang magkatambal na “nakita at nalaman” upang maipakita ang Hebreong pagkakasunod mula sa pagmamasid tungo sa tiyak na pagkilala.
