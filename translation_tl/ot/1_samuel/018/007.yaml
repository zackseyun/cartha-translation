revisions:
- from: At nagsagutan sa pag-awit[a] ang mga babaeng nagdiriwang[b]. Sinabi nila, “Pinabagsak[c] ni Saul ang kanyang libo-libo, at ni David ang kanyang sampu-sampung libo.”
  to: Umawit nang salitan[a] ang mga babaeng nagdiriwang[b]. Sinabi nila, “Nakapatay[c] si Saul ng libu-libo, at si David ng sampu-sampung libo.”
  rationale: Inayos ang pandiwang tumutukoy sa tugunang awit upang maging mas natural at malinaw sa modernong Filipino. Pinalitan ang “pinabagsak” ng “nakapatay” dahil ang konteksto ay isang patulang bilang ng mga napatay sa digmaan; ang mas malawak na “pinabagsak” ay iningatan bilang alternatibo sa talababa. Pinanatili ang maikling dalawang pangungusap at ang estrukturang patula ng mga bilang.
