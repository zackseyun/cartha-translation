  source_fidelity: Ang pangunahing diwa at paralelismong bilang ay naipapahayag, ngunit ang “pinabagsak” ay mas madaling unawaing ginapi kaysa napatay o pinaslang sa talaang militar. Ang “umaawit nang salitan” ay mas tuwirang naghahatid ng tugunang pag-awit ng Hebreo.
  naturalness: Mas likas at malinaw sa modernong Filipino ang “Umawit nang salitan ang mga babaeng nagdiriwang” kaysa “nagsagutan sa pag-awit,” na maaaring magpahiwatig ng pagtatalo o simpleng pagsasagutan sa salita.
  terminology: Pinananatili ang “mga babae,” “nagdiriwang,” at ang patulang paghahambing na “libu-libo” at “sampu-sampung libo.” Ginamit ang “nakapatay ... ng” upang malinaw na maipahiwatig ang militar na halaga ng נכה sa kontekstong ito nang hindi gumagamit ng di-likas na literal na possessive na “kanyang libo-libo.”
  issues:
