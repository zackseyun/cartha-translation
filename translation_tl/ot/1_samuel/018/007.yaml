  yaml_path: translation/ot/1_samuel/018/007.yaml
  text: And the women who were celebrating sang responsively[a], saying, “Saul has struck down his thousands[c][b], and David his tens of thousands.”
translation:
  language: tl
  text: Umawit nang salitan[a] ang mga babaeng nagdiriwang[b]. Sinabi nila, “Nakapatay[c] si Saul ng libu-libo, at si David ng sampu-sampung libo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsagutan”; malamang na tumutukoy rito sa salit-salitan o tugunang pag-awit.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring ipahiwatig ng salitang Hebreo ang masayang paglalaro, pagsasayaw, o pagsasaya.
    reason: lexical_alternative
  - marker: c
    text: O “pinabagsak.” Literal na nangangahulugang “hinampas” ang pandiwang Hebreo, ngunit ginagamit dito sa diwang militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנֶינָה
  choice: nagsagutan sa pag-awit
  rationale: Sa konteksto ng awit at pagdiriwang, ang ענה ay tumutukoy sa pagsagot sa isa’t isa, malamang sa salit-salitang pag-awit. Pinananatili ng salin ang ideya ng pagtutugunan nang hindi labis na tinutukoy ang eksaktong anyo ng pagtatanghal.
- source_word: הַנָּשִׁים
  choice: ang mga babae
  rationale: Tuwirang katumbas ng tahasang pangngalang pambabae sa maramihan.
- source_word: הַמְשַׂחֲקוֹת
  choice: nag­diriwang
  rationale: Ang participle mula sa שׂחק ay maaaring tumukoy sa masayang paglalaro, pagsasayaw, o pagsasaya. Ang “nagdiriwang” ay likas sa makabagong Tagalog at hindi labis na nililimitahan ang kilos.
- source_word: וַתֹּאמַרְןָ
  choice: Sinabi nila
  rationale: Pinananatili ang kasunod na kilos ng pagsasalita at malinaw na ipinakikilala ang siniping awit.
- source_word: הִכָּה
  choice: Pinabagsak
  rationale: Ang נכה ay literal na “humampas” o “sumalakay,” ngunit sa kontekstong militar ay maaaring magpahiwatig ng pagpatay o paggapi. Ang “pinabagsak” ay nagpapanatili ng puwersang militar nang hindi tahasang nilulutas kung pagpatay lamang ang ibig sabihin.
- source_word: באלפו
  choice: ang kanyang libo-libo
  rationale: Ang pariralang may bilang ay isang patulang pagtatala ng tagumpay sa digmaan; pinananatili ang possessive at ang kaibahan sa kasunod na mas malaking bilang.
- source_word: בְּרִבְבֹתָיו
  choice: ang kanyang sampu-sampung libo
  rationale: Ang רְבָבָה ay karaniwang “sampung libo”; ipinahahayag ng maramihang anyo ang “sampu-sampung libo” at pinananatili ang patulang paralelismo.
