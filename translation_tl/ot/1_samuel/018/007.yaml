translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagsagutan sa pag-awit” upang maging natural ang tugunang katangian ng awit, at “pinabagsak” upang mapanatili ang lawak ng pandiwang militar. Ang bilang na “libo-libo” at “sampu-sampung libo” ay nagpapanatili sa patulang paralelismo.
