  terminology: Wasto ang "mga mandirigma" para sa אַנְשֵׁי הַמִּלְחָמָה at "mga lingkod ni Saul" para sa עַבְדֵי שָׁאוּל. Ang "sa paningin" ay angkop na pagpapanatili ng Hebreong idyoma. Nananatiling bukas ang tinutukoy ng "ito," gaya ng ambigwidad ng Hebreo.
