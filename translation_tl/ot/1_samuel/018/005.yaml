  to: Lumalabas si David saanman siya isinusugo ni Saul, at kumikilos siya nang may karunungan.[a] Kaya itinalaga siya ni Saul na mamuno sa mga mandirigma. Naging mabuti ito sa paningin ng buong bayan at ng mga lingkod ni Saul.[b]
