base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/005.yaml
  text: David went out wherever Saul sent him[a], and he acted wisely. So Saul appointed him over the men of war[b], and this was good in the eyes of all the people and also in the eyes of Saul’s servants.
translation:
  language: tl
  text: Lumalabas si David saanman siya isinusugo ni Saul, at kumikilos siya nang may karunungan.[a] Kaya itinalaga siya ni Saul na mamuno sa mga mandirigma. Naging mabuti ito sa paningin ng buong bayan at ng mga lingkod ni Saul.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at nagtagumpay siya” o “at naging matagumpay siya.” Ang Hebreong pandiwa ay maaaring mangahulugan kapwa ng matalinong pagkilos at ng tagumpay na ibinubunga nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Nalugod dito ang buong bayan at ang mga lingkod ni Saul.” Maaaring tumukoy ang Hebreo kay David mismo, sa pagkatalaga sa kanya, o sa buong kalagayang kababanggit lamang.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Pumunta
  rationale: Ipinahihiwatig ng יצא ang paglabas o pagpunta ni David upang gampanan ang mga atas ni Saul. Natural sa makabagong Filipino ang “pumunta” at hindi nito labis na tinutukoy na pawang mga kampanyang militar ang mga iyon.
- source_word: בְּכֹל אֲשֶׁר יִשְׁלָחֶנּוּ שָׁאוּל
  choice: saanman siya suguin ni Saul
  rationale: Naipapahayag nito ang distributibong diwa ng paulit-ulit o iba't ibang misyong ipinagagawa ni Saul, habang nananatiling likas ang ayos sa Filipino.
- source_word: יַשְׂכִּיל
  choice: kumilos siya nang may karunungan
  rationale: Ang Hiphil ng שׂכל ay maaaring tumukoy sa matalino o maingat na pagkilos at sa ibinubunga nitong tagumpay. Pinananatili ng salin ang pangunahing diwa ng mahusay na pagpapasya nang hindi inaalis ang posibilidad ng tagumpay.
- source_word: וַיְשִׂמֵהוּ
  choice: itinalaga siya
  rationale: Sa konstruksiyong may עַל, ang שׂים ay nagpapahiwatig ng opisyal na paglalagay o pagtatalaga sa pamumuno.
- source_word: עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: na mamuno sa mga mandirigma
  rationale: Ang literal na “sa ibabaw ng mga lalaki ng digmaan” ay isang pormula ng pamumuno. Malinaw at marangal sa Filipino ang “mamuno sa mga mandirigma.”
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: Naging mabuti ito sa paningin
  rationale: Pinananatili nito ang Hebreong idyoma at iniiwang bahagyang bukas ang tinutukoy ng panghalip—si David, ang pagkatalaga sa kanya, o ang buong kalagayang isinalaysay.
- source_word: כָל הָעָם
  choice: buong bayan
  rationale: Malawak ang עם at hindi kailangang limitahan sa hukbo; ang “buong bayan” ay likas na kolektibong pahayag sa Filipino.
- source_word: עַבְדֵי שָׁאוּל
  choice: mga lingkod ni Saul
  rationale: Direktang katumbas ito ng עבדים at hindi nito nililimitahan ang saklaw sa mga opisyal o tagapayo lamang.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong idyomang “sa paningin” upang hindi agad lutasin ang malabong tinutukoy ng וַיִּיטַב, habang ang “mga mandirigma” ay mas natural kaysa sa literal na “mga lalaki ng digmaan.”
