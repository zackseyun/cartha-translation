source:
  edition: WLC
  text: וַֽ/יְדַבְּר֞וּ עַבְדֵ֤י שָׁאוּל֙ בְּ/אָזְנֵ֣י דָוִ֔ד אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יֹּ֣אמֶר דָּוִ֗ד הַֽ/נְקַלָּ֤ה בְ/עֵֽינֵי/כֶם֙ הִתְחַתֵּ֣ן בַּ/מֶּ֔לֶךְ וְ/אָנֹכִ֖י אִֽישׁ רָ֥שׁ וְ/נִקְלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/023.yaml
  text: So Saul’s servants spoke these words in David’s hearing[a], and David said, “Does it seem to you a small thing to become the king’s son-in-law, when I am a poor and lightly regarded man?”
translation:
  language: tl
  text: At sinabi ng mga lingkod ni Saul ang mga salitang ito sa pandinig ni David. Sinabi ni David, “Maliit na bagay ba sa paningin ninyo ang maging manugang ng hari[a], gayong ako ay isang dukha at hamak na tao?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang makipagkamag-anak sa hari sa pamamagitan ng pag-aasawa.”
    reason: Ipinakikita ang mas malawak at mas pormal na kahulugan ng Hebreong pandiwa, samantalang ang pangunahing teksto ay gumagamit ng tiyak at natural na ugnayang ipinahihiwatig ng konteksto.
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: sinabi
  rationale: Karaniwang salin ng pandiwang דבר sa salaysay; malinaw na ipinahahayag ng maramihang simuno na ang mga lingkod ni Saul ang nagsalita.
- source_word: בְּאָזְנֵי דָוִד
  choice: sa pandinig ni David
  rationale: Pinananatili ang idyomatikong diwa ng Hebreong tumutukoy sa mga tainga, ngunit ipinapahayag ito sa natural at marangal na Tagalog.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: ang mga salitang ito
  rationale: Tuwirang tumutukoy sa mensaheng ipinapasabi ni Saul sa naunang konteksto nang hindi ito labis na binibigyang-kahulugan.
- source_word: הַנְקַלָּה בְעֵינֵיכֶם
  choice: Maliit na bagay ba sa paningin ninyo
  rationale: Pinananatili ang retorikal na tanong at ang Hebreong larawang 'sa inyong mga mata,' sa paraang nauunawaan sa modernong Tagalog.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: ang maging manugang ng hari
  rationale: Sa konteksto, ang pakikipag-ugnayang pangkasal sa hari ay mangyayari sa pag-aasawa sa anak niyang babae; malinaw at natural na ipinahahayag ito ng 'maging manugang ng hari.'
- source_word: וְאָנֹכִי
  choice: gayong ako ay
  rationale: Ipinapakita ang pagsalungat sa mataas na karangalan ng pagiging manugang ng hari at sa mababang kalagayang ipinahayag ni David, nang hindi ginagawang tahasang sanhi ang simpleng pang-ugnay.
- source_word: רָשׁ
  choice: dukha
  rationale: Tuwirang ipinahahayag ang kahirapan ni David sa marangal at kasalukuyang wikang Filipino.
- source_word: וְנִקְלֶה
  choice: at hamak
  rationale: Ipinahahayag ang pagiging mababa o kakaunti ang pagpapahalaga sa isang tao. Hindi ginamit ang mas matinding 'hinahamak' o 'kinamumuhian,' na maaaring lumampas sa diwa rito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang retorikal na tanong at ang idyomang “sa paningin ninyo.” Ang “dukha at hamak” ay maikli, madaling maunawaan, at hindi nagpapalabis sa mababang kalagayang ipinahayag ni David.
