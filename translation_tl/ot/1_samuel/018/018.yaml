base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/018.yaml
  text: And David said to Saul[a], “Who am I, and what is my life, or my father’s family in Israel, that I should become the king’s son-in-law?”
translation:
  language: tl
  text: Sinabi ni David kay Saul, “Sino ba ako, at ano ba ang buhay ko[a], o ang angkan ng aking ama sa Israel, upang maging manugang ako ng hari?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at sino/ano ang aking buhay?” Maaaring idiin ng Hebreong pahayag ang pagiging hamak ni David o ang kaniyang kalagayan sa buhay; maaari rin itong iugnay sa kaniyang mga kamag-anak o katayuan ng pamilya, gaya ng ipinahihiwatig ng kasunod na parirala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל־שָׁאוּל
  choice: Sinabi ni David kay Saul
  rationale: Likas na salaysay sa modernong Tagalog; ipinahihiwatig na ng pagkakasunod-sunod ng pangyayari ang pasulong na galaw ng Hebreong wayyiqtol.
- source_word: מִי אָנֹכִי
  choice: Sino ba ako
  rationale: Pinananatili ang tuwirang tanong at ang mapagpakumbabang himig; likas sa Tagalog ang “ba” sa ganitong retorikal na tanong.
- source_word: וּמִי חַיַּי
  choice: at ano ba ang buhay ko[a]
  rationale: Malapit sa anyo ng Hebreo at hindi agad nilulutas ang tunay na kalabuan ng pahayag, na maaaring tumukoy sa pagiging hamak ni David, sa kalagayan niya sa buhay, o sa kaniyang mga kamag-anak.
- source_word: מִשְׁפַּחַת אָבִי
  choice: ang angkan ng aking ama
  rationale: Ang “angkan” ay malinaw at likas na katumbas ng pangkat ng pamilya o clan, at pinananatili ang panig ng ama.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Pinananatili ang kalagayang panlipunan ng pamilya ni David sa loob ng Israel.
- source_word: כִּי אֶהְיֶה
  choice: upang maging
  rationale: Ipinapahayag ang bunga o inaasahang posibilidad na kasunod ng mga retorikal na tanong.
- source_word: חָתָן לַמֶּלֶךְ
  choice: maging manugang ako ng hari
  rationale: Sa konteksto, tumutukoy ito sa lalaking mapapangasawa ng anak na babae ng hari; “manugang ng hari” ang natural na katawagan sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili sa pangunahing teksto ang di-pangkaraniwang pariralang “ano ba ang buhay ko” upang huwag tahimik na lutasin ang kalabuan ng Hebreo; ipinaliwanag ang mga pangunahing posibilidad sa talababa.
