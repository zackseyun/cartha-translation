    issue: Ang “upang maging asawa nito” ay nagbibigay ng bahagyang layuning himig at gumagamit ng panghalip na “nito.”
    rationale: Ang לְאִשָּׁה ay pinakamahusay na maisalin dito bilang katayuang “bilang asawa” (“as a wife”), hindi bilang malinaw na layuning “upang maging.” Pinananatili rin ng rebisyon ang maigsi at pasibong pokus ng Hebreo.
  revised_text: Ngunit nang dumating ang panahon upang ibigay kay David si Merab, anak ni Saul, ibinigay siya kay Adriel na taga-Mehola bilang asawa.
