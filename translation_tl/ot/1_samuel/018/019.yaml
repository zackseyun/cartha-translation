- from: Ngunit nang dumating ang panahon na ibibigay kay David si Merab, na anak ni Saul, ibinigay siya kay Adriel na taga-Mehola upang maging asawa nito.
  to: Ngunit nang dumating ang panahon upang ibigay kay David si Merab, anak ni Saul, ibinigay siya kay Adriel na taga-Mehola bilang asawa.
  rationale: Pinalitan ang “upang maging asawa nito” ng “bilang asawa” upang mas malapit na maipahayag ang לְאִשָּׁה bilang paglalarawan sa pagbibigay kay Merab kay Adriel sa pag-aasawa, nang hindi nagdaragdag ng purposive na diin. Pinanatili ang lahat ng iba pang kahulugan at ang modernong marangal na rehistro.
