base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/019.yaml
  text: But when the time came to give Merab[a], Saul’s daughter, to David, she was given to Adriel the Meholathite as a wife.
translation:
  language: tl
  text: Ngunit nang dumating ang panahon upang ibigay kay David si Merab, anak ni Saul, ibinigay siya kay Adriel na taga-Mehola bilang asawa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Ngunit nang dumating ang panahon
  rationale: Ipinahahayag ng parirala ang paglipat sa sumunod na pangyayari at ang pagsalungat nito sa inaasahang pagpapakasal ni Merab kay David. Natural sa modernong Tagalog ang ganitong temporal na pahayag.
- source_word: תֵּת
  choice: na ibibigay
  rationale: Ang infinitive construct ng נתן sa temporal na parirala ay tumutukoy sa nakatakdang pagbibigay kay Merab bilang asawa.
- source_word: אֶת מֵרַב בַּת שָׁאוּל
  choice: si Merab, na anak ni Saul
  rationale: Pinananatili ang appositional na pagkakakilanlan sa malinaw at likas na ayos sa Tagalog.
- source_word: לְדָוִד
  choice: kay David
  rationale: Ang pang-ukol ay tumutukoy sa inilaan na tatanggap sa konteksto ng kasunduan sa pag-aasawa.
- source_word: וְהִיא נִתְּנָה
  choice: ibinigay siya
  rationale: Pinananatili ng pandiwang balintiyak ang diin ng Hebreo sa di-inaasahang nangyari kay Merab.
- source_word: לְעַדְרִיאֵל
  choice: kay Adriel
  rationale: Karaniwang transliterasyon ng pangalang pantangi, na may panandang Tagalog para sa tao.
- source_word: הַמְּחֹלָתִי
  choice: na taga-Mehola
  rationale: Ang gentilic ay natural na isinasalin sa Tagalog bilang pinagmulan o ugnayan sa isang lugar.
- source_word: לְאִשָּׁה
  choice: upang maging asawa nito
  rationale: Malinaw at natural na salin ng karaniwang idyomang Hebreo para sa pagbibigay ng isang babae sa pag-aasawa; tinutukoy ng “nito” si Adriel.
