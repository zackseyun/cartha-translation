id: 1SA.18.10
reference: 1 Samuel 18:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/תִּצְלַ֣ח רוּחַ֩ אֱלֹהִ֨ים רָעָ֤ה אֶל שָׁאוּל֙ וַ/יִּתְנַבֵּ֣א בְ/תוֹךְ הַ/בַּ֔יִת וְ/דָוִ֛ד מְנַגֵּ֥ן בְּ/יָד֖/וֹ כְּ/י֣וֹם בְּ/י֑וֹם וְ/הַ/חֲנִ֖ית בְּ/יַד שָׁאֽוּל׀׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/010.yaml
  text: And it happened on the next day that an evil spirit from God rushed upon Saul[a], and he prophesied within the house while David was playing with his hand, as day by day[d][c][b]; and the spear was in Saul’s hand.
translation:
  language: tl
  text: Kinabukasan, sumaklob kay Saul ang isang masamang espiritu mula sa Diyos[a], at nagpropesiya siya sa loob ng bahay[b]. Samantala, tumutugtog si David gamit ang kanyang kamay[c], gaya ng ginagawa niya araw-araw[d], at hawak ni Saul ang sibat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang mapaminsalang espiritu mula sa Diyos.” Sa literal, “isang masamang espiritu ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain na “nag-asal siyang parang propetang wala sa sarili.” Ang pandiwa ay maaaring tumukoy sa masidhing pag-aasal na kaugnay ng pagpopropesiya; sa kontekstong ito, maaaring magpahiwatig ito ng magulo at di-mapigil na pagkilos.
    reason: alternative_reading
  - marker: c
    text: Hindi pinangalanan sa talatang ito ang instrumentong tinutugtog, bagaman tinutukoy ito sa kalapit na konteksto.
    reason: cross_reference
  - marker: d
    text: Sa literal, “gaya ng araw sa araw,” isang idyomang nangangahulugang palagian o araw-araw.
    reason: source_idiom
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Kinabukasan
  rationale: Likas at maikli itong panandang temporal sa Tagalog para sa araw na kasunod ng naunang pangyayari.
- source_word: וַתִּצְלַח
  choice: biglang sumaklob
  rationale: Ipinahihiwatig ng pandiwa ang malakas at dagliang pagdating o pananahan ng espiritu kay Saul. Naipapahayag ng “biglang sumaklob” ang puwersa ng kilos nang hindi nagdaragdag ng paliwanag.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: isang masamang espiritu mula sa Diyos
  rationale: Pinananatili ng “masamang espiritu” ang karaniwang kahulugan ng רָעָה, samantalang inilalahad ng “mula sa Diyos” ang pinagmulan o pagkakasugo na ipinahihiwatig ng pariralang Hebreo.
- source_word: וַיִּתְנַבֵּא
  choice: nagpropesiya siya
  rationale: Ito ang tuwirang katumbas ng pandiwang Hebreo at pinananatili ang sadyang tensiyon ng salaysay. Inilalagay sa talababa ang posibilidad na tumutukoy ito sa masidhing pag-aasal na parang nasa prophetic frenzy.
- source_word: בְּתוֹךְ הַבַּיִת
  choice: sa loob ng bahay
  rationale: Tuwiran, natural, at tumpak na lokatibong parirala sa modernong Tagalog.
- source_word: מְנַגֵּן בְּיָדוֹ
  choice: tumutugtog si David gamit ang kanyang kamay
  rationale: Ipinapahayag nito kapwa ang pagtugtog at ang tahasang binanggit na paggamit ng kamay, nang hindi pinapangalanan ang instrumentong wala sa talatang ito.
- source_word: כְּיוֹם בְּיוֹם
  choice: gaya ng ginagawa niya araw-araw
  rationale: Natural nitong ipinapahayag sa Tagalog ang Hebreong idyoma ng paulit-ulit at nakaugaliang gawain.
- source_word: הַחֲנִית
  choice: sibat
  rationale: Ito ang karaniwan at tumpak na katawagan sa sandatang tinutukoy.
- source_word: בְּיַד שָׁאוּל
  choice: hawak ni Saul
  rationale: Natural na Tagalog ito para sa literal na “nasa kamay ni Saul” at pinananatili ang nagbabantang detalye bago ang susunod na pangyayari.
theological_decisions:
- issue: Ang kaugnayan ng masamang espiritu sa Diyos sa pariralang רוּחַ אֱלֹהִים רָעָה
  choice: isang masamang espiritu mula sa Diyos
  alternative: isang mapaminsalang espiritu mula sa Diyos; isang masamang espiritu ng Diyos
  rationale: Pinananatili ng salin ang tahasang pag-uugnay ng teksto sa Diyos at ang teolohikal na tensiyon nito, ngunit hindi nito ipinahihiwatig na masama ang Diyos mismo. Ang “mapaminsala” ay maaari ring kahulugan ng רָעָה, kaya binabanggit ito sa talababa.
- issue: Kung ang וַיִּתְנַבֵּא ay tunay na panghuhula o masidhing pag-aasal
  choice: nagpropesiya siya
  alternative: nagwala siya; nalugmok siya sa matinding prophetic frenzy
  rationale: Ang pangunahing salin ay nananatiling malapit sa anyo ng pandiwang Hebreo at hindi agad nagpapasya sa uri o pagiging tunay ng kilos. Ipinapaliwanag sa talababa na sa kontekstong ito maaari itong tumukoy sa wala-sa-sarili o magulong pag-aasal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal ang ginamit. Iniwasan ang labis na literal na ayos na magiging asiwa, ngunit pinanatili ang mahahalagang detalye, kabilang ang kamay ni David, ang hindi pinangalanang instrumento, ang sibat ni Saul, at ang mga teolohikal at leksikal na kalabuan.
