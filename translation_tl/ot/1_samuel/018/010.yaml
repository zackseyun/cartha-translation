  source_fidelity: 'Ang salin ay tapat sa pangunahing nilalaman ng Hebreo: ang espiritu ay iniuugnay sa Diyos, si Saul ay nagpropesiya/nasa kalagayang makahula sa loob ng bahay, si David ay tumutugtog gamit ang kaniyang kamay bilang nakagawian, at nasa kamay ni Saul ang sibat. Gayunman, ang “biglang” ay nagdaragdag ng aspektong temporal na hindi tahasang nasa וַתִּצְלַח. Ang puwersa ng pandiwa ay sapat nang maipahayag sa “sumaklob.”'
  naturalness: Natural at marangal ang kabuuang Tagalog. Mas maayos ang ayos na “sumaklob kay Saul ang...” kaysa “biglang sumaklob kay Saul ang...,” dahil inaalis nito ang di-kailangang dagdag at nananatiling dumadaloy ang pangungusap. Ang “tumutugtog si David gamit ang kaniyang kamay” ay katanggap-tanggap at sadyang pinananatili ang detalyeng nasa Hebreo.
  terminology: Ang “masamang espiritu mula sa Diyos,” “nagpropesiya,” at “sibat” ay angkop. Ang talababa tungkol sa “mapaminsalang espiritu” at sa posibleng ecstatic na kahulugan ng nagpropesiya ay maingat at hindi ipinipilit ang isang doktrinal o interpretatibong pagbasa.
