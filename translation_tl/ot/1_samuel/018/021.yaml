  to: Sinabi ni Saul, “Ibibigay ko siya kay David upang maging bitag siya para sa kanya at upang kumilos laban sa kanya ang kamay ng mga Filisteo.” Kaya sinabi ni Saul kay David, “Sa pamamagitan ng ikalawa[a], maaari kang maging manugang ko ngayon.”
