base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/021.yaml
  text: Then Saul said[a], “I will give her to him, so that she may become a snare to him and the hand of the Philistines may be against him.” So Saul said to David, “By the second one you may become my son-in-law today.”
translation:
  language: tl
  text: Sinabi ni Saul, “Ibibigay ko siya kay David upang maging bitag siya para sa kanya at upang kumilos laban sa kanya ang kamay ng mga Filisteo.” Kaya sinabi ni Saul kay David, “Sa pamamagitan ng ikalawa[a], maaari kang maging manugang ko ngayon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa ikalawang pagkakataon, maaari kang maging manugang ko ngayon.” Hindi ganap ang pariralang Hebreo at maaaring tumukoy sa ikalawang anak na babae ni Saul o sa ikalawang pagkakataon ni David na mapabilang sa pamilya ni Saul sa pamamagitan ng pag-aasawa.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְּנֶנָּה לּוֹ
  choice: Ibibigay ko siya kay David
  rationale: Sa konteksto, ang pambabaeng layon ay si Mical at ang panghalip na panlalaki ay tumutukoy kay David. Ginawang tahasan ang pangalan upang maging natural at malinaw sa Tagalog nang hindi idinaragdag ang 'bilang asawa,' na ipinauunawa na ng konteksto.
- source_word: וּתְהִי לוֹ לְמוֹקֵשׁ
  choice: upang maging bitag siya sa kanya
  rationale: Pinananatili ng 'bitag' ang talinghaga ng מוֹקֵשׁ, at ipinahahayag ng 'upang' ang layunin ni Saul na malinaw sa konteksto.
- source_word: וּתְהִי בוֹ יַד פְּלִשְׁתִּים
  choice: at upang ang kamay ng mga Filisteo ay maging laban sa kanya
  rationale: Pinananatili ang Hebreong larawan ng 'kamay' bilang kapangyarihan o mapaminsalang pagkilos, habang nililinaw ng 'maging laban sa kanya' ang masamang hangarin.
- source_word: בִּשְׁתַּיִם
  choice: Sa pamamagitan ng pangalawa
  rationale: Ang parirala ay eliptikal. Malamang na tumutukoy ito sa ikalawang anak na babae ni Saul at may instrumentong diwa, ngunit hindi tahasang binabanggit sa Hebreo ang 'anak na babae,' kaya pinanatili ang pagkakabitin at nilagyan ng talababa.
- source_word: תִּתְחַתֵּן בִּי
  choice: maaari kang maging manugang ko
  rationale: Ito ang natural at tiyak na Tagalog para sa pagpasok sa ugnayang pampamilya sa pamamagitan ng pag-aasawa kay Saul; ang konteksto ay tungkol sa pagiging manugang na lalaki.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Natural na ipinahahayag ng 'ngayon' ang agarang puwersa ng הַיּוֹם sa direktang pananalita.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Sinabi ni Saul ... Kaya sinabi ni Saul
  rationale: Pinananatili ang dalawang magkahiwalay na pahayag—ang unang sinabi ni Saul tungkol sa kanyang balak at ang ikalawang sinabi niya kay David—habang natural ang daloy sa Tagalog.
