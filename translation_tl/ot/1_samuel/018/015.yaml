  text: When Saul saw that he was very successful[b][a], he was afraid of him.
translation:
  language: tl
  text: Nang makita ni Saul na lubhang nagtatagumpay[a] si David, natakot siya sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kumikilos nang napakatalino” o “lubhang umuunlad.” Ang pandiwang Hebreo ay maaaring tumukoy sa maingat at matalinong pagkilos at sa tagumpay na ibinubunga nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita ni Saul
  rationale: Ipinahahayag ng waw-consecutive ang pagsulong ng salaysay, at ang “Nang” ay likas na nag-uugnay sa nakita ni Saul at sa naging bunga nitong takot.
- source_word: אֲשֶׁר הוּא
  choice: na … si David
  rationale: Ipinakikilala nito ang nilalaman ng napansin ni Saul. Ginamit ang pangalang David sa halip na sunod-sunod na panghalip upang maging malinaw sa natural na Tagalog ang tinutukoy.
- source_word: מַשְׂכִּיל
  choice: nagtatagumpay
  rationale: Ang Hiphil participle ng שׂכל ay maaaring tumukoy sa matalinong pagkilos o sa tagumpay na bunga nito. Sa kontekstong ito, ang nakikitang tagumpay ni David ang malinaw na sanhi ng pangamba ni Saul, habang pinananatili sa talababa ang leksikal na lawak.
- source_word: מְאֹד
  choice: lubhang
  rationale: Ang “lubhang” ay isang malinaw at marangal na modernong panumbas sa matinding pagpapalakas na ipinahahayag ng מְאֹד.
- source_word: וַיָּגָר
  choice: natakot
  rationale: Sa kontekstong ito, ang pandiwa ay nagpapahayag ng takot o pangamba. Ang “natakot” ay natural sa Tagalog at hindi nagdaragdag ng di-tiyak na ideya ng tagal.
- source_word: מִפָּנָיו
  choice: siya rito
  rationale: Ang literal na “mula sa harap niya” ay idyomang Hebreo para sa pagkatakot sa isang tao. Ang “natakot siya rito” ay malinaw at natural, at ang “rito” ay tumutukoy kay David.
theological_decisions:
- issue: Saklaw ng kahulugan ng מַשְׂכִּיל
  choice: nagtatagumpay, na may talababa tungkol sa matalinong pagkilos
  alternative: kumikilos nang napakatalino
  rationale: Hindi tiyak kung ang diin ay nasa maingat at matalinong asal o sa tagumpay na ibinunga nito. Pinili sa pangunahing teksto ang tagumpay dahil iyon ang nakikitang kalagayan sa salaysay, ngunit hindi inalis ang tunay na leksikal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang sobrang literal na idyomang “mula sa harap niya,” ngunit pinanatili ang leksikal na kalabuan ng מַשְׂכִּיל sa pamamagitan ng talababa.
