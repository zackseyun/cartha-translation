base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/022.yaml
  text: So Saul commanded his servants[a], “Speak to David privately, saying, ‘Look, the king delights in you, and all his servants love you[b]. So now become the king’s son-in-law.’”
translation:
  language: tl
  text: Kaya inutusan ni Saul ang kanyang mga lingkod, “Kausapin ninyo nang palihim[a] si David at sabihin, ‘Tingnan mo, nalulugod sa iyo ang hari, at minamahal ka ng lahat ng kanyang mga lingkod. Kaya ngayon, maging manugang ka ng hari[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang tahimik” o “nang sarilinan.”
    reason: lexical_alternative
  - marker: b
    text: O, “makipag-ugnayan sa hari sa pamamagitan ng pag-aasawa,” o “makipag-alyansa sa hari sa pamamagitan ng pag-aasawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: inutusan
  rationale: Karaniwang ipinahahayag ng צוה ang pagbibigay ng utos; natural at sapat ang lakas ng “inutusan” sa konteksto.
- source_word: עֲבָדוֹ
  choice: kanyang mga lingkod
  rationale: Maaaring tumukoy ang עבד sa mga lingkod, tagapaglingkod, o opisyal ng palasyo. Hindi labis na tinutukoy ng “mga lingkod” ang kanilang ranggo at angkop ito sa tagpong maharlika.
- source_word: דַּבְּרוּ אֶל־דָּוִד
  choice: Kausapin ninyo ... si David
  rationale: Tuwirang ipinapahayag ng pautos na anyo ang ipinagagawa ni Saul at natural ang “kausapin” kapag isang pribadong pakikipag-usap ang tinutukoy.
- source_word: בַּלָּט
  choice: nang palihim
  rationale: Ipinahihiwatig ng salita ang pagsasalitang hindi hayag o lingid sa iba. Ang “nang palihim” ang malinaw at natural na katumbas, habang nananatiling posible ang “nang tahimik” o “nang sarilinan.”
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pantawag-pansin ang הִנֵּה. Pinananatili ng “Tingnan mo” ang retorikal na diin sa makabagong Filipino.
- source_word: חָפֵץ בְּךָ
  choice: nalulugod sa iyo
  rationale: Ang חפץ na may בְּ ay nagpapahayag ng pagkagiliw o pagkalugod sa isang tao. Iniiwasan ng “nalulugod sa iyo” ang posibleng romantikong pahiwatig ng “ninanais ka.”
- source_word: אֲהֵבוּךָ
  choice: minamahal ka
  rationale: Tuwirang katumbas ito ng אהב at napapanatili ang malakas na pahayag ng pagkagiliw o pagsang-ayon ng mga lingkod kay David.
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinapakita ng parirala ang paglipat mula sa sinasabing pagkalugod ng hari tungo sa hinihikayat na hakbang; naipapahayag ng “Kaya ngayon” ang ugnayang ito.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: maging manugang ka ng hari
  rationale: Ang hitpael ng חתן ay tumutukoy sa pagpasok sa ugnayang pampamilya sa pamamagitan ng pag-aasawa. Sa konteksto, si David ay hinihikayat na maging manugang na lalaki ng hari; idiomatiko at malinaw ang salin nang hindi dinaragdagan ang pangalan ng mapapangasawa.
