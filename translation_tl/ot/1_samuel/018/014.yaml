  text: וַ/יְהִ֥י דָוִ֛ד לְ/כָל דָּרְכָ֖/ו מַשְׂכִּ֑יל וַֽ/יהוָ֖ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/014.yaml
  text: And David was acting wisely in all his ways[a], and Yahweh was with him.
translation:
  language: tl
  text: At kumilos nang may karunungan si David sa lahat ng kanyang ginagawa[a], at kasama niya si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naging matagumpay” o “umunlad”; ang salitang Hebreo ay maaaring tumukoy sa matalinong pagkilos na humahantong sa tagumpay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דָוִד
  choice: At ... si David
  rationale: Ipinakikilala ng וַיְהִי ang patuloy na huwaran ng pagkilos ni David; natural sa Filipino na ipahayag ito sa pandiwang sugnay.
- source_word: לְכָל דָּרְכָו
  choice: sa lahat ng kanyang ginagawa
  rationale: Ang דֶּרֶךְ ay literal na 'daan' ngunit dito ay tumutukoy sa kilos o mga gawain; mas natural sa modernong Filipino ang 'sa lahat ng kanyang ginagawa.'
- source_word: מַשְׂכִּיל
  choice: kumilos nang may karunungan
  rationale: Ang Hiphil participle ng שכל ay maaaring tumukoy sa matalinong pagkilos at sa tagumpay na bunga nito. Pinananatili ng salin ang pangunahing diwa ng maingat at matalinong pagkilos.
- source_word: וַיהוָה
  choice: at ... si Yahweh
  rationale: Isinalin ang banal na pangalang יְהוָה bilang 'Yahweh' upang panatilihin itong personal na pangalan sa teksto.
- source_word: עִמּוֹ
  choice: kasama niya
  rationale: Tuwirang ipinahahayag ang presensya at pagsuporta ni Yahweh kay David sa natural na Filipino.
theological_decisions:
- issue: Paglalarawan sa ugnayan ng karunungan at tagumpay sa מַשְׂכִּיל
  choice: kumilos nang may karunungan
  alternative: naging matagumpay
  rationale: Hindi nililimita ang salita sa kinalabasan lamang; pinananatili ang posibleng diwa ng matalinong pagkilos habang inilalagay sa talababa ang kahulugang tagumpay o pag-unlad.
- issue: Pagbibigay ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang banal na pangalan na tahasang nasa tekstong Hebreo at iniiwasang palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang 'kumilos nang may karunungan' upang mapanatili ang leksikal na tensiyon sa pagitan ng mahusay na pagkilos at matagumpay na bunga.
