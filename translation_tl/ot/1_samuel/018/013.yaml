  text: So Saul removed him from his presence and appointed him commander of a thousand[a], and he went out and came in before the people.
translation:
  language: tl
  text: Kaya inilayo siya ni Saul mula sa piling niya at itinalaga siyang kumandante ng isang libo, at siya'y lumalabas at pumapasok sa harap ng bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay literal na “lumalabas at pumapasok,” isang idyoma para sa pagsasagawa ng mga gawaing pampubliko o pangmilitar, at maaari ring magpahiwatig ng pangunguna sa bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסִרֵהוּ
  choice: inilayo siya
  rationale: Ang causative na anyo ng סוּר ay nangangahulugang alisin o ilayo. Pinananatili ng “inilayo siya” ang kongkretong kilos nang hindi ipinapalagay na lubusan siyang pinaalis sa tungkulin.
- source_word: מֵעִמּוֹ
  choice: sa piling niya
  rationale: Ang literal na diwang “mula sa kasama niya” ay likas na naipapahayag sa Tagalog bilang “sa piling niya,” na angkop sa personal at maharlikang kapaligiran.
- source_word: וַיְשִׂמֵהוּ לוֹ
  choice: hinirang
  rationale: Sa kontekstong ito, ang שׂוּם na may indirect object ay tumutukoy sa pagtatalaga sa isang katungkulan; malinaw at likas ang “hinirang.”
- source_word: שַׂר אָלֶף
  choice: kumandante ng isang libo
  rationale: Ang שַׂר ay isang pinuno o kumandante, at pinananatili ng parirala ang militar-administratibong yunit na binubuo ng isang libo.
- source_word: וַיֵּצֵא וַיָּבֹא
  choice: Lumalabas at pumapasok
  rationale: Pinananatili ang Hebreong idyoma at ang posibleng saklaw nito—pampubliko o pangmilitar na pagkilos at pamumuno—sa halip na paliitin ang kahulugan sa isang interpretasyon.
- source_word: לִפְנֵי הָעָם
  choice: sa harap ng bayan
  rationale: Tuwirang pinananatili ang larawan ng pagiging nasa harap ng bayan, na maaaring tumukoy sa nakikitang pagkilos o sa pangunguna.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “kumandante” bilang karaniwang terminong militar, at pinanatili sa pangunahing teksto ang Hebreong idyoma upang hindi alisin ang tunay na kalabuan nito.
