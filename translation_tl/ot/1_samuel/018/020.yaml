translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang payak na salaysay at ang di-tiyak na “nila,” habang isinalin nang natural sa pangunahing teksto ang idyomang Hebreo at inilagay sa talababa ang mas literal na anyo.
