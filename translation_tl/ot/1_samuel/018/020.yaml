  yaml_path: translation/ot/1_samuel/018/020.yaml
  text: Michal[a], Saul's daughter, loved David, and they told Saul, and the matter pleased him.
translation:
  language: tl
  text: Minahal ni Mical, na anak na babae ni Saul, si David. Ipinaalam nila ito kay Saul. Nakalugod kay Saul ang bagay na iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang bagay ay naging kalugod-lugod sa kanyang paningin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּאֱהַב
  choice: Inibig
  rationale: Tuwirang ipinapahayag ng pandiwang אהב ang pag-ibig. Hindi ginamit ang “umibig” o “nahulog ang loob” upang hindi magdagdag ng pasimulang diwa na hindi tahasang nasa anyong Hebreo.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: ni Mical na anak ni Saul
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Tagalog at natural na pagkakakilanlan ng ugnayang pampamilya.
- source_word: אֶת דָּוִד
  choice: si David
  rationale: Hindi isinalin ang panandang tuwirang layon na אֶת; ipinakita ang layon sa pamamagitan ng karaniwang panandang “si” sa Tagalog.
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: at sinabi nila ito kay Saul
  rationale: Pinananatili ang di-tiyak na pangmaramihang simuno ng Hebreo sa “nila”; ang “ito” ay tumutukoy sa naunang balita tungkol sa pag-ibig ni Mical kay David.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינָיו
  choice: Ikinalugod ni Saul ang bagay na iyon
  rationale: Natural na Tagalog ito para sa idyomang Hebreo na nagsasabing ang bagay ay naging tama o kalugod-lugod sa kanyang paningin. Inulit ang “Saul” upang maiwasan ang kalabuan ng panghalip.
