revisions:
- from: Inibig ni Mical na anak ni Saul si David, at sinabi nila ito kay Saul. Ikinalugod ni Saul ang bagay na iyon.[a]
  to: Minahal ni Mical, na anak na babae ni Saul, si David. Ipinaalam nila ito kay Saul. Nakalugod kay Saul ang bagay na iyon.[a]
  rationale: Nilinaw ang kasarian ni Mical ayon sa Hebreong בַּת, inayos ang bantas ng pagpapakilala sa kanya, at ginawang mas malapit sa pokus ng Hebreo ang huling pangungusap. Pinanatili ang di-tiyak na pangmaramihang simuno sa “ipinaalam nila” at ang literal na idyoma sa talababa.
