lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: sinabi
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam o sabihin. Likas sa modernong Tagalog ang “sinabi” sa kontekstong inuulat ang mensahe kay David.
- source_word: עֲבָדָיו
  choice: mga lingkod niya
  rationale: Tumutukoy ito sa mga lingkod o tauhan ni Saul sa maharlikang hukuman; pinananatili ng “mga lingkod” ang tuwirang kahulugan nang hindi ipinahihiwatig na sila ay mga alipin.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: mga salitang ito
  rationale: Maaaring tumukoy ang דְּבָרִים sa mga salita o mga bagay, ngunit dito ay pasalitang ipinabatid ng mga lingkod ang mensahe ni Saul.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינֵי דָוִד
  choice: Naging mabuti sa paningin ni David
  rationale: Pinananatili nito ang Hebreong idyomang “maging matuwid/mabuti sa mga mata” habang malinaw na nagpapahiwatig na katanggap-tanggap o kalugod-lugod kay David ang usapin.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: maging manugang ng hari
  rationale: Ang Hitpael ng חתן ay tumutukoy sa pagpasok sa ugnayang pampamilya sa pamamagitan ng pag-aasawa. Sa konteksto, si David ay magiging manugang ni Saul.
- source_word: וְלֹא מָלְאוּ הַיָּמִים
  choice: at hindi pa natatapos ang itinakdang panahon
  rationale: Ang literal na “hindi pa napupuno/natutupad ang mga araw” ay isang pahayag tungkol sa hindi pa pagtatapos ng nakalaang panahon; ang saling ito ay natural sa Tagalog at pinananatili ang temporal na diwa.
