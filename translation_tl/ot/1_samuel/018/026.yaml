revisions:
- from: Kaya sinabi ng mga lingkod niya kay David ang mga salitang ito. Naging mabuti sa paningin ni David[a] ang maging manugang ng hari,[b] at hindi pa natatapos ang itinakdang panahon.[c]
  to: Kaya sinabi ng mga lingkod niya kay David ang mga salitang ito. Nakalugod kay David na maging manugang ng hari,[a] at hindi pa natatapos ang itinakdang panahon.[b]
  rationale: Inayos ang pangunahing pangungusap upang malinaw na si David ang nakalugod sa posibilidad na maging manugang ng hari, habang nananatiling nasa talababa ang mas literal na Hebreong idyoma. Inayos din ang mga marker ng talababa upang eksaktong tumugma sa mga pariralang kanilang nililinaw.
