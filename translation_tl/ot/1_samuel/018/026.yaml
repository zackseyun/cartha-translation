  text: So his servants told David these words[a], and the matter seemed right in David’s eyes, to become the king’s son-in-law[c][b]; and the days had not yet been fulfilled.
translation:
  language: tl
  text: Kaya sinabi ng mga lingkod niya kay David ang mga salitang ito. Nakalugod kay David na maging manugang ng hari,[a] at hindi pa natatapos ang itinakdang panahon.[b]
