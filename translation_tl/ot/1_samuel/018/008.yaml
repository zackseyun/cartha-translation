source:
  edition: WLC
  text: וַ/יִּ֨חַר לְ/שָׁא֜וּל מְאֹ֗ד וַ/יֵּ֤רַע בְּ/עֵינָי/ו֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה וַ/יֹּ֗אמֶר נָתְנ֤וּ לְ/דָוִד֙ רְבָב֔וֹת וְ/לִ֥/י נָתְנ֖וּ הָ/אֲלָפִ֑ים וְ/ע֥וֹד ל֖/וֹ אַ֥ךְ הַ/מְּלוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/008.yaml
  text: Then Saul became very angry[a], and this matter displeased him. He said, “They have given David ten thousands, but to me they have given the thousands[b]; what more can he have but the kingdom?”
translation:
  language: tl
  text: Labis na nagalit si Saul, at hindi niya nagustuhan ang pananalitang iyon. Sinabi niya, “Sampu-sampung libo ang ibinigay nila kay David, ngunit libu-libo lamang ang ibinigay nila sa akin.[a] Ano pa ang natitira para sa kanya kundi ang paghahari?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sampu-sampung libo ang iniukol nila kay David, ngunit libu-libo lamang ang iniukol nila sa akin.” Sa awit, ang “ibinigay” ay tumutukoy sa pagkilalang iniukol sa kanilang mga tagumpay.
    reason: lexical_alternative
  - marker: b
    text: 'Siksik ang Hebreo: “at para sa kanya ay ang paghahari na lamang.” Maaari ring isalin ang huling salita na “kaharian.”'
    reason: source_clarity
lexical_decisions:
- source_word: וַיִּחַר ... מְאֹד
  choice: Labis na nagalit
  rationale: Ang pandiwa ay literal na naglalarawan ng pagningas ng galit, at pinatindi ito ng מְאֹד. Likas at malinaw sa makabagong Tagalog ang “labis na nagalit.”
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: hindi niya nagustuhan
  rationale: Idyomang Hebreo itong literal na “naging masama sa kanyang mga mata.” Ipinahahayag dito ang matinding di-pagsang-ayon ni Saul; ang salin ay natural nang hindi nagpapasok ng moral na paghatol na maaaring hindi tuwirang nilalayon.
- source_word: הַדָּבָר הַזֶּה
  choice: ang pananalitang iyon
  rationale: Maaaring mangahulugan ang דָּבָר ng salita, bagay, o usapin. Sa konteksto, tumutukoy ito sa awit o pahayag ng mga babae, kaya ang “pananalita” ay tiyak ngunit hindi labis na mapagpaliwanag.
- source_word: נָתְנוּ
  choice: ibinigay nila
  rationale: Pinananatili nito ang karaniwang kahulugan ng pandiwang “magbigay.” Sa konteksto ng awit, ang diwa ay pag-uukol o pagkilala sa bilang ng mga tagumpay, na nililinaw sa talababa.
- source_word: רְבָבוֹת
  choice: sampu-sampung libo
  rationale: Ang pangmaramihang anyo ay tumutukoy sa mga yunit ng sampung libo. Likas sa Tagalog ang “sampu-sampung libo” at napapanatili ang paghahambing sa “libu-libo.”
- source_word: הָאֲלָפִים
  choice: libu-libo
  rationale: Inihahatid nito ang pangmaramihang bilang at ang malinaw na retorikal na pagkakaiba sa sampu-sampung libo, kahit hindi natural na ulitin sa Tagalog ang tiyak na pantukoy ng Hebreo.
- source_word: וְעוֹד לוֹ אַךְ הַמְּלוּכָה
  choice: Ano pa ang natitira para sa kanya kundi ang paghahari?
  rationale: Siksik at eliptikal ang Hebreo, literal na humigit-kumulang “at para sa kanya ay ang paghahari na lamang.” Ginawang retorikal na tanong upang malinaw at natural na maipahayag ang takot ni Saul, habang itinatala sa talababa ang mas pormal na anyo.
- source_word: הַמְּלוּכָה
  choice: ang paghahari
  rationale: Maaaring tukuyin ng salita ang pagiging hari, kapangyarihang maharlika, o kaharian. Sa konteksto, kinatatakutan ni Saul na mapasakamay ni David ang pamumuno; mas eksakto rito ang “paghahari” kaysa teritoryal na “kaharian.”
theological_decisions:
- issue: Kung ang הַמְּלוּכָה ay tumutukoy sa teritoryong kaharian o sa katayuan at kapangyarihan ng hari
  choice: ang paghahari
  alternative: ang kaharian
  rationale: Ang agarang pangamba ni Saul ay ang pag-akyat ni David sa pagiging hari. Pinipili ng “paghahari” ang institusyon o katayuan ng pamumuno ngunit itinatala ang lehitimong alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyo at natural na ayos ng pangungusap, habang pinananatili sa talababa ang literal na puwersa at mga lehitimong alternatibo ng Hebreo.
