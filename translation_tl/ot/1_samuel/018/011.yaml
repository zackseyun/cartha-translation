  yaml_path: translation/ot/1_samuel/018/011.yaml
  text: Saul hurled the spear and said, “I will pin David to the wall.” But David dodged away from him twice.
translation:
  language: tl
  text: Inihagis ni Saul ang sibat at sinabi, “Itutuhog ko si David sa pader.”[a] Ngunit dalawang beses na nakaiwas si David kay Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na ayos ng Hebreo: “Sasaktan ko si David at ang pader.” Di-karaniwan ang pagkakabuo nito; sa konteksto ng sibat, malamang na tumutukoy ito sa pagtuhog kay David sa pader.'
    reason: Ipinakikita ang literal na di-karaniwang anyo at pinananatili ang kontekstuwal na pakahulugan nang hindi itinatanggi ang pag-igting ng Hebreo.
lexical_decisions:
- source_word: וַיָּטֶל
  choice: Inihagis
  rationale: Tuwirang inilalarawan ang paghagis ni Saul ng sibat at natural sa makabagong Filipino.
- source_word: אַכֶּה בְדָוִד וּבַקִּיר
  choice: Ibabaon ko si David sa pader
  rationale: Ipinahahayag ang layuning tamaan si David ng sibat at ipako o ibaon siya sa pader. Nananatili sa talab at larawan ng pahayag, habang inilalagay sa talababa ang mas literal ngunit alanganing anyo ng Hebreo.
- source_word: וַיִּסֹּב דָּוִד מִפָּנָיו
  choice: nakaiwas si David sa kaniya
  rationale: Ang pandiwa ay literal na pagliko o pagtabi mula sa harap ni Saul; sa kontekstong paghagis ng sibat, natural itong tumutukoy sa pag-iwas.
- source_word: פַּעֲמָיִם
  choice: dalawang ulit
  rationale: Tumpak na pinananatili ang bilang ng mga pag-iwas na binanggit sa Hebreo.
theological_decisions:
- issue: Kung tiyak bang nangangahulugang ipinako o ibinaon ni Saul si David sa pader ang pariralang Hebreo
  choice: Ibabaon ko si David sa pader
  alternative: Tatamaan ko si David at ang pader
  rationale: Ang piniling salin ang natural na kahulugan sa konteksto ng sibat, ngunit hindi ikinukubli ang hindi pangkaraniwang literal na pagkakabuo ng Hebreo; inilalahad ang alternatibo sa talababa upang mapanatili ang tunay na lingguwistikong pag-igting.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ibabaon” bilang natural at matingkad na paglalarawan ng layuning itulos si David sa pader, at “nakaiwas” bilang karaniwang salitang angkop sa mabilis na pagkilos sa tagpo.
