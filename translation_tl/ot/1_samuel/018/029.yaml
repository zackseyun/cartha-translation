  text: Saul continued to fear David even more[b][a], and Saul was David’s enemy all his days.
translation:
  language: tl
  text: Lalo pang natakot si Saul kay David[a], at si Saul ay kaaway ni David sa lahat ng kanyang mga araw[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Patuloy pa ring natakot si Saul kay David” o “Lalo pang nagpatuloy si Saul sa pagkatakot kay David.” Pinagsasama sa Hebreo ang pandiwang “nagdagdag/nagpatuloy,” “matakot,” at עוֹד (“pa,” “muli,” o “higit pa”).
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at si Saul ay kaaway ni David sa lahat ng mga araw.” Maaaring idiin nito ang patuloy na pagkapoot, hindi kinakailangang ang buong nalalabing buhay ni Saul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאסֶף ... לֵרֹא
  choice: Lalo pang natakot
  rationale: Ang יָסַף na may pawatas ay nagsasaad ng pagpapatuloy o karagdagang pagkilos. Kasama ng עוֹד at ng naunang konteksto, likas na ipinahahayag ng “lalo pang” ang tumitinding takot.
- source_word: מִפְּנֵי דָוִד
  choice: kay David
  rationale: Kasama ng pandiwang ירא, ang literal na “mula/sa harap ng mukha ni David” ay idyomatikong tumutukoy sa kinatatakutan; “kay David” ang natural na katumbas sa Tagalog.
- source_word: וַיְהִי שָׁאוּל אֹיֵב אֶת דָּוִד
  choice: patuloy siyang naging kaaway ni David
  rationale: Ang אֹיֵב ay tuwirang “kaaway,” at si David ang pinatutungkulan ng pagkapoot. Ipinahihiwatig ng sugnay ang nanatiling kalagayan ni Saul.
- source_word: כָּל הַיָּמִים
  choice: patuloy
  rationale: Ang parirala ay literal na “lahat ng mga araw” at maaaring tumukoy sa tuloy-tuloy na tagal, nang hindi kinakailangang ipakahulugang buong buhay ni Saul.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lalo pang natakot” para sa paglala ng takot sa konteksto, at “patuloy” upang mapanatili ang posibleng duratibong kahulugan ng כָּל הַיָּמִים nang hindi labis na nililinaw bilang buong buhay.
