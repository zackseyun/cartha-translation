  naturalness: Mas likas at malinaw sa makabagong Tagalog ang “mahal ng buong Israel at Juda si David” at “sapagkat lumalabas at pumapasok siya sa harap nila.” Ang binagong talababa ay iniiwasan din ang medyo hindi likas na “hayag na pinuno.”
  terminology: Ang mga pangalang Israel, Juda, at David ay angkop. Ang “mahal” ay wastong pangkalahatang/duratibong pagsasalin ng participle. Napananatili ang pangunahing teksto na walang idinagdag na tuwirang layon; ang alternatibong diwa ng pamumuno ay nasa talababa lamang.
