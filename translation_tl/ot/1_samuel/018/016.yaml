translation:
  language: tl
  text: Ngunit mahal ng buong Israel at Juda si David, sapagkat lumalabas at pumapasok siya sa harap nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinangungunahan niya sila sa paglabas at pagbabalik,” ibig sabihin, kumikilos siya bilang kanilang pinuno ng bayan, lalo na sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Ngunit ... buong
  rationale: Ang וְ ay may panalungat na puwersa rito dahil kasalungat ng takot at pagkapoot ni Saul sa naunang konteksto ang pagmamahal ng buong bayan; ang כָל ay ipinahayag sa “buong.”
- source_word: יִשְׂרָאֵל וִ/יהוּדָה
  choice: Israel at Juda
  rationale: Tuwirang pinananatili ang pagkakilala sa Israel at Juda bilang magkaugnay ngunit magkahiwalay na pangkat sa salaysay.
- source_word: אֹהֵב
  choice: mahal
  rationale: Ang pangkasalukuyang anyong “mahal” ay likas sa modernong Tagalog at nagpapahayag ng nagpapatuloy na kalagayan, gaya ng Hebreong participle, nang hindi ito ginagawang minsanang kilos lamang.
- source_word: אֶת דָּוִד
  choice: si David
  rationale: Hindi isinasalin ang pananda ng tuwirang layon na אֶת; ginagamit ang karaniwang Tagalog na pantukoy na “si” para sa pangalang pantao.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinapahayag na ang kasunod na sugnay ang dahilan ng pagmamahal ng bayan.
- source_word: הוּא
  choice: siya ang
  rationale: Pinananatili ang tahasang panghalip at binibigyang-diin ang paksa ng magkasunod na kilos sa paraang natural sa Tagalog.
- source_word: יוֹצֵא וָ/בָא
  choice: lumalabas at pumapasok
  rationale: Pinananatili ang pormal na larawan at posibleng idyomatikong kahulugan ng Hebreo nang hindi nagdaragdag sa pangunahing teksto ng layong hindi tahasang nakasaad.
- source_word: לִ/פְנֵי/הֶם
  choice: sa harap nila
  rationale: Ito ang tuwirang at likas na salin na nag-iiwan ng puwang kapwa sa literal na pagharap sa bayan at sa diwang pangunguna sa kanila.
