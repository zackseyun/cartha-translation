translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang payak na “mahal” upang ipahayag ang nagpapatuloy na saloobin ng bayan, at pinanatili ang Hebreong idyomang “lumalabas at pumapasok” sa pangunahing teksto habang ipinaliliwanag sa talababa ang posibleng diwa ng pampubliko o pangmilitar na pamumuno.
