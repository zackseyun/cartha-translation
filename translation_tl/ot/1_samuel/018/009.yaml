base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/009.yaml
  text: And Saul eyed David from that day forward[a].
translation:
  language: tl
  text: At mula nang araw na iyon, patuloy nang minatyagan ni Saul si David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula nang araw na iyon, masama na ang tingin ni Saul kay David”; ang diwa ay pagmamasid na may inggit o paghihinala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At ... patuloy nang
  rationale: Ang anyong pasalaysay ng היה ay likas na ipinahahayag sa Filipino sa pamamagitan ng pang-ugnay at aspektong nagpapatuloy; hindi kailangan ang literal na “at nangyari.”
- source_word: שָׁאוּל
  choice: Saul
  rationale: Karaniwang anyo ng pangalang pantangi sa modernong saling Filipino.
- source_word: עון
  choice: minatyagan
  rationale: Ang bihira o depektibong anyo ay tumutukoy sa pagtingin o pagbabantay na may masamang saloobin. Ipinahihiwatig ng “minatyagan” ang patuloy at mapaghinalang pagbabantay nang hindi tahasang nililimitahan ang kahulugan sa inggit lamang.
- source_word: אֶת
  choice: si
  rationale: Hindi tuwirang isinasalin ang pananda ng layon sa Hebreo; ginagamit ang “si” bilang pananda sa tiyak na taong layon sa Filipino.
- source_word: דָּוִד
  choice: David
  rationale: Karaniwang anyo ng pangalang pantangi sa modernong saling Filipino.
- source_word: מֵהַיּוֹם הַהוּא
  choice: mula nang araw na iyon
  rationale: Likas na pariralang Filipino na nagsasaad ng panimulang panahon ng nagpapatuloy na kilos o saloobin.
- source_word: וָהָלְאָה
  choice: patuloy nang
  rationale: Ipinahahayag nito ang diwang “mula noon at sa mga sumunod na panahon”; kasabay ng “mula nang araw na iyon,” natural nitong naihahatid ang duratibong puwersa ng Hebreo.
theological_decisions:
- issue: Kung tahasang papangalanan ang inggit bilang motibo ni Saul
  choice: Hindi tahasang idinagdag ang “nang may inggit” sa pangunahing teksto; ginamit ang “minatyagan.”
  alternative: “tiningnan nang may inggit” o “minatyagan nang may inggit”
  rationale: May masamang pagtingin o mapaghinalang pagbabantay ang salita sa konteksto, ngunit hindi nito kailangang itakda na inggit lamang ang motibo. Pinananatili ng salin ang saklaw ng kahulugan at inilalagay sa talababa ang paglilinaw.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “minatyagan” upang maging natural at malinaw sa karaniwang mambabasa habang pinananatili ang pahiwatig ng patuloy at masamang pagbabantay.
