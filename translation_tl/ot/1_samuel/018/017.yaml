base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/017.yaml
  text: Then Saul said to David, “Look, my older daughter Merab—I will give her to you as a wife. Only be a valiant man for me, and fight the LORD’s battles.” For Saul said, “Let not my hand be against him, but let the hand of the Philistines be against him.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Saul kay David, “Narito ang aking nakatatandang anak na babae, si Merab. Ibibigay ko siya sa iyo bilang asawa. Maging magiting ka lamang para sa akin at makipaglaban sa mga labanan ng PANGINOON.[a]” Sapagkat sinabi ni Saul, “Huwag nawang ang kamay ko ang kumilos laban sa kanya; sa halip, ang kamay ng mga Filisteo ang kumilos laban sa kanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “PANGINOON” ay kumakatawan sa pangalang Hebreo na YHWH.
    reason: Ipinababatid ang pinagmulan ng saling may malalaking titik nang hindi ipinapasok ang isang denominasyonal na paraan ng pagbigkas sa pangunahing teksto.
lexical_decisions:
- source_word: הַגְּדוֹלָה
  choice: panganay
  rationale: Sa pagtukoy sa dalawang anak na babae ni Saul, ang literal na “malaki” ay isang idyomang tumutukoy sa nakatatanda; natural na ipinahahayag ito rito bilang “panganay.”
- source_word: בֶן־חַיִל
  choice: magiting
  rationale: Ang literal na “anak ng lakas/kagitingan” ay idyoma para sa isang taong matapang at mahusay sa pakikipaglaban; pinananatili ng “magiting” ang diwang militar nang hindi nagiging pilit.
- source_word: מִלְחֲמוֹת יְהוָה
  choice: mga labanan ng PANGINOON
  rationale: Pinananatili ang pagkakaugnay ng mga digmaan sa Diyos at ang maramihang anyo, sa natural na Filipino.
- source_word: יָד ... בּוֹ
  choice: ang kamay ... ang kumilos laban sa kanya
  rationale: Pinananatili ang mahalagang metapora ng “kamay,” na naghahayag ng personal na pananagutan sa pananakit o pagpatay, habang ginagawa itong malinaw sa Filipino.
theological_decisions:
- issue: Paglalarawan sa mga labanan bilang pag-aari ng YHWH
  choice: mga labanan ng PANGINOON
  alternative: mga banal na labanan
  rationale: Hindi tinatawag ng Hebreo na “banal” ang mga labanan; tuwirang inuugnay ang mga ito kay YHWH. Iniwasang dagdagan ng kategoryang teolohikal na wala sa teksto.
- issue: Kung ang ikalawang sinabi ni Saul ay binigkas nang malakas o nasa isip lamang
  choice: Sapagkat sinabi ni Saul
  alternative: Sapagkat naisip ni Saul
  rationale: Ang Hebreo ay gumagamit ng אָמַר, “sinabi,” at hindi tahasang nagsasabing ito ay nasa isip. Pinananatili ang pormal na kalabuan kahit malinaw sa konteksto na inilalahad nito ang lihim na balak ni Saul.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “narito” upang ipahayag ang הִנֵּה bilang pantawag-pansin. Pinanatili ang metapora ng kamay at ang pag-uulit nito upang maipakita ang tusong hangarin ni Saul at ang pagkakatulad ng dalawang sugnay.
