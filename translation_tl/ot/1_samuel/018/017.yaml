revisions:
- from: Pagkatapos, sinabi ni Saul kay David, “Narito ang panganay kong anak na si Merab. Ibibigay ko siya sa iyo bilang asawa. Maging magiting ka lamang para sa akin at makipaglaban sa mga labanan ng PANGINOON.[a]” Sapagkat sinabi ni Saul, “Huwag nawang ang kamay ko ang kumilos laban sa kanya; ang kamay ng mga Filisteo ang kumilos laban sa kanya.”
  to: Pagkatapos, sinabi ni Saul kay David, “Narito ang aking nakatatandang anak na babae, si Merab. Ibibigay ko siya sa iyo bilang asawa. Maging magiting ka lamang para sa akin at makipaglaban sa mga labanan ng PANGINOON.[a]” Sapagkat sinabi ni Saul, “Huwag nawang ang kamay ko ang kumilos laban sa kanya; sa halip, ang kamay ng mga Filisteo ang kumilos laban sa kanya.”
  rationale: Pinalitan ang “panganay kong anak” ng “aking nakatatandang anak na babae” upang maisalin nang hayag ang kasarian at mas maingat na maipahayag ang ‘older’ sa Hebreo. Idinagdag ang “sa halip” upang idiin ang pagsalungat sa hangarin ni Saul, habang pinanatili ang metapora ng kamay, ang pag-uulit, at ang kalabuang dulot ng “sinabi ni Saul.”
