  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּרָ֥א שָׁא֖וּל מִ/לִּ/פְנֵ֣י דָוִ֑ד כִּֽי הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ וּ/מֵ/עִ֥ם שָׁא֖וּל סָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/012.yaml
  text: Saul was afraid of David[a], because Yahweh was with him and had departed from Saul.
translation:
  language: tl
  text: Natakot si Saul kay David[a], sapagkat si Yahweh ay kasama niya at lumisan na kay Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “Kinatakutan ni Saul si David.” Literal sa Hebreo: “Natakot si Saul mula sa harapan ni David,” isang idyomang nangangahulugang si David ang kinatatakutan o sanhi ng takot ni Saul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: Natakot
  rationale: Likas at malinaw na salin ng pandiwang ירא sa makabagong Filipino, at pinananatili ang emosyonal na diwa ng takot.
- source_word: מִלִּפְנֵי
  choice: kay
  rationale: Sa idyomang ירא מִלִּפְנֵי, si David ang kinatatakutan o sanhi ng takot; ang “natakot kay David” ang natural na katumbas sa Filipino.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinapakilala nito ang dahilan ng pagkatakot ni Saul; ang “sapagkat” ay malinaw, marangal, at angkop sa salaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: עִמּוֹ
  choice: kasama niya
  rationale: Pinananatili ang panghalip ng Hebreo; malinaw sa konteksto na si David ang tinutukoy.
- source_word: וּמֵעִם שָׁאוּל סָר
  choice: at lumisan na kay Saul
  rationale: Ang סור ay nangangahulugang lumisan, humiwalay, o umurong. Ipinahihiwatig ng “na” na nauna nang naganap ang paglisang ito at iyon ang kalagayang dahilan ng takot ni Saul.
theological_decisions:
- issue: Pagbibigay-salin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng paglisang banal mula kay Saul
  choice: Isinasaad lamang na si Yahweh ay lumisan na kay Saul.
  alternative: Ang Espiritu ni Yahweh o ang pabor ni Yahweh ay lumisan kay Saul.
  rationale: Hindi tinutukoy ng talatang ito ang Espiritu o pabor bilang siyang lumisan. Pinananatili ng salin ang mismong pahayag at teolohikal na tensiyon ng Hebreo nang walang idinagdag na paliwanag.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “sapagkat” upang mapanatili ang dignidad ng salaysay, at ang “lumisan na kay Saul” upang maipahayag ang naunang pag-alis nang hindi nagdaragdag ng paliwanag na wala sa talata.
