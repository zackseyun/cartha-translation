  text: Saul’s servants told him[a], saying, “David spoke words like these.”
translation:
  language: tl
  text: Iniulat kay Saul ng kanyang mga lingkod, “Ganito ang sinabi ni David.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: Iniulat
  rationale: Ang Hifil ng נגד ay nangangahulugang magsabi o mag-ulat. Ang “iniulat” ay natural sa konteksto ng mga lingkod na naghahatid kay Saul ng sagot ni David.
- source_word: עַבְדֵי שָׁאוּל
  choice: mga lingkod ni Saul
  rationale: Maaaring tumukoy ang עבד sa mga lingkod, tagapaglingkod, o opisyal. Pinananatili ng “mga lingkod” ang malawak na kahulugan nang hindi tinutukoy nang labis ang kanilang katungkulan sa palasyo.
- source_word: לוֹ
  choice: kay Saul
  rationale: Tumutukoy ang panghalip kay Saul. Inulit ang pangalan sa halip na “sa kanya” upang maging malinaw at natural sa Filipino.
- source_word: לֵאמֹר
  choice: panandang ipinahihiwatig ng tuwirang sipi
  rationale: Ipinakikilala nito ang nilalaman ng ulat. Sa natural na Filipino, sapat na ang kuwit at tuwirang sipi, kaya hindi na isinalin nang hiwalay bilang “na sinasabi.”
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: Ganito
  rationale: Literal itong “ayon sa/tulad ng mga salitang ito.” Sa konteksto, ang “Ganito” ay natural na nagpapakilala sa diwa o paraan ng sinabi ni David at hindi nagpapahiwatig na eksaktong sipi ang kasunod.
- source_word: דִּבֶּר
  choice: sinabi
  rationale: Bagaman literal na “nagsalita,” mas natural sa Filipino ang “sinabi” kapag tinutukoy ang nilalaman ng naunang pahayag.
- source_word: דָּוִד
  choice: David
  rationale: Karaniwang anyo ng pangalang ito sa Filipino.
theological_decisions: []
translation_notes:
  register: Gumamit ng malinaw, makabago, at marangal na Filipino. Inalis ang literal ngunit alanganing “na sinasabi” at ginamit ang tuwirang sipi. Ang “Ganito ang sinabi ni David” ay likas na katumbas ng idyomang Hebreo at pinananatili ang posibilidad na buod, hindi salita-sa-salitang sipi, ang iniulat.
