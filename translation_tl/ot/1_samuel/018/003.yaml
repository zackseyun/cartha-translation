  yaml_path: translation/ot/1_samuel/018/003.yaml
  text: Then Jonathan made a covenant with David[b][a], because he loved him as his own soul.
translation:
  language: tl
  text: Pagkatapos, nakipagtipan[a] si Jonatan kay David, sapagkat minahal niya ito gaya ng sarili niyang buhay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “pumutol ng tipan.”
    reason: lexical_alternative
  - marker: b
    text: O “sa pag-ibig niya sa kanya.” Pormal na malabo sa Hebreo kung sino ang tinutukoy ng mga panghalip, ngunit ipinahihiwatig ng konteksto na minahal ni Jonatan si David gaya ng sarili niyang buhay.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: nakipagtipan
  rationale: Ang כרת ברית ay isang idyomang literal na ‘pumutol ng tipan.’ Likas at malinaw sa modernong Filipino ang ‘nakipagtipan,’ habang pinananatili ang diwa ng taimtim at may-bisang pakikipagkasundo.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Jonathan.
- source_word: וְדָוִד
  choice: kay David
  rationale: Bagaman literal na may pangatnig na ‘at,’ ang isahang pandiwang Hebreo ay nagtatanghal kay Jonatan bilang gumagawa ng tipan at kay David bilang kabilang panig; natural itong ipinahahayag sa Filipino sa pamamagitan ng ‘kay David.’
- source_word: בְּרִית
  choice: tipan
  rationale: Ang ‘tipan’ ang karaniwang salitang biblikal sa Filipino para sa pormal, taimtim, at may-bisang בְּרִית; mas angkop ito kaysa sa payak na ‘kasunduan.’
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: sapagkat minahal niya ito
  rationale: Maaaring unawain ang בְּ bilang sanhi o kalagayan. Ipinahahayag ng ‘sapagkat’ na ang pakikipagtipan ay nakaugat sa pag-ibig, samantalang ang ‘niya’ at ‘ito’ ay nag-iiwan ng pormal na kalabuan ng mga panghalip na Hebreo.
- source_word: כְּנַפְשׁוֹ
  choice: gaya ng sarili niyang buhay
  rationale: Ang נֶפֶשׁ ay maaaring mangahulugang buhay, sarili, o kaluluwa. Sa Filipino, natural at marangal ang ‘sarili niyang buhay’ at napapanatili nito ang matinding personal na paghahambing nang hindi nagpapasok ng di-kinakailangang teknikal na diwa ng ‘kaluluwa.’
theological_decisions:
- issue: Tinutukoy ng mga panghalip sa pariralang ‘sapagkat minahal niya ito gaya ng sarili niyang buhay’
  choice: Pinanatili sa pangunahing teksto ang pormal na kalabuan sa pamamagitan ng ‘niya’ at ‘ito,’ habang nililinaw sa talababa na si Jonatan ang malamang na umiibig kay David.
  alternative: 'Tahasang isalin: ‘sapagkat minahal ni Jonatan si David gaya ng sarili niyang buhay.’'
  rationale: Pormal na malabo ang mga panghalip na ikatlong panauhan sa Hebreo, ngunit malinaw na pinapaboran ng konteksto ng 18:1–3 si Jonatan bilang umiibig at si David bilang iniibig. Pinananatili ng teksto at talababa kapwa ang tunay na anyong Hebreo at ang malamang na pagbasa sa konteksto.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang ‘nakipagtipan’ bilang likas na katumbas ng idyomang Hebreo at ‘sarili niyang buhay’ upang maipahayag ang נֶפֶשׁ nang malinaw. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
