translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang di-tiyak na “sila” sa unang sugnay at ang isahang “Filisteo.” Hinati ang huling hanay sa magkakaugnay na pangungusap upang maiwasan ang alanganing sunod-sunod na “may” habang pinananatili ang awit, sayaw, mga tamburin, kagalakan, at instrumentong musikal.
