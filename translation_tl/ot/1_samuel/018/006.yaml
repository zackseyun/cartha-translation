  text: וַ/יְהִ֣י בְּ/בוֹאָ֗/ם בְּ/שׁ֤וּב דָּוִד֙ מֵ/הַכּ֣וֹת אֶת הַ/פְּלִשְׁתִּ֔י וַ/תֵּצֶ֨אנָה הַ/נָּשִׁ֜ים מִ/כָּל עָרֵ֤י יִשְׂרָאֵל֙ ל/שור וְ/הַ/מְּחֹל֔וֹת לִ/קְרַ֖את שָׁא֣וּל הַ/מֶּ֑לֶךְ בְּ/תֻפִּ֥ים בְּ/שִׂמְחָ֖ה וּ/בְ/שָׁלִשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/006.yaml
  text: And it happened[a], as they were coming in, when David returned from striking down the Philistine, that the women came out from all the cities of Israel, singing and dancing, to meet King Saul with tambourines, with joy, and with three-stringed instruments.
translation:
  language: tl
  text: At nangyari, habang sila'y dumarating, nang bumalik si David matapos niyang pabagsakin ang Filisteo, lumabas ang mga babae mula sa lahat ng lungsod ng Israel, na umaawit at sumasayaw, upang salubungin si Haring Saul nang may mga tamburin, kagalakan, at mga instrumentong may tatlong kuwerdas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan ng salitang Hebreo na שָׁלִשִׁים. Maaaring tumukoy ito sa mga instrumentong may tatlong kuwerdas, mga lute, o iba pang saliw na pangmusika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Pinananatili ang tungkuling pasalaysay ng wayyiqtol ng היה sa natural at hindi makalumang Tagalog.
- source_word: בְּבוֹאָם
  choice: habang papasok sila
  rationale: Ang ב na may infinitive construct at hulaping 3mp ay temporal; pinananatili rin ang di-tiyak na pangmaramihang tinutukoy ng “sila.”
- source_word: בְּשׁוּב דָּוִד
  choice: nang bumalik si David
  rationale: Likas na salin ng temporal na infinitive construct ng שוב na may hayag na simuno.
- source_word: מֵהַכּוֹת אֶת־הַפְּלִשְׁתִּי
  choice: matapos pabagsakin ang Filisteo
  rationale: Ang נכה ay maaaring tumukoy sa paghampas, paggapi, o pagpatay. Ipinahihiwatig ng “pabagsakin” ang kinalabasan nang hindi higit na tinutukoy kaysa sa Hebreo; pinananatili ang isahan na “ang Filisteo.”
- source_word: וַתֵּצֶאנָה הַנָּשִׁים
  choice: lumabas ang mga babae
  rationale: Tuwirang inilalarawan ng יצא ang paglabas nila mula sa mga lungsod upang sumalubong.
- source_word: מִכָּל עָרֵי יִשְׂרָאֵל
  choice: mula sa lahat ng lungsod ng Israel
  rationale: Pinananatili ang kolektibo o distributibong saklaw ng parirala.
- source_word: לָשׁוּר וְהַמְּחֹלוֹת
  choice: na umaawit at sumasayaw
  rationale: Ang infinitive na לָשׁוּר ay layunin o kasabay na kilos, samantalang pangngalan ang מְחֹלוֹת; ang tambalang pandiwa ay mas natural sa modernong Tagalog habang buo ang diwa.
- source_word: לִקְרַאת שָׁאוּל הַמֶּלֶךְ
  choice: upang salubungin si Haring Saul
  rationale: Ang לִקְרַאת ay paglapit upang makipagtagpo o sumalubong; natural sa Tagalog ang ayos na “Haring Saul.”
- source_word: בְּתֻפִּים
  choice: May dala silang mga tamburin
  rationale: Ang תֹּף ay isang maliit na frame drum na katulad ng tamburin. Ginawang malinaw at natural sa Tagalog ang kasamang kagamitan.
- source_word: בְּשִׂמְחָה
  choice: nagagalak sila
  rationale: Inihahayag sa natural na Tagalog ang kagalakan o masayang pagdiriwang na tinutukoy ng pangngalan.
- source_word: וּבְשָׁלִשִׁים
  choice: tumutugtog ng mga instrumentong may tatlong kuwerdas
  rationale: Hindi tiyak ang kahulugan ng שָׁלִשִׁים. Inilalahad ng salin ang isang malamang na musikal na pakahulugan, ngunit minamarkahan ang kawalang-katiyakan sa talababa.
