  source_fidelity: Tumpak na naipapahayag ng salin ang temporal na sugnay, ang pagsasalita kay Saul, ang tatlong-ulit na pagbanggit ng נֶפֶשׁ, ang metapora ng pagkabigkis, at ang pagmamahal ni Jonatan kay David. Ang “Nang” ay isang natural na paraan sa modernong Tagalog upang isulong ang salaysay, kahit hindi nito literal na inuulit ang pormulang וַיְהִי; wala itong nababawas na mahalagang kahulugan sa talata.
  naturalness: 'Natural, malinaw, at marangal ang daloy: “Nang matapos siyang magsalita kay Saul...” Ang “nabigkis” ay nauunawaan at akma sa matinding metapora ng Hebreo. Malinaw rin mula sa konteksto na si David ang tinutukoy ng “siyang” at “siya.”'
  terminology: Wastong pinananatili ang “kaluluwa” sa tatlong paglitaw ng נֶפֶשׁ, kaya nakikita ang sinadyang pag-uulit ng Hebreo. Ang “Jonatan,” “David,” “minahal,” at “gaya ng sarili niyang kaluluwa” ay pare-parehong angkop sa modernong Filipino Tagalog at hindi nagdaragdag ng romantiko, seksuwal, o doktrinal na pakahulugan.
