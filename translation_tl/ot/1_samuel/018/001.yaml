reference: 1 Samuel 18:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֣ר אֶל שָׁא֔וּל וְ/נֶ֨פֶשׁ֙ יְה֣וֹנָתָ֔ן נִקְשְׁרָ֖ה בְּ/נֶ֣פֶשׁ דָּוִ֑ד ו/יאהבו יְהוֹנָתָ֖ן כְּ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/001.yaml
  text: And it happened[a], when he had finished speaking to Saul, that Jonathan’s soul was bound to David’s soul[b], and Jonathan loved him as his own soul.
translation:
  language: tl
  text: Nang matapos siyang magsalita kay Saul, ang kaluluwa ni Jonatan ay nabigkis sa kaluluwa ni David,[a] at minahal siya ni Jonatan gaya ng sarili niyang kaluluwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mahigpit na naugnay sa kaluluwa ni David.”
    reason: lexical_alternative
  - marker: b
    text: 'Tatlong ulit na ginagamit dito ng Hebreo ang salitang נֶפֶשׁ (nefesh): “kaluluwa ni Jonatan … kaluluwa ni David … sarili niyang kaluluwa.” Maaari rin itong tumukoy sa buhay, sarili, o buong pagkatao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Sa tuloy-tuloy na salaysay sa Tagalog, likas na ipinahihiwatig ng temporal na sugnay ang paglipat sa kasunod na pangyayari; ang tahasang “At nangyari” ay magiging mabigat at hindi kailangan.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: matapos siyang magsalita
  rationale: Malinaw at natural na ipinapahayag ang temporal na pagkakasunod ng infinitive construct na may hulaping tumutukoy kay David.
- source_word: אֶל שָׁאוּל
  choice: kay Saul
  rationale: Ang “kay” ang karaniwang Tagalog na pananda sa taong pinatutungkulan ng pagsasalita.
- source_word: נֶפֶשׁ
  choice: kaluluwa
  rationale: Pinananatili ang tatlong ulit na paggamit ng נֶפֶשׁ at ang matinding larawan ng buklod ng kanilang buong pagkatao, sa halip na gawing payak na “sarili” o “buhay.”
- source_word: נִקְשְׁרָה
  choice: nabigkis
  rationale: Tumpak na pinananatili ang metapora ng pagtali o mahigpit na pagkakaugnay, sa dignified at nauunawaang modernong Tagalog.
- source_word: בְּנֶפֶשׁ דָּוִד
  choice: sa kaluluwa ni David
  rationale: Pinananatiling tahasan ang ikalawang paglitaw ng נֶפֶשׁ at ang ugnayang ipinahihiwatig ng pang-ukol בְּ.
- source_word: וַיֶּאֱהָבוֹ יְהוֹנָתָן
  choice: minahal siya ni Jonatan
  rationale: Tuwirang ipinakikita si Jonatan bilang simuno at si David bilang layon, nang walang pagdaragdag ng romantiko, seksuwal, o pampolitikang pakahulugan.
- source_word: כְּנַפְשׁוֹ
  choice: gaya ng sarili niyang kaluluwa
  rationale: Pinananatili ang ikatlong paglitaw ng נֶפֶשׁ at ang paghahambing sa sariling buhay o pagkatao ni Jonatan.
theological_decisions:
- issue: Kalikasan ng pag-ibig ni Jonatan kay David
  choice: Ihayag ang malalim na personal na pagmamahal at buklod ayon sa mismong wika ng teksto, nang hindi ito itinatakda bilang romantiko o seksuwal.
  alternative: Unawain ito bilang pangunahing pampolitikang alyansa, o bilang romantiko/seksuwal na pag-ibig.
  rationale: Malinaw sa נֶפֶשׁ at אהב ang matindi at personal na buklod, ngunit hindi tinutukoy ng talata ang erotikong nilalaman o nililimitahan ang ugnayan sa politika. Kaya pinananatili ng salin ang lakas at tunay na kalabuan ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “nabigkis” upang mapanatili ang konkretong metapora ng Hebreo, at “kaluluwa” upang makita ang sinadyang tatlong ulit na paggamit ng נֶפֶשׁ. Ang mga pangalang “Jonatan” at “David” ay sumusunod sa karaniwang anyong Tagalog.
