  text: Saul took him that day and did not allow him to return to his father's house[a].
translation:
  language: tl
  text: Noong araw na iyon, isinama siya ni Saul at hindi siya pinayagang bumalik sa bahay ng kanyang ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi siya pinahintulutang bumalik.” Sa Hebreo, literal itong “hindi niya siya ibinigay upang bumalik,” kung saan idyomatikong ginagamit ang נָתַן para sa pagpapahintulot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: isinama siya
  rationale: Ang לָקַח ay literal na ‘kunin,’ ngunit sa konteksto ay isinama ni Saul si David sa kanyang sambahayan o paglilingkod. Ang ‘isinama siya’ ay natural sa modernong Tagalog at hindi labis na nagpapaliwanag.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Karaniwang anyo ng pangalang Hebreo sa Tagalog na salin ng Bibliya.
- source_word: בַּיּוֹם הַהוּא
  choice: Nang araw na iyon
  rationale: Tuwirang ipinahahayag ang tiyak na panahong tinutukoy at natural ang ayos sa Tagalog.
- source_word: וְלֹא נְתָנוֹ
  choice: at hindi siya pinayagan
  rationale: Ginagamit dito ang נָתַן kasunod ng pawatas bilang idyoma ng pagpapahintulot; ang literal na ‘hindi siya ibinigay’ ay malabo at hindi likas sa Tagalog.
- source_word: לָשׁוּב
  choice: bumalik
  rationale: Karaniwan at tuwirang katumbas ng שׁוּב sa kontekstong ito.
- source_word: בֵּית אָבִיו
  choice: sa bahay ng kanyang ama
  rationale: Pinananatili ang Hebreong larawan ng tahanan o sambahayan ng ama sa malinaw at dignified na modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang ‘isinama’ upang ihatid ang kontekstuwal na diwa ng pagkuha ni Saul kay David nang hindi tahasang idinaragdag ang ‘sa kanyang paglilingkod.’
