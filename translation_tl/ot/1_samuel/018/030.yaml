base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/030.yaml
  text: Then the commanders of the Philistines went out[a], and as often as they went out, David acted more wisely than all the servants of Saul[c][b], so that his name was highly esteemed.
translation:
  language: tl
  text: Pagkatapos, lumabas ang mga pinuno ng mga Filisteo. At sa tuwing lumalabas sila, mas matalinong kumilos si David[a] kaysa sa lahat ng lingkod ni Saul. Kaya lubos na iginagalang ang kanyang pangalan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagtagumpay si David nang higit” o “mas naging matagumpay si David.” Ang pandiwang Hebreo ay maaaring tumukoy sa marunong na pagkilos na humahantong sa tagumpay.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “naging lubhang mahalaga o marangal ang kanyang pangalan,” ibig sabihin, lubos na iginagalang ang reputasyon niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: mga pinuno ng mga Filisteo
  rationale: Maaaring tumukoy ang שָׂרִים sa mga opisyal, pinuno, o kumandante. Ang “mga pinuno” ay natural at sapat na malawak, habang ipinahihiwatig ng konteksto ang kanilang tungkuling militar.
- source_word: וַיֵּצְאוּ
  choice: lumabas upang makipagdigma
  rationale: Ang literal na “lumabas” ay karaniwang ginagamit sa Hebreo para sa paglabas sa isang labanang militar. Idinagdag ang “upang makipagdigma” upang maging malinaw sa modernong Tagalog nang hindi labis na tinutukoy kung paano sila kumilos.
- source_word: מִדֵּי צֵאתָם
  choice: sa tuwing lumalabas sila
  rationale: Ipinahahayag ng parirala ang paulit-ulit na pangyayari—bawat pagkakataong lumalabas ang mga pinuno ng mga Filisteo.
- source_word: שָׂכַל
  choice: kumikilos ... nang mas may karunungan
  rationale: Saklaw ng pandiwa ang matalinong pagkilos at ang tagumpay na bunga nito. Pinananatili ng salin ang pangunahing diwa ng maingat at marunong na pagkilos, habang ang paghahambing na “mas” ay nagmumula sa kasunod na מִכֹּל.
- source_word: מִכֹּל עַבְדֵי שָׁאוּל
  choice: kaysa sa lahat ng lingkod ni Saul
  rationale: Ang עֲבָדִים dito ay mga taong naglilingkod sa hari, kabilang ang mga opisyal, at hindi kinakailangang mga alipin. Ang “mga lingkod” ay nagpapanatili sa malawak na saklaw ng Hebreo.
- source_word: וַיִּיקַר שְׁמוֹ מְאֹד
  choice: lubos na iginagalang ang pangalan niya
  rationale: Sa pariralang ito, ang “pangalan” ay tumutukoy sa reputasyon o dangal. Pinananatili ng “iginagalang ang pangalan niya” ang larawan ng Hebreo, at ipinahahayag ng “lubos” ang diin ng מְאֹד.
