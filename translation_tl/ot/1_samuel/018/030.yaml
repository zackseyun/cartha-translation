  naturalness: Mas natural sa modernong Tagalog ang “mas matalinong kumilos si David kaysa sa lahat...” kaysa “kumikilos si David nang mas may karunungan kaysa...”. Ang “kanyang pangalan” ay malinaw at pinananatili ang idyomang Hebreo.
  terminology: Ang “mga pinuno ng mga Filisteo,” “mga lingkod ni Saul,” at “iginagalang ang kanyang pangalan” ay angkop sa marangal ngunit modernong rehistro. Hindi kailangan ang mas tiyak na “mga kumandante,” sapagkat malawak ang saklaw ng Hebreong termino.
