  to: Pagkatapos, lumabas ang mga pinuno ng mga Filisteo. At sa tuwing lumalabas sila, mas matalinong kumilos si David[a] kaysa sa lahat ng lingkod ni Saul. Kaya lubos na iginagalang ang kanyang pangalan[b].
