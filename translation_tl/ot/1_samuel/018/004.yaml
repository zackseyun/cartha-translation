base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/004.yaml
  text: Then Jonathan stripped off the robe that was on him and gave it to David[a], along with his armor, and even his sword, his bow, and his belt.
translation:
  language: tl
  text: Hinubad ni Jonatan ang balabal na suot niya at ibinigay iyon kay David, pati ang kasuotang pandigma niya[a], maging ang kanyang espada, pana, at sinturon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kasuotan niya” o “kasuotang militar niya.” Ang salitang Hebreo ay maaaring tumukoy sa kasuotan, kadalasa’y opisyal o militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּשֵּׁט
  choice: Hinubad
  rationale: Ipinahihiwatig ng hitpael ng פשט na inalis ni Jonatan sa kanyang sarili ang kasuotan. Natural sa Tagalog ang “hinubad” at hindi nito kailangang ipahiwatig na lubos siyang naghubad.
- source_word: הַמְּעִיל אֲשֶׁר עָלָיו
  choice: ang balabal na suot niya
  rationale: Ang מְעִיל ay panlabas na balabal o mahabang kasuotan; malinaw at natural ang “balabal,” at idiomatiko ang “na suot niya” para sa אֲשֶׁר עָלָיו.
- source_word: וַיִּתְּנֵהוּ לְדָוִד
  choice: at ibinigay iyon kay David
  rationale: Tuwirang isinasalin ang payak na kilos ng נתן, at ang “iyon” ay malinaw na tumutukoy sa balabal.
- source_word: וּמַדָּיו
  choice: pati ang kasuotang pandigma niya
  rationale: Ang מַדִּים ay maaaring tumukoy sa mga kasuotan, lalo na sa opisyal o militar na kasuotan. Dahil kasunod ang espada, pana, at sinturon, pinananatili ng “kasuotang pandigma” ang militar na konteksto nang hindi masyadong nililimitahan ang salita sa baluting panangga.
- source_word: וְעַד
  choice: maging ang
  rationale: Ang inuulit na עַד ay nagpapalawak at nagpapatingkad sa talaan ng mga ibinigay; natural na naihahayag ito ng “maging ang” sa Filipino.
- source_word: חַרְבּוֹ
  choice: kanyang espada
  rationale: Karaniwan at malinaw na katumbas ng חֶרֶב sa kontekstong ito.
- source_word: קַשְׁתּוֹ
  choice: pana
  rationale: Karaniwang katumbas ng קֶשֶׁת; ang panghalip na paari mula sa magkakaugnay na talaan ay saklaw ng “kanyang.”
- source_word: חֲגֹרוֹ
  choice: sinturon
  rationale: Ang חֲגוֹר ay bagay na ibinibigkis sa baywang; “sinturon” ang malinaw at makabagong katumbas.
theological_decisions:
- issue: Kahulugan ng pagbibigay ni Jonatan ng kanyang mga kagamitan
  choice: Inilalarawan lamang ang ginawa ni Jonatan, nang hindi tahasang sinasabing sagisag ito ng pagpapasakop, paglilipat ng karapatan sa paghahari, o pagkakaibigan lamang.
  alternative: Maaaring unawain ang mga handog bilang pagkilala kay David bilang magiging hari, o pangunahin bilang mga tanda ng tipang pagkakaibigan.
  rationale: Iniuulat ng Hebreo ang kongkretong kilos ngunit hindi nito tahasang ipinaliliwanag ang simbolikong kahulugan sa talatang ito. Pinananatili ng salin ang tensiyong pampanitikan at teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “balabal,” “kasuotang pandigma,” at “sinturon” bilang mga salitang madaling maunawaan ngunit angkop sa sinaunang salaysay; iniwasan ang labis na interpretasyon sa simbolikong halaga ng mga handog.
