translation_notes:
  register: Makabago, natural, at marangal na salaysay. Ginamit ang 'humayo' bilang bahagyang mataas ngunit karaniwang biblikal na pandiwa, at 'sa may' upang mapanatili ang kaluwagan ng topograpikong pariralang Hebreo.
