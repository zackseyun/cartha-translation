base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/003.yaml
  text: Then Saul took three thousand chosen men from all Israel and went to seek David and his men in front of the rocks of the wild goats[a].
translation:
  language: tl
  text: Pagkatapos, kumuha si Saul ng tatlong libong piling lalaki mula sa buong Israel at humayo upang hanapin si David at ang mga tauhan niya sa may mga batuhan ng mga ligaw na kambing[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bangin ng mga ligaw na kambing”; ang hayop ay maaaring partikular na ibex.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: pumili
  rationale: Sa kontekstong militar, kinuha ni Saul ang mga lalaking pinili para sa ekspedisyon; natural na ipinahahayag sa Tagalog ng 'pumili' kasama ng בָּחוּר.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ בָּחוּר
  choice: tatlong libong lalaki
  rationale: Pinananatili ang bilang at tao bilang tinutukoy; naipahihiwatig na mga piling lalaki sila sa pandiwang 'pumili' nang hindi inuulit nang alanganin ang ideya.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: mula sa buong Israel
  rationale: Malinaw na ang mga lalaki ay pinili mula sa saklaw ng buong bansa.
- source_word: וַיֵּלֶךְ לְבַקֵּשׁ
  choice: humayo upang hanapin
  rationale: Pinananatili ang galaw at layunin ng Hebreo sa dignidad ngunit nauunawaang makabagong Tagalog.
- source_word: אֶת דָּוִד וַאֲנָשָׁיו
  choice: si David at ang mga tauhan nito
  rationale: '''Mga tauhan'' ang likas na tawag sa pangkat ng mga lalaking nasa ilalim ng pamumuno ni David; ''nito'' ang malinaw na pantukoy kay David.'
- source_word: עַל פְּנֵי
  choice: sa may
  rationale: Ang ekspresyon ay topograpiko at hindi tiyak kung 'sa harap,' 'malapit,' o 'sa ibabaw/ibabaw ng lugar'; ang 'sa may' ay likas at hindi labis na nagpapasya sa eksaktong ugnayang lokatibo.
- source_word: צוּרֵי הַיְּעֵלִים
  choice: matatarik na batuhan ng mga ligaw na kambing
  rationale: Ang צוּרֵי ay tumutukoy sa mga batuhan o bangin; idinagdag ang 'matatarik' upang maipahayag ang anyong crags, habang ang יְעֵלִים ay ginawang madaling maunawaang 'mga ligaw na kambing.'
