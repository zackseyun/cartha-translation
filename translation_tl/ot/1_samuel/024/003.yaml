  source_fidelity: Kailangang maipahayag nang magkahiwalay ang וַיִּקַּח (“kumuha/nagtipon”) at בָּחוּר (“piling”). Sa draft, pinagsasama ng “pumili” ang dalawang ito at nawawala ang tahasang paglalarawan sa mga lalaki bilang piling tauhan. Ang “matatarik” ay dagdag na paglalarawan na hindi kailangang ilagay sa pangunahing teksto.
  naturalness: Natural at marangal sa modernong Filipino ang “kumuha ... ng tatlong libong piling lalaki,” “humayo upang hanapin,” at “ang mga tauhan niya.” Ang “sa may” ay angkop na maingat na salin para sa hindi ganap na tiyak na topograpikong ugnayan ng עַל־פְּנֵי.
  terminology: “Piling lalaki” ay malinaw para sa בָּחוּר sa kontekstong militar. “Mga batuhan ng mga ligaw na kambing” ay naiintindihan at pinananatili ang leksikal na larawan; ang “ibex” ay nararapat manatili sa talababa bilang mas tiyak na posibilidad.
  issues:
