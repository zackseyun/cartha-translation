  yaml_path: translation/ot/1_samuel/024/002.yaml
  text: When Saul returned from pursuing the Philistines, they told him, saying, “Look, David is in the wilderness of En-gedi.”
translation:
  language: tl
  text: At nang makabalik si Saul mula sa paghabol sa mga Filisteo, sinabi nila sa kanya, “Tingnan mo, nasa ilang ng En-gedi si David.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאַחֲרֵי פְּלִשְׁתִּים
  choice: mula sa paghabol sa mga Filisteo
  rationale: Sa konteksto, ang idyomang ‘mula sa likuran ng’ ay tumutukoy sa pagbabalik mula sa paghabol sa mga Filisteo.
- source_word: וַיַּגִּידוּ לוֹ
  choice: may nagsabi sa kanya
  rationale: Ang di-tiyak na pangmaramihang pandiwa ay natural na naipapahayag sa Filipino bilang di-tiyak na tagapagbalita, nang hindi nagdaragdag ng pagkakakilanlan.
- source_word: הִנֵּה
  choice: Nasa
  rationale: Dito, ipinakikilala ng הִנֵּה ang agarang ulat tungkol sa kinaroroonan ni David; natural na naihahatid ito ng tuwirang pahayag sa Filipino nang hindi pilit na isinasalin bilang ‘tingnan mo.’
- source_word: מִדְבַּר עֵין גֶּדִי
  choice: ilang ng En-gedi
  rationale: Ang מִדְבָּר ay tigang at di-tinatahanang lupain, kaya ang tradisyonal ngunit malinaw na ‘ilang’ ay angkop; pinananatili ang pangalang En-gedi.
