  verdict: revise
  source_fidelity: 'Tapat ang salin sa Hebreo: napananatili ang mariing pag-uulit ng “tingnan,” ang laylayan ng balabal bilang ebidensiya sa kamay ni David, ang dalawang pandiwang pautos, ang idiomang “sa aking kamay,” at ang pag-uusig sa kanyang buhay upang kunin ito. Ang “paghihimagsik” ay isang makatwirang kontekstuwal na salin ng פֶּשַׁע sa pakikipag-usap ni David sa hari.'
  naturalness: Kailangan ng maliit na pag-aayos upang maging likas ang modernong Filipino. Ang “At, ama ko” ay hindi natural na paglalagay ng pangatnig at kuwit sa pambungad na pantawag; mas maayos ang “Ama ko.” Ang “Matanto ninyo” ay mas idiomatiko rito kaysa “Alamin ninyo,” habang pinananatili ang puwersa ng דַּע (“kilalanin/unawain”).
  terminology: Ang “laylayan,” “balabal,” “kasamaan,” “paghihimagsik,” “nagkasala,” at “tinutugis ang aking buhay” ay angkop sa marangal ngunit makabagong rehistro. Ang magalang na “ninyo/kayo” ay wastong paraan ng pagtugon kay Saul sa Filipino.
  issues:
