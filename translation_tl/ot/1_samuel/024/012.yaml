    issue: Hindi likas ang pambungad na “At, ama ko.”
    rationale: Bagaman may waw sa Hebreo, ang pagtutumbas na “At,” bago ng pantawag ay hindi karaniwang daloy ng Filipino. Hindi kailangang ilipat nang mekanikal ang pangatnig upang maihatid ang panawagan ni David.
  - severity: low
    issue: Medyo hindi idiomatiko ang “Alamin ninyo at tingnan.”
    rationale: Sa kontekstong ito, ang דַּע ay panawagang kilalanin o matanto ang ipinakikitang ebidensiya, hindi pangunahing utos na magsaliksik o alamin. Ang “Matanto ninyo at tingnan ninyo” ay natural at pinananatili ang dalawang Hebreong pautos.
