  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אָבִ֣/י רְאֵ֔ה גַּ֗ם רְאֵ֛ה אֶת כְּנַ֥ף מְעִילְ/ךָ֖ בְּ/יָדִ֑/י כִּ֡י בְּ/כָרְתִ/י֩ אֶת כְּנַ֨ף מְעִֽילְ/ךָ֜ וְ/לֹ֣א הֲרַגְתִּ֗י/ךָ דַּ֤ע וּ/רְאֵה֙ כִּי֩ אֵ֨ין בְּ/יָדִ֜/י רָעָ֤ה וָ/פֶ֨שַׁע֙ וְ/לֹא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֛ה צֹדֶ֥ה אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/012.yaml
  text: And[a], my father, see—yes, see the corner of your robe in my hand. For when I cut off the corner of your robe[b], I did not kill you. Know and see that there is no evil or transgression in my hand, and I have not sinned against you[c], though you are hunting my life to take it.
translation:
  language: tl
  text: 'Ama ko, tingnan ninyo—oo, tingnan ninyo ang laylayan[a] ng inyong balabal na nasa kamay ko. Sapagkat nang putulin ko ang laylayan ng inyong balabal, hindi ko kayo pinatay. Matanto ninyo at tingnan ninyo: walang kasamaan o paghihimagsik[b] sa aking kamay, at hindi ako nagkasala sa inyo. Gayunman, tinutugis ninyo ang aking buhay upang kitlin ito.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dulo” o “gilid” ng inyong balabal.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring isaling “paglabag” o “pagsalansang.”
    reason: lexical_and_contextual_ambiguity
  - marker: c
    text: 'Mas literal: “tinutugis ninyo ang aking buhay upang kunin iyon.”'
    reason: literal_rendering
lexical_decisions:
- source_word: וְאָבִי
  choice: At, ama ko
  rationale: Pinananatili ang magalang at malapit na pantawag ni David kay Saul; hindi ito pinapaliit sa isang karaniwang titulo lamang.
- source_word: רְאֵה גַּם רְאֵה
  choice: tingnan ninyo—oo, tingnan ninyo
  rationale: Ipinakikita ng pag-uulit at ng גַּם ang mariing paghimok. Ang magalang na maramihang panghalip ay likas sa modernong Filipino kapag kinakausap ang hari.
- source_word: כְּנַף מְעִילְךָ
  choice: ang laylayan ng inyong balabal
  rationale: Ang כָּנָף ay tumutukoy rito sa dulo o gilid ng kasuutan. Ang “laylayan” ay kongkreto at natural, at ang “balabal” ay angkop sa מְעִיל sa salaysay.
- source_word: בְּיָדִי
  choice: nasa kamay ko / sa aking kamay
  rationale: Pinananatili ang literal na “kamay” dahil una itong tumutukoy sa ebidensiyang hawak ni David at pagkatapos ay sa kanyang gawa o kapangyarihang kumilos.
- source_word: כִּי בְּכָרְתִי
  choice: Sapagkat nang putulin ko
  rationale: Ang כִּי ay nagbibigay ng paliwanag, at ang anyo ng parirala ay natural na naihahayag sa Filipino sa pamamagitan ng “nang.”
- source_word: וְלֹא הֲרַגְתִּיךָ
  choice: hindi ko kayo pinatay
  rationale: Tuwirang salin ng tahasang pagtanggi ni David; malinaw at makabago ang pandiwang “pinatay.”
- source_word: דַּע וּרְאֵה
  choice: Alamin ninyo at tingnan
  rationale: 'Pinananatili ang dalawang pautos: dapat kapwa kilalanin ni Saul ang katotohanan at tingnan ang pisikal na ebidensiya.'
- source_word: אֵין בְּיָדִי רָעָה וָפֶשַׁע
  choice: walang kasamaan o paghihimagsik sa aking kamay
  rationale: Pinananatili ang larawan ng “kamay” at ang moral-politikal na puwersa ng פֶשַׁע sa harap ng hari. Isinasaad sa talababa ang leksikal na saklaw nito.
- source_word: וְלֹא חָטָאתִי לָךְ
  choice: at hindi ako nagkasala sa inyo
  rationale: Ang “nagkasala sa inyo” ay nagpapanatili sa moral na bigat ng חטא at malinaw na nagsasaad kung kanino ginawa ang pagkakasala.
- source_word: וְאַתָּה צֹדֶה אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: Gayunman, tinutugis ninyo ang aking buhay upang kitlin ito
  rationale: Pinananatili ng “tinutugis” ang talinghaga ng pangangaso, habang likas na ipinahahayag ng “kitlin” ang pagkuha ng buhay sa Filipino.
theological_decisions:
- issue: Moral at politikal na saklaw ng פֶשַׁע sa pagtanggi ni David
  choice: paghihimagsik
  alternative: paglabag; pagsalansang
  rationale: Sa harap ng hari, maaaring tumukoy ang salita hindi lamang sa pangkalahatang paglabag kundi sa rebelyon o kataksilan. Ang “paghihimagsik” ay umaangkop sa agarang politikal na konteksto, habang pinananatili ng talababa ang mas malawak na leksikal na posibilidad.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “ninyo/kayo” bilang magalang na pakikipag-usap ni David kay Haring Saul. Pinanatili ang pag-uulit, ang larawan ng kamay, at ang talinghaga ng pagtugis upang hindi mapatag ang retorika at moral-politikal na tensiyon ng Hebreo.
