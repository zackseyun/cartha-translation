- from: 'At, ama ko, tingnan ninyo—oo, tingnan ninyo ang laylayan[a] ng inyong balabal na nasa kamay ko. Sapagkat nang putulin ko ang laylayan ng inyong balabal, hindi ko kayo pinatay. Alamin ninyo at tingnan: walang kasamaan o paghihimagsik[b] sa aking kamay, at hindi ako nagkasala sa inyo. Gayunman, tinutugis ninyo ang aking buhay upang kitlin ito.[c]'
  to: 'Ama ko, tingnan ninyo—oo, tingnan ninyo ang laylayan[a] ng inyong balabal na nasa kamay ko. Sapagkat nang putulin ko ang laylayan ng inyong balabal, hindi ko kayo pinatay. Matanto ninyo at tingnan ninyo: walang kasamaan o paghihimagsik[b] sa aking kamay, at hindi ako nagkasala sa inyo. Gayunman, tinutugis ninyo ang aking buhay upang kitlin ito.[c]'
