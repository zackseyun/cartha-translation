  yaml_path: translation/ot/1_samuel/024/019.yaml
  text: 'And you have declared today what good you have done to me: when Yahweh gave me into your hand[b][a], you did not kill me.'
translation:
  language: tl
  text: 'At ipinakita mo ngayon ang kabutihang ginawa mo sa akin[a]: nang ibinigay ako ni Yahweh sa iyong kamay[b], hindi mo ako pinatay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ipinaalam mo ngayon ang kabutihang ginawa mo sa akin.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang pandiwa bilang “ipinaubaya ako” o “ibinigay ako sa iyong kapangyarihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגַּדְתָּ
  choice: Ipinakita mo
  rationale: Ang Hiphil ng נגד ay karaniwang nangangahulugang ‘ipahayag’ o ‘ipaalam.’ Sa kontekstong ito, ipinamalas at ginawang hayag ng ginawa ni David ang kanyang kabutihan; natural na naihahayag ito sa Filipino sa ‘ipinakita mo.’
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Tuwirang katumbas ng temporal na pang-abay na ‘today’ at natural sa makabagong Filipino.
- source_word: עָשִׂיתָה אִתִּי טוֹבָה
  choice: ang kabutihang ginawa mo sa akin
  rationale: Pinananatili nito ang konkretong diwa ng ‘kabutihang ginawa mo sa/para sa akin’ nang hindi nililimitahan ang טוֹבָה sa isang mas tiyak na uri ng kagandahang-loob.
- source_word: סִגְּרַנִי
  choice: ibigay ako
  rationale: Sa konteksto, ang סגר ay tumutukoy sa paglalagay sa isang tao sa kapangyarihan ng iba. Ang ‘ibigay ako … sa iyong kamay’ ay nagpapanatili sa Hebreong idyoma at malinaw pa rin sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang ‘Yahweh,’ sa halip na palitan ito ng isang titulo.
- source_word: בְּיָדְךָ
  choice: sa iyong kamay
  rationale: Pinananatili ang Hebreong metapora para sa pagkakalagay sa kapangyarihan ng isang tao; mauunawaan ito sa konteksto.
- source_word: וְלֹא הֲרַגְתָּנִי
  choice: hindi mo ako pinatay
  rationale: Payak, malinaw, at makabagong katumbas ng tahasang pandiwa para sa pagpatay.
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulong ‘Panginoon.’
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang Hebreong talinghagang “sa iyong kamay,” habang ginagamit ang natural na “ipinakita” para sa ginawang hayag sa pamamagitan ng kilos.
