base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/004.yaml
  text: He came to the sheepfolds by the road[a], where there was a cave, and Saul went in to relieve himself. Now David and his men were sitting in the innermost parts of the cave.
translation:
  language: tl
  text: Dumating siya sa mga kulungan ng tupa sa tabi ng daan; may isang yungib doon. Pumasok si Saul upang magbawas[a]. Samantala, nakaupo si David at ang kanyang mga tauhan sa pinakaloob na bahagi ng yungib.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “takpan ang kanyang mga paa,” isang Hebreong idyoma para sa pagbabawas.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדְרוֹת הַצֹּאן
  choice: mga kulungan ng tupa
  rationale: Tumutukoy ang parirala sa mga bakod o kulungang pinaglalagyan ng mga tupa. Likas at malinaw sa modernong Tagalog ang “mga kulungan ng tupa.”
- source_word: עַל הַדֶּרֶךְ
  choice: sa tabi ng daan
  rationale: Inilalarawan nito ang kinaroroonan ng mga kulungan kaugnay ng dinaanan ni Saul; malinaw na naipapahayag ng “sa tabi ng daan” ang diwang ito.
- source_word: מְעָרָה
  choice: isang yungib
  rationale: Karaniwang katumbas ng salita ang “yungib,” at ang anyong walang katiyakan sa Hebreo ay likas na naipapahayag ng “isang.”
- source_word: לְהָסֵךְ אֶת רַגְלָיו
  choice: upang magbawas
  rationale: Isang Hebreong idyoma ito para sa pagdumi. Ang “magbawas” ay isang natural at disenteng eupemismo sa modernong Filipino; inilalagay sa talababa ang literal na larawan ng idyoma.
- source_word: בְּיַרְכְּתֵי הַמְּעָרָה
  choice: sa kaloob-loobang bahagi ng yungib
  rationale: Ipinahihiwatig ng יַרְכְּתֵי ang pinakamalayo o pinakaloob na bahagi. Pinananatili ng salin ang mahalagang detalyeng pangkalawakan sa tagpo.
- source_word: יֹשְׁבִים
  choice: nakaupo
  rationale: Inilalarawan ng participle ang kasalukuyang posisyon nina David at ng kanyang mga tauhan, kaya mas tuwiran ang “nakaupo” kaysa “nanunuluyan” o “nakatira.”
- source_word: וַיָּבֹא ... וַיָּבֹא
  choice: Dumating siya ... Pumasok si Saul
  rationale: Ang unang pandiwa ay nagpapatuloy sa paglalakbay, samantalang ang ikalawa ay tumutukoy sa pagpasok ni Saul sa yungib. Nililinaw ng magkaibang pandiwang Tagalog ang dalawang galaw nang hindi binabago ang pagkakasunod-sunod.
