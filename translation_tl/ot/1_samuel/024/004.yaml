  to: Dumating siya sa mga kulungan ng tupa sa tabi ng daan; may isang yungib doon. Pumasok si Saul upang magbawas[a]. Samantala, nakaupo si David at ang kanyang mga tauhan sa pinakaloob na bahagi ng yungib.
