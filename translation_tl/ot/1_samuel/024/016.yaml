  text: May the LORD be judge and decide between me and you, see and plead my case, and vindicate me from your hand.
translation:
  language: tl
  text: Ang PANGINOON nawa ang maging hukom at magpasya sa pagitan nating dalawa. Tingnan nawa niya at ipagtanggol ang aking usapin, at igawad sa akin ang katarungan laban sa kamay mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na anyo ng Hebreo: “at hatulan niya ako mula sa kamay mo”; ang diwa ay igawad niya sa akin ang katarungan laban sa kapangyarihan mo.'
    reason: Ipinapakita ang di-pangkaraniwang literal na anyo at ang legal na diwa ng Hebreong idyoma, habang hindi nililimitahan ang huling pandiwa sa “pagliligtas” lamang.
lexical_decisions:
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang salin sa malaking titik para sa banal na pangalang YHWH, alinsunod sa marangal at madaling makilalang gamit sa Bibliyang Tagalog.
- source_word: וְשָׁפַט בֵּינִי וּבֵינֶךָ
  choice: magpasya sa pagitan nating dalawa
  rationale: Ipinapahayag nito ang gawa ng hukom na nagpapasya sa alitan, habang iniiwasan ang mabigat na pag-uulit ng “hukom” at “humatol.”
- source_word: וְיָרֵב אֶת־רִיבִי
  choice: ipagtanggol ang aking usapin
  rationale: Pinananatili ang legal na larawan ng pagtatanggol o pagsusulong sa kaso ng nagsasalita.
- source_word: וְיִשְׁפְּטֵנִי מִיָּדֶךָ
  choice: sa kanyang paghatol ay iligtas ako sa kamay mo
  rationale: Inilalahad sa likas na Tagalog ang idiomatikong diwa ng paghatol na pabor sa nagsasalita at pagliligtas mula sa kapangyarihan ng kausap, habang pinananatili ang larawang “kamay.”
theological_decisions:
- issue: Ang papel ng PANGINOON bilang hukom at tagapagtanggol
  choice: Pinanatiling panalangin o hangarin sa pamamagitan ng “nawa,” nang hindi ipinapalagay ang magiging pasya.
  alternative: 'Isalin bilang tiyak na pahayag: “Ang PANGINOON ang magiging hukom.”'
  rationale: Ang anyong Hebreo ay maaaring pormal na pahayag na may mapanawagang lakas; ang konteksto at magkakasunod na pandiwa ay angkop na ipahayag bilang paghiling na ang Diyos ang humatol, nang hindi paunang nilulutas ang hatol.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Pinanatili ang legal na talinghaga—hukom, magpasya, usapin, at paghatol—gayundin ang Hebreong larawan ng “kamay.”
