base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/013.yaml
  text: May Yahweh judge between me and you[a], and may Yahweh avenge me on you[c][b]; but my hand will not be against you.
translation:
  language: tl
  text: Humatol nawa si Yahweh sa pagitan ko at sa iyo, at maghiganti nawa si Yahweh para sa akin laban sa iyo; ngunit hindi kita pagbubuhatan ng kamay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ngunit ang kamay ko ay hindi magiging laban sa iyo,” isang Hebreong pahayag na tumutukoy sa pagtanggi ng nagsasalita na kumilos nang marahas o mapanlaban laban sa kausap.
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: Hatulan nawa
  rationale: Ang yiqtol ay may pakiusap o paghiling na diwa rito, kaya ang “nawa” ay angkop kaysa payak na panghinaharap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: tayo
  rationale: Natural sa Filipino ang “hatulan tayo” para sa paghatol sa pagitan ng dalawang panig; malinaw sa konteksto na sina David at Saul ang tinutukoy.
- source_word: וּנְקָמַנִי ... מִמֶּךָּ
  choice: at ipaghiganti nawa ako ... sa iyo
  rationale: Pinananatili nito ang matinding diwa ng נקם at malinaw na si Yahweh, hindi si David, ang hinihiling na gumanti laban kay Saul.
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: ngunit hindi kita pagbubuhatan ng kamay
  rationale: Natural na idyomang Filipino ito para sa hindi paggawa ng marahas o mapanlabang kilos, habang pinananatili ang larawan ng “kamay” sa Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa tekstong pinagmulan.
- issue: Ang panawagan ni David para sa נקם
  choice: Hinihiling ni David na si Yahweh ang maghiganti para sa kanya, samantalang tumatanggi siyang personal na manakit kay Saul.
  alternative: Hinihiling lamang ni David ang pangkalahatang pagpapawalang-sala.
  rationale: Malinaw na pinagtatapat ng talata ang paghatol at paghihiganti ni Yahweh sa hindi pagbubuhat ng kamay ni David; hindi pinalalambot ang tensiyong ito.
translation_notes:
  register: Makabagong, dignificado, at madaling maunawaang Filipino. Ginamit ang “pagbubuhatan ng kamay” bilang natural na katumbas ng Hebreong idyoma, at pinanatili ang “Yahweh” bilang banal na pangalan.
