  register: Makabagong, malinaw, at marangal na Tagalog. Inayos nang bahagya ang pagkakasunod ng mga sugnay upang maging natural sa Filipino habang pinananatili ang direksiyon ng paglalakbay at ang pansamantalang pananatili ni David.
