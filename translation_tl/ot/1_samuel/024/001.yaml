  text: Then David went up from there and stayed in the strongholds of En-gedi.
translation:
  language: tl
  text: Pagkatapos, umakyat si David mula roon at nanatili sa mga tanggulan ng En-Gedi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Pinananatili nito ang diwa ng paitaas na pagkilos na karaniwang ipinahihiwatig ng עלה, at natural ito sa salaysay.
- source_word: מִשָּׁם
  choice: mula roon
  rationale: Tuwiran at likas na katumbas ng panandang tumutukoy sa pinanggalingang lugar.
- source_word: וַיֵּשֶׁב
  choice: doon siya nanatili
  rationale: Sa kontekstong ito, ang ישב ay tumutukoy sa pansamantalang pananatili, hindi kinakailangang permanenteng paninirahan.
- source_word: בִּמְצָדוֹת
  choice: sa matitibay na taguan
  rationale: Tumutukoy ang מְצָדוֹת sa mga ligtas at madaling ipagtanggol na lugar. Iniiwasan ng 'matitibay na taguan' ang labis na pahiwatig na mga itinayong kuta ang mga ito.
- source_word: עֵין גֶּדִי
  choice: En-gedi
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng transliterasyon, ayon sa karaniwang anyo sa mga saling Tagalog.
