revisions:
- from: Sinabi ng mga tauhan ni David sa kanya, “Tingnan mo, ito ang araw na sinabi ni Yahweh sa iyo, ‘Tingnan mo, ibinibigay ko sa iyong kamay ang iyong kaaway, at magagawa mo sa kanya ang anumang mabuti sa paningin mo[a].’” Pagkatapos, tumindig si David at palihim na pinutol ang laylayan ng balabal ni Saul.
  to: Sinabi ng mga tauhan ni David sa kanya, “Tingnan mo, ito ang araw na tinukoy ni Yahweh nang sabihin niya sa iyo, ‘Tingnan mo, ibinibigay ko sa iyong kamay ang iyong kaaway, at magagawa mo sa kanya kung ano ang mabuti sa paningin mo[a].’” Pagkatapos, tumindig si David at palihim na pinutol ang laylayan ng balabal ni Saul.
  rationale: Inayos ang nakapaloob na pagsipi upang malinaw na ang mga tauhan ay tumutukoy sa isang pahayag ni Yahweh, nang hindi pinatitibay o pinabubulaanan ng salin ang kanilang pag-aangkin. Inayos din ang idyoma para manatiling malapit sa Hebreo at natural sa modernong Tagalog; binago ang talababa upang mapanatili ang diwang ‘mabuti’ sa halip na simpleng ‘gusto.’
