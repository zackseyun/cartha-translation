  text: וַ/יֹּאמְרוּ֩ אַנְשֵׁ֨י דָוִ֜ד אֵלָ֗י/ו הִנֵּ֨ה הַ/יּ֜וֹם אֲֽשֶׁר אָמַ֧ר יְהוָ֣ה אֵלֶ֗י/ךָ הִנֵּ֨ה אָנֹכִ֜י נֹתֵ֤ן אֶת איבי/ך בְּ/יָדֶ֔/ךָ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֖ר יִטַ֣ב בְּ/עֵינֶ֑י/ךָ וַ/יָּ֣קָם דָּוִ֗ד וַ/יִּכְרֹ֛ת אֶת כְּנַֽף הַ/מְּעִ֥יל אֲשֶׁר לְ/שָׁא֖וּל בַּ/לָּֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/005.yaml
  text: Then David’s men said to him[a], “Look, this is the day of which Yahweh said to you, ‘Look, I am giving your enemy into your hand, and you may do to him as seems good in your eyes.’” Then David arose and secretly cut off the corner of Saul’s robe.
translation:
  language: tl
  text: Sinabi ng mga tauhan ni David sa kanya, “Tingnan mo, ito ang araw na tinukoy ni Yahweh nang sabihin niya sa iyo, ‘Tingnan mo, ibinibigay ko sa iyong kamay ang iyong kaaway, at magagawa mo sa kanya kung ano ang mabuti sa paningin mo[a].’” Pagkatapos, tumindig si David at palihim na pinutol ang laylayan ng balabal ni Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas natural, “kung ano ang sa palagay mo ay mabuti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa modernong Tagalog ang payak na “Sinabi” sa ganitong pagkakasunod-sunod.
- source_word: אַנְשֵׁי דָוִד
  choice: mga tauhan ni David
  rationale: Tumutukoy ang pariralang konstrakto sa mga lalaking tagasunod ni David; malinaw at natural ang “mga tauhan ni David.”
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pinananatili nito ang mariing pantawag-pansin ng salitang Hebreo nang hindi gumagamit ng lipas na pananalita. Isinalin din ito sa ikalawang paglitaw.
- source_word: הַיּוֹם
  choice: ito ang araw
  rationale: Kasama ng הִנֵּה, ipinakikita nito na ang kasalukuyang pagkakataon ang tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang pantanging pangalan ng Diyos sa tekstong Hebreo.
- source_word: נֹתֵן
  choice: ibinibigay ko
  rationale: Pinananatili ng anyong pangkasalukuyan ang masigla at nalalapit na diwa ng participle sa tuwirang pananalita.
- source_word: איבי/ך
  choice: iyong kaaway
  rationale: Isahan ang hinihingi ng konteksto at ng mga kasunod na panghalip; si Saul ang partikular na tinutukoy.
- source_word: בְּיָדֶךָ
  choice: sa iyong kamay
  rationale: Pinananatili ang larawang Hebreo ng pagpapasailalim sa kapangyarihan ng isang tao, at nauunawaan ito sa Tagalog.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: magagawa mo sa kanya
  rationale: Ipinahihiwatig sa konteksto ang kalayaang kumilos matapos ibigay ang kaaway, nang hindi ito ginagawang tahasang utos.
- source_word: כַּאֲשֶׁר יִטַב בְּעֵינֶיךָ
  choice: ang anumang mabuti sa paningin mo
  rationale: Pinananatili ang idyomang Hebreo at ang pagsusuri ng tauhan sa kung ano ang mabuti; inilalagay sa talababa ang mas natural na katumbas.
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Ang pandiwa ay nagpapahiwatig na bumangon si David upang kumilos; marangal ngunit karaniwang salitang Tagalog ang “tumindig.”
- source_word: וַיִּכְרֹת
  choice: pinutol
  rationale: Ipinapahayag nito ang natapos na pagputol ng isang bahagi mula sa kasuotan.
- source_word: כְּנַף הַמְּעִיל
  choice: laylayan ng balabal
  rationale: Ang כָּנָף ng kasuotan ay ang gilid o laylayan nito, at ang מְעִיל ay isang panlabas na balabal.
- source_word: בַּלָּט
  choice: palihim
  rationale: Tumpak at natural nitong ipinahahayag na ginawa ni David ang pagputol nang hindi napapansin.
theological_decisions:
- issue: Kung ang siniping sinabi tungkol kay Yahweh ay dapat ituring na tiyak na naunang pahayag ng Diyos o bilang pagkaunawa ng mga tauhan ni David
  choice: 'Iniulat nang tuwiran ang pahayag ng mga tauhan: “ang araw na sinabi ni Yahweh sa iyo.”'
  alternative: Maaaring ilayo ang salaysay sa kanilang palagay sa pamamagitan ng pagpaparaprasang “ang araw na ipinangako ni Yahweh,” o ipahiwatig nang mas mariin na may kilalang tiyak na orakulo.
  rationale: Iniulat lamang ng Hebreo ang sinabi ng mga tauhan ni David. Hindi dapat pagtibayin o pabulaanan ng salin ang kanilang pagkaunawa nang higit sa ginagawa ng salaysay, kaya pinananatili ang teolohikal na tensiyon.
- issue: Kung ang וְעָשִׂיתָ ay tahasang utos, hula, o pahintulot
  choice: “magagawa mo sa kanya”
  alternative: “gawin mo sa kanya” o “gagawin mo sa kanya”
  rationale: Maaaring dalhin ng anyo ang higit sa isang modal na pakahulugan. Sa konteksto, ipinapakita ng sinabi ng mga tauhan ang pagkakataon o pahintulot kay David, ngunit hindi ginagawang tuwirang utos ng salin ang pagpatay kay Saul.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Iniwasan ang lipas na “Narito” bilang katumbas ng הִנֵּה at pinanatili ang larawang “sa iyong kamay” at “sa paningin mo” kung saan nananatiling mauunawaan ang mga ito.
