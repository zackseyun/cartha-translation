  text: וַ/יֹּ֨אמֶר֙ אֶל דָּוִ֔ד צַדִּ֥יק אַתָּ֖ה מִמֶּ֑/נִּי כִּ֤י אַתָּה֙ גְּמַלְתַּ֣/נִי הַ/טּוֹבָ֔ה וַ/אֲנִ֖י גְּמַלְתִּ֥י/ךָ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/018.yaml
  text: And he said to David[a], “You are more righteous than I, for you have repaid me with good, while I have repaid you with evil.”
translation:
  language: tl
  text: At sinabi niya kay David, “Mas matuwid ka kaysa sa akin[a], sapagkat ginantihan mo ako ng mabuti, samantalang ginantihan naman kita ng masama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Mas nasa tama ka kaysa sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־דָּוִד
  choice: At sinabi niya kay David
  rationale: Pinananatili ang karaniwang daloy ng salaysay at ang panghalip na “niya”; si Saul ang nagsasalita ayon sa konteksto, ngunit hindi tahasang binanggit ang pangalan niya sa sugnay.
- source_word: צַדִּיק אַתָּה מִמֶּנִּי
  choice: Mas matuwid ka kaysa sa akin
  rationale: Ang צַדִּיק ay maaaring tumukoy sa pagiging matuwid o nasa tama. Likas sa modernong Tagalog ang paghahambing na “mas matuwid... kaysa,” at pinananatili nito ang moral na bigat ng pahayag.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng naunang pahayag; ang “sapagkat” ay malinaw, marangal, at angkop sa register ng salaysay.
- source_word: גְּמַלְתַּנִי הַטּוֹבָה
  choice: ginantihan mo ako ng mabuti
  rationale: Ipinapahayag ng גמל ang pagtrato o pagganti sa isang tao ayon sa ginawa. Ang “ginantihan... ng mabuti” ay natural sa Tagalog at pinananatili ang pagtutumbas sa kasunod na sugnay.
- source_word: וַאֲנִי
  choice: samantalang
  rationale: Bagaman literal na “at ako,” malinaw na pasalungat ang ugnayan ng dalawang magkatimbang na sugnay; natural na ipinahahayag ito ng “samantalang.”
- source_word: גְּמַלְתִּיךָ הָרָעָה
  choice: ginantihan naman kita ng masama
  rationale: Inuulit ang pandiwang “ginantihan” upang mapanatili ang leksikal at retorikal na paralelismo ng Hebreo, habang ang “mabuti/masama” ay nagpapanatili ng tuwirang pagsalungat.
theological_decisions:
- issue: Saklaw ng צַדִּיק sa paghahambing
  choice: Mas matuwid ka kaysa sa akin
  alternative: Mas nasa tama ka kaysa sa akin
  rationale: Pinili ang “matuwid” upang mapanatili ang moral na dimensiyon ng pagtatapat ni Saul, ngunit inilalahad sa talababa ang lehitimong kahulugang forensic o situational na “nasa tama.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “David,” ang karaniwang anyo ng pangalan sa Tagalog. Pinanatili ang balanseng paralelismo ng “ginantihan... ng mabuti / ginantihan... ng masama,” at inilagay ang marker [a] kaagad sa pariralang tinutukoy nito.
