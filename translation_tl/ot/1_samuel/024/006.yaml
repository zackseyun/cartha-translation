  text: Afterward David’s heart struck him because he had cut off the corner of Saul’s robe[a][b].
translation:
  language: tl
  text: Pagkatapos nito, sinaktan siya ng puso ni David[a] dahil pinutol niya ang sulok ng balabal ni Saul.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sinaktan siya ng puso ni David,” isang idyomang nagpapahayag ng pagkabagabag ng budhi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dulo” o “laylayan” ng balabal ni Saul; ang salitang Hebreo ay maaaring tumukoy sa dulong bahagi ng isang kasuotan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na panandang temporal sa makabagong Filipino na malinaw na nag-uugnay sa naunang ginawa ni David.
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: sinumbatan si David ng kanyang puso
  rationale: Pinananatili ang “puso” bilang simuno at ang matingkad na larawang Hebreo, habang ipinahahayag sa natural na Filipino ang pagkabagabag ng kanyang kalooban.
- source_word: לֵב
  choice: puso
  rationale: Ang Hebreong salita ay tumutukoy sa panloob na pagkatao at kamalayang moral; hindi ito tuwirang pinalitan ng mas interpretibong “budhi.”
- source_word: עַל אֲשֶׁר
  choice: dahil
  rationale: Malinaw at natural nitong ipinakikita ang dahilan ng pagkabagabag ni David.
- source_word: כָּרַת
  choice: pinutol
  rationale: Tumpak na ipinahahayag ang pagputol sa bahagi ng kasuotan; sapat na sa Filipino ang aspektong perpektibo upang ipakitang nauna na ang kilos.
- source_word: כָּנָף
  choice: sulok
  rationale: Ang literal na “pakpak” ay ginagamit din sa dulo o sulok ng isang kasuotan. Hindi ito nilimitahan sa mas tiyak na “laylayan.”
- source_word: אֶת כָּנָף אֲשֶׁר לְשָׁאוּל
  choice: ang sulok ng balabal ni Saul
  rationale: Ang “balabal” ay ipinahiwatig ng naunang konteksto at nilinaw rito upang maging likas at madaling maunawaan sa Filipino.
