  terminology: Tama at pare-pareho ang “Yahweh” para sa יהוה. Ang “Gantihan ... ng kabutihan” ay nauunawaan, ngunit ang “gantihan” ay may karaniwang kaugnayan din sa paghihiganti; “Suklian ... ng mabuti” ay mas malinaw na positibong katumbas ng שׁלם טובה at nananatiling naaangkop sa isang basbas.
