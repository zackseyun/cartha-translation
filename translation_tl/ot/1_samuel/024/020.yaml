  - severity: low
    issue: Maaaring maling madama ang “Gantihan ... ng kabutihan.”
    rationale: Bagaman posible ang kahulugan, ang “gantihan” sa kasalukuyang gamit ay madalas may bahid ng paghihiganti. Ang “suklian ... ng mabuti” ay mas malinaw na positibong ganti at mas natural sa basbas.
