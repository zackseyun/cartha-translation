base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/020.yaml
  text: For when a man finds his enemy and lets him go on his way safely[b][a], may Yahweh repay you with good for what you have done to me this day.
translation:
  language: tl
  text: Sapagkat kapag natagpuan ng isang tao ang kanyang kaaway, hahayaan ba niya itong makaalis nang ligtas?[a] Suklian ka nawa ni Yahweh ng mabuti dahil sa ginawa mo sa akin sa araw na ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “at pinayaon niya siya sa mabuting daan.” Maaari ring isalin: “at pinaalis niya nang payapa” o “at hinayaan niya itong makaalis nang ligtas.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari rin: “Suklian ka ni Yahweh ng mabuti.” Ang anyong Hebreo ay maaaring unawain bilang isang hangarin o basbas, o bilang pahayag tungkol sa mangyayari.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי יִמְצָא אִישׁ אֶת אֹיְבוֹ
  choice: Sapagkat kapag natagpuan ng isang tao ang kanyang kaaway
  rationale: Ang וְכִי ay nagpapakilala ng paliwanag na pangkalahatang pahayag; natural sa Filipino ang “Sapagkat kapag.” Ang אִישׁ ay panlalaking isahan ngunit pangkalahatan ang gamit, kaya “isang tao” ang malinaw at likas na katumbas.
- source_word: וְשִׁלְּחוֹ בְּדֶרֶךְ טוֹבָה
  choice: palalayain ba niya itong ligtas na makaalis?
  rationale: 'Sa konteksto, retorikal ang pangungusap: karaniwang hindi ligtas na pinauuwi ng tao ang kaaway na nasa kapangyarihan niya. Ipinahahayag ng “ligtas na makaalis” ang idyomatikong diwa ng literal na “sa mabuting daan,” habang iniiwasang magmukhang paglalarawan lamang ito ng isang kalsada.'
- source_word: וַיהוָה יְשַׁלֶּמְךָ טוֹבָה
  choice: Gantihan ka nawa ni Yahweh ng kabutihan
  rationale: Pinananatili ng “Yahweh” ang personal na banal na pangalan. Ang “nawa” ay naglalahad ng natural na basbas o hangarin, at ang “gantihan … ng kabutihan” ay nagpapanatili sa diwa ng שׁלם at טוֹבָה.
- source_word: תַּחַת הַיּוֹם הַזֶּה אֲשֶׁר עָשִׂיתָה לִי
  choice: dahil sa ginawa mo sa akin sa araw na ito
  rationale: Ang תַּחַת ay nagpapahayag ng katumbas na ganti o kapalit. Natural sa Filipino ang “dahil sa” sa ganitong pangungusap, at pinananatili ang “sa akin” at “sa araw na ito.”
theological_decisions:
- issue: Pagbigkas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Anyo ng יְשַׁלֶּמְךָ bilang hangarin o pahayag
  choice: Gantihan ka nawa
  alternative: Gagantihan ka
  rationale: Maaaring marinig ang yiqtol bilang basbas o hangarin at maaari rin bilang prediksiyon. Ang pangunahing teksto ay gumagamit ng hangarin, habang itinatala sa talababa ang posibleng pahayag sa hinaharap.
- issue: Retorikal na puwersa ng unang sugnay
  choice: palalayain ba niya
  alternative: at pinalalaya niya
  rationale: Bagaman walang tahasang pantanong na kataga sa Hebreo, ang pangungusap sa konteksto ay karaniwang nauunawaang retorikal. Ang tanong sa Filipino ang malinaw na naghahatid ng puwersang ito nang hindi binabago ang proposisyon.
translation_notes:
  register: Makabago at marangal na Filipino, na madaling maunawaan sa pagbasa nang malakas. Ginamit ang “isang tao” bilang natural na pangkalahatang katumbas ng אִישׁ, at “ligtas na makaalis” upang maipahayag ang idyomatikong kahulugan ng בְּדֶרֶךְ טוֹבָה.
