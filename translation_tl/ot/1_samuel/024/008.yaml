base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/008.yaml
  text: David restrained his men with words and did not allow them to rise up against Saul[a]. Then Saul rose from the cave and went on his way.
translation:
  language: tl
  text: Pinigilan[a] ni David ang kanyang mga tauhan sa pamamagitan ng mga salita at hindi niya sila pinahintulutang tumindig laban kay Saul. Pagkatapos, tumindig si Saul mula sa kuweba at nagpatuloy sa kanyang lakad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Matindi niyang sinaway ang kanyang mga tauhan sa pamamagitan ng mga salita.” Bihira ang pandiwang Hebreo at maaaring mas matindi ang diwa nito kaysa sa simpleng pagpigil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁסַּע
  choice: Pinigilan
  rationale: Bihira at mahirap ang pandiwa. Sa konteksto, sapilitang napigilan ni David ang kanyang mga tauhan na kumilos laban kay Saul. Malinaw na ipinahahayag ng “pinigilan” ang kinalabasan nang hindi ipinapasok sa pangunahing teksto ang mas marahas ngunit hindi tiyak na larawan ng pandiwa.
- source_word: אֲנָשָׁיו
  choice: ang kanyang mga tauhan
  rationale: Tumutukoy ito sa mga lalaking tagasunod ni David na kasama niya sa kuweba. Ang “mga tauhan” ay likas at tiyak sa ganitong konteksto.
- source_word: בַּדְּבָרִים
  choice: sa pamamagitan ng mga salita
  rationale: 'Pinananatili nito ang instrumental na diwa: mga salita ang ginamit ni David upang pigilan sila. Hindi idinaragdag ang “mga salitang ito,” na hindi tahasang nasa Hebreo.'
- source_word: וְלֹא נְתָנָם
  choice: hindi niya sila pinahintulutan
  rationale: Ang נתן na sinusundan ng pawatas ay maaaring magpahayag ng pagpapahintulot. Ang salin ay malinaw, moderno, at tapat sa kayarian.
- source_word: לָקוּם אֶל־שָׁאוּל
  choice: tumindig laban kay Saul
  rationale: Pinananatili ang larawan ng קום at ang salungat na diwa ng אֶל sa kontekstong ito, sa halip na tahasang gawing “salakayin,” na mas interpretatibo.
- source_word: קָם מֵהַמְּעָרָה
  choice: tumindig si Saul mula sa kuweba
  rationale: Pinananatili ang pag-uulit ng pandiwang קום sa dalawang sugnay. Ang “tumindig” ay nauunawaan bilang pagbangon at pag-alis mula sa kinaroroonan.
- source_word: וַיֵּלֶךְ בַּדָּרֶךְ
  choice: nagpatuloy sa kanyang lakad
  rationale: Likas itong salin sa Filipino para sa pag-alis at pagpapatuloy ng paglalakbay na ipinahihiwatig ng Hebreong parirala.
