base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/022.yaml
  text: Now swear to me by Yahweh that you will not cut off my descendants after me[c][b][a], and that you will not wipe out my name from my father's house.
translation:
  language: tl
  text: Ngayon, sumumpa ka sa akin sa ngalan ni Yahweh na hindi mo lilipulin ang mga inapo ko kapag wala na ako[a][b], at hindi mo papawiin ang pangalan ko[c] mula sa angkan ng aking ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, literal na “kung” ang ginamit sa pormula ng panunumpa; sa konteksto, ipinakikilala nito ang pangakong hinihingi ni Saul: “na hindi…”'
    reason: lexical_alternative
  - marker: b
    text: O “mga supling ko.”
    reason: lexical_alternative
  - marker: c
    text: Ang “pangalan ko” ay tumutukoy dito sa patuloy na alaala at pagkakakilanlan ng linya ng pamilya ni Saul sa loob ng kanyang angkan.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Pangwakas na panandang diskurso ito na nag-uugnay sa naunang sinabi ni Saul at nagpapakilala sa kanyang kahilingan.
- source_word: הִשָּׁבְעָה לִּי
  choice: ipangako mo sa akin
  rationale: Ang Nifal na pautos ng שבע ay humihiling ng sinumpaang pangako. Mas natural sa modernong Tagalog ang “ipangako,” habang malinaw na ipinakikita ng kasunod na pariralang “sa ngalan ni Yahweh” na panunumpa ito.
- source_word: בַּיהוָה
  choice: sa ngalan ni Yahweh
  rationale: Pormula ito ng panunumpa na tumatawag sa banal na pangalan bilang saksi at garantiya.
- source_word: אִם ... וְאִם
  choice: na hindi ... at hindi
  rationale: Sa pormula ng panunumpa, literal na “kung” ang אִם ngunit ipinakikilala rito ang nilalaman ng pangakong hinihingi ni Saul. Kailangang ipahayag sa Tagalog ang negatibong diwa ayon sa gamit at konteksto.
- source_word: תַּכְרִית
  choice: lilipulin
  rationale: Ang Hiphil ng כרת ay nangangahulugang alisin o putulin ang pagpapatuloy ng isang angkan; ang “lilipulin” ay natural at sapat ang lakas sa kontekstong dinastiko.
- source_word: זַרְעִי
  choice: mga inapo ko
  rationale: Ang זֶרַע ay tumutukoy rito sa mga supling o salinlahi, hindi sa literal na binhi.
- source_word: אַחֲרָי
  choice: pagkamatay ko
  rationale: Literal itong “pagkatapos ko,” ngunit sa konteksto ay malinaw na tumutukoy sa panahon pagkamatay ni Saul. Inilalantad ng salin ang temporal na diwa nang hindi binabago ang kahilingan.
- source_word: תַּשְׁמִיד
  choice: papawiin
  rationale: Ang Hiphil ng שמד ay nagpapahayag ng lubusang pag-alis o pagwasak; ang “papawiin” ay angkop sa kasunod na “pangalan.”
- source_word: שְׁמִי
  choice: pangalan ko
  rationale: Pinananatili ang konkretong larawang Hebreo; tumutukoy ito sa patuloy na pagkakakilanlan at alaala ng linya ng pamilya ni Saul.
- source_word: מִבֵּית אָבִי
  choice: mula sa angkan ng aking ama
  rationale: Ang בֵּית אָב ay sambahayan o angkang nagmumula sa ama. Mas malinaw sa ordinaryong Tagalog ang “angkan ng aking ama” kaysa literal na “bahay ng aking ama.”
theological_decisions:
- issue: Paglalarawan sa pormula ng panunumpa
  choice: ipangako mo sa akin sa ngalan ni Yahweh
  alternative: sumumpa ka sa akin kay Yahweh
  rationale: Pinananatili ang banal na pangalan at ang katangiang panunumpa ng pahayag, ngunit gumagamit ng natural at dignidad na Tagalog. Hindi nito tinutukoy kung ano ang eksaktong ritwal ng panunumpa.
- issue: Pagbibigay ng negatibong diwa ng אִם sa panunumpa
  choice: na hindi ... at hindi
  alternative: kung lilipulin mo ... at kung papawiin mo
  rationale: Sa ganitong Hebreong pormula, ang אִם ay hindi payak na kondisyon kundi bahagi ng eliptikong panunumpa. Ang literal na “kung” ay magiging malabo at tila kabaligtaran ng hinihingi ni Saul; ang negatibong salin ang naghahatid ng pragmatikong diwa habang itinatala sa talababa ang anyong literal.
translation_notes:
  register: Modernong Filipino Tagalog na dignidad ngunit madaling maunawaan. Ginamit ang “angkan” para sa sinaunang sambahayang nagmumula sa ama, at iniwasan ang sobrang literal na pormulang hindi natural sa Tagalog.
