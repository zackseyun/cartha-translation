  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: hinihiling ni Saul ang isang panunumpa kay Yahweh na huwag lipulin ni David ang kanyang mga inapo at huwag burahin ang kanyang pangalan mula sa sambahayan/angkan ng kanyang ama. Gayunman, ang “Kaya ngayon” ay nagdaragdag ng mas malinaw na lohikal na pagbibigay-katwiran kaysa sa simpleng panandang diskurso na וְעַתָּה. Ang “sumumpa” ay mas tuwirang katumbas ng pautos na הִשָּׁבְעָה kaysa “ipangako.”'
  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “Ngayon, sumumpa ka sa akin sa ngalan ni Yahweh.” Ang “kapag wala na ako” ay isang idiomatikong paglalapat ng temporal na “pagkatapos ko” nang hindi tahasang idinadagdag ang kamatayan sa teksto.
  terminology: Pinananatili ang “Yahweh,” “mga inapo,” “pangalan,” at “angkan ng aking ama.” Ang “papawiin ang pangalan” ay angkop sa larawang Hebreo ng pagbura sa patuloy na pagkakakilanlan o alaala ng isang angkan. Inilipat ang angkla ng talababa tungkol sa “pangalan” upang tumukoy ito sa mismong salitang ipinaliliwanag.
