  yaml_path: translation/ot/1_samuel/024/014.yaml
  text: As the ancient proverb says[a], ‘Wickedness comes out from the wicked,’ but my hand will not be against you.
translation:
  language: tl
  text: Gaya ng sinasabi ng sinaunang kawikaan[a], “Sa masasama nagmumula ang kasamaan.” Ngunit hindi kita pagbubuhatan ng kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Gaya ng sinasabi ng kawikaan ng mga sinauna.” Maaaring unawain ang salitang Hebreo bilang “sinauna” o bilang tumutukoy sa “mga sinauna.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר יֹאמַר
  choice: Gaya ng sinasabi
  rationale: Likas na pormula sa Filipino para sa paghahambing at pagbanggit ng isang kasabihang patuloy na kinikilala.
- source_word: מְשַׁל
  choice: kawikaan
  rationale: Tumutukoy rito sa isang maikli at tradisyonal na aral o kasabihan, hindi sa isang mahabang talinghaga.
- source_word: הַקַּדְמֹנִי
  choice: sinaunang
  rationale: Pinananatili ang pangunahing diwang ‘mula sa unang panahon’; inilalahad sa talababa ang posibleng pag-uugnay nito sa ‘mga sinauna.’
- source_word: מֵרְשָׁעִים יֵצֵא רֶשַׁע
  choice: Sa masasama nagmumula ang kasamaan
  rationale: Malinaw na ipinahahayag ang pinagmulan na minamarkahan ng מִן at pinananatili ang ugnayang-salita ng ‘masasama/kasamaan.’
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: Ngunit hindi kita pagbubuhatan ng kamay
  rationale: Natural na idyomang Filipino na pinananatili ang larawan ng kamay at malinaw na nagpapahiwatig na hindi sasaktan ni David si Saul; ang וְ ay adversatibo sa konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘kawikaan’ para sa tradisyonal na kasabihan, at ang karaniwang idyomang ‘pagbubuhatan ng kamay’ upang mapanatili ang larawan ng Hebreo nang hindi maging asiwa ang pangungusap.
