  text: וַ/יִּשָּׁבַ֥ע דָּוִ֖ד לְ/שָׁא֑וּל וַ/יֵּ֤לֶךְ שָׁאוּל֙ אֶל בֵּית֔/וֹ וְ/דָוִד֙ וַֽ/אֲנָשָׁ֔י/ו עָל֖וּ עַל הַ/מְּצוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/023.yaml
  text: So David swore to Saul. Then Saul went to his house[a], but David and his men went up to the stronghold.
translation:
  language: tl
  text: Kaya nanumpa si David kay Saul. Pagkatapos, umuwi si Saul, ngunit umakyat si David at ang kanyang mga tauhan sa kuta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at umakyat si David at ang kanyang mga tauhan sa kuta.” Ang pang-ugnay sa Hebreo ay simpleng “at”; ipinakikita ng “ngunit” sa pangunahing teksto ang pagkakaiba ng ginawa at pinuntahan nina Saul at David.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: nanumpa
  rationale: Ang Niphal ng שׁבע ay nangangahulugang manumpa o magbigay ng sumpa; natural at tuwiran sa salaysay ang “nanumpa.”
- source_word: לְשָׁאוּל
  choice: kay Saul
  rationale: Tinutukoy ng ל ang taong pinangakuan sa ilalim ng sumpa; “kay Saul” ang likas na anyo sa Tagalog.
- source_word: וַיֵּלֶךְ שָׁאוּל אֶל בֵּיתוֹ
  choice: Pagkatapos, umuwi si Saul
  rationale: Bagaman literal na “pumunta si Saul sa kanyang bahay,” malinaw at natural na naihahatid ng “umuwi” ang diwa ng pagpunta sa sariling tahanan.
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: ngunit ... si David at ang kanyang mga tauhan
  rationale: Ang וְ ay literal na “at,” ngunit malinaw na may salungat na kilos at destinasyon sina Saul at David; natural na ipinahahayag ito ng “ngunit” sa Tagalog, habang itinatala sa talababa ang literal na alternatibo.
- source_word: עָלוּ
  choice: umakyat
  rationale: Pinananatili nito ang direksiyonal na kahulugan ng עלה at natural sa konteksto ng pagpunta sa mataas o mahirap marating na kuta.
- source_word: הַמְּצוּדָה
  choice: kuta
  rationale: Ang מְצוּדָה ay isang pinatibay at ligtas na kanlungan; “kuta” ang maikli, karaniwan, at angkop na salin.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang “mga tauhan” para sa mga lalaking tagasunod ni David sa kontekstong militar, at “umuwi” bilang likas na salin ng pagpunta ni Saul sa sarili niyang bahay.
