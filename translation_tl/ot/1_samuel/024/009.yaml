revisions:
- from: Pagkatapos nito, tumayo si David at lumabas sa yungib. Tinawag niya si Saul mula sa likuran, “Panginoon ko, ang hari!” Nang lumingon si Saul, yumukod si David nang nakaharap sa lupa at nagpatirapa.[a]
  to: Pagkatapos nito, tumayo si David at lumabas sa yungib. Tumawag si David kay Saul na nasa unahan niya, “Panginoon kong hari!” Nang lumingon si Saul, yumukod si David, na ang mukha ay nakaharap sa lupa, at nagpatirapa.[a]
  rationale: Inayos ang ilang pananalita para maging mas likas at malinaw sa modernong Filipino, habang pinananatili ang direksiyonal na diwa ng pagtawag ni David kay Saul, ang magalang na pagharap sa hari, at ang magkahiwalay na kilos ng pagyukod at pagpapatirapa. Itinama rin ang terminolohiya ng talababa.
