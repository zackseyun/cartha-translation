base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/009.yaml
  text: After that David rose and went out of the cave[a], and called after Saul, saying, “My lord the king!” When Saul looked behind him, David bowed with his face to the ground and prostrated himself.
translation:
  language: tl
  text: Pagkatapos nito, tumayo si David at lumabas sa yungib. Tumawag si David kay Saul na nasa unahan niya, “Panginoon kong hari!” Nang lumingon si Saul, yumukod si David, na ang mukha ay nakaharap sa lupa, at nagpatirapa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “yumukod nang napakababa.” Ang pandiwang Hebreo ay maaaring tumukoy sa matinding pagyukod bilang paggalang o pagpupugay; dito, inilalarawan nito ang kilos ni David sa harap ni Saul, hindi ang pagsamba sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumayo
  rationale: Karaniwang ipinahihiwatig ng Qal ng קום ang pagbangon o pagtayo; ang “tumayo” ay tuwiran at natural sa salaysay.
- source_word: אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Pinananatili nito ang payak na pagkakasunod-sunod ng mga pangyayari.
- source_word: וַיֵּצֵא מִן־הַמְּעָרָה
  choice: lumabas sa yungib
  rationale: Tuwirang ipinapahayag ng יצא ang paglabas, at ang “yungib” ay malinaw at marangal na katumbas ng מְעָרָה.
- source_word: וַיִּקְרָא אַחֲרֵי שָׁאוּל
  choice: Tinawag niya si Saul mula sa likuran
  rationale: Ipinahihiwatig ng קרא kasunod ng אַחֲרֵי na tinawag ni David si Saul habang nasa likuran niya; natural itong ipinahahayag sa Filipino nang hindi dinaragdagan ang kilos.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Panginoon ko, ang hari
  rationale: Pinananatili ang magalang na personal na pagtawag na אֲדֹנִי at ang maharlikang titulong הַמֶּלֶךְ, nang hindi ito ginagawang pagtukoy sa Diyos.
- source_word: וַיַּבֵּט שָׁאוּל אַחֲרָיו
  choice: Nang lumingon si Saul
  rationale: Sa konteksto, ang pagtingin ni Saul sa likuran ay natural na ipinahahayag bilang paglingon; ang “nang” ay malinaw na nag-uugnay sa sumunod na kilos ni David.
- source_word: וַיִּקֹּד
  choice: yumukod
  rationale: Ang קדד ay tumutukoy sa pagyuko ng katawan; inihihiwalay ng “yumukod” ang kilos na ito sa kasunod na lubos na pagpapatirapa.
- source_word: אַפַּיִם אַרְצָה
  choice: nang nakaharap sa lupa
  rationale: Idyoma itong literal na tumutukoy sa mukha na nakatuon sa lupa; malinaw na naihahatid ng salin ang posisyon ng katawan.
- source_word: וַיִּשְׁתָּחוּ
  choice: nagpatirapa
  rationale: Ang anyo ng שׁחה ay maaaring magpahiwatig ng malalim na pagyukod o pagpapatirapa bilang paggalang o pagpapasakop. Pinananatili ng “nagpatirapa” ang tindi ng pisikal na kilos at hindi ito inuulit lamang bilang “yumukod.”
theological_decisions:
- issue: Ang kilos ni David ng malalim na paggalang sa harap ni Saul
  choice: Inilarawan bilang pisikal na pagyukod at pagpapatirapa bilang paggalang o pagpapasakop, hindi bilang pagsamba sa Diyos.
  alternative: “sumamba sa kanya” o “nagbigay-galang sa kanya”
  rationale: Maaaring gamitin ang mga pandiwang Hebreo para sa paggalang sa tao o pagsamba sa Diyos ayon sa konteksto. Dahil si Saul ang pinatutungkulan dito, iniiwasan ng salin ang pahiwatig na sinamba siya ni David bilang Diyos, ngunit pinananatili ang lalim ng pagpapakumbaba ni David.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “yungib” para sa dignidad ng salaysay, habang pinanatiling natural ang ayos ng mga pangungusap. Ang footnote marker ay inilagay pagkatapos ng “nagpatirapa,” ang salitang aktuwal na tinatalakay nito.
