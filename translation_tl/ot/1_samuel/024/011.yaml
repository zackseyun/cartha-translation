source:
  edition: WLC
  text: הִנֵּה֩ הַ/יּ֨וֹם הַ/זֶּ֜ה רָא֣וּ עֵינֶ֗י/ךָ אֵ֣ת אֲשֶׁר נְתָנְ/ךָ֩ יְהוָ֨ה הַ/יּ֤וֹם בְּ/יָדִ/י֙ בַּ/מְּעָרָ֔ה וְ/אָמַ֥ר לַ/הֲרָגֲ/ךָ֖ וַ/תָּ֣חָס עָלֶ֑י/ךָ וָ/אֹמַ֗ר לֹא אֶשְׁלַ֤ח יָדִ/י֙ בַּֽ/אדֹנִ֔/י כִּי מְשִׁ֥יחַ יְהוָ֖ה הֽוּא־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/011.yaml
  text: Look[a], this day your own eyes have seen that Yahweh gave you today into my hand in the cave, and I said to kill you, but I spared you. I said, ‘I will not stretch out my hand against my lord[b], for he is Yahweh’s anointed.’
translation:
  language: tl
  text: Tingnan mo, sa araw na ito nakita ng sarili mong mga mata na ibinigay ka ni Yahweh ngayon sa kamay ko sa loob ng kuweba. May nagsabing patayin ka[a], ngunit kinaawaan kita[b]. Sinabi ko, “Hindi ko pagbubuhatan ng kamay laban sa aking panginoon, sapagkat siya ang pinahiran ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “sinabi niyang patayin ka,” “sinabing patayin ka,” o “may nagsabing dapat kitang patayin.” Walang tahasang simuno ang pandiwang isahan sa Hebreo.'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring: “ngunit hindi kita pinatay.” Ang pandiwang Hebreo ay nagsasaad ng pag-iwas na pumatay dahil sa awa o habag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Likas at tuwirang panawag-pansin sa modernong Tagalog, habang pinananatili ang mariing puwersa ng Hebreo.
- source_word: רָאוּ עֵינֶיךָ
  choice: nakita ng sarili mong mga mata
  rationale: Pinananatili ang idyomang tumutukoy sa mga mata bilang mismong saksi at ang diin na personal itong nakita ni Saul.
- source_word: נְתָנְךָ יְהוָה ... בְּיָדִי
  choice: ibinigay ka ni Yahweh sa kamay ko
  rationale: Malapit sa larawan ng Hebreo na ibinigay si Saul sa kapangyarihan ni David, nang hindi lubusang pinapalitan ang idyoma ng paliwanag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin nang tuwiran ang banal na pangalang YHWH ayon sa pamantayan ng proyekto.
- source_word: בַּמְּעָרָה
  choice: sa loob ng kuweba
  rationale: Malinaw at likas na lokatibong salin sa Tagalog.
- source_word: וְאָמַר לַהֲרָגֲךָ
  choice: May nagsabing patayin ka
  rationale: Ang pandiwa ay ikatlong panauhang panlalaking isahan ngunit walang tahasang simuno. Pinananatili ng “may nagsabi” ang di-tiyak na gumagawa sa tekstong Hebreo.
- source_word: וַתָּחָס עָלֶיךָ
  choice: ngunit kinaawaan kita
  rationale: Ipinahahayag ng pandiwa ang habag na humahantong sa hindi pagpatay. Ang unang panauhang simuno ay ginawang tahasan ayon sa daloy ng pananalita ni David, habang inilalahad sa talababa ang alternatibong diin na “iniligtas.”
- source_word: לֹא אֶשְׁלַח יָדִי
  choice: Hindi ko pagbubuhatan ng kamay
  rationale: Likas na idyomang Tagalog para sa pananakit o paglusob at kasabay na pinananatili ang larawan ng kamay sa Hebreo.
- source_word: בַּאדֹנִי
  choice: ang panginoon ko
  rationale: Tumutukoy kay Saul bilang nakatataas kay David, hindi bilang banal na titulo; ang maliit na titik ay tumutulong linawin ito.
- source_word: מְשִׁיחַ יְהוָה
  choice: ang pinahiran ni Yahweh
  rationale: Pinananatili ang konkretong kahulugan ng taong pinahiran at itinalaga bilang hari, nang hindi ipinapasok dito ang mas huling teknikal na gamit ng titulong Mesiyas.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng מְשִׁיחַ יְהוָה sa salaysay tungkol sa hari
  choice: ang pinahiran ni Yahweh
  alternative: ang Mesiyas ni Yahweh
  rationale: Sa kontekstong ito, si Saul ang haring pinahiran para sa tungkulin. Ang “pinahiran” ay nagpapanatili sa maharlikang-teolohikal na kahulugan nang hindi ipinapakahulugang tuwirang tumutukoy ang talata sa eskatolohikal na Mesiyas.
- issue: Di-tiyak na simuno ng וְאָמַר
  choice: May nagsabing patayin ka
  alternative: Sinabi kong patayin ka / Sinabi niyang patayin ka / Sinabing patayin ka
  rationale: Ang anyong Hebreo ay ikatlong panauhang isahan at walang tahasang simuno. Hindi ito tahimik na ginawang unang panauhan; inilalahad sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “kuweba,” “kinaawaan,” at “pagbubuhatan ng kamay” bilang karaniwang kasalukuyang pananalita. Pinanatili ang pag-uulit ng “sa araw na ito” at “ngayong araw” sa Hebreo sa isang hindi pilit na anyo, at iniwasang gawing denominasyonal na teknikal na titulo ang “pinahiran.”
