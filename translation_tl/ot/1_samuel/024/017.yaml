  source_fidelity: Kailangan ng rebisyon upang maipahayag ang tahasang pagtukoy ng Hebreo sa tinig ni David (הֲקֹלְךָ זֶה) at ang magkahiwalay ngunit magkaugnay na mga kilos na ‘itinaas ni Saul ang kaniyang tinig’ at ‘umiyak siya.’
  naturalness: Natural at marangal ang iminungkahing rebisyon sa modernong Filipino Tagalog. Ang ‘Tinig mo ba ito?’ ay karaniwang Tagalog at pinananatili ang pagkilalang nakabatay sa tinig.
  terminology: Ang ‘anak kong si David’ ay angkop na katumbas ng בְּנִי דָוִד at pinananatili ang relasyonal at emosyonal na pananalita ni Saul nang walang idinagdag na interpretasyong doktrinal.
