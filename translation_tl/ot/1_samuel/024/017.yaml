base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/017.yaml
  text: When David had finished speaking these words to Saul[a], Saul said, “Is this your voice, my son David?” Then Saul lifted up his voice and wept.
translation:
  language: tl
  text: Nang matapos magsalita si David kay Saul ng mga salitang ito, sinabi ni Saul, “Tinig mo ba ito, anak kong si David?” Itinaas ni Saul ang kaniyang tinig at umiyak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת דָּוִד לְדַבֵּר
  choice: Nang matapos sabihin ni David
  rationale: Ang konstruksyong וַיְהִי na sinusundan ng כְּ at infinitive construct ay nagpapakilala ng sugnay na panahunan. Likas sa modernong Tagalog ang “Nang matapos sabihin” at malinaw nitong pinananatili ang pagkakasunod-sunod ng pangyayari.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה אֶל שָׁאוּל
  choice: kay Saul ang mga salitang ito
  rationale: Sa konteksto ng pagsasalita, ang דְּבָרִים ay angkop na isaling “mga salita.” Inayos ang ayos ng mga salita upang maging natural sa Tagalog.
- source_word: הֲקֹלְךָ זֶה בְּנִי דָוִד
  choice: Ikaw ba iyan, anak kong si David?
  rationale: Literal na tumutukoy ang Hebreo sa “iyong tinig,” ngunit ang karaniwang likas na tanong sa Tagalog kapag nakikilala ang nagsasalita sa tinig ay “Ikaw ba iyan?” Napananatili nito ang diwa ng pagkilala at ang magiliw na tawag na “anak kong si David.”
- source_word: וַיִּשָּׂא שָׁאוּל קֹלוֹ וַיֵּבְךְּ
  choice: Pagkatapos ay humagulgol si Saul
  rationale: Ang idyomang “itinaas ang kaniyang tinig at umiyak” ay nagsasaad ng malakas at hayagang pag-iyak. Ang “humagulgol” ay natural at tumpak na katumbas sa Tagalog nang hindi mekanikal na kinokopya ang idyomang Hebreo.
theological_decisions:
- issue: Ang pagtawag ni Saul kay David na בְּנִי, “anak ko”
  choice: anak kong si David
  alternative: David, anak ko
  rationale: Pinananatili ang malinaw na wikang pampamilya at emosyonal ng Hebreo, ngunit hindi ito inilalahad bilang literal na pahayag tungkol sa pagiging mag-ama o bilang isang natatanging doktrinal na titulo.
translation_notes:
  register: 'Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Gumamit ng optimal equivalence: pinanatili ang kahulugan at emosyon ng Hebreo habang isinasalin ang mga idyoma sa likas na Tagalog.'
