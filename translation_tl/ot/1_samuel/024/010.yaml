base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/010.yaml
  text: And David said to Saul[a], “Why do you listen to the words of a man who says, ‘Look[b], David is seeking your harm’?”
translation:
  language: tl
  text: At sinabi ni David kay Saul, “Bakit mo pinakikinggan ang sinasabi ng isang tao[a] na, ‘Tingnan mo, hinahangad ni David ang iyong pahamak’?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa salita ng tao” o “sa sinasabi ng mga tao.” Ang isahang salitang Hebreo ay maaaring gamitin sa mas pangkalahatang diwa tungkol sa tao, ngunit dito ay pinanatiling “isang tao” dahil isahan ang anyo at malamang na tumutukoy sa isang tagapag-akusa.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “hinahangad ni David ang iyong kasamaan/kapahamakan.” Sa kontekstong ito, ang pariralang Hebreo ay tumutukoy sa paghahangad ng pinsala o kapahamakan laban kay Saul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Ipinagpapatuloy ng waw-consecutive ang daloy ng salaysay; natural sa makabagong Tagalog ang “At sinabi.”
- source_word: לְשָׁאוּל
  choice: kay Saul
  rationale: Ang לְ ay nagmamarka sa taong kinakausap, at “Saul” ang nakasanayang anyo ng pangalan sa Tagalog.
- source_word: לָמָּה
  choice: Bakit
  rationale: Direkta at natural na katumbas ng tanong tungkol sa dahilan.
- source_word: תִשְׁמַע
  choice: ka nakikinig
  rationale: Sa konteksto, ang שׁמע ay hindi lamang pagkarinig kundi pagbibigay-pansin o paniniwala sa sinabi.
- source_word: אֶת דִּבְרֵי אָדָם
  choice: sa sinasabi ng isang tao
  rationale: Pinananatili ang isahang אָדָם at likas na ipinapahayag sa Tagalog ang “mga salita” bilang “sinasabi.”
- source_word: לֵאמֹר
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng iniulat na pananalita; sapat at natural dito ang pang-ugnay na “na.”
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Isa itong pantawag-pansin; makabago at malinaw ang “Tingnan mo” kumpara sa makalumang “Narito.”
- source_word: מְבַקֵּשׁ
  choice: hangad
  rationale: Ipinahihiwatig ng participle ang patuloy o kinaugaliang layunin; naihahatid ito nang natural ng “hangad.”
- source_word: רָעָתֶךָ
  choice: na mapahamak ka
  rationale: Ang רָעָה ay maaaring tumukoy sa kasamaan o kapahamakang laban sa isang tao; ipinahahayag ng parirala ang akusasyon nang malinaw nang hindi sapilitang nilalagyan ng moral na kahulugang “kasamaan.”
theological_decisions:
- issue: Pagpapakahulugan sa isahang אָדָם
  choice: isang tao
  alternative: tao sa pangkalahatan / mga tao
  rationale: Isahan ang anyong Hebreo at malamang na tumutukoy sa isang tagapag-akusa o sa isang di-tiyak na indibidwal; hindi ito ginawang maramihan nang walang malinaw na batayan sa konteksto.
- issue: Saklaw ng רָעָתֶךָ
  choice: mapahamak ka
  alternative: gumawa ng masama laban sa iyo
  rationale: Pinananatili ang saklaw na maaaring mangahulugang pinsala o kapahamakan, sa halip na ipasya na moral na kasamaan lamang ang tinutukoy.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “sinasabi” sa halip na literal na “mga salita” para sa likas na daloy, habang pinanatili sa talababa ang posibleng kolektibong diwa ng אָדָם at ang leksikal na lawak ng רָעָה.
