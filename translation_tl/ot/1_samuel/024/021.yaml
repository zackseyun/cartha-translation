  text: And now, look, I know that you will surely reign, and the kingdom of Israel will be established in your hand.
translation:
  language: tl
  text: At ngayon, tingnan mo, alam kong tiyak na maghahari ka, at magiging matatag sa iyong kamay ang kaharian ng Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: At ngayon
  rationale: Ang הִנֵּה ay pantawag-pansin, ngunit sa natural na makabagong Tagalog ay hindi kailangang isalin nang hiwalay dito; naipahihiwatig na ng tuwirang pahayag ang diin.
- source_word: מָלֹךְ תִּמְלוֹךְ
  choice: tiyak na maghahari ka
  rationale: Ang infinitive absolute na kasunod ng finite verb mula sa parehong ugat ay nagbibigay-diin sa katiyakan ng paghahari.
- source_word: וְקָמָה בְּיָדְךָ
  choice: at matatatag sa iyong kamay
  rationale: Pinananatili ang metaporang Hebreo ng kapangyarihan at pamamahala sa 'kamay,' habang ang קום ay isinasaling 'matatatag' ayon sa konteksto.
- source_word: מַמְלֶכֶת יִשְׂרָאֵל
  choice: ang kaharian ng Israel
  rationale: Tuwirang katumbas na malinaw at karaniwan sa makabagong Tagalog.
theological_decisions:
- issue: Katiyakan ng magiging paghahari ni David
  choice: tiyak na maghahari ka
  alternative: maghahari ka nga
  rationale: Ipinapakita ang mariing anyong Hebreo nang hindi nagdaragdag ng paliwanag tungkol sa paraan o panahon ng katuparan.
- issue: Pagkatatag ng kaharian 'sa kamay' ni David
  choice: matatatag sa iyong kamay
  alternative: magiging matatag sa ilalim ng iyong pamamahala
  rationale: Pinananatili ang konkretong metapora at ang posibleng saklaw nito—kapangyarihan, pamamahala, at pagkakaloob—nang hindi ito nililimitahan sa isang interpretasyon.
translation_notes:
  register: Natural, kasalukuyan, at marangal na Filipino. Pinanatili ang Hebreong idyomang 'sa iyong kamay' dahil malinaw ito sa konteksto at mahalaga ang larawan ng kapangyarihang ipinagkatiwala.
