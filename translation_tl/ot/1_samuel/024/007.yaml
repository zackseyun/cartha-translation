base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/007.yaml
  text: And he said to his men[a], “Far be it from me, because of Yahweh, that I should do this thing to my lord, Yahweh’s anointed, to stretch out my hand against him, for he is Yahweh’s anointed.”
translation:
  language: tl
  text: At sinabi niya sa kanyang mga tauhan,[a] “Huwag nawang mangyari sa akin, dahil kay Yahweh, na gawin ko ang bagay na ito sa aking panginoon, ang pinahiran ni Yahweh—na pagbuhatan ko siya ng kamay—sapagkat siya ang pinahiran ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tradisyonal na salin, “Huwag nawang itulot ni Yahweh na gawin ko ito.” Ang idyomang Hebreo ay nagpapahayag ng mariing pag-ayaw sa gayong gawa dahil kay Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: Huwag nawang itulot ni Yahweh
  rationale: Ang idyoma ay matinding pagtanggi at pagkasuklam sa iniisip na gawa, na nakaugnay kay Yahweh. Natural ito sa modernong Tagalog at hindi ipinahihiwatig na literal na pagbabawal lamang ang kahulugan.
- source_word: אִם אֶעֱשֶׂה
  choice: na gawin ko
  rationale: 'Bagaman pormal na ‘kung’ ang אִם, matapos ang חָלִילָה ay bahagi ito ng idyomatikong pagtanggi: ‘huwag nawang ... na gawin ko.’'
- source_word: הַדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Pinananatili nito ang malawak na kahulugan ng דָּבָר habang malinaw na tumutukoy sa binabalak na gawa.
- source_word: לַאדֹנִי
  choice: sa aking panginoon
  rationale: Ipinananatili ang magalang na katawagan ni David kay Saul nang hindi pa isinasama rito ang diwang mapanlaban.
- source_word: לִמְשִׁיחַ יְהוָה
  choice: ang pinahiran ni Yahweh
  rationale: Tumutukoy ito kay Saul bilang haring itinalaga sa pamamagitan ng pagpapahid. Iniiwasan ng saling ito ang anakronistikong paggamit ng ‘Mesiyas.’
- source_word: לִשְׁלֹחַ יָדִי בּוֹ
  choice: na pagbuhatan ko siya ng kamay
  rationale: Likas na idyomang Tagalog ito para sa marahas na pagkilos laban sa isang tao at pinananatili ang larawan ng kamay sa Hebreo.
- source_word: כִּי מְשִׁיחַ יְהוָה הוּא
  choice: sapagkat siya ang pinahiran ni Yahweh
  rationale: Malinaw na ipinapakita ang dahilan ng pagtanggi ni David at pinananatili ang mariing pag-uulit sa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapakahulugan sa מְשִׁיחַ bilang titulo ni Saul
  choice: ang pinahiran ni Yahweh
  alternative: ang Mesiyas ni Yahweh
  rationale: Sa kontekstong ito, ang salita ay tumutukoy sa pagkakahirang at pagpapahid kay Saul bilang hari. Pinananatili ng ‘pinahiran’ ang kahulugang maharlika at sagrado nang hindi nagpapasok ng mas huling mga ugnayang kristolohikal.
- issue: Ugnayan ni Yahweh sa matinding pagtanggi ni David
  choice: Huwag nawang itulot ni Yahweh
  alternative: Malayo nawa sa akin dahil kay Yahweh
  rationale: Ipinahahayag ng pangunahing salin ang matinding pagtanggi sa natural na Tagalog at pinananatiling nakasalig kay Yahweh ang pagpipigil ni David, bagaman hindi lubos na matutumbasan sa Tagalog ang maigsi at di-pangkaraniwang Hebreong parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘mga tauhan’ para sa mga lalaking nasa ilalim ng pamumuno ni David, ‘aking panginoon’ bilang magalang na tawag kay Saul, at ‘pagbuhatan ng kamay’ upang mapanatili ang Hebreong larawan sa isang likas na idyomang Tagalog.
