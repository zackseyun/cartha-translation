revisions:
- from: At sinabi niya sa kanyang mga tauhan, “Huwag nawang itulot ni Yahweh na gawin ko ang bagay na ito sa aking panginoon, ang pinahiran ni Yahweh—na pagbuhatan ko siya ng kamay—sapagkat siya ang pinahiran ni Yahweh.”
  to: At sinabi niya sa kanyang mga tauhan,[a] “Huwag nawang mangyari sa akin, dahil kay Yahweh, na gawin ko ang bagay na ito sa aking panginoon, ang pinahiran ni Yahweh—na pagbuhatan ko siya ng kamay—sapagkat siya ang pinahiran ni Yahweh.”
  rationale: Binago ang pambungad upang panatilihin ang mariing personal na pagtanggi ni David at ang dahilan nitong kaugnay ni Yahweh, sa halip na gawing tahasang pagkilos ni Yahweh ang pagbabawal. Nagdagdag ng nakaangkla at maikling tala para sa tradisyonal na alternatibong pagsasalin ng idyoma. Pinanatili ang mga pangunahing terminong “Yahweh,” “aking panginoon,” at “pinahiran ni Yahweh,” gayundin ang larawan ng pagbubuhat ng kamay laban sa tao.
