  - severity: low
    issue: Hindi ganap na saklaw ng talababa ang inuulit na gamit ng אַחֲרֵי.
    rationale: Dalawang beses lumilitaw ang pariralang “after whom” sa Hebreo. Dapat ipaliwanag ng talababa na ang literal na pang-ukol ay ginagamit sa diwa ng pagtugis sa parehong tanong.
