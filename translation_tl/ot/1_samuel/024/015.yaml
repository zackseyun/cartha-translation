  yaml_path: translation/ot/1_samuel/024/015.yaml
  text: After whom has the king of Israel come out? After whom are you pursuing? After a dead dog[a], after a single flea.
translation:
  language: tl
  text: Sino ang hinahabol ng hari ng Israel nang lumabas siya?[a] Sino ang tinutugis mo? Isang patay na aso, isang pulgas lamang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Laban kanino lumabas ang hari ng Israel? Laban kanino ka tumutugis?” Paulit-ulit na ginagamit sa Hebreo ang salitang literal na “sa likod ng” sa diwa ng pagtugis.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי מִי
  choice: Sino ba ang hinahabol
  rationale: Ang אַחֲרֵי ay literal na “kasunod ng” ngunit dito ay tumutukoy sa taong hinahabol. Natural sa modernong Tagalog ang tanong na “Sino ba ang hinahabol,” at pinananatili ng dalawang magkasunod na tanong ang retorikal na pag-uulit.
- source_word: יָצָא
  choice: sa paglabas niya
  rationale: Pinananatili nito ang kahulugan ng paglabas o paghayo ng hari, sa konteksto ng isang kampanya upang tugisin si David.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang salin na nagpapanatili sa marangal na titulo at sa kabalintunaan ng paghabol ng hari sa isang itinuturing na hamak.
- source_word: אַתָּה רֹדֵף
  choice: tinutugis mo
  rationale: Ipinahihiwatig ng “tinutugis” ang patuloy at mapanganib na paghabol, na angkop sa kontekstong militar.
- source_word: כֶּלֶב מֵת
  choice: isang patay na aso
  rationale: Literal at malinaw itong larawan ng matinding pagpapakumbaba ni David; hindi kailangang dagdagan ng “bangkay.”
- source_word: פַּרְעֹשׁ אֶחָד
  choice: isang pulgas lamang
  rationale: Ipinahahayag ng “lamang” ang diin ng אֶחָד sa lubos na kaliitan at kawalang-halaga ng isang pulgas.
- source_word: אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי
  choice: hinahabol ... tinutugis ... [mga sagot sa pagtugis]
  rationale: Hindi natural sa Tagalog ang paulit-ulit na literal na “sa likod ng.” Sa halip, pinananatili ang ritmo sa dalawang tanong tungkol sa paghabol at sa dalawang maikli at magkatambal na larawan sa hulihan.
