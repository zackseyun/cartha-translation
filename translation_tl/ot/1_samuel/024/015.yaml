translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “ba” upang maging natural ang mapanuyang retorikal na mga tanong, at ang tandang padamdam upang ihayag ang diin ng dalawang sagot nang hindi dinaragdagan ang kahulugan.
