base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/023.yaml
  text: And whenever the spirit of God came upon Saul[a], David would take the lyre and play it with his hand; then Saul found relief, and it was well with him[c][b], and the harmful spirit departed from him.
translation:
  language: tl
  text: Tuwing dumarating kay Saul ang espiritu ng Diyos, kinukuha ni David ang lira[a] at tinutugtog niya ito gamit ang kanyang kamay. Sa gayon, gumiginhawa si Saul at bumubuti ang kanyang kalagayan, at umaalis sa kanya ang mapaminsalang espiritu.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “harpa.” Ang Hebreong kinnor ay isang sinaunang instrumentong de-kuwerdas, na malamang ay mas kahawig ng lira kaysa ng modernong harpa.
    reason: lexical_alternative
  - marker: b
    text: O “masamang espiritu.” Ang salitang Hebreo ay maaaring mangahulugang “masama” o “mapaminsala”; dito, maaaring binibigyang-diin ang pinsala o paghihirap na idinudulot nito kay Saul.
    reason: lexical_alternative
  - marker: c
    text: “Ang espiritu ng Diyos” ang nasa unang sugnay, samantalang “ang mapaminsalang espiritu” ang nasa hulihang sugnay. Pinananatili ng salin ang pagkakaiba ng pananalita sa Hebreo sa halip na pag-isahin ang dalawang pahayag.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בִּהְיוֹת
  choice: Tuwing dumarating
  rationale: Ipinahihiwatig ng konstruksiyon ang isang pangyayaring paulit-ulit. Likas na naipapahayag ito ng “tuwing” sa modernong Tagalog.
- source_word: רוּחַ אֱלֹהִים
  choice: ang espiritu ng Diyos
  rationale: Ito ang tuwirang anyo ng Hebreo sa unang sugnay. Hindi idinagdag dito ang “masama” o “mapaminsala,” na lumilitaw lamang sa hulihang sugnay.
- source_word: אֶל שָׁאוּל
  choice: kay Saul
  rationale: Kasama ng “dumarating,” natural nitong ipinapahayag na nararanasan ni Saul ang pagdating ng espiritu nang hindi dinaragdagan ang kahulugan.
- source_word: הַכִּנּוֹר
  choice: ang lira
  rationale: Ang kinnor ay isang sinaunang instrumentong de-kuwerdas na mas malapit sa lyre kaysa sa modernong harpa.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: at tinutugtog iyon ng kanyang kamay
  rationale: Pinananatili nito ang tahasang pagbanggit sa kamay sa Hebreo, habang ang “iyon” ay likas na tumutukoy sa lira.
- source_word: וְרָוַח לְשָׁאוּל
  choice: gumiginhawa si Saul
  rationale: Ang pandiwa ay nagsasaad ng pagkakaroon ng ginhawa o pahinga mula sa paghihirap. Ang aspektong di-ganap ay angkop sa paulit-ulit na tagpo.
- source_word: וְטוֹב לוֹ
  choice: at bumubuti ang kanyang kalagayan
  rationale: Ipinapahayag nito ang pagbuti ng lagay ni Saul nang hindi nililimitahan ang kahulugan sa damdamin lamang.
- source_word: רוּחַ הָרָעָה
  choice: ang mapaminsalang espiritu
  rationale: Maaaring mangahulugan ang רָעָה ng masama o nakapipinsala. Sa konteksto, malinaw ang mapaminsalang epekto nito kay Saul, ngunit hindi dapat lubusang alisin ang leksikal na alternatibong “masamang espiritu.”
- source_word: וְסָרָה מֵעָלָיו
  choice: at umaalis sa kanya
  rationale: Malinaw at natural itong katumbas ng paglayo o pag-alis ng espiritu, at umaayon sa paulit-ulit na kilos ng talata.
theological_decisions:
- issue: Ang ugnayan ng רוּחַ אֱלֹהִים sa unang sugnay at רוּחַ הָרָעָה sa hulihang sugnay
  choice: Isinalin bilang “ang espiritu ng Diyos” sa una at “ang mapaminsalang espiritu” sa huli, nang hindi pinag-iisa ang dalawang pananalita.
  alternative: Isalin ang una bilang “ang mapaminsalang espiritung mula sa Diyos,” o ang huli bilang “ang masamang espiritu.”
  rationale: Magkaiba ang mismong pananalita ng tekstong Hebreo. Ang pagpapanatili sa pagkakaibang ito ay umiiwas sa pagpasok ng isang interpretatibong pagkakasundo sa salin at pinananatili ang teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “lira” bilang mas tumpak na pangalan ng sinaunang instrumento, at pinanatili ang tahasang “ng kanyang kamay.” Ang mga pandiwang “gumiginhawa,” “bumubuti,” at “umaalis” ay nagpapakita ng paulit-ulit na pangyayari na ipinakikilala ng “tuwing.”
