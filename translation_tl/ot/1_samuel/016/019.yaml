  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagsugo” at “mga mensahero” bilang natural na tambalan sa salaysay, at iniwasang idagdag ang “nagpapastol” sapagkat hindi ito tahasang nasa talata.
