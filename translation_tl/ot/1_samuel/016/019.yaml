  yaml_path: translation/ot/1_samuel/016/019.yaml
  text: So Saul sent messengers to Jesse and said[a], “Send me your son David, who is with the flock.”
translation:
  language: tl
  text: Kaya nagsugo si Saul ng mga mensahero kay Jesse at sinabi, “Ipadala mo sa akin ang anak mong si David, na nasa piling ng mga tupa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Ang wayyiqtol ng שׁלח ay nagsasaad ng payak na nagdaang kilos. Likas sa salaysay ang “nagsugo,” lalo na dahil mga mensahero ang ipinadala.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Sa kontekstong pantao, tumutukoy ang מַלְאָכִים sa mga taong naghahatid ng mensahe, hindi sa mga anghel; malinaw at karaniwan ang “mga mensahero.”
- source_word: אֶל־יִשָׁי
  choice: kay Jesse
  rationale: Ipinahihiwatig ng אֶל ang patutunguhan; natural itong isinasalin na “kay” bago ang pangalan ng tao.
- source_word: וַיֹּאמֶר
  choice: at sinabi
  rationale: Ang אמר ang nagpapakilala sa tuwirang pananalita. Pinananatili ng “sinabi” ang karaniwang ayos ng salaysay.
- source_word: שִׁלְחָה אֵלַי
  choice: Ipadala mo sa akin
  rationale: Ang שִׁלְחָה ay pautos na anyo ng שׁלח, at tahasang ipinakikita ng אֵלַי ang patutunguhang “sa akin.”
- source_word: אֶת־דָּוִד בִּנְךָ
  choice: ang anak mong si David
  rationale: Ang אֶת ay pananda ng tiyak na layon at hindi hiwalay na isinasalin. Natural sa Filipino ang ayos na “ang anak mong si David” para sa appositional na parirala.
- source_word: אֲשֶׁר בַּצֹּאן
  choice: na nasa piling ng mga tupa
  rationale: Ang בַּצֹּאן ay maaaring tumukoy sa pagiging kasama o nasa gitna ng kawan. Pinananatili ng “nasa piling ng mga tupa” ang kaugnayang panlunan nang hindi nagdaragdag na siya ay nagpapastol, bagaman ipinahihiwatig iyon ng mas malawak na konteksto.
