base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/014.yaml
  text: The Spirit of Yahweh had departed from Saul[a], and an evil spirit from Yahweh terrified him.
translation:
  language: tl
  text: Ang Espiritu ni Yahweh ay umalis na kay Saul, at sinindak siya ng isang masamang espiritu[a] mula kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang mapaminsalang espiritu” o “isang espiritung nagdudulot ng paghihirap.” Ang salitang Hebreo ay maaaring tumukoy sa masama, mapaminsala, o nagdudulot ng kapahamakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: Ang Espiritu ni Yahweh
  rationale: Sa konteksto, ang רוּחַ ay tumutukoy sa banal na presensiyang nagbigay-kapangyarihan kay Saul, kaya natural ang “Espiritu.” Pinanatili ang pangalang “Yahweh” para sa יְהוָה.
- source_word: סָרָה מֵעִם
  choice: ay lumayo na kay
  rationale: Ang סוּר kasama ng מֵעִם ay nagpapahayag ng pag-alis o paglayo mula sa piling ng isang tao. Ang “lumayo na kay” ay natural sa Tagalog at ipinahihiwatig ang naunang naganap na pag-alis nang hindi dinaragdagan ang teksto.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Karaniwang anyo ng pangalan sa Tagalog na Bibliya.
- source_word: וּבִעֲתַתּוּ
  choice: at sinindak siya
  rationale: Ang pandiwang בעת ay tumutukoy sa matinding pananakot o biglang paghilakbot. Tuwirang naipapahayag ng “sinindak” ang matinding takot na idinulot sa kanya.
- source_word: רוּחַ רָעָה
  choice: isang masamang espiritu
  rationale: Ang רָעָה ay maaaring mangahulugang masama, mapaminsala, o nagdudulot ng kapahamakan. Ang “masamang espiritu” ang pinakadirektang salin; inilagay sa talababa ang iba pang tunay na posibilidad.
- source_word: מֵאֵת יְהוָה
  choice: mula kay Yahweh
  rationale: Ang מֵאֵת ay nagsasaad ng pinagmulan. Ang “mula kay Yahweh” ay tapat sa hayag na salita ng Hebreo at hindi nagdaragdag ng interpretasyong “ipinadala ni Yahweh.”
theological_decisions:
- issue: Kung paano isasalin ang pagiging mula kay Yahweh ng espiritung nanindak kay Saul
  choice: isang masamang espiritu mula kay Yahweh
  alternative: isang mapaminsala o nagpapahirap na espiritu mula kay Yahweh; isang masamang espiritung ipinadala ni Yahweh
  rationale: Tahasang iniuugnay ng Hebreo kay Yahweh ang pinagmulan ng espiritu. Pinananatili ng salin ang tensiyong teolohikal na ito sa halip na palambutin o ipaliwanag ito. Hindi ginamit ang “ipinadala” sapagkat higit iyon sa tahasang sinasabi ng pariralang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sinindak” upang maipahayag nang maikli ang matinding takot. Inilagay ang panandang [a] pagkatapos ng “masamang espiritu,” ang mismong pariralang nililinaw ng talababa.
