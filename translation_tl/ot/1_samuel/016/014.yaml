    issue: “lumayo na kay Saul” ay hindi kasingtuwiran ng “umalis na kay Saul.”
    rationale: Ang סָרָה מֵעִם ay nagsasaad ng pag-alis/pagkawala mula sa piling ni Saul. Bagaman katanggap-tanggap ang “lumayo,” ang “umalis” ay mas malinaw na naghahatid ng pag-alis na nakasaad sa Hebreo.
  - severity: low
    issue: 'Hindi magkakatugma ang huling bahagi ng paliwanag sa talababa: “masama, mapaminsala, o kapahamakang idinudulot.”'
    rationale: Ang unang dalawa ay pang-uri samantalang ang huli ay pariralang pangngalan. Ang “nagdudulot ng kapahamakan” ay mas maayos at tumpak na paglalarawan ng saklaw ng רָעָה.
