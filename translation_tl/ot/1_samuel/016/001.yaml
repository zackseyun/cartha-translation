  to: Sinabi ni Yahweh kay Samuel, “Hanggang kailan ka magdadalamhati dahil kay Saul, gayong itinakwil ko na siya upang hindi na siya maghari sa Israel? Punuin mo ng langis ang iyong sungay at humayo ka. Isinusugo kita kay Jesse na taga-Bethlehem, sapagkat pinili ko na para sa aking sarili ang isang hari mula sa mga anak niya[a].”
