  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל עַד מָתַי֙ אַתָּה֙ מִתְאַבֵּ֣ל אֶל שָׁא֔וּל וַ/אֲנִ֣י מְאַסְתִּ֔י/ו מִ/מְּלֹ֖ךְ עַל יִשְׂרָאֵ֑ל מַלֵּ֨א קַרְנְ/ךָ֜ שֶׁ֗מֶן וְ/לֵ֤ךְ אֶֽשְׁלָחֲ/ךָ֙ אֶל יִשַׁ֣י בֵּֽית הַלַּחְמִ֔י כִּֽי רָאִ֧יתִי בְּ/בָנָ֛י/ו לִ֖/י מֶֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/001.yaml
  text: And Yahweh said to Samuel[a], “How long will you grieve over Saul, since I have rejected him from being king over Israel? Fill your horn with oil and go; I am sending you to Jesse the Bethlehemite, for I have provided for myself a king among his sons.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Samuel, “Hanggang kailan ka magdadalamhati dahil kay Saul, gayong itinakwil ko na siya upang hindi na siya maghari sa Israel? Punuin mo ng langis ang iyong sungay at humayo ka. Isinusugo kita kay Jesse na taga-Bethlehem, sapagkat pinili ko na para sa aking sarili ang isang hari mula sa mga anak niya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nakita ko para sa aking sarili.” Sa kontekstong ito, maaari itong mangahulugang “pinili ko” o “inilaan ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “Panginoon.”
- source_word: מִתְאַבֵּל אֶל שָׁאוּל
  choice: ipagdadalamhati si Saul
  rationale: Natural sa modernong Tagalog at malinaw na ipinahahayag ang patuloy na pagdadalamhati ni Samuel tungkol kay Saul.
- source_word: מְאַסְתִּיו מִמְּלֹךְ עַל יִשְׂרָאֵל
  choice: itinakwil ko na siya sa paghahari sa Israel
  rationale: Pinananatili ang saklaw ng pagtatakwil sa tungkulin ni Saul bilang hari at hindi ito pinalalawak sa kanyang pangwakas na kalagayang espirituwal.
- source_word: מַלֵּא קַרְנְךָ שֶׁמֶן
  choice: Punuin mo ng langis ang iyong sungay
  rationale: Pinananatili ang kongkretong larawan ng sungay na ginagamit na sisidlan ng langis para sa pagpapahid.
- source_word: אֶשְׁלָחֲךָ
  choice: Isinusugo kita
  rationale: Ipinahahayag ang tiyak at kasalukuyang utos ng Diyos sa natural at marangal na Tagalog.
- source_word: יִשַׁי בֵּית הַלַּחְמִי
  choice: Jesse na taga-Bethlehem
  rationale: Natural na katumbas sa Tagalog ng katawagang nagpapakilala kay Jesse ayon sa kanyang pinagmulan.
- source_word: רָאִיתִי
  choice: pinili ko na
  rationale: Bagaman literal na “nakita ko,” sa kontekstong ito ang pandiwa ay nagpapahiwatig ng pagkilala o pagpili ng Diyos; nililinaw ng talababa ang tunay na leksikal na larawan.
- source_word: בְּבָנָיו
  choice: mula sa mga anak niya
  rationale: Malinaw na ipinakikitang ang haring tinutukoy ay isa sa mga anak ni Jesse.
- source_word: לִי
  choice: para sa aking sarili
  rationale: Pinananatili ang diin na ang hari ay pinili para sa layunin at pag-aari ng Diyos.
- source_word: מֶלֶךְ
  choice: isang hari
  rationale: Sinasalamin ang di-tiyak na anyo ng pangngalan bago pa tukuyin kung sinong anak ni Jesse ang pinili.
theological_decisions:
- issue: Saklaw ng pagtatakwil ng Diyos kay Saul
  choice: itinakwil ko na siya sa paghahari sa Israel
  alternative: itinakwil ko na siya
  rationale: Nililimitahan ng tekstong Hebreo ang pahayag sa paghahari ni Saul; hindi ito ginawang pangkalahatang hatol sa lahat ng aspekto ng kanyang kalagayan.
- issue: Kahulugan ng רָאִיתִי sa pagpili ng hari
  choice: pinili ko na para sa aking sarili
  alternative: nakita ko para sa aking sarili / inilaan ko para sa aking sarili
  rationale: Ipinahahayag ng pangunahing teksto ang kontekstuwal na diwa ng banal na pagpili, habang pinananatili sa talababa ang literal na kahulugang “nakita” at ang posibilidad ng diwang “inilaan.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pangalang Yahweh at ang konkretong larawang “sungay,” habang ginawang natural sa Tagalog ang mga pariralang Hebreo.
