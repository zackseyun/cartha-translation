  to: Pagkatapos, sinabi ni Samuel kay Jesse, “Ito na ba ang lahat ng iyong mga anak na lalaki?” Sumagot siya, “May natitira pang bunso; naroon siya at nagpapastol ng mga tupa.” Sinabi ni Samuel kay Jesse, “Ipasundo mo siya at dalhin mo rito, sapagkat hindi tayo uupo[a] hanggang sa dumating siya rito.”
