base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/011.yaml
  text: Then Samuel said to Jesse[a], “Are these all the young men?” And he said, “The youngest still remains, and behold, he is shepherding the flock.” Then Samuel said to Jesse, “Send and bring him[b], for we will not sit down until he comes here.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Samuel kay Jesse, “Ito na ba ang lahat ng iyong mga anak na lalaki?” Sumagot siya, “May natitira pang bunso; naroon siya at nagpapastol ng mga tupa.” Sinabi ni Samuel kay Jesse, “Ipasundo mo siya at dalhin mo rito, sapagkat hindi tayo uupo[a] hanggang sa dumating siya rito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi tayo mauupo sa ating mga puwesto.” Malamang na ang ibig sabihin ay hindi nila sisimulan ang pagkain o ang pormal na pagtitipon hanggang sa dumating ang bunso.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַמּוּ הַנְּעָרִים
  choice: Ito na ba ang lahat ng iyong mga anak na lalaki?
  rationale: Ang תמם ay tumutukoy sa pagiging buo o kumpleto. Sa konteksto, tinatanong ni Samuel kung naiharap na ang lahat ng anak na lalaki ni Jesse; nililinaw ng 'iyong mga anak na lalaki' ang relasyong ipinahihiwatig ng salaysay.
- source_word: עוֹד שָׁאַר הַקָּטָן
  choice: Naroon pa ang bunso
  rationale: Ipinahihiwatig ng עוֹד שָׁאַר na may isang hindi pa naihaharap, at sa konteksto ng magkakapatid ang הַקָּטָן ay likas na 'ang bunso.'
- source_word: וְהִנֵּה
  choice: kasalukuyan
  rationale: Ang הִנֵּה ay pantawag-pansin sa kalagayang kasunod. Sa natural na Tagalog, naihahatid ang puwersa nito sa diin ng aktuwal at kasalukuyang ginagawa ng bunso, nang gumamit ng artipisyal na 'narito.'
- source_word: רֹעֶה בַּצֹּאן
  choice: pinapastol ang mga tupa
  rationale: Ang participle רֹעֶה ay nagpapahayag ng nagpapatuloy na gawain. Ang 'pinapastol ang mga tupa' ay natural at pinananatili ang larawang pastoral ng orihinal.
- source_word: שִׁלְחָה וְקָחֶנּוּ
  choice: Ipasundo mo siya at dalhin dito
  rationale: Pinananatili nito ang dalawang galaw ng utos—ang pagpapadala at ang pagdadala sa bunso—sa malinaw na modernong Tagalog.
- source_word: לֹא נָסֹב
  choice: hindi tayo uupo
  rationale: Bagaman karaniwang may diwang 'umikot' ang סבב, dito malamang na idyoma ito para sa pag-upo o pagkuha ng kani-kanilang puwesto, marahil upang simulan ang pagkain o pormal na pagtitipon.
- source_word: עַד בֹּאוֹ פֹה
  choice: hangga't hindi siya dumarating
  rationale: Natural na temporal na parirala sa Tagalog para sa 'hanggang sa pagdating niya rito'; naipahihiwatig na ng 'dalhin dito' ang lokasyon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'Jesse' ayon sa ibinigay na reference layer, 'bunso' para sa likas na tawag sa pinakabatang anak, at isang talababa upang mapanatili ang posibleng lawak ng idyomang לֹא נָסֹב.
