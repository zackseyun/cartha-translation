  text: וַ/יַּעַן֩ אֶחָ֨ד מֵ/הַ/נְּעָרִ֜ים וַ/יֹּ֗אמֶר הִנֵּ֨ה רָאִ֜יתִי בֵּ֣ן לְ/יִשַׁי֮ בֵּ֣ית הַלַּחְמִי֒ יֹדֵ֣עַ נַ֠גֵּן וְ/גִבּ֨וֹר חַ֜יִל וְ/אִ֧ישׁ מִלְחָמָ֛ה וּ/נְב֥וֹן דָּבָ֖ר וְ/אִ֣ישׁ תֹּ֑אַר וַ/יהוָ֖ה עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/018.yaml
  text: Then one of the young men answered and said[a], “Look, I have seen a son of Jesse the Bethlehemite who is skillful in playing, a mighty man of valor, a man of war, prudent in speech, and a handsome man[d][c][b], and Yahweh is with him.”
translation:
  language: tl
  text: 'Sumagot ang isa sa mga kabataang lalaki at nagsabi, “Narito, may nakita akong isang anak ni Jesse na taga-Betlehem: mahusay tumugtog, magiting, bihasa sa pakikipagdigma, maingat magsalita, at makisig; at kasama niya si Yahweh.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵהַנְּעָרִים וַיֹּאמֶר
  choice: Sumagot ang isa sa mga kabataang lalaki
  rationale: Pinananatili ng “sumagot” ang karaniwang gamit ng ענה sa salaysay. Ang נְעָרִים ay maaaring mangahulugang mga kabataan, lingkod, o tagapaglingkod; pinili ang mas malapit na “mga kabataang lalaki” nang hindi tahasang nagpapasya sa kanilang tungkulin sa korte.
- source_word: הִנֵּה רָאִיתִי
  choice: May nakita akong
  rationale: Ang הִנֵּה ay pantawag-pansin, ngunit sa natural na makabagong Tagalog ay sapat nang naipahihiwatig ang puwersa nito sa agarang rekomendasyong “May nakita akong.”
- source_word: בֵּן לְיִשַׁי בֵּית הַלַּחְמִי
  choice: anak ni Jesse na taga-Betlehem
  rationale: Natural na Tagalog ito para sa literal na “anak ni Jesse” at sa gentiliko na nangangahulugang mula sa Betlehem.
- source_word: יֹדֵעַ נַגֵּן
  choice: Mahusay siyang tumugtog
  rationale: Ipinahihiwatig ng parirala ang kasanayan sa pagtugtog. Hindi tinukoy ang instrumento sa talatang ito, kaya hindi ito idinagdag.
- source_word: גִּבּוֹר חַיִל
  choice: magiting at matapang
  rationale: Malawak ang idyomang ito at maaaring tumukoy sa kagitingan, lakas, kakayahan, o katapangan. Ang tambalang salin ay naghahatid ng papuring diwa nang hindi inuulit nang tuwiran ang kasunod na katangiang pandigma.
- source_word: אִישׁ מִלְחָמָה
  choice: bihasa sa pakikipagdigma
  rationale: Inihahatid nito ang malinaw na kahulugang militar ng parirala sa natural na Tagalog, bagaman maaari rin itong isaling “mandirigma.”
- source_word: נְבוֹן דָּבָר
  choice: maingat magsalita
  rationale: Sinasaklaw nito ang pagiging may unawa at mahusay na pagpapasya sa pananalita; hindi ito pinaliit tungo lamang sa pagiging mahusay magsalita.
- source_word: אִישׁ תֹּאַר
  choice: makisig
  rationale: Ang תֹּאַר ay tumutukoy sa anyo o kaaya-ayang hitsura; ang “makisig” ay maikli, natural, at angkop sa lalaking inilalarawan.
- source_word: וַיהוָה עִמּוֹ
  choice: At kasama niya si Yahweh
  rationale: Pinananatili ang personal na pangalang banal na יהוה bilang “Yahweh” at ang payak ngunit teolohikal na mahalagang pahayag ng presensiya o pagsang-ayon ng Diyos.
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng “kasama niya si Yahweh”
  choice: Pinanatili bilang payak na pahayag ng presensiya
  alternative: Pinagpapala siya ni Yahweh / sinasang-ayunan siya ni Yahweh
  rationale: Maaaring magpahiwatig ang parirala ng tulong, pabor, o pagsang-ayon ng Diyos, ngunit hindi iyon tahasang nililinaw ng Hebreo. Pinanatili ang teolohikal na lawak at tensiyon ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginawang natural ang mahabang serye ng mga katangian sa pamamagitan ng maiikling pariralang magkakatulad ang anyo. Walang instrumentong idinagdag dahil hindi ito pinangalanan sa mismong talata; wala ring talababa sapagkat naipahayag sa teksto ang mahahalagang kahulugan nang hindi kailangang resolbahin ang tunay na ambiguwidad.
