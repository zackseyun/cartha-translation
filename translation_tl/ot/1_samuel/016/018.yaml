  rationale: 'Idinagdag ang “Narito” upang katawanin ang הִנֵּה, at ang “at nagsabi” upang katawanin ang ikalawang pandiwang pangsalaysay. Pinagaan ang pagpapalawak ng גִּבּוֹר חַיִל sa “magiting,” habang iniingatan ang hiwalay na katangiang pandigma ng אִישׁ מִלְחָמָה. Walang talababa ang kailangan: walang mahalagang ambiguwidad na kinakailangang ilagay sa talababa sa maikling talatang ito.'
