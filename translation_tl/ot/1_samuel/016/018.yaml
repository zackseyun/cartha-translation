- from: Sumagot ang isa sa mga kabataang lalaki, “May nakita akong anak ni Jesse na taga-Betlehem. Mahusay siyang tumugtog, magiting at matapang, bihasa sa pakikipagdigma, maingat magsalita, at makisig. At kasama niya si Yahweh.”
