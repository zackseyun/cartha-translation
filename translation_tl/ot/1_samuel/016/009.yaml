  source_fidelity: Ang “pinaraan ni Jesse si Shammah” ay wastong naghahayag ng causative na Hiphil ng עבר. Napananatili rin ang diwa ng גַּם sa “rin,” at tama ang “Yahweh” para sa יהוה. Gayunman, ang “Ngunit” ay nagdaragdag ng malinaw na kontrast na wala sa simpleng sunod-sunod na waw ng Hebreo. Ang “Hindi rin ito ang pinili ni Yahweh” ay maaari ring basahing pagkakakilanlan (“ito ang pinili”), samantalang ang Hebreo ay tuwirang nagsasabing hindi pinili ni Yahweh ang taong ito.
  naturalness: Likas at marangal ang “Pinaraan ni Jesse si Shammah” at “Sinabi niya.” Mas tuwiran at natural sa modernong Filipino ang “Hindi rin ito pinili ni Yahweh” kaysa “Hindi rin ito ang pinili ni Yahweh.”
