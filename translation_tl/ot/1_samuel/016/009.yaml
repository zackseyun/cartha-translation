  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּעֲבֵ֥ר יִשַׁ֖י שַׁמָּ֑ה וַ/יֹּ֕אמֶר גַּם בָּ/זֶ֖ה לֹא בָחַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/009.yaml
  text: Then Jesse made Shammah pass by, and he said, “Yahweh has not chosen this one either.”
translation:
  language: tl
  text: Pagkatapos, pinaraan ni Jesse si Shammah, at sinabi niya, “Hindi rin ito pinili ni Yahweh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: pinaraan
  rationale: 'Ang Hiphil ng עבר ay sanhi o causative: pinaraan ni Jesse si Shammah sa harap ni Samuel. Likas sa Tagalog ang “pinaraan” at napapanatili nito ang causative na diwa.'
- source_word: יִשַׁי
  choice: Jesse
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa makabagong saling Tagalog.
- source_word: שַׁמָּה
  choice: Shammah
  rationale: Tuwirang transliterasyon ng pangalang Hebreo, na kaayon ng ibinigay na tekstong konsultasyon.
- source_word: וַיֹּאמֶר
  choice: sinabi niya
  rationale: Panghalip lamang ang nasa Hebreo. Bagaman si Samuel ang malinaw na nagsasalita ayon sa konteksto, hindi ito ginawang tahasan sa pangunahing teksto upang mapanatili ang anyo at bahagyang kalabuan ng pinagmulan.
- source_word: גַּם ... לֹא
  choice: hindi rin
  rationale: 'Sa negatibong pahayag, natural na ipinahahayag ng “hindi rin” ang pandagdag na diwa ng גַּם: kabilang si Shammah sa mga hindi pinili.'
- source_word: בָּזֶה
  choice: ito
  rationale: Ang demonstratibo ay tumutukoy sa anak na kasalukuyang inihaharap. Sapat at natural sa Tagalog ang “ito.”
- source_word: לֹא בָחַר
  choice: hindi ... pinili
  rationale: Ang בחר ay nangangahulugang pumili. Ang aspektong perpektibo ay natural na naihahayag sa Tagalog sa “hindi pinili” sa loob ng tuwirang pananalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Ang “Yahweh” ay transliterasyong nagpapanatili sa personal na pangalan at hindi nagpapalit dito ng titulo.
- issue: Pagkilala sa nagsasalita
  choice: sinabi niya
  alternative: sinabi ni Samuel
  rationale: Malinaw sa konteksto na si Samuel ang nagsasalita, ngunit panghalip lamang ang nasa Hebreo. Pinanatili ang panghalip upang hindi magdagdag ng pangalang wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinaraan” upang mapanatili ang causative na kilos nang hindi nagiging mabigat ang pangungusap. Ang “Ngunit” ay natural na nag-uugnay sa pagpaparaan kay Shammah at sa kasunod na pagtanggi; ipinahihiwatig nito ang kontrast na likas sa salaysay kahit waw ang pormal na pang-ugnay sa Hebreo.
