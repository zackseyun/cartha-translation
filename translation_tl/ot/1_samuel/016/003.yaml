base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/003.yaml
  text: Invite Jesse to the sacrifice[a], and I will make known to you what you shall do[c][b]; and you shall anoint for me the one whom I tell you.
translation:
  language: tl
  text: Anyayahan mo si Jesse sa paghahain[a], at ipaaalam ko sa iyo kung ano ang gagawin mo[b], at papahiran mo ng langis para sa akin ang taong ituturo ko sa iyo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Tawagin mo si Jesse upang dumalo sa paghahain.”
    reason: lexical_alternative
  - marker: b
    text: O, “ipakikita ko sa iyo ang dapat mong gawin.”
    reason: lexical_alternative
  - marker: c
    text: O, “ang taong sasabihin ko sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרָאתָ
  choice: Anyayahan mo
  rationale: Sa konteksto ng isang paghahain, ang קרא ay tumutukoy sa pagtawag o pag-anyaya sa isang tao upang dumalo. Likas sa modernong Tagalog ang “anyayahan” at pinananatili nito ang pautos na diwa.
- source_word: לְיִשַׁי
  choice: si Jesse
  rationale: Ginamit ang karaniwang anyo ng pangalang pantangi sa Filipino at ang panandang “si.”
- source_word: בַּזָּבַח
  choice: sa paghahain
  rationale: Ang זבח ay maaaring tumukoy sa paghahain o sa okasyon nito. Sapat na malawak ang “sa paghahain” upang masaklaw ang kilos at pagtitipong kaugnay nito nang hindi idinaragdag ang ideya ng isang piging.
- source_word: וְאָנֹכִי אוֹדִיעֲךָ
  choice: at ipaaalam ko sa iyo
  rationale: Ang Hiphil ng ידע ay nangangahulugang magpabatid o magpaalam sa isang tao. Tumpak at natural ang “ipaaalam ko sa iyo,” habang ang “ko” ay sapat na nagpapahayag sa tahasang panghalip na אָנֹכִי.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: kung ano ang gagawin mo
  rationale: Pinananatili nito ang diwang panghinaharap at pantagubilin nang hindi dinaragdagan ang lakas nito sa pamamagitan ng “dapat” o “kailangan.”
- source_word: וּמָשַׁחְתָּ
  choice: Papahiran mo ng langis
  rationale: Ang משׁח ay teknikal na pandiwa para sa pagpapahid bilang pagtatalaga. Nililinaw ng “ng langis” ang likas na kahulugan ng pandiwa sa natural na Tagalog nang hindi tinutukoy rito ang tungkuling pagkahari.
- source_word: לִי
  choice: para sa akin
  rationale: Ipinahihiwatig ng parirala na ang pagpapahid ay gagawin para sa layunin ng Diyos o sa ngalan niya.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: ang taong tutukuyin ko sa iyo
  rationale: Literal na gumagamit ang Hebreo ng “sabihin,” ngunit ipinakikilala ng sugnay ang taong pipiliin ng Diyos. Natural na ipinahahayag ito ng “tutukuyin ko sa iyo,” samantalang itinatala sa talababa ang mas malapit na alternatibo.
theological_decisions:
- issue: Kalikasan ng pagpapahid
  choice: Panatilihin ang pormal na kilos ng pagpapahid bilang pagtatalaga, ngunit huwag tukuyin sa talata mismo na pagpapahid ito bilang hari.
  alternative: Isalin nang tahasan bilang “papahiran mo bilang hari.”
  rationale: Ipinahihiwatig ng mas malawak na konteksto ang pagpapahid sa magiging hari, ngunit hindi binabanggit ng talatang ito ang katungkulan. Hinahayaan ng salin na ang salaysay ang magbigay ng implikasyong iyon.
- issue: Pagkakakilanlan ng taong papahiran
  choice: “ang taong tutukuyin ko sa iyo”
  alternative: “ang sinumang sabihin ko sa iyo”
  rationale: Hindi pa pinapangalanan sa talata ang tao. Pinananatili ng salin ang pagiging di-tiyak ng pagkakakilanlan habang malinaw na Diyos ang magtuturo kung sino siya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “paghahain” at “papahiran ng langis” bilang pamilyar ngunit hindi labis na teknikal na wikang biblikal. Iniwasang idagdag ang “bilang hari” dahil konteksto, hindi ang mismong talata, ang tahasang nagpapahiwatig nito.
