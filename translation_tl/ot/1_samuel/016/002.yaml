  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֵ֣יךְ אֵלֵ֔ךְ וְ/שָׁמַ֥ע שָׁא֖וּל וַ/הֲרָגָ֑/נִי וַ/יֹּ֣אמֶר יְהוָ֗ה עֶגְלַ֤ת בָּקָר֙ תִּקַּ֣ח בְּ/יָדֶ֔/ךָ וְ/אָ֣מַרְתָּ֔ לִ/זְבֹּ֥חַ לַֽ/יהוָ֖ה בָּֽאתִיס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/002.yaml
  text: Samuel said[a], “How can I go? If Saul hears, he will kill me.” And Yahweh said, “Take a heifer with you and say, ‘I have come to sacrifice to Yahweh.’”
translation:
  language: tl
  text: Sinabi ni Samuel, “Paano ako makakapunta? Kung malaman ni Saul, papatayin niya ako.” Sinabi ni Yahweh, “Magdala ka ng isang dumalagang baka[a] at sabihin mo, ‘Naparito ako upang maghandog ng hain kay Yahweh.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang batang babaeng baka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ אֵלֵךְ
  choice: Paano ako makakapunta?
  rationale: Likas na Filipino para sa tanong tungkol sa praktikal na posibilidad ng pagpunta, hindi lamang sa paraan o ruta.
- source_word: וְשָׁמַע שָׁאוּל
  choice: Kapag nabalitaan iyon ni Saul
  rationale: Ang waw + perfect ay nagsasaad dito ng inaasahang kondisyon. Ipinahihiwatig ng “iyon” na ang mababalitaan ay ang pagpunta ni Samuel; natural ito sa Filipino at hindi labis na nagpapaliwanag.
- source_word: וַהֲרָגַנִי
  choice: papatayin niya ako
  rationale: Tumpak na ipinapahayag ang inaasahang bunga at agarang banta kapag nalaman ni Saul ang pagpunta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: עֶגְלַת בָּקָר
  choice: isang dumalagang baka
  rationale: Tumutukoy sa batang babaeng baka; malinaw ito sa karaniwang mambabasang Filipino at mas tiyak kaysa sa simpleng “batang baka.”
- source_word: תִּקַּח בְּיָדֶךָ
  choice: Magsama ka
  rationale: Ang literal na “kunin sa iyong kamay” ay isang idyoma para sa pagdadala o pagsasama; “magsama ka” ang natural na katumbas sa Filipino para sa isang hayop.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: upang maghandog kay Yahweh
  rationale: Ipinahahayag ang layunin ng pagparito at ang ritwal na paghahandog. Sa konteksto, nauunawaan ang pagkatay bilang bahagi ng handog nang hindi kailangang gawing mabigat ang pangungusap.
- source_word: בָּאתִי
  choice: Naparito ako
  rationale: Natural at marangal na pahayag sa Filipino sa pagdating upang ipahayag ang layunin ng pagpunta.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tahasan sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalang personal sa halip na palitan ito ng titulo.
- issue: Ang utos na sabihin ang layunin ng pagparito
  choice: 'Isinalin nang tuwiran: “Naparito ako upang maghandog kay Yahweh.”'
  alternative: Ipaliwanag sa teksto kung ito ay pagtatago, paglilihim, o panlilinlang
  rationale: Hindi hinahatulan o ipinaliliwanag ng talata ang moral na katangian ng utos. Pinananatili ng salin ang tensiyon at iniiwasang magpasok ng interpretasyong teolohikal.
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “dumalaga” bilang tiyak ngunit nauunawaang katawagan sa batang babaeng baka; naglaan ng talababa para sa mas lantad na alternatibo.
