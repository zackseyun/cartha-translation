  source_fidelity: Maingat na naihahatid ng draft ang tanong ni Samuel, ang kondisyunal na banta ni Saul, ang pagdadala ng isang dumalagang baka, at ang banal na pangalang Yahweh. Gayunman, ang “Kapag nabalitaan iyon ni Saul” ay nagdaragdag ng di-tiyak na panghalip na wala sa Hebreo, at ang “maghandog” lamang ay maaaring mas malawak kaysa sa tiyak na sakripisyong ipinahihiwatig ng זבח.
  naturalness: Maliwanag at angkop sa makabagong Filipino ang kabuuan. Mas tuwiran at natural sa kontekstong ito ang “Kung malaman ni Saul” kaysa “Kapag nabalitaan iyon ni Saul.” Ang “Magdala ka” ay mas karaniwang pananalita kaysa “Magsama ka” para sa hayop na dadalhin.
