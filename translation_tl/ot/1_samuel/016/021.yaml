base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/021.yaml
  text: So David came to Saul and stood before him[a], and Saul loved him greatly, and he became his armor-bearer.
translation:
  language: tl
  text: Dumating si David kay Saul at tumayo sa harap niya. Mahal na mahal siya ni Saul, at naging tagapagdala siya ng sandata ni Saul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapagdala ng kagamitang pandigma.” Ang Hebreo ay literal na tumutukoy sa isang taong nagdadala ng kagamitang pandigma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumunta
  rationale: Ang בוא na sinusundan ng אֶל ay nagsasaad ng paglapit o pagpunta sa isang tao; natural sa Tagalog ang “pumunta kay Saul.”
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: tumayo sa harap niya
  rationale: Pinananatili nito ang larawan ng Hebreong idyoma, na maaari ring magpahiwatig ng pagharap at paglilingkod sa isang nakatataas.
- source_word: וַיֶּאֱהָבֵהוּ מְאֹד
  choice: Mahal na mahal siya ni Saul
  rationale: Malinaw sa konteksto na si Saul ang simuno; ipinapahayag ng pag-uulit na “mahal na mahal” ang diin ng מְאֹד nang natural sa modernong Tagalog.
- source_word: וַיְהִי לוֹ
  choice: naging ... nito
  rationale: Ipinahihiwatig ng konstruksiyon ang pagpasok ni David sa isang bagong tungkulin para kay Saul.
- source_word: נֹשֵׂא כֵלִים
  choice: tagapagdala ... ng mga sandata
  rationale: Tumutukoy ito sa taong nagdadala ng kagamitang pandigma ng isang mandirigma; malinaw at likas sa Tagalog ang pariralang ito nang hindi nililimitahan ang כֵלִים sa baluti lamang.
