  - severity: low
    issue: Hindi ganap na malinaw ang panghalip na “nito” sa “mga sandata nito.”
    rationale: Bagaman malamang na si Saul ang tinutukoy, mas malinaw at mas angkop sa marangal na rehistro na pangalanan siya sa huling sugnay.
