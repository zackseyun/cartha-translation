id: 1SA.16.6
reference: 1 Samuel 16:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/בוֹאָ֔/ם וַ/יַּ֖רְא אֶת אֱלִיאָ֑ב וַ/יֹּ֕אמֶר אַ֛ךְ נֶ֥גֶד יְהוָ֖ה מְשִׁיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/006.yaml
  text: When they came in[a], he saw Eliab and said, “Surely Yahweh’s anointed is before Yahweh.”
translation:
  language: tl
  text: Pagdating nila, nakita niya si Eliab at sinabi niya, “Tiyak na nasa harap ni Yahweh ang kanyang pinahiran.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang kanyang Mesiyas.” Ang salitang Hebreo rito ay siya ring salitang ginamit kalaunan para sa “Mesiyas,” ngunit sa kontekstong ito ay tumutukoy ito sa taong inaakala ni Samuel na pinili at pinahiran ni Yahweh bilang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאָם
  choice: Pagdating nila
  rationale: Likas na inilalahad sa modernong Tagalog ang temporal na panimula ng salaysay nang hindi ginagamit ang makalumang pormulang “at nangyari.”
- source_word: וַיַּרְא אֶת אֱלִיאָב
  choice: nakita niya si Eliab
  rationale: Tuwirang salin ng pandiwang ראה at ng pangalang pantangi na Eliab.
- source_word: וַיֹּאמֶר
  choice: at sinabi niya
  rationale: Pinananatili ang karaniwang kahulugan na “sinabi”; hindi idinagdag na ito ay sinabi lamang niya sa sarili dahil hindi iyon tahasang tinutukoy ng Hebreo.
- source_word: אַךְ
  choice: Tiyak na
  rationale: Ipinahahayag ang matibay at agarang palagay ni Samuel nang makita niya si Eliab.
- source_word: נֶגֶד יְהוָה
  choice: nasa harap ni Yahweh
  rationale: Pinananatili ang tahasang banal na pangalan at ang kahulugang “sa harap” o “sa presensiya” ni Yahweh.
- source_word: מְשִׁיחוֹ
  choice: ang kanyang pinahiran
  rationale: Ipinahahayag ang literal na diwa ng “kanyang pinahirang tao” sa konteksto ng pagpili ng hari, habang pinananatili ang panghalip na tumutukoy kay Yahweh.
theological_decisions:
- issue: Paglalahad sa מְשִׁיחוֹ sa konteksto ng pagpili ng hari
  choice: ang kanyang pinahiran
  alternative: ang kanyang Mesiyas
  rationale: Sa tagpong ito, ang salita ay tumutukoy sa taong inaakala ni Samuel na pinili at pahihiran ni Yahweh bilang hari. Ang “pinahiran” ay nagpapanatili sa agarang historikal na diwa nang hindi ipinapasok ang mas huling espesipikong gamit ng titulong “Mesiyas”; inilalahad sa talababa ang ugnayang leksikal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang personal na pangalang “Yahweh,” at iniwasan ang makaluma o labis na teknikal na pananalita.
