  source_fidelity: Tumpak sa kabuuan ang paglilipat ng mungkahi ng mga lingkod, paghahanap ng bihasang manlalaro ng lira, at ang resulta para kay Saul. Ang “nakapipinsala mula sa Diyos” ay isang katanggap-tanggap na kontekstuwal na pagsasalin ng רוּחַ אֱלֹהִים רָעָה, at maayos na pinananatili ng talababa ang mga alternatibong leksikal at sintaktiko.
  naturalness: May bahagyang kalabuan ang “Magsabi po ang aming panginoon sa mga lingkod ninyo ... na humanap sila,” sapagkat maaari itong mabasa na basta magsasalita ang hari sa mga lingkod, sa halip na ipahayag niya ang mungkahing maghanap sila. Mas malinaw at likas ang “Sabihin nawa ... na ...” sa magalang na rehistrong panghukuman. Mas natural din ang “nasa inyong harapan” kaysa “narito sa inyong harapan.”
  terminology: Ang “panginoon,” “mga lingkod,” “lira,” at “espiritung nakapipinsala mula sa Diyos” ay angkop. Ang maliit na titik sa “panginoon” ay wasto para sa titulong pantao. Wasto rin ang talababa at ang angkla nitong [a].
