base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/016.yaml
  text: Please let our lord say to your servants before you that they should seek out a man who knows how to play the lyre; and when a harmful spirit from God is upon you[a], he will play with his hand, and it will be well for you.
translation:
  language: tl
  text: “Sabihin nawa ng aming panginoon sa mga lingkod ninyo na nasa inyong harapan na humanap sila ng isang lalaking marunong tumugtog ng lira. Kapag dumapo sa inyo ang isang espiritung nakapipinsala mula sa Diyos[a], tutugtog siya gamit ang kanyang kamay, at bubuti ang inyong kalagayan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang masamang espiritu mula sa Diyos”; sa Hebreo, “isang masama/nakapipinsalang espiritu ng/mula sa Diyos.”
    reason: Pinananatili ang leksikal na posibilidad ng “masama” at ang sintaktikong posibilidad ng “ng Diyos” o “mula sa Diyos.”
lexical_decisions:
- source_word: יֹאמַר נָא
  choice: Magsabi po
  rationale: Ipinahahayag ng anyong pandiwa kasama ng נָא ang magalang na pakiusap; likas sa modernong Tagalog ang paglalagay ng “po” upang ipakita ang paggalang.
- source_word: אֲדֹנֵינוּ
  choice: aming panginoon
  rationale: Magalang na tawag ito kay Saul bilang pinuno, hindi banal na titulo; kaya maliit ang titik sa “panginoon.”
- source_word: עֲבָדֶיךָ לְפָנֶיךָ
  choice: mga lingkod ninyo na narito sa inyong harapan
  rationale: Pinananatili nito ang pagkakakilanlan ng mga lingkod bilang mga tagapaglingkod na nasa presensiya ng hari, habang natural sa Tagalog.
- source_word: יְבַקְשׁוּ אִישׁ
  choice: humanap sila ng isang lalaki
  rationale: Malinaw na ipinahahayag ang mungkahing magsagawa ang mga lingkod ng sadyang paghahanap sa isang angkop na tao.
- source_word: יֹדֵעַ מְנַגֵּן
  choice: marunong tumugtog
  rationale: Ang pariralang Hebreo ay tumutukoy sa kakayahan o kasanayan sa pagtugtog; “marunong tumugtog” ang likas at tuwirang katumbas.
- source_word: כִּנּוֹר
  choice: lira
  rationale: Ang כִּנּוֹר ay isang sinaunang instrumentong de-kuwerdas na mas tiyak na lira kaysa sa tradisyonal ngunit mas malawak na “alpa.”
- source_word: וְהָיָה בִּהְיוֹת ... עָלֶיךָ
  choice: Kapag dumapo sa inyo
  rationale: Likas nitong inilalahad sa Tagalog ang panahong kalagayan at ang diwang pumapasailalim si Saul sa mapaniil na presensiya ng espiritu.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: isang espiritung nakapipinsala mula sa Diyos
  rationale: Ang “nakapipinsala” ay nagpapahayag ng mapanirang epekto ng רָעָה nang hindi sapilitang nilulutas kung moral na “masama” ang diin; pinananatili ng “mula sa Diyos” ang tahasang ugnayan sa Diyos.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: tutugtog siya gamit ang kanyang kamay
  rationale: Pinananatili ang kongkretong idyomang Hebreo na “sa pamamagitan ng kanyang kamay,” sa paraang mauunawaan sa Tagalog.
- source_word: וְטוֹב לָךְ
  choice: bubuti ang inyong kalagayan
  rationale: Mas malawak ito kaysa simpleng pagbuti ng damdamin at pinananatili ang pangkalahatang resultang mabuti para kay Saul.
theological_decisions:
- issue: Kung paano isasalin ang רוּחַ אֱלֹהִים רָעָה nang hindi inaalis ang ugnayan nito sa Diyos o dinaragdagan ang teksto ng paliwanag-doktrina
  choice: isang espiritung nakapipinsala mula sa Diyos
  alternative: isang masamang espiritu ng/mula sa Diyos
  rationale: Maaaring ilarawan ng רָעָה ang masamang katangian o ang nakapipinsalang epekto, at maaaring ipahiwatig ng kaugnayang אֱלֹהִים ang “ng” o “mula sa.” Inilalagay sa pangunahing teksto ang kontekstuwal na “nakapipinsala mula sa Diyos” at itinatala sa talababa ang mas literal na mga posibilidad upang mapanatili ang tunay na teolohikal at sintaktikong tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ang himig. Ginamit ang “po” at pangmaramihang anyo ng paggalang na “ninyo/inyo” para sa pananalita sa hari. Iniwasan ang labis na arkaikong pananalita habang pinanatili ang anyong panghukuman at ang kongkretong idyoma tungkol sa kamay.
