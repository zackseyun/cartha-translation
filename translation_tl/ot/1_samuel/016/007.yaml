  to: Ngunit sinabi ni Yahweh kay Samuel, “Huwag mong tingnan ang kanyang anyo o ang kanyang katangkaran, sapagkat tinanggihan ko siya. Sapagkat hindi gaya ng pagtingin ng tao ang pagtingin ni Yahweh;[a] ang tao ay tumitingin sa nasa harap ng mga mata, ngunit si Yahweh ay tumitingin sa puso.”
