base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/007.yaml
  text: But Yahweh said to Samuel[a], “Do not look at his appearance or at the height of his stature, because I have rejected him. For not as man sees does God see, for man sees what is before the eyes[c][b], but Yahweh sees the heart.”
translation:
  language: tl
  text: Ngunit sinabi ni Yahweh kay Samuel, “Huwag mong tingnan ang kanyang anyo o ang kanyang katangkaran, sapagkat tinanggihan ko siya. Sapagkat hindi gaya ng pagtingin ng tao ang pagtingin ni Yahweh;[a] ang tao ay tumitingin sa nasa harap ng mga mata, ngunit si Yahweh ay tumitingin sa puso.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Sapagkat hindi ayon sa nakikita ng tao.” Eliptikal ang Hebreo; ipinahihiwatig na iba ang paraan ng pagtingin ni Yahweh sa paraan ng pagtingin ng tao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: תַּבֵּט
  choice: tingnan
  rationale: Natural na utos sa Tagalog at angkop sa pagbabawal na ituon ang pansin sa panlabas na katangian.
- source_word: מַרְאֵהוּ
  choice: kanyang anyo
  rationale: Tumutukoy sa nakikitang hitsura at maayos na kaagapay ng kasunod na pagtukoy sa tindig.
- source_word: גְּבֹהַּ קוֹמָתוֹ
  choice: taas ng kanyang tindig
  rationale: Pinananatili ang diin sa pisikal na katangkaran nang hindi nagiging mabigat o di-natural sa Tagalog.
- source_word: מְאַסְתִּיהוּ
  choice: tinanggihan ko siya
  rationale: Sa konteksto ng pagpili ng hari, ipinahihiwatig ng pandiwa na hindi siya tinanggap bilang nararapat piliin; mas natural dito ang “tinanggihan” kaysa “itinakwil.”
- source_word: הָאָדָם
  choice: ang tao
  rationale: Ginagamit bilang panlahat na katawagan sa mga tao, kasalungat ng paraan ng pagtingin ni Yahweh.
- source_word: לַעֵינַיִם
  choice: sa nasa harap ng mga mata
  rationale: Pinananatili ang konkretong larawan ng Hebreo sa halip na agad itong ipakahulugang “panlabas na anyo.”
- source_word: לַלֵּבָב
  choice: sa puso
  rationale: Karaniwang katumbas na nagpapanatili sa puso bilang sentro ng isip, kalooban, at pagkatao sa gamit ng Hebreo.
theological_decisions:
- issue: Paghahambing ng paraan ng pagtingin ng tao at ni Yahweh
  choice: hindi gaya ng pagtingin ng tao ang pagtingin ni Yahweh
  alternative: hindi batay sa nakikita ng tao
  rationale: Ang Hebreo ay eliptikal, kaya nilinaw sa natural na Tagalog ang ipinahihiwatig na paksa nang hindi binabago ang pangunahing paghahambing.
- issue: Kahulugan ng “puso”
  choice: puso
  alternative: kalooban o panloob na pagkatao
  rationale: Pinananatili ang metapora at lawak ng לֵבָב sa halip na paliitin ito sa damdamin, isip, o moral na katangian lamang.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Tagalog. Ginamit ang “tindig” para sa natural ngunit tapat na paglalarawan ng pisikal na taas, at pinanatili ang konkretong larawang “nasa harap ng mga mata” at ang teolohikal na metaporang “puso.”
