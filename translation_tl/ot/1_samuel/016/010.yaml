    issue: Malabo ang “pinalampas.”
    rationale: Maaari itong unawain bilang pagpayag na makalampas o pagliban sa isang bagay, samantalang ang Hiphil ng עבר ay nagpapakitang ipinadaan/ipinaharap ni Jesse ang kanyang mga anak kay Samuel.
  - severity: low
    issue: Hindi gaanong tuwiran ang “Walang pinili si Yahweh sa mga ito.”
    rationale: Nauunawaan ito, ngunit ang “Hindi pinili ni Yahweh ang alinman sa mga ito” ay mas malinaw na naghahayag ng negatibong pandiwang בָחַר at ng eksklusibong diwa ng בָּאֵלֶּה.
  revised_text: Kaya ipinadaan ni Jesse sa harap ni Samuel ang pito sa kanyang mga anak. Ngunit sinabi ni Samuel kay Jesse, “Hindi pinili ni Yahweh ang alinman sa mga ito.”
