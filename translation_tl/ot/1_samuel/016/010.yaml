base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/010.yaml
  text: So Jesse had seven of his sons pass before Samuel, and Samuel said to Jesse, “Yahweh has not chosen any of these.”
translation:
  language: tl
  text: Kaya ipinadaan ni Jesse sa harap ni Samuel ang pito sa kanyang mga anak. Ngunit sinabi ni Samuel kay Jesse, “Hindi pinili ni Yahweh ang alinman sa mga ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: pinalampas ... sa harap
  rationale: 'Ang Hiphil ay causative: si Jesse ang nagpadaraan sa kaniyang mga anak sa harap ni Samuel. Likas sa Tagalog ang “pinalampas ... sa harap” at pinananatili nito ang causative na diwa.'
- source_word: שִׁבְעַת בָּנָיו
  choice: ang pito sa mga anak niya
  rationale: Ipinapahayag ng parirala ang pitong kabilang sa kaniyang mga anak at hindi ipinahihiwatig na pito lamang ang kabuuan, na mahalaga dahil lalabas pa si David sa kasunod na salaysay.
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Natural at tuwirang katumbas ito ng spatial at relational na kahulugan ng Hebreo.
- source_word: לֹא בָחַר
  choice: Walang pinili
  rationale: Ang בחר ay “pumili.” Sa negatibong pangungusap na may בָּאֵלֶּה, natural na ipinahahayag sa Tagalog ang konklusyon bilang “Walang pinili ... sa mga ito.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בָּאֵלֶּה
  choice: sa mga ito
  rationale: Ipinahahayag nito na wala sa pangkat ng mga anak na iniharap ang pinili ni Yahweh.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang banal na pangalan at hindi ito pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “niya” sa salaysay para sa natural na kasalukuyang Tagalog, habang nananatiling angkop ang tono sa Kasulatan.
