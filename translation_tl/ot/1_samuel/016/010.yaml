- from: Kaya pinalampas ni Jesse sa harap ni Samuel ang pito sa mga anak niya. Ngunit sinabi ni Samuel kay Jesse, “Walang pinili si Yahweh sa mga ito.”
  to: Kaya ipinadaan ni Jesse sa harap ni Samuel ang pito sa kanyang mga anak. Ngunit sinabi ni Samuel kay Jesse, “Hindi pinili ni Yahweh ang alinman sa mga ito.”
  rationale: Pinalitan ang “pinalampas” ng “ipinadaan” upang malinaw na maipahayag ang causative na pagkilos ni Jesse sa pagpapaharap ng kanyang mga anak kay Samuel. Ginawang mas tuwiran ang ikalawang pangungusap habang pinananatili ang kahulugang walang isa man sa mga iniharap ang pinili ni Yahweh.
