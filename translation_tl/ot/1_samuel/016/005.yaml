  text: וַ/יֹּ֣אמֶר שָׁל֗וֹם לִ/זְבֹּ֤חַ לַֽ/יהוָה֙ בָּ֔אתִי הִֽתְקַדְּשׁ֔וּ וּ/בָאתֶ֥ם אִתִּ֖/י בַּ/זָּ֑בַח וַ/יְקַדֵּ֤שׁ אֶת יִשַׁי֙ וְ/אֶת בָּנָ֔י/ו וַ/יִּקְרָ֥א לָ/הֶ֖ם לַ/זָּֽבַח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/005.yaml
  text: He said[a], “Peace. I have come to sacrifice to Yahweh. Consecrate yourselves, and come with me to the sacrifice.” And he consecrated Jesse and his sons and invited them to the sacrifice.
translation:
  language: tl
  text: Sinabi niya, “Kapayapaan.[a] Naparito ako upang maghandog kay Yahweh. Italaga ninyo ang inyong mga sarili, at sumama kayo sa akin sa paghahandog.” Itinalaga niya si Jesse at ang mga anak niyang lalaki, at inanyayahan niya sila sa paghahandog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Mapayapa ang pagparito ko” o “Maayos ang lahat.” Sa Hebreo, “Kapayapaan” lamang ang sagot—isang katiyakang hindi laban sa kanila ang pagdating ni Samuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Kapayapaan
  rationale: Tuwirang pinananatili ang maikli at sadyang malawak na sagot sa Hebreo. Sa konteksto, tinitiyak ni Samuel na mapayapa at hindi mapanakit ang kanyang pagdating; ipinapaliwanag sa talababa ang idyomatikong diwa.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: upang maghandog kay Yahweh
  rationale: Ipinahahayag ng לִ ang layunin ng pagparito ni Samuel. Ang “maghandog” ay natural sa modernong Filipino at malinaw na tumutukoy sa ritwal na paghahain sa Diyos.
- source_word: בָּאתִי
  choice: Naparito ako
  rationale: Ang perpektong pandiwa ay nagpapaliwanag ng kasalukuyang layunin ni Samuel. Ang “naparito ako” ay natural sa pagsasalita at nakatuon sa pagdating niya sa kinaroroonan ng kausap.
- source_word: הִתְקַדְּשׁוּ
  choice: Italaga ninyo ang inyong sarili
  rationale: Tumutukoy ang hitpael sa ritwal na paghahanda at pagbubukod ng sarili para sa banal na gawain. Pinananatili ng “italaga” ang ideya ng pagbubukod nang hindi ito nililimitahan sa pisikal na paglilinis.
- source_word: וּבָאתֶם אִתִּי בַּזָּבַח
  choice: at sumama kayo sa akin sa paghahandog
  rationale: Inilalahad ito bilang paanyaya o tagubilin kasunod ng paghahanda. Ang “sumama kayo sa akin” ay natural na nagsasaad ng paglahok sa tiyak na gawaing paghahandog.
- source_word: וַיְקַדֵּשׁ
  choice: Itinalaga niya
  rationale: Ang piel ng קדשׁ ay nagsasaad na ritwal na ibinukod o inihanda ni Samuel sina Jesse at ang mga anak nito para sa paghahandog. Inuulit ng “itinalaga” ang ugnayang leksikal sa naunang utos.
- source_word: וַיִּקְרָא לָהֶם לַזָּבַח
  choice: inanyayahan niya sila sa paghahandog
  rationale: Sa konteksto, ang קרא + ל ay pagsasama sa kanila sa ritwal, kaya mas natural ang “inanyayahan” kaysa “tinawag” o “ipinatawag,” na maaaring magpahiwatig ng pamimilit.
- source_word: יִשַׁי
  choice: Jesse
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino at sa tradisyong biblikal.
- source_word: בָּנָיו
  choice: ang mga anak nitong lalaki
  rationale: Tahasang mga anak na lalaki ang tinutukoy ng Hebreo, at mahalaga ang kasarian sa kasunod na salaysay tungkol sa mga anak ni Jesse.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit sa teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang kultikong diwa ng קדשׁ sa “italaga” at iniwasang ipakahulugan ito bilang paglilinis lamang. Ginamit ang “paghahandog” para sa tiyak na ritwal na tinutukoy sa talata.
