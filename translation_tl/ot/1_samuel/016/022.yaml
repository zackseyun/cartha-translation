  text: וַ/יִּשְׁלַ֣ח שָׁא֔וּל אֶל יִשַׁ֖י לֵ/אמֹ֑ר יַעֲמָד נָ֤א דָוִד֙ לְ/פָנַ֔/י כִּֽי מָ֥צָא חֵ֖ן בְּ/עֵינָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/022.yaml
  text: Then Saul sent to Jesse[a], saying, “Please let David stand before me, for he has found favor in my eyes.”
translation:
  language: tl
  text: Pagkatapos, nagpasabi si Saul kay Jesse[a], “Pahintulutan mong manatili si David sa harapan ko, sapagkat kinalugdan ko siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pahintulutan mong maglingkod si David sa harapan ko.” Ang Hebreo ay literal na “tumayo sa harapan ko” at maaaring tumukoy sa patuloy na pagdalo o paglilingkod kay Saul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח שָׁאוּל אֶל יִשַׁי
  choice: Pagkatapos, nagpasabi si Saul kay Jesse
  rationale: Ang wayyiqtol ay nagpapatuloy sa salaysay. Likas sa Filipino ang “nagpasabi ... kay” para sa pagpapadala ng mensaheng sinusundan ng tuwirang sinabi.
- source_word: לֵאמֹר
  choice: tuwirang sipi pagkatapos ng kuwit
  rationale: Ang karaniwang pormulang pambanggit na Hebreo ay natural na naipahihiwatig sa Filipino sa pamamagitan ng tuwirang sipi; ang literal na “na sinasabi” ay magiging mabigat.
- source_word: יַעֲמָד נָא
  choice: Pahintulutan mong manatili
  rationale: Ang jussive na may נָא ay isang magalang na pakiusap. Bagaman literal na “tumayo,” sa konteksto ng paglilingkod sa hari, ipinahihiwatig ng עמד ang patuloy na pananatili o pagdalo sa harap ni Saul.
- source_word: לְפָנַי
  choice: sa harapan ko
  rationale: Pinananatili ang malinaw na idyomang Hebreo, na sa kontekstong maharlika ay nagpapahiwatig ng paglilingkod o pagdalo sa hari.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pakiusap ni Saul sa dignified ngunit nauunawaang Filipino.
- source_word: מָצָא חֵן בְּעֵינָי
  choice: kinalugdan ko siya
  rationale: Ito ang likas na Filipino para sa idyomang “nakasumpong ng pabor sa aking mga mata,” at malinaw na ipinahahayag ang personal na pagsang-ayon ni Saul nang hindi binibigyan ng di-angkop na teolohikal na kulay.
- source_word: דָוִד / שָׁאוּל / יִשַׁי
  choice: David / Saul / Jesse
  rationale: Ginamit ang mga karaniwang anyo ng mga pangalang ito sa makabagong saling Filipino ng Bibliya.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Pahintulutan” upang maipahayag ang magalang na נָא, at “manatili sa harapan ko” upang mapanatili kapwa ang idyomang Hebreo at ang diwa ng patuloy na paglilingkod sa korte.
