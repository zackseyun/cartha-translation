base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/008.yaml
  text: Then Jesse called Abinadab and made him pass before Samuel. And he said[a], “Yahweh has not chosen this one either.”
translation:
  language: tl
  text: Pagkatapos, tinawag ni Jesse si Abinadab at ipinaraan niya si Abinadab sa harap ni Samuel. At sinabi niya[a], “Hindi rin siya pinili ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa konteksto, si Samuel ang nagsasalita; hindi tahasang inuulit sa Hebreo ang pangalan niya.
    reason: implicit_subject
lexical_decisions:
- source_word: וַיִּקְרָא יִשַׁי אֶל אֲבִינָדָב
  choice: tinawag ni Jesse si Abinadab
  rationale: Likas sa modernong Tagalog ang “tinawag ... si” para sa קרא אֶל sa kontekstong ito; hindi kailangang isalin nang hiwalay ang pang-ukol na אֶל.
- source_word: וַיַּעֲבִרֵהוּ לִפְנֵי שְׁמוּאֵל
  choice: pinaraan niya ito sa harap ni Samuel
  rationale: 'Pinananatili ng “pinaraan” ang tahasang sanhiang diwa ng Hiphil ng עבר: si Jesse ang nagparaan kay Abinadab sa harap ni Samuel.'
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili ang payak na panghalip at ang dugtong na waw ng Hebreo. Bagaman malinaw sa konteksto na si Samuel ang nagsasalita, hindi tahasang binabanggit muli ng talata ang pangalan niya.
- source_word: גַּם בָּזֶה לֹא בָחַר
  choice: Hindi rin ito pinili
  rationale: Ang “hindi rin ito” ang natural na Tagalog na katumbas ng additive na גַּם sa isang negatibong pahayag; pinananatili nito ang diwang hindi rin napili ang kasunod na anak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang YHWH bilang “Yahweh” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Pagkilala sa nagsasalita sa וַיֹּאמֶר
  choice: sinabi niya
  alternative: sinabi ni Samuel
  rationale: Hindi tahasang pinangalanan sa sugnay na Hebreo ang simuno. Pinananatili ng panghalip ang anyo ng pinagmulan, habang nililinaw ng talababa na si Samuel ang tinutukoy ayon sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “ito” para kay Abinadab dahil natural itong pantukoy sa taong sinusuri sa ganitong konteksto, at iniwasan ang labis na pormal o makalumang pananalita.
