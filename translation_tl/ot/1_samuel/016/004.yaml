revisions:
- from: Kaya ginawa ni Samuel ang sinabi ni Yahweh at dumating siya sa Betlehem. Nanginginig na sinalubong siya ng mga nakatatandang pinuno ng lungsod, at sinabi ng isa sa kanila[a], “Mapayapa ba ang pagpunta mo rito?”
  to: Ginawa ni Samuel ang sinabi ni Yahweh at dumating sa Betlehem. Nanginig ang mga nakatatandang pinuno ng lungsod nang salubungin nila siya, at sinabi niya[a], “Mapayapa ba ang pagdating mo?”
