  text: וַ/יַּ֣עַשׂ שְׁמוּאֵ֗ל אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה וַ/יָּבֹ֖א בֵּ֣ית לָ֑חֶם וַ/יֶּחֶרְד֞וּ זִקְנֵ֤י הָ/עִיר֙ לִ/קְרָאת֔/וֹ וַ/יֹּ֖אמֶר שָׁלֹ֥ם בּוֹאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/004.yaml
  text: So Samuel did what Yahweh had spoken and came to Bethlehem. The elders of the city trembled at his coming and said[a], “Do you come in peace?”
translation:
  language: tl
  text: Ginawa ni Samuel ang sinabi ni Yahweh at dumating sa Betlehem. Nanginig ang mga nakatatandang pinuno ng lungsod nang salubungin nila siya, at sinabi niya[a], “Mapayapa ba ang pagdating mo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isahan ang pandiwang “sinabi niya,” bagaman maramihan ang “mga nakatatandang pinuno.” Maaaring isang kinatawan ang nagsalita para sa buong pangkat; maaari ring isalin, “at sinabi nila.”
    reason: Pinananatili ang hindi pangkaraniwang isahang pandiwa sa tekstong Masoretiko nang hindi ipinipilit sa pangunahing teksto na tiyak na isang elder ang nagsalita.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ginawa
  rationale: Likas at tuwirang katumbas ng עשה sa salaysay; ipinahihiwatig ng konteksto ang pagsunod ni Samuel nang hindi dinaragdagan ang pandiwa ng di-hayag na kahulugang ‘inutusan.’
- source_word: אֵת אֲשֶׁר דִּבֶּר יְהוָה
  choice: ang sinabi ni Yahweh
  rationale: Pinananatili ang payak na diwa ng דִּבֶּר, ‘nagsalita/nagsabi,’ at hindi ito pinatitindi bilang ‘iniutos.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: וַיָּבֹא בֵּית לָחֶם
  choice: dumating siya sa Betlehem
  rationale: Sa konteksto ng paglalakbay, malinaw at natural sa Filipino ang ‘dumating’; ang בוא ay maaaring mangahulugang pumunta, dumating, o pumaroon ayon sa pananaw ng salaysay.
- source_word: וַיֶּחֶרְדוּ
  choice: nanginginig
  rationale: Pinananatili ang malinaw na pisikal at emosyonal na lakas ng חרד, na nagpapahiwatig ng takot o matinding pagkabalisa.
- source_word: זִקְנֵי הָעִיר
  choice: mga nakatatandang pinuno ng lungsod
  rationale: Ipinakikita na ang זקנים ay mga kinikilalang pinuno ng pamayanan, hindi lamang matatanda sa edad.
- source_word: לִקְרָאתוֹ
  choice: sinalubong siya
  rationale: Natural na Filipino para sa pagkilos na lumabas upang makipagtagpo sa dumarating na si Samuel.
- source_word: שָׁלֹם בּוֹאֶךָ
  choice: Mapayapa ba ang pagpunta mo rito?
  rationale: 'Likas na tanong sa Filipino na pinananatili ang diwa ng nominal na pariralang Hebreo: kung mapayapa ba ang layon o katangian ng pagdating ni Samuel.'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Ang simuno ng וַיֹּאמֶר na nasa isahan
  choice: sinabi ng isa sa kanila
  alternative: sinabi nila; sinabi niya
  rationale: Isahan ang pandiwang Masoretiko bagaman maramihan ang naunang ‘mga nakatatandang pinuno.’ Ang salin ay nagpapakitang maaaring isang kinatawan ng pangkat ang nagsalita, habang inilalahad sa talababa ang literal na anyo at alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mga nakatatandang pinuno’ upang maipahayag ang opisyal na tungkulin ng mga elder, at ‘nanginginig na sinalubong’ upang maging natural ang kilos at damdamin sa Tagalog.
