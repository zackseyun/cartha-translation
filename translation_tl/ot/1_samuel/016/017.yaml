translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ang himig. Ginamit ang “Pakihanap ninyo” upang maipahayag ang magalang na puwersa ng נָא, at “lingkod” upang manatiling malapit sa katawagang Hebreo sa konteksto ng korte.
