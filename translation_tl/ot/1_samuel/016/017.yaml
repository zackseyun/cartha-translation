  text: Then Saul said to his servants[a], “Please find for me a man who can play well, and bring him to me.”
translation:
  language: tl
  text: At sinabi ni Saul sa kanyang mga lingkod, “Pakihanap ninyo ako ng isang lalaking mahusay na tumugtog[a], at dalhin ninyo siya sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “isang lalaking mahusay sa pagtugtog”; ibig sabihin, isang lalaking bihasang tumugtog.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kaya sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay; likas sa modernong Tagalog ang “Kaya sinabi” upang ipakita ang pagkakasunod ng pangyayari.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Pangunahing kahulugan ng עֶבֶד ang “lingkod.” Bagaman mga tauhan sila sa korte ng hari, nananatiling malinaw at malapit sa Hebreo ang “mga lingkod.”
- source_word: רְאוּ נָא
  choice: Pakihanap ninyo
  rationale: Sa kontekstong ito, ang pautos na ראה kasama ng נָא ay magalang na pakiusap na maghanap o tumukoy ng isang tao. Likas na ipinahahayag ito ng “Pakihanap ninyo.”
- source_word: לִי
  choice: ako ng
  rationale: Ipinakikita ng לִי na para sa kapakinabangan o paggamit ni Saul ang taong hahanapin. Ang konstruksiyong “Pakihanap ninyo ako ng…” ang natural na katumbas nito sa Tagalog.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tahasang panlalaking pangngalang isahan ang Hebreo, kaya pinanatili ang “isang lalaki” sa halip na gawing walang tinutukoy na kasarian.
- source_word: מֵיטִיב לְנַגֵּן
  choice: mahusay tumugtog
  rationale: Literal itong tumutukoy sa isang taong mahusay sa pagtugtog. Maikli, natural, at hindi nito dinaragdagan ang talata ng isang instrumentong hindi tahasang binanggit dito.
- source_word: וַהֲבִיאוֹתֶם אֵלָי
  choice: at dalhin ninyo siya sa akin
  rationale: Maramihan ang utos sa mga lingkod, samantalang isahan ang taong dadalhin; malinaw na naipapakita ito ng “ninyo” at “siya.”
