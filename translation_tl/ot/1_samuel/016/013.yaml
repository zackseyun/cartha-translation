base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/013.yaml
  text: Then Samuel took the horn of oil and anointed him in the midst of his brothers[a]. And the Spirit of Yahweh rushed upon David from that day onward[b]. Then Samuel rose and went to Ramah.
translation:
  language: tl
  text: Pagkatapos, kinuha ni Samuel ang sungay na may langis at pinahiran niya ng langis si David sa gitna ng kanyang mga kapatid. Simula noong araw na iyon, makapangyarihang lumukob kay David ang Espiritu ni Yahweh.[a] Pagkatapos, bumangon si Samuel at pumunta sa Rama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dumating nang buong lakas kay David ang Espiritu ni Yahweh.” Ang pandiwang Hebreo ay maaaring magpahiwatig ng marahas at nagbibigay-kakayahang pagdating. Hindi rin minamarkahan ng tekstong Hebreo ang pagkakaiba ng malaking titik at maliit na titik, kaya maaari ring isulat na “espiritu ni Yahweh.”
    reason: lexical_and_interpretive_alternative
lexical_decisions:
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: sungay na lalagyan ng langis
  rationale: Pinananatili ang konkretong larawan ng קֶרֶן bilang sungay ng hayop na ginamit na sisidlan, ngunit nililinaw sa natural na Tagalog na lalagyan ito ng langis.
- source_word: וַיִּמְשַׁח
  choice: pinahiran ... ng langis
  rationale: Likas at malinaw sa modernong Tagalog ang pariralang ito para sa ritwal na pagpapahid; pinananatili nito kapwa ang pisikal na kilos at ang kahalagahan ng pagtatalaga.
- source_word: בְּקֶרֶב אֶחָיו
  choice: sa gitna ng kanyang mga kapatid
  rationale: Malapit ito sa literal na diwa ng בְּקֶרֶב at hindi nagpapasya kung ang diin ay simpleng pagkakasama nila o ang pagsaksi nila sa pangyayari.
- source_word: וַתִּצְלַח רוּחַ יְהוָה אֶל דָּוִד
  choice: makapangyarihang suma kay David ang Espiritu ni Yahweh
  rationale: Ipinahahayag ng צלח sa kontekstong ito ang biglaan at makapangyarihang pagdating ng Espiritu. Ang 'suma' ay dignified at maikli, habang ipinahihiwatig ng 'makapangyarihan' ang lakas ng pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatinig ang personal na pangalang Hebreo sa halip na palitan ito ng titulong 'PANGINOON.'
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: Mula nang araw na iyon
  rationale: Natural na Tagalog ito para sa simula ng kalagayang nagpapatuloy; sa ayos ng pangungusap, nauunawaan ang patuloy na bisa mula noon.
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Pinananatili ang kilos ng קום sa salaysay at ang marangal na rehistro, nang hindi ito ginagawang 'umalis' lamang.
- source_word: הָרָמָתָה
  choice: sa Rama
  rationale: Ipinahihiwatig ng hulaping paturol sa Hebreo ang pagpunta patungo sa lugar; 'Rama' ang karaniwang anyo ng pangalan sa Tagalog.
theological_decisions:
- issue: Pag-unawa sa רוּחַ יְהוָה
  choice: ang Espiritu ni Yahweh
  alternative: ang espiritu ni Yahweh
  rationale: Sa konteksto, malamang na tumutukoy ito sa makapangyarihang presensiya ng Diyos na kumikilos kay David. Ginamit ang malaking titik ayon sa karaniwang Tagalog na pagsulat, ngunit hindi nito itinatago na walang malaking titik/maliit na titik na ganitong pagkakaiba sa tekstong Hebreo.
- issue: Saklaw ng pagkakasaksi sa pagpapahid kay David
  choice: sa gitna ng kanyang mga kapatid
  alternative: sa harap ng kanyang mga kapatid
  rationale: Pinananatili ang tahasang lokasyong panlipunan ng teksto nang hindi nagdaragdag ng palagay tungkol sa lawak ng pampublikong pagkilala sa pagiging hari ni David.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'sungay na lalagyan ng langis' upang mapanatili ang sinaunang larawan nang hindi lumilikha ng kalituhan. Iniwasan ang mas teknikal na 'anoint' loanword at pinili ang likas na 'pinahiran ng langis.'
