revisions:
- from: Pagkatapos, kinuha ni Samuel ang sungay na lalagyan ng langis at pinahiran niya si David ng langis sa gitna ng kanyang mga kapatid. Mula nang araw na iyon, makapangyarihang suma kay David ang Espiritu ni Yahweh.[a] Pagkatapos, tumindig si Samuel at pumunta sa Rama.
