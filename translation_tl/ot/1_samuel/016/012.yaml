base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/012.yaml
  text: So he sent and brought him in. Now he was ruddy[a], with beautiful eyes and a handsome appearance. And Yahweh said, “Rise, anoint him, for this is he.”
translation:
  language: tl
  text: Kaya nagsugo siya at dinala siya roon. Mapula ang kanyang kulay[a], maganda ang kanyang mga mata, at makisig ang kanyang anyo. Sinabi ni Yahweh, “Tumayo ka at pahiran mo siya ng langis, sapagkat siya na nga ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “mamula-mula ang kanyang kulay.” Hindi tiyak sa Hebreo kung kutis o buhok ang tinutukoy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח וַיְבִיאֵהוּ
  choice: Kaya nagsugo siya at ipinakuha siya
  rationale: Pinananatili ang dalawang sunod na kilos—ang pagsusugo at ang pagpapapunta sa kanya—sa likas na daloy ng salaysay sa Filipino.
- source_word: אַדְמוֹנִי
  choice: Mapula ang kanyang kutis
  rationale: Ipinahihiwatig ng salita ang mapulang kulay o anyo, ngunit hindi nito tiyak na tinutukoy ang kulay ng buhok. Nililinaw ng “kutis” ang pinakaangkop na diwa nang hindi labis na nagpapakahulugan.
- source_word: עִם יְפֵה עֵינַיִם
  choice: maganda ang kanyang mga mata
  rationale: Tuwirang inilalarawan ng Hebreo ang kaaya-ayang mga mata; natural at malinaw ito sa modernong Filipino.
- source_word: וְטוֹב רֹאִי
  choice: at makisig ang kanyang anyo
  rationale: Ang parirala ay tumutukoy sa kaaya-ayang panlabas na anyo. Ang “makisig” ay natural para sa paglalarawan sa isang binata at hindi nagdaragdag ng moral na katangian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nakasulat sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: קוּם
  choice: Tumayo ka
  rationale: Isang tuwirang pautos kay Samuel; malinaw, maikli, at marangal sa kasalukuyang Filipino.
- source_word: מְשָׁחֵהוּ
  choice: pahiran mo siya ng langis
  rationale: Ipinapahayag nang malinaw sa ordinaryong Filipino ang ritwal na kahulugan ng pandiwang “magpahid bilang pagtatalaga” sa kontekstong maharlika.
- source_word: כִּי זֶה הוּא
  choice: sapagkat siya na nga ito
  rationale: Pinananatili ang maikli at mariing pagkilala ng Diyos sa taong naroon, nang hindi tahasang idinaragdag ang salitang “pinili.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa Hebreo. Ang paggamit ng “Yahweh” ay nagpapanatili sa pagkakaiba nito sa titulong “Panginoon.”
- issue: Paglalarawan sa panlabas na anyo ni David
  choice: Panatilihing pisikal lamang ang paglalarawan
  alternative: Bigyan ang mga katangian ng simboliko o moral na kahulugan
  rationale: Kulay, mga mata, at anyo lamang ang tahasang inilalarawan ng talata. Hindi ipinapaliwanag ng salin ang mga ito bilang patunay ng ugali o kabanalan, kaya nananatili ang tensiyon sa mas malawak na konteksto tungkol sa pagtingin ng Diyos at ng tao.
- issue: Mariing pagkilala sa כִּי זֶה הוּא
  choice: sapagkat siya na nga ito
  alternative: sapagkat siya ang pinili
  rationale: Ang alternatibo ay umaayon sa konteksto ngunit nagdaragdag ng pandiwang “pinili,” na wala sa mismong parirala. Pinananatili ng napiling salin ang pagiging tuwiran at mariin nito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal, na may payak na daloy ng salaysay. Iniwasan ang makalumang “bumangon ka” at ang teknikal na “anoint,” ngunit pinanatili ang tiyak na gawa sa pamamagitan ng “pahiran ng langis.”
