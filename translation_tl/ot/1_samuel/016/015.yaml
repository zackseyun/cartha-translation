base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/015.yaml
  text: And Saul’s servants said to him[a], “Look now, an evil spirit from God is terrifying you.”
translation:
  language: tl
  text: At sinabi sa kanya ng mga lingkod ni Saul, “Tingnan mo, isang masamang espiritu mula sa Diyos ang nagpapasindak sa iyo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang nakapipinsala o nagpapahirap na espiritu mula sa Diyos.” Maaaring ilarawan ng salitang Hebreo ang espiritu bilang masama o bilang nagdudulot ng pinsala o paghihirap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: At sinabi
  rationale: Isinusulong ng wayyiqtol ang salaysay; natural sa makabagong Tagalog ang “At sinabi” bilang pagpapatuloy ng pangyayari.
- source_word: עַבְדֵי שָׁאוּל
  choice: mga lingkod ni Saul
  rationale: Sa konteksto ng maharlikang sambahayan, ang “mga lingkod” ay dignified at malawak na katumbas nang hindi iginigiit ang usapin ng pagkaalipin.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Tuwirang salin ng pang-ukol at hulaping panghalip.
- source_word: הִנֵּה נָא
  choice: Tingnan mo
  rationale: Likas na pahayag sa modernong Tagalog na tumatawag ng pansin at nagpapahiwatig ng pagkaapurahan; hindi kailangang isalin nang hiwalay ang נָא bilang “ngayon.”
- source_word: רוּחַ אֱלֹהִים
  choice: isang ... espiritu mula sa Diyos
  rationale: Ipinakikita ng “mula sa Diyos” ang pinagmulan o atas ng espiritu nang hindi ito ipinapantay sa sariling Espiritu ng Diyos.
- source_word: רָעָה
  choice: masamang
  rationale: Direkta at tradisyonal na katumbas, ngunit maaaring mangahulugan din ng nakapipinsala o nagdudulot ng paghihirap; pinananatili ang alternatibo sa talababa.
- source_word: מְבַעִתֶּךָ
  choice: ang naghahasik sa iyo ng matinding takot
  rationale: Ipinahahayag ng pariralang ito ang nagpapatuloy at matinding pananakot na saklaw ng participle, sa natural na Tagalog.
theological_decisions:
- issue: Paglalarawan sa רוּחַ אֱלֹהִים רָעָה nang hindi pinapawi ang tensiyong teolohikal
  choice: isang masamang espiritu mula sa Diyos
  alternative: isang nakapipinsala o nagpapahirap na espiritu mula sa Diyos
  rationale: Pinananatili ng salin ang tahasang kaugnayan ng espiritu sa Diyos, ngunit ang “mula sa Diyos” ay hindi nagsasabing ito mismo ang Espiritu ng Diyos. Hindi rin nito nilulutas nang dogmatiko kung moral na “masama” o nakapipinsala/nagpapahirap ang diwa ng רָעָה.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Tingnan mo” sa halip na arkaikong “Narito” upang maipahayag ang panawag-pansin, at ang “naghahasik ... ng matinding takot” upang natural na maipakita ang lakas at nagpapatuloy na kilos ng pandiwang Hebreo.
