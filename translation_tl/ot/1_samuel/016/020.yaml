base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/020.yaml
  text: So Jesse took a donkey[a], bread, a skin of wine, and one young goat[b], and sent them by the hand of David his son to Saul.
translation:
  language: tl
  text: Pagkatapos, kumuha si Jesse ng isang asnong may kargang tinapay[a], isang sisidlan ng alak na yari sa balat, at isang batang kambing. Ipinadala niya ang mga ito kay Saul sa pamamagitan ng anak niyang si David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “isang asno, tinapay.” Ipinahihiwatig ng konteksto na ang asno ang may karga o nagdadala ng tinapay.
    reason: lexical_alternative
  - marker: b
    text: Literal, “sa kamay ng anak niyang si David,” isang idyoma na maaaring mangahulugang si David ang tagapagdala o siyang ginamit sa pagpapadala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kaya kumuha si Jesse
  rationale: Isinusulong ng wayyiqtol ang salaysay; natural sa modernong Tagalog ang “Kaya” bilang ugnay sa naunang pangyayari.
- source_word: חֲמוֹר לֶחֶם
  choice: isang asnong may kargang tinapay
  rationale: Magkatabing binabanggit sa Hebreo ang “asno” at “tinapay” nang walang tahasang salitang nagsasaad ng relasyon. Ipinahihiwatig ng konteksto na ang asno ang nagdadala ng tinapay; nililinaw ito sa teksto at itinatala ang literal na anyo sa talababa.
- source_word: נֹאד יַיִן
  choice: isang sisidlang-balat ng alak
  rationale: Ang נֹאד ay lalagyang yari sa balat, karaniwang ginagamit para sa alak. Pinananatili ng salin ang uri ng lalagyan at iniiwasan ang anakronistikong “bote.”
- source_word: גְּדִי עִזִּים אֶחָד
  choice: isang batang kambing
  rationale: Tumutukoy ang parirala sa iisang batang kambing; malinaw at natural ito sa modernong Tagalog.
- source_word: וַיִּשְׁלַח
  choice: Ipinadala niya ang mga ito
  rationale: Ipinahihiwatig ng pandiwa na ang mga naunang binanggit na handog ang ipinadala. Ang “mga ito” ay likas na paglalantad ng ipinahihiwatig na layon sa Tagalog.
- source_word: בְּיַד
  choice: sa pamamagitan ng
  rationale: Literal na “sa kamay ni,” ngunit isa itong idyoma para sa ahensiya o paghahatid. Ang “sa pamamagitan ng” ay malinaw at tapat sa gamit nito rito.
- source_word: דָּוִד בְּנוֹ
  choice: anak niyang si David
  rationale: Natural na ayos sa Tagalog na nagpapanatili sa pagkakakilanlan ni David bilang anak ni Jesse.
- source_word: אֶל שָׁאוּל
  choice: kay Saul
  rationale: Natural na pananda sa Tagalog para sa direksiyon tungo sa isang tao.
