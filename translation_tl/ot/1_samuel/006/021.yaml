  text: וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים אֶל יוֹשְׁבֵ֥י קִרְיַת יְעָרִ֖ים לֵ/אמֹ֑ר הֵשִׁ֤בוּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן יְהוָ֔ה רְד֕וּ הַעֲל֥וּ אֹת֖/וֹ אֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/021.yaml
  text: So they sent messengers to the inhabitants of Kiriath-jearim[a], saying, “The Philistines have returned the ark of Yahweh. Come down; bring it up to yourselves.”
translation:
  language: tl
  text: 'At nagsugo sila ng mga mensahero sa mga naninirahan sa Kiriat-jearim, na nagsasabi: “Ibinalik na ng mga Filisteo ang kaban ni Yahweh. Bumaba kayo[a] at iakyat ninyo ito sa inyo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “bumaba” at “iangat/iahon.” Ang mga pandiwang ito ay nagpapahiwatig ng pababa at pataas na paglalakbay, marahil dahil sa anyo ng lupain sa pagitan ng Bet-semes at Kiriat-jearim. Maaari ring isalin ang unang pautos na “Pumarito kayo pababa,” ayon sa pananaw ng nagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Kaya nagsugo sila
  rationale: Isinusulong ng wayyiqtol ang salaysay; natural sa Tagalog ang “Kaya” bilang ugnayang bunga o kasunod na hakbang sa konteksto.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Mga taong ipinadala upang maghatid ng balita ang tinutukoy, hindi mga anghel.
- source_word: יוֹשְׁבֵי קִרְיַת יְעָרִים
  choice: mga naninirahan sa Kiriat-jearim
  rationale: Tuwirang ipinapahayag ang kahulugan ng participle na “mga naninirahan,” habang tinutumbasan sa baybay-Tagalog ang pangalang pantangi.
- source_word: הֵשִׁבוּ פְלִשְׁתִּים
  choice: Ibinalik na ng mga Filisteo
  rationale: Ang Hiphil ng שוב ay nagsasaad ng pagpapabalik o pagdadala pabalik; ipinahihiwatig ng “na” ang natapos na kilos na mahalaga sa kasalukuyang pakiusap.
- source_word: אֲרוֹן יְהוָה
  choice: kaban ni Yahweh
  rationale: Ang אֲרוֹן ay “kaban,” at ang pangalan ng Diyos na יהוה ay pinanatiling “Yahweh” bilang pangalang pantangi.
- source_word: רְדוּ
  choice: Bumaba kayo
  rationale: Pinananatili ang topograpikong pandiwang ירד at ang maramihang pautos nang hindi nagpapasya kung sa Tagalog ay dapat ipahiwatig ang “halika” o “pumunta.”
- source_word: הַעֲלוּ אֹתוֹ אֲלֵיכֶם
  choice: iahon ninyo ito sa inyong lugar
  rationale: Ang “iahon” ay nagpapanatili sa paitaas na kilos ng Hiphil עלה; ginagawang natural ng “sa inyong lugar” ang אֲלֵיכֶם nang hindi gumagamit ng alanganing “sa inyong sarili.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo na יהוה ang nasa tekstong Hebreo; ang “Yahweh” ay tahasang nagpapanatili rito bilang pangalang tipan at hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaban” bilang karaniwang salin ng ark, mga baybay na “Kiriat-jearim” at “Filisteo” na angkop sa Filipino, at pinanatili ang magkatambal na topograpikong pandiwa. Ang footnote marker na [a] ay inilagay sa pangunahing teksto.
