revisions:
- from: Kaya nagsugo sila ng mga mensahero sa mga naninirahan sa Kiriat-jearim. Sinabi nila, “Ibinalik na ng mga Filisteo ang kaban ni Yahweh. Bumaba kayo at iahon ninyo ito sa inyong lugar.”[a]
  to: 'At nagsugo sila ng mga mensahero sa mga naninirahan sa Kiriat-jearim, na nagsasabi: “Ibinalik na ng mga Filisteo ang kaban ni Yahweh. Bumaba kayo[a] at iakyat ninyo ito sa inyo.”'
  rationale: Inalis ang dagdag na ‘lugar’ upang manatiling tapat sa ‘sa inyo,’ inayos ang pagpapakilala sa tuwirang sipi, at itinama ang tala upang mapanatili ang topograpikong kahulugan ng dalawang pandiwa nang hindi pinipilit ang isang pananaw sa direksiyon.
