  source_fidelity: Tumpak na naihahatid ang metonimikong “Bet-semes” bilang mga naninirahan dito, ang nagpapatuloy na tagpo ng pag-aani, ang pagkakita sa arka, at ang kanilang kagalakan. Ang “Nang tumingala sila” ay idiomatikong katumbas ng Hebreong “itinaas nila ang kanilang mga mata” at hindi nagdaragdag ng kahulugan.
