  text: וּ/בֵ֣ית שֶׁ֔מֶשׁ קֹצְרִ֥ים קְצִיר חִטִּ֖ים בָּ/עֵ֑מֶק וַ/יִּשְׂא֣וּ אֶת עֵינֵי/הֶ֗ם וַ/יִּרְאוּ֙ אֶת הָ֣/אָר֔וֹן וַֽ/יִּשְׂמְח֖וּ לִ/רְאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/013.yaml
  text: The people of Beth-shemesh were reaping the wheat harvest in the valley[a], and they lifted up their eyes and saw the ark, and they rejoiced to see it.
translation:
  language: tl
  text: Ang mga taga-Bet-semes ay nag-aani ng trigo sa lambak. Nang tumingala sila,[a] nakita nila ang Kaban, at nagalak silang makita iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “itinaas nila ang kanilang mga mata,” isang idyomang nangangahulugang tumingala sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית שֶׁמֶשׁ
  choice: Ang mga taga-Bet-semes
  rationale: Ang pangalang-lugar ay ginagamit dito bilang metonimiya para sa mga naninirahan doon, gaya ng ipinakikita ng mga pandiwa at pandiwaring maramihan. Likas sa Filipino ang “mga taga-Bet-semes” at hindi nito nililimitahan sa mga lalaki ang tinutukoy.
- source_word: קֹצְרִים קְצִיר חִטִּים
  choice: ay nag-aani ng trigo
  rationale: Ipinahihiwatig ng pandiwaring maramihan ang nagpapatuloy na kilos na nagsisilbing tagpo sa salaysay. Ang “nag-aani ng trigo” ay likas at malinaw sa modernong Filipino.
- source_word: בָּעֵמֶק
  choice: sa lambak
  rationale: Karaniwang tumutukoy ang עֵמֶק sa lambak o malawak na mababang lupain; “lambak” ang tuwiran at pamilyar na katumbas.
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: Nang tumingala sila
  rationale: Ang literal na “itinaas nila ang kanilang mga mata” ay isang idyomang Hebreo na nangangahulugang tumingala o tumingin sa itaas. Ginagawang likas ng “nang” ang ugnayan ng magkakasunod na kilos nang hindi nagdaragdag ng bagong pangyayari.
- source_word: וַיִּרְאוּ אֶת הָאָרוֹן
  choice: nakita nila ang Kaban
  rationale: Payak na salaysay ang pandiwa. Sa konteksto, ang הָאָרוֹן ay ang sagradong Kaban na naipakilala na; ginamit ang malaking titik bilang tiyak na katawagan sa bagay na ito.
- source_word: וַיִּשְׂמְחוּ לִרְאוֹת
  choice: at nagalak silang makita iyon
  rationale: Ipinapahayag ng pawatas ang dahilan o okasyon ng kanilang galak. Ang “iyon” ay likas na ipinapalit sa Kaban, na implicit lamang bilang layon sa Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang duratibong tagpo ng pag-aani, ngunit isinalin nang idiomatiko ang Hebreong pariralang tungkol sa pagtataas ng mga mata. Ginamit ang anyong pangalang “Bet-semes” at ang katawagang “Kaban” ayon sa konteksto.
