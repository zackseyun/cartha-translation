  source_fidelity: 'Tumpak na naipapahayag ang sunod-sunod na kilos ng וַיָּשִׂמוּ at ang lahat ng bagay na inilagay sa kariton: ang kaban ni Yahweh, ang kahon, ang mga daga na ginto, at ang mga larawang kumakatawan sa kanilang mga bukol. Ang “mga bukol” ay angkop na malawak na salin para sa pinagtatalunang טְחֹרֵיהֶם, at hindi nagpapasok ng hindi tiyak na medikal na pagpapakahulugan.'
