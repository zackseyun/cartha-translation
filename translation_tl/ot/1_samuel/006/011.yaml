id: 1SA.6.11
reference: 1 Samuel 6:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּשִׂ֛מוּ אֶת אֲר֥וֹן יְהוָ֖ה אֶל הָ/עֲגָלָ֑ה וְ/אֵ֣ת הָ/אַרְגַּ֗ז וְ/אֵת֙ עַכְבְּרֵ֣י הַ/זָּהָ֔ב וְ/אֵ֖ת צַלְמֵ֥י טְחֹרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/011.yaml
  text: Then they put the ark of Yahweh on the cart[a], along with the box and the gold mice and the images of their tumors.
translation:
  language: tl
  text: Pagkatapos, inilagay nila sa kariton ang kaban ni Yahweh, pati ang kahon, ang mga dagang ginto, at ang mga larawan ng kanilang mga bukol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pamamaga”; posibleng “mga almoranas.”
    reason: Hindi tiyak ang eksaktong kahulugan ng טְחֹרִים sa kontekstong ito.
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: Pagkatapos, inilagay nila
  rationale: Ang wayyiqtol ng שׂים ay nagpapatuloy sa sunod-sunod na pangyayari. Likas sa makabagong Tagalog ang “Pagkatapos, inilagay nila.”
- source_word: אֲרוֹן יְהוָה
  choice: ang kaban ni Yahweh
  rationale: Sa kontekstong ito, ang אֲרוֹן ay ang sagradong kaban. Pinananatili ang personal na pangalang יְהוָה bilang “Yahweh.”
- source_word: אֶל הָעֲגָלָה
  choice: sa kariton
  rationale: Ang pang-ukol at ang sasakyang tinutukoy ay likas na naipapahayag sa Tagalog bilang paglalagay “sa kariton.”
- source_word: הָאַרְגַּז
  choice: ang kahon
  rationale: Ang אַרְגַּז ay sisidlan ng mga handog. Ang “kahon” ay malinaw at naihihiwalay sa sagradong “kaban.”
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: ang mga dagang ginto
  rationale: Literal itong “mga daga ng ginto”; maikli at natural ang “mga dagang ginto” para sa mga wangis na yari sa ginto.
- source_word: צַלְמֵי טְחֹרֵיהֶם
  choice: ang mga larawan ng kanilang mga bukol
  rationale: Ang צֶלֶם ay larawan o wangis, samantalang hindi tiyak ang eksaktong karamdamang tinutukoy ng טְחֹרִים. Ang “mga bukol” ay malawak at hindi labis na espesipiko.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Eksaktong uri ng karamdamang tinutukoy ng טְחֹרִים
  choice: mga bukol
  alternative: mga pamamaga; mga almoranas
  rationale: Hindi lubos na tiyak ang medikal na kahulugan. Iniiwasan ng pangunahing teksto ang labis na pagtukoy, habang inilalahad sa talababa ang mga tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaban” para sa sagradong ark at “kahon” para sa hiwalay na sisidlan. Inilagay ang marker [a] pagkatapos ng “mga bukol,” ang salitang tunay na tinutukoy ng leksikal na talababa.
