  text: וְ/אֵ֨לֶּה֙ טְחֹרֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֨ר הֵשִׁ֧יבוּ פְלִשְׁתִּ֛ים אָשָׁ֖ם לַֽ/יהוָ֑ה לְ/אַשְׁדּ֨וֹד אֶחָ֜ד לְ/עַזָּ֤ה אֶחָד֙ לְ/אַשְׁקְל֣וֹן אֶחָ֔ד לְ/גַ֥ת אֶחָ֖ד לְ/עֶקְר֥וֹן אֶחָֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/017.yaml
  text: 'And these are the golden tumors that the Philistines returned as a guilt offering to Yahweh: one for Ashdod[a], one for Gaza, one for Ashkelon, one for Gath, one for Ekron.'
translation:
  language: tl
  text: 'Ito ang mga gintong bukol na ibinalik ng mga Filisteo bilang handog para sa pagkakasala kay Yahweh: isa para sa Asdod[a], isa para sa Gaza, isa para sa Askelon, isa para sa Gat, at isa para sa Ekron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga gintong pamamaga.” Ang salitang Hebreo ay tumutukoy sa karamdamang isinasagisag ng mga handog na ito; ayon sa tradisyon, mas tiyak itong isinasaling “mga gintong almoranas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang mga
  rationale: Ipinakikilala nito ang paliwanag na talaan; natural sa Filipino ang “Ito ang mga,” at sapat na naiuugnay sa naunang konteksto.
- source_word: טְחֹרֵי הַזָּהָב
  choice: mga bukol na ginto
  rationale: Ang טְחֹרִים ay tumutukoy sa karamdamang isinasagisag ng mga handog. Ang “mga bukol” ay malinaw at hindi labis na nagpapasiya sa mas tiyak na tradisyonal na pakahulugang almoranas.
- source_word: אֲשֶׁר הֵשִׁיבוּ
  choice: na ibinalik
  rationale: Ang Hiphil ng שוב dito ay nangangahulugang ibalik o isauli; ang “ibinalik” ay angkop sa pagsasauli ng handog kasabay ng kaban.
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang makabagong Tagalog na pangalan para sa pangkat ng mga Philistine.
- source_word: אָשָׁם
  choice: bilang handog para sa pagkakasala
  rationale: Tumutukoy ito sa handog na may kaugnayan sa pagkakasala at pagbabayad-pinsala. Nauunawaan sa karaniwang Filipino ang pariralang ito habang pinananatili ang sakripisyal na diwa.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: לְאַשְׁדּוֹד אֶחָד ... לְעֶקְרוֹן אֶחָד
  choice: isa para sa Asdod ... isa para sa Ekron
  rationale: Ang inuulit na לְ kasama ng אֶחָד ay nagsasaad ng tig-isang bagay para sa bawat lungsod; natural itong ipahayag sa Filipino bilang “isa para sa.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng kahulugan ng אָשָׁם
  choice: handog para sa pagkakasala
  alternative: handog na pambayad-sala; handog na kabayaran
  rationale: Pinananatili ng napiling anyo ang parehong pagkakasala at katangian nitong handog nang hindi ipinapasok ang isang makitid na sistemang teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Filisteo” at mga anyong Asdod, Askelon, Gat, at Ekron na madaling basahin sa Tagalog. Napanatili ang anyong talaan at ang tunay na kalabuan ng terminong medikal.
