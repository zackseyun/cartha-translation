  text: When the five rulers of the Philistines saw it[b][a], they returned to Ekron that same day.
translation:
  language: tl
  text: Nang makita iyon ng limang pinuno ng mga Filisteo[a], bumalik sila sa Ekron sa araw ding iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang titulong Hebreo na סַרְנֵי ay maaari ding isaling “mga panginoon.”
    reason: lexical_alternative
  - marker: b
    text: 'O: “sa araw na iyon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲמִשָּׁה
  choice: limang
  rationale: Ang bilang ay tumutukoy sa kilalang limang pinunong Filisteo sa konteksto; hindi kailangan ng hiwalay na pantukoy sa natural na Tagalog.
- source_word: סַרְנֵי
  choice: pinuno
  rationale: Ito ang natatanging titulong pampamahalaan ng mga tagapamahala sa limang pangunahing lungsod ng mga Filisteo. Malinaw at likas sa modernong Tagalog ang “pinuno,” habang itinatala sa talababa ang alternatibong “panginoon.”
- source_word: פְלִשְׁתִּים
  choice: ng mga Filisteo
  rationale: Likas na isinasalin ng pariralang ito ang construct/genitive na tumutukoy kung kaninong mga pinuno ang tinutukoy.
- source_word: רָאוּ
  choice: makita iyon
  rationale: Walang hayag na layon ang pandiwa sa Hebreo, ngunit ipinahihiwatig ng konteksto ang pangyayaring nasaksihan nila. Ang “iyon” ay natural sa Tagalog at hindi labis na nililimitahan ang tinutukoy.
- source_word: וַ/יָּשֻׁבוּ
  choice: bumalik sila
  rationale: Tumpak at natural na salaysay na katumbas ng pandiwang שוב sa sunod-sunod na kilos.
- source_word: עֶקְרוֹן
  choice: sa Ekron
  rationale: Ang pangalang pook ay tinumbasan sa transliterasyon; kailangan sa Tagalog ang “sa” upang ipahayag ang destinasyon.
- source_word: בַּ/יּוֹם הַ/הוּא
  choice: nang araw ding iyon
  rationale: Literal itong “sa araw na iyon.” Ipinahahayag ng “nang araw ding iyon” ang agarang panahong tinutukoy at likas sa modernong Tagalog, habang pinananatili sa talababa ang mas literal na alternatibo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Ginamit ang “mga Filisteo” bilang karaniwang anyo ng pangalang-bayan at “Ekron” bilang transliterasyon ng pangalang pook. Ang ayos ng pangungusap ay iniangkop sa natural na daloy ng salaysay sa Tagalog.
