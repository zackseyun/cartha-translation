revisions:
- from: 'Sinabi nila, “Ano ang handog para sa pagkakasala[a] na ibabalik namin sa kanya?” Sumagot sila, “Ayon sa bilang ng mga pinuno ng mga Filisteo: limang bukol na ginto[b] at limang dagang ginto. Sapagkat iisang salot ang sumapit sa inyong lahat at sa inyong mga pinuno.”'
  to: 'Sinabi nila, “Ano ang handog para sa pagkakasala[a] na ibabalik namin sa kanya?” Sumagot sila, “Ayon sa bilang ng mga pinuno ng mga Filisteo: limang bukol na yari sa ginto[b] at limang daga na yari sa ginto. Sapagkat iisang salot ang sumapit sa kanilang lahat at sa inyong mga pinuno.”'
  rationale: Inayos ang panauhan sa “sa kanilang lahat” upang tumpak na maipakita ang ikatlong panauhang hulapi ng Hebreo, samantalang pinanatili ang “sa inyong mga pinuno” para sa kasunod na ikalawang panauhang hulapi. Nilinaw rin na ang mga bukol at daga ay mga anyong yari sa ginto. Napanatili ang maingat na salin ng terminong para sa mga pamamaga at ang mga umiiral na talababa.
