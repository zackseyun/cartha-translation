base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/004.yaml
  text: 'And they said[a], “What is the guilt offering that we should return to him?” They said, “According to the number of the Philistine rulers: five golden tumors and five golden mice[c][b], for one plague was on all of them and on your rulers.”'
translation:
  language: tl
  text: 'Sinabi nila, “Ano ang handog para sa pagkakasala[a] na ibabalik namin sa kanya?” Sumagot sila, “Ayon sa bilang ng mga pinuno ng mga Filisteo: limang bukol na yari sa ginto[b] at limang daga na yari sa ginto. Sapagkat iisang salot ang sumapit sa kanilang lahat at sa inyong mga pinuno.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog na pambayad-pinsala.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na tumutukoy ang salitang Hebreo sa mga pamamaga na dulot ng salot; isinasalin ito ng ilan nang mas tiyak bilang “almoranas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָשָׁם
  choice: handog para sa pagkakasala
  rationale: Tumutukoy ang אָשָׁם sa isang handog na may layuning magbayad-pinsala o mag-ayos ng pagkakasala. Malinaw at likas sa modernong Filipino ang “handog para sa pagkakasala,” habang pinananatili sa talababa ang reparatibong diwa.
- source_word: נָשִׁיב לוֹ
  choice: ibabalik namin sa kanya
  rationale: Ang Hiphil ng שוב ay nangangahulugang “ibalik.” Pinananatili ng “sa kanya” ang panlalaking isahang panghalip at malamang na tumutukoy sa Diyos ng Israel.
- source_word: מִסְפַּר סַרְנֵי פְלִשְׁתִּים
  choice: ayon sa bilang ng mga pinuno ng mga Filisteo
  rationale: Ipinahihiwatig ng parirala na ang dami ng mga handog ay dapat tumugma sa bilang ng mga pinunong Filisteo.
- source_word: סַרְנֵי
  choice: mga pinuno
  rationale: Tumutukoy ito sa natatanging titulo ng mga pangunahing tagapamahalang Filisteo. Ang “mga pinuno” ay malinaw at hindi makaluma.
- source_word: עפלי זָהָב
  choice: mga bukol na ginto
  rationale: Malamang na tumutukoy ang salita sa mga pamamaga o bukol na kaugnay ng salot. Hindi labis na tinutukoy ng “bukol” ang eksaktong karamdaman.
- source_word: עַכְבְּרֵי זָהָב
  choice: mga dagang ginto
  rationale: Tuwirang katumbas ito ng mga ginintuang anyo o larawan ng daga at natural sa Filipino.
- source_word: מַגֵּפָה אַחַת
  choice: iisang salot
  rationale: Pinananatili nito ang diin ng Hebreo na isang salot ang magkakatulad na sumapit sa lahat.
- source_word: לְכֻלָּם
  choice: sa inyong lahat
  rationale: Sa konteksto, ang ikatlong panauhang “kanilang lahat” ay tumutukoy sa mga Filisteong kinakausap; natural sa tuwirang pananalita ng Filipino ang “inyong lahat,” kasunod ng tahasang pangalawang panauhan sa huling parirala.
- source_word: וּלְסַרְנֵיכֶם
  choice: at sa inyong mga pinuno
  rationale: Tumpak na inililipat ang hulaping pangalawang panauhang maramihan at pinananatili ang pare-parehong salin ng סַרְנֵי.
theological_decisions:
- issue: Tinutukoy ng panghalip na לוֹ sa tanong tungkol sa handog
  choice: “sa kanya,” na malamang na tumutukoy sa Diyos ng Israel
  alternative: “dito,” na tumutukoy sa kaban
  rationale: Panlalaking isahan ang panghalip, at ang lohika ng handog na pambayad sa pagkakasala ay nakatuon sa Diyos na nasaktan dahil sa pagkuha sa kanyang kaban. Hindi pinapangalanan ang Diyos sa salin upang hindi lampasan ang tahasang sinabi ng Hebreo.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “mga Filisteo” at “mga pinuno” bilang karaniwan at malinaw na katawagan. Pinanatili ang dalawang ulit na pagsasalita sa Hebreo sa pamamagitan ng “Sinabi nila” at “Sumagot sila.”
