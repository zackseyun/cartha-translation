base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/014.yaml
  text: The cart came into the field of Joshua the Beth-shemite and stopped there[a], where there was a large stone[c][b]. Then they split up the wood of the cart and offered up the cows as a burnt offering to Yahweh.
translation:
  language: tl
  text: Dumating ang kariton sa bukid ni Josue na taga-Bet-semes at huminto roon[a]. May isang malaking bato roon. Pagkatapos, biniyak nila ang kahoy ng kariton at inihandog ang mga baka bilang handog na sinusunog kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tumayo roon.” Ginagamit dito ang pandiwa upang sabihing tumigil ang kariton.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלָה
  choice: ang kariton
  rationale: Ang עֲגָלָה ay sasakyang may gulong na nagdala sa Kaban; natural at malinaw sa modernong Filipino ang “kariton.”
- source_word: שְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: sa bukid ni Josue na taga-Bet-semes
  rationale: Ipinahahayag ng parirala ang bukid na pag-aari ni Josue at ang kaugnayan niya sa Bet-semes; natural sa Filipino ang “na taga-Bet-semes.”
- source_word: וַתַּעֲמֹד שָׁם
  choice: at huminto roon
  rationale: Literal na “tumayo roon,” ngunit para sa umaandar na kariton, “huminto roon” ang malinaw at kontekstuwal na katumbas.
- source_word: וְשָׁם אֶבֶן גְּדוֹלָה
  choice: May isang malaking bato roon
  rationale: Pinananatili nito ang payak na pahayag ng Hebreo tungkol sa malaking batong naroon, nang hindi dinaragdagan ang kahulugan.
- source_word: וַיְבַקְּעוּ אֶת עֲצֵי הָעֲגָלָה
  choice: pinaghati-hati nila ang kahoy ng kariton
  rationale: Ang בקע ay paghahati o pagbitak; ipinahihiwatig ng anyong Filipino ang paghahanda sa kahoy bilang panggatong.
- source_word: הַפָּרוֹת
  choice: ang mga baka
  rationale: Ang פָּרוֹת ay mga babaeng baka. Sapat at natural ang pangkalahatang “mga baka” sa Filipino; hindi angkop ang “dumalaga” dahil may mga guya ang mga ito sa konteksto.
- source_word: הֶעֱלוּ עֹלָה
  choice: inihandog ... bilang handog na sinusunog
  rationale: Pinananatili nito ang ritwal na diwa ng pag-aalay at ang uri ng handog na lubos na sinusunog.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Isinasalin ang personal na pangalang tipan na יהוה bilang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Paglalarawan sa handog na עֹלָה
  choice: handog na sinusunog
  alternative: handog na susunugin
  rationale: Ang “handog na sinusunog” ay tumutukoy sa kinikilalang uri ng hain at hindi lamang sa isang bagay na susunugin sa hinaharap.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong pangalan upang hindi maipagkamali sa karaniwang titulong “Panginoon.”
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “bukid,” “kariton,” at “mga baka” bilang karaniwang salitang madaling maunawaan. Pinanatili ang pangalang Yahweh at ang katawagang panritwal na “handog na sinusunog.”
