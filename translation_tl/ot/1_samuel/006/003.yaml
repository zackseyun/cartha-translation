source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אִֽם מְשַׁלְּחִ֞ים אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ אַל תְּשַׁלְּח֤וּ אֹת/וֹ֙ רֵיקָ֔ם כִּֽי הָשֵׁ֥ב תָּשִׁ֛יבוּ ל֖/וֹ אָשָׁ֑ם אָ֤ז תֵּרָֽפְאוּ֙ וְ/נוֹדַ֣ע לָ/כֶ֔ם לָ֛/מָּה לֹא תָס֥וּר יָד֖/וֹ מִ/כֶּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/003.yaml
  text: And they said[a], “If you are sending away the ark of the God of Israel, do not send it away empty, for you must surely return to him a guilt offering. Then you will be healed[b], and it will be made known to you why his hand has not turned away from you.”
translation:
  language: tl
  text: At sinabi nila, “Kung pauuwiin ninyo ang kaban ng Diyos ng Israel, huwag ninyo itong pauwiin nang walang dala. Dapat talaga kayong magbalik sa kanya ng handog para sa pagkakasala[a]. Sa gayon, gagaling kayo, at malalaman ninyo kung bakit hindi pa lumalayo sa inyo ang kanyang kamay[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog na kabayaran” o “handog na panumbas sa nagawang kasalanan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kanyang kamay” ay karaniwang larawang Hebreo para sa kapangyarihan ng Diyos, dito ay ang kapangyarihan niyang humatol at magpahirap.
    reason: cultural_note
lexical_decisions:
- source_word: מְשַׁלְּחִים / תְּשַׁלְּחוּ
  choice: pauuwiin / pauwiin
  rationale: Sa konteksto, ibinabalik ng mga Filisteo ang kaban mula sa kanilang lupain. Ang “pauwiin” ay natural sa modernong Tagalog at pinananatili ang pag-uulit ng pandiwa.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: ang kaban ng Diyos ng Israel
  rationale: Tuwirang pinananatili ang ugnayang genitibo at hindi idinaragdag ang “tipan,” na wala sa tekstong Hebreo.
- source_word: רֵיקָם
  choice: nang walang dala
  rationale: Ito ang natural na idyomang Tagalog para sa pagpapauwi nang walang kasamang handog o kabayaran; mas malinaw ito kaysa literal na “walang laman.”
- source_word: הָשֵׁב תָּשִׁיבוּ
  choice: Tiyaking magbalik kayo
  rationale: Ipinahahayag nito ang diin at obligasyong dala ng infinitive absolute na kasunod ng finite verb.
- source_word: לּוֹ
  choice: sa kanya
  rationale: Pinakamalamang na tumutukoy ang panlalaking panghalip sa Diyos ng Israel, bagaman ang handog ay praktikal na isinasama sa kaban.
- source_word: אָשָׁם
  choice: handog para sa pagkakasala
  rationale: Malinaw at pamilyar na salin ito ng handog na may diwa ng pananagutan at pagsasaayos; inilalahad sa talababa ang alternatibong reparative nuance.
- source_word: תֵּרָפְאוּ
  choice: gagaling kayo
  rationale: Natural na Tagalog para sa Niphal ng רפא at angkop sa konteksto ng pag-alis ng salot o karamdaman.
- source_word: וְנוֹדַע לָכֶם
  choice: malalaman ninyo
  rationale: Natural na ipinahahayag sa Tagalog ang impersonal/passive na diwa ng Hebreo nang hindi nagiging mabigat ang pangungusap.
- source_word: לָמָּה לֹא תָסוּר יָדוֹ מִכֶּם
  choice: kung bakit hindi pa lumalayo sa inyo ang kanyang kamay
  rationale: Pinananatili ang mahalagang metapora ng “kamay” bilang kapangyarihan ng Diyos sa paghatol, habang ang “hindi pa” ay natural na nagpapahiwatig ng nagpapatuloy na kalagayan.
theological_decisions:
- issue: Tinutukoy ng panghalip sa לּוֹ
  choice: Ang handog ay ibabalik “sa kanya,” sa Diyos ng Israel.
  alternative: Ang handog ay ibabalik “dito,” kasama ng kaban.
  rationale: Ang pinakamalapit na personal na tinutukoy ay ang Diyos ng Israel, at ang אָשָׁם ay handog na naghahangad na isaayos ang pagkakasala sa kanya. Gayunman, hindi nito itinatanggi na isasama ang handog sa kaban.
- issue: Kahulugan ng “kanyang kamay”
  choice: Pinanatili ang literal na metapora para sa kapangyarihan ng Diyos na nagpapahirap o humahatol.
  alternative: Isaling tuwiran bilang “kanyang parusa” o “salot na ipinadala niya.”
  rationale: Karaniwan at teolohikal na mahalagang larawan sa Lumang Tipan ang kamay ng Diyos. Nauunawaan ito sa konteksto at ipinaliliwanag sa talababa nang hindi pinapaliit ang saklaw ng metapora.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kaban” bilang pamilyar na katawagan sa ark, “pauwiin” para sa kontekstuwal na pagbabalik nito, at pinanatili ang metaporang “kamay” sa halip na tahasang palitan ng “parusa.”
