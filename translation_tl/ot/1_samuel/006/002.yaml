  - severity: medium
    issue: Ang “sa kinalalagyan nito” ay hindi tumpak na katumbas ng patutunguhang “sa lugar nito.”
    rationale: Ang לִמְקוֹמוֹ ay may direksiyong “patungo sa lugar nito”; ang “kinalalagyan” ay karaniwang kasalukuyang kinaroroonan.
