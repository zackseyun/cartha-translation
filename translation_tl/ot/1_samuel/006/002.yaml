revisions:
- from: Kaya ipinatawag ng mga Filisteo ang mga pari at ang mga manghuhula. Sinabi nila, “Ano ang gagawin namin sa kaban ni Yahweh? Sabihin ninyo sa amin kung ano ang dapat naming isama rito kapag ipinadala namin ito sa kinalalagyan nito.”[a]
  to: Kaya ipinatawag ng mga Filisteo ang mga pari at ang mga manghuhula, na nagsasabi, “Ano ang gagawin namin sa kaban ni Yahweh? Sabihin ninyo sa amin kung anong paraan ang gagamitin namin sa pagpapadala nito sa lugar nito.”[a]
  rationale: Binago ang tanong upang tumpak na ihatid ang instrumental na בַּמֶּה bilang tanong tungkol sa paraan ng pagpapadala, hindi bilang tahasang tanong tungkol sa bagay na isasama. Pinalitan din ang “kinalalagyan nito” ng “lugar nito” upang maipakita ang patutunguhan sa לִמְקוֹמוֹ. Ginawang iisang pangungusap ang pagpapakilala sa sinabi nila upang mas malapit sa anyo ng pandiwang “na nagsasabi.”
