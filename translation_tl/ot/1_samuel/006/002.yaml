base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/002.yaml
  text: So the Philistines called for the priests and the diviners[a], saying, “What shall we do with the ark of Yahweh? Tell us with what we should send it to its place.”
translation:
  language: tl
  text: Kaya ipinatawag ng mga Filisteo ang mga pari at ang mga manghuhula, na nagsasabi, “Ano ang gagawin namin sa kaban ni Yahweh? Sabihin ninyo sa amin kung anong paraan ang gagamitin namin sa pagpapadala nito sa lugar nito.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “sa pamamagitan ng ano namin ito ipadadala sa lugar nito.” Maaari itong tumukoy sa paraan o mga paraang gagamitin sa pagpapadala.
    reason: Pinananatili ang instrumental na kahulugan at ang bahagyang kalabuan ng בַּמֶּה nang hindi ipinapasok sa pangunahing teksto ang isang tiyak na bagay na isasama.
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: ipinatawag
  rationale: Ipinahihiwatig ng pandiwa rito na ipinatawag ng mga Filisteo ang mga espesyalistang hihingan nila ng payo; natural at malinaw ito sa makabagong Tagalog.
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang katawagang Tagalog para sa pangkat ng mga Philistine.
- source_word: לַכֹּהֲנִים
  choice: ang mga pari
  rationale: Tumutukoy ito sa mga paring Filisteo. Hindi na idinagdag ang “Filisteo” dahil malinaw na iyon sa konteksto at wala ang gayong panuring sa Hebreo.
- source_word: וְלַקֹּסְמִים
  choice: ang mga manghuhula
  rationale: Ang קֹסְמִים ay mga nagsasagawa ng panghuhula upang alamin ang nakatago o banal na patnubay. Ang “manghuhula” ay kasalukuyan, madaling maunawaan, at hindi labis na teknikal.
- source_word: מַה נַּעֲשֶׂה
  choice: Ano ang gagawin namin
  rationale: Likas na Tagalog para sa tanong na deliberatibo sa unang panauhang maramihan.
- source_word: לַאֲרוֹן יְהוָה
  choice: sa kaban ni Yahweh
  rationale: Ang ל ay idyomatikong isinaling “sa” sa tanong na “Ano ang gagawin namin sa...?” Ang אֲרוֹן ay “kaban,” at hindi idinagdag ang “ng tipan” sapagkat wala iyon sa talata.
- source_word: הוֹדִיעֻנוּ
  choice: Sabihin ninyo sa amin
  rationale: Natural na katumbas ng pautos na Hiphil na “ipaalam sa amin.”
- source_word: בַּמֶּה
  choice: kung ano ang dapat naming isama rito
  rationale: Literal itong “sa pamamagitan ng ano” o “kasama ang ano.” Sa konteksto, itinatanong kung ano ang ipapasama sa kaban sa pagpapadala nito; pinananatili sa talababa ang mas literal na anyo.
- source_word: נְשַׁלְּחֶנּוּ
  choice: kapag ipinadala namin ito
  rationale: Ipinahahayag ang binabalak na pagpapadala sa paraang natural sa Tagalog, habang ang “ito” ay tumutukoy sa kaban.
- source_word: לִמְקוֹמוֹ
  choice: sa kinalalagyan nito
  rationale: Malapit sa literal na “sa lugar nito.” Hindi idinagdag ang “pabalik” dahil bagaman ipinahihiwatig ng konteksto, hindi ito tahasang nasa Hebreo.
theological_decisions:
- issue: Paglilipat sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng tekstong Hebreo ang mismong tetragrammaton na יהוה. Pinananatili ang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaban” nang walang idinagdag na “ng tipan,” at “manghuhula” bilang madaling maunawaang katawagan sa mga nagsasagawa ng dibinasyon.
