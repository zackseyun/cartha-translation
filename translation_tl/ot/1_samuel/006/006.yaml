base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/006.yaml
  text: Why then do you harden your hearts[a], as Egypt and Pharaoh hardened their hearts? Was it not when he dealt harshly with them that they sent them away[b], and they went?
translation:
  language: tl
  text: Bakit ninyo pinatitigas ang inyong mga puso[a], gaya ng kung paano pinatigas ng Ehipto at ng Paraon ang kanilang mga puso? Hindi ba nang malupit niya silang pakitunguhan ay pinaalis nila ang mga Israelita[b], at umalis ang mga ito?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ginagawa ninyong mabigat ang inyong mga puso,” gaya ng ginawa ng Ehipto at ng Paraon. Ang “mabigat” ay idyomang Hebreo para sa pusong matigas o mapagmatigas.
    reason: lexical_alternative
  - marker: b
    text: Ang “silang” malupit na pinakitunguhan niya ay ang Ehipto at ang Paraon; ang pinaalis naman ay ang mga Israelita. Ang “niya” ay tumutukoy sa Diyos ayon sa konteksto ng Exodo, bagaman hindi tahasang binanggit ang simuno sa Hebreo.
    reason: cross_reference
lexical_decisions:
- source_word: תְכַבְּדוּ / כִּבְּדוּ
  choice: pinatitigas / pagpapatigas
  rationale: Ang piel ng כבד kasama ng “puso” ay idyomang literal na “gawing mabigat” at tumutukoy sa pagmamatigas. Natural sa modernong Tagalog ang “patigasin ang puso.”
- source_word: לְבַבְכֶם / לִבָּם
  choice: ang inyong mga puso / kanilang mga puso
  rationale: Pinananatili ang larawan ng puso bilang kalooban at panloob na pagkatao, pati ang maramihang kausap.
- source_word: מִצְרַיִם וּפַרְעֹה
  choice: ang Ehipto at ang Paraon
  rationale: Pinananatili ang pangalang-lugar na “Ehipto” bilang kolektibong pagtukoy sa mga taga-Ehipto o kapangyarihan nito, gaya ng Hebreo.
- source_word: הִתְעַלֵּל בָּהֶם
  choice: pakitunguhan niya sila nang mabigat
  rationale: Ipinahahayag ang maparusang tindi ng kilos nang hindi labis na tinutukoy ang paraan; pinananatili rin ang di-tahasang tinukoy na simuno sa Hebreo sa pamamagitan ng “niya.”
- source_word: וַיְשַׁלְּחוּם
  choice: pinaalis nila ang mga Israelita
  rationale: Ang שלח ay maaaring “paalisin” o “pakawalan.” Tahasang pinangalanan ang Israel upang maiwasan ang nakalilitong magkasunod na panghalip sa Tagalog.
- source_word: וַיֵּלֵכוּ
  choice: umalis ang mga ito
  rationale: Maikli at natural na katumbas ng הלך sa konteksto; ang “mga ito” ay tumutukoy sa mga Israelitang pinaalis.
theological_decisions:
- issue: Di-tahasang simuno ng הִתְעַלֵּל
  choice: “niya,” na sa konteksto ay tumutukoy sa Diyos
  alternative: 'Gawing impersonal: “nang sumama ang kalagayan nila”'
  rationale: Ang salaysay ng Exodo ang malinaw na konteksto, kung saan pinarusahan ng Diyos ang Ehipto. Gayunman, dahil hindi tahasang binanggit ang simuno sa sugnay na Hebreo, panghalip lamang ang ginamit sa teksto at ipinaliwanag sa talababa.
- issue: Magkaibang tinutukoy ng dalawang panghalip na maramihan
  choice: “sila” para sa Ehipto at Paraon; “mga Israelita / mga ito” para sa Israel
  alternative: Panatilihing parehong “sila” ang mga panghalip
  rationale: 'Nililinaw ang sintaks nang hindi binabago ang sanggunian ng salaysay: ang Ehipto ang pinakitunguhan nang mabigat, at ang Israel ang pinaalis at umalis.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pinatitigas ang puso” bilang natural na idyoma. Nilinaw ang mga sanggunian ng panghalip sa ikalawang pangungusap upang maiwasan ang kalituhan, habang inilagay sa talababa ang literal na anyo at ang di-tahasang simuno.
