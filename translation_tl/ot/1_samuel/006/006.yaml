  to: Bakit ninyo pinatitigas ang inyong mga puso[a], gaya ng kung paano pinatigas ng Ehipto at ng Paraon ang kanilang mga puso? Hindi ba nang malupit niya silang pakitunguhan ay pinaalis nila ang mga Israelita[b], at umalis ang mga ito?
