  text: וּ/לְקַחְתֶּ֞ם אֶת אֲר֣וֹן יְהוָ֗ה וּ/נְתַתֶּ֤ם אֹת/וֹ֙ אֶל הָ֣/עֲגָלָ֔ה וְ/אֵ֣ת כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר הֲשֵׁבֹתֶ֥ם ל/וֹ֙ אָשָׁ֔ם תָּשִׂ֥ימוּ בָ/אַרְגַּ֖ז מִ/צִּדּ֑/וֹ וְ/שִׁלַּחְתֶּ֥ם אֹת֖/וֹ וְ/הָלָֽךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/008.yaml
  text: Then take the ark of Yahweh and place it on the cart[a], and put the gold objects that you are returning to him as a guilt offering in a box beside it. Then send it away[c][b], and let it go.
translation:
  language: tl
  text: Pagkatapos, kunin ninyo ang kaban ni Yahweh at ilagay ito sa kariton. Ilagay ninyo sa isang kahon sa tabi nito ang mga bagay na yari sa ginto na ibinabalik ninyo sa kanya bilang handog na kabayaran sa pagkakasala. Pagkatapos, ipadala ninyo ito palayo at hayaan itong umalis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal, “at aalis ito.” Sa konteksto, ito ang huling hakbang ng tagubilin: ipadala ito palayo at hayaan itong umalis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: ang kaban ni Yahweh
  rationale: Ang אֲרוֹן ay kaban na sagrado sa kontekstong ito, at ang construct phrase ay nagsasaad ng kaugnayan o pag-aari kay Yahweh.
- source_word: הָעֲגָלָה
  choice: ang kariton
  rationale: Ang עֲגָלָה ay kariton o bagon; natural at malinaw ang “kariton” sa modernong Filipino.
- source_word: כְּלֵי הַזָּהָב
  choice: mga bagay na ginto
  rationale: Malawak ang saklaw ng כְּלִי at maaaring tumukoy sa mga bagay, kagamitan, o sisidlan; hindi ito dapat gawing mas tiyak kaysa sa Hebreo.
- source_word: הֲשֵׁבֹתֶם לוֹ
  choice: na ibinabalik ninyo sa kanya
  rationale: Ang Hiphil ng שׁוב ay “ibalik” o “pabalikin”; ang aspektong Filipino ay angkop sa kasalukuyang tagubilin.
- source_word: אָשָׁם
  choice: bilang handog para sa pagkakasala
  rationale: Pinananatili nito ang kultikong diwa ng אָשָׁם habang malinaw sa karaniwang mambabasa; maaari rin itong magtaglay ng diwang pagbabayad-pinsala.
- source_word: בָאַרְגַּז מִצִּדּוֹ
  choice: sa isang kahon sa tabi nito
  rationale: Ang אַרְגָּז ay kahon o baul, at ang hulaping panauhan ay pinakanatural na tumutukoy sa kaban.
- source_word: וְשִׁלַּחְתֶּם אֹתוֹ וְהָלָךְ
  choice: paalisin ninyo iyon, at hayaan itong umalis
  rationale: Isinasalin ang שׁלח bilang pagpapaaalis at pinananatili ang pormal na “at aalis iyon” ng וְהָלָךְ sa natural na permisibong tagubilin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Direktang inililipat ang personal na pangalan sa halip na palitan ito ng titulo; walang idinadagdag na denominasyonal na pagpapakahulugan.
- issue: Kahulugan ng אָשָׁם sa kontekstong Filisteo
  choice: handog para sa pagkakasala
  alternative: handog na pambayad-pinsala
  rationale: Pinananatili ang sakripisyal at kultikong katawagan ng tagapagsalaysay, habang hindi ikinukubli na maaari rin itong magpahiwatig ng kabayaran o reparasyon.
- issue: Puwersa ng וְהָלָךְ pagkatapos ng utos
  choice: hayaan itong umalis
  alternative: at aalis iyon
  rationale: Sa sunod-sunod na tagubilin, natural ang permisibong pagbasa, ngunit itinatala sa talababa ang literal na anyo upang mapanatili ang kaunting gramatikal na kalabuan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “kaban” para sa sagradong ark, “kariton” para sa sasakyan, at “mga bagay na ginto” upang mapanatili ang lawak ng terminong Hebreo. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
