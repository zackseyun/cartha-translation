  naturalness: 'May dalawang bahagyang di-natural na pahayag sa modernong Filipino: ang “mga bagay na ginto” ay mas maayos na “mga bagay na yari sa ginto,” at ang “paalisin ninyo iyon” ay maaaring magpahiwatig ng pagpapaalis o pagtataboy. Mas malinaw sa konteksto ng pagpapadala ng kaban ang “ipadala ninyo ito palayo.”'
  terminology: Ang “kaban ni Yahweh,” “kariton,” at “kahon” ay angkop. Ang “handog bilang kabayaran sa pagkakasala” ay mas malinaw na katumbas ng אָשָׁם kaysa “handog para sa pagkakasala,” na maaaring maiugnay sa ibang teknikal na handog. Hindi nito ipinapataw ang isang partikular na doktrinal na pagpapakahulugan.
