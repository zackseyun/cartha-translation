    issue: Ang “isang napakalaking kapahamakan” ay hindi sapat na sumasalamin sa “isang malaking/matinding hampas.”
    rationale: Ang מַכָּה ay “hampas, dagok, suntok/stroke,” at may kaugnayan ito sa inuulit na pandiwang “humampas.” Ang “kapahamakan” ay resulta lamang at naglalaho ang kongkretong imahen ng pinagmulan.
  - severity: low
    issue: Ang ayos na “pitumpung lalaki sa bayan, limampung libong lalaki” ay maaaring magmukhang ang “sa bayan” ay tumutukoy lamang sa unang bilang.
    rationale: Ang Hebreo ay may “sa bayan” bago kapuwa bilang. Ang paglalagay nito bago ang magkapares na bilang, kasama ng gitling, ay mas malinaw nang hindi nilulutas ang tekstuwal na suliranin.
