revisions:
- from: At pinatay niya ang ilan sa mga lalaki ng Bet-semes dahil tumingin sila sa loob ng Kaban ni Yahweh.[a] Pumatay siya ng pitumpung lalaki sa bayan, limampung libong lalaki.[b] Nagluksa ang bayan dahil pinasapit ni Yahweh sa kanila ang isang napakalaking kapahamakan.
  to: At pinatay niya ang ilan sa mga lalaki ng Bet-semes dahil tumingin sila sa loob ng Kaban ni Yahweh.[a] Pumatay siya sa bayan—pitumpung lalaki, limampung libong lalaki.[b] Nagluksa ang bayan dahil hinampas ni Yahweh ang bayan nang matindi.
  rationale: Pinalitan ang maluwag na “napakalaking kapahamakan” ng “hinampas ... nang matindi” upang maipahayag ang מַכָּה גְדוֹלָה at ang ugnayan nito sa paulit-ulit na “pagpukol/paghampas” sa talata. Inayos din ang lokasyon ng “sa bayan” upang saklawin nito ang sadyang mahirap na magkapares na bilang, na pinanatili kasama ng talababa.
