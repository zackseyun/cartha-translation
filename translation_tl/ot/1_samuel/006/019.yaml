base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/019.yaml
  text: And he struck down some of the men of Beth-shemesh because they had looked into the ark of Yahweh[a]. He struck down seventy men among the people, fifty thousand men[b], and the people mourned because Yahweh had struck the people with a great blow.
translation:
  language: tl
  text: At pinatay niya ang ilan sa mga lalaki ng Bet-semes dahil tumingin sila sa loob ng Kaban ni Yahweh.[a] Pumatay siya sa bayan—pitumpung lalaki, limampung libong lalaki.[b] Nagluksa ang bayan dahil hinampas ni Yahweh ang bayan nang matindi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil tumingin sila sa Kaban ni Yahweh.” Maaaring unawain nang mas pangkalahatan ang pang-ukol sa Hebreo, bagaman malamang na “tumingin sa loob” ang tinutukoy na paglabag sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: 'Ganito ang Hebreo: “pitumpung lalaki, limampung libong lalaki.” Mahirap ang pagkakasabing ito. Maaaring ibig sabihin ay “pitumpung lalaki mula sa limampung libong lalaki” o “limampung libo at pitumpung lalaki,” o maaaring may suliranin sa tekstong naipasa; may ilang sinaunang saksi na sumusuporta sa mas maliit na bilang.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: pinatay / pumatay
  rationale: Sa konteksto ng hatol at bilang ng mga nasawi, malinaw na nakamamatay ang paghampas; natural na ipinahahayag ito sa modernong Tagalog bilang “pinatay” o “pumatay.”
- source_word: בְּאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: ang ilan sa mga lalaki ng Bet-semes
  rationale: Pinananatili ang panlalaking katawagan ng אַנְשֵׁי at ipinahahayag ng “ilan sa” ang partitive na diwa ng בְּ.
- source_word: כִּי רָאוּ בַּאֲרוֹן יְהוָה
  choice: dahil tumingin sila sa loob ng Kaban ni Yahweh
  rationale: Maaaring mangahulugan ang ראה na may ב ng pagtingin sa o sa loob; ang “sa loob” ang malamang na kasalanan sa konteksto, habang itinatala sa talababa ang mas pangkalahatang posibilidad.
- source_word: אֲרוֹן יְהוָה
  choice: Kaban ni Yahweh
  rationale: Likas na Tagalog na anyo ng construct phrase; ginawang malaking titik ang Kaban bilang natatanging banal na sisidlan sa salaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: שִׁבְעִים אִישׁ חֲמִשִּׁים אֶלֶף אִישׁ
  choice: pitumpung lalaki sa bayan, limampung libong lalaki
  rationale: Pinananatili sa pangunahing teksto ang mahirap at hindi tiyak na pagkakasunod ng mga bilang sa Masoretikong Teksto, sa halip na tahimik na piliin ang isa sa ilang interpretasyon.
- source_word: וַיִּתְאַבְּלוּ
  choice: nagluksa
  rationale: Karaniwan at marangal na katumbas ng pandiwang tumutukoy sa pagluluksa matapos ang kamatayan o sakuna.
- source_word: מַכָּה גְדוֹלָה
  choice: isang napakalaking kapahamakan
  rationale: Ipinahahayag ang tindi at mapaminsalang resulta ng “malaking hampas” sa likas na Tagalog nang hindi ito tinutukoy bilang salot o epidemya.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pananatilihin ang personal na banal na pangalan na nasa Hebreo at iiwasang palitan ito ng titulo.
- issue: Ang mahirap na bilang ng mga namatay
  choice: 'Panatilihin ang pagkakasunod ng MT: “pitumpung lalaki … limampung libong lalaki” at ipaliwanag sa talababa'
  alternative: “pitumpung lalaki mula sa limampung libo,” “limampung libo at pitumpung lalaki,” o mas maliit na bilang
  rationale: Hindi tiyak ang sintaks at may suliraning tekstuwal; hindi dapat tahimik na lutasin ng salin ang tunay na kalabuan.
- issue: Dahilan ng hatol kaugnay ng pagtingin sa Kaban
  choice: “tumingin … sa loob” sa teksto, na may alternatibong “tumingin sa” sa talababa
  alternative: “tumingin sa Kaban”
  rationale: Ang “sa loob” ay ang malamang na kahulugan ayon sa konteksto, ngunit kaya rin ng pariralang Hebreo ang mas pangkalahatang pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “Bet-semes” bilang payak na transliterasyong Filipino at “Kaban ni Yahweh” bilang likas na pariralang Tagalog. Sadyang pinanatili ang putol at mahirap na pagkakasunod ng bilang upang hindi ikubli ang kalabuan ng pinagmulang teksto.
