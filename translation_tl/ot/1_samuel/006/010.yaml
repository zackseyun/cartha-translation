base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/010.yaml
  text: 'So the men did so: they took two milk cows and harnessed them to the cart[b][a], and shut up their calves in the house.'
translation:
  language: tl
  text: Kaya ganoon nga ang ginawa ng mga lalaki. Kumuha sila ng dalawang inahing bakang nagpapasuso[a], ikinabit ang mga ito sa kariton, at ikinulong sa bahay ang kanilang mga guya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dalawang bakang may pasusuhing guya.” Inilalarawan ng Hebreo ang mga bakang nagbibigay ng gatas at may mga guya.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “kanilang mga anak,” ibig sabihin, ang mga guya ng mga baka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: Kaya ganoon nga ang ginawa
  rationale: Likas na salin ng idyomang Hebreo na nagsasaad na sinunod nila ang naunang tagubilin; pinananatili rin nito ang maikli at tuwirang daloy ng salaysay.
- source_word: הָאֲנָשִׁים
  choice: mga lalaki
  rationale: Tiyak na tumutukoy rito ang pangngalan sa mga lalaking kumilos sa salaysay, kaya hindi ito ginawang pangkalahatang “mga tao.”
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: dalawang inahing bakang nagpapasuso
  rationale: Ang פָרוֹת ay mga babaeng baka, at inilalarawan sila ng עָלוֹת bilang mga bakang may gatas at nagpapasuso sa mga guya; mahalaga ito sa pagsubok na isinasalaysay.
- source_word: וַיַּאַסְרוּם
  choice: ikinabit ang mga ito
  rationale: Bagaman ang ugat ay may diwang “talian,” sa konteksto ay ikinakabit ang mga hayop bilang tagahila ng kariton. Ang “ikinabit” ay malinaw at natural sa makabagong Tagalog.
- source_word: בָּעֲגָלָה
  choice: sa kariton
  rationale: Ang עֲגָלָה ay ang sasakyang gagamitin sa pagdadala ng kaban at mga handog; ang “kariton” ay payak at angkop na katumbas.
- source_word: וְאֶת בְּנֵיהֶם
  choice: ang kanilang mga guya
  rationale: Literal na “kanilang mga anak,” ngunit dahil mga baka ang tinutukoy, ang natural at tiyak na salin ay “mga guya.”
- source_word: כָּלוּ בַבָּיִת
  choice: ikinulong sa bahay
  rationale: Ipinahihiwatig ng pandiwa ang pagpigil o pagsasara sa loob. Pinananatili ng “bahay” ang tahasang בַּבָּיִת sa halip na tukuyin itong “kulungan” o “kuwadra.”
