  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “inahing bakang nagpapasuso” upang maging tiyak ang kasarian at kalagayan ng mga baka nang hindi gumagamit ng teknikal o lipas na pananalita; pinanatili ang “bahay” upang hindi higitan ang detalye ng tekstong Hebreo.
