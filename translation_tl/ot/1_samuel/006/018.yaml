revisions:
- from: At ang mga gintong daga ay ayon sa bilang ng lahat ng lunsod ng mga Filisteo na nasasakupan ng limang pinuno, mula sa napapaderang lunsod hanggang sa nayong walang pader, at hanggang sa malaking bato[a] na pinagpatungan nila ng kaban ni Yahweh. Nananatili iyon hanggang sa araw na ito sa bukid ni Josue na taga-Bet-semes.
  to: At ang mga gintong daga ay ayon sa bilang ng lahat ng lunsod ng mga Filisteo na sakop ng limang pinuno, mula sa pinatibay na lunsod hanggang sa nayong walang pader, at hanggang sa malaking bato[a] na pinaglagyan nila ng kaban ni Yahweh. Ang batong ito ay nananatili hanggang sa araw na ito sa bukid ni Josue na taga-Bet-semes.
  rationale: Ginawang mas idiomatiko at mas tumpak ang mga paglalarawan ng mga pamayanan at ng kaugnayan ng mga lunsod sa limang pinuno. Nilinaw rin ang sugnay tungkol sa batong kinalagyan ng kaban at ang tinutukoy ng “nananatili,” habang hindi binabago ang kahulugan o ang maingat na paghawak sa pinagtatalunang pagbasa ng אָבֵל הַגְּדוֹלָה.
