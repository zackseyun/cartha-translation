  text: וְ/עַכְבְּרֵ֣י הַ/זָּהָ֗ב מִסְפַּ֞ר כָּל עָרֵ֤י פְלִשְׁתִּים֙ לַ/חֲמֵ֣שֶׁת הַ/סְּרָנִ֔ים מֵ/עִ֣יר מִבְצָ֔ר וְ/עַ֖ד כֹּ֣פֶר הַ/פְּרָזִ֑י וְ/עַ֣ד אָבֵ֣ל הַ/גְּדוֹלָ֗ה אֲשֶׁ֨ר הִנִּ֤יחוּ עָלֶ֨י/הָ֙ אֵ֚ת אֲר֣וֹן יְהוָ֔ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה בִּ/שְׂדֵ֥ה יְהוֹשֻׁ֖עַ בֵּֽית הַשִּׁמְשִֽׁי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/018.yaml
  text: and the golden mice[a], according to the number of all the cities of the Philistines belonging to the five rulers, from fortified city to unwalled village, and as far as the great stone on which they set down the ark of Yahweh, which remains to this day in the field of Joshua the Beth-shemite.
translation:
  language: tl
  text: At ang mga gintong daga ay ayon sa bilang ng lahat ng lunsod ng mga Filisteo na sakop ng limang pinuno, mula sa pinatibay na lunsod hanggang sa nayong walang pader, at hanggang sa malaking bato[a] na pinaglagyan nila ng kaban ni Yahweh. Ang batong ito ay nananatili hanggang sa araw na ito sa bukid ni Josue na taga-Bet-semes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Dakilang Abel.” Maaaring basahin ang tekstong Hebreo bilang pangalan ng lugar. Gayunman, ang “malaking bato” ay sinusuportahan ng kasunod na pahayag na doon nila inilapag ang kaban.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: mga gintong daga
  rationale: Ang עַכְבָּר ay maaaring tumukoy sa daga o bubuwit; ang pangkalahatang salitang “daga” ay natural sa Filipino at hindi labis na nagtatakda ng uri. Ang genitive na may זָהָב ay likas na isinaling “gintong.”
- source_word: מִסְפַּר כָּל עָרֵי פְלִשְׁתִּים
  choice: ayon sa bilang ng lahat ng lunsod ng mga Filisteo
  rationale: Pinananatili ng “ayon sa bilang” ang ugnayang pangdami na ipinahihiwatig ng מִסְפַּר, habang malinaw pa rin sa modernong Filipino.
- source_word: לַחֲמֵשֶׁת הַסְּרָנִים
  choice: na nasasakupan ng limang pinuno
  rationale: Ang סְרָנִים ay natatanging titulo ng mga punong Filisteo. Malinaw at hindi piyudal ang “mga pinuno,” at ipinakikita ng “nasasakupan” ang kaugnayan ng mga lunsod sa kanila.
- source_word: מֵעִיר מִבְצָר וְעַד כֹּפֶר הַפְּרָזִי
  choice: mula sa napapaderang lunsod hanggang sa nayong walang pader
  rationale: Ipinapanatili nito ang tuwirang paghahambing ng isang tanggulang pamayanan at isang bukás o di-napapaderang nayon.
- source_word: וְעַד אָבֵל הַגְּדוֹלָה
  choice: at hanggang sa malaking bato[a]
  rationale: Bagaman ang tekstong Masoretiko ay may anyong mababasang “Dakilang Abel,” sinusuportahan ng kasunod na sugnay at ng malaking batong binanggit sa konteksto ang “malaking bato.” Hindi ikinubli ang tekstuwal na kalabuan; nasa talababa ang pagbasa bilang pangalan ng lugar.
- source_word: אֲשֶׁר הִנִּיחוּ עָלֶיהָ אֵת אֲרוֹן יְהוָה
  choice: na pinagpatungan nila ng kaban ni Yahweh
  rationale: Likas na ipinahahayag ng “pinagpatungan” sa Filipino ang paglalapag ng kaban sa ibabaw ng bato at pinananatili ang kilos ng causative verb הִנִּיחוּ.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: Nananatili iyon hanggang sa araw na ito
  rationale: Ginagawang hayag ng pandiwang “nananatili” ang ipinahihiwatig na patuloy na pag-iral ng tinutukoy na bato sa panahon ng pagsulat.
- source_word: בִּשְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: sa bukid ni Josue na taga-Bet-semes
  rationale: Ang gentiliko na בֵּית הַשִּׁמְשִׁי ay natural na isinasalin bilang “taga-Bet-semes,” samantalang “Josue” ang nakaugaliang anyong Filipino ng pangalang Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “lunsod,” “nayon,” at “pinuno” sa halip na mga salitang lipas o labis na teknikal. Inilagay ang talababa kaagad pagkatapos ng “malaking bato,” ang mismong bahaging may alternatibong pagbasa.
