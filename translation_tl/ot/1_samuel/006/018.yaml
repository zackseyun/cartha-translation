    issue: “napapaderang lunsod” para sa fortified city
    rationale: Ang anyong “napapaderang” ay maaaring mangahulugang kasalukuyang nilalagyan ng pader. Ang “pinatibay na lunsod” ay mas likas at mas malapit sa ideya ng isang fortified settlement.
  - severity: low
    issue: “na nasasakupan ng limang pinuno”
    rationale: Mas natural ang “na sakop ng limang pinuno” para sa ugnayan ng mga lunsod sa limang Filisteong pinuno, nang hindi nagdaragdag ng diwa ng aktibong pagsasakop.
  - severity: low
    issue: “na pinagpatungan nila ng kaban”
    rationale: Bagaman posible, medyo mabigat ang pahayag. Ang “na pinaglagyan nila ng kaban” ay malinaw na nagsasaad na ang bato ang kinalagyan ng kaban.
