base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/007.yaml
  text: Now then[a], take and make one new cart, and two nursing cows on which no yoke has come, and hitch the cows to the cart[b], but take their calves away from them to the house.
translation:
  language: tl
  text: Ngayon nga, kumuha kayo at gumawa ng isang bagong kariton at dalawang inahing bakang nagpapasuso[a], na hindi pa napapatungan ng pamatok[b]. Ikabit ninyo ang mga baka sa kariton, ngunit ibalik ninyo sa bahay ang kanilang mga guya, palayo sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga inahing bakang may gatas.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “na hindi pa napapatungan ng pamatok”; ibig sabihin, hindi pa nagagamit ang mga ito sa paghila o ibang trabaho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Nagsisilbi itong panandang pangdiskurso na nagpapakilala sa susunod na tagubilin; ang “Kaya ngayon” ay likas sa modernong Tagalog at pinananatili ang ugnayan sa naunang sinabi.
- source_word: קְחוּ וַעֲשׂוּ
  choice: kumuha kayo at maghanda
  rationale: Pinananatili ang dalawang pautos. Sa konteksto ng kariton at mga baka, ang עשה ay maaaring tumukoy sa paghahanda o pagsasaayos, kaya hindi ipinapalagay na kailangang sila mismo ang bumuo ng kariton mula sa simula.
- source_word: עֲגָלָה חֲדָשָׁה אֶחָת
  choice: isang bagong kariton
  rationale: Ang “kariton” ang natural na tawag sa sasakyang hinihila ng mga hayop, at pinananatili ng “isang” ang tahasang bilang sa Hebreo.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: dalawang inahing baka na nagpapasuso
  rationale: Ang עָלוֹת ay tumutukoy sa mga bakang may gatas o kasalukuyang nagpapasuso. Ang saling ito ay malinaw na naghahanda sa pagbanggit sa kanilang mga guya.
- source_word: אֲשֶׁר לֹא עָלָה עֲלֵיהֶם עֹל
  choice: na hindi pa nalalagyan ng pamatok
  rationale: Inihahatid nito sa likas na Tagalog ang idyomang Hebreo na walang pamatok na ‘umakyat’ o ‘dumating’ sa kanila, ibig sabihin, hindi pa sila nagamit bilang mga hayop na pantrabaho.
- source_word: וַאֲסַרְתֶּם אֶת־הַפָּרוֹת בָּעֲגָלָה
  choice: Ikabit ninyo sa kariton ang mga baka
  rationale: Sa konteksto, ang אסר ay ang pagkakabit ng mga hayop na hihila sa kariton. Ang “ikabit” ay malinaw at hindi nagdaragdag ng teknikal na detalye na wala sa teksto.
- source_word: וַהֲשֵׁיבֹתֶם בְּנֵיהֶם מֵאַחֲרֵיהֶם הַבָּיְתָה
  choice: ngunit iuwi ninyo ang kanilang mga guya, palayo sa kanila
  rationale: Ang causative na anyo ng שוב ay ipinapahayag ng “iuwi”; ang בְּנֵיהֶם ay natural na “mga guya” para sa mga baka; at ang מֵאַחֲרֵיהֶם ay pinananatili bilang tahasang paghihiwalay sa mga inahin.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Tagalog. Ang maramihang “kayo/ninyo” ay tumutugma sa mga pautos na maramihan sa Hebreo. Pinanatili ang praktikal na pagkakasunod-sunod ng tagubilin at iniwasan ang espesipikong salitang “kamalig,” sapagkat “bahay” lamang ang nasa pinagmulan; ang “iuwi” ay natural na katumbas ng direksiyong הַבָּיְתָה.
