  text: And the ark of Yahweh was in the territory of the Philistines seven months[a].
translation:
  language: tl
  text: At ang Kaban ni Yahweh ay nasa lupain ng mga Filisteo sa loob ng pitong buwan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa teritoryo ng mga Filisteo.” Literal sa Hebreo, “sa bukid ng mga Filisteo.”
    reason: Pinananatili ang literal na kahulugan ng שָׂדֶה at ang posibleng heograpikong alternatibo.
lexical_decisions:
- source_word: וַיְהִי
  choice: At ... ay nasa
  rationale: Ipinagpapatuloy ng waw-consecutive ang salaysay. Likas sa Tagalog ang payak na “At ... ay nasa” at hindi na kailangang gawing masalimuot na “At nangyari na.”
- source_word: אֲרוֹן יְהוָה
  choice: ang Kaban ni Yahweh
  rationale: Tuwirang isinasalin ang construct chain. Ginamit ang “Kaban” bilang kinikilalang katawagan sa sagradong kaban sa kontekstong ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: nasa lupain ng mga Filisteo
  rationale: Bagaman literal na “sa parang/bukid ng mga Filisteo,” ang שָׂדֶה ay maaari ring tumukoy sa malawak na lupain o teritoryo. Ang “lupain” ang mas natural na heograpikong diwa rito habang pinananatili sa talababa ang literal na larawan.
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: nang pitong buwan
  rationale: Ang “nang pitong buwan” ay natural na pagpapahayag sa Tagalog ng tagal ng pananatili.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang “Yahweh” ay tuwirang transliterasyon ng personal na pangalang Hebreo at hindi nagpapalit dito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginawang malaking titik ang “Kaban” bilang malinaw na katawagan sa partikular na sagradong bagay; ginamit ang “mga Filisteo” bilang karaniwang modernong anyo.
