id: 1SA.6.5
reference: 1 Samuel 6:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶם֩ צַלְמֵ֨י עפלי/כם וְ/צַלְמֵ֣י עַכְבְּרֵי/כֶ֗ם הַ/מַּשְׁחִיתִם֙ אֶת הָ/אָ֔רֶץ וּ/נְתַתֶּ֛ם לֵ/אלֹהֵ֥י יִשְׂרָאֵ֖ל כָּב֑וֹד אוּלַ֗י יָקֵ֤ל אֶת יָד/וֹ֙ מֵֽ/עֲלֵי/כֶ֔ם וּ/מֵ/עַ֥ל אֱלֹהֵי/כֶ֖ם וּ/מֵ/עַ֥ל אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/005.yaml
  text: So make images of your tumors and images of your mice that are ravaging the land[a], and give glory to the God of Israel. Perhaps he will lighten his hand from upon you, and from upon your gods, and from upon your land.
translation:
  language: tl
  text: Kaya gumawa kayo ng mga imahen ng inyong mga bukol[a] at mga imahen ng inyong mga daga na sumisira sa lupain, at magbigay kayo ng karangalan sa Diyos ng Israel. Baka pagaanin niya ang bigat ng kanyang kamay mula sa inyo, sa inyong mga diyos, at sa inyong lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inyong mga almoranas.” Ang salitang Hebreo ay tumutukoy sa mga pamamaga o bukol sa katawan; posible ang mas tiyak na tradisyonal na salin, ngunit hindi ito tiyak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Kaya gumawa kayo
  rationale: Ang anyong pandiwa ay nagpapatuloy sa naunang tagubilin at may puwersang pautos; natural na ipinapahayag ng “Kaya gumawa kayo” ang bunga o kasunod na hakbang.
- source_word: צַלְמֵי
  choice: mga larawan
  rationale: Tumutukoy ang צֶלֶם sa isang ginawang representasyon o wangis. Ang “mga larawan” ay tuwiran at madaling maunawaan sa konteksto ng mga rebultong handog.
- source_word: עפלי/כם
  choice: inyong mga bukol
  rationale: Tumutukoy ang salitang Hebreo sa mga pamamaga o bukol sa katawan, ngunit hindi nito tiyak na itinatakda ang eksaktong uri ng karamdaman. Iniiwasan ng “mga bukol” ang labis na pagtitiyak.
- source_word: וְצַלְמֵי עַכְבְּרֵי/כֶם
  choice: at ng inyong mga daga
  rationale: Maaaring tumukoy ang עַכְבָּר sa daga o katulad na rodent. “Mga daga” ang karaniwan at likas na salin sa Filipino.
- source_word: הַמַּשְׁחִיתִם אֶת הָאָרֶץ
  choice: na sumisira sa lupain
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na mapanirang gawain. Pinananatili ng “sumisira” ang aktibong diwa nang hindi nagpapalabis.
- source_word: וּנְתַתֶּם ... כָּבוֹד
  choice: at magbigay kayo ng karangalan
  rationale: Sa kontekstong ito, ang כָּבוֹד ay karangalang ibinibigay sa Diyos bilang pagkilala sa kanyang kapangyarihan. Natural sa Filipino ang “magbigay ng karangalan.”
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: sa Diyos ng Israel
  rationale: Tuwirang inililipat ang pariralang konstrakto at malinaw sa konteksto ang tiyak na pagkakakilanlan ng Diyos.
- source_word: אוּלַי
  choice: Baka
  rationale: Nagpapahayag ang אוּלַי ng posibilidad o pag-asa. Ang “baka” ay natural sa modernong Filipino at hindi ginagawang tiyak ang inaasahang resulta.
- source_word: יָקֵל אֶת יָדוֹ
  choice: pagaanin niya ang kanyang kamay
  rationale: Ang Hiphil ng קלל ay nangangahulugang gawing magaan o bawasan ang bigat. Pinananatili ng salin ang metapora ng kamay bilang kapangyarihang nagpapahirap.
- source_word: מֵעֲלֵיכֶם וּמֵעַל אֱלֹהֵיכֶם וּמֵעַל אַרְצְכֶם
  choice: na nakapatong sa inyo, sa inyong mga diyos, at sa inyong lupain
  rationale: 'Ang “nakapatong” ay naghahayag sa natural na Filipino ng larawang nasa מעל: isang mabigat na kamay na nasa ibabaw nila. Pinananatili rin ang tatlong saklaw—ang mga tao, kanilang mga diyos, at kanilang lupain.'
theological_decisions:
- issue: Eksaktong uri ng karamdamang tinutukoy ng עפלים
  choice: mga bukol
  alternative: mga almoranas; mga pamamaga
  rationale: Hindi sapat ang salitang Hebreo upang ipilit ang mas tiyak na “almoranas.” Pinananatili ng “mga bukol” ang malawak na kahulugan, habang inilalagay sa talababa ang tradisyonal ngunit pinagtatalunang alternatibo.
- issue: Metapora ng kamay ng Diyos
  choice: pagaanin niya ang kanyang kamay na nakapatong
  alternative: bawasan niya ang kanyang parusa; alisin niya ang kanyang kapangyarihan
  rationale: Maliwanag at mahalaga ang antropomorpikong larawan sa Hebreo. Ang pagpapanatili sa “kamay” ay hindi tahimik na nagpapakahulugan dito bilang parusa lamang at pinananatili ang diin sa pagkilos at kapangyarihan ng Diyos.
- issue: Pagbanggit sa mga diyos ng mga Filisteo bilang nasa ilalim din ng kamay ng Diyos
  choice: sa inyong mga diyos
  alternative: sa inyong mga pinuno
  rationale: Hayagang אֱלֹהֵיכֶם, “inyong mga diyos,” ang teksto. Pinananatili ito upang hindi mawala ang teolohikal na paghahambing at kahihiyang ipinahihiwatig ng talata.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kayo” at “inyong” para sa maramihang kausap. Pinanatili ang metapora ng mabigat na kamay ng Diyos, ngunit nilinaw sa natural na Filipino sa pamamagitan ng “nakapatong.”
