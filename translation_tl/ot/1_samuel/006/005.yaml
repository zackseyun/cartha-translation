  to: Kaya gumawa kayo ng mga imahen ng inyong mga bukol[a] at mga imahen ng inyong mga daga na sumisira sa lupain, at magbigay kayo ng karangalan sa Diyos ng Israel. Baka pagaanin niya ang bigat ng kanyang kamay mula sa inyo, sa inyong mga diyos, at sa inyong lupain.
