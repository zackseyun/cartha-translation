base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/020.yaml
  text: Then the men of Beth-shemesh said[a], “Who is able to stand before Yahweh, this holy God? And to whom shall he go up from us?”
translation:
  language: tl
  text: Pagkatapos, sinabi ng mga lalaki ng Bet-semes, “Sino ang makatatayo sa harap ni Yahweh, ang banal na Diyos na ito? At kanino aahon mula sa atin?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Pagkatapos ay sinabi
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay; natural sa modernong Tagalog ang “Pagkatapos ay sinabi.”
- source_word: אַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: mga lalaki ng Bet-semes
  rationale: Pinananatili ang panlalaking pangngalan ng Hebreo at ang pangalan ng lugar, sa halip na gawing pangkalahatang “mga tao.”
- source_word: מִי יוּכַל
  choice: Sino ang makatatayo
  rationale: Ang “makatatayo” ay malinaw na nagpapahayag ng kakayahan habang umaayon sa kasunod na pawatas.
- source_word: לַעֲמֹד לִפְנֵי
  choice: makatatayo sa harap ni
  rationale: Pinananatili ang karaniwang idyomang “tumayo sa harap,” na may solemneng diwa ng pagharap o pananatili sa presensiya ng isang nakatataas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הָאֱלֹהִים הַקָּדוֹשׁ הַזֶּה
  choice: ang banal na Diyos na ito
  rationale: Natural sa Tagalog at pinananatili ang kabanalan, pagkakakilanlan bilang Diyos, at mariing demonstratibong “ito.”
- source_word: וְאֶל מִי
  choice: At kanino
  rationale: Tuwirang inililipat ang pang-ukol at pananong na nagpapasimula sa ikalawang tanong.
- source_word: יַעֲלֶה
  choice: siya aahon
  rationale: Ang “aahon” ay nagpapanatili sa batayang kahulugan na “umakyat/pumaitaas.” Walang tahasang simuno sa Hebreo; ang “siya” ay nagpapanatili ng di-tiyak na reperensiya sa pangunahing teksto.
- source_word: מֵעָלֵינוּ
  choice: mula sa atin
  rationale: Maikli at natural na ipinapahayag ang paglayo mula sa kanilang kinaroroonan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Di-binanggit na simuno ng יַעֲלֶה
  choice: siya aahon
  alternative: ito aahon, na tumutukoy sa Kaban ni Yahweh
  rationale: Nasa panlalaking isahan ang pandiwang Hebreo ngunit walang tahasang simuno. Malamang na ang Kaban ang tinutukoy ayon sa konteksto, subalit hindi ito hayagang sinasabi ng talata; kaya pinananatili sa pangunahing teksto ang kalabuan at ipinaliliwanag sa talababa ang malamang na reperensiya.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang tuwirang retorikal na mga tanong, ang personal na pangalang Yahweh, at ang kalabuan ng di-binanggit na simuno sa huling sugnay.
