  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם הוֹרִ֣ידוּ אֶת אֲר֣וֹן יְהוָ֗ה וְ/אֶת הָ/אַרְגַּ֤ז אֲשֶׁר אִתּ/וֹ֙ אֲשֶׁר בּ֣/וֹ כְלֵֽי זָהָ֔ב וַ/יָּשִׂ֖מוּ אֶל הָ/אֶ֣בֶן הַ/גְּדוֹלָ֑ה וְ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ הֶעֱל֨וּ עֹל֜וֹת וַֽ/יִּזְבְּח֧וּ זְבָחִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא לַֽ/יהוָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/015.yaml
  text: And the Levites took down the ark of Yahweh[a], and the box that was with it, in which were the gold objects, and set them on the great stone[c][b]. And the men of Beth-shemesh offered burnt offerings and sacrificed sacrifices on that day to Yahweh.
translation:
  language: tl
  text: Ibinaba ng mga Levita ang kaban ni Yahweh[a] at ang kahong kasama nito, na kinalalagyan ng mga kagamitang yari sa ginto[b], at inilagay nila ang mga iyon sa malaking bato. Noong araw na iyon, naghandog ang mga lalaki ng Bet-semes ng mga handog na sinusunog at nag-alay ng mga hain kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH, ang personal na pangalan ng Diyos; tradisyonal na isinasalin na “ang PANGINOON.”'
    reason: alternative_reading
  - marker: b
    text: Ang salitang Hebreo ay maaaring tumukoy sa mga kagamitan, bagay, sisidlan, o iba pang artikulong yari sa ginto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwan at malinaw na tawag sa mga kabilang sa lipi ni Levi.
- source_word: הוֹרִידוּ
  choice: Ibinaba
  rationale: Ang Hiphil ng ירד ay tumutukoy sa pagbaba o pag-aalis ng kaban at ng kahon mula sa kariton.
- source_word: אֲרוֹן יְהוָה
  choice: ang kaban ni Yahweh
  rationale: Ang אֲרוֹן ay kaban; pinananatili ang personal na pangalang יהוה bilang Yahweh.
- source_word: הָאַרְגַּז אֲשֶׁר אִתּוֹ
  choice: ang kahong kasama nito
  rationale: Tinutukoy nito ang hiwalay na lalagyang kasabay ng kaban.
- source_word: אֲשֶׁר בּוֹ כְלֵי זָהָב
  choice: na kinalalagyan ng mga kagamitang ginto
  rationale: Malawak ang saklaw ng כְלֵי at maaaring tumukoy sa mga kagamitan, bagay, o sisidlan; hindi tinutukoy ng talata ang eksaktong anyo.
- source_word: וַיָּשִׂמוּ אֶל הָאֶבֶן הַגְּדוֹלָה
  choice: at inilagay nila ang mga iyon sa malaking bato
  rationale: Sa kontekstong ito, ang שׂים אֶל ay likas na tumutukoy sa paglalagay sa ibabaw o kinaroroonan ng malaking bato.
- source_word: וְאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: ang mga lalaki ng Bet-semes
  rationale: Pinananatili ang panlalaking anyo ng אַנְשֵׁי at ang tiyak na pagtukoy sa mga taga-Bet-semes.
- source_word: הֶעֱלוּ עֹלוֹת
  choice: naghandog ... ng mga handog na sinusunog
  rationale: Ito ang malinaw at kinikilalang katumbas ng terminong panghandog na עֹלָה.
- source_word: וַיִּזְבְּחוּ זְבָחִים
  choice: nag-alay ng iba pang mga handog
  rationale: Likas sa modernong Tagalog ang 'nag-alay ng mga handog'; idinagdag ang 'iba pang' upang maipakita na bukod ang mga ito sa naunang mga handog na sinusunog nang hindi inuulit ang di-likas na magkaugnay na pandiwa at layon.
- source_word: בַּיּוֹם הַהוּא לַיהוָה
  choice: Nang araw na iyon ... kay Yahweh
  rationale: Pinananatili ang panahong tinutukoy at si Yahweh bilang tumatanggap ng mga handog.
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang Tetragrammaton; ang 'Yahweh' ay tuwirang transliterasyon at hindi nito pinapalitan ang pangalan ng isang titulo.
- issue: Kasarian ng אַנְשֵׁי
  choice: mga lalaki ng Bet-semes
  alternative: mga taga-Bet-semes
  rationale: Panlalaki ang anyong Hebreo at maaaring tumukoy sa mga lalaking gumanap sa pampublikong paghahandog; pinananatili ito sa pangunahing teksto nang hindi ginagawang neutral.
- issue: Ugnayan ng אֶל sa malaking bato
  choice: sa malaking bato
  alternative: sa tabi ng malaking bato
  rationale: Maaaring literal na mangahulugang 'patungo/sa,' ngunit sa konstruksyong ito at sa salaysay, pinakamalamang ang paglalagay sa ibabaw ng bato; hindi kailangang labis na tukuyin ang 'ibabaw' sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'kaban' at 'handog na sinusunog' bilang malinaw na bokabularyong biblikal. Inayos ang huling sugnay upang maging natural sa Tagalog habang pinananatiling magkaiba ang mga handog na sinusunog at ang iba pang mga hain.
