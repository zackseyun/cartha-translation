    rationale: Ang “siya nga ang nagdulot sa atin ng malaking kapahamakang ito” ay natural na Filipino at pinananatili ang diin ng הוּא.
  - severity: low
    issue: Walang mga talababa sa saling Tagalog para sa mga leksikal na alternatibo ng “kapahamakan” at “nagkataon.”
    rationale: Ang mga talababa ay inilalagay sa mismong mga salitang saklaw nila, hindi sa pangalan ng lugar, upang maging malinaw ang kanilang anchor.
