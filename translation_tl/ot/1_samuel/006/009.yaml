  text: וּ/רְאִיתֶ֗ם אִם דֶּ֨רֶךְ גְּבוּל֤/וֹ יַֽעֲלֶה֙ בֵּ֣ית שֶׁ֔מֶשׁ ה֚וּא עָ֣שָׂה לָ֔/נוּ אֶת הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את וְ/אִם לֹ֗א וְ/יָדַ֨עְנוּ֙ כִּ֣י לֹ֤א יָד/וֹ֙ נָ֣גְעָה בָּ֔/נוּ מִקְרֶ֥ה ה֖וּא הָ֥יָה לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/009.yaml
  text: 'And watch: if it goes up by the way of its territory to Beth-shemesh[a], then he is the one who has done this great harm to us; but if not, then we will know that it was not his hand that struck us[b]; it happened to us by chance.'
translation:
  language: tl
  text: 'At tingnan ninyo: kung aahon ito sa daang patungo sa hangganan nito, sa Bet-semes, siya nga ang nagdulot sa atin ng malaking kapahamakang ito[a]; ngunit kung hindi, malalaman nating hindi tayo hinampas ng kanyang kamay—nagkataon lamang ito sa atin[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malaking pinsala” o “malaking kalamidad.” Ang salitang Hebreo ay maaaring tumukoy sa matinding pinsala o kapahamakan, hindi kinakailangang sa moral na kasamaan.
    reason: lexical_alternative
  - marker: b
    text: O “isang pangyayaring nagkataon lamang ito sa atin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: At tingnan ninyo
  rationale: Ang maramihang pautos ay nagpapasimula ng maingat na pagmamasid sa magiging takbo ng kariton.
- source_word: דֶּרֶךְ גְּבוּלוֹ
  choice: sa daan patungo sa nasasakupan nito
  rationale: Pinananatili ang dalawang diwa ng דֶּרֶךְ bilang daan at גְּבוּל bilang teritoryo o nasasakupan; ang hulaping panghalip ay iniuugnay sa lugar na patutunguhan ng kaban.
- source_word: יַעֲלֶה
  choice: aahon
  rationale: Tuwirang ipinahahayag ang pag-akyat o pagpunta paitaas, na angkop sa heograpikong paglalakbay patungong Bet-semes.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bet-semes
  rationale: Isinalin sa karaniwang anyong baybay-Tagalog ang pangalang Hebreo.
- source_word: הוּא עָשָׂה לָנוּ
  choice: siya nga ang gumawa sa atin
  rationale: Ang “siya nga” ay nagpapanatili sa diin ng hiwalay na panghalip na הוּא.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: malaking kapahamakang ito
  rationale: Ang kapahamakan ay likas na Tagalog para sa matinding pinsala o kalamidad at hindi awtomatikong nagpapahiwatig ng moral na kasamaan.
- source_word: וְיָדַעְנוּ
  choice: malalaman natin
  rationale: Ipinahahayag ang magiging konklusyon mula sa nasaksihang palatandaan.
- source_word: יָדוֹ נָגְעָה בָּנוּ
  choice: ang kamay niya ang humampas sa atin
  rationale: Pinananatili ang metapora ng kamay bilang aktibong kapangyarihan at ang lakas ng idyoma sa konteksto ng paghatol.
- source_word: מִקְרֶה הוּא הָיָה לָנוּ
  choice: nagkataon lamang ito sa atin
  rationale: Natural na modernong Tagalog ito para sa isang pangyayaring itinuturing na naganap nang di-sinasadya o dahil sa pagkakataon.
theological_decisions:
- issue: Paglalarawan sa רָעָה bilang bunga ng pagkilos ng Diyos
  choice: malaking kapahamakan
  alternative: malaking kasamaan; malaking pinsala; malaking kalamidad
  rationale: Ang “kapahamakan” ay nagpapanatili sa tindi ng salot o paghatol nang hindi ipinapasya na moral na kasamaan ang kahulugan ng salita.
- issue: Pagkilos ng Diyos o pagkakataon
  choice: Pinanatili ang pagsubok at ang dalawang posibleng konklusyon ng mga nagsasalita
  alternative: Ipahayag nang tuwiran na tiyak na Diyos ang sanhi
  rationale: Sa antas ng pananalita ng talata, sinusubok pa ng mga Filisteo kung ang kapahamakan ay mula sa kamay ng Diyos o nagkataon lamang; hindi dapat alisin ng salin ang retorikal na pag-aalinlangang iyon.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang konkretong larawang “kamay” at ang diin ng “siya nga,” habang iniwasan ang labis na teknikal o makalumang pananalita.
