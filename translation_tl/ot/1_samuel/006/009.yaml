revisions:
- from: 'At tingnan ninyo: kung aahon ito sa daan patungo sa nasasakupan nito, sa Bet-semes, siya nga ang gumawa sa atin ng malaking kapahamakang ito; ngunit kung hindi, malalaman nating hindi ang kamay niya ang humampas sa atin—nagkataon lamang ito sa atin.'
  to: 'At tingnan ninyo: kung aahon ito sa daang patungo sa hangganan nito, sa Bet-semes, siya nga ang nagdulot sa atin ng malaking kapahamakang ito[a]; ngunit kung hindi, malalaman nating hindi tayo hinampas ng kanyang kamay—nagkataon lamang ito sa atin[b].'
  rationale: Inayos ang pagtukoy sa גְּבוּלוֹ bilang “hangganan nito,” pinakinis ang pananalita para sa modernong Filipino, at pinanatili ang metapora ng kamay at ang retorikal na alternatiba ng pagkilos ng Diyos o pagkakataon. Nagdagdag ng nakaangkla nang wasto na mga talababa para sa dalawang leksikal na ambigwidad.
