    issue: “Nanatili sila sa iisang lansangan”
    rationale: Ang “nanatili” ay karaniwang nangangahulugang hindi umalis o nagtagal sa isang lugar. Ang בִּמְסִלָּה אַחַת ay naglalarawan ng daang tinahak nila, hindi ng pananatili.
  - severity: medium
    issue: “umuungal” para sa tunog ng mga baka
    rationale: Bagaman mauunawaan sa paliwanag ng talababa, ang salita ay mas madaling iugnay sa malakas na pag-ungal at hindi sa karaniwang tunog ng baka. “Umuungol” ay mas tumpak at natural sa kontekstong ito.
