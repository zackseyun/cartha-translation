revisions:
- from: At dumiretso ang mga baka sa daang patungo sa Bet-semes. Nanatili sila sa iisang lansangan; tuloy-tuloy silang lumakad habang umuungal[a], at hindi sila lumihis sa kanan o sa kaliwa. Sumunod sa likuran nila ang mga pinuno[b] ng mga Filisteo hanggang sa hangganan ng Bet-semes.
  to: At dumiretso ang mga baka sa daang patungo sa Bet-semes, at tinahak nila ang iisang lansangan. Patuloy silang naglakad habang umuungol[a], at hindi sila lumihis sa kanan o sa kaliwa. Sumunod sa likuran nila ang mga pinuno[b] ng mga Filisteo hanggang sa hangganan ng Bet-semes.
  rationale: Pinalitan ang “Nanatili sila” upang maipakita ang aktuwal na pagtahak sa isang daan, at pinalitan ang pandiwang tumutukoy sa tunog ng baka ng mas angkop na “umuungol.” Pinanatili ang daloy, pangalang lugar, mga panandang talababa, at ang walang-dagdag na paglalarawan sa mga pinunong Filisteo.
