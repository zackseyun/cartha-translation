translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang “Bet-semes” bilang anyong madaling basahin ng pangalang Beth-shemesh. Inayos ang pagkakasunod ng mga pananda upang bawat talababa ay nakalagay sa mismong salitang nililinaw nito.
