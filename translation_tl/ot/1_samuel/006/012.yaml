base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/012.yaml
  text: And the cows went straight on the road toward Beth-shemesh[a], along one highway; they went on, lowing as they went, and did not turn aside to the right or to the left[c][b]. And the lords of the Philistines were walking behind them as far as the border of Beth-shemesh.
translation:
  language: tl
  text: At dumiretso ang mga baka sa daang patungo sa Bet-semes, at tinahak nila ang iisang lansangan. Patuloy silang naglakad habang umuungol[a], at hindi sila lumihis sa kanan o sa kaliwa. Sumunod sa likuran nila ang mga pinuno[b] ng mga Filisteo hanggang sa hangganan ng Bet-semes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “umuungol” ay tumutukoy rito sa tunog ng mga baka; patuloy nila itong ginagawa habang naglalakad.
    reason: cultural_note
  - marker: b
    text: Maaari ring “mga panginoon.” Ang salitang Hebreo ay titulo ng mga kinikilalang tagapamahala sa mga lunsod ng mga Filisteo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִשַּׁרְנָה
  choice: dumiretso
  rationale: Likas at malinaw na Filipino para sa tuwirang pagkilos nang hindi lumilihis.
- source_word: הַפָּרוֹת
  choice: mga baka
  rationale: Tumutukoy ang konteksto sa mga inahing bakang nagpapasuso; sa Filipino, sapat at natural ang pangkalahatang tawag na “mga baka.”
- source_word: בַּדֶּרֶךְ עַל דֶּרֶךְ בֵּית שֶׁמֶשׁ
  choice: sa daang patungo sa Bet-semes
  rationale: Pinananatili ang tiyak na ruta at direksiyon tungo sa lugar, habang iniiwasan ang di-likas na pag-uulit ng “daan.”
- source_word: בִּמְסִלָּה אַחַת
  choice: Nanatili sila sa iisang lansangan
  rationale: Ipinahahayag ang diin ng Hebrew na iisa at tiyak ang rutang tinahak; ang “lansangan” ay hindi kinakailangang modernong expressway.
- source_word: הָלְכוּ הָלוֹךְ
  choice: tuloy-tuloy silang lumakad
  rationale: Inililipat ang duratibong diin ng finite verb at infinitive absolute.
- source_word: וְגָעוֹ
  choice: habang umuungal
  rationale: Karaniwang pandiwang Filipino para sa malakas na tinig ng baka; nililinaw na nagpapatuloy ang tunog habang naglalakbay sila.
- source_word: וְלֹא סָרוּ יָמִין וּשְׂמֹאול
  choice: hindi sila lumihis sa kanan o sa kaliwa
  rationale: Malapit sa idyomang Hebrew at natural sa Filipino.
- source_word: וְסַרְנֵי פְלִשְׁתִּים
  choice: mga pinuno ng mga Filisteo
  rationale: Ipinahahayag ang opisyal na katayuan ng mga tagapamahalang Filisteo nang hindi nagpapahiwatig ng piyudal na titulong wala sa modernong Filipino.
- source_word: הֹלְכִים אַחֲרֵיהֶם
  choice: Sumunod sa likuran nila
  rationale: Natural na inilalarawan ang nagpapatuloy na pisikal na pagsunod.
- source_word: עַד גְּבוּל בֵּית שָׁמֶשׁ
  choice: hanggang sa hangganan ng Bet-semes
  rationale: Pinananatili ang heograpikong kahulugan ng גְּבוּל bilang hangganan ng nasasakupan.
