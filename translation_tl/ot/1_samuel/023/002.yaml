base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/002.yaml
  text: So David inquired of Yahweh[a], saying, “Shall I go and strike these Philistines?” And Yahweh said to David, “Go and strike the Philistines, and save Keilah.”
translation:
  language: tl
  text: At sumangguni si David kay Yahweh at nagtanong, “Pupunta ba ako at sasalakayin ang mga Filisteong ito?” Sinabi ni Yahweh kay David, “Pumunta ka at salakayin mo ang mga Filisteo, at iligtas[a] mo ang Keila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sagipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: sumangguni ... kay Yahweh
  rationale: Sa konstruksiyong ito, ang שׁאל בַּיהוָה ay tumutukoy sa paghingi ng patnubay mula kay Yahweh, hindi sa isang karaniwang pagtatanong lamang. Likas at malinaw sa modernong Filipino ang “sumangguni kay Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: הַאֵלֵךְ
  choice: Pupunta ba ako
  rationale: Ipinahahayag ng tanong na may imperfect ang pag-aalinlangan at paghingi ng pasiya kung tutuloy si David. Pinananatili ng “Pupunta ba ako” ang bukas na anyo ng tanong nang hindi dinaragdagan ng tahasang obligasyong maaaring ipahiwatig ng “Dapat ba.”
- source_word: וְהִכֵּיתִי / וְהִכִּיתָ
  choice: sasalakayin / salakayin
  rationale: Sa kontekstong militar, natural na katumbas ng נכה ang “salakayin.” Hindi nito ipinapalagay na tiyak nang matatalo ang kalaban, at pinananatili nito ang pag-uulit ng pandiwa sa tanong at sagot.
- source_word: בַּפְּלִשְׁתִּים הָאֵלֶּה
  choice: ang mga Filisteong ito
  rationale: Pinananatili ng “ito” ang demonstratibong הָאֵלֶּה, na tumutukoy sa tiyak na pangkat ng mga Filisteo sa salaysay.
- source_word: וְהוֹשַׁעְתָּ
  choice: iligtas
  rationale: Ang causative na anyo ng ישׁע ay nangangahulugang iligtas o hanguin mula sa panganib. Ang “iligtas” ay malinaw at natural sa kontekstong militar.
- source_word: קְעִילָה
  choice: Keila
  rationale: Isinulat ang pangalan ng lugar sa anyong madaling basahin at bigkasin sa Filipino.
theological_decisions:
- issue: Paglalarawan sa pagtatanong ni David sa Diyos
  choice: sumangguni kay Yahweh
  alternative: nagtanong kay Yahweh
  rationale: Ipinakikita ng konstruksiyong Hebreo na humingi si David ng banal na patnubay. Hindi tinutukoy ng salin kung anong ritwal o kasangkapan ang ginamit, sapagkat hindi iyon tahasang sinasabi sa talata.
- issue: Pagsasalin ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang pangalang pantangi sa tekstong Hebreo at iniiwasang ipalit dito ang titulong “Panginoon.”
- issue: Saklaw ng kaligtasan sa וְהוֹשַׁעְתָּ
  choice: iligtas
  alternative: palayain
  rationale: Ang tinutukoy rito ay pagliligtas sa lungsod mula sa panganib na militar, ngunit hindi nililimitahan ang pandiwa sa isang mas makitid na paglalarawan kaysa sa Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit tuwiran. Ginamit ang natural na ayos ng usapan at mga pautos. Pinanatili ang pag-uulit ng pandiwang militar sa tanong at sagot, gayundin ang demonstratibong “ito.”
