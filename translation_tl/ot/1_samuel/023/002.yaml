- from: Kaya sumangguni si David kay Yahweh, “Pupunta ba ako at sasalakayin ang mga Filisteong ito?” Sinabi ni Yahweh kay David, “Pumunta ka, salakayin mo ang mga Filisteo, at iligtas[a] mo ang Keila.”
  to: At sumangguni si David kay Yahweh at nagtanong, “Pupunta ba ako at sasalakayin ang mga Filisteong ito?” Sinabi ni Yahweh kay David, “Pumunta ka at salakayin mo ang mga Filisteo, at iligtas[a] mo ang Keila.”
  rationale: Pinalitan ang pang-ugnay na may posibleng pahiwatig na sanhi ng neutral na “At,” at idinagdag ang “at nagtanong” upang natural na maipahayag ang לֵאמֹר nang hindi binabago ang saklaw o puwersa ng tanong ni David. Pinalitan din ang alternatibo sa talababa ng “sagipin,” na mas angkop sa ישׁע sa kontekstong militar. Napanatili ang demonstratibong “mga Filisteong ito,” ang pag-uulit ng pandiwang pagsalakay, at ang pangalang Yahweh.
