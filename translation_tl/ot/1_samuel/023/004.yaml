base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/004.yaml
  text: David again inquired of the LORD, and the LORD answered him and said, “Rise, go down to Keilah, for I am giving the Philistines into your hand.”
translation:
  language: tl
  text: Muling nagtanong si David sa PANGINOON, at sinagot siya ng PANGINOON at sinabi, “Bumangon ka, bumaba ka sa Keila, sapagkat ibibigay ko sa iyong kamay ang mga Filisteo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד ... לִשְׁאֹל
  choice: Muling nagtanong
  rationale: Natural na Filipino para sa Hebreong idyomang nagsasaad na nagtanong na naman si David.
- source_word: בַּיהוָה
  choice: sa PANGINOON
  rationale: Ipinapakita ang pagtatanong sa Diyos para sa patnubay; ginagamit ang nakaugaliang salin ng banal na pangalang YHWH.
- source_word: קוּם רֵד
  choice: Tumayo ka at lumusong
  rationale: Pinananatili ang dalawang utos at ang heograpikal na diwa ng רֵד na ‘bumaba/lumusong.’
- source_word: אֲנִי נֹתֵן
  choice: ibibigay ko
  rationale: Ang Hebreong participle ay nagpapahayag ng tiyak at nalalapit na pagkilos; natural itong ipahayag sa Filipino sa panghinaharap.
- source_word: בְּיָדֶךָ
  choice: sa kamay mo
  rationale: Pinananatili ang konkretong Hebreong metapora para sa pagpapasakop ng kaaway sa kapangyarihan ni David.
theological_decisions:
- issue: Paglalahad sa tetragrammaton יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Sumusunod sa kinikilalang tradisyon ng pagsasalin habang malinaw na itinatangi ang banal na pangalan sa pamamagitan ng malalaking titik.
- issue: Aspekto ng pangakong נֹתֵן
  choice: ibibigay ko
  alternative: ibinibigay ko
  rationale: Ipinahahayag ang katiyakan ng ipinangakong tagumpay nang hindi ipinapalagay na nagsimula na ang labanan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “lumusong” upang mapanatili ang direksiyong heograpikal at ang anyong utos; pinanatili rin ang idyomang “sa kamay mo” dahil malinaw at natural pa rin ito sa konteksto.
