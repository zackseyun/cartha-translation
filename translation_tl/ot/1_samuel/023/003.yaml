base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/003.yaml
  text: But David’s men said to him[a], “Look, we are afraid here in Judah; how much more, then, if we go to Keilah against the battle lines of the Philistines?”
translation:
  language: tl
  text: Ngunit sinabi sa kanya ng mga tauhan ni David, “Tingnan mo, natatakot kami rito sa Juda; lalo na kaya kung pupunta kami sa Keila upang harapin ang mga hanay ng mga Filisteo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ngunit sinabi
  rationale: Ipinagpapatuloy ng waw-consecutive ang salaysay, ngunit ang “Ngunit” ay likas na naghahayag ng pag-aatubili at pagsalungat ng mga tauhan sa naunang utos.
- source_word: אַנְשֵׁי דָוִד
  choice: mga tauhan ni David
  rationale: Likas na salin ng pariralang construct; ipinahihiwatig ang pangkat ng mga lalaking nasa ilalim ni David.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Tuwirang tumutukoy kay David at natural sa ayos ng pangungusap sa Filipino.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pinananatili ang mariing pantawag-pansin ng הִנֵּה sa makabago at madaling maunawaang Filipino.
- source_word: אֲנַחְנוּ פֹה בִּיהוּדָה יְרֵאִים
  choice: natatakot na nga kami rito sa Juda
  rationale: Pinananatili ang diin sa kasalukuyang takot nila kahit nasa Juda pa sila; ang “na nga” ay tumutulong sa lohikang mula sa mas maliit tungo sa mas malaking panganib.
- source_word: וְאַף כִּי
  choice: lalo na kaya kung
  rationale: 'Natural na idyomang Filipino para sa argumentong lesser-to-greater: kung natatakot sila sa Juda, lalo silang matatakot sa pagharap sa kaaway sa Keila.'
- source_word: נֵלֵךְ קְעִלָה
  choice: pupunta kami sa Keila
  rationale: Ang pandiwang הלך kasama ng pangalan ng lugar ay nagpapahiwatig ng pagpunta sa destinasyon.
- source_word: אֶל מַעַרְכוֹת פְּלִשְׁתִּים
  choice: upang harapin ang mga hanay ng mga Filisteo
  rationale: Ang מַעַרְכוֹת ay tumutukoy sa mga hanay o ayos-pandigma. Ginagawang malinaw ng “harapin” ang ipinahihiwatig na pakikipagsagupa nang hindi ito pinalalawak tungo sa pangkalahatang “mga hukbo.”
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga tauhan” sa halip na literal na “mga lalaki,” at “mga hanay” upang mapanatili ang larawang militar. Ang idyomang וְאַף כִּי ay isinalin sa likas na Filipino bilang “lalo na kaya kung,” kaya hindi na kailangan ang talababa.
