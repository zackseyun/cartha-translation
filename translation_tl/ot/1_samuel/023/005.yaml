base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/005.yaml
  text: So David and his men went to Keilah and fought against the Philistines[a], and he drove off their livestock and struck them with a great blow[c][b]. So David saved the inhabitants of Keilah.
translation:
  language: tl
  text: At pumunta si David at ang kanyang mga tauhan sa Keila at nakipaglaban sa mga Filisteo. Itinaboy niya ang kanilang mga alagang hayop[a] at pinasapitan niya sila ng matinding dagok.[b] Sa gayon, iniligtas ni David ang mga naninirahan sa Keila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itinaboy niya ang kanilang mga kawan.” Malawak ang saklaw ng salitang Hebreo at tumutukoy sa mga alagang hayop.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hinampas niya sila ng isang malaking dagok”; maaari ring isalin na “pinasapitan niya sila ng matinding pagkatalo” o “nagbigay siya ng malaking pagpaslang sa kanila.”
    reason: lexical_alternative
  - marker: c
    text: O “sinagip” o “pinalaya” ni David ang mga naninirahan sa Keila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד וַאֲנָשָׁיו קְעִילָה
  choice: pumunta si David at ang kanyang mga tauhan sa Keila
  rationale: Ang הלך sa sunod-sunod na salaysay ay payak na kilos na ‘pumunta.’ Sa kontekstong militar, ang אֲנָשָׁיו ay tumutukoy sa mga tauhan o kasamahan ni David, hindi sa kanyang bayan sa pangkalahatan.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: nakipaglaban sa mga Filisteo
  rationale: Ipinahihiwatig ng לחם na may ב ang pakikipaglaban laban sa isang kalaban. Sa Filipino, malinaw sa konteksto na ang mga Filisteo ang kanilang nilabanan.
- source_word: וַיִּנְהַג אֶת־מִקְנֵיהֶם
  choice: itinaboy niya palayo ang kanilang mga alagang hayop
  rationale: Ang נהג ay maaaring mangahulugang magtaboy o mag-akay, lalo na ng mga hayop; ang מִקְנֶה ay malawak na katawagan sa mga alagang hayop. Pinananatili ng ‘itinaboy palayo’ ang larawan ng pagkuha at pagpapaalis sa mga ito.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: lubha niya silang tinalo
  rationale: Ang idyomang נכה kasama ng מַכָּה ay tumutukoy sa pagpapasapit ng matinding dagok o pagkatalo. Natural sa makabagong Filipino ang ‘lubha niya silang tinalo’ at hindi nito ipinapalagay na lahat ay pinatay.
- source_word: וַיֹּשַׁע
  choice: iniligtas
  rationale: Sa kontekstong militar, ang ישע ay pagliligtas o pagsagip mula sa panganib. Ang ‘iniligtas’ ang pinakadirekta at madaling maunawaang katumbas.
- source_word: יֹשְׁבֵי קְעִילָה
  choice: mga naninirahan sa Keila
  rationale: Literal itong tumutukoy sa mga taong naninirahan sa Keila; natural at malinaw ang pariralang Filipino.
