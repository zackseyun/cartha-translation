revisions:
- from: Kaya pumunta si David at ang kanyang mga tauhan sa Keila at nakipaglaban sa mga Filisteo. Itinaboy niya palayo ang kanilang mga alagang hayop[a] at lubha niya silang tinalo.[b] Sa gayon, iniligtas ni David ang mga naninirahan sa Keila.[c]
  to: At pumunta si David at ang kanyang mga tauhan sa Keila at nakipaglaban sa mga Filisteo. Itinaboy niya ang kanilang mga alagang hayop[a] at pinasapitan niya sila ng matinding dagok.[b] Sa gayon, iniligtas ni David ang mga naninirahan sa Keila.[c]
  rationale: Pinalitan ang pang-ugnay na nagpapahiwatig ng sanhi ng payak na pang-ugnay na mas malapit sa Hebreong salaysay. Pinalitan din ang “lubha niya silang tinalo” ng “pinasapitan niya sila ng matinding dagok” upang mapanatili ang larawan at tindi ng מַכָּה גְדוֹלָה nang hindi ipinagpapalagay na lahat o marami ay napatay. Inayos ang kaugnay na talababa upang tumugma sa binagong salin.
