translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mga tauhan’ para sa pangkat ng mga mandirigma ni David at ang ‘mga alagang hayop’ upang mapanatili ang malawak na kahulugan ng מִקְנֶה. Isinalin nang natural ang idyomang militar nang hindi labis na tinutukoy ang bilang ng mga namatay.
