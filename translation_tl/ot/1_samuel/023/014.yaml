  text: וַ/יֵּ֨שֶׁב דָּוִ֤ד בַּ/מִּדְבָּר֙ בַּ/מְּצָד֔וֹת וַ/יֵּ֥שֶׁב בָּ/הָ֖ר בְּ/מִדְבַּר זִ֑יף וַ/יְבַקְשֵׁ֤/הוּ שָׁאוּל֙ כָּל הַ/יָּמִ֔ים וְ/לֹֽא נְתָנ֥/וֹ אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/014.yaml
  text: David stayed in the wilderness strongholds[a], and he stayed in the hill country in the wilderness of Ziph. Saul sought him all the days, but God did not give him into his hand.
translation:
  language: tl
  text: Nanatili si David sa mga kuta[a] sa ilang, at nanatili siya sa kabundukan sa ilang ng Zif. Lagi siyang hinahanap ni Saul, ngunit hindi siya ibinigay ng Diyos sa kamay ni Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tanggulan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: nanatili
  rationale: Ipinahahayag ng ישׁב ang pananatili o pagtira; ang “nanatili” ay natural sa salaysay at angkop sa kalagayan ni David bilang takas.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay karaniwang tumutukoy sa di-nilinang at ilang na lupain, hindi kinakailangang mabuhanging disyerto.
- source_word: בַּמְּצָדוֹת
  choice: sa mga kuta
  rationale: Ang מְצָדוֹת ay mga lugar na matibay at madaling ipagtanggol; pinananatili ng “mga kuta” ang defensive na diwa.
- source_word: בָּהָר
  choice: sa kabundukan
  rationale: Maaaring mangahulugan ang הַר ng bundok o bulubunduking rehiyon; sa heograpikong kontekstong ito, natural ang “kabundukan.”
- source_word: בְּמִדְבַּר זִיף
  choice: sa ilang ng Zif
  rationale: Tinutukoy ng parirala ang ilang na rehiyong kaugnay ng Zif.
- source_word: וַיְבַקְשֵׁהוּ
  choice: hinahanap siya
  rationale: Sa konteksto, ang בקשׁ ay masidhing paghahanap o pagtugis; malinaw at natural ang “hinahanap siya.”
- source_word: כָּל הַיָּמִים
  choice: lagi
  rationale: Ang literal na “lahat ng mga araw” ay idyomatikong nagpapahayag ng patuloy na pagkilos; ang “lagi” ay maikli at natural sa modernong Filipino.
- source_word: וְלֹא נְתָנוֹ
  choice: hindi siya ibinigay
  rationale: Pinananatili nito ang pandiwang נתן at ang kasunod na Hebreong idyomang “sa kamay,” sa halip na agad itong ipaliwanag bilang “ipinaubaya.”
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan, isahan ang gamit dito at malinaw na tumutukoy sa Diyos ng Israel.
- source_word: בְּיָדוֹ
  choice: sa kamay nito
  rationale: Pinananatili ang Hebreong idyoma para sa pagpapailalim sa kapangyarihan ng isang tao; ang “nito” ay tumutukoy kay Saul at umiiwas sa kalituhan sa kasarian ng panghalip.
theological_decisions:
- issue: Pagkilos ng Diyos sa pag-iingat kay David
  choice: hindi siya ibinigay ng Diyos sa kamay ni Saul
  alternative: hindi siya ipinaubaya ng Diyos kay Saul
  rationale: Tuwirang iniuugnay ng teksto sa Diyos ang hindi pagkakahuli ni David, habang pinananatili ang matalinghagang idyoma ng orihinal nang hindi pinalalawak ang teolohikong pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ilang” para sa מִדְבָּר at “kabundukan” para sa rehiyonal na diwa ng הַר. Pinanatili ang idyomang “sa kamay” upang hindi mawala ang anyo at teolohikong diin ng Hebreo.
