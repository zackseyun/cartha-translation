  to: Nanatili si David sa mga kuta[a] sa ilang, at nanatili siya sa kabundukan sa ilang ng Zif. Lagi siyang hinahanap ni Saul, ngunit hindi siya ibinigay ng Diyos sa kamay ni Saul.
