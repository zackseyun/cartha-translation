revisions:
- from: Pagkatapos, bumangon si David kasama ang kaniyang mga tauhan, na humigit-kumulang animnaraang lalaki. Umalis sila sa Keila at nagpalipat-lipat saanman sila makapunta.[a] Nang ibalita kay Saul na nakatakas si David mula sa Keila, hindi na siya tumuloy sa paghayo.[b]
  to: Pagkatapos, bumangon si David kasama ang kaniyang mga tauhan, na humigit-kumulang animnaraang lalaki. Umalis sila sa Keila at nagpalipat-lipat saanman sila makapunta.[a] Nang ibalita kay Saul na nakatakas si David mula sa Keila, tumigil siya sa paghayo.[b]
  rationale: Pinalitan ang huling sugnay ng mas tuwirang katumbas ng Hebreong “tumigil [siya] sa paglabas/paghayo,” nang hindi tahasang isinasama sa pangunahing teksto ang layuning pagtugis. Inayos ang talababa b para sa malinaw na sanggunian at upang mapanatili ang “nakatakas.” Ang talababa a ay pinanatiling alternatibong mas malapit sa inuulit na pandiwa nang hindi binabago ang pangunahing salin.
