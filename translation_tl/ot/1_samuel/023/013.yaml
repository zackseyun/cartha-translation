base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/013.yaml
  text: Then David arose with his men[a], about six hundred men, and they went out from Keilah and went wherever they could go. And it was told to Saul that David had escaped from Keilah[b], so he stopped going out.
translation:
  language: tl
  text: Pagkatapos, bumangon si David kasama ang kaniyang mga tauhan, na humigit-kumulang animnaraang lalaki. Umalis sila sa Keila at nagpalipat-lipat saanman sila makapunta.[a] Nang ibalita kay Saul na nakatakas si David mula sa Keila, tumigil siya sa paghayo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “naglakad-lakad sila saanman sila makalakad.” Binibigyang-diin ng idyomang Hebreo ang patuloy na paglipat-lipat sa iba’t ibang lugar.
    reason: lexical_alternative
  - marker: b
    text: Malamang na ang “tumigil siya sa paghayo” ay nangangahulugang tumigil si Saul sa paglabas upang tugisin si David nang mabalitaang nakatakas na si David mula sa Keila.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: bumangon
  rationale: Pinananatili nito ang karaniwang diwa ng קום bilang pagbangon upang kumilos, nang hindi agad ipinapakahulugang pag-alis.
- source_word: וַאֲנָשָׁיו
  choice: kasama ang kaniyang mga tauhan
  rationale: Sa konteksto, ang אֲנָשָׁיו ay ang pangkat ng mga lalaking kasama ni David; natural sa Filipino ang “mga tauhan” para sa kaniyang pangkat.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: humigit-kumulang animnaraang lalaki
  rationale: Ang כְּ bago ang bilang ay nagpapahiwatig ng pagtatantiya; ang “lalaki” ay angkop sa pangkat na militar sa konteksto.
- source_word: וַיֵּצְאוּ מִקְּעִלָה
  choice: umalis sila sa Keila
  rationale: Natural na Filipino ito para sa literal na paglabas mula sa isang lugar.
- source_word: וַיִּתְהַלְּכוּ בַּאֲשֶׁר יִתְהַלָּכוּ
  choice: nagpalipat-lipat saanman sila makapunta
  rationale: Ipinahahayag ng anyong Hitpael at ng inuulit na pandiwa ang tuloy-tuloy na pagkilos sa iba’t ibang lugar; iniiwasan ng “nagpalipat-lipat” ang labis na pahiwatig ng walang layuning paggala.
- source_word: וּלְשָׁאוּל הֻגַּד
  choice: ibinalita kay Saul
  rationale: Natural na impersonal-passive na katumbas ito ng Hophal ng נגד, nang hindi tinutukoy kung sino ang nagbalita.
- source_word: כִּי נִמְלַט דָּוִד מִקְּעִילָה
  choice: na nakatakas si David mula sa Keila
  rationale: Ang “nakatakas” ay malinaw na katumbas ng נמלט at angkop sa konteksto ng pagtugis.
- source_word: וַיֶּחְדַּל לָצֵאת
  choice: hindi na siya tumuloy sa paghayo
  rationale: Pinananatili nito ang pangunahing diwa ng pagtigil sa paglabas o paghayo nang hindi tahasang idinaragdag sa pangunahing teksto ang layunin ng paglalakbay.
