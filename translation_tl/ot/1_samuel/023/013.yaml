translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaniyang” at “humigit-kumulang” para sa dignidad at linaw; pinanatili sa pangunahing teksto ang bahagyang kalabuan ng huling pariralang Hebreo, at ipinaliwanag lamang sa talababa ang malamang na kahulugan nito.
