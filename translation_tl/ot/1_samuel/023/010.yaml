id: 1SA.23.10
reference: 1 Samuel 23:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שָׁמֹ֤עַ שָׁמַע֙ עַבְדְּ/ךָ֔ כִּֽי מְבַקֵּ֥שׁ שָׁא֖וּל לָ/ב֣וֹא אֶל קְעִילָ֑ה לְ/שַׁחֵ֥ת לָ/עִ֖יר בַּ/עֲבוּרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/010.yaml
  text: Then David said[a], “O Yahweh, God of Israel, your servant has surely heard that Saul is seeking to come to Keilah to destroy the city because of me.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni David, “O Yahweh[a], Diyos ng Israel, tiyak na nabalitaan ng iyong lingkod na binabalak ni Saul na pumunta sa Keila upang wasakin ang lungsod dahil sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; tradisyonal na isinasalin na “ang PANGINOON.”'
    reason: Ipinababatid ang anyong Hebreo at ang tradisyonal na alternatibong salin ng banal na pangalan.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Ang waw-consecutive ay nagsusulong sa salaysay; natural na ipinahahayag ng “Pagkatapos ay” ang pagkakasunod-sunod ng pangyayari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang banal na pangalang YHWH sa Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Diyos ng Israel
  rationale: Natural at tumpak na salin ng pariralang construct sa Hebreo.
- source_word: שָׁמֹעַ שָׁמַע
  choice: tiyak na nabalitaan
  rationale: Ipinahahayag ng infinitive absolute kasama ng finite verb ang matinding katiyakan. Sa konteksto, mas natural sa Filipino ang “nabalitaan” kaysa “narinig” para sa impormasyong natanggap ni David.
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Magalang na pagtukoy ni David sa sarili habang nakikipag-usap sa Diyos; pinananatili ang ikatlong panauhang anyo ng Hebreo.
- source_word: מְבַקֵּשׁ
  choice: binabalak
  rationale: Ipinahahayag ng participle ang kasalukuyang hangarin o pagtatangka ni Saul. Natural sa Filipino ang “binabalak” nang hindi sinasabing tiyak nang mangyayari ito.
- source_word: לָבוֹא אֶל קְעִילָה
  choice: pumunta sa Keila
  rationale: Bagaman literal na maaaring “pumarito,” ang “pumunta” ang natural na Filipino ayon sa pananaw ng nagsasalaysay.
- source_word: לְשַׁחֵת
  choice: upang wasakin
  rationale: Malinaw na ipinahahayag ang layunin at ang mapanirang diwa ng pandiwa sa kontekstong militar.
- source_word: לָעִיר
  choice: ang lungsod
  rationale: Tumutukoy sa Keila bilang tiyak na pamayanang urban; pinananatili ang pagiging tiyak ng pangngalan.
- source_word: בַּעֲבוּרִי
  choice: dahil sa akin
  rationale: Natural na Filipino para sa sanhi o pagiging dahilan ni David sa bantang pagkawasak.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulong “PANGINOON”; ipinapaliwanag sa talababa ang tradisyonal na salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magalang na pananalita ni David sa Diyos at ang diin ng Hebreong שָׁמֹעַ שָׁמַע nang hindi ginagawang mabigat o di-natural ang pangungusap.
