  text: הֲ/יַסְגִּרֻ֣/נִי בַעֲלֵי֩ קְעִילָ֨ה בְ/יָד֜/וֹ הֲ/יֵרֵ֣ד שָׁא֗וּל כַּֽ/אֲשֶׁר֙ שָׁמַ֣ע עַבְדֶּ֔/ךָ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַגֶּד נָ֖א לְ/עַבְדֶּ֑/ךָ וַ/יֹּ֥אמֶר יְהוָ֖ה יֵרֵֽד־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/011.yaml
  text: Will the men of Keilah hand me over into his hand? Will Saul come down[a], as your servant has heard? O Yahweh, God of Israel, please tell your servant.” And Yahweh said, “He will come down.”
translation:
  language: tl
  text: “Ibibigay ba ako ng mga taga-Keila sa kamay niya[a]? Bababa ba si Saul, ayon sa narinig ng iyong lingkod? O Yahweh, Diyos ng Israel, pakisabi po sa iyong lingkod.” At sinabi ni Yahweh, “Bababa siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa kamay niya” ay idyomang Hebreo na nangangahulugang “sa kapangyarihan ni Saul.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּרֻנִי
  choice: Ibibigay ba ako
  rationale: Ang Hiphil ng סגר ay tumutukoy rito sa pagbibigay o pagsuko ng isang tao sa kapangyarihan ng iba. Natural sa Filipino ang “ibibigay ba ako” kasabay ng idyomang “sa kamay niya.”
- source_word: בַעֲלֵי קְעִילָה
  choice: mga pinuno ng Keila
  rationale: Sa kontekstong pansibiko, ang בַעֲלֵי ay tumutukoy sa mga lalaking may awtoridad o pangunahing mamamayan ng bayan, hindi literal na mga “may-ari.” Mas malinaw sa modernong Filipino ang “mga pinuno.”
- source_word: בְיָדוֹ
  choice: sa kamay niya
  rationale: Pinananatili ang Hebreong idyoma ng pagkakalagay sa kapangyarihan o kontrol ng isang tao. Si Saul ang tinutukoy ng panghalip.
- source_word: יֵרֵד
  choice: bababa ba rito / bababa siya
  rationale: Literal na “bababa.” Idinagdag ang “rito” sa tanong upang natural na ipakita ang paglapit ni Saul sa kinaroroonan ni David; pinanatili ang simpleng “bababa” sa sagot.
- source_word: כַּאֲשֶׁר שָׁמַע עַבְדֶּךָ
  choice: gaya ng narinig ng iyong lingkod
  rationale: Tapat nitong ipinapahayag na ang tanong ni David ay batay sa ulat na kanyang narinig, habang pinananatili ang mapagpakumbabang ikatlong-panauhang pagtukoy sa sarili.
- source_word: עַבְדֶּךָ
  choice: iyong lingkod
  rationale: Sa panalangin, ito ay magalang at mapagpakumbabang pagtukoy ni David sa sarili, hindi pangunahing pagtukoy sa kalagayan ng isang alipin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang tuwirang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: הַגֶּד נָא
  choice: pakisabi po
  rationale: Ipinahahayag ng imperative kasama ang נָא ang isang magalang ngunit marubdob na pakiusap. Natural sa kasalukuyang Filipino ang “pakisabi po.”
- source_word: וַיֹּאמֶר יְהוָה
  choice: At sinabi ni Yahweh
  rationale: Pinananatili ng “At” ang daloy ng salaysay sa Hebreo at malinaw na ipinakikilala ang tugon ng Diyos.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulo.
- issue: Saklaw ng sagot ng Diyos
  choice: “Bababa siya” lamang ang tuwirang sagot sa talatang ito
  alternative: Unawaing sinasagot na rin dito ang tanong kung ibibigay si David ng mga pinuno ng Keila
  rationale: Sa anyo at pagkakasunod ng Hebreong teksto, ang maikling sagot na יֵרֵד ay tahasang tumutugon sa tanong kung bababa si Saul. Hindi dinagdagan ang tugon upang huwag resolbahin nang maaga ang kasunod na tanong at sagot sa talata 12.
translation_notes:
  register: Modernong Filipino na magalang at marangal. Ginamit ang “po” sa pakiusap upang natural na maipakita ang paggalang sa panalangin, at “rito” upang maging malinaw ang direksiyon ng pagbaba ni Saul patungo sa Keila. Inilipat ang talababa sa “sa kamay niya,” ang pariralang aktuwal nitong ipinaliliwanag.
