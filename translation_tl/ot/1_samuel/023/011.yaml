- from: “Ibibigay ba ako ng mga pinuno ng Keila sa kamay niya[a]? Bababa ba rito si Saul, gaya ng narinig ng iyong lingkod? O Yahweh, Diyos ng Israel, pakisabi po sa iyong lingkod.” At sinabi ni Yahweh, “Bababa siya.”
  to: “Ibibigay ba ako ng mga taga-Keila sa kamay niya[a]? Bababa ba si Saul, ayon sa narinig ng iyong lingkod? O Yahweh, Diyos ng Israel, pakisabi po sa iyong lingkod.” At sinabi ni Yahweh, “Bababa siya.”
