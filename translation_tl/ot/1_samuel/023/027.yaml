  text: But a messenger came to Saul, saying, “Hurry and come, for the Philistines have made a raid against the land.”
translation:
  language: tl
  text: Ngunit dumating kay Saul ang isang sugo at nagsabi, “Magmadali ka at umalis, sapagkat sinalakay ng mga Filisteo ang lupain.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאָךְ
  choice: sugo
  rationale: Sa konteksto, tumutukoy ito sa isang taong naghatid ng balita; likas sa Tagalog ang “sugo” at hindi ito nagpapahiwatig na ang tinutukoy ay isang anghel.
- source_word: מַהֲרָה וְלֵכָה
  choice: Magmadali ka at pumarito
  rationale: Pinananatili ang dalawang utos—magmadali at pumunta—habang ipinahihiwatig ng “pumarito” na ipinapatawag si Saul sa lugar na nangangailangan sa kaniya.
- source_word: פָשְׁטוּ
  choice: sinalakay
  rationale: Ang pandiwa ay tumutukoy sa biglaang paglusob o pagsalakay; malinaw at natural ang “sinalakay” sa makabagong Tagalog.
- source_word: עַל הָאָרֶץ
  choice: ang lupain
  rationale: Sa pariralang kasama ng פשט, natural na layon ng pagsalakay ang “lupain”; hindi tinutukoy ng Hebreo rito kung anong partikular na rehiyon o teritoryo.
