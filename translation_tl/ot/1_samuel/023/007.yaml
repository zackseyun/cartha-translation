base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/007.yaml
  text: And it was reported to Saul that David had come to Keilah[a]. So Saul said, “God has delivered him into my hand[b], for he has shut himself in by entering a city with doors and bars.”
translation:
  language: tl
  text: Ibinalita kay Saul na dumating si David sa Keila. Kaya sinabi ni Saul, “Ibinigay siya ng Diyos sa aking kamay[a], sapagkat ikinulong niya ang kanyang sarili nang pumasok siya sa isang lunsod na may tarangkahang magkakambal ang pinto at may halang[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Isinuko siya ng Diyos sa aking kamay.” Ipinakahulugan ni Saul ang kinalalagyan ni David bilang pagkakaloob ng Diyos sa kanyang kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “isang lunsod na may dalawang pinto at halang,” na tumutukoy sa isang nakukutaang lunsod na ang tarangkahan ay may magkatambal na dahon at sinasarhan ng isang pahalang na halang.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: Ibinalita
  rationale: Pinananatili nito ang di-tiyak na tagapagbalita at likas na ipinahahayag sa Filipino na may naghatid ng balita kay Saul.
- source_word: בָא דָוִד קְעִילָה
  choice: dumating si David sa Keila
  rationale: Ang בוא ay nangangahulugang dumating o pumasok; sa ulat tungkol sa patutunguhang Keila, natural ang “dumating … sa.”
- source_word: נִכַּר אֹתוֹ אֱלֹהִים בְּיָדִי
  choice: Ibinigay siya ng Diyos sa aking kamay
  rationale: Ipinapahayag nito ang diwang ipinasa o ibinigay sa kapangyarihan ni Saul, habang pinananatili ang konkretong idyomang “sa aking kamay.”
- source_word: נִסְגַּר
  choice: ikinulong niya ang kanyang sarili
  rationale: Maaaring pasibo o refleksibo ang Niphal; dito, ipinahihiwatig ng paliwanag ni Saul na naipit ni David ang sarili niya sa loob ng napapaderang lunsod.
- source_word: לָבוֹא
  choice: nang pumasok siya
  rationale: 'Ipinapakita ng infinitibo kung paano naipit si David: sa pagpasok niya sa lunsod.'
- source_word: בְּעִיר דְּלָתַיִם וּבְרִיחַ
  choice: sa isang lunsod na may magkabilang pinto ng tarangkahan at isang halang
  rationale: Ang דלתים ay tumutukoy sa magkatambal na dahon ng pintuang-bayan, at ang בריח ay halang na pansara; pinananatili ng salin ang kongkretong larawan ng isang nakukutaang lunsod.
theological_decisions:
- issue: Ang pag-uugnay ni Saul sa kalagayan ni David at sa pagkilos ng Diyos
  choice: 'Tuwirang inilahad bilang sinabi ni Saul: “Ibinigay siya ng Diyos sa aking kamay.”'
  alternative: Lagyan ng paliwanag na “Inakala ni Saul na ibinigay siya ng Diyos sa kanyang kamay.”
  rationale: Tuwirang pananalita ni Saul ang nasa Hebreo. Hindi dapat idagdag ng salin na tama o mali ang kanyang pagpapakahulugan; nananatili ang tensiyong teolohikal at ang mambabasa ang hahatol ayon sa konteksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “lunsod” at “halang” upang malinaw na ilarawan ang nakukutaang lungsod, at pinanatili ang biblikal na idyomang “sa aking kamay.”
