  to: Ibinalita kay Saul na dumating si David sa Keila. Kaya sinabi ni Saul, “Ibinigay siya ng Diyos sa aking kamay[a], sapagkat ikinulong niya ang kanyang sarili nang pumasok siya sa isang lunsod na may tarangkahang magkakambal ang pinto at may halang[b].”
