  source_fidelity: 'Tumpak ang pangunahing daloy: isang ulat kay Saul, ang tuwirang pahayag ni Saul tungkol sa Diyos, ang idyomang “sa aking kamay,” at ang paliwanag na si David ay naipit dahil pumasok siya sa nakukutaang lunsod. Gayunman, ang “magkabilang pinto ng tarangkahan” ay maaaring mangahulugang mga pintong nasa magkaibang panig at hindi malinaw na naihahatid ang Hebreong dual para sa magkaparis na dahon ng isang tarangkahan.'
  naturalness: Ang salin ay karaniwang malinaw at marangal. Mas likas at mas tumpak ang “tarangkahang magkakambal ang pinto at may halang” kaysa “magkabilang pinto ng tarangkahan.”
