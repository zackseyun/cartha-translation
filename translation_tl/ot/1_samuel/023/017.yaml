  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו אַל תִּירָ֗א כִּ֠י לֹ֤א תִֽמְצָאֲ/ךָ֙ יַ֚ד שָׁא֣וּל אָבִ֔/י וְ/אַתָּה֙ תִּמְלֹ֣ךְ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֖י אֶֽהְיֶה לְּ/ךָ֣ לְ/מִשְׁנֶ֑ה וְ/גַם שָׁא֥וּל אָבִ֖/י יֹדֵ֥עַ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/017.yaml
  text: He said to him[a], “Do not be afraid, for the hand of Saul my father will not find you. You will reign over Israel, and I will be second to you[b]. Even Saul my father knows this.”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Huwag kang matakot, sapagkat hindi ka maaabot ng kamay ng aking amang si Saul.[a] Ikaw ang maghahari sa Israel, at ako ang magiging pangalawa sa iyo.[b] Alam din ito ng aking amang si Saul.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hindi ka matatagpuan ng kamay ng aking amang si Saul.” Ang “kamay” ay larawan ng kanyang kapangyarihan o pagkakahawak.
    reason: lexical_alternative
  - marker: b
    text: O, “ako ang magiging pangalawang pinuno sa ilalim mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Huwag kang matakot
  rationale: Natural at karaniwang salin ng negatibong pautos; pinananatili ang tuwirang lakas ng pahayag.
- source_word: לֹא תִמְצָאֲךָ יַד שָׁאוּל אָבִי
  choice: hindi ka maaabot ng kamay ng aking amang si Saul
  rationale: Pinananatili ang konkretong larawang Hebreo na “kamay” bilang kapangyarihan o saklaw, habang ang “maaabot” ay natural sa Filipino at hindi ipinapalagay kung ito ay partikular na pagdakip o pananakit.
- source_word: וְאַתָּה תִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: Ikaw ang maghahari sa Israel
  rationale: Tuwirang ipinapahayag ang pandiwang מלך bilang paghahari at natural na binibigyang-diin sa Filipino ang kausap.
- source_word: וְאָנֹכִי אֶהְיֶה לְּךָ לְמִשְׁנֶה
  choice: at ako ang magiging pangalawa sa iyo
  rationale: Pinananatili ang ideya ng ikalawang ranggo o nakapailalim na katayuan nang hindi nag-aangkat ng makabagong opisyal na titulo.
- source_word: וְגַם שָׁאוּל אָבִי יֹדֵעַ כֵּן
  choice: Alam din ito ng aking amang si Saul
  rationale: Natural na Filipino para sa כֵּן na tumutukoy pabalik sa kabuuan ng sinabi ni Jonatan; hindi dinaragdagan ang nilalaman.
theological_decisions:
- issue: Antas ng pagiging tahasan ng inaasahan ni Jonatan tungkol sa paghahari ni David at sa sarili niyang nakapailalim na papel
  choice: Inilahad bilang tuwirang pag-asang pampolitika at makapangyarihang katiyakan, nang walang idinagdag na wikang tipan o mesiyaniko.
  alternative: Ituring itong tahasang teolohikal na propesiya tungkol sa pagtatalaga ng Diyos.
  rationale: Tiyak na sinasabi ng talata na maghahari ang kausap sa Israel at magiging pangalawa si Jonatan, ngunit hindi tahasang binabanggit ang PANGINOON sa pangungusap na ito. Kaya pinananatili ng salin ang pahayag at tensiyon nito nang walang dagdag na paliwanag na teolohikal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang idyomang “kamay” sa pangunahing teksto, ngunit ginawang natural ang pandiwang “maaabot”; ipinaliwanag sa talababa ang mas literal na anyo. Ginamit ang “aking amang si Saul” upang malinaw at likas na maipahayag ang Hebreong apposition.
