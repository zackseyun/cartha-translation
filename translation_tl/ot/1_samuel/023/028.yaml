  text: So Saul returned from pursuing David and went to meet the Philistines. Therefore that place was called the Rock of Division[a].
translation:
  language: tl
  text: Kaya bumalik si Saul mula sa paghabol kay David at nagpunta upang salubungin ang mga Filisteo. Dahil dito, tinawag ang lugar na iyon na Bato ng Paghihiwalay[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Bato ng mga Paghihiwalay” o “Bato ng Pagkakahiwalay.” Malamang na tumutukoy ang pangalan sa pagkaputol ng paghabol ni Saul kay David at sa pagkakahiwalay nila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: tumigil
  rationale: Sa pariralang may מִרְדֹף, ipinahihiwatig ng שוב na itinigil o tinalikuran ni Saul ang kasalukuyang ginagawa niya; natural sa Filipino ang “tumigil ... sa paghabol.”
- source_word: מִרְדֹף אַחֲרֵי
  choice: sa paghabol kay
  rationale: Ipinapahayag ng מן at infinitive ang pagtigil sa isang gawain, at ang רדף ay angkop na isaling “paghabol” sa kontekstong militar.
- source_word: לִקְרַאת
  choice: humarap sa
  rationale: Maaaring tumukoy ang לקראת sa pagpunta upang salubungin o harapin ang isang tao. Sa konteksto ng banta ng mga Filisteo, malinaw ang “humarap” ngunit hindi nito tahasang dinaragdagan ang Hebreo ng “nakipaglaban.”
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Ito ang karaniwang makabagong katawagan sa Filipino para sa pangkat na ito.
- source_word: עַל כֵּן
  choice: Dahil dito
  rationale: Natural at malinaw na ipinakikilala nito ang dahilan ng ipinangalan sa lugar.
- source_word: קָרְאוּ לַמָּקוֹם הַהוּא
  choice: tinawag ang lugar na iyon
  rationale: Ang di-tiyak na maramihang gumagawa sa Hebreo ay natural na maisalin sa Filipino bilang konstruksiyong walang tahasang gumagawa.
- source_word: סֶלַע
  choice: Bato
  rationale: Tumutukoy ang סלע sa malaking bato o batuhang pormasyon; “Bato” ang tuwiran at angkop na anyo sa pangalan ng lugar.
- source_word: הַמַּחְלְקוֹת
  choice: Paghihiwalay
  rationale: Ang pangngalan ay nagpapahiwatig ng paghahati, paghihiwalay, o paglalayo. Pinananatili ng “Paghihiwalay” ang kaugnayan nito sa pagkaputol ng paghabol ni Saul nang hindi lubusang nilulutas ang tiyak na diwa ng pangalan.
