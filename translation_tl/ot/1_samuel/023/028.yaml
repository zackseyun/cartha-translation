  naturalness: Natural at marangal sa makabagong Filipino ang “bumalik si Saul mula sa paghabol” at “nagpunta upang salubungin.” Ang pasibong “tinawag ang lugar na iyon” ay idiomatiko at angkop.
  terminology: Ang “mga Filisteo” ay karaniwan at wasto. Ang “Bato ng Paghihiwalay” ay ligtas na salin ng hindi ganap na tiyak na pangalan ng lugar; ang mga posibleng ibang pakahulugan ay dapat manatili sa talababa.
