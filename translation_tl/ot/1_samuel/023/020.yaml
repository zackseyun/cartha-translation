translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang magalang na “kayo/inyong” sa pakikipag-usap sa hari. Pinanatili ang madiing pag-uulit at ang idyoma ng “kamay,” na ipinaliwanag sa talababa.
