translation:
  language: tl
  text: Kaya ngayon, O hari, bumaba kayo ayon sa buong nais ninyo—bumaba kayo[a]—at kami ang bahalang ibigay siya sa kamay ng hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Inuulit sa Hebreo ang pandiwang “bumaba” (infinitive construct + pautos) upang magbigay-diin: “bumaba—bumaba kayo.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “sa kamay ng hari” ay nangangahulugang sa kapangyarihan o kontrol ng hari.
    reason: idiom
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Likas na panandang pandiskurso sa Filipino para sa agarang paglipat tungo sa pakiusap; kinakatawan ang pang-ugnay at ang diwa ng “ngayon.”
- source_word: לְכָל אַוַּת נַפְשְׁךָ
  choice: ayon sa lahat ng nais ng inyong kalooban
  rationale: Pinananatili ang saklaw ng כָּל at ang larawan ng panloob na pagnanasa, ngunit gumagamit ng marangal at nauunawaang Filipino. Ang “kalooban” ay mas natural kaysa literal na “kaluluwa” sa idyomang ito.
- source_word: הַמֶּלֶךְ
  choice: O hari
  rationale: Itinuturing ang may artikulong pangngalan bilang tuwirang pagtawag, gaya ng gamit nito sa Hebreo; malinaw at marangal sa Filipino.
- source_word: לָרֶדֶת רֵד
  choice: bumaba kayo … bumaba kayo
  rationale: Pinananatili ang pag-uulit ng infinitive absolute at imperative para sa diin, habang ang “kayo” ay angkop na magalang na pagtawag sa hari.
- source_word: וְלָנוּ
  choice: at kami ang bahala
  rationale: Ipinahahayag ang pananagutan o bahaging inaako ng mga nagsasalita, hindi lamang ang payak na pakinabang sa kanila.
- source_word: הַסְגִּירוֹ
  choice: magbigay sa kanya
  rationale: Sa konteksto, ang Hiphil ng סגר ay paghahatid o pagbibigay ng isang tao sa kapangyarihan ng iba. Ang talab nitong hostile na “ipagkanulo/ibigay” ay nililinaw ng kasunod na idyoma at talababa.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: sa kamay ng hari
  rationale: Pinananatili ang Hebreong idyoma ng paglalagay sa kapangyarihan o kontrol ng hari.
