  yaml_path: translation/ot/1_samuel/023/016.yaml
  text: Then Jonathan son of Saul arose and went to David at Horesh[a], and strengthened his hand in God.
translation:
  language: tl
  text: Noon, tumindig si Jonatan na anak ni Saul at pinuntahan si David sa Horesh. Pinalakas niya ang loob ni David sa Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pinalakas niya ang kamay ni David sa Diyos”; maaari ring isaling, “pinalakas niya ang loob ni David sa Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Ang קום sa ganitong salaysay ay nagpapahiwatig ng pagsisimula ng isang sinasadyang pagkilos. Pinananatili ng “tumindig” ang pagkakasunod-sunod ng salaysay nang hindi labis na nagpapaliwanag.
- source_word: יְהוֹנָתָן בֶּן שָׁאוּל
  choice: si Jonatan na anak ni Saul
  rationale: Tuwirang inililipat ang ugnayang pampamilya at pinananatili ang tensiyon na anak ni Saul ang tumutulong kay David.
- source_word: וַיֵּלֶךְ אֶל
  choice: pinuntahan
  rationale: Likas sa modernong Tagalog ang “pinuntahan” at malinaw na nagpapahiwatig na nagtungo at nakarating si Jonatan kay David.
- source_word: חֹרְשָׁה
  choice: sa Horesh
  rationale: Itinuturing ang חֹרְשָׁה na pangalan ng lugar, hindi karaniwang pangngalang “gubat” o “kakahuyan.”
- source_word: וַיְחַזֵּק אֶת יָדוֹ
  choice: pinalakas niya ang loob nito
  rationale: Ang literal na “pinalakas ang kanyang kamay” ay isang idyomang Hebreo. Ang “pinalakas ang loob” ang natural at malinaw na katumbas sa Tagalog, habang inilalagay sa talababa ang literal na larawan.
- source_word: בֵּאלֹהִים
  choice: sa Diyos
  rationale: Pinananatili ng “sa Diyos” ang malapit na ugnayan sa pang-ukol na ב at ang Diyos bilang batayan o saklaw ng pagpapatatag, nang hindi ito ginagawang tahasang “sa pamamagitan ng Diyos.”
theological_decisions:
- issue: Pagsasalin sa אֱלֹהִים sa kontekstong ito
  choice: Diyos
  alternative: PANGINOON
  rationale: אֱלֹהִים ang nasa tekstong Hebreo, hindi ang pangalang YHWH; kaya hindi ipinapasok ang “PANGINOON.”
- issue: Kahulugan ng בֵּאלֹהִים sa pagpapatatag kay David
  choice: sa Diyos
  alternative: sa pamamagitan ng Diyos
  rationale: Ang “sa Diyos” ay nagpapanatili ng posibleng diwa na ang pagtitiwala o kaugnayan sa Diyos ang batayan ng lakas, samantalang ang “sa pamamagitan ng Diyos” ay mas tahasang nagsasaad ng instrumento o ahensiya kaysa sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “pinalakas ang loob” bilang natural na idyomatikong salin, ngunit pinanatili sa talababa ang literal na larawan ng kamay at ang alternatibong mas malapit sa anyo ng Hebreo.
