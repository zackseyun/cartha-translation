  source_fidelity: Tumpak ang pangunahing pagsasalin ng mga taga-Zif, Saul sa Gibea, pagtatago ni David, mga tanggulan, kakahuyan/Hores, burol ng Hakila, at literal na “kanan” ng Jesimon. Gayunman, ang עִמָּנוּ (“kasama namin/among us”) ay mas tuwirang naihahayag ng “sa aming gitna” kaysa “sa aming lugar,” na naglilipat ng diin sa teritoryo sa halip na presensiya ni David sa gitna ng mga taga-Zif.
