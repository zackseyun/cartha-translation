  text: וַ/יַּעֲל֤וּ זִפִים֙ אֶל שָׁא֔וּל הַ/גִּבְעָ֖תָ/ה לֵ/אמֹ֑ר הֲ/ל֣וֹא דָ֠וִד מִסְתַּתֵּ֨ר עִמָּ֤/נוּ בַ/מְּצָדוֹת֙ בַּ/חֹ֔רְשָׁה בְּ/גִבְעַת֙ הַֽ/חֲכִילָ֔ה אֲשֶׁ֖ר מִ/ימִ֥ין הַ/יְשִׁימֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/019.yaml
  text: Then the Ziphites went up to Saul at Gibeah[a], saying, “Is not David hiding among us in the strongholds in the wooded area, on the hill of Hachilah[b], which is to the right of the Jeshimon?”
translation:
  language: tl
  text: Pagkatapos, pumunta ang mga taga-Zif kay Saul sa Gibea at sinabi, “Hindi ba't nagtatago si David sa aming gitna, sa mga tanggulan sa kakahuyan[a], sa burol ng Hakila, na nasa kanan ng Jesimon[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Hores,” kung ituturing itong pangalan ng lugar sa halip na “sa kakahuyan.”
    reason: alternative_reading
  - marker: b
    text: Sa heograpikong pananalita sa Hebreo, ang “nasa kanan ng Jesimon” ay malamang na nangangahulugang “nasa timog ng Jesimon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: pumunta
  rationale: Ang pandiwa ay literal na may diwang ‘umahon/pumaitaas,’ ngunit sa modernong Tagalog ay mas natural ang ‘pumunta’ para sa paglalakbay patungo kay Saul; hindi mahalaga sa konteksto ang aktuwal na pag-ahon.
- source_word: זִפִים
  choice: mga taga-Zif
  rationale: Ang anyong pangkat-tao ay tumutukoy sa mga naninirahan sa Zif; malinaw at likas sa Tagalog ang ‘mga taga-Zif.’
- source_word: הַגִּבְעָתָה
  choice: sa Gibea
  rationale: Ipinahihiwatig ng directional he ang pagpunta sa Gibea. Sa pangungusap, ang ‘kay Saul sa Gibea’ ay natural na nagpapakitang naroon si Saul.
- source_word: הֲלוֹא
  choice: Hindi ba't
  rationale: Pinananatili nito ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: מִסְתַּתֵּר
  choice: nagtatago
  rationale: Ipinahahayag ng participle ang nagpapatuloy na kusang pagtatago; tuwiran at natural ang ‘nagtatago.’
- source_word: עִמָּנוּ
  choice: sa aming lugar
  rationale: Literal itong ‘kasama namin,’ ngunit sa konteksto ay tumutukoy sa teritoryong kinaroroonan ng mga taga-Zif; iniiwasan ng salin ang maling pahiwatig na kakampi nila si David.
- source_word: בַמְּצָדוֹת
  choice: sa mga tanggulan
  rationale: Tumutukoy ang salita sa matitibay at madaling ipagtanggol na mga lugar; ang ‘mga tanggulan’ ay maikli at angkop sa tagpuan.
- source_word: בַּחֹרְשָׁה
  choice: sa kakahuyan
  rationale: Maaaring karaniwang pangngalang ‘kakahuyan’ o pangalang-pook na Hores. Ginamit sa teksto ang natural na karaniwang pangngalan at inilagay sa talababa ang tunay na alternatibo.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: sa burol ng Hakila
  rationale: Tuwirang inililipat ang topograpikong parirala at pinananatili ang pangalang-pook.
- source_word: אֲשֶׁר מִימִין הַיְשִׁימוֹן
  choice: na nasa kanan ng Jesimon
  rationale: Pinananatili ng pangunahing teksto ang literal na ‘kanan’ sa halip na tahimik na ipakahulugang ‘timog’; ipinaliliwanag sa talababa ang malamang na heograpikong kahulugan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang anyong ‘mga taga-Zif’ para sa katawagang pangkat-tao, at pinanatili sa pangunahing teksto ang literal na direksiyong ‘kanan’ upang huwag alisin ang ambiguwidad ng Hebreo.
