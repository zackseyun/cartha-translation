  to: Pagkatapos, pumunta ang mga taga-Zif kay Saul sa Gibea at sinabi, “Hindi ba't nagtatago si David sa aming gitna, sa mga tanggulan sa kakahuyan[a], sa burol ng Hakila, na nasa kanan ng Jesimon[b]?”
  rationale: Pinalitan lamang ang “sa aming lugar” ng “sa aming gitna” upang mas tapat na maipahayag ang עִמָּנוּ at manatiling natural ang Tagalog. Walang binago sa mga pangalan, topograpiya, o sa maingat na pagpreserba ng literal na direksiyong “kanan.”
