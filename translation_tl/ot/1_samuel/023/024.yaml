base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/024.yaml
  text: They arose and went to Ziph ahead of Saul[a]. Now David and his men were in the wilderness of Maon, in the Arabah[b], to the south of the Jeshimon.
translation:
  language: tl
  text: Tumindig sila at pumunta sa Zif, nauna kay Saul. Samantala, si David at ang kanyang mga tauhan ay nasa ilang ng Maon, sa Araba, sa timog[a] ng Jeshimon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanan ng Jeshimon.” Literal na “kanan” o “kanang panig” ang salitang Hebreo; sa heograpikong gamit, maaari itong tumukoy sa timog.
    reason: lexical_alternative
  - marker: b
    text: Ang “Jeshimon” ay maaari ring unawaing “tiwangwang na lupain” o “ilang,” ngunit malamang na pangalan ito ng isang lugar dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֛וּמוּ וַיֵּלְכ֥וּ
  choice: Tumindig sila at pumunta
  rationale: Pinananatili ang magkasunod na kilos ng קום at הלך sa salaysay, habang nananatiling malinaw at natural sa Filipino.
- source_word: זִ֖יפָ/ה
  choice: sa Zif
  rationale: Ipinahihiwatig ng directional he ang pagpunta patungo sa lugar na Zif.
- source_word: לִ/פְנֵ֣י שָׁא֑וּל
  choice: nauna kay Saul
  rationale: Ang לִפְנֵי rito ay nagpapahayag na nauna sila kay Saul, hindi lamang na nasa harapan niya.
- source_word: וְ/דָוִ֨ד וַ/אֲנָשָׁ֜י/ו
  choice: Samantala, si David at ang kanyang mga tauhan ay nasa
  rationale: Ang sugnay na walang tahasang pandiwa ay naglalarawan sa kinaroroonan ni David at naglilipat ng tagpo; likas sa Filipino ang pagdaragdag ng “ay nasa,” at malinaw na ipinahihiwatig ng “Samantala” ang paglipat.
- source_word: בְּ/מִדְבַּ֤ר מָעוֹן֙
  choice: sa ilang ng Maon
  rationale: Ang מִדְבָּר ay karaniwang tumutukoy sa ilang o lupang hindi matao, hindi kinakailangang mabuhanging disyerto.
- source_word: בָּ/עֲרָבָ֔ה
  choice: sa Araba
  rationale: Sa heograpikong paglalarawan, malamang na pantanging pangalan ng rehiyon ang עֲרָבָה; pinanatili ito bilang Araba.
- source_word: אֶ֖ל יְמִ֥ין הַ/יְשִׁימֽוֹן
  choice: sa timog ng Jeshimon
  rationale: Literal na “sa kanan” ang יְמִין, ngunit sa heograpikong oryentasyong nakaharap sa silangan maaari itong mangahulugang timog. Inilalahad ng pangunahing teksto ang malamang na direksiyon at itinatala sa talababa ang literal na anyo.
- source_word: הַ/יְשִׁימֽוֹן
  choice: Jeshimon
  rationale: Bagaman maaari itong mangahulugang ilang o tiwangwang na lupain, malamang na ginagamit dito bilang pangalang heograpiko.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga pangalang heograpiko bilang Zif, Maon, Araba, at Jeshimon; ginamit ang “mga tauhan” para sa אֲנָשָׁיו sa konteksto ng pangkat ni David.
