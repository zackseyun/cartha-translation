base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/001.yaml
  text: Then they told David[a], saying, “Look, the Philistines are fighting against Keilah, and they are plundering the threshing floors.”
translation:
  language: tl
  text: Pagkatapos, ibinalita nila kay David, “Tingnan mo, nilulusob ng mga Filisteo ang Keila[a] at sinasamsam nila ang mga giikan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakikipaglaban sa Keila” o “nakikipaglaban sa may Keila.” Literal na “sa/nasa” ang pang-ukol sa Hebreo, ngunit sa kontekstong militar ay malamang na nangangahulugang sinasalakay ng mga Filisteo ang lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: Pagkatapos, ibinalita kay David
  rationale: Ang Hiphil wayyiqtol ng נגד ay nagsasaad ng sumunod na pangyayari sa salaysay. Likas sa Filipino ang impersonal na “ibinalita kay David”; hindi nito tinutukoy ang hindi ipinakilalang maramihang tagapagbalita.
- source_word: לֵאמֹר
  choice: tuwirang sipi nang walang hiwalay na “na sinasabi”
  rationale: Karaniwang panandang pambanggit ito sa Hebreo. Sa modernong Filipino, sapat at mas natural ang kuwit na sinusundan ng tuwirang sipi.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Tinatawag ng particle ang pansin ni David sa apurahang balita. Pinananatili ng “Tingnan mo” ang diwa ng biglaang pagtukoy nang hindi gumagamit ng makalumang pananalita.
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang modernong anyong Filipino para sa kilalang pangkat ng mga tao.
- source_word: נִלְחָמִים בִּקְעִילָה
  choice: nilulusob ... ang Keila
  rationale: Ang participle ay naglalarawan ng kasalukuyang kilos-militar. Bagaman literal na “nakikipaglaban sa/nasa Keila,” ipinahihiwatig ng konteksto na ang lungsod ang sinasalakay; natural na ipinahahayag ito ng “nilulusob.” Pinananatili sa talababa ang tunay na kalabuan ng pang-ukol.
- source_word: וְהֵמָּה שֹׁסִים
  choice: at sinasamsam nila
  rationale: Ang hiwalay na panghalip ay nagbibigay-diin sa gumagawa. Ang “nila” ay malinaw na tumutukoy sa mga Filisteo, at ang “sinasamsam” ay angkop sa pandarambong sa panahon ng digmaan.
- source_word: אֶת הַגֳּרָנוֹת
  choice: ang mga giikan
  rationale: Ang גֹּרֶן ay lugar o lapag na pinaggigiikan. Ang “giikan” ay maikli, kongkreto, at nauunawaan sa Filipino, habang hindi pinapalitan ang lugar ng ipinapalagay na butil na kinukuha.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “ibinalita” sa halip na mas mabigat na “sinabi nila,” at “giikan” para sa kongkretong terminong pang-agrikultura. Inilagay ang marker [a] kaagad pagkatapos ng “Keila,” kung saan umiiral ang kalabuan.
