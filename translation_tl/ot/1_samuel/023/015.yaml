base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/015.yaml
  text: David saw that Saul had come out to seek his life[a], while David was in the wilderness of Ziph at Horesh.
translation:
  language: tl
  text: Nakita ni David na lumabas si Saul upang patayin siya. Samantala, nasa ilang ng Zif si David, sa Horesh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa kagubatan” o “sa lugar na may kakahuyan.” Maaaring unawain ang salitang Hebreo bilang pangngalang pambalana, ngunit malamang na pangalan ito ng pook dito: Horesh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nalaman
  rationale: Bagaman literal na “nakita,” ang ראה rito ay tumutukoy sa pagkaalam o pagkabatid sa kilos ni Saul. Mas natural sa makabagong Tagalog ang “nalaman” sa ganitong konteksto.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala ng כִּי ang nilalaman ng nalaman ni David; ang “na” ang likas na katumbas nito sa Tagalog.
- source_word: יָצָא
  choice: humayo
  rationale: Ang יצא ay “lumabas/humayo.” Ipinahihiwatig dito na kumilos si Saul mula sa kinaroroonan niya upang tugisin si David; pinananatili ng “humayo” ang kilos nang hindi nagdaragdag ng tiyak na pinanggalingang lugar.
- source_word: לְבַקֵּשׁ אֶת נַפְשׁוֹ
  choice: upang tugisin at patayin siya
  rationale: Literal itong “hanapin ang kanyang buhay,” isang Hebreong idyoma para sa paghahanap sa isang tao na may layuning patayin siya. Hindi malinaw at hindi natural sa Tagalog ang literal na anyo, kaya inilalahad ang puwersa ng idyoma.
- source_word: וְדָוִד
  choice: Samantala, ... si David
  rationale: Ang waw ay nagbubukas ng sugnay na nagbibigay ng kasabay na kalagayan at lokasyon ni David. Nililinaw ito ng “Samantala” sa natural na salaysay sa Tagalog.
- source_word: בְּמִדְבַּר זִיף
  choice: nasa ilang ng Zif
  rationale: Ang מִדְבָּר ay tuyong ilang o kaparangan, hindi kinakailangang buhanginang disyerto. Ang “ilang” ay maikli at angkop sa heograpiya at estilong biblikal.
- source_word: בַּחֹרְשָׁה
  choice: sa Horesh
  rationale: Bagaman maaaring mangahulugang “kagubatan” o “lugar na may kakahuyan” ang חֹרְשָׁה, malamang na pangalan ito ng pook sa kontekstong ito. Pinanatili ang pangalang Horesh at inilagay sa talababa ang tunay na leksikal na alternatibo.
theological_decisions:
- issue: Kahulugan ng Hebreong idyomang “hanapin ang buhay”
  choice: upang tugisin at patayin siya
  alternative: upang hanapin ang kanyang buhay
  rationale: Ang literal na alternatibo ay malabo at hindi likas sa Tagalog. Ang piniling salin ay naghahatid ng kinikilalang nakamamatay na layon ng idyoma nang hindi nagdadagdag ng teolohikal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Zif” at “Horesh” bilang mga pangalang pantangi. Inilipat ang talababa sa “Horesh,” sapagkat ang alternatibong leksikal ay tumutukoy sa בַּחֹרְשָׁה, hindi sa pariralang tungkol sa buhay ni David.
