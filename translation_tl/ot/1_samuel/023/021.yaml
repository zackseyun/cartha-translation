  text: וַ/יֹּ֣אמֶר שָׁא֔וּל בְּרוּכִ֥ים אַתֶּ֖ם לַֽ/יהוָ֑ה כִּ֥י חֲמַלְתֶּ֖ם עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/021.yaml
  text: Saul said[a], “May you be blessed by Yahweh[b], because you have had compassion on me.”
translation:
  language: tl
  text: Sinabi ni Saul, “Pagpalain nawa kayo ni Yahweh, sapagkat nahabag kayo sa akin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang panandang pasalaysay ang wayyiqtol ng אמר; natural sa modernong Tagalog na hindi na tahasang isama ang panimulang pangatnig.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: בְּרוּכִים אַתֶּם
  choice: Pagpalain nawa kayo
  rationale: Ipinahahayag ng parirala ang isang pagpapala, hindi lamang paglalarawan ng kalagayan; natural at marangal sa Tagalog ang optatibong anyong ito.
- source_word: לַיהוָה
  choice: ni Yahweh
  rationale: Sa pormula ng pagpapala, ipinakikilala ng ל ang pinagmumulan o tagaganap ng pagpapala. Pinananatili ang personal na banal na pangalang Yahweh.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng ipinahayag na pagpapala at angkop sa marangal ngunit malinaw na register.
- source_word: חֲמַלְתֶּם
  choice: nahabag kayo
  rationale: Ang חמל ay tumutukoy sa pagkahabag o awa at maaari ring magpahiwatig ng hindi pananakit o pagtipid sa buhay. Sa kontekstong ito, pinakamalinaw ang relasyonal na diwang 'nahabag.'
- source_word: עָלָי
  choice: sa akin
  rationale: Kasunod ng חמל, natural na katumbas sa Tagalog ang konstruksiyong 'nahabag sa akin.'
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Puwersa ng pormulang בְּרוּכִים אַתֶּם
  choice: Pagpalain nawa kayo
  alternative: Pinagpala kayo
  rationale: Pinananatili ang posibilidad na ito ay isang pahayag ng pagpapala, hindi lamang isang deklarasyon tungkol sa kasalukuyang kalagayan nila.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang 'sapagkat' upang mapanatili ang bahagyang pormal na himig ng salaysay, at 'nahabag' upang ihatid ang awa o malasakit nang hindi labis na nililinaw bilang aktuwal na pagligtas sa buhay.
