translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “buong bayan” sa halip na gawing “buong hukbo” upang hindi magdagdag ng espesipikong kahulugang wala sa Hebreo; ang talababa ay nagpapanatili sa alternatibong pagbasa ng pandiwa.
