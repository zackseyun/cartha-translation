  text: So Saul summoned all the people to war[a], to go down to Keilah, to besiege David and his men.
translation:
  language: tl
  text: At tinawag ni Saul ang buong bayan para sa digmaan, upang bumaba sa Keila at kubkubin si David at ang kanyang mga tauhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinipon ang buong bayan para sa labanan.” Ang pandiwang Hebreo ay maaaring literal na mangahulugang “ipinarinig,” ngunit sa kontekstong ito ay malamang na tumutukoy sa pagtawag at pagtitipon sa mga tao para sa pagkilos militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: tinawag
  rationale: Sa Hiphil, literal itong maaaring mangahulugang “ipinarinig,” ngunit sa kontekstong militar ay tumutukoy sa pagtawag o pagtitipon ng mga tao para sa pagkilos. Natural sa Filipino ang “tinawag” nang hindi labis na nililinaw ang paraan ng mobilisasyon.
- source_word: כָּל הָעָם
  choice: ang buong bayan
  rationale: Pinananatili nito ang literal na lawak ng “lahat ng bayan/mamamayan” at hindi ito tahasang ginagawang “hukbo,” bagaman nililinaw ng kasunod na parirala ang kontekstong militar.
- source_word: לַמִּלְחָמָה
  choice: upang makipagdigma
  rationale: Ipinahahayag ng parirala ang layunin ng pagtawag. Ang “makipagdigma” ay natural at sapat na malawak para sa gawaing militar.
- source_word: לָרֶדֶת
  choice: bumaba
  rationale: Tuwirang katumbas ito ng ירד at karaniwang gamit sa salaysay para sa pagpunta sa mas mababang lugar.
- source_word: קְעִילָה
  choice: Keila
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar na Keilah.
- source_word: לָצוּר
  choice: kubkubin
  rationale: Ang pandiwa ay tumutukoy sa pagkubkob o pagsasara sa target sa kontekstong militar. Maikli at natural ang “kubkubin.”
- source_word: אֶל דָּוִד וְאֶל אֲנָשָׁיו
  choice: si David at ang kanyang mga tauhan
  rationale: Sa konstruksyong kasama ng צור, ipinakikilala ng אֶל ang target ng pagkubkob. Ang “mga tauhan” ay hindi labis na nagtatakda na sila ay pormal na mga sundalo.
