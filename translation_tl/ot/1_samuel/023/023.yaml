translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maramihang “ninyo/kayo” upang ipakita ang mga pautos na plural, at iniwasan ang arkaiko o denominasyonal na pananalita.
