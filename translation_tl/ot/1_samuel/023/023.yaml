base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/023.yaml
  text: See and find out from all the hiding places where he hides there, then return to me with certainty, and I will go with you. And if he is in the land, I will search him out among all the clans of Judah.
translation:
  language: tl
  text: Siyasatin ninyo at alamin ang lahat ng taguang pinagtataguan niya roon. Pagkatapos, bumalik kayo sa akin taglay ang tiyak na impormasyon, at sasama ako sa inyo. Kung nasa lupain siya, hahanapin ko siya sa lahat ng angkan ng Juda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa lahat ng libo ng Juda,” na malamang ay tumutukoy sa mga pangkat ng angkan o pamilya sa Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאוּ וּדְעוּ
  choice: Tingnan ninyo at alaming mabuti
  rationale: 'Pinananatili ang dalawang pautos: masusing pagtingin at pagtiyak sa impormasyon. Ang “alaming mabuti” ay likas sa modernong Tagalog at angkop sa konteksto ng pagsisiyasat.'
- source_word: מִכֹּל הַמַּחֲבֹאִים
  choice: ang lahat ng taguan
  rationale: Ang מַחֲבֹא ay lugar na pinagtataguan. Hindi natural sa Tagalog na tahasang panatilihin ang מִן bilang “mula sa” sa konstruksyong ito; naipahihiwatig ng pandiwang pagsisiyasat na susuriin ang buong saklaw ng mga taguan.
- source_word: אֲשֶׁר יִתְחַבֵּא שָׁם
  choice: pinagtataguan niya roon
  rationale: Ang “pinagtataguan” ay nagpapahayag ng reflexive na diwa ng Hitpael, at pinananatili ng “roon” ang ekspresong שָׁם nang hindi nagiging labis na pilit.
- source_word: וְשַׁבְתֶּם אֵלַי אֶל נָכוֹן
  choice: Pagkatapos, bumalik kayo sa akin na may tiyak na impormasyon
  rationale: Ipinakikita ng “Pagkatapos” ang pagkakasunod-sunod ng mga utos. Ang נָכוֹן ay tumutukoy rito sa matibay o natiyak na kaalaman; nililinaw ng “impormasyon” ang ipinahihiwatig ng konteksto.
- source_word: וְהָלַכְתִּי אִתְּכֶם
  choice: at sasama ako sa inyo
  rationale: Mas natural sa Tagalog ang “sasama” kaysa literal na “pupunta akong kasama ninyo,” habang tumpak na pinananatili ang pangako ni Saul.
- source_word: וְהָיָה אִם יֶשְׁנוֹ בָאָרֶץ
  choice: Kung narito siya sa lupain
  rationale: Ang kondisyon ang pangunahing diwa ng Hebreo. Ang “narito” ay angkop sa deiktikong konteksto, samantalang ang “sa lupain” ay pinananatiling malawak at hindi tinutukoy nang higit sa pinagmulan.
- source_word: וְחִפַּשְׂתִּי אֹתוֹ
  choice: hahanapin ko siya
  rationale: Ang חפשׂ ay masusing paghahanap. Sa Tagalog, sapat at natural ang “hahanapin,” at ang lawak ng kasunod na parirala ang nagpapahiwatig ng puspusang paghahanap.
- source_word: בְּכֹל אַלְפֵי יְהוּדָה
  choice: sa lahat ng angkan ng Juda
  rationale: Bagaman literal na “mga libo,” ang אַלְפֵי ay maaaring tumukoy sa mga yunit ng angkan o sambahayan. “Angkan” ang pinakamalinaw na salin sa kontekstong panlipunan; inilalahad sa talababa ang literal na anyo.
