  text: וַ/יִּכְרְת֧וּ שְׁנֵי/הֶ֛ם בְּרִ֖ית לִ/פְנֵ֣י יְהוָ֑ה וַ/יֵּ֤שֶׁב דָּוִד֙ בַּ/חֹ֔רְשָׁה וִ/יהוֹנָתָ֖ן הָלַ֥ךְ לְ/בֵיתֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/018.yaml
  text: And the two of them made a covenant before Yahweh[a]. Then David remained in the wooded area[b], and Jonathan went to his house.
translation:
  language: tl
  text: At silang dalawa ay nakipagtipan sa harap ni Yahweh.[a] Pagkatapos, nanatili si David sa kakahuyan,[b] at umuwi si Jonatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pumutol ng tipan.”
    reason: lexical_alternative
  - marker: b
    text: O “sa Horesh”; maaaring unawain ang Hebreo bilang pangalan ng lugar o bilang “kakahuyan/gubat.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתוּ ... בְּרִית
  choice: nakipagtipan
  rationale: Natural na salin sa Tagalog ng idyomang Hebreo na literal na ‘pumutol ng tipan’; malinaw nitong ipinapahayag ang kapwa at taimtim na pagtatatag ng tipan.
- source_word: שְׁנֵיהֶם
  choice: silang dalawa
  rationale: Tahasang pinananatili ang diwang dalawahan at ang magkasamang pagkilos nina David at Jonatan.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Malapit sa Hebreo at natural sa Tagalog; pinananatili ang diwa ng taimtim na pagkilos sa presensya ng Diyos.
- source_word: וַיֵּשֶׁב
  choice: nanatili
  rationale: Sa konteksto, tumutukoy ito sa patuloy na pananatili sa isang lugar, hindi sa literal na pag-upo.
- source_word: בַּחֹרְשָׁה
  choice: sa kakahuyan
  rationale: Inihahatid ang posibleng karaniwang-kahulugan na ‘kakahuyan’ o ‘gubat,’ habang inilalagay sa talababa ang tunay na posibilidad na pangalan itong Horesh.
- source_word: הָלַךְ לְבֵיתוֹ
  choice: umuwi
  rationale: Natural at malinaw na Tagalog para sa ‘pumunta sa kaniyang bahay,’ nang hindi binabago ang kahulugan.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang natatanging pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kalikasan ng kasunduan nina David at Jonatan
  choice: tipan
  alternative: kasunduan
  rationale: Ang ‘tipan’ ay mas tumpak na nagpapanatili sa taimtim at relasyonal na lakas ng בְּרִית; ang ‘kasunduan’ ay maaaring maging napakahina o pangkaraniwan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang ‘nakipagtipan’ at ‘umuwi’ bilang mga karaniwang pahayag, habang pinanatili sa mga talababa ang idyomang Hebreo at ang kalabuan ng בַּחֹרְשָׁה.
