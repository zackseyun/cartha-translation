translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mga tauhan niya” para sa אֲנָשָׁיו sa kontekstong militar. Inilagay ang bawat pananda ng talababa sa mismong teksto at iniugnay sa pariralang nililinaw nito.
