revisions:
- from: Naglalakad si Saul sa isang panig ng bundok[a], at si David at ang mga tauhan niya ay nasa kabilang panig. Nagmamadali si David na lumayo kay Saul, samantalang papalapit na sa magkabilang panig[b] si Saul at ang mga tauhan niya upang dakpin sila[c].
  to: Naglalakad si Saul sa isang panig ng bundok[a], at si David at ang mga tauhan niya ay nasa kabilang panig ng bundok. Nagmamadali si David na lumayo kay Saul, samantalang papalapit nang papalapit[b] si Saul at ang mga tauhan niya kay David at sa mga tauhan niya upang dakpin sila[c].
  rationale: Pinalitan ang maling “papalapit na sa magkabilang panig” ng “papalapit nang papalapit ... kay David at sa mga tauhan niya,” na natural na naghahayag ng pagsisikip ng paglapit at layuning manghuli nang hindi inaangking ganap na silang nakapalibot. Inilipat ang pananda b sa katumbas ng עֹטְרִים at inayos ang talababa nito upang malinaw na alternatibo ang ‘kinukubkob.’
