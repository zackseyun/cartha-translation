    issue: Maling pagsasalin ng עֹטְרִים bilang “papalapit na sa magkabilang panig.”
    rationale: Ang parirala ay maaaring mangahulugang lumalapit ang Saul at mga tauhan niya sa parehong panig, samantalang inilalarawan ng Hebreo ang pagkubkob o pagsisikip ng kanilang paglapit sa kinaroroonan ni David at ng kanyang mga tauhan.
  - severity: medium
    issue: Hindi wastong nakakabit ang talababa b sa “magkabilang panig.”
    rationale: Ang talababa ay alternatibo para sa עֹטְרִים (‘kumukubkob’/‘pinalilibutan’), kaya dapat ikabit sa pariralang nagsasalin ng pandiwang iyon, hindi sa paglalarawan ng magkabilang panig.
