  source_fidelity: 'Ang unang dalawang sugnay at ang pagmamadali ni David na lumayo kay Saul ay tapat sa Hebreo. Ngunit ang “papalapit na sa magkabilang panig” ay hindi wastong naghahayag ng עֹטְרִים: hindi sila lumalapit sa dalawang panig, kundi kumukubkob o sumisikip ang paglapit kay David at sa kanyang mga tauhan upang mahuli sila.'
  naturalness: Natural ang karamihan ng salin, ngunit ang “papalapit na sa magkabilang panig” ay hindi idiomatiko at lumilikha ng maling ugnayang panglunan. Ang “papalapit nang papalapit kay David at sa kanyang mga tauhan” ay malinaw at natural sa modernong Filipino.
  terminology: Ang “mga tauhan,” “lumayo,” at “dakpin” ay angkop sa konteksto. Ang “dakpin” ay mahusay na katumbas ng layuning hulihin o samsamin ang grupo.
  issues:
