base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/026.yaml
  text: Saul was going on one side of the mountain[a], and David and his men were on the other side of the mountain. David was hurrying to go away from Saul[c][b], while Saul and his men were closing in on David and his men to capture them.
translation:
  language: tl
  text: Naglalakad si Saul sa isang panig ng bundok[a], at si David at ang mga tauhan niya ay nasa kabilang panig ng bundok. Nagmamadali si David na lumayo kay Saul, samantalang papalapit nang papalapit[b] si Saul at ang mga tauhan niya kay David at sa mga tauhan niya upang dakpin sila[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na, “Naglalakad si Saul sa panig ng bundok mula sa panig na ito, at si David at ang mga tauhan niya sa panig ng bundok mula sa panig na ito.” Ipinahahayag ng salin ang nilalayong paghahambing bilang “isang panig” at “kabilang panig.”
    reason: lexical_alternative
  - marker: b
    text: O “kinukubkob si David at ang mga tauhan niya.”
    reason: alternative_reading
  - marker: c
    text: O “hulihin sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Naglalakad
  rationale: Ipinahihiwatig ng anyong pandiwa ang nagpapatuloy na kilos ni Saul kasabay ng pagkilos ng dalawang pangkat sa magkabilang panig ng bundok.
- source_word: מִצַּד הָהָר מִזֶּה ... מִצַּד הָהָר מִזֶּה
  choice: sa isang panig ng bundok ... nasa kabilang panig
  rationale: Literal na inuulit ng Hebreo ang deiktikong 'sa panig na ito,' ngunit malinaw na magkatapat na panig ang tinutukoy; natural itong naipahahayag sa Tagalog bilang 'isang panig' at 'kabilang panig.'
- source_word: נֶחְפָּז
  choice: Nagmamadali
  rationale: Pinananatili nito ang diwa ng agarang pagkilos nang hindi ipinapalagay na natakot o nataranta si David.
- source_word: לָלֶכֶת מִפְּנֵי שָׁאוּל
  choice: na lumayo kay Saul
  rationale: Malapit ito sa literal na 'umalis mula sa harap ni Saul' at hindi pinatitindi ang pandiwa bilang tahasang 'tumakas.'
- source_word: עֹטְרִים
  choice: papalapit na sa magkabilang panig
  rationale: Ipinapakita nito ang taktikal na pagkilos upang mapalibutan at mahuli sina David, habang ang salin sa talababa ay nagpapanatili sa mas tuwirang alternatibong 'pinalilibutan.'
- source_word: לְתָפְשָׂם
  choice: upang dakpin sila
  rationale: Ang 'dakpin' ay natural sa konteksto ng armadong pagtugis at malinaw na nagpapahayag ng layuning hulihin sila.
