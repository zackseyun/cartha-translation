  naturalness: Malinaw at moderno ang pangungusap, ngunit mas idiomatiko ang “patungo kay David sa Keila” kaysa “papunta kay David sa Keila.” Ang “dala ang efod” ay likas at pinananatili ang diwang “nasa kanyang kamay.”
