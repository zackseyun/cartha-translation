  text: וַ/יְהִ֗י בִּ֠/בְרֹחַ אֶבְיָתָ֧ר בֶּן אֲחִימֶ֛לֶךְ אֶל דָּוִ֖ד קְעִילָ֑ה אֵפ֖וֹד יָרַ֥ד בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/006.yaml
  text: When Abiathar son of Ahimelech fled to David at Keilah[a], he came down with an ephod in his hand.
translation:
  language: tl
  text: Nang tumakas si Abiatar na anak ni Ahimelec patungo kay David sa Keila, bumaba siyang dala ang efod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring: “bumaba ang efod na dala niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּבְרֹחַ
  choice: Nang tumakas
  rationale: Ang ב na may infinitive construct ay nagsasaad ng kasabay na pangyayaring temporal. Likas sa modernong Tagalog ang “Nang tumakas”; hindi na nilagyan ng hiwalay na panimulang panandang diskurso ang וַיְהִי.
- source_word: אֶבְיָתָר בֶּן אֲחִימֶלֶךְ
  choice: si Abiatar na anak ni Ahimelec
  rationale: Ginamit ang karaniwang anyong Filipino ng mga pangalang biblikal at tuwirang pinanatili ang patronimiko.
- source_word: אֶל דָּוִד קְעִילָה
  choice: papunta kay David sa Keila
  rationale: Ang אֶל ay nagsasaad ng paglapit kay David, at ang Keila ay natural na inuunawang lokasyon ni David. Pinananatili ng ayos na ito ang kahulugan nang hindi ipinapalagay na ang Keila mismo ang tahasang layon ng אֶל.
- source_word: אֵפוֹד
  choice: efod
  rationale: Isinalin sa baybay-Filipino ang natatanging katawagan sa sagradong kagamitang panpari sa halip na paliitin ang kahulugan nito bilang isang tiyak na uri lamang ng kasuotan.
- source_word: יָרַד
  choice: bumaba
  rationale: Tuwirang pinananatili ang kahulugang direksiyonal ng pandiwang ירד, bagaman hindi tinutukoy ng talata ang pinagmulan o dahilan ng pagbaba.
- source_word: בְּיָדוֹ
  choice: may dalang
  rationale: Ang literal na “nasa kanyang kamay” ay likas na ipinahahayag sa Tagalog bilang pagdadala o paghawak; hindi nito kinakailangang igiit na literal na hawak lamang sa palad ang bagay.
theological_decisions:
- issue: Likas na katangian ng אֵפוֹד sa konteksto
  choice: Panatilihin ang katawagang “efod” nang walang dagdag na pagpapakahulugan.
  alternative: kasuotang panpari; sagradong epektong panpari
  rationale: Hindi nililinaw ng talata ang eksaktong anyo o gamit ng bagay. Ang transliterasyon ay nagpapanatili sa historikal at panrelihiyong katiyakan ng termino nang hindi nagdaragdag ng isang makitid na doktrinal na paliwanag.
- issue: Simuno ng יָרַד sa di-karaniwang ayos ng Hebreo
  choice: 'Unawain si Abiatar bilang simuno: “bumaba siyang may dalang efod.”'
  alternative: 'Unawain ang efod bilang simuno: “bumaba ang isang efod na nasa kamay niya.”'
  rationale: Mas natural sa daloy ng salaysay na ang tumakas na si Abiatar ang bumaba at nagdala ng efod, ngunit maaaring ipahintulot ng ayos ng mga salita sa Hebreo ang mas literal na alternatibo; kaya inilalahad ito sa talababa sa halip na burahin ang kalabuan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “may dalang” bilang likas na katumbas ng konkretong Hebreong “nasa kanyang kamay,” habang pinanatili ang “bumaba” at “efod” upang hindi mawala ang direksiyon at natatanging katawagang panrelihiyon.
