base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/022.yaml
  text: Please go and make further preparations[a], and know and see his place where his foot is, who has seen him there; for I am told[c][b], ‘He is very cunning.’
translation:
  language: tl
  text: Humayo kayo at maghanda pa kayo. Alamin at tingnan ninyo ang kanyang lugar—kung saan siya naroroon[a]—at kung sino ang nakakita sa kanya roon. Sapagkat sinabi sa akin[b], “Napakatuso niya.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “kung saan naroon ang kanyang paa,” isang idyoma para sa kanyang kinaroroonan o mga pinupuntahan.
    reason: lexical_alternative
  - marker: b
    text: O, “sapagkat sinabi niya sa akin.” Panlalaking isahan ang pandiwa sa Hebreo, ngunit hindi tahasang tinutukoy kung sino ang nagsabi.
    reason: alternative_reading
  - marker: c
    text: Gumagamit ang Hebreo ng magkaugnay na pang-uri at pandiwa mula sa iisang ugat—na malapit na maisasalin na “tuso, siya ay kumikilos nang tuso”—upang magbigay-diin.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ נָא הָכִינוּ עוֹד
  choice: Humayo kayo at lalo pa kayong maghanda
  rationale: Ang הָכִינוּ ay utos na maghanda o mag-ayusang mabuti, at ang עוֹד ay nagpapahiwatig ng karagdagan o pagpapatuloy. Ang “lalo pa kayong maghanda” ay natural na Filipino at angkop sa utos na paigtingin ang pagmamanman.
- source_word: וּדְעוּ וּרְאוּ
  choice: Alamin at tingnan ninyong mabuti
  rationale: Pinanatili ang dalawang magkaugnay na utos upang maipahayag ang pinagsama-samang diin sa masusing pag-alam at pagmamasid.
- source_word: מְקוֹמוֹ
  choice: ang lugar niya
  rationale: Pinananatili nito ang konkretong pangngalang מָקוֹם at ang hulaping panghalip na panlalaking isahan, sa halip na gawing pangkalahatang “ang lugar.”
- source_word: אֲשֶׁר תִּהְיֶה רַגְלוֹ
  choice: kung saan siya nagpupunta
  rationale: Literal itong tumutukoy sa lugar kung saan naroon ang kanyang paa, ngunit idyoma ito para sa kanyang kinaroroonan o mga kilos. Ang salin ay malinaw sa modernong Filipino, habang inilalahad sa talababa ang literal na larawan.
- source_word: מִי רָאָהוּ שָׁם
  choice: kung sino ang nakakita sa kanya roon
  rationale: Ipinananatili ang pagtukoy sa taong aktuwal na nakakita sa kanya sa lugar na iyon.
- source_word: כִּי אָמַר אֵלַי
  choice: Sapagkat sinabi sa akin
  rationale: Hindi tahasang pinangalanan sa Hebreo ang simuno ng pandiwang panlalaking isahan. Ang impersonal na anyong Filipino ay hindi sapilitang nagpapakilala kung sino ang nagsabi; nililinaw sa talababa ang mas literal na posibilidad.
- source_word: עָרוֹם יַעְרִם הוּא
  choice: Napakatuso niya
  rationale: Ang magkaugnay na pang-uri at pandiwa mula sa iisang ugat ay nagbibigay ng matinding diin. Hindi likas ulitin ito nang literal sa Filipino, kaya ipinahayag ang diin sa “napakatuso.”
theological_decisions:
- issue: Hindi tiyak na simuno ng אָמַר sa pariralang כִּי אָמַר אֵלַי
  choice: sinabi sa akin
  alternative: sinabi niya sa akin
  rationale: Iniiwasan ng impersonal na anyo ang pagtukoy nang walang katiyakan kung sino ang nagsalita, samantalang kinikilala sa talababa na panlalaking isahan ang anyo ng pandiwa sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “humayo” bilang dignified ngunit karaniwang biblikal na utos; ang natitirang pangungusap ay nasa natural na kasalukuyang pananalita. Pinanatili ang “ang lugar niya” upang katawanin ang hulaping panghalip sa Hebreo, ngunit ipinaliwanag nang idyomatiko ang parirala tungkol sa paa.
