  verdict: revise
  source_fidelity: Ang salin ay wastong naghahatid ng mga utos na maghanda, magsiyasat, tukuyin ang lugar ni David, alamin kung sino ang nakakita sa kanya, at ang ulat na siya ay napakatuso. Gayunman, ang “kung saan siya nagpupunta” ay masyadong tumutukoy sa mga pinupuntahan o galaw niya at maaaring hindi maisama ang pangunahing diwa ng kanyang kinaroroonan sa idyomang “kung saan naroon ang kanyang paa.”
  naturalness: Natural at malinaw ang Filipino, ngunit mas maayos na iugnay ang idyoma sa “kung saan siya naroroon,” na mas angkop sa konteksto ng pagtunton sa isang nagtatago. Ang “maghanda pa kayo” ay mas tuwirang katumbas ng utos na maghanda nang higit pa.
  terminology: Ang “napakatuso” ay angkop para sa mariing, mapaghinalang paglalarawan. Ang “kanyang lugar” ay pinananatili ang panghalip na panlalaking isahan ng Hebreo. Nilinaw ang talababa tungkol sa cognate construction upang hindi nito maipakitang eksaktong literal ang isang di-likas na pariralang Filipino.
