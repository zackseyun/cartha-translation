- from: Humayo kayo at lalo pa kayong maghanda. Alamin at tingnan ninyong mabuti ang lugar niya—kung saan siya nagpupunta[a]—at kung sino ang nakakita sa kanya roon. Sapagkat sinabi sa akin[b], “Napakatuso niya.”[c]
  to: Humayo kayo at maghanda pa kayo. Alamin at tingnan ninyo ang kanyang lugar—kung saan siya naroroon[a]—at kung sino ang nakakita sa kanya roon. Sapagkat sinabi sa akin[b], “Napakatuso niya.”[c]
  rationale: Pinalitan ang pariralang tumutukoy sa pagpunta ni David ng “kung saan siya naroroon” upang maipahayag ang idyomang Hebreo nang hindi ito nililimitahan sa mga destinasyon niya. Inayos din ang paliwanag sa cognate construction. Pinanatili ang hindi tiyak na simuno ng “sinabi sa akin,” ang panlalaking panghalip sa “kanyang lugar,” at ang diin ng “napakatuso.”
