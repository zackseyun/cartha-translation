  naturalness: Makabago at malinaw ang karamihan ng pananalita. Mas likas at mas tuwirang salaysay ang “May mga nagsabi kay David” kaysa “May nagsabi nito kay David.”
  terminology: Ang “ilang ng Maon,” “hinabol,” at mga pangalan na Saul, David, at Maon ay angkop. Ang pangunahing teksto ay dapat gumamit ng mas neutral na “bato”; ang talababa ang nararapat maglahad ng mga posibleng heograpikong pakahulugan nang hindi ipinagpapalagay na ito ay kanlungan o muog.
