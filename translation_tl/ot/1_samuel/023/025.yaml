base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/025.yaml
  text: So Saul and his men went to seek him. And they told David[a], so he went down to the rock and stayed in the wilderness of Maon. When Saul heard, he pursued David in the wilderness of Maon.
translation:
  language: tl
  text: Kaya pumunta si Saul at ang kanyang mga tauhan upang hanapin si David. May mga nagsabi kay David, kaya bumaba siya sa bato[a] at nanatili sa ilang ng Maon. Nang mabalitaan ito ni Saul, hinabol niya si David sa ilang ng Maon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “batuhan,” “malaking batong nakausli,” o “bangin.” Malamang na tumutukoy ang Hebreo sa isang kilalang mabatong anyong-lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַקֵּשׁ
  choice: upang hanapin si David
  rationale: Ipinahahayag ng pawatas ang layunin. Idinagdag ang tahasang layon na “si David” mula sa konteksto upang maging likas at malinaw sa Tagalog.
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: May nagsabi nito kay David
  rationale: Aktibong maramihan ngunit hindi tinukoy ang gumagawa sa Hebreo. Ang impersonal na “may nagsabi” ay likas sa Tagalog at hindi nagpapakilala ng tiyak na mga tagapagbalita.
- source_word: וַיֵּרֶד
  choice: bumaba siya
  rationale: Pinananatili ang diwang pababang pagkilos; si David ang paksa ayon sa pinakamalapit na konteksto.
- source_word: הַסֶּלַע
  choice: ang malaking bato
  rationale: Ang סֶלַע ay bato, batuhan, o matarik na malaking tipak/bangin. Ang “malaking bato” ay malinaw sa karaniwang mambabasa at hindi labis na nagpapasiya sa eksaktong anyong heograpiko.
- source_word: וַיֵּשֶׁב
  choice: nanatili
  rationale: Sa salaysay, tumutukoy ito sa pananatili sa isang lugar, hindi kinakailangang permanenteng paninirahan.
- source_word: בְּמִדְבַּר מָעוֹן / מִדְבַּר מָעוֹן
  choice: sa ilang ng Maon
  rationale: Ang מִדְבָּר ay karaniwang tuyot at di-tinitirhang lupain, hindi kinakailangang mabuhanging disyerto. Ang “ilang” ay maikli at tradisyonal ngunit nauunawaan pa rin sa modernong Filipino.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: hinabol niya
  rationale: Likas na katumbas sa Tagalog ng idyomang Hebreo na nangangahulugang tumugis o humabol sa isang tao.
- source_word: וַיֵּלֶךְ שָׁאוּל וַאֲנָשָׁיו
  choice: Kaya umalis si Saul at ang kanyang mga tauhan
  rationale: Ang “kaya” ay nag-uugnay sa bunga ng naunang pangyayari. Ang “umalis” ay likas na salaysay na katumbas ng pagpunta nila upang maghanap.
- source_word: וַיִּשְׁמַע שָׁאוּל
  choice: Nang mabalitaan iyon ni Saul
  rationale: Ang literal na “marinig” ay idyomatikong tumutukoy rito sa pagtanggap ng balita. Pinananatili ng “iyon” ang hindi tahasang nilalaman ng nabalitaan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga tauhan” para sa mga lalaking kasama ni Saul at “ilang” para sa wilderness. Iniwasan ang sobrang literal na ayos na magiging asiwa sa Tagalog, habang pinanatili ang pagkakasunod-sunod at heograpikong larawan ng Hebreo.
