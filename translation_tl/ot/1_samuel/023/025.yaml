revisions:
- from: Kaya umalis si Saul at ang kanyang mga tauhan upang hanapin si David. May nagsabi nito kay David, kaya bumaba siya sa malaking bato[a] at nanatili sa ilang ng Maon. Nang mabalitaan iyon ni Saul, hinabol niya si David sa ilang ng Maon.
  to: Kaya pumunta si Saul at ang kanyang mga tauhan upang hanapin si David. May mga nagsabi kay David, kaya bumaba siya sa bato[a] at nanatili sa ilang ng Maon. Nang mabalitaan ito ni Saul, hinabol niya si David sa ilang ng Maon.
  rationale: Pinalitan ang malabong “May nagsabi nito” upang mas maipakita ang di-tiyak na maramihang tagapagbalita sa Hebreo. Ginawang “bato” ang pangunahing salin ng סֶּלַע upang iwasan ang hindi tahasang ideya ng sukat, at inayos ang talababa upang mapanatili ang mga posibleng kahulugan nang walang labis na interpretasyon. Ginamit ang “pumunta” para sa וַיֵּלֶךְ, na mas tuwirang katumbas ng pagkilos na “went” kaysa “umalis.”
