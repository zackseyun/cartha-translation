base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/012.yaml
  text: Then David said[a], “Will the men of Keilah hand me and my men over into Saul’s hand?” And Yahweh said[c][b], “They will hand you over.”
translation:
  language: tl
  text: Sinabi ni David, “Isusuko[a] ba ako at ang mga tauhan ko ng mga taga-Keila sa kamay ni Saul[b]?” Sinabi ni Yahweh, “Isusuko ka[c] nila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ibibigay” o “ipapasakamay.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sa kamay ni Saul” ay idyomang Hebreo na nangangahulugang sa kapangyarihan o kontrol ni Saul.
    reason: lexical_alternative
  - marker: c
    text: Isahan ang “ka” sa Hebreo. Si David ang tuwirang kinakausap bilang pinuno, habang ipinahihiwatig ng naunang tanong ang kaniyang mga tauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַסְגִּרוּ / יַסְגִּירוּ
  choice: isusuko
  rationale: Ang Hiphil ng סגר sa kontekstong ito ay tumutukoy sa pagbibigay ng isang tao sa kapangyarihan ng iba. Likas sa makabagong Tagalog ang “isusuko,” at malinaw nitong ipinahihiwatig ang pagpapasakamay sa kaaway.
- source_word: בַּעֲלֵי קְעִילָה
  choice: mga taga-Keila
  rationale: Bagaman maaaring literal na tumukoy ang בַּעֲלֵי sa mga may-ari o pinuno, sa kontekstong pambayan ay tinutukoy nito ang mga mamamayan o kalalakihan ng Keila. Ang “mga taga-Keila” ang pinakanatural at hindi labis na nagpapasiya kung mga pinuno lamang o mas malawak na pangkat ang tinutukoy.
- source_word: אֹתִי וְאֶת־אֲנָשַׁי
  choice: ako at ang mga tauhan ko
  rationale: Pinananatili ng “ako at ang mga tauhan ko” ang pagkakasunod at lawak ng Hebreo. Ang “mga tauhan” ay natural na tawag sa mga lalaking kasama at sumusunod kay David nang hindi sila labis na tinutukoy bilang mga kawal lamang.
- source_word: בְּיַד שָׁאוּל
  choice: sa kamay ni Saul
  rationale: Pinananatili nito ang larawang Hebreo ng “kamay,” na sa konteksto ay nangangahulugang mapasailalim sa kapangyarihan o kontrol ni Saul.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: יַסְגִּירוּ
  choice: Isusuko ka nila
  rationale: 'Inuulit nito ang pandiwa sa tanong at pinananatili ang isahang layon ng sagot sa Hebreo: si David ay tuwirang kinakausap, bagaman kasama sa naunang tanong ang kaniyang mga tauhan.'
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Isahang “ka” sa sagot ni Yahweh matapos banggitin ni David ang kaniyang mga tauhan
  choice: Isusuko ka nila
  alternative: Isusuko nila kayo / Isusuko nila kayo ng mga tauhan mo
  rationale: Isahan ang layon sa Hebreo. Pinananatili ng salin ang anyong ito at hindi tahimik na ginagawang maramihan, kaya nananatili ang bahagyang tensiyon sa pagitan ng tanong at sagot.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang topicalized na “Ako ba at ang mga tauhan ko” upang maging natural ang pangungusap habang napapanatili ang diin at pagkakasunod ng mga layon sa Hebreo. Pinanatili rin ang idyomang “sa kamay ni Saul,” na ipinaliwanag sa talababa.
