base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/009.yaml
  text: When David learned that Saul was secretly plotting harm against him[a], he said to Abiathar the priest[b], “Bring the ephod here.”
translation:
  language: tl
  text: Nang malaman ni David na lihim na nagpapakana si Saul ng masama laban sa kanya,[a] sinabi niya kay Abiatar na pari, “Ilapit mo rito ang efod.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lihim na nagbabalak si Saul na ipahamak siya.”
    reason: lexical_alternative
  - marker: b
    text: Ang efod ay isang bagay na pangpari na iniuugnay sa pagsangguni sa Diyos sa kontekstong ito ng salaysay.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּדַע
  choice: Nang malaman
  rationale: Sa daloy ng salaysay, ipinahihiwatig ng ידע na nalaman ni David ang balak sa puntong ito, hindi lamang na dati na niya itong alam.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng nalaman ni David.
- source_word: עָלָיו
  choice: laban sa kanya
  rationale: Dahil sa malinaw na mapanirang layunin sa kasunod na parirala, likas itong tumutukoy sa pagkilos laban kay David.
- source_word: מַחֲרִישׁ
  choice: lihim na nagpapakana
  rationale: Pinananatili nito ang diwa ng patuloy na pagbuo ng masamang balak at ang pahiwatig ng paglilihim.
- source_word: הָרָעָה
  choice: ng masama
  rationale: Likas sa Filipino at pinananatili ang lawak ng רעה, na maaaring tumukoy sa masama o kapahamakang binabalak.
- source_word: אֶל אֶבְיָתָר הַכֹּהֵן
  choice: kay Abiatar na pari
  rationale: Tuwirang kinikilala si Abiatar ayon sa kanyang tungkulin.
- source_word: הַגִּישָׁה
  choice: Ilapit mo rito
  rationale: Tumpak na ipinahahayag ang pautos na anyo at ang diwang dalhin o iharap nang malapit.
- source_word: הָאֵפוֹד
  choice: ang efod
  rationale: Pinananatili ang tiyak na katawagang Hebreo para sa kagamitang o kasuotang pangpari sa halip na gawing pangkalahatan.
theological_decisions:
- issue: Ang uri ng balak ni Saul sa מַחֲרִישׁ הָרָעָה
  choice: lihim na nagpapakana si Saul ng masama laban kay David
  alternative: lihim na nagbabalak si Saul na ipahamak si David
  rationale: Pinananatili ng salin ang pahiwatig ng lihim na pagpapakana at ang sadyang malawak na kahulugan ng רעה, nang hindi labis na nililinaw ang tiyak na anyo ng pinsalang binabalak.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “nagpapakana” upang maipakita ang lihim at mapaminsalang pagbabalak, at pinanatili ang “efod” bilang kinikilalang terminong biblikal.
