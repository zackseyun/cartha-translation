translation:
  language: tl
  text: Pagkatapos, inihagis ni Saul ang sibat patungo kay Jonatan upang tamaan siya. Nalaman ni Jonatan na matibay na ang pasiya ng kanyang ama[a] na patayin si David.
  philosophy: optimal-equivalence
