    text: O, “lubos nang determinado ang kanyang ama,” o “napagpasyahan na ito ng kanyang ama.” Ipinahihiwatig ng idyomang Hebreo na tiyak at ganap na ang pasiya ni Saul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּטֶל
  choice: inihagis
  rationale: Tumutukoy ang pandiwa sa paghahagis; malinaw sa konteksto ang marahas at mapaminsalang kilos ni Saul.
- source_word: הַחֲנִית
  choice: ang sibat
  rationale: Karaniwan at likas na salin ito para sa sandatang tinutukoy, nang hindi ipinapalagay na isa itong partikular na magaan na uri ng panghagis na sibat.
- source_word: עָלָיו
  choice: patungo kay Jonatan
  rationale: Ipinahahayag nito ang mapanlabang direksiyon ng paghagis at nililinaw sa Filipino kung sino ang pinuntirya.
- source_word: לְהַכֹּתוֹ
  choice: upang tamaan siya
  rationale: Pinananatili ang layuning ipinahahayag ng infinitive at ang pangunahing diwa ng paghampas o pagtama, nang hindi dinaragdagan ang teksto ng tahasang layuning patayin si Jonatan.
- source_word: וַיֵּדַע
  choice: nalaman
  rationale: Likas sa salaysay na Filipino at tumpak na naghahatid ng pagkaalam ni Jonatan bunga ng ginawa ni Saul.
- source_word: כָלָה הִיא מֵעִם אָבִיו
  choice: buo na ang pasiya ng kanyang ama
  rationale: Inihahatid nito ang Hebreong idyoma ng isang pasiyang ganap, tiyak, at hindi na uurungan, habang pinananatili ang bahagyang di-karaniwang anyo nito.
- source_word: לְהָמִית אֶת דָּוִד
  choice: na patayin si David
  rationale: Direkta, malinaw, at natural na Filipino para sa sadyang pagkitil sa buhay ni David.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Karaniwang anyo ng pangalan sa Bibliyang Filipino.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Karaniwang anyo ng pangalan sa Bibliyang Filipino.
- source_word: דָּוִד
  choice: David
  rationale: Karaniwang anyo ng pangalan sa Bibliyang Filipino.
