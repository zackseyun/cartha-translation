  text: And Jonathan made David swear again by his love for him[b][a], for he loved him as his own soul.
translation:
  language: tl
  text: Muling pinasumpa ni Jonatan si David dahil sa pagmamahal ni Jonatan kay David[a], sapagkat minahal niya si David gaya ng sarili niyang buhay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Patuloy na pinasumpa ni Jonatan si David dahil sa pagmamahal ni Jonatan kay David,” o “Muling inilagay ni Jonatan si David sa ilalim ng panunumpa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “minahal niya ito sa pag-ibig ng sarili niyang buhay,” isang idyomang nagpapahayag ng napakalalim na personal na pagmamahal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: Muling
  rationale: Kasunod ng pawatas na sanhi, ipinahihiwatig ng יסף ang pag-uulit ng kilos. Likas sa modernong Tagalog ang “muling” at hindi nito inaalis ang posibilidad na ang diwa ay pagpapatuloy.
- source_word: לְהַשְׁבִּיעַ
  choice: pinanumpa
  rationale: Ang Hiphil ng שבע ay nangangahulugang magpasumpa o maglagay sa ilalim ng panunumpa. Tumpak at maikli ang “pinanumpa.”
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: dahil sa pag-ibig niya rito
  rationale: Maaaring tukuyin ng ב ang batayan o dahilan ng muling pagpapasumpa. Pinananatili ng salin ang matinding salitang “pag-ibig” at malinaw na tumutukoy kay David ang “rito.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala rito ng כִּי ang paliwanag sa ginawa ni Jonatan; ang “sapagkat” ay angkop sa marangal na salaysay.
- source_word: אַהֲבַת נַפְשׁוֹ
  choice: gaya ng sarili niyang buhay
  rationale: Ang נֶפֶשׁ ay maaaring mangahulugang kaluluwa, sarili, o buhay. Sa idyomang ito, natural at malinaw sa Tagalog ang “sarili niyang buhay” bilang pahayag ng sukdulang personal na pagmamahal.
- source_word: אֲהֵבוֹ
  choice: minahal niya ito
  rationale: Isinasaad ng pandiwa ang katotohanang nagpapaliwanag sa kilos ni Jonatan. Ang aspektong naganap na “minahal” ay natural sa konteksto ng salaysay.
theological_decisions:
- issue: Ang uri ng pag-ibig ni Jonatan kay David
  choice: Pinanatili ang matinding personal na “pag-ibig” nang hindi ito nilalagyan ng romantiko o seksuwal na pakahulugang hindi hayag sa Hebreo.
  alternative: Tawagin lamang itong “pagkakaibigan,” o gumamit ng salitang tahasang nagpapahiwatig ng romantikong pag-ibig.
  rationale: Malakas at paulit-ulit ang wikang אהב, kaya hindi ito dapat pahinain bilang simpleng pagkakaibigan. Gayunman, hindi rin dapat dagdagan ng salin ang hindi sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Jonatan” at “David” ayon sa karaniwang anyong biblikal; iniwasan ang sobrang literal na “kaluluwa” sa idyoma upang hindi maging alanganin o malabo sa karaniwang mambabasa.
