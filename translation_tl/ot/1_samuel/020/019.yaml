base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/019.yaml
  text: On the third day[a], go down quickly and come to the place where you hid yourself on the day of the deed[b], and remain beside the stone Ezel.
translation:
  language: tl
  text: Sa ikatlong araw[a], bumaba ka nang malayo at pumunta sa lugar na pinagtaguan mo noong araw ng pangyayari[b]. Manatili ka sa tabi ng batong Ezel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain ang Hebreo bilang “kapag ginawa mo ito sa ikatlong pagkakataon” o “sa loob ng tatlong araw,” ngunit malamang na tumutukoy ito sa ikatlong araw ng napagkasunduang plano.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “araw ng gawa”; maaari ring “araw ng usapin” o “araw ng gawain.” Malamang na tumutukoy ito sa naunang napagkasunduang pangyayari o pakay.
    reason: lexical_alternative
  - marker: c
    text: Ang “Ezel” ay malamang na pantanging pangalan o nakapirming katawagan sa bato. Maaaring kaugnay ng salitang Hebreo para sa “pagpunta” o “pag-alis,” ngunit hindi tiyak ang eksaktong kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּשְׁתָּ
  choice: Sa ikatlong araw
  rationale: Ang piel ng שלשׁ ay isang mahirap na idyoma, ngunit sa daloy ng salaysay ay pinakamalamang na tumutukoy sa ikatlong araw ng napagkasunduang plano.
- source_word: תֵּרֵד מְאֹד
  choice: bumaba ka nang husto
  rationale: Pinananatili nito ang direksiyon ng ירד at ang pampalakas na מְאֹד nang hindi tiyak na ginagawang bilis ang maaaring tumukoy sa layo o lawak ng pagbaba.
- source_word: וּבָאתָ אֶל הַמָּקוֹם
  choice: at pumunta sa lugar
  rationale: Bagaman maaaring 'pumaroon' o 'dumating' ang בוא, mas natural sa makabagong Tagalog ang 'pumunta' sa tuwirang tagubilin.
- source_word: אֲשֶׁר נִסְתַּרְתָּ שָּׁם
  choice: na pinagt taguan mo
  rationale: Ipinahahayag nito ang kusang pagkubli ni David sa natural na Tagalog.
- source_word: בְּיוֹם הַמַּעֲשֶׂה
  choice: noong araw ng pangyayari
  rationale: Malawak ang saklaw ng מַעֲשֶׂה—gawa, bagay, o pangyayari. Ang 'pangyayari' ay natural at nananatiling bukás sa tinutukoy na naunang usapin.
- source_word: וְיָשַׁבְתָּ
  choice: Manatili ka
  rationale: Sa konteksto ng paghihintay habang nagtatago, ipinahahayag ng 'manatili' ang gamit ng ישׁב nang mas malinaw kaysa literal na 'umupo'.
- source_word: אֵצֶל הָאֶבֶן הָאָזֶל
  choice: sa tabi ng batong Ezel
  rationale: Malamang na pantanging pangalan o nakapirming katawagan ang הָאָזֶל; dahil hindi tiyak ang kahulugan nito, mas mainam na isatitik bilang Ezel.
