base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/012.yaml
  text: And Jonathan said to David[a], “As Yahweh, the God of Israel, lives, when I sound out my father about this time tomorrow, or the third day, and behold, if it is favorable toward David[c][b], shall I not then send to you and uncover your ear?"
translation:
  language: tl
  text: Sinabi ni Jonatan kay David, “Buhay si Yahweh, ang Diyos ng Israel:[a] kapag sinubok kong alamin ang saloobin ng aking ama sa ganitong oras bukas o sa ikatlong araw,[b] at kung mabuti ang saloobin niya kay David, hindi ba ako magpapadala sa iyo at ipaaalam ko iyon sa iyo?[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eliptikal at mahirap ang pananalitang Hebreo. Ang “Buhay si Yahweh” ay panustos para sa solemne nitong panunumpa; maaari rin itong unawain bilang panawagan kay Yahweh, ang Diyos ng Israel, bilang saksi.
    reason: textual_ambiguity
  - marker: b
    text: 'Siksik ang pariralang Hebreo tungkol sa panahon. Maaari rin itong isalin: “sa ganitong oras bukas, sa ikatlong araw.”'
    reason: alternative_reading
  - marker: c
    text: Sa literal na Hebreo, “ilalantad ko ang iyong tainga,” isang idyomang nangangahulugang magsabi o magbunyag ng isang bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Si Yahweh, ang Diyos ng Israel
  rationale: Pinananatili ang personal na pangalang Yahweh at tuwirang isinasalin ang kasunod na pariralang nasa apposition.
- source_word: כִּי
  choice: ang saksi
  rationale: Ang sugnay ay eliptikal at bahagi ng taimtim na panunumpa. Ang pagbanggit kay Yahweh bilang saksi ay likas sa Filipino at hindi nagdaragdag ng pananalitang “buhay” na wala sa tekstong Hebreo.
- source_word: אֶחְקֹר אֶת אָבִי
  choice: sisiyasatin ko ang aking ama
  rationale: Ipinahihiwatig ng pandiwa ang maingat na pag-alam o pagsubok sa saloobin ni Saul; pinananatili rin ang literal na katawagang “aking ama.”
- source_word: כָּעֵת מָחָר הַשְּׁלִשִׁית
  choice: sa ganitong oras bukas o sa ikatlong araw
  rationale: Inihahayag nang malinaw ang dalawang posibleng pagtukoy sa panahon habang kinikilala sa talababa ang siksik at mahirap na anyo ng Hebreo.
- source_word: טוֹב אֶל דָּוִד
  choice: mabuti ang saloobin niya kay David
  rationale: Sa konteksto, ang “mabuti” ay tumutukoy sa mabuting pakikitungo o disposisyon ng ama ni Jonatan kay David.
- source_word: וְלֹא אָז אֶשְׁלַח אֵלֶיךָ
  choice: hindi ba ako magsusugo sa iyo
  rationale: Pinananatili ang retorikal na tanong ng mahirap na anyong Masoretiko at ang pangakong magpapadala ng balita.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: ipaaalam iyon sa iyo
  rationale: Isinasalin ang kahulugan ng idyomang literal na “ilalantad ko ang iyong tainga” sa natural at malinaw na modernong Filipino, habang itinatala ang larawan sa talababa.
theological_decisions:
- issue: Paglalarawan sa eliptikal na panunumpa na gumagamit sa pangalan ng Diyos
  choice: Si Yahweh, ang Diyos ng Israel, ang saksi
  alternative: Buhay si Yahweh, ang Diyos ng Israel
  rationale: Walang tahasang salitang “buhay” sa tekstong Hebreo ng talata. Ang “ang saksi” ay nagpapalinaw sa puwersa ng panunumpa nang hindi ikinukubli ang pagiging eliptikal nito; nililinaw ito sa talababa.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalan sa pinagmulang teksto sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “saloobin” upang natural na maipahayag ang relasyonal na diwa, at “ipaaalam” para sa idyomang Hebreo. Pinanatili sa mga talababa ang tunay na kalabuan ng panunumpa at ng pagtukoy sa panahon.
