  naturalness: Natural at angkop ang marangal na makabagong Filipino. Mas payak at mas idiomatiko ang “noong araw na iyon” kaysa “nang araw na iyon,” at sapat ang “May nangyari” nang walang dagdag na “lamang.”
  terminology: Ang “hindi siya malinis” ay angkop na malapit na salin ng ritwal na טָהוֹר sa kontekstong ito. Ang talababa ay dapat magsabi ng “hindi malinis ayon sa ritwal,” hindi “malinis ayon sa ritwal,” upang hindi mabago ang kahulugan.
