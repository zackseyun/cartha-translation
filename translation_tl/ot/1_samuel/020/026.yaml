base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/026.yaml
  text: But Saul did not say anything that day[a], for he thought, “Something has happened; he is not clean—surely he is not clean.”
translation:
  language: tl
  text: Ngunit walang sinabi si Saul noong araw na iyon, sapagkat naisip niya, “May nangyari. Hindi siya malinis[a]—tiyak na hindi siya malinis.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi malinis ayon sa ritwal.” Sa konteksto ng handaan, ang Hebreo ay tumutukoy sa ritwal na kalinisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... מְאוּמָה
  choice: walang sinabi
  rationale: Likas na idyomang Filipino para sa hindi pagsasalita o pagbibigay ng anumang komento.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Karaniwang ekspresyong temporal sa Filipino na malinaw na tumutukoy sa araw na pinag-uusapan.
- source_word: כִּי אָמַר
  choice: sapagkat naisip niya
  rationale: Bagaman literal na ‘sinabi,’ ipinahihiwatig ng konteksto ang panloob na pangangatwiran ni Saul.
- source_word: מִקְרֶה הוּא
  choice: May nangyari lamang
  rationale: Ipinahahayag ang isang di-tiyak o nagkataong pangyayari nang hindi idinaragdag ang ‘sa kanya,’ na hindi tahasang nasa Hebreo. Ipinahihiwatig ng ‘lamang’ na itinuring ito ni Saul na isang incidental na pangyayari.
- source_word: בִּלְתִּי טָהוֹר הוּא
  choice: Hindi siya malinis
  rationale: Malapit sa anyo ng Hebreo at pinananatili ang mas malawak na salitang ‘malinis,’ habang nililinaw sa talababa ang ritwal na diwa.
- source_word: כִּי לֹא טָהוֹר
  choice: tiyak na hindi siya malinis
  rationale: Ang pag-uulit ay nagpapalakas sa konklusyon ni Saul; ipinahahayag ng ‘tiyak’ ang mariin at inferensiyal na puwersa.
theological_decisions:
- issue: Kalikasan ng kawalang-kalinisan na ipinahihiwatig ng טָהוֹר
  choice: Ritwal na kawalang-kalinisan kaugnay ng pakikibahagi sa handaan
  alternative: Pangkalahatan o moral na karumihan
  rationale: Sa konteksto ng handaan sa Bagong Buwan at ng paliwanag ni Saul sa pagliban, pinakamalamang na ritwal na kawalang-kalinisan ang tinutukoy. Gayunman, pinananatili sa pangunahing teksto ang mas literal na ‘malinis’ at inilalagay ang paglilinaw sa talababa.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang pag-uulit ng ‘hindi siya malinis’ upang maipakita ang diin ng Hebreo, at iniwasang idagdag ang ‘sa kanya’ pagkatapos ng ‘May nangyari’ dahil hindi ito tahasang nasa pinagmulan.
