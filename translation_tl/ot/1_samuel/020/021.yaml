  naturalness: 'May ilang hindi likas o hindi malinaw na parirala: “nasa gawing ito mo” at “kung paanong buháy si Yahweh.” Ang “buháy si Yahweh” ay mas likas na Tagalog na pormula ng panunumpa kapag ipinakilala ng “saksi ang.”'
  terminology: Ang “binata,” “mga palaso,” at “Yahweh” ay katanggap-tanggap. Pinananatili ng “kapayapaan para sa iyo” ang mahalagang salitang שָׁלוֹם nang hindi ikinukubli ang kontekstuwal na katiyakan ng kaligtasan.
