- from: 'At makinig: ipadadala ko ang binata at sasabihin ko, ‘Humayo ka, hanapin mo ang mga palaso.’ Kung talagang sabihin ko sa binata, ‘Narito, nasa gawing ito mo ang mga palaso[a]; kunin mo ang mga iyon at pumarito ka,’ makaaasa kang ligtas ka at walang panganib—kung paanong buháy si Yahweh.[b]'
  to: At narito, isusugo ko ang binata at sasabihin ko, ‘Humayo ka, hanapin mo ang mga palaso.’ Kung talagang sasabihin ko sa binata, ‘Narito, nasa bahaging ito ang mga palaso, bago ka marating; kunin mo ang mga iyon at pumarito ka,’ may kapayapaan para sa iyo at walang panganib, saksi ang buháy na si Yahweh.[a]
