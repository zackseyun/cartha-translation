  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִנֵּה֙ אֶשְׁלַ֣ח אֶת הַ/נַּ֔עַר לֵ֖ךְ מְצָ֣א אֶת הַ/חִצִּ֑ים אִם אָמֹר֩ אֹמַ֨ר לַ/נַּ֜עַר הִנֵּ֥ה הַ/חִצִּ֣ים מִמְּ/ךָ֣ וָ/הֵ֗נָּה קָחֶ֧/נּוּ וָ/בֹ֛אָ/ה כִּֽי שָׁל֥וֹם לְ/ךָ֛ וְ/אֵ֥ין דָּבָ֖ר חַי יְהוָֽה־־־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/021.yaml
  text: And look[a], I will send the young man, saying, ‘Go, find the arrows.’ If I plainly say to the young man, ‘Behold, the arrows are on this side of you; take them and come,’ then there is peace for you and no danger[b], as Yahweh lives.
translation:
  language: tl
  text: At narito, isusugo ko ang binata at sasabihin ko, ‘Humayo ka, hanapin mo ang mga palaso.’ Kung talagang sasabihin ko sa binata, ‘Narito, nasa bahaging ito ang mga palaso, bago ka marating; kunin mo ang mga iyon at pumarito ka,’ may kapayapaan para sa iyo at walang panganib, saksi ang buháy na si Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “saksi ang buháy na si Yahweh” ay pormula ng panunumpa na nagpapatibay sa katotohanan ng sinabi. Ang Hebreo para sa direksiyon ng mga palaso ay maaari ring isalin na “mas malapit sa akin kaysa sa iyo” o “nasa panig na ito mo ang mga palaso”; ipinahihiwatig nito na hindi lumampas sa binata ang mga palaso.
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At makinig
  rationale: Ginagawang likas sa makabagong Tagalog ang panawag-pansing gamit ng הִנֵּה sa pagsisimula ng susunod na hakbang sa plano, nang hindi gumagamit ng makalumang ‘narito’ bilang pambungad.
- source_word: אֶשְׁלַח אֶת־הַנַּעַר
  choice: ipapadala ko ang binata
  rationale: Maaaring mangahulugan ang נַעַר ng batang lalaki, binata, o utusan. Pinananatili ng ‘binata’ ang pahiwatig sa edad o katayuan nang hindi labis na tinutukoy ang tungkulin niya.
- source_word: לֵךְ מְצָא אֶת־הַחִצִּים
  choice: Humayo ka, hanapin mo ang mga palaso
  rationale: Tuwirang inilalahad ang dalawang utos. Ang ‘humayo’ ay marangal ngunit nauunawaan pa rin, at ang ‘hanapin’ ay malapit sa מָצָא.
- source_word: אִם אָמֹר אֹמַר
  choice: Kung talagang sabihin ko
  rationale: Ipinapahayag ng ‘talagang’ ang diin ng infinitive absolute na kasama ng finite verb, nang hindi nagiging pilit ang Tagalog.
- source_word: הִנֵּה הַחִצִּים מִמְּךָ וָהֵנָּה
  choice: Narito, nasa gawing ito mo ang mga palaso
  rationale: Ipinakikita ng parirala na ang mga palaso ay nahulog sa panig na mas malapit kay Jonatan, hindi sa kabila ng binata. Pinananatili ng salin ang direksiyonal na pahiwatig at nililinaw ito sa talababa.
- source_word: קָחֶנּוּ
  choice: kunin mo ang mga iyon
  rationale: Bagaman anyong isahan ang hulapi sa Hebreo, ang tinutukoy ay ang maramihang ‘mga palaso’; likas sa Tagalog na gawing maramihan ang panghalip.
- source_word: וָבֹאָה
  choice: at pumarito ka
  rationale: Ipinahihiwatig ng directional ending ang paglapit sa nagsasalita. Ang ‘pumarito ka’ ay mas malinaw kaysa simpleng ‘halika’ sa loob ng isinalaysay na tagubilin.
- source_word: כִּי שָׁלוֹם לְךָ
  choice: makaaasa kang ligtas ka
  rationale: Sa konteksto, ang שָׁלוֹם ay tumutukoy sa kaligtasan at maayos na kalagayan ni David. Isinasalin ang praktikal na kahulugan nito sa likas na Tagalog.
- source_word: וְאֵין דָּבָר
  choice: at walang panganib
  rationale: Sa konteksto, ang דָּבָר ay hindi basta ‘bagay’ o ‘usapin’ kundi anumang masamang pangyayari o banta.
- source_word: חַי יְהוָה
  choice: kung paanong buháy si Yahweh
  rationale: Pinananatili ang karaniwang pormula ng panunumpa sa Hebreo at ang pangalan ng Diyos, habang ipinapaliwanag sa talababa ang gamit nito.
theological_decisions:
- issue: Paglalarawan sa שָׁלוֹם לְךָ
  choice: makaaasa kang ligtas ka
  alternative: may kapayapaan para sa iyo
  rationale: Ang senyas ay partikular na nagsasaad na ligtas si David mula sa banta ni Saul. Ang salin ay naghahatid ng kontekstuwal na kahulugan nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang pinananatili ang personal na pangalang nasa tekstong Hebreo.
- issue: Pormula ng panunumpang חַי יְהוָה
  choice: kung paanong buháy si Yahweh
  alternative: buháy si Yahweh
  rationale: Pinananatili ang panunumpa bilang panunumpa sa katotohanan ng pahayag, sa halip na gawing karaniwang pahayag lamang tungkol sa Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang sobrang makalumang pananalita, ngunit pinanatili ang anyo ng tuwirang utos, ang direksiyonal na senyas, at ang Hebreong pormula ng panunumpa.
