base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/006.yaml
  text: If your father surely notices me[a], then say, ‘David earnestly asked leave of me to run to Bethlehem, his city[d][c][b], because the yearly sacrifice is there for the whole family.’
translation:
  language: tl
  text: Kung talagang mapansin ng iyong ama ang pagkawala ko[a], sabihin mo, ‘Masidhing nakiusap sa akin si David na payagan ko siyang magmadaling pumunta[b] sa Betlehem, ang kanyang bayan, sapagkat may taunang hain doon para sa buong angkan[c].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kung talagang mapansin ng iyong ama na wala ako.” Ginamit sa Hebreo ang magkasamang pawatas at pandiwang magkaugnay upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: Literal na “tumakbo patungong Betlehem”; ang diwa ay pumunta roon nang mabilis.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “buong pamilya.” Ang salitang Hebreo ay maaaring tumukoy sa pamilya o sa mas malawak na angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקֹד יִפְקְדֵנִי
  choice: talagang mapansin ... na wala ako
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin. Sa konteksto ng hapag, ang mapapansin ni Saul ay ang pagkawala ni David; malinaw at natural ito sa Tagalog habang pinananatili sa talababa ang alternatibong diwa na ‘hanapin.’
- source_word: אָבִיךָ
  choice: iyong ama
  rationale: Tuwirang katumbas ng construct na may hulaping ikalawang panauhang panlalaki.
- source_word: נִשְׁאֹל נִשְׁאַל
  choice: mahigpit na nakiusap
  rationale: Ang emphatic na infinitive absolute at finite verb ng שאל ay nagpapahiwatig ng masidhi o apurahang pakiusap, hindi kinakailangang paulit-ulit na paghiling.
- source_word: מִמֶּנִּי
  choice: sa akin
  rationale: Likas na Tagalog para sa taong hinihingan ng pahintulot.
- source_word: לָרוּץ
  choice: magmadaling pumunta
  rationale: Literal itong ‘tumakbo,’ ngunit sa konteksto ay tumutukoy sa mabilis o apurahang pagpunta; iniiwasan ng salin ang di-likas na larawan na kailangang literal na tumakbo hanggang Betlehem.
- source_word: בֵּית לֶחֶם עִירוֹ
  choice: Betlehem, ang sarili niyang bayan
  rationale: Ang עִירוֹ ay literal na ‘kanyang lungsod/bayan’; mas likas sa Tagalog ang ‘sarili niyang bayan’ at hindi nito labis na nililinaw bilang lugar ng kapanganakan.
- source_word: זֶבַח הַיָּמִים
  choice: taunang handog
  rationale: Ang parirala ay tumutukoy sa handog na umuulit ayon sa takdang siklo, malamang taun-taon; ‘taunang handog’ ang malinaw at maikli.
- source_word: לְכָל הַמִּשְׁפָּחָה
  choice: para sa buong angkan
  rationale: Maaaring mangahulugan ang מִשְׁפָּחָה ng pamilya o angkan. Ang sama-samang ritwal sa Betlehem ay mas natural na tumutukoy sa mas malawak na angkan.
