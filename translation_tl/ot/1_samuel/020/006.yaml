revisions:
- from: Kung talagang mapansin ng iyong ama na wala ako[a], sabihin mo, ‘Mahigpit na nakiusap sa akin si David na payagan ko siyang magmadaling pumunta sa Betlehem, ang sarili niyang bayan[b], sapagkat naroon ang taunang handog para sa buong angkan[c].’
  to: Kung talagang mapansin ng iyong ama ang pagkawala ko[a], sabihin mo, ‘Masidhing nakiusap sa akin si David na payagan ko siyang magmadaling pumunta[b] sa Betlehem, ang kanyang bayan, sapagkat may taunang hain doon para sa buong angkan[c].’
  rationale: Pinalitan ang mas malawak na “handog” ng “hain,” inalis ang dagdag na diin sa “sarili niyang,” at pinasimple ang talababa upang tumugma ang angkla nito sa pariralang ipinaliliwanag. Pinanatili ang kontekstuwal na diwa ng פקד—pagpansin sa pagkawala ni David—nang hindi ipinipilit ang isang mas makitid na kahulugan.
