translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘iyong’ at ‘sapagkat’ para sa dignidad ng salaysay, ngunit pinanatiling natural ang sintaks. Ang mga diin sa Hebreo ay isinalin sa ‘talagang’ at ‘mahigpit na,’ at ang mahahalagang leksikal na alternatibo ay inilagay sa mga talababa.
