  text: And I will shoot the three arrows to the side of it[c][b][a], as though I were shooting for myself at a target.
translation:
  language: tl
  text: At ako'y magpapana ng tatlong palaso sa isang tabi, na para bang nagsasanay akong tumira sa isang puntirya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'Idyomatiko ang Hebreong parirala; mas literal: “upang magpakawala para sa akin sa isang puntirya.” Ipinahihiwatig nito ang pagkilos na wari’y pagsasanay sa pagpana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: At ... ko
  rationale: Ang pangatnig at hayag na panghalip ay naglilipat ng pansin sa gagawin ni Jonatan. Likas sa Filipino na ipahayag ang unang panauhan sa anyong pandiwa at panghalip na “ko.”
- source_word: שְׁלֹשֶׁת הַחִצִּים
  choice: ang tatlong palaso
  rationale: 'Pinananatili ng “ang” ang katiyakan ng parirala: ito ang tatlong palasong bahagi ng napagkasunduang hudyat.'
- source_word: צִדָּה
  choice: sa tabi nito
  rationale: Maaaring unawain ang anyo bilang “sa tabi nito,” na malamang tumutukoy sa bato o palatandaang binanggit sa konteksto. Inilalahad sa talababa ang posibleng pagbasa na direksiyonal lamang, “patagilid.”
- source_word: אוֹרֶה
  choice: ipapana ko
  rationale: Sa konteksto ng mga palaso, ang Hiphil ng ירה ay nangangahulugang magpapakawala o magpapana. Ang “ipapana” ay tuwiran, likas, at malinaw na tumutukoy sa mga palaso.
- source_word: לְשַׁלַּח לִי
  choice: na para bang nagpapraktis akong tumudla
  rationale: 'Ang parirala ay idyomatiko at inilalarawan ang anyo ng kilos: magkukunwari si Jonatan na nagsasanay lamang ng pagpana. Ang saling ito ay malinaw sa modernong Filipino nang hindi ginagawang tunay na layunin ang pagkukunwari.'
- source_word: לְמַטָּרָה
  choice: sa isang puntirya
  rationale: Ang מַטָּרָה ay isang target o markang pinatutungkulan sa pagpana. Ang “puntirya” ay karaniwan at malinaw sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “palaso,” “ipapana,” at “tumudla” upang mapanatili ang malinaw na larawang pangmamamana. Iningatan sa mga talababa ang ambiguwidad ng צִדָּה at ang kakaibang idyoma ng לְשַׁלַּח לִי לְמַטָּרָה.
