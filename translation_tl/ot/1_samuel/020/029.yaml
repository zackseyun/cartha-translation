base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/029.yaml
  text: He said[a], ‘Please let me go, because we have a family sacrifice in the city, and my brother himself has commanded me. So now, if I have found favor in your eyes[b], please let me escape and see my brothers.’ Therefore he has not come to the king’s table.
translation:
  language: tl
  text: Sinabi niya, “Pakisuyong payagan ninyo akong umalis, sapagkat may paghahain ang aming pamilya sa lungsod, at mismong kapatid kong lalaki ang nag-utos sa akin. Kaya ngayon, kung ako’y nakasumpong ng lingap sa inyong paningin, pakisuyong hayaan ninyo akong makatakas[a] at makita ang mga kapatid kong lalaki[b].” Kaya hindi siya dumalo sa hapag ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “makapuslit.” Ang pandiwang Hebreo ay maaaring mangahulugang tumakas o palihim na makaalis.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid kong lalaki” ay maaaring tumukoy sa mga tunay na kapatid ni David o, sa mas malawak na diwa, sa mga lalaking kamag-anak niya sa angkan.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי נָא
  choice: Pakisuyong payagan ninyo akong umalis
  rationale: Ipinahahayag nito ang magalang na paghingi ng pahintulot na umalis; natural sa modernong Tagalog ang “payagan ... umalis,” at tinutumbasan ng “pakisuyo” ang נָא.
- source_word: זֶבַח מִשְׁפָּחָה
  choice: may paghahain ang aming pamilya
  rationale: Pinananatili ng “paghahain” ang panrelihiyong kahulugan ng זֶבַח, samantalang ipinahahayag ng “aming pamilya” ang kaugnayan ng handog sa sambahayan o angkan nang hindi ito ginagawang karaniwang salu-salo lamang.
- source_word: בָּעִיר
  choice: sa lungsod
  rationale: Tuwirang lokatibong salin ito ng parirala at pinananatili ang katawagang ginamit sa Hebreo.
- source_word: וְהוּא צִוָּה לִי אָחִי
  choice: at mismong kapatid kong lalaki ang nag-utos sa akin
  rationale: Ipinakikita ng “mismo” ang diin ng hiwalay na panghalip na הוּא, at pinananatili ng “nag-utos” ang lakas ng צוה. Nililinaw ng “kapatid kong lalaki” ang panlalaking anyo ng אָחִי.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: kung kalugod-lugod ako sa inyong paningin
  rationale: Natural ngunit marangal na Tagalog ito na pinananatili ang larawang “sa iyong paningin” ng pormulang Hebreo.
- source_word: אִמָּלְטָה נָּא
  choice: pakisuyong hayaan ninyo akong makatakas
  rationale: Pinananatili ng “makatakas” ang pangunahing diwa ng מלט sa halip na pahinain ito tungo sa karaniwang pag-alis; ipinaliliwanag sa talababa ang posibleng diwa ng maingat na pagpuslit.
- source_word: וְאֶרְאֶה אֶת אֶחָי
  choice: at makita ang mga kapatid kong lalaki
  rationale: Malapit ito sa literal na “makita” at “aking mga kapatid,” habang hayagang pinananatili ang panlalaking anyo ng pangngalan.
- source_word: עַל כֵּן לֹא בָא אֶל שֻׁלְחַן הַמֶּלֶךְ
  choice: Kaya hindi siya dumalo sa hapag ng hari
  rationale: Ipinakikita ng “kaya” ang kongklusyon, at natural na ipinahahayag ng “dumalo sa hapag” ang hindi niya pagpunta sa maharlikang kainan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal. Ginamit ang “ninyo/inyong” bilang magalang na pagtukoy sa hari. Inilipat ang mga marker sa mismong mga salitang tunay na tinatalakay ng bawat talababa.
