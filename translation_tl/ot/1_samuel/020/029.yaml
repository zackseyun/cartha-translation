  source_fidelity: Tumpak na naihahatid ng salin ang kahilingan ni David na umalis, ang paghahaing pampamilya sa lungsod, ang mariing pagtukoy sa kapatid na nag-utos, ang kahilingang makaalis/makatakas upang makita ang mga kapatid, at ang paliwanag sa kaniyang pagliban sa hapag ng hari. Ang magalang na plural na “ninyo/inyo” ay katanggap-tanggap bilang paggalang sa kausap na hari, bagaman isahan ang Hebreo.
  naturalness: Sa pangkalahatan ay malinaw at marangal ang Tagalog. Gayunman, ang “kung kalugod-lugod ako sa inyong paningin” ay medyo di-natural at inililipat ang natapos na pormulang “nakasumpong ng lingap/pabor” tungo sa paglalarawan ng kasalukuyang katangian. Ang “kung ako’y nakasumpong ng lingap sa inyong paningin” ay mas idiomatiko at mas malapit sa Hebreo.
  terminology: Ang “paghahain,” “mismong kapatid kong lalaki,” “makatakas,” at “hapag ng hari” ay angkop. Napananatili rin ng mga talababa ang leksikal na posibilidad ng “makapuslit” at ang saklaw ng “mga kapatid kong lalaki.”
