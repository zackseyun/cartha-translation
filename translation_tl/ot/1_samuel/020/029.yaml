  to: Sinabi niya, “Pakisuyong payagan ninyo akong umalis, sapagkat may paghahain ang aming pamilya sa lungsod, at mismong kapatid kong lalaki ang nag-utos sa akin. Kaya ngayon, kung ako’y nakasumpong ng lingap sa inyong paningin, pakisuyong hayaan ninyo akong makatakas[a] at makita ang mga kapatid kong lalaki[b].” Kaya hindi siya dumalo sa hapag ng hari.
