base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/031.yaml
  text: For as long as the son of Jesse lives on the earth[a], neither you nor your kingdom will be established. So now, send and bring him to me, for he is a son of death.
translation:
  language: tl
  text: Sapagkat habang nabubuhay pa sa lupa ang anak ni Jesse, hindi ka magiging matatag, ni ang iyong paghahari. Kaya ngayon, magsugo ka at dalhin mo siya sa akin, sapagkat siya ay anak ng kamatayan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Idyoma sa Hebreo: “anak ng kamatayan,” ibig sabihin, isang taong karapat-dapat mamatay o nakatakdang mamatay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang sanhi o paliwanag sa galit at utos ni Saul.
- source_word: כָל הַיָּמִים אֲשֶׁר
  choice: habang
  rationale: Natural na Filipino para sa idyomang nagsasaad ng buong panahong nagpapatuloy ang isang kalagayan.
- source_word: בֶּן יִשַׁי
  choice: ang anak ni Jesse
  rationale: Pinananatili ang sadyang hindi pagbanggit ni Saul sa pangalan ni David at ang mapanghamak na paglayo sa kaniya.
- source_word: חַי עַל הָאֲדָמָה
  choice: nabubuhay sa lupa
  rationale: Tuwirang salin na hindi nililimitahan ang אֲדָמָה sa isang partikular na lupain.
- source_word: לֹא תִכּוֹן אַתָּה וּמַלְכוּתֶךָ
  choice: hindi magiging matatag ang katayuan mo ni ang iyong paghahari
  rationale: Inihahayag ang pagiging matatag o matibay na ipinahihiwatig ng Niphal ng כון. Idinagdag ang “katayuan” upang maging natural sa Filipino ang paglalapat ng pandiwa kay Jonathan nang hindi inaalis ang hiwalay na pagtukoy sa kaniyang paghahari.
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Pinananatili ang agarang konklusyon at paglipat sa utos.
- source_word: שְׁלַח וְקַח אֹתוֹ אֵלַי
  choice: magsugo ka at ipakuha mo siya para dalhin sa akin
  rationale: Nililinaw na magsusugo si Jonathan ng iba upang kunin at dalhin si David kay Saul, alinsunod sa magkapares na pautos.
- source_word: בֶּן מָוֶת הוּא
  choice: siya ay anak ng kamatayan
  rationale: Pinananatili sa pangunahing teksto ang matinding Hebreong idyoma at ipinaliliwanag ang kahulugan nito sa talababa.
