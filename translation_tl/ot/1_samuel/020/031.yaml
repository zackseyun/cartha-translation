  to: Sapagkat habang nabubuhay pa sa lupa ang anak ni Jesse, hindi ka magiging matatag, ni ang iyong paghahari. Kaya ngayon, magsugo ka at dalhin mo siya sa akin, sapagkat siya ay anak ng kamatayan[a].
  rationale: Inalis ang interpretatibong “katayuan” upang mapanatili ang tuwirang pagkakatugma sa “ikaw at ang iyong paghahari.” Pinagaan din ang salin ng magkapares na pautos. Pinanatili ang literal na idyoma at ang talababa nito.
