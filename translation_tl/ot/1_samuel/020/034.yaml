revisions:
- from: Kaya tumayo si Jonatan mula sa hapag na nag-aalab sa galit. Hindi siya kumain ng anuman nang ikalawang araw ng bagong buwan[a], sapagkat labis siyang nasaktan para kay David dahil ipinahiya ito ng kanyang ama.
  to: At tumindig si Jonatan mula sa hapag sa matinding galit. Hindi siya kumain ng anuman sa ikalawang araw ng buwan[a], sapagkat nagdalamhati siya dahil kay David, sapagkat ipinahiya siya ng kanyang ama[b].
  rationale: Inihanay ang salin sa tuwirang daloy ng Hebreo, ginawang mas likas ang pagpapahayag ng dalamhati, at idinagdag ang kinakailangang talababa upang mapanatili ang tunay na kalabuan ng reperente ng panghalip. Hindi binabago ng mga rebisyon ang kahulugan o antas ng pananalita ng talata.
