source:
  edition: WLC
  text: וַ/יָּ֧קָם יְהוֹנָתָ֛ן מֵ/עִ֥ם הַ/שֻּׁלְחָ֖ן בָּ/חֳרִי אָ֑ף וְ/לֹא אָכַ֞ל בְּ/יוֹם הַ/חֹ֤דֶשׁ הַ/שֵּׁנִי֙ לֶ֔חֶם כִּ֤י נֶעְצַב֙ אֶל דָּוִ֔ד כִּ֥י הִכְלִמ֖/וֹ אָבִֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/034.yaml
  text: Then Jonathan rose from the table in fierce anger[a], and he ate no food on the second day of the month, because he was grieved over David, because his father had humiliated him.
translation:
  language: tl
  text: At tumindig si Jonatan mula sa hapag sa matinding galit. Hindi siya kumain ng anuman sa ikalawang araw ng buwan[a], sapagkat nagdalamhati siya dahil kay David, sapagkat ipinahiya siya ng kanyang ama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “sa ikalawang araw ng bagong buwan.” Ang salitang Hebreo na חֹדֶשׁ ay maaaring mangahulugang “buwan” o “bagong buwan”; dito, ang konteksto ay ang handaan ng hari sa bagong buwan.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak sa Hebreo kung ang “siya” na ipinahiya ng ama ni Jonatan ay si David o si Jonatan.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumayo
  rationale: Karaniwang pandiwang pasalaysay; sa konteksto, tumayo si Jonatan upang lumisan mula sa hapag.
- source_word: מֵעִם הַשֻּׁלְחָן
  choice: mula sa hapag
  rationale: Likas at marangal na Filipino para sa paglayo mula sa mesang kinakainan.
- source_word: בָּחֳרִי אָף
  choice: na nag-aalab sa galit
  rationale: Pinananatili ang larawan ng matinding o nag-iinit na galit sa Hebreo nang hindi tunog literalistiko.
- source_word: וְלֹא אָכַל ... לֶחֶם
  choice: Hindi siya kumain ng anuman
  rationale: Ang לֶחֶם ay maaaring tumukoy sa tinapay o pagkain sa pangkalahatan; ang diwa rito ay hindi siya nakibahagi sa pagkain.
- source_word: בְּיוֹם הַחֹדֶשׁ הַשֵּׁנִי
  choice: nang ikalawang araw ng bagong buwan[a]
  rationale: Sa konteksto ng handaan, ang חֹדֶשׁ ay natural na tumutukoy sa bagong buwan, ngunit pinananatili sa talababa ang leksikal na posibilidad na 'buwan.'
- source_word: נֶעְצַב
  choice: labis siyang nasaktan
  rationale: Ipinahahayag ng Niphal ang matinding dalamhati o kirot; natural sa modernong Filipino ang 'nasaktan' sa kontekstong relasyonal.
- source_word: אֶל דָּוִד
  choice: para kay David
  rationale: Ipinakikita na ang sakit ni Jonatan ay ukol kay David at sa sinapit nito.
- source_word: הִכְלִמוֹ
  choice: ipinahiya ito
  rationale: Ang Hiphil ng כלם ay nangangahulugang magdulot ng hiya o kahihiyan. Ang panghalip na 'ito' ay tumutukoy kay David ayon sa pinakamalapit at malamang na reperente.
- source_word: אָבִיו
  choice: kanyang ama
  rationale: Pinananatili ang payak na katawagan ng Hebreo; sa pagbasa rito, tumutukoy ito sa ama ni Jonatan, si Saul.
theological_decisions:
- issue: Ang reperente ng hulaping panghalip sa הִכְלִמוֹ ('ipinahiya siya')
  choice: David ang ipinahiya ng ama ni Jonatan
  alternative: Si Jonatan ang ipinahiya ng kanyang ama
  rationale: Ang panlalaking panghalip ay gramatikal na maaaring tumukoy kay David o kay Jonatan. Ang pinakamalapit na tahasang reperente ay si David, at ang pagkahapis ni Jonatan 'para kay David' ay umaayon dito; gayunman, tunay ang kalabuan at dapat kilalanin sa talababa.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “hapag” bilang likas na salitang pampanitikan ngunit karaniwan, at “bagong buwan” upang ilapit ang parirala sa konteksto ng pagdiriwang. Kailangang idagdag sa pangunahing teksto ang marker [b] upang tumugma sa talababa.
