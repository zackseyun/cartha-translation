base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/040.yaml
  text: Then Jonathan gave his weapons to the young man who was with him and said to him[a], “Go[c][b], bring them to the city.”
translation:
  language: tl
  text: Pagkatapos, ibinigay ni Jonatan sa binatang kasama niya[b] ang kaniyang mga sandata[a] at sinabi rito, “Pumunta ka at dalhin mo ang mga iyon[c] sa lungsod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo para sa “mga sandata” ay maaari ring mangahulugang “mga kagamitan” o “mga kasangkapan.” Ang konteksto ng pana at mga palaso ni Jonatan ang dahilan kung bakit “mga sandata” ang ginamit dito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “batang tagapaglingkod niya.” Ang pananalitang Hebreo ay naglalarawan sa binata bilang tauhan o personal na kasama ni Jonatan.
    reason: lexical_alternative
  - marker: c
    text: Walang hayag na layon ang “dalhin” sa Hebreo. Ang “ang mga iyon” ay idinagdag upang tukuyin ang mga sandata o kagamitan ni Jonatan.
    reason: implicit_object
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ibinigay
  rationale: Karaniwang pandiwang pasalaysay mula sa נתן; ang “ibinigay” ang tuwiran at neutral na katumbas.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: כֵּלָיו
  choice: ang kaniyang mga sandata
  rationale: Malawak ang kahulugan ng כְּלִי bilang kagamitan o kasangkapan, ngunit sa konteksto ng pana at mga palaso, ang “mga sandata” ang pinakamalinaw na katumbas.
- source_word: הַנַּעַר אֲשֶׁר לוֹ
  choice: sa binatang kasama niya
  rationale: Maaaring tumukoy ang נַעַר sa binata, batang lalaki, o tagapaglingkod. Ipinahihiwatig ng אֲשֶׁר לוֹ na tauhan o personal na kasama siya ni Jonatan; pinananatili ng salin ang kabataan at ugnayan nang hindi labis na tinutukoy ang kaniyang katungkulan.
- source_word: וַיֹּאמֶר לוֹ
  choice: at sinabi rito
  rationale: Tuwirang katumbas ng karaniwang pandiwang אמר; natural ang “rito” dahil malinaw na ang binata ang tinutukoy.
- source_word: לֵךְ
  choice: Pumunta ka
  rationale: Tuwiran at likas na makabagong Tagalog para sa pautos na anyo ng הלך.
- source_word: הָבֵיא
  choice: dalhin mo ang mga iyon
  rationale: Ang Hiphil ng בוא ay karaniwang “dalhin.” Walang hayag na layon sa Hebreo, kaya idinagdag ang “ang mga iyon” na tumutukoy sa mga sandata.
- source_word: הָעִיר
  choice: sa lungsod
  rationale: Tuwirang salin ng tiyak na pangngalan; hindi tinutukoy ng talata kung aling lungsod iyon.
