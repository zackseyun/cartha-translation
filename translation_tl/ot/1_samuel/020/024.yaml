  yaml_path: translation/ot/1_samuel/020/024.yaml
  text: So David hid himself in the field. When the new moon came[a], the king sat down to eat the meal.
translation:
  language: tl
  text: Kaya nagtago si David sa bukid. Nang sumapit ang bagong buwan, umupo ang hari sa hapag upang kumain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “umupo sa ibabaw ng tinapay upang kumain.” Ang “tinapay” dito ay tumutukoy sa buong pagkain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּתֵר
  choice: nagtago
  rationale: 'Ang Niphal ng סתר ay may diwang reflexive o intransitive sa kontekstong ito: sadyang nagtago si David. Likas at malinaw sa modernong Tagalog ang “nagtago.”'
- source_word: בַּשָּׂדֶה
  choice: sa bukid
  rationale: Karaniwang kahulugan ng שָׂדֶה ang “bukid” o “parang.” Pinili ang “sa bukid” bilang tuwiran at natural na katumbas.
- source_word: וַיְהִי הַחֹדֶשׁ
  choice: Nang sumapit ang bagong buwan
  rationale: Sa konteksto, ang הַחֹדֶשׁ ay tumutukoy sa pagdating ng bagong buwan at sa okasyong kaugnay nito, hindi lamang sa pagsisimula ng isang buwan. Pinananatili ng “sumapit” ang temporal na takbo ng salaysay.
- source_word: וַיֵּשֶׁב
  choice: umupo
  rationale: Ang ישב ay nangangahulugang “umupo” rito, sa konteksto ng paghahanda para kumain.
- source_word: עַל הַלֶּחֶם
  choice: sa hapag
  rationale: Literal itong “sa ibabaw/harap ng tinapay,” ngunit ang “tinapay” ay metonimiya para sa pagkain. Ang “sa hapag” ay natural na Filipino at ipinahihiwatig ang pag-upo para sa handang pagkain.
- source_word: לֶאֱכֹל
  choice: upang kumain
  rationale: 'Infinitive ito na nagsasaad ng layunin: umupo ang hari para kumain.'
- source_word: דָּוִד
  choice: David
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinanatili ang tiyak na titulo ng Hebreo sa halip na palitan ito ng pangalang Saul.
