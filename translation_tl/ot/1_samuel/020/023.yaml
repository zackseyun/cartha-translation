  text: וְ/הַ֨/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְנוּ אֲנִ֣י וָ/אָ֑תָּה הִנֵּ֧ה יְהוָ֛ה בֵּינִ֥/י וּ/בֵינְ/ךָ֖ עַד עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/023.yaml
  text: And as for the matter that you and I have spoken of[a], behold, Yahweh is between me and you forever.
translation:
  language: tl
  text: At tungkol sa bagay na pinag-usapan nating dalawa[a], narito, si Yahweh ang nasa pagitan natin magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tungkol sa salitang sinabi nating dalawa.” Ang Hebreong דָּבָר ay maaaring mangahulugang “salita,” “bagay,” o “usapin”; dito, tumutukoy ito sa napagkasunduan nila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַדָּבָר
  choice: At tungkol sa bagay
  rationale: Ang דָּבָר ay maaaring mangahulugang “salita,” “bagay,” o “usapin.” Sa konteksto, tumutukoy ito sa napagkasunduan nina Jonatan at David; natural sa modernong Tagalog ang “tungkol sa bagay.”
- source_word: אֲשֶׁר דִּבַּרְנוּ אֲנִי וָאָתָּה
  choice: na pinag-usapan nating dalawa
  rationale: Ipinahahayag nito ang kapwa nilang naunang pag-uusap. Ang “nating dalawa” ay natural at malinaw na katumbas ng tahasang Hebreong “ako at ikaw.”
- source_word: הִנֵּה
  choice: narito
  rationale: Pinananatili nito ang taimtim na pantawag-pansin ng הִנֵּה nang hindi nagiging labis na makaluma.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בֵּינִי וּבֵינְךָ
  choice: ang nasa pagitan natin
  rationale: Pinananatili ang larawan ng pagiging “nasa pagitan” ng dalawang panig, habang natural na ipinahahayag sa Tagalog ang ugnayan nina Jonatan at David.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Malinaw at marangal na modernong Tagalog para sa walang hanggang bisa o tagal.
theological_decisions:
- issue: Paglalarawan kay Yahweh bilang nasa pagitan ng dalawang lalaki
  choice: Pinanatili ang literal at bukas na pahayag na “si Yahweh ang nasa pagitan natin.”
  alternative: Tahasan itong palawakin bilang “si Yahweh ang saksi at tagapanagot sa pagitan natin.”
  rationale: Sa konteksto, maaaring ipinahihiwatig ang pagiging saksi o tagapanagot ni Yahweh sa tipan, ngunit hindi iyon tahasang binabanggit ng Hebreo. Kaya pinananatili ang teolohikal na bigat at posibilidad nang hindi nilulutas sa parapreys.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Ang pinagmulan ay tuwirang gumagamit ng tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “pinag-usapan nating dalawa” para sa likas na daloy, at pinanatili ang “narito” upang maipahayag ang taimtim na diin ng Hebreo.
