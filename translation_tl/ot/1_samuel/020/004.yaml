  text: Then Jonathan said to David[a], “What does your soul say? I will do it for you.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Jonatan kay David, “Anuman ang ninanais mo, gagawin ko para sa iyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang “Pagkatapos, sinabi” habang pinananatili ang pagkakasunod-sunod ng pangyayari.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: אֶל דָּוִד
  choice: kay David
  rationale: Ang “kay” ang natural na panandang Filipino para sa taong kinakausap.
- source_word: מַה תֹּאמַר
  choice: Ano ang sinasabi
  rationale: Pinananatili ang anyong tanong at ang talinghaga ng pagsasalita sa Hebreo, sa halip na agad itong gawing pahayag na “anuman ang nais.”
- source_word: נַפְשְׁךָ
  choice: ng kalooban mo
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa panloob na sarili o pagnanais. Mas natural at angkop ang “kalooban” kaysa literal na “kaluluwa,” nang hindi nawawala ang Hebreong larawan.
- source_word: וְאֶעֱשֶׂה
  choice: Gagawin ko
  rationale: Tuwirang katumbas ng karaniwang pandiwang עשה; ginawang hiwalay na pangungusap para sa malinaw at natural na usapan sa Filipino.
- source_word: לָּךְ
  choice: para sa iyo
  rationale: Ipinahahayag ng parirala ang pakinabang at pangako ni Jonatan kay David.
