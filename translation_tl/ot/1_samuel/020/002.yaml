  register: Modernong Filipino na malinaw at marangal, na may natural na daloy ng tuwirang pananalita. Pinanatili ang pag-uulit ng “aking ama,” ang merismong “malaki man o maliit,” at ang mariing pagtanggi sa simula at wakas.
