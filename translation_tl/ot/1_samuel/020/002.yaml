base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/002.yaml
  text: He said to him[a], “Far from it! You will not die. Look, my father does nothing, great or small, without revealing it to me. So why would my father hide this matter from me? It is not so.”
translation:
  language: tl
  text: Sinabi sa kanya ni Jonatan, “Hindi maaari! Hindi ka mamamatay. Tingnan mo, walang ginagawang anumang bagay ang aking ama—malaki man o maliit—nang hindi niya ipinaaalam sa akin.[a] Kaya bakit ililihim sa akin ng aking ama ang bagay na ito? Hindi totoo iyan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ibinubunyag niya ang aking tainga,” isang idyomang nangangahulugang “ipinaaalam sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה
  choice: Hindi maaari!
  rationale: Matinding pagtanggi ang idyomang Hebreo. Likas at malinaw sa modernong Filipino ang “Hindi maaari!” at hindi nito ipinapasok ang tahasang pagtukoy sa Diyos na wala sa pinagmulang teksto.
- source_word: לֹא תָמוּת
  choice: Hindi ka mamamatay
  rationale: Tuwirang katiyakan kay David; natural ito sa kasalukuyang Filipino at pinananatili ang tiyak na himig ng pahayag.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Panawag-pansin ito sa paliwanag na kasunod. Pinananatili ng “Tingnan mo” ang tungkuling pandiskurso nang hindi gumagamit ng makalumang pananalita.
- source_word: דָּבָר גָּדוֹל אוֹ דָּבָר קָטֹן
  choice: anumang bagay—malaki man o maliit
  rationale: Pinananatili ang merismong sumasaklaw sa lahat ng bagay habang natural ang ayos sa Filipino.
- source_word: וְלֹא יִגְלֶה אֶת אָזְנִי
  choice: nang hindi niya ipinaaalam sa akin
  rationale: Ang literal na “ilantad ang tainga” ay idyomang nangangahulugang ipaalam o ibunyag. Isinalin ang kahulugan sa pangunahing teksto at itinabi sa talababa ang literal na larawan.
- source_word: יַסְתִּיר
  choice: ililihim
  rationale: Ang “ililihim” ay natural na katumbas ng pagtatago ng impormasyon at angkop sa retorikal na tanong.
- source_word: הַדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Tumutukoy ang דָּבָר sa usapin o balak na iniulat ni David, hindi lamang sa isang binigkas na salita.
- source_word: אֵין זֹאת
  choice: Hindi totoo iyan
  rationale: Maikli at likas na pangwakas na pagtanggi sa sinabi ni David, nang hindi dinaragdagan ang antas ng katiyakan ng Hebreo.
- source_word: אָבִי
  choice: aking ama
  rationale: Pinanatili ang hayag na pag-uulit sa Hebreo para sa diin at kalinawan ng ugnayan.
