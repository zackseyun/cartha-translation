translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Tagalog. Hindi pinalambot ang tindi ng galit at insulto ni Saul, ngunit nilinaw sa talababa ang mahirap na idyomang Hebreo. Ang pangalang Jonathan ay isina-Tagalog bilang ‘Jonatan,’ at pinanatili ang ‘Jesse’ bilang karaniwang anyo ng pangalan.
