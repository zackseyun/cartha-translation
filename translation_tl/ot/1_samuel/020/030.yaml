base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/030.yaml
  text: Then Saul’s anger burned against Jonathan[a], and he said to him, “You son of a perverse, rebellious woman! Do I not know that you have chosen the son of Jesse[c][b], to your own shame and to the shame of your mother’s nakedness?”
translation:
  language: tl
  text: Nag-alab ang galit ni Saul kay Jonatan, at sinabi niya sa kanya, “Anak ka ng baluktot at suwail na babae![a] Hindi ko ba alam na pinipili mo ang anak ni Jesse,[b] sa sarili mong kahihiyan at sa kahihiyan ng kahubaran ng iyong ina?[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Anak ka ng kabaluktutan at paghihimagsik!” Mahirap at lubhang idyomatiko ang insultong Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “kumakampi ka sa anak ni Jesse.”
    reason: lexical_alternative
  - marker: c
    text: Ang pariralang “kahihiyan ng kahubaran ng iyong ina” ay isang matindi at mapanlait na pananalitang Hebreo tungkol sa kahihiyan ng pamilya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף שָׁאוּל בִּיהוֹנָתָן
  choice: Nag-alab ang galit ni Saul kay Jonatan
  rationale: Pinananatili ang matingkad na idyomang Hebreo na ang galit ay ‘nag-aalab,’ habang likas sa modernong Tagalog ang pagkakabuo.
- source_word: בֶּן נַעֲוַת הַמַּרְדּוּת
  choice: Anak ka ng baluktot at suwail na babae
  rationale: Inilalahad ito bilang matinding pang-iinsultong tumutukoy sa ina, gaya ng malamang na diwa ng mahirap at idyomatikong pariralang Hebreo. Pinananatili ng ‘baluktot’ at ‘suwail’ ang mga ideya ng perversidad at paghihimagsik.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: Hindi ko ba alam
  rationale: Pinananatili ang mapanuligsang tanong sa halip na gawing payak na pahayag.
- source_word: בֹחֵר אַתָּה לְבֶן יִשַׁי
  choice: pinipili mo ang anak ni Jesse
  rationale: Pinananatili ang pangunahing kahulugan ng בחר na ‘pumili.’ Ang aspektong kasalukuyan o nagpapatuloy ng participle ay inihahayag sa ‘pinipili,’ habang inilalagay sa talababa ang kontekstuwal na diwang ‘kumakampi.’
- source_word: לְבָשְׁתְּךָ
  choice: sa sarili mong kahihiyan
  rationale: Malinaw na ipinapahayag ang resulta o kapinsalaang dulot sa dangal ni Jonatan.
- source_word: וּלְבֹשֶׁת עֶרְוַת אִמֶּךָ
  choice: at sa kahihiyan ng kahubaran ng iyong ina
  rationale: Pinananatili ang tahasan, mabagsik, at sadyang nakagugulat na salitang ‘kahubaran’ sa halip na palambutin ang insulto.
