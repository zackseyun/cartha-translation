  yaml_path: translation/ot/1_samuel/020/016.yaml
  text: So Jonathan made a covenant with the house of David, and the LORD sought it from the hand of David’s enemies.
translation:
  language: tl
  text: Kaya nakipagtipan si Jonatan sa sambahayan ni David, at hiningi ng PANGINOON mula sa mga kaaway ni David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang huling sugnay: “at hingin nawa ng PANGINOON mula sa mga kaaway ni David.” Hindi tahasang binabanggit sa Hebreo kung ano ang hinihingi; maaaring tumukoy ito sa pananagutang kaugnay ng tipan o sa nararapat na kaparusahan.'
    reason: Pinananatili nito ang posibleng pagbasa ng pandiwa bilang panawagan o sumpa sa konteksto ng tipan at ang di-hayag na layon ng pandiwa.
lexical_decisions:
- source_word: וַיִּכְרֹת ... עִם
  choice: nakipagtipan ... sa
  rationale: Ang literal na idyomang Hebreo ay “pumutol ng tipan,” ngunit ang likas at tumpak na katumbas sa modernong Tagalog ay “nakipagtipan.”
- source_word: בֵּית דָּוִד
  choice: sambahayan ni David
  rationale: Tumutukoy ito sa pamilya o angkan ni David, hindi lamang sa isang gusali; pinananatili ng “sambahayan” ang dinastikong lawak ng larawan.
- source_word: וּבִקֵּשׁ
  choice: at siningil
  rationale: Maaaring mangahulugang “hinanap” o “hiningi,” ngunit sa konteksto ng tipan ay may diwang paghingi ng pananagutan; ang “siningil” ay natural na naghahatid nito nang hindi tinutukoy nang tahasan kung ano ang kabayaran.
- source_word: מִיַּד אֹיְבֵי דָוִד
  choice: mula sa mga kaaway ni David
  rationale: Ang “mula sa kamay ng” ay idyomang Hebreo para sa paghingi o pagsingil mula sa isang tao. Isinalin ito nang natural sa Tagalog habang pinananatili ang pinagmumulan ng pananagutan.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang pamalit na pamagat sa malalaking titik para sa banal na pangalang YHWH.
theological_decisions:
- issue: Panahunan o modal na puwersa ng וּבִקֵּשׁ
  choice: 'Isinalin bilang naganap na kilos: “siningil.”'
  alternative: 'Maaari itong unawain bilang sumpa o panalangin sa tipan: “singilin nawa.”'
  rationale: Ang anyo sa Masoretic Text ay karaniwang binabasa bilang sunod-sunod na naganap na kilos, gaya ng audited consultation text, ngunit maaaring magpahiwatig ang konteksto ng panawagang magparusa. Inilalahad sa talababa ang tunay na interpretatibong posibilidad.
- issue: Hindi hayag na layon ng “siningil”
  choice: Ginamit ang “iyon,” na tumutukoy nang maluwag sa pananagutan kaugnay ng tipan.
  alternative: Alisin ang layon at sabihing “pinanagot ng PANGINOON ang mga kaaway ni David.”
  rationale: Walang tahasang layon sa Hebreo. Ang “iyon” ay nagpapanatili sa pagiging di-tiyak nito at umiiwas na tukuyin kung ang tinutukoy ay ang tipan, ang paglabag dito, o ang kaukulang kaparusahan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nakipagtipan” sa halip na literal na “pumutol ng tipan,” at “sambahayan” upang mapanatili ang pampamilya at dinastikong diwa ng בֵּית.
