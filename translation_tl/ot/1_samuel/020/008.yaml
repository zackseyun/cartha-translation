base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/008.yaml
  text: So show kindness to your servant[a], for you have brought your servant into the covenant of Yahweh with yourself. But if there is guilt in me, put me to death yourself[b]; why should you bring me to your father?
translation:
  language: tl
  text: Kaya magpakita ka ng kabutihan sa iyong lingkod,[a] sapagkat isinama mo ang iyong lingkod kasama mo sa tipan ni Yahweh.[b] Ngunit kung may kasalanan ako, ikaw na mismo ang pumatay sa akin. Bakit mo pa ako dadalhin sa iyong ama?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magpakita ka ng tapat na katapatan sa iyong lingkod.” Ang salitang Hebreo ay maaari ring mangahulugan ng tapat o tipanal na kabutihan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “dinala mo ang iyong lingkod kasama mo sa tipan ni Yahweh.” Maaaring tumukoy ito sa tipang pinasok nina Jonatan at David sa ilalim ng pangalan o awtoridad ni Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָשִׂיתָ חֶסֶד
  choice: magpakita ka ng tapat na pagmamahal
  rationale: Ang חֶסֶד ay maaaring tumukoy sa kabutihan, matapat na pag-ibig, at katapatan sa isang ugnayang may pananagutan. Ang pariralang ito ay natural sa modernong Filipino at pinananatili ang diin sa katapatan na angkop sa kasunod na pagbanggit sa tipan.
- source_word: עַל עַבְדֶּךָ
  choice: sa iyong lingkod
  rationale: Sa idyomang עשה חסד, ang עַל ay tumutukoy sa taong pinagpapakitaan ng kabutihan. Ang 'sa iyong lingkod' ay likas na Filipino at pinananatili ang mapagpakumbabang pagtukoy ni David sa sarili.
- source_word: בִּבְרִית יְהוָה הֵבֵאתָ אֶת עַבְדְּךָ עִמָּךְ
  choice: isinama mo ang iyong lingkod sa pakikipagtipan mo sa harap ni Yahweh
  rationale: Ang Hiphil ng בוא ay 'dinala/isinalang,' at ang עִמָּךְ ay nagpapahiwatig na isinama ni Jonatan si David sa tipang kanilang pinasok. Ang 'sa harap ni Yahweh' ay nagpapahayag na ang tipan ay ginawa sa ilalim ng pagsaksi at awtoridad ni Yahweh, nang hindi ipinapalagay na si Yahweh mismo ang kabilang panig ng tipan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְאִם יֶשׁ בִּי עָוֺן
  choice: Ngunit kung may kasalanan ako
  rationale: Sa konteksto, ang עָוֹן ay tumutukoy sa tunay na kasalanan o pagkakasala ni David. Ang 'may kasalanan ako' ay malinaw at natural sa Filipino.
- source_word: הֲמִיתֵנִי אַתָּה
  choice: ikaw na mismo ang pumatay sa akin
  rationale: Ang causative na anyo ay literal na 'ipapatay/patayin,' at ang hiwalay na panghalip אַתָּה ay mariing nangangahulugang si Jonatan mismo ang gumawa nito. Ang salin ay tuwiran at pinananatili ang diin.
- source_word: וְעַד אָבִיךָ לָמָּה זֶּה תְבִיאֵנִי
  choice: Bakit mo pa ako dadalhin sa iyong ama?
  rationale: 'Ang tanong ay retorikal: kung nagkasala si David, si Jonatan na ang pumatay sa kanya sa halip na dalhin pa siya kay Saul. Ang ''pa'' ay natural na naghahatid ng puwersa ng tanong at ng diwang ''hanggang sa iyong ama.'''
theological_decisions:
- issue: Kaugnayan ng tipan kay Yahweh
  choice: pakikipagtipan mo sa harap ni Yahweh
  alternative: tipan ni Yahweh
  rationale: Maaaring unawain ang בְּרִית יְהוָה bilang tipang pinagtibay sa presensiya at ilalim ng awtoridad ni Yahweh, hindi kinakailangang tipan kung saan siya ang direktang kabilang panig. Pinipili ng pangunahing teksto ang mas malinaw na ugnayan nina Jonatan at David habang itinatala sa talababa ang mas pormal na alternatibo.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Dahil personal na pangalan ang יְהוָה sa Hebreo, ginagamit ang transliterasyong 'Yahweh' upang mapanatili ang anyo at tungkulin nito sa teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'lingkod' bilang magalang at mapagpakumbabang pagtukoy sa sarili, 'pakikipagtipan' para sa kapwa-panig na ugnayan, at tuwirang 'pumatay' upang mapanatili ang bigat ng pakiusap. Lahat ng talababa ay minarkahan sa pangunahing teksto.
