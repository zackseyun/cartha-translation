  text: Then Jonathan said to David[a], “Come, and let us go out into the field.” So both of them went out into the field.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Jonatan kay David[a], “Halika, lumabas tayo at pumunta sa bukid.” Kaya kapuwa silang lumabas at pumunta sa bukid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Humayo ka, at lumabas tayo patungo sa bukid.” Mas literal na “humayo” ang לְכָה, ngunit sa kontekstong ito ng pag-aanyayang sumama, mas natural ang “halika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ipinahihiwatig ng waw-consecutive ang kasunod na pangyayari sa salaysay; natural sa modernong Tagalog ang “Pagkatapos, sinabi.”
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: אֶל דָּוִד
  choice: kay David
  rationale: Ang “kay” ang natural na pananda sa taong kinakausap sa Tagalog.
- source_word: לְכָה
  choice: Halika
  rationale: Bagaman literal itong maaaring sabihing “Humayo,” paanyaya ito ni Jonatan kay David na sumama sa kaniya, kaya natural at tumpak sa konteksto ang “Halika.”
- source_word: וְנֵצֵא
  choice: lumabas tayo
  rationale: Ang cohortative na unang panauhang maramihan ay nagpapahayag ng mungkahi o paanyaya; malinaw itong naihahayag ng inklusibong “tayo.”
- source_word: הַשָּׂדֶה
  choice: sa bukid
  rationale: Ang שָׂדֶה ay tumutukoy sa bukid o lantad na lupain. Ang “sa bukid” ay tuwiran, natural, at pinananatili sa dalawang paglitaw nito.
- source_word: וַיֵּצְאוּ
  choice: Kaya lumabas
  rationale: Ang kasunod na kilos ay tugon sa paanyaya ni Jonatan; ipinahahayag ng “Kaya” ang ugnayang ito nang natural.
- source_word: שְׁנֵיהֶם
  choice: silang dalawa
  rationale: Pinananatili nito ang diin na kapwa magkasamang lumabas sina Jonatan at David.
