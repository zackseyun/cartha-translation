  text: וְ/הַ/נַּ֖עַר לֹֽא יָדַ֣ע מְא֑וּמָה אַ֤ךְ יְהֽוֹנָתָן֙ וְ/דָוִ֔ד יָדְע֖וּ אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/039.yaml
  text: But the boy did not know anything[a]; only Jonathan and David knew the matter.
translation:
  language: tl
  text: Ngunit walang anumang nalalaman ang bata; tanging sina Jonatan at David ang nakaaalam sa bagay na iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa usaping iyon” o “sa napagkasunduang paraan.” Malawak ang kahulugan ng Hebreong דָּבָר at maaari itong tumukoy sa isang bagay, usapin, o kaayusang pinag-uusapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: Ngunit ... ang bata
  rationale: Ang נַעַר ay tumutukoy rito sa batang tagapaglingkod ni Jonatan. Isinalin ang וְ bilang “Ngunit” upang maipakita ang paghahambing ng kawalang-alam ng bata sa kaalaman nina Jonatan at David.
- source_word: לֹא יָדַע מְאוּמָה
  choice: walang anumang nalalaman
  rationale: Likas na salin sa modernong Tagalog ng negatibong pariralang nangangahulugang hindi siya nakaaalam ng kahit ano; pinananatili rin nito ang tuwirang diwang nagbibigay-kaalaman ng יָדַע.
- source_word: אַךְ
  choice: tanging
  rationale: Ipinahahayag dito ng אַךְ ang pagtatangi o eksklusibong kaalaman nina Jonatan at David.
- source_word: יְהוֹנָתָן וְדָוִד
  choice: sina Jonatan at David
  rationale: Ginamit ang karaniwang anyong Tagalog ng mga pangalan at ang pantukoy na “sina” para sa dalawang tao.
- source_word: יָדְעוּ
  choice: nakaaalam
  rationale: Pinananatili ang parehong ugat na “alam” upang luminaw ang tahasang pagsalungat sa hindi nalalaman ng bata.
- source_word: אֶת־הַדָּבָר
  choice: sa bagay na iyon
  rationale: Malawak ang saklaw ng דָּבָר at maaaring tumukoy sa isang bagay, usapin, o napagkasunduang kaayusan. Ang “bagay na iyon” ay natural at hindi nagpapasok ng mas tiyak na interpretasyon kaysa sa Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “nakaaalam” sa magkabilang sugnay upang mapanatili ang malinaw na kontrast ng orihinal, at iniwasang gawing tahasan ang lihim na hudyat o kasunduan sa pangunahing teksto.
