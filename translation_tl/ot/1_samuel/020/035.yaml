  yaml_path: translation/ot/1_samuel/020/035.yaml
  text: In the morning[a], Jonathan went out to the field for the appointed meeting with David[b], and a young boy was with him.
translation:
  language: tl
  text: Nang umaga, lumabas si Jonatan patungo sa parang para sa itinakdang pagkikita nila ni David,[a] at may kasama siyang isang batang lalaki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa takdang oras ni David.” Ang Hebreong מוֹעֵד ay maaaring mangahulugang takdang oras o itinakdang pagkikita; sinusuportahan ng konteksto ng kanilang napagkasunduang pagkikita ang “itinakdang pagkikita.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang maliit na bata” o “isang batang utusan.” Ang Hebreong נַעַר ay maaaring tumukoy sa isang batang lalaki, kabataan, o utusan, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Kinaumagahan
  rationale: Likas na panimulang panahunan sa salaysay; ipinapahayag nito ang pagdating ng umaga at ang kasunod na pangyayari nang hindi pilit na isinasalin ang וַיְהִי bilang hiwalay na parirala.
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Pinananatili ang direksiyonal na diwa ng יצא at natural sa makabagong Tagalog.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: הַשָּׂדֶה
  choice: patungo sa parang
  rationale: Ang שָׂדֶה ay bukas na lupain o parang; malinaw na ipinahihiwatig ng parirala ang pagpunta roon.
- source_word: לְמוֹעֵד דָּוִד
  choice: para sa itinakdang pagkikita nila ni David
  rationale: Maaaring tumukoy ang מוֹעֵד sa takdang oras o itinakdang pagkikita. Sa konteksto ng napagkasunduang tagpuan at hudyat, natural ang 'itinakdang pagkikita,' habang iniingatan sa talababa ang alternatibo.
- source_word: וְנַעַר קָטֹן
  choice: at may kasama siyang isang batang lalaki
  rationale: Ang נַעַר ay maaaring bata, kabataan, o utusan, at nililinaw ng קָטֹן ang kaniyang kabataan o kaliitan. Hindi ipinapalagay sa pangunahing teksto na tungkulin niyang maging utusan.
- source_word: עִמּוֹ
  choice: may kasama siyang
  rationale: Natural na Tagalog na pagpapahayag ng pag-iral at pagsama na ipinahihiwatig ng parirala.
