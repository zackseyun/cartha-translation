translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Jonatan,” “bagong buwan,” at “parang” bilang madaling maunawaang mga anyo. Inayos ang mga pananda ng talababa upang aktuwal na tumugma sa kani-kanilang paliwanag.
