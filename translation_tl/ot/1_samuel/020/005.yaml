base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/005.yaml
  text: David said to Jonathan[a], “Look, tomorrow is the new moon, and I am supposed to sit with the king to eat. But let me go[b], so that I may hide myself in the field until the third evening.”
translation:
  language: tl
  text: Sinabi ni David kay Jonatan, “Tingnan mo, bukas ay bagong buwan[b], at inaasahan akong uupo sa hapag kasama ng hari para kumain. Ngunit payagan mo akong umalis upang makapagtago ako sa parang hanggang sa ikatlong gabi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang sa gabi ng ikatlong araw.” Eliptikal ang pariralang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang “bagong buwan” ay tumutukoy sa buwanang pagdiriwang ng pagsapit ng bagong buwan, na karaniwang may natatanging salu-salo.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Makinig ka
  rationale: Pantawag-pansin ito sa sasabihin ni David. Natural sa makabagong Tagalog ang “Makinig ka” sa tuwirang usapan, bagaman hindi ito utos na tumingin nang literal.
- source_word: חֹדֶשׁ מָחָר
  choice: bukas ay bagong buwan
  rationale: Ang חֹדֶשׁ dito ay tumutukoy sa pagdiriwang ng bagong buwan, gaya ng ipinahihiwatig ng natatanging pagkain sa korte.
- source_word: יָשֹׁב אֵשֵׁב
  choice: inaasahang uupo ako
  rationale: Ipinahihiwatig ng infinitive absolute at finite verb ang matibay na inaasahang pagdalo, hindi kinakailangang personal na tungkuling moral.
- source_word: עִם הַמֶּלֶךְ לֶאֱכֹל
  choice: sa hapag kasama ng hari
  rationale: Natural na ipinahahayag sa Tagalog ang pag-upo kasama ng hari upang kumain, habang pinananatili ang larawan ng salusalo.
- source_word: וְשִׁלַּחְתַּנִי
  choice: payagan mo akong umalis
  rationale: Literal na “paalisin/ipadala mo ako,” ngunit sa konteksto ay humihingi si David kay Jonatan ng pahintulot na lumiban.
- source_word: וְנִסְתַּרְתִּי
  choice: upang makapagtago ako
  rationale: Nananatili ang posibleng volitional o resultang ugnayan nito sa naunang kahilingan.
- source_word: בַשָּׂדֶה
  choice: sa parang
  rationale: Ang “parang” ay natural na katumbas ng bukid o open field na maaaring pagtaguan.
- source_word: עַד הָעֶרֶב הַשְּׁלִשִׁית
  choice: hanggang sa ikatlong gabi
  rationale: Pinananatili ang eliptikal at medyo malabong anyo ng Hebreo; nililinaw sa talababa ang posibleng kahulugan.
