base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/028.yaml
  text: Jonathan answered Saul[a], “David earnestly asked leave of me to go to Bethlehem.”
translation:
  language: tl
  text: Sumagot si Jonatan kay Saul, “Mahigpit na nakiusap sa akin si David na payagan ko siyang pumunta sa Bethlehem.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן יְהוֹנָתָן אֶת שָׁאוּל
  choice: Sumagot si Jonatan kay Saul
  rationale: Likas at tuwirang salin sa modernong Tagalog ng karaniwang pormulang pasalaysay na ginagamit sa pag-uusap.
- source_word: נִשְׁאֹל נִשְׁאַל
  choice: Mahigpit na nakiusap
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa pakiusap. Ipinahahayag ng “mahigpit na nakiusap” ang mariing paghiling nang hindi ipinapalagay na paulit-ulit ang kilos.
- source_word: מֵעִמָּדִי
  choice: sa akin
  rationale: Tinutukoy nito si Jonatan bilang taong hiningan ni David ng pahintulot; natural itong isinasama sa pariralang “nakiusap sa akin.”
- source_word: עַד בֵּית לָחֶם
  choice: na payagan ko siyang pumunta sa Bethlehem
  rationale: Bagaman literal na tumutukoy ang parirala sa patutunguhang Bethlehem, ipinahihiwatig ng konteksto ng paghiling ang paghingi ng pahintulot na pumunta roon. Ginawang tahasan ito para sa malinaw at natural na Tagalog.
- source_word: בֵּית לָחֶם
  choice: Bethlehem
  rationale: Karaniwang anyo ng pangalan ng lugar sa modernong saling Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Pinanatili ang diin ng Hebreong konstruksiyon sa pamamagitan ng “mahigpit na nakiusap,” habang iniwasan ang mas tiyak na “paulit-ulit” dahil maaaring diin, hindi pag-uulit, ang ipinahahayag nito.
