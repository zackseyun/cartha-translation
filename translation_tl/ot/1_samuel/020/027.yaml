revisions:
- from: Nang sumunod na araw, ang ikalawang araw ng bagong buwan, bakante pa rin ang lugar ni David. Kaya sinabi ni Saul sa anak niyang si Jonatan, “Bakit hindi pumunta sa kainan[a] ang anak ni Jesse, kahapon man o ngayon?”
  to: Nang sumunod na araw, ang ikalawang araw ng bagong buwan, bakante ang puwesto ni David. Kaya sinabi ni Saul sa anak niyang si Jonatan, “Bakit hindi dumalo sa handaan[a] ang anak ni Jesse, kahapon man o ngayon?”
  rationale: Inalis ang “pa rin” upang hindi magdagdag ng aspektong hindi tahasang nasa Hebreo. Pinalitan ang “kainan” ng “handaan” upang malinaw na ang tinutukoy ay ang pagkain o pakikisalo, hindi ang lugar na kainan. Pinanatili ang lahat ng mahahalagang sangkap ng pinagmulan at ang angkop na talababa.
