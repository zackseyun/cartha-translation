base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/027.yaml
  text: And it happened on the next day[a], the second day of the new moon, that David’s place was empty. So Saul said to Jonathan his son, “Why has the son of Jesse not come to the meal either yesterday or today?”
translation:
  language: tl
  text: Nang sumunod na araw, ang ikalawang araw ng bagong buwan, bakante ang puwesto ni David. Kaya sinabi ni Saul sa anak niyang si Jonatan, “Bakit hindi dumalo sa handaan[a] ang anak ni Jesse, kahapon man o ngayon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa tinapay,” isang karaniwang paraan ng pagtukoy sa pagkain o pakikisalo sa hapag.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרַת
  choice: Nang sumunod na araw
  rationale: Likas na makabagong Tagalog para sa araw na kasunod ng naunang binanggit na araw.
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: ang ikalawang araw ng bagong buwan
  rationale: Sa konteksto, tumutukoy ang חֹדֶשׁ sa pagdiriwang ng bagong buwan; ipinahihiwatig ng panlalaking pang-uring הַשֵּׁנִי ang ikalawang araw nito.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: bakante pa rin ang lugar ni David
  rationale: Ipinahahayag ng Niphal ng פקד na napansing walang nakaupo sa puwesto ni David. Ang “pa rin” ay natural na naghahatid na wala rin siya noong ikalawang araw, gaya ng nililinaw ng kasunod na tanong.
- source_word: בְּנוֹ
  choice: sa anak niyang si Jonatan
  rationale: Pinananatili ang tahasang ugnayang ama at anak sa natural na ayos ng Tagalog.
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Karaniwang katumbas sa Tagalog ng tanong tungkol sa dahilan.
- source_word: בֶן יִשַׁי
  choice: ang anak ni Jesse
  rationale: Pinananatili ang pagtukoy ni Saul kay David sa pamamagitan ng pangalan ng ama nito, sa halip na palitan ito ng “David,” upang mapanatili ang posibleng paglayo o paghamak sa pananalita.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: kahapon man o ngayon
  rationale: Natural ito sa isang negatibong tanong sa Tagalog at saklaw pa rin ang dalawang araw na nasa Hebreo.
- source_word: אֶל הַלָּחֶם
  choice: sa kainan
  rationale: Bagaman literal na “sa tinapay,” metonimiko itong tumutukoy sa pagkain o salu-salo sa hapag. Ang “sa kainan” ay malinaw at natural sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang patronimikong “anak ni Jesse” at ang sanggunian sa bagong buwan, habang ginawang likas sa Tagalog ang ayos ng pangungusap. Inilagay ang talababa sa “kainan,” ang salitang aktuwal nitong ipinapaliwanag.
