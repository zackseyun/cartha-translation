  text: וַ/יֵּ֣שֶׁב הַ֠/מֶּלֶךְ עַל מ֨וֹשָׁב֜/וֹ כְּ/פַ֣עַם בְּ/פַ֗עַם אֶל מוֹשַׁב֙ הַ/קִּ֔יר וַ/יָּ֨קָם֙ יְה֣וֹנָתָ֔ן וַ/יֵּ֥שֶׁב אַבְנֵ֖ר מִ/צַּ֣ד שָׁא֑וּל וַ/יִּפָּקֵ֖ד מְק֥וֹם דָּוִֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/025.yaml
  text: The king sat in his seat[a], as at other times, by the wall; and Jonathan rose, and Abner sat beside Saul, but David’s place was empty.
translation:
  language: tl
  text: Umupo ang hari sa kanyang upuan, gaya ng dati, sa tabi ng pader. Tumayo si Jonatan, at umupo si Abner sa tabi ni Saul, ngunit bakante ang puwesto ni David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang nakaupo sa puwesto ni David,” samakatuwid, hindi niya inokupa ang nakatalagang lugar niya sa salusalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinananatili ang tiyak na titulo sa Hebreo sa halip na palitan ito ng pangalang Saul.
- source_word: מוֹשָׁבוֹ
  choice: kanyang upuan
  rationale: Sa konteksto ng salusalo, tumutukoy ito sa lugar na inuupuan ng hari, hindi sa tirahan.
- source_word: כְּפַעַם בְּפַעַם
  choice: gaya ng dati
  rationale: Likas na idyomang Filipino para sa paulit-ulit na kahulugang “gaya noong mga nakaraang pagkakataon.”
- source_word: אֶל מוֹשַׁב הַקִּיר
  choice: sa tabi ng pader
  rationale: Ipinahahayag ang lokasyon ng upuan kaugnay ng pader nang malinaw at natural sa Filipino.
- source_word: וַיָּקָם
  choice: Tumayo
  rationale: Tuwirang salaysay ng pandiwang קום; hindi nilulutas ang anumang tanong sa ayos o dahilan ng pagtayo ni Jonatan.
- source_word: וַיֵּשֶׁב אַבְנֵר מִצַּד שָׁאוּל
  choice: umupo si Abner sa tabi ni Saul
  rationale: Malinaw na pinananatili ang relasyong panglokasyon na “sa tagiliran/katabi ni Saul.”
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: bakante ang puwesto ni David
  rationale: Sa konteksto ng hapag, likas nitong ipinahahayag na walang umuupo sa nakatalagang lugar ni David, habang “puwesto” ay nagpapanatili sa mas malawak na diwa ng מָקוֹם.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “puwesto” para sa nakatalagang lugar sa hapag at “bakante” bilang natural na paglalarawan sa kawalan ng inaasahang umuupo roon.
