base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/013.yaml
  text: May Yahweh do so to Jonathan[a], and more also, if my father intends evil against you and I do not disclose it to you and send you away, so that you may go in peace. And may Yahweh be with you[c][b], as he has been with my father.
translation:
  language: tl
  text: Parusahan nawa ni Yahweh si Jonatan nang gayon, at higit pa, kung balak ng aking ama na saktan ka at mabigo akong ipaalam ito sa iyo at paalisin ka upang makaalis ka nang payapa. At sumaiyo nawa si Yahweh, gaya ng dati niyang pagkasama sa aking ama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִיהוֹנָתָן וְכֹה יֹסִיף
  choice: Gayon ang gawin ni Yahweh kay Jonatan, at higit pa roon
  rationale: Pinananatili ang pormula ng sumpa at ang di-karaniwang pagtukoy ni Jonatan sa sarili sa ikatlong panauhan.
- source_word: יֵיטִב אֶל אָבִי אֶת הָרָעָה עָלֶיךָ
  choice: kung balak ng aking ama na gawan ka ng masama
  rationale: Likas na Tagalog para sa eliptiko at idyomatikong Hebreo na nagsasaad ng pagkiling o layuning ipahamak si David.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: at hindi ko iyon ipaalam sa iyo
  rationale: Ang literal na ‘ilantad ang iyong tainga’ ay idyomang nangangahulugang magbigay-alam. Nilinaw ang ipinahihiwatig na pagtanggi sa pinaikling pormula ng sumpa.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: at hindi kita paalisin
  rationale: Saklaw din ng ipinahihiwatig na pagtanggi ang ikalawang ipinangakong kilos; ipinahahayag ng anyong causative na tutulungan ni Jonatan si David na makaalis.
- source_word: וְהָלַכְתָּ לְשָׁלוֹם
  choice: upang makayaon ka nang payapa
  rationale: Ipinakikita ang layunin o bunga habang pinananatili ang karaniwang Hebreong pahayag na ‘humayo nang payapa.’
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: At sumaiyo nawa si Yahweh
  rationale: Ang ‘nawa’ ay nagpapahayag ng jussive o paghiling; pinananatili ang personal na pangalang Yahweh.
- source_word: כַּאֲשֶׁר הָיָה עִם אָבִי
  choice: gaya ng pagsama niya sa aking ama
  rationale: Pinananatili ang paghahambing sa dating pagsama at pagsuporta ni Yahweh kay Saul nang hindi pinalalawak ang kahulugan.
theological_decisions:
- issue: Ipinahihiwatig na pagtanggi sa sumpa ni Jonatan
  choice: Nilinaw sa pangunahing teksto na sasapit ang sumpa kung hindi ipaalam ni Jonatan ang balak at hindi niya paalisin si David.
  alternative: 'Maaaring literal na walang tahasang pagtanggi: ‘kung balak ng aking ama na gawan ka ng masama, ipaaalam ko iyon sa iyo at paaalisin kita.’'
  rationale: Pinaikli sa Hebreo ang kasunod na bahagi ng pormula ng sumpa. Hinihingi ng konteksto na ang sumpa ay para sa kabiguan ni Jonatan na gawin ang ipinangako, kaya ginawang tahasan ang nakatagong kondisyon nang hindi binabago ang diwa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘Yahweh’ para sa יהוה, ‘Jonatan’ bilang karaniwang anyong Filipino, at ‘makayaon’ upang panatilihin ang marangal na himig nang manatiling malinaw.
