  to: Pagdating ng batang lalaki, tumayo si David mula sa tabi ng dakong timog[a]. Nagpatirapa siya at yumukod nang tatlong beses. Pagkatapos, naghalikan sila at kapwa umiyak, hanggang sa lalong umiyak si David[b].
