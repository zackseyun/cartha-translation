translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang ‘Jonatan’ sa talababa ayon sa karaniwang anyong Filipino ng pangalan; pinanatili sa pangunahing teksto ang maikli at masiglang daloy ng salaysay. Ang mga talababa ay naglalantad ng tunay na tekstuwal at leksikal na kalabuan nang hindi ito ipinapasya nang lampas sa ebidensiya.
