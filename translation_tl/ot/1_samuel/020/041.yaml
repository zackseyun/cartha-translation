base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/041.yaml
  text: When the boy had come[a], David rose from beside the south side and fell with his face to the ground and bowed three times. Then they kissed one another and wept with one another[b], until David wept the more.
translation:
  language: tl
  text: Pagdating ng batang lalaki, tumayo si David mula sa tabi ng dakong timog[a]. Nagpatirapa siya at yumukod nang tatlong beses. Pagkatapos, naghalikan sila at kapwa umiyak, hanggang sa lalong umiyak si David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap ang Hebreong parirala. Literal itong maaaring isaling “mula sa tabi ng timog” o “mula sa tabi ng Negeb”; nauunawaan naman ito ng marami bilang pagtukoy sa bunton o bato malapit sa pinagtataguan ni David.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “hanggang sa mas umiyak si David,” anupat ang pag-iyak niya ay lumabis kaysa kay Jonatan o lalo pang tumindi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר בָּא
  choice: Pagdating ng batang lalaki
  rationale: Ang נַעַר ay maaaring tumukoy sa bata, kabataan, o utusan. Sa konteksto, siya ang batang kasama ni Jonatan sa naunang tagpo; ginawang sugnay na pamanahon ang parirala para sa likas na daloy ng salaysay.
- source_word: מֵאֵצֶל הַנֶּגֶב
  choice: mula sa tabi ng dakong timog
  rationale: Karaniwang nangangahulugang ‘timog’ o ‘Negeb’ ang נֶגֶב. Mahirap ang parirala sa kontekstong ito, kaya pinanatili sa teksto ang tuwirang kahulugang panlokasyon at inilagay sa talababa ang posibleng kaugnayan nito sa bunton o batong malapit sa pinagtataguan ni David.
- source_word: וַיִּפֹּל לְאַפָּיו אַרְצָה
  choice: Nagpatirapa siya
  rationale: Ipinahihiwatig ng Hebreong idyoma ang pagbagsak na nakaharap sa lupa. Ang ‘nagpatirapa’ ay maikli, natural, at tumpak sa Filipino.
- source_word: וַיִּשְׁתַּחוּ שָׁלֹשׁ פְּעָמִים
  choice: at yumukod nang tatlong beses
  rationale: Ang pandiwa ay tumutukoy sa pagyukod o pagpapatirapa. Pinili ang ‘yumukod’ upang hindi labis na bigyang-kahulugan kung pagsamba o pagbibigay-galang ang tiyak na layunin.
- source_word: וַיִּשְּׁקוּ אִישׁ אֶת רֵעֵהוּ
  choice: naghalikan sila
  rationale: Ang katumbasang Hebreo ay literal na nagsasaad na hinalikan nila ang isa’t isa. Ang ‘naghalikan sila’ ay likas na Filipino at pinananatili ang kilos bilang tanda ng pagmamahal at pamamaalam.
- source_word: וַיִּבְכּוּ אִישׁ אֶת רֵעֵהוּ
  choice: kapwa umiyak
  rationale: Ipinahihiwatig ng katumbasang parirala na silang dalawa ay umiyak sa piling ng isa’t isa. Iniiwasan ng ‘kapwa umiyak’ ang di-likas na ‘umiyak sa isa’t isa’ habang pinananatili ang mutualidad.
- source_word: עַד דָּוִד הִגְדִּיל
  choice: hanggang sa lalong humagulgol si David
  rationale: Literal na may diwang ‘lumaki/lumabis’ ang הִגְדִּיל. Sa konteksto ng pag-iyak, maaaring tumukoy ito sa pag-igting ng pag-iyak ni David o sa pagdaig nito sa pag-iyak ni Jonatan. Ang ‘lalong humagulgol’ ay natural ngunit hindi tahasang nagdaragdag ng paghahambing kay Jonatan.
