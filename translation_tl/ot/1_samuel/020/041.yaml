  source_fidelity: 'Ang pangunahing salaysay ay tapat sa Hebreo: ang batang kasama ni Jonatan ay dumating, tumayo si David mula sa tinutukoy na lugar, nagpatirapa at yumukod nang tatlong ulit, at naghalikan at umiyak ang dalawang lalaki. Gayunman, ang “humagulgol” ay nagdaragdag ng tiyak na paraan at tindi ng pag-iyak na wala sa הִגְדִּיל; ipinahihiwatig lamang nito na ang pag-iyak ni David ay lumabis o tumindi.'
  naturalness: Likas at angkop sa modernong Filipino ang “Pagdating ng batang lalaki,” “nagpatirapa,” at “naghalikan sila.” Mas tumpak at natural ang “lalong umiyak” kaysa “lalong humagulgol,” dahil hindi nito tinutukoy ang uri ng pag-iyak.
  terminology: Ang “dakong timog” ay maingat na literal na pagsasalin ng mahirap na הַנֶּגֶב at ang talababa ay wastong naghahayag ng alternatibong pagkaunawa. Ang “Jonatan” sa talababa ay angkop na karaniwang anyong Filipino. Walang usaping teolohikal na kailangang baguhin.
