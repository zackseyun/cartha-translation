  - severity: low
    issue: Hindi gaanong natural ang paulit-ulit na “batang tagapaglingkod.”
    rationale: Nauunawaan ito, ngunit mas likas sa modernong Filipino ang “binatang alalay” para sa isang kabataang attendant.
