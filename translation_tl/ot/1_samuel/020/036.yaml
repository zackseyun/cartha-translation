  text: He said to his young man[a], “Run, please, find the arrows that I am shooting.” The young man ran, and he shot the arrow beyond him.
translation:
  language: tl
  text: Sinabi niya sa kanyang binatang alalay, “Tumakbo ka at hanapin mo, pakiusap, ang mga palasong ipinapana ko.” Tumakbo ang binatang alalay, at ipinanà niya ang palaso lampas sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kabila niya”; ang “kanya” ay tumutukoy sa binatang alalay.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ / הַנַּעַר
  choice: kanyang batang tagapaglingkod / ang batang tagapaglingkod
  rationale: Ang נַעַר ay maaaring tumukoy sa isang kabataan, alalay, o lingkod. Sa konteksto, siya ang alalay ni Jonatan; pinananatili ng “batang tagapaglingkod” ang pahiwatig ng edad at tungkulin.
- source_word: רוּץ
  choice: Tumakbo ka
  rationale: Tuwirang pautos ang רוּץ at tumutukoy sa kongkretong pagkilos na pagtakbo.
- source_word: מְצָא נָא
  choice: hanapin mo, pakiusap
  rationale: Ang מְצָא ay “hanapin,” at ang נָא ay nagbibigay ng magalang o nakikiusap na himig.
- source_word: הַחִצִּים
  choice: ang mga palaso
  rationale: Maramihan ang anyo at ito ang tuwirang layon ng pandiwang “hanapin.”
- source_word: אֲשֶׁר אָנֹכִי מוֹרֶה
  choice: na ipinapana ko
  rationale: Ang participle na מוֹרֶה ay nagpapahiwatig ng kasalukuyan o nalalapit na kilos; natural sa Filipino ang “ipinapana ko” sa eksenang ito.
- source_word: וְהוּא יָרָה הַחֵצִי
  choice: at ipinanà niya ang palaso
  rationale: Pinananatili ang isahang tiyak na anyong הַחֵצִי, kahit na naunang ginamit ang maramihang “mga palaso.” Nilagyan ng tuldik ang “ipinanà” upang malinaw na pandiwa ito.
- source_word: לְהַעֲבִירוֹ
  choice: sa kabila nito
  rationale: Ang Hiphil infinitive ng עבר na may hulaping panlalaking isahan ay nagpapahiwatig na pinalampas ni Jonatan ang palaso sa batang tagapaglingkod. Ang “sa kabila nito” ay maikli at pinananatili ang direksiyong mahalaga sa salaysay.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “batang tagapaglingkod” upang malinaw ang papel ng נַעַר nang hindi nawawala ang pahiwatig na bata pa siya. Ang “pakiusap” ay nagpapanatili sa puwersa ng נָא, at ang talababa ay nagpapaliwanag sa posibleng kalabuan ng panghalip sa huling parirala.
