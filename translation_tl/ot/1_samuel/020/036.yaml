revisions:
- from: Sinabi niya sa kanyang batang tagapaglingkod, “Tumakbo ka at hanapin mo, pakiusap, ang mga palasong ipinapana ko.” Tumakbo ang batang tagapaglingkod, at ipinanà niya ang palaso sa kabila nito.[a]
  to: Sinabi niya sa kanyang binatang alalay, “Tumakbo ka at hanapin mo, pakiusap, ang mga palasong ipinapana ko.” Tumakbo ang binatang alalay, at ipinanà niya ang palaso lampas sa kanya.[a]
  rationale: Pinalitan ang “sa kabila nito” ng “lampas sa kanya” upang maipakita nang malinaw na ang palaso ang pinalampas lampas sa batang alalay. Pinahusay din ang katawagan sa attendant para sa mas likas na daloy sa modernong Filipino nang hindi isinasantabi ang pahiwatig ng kabataan at tungkulin.
