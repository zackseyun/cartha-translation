translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Jonatan,” ang karaniwang anyong Filipino ng pangalan. Ang unang bulalas ay isinaling ayon sa gamit nito sa konteksto sa halip na literal na “malayo nawa sa iyo,” na hindi natural sa Filipino.
