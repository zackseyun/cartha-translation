  to: Sinabi ni Jonatan, “Huwag nawang mangyari iyon sa iyo! Kung tiyak na alam ko na itinakda na ng aking ama ang kapahamakang darating sa iyo, hindi ko ba iyon sasabihin sa iyo?”
