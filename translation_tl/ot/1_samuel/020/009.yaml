base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/009.yaml
  text: Jonathan said[a], “Far be it from you! If I knew for certain that evil had been determined by my father to come upon you, would I not tell you?”
translation:
  language: tl
  text: Sinabi ni Jonatan, “Huwag nawang mangyari iyon sa iyo! Kung tiyak na alam ko na itinakda na ng aking ama ang kapahamakang darating sa iyo, hindi ko ba iyon sasabihin sa iyo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה לָּךְ
  choice: Huwag mong isipin iyan!
  rationale: Isang mariing pagtanggi ang idyomang Hebreo. Ang saling ito ay natural sa makabagong Filipino at pinananatili ang pagtukoy sa kausap na nasa לָּךְ.
- source_word: כִּי אִם
  choice: Kung
  rationale: Nagpapakilala ito rito ng isang kondisyon; malinaw at natural ang “Kung” sa Filipino.
- source_word: יָדֹעַ אֵדַע
  choice: tiyak kong
  rationale: Ang infinitive absolute na kasama ng pandiwa ay nagbibigay-diin sa katiyakan ng pagkaalam.
- source_word: כָלְתָה הָרָעָה
  choice: buo na ang masamang balak[a]
  rationale: Ipinahihiwatig ng parirala na ang mapaminsalang layunin ay ganap o matatag nang nabuo, habang hindi lubusang nilulutas ang posibleng diwa nitong ‘naitakda’ o ‘ganap na.’
- source_word: מֵעִם אָבִי
  choice: ng aking ama
  rationale: Ipinakikita ang ama ni Jonatan bilang pinagmulan ng masamang balak; natural itong ipinapahayag sa Filipino sa pamamagitan ng pang-ukol na “ng.”
- source_word: לָבוֹא עָלֶיךָ
  choice: na ipahamak ka
  rationale: Inihahayag sa natural na Filipino ang bantang darating laban kay David, nang hindi tinutukoy ang eksaktong paraan ng kapahamakan.
- source_word: וְלֹא אֹתָהּ אַגִּיד לָךְ
  choice: hindi ba sasabihin ko iyon sa iyo?
  rationale: Pinananatili ang retorikal na tanong na umaasa ng positibong sagot at ang tuwirang interpersonal na diwa ng נגד.
