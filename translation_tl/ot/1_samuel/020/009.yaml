  verdict: revise
  source_fidelity: 'Kailangang baguhin ang unang bulalas: ang “Huwag mong isipin iyan!” ay utos sa kausap na huwag mag-isip, samantalang ang חָלִילָה לָּךְ ay mariing pagtanggi/pagnanais na huwag mangyari ang bagay sa kausap. Ang pangunahing sugnay ay mas malinaw ding maipapahayag bilang kapahamakang itinakda ng ama na darating sa kausap, nang hindi tahasang gawing “balak” ang salitang Hebreo.'
  naturalness: Natural at marangal sa modernong Filipino ang “Huwag nawang mangyari iyon sa iyo!” at ang retorikal na “hindi ko ba iyon sasabihin sa iyo?” Ang “Kung tiyak na alam ko” ay malinaw at naipahihiwatig ang pagbibigay-diin ng infinitive absolute.
  terminology: Ang “Jonatan” ay angkop. Ang “kapahamakan” ay angkop sa הָרָעָה sa kontekstong ito at mas tuwiran kaysa “masamang balak,” na isang interpretatibong pagpapalawak. Nananatiling walang doktrinal na idinagdag.
