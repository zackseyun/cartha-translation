revisions:
- from: Pagkatapos, tumakas si David mula sa Naiot sa Rama[a] at pumunta kay Jonatan. Sinabi niya, “Ano ang nagawa ko? Ano ang kasamaan ko, at ano ang kasalanan ko sa harap ng iyong ama, at hinahangad niyang patayin ako?”
  to: Pagkatapos, tumakas si David mula sa Naiot sa Rama[a] at lumapit kay Jonatan. Sinabi niya, “Ano ang nagawa ko? Ano ang pagkakasala ko, at ano ang kasalanan ko sa harap ng iyong ama para hangarin niyang patayin ako?”
  rationale: Inayos ang pangwakas na tanong upang maging wasto at likas sa Tagalog, habang pinananatili ang retorikal na ugnayan ng Hebreong כִּי. Pinalitan ang “pumunta” ng “lumapit” upang mas maipakita ang pagdating ni David sa presensya ni Jonatan, at ginamit ang “pagkakasala” para sa עָוֹן bilang mas angkop na katumbas sa kontekstong ito.
  reviewer_model: gpt-5.6-terra
