base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/001.yaml
  text: Then David fled from Naioth in Ramah and came before Jonathan and said[a], “What have I done? What is my guilt, and what is my sin before your father, that he is seeking my life?”
translation:
  language: tl
  text: Pagkatapos, tumakas si David mula sa Naiot sa Rama[a] at lumapit kay Jonatan. Sinabi niya, “Ano ang nagawa ko? Ano ang pagkakasala ko, at ano ang kasalanan ko sa harap ng iyong ama para hangarin niyang patayin ako?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa Naiot na nasa Rama.” Malamang na ang Hebreo ay tumutukoy sa kilalang lugar na Naiot na kaugnay ng Rama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: tumakas
  rationale: Tumpak na ipinapahayag ang agarang paglayo ni David upang makaligtas, nang hindi dinaragdagan ang paraan ng pagtakas.
- source_word: מִנָּוֹת בָּרָמָה
  choice: mula sa Naiot sa Rama
  rationale: Itinuturing ang נוות bilang kilalang pangalan ng lugar ayon sa konteksto; pinananatili ng “sa Rama” ang lokatibong ugnayan.
- source_word: וַיָּבֹא ... לִפְנֵי יְהוֹנָתָן
  choice: pumunta kay Jonatan
  rationale: Natural sa modernong Tagalog at malinaw na ipinahahayag ang paglapit ni David sa kinaroroonan ni Jonatan; ang literal na “sa harap ni Jonatan” ay maaaring maging matigas o magpahiwatig ng komprontasyon.
- source_word: מֶה עָשִׂיתִי
  choice: Ano ang nagawa ko?
  rationale: Natural na retorikal na tanong na tumutukoy sa anumang nagawa ni David hanggang sa puntong iyon.
- source_word: עֲוֺנִי
  choice: kasamaan ko
  rationale: Sinasaklaw ang masamang gawa o pagkakasalang ipinagtatanggol ni David, habang pinananatiling naiiba sa kasunod na חַטָּאתִי.
- source_word: חַטָּאתִי
  choice: kasalanan ko
  rationale: Pinananatili ang moral at panrelihiyong bigat ng salitang Hebreo.
- source_word: לִפְנֵי אָבִיךָ
  choice: sa harap ng iyong ama
  rationale: Pinananatili ang larawang Hebreo at ang posibleng kahulugang “sa paningin” o “may kaugnayan sa” ama ni Jonatan.
- source_word: כִּי
  choice: at
  rationale: Sa retorikal na tanong, natural na inuugnay ng “at” ang ipinapalagay na pagkakasala sa kasalukuyang paghahangad ni Saul sa buhay ni David, nang hindi labis na nililinaw kung sanhi, resulta, o batayan ang relasyon.
- source_word: מְבַקֵּשׁ אֶת־נַפְשִׁי
  choice: hinahangad niyang patayin ako
  rationale: Natural at malinaw na inilalahad sa Tagalog ang idyomang Hebreo na literal na “hinahanap ang aking buhay,” na nangangahulugang nagsisikap siyang pumatay.
