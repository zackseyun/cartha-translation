  text: Jonathan answered Saul his father and said to him[a], “Why should he be put to death? What has he done?”
translation:
  language: tl
  text: Sumagot si Jonatan sa kanyang amang si Saul at sinabi niya sa kanya, “Bakit siya dapat patayin?[a] Ano ang ginawa niya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Bakit siya kailangang patayin?” Ang pandiwang Hebreo ay partikular na may diwang “ipapatay,” hindi lamang “mamatay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Ang ענה sa pormulang pasalaysay na ito ay nangangahulugang sumagot o tumugon; natural at tuwiran ang “Sumagot” sa makabagong Tagalog.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: אֶת שָׁאוּל אָבִיו
  choice: sa kanyang amang si Saul
  rationale: Malinaw na si Saul ang kinausap at siya ang ama ni Jonatan; natural sa Tagalog ang ayos na ito habang pinananatili ang dalawang impormasyong nasa Hebreo.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: at sinabi rito
  rationale: Pinananatili ang tahasang di-tuwirang layon na “sa kanya”; ang “rito” ay natural na tumutukoy kay Saul sa kasalukuyang pangungusap.
- source_word: לָמָּה
  choice: Bakit
  rationale: Ito ang tuwiran at natural na katumbas ng Hebreong tanong tungkol sa dahilan.
- source_word: יוּמַת
  choice: dapat ipapatay
  rationale: Ang יוּמַת ay Hophal ng מות at may pasibo/kausatibong diwang “patayin” o “ipapatay,” hindi lamang “mamatay.” Ipinahahayag ng “dapat” ang modal na puwersa ng tanong sa konteksto.
- source_word: מֶה עָשָׂה
  choice: Ano ba ang ginawa niya?
  rationale: Tuwirang itinatanong kung anong ginawa o pagkakasala ang maipaparatang; binibigyang-diin ng “ba” ang natural na hamon sa Tagalog nang hindi nagdaragdag ng tiyak na kasalanang hindi tahasang binanggit.
