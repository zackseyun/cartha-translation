  rationale: Inayos ang anyo ng pambungad na kundisyonal upang maging likas sa modernong Filipino at muling isinalita ang talababa upang maipakita ang alternatibong malapit sa Hebreo sa malinaw na Filipino. Hindi binago ang kahulugan ng talata o ang antas ng katiyakan ng Hebreong parirala.
