  text: If he says[a], ‘Good,’ there will be peace for your servant; but if he becomes very angry, know that evil has been determined by him.
translation:
  language: tl
  text: Kung sasabihin niya, “Mabuti,” magiging ligtas ang iyong lingkod. Ngunit kung mag-alab nang husto ang galit niya, alamin mong buo na ang pasiya niyang gumawa ng masama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ganap na ang masama mula sa kanya,” ibig sabihin, matatag na ang pasiya ni Saul na gumawa ng masama.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mabuti
  rationale: Ginamit bilang maikli at eliptikong tugon ng pagsang-ayon ni Saul; likas itong pakinggan sa makabagong usapan at malapit sa Hebreong pang-uri.
- source_word: שָׁלוֹם לְעַבְדֶּךָ
  choice: magiging ligtas ang iyong lingkod
  rationale: Ang שָׁלוֹם dito ay tumutukoy sa kaligtasan at mabuting kalagayan ni David sa harap ni Saul. Pinananatili ng “magiging” ang inaasahang kahulugang panghinaharap, at ang “iyong lingkod” ang mapagpakumbabang pagtukoy ni David sa sarili habang kausap si Jonatan.
- source_word: חָרֹה יֶחֱרֶה לוֹ
  choice: mag-alab nang husto ang galit niya
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa tindi ng galit. Pinananatili ng “mag-alab” ang larawang nasa Hebreo at ng “nang husto” ang diin nito.
- source_word: דַּע
  choice: alamin mong
  rationale: Tuwirang pautos ito kay Jonatan na kilalanin ang kahulugan ng magiging reaksiyon ni Saul.
- source_word: כָלְתָה הָרָעָה מֵעִמּוֹ
  choice: buo na ang pasiya niyang gumawa ng masama
  rationale: Sa konteksto, ang pandiwang כלה ay nagpapahiwatig na ganap at matatag na ang masamang balak na nagmumula kay Saul. Ang salin ay natural sa Filipino habang pinananatili ang moral na bigat ng הָרָעָה.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang magalang at mapagpakumbabang “iyong lingkod,” ang masidhing larawan ng nag-aalab na galit, at ang bahagyang hirap ng huling pariralang Hebreo sa pamamagitan ng talababa.
