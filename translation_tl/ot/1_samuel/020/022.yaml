  yaml_path: translation/ot/1_samuel/020/022.yaml
  text: But if I say this to the young man[a], ‘Look, the arrows are beyond you,’ then go, for Yahweh has sent you away.
translation:
  language: tl
  text: 'Ngunit kung ganito ang sabihin ko sa binata: “Tingnan mo, lampas sa iyo ang mga palaso,” umalis ka, sapagkat pinaalis ka ni Yahweh.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ang salungat na posibilidad sa naunang hudyat ni Jonatan, habang pinananatili ang kondisyonal na diwa.
- source_word: כֹּה אֹמַר לָעֶלֶם
  choice: ganito ang sabihin ko sa binata
  rationale: Natural na Filipino para sa pagpapakilala ng mismong sasabihin; ang עֶלֶם ay tumutukoy sa isang kabataang lalaki, hindi tahasang sa tungkulin niyang tagapaglingkod.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Makabagong panawag-pansin na nagpapanatili sa deiktikong lakas ng Hebreo nang hindi gumagamit ng makalumang pananalita.
- source_word: הַחִצִּים מִמְּךָ וָהָלְאָה
  choice: lampas sa iyo ang mga palaso
  rationale: Ipinahahayag ang lokasyong nasa dako pa roon ng kausap. Maikli at natural ito bilang hudyat na kailangang umalis ni David.
- source_word: לֵךְ
  choice: humayo ka
  rationale: Tuwirang pautos ng הלך. Ang “humayo” ay marangal ngunit malinaw, at ang konteksto ang nagpapakitang pag-alis ang tinutukoy.
- source_word: כִּי שִׁלַּחֲךָ
  choice: sapagkat pinaalis ka
  rationale: Ang כִּי ay nagbibigay ng dahilan, at sa konteksto ang piel ng שׁלח ay nagpapahiwatig ng pagpapayaon o pagpapaalis, hindi lamang pangkalahatang pagsusugo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa pagkilos ni Yahweh sa pag-alis ni David
  choice: pinaalis ka ni Yahweh
  alternative: isinugo ka ni Yahweh
  rationale: Sa konteksto, ang ipinahihiwatig ay ang kinakailangang paglayo ni David. Pinananatili ng “pinaalis” na si Yahweh ang nasa likod ng pag-alis nang hindi ipinahihiwatig na binigyan si David ng isang tiyak na misyon.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pangngalang pantangi ang tetragrammaton sa talata; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “binata” para sa kabataang lalaki at “humayo” bilang maikli ngunit dignified na pautos; iniwasan ang makalumang “narito” bilang salin ng particle na pantawag-pansin.
