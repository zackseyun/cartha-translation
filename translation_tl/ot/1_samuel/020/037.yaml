  text: When the boy came to the place of the arrow that Jonathan had shot[a], Jonathan called after the boy and said, “Is not the arrow beyond you?”
translation:
  language: tl
  text: Nang makarating ang bata sa kinaroroonan ng palaso na ipinana ni Jonatan, tumawag si Jonatan sa likuran ng bata at sinabi, “Hindi ba lampas sa iyo ang palaso?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא הַנַּעַר
  choice: Nang makarating ang bata
  rationale: Ang בוא ay pagdating o paglapit sa isang lugar; ang “makarating” ay natural sa salaysay. Maaaring tumukoy ang נַעַר sa isang kabataan o utusan, ngunit “bata” ang payak na tawag na angkop sa konteksto.
- source_word: עַד מְקוֹם הַחֵצִי
  choice: sa kinaroroonan ng palaso
  rationale: Ipinapahayag ng עַד ang pag-abot sa lugar, at ng מְקוֹם ang kinaroroonan o puwesto. Mas natural sa Filipino ang “kinaroroonan ng palaso” kaysa sa literal na “lugar ng palaso.”
- source_word: אֲשֶׁר יָרָה יְהוֹנָתָן
  choice: na ipinana ni Jonatan
  rationale: Ang ירה sa kontekstong ito ay pagpapakawala ng palaso. Tiyak at likas sa Filipino ang pandiwang “ipinana.”
- source_word: וַיִּקְרָא יְהוֹנָתָן אַחֲרֵי הַנַּעַר
  choice: tinawag ni Jonatan ang bata
  rationale: Ang קרא ... אחרי ay pagtawag sa isang taong nasa unahan o papalayo. Hindi kailangang gawing literal ang אחרי dahil malinaw sa daloy na tinatawag siya ni Jonatan.
- source_word: הֲלוֹא
  choice: Hindi ba
  rationale: Naghuhudyat ito ng retorikal na tanong na umaasang sasang-ayon ang kausap; tuwirang katumbas nito sa modernong Filipino ang “Hindi ba.”
- source_word: מִמְּךָ וָהָלְאָה
  choice: lampas sa iyo
  rationale: Literal itong tumutukoy sa mula sa kinaroroonan ng kausap at pasulong pa. Pinananatili ng “lampas sa iyo” ang direksiyon at ang sadyang hudyat kay David nang hindi labis na nagpapaliwanag.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa salaysay. Ginamit ang “palaso” at “ipinana” bilang karaniwan ngunit dignified na bokabularyo. Walang talababa dahil sapat na naipapahayag ng “lampas sa iyo” ang kahulugan ng pariralang Hebreo at hindi kailangan ng leksikal na alternatibo para maunawaan ang talata.
