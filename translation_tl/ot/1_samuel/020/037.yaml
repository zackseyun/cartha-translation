  source_fidelity: 'Tumpak sa kabuuan ang salin: naipapahayag nito ang pagdating ng batang utusan sa lugar ng palasong pinana ni Jonatan at ang retorikal na tanong tungkol sa palasong nasa lampas niya. Gayunman, ang אַחֲרֵי (“pagkatapos/sa likuran; after”) kasama ng “tumawag” ay malinaw na nagsasaad na tumawag si Jonatan habang nasa unahan o papalayo ang bata. Dapat itong ilahad upang hindi mawala ang direksiyonal na detalye ng Hebreo.'
  naturalness: Natural ang “Nang makarating,” “ipinana,” at “Hindi ba.” Mas malinaw at likas sa modernong Filipino ang “tumawag si Jonatan sa likuran ng bata” kaysa “tinawag ni Jonatan ang bata,” dahil ang huli ay maaaring magpahiwatig lamang ng pagtawag sa pangalan o pagpapalapit nang walang direksiyon.
  terminology: Ang “bata,” “palaso,” at “ipinana” ay angkop sa konteksto at register. Ang “lampas sa iyo” ay wasto para sa מִמְּךָ וָהָלְאָה at pinananatili ang maigsi at may pahiwatig na pananalita ng pinagmulan.
