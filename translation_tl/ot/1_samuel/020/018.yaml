  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘puwesto’ para sa nakatalagang lugar ni David sa hapag, at ‘kapistahan ng bagong buwan’ upang maipakita ang kontekstong ritwal at panghandaan.
