  text: Jonathan said to him[a], “Tomorrow is the new moon, and you will be missed, because your seat will be empty.”
translation:
  language: tl
  text: Sinabi ni Jonatan sa kanya, “Bukas ay bagong buwan, at mapapansin ang pagliban mo, sapagkat magiging bakante ang iyong upuan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapapansin ka … sapagkat mapapansing wala ang iyong upuan.” Inuulit sa Hebreo ang pandiwang פקד sa dalawang sugnay, isang paglalaro ng salita na hindi madaling mapanatili sa Filipino.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ יְהוֹנָתָן
  choice: Sinabi sa kanya ni Jonatan
  rationale: Likas na ayos sa makabagong Filipino para sa karaniwang pambungad ng tuwirang pananalita; isinalin ang pangalang יְהוֹנָתָן bilang Jonatan ayon sa nakasanayang anyong Filipino.
- source_word: מָחָר
  choice: Bukas
  rationale: Tuwirang katumbas ng pang-abay na tumutukoy sa susunod na araw.
- source_word: חֹדֶשׁ
  choice: kapistahan ng bagong buwan
  rationale: Sa konteksto ng handaan sa palasyo, tumutukoy ito sa pagdiriwang sa bagong buwan, hindi lamang sa isang buwan bilang yunit ng panahon. Idinagdag ang ‘kapistahan’ upang maging malinaw at natural sa Filipino.
- source_word: וְנִפְקַדְתָּ
  choice: Mapapansin na wala ka
  rationale: Ipinahahayag ng Nifal ng פקד na mapapansin ang pagkawala o pagliban ni David. Mas malinaw ito sa Filipino kaysa sa ‘hahanapin ka,’ na maaaring magpahiwatig ng aktuwal na paghahanap.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit mapapansin ang pagkawala ni David; ang ‘sapagkat’ ay dignified ngunit pangkaraniwan pa rin.
- source_word: יִפָּקֵד מוֹשָׁבֶךָ
  choice: walang uupo sa iyong puwesto
  rationale: Ang ikalawang Nifal ng פקד ay tumutukoy sa pagiging bakante o walang laman ng nakatalagang upuan. Ang pariralang ito ay natural sa Filipino at malinaw na inilalarawan ang resulta, bagaman hindi nito matutularan ang pag-uulit ng pandiwa sa Hebreo.
