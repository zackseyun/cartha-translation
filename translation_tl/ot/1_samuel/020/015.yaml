source:
  edition: WLC
  text: וְ/לֹֽא תַכְרִ֧ת אֶֽת חַסְדְּ/ךָ֛ מֵ/עִ֥ם בֵּיתִ֖/י עַד עוֹלָ֑ם וְ/לֹ֗א בְּ/הַכְרִ֤ת יְהוָה֙ אֶת אֹיְבֵ֣י דָוִ֔ד אִ֕ישׁ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/015.yaml
  text: And you shall not cut off your steadfast love from my house forever[a], not even when Yahweh cuts off David’s enemies, every one of them, from the face of the earth.
translation:
  language: tl
  text: At huwag mong kailanman alisin sa aking sambahayan ang iyong tapat na pag-ibig[a], kahit sa panahong alisin ni Yahweh sa balat ng lupa ang bawat isa sa mga kaaway ni David.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang iyong katapatan sa tipan” o “ang iyong matapat na pagmamahal.” Ang Hebreong חֶסֶד ay madalas tumukoy sa pag-ibig at katapatang nananatili sa loob ng isang ugnayang tipan.
    reason: lexical_alternative
  - marker: b
    text: Iisang salitang-ugat sa Hebreo ang ginamit para sa hindi “pag-aalis” ng tapat na pag-ibig at sa “pag-aalis” ni Yahweh sa mga kaaway ni David.
    reason: wordplay
lexical_decisions:
- source_word: תַכְרִת / בְּהַכְרִת (כרת)
  choice: alisin / inalis
  rationale: 'Ginamit ang iisang salitang-ugat sa dalawang sugnay upang mapanatili ang pag-uugnay ng Hebreo: hinihiling ni Jonatan na huwag alisin ni David ang kaniyang tapat na pag-ibig, kahit kapag inalis naman ni Yahweh ang mga kaaway ni David. Mas natural ito sa modernong Tagalog kaysa sa literal na “putulin.”'
- source_word: חַסְדְּךָ
  choice: iyong tapat na pag-ibig
  rationale: Ipinahahayag nito kapwa ang pag-ibig at ang matatag na katapatang kaakibat ng ugnayang tipan, nang hindi ginagawang teknikal na terminong legal ang pangunahing teksto.
- source_word: מֵעִם בֵּיתִי
  choice: sa aking sambahayan
  rationale: Ang “sambahayan” ay likas sa Tagalog at maaaring tumukoy sa pamilya at mga inapo ni Jonatan, hindi lamang sa gusaling tinitirhan.
- source_word: עַד עוֹלָם
  choice: kailanman
  rationale: Sa ilalim ng negatibong utos, ang “huwag ... kailanman” ang natural na paraan sa Tagalog upang ipahayag na hindi ito dapat alisin magpakailanman.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֹיְבֵי דָוִד
  choice: mga kaaway ni David
  rationale: Direkta at natural na katumbas ng Hebreong construct phrase.
- source_word: אִישׁ
  choice: ang bawat isa
  rationale: 'Pinananatili nito ang distributibong diin ng pang-isahang אִישׁ pagkatapos ng pangmaramihang “mga kaaway”: walang isa man sa kanila ang hindi saklaw.'
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: sa balat ng lupa
  rationale: Karaniwang maringal na idyoma sa Tagalog na katumbas ng Hebreong pahayag tungkol sa lubos na pag-aalis mula sa lupa.
- source_word: וְלֹא ... וְלֹא
  choice: At huwag ... kahit kapag
  rationale: Ikinakabit ng “kahit kapag” ang ikalawang sugnay bilang mariing pagpapalawak sa pakiusap ni Jonatan, habang hindi itinatanggi na maaaring basahin ang sintaks nang mas maluwag.
theological_decisions:
- issue: Kahulugan ng חֶסֶד sa konteksto ng tipan
  choice: “tapat na pag-ibig,” na may pahiwatig ng katapatan sa tipan
  alternative: “katapatan sa tipan,” “matapat na pagmamahal,” o “kabutihan”
  rationale: Nasa konteksto ang tipan nina Jonatan at David, kaya higit ito sa karaniwang kabaitan. Gayunman, hindi kailangang paliitin ang salita sa isang teknikal na katawagang legal.
- issue: Ugnayan ng ikalawang sugnay sa pakiusap ni Jonatan
  choice: Saklaw pa rin ng pakiusap ang panahong aalisin ni Yahweh ang mga kaaway ni David
  alternative: Maaaring ituring na mas malayang pangungusap o panaklong ang pahayag tungkol sa pag-aalis ni Yahweh sa mga kaaway ni David
  rationale: Pinakamalinaw na ipinahihiwatig ng pagkakasunod ng mga sugnay na humihingi si Jonatan ng patuloy na katapatan para sa kaniyang sambahayan kahit sa gitna ng paghatol sa mga kaaway ni David.
- issue: Distributibong gamit ng אִישׁ
  choice: “ang bawat isa sa mga kaaway”
  alternative: “bawat lalaki” o “bawat isa”
  rationale: Naipapakita ng “bawat isa” ang indibiduwal at lubos na saklaw ng Hebreo nang hindi nagpapasok ng di-tiyak na pag-angkin na pawang lalaki ang tinutukoy na mga kaaway.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” para sa pampamilya at posibleng pang-inapong diwa ng בַּיִת, at “balat ng lupa” upang mapanatili ang solemneng idyoma. Iniwasan ang sobrang literal na “putulin,” na hindi likas kapag tumutukoy sa pag-ibig o sa mga kaaway sa Tagalog.
