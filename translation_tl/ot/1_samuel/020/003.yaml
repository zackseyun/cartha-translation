base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/003.yaml
  text: But David swore again and said, “Your father certainly knows that I have found favor in your eyes, and he has said, ‘Jonathan must not know this, lest he be grieved.’ But as the LORD lives, and as your soul lives, there is only a step between me and death.”
translation:
  language: tl
  text: Ngunit muling nanumpa si David at sinabi, “Tiyak na alam ng iyong ama na nakasumpong ako ng pabor sa iyo, at sinabi niya, ‘Hindi dapat malaman ito ni Jonatan, baka malungkot siya.’ Ngunit kung paanong buhay si Yahweh at buhay ka, isang hakbang lamang ang nasa pagitan ko at ng kamatayan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: kinalulugdan mo ako
  rationale: Natural na salin ng Hebreong idyomang literal na ‘nakasumpong ako ng biyaya sa iyong mga mata’; ipinahahayag nito ang pabor o mabuting pagtingin ni Jonatan kay David.
- source_word: אַל יֵדַע זֹאת יְהוֹנָתָן
  choice: Hindi dapat malaman ito ni Jonatan
  rationale: Pinananatili ang diwa ng negatibong jussive at ang pananaw ng siniping iniisip o sinabi ni Saul, nang hindi ito ginagawang tahasang utos sa isang di-tiyak na kausap.
- source_word: חַי יְהוָה
  choice: buhay si Yahweh
  rationale: Pinananatili ang anyo ng sinaunang pormula ng panunumpa at ang personal na pangalan ng Diyos sa tekstong Hebreo.
- source_word: חֵי נַפְשְׁךָ
  choice: buhay ka rin
  rationale: Natural na Filipino para sa pormulang literal na ‘buhay ang iyong kaluluwa/buhay,’ na tumutukoy sa buhay ng kausap.
- source_word: כְפֶשַׂע בֵּינִי וּבֵין הַמָּוֶת
  choice: isang hakbang na lamang ang pagitan ko at ng kamatayan
  rationale: Ang פֶּשַׂע ay tumutukoy rito sa napakaliit na agwat, karaniwang inuunawang isang hakbang; ang ‘na lamang’ ay likas na nagpapahayag ng nalalapit na panganib.
theological_decisions:
- issue: Paglalahad sa banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang transliterasyon ay malinaw na kumakatawan sa personal na pangalang nasa Hebreo at iniiwasang ipagkamali ito sa titulong ‘Panginoon.’
- issue: Saklaw ng panunumpa ni David
  choice: 'Pinanatili ang dalawang pormula: ‘buhay si Yahweh’ at ‘buhay ka rin’'
  alternative: Pagsamahin bilang isang malayang pahayag ng katiyakan
  rationale: Mahalaga sa diin ng talata ang magkatabing panawagan sa buhay ni Yahweh at sa buhay ni Jonatan; hindi ito dapat pahinain o gawing paliwanag lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Jonatan’ bilang karaniwang anyong Tagalog ng pangalan. Pinanatili ang tuwirang pananalita at matinding tono ng panunumpa nang hindi ginagawang mas tiyak kaysa sa Hebreo ang pagkakaugnay ng mga sugnay.
