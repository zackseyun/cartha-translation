  source_fidelity: 'Kailangang ayusin ang ilang detalye upang mas tumpak na maipakita ang Hebreo: ang ''kaya'' ay nagdaragdag ng ugnayang sanhi na wala sa teksto, at ang huling parirala ay dapat idiomatikong bumuo ng ''sa pagitan ko at ng kamatayan.'' Pinananatili ng rebisyon ang panunumpang pormula at ang metaporang ''isang hakbang.'''
  naturalness: Malinaw at makabago ang pangkalahatang Tagalog, ngunit mas natural ang 'nakasumpong ako ng pabor sa iyo' para sa idyoma at 'nasa pagitan ko at ng kamatayan' para sa huling sugnay. Ang 'Kung paanong buhay...' ay likas na Filipino na naghuhudyat ng panunumpa.
  terminology: Ang 'Yahweh' ay angkop na representasyon ng יהוה, at ang 'Jonatan' ay wastong karaniwang anyong Tagalog. Ang 'pabor' ay angkop para sa חֵן sa kontekstong ito.
