  to: Ngunit muling nanumpa si David at sinabi, “Tiyak na alam ng iyong ama na nakasumpong ako ng pabor sa iyo, at sinabi niya, ‘Hindi dapat malaman ito ni Jonatan, baka malungkot siya.’ Ngunit kung paanong buhay si Yahweh at buhay ka, isang hakbang lamang ang nasa pagitan ko at ng kamatayan.”
