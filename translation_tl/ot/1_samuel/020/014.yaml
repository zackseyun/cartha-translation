id: 1SA.20.14
reference: 1 Samuel 20:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לֹ֖א אִם עוֹדֶ֣/נִּי חָ֑י וְ/לֹֽא תַעֲשֶׂ֧ה עִמָּדִ֛/י חֶ֥סֶד יְהוָ֖ה וְ/לֹ֥א אָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/014.yaml
  text: And if I am still alive[a], will you not show me Yahweh’s covenant faithfulness, so that I may not die?
translation:
  language: tl
  text: At kung buhay pa ako, hindi mo ba ako pakikitaan ng tapat na pag-ibig ni Yahweh[a], upang hindi ako mamatay?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katapatan sa tipan alang-alang kay Yahweh” o “katapatang gaya ng kay Yahweh.” Maaaring tumukoy ang pariralang Hebreo sa sariling tapat na pag-ibig ni Yahweh, o sa katapatang dapat ipakita ni David sa ilalim ng tipan at sa pangalan ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אִם
  choice: At kung
  rationale: Sa konteksto ng panunumpa at pakiusap, ang mahirap na pagkakasunod na ito ay inuunawang idyomatikong pagpapatuloy ng pakiusap, hindi bilang payak na dobleng pagtanggi.
- source_word: עוֹדֶנִּי חָי
  choice: buhay pa ako
  rationale: Likas na modernong Tagalog ito para sa temporal na diwang ‘ako ay nabubuhay pa.’
- source_word: תַעֲשֶׂה עִמָּדִי
  choice: ako pakikitaan
  rationale: Kasama ng חֶסֶד, ang literal na ‘gawin sa akin/kasama ko’ ay natural na naipahahayag sa Tagalog bilang ‘pakikitaan ako.’
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Saklaw nito ang matatag at mapagkakatiwalaang pagmamahal o katapatan sa isang ugnayang may tipan, nang hindi ginagawang teknikal o di-likas ang pangunahing teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa titik ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְלֹא אָמוּת
  choice: upang hindi ako mamatay
  rationale: Ipinahahayag nito ang layunin o inaasahang bunga ng pakiusap ni Jonatan at natural ang anyong ito sa Tagalog.
theological_decisions:
- issue: Diwa ng חֶסֶד יְהוָה
  choice: tapat na pag-ibig ni Yahweh
  alternative: katapatan sa tipan alang-alang kay Yahweh / katapatang gaya ng kay Yahweh
  rationale: Pinananatili ng pangunahing salin ang konstruksiyong maaaring tumukoy sa mismong tapat na pag-ibig ni Yahweh, habang ipinapaliwanag sa talababa ang posibilidad na tumukoy ito sa katapatang dapat ipakita ni David sa ilalim ng tipan at sa pangalan ni Yahweh.
- issue: Anyo ng pakiusap sa mga negatibong kataga
  choice: 'isang retorikal na tanong: ‘hindi mo ba…?’'
  alternative: isang tuwirang pakiusap o mariing panunumpa
  rationale: Sinusundan nito ang posibleng puwersa ng וְלֹא sa pangungusap at pinananatili ang tensiyon ng pakiusap, bagaman mahirap at maaaring unawain sa ibang paraan ang sintaks ng Hebreo.
- issue: Pangalan ng Diyos
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa tekstong pinagmulan ang Tetragrammaton יְהוָה; pinananatili rito ang personal na pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘pakikitaan’ at ‘tapat na pag-ibig’ upang maging natural sa karaniwang mambabasa habang pinananatili sa talababa ang mas teknikal na diwa ng katapatan sa tipan.
