base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/042.yaml
  text: Jonathan said to David, “Go in peace, because the two of us have sworn in the name of the LORD, saying, ‘May the LORD be between me and you, and between my offspring and your offspring forever.’”
translation:
  language: tl
  text: Sinabi ni Jonatan kay David, “Humayo ka nang payapa, dahil tayong dalawa ay nanumpa sa pangalan ni Yahweh, na sinasabi, ‘Nawa’y si Yahweh ang nasa pagitan nating dalawa, at sa pagitan ng mga supling ko at ng mga supling mo magpakailanman.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ לְשָׁלוֹם
  choice: Humayo ka nang payapa
  rationale: Pinananatili ang Hebreong pormula ng mapayapang pagpapaalam sa natural at marangal na Tagalog; ang שָׁלוֹם ay higit sa kawalan ng alitan ngunit ang “payapa” ang pinakamaikli at malinaw na katumbas dito.
- source_word: בְּשֵׁם יְהוָה
  choice: sa pangalan ni Yahweh
  rationale: Tuwirang kinikilala ang personal na pangalan ng Diyos na יהוה sa halip na palitan ito ng isang titulo.
- source_word: זַרְעִי ... זַרְעֲךָ
  choice: mga supling ko ... mga supling mo
  rationale: Ang kolektibong זֶרַע ay tumutukoy sa mga inapo; ang “mga supling” ay natural at nagpapanatili sa ugnayang pampamilya sa sumpaan.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Karaniwang katumbas sa Tagalog para sa walang takdang pagpapatuloy na ipinahahayag ng parirala.
theological_decisions:
- issue: Kahulugan ng יְהוָה יִהְיֶה בֵּינִי וּבֵינֶךָ
  choice: Nawa’y si Yahweh ang nasa pagitan nating dalawa
  alternative: Nawa’y si Yahweh ang maging saksi sa ating dalawa / mamagitan sa ating dalawa
  rationale: Hindi idinagdag ang “saksi,” bagaman maaaring iyon ang ipinahihiwatig ng konteksto, at iniwasan din ang “mamagitan,” na maaaring magpahiwatig ng pakikipagkasundo. Pinananatili ng salin ang larawan at tunay na lawak ng Hebreong pahayag.
- issue: Puwersa ng אֲשֶׁר pagkatapos ng “Humayo ka nang payapa”
  choice: dahil
  alternative: yamang / tungkol sa sumpang ginawa nating dalawa
  rationale: Sa konteksto, ang naunang sumpaan ang batayan ng mapayapang paghihiwalay. Ang “dahil” ay malinaw at kaayon ng ugnayang ipinahihiwatig ng Hebreo nang hindi nagdaragdag ng doktrinal na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Humayo” upang mapanatili ang pormal at madamdaming tono ng pagpapaalam, ngunit nananatiling madaling maunawaan. Ang ayos na “tayong dalawa” at “nating dalawa” ay likas sa Tagalog at malinaw na nagpapakita ng katumbasang relasyon nina Jonatan at David.
