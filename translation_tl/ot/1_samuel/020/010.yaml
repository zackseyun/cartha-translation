  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang dalawang tanong at ang “O” ng pinagmulang Hebreo, ngunit inayos ang ikalawang tanong upang maging natural nang hindi itinatago ang pagiging masinsin ng orihinal.
