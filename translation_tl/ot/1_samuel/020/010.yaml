  text: Then David said to Jonathan[a], “Who will tell me? Or what if your father answers you harshly?”
translation:
  language: tl
  text: Pagkatapos, sinabi ni David kay Jonatan[a], “Sino ang magsasabi sa akin? O paano kung mabagsik ang isagot sa iyo ng iyong ama?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, literal: “Sino ang magsasabi sa akin? O ano ang isasagot sa iyo ng iyong ama—mabagsik?” Maikli at eliptiko ang pagkakabuo sa Hebreo; nilinaw sa salin ang ipinahihiwatig na diwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Filipino ang “Pagkatapos, sinabi” bilang pagpapakita ng pagkakasunod-sunod.
- source_word: דָּוִד
  choice: David
  rationale: Karaniwang anyo ng pangalang ito sa Filipino.
- source_word: אֶל יְהוֹנָתָן
  choice: kay Jonatan
  rationale: Likas na Filipino para sa pagsasalita sa isang taong may pangalan; ginamit ang karaniwang anyong Filipino na “Jonatan.”
- source_word: מִי יַגִּיד לִי
  choice: Sino ang magsasabi sa akin?
  rationale: Tuwirang pinananatili ang unang tanong at ang diwa ng Hiphil ng נגד na “magsabi/magbalita.”
- source_word: אוֹ
  choice: O paano kung
  rationale: Pinananatili ng “O” ang disjunctive na puwersa ng Hebreo, habang ipinahahayag ng “paano kung” ang eliptiko at ikinababahalang kalagayan sa natural na Filipino.
- source_word: מַה יַּעַנְךָ אָבִיךָ קָשָׁה
  choice: malupit ang isagot sa iyo ng iyong ama
  rationale: Ang ענה ay “sumagot,” at ang קָשָׁה ay naglalarawan sa sagot bilang mabagsik o malupit. Ang ayos na ito ay natural sa Filipino at hindi inaalis ang ideya ng “kung ano ang isasagot.”
