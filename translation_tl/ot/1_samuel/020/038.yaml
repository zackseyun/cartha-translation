base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/038.yaml
  text: And Jonathan called after the boy[b][a], “Hurry! Be quick! Do not stop!” So Jonathan’s boy gathered up the arrows and came to his master.
translation:
  language: tl
  text: At sumigaw si Jonatan sa batang lingkod na nasa unahan niya, “Magmadali ka! Bilisan mo! Huwag kang tumigil![a]” Kaya pinulot ng batang lingkod ni Jonatan ang mga palaso[b] at lumapit sa kanyang amo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Huwag kang tumayo.” Sa kontekstong ito, ang diwa ay “Huwag kang tumigil.”
    reason: lexical_alternative
  - marker: b
    text: Ang anyong Hebreo para sa “mga palaso” ay nakasulat sa paraang maaaring magmukhang isahan, ngunit malinaw sa konteksto na tumutukoy ito sa mga palasong ipinana ni Jonatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אַחֲרֵי הַנַּעַר
  choice: sumigaw ... sa batang lingkod na nasa unahan niya
  rationale: Ang קרא kasama ng אחרי ay pagtawag nang malakas sa isang taong nasa unahan o papalayo. Nililinaw ng salin ang ayos ng mga tauhan nang hindi dinaragdagan ang kilos.
- source_word: הַנַּעַר / נַעַר יְהוֹנָתָן
  choice: batang lingkod / batang lingkod ni Jonatan
  rationale: Ang נַעַר ay maaaring tumukoy sa isang bata o kabataang tauhan. Ang “batang lingkod” ay nagpapanatili kapwa sa pahiwatig ng edad at sa tungkulin niya kay Jonatan.
- source_word: מְהֵרָה חוּשָׁה
  choice: Magmadali ka! Bilisan mo!
  rationale: Magkahiwalay na ipinahayag ang dalawang magkasunod na panawagan upang mapanatili ang inuulit na pagmamadali sa Hebreo.
- source_word: אַל תַּעֲמֹד
  choice: Huwag kang tumigil!
  rationale: Literal itong “Huwag kang tumayo/manatiling nakatayo,” ngunit sa konteksto ay inuudyukan siyang huwag huminto sa ginagawa o pagtakbo.
- source_word: וַיְלַקֵּט
  choice: pinulot
  rationale: Ang לקט ay mangalap o magtipon; ang “pinulot” ang likas na salitang Filipino para sa pagkuha ng mga palaso mula sa lupa.
- source_word: החצי
  choice: mga palaso
  rationale: Bagaman ang nakasulat na anyo ay maaaring magmukhang isahan, malinaw sa konteksto na tinutukoy ang mga palasong ipinana ni Jonatan.
- source_word: אֶל אֲדֹנָיו
  choice: sa kanyang amo
  rationale: Tumutukoy ang אָדוֹן dito sa taong pinaglilingkuran ng batang lingkod. Ang “amo” ay karaniwang katawagan sa ugnayang ito at umiiwas sa di-kinakailangang teolohikal na dating ng “panginoon.”
