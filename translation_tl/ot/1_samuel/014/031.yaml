  yaml_path: translation/ot/1_samuel/014/031.yaml
  text: That day they struck down the Philistines from Mikmash to Aijalon[a], and the people were very weary.
translation:
  language: tl
  text: Noong araw na iyon, nilupig nila ang mga Filisteo mula sa Mikmas hanggang sa Ayalon, at labis na napagod ang mga tao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: nilupig nila
  rationale: Ang נכה sa kontekstong militar ay tumutukoy sa pananakit o pagtalo sa kaaway. Ang “nilupig” ay natural sa makabagong Filipino at malinaw na naghahatid ng militar na diwa nang hindi tiyak na nagsasabing pinatay ang lahat.
- source_word: בַּיּוֹם הַהוּא
  choice: Nang araw na iyon
  rationale: Likas at malinaw na katumbas sa Filipino ng panandang temporal na Hebreo.
- source_word: בַּפְּלִשְׁתִּים
  choice: ang mga Filisteo
  rationale: Tuwirang tawag sa pangkat na sinalakay; ginamit ang karaniwang anyong Filipino na “Filisteo.”
- source_word: מִמִּכְמָשׂ אַיָּלֹנָה
  choice: mula sa Mikmas hanggang sa Ayalon
  rationale: Ipinahihiwatig ng מִן ang pinagmulan at ng directional -ה sa אַיָּלֹנָה ang patunguhan. Ang “mula ... hanggang sa ...” ang natural na pagpapahayag ng saklaw na heograpiko.
- source_word: וַיָּעַף
  choice: napagod
  rationale: Ang pandiwa ay nagsasaad ng panghihina o matinding pagkapagod. Ang “napagod” ay dignified at pangkaraniwang Filipino; pinatitindi ito ng kasunod na מְאֹד.
- source_word: הָעָם
  choice: ang mga tauhan
  rationale: Bagaman literal na “ang bayan/mga tao,” sa konteksto ito ay tumutukoy sa pangkat ng mga Israelitang mandirigma. Ang “mga tauhan” ay natural at hindi kasing tiyak ng “mga sundalo.”
- source_word: מְאֹד
  choice: labis
  rationale: Karaniwang panangkap na pampatindi; ang “labis na” ay natural na katumbas sa Filipino.
theological_decisions: []
translation_notes:
  register: 'Makabagong Filipino na malinaw, dignified, at angkop sa salaysay. Pinanatili ang mga pangalang pook ayon sa anyong malapit sa Hebreo: Mikmas at Ayalon. Walang footnote dahil walang tunay na tekstuwal o teolohikal na kalabuan na nangangailangan nito; ang English footnote tungkol sa “Michmash” ay hindi nauugnay sa baybay-Filipino.'
