base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/001.yaml
  text: One day Jonathan son of Saul said to the young man who carried his armor[a], “Come[b], let us cross over to the Philistine garrison that is on the other side.” But he did not tell his father.
translation:
  language: tl
  text: Isang araw, sinabi ni Jonatan na anak ni Saul sa binatang tagapagdala ng kanyang mga sandata, “Halika, tumawid tayo papunta sa himpilan[a] ng mga Filisteo na nasa kabilang panig.” Ngunit hindi niya ito sinabi sa kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “puwesto” o “nakatalagang hukbo” ng mga Filisteo. Ang salitang Hebreo ay maaaring tumukoy sa isang himpilang militar o sa mga kawal na nakatalaga roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Isang araw
  rationale: Natural na panimulang salaysay sa modernong Tagalog na tapat sa Hebreong idyoma nang hindi ginagawang literal at mabigat.
- source_word: הַנַּעַר נֹשֵׂא כֵלָיו
  choice: sa binatang tagapagdala ng kanyang mga sandata
  rationale: Ang נַעַר ay angkop na 'binata' sa kontekstong militar, at ang כֵלִים ay maaaring tumukoy sa kagamitan o mga sandata; inilalarawan ng parirala ang tungkulin niya nang malinaw.
- source_word: לְכָה וְנַעְבְּרָה
  choice: Halika, tumawid tayo
  rationale: Pinananatili ang paanyaya at ang cohortative na diwa, pati ang direksiyon ng pagtawid.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: himpilan ng mga Filisteo
  rationale: Sa kontekstong militar, maaaring tumukoy ang מַצָּב sa isang puwesto o nakatalagang pangkat ng kawal; natural at sapat na malawak ang 'himpilan'.
- source_word: אֲשֶׁר מֵעֵבֶר הַלָּז
  choice: na nasa kabilang panig
  rationale: Pinananatili ang deiktikong diwa nang hindi ipinapasok sa pangunahing teksto ang 'daanan,' na hindi tahasang binanggit sa Hebreo.
- source_word: וּלְאָבִיו לֹא הִגִּיד
  choice: Ngunit hindi niya ito sinabi sa kanyang ama
  rationale: Ipinapakita ng 'Ngunit' ang salungat na tala sa salaysay, at natural na katumbas ng הִגִּיד ang 'sinabi' sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang 'Jonatan' at 'Filisteo' bilang karaniwang anyong biblikal sa Tagalog. Iniwasang gawing tahasang 'daanan' ang deiktikong parirala sapagkat ipinahihiwatig lamang iyon ng kasunod na konteksto.
