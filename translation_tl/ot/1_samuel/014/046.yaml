  text: Then Saul went up from pursuing the Philistines[a], and the Philistines went to their own place.
translation:
  language: tl
  text: Pagkatapos, itinigil ni Saul ang paghabol sa mga Filisteo[a], at pumunta ang mga Filisteo sa kanilang lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umalis si Saul mula sa pagtugis sa mga Filisteo.” Literal sa Hebreo, “umakyat mula sa likuran ng mga Filisteo,” isang idyoma para sa pagtigil sa paghabol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: tumigil
  rationale: Bagaman literal na nangangahulugang “umakyat” ang עלה, kasama ng מֵאַחֲרֵי sa kontekstong militar ay ipinahihiwatig nito ang pag-alis o pagtigil sa pagtugis. Ang “tumigil” ang likas at malinaw na pagpapahayag nito sa modernong Tagalog.
- source_word: מֵאַחֲרֵי
  choice: sa paghabol sa
  rationale: Ang literal na “mula sa likuran ng” ay isang idyomatikong paglalarawan ng pagwawakas sa paghabol. Pinananatili ng “sa paghabol sa” ang kilos na tinutukoy nang hindi mabigat pakinggan.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Ito ang karaniwang Tagalog na tawag sa pangkat-etnikong Philistine.
- source_word: הָלְכוּ
  choice: umuwi
  rationale: Pangunahing ibig sabihin ng הלך ay “pumunta” o “lumakad,” ngunit dahil sinusundan ito ng “sa kanilang lugar,” natural na ipinahahayag sa Tagalog ang kontekstuwal na diwang pagbalik bilang “umuwi.”
- source_word: לִמְקוֹמָם
  choice: sa kani-kanilang lugar
  rationale: Ang מָקוֹם ay “lugar,” at ang hulaping pangmaramihan ay “kanilang.” Ang “kani-kanilang” ay likas sa Tagalog at hindi gaya ng “tahanan,” na magiging mas tiyak kaysa sa Hebreo.
