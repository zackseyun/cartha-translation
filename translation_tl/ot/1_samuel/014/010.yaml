  text: וְ/אִם כֹּ֨ה יֹאמְר֜וּ עֲל֤וּ עָלֵ֨י/נוּ֙ וְ/עָלִ֔ינוּ כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יָדֵ֑/נוּ וְ/זֶה לָּ֖/נוּ הָ/אֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/010.yaml
  text: But if they say this[a], ‘Come up to us,’ then we will go up, for Yahweh has given them into our hand[b], and this will be the sign for us.
translation:
  language: tl
  text: Ngunit kung sabihin nila, “Umakyat kayo rito sa amin,”[a] aakyat tayo, sapagkat ibinigay na sila ni Yahweh sa ating kamay,[b] at ito ang magiging tanda para sa atin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Umakyat kayo laban sa amin.” Maaaring idiin ng Hebreo ang paglapit sa kinaroroonan ng mga Filisteo, habang ipinahihiwatig ng konteksto ang pakikipaglaban.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa ating kamay,” isang idyomang nangangahulugang nasa ating kapangyarihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Iniuugnay nito ang ikalawang kondisyon sa naunang posibilidad habang malinaw na ipinakikita ang pagsalungat.
- source_word: כֹּה יֹאמְרוּ
  choice: sabihin nila
  rationale: Likas na paraan ito sa modernong Tagalog upang ipakilala ang mismong sasabihin sa kondisyong pangungusap; hindi kailangang isalin nang hiwalay ang כֹּה.
- source_word: עֲלוּ עָלֵינוּ
  choice: Umakyat kayo rito sa amin
  rationale: Pinananatili ang literal na pag-akyat patungo sa mataas na kinaroroonan ng mga Filisteo. Ipinahihiwatig ng konteksto ang pakikipaglaban, ngunit hindi iyon tahasang isinasama sa pangunahing teksto.
- source_word: וְעָלִינוּ
  choice: aakyat tayo
  rationale: Ang anyong Hebreo ay nagsasaad ng kasunod na gagawin kapag natupad ang kondisyon; malinaw na ito sa ayos ng pangungusap sa Tagalog.
- source_word: כִּי נְתָנָם
  choice: sapagkat ibinigay na sila
  rationale: Ipinakikita ng ganap na anyo ang tiyak na pagtitiwala ni Jonatan na ipinasiya na ng Diyos ang kalalabasan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: בְּיָדֵנוּ
  choice: sa ating kamay
  rationale: Pinananatili ang isahang larawan ng idyomang Hebreo, na nangangahulugang nasa kapangyarihan o kontrol nila.
- source_word: וְזֶה לָּנוּ הָאוֹת
  choice: at ito ang magiging tanda para sa atin
  rationale: Ang ‘magiging’ ay likas na nagpapahayag na ang tanda ay inaasahan pang mangyari ayon sa kondisyon.
theological_decisions:
- issue: Paglalarawan sa tiyak na kilos ng Diyos sa נְתָנָם
  choice: ibinigay na sila ni Yahweh
  alternative: ibibigay sila ni Yahweh
  rationale: Ang ganap na pandiwa ay pinananatiling pahayag ng tiyak na pagtitiwala, nang hindi ipinapalagay na pisikal nang naganap ang tagumpay.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa Hebreo; ang transliterasyong ‘Yahweh’ ang nagpapanatili nito sa halip na palitan ng isang titulo.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang larawang ‘umakyat’ dahil mahalaga ang mataas na posisyon ng mga Filisteo, at ang idyomang ‘sa ating kamay’ ay ipinaliwanag sa talababa.
