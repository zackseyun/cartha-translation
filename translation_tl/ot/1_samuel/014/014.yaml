  yaml_path: translation/ot/1_samuel/014/014.yaml
  text: That first slaughter[a], which Jonathan and his armor-bearer made, was about twenty men within about half a furrow in an acre of a field.
translation:
  language: tl
  text: Sa unang pagsalakay, nakapatay sina Jonatan at ang tagapagdala ng kaniyang sandata ng humigit-kumulang dalawampung lalaki, sa isang bahaging halos kalahating tudling ng lupang kayang araruhin ng isang pares ng baka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong lawak. Literal na, “sa halos kalahati ng isang tudling ng isang pares ng bukid”; malamang na tumutukoy ito sa lupang kayang araruhin ng isang pares ng baka.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּכָּה הָרִאשֹׁנָה
  choice: unang pagsalakay
  rationale: Sa kontekstong militar, ang מַכָּה ay isang nakamamatay na pagsalakay o pagpaslang. Mas natural sa modernong Tagalog ang “unang pagsalakay,” habang malinaw na ipinahahayag ng kasunod na “napatay” ang nakamamatay na resulta.
- source_word: אֲשֶׁר הִכָּה יוֹנָתָן וְנֹשֵׂא כֵלָיו
  choice: nina Jonatan at ng tagapagdala niya ng sandata, napatay nila
  rationale: Ang נכה ay literal na “humampas” o “pabagsakin,” ngunit sa konteksto ay tumutukoy sa pagpatay. Ang “tagapagdala niya ng sandata” ay malinaw at likas na katumbas ng tungkuling militar na נֹשֵׂא כֵלִים.
- source_word: כְּעֶשְׂרִים אִישׁ
  choice: humigit-kumulang dalawampung lalaki
  rationale: Pinananatili ng “humigit-kumulang” ang pagtatantiyang ipinahihiwatig ng prefiks na כְּ.
- source_word: כְּבַחֲצִי מַעֲנָה
  choice: halos kalahating tudling
  rationale: Ang מַעֲנָה ay tudling o bahaging inararo. Pinananatili ng “halos” ang ikalawang pagtatantiyang nasa Hebreo.
- source_word: צֶמֶד שָׂדֶה
  choice: isang sukat ng bukid na kayang araruhin ng isang pares ng baka
  rationale: Ang צֶמֶד ay literal na pares o pamatok at dito ay ginagamit bilang panukat ng lupang kayang araruhin ng magkaparis na hayop. Iniwasan ang “acre” dahil hindi tiyak ang eksaktong modernong katumbas.
