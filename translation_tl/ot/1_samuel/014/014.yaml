- from: Sa unang pagsalakay nina Jonatan at ng tagapagdala niya ng sandata, napatay nila ang humigit-kumulang dalawampung lalaki sa loob ng lugar na halos kalahating tudling sa isang sukat ng bukid na kayang araruhin ng isang pares ng baka.[a]
  to: Sa unang pagsalakay, nakapatay sina Jonatan at ang tagapagdala ng kaniyang sandata ng humigit-kumulang dalawampung lalaki, sa isang bahaging halos kalahating tudling ng lupang kayang araruhin ng isang pares ng baka.[a]
  rationale: Inayos ang sintaks at ang paglalarawan ng lawak upang maging malinaw at natural sa modernong Filipino. Hindi ginawang eksaktong modernong panukat ang צֶמֶד; ipinaliwanag sa talababa ang literal ngunit hindi malinaw na pananalitang Hebreo. Pinanatili rin ang “humigit-kumulang” at “halos” para sa dalawang pagtatantiyang nasa pinagmulan.
