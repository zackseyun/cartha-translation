translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Jonatan” bilang karaniwang anyong Tagalog ng pangalan. Ipinaliwanag sa talababa ang siksik at hindi tiyak na pananalitang Hebreo tungkol sa sukat ng lupa.
