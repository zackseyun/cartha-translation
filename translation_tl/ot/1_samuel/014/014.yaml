  source_fidelity: Ang draft ay wastong naghahatid na sina Jonatan at ang tagapagdala ng kaniyang sandata ay nakapatay ng humigit-kumulang dalawampung lalaki sa unang pagsalakay. Gayunman, ang pariralang “sa loob ng lugar na halos kalahating tudling sa isang sukat ng bukid” ay hindi natural at hindi malinaw ang ugnayan ng sukat sa pangyayari. Ang binagong teksto ay pinananatili ang dalawang pagtatantiya at ang sadyang masikip na sukat ng Hebreo nang hindi nagpapataw ng eksaktong modernong sukat.
  naturalness: Mas likas sa modernong Filipino ang “Sa unang pagsalakay, nakapatay sina…” kaysa sa paghihiwalay ng “pagsalakay” at “napatay nila.” Ang “sa isang bahaging…” ay malinaw na nag-uugnay sa bilang ng napatay at sa tinutukoy na lawak.
  terminology: Pinanatili ang “Jonatan,” “tagapagdala ng kaniyang sandata,” “tudling,” at “pares ng baka.” Ang “pagsalakay” ay katanggap-tanggap para sa unang nakamamatay na pag-atake dahil malinaw na isinasaad ng pandiwang “nakapatay” ang resulta.
