  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “Lalo pa sana kung” upang ihayag ang kontrapaktuwal na diin, at pinanatili bilang retorikal na tanong ang hulíng sugnay ng Hebreo.
