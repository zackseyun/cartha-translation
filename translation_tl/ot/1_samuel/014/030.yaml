base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/030.yaml
  text: How much more if the people had eaten today from the spoil of their enemies that they found! For then the slaughter among the Philistines would have been much greater[a].
translation:
  language: tl
  text: Gaano pa kaya kung nakakain ngayon ang mga tao mula sa samsam na nakuha nila mula sa kanilang mga kaaway! Kung gayon, hindi ba sana mas malaki ang pinsalang idinulot sa mga Filisteo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Tunay nga, kung nakakain lamang ngayon ang mga tao mula sa samsam na nakuha nila mula sa kanilang mga kaaway, mas malaki sana ang naging dagok laban sa mga Filisteo.”
    reason: Pinananatili ang alternatibong pagbasa sa pambungad na parirala at ang literal na larawang “dagok” para sa מַכָּה.
lexical_decisions:
- source_word: אַף כִּי לוּא
  choice: Lalo pa sana kung
  rationale: Ipinahahayag ng parirala ang mas matinding bunga ng isang kondisyong hindi nangyari; natural nitong naihahatid ang pangangatwiran ni Jonatan.
- source_word: אָכֹל אָכַל
  choice: kumain
  rationale: Binibigyang-diin ng infinitive absolute ang pagkain, ngunit sa konteksto ay sapat at natural ang payak na pandiwang “kumain”; ang pagdaragdag ng “nang malaya” ay maaaring magpasok ng ideyang hindi tuwirang nasa teksto.
- source_word: מִשְּׁלַל אֹיְבָיו אֲשֶׁר מָצָא
  choice: mula sa nasamsam nila sa kanilang mga kaaway
  rationale: Ang שָׁלָל ay samsam sa digmaan. Ang kolektibong “mga tao” ay likas na tinutukoy sa Filipino sa pangmaramihang “nila/kanilang,” kahit nasa isahan ang anyong Hebreo.
- source_word: לֹא רָבְתָה מַכָּה
  choice: hindi ba't higit na marami sana ang napatay
  rationale: Pinananatili ang retorikal na tanong at ang kontrapaktuwal na diwa. Sa konteksto ng labanan, malinaw at natural ang “marami ang napatay” para sa mas malaking pinsala o pagkalipol.
- source_word: בַּפְּלִשְׁתִּים
  choice: sa mga Filisteo
  rationale: Maaaring tumukoy ang בְּ sa pinsalang nangyari sa hanay ng mga Filisteo o laban sa kanila; ang “sa mga Filisteo” ay nagpapanatili ng lawak na ito.
