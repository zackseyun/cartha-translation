base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/043.yaml
  text: Then Saul said to Jonathan[a], “Tell me what you have done.” And Jonathan told him and said, “I indeed tasted a little honey on the tip of the staff that was in my hand, and here I am, about to die.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Saul kay Jonatan, “Sabihin mo sa akin kung ano ang ginawa mo.” Sinabi sa kanya ni Jonatan, “Tumikim nga ako ng kaunting pulot sa dulo ng tungkod na hawak ko, at ngayon, mamamatay ako.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain ang huling bahagi bilang: “at ngayon, kailangan ba akong mamatay?” Mariing pinagtitibay ng Hebreo ang pandiwang “tumikim,” at ang huling sugnay ay maaaring marinig bilang pagsuko sa kapalaran o bilang retorikal na pagtutol.'
    reason: Pinananatili ang leksikal na diin ng טָעֹם טָעַמְתִּי at ang tunay na kalabuan ng הִנְנִי אָמוּת, nang hindi ipinapalit ang interpretatibong “lamang” sa mariing pahayag.
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: Sabihin mo sa akin
  rationale: Likas at tuwirang utos sa makabagong Tagalog; pinananatili ang diin ng kahilingan ni Saul.
- source_word: מֶה עָשִׂיתָה
  choice: kung ano ang ginawa mo
  rationale: Natural na di-tuwirang tanong sa Tagalog at malinaw na tumutukoy sa nagawang kilos na may kasalukuyang bunga.
- source_word: וַיַּגֶּד לוֹ
  choice: Sinabi sa kanya
  rationale: Pinananatili ang ugnayang leksikal sa naunang utos nang hindi nagiging labis na pormal.
- source_word: טָעֹם טָעַמְתִּי
  choice: Tumikim nga ako
  rationale: Ang “nga” ay nagpapahayag ng mariing pagpapatibay na likas sa Tagalog at sumasalamin sa infinitive absolute na kasama ng finite verb, nang hindi ipinapasok sa pangunahing teksto ang interpretasyong “tumikim lamang.”
- source_word: בִּקְצֵה הַמַּטֶּה
  choice: sa dulo ng tungkod
  rationale: Tuwirang inilalarawan ang dulo ng tungkod na ginamit ni Jonatan sa pagtikim.
- source_word: הַמַּטֶּה
  choice: tungkod
  rationale: Karaniwan at angkop na salita para sa hawak na staff sa salaysay.
- source_word: מְעַט דְּבַשׁ
  choice: kaunting pulot
  rationale: Maikli, malinaw, at natural na katumbas ng maliit na dami ng pulot.
- source_word: אֲשֶׁר בְּיָדִי
  choice: na hawak ko
  rationale: Natural na Tagalog para sa literal na “nasa kamay ko,” habang pinananatili ang konkretong larawan.
- source_word: הִנְנִי אָמוּת
  choice: at ngayon, mamamatay ako
  rationale: Ipinahahayag ang agarang kahihinatnan sa natural na Tagalog. Ang “ngayon” ay nagdadala ng deiktikong puwersa ng הִנְנִי, habang ang maaaring patanong na pagbasa ay pinananatili sa talababa.
theological_decisions:
- issue: Kung ang huling sugnay ay pagsuko sa kapalaran o retorikal na pagtutol
  choice: 'Pahayag: “at ngayon, mamamatay ako”'
  alternative: 'Tanong: “at ngayon, kailangan ba akong mamatay?”'
  rationale: Walang tahasang tandang pananong sa tradisyonal na tekstong Hebreo, at maaaring basahin ang mga salita bilang mapait na pagtanggap; gayunman, pinahihintulutan ng konteksto at sintaks ang retorikal na pagtutol, kaya hindi ito itinatago at inilalahad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Iniwasan ang lipas na “narito ako” sa pangunahing teksto dahil maaari itong magmukhang literal na pagtukoy lamang sa lokasyon; ginamit ang “at ngayon” upang ihatid ang agarang dramatikong puwersa. Nasa mismong teksto ang marker na [a], kasunod ng sugnay na tinatalakay nito.
