  text: Then he said to all Israel[a], “You be on one side, and I and Jonathan my son will be on the other side.” And the people said to Saul, “Do what seems good in your eyes.”
translation:
  language: tl
  text: Pagkatapos, sinabi niya sa buong Israel, “Kayo ay pumuwesto sa isang panig, at ako at ang anak kong si Jonatan ay pupuwesto sa kabilang panig.” At sinabi ng bayan kay Saul, “Gawin mo ang sa tingin mo ay mabuti.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֵבֶר אֶחָד
  choice: sa isang panig / sa kabilang panig
  rationale: Ang עֵבֶר ay tumutukoy sa isang panig o dako. Sa konteksto ng pagpapalabunutan, malinaw at natural sa Tagalog ang magkatapat na “isang panig” at “kabilang panig.”
- source_word: תִּהְיוּ / נִהְיֶה
  choice: pumuwesto / pupuwesto
  rationale: Bagaman pangunahing kahulugan ng היה ang “maging,” kasama ng לְעֵבֶר אֶחָד ay ipinahihiwatig nito ang paglagay o pagtayo ng magkahiwalay na pangkat. Ang “pumuwesto” ay natural sa Tagalog at hindi nagdaragdag kung paano sila pisikal na nakatayo.
- source_word: כָּל יִשְׂרָאֵל
  choice: buong Israel
  rationale: Karaniwang kolektibong katawagan para sa buong kapulungang Israelita; likas at tuwiran sa modernong Tagalog.
- source_word: בְּנִי
  choice: anak kong si Jonatan
  rationale: Pinananatili ang tahasang ugnayang ama-anak at ginagamit ang natural na ayos ng mga salita sa Tagalog.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: ang mabuti sa paningin mo
  rationale: Pinananatili ang Hebreong idyoma at larawan nito. Nauunawaan ito sa Tagalog bilang anumang inaakala ni Saul na mabuti o nararapat.
- source_word: עֲשֵׂה
  choice: Gawin mo
  rationale: Tuwirang pautos na anyo na likas na kaugnay ng kasunod na pariralang “ang mabuti sa paningin mo.”
- source_word: וַיֹּאמֶר / וַיֹּאמְרוּ
  choice: Pagkatapos, sinabi niya / At sinabi ng bayan
  rationale: Ipinahahayag ang sunod-sunod na daloy ng salaysay sa natural na Tagalog habang pinananatili ang payak na pagkakaugnay ng mga pangyayari.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pumuwesto” upang natural na maipahayag ang idyomatikong paghahati sa dalawang panig; hindi kailangan ng talababa dahil malinaw ang kahulugan sa konteksto.
