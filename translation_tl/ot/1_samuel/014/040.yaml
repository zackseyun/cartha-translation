  to: Pagkatapos, sinabi niya sa buong Israel, “Kayo ay pumuwesto sa isang panig, at ako at ang anak kong si Jonatan ay pupuwesto sa kabilang panig.” At sinabi ng bayan kay Saul, “Gawin mo ang sa tingin mo ay mabuti.”
