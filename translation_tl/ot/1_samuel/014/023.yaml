  text: וַ/יּ֧וֹשַׁע יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא אֶת יִשְׂרָאֵ֑ל וְ/הַ֨/מִּלְחָמָ֔ה עָבְרָ֖ה אֶת בֵּ֥ית אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/023.yaml
  text: So Yahweh saved Israel that day[a], and the battle passed beyond Beth-aven.
translation:
  language: tl
  text: Noong araw na iyon, iniligtas ni Yahweh ang Israel, at nagpatuloy ang labanan lampas sa Bet-aven.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dumaan sa Bet-aven ang labanan” o “umusad ang labanan hanggang sa kabila ng Bet-aven.”
    reason: May saklaw ang עָבַר na “dumaan,” “lumampas,” o “umusad sa kabila,” at maaaring markahan ng אֶת ang lugar na dinaanan.
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: iniligtas
  rationale: Ang Hiphil ng ישׁע ay tumutukoy sa pagliligtas o pagpapalaya. Ang “iniligtas” ay tuwiran at pinananatili si Yahweh bilang gumagawa ng pagliligtas, samantalang ang “pinagtagumpay” ay mas makitid at higit na interpretatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinalitan ng isang titulo.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Likas na ekspresyong Filipino para sa panahong tinutukoy ng Hebreo.
- source_word: אֶת יִשְׂרָאֵל
  choice: ang Israel
  rationale: Tumutukoy nang sama-sama sa bayan o hukbo ng Israel bilang tuwirang layon ng pagliligtas.
- source_word: וְהַמִּלְחָמָה
  choice: at ... ang labanan
  rationale: Sa konteksto, ang מִלְחָמָה ay ang kasalukuyang sagupaan, kaya mas angkop ang “labanan” kaysa “digmaan.”
- source_word: עָבְרָה
  choice: lumampas
  rationale: Pinananatili nito ang diwa ng pagdaan o pag-usad lampas sa isang lugar nang hindi tiyak na ipinapakahulugang isang partikular na maniobrang militar.
- source_word: אֶת בֵּית אָוֶן
  choice: sa Bet-aven
  rationale: Kasama ng עָבְרָה, ipinahihiwatig nito na umusad o dumaan ang labanan lampas sa Bet-aven. Pinanatili ang pangalang pantangi sa anyong madaling basahin sa Filipino.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang ginagamit sa Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaya” upang ipakita ang bunga ng naunang salaysay, at inilagay ang paksa pagkatapos ng pandiwa sa ikalawang sugnay para sa likas na daloy. Inilakip ang talababa sa pariralang may leksikal na kalabuan.
