  text: Then Saul said[a], “Cast lots between me and Jonathan my son.” And Jonathan was taken.
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Saul[a], “Magpalabunutan kayo sa pagitan ko at ng anak kong si Jonatan.” At si Jonatan ang nabunot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Ipalaglag ninyo sa pagitan ko at ng anak kong si Jonatan,” na tumutukoy sa pagpapasiya sa pamamagitan ng bunot.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּילוּ
  choice: Magpalabunutan kayo
  rationale: Ang Hiphil imperative plural ng נפל ay literal na “magpabagsak,” ngunit sa konteksto ng pagpapasiya sa pamamagitan ng palabunutan, ang likas na katumbas sa modernong Tagalog ay “magpalabunutan.”
- source_word: בֵּינִי וּבֵין
  choice: sa pagitan namin ng
  rationale: Ipinakikita ng tambalang pang-ukol ang pagpili sa dalawang panig. Ang “sa pagitan namin ng anak kong si Jonatan” ay natural sa Tagalog at malinaw na si Saul at si Jonatan ang paghahambingin.
- source_word: בְּנִי
  choice: anak kong
  rationale: Ang בֵּן na may panlaping unang panauhang isahan ay tumutukoy sa anak na lalaki; dahil malinaw na lalaki si Jonatan, natural at sapat ang “anak kong si Jonatan.”
- source_word: וַיִּלָּכֵד
  choice: ang nabunot
  rationale: Ang Niphal ng לכד ay literal na “nahuli” o “nakuha,” ngunit sa konteksto ng palabunutan ay nangangahulugang siya ang natukoy o napili ng bunot. Pinananatili ng “nabunot” ang maikli at idiomatikong pahayag.
- source_word: יוֹנָתָן
  choice: Jonatan
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi ni Saul
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay; natural itong ipinahahayag sa Tagalog bilang “Pagkatapos ay sinabi.”
