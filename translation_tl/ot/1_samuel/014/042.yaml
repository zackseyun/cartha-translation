translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magpalabunutan” at “nabunot” upang natural na maipahayag ang konteksto ng pagpapasiya sa pamamagitan ng bunot, habang inilagay sa talababa ang mas literal na larawan ng Hebreo.
