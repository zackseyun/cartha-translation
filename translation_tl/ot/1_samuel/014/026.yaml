base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/026.yaml
  text: When the people came into the forest[a], behold, there was a flow of honey, but no one put his hand to his mouth[c][b], because the people feared the oath.
translation:
  language: tl
  text: Nang makarating ang mga tao sa kagubatan, naroon ang umaagos na pulot[a]. Ngunit walang sinumang nag-abot ng sariling kamay sa sariling bibig[b], sapagkat takot ang mga tao sa panunumpa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang pagdaloy ng pulot.” Maaari ring isalin na “dumadaloy ang pulot.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “walang nag-abot ng kanyang kamay sa kanyang bibig,” isang idyomang nangangahulugang walang kumain ng pulot.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “ang panunumpa.” Sa konteksto, tumutukoy ito sa naunang panunumpa ni Saul na may sumpa laban sa sinumang kakain bago sumapit ang gabi (tingnan ang 1 Samuel 14:24).
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: makarating
  rationale: Ang wayyiqtol ng בוא ay nagsasalaysay ng pagdating o pagpasok. Natural sa Tagalog ang “makarating ... sa kagubatan” sa kontekstong ito.
- source_word: הָעָם
  choice: mga tao
  rationale: Mas malawak ang עם kaysa “mga kawal.” Pinananatili ng “mga tao” ang pag-uulit at lawak ng terminong Hebreo, kahit hukbo ang konteksto.
- source_word: הַיַּעַר
  choice: kagubatan
  rationale: Ang יער ay tumutukoy sa lugar na maraming puno; malinaw at karaniwang katumbas ang “kagubatan.”
- source_word: וְהִנֵּה
  choice: naroon
  rationale: Itinatampok ng הִנֵּה ang biglang napansing tanawin. Ang “naroon” ay natural na salaysay sa modernong Tagalog habang pinananatili ang pansin sa natuklasan.
- source_word: הֵלֶךְ דְּבָשׁ
  choice: umaagos na pulot
  rationale: Ang di-pangkaraniwang nominal na pahayag ay literal na isang “pagdaloy ng pulot.” Mas natural sa Tagalog ang “umaagos na pulot,” nang hindi tinutukoy kung batis o ibang anyo ng pagdaloy.
- source_word: וְאֵין מַשִּׂיג יָדוֹ אֶל פִּיו
  choice: walang nag-abot ng kamay sa bibig niya
  rationale: 'Pinananatili nito ang kongkretong idyomang Hebreo sa halip na agad ipakahulugang “walang kumain.” Ang isahan na panghalip ay distributibo: walang sinuman ang nagdala ng sariling kamay sa sariling bibig.'
- source_word: כִּי יָרֵא הָעָם
  choice: sapagkat natatakot ang mga tao
  rationale: Ibinibigay ng כִּי ang dahilan, at ang ירא rito ay takot na labagin ang naunang ipinataw na panunumpa.
- source_word: הַשְּׁבֻעָה
  choice: sumpa
  rationale: Bagaman karaniwang “panunumpa” ang שבועה, ang naunang pahayag ni Saul sa 1 Samuel 14:24 ay isang sinumpaang pagbabawal na may sumpa laban sa lalabag. Sa natural na Tagalog, “sumpa” ang malinaw na bagay na kinatatakutan; ipinaliliwanag ng talababa ang literal na anyo.
theological_decisions:
- issue: Ang ugnayan ng “panunumpa” at “sumpa” sa utos ni Saul
  choice: sumpa
  alternative: panunumpa
  rationale: 'Hindi hinahatulan sa salin kung lehitimo ang ginawa ni Saul. Inilalarawan lamang ang kinatatakutan ng bayan: ang sumpang kalakip ng sinumpaang pagbabawal. Pinananatili sa talababa ang literal na “panunumpa” at ang sanggunian sa naunang talata.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pulot” bilang likas na katawagan sa honey sa konteksto; iniwasan ang mas interpretibong “batis ng pulot.” Pinanatili sa pangunahing teksto ang kongkretong idyoma ng kamay at bibig, saka ipinaliwanag sa talababa.
