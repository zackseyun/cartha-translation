  text: His armor-bearer said to him, “Do all that is in your heart. Go on; here I am with you, according to your heart.”
translation:
  language: tl
  text: Sinabi sa kanya ng tagapagdala ng kanyang sandata, “Gawin mo ang lahat ng niloloob mo. Magpatuloy ka; narito ako, kasama mo, ayon sa niloloob mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: tagapagdala niya ng sandata
  rationale: Tuwirang inilalarawan ang tungkuling militar ng armor-bearer sa natural at malinaw na Tagalog.
- source_word: עֲשֵׂה כָּל אֲשֶׁר בִּלְבָבֶךָ
  choice: Gawin mo ang lahat ng nasa puso mo
  rationale: Pinananatili ang Hebreong idyoma at ang diwa ng buong-loob na pagsang-ayon nang hindi ipinapalit ang mas interpretatibong ‘anumang nais mo.’
- source_word: נְטֵה לָךְ
  choice: Sige
  rationale: Sa konteksto, isa itong paghikayat na magpatuloy o kumilos; ang ‘Sige’ ay maikli, natural, at hindi labis na tumutukoy sa direksiyon ng pagkilos.
- source_word: הִנְנִי עִמְּךָ כִּלְבָבֶךָ
  choice: narito ako, kasama mo, ayon sa nasa puso mo
  rationale: Pinananatili ang emphatic na הִנְנִי (‘narito ako’) at ang inuulit na metapora ng puso sa halip na pakinisin bilang simpleng pagsang-ayon.
