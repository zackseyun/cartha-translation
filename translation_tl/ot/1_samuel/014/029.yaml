  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nga” upang likas na katawanin ang magalang o nagpapalambot na נָא, at pinanatili sa teksto ang idyoma tungkol sa mga mata sa halip na tahasang palitan ito ng interpretasyon.
