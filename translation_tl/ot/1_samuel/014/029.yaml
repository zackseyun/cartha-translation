  text: Then Jonathan said[a], “My father has troubled the land. See, please, how my eyes have brightened because I tasted a little of this honey.”
translation:
  language: tl
  text: At sinabi ni Jonatan, “Nagdulot ng kaguluhan sa lupain ang aking ama. Tingnan nga ninyo kung paanong nagliwanag ang aking mga mata[a] dahil nakatikim ako ng kaunti sa pulot na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Idyomang Hebreo: “nagliwanag ang aking mga mata,” na nagpapahayag ng panunumbalik ng sigla o pagiging alerto matapos kumain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָכַר
  choice: nagdulot ng kaguluhan sa
  rationale: Ipinahahayag nito ang diwang manggulo o magdala ng kapahamakan, habang likas sa makabagong Tagalog at malinaw na ang lupain ang naapektuhan.
- source_word: הָאָרֶץ
  choice: lupain
  rationale: Tuwirang katumbas ito ng salitang Hebreo at maaari nitong saklawin ang rehiyon at ang mga taong naroon.
- source_word: רְאוּ נָא
  choice: Tingnan nga ninyo
  rationale: Ang maramihang pautos na “tingnan ninyo” ay pinagaan ng “nga,” na likas na naghahatid ng pakiusap o pag-anyaya sa pansin.
- source_word: אֹרוּ עֵינַי
  choice: nagliwanag ang aking mga mata
  rationale: Pinananatili nito ang konkretong idyoma tungkol sa mga mata at ang diwa ng panunumbalik ng sigla o linaw matapos kumain.
- source_word: טָעַמְתִּי
  choice: nakitikim ako
  rationale: Tumpak nitong ipinahahayag ang pagtikim, hindi lamang ang pangkalahatang pagkain, at umaangkop sa maliit na dami.
- source_word: מְעַט
  choice: kaunti
  rationale: Payak at natural itong katumbas ng maliit na dami.
- source_word: דְּבַשׁ הַזֶּה
  choice: pulot na ito
  rationale: Pinananatili nito ang pangngalang “pulot” at ang pantukoy na “ito”; hindi nito dinaragdagan ang tekstong Hebreo ng “bahay-pukyutan” o “pulot-pukyutan.”
