base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/052.yaml
  text: And the war against the Philistines was severe all the days of Saul[a]. Whenever Saul saw any mighty man or any valiant man[c][b], he gathered him to himself.
translation:
  language: tl
  text: At matindi ang digmaan laban sa mga Filisteo sa buong panahon ni Saul.[a] Tuwing nakakakita si Saul ng sinumang magiting na lalaki o sinumang lalaking may kakayahan,[b] isinasama niya ito sa kanyang piling.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mabangis” o “mabigat.” Literal na “malakas” ang salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sinumang magiting na lalaki at sinumang anak ng kakayahan/lakas.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, kinukuha ni Saul ang gayong mga lalaki upang maging mga kasama niya sa paglilingkod.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה חֲזָקָה
  choice: At naging matindi ang pakikipagdigma
  rationale: Ang anyong pasalaysay ng היה ay likas na isinalin bilang “naging,” at ang חֲזָקָה, na literal na “malakas,” ay tumutukoy rito sa tindi ng patuloy na digmaan.
- source_word: עַל פְּלִשְׁתִּים
  choice: laban sa mga Filisteo
  rationale: Kasama ng salitang tumutukoy sa digmaan, ang עַל ay nagmamarka sa kalabang kinakaharap.
- source_word: כֹּל יְמֵי שָׁאוּל
  choice: sa buong panahon ni Saul
  rationale: Ipinahihiwatig ng idyoma ang kabuuang panahong saklaw ng pamumuno o buhay ni Saul sa kontekstong ito, nang hindi kinakailangang tukuyin nang mas makitid kung alin sa dalawa.
- source_word: וְרָאָה שָׁאוּל
  choice: Tuwing nakakakita si Saul
  rationale: Ang pagkakasunod ng mga pandiwa ay nagpapahayag ng paulit-ulit o nakagawiang kilos, kaya natural ang “tuwing.”
- source_word: כָּל אִישׁ גִּבּוֹר
  choice: sinumang makapangyarihang mandirigma
  rationale: Ang גִּבּוֹר ay may diwang lakas at kahusayan sa pakikipaglaban; nililinaw ng “mandirigma” ang kontekstong militar.
- source_word: וְכָל בֶּן חַיִל
  choice: o matapang na lalaki
  rationale: Ang בֶּן־חַיִל ay idyomang tumutukoy sa lalaking may tapang, kakayahan, o kagitingan; “matapang na lalaki” ang natural na salin sa kontekstong militar.
- source_word: וַיַּאַסְפֵהוּ אֵלָיו
  choice: isinasama niya ito sa kanyang hukbo
  rationale: Literal itong “tinitipon niya sa kanyang sarili,” ngunit sa konteksto ay recruitment sa puwersa ni Saul; ginagawang malinaw ng salin ang ipinahihiwatig na kilos.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pakikipagdigma” upang ipakita ang tuloy-tuloy na labanan, at “isinasama ... sa kanyang hukbo” upang natural na maipahayag ang ipinahihiwatig na pangangalap nang hindi nagpapasok ng dagdag na teolohikal na pakahulugan.
