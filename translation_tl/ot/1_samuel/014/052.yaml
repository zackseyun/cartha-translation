revisions:
- from: At naging matindi ang pakikipagdigma laban sa mga Filisteo sa buong panahon ni Saul.[a] Tuwing nakakakita si Saul ng sinumang makapangyarihang mandirigma o matapang na lalaki,[b] isinasama niya ito sa kanyang hukbo.[c]
  to: At matindi ang digmaan laban sa mga Filisteo sa buong panahon ni Saul.[a] Tuwing nakakakita si Saul ng sinumang magiting na lalaki o sinumang lalaking may kakayahan,[b] isinasama niya ito sa kanyang piling.[c]
  rationale: Inalis ang diwang pagbabago sa “naging” at pinalitan ang tahasang “hukbo” ng “kanyang piling,” upang manatiling malapit sa pandiwang Hebreo na nagsasaad ng pagtitipon o pagkuha ng isang tao sa sarili ni Saul. Iniingatan ng rebisyon ang paulit-ulit na aspekto ng kilos at ang malawak na saklaw ng dalawang paglalarawan sa mga lalaking kinuha ni Saul.
