base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/018.yaml
  text: Then Saul said to Ahijah[b][a], “Bring the ark of God here,” for the ark of God was that day with the sons of Israel.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Saul kay Ahias, “Ilapit mo rito ang kaban ng Diyos.”[a] Sapagkat noong araw na iyon, ang kaban ng Diyos ay kasama ng mga Israelita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang tradisyong tekstuwal at ayon sa ilang tagapagpaliwanag: “Ilapit mo rito ang efod.” “Kaban ng Diyos” ang mababasa sa tekstong Hebreo rito.'
    reason: textual_variant
  - marker: b
    text: 'Maaari ring isalin: “naroon noong araw na iyon kasama ng mga Israelita.”'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: לַאֲחִיָּה
  choice: kay Ahias
  rationale: Isinalin ang pangalang Hebreo sa nakaugaliang anyong Filipino na “Ahias.”
- source_word: הַגִּישָׁה
  choice: Ilapit mo rito
  rationale: Ang causative imperative ng נגשׁ ay nangangahulugang ipalapit o dalhin sa harapan; malinaw at natural ang “Ilapit mo rito” sa tuwirang utos.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ang kaban ng Diyos
  rationale: Tuwirang pinananatili ang “kaban ng Diyos”; hindi idinagdag ang “tipan,” na wala sa tekstong Hebreo.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag ng tagapagsalaysay sa naunang utos.
- source_word: הָיָה ... וּבְנֵי יִשְׂרָאֵל
  choice: ay kasama ng mga Israelita
  rationale: Ang konstruksyon ay nagsasaad na ang kaban ay kasama ng bayan; “mga Israelita” ang likas at inklusibong salin ng idyomang “mga anak ni Israel.”
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Karaniwang Filipino para sa temporal na pariralang “sa araw na iyon.”
theological_decisions:
- issue: “Kaban ng Diyos” laban sa tekstuwal na tradisyong “efod”
  choice: ang kaban ng Diyos
  alternative: ang efod
  rationale: Dalawang ulit na mababasa sa ibinigay na tekstong Masoretiko ang “kaban ng Diyos.” Pinanatili sa talababa ang mahalagang alternatibong tradisyon sa halip na ipalit ito sa pangunahing teksto.
- issue: Lokasyon o presensiya ng kaban sa araw na iyon
  choice: ang kaban ng Diyos ay kasama ng mga Israelita
  alternative: naroon nang araw na iyon ang kaban ng Diyos kasama ng mga Israelita
  rationale: Hindi tahasang nasa Hebreo ang katumbas ng “naroon.” Ang “kasama ng mga Israelita” ay sapat na naghahayag ng presensiya at umiiwas sa hindi kailangang pagdaragdag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaban ng Diyos” upang maging tapat sa Hebreo at “mga Israelita” bilang natural na salin ng idyomang בְּנֵי יִשְׂרָאֵל. Inilagay ang mga panandang [a] at [b] sa pangunahing teksto sa mga kaugnay na pahayag.
