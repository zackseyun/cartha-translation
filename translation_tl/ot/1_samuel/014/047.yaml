  - severity: low
    issue: Ang “humarap” ay hindi gaanong tiyak na katumbas ng יִפְנֶה.
    rationale: Ang “bumaling” ay mas natural na naghahatid ng ideyang “wherever he turned,” habang hindi binabago ang saklaw o kahulugan.
