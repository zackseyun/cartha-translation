base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/047.yaml
  text: 'Saul had secured the kingship over Israel[a], and he fought against all his enemies on every side: against Moab, against the Ammonites, against Edom, against the kings of Zobah, and against the Philistines. Wherever he turned, he inflicted punishment.'
translation:
  language: tl
  text: 'Pinatatag ni Saul ang paghahari niya sa Israel, at nakipagdigma siya sa lahat ng kaaway niya sa bawat panig: sa Moab, sa mga Ammonita, sa Edom, sa mga hari ng Zoba, at sa mga Filisteo. Saanman siya bumaling, pinarusahan niya sila.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “hinatulan niyang maysala” sila. Ang pandiwang Hebreo ay maaaring mangahulugang magpahayag na maysala; dito, malamang na tumutukoy ito sa pagpapataw ng maparusang pagkatalo sa mga kaaway niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד הַמְּלוּכָה עַל יִשְׂרָאֵל
  choice: Pinatatag ni Saul ang paghahari niya sa Israel
  rationale: Ang לָכַד ay literal na “sinakop/sinunggaban,” ngunit kasama ng הַמְּלוּכָה at sa kontekstong ito, tumutukoy ito sa pagtatatag o pagpapatibay ni Saul ng kaniyang pamamahala. Iniiwasan ng “pinatatag” ang di-kinakailangang pahiwatig ng ilegal na pag-agaw.
- source_word: וַיִּלָּחֶם סָבִיב בְּכָל אֹיְבָיו
  choice: nakipagdigma siya sa lahat ng kaaway niya sa bawat panig
  rationale: Likas at malinaw na ipinahahayag ng “nakipagdigma” ang pandiwang לחם, habang pinananatili ng “sa bawat panig” ang saklaw ng סָבִיב.
- source_word: בְּמוֹאָב וּבִבְנֵי עַמּוֹן וּבֶאֱדוֹם וּבְמַלְכֵי צוֹבָה וּבַפְּלִשְׁתִּים
  choice: sa Moab, sa mga Ammonita, sa Edom, sa mga hari ng Zoba, at sa mga Filisteo
  rationale: Ang inuulit na ב ay likas na isinalin bilang “sa” pagkatapos ng “nakipagdigma.” Pinanatili ang maramihang “mga hari” ayon sa מַלְכֵי, at ginamit ang karaniwang katawagang “mga Ammonita” para sa “mga anak ni Ammon.”
- source_word: וּבְכֹל אֲשֶׁר יִפְנֶה
  choice: Saanman siya humarap
  rationale: Ipinapahayag nito ang distributibong diwa ng parirala nang maikli at natural sa modernong Tagalog.
- source_word: יַרְשִׁיעַ
  choice: nagpapataw siya ng kaparusahan
  rationale: Mahirap ang Hiphil ng רשע rito. Sa konteksto ng pakikidigma, malamang na nangangahulugan itong ituring na maysala o patawan ng maparusang pagkatalo. Pinananatili ng salin ang diwa ng paghatol nang hindi labis na tinutukoy ang eksaktong anyo nito.
theological_decisions:
- issue: Kung ang tagumpay ni Saul ay dapat ilarawan bilang simpleng pagtatagumpay o bilang maparusang paghatol
  choice: nagpapataw siya ng kaparusahan
  alternative: nagtatagumpay siya / nilulupig niya sila
  rationale: May hudisyal at maparusang diwa ang יַרְשִׁיעַ na mawawala sa saling tumutukoy lamang sa tagumpay. Gayunman, hindi tinutukoy ng teksto kung banal na paghatol ito, kaya hindi iyon idinagdag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “paghahari” sa halip na “kaharian” upang tukuyin ang pamumuno o katungkulan, hindi ang teritoryo. Hindi nagdagdag ng panimulang “Ngayon” dahil walang tahasang katumbas nito sa Hebreo.
