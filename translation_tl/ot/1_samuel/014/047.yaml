revisions:
- from: 'Pinatatag ni Saul ang paghahari niya sa Israel, at nakipagdigma siya sa lahat ng kaaway niya sa bawat panig: sa Moab, sa mga Ammonita, sa Edom, sa mga hari ng Zoba, at sa mga Filisteo. Saanman siya humarap, nagpapataw siya ng kaparusahan.[a]'
  to: 'Pinatatag ni Saul ang paghahari niya sa Israel, at nakipagdigma siya sa lahat ng kaaway niya sa bawat panig: sa Moab, sa mga Ammonita, sa Edom, sa mga hari ng Zoba, at sa mga Filisteo. Saanman siya bumaling, pinarusahan niya sila.[a]'
  rationale: Inayos ang pangwakas na sugnay upang maging nakaraang aspekto, gaya ng salaysay na Hebreo, at ginawang “bumaling” ang pandiwa para sa mas malapit at natural na katumbas ng “turned.” Iningatan ng “pinarusahan niya sila” ang ipinahiwatig na layon mula sa naunang “mga kaaway,” samantalang nililinaw ng talababa ang mas literal na hudisyal na pagbasa nang hindi isinasara ang pinagtatalunang nuwesang leksikal.
