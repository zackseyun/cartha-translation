  text: וְ/שָׁא֗וּל יוֹשֵׁב֙ בִּ/קְצֵ֣ה הַ/גִּבְעָ֔ה תַּ֥חַת הָ/רִמּ֖וֹן אֲשֶׁ֣ר בְּ/מִגְר֑וֹן וְ/הָ/עָם֙ אֲשֶׁ֣ר עִמּ֔/וֹ כְּ/שֵׁ֥שׁ מֵא֖וֹת אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/002.yaml
  text: Saul was staying at the outskirts of Gibeah[a], under the pomegranate tree that is at Migron[b], and the people who were with him were about six hundred men.
translation:
  language: tl
  text: Nanatili si Saul sa may dulo ng Gibea[a], sa ilalim ng punong granada na nasa Migron[b]. Kasama niya ang humigit-kumulang na animnaraang lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nakaupo sa gilid ng Gibea.” Ang salitang Hebreo ay maaaring mangahulugang nakaupo o nananatili sa isang lugar.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa ilalim ng granada”; idinagdag ang “punong” para sa kalinawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: Nanatili
  rationale: Maaaring tumukoy ang participle ng ישׁב sa pag-upo, paninirahan, o pananatili. Sa kontekstong militar, likas na ipinahahayag ng “nanatili” ang patuloy na paglagi ni Saul sa lugar nang hindi nililimitahan ang kahulugan sa posisyon ng katawan.
- source_word: בִּקְצֵה הַגִּבְעָה
  choice: sa may dulo ng Gibea
  rationale: Ang קָצֶה ay dulo, gilid, o hangganan. Ang “sa may dulo” ay natural sa Tagalog at pinananatili ang heograpikong diwa nang hindi tiyakang ipinapalagay kung ito ay hangganan o labas ng bayan. Ang הַגִּבְעָה ay itinuring na pangalang-pook na Gibea ayon sa konteksto.
- source_word: תַּחַת הָרִמּוֹן
  choice: sa ilalim ng punong granada
  rationale: Literal na “sa ilalim ng granada,” ngunit sa ganitong pahayag ng lokasyon, ang רִמּוֹן ay tumutukoy sa punong granada. Idinagdag ang “punong” para sa malinaw at natural na Tagalog.
- source_word: אֲשֶׁר בְּמִגְרוֹן
  choice: na nasa Migron
  rationale: Ang sugnay ay pinakanatural na tumutukoy sa punong granada at nagsasaad ng kinaroroonan nito.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: Kasama niya
  rationale: Ang עָם ay literal na “mga tao” at sa kontekstong militar ay maaaring mga tauhan o kawal. Ang maikling “kasama niya” ay natural at hindi labis na nagpapakitid sa pagkakakilanlan ng pangkat; nililinaw ng kasunod na אִישׁ na mga lalaki ang binibilang.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: humigit-kumulang na animnaraang lalaki
  rationale: Ipinahihiwatig ng prefixed כ ang pagtatantiya, kaya pinanatili ang diwa sa “humigit-kumulang.” Ang אִישׁ pagkatapos ng bilang ay natural na “lalaki.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nanatili” kaysa literal na “nakaupo” dahil mas likas ito sa salaysay ng pagkakampo o paglagi, habang inilagay sa talababa ang tunay na alternatibo. Hinati sa dalawang pangungusap upang maging natural at madaling basahin sa Tagalog nang hindi binabago ang ugnayan ng mga ideya.
