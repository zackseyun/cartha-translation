  to: Umakyat si Jonatan gamit ang kaniyang mga kamay at paa, at ang tagapagdala ng kaniyang sandata ay nasa likuran niya. Nabuwal sila sa harap ni Jonatan, at ang tagapagdala ng kaniyang sandata ay patuloy na pumapatay[a] sa kanila habang sumusunod sa kaniya.
