base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/013.yaml
  text: Then Jonathan climbed up on his hands and feet[a], with his armor-bearer behind him. They fell before Jonathan, and his armor-bearer killed them after him.
translation:
  language: tl
  text: Umakyat si Jonatan gamit ang kaniyang mga kamay at paa, at ang tagapagdala ng kaniyang sandata ay nasa likuran niya. Nabuwal sila sa harap ni Jonatan, at ang tagapagdala ng kaniyang sandata ay patuloy na pumapatay[a] sa kanila habang sumusunod sa kaniya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pumapatay sa kanila habang sumusunod sa kaniya.” Maaaring idiin ng Hebreong participle ang nagpapatuloy o sunod-sunod na pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Umakyat
  rationale: Ang עלה ay nangangahulugang umakyat o pumaitaas; malinaw sa konteksto na umaakyat si Jonatan sa matarik na daan.
- source_word: עַל יָדָיו וְעַל רַגְלָיו
  choice: na gamit ang kanyang mga kamay at paa
  rationale: Pinananatili nito ang malinaw at buhay na paglalarawan ng paraan ng kanyang pag-akyat nang hindi gumagamit ng mas interpretibong idyoma.
- source_word: נֹשֵׂא כֵלָיו
  choice: tagapagdala niya ng sandata
  rationale: Ito ang likas at madaling maunawaang katawagan sa lingkod-mandirigmang nagdadala ng mga kagamitang pandigma ni Jonatan.
- source_word: אַחֲרָיו
  choice: nasa likuran niya / sumusunod sa kanya
  rationale: 'Ang dalawang paglitaw ay isinalin ayon sa kanilang konteksto: una bilang puwesto sa likuran, at ikalawa bilang pagsunod sa paglusob ni Jonatan.'
- source_word: וַיִּפְּלוּ לִפְנֵי יוֹנָתָן
  choice: Nabuwal sila sa harap ni Jonatan
  rationale: Pinananatili ng “nabuwal” ang larawang pandigma at hindi labis na tinutukoy kung paano sila bumagsak o natalo.
- source_word: מְמוֹתֵת
  choice: patuloy silang pinapatay
  rationale: Ang participle ay maaaring magpahiwatig ng nagpapatuloy o sunod-sunod na pagpatay habang sumusunod ang tagapagdala ng sandata kay Jonatan.
