base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/028.yaml
  text: Then one of the people answered and said[a], “Your father strictly put the people under oath, saying[b], ‘Cursed is the man who eats food today.’ So the people were faint.”
translation:
  language: tl
  text: Sumagot ang isa sa mga tao, “Mahigpit na pinasumpa ng iyong ama ang mga tao sa pagsasabing, ‘Sumpain ang sinumang kakain ng pagkain[a] sa araw na ito.’” At nanghina ang mga tao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tinapay”; ginagamit dito sa mas malawak na kahulugang pagkain.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “napagod ang mga tao” o “lubhang nanghina ang mga tao.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן אִישׁ מֵהָעָם וַיֹּאמֶר
  choice: Sumagot ang isa sa mga tao
  rationale: Likas sa modernong Tagalog ang pariralang ito para sa isang di-tinukoy na lalaking mula sa pangkat; hindi na kailangang ulitin ang literal na ‘sumagot at nagsabi.’
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: Mahigpit na pinanumpa
  rationale: Ipinahahayag ng anyong Hiphil ang pagpapasumpa, at ng infinitive absolute ang matinding diin; malinaw na naihahatid ng ‘mahigpit na pinanumpa’ ang dalawang ito.
- source_word: אָבִיךָ
  choice: iyong ama
  rationale: Tuwirang pagtukoy ito sa ama ng kausap, si Jonatan.
- source_word: אָרוּר
  choice: Sumpain
  rationale: Pinananatili nito ang taimtim at pormal na lakas ng pormula ng sumpa nang hindi gumagamit ng lipas na pananalita.
- source_word: הָאִישׁ אֲשֶׁר יֹאכַל
  choice: ang sinumang kumain
  rationale: Bagaman panlalaking isahan ang Hebreo, pangkalahatan ang gamit nito sa pormula ng sumpa; natural at tumpak sa Tagalog ang ‘sinuman.’
- source_word: לֶחֶם
  choice: pagkain
  rationale: Literal itong ‘tinapay,’ ngunit sa konteksto ay tumutukoy sa anumang makakain, gaya ng pulot na kinain ni Jonatan.
- source_word: הַיּוֹם
  choice: sa araw na ito
  rationale: Natural sa taimtim na pahayag at tumpak na katumbas ng temporal na parirala.
- source_word: וַיָּעַף הָעָם
  choice: Kaya nanghina ang mga tao
  rationale: Ang pandiwa ay nagsasaad ng panghihina o pagkapagod; ipinakikita ng ‘kaya’ ang ugnayan nito sa ipinataw na pagbabawal ayon sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang ‘mga tao’ para sa הָעָם, bagaman sa konteksto ay mga kawal sila. Inihiwalay sa tuwirang sipi ang pangwakas na sugnay, ayon sa malamang na daloy ng salaysay, habang hindi dinaragdagan ang tekstong Hebreo.
