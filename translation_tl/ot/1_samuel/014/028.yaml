  naturalness: Natural at malinaw ang natitirang pananalita. Mas maayos ang “Mahigpit na pinasumpa ... ang mga tao” at ang pagsasama ng “sa pagsasabing” sa iisang daloy ng sinabi ng tauhan.
  terminology: Ang “sumpain” ay angkop para sa אָרוּר, at ang “pagkain,” na may talababa para sa literal na “tinapay,” ay tumpak sa konteksto. Pinanatili ang “mga tao” para sa הָעָם.
