revisions:
- from: Sumagot ang isa sa mga tao, “Mahigpit na pinanumpa ng iyong ama ang mga tao. Sinabi niya, ‘Sumpain ang sinumang kumain ng pagkain[a] sa araw na ito.’” Kaya nanghina ang mga tao.[b]
  to: Sumagot ang isa sa mga tao, “Mahigpit na pinasumpa ng iyong ama ang mga tao sa pagsasabing, ‘Sumpain ang sinumang kakain ng pagkain[a] sa araw na ito.’” At nanghina ang mga tao.[b]
  rationale: Pinalitan ang “pinanumpa” ng “pinasumpa” upang tumpak na maihatid ang Hiphil na pagpapasumpa at ang diin ng infinitive absolute. Pinalitan din ang “kumain” ng “kakain” para sa prospektibong pagbabawal sa pormula ng sumpa, at ang “Kaya” ng “At” upang mapanatili ang hindi gaanong ipinaliliwanag na ugnayan ng Hebreo.
