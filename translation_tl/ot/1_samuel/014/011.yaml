base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/011.yaml
  text: When the two of them revealed themselves to the Philistine garrison[a], the Philistines said, “Look[b], the Hebrews are coming out of the holes where they had hidden themselves.”
translation:
  language: tl
  text: Nang magpakita silang dalawa sa himpilan[a] ng mga Filisteo, sinabi ng mga Filisteo, “Tingnan ninyo, lumalabas ang mga Hebreo[b] mula sa mga butas na pinagtaguan nila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “puwestong militar.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga Hebreo” ay katawagang etniko na ginagamit ng mga Filisteo para sa mga Israelita.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגָּלוּ
  choice: magpakita
  rationale: Ang Niphal ng גלה ay may diwang reflexive/passive; sa konteksto, sinadya nilang makita sila ng mga Filisteo. Likas sa Filipino ang “magpakita” para sa kusang pagpapakita.
- source_word: שְׁנֵיהֶם
  choice: silang dalawa
  rationale: Malinaw nitong pinananatili ang pagtukoy kay Jonatan at sa tagapagdala niya ng sandata, pati ang diin sa kanilang dalawa.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: himpilan ng mga Filisteo
  rationale: Sa kontekstong militar, ang מַצָּב ay maaaring tumukoy sa nakatalagang puwersa o puwestong militar. Ang “himpilan” ay malinaw at natural, habang ang alternatibong “puwesto” ay nasa talababa.
- source_word: הִנֵּה
  choice: Tingnan ninyo
  rationale: Pinananatili nito ang pansin-tawag at padamdam na lakas ng marker sa natural na makabagong Filipino.
- source_word: עִבְרִים
  choice: mga Hebreo
  rationale: Pinananatili ang katawagang etniko ng mga Filisteo para sa mga Israelita at ang pananaw ng tagalabas na taglay nito.
- source_word: יֹצְאִים
  choice: lumalabas
  rationale: Ang participle ay naglalarawan ng kilos na kasalukuyang nagaganap mula sa pananaw ng mga Filisteo.
- source_word: מִן הַחֹרִים
  choice: mula sa mga butas
  rationale: Kongkretong isinasalin ang חֹרִים bilang mga butas o guwang, nang hindi ito labis na tinutukoy bilang mga kuweba.
- source_word: אֲשֶׁר הִתְחַבְּאוּ שָׁם
  choice: na pinagtataguan nila
  rationale: Natural sa Filipino ang “pinagtataguan nila” at malinaw na itinuturing ang mga butas bilang lugar ng kanilang naunang pagtatago.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “magpakita” upang ihayag ang sinasadyang pagpapakita nang hindi nagiging mabigat ang pananalita; pinanatili ang kongkretong “mga butas” at ang katawagang “mga Hebreo.”
