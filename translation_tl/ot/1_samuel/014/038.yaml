  text: וַ/יֹּ֣אמֶר שָׁא֔וּל גֹּ֣שֽׁוּ הֲלֹ֔ם כֹּ֖ל פִּנּ֣וֹת הָ/עָ֑ם וּ/דְע֣וּ וּ/רְא֔וּ בַּ/מָּ֗ה הָֽיְתָ֛ה הַ/חַטָּ֥את הַ/זֹּ֖את הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/038.yaml
  text: Then Saul said[a], “Come here, all you chiefs of the people, and know and see by what this sin has happened today.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Saul, “Lumapit kayo rito, kayong lahat na mga pinuno ng bayan, at alamin at tingnan kung paano nangyari ang kasalanang ito ngayong araw.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹּשׁוּ הֲלֹם
  choice: Lumapit kayo rito
  rationale: Ang maramihang pautos na גֹּשׁוּ kasama ng הֲלֹם ay panawagang lumapit sa kinaroroonan ni Saul. Likas at marangal sa modernong Tagalog ang “Lumapit kayo rito.”
- source_word: כֹּל פִּנּוֹת הָעָם
  choice: kayong lahat na mga pinuno ng bayan
  rationale: Literal itong “lahat ng mga sulok ng bayan,” ngunit isang idyoma para sa mga pinuno o kinatawan ng bayan. Inihahayag ng salin ang kahulugang idyomatiko nang hindi gumagamit ng malabong literalismo.
- source_word: וּדְעוּ וּרְאוּ
  choice: at alamin at tingnan
  rationale: 'Pinananatili ang dalawang pautos at ang diin ng Hebreo: magsiyasat upang malaman at tingnan o suriin ang bagay.'
- source_word: בַּמָּה
  choice: kung paano
  rationale: Ang ב + מה ay nagtatanong dito tungkol sa paraan o kaparaanan kung saan naganap ang kasalanan. Ang “kung paano” ang pinakanatural na katumbas sa Tagalog.
- source_word: הָיְתָה
  choice: nangyari
  rationale: Bagaman pangunahing nangangahulugang “naging” o “umiral,” sa konteksto ay tinatanong ni Saul kung paano naganap o sumapit ang kasalanan.
- source_word: הַחַטָּאת הַזֹּאת
  choice: ang kasalanang ito
  rationale: Tumutukoy ang חַטָּאת sa makasalanang gawa o paglabag na kaugnay ng hindi pagsagot ng Diyos sa salaysay. Pinananatili ng “kasalanan” ang moral at teolohikal na bigat nito.
- source_word: הַיּוֹם
  choice: ngayong araw
  rationale: Tuwirang temporal na pahayag; malinaw at natural ang “ngayong araw” sa marangal na modernong Tagalog.
theological_decisions:
- issue: Idyomatikong kahulugan ng “lahat ng mga sulok ng bayan”
  choice: mga pinuno ng bayan
  alternative: mga sulok ng bayan; mga puno ng bayan; mga kinatawan ng bayan
  rationale: Hindi literal na mga sulok ang tinutukoy kundi mga prominenteng tao o kinatawan ng mga pangkat ng bayan. Ang “mga pinuno” ay malinaw at hindi nagdaragdag ng partikular na istrukturang pampolitika.
- issue: Moral na bigat ng חַטָּאת
  choice: kasalanan
  alternative: paglabag; pagkakasala; masamang gawa
  rationale: Ang konteksto ay isang paglabag sa harap ng Diyos, kaya pinananatili ng “kasalanan” ang teolohikal na bigat nang hindi tinutukoy nang maaga kung sino ang nagkasala o eksaktong ano ang ginawa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “bayan” para sa collective na הָעָם at “mga pinuno” upang natural na ihayag ang Hebreong idyoma. Pinanatili ang magkatambal na “alamin at tingnan” sa halip na pagsamahin sa iisang pandiwa.
