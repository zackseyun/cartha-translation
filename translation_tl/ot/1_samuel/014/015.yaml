base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/015.yaml
  text: And there was trembling in the camp[a], in the field, and among all the people; the garrison and the raiding party also trembled. And the earth quaked, so that it became a trembling from God.
translation:
  language: tl
  text: At nagkaroon ng panginginig sa kampo, sa parang, at sa buong hukbo. Maging ang mga kawal sa himpilan at ang pangkat na nananalakay ay nanginig din. Yumanig ang lupa, at nagkaroon ng panginginig na mula sa Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “napakatinding panginginig” o “sindak na mula sa Diyos.” Maaaring ipahiwatig ng pariralang Hebreo ang pinagmulan (“mula sa Diyos”) o ang sukdulang tindi.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרָדָה / חרד
  choice: panginginig / nanginig
  rationale: Pinananatili ang konkretong larawan at ang pag-uulit ng salitang-ugat na tumutukoy sa panginginig dahil sa matinding takot.
- source_word: בַמַּחֲנֶה
  choice: sa kampo
  rationale: Tuwirang lokatibong salin na natural sa makabagong Filipino.
- source_word: בַשָּׂדֶה
  choice: sa parang
  rationale: Ang שׂדה ay maaaring tumukoy sa bukid o lantad na lupain; ang “parang” ay likas at sapat na malawak sa kontekstong militar.
- source_word: וּבְכָל הָעָם
  choice: at sa buong hukbo
  rationale: Bagaman literal na “buong bayan/mga tao,” militar ang konteksto at dito ay tumutukoy ang עָם sa mga kawal o hukbo.
- source_word: הַמַּצָּב
  choice: ang mga kawal sa himpilan
  rationale: Tumutukoy sa nakatalagang puwersa sa isang puwestong militar; mas malinaw ito sa karaniwang mambabasa kaysa sa hiniram na “garison.”
- source_word: הַמַּשְׁחִית
  choice: ang pangkat na nananalakay
  rationale: Ang Hiphil participle ay literal na kaugnay ng pagpuksa, ngunit sa salaysay-militar ay malamang na kolektibong tawag sa pangkat na sumasalakay o naninira.
- source_word: וַתִּרְגַּז הָאָרֶץ
  choice: Yumanig ang lupa
  rationale: Malinaw at masiglang salin ng pisikal na pagyanig ng lupa.
- source_word: לְחֶרְדַּת אֱלֹהִים
  choice: panginginig na mula sa Diyos
  rationale: Pinananatili sa pangunahing teksto ang posibleng genitive of source, habang inilalahad sa talababa ang maaari ring superlatibong kahulugan.
theological_decisions:
- issue: Kahulugan ng לְחֶרְדַּת אֱלֹהִים
  choice: panginginig na mula sa Diyos
  alternative: napakatinding panginginig; makadiyos na sindak
  rationale: Maaaring ipahiwatig ng parirala ang pinagmulan—na ang panginginig ay mula sa Diyos—o gamitin ang אֱלֹהִים bilang pagpapasidhi. Pinananatili ng pangunahing salin ang teolohikal na ugnayan sa Diyos nang hindi itinatago ang lehitimong alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hukbo” ayon sa kontekstong militar, “mga kawal sa himpilan” para sa malinaw na kahulugan ng puwersang nakapuwesto, at “pangkat na nananalakay” upang mapanatili ang kolektibong tungkuling militar.
