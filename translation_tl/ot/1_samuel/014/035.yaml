  text: And Saul built an altar to Yahweh[a]; this was the first altar he built to Yahweh.
translation:
  language: tl
  text: At nagtayo si Saul ng isang altar para kay Yahweh; ito ang unang altar na itinayo niya para kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “Sinimulan niyang itayo ito bilang isang altar para kay Yahweh.” Karaniwang inuunawa ang idyomang Hebreo bilang nangangahulugang ito ang unang altar na itinayo ni Saul para kay Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  choice: nagtayo
  rationale: Karaniwang pandiwang Filipino para sa pagtatayo ng isang altar; tuwiran nitong ipinapahayag ang בנה sa kontekstong ito.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Nakagawiang anyo sa Filipino ng pangalang Hebreo na שָׁאוּל.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Tumpak at matatag nang katawagan sa Filipino para sa lugar na pinaghahandugan.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahihiwatig ng ל ang pag-uukol o kaugnayan; natural sa Filipino ang “para kay” kapag ang altar ay iniuukol sa isang persona. Pinananatili ang personal na pangalang Yahweh.
- source_word: אֹתוֹ הֵחֵל לִבְנוֹת
  choice: ito ang unang altar na itinayo niya
  rationale: 'Ipinahahayag sa natural na Filipino ang karaniwang pagkaunawa sa mahirap na idyomang Hebreo: ito ang unang altar na itinayo ni Saul para kay Yahweh. Inilalahad sa talababa ang mas literal na posibleng pagbasa.'
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng אֹתוֹ הֵחֵל לִבְנוֹת
  choice: ito ang unang altar na itinayo niya
  alternative: iyon ang sinimulan niyang itayo bilang altar
  rationale: Ang pangunahing salin ay sumusunod sa karaniwang idyomatikong pagkaunawa na ito ang unang altar ni Saul para kay Yahweh, ngunit hindi itinatago ang mas literal at sintaktikong posibleng pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagtayo” at “para kay” bilang natural na pananalita, habang pinanatili ang terminong “altar” at ang pangalang “Yahweh.”
