base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/020.yaml
  text: Then Saul and all the people who were with him were summoned, and they came to the battle[a]. And behold, every man's sword was against his companion[b], with very great confusion.
translation:
  language: tl
  text: Pagkatapos, tinawag upang magtipon si Saul at ang lahat ng taong kasama niya, at dumating sila sa labanan.[a] At narito, ang tabak ng bawat isa ay laban sa kanyang kapwa—napakalaki ng kaguluhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumigaw si Saul at ang lahat ng taong kasama niya” o “nagtipon si Saul at ang lahat ng taong kasama niya.” Maaaring unawain sa mahigit isang paraan ang pandiwang Hebreo rito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “napakalaking sindak” o “napakalaking pagkakagulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֵק
  choice: tinipon
  rationale: Ang Niphal ng זעק ay maaaring magpahiwatig na tinawag o tinipon sila para kumilos. Pinananatili ng pasibong diwa ng “tinipon” ang anyo at daloy ng salaysay, samantalang inilalahad sa talababa ang tunay na kalabuan.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: ang buong hukbong kasama niya
  rationale: Bagaman literal na “ang buong bayang kasama niya,” militar ang konteksto; ang “hukbo” ay natural sa modernong Filipino at tumutukoy sa mga tauhan ni Saul nang hindi nililimitahan sa isang tiyak na yunit.
- source_word: וַיָּבֹאוּ עַד הַמִּלְחָמָה
  choice: pumunta sila sa labanan
  rationale: Likas na ipinahahayag nito ang pagdating nila sa lugar ng labanan nang hindi ipinapalagay na agad silang nakipagsagupaan.
- source_word: וְהִנֵּה
  choice: At nakita nilang
  rationale: Ang הִנֵּה ay tumatawag ng pansin sa biglang nasaksihan nila. Mas natural sa kasalukuyang Filipino ang “nakita nilang” kaysa sa literal na “narito,” habang pinananatili ang masiglang paglipat sa tanawin.
- source_word: חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: ang tabak ng bawat isa ay nakatutok sa kanyang kapwa
  rationale: Pinananatili nito ang larawang literal ng tabak ng isang tao laban sa kanyang kapwa at malinaw na ipinahihiwatig ang paglalaban-laban sa loob ng kampo.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: napakatindi ng kaguluhan
  rationale: Saklaw ng מְהוּמָה ang kaguluhan, sindak, at pagkakagulo. Ang “kaguluhan” ang pinakamalawak at natural na katumbas; ang “napakatindi” ay naghahatid sa גְּדוֹלָה מְאֹד.
