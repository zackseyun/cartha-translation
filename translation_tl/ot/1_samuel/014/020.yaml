revisions:
- from: Kaya tinipon si Saul at ang buong hukbong kasama niya, at pumunta sila sa labanan.[a] At nakita nilang ang tabak ng bawat isa ay nakatutok sa kanyang kapwa—napakatindi ng kaguluhan.[b]
  to: Pagkatapos, tinawag upang magtipon si Saul at ang lahat ng taong kasama niya, at dumating sila sa labanan.[a] At narito, ang tabak ng bawat isa ay laban sa kanyang kapwa—napakalaki ng kaguluhan.[b]
  rationale: Inalis ang di-sinusuportahang sanhi, ibinalik ang pantawag-pansing bisa ng וְהִנֵּה, at ginawang hindi labis na tiyak ang larawan ng mga tabak. Inayos din ang terminong para sa הָעָם upang mas malapit sa pinagmulan, habang pinananatiling natural ang Filipino at ang mga footnote anchor.
