id: 1SA.14.49
reference: 1 Samuel 14:49
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּֽהְיוּ֙ בְּנֵ֣י שָׁא֔וּל יוֹנָתָ֥ן וְ/יִשְׁוִ֖י וּ/מַלְכִּי שׁ֑וּעַ וְ/שֵׁם֙ שְׁתֵּ֣י בְנֹתָ֔י/ו שֵׁ֤ם הַ/בְּכִירָה֙ מֵרַ֔ב וְ/שֵׁ֥ם הַ/קְּטַנָּ֖ה מִיכַֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/049.yaml
  text: 'Saul’s sons were Jonathan[a], Ishvi, and Malchi-shua; and the names of his two daughters were these: the name of the firstborn was Merab[b], and the name of the younger was Michal.'
translation:
  language: tl
  text: 'Ang mga anak na lalaki ni Saul ay sina Jonatan, Isvi, at Malki-sua. Ang mga pangalan[a] ng dalawa niyang anak na babae ay ang mga ito: Merab ang pangalan ng panganay[b], at Mical ang pangalan ng nakababata.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang pangalan ng dalawa niyang anak na babae.” Ginamit sa teksto ang “mga pangalan” dahil dalawang pangalan ang binanggit.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nakatatanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay
  rationale: Ipinapahayag nito ang simpleng pagiging o pagkakakilanlan sa talaan. Hindi dinagdagan ng “Ngayon” dahil walang tahasang salitang panahunan na katumbas nito sa Hebreo.
- source_word: בְּנֵי שָׁאוּל
  choice: mga anak na lalaki ni Saul
  rationale: Malinaw na tinutukoy ang mga anak na lalaki, na ibinubukod sa mga anak na babae sa kasunod na sugnay.
- source_word: יוֹנָתָן
  choice: Jonatan
  rationale: Likas na transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: יִשְׁוִי
  choice: Isvi
  rationale: Transliterasyong malapit sa anyong Masoretiko at madaling basahin sa Filipino.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malki-sua
  rationale: Pinananatili ang dalawang sangkap ng pangalang Hebreo sa isang pangalang may gitling.
- source_word: וְשֵׁם שְׁתֵּי בְנֹתָיו
  choice: Ang mga pangalan ng dalawa niyang anak na babae
  rationale: Singular ang “pangalan” sa Hebreo, ngunit plural ang ginamit sa natural na Filipino dahil dalawang pangalan ang kasunod; itinabi sa talababa ang literal na anyo.
- source_word: הַבְּכִירָה
  choice: ang panganay
  rationale: Pinananatili ang tiyak na diwa ng kaayusan ng kapanganakan, hindi lamang ang mas matandang edad.
- source_word: מֵרַב
  choice: Merab
  rationale: Direktang transliterasyon ng pangalang Hebreo.
- source_word: הַקְּטַנָּה
  choice: ang nakababata
  rationale: Sa konteksto ng magkapatid, tumutukoy ito sa mas bata, hindi sa mas maliit ang katawan.
- source_word: מִיכַל
  choice: Mical
  rationale: Filipinong transliterasyon ng pangalang Hebreo, na binibigkas ang huling katinig bilang /l/.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa likas na paglilista ng mga pangalan at pinanatili ang pag-uulit ng “pangalan” sa ikalawang pangungusap upang masundan ang estruktura ng Hebreo nang hindi nagiging asiwa ang daloy.
