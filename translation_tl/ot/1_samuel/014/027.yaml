base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/027.yaml
  text: But Jonathan had not heard when his father put the people under oath[a], so he stretched out the tip of the staff that was in his hand and dipped it into the honeycomb, and he brought his hand to his mouth[b], and his eyes brightened.
translation:
  language: tl
  text: Ngunit hindi narinig ni Jonatan nang pasumpain ng kanyang ama ang mga tao. At iniunat niya ang dulo ng tungkod na hawak niya at isinawsaw iyon sa suklay ng pulot[a]. Pagkatapos, inilapit niya ang kanyang kamay sa kanyang bibig, at nagliwanag ang kanyang mga mata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “sa gubat” o “sa palumpong ng pulot.” Malamang na tumutukoy ang di-karaniwang ekspresyong Hebreo sa suklay o makapal na kumpol ng pulot.
    reason: lexical_alternative
  - marker: b
    text: Ang “nagliwanag ang kanyang mga mata” ay isang idyomang Hebreo na nagsasaad na nanumbalik ang kanyang sigla o pagkaalerto matapos kumain.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַע
  choice: hindi narinig
  rationale: Sa konteksto, hindi alam ni Jonatan ang tungkol sa panunumpa dahil hindi niya ito narinig; hindi ipinahihiwatig ng pandiwa na sadyang tumanggi siyang sumunod.
- source_word: בְּהַשְׁבִּיעַ
  choice: nang panumpain ng kanyang ama ang mga tao
  rationale: Ang Hiphil ng שבע ay nangangahulugang magpasumpa o maglagay sa ilalim ng isang sumpa. Ang “panumpain” ay maikli, natural, at nagpapanatili sa pormal na bisa ng utos.
- source_word: וַיִּשְׁלַח
  choice: iniunat niya
  rationale: Kapag ang layon ay ang dulo ng tungkod, ang kilos ay pag-abot o pag-unat nito, hindi literal na pagpapadala.
- source_word: קְצֵה הַמַּטֶּה
  choice: ang dulo ng tungkod
  rationale: Tuwirang inilalarawan nito ang bahaging isinawsaw; natural sa Filipino ang “dulo ng tungkod.”
- source_word: וַיִּטְבֹּל אוֹתָהּ
  choice: isinawsaw iyon
  rationale: Ang pambabaeng panghalip sa Hebreo ay tumutukoy sa dulo ng tungkod. Malinaw at natural ang “isinawsaw” para sa kilos.
- source_word: בְּיַעְרַת הַדְּבָשׁ
  choice: sa pulot-pukyutan
  rationale: Kakaiba ang ekspresyong Hebreo at maaaring literal na ilarawang “gubat/palumpong ng pulot,” ngunit sa konteksto ay tumutukoy sa kumpol o suklay ng pulot. Pinili ang karaniwang salitang Filipino at pinanatili sa talababa ang mas tiyak at literal na mga posibilidad.
- source_word: וַיָּשֶׁב יָדוֹ אֶל פִּיו
  choice: inilapit niya ang kanyang kamay sa bibig
  rationale: Pinananatili nito ang tahasang “kamay” at “bibig” ng Hebreo habang likas na inilalarawan ang pagkilos upang kainin ang pulot.
- source_word: וַתָּרְאֶנָה עֵינָיו
  choice: luminaw ang kanyang mga mata
  rationale: Pinananatili nito ang larawan ng idyomang Hebreo nang hindi tahasang pinapalitan ng interpretasyong “nanumbalik ang lakas.” Ipinaliliwanag sa talababa ang ipinahihiwatig na panibagong sigla o pagkaalerto.
