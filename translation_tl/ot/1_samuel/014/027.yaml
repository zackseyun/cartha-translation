  to: Ngunit hindi narinig ni Jonatan nang pasumpain ng kanyang ama ang mga tao. At iniunat niya ang dulo ng tungkod na hawak niya at isinawsaw iyon sa suklay ng pulot[a]. Pagkatapos, inilapit niya ang kanyang kamay sa kanyang bibig, at nagliwanag ang kanyang mga mata[b].
