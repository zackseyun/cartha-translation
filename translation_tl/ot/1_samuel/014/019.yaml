  text: וַ/יְהִ֗י עַ֣ד דִּבֶּ֤ר שָׁאוּל֙ אֶל הַ/כֹּהֵ֔ן וְ/הֶ/הָמ֗וֹן אֲשֶׁר֙ בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֔ים וַ/יֵּ֥לֶךְ הָל֖וֹךְ וָ/רָ֑ב וַ/יֹּ֧אמֶר שָׁא֛וּל אֶל הַ/כֹּהֵ֖ן אֱסֹ֥ף יָדֶֽ/ךָ־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/019.yaml
  text: And it happened[a], while Saul was speaking to the priest, that the tumult in the camp of the Philistines kept increasing more and more. So Saul said to the priest, “Withdraw your hand.”
translation:
  language: tl
  text: At habang nagsasalita si Saul sa pari, lalo pang tumitindi ang kaguluhan sa kampo ng mga Filisteo. Kaya sinabi ni Saul sa pari, “Iurong mo ang kamay mo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Tipunin mo ang kamay mo,” isang utos na itigil ng pari ang ginagawa niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד דִּבֶּר
  choice: At habang nagsasalita
  rationale: Ang וַיְהִי ay nagpapatuloy sa salaysay, at ang עַד דִּבֶּר ay nagsasaad ng kasabay at nagpapatuloy na kilos. Natural na naihahayag sa Tagalog ng “At habang nagsasalita” ang pangyayaring nagaganap hanggang sa pagkaantala.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Tuwirang katumbas ng כהן; tiyak ang tinutukoy na pari dahil naipakilala na siya sa naunang konteksto.
- source_word: הֶהָמוֹן
  choice: ang kaguluhan
  rationale: Ang המון dito ay hindi lamang ingay kundi magulong pagkilos at pagkakaingay sa kampo. Sinasaklaw ng “kaguluhan” ang kabuuang diwa nang natural sa modernong Tagalog.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: sa kampo ng mga Filisteo
  rationale: Malinaw at natural na salin ng pariralang konstruktong Hebreo, habang pinananatili ang pangmaramihang katawagan sa bayan.
- source_word: וַיֵּלֶךְ הָלוֹךְ וָרָב
  choice: lalo pang tumitindi
  rationale: Ipinahihiwatig ng pinagsamang pandiwa at infinitive absolute ang tuloy-tuloy na paglakas o pagdami. Ang “lalo pang tumitindi” ay maikli at likas na Tagalog para sa lumalalang kaguluhan.
- source_word: אֱסֹף יָדֶךָ
  choice: Iurong mo ang kamay mo
  rationale: Literal na larawan nito ang pagtitipon o pagbawi ng kamay. Pinananatili ng “Iurong mo ang kamay mo” ang konkretong larawan at ipinahihiwatig na ipatigil sa pari ang ginagawa niya nang hindi tinutukoy nang lampas sa teksto kung anong ritwal iyon.
theological_decisions:
- issue: Kung ano mismo ang ipinagagawa ng pari sa kaniyang kamay
  choice: Pinanatili ang konkretong utos na “Iurong mo ang kamay mo.”
  alternative: “Tumigil ka na” o tahasang pagtukoy sa isang partikular na gawaing ritwal
  rationale: Hindi tahasang pinangalanan sa talata ang kilos o gamit na sangkot. Ang konkretong pananalita ay nagpapanatili sa pagkukulang ng detalye at sa posibleng ritwal na konteksto nang hindi nagdaragdag ng interpretasyong denominasyonal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pari,” “kaguluhan,” at “kampo” bilang pangkaraniwan at madaling maunawaang mga salita. Inilagay ang talababa sa “Iurong mo ang kamay mo,” na siyang pariralang talagang ipinaliliwanag nito.
