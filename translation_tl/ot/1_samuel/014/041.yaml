base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/041.yaml
  text: Then Saul said to Yahweh[a], the God of Israel, “Give a perfect lot.” And Jonathan and Saul were taken, but the people escaped.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Saul kay Yahweh, ang Diyos ng Israel, “Ibigay mo ang walang kapintasang pasiya sa palabunutan.”[a] Sina Jonatan at Saul ang napili, ngunit hindi napili ang bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Ibigay mo ang ganap/walang kapintasan.” Malamang na humihiling ito ng isang tiyak at mapagkakatiwalaang pasiya sa pamamagitan ng palabunutan. Ihambing ang mas mahabang sinaunang pagbasa na iniingatan sa Septuagint: “Bakit hindi mo sinagot ang iyong lingkod ngayon? Kung nasa akin o kay Jonatan na anak ko ang kasalanang ito, O Yahweh, Diyos ng Israel, ibigay mo ang Urim; ngunit kung nasa iyong bayang Israel ito, ibigay mo ang Tummim.”'
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng titulong “Panginoon.”
- source_word: הָבָה
  choice: Magbigay ka
  rationale: Tuwirang kahilingan kay Yahweh; natural at malinaw ito sa modernong Filipino.
- source_word: תָמִים
  choice: ganap na pasiya sa palabunutan
  rationale: Ang salita ay nangangahulugang ganap, buo, o walang kapintasan. Dahil napakaikli ng Hebreo at palabunutan ang konteksto, idinagdag ang “pasiya sa palabunutan” upang ihayag ang malamang na diwa nang hindi itinatago ang literal na kahulugan.
- source_word: וַיִּלָּכֵד
  choice: ang napili
  rationale: Sa konteksto ng palabunutan, tumutukoy ito sa pagkakatukoy o pagkakapili sa mga taong sinisiyasat, hindi sa literal na pagkakahuli.
- source_word: יָצָאוּ
  choice: hindi napili
  rationale: Sa kaibahan ng mga napili sa palabunutan, ang bayan ay hindi natukoy. Mas malinaw ito sa Filipino kaysa sa literal na “lumabas,” at mas neutral kaysa “nakatakas.”
theological_decisions:
- issue: Anyo ng panalangin ni Saul sa tekstuwal na tradisyon
  choice: 'Sinunod sa pangunahing teksto ang maikli at mahirap na pagbasa ng Masoretic Text: “Magbigay ka ng ganap na pasiya sa palabunutan.”'
  alternative: Ang mas mahabang sinaunang pagbasa na iniingatan sa Septuagint, na tahasang bumabanggit sa Urim at Tummim.
  rationale: Ang ibinigay na pangunahing Hebreong sanggunian ay ang WLC/Masoretic Text. Pinanatili ang pagbasa nito sa katawan ng talata, samantalang inilagay sa talababa ang mahalagang mas mahabang sinaunang variant upang maging malinaw ang ebidensiyang tekstuwal nang hindi ito tahimik na ipinapasok sa salin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Tahasang inulit ang “sa palabunutan” sa ikalawang pangungusap upang linawin ang diwang ipinahihiwatig ng mga pandiwang Hebreo. Pinanatili ang pangalang Yahweh at iniwasan ang mga terminong may denominasyonal na kulay.
