  text: וַ/יֹּ֣אמֶר שָׁא֣וּל פֻּ֣צוּ בָ/עָ֡ם וַ/אֲמַרְתֶּ֣ם לָ/הֶ֡ם הַגִּ֣ישׁוּ אֵלַ/י֩ אִ֨ישׁ שׁוֹר֜/וֹ וְ/אִ֣ישׁ שְׂיֵ֗/הוּ וּ/שְׁחַטְתֶּ֤ם בָּ/זֶה֙ וַ/אֲכַלְתֶּ֔ם וְ/לֹֽא תֶחֶטְא֥וּ לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל אֶל הַ/דָּ֑ם וַ/יַּגִּ֨שׁוּ כָל הָ/עָ֜ם אִ֣ישׁ שׁוֹר֧/וֹ בְ/יָד֛/וֹ הַ/לַּ֖יְלָה וַ/יִּשְׁחֲטוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/034.yaml
  text: And Saul said[a], “Spread out among the people and tell them, ‘Each man must bring me his ox and each man his sheep, and you must slaughter them here and eat, so that you may not sin against Yahweh by eating with the blood.’” So all the people brought, each man his ox in his hand that night[b], and they slaughtered them there.
translation:
  language: tl
  text: Sinabi ni Saul, “Kumalat kayo sa gitna ng mga tao at sabihin ninyo sa kanila, ‘Dalhin sa akin ng bawat isa ang kanyang baka at ang kanyang tupa.[a] Katayin ninyo ang mga iyon dito at saka kainin, upang hindi kayo magkasala kay Yahweh sa pagkain ng karneng may dugo pa.[b]’” Kaya nang gabing iyon, dinala ng buong bayan ang kani-kaniyang baka, na akay nila,[c] at kinatay nila roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring tumukoy sa tupa, kambing, o maliit na alagang hayop.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “sa pagkain kasama ang dugo” o “sa ibabaw ng dugo”; tumutukoy ito sa pagkain ng karne bago maalis nang maayos ang dugo.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, literal na “bawat isa, ang kanyang baka sa kanyang kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֻּצוּ בָעָם
  choice: Kumalat kayo sa gitna ng mga tao
  rationale: Ang pautos na maramihan mula sa פוץ ay nagpapahiwatig ng pagkakalat o pagpunta sa iba't ibang bahagi ng karamihan. Natural ito sa Tagalog at angkop sa mga inuutusang maghatid ng mensahe sa buong kampo.
- source_word: הַגִּישׁוּ אֵלַי
  choice: Dalhin sa akin
  rationale: Ang Hiphil ng נגשׁ ay nangangahulugang ilapit o iharap. Ang “dalhin sa akin” ang malinaw at likas na katumbas sa kontekstong ito.
- source_word: אִישׁ שׁוֹרוֹ וְאִישׁ שְׂיֵהוּ
  choice: ng bawat isa ang kanyang baka at ang kanyang tupa
  rationale: Pinananatili nito ang distributibong diin ng inuulit na אִישׁ. Isinalin sa teksto ang שֶׂה bilang “tupa,” habang inilalahad sa talababa na maaari rin itong tumukoy sa kambing o, mas pangkalahatan, sa maliit na alagang hayop.
- source_word: וּשְׁחַטְתֶּם בָּזֶה
  choice: Katayin ninyo ang mga iyon dito
  rationale: Ang שׁחט ay tiyak na pagkatay ng hayop, hindi pangkalahatang pagpatay. Ang בָּזֶה ay likas na ginawang “dito,” nang hindi ipinapalagay na tahasang tinutukoy nito ang bato sa naunang talata.
- source_word: וַאֲכַלְתֶּם
  choice: at saka kainin
  rationale: Ipinakikita ng “saka” ang likas na pagkakasunod ng wastong pagkatay at pagkain.
- source_word: וְלֹא תֶחֶטְאוּ לַיהוָה
  choice: upang hindi kayo magkasala kay Yahweh
  rationale: Ipinahahayag ng parirala ang layuning makaiwas sa pagkakasala. Pinanatili ang personal na pangalang יהוה bilang “Yahweh.”
- source_word: לֶאֱכֹל אֶל־הַדָּם
  choice: sa pagkain ng karneng may dugo pa
  rationale: Ipinahahayag nito sa malinaw na Tagalog ang kontekstuwal na diwa ng pagkain bago maalis nang maayos ang dugo, samantalang pinananatili sa talababa ang mas literal at bahagyang malabong anyong “kasama ang dugo” o “sa ibabaw ng dugo.”
- source_word: אִישׁ שׁוֹרוֹ בְיָדוֹ
  choice: ang kani-kaniyang baka, na akay nila
  rationale: Ang literal na “baka niya sa kanyang kamay” ay isang idyomatikong paglalarawan ng personal na pagdadala o pag-akay sa hayop. Ang “akay nila” ay natural sa Tagalog; inilagay sa talababa ang literal na anyo.
- source_word: הַלַּיְלָה
  choice: nang gabing iyon
  rationale: Natural na salaysay na katumbas ng adberbiyal na gamit ng הַלַּיְלָה.
- source_word: וַיִּשְׁחֲטוּ שָׁם
  choice: at kinatay nila roon
  rationale: Pinananatili ng “kinatay” ang tiyak na kahulugan ng שׁחט; malinaw sa konteksto na ang mga hayop ang layon.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang nasa Hebreong teksto ang Tetragrammaton. Ang “Yahweh” ay tuwirang transliterasyon na hindi pinapalitan ang pangalang tipan ng isang titulo.
- issue: Kalikasan ng kasalanan sa pagkain na may dugo
  choice: Hindi tinukoy sa salin ang isang partikular na sistemang teolohikal; inilarawan lamang ang pagkain ng karneng may dugo pa
  alternative: Ipaliwanag ito bilang eksklusibong paglabag sa isang partikular na ritwal o doktrinang denominasyonal
  rationale: Ang talata ay tahasang tumatawag dito na pagkakasala kay Yahweh, ngunit hindi nito sa mismong talata nililinaw ang lahat ng teolohikal na batayan. Kaya hindi dinagdagan ang teksto ng denominasyonal na paliwanag.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Iniwasan ang lipas o labis na teknikal na pananalita. Ang “buong bayan” ay tumutukoy sa sambayanan o lahat ng tao, hindi lamang sa isang heograpikong bayan. Pinanatili ang malinaw na pautos at ang pagkakasunod ng pagkatay bago pagkain.
