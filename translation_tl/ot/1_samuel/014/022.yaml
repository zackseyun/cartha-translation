translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lalaking Israelita” upang mapanatili ang tahasang panlalaking anyo ng אִישׁ, at “kaburulan ng Efraim” bilang natural na katawagan sa heograpikong rehiyon.
