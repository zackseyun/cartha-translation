base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/022.yaml
  text: And every man of Israel who had hidden themselves in the hill country of Ephraim heard that the Philistines had fled[a], and they too joined the pursuit in the battle.
translation:
  language: tl
  text: Nang marinig ng lahat ng lalaking Israelita na nagtatago sa kaburulan ng Efraim na tumakas na ang mga Filisteo, sila rin ay mahigpit na tumugis sa mga ito sa labanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “kumapit sila sa pagsunod sa kanila sa labanan,” isang idyomang nangangahulugang mahigpit nilang tinugis ang tumatakas na mga Filisteo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  choice: lahat ng lalaking Israelita
  rationale: Ang כֹל na kasama ng kolektibong isahan na אִישׁ ay tumutukoy sa kabuuan ng mga lalaking Israelita. Likas sa Tagalog ang maramihang anyong “lahat ng lalaking Israelita,” at napapanatili nito ang tahasang panlalaking katawagan ng Hebreo.
- source_word: הַמִּתְחַבְּאִים
  choice: na nagtago
  rationale: Inilalarawan ng participle ang mga lalaking nasa kalagayang nagkubli bago nila narinig ang balita. Ang “nagtago” ay malinaw at natural sa daloy ng salaysay.
- source_word: בְּהַר אֶפְרַיִם
  choice: sa kaburulan ng Efraim
  rationale: Ang הַר dito ay rehiyong mataas at mabundok, hindi isang tanging bundok. Ang “kaburulan” ay natural na heograpikong katumbas sa modernong Tagalog.
- source_word: שָׁמְעוּ כִּי נָסוּ פְּלִשְׁתִּים
  choice: mabalitaan ... na tumatakas ang mga Filisteo
  rationale: Maaaring ipahiwatig ng נָסוּ na tumakas na sila o nasa aktuwal na pagtakas. Pinananatili ng “tumatakas” ang eksenang patuloy ang kanilang pag-atras nang sumali sa pagtugis ang mga Israelita.
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵיהֶם
  choice: mahigpit din nila silang tinugis
  rationale: Ang דבק na may אַחֲרֵי ay literal na “kumapit sa likuran” ngunit sa kontekstong militar ay nangangahulugang malapit o pursigidong pagtugis. Ang “mahigpit ... tinugis” ay tuwirang naghahatid ng idyoma habang inilalahad ang layon na “sila.”
- source_word: גַם הֵמָּה
  choice: din nila
  rationale: Ipinakikitang ang mga dating nagtatago ay nakibahagi rin sa ginagawang pagtugis ng iba.
- source_word: בַּמִּלְחָמָה
  choice: sa labanan
  rationale: Tumutukoy ito sa kasalukuyang sagupaan, hindi sa buong digmaan; kaya ang “labanan” ang angkop na kongkretong katawagan.
