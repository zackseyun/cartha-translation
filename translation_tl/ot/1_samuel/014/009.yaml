  text: אִם כֹּ֤ה יֹֽאמְרוּ֙ אֵלֵ֔י/נוּ דֹּ֕מּוּ עַד הַגִּיעֵ֖/נוּ אֲלֵי/כֶ֑ם וְ/עָמַ֣דְנוּ תַחְתֵּ֔י/נוּ וְ/לֹ֥א נַעֲלֶ֖ה אֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/009.yaml
  text: If they say to us like this[b][a], ‘Stay there until we come to you,’ then we will stand where we are and will not go up to them.
translation:
  language: tl
  text: 'Kung ganito ang sabihin nila sa atin: ‘Manatili kayo riyan[a] hanggang sa makarating kami sa inyo,’ mananatili tayo sa kinaroroonan natin[b] at hindi tayo aahon patungo sa kanila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tumigil kayo,” “Maghintay kayo,” o “Manahimik kayo.” Ang pandiwang Hebreo ay maaaring tumukoy sa pananatiling hindi kumikilos o hindi nagsasalita.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “tatayo tayo sa ilalim natin,” isang idyomang nangangahulugang mananatili sa sariling puwesto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם כֹּה יֹאמְרוּ אֵלֵינוּ
  choice: Kung ganito ang sabihin nila sa atin
  rationale: Likas na kondisyunal na pananalita sa Filipino; pinananatili ng “ganito” ang demonstratibong puwersa ng כֹּה at ipinakikilala ang tuwirang sinabi.
- source_word: דֹּמּוּ
  choice: Manatili kayo riyan
  rationale: Sa kontekstong militar, ang utos ay manatili sa puwesto at huwag munang lumapit. Nililinaw ng “riyan” ang praktikal na diwa nang hindi isinasantabi ang mga posibilidad na “tumigil” o “maghintay.”
- source_word: עַד הַגִּיעֵנוּ אֲלֵיכֶם
  choice: hanggang sa makarating kami sa inyo
  rationale: Tuwirang ipinapahayag ang pagkilos ng mga Filisteo patungo kina Jonatan; natural at malinaw ang “makarating” sa Filipino.
- source_word: וְעָמַדְנוּ תַחְתֵּינוּ
  choice: mananatili tayo sa kinaroroonan natin
  rationale: Isinasalin ang idyomang literal na tumutukoy sa pagtayo ‘sa ilalim ng sarili’ bilang pananatili sa sariling puwesto.
- source_word: וְלֹא נַעֲלֶה אֲלֵיהֶם
  choice: at hindi tayo aahon patungo sa kanila
  rationale: Pinananatili ng “aahon” ang topograpikong diwa ng עלה, yamang nasa mas mataas na puwesto ang mga Filisteo, nang hindi ito pinalalabas agad na tahasang pagsalakay.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “aahon” upang mapanatili ang pisikal na pag-akyat sa puwesto ng mga Filisteo, at ang mga talababa upang maipakita ang tunay na lawak ng kahulugan ng Hebreo.
