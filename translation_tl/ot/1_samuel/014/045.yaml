source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם אֶל שָׁא֗וּל הֲֽ/יוֹנָתָ֤ן יָמוּת֙ אֲשֶׁ֣ר עָ֠שָׂה הַ/יְשׁוּעָ֨ה הַ/גְּדוֹלָ֣ה הַ/זֹּאת֮ בְּ/יִשְׂרָאֵל֒ חָלִ֗ילָ/ה חַי יְהוָה֙ אִם יִפֹּ֞ל מִ/שַּׂעֲרַ֤ת רֹאשׁ/וֹ֙ אַ֔רְצָ/ה כִּֽי עִם אֱלֹהִ֥ים עָשָׂ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּפְדּ֥וּ הָ/עָ֛ם אֶת יוֹנָתָ֖ן וְ/לֹא מֵֽת־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/045.yaml
  text: But the people said to Saul[a], “Should Jonathan die, who has brought about this great deliverance in Israel? Far from it! As Yahweh lives, not one hair of his head shall fall to the ground, for he has worked with God this day.” So the people redeemed Jonathan[d][c][b], and he did not die.
translation:
  language: tl
  text: Ngunit sinabi ng bayan kay Saul, “Dapat bang mamatay si Jonatan, na nagdulot ng dakilang pagliligtas na ito sa Israel?[a] Huwag nawang mangyari![b] Buháy si Yahweh, ni isang buhok sa ulo niya ay hindi malalaglag sa lupa, sapagkat kumilos siya kasama ng Diyos sa araw na ito.”[c] Kaya tinubos ng bayan si Jonatan,[d] at hindi siya namatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pagliligtas” ay maaari ring isaling “kaligtasan” o “tagumpay.” Sa kontekstong ito, saklaw ng salitang Hebreo ang pagliligtas na nahayag sa tagumpay ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Malayo nawa!” Isa itong mariing pagtanggi; maaari ring isaling “Tiyak na hindi!”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sapagkat kasama ng Diyos ay kumilos siya ngayon.” Hindi ganap na tinutukoy ng parirala kung paano nagkaugnay ang pagkilos ni Jonatan at ang tulong o pagsang-ayon ng Diyos.
    reason: preserve_ambiguity
  - marker: d
    text: Maaari ring isaling “pinalaya” o “iniligtas.” Ang pandiwang Hebreo ay tumutukoy sa pagpapalaya mula sa isang paghahabol o hatol; walang tahasang binanggit na kabayaran dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיוֹנָתָן יָמוּת
  choice: Dapat bang mamatay si Jonatan
  rationale: Ang patanong na הֲ kasama ng pandiwang di-ganap ay isang mariing retorikal na pagtutol. Likas sa modernong Tagalog ang “Dapat bang mamatay” at hindi nito ginagawang payak na tanong tungkol sa hinaharap ang pahayag.
- source_word: הַיְשׁוּעָה הַגְּדוֹלָה הַזֹּאת
  choice: dakilang pagliligtas na ito
  rationale: Maaaring tumukoy ang יְשׁוּעָה sa pagliligtas, kaligtasan, o tagumpay. Ang “pagliligtas” ay angkop sa kontekstong militar ngunit hindi nililimitahan ang diwa sa tagumpay lamang sa labanan.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Pinananatili ng “sa Israel” ang likas na diwa ng pang-ukol ב bilang saklaw kung saan naganap ang pagliligtas, habang maaari pa ring maunawaang para sa kapakanan ng Israel iyon.
- source_word: חָלִילָה
  choice: Huwag nawang mangyari!
  rationale: Isa itong mariing pagtanggi. Ang salin ay natural at marangal sa Tagalog at hindi nagdaragdag ng tahasang pagtukoy sa Diyos na wala sa mismong salitang Hebreo.
- source_word: חַי יְהוָה
  choice: Buháy si Yahweh
  rationale: Pinananatili nito ang maikli at taimtim na pormula ng panunumpa sa Hebreo at ang personal na banal na pangalang Yahweh.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת רֹאשׁוֹ אַרְצָה
  choice: ni isang buhok sa ulo niya ay hindi malalaglag sa lupa
  rationale: Sa loob ng pormula ng panunumpa, ang אִם ay may mariing negatibong diwa. Malinaw na ipinahahayag ng karaniwang idyomang Tagalog ang ganap na pag-iingat kay Jonatan.
- source_word: כִּי עִם אֱלֹהִים עָשָׂה
  choice: sapagkat kumilos siya kasama ng Diyos
  rationale: Likas na kahulugan ng עִם ang “kasama.” Pinananatili ng salin ang pakikipag-ugnayan sa pagkilos ng Diyos nang hindi ipinapaliwanag nang higit sa sinasabi ng Hebreo kung paano nagkaugnay ang kilos ni Jonatan at ng Diyos.
- source_word: וַיִּפְדּוּ הָעָם אֶת יוֹנָתָן
  choice: Kaya tinubos ng bayan si Jonatan
  rationale: Ang פדה ay nangangahulugang tubusin o palayain mula sa isang paghahabol o hatol. Pinananatili ng “tinubos” ang legal na diwa ng pagpapalaya kay Jonatan mula sa kamatayan, kahit walang binanggit na kabayaran.
- source_word: וְלֹא מֵת
  choice: at hindi siya namatay
  rationale: Tuwirang pinananatili nito ang payak na pahayag ng resulta sa Hebreo nang hindi ito ginagawang pasibong “hindi pinatay,” bagaman iyon ang ipinahihiwatig ng konteksto.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng teksto ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal at tipanang pangalan sa halip na palitan ng isang titulo.
- issue: Diwa ng עִם אֱלֹהִים sa pagkilos ni Jonatan
  choice: kumilos siya kasama ng Diyos
  alternative: kumilos siya sa tulong ng Diyos; kumilos siya para sa Diyos
  rationale: Pinananatili ng “kasama ng Diyos” ang tunay na kalabuan at teolohikal na tensiyon ng עִם. Hindi nito nililimitahan ang parirala sa tulong lamang ng Diyos o sa paglilingkod lamang para sa Diyos.
- issue: Diwa ng pagtubos kay Jonatan
  choice: tinubos ng bayan si Jonatan
  alternative: iniligtas ng bayan si Jonatan; pinalaya ng bayan si Jonatan
  rationale: Ipinahihiwatig ng פדה ang pagtiyak ng paglaya mula sa umiiral na paghahabol o hatol. Hindi ipinapalagay ng salin na may literal na salaping ibinayad, at nililinaw iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa kolektibong הָעָם at ang payak na “ni isang buhok” para sa malinaw na idyoma. Pinanatili ang maikli at taimtim na pormula ng panunumpang “Buháy si Yahweh,” pati ang sadyang hindi lubos na ipinaliwanag na “kasama ng Diyos.”
