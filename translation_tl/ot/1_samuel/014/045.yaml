  source_fidelity: 'Tapat ang salin sa Hebreo: napananatili ang retorikal na tanong, ang lawak ng הַיְשׁוּעָה bilang “pagliligtas,” ang mariing pagtanggi, ang pormula ng panunumpa kay Yahweh, ang idyoma tungkol sa buhok, ang sadyang bukas na “kasama ng Diyos,” at ang payak na resultang hindi namatay si Jonatan.'
