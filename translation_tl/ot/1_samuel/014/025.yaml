  text: And all the people of the land entered the forest[b][a], and there was honey on the surface of the ground.
translation:
  language: tl
  text: At ang lahat ng tao sa lupain ay pumasok sa gubat, at may pulot-pukyutan sa ibabaw ng lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “sa ibabaw ng bukid.” Sa Hebreo, “sa ibabaw ng mukha ng bukid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: At ang buong bayan
  rationale: Literal na “ang buong lupain,” ngunit ang pandiwang maramihan at ang konteksto ay nagpapakitang metonimiya ito para sa mga taong naroon. Ang “buong bayan” ay likas sa Filipino at hindi nagdaragdag ng di-tiyak na kaugnayang “ng lupain.”
- source_word: בָּאוּ בַיַּעַר
  choice: ay pumasok sa gubat
  rationale: Ang בוא na sinusundan ng בְּ ay natural na tumutukoy sa pagpasok sa isang lugar; malinaw at karaniwan sa Filipino ang “pumasok sa gubat.”
- source_word: דְבַשׁ
  choice: pulot-pukyutan
  rationale: Ito ang malinaw na karaniwang salin ng “honey.” Hindi idinagdag ang “ligaw” sapagkat hindi iyon tahasang sinasabi ng Hebreo.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: sa ibabaw ng lupa
  rationale: Pinananatili ng “sa ibabaw” ang larawang nasa עַל־פני, samantalang ang “lupa” ay akma sa kapaligiran ng gubat at iniiwasan ang mapanlinlang na mas makitid na “bukid.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong bayan” upang ihayag ang malamang na kolektibong diwa ng literal na “buong lupain,” at nilagyan ng talababa ang tunay na saklaw ng שָׂדֶה. Ang tuldok ay inilagay pagkatapos ng footnote marker upang manatiling tuwirang nakakabit ang marker sa pariralang tinutukoy nito.
