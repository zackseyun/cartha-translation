id: 1SA.14.3
reference: 1 Samuel 14:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/אֲחִיָּ֣ה בֶן אֲחִט֡וּב אֲחִ֡י אִיכָב֣וֹד בֶּן פִּינְחָ֨ס בֶּן עֵלִ֜י כֹּהֵ֧ן יְהוָ֛ה בְּ/שִׁל֖וֹ נֹשֵׂ֣א אֵפ֑וֹד וְ/הָ/עָם֙ לֹ֣א יָדַ֔ע כִּ֥י הָלַ֖ךְ יוֹנָתָֽן־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/003.yaml
  text: Ahijah son of Ahitub[a], brother of Ichabod, son of Phinehas, son of Eli, priest of Yahweh at Shiloh, was carrying an ephod. And the people did not know that Jonathan had gone.
translation:
  language: tl
  text: Si Ahias, na anak ni Ahitub at kapatid ni Ichabod—na anak ni Finehas, na anak ni Eli—ang pari ni Yahweh sa Shilo, ay may dalang efod.[a] Hindi alam ng mga tao na umalis na si Jonatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “nakasuot ng efod.” Literal sa Hebreo: “nagdadala ng efod.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִיָּה
  choice: Si Ahias
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalan; hindi dinagdagan ng tahasang temporal na panandang wala sa Hebreo.
- source_word: בֶן אֲחִטוּב
  choice: na anak ni Ahitub
  rationale: Tuwirang pinananatili ang ugnayang genealogical sa natural na Tagalog.
- source_word: אֲחִי אִיכָבוֹד
  choice: kapatid ni Ichabod
  rationale: Ang payak na kahulugan ng אֲחִי ay kapatid; walang dahilan sa konteksto upang palawakin ito bilang kamag-anak lamang.
- source_word: בֶּן פִּינְחָס בֶּן עֵלִי
  choice: anak ni Finehas, na anak ni Eli
  rationale: Malinaw na pinananatili ang sunod-sunod na salinlahi.
- source_word: כֹּהֵן יְהוָה בְּ/שִׁלֹה
  choice: pari ni Yahweh sa Shilo
  rationale: Ang pariralang pantukoy ay iniuugnay kay Ahias; ang ב ay likas na isinaling 'sa' para sa lokasyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ng isang titulo.
- source_word: נֹשֵׂא אֵפוֹד
  choice: may dalang efod
  rationale: Pinananatili ang ubod na kahulugan ng נשא na pagdadala nang hindi ipinapalagay na suot niya ito.
- source_word: וְ/הָעָם לֹא יָדַע
  choice: Hindi alam ng mga tao
  rationale: Natural at malinaw na Tagalog para sa kolektibong pangngalan at negatibong pandiwa; hindi kailangang tumbasan nang mekanikal ang waw sa simula ng pangungusap.
- source_word: כִּי הָלַךְ יוֹנָתָן
  choice: na umalis na si Jonatan
  rationale: Ipinakikita ng 'na' na nauna ang pag-alis ni Jonatan sa kawalan nila ng kaalaman; ang הלך dito ay natural na 'umalis' sa Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito sa transliterasyon sa halip na palitan ng titulo.
- issue: Eksaktong paraan ng pagdadala sa efod
  choice: may dalang efod
  alternative: nakasuot ng efod
  rationale: Maaaring tumukoy ang konteksto sa isang kasuotang pansaserdote, ngunit literal na 'nagdadala/nagpapasan' ang pandiwang Hebreo; hindi nilutas nang tahimik ang posibleng kahulugan na 'nakasuot'.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga pangalang biblikal sa mga anyong karaniwan sa Tagalog hangga't angkop, at ipinaliwanag sa talababa ang tunay na leksikal na kalabuan.
