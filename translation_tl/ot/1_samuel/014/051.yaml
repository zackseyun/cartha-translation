  text: וְ/קִ֧ישׁ אֲבִֽי שָׁא֛וּל וְ/נֵ֥ר אֲבִֽי אַבְנֵ֖ר בֶּן אֲבִיאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/051.yaml
  text: Kish was the father of Saul[a], and Ner was the father of Abner, the son of Abiel.
translation:
  language: tl
  text: Si Kis ang ama ni Saul[a], at si Ner ang ama ni Abner, na anak ni Abiel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “At si Kis, ama ni Saul; at si Ner, ama ni Abner, anak ni Abiel.” Walang hayag na pandiwa ang Hebreo. Maaari ring unawain sa konteksto na si Ner, o kapuwa sina Kis at Ner, ang anak ni Abiel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/קִישׁ
  choice: Si Kis
  rationale: Pangngalang pantangi; ginamit ang karaniwang anyong Filipino na “Kis,” at ang “si” bilang likas na panandang personal.
- source_word: אֲבִי
  choice: ang ama ni
  rationale: Anyong construct ng “ama” sa sugnay na walang hayag na pandiwa; natural sa Tagalog ang hulma na “Si Kis ang ama ni Saul” nang hindi nagdaragdag ng pandiwang pantumbas.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: וְ/נֵר
  choice: at si Ner
  rationale: Tuwirang isinalin ang pangatnig at ginamit ang panandang personal bago ang pangalan.
- source_word: אֲבִי
  choice: ang ama ni
  rationale: Inulit ang genealogical na ugnayan upang mapanatili ang paralelismo at linaw ng Hebreo.
- source_word: אַבְנֵר
  choice: Abner
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: בֶּן
  choice: na anak ni
  rationale: Pinananatili ang literal na ugnayang “anak ni” at ang tunay na ambiguity kung si Abner o si Ner ang tuwirang tinutukoy ng parirala.
- source_word: אֲבִיאֵל
  choice: Abiel
  rationale: Karaniwang transliterasyon ng pangalang Hebreo sa Filipino.
theological_decisions:
- issue: Tinutukoy ng pariralang “anak ni Abiel”
  choice: Pinanatiling nakakabit sa pinakamalapit na pangalang “Abner” sa pangunahing teksto, ngunit nilinaw sa talababa ang posibleng genealogical na pagbasa.
  alternative: “Si Kis na ama ni Saul at si Ner na ama ni Abner ay mga anak ni Abiel,” o tahasang gawing si Ner ang anak ni Abiel.
  rationale: Sa tekstong Hebreo, ang isahang בֶּן (“anak”) kasunod ng “Abner” ay maaaring unang mabasa bilang pagtukoy kay Abner, bagaman ipinahihiwatig ng mas malawak na talaangkanan sa talata 50–51 na sina Kis at Ner ang mga anak ni Abiel. Hindi dapat tahimik na lutasin sa salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang simpleng hulma ng panaguri (“Si Kis ang ama…”) upang katawanin ang walang-pandiwang genealogical clause ng Hebreo. Pinanatili sa pangunahing teksto ang anyo at ambiguity ng huling parirala, na may maikling paliwanag sa talababa.
