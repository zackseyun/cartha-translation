base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/024.yaml
  text: The men of Israel were hard-pressed that day[a], and Saul put the people under an oath, saying, “Cursed is the man who eats food before evening, before I have avenged myself on my enemies.” So none of the people tasted food.
translation:
  language: tl
  text: Noong araw na iyon, nasa matinding kagipitan ang mga Israelita, at pinanumpa ni Saul ang mga tao. Sinabi niya, “Sumpain ang sinumang kumain bago gumabi, bago ako makapaghiganti sa aking mga kaaway!” Kaya walang sinuman sa mga tao ang tumikim ng pagkain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tinapay” sa dalawang pagbanggit; malamang na tumutukoy rito sa pagkain sa pangkalahatan, hindi lamang sa tinapay.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגַּשׂ
  choice: hirap na hirap
  rationale: Sa kontekstong ito, ang Niphal ay tumutukoy sa matinding kagipitan o paghihirap, hindi sa literal na paglapit. Natural sa modernong Tagalog ang “hirap na hirap” at angkop ito sa kalagayan ng mga Israelita.
- source_word: וַיֹּאֶל ... אֶת הָעָם
  choice: isinailalim ... sa isang sumpa
  rationale: Ipinakikita ng kasunod na pormulang אָרוּר na sapilitang ipinataw ni Saul sa mga tao ang isang sumpang nagbabawal sa pagkain. Mas malinaw ito kaysa sa teknikal o makalumang pananalita tungkol sa panunumpa.
- source_word: הָעָם
  choice: mga tao
  rationale: Pinananatili nito ang karaniwang kahulugan ng salitang Hebreo, bagaman sa konteksto ay tumutukoy ito sa mga kasamang mandirigma ni Saul.
- source_word: אָרוּר הָאִישׁ
  choice: Sumpain ang sinuman
  rationale: Natural na pormula ito ng sumpa sa Tagalog. Ang “sinuman” ay tumpak na naghahayag ng pangkalahatang saklaw ng singular na הָאִישׁ nang hindi nililimitahan ang diwa sa isang partikular na lalaki.
- source_word: יֹאכַל לֶחֶם
  choice: kumain
  rationale: Literal na “kumain ng tinapay,” ngunit idiomatiko rito ang לֶחֶם para sa pagkain sa pangkalahatan. Sa Tagalog, sapat at natural ang “kumain”; ipinaliliwanag sa talababa ang literal na larawan.
- source_word: עַד הָעֶרֶב
  choice: bago gumabi
  rationale: Malinaw at natural nitong ipinahahayag ang takdang panahon ng pagbabawal.
- source_word: וְנִקַּמְתִּי מֵאֹיְבַי
  choice: bago ako makapaghiganti sa aking mga kaaway
  rationale: Pinananatili ang unang panauhan at ang personal na paghihiganti ni Saul. Ang ikalawang “bago” ay natural na naghahayag ng temporal na kaugnayan ng sugnay sa pagbabawal.
- source_word: לֹא טָעַם ... לָחֶם
  choice: walang sinuman ... ang tumikim ng pagkain
  rationale: Pinananatili ang matingkad na pandiwang “tumikim,” habang ang “pagkain” ay naghahatid ng idiomatikong kahulugan ng לֶחֶם. Natural na Tagalog ang negatibong kolektibong pahayag.
