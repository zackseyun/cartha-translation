translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mga Israelita” bilang natural na katumbas ng “mga lalaki ng Israel,” at pinanatili ang personal at mapusok na himig ng sinabi ni Saul. Inilagay ang panandang [a] pagkatapos ng huling “pagkain” upang malinaw na sumaklaw sa dalawang paggamit ng לֶחֶם.
