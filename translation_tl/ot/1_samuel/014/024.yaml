- from: Nang araw na iyon, hirap na hirap ang mga Israelita. Ngunit isinailalim ni Saul ang mga tao sa isang sumpa. Sinabi niya, “Sumpain ang sinumang kumain bago gumabi at bago ako makapaghiganti sa aking mga kaaway!” Kaya walang sinuman sa mga tao ang tumikim ng pagkain.[a]
  to: Noong araw na iyon, nasa matinding kagipitan ang mga Israelita, at pinanumpa ni Saul ang mga tao. Sinabi niya, “Sumpain ang sinumang kumain bago gumabi, bago ako makapaghiganti sa aking mga kaaway!” Kaya walang sinuman sa mga tao ang tumikim ng pagkain.[a]
