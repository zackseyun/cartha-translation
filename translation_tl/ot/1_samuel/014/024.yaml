  terminology: Pinalitan ang "isinailalim ... sa isang sumpa" ng "pinanumpa" upang mapanatili ang elementong panunumpa, habang nananatili ang pormula ng sumpa sa tuwirang sinabi ni Saul. Pinanatili ang "mga Israelita," "mga tao," "sumpain," at "pagkain."
