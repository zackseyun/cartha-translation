reference: 1 Samuel 14:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י חַי יְהוָ֗ה הַ/מּוֹשִׁ֨יעַ֙ אֶת יִשְׂרָאֵ֔ל כִּ֧י אִם יֶשְׁנ֛/וֹ בְּ/יוֹנָתָ֥ן בְּנִ֖/י כִּ֣י מ֣וֹת יָמ֑וּת וְ/אֵ֥ין עֹנֵ֖/הוּ מִ/כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/039.yaml
  text: For as Yahweh lives[a], who saves Israel, even if it is in Jonathan my son, he shall surely die.” But not one of all the people answered him.
translation:
  language: tl
  text: '“Sapagkat buháy si Yahweh, na nagliligtas sa Israel: kahit nasa anak kong si Jonatan ito[a], tiyak na mamamatay siya.” Ngunit wala ni isa man sa buong bayan ang sumagot sa kanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kahit nasa anak kong si Jonatan ito”—hindi tahasang binanggit kung ano ang “ito”; ipinahihiwatig ng konteksto na ang kasalanan o paglabag na sinisiyasat ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: buháy si Yahweh
  rationale: Pinananatili ang karaniwang pormula ng panunumpa sa Hebreo sa isang natural ngunit maringal na anyong Tagalog.
- source_word: הַמּוֹשִׁיעַ אֶת יִשְׂרָאֵל
  choice: na nagliligtas sa Israel
  rationale: Ipinahahayag ng may-pantukoy na participle ang patuloy na pagkakakilanlan kay Yahweh bilang tagapagligtas ng Israel.
- source_word: כִּי אִם
  choice: kahit
  rationale: Sa konteksto ng panunumpa, ipinakikilala nito ang sukdulang ipinapalagay na kaso—maging ang sariling anak ni Saul.
- source_word: יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: nasa anak kong si Jonatan ang kasalanan
  rationale: Likas sa Tagalog ang ganitong ayos. Idinagdag ang kontekstuwal na ipinahihiwatig na ‘kasalanan’ upang maging malinaw, habang itinatala sa talababa na hindi tahasang binanggit ang bagay sa Hebreo.
- source_word: מוֹת יָמוּת
  choice: tiyak na mamamatay siya
  rationale: Inihahatid ang matinding katiyakan ng infinitive absolute na kasunod ng imperfect nang hindi ginagawang tahasan ang paraan ng kamatayan.
- source_word: וְאֵין עֹנֵהוּ מִכָּל הָעָם
  choice: Ngunit wala ni isa man sa buong bayan ang sumagot sa kanya
  rationale: 'Ang ‘ni isa man’ ay malinaw na naghahatid ng partitive na diwa: walang sinuman mula sa buong bayan ang tumugon.'
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit ang proyekto nitong anyo ng Tetragrammaton at pinananatiling pangalan, hindi pamagat.
- issue: Hindi tahasang layon ng יֶשְׁנוֹ
  choice: kasalanan sa pangunahing teksto, na may paliwanag sa talababa
  alternative: 'panatilihing walang tiyak na layon: ‘kahit nasa anak kong si Jonatan ito’'
  rationale: Sa konteksto, ang sinisiyasat ay pananagutan o paglabag. Nililinaw ito para sa natural na Tagalog ngunit hindi itinatago ang ellipsis ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na maringal ngunit madaling maunawaan. Ginamit ang kudlit sa ‘buháy’ upang malinaw na ito ang pang-uri sa pormula ng panunumpa, hindi ang pangngalang ‘búhay.’
