  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: kumilos si Saul nang may katapangan, tinalo niya ang Amalek, at iniligtas niya ang Israel mula sa mananamsam nito. Gayunman, ang “mga nanamsam dito” ay karaniwang lokatibo sa Tagalog (“mga nanamsam doon/sa lugar na ito”) at hindi malinaw na ipinapahayag na Israel ang sinamsam. Kailangang ituwid ang ugnayang ito sa layon.'
  naturalness: Marangal at likas sa modernong Filipino Tagalog ang “Buong tapang siyang nakipaglaban,” “nilupig,” at “mula sa kamay ng.” Mas malinaw at natural ang “mga nanamsam sa Israel” kaysa “mga nanamsam dito.”
  terminology: Ang “Amalek,” “Israel,” at “iniligtas” ay wasto at angkop. Ang “mga Amalekita” sa talababa ay nakatutulong upang ipaliwanag ang kolektibong gamit ng pangalang Amalek.
