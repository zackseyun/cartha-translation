translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang idyomang “mula sa kamay” dahil nauunawaan pa rin ito at inilalarawan nito ang kapangyarihan ng mga mandarambong. Ginamit ang “dito” sa halip na panghalip na may kasarian upang malinaw na tumukoy sa Israel.
