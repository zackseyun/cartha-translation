  text: He fought valiantly and struck Amalek[c][b][a], and he delivered Israel from the hand of those who plundered it.
translation:
  language: tl
  text: Buong tapang siyang nakipaglaban[a] at nilupig ang Amalek[b], at iniligtas niya ang Israel mula sa kamay ng mga nanamsam sa Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “gumawa ng lakas/kagitingan,” isang idyoma para sa matapang na pagkilos o pagtatagumpay sa digmaan.
    reason: lexical_alternative
  - marker: b
    text: Ang “Amalek” ay tumutukoy rito sa mga Amalekita bilang isang bayan.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “mula sa kamay ng nanamsam sa kanya.” Isahan ang anyo, ngunit maaari itong unawain nang kolektibo dahil ang tinutukoy ay ang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ חַיִל
  choice: Buong tapang siyang nakipaglaban
  rationale: Ang literal na “gumawa ng lakas/kagitingan” ay isang idyomang Hebreo para sa pagkilos nang buong tapang o pagtatagumpay sa digmaan. Likas sa modernong Tagalog ang saling ito at angkop sa kontekstong militar.
- source_word: וַיַּךְ
  choice: nilupig
  rationale: Ang נכה ay maaaring mangahulugang hampasin o talunin. Sa salaysay ng digmaan, malinaw at natural na ipinahahayag ng “nilupig” ang matagumpay na pagsalakay nang hindi kailangang gawing literal na pisikal na paghampas.
- source_word: עֲמָלֵק
  choice: ang Amalek
  rationale: Pinananatili ang pangalang nasa Hebreo. Dito, tumutukoy ang “Amalek” sa mga Amalekita bilang isang bayan.
- source_word: וַיַּצֵּל
  choice: iniligtas
  rationale: Sa anyong Hiphil, ang נצל ay nangangahulugang sagipin o iligtas mula sa kapangyarihan o panganib. Karaniwan, malinaw, at hindi labis na teolohikal ang “iniligtas.”
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang larawang Hebreo ng “kamay” bilang kapangyarihan o kontrol; nauunawaan din ito sa dignified na wikang Tagalog.
- source_word: שֹׁסֵהוּ
  choice: mga nanamsam dito
  rationale: Ang participle ay tumutukoy sa nananamsam o mandarambong. Bagaman nasa anyong isahan ang Hebreo, likas itong maunawaan nang kolektibo; ang “dito” ay tumutukoy sa bansang Israel.
