  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו לְכָ/ה֙ וְ/נַעְבְּרָ֗ה אֶל מַצַּב֙ הָ/עֲרֵלִ֣ים הָ/אֵ֔לֶּה אוּלַ֛י יַעֲשֶׂ֥ה יְהוָ֖ה לָ֑/נוּ כִּ֣י אֵ֤ין לַֽ/יהוָה֙ מַעְצ֔וֹר לְ/הוֹשִׁ֥יעַ בְּ/רַ֖ב א֥וֹ בִ/מְעָֽט־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/006.yaml
  text: Then Jonathan said to the young man who carried his armor[a], “Come, let us cross over to the garrison of these uncircumcised men. Perhaps Yahweh will act for us[c][b], for nothing can hinder Yahweh from saving by many or by few.”
translation:
  language: tl
  text: Sinabi ni Jonatan sa binatang tagapagdala ng kanyang mga sandata, “Halika, tumawid tayo patungo sa himpilan[a] ng mga di-tuling ito.[b] Marahil ay kikilos si Yahweh para sa atin, sapagkat walang makahahadlang kay Yahweh na magligtas sa pamamagitan man ng marami o ng kaunti.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “puwestong militar.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga di-tuling ito”; isang mapanuyang katawagang may bigat na kaugnay ng tipan.
    reason: cultural_note
  - marker: c
    text: 'Sa mas literal na salin: “sapagkat walang pagpigil para kay Yahweh upang magligtas sa pamamagitan man ng marami o ng kaunti.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: binatang tagapagdala ng kanyang mga sandata
  rationale: Inilalarawan ng pariralang Hebreo ang kabataang nagdadala ng kagamitang pandigma ni Jonatan. Ang saling ito ay malinaw at natural, at hindi nililimitahan ang כֵּלִים sa pananggalang lamang.
- source_word: לְכָה וְנַעְבְּרָה
  choice: Halika, tumawid tayo
  rationale: Pinananatili nito ang paanyaya ng pautos na pandiwa at ang sama-samang pagpapasiya ng cohortative; ang “tumawid” ay angkop sa paggalaw nila sa lupain.
- source_word: מַצַּב
  choice: himpilan
  rationale: Sa kontekstong militar, tumutukoy ito sa isang nakatalagang posisyon o puwesto ng mga Filisteo. Natural sa Filipino ang “himpilan,” habang posible rin ang “tanod-himpilan.”
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: mga di-tuling ito
  rationale: Pinananatili ang literal at mapanuyang katawagang may bigat na tipanan, sa halip na palitan ito ng tahasang etnikong katawagang “mga Filisteo.”
- source_word: אוּלַי
  choice: Marahil
  rationale: Ipinahahayag nito ang pag-asa ni Jonatan nang hindi ginagawang tiyak ang magiging pagkilos ni Yahweh.
- source_word: יַעֲשֶׂה יְהוָה לָנוּ
  choice: kikilos si Yahweh para sa atin
  rationale: Malawak ang kahulugan ng עשה, at sa konteksto ay tumutukoy sa mapagpasiyang pagkilos ng Diyos nang hindi tinutukoy nang higit sa sinasabi ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֵין לַיהוָה מַעְצוֹר
  choice: walang makahahadlang kay Yahweh
  rationale: Idyomatikong ipinahahayag nito ang kawalan ng anumang pumipigil o naglilimita kay Yahweh, habang ang mas literal na anyo ay inilalahad sa talababa.
- source_word: לְהוֹשִׁיעַ
  choice: sa pagliligtas
  rationale: Ang ugat ay tumutukoy rito sa pagliligtas o pagpapalaya sa panganib, partikular sa kontekstong militar, nang hindi inaalis ang mas malawak na gamit nito sa Kasulatan.
- source_word: בְּרַב אוֹ בִמְעָט
  choice: sa pamamagitan man ng marami o ng kaunti
  rationale: Pinananatili ang paghahambing sa bilang ng mga taong maaaring gamitin bilang kasangkapan sa pagliligtas.
theological_decisions:
- issue: Paglalarawan sa kawalang-hanggan ng kakayahan ni Yahweh na magligtas
  choice: walang makahahadlang kay Yahweh sa pagliligtas
  alternative: walang pagpigil para kay Yahweh upang magligtas
  rationale: Ang pangunahing salin ay natural sa modernong Filipino at hindi nagdaragdag ng tiyak na doktrinal na paliwanag; ang literal na kayarian ay pinananatili sa talababa.
- issue: Katiyakan o posibilidad ng pagkilos ng Diyos
  choice: Marahil ay kikilos si Yahweh para sa atin
  alternative: Kikilos si Yahweh para sa atin
  rationale: Pinananatili ang אוּלַי at ang tensiyon sa pagitan ng tiwala ni Jonatan sa kapangyarihan ni Yahweh at ng hindi niya pag-aangkin na tiyak ang gagawin ng Diyos.
- issue: Pagtukoy sa mga kalaban bilang הָעֲרֵלִים
  choice: mga di-tuling ito
  alternative: mga Filisteong ito
  rationale: Pinananatili ang katawagang nasa Hebreo at ang bigat nitong kaugnay ng tipan, nang hindi ito pinapalitan ng etnikong pagkakakilanlang ipinahihiwatig lamang ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sandata” sa halip na “baluti” upang masaklaw ang כֵלִים, “himpilan” bilang malinaw na terminong militar, at “di-tuli” upang mapanatili ang matalim at tipanang himig ng Hebreo. Ang mga pangungusap ay nananatiling tuwiran at angkop sa salaysay.
