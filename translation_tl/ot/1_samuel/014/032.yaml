  text: ו/יעש הָ/עָם֙ אֶל שלל וַ/יִּקְח֨וּ צֹ֧אן וּ/בָקָ֛ר וּ/בְנֵ֥י בָקָ֖ר וַ/יִּשְׁחֲטוּ אָ֑רְצָ/ה וַ/יֹּ֥אכַל הָ/עָ֖ם עַל הַ/דָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/032.yaml
  text: Then the people rushed upon the spoil and took sheep and cattle and calves[a], and they slaughtered them on the ground[b], and the people ate with the blood.
translation:
  language: tl
  text: Pagkatapos, sinugod ng mga tao ang nasamsam[a]. Kumuha sila ng mga tupa, mga baka, at mga guya, at kinatay ang mga iyon sa lupa. Kinain ng mga tao ang mga iyon kasama ng dugo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “dumagsa ang mga tao sa nasamsam.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, kinain nila ang karne habang naroon pa ang dugo nito, nang hindi muna ito pinatulo nang maayos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָעָם אֶל שָׁלָל
  choice: sinugod ng mga tao ang nasamsam
  rationale: Ang di-karaniwang parirala ay naglalarawan ng biglaan at marahas na pagdagsa ng gutom na mga tao sa samsam. Likas sa modernong Tagalog ang “sinugod,” habang pinananatili ng “nasamsam” ang konteksto ng digmaan.
- source_word: שָׁלָל
  choice: nasamsam
  rationale: Tumutukoy ito sa mga bagay o hayop na nakuha bilang samsam sa labanan. Mas karaniwan at malinaw sa Tagalog ang “nasamsam” kaysa sa mas teknikal na “samsam sa digmaan.”
- source_word: צֹאן
  choice: mga tupa
  rationale: Bagaman maaari itong tumukoy nang mas malawak sa maliliit na alagang hayop, ang “mga tupa” ay angkop at malinaw sa listahang ito.
- source_word: בָּקָר
  choice: mga baka
  rationale: Pangkalahatang tawag ito sa mga bovine; natural at sapat na malawak ang “mga baka” sa Tagalog.
- source_word: בְּנֵי בָקָר
  choice: mga guya
  rationale: Literal na “mga anak ng baka,” isang idyoma para sa mga batang baka. Ang “mga guya” ang natural na katumbas sa modernong Tagalog.
- source_word: וַיִּשְׁחֲטוּ אָרְצָה
  choice: kinatay ang mga iyon sa lupa
  rationale: Pinananatili nito ang larawan ng pagkakatay mismo sa lupa. Ang layon na “mga iyon” ay malinaw na tumutukoy sa mga hayop sa naunang talaan.
- source_word: עַל־הַדָּם
  choice: kasama ng dugo
  rationale: Malapit ito sa maikli at mariing Hebreong parirala. Hindi tahasang nilulutas sa pangunahing teksto kung paano naroon ang dugo; ipinapaliwanag sa talababa ang malamang na diwa sa konteksto.
theological_decisions:
- issue: Kung gaano kalinaw na ipapahayag ang paglabag na kaugnay ng עַל־הַדָּם
  choice: kasama ng dugo
  alternative: nang may dugo pa ang karne
  rationale: Maikli at hindi ganap na tahasan ang Hebreo. Pinananatili ng salin ang anyo at tensiyong iyon, samantalang inilalagay sa talababa ang paliwanag na hindi muna pinatulo nang maayos ang dugo.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Ang “sinugod” ay buhay ngunit hindi kolokyal; ang “nasamsam” ay madaling maunawaan sa konteksto ng digmaan. Inilagay ang mga pananda ng talababa sa mismong pariralang tinutukoy ng bawat paliwanag.
