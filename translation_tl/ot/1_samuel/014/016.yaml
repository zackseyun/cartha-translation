  yaml_path: translation/ot/1_samuel/014/016.yaml
  text: And Saul’s watchmen in Gibeah of Benjamin looked[a], and behold, the multitude was melting away, and it went here and there.
translation:
  language: tl
  text: Tumingin ang mga bantay ni Saul sa Gibea ng Benjamin, at narito, nagkakawatak-watak ang pulutong at kumikilos kung saan-saan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang karamihan ay natutunaw at gumagalaw kung saan-saan.” Maikli at siksik ang pananalita sa Hebreo at inilalarawan nito ang hayag na kaguluhan sa hanay ng mga Filisteo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפִים
  choice: mga bantay
  rationale: Tumutukoy ang anyong pandiwari sa mga taong nakatalaga upang magmasid. Likas sa makabagong Tagalog ang “mga bantay” sa kontekstong militar.
- source_word: לְשָׁאוּל
  choice: ni Saul
  rationale: 'Ipinahihiwatig ng ל ang pagkakaugnay o pag-aari: ang mga bantay na nakatalaga kay Saul. Pinakanatural itong ipahayag sa Tagalog bilang “mga bantay ni Saul.”'
- source_word: בְּגִבְעַת בִּנְיָמִן
  choice: sa Gibea ng Benjamin
  rationale: Pinananatili nito ang pangalan ng lugar at ang pagkakaugnay nito sa Benjamin sa malinaw na anyong Tagalog.
- source_word: וְהִנֵּה
  choice: at narito
  rationale: Ang הִנֵּה ay pantawag-pansin na nagbibigay-diin sa biglang nakita ng mga bantay. Pinananatili ng “at narito” ang kasiglahan ng salaysay.
- source_word: הֶהָמוֹן
  choice: ang pulutong
  rationale: Maaaring mangahulugan ang הָמוֹן ng karamihan, pulutong, o maingay na hukbo. Ang “pulutong” ay kolektibo at angkop sa tagpong militar nang hindi labis na tinutukoy ang kahulugan.
- source_word: נָמוֹג
  choice: nagkakawatak-watak
  rationale: Literal na inilalarawan ng מוג ang pagkatunaw, ngunit sa hukbong nasa kaguluhan ay tumutukoy ito sa pagkawala ng pagkakabuo o katatagan. Ang “nagkakawatak-watak” ay natural at malinaw habang pinananatili ang larawan ng pagguho ng pulutong.
- source_word: וַיֵּלֶךְ וַהֲלֹם
  choice: at paroo’t parito
  rationale: Maikli at hindi pangkaraniwan ang Hebreo. Sa konteksto, inilalarawan nito ang pulutong na gumagalaw sa iba’t ibang direksiyon; natural itong naihahatid ng “paroo’t parito.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal ang ginamit. Pinanatili ang pantawag-pansing “narito,” samantalang isinalin nang idiomatiko ang larawan ng pagkatunaw bilang pagkakawatak-watak. Hindi tahasang idinagdag sa pangunahing teksto ang “mga Filisteo,” sapagkat hindi sila pinangalanan sa talatang Hebreo mismo.
