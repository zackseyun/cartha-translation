  terminology: Ang “mga bantay,” “Gibea ng Benjamin,” “pulutong,” at “mga Filisteo” sa paliwanag ay angkop. Inalis ang “tila” sa talababa dahil hindi ito nasa Hebreo at hindi kailangan upang ipahayag ang literal na larawan ng pagkatunaw.
