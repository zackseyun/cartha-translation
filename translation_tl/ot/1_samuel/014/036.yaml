- from: Sinabi ni Saul, “Habulin natin ang mga Filisteo ngayong gabi at samsaman sila hanggang magbukang-liwayway. Huwag tayong magtira ni isa man sa kanila.” Sinabi nila, “Gawin mo ang anumang mabuti sa paningin mo.” Ngunit sinabi ng pari, “Lumapit muna tayo rito sa Diyos.”
  to: Sinabi ni Saul, “Bumaba tayo upang tugisin ang mga Filisteo sa gabi at samsaman natin sila hanggang magbukang-liwayway. Huwag tayong magtira ni isa man sa kanila.” Sinabi nila, “Gawin mo ang anumang sa tingin mo ay mabuti.” Ngunit sinabi ng pari, “Lumapit tayo rito sa Diyos.”
