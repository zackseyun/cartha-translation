  text: וַ/יֹּ֣אמֶר שָׁא֡וּל נֵרְדָ֣ה אַחֲרֵי֩ פְלִשְׁתִּ֨ים לַ֜יְלָה וְֽ/נָבֹ֥זָה בָ/הֶ֣ם עַד א֣וֹר הַ/בֹּ֗קֶר וְ/לֹֽא נַשְׁאֵ֤ר בָּ/הֶם֙ אִ֔ישׁ וַ/יֹּ֣אמְר֔וּ כָּל הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עֲשֵׂ֑ה וַ/יֹּ֨אמֶר֙ הַ/כֹּהֵ֔ן נִקְרְבָ֥ה הֲלֹ֖ם אֶל הָ/אֱלֹהִֽים׀׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/036.yaml
  text: Then Saul said[a], “Let us go down after the Philistines by night and plunder them until the light of the morning, and let us not leave a man among them.” And they said, “Do whatever seems good in your eyes.” But the priest said, “Let us draw near here to God.”
translation:
  language: tl
  text: Sinabi ni Saul, “Bumaba tayo upang tugisin ang mga Filisteo sa gabi at samsaman natin sila hanggang magbukang-liwayway. Huwag tayong magtira ni isa man sa kanila.” Sinabi nila, “Gawin mo ang anumang sa tingin mo ay mabuti.” Ngunit sinabi ng pari, “Lumapit tayo rito sa Diyos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵרְדָה אַחֲרֵי פְלִשְׁתִּים
  choice: Habulin natin ang mga Filisteo
  rationale: Ang cohortative na נֵרְדָה ay mungkahing sama-samang kumilos, at ang אַחֲרֵי sa kontekstong militar ay nagpapahiwatig ng pagtugis. Mas natural sa modernong Tagalog ang “habulin natin” kaysa literal na “bumaba tayo kasunod,” habang napapanatili ang diwa.
- source_word: לַיְלָה
  choice: ngayong gabi
  rationale: Nagsasaad ito ng panahong gabi para sa iminungkahing pagsalakay. Sa agarang konteksto ng balak ni Saul, natural na ipinahihiwatig ang gabing iyon.
- source_word: וְנָבֹזָה בָהֶם
  choice: at samsaman sila
  rationale: Ang בזז ay tumutukoy sa pandarambong o pagkuha ng samsam. Ang “samsaman sila” ay maikli, natural, at pinananatili ang ideya ng pagdambong sa mga Filisteo.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: hanggang magbukang-liwayway
  rationale: Natural na katumbas sa Tagalog ng pagdating ng liwanag sa umaga, nang hindi binabago ang hangganan ng panahon.
- source_word: וְלֹא נַשְׁאֵר בָּהֶם אִישׁ
  choice: Huwag tayong magtira ni isa man sa kanila
  rationale: Pinananatili ang volitional na daloy at ang distributibong אִישׁ. Hindi idinagdag ang “buhay,” sapagkat ipinahihiwatig lamang iyon at hindi tahasang nasa Hebreo.
- source_word: כָּל הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: Gawin mo ang anumang mabuti sa paningin mo
  rationale: Pinananatili ang larawang Hebreo ng pagiging mabuti “sa iyong paningin,” ngunit nasa malinaw at dignidad na modernong Tagalog.
- source_word: נִקְרְבָה הֲלֹם אֶל הָאֱלֹהִים
  choice: Lumapit muna tayo rito sa Diyos
  rationale: Ang “lumapit” ay tuwirang katumbas ng קרב at ang “rito” ay kumakatawan sa הֲלֹם. Ang “muna” ay ginagawang malinaw sa natural na Tagalog ang pagkakasunod na ipinahihiwatig ng pagtutol ng pari, nang hindi tinutukoy ang isang partikular na ritwal ng pagsangguni.
theological_decisions:
- issue: Ipinahihiwatig na pagsangguni sa Diyos bago ang labanan
  choice: “Lumapit muna tayo rito sa Diyos,” nang hindi tahasang sinasabing “sumangguni” o “magtanong.”
  alternative: “Sumangguni muna tayo rito sa Diyos.”
  rationale: Ang Hebreo ay literal na nagsasabing lumapit sa Diyos. Maaaring ipinahihiwatig nito ang paghingi ng patnubay sa pamamagitan ng pari, ngunit hindi ginamit ang tiyak na pandiwa para sa pagtatanong o pagsangguni; kaya pinananatili ang teolohikal at ritwal na di-tiyak na pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “pari” para sa כֹּהֵן, “mga Filisteo” bilang karaniwang anyo ng pangalan, at maiikling pangungusap upang luminaw ang magkakasunod na tugon. Walang talababa dahil walang alternatibong kailangang ilathala para maunawaan ang talata.
