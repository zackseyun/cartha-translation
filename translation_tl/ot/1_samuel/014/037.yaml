  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בֵּֽ/אלֹהִ֔ים הַֽ/אֵרֵד֙ אַחֲרֵ֣י פְלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יַ֣ד יִשְׂרָאֵ֑ל וְ/לֹ֥א עָנָ֖/הוּ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/037.yaml
  text: Then Saul inquired of God[a], “Should I go down after the Philistines? Will you give them into the hand of Israel?” But he did not answer him that day.
translation:
  language: tl
  text: 'Pagkatapos, sumangguni si Saul sa Diyos: “Bababa ba ako upang habulin ang mga Filisteo? Ibibigay mo ba sila sa kamay ng Israel[a]?” Ngunit hindi siya sinagot nang araw na iyon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ipapasakamay mo ba sila sa Israel?”
    reason: Ipinapakita ang natural na Filipino na katumbas ng idyomang Hebreo na literal na ‘ibigay sa kamay.’
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: sumangguni ... sa Diyos
  rationale: Ang שׁאל na may בֵּאלֹהִים ay tumutukoy sa pormal na paghingi ng patnubay o pasiya mula sa Diyos, hindi sa karaniwang pagtatanong lamang.
- source_word: הַאֵרֵד
  choice: Bababa ba ako
  rationale: Pinananatili nito ang kahulugan ng ירד na ‘bumaba’ at ang anyong tanong na humihingi ng patnubay.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: upang habulin ang mga Filisteo
  rationale: Sa kontekstong militar, ang אַחֲרֵי ay nagpapahiwatig ng paghabol; malinaw at natural ito sa modernong Filipino.
- source_word: הֲתִתְּנֵם בְּיַד יִשְׂרָאֵל
  choice: Ibibigay mo ba sila sa kamay ng Israel
  rationale: Pinananatili ang karaniwang idyomang Hebreo ng pagbibigay ng kaaway sa ‘kamay’ o kapangyarihan ng isang bayan.
- source_word: וְלֹא עָנָהוּ
  choice: Ngunit hindi siya sinagot
  rationale: Ipinahihiwatig ng konteksto na Diyos ang hindi sumagot, ngunit hindi tahasang inuulit ng Hebreo ang simuno; pinananatili ng pasibong Filipino ang pagkaimplisito nito.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Natural na salin sa Filipino ng tiyak na panahong tinutukoy.
theological_decisions:
- issue: Ang hindi tahasang binanggit na simuno ng ‘hindi sumagot’
  choice: 'Hindi tahasang pinangalanan ang Diyos sa huling sugnay: ‘hindi siya sinagot.’'
  alternative: ‘Ngunit hindi siya sinagot ng Diyos nang araw na iyon.’
  rationale: Malinaw sa konteksto na Diyos ang tinutukoy, ngunit ang tekstong Hebreo ay gumagamit ng implisitong simuno. Iniiwasan ng salin na gawing higit na tahasan kaysa sa pinagmulan.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal na larawang ‘sa kamay ng Israel,’ habang inilagay sa talababa ang mas idyomatikong alternatibo.
