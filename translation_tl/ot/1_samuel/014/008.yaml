base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/008.yaml
  text: Jonathan said[a], “Look, we are crossing over to the men, and we will show ourselves to them.”
translation:
  language: tl
  text: Sinabi ni Jonatan, “Tingnan mo, tatawid tayo papunta sa mga lalaking iyon at magpapakita tayo sa kanila.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang panimulang pandiwa sa salaysay para sa tuwirang sinabi; natural at tumpak sa Filipino.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Panawag-pansin ito sa planong kasunod; ang isahang anyo ay angkop dahil kausap ni Jonatan ang tagapagdala niya ng sandata.
- source_word: אֲנַחְנוּ
  choice: tayo
  rationale: Kasama ang kausap sa kilos, kaya inclusive na unang panauhang maramihan ang kailangan sa Filipino.
- source_word: עֹבְרִים
  choice: tatawid tayo
  rationale: Ang participle ay tumutukoy sa nalalapit at sinasadyang pagkilos; mas natural sa Filipino ang anyong panghinaharap kaysa progresibong 'tumatawid tayo' sa kontekstong ito.
- source_word: אֶל הָאֲנָשִׁים
  choice: papunta sa mga lalaking iyon
  rationale: Tumutukoy sa mga tauhan ng himpilan ng mga Filisteo na nakikita o natukoy na sa konteksto; pinananatili ng 'mga lalaki' ang kasarian at ng 'iyon' ang tiyak na pagtukoy.
- source_word: וְנִגְלִינוּ
  choice: at magpapakita tayo
  rationale: Ang nifal ng גלה rito ay kusang pagpapakita o pagpapakitang makita ng kalaban; idiomatiko at malinaw ang 'magpapakita tayo'.
- source_word: אֲלֵיהֶם
  choice: sa kanila
  rationale: Tinutukoy ang mga lalaking Filisteo bilang makakakita sa kanila.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “tayo,” hindi “kami,” dahil kasama sa plano ang kausap ni Jonatan. Walang talababa dahil walang mahalagang ambiguwidad na nangangailangang ilahad sa talatang ito; ang marker sa English consultation layer ay hindi tumutugma nang malinaw sa ibinigay na footnote at hindi inangkat.
