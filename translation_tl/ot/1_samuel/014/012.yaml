base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/012.yaml
  text: And the men of the garrison answered Jonathan and his armor-bearer and said[a], “Come up to us, and we will tell you something.” Then Jonathan said to his armor-bearer, “Come up after me[d][c][b], for Yahweh has given them into the hand of Israel.”
translation:
  language: tl
  text: 'Sumagot kay Jonatan at sa tagapagdala niya ng mga sandata ang mga lalaki sa himpilan: “Umakyat kayo rito sa amin, at may ipaaalam kami sa inyo.” Sinabi naman ni Jonatan sa tagapagdala niya ng mga sandata, “Umakyat kang kasunod ko, sapagkat ibinigay na sila ni Yahweh sa kapangyarihan ng Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי הַמַּצָּבָה
  choice: mga lalaki sa himpilan
  rationale: Sa kontekstong militar, ang מַצָּבָה ay isang nakatalagang puwesto o himpilan. Ang “himpilan” ay likas sa Filipino at hindi ito napagkakamalang haliging pang-alaala.
- source_word: נֹשֵׂא כֵלָיו
  choice: tagapagdala niya ng mga sandata
  rationale: Literal itong tumutukoy sa taong nagdadala ng kaniyang kagamitang pandigma o mga sandata. Mas malinaw ito sa karaniwang mambabasa kaysa sa teknikal na “tagapagdala ng baluti.”
- source_word: עֲלוּ אֵלֵינוּ
  choice: Umakyat kayo rito sa amin
  rationale: Pinananatili ng “umakyat” ang pataas na pagkilos patungo sa mataas na puwesto ng mga Filisteo, at ipinahihiwatig ng “rito sa amin” ang pananaw ng mga nagsasalita.
- source_word: וְנוֹדִיעָה אֶתְכֶם דָּבָר
  choice: at may ipaaalam kami sa inyo
  rationale: Ang hiphil ng ידע ay “ipaalam,” samantalang pinananatili ng di-tiyak na pahayag ang malabong דָּבָר nang hindi ipinapaliwanag kung ano iyon.
- source_word: עֲלֵה אַחֲרַי
  choice: Umakyat kang kasunod ko
  rationale: Isahan ang pautos at kapuwa naipapahayag ang pag-akyat at pagsunod kay Jonatan.
- source_word: כִּי נְתָנָם יְהוָה
  choice: sapagkat ibinigay na sila ni Yahweh
  rationale: Direktang pinananatili ang perpektong anyo at ang katiyakan ni Jonatan na naibigay na ng Diyos ang mga kaaway.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: בְּיַד יִשְׂרָאֵל
  choice: sa kapangyarihan ng Israel
  rationale: Ang literal na “sa kamay ng Israel” ay idyomang Hebreo para sa pagpapasailalim sa kapangyarihan ng Israel; malinaw at natural ang kahulugang salin sa Filipino.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Katiyakan ng pahayag na נְתָנָם
  choice: ibinigay na sila
  alternative: ibibigay sila / ipinagkaloob sila
  rationale: Pinananatili ang perpektong pandiwa bilang pahayag ng natiyak nang tagumpay mula sa pananaw ni Jonatan, nang hindi binabago ito tungo sa tahasang panghinaharap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapagdala niya ng mga sandata” para sa madaling pag-unawa at “himpilan” para sa puwestong militar. Isinalin ayon sa kahulugan ang idyomang “sa kamay ng Israel” upang maging natural sa Filipino.
