base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/017.yaml
  text: Then Saul said to the people who were with him[a], “Please take a count and see who has gone from among us.” So they took a count, and behold, Jonathan and his armor-bearer were not there.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Saul sa mga taong kasama niya, “Pakibilang ninyo[a] at tingnan kung sino ang umalis mula sa ating hanay.” Kaya binilang nila ang mga naroon, at nakita nilang wala roon si Jonatan at ang tagapagdala ng sandata ni Jonatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “suriin ninyo ang bilang” o “tingnan ninyo kung sinu-sino ang naroon.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagrerepaso o pagbilang sa mga taong naroon.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקְדוּ / וַיִּפְקְדוּ
  choice: Pakibilang ninyo / binilang nila ang mga naroon
  rationale: Sa kontekstong ito, ang פקד ay tumutukoy sa pagsusuri o pagbilang sa mga taong naroon upang malaman kung sino ang nawawala. Ang “bilangin” ay malinaw at natural sa modernong Tagalog; idinagdag ang “ang mga naroon” sa ikalawang banggit upang maging likas ang pangungusap nang hindi binabago ang diwa.
- source_word: נָא
  choice: Paki-
  rationale: Pinapalambot ng נָא ang pautos. Ang unlaping “paki-” ang natural na paraan sa Tagalog upang maipahayag ang magalang o pakiusap na himig.
- source_word: וּרְאוּ
  choice: at tingnan
  rationale: Pinananatili nito ang payak na pagkakasunod ng dalawang utos. Sa konteksto, ang “tingnan” ay nangangahulugang alamin o tiyakin.
- source_word: מִי הָלַךְ מֵעִמָּנוּ
  choice: kung sino ang umalis sa atin
  rationale: Ipinahihiwatig ng parirala ang pag-alis mula sa pangkat. Likas sa Tagalog ang “umalis sa atin” at hindi nito dinaragdagan ang sanhi o layunin ng pag-alis.
- source_word: וְהִנֵּה אֵין
  choice: at nakita nilang wala roon
  rationale: Ang וְהִנֵּה ay naghahayag ng kapansin-pansing natuklasan. Sa halip na gamitin ang di-likas na literal na “narito,” ipinahahayag ng “nakita nilang” ang puwersa ng biglang pagkakatuklas, habang malinaw na inilalarawan ng “wala roon” ang kawalan.
- source_word: נֹשֵׂא כֵלָיו
  choice: ang tagapagdala ng kanyang mga sandata
  rationale: Literal itong tumutukoy sa taong nagdadala ng mga kagamitang pandigma ni Jonatan. Mas madaling maunawaan ng karaniwang mambabasa ang pariralang ito kaysa sa hiram o teknikal na katawagang “armor-bearer.”
