base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/005.yaml
  text: One crag stood on the north[a], opposite Michmash, and the other on the south[b], opposite Geba.
translation:
  language: tl
  text: Ang isang matulis na batong nakausli[a] ay nasa gawing hilaga, katapat ng Micmas, at ang isa naman ay nasa gawing timog, katapat ng Geba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ngipin,” isang talinghaga para sa isang matulis at nakausling pormasyon ng bato.
    reason: lexical_alternative
  - marker: b
    text: “Geba” ang pangalan ng lugar sa tekstong Hebreo; “Gibeah” ang mababasa sa ilang salin.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֵּׁן
  choice: matulis na batuhan
  rationale: Literal na “ngipin,” ngunit ginagamit dito bilang talinghaga para sa matulis at nakausling pormasyon ng bato. Likas sa modernong Tagalog ang “matulis na batuhan” at naipapahiwatig nito ang anyo at heograpikong diwa.
- source_word: הָאֶחָד ... וְהָאֶחָד
  choice: ang isang ... at ang isa naman
  rationale: Ipinapakita ng paulit-ulit na distributibong anyo ang paghahambing sa dalawang pormasyon ng bato; natural itong sabihin sa Tagalog bilang “ang isang ... at ang isa naman.”
- source_word: מָצוּק
  choice: ay nasa
  rationale: Sa konteksto, inilalarawan nito ang kinalalagyan ng matarik o nakausling pormasyon. Ang “ay nasa” ay natural na paglalahad ng posisyon nang hindi nagdaragdag ng hindi tiyak na detalye.
- source_word: מִצָּפוֹן
  choice: sa gawing hilaga
  rationale: Tumutukoy sa kinalalagyan sa hilagang panig ng daanan; malinaw at karaniwang heograpikong pananalita ang “sa gawing hilaga.”
- source_word: מוּל
  choice: sa tapat ng
  rationale: Ipinahihiwatig ang posisyong nakaharap o katapat ng isang lugar; eksakto at natural ang “sa tapat ng.”
- source_word: מִכְמָשׂ
  choice: Micmas
  rationale: Karaniwang anyong Tagalog ng pangalang-heograpiko na Michmash.
- source_word: מִנֶּגֶב
  choice: sa gawing timog
  rationale: Kabaligtaran ng hilagang panig sa magkatulad na estruktura ng talata; natural ang “sa gawing timog.”
- source_word: גָּבַע
  choice: Geba
  rationale: Ang Hebreong anyo ay tumutukoy sa Geba, hindi sa Gibeah; pinananatili ang mahalagang pagkakaibang heograpiko.
