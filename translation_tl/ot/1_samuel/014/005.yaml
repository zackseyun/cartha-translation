translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “matulis na batuhan” upang mapanatili ang topograpikong kahulugan at bahagi ng larawang ipinahihiwatig ng literal na “ngipin.”
