  text: וְ/הָ/עִבְרִ֗ים הָי֤וּ לַ/פְּלִשְׁתִּים֙ כְּ/אֶתְמ֣וֹל שִׁלְשׁ֔וֹם אֲשֶׁ֨ר עָל֥וּ עִמָּ֛/ם בַּֽ/מַּחֲנֶ֖ה סָבִ֑יב וְ/גַם הֵ֗מָּה לִֽ/הְיוֹת֙ עִם יִשְׂרָאֵ֔ל אֲשֶׁ֥ר עִם שָׁא֖וּל וְ/יוֹנָתָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/021.yaml
  text: The Hebrews who had previously been with the Philistines[a], who had gone up with them into the camp all around—even they also came to be with Israel[c][b], who were with Saul and Jonathan.
translation:
  language: tl
  text: Ang mga Hebreo na dati nang nasa panig ng mga Filisteo[a]—yaong mga sumama sa kanila sa kampo sa palibot[c]—ay sumama rin sa Israel[b] na kasama nina Saul at Jonatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “gaya ng kahapon at noong isang araw,” isang idyomang nangangahulugang “noong una” o “dati.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “maging kasama ng Israel.” Ipinahihiwatig ng konteksto na lumipat sila ng panig; maaari ring isalin, “ay napabilang din sa Israel.”
    reason: alternative_reading
  - marker: c
    text: Mahirap ang pariralang Hebreo na isinaling “sa kampo sa palibot.” Malamang na tumutukoy ito sa mga Hebreong sumama sa mga Filisteo sa kampo nilang nasa nakapalibot na lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעִבְרִים
  choice: Ang mga Hebreo
  rationale: Pinanatili ang tiyak na katawagang “mga Hebreo” sa halip na gawing “mga Israelita,” sapagkat עִבְרִים ang ginamit at maaaring nagpapakita ng panlabas o panlipunang paglalarawan sa pangkat.
- source_word: הָיוּ לַפְּלִשְׁתִּים
  choice: nasa panig ng mga Filisteo
  rationale: Ang literal na diwa ay “nasa/para sa mga Filisteo.” Ipinahahayag ng “nasa panig” ang pakikisama o pagkakampi nang hindi ipinahihiwatig na pag-aari sila ng mga Filisteo.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: dati nang
  rationale: Ang literal na idyomang “gaya ng kahapon, tatlong araw na ang nakaraan” ay tumutukoy sa dating kalagayan; natural itong ipinahahayag sa modernong Tagalog bilang “dati nang.”
- source_word: אֲשֶׁר עָלוּ עִמָּם
  choice: yaong mga sumama sa kanila
  rationale: Ang עלה ay literal na “umakyat,” ngunit dito ang mahalagang diwa ay ang pagsama nila sa mga Filisteo patungo sa kampo. Hindi tiyak o likas sa Tagalog ang direksiyong “umakyat” sa pangungusap na ito.
- source_word: בַּמַּחֲנֶה סָבִיב
  choice: sa kampo sa palibot
  rationale: Pinananatili nito ang mahirap at bahagyang malabong ugnayang pangkalawakan ng parirala nang hindi labis na nililinaw kung ang kampo mismo ang nakapalibot o nasa nakapalibot na lugar.
- source_word: וְגַם הֵמָּה
  choice: ay … rin
  rationale: 'Ang “rin” ay natural na naghahatid ng emphatic inclusion: maging ang mga Hebreong ito ay napabilang sa Israel.'
- source_word: לִהְיוֹת עִם יִשְׂרָאֵל
  choice: sumama rin sa Israel
  rationale: Literal itong “upang/maging kasama ng Israel.” Ang “sumama” ay likas na Tagalog at nagpapahiwatig ng pagbabagong panig na hinihingi ng konteksto, habang inilalahad sa talababa ang mas literal na anyo.
- source_word: אֲשֶׁר עִם שָׁאוּל וְיוֹנָתָן
  choice: na kasama nina Saul at Jonatan
  rationale: Pinanatili ang kolektibong “Israel” bilang tinutukoy ng sugnay at ginamit ang “nina” para sa likas na pagtukoy sa dalawang taong kasama nila.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nasa panig” at “sumama” upang malinaw ang galaw ng salaysay, ngunit pinanatili sa mga talababa ang literal na idyoma at ang sintaktikong kalabuan ng teksto. Hindi nagdagdag ng panandang diskurso na katumbas ng English “Now,” sapagkat walang tahasang salitang temporal na ganoon sa Hebreo.
