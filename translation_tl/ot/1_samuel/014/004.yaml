base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/004.yaml
  text: Between the passes by which Jonathan sought to cross over to the Philistine garrison[a], there was a crag of rock on one side and a crag of rock on the other side; and the name of the one was Bozez, and the name of the other Seneh.
translation:
  language: tl
  text: Sa pagitan ng mga lagusang sinikap tawirin ni Jonatan upang makarating sa himpilan ng mga Filisteo, may isang matulis na batong nakausli sa isang panig at isa pang matulis na batong nakausli[a] sa kabilang panig. Bozez ang pangalan ng isa, at Sene ang pangalan ng kabila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ngipin ng bato … ngipin ng bato,” isang paglalarawan sa matutulis at nakausling batuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבְּרוֹת
  choice: mga lagusan
  rationale: Tumutukoy ito sa mga lugar na maaaring daanan o tawiran. Sa mabatong kapaligiran, malinaw na ipinahihiwatig ng “mga lagusan” ang makikitid na daan sa pagitan ng mga batuhan nang hindi ipinapalagay na tawiran ito sa tubig.
- source_word: בִּקֵּשׁ ... לַעֲבֹר
  choice: balak tawirin
  rationale: Ipinahahayag ng בִּקֵּשׁ na may layunin o hangarin si Jonatan. Natural sa modernong Tagalog ang “balak tawirin” at hindi nito ipinapalagay na nagsimula na ang pagtatangka.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: himpilan ng mga Filisteo
  rationale: Sa kontekstong militar, ang מַצָּב ay isang nakatalagang puwersa o puwestong militar. Sapat na malawak at natural ang “himpilan” upang tukuyin ang puwesto at mga kawal doon.
- source_word: שֵׁן הַסֶּלַע
  choice: matulis na nakausling bato
  rationale: Literal itong “ngipin ng bato,” isang larawang tumutukoy sa matalim at nakausling batuhan. Inililipat ng salin ang heograpikong diwa sa malinaw na Tagalog habang inilalagay sa talababa ang literal na larawan.
- source_word: מֵהָעֵבֶר מִזֶּה ... מֵהָעֵבֶר מִזֶּה
  choice: sa isang panig ... sa kabilang panig
  rationale: Malinaw at natural nitong inilalarawan ang dalawang magkaharap na panig ng lagusan.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הָאֶחָד
  choice: ang pangalan ng isa ... ang isa
  rationale: Pinananatili nito ang pormal na pagpapangalan sa Hebreo ngunit iniiwasan ang di-natural na ganap na pag-uulit sa Tagalog.
- source_word: בּוֹצֵץ
  choice: Bozez
  rationale: Pangngalang pantangi na isinalin sa pamamagitan ng transliterasyon.
- source_word: סֶנֶּה
  choice: Sene
  rationale: Pangngalang pantangi na isinalin sa pamamagitan ng transliterasyon.
- source_word: וּבֵין
  choice: Sa pagitan
  rationale: Ang waw ay nag-uugnay sa naunang salaysay, ngunit hindi kailangang tumbasan ng tahasang “at” sa simula upang maging natural ang daloy sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga lagusan” para sa mabatong mga daanan at “himpilan” para sa puwestong militar. Inilipat ang talababa sa pariralang talagang ipinapaliwanag nito, at hindi sa “himpilan ng mga Filisteo.”
