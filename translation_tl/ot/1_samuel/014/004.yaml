  terminology: Ang “mga lagusan,” “himpilan,” at “mga Filisteo” ay angkop sa makabago ngunit marangal na Filipino. Ang “matulis na batong nakausli” ay natural na katumbas ng larawan ng Hebreong “ngipin ng bato”; pinananatili ng talababa ang literal na idyoma.
