  - severity: low
    issue: Hindi tahasang inuulit sa ikalawang pangalan na ito ay pangalan ng kabilang batong nakausli.
    rationale: Nauunawaan ang ellipsis sa kasalukuyang salin, ngunit ang “Sene ang pangalan ng kabila” ay mas malinaw at mas malapit sa inuulit na estruktura ng Hebreo.
