  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/שֵׁם֙ אֵ֣שֶׁת שָׁא֔וּל אֲחִינֹ֖עַם בַּת אֲחִימָ֑עַץ וְ/שֵׁ֤ם שַׂר צְבָא/וֹ֙ אֲבִינֵ֔ר בֶּן נֵ֖ר דּ֥וֹד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/050.yaml
  text: The name of Saul’s wife was Ahinoam daughter of Ahimaaz[a], and the name of the commander of his army was Abner son of Ner, Saul’s uncle.
translation:
  language: tl
  text: Ang pangalan ng asawa ni Saul ay Ahinoam na anak na babae ni Ahimaaz, at ang pangalan ng pinuno ng kanyang hukbo ay Abner na anak ni Ner, na tiyuhin[a] ni Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lalaking kamag-anak”; maaaring tumukoy ang salitang Hebreo sa isang malapit na lalaking kamag-anak sa mas malawak na diwa, bagaman “tiyuhin” ang pinakamalamang ayon sa konteksto ng talaangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: Ang pangalan ... ay
  rationale: Ang nominal na pariralang Hebreo na may panimulang waw ay naghaharap ng impormasyong nagpapakilala. Likas at malinaw sa modernong Tagalog ang “Ang pangalan ... ay,” habang napapanatili ang pormulang anyo.
- source_word: אֵשֶׁת
  choice: asawa
  rationale: Sa construct na kaugnay ni Saul, malinaw na tumutukoy ito sa relasyong mag-asawa, kaya “asawa” ang natural at tiyak na salin.
- source_word: בַּת
  choice: anak na babae ni
  rationale: Karaniwang pormulang genealogical ito; pinananatili ng “anak na babae ni” ang tahasang pagtukoy sa kasarian sa tekstong Hebreo.
- source_word: שַׂר צְבָאוֹ
  choice: pinuno ng kanyang hukbo
  rationale: Sa kontekstong militar, ang pinagsamang parirala ay tumutukoy sa opisyal na namumuno sa hukbo. Ang “pinuno ng kanyang hukbo” ay malinaw, dignipikado, at pangkaraniwan sa modernong Tagalog.
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang natural na Tagalog para sa karaniwang patronymic na pormula; hindi kailangang idagdag ang “lalaki” dahil malinaw ang tinutukoy na si Abner.
- source_word: דּוֹד
  choice: tiyuhin
  rationale: Sa genealogical na konteksto, malamang na tumutukoy ang salita sa tiyuhin. Gayunman, maaaring mas malawak ang saklaw nito bilang isang malapit na lalaking kamag-anak, kaya nilagyan ng talababa.
theological_decisions:
- issue: Kahulugan ng דּוֹד sa talaangkanan ni Saul
  choice: tiyuhin ni Saul
  alternative: lalaking kamag-anak ni Saul
  rationale: Hindi ito pangunahing usaping doktrinal, ngunit tunay itong usaping interpretatibo. Sa kontekstong genealogical, “tiyuhin” ang pinakamalamang na kahulugan, bagaman maaari ring mas malawak ang kinship sense ng salitang Hebreo; pinanatili sa talababa ang leksikal na posibilidad na iyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignipikado. Ginamit ang karaniwang ayos na “Ang pangalan ... ay” at ang natural na genealogical na mga pariralang “anak na babae ni” at “anak ni.” Inilagay ang panandang [a] kaagad pagkatapos ng “tiyuhin,” ang mismong salitang tinatalakay ng talababa.
