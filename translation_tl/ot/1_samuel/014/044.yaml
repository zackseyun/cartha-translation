  text: And Saul said[a], “May God do so and more also, for you shall surely die, Jonathan.”
translation:
  language: tl
  text: Sinabi ni Saul[a], “Gawin nawa ng Diyos ang gayon at higit pa, sapagkat tiyak na mamamatay ka, Jonatan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pormula ito ng panunumpa sa Hebreo; literal, “Gawin nawa ng Diyos ang gayon at higit pa.” Hindi tahasang sinasabi sa Hebreo kung kanino o ano ang gagawin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang pasalaysay na anyo ito sa Hebreo. Natural sa modernong Tagalog ang “Sinabi” at hindi nito labis na binibigyang-diin kung simpleng pagpapatuloy o mahigpit na pagkakasunod ang ugnayan.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Ginamit ang karaniwang anyo ng pangalang pantangi sa Tagalog.
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים וְכֹה יוֹסִף
  choice: Gawin nawa ng Diyos ang gayon at dagdagan pa niya
  rationale: Pinananatili nito ang pormula ng sumpa at ang hindi tahasang binanggit na tatanggap o layon ng ipinapanalang kaparusahan. Mas malapit ito sa anyo ng Hebreo kaysa sa pagdaragdag ng “sa akin.”
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang tinutukoy ay ang Diyos na tinatawagan sa panunumpa; ang pang-isahang “Diyos” ang natural na salin.
- source_word: כִּי
  choice: sapagkat
  rationale: Ikinakabit nito ang pormula ng sumpa sa mariing hatol ni Saul. Maaari rin itong maunawaan bilang tagapagpakilala ng nilalaman ng panunumpa, ngunit natural na naihahatid ng “sapagkat” ang ugnayan dito.
- source_word: מוֹת תָּמוּת
  choice: tiyak na mamamatay ka
  rationale: Ang infinitive absolute na kasunod ng pandiwang may parehong ugat ay nagpapahayag ng matinding katiyakan. Natural at mariin sa Tagalog ang “tiyak na mamamatay ka.”
- source_word: יוֹנָתָן
  choice: Jonatan
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Jonathan.
theological_decisions:
- issue: Hindi tahasang layon ng sumpa sa pormulang Hebreo
  choice: Gawin nawa ng Diyos ang gayon at dagdagan pa niya
  alternative: Gawin nawa ito sa akin ng Diyos, at higit pa
  rationale: Hindi binabanggit sa Hebreo ang “sa akin.” Pinananatili ng napiling salin ang puwang na iyon at iniiwasang gawing tahasang pahayag ang ipinahihiwatig lamang ng nakaugaliang pormula.
- issue: Tindi ng hatol na kamatayan
  choice: tiyak na mamamatay ka
  alternative: mamamatay ka
  rationale: Kailangang katawanin ang mariing konstruksyong מוֹת תָּמוּת, kaya hindi sapat ang payak na “mamamatay ka.”
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang bahagyang di-karaniwang tunog ng pormula ng panunumpa upang huwag idagdag ang hindi tahasang “sa akin” ng Hebreo.
