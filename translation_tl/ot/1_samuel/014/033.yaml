revisions:
- from: Pagkatapos, iniulat nila kay Saul, “Tingnan mo, nagkakasala ang bayan kay Yahweh dahil kumakain sila ng karneng may dugo pa[a].” Sinabi niya, “Nagtaksil kayo. Igulong ninyo ngayon papunta sa akin ang isang malaking bato.”
  to: Pagkatapos, iniulat nila kay Saul, “Tingnan mo, nagkakasala ang bayan laban kay Yahweh dahil kumakain sila ng karneng may dugo pa[a].” Sinabi niya, “Nagtaksil kayo. Igulong ninyo rito sa akin ngayong araw ang isang malaking bato.”
  rationale: 'Pinino ang mga katumbas na Tagalog upang maging mas malinaw at likas nang hindi binabago ang kahulugan: “laban kay Yahweh” para sa pagkakasala laban sa Diyos, “ngayong araw” para sa temporal na הַיּוֹם, at “rito sa akin” para sa direksiyong אֵלַי. Napanatili ang kontekstuwal na pagpapaliwanag sa idyoma tungkol sa dugo, kasama ang literal na anyo nito sa talababa.'
