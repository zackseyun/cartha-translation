source:
  edition: WLC
  text: וַ/יַּגִּ֤ידוּ לְ/שָׁאוּל֙ לֵ/אמֹ֔ר הִנֵּ֥ה הָ/עָ֛ם חֹטִ֥אים לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל עַל הַ/דָּ֑ם וַ/יֹּ֣אמֶר בְּגַדְתֶּ֔ם גֹּֽלּוּ אֵלַ֥/י הַ/יּ֖וֹם אֶ֥בֶן גְּדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/033.yaml
  text: Then they told Saul[a], saying, “Look, the people are sinning against Yahweh by eating over the blood.” And he said, “You have acted treacherously. Roll a large stone to me today.”
translation:
  language: tl
  text: Pagkatapos, iniulat nila kay Saul, “Tingnan mo, nagkakasala ang bayan laban kay Yahweh dahil kumakain sila ng karneng may dugo pa[a].” Sinabi niya, “Nagtaksil kayo. Igulong ninyo rito sa akin ngayong araw ang isang malaking bato.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kumakain sa ibabaw ng dugo” o “kasama ng dugo.” Tumutukoy ito sa pagkain ng karneng hindi pa wastong napatulo o naalisan ng dugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ לְשָׁאוּל לֵאמֹר
  choice: Pagkatapos, iniulat nila kay Saul
  rationale: Ipinahihiwatig ng wayyiqtol ang kasunod na pangyayari sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos, iniulat nila,” at hindi na kailangang isalin nang hiwalay ang karaniwang Hebreong pambungad sa tuwirang sipi na לֵאמֹר.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pinupukaw ng katagang ito ang pansin ni Saul sa agarang kalagayan; pinananatili ng “Tingnan mo” ang diin nang hindi gumagamit ng makalumang pananalita.
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang tiyak at kolektibong pangngalan ay tumutukoy sa mga tauhan o hukbo ni Saul. Ang “bayan” ay marangal at karaniwang salin sa ganitong konteksto.
- source_word: חֹטִאים לַיהוָה
  choice: nagkakasala ang bayan kay Yahweh
  rationale: Ang חטא na may ל ay nagpapahayag ng pagkakasalang nakatuon laban sa isang persona. Likas sa Tagalog ang “nagkakasala kay Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton.
- source_word: לֶאֱכֹל עַל־הַדָּם
  choice: dahil kumakain sila ng karneng may dugo pa[a]
  rationale: Ang literal na larawan ay “kumain sa ibabaw/kasama ng dugo,” ngunit sa konteksto ay tumutukoy ito sa pagkain ng karneng hindi pa wastong naaalisan ng dugo. Nililinaw ng pangunahing teksto ang diwa, habang itinatala sa talababa ang literal na anyo at saklaw ng idyoma.
- source_word: בְּגַדְתֶּם
  choice: Nagtaksil kayo
  rationale: Malakas na salita ang בגד para sa pagtataksil o kawalan ng katapatan. Pinananatili ng “Nagtaksil kayo” ang bigat ng paratang.
- source_word: גֹּלּוּ אֵלַי הַיּוֹם אֶבֶן גְּדוֹלָה
  choice: Igulong ninyo ngayon papunta sa akin ang isang malaking bato
  rationale: Ang pandiwa ay tahasang nangangahulugang “igulong,” at maramihan ang utos. Ang “ngayon” ay natural na katumbas ng הַיּוֹם sa agarang kontekstong ito.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa Hebreong teksto, kaya pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Uri ng pagkakasala sa pagkain ng dugo
  choice: karneng may dugo pa
  alternative: kumakain sa ibabaw/kasama ng dugo
  rationale: Ipinakikita ng agarang konteksto at ng pagbabawal sa pagkain ng dugo na ang tinutukoy ay karneng hindi pa wastong napatulo o naalisan ng dugo. Gayunman, hindi itinatago ang kakaibang literal na anyo ng Hebreo; nakatala ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at angkop sa salaysay. Ginamit ang “iniulat” para sa natural na daloy, “bayan” para sa kolektibong הָעָם, at tuwirang pangungusap para sa utos ni Saul. Inilagay ang panandang [a] sa mismong pariralang nililinaw ng talababa.
