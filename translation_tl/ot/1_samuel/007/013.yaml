id: 1SA.7.13
reference: 1 Samuel 7:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּכָּֽנְעוּ֙ הַ/פְּלִשְׁתִּ֔ים וְ/לֹא יָסְפ֣וּ ע֔וֹד לָ/ב֖וֹא בִּ/גְב֣וּל יִשְׂרָאֵ֑ל וַ/תְּהִ֤י יַד יְהוָה֙ בַּ/פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֥י שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/013.yaml
  text: So the Philistines were subdued and did not again come into the territory of Israel[a]. And the hand of Yahweh was against the Philistines all the days of Samuel.
translation:
  language: tl
  text: Kaya napasuko ang mga Filisteo at hindi na sila muling pumasok sa nasasakupan ng Israel. Ang kamay ni Yahweh ay laban sa mga Filisteo[a] sa buong panahon ni Samuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang kamay ni Yahweh ay nasa mga Filisteo.” Ang “kamay” ay idyoma para sa aktibong kapangyarihan ni Yahweh; sa kontekstong ito, kumikilos siya laban sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: napasuko
  rationale: Ipinahihiwatig ng Niphal ng כנע ang pagkalagay sa ilalim ng kapangyarihan matapos matalo. Natural sa kontekstong militar ang “napasuko” at pinananatili nito ang resultative/passive na diwa.
- source_word: הַפְּלִשְׁתִּים
  choice: ang mga Filisteo
  rationale: Ito ang karaniwang makabagong Tagalog na katawagan sa pangkat-etnikong Philistine.
- source_word: וְלֹא יָסְפוּ עוֹד לָבוֹא
  choice: hindi na sila muling pumasok
  rationale: Ang יסף + עוד ay idyomang nagsasaad na hindi na naulit ang kilos. Ang “pumasok” ay natural kasama ng kasunod na pook at malinaw na tumutukoy sa pagpasok sa lupain.
- source_word: בִּגְבוּל יִשְׂרָאֵל
  choice: sa nasasakupan ng Israel
  rationale: Maaaring tumukoy ang גְּבוּל sa hangganan o sa teritoryong saklaw nito. Sa konteksto, ang tinutukoy ay pagpasok sa lupain ng Israel, hindi lamang paglapit sa guhit ng hangganan.
- source_word: וַתְּהִי יַד יְהוָה
  choice: Ang kamay ni Yahweh ay
  rationale: Pinananatili ang Hebreong metapora ng “kamay” bilang larawan ng aktibong kapangyarihan at pagkilos ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa anyong “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: בַּפְּלִשְׁתִּים
  choice: laban sa mga Filisteo
  rationale: Sa konteksto ng pagkatalo at pagsupil, malinaw na salungat o mapanupil ang bisa ng kamay ni Yahweh; natural itong ipinahahayag ng “laban sa.”
- source_word: כֹּל יְמֵי שְׁמוּאֵל
  choice: sa buong panahon ni Samuel
  rationale: Natural na Tagalog ito para sa Hebreong temporal na pananalitang “lahat ng mga araw ni Samuel,” nang hindi tiyak na nililimitahan kung ang diin ay sa kanyang buhay o sa panahon ng kanyang pamumuno.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Bisa ng idyomang “ang kamay ni Yahweh ay nasa mga Filisteo”
  choice: Ang kamay ni Yahweh ay laban sa mga Filisteo
  alternative: Ang kamay ni Yahweh ay nasa/ibabaw ng mga Filisteo
  rationale: Pinananatili ng salin ang metapora ng kamay ngunit nililinaw ang salungat na bisa ng pang-ukol ayon sa kontekstong militar. Iniiwasan nitong magmukhang pagpapala o pagsang-ayon ang pagkilos ni Yahweh.
- issue: Saklaw ng “lahat ng mga araw ni Samuel”
  choice: sa buong panahon ni Samuel
  alternative: habang nabubuhay si Samuel
  rationale: Hindi tahasang sinasabi ng Hebreo kung ang tinutukoy ay buong buhay niya o ang panahong kinakatawan ng kanyang pamumuno. Pinananatili ng “buong panahon ni Samuel” ang lawak ng orihinal nang hindi nilulutas ang tanong.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “napasuko” at “nasasakupan” para sa natural na salaysay na militar-politikal, habang pinanatili ang biblikal na metapora ng “kamay ni Yahweh.”
