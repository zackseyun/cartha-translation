  text: וַ/יִּקָּבְצ֣וּ הַ֠/מִּצְפָּתָ/ה וַ/יִּֽשְׁאֲבוּ מַ֜יִם וַֽ/יִּשְׁפְּכ֣וּ לִ/פְנֵ֣י יְהוָ֗ה וַ/יָּצ֨וּמוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא וַ/יֹּ֣אמְרוּ שָׁ֔ם חָטָ֖אנוּ לַ/יהוָ֑ה וַ/יִּשְׁפֹּ֧ט שְׁמוּאֵ֛ל אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/מִּצְפָּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/006.yaml
  text: So they gathered at Mizpah[a], drew water, and poured it out before Yahweh. They fasted on that day and said there[c][b], “We have sinned against Yahweh.” And Samuel judged the sons of Israel at Mizpah.
translation:
  language: tl
  text: Kaya nagtipon sila sa Mizpa[a]. Sumalok sila ng tubig at ibinuhos iyon sa harap ni Yahweh.[b] Nag-ayuno sila noong araw na iyon at sinabi roon, “Nagkasala kami laban kay Yahweh.” At humatol si Samuel sa mga Israelita[c] sa Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patungo sa Mizpa.” May hulaping nagsasaad ng direksiyon ang unang pagbanggit sa Mizpa sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang pagbubuhos ng tubig sa harap ni Yahweh ay isang ritwal na kilos na kaugnay ng pagsisisi o panaghoy, ngunit hindi tahasang ipinaliliwanag ng teksto ang simbolismo nito.
    reason: cultural_note
  - marker: c
    text: Sa literal, “mga anak na lalaki ni Israel,” isang katawagang tumutukoy dito sa bayang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: nagtipon sila
  rationale: Ang Niphal na pandiwa ay nagsasaad na sama-samang nagtipon ang mga tao; natural at tuwiran ito sa modernong Tagalog.
- source_word: הַמִּצְפָּתָה / בַּמִּצְפָּה
  choice: sa Mizpa
  rationale: May hulaping direksiyon ang unang anyo, ngunit natural sa Tagalog ang “nagtipon sa Mizpa”; ipinaliliwanag sa talababa ang literal na diwang “patungo sa Mizpa.”
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: sumalok sila ng tubig
  rationale: Karaniwang kahulugan ng שׁאב ang pagsalok o pag-igib ng tubig; “sumalok” ang malinaw at tuwirang paglalarawan sa kilos.
- source_word: וַיִּשְׁפְּכוּ לִפְנֵי יְהוָה
  choice: ibinuhos iyon sa harap ni Yahweh
  rationale: Tapat na pinananatili ang literal na pagbubuhos at ang pariralang “sa harap ni,” nang hindi ipinapaliwanag sa pangunahing teksto ang simbolismo ng ritwal.
- source_word: וַיָּצוּמוּ בַּיּוֹם הַהוּא
  choice: Nag-ayuno sila nang araw na iyon
  rationale: Natural na Tagalog para sa tahasang kilos ng pag-aayuno sa itinakdang araw.
- source_word: חָטָאנוּ לַיהוָה
  choice: Nagkasala kami laban kay Yahweh
  rationale: Ipinahahayag ng “laban kay” ang ugnayang dala ng ל at malinaw na ipinakikitang si Yahweh ang pinagkasalahan.
- source_word: וַיִּשְׁפֹּט
  choice: naging hukom
  rationale: Iniiwasan ng “naging hukom” ang maaaring makitid o mapanghatol na dating ng “hinatulan,” habang pinananatili ang papel na ipinahihiwatig ng שׁפט.
- source_word: אֶת־בְּנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Ang literal na “mga anak na lalaki ni Israel” ay kolektibong tumutukoy sa bayang Israel; “mga Israelita” ang natural at inklusibong katumbas sa modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng pagbubuhos ng tubig
  choice: Panatilihin sa pangunahing teksto ang mismong kilos nang hindi tiyak na binibigyang-kahulugan ang simbolismo nito.
  alternative: Tahasang tawagin itong tanda ng pagsisisi, panaghoy, o pagbubuhos ng sarili.
  rationale: Iniulat ng Hebreong teksto ang ritwal ngunit hindi nito ipinaliliwanag ang kahulugan; pinananatili ng salin ang tunay na kawalang-katiyakan.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Ginagamit ang transliterasyon ng personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng gawain ni Samuel bilang שׁפט
  choice: naging hukom
  alternative: hinatulan o pinamahalaan
  rationale: Maaaring saklawin ng pandiwa ang paghatol at pamumuno; ang “naging hukom” ay nagpapanatili sa lawak ng tungkulin nang hindi ito nililimitahan sa isang hatol sa hukuman.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang maiikling pangungusap para madaling maunawaan, habang pinananatili ang ritwal na kilos, pahayag ng pagkakasala, banal na pangalan, at lawak ng tungkulin ni Samuel.
