id: 1SA.7.5
reference: 1 Samuel 7:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל קִבְצ֥וּ אֶת כָּל יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑תָ/ה וְ/אֶתְפַּלֵּ֥ל בַּעַדְ/כֶ֖ם אֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/005.yaml
  text: Then Samuel said[a], “Gather all Israel to Mizpah, and I will pray to Yahweh on your behalf.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Samuel, “Tipunin ninyo ang buong Israel sa Mizpa, at mananalangin ako kay Yahweh[a] para sa inyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH (יהוה), ang personal na pangalan ng Diyos; karaniwan din itong isinasaling “ang PANGINOON.”'
    reason: Nililinaw ang pinagmulang anyo ng banal na pangalan at ang karaniwang alternatibong salin.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa makabagong Tagalog ang “Pagkatapos ay sinabi” at malinaw ang pagkakasunod-sunod.
- source_word: קִבְצוּ
  choice: Tipunin ninyo
  rationale: Pautos na maramihan ang pandiwa. Malinaw na ipinahihiwatig ng “ninyo” na maraming tao ang kinakausap.
- source_word: כָּל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Pinananatili nito ang kolektibong pambansang diwa ng parirala.
- source_word: הַמִּצְפָּתָה
  choice: sa Mizpa
  rationale: May hulaping patungo sa isang lugar ang anyong Hebreo. Sa Tagalog, likas na naipahihiwatig ng “tipunin ... sa Mizpa” ang pagpunta at pagtitipon doon.
- source_word: וְאֶתְפַּלֵּל
  choice: at mananalangin ako
  rationale: Ang unang panauhang imperfect kasunod ng pautos ay nagpapahayag ng balak na gagawin ni Samuel pagkatapos ng pagtitipon.
- source_word: בַּעַדְכֶם
  choice: para sa inyo
  rationale: Likas at malinaw sa karaniwang Tagalog, habang pinananatili ang diwa ng pananalangin alang-alang sa kanila.
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Ang “kay” ang likas na pantukoy sa personal na pinatutungkulan ng panalangin; tinutumbasan ng “Yahweh” ang tahasang banal na pangalan na יְהוָה.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tahasang ginagamit sa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang katangian nito bilang personal na pangalan nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Tipunin ninyo” upang maging tahasan ang maramihang pautos, at “Mizpa” bilang karaniwang anyong Tagalog ng pangalan ng lugar.
