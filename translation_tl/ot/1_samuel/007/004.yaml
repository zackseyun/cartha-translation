base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/004.yaml
  text: So the sons of Israel removed the Baals and the Ashtaroths[a], and they served Yahweh alone.
translation:
  language: tl
  text: Kaya inalis ng mga Israelita ang mga Baal at ang mga Astarot, at si Yahweh lamang ang kanilang pinaglingkuran[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “si Yahweh lamang ang kanilang sinamba.” Kapag Diyos ang layon, ang pandiwang Hebreo ay maaaring mangahulugan kapwa ng paglilingkod at pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: inalis
  rationale: Tuwirang ipinapahayag ng Hiphil ng סוּר ang aktuwal na pag-aalis o pagtatakwil sa mga diyus-diyosan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na 'mga anak na lalaki ng Israel,' ang parirala ay karaniwang katawagang etniko para sa sambayanan; 'mga Israelita' ang likas at tumpak na modernong Tagalog.
- source_word: הַבְּעָלִים
  choice: mga Baal
  rationale: Pinananatili ang maramihang anyo ng Hebreo, na maaaring tumukoy sa iba't ibang lokal na anyo o mga representasyon ni Baal nang hindi nagpapasiya sa pagitan ng mga iyon.
- source_word: הָעַשְׁתָּרֹת
  choice: mga Astarot
  rationale: Transliterasyon ito ng tiyak na pangalang kultiko sa anyong maramihan, sa halip na gawing pangkalahatang 'mga diyosa.'
- source_word: וַיַּעַבְדוּ
  choice: pinaglingkuran
  rationale: Pinananatili nito ang pangunahing diwa ng עבד na paglilingkod at ang mas malawak na katapatan sa tipan, habang maaari rin nitong saklawin ang pagsamba kapag Diyos ang layon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לְבַדּוֹ
  choice: lamang
  rationale: Malinaw at likas nitong ipinahahayag ang eksklusibong katapatan kay Yahweh.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng 'Yahweh' ang pagkakaibang ito mula sa isang titulo.
- issue: Kahulugan ng עבד kapag Diyos ang layon
  choice: pinaglingkuran
  alternative: sinamba
  rationale: Ang pandiwa ay maaaring tumukoy kapwa sa paglilingkod at pagsamba. Ang 'pinaglingkuran' ang mas tuwirang katumbas at pinananatili ang mas malawak na diwa ng tapat na pagpapasakop; itinatala sa talababa ang alternatibong kultikong diwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang likas na etnikong katawagang 'mga Israelita,' pinanatili ang maramihang mga pangalang kultiko, at iniwasang gawing labis na pormal ang ayos ng pangungusap.
