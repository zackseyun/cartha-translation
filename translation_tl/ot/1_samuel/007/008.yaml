  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל שְׁמוּאֵ֔ל אַל תַּחֲרֵ֣שׁ מִמֶּ֔/נּוּ מִ/זְּעֹ֖ק אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/008.yaml
  text: Then the sons of Israel said to Samuel[a], “Do not be silent for us from crying out to Yahweh our God, that he may save us from the hand of the Philistines.”
translation:
  language: tl
  text: Sinabi ng mga Israelita kay Samuel, “Huwag kang tumigil sa pagdaing kay Yahweh na ating Diyos para sa amin, upang iligtas niya kami mula sa kamay ng mga Filisteo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Likas at malinaw sa modernong Tagalog; tumutukoy ito sa sambayanan ng Israel, hindi lamang sa mga lalaking anak.
- source_word: אַל תַּחֲרֵשׁ מִמֶּנּוּ מִזְּעֹק
  choice: Huwag kang tumigil sa pagdaing ... para sa amin
  rationale: Ang literal na larawan ay huwag manahimik o magpigil sa pagdaing. Sa Tagalog, ang 'huwag kang tumigil sa pagdaing' ang malinaw at natural na naghahatid ng diwang ipagpatuloy ang taimtim na panawagan alang-alang sa kanila.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Pinananatili ang kolektibong pag-angkin ng Israel at natural itong kaugnay ng 'Yahweh' sa Tagalog.
- source_word: וְיֹשִׁעֵנוּ
  choice: upang iligtas niya kami
  rationale: Ipinahahayag ng anyo sa konteksto ang layunin o inaasahang bunga ng pagdaing ni Samuel.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: mula sa kamay ng mga Filisteo
  rationale: Pinananatili ang Hebreong larawan ng 'kamay' bilang kapangyarihan o kontrol habang nananatiling nauunawaan sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit mismo ng talata ang banal na pangalan; pinananatili ng 'Yahweh' ang pagkakaiba nito sa titulong 'Panginoon'.
- issue: Ugnayan ng panalangin ni Samuel at pagliligtas ng Diyos
  choice: upang iligtas niya kami
  alternative: at iligtas niya kami
  rationale: Pinananatili ang layunin o inaasahang bunga nang hindi ipinahihiwatig na ang panalangin ni Samuel mismo ang sanhi o garantiya ng pagliligtas.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'mga Israelita' sa halip na literal na 'mga anak ng Israel' para sa likas na pagpapahayag, at 'pagdaing' upang maipakita ang matinding panawagan para sa tulong.
