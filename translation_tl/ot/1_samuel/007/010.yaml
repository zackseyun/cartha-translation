  text: וַ/יְהִ֤י שְׁמוּאֵל֙ מַעֲלֶ֣ה הָ/עוֹלָ֔ה וּ/פְלִשְׁתִּ֣ים נִגְּשׁ֔וּ לַ/מִּלְחָמָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יַּרְעֵ֣ם יְהוָ֣ה בְּ/קוֹל גָּ֠דוֹל בַּ/יּ֨וֹם הַ/ה֤וּא עַל פְּלִשְׁתִּים֙ וַ/יְהֻמֵּ֔/ם וַ/יִּנָּגְפ֖וּ לִ/פְנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/010.yaml
  text: And as Samuel was offering up the burnt offering[a], the Philistines drew near for battle against Israel. But Yahweh thundered with a great sound on that day against the Philistines and threw them into confusion, and they were defeated before Israel.
translation:
  language: tl
  text: Habang inihahandog ni Samuel ang handog na sinusunog, lumapit ang mga Filisteo upang makipaglaban sa Israel. Ngunit noong araw na iyon, kumulog si Yahweh laban sa mga Filisteo nang may malakas na dagundong[a] at nilito sila, kaya natalo sila sa harap ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na may isang malakas na tunog.” Maaari ring isalin na “na may malakas na kulog” o “na may matinding ingay.”
    reason: Pinananatili ang saklaw ng Hebreong קוֹל, na maaaring mangahulugang tunog, tinig, o ingay; sa kontekstong ito, kaugnay ito ng pagkulog.
lexical_decisions:
- source_word: מַעֲלֶה
  choice: inihahandog
  rationale: Ang Hiphil participle ay tumutukoy sa nagpapatuloy na paghahandog ng hain; natural itong ipinapahayag sa Filipino bilang “inihahandog.”
- source_word: הָעוֹלָה
  choice: ang handog na sinusunog
  rationale: Ito ang karaniwang katawagan sa Filipino para sa עֹלָה, isang haing sinusunog sa altar.
- source_word: נִגְּשׁוּ לַמִּלְחָמָה בְּיִשְׂרָאֵל
  choice: lumapit ... upang makipaglaban sa Israel
  rationale: Pinananatili ng “lumapit” ang kilos ng paglapit, habang malinaw na ipinahahayag ng “upang makipaglaban” ang layuning militar at ang salungat na diwa ng בְּיִשְׂרָאֵל sa konteksto.
- source_word: וַיַּרְעֵם
  choice: kumulog
  rationale: Ang pandiwa ay tuwirang tumutukoy sa pagkulog; ang Diyos ang paksa ng kilos.
- source_word: בְּקוֹל גָּדוֹל
  choice: nang may napakalakas na dagundong
  rationale: Natural na inilalarawan ng “dagundong” ang malakas na tunog ng pagkulog, habang nililinaw sa talababa na mas malawak ang literal na kahulugan ng קוֹל.
- source_word: וַיְהֻמֵּם
  choice: nilito sila
  rationale: Ipinapahayag nito ang causative na diwa ng paglikha ng kalituhan o pagkakagulo sa hanay ng hukbo nang hindi inuunahan ang kasunod na pahayag ng pagkatalo.
- source_word: וַיִּנָּגְפוּ לִפְנֵי יִשְׂרָאֵל
  choice: natalo sila sa harap ng Israel
  rationale: Ang Niphal ng נָגַף sa kontekstong militar ay nagpapahayag ng pagkatalo; pinananatili ng “sa harap ng Israel” ang karaniwang idyoma ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang banal sa halip na palitan iyon ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa pagkilos ni Yahweh sa labanan
  choice: kumulog si Yahweh ... at nilito sila
  alternative: nagpaulan si Yahweh ng kulog ... at pinanlupaypay sila
  rationale: Tuwirang pinananatili ang Diyos bilang paksa ng dalawang pandiwa at ang pagkakaiba ng paglikha ng kalituhan at ng kasunod na pagkatalo, nang hindi dinaragdagan ang teksto ng tiyak na mekanismo o doktrinal na paliwanag.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng Hebreong teksto ang Tetragrammaton bilang personal na pangalan; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “mga Filisteo,” “handog na sinusunog,” at “dagundong” bilang malinaw at karaniwang mga katawagan. Inilipat ang talababa sa pariralang tinutukoy nito—ang malakas na tunog—sa halip na sa handog.
