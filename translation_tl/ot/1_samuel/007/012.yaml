  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶ֣בֶן אַחַ֗ת וַ/יָּ֤שֶׂם בֵּֽין הַ/מִּצְפָּה֙ וּ/בֵ֣ין הַ/שֵּׁ֔ן וַ/יִּקְרָ֥א אֶת שְׁמָ֖/הּ אֶ֣בֶן הָעָ֑זֶר וַ/יֹּאמַ֕ר עַד הֵ֖נָּה עֲזָרָ֥/נוּ יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/012.yaml
  text: Then Samuel took one stone and set it between Mizpah and Shen, and he called its name Ebenezer, for he said, “Up to this point the LORD has helped us.”
translation:
  language: tl
  text: Pagkatapos, kumuha si Samuel ng isang bato at inilagay iyon sa pagitan ng Mizpa at Shen. Tinawag niyang Ebenezer[a] ang bato, sapagkat sinabi niya, “Hanggang sa puntong ito ay tinulungan tayo ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Ebenezer” ay nangangahulugang “bato ng tulong.”
    reason: Mahalaga sa paliwanag ni Samuel ang kahulugan ng pangalang Hebreo, ngunit hindi ito likas na mauunawaan ng karaniwang mambabasang Tagalog.
lexical_decisions:
- source_word: אֶבֶן אַחַת
  choice: isang bato
  rationale: Tuwirang pinananatili ang bilang na אַחַת (‘isa’), na nagbibigay-diin sa isang tiyak na batong itinayo ni Samuel.
- source_word: וַיָּשֶׂם
  choice: inilagay
  rationale: Natural na salin ng karaniwang pandiwang Hebreo na nangangahulugang maglagay o magtakda; hindi ipinapalagay na tuwirang itinayo bilang haligi.
- source_word: אֶבֶן הָעָזֶר
  choice: Ebenezer
  rationale: Pinananatili bilang pangalan ng batong alaala, habang ipinaliliwanag sa talababa ang literal na kahulugan nito.
- source_word: עַד הֵנָּה
  choice: Hanggang sa puntong ito
  rationale: Sinasaklaw ang maaaring lokal at temporal na diwa ng parirala nang hindi ito nililimitahan sa ‘hanggang ngayon’ lamang.
- source_word: עֲזָרָנוּ
  choice: tinulungan tayo
  rationale: Tumpak at natural na katumbas ng pandiwang ‘tumulong’ na may unang panauhang maramihang layon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos bilang Yahweh sa halip na palitan ito ng titulong ‘PANGINOON.’
theological_decisions:
- issue: Saklaw ng pahayag na עַד הֵנָּה עֲזָרָנוּ יְהוָה
  choice: “Hanggang sa puntong ito ay tinulungan tayo ni Yahweh.”
  alternative: “Hanggang ngayon ay tinulungan tayo ni Yahweh.”
  rationale: Pinananatili ng ‘puntong ito’ ang tunay na kalabuan kung ang tinutukoy ay ang lugar na narating, ang panahong iyon, o kapwa, at hindi ginagawang pangako tungkol sa hinaharap ang pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iyon” upang malinaw na ang bato ang inilagay, at “ang bato” bilang likas na layon ng pagpapangalan sa Tagalog. Pinanatili ang mga pangalang Mizpa, Shen, Ebenezer, at Yahweh.
