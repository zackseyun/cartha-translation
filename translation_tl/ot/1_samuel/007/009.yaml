source:
  edition: WLC
  text: וַ/יִּקַּ֣ח שְׁמוּאֵ֗ל טְלֵ֤ה חָלָב֙ אֶחָ֔ד ו/יעלה עוֹלָ֛ה כָּלִ֖יל לַֽ/יהוָ֑ה וַ/יִּזְעַ֨ק שְׁמוּאֵ֤ל אֶל יְהוָה֙ בְּעַ֣ד יִשְׂרָאֵ֔ל וַֽ/יַּעֲנֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/009.yaml
  text: So Samuel took one nursing lamb and offered it as a whole burnt offering to Yahweh. And Samuel cried out to Yahweh on behalf of Israel[a], and Yahweh answered him.
translation:
  language: tl
  text: Kaya kumuha si Samuel ng isang korderong sumususo pa[a] at inihandog iyon bilang handog na sinusunog nang buo para kay Yahweh. Dumaing si Samuel kay Yahweh alang-alang sa Israel, at sinagot siya ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “isang korderong gatas,” ibig sabihin, korderong umiinom o sumususo pa ng gatas.
    reason: lexical_alternative
lexical_decisions:
- source_word: טְלֵה חָלָב אֶחָד
  choice: isang korderong sumususo pa
  rationale: Ang טְלֶה ay batang tupa o kordero, at ipinahihiwatig ng חָלָב na umiinom pa ito ng gatas. Likas sa modernong Tagalog ang “korderong sumususo pa” at malinaw nitong pinananatili ang murang gulang ng hayop.
- source_word: וַיַּעֲלֵה
  choice: inihandog iyon
  rationale: Ang Hiphil ng עלה ay karaniwang pandiwang pansakripisyo para sa paghahandog. Sapat na ipinahahayag ng “inihandog” ang diwa sa kontekstong ito nang hindi pilit na isinasalin ang larawang ‘pinaakyat.’
- source_word: עוֹלָה כָּלִיל
  choice: handog na sinusunog nang buo
  rationale: Ang עוֹלָה ay handog na sinusunog, samantalang nililinaw ng כָּלִיל na ang buong handog ay sinunog. Pinagsama ang mga ito sa isang natural at tumpak na pariralang Tagalog.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יְהוָה bilang “Yahweh”; ang “para kay” ay angkop sa tumatanggap ng handog.
- source_word: וַיִּזְעַק
  choice: dumaing
  rationale: Ang זעק ay masidhing paghingi ng tulong. Ipinahahayag ng “dumaing” ang bigat at pagkaapurahan ng panawagan nang hindi ito pinapaliit sa pangkalahatang “nanalangin.”
- source_word: בְּעַד יִשְׂרָאֵל
  choice: alang-alang sa Israel
  rationale: Ipinahahayag ng בְּעַד ang pagkilos para sa kapakanan o bilang kinatawan ng iba. Natural sa Tagalog ang “alang-alang sa Israel” at hindi nito labis na binibigyang-kahulugan ang papel ni Samuel.
- source_word: וַיַּעֲנֵהוּ יְהוָה
  choice: sinagot siya ni Yahweh
  rationale: Tuwirang pinananatili ng “siya” ang pronominal na hulapi na tumutukoy kay Samuel, habang malinaw na si Yahweh ang simuno.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulo.
- issue: Kalikasang ganap ng handog
  choice: handog na sinusunog nang buo
  alternative: buong handog na sinusunog
  rationale: Pinananatili ng salin na ang כָּלִיל ay nagpapakitang ang handog ay lubusang sinunog, nang hindi nagdaragdag ng paliwanag hinggil sa teolohikal na kabuluhan nito.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang malinaw na bokabularyong pansakripisyo at iniwasan ang labis na teknikal o makalumang pananalita. Inilagay ang talababa kaagad pagkatapos ng pariralang tinutukoy nito.
