  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na kilos ng salaysay at ang tahasang pagtukoy sa “mga lalaki ng Israel.” Inilagay ang mga talababa sa mga salitang tunay na tinutukoy ng mga ito, sa halip na sundin ang tila napagpalit na puwesto ng mga marker sa ibinigay na English consultation text.
