  text: וַ/יֵּ֨צְא֜וּ אַנְשֵׁ֤י יִשְׂרָאֵל֙ מִן הַ/מִּצְפָּ֔ה וַֽ/יִּרְדְּפ֖וּ אֶת פְּלִשְׁתִּ֑ים וַ/יַּכּ֕וּ/ם עַד מִ/תַּ֖חַת לְ/בֵ֥ית כָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/011.yaml
  text: Then the men of Israel went out from Mizpah[a], pursued the Philistines[b], and struck them down as far as below Beth-car.
translation:
  language: tl
  text: Pagkatapos, lumabas mula sa Mizpa ang mga lalaki ng Israel, hinabol ang mga Filisteo, at pinabagsak sila[a] hanggang sa ibaba ng Bet-car.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinalo sila.” Ang pandiwang Hebreo ay maaaring tumukoy sa pananakit sa labanan na may diwang pagpapabagsak o pagtalo, hindi lamang sa pisikal na paghampas.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa ibaba ng Bet-car,” na malamang ay tumutukoy sa isang lugar na mas mababa ang kinalalagyan kaysa sa Bet-car.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: lumabas
  rationale: Karaniwang pandiwang pasalaysay ang יצא para sa paglabas o pag-alis mula sa isang lugar; natural sa Filipino ang “lumabas mula sa Mizpa.”
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: ang mga lalaki ng Israel
  rationale: Tuwirang pinananatili ang panlalaking anyo ng Hebreo, na sa konteksto ay tumutukoy sa mga lalaking mandirigma.
- source_word: מִן הַמִּצְפָּה
  choice: mula sa Mizpa
  rationale: Pangalan ito ng lugar; ginamit ang anyong “Mizpa” na madaling basahin sa modernong Filipino.
- source_word: וַיִּרְדְּפוּ
  choice: hinabol
  rationale: Ang רדף ay nangangahulugang humabol o tumugis; “hinabol” ang pinakanatural at malinaw sa kontekstong militar.
- source_word: פְּלִשְׁתִּים
  choice: ang mga Filisteo
  rationale: Ito ang karaniwang katawagang Filipino sa pangkat-etnikong Philistine.
- source_word: וַיַּכּוּם
  choice: pinabagsak sila
  rationale: Sa labanan, maaaring mangahulugan ang נכה ng paghampas, pagpapabagsak, o pagtalo. Ipinahihiwatig ng “pinabagsak” ang marahas na pagkatalo nang hindi ipinapalagay na tahasang sinasabing napatay ang bawat isa.
- source_word: עַד
  choice: hanggang sa
  rationale: Nagsasaad dito ng lawak o hangganan ng paghabol sa isang lugar.
- source_word: מִתַּחַת
  choice: sa ibaba
  rationale: Nagsasaad ito ng kinalalagyang mas mababa kaysa sa Bet-car, malamang ayon sa taas ng lupain.
- source_word: לְבֵית כָּר
  choice: Bet-car
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng transliterasyon sa halip na isalin ang mga sangkap nito.
