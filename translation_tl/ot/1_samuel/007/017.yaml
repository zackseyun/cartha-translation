    issue: Ang “hinatulan ang Israel” ay maaaring mangahulugang sinentensiyahan o kinondena ang Israel.
    rationale: Sa modernong Tagalog, ang pandiwang “hatulan” ay madalas may negatibong kahulugang magbigay ng hatol laban sa isang tao o pangkat. Ang Hebreong שָׁפַט sa kontekstong ito ay tumutukoy sa patuloy na tungkulin ni Samuel bilang hukom ng Israel, hindi sa isang tiyak na hatol laban sa Israel.
