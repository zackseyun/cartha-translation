base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/017.yaml
  text: Then he would return to Ramah[a], for his house was there, and there he judged Israel. He built there an altar to Yahweh.
translation:
  language: tl
  text: Pagkatapos, bumabalik siya sa Rama[a], sapagkat naroon ang kanyang bahay, at doon siya naglingkod bilang hukom ng Israel. Nagtayo siya roon ng isang altar para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “At ang kanyang pagbabalik ay sa Rama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשֻׁבָתוֹ
  choice: Pagkatapos, bumabalik siya
  rationale: Literal na pangngalan ang parirala, ‘at ang kanyang pagbabalik,’ ngunit sa konteksto ng taunang paglalakbay ni Samuel sa naunang talata, mas natural sa Tagalog ang pandiwang habitual na ‘bumabalik siya.’ Ipinahihiwatig ng ‘Pagkatapos’ ang pagpapatuloy ng salaysay.
- source_word: הָרָמָתָה
  choice: sa Rama
  rationale: Ang directional he sa pangalan ng lugar ay nagsasaad ng patungong direksiyon; natural itong ipinapahayag sa Tagalog bilang ‘sa Rama.’
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagbabalik ni Samuel sa Rama. Ang ‘sapagkat’ ay malinaw at angkop sa marangal na salaysay.
- source_word: בֵּיתוֹ
  choice: ang kanyang bahay
  rationale: Pinananatili ang kongkretong kahulugan ng בַּיִת bilang tirahang bahay; natural din ito sa Tagalog.
- source_word: וְשָׁם
  choice: at doon
  rationale: Pinananatili ang pag-uulit ng שָׁם, na nagbibigay-diin sa Rama bilang tahanan at sentro ng gawain ni Samuel.
- source_word: שָׁפַט אֶת־יִשְׂרָאֵל
  choice: hinatulan ang Israel
  rationale: Pinananatili ang pangunahing kahulugan ng שׁפט at ang papel ni Samuel bilang hukom. Bagaman maaari rin itong tumukoy sa pamamahala, hindi ito nililimitahan o pinalalawak nang higit sa Hebreo.
- source_word: וַיִּבֶן
  choice: Nagtayo siya
  rationale: Isinusulong ng waw-consecutive ang salaysay. Hindi idinagdag ang ‘rin’ dahil walang tahasang katumbas nito sa pinagmulan.
- source_word: מִזְבֵּחַ
  choice: isang altar
  rationale: Karaniwan at malinaw na salin ng מזבח sa modernong Tagalog.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang ל ay nagpapahiwatig na ang altar ay inialay o inilaan kay Yahweh; natural sa Tagalog ang ‘para kay.’ Pinananatili ang personal na pangalan יהוה bilang ‘Yahweh.’
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Ang ‘Yahweh’ ay nagpapanatili sa banal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng papel ni Samuel sa שׁפט
  choice: hinatulan ang Israel
  alternative: pinamahalaan ang Israel; nagkaloob ng katarungan sa Israel
  rationale: Ang ‘hinatulan’ ay nagpapanatili sa tradisyonal at leksikal na ugnayan kay Samuel bilang hukom, habang hindi tahasang nilulutas kung gaano kalawak ang kanyang pampamahalaan at panghukom na tungkulin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang habitual na anyong ‘bumabalik’ ayon sa konteksto ng regular na paglalakbay sa talata 16. Pinanatili ang pag-uulit ng ‘roon/doon’ at iniwasan ang hindi tahasang dagdag na ‘rin.’
