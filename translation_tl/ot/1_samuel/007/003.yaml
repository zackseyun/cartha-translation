source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל אֶל כָּל בֵּ֣ית יִשְׂרָאֵל֮ לֵ/אמֹר֒ אִם בְּ/כָל לְבַבְ/כֶ֗ם אַתֶּ֤ם שָׁבִים֙ אֶל יְהוָ֔ה הָסִ֜ירוּ אֶת אֱלֹהֵ֧י הַ/נֵּכָ֛ר מִ/תּוֹכְ/כֶ֖ם וְ/הָ/עַשְׁתָּר֑וֹת וְ/הָכִ֨ינוּ לְבַבְ/כֶ֤ם אֶל יְהוָה֙ וְ/עִבְדֻ֣/הוּ לְ/בַדּ֔/וֹ וְ/יַצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/003.yaml
  text: Then Samuel said to all the house of Israel[a], “If you are returning to Yahweh with all your heart, remove the foreign gods and the Ashtaroths from among you, and direct your heart to Yahweh and serve him alone[d][c][b], and he will deliver you from the hand of the Philistines.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Samuel sa buong sambahayan ng Israel, “Kung buong pusong bumabalik kayo kay Yahweh, alisin ninyo sa gitna ninyo ang mga dayuhang diyos at ang mga Ashtarot[a]. Ituon ninyo ang inyong puso kay Yahweh[b] at siya lamang ang paglingkuran ninyo. Ililigtas niya kayo mula sa kamay ng mga Filisteo[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga Ashtarot” ay maramihang anyo sa Hebreo. Malamang na tumutukoy ito sa mga pagpapakita, imahen, o anyong pangkulto na kaugnay ng diyosang si Ashtoret o Astarte.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “Ihanda ninyo ang inyong puso para kay Yahweh.”'
    reason: lexical_alternative
  - marker: c
    text: Ang “mula sa kamay ng mga Filisteo” ay idyomang Hebreo na nangangahulugang mula sa kanilang kapangyarihan.
    reason: idiom_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi ni Samuel
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay; natural sa modernong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: buong sambahayan ng Israel
  rationale: Pinananatili ang kolektibong larawang “sambahayan” sa Hebreo at ang diwa ng Israel bilang isang pamayanang tipan.
- source_word: אִם בְּכָל לְבַבְכֶם אַתֶּם שָׁבִים אֶל יְהוָה
  choice: Kung buong puso kayong nanunumbalik kay Yahweh
  rationale: Ang “nanunumbalik” ay nagpapahayag ng nagpapatuloy o aktuwal na pagbabalik-loob at katapatan, ayon sa participial na anyo ng שָׁבִים; pinananatili rin ang idyomang “buong puso.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang tipang pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הָסִירוּ אֶת אֱלֹהֵי הַנֵּכָר מִתּוֹכְכֶם
  choice: alisin ninyo sa gitna ninyo ang mga diyos ng ibang mga bansa
  rationale: Malinaw na ipinahahayag ang utos na alisin sa pamayanan ang mga banyagang diyos; mas natural sa Tagalog ang “mga diyos ng ibang mga bansa” kaysa “mga banyagang diyos.”
- source_word: וְהָעַשְׁתָּרֹת
  choice: at ang mga Ashtarot
  rationale: Pinananatili ang maramihang anyong Hebreo sa transliterasyon upang hindi tiyaking mga diyosa, imahen, o kultikong anyo ang eksaktong tinutukoy.
- source_word: וְהָכִינוּ לְבַבְכֶם אֶל יְהוָה
  choice: Ituon ninyo ang inyong puso kay Yahweh
  rationale: Ipinahahayag ng “ituon” ang matatag at sinasadyang pagharap ng kalooban kay Yahweh, habang inilalagay sa talababa ang mas literal na alternatibong “ihanda.”
- source_word: וְעִבְדֻהוּ לְבַדּוֹ
  choice: at siya lamang ang paglingkuran ninyo
  rationale: Ang “paglingkuran” ay sumasaklaw sa pagsamba, pagsunod, at tanging katapatan, kaya hindi nito nililimitahan ang עבד sa gawaing panritwal lamang.
- source_word: וְיַצֵּל אֶתְכֶם מִיַּד פְּלִשְׁתִּים
  choice: Ililigtas niya kayo mula sa kamay ng mga Filisteo
  rationale: Ang “ililigtas” ay natural na nagsasaad ng ipinangakong bunga, at pinananatili ng “mula sa kamay” ang konkretong idyoma para sa kapangyarihan o pagkakontrol.
theological_decisions:
- issue: Paglalarawan sa pagbabalik ng Israel sa שָׁבִים
  choice: nanunumbalik kay Yahweh
  alternative: bumabalik kay Yahweh; nagbabalik-loob kay Yahweh
  rationale: Pinananatili ng “nanunumbalik” ang diwa ng pagbabalik sa tipang katapatan nang hindi ipinapasok ang mas makitid o mas huling sistematikong kahulugan ng “pagbabalik-loob.”
- issue: Saklaw ng עבד sa utos
  choice: siya lamang ang paglingkuran ninyo
  alternative: siya lamang ang sambahin ninyo
  rationale: Mas malawak ang “paglingkuran” at maaaring tumukoy kapwa sa pagsamba at sa masaklaw na katapatan at pagsunod.
- issue: Ugnayan ng mga utos at ng pagliligtas
  choice: Ililigtas niya kayo
  alternative: upang iligtas niya kayo; at nawa’y iligtas niya kayo
  rationale: Binabasa ang waw na kasunod ng mga pautos bilang inaasahang bunga o pangako, ngunit hindi dinaragdagan ng kondisyon o paliwanag na wala sa teksto.
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang personal na tipang pangalan na tahasang nasa tekstong Hebreo.
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Pinanatili ang “sambahayan ng Israel” bilang kolektibong larawang Hebreo, ang pangalang “Yahweh,” at ang idyomang “mula sa kamay.” Ang “Ashtarot” ay hindi pinalitan ng isang tiyak na interpretasyon, upang mapanatili ang tunay na kalabuan ng maramihang anyo.
