  to: Pagkatapos, sinabi ni Samuel sa buong sambahayan ng Israel, “Kung buong pusong bumabalik kayo kay Yahweh, alisin ninyo sa gitna ninyo ang mga dayuhang diyos at ang mga Ashtarot[a]. Ituon ninyo ang inyong puso kay Yahweh[b] at siya lamang ang paglingkuran ninyo. Ililigtas niya kayo mula sa kamay ng mga Filisteo[c].”
