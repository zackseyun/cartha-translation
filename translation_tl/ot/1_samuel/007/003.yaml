  source_fidelity: 'Tumpak ang pangunahing diwa at lahat ng mahahalagang bahagi ng Hebreo: ang kolektibong “bahay/sambahayan ng Israel,” ang pagbabalik kay Yahweh nang buong puso, pag-aalis ng mga diyos na dayuhan at mga Ashtarot, eksklusibong paglilingkod, at pagliligtas mula sa kapangyarihan ng mga Filisteo. Gayunman, ang “mga diyos ng ibang mga bansa” ay bahagyang mas tiyak kaysa sa “mga dayuhang diyos” at maaaring magpahiwatig ng mga bansang partikular na tinutukoy, samantalang pangkalahatan ang Hebreo.'
  naturalness: Marangal at nauunawaan ang draft, ngunit mas likas sa modernong Filipino ang “buong pusong bumabalik” kaysa “buong puso kayong nanunumbalik.” Mas tuwiran din ang “ang mga dayuhang diyos” para sa pinagmulan, at mas natural ang paliwanag na “kapangyarihan” kaysa “pagkakontrol.”
  terminology: Ang “Yahweh,” “sambahayan ng Israel,” “Ashtarot,” at “paglingkuran” ay angkop at pinananatili. Hindi dapat tukuyin sa teksto kung ang mga Ashtarot ay mga diyosa, imahen, o mga anyong pangkulto; maayos na inilalagay ang paglilinaw na ito sa talababa.
