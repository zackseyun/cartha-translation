  to: At ang mga lunsod na inagaw ng mga Filisteo mula sa Israel ay naibalik sa Israel, mula Ekron hanggang Gat; at nabawi ng Israel mula sa kamay ng mga Filisteo ang teritoryo ng mga lunsod na iyon. At nagkaroon ng kapayapaan sa pagitan ng Israel at ng mga Amoreo.[a]
  rationale: Pinalitan lamang ang “teritoryo ng mga iyon” ng “teritoryo ng mga lunsod na iyon” para sa mas natural at malinaw na Filipino. Hindi binago ang kahulugan, saklaw ng teritoryo, o ang sinadyang pag-iingat sa historikal na kalabuan ng “mga Amoreo.”
