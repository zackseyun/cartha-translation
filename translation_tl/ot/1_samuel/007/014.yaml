  text: וַ/תָּשֹׁ֣בְנָה הֶ/עָרִ֡ים אֲשֶׁ֣ר לָֽקְחוּ פְלִשְׁתִּים֩ מֵ/אֵ֨ת יִשְׂרָאֵ֤ל לְ/יִשְׂרָאֵל֙ מֵ/עֶקְר֣וֹן וְ/עַד גַּ֔ת וְ/אֶ֨ת גְּבוּלָ֔/ן הִצִּ֥יל יִשְׂרָאֵ֖ל מִ/יַּ֣ד פְּלִשְׁתִּ֑ים וַ/יְהִ֣י שָׁל֔וֹם בֵּ֥ין יִשְׂרָאֵ֖ל וּ/בֵ֥ין הָ/אֱמֹרִֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/014.yaml
  text: And the cities that the Philistines had taken from Israel were restored to Israel[a], from Ekron to Gath; and Israel delivered its territory from the hand of the Philistines. And there was peace between Israel and the Amorites.
translation:
  language: tl
  text: At ang mga lunsod na inagaw ng mga Filisteo mula sa Israel ay naibalik sa Israel, mula Ekron hanggang Gat; at nabawi ng Israel mula sa kamay ng mga Filisteo ang teritoryo ng mga lunsod na iyon. At nagkaroon ng kapayapaan sa pagitan ng Israel at ng mga Amoreo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga Cananeo,” kung ang “mga Amoreo” ay ginagamit dito bilang mas malawak na tawag sa mga mamamayan ng lupain.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּשֹׁבְנָה
  choice: ay naibalik
  rationale: Ipinahihiwatig ng pandiwang mula sa שוב na muling napasakamay ng Israel ang mga lunsod; natural sa Tagalog ang pasibong anyo at hindi nito ginagawang kusang kumikilos ang mga lunsod.
- source_word: הֶעָרִים
  choice: ang mga lunsod
  rationale: Karaniwang katumbas ng עָרִים at angkop sa konteksto ng mga sentrong teritoryal na pinagtatalunan ng Israel at mga Filisteo.
- source_word: אֲשֶׁר לָקְחוּ פְלִשְׁתִּים
  choice: na inagaw ng mga Filisteo
  rationale: Ang 'inagaw' ay malinaw na nagsasaad ng marahas na pagkuha at natural na nagpapakitang nauna ang pagkakuha sa pagkakabalik.
- source_word: מֵאֵת יִשְׂרָאֵל ... לְיִשְׂרָאֵל
  choice: mula sa Israel ... sa Israel
  rationale: Pinananatili ang pag-uulit sa Hebreo at ang pambansa-teritoryal na diwa ng Israel.
- source_word: מֵעֶקְרוֹן וְעַד גַּת
  choice: mula sa Ekron hanggang sa Gat
  rationale: Tuwirang inilalarawan ang saklaw na heograpiko ng mga lunsod na naibalik.
- source_word: וְאֶת גְּבוּלָן
  choice: ang teritoryo ng mga iyon
  rationale: Maaaring mangahulugan ang גְּבוּל ng hangganan o teritoryo. Dito, ang hulaping pambabaeng maramihan ay tumutukoy sa mga lunsod, kaya ginawang tahasang 'teritoryo ng mga iyon' upang mapanatili ang reperensiya nang hindi malabo.
- source_word: הִצִּיל
  choice: nabawi
  rationale: Sa Hiphil ng נצל, tumutukoy ito sa pagliligtas o pag-agaw mula sa kapangyarihan ng kaaway. Sa usaping teritoryal, natural at tumpak ang 'nabawi.'
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: mula sa kamay ng mga Filisteo
  rationale: Pinananatili ang kongkretong idyomang Hebreo tungkol sa kontrol o kapangyarihan; nauunawaan din ito sa marangal na wikang biblikal na Tagalog.
- source_word: וַיְהִי שָׁלוֹם
  choice: nagkaroon ng kapayapaan
  rationale: Natural na eksistensiyal na pahayag sa Tagalog na nagpapahiwatig ng kawalan ng labanan at maayos na ugnayan.
- source_word: הָאֱמֹרִי
  choice: mga Amoreo
  rationale: Pinananatili sa pangunahing teksto ang tiyak na pangkat na pinangalanan ng Hebreo, sa halip na agad itong gawing mas malawak na katawagang 'mga Cananeo.'
theological_decisions:
- issue: Saklaw ng katawagang הָאֱמֹרִי sa hulihan ng talata
  choice: mga Amoreo
  alternative: mga Cananeo
  rationale: Tiyak na 'Amoreo' ang nasa tekstong Hebreo. Gayunman, maaari itong unawain bilang mas malawak na tawag sa mga mamamayan ng lupain; inilagay ang posibilidad na iyon sa talababa upang hindi sapilitang lutasin ang historikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang idyomang “mula sa kamay” dahil nauunawaan ito at inilalarawan nito ang kapangyarihan ng mga Filisteo. Ang “teritoryo ng mga iyon” ay sadyang tumutukoy sa mga lunsod, alinsunod sa pambabaeng maramihang hulapi ng Hebreo.
