  naturalness: Ang “teritoryo ng mga iyon” ay nauunawaan ngunit medyo matigas at hindi gaanong likas sa modernong Filipino; maaari rin itong magtunog malabo. Ang “teritoryo ng mga lunsod na iyon” ay mas malinaw at natural habang pinananatili ang reperensiya ng hulaping pambabaeng maramihan sa Hebreo.
  terminology: Ang “mga Filisteo,” “mga Amoreo,” “kapayapaan,” at “mula sa kamay” ay angkop sa marangal ngunit makabagong rehistrong biblikal. Ang “nabawi” ay katanggap-tanggap sa kontekstong teritoryal para sa הִצִּיל, nang hindi lumalampas sa diwa ng pagliligtas mula sa kontrol ng kaaway.
