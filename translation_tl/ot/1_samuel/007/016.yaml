  text: And he would go year by year and make the circuit of Bethel[a], Gilgal, and Mizpah[b], and he judged Israel in all these places.
translation:
  language: tl
  text: Taun-taon, nililibot niya ang Bethel, Gilgal, at Mizpa, at humahatol siya sa Israel sa lahat ng mga lugar na iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָלַךְ
  choice: nililibot niya
  rationale: Kasama ng taunang panandang-panahon at ng וְסָבַב, ipinahihiwatig nito ang nakagawiang paglalakbay ni Samuel, hindi isang minsanang kilos.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: Taun-taon
  rationale: Natural na modernong Tagalog para sa regular na pag-uulit bawat taon.
- source_word: וְסָבַב
  choice: nililibot
  rationale: Ipinahihiwatig ng pandiwa ang pag-ikot sa isang regular na ruta sa mga binanggit na bayan.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Karaniwang anyong transliterado ng pangalan ng lugar sa Tagalog na Bibliya.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Karaniwang transliterasyon ng pangalan ng lugar.
- source_word: הַמִּצְפָּה
  choice: Mizpa
  rationale: Karaniwang anyong ginagamit sa Tagalog para sa pangalan ng lugar na Mizpah.
- source_word: וְשָׁפַט
  choice: hinahatulan niya
  rationale: Pinananatili ang tuwirang diwang hudisyal ng שפט habang hinahayaan ang konteksto na magpahiwatig ng mas malawak na pamumuno ni Samuel.
- source_word: אֶת יִשְׂרָאֵל
  choice: ang Israel
  rationale: Tumutukoy sa Israel bilang bayan na pinaglilingkuran ni Samuel bilang hukom.
- source_word: אֵת כָּל הַמְּקוֹמוֹת הָאֵלֶּה
  choice: sa lahat ng lugar na iyon
  rationale: Bagaman may markang אֵת, ang parirala ay gumaganap na pook na pinangyarihan ng kanyang paghatol.
