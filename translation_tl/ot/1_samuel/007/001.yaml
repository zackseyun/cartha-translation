  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ אַנְשֵׁ֣י קִרְיַ֣ת יְעָרִ֗ים וַֽ/יַּעֲלוּ֙ אֶת אֲר֣וֹן יְהוָ֔ה וַ/יָּבִ֣אוּ אֹת֔/וֹ אֶל בֵּ֥ית אֲבִינָדָ֖ב בַּ/גִּבְעָ֑ה וְ/אֶת אֶלְעָזָ֤ר בְּנ/וֹ֙ קִדְּשׁ֔וּ לִ/שְׁמֹ֖ר אֶת אֲר֥וֹן יְהוָֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/001.yaml
  text: Then the men of Kiriath-jearim came and brought up the ark of Yahweh[a], and they brought it into the house of Abinadab on the hill[b]. And they consecrated Eleazar his son to keep the ark of Yahweh.
translation:
  language: tl
  text: Dumating ang mga lalaki ng Kiriat-jearim at iniakyat nila ang kaban ni Yahweh.[a] Dinala nila ito sa bahay ni Abinadab na nasa burol.[b] Itinalaga nila ang anak ni Abinadab na si Eleazar para sa banal na tungkuling bantayan ang kaban ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, YHWH, ang personal na pangalan ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa Gibeah” kung ituturing na pangalan ng lugar ang salitang Hebreo sa halip na karaniwang pangngalang “burol.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dumating
  rationale: Ang Qal wayyiqtol ng בוא ay nagsusulong ng salaysay at likas na isinasalin dito bilang “dumating.”
- source_word: אַנְשֵׁי קִרְיַת יְעָרִים
  choice: ang mga lalaki ng Kiriat-jearim
  rationale: Tiyak na “mga lalaki” ang אַנְשֵׁי, hindi ang mas malawak na “mga tao”; tinumbasan ang pangalan ng lugar sa paraang madaling basahin sa Filipino.
- source_word: וַיַּעֲלוּ
  choice: iniakyat nila
  rationale: Pinananatili nito ang direksiyong paitaas na likas sa עלה at ang katotohanang ang kaban ang bagay na inilipat.
- source_word: אֲרוֹן יְהוָה
  choice: ang kaban ni Yahweh
  rationale: Ang אֲרוֹן sa kontekstong ito ay ang sagradong kaban, at ang personal na pangalang יְהוָה ay tinumbasan bilang “Yahweh.”
- source_word: וַיָּבִאוּ אֹתוֹ אֶל בֵּית אֲבִינָדָב
  choice: Dinala nila ito sa bahay ni Abinadab
  rationale: Natural na Filipino ito para sa pandiwang “dinala” at sa patutunguhang ipinahihiwatig ng אֶל.
- source_word: בַּגִּבְעָה
  choice: na nasa burol
  rationale: May tiyak na pantukoy ang anyong Hebreo at pinakanatural itong unawain bilang karaniwang pangngalang “ang burol,” bagaman posible rin ang pangalan ng lugar.
- source_word: וְאֶת אֶלְעָזָר בְּנוֹ
  choice: ang anak ni Abinadab na si Eleazar
  rationale: Nililinaw sa natural na Filipino ang pinakamalapit at pinakanaaangkop na tinutukoy ng hulaping “kanyang anak,” si Abinadab.
- source_word: קִדְּשׁוּ
  choice: Itinalaga nila ... para sa banal na tungkulin
  rationale: Ipinahahayag nito ang sagradong paglalaan na taglay ng קדשׁ nang hindi gumagamit ng malabo o di-karaniwang pananalita.
- source_word: לִשְׁמֹר
  choice: bantayan
  rationale: Sa konteksto, ang שׁמר ay tumutukoy sa pag-iingat at pagbabantay sa kaban; malinaw at likas ang “bantayan” sa Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ng “Yahweh” na personal na pangalan ang mismong banal na pangalang nasa tekstong Hebreo at iniiwasang gawin itong karaniwang titulo.
- issue: Kung ang בַּגִּבְעָה ay karaniwang pangngalan o pangalan ng lugar
  choice: nasa burol
  alternative: sa Gibeah
  rationale: Dahil may pantukoy ang anyong Hebreo, pinakapayak itong basahin bilang “sa burol.” Gayunman, pinananatili sa talababa ang posibleng pagbasa rito bilang pangalan ng lugar.
- issue: Lakas ng kahulugan ng קִדְּשׁוּ
  choice: Itinalaga ... para sa banal na tungkulin
  alternative: ibinukod; pinabanal
  rationale: Ipinakikita ng parirala na ang pagtatalaga kay Eleazar ay para sa sagradong paglilingkod, ngunit hindi nito dinaragdagan ang teksto ng tiyak na seremonya o katungkulang hindi binanggit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaban” bilang kinikilalang katawagan sa sagradong ark, “iniakyat” upang mapanatili ang direksiyon ng kilos, at “banal na tungkuling bantayan” upang maipahayag ang kultikong diwa ng pagtatalaga nang hindi nagiging teknikal.
