  to: Mula nang manatili ang kaban sa Kiriat-jearim, dumami ang mga araw[a], at lumipas ang dalawampung taon; at ang buong sambahayan ng Israel ay nanaghoy para kay Yahweh.[b]
  rationale: Inalis ang “sa paghahangad” sa pangunahing teksto upang hindi maipasiya ang pinagtatalunang saklaw ng idyoma. Ang “para kay Yahweh” ay nagbibigay ng natural na Tagalog na direksiyonal na ugnayan, habang ang talababa ay maingat na nagtatala ng mga posibleng kahulugan. Ginawang “lumipas ang dalawampung taon” ang temporal na sugnay para sa linaw at likas na gamit.
