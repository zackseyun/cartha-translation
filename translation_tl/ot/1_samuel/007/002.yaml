  text: וַ/יְהִ֗י מִ/יּ֞וֹם שֶׁ֤בֶת הָֽ/אָרוֹן֙ בְּ/קִרְיַ֣ת יְעָרִ֔ים וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/יִּֽהְי֖וּ עֶשְׂרִ֣ים שָׁנָ֑ה וַ/יִּנָּה֛וּ כָּל בֵּ֥ית יִשְׂרָאֵ֖ל אַחֲרֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/002.yaml
  text: From the day the ark remained at Kiriath-jearim[a], the days became many, and they were twenty years[b]; and all the house of Israel lamented after Yahweh.
translation:
  language: tl
  text: Mula nang manatili ang kaban sa Kiriat-jearim, dumami ang mga araw[a], at lumipas ang dalawampung taon; at ang buong sambahayan ng Israel ay nanaghoy para kay Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maraming araw ang lumipas.” Literal sa Hebreo, “dumami ang mga araw.”
    reason: lexical_alternative
  - marker: b
    text: O “nanabik kay Yahweh,” “nanaghoy habang bumabaling kay Yahweh,” o “nagluksa dahil kay Yahweh.” Literal sa Hebreo, “nanaghoy kasunod ni Yahweh,” isang idyomang maaaring magpahiwatig ng pagdadalamhati, paghahangad, o pagbaling sa kanya.
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁבֶת
  choice: manatili
  rationale: Ang infinitibong mula sa ישׁב, na ang kaban ang paksa, ay tumutukoy sa patuloy na pagkalagay nito sa isang lugar. Likas sa Tagalog ang “manatili” para sa isang bagay na iniwan o inilagak doon.
- source_word: הָאָרוֹן
  choice: ang kaban
  rationale: “Ang kaban” ang nakaugaliang salin sa kontekstong ito at hindi nagdaragdag ng “ng Diyos,” na wala sa Hebreo ng talata.
- source_word: בְּקִרְיַת יְעָרִים
  choice: sa Kiriat-jearim
  rationale: Pinananatili ang transliterasyon ng pangalan ng lugar; likas na katumbas ng lokatibong בְּ ang “sa.”
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: dumami ang mga araw
  rationale: Malapit ito sa larawan ng Hebreo, bagaman idiomatikong tumutukoy ang parirala sa paglipas ng mahabang panahon.
- source_word: וַיִּהְיוּ עֶשְׂרִים שָׁנָה
  choice: umabot ang mga iyon sa dalawampung taon
  rationale: Ipinakikita nito sa likas na Tagalog na ang mga araw na lumipas ay naging kabuuang dalawampung taon, habang pinananatili ang kaugnayan ng pangmaramihang pandiwa sa “mga araw.”
- source_word: וַיִּנָּהוּ
  choice: nanaghoy
  rationale: Karaniwang ipinahihiwatig ng נהה ang pagdadalamhati o paghihinagpis. Hindi nito tahasang idinaragdag ang ganap na pagsisisi na hindi pa sinasabi sa talata.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: ang buong sambahayan ng Israel
  rationale: Pinananatili nito ang pambansa at tipanang larawan ng “sambahayan ng Israel” sa halip na paikliin bilang “buong Israel.”
- source_word: אַחֲרֵי יְהוָה
  choice: sa paghahangad kay Yahweh
  rationale: Sa konstruksiyong ito, ang literal na “pagkatapos/kasunod ni Yahweh” ay isang di-tiyak na idyoma na maaaring magpahiwatig ng paghahangad o pagbaling sa kanya. Ang salin ay ginawang nauunawaan sa Tagalog, at inilalahad sa talababa ang iba pang posibleng diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng titulong “PANGINOON.”
theological_decisions:
- issue: Diwa ng tugon ng Israel sa וַיִּנָּהוּ ... אַחֲרֵי יְהוָה
  choice: Pagdadalamhating may paghahangad kay Yahweh
  alternative: Pagdadalamhati habang bumabaling kay Yahweh, o pagluluksa dahil sa pagkawalay sa kanya
  rationale: Pinagsasama ng pananalita ang paghihinagpis at direksiyon kay Yahweh, ngunit hindi nito nililinaw kung pagnanais, pagbaling, o pagluluksa dahil sa pagkawalay ang nangingibabaw. Hindi ginagawang tahasang pormula ng ganap na pagsisisi ang talata.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang larawang “dumami ang mga araw” at ang “sambahayan ng Israel,” samantalang bahagyang ginawang mas likas ang sugnay tungkol sa dalawampung taon. Ginamit ang “Kiriat-jearim” bilang madaling basahing transliterasyon at “Yahweh” para sa banal na pangalan.
