  terminology: Ang “kaban,” “Kiriat-jearim,” “buong sambahayan ng Israel,” at “Yahweh” ay angkop at pare-pareho sa ninanais na rehistro. Pinananatili ang “nanaghoy,” ngunit ang kaugnayan nito kay Yahweh ay ginawang hindi labis na interpretatibo.
