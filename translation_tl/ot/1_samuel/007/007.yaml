  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּֽי הִתְקַבְּצ֤וּ בְנֵֽי יִשְׂרָאֵל֙ הַ/מִּצְפָּ֔תָ/ה וַ/יַּעֲל֥וּ סַרְנֵֽי פְלִשְׁתִּ֖ים אֶל יִשְׂרָאֵ֑ל וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּֽרְא֖וּ מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/007.yaml
  text: When the Philistines heard that the sons of Israel had gathered at Mizpah[a], the rulers of the Philistines went up against Israel. When the sons of Israel heard it[b], they were afraid because of the Philistines.
translation:
  language: tl
  text: Nang mabalitaan ng mga Filisteo na nagtipon ang mga Israelita sa Mizpa[a], umakyat laban sa Israel ang mga pinuno ng mga Filisteo. Nang mabalitaan ito ng mga Israelita, natakot sila sa mga Filisteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “papuntang Mizpa.” May hulaping nagsasaad ng direksiyon ang anyong Hebreo, bagaman ipinakikita ng konteksto na doon nagtipon ang bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: mabalitaan / mabalitaan ito
  rationale: Sa salaysay, ang שׁמע ay tumutukoy sa pagkatanggap ng balita. Likas sa modernong Tagalog ang “mabalitaan,” at napananatili ang pag-uulit ng pandiwa sa dalawang sugnay.
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang anyong Tagalog ng pangalan ng pangkat na Philistines.
- source_word: הִתְקַבְּצוּ
  choice: nagtipon
  rationale: Ipinahahayag ng hitpael ng קבץ ang sama-samang pagtitipon; malinaw at natural ang “nagtipon.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na “mga anak na lalaki ni Israel,” ang parirala ay karaniwang katawagan sa bayang Israel; ang “mga Israelita” ay tumpak, natural, at hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
- source_word: הַמִּצְפָּתָה
  choice: sa Mizpa
  rationale: May hulaping paturol sa direksiyon ang anyong Hebreo, ngunit sa konteksto ay inilalarawan ang lugar kung saan nagtipon ang bayan. Pinananatili sa talababa ang alternatibong “papuntang Mizpa.”
- source_word: וַיַּעֲלוּ
  choice: sumalakay
  rationale: Literal itong “umakyat,” ngunit sa kontekstong militar ang kilos ay paglusob laban sa Israel. Ang “sumalakay” ay malinaw at likas sa Tagalog nang hindi nagdaragdag ng tiyak na paraan ng pagkilos.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: mga pinuno ng mga Filisteo
  rationale: Ang סרנים ay mga kinikilalang pinunong pampolitika at pangmilitar ng mga Filisteo. Mas malinaw sa kasalukuyang Tagalog ang “mga pinuno” kaysa “mga panginoon.”
- source_word: אֶל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa kontekstong militar, ang אֶל ay nagpapahiwatig ng kilos laban sa Israel; kasama ng “sumalakay,” malinaw ang mapanlabang direksiyon.
- source_word: וַיִּירְאוּ
  choice: natakot
  rationale: Tuwirang ipinahahayag ng ירא ang pagkatakot; natural sa salaysay ang “natakot.”
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: sa mga Filisteo
  rationale: Ang idyomang Hebreo ay nagsasaad na ang mga Filisteo ang sanhi o kinatatakutan. Natural sa Tagalog ang “natakot sila sa mga Filisteo.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga Israelita” bilang likas na katawagan sa buong bayan at “mga pinuno” para sa natatanging titulong Filisteo. Ang tanging talababa ay inilagay sa “Mizpa[a]” upang mapanatili ang tunay na gramatikal na alternatibo sa Hebreo.
