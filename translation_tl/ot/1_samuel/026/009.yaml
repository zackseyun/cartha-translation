  yaml_path: translation/ot/1_samuel/026/009.yaml
  text: But David said to Abishai[a], “Do not destroy him, for who can stretch out his hand against Yahweh’s anointed and remain guiltless?”
translation:
  language: tl
  text: Ngunit sinabi ni David kay Abisai, “Huwag mo siyang patayin, sapagkat sino ang maaaring mag-unat ng kamay laban sa pinahiran[a] ni Yahweh at manatiling walang sala?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “pinahiran” ay mula sa salitang pinagmulan din ng titulong “Mesiyas.” Dito ay tumutukoy ito kay Saul bilang haring pinahiran ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit sa konteksto ay sinasalungat ni David ang mungkahi ni Abisai; kaya likas ang “Ngunit.”
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: Huwag mo siyang patayin
  rationale: Ang Hiphil ng שׁחת ay maaaring mangahulugang sirain o lipulin. Dahil ang agarang konteksto ay ang mungkahing paslangin si Saul sa pamamagitan ng sibat, malinaw at natural sa Tagalog ang “patayin.”
- source_word: שָׁלַח יָדוֹ
  choice: magtaas ng kamay
  rationale: Idyoma ito para sa pagkilos laban sa isang tao, lalo na sa marahas na paraan. Pinananatili ng “magtaas ng kamay laban” ang matalinghagang larawan at likas ito sa modernong Tagalog.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: laban sa pinahiran ni Yahweh
  rationale: Ang מָשִׁיחַ ay “isang pinahiran.” Dito ay tumutukoy ito kay Saul bilang haring pinahiran ni Yahweh, hindi tuwirang bilang eskatolohikal na Mesiyas.
- source_word: וְנִקָּה
  choice: at manatiling walang sala
  rationale: Ipinahihiwatig ng נקה ang pagiging malaya sa sala o pananagutan. Pinananatili ng parirala ang moral at legal na bigat nang hindi nililimitahan sa pag-iwas lamang sa parusa.
theological_decisions:
- issue: Kahulugan ng מְשִׁיחַ bilang pagtukoy kay Saul
  choice: pinahiran ni Yahweh
  alternative: Mesiyas ni Yahweh
  rationale: Sa makasaysayang konteksto, si Saul ang haring itinalaga sa pamamagitan ng pagpapahid. Iniiwasan ng “pinahiran” ang di-kinakailangang tuwirang paglalapat ng titulong “Mesiyas,” habang inilalahad sa talababa ang mahalagang ugnayang leksikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Yahweh” para sa banal na pangalang יהוה. Ang “magtaas ng kamay laban” ay nagpapanatili sa idyomang Hebreo nang nauunawaan ng karaniwang mambabasa.
