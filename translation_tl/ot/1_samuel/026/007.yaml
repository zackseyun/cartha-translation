base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/007.yaml
  text: So David and Abishai came to the troops by night[a], and behold, Saul was lying asleep within the encampment, with his spear stuck in the ground at his head, and Abner and the troops were lying around him.
translation:
  language: tl
  text: Kaya, dumating sina David at Abisai sa mga kawal nang gabi. Naroon si Saul, nakahigang natutulog sa loob ng kampo[a], at ang sibat niya ay nakatusok sa lupa sa bandang ulo niya. Nakahiga sa palibot niya si Abner at ang mga kawal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bilog”—malamang na tumutukoy ang Hebreo sa pabilog na ayos ng kampo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: mga kawal
  rationale: Sa kontekstong militar, tumutukoy ito sa hukbo o pangkat ng mga tauhan ni Saul, hindi sa mga tao sa pangkalahatan.
- source_word: לַיְלָה
  choice: nang gabing iyon
  rationale: Likas na pagpapahayag sa modernong Tagalog ng panahong pinangyarihan; ipinahihiwatig ng konteksto ang partikular na gabing iyon.
- source_word: וְהִנֵּה
  choice: Naroon
  rationale: Ipinahahayag ang biglang pagtuon ng salaysay sa tanawing nadatnan nila nang hindi gumagamit ng di-likas na literalismong “masdan.”
- source_word: שֹׁכֵב יָשֵׁן
  choice: nakahigang natutulog
  rationale: Pinananatili kapuwa ang posisyon ni Saul at ang kalagayan niyang natutulog.
- source_word: בַּמַּעְגָּל
  choice: sa loob ng kampo
  rationale: Sa konteksto, malamang na tumutukoy sa pabilog na ayos o protektadong gitna ng kampo; malinaw at natural ang pangunahing salin habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: חֲנִיתוֹ
  choice: ang sibat niya
  rationale: Karaniwang modernong katawagan sa sandatang tinutukoy sa mga salaysay tungkol kay Saul.
- source_word: מְעוּכָה בָאָרֶץ
  choice: nakatusok sa lupa
  rationale: Ipinahihiwatig ng anyong Hebreo na ang sibat ay naibaon o naitulos sa lupa.
- source_word: מראשתו
  choice: sa ulunan niya
  rationale: Ang anyo ay idyoma para sa lugar sa tabi o dako ng ulo; ang “sa ulunan niya” ay maikli, natural, at tumpak.
- source_word: סביבתו
  choice: sa palibot niya
  rationale: Malinaw na inilalarawan ang pagkakahimlay ng mga kawal sa paligid ni Saul.
