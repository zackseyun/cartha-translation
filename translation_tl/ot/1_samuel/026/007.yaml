  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga kawal” para sa kontekstong militar at “Naroon” upang natural na maipakita ang deiktikong diin ng Hebreong וְהִנֵּה. Lumilitaw sa pangunahing teksto ang marker na [a].
