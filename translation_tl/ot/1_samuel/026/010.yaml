  revised_text: At sinabi ni David, “Buhay si Yahweh! Tiyak na si Yahweh ang hahampas sa kanya, o darating ang araw niya at mamamatay siya, o lulusong siya sa labanan at mapapahamak.”
  revised_footnotes: []
