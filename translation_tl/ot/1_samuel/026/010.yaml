base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/010.yaml
  text: And David said[a], “As Yahweh lives, surely Yahweh will strike him, or his day will come to die[c][b], or he will go down into battle and perish.”
translation:
  language: tl
  text: At sinabi ni David, “Buhay si Yahweh! Tiyak na si Yahweh ang hahampas sa kanya, o darating ang araw niya at mamamatay siya, o lulusong siya sa labanan at mapapahamak.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Buhay si Yahweh!
  rationale: Likas at marangal na pormula ng panunumpa sa Tagalog; pinananatili ang taimtim na bisa ng karaniwang Hebreong panunumpa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כִּי אִם
  choice: tiyak na
  rationale: Sa konteksto ng panunumpa, ipinahahayag nito ang mariing katiyakan ng sinabi ni David.
- source_word: יִגָּפֶנּוּ
  choice: hahampas sa kanya
  rationale: Pinananatiling bukas ang tiyak na paraan ng pagkilos o paghatol ni Yahweh, gaya ng pandiwang Hebreo.
- source_word: יוֹמוֹ יָבוֹא וָמֵת
  choice: darating ang araw niya at mamamatay siya
  rationale: Pinananatili ang idyomang 'darating ang araw niya' at ang kasunod na tahasang kamatayan, nang hindi ipinapalagay nang higit sa sinasabi ng Hebreo.
- source_word: בַמִּלְחָמָה יֵרֵד
  choice: lulusong siya sa labanan
  rationale: Ang 'lulusong' ay natural na wikang militar sa Tagalog at pinananatili ang larawan ng Hebreong 'bumaba/pumaroon sa labanan.'
- source_word: וְנִסְפָּה
  choice: at mapapahamak
  rationale: Ipinahahayag ang pagkalipol o pagkamatay sa labanan habang pinananatiling naiiba sa naunang pandiwang 'mamamatay.'
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang ginamit sa Hebreo; pinananatili ng 'Yahweh' ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Ang paraan ng magiging kamatayan ni Saul
  choice: Tatlong alternatibong posibilidad ang pinanatili
  alternative: Ipaliwanag ang lahat bilang tiyak na itinakdang pagpatay ng Diyos
  rationale: Inilalahad ni David na maaaring hampasin siya ni Yahweh, dumating ang araw ng kanyang kamatayan, o mapahamak siya sa labanan. Hindi nilulutas ng salin ang tensiyon o pinagsasanib ang mga ito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'Buhay si Yahweh!' bilang taimtim at natural na pormula ng panunumpa, at 'lulusong sa labanan' bilang karaniwang larawang militar.
