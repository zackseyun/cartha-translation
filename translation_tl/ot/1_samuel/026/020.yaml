  naturalness: May bahagyang alanganing konstruksyon ang 'dumanak sa lupa ang dugo ko nang malayo sa presensya.' Mas natural ang paglalagay ng 'malayo sa presensya ni Yahweh' kaagad pagkatapos ng paksa. Ang 'paghahabol sa isang perdiz' ay natural at hindi nagdaragdag ng tagaganap.
  terminology: Ang 'Yahweh,' 'dugo ko,' 'pulgas,' at 'perdiz' ay angkop. Nananatiling kapaki-pakinabang ang talababa sa 'perdiz' dahil hindi ganap na tiyak ang pagkakakilanlan ng Hebreong termino.
  issues:
