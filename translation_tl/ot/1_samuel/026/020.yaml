source:
  edition: WLC
  text: וְ/עַתָּ֗ה אַל יִפֹּ֤ל דָּֽמִ/י֙ אַ֔רְצָ/ה מִ/נֶּ֖גֶד פְּנֵ֣י יְהוָ֑ה כִּֽי יָצָ֞א מֶ֣לֶךְ יִשְׂרָאֵ֗ל לְ/בַקֵּשׁ֙ אֶת פַּרְעֹ֣שׁ אֶחָ֔ד כַּ/אֲשֶׁ֛ר יִרְדֹּ֥ף הַ/קֹּרֵ֖א בֶּ/הָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/020.yaml
  text: So now[a], do not let my blood fall to the ground away from the presence of Yahweh, for the king of Israel has come out to seek a single flea[b], as one hunts a partridge in the mountains.
translation:
  language: tl
  text: Kaya ngayon, huwag mong hayaang mabuhos sa lupa ang dugo ko, malayo sa presensya ni Yahweh,[a] sapagkat lumabas ang hari ng Israel upang hanapin ang isang pulgas lamang, tulad ng paghahabol sa isang perdiz[b] sa kabundukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malayo sa harapan ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Ang eksaktong uri ng ibong tinutukoy ng salitang Hebreo ay hindi tiyak; karaniwan itong inuunawang perdiz.
    reason: textual_or_lexical_uncertainty
lexical_decisions:
- source_word: דָּמִי
  choice: ang dugo ko
  rationale: Pinananatili ang konkretong larawan ng marahas na kamatayan at pananagutan sa dugong mabububo; mas tiyak ito kaysa sa pagpapaluwag na “ang buhay ko.”
- source_word: אַל יִפֹּל ... אַרְצָה
  choice: huwag mong hayaang dumanak sa lupa
  rationale: Ang “dumanak sa lupa” ay likas na pariralang Filipino para sa pagbububo ng dugo at malinaw na naihahatid ang konkretong larawan ng Hebreo.
- source_word: מִנֶּגֶד פְּנֵי יְהוָה
  choice: nang malayo sa presensya ni Yahweh
  rationale: Ginagamit ang “presensya” bilang likas na katumbas ng idyomatikong “mukha” at pinananatili ang diwa ng pagkakalayo kay Yahweh, nang hindi labis na nililinaw kung lupain, santuwaryo, o pangangalaga ang pangunahing tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa anyong transliterado ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: יָצָא
  choice: lumabas
  rationale: Pinananatili ang payak na pandiwa ng pagkilos ng hari nang hindi dinaragdagan ng mas tiyak na interpretasyong “nangangaso.”
- source_word: לְבַקֵּשׁ
  choice: upang hanapin
  rationale: Malawak at likas na katumbas ito ng pandiwang Hebreo at hinahayaang manggaling sa konteksto ang mapanuyang diwa ng pagtugis.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: isang pulgas lamang
  rationale: Pinananatili ang mapagpakumbabang metapora ni David at ang diin ng אֶחָד sa pamamagitan ng “lamang.”
- source_word: הַקֹּרֵא
  choice: perdiz
  rationale: Ang tradisyonal at malamang na pagkakakilanlan sa ibon ay partridge; “perdiz” ang mas tiyak na katawagang Filipino kaysa “pugo,” bagaman hindi ganap na tiyak ang espesye.
- source_word: יִרְדֹּף ... בֶּהָרִים
  choice: humahabol ... sa kabundukan
  rationale: Likas na inilalarawan ng “humahabol” ang pagtugis, habang ang “kabundukan” ay tumutugma sa maramihang anyo ng הָרִים.
theological_decisions:
- issue: Paglalarawan sa pagkakalayo mula sa presensya ni Yahweh
  choice: nang malayo sa presensya ni Yahweh
  alternative: malayo sa harapan ni Yahweh
  rationale: Ipinahihiwatig ng parirala ang pagkakalayo kay Yahweh, ngunit hindi tahasang tinutukoy kung ito ay pagkakalayo sa lupain, santuwaryo, o banal na pangangalaga; kaya hindi nilulutas ng salin ang tensiyong iyon.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinili ang “dumanak sa lupa” kaysa sa literal ngunit alanganing “bumagsak sa lupa ang dugo,” at ang “isang pulgas lamang” upang maipahayag nang natural ang mapanghamak-sa-sariling paghahambing ni David. Ang “perdiz” ay mas tiyak kaysa “pugo,” at ipinaliwanag sa talababa dahil hindi ito pangkaraniwang salita at may leksikal na kawalang-katiyakan.
