id: 1SA.26.24
reference: 1 Samuel 26:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כַּ/אֲשֶׁ֨ר גָּדְלָ֧ה נַפְשְׁ/ךָ֛ הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/עֵינָ֑/י כֵּ֣ן תִּגְדַּ֤ל נַפְשִׁ/י֙ בְּ/עֵינֵ֣י יְהוָ֔ה וְ/יַצִּלֵ֖/נִי מִ/כָּל צָרָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/024.yaml
  text: And look[a], just as your life was precious in my eyes this day, so may my life be precious in the eyes of Yahweh, and may he deliver me from all distress.
translation:
  language: tl
  text: At tingnan mo[a], kung paanong naging mahalaga sa paningin ko ang buhay mo sa araw na ito, gayon din nawa maging mahalaga sa paningin ni Yahweh ang buhay ko, at iligtas nawa niya ako sa lahat ng kapighatian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “At masdan mo.” Sa idyomang Hebreo, literal na “naging dakila sa paningin ko ang buhay mo ... maging dakila sa paningin ni Yahweh ang buhay ko,” na nagpapahayag ng mataas na pagpapahalaga o pagiging mahalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At tingnan mo
  rationale: Likas at makabagong panawag-pansin ito na nagpapanatili sa mariing puwersa ng Hebreo nang hindi gumagamit ng makalumang pananalita.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: kung paanong ... gayon din
  rationale: Malinaw na ipinahahayag ng pares na ito ang paghahambing ng pagpapahalaga ni David sa buhay ni Saul at ng hinihiling niyang pagpapahalaga ni Yahweh sa sarili niyang buhay.
- source_word: גָּדְלָה ... נַפְשְׁךָ ... בְּעֵינַי
  choice: naging mahalaga sa paningin ko ang buhay mo
  rationale: Literal na 'naging dakila' ang pandiwa, ngunit sa idyomang ito ay tumutukoy ito sa mataas na pagpapahalaga; ang נֶפֶשׁ ay 'buhay' sa konteksto ng hindi pagpatay kay Saul.
- source_word: הַיּוֹם הַזֶּה
  choice: sa araw na ito
  rationale: Pinananatili nito ang tahasang temporal na diin ng Hebreo sa dignidad at natural na Tagalog.
- source_word: תִּגְדַּל ... נַפְשִׁי ... בְּעֵינֵי יְהוָה
  choice: nawa maging mahalaga sa paningin ni Yahweh ang buhay ko
  rationale: Ang di-ganap na anyo ay angkop unawain bilang hangarin o panalangin. Inuulit ang parehong idyoma upang mapanatili ang paghahambing.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na kinakatawan ng Tetragrammaton.
- source_word: וְיַצִּלֵנִי
  choice: at iligtas nawa niya ako
  rationale: Ang Hiphil ng נצל ay nangangahulugang iligtas o sagipin; ang 'nawa' ay nagpapanatili sa himig ng kahilingan.
- source_word: מִכָּל צָרָה
  choice: sa lahat ng kapighatian
  rationale: Saklaw ng צָרָה ang matinding kagipitan, hirap, o kapahamakan; ipinahahayag ng 'kapighatian' ang bigat at lawak nito.
theological_decisions:
- issue: Paglalapat ng paghahambing sa pag-iingat ni Yahweh sa buhay ni David
  choice: 'Inihayag bilang hangarin o panalangin: ''nawa maging mahalaga ... at iligtas nawa niya ako.'''
  alternative: 'Basahin bilang tiyak na pahayag: ''magiging mahalaga ... at ililigtas niya ako.'''
  rationale: Maaaring magpahiwatig ang mga anyong Hebreo ng hinaharap o ng hangarin, ngunit ang konteksto at magkatugmang mga sugnay ay natural na nagpapahiwatig ng hiling. Pinananatili ng 'nawa' ang panalanging himig nang hindi ginagawa itong garantiya.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Nasa tekstong Hebreo ang personal na banal na pangalan; pinananatili itong pangalan sa salin sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'tingnan mo' bilang natural na panawag-pansin, 'buhay' sa halip na 'kaluluwa' ayon sa konteksto, at magkatulad na pananalita sa dalawang bahagi upang mapanatili ang retorikal na paghahambing.
