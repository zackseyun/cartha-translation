  text: And he said[a], “Why is my lord pursuing his servant like this? For what have I done[b], and what evil is in my hand?”
translation:
  language: tl
  text: At sinabi niya, “Bakit hinahabol ng aking panginoon ang kanyang lingkod nang ganito?[a] Ano ba ang nagawa ko, at anong kasamaan ang nasa kamay ko?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kanyang lingkod.” Maaaring asahan sa tuwirang pakikipag-usap ang “inyong lingkod,” ngunit pangatlong panauhan ang anyo sa Masoretic Text.
    reason: alternative_reading
  - marker: b
    text: Ang “nasa kamay ko” ay idyomang Hebreo na tumutukoy sa pagkakasala, masamang balak, o kakayahang gumawa ng pinsala.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi labis na tinutukoy ang eksaktong ugnayang pangpanahon.
- source_word: לָמָּה זֶּה
  choice: Bakit ... nang ganito
  rationale: Likas na salin sa modernong Tagalog ng mariing tanong na ‘bakit ganito?’ at angkop sa kasunod na pandiwa.
- source_word: אֲדֹנִי
  choice: aking panginoon
  rationale: Magalang na tawag ni David kay Saul bilang nakatataas na tao; hindi ito banal na titulo sa kontekstong ito.
- source_word: רֹדֵף אַחֲרֵי
  choice: patuloy na hinahabol
  rationale: Ipinahahayag ng participle ang nagpapatuloy na paghabol; hindi dinaragdagan ng mas interpretatibong diwang ‘inuusig.’
- source_word: עַבְדּוֹ
  choice: ang kanyang lingkod
  rationale: Pinananatili ang pangatlong panauhang panlalaking hulapi ng Masoretic Text, sa halip na pakinisin bilang ‘inyong lingkod.’
- source_word: כִּי מֶה עָשִׂיתִי
  choice: Ano ba ang nagawa ko
  rationale: Ang כִּי ay gumaganap na panimula sa paliwanag na retorikal na tanong; sapat na naipahihiwatig ito sa Tagalog ng ‘Ano ba,’ nang hindi nangangailangan ng matigas na ‘sapagkat.’
- source_word: וּמַה בְּיָדִי רָעָה
  choice: at anong kasamaan ang nasa kamay ko
  rationale: Pinananatili ang Hebreong metapora ng ‘nasa kamay’ at ang lakas ng רָעָה bilang ‘kasamaan,’ sa halip na pahinain bilang simpleng ‘kamalian.’
