translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ngunit madaling maunawaan. Ginamit ang “panginoon” bilang pantao at magalang na titulo sa maliit na titik. Pinanatili ang di-karaniwang pangatlong panauhang “kanyang lingkod” at ipinaliwanag sa talababa; pinanatili rin ang metaporang “nasa kamay ko.”
