revisions:
- from: At sinabi niya, “Bakit patuloy na hinahabol ng aking panginoon nang ganito ang kanyang lingkod?[a] Ano ba ang nagawa ko, at anong kasamaan ang nasa kamay ko?”[b]
  to: At sinabi niya, “Bakit hinahabol ng aking panginoon ang kanyang lingkod nang ganito?[a] Ano ba ang nagawa ko, at anong kasamaan ang nasa kamay ko?[b]”
  rationale: Inayos ang pagkakasunod-sunod ng mga sangkap upang maging higit na likas ang Tagalog, inalis ang hindi kailangang “patuloy na,” at inilapit ang panandang b sa idyomang “nasa kamay ko.” Hindi binago ang kahulugan, ang magalang na rehistro, o ang tekstuwal na ambigwidad ng pangatlong panauhang “kanyang lingkod.”
