base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/002.yaml
  text: Then Saul arose and went down to the wilderness of Ziph[a], and with him were three thousand chosen men of Israel, to seek David in the wilderness of Ziph.
translation:
  language: tl
  text: Pagkatapos, tumindig si Saul at bumaba sa ilang ng Zif, kasama ang tatlong libong piling lalaki ng Israel, upang hanapin si David sa ilang ng Zif.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Ang Qal wayyiqtol ng קום ay karaniwang naghuhudyat ng pagsisimula ng tiyak na pagkilos sa salaysay. Pinananatili ng “tumindig” ang idyomang Hebreo nang hindi nagiging di-likas sa marangal na Tagalog.
- source_word: וַיֵּרֶד
  choice: bumaba
  rationale: Tuwirang pinananatili ang direksiyonal na diwa ng ירד, “bumaba.”
- source_word: מִדְבַּר זִיף
  choice: ilang ng Zif
  rationale: Ang מִדְבָּר ay tumutukoy sa ilang o tigang at di-naninirahang lupain, hindi kinakailangang mabuhanging disyerto. Ang “ilang” ay maikli at tumpak.
- source_word: וְאִתּוֹ
  choice: Kasama niya
  rationale: Likas na ipinapahayag sa Tagalog ang payak na pagsama at iniiwasan ang mabigat na literal na ayos.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: tatlong libong ... lalaki
  rationale: Pinananatili ang literal na bilang at pangngalang “lalaki”; hindi idinaragdag ang “kawal,” bagaman malinaw na militar ang konteksto.
- source_word: בְּחוּרֵי יִשְׂרָאֵל
  choice: piling lalaki ng Israel
  rationale: Ipinahihiwatig ng parirala ang mga pinili o piling tauhan. Ang “piling lalaki” ay natural at hindi labis na nagpapakahulugan bilang isang tiyak na uri ng hukbo.
- source_word: לְבַקֵּשׁ
  choice: upang hanapin
  rationale: Sa konteksto ng pagtugis, natural na katumbas ng בקש ang “hanapin,” at malinaw nitong ipinapakita ang layunin.
- source_word: אֶת דָּוִד
  choice: si David
  rationale: Hindi isinasalin ang panandang tuwirang layon na אֶת; ginagamit ang personal marker na “si” na hinihingi ng gramatikang Tagalog.
- source_word: בְּמִדְבַּר זִיף
  choice: sa ilang ng Zif
  rationale: Pinananatili ang pag-uulit ng pook gaya ng Hebreo, sa halip na paikliin ito.
