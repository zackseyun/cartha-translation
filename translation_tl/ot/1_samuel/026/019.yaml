source:
  edition: WLC
  text: וְ/עַתָּ֗ה יִֽשְׁמַֽע נָא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י עַבְדּ֑/וֹ אִם יְהוָ֞ה הֱסִֽיתְ/ךָ֥ בִ/י֙ יָרַ֣ח מִנְחָ֔ה וְ/אִ֣ם בְּנֵ֣י הָ/אָדָ֗ם אֲרוּרִ֥ים הֵם֙ לִ/פְנֵ֣י יְהוָ֔ה כִּֽי גֵרְשׁ֣וּ/נִי הַ/יּ֗וֹם מֵ/הִסְתַּפֵּ֜חַ בְּ/נַחֲלַ֤ת יְהוָה֙ לֵ/אמֹ֔ר לֵ֥ךְ עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/019.yaml
  text: And now[a], please let my lord the king hear the words of his servant. If Yahweh has stirred you up against me, may he accept an offering; but if it is men, they are cursed before Yahweh, because they have driven me out today from having a share in Yahweh’s inheritance, saying, ‘Go[b], serve other gods.’
translation:
  language: tl
  text: At ngayon, pakinggan po sana ng aking panginoong hari ang mga salita ng kanyang lingkod. Kung si Yahweh ang nag-udyok sa iyo laban sa akin, tanggapin nawa niya ang isang handog[a]. Ngunit kung mga tao ang may kagagawan, isinumpa sila sa harap ni Yahweh, sapagkat itinaboy nila ako ngayon upang hindi na mapabilang sa mana ni Yahweh[b], na sinasabi, ‘Humayo ka at maglingkod sa ibang mga diyos.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “amuyin nawa niya ang isang handog.” Isa itong idyoma para sa pagtanggap o pagkalugod sa isang handog.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “upang hindi na makaugnay sa mana ni Yahweh.” Maaaring idiin ng Hebreo ang pagiging kalakip o kabilang sa bayan at lupaing inilaan kay Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay at ang panandang panahong nagbubukas sa pakiusap ni David.
- source_word: יִשְׁמַע נָא
  choice: pakinggan po sana
  rationale: Ipinahahayag ng נָא at ng anyong jussive ang magalang at mapagpakumbabang pakiusap, hindi isang tahasang utos.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: aking panginoong hari
  rationale: Angkop na magalang na katawagan kay Saul sa konteksto ng korte; hindi ito tumutukoy sa pagka-Diyos.
- source_word: דִּבְרֵי עַבְדּוֹ
  choice: ang mga salita ng kanyang lingkod
  rationale: Pinananatili ang ikatlong panauhang mapagpakumbabang pananalita ng Hebreo, bagaman direktang kinakausap ni David si Saul.
- source_word: אִם יְהוָה הֱסִיתְךָ בִי
  choice: Kung si Yahweh ang nag-udyok sa iyo laban sa akin
  rationale: Saklaw ng הֱסִית ang pag-udyok o pagbuyo. Pinananatili ng salin ang kondisyunal na pahayag nang hindi ipinapaliwanag ang ugnayan ng pagkilos ng Diyos at pananagutan ng tao.
- source_word: יָרַח מִנְחָה
  choice: tanggapin nawa niya ang isang handog
  rationale: Ang literal na ‘amuyin ang handog’ ay isang idyoma para sa malugod na pagtanggap nito; malinaw ang diwa sa makabagong Tagalog habang inilalagay sa talababa ang literal na larawan.
- source_word: וְאִם בְּנֵי הָאָדָם
  choice: Ngunit kung mga tao ang may kagagawan
  rationale: Ipinakikita ang kaibahan sa naunang posibilidad na si Yahweh ang nag-udyok, nang hindi tinutukoy nang higit sa sinasabi ng teksto kung sinu-sino ang mga taong iyon.
- source_word: אֲרוּרִים הֵם לִפְנֵי יְהוָה
  choice: sumpain sila sa harap ni Yahweh
  rationale: Inililipat ang predikatibong pahayag na sila ay nasa ilalim ng sumpa sa harap ni Yahweh; likas at marangal ang ‘sumpain’ sa Tagalog.
- source_word: גֵרְשׁוּנִי
  choice: itinaboy nila ako
  rationale: Naghahatid ng sapilitang pagpapaalis kay David mula sa lupain at pamayanang kinabibilangan niya.
- source_word: מֵהִסְתַּפֵּחַ
  choice: upang hindi na mapabilang
  rationale: Ang hitpael ng ספח ay maaaring mangahulugang kumapit, makaugnay, o mapabilang. Ang ‘mapabilang’ ay likas sa Tagalog at pinananatili ang dimensiyon ng pakikiisa sa bayan at lupain.
- source_word: בְּנַחֲלַת יְהוָה
  choice: sa mana ni Yahweh
  rationale: Pinananatili ng ‘mana’ ang malawak na diwa ng נחלה, na maaaring sumaklaw sa lupaing inilaan at sa bayang nakaugnay rito.
- source_word: לֵאמֹר לֵךְ עֲבֹד אֱלֹהִים אֲחֵרִים
  choice: na sinasabi, ‘Humayo ka at maglingkod sa ibang mga diyos’
  rationale: Pinananatili ang tuwirang pananalita at ang puwersa ng dalawang pautos. Sa konteksto, maaaring ito ang ipinahihiwatig ng pagpapalayas, ngunit hindi tahasang nilulutas iyon sa pangunahing teksto.
theological_decisions:
- issue: Ang pag-udyok ni Yahweh kay Saul laban kay David
  choice: 'Pinanatili bilang isang kondisyunal na posibilidad: ‘Kung si Yahweh ang nag-udyok.’'
  alternative: Ipaliwanag ito bilang tuwirang sanhi ng Diyos o bilang pagpapahintulot lamang ng Diyos.
  rationale: Hindi ipinaliliwanag ng Hebreo ang metapisikal na ugnayan ng banal na pagkilos at pagkilos ng tao, kaya hindi ito nilulutas ng salin.
- issue: Ang saklaw ng ‘mana ni Yahweh’
  choice: Ginamit ang malawak na pananalitang ‘mana ni Yahweh.’
  alternative: Limitahan ito sa pisikal na lupain lamang o sa pagsamba sa santuwaryo lamang.
  rationale: Maaaring kapwa nakapaloob ang lupaing tipan at ang bayang naninirahan at sumasamba roon; pinananatili ng ‘mana’ ang sadyang lawak ng pahayag.
- issue: Ang utos na maglingkod sa ibang mga diyos
  choice: Pinanatili bilang tuwirang sipi na bunga o ipinahihiwatig ng pagtataboy kay David.
  alternative: Sabihing literal na binigkas ng mga kaaway ang mga salitang ito, o gawing tahasang ‘para bang sinasabi.’
  rationale: Maaaring ipakilala ng לֵאמֹר ang aktuwal na pananalita o ang praktikal na epekto ng kanilang ginawa. Hindi pinipili ng salin ang isa nang lubusan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “po sana” upang maipakita ang magalang na pakiusap ni David sa hari, at pinanatili ang ikatlong panauhang “kanyang lingkod” bilang anyo ng pagpapakumbaba sa korte. Ginamit ang pangalang “Yahweh” para sa יהוה. Ang mga talababa ay inilagay sa mismong mga pariralang kanilang nililinaw.
