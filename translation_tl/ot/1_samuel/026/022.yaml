  text: Sumagot si David at sinabi, “Narito ang sibat ng hari. Pumarito[a] ang isa sa mga kabataang lalaki[b] at kunin ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tumawid dito”; literal na nangangahulugan ang pandiwang Hebreo na “dumaan/tumawid.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kabataang lalaki” ay maaari ring isaling “mga lingkod” o “mga tauhan,” sapagkat maaaring tumukoy ang salitang Hebreo sa edad o sa mababang katayuan, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Sumagot ... at sinabi
  rationale: Pinananatili ang dalawang pandiwang Hebreo na karaniwang ginagamit upang ipakilala ang tugon, habang nananatiling natural sa salaysay na Tagalog.
- source_word: הִנֵּה
  choice: Narito
  rationale: Likas at makabagong paraan ito upang ituon ang pansin sa sibat na nasa kinaroroonan ni David.
- source_word: הַחֲנִית הַמֶּלֶךְ
  choice: ang sibat ng hari
  rationale: Tuwirang ipinapahayag ang ugnayang pagmamay-ari at ginagamit ang karaniwang salitang “sibat” para sa חֲנִית.
- source_word: וְיַעֲבֹר
  choice: Tumawid dito
  rationale: Pinananatili ang pangunahing kahulugan ng עבר na pagdaan o pagtawid, at ipinahihiwatig ng “dito” ang paglapit sa kinaroroonan ng nagsasalita.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: ang isa sa mga kabataang lalaki
  rationale: Pinananatili ang substantibong gamit ng bilang na “isa” at ang pangunahing kahulugang may kaugnayan sa edad ng נַעַר, nang hindi labis na tinutukoy ang katayuan nila.
- source_word: וְיִקָּחֶהָ
  choice: at kunin ito
  rationale: Ang karaniwang kahulugan ng לקח ay “kunin”; ang panghalip ay tumutukoy sa pambabaeng pangngalang “sibat” sa Hebreo, na likas na isinasalin bilang “ito” sa Tagalog.
