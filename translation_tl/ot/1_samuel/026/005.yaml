base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/005.yaml
  text: Then David arose and came to the place where Saul had camped[a], and David saw the place where Saul lay, and Abner son of Ner, the commander of his army. Saul was lying within the encampment, and the people were camped around him.
translation:
  language: tl
  text: Pagkatapos, tumayo si David at pumunta sa lugar kung saan nagkampo si Saul. Nakita ni David ang lugar kung saan nakahiga si Saul, at si Abner na anak ni Ner, ang pinuno ng hukbo ni Saul. Nakahiga si Saul sa loob ng kampo[a], at nakahimpil sa palibot niya ang mga tauhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa bilog.” Maaaring tumukoy ito sa pabilog na ayos ng kampo o sa panloob na bahagi nito na napaliligiran ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumayo
  rationale: Karaniwang panandang pasalaysay ang Qal wayyiqtol ng קום para sa kasunod na pagkilos. Natural sa Filipino ang “tumayo” at hindi nito ipinapalagay na nagsimula na agad siyang maglakbay.
- source_word: וַיָּבֹא אֶל־הַמָּקוֹם
  choice: pumunta sa lugar
  rationale: Ipinapahayag ng בוא na may אֶל ang paglapit sa isang lugar. Mas natural sa pananaw ng salaysay sa Filipino ang “pumunta” kaysa “dumating.”
- source_word: חָנָה
  choice: pinagkampuhan
  rationale: Ang ganap na anyo sa sugnay na may אֲשֶׁר ay tumutukoy sa naunang pagkakampo ni Saul sa lugar na iyon. Malinaw at likas sa modernong Filipino ang “lugar na pinagkampuhan.”
- source_word: שָׁכַב ... שֹׁכֵב
  choice: hinihigaan ... nakahiga
  rationale: Pinananatili ng magkaibang anyo ang pagkakaiba sa pagitan ng pagtukoy sa puwesto ni Saul at ng paglalarawan sa kasalukuyan niyang ayos.
- source_word: וְאַבְנֵר בֶּן־נֵר שַׂר צְבָאוֹ
  choice: gayundin si Abner na anak ni Ner, ang pinuno ng hukbo ni Saul
  rationale: Pinananatili ang pagkakaugnay ni Abner sa nakita ni David nang hindi ipinapalagay nang higit sa Hebreo kung eksaktong paano siya nakapuwesto. Nililinaw ng “ni Saul” kung kaninong hukbo ang tinutukoy.
- source_word: בַּמַּעְגָּל
  choice: sa loob ng pabilog na kampo
  rationale: Ang מַעְגָּל ay literal na may diwang “bilog” o pabilog na ayos at sa kontekstong ito ay tumutukoy sa loob o protektadong bahagi ng kampo. Pinananatili ng salin ang hugis na ipinahihiwatig ng salita nang hindi gumagamit ng malabong “sa bilog.”
- source_word: חֹנִים סְבִיבֹתָיו
  choice: nakahimpil sa palibot niya
  rationale: Inilalarawan ng participle at ng סְבִיבֹתָיו ang patuloy na pagkakapuwesto ng mga tauhan sa palibot ni Saul. Ang “nakahimpil” ay natural para sa mga kasapi ng hukbong nagkakampo.
