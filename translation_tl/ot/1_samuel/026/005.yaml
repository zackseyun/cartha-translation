  naturalness: Likas at malinaw ang karamihan ng salin. Mas natural at tumpak sa naratibo ang “kung saan nakahiga si Saul” kaysa “na hinihigaan ni Saul.” Ang “sa loob ng kampo” ay malinaw sa pangunahing teksto at iniiwan sa talababa ang leksikal na detalye.
  terminology: Wasto ang mga pangalang David, Saul, Abner, at Ner. Ang “pinuno ng hukbo ni Saul” ay angkop para sa שַׂר צְבָאוֹ. Ang “mga tauhan” ay katanggap-tanggap para sa mga taong nakapalibot kay Saul sa kontekstong militar.
