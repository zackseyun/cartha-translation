translation_notes:
  register: Makabago at marangal na Filipino ang ginamit, na may payak na bokabularyong madaling maunawaan. Pinanatili ang bahagyang hindi tiyak na pagkakaugnay ni Abner sa lugar na nakita ni David at ang konkretong larawang pabilog sa מַעְגָּל.
