revisions:
- from: Pagkatapos, tumayo si David at pumunta sa lugar na pinagkampuhan ni Saul. Nakita ni David ang lugar na hinihigaan ni Saul, gayundin si Abner na anak ni Ner, ang pinuno ng hukbo ni Saul. Nakahiga si Saul sa loob ng pabilog na kampo[a], at nakahimpil sa palibot niya ang mga tauhan.
  to: Pagkatapos, tumayo si David at pumunta sa lugar kung saan nagkampo si Saul. Nakita ni David ang lugar kung saan nakahiga si Saul, at si Abner na anak ni Ner, ang pinuno ng hukbo ni Saul. Nakahiga si Saul sa loob ng kampo[a], at nakahimpil sa palibot niya ang mga tauhan.
  rationale: Pinalitan ang habitual na “hinihigaan” ng pangyayaring “kung saan nakahiga” upang tumugma sa שָׁכַב. Ginawang “sa loob ng kampo” ang pangunahing salin ng בַּמַּעְגָּל, habang inilagay sa talababa ang literal at di-tiyak na diwa ng “bilog,” upang hindi magpasiya nang lampas sa teksto kung ang tinutukoy ay buong pabilog na kampo o ang panloob na napaliligirang bahagi nito.
