base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/014.yaml
  text: Then David called to the troops and to Abner son of Ner, saying, “Will you not answer, Abner?” Abner answered and said, “Who are you, calling to the king?”
translation:
  language: tl
  text: Pagkatapos, sumigaw si David sa mga kawal at kay Abner na anak ni Ner, “Hindi ka ba sasagot, Abner?” Sumagot si Abner, “Sino kang tumatawag sa hari?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם
  choice: mga kawal
  rationale: Bagaman karaniwang nangangahulugang “bayan” o “mga tao,” sa konteksto ay tumutukoy ito sa pangkat ng mga tauhan o hukbo ni Saul; natural at tiyak dito ang “mga kawal.”
- source_word: וַיִּקְרָא ... אֶל
  choice: sumigaw ... sa
  rationale: Magkalayo ang dalawang pangkat at kailangang marinig si David, kaya ipinahihiwatig ng pandiwa rito ang malakas na pagtawag; “sumigaw sa” ang natural na Filipino.
- source_word: הֲלוֹא תַעֲנֶה
  choice: Hindi ka ba sasagot
  rationale: Pinananatili ang retorikal na tanong at ang hamon na nakapaloob sa Hebreo.
- source_word: מִי אַתָּה קָרָאתָ אֶל הַמֶּלֶךְ
  choice: Sino kang tumatawag sa hari?
  rationale: Inilalarawan ng “tumatawag” ang kasalukuyang kilos sa tagpo at likas sa Filipino, habang pinananatili ang tuwirang tanong kung sino ang tumatawag.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kawal” ayon sa kontekstong militar at pinasimple ang paulit-ulit na Hebreong pormulang “sumagot at sinabi” bilang natural na “sumagot.”
