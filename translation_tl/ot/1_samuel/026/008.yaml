  to: Pagkatapos, sinabi ni Abisai kay David, “Ibinigay ng Diyos ngayon sa iyong kamay ang iyong kaaway.[a] Kaya ngayon, hayaan mong itarak ko siya sa lupa gamit ang sibat, sa isang saksak lamang, at hindi ko na siya sasaksakin muli.”[b]
