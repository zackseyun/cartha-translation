base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/008.yaml
  text: Then Abishai said to David[a], “God has delivered your enemy into your hand today. So now, please let me pin him to the earth with the spear in one blow[c][b], and I will not strike him a second time.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Abisai kay David, “Ibinigay ng Diyos ngayon sa iyong kamay ang iyong kaaway.[a] Kaya ngayon, hayaan mong itarak ko siya sa lupa gamit ang sibat, sa isang saksak lamang, at hindi ko na siya sasaksakin muli.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Isinailalim ngayon ng Diyos sa iyong kapangyarihan ang iyong kaaway.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “sasaktan ko siya, pakisuyo, sa sibat at sa lupa, isang beses, at hindi ko na ito uulitin sa kaniya.” Ipinahihiwatig ng parirala na iaamba ni Abisai ang sibat upang maitarak siya sa lupa sa iisang saksak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סִגַּר
  choice: Ibinigay
  rationale: Sa konteksto, nangangahulugan itong ibinigay o isinailalim ang isang tao sa kapangyarihan ng iba; natural ito sa idyomang “ibinigay sa iyong kamay.”
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang anyong pandiwa at konteksto ay tumutukoy sa Diyos bilang kumikilos sa pangyayari.
- source_word: אוֹיִבְךָ
  choice: iyong kaaway
  rationale: Tuwirang katumbas ng pangngalang may panlaping tumutukoy kay David.
- source_word: בְּיָדֶךָ
  choice: sa iyong kamay
  rationale: Pinananatili ang larawang Hebreo na nangangahulugang nasa kapangyarihan o kontrol ng isang tao.
- source_word: אַכֶּנּוּ נָא
  choice: hayaan mong ibaon ko siya
  rationale: Ipinahahayag ng cohortative na may נָא ang pakiusap o pahintulot na hinihingi ni Abisai; ang “ibaon” ay binabasa kasama ng kasunod na sibat at lupa.
- source_word: בַּחֲנִית
  choice: sa isang sibat
  rationale: Ang tinutukoy ay ang sibat na naroon sa tagpo; sa Filipino, natural ang “sa isang sibat lamang” bilang isang tusok o hataw ng sibat.
- source_word: וּבָאָרֶץ
  choice: sa lupa
  rationale: Ipinahihiwatig na tatagos o ibabaon ang biktima hanggang sa lupa.
- source_word: פַּעַם אַחַת
  choice: sa isang sibat lamang
  rationale: Ipinapahayag ang isang beses na pagtama; idiomatiko sa Filipino ang kabuuang pariralang nagsasabing isang paggamit lamang ng sibat ang kailangan.
- source_word: וְלֹא אֶשְׁנֶה לוֹ
  choice: hindi ko na siya kailangang ulitin pa
  rationale: Ang pandiwa ay literal na “uulitin”; nauunawaan sa konteksto na hindi na kailangan ang ikalawang pagsaksak o paghampas.
- source_word: וַיֹּאמֶר ... אֶל
  choice: Pagkatapos, sinabi ... kay
  rationale: Ang waw sa salaysay ay nagsusulong sa pagkakasunod-sunod ng mga pangyayari.
theological_decisions:
- issue: Pagkilos ng Diyos sa pagiging lantad ni Saul
  choice: Ibinigay ng Diyos sa iyong kamay ngayon ang iyong kaaway
  alternative: Isinailalim ngayon ng Diyos sa iyong kapangyarihan ang iyong kaaway
  rationale: Pinananatili nito ang sinabi at pagpapakahulugan ni Abisai tungkol sa pagkilos ng Diyos, nang hindi ipinahihiwatig na sinasang-ayunan ng tagapagsalaysay ang balak niyang patayin si Saul.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang idyomang “sa iyong kamay,” habang ipinaliwanag sa talababa ang kahulugang kapangyarihan o kontrol. Ang marahas na kilos ay malinaw ngunit hindi pinalabis.
