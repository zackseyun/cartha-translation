  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֹא ט֞וֹב הַ/דָּבָ֣ר הַ/זֶּה֮ אֲשֶׁ֣ר עָשִׂיתָ֒ חַי יְהוָ֗ה כִּ֤י בְנֵי מָ֨וֶת֙ אַתֶּ֔ם אֲשֶׁ֧ר לֹֽא שְׁמַרְתֶּ֛ם עַל אֲדֹנֵי/כֶ֖ם עַל מְשִׁ֣יחַ יְהוָ֑ה וְ/עַתָּ֣ה רְאֵ֗ה אֵֽי חֲנִ֥ית הַ/מֶּ֛לֶךְ וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם אֲשֶׁ֥ר מראשת/ו־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/016.yaml
  text: This thing that you have done is not good. As Yahweh lives[a], you are sons of death, because you did not keep watch over your master, over Yahweh’s anointed. And now, look—where are the king’s spear and the water jar that were by his head?
translation:
  language: tl
  text: Hindi mabuti ang ginawa mong ito. Buhay si Yahweh, karapat-dapat kayong mamatay[a], sapagkat hindi ninyo binantayan ang inyong panginoon, ang pinahiran ni Yahweh. Ngayon, tingnan mo—nasaan ang sibat ng hari at ang lalagyan ng tubig na nasa tabi ng kanyang ulo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga anak kayo ng kamatayan,” isang idyomang nagsasaad na karapat-dapat sila sa parusang kamatayan o nararapat silang mamatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא טוֹב הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָ
  choice: Hindi mabuti ang ginawa mong ito
  rationale: Natural na Filipino ang tuwirang paghahayag na ito at pinananatili ang payak na pagtataya ng Hebreong לֹא טוֹב nang hindi ito pinalalakas bilang ‘masama.’ Isahan ang ‘mo,’ gaya ng pandiwang Hebreo na nakatuon kay Abner.
- source_word: חַי יְהוָה
  choice: Buhay si Yahweh
  rationale: Pinananatili ang maikli at maringal na pormula ng panunumpa sa Hebreo at ang pangalang Yahweh.
- source_word: בְנֵי מָוֶת אַתֶּם
  choice: karapat-dapat kayong mamatay[a]
  rationale: Ipinahahayag sa malinaw na modernong Filipino ang hudisyal na diwa ng idyomang literal na ‘mga anak ng kamatayan.’ Maramihan ang ‘kayo,’ ayon sa Hebreo, kaya nahahayag ang paglipat mula kay Abner tungo sa buong pangkat.
- source_word: לֹא שְׁמַרְתֶּם עַל
  choice: hindi ninyo binantayan
  rationale: Ang ‘binantayan’ ay natural sa kontekstong militar at saklaw nito ang tungkuling magbantay at mag-ingat laban sa panganib.
- source_word: אֲדֹנֵיכֶם
  choice: inyong panginoon
  rationale: Tumutukoy kay Saul bilang nakatataas sa kanila. Ang maliit na titik ay naglilinaw na hindi ito banal na titulo.
- source_word: מְשִׁיחַ יְהוָה
  choice: ang pinahiran ni Yahweh
  rationale: Malapit sa Hebreong titulong maharlika at panrelihiyon, ngunit hindi agad ipinapakahulugan bilang ang kalaunang titulong Mesiyas.
- source_word: וְעַתָּה רְאֵה אֵי
  choice: Ngayon, tingnan mo—nasaan
  rationale: Pinananatili ang isahang utos kay Abner at ang biglang pagtawag-pansin sa ebidensiya.
- source_word: חֲנִית הַמֶּלֶךְ וְאֶת צַפַּחַת הַמַּיִם
  choice: ang sibat ng hari at ang lalagyan ng tubig
  rationale: Tuwiran at madaling maunawaang salin ng dalawang bagay na kinuha mula sa tabi ng ulo ni Saul.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng מְשִׁיחַ יְהוָה sa konteksto ng paghahari ni Saul
  choice: ang pinahiran ni Yahweh
  alternative: ang hinirang ni Yahweh; ang Mesiyas ni Yahweh
  rationale: Pinananatili nito ang pagpapahid kay Saul bilang hari at ang natatanging katayuang kaakibat niyon, nang hindi ipinapantay si Saul sa kalaunang Mesiyanikong titulo.
- issue: Idyomang בְנֵי מָוֶת
  choice: karapat-dapat kayong mamatay
  alternative: mga anak kayo ng kamatayan; nakatakda kayong mamatay
  rationale: Ipinakikita ng konteksto ang pananagutan sa parusang kamatayan dahil sa matinding pagkabigo sa pagbabantay. Iniiwasan ng salin ang malabong literalismo at ang labis na deterministikong ‘nakatakda.’
translation_notes:
  register: Modernong Filipino na tuwiran ngunit maringal. Sadyang pinanatili ang paglipat mula sa isahang ‘mo/tingnan mo’ para kay Abner tungo sa maramihang ‘kayo/ninyo’ para sa mga bantay. Ginamit ang ‘panginoon’ sa maliit na titik para kay Saul at ang personal na pangalang ‘Yahweh’ para sa Diyos.
