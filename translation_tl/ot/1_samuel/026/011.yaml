reference: 1 Samuel 26:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/שְּׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֣יחַ יְהוָ֑ה וְ֠/עַתָּה קַח נָ֨א אֶֽת הַ/חֲנִ֜ית אֲשֶׁ֧ר מראשת/ו וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם וְ/נֵ֥לֲכָה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/011.yaml
  text: Far be it from me[a], by Yahweh, to stretch out my hand against Yahweh’s anointed. But now, please take the spear that is at his head, and the jar of water[c][b], and let us go.
translation:
  language: tl
  text: Ilayo nawa ako ni Yahweh sa pagtataas ng kamay laban sa pinahiran ni Yahweh.[a] Ngayon, kunin mo nga ang sibat na nasa tabi ng kanyang ulo at ang banga ng tubig, at umalis na tayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Malayo nawa sa akin mula kay Yahweh.” Isa itong idyoma ng mariing pagtanggi o pagkasuklam. Ang kaugnayan ng “mula kay Yahweh” ay maaaring magpahiwatig ng panawagan kay Yahweh o ng pagkasuklam sa harap niya. Ang “pinahiran ni Yahweh” ay tumutukoy rito kay Saul bilang haring pinahiran niya; kaugnay ng salitang “Mesiyas” ang salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיהוָה
  choice: Huwag nawang ipahintulot ni Yahweh
  rationale: Likas na ekspresyon sa modernong Tagalog para sa mariing pagtanggi na may taimtim na pagtukoy kay Yahweh. Inilalagay sa talababa ang mas literal at posibleng panunumpang himig ng parirala.
- source_word: מִשְּׁלֹחַ יָדִי
  choice: na pagbuhatan ko ng kamay
  rationale: Pinananatili ang Hebreong idyoma para sa marahas o mapanlabang pagkilos at likas din itong maunawaan sa Tagalog.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: ang pinahiran ni Yahweh
  rationale: Tumutukoy rito kay Saul bilang haring pinahiran, hindi tuwirang ginagamit bilang titulong Mesiyas. Pinananatili ng 'pinahiran' ang ugnayang leksikal.
- source_word: וְעַתָּה קַח נָא
  choice: Ngayon, pakikuha
  rationale: Ang 'ngayon' ay naghuhudyat ng paglipat mula sa pagtanggi tungo sa utos; ipinahahayag ng 'pakikuha' ang pinalalambot na pautos ng נָא.
- source_word: הַחֲנִית אֲשֶׁר מראשתו
  choice: ang sibat na nasa tabi ng kanyang ulo
  rationale: Malinaw at natural na paglalarawan sa kinalalagyan ng sibat habang natutulog si Saul.
- source_word: צַפַּחַת הַמַּיִם
  choice: ang sisidlan ng tubig
  rationale: Ang צַפַּחַת ay isang maliit na lalagyan o banga; 'sisidlan' ay malinaw at hindi labis na tumitiyak sa eksaktong hugis o materyal.
- source_word: וְנֵלֲכָה לָּנוּ
  choice: at umalis na tayo
  rationale: Natural na Tagalog para sa kohortatibong mungkahing lumisan; higit na angkop sa konteksto kaysa sa payak na 'pumunta tayo.'
theological_decisions:
- issue: Paglalarawan sa ugnayan ng מֵיהוָה sa idyomang חָלִילָה לִּי
  choice: Huwag nawang ipahintulot ni Yahweh
  alternative: Malayo nawa ito sa akin dahil kay Yahweh / Saksi si Yahweh
  rationale: Maaaring marinig ang parirala bilang taimtim na pagtanggi sa harap ni Yahweh o bilang panawagang tulad ng panunumpa. Ang pangunahing salin ay malinaw at likas, samantalang kinikilala ng talababa ang tunay na saklaw ng kahulugan.
- issue: Pagsasalin ng יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ginagamit ang personal na banal na pangalan ayon sa pinagmulan at sa pamantayan ng proyekto.
- issue: Pagsasalin ng מָשִׁיחַ sa kontekstong maharlika
  choice: pinahiran
  alternative: Mesiyas
  rationale: Si Saul ang tinutukoy bilang haring pinahiran ni Yahweh; iiwasan ng 'pinahiran' ang maling pagpapahiwatig na tuwirang Mesiyanikong titulo ito rito.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ngunit madaling maunawaan. Ginamit ang 'pagbuhatan ng kamay' upang mapanatili ang malinaw na Hebreong idyoma, at 'sisidlan' upang hindi labis na tiyakin ang anyo ng lalagyan.
