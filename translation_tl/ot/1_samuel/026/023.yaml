base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/023.yaml
  text: And Yahweh will repay each man for his righteousness and his faithfulness[a], because Yahweh gave you into my hand today[b], but I was not willing to stretch out my hand against Yahweh’s anointed.
translation:
  language: tl
  text: Gagantihan ni Yahweh ang bawat tao ayon sa kanyang katuwiran at katapatan,[a] sapagkat ibinigay ka ni Yahweh sa kamay ko ngayon, ngunit hindi ko ginustong iunat ang kamay ko laban sa pinahiran ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ibabalik ni Yahweh sa bawat tao ang kanyang katuwiran at katapatan.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “pinahiran ni Yahweh” dito ay tumutukoy kay Saul, ang haring pinahiran ni Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיהוָה יָשִׁיב לָאִישׁ
  choice: Gagantihan ni Yahweh ang bawat tao
  rationale: Ang Hiphil na יָשִׁיב ay tumutukoy rito sa pagbabalik bilang kabayaran o pagganti ayon sa asal. Ang “bawat tao” ay natural na modernong Tagalog para sa pangkalahatang gamit ng אִישׁ.
- source_word: אֶת צִדְקָתוֹ וְאֶת אֱמֻנָתוֹ
  choice: ayon sa kanyang katuwiran at katapatan
  rationale: Ang צְדָקָה ay moral na pagiging matuwid, at ang אֱמוּנָה ay pagiging tapat o maaasahan sa kilos. Idinagdag ang “ayon sa” upang malinaw sa Tagalog na ang mga ito ang batayan ng pagganti, nang hindi binabago ang diwa.
- source_word: אֲשֶׁר נְתָנְךָ יְהוָה הַיּוֹם בְּיָד
  choice: sapagkat ibinigay ka ni Yahweh sa kamay ko ngayon
  rationale: Ang sugnay ay nagpapaliwanag sa pagkakataong naipakita ni David ang katuwiran at katapatan. Ang “sa kamay ko” ay nagpapanatili sa larawang Hebreo ng pagkakapailalim sa kapangyarihan ng isang tao.
- source_word: וְלֹא אָבִיתִי
  choice: ngunit hindi ko ginusto
  rationale: Ang אָבָה ay nagpapahayag ng pagkukusa o pagpayag. Pinananatili ng “hindi ko ginusto” ang diin sa kusang pagpipigil ni David; ipinakikita ng “ngunit” ang pagsalungat sa pagkakataong ibinigay sa kanya.
- source_word: לִשְׁלֹחַ יָדִי
  choice: pagbuhatan ng kamay
  rationale: Ito ang natural na idyomang Tagalog para sa marahas na pagkilos laban sa isang tao at tumutugma sa larawang “iunat/ipadala ang kamay” sa Hebreo.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: ang pinahiran ni Yahweh
  rationale: Ang מָשִׁיחַ dito ay ang taong pinahiran bilang hari—si Saul—hindi tuwirang teknikal na titulong mesiyaniko.
theological_decisions:
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang tipang pangalan na YHWH; pinananatili ito bilang “Yahweh.”
- issue: Pangkalahatang gamit ng אִישׁ
  choice: bawat tao
  alternative: bawat lalaki / bawat isa
  rationale: Bagaman panlalaki ang anyong Hebreo, pangkalahatan ang maxim tungkol sa pagganti ng Diyos. Sa modernong Tagalog, “bawat tao” ang natural na katumbas nang hindi nililimitahan ang pahayag sa mga lalaking adulto.
- issue: Kahulugan ng מְשִׁיחַ para kay Saul
  choice: pinahiran ni Yahweh
  alternative: Mesiyas ni Yahweh
  rationale: Royal na pagtatalaga kay Saul ang tinutukoy. Iniiwasan ng salin ang pagpasok ng mas huling teknikal na kahulugan ng “Mesiyas” na hindi hinihingi ng konteksto.
- issue: Ugnayan ng אֲשֶׁר sa kasunod na sugnay
  choice: sapagkat
  alternative: nang / yamang
  rationale: Ipinakikita ng konteksto na ang pagkakataong mapasakamay ni David si Saul ang kalagayang naghayag ng kanyang katuwiran at katapatan. Ang “sapagkat” ay malinaw sa Tagalog, habang kinikilalang maaari ring idiin ng Hebreo ang panahong naganap ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pangalang “Yahweh,” ang larawang “sa kamay ko,” at ang idyomang “pagbuhatan ng kamay,” samantalang iniwasan ang sobrang teknikal o denominasyonal na pananalita.
