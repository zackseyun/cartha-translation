translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang bahagyang pormal na pormulang ‘Sumagot … at sinabi’ at ang direksiyonal na ‘bababa’ dahil kapansin-pansin ang mga ito sa Hebreo. Inilagay ang panandang [a] sa pariralang tinatalakay ng talababa.
