base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/006.yaml
  text: Then David answered and said to Ahimelech the Hittite and to Abishai son of Zeruiah[a], Joab’s brother, “Who will go down with me to Saul, to the camp?” And Abishai said, “I will go down with you.”
translation:
  language: tl
  text: Sumagot si David at sinabi niya kay Ahimelec na Heteo at kay Abisai, anak ni Zeruia at kapatid ni Joab, “Sino ang sasama sa akin pababa patungo kay Saul, patungo sa kampo?[a]” Sinabi ni Abisai, “Ako ang sasama sa iyo pababa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas idyomatiko: “Sino ang sasama sa akin pababa kay Saul na nasa kampo?” Sa Hebreo, inuulit ang salitang nangangahulugang “patungo/kay” bago ang “Saul” at “kampo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: Sumagot si David at sinabi
  rationale: Pinananatili ang pormulang pasalaysay na may parehong diwa ng ‘sumagot’ at ‘sinabi,’ bagaman bahagyang pormal ito sa Filipino.
- source_word: אֲחִימֶלֶךְ הַחִתִּי
  choice: Ahimelec na Heteo
  rationale: Isinalin ang pangalang pantangi ayon sa karaniwang anyong Filipino at ang katawagang etniko bilang ‘Heteo.’
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: Abisai—na anak ni Zeruia at kapatid ni Joab—
  rationale: Malinaw na pinananatili ang dalawang ugnayang pampamilya; ang mga gitling ay tumutulong upang hindi maputol ang pangunahing daloy ng pangungusap.
- source_word: מִי יֵרֵד אִתִּי
  choice: Sino ang bababang kasama ko
  rationale: Ang ‘bababa’ ay nagpapanatili sa direksiyonal na kahulugan ng ירד, at natural na ipinahahayag ng ‘kasama ko’ ang אִתִּי.
- source_word: אֶל שָׁאוּל אֶל הַמַּחֲנֶה
  choice: papunta kay Saul, sa kampo
  rationale: Pinananatili hangga't maaari ang dalawang patunguhan sa Hebreo, ngunit gumagamit ng likas na ayos sa Filipino. Ipinaliliwanag sa talababa ang pag-uulit ng אֶל.
- source_word: הַמַּחֲנֶה
  choice: kampo
  rationale: Ito ang karaniwan at madaling maunawaang katumbas ng מחנה sa modernong Filipino.
- source_word: אֲנִי אֵרֵד עִמָּךְ
  choice: Ako ang bababang kasama mo
  rationale: Pinananatili ang pag-uulit ng pandiwang ‘bababa’ mula sa tanong ni David at ang diin sa ‘Ako.’
