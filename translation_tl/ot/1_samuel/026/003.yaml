base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/003.yaml
  text: And Saul camped on the hill of Hachilah[a], which is opposite Jeshimon, by the road. But David was staying in the wilderness, and he saw that Saul had come after him into the wilderness.
translation:
  language: tl
  text: Nagkampo si Saul sa burol ng Hakila, na nasa tapat ng Jesimon[a], sa tabi ng daan. Samantala, nananatili si David sa ilang, at nakita niyang dumating si Saul sa ilang, na sumusunod sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Jesimon” ay maaari ring unawain sa pangkalahatang kahulugang “tigang na lupain” o “disyerto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַן
  choice: Nagkampo
  rationale: Likas at malinaw na katumbas ng pandiwang חנה sa konteksto ng paglalakbay o pagkilos ng hukbo.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: sa burol ng Hakila
  rationale: Isinalin ang karaniwang pangngalang גִּבְעָה bilang “burol” at isinalin-titik ang pangalang חֲכִילָה bilang “Hakila.”
- source_word: אֲשֶׁר עַל פְּנֵי הַיְשִׁימֹן
  choice: na nasa tapat ng Jesimon[a]
  rationale: Ang עַל־פְּנֵי ay nagpapahiwatig ng lokasyong nakaharap o nasa tapat; pinanatili ang Jesimon bilang pangalang heograpiko habang inilalahad sa talababa ang posibleng pangkalahatang kahulugan.
- source_word: עַל הַדָּרֶךְ
  choice: sa tabi ng daan
  rationale: Ipinapahayag nito ang pagiging malapit sa daan nang hindi ipinahihiwatig na literal na nasa ibabaw o gitna sila ng daan.
- source_word: יֹשֵׁב
  choice: nananatili
  rationale: Ang participle ng ישב ay may tuloy-tuloy na diwang pananatili o pagtira sa isang lugar; ang “nananatili” ay natural sa salaysay.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ang maikli at karaniwang salin ng מִדְבָּר at hindi ito naglilimita sa kahulugan sa mabuhanging disyerto.
- source_word: וַיַּרְא כִּי בָא שָׁאוּל אַחֲרָיו
  choice: at nakita niyang dumating doon si Saul upang habulin siya
  rationale: Pinananatili ang pandiwang “nakita” at ang pagdating ni Saul; ipinahahayag ng “upang habulin siya” ang kontekstuwal na diwa ng אַחֲרָיו bilang pagsunod na may layuning tugisin si David.
- source_word: הַמִּדְבָּרָה
  choice: doon
  rationale: Tumutukoy ang “doon” pabalik sa “sa ilang” sa naunang sugnay at naiiwasan ang mabigat na pag-uulit; saklaw ng pagdating ang direksiyonal na diwa ng hulaping ה.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa ilang” bilang natural na katawagan sa ilang na lupain, at pinanatili ang mga pangalang Hakila at Jesimon sa anyong madaling basahin sa Filipino.
