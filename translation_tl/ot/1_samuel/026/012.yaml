source:
  edition: WLC
  text: וַ/יִּקַּח֩ דָּוִ֨ד אֶֽת הַ/חֲנִ֜ית וְ/אֶת צַפַּ֤חַת הַ/מַּ֨יִם֙ מֵרַאֲשֹׁתֵ֣י שָׁא֔וּל וַ/יֵּלְכ֖וּ לָ/הֶ֑ם וְ/אֵ֣ין רֹאֶה֩ וְ/אֵ֨ין יוֹדֵ֜עַ וְ/אֵ֣ין מֵקִ֗יץ כִּ֤י כֻלָּ/ם֙ יְשֵׁנִ֔ים כִּ֚י תַּרְדֵּמַ֣ת יְהוָ֔ה נָפְלָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/012.yaml
  text: So David took the spear and the jar of water from beside Saul’s head[a], and they went away. No one saw it, and no one knew it, and no one awoke, for they were all sleeping[b], because a deep sleep from Yahweh had fallen on them.
translation:
  language: tl
  text: Kaya kinuha ni David ang sibat at ang sisidlan ng tubig mula sa tabi ng ulo ni Saul[a], at umalis sila. Walang nakakita, walang nakaalam, at walang nagising, sapagkat natutulog silang lahat, dahil bumagsak sa kanila ang isang mahimbing na tulog mula kay Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa dakong ulunan ni Saul,” ibig sabihin, mula sa lugar sa tabi ng kanyang ulo habang nakahiga siya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “ang mahimbing na tulog ni Yahweh.” Ipinahihiwatig ng parirala na ang tulog ay dumating dahil sa pagkilos ni Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲנִית
  choice: ang sibat
  rationale: Ang חֲנִית ay sibat o lance; “sibat” ang pinakanatural at karaniwang salitang Filipino sa kontekstong militar.
- source_word: צַפַּחַת הַמַּיִם
  choice: ang sisidlan ng tubig
  rationale: Ang צַפַּחַת ay isang maliit na sisidlan, banga, o prasko. Malinaw at hindi anahronistiko ang “sisidlan ng tubig,” bagaman hindi nito tinutukoy nang labis ang hugis o materyal.
- source_word: מֵרַאֲשֹׁתֵי שָׁאוּל
  choice: mula sa tabi ng ulo ni Saul
  rationale: Tumutukoy ang idyoma sa dakong ulunan ni Saul habang nakahiga siya, hindi sa isang bagay na literal na nasa ibabaw ng kanyang ulo.
- source_word: וַיֵּלְכוּ לָהֶם
  choice: at umalis sila
  rationale: Maramihan ang pandiwa at tumutukoy kina David at Abisai. Natural na ipinahahayag ng “umalis sila” ang kanilang paglayo.
- source_word: וְאֵין רֹאֶה וְאֵין יוֹדֵעַ וְאֵין מֵקִיץ
  choice: Walang nakakita, walang nakaalam, at walang nagising
  rationale: Pinananatili ang tatlong magkakatugmang negatibong pahayag at ang retorikal na pag-uulit ng Hebreo.
- source_word: כִּי כֻלָּם יְשֵׁנִים
  choice: sapagkat natutulog silang lahat
  rationale: Direkta at natural na inilalarawan nito ang kalagayan ng buong kampo.
- source_word: תַּרְדֵּמַת יְהוָה
  choice: isang mahimbing na tulog mula kay Yahweh
  rationale: Ang תַּרְדֵּמָה ay mahimbing o di-pangkaraniwang malalim na tulog. Ipinahihiwatig ng pariralang may banal na pangalan na ang tulog ay nagmula sa pagkilos ni Yahweh, habang iniiwasang ipakahulugang si Yahweh mismo ang natutulog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: נָפְלָה עֲלֵיהֶם
  choice: bumagsak sa kanila
  rationale: Pinananatili nito ang konkretong metapora ng Hebreo na ang mahimbing na tulog ay “bumagsak” sa kanila.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Ugnayan ni Yahweh sa mahimbing na tulog
  choice: isang mahimbing na tulog mula kay Yahweh ang bumagsak sa kanila
  alternative: pinatulog sila nang mahimbing ni Yahweh
  rationale: Ipinapakita ng salin na si Yahweh ang pinagmulan o sanhi, ngunit pinananatili ang anyong pangngalan at metaporang “bumagsak” sa halip na gawing tahasang pandiwang sanhi ang parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tatluhang pag-uulit na “walang” at ang metaporang “bumagsak” upang maipakita ang diin at anyo ng Hebreo, kahit bahagyang mas pampanitikan ang huling parirala.
