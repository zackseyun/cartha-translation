language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּכֵּ֤ר שָׁאוּל֙ אֶת ק֣וֹל דָּוִ֔ד וַ/יֹּ֕אמֶר הֲ/קוֹלְ/ךָ֥ זֶ֖ה בְּנִ֣/י דָוִ֑ד וַ/יֹּ֣אמֶר דָּוִ֔ד קוֹלִ֖/י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/017.yaml
  text: Then Saul recognized David’s voice and said, “Is this your voice, my son David?” And David said, “It is my voice, my lord the king.”
translation:
  language: tl
  text: At nakilala ni Saul ang tinig ni David at sinabi, “Tinig mo ba ito, anak kong David?” Sumagot si David, “Tinig ko nga po, panginoon kong hari.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: nakilala
  rationale: Ang נכר sa kontekstong ito ay tumutukoy sa pagkilala sa isang tao sa pamamagitan ng kaniyang tinig. Likas sa modernong Tagalog ang “nakilala ... ang tinig.”
- source_word: קוֹל
  choice: tinig
  rationale: Bagaman maaari ring mangahulugang “tunog,” malinaw na tinig ng nagsasalita ang tinutukoy sa pag-uusap.
- source_word: הֲקוֹלְךָ זֶה
  choice: Tinig mo ba ito
  rationale: Pinananatili nito ang tanong at ang demonstratibong “ito” ng Hebreo sa natural na ayos ng Tagalog.
- source_word: בְּנִי
  choice: anak kong
  rationale: Ang “anak kong David” ay nagpapanatili sa pampamilya at makahulugang pagtawag ni Saul kay David sa kabila ng kanilang alitan. Hindi kailangang tukuyin ang kasarian sa salitang “anak” dahil malinaw ito sa pangalang David at natural ito sa Tagalog.
- source_word: קוֹלִי
  choice: Tinig ko nga po
  rationale: Pinananatili ang literal na pokus sa “tinig” sa halip na gawing “Ako nga po ito.” Ang “nga” ay natural na nagpapatibay sa sagot, at ang “po” ay nagpapahayag ng paggalang na angkop sa kasunod na titulo.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: panginoon kong hari
  rationale: Tumutukoy ang אֲדֹנִי sa magalang na tawag sa isang taong nakatataas, hindi sa banal na pangalan. Pinananatili ng “panginoon kong hari” ang paggalang at ang titulong maharlika.
- source_word: דָּוִד / שָׁאוּל
  choice: David / Saul
  rationale: Ginamit ang mga pangalang nakasanayan sa modernong saling Tagalog.
theological_decisions:
- issue: Ang pampamilyang tawag na בְּנִי sa pananalita ni Saul
  choice: anak kong David
  alternative: anak ko, David
  rationale: 'Pinananatili ang tensiyong pasalaysay: tinatawag pa rin ni Saul si David na “anak” kahit inuusig niya ito. Ang “anak kong David” ay natural at malapit sa anyo ng Hebreo.'
- issue: Ang paggalang ni David sa אֲדֹנִי הַמֶּלֶךְ
  choice: panginoon kong hari
  alternative: mahal na hari
  rationale: Hindi inaalis ang pagkilala ni David sa katayuan ni Saul bilang hari, ngunit hindi rin ipinahihiwatig na banal ang tinutukoy na “panginoon.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “po” upang likas na maipahayag ang paggalang sa Tagalog, habang pinanatili rin ang tahasang titulong “panginoon kong hari.”
