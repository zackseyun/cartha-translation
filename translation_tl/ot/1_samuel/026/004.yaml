  text: So David sent out scouts[a], and he learned that Saul had indeed come.
translation:
  language: tl
  text: At nagsugo si David ng mga tagamanman, at nalaman niyang talagang dumating na si Saul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at nalaman niyang tiyak na dumating na si Saul.” Malamang na nagdaragdag ang huling salitang Hebreo ng diwa ng katiyakan o pagkumpirma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Likas na salin ng שׁלח sa kontekstong nagsugo si David ng mga tao para magmanman.
- source_word: מְרַגְּלִים
  choice: mga tagamanman
  rationale: Ipinahihiwatig ng salita ang mga taong nagmamanman o nagsisiyasat sa kalagayan ng kalaban; ang “mga tagamanman” ay malinaw at angkop sa kontekstong militar.
- source_word: וַיֵּדַע
  choice: natiyak niya
  rationale: Bagaman pangunahing kahulugan ng ידע ang “nalaman,” ipinakikita ng pagkakasunod matapos magsugo ng mga tagamanman na nakumpirma ni David ang ulat.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng nalaman o natiyak ni David.
- source_word: בָא
  choice: dumating na
  rationale: Inilalarawan ng perfect verb ang pagdating ni Saul bilang naganap nang pangyayari bago ito natiyak ni David.
- source_word: אֶל נָכוֹן
  choice: nga
  rationale: Malamang na idyomatikong nagpapahiwatig ang parirala ng katiyakan o pagkumpirma, sa halip na isang tiyak na lokasyon; natural itong naipahahayag sa Filipino sa pamamagitan ng “nga,” kasabay ng “natiyak.”
- source_word: דָּוִד
  choice: David
  rationale: Karaniwang anyo ng pangalang Hebreo sa Bibliyang Filipino.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Karaniwang anyo ng pangalang Hebreo sa Bibliyang Filipino.
