  source_fidelity: Tumpak na naipapahayag ng salin ang pagkilos ni David na tumawid sa kabilang panig, tumayo sa tuktok ng bundok nang malayo, at ang malaking espasyong nasa pagitan niya at ng kabilang pangkat. Ang paghahating-singaw sa ikalawang sugnay ay wastong sumasalamin sa Hebreong pahayag na “malaki ang lugar/espasyo sa pagitan nila.”
