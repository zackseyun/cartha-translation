id: 1SA.26.13
reference: 1 Samuel 26:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר דָּוִד֙ הָ/עֵ֔בֶר וַ/יַּעֲמֹ֥ד עַל רֹאשׁ הָ/הָ֖ר מֵֽ/רָחֹ֑ק רַ֥ב הַ/מָּק֖וֹם בֵּינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/013.yaml
  text: Then David crossed over to the other side and stood on the top of the mountain at a distance[a]; there was a great space between them.
translation:
  language: tl
  text: Pagkatapos, tumawid si David sa kabilang panig at tumayo sa tuktok ng bundok, sa malayo; malawak ang pagitan nila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: tumawid
  rationale: Karaniwang ipinahihiwatig ng pandiwang עבר ang pagtawid mula sa isang panig patungo sa kabila; likas at tiyak sa konteksto ang “tumawid.”
- source_word: הָעֵבֶר
  choice: sa kabilang panig
  rationale: Tumutukoy ang anyong may pantukoy sa panig sa ibayo o katapat; ang “kabilang panig” ang natural na katumbas sa modernong Tagalog.
- source_word: וַיַּעֲמֹד
  choice: tumayo
  rationale: Pinananatili nito ang payak na kahulugan ng pandiwa nang hindi dinaragdagan ng di-tiyak na diwa ng pagpoposisyon.
- source_word: עַל רֹאשׁ הָהָר
  choice: sa tuktok ng bundok
  rationale: Ang רֹאשׁ ay literal na “ulo” ngunit sa paglalarawan ng lupain ay “tuktok”; karaniwang katumbas ng הָהָר ang “bundok.”
- source_word: מֵרָחֹק
  choice: sa malayo
  rationale: Ipinahihiwatig ng parirala ang malaking pisikal na layo; maikli at natural sa Tagalog ang “sa malayo.”
- source_word: רַב הַמָּקוֹם
  choice: malawak ang pagitan
  rationale: Literal itong “malaki/malawak ang lugar o espasyo.” Sa konteksto, malinaw na inilalarawan nito ang malaking espasyong naghihiwalay sa mga panig.
- source_word: בֵּינֵיהֶם
  choice: nila
  rationale: Kasama ng “pagitan,” natural na ipinahahayag ng “nila” ang espasyong nasa pagitan ni David at ng pangkat na iniwan niya.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “malawak ang pagitan nila” upang mapanatili ang kongkretong larawan ng Hebreong רַב הַמָּקוֹם בֵּינֵיהֶם nang hindi nagdaragdag ng paliwanag.
