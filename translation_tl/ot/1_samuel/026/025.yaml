base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/025.yaml
  text: Then Saul said to David[a], “Blessed are you, my son David. You will surely do, and you will surely prevail.” Then David went on his way, and Saul returned to his place.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Saul kay David, “Pinagpala ka, anak kong David! Talagang gagawa ka, at talagang magtatagumpay ka.”[a] Pagkatapos, nagpatuloy si David sa kanyang lakad, at bumalik naman si Saul sa kanyang lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa paggawa ay gagawa ka, at sa pagiging may kakayahan ay makakaya mo.” Dalawang infinitive absolute na konstruksyon ang ginamit upang idiin ang katiyakan ng gagawin at pagtatagumpay ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ אַתָּה
  choice: Pinagpala ka
  rationale: Pinananatili nito ang anyong pasalaysay ng Hebreong pormula ng pagpapala, sa halip na gawin itong kahilingang “Pagpalain ka.”
- source_word: בְּנִי דָוִד
  choice: anak kong David
  rationale: Likas na Filipino ito para sa mapagkalinga o patronal na pagtawag ni Saul kay David, habang pinananatili ang pangalang kasunod ng “anak ko.”
- source_word: גַּם עָשֹׂה תַעֲשֶׂה
  choice: Tiyak na kikilos ka
  rationale: Ang inuulit na anyo ng pandiwa sa Hebreo ay nagbibigay-diin sa katiyakan. Ang “kikilos” ay nagpapanatili sa malawak at walang tahasang layon na diwa ng עשה nang hindi idinaragdag ang “mga dakilang bagay,” na wala sa teksto.
- source_word: וְגַם יָכֹל תּוּכָל
  choice: at tiyak na magtatagumpay ka
  rationale: Ipinahahayag nito ang idyomatikong diwa ng kakayahang manaig o magtagumpay, at pinananatili ng “tiyak” ang diin ng infinitive absolute at imperfect.
- source_word: וַיֵּלֶךְ דָּוִד לְדַרְכּוֹ
  choice: nagpatuloy si David sa kanyang lakad
  rationale: Natural na katumbas ito ng idyomang Hebreo para sa pag-alis at pagpapatuloy sa sariling daan.
- source_word: וְשָׁאוּל שָׁב לִמְקוֹמוֹ
  choice: bumalik naman si Saul sa kanyang lugar
  rationale: Pinananatili ang di-tiyak na “kanyang lugar” at hindi ipinapalagay na bahay ang tinutukoy; ipinakikita ng “naman” ang magkaibang direksiyon ng dalawang tauhan.
