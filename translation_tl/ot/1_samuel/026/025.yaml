  to: Pagkatapos, sinabi ni Saul kay David, “Pinagpala ka, anak kong David! Talagang gagawa ka, at talagang magtatagumpay ka.”[a] Pagkatapos, nagpatuloy si David sa kanyang lakad, at bumalik naman si Saul sa kanyang lugar.
