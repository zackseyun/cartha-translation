  naturalness: Marangal at madaling maunawaan ang Filipino. Ang “Talagang gagawa ka” ay isang bahagyang pampanitikang ngunit likas na paraan upang ipakita ang mariing Hebreong anyo nang hindi nagdadagdag ng layon.
  terminology: Wasto at angkop ang mga pangalan at mga pangunahing salita. Ang “Pinagpala ka” ay nagpapanatili sa pahayag na anyo ng pagpapala; hindi ito ginagawang kahilingan. Nananatiling di-tiyak ang “kanyang lugar.”
