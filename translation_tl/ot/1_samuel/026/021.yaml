base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/021.yaml
  text: Then Saul said[a], “I have sinned. Return, my son David, for I will not harm you again, because my life was precious in your eyes this day. Look[b], I have acted foolishly and have gone badly astray.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Saul, “Nagkasala ako. Bumalik ka, anak kong David. Hindi na kita sasaktan, sapagkat naging mahalaga sa paningin mo ang buhay ko[a] sa araw na ito. Tingnan mo, kumilos ako nang hangal at lubha akong naligaw.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “naging mahalaga sa paningin mo ang kaluluwa ko” o “ang sarili ko.” Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa buhay o pagkatao ni Saul.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nagkamali ako nang napakalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Nagkasala ako
  rationale: Tuwirang isinasalin ang Qal perfect na pagtatapat ni Saul sa natural na aspektong Tagalog.
- source_word: שׁוּב בְּנִי דָוִד
  choice: Bumalik ka, anak kong David
  rationale: Pinananatili ang pautos na “bumalik” at ang magiliw na pantawag ni Saul kay David.
- source_word: לֹא אָרַע לְךָ עוֹד
  choice: Hindi na kita sasaktan
  rationale: Sa konteksto, ang Hiphil ng רעע ay paggawa ng masama o pinsala sa isang tao; malinaw at natural sa modernong Tagalog ang “sasaktan.”
- source_word: תַּחַת אֲשֶׁר
  choice: sapagkat
  rationale: Ipinahahayag rito ng parirala ang dahilan ng pangako ni Saul.
- source_word: יָקְרָה נַפְשִׁי בְּעֵינֶיךָ
  choice: naging mahalaga sa paningin mo ang buhay ko
  rationale: Ang נֶפֶשׁ ay tumutukoy sa buhay o sarili ni Saul na hindi pinaslang ni David; pinananatili rin ng “sa paningin mo” ang idyomang Hebreo.
- source_word: הַיּוֹם הַזֶּה
  choice: sa araw na ito
  rationale: Tumpak at marangal na katumbas ng tiyak na pariralang temporal sa Hebreo.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Ginagamit bilang panandang pantawag-pansin bago ang pangwakas na pag-amin ni Saul.
- source_word: הִסְכַּלְתִּי
  choice: kumilos ako nang hangal
  rationale: Ipinakikita ng anyong pandiwa ang hangal na pagkilos, hindi lamang kakulangan sa talino.
- source_word: וָאֶשְׁגֶּה הַרְבֵּה מְאֹד
  choice: at lubha akong naligaw
  rationale: Pinananatili ng “naligaw” ang metaporikal na diwa ng שגה, habang ipinahahayag ng “lubha” ang matinding pagpapalakas ng הַרְבֵּה מְאֹד.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa pag-amin ni Saul
  choice: buhay ko
  alternative: kaluluwa ko; sarili ko
  rationale: Sa salaysay, iniligtas ni David ang pisikal na buhay ni Saul. Hindi kinakailangang magpahayag ang talata ng isang tiyak na doktrina tungkol sa kaluluwa, kaya “buhay” ang pinakamalinaw na katumbas sa konteksto.
- issue: Lakas at larawan ng pag-amin na וָאֶשְׁגֶּה הַרְבֵּה מְאֹד
  choice: lubha akong naligaw
  alternative: nagkamali ako nang napakalaki
  rationale: Pinananatili ang posibilidad na ang salita ay higit sa isang karaniwang pagkakamali—isang malubhang pagkaligaw sa asal—nang hindi dinaragdagan ang teolohikal na bigat nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sapagkat” upang mapanatili ang taimtim na himig, habang iniwasan ang mga salitang lipas o labis na teknikal. Inilagay ang bawat talababa sa mismong pariralang tinutukoy nito.
