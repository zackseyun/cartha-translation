  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ הַ/זִּפִים֙ אֶל שָׁא֔וּל הַ/גִּבְעָ֖תָ/ה לֵ/אמֹ֑ר הֲ/ל֨וֹא דָוִ֤ד מִסְתַּתֵּר֙ בְּ/גִבְעַ֣ת הַ/חֲכִילָ֔ה עַ֖ל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/001.yaml
  text: Then the Ziphites came to Saul at Gibeah[a], saying, “Is not David hiding on the hill of Hachilah, which is before the wasteland?”
translation:
  language: tl
  text: Pagkatapos, pumunta ang mga taga-Zif kay Saul sa Gibea at sinabi, “Hindi ba nagtatago si David sa burol ng Hakila, sa tapat ng ilang[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa tapat ng Jesimon.” Ang salitang Hebreo ay maaaring tumukoy sa isang tigang na ilang o maging pangalang pantangi ng rehiyong Jesimon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Pagkatapos, pumunta
  rationale: Isinusulong ng wayyiqtol ang salaysay. Likas sa modernong Tagalog ang “Pagkatapos,” bilang panandang pasalaysay, at pinananatili ng “pumunta” ang payak na diwa ng pandiwang בוא.
- source_word: הַזִּפִים
  choice: ang mga taga-Zif
  rationale: Tumutukoy ang pangmaramihang gentiliko sa mga naninirahan sa Zif. Mas malinaw at natural sa Tagalog ang “mga taga-Zif” kaysa sa isang inangkop na katawagang etniko.
- source_word: הַגִּבְעָתָה
  choice: sa Gibea
  rationale: Ipinahihiwatig ng directional he ang pagpunta sa Gibea. Sa pariralang “pumunta ... kay Saul sa Gibea,” malinaw na naroon si Saul at napapanatili ang heograpikong tagpuan.
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Ipinakikilala ng infinitive construct ang tuwirang pananalita. Ang “at sinabi” ay mas natural sa kasalukuyang Tagalog kaysa sa literal na “na nagsasabi.”
- source_word: הֲלוֹא
  choice: Hindi ba
  rationale: Naghaharap ang particle ng retorikal na tanong na umaasang sasang-ayon ang kausap. Eksaktong likas na katumbas nito sa Tagalog ang “Hindi ba.”
- source_word: מִסְתַּתֵּר
  choice: nagtatago
  rationale: Ang hitpael participle ng סתר ay nagpapahayag na pinananatiling nakatago ng paksa ang sarili niya. Malinaw at natural itong ipinahahayag ng “nagtatago.”
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: sa burol ng Hakila
  rationale: Karaniwang nangangahulugang “burol” ang גבעה. Ang “sa burol ng Hakila” ay tapat sa topograpiya at natural sa Tagalog.
- source_word: עַל פְּנֵי הַיְשִׁימֹן
  choice: sa tapat ng ilang
  rationale: Maaaring mangahulugan ang heograpikong idyomang עַל־פְּנֵי ng “sa harap ng” o “sa tapat ng.” Pinananatili ng “sa tapat ng” ang ugnayang panglugar nang hindi ipinapasok ang mas tiyak ngunit interpretibong direksiyong “silangan.” Maaaring unawain ang הַיְשִׁימֹן bilang karaniwang pangngalang tumutukoy sa tigang na ilang o bilang pangalang Jesimon; pinananatili sa talababa ang ikalawang posibilidad.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal ang rehistro. Ginamit ang karaniwang hulma na “mga taga-Zif,” ang natural na retorikal na “Hindi ba,” at ang heograpikong “sa tapat ng” upang mapanatili ang tunay na kalabuan ng Hebreo.
