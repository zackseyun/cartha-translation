  source_fidelity: 'Tapat ang salin sa Hebreo: naipapakita ang pagsulong ng salaysay, ang mga taga-Zif bilang pangmaramihang gentiliko, ang retorikal na tanong, ang patuloy na pagkakatago ni David, at ang lokasyong Burol ng Hakila. Ang “sa tapat ng ilang” ay maingat na pinananatili ang hindi ganap na tiyak na heograpikong ugnayan ng עַל־פְּנֵי nang hindi nagdaragdag ng interpretibong direksiyong gaya ng “silangan.”'
