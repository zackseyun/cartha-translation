base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/015.yaml
  text: David said to Abner[b][a], “Are you not a man? And who is like you in Israel? Why then have you not kept watch over your lord the king? For one of the people came to destroy the king your lord.”
translation:
  language: tl
  text: Sinabi ni David kay Abner, “Hindi ba’t isa kang lalaki? At sino ang gaya mo sa Israel?[a] Kung gayon, bakit hindi mo binantayan ang panginoon mong hari? Sapagkat may isang tao sa mga tao[b] na dumating upang ipahamak ang hari na iyong panginoon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At sino ang kapantay mo sa Israel?”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “isa sa mga tao.” Sa konteksto, tumutukoy ito sa isang tao mula sa kampo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִישׁ אַתָּה
  choice: Hindi ba’t isa kang lalaki?
  rationale: Pinananatili ang literal na ‘lalaki’ at ang retorikal na tanong na ginagamit ni David upang hiyain si Abner, nang hindi nagdaragdag ng ‘matapang’ na wala sa Hebreo.
- source_word: וּמִי כָמוֹךָ בְּיִשְׂרָאֵל
  choice: At sino ang gaya mo sa Israel?
  rationale: Tuwirang pinananatili ang paghahambing na כָמוֹךָ (‘gaya mo’), pati ang pahiwatig na walang kapantay si Abner.
- source_word: וְלָמָּה לֹא שָׁמַרְתָּ אֶל
  choice: Kung gayon, bakit hindi mo binantayan
  rationale: Ang ‘binantayan’ ay natural na Filipino para sa mapag-ingat na pagbabantay at pagprotekta sa kontekstong militar; ipinahahayag ng ‘kung gayon’ ang ugnayang argumento ng וְ.
- source_word: אֲדֹנֶיךָ הַמֶּלֶךְ
  choice: ang panginoon mong hari
  rationale: Pinananatili ang relasyong nakatataas-na-nasasakupan ng אֲדֹנֶיךָ at ang pagkakakilanlan niyang hari.
- source_word: כִּי בָא אַחַד הָעָם
  choice: Sapagkat may isang mula sa mga tauhan na pumasok
  rationale: Ang ‘isang mula sa mga tauhan’ ay likas sa Filipino at hindi labis na nagtutukoy kung sundalo o karaniwang tao; ang ‘pumasok’ ay inilalapat sa konteksto ng pagpasok sa kampo.
- source_word: לְהַשְׁחִית
  choice: upang patayin
  rationale: Bagaman maaaring mangahulugang ‘wasakin’ ang Hiphil ng שׁחת, malinaw sa konteksto na ang nilalayong kapahamakan sa hari ay pagkitil sa kanyang buhay; mas natural at tiyak dito ang ‘patayin.’
- source_word: הַמֶּלֶךְ אֲדֹנֶיךָ
  choice: ang hari na iyong panginoon
  rationale: Pinananatili ang baligtad na ayos at pag-uulit ng katawagan sa Hebreo upang idiin ang pananagutan ni Abner.
