  to: Sinabi ni David kay Abner, “Hindi ba’t isa kang lalaki? At sino ang gaya mo sa Israel?[a] Kung gayon, bakit hindi mo binantayan ang panginoon mong hari? Sapagkat may isang tao sa mga tao[b] na dumating upang ipahamak ang hari na iyong panginoon.”
