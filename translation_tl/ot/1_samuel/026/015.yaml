  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang matalim na retorika ni David at ang pag-uulit ng pagtukoy sa hari bilang panginoon ni Abner. Ginamit ang maliit na titik sa ‘panginoon’ dahil tumutukoy ito sa taong hari na si Saul, hindi bilang banal na titulo.
