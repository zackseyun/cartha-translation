  source_fidelity: Ang “mga tauhan” ay mas makitid kaysa sa Hebreong אַחַד הָעָם (“isa sa mga tao/bayan”), at ang “pumasok” ay nagdaragdag ng kilos na wala sa talata. Ang “patayin” ay posible bilang kontekstuwal na implikasyon, ngunit ang לְהַשְׁחִית ay mas malawak na “ipahamak/puksain”; dapat panatilihin ang saklaw nito.
  naturalness: Marangal at malinaw ang pangkalahatang rehistro. Mas natural at tapat ang “isa sa mga tao” kaysa “isang mula sa mga tauhan,” at ang pag-aalis sa “pumasok” ay nagpapasimple nang hindi nawawala ang diwa.
  terminology: Ang “panginoon mong hari” at “ang hari na iyong panginoon” ay angkop na panumbas sa paulit-ulit na pantawag kay Saul. Ang maliit na titik sa “panginoon” ay tama.
