base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/007.yaml
  text: When the men of Israel who were on the other side of the valley[a], and those on the other side of the Jordan, saw that the men of Israel had fled and that Saul and his sons were dead, they abandoned the cities and fled[b]; and the Philistines came and lived in them.
translation:
  language: tl
  text: Nang makita ng mga lalaki ng Israel na nasa kabilang panig ng libis[a], at ng mga lalaki ng Israel na nasa kabilang panig ng Jordan, na tumakas ang mga lalaki ng Israel at patay na sina Saul at ang kanyang mga anak, iniwan nila ang mga lungsod at tumakas. Dumating ang mga Filisteo at nanirahan sa mga iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ibayo ng libis.” Gayundin sa kasunod na pariralang “sa kabilang panig ng Jordan.” Ang ekspresyong Hebreo ay tumutukoy sa panig sa kabila mula sa pananaw ng tagapagsalaysay.
    reason: lexical_alternative
  - marker: b
    text: O “tumira sa mga iyon” o “nanahan sa mga iyon.” Ang pandiwang Hebreo ay maaaring mangahulugang tumira, manirahan, o manahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Nang makita
  rationale: Pinananatili ang konkretong diwa ng ראה na “makita,” habang natural na ipinakikita sa Tagalog ang ugnayang temporal ng mga pangyayari.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: mga lalaki ng Israel
  rationale: Tapat sa tahasang panlalaking anyo ng Hebrew at angkop sa kontekstong militar, bagaman maaaring kabilang dito ang mga lalaking naninirahan sa mga apektadong lugar.
- source_word: בְּעֵבֶר הָעֵמֶק
  choice: nasa kabilang panig ng libis
  rationale: Inihahayag ang puwestong nasa ibayo o kabilang panig nang hindi nagpapasya kung aling heograpikong panig ang tinutukoy.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: nasa kabilang panig ng Jordan
  rationale: Pinananatili ang pag-uulit ng parehong ekspresyong pangheograpiya at ang relatibong pananaw ng עֵבֶר.
- source_word: כִּי נָסוּ
  choice: na tumakas
  rationale: Natural sa Tagalog bilang nilalaman ng kanilang nakita; hindi kailangang markahan nang hiwalay ang past perfect upang maging malinaw ang pagkakasunod.
- source_word: מֵתוּ
  choice: patay na
  rationale: Ipinapahayag ang resultang kalagayan ng kamatayan nang hindi idinaragdag na sila ay pinatay, na hindi tahasang sinasabi ng pandiwa rito.
- source_word: וַיַּעַזְבוּ אֶת־הֶעָרִים
  choice: iniwan nila ang mga lungsod
  rationale: Natural at malinaw na salin ng pag-iwan sa mga pamayanan; ang konteksto ng pagtakas ay nagpapahiwatig ng pag-abandona nang hindi kinakailangang gumamit ng mas mabigat na salita.
- source_word: וַיָּנֻסוּ
  choice: at tumakas
  rationale: Direktang katumbas ng karaniwang pandiwa para sa pagtakas at pinananatili ang mabilis na daloy ng salaysay.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: Dumating naman ang mga Filisteo
  rationale: Ang “dumating” ay tumutugma sa malawak na kahulugan ng בוא; ang “naman” ay likas na nagmamarka ng paglipat sa kilos ng mga Filisteo nang hindi nagdaragdag ng teolohikal na pakahulugan.
- source_word: וַיֵּשְׁבוּ בָּהֶן
  choice: nanirahan sa mga iyon
  rationale: Ang ישב ay maaaring mangahulugang manirahan o tumira; malinaw ang reperensiya sa mga lungsod, at inilalagak sa talababa ang posibleng diwa ng pananakop o permanenteng paninirahan.
