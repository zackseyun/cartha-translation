base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/008.yaml
  text: The next day[a], the Philistines came to strip the slain, and they found Saul and his three sons fallen on Mount Gilboa.
translation:
  language: tl
  text: Kinabukasan, dumating ang mga Filisteo upang hubaran ang mga napatay[a]. Natagpuan nila si Saul at ang tatlo niyang anak na lalaki na nakahandusay sa Bundok Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “samsaman ang mga napatay.” Ang pandiwang Hebreo ay tumutukoy sa pag-aalis ng damit o baluti sa mga nasawi sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Kinabukasan
  rationale: Likas at maikli itong katumbas ng Hebreong idyoma para sa araw na kasunod ng labanang isinalaysay.
- source_word: לְפַשֵּׁט
  choice: upang hubaran
  rationale: Sa konteksto ng labanan, tumutukoy ang pandiwa sa pag-aalis ng damit o baluti sa mga napatay; pinananatili ng “hubaran” ang tiyak at kongkretong larawan.
- source_word: הַחֲלָלִים
  choice: ang mga napatay
  rationale: Malinaw na tumutukoy ito sa mga nasawi sa labanan at higit na natural sa modernong Tagalog kaysa sa mas makalumang “mga nangapatay.”
- source_word: וַיִּמְצְאוּ
  choice: Natagpuan nila
  rationale: Tuwirang inilalahad nito ang kasunod na pangyayari sa salaysay, gaya ng payak na Hebreong pandiwa.
- source_word: נֹפְלִים
  choice: nakahandusay
  rationale: Pinananatili nito ang larawan ng mga “nakabuwal” o “fallen” sa larangan nang hindi pinapalitan ang participle ng tahasang “patay.”
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: sa Bundok Gilboa
  rationale: Karaniwan at natural na anyo sa Tagalog para sa pangalan ng lugar.
- source_word: שְׁלֹשֶׁת בָּנָיו
  choice: ang tatlo niyang anak
  rationale: Natural na ayos sa modernong Tagalog at malinaw na pinananatili ang bilang at ugnayang pampamilya.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “nakahandusay” upang mapanatili ang kongkretong larawan ng Hebreong “fallen,” at inilagay ang talababa sa “mga napatay,” kung saan nauugnay ang paliwanag tungkol sa paghuhubad o pananamsam.
