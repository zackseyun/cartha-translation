    rationale: Bagaman nauunawaan, ang “mga ito” ay karaniwang panturo sa mga bagay na malapit at hindi likas na pantukoy sa mga taong pinagmulan ng mga buto. Ang “kanilang mga buto” ay mas idiomatiko at ang tinutukoy ay malinaw mula sa konteksto.
