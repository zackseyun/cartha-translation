  yaml_path: translation/ot/1_samuel/031/013.yaml
  text: They took their bones and buried them under the tamarisk tree in Jabesh[b][a], and they fasted seven days.
translation:
  language: tl
  text: Kinuha nila ang kanilang mga buto at inilibing ang mga ito sa ilalim ng puno ng tamarisko[a] sa Jabes[b], at nag-ayuno sila nang pitong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang tamarisko”; tiyak na uri ng puno ang tinutukoy sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang “Jabes” dito ay pinaikling tawag sa Jabes-Gilead na binanggit sa naunang konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Kinuha nila
  rationale: Tuwirang isinasalin ang לקח bilang “kumuha”; natural sa salaysay ang aspektong naganap.
- source_word: עַצְמֹתֵיהֶם
  choice: ang mga buto ng mga ito
  rationale: Ang עֶצֶם ay literal na “buto.” Pinananatili ang kongkretong diwa dahil sinunog na ang mga bangkay sa naunang talata.
- source_word: וַיִּקְבְּרוּ
  choice: at inilibing
  rationale: Karaniwang pandiwa ang קבר para sa paglilibing; payak at natural ang “inilibing.”
- source_word: תַחַת
  choice: sa ilalim ng
  rationale: Karaniwan at malinaw na katumbas ng “under/beneath” sa Filipino.
- source_word: הָאֶשֶׁל
  choice: puno ng tamarisko
  rationale: Tiyak na uri ng puno ang אֶשֶׁל. Idinagdag ang “puno” upang agad maging malinaw ang di-kilalang katawagang “tamarisko.”
- source_word: בְּיָבֵשָׁה
  choice: sa Jabes
  rationale: Pangalan ito ng lugar; sa konteksto, pinaikling tawag sa Jabes-Gilead.
- source_word: וַיָּצֻמוּ
  choice: nag-ayuno sila
  rationale: Tuwirang katumbas ng צום at natural na pandiwang Filipino.
- source_word: שִׁבְעַת יָמִים
  choice: nang pitong araw
  rationale: Tuwirang ipinapahayag ang tagal ng pag-aayuno.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “mga buto” sa halip na mas malawak na “mga labi” upang mapanatili ang kongkretong salita ng Hebreo. Ang “mga ito” ay umiiwas sa posibleng kalituhan ng “kanilang mga buto,” yamang nagbabago ang tinutukoy na pangkat sa konteksto. Pinaghiwalay sa dalawang pangungusap para sa natural na daloy sa Filipino; ang “Pagkatapos” ay nagpapahayag ng sunod-sunod na kilos ng salaysay.
