  source_fidelity: 'Tumpak na naipapahayag ng draft ang mga pangunahing elemento ng Hebreo: kinuha ang literal na mga buto, inilibing ang mga ito sa ilalim ng tamarisko sa Jabes, at nag-ayuno nang pitong araw. Gayunman, ang “mga buto ng mga ito” ay hindi natural na pantukoy sa Filipino para sa mga taong tinutukoy ng naunang konteksto.'
  naturalness: Mas natural at malinaw sa modernong Filipino ang “ang kanilang mga buto ... inilibing ang mga ito.” Pinananatili nito ang panghalip na maramihan ng Hebreo nang walang di-likas na deiktikong “mga ito” bilang pantukoy sa mga tao.
  terminology: Ang “mga buto,” “inilibing,” “puno ng tamarisko,” at “nag-ayuno” ay angkop at tapat sa mga salitang Hebreo. Inilagay ang bawat talababa sa mismong salitang tinutukoy nito.
