- from: Kinuha nila ang mga buto ng mga ito at inilibing sa ilalim ng puno ng tamarisko sa Jabes[b][a]. Pagkatapos, nag-ayuno sila nang pitong araw.
  to: Kinuha nila ang kanilang mga buto at inilibing ang mga ito sa ilalim ng puno ng tamarisko[a] sa Jabes[b], at nag-ayuno sila nang pitong araw.
  rationale: Pinalitan ang di-natural na “mga buto ng mga ito” ng “kanilang mga buto,” at ginawang hayag ang ipinahiwatig na layon ng “inilibing.” Inayos din ang mga angkla ng talababa upang tumukoy ang bawat isa sa wastong salita. Hindi binago ang kahulugan, pagkakasunod ng salaysay, o ang kongkretong “mga buto” ng Hebreo.
