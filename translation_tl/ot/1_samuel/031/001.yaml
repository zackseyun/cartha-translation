base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/001.yaml
  text: The Philistines were fighting against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: tl
  text: Nakikipaglaban ang mga Filisteo sa Israel, at tumakas ang mga lalaki ng Israel mula sa mga Filisteo[a] at nabuwal na patay sa Bundok Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa harap ng mga Filisteo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: ang mga Filisteo
  rationale: Ginamit ang karaniwang pangalang Filipino para sa bayan; hindi na isinalin nang hiwalay ang panimulang ו dahil likas nang naipahihiwatig ng daloy ng salaysay ang kaugnayan sa naunang pangyayari.
- source_word: נִלְחָמִים בְּ/יִשְׂרָאֵל
  choice: Nakikipaglaban ... sa Israel
  rationale: Ang anyong participle ay nagpapakita ng nagpapatuloy na labanan; ang aspektong di-ganap ng “nakikipaglaban” angkop dito. Sa ganitong gamit ng לָחַם, ang בְּ ay nagsasaad ng kalaban.
- source_word: וַ/יָּנֻסוּ
  choice: tumakas
  rationale: Direkta at natural na katumbas ng pandiwang tumutukoy sa pagtakas mula sa labanan.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: ang mga lalaki ng Israel
  rationale: Pinananatili ang tahasang panlalaking katawagan ng Hebreo sa halip na gawing pangkalahatang “mga Israelita.”
- source_word: מִ/פְּנֵי פְלִשְׁתִּים
  choice: mula sa mga Filisteo
  rationale: Natural na Filipino para sa Hebreong idyomang literal na “mula sa harap/presensiya ng mga Filisteo”; inilagay sa talababa ang mas literal na anyo.
- source_word: וַ/יִּפְּלוּ חֲלָלִים
  choice: nabuwal silang patay
  rationale: Pinananatili ang larawan ng pagbagsak sa labanan at ang kahulugan ng חֲלָלִים bilang mga napatay, nang hindi ginagawang payak lamang na “namatay.”
- source_word: בְּ/הַר הַ/גִּלְבֹּעַ
  choice: sa Bundok Gilboa
  rationale: Ito ang natural na anyo sa Filipino para sa lokasyon sa bundok na may pangalang pantangi.
