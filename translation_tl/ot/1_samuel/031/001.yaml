translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang aspektong nagpapatuloy sa unang sugnay, ang panlalaking katawagan sa mga Israelita, at ang matingkad na larawang militar ng kanilang pagkabuwal.
