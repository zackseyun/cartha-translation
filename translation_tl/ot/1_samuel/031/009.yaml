  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יִּכְרְתוּ֙ אֶת רֹאשׁ֔/וֹ וַ/יַּפְשִׁ֖יטוּ אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְּלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר בֵּ֥ית עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/009.yaml
  text: They cut off his head and stripped off his armor[a], and sent messengers throughout the land of the Philistines all around[b], to proclaim the good news to the house of their idols and to the people.
translation:
  language: tl
  text: Pinugutan nila siya at hinubaran ng kaniyang mga kagamitang pandigma.[a] Pagkatapos, nagpadala sila ng mga sugo[b] sa lahat ng dako sa lupain ng mga Filisteo upang ipahayag ang magandang balita sa templo ng kanilang mga diyus-diyosan at sa mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaniyang baluti” o “kaniyang mga sandata.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “nagpadala sila”; hindi tahasang binanggit kung ano o sino ang ipinadala.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיִּכְרְתוּ אֶת־רֹאשׁוֹ
  choice: Pinugutan nila siya
  rationale: Likas at tuwirang paraan sa modernong Tagalog upang sabihin na pinutol nila ang ulo ni Saul.
- source_word: וַיַּפְשִׁיטוּ אֶת־כֵּלָיו
  choice: hinubaran ng kaniyang mga kagamitang pandigma
  rationale: Ipinapahayag ng pandiwa ang pag-aalis o paghuhubad, samantalang malawak ang כֵּלִים at maaaring tumukoy sa baluti, sandata, o iba pang kagamitang pandigma.
- source_word: וַיְשַׁלְּחוּ
  choice: nagpadala sila ng mga sugo
  rationale: Walang tahasang layon ang pandiwang Hebreo, ngunit ipinahihiwatig ng kasunod na pagpapahayag sa buong lupain na may mga isinugong tagapagbalita. Nililinaw ito sa pangunahing teksto at itinatala sa talababa ang pagiging di-tiyak ng layon.
- source_word: בְאֶרֶץ פְּלִשְׁתִּים סָבִיב
  choice: sa lahat ng dako sa lupain ng mga Filisteo
  rationale: Natural na ipinahahayag nito sa Tagalog ang malawak at paikot na saklaw ng סָבִיב sa teritoryo ng mga Filisteo.
- source_word: לְבַשֵּׂר
  choice: upang ipahayag ang magandang balita
  rationale: Ang Piel ng בשר ay tumutukoy sa paghahatid o pagpapahayag ng mabuti o masayang balita; sa konteksto, ito ang balita ng tagumpay mula sa pananaw ng mga Filisteo.
- source_word: בֵּית עֲצַבֵּיהֶם
  choice: sa templo ng kanilang mga diyus-diyosan
  rationale: Bagaman literal na 'bahay,' karaniwang tumutukoy ang בֵּית sa isang banal na gusali sa ganitong kontekstong kultiko; ang עֲצַבִּים ay mga imahen o diyus-diyosan.
- source_word: וְאֶת הָעָם
  choice: at sa mga tao
  rationale: 'Ang tahasang pananda ng layon ay inuugnay sa kilos ng pagpapahayag: ang balita ay ipinahayag kapuwa sa kultikong lugar at sa bayan.'
theological_decisions:
- issue: Paglalarawan sa kultikong lugar at mga sinasamba ng mga Filisteo
  choice: templo ng kanilang mga diyus-diyosan
  alternative: bahay ng kanilang mga imahen
  rationale: Malinaw at likas sa modernong Tagalog ang 'templo' para sa kultikong gamit ng בֵּית, at ang 'mga diyus-diyosan' ay tumpak na nagsasaad sa עֲצַבִּים nang hindi kinikilalang tunay ang mga diyos na iyon.
- issue: Kahulugan ng 'magandang balita' sa konteksto
  choice: pinanatili bilang magandang balita mula sa pananaw ng mga Filisteo
  alternative: balita ng tagumpay
  rationale: Pinananatili nito ang semantikong puwersa ng לְבַשֵּׂר nang hindi nagdaragdag sa teksto ng tahasang salitang 'tagumpay'.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “kaniyang” para sa pormal ngunit kasalukuyang biblikal na himig; iniwasan ang sobrang literal na ayos na magiging alanganin sa Tagalog.
