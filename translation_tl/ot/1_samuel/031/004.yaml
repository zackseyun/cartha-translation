revisions:
- from: Sinabi ni Saul sa tagapagdala ng kanyang mga sandata, “Hugutin mo ang iyong espada at saksakin mo ako nito, kung hindi ay baka dumating ang mga di-tuling ito, saksakin ako, at pagmalupitan ako.[a]” Ngunit ayaw gawin iyon ng tagapagdala ng kanyang mga sandata, sapagkat takot na takot siya. Kaya kinuha ni Saul ang espada at bumagsak sa ibabaw nito.
  to: Sinabi ni Saul sa tagapagdala ng kanyang mga sandata, “Hugutin mo ang iyong espada at tuhugin mo ako nito, baka dumating ang mga di-tuling ito, tuhugin ako, at pagmalupitan ako.[a]” Ngunit tumanggi ang tagapagdala ng kanyang mga sandata, sapagkat takot na takot siya. Kaya kinuha ni Saul ang espada at bumagsak sa espada.
  rationale: Inayos ang mga pariralang hindi gaanong likas sa modernong Filipino nang hindi binabago ang kahulugan. Pinanatili ang mapanlait na “mga di-tuli,” ang pag-uulit ng pandiwang tumutugma sa דקר, at ang kalabuan ng kinatatakutang pagtrato. Hindi pinalawak ang payak na paglalarawan sa ginawa ni Saul sa espada.
