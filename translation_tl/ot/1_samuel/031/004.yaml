  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ לְ/נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָ֠בוֹאוּ הָ/עֲרֵלִ֨ים הָ/אֵ֤לֶּה וּ/דְקָרֻ֨/נִי֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and thrust me through and mistreat me.” But his armor-bearer was not willing, because he was very afraid. So Saul took the sword and fell on it.
translation:
  language: tl
  text: Sinabi ni Saul sa tagapagdala ng kanyang mga sandata, “Hugutin mo ang iyong espada at tuhugin mo ako nito, baka dumating ang mga di-tuling ito, tuhugin ako, at pagmalupitan ako.[a]” Ngunit tumanggi ang tagapagdala ng kanyang mga sandata, sapagkat takot na takot siya. Kaya kinuha ni Saul ang espada at bumagsak sa espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paglaruan ako,” “hamakin ako,” o “tratuhin ako nang kahiya-hiya.”
    reason: Pinananatili ang malawak at hindi tiyak na saklaw ng וְהִתְעַלְּלוּ בִי, na maaaring tumukoy sa mapang-abuso, mapanghamak, o kahiya-hiyang pagtrato.
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: tagapagdala ng kanyang mga sandata
  rationale: Tumutukoy ito sa isang lingkod-militar na nagdadala ng mga sandata at kagamitan ng mandirigma. Ang paglalarawan ay malinaw at likas sa modernong Filipino nang hindi ipinapalagay na baluti lamang ang dala niya.
- source_word: שְׁלֹף
  choice: Hugutin
  rationale: Ang pautos ay tumutukoy sa paghugot ng espada mula sa kaluban; maikli at natural ang “hugutin” sa kontekstong militar.
- source_word: וְדָקְרֵנִי בָהּ / וּדְקָרֻנִי
  choice: saksakin mo ako nito / saksakin ako
  rationale: Ang דקר ay pagtagos o pagsaksak gamit ang sandata. Pinanatili ang pag-uulit ng pandiwa sa dalawang sugnay ng sinabi ni Saul.
- source_word: פֶּן
  choice: kung hindi ay baka
  rationale: Ipinapahayag nito ang kinalalabasang kinatatakutan at nais iwasan ni Saul; natural itong babala sa Filipino.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: mga di-tuling ito
  rationale: Pinananatili ang literal at mapanlait na katawagang pangtipan sa Hebreo sa halip na palitan ito ng mas tiyak na “mga Filisteo.”
- source_word: וְהִתְעַלְּלוּ בִי
  choice: pagmalupitan ako
  rationale: Malawak ang saklaw ng pandiwa at maaaring magpahiwatig ng mapanghamak, mapang-abuso, o kahiya-hiyang pagtrato. Ang “pagmalupitan” ay nagpapanatili sa bigat nito nang hindi tinutukoy ang eksaktong anyo ng pang-aabuso.
- source_word: וְלֹא אָבָה
  choice: ayaw gawin iyon
  rationale: Malinaw na ipinapahayag ang pagtanggi o kawalan ng pagnanais ng tagapagdala ng mga sandata.
- source_word: כִּי יָרֵא מְאֹד
  choice: sapagkat takot na takot siya
  rationale: Pinananatili ng pag-uulit na “takot na takot” ang matinding antas na ipinahihiwatig ng מְאֹד.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: bumagsak sa ibabaw nito
  rationale: Malapit ito sa literal na “nahulog/bumagsak sa ibabaw nito” at hindi dinaragdagan ang teksto ng mas tahasang paglalarawan, bagaman malinaw sa konteksto ang layunin ni Saul.
theological_decisions:
- issue: Eksaktong uri ng kinatatakutang paglapastangan kay Saul
  choice: pagmalupitan ako
  alternative: paglaruan ako; hamakin ako; lapastanganin ako
  rationale: Hindi tinutukoy ng Hebreo kung ang gagawin ay pagpapahirap, panunuya, seksuwal na paglapastangan, o ibang kahiya-hiyang pang-aabuso. Pinananatili ng salin ang kabigatan at kalabuan ng teksto.
- issue: Paglalarawan sa pagkamatay ni Saul
  choice: bumagsak sa ibabaw nito
  alternative: ibinagsak ang sarili sa espada
  rationale: Sinusunod ang payak na anyo ng Hebreo at iniiwasang palawakin ang paraan ng kilos nang higit sa tahasang sinabi ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “espada” at ang malinaw na pariralang “tagapagdala ng kanyang mga sandata”; pinanatili ang mapanlait na katawagang “mga di-tuli” at ang pag-uulit ng “saksakin” mula sa Hebreo.
