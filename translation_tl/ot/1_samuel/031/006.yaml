  text: וַ/יָּ֣מָת שָׁא֡וּל וּ/שְׁלֹ֣שֶׁת בָּנָי/ו֩ וְ/נֹשֵׂ֨א כֵלָ֜י/ו גַּ֧ם כָּל אֲנָשָׁ֛י/ו בַּ/יּ֥וֹם הַ/ה֖וּא יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/006.yaml
  text: So Saul died[a], and his three sons, and his armor-bearer, and all his men[b], together on that day.
translation:
  language: tl
  text: Sa gayon, namatay si Saul, ang tatlo niyang anak na lalaki, ang tagapagdala niya ng sandata, at ang lahat ng tauhan niya[a][b]—sama-sama noong araw na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng sundalo niya.” Ang literal na sinasabi ng Hebreo ay “lahat ng kanyang mga lalaki,” ngunit sa konteksto ng labanang ito, malamang na tumutukoy iyon sa hukbo o mga tauhang kasama ni Saul, hindi sa bawat lalaking may kaugnayan sa kanya.
    reason: lexical_alternative
  - marker: b
    text: Sa ilang manuskritong Griyego, “lahat ng kanyang sandata” ang mababasa sa halip na “lahat ng kanyang mga tauhan.” Sinusuportahan ng tekstong Hebreo ang “lahat ng tauhan niya.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: Sa gayon, namatay
  rationale: Isinusulong ng waw-consecutive ang salaysay at iniuugnay ang kamatayan ni Saul sa naunang pangyayari. Likas sa makabagong Filipino ang “Sa gayon” bilang panandang bunga at pagpapatuloy.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Karaniwang anyo ng pangalang Hebreo sa Filipino.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: ang tatlo niyang anak na lalaki
  rationale: Tuwirang ipinapahayag ang bilang at ang panlalaking kahulugan ng בָּנִים, sa likas na ayos ng Filipino.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: ang tagapagdala niya ng sandata
  rationale: Ang parirala ay literal na tumutukoy sa nagdadala ng kanyang mga kagamitan o sandata. Malinaw ito sa Filipino at hindi ipinapalagay na baluting pananggalang lamang ang כֵּלִים.
- source_word: גַּם כָּל אֲנָשָׁיו
  choice: at ang lahat ng tauhan niya
  rationale: Sa konteksto ng labanan, ang אֲנָשָׁיו ay malamang na mga mandirigma o mga tauhang kasama ni Saul. Pinananatili ng “mga tauhan” ang lawak ng Hebreo nang hindi ito nililimitahan sa teknikal na katawagang “mga sundalo”; sapat na naipahihiwatig ng “at” ang pagdaragdag ng גַּם.
- source_word: בַּיּוֹם הַהוּא
  choice: noong araw na iyon
  rationale: Natural at malinaw na katumbas ng karaniwang pariralang temporal sa Hebreo.
- source_word: יַחְדָּו
  choice: sama-sama
  rationale: Pinananatili ang diin na silang lahat ay namatay sa iisang araw, kaugnay ng iisang pangyayari.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapagdala niya ng sandata” sa halip na mas teknikal o makalumang katawagan, at “mga tauhan” upang mapanatili ang saklaw ng Hebreo sa kontekstong militar. Inilagay ang dalawang talababa sa pariralang “lahat ng tauhan niya,” sapagkat kapwa rito nauukol ang leksikal na alternatibo at ang tekstuwal na baryante.
