base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/003.yaml
  text: And the battle grew heavy against Saul[a], and the archers found him[b], and he was greatly wounded by the archers.
translation:
  language: tl
  text: Lalong tumindi ang labanan laban kay Saul. Natagpuan siya ng mga mamamana,[a] at malubha siyang nasugatan ng mga mamamana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang mga tagapana, mga lalaking may busog.”
    reason: Pinananatili ang mas buong anyo ng pariralang Hebreo, na pinaikli sa natural na saling “mga mamamana.”
  - marker: b
    text: O “at labis siyang nahirapan dahil sa mga mamamana.” Mahirap tiyakin ang pandiwang Hebreo rito; maaari itong tumukoy sa matinding sakit, panginginig, o matinding paghihirap/pagkabagabag, hindi lamang sa pisikal na pagkasugat.
    reason: Leksikal na alternatibo dahil hindi tiyak kung pisikal na sugat o matinding paghihirap ang ipinahihiwatig.
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה אֶל שָׁאוּל
  choice: Lalong tumindi ang labanan laban kay Saul
  rationale: Ang literal na larawan ay ‘bumigat ang labanan,’ ngunit sa konteksto ng pakikipagdigma, ipinahihiwatig nito na tumindi ang labanan at ang puwersa nito ay nakatuon laban kay Saul. Pinananatili ng salin ang paglala at direksiyon ng labanan sa natural na Filipino.
- source_word: וַיִּמְצָאֻהוּ
  choice: Natagpuan siya
  rationale: Tuwirang kahulugan ng pandiwa ang ‘natagpuan.’ Bagaman maaari itong magpahiwatig ng pag-abot o pagdating sa isang target sa labanan, hindi kailangang idagdag sa pangunahing teksto ang kahulugang iyon.
- source_word: הַמּוֹרִים אֲנָשִׁים בַּקָּשֶׁת
  choice: mga mamamana
  rationale: Ang unang salita ay tumutukoy sa mga tagapana, at nililinaw ito ng kasunod na pariralang ‘mga lalaking may busog.’ Sapat at natural sa Filipino ang ‘mga mamamana’; inilalagay sa talababa ang mas buong anyo ng Hebreo.
- source_word: וַיָּחֶל מְאֹד
  choice: malubha siyang nasugatan
  rationale: Mahirap tiyakin ang eksaktong diwa ng pandiwa. Sa konteksto ng mga mamamana at sa kaugnay na salaysay sa 1 Cronica 10:3, makatuwiran ang pisikal na pagkasugat. Gayunman, maaaring tumukoy ang anyo sa matinding hirap, sakit, panginginig, o pangamba, kaya tahasang pinananatili sa talababa ang kawalang-katiyakan.
- source_word: מֵהַמּוֹרִים
  choice: dahil sa kanila
  rationale: Ipinapakita ng pang-ukol ang pinagmulan o sanhi ng kalagayan ni Saul. Iniiwasan ng ‘dahil sa kanila’ ang paulit-ulit na ‘mga mamamana’ habang malinaw pa rin ang tinutukoy.
theological_decisions:
- issue: Kung pisikal na sugat o matinding paghihirap ang sinapit ni Saul
  choice: Isinalin sa pangunahing teksto bilang ‘malubha siyang nasugatan,’ na may talababa tungkol sa ibang posibleng kahulugan.
  alternative: ‘Labis siyang nahirapan/nabagabag dahil sa mga mamamana.’
  rationale: Hindi ganap na tiyak ang pandiwang Hebreo. Mas angkop sa daloy ng labanan ang pagkasugat, ngunit hindi dapat itago ang tunay na leksikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang karaniwang ‘mamamana’ at iniwasan ang sobrang literal ngunit alanganing ‘mga lalaking may busog’ sa pangunahing teksto. Ang ‘labanan laban kay Saul’ ay bahagyang may pag-uulit ngunit malinaw at tapat sa direksiyon ng Hebreong אֶל.
