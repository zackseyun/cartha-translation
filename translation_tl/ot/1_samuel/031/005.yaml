  text: When his armor-bearer saw that Saul was dead[a], he too fell on his sword and died with him.
translation:
  language: tl
  text: Nang makita ng tagapagdala ng sandata ni Saul na patay na si Saul, bumagsak din siya sa sarili niyang espada at namatay kasama niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: tagapagdala ng mga sandata ni Saul
  rationale: Ang pariralang Hebreo ay tumutukoy sa taong nagdadala ng kagamitan o mga sandata ng isang mandirigma. Likas at malinaw sa modernong Filipino ang “tagapagdala ng mga sandata,” at nililinaw ng “ni Saul” ang reperente ng panghalip.
- source_word: כִּי
  choice: na
  rationale: 'Ipinakikilala rito ng כִּי ang nilalaman ng nakita ng tagapagdala: na patay na si Saul, hindi isang hiwalay na sanhi.'
- source_word: מֵת
  choice: patay na
  rationale: Maaaring ilarawan ng anyong Hebreo ang kalagayan ni Saul bilang patay o ang pagkamatay bilang naganap na. Ang “patay na” ang pinakanatural na paglalarawan ng kalagayang nakita, habang inilalahad sa talababa ang tunay na alternatibo.
- source_word: גַּם הוּא
  choice: din siya
  rationale: Pinananatili nito ang dagdag at katumbas na pagkilos ng tagapagdala kasunod ng ginawa at sinapit ni Saul.
- source_word: עַל חַרְבּוֹ
  choice: sa sarili niyang espada
  rationale: Sa konteksto, ang pagbagsak sa espada ay sinadyang pagkilos. Ang “nagpatihulog ... sa sarili niyang espada” ay natural sa Filipino at pinananatili ang idiomatikong larawan ng Hebreo.
- source_word: וַיָּמָת עִמּוֹ
  choice: at namatay na kasama niya
  rationale: Tuwirang pinananatili ng “kasama niya” ang diwa ng accompaniment sa עִם nang hindi nagdaragdag ng lokasyong hindi tahasang sinasabi.
- source_word: וַיַּרְא
  choice: Nang makita
  rationale: Ginagawang malinaw ng “Nang” ang ugnayang temporal ng pagkakita at ng sumunod na pagkilos, habang natural na isinasalaysay ang Hebreong pagkakasunod-sunod.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “tagapagdala ng mga sandata” sa halip na mas teknikal o di-pamilyar na katawagan, at pinanatili ang maikli at mabilis na daloy ng salaysay.
