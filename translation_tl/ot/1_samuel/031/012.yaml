base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/012.yaml
  text: Then all the valiant men arose and went all night[a], and they took the body of Saul and the bodies of his sons from the wall of Beth-shan[b], and they came to Jabesh and burned them there.
translation:
  language: tl
  text: Tumindig ang lahat ng magigiting na mandirigma at naglakbay nang buong magdamag. Kinuha nila mula sa pader ng Bet-san ang bangkay ni Saul at ang mga bangkay ng kanyang mga anak.[a] Pumunta sila sa Jabes[b] at sinunog ang mga iyon doon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy mismo sa patay na katawan o bangkay.
    reason: lexical_clarification
  - marker: b
    text: Sa mas malawak na konteksto, ang Jabes dito ay Jabes-gilead.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: lahat ng magigiting na mandirigma
  rationale: Ang idyoma ay tumutukoy sa matatapang at may kakayahang lalaking mandirigma. Likas sa makabagong Tagalog ang pariralang ito at angkop sa konteksto ng mapanganib na pagkuha sa mga bangkay.
- source_word: וַיָּק֜וּמוּ
  choice: Tumindig
  rationale: Pinananatili nito ang literal na diwa ng pagbangon o pagtindig at ang marangal na himig ng salaysay.
- source_word: וַיֵּלְכ֣וּ כָל הַלַּיְלָה
  choice: naglakbay nang buong magdamag
  rationale: Ipinahahayag nito ang patuloy na paglalakbay sa buong gabi nang hindi tinutukoy kung paano sila naglakbay.
- source_word: גְּוִיַּת ... גְּוִיֹּת
  choice: ang bangkay ... ang mga bangkay
  rationale: Ang salitang Hebreo ay tahasang tumutukoy sa patay na katawan; malinaw at natural sa Tagalog ang “bangkay.”
- source_word: מֵחוֹמַת
  choice: mula sa pader
  rationale: Tuwirang isinasalin ang pang-ukol at pangngalan nang hindi dinaragdagan ng salitang “lunsod,” na hindi tahasang naroon.
- source_word: בֵּית שָׁן
  choice: Bet-san
  rationale: Makabagong transliterasyong Tagalog ng pangalang Hebreo, na may gitling upang malinaw ang dalawang bahagi.
- source_word: יָבֵשָׁה
  choice: sa Jabes
  rationale: Ipinakikita ng hulaping paturol ang pagpunta sa Jabes. Hindi idinagdag sa pangunahing teksto ang “Gilead” sapagkat “Jabes” lamang ang nasa Hebreo.
- source_word: וַיִּשְׂרְפ֥וּ אֹתָ֖ם שָׁם
  choice: at sinunog ang mga iyon doon
  rationale: Pinananatili ang payak na pandiwang “sinunog,” ang panghalip na maramihan, at ang lokatibong “doon,” nang hindi ipinapalagay ang mas tiyak na paraan o layunin ng pagsunog.
theological_decisions:
- issue: Paglalarawan sa pangkat na kumuha sa mga bangkay
  choice: lahat ng magigiting na mandirigma
  alternative: lahat ng magigiting na tao
  rationale: Ang panlalaking anyo at kontekstong militar ay tumutukoy sa mga lalaking mandirigma; maiiwasan ng piniling salin ang pagpapalabo sa detalye ng pinagmulan.
- issue: Kahulugan ng pagsunog sa mga bangkay
  choice: sinunog ang mga iyon
  alternative: kremeyt ang mga iyon
  rationale: “Sinunog” lamang ang tahasang sinasabi ng Hebreo. Hindi ipinapasok ng salin ang isang mas tiyak na ritwal o paliwanag na hindi nakasaad sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “magdamag” at “bangkay” bilang natural na mga salitang Tagalog, habang pinanatili ang maikli at sunod-sunod na kilos ng tekstong Hebreo.
