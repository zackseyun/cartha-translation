translation_notes:
  register: Makabagong Filipino na payak ngunit marangal. Ginamit ang “templo” sa pangunahing teksto para sa likas na kahulugan ng kultikong “bahay,” habang pinanatili sa talababa ang literal na anyo at ang kalabuan ng pangalang עַשְׁתָּרוֹת.
