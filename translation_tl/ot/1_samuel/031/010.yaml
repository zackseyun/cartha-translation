  text: וַ/יָּשִׂ֨מוּ֙ אֶת כֵּלָ֔י/ו בֵּ֖ית עַשְׁתָּר֑וֹת וְ/אֶת גְּוִיָּת/וֹ֙ תָּקְע֔וּ בְּ/חוֹמַ֖ת בֵּ֥ית שָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/010.yaml
  text: They put his armor in the house of the Ashtaroths[c][b][a], and they fastened his body to the wall of Beth-shan.
translation:
  language: tl
  text: Inilagay nila ang baluti ni Saul sa templo ni Astarot,[a][b] at ikinabit nila ang bangkay niya sa pader ng Bet-san.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bahay ni Astarot.”
    reason: lexical_alternative
  - marker: b
    text: Ang anyong Hebreo ng pangalang Astarot ay maramihan sa anyo; maaari rin itong isalin na “mga Astarot.”
    reason: source_ambiguity
  - marker: c
    text: Maaari ring “itinulos nila ang bangkay niya sa pader.” Ang pandiwang Hebreo ay maaaring mangahulugang “ibaon” o “ikabit,” ngunit hindi tiyak ang eksaktong paraan ng paglalantad sa bangkay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: Inilagay nila
  rationale: Likas at tuwirang salin ng שׂוּם sa payak na salaysay.
- source_word: כֵּלָיו
  choice: ang baluti ni Saul
  rationale: Malawak ang saklaw ng כְּלִי, ngunit sa konteksto ng mandirigmang natalo, ang kagamitang pandigma—na maikling ipinahahayag ng “baluti”—ang pinakamalamang. Ginawang tahasan ang reperenteng si Saul upang maging malinaw sa Filipino.
- source_word: בֵּית עַשְׁתָּרוֹת
  choice: sa templo ni Astarot
  rationale: Bagaman literal na “bahay,” tumutukoy ang בֵּית sa isang gusaling panrelihiyon sa kontekstong ito. Pinanatili ang pangalang Astarot sa anyong madaling basahin sa Filipino; ang morpolohikal na anyong maramihan ay hindi tiyak na nangangahulugang maraming diyosa o templo rito.
- source_word: גְּוִיָּתוֹ
  choice: ang bangkay niya
  rationale: Tumutukoy ang גְּוִיָּה rito sa patay na katawan ni Saul; malinaw at likas sa Filipino ang “bangkay.”
- source_word: תָּקְעוּ
  choice: ikinabit nila
  rationale: Ipinahahayag nito ang resulta ng pagtutulos o pagkapit sa pader nang hindi nagpapasya sa eksaktong paraang hindi tinutukoy nang tiyak ng Hebreo.
- source_word: בְּחוֹמַת
  choice: sa pader ng
  rationale: Likas na Filipino para sa pagkakabit o paglalagay ng bangkay sa pader.
- source_word: בֵּית שָׁן
  choice: Bet-san
  rationale: Transliterasyong angkop sa baybay at bigkas ng Filipino para sa pangalang Hebreo.
