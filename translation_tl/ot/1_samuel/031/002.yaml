translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kanyang” sa halip na mas kolokyal na “kaniyang” variants; pinanatili ang pag-uulit ng pagkakaugnay sa mga Filisteo sa natural na paraan sa pamamagitan ng “nila,” habang malinaw pa rin ang simuno. Lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
