base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/002.yaml
  text: The Philistines overtook Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua[b], the sons of Saul.
translation:
  language: tl
  text: Naabutan ng mga Filisteo si Saul at ang kanyang mga anak na lalaki[a], at pinabagsak nila sina Jonatan, Abinadab, at Malqui-sua[b], na mga anak ni Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinabol nang mahigpit at naabutan” o “mahigpit na tinugis.” Ipinahihiwatig ng pandiwang Hebreo ang malapit na pagtugis na umabot sa hinahabol.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pinatay sina Jonatan, Abinadab, at Malqui-sua.” Literal na nangangahulugang “hinampas” o “sinaktan” ang pandiwang Hebreo, ngunit sa konteksto ng labanang ito ay malamang na tumutukoy ito sa pagkamatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ
  choice: Naabutan
  rationale: Sa konteksto ng labanan, ang דבק ay tumutukoy sa mahigpit na pagtugis na umabot sa hinahabol. Likas sa Filipino ang “naabutan” at malinaw na ipinahihiwatig na naabot ng mga Filisteo ang kanilang puntirya.
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang anyong Filipino para sa pangalan ng bayang ito; ginagawang tiyak ng konteksto ang tinutukoy na pangkat.
- source_word: אֶת שָׁאוּל וְאֶת בָּנָיו
  choice: si Saul at ang kanyang mga anak na lalaki
  rationale: Ang בָּנָיו ay tahasang tumutukoy sa kanyang mga anak na lalaki, gaya ng pinatutunayan ng tatlong pangalang kasunod.
- source_word: וַיַּכּוּ
  choice: pinabagsak
  rationale: Ang נכה ay literal na tumutukoy sa pananakit o paghampas, ngunit sa salaysay ng labanan ay malamang na nakamamatay. Pinananatili ng “pinabagsak” ang kilos at hindi lubusang isinasara ang leksikal na lawak gaya ng “pinatay.”
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Malapit at kinikilalang transliterasyon ng pangalang Hebreo.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malqui-sua
  rationale: Filipinisadong transliterasyon na gumagamit ng “qu” upang mapanatili ang tunog na /k/ bago ang i; pinananatili ng gitling ang tambalang anyo ng pangalan.
- source_word: בְּנֵי שָׁאוּל
  choice: na mga anak ni Saul
  rationale: Pinananatili ang appositional na pagkakakilanlan ng tatlong lalaking pinangalanan bilang mga anak ni Saul.
