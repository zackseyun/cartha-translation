  text: Do I lack madmen[a], that you have brought this one to act like a madman before me? Shall this one come into my house?
translation:
  language: tl
  text: “Kulang ba ako sa mga baliw[a], na dinala ninyo ang taong ito para mag-asal-baliw sa harap ko? Papasok ba ang taong ito sa bahay ko?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga taong wala sa katinuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲסַר מְשֻׁגָּעִים
  choice: Kulang ba ako sa mga baliw
  rationale: Pinananatili ang matalim at mapanuyang tanong sa Hebreo. Ang “mga baliw” ay natural na makabagong Tagalog at tumutukoy sa mga taong itinuturing na wala sa katinuan.
- source_word: הֲבֵאתֶם אֶת זֶה
  choice: dinala ninyo ang taong ito
  rationale: Ang “ang taong ito” ay malinaw sa Tagalog at pinananatili ang mapanghamak na diin ng demonstratibong Hebreo nang hindi nagdaragdag ng mas matinding insulto.
- source_word: לְהִשְׁתַּגֵּעַ
  choice: para mag-asal-baliw
  rationale: Ipinahihiwatig ng anyong Hitpael ang pagkilos o pag-aasal na parang baliw; ang konteksto ay nagpapakitang sinadya ni David ang gayong pagganap.
- source_word: עָלָי
  choice: sa harap ko
  rationale: Sa kontekstong ito, ang literal na “sa ibabaw/laban sa akin” ay tumutukoy sa pagkilos sa presensiya ng hari; natural itong naihahayag bilang “sa harap ko.”
- source_word: הֲזֶה יָבֹא אֶל־בֵיתִי
  choice: Papapasukin ba ang taong ito sa bahay ko?
  rationale: Ang tanong ay likas na naipapahayag sa Tagalog sa pasibong anyo at ipinahihiwatig ang pagtutol ni Akis na makapasok ang taong ito sa kaniyang bahay o sambahayan.
theological_decisions: []
