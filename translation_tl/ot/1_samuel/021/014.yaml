  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tarangkahan” para sa city gate at “mga pinto” para sa mga dahon nito. Inayos ang mga pananda ng talababa ayon sa mismong pariralang tinutukoy ng bawat isa.
