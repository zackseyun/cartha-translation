base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/014.yaml
  text: So he changed his behavior before their eyes and acted like a madman in their hands[b][a]; he made marks on the doors of the gate and let his saliva run down onto his beard.
translation:
  language: tl
  text: Kaya binago niya ang kanyang kilos sa harap nila at umastang parang baliw habang nasa kapangyarihan nila[a]. Gumawa siya ng mga marka sa mga pinto ng tarangkahan[b] at hinayaang tumulo ang kanyang laway sa kanyang balbas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagkunwaring baliw.” Inilalarawan ng pandiwang Hebreo ang asal na tila wala sa katinuan; ipinakikita ng konteksto na sinadya niya ito.
    reason: lexical_alternative
  - marker: b
    text: Mahirap unawain ang pandiwang Hebreo na isinaling “gumawa ng mga marka”; maaari rin itong mangahulugang “kumaskas” o “nagsulat-sulat” sa mga pinto ng tarangkahan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁנּוֹ אֶת־טַעְמוֹ
  choice: binago niya ang kanyang kilos
  rationale: Ang טַעַם ay maaaring tumukoy sa pag-iisip o matinong pagpapasya, ngunit sa salaysay ay ang nakikitang asal ang sadyang binago ni David. Iniiwasan ng “kilos” na ipahiwatig na talagang nagbago ang kanyang katinuan.
- source_word: בְּעֵינֵיהֶם
  choice: sa harap nila
  rationale: Natural na salin ng idyomang Hebreo na literal na “sa kanilang mga mata,” ibig sabihin ay sa kanilang paningin o presensya.
- source_word: וַיִּתְהֹלֵל
  choice: nagkunwaring baliw
  rationale: Ang anyong hitpael dito ay naglalarawan ng asal na parang baliw; ipinakikita ng konteksto na sinadya at ipinanggap ni David ang asal na ito.
- source_word: בְּיָדָם
  choice: habang nasa kanilang mga kamay
  rationale: Pinananatili ang larawan ng Hebreo at maaari ring magpahiwatig na siya ay nasa kapangyarihan o pangangalaga nila.
- source_word: ויתו
  choice: Gumawa siya ng mga marka
  rationale: Mahirap at di-tiyak ang pandiwa; ang malawak na saling ito ay hindi labis na nagpapasya kung ang kilos ay pagkaskas o pagsusulat-sulat.
- source_word: דַּלְתוֹת הַשַּׁעַר
  choice: mga pinto ng tarangkahan
  rationale: Tuwirang tumutukoy sa mga dahon o panel ng pintuang nasa tarangkahan.
- source_word: וַיּוֹרֶד רִירוֹ
  choice: hinayaang tumulo ang kanyang laway
  rationale: Natural na Filipino para sa causative na larawan ng pagpapababa o pagpapatulo ng laway.
- source_word: אֶל־זְקָנוֹ
  choice: sa kanyang balbas
  rationale: Ipinahihiwatig ng pang-ukol at kilos ang pagdaloy ng laway pababa hanggang sa balbas.
