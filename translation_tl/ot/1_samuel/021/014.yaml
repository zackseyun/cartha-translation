  to: Kaya binago niya ang kanyang kilos sa harap nila at umastang parang baliw habang nasa kapangyarihan nila[a]. Gumawa siya ng mga marka sa mga pinto ng tarangkahan[b] at hinayaang tumulo ang kanyang laway sa kanyang balbas.
