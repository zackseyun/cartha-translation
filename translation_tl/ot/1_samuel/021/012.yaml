  text: וַ/יֹּ֨אמְר֜וּ עַבְדֵ֤י אָכִישׁ֙ אֵלָ֔י/ו הֲ/לוֹא זֶ֥ה דָוִ֖ד מֶ֣לֶךְ הָ/אָ֑רֶץ הֲ/ל֣וֹא לָ/זֶ֗ה יַעֲנ֤וּ בַ/מְּחֹלוֹת֙ לֵ/אמֹ֔ר הִכָּ֤ה שָׁאוּל֙ ב/אלפ/ו וְ/דָוִ֖ד ב/רבבת/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/012.yaml
  text: And the servants of Achish said to him[a], “Is this not David, the king of the land? Is this not the one of whom they sang in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: tl
  text: 'Sinabi ng mga lingkod ni Akis kay Akis, “Hindi ba ito si David, ang hari ng lupain? Hindi ba siya ang ipinag-aawitan[a] nila sa mga sayawan, na sinasabi,


    ‘Libo-libo ang pinabagsak ni Saul,


    at sampu-sampung libo[b] naman ang kay David’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tumutugon sila sa awitan”; maaaring tugunang pag-awit habang nagsasayaw ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “laksa-laksa” o “mga sampung libo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: mga lingkod
  rationale: Tuwirang sinasaklaw ng salitang Hebreo ang mga tauhan ng sambahayan o korte ni Akis; hindi ito pinakipot sa “mga opisyal.”
- source_word: הֲלוֹא
  choice: Hindi ba
  rationale: Pinananatili ang anyong retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: מֶלֶךְ הָאָרֶץ
  choice: ang hari ng lupain
  rationale: Pormal na katumbas ito ng Hebreo at hindi nito ipinapasiya kung literal, mapagmalabis, o ayon lamang sa palagay ng mga lingkod ang tawag kay David.
- source_word: יַעֲנוּ
  choice: inaawitan
  rationale: Sa konteksto ng sayawan, tumutukoy ang pandiwa sa pag-awit o tugunang pag-awit. Likas sa Filipino ang “inaawitan,” habang inilalahad sa talababa ang posibleng tugunang paraan.
- source_word: בַמְּחֹלוֹת
  choice: sa mga sayawan
  rationale: Malapit at natural na salin ng mga pagdiriwang na may pagsasayaw.
- source_word: הִכָּה
  choice: pinabagsak
  rationale: Ipinahihiwatig ng pandiwa ang pagdaig o pagpatay sa labanan. Pinananatili ng “pinabagsak” ang matingkad ngunit hindi lipas na paglalarawan.
- source_word: באלפו
  choice: libo-libo ang pinabagsak ni Saul
  rationale: Malinaw na ipinahahayag sa natural na Filipino ang bilang ng mga ibinilang na natalo ni Saul.
- source_word: ברבבתו
  choice: sampu-sampung libo naman ang kay David
  rationale: Pinananatili ang paralelismo at paghahambing sa “libo-libo,” pati ang matipid na anyo ng awit sa Hebreo.
theological_decisions:
- issue: Kung ang “hari ng lupain” ay obhetibong titulo o pananaw lamang ng mga lingkod na Filisteo
  choice: ang hari ng lupain
  alternative: ang itinuturing na hari ng lupain
  rationale: Hindi nililinaw ng Hebreo kung pormal nang naghahari si David o inilalarawan lamang ang kaniyang katanyagan. Pinananatili ng salin ang tensiyon sa salaysay at hindi nagdaragdag ng interpretasyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Akis,” “mga lingkod,” at “hari ng lupain” bilang tuwiran ngunit natural na mga katumbas. Iningatan ang anyong patula ng sipi sa pamamagitan ng magkatapat na mga linya at ng “naman.”
