  to: 'Sinabi ng mga lingkod ni Akis kay Akis, “Hindi ba ito si David, ang hari ng lupain? Hindi ba siya ang ipinag-aawitan[a] nila sa mga sayawan, na sinasabi,


    ‘Libo-libo ang pinabagsak ni Saul,


    at sampu-sampung libo[b] naman ang kay David’?”'
  rationale: Nilinaw ang relasyong “sila ang umaawit tungkol kay David” nang hindi nagdaragdag ng pagpapakahulugan tungkol sa uri ng sayaw o sa katayuan ni David. Inayos din ang talababa b upang magbigay lamang ng mga alternatibong tumutugma sa tiyak na halagang “sampung libo.”
