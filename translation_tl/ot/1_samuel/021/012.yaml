revisions:
- from: 'Sinabi sa kanya ng mga lingkod ni Akis, “Hindi ba ito si David, ang hari ng lupain? Hindi ba siya ang inaawitan[a] nila sa mga sayawan, na sinasabi,


    ‘Libo-libo ang pinabagsak ni Saul,

