  yaml_path: translation/ot/1_samuel/021/013.yaml
  text: David took these words to heart[a], and he was very much afraid of Achish king of Gath.
translation:
  language: tl
  text: Isinapuso ni David ang mga salitang ito[a], at labis siyang natakot kay Akis na hari ng Gat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Inilagay ni David sa kanyang puso ang mga bagay na ito.” Ipinahihiwatig ng idyomang Hebreo na dinibdib niya ang sinabi at pinag-isipan itong mabuti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... בִּלְבָבוֹ
  choice: Isinapuso
  rationale: Likas na idyomang Filipino ito para sa paglalagay ng isang bagay sa kalooban at pag-iisip dito nang masinsinan; pinananatili nito ang metapora ng pusong nasa Hebreo.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: ang mga salitang ito
  rationale: Tumutukoy ang דְּבָרִים sa sinabi ng mga lingkod sa naunang talata; kaya mas tiyak dito ang “mga salita” kaysa “mga bagay” o “usaping ito.”
- source_word: וַיִּרָא מְאֹד
  choice: labis siyang natakot
  rationale: Malinaw at natural na ipinahahayag ng “labis” ang matinding takot na ipinahihiwatig ng מְאֹד.
- source_word: מִפְּנֵי
  choice: kay
  rationale: Sa konstruksiyong tumutukoy sa pagkatakot sa isang tao, natural sa Filipino ang “natakot kay”; hindi kailangang literal na isalin ang idyomang Hebreo na may diwang “mula sa harap ng.”
- source_word: אָכִישׁ
  choice: Akis
  rationale: Transliterasyon ng pangalang Hebreo sa anyong likas at karaniwang mabasa sa Filipino.
- source_word: מֶלֶךְ גַּת
  choice: hari ng Gat
  rationale: Tuwirang isinasalin ang construct chain habang pinananatiling appositional ang titulo ni Akis.
