  yaml_path: translation/ot/1_samuel/021/001.yaml
  text: Then he arose and went away[a], and Jonathan entered the city.
translation:
  language: tl
  text: Pagkatapos, tumindig siya at umalis, at pumasok naman si Jonatan sa lungsod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: Pagkatapos, tumindig siya
  rationale: Ang Qal wayyiqtol ng קום ay nagsasaad ng pagtindig o pagbangon at nagpapatuloy sa salaysay. Ang “tumindig” ay dignificado ngunit malinaw sa modernong Filipino; ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng pangyayari.
- source_word: וַיֵּלַךְ
  choice: at umalis
  rationale: Ang Qal wayyiqtol ng הלך ay maaaring mangahulugang pumunta, lumakad, o umalis. Sa konteksto ng paghihiwalay, likas at tumpak ang “umalis” nang hindi dinaragdagan ang patutunguhan.
- source_word: וִיהוֹנָתָן
  choice: at ... naman si Jonatan
  rationale: 'Isinalin ang pang-ugnay bilang “at,” habang tumutulong ang “naman” na maipakita ang paglipat sa ikalawang tauhan at ang magkaibang kilos nila. Ginamit ang karaniwang anyong Filipino ng pangalang Jonathan: “Jonatan.”'
- source_word: בָּא
  choice: pumasok
  rationale: Ang Qal perfect ng בוא ay literal na “dumating/pumaroon,” ngunit kapag tuwirang sinusundan ng הָעִיר, malinaw sa konteksto ang pagpasok sa lungsod. Natural sa Filipino ang “pumasok ... sa lungsod” at hindi nangangailangan ng deiktikong pagpili sa pagitan ng “dumating” at “pumunta.”
- source_word: הָעִיר
  choice: sa lungsod
  rationale: Ang עִיר ay lungsod o bayan. Pinili ang “lungsod” bilang tuwiran at karaniwang katumbas; naipahahayag sa Filipino ng “sa” ang ugnayan sa tiyak na lugar kahit walang hiwalay na katumbas ang artikulong הַ.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignificado. Pinanatili ang maikli at sunod-sunod na estilo ng salaysay. Walang talababa sapagkat natural na naipahahayag ng “pumasok” ang kilos ng בָּא הָעִיר nang hindi kailangang pumili sa deiktikong “dumating” o “pumunta.”
