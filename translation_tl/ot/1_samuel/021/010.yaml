base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/010.yaml
  text: And the priest said[a], “The sword of Goliath the Philistine, whom you struck down in the Valley of Elah—behold, it is wrapped in a cloth behind the ephod. If you will take that for yourself, take it, for there is no other here except it.” And David said, “There is none like it; give it to me.”
translation:
  language: tl
  text: Sinabi ng pari, “Ang espada ni Goliat na Filisteo, na pinabagsak mo sa Lambak ng Elah—narito, nakabalot iyon sa isang balabal[a] sa likod ng efod. Kung kukunin mo iyon para sa iyong sarili, kunin mo, sapagkat wala nang ibang espada rito maliban diyan.” Sinabi ni David, “Walang katulad iyon; ibigay mo sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “damit” o “panlabas na kasuotan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: ang espada ni Goliat na Filisteo
  rationale: Likas sa Tagalog ang gamit ng “ni” para sa ugnayang pag-aari, at pinananatili ang pagkakakilanlan kay Goliat bilang Filisteo.
- source_word: הִכִּיתָ
  choice: pinabagsak mo
  rationale: Pinananatili nito ang diwang pandigma ng נכה nang hindi tahasang nililimitahan ang kahulugan sa “pinatay mo.”
- source_word: בְּעֵמֶק הָאֵלָה
  choice: sa Lambak ng Elah
  rationale: Malinaw at makabagong anyo ng pangalan ng pook sa Tagalog.
- source_word: הִנֵּה
  choice: narito
  rationale: Ipinakikita ang tungkuling panturo ng kataga at natural itong nagpapansin sa kinaroroonan ng espada.
- source_word: לוּטָה בַשִּׂמְלָה
  choice: nakabalot iyon sa isang balabal
  rationale: Ang “nakabalot” ay natural para sa pasibong anyo, samantalang ang “balabal” ay nagpapanatili sa pangunahing kahulugan ng שׂמלה bilang panlabas na kasuotan.
- source_word: אַחֲרֵי הָאֵפוֹד
  choice: sa likod ng efod
  rationale: Ginagamit dito ang malinaw na kahulugang panlunan ng אַחֲרֵי.
- source_word: אִם אֹתָהּ תִּקַּח לְךָ קָח
  choice: Kung kukunin mo iyon para sa iyong sarili, kunin mo
  rationale: Pinananatili ang kondisyonal at mapagpahintulot na himig, pati ang pag-uulit ng pandiwang nasa Hebreo.
- source_word: כִּי אֵין אַחֶרֶת זוּלָתָהּ בָּזֶה
  choice: sapagkat wala nang iba rito maliban doon
  rationale: Ipinahahayag ang pagbubukod at ang panlokal na diwa ng בָּזֶה nang natural sa Tagalog.
- source_word: אֵין כָּמוֹהָ
  choice: Walang katulad iyon
  rationale: Natural na idyomang Tagalog na nagpapanatili sa pahayag ng pagiging natatangi o kahusayan ng espada.
- source_word: תְּנֶנָּה לִּי
  choice: ibigay mo sa akin
  rationale: Direkta at natural na salin ng pautos; ang reperensiya sa espada ay malinaw sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “espada,” “balabal,” at “efod” bilang malinaw na mga katawagang angkop sa salaysay; iniwasan ang labis na arkaiko o denominasyonal na pananalita.
