base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/007.yaml
  text: So the priest gave him holy bread[a], for there was no bread there except the bread of the Presence, which had been removed from before Yahweh, to put hot bread there on the day it was taken away.
translation:
  language: tl
  text: Kaya ibinigay sa kanya ng pari ang banal na tinapay[a], sapagkat walang tinapay doon maliban sa tinapay ng Presensya, na inalis mula sa harapan ni Yahweh upang maglagay roon ng mainit na tinapay sa araw na inalis ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tinapay ng Presensya.” Tradisyonal din itong tinatawag na “tinapay na pantanghal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: banal na tinapay
  rationale: Ang pangngalan ay literal na tumutukoy sa isang banal o itinalagang bagay, ngunit malinaw sa konteksto na tinapay ang tinutukoy; ginagawang tahasan ito ng salin nang hindi nagdaragdag ng bagong diwa.
- source_word: לֶחֶם הַפָּנִים
  choice: tinapay ng Presensya
  rationale: Pinananatili nito ang kultikong diwa ng tinapay na inilalagay sa harapan o presensya ni Yahweh, at mas malinaw ito sa makabagong mambabasa kaysa sa tradisyonal ngunit di-gaanong karaniwang katawagan.
- source_word: הַמּוּסָרִים
  choice: na inalis
  rationale: Ang pasibong participle ay tumutukoy sa tinapay na inalis sa harapan ni Yahweh bilang bahagi ng regular na pagpapalit nito.
- source_word: מִלִּפְנֵי יְהוָה
  choice: mula sa harapan ni Yahweh
  rationale: Malapit nitong pinananatili ang espasyal at kultikong idyoma ng Hebreo.
- source_word: לֶחֶם חֹם
  choice: mainit na tinapay
  rationale: Literal na nangangahulugang “mainit” ang pang-uri. Maaaring ipinahihiwatig nito na bagong luto ang tinapay, ngunit hindi tahasang nilulutas ng salin ang implikasyong iyon.
- source_word: בְּיוֹם הִלָּקְחוֹ
  choice: nang araw na alisin iyon
  rationale: Pinananatili nito ang temporal at pasibong anyo ng Hebreo at ang reperensiya ng panghalip nang hindi labis na nililinaw kung alin sa tinapay ang tuwirang tinutukoy.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa isang titulong gaya ng “Panginoon.”
- issue: Kahulugan ng “tinapay ng Presensya”
  choice: Pinanatili bilang kultikong katawagan at ipinaliwanag sa talababa
  alternative: tinapay na pantanghal
  rationale: Iniiwasan nitong gawing payak na handog lamang ang katawagan at pinananatili ang kaugnayan ng tinapay sa pagkalagay nito sa harapan ni Yahweh.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pari” at payak na estruktura ng pangungusap, habang pinanatili ang kultikong katawagang “tinapay ng Presensya” at ang literal na “mainit na tinapay.”
