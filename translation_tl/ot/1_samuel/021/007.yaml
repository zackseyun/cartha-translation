revisions:
- from: Kaya ibinigay sa kanya ng pari ang banal na tinapay[a], sapagkat walang ibang tinapay doon kundi ang tinapay ng Presensya, na inalis mula sa harapan ni Yahweh upang maglagay roon ng mainit na tinapay nang araw na alisin iyon.
  to: Kaya ibinigay sa kanya ng pari ang banal na tinapay[a], sapagkat walang tinapay doon maliban sa tinapay ng Presensya, na inalis mula sa harapan ni Yahweh upang maglagay roon ng mainit na tinapay sa araw na inalis ito.
  rationale: Inayos ang temporal na sugnay upang maging natural na Filipino at maipahayag ang pasibong aspekto ng Hebreo. Pinasimple rin ang exceptive clause para mas malapit sa pinagmulan. Hindi binago ang mga pangunahing kultikong termino o ang pangalang Yahweh.
