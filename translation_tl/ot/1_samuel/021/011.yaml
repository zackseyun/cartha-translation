  text: So David arose and fled that day from Saul, and he came to Achish king of Gath.
translation:
  language: tl
  text: Bumangon si David at tumakas siya mula kay Saul noong araw na iyon. Pumunta siya kay Akis, na hari ng Gat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Tuwirang ipinapahayag ng קום ang pagtindig o pagbangon. Pinananatili ng “tumindig” ang kilos at marangal na himig nang hindi ito pinalalawak bilang “naghanda at umalis.”
- source_word: וַיִּבְרַח
  choice: tumakas
  rationale: Karaniwang kahulugan ng ברח ang pagtakas o paglayo dahil sa panganib. Likas at malinaw sa modernong Tagalog ang “tumakas.”
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Pinananatili nito ang tiyak na panahong tinutukoy ng pariralang Hebreo at natural itong pakinggan sa salaysay.
- source_word: מִפְּנֵי שָׁאוּל
  choice: mula kay Saul
  rationale: Bagaman literal na “mula sa harapan/presensiya ni Saul,” ang idyomatikong diwa rito ay pagtakas mula kay Saul; hindi kailangang gawing kahoy ang salin.
- source_word: וַיָּבֹא אֶל
  choice: pumunta siya kay
  rationale: Maaaring mangahulugan ang בוא אֶל ng pagdating o pagpunta sa isang tao. Ang “pumunta siya kay” ay natural sa Tagalog at malinaw na inilalahad ang patutunguhan.
- source_word: אָכִישׁ
  choice: Akis
  rationale: Isinalin sa karaniwang anyong Tagalog ang personal na pangalang Achish.
- source_word: מֶלֶךְ גַּת
  choice: na hari ng Gat
  rationale: Malinaw na ipinakikilalang si Akis ang hari ng Gat; ang “na” ay nagbibigay ng likas na apposisyon sa Tagalog.
