  text: Now then[a], what do you have on hand? Give me five loaves of bread[c][b], or whatever is available.
translation:
  language: tl
  text: Ngayon nga, ano ang mayroon ka[a]? Bigyan mo ako[b] ng limang tinapay, o ng anumang mayroon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ano ang nasa ilalim ng iyong kamay,” isang idyomang Hebreo para sa anumang nasa pag-iingat o kaagad na magagamit ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ibigay mo sa aking kamay.”
    reason: lexical_alternative
  - marker: c
    text: O “anumang matatagpuan.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngayon nga
  rationale: Ipinapahayag nito kapwa ang paglipat ng usapan at ang agarang kahilingan ni David, nang natural sa modernong Tagalog.
- source_word: מַה יֵּשׁ תַּחַת יָדְךָ
  choice: ano ang mayroon ka riyan
  rationale: Ang literal na 'nasa ilalim ng iyong kamay' ay isang idyomang Hebreo para sa anumang nasa pag-iingat o kaagad na magagamit ng kausap. Inihahatid ng salin ang praktikal na diwa nang hindi ipinahihiwatig na literal itong hawak niya.
- source_word: חֲמִשָּׁה לֶחֶם
  choice: limang tinapay
  rationale: Bagaman kolektibo ang gamit ng salitang Hebreo para sa tinapay, likas sa Tagalog na bilangin ito bilang 'limang tinapay'; malinaw sa konteksto na mga buong tinapay ang hinihingi.
- source_word: תְּנָה בְיָדִי
  choice: Bigyan mo ako
  rationale: Ang literal na 'ibigay mo sa aking kamay' ay karaniwang paraan ng Hebreo upang sabihing direktang ibigay sa nagsasalita. Natural at tumpak sa Tagalog ang 'Bigyan mo ako.'
- source_word: אוֹ הַנִּמְצָא
  choice: o anumang makukuha
  rationale: Ang pasibong anyo ng מצא ay tumutukoy sa anumang matatagpuan o kasalukuyang makukuha. Pinananatili ng 'anumang makukuha' ang pagiging bukás ng kahilingan.
