  source_fidelity: Kailangang alisin ang demonstratibong “ito” sa “ang lalaking ito,” sapagkat ang Hebreong אִישׁ ay “isang lalaki” at walang demonstratibo. Ang natitirang pagsasalin ay tapat sa diwa at anyo ng pinagmulan, kabilang ang patuloy o ipinakikitang asal sa מִשְׁתַּגֵּעַ at ang di-ganap na tanong sa תָּבִיאוּ.
  naturalness: Natural at malinaw ang “Tingnan ninyo! Nakikita ninyo...” bilang pagpapanatili ng pantawag-pansin at ng kasunod na pandiwa, bagaman may sinadyang pag-uulit na katapat ng Hebreo. Mas natural at tumpak ang “ang isang lalaking...” kaysa “ang lalaking ito.”
  terminology: Ang “Akis,” “mga lingkod,” at “nag-aasal na parang baliw” ay angkop sa modernong Filipino at sa kontekstong panghukuman/palasyal. Maingat na pinananatili ng “parang baliw” ang hindi tiyak na pagkakaiba ng tunay na pagkabaliw at ikinikilos na pagkabaliw.
