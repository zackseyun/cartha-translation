  text: And Achish said to his servants[a], “Look, you see a man acting like a madman. Why do you bring him to me?”
translation:
  language: tl
  text: At sinabi ni Akis sa kanyang mga lingkod, “Tingnan ninyo! Nakikita ninyo ang isang lalaking nag-aasal na parang baliw[a]. Bakit ninyo siya dinadala sa akin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang lalaking baliw.” Ang anyong pandiwa sa Hebreo ay maaaring tumukoy sa tunay na pagkabaliw o sa pag-aasal na tila baliw.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng waw-consecutive nang hindi nagdaragdag ng tiyak na ugnayang lohikal.
- source_word: אָכִישׁ
  choice: Akis
  rationale: Isinakataga ang pangalang pantangi ayon sa natural na baybay at bigkas sa Filipino.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Tuwirang salin ito na angkop din sa mga naglilingkod sa isang maharlikang sambahayan.
- source_word: הִנֵּה תִרְאוּ
  choice: Tingnan ninyo! Nakikita ninyo
  rationale: Pinananatili kapwa ang pantawag-pansin na הִנֵּה at ang maramihang pandiwang תִרְאוּ, kahit may sinasadyang pag-uulit gaya sa Hebreo.
- source_word: אִישׁ
  choice: ang lalaking ito
  rationale: Pinananatili ang tiyak na pagtukoy sa isang lalaki; idinagdag ang demonstratibong natural sa Filipino sa kontekstong itinuturo ni Akis ang taong nasa harap nila.
- source_word: מִשְׁתַּגֵּעַ
  choice: nag-aasal na parang baliw
  rationale: Ipinahahayag ang nagpapatuloy na kilos at iniiwasang tahasang sabihing tunay siyang baliw o tiyak na nagkukunwari lamang.
- source_word: לָמָּה
  choice: Bakit
  rationale: Tuwirang katumbas ng salitang pananong.
- source_word: תָּבִיאוּ אֹתוֹ אֵלָי
  choice: ninyo siya dinadala sa akin
  rationale: Ang aspektong di-ganap ng “dinadala” ay tumutugma sa Hebreong imperfect at nagpapanatili sa tuwiran at mapanuring tono ng tanong.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kapansin-pansing pag-uulit sa “Tingnan ninyo! Nakikita ninyo” dahil naroon kapwa ang pantawag-pansin at ang tahasang pandiwa sa Hebreo. Ang “nag-aasal na parang baliw” ay nagpapanatili sa leksikal na pag-aalinlangan sa pagitan ng tunay na kalagayan at ipinakikitang asal.
