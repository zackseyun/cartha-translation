base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/003.yaml
  text: David said to Ahimelech the priest[a], “The king has charged me with a matter and said to me[b], ‘Let no man know anything about the matter for which I am sending you and with which I have charged you.’ And I have directed the young men to a certain place.”
translation:
  language: tl
  text: Sinabi ni David kay Ahimelec, ang pari, “Inatasan ako ng hari tungkol sa isang bagay. Sinabi niya sa akin, ‘Walang sinumang dapat makaalam ng anuman[b] tungkol sa bagay na ipinapagawa niya sa akin at iniutos niya sa akin.’ Pinapunta ko naman ang mga kabataang lalaki sa isang itinakdang lugar[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa ganito-at-ganiyang lugar,” isang idyoma para sa lugar na hindi tinukoy o hindi ibinunyag.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “Huwag malaman ng sinumang lalaki ang anuman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוַּנִי דָבָר
  choice: Inutusan ako ... tungkol sa isang bagay
  rationale: Pinananatili ng “inutusan” ang lakas ng צוה bilang utos o atas, samantalang ang “tungkol sa isang bagay” ay likas na Filipino para sa דָבָר nang hindi labis na tinutukoy ang nilalaman.
- source_word: אִישׁ אַל יֵדַע מְאוּמָה
  choice: Walang sinumang dapat makaalam ng anuman
  rationale: Ang אִישׁ ay literal na “lalaki,” ngunit sa negatibong pahayag na ito ay pangkalahatan ang diwa. Ang “walang sinuman” ay malinaw at natural sa modernong Filipino; itinatala sa talababa ang literal na anyo.
- source_word: הַדָּבָר
  choice: ang bagay
  rationale: Tumutukoy ang דָבָר sa usapin o atas na pinag-uusapan. Ang “bagay” ay tuwiran at hindi nagpapasok ng higit na tiyak na kahulugang wala sa Hebreo.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחֲךָ
  choice: na dahilan ng pagsusugo ko sa iyo
  rationale: Inihahayag nito ang kaugnayan ng “bagay” sa pagsusugo ng hari kay David, habang pinananatili ang pandiwang diwa ng שׁלח.
- source_word: וַאֲשֶׁר צִוִּיתִךָ
  choice: at sa iniutos ko sa iyo
  rationale: Pinananatili ang pag-uulit ng צוה bilang “iniutos,” pati ang bahagyang masalimuot na pagkakaugnay ng dalawang sugnay sa Hebreo.
- source_word: וְאֶת־הַנְּעָרִים
  choice: At ... sa mga kabataang lalaki
  rationale: Maaaring mangahulugan ang נְעָרִים ng mga kabataan, tauhan, o tagapaglingkod. Ang “mga kabataang lalaki” ang pinakatuwirang salin at hindi agad nagpapasya sa kanilang katayuan.
- source_word: יוֹדַעְתִּי
  choice: itinuro ko
  rationale: Ang anyong Hiphil ng ידע ay pangunahing “ipinaalam” o “ipakilala.” Sa kasunod na pariralang tumutukoy sa lugar, ang “itinuro ko ... ang lugar” ay natural na Filipino at pinananatili ang diwa ng pagpapabatid nang hindi tahasang nagdaragdag ng utos na pumunta roon.
- source_word: אֶל־מְקוֹם פְּלֹנִי אַלְמוֹנִי
  choice: ang isang tiyak na lugar
  rationale: Ang tambalang idyoma ay tumutukoy sa isang lugar na hindi tinukoy o sadyang hindi ibinunyag. Malinaw sa pangunahing teksto ang “isang tiyak na lugar,” habang nasa talababa ang mas literal na idyoma.
