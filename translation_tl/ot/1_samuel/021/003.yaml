translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Pinanatili ang tuwirang pananalita at ang bahagyang tensiyon sa pagkakabuo ng atas ng hari. Inilagay ang mga pananda ng talababa sa mismong mga pariralang kanilang ipinaliliwanag.
