revisions:
- from: Sinabi ni David kay Ahimelec na pari, “Inutusan ako ng hari tungkol sa isang bagay. Sinabi niya sa akin, ‘Walang sinumang dapat makaalam ng anuman[b] tungkol sa bagay na dahilan ng pagsusugo ko sa iyo at sa iniutos ko sa iyo.’ At itinuro ko sa mga kabataang lalaki ang isang tiyak na lugar[a].”
  to: Sinabi ni David kay Ahimelec, ang pari, “Inatasan ako ng hari tungkol sa isang bagay. Sinabi niya sa akin, ‘Walang sinumang dapat makaalam ng anuman[b] tungkol sa bagay na ipinapagawa niya sa akin at iniutos niya sa akin.’ Pinapunta ko naman ang mga kabataang lalaki sa isang itinakdang lugar[a].”
  rationale: Itinama ang mga panghalip upang ang hari ang manatiling nagsusugo at nag-uutos kay David sa iniulat na pananalita. Inayos din ang huling sugnay upang maipahayag ang pagdidirekta ng mga kabataang lalaki tungo sa isang hindi isiniwalat na lugar. Napanatili ang umiiral na mga pananda at paliwanag sa talababa.
