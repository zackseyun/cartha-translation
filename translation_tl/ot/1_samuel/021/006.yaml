  to: Sumagot si David sa pari, “Tiyak, hindi kami lumalapit sa mga babae[a] mula nang umalis ako[b], at banal ang mga kagamitan ng mga kabataang lalaki[c], kahit pangkaraniwan lamang ang paglalakbay na ito. Lalo pa nga ngayong araw, magiging banal ito sa pamamagitan ng kagamitan[d].”
