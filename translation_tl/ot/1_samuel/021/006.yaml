base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/006.yaml
  text: David answered the priest and said to him[a], “Indeed, women have been kept from us as before, when I went out, and the young men’s vessels are holy, though it is an ordinary journey[d][c][b]. How much more today will it be made holy in the vessel.”
translation:
  language: tl
  text: Sumagot si David sa pari, “Tiyak, hindi kami lumalapit sa mga babae[a] mula nang umalis ako[b], at banal ang mga kagamitan ng mga kabataang lalaki[c], kahit pangkaraniwan lamang ang paglalakbay na ito. Lalo pa nga ngayong araw, magiging banal ito sa pamamagitan ng kagamitan[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “isang babae ang ipinagkait sa amin,” o “inilayo namin ang aming sarili sa mga babae.” Tumutukoy ang pananalitang Hebreo sa pagpipigil sa pakikipagtalik bilang paghahanda sa paghawak ng mga banal na bagay.
    reason: lexical_alternative
  - marker: b
    text: Literal, “gaya ng kahapon at noong isang araw.” Isa itong idyomang Hebreo para sa mga nakaraang araw; inuunawa naman ito ng ilan bilang “sa loob ng humigit-kumulang tatlong araw.”
    reason: lexical_alternative
  - marker: c
    text: Ang “mga kagamitan” ay maaaring tumukoy sa gamit ng mga kabataang lalaki; inuunawa naman ito ng ilan bilang eupemismo para sa kanilang mga katawan o buong pagkatao.
    reason: lexical_alternative
  - marker: d
    text: Mahirap unawain ang Hebreo ng huling bahagi. Maaari rin itong isalin, “bagaman pangkaraniwan ang paglalakbay, ngayong araw ay magiging banal ito kaugnay ng kagamitan,” o sa katulad na paraan.
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה עֲצֻרָה לָנוּ
  choice: hindi kami lumapit sa mga babae
  rationale: Natural na Tagalog ito para sa pagpipigil sa pakikipagtalik na ipinahihiwatig ng Hebreo. Inilalagay sa talababa ang mas literal na anyo upang mapanatili ang ambiguwidad ng konstruksyon.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: gaya ng dati
  rationale: Ipinahihiwatig ng idyomang Hebreo ang mga nakaraang araw o dating kalagayan, ngunit hindi tiyak na kailangang bilangin bilang eksaktong tatlong araw.
- source_word: בְּצֵאתִי
  choice: nang umalis ako
  rationale: Natural na temporal na pagsasalin ng infinitive construct na tumutukoy sa pag-alis ni David.
- source_word: כְלֵי הַנְּעָרִים
  choice: mga sisidlan ng mga kabataang lalaki
  rationale: Pinananatili ng “mga sisidlan” ang literal na kahulugan at ang posibleng pagtukoy sa kagamitan o, bilang eupemismo, sa katawan o pagkatao ng mga lalaki.
- source_word: קֹדֶשׁ
  choice: banal
  rationale: Tuwirang inilalarawan nito ang nakatalaga o sagradong kalagayan at hindi ito nililimitahan sa ritwal na kalinisan lamang.
- source_word: וְהוּא דֶּרֶךְ חֹל
  choice: kahit pangkaraniwan lamang ang paglalakbay na ito
  rationale: Ipinananatili ang pagsalungat ng חֹל na pangkaraniwan sa banal; hindi nito ipinahihiwatig na masama ang paglalakbay.
- source_word: וְאַף כִּי
  choice: lalo pa nga
  rationale: Inihahatid nito ang karaniwang nagpapatingkad o a-fortiori na puwersa ng parirala habang kinikilalang mahirap ang sintaks.
- source_word: הַיּוֹם יִקְדַּשׁ
  choice: ngayong araw, magiging banal iyon
  rationale: Pinananatili ang pandiwang diwa at hinaharap o resultang kalagayan nang hindi labis na tinutukoy kung pasibo o reflexive ang anyo.
- source_word: בַּכֶּלִי
  choice: sa sisidlan
  rationale: Pinananatili ang leksikal na kaugnayan sa naunang כְלֵי at hindi agad nilulutas kung kagamitan, katawan, o ibang bagay ang tinutukoy.
theological_decisions:
- issue: Wika ng ritwal na kabanalan kaugnay ng pagpipigil at banal na tinapay
  choice: Isinalin sa mga katawagang “banal” at pagpipigil sa mga babae nang hindi dinaragdagan ng mga kategoryang doktrinal na wala sa teksto.
  alternative: Unawain ito bilang moral na kadalisayan lamang o bilang praktikal na kalinisan lamang.
  rationale: Ang konteksto ay ang pagiging karapat-dapat tumanggap ng itinalagang tinapay. Pinananatili ng salin ang kaibahan ng banal at pangkaraniwan at ang ritwal na kahandaan nang hindi ito ginagawang tahasang moral na paghatol.
- issue: Malabong huling sugnay
  choice: Pinanatili ang literal at malabong “magiging banal iyon sa sisidlan.”
  alternative: Linawin bilang banal ang kagamitan, katawan, o tinapay.
  rationale: Mahirap at pinagtatalunan ang referent at sintaks sa Hebreo; ang tahasang pagpili ng isa ay mag-aalis ng tunay na ambiguwidad.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pari” at “banal” bilang karaniwang biblikal na salita. Sadyang pinanatili ang “sisidlan” at ang bahagyang alanganing huling sugnay dahil tunay na malabo ang Hebreo; ipinaliliwanag sa mga talababa ang mahahalagang alternatibo.
