base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/009.yaml
  text: And David said to Ahimelech[a], “Is there not here under your hand a spear or a sword? For I did not take my sword or my weapons in my hand[c][b], because the king’s matter was urgent.”
translation:
  language: tl
  text: Sinabi ni David kay Ahimelek, “Mayroon ka bang sibat o espada rito na nasa iyong pag-iingat[a]? Hindi ko kasi nadala ang espada ko ni ang iba ko pang kagamitan[b], sapagkat apurahan ang usapin ng hari[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa ilalim ng iyong kamay,” isang idyomang maaaring mangahulugang “nasa iyong magagamit” o “nasa iyong pag-aari.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang espada ko at ang mga kasangkapan ko” o “ang espada ko at ang mga sandata ko.” Malawak ang kahulugan ng salitang Hebreo at maaaring tumukoy sa mga gamit o kagamitan, at sa kontekstong ito ay malamang na kabilang ang mga sandata.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang gawain ng hari” o “ang utos ng hari.” Ang salitang Hebreo ay maaaring mangahulugang salita, bagay, usapin, gawain, o atas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד לַאֲחִימֶלֶךְ
  choice: Sinabi ni David kay Ahimelek
  rationale: Likas na panimulang salaysay sa modernong Tagalog; pinanatili ang pangalan ayon sa transliterasyon ng Hebreo.
- source_word: וְאִין יֶשׁ פֹּה
  choice: Wala ka bang ... rito
  rationale: Natural na anyo sa Tagalog ng negatibong tanong tungkol sa pagkakaroon ng isang bagay.
- source_word: תַחַת יָדְךָ
  choice: nasa iyong kamay
  rationale: Pinananatili ang kongkretong idyoma ng Hebreo, na mauunawaan din bilang nasa pag-iingat o pag-aari ng kausap.
- source_word: חֲנִית אוֹ חָרֶב
  choice: sibat o espada
  rationale: Tuwirang katumbas ng dalawang pang-isahang katawagan sa sandata.
- source_word: גַם חַרְבִּי וְגַם כֵּלַי
  choice: ang espada ko ni ang iba ko pang kagamitan
  rationale: Ang כְּלִי ay malawak ang saklaw—kasangkapan, kagamitan, o sandata. Ang 'kagamitan' ay nagpapanatili sa lawak nito, habang nililinaw ng 'iba ko pang' ang kaugnayan nito sa espada.
- source_word: לֹא לָקַחְתִּי בְיָדִי
  choice: Hindi ko ... nadala
  rationale: Natural na Tagalog para sa hindi pagdadala ng mga bagay; hindi inuulit nang literal ang 'sa aking kamay,' na magiging mabigat sa pangungusap.
- source_word: דְבַר הַמֶּלֶךְ
  choice: ang gawain ng hari
  rationale: Sapat na malawak upang tumukoy sa bagay, gawain, o atas na may kaugnayan sa hari nang hindi tiyak na nililimitahan ito sa isang pasalitang utos.
- source_word: נָחוּץ
  choice: apurahan
  rationale: Malinaw at kasalukuyang salitang Tagalog para sa isang bagay na kailangang maisagawa agad.
