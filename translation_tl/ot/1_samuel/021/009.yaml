  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “rito” at “sapagkat” para sa bahagyang pormal ngunit madaling maunawaang rehistro. Pinanatili sa mga talababa ang mga tunay na leksikal na kalabuan ng mga idyomang Hebreo.
