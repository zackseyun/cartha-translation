base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/005.yaml
  text: The priest answered David and said[a], “There is no ordinary bread on hand, but there is holy bread—if the young men have kept themselves from women.”
translation:
  language: tl
  text: Sumagot ang pari kay David, “Wala akong karaniwang tinapay na maibibigay, ngunit may banal na tinapay—kung ang mga kabataang lalaki ay umiwas man lamang sa pakikipagtalik sa mga babae.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umiwas mula sa isang babae.” Idyomang tumutukoy sa pag-iwas sa seksuwal na pakikipagtalik para sa ritwal na kalinisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם חֹל
  choice: karaniwang tinapay
  rationale: Ipinapahayag nito ang tinapay na hindi banal o nakatalaga, bilang malinaw na kaibahan ng לֶחֶם קֹדֶשׁ, nang hindi ipinahihiwatig na masama ang tinapay.
- source_word: אֶל תַּחַת יָדִי
  choice: na maibibigay
  rationale: Ang idyomang literal na “sa ilalim ng aking kamay” ay tumutukoy sa tinapay na nasa pag-iingat at maaaring ipamahagi ng pari; natural itong ipinahayag ayon sa gamit sa konteksto.
- source_word: כִּי אִם
  choice: ngunit
  rationale: 'Ipinakikilala nito ang pagbubukod at pagsalungat: walang karaniwang tinapay, ngunit may banal na tinapay.'
- source_word: לֶחֶם קֹדֶשׁ
  choice: banal na tinapay
  rationale: Tuwirang pinananatili ang kultikong kaibahan ng banal sa karaniwan at nauunawaan ito ng karaniwang mambabasa.
- source_word: אִם נִשְׁמְרוּ
  choice: kung ... ay umiwas
  rationale: Sa konstruksiyong ito, ang Niphal ng שׁמר ay nagsasaad ng pagpipigil o pag-iwas sa bagay na kasunod.
- source_word: הַנְּעָרִים
  choice: ang mga kabataang lalaki
  rationale: Pinananatili ang karaniwang leksikal na kahulugan nang hindi labis na tinutukoy kung sila ay mga lingkod o kasama.
- source_word: אַךְ מֵאִשָּׁה
  choice: sa pakikipagtalik sa mga babae
  rationale: Ang limitasyong ipinahihiwatig ng אַךְ ay naipapakita ng tiyak na layon ng pag-iwas. Nililinaw ng konteksto ng ritwal na kalinisan na seksuwal na pakikipagtalik ang tinutukoy, hindi ang pangkalahatang paglayo sa mga babae.
theological_decisions:
- issue: Kondisyon ng ritwal na kalinisan sa pagtanggap ng banal na tinapay
  choice: Inilalahad ang kondisyon bilang pag-iwas ng mga lalaki sa pakikipagtalik sa mga babae.
  alternative: “kung ang mga kabataang lalaki ay nakaiwas sa mga babae” o “sa isang babae”
  rationale: Seksuwal na pagpipigil kaugnay ng ritwal na kalinisan ang hinihingi sa konteksto, hindi pangkalahatang pag-iwas sa kababaihan o paghatol sa seksuwalidad. Ang salin ay malinaw ngunit hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “pari” bilang malinaw na katumbas ng הכהן at pinaikli ang Hebreong dobleng pormulang “sumagot ... at sinabi” tungo sa likas na “Sumagot ...” nang hindi binabago ang diwa.
