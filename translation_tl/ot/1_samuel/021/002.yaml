  yaml_path: translation/ot/1_samuel/021/002.yaml
  text: David came to Nob, to Ahimelech the priest. Ahimelech trembled when he met David and said to him, “Why are you alone, and no man is with you?”
translation:
  language: tl
  text: Dumating si David sa Nob, kay Ahimelec na pari. Nang salubungin ni Ahimelec si David, nanginig siya at sinabi rito, “Bakit nag-iisa ka at wala kang kasamang sinuman?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד
  choice: nanginig siya
  rationale: Ipinahahayag ang matinding pagkabalisa o pagkatakot ni Ahimelec sa natural at tuwirang Filipino, nang hindi tinutukoy ang dahilan nito.
- source_word: לִקְרַאת דָּוִד
  choice: Nang salubungin ni Ahimelec si David
  rationale: Ang לִקְרַאת ay tumutukoy sa pagharap o pagsalubong; ang sugnay na temporal ay natural sa Filipino at pinananatili ang kaugnayan nito sa panginginig.
- source_word: לְבַדֶּךָ
  choice: nag-iisa ka
  rationale: Karaniwang modernong Filipino para sa pagiging mag-isa.
- source_word: וְאִישׁ אֵין אִתָּךְ
  choice: at wala kang kasamang sinuman
  rationale: Natural na Filipino na pinananatili ang diwa ng Hebreong idiom na walang taong kasama si David.
