  source_fidelity: Tumpak ang pagkakakilanlan kay Doeg, ang pagiging isa niya sa mga lingkod ni Saul, ang pagtukoy sa kanya bilang Edomita, at ang ranggo niya sa mga pastol ni Saul. Gayunman, ang “Naroon nang araw na iyon” ay hindi likas na ayos sa Tagalog. Ang “pinanatili” ay mas mahusay na pangunahing salin ng נֶעְצָר kaysa “pinigilan,” na maaaring magpahiwatig lamang ng agarang paghadlang at hindi ng pagiging pinanatili o hinawakan. Nananatiling di-tiyak ang dahilan ng kanyang pagkakapanatili.
  naturalness: Mas natural at malinaw sa modernong Filipino Tagalog ang pambungad na “Noong araw na iyon, naroon ang isang lalaki...” Ang pinagsamang pangungusap ay pinananatili ang ugnayan ng Hebreong paglalarawan nang hindi nagiging mabigat.
  terminology: Ang “Yahweh,” “Doeg na Edomita,” at “pinuno ng mga pastol ni Saul” ay angkop. Ang “pinanatili sa harap ni Yahweh” ay nag-iingat sa kalabuan ng pariralang Hebreo at hindi naglalagay ng tiyak na ritwal o dahilan.
