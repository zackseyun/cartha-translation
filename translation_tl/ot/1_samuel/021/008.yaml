  text: וְ/שָׁ֡ם אִישׁ֩ מֵ/עַבְדֵ֨י שָׁא֜וּל בַּ/יּ֣וֹם הַ/ה֗וּא נֶעְצָר֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/שְׁמ֖/וֹ דֹּאֵ֣ג הָ/אֲדֹמִ֑י אַבִּ֥יר הָ/רֹעִ֖ים אֲשֶׁ֥ר לְ/שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/008.yaml
  text: A man of Saul’s servants was there that day[a], detained before Yahweh; his name was Doeg the Edomite, the chief of Saul’s shepherds.
translation:
  language: tl
  text: Noong araw na iyon, naroon ang isang lalaki na isa sa mga lingkod ni Saul, na pinanatili sa harap ni Yahweh[a]. Ang pangalan niya ay Doeg na Edomita, ang pinuno ng mga pastol ni Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pinigilan sa harap ni Yahweh” o “hinadlangan sa harap ni Yahweh.” Hindi sinasabi ng Hebreo kung bakit siya pinanatili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁם אִישׁ מֵעַבְדֵי שָׁאוּל בַּיּוֹם הַהוּא
  choice: Naroon nang araw na iyon ang isang lalaking kabilang sa mga lingkod ni Saul
  rationale: Likas sa modernong Tagalog ang ayos na ito at malinaw nitong ipinahihiwatig na ang lalaki ay isa sa pangkat ng mga lingkod ni Saul. Hindi dinagdagan ng tahasang panandang katumbas ng “ngayon,” na wala naman sa Hebreo.
- source_word: נֶעְצָר לִפְנֵי יְהוָה
  choice: Pinigilan siya sa harap ni Yahweh
  rationale: Ipinapahayag ng anyong balintiyak na siya ay pinigilan o pinanatili, ngunit hindi sinasabi ng teksto kung bakit. Iniiwasan ng salin ang pagdaragdag ng isang tiyak na ritwal o dahilan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan na kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וּשְׁמוֹ דֹּאֵג הָאֲדֹמִי
  choice: Ang pangalan niya ay Doeg na Edomita
  rationale: Natural na anyo ito ng pormulang pagpapakilala ng pangalan at pinananatili ang pagkakakilanlan niyang Edomita.
- source_word: אַבִּיר הָרֹעִים אֲשֶׁר לְשָׁאוּל
  choice: ang pinuno ng mga pastol ni Saul
  rationale: Sa kontekstong ito, malamang na tumutukoy ang אַבִּיר sa nakatataas o namumuno sa mga pastol, hindi lamang sa pinakamalakas sa kanila. Ang kaugnayan kay Saul ay likas na ipinahayag sa “mga pastol ni Saul.”
theological_decisions:
- issue: Paglalarawan sa dahilan ng pananatili ni Doeg sa santuwaryo
  choice: Pinigilan siya sa harap ni Yahweh
  alternative: Pinanatili siya sa harap ni Yahweh / hindi siya pinayagang umalis mula sa harap ni Yahweh
  rationale: Hindi tinutukoy ng Hebreo ang dahilan o eksaktong uri ng pagpigil. Pinananatili ng pangunahing salin at talababa ang kalabuan sa halip na magpasok ng isang tiyak na paliwanag na panritwal.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng banal na pangalan; pinananatili ito bilang Yahweh.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Hinati sa maiikling pangungusap upang maiwasan ang mabigat na pagkakabit ng mga sugnay, habang pinananatili ang daloy at lahat ng impormasyong nasa Hebreo.
