  text: וְ/עַתָּ֞ה הִנֵּ֥ה הַ/מֶּ֣לֶךְ מִתְהַלֵּ֣ךְ לִ/פְנֵי/כֶ֗ם וַ/אֲנִי֙ זָקַ֣נְתִּי וָ/שַׂ֔בְתִּי וּ/בָנַ֖/י הִנָּ֣/ם אִתְּ/כֶ֑ם וַ/אֲנִי֙ הִתְהַלַּ֣כְתִּי לִ/פְנֵי/כֶ֔ם מִ/נְּעֻרַ֖/י עַד הַ/יּ֥וֹם הַ/זֶּֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/002.yaml
  text: And now[a], look, the king is walking before you, and I have grown old and gray, and here are my sons with you[c][b]. And I have walked before you from my youth until this day.
translation:
  language: tl
  text: At ngayon, tingnan ninyo, ang hari ay lumalakad sa unahan ninyo[a]. Ako naman ay tumanda na at pinuti na ng uban[b], at narito, ang mga anak ko ay kasama ninyo. At lumakad ako sa unahan ninyo[c] mula sa aking kabataan hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang hari ay nangunguna sa inyo” o “namumuno sa inyo.” Ang Hebreong idyomang “lumakad sa unahan” ay maaaring tumukoy sa pampublikong pamumuno.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “tumanda na ako at naging ubanin.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nanguna ako sa inyo” o “namuno ako sa inyo.” Sadyang pinagkatulad ni Samuel ang dati niyang pampublikong papel at ang papel ngayon ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na ו at ang panandang pangdiskurso at pamanahon na עַתָּה.
- source_word: הִנֵּה
  choice: tingnan ninyo
  rationale: Likas at makabagong panawag-pansin sa maramihang kausap, nang hindi gumagamit ng makalumang anyo.
- source_word: מִתְהַלֵּךְ לִפְנֵיכֶם
  choice: ay lumalakad sa unahan ninyo
  rationale: Pinananatili ang larawang 'lumalakad sa unahan' at ang nagpapatuloy na diwa ng participle; maaaring magpahiwatig ito ng pampublikong pamumuno.
- source_word: זָקַנְתִּי וָשַׂבְתִּי
  choice: tumanda na at pinuti na ng uban
  rationale: Ipinahahayag ang kalagayang naabot at pinananatili ang kongkretong larawan ng pagiging ubanin.
- source_word: וּבָנַי הִנָּם אִתְּכֶם
  choice: at narito ang mga anak ko kasama ninyo
  rationale: Ang 'narito' ay nagpapahayag ng presentasyonal na diin ng הִנָּם.
- source_word: הִתְהַלַּכְתִּי לִפְנֵיכֶם
  choice: lumakad ako sa unahan ninyo
  rationale: Parehong idyoma ang ginamit gaya sa hari upang mapanatili ang sinadyang retorikal na pagkakatulad ng kanilang pampublikong papel.
- source_word: מִנְּעֻרַי עַד הַיּוֹם הַזֶּה
  choice: mula sa aking kabataan hanggang sa araw na ito
  rationale: Tuwirang temporal na saklaw mula sa kabataan ni Samuel hanggang sa kasalukuyang araw ng pagsasalita.
theological_decisions:
- issue: Kahulugan ng 'lumakad sa unahan ninyo'
  choice: Pinanatili ang Hebreong larawan sa pangunahing teksto.
  alternative: mamuno sa inyo / pangunahan kayo
  rationale: Ang idyoma ay maaaring tumukoy sa pampublikong pamumuno, ngunit ang literal na larawan ay mahalaga sa pagkakatulad ng hari at ni Samuel at hindi dapat paliitin sa iisang pagpapakahulugan.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang maramihang “ninyo” ayon sa kausap sa Hebreo. Iniwasan ang makalumang “narito, masdan” bilang panawag-pansin, ngunit pinanatili ang “narito” kung saan natural nitong naihahatid ang presentasyonal na diin.
