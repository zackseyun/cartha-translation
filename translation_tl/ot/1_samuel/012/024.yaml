revisions:
- from: Matakot lamang kayo kay Yahweh at paglingkuran ninyo siya nang tapat at buong puso, sapagkat pag-isipan ninyo kung gaano kadakila ang ginawa niya sa inyo.[a]
  to: Matakot lamang kayo kay Yahweh at paglingkuran ninyo siya nang tapat at nang buong puso, sapagkat pag-isipan ninyo ang mga dakilang bagay na ginawa niya sa inyo.[a]
  rationale: Inayos ang pang-abay na pagkakabit ng “buong puso” upang tumpak na maipahayag ang dalawang magkakaugnay na pariralang Hebreo. Ginawang “ang mga dakilang bagay na ginawa niya” ang huling sugnay upang mas tuwirang katawanin ang idyomatikong hiphil ng גדל. Pinanatili ang “sa inyo” sa pangunahing teksto at ang talababa upang hindi sapilitang lutasin ang ambiguwidad ng עִמָּכֶם.
