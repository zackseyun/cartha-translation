  source_fidelity: 'Tumpak sa kabuuan ang mga pangunahing termino: ang אַךְ ay naipahayag ng “lamang,” ang ירא ng “matakot,” ang יהוה ng “Yahweh,” at ang עבד ng “paglingkuran.” Ang “pag-isipan ninyo” ay katanggap-tanggap na mapagnilay na pagpapahayag ng רְאוּ. Gayunman, ang “at buong puso” ay hindi wastong nakakabit sa pandiwang “paglingkuran”; kailangang markahan itong pang-abay upang malinaw na kapwa inilalarawan ng “nang tapat” at “nang buong puso” ang paglilingkod. Ang “mga dakilang bagay na ginawa niya” ay mas tuwirang naihahayag ang אֵת אֲשֶׁר הִגְדִּיל kaysa sa “kung gaano kadakila ang ginawa niya.”'
