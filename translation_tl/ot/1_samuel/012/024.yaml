base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/024.yaml
  text: Only fear Yahweh and serve him faithfully with all your heart[a], for consider what great things he has done with you.
translation:
  language: tl
  text: Matakot lamang kayo kay Yahweh at paglingkuran ninyo siya nang tapat at nang buong puso, sapagkat pag-isipan ninyo ang mga dakilang bagay na ginawa niya sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kasama ninyo”; maaari ring maunawaan na “para sa inyo” o “sa gitna ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: lamang
  rationale: Ipinahahayag nito ang mahigpit at madiing pagtutuon ng payo sa nararapat na tugon ng Israel.
- source_word: יְרְאוּ
  choice: matakot
  rationale: Pinananatili ang biblikal na diwa ng takot na may kasamang pagpipitagan at masunuring pagkilala sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa baybay-Tagalog ang personal na pangalang kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: at paglingkuran ninyo siya
  rationale: Ang 'paglingkuran' ay tuwirang katumbas ng עבד at sumasaklaw kapuwa sa pagsamba at sa tapat na pagsunod.
- source_word: בֶּאֱמֶת
  choice: nang tapat
  rationale: Sa kontekstong ito, inilalarawan ng אֱמֶת ang tunay, matatag, at maaasahang paglilingkod; likas sa modernong Tagalog ang 'nang tapat.'
- source_word: בְּכָל לְבַבְכֶם
  choice: at buong puso
  rationale: Likas na idyomang Tagalog ito para sa lubos at taos-pusong debosyon.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan ng naunang tagubilin.
- source_word: רְאוּ
  choice: pag-isipan ninyo
  rationale: Bagaman literal na 'tingnan,' hinihingi rito ng pandiwa ang mapagnilay na pagkilala sa ginawa ng Diyos.
- source_word: אֵת אֲשֶׁר הִגְדִּיל
  choice: kung gaano kadakila ang ginawa niya
  rationale: Inihahayag nito sa natural na Tagalog ang idyomatikong gamit ng hiphil ng גדל para sa paggawa ng dakilang bagay.
- source_word: עִמָּכֶם
  choice: sa inyo
  rationale: Natural itong maluwag na pahayag sa Tagalog na hindi lubusang nagsasara sa saklaw ng Hebreong 'kasama ninyo,' bagaman maaaring maunawaan ang kilos bilang ginawa rin para sa kanila; nililinaw sa talababa ang leksikal na ambiguwidad.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng 'Yahweh' ang pangalan sa halip na palitan ito ng titulong 'PANGINOON,' nang hindi nag-aangkat ng natatanging doktrinang denominasyonal.
- issue: Saklaw ng 'takot' sa Diyos
  choice: matakot
  alternative: igalang; pagpitaganan
  rationale: Pinananatili ng 'matakot' ang bigat at tensiyon ng ירא; sa kontekstong tipan, hindi ito basta sindak kundi may kasamang pagpipitagan at pagsunod.
- issue: Kilos ng Diyos na עִמָּכֶם
  choice: sa inyo
  alternative: kasama ninyo; para sa inyo; sa gitna ninyo
  rationale: May saklaw ang Hebreong pang-ukol na maaaring tumukoy sa pakikitungo ng Diyos kasama, sa gitna, o alang-alang sa Israel. Hindi tahasang nilulutas ng salin ang lahat ng posibilidad, at itinatala sa talababa ang pinakamalapit na literal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang biblikal na 'matakot' at ang likas na 'paglingkuran ninyo siya nang tapat at buong puso.' Iniwasan ang sobrang literal ngunit alanganing 'ginawa niya kasama ninyo' sa pangunahing teksto, habang pinanatili sa talababa ang tunay na ambiguwidad ng עִמָּכֶם.
