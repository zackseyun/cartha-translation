base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/014.yaml
  text: If you fear Yahweh and serve him and listen to his voice and do not rebel against the command of Yahweh[b][a], then both you and the king who reigns over you will follow Yahweh your God.
translation:
  language: tl
  text: Kung kayo ay matatakot kay Yahweh, maglilingkod sa kanya, makikinig sa kanyang tinig[a], at hindi maghihimagsik laban sa utos ni Yahweh, kung gayon, kapuwa kayo at ang haring naghahari sa inyo ay susunod kay Yahweh na inyong Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “makikinig sa kanyang tinig” ay maaari ring unawaing “susundin ninyo si Yahweh,” sapagkat ang Hebreong pananalita ay madalas tumutukoy sa masunuring pakikinig.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na Hebreo, “at kayo ay magiging—kapuwa kayo at ang haring naghahari sa inyo—kasunod ni Yahweh na inyong Diyos.” Ang ipinahihiwatig ay patuloy na magiging tapat kay Yahweh o susunod sa kanya ang bayan at ang kanilang hari.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Malinaw na nagpapakilala ng kondisyon sa konteksto ng tipan.
- source_word: תִּירְאוּ אֶת־יְהוָה
  choice: may takot kayo kay Yahweh
  rationale: Pinananatili ang bigat ng ירא bilang takot na may kasamang pagpipitagan, nang hindi ito pinapahina tungo sa paggalang lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: paglilingkuran ninyo siya
  rationale: Saklaw ng עבד ang tapat at mapagsambang paglilingkod; pinananatili ng “paglilingkuran” ang malawak na diwa nito.
- source_word: וּשְׁמַעְתֶּם בְּקֹלוֹ
  choice: pakikinggan ang kanyang tinig
  rationale: Pinananatili ang Hebreong larawan ng pakikinig sa tinig, habang inilalahad sa talababa na madalas itong mangahulugan ng masunuring pakikinig.
- source_word: וְלֹא תַמְרוּ אֶת־פִּי יְהוָה
  choice: hindi maghihimagsik laban sa utos ni Yahweh
  rationale: Ang מרה ay tahasang paghihimagsik, at ang literal na “bibig ni Yahweh” ay idyoma para sa kanyang ipinahayag na utos.
- source_word: גַּם אַתֶּם וְגַם הַמֶּלֶךְ
  choice: kapuwa kayo at ang hari
  rationale: Likas na katumbas sa Tagalog ng magkatambal na גַּם ... וְגַם.
- source_word: אֲשֶׁר מָלַךְ עֲלֵיכֶם
  choice: na naghahari sa inyo
  rationale: Tinutukoy ang haring kasalukuyang nasa tungkulin; natural sa Tagalog ang aspektong nagpapatuloy.
- source_word: אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: susunod kay Yahweh na inyong Diyos
  rationale: Sa ganitong gamit, ang אַחַר ay tumutukoy sa pagsunod at katapatan; ang mas literal ngunit bitin na anyo ay pinananatili sa talababa.
theological_decisions:
- issue: Diwa ng pangwakas na sugnay na אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: kapuwa kayo at ang hari ... ay susunod kay Yahweh na inyong Diyos
  alternative: “at kayo ay magiging—kapuwa kayo at ang hari ...—kasunod ni Yahweh na inyong Diyos”
  rationale: Ang positibong diwa ng patuloy na pagsunod at katapatan ang pinakamalinaw sa konteksto, ngunit hindi ganap na tuwiran ang sintaks ng Hebreo. Kaya hindi ikinubli ang literal na anyo at ang likas nitong kalabuan; inilagay ito sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang pangalang Yahweh, ang tipanang bigat ng “takot” at “maghihimagsik,” at ang Hebreong larawan ng pakikinig sa tinig. Isinaad sa talababa ang di-tuwirang sintaks ng pangwakas na sugnay upang hindi maitago ang tunay na kalabuan ng teksto.
