id: 1SA.12.22
reference: 1 Samuel 12:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֠י לֹֽא יִטֹּ֤שׁ יְהוָה֙ אֶת עַמּ֔/וֹ בַּ/עֲב֖וּר שְׁמ֣/וֹ הַ/גָּד֑וֹל כִּ֚י הוֹאִ֣יל יְהוָ֔ה לַ/עֲשׂ֥וֹת אֶתְ/כֶ֛ם ל֖/וֹ לְ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/022.yaml
  text: For Yahweh will not forsake his people[a], for the sake of his great name[b], because Yahweh has been pleased to make you his people.
translation:
  language: tl
  text: Sapagkat hindi pababayaan ni Yahweh ang kanyang bayan[a], alang-alang sa kanyang dakilang pangalan, sapagkat minarapat ni Yahweh na gawin kayong bayan niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iiwan” o “itatakwil.”
    reason: lexical_alternative
  - marker: b
    text: O “sapagkat pinili ni Yahweh na gawin kayong isang bayan para sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִטֹּשׁ
  choice: hindi pababayaan
  rationale: Ang נטש ay tumutukoy sa pag-iwan o pagpapabaya. Likas sa modernong Tagalog ang “hindi pababayaan” at pinananatili nito ang bigat ng pangakong hindi iiwan ni Yahweh ang kanyang bayan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang isinasalin sa baybay na “Yahweh” ang banal na pangalang יְהוָה sa halip na palitan ito ng isang titulo.
- source_word: עַמּוֹ
  choice: ang kanyang bayan
  rationale: Sa konteksto, ang עַם ay bayan na may pambansa at tipanang pagkakakilanlan; malinaw at natural ang “kanyang bayan.”
- source_word: בַּעֲבוּר
  choice: alang-alang sa
  rationale: Ipinahahayag ng parirala ang dahilan o pagsasaalang-alang na nakaugnay sa dakilang pangalan ni Yahweh.
- source_word: שְׁמוֹ הַגָּדוֹל
  choice: kanyang dakilang pangalan
  rationale: Pinananatili nito ang tuwirang idyomang Hebreo, kung saan ang “pangalan” ay kaugnay ng ipinahayag na pagkakakilanlan, dangal, at reputasyon ng Diyos.
- source_word: הוֹאִיל
  choice: minarapat
  rationale: Ipinahahayag ng הוֹאִיל ang kusang-loob at ikinalulugod na pasiya. Ang “minarapat” ay dignipikado at nagpapahiwatig ng malayang kagandahang-loob nang hindi nagdaragdag ng teknikal na doktrina.
- source_word: לַעֲשׂוֹת אֶתְכֶם לוֹ לְעָם
  choice: na gawin kayong bayan niya
  rationale: Malinaw nitong ipinahahayag na ginawa o itinatag ni Yahweh ang Israel bilang bayang pag-aari niya, habang pinananatili ang diin ng לוֹ.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng kusang pasiya sa הוֹאִיל
  choice: minarapat
  alternative: pinili o ikinalugod
  rationale: Pinananatili ng “minarapat” ang diwa ng kusang-loob at mapagbiyayang pasiya, nang hindi tahasang nilulutas kung ang pangunahing diin ay kasiyahan, pagpili, o pagpapasya.
- issue: Kaugnayan ng dakilang pangalan sa hindi pagpapabaya
  choice: alang-alang sa kanyang dakilang pangalan
  alternative: dahil sa kanyang dakilang pangalan
  rationale: Ipinakikita ng בַּעֲבוּר na ang pangalan ni Yahweh ang batayan o isinasaalang-alang sa kanyang pagkilos, nang hindi nagpapaliit dito sa payak na sanhi lamang.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado at madaling maunawaan. Ginamit ang “bayan” para sa tipanan at pambansang diwa ng עַם, at “minarapat” upang mapanatili ang mapagbiyayang kusang pasiya sa הוֹאִיל. Inilagay ang [b] pagkatapos ng buong sugnay na tinutukoy nito.
