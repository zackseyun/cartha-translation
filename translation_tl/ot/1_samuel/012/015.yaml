  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִם לֹ֤א תִשְׁמְעוּ֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/מְרִיתֶ֖ם אֶת פִּ֣י יְהוָ֑ה וְ/הָיְתָ֧ה יַד יְהוָ֛ה בָּ/כֶ֖ם וּ/בַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/015.yaml
  text: But if you do not listen to the voice of Yahweh and rebel against the command of Yahweh[a], then the hand of Yahweh will be against you and against your fathers.
translation:
  language: tl
  text: Ngunit kung hindi ninyo pakikinggan ang tinig ni Yahweh at maghihimagsik kayo laban sa utos ni Yahweh, ang kamay ni Yahweh ay magiging laban sa inyo at sa inyong mga ninuno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “inyong mga ama.” Ang ilang sinaunang salin at maraming tagapagpaliwanag ay nagbabasa ng “inyong hari,” na umaangkop sa agarang konteksto ng babala ni Samuel kapwa sa bayan at sa kanilang hari.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ang kondisyong kasalungat ng naunang talata, habang pinananatili ang pangatnig.
- source_word: לֹא תִשְׁמְעוּ בְּקוֹל יְהוָה
  choice: hindi ninyo pakikinggan ang tinig ni Yahweh
  rationale: Pinananatili ang Hebreong idyomang ‘makinig sa tinig,’ na sa konteksto ay nagpapahiwatig ng masunuring pakikinig nang hindi tahasang pinapalitan ng ‘susunod.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalang YHWH ayon sa pamantayan ng proyekto.
- source_word: וּמְרִיתֶם
  choice: at maghihimagsik kayo
  rationale: Ang pandiwang מרה ay tumutukoy sa mapanghamong paghihimagsik, hindi lamang sa karaniwang pagsuway.
- source_word: אֶת פִּי יְהוָה
  choice: laban sa utos ni Yahweh
  rationale: Ang literal na ‘bibig ni Yahweh’ ay idyoma para sa ipinahayag niyang utos; malinaw at likas sa Filipino ang ‘utos.’
- source_word: וְהָיְתָה יַד יְהוָה
  choice: ang kamay ni Yahweh ay magiging
  rationale: Pinananatili ang biblikal na talinghagang ‘kamay ni Yahweh’ para sa aktibong kapangyarihan niya sa paghatol.
- source_word: בָּכֶם
  choice: laban sa inyo
  rationale: Sa konteksto ng paghatol, malinaw na pasalungat ang diwa ng pang-ukol.
- source_word: וּבַאֲבֹתֵיכֶם
  choice: at sa inyong mga ninuno
  rationale: Ang אבות ay literal na ‘mga ama’ ngunit karaniwang tumutukoy sa mga ninuno; ginagamit ang natural na Filipino habang itinatala sa talababa ang literal at tekstuwal na alternatibo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang personal na banal na pangalan nang hindi gumagamit ng katawagang maaaring magkubli rito.
- issue: Huling pariralang וּבַאֲבֹתֵיכֶם
  choice: at sa inyong mga ninuno
  alternative: at sa inyong hari
  rationale: Ang Masoretic Text/WLC ay may ‘inyong mga ama/ninuno,’ kaya iyon ang sinusunod sa pangunahing teksto. Gayunman, ang ‘inyong hari’ ay mahalagang sinaunang alternatibong pagbasa na umaangkop sa agarang konteksto at hindi dapat ikubli.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga biblikal na larawang ‘tinig’ at ‘kamay,’ samantalang nilinaw ang idyomang ‘bibig ni Yahweh’ bilang ‘utos ni Yahweh.’
