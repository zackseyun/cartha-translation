    issue: “Tingnan ninyo” para sa הִנֵּה
    rationale: Ang הִנֵּה ay deiktikong pantawag-pansin (“Narito”/“Masdan”), hindi pangmaramihang pautos na “tingnan ninyo.”
  - severity: low
    issue: “nagluluklok ako ng hari upang maghari sa inyo”
    rationale: Nauunawaan ang kahulugan, ngunit mas idiomatiko at tuwiran sa modernong Tagalog ang “nagtalaga ako ng hari upang mamahala sa inyo,” na inilalahad ang causative na pagtatalaga at ang pamumuno sa bayan.
  revised_text: Pagkatapos, sinabi ni Samuel sa buong Israel, “Narito, pinakinggan ko ang tinig ninyo sa lahat ng sinabi ninyo sa akin, at nagtalaga ako ng hari upang mamahala sa inyo.”
