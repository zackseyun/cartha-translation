base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/008.yaml
  text: When Jacob came into Egypt[a], your fathers cried out to Yahweh, and Yahweh sent Moses and Aaron[b], and they brought your fathers out of Egypt and settled them in this place.
translation:
  language: tl
  text: Nang dumating si Jacob sa Ehipto, dumaing sa Yahweh ang inyong mga ninuno[a]. Isinugo naman ni Yahweh sina Moises at Aaron, at inilabas nila mula sa Ehipto ang inyong mga ninuno at pinatira sila sa lugar na ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “inyong mga ama”; maaari ring isaling “inyong mga ninuno.”
    reason: lexical_alternative
  - marker: b
    text: O “at pinatira nila sila rito,” o “at ginawa nilang manirahan sila sa lugar na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר בָּא
  choice: Nang dumating
  rationale: Likas na panandang temporal sa Tagalog at malinaw na inilalahad ang pangyayaring sinusundan ng salaysay.
- source_word: וַיִּזְעֲקוּ
  choice: humingi ng tulong
  rationale: Ipinahahayag ang apurahan at mapagkalingang pagdaing na taglay ng זעק, sa natural na modernong Tagalog.
- source_word: אֲבוֹתֵיכֶם
  choice: ang inyong mga ninuno
  rationale: Sa kontekstong pangkasaysayan, mas natural at malinaw kaysa literal na 'mga ama ninyo,' habang pinananatili ang kolektibong pagtukoy sa mga naunang salinlahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang pangalang tipan na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: וַיּוֹצִיאוּ
  choice: inilabas nila
  rationale: Pinananatili ang maramihang simuno, na likas na tumutukoy kina Moises at Aaron bilang mga kasangkapang naglabas sa mga ninuno mula sa Ehipto.
- source_word: וַיֹּשִׁבוּם
  choice: pinatira sila
  rationale: 'Tumpak na ipinahahayag ang causative na diwa ng pandiwa: ginawa nilang manirahan o tumahan ang mga ninuno sa lugar na iyon.'
theological_decisions:
- issue: Pagbaybay sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang ginamit ng tekstong Hebreo; pinananatili ng 'Yahweh' ang pagkakaiba nito sa titulong 'Panginoon.'
- issue: Mga taong tinutukoy ng maramihang pandiwang וַיּוֹצִיאוּ
  choice: sina Moises at Aaron ang ipinahihiwatig ng 'nila'
  alternative: Maaaring unawain sa mas malawak na diwang ang Diyos ang tunay na tagapagligtas
  rationale: Ang pinakamalapit na gramatikal na antecedent ng maramihang pandiwa ay sina Moises at Aaron, ngunit hindi nito itinatanggi ang naunang pahayag na si Yahweh ang nagsugo sa kanila.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'mga ninuno' para sa malinaw na pangkasaysayang sanggunian at 'humingi ng tulong' upang natural na maipakita ang matinding pagdaing. Inilagay ang mga talababa sa mismong bahaging tinutukoy ng mga ito.
