  to: 'At sinabi ng buong bayan kay Samuel, “Ipanalangin mo kami, na iyong mga lingkod, kay Yahweh na iyong Diyos, at huwag mo kaming hayaang mamatay. Sapagkat idinagdag namin ang kasamaang ito sa lahat ng aming kasalanan: ang humingi ng hari para sa amin.”'
