base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/019.yaml
  text: 'Then all the people said to Samuel[a], “Pray to Yahweh your God for your servants, and do not let us die, for we have added to all our sins this evil: to ask for a king for ourselves.”'
translation:
  language: tl
  text: 'At sinabi ng buong bayan kay Samuel, “Ipanalangin mo kami, na iyong mga lingkod, kay Yahweh na iyong Diyos, at huwag mo kaming hayaang mamatay. Sapagkat idinagdag namin ang kasamaang ito sa lahat ng aming kasalanan: ang humingi ng hari para sa amin.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: At sinabi ng buong bayan
  rationale: Likas na salaysay sa Tagalog ang “At sinabi,” at ang “buong bayan” ay malinaw na nagpapahayag sa kolektibong כָל הָעָם.
- source_word: הִתְפַּלֵּל בְּעַד עֲבָדֶיךָ
  choice: Idalangin mo kami na iyong mga lingkod
  rationale: Pinagsasama ng “idalangin” ang pananalangin at ang diwang namamagitan para sa iba na nililinaw ng בְּעַד. Ang “kami na iyong mga lingkod” ay natural na Tagalog at pinananatili ang mapagpakumbabang pagtukoy ng bayan sa sarili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang Yahweh sa halip na palitan ito ng titulong “Panginoon.”
- source_word: אֱלֹהֶיךָ
  choice: na iyong Diyos
  rationale: Pinananatili ang ikalawang panauhang isahan na “iyong Diyos,” na nakatuon kay Samuel.
- source_word: וְאַל נָמוּת
  choice: upang hindi kami mamatay
  rationale: Ipinahahayag ang hinihiling na negatibong kalalabasan kasunod ng utos na manalangin; natural ito sa modernong Tagalog nang hindi dinaragdagan ang sanhi o paraan.
- source_word: כִּי יָסַפְנוּ עַל כָּל חַטֹּאתֵינוּ רָעָה
  choice: Sapagkat sa lahat ng aming kasalanan ay idinagdag pa namin ang kasamaang ito
  rationale: Pinananatili ng “idinagdag pa” ang pinagsama-samang diwa ng יסף עַל, at ng “kasamaan” ang moral na bigat ng רָעָה.
- source_word: לִשְׁאֹל לָנוּ מֶלֶךְ
  choice: ang humingi ng hari para sa aming sarili
  rationale: Malinaw na inilalahad ang nilalaman ng kasamaang ipinagtapat at pinananatili ang reflexive na diin ng לָנוּ.
theological_decisions:
- issue: Ang ugnayang ipinahihiwatig ng “Yahweh na iyong Diyos”
  choice: Pinanatili ang “Yahweh na iyong Diyos.”
  alternative: “Yahweh na aming Diyos” o isang paliwanag na si Samuel ang tagapamagitan
  rationale: Ang mismong pananalita ng bayan ay bumabaling kay Samuel bilang nananalangin para sa kanila. Pinananatili ng salin ang retorikal at teolohikal na tensiyon nang hindi ipinahihiwatig na hindi Diyos ng Israel si Yahweh.
- issue: Ang pagkilala ng bayan sa paghingi ng hari
  choice: Tinawag itong “kasamaang ito” na idinagdag sa lahat ng kanilang kasalanan.
  alternative: Palambutin bilang “pagkakamaling ito” o ipaliwanag kung bakit masama ang paghingi ng hari
  rationale: Moral na “kasamaan” ang tahasang ipinagtatapat sa teksto; hindi dapat pahinain o dagdagan ng paliwanag na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “idalangin” bilang maikli at natural na pandiwang intersesoryo; iniwasan ang sobrang teknikal na “mamagitan.” Walang talababa dahil sapat na naihahatid sa pangunahing teksto ang diwa ng הִתְפַּלֵּל בְּעַד.
