revisions:
- from: At sinabi niya sa kanila, “Saksi ninyo si Yahweh[a], at saksi rin sa araw na ito ang kaniyang pinahiran[b], na wala kayong anumang natagpuan sa kamay ko.” At sinabi nila[c], “Saksi siya.”
  to: At sinabi niya sa kanila, “Saksi laban sa inyo si Yahweh[a], at saksi rin ang kaniyang pinahiran[b] sa araw na ito, na wala kayong natagpuan ni anuman sa kamay ko.” At sinabi nila[c], “Saksi siya.”
  rationale: Binago ang pangunahing salin ng בָּכֶם upang maiwasan ang Filipino na pagbasa na si Yahweh ay saksi ng bayan o nasa panig nila. Pinanatili sa talababa ang mas literal na saklaw ng pang-ukol at ang legal na konteksto. Wala nang ibang pagbabagong semantiko sa talata.
