base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/005.yaml
  text: And he said to them[a], “Yahweh is witness against you, and his anointed is witness this day, that you have found nothing in my hand.” And they said[c][b], “He is witness.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Saksi laban sa inyo si Yahweh[a], at saksi rin ang kaniyang pinahiran[b] sa araw na ito, na wala kayong natagpuan ni anuman sa kamay ko.” At sinabi nila[c], “Saksi siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal, “Saksi si Yahweh sa gitna ninyo” o “kasama ninyo.” Legal ang diwa sa konteksto: tumatayong saksi si Yahweh sa usaping ito; kaya maaaring isalin na “laban sa inyo.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “kaniyang pinahiran” ay tumutukoy rito sa hari, si Saul, at hindi tuwirang ginagamit bilang mas huling titulong “Mesiyas.”
    reason: cultural_note
  - marker: c
    text: Pang-isahan ang huling pandiwa sa Hebreo—“at sinabi niya”—ngunit sa konteksto ay sama-samang tugon ito ng bayan, kaya “sinabi nila.”
    reason: textual_note
lexical_decisions:
- source_word: עֵד
  choice: saksi
  rationale: Tumutukoy ito sa isang saksi sa legal o tipanang diwa, na angkop sa hayagang pagpapatunay ni Samuel sa kaniyang kawalang-sala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng transliterasyon sa halip na palitan ito ng isang titulo.
- source_word: בָּכֶם
  choice: saksi ninyo
  rationale: Pinananatili nito ang saklaw ng Hebreong pang-ukol, na maaaring mangahulugang saksi sa gitna, kasama, o sa usaping may kinalaman sa kanila, nang hindi labis na pinatitindi bilang tahasang 'laban sa inyo.'
- source_word: מְשִׁיחוֹ
  choice: kaniyang pinahiran
  rationale: Tumutukoy rito sa haring pinahiran, si Saul; pinananatili ang literal na diwa nang hindi ipinapasok ang mas huling teknikal na titulong 'Mesiyas.'
- source_word: הַיּוֹם הַזֶּה
  choice: sa araw na ito
  rationale: Pinananatili ang pormal at pampublikong himig ng pahayag habang natural pa rin sa modernong Filipino.
- source_word: מְצָאתֶם
  choice: natagpuan
  rationale: Ipinahahayag ang natapos na pagsisiyasat ng bayan na humantong sa kasalukuyang pampublikong pagpapatotoo.
- source_word: בְּיָדִי
  choice: sa kamay ko
  rationale: Pinananatili ang malinaw na Hebreong idyoma para sa anumang nasa pag-aari o kontrol ni Samuel.
- source_word: מְאוּמָה
  choice: anumang
  rationale: Kasama ng pagtanggi na 'wala,' natural nitong ipinahahayag ang 'wala ni anuman.'
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: sinabi niya ... sinabi nila
  rationale: Ang una ay tumutukoy kay Samuel. Bagaman pang-isahan ang huling pandiwa sa Hebreo, ipinakikita ng konteksto na ito ang sama-samang tugon ng bayan.
theological_decisions:
- issue: Pagpapakahulugan sa מְשִׁיחוֹ sa konteksto ng kasalukuyang hari
  choice: kaniyang pinahiran
  alternative: kaniyang Mesiyas
  rationale: Ang tuwirang tinutukoy ay si Saul bilang haring pinahiran ni Yahweh. Iniiwasan nitong ipasok sa talata ang isang tuwirang mesiyanikong o kristolohikal na kahulugang hindi hinihingi ng konteksto.
- issue: Forensikong diwa ng עֵד יְהוָה בָּכֶם
  choice: Saksi ninyo si Yahweh
  alternative: Saksi laban sa inyo si Yahweh
  rationale: May legal na himig ang pahayag, ngunit malawak ang gamit ng בָּכֶם. Pinananatili ng pangunahing salin ang tunay na kalabuan, at nililinaw sa talababa ang posibleng forensikong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pampublikong-legal na himig, ang pangalang Yahweh, at ang idyomang “sa kamay ko.” Ang mga marker na [a], [b], at [c] ay nasa mismong teksto at tumutugma sa mga talababa.
