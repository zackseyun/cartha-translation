  source_fidelity: Tumpak ang salin sa Hebreo. Ang “Si Yahweh ang” ay angkop na pagsasalin ng pangungusap na nagpapakilala kay Yahweh bilang kumilos; ang “nagtalaga” ay isang ligtas at kontekstuwal na pagsasalin ng עָשָׂה kaugnay nina Moises at Aaron. Ang “naglabas ... mula sa lupain ng Ehipto” ay malinaw na tumutugma sa pormula ng Exodo.
