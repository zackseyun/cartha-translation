reference: 1 Samuel 12:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר שְׁמוּאֵ֖ל אֶל הָ/עָ֑ם יְהוָ֗ה אֲשֶׁ֤ר עָשָׂה֙ אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֔ן וַ/אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת אֲבֹתֵי/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/006.yaml
  text: Then Samuel said to the people[b][a], “Yahweh is the one who appointed Moses and Aaron and who brought your fathers up from the land of Egypt.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Samuel sa bayan, “Si Yahweh ang nagtalaga kina Moises at Aaron[a] at naglabas sa inyong mga ninuno[b] mula sa lupain ng Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “gumawa kay Moises at kay Aaron.” Sa kontekstong ito, malamang na tumutukoy ang pandiwa sa pagtatalaga o pagtatatag sa kanila sa kanilang mga tungkulin.'
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “inyong mga ama”; dito ay tumutukoy ito sa kanilang mga ninuno o naunang salinlahi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi ni Samuel
  rationale: Ang waw-consecutive ay nagsusulong ng salaysay. Likas sa makabagong Tagalog ang “Pagkatapos ay sinabi” upang ipakita ang pagkakasunod-sunod ng pangyayari.
- source_word: אֶל הָעָם
  choice: sa bayan
  rationale: Ang הָעָם ay tumutukoy sa sambayanan ng Israel na kinakausap ni Samuel; malinaw at marangal sa Tagalog ang “sa bayan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר עָשָׂה אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: ang nagtalaga kina Moises at Aaron
  rationale: Bagaman karaniwang nangangahulugang “gumawa” ang עָשָׂה, sa kontekstong ito ay tumutukoy ito sa pagtatatag o pagtatalaga kina Moises at Aaron sa kanilang tungkulin. Iniiwasan ng “nagtalaga” ang maling pahiwatig na nilikha lamang sila bilang mga tao.
- source_word: וַאֲשֶׁר הֶעֱלָה
  choice: at naglabas
  rationale: Ang Hiphil ng עלה ay literal na “nagpaakyat” o “nag-ahon,” ngunit sa pormulang tumutukoy sa Exodo, mas natural at malinaw sa Tagalog ang “naglabas.”
- source_word: אֶת אֲבֹתֵיכֶם
  choice: sa inyong mga ninuno
  rationale: Literal na “inyong mga ama” ang Hebreo, ngunit sa konteksto ay tumutukoy ito sa naunang mga salinlahi ng Israel. Ang “mga ninuno” ang natural at hindi malabong katumbas sa Tagalog, habang inilalahad sa talababa ang mas literal na anyo.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: mula sa lupain ng Ehipto
  rationale: Malapit nitong sinusundan ang pormal na pariralang Hebreo at malinaw na tinutukoy ang pinanggalingang lugar sa Exodo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulong “PANGINOON.”
- issue: Kahulugan ng עָשָׂה kaugnay nina Moises at Aaron
  choice: nagtalaga kina Moises at Aaron
  alternative: ginawa sina Moises at Aaron
  rationale: Binibigyang-diin ng konteksto ang pagkilos ni Yahweh sa pagtatatag sa kanila bilang mga pinuno. Gayunman, pinananatili sa talababa ang literal na posibilidad upang hindi maitago ang lawak ng salitang Hebreo.
- issue: Blangkong sugnay na יְהוָה אֲשֶׁר
  choice: Si Yahweh ang nagtalaga ... at naglabas
  alternative: Yahweh, na nagtalaga ... at naglabas
  rationale: Ang hulma na “Si Yahweh ang…” ay likas na Tagalog na nagpapakilala at nagbibigay-diin kay Yahweh bilang gumaganap, nang hindi nagdaragdag ng hiwalay na pandiwang wala sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang “bayan” para sa sambayanang Israel at ang karaniwang anyong Filipino na “Moises” at “Ehipto.” Inilagay ang mga panandang [a] at [b] kaagad pagkatapos ng mga salitang tinutukoy ng bawat talababa.
