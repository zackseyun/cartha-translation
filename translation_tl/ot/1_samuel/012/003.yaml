  text: הִנְ/נִ֣י עֲנ֣וּ בִ/י֩ נֶ֨גֶד יְהוָ֜ה וְ/נֶ֣גֶד מְשִׁיח֗/וֹ אֶת שׁוֹר֩ מִ֨י לָקַ֜חְתִּי וַ/חֲמ֧וֹר מִ֣י לָקַ֗חְתִּי וְ/אֶת מִ֤י עָשַׁ֨קְתִּי֙ אֶת מִ֣י רַצּ֔וֹתִי וּ/מִ/יַּד מִי֙ לָקַ֣חְתִּי כֹ֔פֶר וְ/אַעְלִ֥ים עֵינַ֖/י בּ֑/וֹ וְ/אָשִׁ֖יב לָ/כֶֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/003.yaml
  text: 'Here I am[a]; testify against me before Yahweh and before his anointed: whose ox have I taken, or whose donkey have I taken? Whom have I oppressed? Whom have I mistreated? From whose hand have I taken a bribe[b], that I should hide my eyes with it? I will restore it to you.'
translation:
  language: tl
  text: 'Narito ako. Magpatotoo kayo laban sa akin sa harap ni Yahweh at ng kanyang pinahiran: Kaninong baka ang kinuha ko? Kaninong asno ang kinuha ko? Sino ang inapi ko? Sino ang pinagmalupitan ko[a]? Mula sa kaninong kamay ako tumanggap ng suhol[b] upang ipikit ko ang aking mga mata dahil dito? Ibabalik ko iyon sa inyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dinurog.” Mahirap tiyakin ang pandiwang Hebreo; maaaring malawak itong tumukoy sa malupit na pagtrato o pananakit sa isang tao.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “pantubos” o “kabayaran,” ngunit ang kasunod na “ipikit ko ang aking mga mata” ay pumapabor sa kahulugang tiwaling bayad na bumabaluktot sa katarungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Narito ako
  rationale: Likas at marangal na pahayag ng paghaharap ng sarili sa modernong Tagalog.
- source_word: עֲנוּ בִי
  choice: Magpatotoo kayo laban sa akin
  rationale: Ipinahahayag ang legal at pampublikong diwa ng pagsagot bilang mga saksi laban kay Samuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang nasa tekstong Hebreo.
- source_word: מְשִׁיחוֹ
  choice: kanyang pinahiran
  rationale: Tumutukoy sa haring pinahiran ni Yahweh sa kontekstong pangkasaysayan at hindi agad ipinapakahulugang tiyak na mesiyanikong titulo.
- source_word: שׁוֹר
  choice: baka
  rationale: Karaniwan at malinaw na katawagan sa Tagalog para sa hayop na tinutukoy sa usaping pag-aari; iniiwasan ang mas makitid na pagtukoy sa kasarian na hindi kailangang idiin dito.
- source_word: חֲמוֹר
  choice: asno
  rationale: Tumpak, malinaw, at dignified na katawagan sa modernong salin ng Bibliya.
- source_word: עָשַׁקְתִּי
  choice: inapi ko
  rationale: Sinasaklaw ang panlipunan at pangkabuhayang pagsasamantala na karaniwang ipinahihiwatig ng pandiwa.
- source_word: רַצּוֹתִי
  choice: pinagmalupitan ko
  rationale: Natural sa Tagalog at pinananatiling naiiba sa naunang 'inapi'; inilalahad sa talababa ang mas kongkretong posibleng diwang 'dinurog.'
- source_word: כֹפֶר
  choice: suhol
  rationale: Bagaman maaari itong mangahulugang pantubos o kabayaran, itinuturo ng kasunod na pagpikit ng mga mata ang bayad na bumabaluktot sa katarungan.
- source_word: וְאַעְלִים עֵינַי בּוֹ
  choice: upang ipikit ko ang aking mga mata dahil dito
  rationale: Pinananatili ang idyomang tungkol sa mga mata at nililinaw ang kaugnayan ng tinanggap na bayad sa sadyang hindi pagpansin.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo ang nasa Hebreo, kaya pinananatili itong pangalan sa halip na palitan ng titulo.
- issue: Kahulugan ng מְשִׁיחוֹ sa kontekstong maharlika
  choice: kanyang pinahiran
  alternative: kanyang Mesiyas
  rationale: Ang agarang tinutukoy ay ang haring pinahiran ni Yahweh. Pinananatili ng salin ang leksikal na diwa nang hindi ipinapasok ang mas tiyak na kahulugang mesiyaniko.
- issue: Saklaw ng כֹפֶר
  choice: suhol
  alternative: pantubos o kabayaran
  rationale: Hindi itinatanggi ang mas malawak na leksikal na saklaw, ngunit ang pagpikit ng mga mata sa konteksto ng pampublikong pananagutan ay pumapabor sa tiwaling bayad.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang magkahiwalay na 'inapi' at 'pinagmalupitan' upang mapanatili ang dalawang magkaibang pandiwang Hebreo. Ang mga tanong ay tuwiran at angkop sa pampublikong paglilitis o pagpapatotoo.
