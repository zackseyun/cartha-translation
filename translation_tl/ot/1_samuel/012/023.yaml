  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: גַּ֣ם אָנֹכִ֗י חָלִ֤ילָ/ה לִּ/י֙ מֵ/חֲטֹ֣א לַֽ/יהוָ֔ה מֵ/חֲדֹ֖ל לְ/הִתְפַּלֵּ֣ל בַּעַדְ/כֶ֑ם וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם בְּ/דֶ֥רֶךְ הַ/טּוֹבָ֖ה וְ/הַ/יְשָׁרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/023.yaml
  text: As for me[a], far be it from me that I should sin against Yahweh by ceasing to pray for you[c][b]; and I will instruct you in the good and upright way.
translation:
  language: tl
  text: Kung tungkol sa akin, huwag nawang mangyari na magkasala ako kay Yahweh[a] sa pagtigil sa pananalangin para sa inyo. Ituturo ko sa inyo ang mabuti at matuwid na daan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ang pagsasatitik ng banal na pangalang YHWH sa Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: Kung tungkol sa akin
  rationale: Ipinahahayag nito ang mariing pagtukoy ni Samuel sa sarili at ang kaibahan ng sarili niyang pananagutan sa pananagutan ng bayan.
- source_word: חָלִילָה לִּי
  choice: huwag nawang mangyari
  rationale: Likas at marangal itong idyomang Filipino para sa mariing pagtanggi at pagkasuklam sa binabanggit na posibilidad.
- source_word: מֵחֲטֹא לַיהוָה
  choice: na magkasala ako kay Yahweh
  rationale: Pinananatili nito na ang hindi pananalangin ay tahasang kasalanan laban sa Diyos, hindi lamang pagkukulang sa tungkulin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: מֵחֲדֹל לְהִתְפַּלֵּל בַּעַדְכֶם
  choice: sa pagtigil sa pananalangin para sa inyo
  rationale: Malinaw nitong ipinakikitang ang tinutukoy na kasalanan ay ang paghinto ng pamamagitan sa panalangin alang-alang sa bayan.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: Ituturo ko sa inyo
  rationale: Ang Hiphil ng ירה ay maaaring mangahulugang magturo, magtagubilin, o pumatnubay; ang “ituturo” ay natural dito at angkop sa paggabay na moral at propetiko.
- source_word: בְּדֶרֶךְ הַטּוֹבָה וְהַיְשָׁרָה
  choice: ang mabuti at matuwid na daan
  rationale: 'Pinananatili ang talinghaga ng “daan” bilang paraan ng pamumuhay at ang dalawang magkaugnay ngunit hindi magkaparehong katangiang moral: mabuti at matuwid.'
theological_decisions:
- issue: Kung ang pagtigil ni Samuel sa pamamagitan ay simpleng pagpapabaya lamang o kasalanan laban sa Diyos
  choice: Tahasan itong inilalarawan bilang pagkakasala kay Yahweh.
  alternative: Ilarawan lamang ito bilang pagkukulang ni Samuel sa tungkulin bilang pinuno.
  rationale: Tuwirang sinasabi ng Hebreo ang מֵחֲטֹא לַיהוָה, kaya hindi dapat pahinain ang bigat nito bilang personal na pagkakasala laban sa Diyos.
- issue: Paglilipat ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pinananatili ng “Yahweh” ang personal na pangalan sa tekstong Hebreo, samantalang ang “PANGINOON” ay isang pamalit na titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “huwag nawang mangyari” upang maipahayag nang natural ang mariing Hebreong idyoma, at pinanatili ang “daan” bilang talinghaga para sa wastong pamumuhay.
