  text: גַּם עַתָּה֙ הִתְיַצְּב֣וּ וּ/רְא֔וּ אֶת הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה אֲשֶׁ֣ר יְהוָ֔ה עֹשֶׂ֖ה לְ/עֵינֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/016.yaml
  text: Now then[a], stand still and see this great thing that Yahweh is doing before your eyes.
translation:
  language: tl
  text: Ngayon nga, tumayo kayo at tingnan ninyo ang dakilang bagay na ito na ginagawa ni Yahweh[a] sa harap ng inyong mga mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; tradisyonal na isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Kaya ngayon
  rationale: Nagsisilbi itong panandang pangdiskurso na nag-uugnay sa naunang panawagan sa susunod na taimtim na utos. Likas sa modernong Tagalog ang “Kaya ngayon” at naipapakita ang puwersang transisyonal.
- source_word: הִתְיַצְּבוּ
  choice: tumayo kayo
  rationale: Ang Hitpael na pautos ay nananawagang pumuwesto at manatiling handang magmasid. Sa Tagalog, malinaw at natural ang “tumayo kayo”; ang kasunod na utos na tumingin ang nagbibigay ng diwang mapanuring paghihintay.
- source_word: וּרְאוּ
  choice: at tingnan ninyo
  rationale: Inaanyayahan ang mga tao na tuwirang masaksihan ang tanda. Ang “tingnan ninyo” ay natural na pautos at angkop sa tahasang layon nito.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: ang dakilang bagay na ito
  rationale: Malawak ang saklaw ng דָּבָר at maaaring mangahulugang bagay, pangyayari, o gawa. Pinananatili ng “dakilang bagay” ang lawak nito nang hindi labis na tinutukoy ang uri ng tanda.
- source_word: אֲשֶׁר יְהוָה עֹשֶׂה
  choice: na ginagawa ni Yahweh
  rationale: Ang participle na עֹשֶׂה ay naglalarawan sa kilos bilang nagaganap o nalalapit na sa pananaw ng nagsasalita. Ang kasalukuyang anyong “ginagawa” ay nagpapanatili sa masiglang paglalarawang iyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang transliterasyon ng personal na pangalang banal sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: לְעֵינֵיכֶם
  choice: sa harap mismo ng inyong mga mata
  rationale: Pinananatili nito ang matingkad na idyomang Hebreo at idiniriin na hayagan at tuwirang masasaksihan ng mga tao ang gagawin.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan habang ang talababa ay nagbibigay ng tradisyonal na salin nang hindi pinapalitan ang pangalan sa pangunahing teksto.
- issue: Panahunan ng עֹשֶׂה
  choice: ginagawa
  alternative: gagawin
  rationale: Bagaman ang pangyayari ay nalalapit pa sa daloy ng salaysay, participle ang anyong Hebreo at maaari itong ihayag nang masigla bilang nagaganap. Pinananatili ng “ginagawa” ang tensiyong ito sa halip na gawing payak na hinaharap.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang magalang na pangmaramihang “kayo/ninyo” at iniwasan ang arkaikong bokabularyo.
