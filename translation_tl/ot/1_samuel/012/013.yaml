id: 1SA.12.13
reference: 1 Samuel 12:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֥ה הַ/מֶּ֛לֶךְ אֲשֶׁ֥ר בְּחַרְתֶּ֖ם אֲשֶׁ֣ר שְׁאֶלְתֶּ֑ם וְ/הִנֵּ֨ה נָתַ֧ן יְהוָ֛ה עֲלֵי/כֶ֖ם מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/013.yaml
  text: And now[a], here is the king whom you have chosen, whom you have asked for; and look, Yahweh has set a king over you.
translation:
  language: tl
  text: At ngayon, narito ang haring pinili ninyo, ang haring hiningi ninyo; at tingnan ninyo, naglagay si Yahweh ng isang hari upang mamahala sa inyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili nito kapwa ang pang-ugnay na וְ at ang panandang pangpanahon na עַתָּה, na naghahatid sa kasalukuyang kongklusyon ni Samuel.
- source_word: הִנֵּה
  choice: narito
  rationale: Likas na panawag-pansin sa Filipino kapag ang tinutukoy na hari ay nasa harap ng mga tagapakinig.
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: ang haring pinili ninyo
  rationale: Tuwirang ipinapahayag ang natapos na pagpili ng bayan at nililinaw ang tinutukoy ng sugnay na may אֲשֶׁר.
- source_word: אֲשֶׁר שְׁאֶלְתֶּם
  choice: ang haring hiningi ninyo
  rationale: Sa konteksto, ang שׁאל ay paghingi o paghiling ng hari; natural sa modernong Filipino ang 'hiningi ninyo.'
- source_word: וְהִנֵּה
  choice: at tingnan ninyo
  rationale: Muling dinadala ang pansin ng bayan sa bunga ng kanilang kahilingan, habang iniiwasan ang alanganing pag-uulit ng 'narito.'
- source_word: נָתַן יְהוָה עֲלֵיכֶם מֶלֶךְ
  choice: naglagay si Yahweh ng isang hari upang mamahala sa inyo
  rationale: Ipinahahayag ng נתן kasama ng עַל ang paglalagay ng hari sa posisyon ng kapangyarihan sa bayan. Ang 'upang mamahala sa inyo' ay natural na Filipino para sa ugnayang ipinahihiwatig ng עֲלֵיכֶם, habang itinatala sa talababa ang mas literal na 'nagbigay.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulong 'Panginoon.'
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon o Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ng 'Yahweh' ang pagkakaiba nito sa isang titulo.
- issue: Ugnayan ng pagpili ng bayan at pagkilos ni Yahweh
  choice: 'Pinanatili ang dalawang pahayag: pinili at hiningi ng bayan ang hari, ngunit si Yahweh ang naglagay sa kanya upang mamahala.'
  alternative: Ipaliwanag ang isa bilang ganap na nagpapawalang-bisa sa isa pa
  rationale: Magkatabing inilalahad ng Hebreo ang pananagutan ng bayan at ang mapagpasiyang pagkilos ni Yahweh; hindi nilulutas ng salin ang tensiyong ito sa pamamagitan ng dagdag na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang pag-uulit na 'ang haring' upang maging malinaw at natural ang dalawang magkaugnay na sugnay. Ang 'tingnan ninyo' ay panawag-pansin, hindi utos na tumingin lamang sa pisikal na paraan.
