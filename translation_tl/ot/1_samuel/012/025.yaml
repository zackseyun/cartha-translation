base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/025.yaml
  text: But if you persist in doing evil[b][a], both you and your king will be swept away.
translation:
  language: tl
  text: Ngunit kung patuloy kayong gagawa ng masama[a], kapuwa kayo at ang inyong hari ay lilipulin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung gagawa kayo ng masama” o “kung kikilos kayo nang masama.” Binibigyang-diin sa Hebreo ang pandiwa sa pamamagitan ng infinitive absolute.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mapapawi,” “mapapahamak,” o “wawasakin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinahihiwatig ng pang-ugnay ang pagsalungat sa naunang pangako o pagpapala; natural sa Filipino ang “Ngunit kung.”
- source_word: הָרֵעַ תָּרֵעוּ
  choice: patuloy kayong gagawa ng masama
  rationale: Ang infinitive absolute na kasunod ng pandiwang may iisang ugat ay nagbibigay-diin. Naipahahayag ng “patuloy” ang diin nang hindi gumagamit ng di-likas na pag-uulit sa Filipino.
- source_word: גַּם אַתֶּם גַּם מַלְכְּכֶם
  choice: kapuwa kayo at ang inyong hari
  rationale: Pinananatili ng “kapuwa … at” ang pagsasama at pantay na pagkakasaklaw ng babala sa bayan at sa kanilang hari.
- source_word: תִּסָּפוּ
  choice: lilipulin
  rationale: Ang Niphal ng ספה ay maaaring tumukoy sa pagkalipol, pagkawasak, o pagkapawi sa ilalim ng hatol. Ang “lilipulin” ay natural, mariin, at hindi nililimitahan ang tiyak na paraan ng paghatol.
theological_decisions:
- issue: Uri ng hatol na ipinahayag laban sa bayan at sa hari
  choice: Isang malawak na babala ng pagkalipol sa ilalim ng hatol na sasaklaw kapuwa sa bayan at sa hari
  alternative: Tanging pagkatalo sa digmaan o tanging espirituwal na kapahamakan
  rationale: Hindi tinutukoy ng talata ang eksaktong anyo ng hatol. Kaya pinananatiling malawak ng “lilipulin” ang babala at hindi ito ikinakahon sa isang paraan lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “kayo” ayon sa Hebreo at ang “kapuwa … at” upang malinaw na saklaw ng babala ang bayan at ang hari.
