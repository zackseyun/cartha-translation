reference: 1 Samuel 12:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תִּרְא֗וּ כִּֽי נָחָ֞שׁ מֶ֣לֶךְ בְּנֵֽי עַמּוֹן֮ בָּ֣א עֲלֵי/כֶם֒ וַ/תֹּ֣אמְרוּ לִ֔/י לֹ֕א כִּי מֶ֖לֶךְ יִמְלֹ֣ךְ עָלֵ֑י/נוּ וַ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם מַלְכְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/012.yaml
  text: When you saw that Nahash king of the Ammonites was coming against you[a], you said to me, ‘No, but a king shall reign over us’—though Yahweh your God was your king.
translation:
  language: tl
  text: Nang makita ninyong dumarating upang salakayin kayo si Nahas, ang hari ng mga Ammonita, sinabi ninyo sa akin, “Hindi! Sa halip, isang hari ang maghahari sa amin”—bagaman si Yahweh na inyong Diyos ang inyong hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dahil walang hayag na pandiwa sa sugnay na Hebreo, maaari rin itong isalin na “si Yahweh na inyong Diyos ang hari ninyo noon” o “si Yahweh na inyong Diyos ang hari ninyo ngayon.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ כִּי
  choice: Nang makita ninyong
  rationale: Ginagawang likas sa Tagalog ang pangyayaring nagsilbing dahilan ng sumunod na kahilingan, habang pinananatili ang diwa ng tuwirang pagkakita.
- source_word: נָחָשׁ
  choice: Nahas
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: ang hari ng mga Ammonita
  rationale: Likas na katawagan sa Tagalog para sa hari ng bayang Ammon.
- source_word: בָּא עֲלֵיכֶם
  choice: dumarating upang salakayin kayo
  rationale: Sa kontekstong militar, ang בוא + על ay nagpapahiwatig ng paglusob o pagdating laban sa isang bayan.
- source_word: וַתֹּאמְרוּ לִי
  choice: sinabi ninyo sa akin
  rationale: Tuwirang katumbas na malinaw at natural sa makabagong Tagalog.
- source_word: לֹא כִּי
  choice: Hindi!
  rationale: Ipinapakita ang mariing pagtanggi at pagpipilit ng bayan; ang kasunod na pangungusap ang nagsasaad ng nais nilang mangyari.
- source_word: מֶלֶךְ יִמְלֹךְ עָלֵינוּ
  choice: Isang hari ang maghahari sa amin
  rationale: Pinananatili ang pag-uulit ng ugat na 'hari/maghahari' at ang mariing paghingi nila ng monarkiya.
- source_word: יהוה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal na יהוה sa anyong karaniwang kinikilalang Yahweh.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Pinananatili ang tipanang pagtukoy at ang pangmaramihang ikalawang panauhan.
- source_word: מַלְכְּכֶם
  choice: ang inyong hari
  rationale: Ang Hebreo ay sugnay na walang hayag na pandiwa; ang anyong Tagalog ay maaari ring manatiling walang tahasang panandang pangnagdaan o pangkasalukuyan.
theological_decisions:
- issue: Walang hayag na copula o panahunan sa וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם
  choice: si Yahweh na inyong Diyos ang inyong hari
  alternative: si Yahweh na inyong Diyos ang hari ninyo noon / ang hari ninyo ngayon
  rationale: Hindi nilalagyan ng tiyak na panahunan ang sugnay sa pangunahing teksto, kaya napapanatili ang tunay na kalabuan kung ito ay nakatuon sa nakaraang kalagayan o nagpapahayag din ng nagpapatuloy na paghahari ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Nahas” at “mga Ammonita” bilang likas na anyong Tagalog. Ang tandang padamdam sa “Hindi!” ay nagpapanatili sa mariing pagtutol na ipinahihiwatig ng לֹא כִּי; ang dash ay malinaw na nag-uugnay sa kahilingan ng bayan at sa pagsaway ni Samuel.
