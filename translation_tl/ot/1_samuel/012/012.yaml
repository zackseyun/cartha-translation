  to: Nang makita ninyong dumarating upang salakayin kayo si Nahas, ang hari ng mga Ammonita, sinabi ninyo sa akin, “Hindi! Sa halip, isang hari ang maghahari sa amin”—bagaman si Yahweh na inyong Diyos ang inyong hari.[a]
