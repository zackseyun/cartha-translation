  source_fidelity: Tumpak ang pangunahing pagsasalin sa pagkakita nila sa pagdating ni Nahas upang lumaban sa kanila, sa pagtukoy kay Nahas bilang hari ng mga Ammonita, at sa pangwakas na sugnay na walang ipinapasok na panahunan sa Hebreo. Gayunman, ang לֹא כִּי ay hindi lamang simpleng “Hindi!”; naghahayag ito ng pagtanggi na sinusundan ng ipinalit na kahilingan. Idinagdag ang “Sa halip” upang maipakita ang ugnayang ito.
  naturalness: Natural at marangal ang ayos ng pangungusap sa makabagong Filipino. Ang “Sa halip” ay malinaw at idiomatiko sa tuwirang pananalita, at ang “si Yahweh na inyong Diyos ang inyong hari” ay likas na nakapagpapanatili ng walang-tiyak-na-panahunan na nominal na sugnay.
  terminology: Ang “Nahas,” “mga Ammonita,” “Yahweh,” at “Diyos” ay angkop at magkakatugma. Napananatili ang “hari/maghahari,” na sumasalamin sa pagbibigay-diin ng Hebreo sa monarkiya at paghahari.
