  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יְרֻבַּ֣עַל וְ/אֶת בְּדָ֔ן וְ/אֶת יִפְתָּ֖ח וְ/אֶת שְׁמוּאֵ֑ל וַ/יַּצֵּ֨ל אֶתְ/כֶ֜ם מִ/יַּ֤ד אֹֽיְבֵי/כֶם֙ מִ/סָּבִ֔יב וַ/תֵּשְׁב֖וּ בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/011.yaml
  text: And Yahweh sent Jerubbaal and Bedan and Jephthah and Samuel[a], and he delivered you from the hand of your enemies all around[b], and you lived in safety.
translation:
  language: tl
  text: At isinugo ni Yahweh sina Jerubaal[a], Bedan[b], Jefte, at Samuel, at iniligtas niya kayo mula sa kamay ng mga kaaway ninyo sa lahat ng panig, at namuhay kayong ligtas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Jerubaal ay isa pang pangalan ni Gideon (tingnan ang Mga Hukom 6:32; 7:1).
    reason: cross_reference
  - marker: b
    text: 'Hebreo: “Bedan.” Hindi tiyak kung sino ang tinutukoy; ipinapalagay ng ilang tagapagpaliwanag na ang tinutukoy rito ay si Barak o, bagaman mas bihira, si Abdon.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיִּשְׁלַח
  choice: isinugo
  rationale: Likas at marangal na salin ng pandiwang 'nagpadala/nagsugo' kapag mga taong inatasan ng Diyos ang tinutukoy.
- source_word: יְרֻבַּעַל
  choice: Jerubaal
  rationale: Pinananatili ang pangalang nasa tekstong Hebreo; ipinapaliwanag sa talababa na ito ay isa pang pangalan ni Gideon.
- source_word: בְּדָן
  choice: Bedan
  rationale: Pinananatili ang anyo ng pangalang nasa WLC/MT at hindi tahimik na pinapalitan ng Barak o Abdon.
- source_word: יִפְתָּח
  choice: Jefte
  rationale: Ginagamit ang nakasanayang anyong Filipino ng pangalan.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Ginagamit ang karaniwang anyo ng pangalan sa Filipino.
- source_word: וַיַּצֵּל
  choice: iniligtas
  rationale: Malinaw na ipinahahayag ang pagliligtas mula sa panganib o kapangyarihan ng kaaway.
- source_word: מִיַּד אֹיְבֵיכֶם
  choice: mula sa kamay ng inyong mga kaaway
  rationale: Pinananatili ang malinaw na metaporang Hebreo na ang 'kamay' ay tumutukoy sa kapangyarihan o kontrol.
- source_word: מִסָּבִיב
  choice: sa palibot
  rationale: Inihahayag ang ideya ng mga kaaway na nakapaligid sa kanila nang hindi nagdaragdag ng di-tiyak na detalye.
- source_word: וַתֵּשְׁבוּ בֶּטַח
  choice: namuhay kayong ligtas
  rationale: Natural na Filipino para sa paninirahan o pamumuhay nang panatag at walang banta.
theological_decisions:
- issue: Pagkakakilanlan ni בְּדָן
  choice: Bedan ang pinanatili sa pangunahing teksto.
  alternative: Barak o, mas bihira, Abdon
  rationale: Bedan ang mababasa sa tekstong Hebreo. Dahil hindi tiyak ang pagkakakilanlan, inilalahad sa talababa ang mga mungkahing alternatibo sa halip na baguhin ang pangunahing teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “sina” upang natural na ipakilala ang serye ng mga pangalan. Pinanatili ang magkakasunod na ugnayang “at” ng Hebreo at hindi ginawang tahasang layunin o bunga ang huling sugnay.
