base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/010.yaml
  text: Then they cried out to the LORD and said, “We have sinned, because we have forsaken the LORD and have served the Baals and the Ashtaroths. But now, deliver us from the hand of our enemies, and we will serve you.”
translation:
  language: tl
  text: Pagkatapos, dumaing sila sa PANGINOON at sinabi, “Nagkasala kami, sapagkat tinalikuran namin ang PANGINOON at naglingkod kami sa mga Baal at mga Astarot. Ngunit ngayon, iligtas mo kami mula sa kamay ng aming mga kaaway, at maglilingkod kami sa iyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: dumaing sila
  rationale: Ipinahahayag ang masidhing paghingi ng tulong sa Diyos, hindi lamang karaniwang pagsigaw.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Karaniwang marangal na salin sa Tagalog ng banal na pangalang YHWH, na minarkahan sa malalaking titik.
- source_word: עָזַבְנוּ
  choice: tinalikuran namin
  rationale: Natural na Tagalog para sa pagtalikod o pagpapabaya sa katapatan sa PANGINOON.
- source_word: הַבְּעָלִים
  choice: mga Baal
  rationale: Pinananatili ang anyong maramihan ng Hebreo at ang pangalan/tawag sa mga diyos na Baal.
- source_word: הָעַשְׁתָּרוֹת
  choice: mga Astarot
  rationale: Transliterasyon ng pambabaeng maramihang katawagan sa mga diyosang Ashtoreth/Astarte.
- source_word: מִיַּד אֹיְבֵינוּ
  choice: mula sa kamay ng aming mga kaaway
  rationale: Pinananatili ang malinaw at nauunawaang Hebreong idyoma para sa kapangyarihan o kontrol ng kaaway.
theological_decisions:
- issue: Ugnayan ng pag-amin at dahilan
  choice: “Nagkasala kami, sapagkat…”
  alternative: “Nagkasala kami na…”
  rationale: 'Ang כִּי ay likas na nagpapakilala ng dahilan o paliwanag: ang kanilang kasalanan ay ang pagtalikod sa PANGINOON at paglilingkod sa ibang mga diyos.'
- issue: Pangako ng paglilingkod
  choice: “maglilingkod kami sa iyo”
  alternative: “paglilingkuran ka namin”
  rationale: Parehong posible, ngunit ang napiling anyo ay tuwirang sumasalamin sa וְנַעַבְדֶךָ at inuugnay sa naunang “naglingkod kami” sa mga Baal at Astarot.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “PANGINOON” para sa tetragrammaton, at pinanatili ang mga pangalang “Baal” at “Astarot” sa maramihan.
