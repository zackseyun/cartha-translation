  to: Hindi ba panahon ngayon ng anihan ng trigo? Tatawag ako kay Yahweh, at magpapadala[a] siya ng kulog[b] at ulan. Sa gayon, malalaman at makikita ninyo na napakalaki ng kasamaang ginawa ninyo sa paningin ni Yahweh nang humingi kayo ng hari para sa inyong sarili.
