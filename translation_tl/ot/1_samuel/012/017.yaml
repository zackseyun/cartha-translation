  text: הֲ/ל֤וֹא קְצִיר חִטִּים֙ הַ/יּ֔וֹם אֶקְרָא֙ אֶל יְהוָ֔ה וְ/יִתֵּ֥ן קֹל֖וֹת וּ/מָטָ֑ר וּ/דְע֣וּ וּ/רְא֗וּ כִּֽי רָעַתְ/כֶ֤ם רַבָּה֙ אֲשֶׁ֤ר עֲשִׂיתֶם֙ בְּ/עֵינֵ֣י יְהוָ֔ה לִ/שְׁא֥וֹל לָ/כֶ֖ם מֶֽלֶךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/017.yaml
  text: Is it not wheat harvest today? I will call to Yahweh[a], and he will send thunder and rain, so that you may know and see that your wickedness is great[b], which you have done in the sight of Yahweh by asking for yourselves a king.
translation:
  language: tl
  text: Hindi ba panahon ngayon ng anihan ng trigo? Tatawag ako kay Yahweh, at magpapadala[a] siya ng kulog[b] at ulan. Sa gayon, malalaman at makikita ninyo na napakalaki ng kasamaang ginawa ninyo sa paningin ni Yahweh nang humingi kayo ng hari para sa inyong sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “magbibigay siya ng kulog at ulan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga tinig”; sa kontekstong ito, tumutukoy ito sa kulog.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Hindi ba
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang mga nakikinig.
- source_word: קְצִיר חִטִּים הַיּוֹם
  choice: panahon ngayon ng pag-aani ng trigo
  rationale: Likas sa modernong Tagalog at malinaw na ipinahahayag ang kasalukuyang panahon ng anihan.
- source_word: אֶקְרָא אֶל יְהוָה
  choice: Tatawag ako kay Yahweh
  rationale: Ang קרא אל ay pagtawag o paglapit sa Diyos; ang “tatawag ... kay” ay natural sa Tagalog at pinananatili ang tuwirang banal na pangalan.
- source_word: וְיִתֵּן
  choice: magpapadala siya
  rationale: Bagaman literal na “magbibigay,” mas likas ang “magpapadala” para sa mga pangyayari sa panahon habang pinananatili ang banal na pagkilos.
- source_word: קֹלוֹת
  choice: kulog
  rationale: Literal na “mga tinig,” ngunit sa konteksto ng ulan at panahon ay tumutukoy sa kulog.
- source_word: וּמָטָר
  choice: ulan
  rationale: Tuwirang katumbas sa Tagalog.
- source_word: וּדְעוּ וּרְאוּ
  choice: malalaman ninyo at makikita
  rationale: Pinananatili ang dalawang pandiwa at ang diin sa pagkilala at pagkakita sa kabuluhan ng tanda.
- source_word: רָעַתְכֶם רַבָּה
  choice: napakalaki ng kasamaang ginawa ninyo
  rationale: Ipinahahayag ng רעה rito ang moral na kasamaan, at ng רַבָּה ang matinding antas nito.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Likas na katumbas ng idyomang Hebreo at pinananatili ang diwa ng pagsusuri o paghatol ng Diyos.
- source_word: לִשְׁאֹל לָכֶם מֶלֶךְ
  choice: nang humingi kayo ng hari para sa inyong sarili
  rationale: Pinananatili ang kilos ng paghingi at ang pansariling pakinabang na ipinahihiwatig ng לָכֶם.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na banal na pangalan nang hindi ipinapalit ang isang titulo.
- issue: Likas na katangian ng hiniling na hari
  choice: kasamaang ginawa ninyo ... nang humingi kayo ng hari
  alternative: ang pagkakaroon mismo ng hari ay likas na masama
  rationale: Iniuugnay ng talata ang malaking kasamaan sa ginawa nilang paghingi ng hari sa kontekstong ito; hindi dinaragdagan ng salin ang teksto ng mas malawak na pahayag tungkol sa lahat ng monarkiya.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang “panahon ... ng pag-aani” sa halip na mas teknikal o makalumang pananalita, at pinanatili ang retorikal na tanong, ang dalawang pandiwang “malalaman” at “makikita,” at ang banal na pangalang Yahweh.
