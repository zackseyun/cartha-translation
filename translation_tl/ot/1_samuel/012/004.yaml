  yaml_path: translation/ot/1_samuel/012/004.yaml
  text: And they said[a], “You have not oppressed us, and you have not mistreated us, and you have not taken anything from any man's hand.”
translation:
  language: tl
  text: At sinabi nila, “Hindi mo kami inapi, at hindi mo kami pinagmalupitan, at hindi ka kumuha ng anuman mula sa kamay ng sinuman.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa kamay ng sinuman.” Maaaring tumukoy ang parirala sa pagtanggap o pagkuha ng anumang bayad, regalo, o suhol mula kaninuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: At sinabi nila
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi dinaragdagan ang tiyak na temporal na diwa.
- source_word: עֲשַׁקְתָּנוּ
  choice: hindi mo kami inapi
  rationale: Ang עשׁק ay tumutukoy sa pang-aapi, pagsasamantala, o pandaraya sa pamamagitan ng kapangyarihan; malinaw at natural sa konteksto ang “inapi.”
- source_word: רַצּוֹתָנוּ
  choice: hindi mo kami pinagmalupitan
  rationale: Ang רצץ ay literal na maaaring mangahulugang durugin o baliin, ngunit dito ay matalinghagang tumutukoy sa marahas o mapang-abusong pagtrato. Naipahahayag ng “pinagmalupitan” ang tindi nito nang hindi nagpapahiwatig ng literal na pagdurog.
- source_word: לָקַחְתָּ מִיַּד אִישׁ מְאוּמָה
  choice: wala kang anumang kinuha mula sa kamay ng sinuman
  rationale: Pinananatili ang konkretong idyomang “mula sa kamay” at ang malawak na negatibong kahulugan ng מְאוּמָה, habang nananatiling malinaw sa makabagong Tagalog.
- source_word: אִישׁ
  choice: sinuman
  rationale: Bagaman panlalaking isahan ang anyong Hebreo, gumaganap ito rito bilang di-tiyak na pantukoy sa kahit sinong tao; “sinuman” ang natural at tumpak na katumbas sa Tagalog.
- source_word: מְאוּמָה
  choice: anumang
  rationale: Sa negatibong sugnay, ang salita ay nangangahulugang anumang bagay o kahit ano; likas sa Tagalog ang “anumang” sa kayariang ito.
