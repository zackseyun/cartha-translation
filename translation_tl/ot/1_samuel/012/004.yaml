translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Iningatan ang tatlong magkakahanay na pagtanggi sa Hebreo at ang konkretong idyomang “mula sa kamay,” samantalang ginamit ang “pinagmalupitan” upang ipakita ang matinding diwa ng רצץ nang hindi ito gawing literal na pisikal na pagdurog.
