base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/018.yaml
  text: Then Samuel called to Yahweh[a], and Yahweh sent thunder and rain that day; and all the people greatly feared Yahweh and Samuel.
translation:
  language: tl
  text: Tumawag si Samuel kay Yahweh, at nagpadala si Yahweh ng kulog[a] at ulan noong araw na iyon. At labis na natakot ang buong bayan kay Yahweh at kay Samuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga tinig” o “mga tunog”; sa konteksto ng bagyo, tumutukoy ito sa kulog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל יְהוָה
  choice: tumawag ... kay Yahweh
  rationale: Ang קרא אֶל ay karaniwang tumutukoy sa pagtawag o pagdaing sa Diyos sa panalangin. Natural sa modernong Tagalog ang “tumawag kay” at hindi nito dinaragdagan ang paraan o tindi ng panalangin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וַיִּתֵּן
  choice: nagpadala
  rationale: Literal itong “nagbigay,” ngunit sa konteksto ng panahon, malinaw at natural na ipinapahayag ng “nagpadala” na si Yahweh ang nagpasapit ng kulog at ulan.
- source_word: קֹלֹת
  choice: kulog
  rationale: Literal na “mga tinig” o “mga tunog,” ngunit kapag kaugnay ng ulan at bagyo, tumutukoy ito sa kulog.
- source_word: וּמָטָר
  choice: ulan
  rationale: Tuwirang katumbas ng מָטָר; hindi dinaragdagan ng tinding gaya ng “malakas na buhos ng ulan.”
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Natural na temporal na parirala sa Tagalog na nagpapanatili sa tiyak na araw na binanggit.
- source_word: וַיִּירָא ... מְאֹד
  choice: labis na natakot
  rationale: Pinananatili ang malinaw na diwa ng takot at ang matinding puwersa ng מְאֹד, sa halip na palambutin lamang bilang pagkamangha.
- source_word: כָל הָעָם
  choice: ang buong bayan
  rationale: Natural na kolektibong pagtukoy sa lahat ng Israelitang naroon.
- source_word: אֶת יְהוָה וְאֶת שְׁמוּאֵל
  choice: kay Yahweh at kay Samuel
  rationale: Iisang pandiwa ang ginagamit sa dalawang layon sa Hebreo. Pinananatili ng salin ang koordinasyong ito nang hindi ipinapahiwatig na magkapantay ang katayuan nila.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton; ang “Yahweh” ay nagpapanatili sa pangalang tipan sa halip na palitan ito ng titulo.
- issue: Ang bayan ay natakot kapwa kay Yahweh at kay Samuel
  choice: natakot ... kay Yahweh at kay Samuel
  alternative: namangha kay Yahweh at gumalang kay Samuel
  rationale: Iisang pandiwang ירא ang namamahala sa parehong layon. Pinananatili ang tensiyon at ambiguidad ng Hebreo sa halip na hatiin ito sa dalawang magkaibang damdamin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “buong bayan” bilang natural na kolektibong katawagan at pinanatili ang pangalang Yahweh at ang iisang diwa ng “natakot” para sa dalawang layon.
