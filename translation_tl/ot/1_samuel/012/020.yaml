base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/020.yaml
  text: And Samuel said to the people[a], “Do not be afraid. You have done all this evil. Yet do not turn aside from following Yahweh[b], but serve Yahweh with all your heart.”
translation:
  language: tl
  text: Sinabi ni Samuel sa bayan, “Huwag kayong matakot.[a] Ginawa ninyo ang lahat ng kasamaang ito. Gayunman, huwag kayong lumihis sa pagsunod kay Yahweh,[b] kundi paglingkuran ninyo si Yahweh nang buong puso.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Huwag kayong mangamba.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “huwag kayong lumihis mula sa likuran ni Yahweh,” isang idyoma para sa pagtigil sa pagsunod sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל אֶל הָעָם
  choice: Sinabi ni Samuel sa bayan
  rationale: Likas na salaysay sa modernong Tagalog; ang הָעָם ay tumutukoy sa nagkakatipong bayang Israel.
- source_word: אַל תִּירָאוּ
  choice: Huwag kayong matakot
  rationale: Tuwirang utos na maramihan at natural na katumbas ng pandiwang ירא sa konteksto.
- source_word: אַתֶּם עֲשִׂיתֶם
  choice: Ginawa ninyo
  rationale: Pinananatili ang tahasang pagtukoy sa mga kinausap, na may diin sa kanilang pananagutan sa nagawa nila.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: ang lahat ng kasamaang ito
  rationale: Ang “kasamaan” ay nagpapanatili sa moral na bigat ng רָעָה at hindi ito pinahihinang maging simpleng pagkakamali.
- source_word: אַךְ
  choice: Gayunman
  rationale: Ipinahahayag ang matibay na pagbaling mula sa pagkilala sa kanilang kasalanan tungo sa utos na manatiling tapat.
- source_word: אַל תָּסוּרוּ מֵאַחֲרֵי יְהוָה
  choice: huwag kayong lumihis sa pagsunod kay Yahweh
  rationale: Pinananatili ng “lumihis sa pagsunod” ang larawang Hebreo ng pagtalikod mula sa likuran ng isang sinusundan, habang malinaw sa karaniwang mambabasa.
- source_word: וַעֲבַדְתֶּם אֶת יְהוָה
  choice: kundi paglingkuran ninyo si Yahweh
  rationale: Masaklaw ang “paglingkuran” kaysa “sambahin” lamang at akma sa tipanang katapatan; nililinaw ng “kundi” ang positibong utos kasunod ng pagbabawal.
- source_word: בְּכָל לְבַבְכֶם
  choice: nang buong puso
  rationale: Natural na idyomang Tagalog para sa lubos na panloob na debosyon at katapatan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Moral na lakas ng רָעָה
  choice: kasamaan
  alternative: kamalian; masamang bagay
  rationale: Sa konteksto ng pagsaway ni Samuel, ipinakikita ng salita ang moral na bigat ng ginawa ng bayan at hindi lamang isang di-sinasadyang pagkakamali.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “kayo/ninyo” dahil buong bayan ang kinakausap, at pinanatili ang bigat ng pagsaway kasama ng panawagang magpatuloy sa tapat na paglilingkod.
