  naturalness: Marangal at malinaw ang Tagalog, ngunit mas tuwiran at natural sa pormal na rehistrong ito ang “makikipagmatuwiran ako sa inyo.” Ang “sa harap ni Yahweh” ay mas karaniwang katumbas ng משפטיong “before Yahweh” kaysa “sa presensya ni Yahweh.”
  terminology: Ang “Yahweh,” “mga matuwid na gawa,” at “mga ninuno” ay angkop at tapat sa kahulugan. Ang “mga ninuno” ay maayos na modernong Tagalog para sa אֲבוֹתֵיכֶם sa kontekstong ito.
