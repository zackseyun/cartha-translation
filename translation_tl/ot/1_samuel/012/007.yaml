  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִֽתְיַצְּב֛וּ וְ/אִשָּׁפְטָ֥ה אִתְּ/כֶ֖ם לִ/פְנֵ֣י יְהוָ֑ה אֵ֚ת כָּל צִדְק֣וֹת יְהוָ֔ה אֲשֶׁר עָשָׂ֥ה אִתְּ/כֶ֖ם וְ/אֶת אֲבוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/007.yaml
  text: Now therefore[a], stand here[b], and I will contend with you before Yahweh concerning all the righteous acts of Yahweh that he did for you and for your fathers.
translation:
  language: tl
  text: Kaya ngayon, humarap kayo, at makikipagmatuwiran ako sa inyo[a] sa harap ni Yahweh tungkol sa lahat ng matuwid na gawa ni Yahweh[b] na ginawa niya para sa inyo at sa inyong mga ninuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “hahatulan ko kayo,” “makikipagtalo ako sa inyo,” o “ilalahad ko ang aking usapin laban sa inyo.” May legal na diwa ang Hebreo: pagpasok sa isang usapin sa harap ni Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: Ang “matuwid na gawa” ay tumutukoy sa makatarungan at tapat-sa-tipan na mga ginawa ni Yahweh para sa kanyang bayan.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinahahayag ang paglipat at lohikal na bunga sa pananalita ni Samuel; natural ito sa modernong Tagalog.
- source_word: הִתְיַצְּבוּ
  choice: tumayo kayo
  rationale: Maramihang pautos na tumawag sa mga tagapakinig na humarap at pumuwesto para sa isang pormal na paglilitis o pagtalakay.
- source_word: וְאִשָּׁפְטָה אִתְּכֶם
  choice: at ihaharap ko sa inyo ... ang usapin
  rationale: Pinananatili ang legal o forensic na diwa ng pandiwa nang hindi ipinapalagay na hahatulan agad ni Samuel ang bayan.
- source_word: לִפְנֵי יְהוָה
  choice: sa presensya ni Yahweh
  rationale: Malinaw at natural na salin ng pormal na pananalitang nangangahulugang sa harap o presensya ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan ng Diyos na nasa tekstong Hebreo.
- source_word: אֵת כָּל צִדְקוֹת יְהוָה
  choice: tungkol sa lahat ng matuwid na gawa ni Yahweh
  rationale: Tumutukoy sa mga kongkretong gawang nagpapakita ng katarungan at katapatan ni Yahweh sa tipan, hindi lamang sa isang abstraktong katangian.
- source_word: אֲשֶׁר עָשָׂה
  choice: na ginawa niya
  rationale: Payak at natural na katumbas ng karaniwang sugnay na Hebreo.
- source_word: אִתְּכֶם
  choice: para sa inyo
  rationale: Bagaman literal na maaaring 'kasama ninyo,' ipinakikita ng konteksto ang mga gawang ginawa para sa kapakinabangan ng Israel.
- source_word: וְאֶת אֲבוֹתֵיכֶם
  choice: at sa inyong mga ninuno
  rationale: Mas natural at masaklaw sa kasalukuyang Tagalog kaysa 'mga ama,' habang tapat sa kahulugang ancestral ng salita.
theological_decisions:
- issue: Pagbibigay-kahulugan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Nasa talata mismo ang Tetragrammaton; pinananatili ng 'Yahweh' ang natatanging pangalang tipan.
- issue: Diwa ng צִדְקוֹת יְהוָה
  choice: matuwid na mga gawa ni Yahweh
  alternative: mga pagliligtas na ginawa ni Yahweh; makatarungang mga gawa ni Yahweh
  rationale: Pinananatili nito ang kaugnayan sa katuwiran habang hindi nililimitahan ang mga gawa sa pagliligtas lamang; kabilang ang makatarungan at tapat-sa-tipan na pagkilos.
- issue: Forensic na diwa ng וְאִשָּׁפְטָה אִתְּכֶם
  choice: ihaharap ko sa inyo ... ang usapin
  alternative: hahatulan ko kayo; makikipagtalo ako sa inyo; mangangatuwiran ako sa inyo
  rationale: Inilalarawan ang pagpasok ni Samuel sa isang pormal na usapin sa harap ni Yahweh nang hindi tahasang nilulutas kung siya ay hukom, nagsasakdal, o nakikipagmatuwiran.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” upang malinaw ang ancestral na kahulugan. Parehong marker na [a] at [b] ay nasa pangunahing teksto at tumutugma sa mga talababa.
