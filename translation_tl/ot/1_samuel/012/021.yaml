  yaml_path: translation/ot/1_samuel/012/021.yaml
  text: And do not turn aside after worthless things that cannot profit or deliver[b][a], for they are worthless.
translation:
  language: tl
  text: At huwag kayong lumihis upang sumunod sa mga bagay na walang kabuluhan[a], na hindi makatutulong o makapagliligtas[b], sapagkat walang kabuluhan ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bagay na hungkag,” “walang saysay,” o “mga diyus-diyosan.” Ang salitang Hebreo na tohu ay tumutukoy sa walang laman, walang saysay, o walang tunay na bisa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “makapagsagip” o “magligtas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּסוּרוּ
  choice: lumihis
  rationale: Pinananatili ang larawan ng paglihis o pagtalikod mula sa tamang landas ng katapatan.
- source_word: אַחֲרֵי
  choice: upang sumunod sa
  rationale: Sa kontekstong ito, ang literal na 'sa likuran ng' ay likas na nagpapahayag ng pagsunod o paghahabol sa ibang pinagtitiwalaan.
- source_word: הַתֹּהוּ / תֹהוּ
  choice: mga bagay na walang kabuluhan / walang kabuluhan
  rationale: Saklaw ng תֹהוּ ang kawalan ng laman, saysay, o bisa. Hindi ito ginawang tahasang 'mga diyus-diyosan' upang mapanatili ang mas malawak na salita ng Hebreo at ang pag-uulit nito.
- source_word: אֲשֶׁר לֹא יוֹעִילוּ
  choice: na hindi makatutulong
  rationale: Malinaw at natural na ipinahahayag ang kawalan ng kakayahang magbigay ng pakinabang.
- source_word: וְלֹא יַצִּילוּ
  choice: o makapagliligtas
  rationale: Ang Hiphil ng נצל ay nangangahulugang magligtas o sumagip; ang 'makapagliligtas' ay akma sa pagkakahanay nito sa 'makatutulong' at sa kawalan ng kakayahan ng mga tinutukoy.
- source_word: הֵמָּה
  choice: ang mga iyon
  rationale: Likas na tumutukoy pabalik sa maramihang 'mga bagay' at malinaw na pinananatili ang reperensiya.
theological_decisions:
- issue: Tinutukoy ng 'mga bagay na walang kabuluhan'
  choice: Pinanatiling pangkalahatan bilang mga bagay na walang kabuluhan na maling sinusundan o pinagtitiwalaan.
  alternative: mga diyus-diyosan
  rationale: Malamang na kabilang ang mga diyus-diyosan sa tinutukoy, ngunit תֹהוּ ang ginamit at hindi isang tiyak na katawagan para sa diyus-diyosan. Kaya hindi dinagdagan ang katiyakan ng salin.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng 'walang kabuluhan' upang tularan ang retorika ng Hebreo, at ginamit ang 'lumihis upang sumunod' para maging natural ang diwa ng תסורו אחרי.
