  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּמְכֹּ֣ר אֹתָ֡/ם בְּ/יַ֣ד סִֽיסְרָא֩ שַׂר צְבָ֨א חָצ֜וֹר וּ/בְ/יַד פְּלִשְׁתִּ֗ים וּ/בְ/יַד֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּֽלָּחֲמ֖וּ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/009.yaml
  text: But they forgot Yahweh their God[a], and he sold them into the hand of Sisera, commander of the army of Hazor, and into the hand of the Philistines, and into the hand of the king of Moab; and they fought against them.
translation:
  language: tl
  text: Ngunit kinalimutan nila si Yahweh na kanilang Diyos, at ipinagbili niya sila[a] sa kamay ni Sisera, ang pinuno ng hukbo ng Hazor, sa kamay ng mga Filisteo, at sa kamay ng hari ng Moab. At nakipaglaban ang mga iyon sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibinigay niya sila.” Literal sa Hebreo, “ipinagbili niya sila,” isang pananalitang tumutukoy sa pagbibigay ng isang bayan sa kapangyarihan ng mga kaaway nito bilang paghatol sa tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: kinalimutan nila
  rationale: Pinananatili ang tuwirang kahulugan ng שׁכח na ‘kalimutan,’ habang hinahayaang ipahiwatig ng konteksto ang pagtataksil at pagpapabaya sa tipan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang Tetragrammaton bilang personal na pangalan ng Diyos, hindi bilang pamagat.
- source_word: אֱלֹהֵיהֶם
  choice: kanilang Diyos
  rationale: Likas na salin ng anyong construct na may hulaping panghalip at pinananatili ang ugnayang tipan.
- source_word: וַיִּמְכֹּר
  choice: ipinagbili niya sila
  rationale: Pinananatili ang literal na metapora ng מכר. Sa kontekstong ito, tumutukoy ito sa pagbibigay sa Israel sa kapangyarihan ng mga kaaway bilang paghatol.
- source_word: בְּיַד
  choice: sa kamay ni/ng
  rationale: Pinananatili ang Hebreong larawang ‘sa kamay,’ na nauunawaan sa Filipino bilang mapasailalim sa kapangyarihan ng iba.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Karaniwang transliterasyon sa Filipino ng pangalan.
- source_word: שַׂר צְבָא חָצוֹר
  choice: ang pinuno ng hukbo ng Hazor
  rationale: Malinaw at likas na katumbas ng titulong militar at ng kaugnayan nito sa Hazor.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang katawagan sa Filipino sa pangkat na ito.
- source_word: מֶלֶךְ מוֹאָב
  choice: hari ng Moab
  rationale: Tuwirang salin ng construct chain.
- source_word: וַיִּלָּחֲמוּ בָם
  choice: nakipaglaban ang mga iyon sa kanila
  rationale: Ang maramihang simuno ay pinakamalamang na tumutukoy sa mga kapangyarihang kababanggit lamang. Ang ‘mga iyon’ ay nililinaw ang reperensiya nang hindi tahasang pinapangalanan ang lahat ng pangkat.
theological_decisions:
- issue: Simuno ng ‘ipinagbili niya sila’
  choice: Si Yahweh ang ipinahihiwatig na simuno.
  alternative: 'Di-tiyak o balintiyak na pagbasa: ‘ipinagbili sila.’'
  rationale: Ang naunang sugnay ay bumabanggit kay Yahweh na kanilang Diyos, at ang kasunod na pandiwang pang-isahan ay likas na nagpapatuloy na siya ang simuno. Pinananatili nito ang larawan ng paghatol sa tipan nang walang idinaragdag na paliwanag sa pangunahing teksto.
- issue: Diwa ng ‘kinalimutan si Yahweh’
  choice: Literal na ‘kinalimutan,’ na may pahiwatig ng pagtataksil sa tipan mula sa konteksto.
  alternative: Mas tahasang interpretatibong ‘tinalikuran’ o ‘pinabayaan.’
  rationale: Ang Hebreo ay literal na nagsasabing ‘kinalimutan.’ Hindi pinapalitan ng salin ang tunay na salita ng mas matinding interpretasyon.
- issue: Simuno ng panghuling maramihang pandiwa
  choice: Ang mga mananakop na kababanggit—si Sisera at ang mga puwersang kaugnay sa kanya, ang mga Filisteo, at ang hari ng Moab.
  alternative: Maaaring ipalagay na tumutukoy ito sa mga kaaway sa pangkalahatan nang hindi tiyak na inuugnay sa bawat naunang pangngalan.
  rationale: Ang pinakamalapit na maramihang antecedent ay ang magkakasunod na kapangyarihang pinagbigyan sa Israel. Ang ‘mga iyon’ ay nagpapanatili ng bahagyang kaluwagan ng reperensiya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pangalang Yahweh at ang mga larawang ‘ipinagbili’ at ‘sa kamay’ dahil mahalaga ang mga ito sa Hebreong pahayag. Ginamit ang ‘mga iyon’ sa huling sugnay upang maging malinaw ang maramihang simuno nang hindi labis na nilulutas ang reperensiya.
