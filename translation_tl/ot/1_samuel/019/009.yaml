base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/009.yaml
  text: And an evil spirit from Yahweh came upon Saul while he was sitting in his house with his spear in his hand[b][a], and David was playing the lyre with his hand.
translation:
  language: tl
  text: At dumating kay Saul ang isang masamang espiritu mula kay Yahweh habang nakaupo siya sa kanyang bahay at nasa kamay niya ang kanyang sibat, habang si David ay tumutugtog gamit ang kanyang kamay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “gamit ang kamay.” Hindi tahasang pinangalanan sa talatang ito ang instrumentong tinutugtog ni David, bagaman ipinakikita ng kalapit na konteksto na tumutugtog siya ng instrumentong de-kuwerdas para kay Saul. Maaari ring isalin ang “masamang espiritu” bilang “nakapipinsalang espiritu” o “espiritung nagpapahirap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: dumating
  rationale: Sa pagkakaugnay nito sa אֶל שָׁאוּל, inilalarawan ng anyo ang pagsapit ng espiritu kay Saul; mas natural sa Tagalog ang “dumating kay” kaysa sa literal na “naging.”
- source_word: רוּחַ יְהוָה רָעָה
  choice: isang masamang espiritu mula kay Yahweh
  rationale: Ang רוּחַ ay “espiritu,” at maaaring mangahulugan ang רָעָה ng “masama” o “nakapipinsala.” Ipinahahayag ng “mula kay Yahweh” ang pinagmulan o pagpapadala nang hindi ginagawang katangian ni Yahweh ang kasamaan.
- source_word: אֶל שָׁאוּל
  choice: kay Saul
  rationale: Ang אֶל ay karaniwang nagsasaad ng direksiyon patungo sa isang tao. Sa Tagalog, malinaw at natural ang “dumating kay Saul.”
- source_word: בְּבֵיתוֹ יוֹשֵׁב
  choice: habang nakaupo siya sa loob ng kanyang bahay
  rationale: Ang participle na יוֹשֵׁב ay naglalarawan ng nagpapatuloy na kalagayan sa likuran ng pangunahing pangyayari; ang “habang nakaupo” ang natural na katumbas.
- source_word: וַחֲנִיתוֹ בְּיָדוֹ
  choice: hawak ang kanyang sibat
  rationale: Ang literal na “at ang kanyang sibat ay nasa kanyang kamay” ay likas na naipahahayag sa Tagalog bilang “hawak ang kanyang sibat,” habang pinananatili ang tagpo.
- source_word: מְנַגֵּן
  choice: tumutugtog
  rationale: Ang piel participle ng נגן ay tumutukoy sa pagtugtog ng isang instrumentong pangmusika. Ang “tumutugtog” ay malinaw at natural kahit hindi pinangalanan sa talatang ito ang instrumento.
- source_word: בְּיָד
  choice: gamit ang kanyang kamay
  rationale: Pinananatili nito ang tahasang singular na “kamay” sa Hebreo at hindi ipinapasok sa pangunahing teksto ang instrumentong hindi pinangalanan sa mismong talata.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan.
- issue: Kahulugan ng רוּחַ יְהוָה רָעָה
  choice: isang masamang espiritu mula kay Yahweh
  alternative: isang nakapipinsalang espiritu mula kay Yahweh
  rationale: Pinananatili ng “masamang espiritu” ang tuwirang leksikal at teolohikal na tensiyon ng רָעָה, habang ang “mula kay Yahweh” ay nagpapahayag ng kaugnayang pinagmulan o pagpapadala. Inilalahad sa talababa ang lehitimong alternatibong “nakapipinsala.”
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang “nakaupo” at “hawak” para sa natural na daloy, ngunit pinanatili ang “gamit ang kanyang kamay” at nilagyan ng talababa upang maipakita ang kakaibang literal na pahayag at ang instrumentong ipinahihiwatig lamang ng konteksto.
