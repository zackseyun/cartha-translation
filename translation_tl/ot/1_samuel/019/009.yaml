  - severity: low
    issue: Hindi tahasang ipinapaliwanag ng talababa ang literal na “gamit ang kanyang kamay.”
    rationale: Ito ang di-pangkaraniwang bahagi ng pangunahing salin na nangangailangan ng paliwanag; dapat ding malinaw na ang instrumento ay hindi pinangalanan sa talata.
