revisions:
- from: At dumating kay Saul ang isang masamang espiritu mula kay Yahweh habang nakaupo siya sa loob ng kanyang bahay, hawak ang kanyang sibat. Samantala, tumutugtog si David gamit ang kanyang kamay.[a]
  to: At dumating kay Saul ang isang masamang espiritu mula kay Yahweh habang nakaupo siya sa kanyang bahay at nasa kamay niya ang kanyang sibat, habang si David ay tumutugtog gamit ang kanyang kamay.[a]
  rationale: Pinalitan ang “Samantala” ng konstruksyong “habang” upang ipakita ang magkakasabay na tagpo nang walang dagdag na pagkakatapat. Inayos ang paglalarawan sa sibat upang malinaw na nasa kamay ni Saul ito. Pinalawak ang talababa upang ipaliwanag ang literal ngunit di-karaniwang “gamit ang kanyang kamay,” habang hindi idinadagdag sa pangunahing teksto ang instrumentong hindi pinangalanan sa Hebreo.
