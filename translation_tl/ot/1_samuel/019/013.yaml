base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/013.yaml
  text: Then Michal took the household idol and laid it on the bed[b][a], and she put a cushion of goats’ hair at its head and covered it with the garment.
translation:
  language: tl
  text: Pagkatapos, kinuha ni Mical ang diyus-diyosan ng sambahayan[a] at inilagay iyon sa higaan. Naglagay siya sa ulunan ng isang hinabing bagay na yari sa balahibo ng kambing[b] at tinakpan niya iyon ng damit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga terafim,” “mga diyos ng sambahayan,” o “imahen.” Ang salitang Hebreo ay tumutukoy sa mga bagay na ginagamit sa pagsamba sa loob ng sambahayan; bagaman maramihan ang anyo ng salita, dito ay waring isang bagay ang ginamit sa higaan.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang eksaktong kahulugan ng pananalitang Hebreo. Maaaring tumukoy ito sa isang hinabing pantakip, lambat, unan, o katulad na bagay na yari sa balahibo ng kambing at inilagay sa ulunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: diyus-diyosan ng sambahayan
  rationale: Ang תְּרָפִים ay tumutukoy sa mga rebulto o kagamitang panrelihiyon sa sambahayan. Bagaman maramihan ang anyong Hebreo, sa tagpong ito ay tila isang imaheng inilagay sa higaan ang tinutukoy.
- source_word: אֶל הַמִּטָּה
  choice: sa higaan
  rationale: Sa kasamang pandiwang שׂים at sa konteksto ng panlilinlang, likas sa Filipino ang 'inilagay ... sa higaan.'
- source_word: כְּבִיר הָעִזִּים
  choice: hinabing balahibo ng kambing
  rationale: Hindi tiyak ang kahulugan ng bihirang salitang כְּבִיר. Iniiwasan ng saling ito ang labis na pagtukoy kung ito ay unan, lambat, o pantakip, ngunit ipinahihiwatig na isa itong bagay na yari sa balahibo ng kambing.
- source_word: מְרַאֲשֹׁתָיו
  choice: sa ulunan nito
  rationale: Tumutukoy ito sa lugar sa gawing ulo o ulunan. Ang 'nito' ay natural na tumutukoy sa imaheng nakahiga, nang hindi ipinapalagay na literal itong tao.
- source_word: בַּבָּגֶד
  choice: ng damit
  rationale: Pangkalahatang salita ang בֶּגֶד para sa damit o kasuutan. May tiyak na pantukoy ang Hebreo, ngunit sa Filipino ay natural ang 'ng damit' sa konstruksyong ito.
- source_word: וַתְּכַס
  choice: tinakpan
  rationale: Tuwirang katumbas ito ng pandiwang כסה at pinananatili ang konkretong kilos sa tagpo.
