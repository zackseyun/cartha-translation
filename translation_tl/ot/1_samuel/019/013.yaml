revisions:
- from: Pagkatapos, kinuha ni Mical ang diyus-diyosan ng sambahayan[a] at inilagay iyon sa higaan. Naglagay siya ng hinabing balahibo ng kambing[b] sa ulunan nito at tinakpan iyon ng damit.
  to: Pagkatapos, kinuha ni Mical ang diyus-diyosan ng sambahayan[a] at inilagay iyon sa higaan. Naglagay siya sa ulunan ng isang hinabing bagay na yari sa balahibo ng kambing[b] at tinakpan niya iyon ng damit.
  rationale: Nilinaw na ang כְּבִיר הָעִזִּים ay isang bagay nang hindi ipinipilit kung ito ay unan, lambat, o pantakip. Pinalitan ang panghalip sa pariralang pang-ulunan upang mapanatili ang posibleng kalabuan ng reperensiya sa Hebreo. Inalis ang hindi tahasang suportadong paglalarawan na “anyong tao” mula sa talababa.
