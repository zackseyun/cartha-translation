base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/016.yaml
  text: When the messengers came in[a], behold, the teraphim was in the bed[b], with the quilt of goats’ hair at its head.
translation:
  language: tl
  text: Nang pumasok ang mga sugo, naroon ang terapim[a] sa higaan, at isang hinabing pantakip na balahibo ng kambing[b] ang nasa bandang ulunan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “diyus-diyosan sa sambahayan” o “imaheng diyus-diyosan.” Ang Hebreong terapim ay tumutukoy sa isang imaheng pangkulto sa sambahayan.
    reason: lexical_alternative
  - marker: b
    text: Bihira ang salitang Hebreo na isinaling “hinabing pantakip,” at maaari itong tumukoy nang mas pangkalahatan sa isang hinabing pantakip. Ang “balahibo ng kambing” ay tumutukoy sa materyal nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: mga sugo
  rationale: Sa konteksto, mga taong isinugo ni Saul upang dakpin si David ang tinutukoy. Ang “mga sugo” ay likas sa Filipino at hindi nagpapahiwatig ng mga anghel.
- source_word: וְהִנֵּה
  choice: nakita nilang
  rationale: Ipinahahayag nito sa natural na salaysay sa Filipino ang biglaang pagkatuklas na dala ng Hebreong וְהִנֵּה, nang hindi gumagamit ng lipas o artipisyal na panawag.
- source_word: הַתְּרָפִים
  choice: ang terapim
  rationale: Pinananatili ng transliterasyon ang katawagang kultural para sa isang imaheng ginagamit sa sambahayan at hindi labis na tinutukoy ang laki o tiyak na gamit nito.
- source_word: אֶל הַמִּטָּה
  choice: nasa higaan
  rationale: 'Bagaman karaniwang nangangahulugang “patungo sa” ang אֶל, lokatibo ang diwa rito: nakahiga ang bagay bilang pamalit kay David.'
- source_word: וּכְבִיר הָעִזִּים
  choice: may habing balahibo ng kambing
  rationale: Bihira at hindi tiyak ang כְּבִיר; ang “habi” ay nagpapanatili sa posibilidad na isa itong hinabing pantakip, samantalang ipinahahayag ng “balahibo ng kambing” ang materyal na malamang na tinutukoy.
- source_word: מְרַאֲשֹׁתָיו
  choice: sa ulunan nito
  rationale: Tumutukoy ito sa lugar na kinalalagyan ng ulo. Ang “nito” ay tumutukoy sa terapim na ginamit na anyong-tao sa higaan, hindi sa isang tunay na tao.
theological_decisions:
- issue: Paglalahad sa תְּרָפִים, isang bagay na kaugnay ng kulto o pagsamba sa sambahayan
  choice: terapim
  alternative: diyus-diyosan sa sambahayan; imaheng diyus-diyosan
  rationale: Tahasan lamang pinangalanan ng teksto ang bagay at hindi ito kinokomentaryuhan sa talatang ito. Pinananatili ng transliterasyon ang kultural na katawagan at ang bahagyang kawalang-tiyak, habang nililinaw sa talababa ang malamang na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pagpasok ... nakita nilang” upang natural na maipahayag ang biglaang pagkatuklas; pinanatili ang “terapim” bilang teknikal ngunit naipaliwanag na katawagang kultural.
