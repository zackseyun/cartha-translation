revisions:
- from: Pagkatapos, nagsugo si Saul ng mga tauhan sa bahay ni David upang bantayan siya at patayin sa umaga. At sinabi ni Mical na asawa niya kay David[a], “Kung hindi mo ililigtas ang buhay mo ngayong gabi, bukas ay papatayin ka.”
  to: Pagkatapos, nagsugo si Saul ng mga sugo sa bahay ni David upang bantayan siya at patayin siya kinaumagahan. Sinabi ni Mical, na asawa ni David, sa kaniya[a], “Kung hindi mo ililigtas ang buhay mo ngayong gabi, papatayin ka bukas.”
  rationale: Pinalitan ang “mga tauhan” ng “mga sugo” upang maipakita na sila ay mga emisaryong ipinadala ni Saul. Inayos ang sintaks upang maging malinaw ang layon ng “patayin,” at ginawang mas malinaw ang pagkakaugnay nina Mical at David. Hindi binago ang kahulugan ng agarang babala ni Mical o ang alternatibong idyomatikong salin sa talababa.
