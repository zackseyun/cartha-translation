translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Mical” bilang karaniwang anyong Filipino ng pangalang Michal. Pinanatili ang payak na pang-ugnay na “At” at ang tuwirang bigat ng bantang kamatayan.
