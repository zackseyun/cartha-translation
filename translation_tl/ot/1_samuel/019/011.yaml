base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/011.yaml
  text: Then Saul sent messengers to David’s house to watch him and to kill him in the morning. And Michal his wife told David[a], saying, “If you do not save your life tonight, tomorrow you will be put to death.”
translation:
  language: tl
  text: Pagkatapos, nagsugo si Saul ng mga sugo sa bahay ni David upang bantayan siya at patayin siya kinaumagahan. Sinabi ni Mical, na asawa ni David, sa kaniya[a], “Kung hindi mo ililigtas ang buhay mo ngayong gabi, papatayin ka bukas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kung hindi ka makatatakas nang buhay ngayong gabi, papatayin ka bukas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: mga tauhan
  rationale: Sa kontekstong ito, mga taong isinugo ni Saul ang tinutukoy, hindi mga anghel. Likas sa makabagong Tagalog ang “mga tauhan” para sa mga ahenteng gumaganap ng utos ng hari.
- source_word: לְשָׁמְרוֹ
  choice: upang bantayan siya
  rationale: Ipinapahiwatig ng pandiwa ang mapanlabang pagmamanman sa bahay ni David, hindi ang pag-iingat sa kaniya.
- source_word: וְלַהֲמִיתוֹ
  choice: at patayin
  rationale: Tuwiran nitong ipinapahayag ang layuning ipapatay o kitlin ang buhay ni David; malinaw at natural ang “patayin.”
- source_word: בַּבֹּקֶר
  choice: sa umaga
  rationale: Pinananatili ang payak na pagtukoy sa nakatakdang oras ng pagpatay.
- source_word: וַתַּגֵּד
  choice: sinabi
  rationale: Natural itong panandang nagsisimula sa babala ni Mical; ang mismong tuwirang pananalita ang naghahatid ng bigat at pagmamadali.
- source_word: מִיכַל אִשְׁתּוֹ
  choice: Mical na asawa niya
  rationale: Pinananatili ang pagkakasunod ng Hebreong pangalan at kasunod na paglalarawan, habang malinaw na si Mical ang asawa ni David.
- source_word: מְמַלֵּט אֶת־נַפְשְׁךָ
  choice: ililigtas ang buhay mo
  rationale: Natural na salin ito ng idyomang tumutukoy sa pagliligtas ng sariling buhay mula sa nalalapit na kamatayan.
- source_word: הַלַּיְלָה
  choice: ngayong gabi
  rationale: Tumutukoy ito sa kasalukuyang gabi at natural ang ganitong pahayag sa modernong Tagalog.
- source_word: מוּמָת
  choice: papatayin ka
  rationale: Pinananatili nito ang pasibong diwa at malinaw na ipinahihiwatig na mamamatay si David sa kamay ng ibang tao.
