base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/010.yaml
  text: Saul sought to pin David to the wall with the spear, but he slipped away from Saul’s presence, and he drove the spear into the wall. Then David fled and escaped that night.
translation:
  language: tl
  text: Tinangka ni Saul na itarak si David sa pader gamit ang sibat, ngunit nakaiwas si David kay Saul, at naitarak ni Saul ang sibat sa pader. Tumakas si David at nakaligtas nang gabing iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַכּוֹת בַּחֲנִית בְּדָוִד וּבַקִּיר
  choice: itarak si David sa pader sa pamamagitan ng sibat
  rationale: Ipinahahayag ang layunin ng pag-atake at ang ugnayan nina David, ng sibat, at ng pader. Ang “itarak ... sa pader” ay natural sa Filipino at tumutugma sa konteksto, bagaman literal na maaaring unawain ang parirala bilang ‘hampasin si David at ang pader.’
- source_word: וַיִּפְטַר מִפְּנֵי שָׁאוּל
  choice: nakaiwas si David sa harap ni Saul
  rationale: Ang pandiwa ay nagsasaad ng pagkalag o pag-iwas mula sa presensiya ni Saul; nilinaw ang di-tahasang simuno na si David upang maging natural at malinaw.
- source_word: וַיַּךְ אֶת־הַחֲנִית בַּקִּיר
  choice: kaya tumama ang sibat sa pader
  rationale: Ang Hebreo ay di-karaniwang bumabasa nang literal na ‘hinampas niya ang sibat sa pader.’ Sa konteksto, ang sibat ang tumama o bumaon sa pader matapos makaiwas si David. Pinili ang ‘tumama’ upang iwasan ang hindi natural na impresyong sadyang inihampas ni Saul ang sibat sa pader.
- source_word: נָס וַיִּמָּלֵט
  choice: tumakas ... at nakaligtas
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na kilos: ang pagtakas at ang matagumpay na pagkaligtas.'
- source_word: בַּלַּיְלָה הוּא
  choice: nang gabing iyon
  rationale: Natural na Filipino para sa idiomatikong pagtukoy sa mismong gabing iyon.
