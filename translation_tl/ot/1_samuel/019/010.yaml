revisions:
- from: Tinangka ni Saul na itarak si David sa pader sa pamamagitan ng sibat, ngunit nakaiwas si David sa harap ni Saul, kaya tumama ang sibat sa pader. Pagkatapos, tumakas si David at nakaligtas nang gabing iyon.
  to: Tinangka ni Saul na itarak si David sa pader gamit ang sibat, ngunit nakaiwas si David kay Saul, at naitarak ni Saul ang sibat sa pader. Tumakas si David at nakaligtas nang gabing iyon.
  rationale: Pinalitan ang hindi likas at kulang sa tumpak na "sa harap ni Saul" ng "kay Saul," at ginawang tahasan si Saul bilang gumaganap sa pagtama/pagkatarak ng sibat sa pader. Pinanatili ang "itarak" upang ihayag ang layuning maipit si David sa pader, gayundin ang magkahiwalay na pagtakas at pagkaligtas ni David.
