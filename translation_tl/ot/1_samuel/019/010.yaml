    issue: '"nakaiwas si David sa harap ni Saul"'
    rationale: Ang "sa harap ni" ay karaniwang lokatibo o tumutukoy sa pagiging nasa presensiya ng isang tao. Dito, ang מִפְּנֵי ay mas tumpak na isinasalin bilang pag-iwas o pagkalag mula kay Saul.
  - severity: medium
    issue: '"kaya tumama ang sibat sa pader"'
    rationale: Ang "kaya" ay nagdaragdag ng tahasang ugnayang sanhi, at ang di-tahasang sibat bilang simuno ay nag-aalis ng pagkilos ni Saul na ipinahihiwatig ng וַיַּךְ. Mas mabuting panatilihin ang pagkilos ni Saul nang hindi nagpapahiwatig na sinadya niyang tamaan ang pader bilang hiwalay na layunin.
