base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/001.yaml
  text: Saul spoke to Jonathan his son and to all his servants to put David to death[b][a], but Jonathan son of Saul delighted greatly in David.
translation:
  language: tl
  text: Sinabi ni Saul sa anak niyang si Jonatan at sa lahat ng kanyang mga lingkod na patayin si David.[a] Ngunit lubos na nalulugod si Jonatan, na anak ni Saul, kay David.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “na pumatay kay David” o “tungkol sa pagpatay kay David.” Ang pandiwang Hebreo ay nasa anyong causative at tumutukoy sa pagpatay kay David.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “lubos na nagustuhan ni Jonatan si David” o “labis na nalugod si Jonatan kay David.” Ang Hebreo ay nagsasabing lubos siyang nalugod kay David.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Sinabi
  rationale: Ang דִּבֵּר ay tumutukoy sa pagsasalita; sa kasunod na pariralang infinitibo, likas sa Tagalog ang “sinabi ... na” upang ihayag ang nilalaman o layunin ng sinabi ni Saul nang hindi na nagdaragdag ng tuwirang sipi.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Pinananatili ng “mga lingkod” ang karaniwang kahulugan ng עֶבֶד, bagaman sa konteksto ng hari ay maaaring kabilang dito ang mga opisyal o tauhan sa palasyo.
- source_word: לְהָמִית אֶת־דָּוִד
  choice: na patayin si David
  rationale: Ang causative na הֵמִית ay nangangahulugang ipapatay o patayin. Ang “na patayin si David” ay malinaw at natural, at naipapahayag ang nilalaman o layunin ng pagsasalita ni Saul.
- source_word: וִיהוֹנָתָן
  choice: Ngunit ... si Jonatan
  rationale: Bagaman karaniwang “at” ang waw, malinaw na pasalungat dito ang saloobin ni Jonatan sa balak ni Saul, kaya natural ang “Ngunit.”
- source_word: חָפֵץ בְּדָוִד מְאֹד
  choice: lubos na kinalulugdan ... si David
  rationale: Ipinahahayag ng חָפֵץ ang matinding pagkagusto, kasiyahan, o pagkalugod sa isang tao. Pinananatili ng “lubos na kinalulugdan” ang positibong damdamin nang hindi awtomatikong itinutumbas sa mas tiyak na pandiwang “umibig.”
- source_word: בְּנוֹ / בֶּן־שָׁאוּל
  choice: anak niyang / na anak ni Saul
  rationale: Kapuwa pinananatili ang dalawang pagtukoy sa ugnayang ama at anak, gaya ng nasa Hebreo.
theological_decisions:
- issue: Lakas at uri ng damdamin ni Jonatan kay David
  choice: lubos na kinalulugdan
  alternative: mahal na mahal / labis na minamahal
  rationale: Ang talata ay gumagamit ng חָפֵץ, hindi ng אָהַב. Kaya pinananatili ang diwang matinding pagkagusto o pagkalugod nang hindi nilulutas nang higit sa sinasabi ng mismong salitang Hebreo ang eksaktong uri ng pagmamahal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga lingkod” bilang transparent na katawagan sa mga tauhan o opisyal ng hari; iniwasan ang sobrang pormal na “mga tagapaglingkod.”
