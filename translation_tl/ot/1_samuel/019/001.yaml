  naturalness: Malinaw at marangal ang pangunahing teksto. Mas likas ang ‘nalulugod kay David’ kaysa ‘kinalulugdan si David’ sa modernong Filipino, habang napapanatili ang aspektong disposisyonal ng Hebreo.
