base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/004.yaml
  text: Jonathan spoke well of David to Saul his father[a], and said to him, “Let not the king sin against his servant David, because he has not sinned against you[b], and because his deeds have been very good for you.”
translation:
  language: tl
  text: Nagsalita si Jonatan nang mabuti tungkol kay David sa kanyang amang si Saul[a]. Sinabi niya rito, “Huwag magkasala ang hari laban sa kanyang lingkod, laban kay David, sapagkat hindi siya nagkasala laban sa iyo[b], at ang kanyang mga ginawa ay naging napakabuti para sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsalita nang pabor tungkol kay David.” Literal na sinasabi ng Hebreong idyoma na “nagsalita ng mabuti tungkol kay David.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, inuulit ang pariralang may diwang “laban”: “laban sa kanyang lingkod, laban kay David,” bilang paglilinaw at pagbibigay-diin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... טוֹב בְּדָוִד
  choice: nagsalita ... nang mabuti tungkol kay David
  rationale: Ipinahahayag nito ang Hebreong idyoma na nagsalita si Jonatan nang pabor kay David, habang pinananatili ang konkretong salitang “mabuti.”
- source_word: אֶל שָׁאוּל אָבִיו
  choice: kay Saul na kanyang ama
  rationale: Malinaw at natural sa Tagalog, at pinananatili ang pagkakaugnay ni Saul bilang ama ni Jonatan.
- source_word: אַל יֶחֱטָא הַמֶּלֶךְ
  choice: Huwag magkasala ang hari
  rationale: Pinananatili ang pagbabawal, ang salitang “magkasala,” at ang magalang na pagtukoy ni Jonatan kay Saul sa ikatlong panauhan bilang hari.
- source_word: בְּעַבְדּוֹ בְדָוִד
  choice: laban sa kanyang lingkod, laban kay David
  rationale: Pinananatili ang inuulit na pang-ukol sa Hebreo at ang diin na si David ang lingkod na tinutukoy.
- source_word: כִּי לֹא חָטָא לָךְ
  choice: sapagkat hindi siya nagkasala laban sa iyo
  rationale: Pinananatili ang sanhi at ang pag-uulit ng ugat na “magkasala,” na bumubuo ng retorikal na paghahambing sa posibleng kasalanan ni Saul.
- source_word: וְכִי מַעֲשָׂיו טוֹב לְךָ מְאֹד
  choice: at ang kanyang mga ginawa ay naging napakabuti para sa iyo
  rationale: Malapit sa anyo ng Hebreo at ipinakikitang lubhang kapaki-pakinabang kay Saul ang mga ginawa ni David nang hindi pinapaliit iyon sa isang tiyak na uri ng pakinabang.
