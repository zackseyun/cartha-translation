source:
  edition: WLC
  text: וַ/יַּגִּ֣דוּ לְ/שָׁא֗וּל וַ/יִּשְׁלַח֙ מַלְאָכִ֣ים אֲחֵרִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵ֑מָּה וַ/יֹּ֣סֶף שָׁא֗וּל וַ/יִּשְׁלַח֙ מַלְאָכִ֣ים שְׁלִשִׁ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/021.yaml
  text: When they told Saul[a], he sent other messengers, and they also prophesied. Then Saul again sent a third group of messengers[b], and they also prophesied.
translation:
  language: tl
  text: Nang ibalita nila ito kay Saul, nagsugo siya ng iba pang mga mensahero, at pati sila ay nagpropesiya. Muling nagsugo si Saul ng mga mensahero sa ikatlong pagkakataon[a], at pati sila ay nagpropesiya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga ikatlo”; ibig sabihin, ikatlong pangkat ng mga mensahero o ikatlong pagpapadala ni Saul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: Nang ibalita nila ito kay Saul
  rationale: Ang Hiphil ng נגד ay nangangahulugang ‘magbalita’ o ‘magsabi.’ Likas sa Tagalog ang temporal na ‘Nang’ upang iugnay ang ulat sa sumunod na kilos ni Saul; ang ‘ito’ ay tumutukoy sa naunang pangyayari sa konteksto.
- source_word: מַלְאָכִים אֲחֵרִים
  choice: iba pang mga mensahero
  rationale: Dito, ang מַלְאָכִים ay mga taong isinugo ni Saul, hindi mga anghel. Malinaw at pangkaraniwan ang ‘mga mensahero,’ at ipinahihiwatig ng ‘iba pang’ na panibagong pangkat sila.
- source_word: וַיִּתְנַבְּאוּ
  choice: nagpropesiya
  rationale: Pinananatili nito ang malawak na kahulugan ng Hitpael ng נבא nang hindi tinutukoy kung ang pagpapakita ay ekstatikong pananalita, pagpupuri, o ibang gawaing propetiko.
- source_word: גַּם הֵמָּה
  choice: pati sila
  rationale: Mas malinaw na naihahatid ng ‘pati sila’ ang diin na ang mga mensaherong ito, gaya ng naunang pangkat, ay nagpropesiya rin.
- source_word: וַיֹּסֶף שָׁאוּל וַיִּשְׁלַח
  choice: Muling nagsugo si Saul
  rationale: Ang יסף na sinusundan ng isa pang kilos ay nagsasaad ng pag-uulit; natural itong ipinapahayag sa Tagalog sa pamamagitan ng ‘muling.’
- source_word: מַלְאָכִים שְׁלִשִׁים
  choice: mga mensahero sa ikatlong pagkakataon
  rationale: Ang anyo rito ay tumutukoy sa ikatlong pagpapadala o ikatlong pangkat ng mga mensahero, hindi sa bilang na tatlumpu. Iniiwasan ng saling ito ang kalituhan at pinananatili ang daloy ng salaysay.
theological_decisions:
- issue: Kalikasan ng pagpopropesiya ng mga mensahero ni Saul
  choice: Isinalin nang neutral bilang ‘nagpropesiya.’
  alternative: ‘pumasok sa ekstatikong kalagayan’ o ‘kumilos na gaya ng mga propeta’
  rationale: Ipinakikita ng konteksto na isang propetikong pangyayari ang naganap, ngunit hindi tinutukoy ng talata ang eksaktong anyo nito. Kaya hindi nilimitahan ng salin ang kahulugan sa isang partikular na karanasan o pagpapakita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘nagsugo’ at ‘mga mensahero’ bilang natural na salitang angkop sa salaysay. Ang pag-uulit ng ‘pati sila ay nagpropesiya’ ay sadyang pinanatili upang maipakita ang diin at estruktura ng Hebreo.
