  text: I will go out and stand beside my father in the field where you are[a], and I will speak to my father about you. Then I will see what happens and tell you.
translation:
  language: tl
  text: Lalabas ako at tatayo sa tabi ng aking ama sa bukid kung nasaan ka. Kakausapin ko ang aking ama tungkol sa iyo. Pagkatapos, titingnan ko kung ano ang mangyayari[a] at sasabihin ko sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “makikita ko kung ano,” isang pinaikling pahayag na maaaring mangahulugang “titingnan ko kung ano ang mangyayari” o “titingnan ko kung ano ang kalagayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: Lalabas ako
  rationale: Ang Qal imperfect na unang panauhan ng יצא ay nagpapahayag ng balak na pagkilos ni Jonatan. Likas sa makabagong Tagalog ang “lalabas ako” at pinananatili nito ang diwang patungo sa labas.
- source_word: וְעָמַדְתִּי לְיַד אָבִי
  choice: at tatayo sa tabi ng aking ama
  rationale: Ang עמד ay “tumayo,” at ang idyomang לְיַד ay “sa tabi” o “sa gilid ng.” Malinaw at natural ang pinagsamang parirala sa Tagalog.
- source_word: בַּשָּׂדֶה אֲשֶׁר אַתָּה שָׁם
  choice: sa parang na kinaroroonan mo
  rationale: Tinutukoy ng sugnay ang lugar na kinaroroonan ni David. Iniiwasan ng “kinaroroonan mo” ang di-likas na pag-uulit ng literal na “kung saan naroon ka.” Pinili ang “parang” para sa bukas na lupain ng שׂדה sa tagpong ito.
- source_word: אֲדַבֵּר בְּךָ אֶל אָבִי
  choice: Kakausapin ko ang aking ama tungkol sa iyo
  rationale: Sa konstruksiyong ito, ang דבר ב ay nangangahulugang magsalita tungkol o hinggil sa isang tao. Likas at tuwiran ang ayos sa Tagalog.
- source_word: וְרָאִיתִי מָה
  choice: Pagkatapos, aalamin ko kung ano ang mangyayari
  rationale: Eliptiko ang Hebreo, sa literal ay “at makikita ko kung ano.” Ang “aalamin ko kung ano ang mangyayari” ay likas sa Tagalog at ipinahihiwatig ang pagsisiyasat ni Jonatan nang hindi labis na tinutukoy ang resulta.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: at sasabihin ko sa iyo
  rationale: Ang Hiphil ng נגד ay “ipaalam” o “iulat.” Ang “sasabihin ko sa iyo” ang pinakanatural sa usapang ito.
