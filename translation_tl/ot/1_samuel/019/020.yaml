  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח שָׁא֣וּל מַלְאָכִים֮ לָ/קַ֣חַת אֶת דָּוִד֒ וַ/יַּ֗רְא אֶֽת לַהֲקַ֤ת הַ/נְּבִיאִים֙ נִבְּאִ֔ים וּ/שְׁמוּאֵ֕ל עֹמֵ֥ד נִצָּ֖ב עֲלֵי/הֶ֑ם וַ/תְּהִ֞י עַֽל מַלְאֲכֵ֤י שָׁאוּל֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/020.yaml
  text: Then Saul sent messengers to seize David[a]. When they saw the company of prophets prophesying, with Samuel standing over them, the Spirit of God came upon Saul’s messengers[b], and they also prophesied.
translation:
  language: tl
  text: Pagkatapos, nagsugo si Saul ng mga sugo upang dakpin si David. Nang makita nila ang pangkat ng mga propetang nagpopropesiya, habang si Samuel ay nakatayong nangangasiwa sa kanila[a], sumapit sa mga sugo ni Saul ang Espiritu ng Diyos, at nagpropesiya rin sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakatayo sa gitna nila.” Mas literal ang Hebreo na “nakatayo sa ibabaw nila,” na maaaring magpahiwatig na si Samuel ang namumuno o nangangasiwa sa pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים / מַלְאֲכֵי
  choice: mga tauhan / mga sugo
  rationale: Tumutukoy ito sa mga taong ipinadala ni Saul, hindi sa mga anghel. Natural ang “mga tauhan” kasunod ng “nagsugo,” samantalang malinaw na tinutukoy sila ng “mga sugo ni Saul” sa ikalawang banggit.
- source_word: לָקַחַת
  choice: dakpin
  rationale: Bagaman malawak ang kahulugang “kunin,” ipinadadala rito ang mga tauhan upang hulihin si David; malinaw at natural sa konteksto ang “dakpin.”
- source_word: לַהֲקַת הַנְּבִיאִים
  choice: pangkat ng mga propeta
  rationale: Ang לַהֲקָה ay tumutukoy sa isang nagkakatipong grupo; ang “pangkat” ay payak, makabago, at hindi nagdaragdag ng pormal na estrukturang wala sa teksto.
- source_word: נִבְּאִים / וַיִּתְנַבְּאוּ
  choice: nagpopropesiya / nagpropesiya
  rationale: 'Pinananatili nito ang pandiwang diwa at ang pag-uulit sa Hebreo: nagpapatuloy ang gawain ng mga propeta, at sumali rin dito ang mga sugo.'
- source_word: עֹמֵד נִצָּב עֲלֵיהֶם
  choice: nakatayong nangangasiwa sa kanila
  rationale: Ipinahihiwatig ng magkakaugnay na mga salita ang matatag na pagkakatayo ni Samuel kaugnay ng pangkat, na may posibleng diwang pamumuno o pangangasiwa. Isinasaad sa talababa ang tunay na kalabuan ng posisyon at tungkulin.
- source_word: רוּחַ אֱלֹהִים
  choice: Espiritu ng Diyos
  rationale: Pinananatili nito ang tuwirang banal na ahensiya sa parirala nang hindi ipinapasok ang mas huling sistematikong paglilinaw na lampas sa salaysay.
- source_word: וַתְּהִי עַל
  choice: sumapit sa
  rationale: Natural itong Filipino para sa biglang pagdating ng makapangyarihang impluwensiya ng Espiritu sa mga sugo at pinananatili ang pangyayaring ipinahahayag ng Hebreong parirala.
- source_word: גַּם הֵמָּה
  choice: rin sila
  rationale: Pinananatili nito ang diin na maging ang mga sugo ni Saul ay nagpropesiya, gaya ng pangkat na nakita nila.
theological_decisions:
- issue: Ang kalikasan ng רוּחַ אֱלֹהִים sa salaysay
  choice: “sumapit sa mga sugo ni Saul ang Espiritu ng Diyos”
  alternative: “sumapit sa mga sugo ni Saul ang isang espiritung mula sa Diyos”
  rationale: Sa kontekstong ito, ang parirala ay pinakanatural na tumutukoy sa makapangyarihang pagkilos ng Espiritu ng Diyos. Pinananatili ng salin ang banal na ahensiya ngunit hindi dinaragdagan ang teksto ng dogmatikong paliwanag.
- issue: Ang posisyon ni Samuel sa pangkat ng mga propeta
  choice: “nakatayong nangangasiwa sa kanila”
  alternative: “nakatayo sa gitna nila” o mas literal na “nakatayo sa ibabaw nila”
  rationale: Maaaring magpahiwatig ang עֲלֵיהֶם ng posisyon sa ibabaw o harap at, sa konteksto, ng pamumuno. Inilalagay sa talababa ang alternatibo upang hindi ikubli ang kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “dakpin,” “pangkat,” at “nagpropesiya,” habang iniwasan ang sobrang teknikal o denominasyonal na pananalita. Inilagay ang talababa sa mismong pariralang may leksikal na kalabuan.
