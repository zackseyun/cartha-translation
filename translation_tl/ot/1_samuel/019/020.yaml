  terminology: Ang “dakpin,” “pangkat ng mga propeta,” “nagpopropesiya,” “Espiritu ng Diyos,” at “nagpropesiya rin sila” ay angkop. Ang “nakatayong nangangasiwa” ay katanggap-tanggap bilang pangunahing pagbasa, basta pinananatili ng talababa ang alternatibong posisyunal at ang di-ganap na katiyakan ng pahiwatig na pamumuno.
