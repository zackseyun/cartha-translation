base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/019.yaml
  text: And it was reported to Saul[a], saying, “Look, David is at Naioth in Ramah.”
translation:
  language: tl
  text: At iniulat kay Saul, “Naroon si David sa Naiot, sa Rama.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tingnan mo, si David ay nasa Naiot sa Rama.”
    reason: Pinananatili ng alternatibo ang mas tahasang pantawag-pansing puwersa ng הִנֵּה at ang hiwalay na lokatibong anyo ng Hebreo.
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: iniulat
  rationale: Pinananatili ng pandiwang balintiyak ang di-tiyak na tagapaghatid ng balita, at natural ito sa makabagong Filipino.
- source_word: לְשָׁאוּל
  choice: kay Saul
  rationale: Karaniwang pananda sa di-tuwirang layon bago ang pangalan ng tao.
- source_word: לֵאמֹר
  choice: ipinakilala sa tuwirang sipi
  rationale: Ang Hebreong panandang pangsipi ay likas na naipahahayag sa Filipino sa pamamagitan ng kuwit at tuwirang sipi; ang literal na “na sinasabi” ay magiging mabigat at di-natural.
- source_word: הִנֵּה
  choice: Naroon
  rationale: Sa konteksto ng iniulat na kinaroroonan, pinagsasama nito ang pantawag-pansing diin ng הִנֵּה at ang lokatibong pahayag sa natural na Filipino.
- source_word: דָוִד
  choice: David
  rationale: Karaniwang anyo ng pangalang pantangi sa Filipino.
- source_word: בְּנוָיֹת
  choice: sa Naiot
  rationale: Ang בְּ ay lokatibo; ang “sa” ang natural na katumbas sa Filipino, at ang Naiot ay pinananatiling pangalan ng lugar.
- source_word: בָּרָמָה
  choice: sa Rama
  rationale: Tinutukoy nito ang mas malawak na lokasyon ng Naiot; natural ang “sa” sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginawang natural ang Hebreong pormulang לֵאמֹר sa pamamagitan ng tuwirang sipi, habang inilagay sa talababa ang mas pormal at tahasang salin ng הִנֵּה.
