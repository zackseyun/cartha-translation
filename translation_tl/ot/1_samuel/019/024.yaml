base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/024.yaml
  text: He too stripped off his clothes[a], and he too prophesied before Samuel. He lay naked all that day and all that night. Therefore they say[b], “Is Saul also among the prophets?”
translation:
  language: tl
  text: Hinubad din niya ang kanyang mga damit, at siya rin ay nagpropesiya sa harap ni Samuel. Bumagsak siyang hubad[a], at nakahandusay siya buong araw na iyon at buong gabi. Kaya nga sinasabi, “Pati ba si Saul ay kabilang sa mga propeta?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “hubad” ay maaaring mangahulugang ganap na walang saplot o nakahubad ng panlabas na kasuotan; hindi ito higit na nililinaw ng Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁט ... בְּגָדָיו
  choice: Hinubad ... ang kanyang mga damit
  rationale: Tuwirang ipinahahayag ng פשט kasunod ng בגדים ang pag-aalis ng mga damit. Likas at malinaw sa modernong Filipino ang “hinubad ang kanyang mga damit.”
- source_word: גַּם הוּא
  choice: din niya / siya man
  rationale: Pinananatili ng dalawang anyo ang inuulit na diin na pati si Saul, gaya ng mga naunang sugo, ay dumanas nito, nang hindi nagiging asiwa ang Tagalog.
- source_word: וַיִּתְנַבֵּא
  choice: nagpropesiya
  rationale: Karaniwang salin ito na hindi nagpapasiya kung ang gawain ay prediktibong pananalita, ekstatikong kilos, o pareho.
- source_word: לִפְנֵי שְׁמוּאֵל
  choice: sa harap ni Samuel
  rationale: Natural na katumbas ng לפני sa diwang nasa presensiya ni Samuel.
- source_word: וַיִּפֹּל עָרֹם
  choice: Bumagsak siyang hubad at nanatili roon
  rationale: Pinananatili ng “bumagsak” ang literal na puwersa ng נפל, samantalang nililinaw ng “nanatili roon” ang kalagayang tumagal nang buong araw at gabi. Ang עָרֹם ay tuwirang isinaling “hubad.”
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: nang buong araw at buong gabi
  rationale: Natural sa Filipino at pinananatili ang diin sa buong tagal.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: Kaya sinasabi ng mga tao
  rationale: Ipinakikilala nito sa natural na Filipino ang kasabihang ipinaliliwanag ng pangyayari. Ang di-tiyak na paksa ng pandiwa ay idiomatikong ipinahayag bilang “mga tao.”
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִם
  choice: Pati ba si Saul ay kabilang sa mga propeta?
  rationale: Pinananatili ang anyong patanong at ang diwa ng pagiging kabilang “sa mga propeta.”
theological_decisions:
- issue: Saklaw ng pagiging hubad ni Saul (עָרֹם)
  choice: hubad
  alternative: nakahubad lamang ng panlabas na kasuotan
  rationale: Karaniwang kahulugan ng עָרֹם ang “hubad,” at hindi nililimitahan ng talata ang antas nito. Inilalagay sa talababa ang posibleng diwa ng pagkakahubad ng panlabas na kasuotan upang mapanatili ang tunay na kalabuan.
- issue: Kalikasan ng propetikong gawain ni Saul
  choice: nagpropesiya
  alternative: napasailalim sa ekstatikong kalagayang propetiko / kumilos na parang propeta
  rationale: Hindi tinutukoy ng teksto kung ito ay prediktibong pagsasalita, ekstatikong pagkilos, o kapwa. Ang “nagpropesiya” ang hindi gaanong mapagpasiyang salin.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “nagpropesiya” bilang karaniwang terminong biblikal; iniwasan ang pagpapaliwanag sa uri ng karanasan ni Saul. Ang marker na [a] ay nasa pangunahing teksto at tumutugma sa talababa.
