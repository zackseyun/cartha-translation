  text: וַ/יֵּ֨לֶךְ גַּם ה֜וּא הָ/רָמָ֗תָ/ה וַ/יָּבֹא֙ עַד בּ֤וֹר הַ/גָּדוֹל֙ אֲשֶׁ֣ר בַּ/שֶּׂ֔כוּ וַ/יִּשְׁאַ֣ל וַ/יֹּ֔אמֶר אֵיפֹ֥ה שְׁמוּאֵ֖ל וְ/דָוִ֑ד וַ/יֹּ֕אמֶר הִנֵּ֖ה ב/נוית בָּ/רָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/022.yaml
  text: He too went to Ramah[a], and he came as far as the great well that is at Seku. He asked and said, “Where are Samuel and David?” And one said, “Look[b], they are at Naioth in Ramah.”
translation:
  language: tl
  text: Pumunta rin siya sa Rama at nakarating hanggang sa malaking balon[a] sa Seku. Nagtanong siya, “Nasaan sina Samuel at David?” May sumagot[b], “Naroon sila sa Naiot sa Rama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malaking imbakan ng tubig” o “malaking hukay.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “At sinabi niya”; hindi tinukoy kung sino ang sumagot.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָמָתָה
  choice: sa Rama
  rationale: Ang hulaping panlunan na nagpapahiwatig ng patutunguhan ay likas na naipapahayag sa Filipino sa pamamagitan ng “sa Rama” kasunod ng pandiwang “pumunta.”
- source_word: בּוֹר הַגָּדוֹל
  choice: malaking balon
  rationale: Maaaring tumukoy ang בּוֹר sa balon, imbakan ng tubig, o hukay. Ang “malaking balon” ay natural bilang kilalang palatandaan sa lugar, habang inilalahad sa talababa ang tunay na lawak ng kahulugan.
- source_word: בַּשֶּׂכוּ
  choice: na nasa Seku
  rationale: Pangalan ito ng lugar; pinanatili ang transliterasyon at ginamit ang likas na pariralang panlokasyon sa Filipino.
- source_word: וַיִּשְׁאַל וַיֹּאמֶר
  choice: nagtanong siya
  rationale: Ang magkasunod na Hebreong pandiwa ay nagpapakilala ng tuwirang tanong. Sa natural na Filipino, sapat na ang “nagtanong siya” nang hindi inuulit ang diwa sa “at sinabi.”
- source_word: אֵיפֹה שְׁמוּאֵל וְדָוִד
  choice: Nasaan sina Samuel at David?
  rationale: Ginamit ang “sina” para sa dalawang taong tinutukoy at ang karaniwang anyong “nasaan” para sa tanong tungkol sa kinaroroonan.
- source_word: הִנֵּה
  choice: Naroon
  rationale: Sa sagot na ito, ang הִנֵּה ay may pansin-panturo o deiktikong bisa. Ang “Naroon” ay natural na Filipino at pinagsasama ang pagtuturo at pahayag tungkol sa kanilang kinaroroonan.
- source_word: בנוית בָּרָמָה
  choice: sa Naiot sa Rama
  rationale: Pinanatili ang mga pangalang pantangi sa transliterasyon; ang ikalawang “sa Rama” ay tumutukoy kung aling Naiot ang tinutukoy.
- source_word: וַיֹּאמֶר
  choice: May sumagot
  rationale: Walang tinukoy na simuno ang Hebreo sa tugon. Ang “May sumagot” ay malinaw at natural ngunit hindi nagpapakilala ng isang partikular na taong wala sa teksto.
