translation_notes:
  register: Modernong Filipino na malinaw, marangal, at natural. Hinati sa dalawang pangungusap ang salaysay upang maiwasan ang mabigat na sunod-sunod na pangungusap, ngunit pinanatili ang pagkakasunod ng mga kilos at ang hindi pagtukoy sa taong sumagot.
