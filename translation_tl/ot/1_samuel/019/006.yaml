  source_fidelity: Tumpak na naipahayag ang kahulugang ng וַיִּשְׁמַע בְּקוֹל bilang pakikinig/pagtalima ni Saul sa sinabi ni Jonatan. Wasto ang “sumumpa,” ang panunumpang “Buhay si Yahweh,” at ang mariing negatibong diwa ng eliptikong אִם יוּמָת. Ang “si David” ay isang katanggap-tanggap na paglilinaw ng malinaw na tinutukoy ng panghalip sa konteksto at hindi nagbabago ng kahulugan.
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “Nakinig si Saul sa sinabi ni Jonatan” ay idiomatiko; ang “Buhay si Yahweh, hindi papatayin si David” ay malinaw at angkop sa panunumpa.
  terminology: Konsistent ang “Yahweh” para sa יהוה. Ang “sumumpa” at “papatayin” ay tumpak para sa Hebreong pandiwang panunumpa at sa Hophil na “ipapatay/papatayin.”
