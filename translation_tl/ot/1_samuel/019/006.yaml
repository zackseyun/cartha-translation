  text: וַ/יִּשְׁמַ֥ע שָׁא֖וּל בְּ/ק֣וֹל יְהוֹנָתָ֑ן וַ/יִּשָּׁבַ֣ע שָׁא֔וּל חַי יְהוָ֖ה אִם יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/006.yaml
  text: Saul listened to Jonathan’s voice[a], and Saul swore, “As Yahweh lives, he shall not be put to death.”
translation:
  language: tl
  text: Nakinig si Saul sa sinabi ni Jonatan, at sumumpa siya, “Buhay si Yahweh, hindi papatayin si David.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo, “Buhay si Yahweh, kung siya ay papatayin ...” Isa itong eliptikong pormula ng panunumpa na nagpapahayag ng mariing pagtanggi: “tiyak na hindi siya papatayin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע ... בְּקוֹל יְהוֹנָתָן
  choice: Nakinig si Saul sa sinabi ni Jonatan
  rationale: Ang שׁמע בקול ay nangangahulugang makinig at tumalima, hindi lamang makarinig. Mas natural sa modernong Tagalog ang “nakinig ... sa sinabi” kaysa literal na “nakinig sa tinig.”
- source_word: וַיִּשָּׁבַע
  choice: sumumpa siya
  rationale: Tuwirang ipinahahayag nito ang taimtim na panunumpa ni Saul at natural itong gamitin bago ang sipi ng kanyang pananalita.
- source_word: חַי יְהוָה
  choice: Buhay si Yahweh
  rationale: Pinananatili nito ang Hebreong pormula ng panunumpa at ang personal na pangalang יְהוָה sa malinaw at marangal na Tagalog.
- source_word: אִם יוּמָת
  choice: hindi papatayin si David
  rationale: Sa pormula ng panunumpa, ang אִם ay eliptiko at nagpapahiwatig ng mariing pagtanggi. Ang Hophil na יוּמָת ay pasibo at causative, kaya “papatayin,” hindi lamang “mamamatay.” Tinukoy si David ayon sa malinaw na referent sa konteksto upang maiwasan ang malabong panghalip sa Tagalog.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Ang “Yahweh” ay direktang transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Lakas ng eliptikong pormula ng panunumpa na אִם יוּמָת
  choice: hindi papatayin si David
  alternative: kung papatayin siya
  rationale: Sa Hebreong panunumpa, eliptiko ang “kung” at may ipinahihiwatig na sumpa; ang praktikal na kahulugan nito rito ay mariing pangakong hindi siya papatayin. Inilagay sa talababa ang literal na anyo upang mapanatili ang katangiang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “sa sinabi ni Jonatan” bilang idiomatikong katumbas ng “sa tinig ni Jonatan,” at pinanatili sa talababa ang literal na anyo at puwersa ng Hebreong pormula ng panunumpa.
