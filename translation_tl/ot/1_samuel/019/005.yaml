id: 1SA.19.5
reference: 1 Samuel 19:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ אֶת נַפְשׁ֨/וֹ בְ/כַפּ֜/וֹ וַ/יַּ֣ךְ אֶת הַ/פְּלִשְׁתִּ֗י וַ/יַּ֨עַשׂ יְהוָ֜ה תְּשׁוּעָ֤ה גְדוֹלָה֙ לְ/כָל יִשְׂרָאֵ֔ל רָאִ֖יתָ וַ/תִּשְׂמָ֑ח וְ/לָ֤/מָּה תֶֽחֱטָא֙ בְּ/דָ֣ם נָקִ֔י לְ/הָמִ֥ית אֶת דָּוִ֖ד חִנָּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/005.yaml
  text: For he put his life in his hand and struck down the Philistine[a], and Yahweh brought about a great salvation for all Israel. You saw it and rejoiced[c][b]. So why should you sin against innocent blood by putting David to death for no reason?
translation:
  language: tl
  text: Sapagkat itinaya niya ang kanyang buhay[a] at pinabagsak ang Filisteo, at nagdulot si Yahweh ng malaking pagliligtas[b] para sa buong Israel. Nakita mo iyon at nagalak ka. Kaya bakit ka magkakasala sa pagdanak ng dugong walang sala—sa pagpatay kay David nang walang dahilan?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “inilagay niya ang kanyang buhay sa kanyang palad.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “malaking tagumpay” o “dakilang kaligtasan.”
    reason: lexical_alternative
  - marker: c
    text: O “nang walang sapat na batayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֶת־נַפְשׁוֹ בְכַפּוֹ
  choice: itinaya niya ang kanyang buhay
  rationale: Ang literal na idyomang Hebreo ay “inilagay niya ang kanyang buhay sa kanyang palad.” Ang “itinaya niya ang kanyang buhay” ang natural na katumbas sa makabagong Tagalog at malinaw na nagpapahayag ng panganib na ikamatay.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  choice: pinabagsak ang Filisteo
  rationale: Sa konteksto, tinutukoy ng נכה ang paggapi kay Goliat na humantong sa kamatayan. Pinananatili ng “pinabagsak” ang masiglang paglalarawan ng kilos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinalitan ng isang titulo.
- source_word: וַיַּעַשׂ ... תְּשׁוּעָה גְדוֹלָה
  choice: nagdulot ... ng malaking pagliligtas
  rationale: Ang עשה kasama ng abstraktong layon ay nangangahulugang nagsakatuparan o nagdulot. Saklaw ng תְּשׁוּעָה ang pagliligtas, tagumpay, at kaligtasan; ang “pagliligtas” ay angkop sa konkretong pangyayaring militar nang hindi inaalis ang mas malawak na diwa.
- source_word: רָאִיתָ וַתִּשְׂמָח
  choice: Nakita mo iyon at nagalak ka
  rationale: Tuwirang kinakausap si Saul. Ang “iyon” ay likas na ipinahihiwatig ng konteksto bilang layon ng “nakita.”
- source_word: וְלָמָּה תֶחֱטָא
  choice: Kaya bakit ka magkakasala
  rationale: Ipinapakita ng “kaya” ang pangangatwirang nakabatay sa naunang pagkakita at pagkagalak ni Saul; pinananatili ng tanong ang retorikal at pasulong na diwa ng imperfect.
- source_word: בְּדָם נָקִי
  choice: sa pagdanak ng dugong walang sala
  rationale: Ang parirala ay tumutukoy sa pagkakasala sa inosenteng dugo. Ginagawang natural at malinaw sa Tagalog ng “pagdanak” ang legal at moral na diwa ng bloodguilt.
- source_word: לְהָמִית אֶת־דָּוִד חִנָּם
  choice: sa pagpatay kay David nang walang dahilan
  rationale: Ipinapaliwanag ng infinitive ang gawaing magiging kasalanan, at ang חִנָּם ay nagsasaad na wala itong sapat na dahilan o batayan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang personal na pangalang YHWH. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng תְּשׁוּעָה sa kontekstong militar
  choice: malaking pagliligtas
  alternative: malaking tagumpay; dakilang kaligtasan
  rationale: Militar ang agarang konteksto, ngunit mas malawak ang saklaw ng salitang Hebreo kaysa sa tagumpay lamang. Ang “pagliligtas” ay angkop sa pangyayari at nagpapanatili ng mas malawak na teolohikal na pahiwatig.
- issue: Paglalahad sa בְּדָם נָקִי
  choice: sa pagdanak ng dugong walang sala
  alternative: laban sa dugong walang sala
  rationale: Ang una ay mas natural sa Tagalog at malinaw na naghahayag ng bloodguilt. Hindi nito binabago ang paratang, sapagkat agad itong nililinaw ng “sa pagpatay kay David.”
translation_notes:
  register: Makabagong Filipino Tagalog na natural ngunit marangal. Ginamit ang “itinaya ang buhay” bilang malinaw na katumbas ng idyomang Hebreo, habang inilagay sa talababa ang literal na larawan. Pinanatili ang personal na pangalang Yahweh at ang legal-moral na bigat ng “dugong walang sala.”
