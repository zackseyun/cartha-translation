translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “mga sugo” sa halip na “mga mensahero” dahil mga tauhang inatasang kumilos ang tinutukoy. Pinanatili sa talababa ang tunay na kalabuan ng בַמִּטָּה.
