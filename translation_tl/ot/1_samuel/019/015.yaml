base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/015.yaml
  text: Then Saul sent the messengers to see David[a], saying, “Bring him up to me in the bed, so that I may put him to death.”
translation:
  language: tl
  text: Pagkatapos, isinugo ni Saul ang mga sugo upang tingnan si David[a]. Sinabi niya, “Iakyat ninyo siya sa akin habang nasa higaan siya, upang patayin ko siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa higaan” o “kasama ang higaan.” Maaaring maunawaan sa iba’t ibang paraan ang pang-ukol sa Hebreo; malamang na ipinag-uutos ni Saul na dalhin si David habang nakahiga pa siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Pagkatapos, isinugo ni Saul
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay; natural sa modernong Tagalog ang “Pagkatapos,” at ang “isinugo” ay angkop sa pagpapadala ng mga tauhan para sa isang atas.
- source_word: הַמַּלְאָכִים
  choice: ang mga sugo
  rationale: Sa kontekstong ito, ang מַלְאָךְ ay mga taong ipinadala ni Saul, hindi mga anghel; malinaw at marangal ang “mga sugo.”
- source_word: לִרְאוֹת
  choice: upang tingnan
  rationale: Pinananatili nito ang payak na diwa ng ראה na “makita/tingnan,” nang hindi tiyak na ipinapakahulugang siyasatin o tiyakin ang kalagayan ni David.
- source_word: לֵאמֹר
  choice: Sinabi niya
  rationale: Ipinakikilala nito nang natural sa Tagalog ang tuwirang utos, habang malinaw na si Saul ang nagsasalita.
- source_word: הַעֲלוּ
  choice: Dalhin ninyo siya rito
  rationale: Ang Hiphil ng עלה ay “paakyatin/dalhin pataas.” Hindi natural ang tahasang “iaakyat” kung walang malinaw na heograpikong sanggunian sa Tagalog, kaya “dalhin ... rito” ang naghahatid ng direksiyon patungo kay Saul.
- source_word: בַמִּטָּה
  choice: na nasa higaan
  rationale: Ipinahihiwatig na dadalhin si David habang nakahiga pa, ngunit nilalagyan ng talababa dahil maaaring unawain ang ב bilang “nasa,” “sa ibabaw ng,” o “kasama ang” higaan.
- source_word: אֵלַי
  choice: rito sa akin
  rationale: Tuwirang patutunguhan si Saul; likas sa utos sa Tagalog ang “rito sa akin.”
- source_word: לַהֲמִתוֹ
  choice: upang maipapatay ko siya
  rationale: Ang ל ay nagpapahayag ng layunin. Ang causative na anyo ng מות ay maaaring ipahayag bilang “ipapatay”; pinananatili nito ang posibilidad na si Saul ang mag-utos o maging sanhi ng pagpatay, sa halip na sabihing siya mismo ang papatay.
