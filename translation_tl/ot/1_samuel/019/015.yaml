  source_fidelity: 'Ang pangunahing diwa ay wastong naihahatid: muling nagsugo si Saul ng mga tauhan upang tingnan si David at iniutos na dalhin siya upang patayin. Gayunman, hindi naipakita ng “Dalhin ... rito” ang pandiwang Hiphil ng עלה (“iakyat/dalhin pataas”), at ang “maipapatay ko” ay maaaring magpahiwatig nang mas tiyak na ipinapapatay niya ito sa iba kaysa sa simpleng layuning “patayin ko siya” ng Hebreo.'
  naturalness: Hindi likas ang pagkakabit ng “na nasa higaan” sa “siya” pagkatapos ng “rito sa akin.” Mas malinaw at natural ang “habang nasa higaan siya,” samantalang pinananatili ng talababa ang iba pang posibleng pagbasa ng pang-ukol.
  terminology: Ang “mga sugo,” “tingnan,” at “patayin” ay angkop sa modernong Filipino Tagalog at sa marangal ngunit malinaw na rehistro ng salaysay. Ang “patayin ko siya” ay hindi nagdaragdag ng isang hiwalay na ahenteng papatay at sapat na isinasalin ang Hiphil ng מות sa gamit nito rito.
