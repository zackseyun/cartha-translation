  yaml_path: translation/ot/1_samuel/019/014.yaml
  text: Then Saul sent messengers to seize David[a], and she said, “He is sick.”
translation:
  language: tl
  text: Pagkatapos, nagsugo si Saul ng mga sugo upang dakpin si David, at sinabi niya[a], “May sakit siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, pambabaeng isahan ang anyo ng pandiwang “sinabi”; batay sa konteksto, si Mical ang nagsalita.
    reason: Nililinaw ang kasariang nakasaad sa pandiwang Hebreo ngunit hindi maipahahayag ng likas na Tagalog na panghalip na “niya.”
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Pagkatapos, nagsugo
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay; natural sa makabagong Tagalog ang “Pagkatapos,” habang pinananatili ang daloy.
- source_word: מַלְאָכִים
  choice: mga sugo
  rationale: Tumutukoy rito sa mga taong isinugo ni Saul, hindi sa mga anghel. Pinananatili ng “mga sugo” ang pangunahing diwa nang hindi labis na tinutukoy ang kanilang tungkulin.
- source_word: לָקַחַת
  choice: upang dakpin
  rationale: Bagaman malawak ang kahulugang “kunin,” malinaw sa konteksto na ipinadakip ni Saul si David. Likas at tiyak sa Tagalog ang “dakpin.”
- source_word: אֶת דָּוִד
  choice: si David
  rationale: Tuwirang layon ang pangalang David; ginagamit ang panandang “si” ayon sa gramatika ng Tagalog.
- source_word: וַתֹּאמֶר
  choice: at sinabi niya
  rationale: Pinananatili ng “at” ang payak na pang-ugnay ng Hebreo. Ang pandiwa sa Hebreo ay pambabaeng isahan, samantalang likas na hindi nagtatangi ng kasarian ang Tagalog na “niya.”
- source_word: חֹלֶה הוּא
  choice: May sakit siya
  rationale: Ito ang natural at karaniwang paraan sa makabagong Tagalog upang sabihing may karamdaman ang isang tao, habang pinananatili ang payak na pahayag.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga sugo” para sa mga taong ipinadala ni Saul at ang “dakpin” para sa layunin nilang hulihin si David. Pinanatili ang payak na pang-ugnay na “at” sa halip na magdagdag ng di-tahasang pagsalungat.
