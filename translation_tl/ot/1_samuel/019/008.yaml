  text: וַ/תּ֥וֹסֶף הַ/מִּלְחָמָ֖ה לִֽ/הְי֑וֹת וַ/יֵּצֵ֨א דָוִ֜ד וַ/יִּלָּ֣חֶם בַּ/פְּלִשְׁתִּ֗ים וַ/יַּ֤ךְ בָּ/הֶם֙ מַכָּ֣ה גְדוֹלָ֔ה וַ/יָּנֻ֖סוּ מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/008.yaml
  text: And the war broke out again[a], and David went out and fought against the Philistines and struck them with a great blow, so that they fled before him.
translation:
  language: tl
  text: Muling sumiklab ang digmaan[a]. Lumabas si David at nakipaglaban sa mga Filisteo. Lubha niya silang tinalo, kaya tumakas sila mula sa harap niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nagpatuloy ang digmaan” o “Nagkaroon muli ng digmaan.” Literal na sinasabi ng idyomang Hebreo na “nagdagdag ang digmaan na mangyari,” na maaaring tumukoy sa muling pagsiklab o pagpapatuloy ng labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף הַמִּלְחָמָה לִהְיוֹת
  choice: Muling sumiklab ang digmaan
  rationale: Likas sa modernong Tagalog at ipinapahayag ang pag-ulit o pagpapatuloy ng labanan na saklaw ng idyomang Hebreo na may יסף at infinitive ng היה. Pinananatili sa talababa ang tunay na posibilidad na ang tinutukoy ay pagpapatuloy, hindi lamang panibagong pagsiklab.
- source_word: וַיֵּצֵא דָוִד
  choice: Lumabas si David
  rationale: Tuwirang pinananatili ang di-tiyak na pandiwang 'lumabas'; ipinahihiwatig ng konteksto ang paglabas upang makipagdigma ngunit hindi ito idinaragdag sa mismong parirala.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: nakipaglaban sa mga Filisteo
  rationale: Karaniwang Tagalog para sa pakikipagsagupaan laban sa isang kaaway. Malinaw sa konteksto na kaaway ang mga Filisteo, kaya hindi kailangang idagdag ang 'laban' matapos ang 'nakipaglaban.'
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: Lubha niya silang tinalo
  rationale: Natural na katumbas ng Hebreong kolokasyon para sa pagpapataw ng isang matinding dagok o pagkatalo. Hindi nito labis na tinutukoy na malawakang pagpatay ang nangyari.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: tumakas sila mula sa harap niya
  rationale: Pinananatili ang larawan ng Hebreong מִפָּנָיו, bagaman bahagyang mas pormal ito kaysa sa simpleng 'tumakas sila sa kanya.'
