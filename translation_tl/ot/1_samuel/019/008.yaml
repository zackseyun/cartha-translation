  source_fidelity: 'Tapat ang salin sa daloy at saklaw ng Hebreo: muling/patuloy na digmaan, paglabas ni David, pakikipaglaban sa mga Filisteo, matinding pagkatalo, at pagtakas nila mula sa kanyang harapan. Ang ''Lubha niya silang tinalo'' ay isang katanggap-tanggap na idiomatikong pagsasalin ng ''nagbigay siya sa kanila ng malaking dagok'' nang hindi nagdaragdag ng detalye tungkol sa mga napatay.'
