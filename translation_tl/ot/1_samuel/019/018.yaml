  text: וְ/דָוִ֨ד בָּרַ֜ח וַ/יִּמָּלֵ֗ט וַ/יָּבֹ֤א אֶל שְׁמוּאֵל֙ הָ/רָמָ֔תָ/ה וַ/יַּ֨גֶּד ל֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר עָֽשָׂה ל֖/וֹ שָׁא֑וּל וַ/יֵּ֤לֶךְ הוּא֙ וּ/שְׁמוּאֵ֔ל וַ/יֵּשְׁב֖וּ ב/נוית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/018.yaml
  text: David fled and escaped[a], and he came to Samuel at Ramah and told him all that Saul had done to him. Then he and Samuel went and stayed at Naioth.
translation:
  language: tl
  text: Tumakas si David at nakaligtas. Pumunta siya kay Samuel sa Rama at sinabi rito ang lahat ng ginawa sa kanya ni Saul. Pagkatapos, magkasama silang pumunta sa Naiot[a] at nanatili roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Naiot ay pangalang Hebreo ng isang lugar, na malamang ay tumutukoy sa mga tirahan o pamayanang kaugnay ng Rama.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרַח וַיִּמָּלֵט
  choice: Tumakas si David at nakaligtas
  rationale: 'Pinananatili ang dalawang magkatuwang na kilos: ang pagtakas mula sa panganib at ang matagumpay na pagkaligtas, nang hindi ipinahihiwatig na tahasang sinabi rito ang banal na pagliligtas.'
- source_word: וַיָּבֹא אֶל שְׁמוּאֵל הָרָמָתָה
  choice: Pumunta siya kay Samuel sa Rama
  rationale: Ang hulaping direksiyonal sa Rama ay nagsasaad ng pagpunta roon; natural sa Filipino na ilahad si Samuel bilang pinuntahan at ang Rama bilang kinaroroonan niya.
- source_word: וַיַּגֶּד לוֹ
  choice: sinabi rito
  rationale: Karaniwang salaysay na kahulugan ng Hiphil נגד ang pagsasabi o pag-uulat. Ang “rito” ay malinaw na tumutukoy kay Samuel at umiiwas sa sunod-sunod na “sa kanya.”
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לוֹ שָׁאוּל
  choice: ang lahat ng ginawa sa kanya ni Saul
  rationale: Pinananatili ang saklaw ng כָּל at ang personal na layon nang walang dagdag na pagpapakahulugan.
- source_word: וַיֵּלֶךְ הוּא וּשְׁמוּאֵל
  choice: magkasama silang pumunta
  rationale: Likas na Filipino para sa tahasang tambalang paksa na si David at si Samuel; malinaw sa naunang pangungusap kung sino ang tinutukoy ng “sila.”
- source_word: וַיֵּשְׁבוּ
  choice: nanatili roon
  rationale: Sa konteksto ng paglalakbay, ang pandiwa ay tumutukoy sa panunuluyan o pananatili, hindi lamang sa literal na pag-upo.
- source_word: בְּנוָיֹות
  choice: sa Naiot
  rationale: Itinuturing na pangalang-pook at isinasalin sa anyong transliterado; ang “sa” ay natural para sa pananatili sa isang lugar.
