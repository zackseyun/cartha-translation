translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang “Rama” at “Naiot” bilang natural na transliterasyon sa Tagalog. Inilagay ang tanging talababa sa mismong pangalang “Naiot,” na siyang tinatalakay nito.
