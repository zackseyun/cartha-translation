base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/002.yaml
  text: Jonathan told David[a], saying, “Saul my father is seeking to kill you. So now, please be on your guard in the morning, and stay in a secret place and hide yourself.”
translation:
  language: tl
  text: Sinabi ni Jonatan kay David, “Hinahangad ng ama kong si Saul na patayin ka. Kaya ngayon, mag-ingat ka sana sa umaga. Manatili ka sa isang tagong lugar[a] at magtago ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “manatili kang nakatago.” Pinagsasama ng Hebreo ang pandiwang “manatili” at ang pangngalang maaaring mangahulugang “lihim” o “taguan,” at sinusundan pa ito ng “magtago ka” bilang pagdiriin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: Sinabi
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi o magbigay-alam. Likas at tuwiran sa makabagong Tagalog ang “Sinabi” bilang pambungad sa mismong pananalita.
- source_word: לֵאמֹר
  choice: ipinahiwatig sa tuwirang sipi
  rationale: Hindi na isinalin nang hiwalay ang pormulang Hebreo na “sinasabi,” sapagkat sapat at mas natural sa Tagalog ang “Sinabi ...” na sinusundan ng tuwirang sipi.
- source_word: מְבַקֵּשׁ
  choice: Hinahangad
  rationale: Ipinapahayag ng participle ang kasalukuyan at nagpapatuloy na layunin ni Saul. Pinananatili ng “Hinahangad” ang intensiyon nang hindi ipinapalagay na nagsimula na siyang aktuwal na sumubok.
- source_word: לַהֲמִיתֶךָ
  choice: na patayin ka
  rationale: Ang Hiphil ng מות ay idiomatikong nangangahulugang pumatay. Ang “patayin ka” ay malinaw at hindi nagdaragdag ng diwang legal o pormal na pagbitay.
- source_word: הִשָּׁמֶר נָא
  choice: mag-ingat ka sana
  rationale: Inihahatid ng “mag-ingat ka” ang reflexive na utos na bantayan ang sarili, samantalang ipinakikita ng “sana” ang pagpapalambot o pakiusap na taglay ng נָא.
- source_word: בַבֹּקֶר
  choice: sa umaga
  rationale: Ito ang tuwirang kahulugan ng parirala. Hindi ginawang “bukas ng umaga” upang hindi magdagdag ng espesipikong panahong hindi tahasang nasa Hebreo.
- source_word: וְיָשַׁבְתָּ
  choice: Manatili ka
  rationale: Bagaman maaari itong literal na mangahulugang “umupo,” sa konteksto ng pagtatago ay angkop ang “manatili,” na nagpapahayag ng pananatili sa isang lugar.
- source_word: בַסֵּתֶר
  choice: sa isang tagong lugar
  rationale: Ang סֵתֶר ay maaaring tumukoy sa lihim, pagtatago, o taguan. Pinananatili ng “tagong lugar” ang kongkretong, lokatibong diwa.
- source_word: וְנַחְבֵּאתָ
  choice: at magtago ka
  rationale: Tuwirang inilalarawan ng pandiwa ang pagtatago ng sarili. Pinananatili rin nito ang mariing pag-uulit kasunod ng utos na manatili sa tagong lugar.
- source_word: יְהוֹנָתָן ... לְדָוִד ... שָׁאוּל אָבִי
  choice: Jonatan ... David ... ama kong si Saul
  rationale: Ginamit ang karaniwang anyong Tagalog ng mga pangalan. Ang “ama kong si Saul” ay natural sa Tagalog at pinananatili ang personal na tensiyon sa babala ni Jonatan.
