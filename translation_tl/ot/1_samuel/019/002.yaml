  naturalness: Likas at malinaw ang makabagong Tagalog. Ang “ama kong si Saul” ay natural na ayos ng pananalita, at ang dalawang magkakasunod na utos tungkol sa pagtatago ay hindi kalabisan kundi sinasadyang pagdiriin na nasa pinagmulan.
