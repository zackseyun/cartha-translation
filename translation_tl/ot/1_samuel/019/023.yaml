base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/023.yaml
  text: So he went there[a], to Naioth in Ramah, and the Spirit of God came upon him also; and he went on, prophesying[b], until he came to Naioth in Ramah.
translation:
  language: tl
  text: Kaya pumunta siya roon, sa Naiot sa Rama,[a] at dumating din sa kanya ang Espiritu ng Diyos.[b] Nagpatuloy siyang maglakad habang nagpopropesiya hanggang sa makarating siya sa Naiot sa Rama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Naiot na nasa Rama.”
    reason: lexical_alternative
  - marker: b
    text: O, “ang espiritu ng Diyos ay nasa kanya rin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נוית בָּרָמָה
  choice: Naiot sa Rama
  rationale: Isinalin ang mga pangalang-pook sa karaniwang anyong Filipino; pinananatili ng “sa Rama” ang malamang na lokatibong diwa ng ב, bagaman maaari rin itong unawaing “Naiot na nasa Rama.”
- source_word: וַתְּהִי עָלָיו ... רוּחַ אֱלֹהִים
  choice: sumakanya rin ang Espiritu ng Diyos
  rationale: Likas na ipinapahayag sa Filipino ng “sumakanya” ang idyomang היה על na tumutukoy sa pagdating o paglukob ng Espiritu sa isang tao. Ang malaking titik sa “Espiritu” ay umaayon sa kontekstong tumutukoy sa kapangyarihang mula sa Diyos.
- source_word: גַּם הוּא
  choice: rin ... sa kanya
  rationale: Ipinakikita ng “rin” na naranasan din ni Saul ang nangyari sa mga naunang sugo, nang hindi dinaragdagan ang diin ng teksto.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: nagpatuloy siya sa paglalakad
  rationale: Ang pandiwa na sinundan ng infinitive absolute ay nagpapakita ng nagpapatuloy na kilos; malinaw at natural itong naipahahayag sa Filipino sa ganitong paraan.
- source_word: וַיִּתְנַבֵּא
  choice: nagpopropesiya
  rationale: Pinananatili ng karaniwang terminong “nagpopropesiya” ang lawak ng Hebreong pandiwa at hindi tinutukoy kung pagsasalita, pagkilos, o ibang anyo ng gawaing propetiko ang naganap.
- source_word: עַד בֹּאוֹ
  choice: hanggang sa makarating siya
  rationale: Natural na temporal na sugnay ito sa Filipino at tumpak na inilalahad ang hangganan ng nagpapatuloy na kilos.
- source_word: שָׁם
  choice: roon
  rationale: Pinananatili ang panturo na nag-uugnay sa talata sa patutunguhang nabanggit sa naunang konteksto.
theological_decisions:
- issue: Kung ang רוּחַ אֱלֹהִים ay tutukuyin bilang personal na Espiritu ng Diyos o bilang isang espiritung mula sa Diyos
  choice: ang Espiritu ng Diyos
  alternative: ang espiritu ng Diyos; isang espiritung mula sa Diyos
  rationale: Sa salaysay tungkol kay Saul, malamang na tumutukoy ang parirala sa banal na kapangyarihang kumikilos mula sa Diyos. Ang malaking titik ay nagpapahiwatig ng malamang na reperente ngunit hindi nagdaragdag ng paliwanag na wala sa teksto; itinatala sa talababa ang mas literal na alternatibo.
- issue: Kung paano ilalarawan ang propetikong gawain ni Saul
  choice: nagpopropesiya
  alternative: kumikilos na parang propeta; nagsasalita bilang propeta
  rationale: Hindi sinasabi ng teksto ang tiyak na anyo ng gawain. Ang “nagpopropesiya” ay nagpapanatili sa sadyang lawak at tensiyong teolohikal ng salaysay sa halip na ipakahulugan ito bilang sikolohikal na silakbo o bilang pagsasalita lamang.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang “nagpopropesiya” bilang pamilyar na terminong biblikal ngunit iniwasan ang mas makitid na “nagsasalita bilang propeta” at ang interpretatibong “nasa propetikong silakbo.”
