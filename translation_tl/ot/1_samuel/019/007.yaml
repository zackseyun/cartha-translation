base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/007.yaml
  text: So Jonathan called David and told him all these things. Then Jonathan brought David to Saul[a], and he was in his presence as before.
translation:
  language: tl
  text: Kaya tinawag ni Jonatan si David at sinabi sa kanya ang lahat ng bagay na ito. Pagkatapos, dinala ni Jonatan si David kay Saul, at si David ay nasa harapan ni Saul gaya ng dati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “gaya ng kahapon at noong makalawa,” isang Hebreong idyoma na nangangahulugang “gaya ng dati” o “tulad noong una.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לְדָוִד
  choice: tinawag ... si David
  rationale: Ang קרא na may לְ at tumutukoy sa isang tao ay maaaring mangahulugang tumawag o magpatawag. Natural ang “tinawag” at hindi nito ipinapalagay kung pormal ang pagtawag.
- source_word: וַיַּגֶּד לוֹ
  choice: sinabi sa kanya
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam o sabihin. Ang “sinabi sa kanya” ay malinaw at natural sa salaysay.
- source_word: כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: ang lahat ng bagay na ito
  rationale: Maaaring tumukoy ang דָּבָר sa salita, bagay, o usapin. Saklaw ng “mga bagay” ang lahat ng ipinaalam ni Jonatan nang hindi nililimitahan iyon sa mismong mga salita lamang.
- source_word: וַיָּבֵא ... אֶל
  choice: dinala ... kay
  rationale: Ang Hiphil ng בוא ay karaniwang nangangahulugang magdala. Tumpak at natural sa Filipino ang “dinala ni Jonatan si David kay Saul.”
- source_word: וַיְהִי לְפָנָיו
  choice: muling naglingkod si David sa harapan ni Saul
  rationale: Ang literal na “nasa harapan niya” ay maaari ring magpahiwatig ng paglilingkod sa presensiya ng isang hari. Sa konteksto ng pagbabalik ni David sa korte ni Saul, ipinahahayag ng “naglingkod ... sa harapan” ang ugnayang iyon; idinagdag ang “muling” dahil sa kasunod na paghahambing na “gaya ng dati.”
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: gaya ng dati
  rationale: Isa itong Hebreong idyoma para sa dating kalagayan o nakagawian. Ang “gaya ng dati” ang natural na katumbas sa modernong Filipino.
theological_decisions:
- issue: Kung ang וַיְהִי לְפָנָיו ay simpleng presensiya lamang o paglilingkod sa hari
  choice: naglingkod si David sa harapan ni Saul
  alternative: naroon si David sa presensiya ni Saul
  rationale: Pinahihintulutan ng idyoma ang dalawang diwa. Pinili ang “naglingkod ... sa harapan” dahil ang konteksto ay ang pagpapanumbalik kay David sa dating tungkulin sa korte, ngunit pinanatili ang “sa harapan” upang hindi mawala ang literal na larawan.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “Jonatan” ayon sa karaniwang anyong Filipino ng pangalan, malinaw na tinukoy muli si David at Saul upang maiwasan ang malabong reperensiya ng mga panghalip, at pinanatili ang idyomatikong diwa ng pangwakas na parirala sa teksto habang inilagay ang literal na anyo sa talababa.
