base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/017.yaml
  text: Then Saul said to Michal[a], “Why have you deceived me like this and sent away my enemy, so that he escaped?” And Michal said to Saul, “He said to me, ‘Let me go. Why should I kill you?’”
translation:
  language: tl
  text: Sinabi ni Saul kay Mical, “Bakit mo ako dinaya nang ganito at pinaalis ang kaaway ko, kaya siya nakatakas?” Sumagot si Mical kay Saul, “Sinabi niya sa akin, ‘Paalisin mo ako. Bakit kita papatayin?’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas interpretatibong salin: “Paalisin mo ako, kung hindi ay papatayin kita.” Sa literal na Hebreo: “Paalisin mo ako. Bakit kita papatayin?”'
    reason: alternative_reading
lexical_decisions:
- source_word: רִמִּיתִנִי
  choice: dinaya mo ako
  rationale: Tuwirang ipinapahayag ng “dinaya” ang mapanlinlang na ginawa na ipinaparatang ni Saul, nang hindi dinaragdagan ang diwa tungo sa mas mabigat na “pinagtaksilan.”
- source_word: כָּכָה
  choice: nang ganito
  rationale: Likas na modernong Tagalog para sa pagtukoy sa paraan ng ginawa ni Mical.
- source_word: וַתְּשַׁלְּחִי ... וַיִּמָּלֵט
  choice: pinatakas
  rationale: Sa konteksto, ang pagpapaaalis kay David ay nagbunga ng pagtakas niya. Likas na pinagsasama ng “pinatakas” ang kilos at tahasang resulta, bagaman hindi nito inuulit nang hiwalay ang dalawang pandiwang Hebreo.
- source_word: אֹיְבִי
  choice: ang kaaway ko
  rationale: Pinananatili ang tahasang pagturing ni Saul kay David bilang kaniyang kaaway.
- source_word: שַׁלְּחִנִי
  choice: Paalisin mo ako
  rationale: Malapit sa literal na utos na “send me away” at pinananatili ang diwang sanhi ng Hiphil; mas pormal ito kaysa “Pabayaan mo akong umalis” ngunit malinaw sa modernong Tagalog.
- source_word: לָמָה אֲמִיתֵךְ
  choice: Bakit kita papatayin?
  rationale: Pinananatili ang literal na anyong tanong at ang likas nitong kalabuan sa Hebreo sa halip na tahasang idagdag ang “kung hindi.”
- source_word: מִיכַל
  choice: Mical
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalan sa tradisyong biblikal.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalan sa tradisyong biblikal.
theological_decisions:
- issue: Ang iniulat na pananalita ni David ayon kay Mical
  choice: “Paalisin mo ako. Bakit kita papatayin?”
  alternative: “Paalisin mo ako, kung hindi ay papatayin kita.”
  rationale: Dalawang sugnay ang nasa Hebreo—isang utos at isang tanong—at walang tahasang katumbas ng “kung hindi.” Pinananatili ng salin ang anyo at tensiyon ng teksto, habang ipinapaliwanag sa talababa ang posibleng ipinahihiwatig na banta.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang “pinatakas” para sa natural na daloy ng paratang ni Saul; pinanatili naman sa huling sipi ang kakaibang literal na tanong upang hindi gawing tahasan ang bantang ipinahihiwatig lamang ng konteksto. Inilagay ang marker [a] kaagad pagkatapos ng siping tinutukoy nito.
