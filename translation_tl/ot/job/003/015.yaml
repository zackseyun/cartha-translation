  source_fidelity: 'Tumpak ang pangunahing mga leksikal na pagpili: ang “o,” “kasama ng,” “mga pinuno,” “ginto,” “mga bahay,” at “pilak” ay umaayon sa Hebreo. Gayunman, ang ayos na “na nagpuno ng pilak sa kanilang mga bahay” ay hindi malinaw na naipapakita na ang mga bahay ang bagay na pinuno; maaari pa itong basahing naglagay sila ng pilak sa loob ng mga bahay.'
  naturalness: Mas natural at malinaw sa makabagong Filipino ang “na pinuno ng pilak ang kanilang mga bahay.” Pinananatili nito ang patulang rehistro at ang bukas na sintaksis ng nagpapatuloy na panaghoy.
