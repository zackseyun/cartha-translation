translation_notes:
  register: Makabagong Filipino na may marangal at patulang himig. Pinanatili ang putol na pagpapatuloy ng pangungusap sa pamamagitan ng pambungad na “o” at ng gitling sa hulihan, alinsunod sa mas malawak na panaghoy sa Job 3:13–16.
