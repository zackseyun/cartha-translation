translation:
  language: tl
  text: 'o kasama ng mga pinuno[a] na may ginto,

    na pinuno ng pilak ang kanilang mga bahay[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tagapamahala” o “mga maharlika.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring unawain sa kontekstong ito bilang “mga palasyo,” ngunit “mga bahay” ang tuwirang kahulugan ng Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: o
  rationale: Ipinagpapatuloy nito ang sunod-sunod na mga maaaring nangyari sana sa panaghoy ni Job; pinananatili ng payak na “o” ang daloy ng tula.
- source_word: עִם
  choice: kasama ng
  rationale: Nagsasaad ito ng pakikisama o pagiging kabilang sa piling ng mga pinunong namatay; natural at tuwiran ang “kasama ng” sa Filipino.
- source_word: שָׂרִים
  choice: mga pinuno
  rationale: Tumutukoy ang salita sa matataas na pinuno, opisyal, o maharlika. Malinaw at marangal ang “mga pinuno” nang hindi ipinapalagay na mga anak sila ng hari.
- source_word: זָהָב לָהֶם
  choice: na may ginto
  rationale: Idyomatikong ipinahahayag ng parirala ang pagmamay-ari; natural na katumbas sa Filipino ang “na may ginto.”
- source_word: הַמְמַלְאִים
  choice: na nagpuno
  rationale: Ang participle ay naglalarawan pa sa mga pinuno. Ang aspektong naganap na “nagpuno” ay angkop sa mga taong inilalarawang nakahimlay na sa kamatayan.
- source_word: בָּתֵּיהֶם
  choice: kanilang mga bahay
  rationale: Ang batayang kahulugan ng pangngalan ay “mga bahay.” Posible sa konteksto ang “mga palasyo,” ngunit higit itong tiyak kaysa sa Hebreo.
- source_word: כָּסֶף
  choice: pilak
  rationale: Sa larawang patula tungkol sa kayamanan, ang mahalagang metal na “pilak” ang tuwirang kahulugan; mawawala ang kongkretong larawan kung gagawing “salapi.”
