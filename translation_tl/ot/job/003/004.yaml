  yaml_path: translation/ot/job/003/004.yaml
  text: May that day be darkness[a]; may God above not seek it[b], and may no light shine upon it.
translation:
  language: tl
  text: Maging kadiliman sana ang araw na iyon; huwag sana itong hanapin[a] ng Diyos mula sa itaas, at huwag sanang sumikat dito ang liwanag[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo na isinaling “hanapin” ay maaari ring mangahulugang “pansinin,” “usisain,” o “lingapin.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “liwanag” bilang “ningning” o “kaningningan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַהוּא
  choice: ang araw na iyon
  rationale: Tumutukoy ito sa araw ng kapanganakan ni Job; tuwiran at natural itong katumbas ng pariralang Hebreo.
- source_word: יְהִי חֹשֶׁךְ
  choice: maging kadiliman sana
  rationale: Ipinapahayag ng anyong jussive ang isang matinding hiling o sumpang pahayag. Pinananatili ng “sana” ang puwersang optatibo, at ng pangngalang “kadiliman” ang anyong nominal ng חֹשֶׁךְ.
- source_word: יִדְרְשֵׁהוּ
  choice: hanapin ito
  rationale: Ang דרש ay pangunahing nangangahulugang “hanapin” o “usisain.” Pinananatili ng salin ang kongkretong larawan, habang kinikilala sa talababa na maaari rin itong magpahiwatig ng pagpansin o pagkalinga.
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Ito ang patulang anyong isahan para sa Diyos na madalas gamitin sa Job; walang batayan dito upang palawakin ito bilang “Diyos na Makapangyarihan.”
- source_word: מִמָּעַל
  choice: mula sa itaas
  rationale: Pinananatili nito ang tahasang panandang pinagmulan at ang patulang larawang ang Diyos ay nasa itaas.
- source_word: תּוֹפַע
  choice: sumikat
  rationale: Ang pandiwa ay nagsasaad ng pagningning o paglitaw nang maliwanag. Natural sa Filipino ang “sumikat” kapag liwanag ang simuno, at ang “sana” ay nagpapanatili sa hiling na negatibo.
- source_word: נְהָרָה
  choice: liwanag
  rationale: Ang pambihirang pangngalan ay tumutukoy sa liwanag, ningning, o kaningningan. “Liwanag” ang pinakanatural at hindi labis na matayog na katumbas.
- source_word: עָלָיו
  choice: dito
  rationale: Ang hulaping panghalip ay tumutukoy pabalik sa araw na iyon. Sa Filipino, natural na ipinahahayag ang pagningning sa araw sa pamamagitan ng lokatibong “dito,” ibig sabihi'y sa araw na iyon.
theological_decisions:
- issue: Tahasang pagtukoy sa Diyos sa loob ng sumpang hiling
  choice: Panatilihin ang “Diyos mula sa itaas.”
  alternative: “langit sa itaas” o “Diyos sa langit”
  rationale: Tahasang binabanggit ng Hebreo ang Diyos. Hindi dapat palambutin ang mapangahas at masidhing panaghoy ni Job sa pamamagitan ng impersonal na pagpapahayag.
- issue: Saklaw ng “hanapin” bilang kilos ng Diyos
  choice: Panatilihin sa pangunahing teksto ang literal na larawang “hanapin,” na may paliwanag sa talababa.
  alternative: “pansinin” o “lingapin”
  rationale: Pinananatili nito ang tunay na lawak ng kahulugan ng דרש nang hindi tahimik na nilulutas kung paghahanap, pagpansin, o pagkalinga ang pinakadiin.
translation_notes:
  register: Makabago ngunit marangal at patula ang himig. Ginamit ang “sana” upang malinaw na ipahayag ang sunod-sunod na matitinding hiling ni Job. Iniwasan ang arkaikong bokabularyo at pinanatili ang tahasang banggit sa Diyos at ang sadyang matapang na tensiyon ng panaghoy.
