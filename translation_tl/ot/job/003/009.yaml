lexical_decisions:
- source_word: יֶחְשְׁכוּ
  choice: Magdilim nawa
  rationale: Ipinahahayag ng anyong pandiwa ang isang sumpa o matinding hangarin. Pinananatili ng “magdilim nawa” ang puwersang ito sa natural at marangal na Tagalog.
- source_word: כּוֹכְבֵי נִשְׁפּוֹ
  choice: ang mga bituin ng takipsilim nito
  rationale: Ang כּוֹכְבֵי ay construct na nangangahulugang “mga bituin ng,” at pinananatili ng “nito” ang hulaping panghalip ng נִשְׁפּוֹ. Ang “takipsilim” ay angkop sa konteksto ng gabi, bagaman maaari ring isalin ang pangngalan bilang “dapithapon.”
- source_word: יְקַו לְאוֹר
  choice: maghintay nawa ito sa liwanag
  rationale: Maaaring mangahulugan ang קוה ng paghihintay o pag-asa. Ang “maghintay” ay naghahayag ng pananabik sa liwanag nang hindi dinaragdagan ang personipikasyon.
- source_word: וָאַיִן
  choice: ngunit huwag itong dumating
  rationale: Literal na ipinahahayag ng parirala na walang liwanag. Sa Tagalog, malinaw at natural na inihahatid ng “ngunit huwag itong dumating” ang bigong paghihintay at ang patuloy na puwersa ng sumpa.
- source_word: וְאַל יִרְאֶה
  choice: at huwag nitong makita
  rationale: Ang אַל kasama ng imperfect ay negatibong paghahangad o utos; pinananatili ito ng “huwag nitong makita.”
- source_word: בְּעַפְעַפֵּי שָׁחַר
  choice: ang mga talukap ng bukang-liwayway
  rationale: Pinananatili ang matingkad na literal na larawang “mga talukap” para sa unang pagbubukas o pagsilang ng liwanag sa madaling-araw. Ang “bukang-liwayway” ay natural na makatang katumbas ng שָׁחַר.
