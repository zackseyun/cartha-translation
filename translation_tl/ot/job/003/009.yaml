    issue: “ngunit huwag itong dumating” ang salin ng וָאַיִן
    rationale: Ang Hebreo ay isang existential na pahayag, “ngunit wala [liwanag],” hindi isang negatibong hiling na huwag dumating ang liwanag. Bagaman nauunawaan ang ibig sabihin sa draft, nagdaragdag ito ng kilos na wala sa pinagmulan at binabago ang porma ng paralelismo.
  - severity: low
    issue: “maghintay ... sa liwanag”
    rationale: Ang לְאוֹר ay mas tuwirang “ng liwanag” sa Tagalog sa konstruksiyong “maghintay ng.”
