  text: May the stars of its twilight be dark[a]; may it wait for light, but there be none[b], and may it not see the eyelids of dawn.
translation:
  language: tl
  text: Magdilim nawa ang mga bituin ng takipsilim nito[a]; maghintay nawa ito ng liwanag, ngunit wala, at huwag nitong makita ang mga talukap ng bukang-liwayway[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bituin ng dapithapon nito.” Ang salitang Hebreo ay tumutukoy sa takipsilim, lalo na sa dapithapon.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga talukap ng bukang-liwayway,” isang larawang patula sa Hebreo para sa unang paglitaw ng liwanag sa umaga.
