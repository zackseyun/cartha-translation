  rationale: Pinalitan ang idinagdag na ideyang “dumating” ng “ngunit wala,” na nagpapanatili sa maikli at patulang existential na parirala ng Hebreo. Inayos din ang kaugnayan ng “maghintay” at “liwanag” upang maging mas natural sa Tagalog. Walang pagbabagong doktrinal o interpretibong idinagdag.
