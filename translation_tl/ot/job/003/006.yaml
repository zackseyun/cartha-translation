  yaml_path: translation/ot/job/003/006.yaml
  text: As for that night[a], let darkness seize it; let it not rejoice among the days of the year; let it not enter into the number of the months.
translation:
  language: tl
  text: Ang gabing iyon[a]—nawa’y agawin ng kadiliman; huwag itong magalak sa piling ng mga araw ng taon; huwag itong mapasama sa bilang ng mga buwan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huwag itong maisama sa mga araw ng taon.” Bihira ang pandiwang Hebreo rito; nauunawaan ito ng ilan bilang pag-aalis sa gabing ito mula sa kalendaryo, sa halip na hindi ito makibahagi sa kagalakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלַּיְלָה הַהוּא
  choice: Ang gabing iyon
  rationale: Nasa unahan ang parirala upang bigyang-diin ang gabi. Likas sa Tagalog ang anyong ito, at tumutulong ang kasunod na gitling upang mapanatili ang mariing pagtatampok.
- source_word: יִקָּחֵהוּ
  choice: sakmalin nawa iyon
  rationale: Ang לקח ay literal na ‘kunin,’ ngunit sa personipikadong kadiliman, malinaw at masiglang ipinahahayag ng ‘sakmalin’ ang marahas na pag-angkin nang hindi nawawala ang larawan ng orihinal.
- source_word: אֹפֶל
  choice: kadiliman
  rationale: Saklaw ng אֹפֶל ang dilim o pusikit na dilim. Ang ‘kadiliman’ ay dignified, malinaw, at angkop sa personipikasyon sa talata.
- source_word: אַל יִחַדְּ
  choice: huwag nawa itong magalak
  rationale: Bihira at pinagtatalunan ang gamit ng pandiwang יחד dito. Ang ‘magalak’ ay kumakatawan sa posibleng diwang masayang pakikibahagi sa takbo ng taon; pinananatili sa talababa ang alternatibong kahulugang kalendaryong ‘maisama.’
- source_word: בִּימֵי שָׁנָה
  choice: kasama ng mga araw ng taon
  rationale: Ipinahihiwatig ng ב ang pakikabilang o pakikibahagi sa kalipunan ng mga araw ng taon. Natural sa Tagalog ang ‘kasama ng’ kasunod ng ‘magalak.’
- source_word: בְּמִסְפַּר יְרָחִים
  choice: sa bilang ng mga buwan
  rationale: Pinananatili ng parirala ang larawan ng pagbibilang sa mga buwan, sa halip na payak na sabihing ‘sa mga buwan.’
- source_word: אַל יָבֹא
  choice: huwag nawa itong mapasama
  rationale: Bagaman literal na ‘huwag pumasok,’ idiomatiko sa Tagalog ang ‘mapasama sa bilang’ para sa pagpasok o pagkabilang sa isang talaan.
theological_decisions:
- issue: Ang kahulugan ng bihirang anyong יִחַדְּ
  choice: magalak kasama ng mga araw ng taon
  alternative: maisama sa mga araw ng taon
  rationale: Hindi tiyak kung ang pandiwa ay tumutukoy sa kagalakan/pakikibahagi o sa pagsasama sa kalendaryo. Pinili sa teksto ang kontekstuwal na pagbasa na ‘magalak,’ ngunit hayagang pinanatili sa talababa ang lehitimong alternatibo upang hindi lutasin nang palihim ang tunay na kalabuan.
translation_notes:
  register: Makabagong Filipino na marangal at patula ngunit madaling maunawaan. Ginamit ang ‘nawa’ upang ipahayag ang sunod-sunod na pormulang sumpa o paghiling, at pinanatili ang personipikasyon ng kadiliman.
