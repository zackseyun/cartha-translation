lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na panandang temporal sa modernong Tagalog na malinaw na nagpapatuloy sa naunang salaysay.
- source_word: פָּתַח ... אֶת פִּיהוּ
  choice: ibinuka ... ang kanyang bibig
  rationale: Pinananatili ang idyomang Hebreo at ang maringal, mariing tono nito sa halip na gawing simpleng “nagsalita.”
- source_word: אִיּוֹב
  choice: Job
  rationale: Karaniwang anyo ng pangalang ito sa mga saling Tagalog ng Bibliya.
- source_word: וַיְקַלֵּל
  choice: isinumpa
  rationale: Tuwirang ipinapahayag ang kahulugan ng Piel ng קלל at hindi pinahihina ang matinding pananalitang nagbubukas sa panaghoy ni Job.
- source_word: אֶת יוֹמוֹ
  choice: ang kanyang araw
  rationale: Pinananatili ang maikli at literal na pahayag ng Hebreo; nililinaw ng kasunod na konteksto na tumutukoy ito sa araw ng kanyang kapanganakan.
theological_decisions:
- issue: Kung tahasang tutukuyin sa pangunahing teksto na ang “kanyang araw” ay araw ng kapanganakan ni Job
  choice: Panatilihin ang maikling pahayag na “ang kanyang araw” sa pangunahing teksto
  alternative: “ang araw ng kanyang kapanganakan” o “ang kanyang kaarawan”
  rationale: Hindi tahasang binabanggit ng talatang Hebreo ang kapanganakan, bagaman nililinaw ito ng kasunod na konteksto. Pinananatili ng salin ang sariling pag-unlad at pagiging maigsi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang idyomang “ibinuka ... ang bibig” at ang maikling “kanyang araw” upang maingatan ang retorika at tunay na pahiwatig ng Hebreo.
