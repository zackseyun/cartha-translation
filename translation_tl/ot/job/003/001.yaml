  text: Pagkatapos nito, binuka ni Job ang kanyang bibig at isinumpa ang kanyang araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang araw ng kanyang kapanganakan.” Literal na “kanyang araw.”
