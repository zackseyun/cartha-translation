translation:
  language: tl
  text: Sapagkat dumating sa akin ang takot na kinatatakutan ko,[a] at sumapit sa akin ang kinatatakutan ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, magkaugnay ang pangngalan at pandiwa—sa literal, “ang takot na kinatakutan ko”—upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: 'Bahagyang magkaiba ang mga pandiwang Hebreo sa dalawang magkatulad na sugnay: ang una ay malamang na “dumating sa akin” o “dumating sa ibabaw ko,” samantalang ang ikalawa ay mas literal na “dumating sa akin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita rito ang paliwanag o dahilan para sa naunang hinaing ni Job; natural na ipinahahayag ito ng “Sapagkat” sa Filipino.
- source_word: פַחַד / פָּחַדְתִּי
  choice: ang pangambang labis kong kinatatakutan
  rationale: Ang magkaugnay na pangngalan at pandiwa sa Hebreo ay nagbibigay-diin. Ginamit ang “labis” upang maiparating ang diin nang natural, sa halip na ulitin nang alanganin ang parehong salitang-ugat sa Filipino.
- source_word: וַיֶּאֱתָיֵנִי
  choice: dumating sa akin
  rationale: Tumutukoy ang pandiwa sa isang kinatatakutang pangyayaring dumating o sumapit kay Job. Pinanatili ang payak na larawan ng pagdating.
- source_word: וַאֲשֶׁר
  choice: at ... ang aking
  rationale: Isinaayos ang pariralang relatif bilang isang natural na sugnay sa Filipino habang pinananatili ang ikalawang hanay ng paralelismo.
- source_word: יָגֹרְתִּי
  choice: aking pinangangambahan
  rationale: Ang pandiwa ay nangangahulugang matakot o mangamba. Ang “pinangangambahan” ay dignified at malinaw sa modernong Filipino.
- source_word: יָבֹא לִי
  choice: sumapit sa akin
  rationale: Ang anyong Hebreo ay literal na “darating sa akin,” ngunit inilalarawan ng konteksto ang naranasan nang kapahamakan. Ang “sumapit” ay nagpapanatili sa ideya ng pagdating at nagbibigay ng bahagyang pagkakaiba sa unang sugnay.
