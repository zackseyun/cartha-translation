  yaml_path: translation/ot/job/003/003.yaml
  text: May the day perish on which I was born[a], and the night that said, ‘A man is conceived.’
translation:
  language: tl
  text: Maglaho nawa ang araw na isinilang ako, at ang gabing nagsabi, “May isang lalaking ipinaglihi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang batang lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאבַד
  choice: Maglaho nawa
  rationale: Ipinahahayag ng anyong jussive ang isang sumpang hangarin, hindi payak na pangyayari sa hinaharap. Likas sa Filipino ang “nawa” para sa ganitong matinding paghahangad, at ang “maglaho” ay angkop na naiuugnay sa isang araw.
- source_word: יוֹם
  choice: ang araw
  rationale: Tumutukoy ito sa tiyak na araw ng kapanganakan ni Job; sapat na ang pantukoy na “ang” upang ipakita ang katiyakan nito sa konteksto.
- source_word: אִוָּלֶד בּוֹ
  choice: na isinilang ako
  rationale: Pinananatili nito ang diwang pasibo ng Niphal ng ילד at natural na iniuugnay sa “araw” sa Filipino nang hindi na kailangang literal na isalin ang בּוֹ bilang “sa loob nito.”
- source_word: וְהַלַּיְלָה
  choice: at ang gabi
  rationale: Kaagapay ito ng “ang araw” bilang ikalawang bagay na saklaw ng sumpang hangarin ni Job.
- source_word: אָמַר
  choice: nagsabi
  rationale: Pinananatili nito ang personipikasyon ng gabi bilang nagbabalita.
- source_word: הֹרָה
  choice: ipinaglihi
  rationale: Ipinahahayag nito na naganap ang paglilihi nang hindi ginagawang ang gabi mismo ang naglihi. Ang perpektong Hebreo ay natural na naihahatid dito bilang natapos na pangyayari.
- source_word: גָבֶר
  choice: isang lalaki
  rationale: Pinananatili nito ang tahasang pagtukoy sa isang taong lalaki. Sa konteksto ng paglilihi maaari rin itong unawain bilang “batang lalaki,” kaya inilagay ang alternatibo sa talababa.
