  text: Bakit hindi ako namatay sa sinapupunan[a], nang lumabas ako mula sa tiyan at nalagutan ng hininga[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, dalawang magkaugnay ngunit magkaibang salita para sa bahagi ng katawan ng ina ang ginamit nang magkatulad: “sinapupunan” at “tiyan.”'
