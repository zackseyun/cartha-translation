lexical_decisions:
- source_word: לָמָּה
  choice: Bakit
  rationale: Likas at tuwirang panandang pananong sa dahilan, na angkop sa panaghoy ni Job.
- source_word: לֹא
  choice: hindi
  rationale: Pinananatili ang payak na pagtanggi sa retorikal na tanong.
- source_word: מֵרֶחֶם
  choice: paglabas sa sinapupunan
  rationale: Ang רֶחֶם ay tumutukoy sa sinapupunan; idinagdag ang 'paglabas' upang maging malinaw at likas sa Filipino ang kahulugang pagkamatay sa pagsilang, nang hindi pinapawi ang konkretong larawang maternal.
- source_word: אָמוּת
  choice: ako namatay
  rationale: Ang Qal imperfect na unang panauhan ay inuunawa rito bilang tanong na nagpapahayag ng panghihinayang sa isang hindi nangyaring kamatayan.
- source_word: מִבֶּטֶן
  choice: mula sa tiyan
  rationale: Maaaring tumukoy ang בֶּטֶן sa tiyan o sinapupunan. Pinili ang 'tiyan' upang mapanatili ang pagkakaiba nito sa רֶחֶם sa magkatulad na mga linya.
- source_word: יָצָאתִי
  choice: lumabas ako
  rationale: Pinananatili ang kongkretong larawan ng paglabas sa halip na gawing mas abstraktong 'ipinanganak.'
- source_word: וְאֶגְוָע
  choice: o nalagutan ng hininga
  rationale: Ang גוע ay maaaring magpahiwatig ng pagpanaw o pagkalagot ng hininga. Ang 'nalagutan ng hininga' ay likas sa Filipino at pinananatiling bahagyang naiiba sa naunang מות, 'namatay.'
