  text: There the prisoners are at ease together[a]; they do not hear the voice of the taskmaster.
translation:
  language: tl
  text: Doon ay magkakasamang panatag ang mga bilanggo; hindi nila naririnig ang tinig ng tagapagpahirap.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapang-api” o “tagapaningil” sa halip na “tagapagpahirap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: magkakasama
  rationale: Likas na Filipino para sa pang-abay na nagsasaad na iisa ang kalagayang tinatamasa ng mga bilanggo.
- source_word: אֲסִירִים
  choice: mga bilanggo
  rationale: Malinaw at karaniwang tawag sa mga taong nakagapos o nakakulong, nang hindi nililimitahan ang kahulugan sa mga bihag sa digmaan.
- source_word: שַׁאֲנָנוּ
  choice: panatag
  rationale: Ipinahihiwatig ang katahimikan at kawalan ng panggugulo o paninikil, nang hindi labis na ipinapakahulugang ganap na kapahingahan.
- source_word: לֹא שָׁמְעוּ
  choice: hindi nila naririnig
  rationale: Bagaman qatal ang anyo, inilalarawan ng patulang konteksto ang nagpapatuloy na kalagayan ng mga patay; kaya ang pangkasalukuyang Filipino ang angkop.
- source_word: קוֹל
  choice: tinig
  rationale: Pinananatili ang kongkretong larawang pandinig—ang utos o pagsigaw ng taong nagpapahirap sa paggawa.
- source_word: נֹגֵשׂ
  choice: tagapagpagal
  rationale: Tumutukoy sa taong sapilitang nagpapagawa o naniningil. Ang 'tagapagpagal' ay maikli at dignidadong katumbas na akma sa konteksto, habang inilalahad sa talababa ang mas malawak na mga posibilidad.
