translation:
  language: tl
  text: Ang hamak at ang dakila ay naroon, at ang alipin ay malaya sa kanyang panginoon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָטֹן
  choice: ang hamak
  rationale: Kasama ng kasalungat na גָדוֹל, tumutukoy ito sa mababang katayuan o kabuluhan, hindi lamang sa pisikal na liit. Likas sa modernong Filipino ang “hamak” para sa panlipunang paghahambing na ito.
- source_word: גָדוֹל
  choice: ang dakila
  rationale: Sa pagtutumbas nito sa קָטֹן, inilalarawan nito ang taong mataas ang katayuan o tanyag. Pinananatili ng “dakila” ang maikli at matinding pagsalungat ng Hebreo.
- source_word: שָׁם
  choice: naroon
  rationale: Itinuturo nito ang lugar na binabanggit sa naunang konteksto, ang kalagayan o dako ng mga patay. Ang “naroon” ay natural at hindi nagdaragdag ng paliwanag sa talata.
- source_word: הוּא
  choice: ay naroon
  rationale: Bagaman anyong isahan ang panghalip sa Hebreo, inuugnay nito ang pinagtambal na “hamak at dakila” sa iisang pahayag. Hindi idinagdag ang “magkapantay” o “kapwa” upang hindi gawing tahasan ang ipinahihiwatig lamang ng konteksto.
- source_word: עֶבֶד
  choice: alipin
  rationale: Ang pagsalungat sa חָפְשִׁי at pagbanggit sa panginoon ay nagpapatingkad sa kalagayang nakagapos sa paglilingkod; kaya mas tiyak ang “alipin” kaysa “lingkod.”
- source_word: חָפְשִׁי
  choice: malaya na
  rationale: Tuwirang ipinapahayag ng pang-uri ang kalayaan mula sa dating kapangyarihan ng panginoon. Ang “na” ay natural sa Filipino sa ganitong pagbabago ng kalagayan, nang hindi kinakailangang isalin bilang tahasang kilos na “pinalaya.”
- source_word: מֵאֲדֹנָיו
  choice: sa kanyang panginoon
  rationale: Ang מִן ay naghahayag ng pagkalaya o pagkahiwalay mula sa kapangyarihan ng אֲדוֹן. Sa Filipino, natural ang pariralang “malaya sa kanyang panginoon”; ang “panginoon” dito ay taong may kapangyarihan sa alipin, hindi isang banal na titulo.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikling paralelismo ng Hebreo at ang panlipunang pagsalungat ng hamak/dakila at alipin/malaya, nang hindi idinaragdag ang ideyang “magkapantay” na hindi tahasang nasa teksto.
