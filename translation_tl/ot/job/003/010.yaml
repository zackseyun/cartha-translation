translation:
  language: tl
  text: sapagkat hindi nito isinara ang mga pintuan ng aking sinapupunan[a], ni ikinubli ang paghihirap[b] sa aking paningin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “aking tiyan” o “aking sinapupunan.” Sa konteksto ng kapanganakan ni Job, ang larawan ay tumutukoy sa sinapupunang pinagmulan niya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dalamhati,” “pagdurusa,” o “mabigat na pagpapagal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng sumpa ni Job sa naunang konteksto at pinananatili ang puwersang sanhi.
- source_word: סָגַר
  choice: isinara
  rationale: Tuwirang katumbas ng pagsasara at likas na kapares ng “mga pinto.”
- source_word: דַּלְתֵי
  choice: mga pinto
  rationale: Pinananatili ang konkretong larawang ginamit para sa bukana ng sinapupunan.
- source_word: בִטְנִי
  choice: sinapupunan ng aking ina
  rationale: Bagaman literal na nasa unang panauhan ang anyo (“aking tiyan/sinapupunan”), tumutukoy si Job sa sinapupunang pinagmulan niya. Nililinaw ito sa natural na Filipino nang hindi binabago ang reperente.
- source_word: וַיַּסְתֵּר
  choice: ni ikinubli
  rationale: Ang naunang pagtanggi ay natural na umaabot sa ikalawang sugnay; pinananatili ng “ikinubli” ang diwa ng pagtatago mula sa paningin.
- source_word: עָמָל
  choice: paghihirap
  rationale: Malawak nitong naihahayag ang hirap, dalamhati, at pagdurusang saklaw ng salitang Hebreo sa panaghoy ni Job.
- source_word: מֵעֵינָי
  choice: sa aking mga mata
  rationale: Pinananatili ang imahen ng Hebreo at ipinahihiwatig na hindi nailayo kay Job ang pagkakita at pagdanas sa paghihirap.
