base_translation:
  language: en
  yaml_path: translation/ot/job/003/007.yaml
  text: Look, may that night be barren; let no joyful cry enter it.
translation:
  language: tl
  text: Masdan, maging baog sana ang gabing iyon; huwag sana itong pasukin ng sigaw ng kagalakan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Masdan
  rationale: Pinananatili ang mariing pantawag-pansin ng Hebreo sa isang marangal ngunit nauunawaang anyo sa modernong Tagalog.
- source_word: גַלְמוּד
  choice: baog
  rationale: Ang bihirang salitang Hebreo ay maaaring mangahulugang tigang, walang supling, o nag-iisa. Sa konteksto ng pagsumpa ni Job sa gabi ng kaniyang paglilihi, ang “baog” ang pinakanatural na salin habang pinananatili ang matalinghagang paglalarawan sa gabi.
- source_word: רְנָנָה
  choice: sigaw ng kagalakan
  rationale: Saklaw ng salita ang masayang sigaw o masiglang pag-awit; hindi nililimitahan ng salin sa awit lamang ang posibleng kahulugan.
- source_word: תָּבוֹא ... בוֹ
  choice: pasukin
  rationale: Pinananatili ang larawan ng masayang sigaw na ‘pumapasok’ sa gabing iyon, sa natural na balangkas na balintiyak sa Tagalog.
theological_decisions:
- issue: Ang saklaw ng sumpa ni Job sa gabi
  choice: Ipinahayag bilang paghiling na maging baog ang gabi at mawalan ito ng sigaw ng kagalakan.
  alternative: Ipaliwanag nang tahasan na walang batang isilang o walang pagdiriwang ng kapanganakan.
  rationale: Hindi tahasang binabanggit ng talata ang pagsilang o sanggol. Pinananatili ng salin ang matalinghagang pahayag at ang tensiyon ng orihinal nang hindi nagdaragdag ng interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at patula. Ginamit ang “Masdan” bilang maikli at mariing pambungad; ang dalawang “sana” ay malinaw na naghahayag ng mga paghiling o sumpa sa talata.
