  text: כִּֽי לִ/פְנֵ֣י לַ֭חְמִ/י אַנְחָתִ֣/י תָבֹ֑א וַֽ/יִּתְּכ֥וּ כַ֝/מַּ֗יִם שַׁאֲגֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/024.yaml
  text: For my sighing comes before my bread[b][a], and my groanings pour out like water.
translation:
  language: tl
  text: Sapagkat nauuna sa aking tinapay[a] ang aking pagbubuntong-hininga, at bumubuhos na parang tubig ang aking mga daing[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking pagkain”; ang salitang Hebreo para sa “tinapay” ay maaari ring tumukoy nang mas malawak sa anumang kinakain.
    reason: lexical_alternative
  - marker: b
    text: O “mga pag-ungal”; maaaring tumukoy ang salitang Hebreo sa isang malakas at halos mala-hayop na sigaw, na nagbibigay-diin sa tindi ng paghihirap ni Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag sa kalagayan ni Job sa loob ng kanyang panaghoy.
- source_word: לִפְנֵי
  choice: nauuna sa
  rationale: 'Pinananatili nito ang karaniwang temporal na diwa ng parirala: dumarating ang pagbubuntong-hininga bago ang pagkain.'
- source_word: לַחְמִי
  choice: aking tinapay
  rationale: Ang לֶחֶם ay literal na “tinapay,” bagaman maaari rin itong tumukoy nang mas malawak sa pagkain; pinananatili sa teksto ang kongkretong larawan.
- source_word: אַנְחָתִי
  choice: ang aking pagbubuntong-hininga
  rationale: Ipinahahayag ng אַנְחָה ang buntong-hininga o daing na dulot ng matinding hirap; malinaw at natural ang “pagbubuntong-hininga” sa modernong Filipino.
- source_word: תָבֹא
  choice: nauuna
  rationale: Ang literal na “dumarating” ay ipinahayag kasama ng לִפְנֵי bilang natural na Filipino na “nauuna sa,” habang pinananatili ang ugnayang temporal.
- source_word: וַיִּתְּכוּ
  choice: bumubuhos
  rationale: Ipinakikita ng pandiwa ang pag-agos o pagbuhos; ang aspektong pangkasalukuyan ay angkop sa nagpapatuloy na kalagayang inilalarawan sa panaghoy.
- source_word: כַמַּיִם
  choice: na parang tubig
  rationale: Tuwirang pinananatili ang paghahambing sa tubig.
- source_word: שַׁאֲגֹתָי
  choice: ang aking mga daing
  rationale: Natural na ipinahahayag ng “mga daing” ang malalakas na sigaw ng pagdurusa, samantalang inilalagay sa talababa ang mas literal at mala-hayop na larawan ng pag-ungal.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong larawan ng “tinapay” at “tubig,” habang ginawang natural ang ayos ng unang sugnay. Ang “pagbubuntong-hininga” at “mga daing” ay pinag-iba upang maipakita ang pag-igting mula sa tahimik na dalamhati tungo sa mas malakas na pagdaing.
