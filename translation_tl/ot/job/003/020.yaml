  text: Why is light given to the troubled[b][a], and life to the bitter in soul?
translation:
  language: tl
  text: Bakit binibigyan[b] ng liwanag[a] ang naghihirap, at ng buhay ang mga may mapait na kalooban?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “liwanag” ay makatang larawan ng patuloy na pag-iral o pamumuhay; pinananatili rito ang larawan ng Hebreo sa halip na tuwirang sabihing “buhay.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Bakit siya nagbibigay ng liwanag sa naghihirap, at ng buhay sa mga may mapait na kalooban?” Hindi tinukoy sa Hebreo kung sino ang nagbibigay, bagaman malamang na Diyos ang ipinahihiwatig ng konteksto.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה
  choice: Bakit
  rationale: Tuwirang tanong ito sa panaghoy ni Job; pinananatili ng “Bakit” ang lakas at ikli ng Hebreo.
- source_word: יִתֵּן
  choice: binibigyan
  rationale: Bagaman aktibong 3ms (“nagbibigay siya”) ang anyong Hebreo, walang tahasang simuno. Ang pokus-sa-layon na anyong Filipino ay likas at hindi tahasang pinapangalanan ang nagbibigay.
- source_word: לְעָמֵל
  choice: ang naghihirap
  rationale: Sa konteksto, ang עָמֵל ay taong nasa matinding hirap o dalamhati, hindi lamang isang napapagod sa trabaho.
- source_word: אוֹר
  choice: liwanag
  rationale: Pinananatili ang makatang larawan ng Hebreo; sa konteksto, tumutukoy ito sa patuloy na pag-iral o pagdanas ng buhay.
- source_word: וְחַיִּים
  choice: at ng buhay
  rationale: Bagaman maramihan ang anyo sa Hebreo, karaniwan itong tumutukoy sa “buhay” bilang isang kabuuan.
- source_word: לְמָרֵי נָפֶשׁ
  choice: ang mga mapait ang kalooban
  rationale: Ipinahahayag nito ang mga taong ang panloob na pagkatao ay punô ng pait. Ang “kalooban” ay natural sa modernong Filipino at hindi nag-uudyok ng teknikal na paghihiwalay ng kaluluwa at espiritu.
theological_decisions:
- issue: Di-tahasang simuno ng יִתֵּן
  choice: 'Hindi pinangalanan ang nagbibigay: “binibigyan.”'
  alternative: “Bakit siya nagbibigay…” o “Bakit nagbibigay ang Diyos…”
  rationale: Malamang na Diyos ang ipinahihiwatig ng konteksto, ngunit hindi siya tahasang pinangalanan sa talata. Pinananatili nito ang retorikal at teolohikal na tensiyon ng reklamo ni Job.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang makatang “liwanag,” ang di-tahasang nagbibigay, at ang idiomatikong lalim ng “mapait ang kalooban.”
