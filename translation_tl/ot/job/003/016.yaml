translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang matinding larawan at kontrapaktuwal na pagnanais ni Job, pati ang talinghagang “makakita ng liwanag,” nang hindi nilulutas ang lawak ng kahulugan ng נֵפֶל.
