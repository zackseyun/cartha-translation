  text: א֤וֹ כְ/נֵ֣פֶל טָ֭מוּן לֹ֣א אֶהְיֶ֑ה כְּ֝/עֹלְלִ֗ים לֹא רָ֥אוּ אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/016.yaml
  text: Or like a hidden miscarriage[a], I would not be[b], like infants who never saw light.
translation:
  language: tl
  text: O gaya ng isang nakatagong sanggol na nakunan[a], hindi sana ako umiral—gaya ng mga sanggol na hindi kailanman nakakita ng liwanag.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sanggol na ipinanganak na patay.” Ang pangngalang Hebreo ay maaaring tumukoy sa sanggol na nakunan o ipinanganak na patay.
    reason: lexical_alternative
  - marker: b
    text: Ang “makakita ng liwanag” ay isang Hebreong pagpapahayag para sa pagpasok at pagdanas ng buhay sa daigdig.
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: O
  rationale: Nagpapakilala ito ng isa pang maaaring kalagayan sa sunod-sunod na pagnanais ni Job; payak at natural ang “O” sa Filipino.
- source_word: כְ/נֵ֣פֶל
  choice: gaya ng isang sanggol na nalaglag
  rationale: Ang pangngalang נֵפֶל ay maaaring tumukoy sa sanggol na nakunan o ipinanganak na patay. Ang pariralang ito ay malinaw at dignidad ang himig, at hindi nito ginagawang kilos o pangyayari lamang ang tinutukoy na nilalang.
- source_word: טָ֭מוּן
  choice: nakatagong
  rationale: Pinananatili nito ang pangunahing diwa ng טמן na ‘itago’ o ‘ikubli’ nang hindi tiyak na ipinapakahulugang inilibing.
- source_word: לֹ֣א אֶהְיֶ֑ה
  choice: hindi sana ako umiral
  rationale: Malinaw nitong ipinahahayag ang di-pag-iral na ninanais ni Job, habang ang “sana” ay likas na naghahatid ng kontrapaktuwal na diwa sa Filipino.
- source_word: כְ֝/עֹלְלִ֗ים
  choice: gaya ng mga sanggol
  rationale: Ang עֹלְלִים ay tumutukoy sa napakabatang mga bata; “mga sanggol” ang pinakanatural at angkop sa konteksto.
- source_word: לֹא רָ֥אוּ אֽוֹר
  choice: na hindi kailanman nakakita ng liwanag
  rationale: Pinananatili ang larawang Hebreo ng ‘pagkakita ng liwanag,’ na tumutukoy sa pagpasok o pagdanas ng buhay sa daigdig.
