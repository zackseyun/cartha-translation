  text: 'Sumpain sana ito ng mga sumusumpa sa araw,

    ng mga handang pukawin si Leviatan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִקְּבֻהוּ
  choice: Sumpain sana ito
  rationale: Ang jussive na pandiwa na may panlalaking isahang hulapi ay tumutukoy sa araw na isinumpa ni Job sa konteksto; ipinapahayag ng “sana” ang diwang optative.
- source_word: אֹרְרֵי יוֹם
  choice: mga sumusumpa sa mga araw
  rationale: Pinananatili ang anyong walang tiyak na pantukoy at ang kolektibo/pangkalahatang diwa ng יוֹם, alinsunod sa source evidence at sa audited consultation layer.
- source_word: הָעֲתִידִים
  choice: mga handang
  rationale: Sa kontekstong ito, ang participle ay nagsasaad ng mga taong nakahanda o may kakayahang gawin ang kasunod na kilos.
- source_word: עֹרֵר
  choice: pumukaw
  rationale: Isinasalin ang infinitive na may diwang gisingin, pukawin, o ibunsod na kumilos; natural ang “pumukaw” nang hindi dinaragdagan ang larawan.
- source_word: לִוְיָתָן
  choice: kay Leviatan
  rationale: Pinananatili bilang pangalang Leviatan ang makatang nilalang sa Hebreo sa halip na ipaliwanag o tukuyin nang higit sa sinasabi ng teksto.
theological_decisions:
- issue: Pagkakakilanlan at katangian ni Leviatan
  choice: Pinanatili ang pangalang “Leviatan” nang walang paliwanag sa pangunahing teksto.
  alternative: Isalin bilang isang tiyak na hayop, halimaw, o puwersang kosmiko.
  rationale: Hindi nililinaw ng talata ang eksaktong ontolohiya ng Leviatan; ang transliterasyon ay nagpapanatili sa makatang pahiwatig at tunay na ambiguwidad nang hindi nag-aangkat ng partikular na doktrina.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang dalawang magkahanay na parirala at ang sumpang patula. Ginamit ang “ito” upang malinaw na tumukoy sa araw na binabanggit sa naunang konteksto, at “mga araw” upang mapanatili ang pangkalahatang anyo ng pariralang Hebreo.
