translation:
  language: tl
  text: sa isang lalaking lingid ang kanyang landas[a] at binakuran siya ng Diyos[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakatago ang kanyang landas.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ikinulong ng Diyos” o “hinarangan ng Diyos sa lahat ng panig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְגֶבֶר
  choice: sa isang lalaki
  rationale: Ang לְ ay nag-uugnay sa lalaki bilang tumatanggap ng “liwanag” sa nagpapatuloy na retorikal na tanong mula sa talata 20. Pinananatili ng “lalaki” ang tiyak na panlalaking anyo ng גֶּבֶר.
- source_word: דַּרְכּוֹ
  choice: ang landas
  rationale: Pinananatili ng “landas” ang larawang maaaring tumukoy sa literal na daan o, higit na angkop sa konteksto, sa takbo at patutunguhan ng buhay.
- source_word: נִסְתָּרָה
  choice: ay natatago
  rationale: Ipinahahayag nito ang pasibo o statibong diwa nang hindi tiyak na sinasabi kung kanino natatago ang landas, kaya nananatili ang tunay na kalabuan ng Hebreo.
- source_word: וַיָּסֶךְ
  choice: binakuran
  rationale: Pinananatili ng salita ang larawan ng pagharang o pagpapaligid na nagsasara sa isang tao, sa halip na gawing pangkalahatang “hinadlangan” lamang.
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Ito ang tuwirang salin ng makatang katawagan para sa Diyos; walang batayan dito para idagdag ang “Makapangyarihan.”
- source_word: בַּעֲדוֹ
  choice: sa lahat ng panig
  rationale: Sa pagsama sa “binakuran,” malinaw nitong ipinahahayag ang pagpapaligid at pagsasara sa lalaki nang hindi binabago ang Diyos bilang tahasang gumagawa.
theological_decisions:
- issue: Ang Diyos bilang gumagawa ng pagpapaligid
  choice: “binakuran ng Diyos”
  alternative: Gawing di-tiyak o impersonal ang gumagawa ng pagkakakulong
  rationale: Tahasan sa Hebreo ang אֱלוֹהַּ bilang simuno. Hindi dapat palambutin ng salin ang reklamo ni Job sa pamamagitan ng pagtatago sa pagkilos na iniuukol niya sa Diyos.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ang talata ay sadyang nananatiling bahagi ng retorikal na tanong na nagsimula sa talata 20. Ginamit ang “natatago” upang mapanatili ang kalabuan tungkol sa kung kanino lingid ang landas, at “binakuran” upang mapanatili ang konkretong larawan ng Hebreo.
