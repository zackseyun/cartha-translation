  source_fidelity: 'Tapat ang salin sa magkakasunod na panawagan sa Hebreo: ang dilim at צַלְמָוֶת ay muling umaangkin sa araw, ang ulap ay nananatili sa ibabaw nito, at ang mahirap na כִּמְרִירֵי יוֹם ay nananakot dito. Ang “bawiin” ay angkop para sa גאל sa konteksto ng sumpa at hindi nagpapasok ng positibong konotasyong kaugnay ng “tubusin.”'
