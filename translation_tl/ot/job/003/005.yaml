  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יִגְאָלֻ֡/הוּ חֹ֣שֶׁךְ וְ֭/צַלְמָוֶת תִּשְׁכָּן עָלָ֣י/ו עֲנָנָ֑ה יְ֝בַעֲתֻ֗/הוּ כִּֽמְרִ֥ירֵי יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/005.yaml
  text: May darkness and deep shadow reclaim it[a]; may a cloud dwell over it[b]; may the blacknesses of the day terrify it.
translation:
  language: tl
  text: Bawiin nawa ito ng dilim at ng pusikit na karimlan[a]; manatili nawa sa ibabaw nito ang ulap; sindakin nawa ito ng mga pagdidilim ng araw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anino ng kamatayan” o “malalim na dilim” para sa צַלְמָוֶת.
    reason: lexical_alternative
  - marker: b
    text: Mahirap unawain ang pariralang “mga pagdidilim ng araw.” Maaari rin itong mangahulugang “karimlan ng araw,” “mga eklipse ng araw,” o, bagaman hindi gaanong malamang, “mga kapaitan ng araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְאָלֻהוּ
  choice: Bawiin nawa ito
  rationale: Ang גאל ay tumutukoy sa pagbawi o muling pag-angkin. Sa konteksto ng sumpa ni Job, ipinahihiwatig na muling angkinin ng dilim ang araw; iniiwasan ng “bawiin” ang positibong teolohikal na dating ng “tubusin.”
- source_word: חֹשֶׁךְ
  choice: dilim
  rationale: Karaniwang katumbas na angkop sa larawang binubura o pinapawalang-bisa ang araw ng kapanganakan.
- source_word: צַלְמָוֶת
  choice: pusikit na karimlan
  rationale: Ipinapahayag ang matindi at mapang-aping dilim nang hindi tiyakang ipinapasok sa pangunahing teksto ang maaaring etimolohikal na larawan ng “anino ng kamatayan.”
- source_word: תִּשְׁכָּן עָלָיו
  choice: manatili nawa sa ibabaw nito
  rationale: Pinananatili ang diwa ng שׁכן na manahan o manatili, at ang עַל bilang “sa ibabaw nito.”
- source_word: עֲנָנָה
  choice: ang ulap
  rationale: Konkretong larawang meteorolohikal; natural sa Filipino ang pantukoy na “ang” sa ganitong patulang panawagan.
- source_word: יְבַעֲתֻהוּ
  choice: sindakin nawa ito
  rationale: Ang Piel ng בעת ay nagpapahiwatig ng pagdudulot ng matinding takot; ang “sindakin” ay maigsi, matindi, at marangal ang rehistro.
- source_word: כִּמְרִירֵי יוֹם
  choice: mga pagdidilim ng araw
  rationale: Mahirap ang parirala, ngunit ang pagbasa bilang mga pagdidilim o maiitim na pangyayari sa araw ang pinakanababagay sa magkakaugnay na larawan ng dilim, karimlan, at ulap. Pinananatili ng “mga” ang anyong maramihan.
theological_decisions:
- issue: Kahulugan ng צַלְמָוֶת
  choice: pusikit na karimlan
  alternative: anino ng kamatayan
  rationale: Hindi nilulutas nang dogmatiko kung ang salita ay tahasang tumutukoy sa kamatayan o sa napakalalim na dilim; nasa talababa ang tunay na alternatibo.
- issue: Kahulugan ng כִּמְרִירֵי יוֹם
  choice: mga pagdidilim ng araw
  alternative: karimlan ng araw; mga eklipse ng araw; mga kapaitan ng araw
  rationale: Pinipili ang kahulugang pinakanaaayon sa konteksto habang malinaw na pinananatili sa talababa ang kawalang-katiyakan ng Hebreo.
translation_notes:
  register: Modernong Filipino na patula at marangal ngunit madaling maunawaan. Ginamit ang paulit-ulit na “nawa” upang katawanin ang magkakasunod na Hebreong panawagan. Inilagay ang marker [a] pagkatapos ng terminong tinatalakay at ang [b] pagkatapos ng mahirap na parirala, hindi pagkatapos ng “ulap.”
