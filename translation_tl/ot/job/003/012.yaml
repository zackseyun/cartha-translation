  text: Why did knees receive me[a], and why breasts[b], that I should nurse?
translation:
  language: tl
  text: Bakit ako tinanggap ng mga tuhod[a], at bakit may mga dibdib upang ako'y dumede?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga tuhod” ay malamang na tumutukoy sa pagtanggap sa bagong silang sa mga tuhod o kandungan pagkapanganak.
    reason: cultural_note
  - marker: b
    text: O “upang ako'y sumuso.” Ang pandiwang Hebreo ay tumutukoy sa sanggol na kumukuha ng gatas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Tuwirang panandang pananong ito sa panaghoy ni Job; natural at malinaw ang “Bakit” sa modernong Tagalog.
- source_word: קִדְּמוּנִי
  choice: sumalubong sa akin
  rationale: Ang anyo mula sa קדם ay nangangahulugang pagharap o pagsalubong upang tanggapin. Kasama ng “mga tuhod,” inilalarawan nito ang pagtanggap sa bagong silang nang hindi inaalis ang konkretong larawan.
- source_word: בִרְכָּיִם
  choice: mga tuhod
  rationale: Pinananatili ang literal na pangmaramihang larawan sa Hebreo; maaaring tumukoy ito sa pagtanggap o paglalagay sa sanggol sa mga tuhod o kandungan.
- source_word: וּמַה
  choice: at bakit
  rationale: Bagaman literal na “at ano,” kahanay ito ng מַדּוּעַ at gumaganap bilang ikalawang tanong na “bakit.”
- source_word: שָׁדַיִם
  choice: mga dibdib
  rationale: Ito ang tuwiran at dignified na katawagang anatomikal. Hindi idinagdag ang “ng ina” sapagkat wala iyon sa tekstong Hebreo.
- source_word: כִּי
  choice: upang
  rationale: Ipinakikilala nito rito ang layunin o kinalabasan na kaugnay ng ikalawang tanong.
- source_word: אִינָק
  choice: ako'y dumede
  rationale: Ang pandiwa ay tumutukoy sa sanggol na sumususo o kumukuha ng gatas. Ang “dumede” ay malinaw, natural, at karaniwang modernong Tagalog para sa kilos ng sanggol.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran ngunit marangal. Pinanatili ang matingkad na larawan ng “mga tuhod,” habang ginamit ang natural na “dumede” para sa kilos ng sanggol. Inilagay ang mga pananda ng talababa sa mismong tekstong tinutukoy.
