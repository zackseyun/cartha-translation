lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: na nagagalak
  rationale: Ang may pantukoy na pandiwaring ito ay tumutukoy sa mga taong inilalarawan sa naunang talata. Likas sa Filipino ang sugnay na “na nagagalak” bilang pagpapatuloy ng pangungusap.
- source_word: אֱלֵי גִיל
  choice: labis
  rationale: Idyomatikong nagpapatingkad ang pariralang literal na “tungo sa kagalakan/pagsasaya.” Ang “labis” ay malinaw at likas na naghahatid ng tindi nang hindi pinapawi ang alternatibong mas literal.
- source_word: יָשִׂישׂוּ
  choice: nagsasaya
  rationale: Pinananatili nito ang ikalawang salitang Hebreo para sa matinding tuwa, habang iniiwasang ulitin lamang ang “nagagalak.”
- source_word: כִּי
  choice: kapag
  rationale: Inilalahad nito ang pagkakataon o pangyayaring nagbubunsod ng pagsasaya. Posible rin ang sanhi na “dahil,” kaya itinatala iyon sa talababa.
- source_word: יִמְצְאוּ
  choice: natatagpuan nila
  rationale: Direkta at natural na salin ng מצא sa konteksto; pinananatili ang payak at matalim na larawan ng pagkatagpo sa libingan.
- source_word: קָבֶר
  choice: ang libingan
  rationale: Ang “libingan” ay dignidad at likas na katumbas ng קָבֶר. Ginamit ang “ang” sa pangkalahatang diwa, ngunit maaari ring unawaing walang katiyakan ang pangngalan.
