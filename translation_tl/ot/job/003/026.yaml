translation:
  language: tl
  text: Hindi ako naging panatag[a], at hindi ako naging tahimik; hindi ako nagpahinga, at dumating ang kaguluhan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Hindi ako naging payapa, hindi ako naging tahimik, at hindi ako nagpahinga.” Tatlong halos magkasingkahulugang pandiwa ang ginamit sa Hebreo upang idiin na hindi nakaranas si Job ng anumang ginhawa.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “kaguluhan” bilang “ligalig,” “pagkabalisa,” o “pagkagambala.” Maaari itong tumukoy sa panloob na pagkabagabag o sa pangyayaring nagdudulot nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַוְתִּי
  choice: ako napanatag
  rationale: Ipinahahayag ng pandiwa ang pagiging payapa o malaya sa panggugulo. Ang “napanatag” ay likas sa makabagong Tagalog at hindi nililimitahan ang diwa sa panloob na damdamin lamang o sa panlabas na katiwasayan lamang.
- source_word: שָׁקַטְתִּי
  choice: ako natahimik
  rationale: Tumutukoy ang שׁקט sa katahimikan o kawalan ng panggugulo. Pinananatili ng “natahimik” ang pagkakaiba nito sa “napanatag” habang binubuo ang tatluhang pagtindi.
- source_word: נָחְתִּי
  choice: ako nakapagpahinga
  rationale: Ang נוח ay nangangahulugang magpahinga o tumigil sa pagkilos. Ang “nakapagpahinga” ay malinaw at natural, at nagpapahiwatig ng pahingang hindi naranasan ni Job nang hindi nagdaragdag ng tiyak na dahilan.
- source_word: רֹגֶז
  choice: kaguluhan
  rationale: Maaaring tumukoy ang pangngalan sa pagkabalisa, ligalig, panginginig, o kaguluhan. Malawak ang “kaguluhan” upang masaklaw ang panloob at panlabas na pagyanig nang hindi ito pinapakahulugang galit lamang.
- source_word: וַיָּבֹא
  choice: at dumating
  rationale: Payak na isinasalin ang pagdating ng רֹגֶז. Hindi idinagdag ang “sa akin” dahil walang tahasang layon sa Hebreo.
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: Hindi ako ... at hindi ako ...; hindi ako ...
  rationale: Pinananatili ng inuulit na “hindi ako” ang madiing ritmo ng tatlong magkahanay na pagkakait sa Hebreo.
