  text: There the wicked cease from turmoil[b][a], and there those weary in strength find rest.
translation:
  language: tl
  text: Doon tumitigil ang pagkabalisa[a] ng masasama, at doon nagpapahinga ang mga ubos na ang lakas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaguluhan,” “pagngangalit,” o “pagkaligalig.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang mga pagod sa lakas,” isang idyomang tumutukoy sa mga lubos nang naubusan ng lakas.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Doon
  rationale: Likas at maikling panumbas sa pang-abay na pook; tumutukoy ito sa lugar na inilalarawan sa panaghoy ni Job.
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Karaniwang makauring pangngalan para sa mga taong masama; pinananatili ang moral na kategorya nang hindi dinaragdagan ang diwa.
- source_word: חָדְלוּ
  choice: tumitigil
  rationale: Ang Qal perfect ng חדל ay nangangahulugang huminto o tumigil. Ang aspektong pangkasalukuyan ay angkop sa pangkalahatang paglalarawan ng lugar sa konteksto.
- source_word: רֹגֶז
  choice: sa panggugulo
  rationale: Maaaring tumukoy sa pagkaligalig, pagngangalit, o kaguluhang idinudulot. Sa konstruksiyon kasama ng masasama, likas sa Filipino ang 'tumitigil sa panggugulo,' habang inilalahad sa talababa ang ibang posibleng pagbasa.
- source_word: וְשָׁם
  choice: at doon
  rationale: Pinananatili ang pangatnig, pag-uulit, at diin ng ikalawang hati ng paralelismong patula.
- source_word: יָנוּחוּ
  choice: nagpapahinga
  rationale: Tumpak at likas na salin ng נוח, na nangangahulugang magpahinga o mamahinga.
- source_word: יְגִיעֵי כֹחַ
  choice: ang mga ubos na ang lakas
  rationale: Likas na Filipino para sa literal na 'mga pagod sa lakas,' at malinaw na ipinahahayag ang mga taong lubos nang nanghina o naubusan ng lakas.
