    issue: Ang “panggugulo” ay nagpapahiwatig na ang masasama ang aktibong nanggugulo.
    rationale: Ang רֹגֶז ay maaaring mangahulugang pagkaligalig, kaguluhan, o pagngangalit. Hindi kinakailangang tukuyin ng talata kung ang tinutukoy ay panggugulong ginagawa nila; kaya mas mainam ang isang saling hindi nagpapaliit sa saklaw.
  - severity: low
