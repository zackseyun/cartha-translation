  source_fidelity: Ang “Doon” at ang inuulit na “at doon” ay tapat sa paralelismong שָׁם ... וְשָׁם. Tumpak ang “ang masasama,” “nagpapahinga,” at “mga ubos na ang lakas.” Gayunman, ang “tumitigil sa panggugulo ang masasama” ay masyadong itinuturing ang רֹגֶז bilang panggugulong ginagawa ng masasama. Ang Hebreo ay tumutukoy nang mas malawak sa kanilang pagkaligalig/pagkabalisa o kaguluhan at hindi dapat paliitin sa aktibong pananakit o panggugulo ng iba.
  naturalness: Likas at marangal ang pangkalahatang daloy. Mas natural at mas malapit sa saklaw ng Hebreo ang “tumitigil ang pagkabalisa ng masasama” kaysa sa “tumitigil sa panggugulo ang masasama.”
  terminology: Ang “masasama” ay angkop para sa רְשָׁעִים. Ang “pagkabalisa” ay isang natural na malawak na katumbas ng רֹגֶז sa kontekstong ito; itinatala ng talababa ang iba pang posibleng kulay ng kahulugan. Ang panandang a ay inililipat upang tumukoy sa salitang isinasalin nito, hindi sa “masasama.”
