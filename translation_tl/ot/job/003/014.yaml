  source_fidelity: Tumpak na naihahatid ang עִם מְלָכִים וְיֹעֲצֵי אָרֶץ bilang “kasama ng mga hari at mga tagapayo ng daigdig.” Ang participial na הַבֹּנִים ay makatwirang isinaling “na nagtayo,” at ang “mga guho” ay maingat na pinananatili ang sadyang mahirap at hindi pangkaraniwang larawan ng חֳרָבוֹת nang hindi nagdaragdag ng interpretasyong “palasyo,” “libingan,” o “muling itinayong lugar.” Ang “para sa kanilang sarili” ay sapat na katumbas ng לָמוֹ sa kontekstong ito.
  naturalness: Natural at marangal ang Filipino ng taludtod. Ang pag-uulit ng “mga” sa “mga hari at mga tagapayo” ay ganap na katanggap-tanggap at nagbibigay-linaw sa magkatuwang na pangmaramihang pangngalan. Ang hati ng linya at tandang-kuwit ay angkop sa pagiging bahagi ng pangungusap at sa poetikong daloy.
  terminology: Ang “mga hari,” “mga tagapayo,” “daigdig,” at “mga guho” ay pare-pareho sa makabagong Filipino at tumutugon sa Hebreong leksikon. Walang terminong teolohikal na nangangailangan ng pagbabago. Kaayon din ito ng English POB audit trail na pinananatili ang “ruins” sa halip na paliwanaging “desolate places.”
