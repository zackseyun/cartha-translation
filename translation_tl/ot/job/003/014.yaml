  text: with kings and counselors of the earth, who built ruins for themselves,
translation:
  language: tl
  text: 'kasama ng mga hari at mga tagapayo ng daigdig,

    na nagtayo ng mga guho para sa kanilang sarili;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְלָכִים
  choice: mga hari
  rationale: Tuwirang katumbas ng pangmaramihang Hebreo.
- source_word: יֹעֲצֵי אָרֶץ
  choice: mga tagapayo ng daigdig
  rationale: Pinananatili ang konstruktong Hebreo at ang malawak na saklaw ng אֶרֶץ nang hindi nagdaragdag ng hindi tahasang tinukoy na pinaglilingkuran nila.
- source_word: הַבֹּנִים
  choice: na nagtayo
  rationale: Likas na Tagalog para sa participle na tumutukoy sa mga hari at tagapayo.
- source_word: חֳרָבוֹת
  choice: mga guho
  rationale: Pinananatili ang kapansin-pansing literal na larawan ng mga 'guho' at hindi ito tahimik na binibigyang-kahulugang mga palasyo, libingan, o muling itinayong pook.
- source_word: לָמוֹ
  choice: para sa kanilang sarili
  rationale: Isinasalin ang pangmaramihang di-tuwirang layon at ang pansariling pakinabang na ipinahihiwatig ng konteksto.
theological_decisions:
- issue: Ang kahulugan ng pagtatayo ng חֳרָבוֹת
  choice: na nagtayo ng mga guho para sa kanilang sarili
  alternative: na muling nagtayo ng mga wasak na pook para sa kanilang sarili
  rationale: 'Tunay na mahirap ang parirala: maaaring tumukoy sa pagtatayo o muling pagtatayo ng mga pook na nauwi o dati nang naging guho. Pinananatili ng pangunahing salin ang maigsi at nakagugulat na anyo ng Hebreo nang hindi ipinapasok ang isang tiyak na interpretasyon.'
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinananatili ang poetikong paralelismo at ang semantikong tensiyon ng 'nagtayo ng mga guho.'
