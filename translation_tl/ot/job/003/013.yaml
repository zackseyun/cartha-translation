  naturalness: Kailangan ang maliit na pag-aayos upang maging likas at malinaw ang modernong Filipino. Ang “nananahimik” ay isang buong panaguri para sa שקט, at ang “kung magkagayon” ay naipapahayag ang אָז nang hindi nawawala ang sunod-sunod na daloy ng tula.
  terminology: Ang “nakahimlay,” “nakatulog,” at “kapahingahan” ay angkop sa marangal ngunit makabagong rehistro at hindi ipinipilit ang anumang doktrina tungkol sa kalagayan ng mga patay.
