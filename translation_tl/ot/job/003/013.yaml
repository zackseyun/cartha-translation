revisions:
- from: Sapagkat ngayon sana'y nakahimlay na ako at tahimik[a]; nakatulog na sana ako—at nakapagpahinga.[b]
  to: Sapagkat ngayon sana ay nakahimlay na ako at nananahimik; nakatulog na sana ako—kung magkagayon ay magkakaroon sana ako ng kapahingahan.[a]
  rationale: Inayos ang unang magkapares na pandiwa upang maging ganap at likas ang Filipino, at isinalin nang mas malapit ang huling konstruksyon bilang “magkakaroon sana ako ng kapahingahan.” Pinanatili ang counterfactual na “sana,” ang temporal na “ngayon,” at ang hindi ipinaliliwanag na larawan ng paghiga, pagtulog, at kapahingahan. Inalis ang dating talababa para sa “tahimik” dahil ang mga mungkahing “payapa” at “walang ligalig” ay hindi kinakailangang lexical alternatives sa binagong natural na pananalita; ang natitirang talababa ay nagbibigay ng idiomatikong alternatibo para sa huling sugnay.
