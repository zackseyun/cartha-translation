    text: O “saka sana ako magpapahinga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan kaugnay ng naunang paghahangad ni Job.
- source_word: עַתָּה
  choice: ngayon
  rationale: Pinananatili ang temporal na punto ng bunga na sana'y nararanasan na niya kung namatay siya sa pagsilang.
- source_word: שָׁכַבְתִּי
  choice: nakahimlay na sana ako
  rationale: Ang “nakahimlay” ay likas at marangal na Filipino na nagpapanatili sa larawan ng paghiga nang hindi tahasang pinapalitan ito ng “namatay.”
- source_word: וְאֶשְׁקֹט
  choice: at tahimik
  rationale: Malapit ito sa diwa ng pagiging hindi ginagambala at pinananatili ang pagkakaiba nito sa kasunod na pagpapahinga.
- source_word: יָשַׁנְתִּי
  choice: nakatulog na sana ako
  rationale: Pinananatili ang karaniwang pandiwa at ang matalinghagang larawan ng pagtulog, sa halip na ipaliwanag ito bilang kamatayan.
- source_word: אָז
  choice: at
  rationale: Sa natural na Filipino, ipinahihiwatig ng pagkakasunod ng mga sugnay ang konsekuwensiya; ang alternatibong “kung magkagayon” ay inilalagay sa talababa.
- source_word: יָנוּחַ לִי
  choice: nakapagpahinga
  rationale: Natural na Filipino para sa kalagayan ng kapahingahan, samantalang inilalahad sa talababa ang mas literal na konstruksyong “magkakaroon sana ako ng kapahingahan.”
theological_decisions:
- issue: Larawan ng kamatayan bilang paghiga, pagtulog, at pagpapahinga
  choice: Panatilihin ang mga larawan ng paghihimlay, pagtulog, at pagpapahinga nang hindi tahasang sinasabing “namatay.”
  alternative: Isalin bilang “namatay” o palawakin bilang “nagpahinga sa kamatayan.”
  rationale: Gumagamit ang Hebreo ng ordinaryong mga pandiwa bilang matalinghagang paglalarawan; ang pagpapanatili sa mga ito ay hindi naglalagay ng tiyak na doktrina tungkol sa kalagayan ng mga patay.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nakahimlay” upang mapanatili ang patulang larawan at ang “sana” upang malinaw ang salungat-sa-katotohanang diwa. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
