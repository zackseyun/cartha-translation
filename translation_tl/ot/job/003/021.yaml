translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang talinghaga ng paghuhukay at ang tuloy-tuloy na sintaks ng talata sa loob ng mas malaking pangungusap ng Job 3. Gumamit ng “rito” upang malinaw na tumukoy sa kamatayan at maiwasan ang mabigat na pag-uulit.
