  text: who wait for death[a], but it does not come, and dig for it more than for hidden treasures,
translation:
  language: tl
  text: 'na naghihintay ng kamatayan[a], ngunit hindi ito dumarating,


    at humuhukay para rito nang higit pa kaysa para sa mga nakatagong kayamanan;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “ngunit wala ito roon.” Literal sa Hebreo: “at wala ito,” na nangangahulugang hindi nagpapakita o dumarating ang kamatayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְחַכִּים
  choice: na naghihintay
  rationale: Ang participle ng חכה ay pangunahing tumutukoy sa paghihintay nang may inaasahan. Likas at tuwiran sa modernong Tagalog ang “naghihintay,” habang ipinahihiwatig na ng konteksto ang matinding pananabik.
- source_word: לַמָּוֶת
  choice: sa kamatayan
  rationale: 'Tuwirang ipinapahayag ng pariralang may ל ang hinihintay: ang kamatayan.'
- source_word: וְאֵינֶנּוּ
  choice: ngunit hindi ito dumarating
  rationale: Literal itong “at wala ito/hindi ito naroon,” at ang panlalaking hulapi ay tumutukoy sa kamatayan. Sa konteksto, malinaw at natural na ipinahahayag ng “hindi ito dumarating” ang hindi pagsapit ng kamatayan, samantalang pinananatili sa talababa ang literal na anyo.
- source_word: וַיַּחְפְּרֻהוּ
  choice: at humuhukay para rito
  rationale: 'Pinananatili ng “humuhukay” ang matingkad na larawan ng חפר: hinahanap nila ang kamatayan gaya ng paghuhukay para sa nakabaong kayamanan.'
- source_word: מִמַּטְמוֹנִים
  choice: nang higit pa kaysa para sa mga nakatagong kayamanan
  rationale: Ang מַטְמוֹן ay nakatago o inimbak na kayamanan, at paghahambing ang gamit ng מִן dito. Pinananatili ng salin ang kaugnayan nito sa larawan ng paghuhukay.
