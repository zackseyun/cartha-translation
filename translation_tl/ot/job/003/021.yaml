  naturalness: 'Kailangan ang maliit ngunit mahalagang pagwawasto sa balangkas na "naghihintay sa kamatayan." Sa karaniwang modernong Filipino, ang bagay na hinihintay ay minamarkahan ng "ng": "naghihintay ng kamatayan." Natural ang natitirang sintaks at ang marangal na rehistro nito.'
  terminology: Ang "kamatayan," "humuhukay," at "mga nakatagong kayamanan" ay wasto, malinaw, at angkop sa larawang Hebreo. Ang "rito" ay may malinaw na pantukoy sa kamatayan.
