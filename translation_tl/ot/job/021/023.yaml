  source_fidelity: Tumpak na naihahatid ng salin ang pangkalahatang/kinatawang kaso ng Hebreong זֶה at ang aspektong pangkalahatang obserbasyon ng יָמוּת. Ang “habang nasa kasukdulan ng kanyang lakas” ay isang natural na pagpapahayag ng idiomang בְּעֶצֶם תֻּמּוֹ, na tumutukoy rito sa buong lakas o hindi pa pahinang kalagayan, hindi sa moral na integridad. Napanatili rin ang pagpapatindi ng כֻּלּוֹ at ang magkatambal na katahimikan at kapanatagan ng שַׁלְאֲנַן וְשָׁלֵיו.
