  yaml_path: translation/ot/job/021/023.yaml
  text: One dies in the fullness of his vigor[a], wholly at ease and secure.
translation:
  language: tl
  text: May taong namamatay habang nasa kasukdulan ng kanyang lakas, lubos na panatag at tiwasay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה
  choice: May taong
  rationale: Ipinakikilala ng demonstratibo ang isang kinatawang kaso sa paghahambing ni Job. Likas sa modernong Tagalog ang “May taong” at hindi nito labis na binibigyang-diin ang kasarian.
- source_word: יָמוּת
  choice: namamatay
  rationale: Ang imperfect ay ginagamit bilang pangkalahatang obserbasyon, kaya ang aspektong pangkasalukuyan ng “namamatay” ay mas angkop kaysa isang tiyak na hula sa hinaharap.
- source_word: בְּעֶצֶם תֻּמּוֹ
  choice: habang nasa kasukdulan ng kanyang lakas
  rationale: Bagaman literal na kaugnay ng “buto,” “kabuuan,” o “kalagayang buo,” ipinahihiwatig ng parirala rito ang ganap at hindi humihinang sigla o lakas. Iniiwasan nitong ipakahulugan ang תֻּם bilang moral na integridad.
- source_word: כֻּלּוֹ
  choice: lubos na
  rationale: Ginagamit ang salita bilang pampalakas sa kasunod na paglalarawan; natural na naihahatid ito ng “lubos na.”
- source_word: שַׁלְאֲנַן
  choice: panatag
  rationale: Ipinahihiwatig nito ang maginhawa at walang ligalig na kalagayan, nang hindi tahasang nililimitahan ang kahulugan sa materyal na kasaganaan.
- source_word: וְשָׁלֵיו
  choice: at tiwasay
  rationale: Ang malapit na kasingkahulugan ay nagpapatingkad sa payapa at hindi nababagabag na kalagayan; ang “tiwasay” ay natural na katambal ng “panatag.”
