  text: הַ/לְ/אֵ֥ל יְלַמֶּד דָּ֑עַת וְ֝/ה֗וּא רָמִ֥ים יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/022.yaml
  text: Can anyone teach God knowledge[a], since he judges those on high?
translation:
  language: tl
  text: May makapagtuturo ba sa Diyos ng kaalaman, gayong hinahatulan niya ang mga nasa kaitaasan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga dinakila”; maaaring tumukoy sa “mga nilalang sa langit.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְאֵל
  choice: May makapagtuturo ba sa Diyos
  rationale: Ang הֲ ay nagpapakilala ng retorikal na tanong, at ang לְאֵל ay tumutukoy sa Diyos bilang tinuturuan. Likas sa modernong Tagalog ang paglalagay ng di-tiyak na paksa sa anyong “May makapagtuturo ba.”
- source_word: יְלַמֶּד
  choice: makapagtuturo
  rationale: Ang Piel ng למד ay “magturo” o “magturo nang may pagtuturo.” Ang anyong may “makapag-” ay angkop sa retorikal na tanong tungkol sa kakayahan o posibilidad.
- source_word: דָּעַת
  choice: kaalaman
  rationale: Tuwirang pinananatili ang abstraktong pangngalang Hebreo at ang pariralang “magturo ... ng kaalaman.”
- source_word: וְהוּא
  choice: gayong ... niya
  rationale: Maaaring literal na “at siya,” ngunit sa konteksto ay nagbibigay ito ng batayan sa retorikal na tanong. Ang “gayong” ay natural na nagpapahayag ng ugnayang iyon nang hindi labis na nagpapakahulugan.
- source_word: רָמִים
  choice: ang mga nasa kaitaasan
  rationale: Pinananatili ng parirala ang malawak na kahulugan ng substantibong pangmaramihang anyo—maaaring mga taong mataas ang katayuan o mga nilalang sa langit—nang hindi tinutukoy nang mas makitid ang referent.
- source_word: יִשְׁפּוֹט
  choice: hinahatulan
  rationale: Ang Qal ng שפט ay nangangahulugang humatol. Ang “hinahatulan” ay malinaw na nagpapakitang ang mga nasa kaitaasan ang layon ng paghatol ng Diyos.
theological_decisions:
- issue: Tinutukoy ng רָמִים
  choice: ang mga nasa kaitaasan
  alternative: ang mga dinakila; ang mga pinuno; ang mga nilalang sa langit
  rationale: Hindi tiyak sa Hebreo kung mga makapangyarihang tao o mga nilalang sa langit ang tinutukoy. Pinananatili ng salin ang tunay na kalabuan at ang diin sa kataas-taasang awtoridad ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “gayong” upang maipahayag ang lohikal na ugnayan ng dalawang sugnay, at pinanatili ang kalabuan ng “mga nasa kaitaasan.”
