    rationale: Ang pandiwa ay nagpapahiwatig ng pagkagimbal, pagkasindak, o pagkatakot; ang "nanghihilakbot" ay mas malapit sa bigat ng magkapares na pahayag tungkol sa panginginig.
  - severity: low
    issue: Ang "buong katawan ko" ay higit sa saklaw ng בְּשָׂרִי.
    rationale: Ang Hebreo ay "aking laman" at maaaring idiomatikong "aking katawan," ngunit hindi nito tahasang sinasabing "buong" katawan.
  revised_text: Kapag naaalala ko, nanghihilakbot ako, at sinasaklot ng panginginig ang aking katawan.
