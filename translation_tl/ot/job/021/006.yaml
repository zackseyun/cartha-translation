    issue: Idinagdag ang "ito" pagkatapos ng "naaalaala ko."
    rationale: Walang tuwirang pantukoy na "ito" sa Hebreo. Naiintindihan ang paksa mula sa konteksto, kaya mas tapat at mas maigsi kung aalisin ito.
  - severity: medium
