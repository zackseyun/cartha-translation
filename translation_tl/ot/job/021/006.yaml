  text: When I remember, I am dismayed, and trembling seizes my flesh.
translation:
  language: tl
  text: Kapag naaalala ko, nanghihilakbot ako, at sinasaklot ng panginginig ang aking katawan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם זָכַרְתִּי
  choice: Kapag naaalaala ko ito
  rationale: Sa konteksto, ang אִם ay may temporal na diwang ‘kapag,’ gaya ng kinikilalang rebisyon; idinagdag ang ‘ito’ bilang likas na Tagalog na pantukoy sa bagay na naaalaala, nang hindi tinutukoy nang higit sa sinasabi ng konteksto.
- source_word: וְנִבְהָלְתִּי
  choice: nababagabag ako
  rationale: Ipinahahayag ng Niphal ng בהל ang matinding pagkagimbal o pagkabalisa; natural at marangal sa modernong Tagalog ang ‘nababagabag.’
- source_word: וְאָחַז ... פַּלָּצוּת
  choice: nanginginig
  rationale: Ang literal na larawan ay ‘sinakmal ng panginginig’; ang pandiwang Tagalog na ‘nanginginig’ ay malinaw na naghahatid ng epekto nang hindi nagiging pilit.
- source_word: בְּשָׂרִי
  choice: ang buong katawan ko
  rationale: Literal na ‘aking laman,’ ngunit sa kontekstong pisikal ang בשר ay tumutukoy sa katawan; ang ‘buong katawan ko’ ay likas na Tagalog at nagpapahayag ng paglaganap ng panginginig.
