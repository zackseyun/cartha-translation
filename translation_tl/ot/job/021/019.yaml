  text: God stores up his iniquity for his sons? Let him repay it to the man himself[c][b][a], so that he may know it.
translation:
  language: tl
  text: Iniipon ba ng Diyos ang kanyang kasamaan para sa kanyang mga anak[b]?[a] Sa kanya mismo nawa siya singilin ng Diyos, upang malaman niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang walang retorikal na tanong: “Iniipon ng Diyos ang kanyang kasamaan para sa kanyang mga anak; sa kanya nawa siya singilin ng Diyos, upang malaman niya.” Gayunman, ipinahihiwatig ng konteksto na hinahamon ni Job ang kaisipang ito.'
    reason: alternative_reading
  - marker: b
    text: Mas literal na “mga anak na lalaki”; maaari rin itong tumukoy nang mas malawak sa mga anak o inapo ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Karaniwang katawagang isahan ito para sa Diyos sa aklat ng Job; hindi dinaragdagan ng kahulugang wala sa anyong Hebreo.
- source_word: יִצְפֹּן
  choice: iniipon
  rationale: Ipinahihiwatig ng צפן ang pagtatabi o paglalaan para sa hinaharap. Likas sa modernong Tagalog ang “iniipon” at angkop sa diwang ipinagpapalibang ganti.
- source_word: לְבָנָיו
  choice: para sa kanyang mga anak
  rationale: Literal na “mga anak na lalaki” ang Hebreo, ngunit maaaring tumukoy sa mga anak o inapo sa ganitong konteksto. Ginamit ang natural na “mga anak,” at itinabi sa talababa ang mas literal na anyo.
- source_word: אוֹנוֹ
  choice: ang kasamaan niya
  rationale: Maaaring mangahulugan ang אָוֶן ng kasamaan, kapahamakan, o bunga/parusa ng kasamaan. Pinili ang “kasamaan” upang huwag tahimik na ipasok ang interpretasyong “parusa,” habang binabanggit sa talababa ang saklaw ng salita.
- source_word: יְשַׁלֵּם
  choice: iganti ng Diyos
  rationale: Sa Piel, ang שׁלם ay maaaring mangahulugang gumanti o magbayad nang nararapat. Ang “iganti” ay malinaw at natural sa konteksto ng makatarungang pagganti, at pinananatili ang pakiusap o hamon ni Job.
- source_word: אֵלָיו
  choice: sa kanya mismo
  rationale: Tumutukoy ang panghalip sa masamang tao at mariing inihahambing siya sa kanyang mga anak.
- source_word: וְיֵדָע
  choice: upang malaman niya
  rationale: Pinananatili ang karaniwang kahulugan ng ידע na “malaman” at binabasa ang pangatnig at imperfect bilang layunin o bunga sa konteksto.
theological_decisions:
- issue: Kung ang unang sugnay ay tuwirang pahayag ni Job o isang kaisipang hinahamon niya
  choice: 'Iniharap bilang retorikal na tanong: “iniipon ba ng Diyos...?”'
  alternative: 'Basahin bilang payak na pahayag: “Iniipon ng Diyos ang kasamaan niya para sa kanyang mga anak.”'
  rationale: Sa daloy ng Job 21, tinututulan ni Job ang paliwanag na sapat nang maparusahan ang mga anak ng masamang tao. Pinananatili ng tanong ang puwersa ng argumento nang hindi itinatago ang posibleng payak na pagbasa sa Hebreo.
- issue: Kung isasalin ang אָוֶן bilang kasamaan o bilang parusa sa kasamaan
  choice: “kasamaan niya” sa pangunahing teksto
  alternative: “parusa sa kanyang kasamaan” o “kapahamakan niya”
  rationale: Mas tuwirang kumakatawan ang “kasamaan” sa leksikal na anyo at hindi agad nilulutas kung ang tinutukoy ay pagkakasala o ang masamang bunga nito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang retorikal na tanong upang maipakita ang argumento ni Job, at iniwasang gawing tahasang “parusa” ang salitang may tunay na leksikal na kalabuan.
