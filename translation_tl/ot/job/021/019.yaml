  source_fidelity: Maayos na naipapakita ng draft ang retorikal na pagbasa at ang leksikal na kalabuan ng אָוֶן. Gayunman, ang “iyon iganti” ay hindi malinaw at hindi likas na paraan sa Tagalog upang isalin ang pagganti/pagsingil na tuwirang daranasin ng tao mismo. Mas tapat at malinaw ang “siya ... singilin ng Diyos,” habang ang talababa ang nagpapanatili ng kalabuan kung kasamaan, kapahamakan, o kaparusahan ang אָוֶן.
  naturalness: Ang unang sugnay na may paksa sa unahan (“Ang kasamaan niya, iniipon ba...”) ay medyo pilit sa modernong Filipino. Mas natural ang karaniwang ayos na “Iniipon ba ng Diyos ang kanyang kasamaan...?” Ang “Sa kanya mismo nawa siya singilin ng Diyos” ay malinaw, marangal ang rehistro, at mas idiomatiko kaysa “Sa kanya mismo iyon iganti ng Diyos.”
  terminology: Pinananatili ang “Diyos,” “kasamaan,” at “mga anak.” Ang “mga anak” ay sapat sa pangunahing teksto dahil nililinaw ng talababa na masculine plural ang Hebreo at maaari itong umabot sa mga inapo. Ang “singilin” ay nagpapahiwatig ng pag-uusig o paniningil na nararapat nang hindi tahasang pinipili ang “parusa” bilang tanging kahulugan ng אָוֶן.
