  text: הֲ/לֹ֣א שְׁ֭אֶלְתֶּם ע֣וֹבְרֵי דָ֑רֶךְ וְ֝/אֹתֹתָ֗/ם לֹ֣א תְנַכֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/029.yaml
  text: Have you not asked those who travel the road[b][a], and do you not recognize their signs?
translation:
  language: tl
  text: Hindi ba ninyo tinanong ang mga naglalakbay sa daan[a], at hindi ba ninyo kinikilala ang kanilang mga palatandaan[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga manlalakbay” o “mga dumaraan sa daan.”
    reason: lexical_alternative
  - marker: b
    text: O “mga tanda” o “mga katibayan”; maaaring tumukoy ang parirala sa mga pahiwatig o ebidensiyang nalalaman mula sa mga ulat ng mga manlalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap at ang bahagyang mapanuyang tono ni Job.
- source_word: שְׁאֶלְתֶּם
  choice: ninyo tinanong
  rationale: Karaniwan at tuwirang salin ng pandiwang nangangahulugang magtanong o magsiyasat; ang maramihang 'ninyo' ay tumutugma sa kausap na pangmaramihan.
- source_word: עֹבְרֵי דָרֶךְ
  choice: mga naglalakbay sa daan
  rationale: Inilalarawan ang mga dumaraan o manlalakbay at pinananatili ang tahasang larawan ng paglalakbay sa daan.
- source_word: וְאֹתֹתָם
  choice: ang kanilang mga palatandaan
  rationale: Pinananatili ang pangunahing kahulugan ng אוֹת bilang tanda o palatandaan, nang hindi agad ginagawang 'patotoo' ang salitang maaaring tumukoy sa ebidensiya o mga pahiwatig mula sa mga manlalakbay.
- source_word: לֹא תְנַכֵּרוּ
  choice: hindi ba ninyo kinikilala
  rationale: Ang piel ng נכר dito ay malamang na nangangahulugang kilalanin o tanggapin bilang makikilala; natural na kaakibat ng 'mga palatandaan' ang 'kinikilala.'
