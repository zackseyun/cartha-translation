  yaml_path: translation/ot/job/021/012.yaml
  text: They sing to the tambourine and lyre, and rejoice at the sound of the flute.
translation:
  language: tl
  text: Umaawit sila sa saliw ng tamburin at lira, at nagsasaya sa tunog ng plauta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: Umaawit sila
  rationale: Ang pandiwa ay literal na “itinataas/binubuhat nila,” ngunit sa konteksto ng mga instrumentong pangmusika ay idiomatikong tumutukoy sa pag-awit o pagtataas ng awit. Likas at malinaw sa Tagalog ang “umaawit sila.”
- source_word: כְּתֹף
  choice: sa saliw ng tamburin
  rationale: Ang תֹף ay tamburin o maliit na tambol na hinahampas. Ginamit ang “sa saliw ng” upang natural na ipahayag ang musikal na ugnayan ng pag-awit at instrumento.
- source_word: כִנּוֹר
  choice: lira
  rationale: Isang sinaunang instrumentong de-kuwerdas; mas tumpak ang “lira” kaysa modernong “alpa.”
- source_word: עוּגָב
  choice: plauta
  rationale: Tumutukoy sa isang instrumentong hinihipan, bagaman hindi tiyak ang eksaktong anyo nito. Ang “plauta” ay malinaw at tradisyonal na katumbas sa kontekstong ito.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang parallel na kilos ng pag-awit at pagsasaya, nang walang dagdag na interpretasyong teolohikal.
