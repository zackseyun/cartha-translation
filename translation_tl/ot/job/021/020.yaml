  text: יִרְא֣וּ עינ/ו כִּיד֑/וֹ וּ/מֵ/חֲמַ֖ת שַׁדַּ֣י יִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/020.yaml
  text: Let his own eyes see his ruin[b][a], and let him drink from the wrath of the Almighty.
translation:
  language: tl
  text: Makita nawa ng sarili niyang mga mata ang kanyang kapahamakan[b][a], at uminom nawa siya mula sa poot ng Makapangyarihan sa Lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Makikita ng kanyang mga mata ang kanyang kapahamakan, at iinom siya mula sa poot ng Makapangyarihan sa Lahat.” Maaaring basahin ang mga imperfect na pandiwa sa Hebreo bilang mga pahayag tungkol sa mangyayari, sa halip na bilang isang paghiling.
    reason: alternative_reading
  - marker: b
    text: Ang “kapahamakan” ay maaari ring isaling “sakuna” o “pagbagsak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: Makita nawa
  rationale: Ang Qal imperfect na ikatlong panauhang panlalaking maramihan ay umaayon sa maramihang paksa na “mga mata.” Sa konteksto, likas itong basahin bilang paghiling na ang masama mismo ang makaranas ng hatol; pinananatili ng “nawa” ang jussive-like na puwersa.
- source_word: עיניו
  choice: ng sarili niyang mga mata
  rationale: Tuwirang nangangahulugang “ng kanyang mga mata.” Idinagdag ang “sarili” upang idiin na personal niyang makikita at mararanasan ang bunga, gaya ng diin ng sugnay sa konteksto.
- source_word: כידו
  choice: ang kanyang kapahamakan
  rationale: Ang כיד ay tumutukoy sa sakuna, kapahamakan, o pagbagsak. Ang “kapahamakan” ay natural at hindi kasing-tindi ng salitang maaaring magpahiwatig ng lubos na pagkalipol.
- source_word: ומחמת
  choice: mula sa poot ng
  rationale: Maaaring mangahulugan ang חֵמָה ng poot, matinding galit, o sa ibang konteksto ay kamandag. Kasama ng pandiwang “uminom” at ng banal na paghatol, ang “poot” ang pinakamalinaw habang pinananatili ang talinghaga at ang pang-ukol na מִן (“mula sa”).
- source_word: שדי
  choice: Makapangyarihan sa Lahat
  rationale: Karaniwang salin sa modernong Tagalog ng titulong Shaddai; pinananatili nito ang lakas ng banal na titulo nang hindi nagdaragdag ng mas tiyak na paliwanag kaysa sa Hebreo.
- source_word: ישתה
  choice: uminom nawa siya
  rationale: Ang Qal imperfect na ikatlong panauhang panlalaking isahan ay kahanay ng unang pandiwa at binasa rito bilang paghiling. Pinananatili ng “uminom” ang talinghaga ng personal na pagtanggap ng banal na poot sa halip na payak na sabihing “maranasan.”
theological_decisions:
- issue: Puwersa ng mga imperfect na pandiwa sa talata
  choice: 'Isinalin bilang mga paghiling: “Makita nawa … uminom nawa siya.”'
  alternative: 'Maaaring basahin bilang panghinaharap na pahayag: “Makikita … iinom siya.”'
  rationale: Sa konteksto, iginigiit ni Job na ang masama mismo, hindi lamang ang kanyang mga anak, ang humarap sa hatol. Pinakamalinaw na ipinahahayag ng anyong paghiling ang retorikal na puwersang ito, ngunit tunay na pinahihintulutan ng mga anyong Hebreo ang prediktibong pagbasa, kaya inilagay iyon sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nawa” upang malinaw ngunit hindi labis na kolokyal na maipahayag ang jussive-like na paghiling. Pinanatili ang metaporang “uminom mula sa poot” at ang tunay na ambiguwidad ng mga imperfect sa pamamagitan ng talababa.
