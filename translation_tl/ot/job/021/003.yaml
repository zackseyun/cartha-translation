base_translation:
  language: en
  yaml_path: translation/ot/job/021/003.yaml
  text: Bear with me[a], and I will speak; and after I have spoken[b], you may mock.
translation:
  language: tl
  text: Pagtiisan ninyo ako[a], at magsasalita ako; pagkatapos kong magsalita, maaari mo akong kutyain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagpasensiyahan ninyo ako.” Literal na gumagamit ang Hebreo ng salitang “buhatin” o “dalhin,” ngunit dito ay nangangahulugang tiisin ang isang tao at hayaan siyang magsalita.
    reason: lexical_alternative
  - marker: b
    text: 'O “pagkatapos kong magsalita, kutyain mo ako.” Maaaring unawain ang Hebreo bilang payak na panghinaharap o bilang pagbibigay-pahintulot: “maaari mo akong kutyain.”'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂאוּ/נִי
  choice: Pagtiisan ninyo ako
  rationale: Ang נָשָׂא ay literal na “buhatin/dalhin,” ngunit sa kontekstong ito ay idyomatikong pakiusap na tiisin siya at bigyan ng pagkakataong magsalita. Ang maramihang anyo ng pandiwa ay pinanatili sa “ninyo.”
- source_word: וְ/אָנֹכִי אֲדַבֵּר
  choice: at magsasalita ako
  rationale: Pinananatili ng tahasang “ako” ang diin ng panghalip na אָנֹכִי, habang natural sa modernong Tagalog ang ayos na “magsasalita ako.”
- source_word: וְ/אַחַר דַּבְּרִי
  choice: pagkatapos kong magsalita
  rationale: Ang דַּבְּרִי ay literal na “aking pagsasalita.” Isinasalin ito bilang sugnay upang maging natural sa Tagalog nang hindi inililipat ang diwa mula sa kilos tungo sa nilalaman ng sinabi.
- source_word: תַלְעִיג
  choice: maaari mo akong kutyain
  rationale: Ang Hiphil ng לעג ay nangangahulugang “kutyain” o “libakin.” Ang “maaari” ay kumakatawan sa posibleng pahintulot o mapagparayang hamon, habang ang “mo” ay pinananatili ang isahang kausap ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw sa karaniwang mambabasa. Pinanatili ang pagbabago mula sa maramihang kausap sa unang sugnay (“ninyo”) tungo sa isahang kausap sa huling pandiwa (“mo”), gaya ng morpolohiya ng Hebreo. Inilagay ang [b] pagkatapos ng buong huling sugnay upang malinaw na saklaw nito ang alternatibong pagbasa sa pandiwa.
