base_translation:
  language: en
  yaml_path: translation/ot/job/021/032.yaml
  text: Yet he is carried to the grave[c][b][a], and over the mound one keeps watch.
translation:
  language: tl
  text: Gayunman, dinadala siya sa mga libingan[a], at sa ibabaw ng bunton[b] ay may nagbabantay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, maramihan ang “mga libingan”; maaaring sama-sama itong tumukoy sa pook na paglilibingan.
    reason: lexical_alternative
  - marker: b
    text: Ang “bunton” ay salin ng salitang Hebreo para sa isang tumpok o nakasalansang masa; dito, malamang na tumutukoy ito sa nakaumbok na lupa ng libingan.
    reason: cultural_note
  - marker: c
    text: O, “at binabantayan niya ang bunton,” kung ang nakalibing na lalaki ang ituturing na simuno ng pandiwa; hindi tahasang ipinakikilala sa Hebreo ang simuno.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: Gayunman, ... siya
  rationale: Maaaring simpleng “at” ang pang-ugnay, ngunit ipinahihiwatig ng konteksto ang pagsalungat sa naunang paglalarawan; pinananatili rin ang hayag na panghalip.
- source_word: לִקְבָרוֹת
  choice: sa mga libingan
  rationale: Maramihan ang anyong Hebreo. Pinananatili ng “mga libingan” ang bilang at maaari itong tumukoy nang sama-sama sa pook na paglilibingan.
- source_word: יוּבָל
  choice: dinadala
  rationale: Ang Hophal ng יבל ay nagsasaad na ang tao ay dinadala o inihahatid; sa konteksto ng libing, likas sa Tagalog ang “dinadala.”
- source_word: וְעַל
  choice: at sa ibabaw ng
  rationale: Tuwirang inilalarawan nito ang pagbabantay sa ibabaw o may kaugnayan sa bunton ng libingan.
- source_word: גָּדִישׁ
  choice: bunton
  rationale: Karaniwang nangangahulugan ang salita ng isang tumpok o bunton; sa kontekstong ito, malamang na tumutukoy ito sa nakaumbok na lupang tumatakip sa libingan.
- source_word: יִשְׁקֹד
  choice: may nagbabantay
  rationale: Nangangahulugan ang pandiwa na magbantay o manatiling mapagmatyag. Hindi tahasang tinutukoy sa Hebreo ang simuno, kaya hindi pinapangalanan ng salin kung sino ang nagbabantay.
