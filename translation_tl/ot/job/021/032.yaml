translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maramihang “mga libingan” at ang di-tiyak na simuno ng huling pandiwa, habang ginagamit ang likas na pariralang “may nagbabantay.”
