  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: Humarap kayo sa akin
  rationale: Ang maramihang pautos ng פנה kasama ng אֵלַי ay humihiling na ibaling ng mga kausap ang kanilang mukha o pansin kay Job. Likas at tuwiran sa modernong Filipino ang “Humarap kayo sa akin.”
- source_word: וְהָשַׁמּוּ
  choice: at masindak
  rationale: Ang anyo mula sa שׁמם ay nagpapahayag ng matinding pagkabigla o pagkasindak. Pinananatili ng “masindak” ang mabigat at negatibong puwersa ng salita nang hindi ito nililimitahan sa karaniwang pagtataka.
- source_word: וְשִׂימוּ יָד עַל־פֶּה
  choice: takpan ninyo ng kamay ang inyong bibig
  rationale: Ang שׂים ay “ilagay,” ngunit sa Filipino ang natural na paglalarawan sa kilos na ito ay “takpan ... ng kamay.” Ang isahang “kamay” sa Hebreo ay pinanatili, samantalang ang pagmamay-ari ng bibig ay malinaw na ipinahihiwatig ng maramihang pautos.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at tuwirang Filipino. Ginamit ang maramihang “kayo/ninyo/inyong” ayon sa mga pautos na maramihan sa Hebreo. Ang semicolon ay nagpapakita ng malapit na ugnayan ng pagkasindak at ng kasunod na kilos ng pagtahimik.
