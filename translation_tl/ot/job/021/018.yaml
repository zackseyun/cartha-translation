  text: May they be like straw before the wind[a], and like chaff that a storm carries away.
translation:
  language: tl
  text: Nawa’y maging tulad sila ng dayami sa harap ng hangin, at tulad ng ipa na tinatangay[a] ng bagyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inaagaw” o “tinatangay palayo.” Ang pandiwang Hebreo ay literal na may kahulugang “magnakaw” at poetikong inilalarawan ang biglaang pag-agaw o pag-alis.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Maging ... nawa sila
  rationale: Ipinahahayag nito ang jussive o hangaring diwa ng imperfect sa konteksto ng retorikal na pananalita ni Job, sa halip na gawing payak na pahayag o tuwirang utos.
- source_word: כְּתֶבֶן
  choice: tulad ng dayami
  rationale: Ang תבן ay karaniwang tuyong tangkay o dayami; ito ang pinakanatural at madaling maunawaang katumbas sa modernong Filipino.
- source_word: לִפְנֵי רוּחַ
  choice: sa harap ng hangin
  rationale: Pinananatili nito ang larawang Hebreo ng dayaming nakalantad sa puwersa ng hangin at itinataboy nito.
- source_word: וּכְמֹץ
  choice: at tulad ng ipa
  rationale: Ang מֹץ ay magaan na balat o labí ng butil na inihihiwalay sa paggiik; 'ipa' ang tiyak at likas na terminong Filipino.
- source_word: גְּנָבַתּוּ
  choice: tinatangay
  rationale: Bagaman literal na nagmumula sa pandiwang 'magnakaw,' sa makatang tambalan nito sa bagyo ay inilalarawan ang biglaan at sapilitang pag-agaw o pag-alis. Likas sa Filipino ang 'tinatangay,' habang pinananatili sa talababa ang literal na larawan.
- source_word: סוּפָה
  choice: bagyo
  rationale: Ang סוּפָה ay malakas na unos o bagyo. Malinaw at hindi labis na makitid ang 'bagyo' kumpara sa 'ipuipo.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang paralelismong patula at ang hangaring diwa sa 'Maging ... nawa,' nang hindi ginagawang tiyak na pahayag ang modal na puwersa ng Hebreo.
