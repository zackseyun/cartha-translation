source:
  edition: WLC
  text: מַדּ֣וּעַ רְשָׁעִ֣ים יִחְי֑וּ עָ֝תְק֗וּ גַּם גָּ֥בְרוּ חָֽיִל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/007.yaml
  text: Why do the wicked live on[a], grow old, and even become mighty in wealth?
translation:
  language: tl
  text: Bakit patuloy na nabubuhay ang masasama, tumatanda, at lalo pang nagiging makapangyarihan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lalo pang lumalakas” o “lalo pang yumayaman.” Ang salitang Hebreo ay maaaring tumukoy sa lakas, kapangyarihan, yaman, o mga kayamanan at mapagkukunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Tuwirang panandang pananong na nagpapanatili sa mariing pagtutol ni Job nang walang dagdag na paliwanag.
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Likas at karaniwang katawagan sa makabagong Tagalog para sa mga taong masama sa moral na diwa, hindi lamang sa legal na kahulugan.
- source_word: יִחְיוּ
  choice: patuloy na nabubuhay
  rationale: Ipinahahayag ng anyong Hebreo ang pagpapatuloy ng kanilang buhay; malinaw itong naihahatid ng “patuloy na nabubuhay.”
- source_word: עָתְקוּ
  choice: tumatanda
  rationale: Sa konteksto ng mahabang buhay at kasaganaan ng masasama, malamang na tumutukoy ito sa pagsulong sa katandaan. Pinananatili ng payak na anyong ito ang daloy ng tanong.
- source_word: גַּם
  choice: at lalo pang
  rationale: 'Ipinakikita ang mariing pag-igting ng sunuran: hindi lamang sila nabubuhay at tumatanda, kundi lalo pa silang nagkakaroon ng kapangyarihan.'
- source_word: גָּבְרוּ חָיִל
  choice: nagiging makapangyarihan
  rationale: Natural na Tagalog para sa paglakas o pag-angat nila sa lakas, kakayahan, yaman, o mga mapagkukunan. Inilalagay sa talababa ang malawak na saklaw ng חָיִל upang hindi isara ang tunay na leksikal na ambiguwidad.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang anyo ng retorikal na tanong at ang pag-igting ng tatlong kilos. Ang “masasama” ay mas natural sa karaniwang mambabasa kaysa sa mas legal na “mga nagkasala,” at ipinapaliwanag sa talababa ang maraming posibleng diwa ng חָיִל.
