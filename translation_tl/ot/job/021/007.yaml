  source_fidelity: 'Tapat ang salin sa retorikal na tanong at sa tatlong magkakasunod na pahayag: nagpapatuloy na mabuhay ang masasama, umaabot sila sa katandaan, at lalo silang nagiging makapangyarihan. Ang “patuloy na nabubuhay” ay angkop para sa יִחְיוּ, at ang “tumatanda” ay isang matibay na kontekstuwal na pagbasa ng עָתְקוּ. Ang pangunahing salin na “nagiging makapangyarihan” ay nasa saklaw ng גָּבְרוּ חָיִל; maayos na pinananatili ng talababa ang posibilidad na yaman o lakas ang tinutukoy.'
