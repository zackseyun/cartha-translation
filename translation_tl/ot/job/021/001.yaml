lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Ang qal na ענה sa pormulang nagpapakilala ng pananalita ay karaniwang nangangahulugang “sumagot” o “tumugon.” Ang “Sumagot” ay likas sa makabagong Tagalog at pinananatili ang diyalogong konteksto.
- source_word: אִיּוֹב
  choice: Job
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Bibliyang Tagalog.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Ang אמר ay karaniwang pandiwang nagpapakilala ng pananalita. Pinananatili ng “at sinabi” ang Hebreong pormula nang hindi ito ginagawang paraphrase.
- source_word: וַ
  choice: at
  rationale: Ang waw sa sunod-sunod na mga pandiwa ay nag-uugnay at nagpapatuloy sa salaysay. Sa pangungusap na “Sumagot si Job at sinabi,” likas na naipahihiwatig ng ayos ang kasunod na pangyayari, kaya hindi na kailangan ang hiwalay na “Pagkatapos.”
