translation:
  language: tl
  text: Tingnan ninyo, alam ko ang inyong mga iniisip at ang mga pakanang ginagamit ninyo upang gawan ako ng masama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at ang mga pakanang binabalak ninyo laban sa akin” o “at ang mararahas na balak ninyo laban sa akin.” Ang pandiwang Hebreo ay maaaring mangahulugang gumawa ng karahasan, mang-api, o gumawa ng masama sa iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Alam kong mabuti
  rationale: Ang הֵן ay nagbibigay-diin sa pahayag at tumatawag ng pansin. Sa modernong Tagalog, naipahahayag nang natural ang puwersang ito sa “alam kong mabuti” sa halip na sa mas literal ngunit hindi gaanong likas na “narito.”
- source_word: יָדַעְתִּי
  choice: alam ko
  rationale: Ang Qal perfect na unang panauhan ay tumutukoy rito sa kasalukuyang kaalaman ni Job; natural itong isalin sa pangkasalukuyang “alam ko.”
- source_word: מַחְשְׁבוֹתֵיכֶם
  choice: inyong mga iniisip
  rationale: Pinananatili nito ang malawak na kahulugan ng pangngalan—mga iniisip, balak, o layunin—nang hindi agad nililimitahan sa masamang pakana.
- source_word: וּמְזִמּוֹת
  choice: at ang mga pakana
  rationale: Sa konteksto, ang salita ay tumutukoy sa sinadya at mapaminsalang pagpaplano. Ang “pakana” ay malinaw at natural na katumbas sa modernong Tagalog.
- source_word: עָלַי
  choice: ako
  rationale: Ang adversatibong diwa ng “laban sa akin” ay naipaloob sa pariralang “gawan ako ng masama,” kaya hindi na kailangang ulitin ang pang-ukol.
- source_word: תַּחְמֹסוּ
  choice: upang gawan ako ng masama
  rationale: Ang pandiwa mula sa חמס ay maaaring mangahulugang gumawa ng karahasan, mang-api, o gumawa ng di-makatarungang pinsala. Ang saling ito ay natural at sapat na malawak upang hindi ipalagay na pisikal lamang ang pananakit.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “alam kong mabuti” upang natural na maipahayag ang pagbibigay-diin ng pambungad na הֵן, at “pakana” upang mapanatili ang hayagang mapaminsalang diwa ng ikalawang hati ng talata.
