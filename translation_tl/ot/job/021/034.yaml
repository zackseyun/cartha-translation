  yaml_path: translation/ot/job/021/034.yaml
  text: How then can you comfort me with emptiness[a], when your answers remain nothing but treachery?
translation:
  language: tl
  text: Kaya paano ninyo ako maaaliw sa kawalang-kabuluhan, gayong pagtataksil lamang ang nananatili sa mga sagot ninyo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Paano ninyo ako maaaliw nang walang saysay, gayong ang natitira sa mga sagot ninyo ay pagtataksil?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵיךְ
  choice: Kaya paano
  rationale: Ipinahahayag ng tanong ang retorikal na hamon ni Job, at dinadala ng “Kaya” ang nag-uugnay na puwersa ng waw sa konteksto.
- source_word: תְּנַחֲמוּנִי
  choice: ninyo ako maaaliw
  rationale: Ang Piel ng נחם na may hulaping unang panauhang isahan ay tumutukoy sa pag-aliw o pagbigay-ginhawa kay Job. Natural sa Filipino ang anyong potensiyal sa retorikal na tanong.
- source_word: הָבֶל
  choice: sa mga salitang walang kabuluhan
  rationale: Ang הבל ay nangangahulugang kawalang-laman, kabulaanan, o kawalang-kabuluhan. Idinagdag ang “mga salitang” bilang malinaw na ipinahihiwatig na nilalaman ng pag-aliw, nang hindi ito gawing simpleng kabiguan lamang ng pagsisikap.
- source_word: וּתְשׁוּבוֹתֵיכֶם
  choice: ang mga sagot ninyo
  rationale: Tuwiran at natural na katumbas ng תשובה sa konteksto ng mga tugon ng mga kaibigan ni Job.
- source_word: נִשְׁאַר
  choice: ay pawang
  rationale: Sa predikatibong pahayag, ipinahahayag nito na kapag nasuri ang kanilang mga sagot, ang natitira o makikita sa mga iyon ay pagtataksil. Ang “pawang” ay natural na naghahatid ng diwang “walang iba kundi.”
- source_word: מָעַל
  choice: pagtataksil
  rationale: Ang מעל ay tumutukoy sa kawalang-katapatan o paglabag sa tiwala. Mas napapanatili ng “pagtataksil” ang bigat ng paratang kaysa sa mas mahinang “panlilinlang.”
