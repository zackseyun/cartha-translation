base_translation:
  language: en
  yaml_path: translation/ot/job/021/016.yaml
  text: Look, is not their prosperity in their own hand? The counsel of the wicked is far from me.
translation:
  language: tl
  text: Tingnan ninyo, hindi nila hawak ang sarili nilang kasaganaan. Ang payo ng masasama ay malayo sa akin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Tingnan ninyo
  rationale: Isang likas at makabagong panawag-pansin sa Filipino na nagpapanatili sa diin ng Hebreong הֵן.
- source_word: בְיָדָם
  choice: nila hawak
  rationale: Pinananatili ang larawang ‘nasa kanilang kamay’ sa natural na idyomang Filipino tungkol sa kapangyarihan o kontrol.
- source_word: טוּבָם
  choice: ang sarili nilang kasaganaan
  rationale: Sa konteksto, tumutukoy ang ‘kanilang kabutihan’ sa mabuting kalagayan o pag-unlad ng masasama; ang ‘kasaganaan’ ang malinaw na katumbas nang hindi nililimitahan ito sa salapi lamang.
- source_word: עֲצַת רְשָׁעִים
  choice: Ang payo ng masasama
  rationale: Tuwirang pinananatili ang malawak na kahulugan ng עֵצָה bilang payo, panukala, o paraan ng pag-iisip, sa halip na paliitin agad bilang isang tiyak na ‘balak.’
- source_word: רָחֲקָה מֶנִּי
  choice: ay malayo sa akin
  rationale: Pinananatili ang Hebreong metapora ng paglayo, pati ang maaaring kahulugang pagtanggi ni Job sa pananaw o pamumuhay ng masasama.
theological_decisions:
- issue: Kung ang unang sugnay ay tanong o pahayag
  choice: 'Isinalin bilang mariing pahayag: ‘hindi nila hawak ang sarili nilang kasaganaan.’'
  alternative: 'Retorikal na tanong: ‘Hindi ba’t hindi nila hawak ang sarili nilang kasaganaan?’'
  rationale: Ang הֵן לֹא ay natural na mababasa bilang ‘tingnan, hindi’; ang pahayag ay nagpapanatili sa diwang ang kasaganaan ng masasama ay wala sa sarili nilang kontrol, nang hindi ipinapasok ang dagdag na interpretasyong wala sa anyong Hebreo.
- issue: Ugnayan ng ikalawang sugnay sa una
  choice: Walang idinagdag na ‘ngunit’ o ‘kaya.’
  alternative: ‘Ngunit malayo sa akin ang payo ng masasama.’
  rationale: Walang tahasang pang-ugnay sa Hebreo. Ang hindi pagdaragdag nito ay nagpapanatili sa maigting at bahagyang malabong lohikal na ugnayan ng dalawang pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Tingnan ninyo’ sa halip na arkaikong ‘Narito’ o ‘Masdan,’ at pinanatili ang maikli at mariing anyo ng talata.
