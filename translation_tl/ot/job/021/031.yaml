  text: Who declares his way to his face? And for what he has done[b][a], who repays him?
translation:
  language: tl
  text: Sino ang magsasabi sa kaniya nang harapan tungkol sa kaniyang pamumuhay? Sino ang gaganti sa kaniya dahil sa ginawa niya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maikli ang ikalawang tanong sa Hebreo: “At siya ay gumawa—sino ang gaganti sa kaniya?” Nililinaw ng salin ang malamang na diwa: “dahil sa ginawa niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Sino
  rationale: Pananong na panghalip ito sa dalawang retorikal na tanong. Hindi ginawang tahasang pagtanggi upang mapanatili ang anyo at diin ng Hebreo.
- source_word: יַגִּיד
  choice: magsasabi
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi o magpahayag. Natural sa modernong Tagalog ang “magsasabi” sa konteksto ng tuwirang pagsita.
- source_word: עַל פָּנָיו
  choice: sa kaniya nang harapan
  rationale: Literal na “sa ibabaw ng kaniyang mukha,” ngunit idyoma ito para sa tuwirang pagharap at pagsasalita sa presensiya ng tao.
- source_word: דַּרְכּוֹ
  choice: tungkol sa kaniyang ginawa
  rationale: Ang דֶּרֶךְ ay literal na “daan” at maaari ring tumukoy sa asal o pamumuhay. Sa Tagalog, ang “ginawa” ay malinaw at natural sa konteksto ng pananagutan, bagaman hindi nito pinananatili ang literal na metapora.
- source_word: וְהוּא עָשָׂה
  choice: dahil sa ginawa niya
  rationale: Maikli at eliptikal ang Hebreo, literal na “at siya ay gumawa.” Ginawang tahas ang malamang na ugnayan nito sa pagganti nang hindi dinaragdagan ang nilalaman.
- source_word: יְשַׁלֶּם לוֹ
  choice: gaganti sa kaniya
  rationale: Ang Piel ng שלם dito ay pagbabayad o pagganti ayon sa ginawa. Ang “gaganti” ay natural at nagpapanatili sa diwang retributibo.
theological_decisions:
- issue: Kung sino ang tinutukoy ng panlalaking panghalip
  choice: Pinanatili ang “kaniya/niya” nang hindi tinutukoy nang tahasan ang tao.
  alternative: Tukuyin siyang “masamang tao” batay sa konteksto.
  rationale: Panghalip lamang ang nasa talata; ang tahasang pagtukoy ay magpapaliit sa tunay na gramatikal na pagkakaugnay at posibleng tensiyon ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang dalawang retorikal na tanong at ang tuwirang-komprontasyonal na diwa ng עַל פָּנָיו. Isinalin nang di-literal ang דַּרְכּוֹ bilang “ginawa” para sa natural na daloy, habang ang elipsis sa ikalawang sugnay ay ipinaliwanag sa talababa.
