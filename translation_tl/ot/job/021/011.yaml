  yaml_path: translation/ot/job/021/011.yaml
  text: They send out their little ones like a flock[c][b][a], and their children dance.
translation:
  language: tl
  text: Pinalalabas nila ang kanilang maliliit na anak na parang isang kawan[a][b], at sumasayaw ang kanilang mga anak[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “parang mga tupa.” Ang Hebreong צֹאן ay maaaring tumukoy nang kolektibo sa mga tupa o sa maliliit na hayop na inaalagaan.
    reason: lexical_alternative
  - marker: b
    text: O “kanilang mga sanggol.” Tumutukoy ang salitang Hebreo sa napakabatang mga bata; ginamit ang “maliliit na anak” upang hindi ipahiwatig na mga bagong silang lamang sila.
    reason: lexical_alternative
  - marker: c
    text: O “nagluluksu-lukso” o “naglalundagan.” Nagpapahiwatig ang pandiwang Hebreo ng masigla at masayang paggalaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּחוּ
  choice: Pinalalabas nila
  rationale: Ang Piel ng שלח ay nangangahulugang ‘ipadala’ o ‘palabasin.’ Sa konteksto, natural na ipinahahayag ng ‘pinalalabas nila’ ang malayang paglabas ng mga bata nang hindi nagdaragdag ng di-tiyak na detalye.
- source_word: כַצֹּאן
  choice: na parang isang kawan
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na hayop na inaalagaan, lalo na sa mga tupa at kambing. Pinananatili ng ‘kawan’ ang kolektibong larawan at ang paghahambing na ipinahihiwatig ng כ.
- source_word: עֲוִילֵיהֶם
  choice: kanilang maliliit na anak
  rationale: Ang עויל ay tumutukoy sa napakabatang mga bata. Ang ‘maliliit na anak’ ay malinaw at natural sa modernong Tagalog, ngunit hindi ito naglilimita sa mga bagong silang lamang.
- source_word: יַלְדֵיהֶם
  choice: kanilang mga anak
  rationale: Malawak na tumutukoy ang ילד sa mga anak o supling. Ang ‘mga anak’ ang pinakanatural at angkop na katumbas sa paralelismo ng taludtod.
- source_word: יְרַקֵּדוּן
  choice: nagsasayawan
  rationale: Ang רקד ay naglalarawan ng masigla at masayang paggalaw, gaya ng pagsayaw, paglundag, o pagluksu-lukso. Ipinahahayag ng ‘nagsasayawan’ ang buhay at sama-samang kilos ng mga bata.
