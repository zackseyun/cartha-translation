source:
  edition: WLC
  text: יבלו בַ/טּ֣וֹב יְמֵי/הֶ֑ם וּ֝/בְ/רֶ֗גַע שְׁא֣וֹל יֵחָֽתּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/013.yaml
  text: They spend their days in prosperity[a], and in a moment they go down to Sheol.
translation:
  language: tl
  text: Ginugugol nila ang kanilang mga araw sa kasaganaan, at sa isang iglap ay bumababa sila sa Sheol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “libingan,” “daigdig ng mga patay,” o “kamatayan.” Ang salitang Hebreo ay Sheol.
    reason: lexical_alternative
lexical_decisions:
- source_word: יבלו
  choice: Ginugugol nila
  rationale: Ang Piel ng בלה ay tumutukoy rito sa pagdaan o pagkaubos ng kanilang mga araw. Likas sa modernong Tagalog ang “ginugugol nila” at napapanatili nito ang temporal na diwa.
- source_word: בַטּוֹב
  choice: sa kasaganaan
  rationale: Bagaman literal na “sa mabuti,” ipinahihiwatig ng konteksto ang maginhawa at maunlad na kalagayan ng masasama; malinaw itong naihahayag ng “sa kasaganaan.”
- source_word: יְמֵיהֶם
  choice: ang kanilang mga araw
  rationale: Tuwirang pinananatili ang Hebreong pananalitang tumutukoy sa kanilang buong panahon ng pamumuhay.
- source_word: וּבְרֶגַע
  choice: at sa isang iglap
  rationale: Ang רֶגַע ay isang napakaikling sandali. Ang “sa isang iglap” ay natural at mariing ipinakikita ang kaibahan sa maraming araw na ginugol sa kasaganaan.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Pinananatili ang katawagang Hebreo upang hindi paliitin ang saklaw nito tungo lamang sa libingan, kamatayan, o isang mas huling doktrinal na konsepto.
- source_word: יֵחָתּוּ
  choice: bumababa sila
  rationale: Sa pagkakaugnay nito sa Sheol, ang pandiwa ay tumutukoy sa pagbaba tungo sa dako ng mga patay. Natural ang “bumababa sila” at pinananatili ang larawang patungo sa ibaba.
theological_decisions:
- issue: Pagkakasalin ng שְׁאוֹל
  choice: Sheol
  alternative: libingan; daigdig ng mga patay; kamatayan
  rationale: Ang transliterasyon ay nagpapanatili sa malawak at bahagyang bukas na konseptong Hebreo tungkol sa hantungan ng mga patay, nang hindi ito ipinapantay agad sa “impiyerno” o nililimitahan sa pisikal na libingan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Inilagay ang talababa pagkatapos ng “Sheol,” ang salitang aktuwal na nililinaw nito.
