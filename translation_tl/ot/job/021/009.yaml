  text: Their houses are safe from fear[b][a], and the rod of God is not upon them.
translation:
  language: tl
  text: Ang kanilang mga tahanan ay ligtas sa pangamba[a], at ang pamalo ng Diyos[b] ay hindi sumasapit sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang kanilang mga sambahayan ay panatag at walang kinatatakutan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pamalo ng Diyos” ay talinghaga para sa paghampas, pagdidisiplina, o kapighatiang mula sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּתֵּיהֶם
  choice: kanilang mga tahanan
  rationale: Ang literal na diwa ay “kanilang mga bahay,” ngunit ang “mga tahanan” ay likas sa makabagong Filipino at maaari ring magpahiwatig sa sambahayan nang hindi inaalis ang konkretong larawan.
- source_word: שָׁלוֹם מִפָּחַד
  choice: ligtas sa pangamba
  rationale: Sa konteksto, ang שָׁלוֹם ay kalagayan ng katiwasayan, at ang מִפָּחַד ay pagkalayo o kalayaan mula sa pangamba. Ang parirala ay natural at malapit sa diwa ng Hebreo.
- source_word: שֵׁבֶט
  choice: pamalo
  rationale: Pinananatili ng “pamalo” ang larawang matalinghaga ng isang kasangkapang ginagamit sa paghampas o pagdidisiplina, nang hindi nililimitahan ang kahulugan sa parusa lamang.
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Karaniwang anyong patula ito para sa Diyos sa Job; walang batayan upang palawakin ito sa ibang titulo.
- source_word: עֲלֵיהֶם
  choice: sumasapit sa kanila
  rationale: Sa larawan ng pamalo ng Diyos, ang “sumasapit sa kanila” ay malinaw at natural sa Filipino para sa isang hampas o kapahamakang dumarating sa kanila, bagaman mas dinamiko kaysa sa literal na “nasa kanila.”
theological_decisions:
- issue: Likas ng pagkilos ng Diyos na ipinahihiwatig ng “pamalo ng Diyos”
  choice: Panatilihin ang talinghagang “pamalo ng Diyos” nang hindi tinutukoy kung ito ay parusa, pagdidisiplina, o pagpapahirap.
  alternative: parusa ng Diyos; pagdidisiplina ng Diyos; hagupit ng Diyos
  rationale: Malawak ang saklaw ng talinghagang Hebreo at maaaring tumukoy sa paghampas, pagtutuwid, o pagdadala ng kapighatian. Ang pagpapanatili sa “pamalo” ay hindi tahimik na lumulutas sa teolohikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tahanan” at “pangamba” upang mapanatili ang patulang tono; pinanatili ang konkretong talinghaga ng “pamalo ng Diyos.”
