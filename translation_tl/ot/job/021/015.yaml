translation:
  language: tl
  text: “Ano ba ang Makapangyarihan sa Lahat, para paglingkuran namin siya? At ano ang mapapala[a] namin kung magsusumamo kami sa kanya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At ano ang pakinabang namin kung magsusumamo kami sa kanya?”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה שַׁדַּי
  choice: Ano ba ang Makapangyarihan sa Lahat
  rationale: Ang מַה ay nagpapakilala ng mapanghamak na retorikal na tanong tungkol sa halaga o kabuluhan, hindi lamang sa pagkakakilanlan. Ipinahihiwatig ng “ba” ang tonong iyon, at isinasalin ang titulong שַׁדַּי sa malinaw na modernong Filipino.
- source_word: כִּי נַעַבְדֶנּוּ
  choice: para paglingkuran namin siya
  rationale: Dito, ang כִּי ay likas na naipapahayag bilang ugnayang layon o bunga. Ang עבד kapag Diyos ang layon ay tumutukoy sa paglilingkod at katapatan, na mas malawak kaysa rituwal na pagsamba lamang.
- source_word: וּמַה נּוֹעִיל
  choice: At ano ang mapapala namin
  rationale: Ang יעל ay nangangahulugang makinabang o magkaroon ng pakinabang. Ang “mapapala” ay natural sa Filipino at malinaw na naghahayag ng makasariling pagtaya sa pakinabang.
- source_word: כִּי נִפְגַּע בּוֹ
  choice: kung magsusumamo kami sa kanya
  rationale: Ang פגע na may בְּ ay maaaring mangahulugang taimtim na humiling o dumulog. Pinananatili ng “magsusumamo” ang diwa ng pananalangin at pakiusap nang hindi ito nililimitahan sa teknikal na pamamagitan.
theological_decisions:
- issue: Pagsasalin sa titulong שַׁדַּי
  choice: ang Makapangyarihan sa Lahat
  alternative: Shaddai
  rationale: Isinalin bilang titulo upang maunawaan agad ng karaniwang mambabasa ang diwa nito, sa halip na itransliterasyon na parang personal na pangalan.
- issue: Saklaw ng עבד kaugnay ng Diyos
  choice: paglingkuran
  alternative: sambahin
  rationale: Pinananatili ng “paglingkuran” ang mas malawak na saklaw ng paglilingkod at pagkilala sa kapangyarihan ng Diyos; ang “sambahin” ay maaaring magpaliit sa kahulugan tungo lamang sa gawaing panrelihiyon.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ang “Ano ba” ay nagpapanatili sa mapanghamak na lakas ng retorikal na tanong ng masasama, samantalang ang “magsusumamo” ay angkop sa konteksto ng taimtim na paglapit sa Diyos.
