  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pag-uulit at bahagyang siksik na pagkakasunod-sunod ng Hebreo upang hindi mawala ang magkahiwalay na diin ng “sa harap nila” at “kasama nila.”
