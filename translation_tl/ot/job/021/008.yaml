  yaml_path: translation/ot/job/021/008.yaml
  text: Their offspring are established before them[a], with them, and their descendants before their eyes.
translation:
  language: tl
  text: Ang kanilang mga supling ay matatag sa harap nila at kapiling nila, at ang kanilang mga inapo ay nasa harap ng kanilang mga mata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זַרְעָם
  choice: kanilang mga supling
  rationale: Ang זֶרַע ay maaaring tumukoy sa binhi, supling, o angkan. Sa konteksto ng kaunlaran ng pamilya, ang “mga supling” ay natural at hindi nililimitahan sa maliliit na anak lamang.
- source_word: נָכוֹן
  choice: matatag
  rationale: Ang anyong ito ay nagsasaad ng kalagayang matibay, nakatatag, o tiwasay. Pinananatili ng “matatag” ang statibong diwa nang hindi labis na binibigyang-kahulugan ang uri ng kanilang katiwasayan.
- source_word: לִפְנֵיהֶם
  choice: sa harap nila
  rationale: Tuwirang inililipat nito ang larawang Hebreo at ipinahihiwatig na nakikita nilang nananatili at umuunlad ang kanilang mga supling.
- source_word: עִמָּם
  choice: kasama nila
  rationale: Karaniwang kahulugan ng עִם ang “kasama.” Mahalaga itong panatilihin sapagkat idiniriin na ang mga supling ay hindi lamang nakikita kundi kapiling din nila.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: at ang kanilang mga inapo
  rationale: Ang צֶאֱצָאִים ay tumutukoy sa mga inapo o salinlahi. Nililinaw ng “mga inapo” ang ikalawang terminong pampamilya habang pinananatili ang paralelismo.
- source_word: לְעֵינֵיהֶם
  choice: nasa harap ng kanilang mga mata
  rationale: Pinananatili nito ang matingkad na idyomang Hebreo para sa tuwirang pagkakita at ang paralelismo sa “sa harap nila.”
