translation:
  language: tl
  text: Ang kanyang toro ay nakapagpapalahi at hindi pumapalya[a]; ang kanyang baka ay nanganganak at hindi nakukunan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “at hindi nagtataboy” / “at hindi nagiging sanhi ng pagkabaog.” Mahirap tiyakin ang kahulugan ng pandiwang Hebreo rito; ipinapahayag ng pangunahing teksto ang diwang hinihingi ng paralelismo: matagumpay at hindi walang-bunga ang pagpapalahi ng toro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרוֹ
  choice: kanyang toro
  rationale: Tumutukoy ang שׁוֹר sa bakang lalaki; sa konteksto ng pagpaparami, mas tiyak ang “toro” kaysa sa pangkalahatang “baka” o “barakong baka.”
- source_word: עִבַּר
  choice: nagpapalahi
  rationale: Sa kontekstong ito ng pagpaparami ng hayop, ipinahihiwatig ng pandiwa ang matagumpay na pagpapabuntis ng torong ginagamit sa pagpapalahi. Likas at malinaw sa modernong Filipino ang “nagpapalahi.”
- source_word: וְלֹא יַגְעִל
  choice: at hindi nabibigo
  rationale: Mahirap at di-tiyak ang tiyak na diwa ng יַגְעִל dito. Sa paralelismo, malinaw na hindi nauuwi sa wala ang pagpapalahi; pinananatili ng “hindi nabibigo” ang pangkalahatang resulta nang hindi ipinipilit ang isang teknikal na kahulugan.
- source_word: תְּפַלֵּט
  choice: nanganganak
  rationale: Ang Piel ng פלט ay tumutukoy rito sa paglalabas o pagsisilang ng supling. Ang “nanganganak” ang pinakanatural na salin sa Filipino para sa baka.
- source_word: פָּרָתוֹ
  choice: kanyang baka
  rationale: Ang פָּרָה ay babaeng baka. Hindi hinihingi ng teksto ang mas tiyak na kahulugang “dumalaga.”
- source_word: וְלֹא תְשַׁכֵּל
  choice: at hindi nakukunan
  rationale: Sa konteksto ng panganganak, ang שׁכל ay nagpapahayag ng pagkawala o pagkait ng supling. Ang “hindi nakukunan” ay maikli at likas na Filipino para sa hindi pagkalaglag ng dinadalang anak.
