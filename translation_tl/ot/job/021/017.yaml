    issue: Hindi minarkahang patanong ang ikalawang sugnay.
    rationale: Ang וְיָבֹא עָלֵימוֹ אֵידָם ay bahagi ng magkakaugnay na retorikal na mga tanong. Ang “dumarating” na walang “ba” ay nagmumukhang payak na pahayag sa Filipino.
  - severity: medium
    issue: Ang “mga dalamhati” ay hindi ang pinakatumpak na pangunahing salin ng חֲבָלִים.
    rationale: Karaniwang tumutukoy ang “dalamhati” sa matinding lungkot o pagdadalamhati, samantalang ang Hebreo rito ay mas malapit sa mga kirot, pasakit, o hapdi; ang huling kahulugan ay nananatiling nasa talababa.
  - severity: low
    issue: Ang talababa c ay nakadikit sa dulo ng pangungusap kaysa sa salitang nililinaw.
    rationale: Mas malinaw ang footnote anchor kapag kasunod mismo ng “mga pasakit.”
