base_translation:
  language: en
  yaml_path: translation/ot/job/021/017.yaml
  text: How often is the lamp of the wicked put out[c][b][a], and does their disaster come upon them? Does he apportion sorrows in his anger?
translation:
  language: tl
  text: Gaano kadalas namamatay ang ilawan ng masasama[b][a], at sumasapit ba sa kanila ang kanilang kapahamakan? Namamahagi ba siya ng mga pasakit[c] sa kanyang galit?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ilang ulit namamatay ang ilawan ng masasama?” Retorikal ang tanong sa Hebreo at hinahamon nito ang palagay na palagi silang hinahatulan sa ganitong paraan.
    reason: lexical_alternative
  - marker: b
    text: Ang “ilawan” ay larawan ng buhay, kasaganaan, o nagpapatuloy na mabuting kalagayan ng isang tao.
    reason: cultural_note
  - marker: c
    text: Ang “mga pasakit” ay maaari ring isaling “mga kirot” o “mga hapdi ng panganganak.” Maraming magkakaugnay na kahulugan ang salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Gaano kadalas
  rationale: 'Sa konteksto, ang tanong ay tungkol sa dalas at may puwersang retorikal: hinahamon ni Job ang palagay na palaging agad na hinahatulan ang masasama.'
- source_word: נֵר
  choice: ilawan
  rationale: Pinananatili ang kongkretong larawang Hebreo; sa panitikang karunungan, maaari itong sumagisag sa buhay, kasaganaan, o nagpapatuloy na mabuting kalagayan.
- source_word: רְשָׁעִים
  choice: ng masasama
  rationale: Likas at malinaw na salin ng pangmaramihang substantibong tumutukoy sa masasamang tao.
- source_word: יִדְעָךְ
  choice: namamatay
  rationale: Karaniwang Filipino ang 'namamatay ang ilawan' para sa pagkapawi ng apoy o liwanag, habang pinananatili ang metapora.
- source_word: וְיָבֹא עָלֵימוֹ אֵידָם
  choice: at dumarating sa kanila ang kanilang kapahamakan
  rationale: Ang אֵיד ay kapahamakan o kalamidad; pinananatili ng parirala ang larawan ng kapahamakang sumasapit sa kanila.
- source_word: חֲבָלִים
  choice: mga dalamhati
  rationale: Malawak at marangal na salin para sa mga hirap, kirot, o hapding maaaring ipahiwatig ng pangngalan; inilalahad sa talababa ang tunay na lawak ng salita.
- source_word: יְחַלֵּק
  choice: namamahagi
  rationale: Tumutugma sa Piel na kahulugang naghahati, namamahagi, o naglalaan; natural ito sa modernong Filipino.
- source_word: בְּאַפּוֹ
  choice: sa kanyang galit
  rationale: Direktang inililipat ang idyomang tumutukoy sa galit. Ang panghalip ay pinananatili sa halip na tahasang idagdag ang 'Diyos.'
theological_decisions:
- issue: Tinutukoy ng ikatlong panauhang isahan sa יְחַלֵּק בְּאַפּוֹ
  choice: Pinanatili bilang 'siya' at hindi tahasang pinalitan ng 'Diyos.'
  alternative: Tahasan itong isaling 'Namamahagi ba ang Diyos...' o unawain nang impersonal.
  rationale: Malakas na ipinahihiwatig ng konteksto na Diyos ang tinutukoy, ngunit hindi siya pinangalanan sa Hebreong sugnay. Pinananatili ng salin ang di-tahasang anyo ng pinagmulan.
- issue: Puwersang retorikal ng כַּמָּה
  choice: Isinaling 'Gaano kadalas' bilang tunay na tanong na may retorikal na hamon.
  alternative: Isaling 'Gaano karaming ulit' o tahasang 'Kay dalang.'
  rationale: Hindi dapat tahasang gawing 'kay dalang' sapagkat magiging interpretatibong paglutas iyon; ang anyong tanong ay nagpapanatili sa tensiyon ng argumento ni Job.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang poetikong larawan ng ilawan at ang magkakasunod na retorikal na tanong. Ginamit ang 'kapahamakan' at 'dalamhati' bilang pormal ngunit karaniwang bokabularyo; iniwasan ang arkaikong ayos at ang tahasang pagdagdag ng Diyos bilang paksa.
