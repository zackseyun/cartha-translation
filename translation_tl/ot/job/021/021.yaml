base_translation:
  language: en
  yaml_path: translation/ot/job/021/021.yaml
  text: For what does he care about his house after him[c][b][a], when the number of his months is cut off?
translation:
  language: tl
  text: Sapagkat ano ang pakialam niya[a] sa kanyang bahay[b] kapag wala na siya at naputol[c] ang bilang ng kanyang mga buwan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ano ang kasiyahan niya sa kanyang bahay.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay” ay maaari ring mangahulugang “sambahayan” o “pamilya.”
    reason: lexical_alternative
  - marker: c
    text: O “itinakda ang bilang ng kanyang mga buwan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o paliwanag na kaugnay ng naunang argumento.
- source_word: מַה חֶפְצוֹ
  choice: ano pa ang pakialam niya
  rationale: Ang חֵפֶץ ay maaaring tumukoy sa kasiyahan, pagnanais, o malasakit. Sa retorikal na tanong, likas na ipinahahayag ng “ano pa ang pakialam niya” ang kawalan ng magiging malasakit.
- source_word: בְּבֵיתוֹ
  choice: sa kanyang bahay
  rationale: Pinananatili ang kongkretong larawang “bahay,” bagaman maaari rin itong tumukoy sa sambahayan o pamilya.
- source_word: אַחֲרָיו
  choice: kapag wala na siya
  rationale: Likas na Filipino para sa “pagkatapos niya” sa konteksto ng kamatayan, nang hindi tahasang dinaragdagan ang teksto ng salitang “namatay.”
- source_word: וּמִסְפַּר חֳדָשָׁיו
  choice: kapag ... ang bilang ng kanyang mga buwan
  rationale: Ginawang temporal ang ugnayan ng sugnay upang maging malinaw at natural, habang pinananatili ang tiyak na larawang “mga buwan” bilang haba ng buhay.
- source_word: חֻצָּצוּ
  choice: naputol na
  rationale: Ang pasibong anyo ay maaaring mangahulugang pinutol o tinakdaan. Ang “naputol” ay angkop sa konteksto ng pagtatapos ng buhay, habang inilalagay sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Kung ang haba ng buhay ay “naputol” o “itinakda/ibinahagi”
  choice: naputol na
  alternative: itinakda o ibinahagi
  rationale: Mas umaangkop ang “naputol” sa retorikal na punto tungkol sa wakas ng buhay, ngunit hindi inaalis ang posibleng diwa na ang mga buwan ay itinakda o ibinahagi.
translation_notes:
  register: Makabago at dignidad na Filipino; ginagamit ang karaniwang “pakialam” upang maipahayag nang malinaw ang lakas ng retorikal na tanong. Pinananatili ang “bahay” at “mga buwan” bilang mahahalagang konkretong larawan ng Hebreo.
