  text: while another dies with a bitter soul and has not enjoyed good[a].
translation:
  language: tl
  text: Samantalang ang isa ay namamatay na may mapait na kalooban at hindi nakaranas ng mabuti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at ang isang ito ay namamatay na may mapait na kalooban at hindi nakatikim ng mabuti”; pinananatili ng Hebreo ang larawan ng pagkain bilang pagdanas o pagtatamasa ng kabutihan sa buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה
  choice: Samantalang ang isa
  rationale: Sa konteksto, ipinakikita ng parirala ang kaibahan ng taong ito sa taong inilarawan sa naunang talata. Mas natural ito sa Tagalog kaysa sa literal na “at ang isang ito,” habang pinananatili ang paghahambing.
- source_word: יָמוּת
  choice: namamatay
  rationale: Ang imperpektibo ay naglalarawan dito ng isang pangkalahatang kalagayan, hindi lamang ng isang tiyak na pangyayari sa hinaharap.
- source_word: בְּ/נֶפֶשׁ מָרָה
  choice: na may mapait na kalooban
  rationale: Ang נֶפֶשׁ ay tumutukoy rito sa panloob na kalagayan ng tao. Ang “mapait na kalooban” ay natural at marangal na idyomang Tagalog na nagpapanatili sa diwa ng kapaitan.
- source_word: וְ/לֹא אָכַל
  choice: at hindi nakaranas
  rationale: Literal na “at hindi kumain,” ngunit ang pagkain ay talinghaga para sa pakikibahagi o pagtatamasa. Ang “nakaranas” ay malinaw sa pangunahing teksto, habang inilalahad sa talababa ang konkretong larawan ng Hebreo.
- source_word: בַּ/טּוֹבָה
  choice: ng mabuti
  rationale: Pinananatili ng “mabuti” ang malawak na saklaw ng Hebreo—kabutihan, kaginhawahan, o kasaganaan—nang hindi ito nililimitahan sa materyal na pag-unlad.
