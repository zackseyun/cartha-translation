  yaml_path: translation/ot/job/021/030.yaml
  text: For the evil man is spared for the day of disaster[b][a]; they are led away for the day of wrath.
translation:
  language: tl
  text: Sapagkat ang masamang tao ay inilalaan para sa araw ng kapahamakan[a]; dinadala sila sa araw ng matinding galit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inililigtas,” “pinipigilan,” o “iniingatan ang masamang tao para sa araw ng kapahamakan.” Saklaw ng pandiwang Hebreo ang mga diwang ito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “inilalabas sila para sa araw ng matinding galit.” Ang huling pandiwa ay maaaring mangahulugang dinadala, inaakay, o inilalabas tungo sa araw na iyon.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang pahayag at pinananatili ang ugnayang pangangatwiran.
- source_word: לְיוֹם אֵיד
  choice: para sa araw ng kapahamakan
  rationale: Ang לְ na kasama ng “araw” ay tumutukoy sa isang panahong darating, at ang אֵיד ay kapahamakan, sakuna, o pagkawasak.
- source_word: יֵחָשֶׂךְ
  choice: iniingatan
  rationale: Ang Niphal ng חשׂך ay maaaring mangahulugang inililigtas, pinipigilan, o inilalaan. Ang “iniingatan para sa” ay nagpapanatili sa diwang hindi muna hinahatulan at maaaring inilalaan para sa darating na araw, nang hindi lubusang nilulutas ang leksikal na kalabuan.
- source_word: רָע
  choice: ang taong masama
  rationale: Pangngalang gamit ng pang-isahang pang-uri na tumutukoy sa isang masamang tao; natural at malinaw ito sa modernong Filipino.
- source_word: לְיוֹם עֲבָרוֹת
  choice: patungo sa araw ng matinding galit
  rationale: Ang pangmaramihang עֲבָרוֹת ay nagpapahiwatig ng matindi o umaapaw na galit; natural na naihahayag sa Filipino bilang “matinding galit.”
- source_word: יוּבָלוּ
  choice: dinadala sila
  rationale: Ang Hophil ng יבל ay nangangahulugang dinadala, inaakay, o inilalabas. Pinananatili ng “sila” ang biglang paglipat ng Hebreo mula pang-isahan tungo sa pangmaramihan.
theological_decisions:
- issue: Kaugnayan ng talata sa darating na paghuhukom
  choice: Ang masama ay hindi agad hinahatulan kundi iniingatan o inilalaan para sa darating na araw ng kapahamakan at galit.
  alternative: Ang masama ay lubusang inilalayo upang hindi maranasan ang araw ng kapahamakan, o agad na inilalabas upang harapin iyon.
  rationale: Ang magkatulad na pariralang may לְיוֹם at ang mga pandiwang “iniingatan” at “dinadala” ay maaaring magpahiwatig ng paglalaan para sa hinaharap. Gayunman, pinananatili sa talababa ang saklaw ng pandiwa upang hindi gawing tiyak ang isang tunay na malabong detalye.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “taong masama” sa halip na mas makalumang “masamang tao” bilang substantibong paglalarawan, at pinanatili ang paglipat mula pang-isahan tungo sa pangmaramihan. Hindi tinukoy kung kaninong galit ang tinutukoy sapagkat hindi iyon tahasang sinasabi sa Hebreo.
