  yaml_path: translation/ot/job/021/004.yaml
  text: As for me, is my complaint against man? If not, why should my spirit not be impatient?
translation:
  language: tl
  text: Sa tao ba nakatuon ang hinaing ko? Kung hindi, bakit hindi ako maiinip?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂיחִי
  choice: dumaraing
  rationale: Sa konteksto ng tugon ni Job, tumutukoy ito sa kanyang daing o hinaing; ginawang pandiwa upang maging natural at mapanatili ang diwa ng retorikal na tanong.
- source_word: לְאָדָם
  choice: sa tao
  rationale: Pinananatili ang payak at malawak na kahulugan ng אָדָם bilang tao o sangkatauhan, nang hindi nililimitahan sa mga kausap ni Job.
- source_word: תִקְצַר רוּחִי
  choice: ako maiinip
  rationale: Ang idyomang literal na 'umikli ang aking espiritu' ay nagpapahiwatig ng pagkawala ng pagtitiis; ang 'ako maiinip' ay natural sa Tagalog at akma sa retorikal na tanong.
theological_decisions:
- issue: Kung kanino nakatuon ang daing ni Job
  choice: Pinanatili bilang tanong kung ang daing niya ay 'sa tao.'
  alternative: Gawing tahasang 'sa Diyos' ang kanyang daing.
  rationale: Hindi tahasang binabanggit ng Hebreo ang Diyos sa talata; hindi idinagdag ang ipinahihiwatig upang mapanatili ang retorikal na puwang at tensiyon.
- issue: Ugnayan ng ikalawang tanong sa una
  choice: Isinalin ang וְאִם bilang 'Kung hindi.'
  alternative: At bakit
  rationale: Ang kondisyunal na pagbasa ay suportado ng anyong Hebreo at malinaw na inuugnay ang ikalawang tanong sa inaasahang negatibong sagot sa una.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, natural, at marangal. Ginamit ang kontraksiyong “ba’y” para sa maayos na daloy, at iniwasan ang mas teknikal o lipas na salitang “espiritu” sa idyomang tumutukoy sa pagkainip.
