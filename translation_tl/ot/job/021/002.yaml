  text: Listen carefully to my words[a], and let this be your consolation.
translation:
  language: tl
  text: Pakinggan ninyong mabuti ang aking salita, at ito nawa ang maging kaaliwan ninyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga kaaliwan ninyo”; maramihan ang pangngalang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Pakinggan ninyong mabuti
  rationale: Ang pautos na maramihan na sinundan ng infinitive absolute ng parehong ugat ay nagbibigay-diin sa masinsing pakikinig. Likas sa modernong Tagalog ang paggamit ng “mabuti” upang ihayag ang diin.
- source_word: מִלָּתִי
  choice: ang aking mga salita
  rationale: Bagaman pang-isahan ang anyong Hebreo, natural sa Tagalog ang maramihang “mga salita” para sa sinasabi o pahayag ni Job, nang hindi ginagawang teknikal ang “salita.”
- source_word: וּתְהִי
  choice: at ... nawa ang maging
  rationale: Ang anyong jussive ay nagpapahayag ng kahilingan o hangarin; malinaw at marangal itong naihahayag ng “nawa.”
- source_word: זֹאת
  choice: ito
  rationale: Pinananatili ng payak na panghalip ang maikling anyo at posibleng pagtukoy nito sa kanilang pakikinig o sa pahayag ni Job.
- source_word: תַּנְחֻמוֹתֵיכֶם
  choice: kaaliwan ninyo
  rationale: Ang abstraktong “kaaliwan” ay natural na katumbas sa Tagalog, samantalang ipinapaliwanag sa talababa na maramihan ang literal na anyong Hebreo.
theological_decisions:
- issue: Posibleng mapait o ironikong diwa ng “kaaliwan ninyo”
  choice: Hindi tahasang minarkahan ang ironya sa salin.
  alternative: “ito na lamang ang maipang-aliw ninyo sa akin”
  rationale: Maaaring tumukoy ang parirala sa pakikinig bilang tanging kaaliwang maibibigay ng mga kaibigan kay Job, ngunit hindi tahasang sinasabi sa Hebreo ang “sa akin” o “na lamang.” Pinananatili ng salin ang tensiyon at pagiging pahiwatig nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, tuwiran, at marangal. Ginamit ang “ninyo” dahil maramihan ang kausap, at iniwasang dagdagan ng “sa akin” upang mapanatili ang pagiging siksik at bahagyang malabo ng Hebreo.
