  text: His pails are full of milk[a], and the marrow of his bones is well-watered.
translation:
  language: tl
  text: 'Punô ng gatas ang kaniyang mga sisidlan[a],

    at nadidiligan ang utak sa kaniyang mga buto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Punô ng gatas ang kaniyang mga suso ng hayop.” Bihira ang salitang Hebreo at maaaring tumukoy sa mga suso ng hayop o sa mga sisidlan ng gatas.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטִינָיו
  choice: ang kaniyang mga sisidlan
  rationale: Bihira at pinagtatalunan ang pangngalan. Maaaring tumukoy ito sa mga sisidlan ng gatas o sa mga suso ng hayop; pinili ang pangkalahatang “mga sisidlan” sa teksto upang maging natural ngunit hindi lubusang isara ang larawan, at inilagay sa talababa ang pangunahing alternatibo.
- source_word: מָלְאוּ
  choice: punô
  rationale: Ipinahihiwatig ng pandiwa ang kalagayan ng kasaganaan; ang “punô” ay maikli at likas sa tulang Tagalog.
- source_word: חָלָב
  choice: gatas
  rationale: Tuwirang kahulugan ng salita at larawan ng kasaganaan.
- source_word: וּמֹחַ עַצְמוֹתָיו
  choice: at ... ang utak ng kaniyang mga buto
  rationale: Pinananatili ang kongkretong Hebreong larawan ng marrow sa loob ng mga buto. Ang “utak ng buto” ang karaniwang katawagang Filipino.
- source_word: יְשֻׁקֶּה
  choice: sagana sa halumigmig
  rationale: Ang Pual ay nagsasaad na ito ay nadidiligan o puspos ng halumigmig. Iniiwasan ng salin ang di-likas na literal na “dinidiligan” para sa utak ng buto habang pinananatili ang larawan ng malusog at masaganang kalagayan.
