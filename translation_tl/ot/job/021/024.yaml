translation_notes:
  register: Makabago at marangal na Tagalog na nagpapanatili sa paralelismo at kongkretong larawang patula. Ginamit ang “kaniyang” para sa pormal na tekstong biblikal at “utak ng ... mga buto” bilang madaling maunawaang katawagan sa marrow.
