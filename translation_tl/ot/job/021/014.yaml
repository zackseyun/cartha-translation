  text: Yet they say to God[a], ‘Depart from us, and we do not desire the knowledge of your ways.’
translation:
  language: tl
  text: Ngunit sinasabi nila sa Diyos, “Lumayo ka sa amin[a]; ayaw naming malaman ang iyong mga daan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Umalis ka sa amin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ngunit sinasabi nila
  rationale: 'Ang waw na nag-uugnay sa salaysay ay maaaring magkaroon dito ng panalungat na diwa ayon sa konteksto: umuunlad ang masasama, ngunit ganito ang sinasabi nila. Ang kasalukuyang panahunan ay likas sa Filipino para sa kanilang palagiang saloobin.'
- source_word: לָאֵל
  choice: sa Diyos
  rationale: Ang אֵל dito ay karaniwang katawagan sa Diyos, hindi pangalang pantangi.
- source_word: סוּר מִמֶּנּוּ
  choice: Lumayo ka sa amin
  rationale: Ang pautos na סוּר ay nangangahulugang lumihis, lumayo, o umalis. Pinananatili ng salin ang tuwirang utos sa Diyos at ang bigat ng kanilang pagtanggi.
- source_word: וְדַעַת
  choice: ayaw naming malaman
  rationale: Sa halip na di-likas na nominal na pariralang 'kaalaman sa,' ipinahahayag sa natural na Filipino ang pag-ayaw nilang makilala o malaman ang mga daan ng Diyos. Ang וְ ay pinananatili sa ugnayan ng magkatabing sugnay sa pamamagitan ng tuldok-kuwit, nang hindi ginagawang tahasang sanhi ang maaaring simpleng pagdurugtong.
- source_word: דְּרָכֶיךָ
  choice: ang iyong mga daan
  rationale: Ang דֶּרֶךְ sa maramihan ay tumutukoy sa mga paraan ng pagkilos o pamumuhay na itinuro ng Diyos. Ang 'mga daan' ay natural at pinananatili ang talinghaga ng Hebreo.
- source_word: לֹא חָפָצְנוּ
  choice: ayaw naming
  rationale: Ang חפץ ay nagpapahayag ng pagnanais o pagkagusto. Ang 'ayaw naming' ay malinaw na naghahatid ng kusang pagtanggi at angkop sa infinitibong 'malaman.'
theological_decisions:
- issue: Tuwirang pananalita ng masasama sa Diyos
  choice: “Lumayo ka sa amin”
  alternative: “Pabayaan mo kami”
  rationale: Tuwirang utos ang nasa Hebreo. Hindi ito pinalalambot bilang kahilingang pabayaan lamang sila, kaya nananatili ang nakakagimbal na tahasang pagtanggi nila sa Diyos.
- issue: Ugnayan ng dalawang sugnay
  choice: Tuldok-kuwit na nagpapanatili sa magkatabing pahayag
  alternative: “sapagkat ayaw naming malaman”
  rationale: Ang Hebreong וְ ay maaaring simpleng magdugtong ng mga sugnay; hindi tahasang minamarkahan ng teksto ang ikalawa bilang sanhi. Pinananatili ng salin ang posibleng ugnayan nang hindi ito nilulutas nang labis.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ang 'Lumayo ka' ay tuwiran ngunit hindi kolokyal; ang 'mga daan' ay nagpapanatili sa mahalagang talinghaga ng pinagmulang teksto.
