  text: Together they lie down in the dust[a], and worms cover them.
translation:
  language: tl
  text: 'Kapwa sila hihimlay sa alabok,

    at tatakpan sila ng mga uod.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga uod ng langaw” (maggot). Ang Hebreong רִמָּה ay maaaring tumukoy sa mga uod o maggot sa konteksto ng pagkabulok ng katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: Kapwa
  rationale: Ipinahihiwatig ng pang-abay ang iisang sasapiting wakas ng dalawang taong pinaghahambing sa konteksto. Mas likas sa Filipino ang “kapwa sila” kaysa “magkasama sila,” na maaaring magpahiwatig na sabay o nasa iisang libingan sila.
- source_word: עַל עָפָר
  choice: sa alabok
  rationale: Bagaman karaniwang nangangahulugang “sa ibabaw ng,” ang pariralang ito kasama ng paghiga sa konteksto ng kamatayan ay likas na isinasalin na “sa alabok,” nang hindi tahasang dinaragdagan ng “libingan.”
- source_word: יִשְׁכָּבוּ
  choice: hihimlay
  rationale: Pinananatili nito ang larawan ng paghiga sa kamatayan at ang aspektong tumutukoy sa sasapiting wakas. Ang “hihimlay” ay dignified at karaniwang nauunawaan, ngunit hindi kasing-interpretatibo ng “mamamahinga.”
- source_word: רִמָּה
  choice: mga uod
  rationale: Ang pangngalan ay maaaring tumukoy sa uod o maggot sa konteksto ng pagkabulok. Ang “mga uod” ang mas malawak at likas na kolektibong katawagan sa Filipino; inilalahad sa talababa ang mas tiyak na posibilidad.
- source_word: תְּכַסֶּה
  choice: tatakpan
  rationale: Pinananatili ng pandiwa ang matingkad na larawan ng mga uod na tumatakip sa mga patay. Ginamit ang anyong panghinaharap upang umayon sa “hihimlay” at sa inilalarawang sasapiting wakas.
- source_word: עֲלֵיהֶם
  choice: sila
  rationale: Likas na isinasama sa pandiwang Filipino na “tatakpan sila” ang diwa ng Hebreong pang-ukol na nangangahulugang pagtakip sa ibabaw nila.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kapwa” upang idiin ang magkatulad na hantungan nang hindi ipinahihiwatig na literal silang magkasabay o magkatabi, at “hihimlay” upang mapanatili ang konkretong larawan ng paghiga sa kamatayan.
