base_translation:
  language: en
  yaml_path: translation/ot/job/021/033.yaml
  text: The clods of the valley are sweet to him[a]; all mankind follows after him[c][b], and those before him are without number.
translation:
  language: tl
  text: Matamis sa kaniya ang mga tipak ng lupa sa libis[a]; sumusunod sa kaniya ang buong sangkatauhan[b][c], at di-mabilang ang mga nauna sa kaniya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tipak ng lupa sa wadi” o “sa agusan.” Ang salitang Hebreo ay maaaring tumukoy sa libis, bangin, wadi, o higaan ng batis.
    reason: lexical_alternative
  - marker: b
    text: O “ang lahat ng tao”; literal na “lahat ng adam/tao.”
    reason: lexical_alternative
  - marker: c
    text: 'Maaaring ipinahihiwatig ng linyang ito ang isang prusisyon ng libing o ang paglakad ng buong sangkatauhan tungo sa kamatayan: di-mabilang ang mga nauna sa kaniya, at ang lahat ay sumusunod.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָתְקוּ לֹו
  choice: Matamis sa kaniya
  rationale: Pinananatili ang konkretong metapora ng Hebreo na ang lupa ng libingan ay 'matamis' o kaaya-aya sa namatay, sa halip na ipaliwanag agad bilang payapang pamamahinga.
- source_word: רִגְבֵי
  choice: mga tipak ng lupa
  rationale: Ang רֶגֶב ay bukol o tipak ng lupa. Mas malinaw sa karaniwang mambabasang Filipino ang 'mga tipak ng lupa' kaysa sa mas teknikal o hindi likas na katawagan.
- source_word: נָחַל
  choice: libis
  rationale: Maaaring tumukoy ang נחל sa libis, bangin, wadi, o tuyong agusan. Ang 'libis' ay natural at marangal sa kontekstong funeraryo, habang inilalagay sa talababa ang lawak ng kahulugan.
- source_word: כָּל אָדָם
  choice: ang buong sangkatauhan
  rationale: Kolektibo at pangkalahatan ang אָדָם dito, hindi limitado sa mga lalaki. Ipinahahayag ng 'buong sangkatauhan' ang unibersal na saklaw.
- source_word: יִמְשׁוֹךְ
  choice: sumusunod
  rationale: Bagaman literal na may diwang 'humila' o 'gumuhit,' kasama ng אַחֲרָיו ay natural itong nagpapahiwatig ng pagsunod o paglakad kasunod niya.
- source_word: וּלְפָנָיו אֵין מִסְפָּר
  choice: di-mabilang ang mga nauna sa kaniya
  rationale: Ang 'mga nauna sa kaniya' ay nagpapanatili sa spatial at temporal na pahiwatig ng לְפָנָיו, at ang 'di-mabilang' ay likas na salin ng idyomang אֵין מִסְפָּר.
theological_decisions:
- issue: Larawan ng libing at kamatayan
  choice: Pinanatili ang konkretong larawan ng lupa, pagsunod, at pag-una nang hindi tahasang nililimitahan sa prusisyon ng libing o sa pangkalahatang paglalakbay ng lahat tungo sa kamatayan.
  alternative: Maaaring unawain ito bilang tiyak na prusisyon ng libing, o bilang pahayag na ang buong sangkatauhan ay sumusunod sa landas tungo sa libingan.
  rationale: Sinusuportahan ng Hebreo ang dalawang pahiwatig. Ang salin at talababa ay nagpapanatili sa tunay na tensiyon at hindi nagdaragdag ng paliwanag na wala sa mismong taludtod.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang metaporang 'matamis' at ang konkretong larawan ng mga tipak ng lupa. Ginamit ang 'sangkatauhan' upang maging malinaw ang kolektibo at pangkalahatang diwa ng אָדָם.
