base_translation:
  language: en
  yaml_path: translation/ot/job/021/028.yaml
  text: For you say[a], ‘Where is the house of the noble man, and where is the tent[b], the dwelling place of the wicked?’
translation:
  language: tl
  text: Sapagkat sinasabi ninyo, “Nasaan ang bahay ng maharlika[a], at nasaan ang tolda[b], ang mga tirahan ng masasama?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinuno” o “prinsipe.” Ang Hebreong נָדִיב ay maaaring tumukoy sa isang taong mataas ang katayuan o kabilang sa maharlika, hindi lamang sa isang taong mapagbigay.
    reason: lexical_alternative
  - marker: b
    text: Siksik ang pariralang Hebreo na literal na maiuugnay bilang “ang tolda, ang mga tirahan ng masasama.” Maaari itong mangahulugang “ang toldang tinitirhan ng masasama,” o appositional na tukuyin ang tolda bilang mga tirahan ng masasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag at nag-uugnay sa sinasabi ng mga kausap ni Job sa naunang argumento.
- source_word: תֹאמְרוּ
  choice: sinasabi ninyo
  rationale: Ang imperpektibo ay likas na maipapahayag bilang pangkasalukuyang pananalita na kumakatawan sa karaniwang sinasabi ng mga kausap ni Job.
- source_word: בֵית
  choice: bahay
  rationale: Pinananatili ang karaniwang kahulugan at larawan ng Hebreo nang hindi ito nililimitahan sa palasyo, sambahayan, o buong ari-arian.
- source_word: נָדִיב
  choice: maharlika
  rationale: Sa kontekstong ito, tumutukoy ito sa isang taong mataas ang katayuan, hindi lamang sa taong mapagbigay. Likas at maikli ang “maharlika” sa modernong Filipino.
- source_word: אֹהֶל
  choice: tolda
  rationale: Pinananatili nito ang konkretong larawan ng Hebreo, kahit maaari itong gamitin para sa tahanan sa mas malawak na diwa.
- source_word: מִשְׁכְּנוֹת רְשָׁעִים
  choice: na tirahan ng masasama
  rationale: Likas na ipinahahayag sa Filipino ang siksik na ugnayan ng “tolda” at “mga tirahan ng masasama,” habang hindi ganap na nilulutas kung paglalarawan o apposisyon ang parirala.
- source_word: רְשָׁעִים
  choice: masasama
  rationale: Tumutukoy ito sa mga taong itinuturing na masama; pinananatili ang pangmaramihang moral na kategorya nang walang dagdag na paliwanag.
theological_decisions:
- issue: Kung ang tanong ay sipi ng aktuwal na pananalita o buod ng karaniwang pagtutol ng mga kausap ni Job
  choice: Ginamit ang pangkasalukuyang “sinasabi ninyo” at tuwirang sipi.
  alternative: “Sasabihin ninyo” bilang panghinaharap o potensiyal na pagtutol.
  rationale: Ang anyong Hebreo ay maaaring magpahiwatig ng patuloy o kinatawang pananalita; ang pangkasalukuyan ay angkop sa konteksto ngunit hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang tanong at ang mga konkretong larawang “bahay” at “tolda.” Ginamit ang “maharlika” para sa mataas na katayuang panlipunan at nilagyan ng talababa upang mapanatili ang leksikal na lawak. Isinaayos ang siksik na ikalawang parirala sa natural na Filipino, habang inilalahad sa talababa ang tunay na ambiguwidad ng Hebreo.
