translation_notes:
  register: Makabagong Filipino na may marangal at bahagyang patulang himig. Inulit ang “magtanong ka” sa ikalawang sugnay upang maging malinaw ang ellipsis ng Hebreo. Ginamit ang maramihang panghalip para sa mga kolektibong pangngalan ayon sa likas na gamit sa Filipino.
