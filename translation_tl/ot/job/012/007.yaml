  text: But ask the animals[a], please, and they will teach you, and the birds of the heavens, and they will tell you.
translation:
  language: tl
  text: Ngunit magtanong ka nga sa mga hayop, at tuturuan ka nila; sa mga ibon ng kalangitan,[a] at sasabihin nila sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga ibon sa himpapawid.” Sa literal, “mga ibon ng kalangitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Ngunit
  rationale: Nagpapahiwatig ito ng pagsalungat o pagbaling sa argumento ni Job; natural at marangal sa modernong Filipino ang “Ngunit.”
- source_word: שְׁאַל נָא
  choice: makiusap kang magtanong
  rationale: Ang שְׁאַל ay utos na “magtanong,” at ang נָא ay nagbibigay ng himig ng pakiusap o panghihikayat, hindi kinakailangang temporal na “ngayon.”
- source_word: בְהֵמוֹת
  choice: mga hayop
  rationale: Malawak ang tinutukoy na mga hayop sa lupa, hindi lamang mga alagang hayop; malinaw rin ang pagkakatapat nito sa mga ibon.
- source_word: וְתֹרֶךָּ
  choice: at tuturuan ka nila
  rationale: Ang Hiphil ng ירה ay “magturo.” Bagaman pambabaeng isahan ang pandiwa ayon sa kolektibong pangngalan sa Hebreo, natural na maramihan ang pagtukoy sa “mga hayop” sa Filipino.
- source_word: וְעוֹף הַשָּׁמַיִם
  choice: mga ibon sa langit
  rationale: Ang עוֹף ay tumutukoy rito sa mga ibon o lumilipad na nilalang, at literal na “mga ibon ng kalangitan” ang parirala. Mas likas sa Filipino ang “mga ibon sa langit.”
- source_word: וְיַגֶּד לָךְ
  choice: at sasabihin nila sa iyo
  rationale: Ang Hiphil ng נגד ay “sabihin, ipahayag, ipaalam.” Ang “sasabihin nila sa iyo” ay malinaw at natural, habang pinananatili ang pagkakatulad sa naunang sugnay.
