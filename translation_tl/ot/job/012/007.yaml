    issue: “makiusap kang magtanong”
    rationale: Ang Hebrew na שְׁאַל־נָא ay “magtanong, pakiusap/nga,” hindi “makiusap na magtanong.” Ang kasalukuyang salin ay nagdaragdag ng pandiwang “makiusap” at bahagyang binabago ang puwersa ng utos.
  - severity: medium
    issue: “mga ibon sa langit”
    rationale: Maaari itong unawain bilang mga ibong nasa langit. Ang genitive na “mga ibon ng kalangitan” ay mas malapit sa Hebreo at mas malinaw sa konteksto.
  revised_text: Ngunit magtanong ka nga sa mga hayop, at tuturuan ka nila; sa mga ibon ng kalangitan,[a] at sasabihin nila sa iyo.
