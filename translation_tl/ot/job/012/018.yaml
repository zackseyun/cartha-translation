  text: He loosens the bonds of kings and binds a belt around their waists[a][b].
translation:
  language: tl
  text: 'Kinakalag niya ang mga gapos[a] ng mga hari,

    at itinatali ang sinturon sa kanilang baywang.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “disiplina ng mga hari.” Ang salitang Hebreo ay maaaring mangahulugang “disiplina” o “gapos,” ngunit mas angkop dito ang “mga gapos” dahil kaagapay nito ang “kinakalag” at “itinatali.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring larawan ito ng pagpapahiya o pagpapasailalim: inaalisan ng Diyos ng kapangyarihan ang mga hari at itinatali silang gaya ng mga karaniwang tao o bihag. Posible rin namang tumukoy ang pagbibigkis sa paghahanda sa pagkilos; hindi tiyak ang larawan sa Hebreo.'
    reason: cultural_note
lexical_decisions:
- source_word: מוּסַר
  choice: mga gapos
  rationale: Maaaring mangahulugan ang pangngalan ng “disiplina/pagdidisiplina” o ng konkretong “gapos/tali.” Sa kaagapay na mga pandiwang “kinakalag” at “itinatali,” ang “mga gapos” ang pinakamalinaw na nagpapanatili sa pisikal na larawan at sa baligtarang kilos ng taludtod.
- source_word: פִּתֵּחַ
  choice: kinakalag
  rationale: Ang pandiwa ay literal na “nagbubukas” o “nagluluwag.” Kapag gapos ang layon, natural sa Tagalog ang “kinakalag,” na nagpapanatili sa konkretong larawan nang hindi ito ginagawang paliwanag lamang.
- source_word: מְלָכִים
  choice: mga hari
  rationale: Ito ang tuwiran at karaniwang kahulugan ng salitang Hebreo; hindi kailangang palawakin bilang “mga pinuno.”
- source_word: וַיֶּאְסֹר
  choice: itinatali
  rationale: Ang pandiwa ay “magtali” o “magbigkis.” Ang “itinatali” ay natural sa kasalukuyang Tagalog at malinaw na kabaligtaran ng “kinakalag.”
- source_word: אֵזוֹר
  choice: sinturon
  rationale: Tumutukoy ito sa sinturon o bigkis na isinusuot sa baywang. Ang “sinturon” ang pinakakaraniwang modernong katumbas at hindi nito ipinipilit kung ang larawan ay paghahanda, paglilingkod, o pagpapahiya.
- source_word: בְּמָתְנֵיהֶם
  choice: sa kanilang baywang
  rationale: Ang parirala ay tumutukoy sa baywang o balakang. Ang “sa kanilang baywang” ay malinaw, natural, at hindi makaluma.
theological_decisions:
- issue: Ang kahulugan ng baligtarang larawan tungkol sa mga hari
  choice: Pinanatiling literal ang magkatambal na larawan ng pagkakalag sa mga gapos at pagtatali ng sinturon, na nagpapakita na kayang baligtarin ng Diyos ang kalagayan ng mga hari.
  alternative: Maaaring inilalarawan na pinalalaya ng Diyos ang mga hari at pagkatapos ay binibigkisan sila para kumilos; o na inaalis niya ang kapangyarihan nilang gumapos ng iba at saka sila mismo ang iginagapos.
  rationale: Maikli at sadyang malarawan ang Hebreo. Malinaw ang pagsalungat ng “kinakalag” at “itinatali,” ngunit hindi tiyak kung ano mismo ang ipinahihiwatig ng sinturon. Kaya hindi nilutas sa pangunahing teksto ang tunay na kalabuan.
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Tagalog. Pinili ang “kinakalag,” “gapos,” “itinatali,” at “sinturon” upang mapanatili ang konkretong pagtutulad at ang tensiyon ng dalawang magkasalungat na kilos, nang hindi gumagamit ng makalumang “bigkis sa mga balakang” o nagpapasya nang labis sa kahulugan ng larawan.
