  text: עִ֭מּ/וֹ חָכְמָ֣ה וּ/גְבוּרָ֑ה ל֝֗/וֹ עֵצָ֥ה וּ/תְבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/013.yaml
  text: With him are wisdom and might[a]; to him belong counsel and understanding.
translation:
  language: tl
  text: Nasa kanya ang karunungan at kapangyarihan[a]; kanya ang payo at pang-unawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kasama niya ang karunungan at kapangyarihan; kanya ang payo at pang-unawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: Nasa kanya
  rationale: Ang עִם na may hulaping panghalip ay karaniwang nangangahulugang “kasama niya” o “nasa kanya.” Sa kontekstong patula, likas sa modernong Tagalog ang “nasa kanya” upang ipahayag na taglay niya ang mga katangiang binanggit.
- source_word: חָכְמָה
  choice: karunungan
  rationale: Karaniwang katumbas ito ng חָכְמָה at tumutukoy sa tunay at mahusay na pagkaunawa.
- source_word: וּגְבוּרָה
  choice: at kapangyarihan
  rationale: Ang גְבוּרָה ay maaaring mangahulugang lakas, kapangyarihan, o kadakilaan ng lakas. Ang “kapangyarihan” ay marangal at natural na kapares ng “karunungan” sa konteksto ng soberanong kakayahan ng Diyos.
- source_word: לוֹ
  choice: kanya ang
  rationale: Ang לְ na may hulaping panghalip ay nagpapahayag dito ng pagmamay-ari. Ang “kanya ang” ay maikli, natural, at tapat sa sugnay na walang pandiwa sa Hebreo.
- source_word: עֵצָה
  choice: payo
  rationale: Saklaw ng עֵצָה ang payo, pagpapasya, at maingat na pagpaplano. Pinananatili ng “payo” ang pangunahing diwa nang hindi nililimitahan ito sa isang tiyak na plano.
- source_word: וּתְבוּנָה
  choice: at pang-unawa
  rationale: Ang תְבוּנָה ay tumutukoy sa pagkaunawa, kabatiran, o kakayahang kumilala nang tama. Ang “pang-unawa” ay malinaw at karaniwan sa modernong Tagalog.
theological_decisions:
- issue: Tinutukoy ng mga panghalip
  choice: Pinanatili ang “kanya” nang hindi tahasang pinapalitan ng “Diyos.”
  alternative: Sabihing “Nasa Diyos” at “sa Diyos” upang gawing tahasan ang tinutukoy.
  rationale: Ipinakikilala ng konteksto ang Diyos bilang tinutukoy, ngunit mga panghalip lamang ang nasa Hebreo. Ang pagpapanatili sa mga ito ay mas malapit sa anyo ng teksto at hinahayaang ang konteksto ang tumukoy sa kanya.
- issue: Ugnayan ng עִמּוֹ sa mga katangian
  choice: Isinalin bilang “Nasa kanya,” na nagpapahayag na taglay niya ang karunungan at kapangyarihan.
  alternative: “Kasama niya” o “sa piling niya,” na maaaring magpahiwatig na hiwalay na mga bagay lamang ang mga katangiang ito.
  rationale: Tunay na kahulugan ng pang-ukol ang “kasama,” ngunit sa paralelismo sa “kanya ang,” malakas ang diwang pag-aangkin o pagtataglay. Hindi naman nito ipinapasok ang mas tiyak na pormulang teolohikal na wala sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at patula. Pinanatili ang balanseng paralelismo ng dalawang sugnay at iniwasan ang mas lumang anyong “sumakaniya.”
