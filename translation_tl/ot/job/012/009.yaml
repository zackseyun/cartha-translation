  source_fidelity: 'Tapat ang salin sa retorikal na tanong ng Hebreo, sa pangkalahatang pagkilalang ipinahihiwatig ng יָדַע, sa saklaw na “sa lahat ng ito,” at sa nilalaman ng pagkilala: ang kamay ni Yahweh ang gumawa nito. Napananatili rin ang singular na “nito” para sa זֹאת.'
