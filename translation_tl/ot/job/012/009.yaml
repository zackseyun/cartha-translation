id: JOB.12.9
reference: Job 12:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִ֭י לֹא יָדַ֣ע בְּ/כָל אֵ֑לֶּה כִּ֥י יַד יְ֝הוָה עָ֣שְׂתָה זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/009.yaml
  text: Who among all these does not know that the hand of Yahweh has done this?[a]
translation:
  language: tl
  text: Sino sa lahat ng ito ang hindi nakaaalam na ang kamay ni Yahweh[a] ang gumawa nito?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; kinaugaliang isalin na “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי לֹא יָדַע
  choice: Sino ... ang hindi nakaaalam
  rationale: Pinananatili ang tuwirang retorikal na tanong. Ang kasalukuyang anyong “nakaaalam” ay likas sa Filipino para sa pangkalahatang pagkilala na ipinahihiwatig ng konteksto.
- source_word: בְּ/כָל אֵלֶּה
  choice: sa lahat ng ito
  rationale: 'Ang בְּ dito ay partitive o distributive: “sino sa lahat ng ito.” Tinutukoy ng “ito” ang mga nilalang na nabanggit sa naunang konteksto.'
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng nalalaman, kaya angkop ang pang-ugnay na “na,” hindi ang panandang sanhi na “dahil.”
- source_word: יַד
  choice: ang kamay
  rationale: Pinananatili ang malinaw na metapora ng Hebreo para sa pagkilos at kapangyarihan ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa titik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: עָשְׂתָה זֹּאת
  choice: ang gumawa nito
  rationale: Ang עשה ay maaaring mangahulugang “gumawa” o “lumikha.” Ang “gumawa nito” ay nagpapanatili sa malawak na kahulugan ng pandiwa at sa isahang demonstratibong זֹּאת.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasan sa tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng “kamay ni Yahweh”
  choice: Pinanatili ang larawang “kamay”
  alternative: kapangyarihan ni Yahweh
  rationale: Hindi tahasang nilulutas ang metapora bilang “kapangyarihan” lamang; maaari nitong saklawin kapuwa ang kapangyarihan at aktibong pagkilos o ahensiya ng Diyos.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “nakaaalam” sa halip na mas kolokyal na “alam” upang mapanatili ang dignidad ng retorikal na tanong, habang nananatiling madaling maunawaan.
