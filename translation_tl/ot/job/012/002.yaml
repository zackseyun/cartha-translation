translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang tandang padamdam upang maipakita ang matalim na panunuya na nahihinuha sa konteksto, nang hindi binabago ang literal na pahayag. Ang ‘bayan’ ay mas natural kaysa ‘mga tao’ para sa kolektibong עָם, at nilinaw ng ‘buong’ ang idyomatikong puwersa ng panunuya.
