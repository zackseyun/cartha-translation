  text: No doubt you are the people[a], and wisdom will die with you.
translation:
  language: tl
  text: Walang duda, kayo nga ang bayan, at kasama ninyo, mamamatay ang karunungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Tunay ngang kayo ang bayan, at kasama ninyo, mamamatay ang karunungan.” Karaniwang inuunawa ang linyang ito bilang panunuya ni Job sa kanyang mga kaibigan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם כִּי
  choice: Walang duda ... nga
  rationale: Pinagsamang idyomatikong diin na nagpapahayag ng kunwa-kunyaring pagsang-ayon; sa konteksto, malinaw ang matalim na panunuya ni Job.
- source_word: אַתֶּם
  choice: kayo
  rationale: Pangalawang panauhang maramihan, tuwirang tumutukoy sa mga kausap ni Job.
- source_word: עָם
  choice: ang buong bayan
  rationale: Pinananatili ang literal na larawan ng ‘bayan’ habang ipinahihiwatig ng ‘buong’ ang mapanuyang pahayag na para bang sila lamang ang mga taong maituturing o kumakatawan sa lahat.
- source_word: וְעִמָּכֶם
  choice: at kasabay ninyo
  rationale: Likas na Tagalog na nagpapahayag na mawawala ang karunungan kapag nawala rin sila.
- source_word: תָּמוּת
  choice: mamamatay
  rationale: Tuwirang katumbas ng pandiwang ‘mamatay,’ na ang paksa ay ang pambabaeng pangngalang ‘karunungan’; pinananatili nito ang buhay at mapanuyang personipikasyon.
- source_word: חָכְמָה
  choice: ang karunungan
  rationale: Karaniwang salin ng חָכְמָה at tumutukoy rito sa karunungang inaangkin diumano ng mga kaibigan ni Job.
