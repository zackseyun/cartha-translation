  text: אֲשֶׁ֣ר בְּ֭/יָד/וֹ נֶ֣פֶשׁ כָּל חָ֑י וְ֝/ר֗וּחַ כָּל בְּשַׂר אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/010.yaml
  text: In whose hand is the life of every living thing[a], and the breath of all mankind.
translation:
  language: tl
  text: Nasa kanyang kamay ang buhay ng bawat nilalang, at ang hininga ng lahat ng tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang kaluluwa ng bawat nilalang, at ang espiritu ng lahat ng laman ng sangkatauhan.”
    reason: Ipinapakita ang posibleng mas literal na mga katumbas ng נֶפֶשׁ, רוּחַ, at כָּל בְּשַׂר אִישׁ nang hindi ipinipilit ang isang tiyak na antropolohikal na pagbasa.
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: Nasa kanyang kamay
  rationale: Ang pariralang Hebreo ay literal na tumutukoy sa nasa kamay niya at nagsasaad ng kapangyarihan o pamamahala. Pinananatili ng salin ang metapora sa natural na Tagalog; nauunawaan ang kaugnayan nito sa Diyos mula sa naunang taludtod.
- source_word: נֶפֶשׁ
  choice: buhay
  rationale: Sa kontekstong ito, tumutukoy ito sa buhay na nagbibigay-sigla sa mga nilalang, hindi kinakailangang sa isang hiwalay na di-materyal na kaluluwa.
- source_word: כָּל חָי
  choice: bawat nilalang
  rationale: Ipinahahayag nito ang malawak na saklaw ng lahat ng nabubuhay. Natural at malinaw sa Tagalog ang “bawat nilalang,” habang ang kasunod na “buhay” ay sapat nang nagpapakitang mga nilalang na may buhay ang tinutukoy.
- source_word: וְרוּחַ
  choice: at ang hininga
  rationale: Sa paralelismo nito sa נֶפֶשׁ at sa kaugnayan sa sangkatauhan, malamang na tumutukoy ito sa hininga o puwersa ng buhay. Hindi nito isinasara ang posibleng kahulugang “espiritu,” na inilalahad sa talababa.
- source_word: כָּל בְּשַׂר אִישׁ
  choice: ng lahat ng tao
  rationale: Ang literal na larawan ng “lahat ng laman ng tao” ay kolektibong tumutukoy sa sangkatauhan bilang mortal na mga nilalang. Ang “lahat ng tao” ang malinaw at likas na katumbas sa modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ at רוּחַ sa antropolohiya
  choice: Isinalin bilang “buhay” at “hininga.”
  alternative: “kaluluwa” at “espiritu”
  rationale: Binibigyang-diin ng taludtod na hawak ng Diyos ang buhay ng lahat ng nilalang at tao. Iniiwasan ng konkretong salin ang pagpasok ng mas tiyak na paghahating katawan-kaluluwa kaysa sa hinihingi ng Hebreo, habang kinikilala sa talababa ang tunay na leksikal na alternatibo.
- issue: Kolektibong pagtukoy ng אִישׁ sa pariralang כָּל בְּשַׂר אִישׁ
  choice: lahat ng tao
  alternative: lahat ng laman ng tao
  rationale: Bagaman panlalaki ang anyong Hebreo, kolektibo at pangkalahatan ang saklaw nito. Ang “lahat ng tao” ay tumpak, malinaw, at hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang metaporang “nasa kanyang kamay,” at gumamit ng karaniwang “buhay,” “hininga,” at “lahat ng tao” para sa natural na pagbasa.
