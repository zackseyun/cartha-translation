base_translation:
  language: en
  yaml_path: translation/ot/job/012/024.yaml
  text: He removes understanding from the heads of the people of the land[c][b][a], and makes them wander in a trackless waste.
translation:
  language: tl
  text: Inaalis niya ang unawa[a] ng mga pinuno ng mamamayan ng lupain[b], at pinagagala niya sila sa tiwangwang na pook na walang daan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “puso”; dito ay tumutukoy sa unawa o wastong paghatol.'
    reason: lexical_alternative
  - marker: b
    text: 'O “mga pinuno ng mamamayan ng daigdig.” Literal: “mga ulo ng bayan ng lupain/daigdig.”'
    reason: lexical_alternative
  - marker: c
    text: 'Literal: “sa kawalan, walang daan”—isang tiwangwang na pook na walang landas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר לֵב
  choice: inaalis niya ang unawa
  rationale: Ang מֵסִיר ay nagsasaad ng pag-aalis, at ang לֵב, bagaman literal na “puso,” ay tumutukoy rito sa kakayahang umunawa at magpasya nang tama.
- source_word: רָאשֵׁי עַם הָאָרֶץ
  choice: mga pinuno ng mga mamamayan sa lupain
  rationale: Ang רָאשֵׁי (“mga ulo”) ay idyoma para sa mga pinuno. Pinananatili ng “lupain” ang posibilidad ng הָאָרֶץ bilang isang partikular na lupain, habang inilalahad sa talababa ang alternatibong “daigdig.”
- source_word: וַיַּתְעֵם
  choice: hinahayaan niya silang gumala
  rationale: 'Causative ang anyo ng תעה: siya ang sanhi ng kanilang pagkaligaw o paggala. Natural sa Filipino ang “hinahayaan niya silang gumala” sa larawang ito, bagaman maaari rin itong isaling “pinagagala niya.”'
- source_word: בְּתֹהוּ לֹא דָרֶךְ
  choice: sa ilang na walang landas
  rationale: Ang תֹהוּ ay kawalan, kapanglawan, o tiwangwang na pook; ang לֹא דָרֶךְ ay literal na “walang daan.” Pinagsasama ng salin ang dalawang larawan nang malinaw at matapat.
theological_decisions:
- issue: Hindi tahasang inuulit ang simuno sa talata
  choice: Ginamit ang “niya” na tumutukoy sa Diyos ayon sa konteksto
  alternative: Ulitin ang “Diyos” sa talata
  rationale: Diyos ang nagpapatuloy na simuno sa konteksto ng Job 12, ngunit hindi kailangang idagdag ang kaniyang pangalan kung panghalip lamang ang nasa daloy ng Hebreo.
- issue: Lakas ng causative sa וַיַּתְעֵם
  choice: hinahayaan niya silang gumala
  alternative: pinagagala niya sila / inililigaw niya sila
  rationale: Pinananatili ang banal na agency ngunit iniiwasang gawing tahasang moral na panlilinlang ang larawan; ang pandiwa ay pangunahing tumutukoy sa pagiging sanhi ng paggala o pagkaligaw.
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na estruktura at malinaw na larawang patula. Isinalin ang idyomatikong “puso” bilang “unawa” para hindi ito mapagkamalang emosyon, at inilagay sa talababa ang mahahalagang literal at leksikal na alternatibo.
