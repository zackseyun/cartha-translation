base_translation:
  language: en
  yaml_path: translation/ot/job/012/012.yaml
  text: With the aged is wisdom[a], and with length of days[b], understanding.
translation:
  language: tl
  text: Nasa matatanda ang karunungan[a], at sa mahabang buhay ay may pagkaunawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa gitna ng matatanda.” Ang pang-ukol sa Hebreo ay maaaring magpahayag ng kaugnayan o kinaroroonan.
    reason: lexical_alternative
  - marker: b
    text: Literal na “haba ng mga araw,” ibig sabihin, mahabang buhay o maraming araw ng pamumuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּישִׁישִׁים
  choice: nasa matatanda
  rationale: Ang בְּ ay maaaring magpahiwatig ng kinaroroonan o kaugnayan, at ang יְשִׁישִׁים ay tumutukoy sa matatandang tao. Likas sa modernong Tagalog ang “nasa matatanda” at hindi nito nililimitahan ang tinutukoy sa mga lalaki.
- source_word: חָכְמָה
  choice: karunungan
  rationale: Karaniwang katumbas ito ng חָכְמָה sa panitikang karunungan at angkop sa maikling pahayag na kawikaan ang anyo.
- source_word: וְאֹרֶךְ יָמִים
  choice: at nasa mahabang buhay
  rationale: Literal na “haba ng mga araw” ang parirala. Ang “mahabang buhay” ay natural at malinaw sa modernong Tagalog habang pinananatili ang diwa ng maraming araw ng buhay; inilalahad sa talababa ang literal na larawan.
- source_word: תְּבוּנָה
  choice: pagkaunawa
  rationale: Ipinahahayag nito ang kakayahang umunawa o kumilala nang may wastong paghatol. Pinananatili ng “pagkaunawa” ang kaugnayan ngunit hindi ganap na pagkakapareho nito sa “karunungan.”
theological_decisions:
- issue: Kung pahayag o retorikal na tanong ang talata
  choice: 'Pahayag: “Nasa matatanda…”'
  alternative: 'Retorikal na tanong: “Hindi ba nasa matatanda…?”'
  rationale: Walang tahasang tandang patanong sa Hebreo. Bagaman maaaring basahin itong retorikal na tanong ayon sa konteksto, pinananatili ng pahayag ang payak na anyo ng nominal na mga sugnay at hindi ipinapasok ang “hindi ba” na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at may anyong kawikaan. Ginamit ang magkatulad na balangkas na “nasa… ang…” upang maipakita ang paralelismo ng Hebreo nang hindi nagiging pilit ang pananalita.
