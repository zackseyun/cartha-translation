  text: With him are strength and sound wisdom[a]; the one who goes astray and the one who leads astray belong to him.
translation:
  language: tl
  text: Nasa kanya ang lakas at mahusay na karunungan; kapwa sa kanya ang naliligaw at ang nagliligaw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang nalinlang at ang manlilinlang.” Gayunman, ipinakikita ng mga anyong pandiwa sa Hebreo ang pagkakaiba ng isang naliligaw at ng isang nagliligaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: Nasa kanya
  rationale: Pinananatili nito ang idyomang Hebreo na nagpapahayag na ang mga katangiang ito ay taglay ng Diyos at nasa kanyang kapamahalaan.
- source_word: עֹז
  choice: lakas
  rationale: Karaniwan at likas na katumbas ito ng salitang tumutukoy sa lakas o kapangyarihan.
- source_word: תּוּשִׁיָּה
  choice: mahusay na karunungan
  rationale: Ipinahihiwatig nito ang matibay, mabisa, at praktikal na karunungan, hindi lamang kaalaman.
- source_word: לוֹ
  choice: sa kanya
  rationale: Pinananatili ang maikli ngunit matibay na pahayag ng pag-aari o pagkakasakop sa Diyos nang hindi tinutukoy kung paano niya nauugnay ang mga taong ito.
- source_word: שֹׁגֵג
  choice: ang naliligaw
  rationale: Ang Qal participle ay tumutukoy sa taong nagkakamali o lumilihis; ang anyong ito ay nagpapanatili sa diwang aktibo ngunit di-palinkas.
- source_word: מַשְׁגֶּה
  choice: ang nagliligaw
  rationale: Ang Hiphil participle ay tumutukoy sa taong nagiging sanhi upang maligaw ang iba; pinananatili nito ang ugnayang pandiwa sa naliligaw.
theological_decisions:
- issue: Ugnayan ng Diyos sa naliligaw at sa nagliligaw
  choice: Kapwa sila ay sinasabing sa Diyos o nasa ilalim ng kanyang kapamahalaan, nang hindi ipinapakahulugang siya ang tuwirang sanhi ng kanilang moral na kamalian.
  alternative: Ang Diyos ang pinagmumulan ng pagkaligaw at panlilinlang.
  rationale: Ang Hebreo ay nagsasaad lamang ng לוֹ, isang pahayag ng pag-aari o pagkakasakop. Pinananatili ng saling “sa kanya” ang tensiyong teolohikal nang hindi dinaragdagan ang teksto ng tiyak na paliwanag tungkol sa moral na sanhi.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang maikli at magkatugmang “naliligaw” at “nagliligaw” upang mapanatili ang morpolohikal na paghahambing ng Hebreo. Inilagay ang panandang talababa pagkatapos ng kaugnay na ikalawang sugnay.
