id: JOB.12.4
reference: Job 12:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שְׂחֹ֤ק לְ/רֵעֵ֨/הוּ אֶֽהְיֶ֗ה קֹרֵ֣א לֶ֭/אֱלוֹהַּ וַֽ/יַּעֲנֵ֑/הוּ שְׂ֝ח֗וֹק צַדִּ֥יק תָּמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/004.yaml
  text: I am a laughingstock to my friend[a], one who called to God and he answered him[b], a laughingstock to the righteous and blameless man.
translation:
  language: tl
  text: Isa akong katatawanan sa kaibigan ko[a]—ako na tumawag sa Diyos at kanyang sinagot[b]. Katatawanan ang taong matuwid at walang kapintasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kaibigan niya.” Ikatlong panauhan ang hulapi sa Hebreo, ngunit ipinahihiwatig ng konteksto na tinutukoy ni Job ang sarili niyang kaibigan.
    reason: alternative_reading
  - marker: b
    text: Sa literal na anyo ng Hebreo, “at sinagot niya siya”; si Job mismo ang tinutukoy na sinagot.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂחֹק
  choice: katatawanan
  rationale: Ipinahahayag ng pangngalan ang paghamak sa isang taong ginagawang tampulan ng tawa. Ang “katatawanan” ay natural at naiuulit sa dalawang bahagi gaya ng Hebreo.
- source_word: לְרֵעֵהוּ
  choice: sa kaibigan ko
  rationale: Ang hulaping Hebreo ay pormal na ikatlong panauhan (“niya”), ngunit si Job ay nagsasalita tungkol sa sarili at sa pakikitungo sa kanya ng kanyang kasama. Ginamit ang unang panauhan sa pangunahing teksto at pinanatili sa talababa ang pormal na alternatibo.
- source_word: אֶהְיֶה
  choice: Isa ako
  rationale: Bagaman anyong di-ganap ang pandiwa, inilalarawan nito rito ang kasalukuyang kalagayan ni Job.
- source_word: קֹרֵא לֶאֱלוֹהַּ
  choice: ako na tumawag sa Diyos
  rationale: Ipinapakita ng pariralang panuring ang taong humingi ng tugon sa Diyos at sinusundan ng naganap na pagsagot.
- source_word: וַיַּעֲנֵהוּ
  choice: at kanyang sinagot
  rationale: Sa konstruksyong Filipino, ang “ako na … kanyang sinagot” ay malinaw na tumutukoy kay Job bilang sinagot, samantalang naipapaliwanag sa talababa ang ikatlong-panauhang anyo ng Hebreo.
- source_word: צַדִּיק
  choice: matuwid
  rationale: Karaniwan at angkop itong salin para sa moral na katuwiran sa panitikang karunungan.
- source_word: תָּמִים
  choice: walang kapintasan
  rationale: Tumutukoy ito sa kabuuan ng pagkatao at integridad, hindi kinakailangang sa ganap na kawalan ng kasalanan.
theological_decisions:
- issue: Kung ipinapahiwatig ng paglalarawan ni Job ang ganap na kawalan ng kasalanan
  choice: “walang kapintasan” bilang paglalarawan ng integridad
  alternative: “perpekto” bilang ganap na kasakdalan
  rationale: Sa panitikang karunungan, ang תָּמִים ay tumutukoy sa buo at matapat na pagkatao. Pinananatili ng salin ang bigat ng pahayag nang hindi ipinapasok ang ideya ng lubos na kawalan ng kasalanan.
- issue: Ugnayan ng צַדִּיק תָּמִים sa ikalawang שְׂחֹק
  choice: “Katatawanan ang taong matuwid at walang kapintasan”
  alternative: “katatawanan sa taong matuwid at walang kapintasan”
  rationale: Walang pang-ukol na לְ bago sa צַדִּיק תָּמִים, kaya pinakamalapit sa gramatika ang pagbasa na ang matuwid at walang-kapintasang tao ang siyang katatawanan. Hindi ginaya ang interpretibong ugnayan ng audited English layer kung saan tila siya ay katatawanan sa harap ng gayong tao.
translation_notes:
  register: Modernong Filipino na dignipikado ngunit madaling maunawaan. Pinanatili ang pag-uulit ng “katatawanan” at ang matinding kabalintunaan ng hinaing ni Job. Gumamit ng em dash upang malinaw na ang tumawag at sinagot ng Diyos ay si Job.
