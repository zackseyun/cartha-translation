  text: He reveals deep things out of darkness[a], and brings the shadow of death to light.
translation:
  language: tl
  text: Inilalantad niya mula sa kadiliman ang malalalim na bagay, at inilalabas niya sa liwanag ang lilim ng kamatayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “matinding kadiliman” o “malalim na kadiliman” para sa “lilim ng kamatayan” (Hebreo: צַלְמָוֶת).'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגַלֶּה
  choice: Inilalantad
  rationale: Ang participle ng גלה ay tumutukoy sa pag-aalis ng takip o paghahayag ng nakatago. Ang “inilalantad” ay natural at pinananatili ang kongkretong larawan.
- source_word: עֲמֻקוֹת
  choice: ang malalalim na bagay
  rationale: Ang pang-uring pambabae na maramihan na ginamit bilang pangngalan ay maaaring tumukoy sa malalalim o nakatagong bagay; pinananatili ng salin ang maramihan at ang posibleng literal o metaporikal na diwa.
- source_word: מִנִּי חֹשֶׁךְ
  choice: mula sa kadiliman
  rationale: Ipinahihiwatig ng pariralang pang-ukol ang pinagmumulan ng inilalantad. Ang “mula sa kadiliman” ay malinaw at likas sa Filipino.
- source_word: וַיֹּצֵא
  choice: inilalabas niya
  rationale: 'Ang Hiphil ng יצא ay sanhi: pinangyayari niyang lumabas ang isang bagay. Tuwirang ipinahahayag ito ng “inilalabas niya.”'
- source_word: לָאוֹר
  choice: sa liwanag
  rationale: Tinutukoy ng parirala ang patutunguhan ng paglalabas; natural sa Filipino ang “inilalabas ... sa liwanag.”
- source_word: צַלְמָוֶת
  choice: ang lilim ng kamatayan
  rationale: Pinananatili nito ang tradisyonal at leksikal na maipagtatanggol na pagbasa, pati ang matinding larawang patula; inilalagay sa talababa ang mahalagang alternatibong pagbasa.
theological_decisions:
- issue: Pagpapakahulugan sa צַלְמָוֶת
  choice: ang lilim ng kamatayan
  alternative: matinding kadiliman o nakakamatay na kadiliman
  rationale: Leksikal at patula, hindi pangunahing doktrinal, ang usapin. Pinananatili sa pangunahing teksto ang tradisyonal na pagbasa, ngunit hindi tahimik na nilulutas ang posibilidad na ang salita ay tumutukoy sa sukdulang kadiliman.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinananatili ang magkatugmang larawang patula ng kadiliman at liwanag, gayundin ang tunay na kalabuan ng צַלְמָוֶת.
