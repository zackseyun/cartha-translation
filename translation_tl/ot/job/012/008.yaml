  source_fidelity: 'Tumpak na naipapahayag ng draft ang sunod-sunod na panawagan ng Hebreo: kausapin ang lupa, tuturuan ka nito, at magsasabi sa iyo ang mga isda sa dagat. Ang “lupa” ay isang ligtas na salin para sa אֶרֶץ sa malawak na kontekstong ito, at wastong minamarkahan ng talababa ang alternatibong “lupain.”'
