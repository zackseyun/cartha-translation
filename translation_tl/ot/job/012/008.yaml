  yaml_path: translation/ot/job/012/008.yaml
  text: Or speak to the earth[a], and it will teach you[b]; and the fish of the sea will tell you.
translation:
  language: tl
  text: O magsalita ka sa lupa[a], at tuturuan ka nito; at magsasabi sa iyo ang mga isda sa dagat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lupain.” Maaaring tumukoy ang Hebreong אֶרֶץ sa lupa bilang daigdig o sa isang lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֤וֹ
  choice: O
  rationale: Nagpapatuloy ito sa magkakaugnay na panawagan sa konteksto at likas na naghuhudyat ng alternatibo sa modernong Tagalog.
- source_word: שִׂ֣יחַ
  choice: magsalita ka
  rationale: Sa pautos na anyo at kasunod ang pariralang 'sa lupa,' tumutukoy ito sa pakikipag-usap o pagtawag sa lupa, hindi sa tahimik na pagninilay.
- source_word: לָ/אָ֣רֶץ
  choice: sa lupa
  rationale: Maaaring mangahulugan ang אֶרֶץ ng 'lupa' bilang daigdig o ng isang lupain. Sa konteksto ng mga hayop, ibon, at isda, ang pangkalahatang 'lupa' ang pinakanatural habang nananatiling bukas ang saklaw nito.
- source_word: וְ/תֹרֶ֑/ךָּ
  choice: at tuturuan ka nito
  rationale: Ang Hiphil ng ירה ay karaniwang nangangahulugang 'magturo.' Pinananatili ng 'nito' ang pagsasatao sa lupa nang hindi pilit na ginagawang pambabae sa Tagalog.
- source_word: וִֽ/יסַפְּר֥וּ לְ֝/ךָ֗
  choice: at sasabihin sa iyo
  rationale: Ang Piel ng ספר ay maaaring mangahulugang magsalaysay, magpahayag, o magsabi. Malinaw at likas sa kasalukuyang Tagalog ang 'sasabihin sa iyo.'
- source_word: דְּגֵ֣י הַ/יָּֽם
  choice: mga isda sa dagat
  rationale: Tuwirang pinananatili nito ang larawang Hebreo at natural ang parirala sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang 'magsalita ka sa lupa' upang mapanatili ang makatang pagsasatao at ang pagkakatulad nito sa pagtanong sa mga nilalang sa konteksto. Hindi na kailangan ng hiwalay na talababa tungkol sa pambabaeng anyo ng pandiwa sa Hebreo sapagkat walang kasariang gramatikal ang pandiwang Tagalog.
