  text: הֵ֣ן יַ֭הֲרוֹס וְ/לֹ֣א יִבָּנֶ֑ה יִסְגֹּ֥ר עַל אִ֝֗ישׁ וְ/לֹ֣א יִפָּתֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/014.yaml
  text: Look[a], if he tears down, it cannot be rebuilt; if he shuts a man in[b], it cannot be opened.
translation:
  language: tl
  text: Narito[a], kapag giniba niya, hindi na ito muling maitatayo; kapag ikinulong niya ang isang lalaki[b], hindi na mabubuksan ang pintuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tunay nga” o “Masdan”; mariin at pantawag-pansin ang panimulang kataga.
    reason: lexical_alternative
  - marker: b
    text: O “kapag isinara niya ang isang lalaki sa loob” o “ikinulong ang isang lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tunay nga
  rationale: Ginagawang malinaw ang mariing panimulang kataga sa natural at marangal na modernong Tagalog; hindi ito ipinipilit na literal na utos na tumingin.
- source_word: יַהֲרוֹס
  choice: may giniba siya
  rationale: Ang גִּיבָה ay angkop sa konkretong larawan ng pagwasak sa isang itinayo at tumutugma sa kasunod na pandiwang ‘maitatayo.’
- source_word: וְלֹא יִבָּנֶה
  choice: hindi na iyon maitatayo
  rationale: Pinananatili ang balintiyak na diwa ng Niphal at ipinahihiwatig ng ‘hindi na’ ang di-na-maibabalik na bunga sa konteksto.
- source_word: יִסְגֹּר עַל אִישׁ
  choice: ikinulong niya ang isang lalaki
  rationale: Natural na inilalarawan ng ‘ikinulong’ ang pagsasara o pagkukulong sa isang tao nang hindi ipinapalagay na pormal itong pagpapabilanggo; pinananatili ng ‘lalaki’ ang tahasang panlalaking anyo ng אִישׁ.
- source_word: וְלֹא יִפָּתֵחַ
  choice: hindi na mabubuksan
  rationale: Pinananatili ang balintiyak at konkretong larawan ng isang bagay na isinara, habang hindi nagdaragdag ng tahasang layon na wala sa Hebreo.
theological_decisions:
- issue: Pagtukoy sa banal na simuno
  choice: siya
  alternative: Diyos / ang PANGINOON
  rationale: Mga pandiwang nasa ikatlong panauhang isahan ang gamit sa talata at walang tahasang banal na pangalan. Pinananatili ng ‘siya’ ang daloy ng konteksto nang hindi nagdaragdag ng titulong wala rito.
- issue: Diwa ng kawalang-posibilidad sa dalawang balintiyak na sugnay
  choice: hindi na … maitatayo / hindi na mabubuksan
  alternative: at hindi … itatayo / at hindi … bubuksan
  rationale: Ipinahahayag ng konteksto ang di-mapipigilang bunga ng ginawa niya. Ang ‘hindi na’ ay natural sa Tagalog ngunit hindi nagpapaliwanag kung anong mekanismo ang dahilan ng kawalang-posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkatimbang na larawan ng paggiba/pagtatayo at pagsasara/pagbubukas, pati ang di-tahasang layon ng huling pandiwa.
