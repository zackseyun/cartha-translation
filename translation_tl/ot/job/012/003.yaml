  - severity: medium
    issue: Malabo ang “hindi ako mababa sa inyo.”
    rationale: Bagaman posible, ang “mababa” sa Filipino ay madalas tumutukoy sa antas o katayuang panlipunan. Ang “hindi ako mas mababa kaysa sa inyo” ay mas malinaw na naghahayag ng paghahambing na ‘hindi inferior’ nang hindi nagdadagdag ng kahulugan.
  - severity: low
