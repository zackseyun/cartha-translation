  text: I too have a mind like you; I am not inferior to you[a]. And who does not know such things as these?
translation:
  language: tl
  text: 'May isip din akong gaya ng sa inyo;

    hindi ako mas mababa kaysa sa inyo.[a]

    At sino ba ang hindi nakaaalam ng mga ganitong bagay?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “May puso rin akong gaya ng sa inyo.” Dito, ang “puso” ay tumutukoy sa kakayahang umunawa o mag-isip.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם לִי לֵבָב
  choice: May isip din ako
  rationale: Ang לֵבָב ay literal na “puso,” ngunit dito ay tumutukoy sa kakayahang umunawa at mag-isip. Likas at malinaw sa modernong Filipino ang “isip,” habang pinananatili ng “din” ang pagdidiin ng גַּם.
- source_word: כְּמוֹכֶם
  choice: tulad ninyo
  rationale: Tuwirang ipinahahayag ang paghahambing ni Job sa pangkat ng kaniyang mga kausap; ang maramihang “ninyo” ay tumutugma sa anyong Hebreo.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: hindi ako mababa sa inyo
  rationale: Ang idyomang נפל מן ay nagsasaad ng pagiging mas mababa o kulang kaysa sa iba. Natural sa Filipino ang “hindi ako mababa sa inyo” at hindi nito dinaragdagan ang diwa.
- source_word: וְאֶת מִי אֵין כְּמוֹ אֵלֶּה
  choice: At sino ba ang hindi nakaaalam ng mga bagay na ito?
  rationale: Elliptical at idiomatiko ang Hebreo. Sa konteksto, retorikal na sinasabi ni Job na karaniwang kaalaman lamang ang mga sinabi ng kaniyang mga kaibigan. Ang “ba” ay likas na naghuhudyat ng retorikal na tanong.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tuwirang pagtutol ni Job nang hindi ginagawang labis na pormal o mapanlait. Ginamit ang “nakaaalam” bilang pamantayang anyo at ang “ninyo” upang ipakita na marami ang kaniyang kinakausap.
