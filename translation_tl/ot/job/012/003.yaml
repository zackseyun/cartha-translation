  naturalness: Ang binagong “gaya ng sa inyo” ay mas likas at mas tiyak para sa paghahambing ng isang taglay na katangian. Ang “hindi ako mas mababa kaysa sa inyo” ay malinaw na modernong Filipino para sa paghahambing. Ang “mga ganitong bagay” ay natural na katumbas ng retorikal na “such things as these.”
  terminology: Ang “isip” ay angkop na salin ng לֵבָב sa kontekstong ito, kung saan tumutukoy ito sa pag-iisip o pag-unawa, hindi pangunahing sa damdamin. Pinanatili ang literal na “puso” sa talababa at nilinaw ang semantikong gamit nito.
