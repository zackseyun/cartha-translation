  text: A torch is despised in the thought of one who is at ease; it is ready for those whose foot slips.
translation:
  language: tl
  text: Ang sulo ay hinahamak sa isip ng taong panatag; nakalaan ito para sa mga taong nadudulas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malabo ang Hebreo, lalo na ang ugnayan ng “sulo” at “nakalaan.” Maaari ring unawain na ang paghamak ay nakalaan para sa mga taong nadudulas o natitinag ang paa.
    reason: Ipinababatid ang tunay na sintaktikong kalabuan nang hindi ipinapasok ang “kapahamakan,” na hindi tahasang nasa teksto.
lexical_decisions:
- source_word: לַפִּיד
  choice: sulo
  rationale: Karaniwang katumbas ng ‘torch’; pinananatili ang kongkretong larawan ng tekstong Hebreo.
- source_word: בּוּז
  choice: hinahamak
  rationale: Ipinahahayag ang paghamak o pagtingin na walang halaga.
- source_word: לְעַשְׁתּוּת שַׁאֲנָן
  choice: ng taong panatag
  rationale: Ang parirala ay mahirap at maaaring tumukoy sa pag-iisip ng taong tiwasay; natural na Filipino ang ‘taong panatag’ habang ang tekstuwal na hirap ay inilalagay sa talababa.
- source_word: נָכוֹן
  choice: nakahanda
  rationale: Tumutugma sa diwang ‘handa/nakalaan’ at pinananatili ang tensiyon sa kasunod na parirala.
- source_word: לְמוֹעֲדֵי רָגֶל
  choice: para sa mga paa na malapit nang madulas
  rationale: Ang מועד sa anyong ito ay maaaring magpahiwatig ng pagkadulas o pag-uurong ng paa; ang ‘malapit nang’ ay naghahatid ng diwang napipintong pagkatisod.
theological_decisions:
- issue: Kaugnayan ng sulo sa taong nadudulas
  choice: Pinanatiling ang ‘ito’ ay tumutukoy sa sulo at nakahanda para sa mga paang malapit nang madulas.
  alternative: Unawain bilang ‘kapahamakan/paghamak ay nakalaan sa taong nadudulas.’
  rationale: Malabo at masalimuot ang Hebreo; sinusundan ng salin ang malinaw na gramatikal na ugnayan ng ‘sulo’ at ‘nakahanda’ nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘sulo,’ ‘panatag,’ at ‘madulas’ upang manatiling malinaw sa karaniwang mambabasa at mapanatili ang matalinghagang anyo.
