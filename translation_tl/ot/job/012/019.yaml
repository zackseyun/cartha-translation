translation:
  language: tl
  text: Inaakay niya palayo ang mga paring nasamsaman[a], at ibinabagsak niya ang mga makapangyarihan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinubaran” o “dinala bilang samsam.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga matatag” o “mga nananatili,” samakatuwid, ang mga inaakalang matibay ang pagkakatatag.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: inaakay niyang palayo
  rationale: Ang Hiphil na anyo ng הלך ay nagsasaad ng pagpapayaon o pag-akay. Ipinahihiwatig ng konteksto na ang Diyos ang gumagawa, kaya pinanatili ang panghalip sa halip na idagdag ang pangalang “Diyos.”
- source_word: כֹּהֲנִים
  choice: mga pari
  rationale: Ito ang tuwiran at karaniwang kahulugan ng salita, at angkop sa mga taong may katayuang panrelihiyon at panlipunan sa konteksto.
- source_word: שׁוֹלָל
  choice: nasamsaman
  rationale: Ipinapahayag nito ang pag-agaw sa ari-arian at dangal ng mga pari. Mas likas ito sa modernong Tagalog kaysa “hinubaran,” na maaaring mapagkamalang tumutukoy lamang sa damit.
- source_word: אֵתָנִים
  choice: mga makapangyarihan
  rationale: Ang salita ay maaaring tumukoy sa mga malalakas, matitibay, o matatag. Sa hanay ng mga prominenteng taong ibinababa ng Diyos, malinaw at natural ang “mga makapangyarihan,” habang inilalahad sa talababa ang ibang posibleng diwa.
- source_word: יְסַלֵּף
  choice: ibinabagsak
  rationale: Bagaman ang ugat ay maaaring mangahulugang baluktutin o ilihis, sa kontekstong ito inilalarawan nito ang pagpapabagsak sa mga taong inaakalang matatag. Ang “ibinabagsak” ay natural at angkop sa paralelismo.
theological_decisions:
- issue: Ang di-binanggit na simuno sa pagpapatuloy ng Job 12
  choice: Gamitin ang “niya” bilang pagtukoy sa Diyos
  alternative: Banggitin nang tahasan ang “Diyos”
  rationale: Mula sa nakapaligid na konteksto, ang Diyos ang patuloy na simuno. Pinananatili ng panghalip ang daloy at kaiklian ng tulang Hebreo nang hindi nagdaragdag ng pangalang wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikling paralelismo ng tulang Hebreo at ang ipinahihiwatig na banal na simuno. Ang “nasamsaman” at “mga makapangyarihan” ay madaling maunawaan, samantalang ang mga talababa ay nagpapanatili sa leksikal na lawak at tunay na kalabuan ng שׁוֹלָל at אֵתָנִים.
