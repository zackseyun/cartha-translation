lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Ang pandiwang ענה sa anyong wayyiqtol ay karaniwang nagpapakilala ng tugon sa naunang pahayag. Likas at tumpak sa modernong Tagalog ang “Sumagot.”
- source_word: אִיּוֹב
  choice: Job
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga Bibliyang Tagalog.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Ang אמר sa anyong wayyiqtol ay karaniwang pandiwa ng pagsasalita. Pinananatili ng “at sinabi” ang pormulang Hebreo nang hindi ito pinapahaba o ipinapaliwanag.
- source_word: וַ
  choice: Ø (hindi tahasang isinalin sa simula)
  rationale: Ipinahihiwatig na ng pagkakasunod ng mga pangyayari at ng pandiwang “Sumagot” ang panimulang waw. Mas natural sa Tagalog ang pangungusap na walang “At” o “Pagkatapos” sa simula; nananatiling posibleng literal na anyo ang “At,” kaya inilagay ito sa talababa.
