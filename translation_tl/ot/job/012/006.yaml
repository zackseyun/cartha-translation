source:
  edition: WLC
  text: יִשְׁלָ֤יוּ אֹֽהָלִ֨ים לְ/שֹׁ֥דְדִ֗ים וּֽ֭/בַטֻּחוֹת לְ/מַרְגִּ֣יזֵי אֵ֑ל לַ/אֲשֶׁ֤ר הֵבִ֖יא אֱל֣וֹהַּ בְּ/יָדֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/006.yaml
  text: The tents of destroyers are at ease[a], and those who provoke God are secure—those whose god brings into their hand.
translation:
  language: tl
  text: 'Payapa ang mga tolda ng mga mandarambong,

    at panatag ang mga nang-uudyok sa Diyos—

    silang dinadalhan ng kanilang diyos sa kanilang kamay.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “silang dinadala ng Diyos sa kanyang kamay,” o “silang dinadalhan ng Diyos sa kanilang kamay.” Mahirap unawain ang Hebreo sa huling sugnay. Maaaring tumukoy ito sa pamamahala ng tunay na Diyos o, bilang panunuya, sa kapangyarihan ng masama na itinuturing niyang kanyang “diyos.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלָיוּ
  choice: Payapa
  rationale: Ipinahahayag ng pandiwang mula sa שלה ang tahimik at di-nababagabag na kalagayan; pinananatili ng “payapa” ang mapait na kabalintunaan na ang masasama ang namumuhay nang maginhawa.
- source_word: אֹהָלִים
  choice: mga tolda
  rationale: Pinanatili ang kongkretong larawan ng mga tolda, na maaari ring kumatawan sa mga tahanan o sambahayan.
- source_word: לְשֹׁדְדִים
  choice: ng mga mandarambong
  rationale: Ang participle ay tumutukoy sa mararahas na nananamsam; likas sa modernong Tagalog ang “mandarambong” at hindi ito nililimitahan sa karaniwang pagnanakaw.
- source_word: וּבַטֻּחוֹת
  choice: panatag
  rationale: Ang salitang mula sa בטח ay nagsasaad ng katiwasayan o seguridad at mahusay na kaagapay sa “payapa.”
- source_word: לְמַרְגִּיזֵי אֵל
  choice: mga nang-uudyok sa Diyos
  rationale: 'Ang Hiphil participle ng רגז ay causative: pinupukaw nila ang galit ng Diyos. Ang “nang-uudyok sa Diyos” ay dignificado at hindi nagdaragdag ng bagay na hindi tahasang nasa Hebreo.'
- source_word: לַאֲשֶׁר הֵבִיא אֱלוֹהַּ בְּיָדוֹ
  choice: silang dinadalhan ng kanilang diyos sa kanilang kamay
  rationale: Sinusunod nito ang posibleng ironikong pagbasa na ang “diyos” ng masama—ang kapangyarihang pinagtitiwalaan niya—ang naglalagay ng ninanais niya sa kanyang kamay. Dahil napakahirap ng sintaks at maaari ring tumukoy sa tunay na Diyos, inilalahad ang ibang mga pagbasa sa talababa.
theological_decisions:
- issue: Ang tinutukoy ng אֱלוֹהַּ sa huling sugnay
  choice: “kanilang diyos,” bilang ironikong pagtukoy sa bagay o kapangyarihang pinagtitiwalaan ng masasama
  alternative: '“Diyos,” bilang tunay na Diyos: “silang dinadala ng Diyos sa kanyang kamay,” o “silang dinadalhan ng Diyos sa kanilang kamay”'
  rationale: Maaaring patindihin ng sugnay ang paglalarawan sa kasamaan ng mga taong tiwasay sapagkat itinuturing nilang diyos ang sarili nilang kapangyarihan. Gayunman, hindi tiyak ang kayarian ng Hebreo, kaya hindi itinatago ang mga pagbasa na tumutukoy sa tunay na Diyos.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang anyong patula sa tatlong linya, ang konkretong “mga tolda,” at ang tensiyon sa pagitan ng kapanatagan ng masasama at ng paghamon nila sa Diyos.
