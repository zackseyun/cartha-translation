  yaml_path: translation/ot/job/012/020.yaml
  text: He removes speech from the trusted[b][a], and takes away discernment from the elders.
translation:
  language: tl
  text: Inaalisan niya ng kakayahang magsalita ang mga pinagkakatiwalaan,[a] at inaalisan niya ng pagkilatis ang matatanda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “inaalis niya ang labi sa mga tapat.” Maaari ring isalin ang mga taong ito bilang “mga maaasahan.” Ang “labi” rito ay tumutukoy sa pagsasalita o sa kakayahang magsalita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “paghatol,” “pang-unawa,” o “pagpapasiya” ang “pagkilatis.” Ang “matatanda” ay maaari ring tumukoy sa mga nakatatandang tao o sa mga elder.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: inaalisan
  rationale: Ang Hiphil participle ay nagpapahayag ng pag-aalis o pagkakait. Likas sa Filipino ang hulma na “inaalisan ... ng” para sa unang sugnay.
- source_word: שָׂפָה
  choice: kakayahang magsalita
  rationale: Literal itong “labi,” ngunit dito ay metonimiya para sa pagsasalita o kakayahang magsalita. Nililinaw ng salin ang idyomatikong diwa nang hindi ito ginagawang tiyak na “karunungan” o “husay sa panghihikayat.”
- source_word: לְנֶאֱמָנִים
  choice: ang mga pinagkakatiwalaan
  rationale: Maaaring tumukoy ang נֶאֱמָנִים sa mga tapat, maaasahan, o pinagkakatiwalaan. Pinananatili ng “mga pinagkakatiwalaan” ang aspektong panlipunan at pasibo ng katawagan.
- source_word: טַעַם
  choice: wastong pagpapasiya
  rationale: Bagaman literal na “lasa,” ang salita ay matalinghagang tumutukoy sa matinong paghatol, pang-unawa, o pagkilatis. Ang “wastong pagpapasiya” ay natural sa konteksto ng karunungan.
- source_word: זְקֵנִים
  choice: matatanda
  rationale: Maaaring mangahulugan ng matatandang tao o mga elder na may kinikilalang katayuan. Ang “matatanda” ay hindi labis na nagtatakda ng isang pormal na tungkulin; binabanggit sa talababa ang alternatibo.
- source_word: יִקָּח
  choice: inaalis
  rationale: Karaniwang nangangahulugang “kumuha,” ngunit sa paralelismong ito ay malinaw ang diwang pagkakait o pag-aalis. Ang kasalukuyang aspektong “inaalis” ay umaayon sa participial na unang sugnay at sa pangkalahatang paglalarawan.
