translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang magkaparis na “inaalisan” at “inaalis” upang mapanatili ang paralelismo, habang ang mga talababa ay nag-iingat sa literal na larawan at tunay na lawak ng mga salitang Hebreo.
