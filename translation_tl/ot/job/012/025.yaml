  yaml_path: translation/ot/job/012/025.yaml
  text: They grope in darkness[a], without light; he makes them stagger like a drunkard.
translation:
  language: tl
  text: Kumakapa sila sa dilim, walang liwanag; pinapasuray-suray[a] niya sila gaya ng isang lasing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinapagala niya sila.” Ang pandiwang Hebreo ay maaaring mangahulugang magpagala o maligaw; sa paghahambing sa isang lasing, ipinahihiwatig dito ang pasuray-suray at litó na pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַשְׁשׁוּ
  choice: Kumakapa sila
  rationale: Ang Piel na anyo ng משש ay tumutukoy sa pagkapa upang makahanap o makakilos kapag hindi makakita. Likas at malinaw sa modernong Tagalog ang “kumakapa.”
- source_word: חֹשֶׁךְ
  choice: sa dilim
  rationale: Karaniwang kahulugan ng חֹשֶׁךְ ang “dilim,” na maaaring literal o matalinghaga nang hindi nililimitahan ang larawan.
- source_word: וְלֹא אוֹר
  choice: na walang liwanag
  rationale: Bagaman literal na “at walang liwanag,” natural na iniuugnay sa Tagalog ang parirala sa “dilim” bilang “dilim na walang liwanag,” habang pinananatili ang mariing kawalan ng liwanag.
- source_word: וַיַּתְעֵם
  choice: pinasusuray niya sila
  rationale: 'Ang Hiphil ng תעה ay causative: pinangyayari niyang maligaw o gumala sila. Dahil inihahambing sila sa lasing, ang “pinasusuray” ang natural na naglalarawan sa kanilang litó at hindi matatag na pagkilos, samantalang inilalahad sa talababa ang leksikal na alternatibo.'
- source_word: ־ם
  choice: sila
  rationale: Ang hulaping panghalip na ikatlong panauhang panlalaking maramihan ang layon ng pandiwa at tumutukoy sa mga taong binabanggit sa konteksto.
- source_word: כַּשִּׁכּוֹר
  choice: gaya ng isang lasing
  rationale: Ang salita ay tumutukoy sa isang taong lango sa alak. Ang “isang lasing” ay tuwiran, natural, at hindi labis na kolokyal sa modernong Tagalog.
theological_decisions:
- issue: Di-hayag na simuno ng וַיַּתְעֵם
  choice: pinasusuray niya sila
  alternative: sumusuray sila
  rationale: Ang pandiwa ay ikatlong panauhang panlalaking isahan na may layong maramihan, kaya may di-hayag na isahang simuno—sa mas malawak na konteksto, ang Diyos. Pinananatili ng “niya” ang gramatika at ang diwa na siya ang nagpaparanas nito sa kanila.
- issue: Saklaw ng larawang “dilim na walang liwanag”
  choice: panatilihing bukas sa literal at matalinghagang pakahulugan
  alternative: tukuying tahasang kawalan ng karunungan o patnubay
  rationale: Hindi tahasang nililinaw ng Hebreo kung literal o matalinghaga ang dilim. Ang tuwirang larawan ay nagpapanatili sa tunay na lawak at tensiyon ng pahayag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kumakapa,” “pinasusuray,” at “isang lasing” upang manatiling matingkad ang magkatugmang larawan ng kawalan ng liwanag at hindi matatag na pagkilos. Inilipat ang talababa sa pandiwang “pinasusuray,” sapagkat doon nauukol ang leksikal na alternatibo.
