base_translation:
  language: en
  yaml_path: translation/ot/job/012/015.yaml
  text: Look[a], if he holds back the waters, they dry up; if he sends them out, they overturn the earth.
translation:
  language: tl
  text: Masdan[a], kapag pinigil niya ang tubig, natutuyo ito; kapag pinakawalan niya ito, binabaligtad nito ang daigdig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tingnan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tingnan ninyo
  rationale: Panawag-pansin ito na nagpapakilala ng mariin at malinaw na paglalarawan. Likas ito sa makabagong Filipino at pinananatili ang diin ng Hebreo.
- source_word: יַעְצֹר בַּמַּיִם
  choice: pinigil niya ang tubig
  rationale: Ang עצר kasama ng tubig ay tumutukoy sa pagpigil o paghadlang dito. Ang 'pinigil' ay tuwiran at natural sa Filipino.
- source_word: וְיִבָשׁוּ
  choice: natutuyo ang lahat
  rationale: Pangmaramihan ang pandiwa ngunit walang hayag na simuno. Sa konteksto, malamang na tumutukoy ito sa mga pook o bagay na natutuyo kapag pinipigil ang tubig; iniiwasang gawing tubig mismo ang natutuyo.
- source_word: וִישַׁלְּחֵם
  choice: kapag pinakawalan niya ito
  rationale: Ang hulaping panghalip ay pinakanatural na tumutukoy sa naunang tubig. Ang 'pinakawalan' ay nagpapahayag ng pag-aalis ng pagpigil, at ang 'kapag' ay nagpapanatili ng paralelismong kondisyonal.
- source_word: וְיַהַפְכוּ
  choice: binabaligtad nito
  rationale: Ang הפך ay naglalarawan ng marahas na pagbaligtad o pagwasak. Pinananatili ng 'binabaligtad' ang matingkad na larawan nang hindi nililimitahan ito sa isang tiyak na baha.
- source_word: אָרֶץ
  choice: daigdig
  rationale: Maaaring mangahulugang 'lupain' o 'daigdig' ang אֶרֶץ. Ang 'daigdig' ay angkop sa malawak at kosmikong paglalarawan ng kapangyarihan ng Diyos sa talatang ito.
theological_decisions:
- issue: Saklaw ng אֶרֶץ sa makatang pahayag tungkol sa kapangyarihan ng Diyos
  choice: daigdig
  alternative: lupain
  rationale: Ipinakikita ng magkapares na larawan ang malawak na kapangyarihan ng Diyos sa tubig at sa tuyong bahagi ng mundo. Pinananatili ng 'daigdig' ang posibleng pangkalahatang saklaw nang hindi ito tahasang inuugnay sa isang partikular na salaysay ng baha.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'Tingnan ninyo' bilang likas na panawag-pansin, at pinanatili ang masiglang paralelismo ng dalawang sugnay. Ang 'ang lahat' ay nagsasaad ng di-tiyak na pangmaramihang simuno ng וְיִבָשׁוּ nang hindi ipinapalagay na ang tubig mismo ang natutuyo.
