  naturalness: Mas likas at mas tuwiran sa modernong Filipino ang “Masdan” bilang panawag-pansin kaysa “Tingnan ninyo,” na nagdaragdag ng pangmaramihang kausap na wala sa pinagmulan. Ang paggamit ng “tubig” bilang mass noun ay likas sa Filipino kahit plural ang מים sa Hebreo.
  terminology: Ang “pigilan,” “pakawalan,” at “daigdig” ay angkop sa matayog ngunit makabagong rehistro. Ang “daigdig” ay lehitimong pagpili para sa אָרֶץ; pinananatili ng talababa ang “lupain” bilang posibleng alternatibo.
