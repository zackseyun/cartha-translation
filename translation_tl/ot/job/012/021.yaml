  text: שׁוֹפֵ֣ךְ בּ֭וּז עַל נְדִיבִ֑ים וּ/מְזִ֖יחַ אֲפִיקִ֣ים רִפָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/021.yaml
  text: He pours contempt on nobles[b][a], and loosens the belt of the strong.
translation:
  language: tl
  text: Ibinubuhos niya ang paghamak sa mga maharlika, at niluluwagan niya ang sinturon[a] ng mga makapangyarihan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ipinahihiwatig ng larawan ang pag-aalis ng lakas, kahandaan, o awtoridad.
    reason: cultural_note
  - marker: b
    text: Maaari ring “mga malalakas” o “mga dakila sa kapangyarihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹפֵךְ
  choice: ibinubuhos
  rationale: Pinananatili nito ang matingkad na larawang ‘pagbubuhos’ at likas itong iugnay sa ‘paghamak’ sa Filipino.
- source_word: בּוּז
  choice: paghamak
  rationale: Ipinahahayag nito ang matinding pagtingin sa iba bilang mababa at ang pampublikong pagpapahiya na angkop sa konteksto.
- source_word: נְדִיבִים
  choice: mga maharlika
  rationale: Sa konteksto ng pagbabaligtad ng katayuan sa lipunan, tumutukoy ito sa mga taong may mataas o marangal na katayuan; hindi ito nilimitahan sa mga prinsipe lamang.
- source_word: מְזִיחַ
  choice: sinturon
  rationale: Ang salita ay tumutukoy sa pamigkis o sinturong ginagamit sa paghahanda at pagkilos; ‘sinturon’ ang malinaw at makabagong katumbas.
- source_word: אֲפִיקִים
  choice: mga makapangyarihan
  rationale: Dito ay tumutukoy ito sa mga taong malakas o makapangyarihan at kaagapay ng ‘mga maharlika’ sa unang linya.
- source_word: רִפָּה
  choice: niluluwagan
  rationale: Tuwirang pinananatili nito ang kahulugang pagpapaluwag o pagpapalambot at ang kongkretong larawan sa Hebreo.
theological_decisions:
- issue: Matalinghagang larawan ng pagpapahiya at pag-aalis ng kapangyarihan ng Diyos
  choice: Panatilihin ang ‘niluluwagan niya ang sinturon’ sa pangunahing teksto.
  alternative: Inaalisan niya ng lakas ang mga makapangyarihan.
  rationale: Ang kongkretong larawan ay maaaring magpahiwatig ng pagkawala ng lakas, kahandaan, o awtoridad. Ang pagpapanatili nito ay umiiwas sa paglilimita sa talinghaga sa iisang paliwanag, gaya ng pag-aalis lamang ng sandata.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang paralelismo at kongkretong talinghaga ng tulang Hebreo; iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
