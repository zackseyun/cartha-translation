base_translation:
  language: en
  yaml_path: translation/ot/job/012/023.yaml
  text: He makes nations great[a], and he destroys them; he enlarges nations, and he leads them away.
translation:
  language: tl
  text: Pinalalaki niya ang mga bansa, at nililipol niya ang mga ito; pinalalawak niya ang mga bansa, at inaakay niya ang mga ito palayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Pinalalawak niya ang mga bansa, at pinapatnubayan niya ang mga ito.” Maaaring unawain ang mga pandiwang Hebreo bilang pagpapalawak na sinusundan ng paggabay; ang pangunahing teksto ay sumasalamin sa malamang na pagbabaligtad sa paralelismo ayon sa konteksto.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂגִּיא
  choice: Pinalalaki
  rationale: Ipinahahayag ng Hiphil na participle ng שׂגא ang pagpapalaki o pagpaparami. Likas sa Filipino ang “pinalalaki” at pinananatili nito ang causative na diwa nang hindi nililimitahan sa kasaganaan.
- source_word: לַגּוֹיִם
  choice: ang mga bansa
  rationale: Ang גּוֹיִם dito ay tumutukoy sa mga bansa o bayang pampolitika sa pangkalahatan, hindi partikular sa mga di-Israelita.
- source_word: וַיְאַבְּדֵם
  choice: nililipol niya ang mga ito
  rationale: Ang anyo mula sa אבד ay nagsasaad ng pagpapahamak o pagwasak. Ang “nililipol” ay maigsi, marangal, at angkop na katapat ng pagpapalaki sa unang taludtod.
- source_word: שֹׁטֵחַ
  choice: pinalalawak niya
  rationale: Ang participle mula sa שטח ay may larawan ng pag-uunat o pagpapalawak. Kapag bansa ang layon, natural na ipinahihiwatig nito ang paglawak ng sakop o impluwensiya.
- source_word: וַיַּנְחֵם
  choice: inaakay niya ang mga ito palayo
  rationale: Karaniwang nangangahulugan ang נחה na umakay o pumatnubay. Ang “inaakay…palayo” ay nagpapanatili sa ideya ng paggabay ngunit ipinakikita rin ang galaw na malamang na kabaligtaran ng naunang pagpapalawak.
theological_decisions:
- issue: Ang direksiyon ng pagkilos ng mga bansa sa ikalawang hati
  choice: Inilalarawan ang Diyos na nagpapalawak sa mga bansa at pagkatapos ay umaakay sa kanila palayo.
  alternative: Pinalalawak niya ang mga bansa at pinapatnubayan sila.
  rationale: Binibigyang-diin ng konteksto ang kapangyarihan ng Diyos sa pag-angat at pagbagsak ng mga bansa. Maaaring positibo ang נחה, ngunit ang paralelismo sa paglipol ay nagpapahintulot sa diwang pag-aalis; pinananatili ng salin at talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga bansa” sa karaniwang pampolitikang kahulugan at iniwasang gawing tahasang mabuti o mapagkalinga ang αng pag-akay, sapagkat malabo ang konteksto.
