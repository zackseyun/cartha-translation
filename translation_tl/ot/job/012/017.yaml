  text: מוֹלִ֣יךְ יוֹעֲצִ֣ים שׁוֹלָ֑ל וְֽ/שֹׁפְטִ֥ים יְהוֹלֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/017.yaml
  text: He leads counselors away stripped[a], and he makes judges foolish.
translation:
  language: tl
  text: Inilalayo niyang nasamsaman ang mga tagapayo, at ginagawa niyang hangal ang mga hukom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: inaakay
  rationale: Ang Hiphil na anyong participle ng הלך ay nagsasaad ng pagpapayaon o pag-akay. Likas sa Tagalog ang “inaakay” at napapanatili nito ang larawan ng pagdadala sa mga bihag.
- source_word: יוֹעֲצִים
  choice: mga tagapayo
  rationale: Tumutukoy ito sa mga taong nagbibigay ng payo; malinaw at pangkaraniwan sa makabagong Tagalog ang “mga tagapayo.”
- source_word: שׁוֹלָל
  choice: hubad
  rationale: Maaaring ilarawan ng salita ang taong hinubaran o sinamsaman habang dinadalang bihag. Pinananatili ng “hubad” ang matingkad na larawan ng kahihiyan, samantalang inilalahad sa talababa ang mas malawak na diwa ng pagkakasamsam.
- source_word: שֹׁפְטִים
  choice: mga hukom
  rationale: Ito ang tuwirang katumbas ng mga taong humahatol, at pinananatili ang pagkakatulad nila sa mga tagapayo bilang mga pinuno ng lipunan.
- source_word: יְהוֹלֵל
  choice: ginagawa niyang mangmang
  rationale: 'Ang Piel na pandiwa ay causative: ginagawa niyang hangal, mangmang, o hindi makapag-isip nang matino ang mga hukom. Malinaw na ipinahahayag ng salin ang causative na diwa.'
theological_decisions:
- issue: Di-hayag na simuno ng talata
  choice: “niyang,” na tumutukoy sa Diyos
  alternative: Ulitin ang pangalang “Diyos” bilang simuno
  rationale: Sa nakapaligid na konteksto, ang Diyos ang gumagawa ng mga kilos na ito. Sapat ang panghalip sa Tagalog at hindi na nagdaragdag ng pangalang wala sa mismong talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “hubad” upang mapanatili ang konkretong larawang Hebreo, na nililinaw ng talababa dahil maaari ring idiin ng salita ang pagkakasamsam at pagkawala ng ari-arian.
