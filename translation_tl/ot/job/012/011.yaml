lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Nagpapakilala ito ng retorikal na tanong na umaasang sasang-ayon ang kausap; likas at tuwiran ito sa modernong Tagalog.
- source_word: אֹזֶן
  choice: tainga
  rationale: Pinananatili ang literal na bahagi ng katawan at ang larawang tumutukoy sa pakikinig at pagkilatis.
- source_word: מִלִּין
  choice: mga salita
  rationale: Tuwirang katumbas ng maramihang pangngalan; maaari rin itong tumukoy sa pananalita.
- source_word: תִּבְחָן
  choice: sinusubok
  rationale: Ipinahahayag ang pagsusuri o pagkilatis at pinananatili ang pagtutulad sa pagtikim.
- source_word: חֵךְ
  choice: panlasa
  rationale: Bagaman literal na 'ngalangala,' ang 'panlasa' ang natural na tawag sa kakayahang lumasa sa modernong Tagalog at pinananatili ang pandamang kaagapay ng tainga.
- source_word: אֹכֶל
  choice: pagkain
  rationale: Karaniwan at kongkretong katumbas.
- source_word: יִטְעַם
  choice: '[elliptical] gaya ng panlasa sa pagkain'
  rationale: Ang pandiwang 'tumikim/lumasap' ay likas na nauunawaan sa pinaikling paralelismong Tagalog; iniiwasan nito ang alanganing 'nilalasahan ng panlasa.'
- source_word: לוֹ
  choice: hindi tahasang isinalin
  rationale: Ang panghalip ay idiomatiko at tumutukoy sa sariling pagkilos ng ngalangala; ang tahasang 'para sa sarili nito' ay hindi natural sa Tagalog at hindi kailangan upang maipahayag ang diwa.
