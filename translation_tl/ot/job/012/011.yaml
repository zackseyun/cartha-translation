translation:
  language: tl
  text: Hindi ba sinusubok ng tainga ang mga salita[a], kung paanong nilalasahan ng ngalangala ang pagkain?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi ba sinusuri ng tainga ang pananalita, kung paanong nilalasahan ng ngalangala ang pagkain?”
