  text: But even a mountain falling wears away[b][a], and a rock is moved from its place.
translation:
  language: tl
  text: Ngunit maging ang bumabagsak na bundok ay nauubos[a], at ang malaking bato ay naaalis sa kinalalagyan nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nalalanta” o “kumukupas.” Ito ang mas karaniwang diwa ng pandiwa, na matalinghagang ginamit dito para sa isang bundok.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nalilipat” o “inililipat mula sa lugar nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Ngunit maging
  rationale: Pinagsasama nito ang matinding pagsalungat ng וְאוּלָם at ang diin na maging ang tila di-natitinag na bundok ay naglalaho.
- source_word: הַר נוֹפֵל
  choice: ang bumabagsak na bundok
  rationale: Tuwirang pinananatili ang larawan ng bundok at ang Qal participle na נוֹפֵל bilang nagpapatuloy o matingkad na pagkilos, nang hindi ipinapalagay kung biglaan o unti-unti ang pagbagsak.
- source_word: יִבּוֹל
  choice: nauubos
  rationale: Karaniwang tumutukoy ang pandiwa sa pagkalanta o pagkupas, ngunit matalinghaga itong inilalapat dito sa bundok. Ang “nauubos” ay likas sa Filipino para sa unti-unting pagkawala o pagkasira ng bundok at hindi ito nililimitahan sa iisang biglaang pagguho.
- source_word: וְצוּר
  choice: at ang malaking bato
  rationale: Maaaring tumukoy ang צוּר sa bato, malaking tipak ng bato, bangin, o batuhan. Ang “malaking bato” ay malinaw at natural na kaagapay ng “bundok” sa paralelismong patula.
- source_word: יֶעְתַּק
  choice: naaalis
  rationale: Ipinahahayag nito ang pagkalipat o pagkakatanggal mula sa dating lugar nang hindi tahasang tinutukoy kung sino o ano ang sanhi.
- source_word: מִמְּקֹמוֹ
  choice: sa kinalalagyan nito
  rationale: Likas na katumbas ito ng “mula sa lugar nito” sa Filipino at pinananatili ang larawan ng isang bagay na dating matatag sa puwesto.
