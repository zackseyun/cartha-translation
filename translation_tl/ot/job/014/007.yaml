  text: 'For there is hope for a tree: if it is cut down[a], it will sprout again[b], and its shoot will not cease.'
translation:
  language: tl
  text: 'Sapagkat may pag-asa para sa isang puno: kung ito’y maputol, muli itong sisibol[a], at ang murang usbong nito[b] ay hindi magwawakas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “muli itong tutubo” o “magpapanibago ito.” Ang pandiwang Hebreo ay maaaring magpahiwatig ng pagpapanibago; sa larawan ng puno, tumutukoy ito sa panibagong pagsibol.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sariwang usbong nito” o “supling nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o sanhi na inihaharap ng talata kaugnay ng naunang pahayag.
- source_word: יֵשׁ לָעֵץ תִּקְוָה
  choice: may pag-asa para sa isang puno
  rationale: Likas na ipinahahayag sa Filipino ang eksistensiyal na konstruksyon, habang ang “isang puno” ay nagpapakita ng pangkalahatan at mapanghalimbawang diwa.
- source_word: אִם יִכָּרֵת
  choice: kung ito ay putulin
  rationale: Tuwirang pinananatili ang kondisyunal na אִם at ang balintiyak na anyo ng pandiwa.
- source_word: וְעוֹד יַחֲלִיף
  choice: muli itong sisibol
  rationale: Sa konteksto ng pinutol na puno, ang pandiwa ay tumutukoy sa panibagong pagtubo; malinaw at natural na inilalarawan ito ng “sisibol.”
- source_word: וְיֹנַקְתּוֹ
  choice: ang murang usbong nito
  rationale: Ang יֹנֶקֶת ay sariwa o murang usbong na tumutubo mula sa puno; pinananatili ng salin ang kongkretong larawang botanikal.
- source_word: לֹא תֶחְדָּל
  choice: ay hindi titigil sa paglago
  rationale: Ang literal na “hindi titigil” ay nangangailangan ng likas na pandagdag sa Filipino; ang “sa paglago” ay ginagawang malinaw ang ipinahihiwatig na patuloy na buhay ng usbong.
