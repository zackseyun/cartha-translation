  source_fidelity: 'Tumpak ang pangunahing larawan at lohika ng Hebreo: may pag-asa ang puno kahit maputol sapagkat muli itong sisibol at hindi magwawakas ang paglitaw ng bago nitong usbong. Gayunman, ang “kung ito ay putulin” ay hindi ang pinakanatural na anyong Filipino para sa kondisyunal na balintiyak na pandiwa.'
  naturalness: Mas natural at malinaw sa makabagong Filipino ang “kung ito’y maputol.” Ang “hindi titigil sa paglago” ay katanggap-tanggap ngunit nagdaragdag ng aspektong “paglago” na hindi tahasang nasa Hebreo; ang “ay hindi magwawakas” ay mas malapit sa “will not cease” at nananatiling patula.
  terminology: Ang “usbong” ay angkop para sa יֹנַקְתּוֹ. Ang “murang” ay maaaring panatilihin upang ipakita ang sariwa o malambot na katangian ng usbong. Walang usaping teolohikal na nangangailangan ng pagbabago.
