  yaml_path: translation/ot/job/014/010.yaml
  text: But a man dies and is laid low[a]; a human being expires[c][b], and where is he?
translation:
  language: tl
  text: Ngunit ang lalaki ay namamatay at nanghihina[a]; ang tao ay nalalagutan ng hininga[b], at nasaan siya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nawawalan ng lakas.”
    reason: lexical_alternative
  - marker: b
    text: 'Magkaibang salita ang ginamit sa Hebreo: גבר para sa “lalaki” at אדם para sa “tao.” Magkapantay ang mga ito rito at binibigyang-diin ang pagiging mortal ng sangkatauhan.'
    reason: cultural_note
lexical_decisions:
- source_word: גֶּבֶר
  choice: ang lalaki
  rationale: Karaniwang tumutukoy ito sa isang lalaking nasa hustong gulang at maaari ring magpahiwatig ng lakas. Pinananatili ng “lalaki” ang anyong panlalaki at ang kaibahan nito sa mas pangkalahatang אָדָם nang hindi idinaragdag ang di-tiyak na “mandirigma” o “malakas na lalaki.”
- source_word: יָמוּת
  choice: namamatay
  rationale: Ang di-ganap na pandiwa ay nagsasaad dito ng pangkalahatang katotohanan tungkol sa tao, kaya ang pangkasalukuyang “namamatay” angkop sa kasabihang diwa ng taludtod.
- source_word: וַיֶּחֱלָשׁ
  choice: at nanghihina
  rationale: Ang ugat na חלש ay nangangahulugang manghina o mawalan ng lakas. Ang “nanghihina” ay tuwiran at hindi nagdaragdag ng larawang wala sa Hebreo.
- source_word: וַיִּגְוַע
  choice: nalalagutan ng hininga
  rationale: Ang גוע ay tumutukoy sa pagpanaw o pagkalagot ng hininga. Pinananatili ng pariralang ito ang masiglang larawan at iniiwasang gawing payak na pag-uulit lamang ng “namamatay.”
- source_word: אָדָם
  choice: ang tao
  rationale: Dito ay pangkalahatang katawagan ito sa isang tao at kapantay ng גֶּבֶר sa paralelismo. Ang “tao” ay likas sa Filipino at pinananatili ang pagkakaiba ng dalawang salitang Hebreo.
- source_word: וְאַיּוֹ
  choice: at nasaan siya?
  rationale: Tuwirang pinananatili nito ang tanong tungkol sa kinaroroonan ng taong namatay at ang pang-ugnay na וְ.
theological_decisions:
- issue: Ang ipinahihiwatig ng tanong tungkol sa kalagayan ng tao pagkamatay
  choice: 'Pinanatili bilang bukas na retorikal na tanong: “at nasaan siya?”'
  alternative: Ipaliwanag bilang “wala na siya” o tukuyin ang isang tiyak na kalagayan pagkatapos ng kamatayan
  rationale: Ang Hebreo ay nagtatanong at hindi tahasang nagbibigay ng sagot sa taludtod na ito. Ang pagsasalin ay hindi dapat magpasok ng tiyak na doktrina o alisin ang tensiyong patula.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismong “lalaki … tao,” ang sunod-sunod na paglalarawan ng kamatayan, at ang bukas na retorikal na tanong. Ginamit ang “nalalagutan ng hininga” bilang likas ngunit matingkad na katumbas ng pagpanaw.
