  yaml_path: translation/ot/job/014/021.yaml
  text: His sons come to honor[a], and he does not know it; they are brought low, and he does not perceive it.
translation:
  language: tl
  text: Nagiging marangal ang kanyang mga anak na lalaki[a], ngunit hindi niya ito nalalaman; bumababa ang kanilang kalagayan, ngunit hindi niya nauunawaan ang nangyayari sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pinararangalan ang kanyang mga anak na lalaki, ngunit hindi niya nalalaman; bumababa ang kanilang kalagayan, ngunit hindi niya nauunawaan ang nangyayari sa kanila.”
    reason: Ipinahihiwatig ang alternatibong pag-unawa sa יִכְבְּדוּ bilang kalagayang napararangalan, sa halip na pagiging marangal.
lexical_decisions:
- source_word: יִכְבְּדוּ
  choice: nagkakaroon ng karangalan
  rationale: Ang Qal ng כבד dito ay tumutukoy sa pagiging marangal o pagkakaroon ng mataas na kalagayan. Pinananatili ng parirala ang resultative na diwa nang hindi ipinapalagay na ang mga anak ang nagbibigay ng parangal.
- source_word: בָנָיו
  choice: ang kanyang mga anak
  rationale: Bagaman panlalaking maramihan ang anyong Hebreo at maaari ring isaling “mga anak na lalaki,” karaniwang ginagamit ang בנים para sa mga anak o inapo ayon sa konteksto. Ang “mga anak” ay natural sa Filipino at hindi lumalampas sa saklaw ng salita.
- source_word: וְלֹא יֵדָע
  choice: ngunit hindi niya ito nalalaman
  rationale: Tuwirang ipinahahayag ng ידע ang pagkaalam. Ang “ito” ay likas na tumutukoy sa naunang kalagayan, at ang “ngunit” ay naghahayag ng malinaw na salungatan na ipinahihiwatig ng koordinasyong Hebreo.
- source_word: וְיִצְעֲרוּ
  choice: sila'y bumababa ang kalagayan
  rationale: Ang צער ay kabaligtaran dito ng pagkakaroon ng karangalan at nagpapahiwatig ng pagiging mababa, maliit, o di-mahalaga. Iniiwasan ng salin ang pasibong “ibinababa,” sapagkat aktibong Qal ang anyo at hindi tahasang binabanggit ang gumagawa.
- source_word: וְלֹא יָבִין
  choice: ngunit hindi niya ito nauunawaan
  rationale: Ang בין ay nangangahulugang umunawa o makatalos. Ang “nauunawaan” ay malinaw at likas sa modernong Filipino habang nananatiling naiiba nang bahagya sa ידע na “nalalaman.”
- source_word: לָמוֹ
  choice: ipinahihiwatig sa “ito” bilang kalagayan nila
  rationale: Ang לָמוֹ ay tumutukoy sa mga anak at maaaring unawaing “tungkol sa kanila” o “hinggil sa kanila.” Sa pangunahing teksto, likas na nasasaklaw ito ng “ito,” samantalang inilalahad sa talababa ang mas lantad na alternatibo.
theological_decisions:
- issue: Saklaw ng kaalaman ng namatay tungkol sa kalagayan ng kanyang mga anak
  choice: Isinalin lamang ang pahayag ni Job na hindi niya nalalaman o nauunawaan ang pagbabago sa kalagayan nila.
  alternative: Gawing pangkalahatang doktrina ang talata tungkol sa kamalayan ng lahat ng namatay.
  rationale: Ang talata ay patulang pahayag sa argumento ni Job. Hindi dapat dagdagan ng salin ang saklaw nito o lutasin ang mas malawak na teolohikal na tanong na hindi tahasang sinasagot ng teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nagkakaroon ng karangalan” upang ihatid ang pagbabago tungo sa marangal na kalagayan, at ang “bumababa ang kalagayan” bilang likas na katapat nito. Nasa pangunahing teksto ang marker na [a], ayon sa talababa.
