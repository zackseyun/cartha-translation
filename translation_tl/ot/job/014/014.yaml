  text: אִם יָמ֥וּת גֶּ֗בֶר הֲ/יִ֫חְיֶ֥ה כָּל יְמֵ֣י צְבָאִ֣/י אֲיַחֵ֑ל עַד בּ֝֗וֹא חֲלִיפָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/014.yaml
  text: If a man dies[a], will he live again? All the days of my hard service I would wait, until my relief comes.
translation:
  language: tl
  text: Kung mamatay ang isang lalaki, mabubuhay ba siyang muli? Sa buong panahon ng aking mabigat na paglilingkod, maghihintay ako hanggang sa dumating ang aking pagbabago.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaginhawahan” o “pagpapanibago.”
    reason: Iba-iba ang maaaring kahulugan ng Hebreong חֲלִיפָה, at mahalaga sa talata ang pagiging bukás nito.
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Pinananatili ang kondisyunal at retorikal na anyo ng tanong, sa halip na gawing tiyak na pangyayaring ipinakikilala ng “kapag.”
- source_word: יָמוּת
  choice: mamatay
  rationale: Likas na salin sa Filipino para sa pangkalahatang kondisyong ipinahahayag ng pandiwa.
- source_word: גֶּבֶר
  choice: isang lalaki
  rationale: Pinananatili ang panlalaking isahan ng Hebreo, habang gumagamit ng karaniwang makabagong pananalita.
- source_word: הֲיִחְיֶה
  choice: mabubuhay ba siyang muli?
  rationale: Ang “muli” ay hindi hiwalay na salita sa Hebreo ngunit malinaw na ipinahihiwatig ng tanong tungkol sa buhay pagkatapos mamatay.
- source_word: כָּל יְמֵי צְבָאִי
  choice: Sa lahat ng araw ng aking mabigat na paglilingkod
  rationale: Ang צבא ay maaaring tumukoy sa paglilingkod, pakikidigma, o takdang panahon. Ipinahahayag ng “mabigat na paglilingkod” ang mahirap at itinakdang kalagayan sa panaghoy ni Job nang hindi nililimitahan ito sa larawang militar.
- source_word: אֲיַחֵל
  choice: maghihintay ako
  rationale: Sa konteksto, nangingibabaw ang diwa ng matiyagang paghihintay, bagaman may kasama rin itong pag-asa.
- source_word: עַד בּוֹא
  choice: hanggang dumating
  rationale: Natural na ipinapahayag sa Filipino bilang sugnay na panahunan ang Hebreong pariralang ito.
- source_word: חֲלִיפָתִי
  choice: aking pagbabago
  rationale: 'Malawak ang saklaw ng salita: pagbabago, pagpapalit, kaginhawahan, o pagpapanibago. Ang “pagbabago” ang pinakamaingat na salin upang hindi paunang tukuyin kung ano ang hinihintay ni Job.'
theological_decisions:
- issue: Kung ang talata ay dapat magsaad nang tahasan ng muling pagkabuhay o panatilihing bukás ang tanong ni Job tungkol sa buhay matapos ang kamatayan.
  choice: Pinanatili ang retorikal na tanong at isinalin ang חֲלִיפָתִי bilang “pagbabago.”
  alternative: “Pagpapanibago,” “kaginhawahan,” o mas tahasang “muling pagkabuhay.”
  rationale: Nagpapahayag ang talata ng pag-asa na may kasamang pag-aalinlangan, hindi ng isang tuwirang dogmatikong pahayag. Hinahayaan ng salin ang posibleng diwa ng panibagong buhay nang hindi ito ipinipilit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mabigat na paglilingkod” upang maiparating ang hirap ng צבא nang hindi maging sobrang militar ang larawan; inilagay ang talababa sa “pagbabago,” ang salitang aktuwal nitong ipinapaliwanag.
