  yaml_path: translation/ot/job/014/004.yaml
  text: Who can bring a clean thing out of an unclean? No one[a].
translation:
  language: tl
  text: Sino ang makapaglalabas ng malinis mula sa marumi? Wala ni isa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sino ang makapaglalabas ng anumang malinis mula sa anumang marumi? Wala ni isa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Sino
  rationale: Tuwirang patanong na panghalip na nagpapanatili sa retorikal at mariing tanong ng Hebreo.
- source_word: יִתֵּן
  choice: ang makapaglalabas
  rationale: Bagaman ang literal na diwa ng נתן ay ‘magbigay,’ sa idyomang ito ay tumutukoy ito sa pagpapalabas o paglikha ng isang bagay mula sa iba; ipinahihiwatig ng konteksto ang kawalan ng kakayahan.
- source_word: טָהוֹר
  choice: ng malinis
  rationale: Pang-uring ginamit bilang pangngalan. Natural sa Filipino ang ‘ng malinis’ at nananatiling bukas kung bagay, tao, o kalagayan ang tinutukoy.
- source_word: מִטָּמֵא
  choice: mula sa marumi
  rationale: Pinananatili ang tuwirang pagsalungat ng malinis at marumi nang hindi nililimitahan ang kahulugan sa ritwal, moral, namamana, o eksistensiyal na karumihan.
- source_word: לֹא אֶחָד
  choice: Wala ni isa
  rationale: Malapit sa pormang Hebreo na ‘hindi isa’ at natural na ganap na pagtanggi sa Filipino.
theological_decisions:
- issue: Tinutukoy ng wika ng kalinisan at karumihan
  choice: Pangkalahatang pahayag tungkol sa kawalan ng kakayahang magpalabas ng malinis mula sa marumi, na sa konteksto ay nauukol sa kalagayan ng tao.
  alternative: Maaaring partikular itong tumukoy sa pagsilang mula sa maruruming magulang, o maging mas malawak na kawikaan tungkol sa moral o ritwal na karumihan.
  rationale: Maikli at tila kawikaan ang Hebreo. Hindi tinutukoy ng salin kung ritwal, moral, namamana, o eksistensiyal ang karumihan, kaya napapanatili ang tunay na teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang ‘makapaglalabas’ ay naghahatid ng idyomatikong puwersa ng יִתֵּן, samantalang pinananatili ng ‘malinis’ at ‘marumi’ ang maikli at sadyang malawak na pananalita ng Hebreo.
