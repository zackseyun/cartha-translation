  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲבָנִ֤ים שָׁ֥חֲקוּ מַ֗יִם תִּשְׁטֹֽף סְפִיחֶ֥י/הָ עֲפַר אָ֑רֶץ וְ/תִקְוַ֖ת אֱנ֣וֹשׁ הֶאֱבַֽדְתָּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/019.yaml
  text: Water wears away stones[a]; its torrents wash away the soil of the earth; so you destroy the hope of man.
translation:
  language: tl
  text: Pinupudpod ng tubig ang mga bato; tinatangay ng mga rumaragasang agos nito[a] ang alikabok ng lupa. Gayon mo rin winawasak ang pag-asa ng tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bihira at hindi tiyak ang salitang Hebreo na isinaling “mga rumaragasang agos nito.” Maaari rin itong mangahulugang “mga pagbuhos nito,” “mga paghugas nito,” o marahil “anumang sumisibol mula rito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שָׁחֲקוּ מַיִם
  choice: Pinupudpod ng tubig ang mga bato
  rationale: Inayos sa likas na balangkas ng Filipino ang masiksik na Hebreong parirala. Ang “pinupudpod” ay malinaw na naghahatid ng unti-unting pagkaskas at pagkasira ng bato dahil sa tubig.
- source_word: תִּשְׁטֹף
  choice: tinatangay
  rationale: Ang pandiwa ay maaaring tumukoy sa paghugas, pag-apaw, o pag-anod. Sa larawan ng pagguho ng lupa, natural at tumpak ang “tinatangay.”
- source_word: סְפִיחֶיהָ
  choice: rumaragasang agos nito
  rationale: Bihira at hindi tiyak ang salitang Hebreo. Pinili ang kahulugang tumutukoy sa buhos o agos na umaanod sa lupa, habang inilalahad sa talababa ang tunay na kawalang-katiyakan.
- source_word: עֲפַר אָרֶץ
  choice: ang lupa ng daigdig
  rationale: Literal itong “alabok/lupa ng lupain.” Ang “lupa” ang pinakanatural sa konteksto ng pag-anod, at pinananatili ng “ng daigdig” ang ikalawang pangngalan.
- source_word: וְתִקְוַת אֱנוֹשׁ
  choice: ang pag-asa ng tao
  rationale: Ang אֱנוֹשׁ ay tumutukoy sa taong mahina at mortal. Ang “tao” ay likas sa modernong Filipino at maaaring kumatawan sa sangkatauhan nang hindi ginagawang tahasang paliwanag ang pahiwatig ng mortalidad.
- source_word: הֶאֱבַדְתָּ
  choice: winawasak
  rationale: Tuwirang ipinahahayag nito na ang kinakausap—ang Diyos—ang pumupuksa sa pag-asa. Ang aspektong di-ganap ay akma sa pangkalahatang paghahambing na inilalarawan sa talata.
theological_decisions:
- issue: Tuwirang pakikipag-usap sa Diyos sa huling sugnay
  choice: Gayon mo rin winawasak ang pag-asa ng tao
  alternative: At winasak mo ang pag-asa ng tao
  rationale: Malinaw na ikalawang panauhang panlalaki isahan ang pandiwang Hebreo. Ipinakikita ng “gayon ... rin” ang paghahambing sa pagguho sa naunang mga larawan, nang hindi nilulutas o pinahihina ang mabigat na paratang ni Job.
- issue: Diwa ng אֱנוֹשׁ bilang marupok na mortal
  choice: tao
  alternative: mortal na tao
  rationale: Pinananatili ng payak na “tao” ang kinatawang isahan at natural na dignidad ng tula. Hindi idinagdag sa pangunahing teksto ang “mortal,” sapagkat bagaman ipinahihiwatig iyon ng salita, maaari itong magmukhang paliwanag na higit na tahas kaysa sa Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang kongkretong bokabularyong “pinupudpod,” “tinatangay,” at “rumaragasang agos” upang mapanatili ang matinding larawang patula ng unti-unti ngunit tiyak na pagguho. Nasa pangunahing teksto ang marker na [a].
