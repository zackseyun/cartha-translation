  naturalness: 'Kailangan ng maliit ngunit kinakailangang pagwawasto: ang pangwakas na “at alalahanin!” ay kulang sa tahasang tagaganap at layon sa isang saling modernong Tagalog. Ang “at alalahanin mo ako” ay natural, malinaw, at tumutugma sa וְתִזְכְּרֵנִי. Inayos din ang magkatambal na pandiwa bilang “itago mo ako … ikubli mo ako” upang maging malinaw ang paralelismo nang walang pagbabago ng kahulugan.'
