  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִ֤י יִתֵּ֨ן בִּ/שְׁא֬וֹל תַּצְפִּנֵ֗/נִי תַּ֭סְתִּירֵ/נִי עַד שׁ֣וּב אַפֶּ֑/ךָ תָּ֤שִׁ֥ית לִ֖/י חֹ֣ק וְ/תִזְכְּרֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/013.yaml
  text: Oh[a], that you would hide me in Sheol, that you would conceal me until your anger turns away[b], that you would appoint a time for me and remember me!
translation:
  language: tl
  text: Sana’y itago mo ako sa Sheol[a], ikubli mo ako roon hanggang sa humupa ang galit mo; sana’y takdaan mo ako ng panahon[b] at alalahanin mo ako!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa libingan” o “sa daigdig ng mga patay.” Hebreo: “Sheol.”'
    reason: lexical_alternative
  - marker: b
    text: O “magtakda ka ng hangganan para sa akin.” Ang pangngalang Hebreo ay maaaring tumukoy sa isang bagay na itinakda, itinadhana, o nilagyan ng hangganan.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Sana’y
  rationale: Ang idyomang Hebreo ay nagpapahayag ng matinding pagnanais, hindi literal na tanong na “Sino ang magbibigay?” Natural na naihahayag ito ng “Sana’y” sa makabagong Tagalog.
- source_word: בִּשְׁאוֹל
  choice: sa Sheol
  rationale: Pinanatili ang terminong Hebreo upang hindi paliitin ang kahulugan sa puntod lamang o ipakahulugan bilang impiyerno; tumutukoy ito sa daigdig o kinaroroonan ng mga patay sa pananaw ng sinaunang Hebreo.
- source_word: תַּצְפִּנֵנִי / תַּסְתִּירֵנִי
  choice: itago mo ako / ikubli
  rationale: Magkalapit ang kahulugan ng dalawang pandiwa. Ang bahagyang pagkakaiba ng pananalita ay nagpapanatili sa patulang paralelismo at pagpapatindi ng pakiusap.
- source_word: עַד שׁוּב אַפֶּךָ
  choice: hanggang sa humupa ang galit mo
  rationale: Ang שׁוּב ay may larawan ng pagtalikod o pag-urong, ngunit sa pariralang ito ang natural na Tagalog na “humupa” ay malinaw na naghahatid ng paglayo o pagtigil ng galit nang hindi sinasabing babalik ito.
- source_word: תָּשִׁית לִי חֹק
  choice: takdaan mo ako ng panahon
  rationale: Ang חֹק ay isang bagay na itinakda, itinadhana, o nilagyan ng hangganan. Sa konteksto ng paghihintay ni Job hanggang alalahanin siya ng Diyos, malamang na tumutukoy ito sa isang takdang panahon; inilalahad sa talababa ang mas malawak na posibilidad ng isang itinakdang hangganan.
- source_word: וְתִזְכְּרֵנִי
  choice: at alalahanin mo ako
  rationale: Direkta at natural itong katumbas ng Hebreo at pinananatili ang personal at relasyonal na bigat ng pag-alaala ng Diyos kay Job.
theological_decisions:
- issue: Kahulugan ng שְׁאוֹל
  choice: Sheol
  alternative: libingan; daigdig ng mga patay
  rationale: Iniiwasan ng transliterasyon ang pag-angkat ng mas huling doktrina tungkol sa impiyerno at ang pagpapakitid sa kahulugan bilang pisikal na libingan lamang. Nananatili rin ang tensiyon sa pagnanais ni Job na maitago sa kinaroroonan ng mga patay at pagkatapos ay alalahanin ng Diyos.
- issue: Kahulugan ng חֹק sa pakiusap ni Job
  choice: takdang panahon
  alternative: itinakdang hangganan o takda
  rationale: Ipinahihiwatig ng konteksto ang isang panahong itinakda kung kailan muling aalalahanin si Job, ngunit hindi lubos na nilulutas ang mas malawak na diwa ng salitang Hebreo; kaya pinanatili sa talababa ang alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “Sana’y” upang likas na maipahayag ang marubdob na pagnanais ni Job, at pinanatili ang patulang pag-uulit sa “itago” at “ikubli.”
