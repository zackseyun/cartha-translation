  yaml_path: translation/ot/job/014/012.yaml
  text: So a man lies down and does not rise[a]; until the heavens are no more[b], they will not awake or be roused from their sleep.
translation:
  language: tl
  text: Gayon din, ang isang lalaki ay humihimlay at hindi na bumabangon. Hanggang sa maglaho ang kalangitan,[a] hindi sila magigising ni mapupukaw mula sa kanilang pagkakatulog.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hanggang sa hindi na umiral ang kalangitan.” Ang idyomang Hebreo ay tumutukoy sa isang halos hindi maaabot na hangganang-panahon.
    reason: lexical_alternative
  - marker: b
    text: 'Ginagamit dito ang pagtulog bilang larawan ng kamatayan: “hindi sila magigising ni mapupukaw mula sa kanilang pagkakatulog.”'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ
  choice: Gayon din, ... ang isang lalaki
  rationale: Ang אִישׁ ay panlalaking pangngalan na tumutukoy sa “lalaki,” dito bilang kinatawan ng mortal na sangkatauhan. Ang וְ ay isinaling “Gayon din” upang likas na iugnay ang pahayag sa naunang mga larawan at ipagpatuloy ang paghahambing.
- source_word: שָׁכַב
  choice: kapag humimlay
  rationale: Ang שׁכב ay “humiga/humimlay” at dito ay matalinghagang tumutukoy sa kamatayan. Pinananatili ng “humimlay” ang larawan at ang marangal na himig nang hindi tahasang pinapalitan ng “namatay.”
- source_word: וְלֹא יָקוּם
  choice: hindi siya bumabangon
  rationale: Ang קום ay “bumangon.” Nananatili ang idyoma ng Hebreo at ang posibleng alingawngaw nito tungkol sa muling pagbangon, nang hindi nilulutas ang teolohikal na tensiyon.
- source_word: עַד בִּלְתִּי שָׁמַיִם
  choice: Hanggang sa maglaho ang kalangitan
  rationale: Ang literal na di-karaniwang parirala na “hanggang sa hindi [na] ang kalangitan” ay likas na nangangahulugang hanggang sa mawala o hindi na umiral ang kalangitan. Ipinapahayag ng “maglaho” ang napakalayong hangganang-panahon ng tula.
- source_word: לֹא יָקִיצוּ
  choice: hindi sila magigising
  rationale: Ang pandiwa ay maramihan at nangangahulugang “magising.” Sinasalamin ng “sila” ang paglipat ng Hebreo mula sa kinatawang isahan tungo sa maramihan, na tumutukoy sa mga patay sa pangkalahatan.
- source_word: וְלֹא יֵעֹרוּ
  choice: ni mapupukaw
  rationale: Ang anyong Niphal ng עור ay nagpapahiwatig ng mapukaw o magising. Ang “ni mapupukaw” ay maikli, patula, at nagpapanatili sa diwang pasibo.
- source_word: מִשְּׁנָתָם
  choice: mula sa kanilang pagkakatulog
  rationale: Ang שֵׁנָה ay “pagtulog,” dito bilang larawan ng kamatayan. Ang “kanilang” ay umaayon sa maramihang mga pandiwang nauna rito.
theological_decisions:
- issue: Kung gagawing tahasan ang larawan ng kamatayan bilang pagkalipol o pagtanggi sa muling pagkabuhay
  choice: Panatilihin ang mga larawang paghimlay, pagbangon, at paggising nang walang doktrinal na pagpapalawak
  alternative: Isaling “namatay at hindi na muling mabubuhay,” o gawing tahasang pahayag tungkol sa muling pagkabuhay
  rationale: Inilalarawan ng talata ang kamatayan mula sa pananaw ni Job sa pamamagitan ng pagtulog at paggising. Hindi dapat gawing sistematikong pahayag ang patulang pananalita tungkol sa pagkalipol o sa pangwakas na muling pagkabuhay.
- issue: Paglilipat mula sa isahang אִישׁ tungo sa maramihang mga pandiwa
  choice: Panatilihin ang “isang lalaki/siya” at pagkatapos ay “sila/kanilang”
  alternative: Gawing iisang bilang ang buong talata para sa mas makinis na gramatika
  rationale: 'Ang paglipat ng bilang ay tunay na katangian ng tekstong Hebreo: nagsisimula ito sa isang kinatawang lalaki at lumalawak sa mga patay sa pangkalahatan. Pinananatili ito sa salin.'
- issue: Kasarian ng אִישׁ
  choice: isang lalaki
  alternative: isang tao
  rationale: Ang אִישׁ ay tahasang panlalaking isahan. Bagaman kinatawan ang gamit nito, pinananatili ng salin ang anyong may kasarian ng pinagmulan.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “humimlay” at “mapupukaw” ay bahagyang patula ngunit malinaw sa karaniwang mambabasa at angkop sa panulaan ng Job. Sinadya ang paglipat mula sa isahan tungo sa maramihan upang tapat na katawanin ang Hebreo.
