translation:
  language: tl
  text: Sa amoy pa lamang ng tubig ay sisibol ito at maglalabas ito ng mga usbong, gaya ng isang tanim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at magbubunga ng ani, gaya ng isang tanim.” Ang Hebreong קָצִיר ay karaniwang nangangahulugang “ani,” ngunit sa kontekstong ito ay maaari itong tumukoy sa bagong tubo o mga usbong ng halaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵ/רֵיחַ
  choice: Sa halimuyak pa lamang ng
  rationale: Ang רֵיחַ ay ‘amoy’ o ‘halimuyak,’ at ang מִן sa konteksto ay nagpapahiwatig ng pagtugon sa bahagya o wari’y nalalapit na tubig. Ipinahahayag ng ‘pa lamang’ ang matinding puwersang patula nang hindi sinasabing tuwirang nasaling ng tubig ang puno.
- source_word: מַיִם
  choice: tubig
  rationale: Bagaman anyong maramihan sa Hebreo, karaniwan itong pangngalang di-mabilang at likas na isinasalin sa Filipino bilang ‘tubig.’
- source_word: יַפְרִחַ
  choice: sisibol ito
  rationale: Ang Hiphil ng פרח ay maaaring tumukoy sa pagsibol, pag-usbong, o pamumulaklak. Ang ‘sisibol’ ay angkop sa muling paglago ng pinutol na puno at hindi ipinapalagay na namulaklak na ito.
- source_word: וְ/עָשָׂה קָצִיר
  choice: at maglalabas ng mga usbong
  rationale: Malawak ang kahulugan ng עשה (‘gumawa,’ ‘magbunga’), samantalang karaniwang ‘ani’ ang קָצִיר ngunit sa larawang botanikal na ito ay malamang na tumutukoy sa sariwang tubo o mga usbong. Ang parirala ay likas sa Filipino at pinananatili sa talababa ang tunay na leksikal na kalabuan.
- source_word: כְּמוֹ
  choice: na gaya ng
  rationale: Tuwirang ipinahahayag ang paghahambing sa natural na Filipino.
- source_word: נָטַע
  choice: isang halaman
  rationale: Ang anyo ay tumutukoy sa bagay na itinanim o sa isang tanim. Ang ‘halaman’ ay natural at hindi nagdaragdag ng salitang ‘puno,’ bagaman puno ang paksa sa mas malawak na konteksto.
theological_decisions: []
translation_notes:
  register: Makata ngunit malinaw na modernong Filipino. Ginamit ang ‘halimuyak’ upang mapanatili ang marangal na larawang patula, at ‘pa lamang’ upang maipakita na kahit ang bahagyang paglapit o amoy ng tubig ay sapat upang buhayin ang puno. Iniwasang idagdag ang ‘puno’ sa hulí dahil hindi iyon tahasang nasa נָטַע.
