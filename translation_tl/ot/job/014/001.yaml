  source_fidelity: 'Tumpak ang pagsasalin sa Hebreo: ang “ang taong” ay angkop na isahang kinatawang pagpapahayag ng אָדָם; ang “isinilang ng babae” ay nagpapanatili sa konkretong larawan ng יְלוּד אִשָּׁה; ang “maikli ang buhay” ay natural na katumbas ng קְצַר יָמִים; at ang “puspos ng kaguluhan” ay sapat na malawak para sa וּשְׂבַע רֹגֶז.'
