id: JOB.14.1
reference: Job 14:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָ֭דָם יְל֣וּד אִשָּׁ֑ה קְצַ֥ר יָ֝מִ֗ים וּֽ/שְׂבַֽע רֹֽגֶז־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/001.yaml
  text: Man[a], born of woman[b], is short of days and full of turmoil.
translation:
  language: tl
  text: Ang taong[a] isinilang ng babae ay maikli ang buhay at puspos ng kaguluhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sangkatauhan”; ang Hebreong “tao” ay nasa isahan ngunit tumutukoy sa pangkalahatang kalagayan ng tao.
    reason: lexical_alternative
  - marker: b
    text: O “kapighatian” o “ligalig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: ang tao
  rationale: Ang pangngalan ay tumutukoy rito sa isang kinatawang tao bilang paglalarawan sa kalagayan ng buong sangkatauhan. Likas sa modernong Filipino ang “ang tao” at hindi nito nililimitahan ang pahayag sa kasariang lalaki.
- source_word: יְלוּד אִשָּׁה
  choice: isinilang ng babae
  rationale: Pinananatili nito ang konkretong participial na larawan ng isang taong nagmula sa babae, na nagdiriin sa karaniwang mortal na kalagayan ng tao.
- source_word: קְצַר יָמִים
  choice: maikli ang buhay
  rationale: Literal na “maikli sa mga araw,” ngunit ang “maikli ang buhay” ang natural at malinaw na katumbas sa Filipino habang pinananatili ang diwa ng kakaunting araw ng buhay.
- source_word: וּשְׂבַע רֹגֶז
  choice: at puspos ng kaguluhan
  rationale: Ang שְׂבַע ay “punô” o “sawi/sagana,” at ang רֹגֶז ay maaaring tumukoy sa ligalig, kaguluhan, o kapighatian. Ang “puspos ng kaguluhan” ay marangal at saklaw ang panloob na ligalig at panlabas na paghihirap.
- source_word: רֹגֶז
  choice: kaguluhan
  rationale: 'Pinananatili ng salita ang lawak ng Hebreo: isang buhay na balisa, magulo, at lipos ng suliranin, nang hindi ito nililimitahan sa emosyon lamang o sa panlabas na problema lamang.'
theological_decisions:
- issue: Pagsasalin sa pangkalahatang אָדָם
  choice: ang tao
  alternative: ang sangkatauhan; isang taong nilalang
  rationale: Naglalahad ang talata ng pangkalahatang katotohanan tungkol sa kalagayan ng tao sa anyong isahang kinatawan. Ang “ang tao” ay likas, inklusibo sa Filipino, at nagpapanatili sa isahang anyo.
- issue: Lawak ng kahulugan ng רֹגֶז
  choice: kaguluhan
  alternative: kapighatian; ligalig; problema
  rationale: Hindi tahasang nilulutas ng konteksto kung pangunahing panloob na pagkabalisa o panlabas na paghihirap ang tinutukoy. Pinananatili ng “kaguluhan,” kasama ng talababa, ang lawak at tensiyong ito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “puspos” upang mapanatili ang matinding diwa ng pagiging punô o lipos, samantalang ang ayos ng pangungusap ay nananatiling natural sa Tagalog.
