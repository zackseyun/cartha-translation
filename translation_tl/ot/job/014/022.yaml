  text: Surely his flesh on him feels pain[b][a], and his soul on him mourns.
translation:
  language: tl
  text: Tanging ang laman niya ang nasasaktan, at ang kaluluwa niya[b] ay nagdadalamhati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ngunit ang laman niya ay nasasaktan, at ang kaluluwa niya ay nagdadalamhati.” Maikli at idiomatiko ang Hebreo. Inuulit nito ang pariralang karaniwang isinasaling “sa kanya” sa dalawang sugnay; hindi ganap na tiyak ang tiyak na puwersa nito sa kontekstong ito.'
    reason: lexical_alternative
  - marker: b
    text: Ang “kaluluwa” ay maaari ring isaling “buhay,” “sarili,” o “panloob na pagkatao.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Maaaring maging panalungat, mapagdiin, o mapaghigpit ang partikulang ito. Sa pagtatapos ng pagninilay sa naunang talata, natural na ipinahihiwatig ng “Ngunit” ang pagbalik sa sariling sakit ng tao, habang inilalahad sa talababa ang ibang posibleng pagbasa.
- source_word: בְּשָׂרוֹ
  choice: ang sarili niyang laman
  rationale: Pinananatili ng “laman” ang kongkretong larawang Hebreo. Ang “sarili niyang” ay natural na Filipino para sa idiomatikong עָלָיו at itinatampok na sarili niyang dinaranas ang sakit.
- source_word: יִכְאָב
  choice: ay nakadarama ng sakit
  rationale: Ipinahahayag ng pandiwa ang pagdanas ng kirot o sakit; malinaw at natural ang pariralang ito nang hindi tinutukoy ang isang partikular na uri ng pananakit.
- source_word: נַפְשׁוֹ
  choice: ang sarili niyang kaluluwa
  rationale: Maaaring tumukoy ang נֶפֶשׁ sa kaluluwa, buhay, sarili, o panloob na pagkatao. Pinananatili ng “kaluluwa” ang ποιetikong pagtutumbas at tensiyon nito sa “laman.”
- source_word: עָלָיו
  choice: sarili niyang
  rationale: Dalawang ulit lumilitaw ang literal na “sa/ibabaw niya.” Isinasalin ito sa natural na reflexive na pananalita upang mapanatili ang diin sa sariling laman at kaluluwa nang hindi gumagawa ng alanganing parirala sa Filipino.
- source_word: תֶּאֱבָל
  choice: ay nagdadalamhati
  rationale: Tumpak nitong naihahayag ang pagluluksa o matinding dalamhati at naaangkop sa marangal na tonong patula.
theological_decisions:
- issue: Kahulugang antropolohikal ng נֶפֶשׁ katambal ng “laman”
  choice: kaluluwa
  alternative: buhay, sarili, o panloob na pagkatao
  rationale: Pinananatili ng “kaluluwa” ang ποιetikong pagkakatapat ng panlabas na sakit at panloob na dalamhati, ngunit hindi nito nilulutas bilang isang sistematikong pahayag ang kayarian ng tao. Itinatala sa talababa ang lawak ng kahulugan ng salitang Hebreo.
- issue: Kahulugan ng paulit-ulit na עָלָיו
  choice: sarili niyang
  alternative: sa kanya, nasa kanya, o para sa kanya
  rationale: Maaaring idiomatikong tumukoy ang parirala sa sariling pagdanas o pagmamalasakit ng tao. Ang reflexive na salin ay natural sa Filipino at pinananatili ang personal na diin, habang kinikilala sa talababa ang literal at malabong anyo ng Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at patula ngunit madaling maunawaan. Ginamit ang “laman” at “kaluluwa” upang mapanatili ang kongkretong paralelismo ng Hebreo; ginawang reflexive ang idiomatikong עָלָיו para sa likas na daloy sa Filipino.
