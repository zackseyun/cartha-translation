  naturalness: Mas natural at mas maigsi sa makabagong Filipino ang “Tanging ang laman niya ang nasasaktan, at ang kaluluwa niya ay nagdadalamhati.” Pinananatili nito ang matalinghagang dangal ng tula nang hindi pinipilit ang alanganing literal na katumbas ng עָלָיו.
