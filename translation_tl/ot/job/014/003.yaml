revisions:
- from: Gayunma'y sa gayong tao ay ibinubukas mo ang iyong mga mata, at dinadala mo ako sa paghatol na kasama mo.[a]
  to: Gayunman, sa gayong tao ay ibinubukas mo ang iyong mga mata, at dinadala mo ako sa paghatol, kasama mo.[a]
  rationale: Inayos ang modernong baybay at ang sintaksis ng huling parirala. Pinananatili ng ‘kasama mo’ ang literal na puwersa at legal na tensiyon ng Hebreo, samantalang ang bantas ay pumipigil sa maling pagbasa na ang ‘paghatol’ ang siyang kasama ng Diyos. Ang talababa ay hindi na naglilista ng ‘laban sa iyo’ bilang tuwirang salin ng pang-ukol, ngunit inilalarawan ang posibleng legal na implikasyon nang hindi nilulutas ang kalabuan.
