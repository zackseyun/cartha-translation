  text: Yet on such a one you open your eyes[a], and you bring me into judgment with you.
translation:
  language: tl
  text: Gayunman, sa gayong tao ay ibinubukas mo ang iyong mga mata, at dinadala mo ako sa paghatol, kasama mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain bilang “sa harap mo.” Literal na “kasama mo” ang Hebreo; maaaring tumukoy ito sa pagharap sa Diyos para sa paghatol o sa pagkakasangkot sa isang usaping legal na kinasasangkutan niya.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף
  choice: Gayunma'y
  rationale: Nagpapahayag ito ng pagtutol at pagtataka kaugnay ng kahinaan at kaiklian ng buhay ng tao sa naunang mga talata.
- source_word: עַל זֶה
  choice: sa gayong tao
  rationale: Literal itong “sa ibabaw nito/sa isang ito,” ngunit tumutukoy sa marupok na taong inilarawan sa Job 14:1–2; malinaw ang personal na reperensiya nang hindi labis na nagpapakahulugan.
- source_word: פָּקַחְתָּ עֵינֶךָ
  choice: ibinubukas mo ang iyong mga mata
  rationale: Pinananatili ang kongkretong idyomang Hebreo, na sa konteksto ay nagpapahiwatig ng pagtutuon ng pansin o masusing pagmamasid.
- source_word: וְאֹתִי
  choice: at dinadala mo ako
  rationale: Pinananatili ang personal na diin kay Job bilang siyang dinadala sa paghatol.
- source_word: תָבִיא
  choice: dinadala mo
  rationale: Ang Hiphil ng בוא ay nangangahulugang “dalhin” o “papuntahin”; ang “dinadala” ay natural at hindi kasing-interpretatibo ng “ipinapatawag.”
- source_word: בְמִשְׁפָּט
  choice: sa paghatol
  rationale: Saklaw nito ang legal na paglilitis o paghatol nang hindi inililipat ang larawan sa isang makabagong hukuman.
- source_word: עִמָּךְ
  choice: na kasama mo
  rationale: Pinananatili ang karaniwang kahulugan ng עם na “kasama,” pati ang tensiyon kung ito ba ay pagharap sa Diyos o pakikipag-usap sa kaniya sa isang usaping legal.
theological_decisions:
- issue: Ang ugnayang legal na ipinahihiwatig ng עִמָּךְ sa pakikipag-usap ni Job sa Diyos
  choice: na kasama mo
  alternative: sa harap mo; laban sa iyo
  rationale: Hindi tahasang nililinaw ng Hebreo kung si Job ay humaharap lamang sa Diyos bilang hukom o nasasangkot sa isang usaping legal na kasama o katunggali siya. Pinananatili ng salin ang sadyang tensiyong ito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang matalinghagang “ibinubukas mo ang iyong mga mata” at ang di-karaniwang “kasama mo” upang hindi mawala ang larawan at tunay na kalabuan ng Hebreo.
