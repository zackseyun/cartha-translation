  yaml_path: translation/ot/job/014/020.yaml
  text: You overpower him forever[a], and he passes on[b]; you alter his face and send him away.
translation:
  language: tl
  text: Dinaraig mo siya magpakailanman, at lumilisan siya[a]; binabago mo ang kaniyang mukha[b] at pinaaalis siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umaalis siya.” Literal na “pumupunta” ang pandiwang Hebreo; sa kontekstong ito, malamang na tumutukoy ito sa paglisan sa buhay o sa daigdig ng mga nabubuhay.
    reason: lexical_alternative
  - marker: b
    text: O “kaniyang anyo.” Ang salitang Hebreo para sa “mukha” ay maaari ring tumukoy sa panlabas na anyo o hitsura.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְקְפֵהוּ
  choice: Dinaraig mo siya
  rationale: Ang Hiphil ng תקף ay nagpapahayag ng pagiging makapangyarihan laban sa isang tao o pagdaig sa kaniya. Natural at tuwiran sa Filipino ang “dinaraig mo siya,” at pinananatili nito ang lakas ng kilos ng Diyos.
- source_word: לָנֶצַח
  choice: magpakailanman
  rationale: Ipinahihiwatig ng נֶצַח ang namamalagi o di-mapapawing tagal. Sa konteksto, binibigyang-diin nito ang pangwakas at di-mababaligtad na pagdaig sa mortal na tao.
- source_word: וַיַּהֲלֹךְ
  choice: kaya lumilisan siya
  rationale: Literal na “pumupunta/lumalakad” ang הלך, ngunit dito ay tumutukoy sa paglisan ng tao, malamang mula sa buhay o sa daigdig ng mga nabubuhay. Ang “lumilisan” ay hindi tahasang nagdaragdag ng salitang “namamatay.” Ang ugnayang resulta ng wayyiqtol matapos ang pagdaig ay natural na ipinahayag ng “kaya.”
- source_word: מְשַׁנֶּה
  choice: binabago mo
  rationale: Ang participle mula sa שנה ay may diwang “nagbabago.” Sa tuloy-tuloy na tuwirang pakikipag-usap sa Diyos, natural itong isalin bilang “binabago mo.”
- source_word: פָנָיו
  choice: ang kaniyang mukha
  rationale: Literal na “kaniyang mukha” ang פָנָיו. Pinananatili ng salin ang kongkretong larawan, habang inilalahad sa talababa ang posibleng mas malawak na kahulugang panlabas na anyo.
- source_word: וַתְּשַׁלְּחֵהוּ
  choice: at pinaaalis siya
  rationale: Ang Piel ng שלח ay maaaring mangahulugang paalisin, palayasin, o suguing umalis. Ang “pinaaalis siya” ay natural at sapat na malawak nang hindi ipinipilit kung ito ay simpleng pagpapaalis o marahas na pagtataboy.
theological_decisions:
- issue: Kung tahasang kamatayan ang kahulugan ng וַיַּהֲלֹךְ
  choice: lumilisan siya
  alternative: namamatay siya / pumapanaw siya
  rationale: Bagaman malinaw na nasa konteksto ng mortalidad ang talata, ang pandiwang Hebreo ay literal na “pumupunta/lumalakad.” Pinananatili ng “lumilisan” ang kontekstuwal na pahiwatig ng kamatayan nang hindi lubusang nilulutas ang matalinghagang kalabuan.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kaniyang” para sa pormal at malinaw na pagtukoy, at pinanatili ang paralelismong patula ng Hebreo. Ang “kaya” ay nagpapalinaw sa likas na ugnayang bunga sa unang linya nang hindi dinaragdagan ang pangunahing diwa.
