  text: Like a flower he comes forth and withers[a]; he flees like a shadow and does not remain.
translation:
  language: tl
  text: Gaya ng bulaklak, siya’y lumilitaw at nalalanta[a]; gaya ng anino, siya’y tumatakas at hindi nananatili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at napuputol”; maaaring unawain ang pandiwang Hebreo bilang pagkalanta o pagkaputol, lalo na sa larawan ng bulaklak.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִיץ
  choice: Gaya ng bulaklak
  rationale: Ang צִיץ ay bulaklak o blossom; “bulaklak” ang pinakanatural na katumbas sa makabagong Tagalog at angkop sa larawan ng kaiklian ng buhay.
- source_word: יָצָא
  choice: siya'y sumisibol
  rationale: Literal itong “lumalabas,” ngunit sa paghahambing sa bulaklak, natural na ipinahahayag ng “sumisibol” ang paglitaw nito nang hindi inaalis ang konkretong larawan.
- source_word: וַיִּמָּל
  choice: at nalalanta
  rationale: Sa konteksto ng bulaklak, maaaring tumukoy ang pandiwa sa pagkalanta o pagkaputol. Pinili ang “nalalanta” bilang natural na pangunahing pagbasa, habang iniingatan sa talababa ang tunay na alternatibo.
- source_word: וַיִּבְרַח
  choice: tumatakas
  rationale: Pinananatili ng “tumatakas” ang masiglang puwersa ng ברח at ang larawan ng mabilis na paglalaho, sa halip na gawing payak na “lumilipas.”
- source_word: כַּצֵּל
  choice: gaya ng anino
  rationale: Tuwirang katumbas ito na malinaw na naghahatid ng larawan ng panandalian at hindi matatag na pag-iral.
- source_word: וְלֹא יַעֲמוֹד
  choice: at hindi nananatili
  rationale: Bagaman literal na “hindi tumatayo,” ang עמד dito ay tumutukoy sa hindi pagpapatuloy o pananatili; malinaw at natural ito sa modernong Tagalog.
