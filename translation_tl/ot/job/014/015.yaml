  naturalness: Natural at marangal sa modernong Filipino ang “Tatawag ka sana, at sasagot ako sa iyo; pananabikan mo sana ang gawa ng iyong mga kamay.” Napananatili nito ang maigsi at magkatambal na anyong patula.
