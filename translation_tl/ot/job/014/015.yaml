  yaml_path: translation/ot/job/014/015.yaml
  text: You would call[a], and I would answer you[b]; you would long for the work of your hands.
translation:
  language: tl
  text: Tatawag ka sana, at sasagot ako sa iyo; pananabikan mo sana ang gawa ng iyong mga kamay.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mimithiin mo” o “hahangarin mo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “gawa ng iyong mga kamay” ay tumutukoy sa tao bilang nilalang na ginawa ng Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: תִּקְרָא
  choice: Tatawag ka
  rationale: Ang Qal imperfect na ikalawang panauhang panlalaki ay may modal na diwa sa konteksto ng inaasam na kalagayan ni Job. Sa Filipino, pinananatili ng hinaharap na anyo ang likas na daloy ng tula, habang ang konteksto ang nagpapahiwatig na ito ay inaasam at hindi tahasang hula.
- source_word: וְאָנֹכִי
  choice: at ... ako
  rationale: Pinananatili ang pangatnig at ang mariing pagtukoy sa unang panauhan, na nagpapakita ng tugon ni Job sa pagtawag ng Diyos.
- source_word: אֶעֱנֶךָּ
  choice: sasagot ako sa iyo
  rationale: Tuwirang katumbas ng pandiwang ‘sumagot’ na may hulaping tumutukoy sa kausap. Ang anyong hinaharap ay kaayon ng modal at inaasam na tagpo ng unang sugnay.
- source_word: לְמַעֲשֵׂה
  choice: ang gawa
  rationale: Ang מַעֲשֶׂה ay maaaring tumukoy sa gawa, ginawa, o bunga ng paggawa. Ang ‘gawa’ ay natural at nagpapanatili sa larawang pangkalikhaan kapag iniuugnay sa mga kamay ng Diyos.
- source_word: יָדֶיךָ
  choice: ng iyong mga kamay
  rationale: Pinananatili ang literal at makatang larawan ng ‘mga kamay’ sa halip na paikliin bilang ‘nilikha,’ upang manatili ang metapora ng Diyos bilang Maylikha.
- source_word: תִכְסֹף
  choice: pananabikan mo
  rationale: 'Malakas ang diwa ng כסף: manabik, maghangad, o manabik nang may pananabik. Ang ‘pananabikan’ ay malinaw at natural sa modernong Filipino at hindi nito pinahihina ang damdaming ipinahahayag ng Hebreo.'
theological_decisions:
- issue: Kung ang talata ay nagpapahayag lamang ng pagbibigay-pansin ng Diyos o ng masidhing pananabik niya sa taong kanyang nilikha
  choice: pananabikan mo ang gawa ng iyong mga kamay
  alternative: pahahalagahan mo ang gawa ng iyong mga kamay
  rationale: Ang כסף ay karaniwang nagpapahayag ng pananabik o matinding paghahangad, hindi lamang pagkilala o pagbibigay-pansin. Pinananatili nito ang tensiyon sa pag-asa ni Job na muling nanaisin ng Diyos ang nilalang niya sa halip na patuloy siyang hatulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling paralelismo at ang larawang ‘gawa ng iyong mga kamay.’ Ang modal na diwa ng mga imperfect ay ipinauubaya sa konteksto ng inaasam na kalagayan sa Job 14 upang maiwasan ang mabigat o di-likas na paulit-ulit na ‘sana.’
