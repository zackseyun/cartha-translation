  text: For now you count my steps[b][a]; you do not keep watch over my sin.
translation:
  language: tl
  text: Sapagkat ngayo’y binibilang mo ang aking mga hakbang[a]; hindi mo minamatyagan ang aking kasalanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “isa-isa mong itinatala ang aking mga hakbang.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring, “hindi mo binabantayan ang aking kasalanan” o “hindi mo inaabangan ang aking pagkakasala.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng sugnay sa konteksto nang hindi dinaragdagan ang diin.
- source_word: עַתָּה
  choice: ngayo'y
  rationale: Likas at maikling panandang temporal na tumutukoy sa kasalukuyang kalagayan, bilang kaibahan sa inaasam ni Job.
- source_word: צְעָדַי
  choice: ang aking mga hakbang
  rationale: Tuwirang pinananatili ang kongkretong larawan ng bawat kilos o paghakbang ni Job.
- source_word: תִּסְפּוֹר
  choice: binibilang mo
  rationale: Ang Qal ng ספר ay nangangahulugang bilangin; likas sa Filipino ang aspektong imperpektibo para sa kasalukuyan o nagpapatuloy na pagkilos.
- source_word: לֹא
  choice: hindi
  rationale: Karaniwang pananggi sa Filipino.
- source_word: תִשְׁמוֹר עַל
  choice: binabantayan
  rationale: Inihahatid ang diwa ng maingat na pagmamasid o pagbabantay, kasabay ng posibleng kahulugang pagmamatyag sa kasalanan.
- source_word: חַטָּאתִי
  choice: ang aking kasalanan
  rationale: Pinananatili ang isahan at ang karaniwang kahulugan nitong kasalanan, nang hindi ginagawang maramihan o mas tiyak kaysa sa Hebreo.
theological_decisions:
- issue: Kahulugan ng negatibong sugnay לֹא תִשְׁמוֹר עַל חַטָּאתִי sa konteksto
  choice: 'Isinalin bilang kasalukuyang pahayag: “hindi mo binabantayan ang aking kasalanan.”'
  alternative: “Hindi mo sana binabantayan ang aking kasalanan” o “hindi mo minamatyagan ang aking kasalanan upang hulihin ako.”
  rationale: Ang Hebreo ay may payak na imperpektibo na may pananggi. Pinananatili ng salin ang tuwirang sintaks at ang tensiyon nito sa mga kalapit na talata, sa halip na gawing tahasang pangnanais o ipaliwanag ang layunin ng pagbabantay.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “ngayo’y” para sa maayos na daloy; nananatiling malinaw sa karaniwang mambabasa. Ang “binibilang” at “binabantayan” ay nagpapanatili sa magkatambal na larawan ng masusing pagmamasid nang hindi nilulutas ang interpretibong tensiyon.
