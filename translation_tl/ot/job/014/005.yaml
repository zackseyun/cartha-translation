  text: Since his days are determined[a], the number of his months is with you; you have set his limit[b], and he cannot pass it.
translation:
  language: tl
  text: Yamang itinakda na ang kanyang mga araw[a], nasa iyo ang bilang ng kanyang mga buwan; itinakda mo ang kanyang hangganan[b], at hindi niya iyon malalampasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Kung itinakda na ang kanyang mga araw.” Maaaring magpakilala ng kondisyon ang katagang Hebreo, ngunit sa konteksto ay malamang na ibinibigay nito ang batayan ng pakiusap ni Job: “Yamang itinakda na.”'
    reason: lexical_alternative
  - marker: b
    text: O “takda niya” o “itinakdang kautusan para sa kanya.” Ang salitang Hebreo ay maaaring tumukoy sa isang nakapirming itinakdang hangganan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Yamang
  rationale: Maaaring magpakilala ang אִם ng kondisyon, ngunit sa konteksto ay mas malamang na nagbibigay ito ng batayan ng pakiusap ni Job. Likas sa modernong Tagalog ang “Yamang,” habang pinananatili sa talababa ang kondisyunal na posibilidad.
- source_word: חֲרוּצִים
  choice: itinakda na
  rationale: Ang pasibong anyo ay nagsasaad na ang mga araw ay napagpasiyahan o naitalaga na. Malinaw at likas sa Tagalog ang “itinakda na.”
- source_word: יָמָיו
  choice: ang kanyang mga araw
  rationale: Tuwirang inililipat ang pangmaramihang anyong tumutukoy sa haba ng buhay ng tao.
- source_word: מִסְפַּר חֳדָשָׁיו
  choice: ang bilang ng kanyang mga buwan
  rationale: Pinananatili ang nominal na kayarian ng Hebreo sa isang malinaw at natural na pariralang Tagalog.
- source_word: אִתָּךְ
  choice: nasa iyo
  rationale: Malapit ito sa literal na “kasama mo/nasa iyo” at naiiwasang paliitin ang diwa tungo lamang sa kaalaman o palawakin ito nang tahasan tungo sa pagmamay-ari o pagkontrol.
- source_word: חֻקּוֹ
  choice: hangganan niya
  rationale: Sa konteksto, tumutukoy ang salita sa isang nakapirming takda o hangganan ng buhay. Ang “hangganan” ay angkop din sa kasunod na pandiwang “malalampasan.”
- source_word: עָשִׂיתָ
  choice: nagtakda ka
  rationale: Bagaman karaniwang nangangahulugang “gumawa,” sa ugnayan nito sa חֻקּוֹ ay natural na ipinahahayag ng “nagtakda” ang pagtatatag ng hangganan.
- source_word: וְלֹא יַעֲבוֹר
  choice: at hindi niya iyon malalampasan
  rationale: Ang pandiwang isahan ay tumutukoy sa tao. Malinaw na ipinahahayag ng salin ang hindi niya paglagpas sa itinakdang hangganan nang hindi ginagawang tahasang modal ang anyong Hebreo.
theological_decisions:
- issue: Ang pagtatakda ng Diyos sa haba ng buhay ng tao
  choice: Inilalarawan ng talata na itinakda ang mga araw ng tao, nasa Diyos ang bilang ng kanyang mga buwan, at ang Diyos ang nagtakda ng hangganang hindi niya malalampasan.
  alternative: Maaaring unawain ang “nasa iyo” bilang pangunahing pagtukoy sa ganap na kaalaman ng Diyos sa haba ng buhay, sa halip na tahasang aktibong pagtatakda sa bawat detalye nito.
  rationale: Ang pagsasama ng “itinakda,” “nasa iyo,” at “nagtakda ka ng hangganan” ay nagpapanatili sa matibay na pahayag ng teksto tungkol sa kaalaman at kapamahalaan ng Diyos, nang hindi nagdaragdag ng mas malawak na sistemang doktrinal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kanyang” at “niya” para sa malinaw na reperensiya sa tao; pinanatili ang diretsong pakikipag-usap sa Diyos sa “iyo” at “ka.”
