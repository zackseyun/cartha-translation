  text: Look away from him[a], so that he may rest, until he fulfills his day like a hired worker.
translation:
  language: tl
  text: Iwas mo ang iyong tingin sa kanya[a] upang makapagpahinga siya, hanggang sa matapos niya ang kanyang araw gaya ng manggagawang upahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag mo muna siyang pansinin, at hayaan mo siyang tumigil, hanggang sa masiyahan siya sa kanyang araw gaya ng manggagawang upahan.” Maaaring bigyang-diin ng Hebreo ang pagtigil o pamamahinga, o ang kasiyahan sa pag-abot sa wakas ng kanyang araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁעֵה
  choice: Ilayo mo ... ang iyong tingin
  rationale: Ang pautos na pandiwa ay humihiling na alisin ng Diyos ang kanyang matamang pagtingin o pansin. Likas sa modernong Tagalog ang pariralang ito at malinaw sa konteksto.
- source_word: מֵעָלָיו
  choice: sa kanya
  rationale: Kasama ng pandiwang “ilayo,” ipinahihiwatig nito ang pag-aalis ng tingin o bigat mula sa taong tinutukoy.
- source_word: וְיֶחְדָּל
  choice: upang makapagpahinga siya
  rationale: Batayang diwa ng חדל ang paghinto o pagtigil. Sa konteksto, tumutukoy ito sa pagkakaroon ng pahinga mula sa paghihirap o masusing pagbabantay, kaya “makapagpahinga” ang natural na katumbas.
- source_word: עַד
  choice: hanggang sa
  rationale: Pinananatili ang karaniwang panandang temporal na nagtatakda sa hangganan ng hinihiling na pahinga.
- source_word: יִרְצֶה
  choice: matapos niya
  rationale: Maaaring mangahulugan ang רצה ng masiyahan, malugod, o tanggapin. Sa larawan ng upahang manggagawa at ng kanyang araw, ang “matapos niya” ay nagpapahayag ng pag-abot sa takdang wakas ng araw nang hindi ipinipilit ang emosyonal na kasiyahan.
- source_word: כְּשָׂכִיר
  choice: gaya ng isang upahang manggagawa
  rationale: Tumutukoy ang שָׂכִיר sa manggagawang inuupahan kapalit ng sahod. Malinaw at kasalukuyang Filipino ang “upahang manggagawa.”
- source_word: יוֹמוֹ
  choice: ang kanyang araw
  rationale: Literal itong “kanyang araw.” Pinananatili ang payak na anyo sapagkat ang paghahambing sa upahang manggagawa ang nagbibigay ng konteksto ng araw ng paggawa.
