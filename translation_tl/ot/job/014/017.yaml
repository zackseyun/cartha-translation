  text: My transgression is sealed up in a bag[a], and you cover over my iniquity.
translation:
  language: tl
  text: Ang pagsuway ko ay nakaselyo sa isang supot, at tinatakpan mo[a] ang aking kasamaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “pinapalitadahan mo ang aking kasamaan,” “tinatahi mo ito,” o “may ikinakabit ka sa ibabaw nito.” Mahirap tiyakin ang eksaktong diwa ng pandiwang Hebreo, at pinagtatalunan ang larawang tinutukoy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתֻם
  choice: nakatatak
  rationale: 'Ipinananatili ang pasibo at resultang diwa ng חתם: ang pagsuway ay isinara at tiniyak na manatiling nakatago sa sisidlan.'
- source_word: בִּצְרוֹר
  choice: sa isang supot
  rationale: Ang צְרוֹר ay maaaring tumukoy sa balutan, lukbutan, o supot. Ang “supot” ay natural sa makabagong Filipino at nagpapanatili sa kongkretong larawan.
- source_word: פִּשְׁעִי
  choice: ang pagsuway ko
  rationale: Ang פֶּשַׁע ay paglabag o paghihimagsik. Ang “pagsuway” ay may sapat na bigat ngunit hindi ipinipilit na hayagang paghihimagsik ang tinutukoy.
- source_word: וַתִּטְפֹּל
  choice: tinatakpan mo
  rationale: Mahirap tiyakin ang tiyak na diwa ng טפל dito; maaari itong mangahulugang magdikit, magpalitada, manahi, o magtakip. Ang “tinatakpan” ay malinaw at akma sa larawan, habang inilalahad sa talababa ang kawalang-katiyakan.
- source_word: עַל
  choice: ang
  rationale: Sa Filipino, likas nang nakapaloob sa pandiwang “tinatakpan” ang diwang paglalagay sa ibabaw, kaya hindi kailangang isalin nang hiwalay bilang “sa ibabaw ng.”
- source_word: עֲוֺנִי
  choice: aking kasamaan
  rationale: Ang עָוֹן ay maaaring tumukoy sa kasamaan, pagkakasala, o pananagutan. Pinananatili ng “kasamaan” ang moral na bigat at ang pagkakaiba nito sa פֶּשַׁע.
theological_decisions:
- issue: Lakas ng larawang ginamit sa talata
  choice: Inilalarawan ni Job na iniingatan at sinasarhan ng Diyos ang kanyang mga kasalanan upang maitala laban sa kanya, hindi na pinatatawad ang mga iyon.
  alternative: Maaaring unawain ang pagtatakip bilang pagkukubli o pag-aalis ng kasalanan at sa gayon ay pagpapatawad.
  rationale: Sa konteksto ng panaghoy ni Job, nagrereklamo siyang mahigpit na binabantayan at itinatala ng Diyos ang kanyang pagkakasala. Hindi nilalagyan ng salin ng positibong pahiwatig ng pagpapatawad ang talinghaga, ngunit pinananatili ang mismong larawan.
translation_notes:
  register: Makabago, dignipikado, at madaling maunawaang Filipino. Ginamit ang “nakatatak” at “supot” upang panatilihin ang konkretong larawang patula; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
