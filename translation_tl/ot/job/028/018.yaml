  text: Coral and crystal are not worth mentioning, and the price of wisdom is above pearls.
translation:
  language: tl
  text: Hindi na mababanggit ang korales at kristal; ang halaga ng karunungan ay higit kaysa sa mga perlas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “mga perlas” ay maaari ring tumukoy sa ibang uri ng mamahaling hiyas.
    reason: Pinananatili ang leksikal na kawalang-katiyakan ng פְּנִינִים.
lexical_decisions:
- source_word: רָאמוֹת
  choice: korales
  rationale: Sa konteksto ng mga mamahaling bagay, malamang na tumutukoy ito sa korales; gayunman, hindi tiyak ang eksaktong uri ng materyal.
- source_word: גָבִישׁ
  choice: kristal
  rationale: Karaniwang nauunawaan bilang kristal o isang malinaw at mahalagang batong mineral.
- source_word: לֹא יִזָּכֵר
  choice: hindi man lamang dapat banggitin
  rationale: Pinananatili ang literal na larawan na ang mga ito ay hindi karapat-dapat banggitin kapag inihahambing sa karunungan.
- source_word: מֶשֶׁךְ חָכְמָה
  choice: ang halaga ng karunungan
  rationale: Ang bihirang pariralang מֶשֶׁךְ ay malamang na tumutukoy sa presyo o halagang kinakailangan upang matamo ang karunungan; 'halaga' ang pinakanatural sa paghahambing ng mga kayamanan.
- source_word: פְּנִינִים
  choice: mga perlas
  rationale: Tradisyonal at angkop sa konteksto, bagaman maaari rin itong tumukoy sa ibang mamahaling hiyas.
