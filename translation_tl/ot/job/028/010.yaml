  text: He cuts channels through the rocks[b][a], and his eye sees every precious thing.
translation:
  language: tl
  text: Humuhukay siya ng mga daluyan[a] sa mga bato, at nakikita ng kanyang mata ang bawat mahalagang bagay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga batis” o “mga kanal.” Ang salitang Hebreo ay maaaring tumukoy sa mga daluyan ng tubig, ngunit sa larawan ng pagmimina rito ay malamang na mga daluyang hinukay sa bato.
    reason: lexical_alternative
  - marker: b
    text: O “bawat mamahaling bagay” o “bawat mahalagang mineral.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצּוּרוֹת
  choice: sa batuhan
  rationale: Ang צוּר ay matigas na bato o batuhan. Ang pariralang “sa batuhan” ay natural sa Filipino at pinananatili ang lokatibong diwa ng prefiks na ב nang hindi labis na tinutukoy kung ang paghuhukay ay papasok o tuluyang tatawid sa bato.
- source_word: יְאֹרִים
  choice: mga daluyan
  rationale: Karaniwang tumutukoy ang יְאֹר sa batis, kanal, o daluyan ng tubig. Sa konteksto ng pagmimina, ang “mga daluyan” ay nagpapanatili sa larawan ng mga lagusang hinukay nang hindi ito nililimitahan sa mga baras ng minahan.
- source_word: בִּקֵּעַ
  choice: humuhukay
  rationale: Ang בקע ay nangangahulugang biyakin o buksan sa pamamagitan ng paghahati. Sa konteksto ng paggawa ng mga daluyan sa bato, malinaw at natural ang “humuhukay,” bagaman bahagya itong kontekstuwal kaysa literal na “binibiyak.”
- source_word: יְקָר
  choice: mahalagang bagay
  rationale: Ang יְקָר ay anumang mahalaga, mamahalin, o pambihira. Hindi tahasang nililimitahan ng Hebreo ang kahulugan sa mineral o hiyas, kaya pinananatili ang malawak na saklaw.
- source_word: רָאֲתָה עֵינוֹ
  choice: nakikita ng kanyang mata
  rationale: Pinananatili nito ang matingkad at literal na larawang “nakita ng kanyang mata.” Ang pangkasalukuyang “nakikita” ay angkop sa patuloy na paglalarawan ng gawain ng minero sa tula.
