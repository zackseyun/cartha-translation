translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “batuhan” at “mga daluyan” upang maging natural sa karaniwang mambabasa habang pinananatili ang talinghaga ng pagmimina at ang leksikal na kaluwagan ng Hebreo.
