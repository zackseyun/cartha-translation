  yaml_path: translation/ot/job/028/026.yaml
  text: when he made a decree for the rain[a], and a path for the thunderbolt of the storms,
translation:
  language: tl
  text: nang magtakda siya ng batas para sa ulan, at ng landas para sa kidlat at mga kulog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas literal: “at ng landas para sa kidlat ng mga kulog.”'
    reason: Pinananatili ng alternatibo ang di-pangkaraniwang pagkakaugnay ng חֲזִיז קֹלוֹת, na maaaring tumukoy sa kidlat na kaugnay ng mga kulog.
lexical_decisions:
- source_word: בַּעֲשֹׂתוֹ
  choice: nang magtakda siya
  rationale: 'Ang ב na may infinitive construct at hulaping panghalip ay temporal: “nang.” Sa ugnay nito sa חֹק, natural sa Filipino ang “magtakda ... ng batas,” na naghahayag ng pagtatatag ng kaayusan.'
- source_word: לַמָּטָר
  choice: para sa ulan
  rationale: Tumutukoy ang מָטָר sa ulan at may tiyak na pantukoy; malinaw at natural ang “para sa ulan.”
- source_word: חֹק
  choice: batas
  rationale: Ang חֹק ay isang itinakdang tuntunin, kaayusan, o hangganan. Ang “batas” ay maikli at marangal, at ang pandiwang “magtakda” ay nililinaw na ito ay kaayusang itinatag ng Diyos, hindi lamang batas na pambatasan.
- source_word: וְדֶרֶךְ
  choice: at ng landas
  rationale: Literal na “daan” o “landas” ang דֶּרֶךְ. Pinananatili ng “landas” ang makatang larawan ng itinakdang daraanan ng pangyayari sa kalangitan.
- source_word: לַחֲזִיז
  choice: para sa kidlat
  rationale: Sa kontekstong meteorolohikal, ang חֲזִיז ay kislap ng kidlat o thunderbolt. “Kidlat” ang pinakanatural at tumpak na karaniwang salitang Filipino.
- source_word: קֹלוֹת
  choice: na may kasamang mga kulog
  rationale: Pangmaramihan ng קוֹל, “mga tinig/tunog,” na sa konteksto ng bagyo ay mga kulog. Ginagawang malinaw ng “may kasamang” ang ugnayan sa kidlat nang hindi ginagawang “mga bagyo” ang salitang Hebreo.
theological_decisions:
- issue: Ang kaayusan ng sangnilikha na itinakda ng Diyos
  choice: Ilarawan ang Diyos na nagtatakda ng batas para sa ulan at landas para sa kidlat at kulog.
  alternative: Palawakin ang talata upang tahasang idiin ang patuloy na pamamahala o providensiya ng Diyos sa kalikasan.
  rationale: Ipinakikita ng Hebreo ang karunungan ng Diyos sa pagtatatag ng kaayusan sa kalikasan, ngunit hindi nito tahasang inilalahad ang mas malawak na sistematikong doktrina. Pinananatili ng salin ang pahiwatig nang walang dagdag na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang makatang paralelismo ng “batas para sa ulan” at “landas para sa kidlat.” Ginamit ang “siya” alinsunod sa agarang Hebreong sugnay; nakikilala mula sa konteksto ng kabanata na Diyos ang tinutukoy.
