    rationale: Bagaman sinusubukan nitong sundan ang מקום (“lugar/pook”), ang resulta ay hindi idiomatiko sa modernong Filipino. Ang “pinagmumulan ng safiro” ay malinaw na naghahatid ng pook na pinanggagalingan o kinalalagyan ng safiro sa kontekstong pagmimina.
