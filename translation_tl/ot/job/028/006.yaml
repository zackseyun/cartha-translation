  text: Its stones are the place of sapphire[a], and it has dust of gold.
translation:
  language: tl
  text: 'Ang mga bato nito ay pinagmumulan ng safiro[a],

    at ang alabok nito ay may ginto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “lapis lazuli”; hindi tiyak kung anong sinaunang batong hiyas ang tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם
  choice: kinaroroonan ng
  rationale: Karaniwang nangangahulugang “lugar” o “kinaroroonan.” Sa konteksto ng pagmimina, likas na ipinahahayag nito na matatagpuan ang batong hiyas sa mga bato ng lupa, habang pinananatili ang konkretong larawan ng Hebreo.
- source_word: סַפִּיר
  choice: safiro
  rationale: Ito ang tradisyonal at madaling makilalang salin, bagaman hindi tiyak kung anong sinaunang batong hiyas ang eksaktong tinutukoy; kaya inilagay sa talababa ang “lapis lazuli” bilang posibilidad.
- source_word: אֲבָנֶיהָ
  choice: mga bato nito
  rationale: Ang pangngalan ay “mga bato” na may hulaping pambabaeng ikatlong panauhan, na tumutukoy sa lupa o pook ng pagmimina sa konteksto. Ang “nito” ang natural na pagtukoy sa di-personal na antecedent sa Tagalog.
- source_word: וְעַפְרֹת
  choice: at ang alabok nito
  rationale: Ang anyong maramihan ay kaugnay ng alabok o maluwag na lupa. Pinananatili ng “alabok” ang maigsi at makatang larawan nang hindi ito binibigyang-kahulugang “mineral” o “ore.”
- source_word: זָהָב
  choice: ginto
  rationale: Karaniwang katumbas ng pangalan ng mahalagang metal.
- source_word: לוֹ
  choice: nito ay may
  rationale: Literal itong “sa kaniya/rito,” ngunit sa sugnay na walang hayag na pandiwa ay ipinahihiwatig ang pag-aari o nilalaman. Natural sa Tagalog ang “may,” at ang “nito” ay tumutukoy sa lupa o pook na inilalarawan.
