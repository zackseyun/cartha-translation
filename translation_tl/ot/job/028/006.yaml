  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kinaroroonan” upang mapanatili ang larawang-lugar ng מְקוֹם, at hinati sa dalawang linya ang magkatimbang na mga sugnay ng tulang Hebreo.
